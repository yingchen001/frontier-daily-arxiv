vors extraction-index following, whereas Social Chemistry 101 (SC101) favors semantic-label following. Multiple-choice and open-ended evaluations can yield different behavioral conclusions. Thus, a steering gain under one answer encoding does not by itself identify what the intervention controls.", "arxiv_id": "2608.22985", "arxiv_url": "https://arxiv.org/abs/2608.22985", "authors": ["Zhiwei Gao", "Shaowen Peng", "Shoko Wakamiya", "Eiji Aramaki"], "brief": "\u8bba\u6587\u63d0\u51fa Cross-Encoding Steering Evaluation\uff1a\u56fa\u5b9a\u6fc0\u6d3b\u5e72\u9884\u65b9\u5411\uff0c\u540c\u65f6\u6539\u53d8\u540c\u4e00\u6d4b\u8bd5\u9879\u7684\u7b54\u6848\u7f16\u7801\uff0c\u7528\u6765\u533a\u5206\u6a21\u578b\u884c\u4e3a\u53d8\u5316\u6765\u81ea\u8bed\u4e49\u5224\u65ad\u8fd8\u662f\u7b54\u6848\u6807\u8bc6\u7b26\u517c\u5bb9\u6027\u3002\u4f5c\u8005\u5728 NormBank\u3001MNLI\u3001SC101 \u7b49\u6570\u636e\u96c6\u4e0a\u53d1\u73b0\uff0cCAA \u548c ITI \u7c7b\u65b9\u6cd5\u5e38\u4f1a\u8ddf\u968f\u62bd\u53d6\u7d22\u5f15\u800c\u975e\u771f\u5b9e\u8bed\u4e49\u6807\u7b7e\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22985", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 NormBank \u4e2d\uff0c\u91cd\u65b0\u5206\u914d A/B/C \u6807\u8bc6\u540e\uff0cCAA \u5bf9\u62bd\u53d6\u7d22\u5f15\u7684\u76ee\u6807-\u6765\u6e90\u5206\u6570\u53d8\u5316\u5927\u4e8e\u5bf9\u65b0\u8bed\u4e49\u6807\u7b7e\u7684\u53d8\u5316\uff0c\u4f5c\u8005\u79f0\u4e4b\u4e3a\u201c\u62bd\u53d6\u7d22\u5f15\u8ddf\u968f\u201d\u3002", "\u6539\u53d8\u6807\u8bc6\u7b26\u8bcd\u8868\uff08A/B/C\u3001X/Y/Z\u30011/2/3\uff09\u548c\u884c\u987a\u5e8f\u540e\uff0c\u6548\u5e94\u4e3b\u8981\u8ddf\u968f\u62bd\u53d6\u7d22\u5f15\u800c\u975e\u7b54\u6848\u884c\u4f4d\u7f6e\uff0c\u5e76\u4e14\u5728\u5339\u914d\u65b9\u5411\u8303\u6570\u540e\u4e3b\u8981\u51fa\u73b0\u5728\u8f83\u6df1\u5c42\u3002", "\u4ec5\u5305\u542b\u65b9\u5411\u5e73\u65b9\u8303\u6570 15.4% \u7684\u4f4e\u79e9\u8f93\u51fa\u654f\u611f\u5b50\u7a7a\u95f4\u4fdd\u7559\u4e86 96.3% \u7684\u8be5\u6548\u5e94\uff1bMNLI \u66f4\u504f\u62bd\u53d6\u7d22\u5f15\u8ddf\u968f\uff0cSC101 \u66f4\u504f\u8bed\u4e49\u6807\u7b7e\u8ddf\u968f\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u6fc0\u6d3b\u5e72\u9884", "\u6a21\u578b\u8bc4\u4f30", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22985v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "What Does Activation Steering Control? Attribution Across Answer Encodings and Output-Sensitive Subspaces", "tldr": "\u63ed\u793a\u6fc0\u6d3b steering \u5e38\u63a7\u5236\u7b54\u6848\u7d22\u5f15\u800c\u975e\u8bed\u4e49", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Cross-Encoding Steering Evaluation\uff1a\u56fa\u5b9a\u6fc0\u6d3b\u5e72\u9884\u65b9\u5411\uff0c\u540c\u65f6\u6539\u53d8\u540c\u4e00\u6d4b\u8bd5\u9879\u7684\u7b54\u6848\u7f16\u7801\uff0c\u7528\u6765\u533a\u5206\u6a21\u578b\u884c\u4e3a\u53d8\u5316\u6765\u81ea\u8bed\u4e49\u5224\u65ad\u8fd8\u662f\u7b54\u6848\u6807\u8bc6\u7b26\u517c\u5bb9\u6027\u3002\u4f5c\u8005\u5728 NormBank\u3001MNLI\u3001SC101 \u7b49\u6570\u636e\u96c6\u4e0a\u53d1\u73b0\uff0cCAA \u548c ITI \u7c7b\u65b9\u6cd5\u5e38\u4f1a\u8ddf\u968f\u62bd\u53d6\u7d22\u5f15\u800c\u975e\u771f\u5b9e\u8bed\u4e49\u6807\u7b7e\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u63d0\u9192\u7814\u7a76\u8005\uff1a\u5355\u4e00\u7b54\u6848\u7f16\u7801\u4e0b\u7684\u6fc0\u6d3b steering \u589e\u76ca\u5e76\u4e0d\u80fd\u8bc1\u660e\u5e72\u9884\u63a7\u5236\u4e86\u9884\u671f\u8bed\u4e49\u5c5e\u6027\uff0c\u53ef\u80fd\u53ea\u662f\u64cd\u7eb5\u4e86\u8f93\u51fa\u683c\u5f0f\u6216\u9009\u9879\u7d22\u5f15\u3002\u5b83\u4e3a\u8bc4\u4f30\u53ef\u63a7\u751f\u6210\u3001\u6a21\u578b\u7f16\u8f91\u548c mechanistic interpretability \u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u8bca\u65ad\u65b9\u6cd5\u3002"}, {"abstract": "Autonomous indoor navigation requires both semantic understanding and precise geometric control. We propose OptiSight, a hybrid framework that combines Vision-Language Model reasoning with deterministic visual servoing through a finite-state Chain-of-Thought architecture. Grounded-SAM localizes open-vocabulary targets, while camera projection geometry converts visual observations into navigation commands without requiring dense mapping. The VLM is queried only at key decision points, reducing computational overhead while geometric control handles continuous navigation. Experiments in AI Habitat demonstrate reliable zero-shot navigation across diverse indoor scenarios, including obstacle avoidance and semantic ambiguity, while operating within an 8~GB VRAM budget. The source code is available at https://github.com/avanalperen/OptiSight-Python-Multimodal-CoT-for-Visual-Reasoning.", "arxiv_id": "2608.23354", "arxiv_url": "https://arxiv.org/abs/2608.23354", "authors": ["Alperen Avan", "Jordi Sanchez-Riera"], "brief": "OptiSight \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u5ba4\u5185\u5bfc\u822a\u7684\u6df7\u5408\u6846\u67b6\uff0c\u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u8bed\u4e49\u63a8\u7406\u4e0e\u786e\u5b9a\u6027\u89c6\u89c9\u4f3a\u670d\u63a7\u5236\u7ed3\u5408\u3002\u5b83\u901a\u8fc7\u6709\u9650\u72b6\u6001 Chain-of-Thought \u5728\u5173\u952e\u51b3\u7b56\u70b9\u8c03\u7528 VLM\uff0c\u5e76\u7528\u76f8\u673a\u6295\u5f71\u51e0\u4f55\u5c06\u89c6\u89c9\u89c2\u6d4b\u76f4\u63a5\u8f6c\u4e3a\u5bfc\u822a\u6307\u4ee4\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23354", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4f7f\u7528 Grounded-SAM \u8fdb\u884c\u5f00\u653e\u8bcd\u6c47\u76ee\u6807\u5b9a\u4f4d\uff0c\u652f\u6301\u8bed\u4e49\u76ee\u6807\u548c\u6b67\u4e49\u573a\u666f\u5904\u7406", "\u4e0d\u4f9d\u8d56\u7a20\u5bc6\u5730\u56fe\uff0c\u901a\u8fc7\u76f8\u673a\u6295\u5f71\u51e0\u4f55\u5b9e\u73b0\u8fde\u7eed\u5bfc\u822a\u4e0e\u51e0\u4f55\u63a7\u5236", "\u5728 AI Habitat \u4e2d\u9a8c\u8bc1\u96f6\u6837\u672c\u5bfc\u822a\u3001\u907f\u969c\u548c\u8bed\u4e49\u6b67\u4e49\u5904\u7406\uff0c\u5e76\u53ef\u5728 8GB \u663e\u5b58\u9884\u7b97\u5185\u8fd0\u884c"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba\u5bfc\u822a", "\u89c6\u89c9\u4f3a\u670d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23354v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "OptiSight: Bridging Semantic Reasoning and Geometric Control for Embodied Navigation", "tldr": "\u7528VLM\u8bed\u4e49\u63a8\u7406\u7ed3\u5408\u89c6\u89c9\u4f3a\u670d\u5b9e\u73b0\u96f6\u6837\u672c\u5ba4\u5185\u5bfc\u822a", "upvotes": 0, "what_it_is": "OptiSight \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u5ba4\u5185\u5bfc\u822a\u7684\u6df7\u5408\u6846\u67b6\uff0c\u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u8bed\u4e49\u63a8\u7406\u4e0e\u786e\u5b9a\u6027\u89c6\u89c9\u4f3a\u670d\u63a7\u5236\u7ed3\u5408\u3002\u5b83\u901a\u8fc7\u6709\u9650\u72b6\u6001 Chain-of-Thought \u5728\u5173\u952e\u51b3\u7b56\u70b9\u8c03\u7528 VLM\uff0c\u5e76\u7528\u76f8\u673a\u6295\u5f71\u51e0\u4f55\u5c06\u89c6\u89c9\u89c2\u6d4b\u76f4\u63a5\u8f6c\u4e3a\u5bfc\u822a\u6307\u4ee4\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u9ad8\u5c42\u8bed\u4e49\u63a8\u7406\u4e0e\u4f4e\u5c42\u51e0\u4f55\u63a7\u5236\u89e3\u8026\uff0c\u51cf\u5c11\u5bf9 VLM \u7684\u9891\u7e41\u8c03\u7528\uff0c\u5728\u63d0\u5347\u53ef\u89e3\u91ca\u6027\u548c\u6548\u7387\u7684\u540c\u65f6\u589e\u5f3a\u4e86\u5177\u8eab\u5bfc\u822a\u7684\u5b9e\u7528\u6027\u3002"}, {"abstract": "Vision-language models (VLMs) can answer spatial questions, yet the mechanisms connecting object grounding to spatial reasoning remain poorly understood. It is underexplored whether spatial reasoning internally requires precise objects localization, or can bypass explicit localization through global layout cues. In this work, we investigate two representative model families, LLaVA-1.5 and Qwen2.5-VL, using a suite of mechanistic interpretability tools, including token ablation, layer-wise probing, attention knockout, and causal mediation analysis. We find that spatial relation prediction follows a staged grounding-to-reasoning process in which object-aligned tokens establish coarse target-reference anchors, while precise bounding-box boundaries are not required. Positional information becomes decodable before relation decisions emerge, and a small set of attention heads mediates the causal effects of both localization and spatial reasoning. The two tasks share early grounding-related processing but ultimately rely on partially distinct specialized pathways. Through rigorous experiments, we provide a token-, layer-, and head-level account of how VLMs transform object grounding into spatial relations, showing that knowing where objects are is not equivalent to knowing how they relate.", "arxiv_id": "2608.23074", "arxiv_url": "https://arxiv.org/abs/2608.23074", "authors": ["Xiwei Liu", "Yulong Li", "Xinlin Zhuang", "Xuhui Li", "Zhixiang Lu", "Haolin Yang", "Imran Razzak", "Yutong Xie"], "brief": "\u672c\u6587\u7528\u673a\u5236\u53ef\u89e3\u91ca\u6027\u5de5\u5177\u5206\u6790 LLaVA-1.5 \u4e0e Qwen2.5-VL \u7684\u7a7a\u95f4\u5173\u7cfb\u63a8\u7406\u673a\u5236\uff0c\u7814\u7a76\u7269\u4f53\u5b9a\u4f4d\u4e0e\u7a7a\u95f4\u63a8\u7406\u4e4b\u95f4\u7684\u5185\u90e8\u8054\u7cfb\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6a21\u578b\u5148\u5f62\u6210\u7c97\u7c92\u5ea6\u76ee\u6807-\u53c2\u7167\u7269\u951a\u70b9\uff0c\u518d\u8fdb\u884c\u5173\u7cfb\u5224\u65ad\uff0c\u4f46\u5e76\u4e0d\u9700\u8981\u7cbe\u786e\u8fb9\u754c\u6846\u7ea7\u5b9a\u4f4d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23074", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 token ablation\u3001\u9010\u5c42 probing\u3001attention knockout \u548c\u56e0\u679c\u4e2d\u4ecb\u5206\u6790\uff0c\u4ece token\u3001\u5c42\u3001\u6ce8\u610f\u529b\u5934\u591a\u4e2a\u7c92\u5ea6\u7814\u7a76 VLM \u5185\u90e8\u673a\u5236\u3002", "\u7a7a\u95f4\u4f4d\u7f6e\u4fe1\u606f\u5728\u5173\u7cfb\u51b3\u7b56\u51fa\u73b0\u524d\u5df2\u53ef\u88ab\u89e3\u7801\uff0c\u8bf4\u660e\u6a21\u578b\u5b58\u5728\u201c\u7c97\u5b9a\u4f4d\u5230\u63a8\u7406\u201d\u7684\u9636\u6bb5\u5f0f\u5904\u7406\u6d41\u7a0b\u3002", "\u5c11\u6570\u6ce8\u610f\u529b\u5934\u540c\u65f6\u4e2d\u4ecb\u5b9a\u4f4d\u4e0e\u7a7a\u95f4\u63a8\u7406\u7684\u56e0\u679c\u6548\u5e94\uff0c\u4f46\u4e24\u7c7b\u4efb\u52a1\u540e\u7eed\u4f9d\u8d56\u90e8\u5206\u4e0d\u540c\u7684\u4e13\u95e8\u901a\u8def\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7a7a\u95f4\u63a8\u7406", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23074v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Grounding Isn\u0027t Knowing: Do VLMs Need Object Localization for Spatial Reasoning?", "tldr": "VLM\u7a7a\u95f4\u63a8\u7406\u4e0d\u4f9d\u8d56\u7cbe\u786e\u6846\u5b9a\u4f4d\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u7528\u673a\u5236\u53ef\u89e3\u91ca\u6027\u5de5\u5177\u5206\u6790 LLaVA-1.5 \u4e0e Qwen2.5-VL \u7684\u7a7a\u95f4\u5173\u7cfb\u63a8\u7406\u673a\u5236\uff0c\u7814\u7a76\u7269\u4f53\u5b9a\u4f4d\u4e0e\u7a7a\u95f4\u63a8\u7406\u4e4b\u95f4\u7684\u5185\u90e8\u8054\u7cfb\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6a21\u578b\u5148\u5f62\u6210\u7c97\u7c92\u5ea6\u76ee\u6807-\u53c2\u7167\u7269\u951a\u70b9\uff0c\u518d\u8fdb\u884c\u5173\u7cfb\u5224\u65ad\uff0c\u4f46\u5e76\u4e0d\u9700\u8981\u7cbe\u786e\u8fb9\u754c\u6846\u7ea7\u5b9a\u4f4d\u3002", "why_notable": "\u8bba\u6587\u6311\u6218\u4e86\u201c\u7cbe\u786e\u7269\u4f53\u5b9a\u4f4d\u7b49\u540c\u4e8e\u7a7a\u95f4\u7406\u89e3\u201d\u7684\u76f4\u89c9\uff0c\u63ed\u793a VLM \u53ef\u901a\u8fc7\u7c97\u7565\u951a\u70b9\u548c\u5168\u5c40\u5e03\u5c40\u7ebf\u7d22\u5b8c\u6210\u7a7a\u95f4\u63a8\u7406\uff0c\u5bf9\u7406\u89e3\u591a\u6a21\u6001\u6a21\u578b\u7684\u5185\u90e8\u8868\u5f81\u4e0e\u6539\u8fdb\u7a7a\u95f4\u63a8\u7406\u80fd\u529b\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Multimodal speculative decoding accelerates vision-language models by allowing a lightweight draft model to propose candidate tokens for parallel verification by a larger target model. Existing methods typically condition the drafter on a fixed visual interface, such as a predefined visual-token budget or a static compressed representation. However, our controlled visual-budget analysis shows that visual demand varies substantially across tasks and decoding stages, which means more visual input is not always beneficial. Actually, insufficient evidence may weaken visual grounding, while excessive context adds overhead and may disrupt drafting. We propose FOVEA (Focused On-demand Visual Evidence Adaptation), a cache-friendly approach that builds a reusable visual memory and dynamically retrieves a bounded subset for a draft state. A cumulative-mass rule determines both how many and which entries are selected. The selected entries are aggregated into a visual readout and fused with the current draft hidden state through a lightweight gated residual correction. Rather than inserting visual tokens into the autoregressive context, the correction modifies only the representation passed to the language-model head. Experiments across multiple vision-language backbones and multimodal benchmarks show that FOVEA improves draft acceptance and end-to-end decoding speed, achieving up to $2.13\\times$ speedup over autoregressive decoding. These results demonstrate that state-conditioned evidence retrieval is an effective alternative to reusing a fixed visual representation throughout multimodal generation.", "arxiv_id": "2608.22883", "arxiv_url": "https://arxiv.org/abs/2608.22883", "authors": ["Hengjie Zhu", "Dayan Wu", "Zihao Zhang", "Xinze Liu", "Jingxuan Yu", "Peng Fu", "Zheng Lin", "Weiping Wang", "Ding Wang"], "brief": "\u8bba\u6587\u63d0\u51fa FOVEA\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u6d4b\u89e3\u7801\u7684\u52a8\u6001\u89c6\u89c9\u8bc1\u636e\u9002\u914d\u65b9\u6cd5\u3002\u5b83\u6784\u5efa\u53ef\u590d\u7528\u89c6\u89c9\u8bb0\u5fc6\uff0c\u5e76\u6839\u636e\u5f53\u524d\u8349\u7a3f\u72b6\u6001\u6309\u9700\u9009\u62e9\u6709\u9650\u89c6\u89c9\u4fe1\u606f\u6765\u63d0\u5347\u8349\u7a3f\u6a21\u578b\u7684\u63a5\u53d7\u7387\u4e0e\u89e3\u7801\u901f\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22883", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u4e0d\u540c\u4efb\u52a1\u4e0e\u89e3\u7801\u9636\u6bb5\u5bf9\u89c6\u89c9\u4fe1\u606f\u7684\u9700\u6c42\u5dee\u5f02\u663e\u8457\uff0c\u56fa\u5b9a\u89c6\u89c9 token \u9884\u7b97\u6216\u9759\u6001\u538b\u7f29\u8868\u793a\u5e76\u975e\u603b\u662f\u6700\u4f18", "\u901a\u8fc7\u7d2f\u8ba1\u8d28\u91cf\u89c4\u5219\u52a8\u6001\u51b3\u5b9a\u68c0\u7d22\u591a\u5c11\u89c6\u89c9\u8bb0\u5fc6\u9879\u4ee5\u53ca\u9009\u62e9\u54ea\u4e9b\u9879\uff0c\u518d\u805a\u5408\u4e3a\u89c6\u89c9\u8bfb\u51fa\u8868\u793a", "\u91c7\u7528\u8f7b\u91cf\u95e8\u63a7\u6b8b\u5dee\u6821\u6b63\uff0c\u4ec5\u4fee\u6539\u4f20\u7ed9\u8bed\u8a00\u6a21\u578b\u5934\u7684\u8868\u793a\uff0c\u4e0d\u628a\u89c6\u89c9 token \u63d2\u5165\u81ea\u56de\u5f52\u4e0a\u4e0b\u6587\uff0c\u56e0\u6b64\u66f4\u5229\u4e8e\u7f13\u5b58"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u63a8\u6d4b\u89e3\u7801", "\u6a21\u578b\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22883v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FOVEA: Focused On-Demand Visual Evidence Adaptation for Cache-Friendly Multimodal Speculative Decoding", "tldr": "\u6309\u9700\u68c0\u7d22\u89c6\u89c9\u8bc1\u636e\u52a0\u901f\u591a\u6a21\u6001\u89e3\u7801", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FOVEA\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u6d4b\u89e3\u7801\u7684\u52a8\u6001\u89c6\u89c9\u8bc1\u636e\u9002\u914d\u65b9\u6cd5\u3002\u5b83\u6784\u5efa\u53ef\u590d\u7528\u89c6\u89c9\u8bb0\u5fc6\uff0c\u5e76\u6839\u636e\u5f53\u524d\u8349\u7a3f\u72b6\u6001\u6309\u9700\u9009\u62e9\u6709\u9650\u89c6\u89c9\u4fe1\u606f\u6765\u63d0\u5347\u8349\u7a3f\u6a21\u578b\u7684\u63a5\u53d7\u7387\u4e0e\u89e3\u7801\u901f\u5ea6\u3002", "why_notable": "FOVEA \u5c06\u591a\u6a21\u6001\u63a8\u6d4b\u89e3\u7801\u4e2d\u7684\u89c6\u89c9\u6761\u4ef6\u4ece\u56fa\u5b9a\u8f93\u5165\u6539\u4e3a\u72b6\u6001\u76f8\u5173\u7684\u6309\u9700\u68c0\u7d22\uff0c\u5728\u591a\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u63d0\u5347\u8349\u7a3f\u63a5\u53d7\u7387\uff0c\u5e76\u76f8\u8f83\u81ea\u56de\u5f52\u89e3\u7801\u6700\u9ad8\u5b9e\u73b0 2.13 \u500d\u52a0\u901f\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) enables direct preference optimization for image editing through editing-specific rewards, which remain less developed due to costly triplet supervision and complex task-dependent calibration. In contrast, text-to-image (T2I) generation benefits from a mature and diverse reward ecosystem spanning semantic alignment, aesthetics, realism, glyph shape, and other visual preferences. Extending this ecosystem to image editing would substantially broaden the range of visual preferences accessible to RL-based optimization, prompting the central question: \\emph{Can We Perform Image Editing RL without Editing Rewards?} In this paper, we argue that the standard image editing dimensions have potential to be mapped to the T2I reward space: image quality can transfer directly, prompt following can be aligned through a description of the desired visual state, and reference consistency admits a coarse semantic conversion by encoding the source content to preserve. However, editing instructions specify relative changes, whereas T2I rewards require self-contained target descriptions; moreover, semantically valid captions from generic vision-language models may be incompatible with the frozen reward. Hence, we further introduce Lever-Edit, a two-stage framework that learns a reward-aligned captioner for counterfactual target descriptions, freezes it, and optimizes the editing policy solely with the transferred T2I reward. Experiments show competitive editing alignment and source preservation against editing-reward-based fine-tuning, while outperforming intuitive transfer baselines.", "arxiv_id": "2608.22780", "arxiv_url": "https://arxiv.org/abs/2608.22780", "authors": ["Qichao Ma", "Jikang Cheng", "Ling Liang", "Zhaofei Yu", "Tiejun Huang", "Renye Yan"], "brief": "\u8bba\u6587\u63d0\u51fa Lever-Edit\uff0c\u4e24\u9636\u6bb5\u6846\u67b6\u5148\u5b66\u4e60\u4e0e\u51bb\u7ed3\u5956\u52b1\u5bf9\u9f50\u7684\u53cd\u4e8b\u5b9e\u76ee\u6807\u63cf\u8ff0\u751f\u6210\u5668\uff0c\u518d\u4ec5\u7528\u6210\u719f\u7684\u6587\u751f\u56fe\u5956\u52b1\u6765\u4f18\u5316\u56fe\u50cf\u7f16\u8f91\u7b56\u7565\u3002\u5b83\u8bd5\u56fe\u628a\u56fe\u50cf\u8d28\u91cf\u3001\u63d0\u793a\u9075\u5faa\u548c\u6e90\u56fe\u4fdd\u6301\u7b49\u7f16\u8f91\u76ee\u6807\u6620\u5c04\u5230\u6587\u751f\u56fe\u5956\u52b1\u7a7a\u95f4\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22780", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u6602\u8d35\u7684\u7f16\u8f91\u4e13\u7528\u5956\u52b1\u6216\u4e09\u5143\u7ec4\u504f\u597d\u76d1\u7763\uff0c\u76f4\u63a5\u8fc1\u79fb\u8bed\u4e49\u5bf9\u9f50\u3001\u7f8e\u5b66\u3001\u771f\u5b9e\u611f\u7b49\u6587\u751f\u56fe\u5956\u52b1\u751f\u6001\u3002", "\u901a\u8fc7\u751f\u6210\u81ea\u5305\u542b\u7684\u76ee\u6807\u72b6\u6001\u63cf\u8ff0\uff0c\u89e3\u51b3\u7f16\u8f91\u6307\u4ee4\u901a\u5e38\u662f\u201c\u76f8\u5bf9\u53d8\u5316\u201d\u800c\u6587\u751f\u56fe\u5956\u52b1\u9700\u8981\u201c\u76ee\u6807\u63cf\u8ff0\u201d\u7684\u4e0d\u5339\u914d\u95ee\u9898\u3002", "\u5b9e\u9a8c\u663e\u793a\u5728\u7f16\u8f91\u5bf9\u9f50\u548c\u6e90\u56fe\u4fdd\u6301\u4e0a\u53ef\u4e0e\u57fa\u4e8e\u7f16\u8f91\u5956\u52b1\u7684\u5fae\u8c03\u7ade\u4e89\uff0c\u5e76\u4f18\u4e8e\u76f4\u63a5\u8fc1\u79fb\u7b49\u76f4\u89c9\u57fa\u7ebf\u3002"], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u5f3a\u5316\u5b66\u4e60", "\u6587\u751f\u56fe", "\u5956\u52b1\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22780v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can We Perform Online RL for Image Editing without Editing Rewards?", "tldr": "\u7528\u6587\u751f\u56fe\u5956\u52b1\u66ff\u4ee3\u56fe\u50cf\u7f16\u8f91\u5956\u52b1\u505a\u5728\u7ebfRL\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Lever-Edit\uff0c\u4e24\u9636\u6bb5\u6846\u67b6\u5148\u5b66\u4e60\u4e0e\u51bb\u7ed3\u5956\u52b1\u5bf9\u9f50\u7684\u53cd\u4e8b\u5b9e\u76ee\u6807\u63cf\u8ff0\u751f\u6210\u5668\uff0c\u518d\u4ec5\u7528\u6210\u719f\u7684\u6587\u751f\u56fe\u5956\u52b1\u6765\u4f18\u5316\u56fe\u50cf\u7f16\u8f91\u7b56\u7565\u3002\u5b83\u8bd5\u56fe\u628a\u56fe\u50cf\u8d28\u91cf\u3001\u63d0\u793a\u9075\u5faa\u548c\u6e90\u56fe\u4fdd\u6301\u7b49\u7f16\u8f91\u76ee\u6807\u6620\u5c04\u5230\u6587\u751f\u56fe\u5956\u52b1\u7a7a\u95f4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u964d\u4f4e\u4e86\u7528\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u7684\u5956\u52b1\u6784\u5efa\u6210\u672c\uff0c\u5e76\u628a\u66f4\u6210\u719f\u3001\u591a\u6837\u7684\u6587\u751f\u56fe\u504f\u597d\u5956\u52b1\u5f15\u5165\u7f16\u8f91\u4efb\u52a1\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Byte-space Action Recognition (BAR) aims to recognize human actions directly from compressed image bitstreams without any pixel decoding. By operating entirely in byte space, BAR is inherently independent of file integrity and pixel-level reconstruction, making it naturally applicable to privacy-sensitive scenarios and robust against bitstream corruption. In this paper, we propose ByteAction, a BAR foundation model that achieves accurate action recognition on corrupted image bitstreams. ByteAction follows a dual-view byte-level recognition framework. It constructs weakly and strongly corrupted bitstream views, which are augmented by Bitstream Pattern Augmentation (BPA) and encoded with a shared ByteFormer backbone. The model is optimized with both classification and corruption consistency objectives. Specifically, we propose Bitstream Pattern Augmentation (BPA), which reshapes one-dimensional byte sequences into two-dimensional byte matrix and applies region-level erasure to encourage the model to learn robust cross-region byte dependencies. We further propose a Corruption Consistency Training strategy that constrains the model to maintain stable predictions across different corruption severities through bidirectional KL divergence. Experiments on the image bitstream from Stanford40, PPMI, and PASCAL VOC 2012 Action demonstrate that ByteAction achieves state-of-the-art corruption robustness across all scenarios while maintaining competitive intact bitstream performance.", "arxiv_id": "2608.22760", "arxiv_url": "https://arxiv.org/abs/2608.22760", "authors": ["Fangcheng Li", "Zhen Yu", "Kejun Wu", "Qiong Liu", "You Yang"], "brief": "\u672c\u6587\u63d0\u51fa ByteAction\uff0c\u4e00\u79cd\u76f4\u63a5\u5728\u538b\u7f29\u56fe\u50cf\u5b57\u8282\u6d41\u4e2d\u8fdb\u884c\u4eba\u4f53\u52a8\u4f5c\u8bc6\u522b\u7684\u57fa\u7840\u6a21\u578b\uff0c\u65e0\u9700\u50cf\u7d20\u89e3\u7801\u3002\u5b83\u901a\u8fc7\u53cc\u89c6\u56fe\u5b57\u8282\u7ea7\u8bad\u7ec3\u63d0\u5347\u5bf9\u4e0d\u540c\u7a0b\u5ea6\u6bd4\u7279\u6d41\u635f\u574f\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22760", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u5f31\u635f\u574f\u4e0e\u5f3a\u635f\u574f\u4e24\u79cd\u5b57\u8282\u6d41\u89c6\u56fe\uff0c\u5e76\u4f7f\u7528\u5171\u4eab ByteFormer \u9aa8\u5e72\u8fdb\u884c\u7f16\u7801", "\u63d0\u51fa Bitstream Pattern Augmentation\uff0c\u5c06\u4e00\u7ef4\u5b57\u8282\u5e8f\u5217\u91cd\u6392\u4e3a\u4e8c\u7ef4\u5b57\u8282\u77e9\u9635\u5e76\u505a\u533a\u57df\u64e6\u9664\uff0c\u5b66\u4e60\u8de8\u533a\u57df\u5b57\u8282\u4f9d\u8d56", "\u91c7\u7528\u53cc\u5411 KL \u6563\u5ea6\u7684\u8150\u8680\u4e00\u81f4\u6027\u8bad\u7ec3\uff0c\u4f7f\u6a21\u578b\u5728\u4e0d\u540c\u635f\u574f\u5f3a\u5ea6\u4e0b\u4fdd\u6301\u7a33\u5b9a\u9884\u6d4b"], "keywords": ["\u52a8\u4f5c\u8bc6\u522b", "\u5b57\u8282\u7a7a\u95f4", "\u9c81\u68d2\u5b66\u4e60", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22760v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ByteAction: Byte-space Action Recognition Foundation Model", "tldr": "\u9762\u5411\u635f\u574f\u538b\u7f29\u5b57\u8282\u6d41\u7684\u52a8\u4f5c\u8bc6\u522b\u57fa\u5ea7\u6a21\u578b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa ByteAction\uff0c\u4e00\u79cd\u76f4\u63a5\u5728\u538b\u7f29\u56fe\u50cf\u5b57\u8282\u6d41\u4e2d\u8fdb\u884c\u4eba\u4f53\u52a8\u4f5c\u8bc6\u522b\u7684\u57fa\u7840\u6a21\u578b\uff0c\u65e0\u9700\u50cf\u7d20\u89e3\u7801\u3002\u5b83\u901a\u8fc7\u53cc\u89c6\u56fe\u5b57\u8282\u7ea7\u8bad\u7ec3\u63d0\u5347\u5bf9\u4e0d\u540c\u7a0b\u5ea6\u6bd4\u7279\u6d41\u635f\u574f\u7684\u9c81\u68d2\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u52a8\u4f5c\u8bc6\u522b\u63a8\u8fdb\u5230\u65e0\u9700\u56fe\u50cf\u91cd\u5efa\u7684\u5b57\u8282\u7a7a\u95f4\uff0c\u517c\u5177\u9690\u79c1\u53cb\u597d\u548c\u6297\u635f\u574f\u80fd\u529b\uff1b\u5728 Stanford40\u3001PPMI\u3001PASCAL VOC 2012 Action \u7b49\u6570\u636e\u4e0a\u5b9e\u73b0\u9886\u5148\u7684\u635f\u574f\u9c81\u68d2\u6027\u3002"}, {"abstract": "Narrow fine-tuning on small, domain-specific datasets can produce broad and surprising changes in model behavior-a phenomenon called weird generalization (WG). Yet, it remains unclear what features of the fine-tuning data are necessary for WG to arise. Here, we address this question by investigating a range of plausibly relevant features, including dataset size, composition, language, presentation style, and novelty relative to a model\u0027s parametric knowledge. Further, since WG evaluations rely on small question sets that assess the extent of the generalization, we also analyze how sensitive this measurement is to the set of questions used. Experiments with three open-weight models on four datasets show that the degree of WG (1) depends heavily on dataset composition and language (more than on size); (2) is greater for data familiar from pretraining than for novel data; and (3) is sensitive to the set of evaluation questions used. Collectively, these results indicate that WG is a product of quite fragile properties of both training and evaluation data. As such, we argue that WG is more plausible as an adversarial threat-requiring careful data engineering-rather than as a significant hazard inherent to routine fine-tuning.", "arxiv_id": "2608.23476", "arxiv_url": "https://arxiv.org/abs/2608.23476", "authors": ["Miriam Wanner", "Mark Dredze", "William Walden"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5c0f\u89c4\u6a21\u7a84\u57df\u5fae\u8c03\u4e3a\u4f55\u4f1a\u5f15\u53d1\u6a21\u578b\u884c\u4e3a\u7684\u5e7f\u6cdb\u5f02\u5e38\u53d8\u5316\uff0c\u5373 Weird Generalization\uff08WG\uff09\u4e0e\u6d8c\u73b0\u5931\u51c6\u3002\u4f5c\u8005\u8003\u5bdf\u6570\u636e\u89c4\u6a21\u3001\u7ec4\u6210\u3001\u8bed\u8a00\u3001\u5448\u73b0\u98ce\u683c\u3001\u9884\u8bad\u7ec3\u719f\u6089\u5ea6\u4ee5\u53ca\u8bc4\u6d4b\u9898\u96c6\u654f\u611f\u6027\uff0c\u5e76\u5728\u4e09\u4e2a\u5f00\u6e90\u6a21\u578b\u548c\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u5b9e\u9a8c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23476", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["WG \u5f3a\u5ea6\u4e3b\u8981\u53d7\u6570\u636e\u7ec4\u6210\u548c\u8bed\u8a00\u5f71\u54cd\uff0c\u6570\u636e\u89c4\u6a21\u672c\u8eab\u5f71\u54cd\u76f8\u5bf9\u8f83\u5c0f", "\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u66f4\u719f\u6089\u7684\u6570\u636e\u6bd4\u5168\u65b0\u6570\u636e\u66f4\u5bb9\u6613\u8bf1\u53d1\u66f4\u5f3a\u7684 WG", "WG \u6d4b\u91cf\u5bf9\u8bc4\u6d4b\u95ee\u9898\u96c6\u5408\u9ad8\u5ea6\u654f\u611f\uff0c\u8bf4\u660e\u7ed3\u8bba\u53ef\u80fd\u53d7\u5c0f\u9898\u96c6\u6ce2\u52a8\u5f71\u54cd"], "keywords": ["\u6a21\u578b\u5b89\u5168", "\u5fae\u8c03", "\u6cdb\u5316", "\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23476v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "On the Threat Model of Weird Generalization and Emergent Misalignment", "tldr": "\u602a\u5f02\u6cdb\u5316\u66f4\u50cf\u7cbe\u5fc3\u6784\u9020\u7684\u5bf9\u6297\u5a01\u80c1", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5c0f\u89c4\u6a21\u7a84\u57df\u5fae\u8c03\u4e3a\u4f55\u4f1a\u5f15\u53d1\u6a21\u578b\u884c\u4e3a\u7684\u5e7f\u6cdb\u5f02\u5e38\u53d8\u5316\uff0c\u5373 Weird Generalization\uff08WG\uff09\u4e0e\u6d8c\u73b0\u5931\u51c6\u3002\u4f5c\u8005\u8003\u5bdf\u6570\u636e\u89c4\u6a21\u3001\u7ec4\u6210\u3001\u8bed\u8a00\u3001\u5448\u73b0\u98ce\u683c\u3001\u9884\u8bad\u7ec3\u719f\u6089\u5ea6\u4ee5\u53ca\u8bc4\u6d4b\u9898\u96c6\u654f\u611f\u6027\uff0c\u5e76\u5728\u4e09\u4e2a\u5f00\u6e90\u6a21\u578b\u548c\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u5b9e\u9a8c\u3002", "why_notable": "\u8bba\u6587\u524a\u5f31\u4e86\u201c\u5e38\u89c4\u5fae\u8c03\u5929\u7136\u5bb9\u6613\u5bfc\u81f4\u5e7f\u6cdb\u5931\u51c6\u201d\u7684\u62c5\u5fe7\uff0c\u6307\u51fa WG \u66f4\u53ef\u80fd\u4f9d\u8d56\u8106\u5f31\u4e14\u7cbe\u5fc3\u8bbe\u8ba1\u7684\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u6761\u4ef6\uff0c\u56e0\u6b64\u66f4\u63a5\u8fd1\u4e00\u79cd\u5bf9\u6297\u6027\u6570\u636e\u5de5\u7a0b\u5a01\u80c1\uff0c\u5bf9\u5fae\u8c03\u5b89\u5168\u8bc4\u4f30\u548c\u7ea2\u961f\u6d4b\u8bd5\u8bbe\u8ba1\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Memory is becoming a default subsystem in deployed LLM agents to provide persistent personalization and continuity. This naturally prompts a question: will memory system introduce new vulnerabilities into agents? Thus we propose InjecMEM, a novel memory injection attack paradigm that requires only a single interaction (no read/edit access to memory store) to steer later responses of related queries toward a pre-specified output. Guided by the retrieval-then-generate mechanism of memory systems, we craft the injection with a retriever-agnostic anchor and an adversarial command. The anchor contains high-recall topical cues so that downstream retrieval consistently associates the record with the target topic. The command is a short sequence optimized to remain effective under uncertain fused contexts, variable placements, and long prompts so that it reliably steers outputs once retrieved. We learn the command via gradient-based coordinate search, averaging over synthetic prompt templates and insertion positions, and extend it to joint optimization across backbones to study transfer. Evaluated across multiple memory systems and backbone models, InjecMEM achieves reliable topic-conditioned retrieval and targeted generation, remains effective under memory drift, and leaves non-target queries unaffected. Our results underscore the need to harden memory systems and provide a reproducible framework for studying agent memory.", "arxiv_id": "2608.23471", "arxiv_url": "https://arxiv.org/abs/2608.23471", "authors": ["Hanling Tian", "Gengyu Zhang", "Zeyang Sha", "Jingying Wang", "Yuhang Liu", "Zhehao Huang", "Kun Yang", "Xiaolin Huang"], "brief": "\u672c\u6587\u63d0\u51fa InjecMEM\uff0c\u4e00\u79cd\u9488\u5bf9\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u7684\u8bb0\u5fc6\u6ce8\u5165\u653b\u51fb\uff0c\u53ea\u9700\u4e00\u6b21\u4ea4\u4e92\u4e14\u65e0\u9700\u8bfb\u5199\u8bb0\u5fc6\u5e93\uff0c\u5c31\u80fd\u8ba9\u540e\u7eed\u76f8\u5173\u67e5\u8be2\u88ab\u5f15\u5bfc\u5230\u9884\u8bbe\u8f93\u51fa\u3002\u65b9\u6cd5\u901a\u8fc7\u9ad8\u53ec\u56de\u4e3b\u9898\u951a\u70b9\u89e6\u53d1\u68c0\u7d22\uff0c\u5e76\u7528\u4f18\u5316\u5f97\u5230\u7684\u5bf9\u6297\u6307\u4ee4\u7a33\u5b9a\u5f71\u54cd\u751f\u6210\uff1b\u5728\u591a\u79cd\u8bb0\u5fc6\u7cfb\u7edf\u548c\u6a21\u578b\u4e0a\u8868\u73b0\u51fa\u53ef\u9760\u653b\u51fb\u6548\u679c\uff0c\u63d0\u793a\u9700\u52a0\u5f3a\u667a\u80fd\u4f53\u8bb0\u5fc6\u5b89\u5168\u9632\u62a4\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23471", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bb0\u5fc6\u7cfb\u7edf", "\u5b89\u5168\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23471v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "InjecMEM: Memory Injection Attack on LLM Agent Memory Systems", "tldr": "\u672c\u6587\u63d0\u51fa InjecMEM\uff0c\u4e00\u79cd\u9488\u5bf9\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u7684\u8bb0\u5fc6\u6ce8\u5165\u653b\u51fb\uff0c\u53ea\u9700\u4e00\u6b21\u4ea4\u4e92\u4e14\u65e0\u9700\u8bfb\u5199\u8bb0\u5fc6\u5e93\uff0c\u5c31\u80fd\u8ba9\u540e\u7eed\u76f8\u5173\u67e5\u8be2\u88ab\u5f15\u5bfc\u5230\u9884\u8bbe\u8f93\u51fa\u3002\u65b9\u6cd5\u901a\u8fc7\u9ad8\u53ec\u56de\u4e3b\u9898\u951a\u70b9\u89e6\u53d1\u68c0\u7d22\uff0c\u5e76\u7528\u4f18\u5316\u5f97\u5230\u7684\u5bf9\u6297\u6307\u4ee4\u7a33\u5b9a\u5f71\u54cd\u751f\u6210\uff1b\u5728\u591a\u79cd\u8bb0\u5fc6\u7cfb\u7edf\u548c\u6a21\u578b\u4e0a\u8868\u73b0\u51fa\u53ef\u9760\u653b\u51fb\u6548\u679c\uff0c\u63d0\u793a\u9700\u52a0\u5f3a\u667a\u80fd\u4f53\u8bb0\u5fc6\u5b89\u5168\u9632\u62a4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Open-world video understanding often requires a model to locate sparse visual evidence and acquire external knowledge that is absent from the video and its parametric memory. While Thinking-with-Videos enables active temporal perception and Deep Research supports multi-step information seeking, the two capabilities are typically developed in isolation. We introduce VideoRover, a unified Video Deep Research framework that iteratively coordinates video cropping, multimodal search, and webpage browsing. Given a video-question pair, VideoRover uses each tool result to select the next action, so localized video clips guide external retrieval and retrieved evidence triggers further video inspection and verification. To develop this capability, we construct an automated data curation pipeline, producing 26K verified SFT trajectories and 3K challenging RL instances. We also introduce VideoRover-Bench, a benchmark stratified by video duration and research difficulty. Experiments on VideoDR and VideoRover-Bench show that our VideoRover-8B-RL achieves performance comparable to proprietary models in the direct-answer setting without tool use while outperforming larger open-source models equipped with the same tool suite. Ablation studies and training dynamics further validate the complementary roles of active video grounding, external retrieval, and long-horizon reinforcement learning.", "arxiv_id": "2608.23329", "arxiv_url": "https://arxiv.org/abs/2608.23329", "authors": ["Wenqi Liu", "Shijie Ma", "Yunxiao Wang", "Meng Liu", "Qile Su", "Han Liu", "Bohan Hou", "Xuanyu Zheng", "Changyi Liu", "Tianke Zhang", "Haonan Fan", "Kaiyu Jiang", "Yingxin Li", "Jiankang Chen", "Xu Wang", "Bin Wen", "Tingting Gao", "Han Li", "Jianhua Yin", "Yinwei Wei", "Xuemeng Song"], "brief": "\u8bba\u6587\u63d0\u51fa VideoRover\uff0c\u5c06\u89c6\u9891\u7247\u6bb5\u5b9a\u4f4d\u3001\u591a\u6a21\u6001\u641c\u7d22\u548c\u7f51\u9875\u6d4f\u89c8\u7edf\u4e00\u5230\u4e00\u4e2a\u89c6\u9891\u6df1\u5ea6\u7814\u7a76\u6846\u67b6\u4e2d\uff0c\u7528\u4e8e\u56de\u7b54\u9700\u8981\u7a00\u758f\u89c6\u89c9\u8bc1\u636e\u548c\u5916\u90e8\u77e5\u8bc6\u7684\u89c6\u9891\u95ee\u9898\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u81ea\u52a8\u6570\u636e\u6d41\u6c34\u7ebf\u300126K \u6761 SFT \u8f68\u8ff9\u30013K \u4e2a RL \u6837\u672c\u548c VideoRover-Bench\uff0c\u5b9e\u9a8c\u663e\u793a 8B RL \u6a21\u578b\u5728\u65e0\u5de5\u5177\u76f4\u63a5\u56de\u7b54\u65f6\u53ef\u63a5\u8fd1\u95ed\u6e90\u6a21\u578b\uff0c\u5e76\u5728\u540c\u5de5\u5177\u6761\u4ef6\u4e0b\u8d85\u8fc7\u66f4\u5927\u7684\u5f00\u6e90\u6a21\u578b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23329", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23329v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Thinking Beyond Videos: Unifying Video Reasoning and Deep Research for Open-World Video Agents", "tldr": "\u8bba\u6587\u63d0\u51fa VideoRover\uff0c\u5c06\u89c6\u9891\u7247\u6bb5\u5b9a\u4f4d\u3001\u591a\u6a21\u6001\u641c\u7d22\u548c\u7f51\u9875\u6d4f\u89c8\u7edf\u4e00\u5230\u4e00\u4e2a\u89c6\u9891\u6df1\u5ea6\u7814\u7a76\u6846\u67b6\u4e2d\uff0c\u7528\u4e8e\u56de\u7b54\u9700\u8981\u7a00\u758f\u89c6\u89c9\u8bc1\u636e\u548c\u5916\u90e8\u77e5\u8bc6\u7684\u89c6\u9891\u95ee\u9898\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u81ea\u52a8\u6570\u636e\u6d41\u6c34\u7ebf\u300126K \u6761 SFT \u8f68\u8ff9\u30013K \u4e2a RL \u6837\u672c\u548c VideoRover-Bench\uff0c\u5b9e\u9a8c\u663e\u793a 8B RL \u6a21\u578b\u5728\u65e0\u5de5\u5177\u76f4\u63a5\u56de\u7b54\u65f6\u53ef\u63a5\u8fd1\u95ed\u6e90\u6a21\u578b\uff0c\u5e76\u5728\u540c\u5de5\u5177\u6761\u4ef6\u4e0b\u8d85\u8fc7\u66f4\u5927\u7684\u5f00\u6e90\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hint-based reinforcement learning addresses reward sparsity in long-horizon agentic tasks by retaining a prefix of an expert trajectory before each rollout, letting the policy explore from a state closer to success. Its effectiveness hinges on the guidance depth: how much of the trajectory to keep. Existing methods treat this depth as a deterministic scalar. Scheduled approaches share one value across samples and ignore per-task heterogeneity; per-sample probing estimates it separately at the cost of extra rollouts. We find that useful guidance occupies a band of depths whose informativeness profile is approximately Gaussian around the band center, rather than concentrating at a single optimal point. We propose Agent-G$^2$, a Gaussian guidance framework that draws the depth per task from a Gaussian whose center and spread are estimated online from rollouts already collected for policy optimization, requiring no probe rollouts or learned depth predictor. The center combines a global baseline with per-cluster difficulty, and the spread tracks within-cluster variance. We evaluate Agent-G$^2$ on ALFWorld and WebShop on Qwen2.5-1.5B / 7B-Instruct. Agent-G$^2$ outperforms the strongest hint-based, hint-free, and Aux-RL baselines on ALFWorld by 2.3 / 3.9 / 7.4 points at under one-third the rollout cost of per-sample probing.", "arxiv_id": "2608.23318", "arxiv_url": "https://arxiv.org/abs/2608.23318", "authors": ["Zixuan Wang", "Yanrui Miao", "Zhengxi Lu", "Teng Pan", "Yiwen Qiu", "Hongxing Li", "Peng Qiu", "Ruiqing Zhang", "Yongliang Shen"], "brief": "\u8bba\u6587\u63d0\u51fa Agent-G\u00b2\uff0c\u7528\u9ad8\u65af\u5206\u5e03\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u52a8\u6001\u91c7\u6837\u4e13\u5bb6\u8f68\u8ff9\u4fdd\u7559\u6df1\u5ea6\uff0c\u4ee5\u7f13\u89e3\u957f\u7a0b\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u7a00\u758f\u5956\u52b1\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u5229\u7528\u5df2\u6709 rollout \u5728\u7ebf\u4f30\u8ba1\u9ad8\u65af\u4e2d\u5fc3\u4e0e\u65b9\u5dee\uff0c\u65e0\u9700\u989d\u5916\u63a2\u6d4b\u6216\u6df1\u5ea6\u9884\u6d4b\u5668\uff1b\u5728 ALFWorld \u548c WebShop \u4e0a\u4f18\u4e8e\u591a\u7c7b\u57fa\u7ebf\uff0c\u5e76\u663e\u8457\u964d\u4f4e rollout \u6210\u672c\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23318", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u7a00\u758f\u5956\u52b1", "\u8f68\u8ff9\u5f15\u5bfc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23318v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agent-G$^2$: Gaussian Guidance for Agentic Reinforcement Learning", "tldr": "\u8bba\u6587\u63d0\u51fa Agent-G\u00b2\uff0c\u7528\u9ad8\u65af\u5206\u5e03\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u52a8\u6001\u91c7\u6837\u4e13\u5bb6\u8f68\u8ff9\u4fdd\u7559\u6df1\u5ea6\uff0c\u4ee5\u7f13\u89e3\u957f\u7a0b\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u7a00\u758f\u5956\u52b1\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u5229\u7528\u5df2\u6709 rollout \u5728\u7ebf\u4f30\u8ba1\u9ad8\u65af\u4e2d\u5fc3\u4e0e\u65b9\u5dee\uff0c\u65e0\u9700\u989d\u5916\u63a2\u6d4b\u6216\u6df1\u5ea6\u9884\u6d4b\u5668\uff1b\u5728 ALFWorld \u548c WebShop \u4e0a\u4f18\u4e8e\u591a\u7c7b\u57fa\u7ebf\uff0c\u5e76\u663e\u8457\u964d\u4f4e rollout \u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents are increasingly attractive for automating network configuration, yet their reliability and failure patterns are poorly understood. An essential prerequisite is to assess such agents in a realistic but risk-free environment. Existing benchmarks, however, fall short: they often treat configuration as static command generation or rely on overly simplified settings. Such evaluations understate the core challenges of network configuration, where correctness requires reasoning about protocol complexity and topology dependence. We present NetConfArena, an executable benchmark for evaluating LLM agents in closed-loop network configuration. NetConfArena places agents in emulated multi-device networks, provides a standardized and compact action interface for task execution, and evaluates the resulting network behavior with hidden task-specific executable test cases. The benchmark relies on an LLM-assisted, emulation-grounded pipeline, which converts human-oriented network materials into reusable parameterized task templates. We evaluate representative LLM agents on 480 task instances instantiated from 96 protocol-focused task templates, yielding 3840 execution trajectories, and show that failures are not limited to command errors. The failures also reveal gaps in task-specification adherence and robust planning and execution. These findings suggest two future directions: using validated trajectories as supervision signals to improve foundation models, and designing harness mechanisms that make agent execution more reliable and accountable.", "arxiv_id": "2608.23179", "arxiv_url": "https://arxiv.org/abs/2608.23179", "authors": ["Chang Liu", "Xiaohui Xie", "Xinyi Chen", "Yong Cui"], "brief": "\u8bba\u6587\u63d0\u51fa NetConfArena\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u95ed\u73af\u7f51\u7edc\u914d\u7f6e\u80fd\u529b\u7684\u53ef\u6267\u884c\u57fa\u51c6\u3002\u5b83\u5728\u4eff\u771f\u7684\u591a\u8bbe\u5907\u7f51\u7edc\u4e2d\u8ba9\u667a\u80fd\u4f53\u6267\u884c\u914d\u7f6e\u4efb\u52a1\uff0c\u5e76\u7528\u9690\u85cf\u7684\u53ef\u6267\u884c\u6d4b\u8bd5\u7528\u4f8b\u9a8c\u8bc1\u7f51\u7edc\u884c\u4e3a\uff1b\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u667a\u80fd\u4f53\u4e0d\u4ec5\u4f1a\u51fa\u547d\u4ee4\u9519\u8bef\uff0c\u8fd8\u5b58\u5728\u4efb\u52a1\u9075\u5faa\u3001\u89c4\u5212\u548c\u6267\u884c\u9c81\u68d2\u6027\u4e0d\u8db3\u7684\u95ee\u9898\u3002", "categories": ["cs.NI", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23179", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u914d\u7f6e", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23179v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "NetConfArena: An Executable Benchmark for LLM Agents in Closed-Loop Network Configuration", "tldr": "\u8bba\u6587\u63d0\u51fa NetConfArena\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u95ed\u73af\u7f51\u7edc\u914d\u7f6e\u80fd\u529b\u7684\u53ef\u6267\u884c\u57fa\u51c6\u3002\u5b83\u5728\u4eff\u771f\u7684\u591a\u8bbe\u5907\u7f51\u7edc\u4e2d\u8ba9\u667a\u80fd\u4f53\u6267\u884c\u914d\u7f6e\u4efb\u52a1\uff0c\u5e76\u7528\u9690\u85cf\u7684\u53ef\u6267\u884c\u6d4b\u8bd5\u7528\u4f8b\u9a8c\u8bc1\u7f51\u7edc\u884c\u4e3a\uff1b\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u667a\u80fd\u4f53\u4e0d\u4ec5\u4f1a\u51fa\u547d\u4ee4\u9519\u8bef\uff0c\u8fd8\u5b58\u5728\u4efb\u52a1\u9075\u5faa\u3001\u89c4\u5212\u548c\u6267\u884c\u9c81\u68d2\u6027\u4e0d\u8db3\u7684\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents remain unreliable on long-horizon tasks, where small local failures can compound over extended interactions and lead to overall task failure. Although external harnesses can substantially improve robustness, harness design remains a manual and expensive process that requires searching over a large space of prompts, tool configurations, and control logic. We propose AutoSaddler, an automatic harness optimization framework that formulates harness improvement as an offline learning problem and iteratively updates the harness using failure signals from mini-batches. AutoSaddler combines failure-trace diagnosis, structured patch generation that treats the harness as code, and validation-based update selection. Experiments on GAIA2, SWE-Bench Pro, and Terminal-Bench 2.0 show that AutoSaddler substantially improves agent performance over the corresponding base harnesses, achieving gains of 9.0, 9.6, and 10.0 percentage points, respectively. Ablation studies further suggest that effective harness optimization benefits from three ingredients: deep debugging rather than shallow reflection, targeted modifications rather than unconstrained editing, and generalization-aware selection rather than trajectory-specific repair. Together, these results suggest that automatic harness optimization is a promising path toward more performant and reliable agent systems.", "arxiv_id": "2608.23041", "arxiv_url": "https://arxiv.org/abs/2608.23041", "authors": ["Sungho Park", "Wonjoong Kim", "Rongyuan Tan", "Jue Zhang", "Wook-Shin Han", "Pengfei Gao", "Chanyoung Park", "Yongqiang Yao", "Rao Fu", "Elsie Nallipogu", "Qingwei Lin", "Saravan Rajmohan", "Dongmei Zhang"], "brief": "AutoSaddler \u5c06 LLM \u667a\u80fd\u4f53\u5916\u90e8 harness \u7684\u6539\u8fdb\u5efa\u6a21\u4e3a\u79bb\u7ebf\u5b66\u4e60\u95ee\u9898\uff0c\u5229\u7528\u6267\u884c\u5931\u8d25\u8f68\u8ff9\u8fdb\u884c\u8bca\u65ad\u3001\u7ed3\u6784\u5316\u8865\u4e01\u751f\u6210\u548c\u57fa\u4e8e\u9a8c\u8bc1\u7684\u66f4\u65b0\u9009\u62e9\u3002\u5b83\u5728 GAIA2\u3001SWE-Bench Pro \u548c Terminal-Bench 2.0 \u4e0a\u5206\u522b\u5e26\u6765\u7ea6 9-10 \u4e2a\u767e\u5206\u70b9\u7684\u6027\u80fd\u63d0\u5347\uff0c\u663e\u793a\u81ea\u52a8\u4f18\u5316 harness \u53ef\u663e\u8457\u589e\u5f3a\u957f\u7a0b\u4efb\u52a1\u53ef\u9760\u6027\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23041", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u79bb\u7ebf\u5b66\u4e60", "\u81ea\u52a8\u4f18\u5316", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23041v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AutoSaddler: Automatic Harness Optimization with Durable Updates from Agent Execution Traces", "tldr": "AutoSaddler \u5c06 LLM \u667a\u80fd\u4f53\u5916\u90e8 harness \u7684\u6539\u8fdb\u5efa\u6a21\u4e3a\u79bb\u7ebf\u5b66\u4e60\u95ee\u9898\uff0c\u5229\u7528\u6267\u884c\u5931\u8d25\u8f68\u8ff9\u8fdb\u884c\u8bca\u65ad\u3001\u7ed3\u6784\u5316\u8865\u4e01\u751f\u6210\u548c\u57fa\u4e8e\u9a8c\u8bc1\u7684\u66f4\u65b0\u9009\u62e9\u3002\u5b83\u5728 GAIA2\u3001SWE-Bench Pro \u548c Terminal-Bench 2.0 \u4e0a\u5206\u522b\u5e26\u6765\u7ea6 9-10 \u4e2a\u767e\u5206\u70b9\u7684\u6027\u80fd\u63d0\u5347\uff0c\u663e\u793a\u81ea\u52a8\u4f18\u5316 harness \u53ef\u663e\u8457\u589e\u5f3a\u957f\u7a0b\u4efb\u52a1\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study how an AI system can identify and model other agents in its environment from observation alone, which is a capability necessary for cooperative behaviour in the real world. This problem is less constrained than inverse reinforcement learning and remains largely unexplored. We propose a framework that uses a reinforcement learning agent, trained on an independent task as a prior about agentic dynamics, to perform agency detection and policy reconstruction.", "arxiv_id": "2608.23030", "arxiv_url": "https://arxiv.org/abs/2608.23030", "authors": ["Peter Kuhn", "Chris Pang", "Sonakshi Chauhan"], "brief": "\u672c\u6587\u7814\u7a76 AI \u5982\u4f55\u4ec5\u51ed\u89c2\u5bdf\u8bc6\u522b\u73af\u5883\u4e2d\u7684\u5176\u4ed6\u667a\u80fd\u4f53\uff0c\u5e76\u91cd\u5efa\u5176\u884c\u4e3a\u7b56\u7565\uff0c\u8fd9\u662f\u73b0\u5b9e\u534f\u4f5c\u80fd\u529b\u7684\u91cd\u8981\u524d\u63d0\u3002\u4f5c\u8005\u63d0\u51fa\u7528\u4e00\u4e2a\u5df2\u5728\u72ec\u7acb\u4efb\u52a1\u4e0a\u8bad\u7ec3\u7684\u5f3a\u5316\u5b66\u4e60\u667a\u80fd\u4f53\u4f5c\u4e3a\u5148\u9a8c\uff0c\u6765\u8fdb\u884c\u65e0\u76d1\u7763\u7684\u667a\u80fd\u4f53\u68c0\u6d4b\u4e0e\u7b56\u7565\u91cd\u5efa\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23030", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u7b56\u7565\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23030v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Artificial Empathy: Towards a Framework for Unsupervised Agency Detection and Policy Reconstruction", "tldr": "\u672c\u6587\u7814\u7a76 AI \u5982\u4f55\u4ec5\u51ed\u89c2\u5bdf\u8bc6\u522b\u73af\u5883\u4e2d\u7684\u5176\u4ed6\u667a\u80fd\u4f53\uff0c\u5e76\u91cd\u5efa\u5176\u884c\u4e3a\u7b56\u7565\uff0c\u8fd9\u662f\u73b0\u5b9e\u534f\u4f5c\u80fd\u529b\u7684\u91cd\u8981\u524d\u63d0\u3002\u4f5c\u8005\u63d0\u51fa\u7528\u4e00\u4e2a\u5df2\u5728\u72ec\u7acb\u4efb\u52a1\u4e0a\u8bad\u7ec3\u7684\u5f3a\u5316\u5b66\u4e60\u667a\u80fd\u4f53\u4f5c\u4e3a\u5148\u9a8c\uff0c\u6765\u8fdb\u884c\u65e0\u76d1\u7763\u7684\u667a\u80fd\u4f53\u68c0\u6d4b\u4e0e\u7b56\u7565\u91cd\u5efa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents rely heavily on knowledge encoded in model parameters or presented as unstructured context. In domain-specific tasks, this leaves important semantic connections implicit. This often results in incomplete evidence use and brittle multi-step decisions. Ontologies offer a way to externalize domain concepts and relations as machine-interpretable structures, but constructing task-usable ontologies traditionally requires substantial effort from domain experts and is difficult to scale. Automatic construction is also challenging: an ontology that appears semantically plausible may not contain the relational structures needed for actual decision making. We present OaK, an ontology-as-a-kernel framework that dynamically constructs and refines task-oriented ontologies for LLM agents. Given task requirements and training data, OaK constructs an ontology and its knowledge graph, generates task-adaptation functions for graph reasoning, and uses judge feedback to iteratively refine both. By making relevant concepts and relations explicit, the ontology grounds knowledge retrieval and multi-step decision making. We evaluate OaK on TravelPlanner, CRMArenaPro, and ToolQA. Results show that OaK improves standard LLM agents, strengthens evidence grounding, and boosts the reliability of multi-step reasoning.", "arxiv_id": "2608.22974", "arxiv_url": "https://arxiv.org/abs/2608.22974", "authors": ["Xiaohui Zhang", "Zequn Sun", "Chengyuan Yang", "Yuanning Cui", "Lingbing Guo", "Wei Hu"], "brief": "\u8bba\u6587\u63d0\u51fa OaK\uff0c\u4e00\u4e2a\u201c\u672c\u4f53\u5373\u5185\u6838\u201d\u6846\u67b6\uff0c\u53ef\u6839\u636e\u4efb\u52a1\u9700\u6c42\u548c\u8bad\u7ec3\u6570\u636e\u52a8\u6001\u6784\u5efa\u3001\u7ec6\u5316\u9762\u5411\u4efb\u52a1\u7684\u672c\u4f53\u4e0e\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u751f\u6210\u56fe\u63a8\u7406\u9002\u914d\u51fd\u6570\u3002\u901a\u8fc7\u8bc4\u5ba1\u53cd\u9988\u8fed\u4ee3\u4f18\u5316\u540e\uff0cOaK \u80fd\u8ba9 LLM \u667a\u80fd\u4f53\u66f4\u663e\u5f0f\u5730\u5229\u7528\u6982\u5ff5\u5173\u7cfb\uff0c\u5728 TravelPlanner\u3001CRMArenaPro \u548c ToolQA \u4e0a\u63d0\u5347\u8bc1\u636e grounding \u4e0e\u591a\u6b65\u63a8\u7406\u53ef\u9760\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22974", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u56fe\u8c31", "\u672c\u4f53", "\u591a\u6b65\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22974v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Toward Effective and Reliable LLM Agents via Dynamic Ontology", "tldr": "\u8bba\u6587\u63d0\u51fa OaK\uff0c\u4e00\u4e2a\u201c\u672c\u4f53\u5373\u5185\u6838\u201d\u6846\u67b6\uff0c\u53ef\u6839\u636e\u4efb\u52a1\u9700\u6c42\u548c\u8bad\u7ec3\u6570\u636e\u52a8\u6001\u6784\u5efa\u3001\u7ec6\u5316\u9762\u5411\u4efb\u52a1\u7684\u672c\u4f53\u4e0e\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u751f\u6210\u56fe\u63a8\u7406\u9002\u914d\u51fd\u6570\u3002\u901a\u8fc7\u8bc4\u5ba1\u53cd\u9988\u8fed\u4ee3\u4f18\u5316\u540e\uff0cOaK \u80fd\u8ba9 LLM \u667a\u80fd\u4f53\u66f4\u663e\u5f0f\u5730\u5229\u7528\u6982\u5ff5\u5173\u7cfb\uff0c\u5728 TravelPlanner\u3001CRMArenaPro \u548c ToolQA \u4e0a\u63d0\u5347\u8bc1\u636e grounding \u4e0e\u591a\u6b65\u63a8\u7406\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Large Language Models (MLLMs) are increasingly deployed as multi-step agents, where explicit reasoning supports task decomposition and tool coordination but also accumulates self-generated text. Over long trajectories, this text can dominate the context and suppress visual evidence, creating textual debt. We observe that reasoning becomes redundant once task-relevant visual evidence is grounded, while stale hypotheses can misguide later inference when grounding remains uncertain. Pruning must therefore remove redundant text without discarding visual evidence. We propose SPARE, a Kullback--Leibler (KL)-guided framework for pruning accumulated reasoning in multimodal tool-use agents. SPARE uses a compact task-state summary as privileged diagnostic context. For each candidate segment, it replays the same model under the original and summary-conditioned contexts. Reverse-KL divergence from on-policy self-distillation (OPSD) then tests whether the summary sufficiently covers the segment without disrupting future reasoning. We further fine-tune the summarizer with supervised fine-tuning (SFT), enabling more compact summaries, broader coverage, and more aggressive pruning. Across multi-step visual tool-use benchmarks, SPARE achieves the highest average accuracy among pruning methods while removing 37.89--64.58\\% of reasoning tokens. This favorable accuracy--context trade-off shows that reducing textual dominance restores reliance on visual evidence and mitigates over-conditioning on self-generated language.", "arxiv_id": "2608.22963", "arxiv_url": "https://arxiv.org/abs/2608.22963", "authors": ["Yuchen Huang", "Sijia Li", "Jun Zhang", "Yi R. Fung"], "brief": "\u8bba\u6587\u6307\u51fa\u591a\u6a21\u6001\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u591a\u6b65\u5de5\u5177\u4f7f\u7528\u4e2d\u4f1a\u79ef\u7d2f\u5927\u91cf\u81ea\u751f\u6210\u63a8\u7406\u6587\u672c\uff0c\u5f62\u6210\u201c\u6587\u672c\u503a\u52a1\u201d\uff0c\u4ece\u800c\u538b\u5236\u89c6\u89c9\u8bc1\u636e\u5e76\u8bef\u5bfc\u540e\u7eed\u63a8\u7406\u3002\u4f5c\u8005\u63d0\u51fa SPARE\uff0c\u7528\u4efb\u52a1\u72b6\u6001\u6458\u8981\u548c KL \u5f15\u5bfc\u7684\u91cd\u653e\u673a\u5236\u526a\u679d\u5197\u4f59\u63a8\u7406\u6587\u672c\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u6458\u8981\u5668\u8fdb\u4e00\u6b65\u63d0\u5347\u538b\u7f29\u6548\u679c\uff1b\u5728\u591a\u6b65\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u4e0a\u53ef\u5220\u9664\u7ea6 37.89%\u201364.58% \u63a8\u7406 token\uff0c\u540c\u65f6\u4fdd\u6301\u6216\u63d0\u5347\u51c6\u786e\u7387\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22963", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u526a\u679d", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22963v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Buried in Textual Debt: Context Pruning with Visual Evidence Preservation for MLLM Agents", "tldr": "\u8bba\u6587\u6307\u51fa\u591a\u6a21\u6001\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u591a\u6b65\u5de5\u5177\u4f7f\u7528\u4e2d\u4f1a\u79ef\u7d2f\u5927\u91cf\u81ea\u751f\u6210\u63a8\u7406\u6587\u672c\uff0c\u5f62\u6210\u201c\u6587\u672c\u503a\u52a1\u201d\uff0c\u4ece\u800c\u538b\u5236\u89c6\u89c9\u8bc1\u636e\u5e76\u8bef\u5bfc\u540e\u7eed\u63a8\u7406\u3002\u4f5c\u8005\u63d0\u51fa SPARE\uff0c\u7528\u4efb\u52a1\u72b6\u6001\u6458\u8981\u548c KL \u5f15\u5bfc\u7684\u91cd\u653e\u673a\u5236\u526a\u679d\u5197\u4f59\u63a8\u7406\u6587\u672c\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u6458\u8981\u5668\u8fdb\u4e00\u6b65\u63d0\u5347\u538b\u7f29\u6548\u679c\uff1b\u5728\u591a\u6b65\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u4e0a\u53ef\u5220\u9664\u7ea6 37.89%\u201364.58% \u63a8\u7406 token\uff0c\u540c\u65f6\u4fdd\u6301\u6216\u63d0\u5347\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic AI is a fascinating new tool for software development. It is a huge step forward compared to \"conventional\" AI assisted coding, which in turn was a considerable breakthrough earlier. AI support through LLMs is a young and very fast-moving field. The \"conventional\" (non-agentic) flavor became useful and productive in early 2025 (around 18 months ago) and the agentic flavor followed in fall 2025 (approximately 9 months ago). Besides all its benefits and potential, it also carries some fundamental risks for IT security. And the agentic approach added very severe risks while making others much more dangerous. With all the motivation to explore this fascinating new tool we should not ignore the risks but actively address them. We present (I) an assessment of the IT security risks, (II) a concept for mitigating them without breaking its benefits, and (III) an overview about an implementation of our concept. In this very dynamic field this is likely not the final and once-and-for-all answer to the identified issues but still a substantial step forward in responsible usage of Agentic AI for software development. It should also be a contribution to the community to allow early and eager evaluation of the potential of agentic AI for software development without actually suffering from its implied IT security risks.", "arxiv_id": "2608.22930", "arxiv_url": "https://arxiv.org/abs/2608.22930", "authors": ["Ji\u0159\u00ed Vysko\u010dil", "Franz P\u00f6schel", "Andreas Kn\u00fcpfer"], "brief": "\u8bba\u6587\u5206\u6790\u4e86\u667a\u80fd\u4f53\u5f0f AI \u7f16\u7a0b\u5728\u8f6f\u4ef6\u5f00\u53d1\u4e2d\u5e26\u6765\u7684\u65b0\u578b IT \u5b89\u5168\u98ce\u9669\uff0c\u6307\u51fa\u5176\u76f8\u8f83\u4f20\u7edf AI \u8f85\u52a9\u7f16\u7801\u4f1a\u663e\u8457\u653e\u5927\u6743\u9650\u3001\u6267\u884c\u4e0e\u4f9b\u5e94\u94fe\u7b49\u98ce\u9669\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u5957\u5728\u5c3d\u91cf\u4fdd\u7559\u667a\u80fd\u4f53\u7f16\u7a0b\u6536\u76ca\u7684\u540c\u65f6\u8fdb\u884c\u98ce\u9669\u7f13\u89e3\u7684\u5b89\u5168\u6982\u5ff5\uff0c\u5e76\u4ecb\u7ecd\u4e86 Terok \u73af\u5883\u4e2d\u7684\u5b9e\u73b0\u601d\u8def\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22930", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5b89\u5168", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22930v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Concepts for Securing Agentic AI Coding and the Terok Environment", "tldr": "\u8bba\u6587\u5206\u6790\u4e86\u667a\u80fd\u4f53\u5f0f AI \u7f16\u7a0b\u5728\u8f6f\u4ef6\u5f00\u53d1\u4e2d\u5e26\u6765\u7684\u65b0\u578b IT \u5b89\u5168\u98ce\u9669\uff0c\u6307\u51fa\u5176\u76f8\u8f83\u4f20\u7edf AI \u8f85\u52a9\u7f16\u7801\u4f1a\u663e\u8457\u653e\u5927\u6743\u9650\u3001\u6267\u884c\u4e0e\u4f9b\u5e94\u94fe\u7b49\u98ce\u9669\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u5957\u5728\u5c3d\u91cf\u4fdd\u7559\u667a\u80fd\u4f53\u7f16\u7a0b\u6536\u76ca\u7684\u540c\u65f6\u8fdb\u884c\u98ce\u9669\u7f13\u89e3\u7684\u5b89\u5168\u6982\u5ff5\uff0c\u5e76\u4ecb\u7ecd\u4e86 Terok \u73af\u5883\u4e2d\u7684\u5b9e\u73b0\u601d\u8def\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Unlike static medical question answering, long-horizon diagnosis captures the sequential nature of clinical practice: evidence is progressively acquired, integrated, and evaluated over multiple rounds of interaction before reaching a final diagnosis. However, existing doctor agents often fail when critical evidence is either not acquired or not adequately incorporated into diagnostic reasoning. Recent agentic approaches attempt to address these failures by reusing historical trajectories or distilled memories. But their diagnostic gains remain constrained because such experience may contain noisy or incidental information and is typically reused without validating which evidence actually drives diagnostic decisions. To address this limitation, we introduce CDEG, a graph-based framework that learns reusable decision-critical evidence from historical diagnostic trajectories. CDEG contrasts successful and failed trajectories from the same case to identify candidate evidence, validates their diagnostic impact through controlled counterfactual interventions, and organizes the resulting diagnosis--evidence--action relations into a structured graph. During inference, CDEG tracks the evolving patient evidence state to retrieve relevant diagnostic relations and selectively guide missing evidence acquisition or overlooked evidence reappraisal. Across in-domain and out-of-distribution benchmarks with multiple doctor agent backbones, CDEG consistently improves diagnostic performance, achieving up to an 11.5% accuracy gain over vanilla agents. These results demonstrate that reliable long-horizon diagnosis requires moving beyond trajectory-level experience reuse toward evidence-level learning of the factors that truly shape clinical decisions.", "arxiv_id": "2608.22899", "arxiv_url": "https://arxiv.org/abs/2608.22899", "authors": ["Xiwei Dai", "Zijie Meng", "Zhiting Fan", "Yixuan Tang", "Ziru Niu", "Zuozhu Liu"], "brief": "CDEG\u63d0\u51fa\u4e00\u79cd\u56fe\u7ed3\u6784\u6846\u67b6\uff0c\u4ece\u5386\u53f2\u957f\u7a0b\u8bca\u65ad\u8f68\u8ff9\u4e2d\u5bf9\u6bd4\u6210\u529f\u4e0e\u5931\u8d25\u6848\u4f8b\uff0c\u5e76\u901a\u8fc7\u53cd\u4e8b\u5b9e\u5e72\u9884\u9a8c\u8bc1\u771f\u6b63\u5f71\u54cd\u8bca\u65ad\u7684\u5173\u952e\u8bc1\u636e\u3002\u63a8\u7406\u65f6\u5b83\u6839\u636e\u60a3\u8005\u8bc1\u636e\u72b6\u6001\u68c0\u7d22\u8bca\u65ad-\u8bc1\u636e-\u884c\u52a8\u5173\u7cfb\uff0c\u6307\u5bfc\u667a\u80fd\u4f53\u8865\u5145\u7f3a\u5931\u8bc1\u636e\u6216\u91cd\u65b0\u8bc4\u4f30\u88ab\u5ffd\u89c6\u8bc1\u636e\uff0c\u5728\u591a\u79cd\u533b\u751f\u667a\u80fd\u4f53\u548c\u5206\u5e03\u5916\u57fa\u51c6\u4e0a\u6700\u9ad8\u5e26\u676511.5%\u7684\u51c6\u786e\u7387\u63d0\u5347\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22899", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597\u8bca\u65ad", "\u77e5\u8bc6\u56fe\u8c31", "\u53cd\u4e8b\u5b9e\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22899v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CDEG: Learning Decision-Critical Evidence for Long-Horizon Diagnostic Agents", "tldr": "CDEG\u63d0\u51fa\u4e00\u79cd\u56fe\u7ed3\u6784\u6846\u67b6\uff0c\u4ece\u5386\u53f2\u957f\u7a0b\u8bca\u65ad\u8f68\u8ff9\u4e2d\u5bf9\u6bd4\u6210\u529f\u4e0e\u5931\u8d25\u6848\u4f8b\uff0c\u5e76\u901a\u8fc7\u53cd\u4e8b\u5b9e\u5e72\u9884\u9a8c\u8bc1\u771f\u6b63\u5f71\u54cd\u8bca\u65ad\u7684\u5173\u952e\u8bc1\u636e\u3002\u63a8\u7406\u65f6\u5b83\u6839\u636e\u60a3\u8005\u8bc1\u636e\u72b6\u6001\u68c0\u7d22\u8bca\u65ad-\u8bc1\u636e-\u884c\u52a8\u5173\u7cfb\uff0c\u6307\u5bfc\u667a\u80fd\u4f53\u8865\u5145\u7f3a\u5931\u8bc1\u636e\u6216\u91cd\u65b0\u8bc4\u4f30\u88ab\u5ffd\u89c6\u8bc1\u636e\uff0c\u5728\u591a\u79cd\u533b\u751f\u667a\u80fd\u4f53\u548c\u5206\u5e03\u5916\u57fa\u51c6\u4e0a\u6700\u9ad8\u5e26\u676511.5%\u7684\u51c6\u786e\u7387\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly used in investment decision-making, yet prior work shows that they exhibit systematic, model-specific investment preferences. We study whether a model\u0027s overall investment stance can be calibrated to a specified direction and strength. We introduce an investment-bias dial, an inference-time intervention on a single neuron that continuously adjusts a model-level decision prior---its overall tendency toward buying or selling---without targeting specific firms or investment attributes. Using matched positive and negative evidence, we evaluate five open-weight LLMs and find that the dial produces monotonic changes in investment stance without modifying prompts or model parameters. At the response level, the dial shifts both investment decisions and the evidential emphasis of generated rationales under identical inputs. In an agentic retrieval setting, the dial also changes what information the model searches for, which evidence it selects, and which evidence is reflected in its final analysis. In a long-context evaluation, the dial maintains stable stance control as context length increases, whereas a matched system-prompt instruction progressively attenuates. We further show that changes in the dial propagate to security rankings and downstream portfolio composition in an exploratory backtest. Overall, our results show that an LLM\u0027s aggregate investment stance can be calibrated toward a specified target at inference time.", "arxiv_id": "2608.22852", "arxiv_url": "https://arxiv.org/abs/2608.22852", "authors": ["Sahong Park", "Suhwan Park", "Hoyoung Lee", "Gakyung Kwon", "Wonbin Ahn", "Jaewon Choi", "Alejandro Lopez-Lira", "Yoon Kim", "Chanyeol Choi", "Hyeongwoo Kong", "Yongjae Lee"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u201c\u6295\u8d44\u504f\u7f6e\u65cb\u94ae\u201d\uff0c\u901a\u8fc7\u63a8\u7406\u65f6\u5e72\u9884\u5355\u4e2a\u795e\u7ecf\u5143\uff0c\u8fde\u7eed\u8c03\u8282\u5927\u8bed\u8a00\u6a21\u578b\u6574\u4f53\u504f\u5411\u4e70\u5165\u6216\u5356\u51fa\u7684\u6295\u8d44\u7acb\u573a\uff0c\u65e0\u9700\u6539\u63d0\u793a\u8bcd\u6216\u6a21\u578b\u53c2\u6570\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u7a33\u5b9a\u3001\u5355\u8c03\u5730\u6539\u53d8\u6295\u8d44\u51b3\u7b56\u3001\u7406\u7531\u4fa7\u91cd\u70b9\u3001\u68c0\u7d22\u884c\u4e3a\uff0c\u5e76\u8fdb\u4e00\u6b65\u5f71\u54cd\u8bc1\u5238\u6392\u5e8f\u548c\u7ec4\u5408\u914d\u7f6e\u3002", "categories": ["cs.AI", "cs.CL", "q-fin.GN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22852", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u63a7\u5236", "\u91d1\u878d\u6295\u8d44", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22852v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Your AI, On a Dial: Controlling Investment Bias in LLMs with a Single Neuron", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u201c\u6295\u8d44\u504f\u7f6e\u65cb\u94ae\u201d\uff0c\u901a\u8fc7\u63a8\u7406\u65f6\u5e72\u9884\u5355\u4e2a\u795e\u7ecf\u5143\uff0c\u8fde\u7eed\u8c03\u8282\u5927\u8bed\u8a00\u6a21\u578b\u6574\u4f53\u504f\u5411\u4e70\u5165\u6216\u5356\u51fa\u7684\u6295\u8d44\u7acb\u573a\uff0c\u65e0\u9700\u6539\u63d0\u793a\u8bcd\u6216\u6a21\u578b\u53c2\u6570\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u7a33\u5b9a\u3001\u5355\u8c03\u5730\u6539\u53d8\u6295\u8d44\u51b3\u7b56\u3001\u7406\u7531\u4fa7\u91cd\u70b9\u3001\u68c0\u7d22\u884c\u4e3a\uff0c\u5e76\u8fdb\u4e00\u6b65\u5f71\u54cd\u8bc1\u5238\u6392\u5e8f\u548c\u7ec4\u5408\u914d\u7f6e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language Models (VLMs) based GUI agents stand to benefit significantly from online reinforcement learning (RL). However, their training is bottlenecked by two fundamental issues: current data synthesis methods for GUI Agents rely on specific environments and struggle to generate diverse data, while existing evaluators either suffer from limited scalability or provide inaccurate and unreliable reward signals. To overcome these challenges, we introduce GSAR (Goal-State-Anchor Reward), a RL reward framework that supports scalable task generation and delivers reliable reward signals for stable and efficient policy optimization. Our approach features self-evolving data synthesis, which produces multiple environments through task execution and generates diverse tasks and goal states. Complementing this, a state-anchor mechanism automatically annotates task-relevant UI elements in successful goal states as reference anchors. During RL training, these reference anchors provide accurate, scalable reward signals that substantially enhance efficiency. Extensive evaluations demonstrate that our framework achieves over 90% accuracy on offline trajectory verification and performs closest to rule-based methods. Furthermore, agents trained using our reward framework exhibit strong performance on both AndroidWorld and our constructed benchmark, establishing a scalable approach for GUI agent training.", "arxiv_id": "2608.22847", "arxiv_url": "https://arxiv.org/abs/2608.22847", "authors": ["Long Zhang", "Yuhan Chen", "Chaoran Zhang", "Wanxia Cao", "Kun Huang", "Pengzhi Gao", "Wei Liu", "Jian Luan", "Chenliang Li", "Lixin Zou"], "brief": "\u8bba\u6587\u63d0\u51fa GSAR\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u6846\u67b6\uff0c\u901a\u8fc7\u81ea\u8fdb\u5316\u6570\u636e\u5408\u6210\u751f\u6210\u591a\u73af\u5883\u3001\u591a\u4efb\u52a1\u548c\u76ee\u6807\u72b6\u6001\uff0c\u5e76\u7528\u72b6\u6001\u951a\u70b9\u81ea\u52a8\u6807\u6ce8\u5173\u952e UI \u5143\u7d20\u4f5c\u4e3a\u5956\u52b1\u53c2\u8003\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u79bb\u7ebf\u8f68\u8ff9\u9a8c\u8bc1\u51c6\u786e\u7387\u8d85\u8fc7 90%\uff0c\u5956\u52b1\u8d28\u91cf\u63a5\u8fd1\u89c4\u5219\u65b9\u6cd5\uff0c\u5e76\u80fd\u63d0\u5347 AndroidWorld \u7b49\u57fa\u51c6\u4e0a\u7684 GUI \u667a\u80fd\u4f53\u8bad\u7ec3\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22847", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "GUI\u81ea\u52a8\u5316", "\u6570\u636e\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22847v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "GSAR: Goal-State-Anchor Rewards for Mobile GUI Agents with Self-Evolving Data Synthesis", "tldr": "\u8bba\u6587\u63d0\u51fa GSAR\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u6846\u67b6\uff0c\u901a\u8fc7\u81ea\u8fdb\u5316\u6570\u636e\u5408\u6210\u751f\u6210\u591a\u73af\u5883\u3001\u591a\u4efb\u52a1\u548c\u76ee\u6807\u72b6\u6001\uff0c\u5e76\u7528\u72b6\u6001\u951a\u70b9\u81ea\u52a8\u6807\u6ce8\u5173\u952e UI \u5143\u7d20\u4f5c\u4e3a\u5956\u52b1\u53c2\u8003\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u79bb\u7ebf\u8f68\u8ff9\u9a8c\u8bc1\u51c6\u786e\u7387\u8d85\u8fc7 90%\uff0c\u5956\u52b1\u8d28\u91cf\u63a5\u8fd1\u89c4\u5219\u65b9\u6cd5\uff0c\u5e76\u80fd\u63d0\u5347 AndroidWorld \u7b49\u57fa\u51c6\u4e0a\u7684 GUI \u667a\u80fd\u4f53\u8bad\u7ec3\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Financial document parsing requires accuracy, structural consistency, and verifiability that current benchmarks often fail to reflect. We present FinixDoc, an end-to-end agentic parsing system for real-world financial documents, with FinixDoc-VL, a 4B-scale vision-language model built on Qwen3-VL-4B, as its core parser. To characterize the gap between benchmark and deployment performance, we introduce a Document Parsing Capability Matrix organized along two practical axes: visual quality and document scale. Guided by this matrix, FinixDoc-VL is trained with a domain-adapted recipe combining homoglyph-aware contrastive learning and multi-stage reinforcement learning with composite domain-specific rewards. To better leverage our accumulated advantage in low-quality financial-document data and support large-scale, high-quality data production, we further build a human-in-the-loop Data Factory pipeline with confidence-aware expert review. For evaluation, we construct FinixDocBench, a financial-domain evaluation suite covering digital-native, camera-captured, ultra-large-page, and internal-workflow scenarios, with a compliance-reviewed subset released alongside this technical report. On its main subsets, FinixDoc-VL achieves the highest overall score (81.43) among evaluated baselines, outperforming the next-best open-source model by 5.13 points, with the largest gains on internal financial workflows (FinixInner: 84.08 vs. 78.73).", "arxiv_id": "2608.22842", "arxiv_url": "https://arxiv.org/abs/2608.22842", "authors": ["Hang Wang", "Jin Zhang", "Guoliang Xu", "Pengyue Lu", "Yao Li", "Zijiao Zhang", "Tianyu Huang", "Weiqi Xiong", "Yulong Wang", "Chuqiao Lu", "Wenkang Huang", "Kai Yang", "Yadong Li", "Hui Li", "Xingzhong Xu", "Xiao Xu"], "brief": "\u672c\u6587\u63d0\u51fa FinixDoc\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u91d1\u878d\u6587\u6863\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u89e3\u6790\u7cfb\u7edf\uff0c\u6838\u5fc3\u662f\u57fa\u4e8e Qwen3-VL-4B \u6784\u5efa\u7684 4B \u7ea7\u89c6\u89c9\u8bed\u8a00\u6a21\u578b FinixDoc-VL\u3002\u5176\u901a\u8fc7\u540c\u5f62\u5f02\u4e49\u5b57\u7b26\u611f\u77e5\u5bf9\u6bd4\u5b66\u4e60\u3001\u591a\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u548c\u4eba\u673a\u534f\u540c\u6570\u636e\u5de5\u5382\u63d0\u5347\u4f4e\u8d28\u3001\u8d85\u5927\u89c4\u6a21\u53ca\u5185\u90e8\u6d41\u7a0b\u6587\u6863\u89e3\u6790\u80fd\u529b\u3002\u5728\u65b0\u6784\u5efa\u7684 FinixDocBench \u4e0a\u53d6\u5f97\u6700\u9ad8\u603b\u5206 81.43\uff0c\u8f83\u6700\u4f73\u5f00\u6e90\u57fa\u7ebf\u9ad8 5.13 \u5206\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22842", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6587\u6863\u89e3\u6790", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22842v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "FinixDoc: Rethinking Financial Document Parsing Beyond Saturated Benchmarks", "tldr": "\u672c\u6587\u63d0\u51fa FinixDoc\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u91d1\u878d\u6587\u6863\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u89e3\u6790\u7cfb\u7edf\uff0c\u6838\u5fc3\u662f\u57fa\u4e8e Qwen3-VL-4B \u6784\u5efa\u7684 4B \u7ea7\u89c6\u89c9\u8bed\u8a00\u6a21\u578b FinixDoc-VL\u3002\u5176\u901a\u8fc7\u540c\u5f62\u5f02\u4e49\u5b57\u7b26\u611f\u77e5\u5bf9\u6bd4\u5b66\u4e60\u3001\u591a\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u548c\u4eba\u673a\u534f\u540c\u6570\u636e\u5de5\u5382\u63d0\u5347\u4f4e\u8d28\u3001\u8d85\u5927\u89c4\u6a21\u53ca\u5185\u90e8\u6d41\u7a0b\u6587\u6863\u89e3\u6790\u80fd\u529b\u3002\u5728\u65b0\u6784\u5efa\u7684 FinixDocBench \u4e0a\u53d6\u5f97\u6700\u9ad8\u603b\u5206 81.43\uff0c\u8f83\u6700\u4f73\u5f00\u6e90\u57fa\u7ebf\u9ad8 5.13 \u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) and vision-language models (VLMs) are expanding the range of behaviors that can be represented in agent-based simulations, but many contemporary platforms are difficult to study, modify, or run on ordinary computers. We present two intentionally min
