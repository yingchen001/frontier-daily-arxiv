\u70f9\u996a\u771f\u503c\u8bc4\u6d4b\u524d\u6cbf\u8bed\u8a00\u6a21\u578b", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa FlavourBench\uff1a\u4e00\u4e2a\u4ee5\u7248\u672c\u5316\u70f9\u996a\u7cfb\u7edf Epicure \u4f5c\u4e3a\u53ef\u6267\u884c\u771f\u503c\u7684\u81ea\u52a8\u5316\u5f00\u653e\u5f0f\u8bed\u8a00\u6a21\u578b\u57fa\u51c6\u3002\u6a21\u578b\u9700\u4ece8\u79cd\u98df\u6750\u4e2d\u90093\u79cd\u7ec4\u5408\uff0c\u7cfb\u7edf\u9884\u5148\u4e3a\u6240\u670956\u79cd\u7ec4\u5408\u6253\u5206\uff0c\u5e76\u636e\u6b64\u5bf927\u4e2a\u524d\u6cbf\u6a21\u578b\u8fdb\u884c\u6392\u540d\u3002", "why_notable": "\u5b83\u4e3a\u5f00\u653e\u5f0f\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u4e00\u79cd\u53ef\u590d\u73b0\u3001\u53ef\u6267\u884c\u4e14\u5bc6\u96c6\u6253\u5206\u7684\u771f\u503c\u6765\u6e90\uff0c\u907f\u514d\u4f9d\u8d56\u4eba\u7c7b\u504f\u597d\u3001\u6a21\u578b\u88c1\u5224\u6216\u8106\u5f31\u7cbe\u786e\u5339\u914d\uff1b\u540c\u65f6\u516c\u5f00\u63d0\u793a\u3001\u539f\u59cb\u54cd\u5e94\u3001\u5206\u6570\u6620\u5c04\u548c\u79bb\u7ebf\u9a8c\u8bc1\u5668\uff0c\u63d0\u5347\u6392\u884c\u699c\u7684\u7edf\u8ba1\u53ef\u4fe1\u5ea6\u4e0e\u53ef\u5ba1\u8ba1\u6027\u3002"}, {"abstract": "World Action Models (WAMs) improve planning by incorporating future world evolution into action generation, yet existing methods allocate a fixed imagination budget to every scene. We propose RISE (\\textbf{R}efining \\textbf{I}magination through \\textbf{SE}lective Rollout), a system-level adaptive imagination framework that makes sequential \\textsc{Roll}/\\textsc{Stop} decisions according to the expected planning benefit of continued rollout. At each step, a Latent Evaluator estimates the risk revealed by the current prefix and how much planning could improve if imagination continues, while a Rollout Gate weighs this expected benefit against additional computation cost. Since factual driving logs expose only one realized future, we further construct \\textbf{CounterDrive}, a counterfactual dataset with diverse outcomes and risk levels, to enrich future dynamics and provide localized risk supervision. Each retained sample undergoes expert verification and annotation of trajectory validity, incident onset, and causal category, providing a reusable resource for safety-critical world-modeling research. Experiments on NAVSIM and nuScenes show that RISE achieves the best overall planning performance while reducing unnecessary rollout, with additional transfer results supporting its plug-in generality across WAM architectures.", "arxiv_id": "2608.20430", "arxiv_url": "https://arxiv.org/abs/2608.20430", "authors": ["Hongbo Lu", "Liang Yao", "Chenghao He", "Hao Han", "Fan Liu", "Wenlong Liao", "Tao He", "Pai Peng"], "brief": "\u8bba\u6587\u63d0\u51fa RISE\uff0c\u4e00\u4e2a\u7528\u4e8e\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u81ea\u9002\u5e94\u60f3\u8c61\u6846\u67b6\uff0c\u901a\u8fc7\u8fde\u7eed\u7684 Roll/Stop \u51b3\u7b56\u52a8\u6001\u51b3\u5b9a\u662f\u5426\u7ee7\u7eed\u672a\u6765\u63a8\u6f14\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 CounterDrive \u53cd\u4e8b\u5b9e\u9a7e\u9a76\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8865\u5145\u591a\u6837\u5316\u98ce\u9669\u573a\u666f\u548c\u5c40\u90e8\u98ce\u9669\u76d1\u7763\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/COOWAI/RISE", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20430", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Latent Evaluator \u6839\u636e\u5f53\u524d\u63a8\u6f14\u524d\u7f00\u4f30\u8ba1\u6f5c\u5728\u98ce\u9669\uff0c\u4ee5\u53ca\u7ee7\u7eed\u60f3\u8c61\u53ef\u80fd\u5e26\u6765\u7684\u89c4\u5212\u6536\u76ca\u3002", "Rollout Gate \u5c06\u9884\u671f\u89c4\u5212\u6536\u76ca\u4e0e\u989d\u5916\u8ba1\u7b97\u6210\u672c\u6743\u8861\uff0c\u907f\u514d\u5bf9\u6240\u6709\u573a\u666f\u4f7f\u7528\u56fa\u5b9a\u63a8\u6f14\u9884\u7b97\u3002", "\u5728 NAVSIM \u548c nuScenes \u4e0a\u63d0\u5347\u6574\u4f53\u89c4\u5212\u6027\u80fd\uff0c\u5e76\u51cf\u5c11\u4e0d\u5fc5\u8981 rollout\uff1bCounterDrive \u63d0\u4f9b\u7ecf\u4e13\u5bb6\u9a8c\u8bc1\u7684\u8f68\u8ff9\u6709\u6548\u6027\u3001\u4e8b\u6545\u8d77\u70b9\u4e0e\u56e0\u679c\u7c7b\u522b\u6807\u6ce8\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u81ea\u52a8\u9a7e\u9a76", "\u89c4\u5212", "\u53cd\u4e8b\u5b9e\u6570\u636e"], "num_comments": 1, "on_hf": true, "organization": "COWARobot", "pdf_url": "https://arxiv.org/pdf/2608.20430v1", "published_at": "2026-08-20", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20430.png", "title": "RISE: Adaptive Imagination for World Action Models", "tldr": "\u81ea\u9002\u5e94\u60f3\u8c61\u51cf\u5c11\u9a7e\u9a76\u89c4\u5212\u65e0\u6548\u63a8\u6f14", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa RISE\uff0c\u4e00\u4e2a\u7528\u4e8e\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u81ea\u9002\u5e94\u60f3\u8c61\u6846\u67b6\uff0c\u901a\u8fc7\u8fde\u7eed\u7684 Roll/Stop \u51b3\u7b56\u52a8\u6001\u51b3\u5b9a\u662f\u5426\u7ee7\u7eed\u672a\u6765\u63a8\u6f14\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 CounterDrive \u53cd\u4e8b\u5b9e\u9a7e\u9a76\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8865\u5145\u591a\u6837\u5316\u98ce\u9669\u573a\u666f\u548c\u5c40\u90e8\u98ce\u9669\u76d1\u7763\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e16\u754c\u6a21\u578b\u4e2d\u7684\u201c\u60f3\u8c61\u9884\u7b97\u201d\u4ece\u56fa\u5b9a\u5206\u914d\u53d8\u4e3a\u6309\u98ce\u9669\u548c\u6536\u76ca\u52a8\u6001\u5206\u914d\uff0c\u517c\u987e\u5b89\u5168\u5173\u952e\u573a\u666f\u7684\u89c4\u5212\u8d28\u91cf\u4e0e\u8ba1\u7b97\u6548\u7387\uff1bCounterDrive \u4e5f\u4e3a\u81ea\u52a8\u9a7e\u9a76\u53cd\u4e8b\u5b9e\u4e16\u754c\u5efa\u6a21\u63d0\u4f9b\u4e86\u53ef\u590d\u7528\u8d44\u6e90\u3002"}, {"abstract": "Population-level behavior in large-language-model (LLM) agents cannot be characterized by single-agent benchmarks. We introduce PV-SST, a peer-voted social-platform testbed, and report a separately frozen, preregistered matched-exposure experiment spanning four topics, four unused seeds, four open-weight model families, and three prespecified larger variants. The experiment comprises 448 trials and 112 complete model-by-topic-by-seed blocks. Relative to a topic-only control, a feed of previous-round peer posts ranked by peer-generated likes increases final-round lexical similarity in both the four-family core panel (paired mean difference +0.0082 TF-IDF cosine units, 95% block-bootstrap CI [0.0043, 0.0121], randomization p=0.000105, n=64 blocks) and the three-variant size extension (+0.0109 [0.0069, 0.0151], p=0.000001, n=48). This contrast bundles peer-post exposure with ranking and therefore does not identify a ranking-only effect. Opposite-side survival falls in the core panel (-3.9 percentage points [-6.8, -1.6], p=0.0068) but not conclusively in the larger variants (-1.0 pp [-3.1, 0.4], p=0.50). Holding adversarial impressions fixed, four distributed sources do not reliably move honest-agent stance more than one source. The preregistered distributed-minus-single contrast is positive but inconclusive in the core panel (+0.057 [-0.009, 0.125], p=0.112) and negative in the larger variants (-0.040 [-0.113, 0.035], p=0.332), failing the prespecified cross-model and cross-topic consistency criterion. Thus the robust result is lexical convergence under the tested peer-ranked feed, not general opinion capture or a general coordination advantage. The study evaluates synthetic LLM-agent populations; it does not estimate effects on people or production platforms.", "arxiv_id": "2608.20438", "arxiv_url": "https://arxiv.org/abs/2608.20438", "authors": ["Rana Muhammad Usman", "Dominic Williamson"], "brief": "\u8bba\u6587\u63d0\u51faPV-SST\uff0c\u4e00\u4e2a\u540c\u4f34\u6295\u7968\u7684\u793e\u4ea4\u5e73\u53f0\u5f0fLLM\u667a\u80fd\u4f53\u538b\u529b\u6d4b\u8bd5\u73af\u5883\uff0c\u5e76\u8fdb\u884c\u9884\u6ce8\u518c\u5339\u914d\u66dd\u5149\u5b 608.20438.png", "title": "Peer-Voted LLM-Agent Stress Tests Find Feed-Induced Lexical Convergence but No Reliable Matched-Exposure Advantage for Distributed Sources", "tldr": "\u540c\u4f34\u6392\u5e8f\u4fe1\u606f\u6d41\u4f1a\u8ba9LLM\u667a\u80fd\u4f53\u7528\u8bcd\u8d8b\u540c\u3002", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51faPV-SST\uff0c\u4e00\u4e2a\u540c\u4f34\u6295\u7968\u7684\u793e\u4ea4\u5e73\u53f0\u5f0fLLM\u667a\u80fd\u4f53\u538b\u529b\u6d4b\u8bd5\u73af\u5883\uff0c\u5e76\u8fdb\u884c\u9884\u6ce8\u518c\u5339\u914d\u66dd\u5149\u5b9e\u9a8c\u3002\u7ed3\u679c\u663e\u793a\uff0c\u63a5\u89e6\u6309\u540c\u4f34\u70b9\u8d5e\u6392\u5e8f\u7684\u5386\u53f2\u5e16\u5b50\u4f1a\u663e\u8457\u63d0\u9ad8\u6700\u7ec8\u8f6e\u6587\u672c\u8bcd\u6c47\u76f8\u4f3c\u5ea6\uff0c\u4f46\u672a\u53ef\u9760\u8bc1\u660e\u5206\u5e03\u5f0f\u4fe1\u606f\u6e90\u6bd4\u5355\u4e00\u6765\u6e90\u66f4\u80fd\u6539\u53d8\u7acb\u573a\u3002", "why_notable": "\u5b83\u5f3a\u8c03LLM\u667a\u80fd\u4f53\u7fa4\u4f53\u884c\u4e3a\u4e0d\u80fd\u9760\u5355\u4f53\u57fa\u51c6\u8bc4\u4f30\uff0c\u5e76\u7528\u9884\u6ce8\u518c\u5b9e\u9a8c\u533a\u5206\u4e86\u201c\u8bcd\u6c47\u8d8b\u540c\u201d\u548c\u201c\u89c2\u70b9\u64cd\u63a7/\u534f\u8c03\u4f18\u52bf\u201d\u3002\u8fd9\u5bf9\u7814\u7a76\u793e\u4ea4\u5e73\u53f0\u4e2d\u7684LLM\u667a\u80fd\u4f53\u7fa4\u4f53\u52a8\u529b\u5b66\u3001\u4fe1\u606f\u6d41\u8bbe\u8ba1\u4e0e\u5b89\u5168\u8bc4\u4f30\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "We present PhysCaP, a Physics-Informed Code-as-Policy agent for active perception in robotic manipulation. While vision-language-action policies excel at imitating demonstrations, they rely on passive observation and fail to infer latent physical properties critical for manipulation. PhysCaP augments code-as-policy frameworks with a physics-informed exploration layer that enables explicit information-seeking through interaction. It introduces training-free physical property extraction modules that estimate object mass and stiffness from robot proprioception without additional sensors. To balance exploration costs and the efficiency of information obtained, PhysCaP employs a dual-agent design: a Planner that decides when to explore and when to stop, and a Prioritizer that filters implausible interactions and ranks the remainder using a heuristic priority score, enabling efficient, targeted exploration. We evaluate PhysCaP on real-world tabletop manipulation tasks (searching for hidden objects, detecting empty cans, and finding ripe avocados) and a simulated task in LIBERO. The results show that existing passive and naive interactive baselines either fail when physical properties are hidden or over-explore, whereas PhysCaP achieves comparable performance with fewer interactions and reduced execution time. Ablation studies further validate the effectiveness of the proposed physical property extraction modules. Project page: https://physcap.github.io", "arxiv_id": "2608.21031", "arxiv_url": "https://arxiv.org/abs/2608.21031", "authors": ["Chen-Yu Lin", "Jing-Wen Chen", "Hsueh-En Chang", "Hung-An Chen", "Sheng-Hsun Chang", "Chi-Pin Huang", "Fu-En Yang", "Min-Hung Chen", "Yi-Ting Chen", "Yu-Chiang Frank Wang", "Shao-Hua Sun"], "brief": "PhysCaP \u662f\u4e00\u79cd\u7269\u7406\u4fe1\u606f\u589e\u5f3a\u7684 Code-as-Policy \u673a\u5668\u4eba\u667a\u80fd\u4f53\uff0c\u7528\u4e8e\u4e3b\u52a8\u611f\u77e5\u4e0e\u684c\u9762\u64cd\u4f5c\u3002\u5b83\u901a\u8fc7\u4ea4\u4e92\u4ece\u672c\u4f53\u611f\u77e5\u4e2d\u4f30\u8ba1\u7269\u4f53\u8d28\u91cf\u3001\u521a\u5ea6\u7b49\u9690\u85cf\u7269\u7406\u5c5e\u6027\uff0c\u5e76\u51b3\u5b9a\u4f55\u65f6\u63a2\u7d22\u3001\u4f55\u65f6\u505c\u6b62\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21031", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u7269\u7406\u5c5e\u6027\u63d0\u53d6\u6a21\u5757\uff0c\u53ef\u5728\u4e0d\u589e\u52a0\u4f20\u611f\u5668\u7684\u60c5\u51b5\u4e0b\u4ece\u673a\u5668\u4eba\u672c\u4f53\u611f\u77e5\u4f30\u8ba1\u8d28\u91cf\u548c\u521a\u5ea6", "\u91c7\u7528 Planner \u4e0e Prioritizer \u53cc\u667a\u80fd\u4f53\u8bbe\u8ba1\uff0c\u524d\u8005\u63a7\u5236\u63a2\u7d22\u65f6\u673a\uff0c\u540e\u8005\u8fc7\u6ee4\u4e0d\u5408\u7406\u4ea4\u4e92\u5e76\u6309\u542f\u53d1\u5f0f\u5206\u6570\u6392\u5e8f", "\u5728\u771f\u5b9e\u684c\u9762\u4efb\u52a1\u548c LIBERO \u4eff\u771f\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4\u88ab\u52a8\u7b56\u7565\u548c\u6734\u7d20\u4ea4\u4e92\u57fa\u7ebf\uff0c\u7528\u66f4\u5c11\u4ea4\u4e92\u548c\u66f4\u77ed\u65f6\u95f4\u8fbe\u5230\u76f8\u8fd1\u6216\u66f4\u597d\u8868\u73b0"], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba", "\u4e3b\u52a8\u611f\u77e5", "\u7269\u7406\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21031v1", "published_at": "2026-08-21", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21031.png", "title": "PhysCaP: Grounding Code-as-Policy Agent with Physics-Informed Exploration", "tldr": "\u8ba9\u673a\u5668\u4eba\u901a\u8fc7\u7269\u7406\u63a2\u7d22\u66f4\u9ad8\u6548\u611f\u77e5\u7269\u4f53\u5c5e\u6027", "upvotes": 3, "what_it_is": "PhysCaP \u662f\u4e00\u79cd\u7269\u7406\u4fe1\u606f\u589e\u5f3a\u7684 Code-as-Policy \u673a\u5668\u4eba\u667a\u80fd\u4f53\uff0c\u7528\u4e8e\u4e3b\u52a8\u611f\u77e5\u4e0e\u684c\u9762\u64cd\u4f5c\u3002\u5b83\u901a\u8fc7\u4ea4\u4e92\u4ece\u672c\u4f53\u611f\u77e5\u4e2d\u4f30\u8ba1\u7269\u4f53\u8d28\u91cf\u3001\u521a\u5ea6\u7b49\u9690\u85cf\u7269\u7406\u5c5e\u6027\uff0c\u5e76\u51b3\u5b9a\u4f55\u65f6\u63a2\u7d22\u3001\u4f55\u65f6\u505c\u6b62\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f25\u8865\u4e86\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u7b56\u7565\u4f9d\u8d56\u88ab\u52a8\u89c2\u5bdf\u3001\u96be\u4ee5\u63a8\u65ad\u9690\u85cf\u7269\u7406\u5c5e\u6027\u7684\u77ed\u677f\uff0c\u4e3a\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684\u4e3b\u52a8\u611f\u77e5\u63d0\u4f9b\u4e86\u5b9e\u7528\u4e14\u4f4e\u6210\u672c\u7684\u65b9\u6848\u3002"}, {"abstract": "As Retrieval-Augmented Generation (RAG) shifts toward diverse portfolio generation, it is stymied by two critical bottlenecks: flawed measurement of evidence utilization, and suboptimal context budget allocation. We resolve both sequentially. To resolve measurement, we expose a pervasive ``diagnostic illusion\u0027\u0027: standard relevance proxies fail catastrophically on hard negatives. We replace them with an efficient causal leave-one-out probe that accurately isolates generative reliance and formally calibrates the structural dilution of LLM attention. To resolve allocation, we deploy this causal probe in a deconfounded factorial grid. We prove that the prevailing strategy of monolithic context widening is an architectural trap penalized by relevance decay. Instead, allocating compute iteratively across multiple sequential generations drives transformative portfolio recall gains of 16.7--20.5 absolute percentage points, scaling robustly up to 32B models. Finally, we unify these solutions into a deployable closed-loop submodular scheduler. Augmented by an attribution-steered contrastive decoder to override LLM attention inertia, our architecture systematically forces fresh evidence integration. By dominating classical open-loop baselines, we establish sequential, feedback-driven orchestration as the definitive paradigm for generative search. Our code, data, and causal measurement instruments are available at https://github.com/PeiYangLiu/ascp.", "arxiv_id": "2608.23252", "arxiv_url": "https://arxiv.org/abs/2608.23252", "authors": ["Peiyang Liu", "Xi Wang", "Di Liang", "Wei Ye"], "brief": "\u8bba\u6587\u6307\u51faRAG\u4e2d\u5e38\u7528\u76f8\u5173\u6027\u4ee3\u7406\u4f1a\u9ad8\u4f30\u8bc1\u636e\u5229\u7528\uff0c\u63d0\u51fa\u9ad8\u6548\u7684\u56e0\u679c\u7559\u4e00\u63a2\u9488 _it_is": "\u8bba\u6587\u6307\u51faRAG\u4e2d\u5e38\u7528\u76f8\u5173\u6027\u4ee3\u7406\u4f1a\u9ad8\u4f30\u8bc1\u636e\u5229\u7528\uff0c\u63d0\u51fa\u9ad8\u6548\u7684\u56e0\u679c\u7559\u4e00\u63a2\u9488\u6765\u6d4b\u91cf\u751f\u6210\u5bf9\u8bc1\u636e\u7684\u771f\u5b9e\u4f9d\u8d56\u3002\u8fdb\u4e00\u6b65\u57fa\u4e8e\u8be5\u6d4b\u91cf\u6784\u5efa\u95ed\u73af\u5b50\u6a21\u8c03\u5ea6\u5668\uff0c\u5c06\u4e0a\u4e0b\u6587\u9884\u7b97\u5206\u914d\u5230\u591a\u8f6e\u987a\u5e8f\u751f\u6210\u4e2d\uff0c\u4ee5\u63d0\u5347\u751f\u6210\u5f0f\u641c\u7d22\u7684\u7ec4\u5408\u53ec\u56de\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06RAG\u4f18\u5316\u4ece\u9759\u6001\u5806\u53e0\u4e0a\u4e0b\u6587\u8f6c\u5411\u56e0\u679c\u6d4b\u91cf\u9a71\u52a8\u7684\u95ed\u73af\u8c03\u5ea6\uff0c\u65e2\u6311\u6218\u4e86\u201c\u4e0a\u4e0b\u6587\u8d8a\u957f\u8d8a\u597d\u201d\u7684\u5e38\u89c1\u7b56\u7565\uff0c\u4e5f\u4e3a\u751f\u6210\u5f0f\u641c\u7d22\u4e2d\u7684\u8bc1\u636e\u5229\u7528\u8bc4\u4f30\u548c\u9884\u7b97\u5206\u914d\u63d0\u4f9b\u4e86\u53ef\u90e8\u7f72\u6846\u67b6\u3002"}, {"abstract": "Practical deployment of large language models (LLMs) requires families of post-trained variants---instruction-tuned, reasoning-tuned, and chat-style models---each at multiple sizes to meet diverse latency and memory budgets. Producing each (variant, size) pair independently is prohibitive, so model families typically span only a handful of coarse-grained sizes per post-trained variant. Boomerang distillation (Kangaslahti et al., 2026) reduces this cost along the size axis for base models. Through model size interpolation, it constructs models of intermediate sizes from a single teacher-student pair without additional training. However, it still treats each post-trained variant as a separate object of optimization. We introduce ADAPT---Amortized Distillation Across Post-Trained LLMs---a framework for amortizing distillation across both axes of a model family: size and post-training variant, producing $L \\times K$ models for $L$ interpolated sizes across $K$ post-trained variants with a single distillation run. ADAPT combines two components. First, a two-phase distillation procedure constructs post-trained students through pre-training alignment and supervised fine-tuning distillation, enabling smooth size--performance interpolation on generation and reasoning tasks. Second, weight-delta initialization approximates this construction across post-trained variants by transferring the distillation-induced weight change from the base model to students initialized from different post-trained variants. The resulting continuum of interpolated models also enables adaptive model-size selection at inference time, improving the compute--accuracy trade-off for long-form reasoning tasks.", "arxiv_id": "2608.22854", "arxiv_url": "https://arxiv.org/abs/2608.22854", "authors": ["Yan Zhou", "Sara Kangaslahti", "Jonathan Geuter", "Nihal V. Nayak", "Marco Fumero", "Francesco Locatello", "David Alvarez-Melis"], "brief": "\u8bba\u6587\u63d0\u51fa ADAPT\uff0c\u4e00\u79cd\u5728\u6a21\u578b\u5c3a\u5bf8\u548c\u540e\u8bad\u7ec3\u53d8\u4f53\u4e24\u6761\u8f74\u4e0a\u540c\u65f6\u644a\u9500\u84b8\u998f\u6210\u672c\u7684\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4e00\u6b21\u84b8\u998f\u8fd0\u884c\uff0c\u4e3a\u591a\u4e2a\u63d2\u503c\u5c3a\u5bf8\u548c\u591a\u4e2a\u6307\u4ee4/\u63a8\u7406/\u804a\u5929\u7b49\u540e\u8bad\u7ec3\u53d8\u4f53\u751f\u6210\u6574\u5957 LLM\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22854", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7ed3\u5408\u9884\u8bad\u7ec3\u5bf9\u9f50\u4e0e\u76d1\u7763\u5fae\u8c03\u84b8\u998f\u7684\u4e24\u9636\u6bb5\u6d41\u7a0b\uff0c\u4f7f\u4e0d\u540c\u5c3a\u5bf8\u6a21\u578b\u5728\u751f\u6210\u4e0e\u63a8\u7406\u4efb\u52a1\u4e0a\u4fdd\u6301\u5e73\u6ed1\u7684\u6027\u80fd\u63d2\u503c", "\u4f7f\u7528 weight-delta initialization\uff0c\u5c06\u57fa\u7840\u6a21\u578b\u84b8\u998f\u4ea7\u751f\u7684\u6743\u91cd\u53d8\u5316\u8fc1\u79fb\u5230\u4e0d\u540c\u540e\u8bad\u7ec3\u53d8\u4f53\u7684\u5b66\u751f\u6a21\u578b\u4e0a", "\u652f\u6301\u63a8\u7406\u65f6\u81ea\u9002\u5e94\u9009\u62e9\u6a21\u578b\u5c3a\u5bf8\uff0c\u5728\u957f\u94fe\u8def\u63a8\u7406\u4efb\u52a1\u4e2d\u6539\u5584\u8ba1\u7b97\u91cf\u4e0e\u51c6\u786e\u7387\u6743\u8861"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22854v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Thinking at the Right Size: Amortized Distillation Across Post-Trained LLMs", "tldr": "\u4e00\u6b21\u84b8\u998f\u751f\u6210\u591a\u5c3a\u5bf8\u3001\u591a\u53d8\u4f53LLM\u5bb6\u65cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ADAPT\uff0c\u4e00\u79cd\u5728\u6a21\u578b\u5c3a\u5bf8\u548c\u540e\u8bad\u7ec3\u53d8\u4f53\u4e24\u6761\u8f74\u4e0a\u540c\u65f6\u644a\u9500\u84b8\u998f\u6210\u672c\u7684\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4e00\u6b21\u84b8\u998f\u8fd0\u884c\uff0c\u4e3a\u591a\u4e2a\u63d2\u503c\u5c3a\u5bf8\u548c\u591a\u4e2a\u6307\u4ee4/\u63a8\u7406/\u804a\u5929\u7b49\u540e\u8bad\u7ec3\u53d8\u4f53\u751f\u6210\u6574\u5957 LLM\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u6a21\u578b\u5bb6\u65cf\u6784\u5efa\u4ece\u9010\u4e2a\u8bad\u7ec3\u6269\u5c55\u5230\u4e00\u6b21\u6027\u644a\u9500\u751f\u6210\uff0c\u53ef\u663e\u8457\u964d\u4f4e\u591a\u5c3a\u5bf8\u3001\u591a\u540e\u8bad\u7ec3\u7248\u672c LLM \u7684\u90e8\u7f72\u6210\u672c\uff0c\u5e76\u4e3a\u52a8\u6001\u8ba1\u7b97\u9884\u7b97\u4e0b\u7684\u6a21\u578b\u9009\u62e9\u63d0\u4f9b\u65b0\u673a\u5236\u3002"}, {"abstract": "Mixed-integer programming (MIP) lies at the core of operations research and industrial optimization. While large language models (LLMs) have recently shown promise in automated MIP modeling from natural language, they prioritize semantic correctness but overlook formulation strength, severely bottlenecking the efficiency of downstream solvers. We propose FormuEvo, an LLM-guided evolutionary framework for automated discovery of solver-efficient MIP formulations. FormuEvo frames MIP formulation design as evolutionary optimization over the symbolic space of MIP formulations, represented as executable modeling programs, by iteratively generating, evaluating, and selecting stronger candidates via LLM-driven crossover, mutation, and repair operations. To move beyond blind exploration, FormuEvo introduces a solver-informed diagnosis mechanism that exploits fine-grained solver statistics as verbal gradients for targeted refinement. Additionally, a structured memory abstracts prior experience into reusable modeling strategies, avoiding redundant exploration while enabling zero-shot transfer to unseen problems and bootstrapping smaller LLMs. Experiments across diverse linear and non-linear problems demonstrate that FormuEvo discovers formulations that significantly outperform both expert-designed formulations and existing LLM-based approaches, accelerating solvers by up to 5.5$\\times$, with distilled knowledge transferring effectively across problems and model scales.", "arxiv_id": "2608.23353", "arxiv_url": "https://arxiv.org/abs/2608.23353", "authors": ["Haofeng Yuan", "Jianing Peng", "Jieyi Bi", "Ni Zhang", "Shiji Song", "Zhiguang Cao"], "brief": "FormuEvo \u5c06\u6df7\u5408\u6574\u6570\u89c4\u5212\uff08MIP\uff09\u5efa\u6a21\u89c6\u4e3a\u7b26\u53f7\u7a7a\u95f4\u4e2d\u7684\u8fdb\u5316\u4f18\u5316\u95ee\u9898\uff0c\u7528 LLM \u5bf9\u53ef\u6267\u884c\u5efa\u6a21\u7a0b\u5e8f\u8fdb\u884c\u4ea4\u53c9\u3001\u53d8\u5f02\u3001\u4fee\u590d\u4e0e\u9009\u62e9\u3002\u5b83\u7ed3\u5408\u6c42\u89e3\u5668\u7edf\u8ba1\u53cd\u9988\u548c\u7ed3\u6784\u5316\u8bb0\u5fc6\uff0c\u81ea\u52a8\u53d1\u73b0\u66f4\u5229\u4e8e\u6c42\u89e3\u5668\u9ad8\u6548\u6c42\u89e3\u7684 MIP formulation\u3002", "categories": ["cs.CL", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23353", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5f15\u5165 LLM \u5f15\u5bfc\u7684\u8fdb\u5316\u6846\u67b6\uff0c\u5728 MIP formulation \u7684\u7a0b\u5e8f\u8868\u793a\u7a7a\u95f4\u4e2d\u8fed\u4ee3\u751f\u6210\u3001\u8bc4\u4f30\u548c\u7b5b\u9009\u5019\u9009\u6a21\u578b", "\u5229\u7528\u6c42\u89e3\u5668\u7684\u7ec6\u7c92\u5ea6\u7edf\u8ba1\u4fe1\u606f\u4f5c\u4e3a\u201c\u8bed\u8a00\u5316\u68af\u5ea6\u201d\uff0c\u6307\u5bfc\u9488\u5bf9\u6027\u6539\u5199\uff0c\u800c\u975e\u76f2\u76ee\u641c\u7d22", "\u7ed3\u6784\u5316\u8bb0\u5fc6\u6c89\u6dc0\u53ef\u590d\u7528\u5efa\u6a21\u7b56\u7565\uff0c\u53ef\u8fc1\u79fb\u5230\u672a\u89c1\u95ee\u9898\u5e76\u5e2e\u52a9\u5c0f\u6a21\u578b\u63d0\u5347\u5efa\u6a21\u80fd\u529b\uff1b\u5b9e\u9a8c\u4e2d\u6700\u9ad8\u52a0\u901f\u6c42\u89e3\u5668 5.5 \u500d"], "keywords": ["\u667a\u80fd\u4f53", "\u8fd0\u7b79\u4f18\u5316", "\u4ee3\u7801\u751f\u6210", "\u8fdb\u5316\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23353v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FormuEvo: LLM-Guided Evolution for Discovering Solver-Efficient Mixed-Integer Programming Formulations", "tldr": "\u7528LLM\u8fdb\u5316\u641c\u7d22\u9ad8\u6548MIP\u5efa\u6a21\u516c\u5f0f", "upvotes": 0, "what_it_is": "FormuEvo \u5c06\u6df7\u5408\u6574\u6570\u89c4\u5212\uff08MIP\uff09\u5efa\u6a21\u89c6\u4e3a\u7b26\u53f7\u7a7a\u95f4\u4e2d\u7684\u8fdb\u5316\u4f18\u5316\u95ee\u9898\uff0c\u7528 LLM \u5bf9\u53ef\u6267\u884c\u5efa\u6a21\u7a0b\u5e8f\u8fdb\u884c\u4ea4\u53c9\u3001\u53d8\u5f02\u3001\u4fee\u590d\u4e0e\u9009\u62e9\u3002\u5b83\u7ed3\u5408\u6c42\u89e3\u5668\u7edf\u8ba1\u53cd\u9988\u548c\u7ed3\u6784\u5316\u8bb0\u5fc6\uff0c\u81ea\u52a8\u53d1\u73b0\u66f4\u5229\u4e8e\u6c42\u89e3\u5668\u9ad8\u6548\u6c42\u89e3\u7684 MIP formulation\u3002", "why_notable": "\u8bba\u6587\u4ece\u201c\u8bed\u4e49\u6b63\u786e\u7684\u81ea\u52a8\u5efa\u6a21\u201d\u63a8\u8fdb\u5230\u201c\u6c42\u89e3\u5668\u53cb\u597d\u7684\u81ea\u52a8\u5efa\u6a21\u201d\uff0c\u76f4\u63a5\u89e6\u53ca\u5de5\u4e1a\u4f18\u5316\u4e2d formulation \u5f3a\u5f31\u51b3\u5b9a\u6c42\u89e3\u6548\u7387\u7684\u5173\u952e\u74f6\u9888\uff0c\u5c55\u793a\u4e86 LLM \u4e0e\u4f20\u7edf\u4f18\u5316\u6c42\u89e3\u5668\u95ed\u73af\u7ed3\u5408\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Large language models are increasingly expected to execute complex workflows whose success depends on maintaining interdependent constraints and producing artifacts that satisfy strict end-to-end verification. Yet successful execution experience is typically lost after a single run, forcing subsequent models to rediscover strategies and failure modes from scratch. We study whether such experience can instead be externalized and reused through EvoMap, where verifier-confirmed execution trajectories are consolidated into structured Gene. To evaluate this setting, we introduce the Long-Workflow Benchmark (LongWoF-Bench), comprising 778 machine-verifiable tasks across code generation, agent-environment synthesis, mathematical reasoning, and rule following. On the 252 tasks with verifier-confirmed Opus trajectories, evolved EvoMap Gene outperform Skill across all seven evaluated models by 8.7-15.5 percentage points, with the gains extending to consumer models from different model families. In contrast, reference-distilled Gene do not exhibit the same advantage, indicating that compact representation alone is insufficient and that Gene utility is closely associated with verified experience provenance. For Claude Opus, Gene reuse also completes 39 more tasks than Skill while reducing solve-time token consumption by 9.9%. Together, these results show that verified execution experience can be retained and shared as a reusable external resource, enabling models to improve long-workflow completion without repeatedly paying the full cost of experience discovery.", "arxiv_id": "2608.23200", "arxiv_url": "https://arxiv.org/abs/2608.23200", "authors": ["Xiao Zhang", "Qumeng Sun", "Jihao Li", "Yiming Ren", "Xiang Liu", "Haoyang Zhang", "Junjie Wang"], "brief": "\u8bba\u6587\u63d0\u51fa LongWoF-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30 EvoMap Gene \u5728\u957f\u5de5\u4f5c\u6d41\u4efb\u52a1\u4e2d\u7684\u590d\u7528\u6548\u679c\u3002\u5b83\u5c06\u7ecf\u9a8c\u8bc1\u5668\u786e\u8ba4\u7684\u6267\u884c\u8f68\u8ff9\u538b\u7f29\u4e3a\u7ed3\u6784\u5316 Gene\uff0c\u8ba9\u540e\u7eed\u6a21\u578b\u501f\u7528\u6210\u529f\u7ecf\u9a8c\u5b8c\u6210\u590d\u6742\u4efb\u52a1\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23200", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["LongWoF-Bench \u5305\u542b 778 \u4e2a\u53ef\u673a\u5668\u9a8c\u8bc1\u4efb\u52a1\uff0c\u8986\u76d6\u4ee3\u7801\u751f\u6210\u3001\u667a\u80fd\u4f53\u73af\u5883\u5408\u6210\u3001\u6570\u5b66\u63a8\u7406\u548c\u89c4\u5219\u9075\u5faa", "\u5728 252 \u4e2a\u6709 Opus \u9a8c\u8bc1\u8f68\u8ff9\u7684\u4efb\u52a1\u4e0a\uff0cEvoMap Gene \u76f8\u6bd4 Skill \u8ba9 7 \u4e2a\u6a21\u578b\u63d0\u5347 8.7-15.5 \u4e2a\u767e\u5206\u70b9", "Gene \u590d\u7528\u8ba9 Claude Opus \u591a\u5b8c\u6210 39 \u4e2a\u4efb\u52a1\uff0c\u540c\u65f6\u89e3\u9898 token \u6d88\u8017\u964d\u4f4e 9.9%"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u6d41\u7a0b\u4efb\u52a1", "\u7ecf\u9a8c\u590d\u7528", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23200v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "LongWoF-Bench: Evaluating EvoMap Genes for Verifiable Long-Workflow Tasks", "tldr": "\u7528\u53ef\u9a8c\u8bc1\u7ecf\u9a8c\u57fa\u56e0\u63d0\u5347\u957f\u6d41\u7a0b\u4efb\u52a1\u5b8c\u6210\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LongWoF-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30 EvoMap Gene \u5728\u957f\u5de5\u4f5c\u6d41\u4efb\u52a1\u4e2d\u7684\u590d\u7528\u6548\u679c\u3002\u5b83\u5c06\u7ecf\u9a8c\u8bc1\u5668\u786e\u8ba4\u7684\u6267\u884c\u8f68\u8ff9\u538b\u7f29\u4e3a\u7ed3\u6784\u5316 Gene\uff0c\u8ba9\u540e\u7eed\u6a21\u578b\u501f\u7528\u6210\u529f\u7ecf\u9a8c\u5b8c\u6210\u590d\u6742\u4efb\u52a1\u3002", "why_notable": "\u8be5\u7814\u7a76\u8868\u660e\uff0c\u957f\u6d41\u7a0b\u4efb\u52a1\u4e2d\u7684\u6210\u529f\u6267\u884c\u7ecf\u9a8c\u53ef\u4ee5\u88ab\u5916\u90e8\u5316\u3001\u9a8c\u8bc1\u5e76\u8de8\u6a21\u578b\u590d\u7528\uff0c\u4e0d\u5fc5\u6bcf\u6b21\u91cd\u65b0\u63a2\u7d22\u7b56\u7565\u4e0e\u5931\u8d25\u6a21\u5f0f\uff1b\u8fd9\u5bf9\u6784\u5efa\u66f4\u9ad8\u6548\u3001\u53ef\u8fc1\u79fb\u7684 LLM \u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agent Skills are reusable procedural modules that are increasingly injected into coding-agent sessions to encode framework conventions, anti-patterns, and reusable tools. However, because each injected Skill expands the prompt of every query, an effective Skill benchmark must determine not only whether an agent can solve a task, but whether the Skill should have been injected at all. We introduce WebDev-Skills-Bench and use it for a controlled empirical study of 31 public WebDev Skills on 50 Web-Bench projects and 1,000 ordered tasks. The benchmark compares four matched conditions, including a length-matched irrelevant control and leave-one-out component ablations. To isolate Skill effects from prompt-length artifacts, we place only SKILL.md in the prompt while mounting auxiliary files into the agent workspace. Across four models, target Skill injection reduces mean Pass@2 by 1.3% to 4.2%, lowers task completion depth, and increases token cost by 72% to 394%, with gains in only 17% to 36% of Skill-project pairs. Length-matched controls reveal two failure modes: some models are length-distracted, where an equally long irrelevant Skill reproduces most of the loss, while others are content-misled, where prompt length is neutral but Skill content still lowers Pass@2 by 1.1% to 1.4%. Further analysis shows that losses concentrate on easy early tasks, Skill rankings transfer weakly across models, and anti-pattern rules outperform example-heavy content within helpful Skills. These findings recast a matched Skill as a hypothesis about a particular Skill-project-model triple rather than a portable asset, reframing injection as a per-deployment routing decision and making length-matched controls and per-model audits a minimum standard for Agent-Skill evaluation.", "arxiv_id": "2608.23067", "arxiv_url": "https://arxiv.org/abs/2608.23067", "authors": ["Ziyue Yang", "Fan Ding"], "brief": "\u8bba\u6587\u63d0\u51fa WebDev-Skills-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u4e2d\u6ce8\u5165\u7684 Web \u5f00\u53d1 Skill \u662f\u5426\u771f\u6b63\u6709\u5e2e\u52a9\u3002\u4f5c\u8005\u5728 50 \u4e2a Web-Bench \u9879\u76ee\u30011000 \u4e2a\u6709\u5e8f\u4efb\u52a1\u548c 31 \u4e2a\u516c\u5f00 Skill \u4e0a\uff0c\u5bf9\u56db\u7c7b\u5339\u914d\u6761\u4ef6\u8fdb\u884c\u4e86\u53d7\u63a7\u5b9e\u9a8c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23067", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u76ee\u6807 Skill \u6ce8\u5165\u5728\u56db\u4e2a\u6a21\u578b\u4e0a\u4f7f\u5e73\u5747 Pass@2 \u4e0b\u964d 1.3% \u81f3 4.2%\uff0c\u540c\u65f6 token \u6210\u672c\u589e\u52a0 72% \u81f3 394%", "\u53ea\u6709 17% \u81f3 36% \u7684 Skill-\u9879\u76ee\u7ec4\u5408\u5e26\u6765\u6536\u76ca\uff0c\u4e14 Skill \u6392\u540d\u5728\u4e0d\u540c\u6a21\u578b\u95f4\u8fc1\u79fb\u6027\u8f83\u5f31", "\u957f\u5ea6\u5339\u914d\u65e0\u5173\u5bf9\u7167\u63ed\u793a\u4e24\u7c7b\u5931\u8d25\uff1a\u6a21\u578b\u53ef\u80fd\u88ab\u957f\u63d0\u793a\u5206\u6563\u6ce8\u610f\u529b\uff0c\u6216\u88ab Skill \u5185\u5bb9\u8bef\u5bfc"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u63d0\u793a\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23067v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Signal or Noise? A Benchmark Study of Agent Skills in Web Development", "tldr": "\u7cfb\u7edf\u8bc4\u6d4b\u53d1\u73b0Web\u5f00\u53d1Skill\u5e38\u5f0a\u5927\u4e8e\u5229", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa WebDev-Skills-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u4e2d\u6ce8\u5165\u7684 Web \u5f00\u53d1 Skill \u662f\u5426\u771f\u6b63\u6709\u5e2e\u52a9\u3002\u4f5c\u8005\u5728 50 \u4e2a Web-Bench \u9879\u76ee\u30011000 \u4e2a\u6709\u5e8f\u4efb\u52a1\u548c 31 \u4e2a\u516c\u5f00 Skill \u4e0a\uff0c\u5bf9\u56db\u7c7b\u5339\u914d\u6761\u4ef6\u8fdb\u884c\u4e86\u53d7\u63a7\u5b9e\u9a8c\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u201c\u7ed9\u7f16\u7801\u667a\u80fd\u4f53\u6ce8\u5165\u66f4\u591a\u53ef\u590d\u7528\u6280\u80fd\u4e00\u5b9a\u66f4\u597d\u201d\u7684\u5047\u8bbe\uff0c\u5f3a\u8c03 Skill \u5e94\u6309\u9879\u76ee\u3001\u6a21\u578b\u548c\u90e8\u7f72\u573a\u666f\u52a8\u6001\u8def\u7531\uff0c\u5e76\u63d0\u51fa\u957f\u5ea6\u5339\u914d\u5bf9\u7167\u548c\u9010\u6a21\u578b\u5ba1\u8ba1\u5e94\u6210\u4e3a Agent-Skill \u8bc4\u6d4b\u7684\u57fa\u672c\u6807\u51c6\u3002"}, {"abstract": "Diffusion language models (DLMs) alleviate the inherent latency bottleneck of autoregressive (AR) large language models (LLMs), but their degraded generation quality limits practical applicability. Although knowledge distillation (KD) can be a promising direction for improving performance, we empirically find that naively applying conventional KD yields only marginal gains, or even degrades generation quality. Based on these observations, we propose a novel self-distillation framework for DLMs, namely SelFusion. To enable effective KD without an external teacher model, SelFusion performs two forward passes with different masking levels, defining the hard mode with a larger masking probability and the easy mode with a smaller masking probability. However, the easy mode is not always more accurate than the hard mode and can be overconfident on incorrect tokens. Thus, we introduce bidirectional KD between the two modes, which can dynamically determine the distillation direction based on token-level correctness. Experimental results on instruction-following tasks show that the proposed self-distillation substantially outperforms other KD methods with external LLM and DLM teachers. In many configurations, the student trained with SelFusion even surpasses the performance of the LLM teacher, providing a practical path toward improving DLM generation quality. Source code can be found at https://github.com/scai-research/SelFusion_official", "arxiv_id": "2608.22898", "arxiv_url": "https://arxiv.org/abs/2608.22898", "authors": ["Hyeongsoo Lim", "Jinyoung Kim", "Eunseo Seo", "Minho Jang", "Jiwon Yoon"], "brief": "\u8bba\u6587\u63d0\u51fa SelFusion\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u81ea\u84b8\u998f\u6846\u67b6\uff0c\u65e0\u9700\u5916\u90e8\u6559\u5e08\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e0d\u540c\u63a9\u7801\u5f3a\u5ea6\u7684\u4e24\u6b21\u524d\u5411\u4f20\u64ad\u6784\u9020\u201c\u56f0\u96be/\u7b80\u5355\u201d\u6a21\u5f0f\uff0c\u5e76\u5728\u4e24\u8005\u95f4\u8fdb\u884c\u52a8\u6001\u53cc\u5411\u84b8\u998f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22898", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u4f20\u7edf\u77e5\u8bc6\u84b8\u998f\u76f4\u63a5\u7528\u4e8e\u6269\u6563\u8bed\u8a00\u6a21\u578b\u6536\u76ca\u6709\u9650\uff0c\u751a\u81f3\u53ef\u80fd\u964d\u4f4e\u751f\u6210\u8d28\u91cf", "\u91c7\u7528\u9ad8\u63a9\u7801\u6982\u7387\u7684\u56f0\u96be\u6a21\u5f0f\u4e0e\u4f4e\u63a9\u7801\u6982\u7387\u7684\u7b80\u5355\u6a21\u5f0f\u8fdb\u884c\u81ea\u76d1\u7763\u5f0f\u84b8\u998f", "\u6839\u636e token \u7ea7\u6b63\u786e\u6027\u52a8\u6001\u51b3\u5b9a\u84b8\u998f\u65b9\u5411\uff0c\u907f\u514d\u7b80\u5355\u6a21\u5f0f\u5bf9\u9519\u8bef token \u8fc7\u5ea6\u81ea\u4fe1"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u81ea\u84b8\u998f", "\u6307\u4ee4\u8ddf\u968f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22898v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SelFusion: Self-distillation for Diffusion Language Models", "tldr": "\u7528\u81ea\u84b8\u998f\u663e\u8457\u63d0\u5347\u6269\u6563\u8bed\u8a00\u6a21\u578b\u8d28\u91cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SelFusion\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u81ea\u84b8\u998f\u6846\u67b6\uff0c\u65e0\u9700\u5916\u90e8\u6559\u5e08\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e0d\u540c\u63a9\u7801\u5f3a\u5ea6\u7684\u4e24\u6b21\u524d\u5411\u4f20\u64ad\u6784\u9020\u201c\u56f0\u96be/\u7b80\u5355\u201d\u6a21\u5f0f\uff0c\u5e76\u5728\u4e24\u8005\u95f4\u8fdb\u884c\u52a8\u6001\u53cc\u5411\u84b8\u998f\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u63d0\u5347\u6269\u6563\u8bed\u8a00\u6a21\u578b\u751f\u6210\u8d28\u91cf\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\uff0c\u5728\u6307\u4ee4\u8ddf\u968f\u4efb\u52a1\u4e2d\u8d85\u8fc7\u5916\u90e8 LLM/DLM \u6559\u5e08\u84b8\u998f\u65b9\u6cd5\uff0c\u90e8\u5206\u8bbe\u7f6e\u4e0b\u5b66\u751f\u6a21\u578b\u751a\u81f3\u8d85\u8d8a LLM \u6559\u5e08\u3002"}, {"abstract": "Large language models (LLMs) excel at text understanding and generation, yet still struggle to reliably understand and apply externally provided procedural rules at scale. To evaluate this capability, we introduce RuleWorld, a large-scale benchmark that reformulates rules as globally reusable abstract units rather than instance-specific facts. In RuleWorld, several scenarios, including single-rule, parallel multi-rule, and multi-hop reasoning, are settled for comprehensive evaluation. We further propose DynaRule, an end-to-end framework that injects the given rules into the KV cache and turns retrieval into an internal, learnable, step-wise process. Specifically, DynaRule employs Stacked Step-Level Attention Training with a special \u003csearch\u003e token to enable dynamic rule re-attention and updating during inference. In this way, the model can re-attend to the most relevant rules at each step, dynamically replacing outdated ones to support more stable multi-step reasoning. Experiments on RuleWorld show that existing LLMs face challenges under large rule pools, while DynaRule improves average QA accuracy by up to 19 points and achieves over 85% Recall@1 at 10K rules, outperforming strong baselines by large margins. We make our code and dataset available here: https://github.com/SharkSpicy-NLP/Beyond-Factual-Knowledge.", "arxiv_id": "2608.22753", "arxiv_url": "https://arxiv.org/abs/2608.22753", "authors": ["Bohan Yu", "Pengfei Cao", "Chen Han", "Chenxi Zhou", "Zhiheng Zhang", "Zhiyang Xie", "Wenhao Teng", "Xiangwen Liao", "Jun Zhao", "Kang Liu"], "brief": "\u8bba\u6587\u63d0\u51fa\u5927\u89c4\u6a21\u57fa\u51c6 RuleWorld\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5bf9\u5916\u90e8\u7a0b\u5e8f\u6027\u89c4\u5219\u7684\u9010\u6b65\u7406\u89e3\u4e0e\u5e94\u7528\u80fd\u529b\u3002\u540c\u65f6\u63d0\u51fa DynaRule\uff0c\u5c06\u89c4\u5219\u6ce8\u5165 KV cache\uff0c\u5e76\u901a\u8fc7\u53ef\u5b66\u4e60\u7684\u9010\u6b65\u68c0\u7d22\u673a\u5236\u652f\u6301\u591a\u6b65\u89c4\u5219\u63a8\u7406\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22753", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["RuleWorld \u5c06\u89c4\u5219\u5efa\u6a21\u4e3a\u53ef\u5168\u5c40\u590d\u7528\u7684\u62bd\u8c61\u5355\u5143\uff0c\u8986\u76d6\u5355\u89c4\u5219\u3001\u5e76\u884c\u591a\u89c4\u5219\u548c\u591a\u8df3\u63a8\u7406\u7b49\u573a\u666f", "DynaRule \u4f7f\u7528\u5e26 \u003csearch\u003e token \u7684 Stacked Step-Level Attention Training\uff0c\u4f7f\u6a21\u578b\u5728\u63a8\u7406\u6bcf\u4e00\u6b65\u52a8\u6001\u91cd\u65b0\u5173\u6ce8\u76f8\u5173\u89c4\u5219", "\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u4e07\u7ea7\u89c4\u5219\u6c60\u4e0b DynaRule \u8fbe\u5230\u8d85\u8fc785%\u7684 Recall@1\uff0c\u5e73\u5747\u95ee\u7b54\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u534719\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u89c4\u5219\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u68c0\u7d22\u589e\u5f3a", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22753v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Factual Knowledge: Benchmarking and Learning Step-Level Procedural Rule Reasoning in Large Language Models", "tldr": "RuleWorld\u8bc4\u6d4b\u7a0b\u5e8f\u89c4\u5219\u63a8\u7406\uff0cDynaRule\u663e\u8457\u63d0\u5347\u8868\u73b0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5927\u89c4\u6a21\u57fa\u51c6 RuleWorld\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5bf9\u5916\u90e8\u7a0b\u5e8f\u6027\u89c4\u5219\u7684\u9010\u6b65\u7406\u89e3\u4e0e\u5e94\u7528\u80fd\u529b\u3002\u540c\u65f6\u63d0\u51fa DynaRule\uff0c\u5c06\u89c4\u5219\u6ce8\u5165 KV cache\uff0c\u5e76\u901a\u8fc7\u53ef\u5b66\u4e60\u7684\u9010\u6b65\u68c0\u7d22\u673a\u5236\u652f\u6301\u591a\u6b65\u89c4\u5219\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u4e8b\u5b9e\u77e5\u8bc6\u6269\u5c55\u5230\u7a0b\u5e8f\u6027\u89c4\u5219\u63a8\u7406\uff0c\u63ed\u793a\u73b0\u6709 LLM \u5728\u5927\u89c4\u6a21\u89c4\u5219\u6c60\u4e0b\u7684\u77ed\u677f\uff0c\u5e76\u63d0\u4f9b\u4e86\u4e00\u79cd\u65e0\u9700\u5916\u90e8\u663e\u5f0f\u68c0\u7d22\u3001\u53ef\u7aef\u5230\u7aef\u5b66\u4e60\u7684\u89c4\u5219\u91cd\u6ce8\u610f\u673a\u5236\uff0c\u5bf9\u590d\u6742\u5236\u5ea6\u3001\u6d41\u7a0b\u548c\u89c4\u8303\u95ee\u7b54\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "World action models (WAMs) have recently gained increasing attention as a framework for jointly modeling scene evolution and ego actions in autonomous driving. Most existing WAMs learn scene dynamics in pixel space by combining a video-generation backbone for future-observation prediction with an action head for ego-trajectory prediction. Pixels, however, provide only an indirect representation of these dynamics: they entangle geometry and motion with appearance, texture, and illumination, forcing the model to infer three-dimensional transformations from two-dimensional observations. We argue that geometry, represented by point clouds, offers a more natural state space for driving because it explicitly captures spatial structure and the rigid and non-rigid transformations that govern scene evolution while directly aligning with the space in which driving actions are executed. Building on this insight, we introduce \\textbf{GeoWAM}, a visual geometry world action model for autonomous driving. Rather than predicting future images, GeoWAM is pretrained to forecast future scene geometry, yielding representations that jointly encode spatial structure and temporal evolution. A geometry-conditioned action head then leverages these learned geometric dynamics to predict future ego trajectories. Extensive open-loop and closed-loop evaluations show that visual geometry world modeling yields substantially stronger driving policies than image-based alternatives, establishing future-geometry prediction as an effective pretraining objective for autonomous driving.", "arxiv_id": "2608.23486", "arxiv_url": "https://arxiv.org/abs/2608.23486", "authors": ["Yiren Lu", "Xin Ye", "Jiaming Liu", "Jin Yao", "Yi-chung Chen", "Liam Merino", "Dhruva Dixith Kurra", "Min Cai", "Tom Lampo", "Yu Yin", "Danhua Guo", "Burhan Yaman"], "brief": "\u8bba\u6587\u63d0\u51fa GeoWAM\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u7684\u89c6\u89c9\u51e0\u4f55\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u3002\u5b83\u4e0d\u9884\u6d4b\u672a\u6765\u56fe\u50cf\uff0c\u800c\u662f\u9884\u8bad\u7ec3\u6a21\u578b\u9884\u6d4b\u672a\u6765\u70b9\u4e91\u51e0\u4f55\uff0c\u5e76\u7528\u51e0\u4f55\u6761\u4ef6\u52a8\u4f5c\u5934\u9884\u6d4b\u81ea\u8f66\u672a\u6765\u8f68\u8ff9\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23486", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u70b9\u4e91\u51e0\u4f55\u4f5c\u4e3a\u4e16\u754c\u5efa\u6a21\u72b6\u6001\u7a7a\u95f4\uff0c\u663e\u5f0f\u8868\u793a\u4e09\u7ef4\u7a7a\u95f4\u7ed3\u6784\u3001\u521a\u4f53\u4e0e\u975e\u521a\u4f53\u8fd0\u52a8\uff0c\u907f\u514d\u50cf\u7d20\u7a7a\u95f4\u4e2d\u5916\u89c2\u3001\u7eb9\u7406\u3001\u5149\u7167\u7684\u5e72\u6270\u3002", "\u901a\u8fc7\u672a\u6765\u573a\u666f\u51e0\u4f55\u9884\u6d4b\u8fdb\u884c\u9884\u8bad\u7ec3\uff0c\u4f7f\u8868\u793a\u540c\u65f6\u7f16\u7801\u7a7a\u95f4\u7ed3\u6784\u4e0e\u65f6\u95f4\u6f14\u5316\u3002", "\u5728\u5f00\u73af\u548c\u95ed\u73af\u8bc4\u6d4b\u4e2d\uff0c\u76f8\u6bd4\u57fa\u4e8e\u56fe\u50cf\u751f\u6210\u7684 WAM\uff0cGeoWAM \u5b66\u5230\u7684\u9a7e\u9a76\u7b56\u7565\u8868\u73b0\u66f4\u5f3a\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u4e16\u754c\u6a21\u578b", "\u4e09\u7ef4\u89c6\u89c9", "\u8f68\u8ff9\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23486v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GeoWAM: Visual Geometry World Action Models for Autonomous Driving", "tldr": "\u7528\u672a\u6765\u51e0\u4f55\u9884\u6d4b\u63d0\u5347\u81ea\u52a8\u9a7e\u9a76\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GeoWAM\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u7684\u89c6\u89c9\u51e0\u4f55\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u3002\u5b83\u4e0d\u9884\u6d4b\u672a\u6765\u56fe\u50cf\uff0c\u800c\u662f\u9884\u8bad\u7ec3\u6a21\u578b\u9884\u6d4b\u672a\u6765\u70b9\u4e91\u51e0\u4f55\uff0c\u5e76\u7528\u51e0\u4f55\u6761\u4ef6\u52a8\u4f5c\u5934\u9884\u6d4b\u81ea\u8f66\u672a\u6765\u8f68\u8ff9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u81ea\u52a8\u9a7e\u9a76\u4e16\u754c\u6a21\u578b\u7684\u6838\u5fc3\u9884\u6d4b\u76ee\u6807\u4ece\u672a\u6765\u56fe\u50cf\u8f6c\u5411\u672a\u6765\u51e0\u4f55\uff0c\u66f4\u8d34\u8fd1\u8f66\u8f86\u51b3\u7b56\u4e0e\u63a7\u5236\u6240\u5728\u7684\u4e09\u7ef4\u7a7a\u95f4\uff0c\u5c55\u793a\u4e86\u51e0\u4f55\u4e16\u754c\u5efa\u6a21\u4f5c\u4e3a\u9884\u8bad\u7ec3\u76ee\u6807\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Video generation is progressing beyond isolated clips toward long-form narratives and interactive worlds, requiring models to preserve identities, follow user controls, and remain stable over extended rollouts. We present JoyAI-Echo-1.5, a unified audio-visual generation system with two purpose-built variants. The long-video variant introduces composable cross-shot memory that aggregates visual evidence across multiple prior shots and speaker cues derived from speech-filtered full-shot audio, enabling persistent character appearance and voice identity across flexible combinations of text, image, and memory conditioning. The world-model variant converts heterogeneous navigation inputs into calibrated metric 6-DoF camera trajectories and injects them through a geometry-aware conditioning pathway, enabling controller-agnostic interaction across flexible viewpoints. To support efficient long-horizon generation, we transform a bidirectional audio-visual backbone into a causal few-step generator using progressive teacher forcing and short- and long-horizon Self-Gradient Forcing on self-generated rollouts. Experiments demonstrate strong performance in both settings. JoyAI-Echo-1.5 achieves improvements over existing long-video baselines in cross-shot consistency, visual quality, text alignment, and speech fidelity. Its world-model variant ranks first on WBench, with an average score of 81.7, and achieves leading visual quality and long-horizon persistence on SANA-WM-Bench. Together, these results indicate that memory, geometric control, and rollout-aware training provide a practical foundation for generating coherent stories and continuously evolving interactive worlds. Project page: https://echo-team-joy-future-academy-jd.github.io/Echo-1.5-Page/.", "arxiv_id": "2608.23383", "arxiv_url": "https://arxiv.org/abs/2608.23383", "authors": ["Nan Duan", "Haoyang Huang", "Weiyang Jin", "Haoran Li", "Yaowei Li", "Yuming Li", "Yijun Liu", "Xin Lu", "Xiaoxiao Ma", "Yanwen Ma", "Yaofeng Su", "Yilang Sun", "Haoyu Wang", "Zeyue Xue", "Songchun Zhang", "Junhao Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa JoyAI-Echo-1.5\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u957f\u65f6\u7a0b\u97f3\u89c6\u9891\u751f\u6210\u7cfb\u7edf\uff0c\u5305\u542b\u957f\u89c6\u9891\u53d9\u4e8b\u4e0e\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\u4e24\u4e2a\u53d8\u4f53\u3002\u5b83\u901a\u8fc7\u8de8\u955c\u5934\u8bb0\u5fc6\u3001\u8bed\u97f3\u7ebf\u7d22\u3001\u51e0\u4f55\u76f8\u673a\u63a7\u5236\u548c rollout \u611f\u77e5\u8bad\u7ec3\uff0c\u5b9e\u73b0\u89d2\u8272\u3001\u58f0\u97f3\u4e0e\u73af\u5883\u5728\u957f\u65f6\u95f4\u751f\u6210\u4e2d\u7684\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23383", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u957f\u89c6\u9891\u53d8\u4f53\u5f15\u5165\u53ef\u7ec4\u5408\u8de8\u955c\u5934\u8bb0\u5fc6\uff0c\u805a\u5408\u591a\u6bb5\u5386\u53f2\u89c6\u89c9\u8bc1\u636e\uff0c\u5e76\u7ed3\u5408\u4ece\u5b8c\u6574\u97f3\u9891\u4e2d\u8fc7\u6ee4\u51fa\u7684\u8bf4\u8bdd\u4eba\u7ebf\u7d22\uff0c\u4fdd\u6301\u89d2\u8272\u5916\u89c2\u4e0e\u58f0\u7eb9\u4e00\u81f4\u3002", "\u4e16\u754c\u6a21\u578b\u53d8\u4f53\u5c06\u591a\u79cd\u5bfc\u822a\u8f93\u5165\u6821\u51c6\u4e3a\u5ea6\u91cf\u5316 6-DoF \u76f8\u673a\u8f68\u8ff9\uff0c\u5e76\u901a\u8fc7\u51e0\u4f55\u611f\u77e5\u6761\u4ef6\u901a\u8def\u6ce8\u5165\uff0c\u5b9e\u73b0\u8de8\u63a7\u5236\u5668\u3001\u8de8\u89c6\u89d2\u4ea4\u4e92\u751f\u6210\u3002", "\u901a\u8fc7\u6e10\u8fdb\u5f0f teacher forcing \u4e0e\u77ed/\u957f\u65f6\u7a0b Self-Gradient Forcing\uff0c\u5c06\u53cc\u5411\u97f3\u89c6\u9891\u9aa8\u5e72\u8f6c\u5316\u4e3a\u56e0\u679c\u5c11\u6b65\u751f\u6210\u5668\uff0c\u63d0\u5347\u957f rollout \u7a33\u5b9a\u6027\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23383v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Long-Horizon Audio-Visual Generation for Persistent Stories and Interactive Worlds", "tldr": "\u9762\u5411\u957f\u6545\u4e8b\u4e0e\u4ea4\u4e92\u4e16\u754c\u7684\u97f3\u89c6\u9891\u751f\u6210\u7cfb\u7edf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa JoyAI-Echo-1.5\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u957f\u65f6\u7a0b\u97f3\u89c6\u9891\u751f\u6210\u7cfb\u7edf\uff0c\u5305\u542b\u957f\u89c6\u9891\u53d9\u4e8b\u4e0e\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\u4e24\u4e2a\u53d8\u4f53\u3002\u5b83\u901a\u8fc7\u8de8\u955c\u5934\u8bb0\u5fc6\u3001\u8bed\u97f3\u7ebf\u7d22\u3001\u51e0\u4f55\u76f8\u673a\u63a7\u5236\u548c rollout \u611f\u77e5\u8bad\u7ec3\uff0c\u5b9e\u73b0\u89d2\u8272\u3001\u58f0\u97f3\u4e0e\u73af\u5883\u5728\u957f\u65f6\u95f4\u751f\u6210\u4e2d\u7684\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u957f\u89c6\u9891\u53d9\u4e8b\u4e00\u81f4\u6027\u4e0e\u4ea4\u4e92\u5f0f\u4e16\u754c\u751f\u6210\u7edf\u4e00\u5230\u540c\u4e00\u97f3\u89c6\u9891\u6846\u67b6\u4e2d\uff0c\u5728\u8de8\u955c\u5934\u4e00\u81f4\u6027\u3001\u89c6\u89c9\u8d28\u91cf\u3001\u6587\u672c\u5bf9\u9f50\u548c\u8bed\u97f3\u4fdd\u771f\u5ea6\u4e0a\u4f18\u4e8e\u65e2\u6709\u57fa\u7ebf\uff0c\u5e76\u5728 WBench \u53d6\u5f97 81.7 \u5e73\u5747\u5206\u6392\u540d\u7b2c\u4e00\uff0c\u663e\u793a\u51fa\u9762\u5411\u53ef\u63a7\u957f\u65f6\u7a0b\u4e16\u754c\u751f\u6210\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "We present EchoWM, an omnimodal world model for enterable generative media that responds to continuous navigation while jointly generating 720p video, environmental sound, music and speech. We organize interaction around camera intent: in first-person scenes, it specifies observer motion, while in third-person scenes, camera--character dynamics are learned from data without view-specific controllers. Discrete commands and continuous poses are mapped to a shared metric-scale relative 6-DoF trajectory, with dataset-level calibration preserving motion magnitude across heterogeneous data. To jointly learn audio-visual generation and trajectory control, we construct a complementary data engine and adopt progressive training followed by autoregressive post-training for long-horizon generation. Extensive evaluations show that \\model achieves strong trajectory following and high visual quality on public world-model benchmarks, supporting both first- and third-person interaction across varied subjects, and maintaining synchronized environmental sound and speech over long-horizon generation.", "arxiv_id": "2608.23189", "arxiv_url": "https://arxiv.org/abs/2608.23189", "authors": ["Songchun Zhang", "Yaowei Li", "Junhao Zhuang", "Weiyang Jin", "Haoyu Wang", "Xin Lu", "Yilang Sun", "Shiyi Zhang", "Haoran Li", "Xiaoxiao Ma", "Yuming Li", "Yijun Liu", "Yaofeng Su", "Yanwen Ma", "Haoyu Wu", "Zihan Su", "Yue Ma", "Lvmin Zhang", "Haoyang Huang", "Zeyue Xue", "Anyi Rao", "Nan Duan"], "brief": "EchoWM \u662f\u4e00\u4e2a\u9762\u5411\u53ef\u4ea4\u4e92\u751f\u6210\u5a92\u4f53\u7684\u5168\u6a21\u6001\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u6839\u636e\u8fde\u7eed\u5bfc\u822a\u610f\u56fe\u540c\u65f6\u751f\u6210 720p \u89c6\u9891\u3001\u73af\u5883\u58f0\u3001\u97f3\u4e50\u4e0e\u8bed\u97f3\u3002\u5b83\u5c06\u79bb\u6563\u547d\u4ee4\u548c\u8fde\u7eed\u4f4d\u59ff\u7edf\u4e00\u4e3a\u5ea6\u91cf\u5c3a\u5ea6\u7684\u76f8\u5bf9 6-DoF \u8f68\u8ff9\uff0c\u652f\u6301\u7b2c\u4e00\u4eba\u79f0\u4e0e\u7b2c\u4e09\u4eba\u79f0\u573a\u666f\u4ea4\u4e92\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23189", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ee5\u76f8\u673a\u610f\u56fe\u7ec4\u7ec7\u4ea4\u4e92\uff1a\u7b2c\u4e00\u4eba\u79f0\u4e2d\u8868\u793a\u89c2\u5bdf\u8005\u8fd0\u52a8\uff0c\u7b2c\u4e09\u4eba\u79f0\u4e2d\u4ece\u6570\u636e\u5b66\u4e60\u76f8\u673a\u4e0e\u89d2\u8272\u52a8\u6001\uff0c\u65e0\u9700\u7279\u5b9a\u89c6\u89d2\u63a7\u5236\u5668", "\u901a\u8fc7\u6570\u636e\u96c6\u7ea7\u6821\u51c6\u4fdd\u6301\u5f02\u6784\u6570\u636e\u4e2d\u7684\u8fd0\u52a8\u5e45\u5ea6\u4e00\u81f4\uff0c\u5e76\u5c06\u547d\u4ee4\u4e0e\u4f4d\u59ff\u6620\u5c04\u5230\u5171\u4eab 6-DoF \u8f68\u8ff9\u8868\u793a", "\u6784\u5efa\u4e92\u8865\u6570\u636e\u5f15\u64ce\uff0c\u91c7\u7528\u6e10\u8fdb\u5f0f\u8bad\u7ec3\u4e0e\u81ea\u56de\u5f52\u540e\u8bad\u7ec3\uff0c\u5b9e\u73b0\u957f\u65f6\u7a0b\u89c6\u542c\u540c\u6b65\u751f\u6210"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001", "\u89c6\u9891\u751f\u6210", "\u4ea4\u4e92\u5f0f\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23189v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "EchoWM: Open and Enterable Omnimodal World Models", "tldr": "\u53ef\u8fdb\u5165\u5168\u6a21\u6001\u4e16\u754c\u6a21\u578b\u540c\u6b65\u751f\u6210\u89c6\u542c\u5185\u5bb9", "upvotes": 0, "what_it_is": "EchoWM \u662f\u4e00\u4e2a\u9762\u5411\u53ef\u4ea4\u4e92\u751f\u6210\u5a92\u4f53\u7684\u5168\u6a21\u6001\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u6839\u636e\u8fde\u7eed\u5bfc\u822a\u610f\u56fe\u540c\u65f6\u751f\u6210 720p \u89c6\u9891\u3001\u73af\u5883\u58f0\u3001\u97f3\u4e50\u4e0e\u8bed\u97f3\u3002\u5b83\u5c06\u79bb\u6563\u547d\u4ee4\u548c\u8fde\u7eed\u4f4d\u59ff\u7edf\u4e00\u4e3a\u5ea6\u91cf\u5c3a\u5ea6\u7684\u76f8\u5bf9 6-DoF \u8f68\u8ff9\uff0c\u652f\u6301\u7b2c\u4e00\u4eba\u79f0\u4e0e\u7b2c\u4e09\u4eba\u79f0\u573a\u666f\u4ea4\u4e92\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e16\u754c\u6a21\u578b\u4ece\u5355\u7eaf\u89c6\u9891\u751f\u6210\u63a8\u8fdb\u5230\u53ef\u8fdb\u5165\u3001\u53ef\u5bfc\u822a\u7684\u5168\u6a21\u6001\u751f\u6210\u5a92\u4f53\uff0c\u517c\u987e\u8f68\u8ff9\u8ddf\u968f\u3001\u89c6\u89c9\u8d28\u91cf\u548c\u957f\u65f6\u7a0b\u97f3\u753b\u540c\u6b65\uff0c\u5177\u6709\u6e38\u620f\u3001\u865a\u62df\u73af\u5883\u548c\u6c89\u6d78\u5f0f\u5185\u5bb9\u751f\u6210\u6f5c\u529b\u3002"}, {"abstract": "While Vision-Language-Action (VLA) models have leveraged internet-scale pretraining and task-focused finetuning to achieve strong performance on long-horizon tasks, they often struggle with non-Markovian tasks that require memory. Existing approaches to memory typically involve additional Vision-Language-Models (VLMs) for long-term memory management, introducing a memory bottleneck and a fractured training pipeline. Conditioning on multiple historical frames can provide the VLA with access to more descriptive features of past scenes, but can degrade performance if frames are chosen at arbitrary, fixed intervals. To address these limitations, we present UniMem, a framework that unifies high-level, multimodal memory and low-level control under one backbone. UniMem employs an event classifier for memory updates, a keyframe encoder for dense spatial memory, and a keyframe caching technique to minimize overhead during policy rollouts. We evaluate UniMem across five simulation and four hardware tasks targeting sequential and spatial memory, demonstrating that our unified, single-model system outperforms fixed-interval image sampling baselines (93.4% vs. 68.2%) in simulation and hierarchical baselines (80.0% vs. 43.5%) in hardware, while offering faster inference and a simple training pipeline for easy adoption. Project website: https://losterberg3.github.io/unimem-vla/", "arxiv_id": "2608.22869", "arxiv_url": "https://arxiv.org/abs/2608.22869", "authors": ["Lars Osterberg", "Maggie Wang", "Mac Schwager"], "brief": "UniMem\u63d0\u51fa\u5728\u540c\u4e00VLA\u9aa8\u5e72\u4e2d\u7edf\u4e00\u9ad8\u5c42\u591a\u6a21\u6001\u8bb0\u5fc6\u4e0e\u4f4e\u5c42\u52a8\u4f5c\u63a7\u5236\uff0c\u9762\u5411\u9700\u8981\u5386\u53f2\u4fe1\u606f\u7684\u975e\u9a6c\u5c14\u53ef\u592b\u957f\u7a0b\u673a\u5668\u4eba\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u4e8b\u4ef6\u89e6\u53d1\u7684\u8bb0\u5fc6\u66f4\u65b0\u548c\u5173\u952e\u5e27\u7a7a\u95f4\u8bb0\u5fc6\uff0c\u907f\u514d\u989d\u5916VLM\u8bb0\u5fc6\u6a21\u5757\u5e26\u6765\u7684\u74f6\u9888\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22869", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u4e8b\u4ef6\u5206\u7c7b\u5668\u51b3\u5b9a\u4f55\u65f6\u66f4\u65b0\u8bb0\u5fc6\uff0c\u907f\u514d\u56fa\u5b9a\u95f4\u9694\u91c7\u6837\u5386\u53f2\u5e27\u5bfc\u81f4\u7684\u65e0\u5173\u6216\u5197\u4f59\u4fe1\u606f\u5e72\u6270", "\u5f15\u5165\u5173\u952e\u5e27\u7f16\u7801\u5668\u6784\u5efa\u5bc6\u96c6\u7a7a\u95f4\u8bb0\u5fc6\uff0c\u5e76\u7528\u5173\u952e\u5e27\u7f13\u5b58\u964d\u4f4e\u7b56\u7565\u6267\u884c\u65f6\u7684\u63a8\u7406\u5f00\u9500", "\u57285\u4e2a\u4eff\u771f\u4efb\u52a1\u548c4\u4e2a\u771f\u5b9e\u786c\u4ef6\u4efb\u52a1\u4e0a\u9a8c\u8bc1\uff1a\u4eff\u771f\u6210\u529f\u738793.4%\u5bf9\u6bd468.2%\uff0c\u786c\u4ef680.0%\u5bf9\u6bd443.5%"], "keywords": ["\u673a\u5668\u4eba", "\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22869v1", "published_at": "2026-08-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "UniMem: Unifying Multimodal Memory and Control for Vision-Language-Action Models", "tldr": "\u7edf\u4e00\u591a\u6a21\u6001\u8bb0\u5fc6\u4e0e\u63a7\u5236\u7684VLA\u673a\u5668\u4eba\u6846\u67b6", "upvotes": 0, "what_it_is": "UniMem\u63d0\u51fa\u5728\u540c\u4e00VLA\u9aa8\u5e72\u4e2d\u7edf\u4e00\u9ad8\u5c42\u591a\u6a21\u6001\u8bb0\u5fc6\u4e0e\u4f4e\u5c42\u52a8\u4f5c\u63a7\u5236\uff0c\u9762\u5411\u9700\u8981\u5386\u53f2\u4fe1\u606f\u7684\u975e\u9a6c\u5c14\u53ef\u592b\u957f\u7a0b\u673a\u5668\u4eba\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u4e8b\u4ef6\u89e6\u53d1\u7684\u8bb0\u5fc6\u66f4\u65b0\u548c\u5173\u952e\u5e27\u7a7a\u95f4\u8bb0\u5fc6\uff0c\u907f\u514d\u989d\u5916VLM\u8bb0\u5fc6\u6a21\u5757\u5e26\u6765\u7684\u74f6\u9888\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u957f\u671f\u8bb0\u5fc6\u7ba1\u7406\u548c\u673a\u5668\u4eba\u63a7\u5236\u6574\u5408\u5230\u5355\u6a21\u578b\u8bad\u7ec3\u7ba1\u7ebf\u4e2d\uff0c\u517c\u987e\u6027\u80fd\u3001\u63a8\u7406\u901f\u5ea6\u548c\u6613\u7528\u6027\uff0c\u5bf9\u9700\u8981\u987a\u5e8f\u8bb0\u5fc6\u4e0e\u7a7a\u95f4\u8bb0\u5fc6\u7684VLA\u673a\u5668\u4eba\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We examine how hadith computational science is being reshaped by transformer models, retrieval-grounded pipelines, and large language models (LLMs). Recent reviews document growth in the literature, but they do not yet provide a critical account of which advances are methodologically robust, which remain benchmark-bound, and which unresolved problems still limit scholarly use. We address this gap through a critical narrative review that combines critique of existing reviews, paper-level appraisal of representative original studies, and synthesis of Islamic scholar and domain-expert perspectives on authenticity, authority, and responsible use. We find uneven progress. Data resources have expanded, segmentation tasks have matured, narrator and source-verification problems are better formalized, and LLM-assisted workflows now support corpus-scale enrichment, multilingual access, and grounded evaluation. At the same time, progress remains constrained by narrow corpora, weak benchmark comparability, synthetic-to-real transfer gaps, narrator identity resolution, preprocessing fragility, limited reproducibility, and sparse expert-grounded validation. We show that important gaps lie beyond dominant benchmarks: non-canonical and obscure corpora, commentary and explanatory literature, cross-source links with Qur\u0027an and seerah, and fiqh-facing evidence support. We argue that hadith computation should be assessed less as isolated model performance than as an evidence infrastructure problem requiring knowledge integration, provenance, and expert supervision. On this basis, we define a research agenda for making the field methodologically stronger and more useful to Islamic scholarship.", "arxiv_id": "2608.20364", "arxiv_url": "https://arxiv.org/abs/2608.20364", "authors": ["Md. Ashraful Haque", "Riasat Islam"], "brief": "\u672c\u6587\u662f\u4e00\u7bc7\u6279\u5224\u6027\u53d9\u4e8b\u7efc\u8ff0\uff0c\u7cfb\u7edf\u5ba1\u89c6 transformer\u3001\u68c0\u7d22\u589e\u5f3a\u6d41\u7a0b\u4e0e\u5927\u8bed\u8a00\u6a21\u578b\u5982\u4f55\u91cd\u5851\u5723\u8bad\u8ba1\u7b97\u79d1\u5b66\u3002\u4f5c\u8005\u7ed3\u5408\u65e2\u6709\u7efc\u8ff0\u6279\u8bc4\u3001\u4ee3\u8868\u6027\u8bba\u6587\u8bc4\u4f30\u53ca\u4f0a\u65af\u5170\u5b66\u8005\u89c2\u70b9\uff0c\u63d0\u51fa\u8be5\u9886\u57df\u5e94\u4ece\u5355\u70b9\u6a21\u578b\u6027\u80fd\u8f6c\u5411\u8bc1\u636e\u57fa\u7840\u8bbe\u65bd\u5efa\u8bbe\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20364", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6570\u636e\u8d44\u6e90\u3001\u6587\u672c\u5206\u6bb5\u3001\u4f20\u8ff0\u8005\u4e0e\u6765\u6e90\u9a8c\u8bc1\u7b49\u4efb\u52a1\u5df2\u6709\u8fdb\u5c55\uff0cLLM\u53ef\u652f\u6301\u8bed\u6599\u7ea7\u6807\u6ce8\u3001\u591a\u8bed\u8a00\u8bbf\u95ee\u548c\u68c0\u7d22\u5f0f\u8bc4\u4f30\u3002", "\u5f53\u524d\u7814\u7a76\u4ecd\u53d7\u9650\u4e8e\u8bed\u6599\u72ed\u7a84\u3001\u57fa\u51c6\u4e0d\u53ef\u6bd4\u3001\u5408\u6210\u5230\u771f\u5b9e\u8fc1\u79fb\u4e0d\u8db3\u3001\u4f20\u8ff0\u8005\u8eab\u4efd\u6d88\u6b67\u56f0\u96be\u548c\u53ef\u590d\u73b0\u6027\u5f31\u3002", "\u4f5c\u8005\u5f3a\u8c03\u9700\u7eb3\u5165\u975e\u7ecf\u5178\u8bed\u6599\u3001\u6ce8\u758f\u6587\u732e\u3001\u4e0e\u300a\u53e4\u5170\u7ecf\u300b\u548c\u5148\u77e5\u4f20\u7684\u8de8\u6e90\u94fe\u63a5\uff0c\u4ee5\u53ca\u9762\u5411\u6559\u6cd5\u8bc1\u636e\u652f\u6301\u7684\u4e13\u5bb6\u9a8c\u8bc1\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u68c0\u7d22\u589e\u5f3a", "\u6570\u5b57\u4eba\u6587", "\u53ef\u4fe1AI"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20364v1", "published_at": "2026-06-18", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20364.png", "title": "Hadith computational science in the age of large language models: a critical narrative review", "tldr": "\u7efc\u8ff0LLM\u65f6\u4ee3\u5723\u8bad\u8ba1\u7b97\u7814\u7a76\u7684\u8fdb\u5c55\u4e0e\u74f6\u9888", "upvotes": 2, "what_it_is": "\u672c\u6587\u662f\u4e00\u7bc7\u6279\u5224\u6027\u53d9\u4e8b\u7efc\u8ff0\uff0c\u7cfb\u7edf\u5ba1\u89c6 transformer\u3001\u68c0\u7d22\u589e\u5f3a\u6d41\u7a0b\u4e0e\u5927\u8bed\u8a00\u6a21\u578b\u5982\u4f55\u91cd\u5851\u5723\u8bad\u8ba1\u7b97\u79d1\u5b66\u3002\u4f5c\u8005\u7ed3\u5408\u65e2\u6709\u7efc\u8ff0\u6279\u8bc4\u3001\u4ee3\u8868\u6027\u8bba\u6587\u8bc4\u4f30\u53ca\u4f0a\u65af\u5170\u5b66\u8005\u89c2\u70b9\uff0c\u63d0\u51fa\u8be5\u9886\u57df\u5e94\u4ece\u5355\u70b9\u6a21\u578b\u6027\u80fd\u8f6c\u5411\u8bc1\u636e\u57fa\u7840\u8bbe\u65bd\u5efa\u8bbe\u3002", "why_notable": "\u8be5\u6587\u5c06\u5723\u8bad\u8ba1\u7b97\u4eceNLP\u4efb\u52a1\u96c6\u5408\u63d0\u5347\u4e3a\u201c\u53ef\u4fe1\u8bc1\u636e\u57fa\u7840\u8bbe\u65bd\u201d\u95ee\u9898\uff0c\u7a81\u51fa\u6765\u6e90\u3001\u6743\u5a01\u6027\u3001\u53ef\u8ffd\u6eaf\u6027\u548c\u4e13\u5bb6\u76d1\u7763\uff0c\u5bf9\u5b97\u6559\u6587\u672cAI\u5e94\u7528\u7684\u53ef\u9760\u6027\u7814\u7a76\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "When can an agent failure be caught? An audit is usually limited by the record rather than by the method. CatchBench therefore puts one auditor\u0027s question to three information states: the declared configuration before a run (PRE), a growing prefix of its trace (LIVE), and the finished trace (POST). Prior benchmarks fix one of these states or vary the telemetry; to our knowledge none scores all three under one task-method interface. Each state admits different questions, so seven task contracts carry their own labels and metrics rather than one leaderboard. Four are evidential; three are Gold-derived mechanism diagnostics. The release scores 72 entrants, from rule scanners and structural models to eleven LLM judges across nine model families (GPT, Claude, Gemini, Gemma, Llama, Qwen, DeepSeek, Mistral, Nova), over 1187 declared configurations and 1162 recorded runs. Most of the arena does not order: 47 of 118 pre-declared contrasts separate, and the rest are published unresolved rather than ranked. The two sharpest results cut against our own data. One rule ignores every name and permission; it flags each capability declared after the first. On one of six configuration sources it reaches a perfect F1, so a score there measures how the corpus was built rather than how well a method reasons. Our admissibility bar then rejected one injected substrate and withheld evidential status from the other. A benchmark number is therefore not interpretable until the process behind its labels is published and tested for the shortcut it may leave. We report both, and regenerate every ordering from released predictions with no model call.", "arxiv_id": "2608.22808", "arxiv_url": "https://arxiv.org/abs/2608.22808", "authors": ["Yue Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa CatchBench\uff0c\u7528\u7edf\u4e00\u4efb\u52a1-\u65b9\u6cd5\u63a5\u53e3\u8bc4\u4f30\u667a\u80fd\u4f53\u5931\u8d25\u5ba1\u8ba1\u5728\u4e09\u79cd\u4fe1\u606f\u72b6\u6001\u4e0b\u7684\u8868\u73b0\uff1a\u8fd0\u884c\u524d\u914d\u7f6e\u3001\u8fd0\u884c\u4e2d\u8f68\u8ff9\u524d\u7f00\u3001\u8fd0\u884c\u540e\u5b8c\u6574\u8f68\u8ff9\u3002\u5b83\u5305\u542b7\u7c7b\u4efb\u52a1\u5951\u7ea6\u300172\u4e2a\u53c2\u8d5b\u65b9\u6cd5\u548c\u8d85\u8fc7\u5343\u6761\u914d\u7f6e\u4e0e\u8fd0\u884c\u8bb0\u5f55\uff0c\u5e76\u5f3a\u8c03\u57fa\u51c6\u6807\u7b7e\u6d41\u7a0b\u4e0e\u6377\u5f84\u98ce\u9669\u5fc5\u987b\u516c\u5f00\u9a8c\u8bc1\u3002", "categories": ["cs.LG", "cs.MA", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22808", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8986\u76d6 PRE\u3001LIVE\u3001POST \u4e09\u79cd\u5ba1\u8ba1\u4fe1\u606f\u72b6\u6001\uff0c\u5206\u522b\u5bf9\u5e94\u8fd0\u884c\u524d\u58f0\u660e\u914d\u7f6e\u3001\u589e\u91cf\u6267\u884c\u8f68\u8ff9\u548c\u5b8c\u6574\u6267\u884c\u8f68\u8ff9\u3002", "\u5305\u542b7\u4e2a\u4efb\u52a1\u5951\u7ea6\uff1a4\u4e2a\u8bc1\u636e\u578b\u4efb\u52a1\u548c3\u4e2a\u57fa\u4e8eGold\u7684\u673a\u5236\u8bca\u65ad\u4efb\u52a1\uff0c\u5404\u81ea\u4f7f\u7528\u72ec\u7acb\u6807\u7b7e\u4e0e\u6307\u6807\uff0c\u800c\u975e\u5355\u4e00\u6392\u884c\u699c\u3002", "\u8bc4\u6d4b72\u4e2a\u65b9\u6cd5\uff0c\u5305\u62ec\u89c4\u5219\u626b\u63cf\u5668\u3001\u7ed3\u6784\u6a21\u578b\u548c\u6765\u81eaGPT\u3001Claude\u3001Gemini\u3001Llama\u3001Qwen\u7b49\u4e5d\u4e2a\u6a21\u578b\u5bb6\u65cf\u768411\u4e2aLLM\u8bc4\u5ba1\u5668\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u5b89\u5168\u5ba1\u8ba1", "LLM\u8bc4\u5ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22808v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CatchBench: When Can an Agent Failure Be Caught?", "tldr": "CatchBench\u8bc4\u6d4b\u4f55\u65f6\u80fd\u6355\u6349\u667a\u80fd\u4f53\u5931\u8d25", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CatchBench\uff0c\u7528\u7edf\u4e00\u4efb\u52a1-\u65b9\u6cd5\u63a5\u53e3\u8bc4\u4f30\u667a\u80fd\u4f53\u5931\u8d25\u5ba1\u8ba1\u5728\u4e09\u79cd\u4fe1\u606f\u72b6\u6001\u4e0b\u7684\u8868\u73b0\uff1a\u8fd0\u884c\u524d\u914d\u7f6e\u3001\u8fd0\u884c\u4e2d\u8f68\u8ff9\u524d\u7f00\u3001\u8fd0\u884c\u540e\u5b8c\u6574\u8f68\u8ff9\u3002\u5b83\u5305\u542b7\u7c7b\u4efb\u52a1\u5951\u7ea6\u300172\u4e2a\u53c2\u8d5b\u65b9\u6cd5\u548c\u8d85\u8fc7\u5343\u6761\u914d\u7f6e\u4e0e\u8fd0\u884c\u8bb0\u5f55\uff0c\u5e76\u5f3a\u8c03\u57fa\u51c6\u6807\u7b7e\u6d41\u7a0b\u4e0e\u6377\u5f84\u98ce\u9669\u5fc5\u987b\u516c\u5f00\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u4ec5\u63d0\u4f9b\u4e86\u9762\u5411\u667a\u80fd\u4f53\u5931\u8d25\u68c0\u6d4b\u7684\u7cfb\u7edf\u5316\u57fa\u51c6\uff0c\u8fd8\u63ed\u793a\u4e86\u57fa\u51c6\u6784\u5efa\u4e2d\u7684\u6570\u636e\u6377\u5f84\u95ee\u9898\uff1a\u67d0\u4e9b\u7b80\u5355\u89c4\u5219\u53ef\u5728\u7279\u5b9a\u6765\u6e90\u4e0a\u53d6\u5f97\u5b8c\u7f8e\u5206\u6570\uff0c\u8bf4\u660e\u5ba1\u8ba1\u80fd\u529b\u8bc4\u5206\u5fc5\u987b\u7ed3\u5408\u6807\u7b7e\u751f\u6210\u8fc7\u7a0b\u89e3\u91ca\u3002"}, {"abstract": "Diffusion Language Models (DLMs) exhibit strong parallel decoding capabilities by denoising multiple tokens in a single generation step. However, this parallelism comes with substantial computational overhead, as each step requires interactions with all suffix tokens. Existing methods typically reduce this cost by retaining only a local suffix window as a substitute for the full suffix. Despite their effectiveness, these methods overlook the structural heterogeneity across suffix regions and re-initialize suffix tokens with identical representations at each timestep. To this end, we propose a structured suffix modeling method for efficient DLM inference. Specifically, we divide the suffix into three regions, i.e., the local, middle, and tail regions, and retain different numbers of suffix tokens in each region according to their structural roles. Moreover, we incorporate the decoding results from the previous step into the suffix token representations at the current step, allowing them to carry evolving denoising information across generation steps. Notably, our method is training-free and orthogonal to several existing acceleration techniques, such as parallel decoding strategies and KV cache. Empirical results across multiple benchmarks on three DLMs demonstrate that our method can further accelerate DLM inference and improve performance in most cases. In particular, in long-sequence inference, our method achieves up to a \\(72.81\\times\\) speedup when combined with other acceleration techniques. Our code is available at https://github.com/zifengcheng/SSM.", "arxiv_id": "2608.23167", "arxiv_url": "https://arxiv.org/abs/2608.23167", "authors": ["Zifeng Cheng", "Keda Li", "Zhiwei Jiang", "Cong Wang", "Fei Shen", "Qing Gu"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u7ed3\u6784\u5316\u540e\u7f00\u5efa\u6a21\u65b9\u6cd5\uff0c\u7528\u4e8e\u63d0\u5347\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff08DLM\uff09\u63a8\u7406\u6548\u7387\u3002\u5b83\u5c06\u540e\u7f00\u5212\u5206\u4e3a\u5c40\u90e8\u3001\u4e2d\u90e8\u3001\u5c3e\u90e8\u4e09\u7c7b\u533a\u57df\uff0c\u5e76\u5728\u4e0d\u540c\u533a\u57df\u4fdd\u7559\u4e0d\u540c\u6570\u91cf\u7684 token\uff0c\u540c\u65f6\u590d\u7528\u4e0a\u4e00\u89e3\u7801\u6b65\u4fe1\u606f\u589e\u5f3a\u5f53\u524d\u540e\u7f00\u8868\u793a\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23167", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9 DLM \u6bcf\u6b65\u9700\u4e0e\u5168\u90e8\u540e\u7f00 token \u4ea4\u4e92\u5bfc\u81f4\u7684\u9ad8\u8ba1\u7b97\u5f00\u9500\uff0c\u6309\u540e\u7f00\u7ed3\u6784\u89d2\u8272\u8fdb\u884c\u5206\u533a\u4fdd\u7559\uff0c\u800c\u975e\u7b80\u5355\u4f7f\u7528\u56fa\u5b9a\u5c40\u90e8\u7a97\u53e3\u3002", "\u5c06\u4e0a\u4e00\u751f\u6210\u6b65\u9aa4\u7684\u89e3\u7801\u7ed3\u679c\u6ce8\u5165\u5f53\u524d\u540e\u7f00 token \u8868\u793a\uff0c\u4f7f\u540e\u7f00\u643a\u5e26\u8de8\u6b65\u6f14\u5316\u7684\u53bb\u566a\u4fe1\u606f\u3002", "\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\uff0c\u53ef\u4e0e\u5e76\u884c\u89e3\u7801\u3001KV cache \u7b49\u73b0\u6709\u52a0\u901f\u6280\u672f\u6b63\u4ea4\u7ed3\u5408\uff1b\u5728\u957f\u5e8f\u5217\u63a8\u7406\u4e2d\u6700\u9ad8\u5b9e\u73b0 72.81\u00d7 \u52a0\u901f\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u5e76\u884c\u89e3\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23167v1", "published_at": "2026-08-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Accelerating Diffusion Language Models via Structured Suffix Modeling", "tldr": "\u7ed3\u6784\u5316\u540e\u7f00\u5efa\u6a21\u52a0\u901f\u6269\u6563\u8bed\u8a00\u6a21\u578b\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u7ed3\u6784\u5316\u540e\u7f00\u5efa\u6a21\u65b9\u6cd5\uff0c\u7528\u4e8e\u63d0\u5347\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff08DLM\uff09\u63a8\u7406\u6548\u7387\u3002\u5b83\u5c06\u540e\u7f00\u5212\u5206\u4e3a\u5c40\u90e8\u3001\u4e2d\u90e8\u3001\u5c3e\u90e8\u4e09\u7c7b\u533a\u57df\uff0c\u5e76\u5728\u4e0d\u540c\u533a\u57df\u4fdd\u7559\u4e0d\u540c\u6570\u91cf\u7684 token\uff0c\u540c\u65f6\u590d\u7528\u4e0a\u4e00\u89e3\u7801\u6b65\u4fe1\u606f\u589e\u5f3a\u5f53\u524d\u540e\u7f00\u8868\u793a\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u6293\u4f4f\u4e86\u6269\u6563\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u4e2d\u540e\u7f00\u4ea4\u4e92\u7684\u7ed3\u6784\u6027\u5197\u4f59\uff0c\u5728\u4e0d\u91cd\u65b0\u8bad\u7ec3\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u901f\u5ea6\u5e76\u591a\u6570\u60c5\u51b5\u4e0b\u6539\u5584\u6027\u80fd\uff0c\u5bf9 DLM \u7684\u5b9e\u7528\u5316\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Activation steering is often evaluated under the answer encoding used to construct the direction. A reported gain may reflect the intended judgment or compatibility with answer identifiers seen during construction. We introduce Cross-Encoding Steering Evaluation, which freezes an intervention while re-encoding answers to the same held-out items. On NormBank, after A/B/C identifiers are reassigned, contrastive activation addition (CAA) induces larger target-versus-source score changes for the extraction indices than for the semantic labels under the new mapping. We call this extraction-index following. Varying identifier vocabulary (A/B/C, X/Y/Z, or 1/2/3) and row order shows that the effect tracks extraction index rather than row position. After matching direction norms across layers, extraction-index following emerges mainly at later depths. A low-rank output-sensitive component containing 15.4% of the direction\u0027s squared norm retains 96.3% of this effect. An Inference-Time Intervention (ITI)-style method also favors extraction-index over semantic-label following on NormBank in three models. In aggregate, MNLI fa
