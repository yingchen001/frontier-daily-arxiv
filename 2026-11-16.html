40c\u65f6\u68c0\u9a8c\u4e3b\u8981\u76ee\u6807\u63d0\u5347\u3001\u65e2\u6709\u80fd\u529b\u4e0d\u9000\u5316\u53ca\u6cbb\u7406\u7ea6\u675f\u3002", "why_notable": "\u628a\u667a\u80fd\u4f53\u81ea\u6211\u66f4\u65b0\u4ece\u5c40\u90e8\u6536\u76ca\u5224\u65ad\u8f6c\u4e3a\u6709\u7edf\u8ba1\u4f9d\u636e\u7684\u91c7\u7eb3\u6d41\u7a0b\uff0c\u517c\u987e\u8bc4\u4f30\u504f\u5dee\u4e0e\u8de8\u7248\u672c\u9000\u5316\uff0c\u5e76\u4e3a\u5ba1\u8ba1\u6837\u672c\u89c4\u5212\u63d0\u4f9b\u6761\u4ef6\u3002"}, {"abstract": "We introduce Gamer, a generalist agent framework built for long-horizon tasks in complex interactive environments. Its end-to-end architecture combines perception, memory management, and multi-step reasoning. A shared training and deployment pipeline supports interaction with both conventional 2D graphical interfaces and complex 3D simulated worlds. We first continue pre-training on a dataset constructed from tens of thousands of hours of device-level keyboard and mouse interaction. These trajectories span simulated games and embodied environments, allowing the model to learn environmental dynamics across both physical and virtual domains. Sparse-thinking instruction tuning then substantially reduces redundant computation while preserving the reasoning needed for complex decisions. We train the policy for long-horizon interaction with a stable multi-turn reinforcement learning method that addresses finite context windows, accumulated rollout errors, and sparse rewards. For real-time interaction, a cloud-edge inference engine serves numerous simulated game environments concurrently, supports unbounded-context execution, and keeps online inference latency low. Across multiple challenging 3D open-world games, Gamer demonstrates solid generalization and operational efficiency comparable to skilled players. It also achieves competitive results on a range of conventional 2D game benchmarks. These results suggest that even repetitive keyboard and mouse trajectories can support substantial gains from scaling data and learning algorithms. Training on these trajectories helps Gamer learn complex skills more steadily in environments with both physical and digital properties. This approach offers a path toward generalist agents that can interact across digital and physical worlds.", "arxiv_id": "2611.18397", "arxiv_url": "https://arxiv.org/abs/2611.18397", "authors": ["Run Luo", "Kuan Zhang", "Qi Deng", "Yukun Chen", "Zhihao Yang", "Yufei Zhang", "Renrong Hu", "Yi Zhang", "Guiyu Ma", "Tianyu Fan", "Longze Chen", "Hao Sun", "Jiaming Li", "Jiaming Yang", "Xiaohao Liu", "Tao Tan", "Minzheng Wang", "Hangtian Jia", "Shuai Yuan", "Lvdi Wang", "Xiao Liu", "Chao Ma", "Yuting Zou", "Yinhe Zheng", "Xiaobo Xia", "Dawei Jiang", "Shaoqing Ren"], "brief": "Gamer\u5c06\u611f\u77e5\u3001\u8bb0\u5fc6\u7ba1\u7406\u4e0e\u591a\u6b65\u63a8\u7406\u6574\u5408\u4e3a\u7aef\u5230\u7aef\u7b56\u7565\uff0c\u7edf\u4e00\u652f\u6301\u4e8c\u7ef4\u754c\u9762\u548c\u4e09\u7ef4\u4e16\u754c\u3002\u901a\u8fc7\u952e\u9f20\u8f68\u8ff9\u7ee7\u7eed\u9884\u8bad\u7ec3\u3001\u7a00\u758f\u601d\u8003\u5fae\u8c03\u53ca\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u957f\u7a0b\u4ea4\u4e92\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV"], "github_repo": "https://github.com/RainBowLuoCS/Gamer", "github_stars": 176, "hf_url": "https://huggingface.co/papers/2611.18397", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6570\u4e07\u5c0f\u65f6\u8bbe\u5907\u7ea7\u952e\u9f20\u8f68\u8ff9\u7528\u4e8e\u7ee7\u7eed\u9884\u8bad\u7ec3", "\u7a00\u758f\u601d\u8003\u6307\u4ee4\u5fae\u8c03\u51cf\u5c11\u5197\u4f59\u8ba1\u7b97\uff0c\u4fdd\u7559\u51b3\u7b56\u63a8\u7406", "\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\u5904\u7406\u4e0a\u4e0b\u6587\u9650\u5236\u3001\u8bef\u5dee\u7d2f\u79ef\u4e0e\u7a00\u758f\u5956\u52b1"], "keywords": ["\u901a\u7528\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5b9e\u65f6\u63a8\u7406"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18397v1", "published_at": "2026-11-13", "score": 0.373, "selected_reasons": ["HF trending (89\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18397.png", "title": "Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent", "tldr": "\u901a\u8fc7\u6d77\u91cf\u952e\u9f20\u8f68\u8ff9\u4e0e\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\uff0c\u6784\u5efa\u8de8\u4e8c\u7ef4\u548c\u4e09\u7ef4\u6e38\u620f\u7684\u5b9e\u65f6\u957f\u7a0b\u667a\u80fd\u4f53\u3002", "upvotes": 89, "what_it_is": "Gamer\u5c06\u611f\u77e5\u3001\u8bb0\u5fc6\u7ba1\u7406\u4e0e\u591a\u6b65\u63a8\u7406\u6574\u5408\u4e3a\u7aef\u5230\u7aef\u7b56\u7565\uff0c\u7edf\u4e00\u652f\u6301\u4e8c\u7ef4\u754c\u9762\u548c\u4e09\u7ef4\u4e16\u754c\u3002\u901a\u8fc7\u952e\u9f20\u8f68\u8ff9\u7ee7\u7eed\u9884\u8bad\u7ec3\u3001\u7a00\u758f\u601d\u8003\u5fae\u8c03\u53ca\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u957f\u7a0b\u4ea4\u4e92\u80fd\u529b\u3002", "why_notable": "\u5c06\u4f4e\u6210\u672c\u952e\u9f20\u4ea4\u4e92\u6570\u636e\u6269\u5c55\u4e3a\u901a\u7528\u7b56\u7565\u8bad\u7ec3\u8d44\u6e90\uff0c\u5e76\u7528\u4e91\u8fb9\u63a8\u7406\u652f\u6301\u5b9e\u65f6\u6267\u884c\uff1b\u5728\u591a\u4e2a\u4e09\u7ef4\u5f00\u653e\u4e16\u754c\u6e38\u620f\u4e2d\u5c55\u73b0\u63a5\u8fd1\u719f\u7ec3\u73a9\u5bb6\u7684\u64cd\u4f5c\u6548\u7387\u3002"}, {"abstract": "Agentic reinforcement learning (RL) increasingly relies on a harness, the scaffold around the model that decides what it sees of its own interaction and what guidance it receives. Most existing approaches train under a hand-written harness that stays fixed throughout. However, an effective harness depends on the domain, the data and the model, and keeps changing as the model trains. We introduce ModHarness-RL, which recasts the harness as programs that are learned from data and evolve as the model trains with RL. ModHarness-RL records the interaction as structured State, a set of typed blocks, and two core components of the harness are programs over these blocks, a Compression program that assembles the accumulated history into the model\u0027s context and a Steering program that supplies guidance when behavior deviates. During RL training, candidate programs are proposed from recent trajectories, verified by execution, and replayed over past trajectories, so the harness tracks how the model\u0027s behavior shifts. We study CodeSearch in depth and further analyze ALFWorld and BIRD SQL, with models from 1.5B to 8B. The proposed Compression and Steering mechanisms improve held-out performance over the fixed-harness baseline in most settings. These results suggest that a harness for agentic RL can be learned from the task\u0027s data and evolved with the model.", "arxiv_id": "2611.18533", "arxiv_url": "https://arxiv.org/abs/2611.18533", "authors": ["Zelin He", "Siyu Zhu", "Jacob Helwig", "Yujian Liu", "Li An", "Rohit Jain", "Shiyu Chang", "Alborz Geramifard"], "brief": "\u8be5\u65b9\u6cd5\u5c06\u4ea4\u4e92\u8bb0\u5f55\u7ec4\u7ec7\u4e3a\u5e26\u7c7b\u578b\u7684\u72b6\u6001\u5757\uff0c\u7528\u538b\u7f29\u7a0b\u5e8f\u6784\u5efa\u4e0a\u4e0b\u6587\u3001\u5f15\u5bfc\u7a0b\u5e8f\u7ea0\u504f\uff1b\u8bad\u7ec3\u4e2d\u6839\u636e\u8fd1\u671f\u8f68\u8ff9\u63d0\u51fa\u5019\u9009\u7a0b\u5e8f\uff0c\u7ecf\u6267\u884c\u9a8c\u8bc1\u4e0e\u5386\u53f2\u56de\u653e\u540e\u66f4\u65b0\u811a\u624b\u67b6\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18533", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Compression\u4e0eSteering\u5206\u522b\u8d1f\u8d23\u4e0a\u4e0b\u6587\u538b\u7f29\u548c\u884c\u4e3a\u7ea0\u504f", "\u5019\u9009\u7a0b\u5e8f\u7531\u8fd1\u671f\u8f68\u8ff9\u751f\u6210\uff0c\u7ecf\u6267\u884c\u9a8c\u8bc1\u53ca\u5386\u53f2\u8f68\u8ff9\u56de\u653e", "\u6d4b\u8bd5\u8986\u76d6CodeSearch\u3001ALFWorld\u3001BIRD SQL\u53ca1.5B\u81f38B\u6a21\u578b"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u7a0b\u5e8f\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18533v1", "published_at": "2026-11-13", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ModHarness-RL: Recasting Harnesses as Learnable and Evolving Programs for Agentic RL", "tldr": "\u5c06\u667a\u80fd\u4f53\u4ea4\u4e92\u811a\u624b\u67b6\u53d8\u4e3a\u53ef\u5b66\u4e60\u7a0b\u5e8f\uff0c\u968f\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6f14\u5316\u5e76\u6539\u5584\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": "\u8be5\u65b9\u6cd5\u5c06\u4ea4\u4e92\u8bb0\u5f55\u7ec4\u7ec7\u4e3a\u5e26\u7c7b\u578b\u7684\u72b6\u6001\u5757\uff0c\u7528\u538b\u7f29\u7a0b\u5e8f\u6784\u5efa\u4e0a\u4e0b\u6587\u3001\u5f15\u5bfc\u7a0b\u5e8f\u7ea0\u504f\uff1b\u8bad\u7ec3\u4e2d\u6839\u636e\u8fd1\u671f\u8f68\u8ff9\u63d0\u51fa\u5019\u9009\u7a0b\u5e8f\uff0c\u7ecf\u6267\u884c\u9a8c\u8bc1\u4e0e\u5386\u53f2\u56de\u653e\u540e\u66f4\u65b0\u811a\u624b\u67b6\u3002", "why_notable": "\u628a\u901a\u5e38\u624b\u5199\u56fa\u5b9a\u7684\u811a\u624b\u67b6\u7eb3\u5165\u5b66\u4e60\u8fc7\u7a0b\uff0c\u4f7f\u5176\u9002\u5e94\u6a21\u578b\u884c\u4e3a\u53d8\u5316\uff1b\u591a\u6570\u5b9e\u9a8c\u8bbe\u7f6e\u4e0b\u4f18\u4e8e\u56fa\u5b9a\u811a\u624b\u67b6\u57fa\u7ebf\uff0c\u4e3a\u667a\u80fd\u4f53\u8bad\u7ec3\u63d0\u4f9b\u65b0\u7684\u4f18\u5316\u7ef4\u5ea6\u3002"}, {"abstract": "Neural networks are powerful predictors, yet their opacity limits their usefulness in science, where the goal is explanation rather than mere prediction. In neuroscience, for example, deep encoding models accurately predict brain activity in response to natural stimuli, but struggle to reveal which stimulus features drive those predictions. Here we introduce interpretable weight-space programming (iWSP), a method in which an LLM agent iteratively builds interpretable models by explicitly programming their weights and features in code, without gradient-based training (backpropagation). Without backpropagation to tune parameters, the agent must draw on its prior knowledge and reason over previous trials to hypothesize, hand-craft, and refine human-interpretable computations mirroring the workflow of a human scientist. LLM audits confirm the interpretability of the hand-crafted models. We first validate iWSP by tasking it with constructing transformers for canonical benchmarks such as arithmetic and sentiment classification, finding that LLM agents can successfully craft compact, accurate networks directly. Next, we apply iWSP to build neural encoding models across vision, language, and audition. In the visual cortex, iWSP outpredicts existing interpretable baselines, uncovers distinct computations across early/higher visual areas, and generalizes to unseen data. In language fMRI, iWSP surfaces a confound in the data and in auditory ECoG, it systematically discovers interpretable acoustic features that predict neural activity. Together, these results establish iWSP as a general paradigm for aligning high predictive performance with human-interpretable scientific discovery.", "arxiv_id": "2611.18114", "arxiv_url": "https://arxiv.org/abs/2611.18114", "authors": ["Yash Mehta", "Chandan Singh", "Weijia Xu", "Richard J. Antonello", "Adeen Flinker", "Nima Mesgarani", "Michael F. Bonner", "Nebojsa Jojic", "Jianfeng Gao"], "brief": "\u63d0\u51fa\u53ef\u89e3\u91ca\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b\uff08iWSP\uff09\uff0c\u7531\u5927\u6a21\u578b\u4ee3\u7406\u7528\u4ee3\u7801\u663e\u5f0f\u8bbe\u8ba1\u6743\u91cd\u4e0e\u7279\u5f81\u3002\u4ee3\u7406\u4f9d\u636e\u5148\u9a8c\u77e5\u8bc6\u548c\u5386\u6b21\u8bd5\u9a8c\u8fed\u4ee3\u6a21\u578b\uff0c\u4e0d\u4f9d\u8d56\u68af\u5ea6\u8bad\u7ec3\u3002", "categories": ["cs.CE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18114", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["iWSP\u76f4\u63a5\u6784\u5efa\u7d27\u51d1\u7f51\u7edc\uff0c\u5b8c\u6210\u7b97\u672f\u4e0e\u60c5\u611f\u5206\u7c7b", "\u89c6\u89c9\u76ae\u5c42\u9884\u6d4b\u4f18\u4e8e\u73b0\u6709\u53ef\u89e3\u91ca\u57fa\u7ebf\uff0c\u5e76\u6cdb\u5316\u81f3\u672a\u89c1\u6570\u636e", "\u8bed\u8a00fMRI\u63ed\u793a\u6df7\u6742\uff0c\u542c\u89c9ECoG\u53d1\u73b0\u53ef\u89e3\u91ca\u58f0\u5b66\u7279\u5f81"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u667a\u80fd\u4f53", "\u795e\u7ecf\u7f16\u7801", "\u79d1\u5b66\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18114v1", "published_at": "2026-11-13", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Interpretable weight-space programming builds transparent transformers and brain encoding models", "tldr": "\u8ba9\u5927\u6a21\u578b\u4ee3\u7406\u76f4\u63a5\u7f16\u5199\u7f51\u7edc\u6743\u91cd\uff0c\u5728\u65e0\u9700\u53cd\u5411\u4f20\u64ad\u4e0b\u6784\u5efa\u53ef\u89e3\u91ca\u9884\u6d4b\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u53ef\u89e3\u91ca\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b\uff08iWSP\uff09\uff0c\u7531\u5927\u6a21\u578b\u4ee3\u7406\u7528\u4ee3\u7801\u663e\u5f0f\u8bbe\u8ba1\u6743\u91cd\u4e0e\u7279\u5f81\u3002\u4ee3\u7406\u4f9d\u636e\u5148\u9a8c\u77e5\u8bc6\u548c\u5386\u6b21\u8bd5\u9a8c\u8fed\u4ee3\u6a21\u578b\uff0c\u4e0d\u4f9d\u8d56\u68af\u5ea6\u8bad\u7ec3\u3002", "why_notable": "\u5c06\u4ee3\u7406\u7684\u5047\u8bbe\u63d0\u51fa\u4e0e\u6a21\u578b\u6784\u5efa\u7ed3\u5408\uff0c\u8ba9\u9884\u6d4b\u8ba1\u7b97\u66f4\u6613\u68c0\u67e5\u3002\u8de8\u89c6\u89c9\u3001\u8bed\u8a00\u548c\u542c\u89c9\u7684\u9a8c\u8bc1\uff0c\u5c55\u793a\u4e86\u517c\u987e\u9884\u6d4b\u6027\u80fd\u4e0e\u79d1\u5b66\u89e3\u91ca\u7684\u6f5c\u529b\u3002"}, {"abstract": "Efficient batch execution of agent tasks is critical to LLM training and development workflows, including benchmark evaluation, synthetic-data generation, and RL rollouts. Since these tasks alternate between LLM inference and environment interaction, we present coordinated optimizations to reduce batch makespan, the time required to complete all tasks in a batch. For hybrid LLMs, a workload-based resource model guides GPU-memory allocation between key-value (KV) cache and recurrent state and provides a reference sample concurrency to exploit parallelism while limiting recomputation. Trajectory-aware routing and scheduling promote cache reuse while balancing worker load. Under constrained environment capacity, we decouple sample admission from environment execution and introduce Chain-Advancing Action Scheduling (CAAS), which prioritizes long chains using observed progress to shorten the batch tail. Controlled replay combines actual inference with recorded environment responses and durations for ablations of individual optimizations. Live evaluations with Ling-3.0-Flash and Ling-3.1-Flash on the BFCL, SWE-bench Multilingual, WideSearch, and MCP-Atlas benchmarks demonstrate makespan reductions of 10.4% to 65.0%, while evaluation scores remain aligned. Furthermore, these methods have been successfully applied to training and evaluation workflows for the Ling-3.x model series, accelerating the model-development cycle.", "arxiv_id": "2611.16661", "arxiv_url": "https://arxiv.org/abs/2611.16661", "authors": ["Wei Feng", "Meiling Chen", "Boxiao Chen", "Lu Liu", "Bin Zi", "Libin Ye", "Xingyu Lu", "Lei Xu", "Jun Zhou"], "brief": "\u63d0\u51fa\u9762\u5411\u667a\u80fd\u4f53\u6279\u91cf\u4efb\u52a1\u7684\u63a8\u7406\u4e0e\u73af\u5883\u534f\u540c\u4f18\u5316\u65b9\u6848\u3002\u7ed3\u5408\u8d1f\u8f7d\u8d44\u6e90\u6a21\u578b\u3001\u8f68\u8ff9\u611f\u77e5\u8c03\u5ea6\u53ca\u957f\u94fe\u4f18\u5148\u7b56\u7565\uff0c\u4f18\u5316\u663e\u5b58\u5206\u914d\u3001\u7f13\u5b58\u590d\u7528\u548c\u73af\u5883\u6267\u884c\u987a\u5e8f\u3002", "categories": ["cs.DC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.16661", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8d1f\u8f7d\u8d44\u6e90\u6a21\u578b\u534f\u8c03KV\u7f13\u5b58\u4e0e\u5faa\u73af\u72b6\u6001\u663e\u5b58\u5206\u914d", "\u8f68\u8ff9\u611f\u77e5\u8c03\u5ea6\u590d\u7528\u7f13\u5b58\uff0cCAAS\u4f18\u5148\u63a8\u8fdb\u957f\u94fe", "\u56db\u9879\u57fa\u51c6\u603b\u8017\u65f6\u964d\u4f4e10.4%\u81f365.0%\uff0c\u8bc4\u5206\u4fdd\u6301\u4e00\u81f4"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u7406\u4f18\u5316", "\u4efb\u52a1\u8c03\u5ea6", "\u8d44\u6e90\u7ba1\u7406"], "num_comments": 1, "on_hf": true, "organization": "inclusionAI", "pdf_url": "https://arxiv.org/pdf/2611.16661v1", "published_at": "2026-11-12", "score": 0.348, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16661.png", "title": "Reducing Batch Makespan for LLM Agent Workloads through Inference-Environment Coordination", "tldr": "\u901a\u8fc7\u534f\u540c\u63a8\u7406\u7f13\u5b58\u3001\u4efb\u52a1\u8c03\u5ea6\u4e0e\u73af\u5883\u6267\u884c\uff0c\u7f29\u77ed\u667a\u80fd\u4f53\u6279\u91cf\u4efb\u52a1\u603b\u8017\u65f6", "upvotes": 1, "what_it_is": "\u63d0\u51fa\u9762\u5411\u667a\u80fd\u4f53\u6279\u91cf\u4efb\u52a1\u7684\u63a8\u7406\u4e0e\u73af\u5883\u534f\u540c\u4f18\u5316\u65b9\u6848\u3002\u7ed3\u5408\u8d1f\u8f7d\u8d44\u6e90\u6a21\u578b\u3001\u8f68\u8ff9\u611f\u77e5\u8c03\u5ea6\u53ca\u957f\u94fe\u4f18\u5148\u7b56\u7565\uff0c\u4f18\u5316\u663e\u5b58\u5206\u914d\u3001\u7f13\u5b58\u590d\u7528\u548c\u73af\u5883\u6267\u884c\u987a\u5e8f\u3002", "why_notable": "\u5c06\u4f18\u5316\u76ee\u6807\u4ece\u5355\u6b21\u63a8\u7406\u6269\u5c55\u5230\u6574\u6279\u4efb\u52a1\u5b8c\u6210\u65f6\u95f4\uff0c\u517c\u987e\u63a8\u7406\u4e0e\u73af\u5883\u74f6\u9888\uff0c\u5df2\u7528\u4e8eLing-3.x\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u6d41\u7a0b\u3002"}, {"abstract": "Direct diffusion modeling of high-dimensional raw video data is challenging, and existing pixel-space methods often rely on specialized architectures. We introduce JVT (Just Video Transformer), a simple large-patch DiT-style Transformer for pixel-space video diffusion, without a pretrained autoencoder, auxiliary detailers, cascaded stages, or U-Net-style skip connections. We systematically examine video patch embeddings, register tokens, and adaptive layer normalization to identify design choices that balance generation quality and computational efficiency. The resulting JVT design achieves generation quality competitive with latent diffusion baselines in both class-conditioned and unconditional settings. The pixel-space formulation of JVT also naturally supports joint generation of pixel-aligned modalities. We demonstrate this capability through camera-conditioned RGB-disparity generation, which improves camera following relative to RGB-only baselines and yields explicit scene geometry without an additional reconstruction model at inference. These results highlight the potential of simple DiT-style Transformers for pixel-space video diffusion, and we hope our findings offer useful insights and practical guidance for future research.", "arxiv_id": "2611.18549", "arxiv_url": "https://arxiv.org/abs/2611.18549", "authors": ["Jianjun Zhou", "Hua Geng", "Haoyu Guo"], "brief": "JVT\u4ee5\u5927\u5757\u5207\u5206\u7684DiT\u5f0fTransformer\u76f4\u63a5\u751f\u6210\u50cf\u7d20\u7a7a\u95f4\u89c6\u9891\uff0c\u65e0\u9700\u9884\u8bad\u7ec3\u81ea\u7f16\u7801\u5668\u6216\u7ea7\u8054\u6a21\u5757\u3002\u901a\u8fc7\u6bd4\u8f83\u5d4c\u5165\u3001\u5bc4\u5b58\u5668\u4ee4\u724c\u4e0e\u81ea\u9002\u5e94\u5f52\u4e00\u5316\u8bbe\u8ba1\uff0c\u5e73\u8861\u8d28\u91cf\u548c\u8ba1\u7b97\u6548\u7387\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ZhouTimeMachine/JVT", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2611.18549", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["JVT\u91c7\u7528\u5927\u5757DiT\u67b6\u6784\uff0c\u65e0\u9700U-Net\u5f0f\u8df3\u8dc3\u8fde\u63a5", "\u7c7b\u522b\u6761\u4ef6\u4e0e\u65e0\u6761\u4ef6\u751f\u6210\u8d28\u91cf\u5747\u53ef\u6bd4\u6f5c\u7a7a\u95f4\u6269\u6563\u57fa\u7ebf", "\u76f8\u673a\u6761\u4ef6\u4e0b\u8054\u5408\u751f\u6210RGB\u4e0e\u89c6\u5dee\uff0c\u6539\u5584\u76f8\u673a\u8ddf\u968f"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "Transformer", "\u591a\u6a21\u6001\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18549v1", "published_at": "2026-11-13", "score": 0.308, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18549.png", "title": "JVT: Just Video Transformer makes pixel-space video diffusion simple", "tldr": "\u7528\u5927\u5757\u89c6\u9891 Transformer \u76f4\u63a5\u505a\u50cf\u7d20\u6269\u6563\uff0c\u517c\u987e\u751f\u6210\u8d28\u91cf\u4e0e\u51e0\u4f55\u8f93\u51fa\u3002", "upvotes": 15, "what_it_is": "JVT\u4ee5\u5927\u5757\u5207\u5206\u7684DiT\u5f0fTransformer\u76f4\u63a5\u751f\u6210\u50cf\u7d20\u7a7a\u95f4\u89c6\u9891\uff0c\u65e0\u9700\u9884\u8bad\u7ec3\u81ea\u7f16\u7801\u5668\u6216\u7ea7\u8054\u6a21\u5757\u3002\u901a\u8fc7\u6bd4\u8f83\u5d4c\u5165\u3001\u5bc4\u5b58\u5668\u4ee4\u724c\u4e0e\u81ea\u9002\u5e94\u5f52\u4e00\u5316\u8bbe\u8ba1\uff0c\u5e73\u8861\u8d28\u91cf\u548c\u8ba1\u7b97\u6548\u7387\u3002", "why_notable": "\u5b83\u8868\u660e\u7b80\u5355Transformer\u4e5f\u80fd\u80dc\u4efb\u50cf\u7d20\u7a7a\u95f4\u89c6\u9891\u6269\u6563\uff0c\u5e76\u53ef\u76f4\u63a5\u8f93\u51fa\u5bf9\u9f50\u7684\u573a\u666f\u51e0\u4f55\uff0c\u51cf\u5c11\u5bf9\u590d\u6742\u751f\u6210\u6d41\u6c34\u7ebf\u53ca\u989d\u5916\u91cd\u5efa\u6a21\u578b\u7684\u4f9d\u8d56\u3002"}, {"abstract": "Looped Transformers reduce parameter count by repeatedly applying shared blocks, but parameter sharing alone does not determine how the results of repeated computation are reused. We take the depth-memory view of residual connections and analyze which representation is stored after each block application and how later reads weight it. A full block output contains both its input and its new update, so weighting that output also reweights the history already carried by the input. Reading individual updates instead, with the shared stack\u0027s input kept on a separate path, gives separate controls over input strength, total update weight, and allocation across updates. The Loopback Transformer implements these controls: geometric decay sets the total update weight and supplies a recency prior, and attention learns how to allocate that weight. On ClimbMix, Loopback reaches lower validation loss than standard Transformer baselines with 40-75% of their Transformer parameters (excluding token embeddings and the output head) at reference scales from 191M to 3B, with training tokens and executed depth matched. It also has higher mean accuracy over thirteen downstream tasks at 1.4B and 3B. At 191M, 374M, and 778M, it has the lowest validation loss and the highest thirteen-task mean among the standard Transformer and seven looped residual designs.", "arxiv_id": "2611.07226", "arxiv_url": "https://arxiv.org/abs/2611.07226", "authors": ["Xuan Ouyang", "Zefan Cai", "Chenlong Zhang", "Cheng Luo", "Ke Wan", "Junjie Hu"], "brief": "\u63d0\u51fa\u5faa\u73af\u5171\u4eab\u6a21\u5757\u7684\u6b8b\u5dee\u67b6\u6784\uff0c\u5c06\u8f93\u5165\u4e0e\u6bcf\u6b21\u66f4\u65b0\u5206\u5f00\u5b58\u50a8\u548c\u8bfb\u53d6\u3002\u7528\u51e0\u4f55\u8870\u51cf\u63a7\u5236\u66f4\u65b0\u603b\u6743\u91cd\u4e0e\u8fd1\u671f\u504f\u597d\uff0c\u518d\u7531\u6ce8\u610f\u529b\u5b66\u4e60\u5404\u6b21\u66f4\u65b0\u7684\u6743\u91cd\u5206\u914d\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/yancyou/Loopback", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.07226", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u72ec\u7acb\u8bfb\u53d6\u66f4\u65b0\uff0c\u5206\u522b\u63a7\u5236\u8f93\u5165\u5f3a\u5ea6\u3001\u66f4\u65b0\u603b\u6743\u91cd\u4e0e\u5206\u914d", "ClimbMix\u4e0a\u4ec5\u7528\u57fa\u7ebf40\u201375%\u7684\u6a21\u5757\u53c2\u6570\uff0c\u9a8c\u8bc1\u635f\u5931\u66f4\u4f4e", "1.4B\u4e0e3B\u89c4\u6a21\u4e0a\uff0c\u5341\u4e09\u9879\u4e0b\u6e38\u4efb\u52a1\u5e73\u5747\u51c6\u786e\u7387\u66f4\u9ad8"], "keywords": ["\u5faa\u73af\u7f51\u7edc", "\u53c2\u6570\u5171\u4eab", "\u6b8b\u5dee\u8fde\u63a5", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 2, "on_hf": true, "organization": "University of Wisconsin - Madison", "pdf_url": "https://arxiv.org/pdf/2611.07226v1", "published_at": "2026-11-04", "score": 0.307, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.07226.png", "title": "Loopback Transformer: Towards a Unified View of Residual Looped Transformers", "tldr": "\u901a\u8fc7\u72ec\u7acb\u8bfb\u53d6\u5faa\u73af\u66f4\u65b0\u5e76\u5b66\u4e60\u5206\u914d\u6743\u91cd\uff0c\u4ee5\u66f4\u5c11\u53c2\u6570\u63d0\u5347\u8bed\u8a00\u6a21\u578b\u8868\u73b0\u3002", "upvotes": 21, "what_it_is": "\u63d0\u51fa\u5faa\u73af\u5171\u4eab\u6a21\u5757\u7684\u6b8b\u5dee\u67b6\u6784\uff0c\u5c06\u8f93\u5165\u4e0e\u6bcf\u6b21\u66f4\u65b0\u5206\u5f00\u5b58\u50a8\u548c\u8bfb\u53d6\u3002\u7528\u51e0\u4f55\u8870\u51cf\u63a7\u5236\u66f4\u65b0\u603b\u6743\u91cd\u4e0e\u8fd1\u671f\u504f\u597d\uff0c\u518d\u7531\u6ce8\u610f\u529b\u5b66\u4e60\u5404\u6b21\u66f4\u65b0\u7684\u6743\u91cd\u5206\u914d\u3002", "why_notable": "\u628a\u5faa\u73af\u6a21\u578b\u7684\u8bbe\u8ba1\u91cd\u70b9\u4ece\u53c2\u6570\u5171\u4eab\u63a8\u8fdb\u5230\u5386\u53f2\u66f4\u65b0\u5982\u4f55\u590d\u7528\uff1b\u5728\u8bad\u7ec3\u8bcd\u5143\u6570\u548c\u6267\u884c\u6df1\u5ea6\u5339\u914d\u4e0b\uff0c\u5c55\u793a\u4e86\u53c2\u6570\u6548\u7387\u4e0e\u4e0b\u6e38\u8868\u73b0\u7684\u540c\u6b65\u6539\u5584\u3002"}, {"abstract": "Recent advancements in multimodal diffusion language models (MDLMs) have exhibited strong global modeling capabilities through iterative refinement. We observe that mask uncertainty follows an overall downward trend during iterative denoising, while a few denoising steps exhibit localized entropy spikes closely associated with hallucinations. We argue that anomalous steps can be identified by measuring the entropy deviation of each denoising step from its neighboring temporal window. We hypothesize that discrete token commitment discards the distributional information at masked positions, limiting the continued interaction between candidate semantics and the context during entropy spikes. With this goal, we present StepRefine, a plug-and-play decoding strategy that leverages semantic context to achieve reliable denoising. The core of our method lies in a step-aware switch between discrete denoising and latent refinement. The model employs probability-weighted embeddings at entropy spike steps to preserve diverse reasoning hypotheses and performs multiple rounds of continuous refinement. Meanwhile, a refinement controller monitors distributional stability to reduce unnecessary loops and switch the model back to standard discrete denoising. Through extensive experiments, StepRefine demonstrates significant hallucination mitigation across different MDLMs on multimodal benchmarks.", "arxiv_id": "2611.12901", "arxiv_url": "https://arxiv.org/abs/2611.12901", "authors": ["Zhongxing Xu", "Zhonghua Wang", "Zhe Qian", "Shiyan Su", "Ming Hu", "Xiaocheng Zou", "Wei Feng", "Mingquan Lin", "Yuyin Zhou", "Yifan Peng", "Hamid Rezatofighi", "Zongyuan Ge"], "brief": "\u63d0\u51fa\u5373\u63d2\u5373\u7528\u89e3\u7801\u7b56\u7565StepRefine\uff0c\u4ee5\u90bb\u8fd1\u65f6\u95f4\u7a97\u7684\u71b5\u504f\u5dee\u8bc6\u522b\u5f02\u5e38\u53bb\u566a\u6b65\u9aa4\uff0c\u518d\u7528\u6982\u7387\u52a0\u6743\u5d4c\u5165\u8fdb\u884c\u8fde\u7eed\u7cbe\u70bc\uff0c\u7a33\u5b9a\u540e\u6062\u590d\u79bb\u6563\u53bb\u566a\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/mdlm-steprefine/mdlm-steprefine", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.12901", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4ee5\u76f8\u5bf9\u90bb\u8fd1\u65f6\u95f4\u7a97\u7684\u71b5\u504f\u5dee\u5b9a\u4f4d\u71b5\u5c16\u5cf0", "StepRefine\u7528\u6982\u7387\u52a0\u6743\u5d4c\u5165\u4fdd\u7559\u5019\u9009\u8bed\u4e49", "\u7cbe\u70bc\u63a7\u5236\u5668\u76d1\u6d4b\u5206\u5e03\u7a33\u5b9a\u6027\uff0c\u51cf\u5c11\u591a\u4f59\u5faa\u73af"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9\u6291\u5236", "\u89e3\u7801\u7b56\u7565"], "num_comments": 3, "on_hf": true, "organization": "Cornell University", "pdf_url": "https://arxiv.org/pdf/2611.12901v1", "published_at": "2026-10-14", "score": 0.295, "selected_reasons": ["HF trending (35\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12901.png", "title": "Rethinking in Spikes: Mitigating Hallucinations in MDLMs with Step-Aware Decoding", "tldr": "\u901a\u8fc7\u8bc6\u522b\u53bb\u566a\u4e2d\u7684\u5c40\u90e8\u71b5\u5c16\u5cf0\u5e76\u5207\u6362\u8fde\u7eed\u7cbe\u70bc\uff0c\u51cf\u5c11\u591a\u6a21\u6001\u6269\u6563\u8bed\u8a00\u6a21\u578b\u5e7b\u89c9\u3002", "upvotes": 35, "what_it_is": "\u63d0\u51fa\u5373\u63d2\u5373\u7528\u89e3\u7801\u7b56\u7565StepRefine\uff0c\u4ee5\u90bb\u8fd1\u65f6\u95f4\u7a97\u7684\u71b5\u504f\u5dee\u8bc6\u522b\u5f02\u5e38\u53bb\u566a\u6b65\u9aa4\uff0c\u518d\u7528\u6982\u7387\u52a0\u6743\u5d4c\u5165\u8fdb\u884c\u8fde\u7eed\u7cbe\u70bc\uff0c\u7a33\u5b9a\u540e\u6062\u590d\u79bb\u6563\u53bb\u566a\u3002", "why_notable": "\u5c06\u5e7b\u89c9\u5e72\u9884\u96c6\u4e2d\u4e8e\u5f02\u5e38\u53bb\u566a\u6b65\u9aa4\uff0c\u517c\u987e\u5019\u9009\u8bed\u4e49\u4fdd\u7559\u4e0e\u89e3\u7801\u5f00\u9500\uff1b\u591a\u6a21\u578b\u3001\u591a\u6a21\u6001\u57fa\u51c6\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u663e\u8457\u7f13\u89e3\u5e7b\u89c9\u3002"}, {"abstract": "Open driving releases and usage-based insurance programs often claim to prevent privacy breaches by omitting GPS records when sharing or collecting vehicle data. However, removing GPS coordinates from driving logs does not erase the location information carried by vehicle signals. While prior route-inference attacks have demonstrated that speed, steering, and driving events can be matched to road networks to reconstruct trajectories, existing studies rely on inconsistent prior assumptions and evaluation metrics and are tested only on small, restricted datasets, making their results difficult to compare and their real-world effectiveness uncertain. We release CANTraj, a naturalistic driving dataset pairing decoded CAN events with time-aligned GNSS trajectories (3,940 drives, 454 drivers), and CANTraj-Bench for evaluating trajectory recovery (3,675 drives, 431 drivers, 1,380 hours, 85,919 km). On 776 evaluation drives from 94 unseen drivers, we compare six re-implemented attacks and benchmark baselines under explicit information-access protocols, paired comparisons, and metrics incorporating failures. Experiments show that combining steering signals with road-network constraints yields the largest gain: With a known start and heading, adding steering to speed raises the online map filter\u0027s five-minute route recovery from 56% to 87%, with a median average displacement error of 43 m versus 921 m for map-free dead reckoning. Offline beam search recovers 88% of test routes with the heading and 81% without it. Because methods fail on different windows, we also evaluate an LLM harness that selects among candidate routes on 659 five-minute windows; its best configuration recovers 79% of routes on test and 83% on few-shot, outperforming the best baseline on test and matching it on few-shot. Data and code at huggingface.co/datasets/HenryYHW/CANTraj and github.com/WangYuHang-cmd/GPS--CAN.", "arxiv_id": "2611.18442", "arxiv_url": "https://arxiv.org/abs/2611.18442", "authors": ["Yuhang Wang", "Jingxin Yang", "Chuheng Wei", "Suyang Chen", "Haozhuang Chi", "Hao Zhou"], "brief": "\u53d1\u5e03\u914d\u5bf9CAN\u4fe1\u53f7\u4e0eGNSS\u8f68\u8ff9\u7684\u81ea\u7136\u9a7e\u9a76\u6570\u636e\u96c6\u53ca\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5728\u7edf\u4e00\u4fe1\u606f\u8bbf\u95ee\u6761\u4ef6\u4e0b\u6bd4\u8f83\u516d\u79cd\u8def\u7ebf\u63a8\u65ad\u653b\u51fb\uff0c\u5e76\u6d4b\u8bd5\u5927\u6a21\u578b\u5bf9\u5019\u9009\u8def\u7ebf\u7684\u9009\u62e9\u80fd\u529b\u3002", "categories": ["cs.CR", "cs.DB"], "github_repo": "https://github.com/WangYuHang-cmd/GPS--CAN", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18442", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["CANTraj-Bench\u8986\u76d63,675\u6b21\u9a7e\u9a76\u300185,919\u516c\u91cc", "\u5df2\u77e5\u8d77\u70b9\u4e0e\u671d\u5411\u65f6\uff0c\u52a0\u5165\u8f6c\u5411\u4f7f\u5728\u7ebf\u6062\u590d\u7387\u4ece56%\u5347\u81f387%", "\u79bb\u7ebf\u675f\u641c\u7d22\u6709\u671d\u5411\u6062\u590d\u738788%\uff0c\u65e0\u671d\u5411\u4ecd\u8fbe81%"], "keywords": ["\u4f4d\u7f6e\u9690\u79c1", "\u8f66\u8054\u7f51", "\u8f68\u8ff9\u6062\u590d", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": "MOTIF-LAB", "pdf_url": "https://arxiv.org/pdf/2611.18442v1", "published_at": "2026-11-13", "score": 0.272, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18442.png", "title": "CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving", "tldr": "\u771f\u5b9e\u9a7e\u9a76\u57fa\u51c6\u63ed\u793a\uff1a\u5373\u4f7f\u79fb\u9664GPS\uff0cCAN\u4fe1\u53f7\u4ecd\u53ef\u9ad8\u7cbe\u5ea6\u6062\u590d\u8f66\u8f86\u8def\u7ebf\u3002", "upvotes": 11, "what_it_is": "\u53d1\u5e03\u914d\u5bf9CAN\u4fe1\u53f7\u4e0eGNSS\u8f68\u8ff9\u7684\u81ea\u7136\u9a7e\u9a76\u6570\u636e\u96c6\u53ca\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5728\u7edf\u4e00\u4fe1\u606f\u8bbf\u95ee\u6761\u4ef6\u4e0b\u6bd4\u8f83\u516d\u79cd\u8def\u7ebf\u63a8\u65ad\u653b\u51fb\uff0c\u5e76\u6d4b\u8bd5\u5927\u6a21\u578b\u5bf9\u5019\u9009\u8def\u7ebf\u7684\u9009\u62e9\u80fd\u529b\u3002", "why_notable": "\u4ee5\u5927\u89c4\u6a21\u771f\u5b9e\u9a7e\u9a76\u6570\u636e\u548c\u7edf\u4e00\u8bc4\u6d4b\u91cf\u5316\u53bbGPS\u540e\u7684\u5b9a\u4f4d\u6cc4\u9732\u98ce\u9669\uff0c\u4e3a\u8f66\u8054\u7f51\u6570\u636e\u5171\u4eab\u4e0e\u8f66\u9669\u9690\u79c1\u4fdd\u62a4\u63d0\u4f9b\u5b9e\u8bc1\u4f9d\u636e\u3002"}, {"abstract": "Meetings last up to an hour, and nobody knows in advance how many people will speak. Neural diarizers with a fixed number of output slots, such as Streaming Sortformer and Nemotron-3, are accurate and run online, but they cannot name more speakers than they have slots. We remove this limit without retraining. The slot head keeps deciding who is active and when speech overlaps, and speaker embeddings are clustered inside a single slot, with the official e-means algorithm, only after every slot has been used. In the streaming system, re-clustering is confined to a bounded window, labels are revised for a few seconds, and identities are anchored to the slots of the head. The resulting system has no limit on the number of speakers and stays accurate when speakers outnumber the slots, where fixed-slot models break down. On meetings that grow to an hour it stays far more accurate than Streaming Sortformer, which accumulates errors, and its cost per update does not grow with the meeting. The same recipe turns the four-slot Streaming Sortformer into an open-speaker system. Across recordings, e-means makes it affordable to link the speakers of a large archive frame by frame, a task that arises when conversational corpora are prepared, and it reaches the clustering quality of Lloyd\u0027s $k$-means several times faster. The method needs little tuning, and e-means runs with its default recipe from a few hundred to more than a million embeddings.", "arxiv_id": "2611.18529", "arxiv_url": "https://arxiv.org/abs/2611.18529", "authors": ["Kyudan Jung", "Jihwan Kim", "Minwoo Lee", "Eunji Shin", "Jaegul Choo"], "brief": "\u4fdd\u7559\u795e\u7ecf\u5206\u79bb\u5668\u69fd\u4f4d\u5934\u5bf9\u53d1\u8a00\u548c\u91cd\u53e0\u7684\u5224\u65ad\uff0c\u69fd\u4f4d\u7528\u5c3d\u540e\u4ee5e-means\u805a\u7c7b\u69fd\u5185\u8bf4\u8bdd\u4eba\u5d4c\u5165\uff1b\u901a\u8fc7\u6709\u754c\u7a97\u53e3\u91cd\u805a\u7c7b\u548c\u8eab\u4efd\u951a\u5b9a\uff0c\u5b9e\u73b0\u4eba\u6570\u4e0d\u9650\u7684\u6d41\u5f0f\u8bf4\u8bdd\u4eba\u5206\u79bb\u3002", "categories": ["cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18529", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u69fd\u4f4d\u7528\u5c3d\u540e\u542f\u7528e-means\uff0c\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3", "\u6709\u754c\u7a97\u53e3\u91cd\u805a\u7c7b\uff0c\u5355\u6b21\u66f4\u65b0\u6210\u672c\u4e0d\u968f\u4f1a\u8bae\u65f6\u957f\u589e\u957f", "\u8986\u76d6\u6570\u767e\u81f3\u767e\u4e07\u4ee5\u4e0a\u5d4c\u5165\uff0c\u8f83Lloyd\u2019s k-means\u5feb\u6570\u500d"], "keywords": ["\u8bf4\u8bdd\u4eba\u5206\u79bb", "\u6d41\u5f0f\u5904\u7406", "\u805a\u7c7b", "\u8bed\u97f3\u6863\u6848"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2611.18529v1", "published_at": "2026-11-13", "score": 0.272, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18529.png", "title": "eDIAR: Training-Free Open-Speaker Streaming Diarization for Long Meetings and Large Archives via e-means", "tldr": "\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u7a81\u7834\u8bf4\u8bdd\u4eba\u69fd\u4f4d\u9650\u5236\uff0c\u652f\u6301\u957f\u4f1a\u8bae\u6d41\u5f0f\u5206\u79bb\u4e0e\u5927\u578b\u6863\u6848\u8eab\u4efd\u5173\u8054\u3002", "upvotes": 11, "what_it_is": "\u4fdd\u7559\u795e\u7ecf\u5206\u79bb\u5668\u69fd\u4f4d\u5934\u5bf9\u53d1\u8a00\u548c\u91cd\u53e0\u7684\u5224\u65ad\uff0c\u69fd\u4f4d\u7528\u5c3d\u540e\u4ee5e-means\u805a\u7c7b\u69fd\u5185\u8bf4\u8bdd\u4eba\u5d4c\u5165\uff1b\u901a\u8fc7\u6709\u754c\u7a97\u53e3\u91cd\u805a\u7c7b\u548c\u8eab\u4efd\u951a\u5b9a\uff0c\u5b9e\u73b0\u4eba\u6570\u4e0d\u9650\u7684\u6d41\u5f0f\u8bf4\u8bdd\u4eba\u5206\u79bb\u3002", "why_notable": "\u5c06\u56fa\u5b9a\u69fd\u4f4d\u6a21\u578b\u6269\u5c55\u4e3a\u5f00\u653e\u4eba\u6570\u7cfb\u7edf\uff0c\u7f13\u89e3\u957f\u4f1a\u8bae\u4e2d\u7684\u8bef\u5dee\u7d2f\u79ef\uff0c\u540c\u65f6\u964d\u4f4e\u5927\u578b\u8bed\u97f3\u6863\u6848\u8de8\u5f55\u97f3\u8bf4\u8bdd\u4eba\u5173\u8054\u7684\u8ba1\u7b97\u6210\u672c\u3002"}, {"abstract": "Learning whole-body mobile manipulation requires demonstrations that coordinate bimanual actions with locomotion across extended workspaces. However, existing interfaces trade off direct robot control, perception and action alignment, and natural operator mobility, making such demonstrations difficult to collect. We introduce HALO, a human-aligned data collection system for whole-body mobile manipulation. The system aligns the operator\u0027s perception and action space with the robot while preserving direct physical feedback and natural locomotion. Operators guide the robot end-effectors through kinesthetic teaching and move a low-resistance platform without the deployed mobile base while performing bimanual manipulation. This interface enables more natural whole-body demonstrations, but the close human-robot coupling introduces discrepancies between the demonstration and deployment settings. We address these discrepancies with deployment-aligned demonstration processing, which calibrates and temporally aligns platform motion with the deployed base response and masks and inpaints demonstrator hands in recorded observations. Compared with Mobile ALOHA and VR teleoperation, HALO enables up to 2.9x faster demonstration collection while maintaining comparable or higher success rates. Policies trained with HALO perform precise manipulation tasks, including zip-tie fastening, and achieve a 73.3% success rate on a six-stage long-horizon mobile manipulation task involving repeated coordinated base and arm motion. Project page: https://robbyant-research.github.io/Lingbot-ALOHA/", "arxiv_id": "2611.16439", "arxiv_url": "https://arxiv.org/abs/2611.16439", "authors": ["Shuai Yang", "Fangyi Xu", "Yishu Shen", "Kecheng Zheng", "Yinghao Xu"], "brief": "HALO\u8ba9\u64cd\u4f5c\u8005\u76f4\u63a5\u5f15\u5bfc\u673a\u5668\u4eba\u53cc\u81c2\uff0c\u5e76\u63a8\u52a8\u4f4e\u963b\u529b\u5e73\u53f0\u91c7\u96c6\u5168\u8eab\u52a8\u4f5c\uff1b\u518d\u6821\u51c6\u5e95\u76d8\u8fd0\u52a8\u3001\u53bb\u9664\u753b\u9762\u4e2d\u7684\u4eba\u624b\uff0c\u4f7f\u793a\u6559\u6570\u636e\u8d34\u8fd1\u5b9e\u9645\u90e8\u7f72\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/robbyant-research/Lingbot-ALOHA", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.16439", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u52a8\u89c9\u793a\u6559\u7ed3\u5408\u4f4e\u963b\u529b\u5e73\u53f0\uff0c\u4fdd\u7559\u7269\u7406\u53cd\u9988\u4e0e\u81ea\u7136\u79fb\u52a8", "\u6821\u51c6\u5e76\u65f6\u5e8f\u5bf9\u9f50\u5e95\u76d8\u54cd\u5e94\uff0c\u906e\u7f69\u5e76\u4fee\u590d\u793a\u6559\u8005\u624b\u90e8", "\u91c7\u96c6\u901f\u5ea6\u6700\u9ad8\u63d0\u53472.9\u500d\uff0c\u516d\u9636\u6bb5\u4efb\u52a1\u6210\u529f\u738773.3%"], "keywords": ["\u79fb\u52a8\u64cd\u4f5c", "\u6a21\u4eff\u5b66\u4e60", "\u673a\u5668\u4eba\u793a\u6559", "\u53cc\u81c2\u534f\u540c"], "num_comments": 2, "on_hf": true, "organization": "Robbyant Research", "pdf_url": "https://arxiv.org/pdf/2611.16439v1", "published_at": "2026-11-12", "score": 0.263, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16439.png", "title": "HALO: Human-Aligned Data Collection for WhoLe-body MObile Manipulation", "tldr": "\u901a\u8fc7\u81ea\u7136\u79fb\u52a8\u4e0e\u53cc\u81c2\u52a8\u89c9\u793a\u6559\uff0c\u63d0\u5347\u5168\u8eab\u79fb\u52a8\u64cd\u4f5c\u7684\u6570\u636e\u91c7\u96c6\u6548\u7387\u548c\u7b56\u7565\u8868\u73b0\u3002", "upvotes": 10, "what_it_is": "HALO\u8ba9\u64cd\u4f5c\u8005\u76f4\u63a5\u5f15\u5bfc\u673a\u5668\u4eba\u53cc\u81c2\uff0c\u5e76\u63a8\u52a8\u4f4e\u963b\u529b\u5e73\u53f0\u91c7\u96c6\u5168\u8eab\u52a8\u4f5c\uff1b\u518d\u6821\u51c6\u5e95\u76d8\u8fd0\u52a8\u3001\u53bb\u9664\u753b\u9762\u4e2d\u7684\u4eba\u624b\uff0c\u4f7f\u793a\u6559\u6570\u636e\u8d34\u8fd1\u5b9e\u9645\u90e8\u7f72\u3002", "why_notable": "\u5b83\u517c\u987e\u76f4\u89c2\u64cd\u4f5c\u4e0e\u90e8\u7f72\u4e00\u81f4\u6027\uff0c\u76f8\u6bd4\u73b0\u6709\u9065\u64cd\u4f5c\u63a5\u53e3\u52a0\u5feb\u91c7\u96c6\uff0c\u4e14\u4fdd\u6301\u76f8\u5f53\u6216\u66f4\u9ad8\u6210\u529f\u7387\uff0c\u4e3a\u7cbe\u7ec6\u3001\u957f\u7a0b\u79fb\u52a8\u64cd\u4f5c\u63d0\u4f9b\u6709\u6548\u8bad\u7ec3\u6570\u636e\u3002"}, {"abstract": "Text-to-SQL systems translate natural language questions into SQL queries over increasingly complex databases. However, widely used benchmarks evaluate questions independently, overlooking settings where earlier queries over the same database can supply joins or calculations for a new question. We introduce HARE (History-AwaRe Text-to-SQL BEnchmark) to measure the accuracy and cost of adapting historical SQL. HARE comprises 1,600 requests derived from a fixed pool of 823 verified queries across four datasets. Annotations record which components each request preserves and which edits it requires, distinguishing whole-query adaptation from partial reuse. Our method, MEM-SQL (Memory-EMpowered Text-to-SQL), stores whole-query templates, reusable SQL blocks, and mappings from domain concepts to schema elements. MEM-SQL uses a layer only if every requirement assigned to it has a match above that layer\u0027s threshold. With On-demand Schema Linking (OSL), MEM-SQL consults the schema only when no layer qualifies or the generator judges retrieved evidence insufficient. Across six language models on HARE, mean execution accuracy rises from 37.1% for Direct Generation without history to 50.0% for MEM-SQL, with 76.6% fewer input tokens and 68.8% lower latency on average. Further analysis shows that requests reusing several verified queries remain a bottleneck, with accuracy falling from 56.7% to 29.7%, most sharply when reused components must be placed in a new query structure or combined with a shared join. Applying OSL to three other memory designs consistently reduces generation cost, while its accuracy benefit depends on the memory design. Verified history can thus make generation both more accurate and cheaper, but its value depends on the evidence retained and when the system consults the schema.", "arxiv_id": "2611.18338", "arxiv_url": "https://arxiv.org/abs/2611.18338", "authors": ["Xiaoqi Wang", "Wenqi Pei", "Shizheng Hou", "Yilai Liu", "Han Chen", "Boyan Li", "Yuyu Luo", "Hongyang Du"], "brief": "\u63d0\u51fa\u5386\u53f2\u611f\u77e5\u57fa\u51c6HARE\u4e0e\u8bb0\u5fc6\u589e\u5f3a\u65b9\u6cd5MEM-SQL\uff0c\u5206\u5c42\u4fdd\u5b58\u67e5\u8be2\u6a21\u677f\u3001SQL\u5757\u548c\u6982\u5ff5\u6620\u5c04\uff1b\u6309\u5339\u914d\u9608\u503c\u590d\u7528\u5386\u53f2\u8bc1\u636e\uff0c\u4e0d\u8db3\u65f6\u624d\u67e5\u9605\u6570\u636e\u5e93\u6a21\u5f0f\u3002", "categories": ["cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18338", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["HARE\u542b1600\u4e2a\u8bf7\u6c42\uff0c\u6e90\u4e8e\u56db\u4e2a\u6570\u636e\u96c6\u7684823\u6761\u5df2\u9a8c\u8bc1\u67e5\u8be2", "MEM-SQL\u7ed3\u5408\u5206\u5c42\u5339\u914d\u4e0e\u6309\u9700\u6a21\u5f0f\u94fe\u63a5OSL", "\u516d\u6a21\u578b\u5e73\u5747\u51c6\u786e\u738737.1%\u219250.0%\uff0c\u8f93\u5165\u8bcd\u5143\u51cf\u5c1176.6%"], "keywords": ["\u81ea\u7136\u8bed\u8a00\u8f6cSQL", "\u8bb0\u5fc6\u589e\u5f3a", "\u6a21\u5f0f\u94fe\u63a5", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 5, "on_hf": true, "organization": "The University of Hong Kong", "pdf_url": "https://arxiv.org/pdf/2611.18338v1", "published_at": "2026-11-13", "score": 0.262, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18338.png", "title": "MEM-SQL: Memory-Empowered Text-to-SQL", "tldr": "\u901a\u8fc7\u5206\u5c42\u590d\u7528\u5386\u53f2\u67e5\u8be2\u5e76\u6309\u9700\u67e5\u9605\u6a21\u5f0f\uff0c\u540c\u65f6\u63d0\u5347SQL\u751f\u6210\u51c6\u786e\u7387\u4e0e\u6548\u7387\u3002", "upvotes": 17, "what_it_is": "\u63d0\u51fa\u5386\u53f2\u611f\u77e5\u57fa\u51c6HARE\u4e0e\u8bb0\u5fc6\u589e\u5f3a\u65b9\u6cd5MEM-SQL\uff0c\u5206\u5c42\u4fdd\u5b58\u67e5\u8be2\u6a21\u677f\u3001SQL\u5757\u548c\u6982\u5ff5\u6620\u5c04\uff1b\u6309\u5339\u914d\u9608\u503c\u590d\u7528\u5386\u53f2\u8bc1\u636e\uff0c\u4e0d\u8db3\u65f6\u624d\u67e5\u9605\u6570\u636e\u5e93\u6a21\u5f0f\u3002", "why_notable": "\u5c06\u5386\u53f2\u67e5\u8be2\u590d\u7528\u7eb3\u5165\u8bc4\u6d4b\uff0c\u5c55\u793a\u51c6\u786e\u7387\u4e0e\u6210\u672c\u53ef\u540c\u6b65\u6539\u5584\uff1b\u4f46\u591a\u67e5\u8be2\u7ec4\u5408\u4ecd\u662f\u74f6\u9888\uff0c\u51c6\u786e\u7387\u4ece56.7%\u964d\u81f329.7%\u3002"}, {"abstract": "Distribution matching distillation (DMD) has emerged as a leading paradigm for distilling diffusion models into few-step students, where an auxiliary fake score model tracks the student\u0027s distribution and the discrepancy between the teacher and fake predictions drives the student toward the teacher. In multi-step distillation, although only the student\u0027s final output is delivered, existing methods train the fake model on intermediate states or across all denoising steps. Consequently, the student\u0027s update signal becomes entangled with intermediate distributions, which can distort the matching direction and remain nonzero even after the student\u0027s final outputs already match the teacher distribution. To resolve this mismatch, we propose Endpoint Distribution Matching Distillation (eDMD), which trains a single shared fake model exclusively on the student\u0027s final outputs and uses it to correct every denoising step. Our theoretical analysis proves that this endpoint reference guarantees that the distribution matching term vanishes if and only if the student\u0027s final output distribution matches the teacher\u0027s, regardless of intermediate distributions. Beyond the fake reference, we further strengthen teacher supervision through a precise teacher (PT) that replaces single-step guided predictions with short multi-step trajectories on the final noise interval, paired with a calibrated query density for intermediate steps. Experiments on SD3-Medium, FLUX.2-klein (4B and 9B), and Qwen-Image-2.1 demonstrate that eDMD consistently outperforms existing distribution matching methods for 4-step generation.", "arxiv_id": "2611.17194", "arxiv_url": "https://arxiv.org/abs/2611.17194", "authors": ["Tong Zhao", "Xianfang Zeng", "Yucheng Han", "Ruoyu Wang", "Mingkun Lei", "Gang Yu", "Chi Zhang"], "brief": "eDMD\u53ea\u7528\u5b66\u751f\u6700\u7ec8\u8f93\u51fa\u8bad\u7ec3\u5171\u4eab\u4f2a\u5206\u6570\u6a21\u578b\uff0c\u5e76\u636e\u6b64\u6821\u6b63\u6bcf\u4e2a\u53bb\u566a\u6b65\u9aa4\uff1b\u540c\u65f6\u4ee5\u77ed\u591a\u6b65\u6559\u5e08\u8f68\u8ff9\u548c\u6821\u51c6\u67e5\u8be2\u5bc6\u5ea6\u5f3a\u5316\u76d1\u7763\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17194", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7406\u8bba\u8bc1\u660e\uff1a\u5339\u914d\u9879\u4e3a\u96f6\u5f53\u4e14\u4ec5\u5f53\u6700\u7ec8\u5206\u5e03\u5339\u914d", "\u7cbe\u786e\u6559\u5e08PT\u7528\u77ed\u591a\u6b65\u8f68\u8ff9\u66ff\u4ee3\u5355\u6b65\u5f15\u5bfc\u9884\u6d4b", "\u5728SD3\u3001FLUX\u548cQwen\u4e0a\u56db\u6b65\u751f\u6210\u5747\u4f18\u4e8e\u73b0\u6709DMD"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u5206\u5e03\u5339\u914d", "\u5c11\u6b65\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17194v1", "published_at": "2026-11-12", "score": 0.254, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17194.png", "title": "eDMD: Endpoint Distribution Matching for Few-Step Diffusion Distillation", "tldr": "\u4ec5\u4ee5\u6700\u7ec8\u8f93\u51fa\u5206\u5e03\u6307\u5bfc\u6269\u6563\u84b8\u998f\uff0c\u907f\u514d\u4e2d\u95f4\u72b6\u6001\u5e72\u6270\u5e76\u63d0\u5347\u56db\u6b65\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 5, "what_it_is": "eDMD\u53ea\u7528\u5b66\u751f\u6700\u7ec8\u8f93\u51fa\u8bad\u7ec3\u5171\u4eab\u4f2a\u5206\u6570\u6a21\u578b\uff0c\u5e76\u636e\u6b64\u6821\u6b63\u6bcf\u4e2a\u53bb\u566a\u6b65\u9aa4\uff1b\u540c\u65f6\u4ee5\u77ed\u591a\u6b65\u6559\u5e08\u8f68\u8ff9\u548c\u6821\u51c6\u67e5\u8be2\u5bc6\u5ea6\u5f3a\u5316\u76d1\u7763\u3002", "why_notable": "\u5c06\u84b8\u998f\u76ee\u6807\u4e0e\u5b9e\u9645\u4ea4\u4ed8\u7684\u6700\u7ec8\u8f93\u51fa\u5bf9\u9f50\uff0c\u6d88\u9664\u4e2d\u95f4\u5206\u5e03\u9020\u6210\u7684\u66f4\u65b0\u504f\u5dee\uff1b\u8de8\u591a\u4e2a\u4e3b\u6d41\u6a21\u578b\u7684\u56db\u6b65\u5b9e\u9a8c\u663e\u793a\u4e86\u65b9\u6cd5\u7684\u901a\u7528\u4ef7\u503c\u3002"}, {"abstract": "Distilling diffusion models into few-step student models substantially reduces sampling latency, but induces severe diversity collapse: samples generated from different random seeds show minimal variation. In this work, we investigate the root cause of this failure by probing the internal representations of student models relative to their teachers. We find that distilled students maintain total activation variance comparable to their teachers, but concentrate it into substantially fewer directions. This directional collapse is localized to an identifiable intermediate block at the initial denoising step. Consequently, diversity collapse stems from a misallocation of activation variance rather than an inherent loss of generative capacity. Guided by this finding, we propose ReDiverse to reinstate the missing variance directions. At training time, ReDiverse-FT fine-tunes a lightweight adapter that regresses student activations onto the teacher\u0027s, reviving the teacher\u0027s feature variance characteristic. At inference time, ReDiverse-TF introduces a training-free mechanism that steers activations along precomputed teacher principal directions. Across image and video distillation benchmarks, ReDiverse consistently restores sample diversity while preserving generation quality, further supported by the user study.", "arxiv_id": "2611.18550", "arxiv_url": "https://arxiv.org/abs/2611.18550", "authors": ["Furkan Horoz", "Ozgur Kara", "Kaan Oktay", "Adil Kaan Akan", "Atakan Kara", "Anand Bhattad", "James Matthew Rehg"], "brief": "\u7814\u7a76\u901a\u8fc7\u63a2\u6d4b\u5e08\u751f\u6a21\u578b\u6fc0\u6d3b\uff0c\u5c06\u591a\u6837\u6027\u584c\u7f29\u5b9a\u4f4d\u5230\u521d\u59cb\u53bb\u566a\u7684\u4e2d\u95f4\u5757\u3002\u63d0\u51fa\u8f7b\u91cf\u9002\u914d\u5668\u5fae\u8c03\u548c\u514d\u8bad\u7ec3\u65b9\u5411\u5f15\u5bfc\u4e24\u79cd\u65b9\u6848\uff0c\u8865\u56de\u7f3a\u5931\u7684\u65b9\u5dee\u65b9\u5411\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/H-furkan/rediverse", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.18550", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5b66\u751f\u6fc0\u6d3b\  large corpus of 143,209 execution trajectories from 125 agent configurations spanning 117 unique models. To enable comparisons across heterogeneous agent interfaces, we develop a rule-based parser that maps raw execution traces to high-level actions such as repository search, file editing, and test execution, and audit its predictions against a six-model consensus reference on 500 events. We find that agents with similar solve rates can nevertheless differ substantially in how they explore, modify and verify code. Moreover, without using task outcomes, token counts, or tool names as features, aggregate behavioral profiles retrieve the corresponding agent stack across disjoint repository sets and programming languages, although task composition is not fully controlled in the cross-repository setting. Through analyses of frontier models and agent scaffolds, we further show that scaffold choice and reasoning effort systematically shift agents\u0027 search, editing, and testing behavior. We release the deterministic parser together with the full annotation and analysis pipeline alongside an annotated trajectory subset.", "arxiv_id": "2611.17440", "arxiv_url": "https://arxiv.org/abs/2611.17440", "authors": ["Ibragim Badertdinov", "Alexander Golubev"], "brief": "\u7814\u7a76\u7528\u89c4\u5219\u89e3\u6790\u5668\u5c06\u7f16\u7801\u667a\u80fd\u4f53\u6267\u884c\u65e5\u5fd7\u8f6c\u4e3a\u641c\u7d22\u3001\u7f16\u8f91\u3001\u6d4b\u8bd5\u7b49\u9ad8\u5c42\u52a8\u4f5c\uff0c\u518d\u4ee5\u805a\u5408\u884c\u4e3a\u753b\u50cf\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u4e0e\u6846\u67b6\uff0c\u5206\u6790\u884c\u4e3a\u5dee\u5f02\u53ca\u5176\u8fa8\u8bc6\u80fd\u529b\u3002", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": "https://github.com/SWE-rebench/trajectory-analyzer", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17440", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5206\u6790143,209\u6761\u8f68\u8ff9\uff0c\u8986\u76d6125\u79cd\u914d\u7f erence image quality assessment (NR-IQA) metrics. However, it remains unclear whether these metrics agree with human judgments. We evaluate 73 handcrafted underwater, learned underwater, vision-language and general-purpose metrics against human preferences on five references: four published opinion-score sets and a new paired-comparison study. For each metric, we measure how often it selects the same image as people when comparing versions of the same scene. We further test whether simple image edits and small adversarial perturbations raise metric scores above the enhancement people preferred, and whether scores decrease as repeated generative edits add noise. Our results show that no metric consistently matches human preferences. The best worst-case Cohen\u0027s kappa over the five references is only 0.23 (Q-Align), while two raters in our study agree with a median kappa of 0.41. The widely used UCIQE often favors edits that people reject. On a Nano Banana Pro replica chain that should leave the image unchanged, only 22 of 73 scores decrease at every checkpoint, while noise grows by 2.5 times. We also introduce TrustUIQA, a benchmark that combines the human references, our study choices, the edited, attacked and generated images, and the scores of every metric on every image. The code is available at https://github.com/TrustUIQA/TrustUIQA and TrustUIQA at https://huggingface.co/datasets/TrustUIQA/TrustUIQA.", "arxiv_id": "2611.18429", "arxiv_url": "https://arxiv.org/abs/2611.18429", "authors": ["Rishii Kumar Singh", "Abhinav Rajput", "Dinesh Kumar Vishwakarma"], "brief": "\u6784\u5efaTrustUIQA\u57fa\u51c6\uff0c\u7528\u4e94\u7ec4\u4eba\u7c7b\u504f\u597d\u6570\u636e\u68c0\u9a8c73\u79cd\u65e0\u53c2\u8003\u8d28\u91cf\u6307\u6807\uff0c\u5e76\u901a\u8fc7\u7b80\u5355\u7f16\u8f91\u3001\u5bf9\u6297\u6270\u52a8\u548c\u8fde\u7eed\u751f\u6210\u6d4b\u8bd5\u5176\u53ef\u9760\u6027\u3002", "categories": ["cs.CV", "eess.IV"], "github_repo": "https://github.com/TrustUIQA/TrustUIQA" but wrong tree fails silently: nothing downstream can tell. We ask whether the output format, a free design choice, controls how often this happens. On the PIZZA ordering benchmark we fine-tune two sub-billion models (Qwen3.5-0.8B and LFM2.5-350M) with LoRA on six lossless encodings of the same target tree, from 44.3 down to 10.9 tokens per order, including two matched-length pairs that vary surface form at fixed length. Across 300 runs (5 training pool sizes, 5 seeds) with a hierarchical bootstrap and Holm correction fixed before the results were read, shortening alone never helps, but writing the target in ordinary words does. The word encoding is the most accurate format on both models (87.5% vs. 85.8% exact match for the native s-expression on Qwen) while emitting 4.1x fewer tokens, and it cuts the silent error rate by 2.3x on Qwen and 1.8x on LFM2, separating at every pool size. Error analysis locates much of the gain in negation. All runs also learn to refuse off-menu input (held out: 95.9-99.0% handled) and to apply in-utterance self-corrections. Strict refusal has a measured price: 2.1-10.1% of real, mostly polite, orders are refused.", "arxiv_id": "2611.17169", "arxiv_url": "https://arxiv.org/abs/2611.17169", "authors": ["Umar Ahmed", "Maxim Dunaev", "Mohammad Nour Al Awad", "Sergey Ivanov", "Ivan Khodnenko"], "brief": "\u7814\u7a76\u5728\u62ab\u8428\u70b9\u5355\u4efb\u52a1\u4e0a\uff0c\u7528LoRA\u5fae\u8c03\u4e24\u4e2a\u5341\u4ebf\u53c2\u6570\u4ee5\u4e0b\u6a21\u578b\uff0c\u6bd4\u8f83\u540c\u4e00\u76ee\u6807\u6811\u7684\u516d\u79cd\u65e0\u635f\u7f16\u7801\uff0c\u501f\u52a9\u7b49\u957f\u5bf9\u7167\u533a\u5206\u8f93\u51fa\u957f\u5ea6\u4e0e\u8868\u9762\u5f62\u5f0f\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/UmarGit/coffee-llm", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.17169", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["300\u6b21\u8fd0\u884c\u8986\u76d65\u79cd\u  reconstruction, doing so requires satisfying discrete physical constraints, which provide structure but render the problem combinatorial and highly sensitive to small pose errors. To learn a prior over how parts fit together, we train a set-conditioned SE(3) flow model on procedurally generated assemblies. We then finetune this model to inject image conditioning, using 1% as much data. However, while the learned flow captures global structure, it does not enforce connectivity. To address this, we introduce an analytic connectivity-field guidance to pull predictions toward connected assemblies at test time. Through this, we demonstrate improved build quality with model size, pretraining, and guidance. We make our models and data available for research purposes at https://kulits.github.io/BrickFlow/", "arxiv_id": "2611.17321", "arxiv_url": "https://arxiv.org/abs/2611.17321", "authors": ["Peter Kulits", "Cordelia Schmid"], "brief": "\u5148\u7528\u7a0b\u5e8f\u751f\u6210\u7684\u62fc\u88c5\u6570\u636e\u8bad\u7ec3\u96c6\u5408\u6761\u4ef6SE(3)\u6d41\u6a21\u578b\uff0c\u5b66\u4e60\u96f6\u4ef6\u7ec4\u5408\u5148\u9a8c\uff0c\u518d\u5fae\u8c03\u52a0\u5165\u56fe\u50cf\u6761\u4ef6\uff1b\u63a8\u7406\u65f6\u4ee5\u89e3\u6790\u8fde\u63a5\u573a\u5f15\u5bfc\u4f4d\u59ff\uff0c\u4f7f\u9884\u6d4b\u8d8b\u5411\u8fde\u901a\u62fc\u88c5\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": "https://github.com/kulits/BrickFlow", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.17321", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u96c6\u5408\u6761\u4ef6SE(3)\u6d41\u6a21\u578b\u9884\u6d4b\u5404\u96f6\u4ef6\u4f4d\u59ff", "\u56fe\u50cf\u6761\u4ef6\u5fae\u8c03\u4ec5\u7528\u9884\u8bad\u7ec3\u6570\u636e\u91cf\u76841%", "\u89e3\u6790\u8fde\u63a5\u573a\u5728\u6d4b\u8bd5\u65f6\u5f15\u5bfc\uff0c\u6539\u5584\u62fc\u88c5\u8d28\u91cf"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u6d41\u6a21\u578b", "\u7269\u7406\u7ea6\u675f", "\u4e50\u9ad8\u62fc\u88c5"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17321v1", "published_at": "2026-11-12", "score": 0.229, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17321.png", "title": "BrickFlow: Connectivity-Guided Brick Reconstruction", "tldr": "\u7ed3\u5408\u751f\u6210\u5f0f\u4f4d\u59ff\u9884\u6d4b\u4e0e\u8fde\u63a5\u7ea6\u675f\uff0c\u4ece\u56fe\u50cf\u548c\u96f6\u4ef6\u96c6\u5408\u91cd\u5efa\u53ef\u62fc\u88c5\u7684\u4e50\u9ad8\u6a21\u578b\u3002", "upvotes": 2, "what_it_is": "\u5148\u7528\u7a0b\u5e8f\u751f\u6210\u7684\u62fc\u88c5\u6570\u636e\u8bad\u7ec3\u96c6\u5408\u6761\u4ef6SE(3)\u6d41\u6a21\u578b\uff0c\u5b66\u4e60\u96f6\u4ef6\u7ec4\u5408\u5148\u9a8c\uff0c\u518d\u5fae\u8c03\u52a0\u5165\u56fe\u50cf\u6761\u4ef6\uff1b\u63a8\u7406\u65f6\u4ee5\u89e3\u6790\u8fde\u63a5\u573a\u5f15\u5bfc\u4f4d\u59ff\uff0c\u4f7f\u9884\u6d4b\u8d8b\u5411\u8fde\u901a\u62fc\u88c5\u3002", "why_notable": "\u628a\u5168\u5c40\u5f62\u72b6\u751f\u6210\u4e0e\u79bb\u6563\u8fde\u63a5\u7ea6\u675f\u7ed3\u5408\uff0c\u63a8\u52a8\u91cd\u5efa\u4ece\u5916\u89c2\u76f8\u4f3c\u8d70\u5411\u53ef\u5b9e\u9645\u62fc\u88c5\uff1b\u6a21\u578b\u4e0e\u6570\u636e\u5f00\u653e\uff0c\u4fbf\u4e8e\u540e\u7eed\u7814\u7a76\u3002"}, {"abstract": "Deployment objectives often specify desired outcomes without providing revised trajectories, while parts of the original reference must still be followed. We present OneSteer, a one-step diffusion whole-body controller that combines general motion tracking with selective test-time steering. To accommodate new objectives, differentiable task costs guide optimization of the generator\u0027s input noise with frozen weights, while body-group reference masks relax selected tracking requirements. Predicted state-action plans provide a shared interface for task optimization and feedback-conditioned execution. For nominal tracking, the model trained from scratch achieves the lowest local tracking error among the evaluated baselines on successful held-out AMASS and BONES clips. For steering, one frozen distilled controller adapts across diverse deployment objectives in simulation, raising the clean passage rate under a 1.25 m bar from 2% to 90%. On a physical Unitree G1, OneSteer completes all 27 nominal tracking trials across nine diverse whole-body motion sequences without falling. With a steering cost derived from a signed distance field built using only onboard LiDAR, it also passes under a 1.1 m low bar in four of five attempts and steps over a 12 cm hurdle without falling in all three attempts. Beyond control, prediction variation in the model trained from scratch ranks likely tracking failures without physics rollouts. This scoring method is more than 10x faster than simulation-based scoring with five rollouts per clip and guides targeted fine-tuning. Project page: https://onesteer.github.io", "arxiv_id": "2610.41354", "arxiv_url": "https://arxiv.org/abs/2610.41354", "authors": ["Yifei Huang", "Yazhao Yang", "Li Weijia", "Tianle Shi", "Ji Jin", "Zhihui Cai", "Zihao Liu", "Jianzhuang Zhao", "Songlin Dong", "Xinyuan Chang", "Yihong Gong", "Dian Shen", "Zhiheng Ma"], "brief": "\u63d0\u51fa\u5355\u6b65\u6269\u6563\u5168\u8eab\u63a7\u5236\u5668\uff0c\u5728\u51bb\u7ed3\u6743\u91cd\u4e0b\u7528\u53ef\u5fae\u4efb\u52a1\u4ee3\u4ef7\u4f18\u5316\u8f93\u5165\u566a\u58f0\uff0c\u5e76\u6309\u8eab\u4f53\u5206\u7ec4\u653e\u5bbd\u53c2\u8003\u7ea6\u675f\u3002\u9884\u6d4b\u72b6\u6001\u4e0e\u52a8\u4f5c\u8ba1\u5212\u7edf\u4e00\u652f\u6301\u4efb\u52a1\u4f18\u5316\u548c\u53cd\u9988\u6267\u884c\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41354", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u51bb\u7ed3\u63a7\u5236\u5668\u57281.25\u7c73\u6a2a\u6746\u4e0b\u901a\u884c\u7387\u4ece2%\u5347\u81f390%", "Unitree G1\u5b8c\u621027\u6b21\u52a8\u4f5c\u8ddf\u8e2a\u8bd5\u9a8c\uff0c\u5747\u672a\u8dcc\u5012", "\u9884\u6d4b\u53d8\u5316\u8bc4\u5206\u8bc6\u522b\u8ddf\u8e2a\u5931\u8d25\u98ce\u9669\uff0c\u6bd4\u4e94\u6b21\u4eff\u771f\u8bc4\u5206\u5feb\u903e10\u500d"], "keywords": ["\u4eba\u5f62\u673a\u5668\u4eba", "\u6269\u6563\u6a21\u578b", "\u8fd0\u52a8\u63a7\u5236", "\u6d4b\u8bd5\u65f6\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41354v4", "published_at": "2026-10-30", "score": 0.225, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41354.png", "title": "OneSteer: Unlocking Steerable General Humanoid Motion Tracking via One-Step Diffusion Whole-Body Control", "tldr": "\u901a\u8fc7\u5355\u6b65\u6269\u6563\u4e0e\u8f93\u5165\u566a\u58f0\u4f18\u5316\uff0c\u8ba9\u4eba\u5f62\u673a\u5668\u4eba\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u8c03\u6574\u5168\u8eab\u52a8\u4f5c\u3002", "upvotes": 1, "what_it_is": "\u63d0\u51fa\u5355\u6b65\u6269\u6563\u5168\u8eab\u63a7\u5236\u5668\uff0c\u5728\u51bb\u7ed3\u6743\u91cd\u4e0b\u7528\u53ef\u5fae\u4efb\u52a1\u4ee3\u4ef7\u4f18\u5316\u8f93\u5165\u566a\u58f0\uff0c\u5e76\u6309\u8eab\u4f53\u5206\u7ec4\u653e\u5bbd\u53c2\u8003\u7ea6\u675f\u3002\u9884\u6d4b\u72b6\u6001\u4e0e\u52a8\u4f5c\u8ba1\u5212\u7edf\u4e00\u652f\u6301\u4efb\u52a1\u4f18\u5316\u548c\u53cd\u9988\u6267\u884c\u3002", "why_notable": "\u5c06\u901a\u7528\u52a8\u4f5c\u8ddf\u8e2a\u4e0e\u90e8\u7f72\u65f6\u76ee\u6807\u8c03\u6574\u6574\u5408\u8fdb\u540c\u4e00\u63a7\u5236\u5668\uff0c\u5e76\u5728\u771f\u673a\u9a8c\u8bc1\u4f4e\u6746\u901a\u884c\u548c\u8de8\u969c\uff0c\u4e3a\u65e0\u9700\u91cd\u8bad\u7684\u7075\u6d3b\u5168\u8eab\u63a7\u5236\u63d0\u4f9b\u5b9e\u8bc1\u3002"}, {"abstract": "Language moved from many task-specific models to one unified model: a single generative model with a single generative training task that handles all of them within the same backbone, and keeps improving with data, parameters and compute. We believe the bitter lesson applies just as much to computer vision, 3D and spatial understanding, in the end to visual intelligence: the effort should go into general architectures that solve all these tasks in a unified way, and into scaling them, rather than into task-specific designs. We test this on monocular geometry, a task that has belonged to specialised architectures for years. Iris-Z is a general image generator that produces appearance and geometry together. A single backbone denoises, reasons about and understands the image and its depth at the same time, and one set of weights generates images with their depth, estimates depth from photographs and paints images onto a given depth. At enough scale it surpasses state-of-the-art specialists on established depth benchmarks while keeping the generative abilities of the backbone it started from without specialized layers. We release two models for the community.", "arxiv_id": "2611.16010", "arxiv_url": "https://arxiv.org/abs/2611.16010", "authors": ["Alejandro Ca\u00f1ada", "Chema Garabito"], "brief": "Iris-Z\u7528\u5355\u4e00\u9aa8\u5e72\u8054\u5408\u53bb\u566a\u56fe\u50cf\u4e0e\u6df1\u5ea6\uff0c\u4ee5\u540c\u4e00\u7ec4\u6743\u91cd\u5b8c\u6210\u56fe\u50cf\u53ca\u6df1\u5ea6\u751f\u6210\u3001\u7167\u7247\u6df1\u5ea6\u4f30\u8ba1\u548c\u6df1\u5ea6\u6761\u4ef6\u56fe\u50cf\u751f\u6210\uff0c\u65e0\u9700\u4e13\u7528\u5c42\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.16010", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5355\u4e00\u9aa8\u5e72\u4e0e\u540c\u4e00\u7ec4\u6743\u91cd\u652f\u6301\u4e09\u7c7b\u56fe\u50cf\u2014\u6df1\u5ea6\u4efb\u52a1", "\u89c4\u6a21\u6269\u5927\u540e\uff0c\u5728\u65e2\u6709\u6df1\u5ea6\u57fa\u51c6\u4e0a\u8d85\u8d8a\u6700\u5148\u8fdb\u4e13\u7528\u6a21\u578b", "\u4fdd\u7559\u539f\u9aa8\u5e72\u751f\u6210\u80fd\u529b\uff0c\u5e76\u516c\u5f00\u53d1\u5e03\u4e24\u4e2a\u6a21\u578b"], "keywords": ["\u7edf\u4e00\u6a21\u578b", "\u751f\u6210\u6a21\u578b", "\u6df1\u5ea6\u4f30\u8ba1", "\u89c6\u89c9\u51e0\u4f55"], "num_comments": 2, "on_hf": true, "organization": "speridlabs", "pdf_url": "https://arxiv.org/pdf/2611.16010v1", "published_at": "2026-11-11", "score": 0.225, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16010.png", "title": "Iris-Z: Scaling One Generative Model Past Specialist Geometry Models", "tldr": "\u7edf\u4e00\u751f\u6210\u6a21\u578b\u8054\u5408\u5b66\u4e60\u56fe\u50cf\u4e0e\u6df1\u5ea6\uff0c\u6269\u5927\u89c4\u6a21\u540e\u8d85\u8d8a\u4e13\u7528\u6df1\u5ea6\u4f30\u8ba1\u6a21\u578b\u3002", "upvotes": 1, "what_it_is": "Iris-Z\u7528\u5355\u4e00\u9aa8\u5e72\u8054\u5408\u53bb\u566a\u56fe\u50cf\u4e0e\u6df1\u5ea6\uff0c\u4ee5\u540c\u4e00\u7ec4\u6743\u91cd\u5b8c\u6210\u56fe\u50cf\u53ca\u6df1\u5ea6\u751f\u6210\u3001\u7167\u7247\u6df1\u5ea6\u4f30\u8ba1\u548c\u6df1\u5ea6\u6761\u4ef6\u56fe\u50cf\u751f\u6210\uff0c\u65e0\u9700\u4e13\u7528\u5c42\u3002", "why_notable": "\u5b83\u4e3a\u89c6\u89c9\u51e0\u4f55\u4e2d\u7684\u7edf\u4e00\u5efa\u6a21\u63d0\u4f9b\u4e86\u5b9e\u8bc1\uff1a\u901a\u7528\u751f\u6210\u9aa8\u5e72\u901a\u8fc7\u89c4\u6a21\u6269\u5c55\uff0c\u4e5f\u80fd\u80dc\u8fc7\u4e13\u7528\u67b6\u6784\uff0c\u540c\u65f6\u4fdd\u7559\u56fe\u50cf\u751f\u6210\u80fd\u529b\u3002"}, {"abstract": "As large language models (LLMs) are increasingly deployed as autonomous agents, their abilities in navigating automated planning tasks have become essential. However, despite their strengths, LLMs\u0027 planning ability is not robust, particularly when they are not allowed to exploit commonsense cues in the symbolic vocabulary (e.g., names of actions, predicates, and objects) used to define planning tasks. This makes LLMs unreliable compared to symbolic planners. With recent reasoning models showing improved planning performance on tasks with obfuscated symbolic vocabularies, we utilize an adversarial attack framework to reveal to what extent the crucial weaknesses of LLM agents at joint symbolic interpretation and planning remain and whether they can reason properly when presented with severe cases. As such, our main contribution is devising an LLM-based attack model, which we call Symbolic Swapper, to automatically generate obfuscated planning domains with non-standard symbolic vocabularies that systematically break strong reasoning models\u0027 ability to plan. In doing so, we reveal how much LLMs\u0027 planning abilities can be further degraded under more advanced obfuscation schemes, allowing us to ascertain their success when having to rely on their pure planning ability. We find that attacks can decrease the planning performance of base models and even robust planning frameworks by over 70%. We further analyze the factors behind how LLM planning abilities break down and find that successful obfuscation causes models to appear to significantly degrade in reasoning quality despite them showing some inherent ability to understand the domain, revealing a gap in the perception of a task domain and being able to plan under it.", "arxiv_id": "2611.17910", "arxiv_url": "https://arxiv.org/abs/2611.17910", "authors": ["Stephen Obadinma", "Xiaodan Zhu"], "brief": "\u63d0\u51faSymbolic Swapper\uff0c\u81ea\u52a8\u6df7\u6dc6\u89c4\u5212\u4efb\u52a1\u4e2d\u7684\u7b26\u53f7\u8bcd\u6c47\uff0c\u4f7f\u6a21\u578b\u4e0e\u89c4\u5212\u6846\u67b6\u6027\u80fd\u4e0b\u964d\u8d8570%\uff0c\u63ed\u793a\u7406\u89e3\u4efb\u52a1\u57df\u4e0e\u5b9e\u9645\u89c4\u5212\u4e4b\u95f4\u7684\u9e3f\u6c9f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17910", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u52a8\u89c4\u5212", "\u5bf9\u6297\u653b\u51fb", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17910v1", "published_at": "2026-11-13", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Adversarially Attacking Symbolic Vocabulary Vulnerabilities In LLM Planners", "tldr": "\u63d0\u51faSymbolic Swapper\uff0c\u81ea\u52a8\u6df7\u6dc6\u89c4\u5212\u4efb\u52a1\u4e2d\u7684\u7b26\u53f7\u8bcd\u6c47\uff0c\u4f7f\u6a21\u578b\u4e0e\u89c4\u5212\u6846\u67b6\u6027\u80fd\u4e0b\u964d\u8d8570%\uff0c\u63ed\u793a\u7406\u89e3\u4efb\u52a1\u57df\u4e0e\u5b9e\u9645\u89c4\u5212\u4e4b\u95f4\u7684\u9e3f\u6c9f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming video understanding aims to continuously process incoming visual observations, making the retention and retrieval of relevant information increasingly important as the video history grows. Although existing benchmarks include memory-related questions, question-answering accuracy alone does not reliably measure memory capabilities. Incorrect predictions may arise from failures in visual understanding rather than forgetting, whereas correct predictions may rely on linguistic priors or recent observations without requiring historical memory. To address these ambiguities, we introduce MemInStream, a benchmark dedicated to evaluating memory capabilities in streaming video understanding. We develop an evidence-controlled validation protocol that associates each question with temporally localized evidence intervals. The protocol validates evidence solvability and memory necessity by retaining questions that models can answer from the annotated evidence but cannot resolve using recent observations, post-evidence observations, or textual input alone. This helps disentangle memory limitations from understanding failures while reducing memory-independent shortcuts. MemInStream provides a systematic evaluation of memory capabilities through four major categories, covering Episodic Retrieval, State Tracking \\\u0026 Updating, Multi-Evidence Integration, and Contextual Memory across diverse video scenarios. Overall, \\textsc{MemInStream} provides a comprehensive and reliable benchmark for systematically evaluating memory capabilities in streaming video understanding.", "arxiv_id": "2611.15640", "arxiv_url": "https://arxiv.org/abs/2611.15640", "authors": ["Zhenqi He", "Dunyuan Xu", "Yang Bo", "Kien T. Pham", "Yanghao Wang", "Shuhan Li", "Xintong Guo", "Yuyang He", "Fang Liu", "Huankang Guan", "Jingyan Chen", "Rui Liu", "Long Chen"], "brief": "\u63d0\u51fa\u6d41\u5f0f\u89c6\u9891\u8bb0\u5fc6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5c06\u95ee\u9898\u7ed1\u5b9a\u5230\u5177\u4f53\u65f6\u95f4\u6bb5\u7684\u8bc1\u636e\u3002\u901a\u8fc7\u8bc1\u636e\u53ef\u89e3\u6027\u4e0e\u8bb0\u5fc6\u5fc5\u8981\u6027\u7b5b\u9009\uff0c\u6392\u9664\u89c6\u89c9\u7406\u89e3\u5931\u8d25\u53ca\u65e0\u9700\u5386\u53f2\u8bb0\u5fc6\u7684\u7b54\u9898\u6377\u5f84\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/HKUST-LongGroup/MemInStream", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2611.15640", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u636e\u63a7\u5236\u9a8c\u8bc1\u534f\u8bae\uff1a\u5c06\u6bcf\u4e2a\u95ee\u9898\u5173\u8054\u5230\u65f6\u95f4\u5b9a\u4f4d\u7684\u8bc1\u636e\u533a\u95f4", "\u4fdd\u7559\u8bc1\u636e\u53ef\u89e3\u3001\u4f46\u8fd1\u671f\u753b\u9762\u3001\u8bc1\u636e\u540e\u753b\u9762\u6216\u7eaf\u6587\u672c\u4e0d\u53ef\u89e3\u7684\u95ee\u9898", "\u8986\u76d64\u7c7b\u80fd\u529b\uff1a\u60c5\u8282\u68c0\u7d22\u3001\u72b6\u6001\u66f4\u65b0\u3001\u591a\u8bc1\u636e\u6574\u5408\u3001\u4e0a\u4e0b\u6587\u8bb0\u5fc6"], "keywords": ["\u6d41\u5f0f\u89c6\u9891\u7406\u89e3", "\u8bb0\u5fc6\u8bc4\u6d4b", "\u8bc1\u636e\u9a8c\u8bc1"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.15640v1", "published_at": "2026-11-11", "score": 0.22, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.15640.png", "title": "MemInStream: Memorizing or Merely Recognizing? Rethinking Streaming Video Memory Evaluation", "tldr": "\u901a\u8fc7\u63a7\u5236\u89c6\u9891\u8bc1\u636e\u4e0e\u7b54\u9898\u6761\u4ef6\uff0c\u533a\u5206\u6d41\u5f0f\u89c6\u9891\u6a21\u578b\u7684\u771f\u5b9e\u8bb0\u5fc6\u4e0e\u8bc6\u522b\u6377\u5f84\u3002", "upvotes": 1, "what_it_is": "\u63d0\u51fa\u6d41\u5f0f\u89c6\u9891\u8bb0\u5fc6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5c06\u95ee\u9898\u7ed1\u5b9a\u5230\u5177\u4f53\u65f6\u95f4\u6bb5\u7684\u8bc1\u636e\u3002\u901a\u8fc7\u8bc1\u636e\u53ef\u89e3\u6027\u4e0e\u8bb0\u5fc6\u5fc5\u8981\u6027\u7b5b\u9009\uff0c\u6392\u9664\u89c6\u89c9\u7406\u89e3\u5931\u8d25\u53ca\u65e0\u9700\u5386\u53f2\u8bb0\u5fc6\u7684\u7b54\u9898\u6377\u5f84\u3002", "why_notable": "\u4e0d\u518d\u5c06\u95ee\u7b54\u51c6\u786e\u7387\u76f4\u63a5\u7b49\u540c\u4e8e\u8bb0\u5fc6\u80fd\u529b\uff0c\u51cf\u5c11\u8bed\u8a00\u5148\u9a8c\u4e0e\u8fd1\u671f\u753b\u9762\u7684\u5e72\u6270\uff0c\u4e3a\u5b9a\u4f4d\u6d41\u5f0f\u89c6\u9891\u6a21\u578b\u7684\u8bb0\u5fc6\u77ed\u677f\u63d0\u4f9b\u66f4\u53ef\u9760\u4f9d\u636e\u3002"}, {"abstract": "Recent work shows that large language models (LLMs) can operate directly on the parameters of other neural networks. They can read what a network was trained to do, fix a network that fails, and write working networks from scratch, all without gradient descent. This capability has been termed Weight-Space Programming (WSP). Exploring this new paradigm systematically requires a robust benchmark. We introduce WEIGHTBENCH, a benchmark that evaluates LLMs of increasing capability on 42 WSP tasks across five tracks: reading, fixing and writing weights, recognizing edits that are impossible, and data-free compression. The networks whose weights the LLMs read and edit range from 2K-parameter con
