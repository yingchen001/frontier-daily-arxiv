<script>
const PAPERS = [{"abstract": "Long-term memory lets LLM agents personalize, stay consistent, and reuse what worked before. Parametric memories need training, consolidation can lose details for good, and keeping every record leaves a growing store to search. We present MIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and efficient at once. It is the most accurate of the compared systems on four of five QA benchmarks. It reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S, where it leads the strongest baseline by 14.3 points, and with AutoDream disabled it gains 31.0 and 22.0 points over HyperMem on single-hop and multi-hop document QA. As procedural memory, it yields the highest mean success among the compared memory methods on ALFWorld and WebShop and reaches 49.2% on MetaClaw-Bench, against 44.0% for MetaClaw\u0027s skill library. Six typed memory agents keep complete records as the system of record, and a provenance hypergraph indexes episodic and semantic records with n-ary frames that cite their rows. Retrieval runs under explicit budgets, so the evidence a question inspects does not grow with the history. AutoDream merges duplicate anchors outside the write path without rewriting any record, and it distills task sessions into skills. With AutoDream disabled, MIRIX-2.0 answers faster than HyperMem on all five timed benchmarks. It needs no fine-tuning, runs with closed and open models, and its code is public.", "arxiv_id": "2611.12068", "arxiv_url": "https://arxiv.org/abs/2611.12068", "authors": ["Wei-Chieh Huang", "Weizhi Zhang", "Jiayan Nan", "Peng Xia", "Yu Wang"], "brief": "\u6784\u5efa\u65e0\u9700\u5fae\u8c03\u7684\u591a\u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u7cfb\u7edf\uff0c\u4ee5\u516d\u7c7b\u667a\u80fd\u4f53\u4fdd\u5b58\u5b8c\u6574\u8bb0\u5f55\u3001\u6eaf\u6e90\u8d85\u56fe\u7ec4\u7ec7\u8bc1\u636e\uff0c\u5e76\u9650\u5b9a\u68c0\u7d22\u9884\u7b97\uff1bAutoDream\u5728\u5199\u5165\u8def\u5f84\u5916\u5408\u5e76\u91cd\u590d\u951a\u70b9\u3001\u63d0\u70bc\u4efb\u52a1\u6280\u80fd\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Mirix-AI/MIRIX", "github_stars": 3481, "hf_url": "https://huggingface.co/papers/2611.12068", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["LoCoMo\u8fbe91.4%\uff0cLongMemEval-S\u8fbe72.6%", "\u6eaf\u6e90\u8d85\u56fe\u4ee5\u5f15\u7528\u539f\u59cb\u8bb0\u5f55\u7684\u591a\u5143\u6846\u67b6\u7d22\u5f15\u8bb0\u5fc6", "MetaClaw-Bench\u6210\u529f\u738749.2%\uff0c\u6280\u80fd\u5e93\u4e3a44.0%"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u68c0\u7d22\u589e\u5f3a", "\u6280\u80fd\u5b66\u4e60"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.12068v1", "published_at": "2026-11-09", "score": 0.532, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (46\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12068.png", "title": "MIRIX-2.0: Multi-Agent Memory System", "tldr": "\u4ee5\u516d\u7c7b\u8bb0\u5fc6\u667a\u80fd\u4f53\u4e0e\u6eaf\u6e90\u8d85\u56fe\uff0c\u5b9e\u73b0\u5b8c\u6574\u7559\u5b58\u3001\u9884\u7b97\u68c0\u7d22\u548c\u4efb\u52a1\u6280\u80fd\u590d\u7528\u3002", "upvotes": 46, "what_it_is": "\u6784\u5efa\u65e0\u9700\u5fae\u8c03\u7684\u591a\u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u7cfb\u7edf\uff0c\u4ee5\u516d\u7c7b\u667a\u80fd\u4f53\u4fdd\u5b58\u5b8c\u6574\u8bb0\u5f55\u3001\u6eaf\u6e90\u8d85\u56fe\u7ec4\u7ec7\u8bc1\u636e\uff0c\u5e76\u9650\u5b9a\u68c0\u7d22\u9884\u7b97\uff1bAutoDream\u5728\u5199\u5165\u8def\u5f84\u5916\u5408\u5e76\u91cd\u590d\u951a\u70b9\u3001\u63d0\u70bc\u4efb\u52a1\u6280\u80fd\u3002", "why_notable": "\u5c06\u5b8c\u6574\u8bb0\u5f55\u7559\u5b58\u4e0e\u53d7\u63a7\u68c0\u7d22\u5f00\u9500\u7ed3\u5408\uff0c\u5728\u95ee\u7b54\u548c\u4ea4\u4e92\u4efb\u52a1\u4e2d\u5747\u5c55\u73b0\u6536\u76ca\uff1b\u65e0\u9700\u5fae\u8c03\u4e14\u4ee3\u7801\u516c\u5f00\uff0c\u4fbf\u4e8e\u63a5\u5165\u4e0d\u540c\u6a21\u578b\u3002"}, {"abstract": "Speculative decoding accelerates generation by letting a lightweight drafter propose tokens for parallel verification by a target model. Diffusion drafters such as DFlash propose an entire token block in a single forward pass, but mainly focus on text-only tasks, leaving multimodal drafting underexplored. To study this setting, we first introduce a metric of token-level visual dependence based on the KL divergence between next-token distributions with and without visual input. We find that acceptance rates decrease from 46% in the lowest visual-dependence quartile to 22% in the highest, with this disparity persisting after multimodal training. Motivated by this observation, we propose MMFlash, a simple and effective framework that adaptively upweights visually dependent tokens that the drafter predicts poorly. For long video inputs, MMFlash further employs sparse attention to reduce redundant attention computation and improve drafting quality. Across various multimodal benchmarks, MMFlash achieves lossless decoding speedups of up to $3.58\\times$, outperforming EAGLE-3 and DFlash by up to 195.4% and 17.1%, respectively.", "arxiv_id": "2611.18482", "arxiv_url": "https://arxiv.org/abs/2611.18482", "authors": ["Sicheng Feng", "Zigeng Chen", "Song Wang", "Gongfan Fang", "Xinchao Wang"], "brief": "MMFlash\u5c06\u6269\u6563\u5f0f\u8349\u7a3f\u6a21\u578b\u7528\u4e8e\u591a\u6a21\u6001\u63a8\u6d4b\u89e3\u7801\uff0c\u81ea\u9002\u5e94\u63d0\u9ad8\u89c6\u89c9\u4f9d\u8d56\u5f3a\u4e14\u9884\u6d4b\u4e0d\u4f73\u8bcd\u5143\u7684\u6743\u91cd\uff0c\u5e76\u7528\u7a00\u758f\u6ce8\u610f\u529b\u4f18\u5316\u957f\u89c6\u9891\u8f93\u5165\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/fscdc/MMFlash", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2611.18482", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528\u6709\u65e0\u89c6\u89c9\u8f93\u5165\u7684\u5206\u5e03KL\u6563\u5ea6\u8861\u91cf\u8bcd\u5143\u89c6\u89c9\u4f9d\u8d56", "\u89c6\u89c9\u4f9d\u8d56\u6700\u4f4e\u4e0e\u6700\u9ad8\u56db\u5206\u4f4d\u7684\u63a5\u53d7\u7387\u4e3a46%\u548c22%", "\u65e0\u635f\u52a0\u901f\u6700\u9ad83.58\u500d\uff0c\u8f83DFlash\u6700\u9ad8\u63d0\u534717.1%"], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "\u7a00\u758f\u6ce8\u610f\u529b"], "num_comments": 3, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2611.18482v1", "published_at": "2026-11-13", "score": 0.53, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (35\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18482.png", "title": "MMFlash: Faster Speculative Decoding for Vision-Language Models", "tldr": "\u901a\u8fc7\u5f3a\u5316\u89c6\u89c9\u4f9d\u8d56\u8bcd\u5143\u4e0e\u7a00\u758f\u6ce8\u610f\u529b\uff0c\u8ba9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5b9e\u73b0\u65e0\u635f\u63a8\u6d4b\u89e3\u7801\u52a0\u901f\u3002", "upvotes": 35, "what_it_is": "MMFlash\u5c06\u6269\u6563\u5f0f\u8349\u7a3f\u6a21\u578b\u7528\u4e8e\u591a\u6a21\u6001\u63a8\u6d4b\u89e3\u7801\uff0c\u81ea\u9002\u5e94\u63d0\u9ad8\u89c6\u89c9\u4f9d\u8d56\u5f3a\u4e14\u9884\u6d4b\u4e0d\u4f73\u8bcd\u5143\u7684\u6743\u91cd\uff0c\u5e76\u7528\u7a00\u758f\u6ce8\u610f\u529b\u4f18\u5316\u957f\u89c6\u9891\u8f93\u5165\u3002", "why_notable": "\u5b83\u628a\u591a\u6a21\u6001\u8349\u7a3f\u63a5\u53d7\u7387\u4e0b\u964d\u5b9a\u4f4d\u5230\u89c6\u89c9\u4f9d\u8d56\u8bcd\u5143\uff0c\u5e76\u636e\u6b64\u6539\u8fdb\u8bad\u7ec3\u4e0e\u6ce8\u610f\u529b\u8ba1\u7b97\uff0c\u4e3a\u56fe\u50cf\u548c\u957f\u89c6\u9891\u751f\u6210\u63d0\u4f9b\u65e0\u635f\u63d0\u901f\u8def\u5f84\u3002"}, {"abstract": "Mechanistic Interpretability (MI) has made significant progress in explaining the internal computations of Large Language Models (LLMs); however, these advances have yet to demonstrate comparable success in explaining the decision-making processes of LLM-based agents. This paper examines the challenges MI tools face when applied to realistic agentic failures. We focus on one such failure: web agents hallucinating actions that are not available on a website. We apply a series of mechanistic analyzes to Qwen2.5-7B-Instruct as it interacts with live websites. We find that a linear probe trained on the last prompt token can predict hallucinations before generation begins (0.80 AUC) and steering along a probe direction corrects 85\\% of hallucinations, but disrupts 7\\% of valid actions. However, these results only provide a partial explanation of why the agent hallucinates. The probe direction is sensitive to prompt formatting, losing much of its steering effect after a minor change to how actions are represented. Additionally, circuit identification can be difficult as the computation is distributed across multiple components and positions, and the information the agent relies on varies across examples. We discuss how these observations challenge the assumptions underlying standard MI methods for circuit discovery and feature identification, and outline future directions for making these methods better suited to explain failures in LLM-based agents.", "arxiv_id": "2611.18514", "arxiv_url": "https://arxiv.org/abs/2611.18514", "authors": ["Mohamed Aghzal", "Mor Geva", "Gregory J. Stein", "Ziyu Yao"], "brief": "\u7814\u7a76\u5206\u6790Qwen2.5-7B-Instruct\u5728\u771f\u5b9e\u7f51\u7ad9\u4e0a\u865a\u6784\u64cd\u4f5c\u7684\u5931\u8d25\uff0c\u901a\u8fc7\u7ebf\u6027\u63a2\u9488\u3001\u65b9\u5411\u5f15\u5bfc\u4e0e\u7535\u8def\u8bc6\u522b\uff0c\u68c0\u9a8c\u673a\u5236\u53ef\u89e3\u91ca\u6027\u5de5\u5177\u7684\u6709\u6548\u6027\u4e0e\u5c40\u9650\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18514", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u672b\u5c3e\u63d0\u793a\u8bcd\u5143\u7684\u7ebf\u6027\u63a2\u9488\u53ef\u63d0\u524d\u9884\u6d4b\u5e7b\u89c9\uff0cAUC\u4e3a0.80", "\u63a2\u9488\u65b9\u5411\u5f15\u5bfc\u7ea0\u6b6385%\u5e7b\u89c9\uff0c\u4f46\u5e72\u62707%\u6709\u6548\u64cd\u4f5c", "\u5fae\u8c03\u52a8\u4f5c\u8868\u793a\u540e\u5f15\u5bfc\u6548\u679c\u663e\u8457\u4e0b\u964d\uff0c\u5206\u5e03\u5f0f\u8ba1\u7b97\u963b\u788d\u7535\u8def\u8bc6\u522b"], "keywords": ["\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u7f51\u9875\u667a\u80fd\u4f53", "\u5e7b\u89c9\u68c0\u6d4b", "\u6a21\u578b\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18514v1", "published_at": "2026-11-13", "score": 0.475, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can Mechanistic Interpretability Help Explain LLM Agent Failures? A Case Study on Web Element Hallucination", "tldr": "\u673a\u5236\u53ef\u89e3\u91ca\u6027\u53ef\u9884\u6d4b\u5e76\u5e72\u9884\u7f51\u9875\u667a\u80fd\u4f53\u5e7b\u89c9\uff0c\u4f46\u89e3\u91ca\u80fd\u529b\u53d7\u63d0\u793a\u683c\u5f0f\u4e0e\u5206\u5e03\u5f0f\u8ba1\u7b97\u9650\u5236\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5206\u6790Qwen2.5-7B-Instruct\u5728\u771f\u5b9e\u7f51\u7ad9\u4e0a\u865a\u6784\u64cd\u4f5c\u7684\u5931\u8d25\uff0c\u901a\u8fc7\u7ebf\u6027\u63a2\u9488\u3001\u65b9\u5411\u5f15\u5bfc\u4e0e\u7535\u8def\u8bc6\u522b\uff0c\u68c0\u9a8c\u673a\u5236\u53ef\u89e3\u91ca\u6027\u5de5\u5177\u7684\u6709\u6548\u6027\u4e0e\u5c40\u9650\u3002", "why_notable": "\u5c06\u673a\u5236\u53ef\u89e3\u91ca\u6027\u63a8\u8fdb\u5230\u771f\u5b9e\u667a\u80fd\u4f53\u5931\u8d25\u573a\u666f\uff0c\u63ed\u793a\u9884\u6d4b\u548c\u7ea0\u9519\u6210\u529f\u5e76\u4e0d\u7b49\u4e8e\u5145\u5206\u89e3\u91ca\uff0c\u4e5f\u66b4\u9732\u65b9\u6cd5\u5bf9\u63d0\u793a\u683c\u5f0f\u7684\u8106\u5f31\u6027\u3002"}, {"abstract": "Agentic workflows enable AI agents to perform recurring repository tasks on schedules or in response to repository events. Existing studies examine workflow definitions and outputs, but provide limited evidence of what happens during execution. We present GH-AWTrace, a dataset linking 25,014 verified GitHub Agentic Workflows across 5,051 repositories to 4,112,526 run records and 562,877 nonempty execution log archives. The dataset preserves execution evidence subject to GitHub\u0027s log-retention limits and links it to repository metadata and generated workflow configurations. Illustrative cases show how the logs expose tool denials, provider failures, changes in an agent\u0027s approach, and delegation among agents. These observations enable research on execution failures, tool use, and the relationship between reported run outcomes and visible task progress. Coverage varies across workflows, and the logs provide partial observations rather than complete agent trajectories. Video: https://youtu.be/KIlfmZhHxtA", "arxiv_id": "2611.06866", "arxiv_url": "https://arxiv.org/abs/2611.06866", "authors": ["Jasem Khelifi", "Hao Li", "Ali Ouni", "Mohammed Sayagh", "Mohamed Aymen Saied"], "brief": "GH-AWTrace\u6536\u96c6GitHub\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u7684\u8fd0\u884c\u8bb0\u5f55\u4e0e\u6267\u884c\u65e5\u5fd7\uff0c\u5e76\u5173\u8054\u4ed3\u5e93\u5143\u6570\u636e\u53ca\u751f\u6210\u914d\u7f6e\uff0c\u7528\u4e8e\u5206\u6790\u6267\u884c\u6545\u969c\u3001\u5de5\u5177\u4f7f\u7528\u548c\u4efb\u52a1\u8fdb\u5c55\u3002", "categories": ["cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06866", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d65,051\u4e2a\u4ed3\u5e93\u768425,014\u4e2a\u5df2\u9a8c\u8bc1\u5de5\u4f5c\u6d41", "\u5173\u80544,112,526\u6761\u8fd0\u884c\u8bb0\u5f55\u4e0e562,877\u4efd\u975e\u7a7a\u65e5\u5fd7\u5f52\u6863", "\u65e5\u5fd7\u63ed\u793a\u5de5\u5177\u62d2\u7edd\u3001\u670d\u52a1\u5546\u6545\u969c\u3001\u7b56\u7565\u8c03\u6574\u53ca\u667a\u80fd\u4f53\u59d4\u6d3e"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u6267\u884c\u65e5\u5fd7", "\u6570\u636e\u96c6"], "num_comments": 2, "on_hf": true, "organization": "\u00c9cole de Technologie Sup\u00e9rieure", "pdf_url": "https://arxiv.org/pdf/2611.06866v1", "published_at": "2026-11-04", "score": 0.474, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06866.png", "title": "GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs", "tldr": "\u901a\u8fc7\u5173\u8054\u5de5\u4f5c\u6d41\u3001\u8fd0\u884c\u8bb0\u5f55\u4e0e\u65e5\u5fd7\uff0c\u4e3a\u7814\u7a76\u4ed3\u5e93\u667a\u80fd\u4f53\u6267\u884c\u884c\u4e3a\u63d0\u4f9b\u5927\u89c4\u6a21\u8bc1\u636e\u3002", "upvotes": 12, "what_it_is": "GH-AWTrace\u6536\u96c6GitHub\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u7684\u8fd0\u884c\u8bb0\u5f55\u4e0e\u6267\u884c\u65e5\u5fd7\uff0c\u5e76\u5173\u8054\u4ed3\u5e93\u5143\u6570\u636e\u53ca\u751f\u6210\u914d\u7f6e\uff0c\u7528\u4e8e\u5206\u6790\u6267\u884c\u6545\u969c\u3001\u5de5\u5177\u4f7f\u7528\u548c\u4efb\u52a1\u8fdb\u5c55\u3002", "why_notable": "\u5c06\u7814\u7a76\u89c6\u89d2\u4ece\u914d\u7f6e\u548c\u7ed3\u679c\u63a8\u8fdb\u5230\u6267\u884c\u8bc1\u636e\uff0c\u652f\u6301\u68c0\u9a8c\u8fd0\u884c\u72b6\u6001\u4e0e\u5b9e\u9645\u8fdb\u5c55\u7684\u5dee\u5f02\uff1b\u4f46\u65e5\u5fd7\u8986\u76d6\u4e0d\u5747\uff0c\u4e0d\u80fd\u89c6\u4e3a\u5b8c\u6574\u8f68\u8ff9\u3002"}, {"abstract": "Controllable real-world video generation models can condition on a rendered graybox proxy video, which fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender, yet no benchmark checks both these videos and the long, multi-shot scenes behind them. We introduce VibePrevisBench, a benchmark for 4D scene reconstruction: an agent turns a brief into an executable 4D scene and renders its proxy video. Its 242 tasks span four input kinds, including scripts, photos, continuations, and reference videos. Each delivery is scored along two evaluation dimensions. Rule-based Scene Check re-runs the code and compares the exported 4D scene with hidden ground truth facts in nine dimensions. VLM-based Screen Check asks a VLM judge whether the facts that pass can be recognized in the proxy video. We analyze the evaluation results and trajectories of 11 frontier coding agents and identify three key observations. First, multimodal understanding separates the agents, especially in understanding space and camera motion. Second, all agents seem to already master basic camera work and staging, and fail at challenging requests. Third, agents inspect their own renders but fail to correct their errors. Agents thus need better visual understanding of space and camera, explicit checks for challenging requests, and item-by-item verification of renders against the brief.", "arxiv_id": "2611.15789", "arxiv_url": "https://arxiv.org/abs/2611.15789", "authors": ["Yuzhe Chen", "Muxi Diao", "Lele Yang", "Wenbin Xu", "Xuyang Liu", "Qile Su", "Changyi Liu", "Jiankang Chen", "Kaiyu Jiang", "Haoyu Zhang", "Hongyi Fu", "Jianxiong Wang", "Tianke Zhang", "Haonan Fan", "Yingxin Li", "Bingyi Li", "Xu Wang", "Xuanyu Zheng", "Bin Wen", "Tingting Gao", "Wentao Zhang", "Jiale Cao"], "brief": "\u63d0\u51fa\u542b242\u9879\u4efb\u52a1\u7684\u57fa\u51c6\uff0c\u8ba9\u667a\u80fd\u4f53\u5c06\u811a\u672c\u3001\u7167\u7247\u7b49\u8f93\u5165\u8f6c\u4e3a\u53ef\u6267\u884c\u7684Blender\u56db\u7ef4\u573a\u666f\u3002\u7ed3\u5408\u89c4\u5219\u4e0e\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u68c0\u67e5\u573a\u666f\u4e8b\u5b9e\u53ca\u5176\u6e32\u67d3\u53ef\u89c1\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/vibeprevisbench/vibeprevisbench", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.15789", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["242\u9879\u4efb\u52a1\u8986\u76d6\u811a\u672c\u3001\u7167\u7247\u3001\u7eed\u63a5\u548c\u53c2\u8003\u89c6\u9891", "Scene Check\u6838\u9a8c\u4e5d\u7ef4\u4e8b\u5b9e\uff0cScreen Check\u5224\u65ad\u53ef\u89c1\u6027", "\u8bc4\u6d4b11\u4e2a\u524d\u6cbf\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u81ea\u68c0\u6e32\u67d3\u4ecd\u96be\u7ea0\u9519"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u4e09\u7ef4\u573a\u666f\u751f\u6210", "\u591a\u6a21\u6001\u8bc4\u6d4b", "\u89c6\u9891\u751f\u6210"], "num_comments": 3, "on_hf": true, "organization": "Kling-Keye", "pdf_url": "https://arxiv.org/pdf/2611.15789v1", "published_at": "2026-11-11", "score": 0.472, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (84\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.15789.png", "title": "VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender", "tldr": "\u7528\u573a\u666f\u4e0e\u6e32\u67d3\u53cc\u91cd\u68c0\u67e5\uff0c\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u6784\u5efa\u591a\u955c\u5934\u56db\u7ef4\u573a\u666f\u7684\u80fd\u529b\u3002", "upvotes": 84, "what_it_is": "\u63d0\u51fa\u542b242\u9879\u4efb\u52a1\u7684\u57fa\u51c6\uff0c\u8ba9\u667a\u80fd\u4f53\u5c06\u811a\u672c\u3001\u7167\u7247\u7b49\u8f93\u5165\u8f6c\u4e3a\u53ef\u6267\u884c\u7684Blender\u56db\u7ef4\u573a\u666f\u3002\u7ed3\u5408\u89c4\u5219\u4e0e\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u68c0\u67e5\u573a\u666f\u4e8b\u5b9e\u53ca\u5176\u6e32\u67d3\u53ef\u89c1\u6027\u3002", "why_notable": "\u5c06\u4ee3\u7801\u53ef\u6267\u884c\u6027\u3001\u573a\u666f\u6b63\u786e\u6027\u4e0e\u753b\u9762\u53ef\u8bc6\u522b\u6027\u5206\u5f00\u68c0\u9a8c\uff0c\u4e3a\u89c6\u9891\u751f\u6210\u7684\u4ee3\u7406\u573a\u666f\u63d0\u4f9b\u8bc4\u6d4b\uff0c\u5e76\u63ed\u793a\u7a7a\u95f4\u7406\u89e3\u4e0e\u89c6\u89c9\u7ea0\u9519\u77ed\u677f\u3002"}, {"abstract": "Robot-use agents (RUAs) have emerged as a promising approach to general-purpose robot control. However, strong performance has so far been achieved only by frontier proprietary models such as GPT-6 Astra and Claude Fable 5.2, whereas open-weight models remain substantially less capable. We show that an open-weight 27B reasoning model can be trained to use real robots natively through reinforcement learning, entirely in simulation and without demonstrations. Like a computer-use agent (CUA), the model observes the environment, reasons in a chain of thought, and generates the next end-effector pose, without any harness. We build a Post-training Engine for Agentic Robotics (PEAR) and use it to train the model on simulated robot tasks at scale with robot-use reinforcement learning (RURL), mirroring how frontier models acquire computer use. We find that the skills acquired in simulation generalize well beyond the training tasks: they transfer to an unseen robot, to the real world, and to novel instructions. After training on LIBERO and RoboDojo in simulation, the model succeeds in 60% of our trials on a real dual-arm robot, whereas the base model succeeds in none. On LIBERO, training raises the success rate from 1.6% to 74.4%, approaching GPT-6 Astra and GPT-6.1 Sol at maximum reasoning effort. Compared with $\u03c0_{0.5}$, a vision-language-action model fine-tuned on demonstrations, our model is substantially more robust to changes in the task itself. On LIBERO-Pro, $\u03c0_{0.5}$ succeeds in only 0.75% of episodes when assigned a new task in a familiar scene whereas our model succeeds in 57.4%. Finally, the model retains its general capabilities, with no measurable degradation on nine reasoning, coding and vision benchmarks. These results highlight robot-use reinforcement learning as a promising component of foundation-model post-training.", "arxiv_id": "2611.18562", "arxiv_url": "https://arxiv.org/abs/2611.18562", "authors": ["Jiaming Tang", "Zhuoyang Zhang", "Junxian Guo", "Fangzhou Zhao", "Yilong Zhao", "Zekai Li", "Xingyang Li", "Yuyang Zhao", "Song Bian", "Zhijian Liu", "Song Han"], "brief": "\u7814\u7a76\u7528PEAR\u540e\u8bad\u7ec3\u5f15\u64ce\uff0c\u5bf927B\u5f00\u653e\u6743\u91cd\u63a8\u7406\u6a21\u578b\u5f00\u5c55\u65e0\u793a\u8303\u7684\u4eff\u771f\u5f3a\u5316\u5b66\u4e60\u3002\u6a21\u578b\u89c2\u5bdf\u73af\u5883\u5e76\u63a8\u7406\uff0c\u76f4\u63a5\u8f93\u51fa\u672b\u7aef\u6267\u884c\u5668\u4f4d\u59ff\uff0c\u5b9e\u73b0\u771f\u5b9e\u673a\u5668\u4eba\u63a7\u5236\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18562", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["PEAR\u4ee5RURL\u8bad\u7ec3\uff0c\u5168\u7a0b\u4eff\u771f\u4e14\u65e0\u9700\u793a\u8303", "\u771f\u5b9e\u53cc\u81c2\u673a\u5668\u4eba\u6210\u529f\u738760%\uff0c\u57fa\u7840\u6a21\u578b\u4e3a0%", "LIBERO-Pro\u65b0\u4efb\u52a1\u6210\u529f\u738757.4%\uff0c\u03c0\u2080.\u2085\u4e3a0.75%"], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u6a21\u578b", "\u4eff\u771f\u5230\u73b0\u5b9e\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18562v1", "published_at": "2026-11-13", "score": 0.45, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Training Reasoning Models in Simulation to Natively Use Real Robots", "tldr": "\u7eaf\u4eff\u771f\u5f3a\u5316\u5b66\u4e60\u8ba9\u5f00\u653e\u6743\u91cd\u63a8\u7406\u6a21\u578b\u76f4\u63a5\u63a7\u5236\u771f\u673a\u5668\u4eba\uff0c\u5e76\u6cdb\u5316\u5230\u65b0\u4efb\u52a1", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528PEAR\u540e\u8bad\u7ec3\u5f15\u64ce\uff0c\u5bf927B\u5f00\u653e\u6743\u91cd\u63a8\u7406\u6a21\u578b\u5f00\u5c55\u65e0\u793a\u8303\u7684\u4eff\u771f\u5f3a\u5316\u5b66\u4e60\u3002\u6a21\u578b\u89c2\u5bdf\u73af\u5883\u5e76\u63a8\u7406\uff0c\u76f4\u63a5\u8f93\u51fa\u672b\u7aef\u6267\u884c\u5668\u4f4d\u59ff\uff0c\u5b9e\u73b0\u771f\u5b9e\u673a\u5668\u4eba\u63a7\u5236\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u4eff\u771f\u5f3a\u5316\u5b66\u4e60\u53ef\u5c06\u901a\u7528\u63a8\u7406\u80fd\u529b\u8f6c\u5316\u4e3a\u53ef\u8fc1\u79fb\u7684\u673a\u5668\u4eba\u6280\u80fd\uff1b\u540c\u65f6\u4e5d\u9879\u63a8\u7406\u3001\u7f16\u7801\u4e0e\u89c6\u89c9\u8bc4\u6d4b\u672a\u89c1\u80fd\u529b\u9000\u5316\u3002"}, {"abstract": "The release of GPT-6 Astra marks the emergence of a new paradigm in robotics: agentic robotics. Within weeks, frontier models with agentic harnesses matched or exceeded task-specific policies on many embodied benchmarks. Instead of training a dedicated policy for each family of tasks, an agentic robotic system applies a foundation model to open-world embodied tasks. It operates in a closed loop: observing the environment, interpreting user intent, reasoning about the task, invoking skills and tools, verifying outcomes, and adapting its strategy. Despite these advances, the community has yet to converge on a shared definition, a reliable evaluation framework, or a research roadmap. We argue that Embodied System 2, realized by a foundation model together with an embodied harness, forms the decision-making core of agentic robotics. Its central challenge is to translate general-purpose reasoning into effective and verifiable actions under physical constraints such as limited reaction time, mechanical limits, unpredictable environment changes, and irreversible consequences. Motivated by this perspective, we propose an evaluation framework that measures both model capabilities and closed-loop system performance. Furthermore, we identify the principles that carry over from digital to physical agents and the challenges that must be addressed to achieve reliable physical autonomy. On top of the Embodied System 2 and the evaluation framework, we envision a research roadmap toward sustained autonomy: the ability to perform work safely and reliably with progressively broader responsibility, from executing individual primitives to fulfilling standing roles.", "arxiv_id": "2611.18359", "arxiv_url": "https://arxiv.org/abs/2611.18359", "authors": ["Grid Robotics", ":", "Qingfeng Lan", "Duo Li", "Siyao Li", "Yiheng Lyu", "Shijian Lu", "Zhenghao Qi", "Shizun Wang", "Xinchao Wang", "Ming Yang", "Zhiqin Yang", "Zuhao Yang", "Tao Yu"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u8303\u5f0f\u4e0e\u8def\u7ebf\u56fe\u8bba\u6587\uff0c\u5c06\u57fa\u7840\u6a21\u578b\u548c\u5177\u8eab\u6267\u884c\u6846\u67b6\u7ec4\u6210\u7684\u5177\u8eab\u7cfb\u7edf\u4e8c\u4f5c\u4e3a\u51b3\u7b56\u6838\u5fc3\uff0c\u901a\u8fc7\u89c2\u5bdf\u3001\u63a8\u7406\u3001\u8c03\u7528\u6280\u80fd\u548c\u9a8c\u8bc1\u7ed3\u679c\u5f62\u6210\u884c\u52a8\u95ed\u73af\u3002", "categories": ["cs.RO", "cs.AI", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18359", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["Embodied System 2\u7ed3\u5408\u57fa\u7840\u6a21\u578b\u4e0e\u5177\u8eab\u6267\u884c\u6846\u67b6", "\u8bc4\u6d4b\u540c\u65f6\u8986\u76d6\u6a21\u578b\u80fd\u529b\u4e0e\u95ed\u73af\u7cfb\u7edf\u8868\u73b0", "\u6301\u7eed\u81ea\u4e3b\u8def\u7ebf\u4ece\u6267\u884c\u5355\u9879\u52a8\u4f5c\u8d70\u5411\u627f\u62c5\u957f\u671f\u89d2\u8272"], "keywords": ["\u673a\u5668\u4eba\u667a\u80fd\u4f53", "\u57fa\u7840\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u95ed\u73af\u8bc4\u6d4b"], "num_comments": 5, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18359v1", "published_at": "2026-11-13", "score": 0.434, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (110\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18359.png", "title": "Envisioning Agentic Robotics: A New Era of Robotic Systems", "tldr": "\u4ee5\u57fa\u7840\u6a21\u578b\u4e0e\u5177\u8eab\u6267\u884c\u6846\u67b6\u4e3a\u6838\u5fc3\uff0c\u63d0\u51fa\u673a\u5668\u4eba\u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u6846\u67b6\u4e0e\u6301\u7eed\u81ea\u4e3b\u8def\u7ebf\u3002", "upvotes": 110, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u8303\u5f0f\u4e0e\u8def\u7ebf\u56fe\u8bba\u6587\uff0c\u5c06\u57fa\u7840\u6a21\u578b\u548c\u5177\u8eab\u6267\u884c\u6846\u67b6\u7ec4\u6210\u7684\u5177\u8eab\u7cfb\u7edf\u4e8c\u4f5c\u4e3a\u51b3\u7b56\u6838\u5fc3\uff0c\u901a\u8fc7\u89c2\u5bdf\u3001\u63a8\u7406\u3001\u8c03\u7528\u6280\u80fd\u548c\u9a8c\u8bc1\u7ed3\u679c\u5f62\u6210\u884c\u52a8\u95ed\u73af\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u628a\u901a\u7528\u63a8\u7406\u3001\u7269\u7406\u7ea6\u675f\u4e0e\u7cfb\u7edf\u8bc4\u6d4b\u7eb3\u5165\u7edf\u4e00\u89c6\u89d2\uff0c\u4e3a\u673a\u5668\u4eba\u4ece\u4efb\u52a1\u6267\u884c\u8d70\u5411\u5b89\u5168\u53ef\u9760\u7684\u957f\u671f\u81ea\u4e3b\u63d0\u4f9b\u7814\u7a76\u65b9\u5411\u3002"}, {"abstract": "Web agents powered by large language and vision-language models are increasingly applied to realistic browser work that spans heterogeneous applications, multimodal content, and stateful workflows. However, existing reproducible web-agent benchmarks cover only a small number of web applications drawn from a few software categories, and restrict modality to text and vision. Live benchmarks broaden site coverage but sacrifice reproducibility, since pages and data drift between runs. Moreover, existing benchmarks do not meaningfully evaluate whether agents can understand and use audio and video content embedded within web tasks. To address these gaps, we introduce WebArena-Pro, a benchmark comprising 300 tasks across 20 self-hosted web applications in six domain categories, spanning distinct interface conventions, workflows, and data models. Across the evaluated agents, the best performance is achieved by both Codex with GPT 6.1 Sol and Claude Code with Claude Opus 5.5 at 62.3%, followed by OpenCode with Kimi 3.1 Pro at 60.7%. The strongest GenericAgent configurations, Gemini 3.1 Pro omni and Gemma4 31B, both achieve 30.3%. Among reproducible, human-curated web agent benchmarks, WebArena-Pro provides the broadest application coverage and the most comprehensive multimodal support to date. The benchmark treats audio and video as core observations alongside text and vision, with dedicated actions for extracting information from each. WebArena-Pro runs each task in isolation and supports reproducible, parallel evaluation. Tasks are authored through a dedicated annotator interface, filtered by LLM-assisted triage, and finally validated by humans before release. Project page: https://webarena-pro.github.io", "arxiv_id": "2611.17955", "arxiv_url": "https://arxiv.org/abs/2611.17955", "authors": ["Imene Kerboua", "Fatemeh Pesaran Zadeh", "Xing Han L\u00f9", "Weijian Qi", "Alexander Miller", "Junyi Song", "Yunjia Tian", "Dongjin Kang", "Seyeon Choi", "Marzia Nouri", "Ewen Gueguen", "Matteo Boglioni", "Fengyuan Liu", "Zeyi Liao", "Mengqi Yuan", "Yue Li", "Alexandre Lacoste", "Alexandre Drouin", "Spandana Gella", "Huan Sun", "Gunhee Kim", "Siva Reddy"], "brief": "\u6784\u5efa\u8986\u76d6\u5f02\u6784\u7f51\u9875\u5e94\u7528\u7684\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5c06\u97f3\u9891\u3001\u89c6\u9891\u4e0e\u6587\u5b57\u3001\u89c6\u89c9\u5171\u540c\u7eb3\u5165\u4efb\u52a1\u89c2\u5bdf\u3002\u901a\u8fc7\u81ea\u6258\u7ba1\u5e94\u7528\u3001\u4efb\u52a1\u9694\u79bb\u548c\u4eba\u5de5\u9a8c\u8bc1\uff0c\u652f\u6301\u53ef\u590d\u73b0\u7684\u5e76\u884c\u8bc4\u6d4b\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/McGill-NLP/webarena-pro", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.17955", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["300\u9879\u4efb\u52a1\u8986\u76d620\u4e2a\u81ea\u6258\u7ba1\u5e94\u7528\u30016\u7c7b\u9886\u57df", "\u97f3\u9891\u4e0e\u89c6\u9891\u4f5c\u4e3a\u6838\u5fc3\u89c2\u5bdf\uff0c\u914d\u5907\u4e13\u7528\u4fe1\u606f\u63d0\u53d6\u52a8\u4f5c", "Codex\u4e0eClaude Code\u5e76\u5217\u6700\u4f73\uff0c\u6210\u529f\u738762.3%"], "keywords": ["\u7f51\u9875\u667a\u80fd\u4f53", "\u591a\u6a21\u6001\u8bc4\u6d4b", "\u53ef\u590d\u73b0\u57fa\u51c6"], "num_comments": 3, "on_hf": true, "organization": "McGill NLP Group", "pdf_url": "https://arxiv.org/pdf/2611.17955v1", "published_at": "2026-11-13", "score": 0.43, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17955.png", "title": "WebArena-Pro: A Heterogeneous, Multimodal, Reproducible Benchmark for Web Agents", "tldr": "\u4ee5\u53ef\u590d\u73b0\u7684\u591a\u5e94\u7528\u5f71\u97f3\u4efb\u52a1\u8bc4\u6d4b\u7f51\u9875\u667a\u80fd\u4f53\uff0c\u6700\u5f3a\u53d7\u6d4b\u7cfb\u7edf\u6210\u529f\u7387\u4e3a62.3%\u3002", "upvotes": 11, "what_it_is": "\u6784\u5efa\u8986\u76d6\u5f02\u6784\u7f51\u9875\u5e94\u7528\u7684\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5c06\u97f3\u9891\u3001\u89c6\u9891\u4e0e\u6587\u5b57\u3001\u89c6\u89c9\u5171\u540c\u7eb3\u5165\u4efb\u52a1\u89c2\u5bdf\u3002\u901a\u8fc7\u81ea\u6258\u7ba1\u5e94\u7528\u3001\u4efb\u52a1\u9694\u79bb\u548c\u4eba\u5de5\u9a8c\u8bc1\uff0c\u652f\u6301\u53ef\u590d\u73b0\u7684\u5e76\u884c\u8bc4\u6d4b\u3002", "why_notable": "\u5c06\u53ef\u590d\u73b0\u8bc4\u6d4b\u6269\u5c55\u5230\u66f4\u591a\u5e94\u7528\u53ca\u5f71\u97f3\u5185\u5bb9\uff0c\u8865\u8db3\u4f20\u7edf\u7f51\u9875\u57fa\u51c6\u7684\u8986\u76d6\u7f3a\u53e3\uff1b\u6700\u4f73\u6210\u7ee9\u4ecd\u663e\u793a\u590d\u6742\u7f51\u9875\u4efb\u52a1\u5b58\u5728\u660e\u663e\u63d0\u5347\u7a7a\u95f4\u3002"}, {"abstract": "Previous work has shown that alignment training on individual LLM agents can fail to transfer to multi-agent settings. We investigate the underlying mechanisms for this failure, and explore interventions to preserve alignment transfer to multi-agent LLM teams. We focus on two software-engineering tasks (sepsis triage, a news recommender) and ten consulting-proposal generation tasks. We present four findings: (1) The single-vs-team safety gap does not show a clear trend with more capable models. We find that Anthropic\u0027s Mythos Preview shows the largest gap on one of our tasks but the smallest on another; (2) Many natural interventions, such as having agents critique each other\u0027s work or coordinate in a group chat, do not reliably bring agent teams back to single-agent alignment behavior; (3) diffusion of responsibility substantially accounts for the safety gap: agents in teams are less likely to proactively check for system-level safety failures and more likely to ignore, rationalize, or deflect responsibility for issues when they arise; (4) having a designated safety lead agent ensure system-level safety, and having a coordinator agent publish a safety specifications document are effective at restoring single-agent alignment. We also release magelab, a multi-agent LLM orchestration and experimentation framework. Our findings can help practitioners design agent teams that successfully preserve the behaviors expected of aligned individual agents.", "arxiv_id": "2611.17820", "arxiv_url": "https://arxiv.org/abs/2611.17820", "authors": ["Siddarth Srinivasan", "Morgan Jane Matthews", "Jascha Sohl-Dickstein", "Erik Jones"], "brief": "\u7814\u7a76\u6bd4\u8f83\u5355\u4e2a\u4e0e\u56e2\u961f\u5f0f\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u8f6f\u4ef6\u5de5\u7a0b\u548c\u54a8\u8be2\u4efb\u52a1\u4e2d\u7684\u5b89\u5168\u884c\u4e3a\uff0c\u5206\u6790\u5bf9\u9f50\u5931\u6548\u673a\u5236\uff0c\u5e76\u6d4b\u8bd5\u4e92\u8bc4\u3001\u7fa4\u804a\u534f\u8c03\u53ca\u660e\u786e\u5b89\u5168\u8d23\u4efb\u7b49\u5e72\u9884\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17820", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b\u8986\u76d62\u9879\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u548c10\u9879\u54a8\u8be2\u63d0\u6848\u4efb\u52a1", "\u8d23\u4efb\u5206\u6563\u89e3\u91ca\u5b89\u5168\u5dee\u8ddd\uff0c\u4e92\u8bc4\u4e0e\u7fa4\u804a\u5e72\u9884\u4e0d\u7a33\u5b9a", "\u6307\u5b9a\u5b89\u5168\u8d1f\u8d23\u4eba\u3001\u53d1\u5e03\u5b89\u5168\u89c4\u8303\u6709\u6548\uff0c\u5e76\u5f00\u6e90magelab"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u5b89\u5168\u5bf9\u9f50", "\u8d23\u4efb\u5206\u914d", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17820v1", "published_at": "2026-11-13", "score": 0.424, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17820.png", "title": "Aligning AI Teams", "tldr": "\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u53ef\u80fd\u524a\u5f31\u5355\u4f53\u5b89\u5168\u5bf9\u9f50\uff0c\u660e\u786e\u5b89\u5168\u804c\u8d23\u6709\u52a9\u4e8e\u6062\u590d\u5bf9\u9f50\u8868\u73b0\u3002", "upvotes": 12, "what_it_is": "\u7814\u7a76\u6bd4\u8f83\u5355\u4e2a\u4e0e\u56e2\u961f\u5f0f\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u8f6f\u4ef6\u5de5\u7a0b\u548c\u54a8\u8be2\u4efb\u52a1\u4e2d\u7684\u5b89\u5168\u884c\u4e3a\uff0c\u5206\u6790\u5bf9\u9f50\u5931\u6548\u673a\u5236\uff0c\u5e76\u6d4b\u8bd5\u4e92\u8bc4\u3001\u7fa4\u804a\u534f\u8c03\u53ca\u660e\u786e\u5b89\u5168\u8d23\u4efb\u7b49\u5e72\u9884\u3002", "why_notable": "\u5c06\u56e2\u961f\u5bf9\u9f50\u5931\u6548\u6307\u5411\u8d23\u4efb\u5206\u6563\uff0c\u800c\u975e\u7b80\u5355\u7684\u6a21\u578b\u80fd\u529b\u4e0d\u8db3\uff0c\u4e3a\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u5b89\u5168\u804c\u8d23\u8bbe\u8ba1\u601d\u8def\u3002"}, {"abstract": "Large language models (LLMs) are increasingly applied to finance, creating a need for benchmarks that evaluate their capabilities across financial systems with different regulations and practices. However, existing financial benchmarks provide limited coverage of country-specific financial systems, and they are difficult to keep up to date as released questions leak into training data. We introduce JFinBench, a Japanese financial benchmark comprising 321 examples from the 2026 editions of six regularly administered certification exams covering accounting, tax, financial planning, and banking. To construct it, we develop a human-in-the-loop agentic pipeline in which a coding agent writes exam-specific conversion code and a review page, while a human verifies every example and feeds corrections back to the agent. This pipeline adapts to heterogeneous exam formats and reduces the effort of incorporating new exam editions, enabling periodic refreshes that mitigate data contamination. Evaluating 12 recent LLMs, we find that Claude Fable 5 and GPT-6 Astra exceed 93% overall, while even the best open-weight model, Kimi K3.1 Pro, trails Claude Fable 5 by 12 percentage points. When models can additionally use a terminal and web access, they retrieve the knowledge they lack and every model improves. The gap narrows but about 4 points remain, and the ranking of models stays largely the same, suggesting that knowledge held in the model itself remains valuable even with tools. We release the dataset, the evaluation code, and the construction pipeline.", "arxiv_id": "2611.18130", "arxiv_url": "https://arxiv.org/abs/2611.18130", "authors": ["Issa Sugiura", "Taro Makino", "Takashi Ishida"], "brief": "\u6784\u5efa\u8986\u76d6\u65e5\u672c\u4f1a\u8ba1\u3001\u7a0e\u52a1\u3001\u7406\u8d22\u4e0e\u94f6\u884c\u4e1a\u52a1\u7684\u91d1\u878d\u8bc4\u6d4b\u96c6\u3002\u7f16\u7801\u667a\u80fd\u4f53\u751f\u6210\u8bd5\u9898\u8f6c\u6362\u4ee3\u7801\u548c\u5ba1\u6838\u9875\u9762\uff0c\u4eba\u7c7b\u9010\u9898\u6838\u9a8c\u5e76\u53cd\u9988\u4fee\u6b63\uff0c\u652f\u6301\u5b9a\u671f\u7eb3\u5165\u65b0\u7248\u8003\u8bd5\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/SakanaAI/JFinBench", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.18130", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6536\u5f552026\u5e74\u516d\u7c7b\u8d44\u683c\u8003\u8bd5\u7684321\u9053\u9898\uff0c\u8bc4\u6d4b12\u4e2a\u6a21\u578b", "Claude Fable 5\u4e0eGPT-6 Astra\u603b\u5206\u5747\u8d8593%", "\u7ec8\u7aef\u4e0e\u8054\u7f51\u4f7f\u6240\u6709\u6a21\u578b\u63d0\u5347\uff0c\u5f00\u653e\u6743\u91cd\u9886\u5148\u8005\u5dee\u8ddd\u753112\u964d\u81f3\u7ea64\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u91d1\u878d\u8bc4\u6d4b", "\u6570\u636e\u6c61\u67d3", "\u4eba\u673a\u534f\u4f5c", "\u5de5\u5177\u589e\u5f3a"], "num_comments": 2, "on_hf": true, "organization": "Sakana AI", "pdf_url": "https://arxiv.org/pdf/2611.18130v1", "published_at": "2026-11-13", "score": 0.408, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18130.png", "title": "JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams", "tldr": "\u7528\u6700\u65b0\u65e5\u672c\u91d1\u878d\u8d44\u683c\u8003\u8bd5\u6784\u5efa\u53ef\u66f4\u65b0\u57fa\u51c6\uff0c\u63ed\u793a\u5de5\u5177\u589e\u5f3a\u540e\u4ecd\u5b58\u5728\u6a21\u578b\u80fd\u529b\u5dee\u8ddd\u3002", "upvotes": 9, "what_it_is": "\u6784\u5efa\u8986\u76d6\u65e5\u672c\u4f1a\u8ba1\u3001\u7a0e\u52a1\u3001\u7406\u8d22\u4e0e\u94f6\u884c\u4e1a\u52a1\u7684\u91d1\u878d\u8bc4\u6d4b\u96c6\u3002\u7f16\u7801\u667a\u80fd\u4f53\u751f\u6210\u8bd5\u9898\u8f6c\u6362\u4ee3\u7801\u548c\u5ba1\u6838\u9875\u9762\uff0c\u4eba\u7c7b\u9010\u9898\u6838\u9a8c\u5e76\u53cd\u9988\u4fee\u6b63\uff0c\u652f\u6301\u5b9a\u671f\u7eb3\u5165\u65b0\u7248\u8003\u8bd5\u3002", "why_notable": "\u5c06\u672c\u56fd\u91d1\u878d\u5236\u5ea6\u8bc4\u6d4b\u4e0e\u53ef\u6301\u7eed\u66f4\u65b0\u7ed3\u5408\uff0c\u964d\u4f4e\u9898\u76ee\u6cc4\u6f0f\u5e26\u6765\u7684\u6c61\u67d3\u98ce\u9669\uff1b\u5de5\u5177\u867d\u80fd\u8865\u5145\u77e5\u8bc6\uff0c\u5374\u672a\u6d88\u9664\u6a21\u578b\u95f4\u5dee\u8ddd\u3002"}, {"abstract": "Autonomous agents modify prompts, memories, tools, workflows, and policies using interaction histories. Yet a plausible modification is not necessarily suitable for persistent adoption: candidate selection is adaptive, evaluators may be imperfect, and local gains can hide degradation against an earlier baseline. We introduce Evidence-Governed Evolution (EGE), a framework for governing adoption of self-generated agent modifications. EGE separates candidate generation from confirmatory adoption, evaluates frozen candidates on fresh paired audits, requires meaningful improvement on a prespecified primary objective, protects declared capabilities through reference-relative non-inferiority tests, and applies governance constraints before bounded canary deployment. We establish an evaluator-calibrated simultaneous lower-bound construction for a countable sequence of adaptively generated candidates. It combines candidate-wise Hoeffding bounds with independent calibration samples comparing the operational evaluator with a prespecified reference procedure. We also formalise reference replacement through bridge tests, derive a cumulative degradation bound along a versioned reference lineage, and provide an audit-planning condition relating effect-size margin, sample sizes, and acceptance probability. A Monte Carlo stress test illustrates calibration under candidate-dependent evaluator optimism; it is a stylised statistical experiment, not an evaluation of a deployed agent. The guarantees are conditional on bounded paired scores, fresh sampling, a valid reference-evaluation construct, and declared evaluation distributions; they do not establish universal agent safety or robustness to arbitrary distribution shift.", "arxiv_id": "2611.16378", "arxiv_url": "https://arxiv.org/abs/2611.16378", "authors": ["Subodh Lonkar"], "brief": "\u63d0\u51fa\u8bc1\u636e\u6cbb\u7406\u6f14\u5316\u6846\u67b6EGE\uff0c\u5c06\u66f4
