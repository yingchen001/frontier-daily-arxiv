trol policies to 7B-parameter language models. Experimental benchmark results show that frontier agents can already read small networks and write working control policies without ever running them, but cannot yet patch language models, compress them without data, or tell an impossible edit from a hard one. On all 42 tasks, Claude Opus 5.5 reaches a macro score of 0.535 (Sonnet 5.5 0.466, Haiku 5.5 0.402, DeepSeek v4-flash 0.215); on the 38 tasks it was run on, GPT-6.1-sol reaches 0.568 against Opus\u0027s 0.546. Code, the task registry, our OS-level sandbox harness, and the live leaderboard are publicly available at https://github.com/Aayush-Marasini/WeightBench.", "arxiv_id": "2611.18553", "arxiv_url": "https://arxiv.org/abs/2611.18553", "authors": ["Aayush Marasini", "Barsat Khadka", "Nick Rahimi"], "brief": "\u63d0\u51fa\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b\u57fa\u51c6\uff0c\u8bc4\u4f30\u5927\u6a21\u578b\u4e0d\u7ecf\u68af\u5ea6\u4e0b\u964d\u76f4\u63a5\u7406\u89e3\u3001\u4fee\u6539\u548c\u751f\u6210\u7f51\u7edc\u53c2\u6570\u7684\u80fd\u529b\u3002\u4efb\u52a1\u8986\u76d6\u4e94\u6761\u8d5b\u9053\uff0c\u5e76\u63d0\u4f9b\u64cd\u4f5c\u7cfb\u7edf\u7ea7\u6c99\u7bb1\u4e0e\u516c\u5f00\u699c\u5355\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18553", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["42\u9879\u4efb\u52a1\u3001\u4e94\u6761\u8d5b\u9053\uff0c\u8986\u76d6\u8bfb\u5199\u4fee\u590d\u3001\u4e0d\u53ef\u884c\u7f16\u8f91\u4e0e\u65e0\u6570\u636e\u538b\u7f29", "\u76ee\u6807\u7f51\u7edc\u89c4\u6a21\u4ece2\u5343\u53c2\u6570\u63a7\u5236\u7b56\u7565\u523070\u4ebf\u53c2\u6570\u8bed\u8a00\u6a21\u578b", "Opus\u5168\u4efb\u52a1\u5b8f\u5e73\u5747\u5f97\u52060.535\uff0c\u8bed\u8a00\u6a21\u578b\u4fee\u8865\u7b49\u4ecd\u672a\u7a81\u7834"], "keywords": ["\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b", "\u6a21\u578b\u8bc4\u6d4b", "\u6a21\u578b\u7f16\u8f91", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18553v1", "published_at": "2026-11-13", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WeightBench: Evaluating Language Models as Weight-Space Programmers", "tldr": "\u7528\u56db\u5341\u4e8c\u9879\u4efb\u52a1\u68c0\u9a8c\u5927\u6a21\u578b\u76f4\u63a5\u8bfb\u5199\u7f51\u7edc\u6743\u91cd\u7684\u80fd\u529b\uff0c\u63ed\u793a\u5176\u4f18\u52bf\u4e0e\u74f6\u9888\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b\u57fa\u51c6\uff0c\u8bc4\u4f30\u5927\u6a21\u578b\u4e0d\u7ecf\u68af\u5ea6\u4e0b\u964d\u76f4\u63a5\u7406\u89e3\u3001\u4fee\u6539\u548c\u751f\u6210\u7f51\u7edc\u53c2\u6570\u7684\u80fd\u529b\u3002\u4efb\u52a1\u8986\u76d6\u4e94\u6761\u8d5b\u9053\uff0c\u5e76\u63d0\u4f9b\u64cd\u4f5c\u7cfb\u7edf\u7ea7\u6c99\u7bb1\u4e0e\u516c\u5f00\u699c\u5355\u3002", "why_notable": "\u5c06\u76f4\u63a5\u64cd\u4f5c\u7f51\u7edc\u6743\u91cd\u7684\u80fd\u529b\u8f6c\u5316\u4e3a\u53ef\u6bd4\u8f83\u7684\u8bc4\u6d4b\uff0c\u533a\u5206\u5c0f\u7f51\u7edc\u4e0a\u7684\u6210\u529f\u4e0e\u5927\u6a21\u578b\u7f16\u8f91\u7684\u74f6\u9888\uff0c\u4e3a\u540e\u7eed\u7814\u7a76\u63d0\u4f9b\u660e\u786e\u9776\u70b9\u3002"}, {"abstract": "Commercial solvers are the standard tool for difficult scheduling problems. We study whether a frontier large language model, used as a coding agent with open-source tools only, can match them in quality and speed. We report every run, and independent checkers verify every schedule. On the 100,000-operation job shop tai_100_1000_1, an agent-written solver reached 525,515, below OptalCP, Hexaly, and CP Optimizer. Unchanged, it improved all ten instances of the family and closed two. With equal budgets on the same workstation, it ended 0.0-1.8% above the lower bound, against 2.6-5.8% for CP Optimizer and 2.4-4.4% for Hexaly. On the Behnke-Geiger flexible job shops, an agent-written tabu search improved 11 of 32 open instances. With two transport robots, an agent-written solver improved seven of ten MKT instances. New lower bounds show that four published MKT values cannot be attained on the distributed instance files. Agent-run improvement campaigns closed eight further instances.", "arxiv_id": "2611.17682", "arxiv_url": "https://arxiv.org/abs/2611.17682", "authors": ["Andre Albrecht", "Enzo Morosini Frazzon", "Leandro C. Coelho", "Bruno Vieira"], "brief": "\u7814\u7a76\u8ba9\u524d\u6cbf\u5927\u6a21\u578b\u4f5c\u4e3a\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u4ec5\u7528\u5f00\u6e90\u5de5\u5177\u5f00\u53d1\u8f66\u95f4\u8c03\u5ea6\u6c42\u89e3\u5668\uff0c\u4e0e\u5546\u4e1a\u8f6f\u4ef6\u540c\u673a\u540c\u9884\u7b97\u6bd4\u8f83\u3002\u6240\u6709\u8fd0\u884c\u5747\u62a5\u544a\uff0c\u8c03\u5ea6\u7ed3\u679c\u7531\u72ec\u7acb\u68c0\u67e5\u5668\u9a8c\u8bc1\u3002", "categories": ["math.OC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17682", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5341\u4e07\u64cd\u4f5c\u5b9e\u4f8b\u83b7525,515\uff0c\u540c\u65cf\u5341\u4f8b\u5747\u6539\u8fdb\u3001\u4e24\u4f8b\u89e3\u51b3", "\u540c\u9884\u7b97\u6700\u4f18\u6027\u5dee\u8ddd0\u20141.8%\uff0c\u4f18\u4e8e\u4e24\u6b3e\u5546\u4e1a\u6c42\u89e3\u5668", "\u667a\u80fd\u4f53\u7f16\u5199\u7981\u5fcc\u641c\u7d22\uff0c\u6539\u8fdb32\u4e2a\u672a\u89e3\u67d4\u6027\u5b9e\u4f8b\u4e2d\u768411\u4e2a"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f66\u95f4\u8c03\u5ea6", "\u7ec4\u5408\u4f18\u5316", "\u542f\u53d1\u5f0f\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17682v1", "published_at": "2026-11-13", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Agent-written heuristics versus commercial solvers on unsolved job-shop benchmark instances", "tldr": "\u5927\u6a21\u578b\u667a\u80fd\u4f53\u7f16\u5199\u8c03\u5ea6\u542f\u53d1\u5f0f\uff0c\u5728\u591a\u4e2a\u672a\u89e3\u57fa\u51c6\u4e0a\u8d85\u8d8a\u5546\u4e1a\u6c42\u89e3\u5668\u5e76\u6539\u8fdb\u7eaa\u5f55\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u8ba9\u524d\u6cbf\u5927\u6a21\u578b\u4f5c\u4e3a\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u4ec5\u7528\u5f00\u6e90\u5de5\u5177\u5f00\u53d1\u8f66\u95f4\u8c03\u5ea6\u6c42\u89e3\u5668\uff0c\u4e0e\u5546\u4e1a\u8f6f\u4ef6\u540c\u673a\u540c\u9884\u7b97\u6bd4\u8f83\u3002\u6240\u6709\u8fd0\u884c\u5747\u62a5\u544a\uff0c\u8c03\u5ea6\u7ed3\u679c\u7531\u72ec\u7acb\u68c0\u67e5\u5668\u9a8c\u8bc1\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u7f16\u7801\u667a\u80fd\u4f53\u80fd\u5728\u9ad8\u96be\u5ea6\u4f18\u5316\u57fa\u51c6\u4e0a\u4ea7\u51fa\u6709\u7ade\u4e89\u529b\u7684\u4e13\u7528\u7b97\u6cd5\uff1b\u65b0\u4e0b\u754c\u8fd8\u63ed\u793a\u56db\u4e2a\u5df2\u53d1\u8868\u7ed3\u679c\u5728\u5206\u53d1\u5b9e\u4f8b\u4e0a\u4e0d\u53ef\u8fbe\u3002"}, {"abstract": "Robots handle much more than rigid objects: towels, cables, water, sand. The simulators used to train robots at scale are strongest on rigid bodies, and adding another material usually means a second engine and hand-written glue between the two. We present Alloy, an open-source physics engine for robot learning in which rigid robots, cloth, cables, liquids, granular material and soft bodies share one scene. Each object is described once; Alloy assigns it to a solver suited to its material, couples the solvers inside every control step, and runs the scene in many parallel worlds on one GPU, or on a CPU. Every world carries a health grade, to help tell a failure of the physics from a failure of the policy. Alloy is built on Newton, MuJoCo Warp and Warp, and it is written to be driven by coding agents: its documentation ships inside the package, every error names its fix, and the engine is exposed as tools over the Model Context Protocol. In a cold test, agents that had never seen Alloy installed a pre-release from the package index and trained policies for walking, cable handling and pouring on a single GPU. We also report how throughput grows with the number of worlds, depth-camera throughput, agreement with closed-form references, and a reliability test over a thousand worlds.", "arxiv_id": "2611.16312", "arxiv_url": "https://arxiv.org/abs/2611.16312", "authors": ["Pranay Gupta", "Deepanshu Rohilla"], "brief": "\u8fd9\u662f\u9762\u5411\u673a\u5668\u4eba\u5b66\u4e60\u7684\u5f00\u6e90\u7269\u7406\u5f15\u64ce\uff0c\u5c06\u521a\u4f53\u3001\u5e03\u6599\u3001\u6db2\u4f53\u7b49\u653e\u5165\u540c\u4e00\u573a\u666f\u3002\u5b83\u6309\u6750\u6599\u5206\u914d\u6c42\u89e3\u5668\uff0c\u5728\u6bcf\u4e2a\u63a7\u5236\u6b65\u5185\u8026\u5408\uff0c\u5e76\u652f\u6301\u5355\u5361\u591a\u4e16\u754c\u5e76\u884c\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.16312", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8eNewton\u3001MuJoCo Warp\u548cWarp\u6784\u5efa", "\u6bcf\u4e2a\u4e16\u754c\u9644\u5e26\u5065\u5eb7\u8bc4\u7ea7\uff0c\u8f85\u52a9\u533a\u5206\u7269\u7406\u4e0e\u7b56\u7565\u6545\u969c", "\u901a\u8fc7MCP\u66b4\u9732\u5de5\u5177\uff1b\u964c\u751f\u667a\u80fd\u4f53\u5b8c\u6210\u4e09\u7c7b\u7b56\u7565\u8bad\u7ec3"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u7269\u7406\u4eff\u771f", "\u591a\u6750\u6599\u4eff\u771f", "\u7f16\u7a0b\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.16312v1", "published_at": "2026-11-12", "score": 0.18, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16312.png", "title": "Alloy: A Multi-Material Physics Engine for Robot Learning", "tldr": "Alloy\u7edf\u4e00\u591a\u6750\u6599\u7269\u7406\u4eff\u771f\uff0c\u652f\u6301\u5355\u5361\u5e76\u884c\u8bad\u7ec3\u53ca\u7f16\u7a0b\u667a\u80fd\u4f53\u63a5\u5165\u3002", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u9762\u5411\u673a\u5668\u4eba\u5b66\u4e60\u7684\u5f00\u6e90\u7269\u7406\u5f15\u64ce\uff0c\u5c06\u521a\u4f53\u3001\u5e03\u6599\u3001\u6db2\u4f53\u7b49\u653e\u5165\u540c\u4e00\u573a\u666f\u3002\u5b83\u6309\u6750\u6599\u5206\u914d\u6c42\u89e3\u5668\uff0c\u5728\u6bcf\u4e2a\u63a7\u5236\u6b65\u5185\u8026\u5408\uff0c\u5e76\u652f\u6301\u5355\u5361\u591a\u4e16\u754c\u5e76\u884c\u3002", "why_notable": "\u5b83\u51cf\u5c11\u591a\u6750\u6599\u4efb\u52a1\u4e2d\u62fc\u63a5\u4eff\u771f\u5668\u7684\u5de5\u7a0b\u8d1f\u62c5\uff0c\u5e76\u5c06\u7269\u7406\u5065\u5eb7\u8bca\u65ad\u4e0e\u667a\u80fd\u4f53\u5de5\u5177\u63a5\u53e3\u7eb3\u5165\u5f15\u64ce\uff0c\u4fbf\u4e8e\u81ea\u52a8\u5316\u8bad\u7ec3\u548c\u6392\u9519\u3002"}, {"abstract": "We present EvenVLM, the first text and multimodal (VQA) dataset for Even (Lamut), an endangered Northern Tungusic language spoken by approximately 6,800 people in Siberia. Our dataset comprises 50,521 structured Even-Russian entries extracted from dictionary and phrasebook sources via GPT-4o Mini-based parsing, from which we synthetically generate 107,543 training examples spanning translation, grammar, reading comprehension, and semantic classification. To address tokenization inefficiency on Even\u0027s agglutinative morphology, we propose a three-step tokenizer expansion algorithm that adds Even-specific graphemes (eng, oe, o-umlaut), whitelisted vocabulary, and BPE merges, reducing average tokens per word by 27% (4.99 to 3.64). Using LoRA fine-tuning of Qwen3-VL-4B, we adapt the model for text tasks (0.53% trainable parameters, rank 32) and separately for visual question answering (rank 64, frozen vision encoder). Our best configuration achieves 11.4% exact match and a 13.6 weighted score on text benchmarks, 0.1283 chrF for sentence translation, and 65% accuracy on VQA (up from 0% for the base model and text-only fine-tuning). We release our datasets, evaluation benchmarks, and training pipeline to support further research on Even and other low-resource languages.", "arxiv_id": "2611.16500", "arxiv_url": "https://arxiv.org/abs/2611.16500", "authors": ["Daniil Makovetskii", "Ivan Bondarenko"], "brief": "\u4ece\u8bcd\u5178\u548c\u4f1a\u8bdd\u624b\u518c\u63d0\u53d6\u57c3\u6587\u8bed\u2014\u4fc4\u8bed\u6761\u76ee\uff0c\u5408\u6210\u591a\u4efb\u52a1\u8bad\u7ec3\u6570\u636e\u5e76\u6784\u5efa\u89c6\u89c9\u95ee\u7b54\u96c6\u3002\u901a\u8fc7\u4e09\u6b65\u5206\u8bcd\u5668\u6269\u5c55\u53caLoRA\u5fae\u8c03\uff0c\u9002\u914dQwen3-VL-4B\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.16500", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u53d650,521\u6761\u53cc\u8bed\u6761\u76ee\uff0c\u5408\u6210107,543\u6761\u8bad\u7ec3\u6837\u672c", "\u4e09\u6b65\u8bcd\u8868\u6269\u5c55\u5c06\u5e73\u5747\u6bcf\u8bcd\u4ee4\u724c\u6570\u964d\u4f4e27%", "\u89c6\u89c9\u95ee\u7b54LoRA\u5fae\u8c03\u4f7f\u51c6\u786e\u7387\u4ece0%\u5347\u81f365%"], "keywords": ["\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u591a\u6a21\u6001\u5b66\u4e60", "\u5206\u8bcd\u5668\u6269\u5c55", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.16500v1", "published_at": "2026-11-12", "score": 0.175, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16500.png", "title": "EvenVLM: A Text and Multimodal Dataset for the Even Language with Vision-Language Fine-Tuning", "tldr": "\u4e3a\u6fd2\u5371\u57c3\u6587\u8bed\u6784\u5efa\u6587\u672c\u4e0e\u89c6\u89c9\u95ee\u7b54\u6570\u636e\uff0c\u5e76\u901a\u8fc7\u8bcd\u8868\u6269\u5c55\u548c\u5fae\u8c03\u63d0\u5347\u6a21\u578b\u80fd\u529b\u3002", "upvotes": 1, "what_it_is": "\u4ece\u8bcd\u5178\u548c\u4f1a\u8bdd\u624b\u518c\u63d0\u53d6\u57c3\u6587\u8bed\u2014\u4fc4\u8bed\u6761\u76ee\uff0c\u5408\u6210\u591a\u4efb\u52a1\u8bad\u7ec3\u6570\u636e\u5e76\u6784\u5efa\u89c6\u89c9\u95ee\u7b54\u96c6\u3002\u901a\u8fc7\u4e09\u6b65\u5206\u8bcd\u5668\u6269\u5c55\u53caLoRA\u5fae\u8c03\uff0c\u9002\u914dQwen3-VL-4B\u3002", "why_notable": "\u9996\u6b21\u4e3a\u57c3\u6587\u8bed\u63d0\u4f9b\u6587\u672c\u4e0e\u591a\u6a21\u6001\u6570\u636e\u8d44\u6e90\uff0c\u5e76\u5f00\u653e\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u6d41\u7a0b\uff0c\u4e3a\u6fd2\u5371\u9ecf\u7740\u8bed\u7684\u6a21\u578b\u9002\u914d\u63d0\u4f9b\u53ef\u590d\u7528\u8def\u5f84\u3002"}, {"abstract": "Tools for interpreting the internal representations of Large Language Models (LLMs) increasingly rely on LLMs themselves to both generate and evaluate explanations, creating a self-referential automated interpretation process with minimal human oversight. This automation raises significant reliability concerns, which are exacerbated by the absence of ground truth. In practice, it is difficult to validate explanations or to attribute interpretability failures to their source -- whether they originate from the tool\u0027s extracted representations or from the LLM used in the process. To address these challenges, we present DECODE, a visual analytics system that reintroduces human oversight into the automated interpretation process. Our approach decomposes the diagnostic workflow into three progressive stages, isolating failure sources ranging from structural defects to explanation-level misalignments. Drawing inspiration from inter-coder consensus in qualitative analysis, we utilize consensus among independently generated explanations and their evaluation metrics as a proxy for reliability. To further scale human inspection, we employ a three-phase active seeding protocol that strategically recommends high-priority instances for manual review. Finally, we demonstrate the effectiveness of our approach through a case study on 16,384 Sparse Autoencoder features, showing that it can efficiently identify and attribute interpretability failures at scale.", "arxiv_id": "2611.17856", "arxiv_url": "https://arxiv.org/abs/2611.17856", "authors": ["Dohyun Kim", "Jaeung Lee", "Donghee Hong", "Jaemin Jo"], "brief": "DECODE\u662f\u9762\u5411\u5927\u6a21\u578b\u81ea\u52a8\u89e3\u91ca\u6d41\u7a0b\u7684\u53ef\u89c6\u5206\u6790\u7cfb\u7edf\u3002\u5b83\u5206\u9636\u6bb5\u6392\u67e5\u7ed3\u6784\u7f3a\u9677\u4e0e\u89e3\u91ca\u9519\u4f4d\uff0c\u4ee5\u72ec\u7acb\u89e3\u91ca\u95f4\u7684\u5171\u8bc6\u4f30\u8ba1\u53ef\u9760\u6027\uff0c\u5e76\u4f18\u5148\u63a8\u8350\u4eba\u5de5\u590d\u6838\u5b9e\u4f8b\u3002", "categories": ["cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17856", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e09\u9636\u6bb5\u8bca\u65ad\u6d41\u7a0b\u9010\u6b65\u9694\u79bb\u4e0d\u540c\u5931\u6548\u6765\u6e90", "\u7ed3\u5408\u72ec\u7acb\u89e3\u91ca\u53ca\u8bc4\u4f30\u6307\u6807\u7684\u5171\u8bc6\u4f30\u8ba1\u53ef\u9760\u6027", "\u4e09\u9636\u6bb5\u4e3b\u52a8\u9009\u6837\u534f\u8bae\u7528\u4e8e16,384\u4e2aSAE\u7279\u5f81\u6848\u4f8b"], "keywords": ["\u5927\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u53ef\u89c6\u5206\u6790", "\u4eba\u5de5\u76d1\u7763"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17856v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DECODE: Diagnosing Interpretability Failures in Automated Interpretation Process", "tldr": "\u901a\u8fc7\u4eba\u5de5\u76d1\u7763\u4e0e\u89e3\u91ca\u5171\u8bc6\uff0c\u5b9a\u4f4d\u5927\u6a21\u578b\u81ea\u52a8\u89e3\u91ca\u6d41\u7a0b\u4e2d\u7684\u5931\u6548\u6765\u6e90\u3002", "upvotes": 0, "what_it_is": "DECODE\u662f\u9762\u5411\u5927\u6a21\u578b\u81ea\u52a8\u89e3\u91ca\u6d41\u7a0b\u7684\u53ef\u89c6\u5206\u6790\u7cfb\u7edf\u3002\u5b83\u5206\u9636\u6bb5\u6392\u67e5\u7ed3\u6784\u7f3a\u9677\u4e0e\u89e3\u91ca\u9519\u4f4d\uff0c\u4ee5\u72ec\u7acb\u89e3\u91ca\u95f4\u7684\u5171\u8bc6\u4f30\u8ba1\u53ef\u9760\u6027\uff0c\u5e76\u4f18\u5148\u63a8\u8350\u4eba\u5de5\u590d\u6838\u5b9e\u4f8b\u3002", "why_notable": "\u5c06\u4eba\u5de5\u590d\u6838\u91cd\u65b0\u5f15\u5165\u6a21\u578b\u751f\u6210\u5e76\u8bc4\u4f30\u89e3\u91ca\u7684\u95ed\u73af\uff0c\u5e2e\u52a9\u533a\u5206\u8868\u5f81\u63d0\u53d6\u4e0e\u89e3\u91ca\u73af\u8282\u7684\u95ee\u9898\uff0c\u4e3a\u5927\u89c4\u6a21\u53ef\u89e3\u91ca\u6027\u5de5\u5177\u63d0\u4f9b\u8bca\u65ad\u8def\u5f84\u3002"}, {"abstract": "Long-horizon agents increasingly serve as persistent personal assistants across modern web platforms, managing schedules, applications, and multi-step plans over weeks or months. Users often return to an ongoing conversation after a long conversational hiatus, while earlier bookings and preparation notes stay on record. During this hiatus, scheduled dates may pass even though the retained records remain unchanged and event outcomes go unrecorded. Existing evaluations of long-horizon agents focus on fact retention and explicit state updates. Whether agents perceive the passage of time and adapt their advice accordingly therefore remains unknown. We frame this ability as temporal state perception and use, which means perceiving the current time and applying it when interpreting dated records. To study it, we design session-rekindling tasks that keep the earlier conversation fixed and vary only the follow-up date and the way temporal information reaches the agent. Experiments across five model routes and five temporal-information conditions show that agents can obtain the current time but often fail to use it. They reliably query the clock and even note in their reasoning that the scheduled date has passed, yet many still tell users to prepare for the expired event. Supplying explicit temporal context reduces this error, and providing the computed date relation removes it entirely. Keeping up with time therefore depends on turning perceived time into updated plans. Based on these findings, we design a session-rekindling benchmark that provides temporal-awareness guidance for designing long-horizon agents. The code can be found at https://github.com/Adoreu2/session-rekindling-benchmark.", "arxiv_id": "2611.17806", "arxiv_url": "https://arxiv.org/abs/2611.17806", "authors": ["Hongguan Su", "Ming Wang", "Shun Zhang", "Yifan Wang", "Rong Yin", "Zhiming Ma", "Mengzheng Yang", "Peng Chen"], "brief": "\u7814\u7a76\u4ee5\u4f1a\u8bdd\u91cd\u542f\u4efb\u52a1\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u65f6\u95f4\u9002\u5e94\u80fd\u529b\uff1a\u56fa\u5b9a\u5386\u53f2\u5bf9\u8bdd\uff0c\u4ec5\u6539\u53d8\u7528\u6237\u56de\u8bbf\u65e5\u671f\u548c\u65f6\u95f4\u4fe1\u606f\u7684\u4f20\u5165\u65b9\u5f0f\uff0c\u68c0\u9a8c\u5176\u80fd\u5426\u636e\u6b64\u91cd\u65b0\u89e3\u91ca\u65e7\u8bb0\u5f55\u5e76\u8c03\u6574\u5efa\u8bae\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17806", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8986\u76d65\u79cd\u6a21\u578b\u8def\u7ebf\u4e0e5\u79cd\u65f6\u95f4\u4fe1\u606f\u6761\u4ef6", "\u667a\u80fd\u4f53\u5373\u4f7f\u786e\u8ba4\u65e5\u671f\u5df2\u8fc7\uff0c\u4ecd\u53ef\u80fd\u5efa\u8bae\u51c6\u5907\u8fc7\u671f\u4e8b\u4ef6", "\u663e\u5f0f\u65f6\u95f4\u4e0a\u4e0b\u6587\u51cf\u5c11\u9519\u8bef\uff0c\u9884\u5148\u7b97\u597d\u7684\u65e5\u671f\u5173\u7cfb\u6d88\u9664\u9519\u8bef"], "keywords": ["\u957f\u671f\u667a\u80fd\u4f53", "\u65f6\u95f4\u63a8\u7406", "\u667a\u80fd\u4f53\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17806v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can Agents Keep Up with Time? An Empirical Analysis of Temporal Adaptation After a Conversational Hiatus", "tldr": "\u957f\u671f\u52a9\u624b\u80fd\u8bfb\u61c2\u5f53\u524d\u65f6\u95f4\uff0c\u5374\u5e38\u65e0\u6cd5\u636e\u6b64\u66f4\u65b0\u8ba1\u5212\uff0c\u4ecd\u5efa\u8bae\u7528\u6237\u51c6\u5907\u5df2\u8fc7\u671f\u4e8b\u4ef6\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u4ee5\u4f1a\u8bdd\u91cd\u542f\u4efb\u52a1\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u65f6\u95f4\u9002\u5e94\u80fd\u529b\uff1a\u56fa\u5b9a\u5386\u53f2\u5bf9\u8bdd\uff0c\u4ec5\u6539\u53d8\u7528\u6237\u56de\u8bbf\u65e5\u671f\u548c\u65f6\u95f4\u4fe1\u606f\u7684\u4f20\u5165\u65b9\u5f0f\uff0c\u68c0\u9a8c\u5176\u80fd\u5426\u636e\u6b64\u91cd\u65b0\u89e3\u91ca\u65e7\u8bb0\u5f55\u5e76\u8c03\u6574\u5efa\u8bae\u3002", "why_notable": "\u63ed\u793a\u957f\u671f\u667a\u80fd\u4f53\u7684\u8bb0\u5fc6\u4fdd\u7559\u4e0e\u65f6\u95f4\u9002\u5e94\u5e76\u975e\u540c\u4e00\u80fd\u529b\uff0c\u5e76\u63d0\u4f9b\u4f1a\u8bdd\u91cd\u542f\u57fa\u51c6\uff0c\u5e2e\u52a9\u8bc4\u4f30\u52a9\u624b\u80fd\u5426\u5c06\u65f6\u95f4\u611f\u77e5\u8f6c\u5316\u4e3a\u8ba1\u5212\u66f4\u65b0\u3002"}, {"abstract": "When a language model accepts a false correction in a factual discussion, its next answer can depend on how the conversation continues. We introduce Knowledge Answer Divergence (KAD), an event-conditioned evaluation protocol that distinguishes initial false-answer adoption from subsequent persistence, recovery, and abstention. KAD freezes the conversation at the first explicit adoption of a designated false target and branches independent probes from that exact history. This enables matched comparisons of post-adoption behavior and history-management interventions that a single susceptibility score cannot capture. We evaluate eight local checkpoint conditions and six hosted endpoints, alongside an audited 300-question rerun. In corrected Llama 3.2 Instruct 3B controls, a neutral-history branch yields 42/46 correct responses, compared with 16/46 under full history. A matched cue-placement control changes false adoption by 27.3 percentage points in Qwen 3.5 4B. Twelve independently authored pressure templates demonstrate substantial sensitivity to wording. Together, these findings demonstrate the utility of KAD for evaluating factual reliability beyond initial susceptibility, enabling systematic comparisons of false-answer persistence, recovery conditions and conversational interventions.", "arxiv_id": "2611.17763", "arxiv_url": "https://arxiv.org/abs/2611.17763", "authors": ["Sujato Dutta", "Prithviraj Patil", "Chandrajit Bajaj"], "brief": "\u63d0\u51fa\u4e8b\u4ef6\u6761\u4ef6\u5316\u8bc4\u4f30\u534f\u8baeKAD\uff0c\u5728\u6a21\u578b\u9996\u6b21\u660e\u786e\u91c7\u7eb3\u9519\u8bef\u7b54\u6848\u65f6\u51bb\u7ed3\u5bf9\u8bdd\uff0c\u518d\u4ece\u540c\u4e00\u5386\u53f2\u5206\u652f\u6d4b\u8bd5\uff0c\u533a\u5206\u9519\u8bef\u6301\u7eed\u3001\u4e8b\u5b9e\u6062\u590d\u4e0e\u62d2\u7b54\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17763", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bc4\u6d4b8\u79cd\u672c\u5730\u68c0\u67e5\u70b9\u6761\u4ef6\u30016\u4e2a\u6258\u7ba1\u7aef\u70b9\uff0c\u590d\u6838300\u9898", "Llama 3.2 3B\u4e2d\u6027\u5386\u53f2\u7b54\u5bf942/46\uff0c\u5b8c\u6574\u5386\u53f216/46", "Qwen 3.5 4B\u63d0\u793a\u4f4d\u7f6e\u4f7f\u9519\u8bef\u91c7\u7eb3\u7387\u76f8\u5dee27.3\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u4e8b\u5b9e\u53ef\u9760\u6027", "\u5bf9\u8bdd\u5386\u53f2", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17763v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Knowledge After Collapse: Context and Wording Shape Factual Accessibility in Language Models", "tldr": "\u6a21\u578b\u63a5\u53d7\u9519\u8bef\u7ea0\u6b63\u540e\uff0c\u4e8b\u5b9e\u80fd\u5426\u6062\u590d\u53d6\u51b3\u4e8e\u540e\u7eed\u5bf9\u8bdd\u5386\u53f2\u4e0e\u63aa\u8f9e", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e8b\u4ef6\u6761\u4ef6\u5316\u8bc4\u4f30\u534f\u8baeKAD\uff0c\u5728\u6a21\u578b\u9996\u6b21\u660e\u786e\u91c7\u7eb3\u9519\u8bef\u7b54\u6848\u65f6\u51bb\u7ed3\u5bf9\u8bdd\uff0c\u518d\u4ece\u540c\u4e00\u5386\u53f2\u5206\u652f\u6d4b\u8bd5\uff0c\u533a\u5206\u9519\u8bef\u6301\u7eed\u3001\u4e8b\u5b9e\u6062\u590d\u4e0e\u62d2\u7b54\u3002", "why_notable": "\u5c06\u4e8b\u5b9e\u53ef\u9760\u6027\u8bc4\u4f30\u4ece\u9996\u6b21\u53d7\u8bef\u5bfc\u6269\u5c55\u5230\u540e\u7eed\u6062\u590d\uff0c\u63ed\u793a\u5bf9\u8bdd\u5386\u53f2\u4e0e\u63aa\u8f9e\u7684\u91cd\u8981\u5f71\u54cd\uff0c\u4e3a\u6bd4\u8f83\u5386\u53f2\u7ba1\u7406\u5e72\u9884\u63d0\u4f9b\u53d7\u63a7\u65b9\u6cd5\u3002"}, {"abstract": "Long-horizon business workflows fail in two ways: errors accumulate as a chain of activities lengthens, and the knowledge an activity needs is written in a different vocabulary from the user\u0027s request. We study whether such workflows can be made reliable without changing the language model. Our method keeps the backbone fixed and moves the workflow definition, state and domain knowledge into versioned control assets outside the model. A state machine and machine-checkable acceptance gates enforce these assets during execution; an independent auditor grades the resulting trace. The assets are updated only after a regression check and human approval .We evaluate the method on three deployed workflows exceeding 200 steps. On Domain A, a 120-case end-to-end evaluation set shows unattended completion rising from 50% to 100%, retrieval recall from 56% to 91.67%, and end-to-end latency dropping from 440 to 159 minutes, with scenario-analysis recall rising from 45% to 93%. Two other domains were taken over by teams that did not write the assets, one in four days and one in seven days. A controlled ablation separates the two failure sources. The code is available at https://github.com/ZTE-AICloud/Co-Sight/tree/master/Co-Sight%20Harness.", "arxiv_id": "2611.17696", "arxiv_url": "https://arxiv.org/abs/2611.17696", "authors": ["Luyao Wang", "Xijun Zhu", "Zhaohui Hao", "Xiwen Zhang", "Xingyu Wen", "Weishan Li", "Yuyang Liao", "Yanqin Gao", "Yongsheng Du", "Lingjun Huang", "Shaowei Zhao", "Gang Li", "Qifan Yu", "Baoli Wang"], "brief": "\u65b9\u6cd5\u56fa\u5b9a\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u6d41\u7a0b\u5b9a\u4e49\u3001\u72b6\u6001\u548c\u9886\u57df\u77e5\u8bc6\u5916\u7f6e\u4e3a\u7248\u672c\u5316\u63a7\u5236\u8d44\u4ea7\u3002\u6267\u884c\u65f6\u7531\u72b6\u6001\u673a\u4e0e\u53ef\u673a\u5668\u68c0\u67e5\u7684\u9a8c\u6536\u5173\u5361\u7ea6\u675f\uff0c\u5e76\u7531\u72ec\u7acb\u5ba1\u8ba1\u5668\u8bc4\u4f30\u8f68\u8ff9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17696", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u63a7\u5236\u8d44\u4ea7\u66f4\u65b0\u987b\u901a\u8fc7\u56de\u5f52\u68c0\u67e5\u4e0e\u4eba\u5de5\u6279\u51c6", "\u4e09\u4e2a\u5df2\u90e8\u7f72\u6d41\u7a0b\u5747\u8d85200\u6b65\uff0c\u4e3b\u57df\u8bc4\u6d4b\u542b120\u4f8b", "\u65e0\u4eba\u503c\u5b88\u5b8c\u6210\u738750%\u2192100%\uff0c\u8017\u65f6440\u2192159\u5206\u949f"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u4f5c\u6d41", "\u72b6\u6001\u673a", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17696v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Co-Sight Harness: Externalized Control Assets and Deterministic Enforcement for Long-Horizon Business Agents", "tldr": "\u5c06\u6d41\u7a0b\u4e0e\u77e5\u8bc6\u5916\u7f6e\u4e3a\u53d7\u63a7\u8d44\u4ea7\uff0c\u65e0\u9700\u6539\u52a8\u6a21\u578b\u5373\u53ef\u63d0\u5347\u957f\u94fe\u4e1a\u52a1\u667a\u80fd\u4f53\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": "\u65b9\u6cd5\u56fa\u5b9a\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u6d41\u7a0b\u5b9a\u4e49\u3001\u72b6\u6001\u548c\u9886\u57df\u77e5\u8bc6\u5916\u7f6e\u4e3a\u7248\u672c\u5316\u63a7\u5236\u8d44\u4ea7\u3002\u6267\u884c\u65f6\u7531\u72b6\u6001\u673a\u4e0e\u53ef\u673a\u5668\u68c0\u67e5\u7684\u9a8c\u6536\u5173\u5361\u7ea6\u675f\uff0c\u5e76\u7531\u72ec\u7acb\u5ba1\u8ba1\u5668\u8bc4\u4f30\u8f68\u8ff9\u3002", "why_notable": "\u5c06\u957f\u6d41\u7a0b\u53ef\u9760\u6027\u8f6c\u5411\u53ef\u9a8c\u8bc1\u7684\u5916\u90e8\u63a7\u5236\uff0c\u63d0\u4f9b\u4e0d\u6539\u6a21\u578b\u7684\u5de5\u7a0b\u8def\u5f84\uff1b\u8de8\u56e2\u961f\u56db\u5929\u4e0e\u4e03\u5929\u63a5\u7ba1\u4e5f\u663e\u793a\u4e86\u8d44\u4ea7\u5316\u4ea4\u4ed8\u7684\u4ef7\u503c\u3002"}, {"abstract": "Complete game generation requires agents to coordinate rules, interactions, states, and presentation over a long development process. A single aggregate score obscures which capabilities are implemented and which requirements remain unmet. We present OCTAVE, a benchmark for complete HTML5 game generation organized around eight Capability Dimensions, with 180 tasks and 1,800 Evaluation Requirements drawn from real player requests, commercial-mechanics reconstruction, and human expert design. It covers PC Web, Mobile Web, 2D, and 3D. Requirements distinguish Completeness, assessing publicly specified core implementation, from Richness, assessing hidden, deeper system relationships. Static source-code judgments provide requirement-level diagnosis across capabilities and task conditions. Evaluation of 11 model-harness combinations yields 33.2% Completeness and 32.5% Richness; 19.9% of generation records are static gate failures or missing artifacts. Excluding same-model self-evaluation, even the best combination remains below 50% on both public and hidden requirements. Richness is not harder than Completeness under every task condition. Systems perform relatively better on Core Rules and Numerical Design, while AI/NPC and Feedback and Game Feel show more prominent gaps. Requirement difficulty offers coarse stratification but is only weakly negatively correlated with pass rates. A limited human cross-check finds that requirements judged satisfied by humans but failed by the automated evaluator are the main direction of disagreement. OCTAVE extends evaluation beyond aggregate scores to diagnosis localized by requirement, capability, and task condition.", "arxiv_id": "2611.17681", "arxiv_url": "https://arxiv.org/abs/2611.17681", "authors": ["Kehang Li", "Xinlan Xu", "Yulin Jin", "Heng Cao", "Xuchen Li", "Houxian Ren", "Zihao Ji", "Qiang Luo", "Yadong Mao", "Qilin He", "Jian Zhang", "Jian Zhao", "Zihao Wang"], "brief": "OCTAVE\u6784\u5efa\u5b8c\u6574HTML5\u6e38\u620f\u751f\u6210\u57fa\u51c6\uff0c\u5c06\u4efb\u52a1\u62c6\u4e3a\u516b\u7c7b\u80fd\u529b\u4e0e\u9010\u9879\u9700\u6c42\u3002\u901a\u8fc7\u9759\u6001\u6e90\u7801\u5224\u65ad\uff0c\u5206\u522b\u8861\u91cf\u516c\u5f00\u6838\u5fc3\u529f\u80fd\u7684\u5b8c\u6574\u6027\u4e0e\u9690\u85cf\u7cfb\u7edf\u5173\u7cfb\u7684\u4e30\u5bcc\u6027\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17681", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["180\u9879\u4efb\u52a1\u30011800\u6761\u9700\u6c42\uff0c\u8986\u76d6\u7f51\u9875\u7aef2D\u4e0e3D\u6e38\u620f", "11\u79cd\u6a21\u578b\u4e0e\u8fd0\u884c\u6846\u67b6\u7ec4\u5408\uff0c\u5b8c\u6574\u602733.2%\u3001\u4e30\u5bcc\u602732.5%", "AI/NPC\u3001\u53cd\u9988\u4e0e\u6e38\u620f\u624b\u611f\u77ed\u677f\u7a81\u51fa\uff0c19.9%\u8bb0\u5f55\u95e8\u68c0\u5931\u8d25\u6216\u7f3a\u5931\u4ea7\u7269"], "keywords": ["\u6e38\u620f\u751f\u6210", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17681v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "OCTAVE: A Capability-Resolved Benchmark for End-to-End HTML5 Game Generation", "tldr": "\u901a\u8fc7\u516b\u7ef4\u80fd\u529b\u4e0e\u9010\u9879\u9700\u6c42\u8bc4\u6d4b\uff0c\u63ed\u793a\u7aef\u5230\u7aef\u6e38\u620f\u751f\u6210\u7684\u5177\u4f53\u77ed\u677f\u3002", "upvotes": 0, "what_it_is": "OCTAVE\u6784\u5efa\u5b8c\u6574HTML5\u6e38\u620f\u751f\u6210\u57fa\u51c6\uff0c\u5c06\u4efb\u52a1\u62c6\u4e3a\u516b\u7c7b\u80fd\u529b\u4e0e\u9010\u9879\u9700\u6c42\u3002\u901a\u8fc7\u9759\u6001\u6e90\u7801\u5224\u65ad\uff0c\u5206\u522b\u8861\u91cf\u516c\u5f00\u6838\u5fc3\u529f\u80fd\u7684\u5b8c\u6574\u6027\u4e0e\u9690\u85cf\u7cfb\u7edf\u5173\u7cfb\u7684\u4e30\u5bcc\u6027\u3002", "why_notable": "\u5c06\u5355\u4e00\u603b\u5206\u8f6c\u4e3a\u9700\u6c42\u4e0e\u80fd\u529b\u7ea7\u8bca\u65ad\uff0c\u66f4\u4fbf\u4e8e\u5b9a\u4f4d\u751f\u6210\u7cfb\u7edf\u7684\u7f3a\u9677\uff1b\u6392\u9664\u540c\u6a21\u578b\u81ea\u8bc4\u540e\uff0c\u6700\u4f73\u7ec4\u5408\u4e24\u7c7b\u6307\u6807\u4ecd\u5747\u4f4e\u4e8e50%\u3002"}, {"abstract": "Scaling quantum computing toward practical quantum advantage is currently limited by the efficiency of circuits that operate on information encoded by quantum error-correcting codes. The full stack of quantum computing encompasses several tasks: preparation of logical code states, implementation of logical gates, logical routines on encoded qubits, etc. Yet, these circuits are largely designed by hand for individual cases, with some recent works incorporating machine learning for certain aspects. We formulate this problem as agentic evolutionary program synthesis, wherein a large language model, leveraging its pretraining knowledge and tool-use proficiency, and guided by a circuit verifier, evolves a program that defines a Clifford circuit for a wide range of curated tasks such as logical state preparation, logical gate design, and logical routines such as code-switching, code growth, etc. Our approach consistently finds fault-tolerant circuits for all of these tasks, each verified by an exhaustive check over faults.", "arxiv_id": "2611.18504", "arxiv_url": "https://arxiv.org/abs/2611.18504", "authors": ["Aritra Lahiri", "Florian Marquardt"], "brief": "\u5c06\u5bb9\u9519\u91cf\u5b50\u7535\u8def\u8bbe\u8ba1\u8f6c\u5316\u4e3a\u667a\u80fd\u4f53\u9a71\u52a8\u7684\u6f14\u5316\u7a0b\u5e8f\u5408\u6210\uff0c\u5229\u7528\u5927\u8bed\u8a00\u6a21\u578b\u4e0e\u9a8c\u8bc1\u5668\uff0c\u5728\u903b\u8f91\u6001\u5236\u5907\u3001\u903b\u8f91\u95e8\u53ca\u7f16\u7801\u5207\u6362\u7b49\u4efb\u52a1\u4e2d\u5747\u627e\u5230\u7ecf\u6545\u969c\u7a77\u4e3e\u9a8c\u8bc1\u7684\u5bb9\u9519\u7535\u8def\u3002", "categories": ["quant-ph", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18504", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5bb9\u9519\u91cf\u5b50\u8ba1\u7b97", "\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u5408\u6210", "\u91cf\u5b50\u7ea0\u9519"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18504v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic AI for Discovering Fault-Tolerant Quantum Circuits", "tldr": "\u5c06\u5bb9\u9519\u91cf\u5b50\u7535\u8def\u8bbe\u8ba1\u8f6c\u5316\u4e3a\u667a\u80fd\u4f53\u9a71\u52a8\u7684\u6f14\u5316\u7a0b\u5e8f\u5408\u6210\uff0c\u5229\u7528\u5927\u8bed\u8a00\u6a21\u578b\u4e0e\u9a8c\u8bc1\u5668\uff0c\u5728\u903b\u8f91\u6001\u5236\u5907\u3001\u903b\u8f91\u95e8\u53ca\u7f16\u7801\u5207\u6362\u7b49\u4efb\u52a1\u4e2d\u5747\u627e\u5230\u7ecf\u6545\u969c\u7a77\u4e3e\u9a8c\u8bc1\u7684\u5bb9\u9519\u7535\u8def\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Small language models are attractive for local, low-cost, and privacy-sensitive deployment, but they remain unreliable on mathematical reasoning tasks that require decomposition, exact computation, tool use, and verification. We introduce \\textbf{ARCHER}: \\textbf{A}ction-trace \\textbf{R}einforcement for \\textbf{C}alculator-grounded \\textbf{H}ierarchical \\textbf{E}xecutable \\textbf{R}easoning, a two-stage framework for training small language models (SLMs) to produce executable and auditable reasoning trajectories. In the first stage, ARCHER compiles free-form chain-of-thought rationales into typed action traces containing reasoning steps, calculator calls, deterministic runtime observations, verification actions, and final answers. This shifts the supervision target from imitating explanatory text to learning a tool-grounded reasoning policy. In the second stage, ARCHER refines this policy through asymmetric hierarchical reinforcement learning, using grouped and conditionally gated trajectory rewards for answer correctness, tool grounding, process discipline, and trace alignment. Across five standard sub-10B backbones, ARCHER improves over the strongest tool-augmented baseline by 5.51 percentage points on macro-average across benchmark accuracies, including gains of 8.95 points on MATH-500 and 5.33 and 5.34 points on AIME-2024 and AIME-2025. Evaluations on two additional reasoning-specialized 7B backbones further show that executable grounding remains beneficial after reasoning-focused reinforcement learning or distillation. These results demonstrate that executable supervision and reward-guided behavioral refinement provide a general and effective training paradigm for compact mathematical reasoners.", "arxiv_id": "2611.18494", "arxiv_url": "https://arxiv.org/abs/2611.18494", "authors": ["Dhruv Dixit", "Khushi Patel", "Congcong Xu", "Min Song"], "brief": "ARCHER\u5c06\u601d\u7ef4\u94fe\u8f6c\u4e3a\u542b\u8ba1\u7b97\u5668\u8c03\u7528\u548c\u9a8c\u8bc1\u7684\u53ef\u6267\u884c\u8f68\u8ff9\uff0c\u518d\u7528\u5206\u5c42\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5c0f\u6a21\u578b\uff0c\u4e94\u79cd\u9aa8\u5e72\u7684\u6570\u5b66\u57fa\u51c6\u5e73\u5747\u51c6\u786e\u7387\u8f83\u6700\u5f3a\u5de5\u5177\u589e\u5f3a\u57fa\u7ebf\u63d0\u9ad85.51\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18494", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5c0f\u8bed\u8a00\u6a21\u578b", "\u6570\u5b66\u63a8\u7406", "\u5de5\u5177\u8c03\u7528", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18494v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ARCHER: From Rationale Imitation to Executable Reasoning in Small Language Models", "tldr": "ARCHER\u5c06\u601d\u7ef4\u94fe\u8f6c\u4e3a\u542b\u8ba1\u7b97\u5668\u8c03\u7528\u548c\u9a8c\u8bc1\u7684\u53ef\u6267\u884c\u8f68\u8ff9\uff0c\u518d\u7528\u5206\u5c42\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5c0f\u6a21\u578b\uff0c\u4e94\u79cd\u9aa8\u5e72\u7684\u6570\u5b66\u57fa\u51c6\u5e73\u5747\u51c6\u786e\u7387\u8f83\u6700\u5f3a\u5de5\u5177\u589e\u5f3a\u57fa\u7ebf\u63d0\u9ad85.51\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous trading agents need controls that prevent problematic orders without making legitimate tasks impractical. We study this aspect of agentic compliance with TradeGauntlet, a replayable limit-order-book simulator that separates detection, prevention, and execution cost. In 1,680 simulated sessions with Claude Haiku 5.5 and Sonnet 5.5, all conduct alerts were self-matches. Gates eliminated those alerts by rejecting self-crossing orders, while the aggregate-gate condition reduced Sonnet\u0027s two-sided fills by about 15%. A conduct reminder reduced Sonnet\u0027s alert rate but reduced Haiku\u0027s fills without a detectable alert benefit. These results show why zero alerts alone do not establish an agent\u0027s compliance. Scripted probes and two search methods test weaknesses beyond those observed in the LLM runs. The searches find split-order schedules that evade the implemented conduct rules; a learned baseline catches all 2,400 tested searched episodes but also flags 15% of a large maker\u0027s sessions. Aggregate caps reduce the response-dependent gain unevenly, with smaller reductions when only near-touch depth affects prices. A response fitted to five Nasdaq stocks and a separate ABIDES experiment expose the dependence of these estimates on market assumptions. A distinct adversarial prompt elicited refusals from Sonnet in all 240 rounds, yielding no candidate strategies to evaluate. TradeGauntlet provides reproducible tests of controls around trading agents; the experiments do not establish legal compliance or real-market detection accuracy.", "arxiv_id": "2611.18493", "arxiv_url": "https://arxiv.org/abs/2611.18493", "authors": ["Sandip Nandi", "Aishwarya Bose", "Apurba Bose", "Soovadeep Bakshi"], "brief": "\u63d0\u51fa\u53ef\u590d\u73b0\u4ea4\u6613\u6a21\u62df\u6846\u67b6\uff0c\u5206\u79bb\u8bc4\u4f30\u81ea\u4e3b\u4ea4\u6613\u4ee3\u7406\u7684\u8fdd\u89c4\u68c0\u6d4b\u3001\u9632\u8303\u4e0e\u6267\u884c\u6210\u672c\uff1b\u5b9e\u9a8c\u53d1\u73b0\u62e6\u622a\u53ef\u6d88\u9664\u81ea\u6210\u4ea4\u8b66\u62a5\uff0c\u5374\u635f\u5bb3\u6210\u4ea4\uff0c\u4e14\u62c6\u5355\u4ecd\u80fd\u7ed5\u8fc7\u89c4\u5219\u3002", "categories": ["cs.MA", "cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18493", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u4e3b\u667a\u80fd\u4f53", "\u7b97\u6cd5\u4ea4\u6613", "\u5408\u89c4\u8bc4\u4f30", "\u5bf9\u6297\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18493v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TradeGauntlet: Evaluating Compliance Controls for Autonomous Trading Agents", "tldr": "\u63d0\u51fa\u53ef\u590d\u73b0\u4ea4\u6613\u6a21\u62df\u6846\u67b6\uff0c\u5206\u79bb\u8bc4\u4f30\u81ea\u4e3b\u4ea4\u6613\u4ee3\u7406\u7684\u8fdd\u89c4\u68c0\u6d4b\u3001\u9632\u8303\u4e0e\u6267\u884c\u6210\u672c\uff1b\u5b9e\u9a8c\u53d1\u73b0\u62e6\u622a\u53ef\u6d88\u9664\u81ea\u6210\u4ea4\u8b66\u62a5\uff0c\u5374\u635f\u5bb3\u6210\u4ea4\uff0c\u4e14\u62c6\u5355\u4ecd\u80fd\u7ed5\u8fc7\u89c4\u5219\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI-enabled remote patient monitoring is evolving beyond passive data collection toward agentic AI systems that interpret patient states, coordinate care, and initiate action across domestic and clinical settings. This structured scoping review finds that mature agentic care has not yet emerged: Most systems remain human led, while stronger decision-action coupling and embodied AI remain largely confined to prototypes and pilots. Healthcare robotics makes the transition from monitoring to action especially visible by translating AI-generated recommendations and decisions into speech, movement, prompting, physical assistance, escalation, and care coordination, making embodiment, clinical integration, human oversight, and governance fundamental design requirements. Further progress requires safe and interoperable care architectures in which intelligent components operate through clinically validated and accountable workflows. We propose agentic robotics as a future direction for supervised systems embedded in the care ecosystem, connecting AI agents and robots with clinicians, caregivers, and patients through auditable workflows that can be interrupted and remain subject to human oversight and explicit AI governance.", "arxiv_id": "2611.18484", "arxiv_url": "https://arxiv.org/abs/2611.18484", "authors": ["Ivana Ragusa", "Lorenzo Guiducci", "Filippo Cavallo"], "brief": "\u7efc\u8ff0\u8fdc\u7a0b\u60a3\u8005\u76d1\u6d4b\u5411\u667a\u80fd\u4f53\u673a\u5668\u4eba\u7167\u62a4\u7684\u6f14\u8fdb\uff0c\u53d1\u73b0\u73b0\u6709\u7cfb\u7edf\u4ecd\u4ee5\u4eba\u4e3b\u5bfc\u3001\u5177\u8eab\u884c\u52a8\u591a\u505c\u7559\u5728\u8bd5\u70b9\uff0c\u5e76\u63d0\u51fa\u9700\u4ee5\u4e34\u5e8a\u9a8c\u8bc1\u3001\u53ef\u5ba1\u8ba1\u6d41\u7a0b\u548c\u4eba\u5de5\u76d1\u7763\u652f\u6491\u843d\u5730\u3002", "categories": ["cs.RO", "cs.AI", "cs.MA", "cs.SE", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18484", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8fdc\u7a0b\u60a3\u8005\u76d1\u6d4b", "\u667a\u80fd\u4f53", "\u533b\u7597\u673a\u5668\u4eba", "\u4eba\u5de5\u667a\u80fd\u6cbb\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18484v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From AI-Enabled Remote Patient Monitoring Toward Agentic Robotics: Embodiment, Governance, and Care Integration", "tldr": "\u7efc\u8ff0\u8fdc\u7a0b\u60a3\u8005\u76d1\u6d4b\u5411\u667a\u80fd\u4f53\u673a\u5668\u4eba\u7167\u62a4\u7684\u6f14\u8fdb\uff0c\u53d1\u73b0\u73b0\u6709\u7cfb\u7edf\u4ecd\u4ee5\u4eba\u4e3b\u5bfc\u3001\u5177\u8eab\u884c\u52a8\u591a\u505c\u7559\u5728\u8bd5\u70b9\uff0c\u5e76\u63d0\u51fa\u9700\u4ee5\u4e34\u5e8a\u9a8c\u8bc1\u3001\u53ef\u5ba1\u8ba1\u6d41\u7a0b\u548c\u4eba\u5de5\u76d1\u7763\u652f\u6491\u843d\u5730\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-based verifiers are increasingly used to evaluate agent executions, but their reliability is typically measured under a single representation of the trajectory. In deployed agent systems, the same execution may be exposed through composed tools, delegation boundaries, or compacted histories, changing what execution evidence is directly observable to the verifier. It therefore remains unclear whether correct verifier judgments persist across such abstraction boundaries. We introduce Verification Transport, a reliability test that measures judgment stability under abstraction-induced changes in execution observability. We construct matched native, abstracted, and restored views of the same frozen executions while holding the task, realized trajectory, outcome, ground truth, evaluation criterion, and verifier fixed. Across four agent-evaluation benchmarks, seven verifier backbones, four verification protocols, and three abstraction boundaries, we find substantial transport failure, reaching about 31% under macro abstraction and delegation. Verification protocols exhibit distinct failure modes: direct verification more often produces incorrect verdicts, whereas evidence-grounded and deliberative protocols tend to abstain under limited observability. This suggests that lower transport failure rates do not necessarily imply greater reliability. Restoring the corresponding execution provenance recovers 85.5% of transport failures, while recovery is lower when provenance is lossy or unavailable. These results show that native-view accuracy alone is insufficient to characterize verifier reliability when execution evidence crosses abstraction boundaries.", "arxiv_id": "2611.18471", "arxiv_url": "https://arxiv.org/abs/2611.18471", "authors": ["Disha Sheshanarayana", "Sai Linisha Reddy Goli"], "brief": "\u63d0\u51fa\u9a8c\u8bc1\u8fc1\u79fb\u6d4b\u8bd5\uff0c\u8861\u91cf\u667a\u80fd\u4f53\u6267\u884c\u8bc1\u636e\u62bd\u8c61\u540e\u5224\u5b9a\u7684\u7a33\u5b9a\u6027\uff1b\u5931\u8d25\u7387\u6700\u9ad8\u7ea631%\uff0c\u6062\u590d\u6267\u884c\u6eaf\u6e90\u4fe1\u606f\u53ef\u4fee\u590d85.5%\u7684\u5931\u8d25\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18471", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u4f30", "\u9a8c\u8bc1\u53ef\u9760\u6027", "\u4fe1\u606f\u62bd\u8c61", "\u6267\u884c\u6eaf\u6e90"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18471v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Do Verifier Judgments Survive Abstraction? Measuring Verification Transport for LLM Agent Evaluation", "tldr": "\u63d0\u51fa\u9a8c\u8bc1\u8fc1\u79fb\u6d4b\u8bd5\uff0c\u8861\u91cf\u667a\u80fd\u4f53\u6267\u884c\u8bc1\u636e\u62bd\u8c61\u540e\u5224\u5b9a\u7684\u7a33\u5b9a\u6027\uff1b\u5931\u8d25\u7387\u6700\u9ad8\u7ea631%\uff0c\u6062\u590d\u6267\u884c\u6eaf\u6e90\u4fe1\u606f\u53ef\u4fee\u590d85.5%\u7684\u5931\u8d25\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Web platforms record user and item activity in relational databases whose schemas differ from platform to platform, which makes it difficult to transfer predictive models between them. Relational foundation models address this through cross-database pretraining, yet recent improvements have relied on increasingly large pretraining corpora. We ask whether a better architecture, together with features specific to the target database, can deliver comparable gains from far less pretraining data. We introduce MoREGT, a mixture-of-relational-experts graph transformer that represents both rows and cells as tokens, adds the log-ages of rows and the names of foreign-key relationships to attention, and routes cells and rows to experts by column metadata rather than by values. A label-blind LLM agent complements the model: it reads the target database\u0027s schema and column statistics and adds validated single-row derived columns, without access to labels or model scores. On 21 RelBench tasks with leave-one-database-out pretraining on six databases, the MoREGT backbone improves on the Relational Transformer pretrained on the same databases by 2.25 points of mean AUROC and 5.83 points of mean nMAE. The agent\u0027s columns raise mean AUROC from 78.45 to 79.63 and lower mean nMAE from 27.91 to 26.98, the highest means on both metrics among the compared methods, including RT-J, which pretrains on about 400 times as many databases.", "arxiv_id": "2611.18315", "arxiv_url": "https://arxiv.org/abs/2611.18315", "authors": ["Hiren Madhu", "Sukanta Ganguly", "Kiran Srinivasan", "Smita Krishnaswamy", "Rex Ying"], "brief": "\u63d0\u51fa\u5173\u7cfb\u4e13\u5bb6\u6df7\u5408\u56fe\u6a21\u578b\uff0c\u7ed3\u5408\u65e0\u6807\u7b7e\u667a\u80fd\u4f53\u751f\u6210\u6570\u636e\u5e93\u7279\u5f81\uff1b\u572821\u9879\u8de8\u5e93\u4efb\u52a1\u4e0a\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\uff0c\u5305\u62ec\u4f7f\u7528\u7ea6400\u500d\u6570\u636e\u5e93\u9884\u8bad\u7ec3\u7684\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18315", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8de8\u6570\u636e\u5e93\u6cdb\u5316", "\u6df7\u5408\u4e13\u5bb6", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18315v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Experts Across Schemas: Agent-Guided Mixture-of-Relational-Experts for Cross-Database Generalization", "tldr": "\u63d0\u51fa\u5173\u7cfb\u4e13\u5bb6\u6df7\u5408\u56fe\u6a21\u578b\uff0c\u7ed3\u5408\u65e0\u6807\u7b7e\u667a\u80fd\u4f53\u751f\u6210\u6570\u636e\u5e93\u7279\u5f81\uff1b\u572821\u9879\u8de8\u5e93\u4efb\u52a1\u4e0a\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\uff0c\u5305\u62ec\u4f7f\u7528\u7ea6400\u500d\u6570\u636e\u5e93\u9884\u8bad\u7ec3\u7684\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fast charging of lithium-ion batteries is a multi-objective control problem that requires reducing charging time and sustaining high energy throughput while suppressing accelerated degradation and safety-critical electrochemical reactions. Conventional protocols are easy to implement but have limited ability to adapt to variations in battery chemistry, operating conditions, and aging state. Model-based optimization and conventional data-driven control often require accurate models, costly iterative search, or task-specific policies. We develop a large language model (LLM)-empowered intelligent agent for adaptive battery fast-charging control. In this closed-loop framework, the agent interprets structured battery states, generates executable charging actions, observes the resulting battery response, and continuously adjusts subsequent decisions. We construct a large-scale simulation corpus with PyBaMM across five battery chemistries and 11 parameter sets and convert the resulting state-action-response trajectories into structured process data for agent training. Our two-stage strategy combines supervised fine-tuning (SFT) and Group Relative Policy Optimization (GRPO). SFT establishes battery-control semantics and feasible decision priors from simulation-derived demonstrations. GRPO aligns the agent with a multi-objective control objective covering energy throughput, degradation mitigation, and operational constraints. Closed-loop simulations show that, under matched energy-throughput requirements, the agent achieves longer cycling life than conventional charging baselines and optimization-based strategies across heterogeneous battery configurations. This study provides a simulation-grounded proof of concept for using LLM agents as sequential decision makers in battery management and takes a step toward language-model-enabled control of physical energy systems.", "arxiv_id": "2611.18140", "arxiv_url": "https://arxiv.org/abs/2611.18140", "authors": ["Joey Chan", "Haoyu Pan", "Zhen Chen", "ErShun Pan"], "brief": "\u63d0\u51fa\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u5b9e\u73b0\u7535\u6c60\u95ed\u73af\u5feb\u5145\u63a7\u5236\u3002\u4eff\u771f\u663e\u793a\uff0c\u5728\u76f8\u540c\u80fd\u91cf\u541e\u5410\u8981\u6c42\u4e0b\uff0c\u5176\u5728\u591a\u79cd\u7535\u6c60\u914d\u7f6e\u4e2d\u6bd4\u4f20\u7edf\u53ca\u4f18\u5316\u7b56\u7565\u5ef6\u957f\u5faa\u73af\u5bff\u547d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18140", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7535\u6c60\u7ba1\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u95ed\u73af\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18140v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Large Language Model-Empowered Intelligent Agent for Adaptive Fast-Charging Control of Lithium-Ion Batteries", "tldr": "\u63d0\u51fa\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u5b9e\u73b0\u7535\u6c60\u95ed\u73af\u5feb\u5145\u63a7\u5236\u3002\u4eff\u771f\u663e\u793a\uff0c\u5728\u76f8\u540c\u80fd\u91cf\u541e\u5410\u8981\u6c42\u4e0b\uff0c\u5176\u5728\u591a\u79cd\u7535\u6c60\u914d\u7f6e\u4e2d\u6bd4\u4f20\u7edf\u53ca\u4f18\u5316\u7b56\u7565\u5ef6\u957f\u5faa\u73af\u5bff\u547d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Satellite edge computing distributes mobile workloads across moving processors whose service capacity must be coordinated over time. In medium Earth orbit (MEO)--low Earth orbit (LEO) networks, periodic reports leave CPU states stale or missing, making offloading sensitive to uncertain capacity and shared-destination congestion. We propose PUMA-Former, an uncertainty-aware agentic framework for cooperative offloading under incomplete information that balances completed work, service delay, and execution cost. A MEO coordinator maintains distinct-report memory and closes the loop between available evidence, capacity estimates, allocation commands, and execution feedback. Latent-delay attention weights plausible measurement-age hypotheses, and historical innovations refine CPU estimates around the latest received report. Queue-error-aware fusion incorporates auxiliary pressure while accounting for backlog uncertainty. The inferred resource moments condition a structured Transformer allocator for joint destination, partition, bandwidth, CPU, and power decisions. Bounded risk-aware calibration then adjusts workload splits to reflect uncertainty and shared destination load. In traffic-driven development evaluation, PUMA-Former increases admitted compute-work completion by 8.62%, reduces mean modeled service delay by 34.78%, and reduces mean episode-P95 delay by 71.08% relative to ATLA-adapt. It also improves completion and normalized energy over fixed-half round-robin offloading. Service gains over the learning baselines involve higher normalized energy.", "arxiv_id": "2611.18139", "arxiv_url": "https://arxiv.org/abs/2611.18139", "authors": ["Yi Jing", "Chunxiao Jiang", "Jiawei Wang", "Jiachen Sun"], "brief": "\u63d0\u51fa\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u7684\u536b\u661f\u7f51\u7edc\u534f\u540c\u5378\u8f7d\u6846\u67b6\uff0c\u4ee5\u8d44\u6e90\u4f30\u8ba1\u548c\u98ce\u9669\u6821\u51c6\u4f18\u5316\u5206\u914d\uff1b\u8f83\u57fa\u7ebf\u5b8c\u6210\u91cf\u63d0\u9ad88.62%\u3001\u5e73\u5747\u5ef6\u8fdf\u964d\u4f4e34.78%\uff0c\u4f46\u80fd\u8017\u66f4\u9ad8\u3002", "categories": ["cs.NI", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18139", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u536b\u661f\u7f51\u7edc", "\u8fb9\u7f18\u8ba1\u7b97", "\u8ba1\u7b97\u5378\u8f7d", "\u4e0d\u786e\u5b9a\u6027\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18139v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PUMA-Former: Uncertainty-Aware Agentic Computation Offloading in MEO-LEO Satellite Networks With Incomplete Information", "tldr": "\u63d0\u51fa\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u7684\u536b\u661f\u7f51\u7edc\u534f\u540c\u5378\u8f7d\u6846\u67b6\uff0c\u4ee5\u8d44\u6e90\u4f30\u8ba1\u548c\u98ce\u9669\u6821\u51c6\u4f18\u5316\u5206\u914d\uff1b\u8f83\u57fa\u7ebf\u5b8c\u6210\u91cf\u63d0\u9ad88.62%\u3001\u5e73\u5747\u5ef6\u8fdf\u964d\u4f4e34.78%\uff0c\u4f46\u80fd\u8017\u66f4\u9ad8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Direct image-to-video diffusion models entangle pixel synthesis with implicit latent motion, precluding persistent 3D mechanical equilibrium, mid-rollout intervention, and counterfactual force control. Conversely, single-pass programmatic 3D reconstruction from an uncalibrated photograph leaves monocular depth and support clearance underconstrained, causing reconstructed scenes to interpenetrate or collapse under gravity. We present TelePhysica, a closed-loop framework that reconstructs an executable, multi-regime physical world from a single photograph to drive stateful 3D interaction and trajectory-grounded video synthesis. A vision-language coding agent synthesizes separable visual meshes and declarative physical models within a two-stage verification loop that pairs pixel-aligned silhouette critique with a zero-force gravitational equilibrium preflight. The verified world compiles into a unified solver coupling rigid bodies, articulated chains, co-dimensional cloth shells, and 3D tetrahedral elastodynamics, whose simulated rollouts condition pretrained video diffusion models through pixel-aligned structural streams. On a 100-scene single-image benchmark, closed-loop execution raises equilibrium-verified world recovery from $0\\%$ in single-pass synthesis to $81\\%$. Controlled constitutive ablations show over an order-of-magnitude larger localized corner displacement and out-of-plane pleating in finite-element cloth than in matched rigid-plate proxies. Conditioning video diffusion on simulated trajectories increases dynamic motion-mask overlap by $2{\\times}\\text{--}5{\\times}$ and preserves motion direction under counterfactual force reversals where direct image-to-video models fail.", "arxiv_id": "2611.18078", "arxiv_url": "https://arxiv.org/abs/2611.18078", "authors": ["Ruiqi Shu", "Xufeng Zhan", "Yuanzhi Liang", "Haibin Huang", "Chi Zhang", "Xuelong Li"], "brief": "TelePhysica\u7528\u7f16\u7801\u667a\u80fd\u4f53\u95ed\u73af\u91cd\u5efa\u5355\u56fe\u53ef\u4ea4\u4e92\u7269\u7406\u573a\u666f\uff0c\u5e73\u8861\u9a8c\u8bc1\u901a\u8fc7\u7387\u4ece0%\u5347\u81f381%\uff1b\u4ee5\u4eff\u771f\u8f68\u8ff9\u5f15\u5bfc\u89c6\u9891\u751f\u6210\uff0c\u8fd0\u52a8\u91cd\u53e0\u63d0\u53472\u81f35\u500d\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18078", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u7269\u7406\u4eff\u771f", "\u667a\u80fd\u4f53", "\u89c6\u9891\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18078v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TelePhysica: Agentic Reconstruction of Physically Interactive Scenes", "tldr": "TelePhysica\u7528\u7f16\u7801\u667a\u80fd\u4f53\u95ed\u73af\u91cd\u5efa\u5355\u56fe\u53ef\u4ea4\u4e92\u7269\u7406\u573a\u666f\uff0c\u5e73\u8861\u9a8c\u8bc1\u901a\u8fc7\u7387\u4ece0%\u5347\u81f381%\uff1b\u4ee5\u4eff\u771f\u8f68\u8ff9\u5f15\u5bfc\u89c6\u9891\u751f\u6210\uff0c\u8fd0\u52a8\u91cd\u53e0\u63d0\u53472\u81f35\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chinese Grammatical Error Correction (CGEC) is typically formulated as a text-to-text problem. While suitable for digital texts, this formulation falls short in real-world K-12 education, where AI-assisted corrections are expected directly on essay images, which are primarily handwritten and exhibit many irregularities. To bridge this gap, we introduce Grounded Chinese Grammatical Error Correction (G-CGEC), an image-to-grounded-edit task requiring systems to predict both corrections and their positions on essay images. We propose G-CGEC-Eval, a benchmark comprising real-world images of K-12 Chinese essays with fine-grained annotations. For evaluation, we adapt IoU-based metrics from object detection and propose a more tolerant alternative based on center-distance matching. Using this benchmark, we evaluate open-source and proprietary vision-language models under a direct single-pass setting, as well as settings with auxiliary components (OCR and character grounding) coordinated via pipelining or agentic harnessing. Results show that even top-tier proprietary models perform surprisingly poorly in the single-pass setting, while pipelining and agentic harnessing yield meaningful improvements. Notably, an error-type-based multi-agent workflow achieves the best performance, establishing it as the strongest baseline for future G-CGEC research. Through ablations and fine-grained analysis, we find the task remains far from solved, with linguistic error discovery and character-level grounding as the primary bottlenecks. This underscores the need for models that better integrate visual perception with linguistic reasoning and visual grounding.", "arxiv_id": "2611.17966", "arxiv_url": "https://arxiv.org/abs/2611.17966", "authors": ["Weiru Zhang", "Yuzhong Hong", "Junwei Bao", "Lemao Liu", "Dejing Dou"], "brief": "\u63d0\u51fa\u4e2d\u6587\u624b\u5199\u4f5c\u6587\u56fe\u50cf\u7ea0\u9519\u4e0e\u4f4d\u7f6e\u5b9a\u4f4d\u57fa\u51c6\uff0c\u53d1\u73b0\u9876\u7ea7\u6a21\u578b\u76f4\u63a5\u5904\u7406\u8868\u73b0\u8f83\u5dee\uff0c\u6309\u9519\u8bef\u7c7b\u578b\u5206\u5de5\u7684\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\u6700\u4f73\uff0c\u4f46\u9519\u8bef\u53d1\u73b0\u4e0e\u5b57\u7b26\u5b9a\u4f4d\u4ecd\u662f\u74f6\u9888\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17966", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8bed\u6cd5\u7ea0\u9519", "\u89c6\u89c9\u5b9a\u4f4d", "\u8bc4\u6d4b\u57fa\u51c6", "\u591a\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17966v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From Images to Grounded Edits: A Real-World Benchmark for Chinese Grammatical Error Correction in Handwritten Essays", "tldr": "\u63d0\u51fa\u4e2d\u6587\u624b\u5199\u4f5c\u6587\u56fe\u50cf\u7ea0\u9519\u4e0e\u4f4d\u7f6e\u5b9a\u4f4d\u57fa\u51c6\uff0c\u53d1\u73b0\u9876\u7ea7\u6a21\u578b\u76f4\u63a5\u5904\u7406\u8868\u73b0\u8f83\u5dee\uff0c\u6309\u9519\u8bef\u7c7b\u578b\u5206\u5de5\u7684\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\u6700\u4f73\uff0c\u4f46\u9519\u8bef\u53d1\u73b0\u4e0e\u5b57\u7b26\u5b9a\u4f4d\u4ecd\u662f\u74f6\u9888\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In many long-horizon settings, an agent\u0027s own choices create future constraints: committing finite capacity establishes future obligations and forecloses later opportunities. Sustaining performance therefore requires both keeping evolving plans feasible and comparing the value of resource allocations with the alternatives they displace. Recent benchmarks increasingly evaluate LLM agents in continuing operations, but give less attention to how agents keep their own commitments feasible while reassessing resource allocations as opportunities change. We introduce OutfitterBench, where agents manage an outdoor-equipment rental business for 200 days, purchasing from a 46-product catalog and handling roughly 1,100 reservation requests. Under a fixed capital ceiling, reservations and uncertain walk-in demand compete for reusable equipment whose availability changes over time. Experiments with seven frontier LLMs show that several agents underperform a simple rule-based baseline, while only the leading agent consistently surpasses it. Trajectory analysis shows that some agents apply known constraints inconsistently and make new decisions that conflict with existing commitments. Agents with more reliable fulfillment can still secure low returns from comparable commitments or delay resource reallocation. The leading agent better connects preparation with economic choices but also misses opportunities for more profitable asset use. These findings highlight limitations in sustaining coherent resource plans and reassessing their value over time. The benchmark code is publicly available at https://github.com/adminblackjack/OutfitterBench.", "arxiv_id": "2611.17933", "arxiv_url": "https://arxiv.org/abs/2611.17933", "authors": ["Jie Huang", "Yuecheng Hong", "Yao Chen", "Shengding Jiao", "Xudong Liu", "Qiang Ye"], "brief": "\u63d0\u51fa\u6237\u5916\u88c5\u5907\u79df\u8d41\u57fa\u51c6\uff0c\u8bc4\u6d4b\u667a\u80fd\u4f53\u5728200\u5929\u5185\u7684\u8d44\u6e90\u5206\u914d\u4e0e\u627f\u8bfa\u534f\u8c03\uff1b\u4e03\u4e2a\u524d\u6cbf\u6a21\u578b\u4e2d\u4ec5\u9886\u5148\u8005\u7a33\u5b9a\u8d85\u8d8a\u89c4\u5219\u57fa\u7ebf\uff0c\u66b4\u9732\u89c4\u5212\u4e00\u81f4\u6027\u4e0e\u6536\u76ca\u4f18\u5316\u4e0d\u8db3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17933", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u957f\u671f\u89c4\u5212", "\u8d44\u6e90\u5206\u914d", "\u7ea6\u675f\u534f\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17933v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "OutfitterBench: Evaluating LLM Agents on Long-Horizon Resource Allocation and Commitment Coordination", "tldr": "\u63d0\u51fa\u6237\u5916\u88c5\u5907\u79df\u8d41\u57fa\u51c6\uff0c\u8bc4\u6d4b\u667a\u80fd\u4f53\u5728200\u5929\u5185\u7684\u8d44\u6e90\u5206\u914d\u4e0e\u627f\u8bfa\u534f\u8c03\uff1b\u4e03\u4e2a\u524d\u6cbf\u6a21\u578b\u4e2d\u4ec5\u9886\u5148\u8005\u7a33\u5b9a\u8d85\u8d8a\u89c4\u5219\u57fa\u7ebf\uff0c\u66b4\u9732\u89c4\u5212\u4e00\u81f4\u6027\u4e0e\u6536\u76ca\u4f18\u5316\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In mineral exploration, verifying geological hypotheses relies on designing a variety of geochemical experiments. While large language model (LLM) agents increasingly automate downstream geoscientific data analysis, a crucial upstream capability remains largely unexplored: automated geochemical experimental design, i.e., deciding which experiments to conduct before committing to costly laboratory work. Evaluating this capability of LLM agents is difficult for two reasons. First, geochemical experiments exhibit high methodological diversity and subjectivity: to test the same hypothesis, different geologists may choose different minerals and instruments, so no single protocol can serve as the reference answer. Second, open-ended experimental plans resist representation as structured labels, which makes objective scoring difficult. To address these challenges, we introduce MineralExp, a benchmark that reformulates geochemical experimental design as a hypothesis-based experiment selection problem, i.e., a multi-label classification problem. We abstract concrete instrument names and procedural details into a shared taxonomy of 19 experimental types across five mineral-system processes: Source, Transport, Deposition, Modification, and Preservation. This taxonomy yields deterministic multi-label targets while accommodating diverse experimental protocols. Constructed from published ore-deposit literature and verified by domain experts, MineralExp comprises 277 cases and 1,572 reference experimental plans. Given a geological hypothesis and initial context, an LLM agent selects the relevant tasks and generates concrete experimental plans, which are scored by multi-label classification metrics and an LLM-as-a-Judge metric. The experimental results show that current agents generally achieve high recall but low precision, tending to propose more experiments than are necessary to test the hypothesis.", "arxiv_id": "2611.17931", "arxiv_url": "https://arxiv.org/abs/2611.17931", "authors": ["Bing Wang", "Mingyang Wang", "Yuanhang Mi", "Yue Xu", "Kaibo Su", "Li\u0027ang Xiao", "Chunguo Wu", "Changchun Li", "Ximing Li", "Kun-Feng Qiu", "Bo Yang"], "brief": "\u63d0\u51fa\u77ff\u4ea7\u52d8\u63a2\u5b9e\u9a8c\u8bbe\u8ba1\u57fa\u51c6MineralExp\uff0c\u5c06\u5f00\u653e\u5f0f\u65b9\u6848\u8f6c\u4e3a\u591a\u6807\u7b7e\u5b9e\u9a8c\u9009\u62e9\u3002\u8bc4\u6d4b\u53d1\u73b0\u73b0\u6709\u667a\u80fd\u4f53\u53ec\u56de\u9ad8\u4f46\u7cbe\u5ea6\u4f4e\uff0c\u5e38\u63d0\u51fa\u8fc7\u591a\u5b9e\u9a8c\u3002", "categories": ["cs.CL", "cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17931", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u5b9e\u9a8c\u8bbe\u8ba1", "\u77ff\u4ea7\u52d8\u63a2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17931v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MineralExp: Benchmarking LLM Agents for Experimental Design in Real-World Mineral Exploration", "tldr": "\u63d0\u51fa\u77ff\u4ea7\u52d8\u63a2\u5b9e\u9a8c\u8bbe\u8ba1\u57fa\u51c6MineralExp\uff0c\u5c06\u5f00\u653e\u5f0f\u65b9\u6848\u8f6c\u4e3a\u591a\u6807\u7b7e\u5b9e\u9a8c\u9009\u62e9\u3002\u8bc4\u6d4b\u53d1\u73b0\u73b0\u6709\u667a\u80fd\u4f53\u53ec\u56de\u9ad8\u4f46\u7cbe\u5ea6\u4f4e\uff0c\u5e38\u63d0\u51fa\u8fc7\u591a\u5b9e\u9a8c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents that execute multi-step tool calls must satisfy two objectives simultaneously: completing the user\u0027s task (utility) and conforming to domain policies and correctness constraints (safety). These objectives are in tension -- blocking an unsafe action prevents a violation but can leave the agent stranded with no principled way to recover. Existing approaches sacrifice one objective for the other. We introduce Soteria, a framework that reconciles safety and utility through verified hierarchical planning and runtime enforcement of specifications. Before execution, the agent generates a structured plan that is formally verified against the specifications prior to any tool invocation. During execution, the verified plan serves dual roles: it ensures that the agent takes specification-conformant trajectories and provides guidance when unsafe actions are blocked. Across multiple benchmarks covering a diverse range of tool-use tasks, Soteria achieves 1.7 times the average task success rate of the best baselines, with no violations of policy specifications, demonstrating that safety and utility need not be traded off.", "arxiv_id": "2611.17880", "arxiv_url": "https://arxiv.org/abs/2611.17880", "authors": ["Mike He", "Ankush Desai", "Sharad Malik", "Aarti Gupta"], "brief": "Soteria\u7ed3\u5408\u5f62\u5f0f\u5316\u9a8c\u8bc1\u7684\u5206\u5c42\u89c4\u5212\u4e0e\u8fd0\u884c\u65f6\u7ea6\u675f\uff0c\u6307\u5bfc\u667a\u80fd\u4f53\u5b89\u5168\u8c03\u7528\u5de5\u5177\u53ca\u53d7\u963b\u6062\u590d\uff1b\u591a\u9879\u57fa\u51c6\u4e2d\u4efb\u52a1\u6210\u529f\u7387\u8fbe\u6700\u4f73\u57fa\u7ebf\u76841.7\u500d\uff0c\u4e14\u65e0\u7b56\u7565\u8fdd\u89c4\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17880", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u4efb\u52a1\u89c4\u5212", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17880v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Soteria: Formally Verified Planning with Runtime Enforcement for Safe LLM Agents", "tldr": "Soteria\u7ed3\u5408\u5f62\u5f0f\u5316\u9a8c\u8bc1\u7684\u5206\u5c42\u89c4\u5212\u4e0e\u8fd0\u884c\u65f6\u7ea6\u675f\uff0c\u6307\u5bfc\u667a\u80fd\u4f53\u5b89\u5168\u8c03\u7528\u5de5\u5177\u53ca\u53d7\u963b\u6062\u590d\uff1b\u591a\u9879\u57fa\u51c6\u4e2d\u4efb\u52a1\u6210\u529f\u7387\u8fbe\u6700\u4f73\u57fa\u7ebf\u76841.7\u500d\uff0c\u4e14\u65e0\u7b56\u7565\u8fdd\u89c4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Concerns about gaming and trade secrecy, frequently invoked to justify algorithmic opacity, can also mask self-serving strategic behavior by decision-makers, who may prioritize private benefits over social welfare. We develop a principal-agent test for when algorithmic decision-making should trigger disclosure obligations even when concerns about gaming or trade secrecy exist. The test, which is anchored in decision quality, relies on two diagnostics that can be disclosed without enabling gaming or revealing trade secrets: the error profile (false positive and false negative rates, overall and for each group) and the distribution of decision outcomes across groups. These diagnostics make visible whether decision-makers align design and implementation with the public interest or instead use opacity to obscure bias, inefficiency, or strategic shirking. Strong disparities across social groups, and asymmetries in the distribution of decision errors across outcome types, should trigger rebuttable presumptions favoring further disclosure. Where ground-truth error rates are unavailable, outcome distributions across groups can support the same presumption, and a decision-maker\u0027s inability to produce an error profile is itself diagnostic. The test thus treats fairness metrics as triggers for further disclosure and extends to generative and agentic systems through analogous metrics. The framework informs differentiated disclosure regimes (staged, partial, mediated, or audience-segmented). Once such regimes are considered, the domain of justifiable algorithmic opacity is significantly narrower than commonly assumed: when gaming or trade secrecy risks are legitimate, actionable disclosures (such as training data characteristics and key system design parameters) ordinarily can be mandated without compromising innovation or enabling gaming, even for technically inscrutable algorithms.", "arxiv_id": "2611.17980", "arxiv_url": "https://arxiv.org/abs/2611.17980", "authors": ["Ignacio Cofone", "Katherine J. Strandburg"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u59d4\u6258\u4ee3\u7406\u5173\u7cfb\u7684\u7b97\u6cd5\u62ab\u9732\u68c0\u9a8c\uff0c\u4ee5\u9519\u8bef\u7387\u548c\u7fa4\u4f53\u7ed3\u679c\u5dee\u5f02\u89e6\u53d1\u8fdb\u4e00\u6b65\u62ab\u9732\uff0c\u8bba\u8bc1\u9632\u64cd\u7eb5\u4e0e\u5546\u4e1a\u79d8\u5bc6\u5e76\u4e0d\u8db3\u4ee5\u666e\u904d\u652f\u6301\u7b97\u6cd5\u4e0d\u900f\u660e\u3002", "categories": ["cs.CY", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17980", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7b97\u6cd5\u900f\u660e\u5ea6", "\u59d4\u6258\u4ee3\u7406", "\u7b97\u6cd5\u516c\u5e73", "\u4fe1\u606f\u62ab\u9732"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17980v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": ["\u4e0e com
