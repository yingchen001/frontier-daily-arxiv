puter use / agent \u76f8\u5173"], "thumbnail": null, "title": "Algorithmic Opacity as a Principal-Agent Problem", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u59d4\u6258\u4ee3\u7406\u5173\u7cfb\u7684\u7b97\u6cd5\u62ab\u9732\u68c0\u9a8c\uff0c\u4ee5\u9519\u8bef\u7387\u548c\u7fa4\u4f53\u7ed3\u679c\u5dee\u5f02\u89e6\u53d1\u8fdb\u4e00\u6b65\u62ab\u9732\uff0c\u8bba\u8bc1\u9632\u64cd\u7eb5\u4e0e\u5546\u4e1a\u79d8\u5bc6\u5e76\u4e0d\u8db3\u4ee5\u666e\u904d\u652f\u6301\u7b97\u6cd5\u4e0d\u900f\u660e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Screen history can serve as searchable visual memory for people and agents, but unlike an offline corpus, it must be encoded and indexed as each screenshot arrives. OCR-based indexing is fast but loses visual information; visual encoding takes over two seconds. Yet screens change incrementally: most pixels repeat within and across screenshots. This raises a question: do visual encoders need to recompute their representations from scratch for every new screenshot? We present StreamEmbed, a system for incremental visual embedding that exploits this redundancy. Guided solely by pixel differences, it combines spatial token pruning, which skips blocks that repeat a neighbor, with temporal KV reuse, which reuses cached keys and values for blocks unchanged across screenshots. A small learned adapter compensates for pruning and reuse to preserve fidelity to full-screenshot embeddings. On ScreenMemEval, our benchmark of 10,426 questions over 184 hours of screen histories from two humans and a computer-use agent, StreamEmbed sets a new accuracy-latency Pareto frontier on an M2 Pro GPU: it encodes up to 3.7x faster than full-screenshot encoding without sacrificing accuracy and improves accuracy over OCR-based indexing by up to 6.3 Recall@10 points at matched latency. A memory-efficient vector index stores a simulated year of screenshots in 0.13 GB of RAM. Together, these results make real-time indexing of screen history in its native visual form practical, laying a foundation for fully local visual assistants.", "arxiv_id": "2611.18516", "arxiv_url": "https://arxiv.org/abs/2611.18516", "authors": ["Dayoon Ko", "Yichuan Wang", "Soyeong Jeong", "Joseph E. Gonzalez", "Gunhee Kim", "Sewon Min"], "brief": "StreamEmbed\u5229\u7528\u50cf\u7d20\u5dee\u5f02\u8fdb\u884c\u7a7a\u95f4\u526a\u679d\u4e0e\u65f6\u5e8f\u7f13\u5b58\u590d\u7528\uff0c\u5b9e\u73b0\u622a\u56fe\u589e\u91cf\u7f16\u7801\uff1b\u4e0d\u635f\u5931\u68c0\u7d22\u7cbe\u5ea6\u4e0b\u63d0\u901f\u6700\u9ad83.7\u500d\uff0c\u63a8\u52a8\u672c\u5730\u5c4f\u5e55\u5386\u53f2\u5b9e\u65f6\u7d22\u5f15\u3002", "categories": ["cs.CV", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18516", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u68c0\u7d22", "\u589e\u91cf\u7f16\u7801", "\u7f13\u5b58\u590d\u7528", "\u5411\u91cf\u7d22\u5f15"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18516v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "StreamEmbed: Real-Time Indexing from Pixels for Screenshot Retrieval", "tldr": "StreamEmbed\u5229\u7528\u50cf\u7d20\u5dee\u5f02\u8fdb\u884c\u7a7a\u95f4\u526a\u679d\u4e0e\u65f6\u5e8f\u7f13\u5b58\u590d\u7528\uff0c\u5b9e\u73b0\u622a\u56fe\u589e\u91cf\u7f16\u7801\uff1b\u4e0d\u635f\u5931\u68c0\u7d22\u7cbe\u5ea6\u4e0b\u63d0\u901f\u6700\u9ad83.7\u500d\uff0c\u63a8\u52a8\u672c\u5730\u5c4f\u5e55\u5386\u53f2\u5b9e\u65f6\u7d22\u5f15\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent sessions may involve frequent context edits, which effectively invalidate cached KV state and force requests to wait for re-prefill before decoding. We present Callo, a disaggregated serving system that leverages invalidated KV for speculative drafts to reduce this latency, while verifying drafts against the exact KV after prefill before committing tokens. Callo makes effective use of decode resources by scheduling speculations during periods of underutilization and preempting speculations when drafts are likely to not be accepted. We evaluated Callo on a two-GPU testbed using SWE-agent sessions across three model families, observing all-request speedups of 1.05-1.19x over vLLM at moderate load. We demonstrate that these gains are also realized at scale through cluster-level simulations driven by real-world traces.", "arxiv_id": "2611.18459", "arxiv_url": "https://arxiv.org/abs/2611.18459", "authors": ["Jianjun Ou", "Matthew Lentz"], "brief": "Callo\u5229\u7528\u5931\u6548KV\u7f13\u5b58\u8fdb\u884c\u63a8\u6d4b\u89e3\u7801\uff0c\u5e76\u5728\u91cd\u65b0\u9884\u586b\u5145\u540e\u9a8c\u8bc1\uff0c\u964d\u4f4e\u4e0a\u4e0b\u6587\u7f16\u8f91\u5e26\u6765\u7684\u7b49\u5f85\u5ef6\u8fdf\u3002\u53ccGPU\u5b9e\u9a8c\u8f83vLLM\u63d0\u901f1.05\u81f31.19\u500d\uff0c\u96c6\u7fa4\u4eff\u771f\u4e5f\u663e\u793a\u6536\u76ca\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18459", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u5927\u6a21\u578b\u63a8\u7406", "\u7f13\u5b58\u7ba1\u7406", "\u5206\u79bb\u5f0f\u670d\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18459v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Callo: Serving Cache-Miss Requests with Speculative Decoding on Invalidated KV under Prefill-Decode Disaggregation", "tldr": "Callo\u5229\u7528\u5931\u6548KV\u7f13\u5b58\u8fdb\u884c\u63a8\u6d4b\u89e3\u7801\uff0c\u5e76\u5728\u91cd\u65b0\u9884\u586b\u5145\u540e\u9a8c\u8bc1\uff0c\u964d\u4f4e\u4e0a\u4e0b\u6587\u7f16\u8f91\u5e26\u6765\u7684\u7b49\u5f85\u5ef6\u8fdf\u3002\u53ccGPU\u5b9e\u9a8c\u8f83vLLM\u63d0\u901f1.05\u81f31.19\u500d\uff0c\u96c6\u7fa4\u4eff\u771f\u4e5f\u663e\u793a\u6536\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Machine learning weather models now rival operational global forecasts but still start from analyses produced by separate, expensive data assimilation (DA) systems, which for global models are typically updated every six hours. Observation-to-observation models avoid this dependence, but most omit the recursive filtering cycle that lets DA systems carry a background state through sparse, irregular observations. We introduce WeatherDreamer, a world model that learns this cycle end-to-end from 18 global observing systems, without reanalysis. It infers a latent state from observations, carries it forward hour by hour with learned dynamics, corrects it each hour with new observations, and can predict what any of its observing systems would measure at any location. At held-out stations, its ensembles beat NOAA\u0027s Global Ensemble Forecast System (GEFS) for temperature, dew point and wind out to 12 h and are better calibrated than GEFS and the ECMWF ensemble. Precipitation, cloud-top height and solar irradiance, never inputs at inference, are inferred with skill matching or exceeding operational products at short leads. Against the first guess of NOAA\u0027s Gridpoint Statistical Interpolation (GSI) DA system, WeatherDreamer\u0027s short-range departures are within 10% of GSI\u0027s at surface stations and within 25% for moisture-sensitive microwave channels, but up to five times larger for temperature-sounding channels. Never given observation errors, its learned update assumes errors close to known instrument and retrieval errors of microwave sounders and scatterometer winds. WeatherDreamer also separates viewing geometry from atmospheric state, recovering 83-96% of observed limb darkening and producing seamless nadir-view imagery. Producing an hourly global analysis in about 1.5 minutes on one GPU, WeatherDreamer shows that assimilation and forecasting can be learned together directly from observations.", "arxiv_id": "2611.18393", "arxiv_url": "https://arxiv.org/abs/2611.18393", "authors": ["Kate Duffy", "Elise Penn", "Tristan Ballard", "August Posch", "Thomas J. Vandal"], "brief": "WeatherDreamer\u4ece18\u7c7b\u5168\u7403\u89c2\u6d4b\u7aef\u5230\u7aef\u5b66\u4e60\u9010\u5c0f\u65f6\u540c\u5316\u4e0e\u9884\u62a5\uff0c\u65e0\u9700\u518d\u5206\u6790\uff1b\u77ed\u671f\u6c14\u8c61\u9884\u62a5\u4f18\u4e8eGEFS\uff0c\u5355GPU\u7ea61.5\u5206\u949f\u751f\u6210\u5168\u7403\u5206\u6790\u3002", "categories": ["cs.LG", "physics.ao-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18393", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5929\u6c14\u9884\u62a5", "\u6570\u636e\u540c\u5316", "\u591a\u6a21\u6001\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18393v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "WeatherDreamer: Learning a World Model from Multimodal Earth Observations", "tldr": "WeatherDreamer\u4ece18\u7c7b\u5168\u7403\u89c2\u6d4b\u7aef\u5230\u7aef\u5b66\u4e60\u9010\u5c0f\u65f6\u540c\u5316\u4e0e\u9884\u62a5\uff0c\u65e0\u9700\u518d\u5206\u6790\uff1b\u77ed\u671f\u6c14\u8c61\u9884\u62a5\u4f18\u4e8eGEFS\uff0c\u5355GPU\u7ea61.5\u5206\u949f\u751f\u6210\u5168\u7403\u5206\u6790\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When a sequential decision system falls short of an optimum, its score does not reveal which modifications would improve its decisions. DECODE is a benchmark for testing such modifications through controlled experiments on planning and available information. Its consumer-credit collections generator provides five partially observed environments that share known dynamics matrices and vary a memory parameter and process noise. The experiments change selected inputs or planning rules while keeping the rest of the solver fixed. Each comparison specifies the solver\u0027s state inputs, response inputs and planning horizon. On the deterministic base environment, which was selected for a large gap between six-month and one-month planning with the hidden state, extending planning from one to six months increases the scores of two gradient-boosted solvers by 15 to 17 percentage points of the exact optimum, computed with the hidden state and borrower traits. Even at this horizon, the best graded solver, whose repayment response is fitted on logs, remains 15.6 points below that optimum. In a specified intervention sequence, three changes to its state inputs and their evaluation during search lower its score by 6.3 points, and replacing its fitted repayment model with the true response, evaluated with hidden borrower traits, then raises it by 15.6, a net recovery of nine of those points. Because the intermediate effects are conditional on the repayment model and the order of the changes, they do not uniquely assign the gap to separate causes. Within these limits, DECODE makes hypotheses about solver performance testable through specified interventions under known dynamics and explicit information conditions.", "arxiv_id": "2611.18367", "arxiv_url": "https://arxiv.org/abs/2611.18367", "authors": ["Diego Silva Prado", "Bruno Caldas de Souza", "Tiago Amaral Penteado de Jesus", "Ricardo Guimar\u00e3es Herrmann", "Cristiano Breuel", "Cristiano Bevitori Maffia De Oliveira"], "brief": "DECODE\u6784\u5efa\u53ef\u63a7\u7684\u4fe1\u8d37\u50ac\u6536\u5e8f\u8d2f\u51b3\u7b56\u57fa\u51c6\uff0c\u7528\u5e72\u9884\u68c0\u9a8c\u89c4\u5212\u4e0e\u4fe1\u606f\u7684\u4f5c\u7528\u3002\u5ef6\u957f\u89c4\u5212\u4f7f\u5f97\u5206\u63d0\u534715\u81f317\u4e2a\u767e\u5206\u70b9\uff0c\u4f46\u5404\u56e0\u7d20\u7684\u5f71\u54cd\u65e0\u6cd5\u552f\u4e00\u5206\u89e3\u3002", "categories": ["cs.LG", "q-fin.RM", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18367", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5e8f\u8d2f\u51b3\u7b56", "\u57fa\u51c6\u8bc4\u6d4b", "\u90e8\u5206\u53ef\u89c2\u6d4b", "\u4fe1\u8d37\u98ce\u9669"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18367v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DECODE: Decomposable Environments for COntrolled Sequential-Decision Evaluation", "tldr": "DECODE\u6784\u5efa\u53ef\u63a7\u7684\u4fe1\u8d37\u50ac\u6536\u5e8f\u8d2f\u51b3\u7b56\u57fa\u51c6\uff0c\u7528\u5e72\u9884\u68c0\u9a8c\u89c4\u5212\u4e0e\u4fe1\u606f\u7684\u4f5c\u7528\u3002\u5ef6\u957f\u89c4\u5212\u4f7f\u5f97\u5206\u63d0\u534715\u81f317\u4e2a\u767e\u5206\u70b9\uff0c\u4f46\u5404\u56e0\u7d20\u7684\u5f71\u54cd\u65e0\u6cd5\u552f\u4e00\u5206\u89e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A small language model that turns a typed order into structure can fail in two ways. It can print something broken, which any system rejects. Or it can print a clean, well formed order that nobody placed. Our companion work calls the second kind a silent error, and it is the dangerous one. We present a web demo in which a fine-tuned 0.8B parameter model runs entirely inside the visitor\u0027s browser tab, through llama.cpp compiled to WebAssembly. No order text leaves the device. The page parses orders as the visitor types, scores every ticket with the PIZZA benchmark\u0027s own matcher ported to TypeScript, refuses anything off the menu with \"?\" so the model can face the open web, and lets visitors hunt for silent errors or try to cause one. Run in the browser on all 1,357 PIZZA test orders, the deployed model writes the same output as the server evaluation for 99.0% of them and reaches the same exact match (0.882); we also report its latency on 3 consumer laptops. Demo: https://wrong.cuyor.com", "arxiv_id": "2611.18284", "arxiv_url": "https://arxiv.org/abs/2611.18284", "authors": ["Umar Ahmed", "Maxim Dunaev", "Mohammad Nour Al Awad", "Sergey Ivanov", "Ivan Khodnenko"], "brief": "\u5c06\u5fae\u8c03\u76840.8B\u6a21\u578b\u90e8\u7f72\u5230\u6d4f\u89c8\u5668\uff0c\u73b0\u573a\u89e3\u6790\u8ba2\u5355\u5e76\u68c0\u6d4b\u683c\u5f0f\u6b63\u786e\u5374\u5185\u5bb9\u9519\u8bef\u7684\u9759\u9ed8\u9519\u8bef\uff1b\u6d4b\u8bd5\u8f93\u51fa\u4e0e\u670d\u52a1\u5668\u4e00\u81f4\u738799%\uff0c\u7cbe\u786e\u5339\u914d\u738788.2%\u3002", "categories": ["cs.LG", "cs.CL", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18284", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5c0f\u8bed\u8a00\u6a21\u578b", "\u7aef\u4fa7\u63a8\u7406", "\u9519\u8bef\u68c0\u6d4b", "\u7ed3\u6784\u5316\u89e3\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18284v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Clean Tickets, Wrong Orders: Catching Silent Errors with a Language Model in Your Browser Tab", "tldr": "\u5c06\u5fae\u8c03\u76840.8B\u6a21\u578b\u90e8\u7f72\u5230\u6d4f\u89c8\u5668\uff0c\u73b0\u573a\u89e3\u6790\u8ba2\u5355\u5e76\u68c0\u6d4b\u683c\u5f0f\u6b63\u786e\u5374\u5185\u5bb9\u9519\u8bef\u7684\u9759\u9ed8\u9519\u8bef\uff1b\u6d4b\u8bd5\u8f93\u51fa\u4e0e\u670d\u52a1\u5668\u4e00\u81f4\u738799%\uff0c\u7cbe\u786e\u5339\u914d\u738788.2%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Developing effective forecasting models for diverse time-series domains requires substantial expert knowledge, evidence from scientific literature on the web, and iterative experimentation. However, translating this knowledge and research experience into model designs requires preserving source context and testing applicability under task-specific assumptions. In this paper, we propose NeoResearch, a literature- and experience-guided autonomous research framework that leverages large language models (LLMs) as researchers to discover lightweight, domain-specific forecasting models. Specifically, NeoResearch establishes an expert-inspired dual-loop research workflow, coupling hypothesis-driven architecture exploration with iterative training and hyperparameter optimization through experimental feedback. To enable knowledge-grounded discovery, the agent autonomously mines scientific literature from the Web, extracting modeling mechanisms, empirical evidence, and applicability conditions to formulate task-grounded, testable architecture hypotheses. Furthermore, a hierarchical experience memory links literature findings to experimental outcomes and consolidates conditional lessons, guiding architecture discovery and training optimization while supporting reuse across forecasting tasks. Experiments on ten datasets show competitive performance and support dual loops, literature extraction, and memory reuse. Our code is available.", "arxiv_id": "2611.18235", "arxiv_url": "https://arxiv.org/abs/2611.18235", "authors": ["Ze Guo", "Mingyue Cheng", "Xiaoyu Tao", "Shuo Yu", "Shangtong Ye"], "brief": "NeoResearch\u7528\u5927\u6a21\u578b\u7ed3\u5408\u6587\u732e\u4e0e\u5b9e\u9a8c\u8bb0\u5fc6\uff0c\u81ea\u4e3b\u63a2\u7d22\u8f7b\u91cf\u65f6\u5e8f\u9884\u6d4b\u6a21\u578b\uff1b\u901a\u8fc7\u67b6\u6784\u4e0e\u8bad\u7ec3\u4f18\u5316\u53cc\u5faa\u73af\uff0c\u5728\u5341\u4e2a\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18235", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u81ea\u4e3b\u667a\u80fd\u4f53", "\u6a21\u578b\u53d1\u73b0", "\u7ecf\u9a8c\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18235v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "NeoResearch: Literature- and Experience-Guided Autonomous Time Series Model Discovery", "tldr": "NeoResearch\u7528\u5927\u6a21\u578b\u7ed3\u5408\u6587\u732e\u4e0e\u5b9e\u9a8c\u8bb0\u5fc6\uff0c\u81ea\u4e3b\u63a2\u7d22\u8f7b\u91cf\u65f6\u5e8f\u9884\u6d4b\u6a21\u578b\uff1b\u901a\u8fc7\u67b6\u6784\u4e0e\u8bad\u7ec3\u4f18\u5316\u53cc\u5faa\u73af\uff0c\u5728\u5341\u4e2a\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The hidden layers of Large Language Models (LLMs) are believed to encode representations of the data whose abstraction increases with depth. However, in the absence of an operational notion of abstraction, this statement is hard to test quantitatively. Here, we propose an alternative view, building on the principle that the correlations of a sequence reflect the structure of the process that generated it. We define the autocorrelation function of a layer as the average dot product between its activations at two context positions separated by a lag. Latent variables encoded persistently along the context create slowly decaying tails in the autocorrelation, and we find these tails to grow across layers in both synthetic and natural data. In synthetic data with controlled hierarchical latent structure, this growth stems from the encoding of abstract latent variables, which govern long stretches of the input. Indeed, the persistence of latent codes predicts the qualitative structure of autocorrelations and accounts for most of the empirical measures. In real text, we take sparse-autoencoder features as proxies for latent variables, and find that their persistence correlates strongly with the magnitude of autocorrelations across datasets and LLMs. In particular, the persistence time increases with depth, as do autocorrelations, implying that deeper latent features persist for longer context spans. We complement this analysis by explicitly ablating the persistent sparse-autoencoder features and observing a consequent decrease in the autocorrelations.", "arxiv_id": "2611.18089", "arxiv_url": "https://arxiv.org/abs/2611.18089", "authors": ["Francesco Cagnetta", "Santiago Acevedo"], "brief": "\u7814\u7a76\u7528\u6fc0\u6d3b\u81ea\u76f8\u5173\u91cf\u5316\u5927\u6a21\u578b\u7684\u957f\u7a0b\u8868\u5f81\uff0c\u53d1\u73b0\u6df1\u5c42\u6f5c\u53d8\u91cf\u6301\u7eed\u66f4\u4e45\uff1b\u5408\u6210\u6570\u636e\u4e0e\u771f\u5b9e\u6587\u672c\u5b9e\u9a8c\u8868\u660e\uff0c\u6f5c\u53d8\u91cf\u6301\u7eed\u6027\u53ef\u89e3\u91ca\u5927\u90e8\u5206\u81ea\u76f8\u5173\u73b0\u8c61\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18089", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8868\u5f81\u5206\u6790", "\u6f5c\u53d8\u91cf", "\u7a00\u758f\u81ea\u7f16\u7801\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18089v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Deep Latents, Long Memory: Latent persistence explains temporal correlations in transformer activations", "tldr": "\u7814\u7a76\u7528\u6fc0\u6d3b\u81ea\u76f8\u5173\u91cf\u5316\u5927\u6a21\u578b\u7684\u957f\u7a0b\u8868\u5f81\uff0c\u53d1\u73b0\u6df1\u5c42\u6f5c\u53d8\u91cf\u6301\u7eed\u66f4\u4e45\uff1b\u5408\u6210\u6570\u636e\u4e0e\u771f\u5b9e\u6587\u672c\u5b9e\u9a8c\u8868\u660e\uff0c\u6f5c\u53d8\u91cf\u6301\u7eed\u6027\u53ef\u89e3\u91ca\u5927\u90e8\u5206\u81ea\u76f8\u5173\u73b0\u8c61\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chain-of-thought (CoT) monitoring and self-report are proposed as levers for AI oversight, on the assumption that a model\u0027s account of what it is doing is anchored to what it was asked. We show this anchor can be cut. An activation edit invisible in the prompt text, the injected forming-trace of an off-topic concept, overwrites a reasoning model\u0027s belief about its own request: across six models spanning scale, architecture, and recipe, the injected topic becomes the task it reasons about, reports back, and answers: the forced quote-back returns the injected topic in 47 of 48 model-concept cells, and on the four models with clean final haiku the injected answer follows in 99% of generations. Warnings barely move it: even one naming the true topic yields under 5% true-topic answers. Handed the truth in clean tokens, the model confabulates a story about the user (\"maybe they got confused and corrected themselves\") and answers with the injection anyway, its behavior and chain-of-thought corrupted together: a concrete limit on CoT monitorability. Opening the model up offers no reprieve: it attends to the true request even harder after edits, yet that attention is causally inert, and the injected content rides intact task circuits, so attention maps and circuit attributions read as on-task too; the same edit redirects the request\u0027s language and format, not only its topic. What the injection reaches is the model\u0027s reference to its own input; what it elicits is its defense of it.", "arxiv_id": "2611.17958", "arxiv_url": "https://arxiv.org/abs/2611.17958", "authors": ["Yang Ou"], "brief": "\u7814\u7a76\u901a\u8fc7\u9690\u853d\u6fc0\u6d3b\u7f16\u8f91\u7be1\u6539\u516d\u79cd\u63a8\u7406\u6a21\u578b\u5bf9\u7528\u6237\u8bf7\u6c42\u7684\u8ba4\u77e5\uff0c\u6a21\u578b\u4f1a\u7f16\u9020\u7406\u7531\u7ef4\u62a4\u6ce8\u5165\u4efb\u52a1\uff0c\u8b66\u544a\u4e5f\u96be\u7ea0\u6b63\uff0c\u63ed\u793a\u601d\u7ef4\u94fe\u76d1\u63a7\u4e0e\u6ce8\u610f\u529b\u5206\u6790\u7684\u5c40\u9650\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17958", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u7406\u6a21\u578b", "\u6fc0\u6d3b\u5e72\u9884", "\u601d\u7ef4\u94fe\u76d1\u63a7", "\u4eba\u5de5\u667a\u80fd\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17958v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reasoning Models Confabulate to Defend Injected Beliefs About Their Own Requests", "tldr": "\u7814\u7a76\u901a\u8fc7\u9690\u853d\u6fc0\u6d3b\u7f16\u8f91\u7be1\u6539\u516d\u79cd\u63a8\u7406\u6a21\u578b\u5bf9\u7528\u6237\u8bf7\u6c42\u7684\u8ba4\u77e5\uff0c\u6a21\u578b\u4f1a\u7f16\u9020\u7406\u7531\u7ef4\u62a4\u6ce8\u5165\u4efb\u52a1\uff0c\u8b66\u544a\u4e5f\u96be\u7ea0\u6b63\uff0c\u63ed\u793a\u601d\u7ef4\u94fe\u76d1\u63a7\u4e0e\u6ce8\u610f\u529b\u5206\u6790\u7684\u5c40\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Synchronous, colocated RL post-training of large language models (LLMs) today suffers from severe under-utilization due to long-tail rollouts. Inference engines fall idle waiting for long-tail rollouts or decode at low, inefficient batch sizes. To address this, we present TIDE, an RL training system that preserves on-policy training semantics while recovering resource utilization. TIDE does so by two complementary techniques: (1) dynamically repurposing rollout GPUs for training while long-tail rollouts complete and (2) dynamically migrating rollouts between inference engines to boost decoding throughput. TIDE automatically determines the right time to repurpose rollout resources through an adaptive migration policy, obtaining performance improvements that generalize across multiple applications and hardware configurations without requiring bespoke configuration. In our evaluation, TIDE provides end-to-end speedups of up to 1.36x over colocated systems, outperforming all evaluated on-policy baselines and achieving up to 97% of optimal throughput.", "arxiv_id": "2611.17924", "arxiv_url": "https://arxiv.org/abs/2611.17924", "authors": ["Mathew Jacob", "Morgan Borjigin-Wang", "Kan Zhu", "Po Hao Chen", "Yi Pan", "Andy Ruan", "Nayani Modugula", "Ethan Lavi", "Luis Ceze", "Malte Schwarzkopf", "Akshay Narayan", "Deepti Raghavan", "Stephanie Wang"], "brief": "TIDE\u901a\u8fc7\u52a8\u6001\u590d\u7528\u751f\u6210GPU\u5e76\u8fc1\u79fb\u751f\u6210\u4efb\u52a1\uff0c\u5728\u4fdd\u6301\u540c\u7b56\u7565\u8bad\u7ec3\u8bed\u4e49\u4e0b\u7f13\u89e3\u957f\u5c3e\u751f\u6210\u5bfc\u81f4\u7684\u8d44\u6e90\u95f2\u7f6e\uff0c\u7aef\u5230\u7aef\u6700\u9ad8\u52a0\u901f1.36\u500d\uff0c\u8fbe\u6700\u4f18\u541e\u5410\u768497%\u3002", "categories": ["cs.LG", "cs.DC", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17924", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8d44\u6e90\u8c03\u5ea6", "\u8bad\u7ec3\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17924v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TIDE: Reclaiming Lost Performance In On-Policy Reinforcement Learning", "tldr": "TIDE\u901a\u8fc7\u52a8\u6001\u590d\u7528\u751f\u6210GPU\u5e76\u8fc1\u79fb\u751f\u6210\u4efb\u52a1\uff0c\u5728\u4fdd\u6301\u540c\u7b56\u7565\u8bad\u7ec3\u8bed\u4e49\u4e0b\u7f13\u89e3\u957f\u5c3e\u751f\u6210\u5bfc\u81f4\u7684\u8d44\u6e90\u95f2\u7f6e\uff0c\u7aef\u5230\u7aef\u6700\u9ad8\u52a0\u901f1.36\u500d\uff0c\u8fbe\u6700\u4f18\u541e\u5410\u768497%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speech applications require decisions about term presence, turn completion, and language within an audio window. We present Marimba, an interface for typed speech decisions built on frozen Qwen3-ASR 0.6B features. Lexical questions use zero-shot scoring of ASR transcripts; non-lexical questions use a question-conditioned head and a separate layer-18 turn-end readout. Language identification uses the ASR model\u0027s own language scores. On private conversational test sets, decoder AUROC is 0.80-0.92; on public read speech it is 0.92-0.97. Speech Commands four-way accuracy is 0.93; binary lexical ECE is at most 0.08. Personal-information detection, which passes the greedy transcript to a private, curated PII pipeline, reaches item-level F1 0.904 on synthetic Brazilian Portuguese speech (1.000 on reference transcripts). Layer-12 speaker readouts detect speaker change with AUROC 0.966-0.980 on AMI and VoxConverse, above an ECAPA baseline, and count speakers (0, 1, 2, or 3+) more accurately than pyannote 3.1. The turn-end readout reaches AUROC 0.930 versus Smart Turn v3.2 at 0.982 on Smart Turn\u0027s own test set. On a subset of ICSI meetings labeled by next speaker, AUROC is 0.716 versus 0.712; the paired confidence interval includes zero.", "arxiv_id": "2611.18330", "arxiv_url": "https://arxiv.org/abs/2611.18330", "authors": ["Solano Amadori"], "brief": "Marimba\u57fa\u4e8e\u51bb\u7ed3\u7684\u8bed\u97f3\u8bc6\u522b\u7279\u5f81\uff0c\u7edf\u4e00\u5904\u7406\u8bcd\u8bed\u68c0\u6d4b\u3001\u8bed\u8a00\u8bc6\u522b\u53ca\u8bf4\u8bdd\u4eba\u5224\u65ad\uff1b\u8bf4\u8bdd\u4eba\u68c0\u6d4b\u4f18\u4e8e\u57fa\u7ebf\uff0c\u4f46\u8f6e\u6b21\u7ed3\u675f\u5224\u65ad\u8868\u73b0\u4f9d\u6d4b\u8bd5\u96c6\u800c\u5f02\u3002", "categories": ["eess.AS", "cs.CL", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18330", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u8bf4\u8bdd\u4eba\u8bc6\u522b", "\u8f6e\u6b21\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18330v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Marimba: A System One Model for Speech", "tldr": "Marimba\u57fa\u4e8e\u51bb\u7ed3\u7684\u8bed\u97f3\u8bc6\u522b\u7279\u5f81\uff0c\u7edf\u4e00\u5904\u7406\u8bcd\u8bed\u68c0\u6d4b\u3001\u8bed\u8a00\u8bc6\u522b\u53ca\u8bf4\u8bdd\u4eba\u5224\u65ad\uff1b\u8bf4\u8bdd\u4eba\u68c0\u6d4b\u4f18\u4e8e\u57fa\u7ebf\uff0c\u4f46\u8f6e\u6b21\u7ed3\u675f\u5224\u65ad\u8868\u73b0\u4f9d\u6d4b\u8bd5\u96c6\u800c\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Knowledge distillation usually trains a compact student from scratch, which needs a large amount of data even though the teacher\u0027s weights already encode most of what the student has to learn. In this work, we explore building the student directly from the teacher\u0027s weights. We propose Concertina, which folds every group of N adjacent teacher layers into one shared block that is executed N times. Each loop step carries a low-rank correction initialized from the layer it replaces, and a per-token gate mixes these corrections, to let every token recover the behavior of the original layers from a single shared block. We further design a distillation data recipe that balances general, mathematical, academic and targeted multiple-choice data, to recover all capabilities of the teacher together rather than one at the expense of another. On Qwen3-4B, a 2.27B Concertina model distilled on 22B tokens retains about 90% of the teacher on commonsense and mathematical reasoning and 84% on average across eight benchmarks. It outperforms same-size dense and layer-sharing baselines, as well as Qwen3-1.7B, which is trained on over a thousand times more data. These results suggest that a compact model need not be retrained at scale, since folding the teacher into itself and distilling it on the right data recovers most of its capabilities. Code is available at https://github.com/myboker/concertina.", "arxiv_id": "2611.18113", "arxiv_url": "https://arxiv.org/abs/2611.18113", "authors": ["Ziyang Zhang", "Yubin Jing", "Yuyao Li", "Haofan Wang", "Yichen Gong"], "brief": "Concertina\u5c06\u6559\u5e08\u76f8\u90bb\u5c42\u6298\u53e0\u4e3a\u5faa\u73af\u5171\u4eab\u5757\uff0c\u7ed3\u5408\u4f4e\u79e9\u6821\u6b63\u4e0e\u84b8\u998f\uff0c\u5c064B\u6a21\u578b\u538b\u81f32.27B\uff0c\u4fdd\u7559\u516b\u9879\u57fa\u51c6\u5e73\u574784%\u7684\u80fd\u529b\uff0c\u4f18\u4e8e\u540c\u89c4\u6a21\u57fa\u7ebf\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18113", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u77e5\u8bc6\u84b8\u998f", "\u53c2\u6570\u5171\u4eab"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18113v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Folding Language Models into Themselves", "tldr": "Concertina\u5c06\u6559\u5e08\u76f8\u90bb\u5c42\u6298\u53e0\u4e3a\u5faa\u73af\u5171\u4eab\u5757\uff0c\u7ed3\u5408\u4f4e\u79e9\u6821\u6b63\u4e0e\u84b8\u998f\uff0c\u5c064B\u6a21\u578b\u538b\u81f32.27B\uff0c\u4fdd\u7559\u516b\u9879\u57fa\u51c6\u5e73\u574784%\u7684\u80fd\u529b\uff0c\u4f18\u4e8e\u540c\u89c4\u6a21\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The fingerprint by which a classifier recognizes the LLM behind a text is usually treated as a fixed property of the model. We show that it is contagious: a model that continues a conversation begun by another model inherits that model\u0027s fingerprint. This undermines audits of API relays, which can serve the first turns of a conversation with the model a customer pays for and silently hand the rest to a cheaper one. After such a handoff, detection of the substitute by a text classifier drops from 0.97 to 0.72 (DeepSeek replacing Claude Sonnet) and from 0.87 to 0.54 for a same-vendor downgrade (Haiku), and retraining on handoff data repairs only substitutes seen in training. Preregistered experiments trace the contagion to imitation of the history\u0027s style. History also moves a model away from its own fingerprint: active probes are not camouflaged, but when calibrated on fresh conversations they flag \\emph{honest} models on long contexts at rates up to 1.00, and a standard MMD equality test rejects all nine models we test. Both failures come from comparing a history-dependent reply with a history-free reference. We propose \\textsc{Lineup}, which samples references from the claimed model \\emph{on the same history} and tests the audited reply by its rank among them. \\textsc{Lineup} controls false positives by exchangeability and needs no fitted threshold or log-probabilities. With contemporaneous references on two closed models, its false-positive rate is 0.056 (preregistered bound 0.10), and it detects 0.81 of substitute sessions across six pairs after four audited turns.", "arxiv_id": "2611.18104", "arxiv_url": "https://arxiv.org/abs/2611.18104", "authors": ["Zailong Tian"], "brief": "\u7814\u7a76\u53d1\u73b0\u6a21\u578b\u4f1a\u6a21\u4eff\u5bf9\u8bdd\u5386\u53f2\uff0c\u7ee7\u627f\u524d\u4e00\u6a21\u578b\u7684\u6587\u672c\u6307\u7eb9\uff0c\u524a\u5f31\u66ff\u6362\u68c0\u6d4b\u3002\u63d0\u51fa\u540c\u5386\u53f2\u53c2\u7167\u5ba1\u8ba1\u6cd5\uff0c\u56db\u8f6e\u540e\u68c0\u51fa81%\u7684\u66ff\u6362\u4f1a\u8bdd\uff0c\u8bef\u62a5\u7387\u4e3a5.6%\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18104", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u6307\u7eb9", "\u6a21\u578b\u5ba1\u8ba1", "\u6587\u672c\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18104v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Contagious Fingerprints: When LLMs Inherit Another Model\u0027s Identity", "tldr": "\u7814\u7a76\u53d1\u73b0\u6a21\u578b\u4f1a\u6a21\u4eff\u5bf9\u8bdd\u5386\u53f2\uff0c\u7ee7\u627f\u524d\u4e00\u6a21\u578b\u7684\u6587\u672c\u6307\u7eb9\uff0c\u524a\u5f31\u66ff\u6362\u68c0\u6d4b\u3002\u63d0\u51fa\u540c\u5386\u53f2\u53c2\u7167\u5ba1\u8ba1\u6cd5\uff0c\u56db\u8f6e\u540e\u68c0\u51fa81%\u7684\u66ff\u6362\u4f1a\u8bdd\uff0c\u8bef\u62a5\u7387\u4e3a5.6%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Industry now relies on LLMs to write a large share of production code. Although that code is mostly, but not always, correct, correctness alone does not determine whether it is fit for repeated and extensive use, which depends on what the code costs in time, memory and energy. Most code-generation benchmarks nonetheless evaluate correctness in isolation, and most performance-oriented benchmarks cover few languages and rarely measure energy consumption. To address this gap, we present PERFARENA, an open-source, reproducible arena that ranks LLMs by the performance of their generated code across multiple languages and competitions. PERFARENA executes the solutions of each LLM on a Unix-like host and reports correctness together with latency, peak memory, and energy consumption. Correctness oracles, performance oracles, profilers, and code-generation workflows are pluggable in PERFARENA, enabling the integration of new judging backends and measurement tools without changing the pipeline. We evaluate PERFARENA on two competitions: CLBGComp, 10 compute-intensive benchmarks from the Computer Language Benchmarks Game, and LeetCodeComp, 99 LeetCode problems whose accepted solutions differ measurably in latency. Currently, PERFARENA holds 9,455 correct and measured solutions from 13 state-of-the-art LLMs across 7 programming languages. Across both competitions, got-6-astra is the only LLM that no other LLM beats significantly in latency, energy consumption, or peak memory, solving 99.7% of LeetCodeComp and 100% of CLBGComp. All PERFARENA leaderboards and measured solutions are publicly available, providing a continuously updated reference that helps developers choose an LLM per language and metric, instead of relying only on correctness rates or pricing.", "arxiv_id": "2611.18030", "arxiv_url": "https://arxiv.org/abs/2611.18030", "authors": ["Rui Rua", "Hailemariam Mersha", "Joao Paulo Fernandes", "Karim Ali"], "brief": "PerfArena\u8de8\u4e03\u79cd\u8bed\u8a00\u8bc4\u6d4b\u5927\u6a21\u578b\u751f\u6210\u4ee3\u7801\u7684\u6b63\u786e\u6027\u3001\u8017\u65f6\u3001\u5185\u5b58\u548c\u80fd\u8017\uff1b\u6d4b\u8bd5\u5341\u4e09\u4e2a\u6a21\u578b\uff0cgot-6-astra\u5728\u4e09\u9879\u6027\u80fd\u6307\u6807\u4e0a\u5747\u672a\u88ab\u663e\u8457\u8d85\u8d8a\u3002", "categories": ["cs.PF", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18030", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u6027\u80fd\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u80fd\u8017"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18030v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PerfArena: Ranking LLMs by Code Performance", "tldr": "PerfArena\u8de8\u4e03\u79cd\u8bed\u8a00\u8bc4\u6d4b\u5927\u6a21\u578b\u751f\u6210\u4ee3\u7801\u7684\u6b63\u786e\u6027\u3001\u8017\u65f6\u3001\u5185\u5b58\u548c\u80fd\u8017\uff1b\u6d4b\u8bd5\u5341\u4e09\u4e2a\u6a21\u578b\uff0cgot-6-astra\u5728\u4e09\u9879\u6027\u80fd\u6307\u6807\u4e0a\u5747\u672a\u88ab\u663e\u8457\u8d85\u8d8a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We propose Structural Self-Teaching (SST), a novel framework that enhances compositional image generation in diffusion-based unified multimodal models (UMMs) by leveraging their internal understanding path as a source of structural supervision. The generation path of UMMs often struggles with dense compositional prompts, leading to missing objects, attribute binding failures, and spatial errors. In contrast, their understanding path localizes the same phrases in images that satisfy these prompts. SST converts this phrase-level grounding into training-time structural signals for the generation path. Specifically, we extract phrase-conditioned support masks from internal attention maps derived from the understanding path and employ them through two mechanisms. Phrase-local contrastive alignment uses these masks as pooling regions and aligns each generated phrase region with the same region of the target image. A structural scaffold builds a phrase-level layout from the same masks and modulates an intermediate spatial state of the generation path during training. The scaffold is phased out during training and removed at inference. SST requires no external structural annotations for training and no additional input at test time. Extensive experiments across multiple UMMs demonstrate that SST improves compositional fidelity over LoRA fine-tuning on the same data, with no inference-time cost. Project page is available at https://bellos1203.github.io/sst", "arxiv_id": "2611.18261", "arxiv_url": "https://arxiv.org/abs/2611.18261", "authors": ["Jaeyoo Park", "Bohyung Han"], "brief": "SST\u5229\u7528\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u7406\u89e3\u8def\u5f84\uff0c\u4e3a\u56fe\u50cf\u751f\u6210\u63d0\u4f9b\u77ed\u8bed\u7ea7\u7ed3\u6784\u76d1\u7763\uff0c\u65e0\u9700\u5916\u90e8\u6807\u6ce8\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u7ec4\u5408\u4fdd\u771f\u5ea6\u4f18\u4e8e\u540c\u6570\u636eLoRA\u5fae\u8c03\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u6210\u672c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18261", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u56fe\u50cf\u751f\u6210", "\u7ec4\u5408\u751f\u6210", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18261v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Structural Self-Teaching for Compositional Generation in Unified Multimodal Models", "tldr": "SST\u5229\u7528\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u7406\u89e3\u8def\u5f84\uff0c\u4e3a\u56fe\u50cf\u751f\u6210\u63d0\u4f9b\u77ed\u8bed\u7ea7\u7ed3\u6784\u76d1\u7763\uff0c\u65e0\u9700\u5916\u90e8\u6807\u6ce8\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u7ec4\u5408\u4fdd\u771f\u5ea6\u4f18\u4e8e\u540c\u6570\u636eLoRA\u5fae\u8c03\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Attention is essential for modeling spatio-temporal dependencies in video diffusion transformers, but its quadratic cost makes it a major inference bottleneck. Its high sparsity offers an opportunity to accelerate generation by focusing computation on important interactions. However, accuracy and execution favor different granularities: each query attends to its own key tokens, whereas GPU kernels work on tiles. We present Token2Tile, a training-free sparse attention operator that combines per-query scoring and a per-query residual with tile execution. An online low-rank space, computed directly from queries and keys to preserve attention logits, makes clustering, scoring, and residual approximation efficient. Token2Tile unites query-specific selections to allocate exact work across query clusters, then packs the selected keys into GPU tiles. On MiniMax-H3 and Wan2.1-14B, Token2Tile delivers 1.48-1.54x end-to-end speedup over dense FlashAttention-3 with VBench scores within 0.5 points of dense. At comparable speeds on H3, it improves PSNR over SOL and SubBlock by 5.5-6.8 dB; on Wan, it exceeds SOL by 4.6-4.8 dB while running faster.", "arxiv_id": "2611.17930", "arxiv_url": "https://arxiv.org/abs/2611.17930", "authors": ["Xuecheng Wu", "Aichen Feng", "Jinyan Chen", "Qingjie Zhao", "Julien Lai"], "brief": "Token2Tile\u5229\u7528\u4f4e\u79e9\u7a7a\u95f4\u5c06\u9010\u8bcd\u7a00\u758f\u6ce8\u610f\u529b\u6620\u5c04\u4e3aGPU\u5206\u5757\u6267\u884c\uff0c\u65e0\u9700\u8bad\u7ec3\uff1b\u89c6\u9891\u751f\u6210\u52a0\u901f\u7ea61.5\u500d\uff0c\u8d28\u91cf\u8bc4\u5206\u4e0e\u5bc6\u96c6\u6ce8\u610f\u529b\u76f8\u5dee\u4e0d\u52300.5\u5206\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17930", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7a00\u758f\u6ce8\u610f\u529b", "\u4f4e\u79e9\u8fd1\u4f3c", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17930v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Token2Tile: Token-Wise Sparse Attention with Tile Execution through a Low-Rank Space for Video DiTs", "tldr": "Token2Tile\u5229\u7528\u4f4e\u79e9\u7a7a\u95f4\u5c06\u9010\u8bcd\u7a00\u758f\u6ce8\u610f\u529b\u6620\u5c04\u4e3aGPU\u5206\u5757\u6267\u884c\uff0c\u65e0\u9700\u8bad\u7ec3\uff1b\u89c6\u9891\u751f\u6210\u52a0\u901f\u7ea61.5\u500d\uff0c\u8d28\u91cf\u8bc4\u5206\u4e0e\u5bc6\u96c6\u6ce8\u610f\u529b\u76f8\u5dee\u4e0d\u52300.5\u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
