 different local interaction intents. A fluent response may therefore advance the dialogue through an inappropriate intent, such as acceptance rather than repair. Our key insight is that controllable user simulation should separate which local interaction intent the next user turn should realize from how that intent is expressed in language. We introduce UserIDA (User Intent-Directive Alignment), which exposes interaction intent as an explicit per-turn directive. UserIDA defines a six-way intent interface, learns directive-conditioned generation through supervised fine-tuning, and uses intent-calibrated policy optimization during group-based reinforcement learning. The reward preserves composite response quality while ensuring that intent-violating candidates rank below compliant alternatives in mixed groups. On LMSYS-USP, UserIDA achieves 86.6\\% intent accuracy, outperforming the strongest dedicated user-simulator baseline by 24.3 percentage points while improving semantic and stylistic similarity. In within-context interventions, it realizes at least four of the six target intents in 91.7\\% of evaluated dialogue states, compared with 22.9\\% for the strongest external baseline. These results establish per-turn intent control as a complementary dimension to response fidelity in user simulation.", "arxiv_id": "2608.09420", "arxiv_url": "https://arxiv.org/abs/2608.09420", "authors": ["Bo Wang", "Ruixing Zhang", "Yunqi Liu", "Yang Zhang", "Liangzhe Han", "Tongyu Zhu", "Leilei Sun"], "brief": "\u8bba\u6587\u63d0\u51fa UserIDA\uff0c\u5c06\u7528\u6237\u4e0b\u4e00\u8f6e\u56de\u590d\u62c6\u5206\u4e3a\u201c\u8981\u5b9e\u73b0\u7684\u5c40\u90e8\u4ea4\u4e92\u610f\u56fe\u201d\u548c\u201c\u5982\u4f55\u7528\u8bed\u8a00\u8868\u8fbe\u201d\u3002\u5b83\u901a\u8fc7\u6bcf\u8f6e\u610f\u56fe\u6307\u4ee4\u3001\u76d1\u7763\u5fae\u8c03\u548c\u610f\u56fe\u6821\u51c6\u7684\u7ec4\u5f0f\u5f3a\u5316\u5b66\u4e60\uff0c\u5b9e\u73b0\u53ef\u63a7\u7528\u6237\u6a21\u62df\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/ptwang773/UserIDA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.09420", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5b9a\u4e49\u516d\u7c7b\u7528\u6237\u4ea4\u4e92\u610f\u56fe\u63a5\u53e3\uff0c\u5e76\u8fdb\u884c\u6307\u4ee4\u6761\u4ef6\u751f\u6210\uff0c\u8ba9\u6a21\u62df\u5668\u6309\u6307\u5b9a\u610f\u56fe\u56de\u590d\u3002", "\u5728\u7ec4\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e2d\u52a0\u5165\u610f\u56fe\u6821\u51c6\u5956\u52b1\uff0c\u4fdd\u8bc1\u8fdd\u53cd\u76ee\u6807\u610f\u56fe\u7684\u5019\u9009\u6392\u5e8f\u4f4e\u4e8e\u5408\u89c4\u5019\u9009\u3002", "\u5728 LMSYS-USP \u4e0a\u8fbe\u5230 86.6% \u610f\u56fe\u51c6\u786e\u7387\uff0c\u6bd4\u6700\u5f3a\u7528\u6237\u6a21\u62df\u57fa\u7ebf\u9ad8 24.3 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u63d0\u5347\u8bed\u4e49\u4e0e\u98ce\u683c\u76f8\u4f3c\u6027\u3002"], "keywords": ["\u7528\u6237\u6a21\u62df", "\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5bf9\u8bdd\u7cfb\u7edf"], "num_comments": 2, "on_hf": true, "organization": "Beihang University", "pdf_url": "https://arxiv.org/pdf/2608.09420v1", "published_at": "2026-08-10", "score": 0.238, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09420.png", "title": "Intent Speaks Louder: Controllable User Simulation Beyond Response Imitation", "tldr": "\u663e\u5f0f\u610f\u56fe\u63a7\u5236\u63d0\u5347\u7528\u6237\u6a21\u62df\u53ef\u9760\u6027", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa UserIDA\uff0c\u5c06\u7528\u6237\u4e0b\u4e00\u8f6e\u56de\u590d\u62c6\u5206\u4e3a\u201c\u8981\u5b9e\u73b0\u7684\u5c40\u90e8\u4ea4\u4e92\u610f\u56fe\u201d\u548c\u201c\u5982\u4f55\u7528\u8bed\u8a00\u8868\u8fbe\u201d\u3002\u5b83\u901a\u8fc7\u6bcf\u8f6e\u610f\u56fe\u6307\u4ee4\u3001\u76d1\u7763\u5fae\u8c03\u548c\u610f\u56fe\u6821\u51c6\u7684\u7ec4\u5f0f\u5f3a\u5316\u5b66\u4e60\uff0c\u5b9e\u73b0\u53ef\u63a7\u7528\u6237\u6a21\u62df\u3002", "why_notable": "\u5b83\u6307\u51fa\u7528\u6237\u6a21\u62df\u4e0d\u5e94\u53ea\u6a21\u4eff\u6d41\u7545\u56de\u590d\uff0c\u8fd8\u9700\u663e\u5f0f\u63a7\u5236\u5bf9\u8bdd\u63a8\u8fdb\u610f\u56fe\uff1b\u8fd9\u5bf9\u8bad\u7ec3\u548c\u8bc4\u4f30\u4ea4\u4e92\u5f0f\u52a9\u624b\u3001\u5bf9\u8bdd\u667a\u80fd\u4f53\u66f4\u53ef\u9760\u3001\u66f4\u53ef\u63a7\u3002"}, {"abstract": "Large-taxonomy retrieval often assumes that the input already expresses the target concept. In many settings, however, the input is indirect evidence, such as a table cell whose meaning depends on its row, column, datatype, and context. We call this mismatch the retrieval readiness gap. Our analysis shows that the current index retrieves the target reliably when its semantics are explicit, while raw evidence often leaves it deep in the ranking. We propose Factorized Hypothesis Search (FHS), which maintains multiple partial interpretations over named semantic dimensions. These hypotheses support structured query rendering, multi-hypothesis retrieval, and dimension-level candidate verification. On both financial taxonomy tagging and CodiEsp clinical coding tasks, FHS achieves the best Recall@1, MRR, and final accuracy among the non-oracle methods. Replacing the factorized hypothesis path with a free-text ensemble causes the largest drop in head-ranking performance, while sequential refinement provides no additional gain over FHS\u0027s strong parallel first round.", "arxiv_id": "2608.06614", "arxiv_url": "https://arxiv.org/abs/2608.06614", "authors": ["Linhai Ma", "Ethan F. Wei", "Xueqing Peng", "Yan Wang", "Lingfei Qian", "V\u00edctor Guti\u00e9rrez-Basulto"], "brief": "\u8bba\u6587\u63d0\u51fa Factorized Hypothesis Search\uff08FHS\uff09\uff0c\u7528\u4e8e\u5904\u7406\u8f93\u5165\u53ea\u662f\u95f4\u63a5\u8bc1\u636e\u800c\u975e\u76ee\u6807\u6982\u5ff5\u663e\u5f0f\u8868\u8fbe\u7684\u5927\u578b\u5206\u7c7b\u4f53\u7cfb\u68c0\u7d22\u3002\u5b83\u5c06\u8bc1\u636e\u6309\u547d\u540d\u8bed\u4e49\u7ef4\u5ea6\u751f\u6210\u591a\u79cd\u90e8\u5206\u89e3\u91ca\uff0c\u5e76\u7528\u4e8e\u7ed3\u6784\u5316\u67e5\u8be2\u3001\u591a\u5047\u8bbe\u68c0\u7d22\u4e0e\u5019\u9009\u9a8c\u8bc1\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06614", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u201c\u68c0\u7d22\u5c31\u7eea\u5dee\u8ddd\u201d\uff1a\u539f\u59cb\u8bc1\u636e\u5982\u8868\u683c\u5355\u5143\u683c\u5e38\u4f9d\u8d56\u884c\u3001\u5217\u3001\u6570\u636e\u7c7b\u578b\u548c\u4e0a\u4e0b\u6587\uff0c\u5bfc\u81f4\u76ee\u6807\u6982\u5ff5\u5728\u68c0\u7d22\u6392\u5e8f\u4e2d\u5f88\u6df1", "FHS \u7ef4\u62a4\u591a\u4e2a\u6309\u8bed\u4e49\u7ef4\u5ea6\u5206\u89e3\u7684\u5047\u8bbe\uff0c\u652f\u6301\u7ed3\u6784\u5316 query rendering\u3001\u591a\u5047\u8bbe\u53ec\u56de\u548c\u7ef4\u5ea6\u7ea7\u5019\u9009\u6821\u9a8c", "\u5728\u91d1\u878d taxonomy tagging \u4e0e CodiEsp \u4e34\u5e8a\u7f16\u7801\u4efb\u52a1\u4e0a\uff0cFHS \u5728 Recall@1\u3001MRR \u548c\u6700\u7ec8\u51c6\u786e\u7387\u4e0a\u4f18\u4e8e\u975e oracle \u65b9\u6cd5"], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u8bed\u4e49\u7406\u89e3", "\u533b\u7597\u7f16\u7801", "\u5206\u7c7b\u4f53\u7cfb"], "num_comments": 2, "on_hf": true, "organization": "The Fin AI", "pdf_url": "https://arxiv.org/pdf/2608.06614v1", "published_at": "2026-08-06", "score": 0.229, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06614.png", "title": "Factorized Hypothesis Search for Evidence-to-Taxonomy Retrieval", "tldr": "\u7528\u56e0\u5b50\u5316\u5047\u8bbe\u7f29\u5c0f\u8bc1\u636e\u5230\u5206\u7c7b\u68c0\u7d22\u5dee\u8ddd", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa Factorized Hypothesis Search\uff08FHS\uff09\uff0c\u7528\u4e8e\u5904\u7406\u8f93\u5165\u53ea\u662f\u95f4\u63a5\u8bc1\u636e\u800c\u975e\u76ee\u6807\u6982\u5ff5\u663e\u5f0f\u8868\u8fbe\u7684\u5927\u578b\u5206\u7c7b\u4f53\u7cfb\u68c0\u7d22\u3002\u5b83\u5c06\u8bc1\u636e\u6309\u547d\u540d\u8bed\u4e49\u7ef4\u5ea6\u751f\u6210\u591a\u79cd\u90e8\u5206\u89e3\u91ca\uff0c\u5e76\u7528\u4e8e\u7ed3\u6784\u5316\u67e5\u8be2\u3001\u591a\u5047\u8bbe\u68c0\u7d22\u4e0e\u5019\u9009\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u771f\u5b9e\u68c0\u7d22\u573a\u666f\u4e2d\u201c\u8bc1\u636e\u4e0d\u7b49\u4e8e\u6982\u5ff5\u201d\u7684\u5e38\u89c1\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u6bd4\u81ea\u7531\u6587\u672c\u96c6\u6210\u548c\u987a\u5e8f\u7ec6\u5316\u66f4\u6709\u6548\u7684\u7ed3\u6784\u5316\u63a8\u7406\u68c0\u7d22\u6846\u67b6\uff0c\u5bf9\u91d1\u878d\u3001\u533b\u7597\u7b49\u5927\u89c4\u6a21 taxonomy/\u7f16\u7801\u4efb\u52a1\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "In evolutionary algorithms powered by language models, the LLM acts as a single operator that simultaneously updates structural components (like control flow) and continuous parameters. While LLMs can be good at the first, they are not efficient at the second, wasting tokens taking discrete jumps inside a trial and error loop. We resolve this by formalizing a hybrid nested search, in which an outer loop has the LLM propose a structural sketch, with numeric gaps, and an inner numerical optimizer tunes the sketch. Both the outer and inner solvers are pluggable: any text-based optimizer can be combined with a zero-order optimizer (CMA-ES), gradient-based routines, or MCMC samplers. We validate our framework across three scientific domains: (i) meta-optimizers on closed-form test functions, (ii) code-based policies for systems research and social dilemmas; and (iii) approximate Bayesian inference tasks. Across all three, the hybrid optimizer is superior to both vanilla LLM-driven search and pure numerical optimization baselines. Code at: https://github.com/vicgalle/hybrid-nested-search", "arxiv_id": "2608.08156", "arxiv_url": "https://arxiv.org/abs/2608.08156", "authors": ["V\u00edctor Gallego"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6df7\u5408\u5d4c\u5957\u641c\u7d22\u6846\u67b6\uff1a\u5916\u5c42\u7531LLM\u63d0\u51fa\u5e26\u6570\u503c\u7a7a\u4f4d\u7684\u7ed3\u6784\u8349\u56fe\uff0c\u5185\u5c42\u7531\u6570\u503c\u4f18\u5316\u5668\u81ea\u52a8\u8c03\u53c2\u3002\u8be5\u6846\u67b6\u53ef\u7ec4\u5408\u6587\u672c\u4f18\u5316\u5668\u4e0eCMA-ES\u3001\u68af\u5ea6\u65b9\u6cd5\u6216MCMC\u7b49\u5185\u5c42\u6c42\u89e3\u5668\uff0c\u5e76\u5728\u591a\u7c7b\u79d1\u5b66\u4efb\u52a1\u4e0a\u9a8c\u8bc1\u6709\u6548\u6027\u3002", "categories": ["cs.LG", "cs.NE"], "github_repo": "https://github.com/vicgalle/hybrid-nested-search", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.08156", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06LLM\u64c5\u957f\u7684\u7ed3\u6784\u641c\u7d22\u4e0e\u4e0d\u64c5\u957f\u7684\u8fde\u7eed\u53c2\u6570\u4f18\u5316\u89e3\u8026\uff0c\u51cf\u5c11\u7528\u79bb\u6563\u8bd5\u9519\u8c03\u6570\u503c\u5e26\u6765\u7684token\u6d6a\u8d39", "\u5916\u5c42\u4e0e\u5185\u5c42\u6c42\u89e3\u5668\u5747\u53ef\u63d2\u62d4\uff0c\u53ef\u9002\u914d\u96f6\u9636\u4f18\u5316\u3001\u68af\u5ea6\u4f18\u5316\u548c\u91c7\u6837\u63a8\u65ad\u65b9\u6cd5", "\u5728\u5143\u4f18\u5316\u5668\u8bbe\u8ba1\u3001\u4ee3\u7801\u7b56\u7565\u751f\u6210\u3001\u8fd1\u4f3c\u8d1d\u53f6\u65af\u63a8\u65ad\u4e09\u7c7b\u4efb\u52a1\u4e2d\u4f18\u4e8e\u7eafLLM\u641c\u7d22\u548c\u7eaf\u6570\u503c\u4f18\u5316\u57fa\u7ebf"], "keywords": ["LLM\u4f18\u5316", "\u8fdb\u5316\u7b97\u6cd5", "\u6570\u503c\u4f18\u5316", "\u79d1\u5b66\u8ba1\u7b97"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08156v1", "published_at": "2026-08-08", "score": 0.227, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08156.png", "title": "A Hybrid Nested Harness for Decoupling Structure and Parameters in LLM-Driven Optimization", "tldr": "\u8ba9LLM\u7ba1\u7ed3\u6784\uff0c\u6570\u503c\u4f18\u5316\u5668\u8c03\u53c2\u6570", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6df7\u5408\u5d4c\u5957\u641c\u7d22\u6846\u67b6\uff1a\u5916\u5c42\u7531LLM\u63d0\u51fa\u5e26\u6570\u503c\u7a7a\u4f4d\u7684\u7ed3\u6784\u8349\u56fe\uff0c\u5185\u5c42\u7531\u6570\u503c\u4f18\u5316\u5668\u81ea\u52a8\u8c03\u53c2\u3002\u8be5\u6846\u67b6\u53ef\u7ec4\u5408\u6587\u672c\u4f18\u5316\u5668\u4e0eCMA-ES\u3001\u68af\u5ea6\u65b9\u6cd5\u6216MCMC\u7b49\u5185\u5c42\u6c42\u89e3\u5668\uff0c\u5e76\u5728\u591a\u7c7b\u79d1\u5b66\u4efb\u52a1\u4e0a\u9a8c\u8bc1\u6709\u6548\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aLLM\u9a71\u52a8\u7684\u8fdb\u5316/\u7a0b\u5e8f\u4f18\u5316\u63d0\u4f9b\u4e86\u66f4\u5408\u7406\u7684\u5206\u5de5\u8303\u5f0f\uff0c\u6709\u671b\u63d0\u5347\u79d1\u5b66\u53d1\u73b0\u3001\u7b56\u7565\u641c\u7d22\u548c\u81ea\u52a8\u7b97\u6cd5\u8bbe\u8ba1\u4e2d\u7684\u6548\u7387\u4e0e\u7a33\u5b9a\u6027\u3002"}, {"abstract": "Medical visual agents can use tools to inspect images and retrieve external knowledge, but indiscriminate tool use may introduce noisy or misleading evidence. Reliable diagnosis therefore requires not only acquiring additional observations, but also verifying whether tool actions are necessary and whether the resulting evidence supports the current hypothesis. We introduce MIRA (Medical Image Reflection for Agentic Diagnosis), a medical visual diagnostic framework for autonomous evidence search and reflective verification. MIRA dynamically invokes image-processing operations, including zooming, grounding, pointing, rotation, and measurement, as well as web search, while evaluating the relevance and consistency of the acquired evidence. We develop MIRA through a two-stage training strategy. First, a tool-augmented Monte Carlo Tree Search data engine explores diverse diagnostic hypotheses and jointly verifies visual grounding accuracy and semantic consistency to construct supervised fine-tuning trajectories. Second, reinforcement learning further improves decision-making through online reflective principle evolution: failure cases are distilled into candidate principles, and only principles that improve held-out rollout rewards are retained. Across nine medical visual reasoning benchmarks, MIRA achieves an average score of 64.73, improving its Qwen3-VL-8B backbone by 7.44 points. It also increases useful tool-use judgments from 56.2% to 73.8% and reduces harmful judgments from 8.9% to 1.6%. Qualitative analyses show that MIRA can re-examine evidence, correct premature conclusions, and adapt its tool-use strategy. Project page: https://MIRA-VL.github.io/", "arxiv_id": "2608.10827", "arxiv_url": "https://arxiv.org/abs/2608.10827", "authors": ["Shengzhi Wang", "Jun Yang", "Kai Wu", "Xiaozhong Ji", "Yiwen Ye", "Ziyang Chen", "Mingliang Xiong", "Wen Fang", "Mingqing Liu", "Mengyuan Xu", "Miaoxuan Shan", "Caiyan Liu", "Bin He", "Qingwen Liu"], "brief": "MIRA \u662f\u4e00\u4e2a\u9762\u5411\u533b\u5b66\u56fe\u50cf\u8bca\u65ad\u7684\u89c6\u89c9\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u81ea\u4e3b\u8c03\u7528\u7f29\u653e\u3001\u5b9a\u4f4d\u3001\u6d4b\u91cf\u3001\u65cb\u8f6c\u548c\u7f51\u9875\u641c\u7d22\u7b49\u5de5\u5177\uff0c\u5e76\u53cd\u601d\u9a8c\u8bc1\u8bc1\u636e\u662f\u5426\u5fc5\u8981\u3001\u76f8\u5173\u4e14\u652f\u6301\u5f53\u524d\u8bca\u65ad\u5047\u8bbe\u3002\u5b83\u901a\u8fc7\u5de5\u5177\u589e\u5f3a\u7684 MCTS \u6784\u9020\u76d1\u7763\u5fae\u8c03\u6570\u636e\uff0c\u518d\u7528\u5e26\u201c\u53cd\u601d\u539f\u5219\u6f14\u5316\u201d\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u51b3\u7b56\uff0c\u5728 9 \u4e2a\u533b\u5b66\u89c6\u89c9\u63a8\u7406\u57fa\u51c6\u4e0a\u8f83 Qwen3-VL-8B \u63d0\u5347 7.44 \u5206\uff0c\u5e76\u663e\u8457\u51cf\u5c11\u6709\u5bb3\u5de5\u5177\u5224\u65ad\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10827", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u5b66\u5f71\u50cf", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10827v1", "published_at": "2026-08-11", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MIRA: Medical Image Reflection for Agentic Diagnosis", "tldr": "MIRA \u662f\u4e00\u4e2a\u9762\u5411\u533b\u5b66\u56fe\u50cf\u8bca\u65ad\u7684\u89c6\u89c9\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u81ea\u4e3b\u8c03\u7528\u7f29\u653e\u3001\u5b9a\u4f4d\u3001\u6d4b\u91cf\u3001\u65cb\u8f6c\u548c\u7f51\u9875\u641c\u7d22\u7b49\u5de5\u5177\uff0c\u5e76\u53cd\u601d\u9a8c\u8bc1\u8bc1\u636e\u662f\u5426\u5fc5\u8981\u3001\u76f8\u5173\u4e14\u652f\u6301\u5f53\u524d\u8bca\u65ad\u5047\u8bbe\u3002\u5b83\u901a\u8fc7\u5de5\u5177\u589e\u5f3a\u7684 MCTS \u6784\u9020\u76d1\u7763\u5fae\u8c03\u6570\u636e\uff0c\u518d\u7528\u5e26\u201c\u53cd\u601d\u539f\u5219\u6f14\u5316\u201d\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u51b3\u7b56\uff0c\u5728 9 \u4e2a\u533b\u5b66\u89c6\u89c9\u63a8\u7406\u57fa\u51c6\u4e0a\u8f83 Qwen3-VL-8B \u63d0\u5347 7.44 \u5206\uff0c\u5e76\u663e\u8457\u51cf\u5c11\u6709\u5bb3\u5de5\u5177\u5224\u65ad\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) have undergone a shift from stateless conversational interfaces to autonomous agents capable of multi-step planning, tool invocation, code execution, and maintaining persistent memory. When these agents operate with real-world privileges---calling APIs, modifying files, and querying databases---a compromised reasoning step can trigger unauthorized data access, irreversible state changes, or cascading failures, yet the security research community has not kept pace. To quantify the state of the field, we conducted a systematic literature review under PRISMA 2020 guidelines across six databases, screening 743 records and retaining 85 papers (2023--2025) on agentic LLM security. Attack research outpaces defense work by 3.9:1. Perception-layer vulnerabilities (prompt injection, jailbreaking, adversarial perturbations) dominate, accounting for 66\\% of papers, while action-layer vulnerabilities (tool misuse, code injection, sandbox escape) appear in only 4.7\\%, misaligned with real-world risk. Code execution security accounts for 3.5\\%, and tool-augmented agents 12\\%. We contribute a four-layer taxonomy mapping 13 vulnerability types across perception, brain, action, and interaction layers, and identify seven open problems centered on containment. Agentic LLM insecurity stems from architectural coupling, where weak isolation allows vulnerabilities to propagate across layers.", "arxiv_id": "2608.10530", "arxiv_url": "https://arxiv.org/abs/2608.10530", "authors": ["Md Jafrin Hossain", "Mohammad Arif Hossain", "Nirwan Ansari"], "brief": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e862023\u20142025\u5e7485\u7bc7\u667a\u80fd\u4f53\u5f0f\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168\u8bba\u6587\uff0c\u53d1\u73b0\u653b\u51fb\u7814\u7a76\u8fdc\u591a\u4e8e\u9632\u5fa1\uff0c\u4e14\u7814\u7a76\u91cd\u70b9\u8fc7\u5ea6\u96c6\u4e2d\u5728\u63d0\u793a\u6ce8\u5165\u3001\u8d8a\u72f1\u7b49\u611f\u77e5\u5c42\u6f0f\u6d1e\u3002\u8bba\u6587\u63d0\u51fa\u56db\u5c42\u6f0f\u6d1e\u5206\u7c7b\u4f53\u7cfb\uff0c\u6307\u51fa\u5de5\u5177\u8c03\u7528\u3001\u4ee3\u7801\u6267\u884c\u3001\u6c99\u7bb1\u9003\u9038\u7b49\u884c\u52a8\u5c42\u98ce\u9669\u88ab\u660e\u663e\u4f4e\u4f30\uff0c\u5e76\u5f3a\u8c03\u9694\u79bb\u4e0d\u8db3\u5bfc\u81f4\u6f0f\u6d1e\u8de8\u5c42\u4f20\u64ad\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10530", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u63d0\u793a\u6ce8\u5165", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10530v1", "published_at": "2026-08-11", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "On Understanding, Identifying, and Mitigating Vulnerabilities in Agentic Large Language Models", "tldr": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e862023\u20142025\u5e7485\u7bc7\u667a\u80fd\u4f53\u5f0f\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168\u8bba\u6587\uff0c\u53d1\u73b0\u653b\u51fb\u7814\u7a76\u8fdc\u591a\u4e8e\u9632\u5fa1\uff0c\u4e14\u7814\u7a76\u91cd\u70b9\u8fc7\u5ea6\u96c6\u4e2d\u5728\u63d0\u793a\u6ce8\u5165\u3001\u8d8a\u72f1\u7b49\u611f\u77e5\u5c42\u6f0f\u6d1e\u3002\u8bba\u6587\u63d0\u51fa\u56db\u5c42\u6f0f\u6d1e\u5206\u7c7b\u4f53\u7cfb\uff0c\u6307\u51fa\u5de5\u5177\u8c03\u7528\u3001\u4ee3\u7801\u6267\u884c\u3001\u6c99\u7bb1\u9003\u9038\u7b49\u884c\u52a8\u5c42\u98ce\u9669\u88ab\u660e\u663e\u4f4e\u4f30\uff0c\u5e76\u5f3a\u8c03\u9694\u79bb\u4e0d\u8db3\u5bfc\u81f4\u6f0f\u6d1e\u8de8\u5c42\u4f20\u64ad\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present Ego-OSCAR, an open-hardware, low-cost, head-mounted stereo-inertial capture device for egocentric data collection in the wild. EgoOSCAR pairs a hardware-synchronized global-shutter stereo camera with a 6- axis IMU, an embedded Linux SBC for on-device video encoding, and a realtime microcontroller for user feedback and watchdog functions. The complete bill of materials is under USD 200 per unit, using only commercially available components and 3D-printed parts. Alongside the device, we release a complete software stack (hardware-accelerated recording pipeline, IMU sampling daemon, time-synchronization tooling, and watchdog firmware) and roughly 550 hours of egocentric stereo video per camera with synchronized IMU, collected by a distributed contributor network across everyday indoor environments. The release is annotated rather than raw: free-form action captions cover essentially the entire recorded timeline with an open vocabulary, and per-frame 3D hand reconstructions ship alongside per-session stereo calibration. Ego-OSCAR does not aim to match the per-unit fidelity of research-grade systems such as Project Aria; it aims to be the cheapest defensible substrate for crowdsourced egocentric capture, and to lower the activation energy for any team that wants to collect egocentric data at scale. All hardware designs, software, and the dataset are open-sourced", "arxiv_id": "2608.08285", "arxiv_url": "https://arxiv.org/abs/2608.08285", "authors": ["Gunjan Paul", "Senthil Palanisamy", "Satpal Singh Rathore", "Pratyush Kumar Patnaik", "Shubhanshu Khatana", "Abhishek Anand"], "brief": "\u8bba\u6587\u63d0\u51fa Ego-OSCAR\uff0c\u4e00\u4e2a\u4f4e\u4e8e200\u7f8e\u5143\u7684\u5f00\u6e90\u5934\u6234\u5f0f\u53cc\u76ee\u60ef\u6027\u91c7\u96c6\u8bbe\u5907\uff0c\u5e76\u914d\u5957\u53d1\u5e03\u5b8c\u6574\u8f6f\u786c\u4ef6\u6808\u4e0e\u5927\u89c4\u6a21\u81ea\u6211\u4e2d\u5fc3\u6570\u636e\u96c6\u3002\u6570\u636e\u5305\u542b\u7ea6550\u5c0f\u65f6\u540c\u6b65\u53cc\u76ee\u89c6\u9891\u4e0eIMU\u3001\u5f00\u653e\u8bcd\u8868\u52a8\u4f5c\u6807\u6ce8\u3001\u9010\u5e273D\u624b\u90e8\u91cd\u5efa\u548c\u6807\u5b9a\u4fe1\u606f\u3002", "categories": ["cs.CV", "cs.AR", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08285", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u786c\u4ef6\u91c7\u7528\u540c\u6b65\u5168\u5c40\u5feb\u95e8\u53cc\u76ee\u76f8\u673a\u30016\u8f74IMU\u3001\u5d4c\u5165\u5f0fLinux\u5355\u677f\u673a\u548c\u5b9e\u65f6\u5fae\u63a7\u5236\u5668\uff0c\u652f\u6301\u91ce\u5916\u81ea\u6211\u4e2d\u5fc3\u89c6\u9891\u91c7\u96c6", "\u6574\u673a\u7269\u6599\u6210\u672c\u4f4e\u4e8e200\u7f8e\u5143\uff0c\u4f7f\u7528\u5546\u7528\u7ec4\u4ef6\u548c3D\u6253\u5370\u7ed3\u6784\uff0c\u9762\u5411\u53ef\u4f17\u5305\u3001\u53ef\u89c4\u6a21\u5316\u90e8\u7f72", "\u5f00\u6e90\u786c\u4ef6\u8bbe\u8ba1\u3001\u5f55\u5236\u7ba1\u7ebf\u3001IMU\u91c7\u6837\u3001\u65f6\u95f4\u540c\u6b65\u4e0e\u770b\u95e8\u72d7\u56fa\u4ef6\uff0c\u5e76\u53d1\u5e03\u5e26\u52a8\u4f5c\u5b57\u5e55\u548c3D\u624b\u90e8\u91cd\u5efa\u7684\u6570\u636e\u96c6"], "keywords": ["\u81ea\u6211\u4e2d\u5fc3\u89c6\u89c9", "\u5f00\u6e90\u786c\u4ef6", "\u591a\u6a21\u6001\u6570\u636e\u96c6", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": "FPV Labs", "pdf_url": "https://arxiv.org/pdf/2608.08285v1", "published_at": "2026-08-08", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08285.png", "title": "Ego-OSCAR: Egocentric Open source Stereo CAptuRe System", "tldr": "\u4f4e\u6210\u672c\u5f00\u6e90\u5934\u6234\u5f0f\u81ea\u6211\u4e2d\u5fc3\u91c7\u96c6\u7cfb\u7edf", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa Ego-OSCAR\uff0c\u4e00\u4e2a\u4f4e\u4e8e200\u7f8e\u5143\u7684\u5f00\u6e90\u5934\u6234\u5f0f\u53cc\u76ee\u60ef\u6027\u91c7\u96c6\u8bbe\u5907\uff0c\u5e76\u914d\u5957\u53d1\u5e03\u5b8c\u6574\u8f6f\u786c\u4ef6\u6808\u4e0e\u5927\u89c4\u6a21\u81ea\u6211\u4e2d\u5fc3\u6570\u636e\u96c6\u3002\u6570\u636e\u5305\u542b\u7ea6550\u5c0f\u65f6\u540c\u6b65\u53cc\u76ee\u89c6\u9891\u4e0eIMU\u3001\u5f00\u653e\u8bcd\u8868\u52a8\u4f5c\u6807\u6ce8\u3001\u9010\u5e273D\u624b\u90e8\u91cd\u5efa\u548c\u6807\u5b9a\u4fe1\u606f\u3002", "why_notable": "\u5b83\u964d\u4f4e\u4e86\u5927\u89c4\u6a21\u81ea\u6211\u4e2d\u5fc3\u89c6\u89c9\u6570\u636e\u91c7\u96c6\u7684\u95e8\u69db\uff0c\u4e3a\u5177\u8eab\u667a\u80fd\u3001AR/VR\u3001\u4eba\u624b\u4ea4\u4e92\u548c\u673a\u5668\u4eba\u5b66\u4e60\u63d0\u4f9b\u4e86\u53ef\u590d\u5236\u3001\u4f4e\u6210\u672c\u7684\u6570\u636e\u57fa\u7840\u8bbe\u65bd\u3002"}, {"abstract": "Fine-tuning a large language model on new data degrades what it previously learned. We present Omega-S, a drop-in penalty computed from the weight matrix alone: it needs no previous-task data, no Fisher matrix and no stored copy of the old weights. It is three lines in an existing training loop and adds under 4% to the cost of a step. Retention. On Llama-3-8B with LoRA, fine-tuned from code to prose and measured by HumanEval over ten seeds, Omega-S retains more of the original capability than no regularisation on 9 of 10 seeds (0.173 -\u003e 0.238 absolute pass@1; sign test one-sided p=0.011, Wilcoxon p=0.006), as a retention ratio, 62.9% -\u003e 84.1%. It also beats tuned weight decay on 10 of 10 seeds (p=0.002) and tuned EWC on 8 of 10 (p=0.014), every arm re-measured in the same session. Mechanism, measured rather than asserted. Omega-S is topological by construction, its objective built from Tr(A^3), but we measured which of its four factors actually moves and three do not: their elasticity with respect to the weights is at or below 1e-4, against 9e-3 for the degree-variance term. As implemented, the composite reduces to a penalty on the variance of node degrees, which means row magnitude in square modules and directional alignment in non-square ones. We report this because a method whose name promises one thing and whose gradient does another should say so. We also enumerate the open design choices, including a contrast-preserving construction that does what it was designed to do and makes retention worse on all ten seeds. Repeating an identical configuration, same seed and same hardware, gives a standard deviation of 0.104 in retention ratio. We have not found this quantified for low-rank fine-tuning of language models, and it bounds every seed-paired comparison in this literature, ours included. Code, per-seed results and the full record of negative results are available.", "arxiv_id": "2608.03887", "arxiv_url": "https://arxiv.org/abs/2608.03887", "authors": ["Alberto Acedo"], "brief": "\u8bba\u6587\u63d0\u51fa Omega-S\uff0c\u4e00\u79cd\u4ec5\u4f9d\u8d56\u5f53\u524d\u6743\u91cd\u77e9\u9635\u7684\u5fae\u8c03\u6b63\u5219\u60e9\u7f5a\uff0c\u7528\u4e8e\u63d0\u5347\u5927\u6a21\u578b\u5728\u65b0\u4efb\u52a1\u5fae\u8c03\u540e\u7684\u65e7\u80fd\u529b\u4fdd\u7559\u3002\u5b83\u65e0\u9700\u65e7\u4efb\u52a1\u6570\u636e\u3001Fisher \u77e9\u9635\u6216\u65e7\u6743\u91cd\u526f\u672c\uff0c\u53ef\u76f4\u63a5\u52a0\u5165\u73b0\u6709\u8bad\u7ec3\u5faa\u73af\u3002", "categories": ["cs.LG", "cs.NE", "q-bio.MN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03887", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 Llama-3-8B + LoRA \u4ece\u4ee3\u7801\u5fae\u8c03\u5230\u6563\u6587\u7684\u5b9e\u9a8c\u4e2d\uff0cOmega-S \u5728 HumanEval \u4e0a\u663e\u8457\u63d0\u5347\u65e7\u80fd\u529b\u4fdd\u7559\uff0cpass@1 \u4ece 0.173 \u63d0\u5347\u5230 0.238\uff0c\u4fdd\u7559\u7387\u4ece 62.9% \u63d0\u5347\u5230 84.1%\u3002", "\u76f8\u6bd4\u65e0\u6b63\u5219\u3001\u8c03\u53c2\u540e\u7684 weight decay \u548c EWC\uff0cOmega-S \u5728\u591a\u6570\u79cd\u5b50\u4e0a\u8868\u73b0\u66f4\u597d\uff0c\u4e14\u5355\u6b65\u8bad\u7ec3\u6210\u672c\u589e\u52a0\u4f4e\u4e8e 4%\u3002", "\u4f5c\u8005\u5b9e\u6d4b\u673a\u5236\u53d1\u73b0\uff0c\u540d\u4e49\u4e0a\u57fa\u4e8e Tr(A^3) \u7684\u62d3\u6251\u76ee\u6807\uff0c\u5b9e\u9645\u68af\u5ea6\u4e3b\u8981\u9000\u5316\u4e3a\u5bf9\u8282\u70b9\u5ea6\u65b9\u5dee\u7684\u60e9\u7f5a\uff0c\u5e76\u62a5\u544a\u4e86\u8d1f\u7ed3\u679c\u4e0e\u91cd\u590d\u5b9e\u9a8c\u65b9\u5dee\u3002"], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u5927\u6a21\u578b\u5fae\u8c03", "LoRA", "\u6b63\u5219\u5316"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03887v1", "published_at": "2026-08-04", "score": 0.222, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03887.png", "title": "Omega-S: A Functional Resilience Index for LLM Fine-Tuning", "tldr": "Omega-S\u4f4e\u6210\u672c\u7f13\u89e3\u5fae\u8c03\u9057\u5fd8", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Omega-S\uff0c\u4e00\u79cd\u4ec5\u4f9d\u8d56\u5f53\u524d\u6743\u91cd\u77e9\u9635\u7684\u5fae\u8c03\u6b63\u5219\u60e9\u7f5a\uff0c\u7528\u4e8e\u63d0\u5347\u5927\u6a21\u578b\u5728\u65b0\u4efb\u52a1\u5fae\u8c03\u540e\u7684\u65e7\u80fd\u529b\u4fdd\u7559\u3002\u5b83\u65e0\u9700\u65e7\u4efb\u52a1\u6570\u636e\u3001Fisher \u77e9\u9635\u6216\u65e7\u6743\u91cd\u526f\u672c\uff0c\u53ef\u76f4\u63a5\u52a0\u5165\u73b0\u6709\u8bad\u7ec3\u5faa\u73af\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u63d0\u4f9b\u4e86\u4e00\u79cd\u51e0\u4e4e\u65e0\u9700\u989d\u5916\u5b58\u50a8\u548c\u6570\u636e\u7684\u6297\u9057\u5fd8\u6b63\u5219\u65b9\u6cd5\uff0c\u9002\u5408\u4f4e\u79e9\u5fae\u8c03\u573a\u666f\uff1b\u540c\u65f6\u5bf9\u65b9\u6cd5\u771f\u5b9e\u4f5c\u7528\u673a\u5236\u548c\u968f\u673a\u6027\u8fb9\u754c\u8fdb\u884c\u4e86\u900f\u660e\u91cf\u5316\uff0c\u5bf9\u6301\u7eed\u5b66\u4e60\u4e0e\u5927\u6a21\u578b\u5fae\u8c03\u5b9e\u8df5\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM) agents are increasingly deployed as personal assistants. Existing evaluations, however, mostly use short, self-contained requests in static environments. Everyday life assistance is different. A task runs for weeks rather than minutes. The world keeps changing while the agent is not being prompted. Many constraints are never stated outright. An agent that merely answers the request in front of it will fail at such a task. What is needed instead is an agent that stays proactive and consistent. It decides on its own when to act, when to ask, and when to stay silent. It notices changes that nobody announced. It keeps one plan coherent from the first day to the last. No current benchmark measures this. We introduce VibeLifeBench, a benchmark of 200 long-horizon tasks across ten everyday-life domains. Each task is a scripted multi-week timeline in a simulated world of 22 mock services. The world advances on its own clock, and many of its changes are silent, so only an agent that re-inspects the world discovers them. Every task is graded by fine-grained, weighted checks that read only what the agent actually left behind, covering the end state, the timeliness of its actions, and whether it upheld the implicit constraints. We evaluate seven frontier models. All of them score low, which shows how far current agents are from assisting with real life. We will open-source all tasks, environments, and the evaluation framework.", "arxiv_id": "2608.10875", "arxiv_url": "https://arxiv.org/abs/2608.10875", "authors": ["Xiaohongshu Inc"], "brief": "\u8bba\u6587\u63d0\u51fa VibeLifeBench\uff0c\u4e00\u4e2a\u9762\u5411\u4e2a\u4eba\u751f\u6d3b\u52a9\u624b\u7684\u957f\u5468\u671f\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5305\u542b 10 \u4e2a\u65e5\u5e38\u751f\u6d3b\u9886\u57df\u7684 200 \u4e2a\u591a\u5468\u4efb\u52a1\u3002\u5b83\u5728\u542b 22 \u4e2a\u6a21\u62df\u670d\u52a1\u7684\u52a8\u6001\u4e16\u754c\u4e2d\u8003\u5bdf\u667a\u80fd\u4f53\u80fd\u5426\u4e3b\u52a8\u68c0\u67e5\u53d8\u5316\u3001\u6301\u7eed\u6267\u884c\u8ba1\u5212\u5e76\u9075\u5b88\u9690\u542b\u7ea6\u675f\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10875", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4efb\u52a1\u4e16\u754c\u4f1a\u6309\u81ea\u8eab\u65f6\u949f\u63a8\u8fdb\uff0c\u8bb8\u591a\u53d8\u5316\u4e0d\u4f1a\u663e\u5f0f\u901a\u77e5\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u4e3b\u52a8\u91cd\u65b0\u68c0\u67e5\u73af\u5883\u3002", "\u8bc4\u6d4b\u4e0d\u4ec5\u770b\u6700\u7ec8\u72b6\u6001\uff0c\u8fd8\u7528\u7ec6\u7c92\u5ea6\u52a0\u6743\u68c0\u67e5\u8861\u91cf\u884c\u52a8\u65f6\u6548\u6027\u3001\u8ba1\u5212\u4e00\u81f4\u6027\u548c\u9690\u542b\u7ea6\u675f\u9075\u5b88\u60c5\u51b5\u3002", "\u5bf9 7 \u4e2a\u524d\u6cbf\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\u6574\u4f53\u5f97\u5206\u8f83\u4f4e\uff0c\u8868\u660e\u5f53\u524d LLM \u751f\u6d3b\u52a9\u624b\u8ddd\u79bb\u771f\u5b9e\u957f\u671f\u8f85\u52a9\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u957f\u671f\u89c4\u5212", "\u4e2a\u4eba\u52a9\u624b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10875v1", "published_at": "2026-08-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "VibeLifeBench: Can Your Life Agent Be Proactive and Persistent in a Living World?", "tldr": "\u8bc4\u6d4b\u957f\u671f\u751f\u6d3b\u667a\u80fd\u4f53\u7684\u4e3b\u52a8\u4e0e\u6301\u4e45\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VibeLifeBench\uff0c\u4e00\u4e2a\u9762\u5411\u4e2a\u4eba\u751f\u6d3b\u52a9\u624b\u7684\u957f\u5468\u671f\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5305\u542b 10 \u4e2a\u65e5\u5e38\u751f\u6d3b\u9886\u57df\u7684 200 \u4e2a\u591a\u5468\u4efb\u52a1\u3002\u5b83\u5728\u542b 22 \u4e2a\u6a21\u62df\u670d\u52a1\u7684\u52a8\u6001\u4e16\u754c\u4e2d\u8003\u5bdf\u667a\u80fd\u4f53\u80fd\u5426\u4e3b\u52a8\u68c0\u67e5\u53d8\u5316\u3001\u6301\u7eed\u6267\u884c\u8ba1\u5212\u5e76\u9075\u5b88\u9690\u542b\u7ea6\u675f\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u77ed\u65f6\u3001\u9759\u6001\u3001\u663e\u5f0f\u8bf7\u6c42\u63a8\u8fdb\u5230\u591a\u5468\u3001\u52a8\u6001\u3001\u9690\u542b\u7ea6\u675f\u7684\u771f\u5b9e\u751f\u6d3b\u573a\u666f\uff0c\u66f4\u80fd\u68c0\u9a8c\u4e2a\u4eba\u52a9\u624b\u6240\u9700\u7684\u4e3b\u52a8\u6027\u3001\u6301\u4e45\u6027\u548c\u4e00\u81f4\u6027\uff0c\u5bf9\u672a\u6765\u751f\u6d3b\u7c7b LLM agent \u7684\u7814\u53d1\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Omni-modal dialogue models can understand multimodal inputs and synthesize spoken replies, yet their responses remain visually disembodied. We introduce \\textbf{Ex-Omni-2D}, an omni-modal dialogue framework that generates a coordinated response comprising text, personalized speech, and reference-conditioned video. Given a multimodal query, reference image, and reference audio, the model predicts a structured \\textit{Visual Thought Plan} (VTP) describing scene, emotion, and motion, followed by response text and native multi-codebook speech units. These units form a shared acoustic-temporal interface: they are decoded into speech and aligned online with video frames. This interface enables the response and avatar pathways to be learned from heterogeneous speech, dialogue, and avatar-video data, avoiding the need for large-scale query--text--speech--video supervision. A full-sequence Video Generator serves as the primary Teacher. For efficient incremental generation, we further distill it into a few-step block-causal \\emph{Streaming Student} whose Prefix Streaming mechanism carries a clean latent across consecutive chunks to reduce cumulative late-chunk degradation. With four-step inference, the complete four-GPU pipeline achieves an end-to-end RTF of 1.293 at $400\\times720$/$720\\times400$, providing a practical quality--efficiency operating point.", "arxiv_id": "2608.10720", "arxiv_url": "https://arxiv.org/abs/2608.10720", "authors": ["Haoyu Zhang", "Zhipeng Li", "Xiaoying Tang", "Tianshu Yu", "Yiwen Guo"], "brief": "Ex-Omni-2D \u662f\u4e00\u4e2a\u5168\u6a21\u6001\u5bf9\u8bdd\u6846\u67b6\uff0c\u53ef\u6839\u636e\u591a\u6a21\u6001\u67e5\u8be2\u3001\u53c2\u8003\u56fe\u50cf\u548c\u53c2\u8003\u97f3\u9891\uff0c\u751f\u6210\u534f\u8c03\u4e00\u81f4\u7684\u6587\u672c\u3001\u4e2a\u6027\u5316\u8bed\u97f3\u4e0e\u53c2\u8003\u6761\u4ef6\u89c6\u9891\u56de\u5e94\u3002\u5b83\u901a\u8fc7\u89c6\u89c9\u601d\u7ef4\u8ba1\u5212\uff08VTP\uff09\u663e\u5f0f\u5efa\u6a21\u573a\u666f\u3001\u60c5\u7eea\u548c\u52a8\u4f5c\uff0c\u4f7f\u5bf9\u8bdd\u56de\u590d\u62e5\u6709\u201c\u89c6\u89c9\u5b58\u5728\u611f\u201d\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10720", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Visual Thought Plan\uff0c\u5148\u9884\u6d4b\u573a\u666f\u3001\u60c5\u7eea\u3001\u52a8\u4f5c\u7b49\u7ed3\u6784\u5316\u89c6\u89c9\u610f\u56fe\uff0c\u518d\u751f\u6210\u6587\u672c\u4e0e\u591a\u7801\u672c\u8bed\u97f3\u5355\u5143\u3002", "\u4f7f\u7528\u5171\u4eab\u7684\u58f0\u5b66-\u65f6\u95f4\u63a5\u53e3\uff0c\u5c06\u8bed\u97f3\u5355\u5143\u540c\u65f6\u89e3\u7801\u4e3a\u8bed\u97f3\u5e76\u5728\u7ebf\u5bf9\u9f50\u5230\u89c6\u9891\u5e27\uff0c\u964d\u4f4e\u5bf9\u5927\u89c4\u6a21\u67e5\u8be2-\u6587\u672c-\u8bed\u97f3-\u89c6\u9891\u6210\u5bf9\u6570\u636e\u7684\u4f9d\u8d56\u3002", "\u91c7\u7528\u5168\u5e8f\u5217\u89c6\u9891\u751f\u6210\u5668\u4f5c\u4e3a Teacher\uff0c\u5e76\u84b8\u998f\u51fa\u5c11\u6b65 block-causal Streaming Student\uff1b\u56db\u6b65\u63a8\u7406\u4e0b\u56db\u5361\u7aef\u5230\u7aef RTF \u8fbe\u5230 1.293\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5bf9\u8bdd\u7cfb\u7edf", "\u6570\u5b57\u4eba", "\u89c6\u9891\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10720v1", "published_at": "2026-08-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Ex-Omni-2D: Expressive Omni-Modal Dialogue Models with Native Visual Presence", "tldr": "\u8ba9\u5168\u6a21\u6001\u5bf9\u8bdd\u6a21\u578b\u5177\u5907\u53ef\u89c6\u5316\u771f\u4eba\u5316\u8eab\u56de\u5e94\u3002", "upvotes": 0, "what_it_is": "Ex-Omni-2D \u662f\u4e00\u4e2a\u5168\u6a21\u6001\u5bf9\u8bdd\u6846\u67b6\uff0c\u53ef\u6839\u636e\u591a\u6a21\u6001\u67e5\u8be2\u3001\u53c2\u8003\u56fe\u50cf\u548c\u53c2\u8003\u97f3\u9891\uff0c\u751f\u6210\u534f\u8c03\u4e00\u81f4\u7684\u6587\u672c\u3001\u4e2a\u6027\u5316\u8bed\u97f3\u4e0e\u53c2\u8003\u6761\u4ef6\u89c6\u9891\u56de\u5e94\u3002\u5b83\u901a\u8fc7\u89c6\u89c9\u601d\u7ef4\u8ba1\u5212\uff08VTP\uff09\u663e\u5f0f\u5efa\u6a21\u573a\u666f\u3001\u60c5\u7eea\u548c\u52a8\u4f5c\uff0c\u4f7f\u5bf9\u8bdd\u56de\u590d\u62e5\u6709\u201c\u89c6\u89c9\u5b58\u5728\u611f\u201d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5168\u6a21\u6001\u5bf9\u8bdd\u4ece\u201c\u80fd\u542c\u4f1a\u8bf4\u201d\u63a8\u8fdb\u5230\u201c\u6709\u5f62\u8c61\u5730\u8bf4\u201d\uff0c\u5728\u8bed\u97f3\u3001\u6587\u672c\u548c\u5934\u50cf\u89c6\u9891\u4e4b\u95f4\u5efa\u7acb\u7edf\u4e00\u751f\u6210\u63a5\u53e3\uff0c\u517c\u987e\u4e2a\u6027\u5316\u3001\u6570\u636e\u6548\u7387\u4e0e\u6d41\u5f0f\u63a8\u7406\u6548\u7387\uff0c\u5bf9\u865a\u62df\u52a9\u624b\u3001\u6570\u5b57\u4eba\u548c\u5b9e\u65f6\u4ea4\u4e92\u7cfb\u7edf\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are increasingly deployed as mobile assistants, where a key challenge is leveraging personal information scattered across multiple applications (apps) to complete user instructions. However, due to the lack of dedicated benchmarks, their capabilities remain poorly understood. To address this gap, we introduce SPIEval, a human-curated benchmark grounded in five cognitive capabilities (i.e., reasoning, disambiguation, integration, preference inference, and multi-intent decomposition). SPIEval comprises 250 tasks spanning 4,335 personal records distributed across 10 apps and supports multi-turn interaction through 21 tools. Analysis shows that the benchmark exhibits diverse scenarios, challenging tasks, scattered information, controllable environments, and verifiable outcomes. We evaluate nine representative LLMs and find substantial room for improvement. The best-performing model, GPT-5.5 (xhigh), achieves only 57.3% accuracy, while the weakest achieves just 16.4%. Further analysis reveals that 79% of failures stem from inaccurate information localization, as LLMs often commit to plausible but incorrect information instead of continuing retrieval for verification. We also find that fewer than 2% of retrieval actions employ advanced search methods and observe substantial variation in search efficiency across models. These findings expose fundamental limitations of current LLM-based mobile assistants and motivate future research in this direction. Data and code are available at https://huggingface.co/datasets/Junjie-Ye/SPIEval.", "arxiv_id": "2608.10692", "arxiv_url": "https://arxiv.org/abs/2608.10692", "authors": ["Junjie Ye", "Zhuohui Sheng", "Shaofan Liu", "Yulun Zhu", "Wenjie Fu", "Dingwei Zhu", "Ming Zhang", "Yujiong Shen", "Weichao Wang", "Xin Zhao", "Shihan Dou", "Tao Gui", "Qi Zhang", "Xuanjing Huang", "Pluto Zhou"], "brief": "\u8bba\u6587\u63d0\u51faSPIEval\uff0c\u4e00\u4e2a\u9762\u5411\u79fb\u52a8\u52a9\u624b\u7684\u4eba\u5de5\u6784\u5efa\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30LLM\u5728\u591a\u5e94\u7528\u5206\u6563\u4e2a\u4eba\u4fe1\u606f\u4e0a\u5b8c\u6210\u7528\u6237\u6307\u4ee4\u7684\u80fd\u529b\u3002\u5b83\u8986\u76d6\u63a8\u7406\u3001\u6d88\u6b67\u3001\u4fe1\u606f\u6574\u5408\u3001\u504f\u597d\u63a8\u65ad\u548c\u591a\u610f\u56fe\u5206\u89e3\u4e94\u7c7b\u8ba4\u77e5\u80fd\u529b\uff0c\u5e76\u652f\u6301\u591a\u8f6e\u5de5\u5177\u4ea4\u4e92\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10692", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5305\u542b250\u4e2a\u4efb\u52a1\u3001\u5206\u5e03\u572810\u4e2a\u5e94\u7528\u4e2d\u76844335\u6761\u4e2a\u4eba\u8bb0\u5f55\uff0c\u5e76\u63d0\u4f9b21\u4e2a\u5de5\u5177\u652f\u6301\u53ef\u63a7\u591a\u8f6e\u4ea4\u4e92\u3002", "\u8bc4\u6d4b9\u4e2a\u4ee3\u8868\u6027LLM\uff0c\u6700\u4f73\u6a21\u578b\u51c6\u786e\u7387\u4ec557.3%\uff0c\u6700\u5f31\u6a21\u578b\u4e3a16.4%\uff0c\u663e\u793a\u79fb\u52a8\u52a9\u624b\u80fd\u529b\u4ecd\u660e\u663e\u4e0d\u8db3\u3002", "79%\u7684\u5931\u8d25\u6765\u81ea\u4fe1\u606f\u5b9a\u4f4d\u4e0d\u51c6\uff0c\u6a21\u578b\u5e38\u8fc7\u65e9\u76f8\u4fe1\u770b\u4f3c\u5408\u7406\u4f46\u9519\u8bef\u7684\u4fe1\u606f\uff1b\u9ad8\u7ea7\u641c\u7d22\u52a8\u4f5c\u5360\u6bd4\u4e0d\u8db32%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u79fb\u52a8\u52a9\u624b", "\u4fe1\u606f\u68c0\u7d22", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10692v1", "published_at": "2026-08-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SPIEval: Evaluating Large Language Models as Mobile Assistants over Scattered Personal Information", "tldr": "SPIEval\u8bc4\u6d4bLLM\u8de8\u5e94\u7528\u5229\u7528\u4e2a\u4eba\u4fe1\u606f\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faSPIEval\uff0c\u4e00\u4e2a\u9762\u5411\u79fb\u52a8\u52a9\u624b\u7684\u4eba\u5de5\u6784\u5efa\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30LLM\u5728\u591a\u5e94\u7528\u5206\u6563\u4e2a\u4eba\u4fe1\u606f\u4e0a\u5b8c\u6210\u7528\u6237\u6307\u4ee4\u7684\u80fd\u529b\u3002\u5b83\u8986\u76d6\u63a8\u7406\u3001\u6d88\u6b67\u3001\u4fe1\u606f\u6574\u5408\u3001\u504f\u597d\u63a8\u65ad\u548c\u591a\u610f\u56fe\u5206\u89e3\u4e94\u7c7b\u8ba4\u77e5\u80fd\u529b\uff0c\u5e76\u652f\u6301\u591a\u8f6e\u5de5\u5177\u4ea4\u4e92\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u586b\u8865\u4e86LLM\u79fb\u52a8\u52a9\u624b\u5728\u8de8\u5e94\u7528\u4e2a\u4eba\u4fe1\u606f\u5229\u7528\u65b9\u9762\u7684\u4e13\u95e8\u8bc4\u6d4b\u7a7a\u767d\uff0c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u5728\u68c0\u7d22\u9a8c\u8bc1\u3001\u4fe1\u606f\u5b9a\u4f4d\u548c\u641c\u7d22\u7b56\u7565\u4e0a\u7684\u57fa\u7840\u77ed\u677f\uff0c\u5bf9\u4e2a\u4ebaAI\u52a9\u624b\u548c\u667a\u80fd\u4f53\u5de5\u5177\u4f7f\u7528\u7814\u7a76\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM)-based search agents answer questions through multi-step interactions with external environments. However, providing complete execution trajectories to the LLM causes unbounded context growth and introduces noise. Existing compression methods reduce context at the cost of important details and often replace erroneous facts without repairing downstream reasoning derived from them. To address this problem, we propose ReTree, a self-correcting tree-structured memory mechanism for search agents. ReTree constructs a bounded per-step reasoning context while preserving source-linked evidence. It models search as an evidence tree whose nodes store bounded summaries, evidence, and revision histories. When newly retrieved evidence contradicts an earlier claim, ReTree traces back to the node where the claim was introduced, replaces outdated evidence, regenerates summaries, prunes affected branches, and resumes search. Source-grounded evidence provenance supports reliable conflict localization and keeps final claims traceable to retrieved passages. Experiments on four public question-answering and search benchmarks show that ReTree consistently outperforms Full-Trajectory ReAct, improving answer accuracy by up to 25.6 percentage points (pp); the average maximum per-step reasoning context of Full-Trajectory ReAct is $1.27$--$1.51\\times$ that of ReTree. These results establish ReTree as an effective self-correcting memory abstraction for long-horizon search.", "arxiv_id": "2608.10676", "arxiv_url": "https://arxiv.org/abs/2608.10676", "authors": ["Aijun Yang", "Qianxue Guo", "Ziyi Huang", "Yuxuan Chen", "Shiyou Qian", "Jian Cao"], "brief": "\u8bba\u6587\u63d0\u51fa ReTree\uff0c\u4e00\u79cd\u9762\u5411 LLM \u641c\u7d22\u667a\u80fd\u4f53\u7684\u81ea\u7ea0\u9519\u6811\u7ed3\u6784\u8bb0\u5fc6\u673a\u5236\u3002\u5b83\u5c06\u641c\u7d22\u8fc7\u7a0b\u5efa\u6a21\u4e3a\u8bc1\u636e\u6811\uff0c\u5728\u4fdd\u6301\u4e0a\u4e0b\u6587\u6709\u754c\u7684\u540c\u65f6\u4fdd\u7559\u6765\u6e90\u8bc1\u636e\u3001\u4fee\u8ba2\u5386\u53f2\uff0c\u5e76\u5728\u53d1\u73b0\u77db\u76fe\u8bc1\u636e\u65f6\u56de\u6eaf\u4fee\u590d\u53d7\u5f71\u54cd\u63a8\u7406\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10676", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6bcf\u4e2a\u8bc1\u636e\u6811\u8282\u70b9\u5b58\u50a8\u6709\u754c\u6458\u8981\u3001\u6765\u6e90\u8bc1\u636e\u548c\u4fee\u8ba2\u5386\u53f2\uff0c\u907f\u514d\u5b8c\u6574\u8f68\u8ff9\u5bfc\u81f4\u7684\u4e0a\u4e0b\u6587\u81a8\u80c0\u4e0e\u566a\u58f0\u7d2f\u79ef\u3002", "\u5f53\u65b0\u68c0\u7d22\u8bc1\u636e\u4e0e\u65e7\u7ed3\u8bba\u51b2\u7a81\u65f6\uff0cReTree \u53ef\u5b9a\u4f4d\u6700\u521d\u5f15\u5165\u9519\u8bef\u4e3b\u5f20\u7684\u8282\u70b9\uff0c\u66ff\u6362\u8bc1\u636e\u3001\u91cd\u751f\u6210\u6458\u8981\u3001\u526a\u679d\u53d7\u5f71\u54cd\u5206\u652f\u5e76\u7ee7\u7eed\u641c\u7d22\u3002", "\u5728\u56db\u4e2a\u516c\u5f00\u95ee\u7b54\u4e0e\u641c\u7d22\u57fa\u51c6\u4e0a\uff0cReTree \u76f8\u6bd4 Full-Trajectory ReAct \u6700\u9ad8\u63d0\u5347 25.6 \u4e2a\u767e\u5206\u70b9\u51c6\u786e\u7387\uff0c\u540c\u65f6\u964d\u4f4e\u6bcf\u6b65\u6700\u5927\u63a8\u7406\u4e0a\u4e0b\u6587\u957f\u5ea6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u95ee\u7b54", "\u8bb0\u5fc6\u673a\u5236", "\u81ea\u6211\u7ea0\u9519"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10676v1", "published_at": "2026-08-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Self-Correcting Long-Horizon Search Agents via Tree-Structured Memory", "tldr": "\u7528\u6811\u7ed3\u6784\u8bb0\u5fc6\u8ba9\u957f\u7a0b\u641c\u7d22\u667a\u80fd\u4f53\u81ea\u6211\u7ea0\u9519\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ReTree\uff0c\u4e00\u79cd\u9762\u5411 LLM \u641c\u7d22\u667a\u80fd\u4f53\u7684\u81ea\u7ea0\u9519\u6811\u7ed3\u6784\u8bb0\u5fc6\u673a\u5236\u3002\u5b83\u5c06\u641c\u7d22\u8fc7\u7a0b\u5efa\u6a21\u4e3a\u8bc1\u636e\u6811\uff0c\u5728\u4fdd\u6301\u4e0a\u4e0b\u6587\u6709\u754c\u7684\u540c\u65f6\u4fdd\u7559\u6765\u6e90\u8bc1\u636e\u3001\u4fee\u8ba2\u5386\u53f2\uff0c\u5e76\u5728\u53d1\u73b0\u77db\u76fe\u8bc1\u636e\u65f6\u56de\u6eaf\u4fee\u590d\u53d7\u5f71\u54cd\u63a8\u7406\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u957f\u7a0b\u641c\u7d22\u667a\u80fd\u4f53\u4e2d\u7684\u9519\u8bef\u4f20\u64ad\u4e0e\u4e0a\u4e0b\u6587\u7206\u70b8\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u53ef\u8ffd\u6eaf\u3001\u53ef\u4fee\u590d\u7684\u8bb0\u5fc6\u62bd\u8c61\uff0c\u6709\u671b\u63d0\u5347\u590d\u6742\u68c0\u7d22\u95ee\u7b54\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\u4e0e\u53ef\u6269\u5c55\u6027\u3002"}, {"abstract": "In large-scale pretraining, the algorithm, architecture, and systems decisions are conventionally made in disconnected stages. A scaling law stage selects an architecture and training recipe, optimizing loss under compute constraints, and a separate systems stage then optimizes the implementation for hardware efficiency. In this work, we develop MOSAIC, which formulates model architecture and systems co-design as an optimization problem. MOSAIC couples a predictive scaling law with a calibrated performance model that estimates Model FLOPs Utilization (MFU), communication cost, memory footprint, and the best parallel layout. We instantiate the framework for sparse Mixture-of-Experts (MoE) language models, where expert count, routing sparsity, and other MoE layer dimensions affect both the loss and systems efficiency. We fit a scaling law on sparse MoE models trained on text data, whose scaling dimensions include the sparsity factor, which is the fraction of model parameters inactive per token in a forward pass. The scaling law sweeps in our work span active parameters from $104$ million to $2.7$ billion and total model sizes reaching $79$ billion parameters. We show that, within the calibrated sparsity range, an efficiency-agnostic model-FLOPs budget admits no interior optimal sparsity. The fitted loss decreases monotonically with sparser models and the compute optimum lies at the upper boundary of the data support. An optimal sparsity in MoE models instead emerges under the cluster\u0027s systems constraints, as captured by MOSAIC. Our results argue for a shift towards unified architecture and systems co-design for frontier language model training.", "arxiv_id": "2608.10605", "arxiv_url": "https://arxiv.org/abs/2608.10605", "authors": ["Soumajyoti Sarkar", "Yuxin Tang", "Sheng Zha"], "brief": "\u8bba\u6587\u63d0\u51faMOSAIC\u6846\u67b6\uff0c\u5c06\u7a00\u758fMoE\u8bed\u8a00\u6a21\u578b\u7684\u7f29\u653e\u5f8b\u4e0e\u7cfb\u7edf\u6027\u80fd\u6a21\u578b\u8054\u5408\u8d77\u6765\uff0c\u628a\u6a21\u578b\u67b6\u6784\u9009\u62e9\u548c\u96c6\u7fa4\u8bad\u7ec3\u6548\u7387\u4f5c\u4e3a\u540c\u4e00\u4e2a\u4f18\u5316\u95ee\u9898\u5904\u7406\u3002\u5b83\u540c\u65f6\u9884\u6d4b\u635f\u5931\u3001MFU\u3001\u901a\u4fe1\u6210\u672c\u3001\u663e\u5b58\u5360\u7528\u548c\u6700\u4f18\u5e76\u884c\u5e03\u5c40\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10605", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u7a00\u758fMoE\u9884\u8bad\u7ec3\u62df\u5408\u7f29\u653e\u5f8b\uff0c\u663e\u5f0f\u7eb3\u5165\u7a00\u758f\u56e0\u5b50\uff0c\u5373\u6bcf\u4e2atoken\u524d\u5411\u65f6\u4e0d\u6d3b\u8dc3\u53c2\u6570\u5360\u6bd4\u3002", "\u5b9e\u9a8c\u8986\u76d61.04\u4ebf\u523027\u4ebf\u6d3b\u8dc3\u53c2\u6570\u3001\u6700\u9ad8790\u4ebf\u603b\u53c2\u6570\u89c4\u6a21\u7684MoE\u6a21\u578b\u3002", "\u53d1\u73b0\u4ec5\u6309\u6a21\u578bFLOPs\u4f18\u5316\u65f6\uff0c\u635f\u5931\u968f\u66f4\u9ad8\u7a00\u758f\u5ea6\u5355\u8c03\u4e0b\u964d\uff1b\u771f\u6b63\u7684\u6700\u4f18\u7a00\u758f\u5ea6\u6765\u81ea\u96c6\u7fa4\u901a\u4fe1\u3001\u663e\u5b58\u548c\u5e76\u884c\u7b56\u7565\u7b49\u7cfb\u7edf\u7ea6\u675f\u3002"], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u7f29\u653e\u5f8b", "\u7cfb\u7edf\u4f18\u5316", "\u5927\u6a21\u578b\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10605v1", "published_at": "2026-08-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Compute-Optimal Is Not Cluster-Optimal: Systems-Aware Scaling for Sparse Mixture-of-Experts", "tldr": "\u63d0\u51faMOSAIC\u5171\u4f18\u5316MoE\u67b6\u6784\u4e0e\u96c6\u7fa4\u6548\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faMOSAIC\u6846\u67b6\uff0c\u5c06\u7a00\u758fMoE\u8bed\u8a00\u6a21\u578b\u7684\u7f29\u653e\u5f8b\u4e0e\u7cfb\u7edf\u6027\u80fd\u6a21\u578b\u8054\u5408\u8d77\u6765\uff0c\u628a\u6a21\u578b\u67b6\u6784\u9009\u62e9\u548c\u96c6\u7fa4\u8bad\u7ec3\u6548\u7387\u4f5c\u4e3a\u540c\u4e00\u4e2a\u4f18\u5316\u95ee\u9898\u5904\u7406\u3002\u5b83\u540c\u65f6\u9884\u6d4b\u635f\u5931\u3001MFU\u3001\u901a\u4fe1\u6210\u672c\u3001\u663e\u5b58\u5360\u7528\u548c\u6700\u4f18\u5e76\u884c\u5e03\u5c40\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u201c\u8ba1\u7b97\u6700\u4f18\u201d\u5e76\u4e0d\u7b49\u4e8e\u201c\u96c6\u7fa4\u6700\u4f18\u201d\uff0c\u6311\u6218\u4e86\u5148\u5b9a\u7f29\u653e\u5f8b\u518d\u505a\u7cfb\u7edf\u4f18\u5316\u7684\u4f20\u7edf\u6d41\u7a0b\u3002\u5bf9\u5927\u89c4\u6a21MoE\u8bad\u7ec3\u5177\u6709\u5b9e\u9645\u6307\u5bfc\u4ef7\u503c\uff0c\u5f3a\u8c03\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u9700\u8981\u67b6\u6784\u4e0e\u7cfb\u7edf\u534f\u540c\u8bbe\u8ba1\u3002"}, {"abstract": "Action verbs describe not only the physical outcomes of actions, but also how those actions are performed. Yet action representations in vision-language-action models (VLAs) are typically optimized for reconstruction under L1/L2 losses in raw action space, where numerical proximity need not reflect linguistically meaningful distinctions. On BridgeV2, we show that action trajectories contain verb-grounding information beyond visual state changes, and that reconstruction-only discrete tokenization systematically erodes this information. To address this problem, we introduce SALT, a Semantically ALigned action Tokenizer that augments a VQ-VAE-style tokenizer with an auxiliary objective requiring a frozen vision-language model to recover the episode instruction from quantized action latents. Policies trained with SALT achieve 71.9% average success in SimplerEnv, compared with 42.7% for a reconstruction-only VQ-VAE tokenizer and 31.2% for FAST. SALT also develops verb-specialized codes while maintaining reconstruction fidelity. These results show that robot action trajectories provide a source of language grounding and that preserving this structure in action representations can substantially improve language-conditioned control.", "arxiv_id": "2608.10484", "arxiv_url": "https://arxiv.org/abs/2608.10484", "authors": ["Li Wenjie", "Yash Jangir", "Ignacy Stepka", "Yash Agarwal", "Marion Kipsang", "Yonatan Bisk"], "brief": "\u8bba\u6587\u63d0\u51fa SALT\uff0c\u4e00\u79cd\u8bed\u4e49\u5bf9\u9f50\u7684\u673a\u5668\u4eba\u52a8\u4f5c tokenizer\uff0c\u5728 VQ-VAE \u5f0f\u79bb\u6563\u5316\u4e2d\u52a0\u5165\u8bed\u8a00\u6062\u590d\u8f85\u52a9\u76ee\u6807\u3002\u5b83\u5229\u7528\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4ece\u91cf\u5316\u52a8\u4f5c\u6f5c\u53d8\u91cf\u4e2d\u6062\u590d\u4efb\u52a1\u6307\u4ee4\uff0c\u4f7f\u52a8\u4f5c\u8868\u793a\u4fdd\u7559\u52a8\u8bcd\u76f8\u5173\u8bed\u4e49\u3002", "categories": ["cs.RO", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10484", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0 BridgeV2 \u4e2d\u52a8\u4f5c\u8f68\u8ff9\u672c\u8eab\u5305\u542b\u8d85\u8d8a\u89c6\u89c9\u72b6\u6001\u53d8\u5316\u7684\u52a8\u8bcd grounding \u4fe1\u606f\u3002", "\u4ec5\u7528 L1/L2 \u91cd\u6784\u76ee\u6807\u8bad\u7ec3\u7684\u79bb\u6563\u52a8\u4f5c tokenizer \u4f1a\u7cfb\u7edf\u6027\u524a\u5f31\u8bed\u8a00\u76f8\u5173\u52a8\u4f5c\u8bed\u4e49\u3002", "\u5728 SimplerEnv \u4e2d\uff0cSALT \u7b56\u7565\u5e73\u5747\u6210\u529f\u7387\u8fbe 71.9%\uff0c\u663e\u8457\u9ad8\u4e8e\u91cd\u6784\u5f0f VQ-VAE \u7684 42.7% \u548c FAST \u7684 31.2%\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u52a8\u4f5c\u8868\u793a", "\u8bed\u8a00\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10484v1", "published_at": "2026-08-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Lost in Reconstruction: Aligning Action Representations with Language in Vision-Language-Action Models", "tldr": "SALT\u8ba9\u673a\u5668\u4eba\u52a8\u4f5ctoken\u66f4\u8d34\u5408\u8bed\u8a00\u8bed\u4e49\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SALT\uff0c\u4e00\u79cd\u8bed\u4e49\u5bf9\u9f50\u7684\u673a\u5668\u4eba\u52a8\u4f5c tokenizer\uff0c\u5728 VQ-VAE \u5f0f\u79bb\u6563\u5316\u4e2d\u52a0\u5165\u8bed\u8a00\u6062\u590d\u8f85\u52a9\u76ee\u6807\u3002\u5b83\u5229\u7528\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4ece\u91cf\u5316\u52a8\u4f5c\u6f5c\u53d8\u91cf\u4e2d\u6062\u590d\u4efb\u52a1\u6307\u4ee4\uff0c\u4f7f\u52a8\u4f5c\u8868\u793a\u4fdd\u7559\u52a8\u8bcd\u76f8\u5173\u8bed\u4e49\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u673a\u5668\u4eba\u52a8\u4f5c\u8868\u793a\u4e0d\u5e94\u53ea\u8ffd\u6c42\u6570\u503c\u91cd\u6784\uff0c\u8fd8\u9700\u4fdd\u7559\u8bed\u8a00\u53ef\u533a\u5206\u7684\u52a8\u4f5c\u65b9\u5f0f\u4fe1\u606f\uff1b\u8fd9\u4e3a\u8bed\u8a00\u6761\u4ef6\u673a\u5668\u4eba\u63a7\u5236\u548c VLA \u6a21\u578b\u7684\u52a8\u4f5c token \u8bbe\u8ba1\u63d0\u4f9b\u4e86\u76f4\u63a5\u6709\u6548\u7684\u65b0\u65b9\u5411\u3002"}, {"abstract": "Vision-language models (VLMs) have shown strong capabilities in generating visualization code from textual or visual specifications. However, real-world visualization authoring is inherently iterative: users frequently revise existing visualizations to repair flawed charts or adapt them to desired styles. Existing benchmarks primarily evaluate generation from scratch, leaving visualization code editing from multimodal feedback largely unexplored. We introduce VisEditBench, a benchmark of 1,395 human-annotated visualization code-editing tasks grounded in realistic visualization workflows and failure cases. VisEditBench covers two practical settings: feedback-guided repair, where models revise visualization code using buggy or marked charts together with textual feedback, and reference-guided restyling, where models modify code to match a target chart image. Evaluating 20 state-of-the-art VLMs reveals that visualization code editing remains challenging: Claude-4.6-Sonnet achieves the best overall pass rate of 74.46%, while most open-source models remain below 50%. Performance is particularly weak on visually grounded style adaptation, where Claude-4.6-Sonnet achieves only 55.71%. To establish a strong baseline, we further propose VisEditAgent, a render-grounded editing framework that iteratively generates, executes, validates, and refines candidate edits. Built on GPT-4o, VisEditAgent improves overall pass rate from 55.75% to 67.99%, demonstrating the importance of render-grounded feedback for faithful visualization editing. We will release VisEditBench at https://github.com/vis-nlp/VisEditBench.", "arxiv_id": "2608.10408", "arxiv_url": "https://arxiv.org/abs/2608.10408", "authors": ["Mizanur Rahman", "Arshia Azimlu", "Shadikur Rahman", "Md Tahmid Rahman Laskar", "Amran Bhuiyan", "Shafiq Joty", "Enamul Hoque Prince"], "brief": "\u8bba\u6587\u63d0\u51fa VisEditBench\uff0c\u4e00\u4e2a\u5305\u542b1395\u4e2a\u4eba\u5de5\u6807\u6ce8\u4efb\u52a1\u7684\u53ef\u89c6\u5316\u4ee3\u7801\u7f16\u8f91\u57fa\u51c6\uff0c\u8986\u76d6\u57fa\u4e8e\u53cd\u9988\u7684\u4fee\u590d\u548c\u57fa\u4e8e\u53c2\u8003\u56fe\u7684\u98ce\u683c\u91cd\u5851\u4e24\u7c7b\u771f\u5b9e\u5de5\u4f5c\u6d41\u3002\u4f5c\u8005\u8bc4\u6d4b20\u4e2a\u4e3b\u6d41VLM\uff0c\u5e76\u63d0\u51fa VisEditAgent\uff0c\u901a\u8fc7\u6e32\u67d3\u53cd\u9988\u8fed\u4ee3\u751f\u6210\u3001\u6267\u884c\u3001\u9a8c\u8bc1\u548c\u4fee\u6b63\u4ee3\u7801\u7f16\u8f91\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10408", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["VisEditBench\u805a\u7126\u201c\u4ece\u5df2\u6709\u4ee3\u7801\u8fed\u4ee3\u7f16\u8f91\u201d\uff0c\u800c\u975e\u4ece\u96f6\u751f\u6210\u56fe\u8868\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u53ef\u89c6\u5316\u521b\u4f5c\u6d41\u7a0b\u3002", "Claude-4.6-Sonnet\u6574\u4f53\u901a\u8fc7\u7387\u6700\u9ad8\u4e3a74.46%\uff0c\u591a\u6570\u5f00\u6e90\u6a21\u578b\u4f4e\u4e8e50%\uff0c\u663e\u793a\u8be5\u4efb\u52a1\u4ecd\u5177\u6311\u6218\u3002", "\u89c6\u89c9\u9a71\u52a8\u7684\u98ce\u683c\u9002\u914d\u5c24\u5176\u56f0\u96be\uff0cClaude-4.6-Sonnet\u4ec5\u8fbe55.71%\uff1b\u57fa\u4e8eGPT-4o\u7684VisEditAgent\u5c06\u6574\u4f53\u901a\u8fc7\u7387\u4ece55.75%\u63d0\u5347\u523067.99%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u53ef\u89c6\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10408v1", "published_at": "2026-08-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "VisEditBench: Can Vision-Language Models Edit Visualization Code from Multimodal Feedback?", "tldr": "\u8bc4\u6d4bVLM\u57fa\u4e8e\u591a\u6a21\u6001\u53cd\u9988\u7f16\u8f91\u53ef\u89c6\u5316\u4ee3\u7801", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VisEditBench\uff0c\u4e00\u4e2a\u5305\u542b1395\u4e2a\u4eba\u5de5\u6807\u6ce8\u4efb\u52a1\u7684\u53ef\u89c6\u5316\u4ee3\u7801\u7f16\u8f91\u57fa\u51c6\uff0c\u8986\u76d6\u57fa\u4e8e\u53cd\u9988\u7684\u4fee\u590d\u548c\u57fa\u4e8e\u53c2\u8003\u56fe\u7684\u98ce\u683c\u91cd\u5851\u4e24\u7c7b\u771f\u5b9e\u5de5\u4f5c\u6d41\u3002\u4f5c\u8005\u8bc4\u6d4b20\u4e2a\u4e3b\u6d41VLM\uff0c\u5e76\u63d0\u51fa VisEditAgent\uff0c\u901a\u8fc7\u6e32\u67d3\u53cd\u9988\u8fed\u4ee3\u751f\u6210\u3001\u6267\u884c\u3001\u9a8c\u8bc1\u548c\u4fee\u6b63\u4ee3\u7801\u7f16\u8f91\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u586b\u8865\u4e86\u53ef\u89c6\u5316\u4ee3\u7801\u591a\u6a21\u6001\u7f16\u8f91\u8bc4\u6d4b\u7a7a\u767d\uff0c\u5e76\u8bc1\u660e\u6e32\u67d3\u95ed\u73af\u53cd\u9988\u5bf9\u53ef\u9760\u4ee3\u7801\u4fee\u6539\u5f88\u5173\u952e\uff0c\u5bf9\u6570\u636e\u53ef\u89c6\u5316\u5de5\u5177\u3001\u4ee3\u7801\u667a\u80fd\u4f53\u548c\u591a\u6a21\u6001\u7f16\u7a0b\u52a9\u624b\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The development of embodied Intelligent Virtual Agents (IVAs) that have cognitive capabilities in real-time interactive virtual environments remains a challenge, even with today\u0027s advancements in technology. Existing architectures are often focused on either the implementation of low-level reactive control systems that are constrained by commercial game engines, or high-level representations of reasoning models that can be difficult to implement in virtual worlds. This paper builds on that notion and proposes a modular cognitive architecture for deploying embodied IVAs. This architecture builds on existing, pre-established frameworks such as the Sense-Think-Act paradigm and the Belief-Desire-Intention cognitive model, among others, and aims to provide a reusable implementation-oriented framework as a template for deploying IVA \"brains\" in interactive 3D computing systems. The proposed architecture contributes by providing a modular, implementation-oriented framework for the deployment of embodied, cognitive-capable IVAs and bridges the gap between high-level agent reasoning models with real-time embodied execution, for scalable, adaptive, and explainable agents in complex interactive virtual environments.", "arxiv_id": "2608.09848", "arxiv_url": "https://arxiv.org/abs/2608.09848", "authors": ["Aimilios Hadjiliasi", "Louis Nisiotis"], "brief": "\u8bba\u6587\u63d0\u51fa CEAA\uff0c\u4e00\u79cd\u7528\u4e8e\u90e8\u7f72\u5177\u8eab\u667a\u80fd\u865a\u62df\u4ee3\u7406\u7684\u6a21\u5757\u5316\u8ba4\u77e5\u67b6\u6784\u3002\u5b83\u7ed3\u5408 Sense-Think-Act \u8303\u5f0f\u3001BDI \u4fe1\u5ff5-\u613f\u671b-\u610f\u56fe\u6a21\u578b\u7b49\u6846\u67b6\uff0c\u5c06\u9ad8\u5c42\u63a8\u7406\u4e0e\u5b9e\u65f6\u865a\u62df\u73af\u5883\u4e2d\u7684\u5177\u8eab\u6267\u884c\u8fde\u63a5\u8d77\u6765\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09848", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u6a21\u5757\u5316\u3001\u5b9e\u73b0\u5bfc\u5411\u8bbe\u8ba1\uff0c\u53ef\u4f5c\u4e3a\u4ea4\u4e92\u5f0f3D\u7cfb\u7edf\u4e2d IVA\u201c\u667a\u80fd\u4f53\u5927\u8111\u201d\u7684\u590d\u7528\u6a21\u677f", "\u6574\u5408 Sense-Think-Act \u4e0e BDI \u7b49\u7ecf\u5178\u8ba4\u77e5\u67b6\u6784\u601d\u60f3\uff0c\u652f\u6301\u611f\u77e5\u3001\u63a8\u7406\u3001\u610f\u56fe\u5f62\u6210\u4e0e\u884c\u52a8\u95ed\u73af", "\u76ee\u6807\u662f\u5728\u590d\u6742\u5b9e\u65f6\u865a\u62df\u73af\u5883\u4e2d\u5b9e\u73b0\u53ef\u6269\u5c55\u3001\u81ea\u9002\u5e94\u3001\u53ef\u89e3\u91ca\u7684\u5177\u8eab\u865a\u62df\u667a\u80fd\u4f53"], "keywords": ["\u667a\u80fd\u4f53", "\u5177\u8eab\u667a\u80fd", "\u8ba4\u77e5\u67b6\u6784", "\u865a\u62df\u73af\u5883"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09848v1", "published_at": "2026-08-10", "score": 0.193, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09848.png", "title": "CEAA: A Cognitive Embodied Agents Architecture for Interactive Computing Systems", "tldr": "\u9762\u54113D\u4ea4\u4e92\u73af\u5883\u7684\u6a21\u5757\u5316\u8ba4\u77e5\u5177\u8eab\u667a\u80fd\u4f53\u67b6\u6784", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa CEAA\uff0c\u4e00\u79cd\u7528\u4e8e\u90e8\u7f72\u5177\u8eab\u667a\u80fd\u865a\u62df\u4ee3\u7406\u7684\u6a21\u5757\u5316\u8ba4\u77e5\u67b6\u6784\u3002\u5b83\u7ed3\u5408 Sense-Think-Act \u8303\u5f0f\u3001BDI \u4fe1\u5ff5-\u613f\u671b-\u610f\u56fe\u6a21\u578b\u7b49\u6846\u67b6\uff0c\u5c06\u9ad8\u5c42\u63a8\u7406\u4e0e\u5b9e\u65f6\u865a\u62df\u73af\u5883\u4e2d\u7684\u5177\u8eab\u6267\u884c\u8fde\u63a5\u8d77\u6765\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5173\u6ce8\u9ad8\u5c42\u8ba4\u77e5\u63a8\u7406\u6a21\u578b\u4e0e\u6e38\u620f\u5f15\u64ce/3D\u865a\u62df\u4e16\u754c\u4f4e\u5c42\u5b9e\u65f6\u6267\u884c\u4e4b\u95f4\u7684\u843d\u5dee\uff0c\u4e3a\u6784\u5efa\u53ef\u843d\u5730\u7684\u5177\u8eab\u865a\u62df\u667a\u80fd\u4f53\u63d0\u4f9b\u5de5\u7a0b\u5316\u67b6\u6784\u53c2\u8003\u3002"}, {"abstract": "An agent skill is a folder containing a SKILL.md file with instructions for a language-model agent, optionally accompanied by scripts and reference files. The agent loads the skill when it judges that a task matches the skill description. Anthropic introduced the format in October 2025 as an open specification. Nine months later, we find that skill files in the millions sit in public GitHub repositories. Skills are unlike the artifacts the SE research community usually mines: they are written mainly in natural language, a model selects them probabilistically at run time, and no compiler or type checker verifies the selection. They also have no central registry or package manager, so they spread by copying folders between repositories. How developers write, reuse, and maintain skills is therefore an empirical question, and no existing dataset records this population. We present GitSkills, a dataset of 3,797,117 SKILL.md files collected from 282,200 public repositories in July 2026. The dataset retains every file occurrence with its repository, path, and content hash. It groups identical files into 1,877,981 distinct contents and enriches one representative per group with the full text, parsed front matter, folder contents, repository metadata, and, for a subset, the commit history of the file. A single self- contained SQLite file supports research on the adoption, reuse, structure, authorship, maintenance, and security of agent skills.", "arxiv_id": "2608.10906", "arxiv_url": "https://arxiv.org/abs/2608.10906", "authors": ["Giuseppe Destefanis", "Daniel Graziotin", "Matteo Vaccargiu", "Marco Ortu"], "brief": "\u8bba\u6587\u53d1\u5e03 GitSkills\uff1a\u4e00\u4e2a\u6536\u96c6\u81ea GitHub \u7684 agent skill \u6570\u636e\u96c6\uff0c\u8986\u76d6 282,200 \u4e2a\u516c\u5f00\u4ed3\u5e93\u4e2d\u7684 3,797,117 \u4e2a SKILL.md \u6587\u4ef6\u3002\u6570\u636e\u96c6\u4fdd\u7559\u6587\u4ef6\u51fa\u73b0\u4f4d\u7f6e\u3001\u5185\u5bb9\u54c8\u5e0c\u3001\u5143\u6570\u636e\u3001\u90e8\u5206\u63d0\u4ea4\u5386\u53f2\uff0c\u5e76\u4ee5 SQLite \u5f62\u5f0f\u4fbf\u4e8e\u7814\u7a76\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10906", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5305\u542b 3,797,117 \u4e2a SKILL.md \u6587\u4ef6\u5b9e\u4f8b\uff0c\u53bb\u91cd\u540e\u6709 1,877,981 \u4efd\u4e0d\u540c\u5185\u5bb9", "\u8bb0\u5f55\u4ed3\u5e93\u3001\u8def\u5f84\u3001\u5185\u5bb9\u54c8\u5e0c\uff0c\u5e76\u4e3a\u4ee3\u8868\u6837\u672c\u8865\u5145\u5168\u6587\u3001front matter\u3001\u6587\u4ef6\u5939\u5185\u5bb9\u548c\u4ed3\u5e93\u5143\u6570\u636e", "\u9762\u5411\u7814\u7a76\u667a\u80fd\u4f53\u6280\u80fd\u7684\u91c7\u7528\u3001\u590d\u7528\u3001\u7ef4\u62a4\u3001\u4f5c\u8005\u5f52\u5c5e\u4e0e\u5b89\u5168\u98ce\u9669"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u6570\u636e\u96c6", "\u4ee3\u7801\u751f\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10906v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "GitSkills: A Dataset of Agent Skills on GitHub", "tldr": "GitHub\u667a\u80fd\u4f53\u6280\u80fd\u5927\u89c4\u6a21\u6570\u636e\u96c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u5e03 GitSkills\uff1a\u4e00\u4e2a\u6536\u96c6\u81ea GitHub \u7684 agent skill \u6570\u636e\u96c6\uff0c\u8986\u76d6 282,200 \u4e2a\u516c\u5f00\u4ed3\u5e93\u4e2d\u7684 3,797,117 \u4e2a SKILL.md \u6587\u4ef6\u3002\u6570\u636e\u96c6\u4fdd\u7559\u6587\u4ef6\u51fa\u73b0\u4f4d\u7f6e\u3001\u5185\u5bb9\u54c8\u5e0c\u3001\u5143\u6570\u636e\u3001\u90e8\u5206\u63d0\u4ea4\u5386\u53f2\uff0c\u5e76\u4ee5 SQLite \u5f62\u5f0f\u4fbf\u4e8e\u7814\u7a76\u3002", "why_notable": "\u8fd9\u662f\u9488\u5bf9\u65b0\u5174 LLM agent skill \u751f\u6001\u7684\u9996\u4e2a\u5927\u89c4\u6a21\u5b9e\u8bc1\u6570\u636e\u96c6\u4e4b\u4e00\uff0c\u4e3a\u8f6f\u4ef6\u5de5\u7a0b\u4e0e\u667a\u80fd\u4f53\u5b89\u5168\u7814\u7a76\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u57fa\u7840\u8bbe\u65bd\uff0c\u5c24\u5176\u9002\u5408\u5206\u6790\u81ea\u7136\u8bed\u8a00\u6280\u80fd\u5982\u4f55\u5728\u65e0\u4e2d\u5fc3\u6ce8\u518c\u673a\u5236\u4e0b\u4f20\u64ad\u548c\u6f14\u5316\u3002"}, {"abstract": "Autonomous chemistry increasingly depends on environments in which agents can repeatedly act, observe, and adapt.Physical laboratories provide essential real-material evidence but are costly to repeat and difficult to use for tightly matched interventions, whereas most digital environments keep the underlying experimental world largely fixed. We introduce ChemWorld, a programmable chemical environment in which reusable process and observation components are compiled into executable worlds. ChemWorld separates the public experimental contract available to an agent from evaluator-owned chemical and material laws. Researchers can therefore vary world composition and operating conditions, or change a single hidden law while holding the public task and interaction conditions fixed. Transactional execution records operations, failures, resource changes, and state transitions, allowing complete environment-action trajectories to be replayed exactly and audited. Full-census qualification covered the reference registry, 52 generated compositions, and module, interface, compilation, and invalid-action tests. Eight deterministic experimental cases demonstrated shared lifecycle semantics, failure recovery, and exact replay, while six parent-child world-fork pairs isolated the effects of single private-law interventions under matched public conditions. An independent agent also completed a full lifecycle in a non-reference world through the same public interface. Within the declared component and model domain, ChemWorld provides a controlled and replayable substrate for studying experimentation across systematically varied chemical worlds, complementary to physical-laboratory evidence and calibration.", "arxiv_id": "2608.10792", "arxiv_url": "https://arxiv.org/abs/2608.10792", "authors": ["Jiangjie Qiu", "Yijun Li", "Xiaonan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa ChemWorld\uff0c\u4e00\u4e2a\u53ef\u7f16\u7a0b\u5316\u5b66\u5b9e\u9a8c\u73af\u5883\uff0c\u5c06\u53ef\u590d\u7528\u7684\u8fc7\u7a0b\u4e0e\u89c2\u6d4b\u7ec4\u4ef6\u7f16\u8bd1\u6210\u53ef\u6267\u884c\u4e16\u754c\u3002\u5b83\u628a\u667a\u80fd\u4f53\u53ef\u89c1\u7684\u516c\u5171\u5b9e\u9a8c\u63a5\u53e3\u4e0e\u8bc4\u6d4b\u8005\u638c\u63e1\u7684\u9690\u85cf\u5316\u5b66/\u6750\u6599\u89c4\u5f8b\u5206\u79bb\uff0c\u4ee5\u4fbf\u5728\u5339\u914d\u6761\u4ef6\u4e0b\u7cfb\u7edf\u6539\u53d8\u4e16\u754c\u6216\u5355\u4e2a\u79c1\u6709\u89c4\u5f8b\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10792", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u652f\u6301\u4e8b\u52a1\u5316\u6267\u884c\u8bb0\u5f55\uff0c\u5b8c\u6574\u4fdd\u5b58\u64cd\u4f5c\u3001\u5931\u8d25\u3001\u8d44\u6e90\u53d8\u5316\u4e0e\u72b6\u6001\u8f6c\u79fb\uff0c\u53ef\u7cbe\u786e\u56de\u653e\u548c\u5ba1\u8ba1\u73af\u5883-\u52a8\u4f5c\u8f68\u8ff9", "\u5b8c\u6210\u53c2\u8003\u6ce8\u518c\u8868\u300152 \u4e2a\u751f\u6210\u7ec4\u5408\u4ee5\u53ca\u6a21\u5757\u3001\u63a5\u53e3\u3001\u7f16\u8bd1\u3001\u975e\u6cd5\u52a8\u4f5c\u7b49\u5168\u91cf\u8d44\u683c\u6d4b\u8bd5", "\u901a\u8fc7 8 \u4e2a\u786e\u5b9a\u6027\u5b9e\u9a8c\u6848\u4f8b\u548c 6 \u7ec4\u7236\u5b50\u4e16\u754c\u5206\u53c9\uff0c\u9a8c\u8bc1\u751f\u547d\u5468\u671f\u8bed\u4e49\u3001\u5931\u8d25\u6062\u590d\u3001\u7cbe\u786e\u56de\u653e\u53ca\u5355\u4e00\u9690\u85cf\u89c4\u5f8b\u5e72\u9884\u5206\u6790"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u53d1\u73b0", "\u4eff\u771f\u73af\u5883", "\u5316\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10792v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ChemWorld: Programmable Chemical Worlds for Controlled and Replayable Agent Experimentation", "tldr": "\u53ef\u7f16\u7a0b\u5316\u5b66\u73af\u5883\u652f\u6301\u53ef\u63a7\u53ef\u590d\u73b0\u5b9e\u9a8c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ChemWorld\uff0c\u4e00\u4e2a\u53ef\u7f16\u7a0b\u5316\u5b66\u5b9e\u9a8c\u73af\u5883\uff0c\u5c06\u53ef\u590d\u7528\u7684\u8fc7\u7a0b\u4e0e\u89c2\u6d4b\u7ec4\u4ef6\u7f16\u8bd1\u6210\u53ef\u6267\u884c\u4e16\u754c\u3002\u5b83\u628a\u667a\u80fd\u4f53\u53ef\u89c1\u7684\u516c\u5171\u5b9e\u9a8c\u63a5\u53e3\u4e0e\u8bc4\u6d4b\u8005\u638c\u63e1\u7684\u9690\u85cf\u5316\u5b66/\u6750\u6599\u89c4\u5f8b\u5206\u79bb\uff0c\u4ee5\u4fbf\u5728\u5339\u914d\u6761\u4ef6\u4e0b\u7cfb\u7edf\u6539\u53d8\u4e16\u754c\u6216\u5355\u4e2a\u79c1\u6709\u89c4\u5f8b\u3002", "why_notable": "ChemWorld\u4e3a\u81ea\u4e3b\u5316\u5b66\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u4ecb\u4e8e\u771f\u5b9e\u5b9e\u9a8c\u5ba4\u4e0e\u56fa\u5b9a\u6570\u5b57\u6a21\u62df\u4e4b\u95f4\u7684\u53ef\u63a7\u57fa\u51c6\u73af\u5883\uff0c\u53ef\u7528\u4e8e\u53ef\u91cd\u590d\u3001\u53ef\u5ba1\u8ba1\u3001\u53ef\u5e72\u9884\u5730\u7814\u7a76\u5b9e\u9a8c\u7b56\u7565\u4e0e\u9002\u5e94\u80fd\u529b\u3002"}, {"abstract": "Analytic dashboards combine coordinated views and interactions for data exploration and decision-making. Recent models can generate them from data and natural-language goals, but evaluating their usefulness remains difficult. Dashboard generation is open-ended, and neither static appearance nor successful execution alone captures analytical support and interaction quality. We introduce DashArena, to our knowledge the first benchmark for open-ended, task-grounded generation of interactive analytic dashboards. Its key innovation is to require each system to generate both a dashboard and a replayable interaction trajectory. A browser executor replays the trajectory and turns the system\u0027s intended analytical workflow into reproducible visual and execution evidence. A VLM judge compares candidates using this evidence, and Bradley--Terry aggregation produces the leaderboard. We further distill the judge into the open-weight DashJudge-8B. Human evaluations show that DashJudge-8B effectively reproduces human judgments and ablations show that interaction evidence improves judge agreement. Experiments with frontier models reveal persistent rendering, analytical, and interaction failures. Together, these results show that realistic dashboard generation remains challenging and that interaction-aware evaluation captures failures missed by static or execution-only checks.", "arxiv_id": "2608.10567", "arxiv_url": "https://arxiv.org/abs/2608.10567", "authors": ["Xiaotong Wang", "Dazhen Deng"], "brief": "DashArena \u662f\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f\u3001\u4efb\u52a1\u9a71\u52a8\u7684\u4ea4\u4e92\u5f0f\u5206\u6790\u4eea\u8868\u76d8\u751f\u6210\u57fa\u51c6\u3002\u5b83\u8981\u6c42\u6a21\u578b\u540c\u65f6\u751f\u6210\u4eea\u8868\u76d8\u548c\u53ef\u91cd\u653e\u7684\u4ea4\u4e92\u8f68\u8ff9\uff0c\u5e76\u7528\u6d4f\u89c8\u5668\u6267\u884c\u4e0e\u89c6\u89c9\u8bc1\u636e\u6765\u8bc4\u4f30\u5206\u6790\u6d41\u7a0b\u8d28\u91cf\u3002", "categories": ["cs.AI"], "g
