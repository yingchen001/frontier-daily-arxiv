ithub_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10567", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6838\u5fc3\u521b\u65b0\u662f\u5c06\u201c\u4eea\u8868\u76d8\u7ed3\u679c\u201d\u4e0e\u201c\u4ea4\u4e92\u8f68\u8ff9\u201d\u7ed1\u5b9a\u8bc4\u6d4b\uff0c\u4f7f\u6a21\u578b\u610f\u56fe\u4e2d\u7684\u5206\u6790\u5de5\u4f5c\u6d41\u53ef\u590d\u73b0\u3001\u53ef\u6bd4\u8f83", "\u901a\u8fc7\u6d4f\u89c8\u5668\u6267\u884c\u5668\u91cd\u653e\u4ea4\u4e92\uff0c\u7ed3\u5408 VLM \u88c1\u5224\u8fdb\u884c\u5019\u9009\u6bd4\u8f83\uff0c\u5e76\u7528 Bradley-Terry \u805a\u5408\u751f\u6210\u6392\u884c\u699c", "\u84b8\u998f\u5f97\u5230\u5f00\u6e90\u6743\u91cd DashJudge-8B\uff0c\u4eba\u7c7b\u8bc4\u4f30\u8868\u660e\u5176\u80fd\u8f83\u597d\u590d\u73b0\u4eba\u5de5\u5224\u65ad\uff0c\u4ea4\u4e92\u8bc1\u636e\u53ef\u63d0\u5347\u8bc4\u6d4b\u4e00\u81f4\u6027"], "keywords": ["\u57fa\u51c6\u8bc4\u6d4b", "\u6570\u636e\u53ef\u89c6\u5316", "\u591a\u6a21\u6001", "\u4ea4\u4e92\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10567v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DashArena: Benchmarking LLMs on Interactive Analytic Dashboard Generation", "tldr": "\u9996\u4e2a\u4ea4\u4e92\u5f0f\u5206\u6790\u4eea\u8868\u76d8\u751f\u6210\u57fa\u51c6", "upvotes": 0, "what_it_is": "DashArena \u662f\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f\u3001\u4efb\u52a1\u9a71\u52a8\u7684\u4ea4\u4e92\u5f0f\u5206\u6790\u4eea\u8868\u76d8\u751f\u6210\u57fa\u51c6\u3002\u5b83\u8981\u6c42\u6a21\u578b\u540c\u65f6\u751f\u6210\u4eea\u8868\u76d8\u548c\u53ef\u91cd\u653e\u7684\u4ea4\u4e92\u8f68\u8ff9\uff0c\u5e76\u7528\u6d4f\u89c8\u5668\u6267\u884c\u4e0e\u89c6\u89c9\u8bc1\u636e\u6765\u8bc4\u4f30\u5206\u6790\u6d41\u7a0b\u8d28\u91cf\u3002", "why_notable": "\u5b83\u8865\u9f50\u4e86\u4ea4\u4e92\u5f0f\u6570\u636e\u5206\u6790\u754c\u9762\u751f\u6210\u7684\u8bc4\u6d4b\u7a7a\u767d\uff0c\u8bc1\u660e\u4ec5\u770b\u9759\u6001\u5916\u89c2\u6216\u6267\u884c\u6210\u529f\u65e0\u6cd5\u53d1\u73b0\u8bb8\u591a\u6e32\u67d3\u3001\u5206\u6790\u4e0e\u4ea4\u4e92\u5931\u8d25\uff0c\u5bf9\u8bc4\u4f30\u771f\u5b9e\u53ef\u7528\u7684\u53ef\u89c6\u5316\u751f\u6210\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Many studies have shown that specially crafted inputs can induce large language models (LLMs) to generate excessively long outputs, resulting in significant computational overhead and resource consumption. While most existing denial-of-service (DoS) attacks target text-only LLMs, end-to-end (E2E) speech LLMs are rapidly emerging. Existing text-based DoS attacks primarily rely on prompt engineering, such as adversarial suffixes or semantic inducement, which exploit the discrete nature of text inputs and therefore cannot be directly transferred to continuous speech inputs. Moreover, prior studies on speech model security mainly focus on ASR or TTS systems, leaving the DoS vulnerability of E2E speech LLMs largely unexplored. To address this gap, we propose the perturbation-based DoS attack targeting E2E speech models. Instead of inducing long outputs through prompt manipulation, our method optimizes imperceptible acoustic perturbations to directly influence the model\u0027s autoregressive generation process while preserving the original input length. Specifically, we formulate the attack as a composite optimization objective that jointly suppresses EOS generation, encourages prolonged decoding, and largely preserves semantic consistency by integrating weighted EOS loss, top-k logit loss, length loss, and semantic alignment loss. To further improve stealthiness, we employ voice activity detection (VAD) to inject perturbations only into voiced regions. Extensive experiments on three open-source E2E speech LLMs demonstrate that our method achieves stable attack success rate while significantly increasing generation length and GPU resource consumption, revealing security risks in modern ALLMs.", "arxiv_id": "2608.10405", "arxiv_url": "https://arxiv.org/abs/2608.10405", "authors": ["Shuozhe Cheng", "Kunlan Xiang", "Mingxuan Li", "Ji Zhang", "Dongxiao Liu", "Wenbo Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7aef\u5230\u7aef\u8bed\u97f3\u8bed\u8a00\u6a21\u578b\u7684\u6270\u52a8\u5f0f\u62d2\u7edd\u670d\u52a1\u653b\u51fb\u3002\u5b83\u901a\u8fc7\u5728\u4eba\u8033\u96be\u5bdf\u89c9\u7684\u8bed\u97f3\u6270\u52a8\u4e2d\u6291\u5236EOS\u751f\u6210\u3001\u8bf1\u5bfc\u6301\u7eed\u89e3\u7801\uff0c\u4ece\u800c\u8ba9\u6a21\u578b\u8f93\u51fa\u5f02\u5e38\u53d8\u957f\u5e76\u6d88\u8017\u66f4\u591aGPU\u8d44\u6e90\u3002", "categories": ["cs.SD", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10405", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u653b\u51fb\u4e0d\u4f9d\u8d56\u6587\u672c\u63d0\u793a\u5de5\u7a0b\uff0c\u800c\u662f\u76f4\u63a5\u4f18\u5316\u8fde\u7eed\u8bed\u97f3\u8f93\u5165\u4e2d\u7684\u5fae\u5c0f\u58f0\u5b66\u6270\u52a8\u3002", "\u6784\u5efa\u8054\u5408\u4f18\u5316\u76ee\u6807\uff0c\u7ed3\u5408EOS\u635f\u5931\u3001top-k logit\u635f\u5931\u3001\u957f\u5ea6\u635f\u5931\u548c\u8bed\u4e49\u5bf9\u9f50\u635f\u5931\u3002", "\u5229\u7528VAD\u4ec5\u5728\u6709\u58f0\u533a\u57df\u6ce8\u5165\u6270\u52a8\uff0c\u63d0\u5347\u9690\u853d\u6027\uff1b\u5728\u4e09\u4e2a\u5f00\u6e90\u7aef\u5230\u7aef\u8bed\u97f3LLM\u4e0a\u9a8c\u8bc1\u4e86\u7a33\u5b9a\u653b\u51fb\u6548\u679c\u3002"], "keywords": ["\u8bed\u97f3\u5927\u6a21\u578b", "\u5b89\u5168\u653b\u51fb", "\u62d2\u7edd\u670d\u52a1", "\u5bf9\u6297\u6270\u52a8"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10405v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Never Stop Speaking: a Denial-of-Service Attack on End-to-End Speech Language Models", "tldr": "\u63ed\u793a\u7aef\u5230\u7aef\u8bed\u97f3\u5927\u6a21\u578b\u7684DoS\u6f0f\u6d1e", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7aef\u5230\u7aef\u8bed\u97f3\u8bed\u8a00\u6a21\u578b\u7684\u6270\u52a8\u5f0f\u62d2\u7edd\u670d\u52a1\u653b\u51fb\u3002\u5b83\u901a\u8fc7\u5728\u4eba\u8033\u96be\u5bdf\u89c9\u7684\u8bed\u97f3\u6270\u52a8\u4e2d\u6291\u5236EOS\u751f\u6210\u3001\u8bf1\u5bfc\u6301\u7eed\u89e3\u7801\uff0c\u4ece\u800c\u8ba9\u6a21\u578b\u8f93\u51fa\u5f02\u5e38\u53d8\u957f\u5e76\u6d88\u8017\u66f4\u591aGPU\u8d44\u6e90\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06LLM\u62d2\u7edd\u670d\u52a1\u98ce\u9669\u4ece\u6587\u672c\u6a21\u578b\u6269\u5c55\u5230\u7aef\u5230\u7aef\u8bed\u97f3\u5927\u6a21\u578b\uff0c\u63ed\u793a\u4e86\u8bed\u97f3\u4ea4\u4e92\u7cfb\u7edf\u5728\u81ea\u56de\u5f52\u751f\u6210\u9636\u6bb5\u7684\u8d44\u6e90\u8017\u5c3d\u5b89\u5168\u9690\u60a3\uff0c\u5bf9\u672a\u6765\u8bed\u97f3LLM\u7684\u9c81\u68d2\u6027\u8bc4\u4f30\u548c\u9632\u62a4\u5177\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "Pretraining corpus composition shapes LLM capabilities, but it often remains hidden even when model weights are released. Prior work has inferred corpus mixtures or traced specific token groups from released tokenizer vocabularies; in contrast, we estimate corpus ratios for arbitrary target tokens. We first show that BPE tokenizers trained on different corpora share stable token ID--ratio distributions, motivating distribution transfer from known corpora to a target tokenizer trained on hidden corpora. We then propose Quantile-Guided Density Estimation (QGDE), which approximates this distribution with multiple quantile trends and uses local density weighting to produce token-level estimates. In controlled settings and a realistic setting using the released SmolLM tokenizer, QGDE achieves mean relative errors as low as 3.00% for token-level estimation and 3.08% after aggregation into category-level mixtures. These results suggest that released tokenizer vocabularies provide a useful signal for fine-grained corpus estimation beyond coarse composition inference.", "arxiv_id": "2608.10690", "arxiv_url": "https://arxiv.org/abs/2608.10690", "authors": ["Qingjie Zhang", "Xingzhang Ren", "Zixuan Chen", "Jinfeng Li", "YueFeng Chen", "Yitong Yang", "Hui Xue", "Dayiheng Liu", "Han Qiu"], "brief": "\u8bba\u6587\u7814\u7a76\u5982\u4f55\u4ece\u5df2\u53d1\u5e03\u7684 BPE tokenizer \u8bcd\u8868\u4e2d\uff0c\u4f30\u8ba1\u9690\u85cf\u9884\u8bad\u7ec3\u8bed\u6599\u5bf9\u4efb\u610f\u76ee\u6807 token \u7684\u8d21\u732e\u6bd4\u4f8b\u3002\u4f5c\u8005\u63d0\u51fa Quantile-Guided Density Estimation\uff08QGDE\uff09\uff0c\u5c06\u5df2\u77e5\u8bed\u6599\u4e0a\u7684 token ID\u2014\u5360\u6bd4\u5206\u5e03\u8fc1\u79fb\u5230\u76ee\u6807 tokenizer\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10690", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u4e0d\u540c\u8bed\u6599\u8bad\u7ec3\u7684 BPE tokenizer \u5177\u6709\u8f83\u7a33\u5b9a\u7684 token ID\u2014\u8bed\u6599\u5360\u6bd4\u5206\u5e03\uff0c\u53ef\u4f5c\u4e3a\u5206\u5e03\u8fc1\u79fb\u4fe1\u53f7", "QGDE \u901a\u8fc7\u591a\u6761\u5206\u4f4d\u6570\u8d8b\u52bf\u8fd1\u4f3c\u5206\u5e03\uff0c\u5e76\u7ed3\u5408\u5c40\u90e8\u5bc6\u5ea6\u52a0\u6743\u8fdb\u884c token \u7ea7\u5360\u6bd4\u4f30\u8ba1", "\u5728\u53d7\u63a7\u5b9e\u9a8c\u548c SmolLM tokenizer \u771f\u5b9e\u8bbe\u7f6e\u4e2d\uff0ctoken \u7ea7\u5e73\u5747\u76f8\u5bf9\u8bef\u5dee\u6700\u4f4e\u8fbe 3.00%\uff0c\u7c7b\u522b\u805a\u5408\u540e\u4e3a 3.08%"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6570\u636e\u6eaf\u6e90", "\u5206\u8bcd\u5668", "\u8bed\u6599\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10690v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can Released LLM Vocabularies Support Token-Level Estimation of Hidden Corpora?", "tldr": "\u7528\u5df2\u53d1\u5e03\u8bcd\u8868\u4f30\u8ba1\u9690\u85cf\u9884\u8bad\u7ec3\u8bed\u6599\u5360\u6bd4", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5982\u4f55\u4ece\u5df2\u53d1\u5e03\u7684 BPE tokenizer \u8bcd\u8868\u4e2d\uff0c\u4f30\u8ba1\u9690\u85cf\u9884\u8bad\u7ec3\u8bed\u6599\u5bf9\u4efb\u610f\u76ee\u6807 token \u7684\u8d21\u732e\u6bd4\u4f8b\u3002\u4f5c\u8005\u63d0\u51fa Quantile-Guided Density Estimation\uff08QGDE\uff09\uff0c\u5c06\u5df2\u77e5\u8bed\u6599\u4e0a\u7684 token ID\u2014\u5360\u6bd4\u5206\u5e03\u8fc1\u79fb\u5230\u76ee\u6807 tokenizer\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660e\u5373\u4f7f\u6a21\u578b\u8bad\u7ec3\u8bed\u6599\u4e0d\u516c\u5f00\uff0c\u53d1\u5e03\u7684 tokenizer \u8bcd\u8868\u4e5f\u53ef\u80fd\u6cc4\u9732\u7ec6\u7c92\u5ea6\u8bed\u6599\u7ec4\u6210\u4fe1\u606f\uff0c\u4e3a\u6a21\u578b\u900f\u660e\u5ea6\u3001\u5ba1\u8ba1\u548c\u6570\u636e\u6eaf\u6e90\u63d0\u4f9b\u4e86\u65b0\u5de5\u5177\uff0c\u4e5f\u5e26\u6765\u6f5c\u5728\u9690\u79c1\u4e0e\u6570\u636e\u6cbb\u7406\u95ee\u9898\u3002"}, {"abstract": "Discrete diffusion models for categorical generation are defined by a corruption kernel, which determines the intermediate state space and the associated reverse prediction problem. We study uniform discrete diffusion and ask whether its training objective and reverse transitions can be enriched without changing the underlying categorical corruption process. We introduce Simplax, an exact Dirichlet--categorical augmentation that couples each corrupted categorical state with an auxiliary simplex-valued variable while preserving the original uniform diffusion process as its categorical marginal. This augmentation yields a tractable Rao--Blackwellized reverse-bridge objective and a corresponding stochastic reverse sampler, while retaining the corrupted categorical state as the denoiser input. Empirically, Simplax improves the generative perplexity--entropy tradeoff on unconditional OpenWebText generation. On Sudoku, a model trained exclusively on $30$-clue puzzles achieves the highest accuracy among the compared methods across all evaluated clue densities, including the minimum uniquely solvable $17$-clue regime, and also achieves the highest validity in unconditional generation.", "arxiv_id": "2608.10615", "arxiv_url": "https://arxiv.org/abs/2608.10615", "authors": ["Jinya Sakurai", "Patrick Pynadath", "Satoshi Hayakawa", "Jaehong Yoon", "Xulei Yang", "Nancy F. Chen", "Xun Xu"], "brief": "\u8bba\u6587\u63d0\u51fa Simplax\uff0c\u4e00\u79cd\u7cbe\u786e\u7684 Dirichlet-categorical \u589e\u5f3a\u65b9\u6cd5\uff0c\u5728\u4e0d\u6539\u53d8\u539f\u6709\u5747\u5300\u79bb\u6563\u6269\u6563\u5206\u7c7b\u8150\u8680\u8fc7\u7a0b\u7684\u524d\u63d0\u4e0b\uff0c\u4e3a\u6bcf\u4e2a\u79bb\u6563\u72b6\u6001\u8026\u5408\u4e00\u4e2a\u5355\u7eaf\u5f62\u8fde\u7eed\u8f85\u52a9\u53d8\u91cf\u3002\u8be5\u65b9\u6cd5\u5e26\u6765\u53ef tractable \u7684 Rao-Blackwellized \u53cd\u5411\u6865\u76ee\u6807\u4e0e\u968f\u673a\u53cd\u5411\u91c7\u6837\u5668\uff0c\u540c\u65f6\u4ecd\u4ee5\u88ab\u8150\u8680\u7684\u79bb\u6563\u72b6\u6001\u4f5c\u4e3a\u53bb\u566a\u5668\u8f93\u5165\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10615", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4fdd\u6301\u539f\u59cb\u5747\u5300\u79bb\u6563\u6269\u6563\u7684\u5206\u7c7b\u8fb9\u7f18\u5206\u5e03\u4e0d\u53d8\uff0c\u53ea\u901a\u8fc7\u8fde\u7eed\u5355\u7eaf\u5f62\u8f85\u52a9\u53d8\u91cf\u4e30\u5bcc\u8bad\u7ec3\u76ee\u6807\u4e0e\u53cd\u5411\u8f6c\u79fb\u3002", "\u6784\u5efa Dirichlet--categorical \u7cbe\u786e\u589e\u5f3a\uff0c\u5e76\u63a8\u5bfc Rao-Blackwellized reverse-bridge \u76ee\u6807\uff0c\u964d\u4f4e\u53cd\u5411\u9884\u6d4b\u7684\u4e0d\u786e\u5b9a\u6027\u3002", "\u5728 OpenWebText \u65e0\u6761\u4ef6\u751f\u6210\u4e2d\u6539\u5584\u56f0\u60d1\u5ea6--\u71b5\u6743\u8861\uff1b\u5728 Sudoku \u4e0a\u4ec5\u7528 30 \u7ebf\u7d22\u8bad\u7ec3\uff0c\u5374\u5728\u591a\u79cd\u7ebf\u7d22\u5bc6\u5ea6\u542b 17 \u7ebf\u7d22\u573a\u666f\u53d6\u5f97\u6700\u9ad8\u51c6\u786e\u7387\u548c\u65e0\u6761\u4ef6\u751f\u6210\u6709\u6548\u6027\u3002"], "keywords": ["\u79bb\u6563\u6269\u6563", "\u751f\u6210\u6a21\u578b", "\u6587\u672c\u751f\u6210", "\u7ec4\u5408\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10615v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Simplex Relaxation for Discrete Diffusion", "tldr": "\u7528\u5355\u7eaf\u5f62\u589e\u5f3a\u6539\u8fdb\u79bb\u6563\u6269\u6563\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Simplax\uff0c\u4e00\u79cd\u7cbe\u786e\u7684 Dirichlet-categorical \u589e\u5f3a\u65b9\u6cd5\uff0c\u5728\u4e0d\u6539\u53d8\u539f\u6709\u5747\u5300\u79bb\u6563\u6269\u6563\u5206\u7c7b\u8150\u8680\u8fc7\u7a0b\u7684\u524d\u63d0\u4e0b\uff0c\u4e3a\u6bcf\u4e2a\u79bb\u6563\u72b6\u6001\u8026\u5408\u4e00\u4e2a\u5355\u7eaf\u5f62\u8fde\u7eed\u8f85\u52a9\u53d8\u91cf\u3002\u8be5\u65b9\u6cd5\u5e26\u6765\u53ef tractable \u7684 Rao-Blackwellized \u53cd\u5411\u6865\u76ee\u6807\u4e0e\u968f\u673a\u53cd\u5411\u91c7\u6837\u5668\uff0c\u540c\u65f6\u4ecd\u4ee5\u88ab\u8150\u8680\u7684\u79bb\u6563\u72b6\u6001\u4f5c\u4e3a\u53bb\u566a\u5668\u8f93\u5165\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u79bb\u6563\u6269\u6563\u63d0\u4f9b\u4e86\u4e00\u79cd\u201c\u4e0d\u6539\u8150\u8680\u8fc7\u7a0b\u3001\u589e\u5f3a\u53cd\u5411\u5b66\u4e60\u201d\u7684\u7b80\u6d01\u8def\u5f84\uff0c\u517c\u987e\u7406\u8bba\u53ef\u63a7\u6027\u4e0e\u5b9e\u8df5\u6536\u76ca\uff1b\u5bf9\u6587\u672c\u3001\u7ec4\u5408\u63a8\u7406\u7b49\u79bb\u6563\u751f\u6210\u4efb\u52a1\u90fd\u6709\u6f5c\u5728\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are trained on massive and largely undisclosed corpora that may contain copyrighted or privacy-sensitive content. Data contamination detection (DCD) therefore aims to determine whether a given text is a member of the pre-training corpus of a target LLM. Recent state-of-the-art DCD methods follow a feature-based paradigm that derives membership features from the input text and the corresponding model output. However, most modern LLMs undergo post-training, such as instruction tuning, preference optimization, and reasoning-oriented training, which can alter model outputs and shift the corresponding membership features, thereby reducing the separability between members and non-members. To address this problem, we propose CalibDCD, a broadly applicable calibration framework for feature-based DCD methods, comprising (1) Multi-View Shift Detection, which identifies recurring feature shifts associated with post-training, and (2) Bounded Feature Correction, which selectively mitigates their influence on membership prediction. Specifically, Multi-View Shift Detection evaluates controlled prompt variants on known non-member texts and consolidates the most informative views to identify recurring feature shifts. Bounded Feature Correction selectively adjusts feature components aligned with the detected shifts and controls the correction extent to preserve useful detection information. Experiments show that CalibDCD consistently improves existing feature-based detectors, with gains of up to 7.0% in AUC and 15.0% in TPR@5%FPR.", "arxiv_id": "2608.10462", "arxiv_url": "https://arxiv.org/abs/2608.10462", "authors": ["Zhen Yang", "Mengqi Wang", "Gengda Zhao", "Mo Zhou", "Jianwei Wang", "Wenjie Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa CalibDCD\uff0c\u4e00\u4e2a\u7528\u4e8e\u7279\u5f81\u5f0f LLM \u6570\u636e\u6c61\u67d3\u68c0\u6d4b\u7684\u901a\u7528\u6821\u51c6\u6846\u67b6\u3002\u5b83\u9488\u5bf9\u6307\u4ee4\u5fae\u8c03\u3001\u504f\u597d\u4f18\u5316\u7b49\u540e\u8bad\u7ec3\u5bfc\u81f4\u7684\u6210\u5458\u7279\u5f81\u504f\u79fb\uff0c\u68c0\u6d4b\u5e76\u4fee\u6b63\u504f\u79fb\u4ee5\u6539\u5584\u8bad\u7ec3\u8bed\u6599\u6210\u5458\u5224\u5b9a\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10462", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Multi-View Shift Detection\uff1a\u5728\u5df2\u77e5\u975e\u6210\u5458\u6587\u672c\u4e0a\u4f7f\u7528\u53d7\u63a7\u63d0\u793a\u53d8\u4f53\uff0c\u4ece\u591a\u89c6\u89d2\u8bc6\u522b\u540e\u8bad\u7ec3\u5f15\u53d1\u7684\u91cd\u590d\u6027\u7279\u5f81\u504f\u79fb\u3002", "\u63d0\u51fa Bounded Feature Correction\uff1a\u53ea\u4fee\u6b63\u4e0e\u68c0\u6d4b\u5230\u504f\u79fb\u5bf9\u9f50\u7684\u7279\u5f81\u5206\u91cf\uff0c\u5e76\u9650\u5236\u4fee\u6b63\u5e45\u5ea6\u4ee5\u4fdd\u7559\u6709\u7528\u7684\u6210\u5458\u68c0\u6d4b\u4fe1\u53f7\u3002", "\u5728\u591a\u79cd\u73b0\u6709\u7279\u5f81\u5f0f\u68c0\u6d4b\u5668\u4e0a\u7a33\u5b9a\u63d0\u5347\u6548\u679c\uff0cAUC \u6700\u9ad8\u63d0\u5347 7.0%\uff0cTPR@5%FPR \u6700\u9ad8\u63d0\u5347 15.0%\u3002"], "keywords": ["\u6570\u636e\u6c61\u67d3\u68c0\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9690\u79c1\u5b89\u5168", "\u6a21\u578b\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10462v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Calibrating Post-Training Feature Shifts for LLM Data Contamination Detection", "tldr": "\u6821\u51c6\u540e\u8bad\u7ec3\u7279\u5f81\u504f\u79fb\uff0c\u63d0\u5347LLM\u6570\u636e\u6c61\u67d3\u68c0\u6d4b\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CalibDCD\uff0c\u4e00\u4e2a\u7528\u4e8e\u7279\u5f81\u5f0f LLM \u6570\u636e\u6c61\u67d3\u68c0\u6d4b\u7684\u901a\u7528\u6821\u51c6\u6846\u67b6\u3002\u5b83\u9488\u5bf9\u6307\u4ee4\u5fae\u8c03\u3001\u504f\u597d\u4f18\u5316\u7b49\u540e\u8bad\u7ec3\u5bfc\u81f4\u7684\u6210\u5458\u7279\u5f81\u504f\u79fb\uff0c\u68c0\u6d4b\u5e76\u4fee\u6b63\u504f\u79fb\u4ee5\u6539\u5584\u8bad\u7ec3\u8bed\u6599\u6210\u5458\u5224\u5b9a\u3002", "why_notable": "\u73b0\u4ee3 LLM \u666e\u904d\u7ecf\u8fc7\u540e\u8bad\u7ec3\uff0c\u53ef\u80fd\u663e\u8457\u524a\u5f31\u6570\u636e\u6c61\u67d3\u68c0\u6d4b\u7684\u53ef\u9760\u6027\uff1b\u8be5\u65b9\u6cd5\u4e3a\u5df2\u6709\u68c0\u6d4b\u5668\u63d0\u4f9b\u901a\u7528\u6821\u51c6\u5c42\uff0c\u63d0\u5347\u7248\u6743\u3001\u9690\u79c1\u548c\u8bad\u7ec3\u6570\u636e\u5ba1\u8ba1\u573a\u666f\u4e2d\u7684\u5b9e\u7528\u6027\u3002"}, {"abstract": "Multimodal large language models (MLLMs) have demonstrated remarkable capabilities in storing and recalling rich person-related knowledge, raising increasing concerns about reliable knowledge removal. However, existing machine unlearning approaches for MLLMs typically assume access to original forget and retain corpora, which are often unavailable in realistic deletion scenarios. To address this limitation, we introduce PRMU, a benchmark for evaluating corpus-free multimodal unlearning under realistic person-centric deletion requests. PRMU focuses on naturally acquired person-related knowledge and evaluates whether models can remove target knowledge while preserving related knowledge through diverse textual and visual probes, including adversarial evaluation and fine-grained locality analysis. To facilitate research in this setting, we further introduce Similarity-Gated Projection Editing (SGPE), a lightweight corpus-free unlearning baseline with knowledge displacement, protected parameter-space editing, and locality-aware multimodal control. Extensive experiments on representative MLLMs reveal that existing unlearning methods often suffer from unfavorable forgetting-locality trade-offs, with significant locality degradation under aggressive forgetting settings, and remain vulnerable to multimodal knowledge reactivation. Meanwhile, SGPE provides a competitive trade-off between target forgetting, locality preservation, and general multimodal utility. We hope PRMU can facilitate future research toward realistic and scalable multimodal machine unlearning. Code and dataset will be released at https://github.com/2231122/PRMU.", "arxiv_id": "2608.11149", "arxiv_url": "https://arxiv.org/abs/2608.11149", "authors": ["Huafeng Chen", "Yueming Lyu", "Ziyuan Chen", "Wenda Tan", "Chenyang Si", "Liucheng Guo", "Caifeng Shan"], "brief": "\u8bba\u6587\u63d0\u51fa PRMU\uff0c\u4e00\u4e2a\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u771f\u5b9e\u4eba\u7269\u5220\u9664\u8bf7\u6c42\u4e0b\u8fdb\u884c\u65e0\u8bed\u6599\u673a\u5668\u9057\u5fd8\u7684\u57fa\u51c6\u3002\u5b83\u8fd8\u63d0\u4f9b\u8f7b\u91cf\u57fa\u7ebf SGPE\uff0c\u7528\u4e8e\u5728\u65e0\u539f\u59cb\u9057\u5fd8/\u4fdd\u7559\u8bed\u6599\u6761\u4ef6\u4e0b\u5220\u9664\u76ee\u6807\u4eba\u7269\u77e5\u8bc6\u5e76\u5c3d\u91cf\u4fdd\u6301\u76f8\u5173\u77e5\u8bc6\u4e0e\u901a\u7528\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11149", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["PRMU \u805a\u7126\u6a21\u578b\u81ea\u7136\u4e60\u5f97\u7684\u4eba\u7269\u76f8\u5173\u77e5\u8bc6\uff0c\u4f7f\u7528\u6587\u672c\u4e0e\u89c6\u89c9\u63a2\u9488\u8bc4\u4f30\u9057\u5fd8\u6548\u679c\u3001\u77e5\u8bc6\u4fdd\u7559\u548c\u591a\u6a21\u6001\u91cd\u6fc0\u6d3b\u98ce\u9669\u3002", "\u57fa\u51c6\u5305\u542b\u5bf9\u6297\u8bc4\u4f30\u4e0e\u7ec6\u7c92\u5ea6\u5c40\u90e8\u6027\u5206\u6790\uff0c\u7528\u4e8e\u8861\u91cf\u5220\u9664\u76ee\u6807\u77e5\u8bc6\u65f6\u662f\u5426\u7834\u574f\u76f8\u90bb\u4eba\u7269\u6216\u76f8\u5173\u4e8b\u5b9e\u3002", "\u63d0\u51fa Similarity-Gated Projection Editing\uff0c\u901a\u8fc7\u77e5\u8bc6\u4f4d\u79fb\u3001\u53d7\u4fdd\u62a4\u53c2\u6570\u7a7a\u95f4\u7f16\u8f91\u548c\u5c40\u90e8\u6027\u611f\u77e5\u591a\u6a21\u6001\u63a7\u5236\uff0c\u5b9e\u73b0\u8f83\u597d\u7684\u9057\u5fd8-\u5c40\u90e8\u6027-\u901a\u7528\u80fd\u529b\u6743\u8861\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u673a\u5668\u9057\u5fd8", "\u9690\u79c1\u4fdd\u62a4", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11149v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "PRMU: A Corpus-Free Benchmark for Person-Centric Knowledge Unlearning in Multimodal Large Language Models", "tldr": "\u63d0\u51fa\u9762\u5411\u4eba\u7269\u77e5\u8bc6\u7684\u65e0\u8bed\u6599\u591a\u6a21\u6001\u9057\u5fd8\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PRMU\uff0c\u4e00\u4e2a\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u771f\u5b9e\u4eba\u7269\u5220\u9664\u8bf7\u6c42\u4e0b\u8fdb\u884c\u65e0\u8bed\u6599\u673a\u5668\u9057\u5fd8\u7684\u57fa\u51c6\u3002\u5b83\u8fd8\u63d0\u4f9b\u8f7b\u91cf\u57fa\u7ebf SGPE\uff0c\u7528\u4e8e\u5728\u65e0\u539f\u59cb\u9057\u5fd8/\u4fdd\u7559\u8bed\u6599\u6761\u4ef6\u4e0b\u5220\u9664\u76ee\u6807\u4eba\u7269\u77e5\u8bc6\u5e76\u5c3d\u91cf\u4fdd\u6301\u76f8\u5173\u77e5\u8bc6\u4e0e\u901a\u7528\u80fd\u529b\u3002", "why_notable": "\u73b0\u6709\u591a\u6a21\u6001\u9057\u5fd8\u65b9\u6cd5\u901a\u5e38\u5047\u8bbe\u53ef\u8bbf\u95ee\u539f\u59cb\u9057\u5fd8\u548c\u4fdd\u7559\u8bed\u6599\uff0c\u800c\u771f\u5b9e\u9690\u79c1\u5220\u9664\u573a\u666f\u4e2d\u5f80\u5f80\u4e0d\u53ef\u5f97\uff1bPRMU \u5c06\u8bc4\u6d4b\u63a8\u8fdb\u5230\u66f4\u73b0\u5b9e\u7684\u65e0\u8bed\u6599\u3001\u4eba\u7269\u4e2d\u5fc3\u8bbe\u7f6e\uff0c\u5e76\u63ed\u793a\u73b0\u6709\u65b9\u6cd5\u6613\u51fa\u73b0\u5c40\u90e8\u6027\u9000\u5316\u548c\u591a\u6a21\u6001\u77e5\u8bc6\u518d\u6fc0\u6d3b\u95ee\u9898\u3002"}, {"abstract": "Attribute hallucination---where vision-language models (VLMs) correctly identify an object but mischaracterize its properties---is prevalent yet mechanistically poorly understood. The dominant explanation, language-prior dominance, has motivated prior-suppression methods, but this explanation has not been directly tested at the attribute level. We present VISOR (Visual-Operational Remediation), a unified framework that couples null-image-based diagnosis with routed remediation. Its VSNR diagnostic decomposes each prediction into a visual logit signal and a language-prior signal. Across 10,791 negative-ground-truth samples from three VLM families and three attribute types, the visual signal strongly predicts false positives, whereas the language-prior signal is near chance. VISOR uses this diagnosis to separate two failure modes: low-margin but directionally correct visual signals in color/state attributes, and low-SNR or misaligned visual signals in material attributes. The same diagnosis routes each query to the appropriate operator: calibration for threshold-placement errors, abstention for training-free low-SNR handling, or targeted visual adaptation for material failures that prior suppression cannot correct. Across Qwen, InternVL, and LLaVA, VISOR reduces attribute false positives without relying on the prior-dominance assumption.", "arxiv_id": "2608.11024", "arxiv_url": "https://arxiv.org/abs/2608.11024", "authors": ["Yufei Zhang", "Chenlu Zhan", "Hongwei Wang"], "brief": "\u672c\u6587\u63d0\u51fa VISOR \u6846\u67b6\uff0c\u7528\u7a7a\u56fe\u50cf\u8bca\u65ad\u5c06 VLM \u7684\u5c5e\u6027\u9884\u6d4b\u5206\u89e3\u4e3a\u89c6\u89c9 logit \u4fe1\u53f7\u4e0e\u8bed\u8a00\u5148\u9a8c\u4fe1\u53f7\uff0c\u5e76\u636e\u6b64\u8fdb\u884c\u8def\u7531\u5f0f\u4fee\u590d\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5728\u591a\u6a21\u578b\u3001\u591a\u5c5e\u6027\u7c7b\u578b\u4e0a\uff0c\u5c5e\u6027\u8bef\u62a5\u66f4\u5f3a\u5730\u7531\u89c6\u89c9\u4fe1\u53f7\u800c\u975e\u8bed\u8a00\u5148\u9a8c\u9a71\u52a8\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11024", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 Qwen\u3001InternVL\u3001LLaVA \u4e09\u7c7b VLM \u548c\u989c\u8272\u3001\u72b6\u6001\u3001\u6750\u8d28\u4e09\u7c7b\u5c5e\u6027\u4e0a\uff0c\u5206\u6790\u4e86 10,791 \u4e2a\u8d1f\u6837\u672c\u3002", "VSNR \u8bca\u65ad\u663e\u793a\u89c6\u89c9\u4fe1\u53f7\u80fd\u5f3a\u9884\u6d4b\u5c5e\u6027\u5047\u9633\u6027\uff0c\u800c\u8bed\u8a00\u5148\u9a8c\u4fe1\u53f7\u63a5\u8fd1\u968f\u673a\uff0c\u6311\u6218\u4e86\u201c\u8bed\u8a00\u5148\u9a8c\u4e3b\u5bfc\u201d\u89e3\u91ca\u3002", "VISOR \u6839\u636e\u6545\u969c\u7c7b\u578b\u9009\u62e9\u6821\u51c6\u3001\u62d2\u7b54\u6216\u9488\u5bf9\u6027\u89c6\u89c9\u9002\u914d\uff0c\u964d\u4f4e\u5c5e\u6027\u8bef\u62a5\u4e14\u4e0d\u4f9d\u8d56\u5148\u9a8c\u6291\u5236\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9\u68c0\u6d4b", "\u6a21\u578b\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11024v1", "published_at": "2026-08-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Visual Signals Mislead: A Mechanistic Study of Attribute Hallucination in Vision-Language Models", "tldr": "\u5c5e\u6027\u5e7b\u89c9\u4e3b\u8981\u6e90\u4e8e\u8bef\u5bfc\u6027\u89c6\u89c9\u4fe1\u53f7", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa VISOR \u6846\u67b6\uff0c\u7528\u7a7a\u56fe\u50cf\u8bca\u65ad\u5c06 VLM \u7684\u5c5e\u6027\u9884\u6d4b\u5206\u89e3\u4e3a\u89c6\u89c9 logit \u4fe1\u53f7\u4e0e\u8bed\u8a00\u5148\u9a8c\u4fe1\u53f7\uff0c\u5e76\u636e\u6b64\u8fdb\u884c\u8def\u7531\u5f0f\u4fee\u590d\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5728\u591a\u6a21\u578b\u3001\u591a\u5c5e\u6027\u7c7b\u578b\u4e0a\uff0c\u5c5e\u6027\u8bef\u62a5\u66f4\u5f3a\u5730\u7531\u89c6\u89c9\u4fe1\u53f7\u800c\u975e\u8bed\u8a00\u5148\u9a8c\u9a71\u52a8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u673a\u5236\u5c42\u9762\u91cd\u65b0\u89e3\u91ca VLM \u5c5e\u6027\u5e7b\u89c9\uff0c\u6307\u51fa\u8bb8\u591a\u9519\u8bef\u5e76\u975e\u8bed\u8a00\u504f\u89c1\u8fc7\u5f3a\uff0c\u800c\u662f\u89c6\u89c9\u8bc1\u636e\u4f4e\u4fe1\u566a\u6bd4\u6216\u65b9\u5411\u9519\u8bef\uff1b\u8fd9\u4e3a\u66f4\u7cbe\u786e\u7684\u5e7b\u89c9\u8bca\u65ad\u4e0e\u4fee\u590d\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "GUI Visual Grounding is a fundamental capability for GUI agents. Existing models typically freeze their parameters after deployment, limiting their ability to adapt to unseen interfaces. Although recent methods attempt to adapt models via test-time reinforcement learning, they cannot reflect upon failed exploration. To overcome this, we propose a Test-Time Self-Evolving framework that enables models to improve after deployment without human-annotated ground truth. It constructs a closed-loop of Exploration, Evaluation, Reflection, and Internalization. Specifically, the agent first explores unseen interfaces by predicting grounding coordinates for given instructions. To evaluate these explorations, we introduce an MLLM-based Reflector to assess the generated results and provide the corresponding reasoning reflections. To internalize reflection knowledge into the model weights, we propose Reflection-Guided On-Policy Self-Distillation, which translates high-level reasoning into dense token-level supervision via a conditioned self-teacher. Furthermore, we design a Contrastive Calibration method to prevent incorrect auto-regressive prefixes from corrupting the supervisory signals during failed explorations. Extensive experiments across six benchmarks demonstrate our framework\u0027s effectiveness, achieving an average accuracy improvement of 7.4% over the base model. To the best of our knowledge, this is the first work to successfully exploit on-policy self-distillation for test-time adaptation in GUI visual grounding. By filling the gap in post-deployment adaptation, our framework completes the self-evolving capability of GUI agents. The code will be released.", "arxiv_id": "2608.11191", "arxiv_url": "https://arxiv.org/abs/2608.11191", "authors": ["Shiyu Xuan", "Zechao Li"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u6d4b\u8bd5\u65f6\u81ea\u8fdb\u5316\u7684 GUI \u89c6\u89c9\u5b9a\u4f4d\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5728\u90e8\u7f72\u540e\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u5373\u53ef\u901a\u8fc7\u63a2\u7d22\u3001\u8bc4\u4f30\u3001\u53cd\u601d\u548c\u5185\u5316\u6765\u9002\u5e94\u672a\u77e5\u754c\u9762\u3002\u65b9\u6cd5\u5f15\u5165\u591a\u6a21\u6001\u5927\u6a21\u578b\u53cd\u601d\u5668\u3001\u53cd\u601d\u5f15\u5bfc\u7684 on-policy \u81ea\u84b8\u998f\u548c\u5bf9\u6bd4\u6821\u51c6\uff0c\u5728\u516d\u4e2a\u57fa\u51c6\u4e0a\u76f8\u8f83\u57fa\u7840\u6a21\u578b\u5e73\u5747\u51c6\u786e\u7387\u63d0\u5347 7.4%\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11191", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u5b9a\u4f4d", "\u81ea\u84b8\u998f", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11191v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Test-Time Self-Evolving GUI Visual Grounding via Reflection-Guided On-Policy Self-Distillation", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u6d4b\u8bd5\u65f6\u81ea\u8fdb\u5316\u7684 GUI \u89c6\u89c9\u5b9a\u4f4d\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5728\u90e8\u7f72\u540e\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u5373\u53ef\u901a\u8fc7\u63a2\u7d22\u3001\u8bc4\u4f30\u3001\u53cd\u601d\u548c\u5185\u5316\u6765\u9002\u5e94\u672a\u77e5\u754c\u9762\u3002\u65b9\u6cd5\u5f15\u5165\u591a\u6a21\u6001\u5927\u6a21\u578b\u53cd\u601d\u5668\u3001\u53cd\u601d\u5f15\u5bfc\u7684 on-policy \u81ea\u84b8\u998f\u548c\u5bf9\u6bd4\u6821\u51c6\uff0c\u5728\u516d\u4e2a\u57fa\u51c6\u4e0a\u76f8\u8f83\u57fa\u7840\u6a21\u578b\u5e73\u5747\u51c6\u786e\u7387\u63d0\u5347 7.4%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic coding READMEs like CLAUDE.md grow without bound in real repositories, stopping only when the repository retires or someone rewrites the file wholesale. We trace this to imperfect recall: appending an instruction is always cheap, but once an instruction\u0027s rationale is gone, deleting it without risking a correctness regression costs O(2^|D|) in a prompt of |D| instructions. We name the resulting divergence catastrophic remembering, the inverse of catastrophic forgetting around which continual learning is organized. First, we characterize this phenomenon across 247,694 instruction lifetimes in 1,867 repositories: agentic prompts grow without bound, more than tripling over their lifetime (+226%), gaining +4.9 net instructions every commit; further, the older an instruction gets, the less likely it is to be deleted (log-hazard -0.032/commit). Then, we show that prompt comments can halt the growth: inverting IFEval yields verifiable worlds whose optimal prompts are known, and there comments encoding latent reasoning remove 99.3% of excess instructions (+211.3% to +1.4%). Finally, applying the same inversion to WildIFEval, we show that prompt comments can improve real-world agentic instruction-following by up to 23.1%. If English is the new code, why don\u0027t we have comments yet?", "arxiv_id": "2608.11095", "arxiv_url": "https://arxiv.org/abs/2608.11095", "authors": ["Kushal Chakrabarti"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u707e\u96be\u6027\u8bb0\u5fc6\u201d\u73b0\u8c61\uff1a\u667a\u80fd\u4f53\u7f16\u7a0b\u4e2d\u7684 CLAUDE.md \u7b49\u63d0\u793a\u6587\u4ef6\u56e0\u65e7\u6307\u4ee4\u7f3a\u4e4f\u53ef\u8ffd\u6eaf\u7406\u7531\uff0c\u5220\u9664\u98ce\u9669\u9ad8\uff0c\u5bfc\u81f4\u53ea\u80fd\u4e0d\u65ad\u8ffd\u52a0\u800c\u96be\u4ee5\u6536\u7f29\u3002\u4f5c\u8005\u5728 1867 \u4e2a\u4ed3\u5e93\u4e2d\u9a8c\u8bc1\u63d0\u793a\u4f1a\u6301\u7eed\u81a8\u80c0\uff0c\u5e76\u901a\u8fc7\u4e3a\u63d0\u793a\u52a0\u5165\u89e3\u91ca\u6027\u6ce8\u91ca\uff0c\u5728\u53ef\u9a8c\u8bc1\u4efb\u52a1\u4e2d\u51e0\u4e4e\u6d88\u9664\u5197\u4f59\u6307\u4ee4\uff0c\u5728\u771f\u5b9e\u6307\u4ee4\u9075\u5faa\u4efb\u52a1\u4e2d\u6700\u9ad8\u63d0\u5347 23.1%\u3002", "categories": ["cs.AI", "cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11095", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u63d0\u793a\u5de5\u7a0b", "\u6301\u7eed\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11095v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Why Does CLAUDE.md Keep Growing? Catastrophic Remembering in Agentic Coding", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u707e\u96be\u6027\u8bb0\u5fc6\u201d\u73b0\u8c61\uff1a\u667a\u80fd\u4f53\u7f16\u7a0b\u4e2d\u7684 CLAUDE.md \u7b49\u63d0\u793a\u6587\u4ef6\u56e0\u65e7\u6307\u4ee4\u7f3a\u4e4f\u53ef\u8ffd\u6eaf\u7406\u7531\uff0c\u5220\u9664\u98ce\u9669\u9ad8\uff0c\u5bfc\u81f4\u53ea\u80fd\u4e0d\u65ad\u8ffd\u52a0\u800c\u96be\u4ee5\u6536\u7f29\u3002\u4f5c\u8005\u5728 1867 \u4e2a\u4ed3\u5e93\u4e2d\u9a8c\u8bc1\u63d0\u793a\u4f1a\u6301\u7eed\u81a8\u80c0\uff0c\u5e76\u901a\u8fc7\u4e3a\u63d0\u793a\u52a0\u5165\u89e3\u91ca\u6027\u6ce8\u91ca\uff0c\u5728\u53ef\u9a8c\u8bc1\u4efb\u52a1\u4e2d\u51e0\u4e4e\u6d88\u9664\u5197\u4f59\u6307\u4ee4\uff0c\u5728\u771f\u5b9e\u6307\u4ee4\u9075\u5faa\u4efb\u52a1\u4e2d\u6700\u9ad8\u63d0\u5347 23.1%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "After an older adult misses a medication dose, a software agent can send another reminder and an embodied agent can bring the medication. Yet neither explains whether the person forgot, is confused, has side effects, or deliberately refused, nor what support is appropriate. This reveals a structural gap in Agentic AI: Digital Agents primarily transform software states, while Embodied Agents transform physical states; neither makes a person\u0027s evolving state and agency the primary object of modeling, intervention, and evaluation. We introduce Combodied Agents, a human-centered paradigm that perceives, models, predicts, and supports individual human-state trajectories over time, using software tools, sensors, wearables, robots, and human services as action channels rather than end goals. We unify fragmented capabilities across personal assistants, health agents, AI companions, and adaptive human--AI systems into a closed loop: event-based multimodal perception reconstructs meaningful personal events; longitudinal, correctable memory provides temporal context; Personal World Models estimate future personal states and outcomes under alternative decisions and interventions; and an admissible intervention policy selects proportionate support under consent, uncertainty, safety, reversibility, and user control. Feedback from the person and environment updates the loop. Rather than requiring an exhaustive Human Digital Twin, the framework uses purpose-bounded, uncertainty-aware, user-correctable representations. We organize the design space by human-state targets, relational contexts, and agent roles, and propose scenario-centered evaluation, agency-preservation metrics, benchmark requirements, edge-native personal models, and governance directions. Combodied Agents shift Agentic AI from external task completion toward sustained human benefit.", "arxiv_id": "2608.10915", "arxiv_url": "https://arxiv.org/abs/2608.10915", "authors": ["Qianggang Ding", "Xingyao Wang", "Rui Feng", "Zhibin Wang", "Feixiang Wang", "Kelong Mao", "Hao Sun", "Zhiyao Luo", "Jiankai Tang", "Lei Li", "Jiadong Guo", "Minheng Ni", "Weicong Lin", "Chenxi Yang", "Hongxiang Gao", "Zhenghua Chen", "Yang Bai", "Min Wu", "Jun Cheng", "Huazhu Fu", "Dacheng Tao", "Bang Liu"], "brief": "\u8bba\u6587\u63d0\u51fa\u201cComBodied Agents\u201d\u4f5c\u4e3a\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684\u667a\u80fd\u4f53\u65b0\u8303\u5f0f\uff0c\u5c06\u4eba\u7684\u52a8\u6001\u72b6\u6001\u3001\u610f\u613f\u4e0e\u957f\u671f\u798f\u7949\u4f5c\u4e3a\u5efa\u6a21\u3001\u9884\u6d4b\u548c\u5e72\u9884\u7684\u6838\u5fc3\uff0c\u800c\u4e0d\u662f\u4ec5\u5b8c\u6210\u8f6f\u4ef6\u6216\u7269\u7406\u4efb\u52a1\u3002\u8be5\u6846\u67b6\u6574\u5408\u591a\u6a21\u6001\u611f\u77e5\u3001\u957f\u671f\u53ef\u7ea0\u6b63\u8bb0\u5fc6\u3001\u4e2a\u4eba\u4e16\u754c\u6a21\u578b\u548c\u53d7\u7ea6\u675f\u5e72\u9884\u7b56\u7565\uff0c\u5f3a\u8c03\u540c\u610f\u3001\u5b89\u5168\u3001\u53ef\u9006\u6027\u4e0e\u7528\u6237\u63a7\u5236\uff0c\u5e76\u63d0\u51fa\u76f8\u5e94\u8bc4\u4f30\u548c\u6cbb\u7406\u65b9\u5411\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10915", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4eba\u673a\u4ea4\u4e92", "\u591a\u6a21\u6001", "\u4e2a\u4eba\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10915v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ComBodied Agents: a New Paradigm of Human-Centric Agentic AI", "tldr": "\u8bba\u6587\u63d0\u51fa\u201cComBodied Agents\u201d\u4f5c\u4e3a\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684\u667a\u80fd\u4f53\u65b0\u8303\u5f0f\uff0c\u5c06\u4eba\u7684\u52a8\u6001\u72b6\u6001\u3001\u610f\u613f\u4e0e\u957f\u671f\u798f\u7949\u4f5c\u4e3a\u5efa\u6a21\u3001\u9884\u6d4b\u548c\u5e72\u9884\u7684\u6838\u5fc3\uff0c\u800c\u4e0d\u662f\u4ec5\u5b8c\u6210\u8f6f\u4ef6\u6216\u7269\u7406\u4efb\u52a1\u3002\u8be5\u6846\u67b6\u6574\u5408\u591a\u6a21\u6001\u611f\u77e5\u3001\u957f\u671f\u53ef\u7ea0\u6b63\u8bb0\u5fc6\u3001\u4e2a\u4eba\u4e16\u754c\u6a21\u578b\u548c\u53d7\u7ea6\u675f\u5e72\u9884\u7b56\u7565\uff0c\u5f3a\u8c03\u540c\u610f\u3001\u5b89\u5168\u3001\u53ef\u9006\u6027\u4e0e\u7528\u6237\u63a7\u5236\uff0c\u5e76\u63d0\u51fa\u76f8\u5e94\u8bc4\u4f30\u548c\u6cbb\u7406\u65b9\u5411\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Computer-using agents can perceive rich software interfaces, yet their decisions often lack visual procedural memory: they may recognize individual controls without identifying which familiar workflow is active, which control matters next, or what evidence would confirm progress. Raw interaction traces preserve such information but are long and noisy to condition on, whereas text-only skills often omit the visual state that makes a procedure applicable. We introduce Visual Skill Cards (VSCs), a state-conditioned memory representation that binds reusable procedures with applicability cues, visual evidence, and verification signals. SkillLens constructs VSCs from heterogeneous interaction experience through Trace-to-Visual-Skill-Card and, at inference time, retrieves relevant cards and selectively expands only the evidence needed by a fixed visual-language model executor for grounded GUI action prediction. The same representation also supports CardDistill, which uses VSC evidence as privileged teacher context to train a student that acts without runtime card retrieval. Across Multimodal-Mind2Web and WebLINX-BrowserGym, SkillLens improves the frozen GPT-5.4-mini executor by +11.6 points in Step SR and +2.9 points in Overall, respectively; CardDistill further improves the corresponding student-only Qwen3-VL-2B metrics by +12.0 and +3.2 points.", "arxiv_id": "2608.10775", "arxiv_url": "https://arxiv.org/abs/2608.10775", "authors": ["Zhou Liu", "Ligang Huang", "Zeli Su", "Zewei Pan", "Zhaoyang Han", "Xing Chen", "Yuanfeng Song", "Wentao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Visual Skill Cards\uff0c\u5c06 GUI \u64cd\u4f5c\u6d41\u7a0b\u4e0e\u9002\u7528\u89c6\u89c9\u7ebf\u7d22\u3001\u8bc1\u636e\u548c\u9a8c\u8bc1\u4fe1\u53f7\u7ed1\u5b9a\uff0c\u4f5c\u4e3a\u68c0\u7d22\u589e\u5f3a\u7684\u7a0b\u5e8f\u5316\u89c6\u89c9\u8bb0\u5fc6\u3002SkillLens \u5728\u63a8\u7406\u65f6\u68c0\u7d22\u76f8\u5173\u5361\u7247\u8f85\u52a9\u56fa\u5b9a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9884\u6d4b GUI \u52a8\u4f5c\uff0c\u5e76\u53ef\u901a\u8fc7 CardDistill \u84b8\u998f\u5230\u65e0\u9700\u68c0\u7d22\u7684\u5b66\u751f\u6a21\u578b\uff1b\u5728 Multimodal-Mind2Web \u548c WebLINX-BrowserGym \u4e0a\u663e\u8457\u63d0\u5347\u6b65\u9aa4\u6210\u529f\u7387\u548c\u6574\u4f53\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10775", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "GUI\u64cd\u4f5c", "\u68c0\u7d22\u589e\u5f3a", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10775v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SkillLens: Visual Skill Cards for Retrieval-Augmented GUI Action Prediction and On-Policy Distillation", "tldr": "\u8bba\u6587\u63d0\u51fa Visual Skill Cards\uff0c\u5c06 GUI \u64cd\u4f5c\u6d41\u7a0b\u4e0e\u9002\u7528\u89c6\u89c9\u7ebf\u7d22\u3001\u8bc1\u636e\u548c\u9a8c\u8bc1\u4fe1\u53f7\u7ed1\u5b9a\uff0c\u4f5c\u4e3a\u68c0\u7d22\u589e\u5f3a\u7684\u7a0b\u5e8f\u5316\u89c6\u89c9\u8bb0\u5fc6\u3002SkillLens \u5728\u63a8\u7406\u65f6\u68c0\u7d22\u76f8\u5173\u5361\u7247\u8f85\u52a9\u56fa\u5b9a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9884\u6d4b GUI \u52a8\u4f5c\uff0c\u5e76\u53ef\u901a\u8fc7 CardDistill \u84b8\u998f\u5230\u65e0\u9700\u68c0\u7d22\u7684\u5b66\u751f\u6a21\u578b\uff1b\u5728 Multimodal-Mind2Web \u548c WebLINX-BrowserGym \u4e0a\u663e\u8457\u63d0\u5347\u6b65\u9aa4\u6210\u529f\u7387\u548c\u6574\u4f53\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The Model Context Protocol (MCP) has become the de-facto interface for connecting LLM agents to enterprise tools, and adoption has been explosive: within a year, large organizations went from zero to dozens of internally built MCP servers. That speed created a governance crisis. Each team implemented authentication independently -- some with no auth, some with API keys, some with full OAuth -- producing a fragmented landscape with no consistent way to authorize callers, track who did what, or offboard a departing employee across the fleet. This paper reports an industry deployment that resolves the crisis with a centralized MCP gateway: a single aggregation, governance, and authentication layer that fronts every downstream MCP server. We make four contributions grounded in production experience. First, a two-axis authentication model crossing persona (interactive user vs. automated non-user) with credential type (no-auth, static/dynamic API key, PKCE, client credentials, platform app-context). Second, a gateway authentication layer supporting three enterprise SSO grants and three token-provisioning models: Bring-Your-Own-Token, Generate-Your-Own-Token, and delegated OAuth via RFC 8693 token exchange. Third, three end-to-end identity flows -- User-to-OAuth2, Non-user-to-Service-Account, and User-to-Service-Account -- composing client, gateway, and server. Fourth, the deployment evolution from CDN/WAF/edge perimeter to private MCP tunnels and enterprise-wide connectors. The architecture is in production, fronting dozens of MCP servers across web, desktop, custom-SDK, and low-code clients.", "arxiv_id": "2608.10760", "arxiv_url": "https://arxiv.org/abs/2608.10760", "authors": ["Suraj Kumar", "Amy Wang", "Srinivasan Manoharan"], "brief": "\u672c\u6587\u63d0\u51fa\u5e76\u843d\u5730\u4e86\u4e00\u5957\u4f01\u4e1a\u7ea7 MCP \u7f51\u5173\u67b6\u6784\uff0c\u7528\u7edf\u4e00\u7684\u805a\u5408\u3001\u6cbb\u7406\u4e0e\u8ba4\u8bc1\u5c42\u63a5\u7ba1\u5206\u6563\u7684 MCP \u670d\u52a1\u5668\u8ba4\u8bc1\u95ee\u9898\u3002\u5b83\u652f\u6301\u7528\u6237/\u975e\u7528\u6237\u8eab\u4efd\u3001API Key\u3001OAuth\u3001SSO\u3001\u4ee4\u724c\u4ea4\u6362\u7b49\u591a\u79cd\u573a\u666f\uff0c\u5e76\u5df2\u5728\u751f\u4ea7\u73af\u5883\u4e2d\u670d\u52a1\u6570\u5341\u4e2a MCP \u670d\u52a1\u5668\uff0c\u63d0\u5347\u4e86\u6388\u6743\u4e00\u81f4\u6027\u3001\u5ba1\u8ba1\u4e0e\u79bb\u804c\u56de\u6536\u80fd\u529b\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10760", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8eab\u4efd\u8ba4\u8bc1", "\u4f01\u4e1a\u5b89\u5168", "MCP"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10760v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A Gateway Architecture for Enterprise MCP Authentication: Unifying Heterogeneous Auth, Identity Delegation, and the User / Non-User Persona Problem", "tldr": "\u672c\u6587\u63d0\u51fa\u5e76\u843d\u5730\u4e86\u4e00\u5957\u4f01\u4e1a\u7ea7 MCP \u7f51\u5173\u67b6\u6784\uff0c\u7528\u7edf\u4e00\u7684\u805a\u5408\u3001\u6cbb\u7406\u4e0e\u8ba4\u8bc1\u5c42\u63a5\u7ba1\u5206\u6563\u7684 MCP \u670d\u52a1\u5668\u8ba4\u8bc1\u95ee\u9898\u3002\u5b83\u652f\u6301\u7528\u6237/\u975e\u7528\u6237\u8eab\u4efd\u3001API Key\u3001OAuth\u3001SSO\u3001\u4ee4\u724c\u4ea4\u6362\u7b49\u591a\u79cd\u573a\u666f\uff0c\u5e76\u5df2\u5728\u751f\u4ea7\u73af\u5883\u4e2d\u670d\u52a1\u6570\u5341\u4e2a MCP \u670d\u52a1\u5668\uff0c\u63d0\u5347\u4e86\u6388\u6743\u4e00\u81f4\u6027\u3001\u5ba1\u8ba1\u4e0e\u79bb\u804c\u56de\u6536\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speech-to-speech (S2S) voice agents are increasingly being incorporated into enterprise for customer care and as daily companions for consumers owing to the ease of the conversational modality over text. However, existing benchmarks fail to holistically evaluate voice agents along axes that really matter and are shaped as tests of agentic tool calling against a database. We believe they fail to adequately account for the diversity of conversational dialogue that mundane activities introduce and further, never test how faithfully an agent can assist on tasks that move beyond database manipulation. To tackle this DuplexWorld introduces six worlds where voice agents are especially useful: banking, insurance, travel, healthcare and logistics, and Pathfinding. Agents are evaluated on eleven different types of conversations across 156 scenarios (350+ hours of conversation), each testing conversational and analytical capability to varying degrees. Through extensive evaluation comprising agentic, conversational and speech-naturalness metrics, we show that even the best voice agents leave substantial room for improvement on all 3 axes (Pass@1: 0.490, turn-taking: 0.653, DNSMOS: 3.378). We perform extensive analysis on agentic v conversational performance, world- and conversation type-wise performance, failure modes exploring the explore v exploit lens for Pathfinding conversations and voice agent reliability over all six worlds.", "arxiv_id": "2608.10716", "arxiv_url": "https://arxiv.org/abs/2608.10716", "authors": ["Aryan Vijay Bhosale", "Harshit Rajgarhia", "Akhil Pothanapalli", "Asif Shaik", "Abhishek Mukherji", "Dinesh Manocha"], "brief": "DuplexWorld \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8bed\u97f3\u5230\u8bed\u97f3\u667a\u80fd\u4f53\u7684\u7efc\u5408\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u94f6\u884c\u3001\u4fdd\u9669\u3001\u65c5\u884c\u3001\u533b\u7597\u7269\u6d41\u548c\u5bfb\u8def\u7b49\u516d\u7c7b\u65e5\u5e38\u573a\u666f\uff0c\u5305\u542b 156 \u4e2a\u60c5\u666f\u548c 350+ \u5c0f\u65f6\u5bf9\u8bdd\u3002\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u6700\u5f3a\u8bed\u97f3\u667a\u80fd\u4f53\u5728\u4efb\u52a1\u5b8c\u6210\u3001\u5bf9\u8bdd\u8f6e\u6b21\u63a7\u5236\u548c\u8bed\u97f3\u81ea\u7136\u5ea6\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3\uff0cPass@1 \u4ec5 0.490\u3002", "categories": ["cs.SD", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10716", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u667a\u80fd\u4f53", "\u5bf9\u8bdd\u7cfb\u7edf", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u8bed\u97f3\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10716v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DuplexWorld: Can voice agents help you get through the day?", "tldr": "DuplexWorld \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8bed\u97f3\u5230\u8bed\u97f3\u667a\u80fd\u4f53\u7684\u7efc\u5408\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u94f6\u884c\u3001\u4fdd\u9669\u3001\u65c5\u884c\u3001\u533b\u7597\u7269\u6d41\u548c\u5bfb\u8def\u7b49\u516d\u7c7b\u65e5\u5e38\u573a\u666f\uff0c\u5305\u542b 156 \u4e2a\u60c5\u666f\u548c 350+ \u5c0f\u65f6\u5bf9\u8bdd\u3002\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u6700\u5f3a\u8bed\u97f3\u667a\u80fd\u4f53\u5728\u4efb\u52a1\u5b8c\u6210\u3001\u5bf9\u8bdd\u8f6e\u6b21\u63a7\u5236\u548c\u8bed\u97f3\u81ea\u7136\u5ea6\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3\uff0cPass@1 \u4ec5 0.490\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The Organic 6G vision of a network of networks spanning an edge-cloud continuum complemented by non-terrestrial resources requires, to realize its promise, service provisioning that is simple to operate, scalable across independently administered domains, and agile under domain churn (i.e., domains dynamically joining and leaving). Despite advances in cross-domain orchestration, many proposals rely on heavy integration fabrics, multi-layer coordinators, and deep telemetry pipelines that hinder deployability and amplify coordination overhead. We propose a lightweight, decentralized conversational orchestration framework based on Large Language Model (LLM)-driven domain agents. Each domain remains autonomous: an agent observes local state via tools, reasons in a closed loop, and exchanges summaries with neighboring agents over an Agent-to-Agent (A2A) overlay aligned with data-plane coupling. Fast feasible placement is enabled by periodic, routing-like dissemination of reachability advertisements (latency, bottleneck bandwidth, and compute capacity), while safe re-optimization, scaling, and migration are handled through event-driven requests and negotiation. To meet real-time constraints, we deploy a compact reasoning model trained with verifier-based self-verification and periodically refined online via shadow updates. Simulations show manageable, near-linear control-plane overhead as domains scale and during domain joins, and robust decision quality, including recovery after objective changes. We close by outlining future research directions for principled, secure, and uncertainty-aware agentic orchestration in Organic 6G.", "arxiv_id": "2608.10714", "arxiv_url": "https://arxiv.org/abs/2608.10714", "authors": ["Masoud Shokrnezhad", "Tarik Taleb"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 Organic 6G \u7684\u8f7b\u91cf\u7ea7\u53bb\u4e2d\u5fc3\u5316\u4f1a\u8bdd\u5f0f\u7f16\u6392\u6846\u67b6\uff0c\u7528 LLM \u9a71\u52a8\u7684\u57df\u667a\u80fd\u4f53\u5728\u5404\u81ea\u6cbb\u57df\u5185\u89c2\u5bdf\u3001\u63a8\u7406\uff0c\u5e76\u901a\u8fc7 A2A \u8986\u76d6\u7f51\u7edc\u4ea4\u6362\u6458\u8981\u4e0e\u534f\u5546\u3002\u4eff\u771f\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u57df\u89c4\u6a21\u6269\u5c55\u548c\u52a8\u6001\u52a0\u5165\u65f6\u63a7\u5236\u9762\u5f00\u9500\u8fd1\u7ebf\u6027\u53ef\u63a7\uff0c\u5e76\u80fd\u5728\u76ee\u6807\u53d8\u5316\u540e\u4fdd\u6301\u8f83\u7a33\u5065\u7684\u51b3\u7b56\u4e0e\u6062\u590d\u80fd\u529b\u3002", "categories": ["cs.NI", "cs.AI", "cs.DC", "cs.ET", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10714", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "6G\u7f51\u7edc", "\u7f51\u7edc\u7f16\u6392"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10714v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Conversational Orchestration for Organic 6G", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 Organic 6G \u7684\u8f7b\u91cf\u7ea7\u53bb\u4e2d\u5fc3\u5316\u4f1a\u8bdd\u5f0f\u7f16\u6392\u6846\u67b6\uff0c\u7528 LLM \u9a71\u52a8\u7684\u57df\u667a\u80fd\u4f53\u5728\u5404\u81ea\u6cbb\u57df\u5185\u89c2\u5bdf\u3001\u63a8\u7406\uff0c\u5e76\u901a\u8fc7 A2A \u8986\u76d6\u7f51\u7edc\u4ea4\u6362\u6458\u8981\u4e0e\u534f\u5546\u3002\u4eff\u771f\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u57df\u89c4\u6a21\u6269\u5c55\u548c\u52a8\u6001\u52a0\u5165\u65f6\u63a7\u5236\u9762\u5f00\u9500\u8fd1\u7ebf\u6027\u53ef\u63a7\uff0c\u5e76\u80fd\u5728\u76ee\u6807\u53d8\u5316\u540e\u4fdd\u6301\u8f83\u7a33\u5065\u7684\u51b3\u7b56\u4e0e\u6062\u590d\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Evolutionary optimization of LLM prompts and agentic programs (e.g., GEPA) is dominated by fitness evaluation: scoring each candidate runs an answering LLM over a validation set, so the evaluator\u0027s price tier dictates total search cost. We restructure that search by decoupling the three roles an LLM plays, running the high-volume answering role on the cheapest tier, reserving a strong model for the rare reflection/variation operator, then exploiting upward cross-tier transfer to deploy the cheaply evolved prompt on a stronger target. We contribute a cost-controlled characterization of when cheap-tier search substitutes for target-tier search, and where it fails. Across four tasks (HotpotQA, IFBench, LiveBench-Math, HoVer) and eleven models in four model families, the resulting prompt matches or exceeds same-tier optimization while placing over 96% of search tokens on the cheapest tier, at 5.6-14x lower search cost, rising to 25-54x where reasoning tiers emit long chains of thought on every fitness call.", "arxiv_id": "2608.10694", "arxiv_url": "https://arxiv.org/abs/2608.10694", "authors": ["Tal Oved", "Roi Pony", "Oshri Naparstek", "Udi barzelay"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u6a21\u578b\u63d0\u793a\u8bcd\u548c\u667a\u80fd\u4f53\u7a0b\u5e8f\u7684\u4f4e\u6210\u672c\u8fdb\u5316\u4f18\u5316\u65b9\u6cd5\uff1a\u5c06\u9ad8\u9891\u7684\u5019\u9009\u8bc4\u4f30\u653e\u5728\u5ec9\u4ef7\u6a21\u578b\u4e0a\uff0c\u4ec5\u5728\u5c11\u91cf\u53cd\u601d/\u53d8\u5f02\u6b65\u9aa4\u4f7f\u7528\u5f3a\u6a21\u578b\uff0c\u518d\u628a\u5ec9\u4ef7\u5c42\u4f18\u5316\u51fa\u7684\u63d0\u793a\u8fc1\u79fb\u5230\u5f3a\u6a21\u578b\u90e8\u7f72\u3002\u5b9e\u9a8c\u8986\u76d64\u4e2a\u4efb\u52a1\u300111\u4e2a\u6a21\u578b\uff0c\u6548\u679c\u53ef\u5339\u914d\u6216\u8d85\u8fc7\u540c\u5c42\u4f18\u5316\uff0c\u540c\u65f696%\u4ee5\u4e0a\u641c\u7d22token\u4f7f\u7528\u6700\u4f4e\u4ef7\u6a21\u578b\uff0c\u641c\u7d22\u6210\u672c\u964d\u4f4e5.6-14\u500d\uff0c\u5728\u957f\u63a8\u7406\u573a\u666f\u53ef\u8fbe25-54\u500d\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10694", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63d0\u793a\u4f18\u5316", "\u8fdb\u5316\u4f18\u5316", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10694v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Optimize Cheap, Deploy Strong: Cost-Aware Cross-Tier Transfer for Evolutionary Optimization", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u6a21\u578b\u63d0\u793a\u8bcd\u548c\u667a\u80fd\u4f53\u7a0b\u5e8f\u7684\u4f4e\u6210\u672c\u8fdb\u5316\u4f18\u5316\u65b9\u6cd5\uff1a\u5c06\u9ad8\u9891\u7684\u5019\u9009\u8bc4\u4f30\u653e\u5728\u5ec9\u4ef7\u6a21\u578b\u4e0a\uff0c\u4ec5\u5728\u5c11\u91cf\u53cd\u601d/\u53d8\u5f02\u6b65\u9aa4\u4f7f\u7528\u5f3a\u6a21\u578b\uff0c\u518d\u628a\u5ec9\u4ef7\u5c42\u4f18\u5316\u51fa\u7684\u63d0\u793a\u8fc1\u79fb\u5230\u5f3a\u6a21\u578b\u90e8\u7f72\u3002\u5b9e\u9a8c\u8986\u76d64\u4e2a\u4efb\u52a1\u300111\u4e2a\u6a21\u578b\uff0c\u6548\u679c\u53ef\u5339\u914d\u6216\u8d85\u8fc7\u540c\u5c42\u4f18\u5316\uff0c\u540c\u65f696%\u4ee5\u4e0a\u641c\u7d22token\u4f7f\u7528\u6700\u4f4e\u4ef7\u6a21\u578b\uff0c\u641c\u7d22\u6210\u672c\u964d\u4f4e5.6-14\u500d\uff0c\u5728\u957f\u63a8\u7406\u573a\u666f\u53ef\u8fbe25-54\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents combine language-based reasoning with external tools to perform complex tasks. Adversarial inputs can exploit interactions between the agent and its environment, causing the agent to violate safety policies during execution. Yet existing evaluations often reduce agent safety to a single attack success rate (ASR), collapsing exposure, execution, observation, and adjudication and potentially conflating actual violations with evidence visibility. We introduce REDAgentBench, an executable framework for autonomous red-teaming and faithful measurement. It derives attacks from explicit safety constraints and associated agent-system vulnerabilities, runs them in isolated service sandboxes, and verifies harmful effects from service receipts and final-state changes. The benchmark contains 1,661 cases across five service surfaces. Across six models and three agent harnesses, macro-average ASR is 65.69%; reported ASR varies with harness and evidence view, while evaluation-context disclosure changes execution behavior. In a state-grounded diagnostic cohort, almost one in five confirmed violations with resolved action anchors occurs after the agent states the relevant constraint or risk, revealing a Recognition--Execution Gap. Finally, a training-free policy reminder reduces confirmed violations by more than 70 percentage points in matched replay. These findings show that executable evaluation can improve safety measurement and identify actionable intervention points.", "arxiv_id": "2608.10669", "arxiv_url": "https://arxiv.org/abs/2608.10669", "authors": ["Zixing Chen", "Xingyuan Liu", "Jie Zhu", "Huaixia Dou", "Shuo Jiang", "Junhui Li", "Lifan Guo", "Feng Chen", "Chi Zhang"], "brief": "REDAgentBench \u63d0\u51fa\u4e00\u4e2a\u53ef\u6267\u884c\u7684 LLM \u667a\u80fd\u4f53\u7ea2\u961f\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ece\u663e\u5f0f\u5b89\u5168\u7ea6\u675f\u548c\u7cfb\u7edf\u6f0f\u6d1e\u751f\u6210\u653b\u51fb\uff0c\u5728\u9694\u79bb\u6c99\u7bb1\u4e2d\u8fd0\u884c\uff0c\u5e76\u901a\u8fc7\u670d\u52a1\u56de\u6267\u4e0e\u6700\u7ec8\u72b6\u6001\u9a8c\u8bc1\u771f\u5b9e\u5371\u5bb3\u3002\u5b9e\u9a8c\u8986\u76d6 1661 \u4e2a\u6848\u4f8b\u30016 \u4e2a\u6a21\u578b\u548c 3 \u79cd\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53d1\u73b0\u5e73\u5747\u653b\u51fb\u6210\u529f\u7387\u8fbe 65.69%\uff0c\u4e14\u8bc4\u6d4b\u89c6\u89d2\u4f1a\u663e\u8457\u5f71\u54cd\u7ed3\u679c\uff1b\u7b80\u5355\u7684\u514d\u8bad\u7ec3\u7b56\u7565\u63d0\u9192\u53ef\u5c06\u786e\u8ba4\u8fdd\u89c4\u51cf\u5c11 70 \u4e2a\u767e\u5206\u70b9\u4ee5\u4e0a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10669", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u5b89\u5168", "\u7ea2\u961f\u8bc4\u6d4b", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10669v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "REDAgentBench: Executable Red Teaming and Faithful Measurement of LLM Agent Systems", "tldr": "REDAgentBench \u63d0\u51fa\u4e00\u4e2a\u53ef\u6267\u884c\u7684 LLM \u667a\u80fd\u4f53\u7ea2\u961f\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ece\u663e\u5f0f\u5b89\u5168\u7ea6\u675f\u548c\u7cfb\u7edf\u6f0f\u6d1e\u751f\u6210\u653b\u51fb\uff0c\u5728\u9694\u79bb\u6c99\u7bb1\u4e2d\u8fd0\u884c\uff0c\u5e76\u901a\u8fc7\u670d\u52a1\u56de\u6267\u4e0e\u6700\u7ec8\u72b6\u6001\u9a8c\u8bc1\u771f\u5b9e\u5371\u5bb3\u3002\u5b9e\u9a8c\u8986\u76d6 1661 \u4e2a\u6848\u4f8b\u30016 \u4e2a\u6a21\u578b\u548c 3 \u79cd\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53d1\u73b0\u5e73\u5747\u653b\u51fb\u6210\u529f\u7387\u8fbe 65.69%\uff0c\u4e14\u8bc4\u6d4b\u89c6\u89d2\u4f1a\u663e\u8457\u5f71\u54cd\u7ed3\u679c\uff1b\u7b80\u5355\u7684\u514d\u8bad\u7ec3\u7b56\u7565\u63d0\u9192\u53ef\u5c06\u786e\u8ba4\u8fdd\u89c4\u51cf\u5c11 70 \u4e2a\u767e\u5206\u70b9\u4ee5\u4e0a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Medical Vision-Language Models (Med-VLMs) excel at verbalizing visual content, yet precise visual perception, segmentation, and grounding remain challenging. Existing approaches either verbalize regions as coordinate strings or rely on external modules that decouple perception from understanding, creating representation gaps for region-language alignment. We present MedUP, a Med-VLM that natively unifies perception and understanding within a shared token space. At its core lies UniMedTok, a region tokenizer that encodes masks as discrete tokens in the LLM vocabulary, enabling the model to seamlessly interleave mask tokens with text. We curate UniMed-Train, a 1.84M-instance corpus spanning text-guided segmentation, region-grounded understanding, medical VQA and CoT-based segmentation, and introduce UniMed-Bench for unified evaluation. Extensive experiments show that MedUP outperforms native, agentic, and dual-decoder Med-VLMs across all tasks while remaining competitive with specialist segmentors, demonstrating the strong potential of unified understanding and perception modeling.", "arxiv_id": "2608.10635", "arxiv_url": "https://arxiv.org/abs/2608.10635", "authors": ["Yuan Wang", "Hualiang Wang", "Yixin Chen", "Songtao Jiang", "Shujian Gao", "Jiaming Lin", "Siming Fu", "Jian Wu", "Zuozhu Liu"], "brief": "MedUP \u63d0\u51fa\u4e00\u79cd\u533b\u7597\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u901a\u8fc7 UniMedTok \u5c06\u5206\u5272\u63a9\u7801\u7f16\u7801\u4e3a\u5927\u8bed\u8a00\u6a21\u578b\u8bcd\u8868\u4e2d\u7684\u79bb\u6563 token\uff0c\u4f7f\u6587\u672c\u7406\u89e3\u3001\u533a\u57df\u5b9a\u4f4d\u4e0e\u5206\u5272\u5728\u540c\u4e00 token \u7a7a\u95f4\u5185\u7edf\u4e00\u5efa\u6a21\u3002\u4f5c\u8005\u6784\u5efa\u4e86 184 \u4e07\u6837\u672c\u7684 UniMed-Train \u548c\u7edf\u4e00\u8bc4\u6d4b\u57fa\u51c6 UniMed-Bench\uff0c\u5b9e\u9a8c\u663e\u793a MedUP \u5728\u533b\u7597 VQA\u3001\u533a\u57df\u7406\u89e3\u3001\u6587\u672c\u5f15\u5bfc\u5206\u5272\u7b49\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u539f\u751f\u3001\u667a\u80fd\u4f53\u5f0f\u548c\u53cc\u89e3\u7801\u5668 Med-VLM\uff0c\u5e76\u63a5\u8fd1\u4e13\u7528\u5206\u5272\u6a21\u578b\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10635", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u591a\u6a21\u6001", "\u56fe\u50cf\u5206\u5272", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10635v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MedUP: Awakening Unified Understanding and Perception in Medical Vision-Language Models", "tldr": "MedUP \u63d0\u51fa\u4e00\u79cd\u533b\u7597\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u901a\u8fc7 UniMedTok \u5c06\u5206\u5272\u63a9\u7801\u7f16\u7801\u4e3a\u5927\u8bed\u8a00\u6a21\u578b\u8bcd\u8868\u4e2d\u7684\u79bb\u6563 token\uff0c\u4f7f\u6587\u672c\u7406\u89e3\u3001\u533a\u57df\u5b9a\u4f4d\u4e0e\u5206\u5272\u5728\u540c\u4e00 token \u7a7a\u95f4\u5185\u7edf\u4e00\u5efa\u6a21\u3002\u4f5c\u8005\u6784\u5efa\u4e86 184 \u4e07\u6837\u672c\u7684 UniMed-Train \u548c\u7edf\u4e00\u8bc4\u6d4b\u57fa\u51c6 UniMed-Bench\uff0c\u5b9e\u9a8c\u663e\u793a MedUP \u5728\u533b\u7597 VQA\u3001\u533a\u57df\u7406\u89e3\u3001\u6587\u672c\u5f15\u5bfc\u5206\u5272\u7b49\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u539f\u751f\u3001\u667a\u80fd\u4f53\u5f0f\u548c\u53cc\u89e3\u7801\u5668 Med-VLM\uff0c\u5e76\u63a5\u8fd1\u4e13\u7528\u5206\u5272\u6a21\u578b\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Two instruments of EU digital law place inference at their centre and mean different things by it. Article 3(1) of the AI Act uses the capability to infer constitutively: it is the central feature separating the regulated category from conventional software. The GDPR never defines inference, yet governs it protectively: the consequences follow from the processing of personal data and from what the inference says about, or does to, a person, whether or not the technology that produced it qualifies as an AI system. The two perimeters are not concentric. Their non-coincidence remained invisible in single-shot systems; agentic architectures make it operationally acute. The thesis: inferential capability does not determine legal scope, and its absence does not create immunity. The framework is two-level. Inference performs two legal functions, constitutive and protective; the protective function operates through three pathways - identificatory, attributive and decisional. Composition is not a fourth pathway but a cross-cutting architectural dimension which, with reach, persistence and reviewability, is what agentic architectures modify. Three concepts support it: the inferential threshold, the inferential reach and the inferential chain, mapped onto the chain of imputation. Regulation (EU) 2026/1744 left the constitutive criterion untouched and inserted a provision contemplating outputs that influence the inputs of future operations, without supplying any rule of aggregation. The article proposes an interpretive rule, a compositional-effects test identifying the decision unit under Article 22 GDPR together with the allocation of the burden of establishing it, and documentation duties calibrated to inference chains.", "arxiv_id": "2608.10601", "arxiv_url": "https://arxiv.org/abs/2608.10601", "authors": ["Nicola Fabiano"], "brief": "\u8bba\u6587\u6bd4\u8f83\u6b27\u76df\u300aAI\u6cd5\u6848\u300b\u548cGDPR\u4e2d\u201c\u63a8\u65ad\u201d\u6982\u5ff5\u7684\u4e0d\u540c\u6cd5\u5f8b\u529f\u80fd\uff0c\u6307\u51fa\u5177\u5907\u63a8\u65ad\u80fd\u529b\u5e76\u4e0d\u81ea\u52a8\u51b3\u5b9a\u76d1\u7ba1\u8303\u56f4\uff0c\u7f3a\u4e4f\u63a8\u65ad\u80fd\u529b\u4e5f\u4e0d\u610f\u5473\u7740\u514d\u8d23\u3002\u4f5c\u8005\u63d0\u51fa\u4e24\u5c42\u6846\u67b6\u3001\u63a8\u65ad\u94fe\u4e0e\u7ec4\u5408\u6548\u5e94\u6d4b\u8bd5\uff0c\u7528\u4e8e\u5904\u7406\u667a\u80fd\u4f53\u67b6\u6784\u4e2d\u8f93\u51fa\u5f71\u54cd\u540e\u7eed\u8f93\u5165\u6240\u5e26\u6765\u7684\u8d23\u4efb\u5f52\u5c5e\u548c\u6587\u6863\u4e49\u52a1\u95ee\u9898\u3002", "categories": ["cs.CY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10601", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4eba\u5de5\u667a\u80fd\u6cbb\u7406", "\u667a\u80fd\u4f53", "\u6570\u636e\u4fdd\u62a4", "\u6b27\u76df\u6cd5\u89c4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10601v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Inferential Capability Does Not Determine Legal Scope", "tldr": "\u8bba\u6587\u6bd4\u8f83\u6b27\u76df\u300aAI\u6cd5\u6848\u300b\u548cGDPR\u4e2d\u201c\u63a8\u65ad\u201d\u6982\u5ff5\u7684\u4e0d\u540c\u6cd5\u5f8b\u529f\u80fd\uff0c\u6307\u51fa\u5177\u5907\u63a8\u65ad\u80fd\u529b\u5e76\u4e0d\u81ea\u52a8\u51b3\u5b9a\u76d1\u7ba1\u8303\u56f4\uff0c\u7f3a\u4e4f\u63a8\u65ad\u80fd\u529b\u4e5f\u4e0d\u610f\u5473\u7740\u514d\u8d23\u3002\u4f5c\u8005\u63d0\u51fa\u4e24\u5c42\u6846\u67b6\u3001\u63a8\u65ad\u94fe\u4e0e\u7ec4\u5408\u6548\u5e94\u6d4b\u8bd5\uff0c\u7528\u4e8e\u5904\u7406\u667a\u80fd\u4f53\u67b6\u6784\u4e2d\u8f93\u51fa\u5f71\u54cd\u540e\u7eed\u8f93\u5165\u6240\u5e26\u6765\u7684\u8d23\u4efb\u5f52\u5c5e\u548c\u6587\u6863\u4e49\u52a1\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Although existing instruction data selection methods have introduced various metrics, the inherent complexity of real-world datasets makes it impractical for any single metric to generalize across all scenarios. Developers are thus often forced to manually inspect data and craft heuristic rules for each new application---a tedious and error-prone process. In this paper, we propose a paradigm shift from manual configuration to automated orchestration via the Instruction Data Selection Agent (DataMaster), which interprets user intent and autonomously composes optimal selection strategies. By allowing users to specify data needs through natural language descriptions, DataMaster simplifies data curation and removes the burden of manual strategy design. Extensive experiments across the math, medical, and code domains show that DataMaster outperforms static baselines in most settings and surpasses full-pool training in a substantial number of cases. The implementation of DataMaster and the scripts needed to reproduce the reported pipeline are publicly available at https://github.com/nju-websoft/DataMaster.", "arxiv_id": "2608.10579", "arxiv_url": "https://arxiv.org/abs/2608.10579", "authors": ["Fanqi Zhou", "Qiaosheng Chen", "Zixian Huang", "Gong Cheng"], "brief": "\u672c\u6587\u63d0\u51fa\u6307\u4ee4\u6570\u636e\u9009\u62e9\u667a\u80fd\u4f53 DataMaster\uff0c\u8ba9\u7528\u6237\u7528\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u6570\u636e\u9700\u6c42\uff0c\u5e76\u7531\u7cfb\u7edf\u81ea\u52a8\u7406\u89e3\u610f\u56fe\u3001\u7ec4\u5408\u5408\u9002\u7684\u6570\u636e\u7b5b\u9009\u7b56\u7565\u3002\u5176\u5728\u6570\u5b66\u3001\u533b\u7597\u548c\u4ee3\u7801\u7b49\u9886\u57df\u5b9e\u9a8c\u4e2d\u591a\u6570\u60c5\u51b5\u4e0b\u4f18\u4e8e\u9759\u6001\u57fa\u7ebf\uff0c\u5e76\u5728\u4e0d\u5c11\u573a\u666f\u8d85\u8fc7\u4f7f\u7528\u5168\u91cf\u6570\u636e\u8bad\u7ec3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10579", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u9009\u62e9", "\u6307\u4ee4\u5fae\u8c03", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10579v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Instruction Data Selection: Let DataMaster Interpret Your Intent", "tldr": "\u672c\u6587\u63d0\u51fa\u6307\u4ee4\u6570\u636e\u9009\u62e9\u667a\u80fd\u4f53 DataMaster\uff0c\u8ba9\u7528\u6237\u7528\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u6570\u636e\u9700\u6c42\uff0c\u5e76\u7531\u7cfb\u7edf\u81ea\u52a8\u7406\u89e3\u610f\u56fe\u3001\u7ec4\u5408\u5408\u9002\u7684\u6570\u636e\u7b5b\u9009\u7b56\u7565\u3002\u5176\u5728\u6570\u5b66\u3001\u533b\u7597\u548c\u4ee3\u7801\u7b49\u9886\u57df\u5b9e\u9a8c\u4e2d\u591a\u6570\u60c5\u51b5\u4e0b\u4f18\u4e8e\u9759\u6001\u57fa\u7ebf\uff0c\u5e76\u5728\u4e0d\u5c11\u573a\u666f\u8d85\u8fc7\u4f7f\u7528\u5168\u91cf\u6570\u636e\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Persistent memory lets language-model agents reuse information across sessions, but it also makes errors durable: a poisoned, stale, or misattributed record can alter reasoning, tool use, answers, and subsequent memory writes. Existing defenses mainly detect or delete suspicious memories, or revise the current response. Deleting the source leaves already propagated claims, actions, and derived memories active, whereas resetting the store or replaying the full trace destroys benign state and repeats unnecessary computation. We therefore formulate \\textbf{post-failure memory recovery: } \\textit{given a failed execution and diagnosed faulty memories, recover both the answer and persistent state while retaining unaffected work.} Our \\textbf{dependency-guided rollback repair} builds a typed memory-to-action graph from runtime provenance, traces explicit downstream dependencies, preserves candidates with independent trusted support, deactivates unsupported memory state, and selectively replays only answer-relevant affected computation. We evaluate this approach on a 150-case controlled benchmark spanning three tool-use domains and four memory failure types, and on a 50-case trajectory-derived stress test adapted from LongMemEval-V2. On the controlled benchmark, it achieves 85.3\\% recovery versus 77.3\\% for the best competing recovery method, removes all diagnosed faulty memories, preserves all benign memories, and requires only selective replay with modest LLM-call cost. On the adapted subset, it reaches 68.0\\% recovery versus 54.0\\% for the next best method, while also achieving the highest claim invalidation F1, 0.669 versus 0.603. Overall, the results do not imply uniformly better trace reconstruction, but show that dependency-guided rollback repair provides a strong recovery--cost trade-off while repairing faulty memory state and preserving benign memory.", "arxiv_id": "2608.10502", "arxiv_url": "https://arxiv.org/abs/2608.10502", "authors": ["Caili Yu", "Yiqi Wang", "Jiaqi Zhang", "Yiqun Duan", "Mingkai Zheng", "Zhangkai Wu", "Kaize Shi", "Taotao Cai"], "brief": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u5e26\u6301\u4e45\u8bb0\u5fc6\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u6545\u969c\u540e\u6062\u590d\u4efb\u52a1\uff0c\u5e76\u8bbe\u8ba1\u4f9d\u8d56\u5f15\u5bfc\u7684\u56de\u6eda\u4fee\u590d\u65b9\u6cd5\uff1a\u6839\u636e\u8fd0\u884c\u65f6\u6eaf\u6e90\u6784\u5efa\u8bb0\u5fc6\u5230\u52a8\u4f5c\u7684\u4f9d\u8d56\u56fe\uff0c\u9009\u62e9\u6027\u5931\u6d3b\u53d7\u6c61\u67d3\u8bb0\u5fc6\u5e76\u91cd\u653e\u53d7\u5f71\u54cd\u8ba1\u7b97\u3002\u5728\u53d7\u63a7\u57fa\u51c6\u548c LongMemEval-V2 \u6539\u7f16\u538b\u529b\u6d4b\u8bd5\u4e2d\uff0c\u8be5\u65b9\u6cd5\u76f8\u8f83\u73b0\u6709\u6062\u590d\u65b9\u6cd5\u53d6\u5f97\u66f4\u9ad8\u6062\u590d\u7387\uff0c\u540c\u65f6\u4fdd\u7559\u826f\u6027\u8bb0\u5fc6\u5e76\u964d\u4f4e\u4e0d\u5fc5\u8981\u91cd\u7b97\u6210\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10502", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u6545\u969c\u6062\u590d", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10502v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From Faulty Memories to Corrected Actions: Dependency-Guided Rollback Repair for Memory-Augmented Agents", "tldr": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u5e26\u6301\u4e45\u8bb0\u5fc6\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u6545\u969c\u540e\u6062\u590d\u4efb\u52a1\uff0c\u5e76\u8bbe\u8ba1\u4f9d\u8d56\u5f15\u5bfc\u76
