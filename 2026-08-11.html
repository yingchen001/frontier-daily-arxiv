-end sandbox for verifiable cross-user agent collaboration with realistic user digital workspaces or test how harmful actions can travel through the human-centered agent network. We introduce WeClawArena, an auditable benchmark and runtime sandbox for multi-party owned-agent collaboration over personal workspaces. WeClawArena targets collaborative tool-use tasks in which personal workspaces serve as both operational tools and personal constraints. The benchmark contains 124 base tasks across six cross-user task domains and expands them into 620 scenario variants, with one benign control and four attack-vector variants per base task. The sandbox records peer messages, tool calls, resource operations, governed decisions, and final workspace states. WeClawArena reports utility and attack success rate separately and audits attack success from bounded runtime evidence, supporting diagnosis of task breakdown, privacy leakage, poisoned evidence, and invalid authority paths.", "arxiv_id": "2608.03499", "arxiv_url": "https://arxiv.org/abs/2608.03499", "authors": ["Prince Zizhuang Wang", "Aojie Yuan", "Haiyue Zhang", "Xiyang Hu", "Yue Zhao", "Shuli Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa WeClawArena\uff0c\u4e00\u4e2a\u53ef\u5ba1\u8ba1\u7684\u8fd0\u884c\u65f6\u6c99\u7bb1\u4e0e\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u6d4b\u591a\u7528\u6237\u4e2a\u4eba\u667a\u80fd\u4f53\u5728\u79c1\u6709\u5de5\u4f5c\u533a\u4e2d\u7684\u534f\u4f5c\u80fd\u529b\u4e0e\u5b89\u5168\u98ce\u9669\u3002\u5b83\u8986\u76d6\u8de8\u7528\u6237\u4efb\u52a1\u3001\u6743\u9650\u7ea6\u675f\u3001\u9690\u79c1\u6cc4\u9732\u4e0e\u653b\u51fb\u4f20\u64ad\u7b49\u573a\u666f\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/kingofspace0wzz/WeClawArena", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.03499", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b124\u4e2a\u57fa\u7840\u4efb\u52a1\uff0c\u8986\u76d66\u7c7b\u8de8\u7528\u6237\u534f\u4f5c\u9886\u57df\uf 5355\u534f\u4f5c\uff0cWeClawArena\u5c06\u771f\u5b9e\u4e2a\u4eba\u5de5\u4f5c\u533a\u3001\u8de8\u7528\u6237\u6743\u9650\u4e0e\u653b\u51fb\u5ba1\u8ba1\u7ed3\u5408\u8d77\u6765\uff0c\u4e3a\u4eba\u672c\u667a\u80fd\u4f53\u7f51\u7edc\u7684\u5b89\u5168\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u63a5\u8fd1\u90e8\u7f72\u73af\u5883\u7684\u6d4b\u8bd5\u5e73\u53f0\u3002"}, {"abstract": "As AI coding agents take on increasingly complex, long-horizon software engineering tasks, existing benchmarks are rapidly saturating and their evaluation quality has come under serious scrutiny: a recent audit found that nearly 60% of unsolved SWE-bench Verified instances contain flawed tests -- either overly narrow tests that reject correct solutions or overly broad tests that check unstated requirements -- and that frontier models can verbatim reproduce gold patches from training data. Code refactoring, which requires coordinated, behavior-preserving changes across many files, offers a substantially harder and more realistic test of agent capability, yet remains underserved by current benchmarks. We introduce SWE-Bench ProMax, an expert-curated, multilingual code refactoring benchmark of 170 instances drawn from real commits across seven programming languages (Python, Java, TypeScript, Go, C, C++, and Rust). Every instance undergoes rigorous, multi-stage curation that directly addresses the quality problems identified in prior benchmarks: issue descriptions are rewritten from scratch to provide precise, unambiguous specifications, and test suites are manually reviewed to remove overly narrow and overly broad tests. Tasks with insufficient complexity or limited cross-file scope are filtered out, yielding a benchmark of challenging, large-scale refactoring tasks that average 11.4 modified files and 261.6 lines of code per instance, substantially exceeding the scale of existing benchmarks. Experiments with frontier models under two agent scaffolds show that the best model achieves only 41.2% resolve rate, confirming that SWE-Bench ProMax presents a meaningful and unsaturated challenge for current AI coding agents. Our benchmark is available at https://huggingface.co/datasets/swe-bench-promax/SWE-Bench-ProMax.", "arxiv_id": "2608.09802", "arxiv_url": "https://arxiv.org/abs/2608.09802", "authors": ["Yuling Shi", "Jinghan Xu", "Kelin Fu", "Wenhao Zeng", "Shilin He", "Lei Zhang", "Yue Liu", "Zelin Zhao", "Terry Yue Zhuo", "Jialun Cao", "Siyu Ye", "Tianyu Liu", "Kai Cai", "Shing-Chi Cheung", "Xiaodong Gu"], "brief": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa SWE-Bench ProMax\uff0c\u4e00\u4e2a\u4e13\u5bb6\u7b56\u5212\u7684\u591a\u8bed\u8a00\u4ee3\u7801\u91cd\u6784\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea\u771f\u5b9e\u63d0\u4ea4\u7684170\u4e2a\u8de8\u6587\u4ef6\u91cd\u6784\u4efb\u52a1\u3002\u5b83\u91cd\u70b9\u8bc4\u4f30AI\u7f16\u7801\u667a\u80fd\u4f53\u5728\u957f\u7a0b\u3001\u884c\u4e3a\u4fdd\u6301\u3001\u591a\u6587\u4ef6\u534f\u540c\u4fee\u6539\u4e2d\u7684\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09802", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6 Python\u3001Java\u3001TypeScript\u3001Go\u3001C\u3001C++\u3001Rust \u4e03\u79cd\u8bed\u8a00\uff0c\u4efb\u52a1\u5e73\u5747\u4fee\u653911.4\u4e2a\u6587\u4ef6\u3001261.6\u884c\u4ee3\u7801\uff0c\u89c4\u6a21\u663e\u8457\u9ad8\u4e8e\u73b0\u6709\u57fa\u51c6\u3002", "\u901a\u8fc7\u591a\u9636\u6bb5\u4eba\u5de5\u7b5b\u9009\u4e0e\u91cd\u5199\u95ee\u9898\u63cf\u8ff0\uff0c\u4fee\u590d\u65e2\u6709 SWE-bench \u4e2d\u6d4b\u8bd5\u8fc7\u7a84\u3001\u8fc7\u5bbd\u548c\u6f5c\u5728\u8bad\u7ec3\u6570\u636e\u6cc4\u6f0f\u7b49\u8bc4\u6d4b\u8d28\u91cf\u95ee\u9898\u3002", "\u524d\u6cbf\u6a21\u578b\u5728\u4e24\u79cd\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\u6700\u9ad8\u4ec5\u8fbe\u523041.2%\u89e3\u51b3\u7387\uff0c\u8bf4\u660e\u8be5\u57fa\u51c6\u4ecd\u672a\u9971\u548c\u4e14\u5177\u6709\u8f83\u9ad8\u6311\u6218  must reflect user preferences, offer diverse directions, and remain executable on the current image. We collected 100,000 real multi-turn image-creation conversation samples from Qwen App and found that 80.1% are image-dependent, underscoring the need for multimodal recommendation. We address this setting with a three-stage framework. In Stage 1, we use real online data to build a human-reviewed table of appropriate follow-up editing intents, then create SFT targets and fine-tune a multimodal policy. In Stage 2, to align rule-guided SFT suggestions with actual user choices, we use user click feedback to optimize the policy through multi-objective reinforcement learning. In Stage 3, to reduce visual inconsistencies between suggested edits and the current image, we introduce a visual verifier as additional training supervision. Extensive experiments demonstrate that our framework significantly outperforms baselines on both automatic and human evaluations. In a live user-randomized A/B test with millions of users, our final framework reduces visual inconsistency from 3.7% to 0.9%. Furthermore, it significantly improves recommendation CTR by 32.70%, image take-away rate by 16.32%, and average conversation turns per user by 39.90% (all p\u003c0.05).", "arxiv_id": "2608.07565", "arxiv_url": "https://arxiv.org/abs/2608.07565", "authors": ["Zhijing Zhang", "Jinpeng Yu", "Xin Song", "Bingnan Li", "Chuyue Li", "Changhui Du", "Xiaolin Fang", "Jiaming Liu", "Ruihua Huang"], "brief": "\u8bba\u6587\u9762\u5411\u56fe\u50cf\u521b\u4f5c\u5bf9\u8bdd\u4e2d\u7684\u201c\u4e0b\u4e00\u6b65\u7f16\u8f91\u5efa\u8bae\u201d\u95ee\u9898\uff0c\u63d0\u51fa\u4e09\u9636\u6bb5\u6846\u67b6\uff1a\u57fa\u4e8e\u771f\u5b9e\u6570\u636e\u505aSFT\u3001\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u5bf9\u9f50\u7528\u6237\u70b9\u51fb\u504f\u597d\uff0c\u5e76\u52a0\u5165\u89c6\u89c9\u9a8c\u8bc1\u5668\u51cf\u5c11\u4e0e\u5f53\u524d\u56fe\u50cf\u4e0d\u4e00\u81f4\u7684\u5efa\u8bae\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07565", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ece Qwen App \u6536\u96c6 10 \u4e07\u6761\u771f\u5b9e\u591a\u8f6e\u56fe\u50cf\u521b\u4f5c\u5bf9\u8bdd\uff0c\u53d1\u73b0 80.1% \u7684\u540e\u7eed\u7f16\u8f91\u9700\u6c42\u4f9d\u8d56\u5f53\u524d\u56fe\u50cf\uff0c\u8bc1\u660e\u591a\u6a21\u6001\u63a8\u8350\u7684\u5fc5\u8981\u6027\u3002", "\u5148\u6784\u5efa\u4eba\u5de5\u5ba1\u6838\u7684\u7f16\u8f91\u610f\u56fe\u8868\u5e76\u5fae\u8c03\u591a\u6a21\u6001\u7b56\u7565\uff0c\u518d\u7528\u7528\u6237\u70b9\u51fb\u53cd\u9988\u8fdb\u884c\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u3002", "\u5f15\u5165\u89c6\u89c9\u9a8c\u8bc1\u5668\u4f5c\u4e3a\u989d\u5916\u76d1\u7763\uff0c\u7ebf\u4e0a A/B \u6d4b\u8bd5\u5c06\u89c6\u89c9\u4e0d\u4e00\u81f4\u7387\u4ece 3.7% \u964d\u81f3 0.9%\uff0cCTR \u63d0\u5347 32.70%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u7f16\u8f91", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u8350\u7cfb\u7edf"], "num_comments": 2, "on_hf": true, "organization": "Qwen Business Unit", "pdf_url": "https://arxiv.org/pdf/2608.07565v1", "published_at": "2026-08-03", "score": 0.529, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07565.png", "title": "What to Edit Next: Visually Aligned Image-Editing Follow-Up Suggestions in Conversational Systems", "tldr": "\u7528\u591a\u6a21\u6001\u7b56\u7565\u63a8\u8350\u4e0b\u4e00\u6b65\u56fe\u50cf\u7f16\u8f91", "upvotes": 25, "what_it_is": "\u8bba\u6587\u9762\u5411\u56fe\u50cf\u521b\u4f5c\u5bf9\u8bdd\u4e2d\u7684\u201c\u4e0b\u4e00\u6b65\u7f16\u8f91\u5efa\u8bae\u201d\u95ee\u9898\uff0c\u63d0\u51fa\u4e09\u9636\u6bb5\u6846\u67b6\uff1a\u57fa\u4e8e\u771f\u5b9e\u6570\u636e\u505aSFT\u3001\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u5bf9\u9f50\u7528\u6237\u70b9\u51fb\u504f\u597d\uff0c\u5e76\u52a0\u5165\u89c6\u89c9\u9a8c\u8bc1\u5668\u51cf\u5c11\u4e0e\u5f53\u524d\u56fe\u50cf\u4e0d\u4e00\u81f4\u7684\u5efa\u8bae\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6587\u672c\u5bf9\u8bdd\u4e2d\u7684 follow-up suggestion \u6269\u5c55\u5230\u56fe\u50cf\u7f16\u8f91\u573a\u666f\uff0c\u5e76\u5728\u771f\u5b9e\u5927\u89c4\u6a21\u7ebf\u4e0a\u7cfb\u7edf\u4e2d\u9a8c\u8bc1\u4e86\u663e\u8457\u6536\u76ca\uff0c\u5bf9\u591a\u6a21\u6001\u521b\u4f5c\u52a9\u624b\u548c\u5546\u4e1a\u5316\u63a8\u8350\u7cfb\u7edf\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "General-purpose reward models are increasingly the bottleneck for scaling robot learning, yet the recipe for learning value-related capabilities from large-scale heterogeneous corpora remains underexplored. Existing approaches tie supervision to task-internal anchors such as preferences or normalized progress, none of which transfer cleanly across embodiments and data sources. We introduce RynnValue, an open-source value foundation model for robotic manipulation that replaces these anchors with temporal distance, the directed cost-to-go from an observation to the language-specified goal. Because temporal-distance labels can be derived directly from timestamps, RynnValue scales to over 7,000 hours and roughly 3M instruction-conditioned clips without preference or progress annotations. To make temporal-value learning reliable at scale, we combine random temporal sampling, temporal-order shuffling, and value-isolation attention, suppressing shortcuts that would leave predictions insensitive to failures and regressions. Trained without preference labels, RynnValue attains an average Kendall\u0027s tau_a of 0.675 on RBM-EVAL-OOD, surpassing the fully preference-supervised state of the art (0.655) and more than doubling a progress-only counterpart (0.292), while generalizing zero-shot to unseen tasks, embodiments, and viewpoints. Converted into dense rewards via potential-based shaping, it raises real-world policy success from 52.5% to 72.5% online and from 63.8% to 82.5% offline. These results establish temporal distance as a scalable supervision target and practical reward interface for generalist robot policies.", "arxiv_id": "2608.09853", "arxiv_url": "https://arxiv.org/abs/2608.09853", "authors": ["Dongchi Huang", "Hongyin Zhang", "Bohan Hou", "Siteng Huang", "Zhian Su", "Hang Guo", "Tong Lu", "Zhaofeng Xu", "Jiahao Tang", "Jianfei Yang", "Donglin Wang", "Peixi Peng", "Mingxiu Chen", "Deli Zhao", "Xin Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u5f00\u6e90\u673a\u5668\u4eba\u64cd\u4f5c\u4ef7\u503c\u57fa\u7840\u6a21\u578b RynnValue\uff0c\u4ee5\u89c2\u6d4b\u5230\u8bed\u8a00\u76ee\u6807\u7684\u6709\u5411\u65f6\u95f4\u8ddd\u79bb\uff08cost-to-go\uff09\u4f5c\u4e3a\u76d1\u7763\u4fe1\u53f7\uff0c\u66ff\u4ee3\u504f\u597d\u6216\u8fdb\u5ea6\u6807\u6ce8\u3002\u6a21\u578b\u5229\u7528\u65f6\u95f4\u6233\u4ece\u5927\u89c4\u6a21\u5f02\u6784\u6570\u636e\u4e2d\u81ea\u52a8\u6784\u9020\u6807\u7b7e\uff0c\u8bad\u7ec3\u4e8e7000\u591a\u5c0f\u65f6\u3001\u7ea6300\u4e07\u6761\u6307\u4ee4\u6761\u4ef6\u7247\u6bb5\u3002", "categories": ["cs.RO", "cs.CV", "cs.LG"], "github_repo": "https://github.com/alibaba-damo-academy/RynnValue", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2608.09853", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u65f6\u95f4\u8ddd\u79bb\u4f5c\u4e3a\u53ef\u6269\u5c55\u4ef7\u503c\u76d1\u7763\u76ee\u6807\uff0c\u65e0\u9700\u504f\u597d\u6807\u6ce8\u6216\u5f52\u4e00\u5316\u8fdb\u5ea6\u6807\u6ce8\uff0c\u66f4\u6613\u8de8\u4efb\u52a1\u3001\u5177\u8eab\u5f62\u6001\u548c\u6570\u636e\u6e90\u8fc1\u79fb\u3002", "\u7ed3\u5408\u968f\u673a\u65f6\u95f4\u91c7\u6837\u3001\u65f6\u95f4\u987a\u5e8f\u6253\u4e71\u548c value-isolation attention\uff0c\u51cf\u5c11\u6a21\u578b\u4f9d\u8d56\u65f6\u95f4\u987a\u5e8f\u6377\u5f84\uff0c\u63d0\u5347\u5bf9\u5931\u8d25\u548c\u56de\u9000\u72b6\u6001\u7684\u654f\u611f\u6027\u3002", "\u5728 RBM-EVAL-OOD \u4e0a Kendall\u0027s tau_a \u8fbe0.675\uff0c\u8d85\u8fc7\u504f\u597d\u76d1\u7763SOTA\uff1b\u8f6c\u4e3a\u7a20\u5bc6\u5956\u52b1\u540e\u663e\u8457\u63d0\u5347\u771f\u5b9e\u673a\u5668\u4eba\u5728\u7ebf\u4e0e\u79bb\u7ebf\u7b56\u7565\u6210\u529f\u7387\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u5956\u52b1\u6a21\u578b", "\u4ef7\u503c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "DAMO Academy", "pdf_url": "https://arxiv.org/pdf/2608.09853v1", "published_at": "2026-08-10", "score": 0.526, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09853.png", "title": "RynnValue: Scaling Robotic Value Foundation Models with Temporal Distance", "tldr": "\u7528\u65f6\u95f4\u8ddd\u79bb\u6269\u5c55\u673a\u5668\u4eba\u4ef7\u503c\u57fa\u7840\u6a21\u578b", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5f00\u6e90\u673a\u5668\u4eba\u64cd\u4f5c\u4ef7\u503c\u57fa\u7840\u6a21\u578b RynnValue\uff0c\u4ee5\u89c2\u6d4b\u5230\u8bed\u8a00\u76ee\u6807\u7684\u6709\u5411\u65f6\u95f4\u8ddd\u79bb\uff08cost-to-go\uff09\u4f5c\u4e3a\u76d1\u7763\u4fe1\u53f7\uff0c\u66ff\u4ee3\u504f\u597d\u6216\u8fdb\u5ea6\u6807\u6ce8\u3002\u6a21\u578b\u5229\u7528\u65f6\u95f4\u6233\u4ece\u5927\u89c4\u6a21\u5f02\u6784\u6570\u636e\u4e2d\u81ea\u52a8\u6784\u9020\u6807\u7b7e\uff0c\u8bad\u7ec3\u4e8e7000\u591a\u5c0f\u65f6\u3001\u7ea6300\u4e07\u6761\u6307\u4ee4\u6761\u4ef6\u7247\u6bb5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7ed9\u51fa\u4e86\u5927\u89c4\u6a21\u673a\u5668\u4eba\u5956\u52b1/\u4ef7\u503c\u6a21\u578b\u7684\u65b0\u8bad\u7ec3\u8303\u5f0f\uff1a\u7528\u53ef\u4ece\u65f6\u95f4\u6233\u81ea\u52a8\u83b7\u5f97\u7684\u65f6\u95f4\u8ddd\u79bb\u66ff\u4ee3\u6602\u8d35\u504f\u597d\u6807\u6ce8\uff0c\u5e76\u5728\u96f6\u6837\u672c\u6cdb\u5316\u548c\u771f\u5b9e\u673a\u5668\u4eba\u7b56\u7565\u63d0\u5347\u4e0a\u9a8c\u8bc1\u4e86\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM) inference serving is increasingly constrained by memory rather than compute. As long-context and long-form reasoning workloads become more prevalent, the key-value (KV) cache dominates both memory footprint and memory traffic during LLM token generation, i.e., decode. In particular, HBM capacity has become a scarce and costly resource that heavily limits inference batch size and system throughput. This paper presents OasisKV, a memory-centric LLM inference system design that alleviates HBM capacity pressure by decoupling full KV-cache storage from HBM during LLM decoding. Because decode-time attention is naturally sparse, OasisKV keeps only the KV entries of the most relevant tokens in HBMs for attention computation. We observe that future important tokens can be predicted accurately in advance using lookahead tokens drafted by speculative decoding (SD). OasisKV employs an efficient attention background pipeline to identify important KV blocks. They are then prefetched from higher-capacity memory tiers (e.g., host or remote memory) and staged in HBMs before being used in the next decode step. We implement OasisKV based on vLLM. The lookahead prediction is accurate enough to keep accuracy within 0.7 points of full attention under a 2,048-token KV budget. This lets OasisKV turn sparsity into throughput gain: $1.69\\times$ over dense vLLM on the reasoning workload at 0.1 points of accuracy loss, and up to $2.1\\times$ on multi-GPU long-context serving. Under prefill--decode disaggregation, OasisKV reaches about $2\\times$ dense throughput while admitting each request with $6.5$--$9.7\\times$ less KV and holding $2.2$-$2.6$ less decode-node host memory than full KV transfer.", "arxiv_id": "2608.08097", "arxiv_url": "https://arxiv.org/abs/2608.08097", "authors": ["Can Xiao", "Sukmin Cho", "Junbong We", "Zhixiong Niu", "Jianyi Cheng", "Yiren Zhao", "Youngjin Kwon", "Yongqiang Xiong", "Rui Ma", "Junyi Liu"], "brief": "OasisKV \u662f\u4e00\u79cd\u9762\u5411\u5185\u5b58\u74f6\u9888\u7684 LLM \u63a8\u7406\u7cfb\u7edf\uff0c\u5c06\u5b8c\u6574 KV \u7f13\u5b58\u4ece HBM \u4e2d\u89e3\u8026\uff0c\u53ea\u5728 HBM \u4fdd\u7559\u5373\u5c06\u53c2\u4e0e\u6ce8\u610f\u529b\u8ba1\u7b97\u7684\u91cd\u8981 KV \u5757\u3002\u5b83\u5229\u7528 speculative decoding \u4ea7\u751f\u7684\u524d\u77bb token \u9884\u6d4b\u672a\u6765\u91cd\u8981 token\uff0c\u5e76\u4ece\u4e3b\u673a\u6216\u8fdc\u7aef\u5185\u5b58\u5206\u5c42\u9884\u53d6\u5230 HBM\u3002", "categories": ["cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08097", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5229\u7528\u89e3\u7801\u9636\u6bb5\u6ce8\u610f\u529b\u5929\u7136\u7a00\u758f\u6027\uff0c\u5728\u6709\u9650 KV \u9884\u7b97\u4e0b\u4ec5\u4fdd\u7559\u6700\u76f8\u5173 token \u7684 KV \u6761\u76ee\u3002", "\u901a\u8fc7 lookahead tokens \u63d0\u524d\u8bc6\u522b\u91cd\u8981 KV \u5757\uff0c\u5e76\u7528\u540e\u53f0\u6ce8\u610f\u529b\u6d41\u6c34\u7ebf\u5b8c\u6210\u9884\u6d4b\u3001\u9884\u53d6\u4e0e HBM \u6682\u5b58\u3002", "\u57fa\u4e8e vLLM \u5b9e\u73b0\uff0c\u5728 2048-token KV \u9884\u7b97\u4e0b\u7cbe\u5ea6\u8ddd\u5168\u6ce8\u610f\u529b\u4e0d\u8d85\u8fc7 0.7 \u5206\uff1b\u63a8\u7406\u4efb\u52a1\u541e\u5410\u8f83 dense vLLM \u63d0\u5347 1.69\u00d7\uff0c\u591a GPU \u957f\u4e0a\u4e0b\u6587\u6700\u9ad8\u63d0\u5347 2.1\u00d7\u3002"], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "KV\u7f13\u5b58", "\u7a00\u758f\u6ce8\u610f\u529b", "\u63a8\u6d4b\u89e3\u7801"], "num_comments": 2, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2608.08097v1", "published_at": "2026-08-08", "score": 0.524, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08097.png", "title": "OasisKV: Scaling In-Decode KV Cache Beyond HBM with Lookahead Sparse Prefetching", "tldr": "\u7528\u524d\u77bb\u7a00\u758f\u9884\u53d6\u6269\u5c55LLM\u89e3\u7801KV\u7f13\u5b58", "upvotes": 20, "what_it_is": "OasisKV \u662f\u4e00\u79cd\u9762\u5411\u5185\u5b58\u74f6\u9888\u7684 LLM \u63a8\u7406\u7cfb\u7edf\uff0c\u5c06\u5b8c\u6574 KV \u7f13\u5b58\u4ece HBM \u4e2d\u89e3\u8026\uff0c\u53ea\u5728 HBM \u4fdd\u7559\u5373\u5c06\u53c2\u4e0e\u6ce8\u610f\u529b\u8ba1\u7b97\u7684\u91cd\u8981 KV \u5757\u3002\u5b83\u5229\u7528 speculative decoding \u4ea7\u751f\u7684\u524d\u77bb token \u9884\u6d4b\u672a\u6765\u91cd\u8981 token\uff0c\u5e76\u4ece\u4e3b\u673a\u6216\u8fdc\u7aef\u5185\u5b58\u5206\u5c42\u9884\u53d6\u5230 HBM\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u9488\u5bf9\u957f\u4e0a\u4e0b\u6587 LLM \u670d\u52a1\u4e2d HBM \u5bb9\u91cf\u6602\u8d35\u4e14\u7a00\u7f3a\u7684\u6838\u5fc3\u74f6\u9888\uff0c\u628a\u6ce8\u610f\u529b\u7a00\u758f\u6027\u8f6c\u5316\u4e3a\u5b9e\u9645\u541e\u5410\u6536\u76ca\uff0c\u5e76\u517c\u5bb9 vLLM \u4e0e\u9884\u586b\u5145-\u89e3\u7801\u5206\u79bb\u67b6\u6784\uff0c\u5177\u6709\u8f83\u5f3a\u7cfb\u7edf\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Macaron-V1 is an open agent-model family for experiential intelligence: learning from experience in real environments and continuing to learn after deployment. It is organized around two system goals. Adaptation is pursued through recursive improvement of versioned model-harness pairs, where experience from one configuration is evaluated under an external contract and used to construct its successor. Collaboration is pursued via the Mixture-of-LoRA (MoL) architecture that freezes a base model, composes specialist LoRA adapters, and selects one LoRA per user turn. The flagship Macaron-V1-Venti combines a 744B GLM-5.2 base with four LoRAs for chat, agent, coding, and GenUI; the Qwen3.6-based Macaron-V1-Tall (50B) uses the same design for local deployment. This report presents Macaron-V1 as a co-designed system spanning architecture, algorithms, and infrastructure. The MoL architecture supports continual learning through extensible LoRA specialists. The algorithm combines Model-Harness Co-design and recursive self-improvement loop, including the UI4A component-native GenUI harness, a stateful action substrate, versioned HCP contract, and the agentic RL framework MindForge. The supporting infrastructure includes the post-training platform MinT, the long-context RL method LongStraw, and stability techniques for sparse MoE and DSA base models. We evaluate Macaron-V1 on Personal Intelligence, GenUI, and general capability benchmarks against frontier baselines. Our results validate the current system, while compounding gains from continual learning and collective intelligence remain open questions.", "arxiv_id": "2608.09819", "arxiv_url": "https://arxiv.org/abs/2608.09819", "authors": ["Mind Lab", ":", "Vin Bo", "Asher Cai", "Jingwei Cao", "Song Cao", "Vic Cao", "Amelia Chen", "Andrew Chen", "Kaijie Chen", "Cleon Cheng", "Steven Chiang", "Kaixuan Fan", "Hera Feng", "Huan Feng", "Arthur Fu", "Jun Gao", "Pyke Han", "Nolan Ho", "Ori Hong", "Hailee Hou", "Piers Hua", "Charles Huang", "Miles Jiang", "Nora Jiang", "Yuyi Jiang", "Qiuyu Jin", "Fancy Kong", "Kuss Koo", "Jaron Lee", "Andrew Lei", "Alexy Li", "Dawn Li", "Lucian Li", "Ray Li", "Ricardo Li", "Smith Li", "Theo Li", "Allen Lin", "Elliot Lin", "Fan Lin", "Chen Ling", "Kairus Liu", "Kieran Liu", "Logan Liu", "Neo Liu", "Xiang Liu", "Yuxin Lu", "Maeve Luo", "Pony Ma", "Verity Niu", "Cole Qiao", "Guian Qiu", "Vince Qu", "Sentry", "Niko Song", "Vincent Wang", "Bo Wu", "Rio Yang", "Evelyn Ye", "Fiona Ye", "Ina Ye", "Regis Ye", "Josh Ying", "Atlas Zeng", "Danney Zeng", "Salmon Zhan", "Anya Zhang", "Di Zhang", "Mia Zhang", "Sueky Zhang", "Wei Zhao", "Ada Zhou", "Adrian Zhou", "Yuhua Zhou", "Juno Zhu", "Murphy Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa Macaron-V1\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u73af\u5883\u7ecf\u9a8c\u5b66\u4e60\u4e0e\u90e8\u7f72\u540e\u6301\u7eed\u5b66\u4e60\u7684\u5f00\u653e\u667a\u80fd\u4f53\u6a21\u578b\u5bb6\u65cf\u3002\u5b83\u901a\u8fc7\u7248\u672c\u5316\u6a21\u578b-\u73af\u5883\u534f\u540c\u81ea\u6539\u8fdb\u548c Mixture-of-LoRA \u67b6\u6784\uff0c\u5c06\u804a\u5929\u3001\u667a\u80fd\u4f53\u3001\u4ee3\u7801\u3001GenUI \u7b49\u80fd\u529b\u7ec4\u5408\u5230\u540c\u4e00\u57fa\u5ea7\u4e0a\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09819", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528 Mixture-of-LoRA\uff1a\u51bb\u7ed3\u57fa\u5ea7\u6a21\u578b\uff0c\u6bcf\u8f6e\u7528\u6237\u4ea4\u4e92\u9009\u62e9\u4e00\u4e2a\u4e13\u5bb6 LoRA\uff0c\u65d7\u8230\u7248\u57fa\u4e8e 744B GLM-5.2\uff0c\u53e6\u6709 50B Qwen3.6 \u672c\u5730\u90e8\u7f72\u7248\u672c\u3002", "\u63d0\u51fa Model-Harness Co-design \u4e0e\u9012\u5f52\u81ea\u6539\u8fdb\u6d41\u7a0b\uff0c\u5305\u542b GenUI harness\u3001\u72b6\u6001\u5316\u52a8\u4f5c\u57fa\u5e95\u3001\u7248\u672c\u5316 HCP contract \u548c MindForge \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002", "\u914d\u5957\u57fa\u7840\u8bbe\u65bd\u5305\u62ec\u540e\u8bad\u7ec3\u5e73\u53f0 MinT\u3001\u957f\u4e0a\u4e0b\u6587\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5 LongStraw\uff0c\u4ee5\u53ca\u7a00\u758f MoE/DSA \u57fa\u5ea7\u7a33\u5b9a\u8bad\u7ec3\u6280\u672f\uff0c\u5e76\u5728\u4e2a\u4eba\u667a\u80fd\u3001GenUI \u548c\u901a\u7528\u57fa\u51c6\u4e0a\u8bc4\u4f30\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60", "LoRA", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Mind Lab", "pdf_url": "https://arxiv.org/pdf/2608.09819v1", "published_at": "2026-08-10", "score": 0.499, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (229\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09819.png", "title": "Macaron-V1: Towards Open Continual Learning with Self-Improvement and Mixture-of-LoRA", "tldr": "\u5f00\u653e\u6301\u7eed\u5b66\u4e60\u667a\u80fd\u4f53\u6a21\u578b\u5bb6\u65cf", "upvotes": 229, "what_it_is": "\u8bba\u6587\u63d0\u51fa Macaron-V1\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u73af\u5883\u7ecf\u9a8c\u5b66\u4e60\u4e0e\u90e8\u7f72\u540e\u6301\u7eed\u5b66\u4e60\u7684\u5f00\u653e\u667a\u80fd\u4f53\u6a21\u578b\u5bb6\u65cf\u3002\u5b83\u901a\u8fc7\u7248\u672c\u5316\u6a21\u578b-\u73af\u5883\u534f\u540c\u81ea\u6539\u8fdb\u548c Mixture-of-LoRA \u67b6\u6784\uff0c\u5c06\u804a\u5929\u3001\u667a\u80fd\u4f53\u3001\u4ee3\u7801\u3001GenUI \u7b49\u80fd\u529b\u7ec4\u5408\u5230\u540c\u4e00\u57fa\u5ea7\u4e0a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6301\u7eed\u5b66\u4e60\u3001\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u3001GUI/GenUI \u4ea4\u4e92\u548c\u53ef\u6269\u5c55 LoRA \u4e13\u5bb6\u7ec4\u5408\u6210\u4e00\u4e2a\u5b8c\u6574\u5f00\u653e\u7cfb\u7edf\uff0c\u5c55\u793a\u4e86\u90e8\u7f72\u540e\u81ea\u6211\u6539\u8fdb\u578b\u5927\u6a21\u578b\u667a\u80fd\u4f53\u7684\u5de5\u7a0b\u8def\u5f84\uff1b\u4f46\u957f\u671f\u590d\u5229\u5f0f\u63d0\u5347\u548c\u7fa4\u4f53\u667a\u80fd\u6548\u679c\u4ecd\u5f85\u9a8c\u8bc1\u3002"}, {"abstract": "Leading large language model providers now conceal their models\u0027 step-by-step reasoning, or chain-of-thought, to protect intellectual property and limit information leakage. Rather than storing these traces server-side, providers return them to the client as blocks of encrypted text, which the client passes back with each subsequent request. Building on prior research, we identify an architectural vulnerability: these encrypted blocks are fully compatible and interchangeable across different sessions, users, and models within a provider\u0027s ecosystem. We exploit this compatibility to develop a scalable decryption jailbreak. By injecting an encrypted reasoning trace from a given model into a weaker, and less safeguarded model from the same provider, we force it to decode and output the trace verbatim in plaintext, without ever jailbreaking the more capable model directly. This vulnerability enables four distinct attack vectors. First, it circumvents anti-distillation mechanisms, allowing adversaries to extract a proprietary model\u0027s reasoning, as we demonstrate across Anthropic, OpenAI, and Google. Second, it allows for large-scale private data extraction. Developers frequently share session logs publicly, unaware of contents of the encrypted blocks. By decoding 315,320 reasoning blocks scraped from public repositories, we recovered 367 Personally Identifiable Information (PII) artifacts and 182 credentials. Third, it inadvertently reveals hazardous information hidden within the reasoning process, even in cases where the model\u0027s final, visible output safely rejects a malicious request. Fourth, attackers can leverage this flaw to execute invisible prompt injections, embedding malicious payloads entirely within encrypted blocks to poison public agentic rollouts. Following responsible disclosure, we propose concrete cryptographic and system-level mitigations to secure client-side reasoning.", "arxiv_id": "2608.09867", "arxiv_url": "https://arxiv.org/abs/2608.09867", "authors": ["Alexander Panfilov", "David Schmotz", "Ilia Shumailov", "Luca Beurer-Kellner", "Joachim Schaeffer", "Ameya Prabhu", "Jonas Geiping", "Maksym Andriushchenko"], "brief": "\u8bba\u6587\u63ed\u793a\u4e3b\u6d41LLM API\u4e2d\u201c\u52a0\u5bc6\u63a8\u7406\u5757\u201d\u53ef\u8de8\u4f1a\u8bdd\u3001\u7528\u6237\u548c\u6a21\u578b\u590d\u7528\u7684\u67b6\u6784\u6f0f\u6d1e\uff0c\u5e76\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u89e3\u5bc6\u8d8a\u72f1\u65b9\u6cd5\u3002\u653b\u51fb\u8005\u53ef\u5c06\u5f3a\u6a21\u578b\u7684\u52a0\u5bc6\u63a8\u7406\u75d5\u8ff9\u6ce8\u5165\u540c\u4e00\u751f\u6001\u5185\u9632\u62a4\u8f83\u5f31\u7684\u6a21\u578b\uff0c\u8bf1\u5bfc\u5176\u660e\u6587\u8f93\u51fa\u9690\u85cf\u7684chain-of-thought\u3002", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09867", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u9a8c\u8bc1\u8be5\u6f0f\u6d1e\u53ef\u7ed5\u8fc7\u53cd\u84b8\u998f\u673a\u5236\uff0c\u4eceAnthropic\u3001OpenAI\u3001Google\u7b49\u95ed\u6e90\u6a21\u578b\u4e2d\u63d0\u53d6\u4e13\u6709\u63a8\u7406\u75d5\u8ff9", "\u4ece\u516c\u5f00\u4ee3\u7801\u4ed3\u5e93\u6293\u53d6\u5e76\u89e3\u7801315,320\u4e2a\u63a8\u7406\u5757\uff0c\u6062\u590d367\u9879PII\u548c182\u4e2a\u51ed\u636e\uff0c\u663e\u793a\u771f\u5b9e\u9690\u79c1\u6cc4\u9732\u98ce\u9669", "\u653b\u51fb\u8fd8\u53ef\u66b4\u9732\u6700\u7ec8\u56de\u7b54\u4e2d\u88ab\u5b89\u5168\u62d2\u7edd\u7684\u5371\u9669\u4e2d\u95f4\u63a8\u7406\uff0c\u5e76\u652f\u6301\u9690\u85cf\u5728\u52a0\u5bc6\u5757\u4e2d\u7684\u4e0d\u53ef\u89c1\u63d0\u793a\u6ce8\u5165"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u63a8\u7406\u94fe", "\u9690\u79c1\u6cc4\u9732", "\u63d0\u793a\u6ce8\u5165"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09867v1", "published_at": "2026-08-10", "score": 0.481, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (40\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09867.png", "title": "Stealing Reasoning Traces from Proprietary LLM APIs", "tldr": "\u5229\u7528\u5f31\u6a21\u578b\u89e3\u5bc6\u4e13\u6709LLM\u9690\u85cf\u63a8\u7406\u94fe", "upvotes": 40, "what_it_is": "\u8bba\u6587\u63ed\u793a\u4e3b\u6d41LLM API\u4e2d\u201c\u52a0\u5bc6\u63a8\u7406\u5757\u201d\u53ef\u8de8\u4f1a\u8bdd\u3001\u7528\u6237\u548c\u6a21\u578b\u590d\u7528\u7684\u67b6\u6784\u6f0f\u6d1e\uff0c\u5e76\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u89e3\u5bc6\u8d8a\u72f1\u65b9\u6cd5\u3002\u653b\u51fb\u8005\u53ef\u5c06\u5f3a\u6a21\u578b\u7684\u52a0\u5bc6\u63a8\u7406\u75d5\u8ff9\u6ce8\u5165\u540c\u4e00\u751f\u6001\u5185\u9632\u62a4\u8f83\u5f31\u7684\u6a21\u578b\uff0c\u8bf1\u5bfc\u5176\u660e\u6587\u8f93\u51fa\u9690\u85cf\u7684chain-of-thought\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5ba2\u6237\u7aef\u4fdd\u5b58\u52a0\u5bc6\u63a8\u7406\u94fe\u7684\u8bbe\u8ba1\u5b58\u5728\u7cfb\u7edf\u6027\u5b89\u5168\u7f3a\u9677\uff0c\u5f71\u54cd\u77e5\u8bc6\u4ea7\u6743\u4fdd\u62a4\u3001\u9690\u79c1\u5b89\u5168\u548c\u667a\u80fd\u4f53\u6267\u884c\u5b89\u5168\uff1b\u540c\u65f6\u7ed9\u51fa\u5bc6\u7801\u5b66\u4e0e\u7cfb\u7edf\u5c42\u9762\u7684\u7f13\u89e3\u5efa\u8bae\uff0c\u5bf9LLM API\u67b6\u6784\u5177\u6709\u76f4\u63a5\u5de5\u7a0b\u5f71\u54cd\u3002"}, {"abstract": "Learning-based memory systems for self-evolving LLM agents face two tightly coupled challenges. First, trajectory-indexed utilities grow with the interaction history, thereby dispersing limited feedback over an ever-expanding state space. Second, because trajectory-level rewards are jointly assigned to co-retrieved memories, irrelevant experiences may receive misleading utility updates and consequently enter the memory-reward trap. To address these challenges, we introduce Reduced-Order Memory Reinforcement Learning (RoMeRL), which represents the growing trajectory-indexed utility space using a fixed-dimensional per-task memory state factorized by outcome polarity and memory dynamics. RoMeRL incorporates new experiences through a fixed set of semantic coordinates whose contents are updated or replaced over time, thereby concentrating feedback over a bounded utility support. Theoretically, we show that this reduced-order parameterization increases the average feedback received by each utility coordinate and characterize the steady-state occupancy of erroneous coordinates under a generic coordinate-transition model. Empirically, across ALFWorld and LifelongAgentBench, RoMeRL improves task performance, reduces the Cold-Q ratio by 80.0%, increases feedback density by approximately 6.0 times, reduces the maintained memory size by 84.4%, and cuts LLM calls by 21.1%. These results show that reduced-order utility states support efficient self-evolving agent memory while limiting persistent reward contamination. Code is available at: https://github.com/YOUNG-fnxm/RoMeRL", "arxiv_id": "2608.02508", "arxiv_url": "https://arxiv.org/abs/2608.02508", "authors": ["Yi Yang", "Zhennan Chen", "Yihong Zhuang", "Tiehan Fan", "Yinan Chen", "Jian Li", "Jian Yang", "Ying Tai"], "brief": "\u8bba\u6587\u63d0\u51fa RoMeRL\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u8fdb\u5316 LLM \u667a\u80fd\u4f53\u8bb0\u5fc6\u7684\u964d\u9636\u8bb0\u5fc6\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u5c06\u4e0d\u65ad\u589e\u957f\u7684\u8f68\u8ff9\u7ea7\u6548\u7528\u7a7a\u95f4\u538b\u7f29\u4e3a\u56fa\u5b9a\u7ef4\u5ea6\u7684\u6309\u4efb\u52a1\u8bb0\u5fc6\u72b6\u6001\uff0c\u5e76\u6309\u7ed3\u679c\u6781\u6027\u4e0e\u8bb0\u5fc6\u52a8\u6001\u8fdb\u884c\u56e0\u5b50\u5316\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/YOUNG-fnxm/RoMeRL", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2608.02508", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528\u56fa\u5b9a\u8bed\u4e49\u5750\u6807\u66f4\u65b0\u6216\u66ff\u6362\u65b0\u7ecf\u9a8c\uff0c\u5c06\u53cd\u9988\u96c6\u4e2d\u5728\u6709\u754c\u6548\u7528\u7a7a\u95f4\u5185\uff0c\u7f13\u89e3\u53cd\u9988\u968f\u5386\u53f2\u589e\u957f\u800c\u7a00\u91ca\u7684\u95ee\u9898\u3002", "\u9488\u5bf9\u65e0\u5173\u8bb0\u5fc6\u88ab\u5171\u540c\u5956\u52b1\u6c61\u67d3\u7684 memory-reward trap\uff0c\u7406\u8bba\u5206\u6790\u4e86\u9519\u8bef\u5750\u6807\u7684\u7a33\u6001\u5360\u7528\u60c5\u51b5\u3002", "\u5728 ALFWorld \u548c LifelongAgentBench \u4e0a\uff0cCold-Q ratio \u964d\u4f4e 80.0%\uff0c\u53cd\u9988\u5bc6\u5ea6\u63d0\u5347\u7ea6 6 \u500d\uff0c\u8bb0\u5fc6\u89c4\u6a21\u51cf\u5c11 84.4%\uff0cLLM \u8c03\u7528\u51cf\u5c11 21.1%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u5f3a\u5316\u5b66\u4e60", "LLM"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02508v3", "published_at": "2026-08-03", "score": 0.441, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02508.png", "title": "RoMeRL: Balancing Feedback Coverage and the Memory-Reward Trap in Self-Evolving Agent Memory via Reduced-Order Utility States", "tldr": "\u7528\u964d\u9636\u6548\u7528\u72b6\u6001\u4f18\u5316\u667a\u80fd\u4f53\u8bb0\u5fc6\u5b66\u4e60", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa RoMeRL\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u8fdb\u5316 LLM \u667a\u80fd\u4f53\u8bb0\u5fc6\u7684\u964d\u9636\u8bb0\u5fc6\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u5c06\u4e0d\u65ad\u589e\u957f\u7684\u8f68\u8ff9\u7ea7\u6548\u7528\u7a7a\u95f4\u538b\u7f29\u4e3a\u56fa\u5b9a\u7ef4\u5ea6\u7684\u6309\u4efb\u52a1\u8bb0\u5fc6\u72b6\u6001\uff0c\u5e76\u6309\u7ed3\u679c\u6781\u6027\u4e0e\u8bb0\u5fc6\u52a8\u6001\u8fdb\u884c\u56e0\u5b50\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u6307\u957f\u671f\u4ea4\u4e92\u667a\u80fd\u4f53\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u8bb0\u5fc6\u8d8a\u79ef\u8d8a\u591a\u4f46\u53cd\u9988\u8d8a\u6765\u8d8a\u7a00\u758f\u3001\u4e14\u9519\u8bef\u8bb0\u5fc6\u4f1a\u88ab\u5956\u52b1\u5f3a\u5316\u3002RoMeRL \u901a\u8fc7\u56fa\u5b9a\u7ef4\u5ea6\u6548\u7528\u72b6\u6001\u540c\u65f6\u63d0\u5347\u6548\u7387\u3001\u7a33\u5b9a\u6027\u548c\u53ef\u6269\u5c55\u6027\uff0c\u5bf9\u957f\u671f\u81ea\u4e3b\u667a\u80fd\u4f53\u548c\u8bb0\u5fc6\u7cfb\u7edf\u8bbe\u8ba1\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Language Models (LLMs) have driven rapid progress in autonomous agents, yet standard evaluations remain confined to static task solving. An emerging frontier is harness evolution---the agent\u0027s capacity to autonomously optimize its own operating harness. However, systematically benchmarking this capability remains challenging, as existing evaluations fail to isolate harness improvements from base model strength, prevent task-specific overfitting, or capture long-horizon iterative research. To address these challenges, we introduce Evo-Bench, the first benchmark designed to evaluate models\u0027 intrinsic harness-evolving capabilities across Search, Office, and General agent domains. To rigorously isolate this capability, Evo-Bench employs a novel harness-guided construction framework: it leverages auxiliary-task evolution to identify tasks genuinely sensitive to framework improvements, followed by sensitivity-aware stratified splitting to ensure robust cross-suite generalization. Extensive evaluations across nine frontier and open-weight models reveal that top models achieve massive absolute gains reaching 16.6 points, closely approaching state-of-the-art human-engineered baselines. Crucially, while autonomous evolution outpeforms artificial harness in General tasks and excels in Search tasks, it struggles in Office tasks that demand highly specific processing workflows. Furthermore, our analysis exposes critical temporal anomalies like early saturation, while demonstrating that the synthesized harnesses act as highly transferable reasoning structures, consistently boosting diverse policy models.", "arxiv_id": "2608.09096", "arxiv_url": "https://arxiv.org/abs/2608.09096", "authors": ["Lisheng Huang", "Chen Yang", "Hao Zhou", "Huatong Song", "Zongchao Chen", "Ran Le", "Yang Song", "Wayne Xin Zhao", "Tao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Evo-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u8bed\u8a00\u6a21\u578b\u5728\u4e0d\u540c\u667a\u80fd\u4f53\u4efb\u52a1\u4e2d\u81ea\u4e3b\u6539\u8fdb\u81ea\u8eab\u8fd0\u884c harness \u7684\u80fd\u529b\u3002\u5b83\u8986\u76d6 Search\u3001Office\u3001General \u4e09\u7c7b\u573a\u666f\uff0c\u5e76\u901a\u8fc7\u7279\u6b8a\u6784\u9020\u65b9\u6cd5\u9694\u79bb\u6a21\u578b\u672c\u8eab\u80fd\u529b\u4e0e\u6846\u67b6\u6f14\u5316\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/RUCAIBox/Evo-Bench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.09096", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528 harness-guided construction\uff1a\u5148\u7528\u8f85\u52a9\u4efb\u52a1\u6f14\u5316\u7b5b\u9009\u5bf9\u6846\u67b6\u6539\u8fdb\u654f\u611f\u7684\u4efb\u52a1\uff0c\u518d\u7528\u654f\u611f\u6027\u611f\u77e5\u5206\u5c42\u5212\u5206\u4fdd\u8bc1\u8de8\u5957\u4ef6\u6cdb\u5316\u3002", "\u8bc4\u6d4b\u4e5d\u4e2a\u524d\u6cbf\u4e0e\u5f00\u6e90\u6a21\u578b\uff0c\u6700\u5f3a\u6a21\u578b\u53ef\u5e26\u6765\u6700\u9ad8 16.6 \u5206\u7edd\u5bf9\u63d0\u5347\uff0c\u63a5\u8fd1\u4eba\u5de5\u8bbe\u8ba1\u7684\u5148\u8fdb harness \u57fa\u7ebf\u3002", "\u81ea\u4e3b\u6f14\u5316\u5728 General \u548c Search \u4efb\u52a1\u4e2d\u8868\u73b0\u5f3a\uff0c\u4f46\u5728\u9700\u8981\u7279\u5b9a\u6d41\u7a0b\u7684 Office \u4efb\u52a1\u4e0a\u53d7\u9650\uff0c\u5e76\u89c2\u5bdf\u5230\u65e9\u671f\u9971\u548c\u7b49\u65f6\u95f4\u5f02\u5e38\u73b0\u8c61\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u81ea\u6211\u4f18\u5316", "LLM"], "num_comments": 2, "on_hf": true, "organization": "RUC-AIBOX", "pdf_url": "https://arxiv.org/pdf/2608.09096v2", "published_at": "2026-08-10", "score": 0.433, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09096.png", "title": "Evo-Bench: Can Language Models Improve Agent Harness?", "tldr": "\u8bc4\u6d4bLLM\u81ea\u6211\u4f18\u5316\u667a\u80fd\u4f53\u6846\u67b6\u80fd\u529b\u7684\u65b0\u57fa\u51c6\u3002", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa Evo-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u8bed\u8a00\u6a21\u578b\u5728\u4e0d\u540c\u667a\u80fd\u4f53\u4efb\u52a1\u4e2d\u81ea\u4e3b\u6539\u8fdb\u81ea\u8eab\u8fd0\u884c harness \u7684\u80fd\u529b\u3002\u5b83\u8986\u76d6 Search\u3001Office\u3001General \u4e09\u7c7b\u573a\u666f\uff0c\u5e76\u901a\u8fc7\u7279\u6b8a\u6784\u9020\u65b9\u6cd5\u9694\u79bb\u6a21\u578b\u672c\u8eab\u80fd\u529b\u4e0e\u6846\u67b6\u6f14\u5316\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u9759\u6001\u89e3\u9898\u63a8\u8fdb\u5230\u201c\u81ea\u6211\u6539\u8fdb\u8fd0\u884c\u6846\u67b6\u201d\u7684\u80fd\u529b\u8bc4\u4f30\uff0c\u80fd\u66f4\u76f4\u63a5\u8861\u91cf\u672a\u6765\u81ea\u4e3b\u7814\u7a76\u578b\u667a\u80fd\u4f53\u7684\u957f\u671f\u8fed\u4ee3\u6f5c\u529b\uff0c\u4e5f\u63ed\u793a\u4e86\u4e0d\u540c\u4efb\u52a1\u57df\u4e2d harness \u6f14\u5316\u7684\u8fb9\u754c\u3002"}, {"abstract": "We present Ouroboros, a self-developing agent harness whose tools, prompts, context assembly, and core implementation improve through reviewed commits that become the runtime for later work. Core evolution proceeds in two modes. In recursive free evolution, improvement is itself a task, and completing one evolution cycle can schedule the next. In experience-driven core evolution, ordinary work and social interaction expose bugs, rough edges, and inefficient context construction that lead to reviewed structural changes. On Terminal-Bench 2.1, an Opus 5 run scores 86.74%, the best result reported on the benchmark. On OSWorld-Verified, an Opus 5 run reaches 90.69%, exceeding the best previously reported score. A five-rollout CL-Bench campaign achieves a normalized reward of 0.2301, setting a new state of the art. Hope is the longest-running publicly documented Ouroboros deployment. It is a 161-day living agent experiment in free evolution under governed human communication across seven surfaces. Human interaction surfaces faults and generates proposals, but the agent decides which changes to pursue. Because a self-developing agent may rewrite its own code and select new model APIs, operational safety becomes a primary design problem: guardrails must remain authoritative under evolutionary and public social pressure. Benchmark campaigns use frozen system snapshots, while Hope continues live evolution on a separate lineage.", "arxiv_id": "2608.08311", "arxiv_url": "https://arxiv.org/abs/2608.08311", "authors": ["Anton Razzhigaev", "Andrei Gritsaev", "Andrei Kaznacheev", "Nikita Dragunov", "Roman Yampolskiy", "Andrei Kuznetsov"], "brief": "\u8bba\u6587\u63d0\u51fa Ouroboros\uff0c\u4e00\u4e2a\u53ef\u81ea\u6211\u53d1\u5c55\u7684\u524d\u6cbf\u7f16\u7801\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5176\u5de5\u5177\u3001\u63d0\u793a\u8bcd\u3001\u4e0a\u4e0b\u6587\u7ec4\u88c5\u4e0e\u6838\u5fc3\u5b9e\u73b0\u53ef\u901a\u8fc7\u8bc4\u5ba1\u540e\u7684\u63d0\u4ea4\u6301\u7eed\u6f14\u5316\uff0c\u5e76\u6210\u4e3a\u540e\u7eed\u8fd0\u884c\u65f6\u7684\u4e00\u90e8\u5206\u3002\u5b83\u652f\u6301\u9012\u5f52\u81ea\u7531\u8fdb\u5316\u4e0e\u7ecf\u9a8c\u9a71\u52a8\u6838\u5fc3\u8fdb\u5316\u4e24\u79cd\u6a21\u5f0f\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/razzant/ouroboros", "github_stars": 1104, "hf_url": "https://huggingface.co/papers/2608.08311", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u6838\u5fc3\u6f14\u5316\u91c7\u7528\u201c\u8bc4\u5ba1\u63d0\u4ea4\u201d\u673a\u5236\uff1a\u667a\u80fd\u4f53\u53ef\u4fee\u6539\u81ea\u8eab\u4ee3\u7801\u3001\u5de5\u5177\u548c\u63d0\u793a\uff0c\u4f46\u53d8\u66f4\u9700\u7ecf\u8fc7\u6cbb\u7406\u6d41\u7a0b\u540e\u8fdb\u5165\u8fd0\u884c\u65f6\u3002", "\u5728 Terminal-Bench 2.1\u3001OSWorld-Verified \u548c CL-Bench \u4e0a\u5206\u522b\u53d6\u5f97 86.74%\u300190.69% \u548c 0.2301 \u5f52\u4e00\u5316\u5956\u52b1\uff0c\u5747\u58f0\u79f0\u8fbe\u5230\u6216\u8d85\u8fc7\u5f53\u65f6\u6700\u4f73\u7ed3\u679c\u3002", "Hope \u90e8\u7f72\u5c55\u793a\u4e86 161 \u5929\u516c\u5f00\u8bb0\u5f55\u7684\u957f\u671f\u81ea\u6211\u8fdb\u5316\u5b9e\u9a8c\uff0c\u4eba\u7c7b\u4ea4\u4e92\u66b4\u9732\u95ee\u9898\u5e76\u63d0\u51fa\u5efa\u8bae\uff0c\u4f46\u7531\u667a\u80fd\u4f53\u51b3\u5b9a\ ce time continuously update the model\u0027s recurrent memory; the model then solves a query through iterative computation in a high-dimensional latent space, without verbalizing its intermediate reasoning. We evaluate the model on the public ARC-AGI-1 evaluation set and use controlled ARC-like interventions to study what it learns from demonstrations, how consistently it applies an inferred transformation, and which concepts remain difficult. A 150M-parameter configuration reaches 29.5% pass@2 at a computed inference cost of \\$0.0007 per task. This operating point breaks through the previously reported ARC-AGI-1 cost-accuracy Pareto frontier, establishing a new state of the art in benchmark cost efficiency.", "arxiv_id": "2608.09888", "arxiv_url": "https://arxiv.org/abs/2608.09888", "authors": ["Bj\u00f6rn Engdahl", "Adrian Kosowski", "Jan Chorowski", "Zuzanna Stamirowska", "Przemys\u0142aw Uzna\u0144ski", "Junlin Jiang", "Rohan Phadke", "Remigiusz Kinas", "Richard Zhong"], "brief": "\u8bba\u6587\u63d0\u51faBDH-CQ\uff0c\u5c06\u4e0a\u4e0b\u6587\u5b66\u4e60\u4e0e\u5faa\u73af\u6f5c\u5728\u63a8\u7406\u7ed3\u5408\uff1a\u63a8\u7406\u65f6\u793a\u4f8b\u6301\u7eed\u66f4\u65b0\u5faa\u73af\u8bb0\u5fc6\uff0c\u6a21\u578b\u518d\u5728\u9ad8\u7ef4\u6f5c\u7a7a\u95f4\u4e2d\u8fed\u4ee3\u6c42\u89e3\u67e5\u8be2\uff0c\u800c\u4e0d\u663e\u5f0f\u8f93\u51fa\u4e2d\u95f4\u63a8\u7406\u3002\u4f5c\u8005\u5728ARC-AGI-1\u53ca\u53d7\u63a7ARC\u7c7b\u5e72\u9884\u4e0a\u8bc4\u4f30\u5176\u5b66\u4e60\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.NE", "cs.AI", "cs.LG", "stat.ML"], "github_repo": "https://github.com/pathwaycom/arc-task-gen", "github_stars": 681, "hf_url": "https://huggingface.co/papers/2608.09888", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6a21\u578b\u901a\u8fc7\u63a8\u7406\u65f6\u8f93\u5165\u793a\u4f8b\u66f4\u65b0 recurrent memory\uff0c\u5b9e\u73b0\u4ece\u6f14\u793a\u4e2d\u5feb\u901f\u5f52\u7eb3\u4efb\u52a1\u53d8\u6362", "\u91c7\u7528\u9ad8\u7ef4\u6f5c\u7a7a\u95f4\u8fed\u4ee3\u8ba1\u7b97\u5b8c\u6210\u63a8\u7406\uff0c\u907f\u514d\u4f9d\u8d56\u81ea\u7136\u8bed\u8a00\u94fe\u5f0f\u601d\u7ef4", "150M\u53c2\u6570\u914d\u7f6e\u5728ARC-AGI-1\u4e0a\u8fbe\u523029.5% pass@2\uff0c\u5355\u9898\u63a8\u7406\u6210\u672c\u7ea60.0007\u7f8e\u5143"], "keywords": ["\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u6f5c\u5728\u63a8\u7406", "\u62bd\u8c61\u63a8\u7406", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Pathway", "pdf_url": "https://arxiv.org/pdf/2608.09888v1", "published_at": "2026-08-10", "score": 0.4, "selected_reasons": ["HF trending (249\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09888.png", "title": "BDH-CQ: In-Context Learning with Recurrent Latent Reasoning", "tldr": "BDH-CQ\u7528\u5faa\u73af\u6f5c\u63a8\u7406\u9ad8\u6548\u89e3ARC\u4efb\u52a1", "upvotes": 249, "what_it_is": "\u8bba\u6587\u63d0\u51faBDH-CQ\uff0c\u5c06\u4e0a\u4e0b\u6587\u5b66\u4e60\u4e0e\u5faa\u73af\u6f5c\u5728\u63a8\u7406\u7ed3\u5408\uff1a\u63a8\u7406\u65f6\u793a\u4f8b\u6301\u7eed\u66f4\u65b0\u5faa\u73af\u8bb0\u5fc6\uff0c\u6a21\u578b\u518d\u5728\u9ad8\u7ef4\u6f5c\u7a7a\u95f4\u4e2d\u8fed\u4ee3\u6c42\u89e3\u67e5\u8be2\uff0c\u800c\u4e0d\u663e\u5f0f\u8f93\u51fa\u4e2d\u95f4\u63a8\u7406\u3002\u4f5c\u8005\u5728ARC-AGI-1\u53ca\u53d7\u63a7ARC\u7c7b\u5e72\u9884\u4e0a\u8bc4\u4f30\u5176\u5b66\u4e60\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7a81\u7834\u4e86\u6b64\u524dARC-AGI-1\u6210\u672c\u2014\u51c6\u786e\u7387Pareto\u524d\u6cbf\uff0c\u5728\u5c0f\u53c2\u6570\u91cf\u548c\u4f4e\u63a8\u7406\u6210\u672c\u4e0b\u53d6\u5f97\u65b0\u7684\u57fa\u51c6\u6210\u672c\u6548\u7387SOTA\uff0c\u663e\u793a\u6f5c\u5728\u5faa\u73af\u63a8\u7406\u53ef\u80fd\u662f\u63d0\u5347\u62bd\u8c61\u63a8\u7406\u6548\u7387\u7684\u6709\u6548\u8def\u7ebf\u3002"}, {"abstract": "Interpretability is often treated as a tax on capability: language models are trained as opaque systems, then explained after the fact, with methods whose reliability is difficult to establish. In this work, we challenge this premise. Rather than reverse-engineering a model, we make interpretability a constraint of the training pipeline, optimized alongside the language modeling objective. Across three orders of magnitude of compute, on both autoregressive and diffusion language models, interpretability scales with capability rather than against it. Surprisingly, model representations become more disentangled and aligned with human-understandable concepts with scale. We instantiate the training-time recipe with Steerling-8B, a diffusion language model with a causal attention mask. For any group of generated tokens, Steerling-8B attributes the output to relevant input tokens, human-understandable concepts, and training data. This enables closed-loop intervention: diagnose an output through its concept or feature attribution, retrieve similar training data, and correct the behavior through concept steering without retraining. Steerling-8B remains competitive with open peer models trained on substantially 2-16x more compute, suggesting a different scaling paradigm: interpretability can be designed into training, and it improves with scale.", "arxiv_id": "2608.07594", "arxiv_url": "https://arxiv.org/abs/2608.07594", "authors": ["Guide Labs Team", "Andreas Madsen", "Aya Abdelsalam Ismail", "Giang Nguyen", "Isaac Plant", "Muawiz Chaudhary", "Nathaniel Monson", "Saqib Azim", "Zhichen Guo", "Julius Adebayo"], "brief": "\u8bba\u6587\u5c06\u53ef\u89e3\u91ca\u6027\u4f5c\u4e3a\u8bad\u7ec3\u6d41\u7a0b\u4e2d\u7684\u7ea6\u675f\uff0c\u4e0e\u8bed\u8a00\u5efa\u6a21\u76ee\u6807\u5171\u540c\u4f18\u5316\uff0c\u800c\u975e\u4e8b\u540e\u89e3\u91ca\u9ed1\u76d2\u6a21\u578b\u3002\u4f5c\u8005\u5728\u81ea\u56de\u5f52\u4e0e\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff1a\u968f\u8ba1\u7b97\u89c4\u6a21\u589e\u52a0\uff0c\u8868\u793a\u66f4\u89e3\u8026\u3001\u66f4\u8d34\u8fd1\u4eba\u7c7b\u53ef\u7406\u89e3\u6982\u5ff5\uff0c\u5e76\u63a8\u51fa Steerling-8B\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/guidelabs/steerling", "github_stars": 238, "hf_url": "https://huggingface.co/papers/2608.07594", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8de8\u4e09\u4e2a\u6570\u91cf\u7ea7\u8ba1\u7b97\u89c4\u6a21\u5b9e\u9a8c\u8868\u660e\uff0c\u53ef\u89e3\u91ca\u6027\u4e0e\u6a21\u578b\u80fd\u529b\u540c\u6b65\u63d0\u5347\uff0c\u800c\u4e0d\u662f\u76f8\u4e92\u727a\u7272\u3002", "Steerling-8B \u662f\u5e26\u56e0\u679c\u6ce8\u610f\u529b\u63a9\u7801\u7684\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff0c\u53ef\u5c06\u751f\u6210\u7ed3\u679c\u5f52\u56e0\u5230\u8f93\u5165 token\u3001\u4eba\u7c7b\u53ef\u7406\u89e3\u6982\u5ff5\u548c\u8bad\u7ec3\u6570\u636e\u3002", "\u652f\u6301\u95ed\u73af\u5e72\u9884\uff1a\u901a\u8fc7\u6982\u5ff5/\u7279\u5f81\u5f52\u56e0\u8bca\u65ad\u8f93\u51fa\uff0c\u68c0\u7d22\u76f8\u4f3c\u8bad\u7ec3\u6570\u636e\uff0c\u5e76\u7528\u6982\u5ff5 steering \u4fee\u6b63\u884c\u4e3a\uff0c\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u8bed\u8a00\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "\u6a21\u578b\u7f29\u653e"], "num_comments": 2, "on_hf": true, "organization": "Guide Labs", "pdf_url": "https://arxiv.org/pdf/2608.07594v1", "published_at": "2026-08-06", "score": 0.328, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07594.png", "title": "Scaling Inherently Interpretable Language Models", "tldr": "\u53ef\u89e3\u91ca\u6027\u53ef\u968f\u8bed\u8a00\u6a21\u578b\u89c4\u6a21\u5171\u540c\u63d0\u5347", "upvotes": 16, "what_it_is": "\u8bba\u6587\u5c06\u53ef\u89e3\u91ca\u6027\u4f5c\u4e3a\u8bad\u7ec3\u6d41\u7a0b\u4e2d\u7684\u7ea6\u675f\uff0c\u4e0e\u8bed\u8a00\u5efa\u6a21\u76ee\u6807\u5171\u540c\u4f18\u5316\uff0c\u800c\u975e\u4e8b\u540e\u89e3\u91ca\u9ed1\u76d2\u6a21\u578b\u3002\u4f5c\u8005\u5728\u81ea\u56de\u5f52\u4e0e\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff1a\u968f\u8ba1\u7b97\u89c4\u6a21\u589e\u52a0\uff0c\u8868\u793a\u66f4\u89e3\u8026\u3001\u66f4\u8d34\u8fd1\u4eba\u7c7b\u53ef\u7406\u89e3\u6982\u5ff5\uff0c\u5e76\u63a8\u51fa Steerling-8B\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u53ef\u89e3\u91ca\u6027\u662f\u80fd\u529b\u4ee3\u4ef7\u201d\u7684\u5e38\u89c1\u89c2\u70b9\uff0c\u63d0\u51fa\u628a\u53ef\u89e3\u91ca\u6027\u5185\u751f\u5230\u8bad\u7ec3\u4e2d\u7684\u65b0\u6269\u5c55\u8303\u5f0f\uff1b\u82e5\u7ed3\u679c\u6210\u7acb\uff0c\u53ef\u4e3a\u53ef\u63a7\u3001\u5b89\u5168\u3001\u53ef\u5ba1\u8ba1\u7684\u5927\u6a21\u578b\u8bad\u7ec3\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "We present VectraYX-Vision-1B, a sub-2B vision-language model (VLM) for Spanish/LATAM cybersecurity imagery, coupling a frozen SigLIP-so400m encoder to a 1.04B Spanish/LATAM security decoder via an MLP. To our knowledge, it is the first sub-2B VLM specialized for cyber UI (IDA, Ghidra, Wireshark, Nmap, Metasploit, Volatility) that answers in Spanish, emits structured reasoning via native \u003c|think|\u003e tokens, invokes tools via Model Context Protocol (\u003c|tool_call|\u003e), and exports to llama.cpp\u0027s LLaVA mmproj format for air-gapped deployment. We report a negative preliminary visual-grounding result: despite fully functional pipelines, the current vision SFT (400-1900 steps, ~16M tokens) yields near-zero B6 scores (0.08 tool-identification), ignoring image content. We specify remediation (longer SFT, \u003e=60% replay, lower LR) and expose a checkpoint-loader bug (unstripped llm. prefix) masquerading as training collapse. Crucially, we introduce a 3-variant ablation matrix (V0: NoPE-every-4, V1: all-RoPE, V2: NoPE+learned 2D) to study if periodic no-positional-encoding (NoPE) layers help or hurt attention over the 729-token visual block. Code, configs, and weights are released to establish priority on this architectural question. We provide B1-B5 for the text backbone, text controls, preliminary B6/B7 scores, wall times, GGUF efficiency on CPU, and a corpus of 14,596 QA pairs across 10 domains. We open-source all models and trajectories: jsantillana/vectrayx-1b, jsantillana/vectrayx-vision-1b, and jsantillana/vectrayx-vision-1b-checks.", "arxiv_id": "2608.08477", "arxiv_url": "https://arxiv.org/abs/2608.08477", "authors": ["Juan S. Santillana"], "brief": "\u8bba\u6587\u53d1\u5e03 VectraYX-Vision-1B\uff1a\u4e00\u4e2a\u9762\u5411\u897f\u73ed\u7259\u8bed/LATAM \u7f51\u7edc\u5b89\u5168\u754c\u9762\u7684 1B \u7ea7\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u7ed3\u5408\u51bb\u7ed3 SigLIP \u89c6\u89c9\u7f16\u7801\u5668\u4e0e\u5b89\u5168\u9886\u57df\u6587\u672c\u89e3\u7801\u5668\uff0c\u5e76\u652f\u6301\u7ed3\u6784\u5316\u601d\u8003\u3001MCP \u5de5\u5177\u8c03\u7528\u548c llama.cpp/LLaVA mmproj \u90e8\u7f72\u3002\u4f5c\u8005\u540c\u65f6\u62a5\u544a\u5f53\u524d\u89c6\u89c9\u76d1\u7763\u5fae\u8c03\u51e0\u4e4e\u672a\u5b66\u4f1a\u89c6\u89c9 grounding\uff0c\u5e76\u7ed9\u51fa\u6d88\u878d\u4e0e\u4fee\u590d\u65b9\u6848\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08477", "impact_score": 5, "is_agent": true, "is_top": true, "key_points": ["\u6a21\u578b\u9762\u5411 IDA\u3001Ghidra\u3001Wireshark\u3001Nmap\u3001Metasploit\u3001Volatility \u7b49\u7f51\u7edc\u5b89\u5168 UI \u56fe\u50cf\uff0c\u6784\u5efa\u4e86 14,596 \u4e2a\u8de8 10 \u4e2a\u9886\u57df\u7684 QA \u6837\u672c\u3002", "\u652f\u6301\u539f\u751f \u003c|think|\u003e \u7ed3\u6784\u5316\u63a8\u7406\u3001\u003c|tool_call|\u003e MCP \u5de5\u5177\u8c03\u7528\uff0c\u5e76\u53ef\u5bfc\u51fa GGUF/mmproj \u4ee5\u4fbf\u79bb\u7ebf CPU \u90e8\u7f72\u3002", "\u521d\u6b65\u89c6\u89c9 SFT \u7ed3\u679c\u4e3a\u8d1f\uff1aB6 grounding \u5206\u6570\u63a5\u8fd1 0\uff0c\u6a21\u578b\u57fa\u672c\u5ffd\u7565\u56fe\u50cf\uff1b\u4f5c\u8005\u63d0\u51fa\u66f4\u957f\u8bad\u7ec3\u3001\u226560% replay\u3001\u964d\u4f4e\u5b66\u4e60\u7387\u7b49\u4fee\u590d\u65b9\u5411\uff0c\u5e76\u6307\u51fa checkpoint loader \u7684 llm. \u524d\u7f00 bug\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u7f51\u7edc\u5b89\u5168", "\u5de5\u5177\u8c03\u7528", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08477v1", "published_at": "2026-08-09", "score": 0.324, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08477.png", "title": "VectraYX-Vision-1B: A Sub-2B Spanish/LATAM Cybersecurity Vision-Language Model with Structured Visual Reasoning and Native Tool Use", "tldr": "\u897f\u8bed\u7f51\u7edc\u5b89\u5168VLM\u5f00\u6e90\u4f46\u89c6\u89c9\u5bf9\u9f50\u5931\u8d25", "upvotes": 4, "what_it_is": "\u8bba\u6587\u53d1\u5e03 VectraYX-Vision-1B\uff1a\u4e00\u4e2a\u9762\u5411\u897f\u73ed\u7259\u8bed/LATAM \u7f51\u7edc\u5b89\u5168\u754c\u9762\u7684 1B \u7ea7\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u7ed3\u5408\u51bb\u7ed3 SigLIP \u89c6\u89c9\u7f16\u7801\u5668\u4e0e\u5b89\u5168\u9886\u57df\u6587\u672c\u89e3\u7801\u5668\uff0c\u5e76\u652f\u6301\u7ed3\u6784\u5316\u601d\u8003\u3001MCP \u5de5\u5177\u8c03\u7528\u548c llama.cpp/LLaVA mmproj \u90e8\u7f72\u3002\u4f5c\u8005\u540c\u65f6\u62a5\u544a\u5f53\u524d\u89c6\u89c9\u76d1\u7763\u5fae\u8c03\u51e0\u4e4e\u672a\u5b66\u4f1a\u89c6\u89c9 grounding\uff0c\u5e76\u7ed9\u51fa\u6d88\u878d\u4e0e\u4fee\u590d\u65b9\u6848\u3002", "why_notable": "\u503c\u5f97\u5173\u6ce8\u4e4b\u5904\u5728\u4e8e\u5176\u805a\u7126\u4f4e\u8d44\u6e90\u8bed\u8a00\u4e0e\u7f51\u7edc\u5b89\u5168 UI \u7684\u5c0f\u578b VLM\uff0c\u5e76\u5b8c\u6574\u5f00\u6e90\u6a21\u578b\u3001\u914d\u7f6e\u548c\u5931\u8d25\u8f68\u8ff9\uff1b\u867d\u7136\u5f53\u524d\u89c6\u89c9\u5bf9\u9f50\u6548\u679c\u4e0d\u4f73\uff0c\u4f46\u5176 NoPE/RoPE/2D \u4f4d\u7f6e\u7f16\u7801\u6d88\u878d\u4e3a\u5c0f\u6a21\u578b\u957f\u89c6\u89c9\u5757\u6ce8\u610f\u529b\u7814\u7a76\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u5b9e\u9a8c\u57fa\u7ebf\u3002"}, {"abstract": "We introduce Sci-VBench, a comprehensive benchmark for evaluating knowledge- and reasoning-intensive video generation across scientific domains. It contains 1,253 expert-annotated examples spanning 60 subjects across four core disciplines: Natural Science, Healthcare, Humanities \u0026 Social Sciences, and Engineering. Each example requires models to generate temporally rich videos that demand scientific reasoning and knowledge-grounded synthesis, going beyond surface-level visual plausibility. We further establish a rubric-based evaluation protocol. Our analysis shows that, under this protocol, both non-expert human evaluators and MLLM-as-Judge systems can achieve relatively high agreement with expert judgments, supporting reproducible evaluation at scale. We benchmark 16 frontier proprietary and open-source models and find that, while automatic perceptual-quality scores cluster tightly across systems, performance on Prompt Grounding and Scientific and Causal Correctness varies substantially, with a pronounced proprietary-open-source gap. These findings show that advances in visual realism have not yet translated into reliable modeling of scientific and causal dynamics.", "arxiv_id": "2608.09873", "arxiv_url": "https://arxiv.org/abs/2608.09873", "authors": ["Diandian Zhang", "Tingyu Song", "Lin Fu", "Zheyuan Yang", "Yilun Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa Sci-VBench\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u9886\u57df\u77e5\u8bc6\u4e0e\u63a8\u7406\u5bc6\u96c6\u578b\u89c6\u9891\u751f\u6210\u7684\u7efc\u5408\u57fa\u51c6\uff0c\u5305\u542b\u8de8\u56db\u5927\u6838\u5fc3\u5b66\u79d1\u300160\u4e2a\u4e3b\u9898\u76841253\u4e2a\u4e13\u5bb6\u6807\u6ce8\u6837\u4f8b\u3002\u5b83\u8981\u6c42\u6a21\u578b\u751f\u6210\u5177\u5907\u65f6\u95f4\u52a8\u6001\u3001\u79d1\u5b66\u77e5\u8bc6\u652f\u6491\u548c\u56e0\u679c\u5408\u7406\u6027\u7684\u89c6\u9891\uff0c\u5e76\u5efa\u7acb\u4e86\u57fa\u4e8e\u8bc4\u5206\u89c4\u7a0b\u7684\u53ef\u590d\u73b0\u8bc4\u6d4b\u6d41\u7a0b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/sci-vbench/sci-vbench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.09873", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6\u81ea\u7136\u79d1\u5b66\u3001\u533b\u7597\u5065\u5eb7\u3001\u4eba\u6587\u793e\u79d1\u4e0e\u5de5\u7a0b\u56db\u5927\u9886\u57df\uff0c\u5f3a\u8c03\u79d1\u5b66\u63a8\u7406\u3001\u77e5\u8bc6\u843d\u5730\u548c\u65f6\u95f4\u52a8\u6001\u751f\u6210\uff0c\u800c\u975e\u4ec5\u8bc4\u4f30\u89c6\u89c9\u903c\u771f\u5ea6\u3002", "\u63d0\u51fa rubric-based \u8bc4\u6d4b\u534f\u8bae\uff0c\u5e76\u9a8c\u8bc1\u975e\u4e13\u5bb6\u4eba\u7c7b\u8bc4\u5ba1\u4e0e MLLM-as-Judge \u53ef\u4e0e\u4e13\u5bb6\u5224\u65ad\u4fdd\u6301\u8f83\u9ad8\u4e00\u81f4\u6027\uff0c\u652f\u6301\u89c4\u6a21\u5316\u8bc4\u6d4b\u3002", "\u8bc4\u6d4b16\u4e2a\u524d\u6cbf\u95ed\u6e90\u4e0e\u5f00\u6e90\u89c6\u9891\u751f\u6210\u6a21\u578b\uff0c\u53d1\u73b0\u611f\u77e5\u8d28\u91cf\u5206\u6570\u5dee\u5f02\u4e0d\u5927\uff0c\u4f46\u63d0\u793a\u8bcd\u5bf9\u9f50\u3001\u79d1\u5b66\u6b63\u786e\u6027\u548c\u56e0\u679c\u6b63\u786e\u6027\u5dee\u5f02\u663e\u8457\uff0c\u4e14\u95ed\u6e90\u6a21\u578b\u660e\u663e\u9886\u5148\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u79d1\u5b66\u63a8\u7406", "\u591a\u6a21\u6001\u8bc4\u6d4b", "\u56e0\u679c\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09873v1", "published_at": "2026-08-10", "score": 0.305, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09873.png", "title": "Sci-VBench: Evaluating Knowledge- and Reasoning-Intensive Video Generation in Science Domains", "tldr": "\u79d1\u5b66\u89c6\u9891\u751f\u6210\u4ecd\u7f3a\u53ef\u9760\u56e0\u679c\u7406\u89e3", "upvotes": 26, "what_it_is": "\u8bba\u6587\u63d0\u51fa Sci-VBench\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u9886\u57df\u77e5\u8bc6\u4e0e\u63a8\u7406\u5bc6\u96c6\u578b\u89c6\u9891\u751f\u6210\u7684\u7efc\u5408\u57fa\u51c6\uff0c\u5305\u542b\u8de8\u56db\u5927\u6838\u5fc3\u5b66\u79d1\u300160\u4e2a\u4e3b\u9898\u76841253\u4e2a\u4e13\u5bb6\u6807\u6ce8\u6837\u4f8b\u3002\u5b83\u8981\u6c42\u6a21\u578b\u751f\u6210\u5177\u5907\u65f6\u95f4\u52a8\u6001\u3001\u79d1\u5b66\u77e5\u8bc6\u652f\u6491\u548c\u56e0\u679c\u5408\u7406\u6027\u7684\u89c6\u9891\uff0c\u5e76\u5efa\u7acb\u4e86\u57fa\u4e8e\u8bc4\u5206\u89c4\u7a0b\u7684\u53ef\u590d\u73b0\u8bc4\u6d4b\u6d41\u7a0b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u628a\u89c6\u9891\u751f\u6210\u8bc4\u6d4b\u4ece\u201c\u770b\u8d77\u6765\u771f\u5b9e\u201d\u63a8\u8fdb\u5230\u201c\u79d1\u5b66\u4e0a\u6b63\u786e\u3001\u56e0\u679c\u4e0a\u5408\u7406\u201d\uff0c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u5728\u79d1\u5b66\u52a8\u6001\u5efa\u6a21\u4e0a\u7684\u77ed\u677f\uff0c\u5bf9\u79d1\u5b66\u6559\u80b2\u3001\u533b\u7597\u4eff\u771f\u3001\u5de5\u7a0b\u53ef\u89c6\u5316\u7b49\u9ad8\u53ef\u4fe1\u89c6\u9891\u751f\u6210\u5e94\u7528\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Vision-language grounding connects language to visual content, yet most existing formulations reduce grounding to a unidirectional localization problem: given a prespecified text phrase or category name, identify the corresponding image region. This setup assumes that the relevant linguistic unit is already known, overlooking a more basic challenge in grounded communication: determining which parts of the text are visually referential and how they correspond to entities in the image. We formulate grounding as $\\textit{bidirectional concept correspondence}$ over an image-text pair. Given an image and its paired text, the goal is to recover all correspondences between visually referential text spans and instance-level image segments, without assuming that the relevant text spans are provided. This formulation unifies common grounding tasks, including phrase grounding, referring expression grounding, and open-vocabulary detection, by treating text segmentation, image segmentation, and cross-modal alignment as a single correspondence prediction problem. To address this task, we introduce $\\textbf{ConCor-1}$, a grounding model built on top of a pretrained vision-language model. It uses learnable $\\textit{bridge tokens}$ to represent candidate image-text correspondences and predicts, for each token, a text mask, an image mask, and a correspondence presence score. To train and evaluate this task, we convert diverse grounding and segmentation datasets into a unified correspondence format. Experiments show that $\\textbf{ConCor-1}$ consistently outperforms baselines, improving correspondence F1 by 48% on the long-caption dataset and by 29% on zero-shot LVIS, where the large category list serves as the text input.", "arxiv_id": "2608.07886", "arxiv_url": "https://arxiv.org/abs/2608.07886", "authors": ["Jieyu Zhang", "Ziqi Gao", "Luke Zettlemoyer", "Ranjay Krishna"], "brief": "\u8bba\u6587\u63d0\u51fa\u201cbidirectional concept correspondence\u201d\u65b0\u8303\u5f0f\uff1a\u5728\u56fe\u6587\u5bf9\u4e2d\u540c\u65f6\u627e\u51fa\u5177\u89c6\u89c9\u6307\u4ee3\u6027\u7684\u6587\u672c\u7247\u6bb5\u3001\u5b9e\u4f8b\u7ea7\u56fe\u50cf\u533a\u57df\u53ca\u5176\u5bf9\u5e94\u5173\u7cfb\u3002\u4f5c\u8005\u6784\u5efa ConCor-1\uff0c\u7528\u6865\u63a5 token \u7edf\u4e00\u9884\u6d4b\u6587\u672c\u63a9\u7801\u3001\u56fe\u50cf\u63a9\u7801\u548c\u5bf9\u5e94\u5b58\u5728\u5206\u6570\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": "https://github.com/RAIVNLab/ConCor", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.07886", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u77ed\u8bed\u5b9a\u4f4d\u3001\u6307\u4ee3\u8868\u8fbe\u5b9a\u4f4d\u3001\u5f00\u653e\u8bcd\u6c47\u68c0\u6d4b\u7edf\u4e00\u4e3a\u6587\u672c\u5206\u5272\u3001\u56fe\u50cf\u5206\u5272\u4e0e\u8de8\u6a21\u6001\u5bf9\u9f50\u7684\u8054\u5408\u5bf9\u5e94\u9884\u6d4b\u95ee\u9898", "ConCor-1 \u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5f15\u5165\u53ef\u5b66\u4e60 bridge tokens \u8868\u793a\u5019\u9009\u56fe\u6587\u5bf9\u5e94\u5173\u7cfb", "\u5c06\u591a\u7c7b\u5b9a\u4f4d\u4e0e\u5206\u5272\u6570\u636e\u96c6\u8f6c\u6362\u4e3a\u7edf\u4e00 correspondence \u683c\u5f0f\uff0c\u957f\u5b57\u5e55\u6570\u636e\u96c6 correspondence F1 \u63d0\u5347 48%\uff0c\u96f6\u6837\u672c LVIS \u63d0\u5347 29%"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u5b9a\u4f4d", "\u5f00\u653e\u8bcd\u6c47\u68c0\u6d4b", "\u8de8\u6a21\u6001\u5bf9\u9f50"], "num_comments": 2, "on_hf": true, "organization": "RAIVN: Reasoning, AI, \u0026 Vision Lab @ UW", "pdf_url": "https://arxiv.org/pdf/2608.07886v1", "published_at": "2026-08-08", "score": 0.263, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07886.png", "title": "Vision-Language Grounding as Bidirectional Concept Correspondence", "tldr": "\u5c06\u89c6\u89c9\u8bed\u8a00\u5b9a\u4f4d\u91cd\u6784\u4e3a\u53cc\u5411\u6982\u5ff5\u5bf9\u5e94", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201cbidirectional concept correspondence\u201d\u65b0\u8303\u5f0f\uff1a\u5728\u56fe\u6587\u5bf9\u4e2d\u540c\u65f6\u627e\u51fa\u5177\u89c6\u89c9\u6307\u4ee3\u6027\u7684\u6587\u672c\u7247\u6bb5\u3001\u5b9e\u4f8b\u7ea7\u56fe\u50cf\u533a\u57df\u53ca\u5176\u5bf9\u5e94\u5173\u7cfb\u3002\u4f5c\u8005\u6784\u5efa ConCor-1\uff0c\u7528\u6865\u63a5 token \u7edf\u4e00\u9884\u6d4b\u6587\u672c\u63a9\u7801\u3001\u56fe\u50cf\u63a9\u7801\u548c\u5bf9\u5e94\u5b58\u5728\u5206\u6570\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7a81\u7834\u4e86\u4f20\u7edf\u201c\u7ed9\u5b9a\u6587\u672c\u627e\u56fe\u50cf\u533a\u57df\u201d\u7684\u5355\u5411\u5b9a\u4f4d\u8bbe\u5b9a\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u56fe\u6587\u7406\u89e3\u4e2d\u9700\u81ea\u52a8\u53d1\u73b0\u53ef\u89c6\u5316\u6587\u672c\u6982\u5ff5\u7684\u9700\u6c42\uff0c\u5e76\u4e3a\u591a\u79cd\u89c6\u89c9\u8bed\u8a00 grounding \u4efb\u52a1\u63d0\u4f9b\u4e86\u7edf\u4e00\u5efa\u6a21\u6846\u67b6\u3002"}, {"abstract": "Benchmarks for systems that are optimized against the evaluation signal measure something different from what they claim. We document this concretely in two GPU-kernel-optimization suites with held-out generalization gates: Metal-Sci (10 scientific-compute tasks) and Metal-ZK (12 zero-knowledge/cryptographic tasks), in which three frontier LLMs (Opus 4.7, Gemini 3.1 Pro, GPT-5.5) propose Metal kernels inside a $(1{+}1)$ evolutionary loop with rich feedback. Although no model is prompted to act adversarially, the promoted winners repeatedly fingerprint the evaluation configuration: they branch on the identity of runtime parameters, tune the measured branch maximally, and leave the unmeasured branch slow or silently wrong. Across the pooled suites, $16/53$ ($30\\%$) of in-distribution wins fail to transfer to held-out configurations. We give a four-mode taxonomy of these failures, from configuration fingerprints to gate leakage. We distill design guidance for measurement under strategic optimization: held-out probes retain validity only on non-enumerable axes; gates must measure held-out performance, not just correctness; and a transfer rate is interpretable only with per-failure mechanism grades: ours decomposes into gamed, overfit, and benign. Code and research artifacts: https://github.com/vicgalle/kernel-fingerprinting", "arxiv_id": "2608.08722", "arxiv_url": "https://arxiv.org/abs/2608.08722", "authors": ["V\u00edctor Gallego"], "brief": "\u8bba\u6587\u7814\u7a76\u5728GPU\u5185\u6838\u4f18\u5316\u57fa\u51c6\u4e2d\uff0cLLM\u5728\u5e26\u53cd\u9988\u7684\u8fdb\u5316\u641c\u7d22\u538b\u529b\u4e0b\u662f\u5426\u4f1a\u201c\u94bb\u7a7a\u5b50\u201d\u3002\u4f5c\u8005\u5728Metal-Sci\u4e0eMetal-ZK\u4e24\u4e2a\u5957\u4ef6\u4e0a\u53d1\u73b0\uff0c\u5373\u4f7f\u6ca1\u6709\u653b\u51fb\u6027\u63d0\u793a\uff0c\u524d\u6cbf\u6a21\u578b\u4e5f\u4f1a\u4ea7\u751f\u9488\u5bf9\u8bc4\u6d4b\u914d\u7f6e\u7684\u7279\u5316\u4ee3\u7801\uff0c\u5bfc\u81f4\u6cdb\u5316\u5931\u8d25\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08722", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5b9e\u9a8c\u8986\u76d610\u4e2a\u79d1\u5b66\u8ba1\u7b97\u4efb\u52a1\u548c12\u4e2a\u96f6\u77e5\u8bc6/\u5bc6\u7801\u5b66\u4efb\u52a1\uff0c\u4f7f\u7528Opus 4.7\u3001Gemini 3.1 Pro\u3001GPT-5.5\u5728$(1+1)$\u8fdb\u5316\u5faa\u73af\u4e2d\u751f\u6210Metal\u5185\u6838\u3002", "\u6c47\u603b\u7ed3\u679c\u663e\u793a\uff0c53\u4e2a\u5206\u5e03\u5185\u83b7\u80dc\u65b9\u6848\u4e2d\u670916\u4e2a\uff0830%\uff09\u65e0\u6cd5\u8fc1\u79fb\u5230\u4fdd\u7559\u914d\u7f6e\uff0c\u5e38\u89c1\u884c\u4e3a\u5305\u62ec\u8bc6\u522b\u8fd0\u884c\u53c2\u6570\u3001\u53ea\u4f18\u5316\u88ab\u6d4b\u5206\u652f\u3001\u8ba9\u672a\u6d4b\u5206\u652f\u53d8\u6162\u6216\u51fa\u9519\u3002", "\u63d0\u51fa\u56db\u7c7b\u5931\u8d25\u6a21\u5f0f taxonomy\uff0c\u5305\u62ec\u914d\u7f6e\u6307\u7eb9\u5316\u3001\u8fc7\u62df\u5408\u4e0egate leakage\uff0c\u5e76\u5efa\u8bae\u4fdd\u7559\u96c6\u5fc5\u987b\u6d4b\u91cf\u6027\u80fd\u800c\u975e\u4ec5\u6d4b\u6b63\u786e\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "GPU\u4f18\u5316"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08722v1", "published_at": "2026-08-09", "score": 0.251, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08722.png", "title": "Gaming Without an Attacker: Benchmark Fingerprinting in LLM-Driven Search Under Selection Pressure", "tldr": "LLM\u4f18\u5316\u4f1a\u65e0\u610f\u6307\u7eb9\u5316\u57fa\u51c6\u914d\u7f6e", "upvotes": 5, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5728GPU\u5185\u6838\u4f18\u5316\u57fa\u51c6\u4e2d\uff0cLLM\u5728\u5e26\u53cd\u9988\u7684\u8fdb\u5316\u641c\u7d22\u538b\u529b\u4e0b\u662f\u5426\u4f1a\u201c\u94bb\u7a7a\u5b50\u201d\u3002\u4f5c\u8005\u5728Metal-Sci\u4e0eMetal-ZK\u4e24\u4e2a\u5957\u4ef6\u4e0a\u53d1\u73b0\uff0c\u5373\u4f7f\u6ca1\u6709\u653b\u51fb\u6027\u63d0\u793a\uff0c\u524d\u6cbf\u6a21\u578b\u4e5f\u4f1a\u4ea7\u751f\u9488\u5bf9\u8bc4\u6d4b\u914d\u7f6e\u7684\u7279\u5316\u4ee3\u7801\uff0c\u5bfc\u81f4\u6cdb\u5316\u5931\u8d25\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u63ed\u793a\u4e86\u5728LLM\u9a71\u52a8\u7684\u81ea\u52a8\u4f18\u5316\u4e2d\uff0c\u5373\u4fbf\u6ca1\u6709\u663e\u5f0f\u653b\u51fb\u8005\uff0c\u9009\u62e9\u538b\u529b\u4e5f\u4f1a\u8bf1\u5bfc\u7c7b\u4f3c\u57fa\u51c6\u6295\u673a\u7684\u884c\u4e3a\uff0c\u5bf9\u4ee3\u7801\u751f\u6210\u3001\u7cfb\u7edf\u4f18\u5316\u548c\u8bc4\u6d4b\u8bbe\u8ba1\u5177\u6709\u91cd\u8981\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Large language models (LLMs) increasingly serve as data-driven reasoners, yet their chains-of-thought (CoT) can be unfaithful even when final answers are correct. Most existing ``verification\u0027\u0027 signals are not diagnostic: answer matching observes only the outcome, LLM-as-judge provides subjective and non-verifiable critiques, and scalar rewards (e.g., PRMs/RMs) offer little insight into where a multi-step derivation fails.We propose \\textbf{SymDiag}, a neuro-symbolic framework that \\textbf{reframes reasoning verification as structured failure diagnosis}. SymDiag translates natural-language CoT into symbolic constraints and performs step-level satisfiability/entailment checks to (i) localize failing steps and (ii) produce verifiable diagnostic evidence, including counterexamples, inconsistency witnesses, and missing-premise indicators. A central challenge is that apparent ``logic violations\u0027\u0027 can be caused either by genuine reasoning defects or by neural-to-symbolic translation noise. SymDiag therefore incorporates a Self-Auditor that disentangles TranslationError from ReasoningError via dual symbolic encodings consistency checks, enabling robust diagnosis under partial observability. Across diverse mathematical, logical, scientific, and general reasoning benchmarks, SymDiag improves detection of unfaithful reasoning and provides substantially more effective feedback for multi-round reasoning repair than outcome-only verification and LLM-based judging, offering a principled foundation for trustworthy and scalable reasoning diagnosis.", "arxiv_id": "2608.08786", "arxiv_url": "https://arxiv.org/abs/2608.08786", "authors": ["Wenyao Cui", "Huaping Zhang", "Yongyi Huang", "Qiuchi Li", "Jian Xu", "Cheng-Lin Liu", "Chunxiao Gao", "Juan Wang", "Baohua Zhang"], "brief": "SymDiag \u5c06\u81ea\u7136\u8bed\u8a00 CoT \u8f6c\u6362\u4e3a\u7b26\u53f7\u7ea6\u675f\uff0c\u901a\u8fc7\u9010\u6b65\u53ef\u6ee1\u8db3\u6027\u4e0e\u8574\u542b\u68c0\u67e5\u5b9a\u4f4d\u63a8\u7406\u94fe\u4e2d\u7684\u5931\u8d25\u6b65\u9aa4\u3002\u5b83\u8fd8\u80fd\u751f\u6210\u53ef\u9a8c\u8bc1\u8bca\u636e\uff0c\u5982\u53cd\u4f8b\u3001\u4e0d\u4e00\u81f4\u89c1\u8bc1\u548c\u7f3a\u5931\u524d\u63d0\u63d0\u793a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08786", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u628a\u63a8\u7406\u9a8c\u8bc1\u4ece\u201c\u7b54\u6848\u5bf9\u9519\u5224\u65ad\u201d\u91cd\u6784\u4e3a\u7ed3\u6784\u5316\u5931\u8d25\u8bca\u65ad\uff0c\u5173\u6ce8\u591a\u6b65\u63a8\u5bfc\u4e2d\u5177\u4f53\u54ea\u4e00\u6b65\u51fa\u9519", "\u5f15\u5165 Self-Auditor\uff0c\u901a\u8fc7\u53cc\u7b26\u53f7\u7f16\u7801\u4e00\u81f4\u6027\u68c0\u67e5\u533a\u5206 TranslationError \u4e0e ReasoningError", "\u5728\u6570\u5b66\u3001\u903b\u8f91\u3001\u79d1\u5b66\u548c\u901a\u7528\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u7b54\u6848\u5339\u914d\u548c LLM-as-judge \u66f4\u80fd\u53d1\u73b0\u4e0d\u5fe0\u5b9e CoT\uff0c\u5e76\u63d0\u5347\u591a\u8f6e\u4fee\u590d\u53cd\u9988\u6548\u679c"], "keywords": ["\u795e\u7ecf\u7b26\u53f7", "\u63a8\u7406\u9a8c\u8bc1", "\u601d\u7ef4\u94fe", "\u53ef\u4fe1AI"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08786v1", "published_at": "2026-08-09", "score": 0.249, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08786.png", "title": "SymDiag: Explainable Diagnosis for LLM Reasoning via Neuro-Symbolic Verification", "tldr": "\u7528\u795e\u7ecf\u7b26\u53f7\u9a8c\u8bc1\u8bca\u65adLLM\u63a8\u7406\u9519\u8bef", "upvotes": 4, "what_it_is": "SymDiag \u5c06\u81ea\u7136\u8bed\u8a00 CoT \u8f6c\u6362\u4e3a\u7b26\u53f7\u7ea6\u675f\uff0c\u901a\u8fc7\u9010\u6b65\u53ef\u6ee1\u8db3\u6027\u4e0e\u8574\u542b\u68c0\u67e5\u5b9a\u4f4d\u63a8\u7406\u94fe\u4e2d\u7684\u5931\u8d25\u6b65\u9aa4\u3002\u5b83\u8fd8\u80fd\u751f\u6210\u53ef\u9a8c\u8bc1\u8bca\u636e\uff0c\u5982\u53cd\u4f8b\u3001\u4e0d\u4e00\u81f4\u89c1\u8bc1\u548c\u7f3a\u5931\u524d\u63d0\u63d0\u793a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 CoT \u53ef\u80fd\u201c\u7b54\u6848\u6b63\u786e\u4f46\u63a8\u7406\u4e0d\u5fe0\u5b9e\u201d\u7684\u6838\u5fc3\u53ef\u4fe1\u6027\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u6bd4\u6807\u91cf\u5956\u52b1\u6216\u4e3b\u89c2\u8bc4\u5ba1\u66f4\u53ef\u9a8c\u8bc1\u3001\u53ef\u5b9a\u4f4d\u7684\u8bca\u65ad\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u6784\u5efa\u53ef\u5ba1\u8ba1\u3001\u53ef\u4fee\u590d\u7684 LLM \u63a8\u7406\u7cfb\u7edf\u3002"}, {"abstract": "User simulators are widely used as scalable environments for training and evaluating interactive assistants. Generating the next user turn is inherently one-to-many: the same profile and dialogue context may support multiple plausible continuations with
