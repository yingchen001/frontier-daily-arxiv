84\u56de\u6eda\u4fee\u590d\u65b9\u6cd5\uff1a\u6839\u636e\u8fd0\u884c\u65f6\u6eaf\u6e90\u6784\u5efa\u8bb0\u5fc6\u5230\u52a8\u4f5c\u7684\u4f9d\u8d56\u56fe\uff0c\u9009\u62e9\u6027\u5931\u6d3b\u53d7\u6c61\u67d3\u8bb0\u5fc6\u5e76\u91cd\u653e\u53d7\u5f71\u54cd\u8ba1\u7b97\u3002\u5728\u53d7\u63a7\u57fa\u51c6\u548c LongMemEval-V2 \u6539\u7f16\u538b\u529b\u6d4b\u8bd5\u4e2d\uff0c\u8be5\u65b9\u6cd5\u76f8\u8f83\u73b0\u6709\u6062\u590d\u65b9\u6cd5\u53d6\u5f97\u66f4\u9ad8\u6062\u590d\u7387\uff0c\u540c\u65f6\u4fdd\u7559\u826f\u6027\u8bb0\u5fc6\u5e76\u964d\u4f4e\u4e0d\u5fc5\u8981\u91cd\u7b97\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Complex software systems develop over timescales that exceed the lifespan of any individual coding agent. Most agentic software systems preserve continuity through persistent sessions, memories, managers or shared context. We introduce EvoX Genesis (hereafter, Genesis), which instead makes the software project persistent while allowing local agents to remain finite-lived. Genesis represents software as a persistent recursive world: each local world is situated by an accepted version and a repository path, finite-lived agents propose local changes, recursive delegation moves work across paths, and only accepted consequences advance the persistent version history. We evaluate this organization across formation, continuation and redevelopment. Starting from a repository with no compiler implementation, Genesis used DeepSeek V4 Flash to build a Rust-based C compiler with about 250k tracked lines; the run lasted over 120 hours, archived over 1,000 agent episodes and incurred only US$44 in model-token charges. The compiler passed the complete c-testsuite and most LLVM and Csmith tests. In a separate compiler world generated with GLM 5.2, development continued after repeated agent replacement while retaining full test performance. Genesis also reimplemented 13 MESA modules with over 100k Fortran lines as a Rust workspace with nearly 90k Rust lines; across six numerical workloads, it achieved median speedups of 1.55--6.87x. These results show that long-horizon software development can be organized around a persistent project rather than a persistent agent.", "arxiv_id": "2608.10450", "arxiv_url": "https://arxiv.org/abs/2608.10450", "authors": ["Beichen Huang", "Zhenyu Liang", "Bowen Zheng", "Ran Cheng"], "brief": "\u8bba\u6587\u63d0\u51fa EvoX Genesis\uff0c\u5c06\u8f6f\u4ef6\u9879\u76ee\u5efa\u6a21\u4e3a\u201c\u6301\u4e45\u9012\u5f52\u4e16\u754c\u201d\uff0c\u8ba9\u77ed\u751f\u547d\u5468\u671f\u667a\u80fd\u4f53\u5728\u5c40\u90e8\u63d0\u51fa\u4fee\u6539\uff0c\u53ea\u6709\u88ab\u63a5\u53d7\u7684\u7ed3\u679c\u8fdb\u5165\u6301\u4e45\u7248\u672c\u5386\u53f2\uff0c\u4ece\u800c\u652f\u6301\u8d85\u957f\u5468\u671f\u7684\u8f6f\u4ef6\u6f14\u5316\u3002\u5b9e\u9a8c\u4e2d\u7cfb\u7edf\u7528\u4f4e\u6210\u672c\u6a21\u578b\u81ea\u52a8\u6784\u5efa\u4e86\u7ea625\u4e07\u884c Rust C \u7f16\u8bd1\u5668\u5e76\u901a\u8fc7\u5927\u91cf\u6d4b\u8bd5\uff0c\u8fd8\u5728\u667a\u80fd\u4f53\u53cd\u590d\u66ff\u6362\u540e\u4fdd\u6301\u5f00\u53d1\u8fde\u7eed\u6027\uff0c\u5e76\u5c06 MESA \u6a21\u5757\u91cd\u5199\u4e3a Rust \u83b7\u5f97\u663e\u8457\u52a0\u901f\u3002", "categories": ["cs.SE", "cs.AI", "cs.MA", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10450", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u81ea\u52a8\u7f16\u7a0b", "\u957f\u671f\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10450v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Persistent Recursive Worlds Enable Autonomous Software Evolution", "tldr": "\u8bba\u6587\u63d0\u51fa EvoX Genesis\uff0c\u5c06\u8f6f\u4ef6\u9879\u76ee\u5efa\u6a21\u4e3a\u201c\u6301\u4e45\u9012\u5f52\u4e16\u754c\u201d\uff0c\u8ba9\u77ed\u751f\u547d\u5468\u671f\u667a\u80fd\u4f53\u5728\u5c40\u90e8\u63d0\u51fa\u4fee\u6539\uff0c\u53ea\u6709\u88ab\u63a5\u53d7\u7684\u7ed3\u679c\u8fdb\u5165\u6301\u4e45\u7248\u672c\u5386\u53f2\uff0c\u4ece\u800c\u652f\u6301\u8d85\u957f\u5468\u671f\u7684\u8f6f\u4ef6\u6f14\u5316\u3002\u5b9e\u9a8c\u4e2d\u7cfb\u7edf\u7528\u4f4e\u6210\u672c\u6a21\u578b\u81ea\u52a8\u6784\u5efa\u4e86\u7ea625\u4e07\u884c Rust C \u7f16\u8bd1\u5668\u5e76\u901a\u8fc7\u5927\u91cf\u6d4b\u8bd5\uff0c\u8fd8\u5728\u667a\u80fd\u4f53\u53cd\u590d\u66ff\u6362\u540e\u4fdd\u6301\u5f00\u53d1\u8fde\u7eed\u6027\uff0c\u5e76\u5c06 MESA \u6a21\u5757\u91cd\u5199\u4e3a Rust \u83b7\u5f97\u663e\u8457\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models increasingly rely on external tools to access up-to-date information, perform computation, and interact with the outside world. For autoregressive models, tool use naturally fits the generation process: the model emits a tool call, waits for the result, and then continues generating. Diffusion language models (dLLMs), however, reason by repeatedly refining many parts of their output in parallel, making this stop-and-resume interaction pattern unnecessarily restrictive. It can force tool decisions before the model\u0027s reasoning has stabilized, delay useful observations until a discrete call finishes, and introduce redundant refinement and tool execution, potentially hurting both task accuracy and inference efficiency. We introduce Continuous Interaction Diffusion (CID), a diffusion-native model--runtime architecture that integrates tool interaction into iterative denoising. CID separates a model-read-only fact channel, a thought channel represented by a Typed Cognitive Tensor, and a display channel. Information needs can emerge before a textual or JSON call is fully serialized, allowing perceptual bindings to launch external reads while denoising continues. Returned results are projected into the evolving thought state and can revise earlier cognition and display regions. Persistent bindings reuse static results without repeated external execution and refresh changing sources when needed. CID is designed to expose evidence earlier, overlap tool latency with model computation, reduce duplicate external work, and preserve useful computation after new evidence arrives. We formalize the architecture, runtime, and training objectives, and define an evaluation protocol for task quality and end-to-end efficiency. This first paper focuses on read-only tools and makes no empirical performance claims.", "arxiv_id": "2608.10438", "arxiv_url": "https://arxiv.org/abs/2608.10438", "authors": ["Yuhang Cao"], "brief": "\u8bba\u6587\u63d0\u51fa Continuous Interaction Diffusion\uff08CID\uff09\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u539f\u751f\u8fd0\u884c\u65f6\u67b6\u6784\uff0c\u5c06\u5f02\u6b65\u53ea\u8bfb\u5de5\u5177\u8c03\u7528\u878d\u5165\u8fed\u4ee3\u53bb\u566a\u8fc7\u7a0b\uff0c\u800c\u4e0d\u662f\u6cbf\u7528\u81ea\u56de\u5f52\u5f0f\u7684\u201c\u6682\u505c-\u8c03\u7528-\u7ee7\u7eed\u201d\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u4e8b\u5b9e\u901a\u9053\u3001Typed Cognitive Tensor \u601d\u7ef4\u901a\u9053\u548c\u663e\u793a\u901a\u9053\u6765\u63d0\u524d\u66b4\u9732\u8bc1\u636e\u3001\u91cd\u7528\u5de5\u5177\u7ed3\u679c\u5e76\u51cf\u5c11\u91cd\u590d\u5916\u90e8\u6267\u884c\uff1b\u672c\u6587\u4e3b\u8981\u7ed9\u51fa\u5f62\u5f0f\u5316\u67b6\u6784\u3001\u8bad\u7ec3\u76ee\u6807\u548c\u8bc4\u6d4b\u534f\u8bae\uff0c\u5c1a\u65e0\u5b9e\u8bc1\u6027\u80fd\u7ed3\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10438", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5de5\u5177\u8c03\u7528", "\u667a\u80fd\u4f53", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10438v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Continuous Interaction Diffusion: A Diffusion-Native Runtime for Asynchronous Tool-Augmented Reasoning", "tldr": "\u8bba\u6587\u63d0\u51fa Continuous Interaction Diffusion\uff08CID\uff09\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u539f\u751f\u8fd0\u884c\u65f6\u67b6\u6784\uff0c\u5c06\u5f02\u6b65\u53ea\u8bfb\u5de5\u5177\u8c03\u7528\u878d\u5165\u8fed\u4ee3\u53bb\u566a\u8fc7\u7a0b\uff0c\u800c\u4e0d\u662f\u6cbf\u7528\u81ea\u56de\u5f52\u5f0f\u7684\u201c\u6682\u505c-\u8c03\u7528-\u7ee7\u7eed\u201d\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u4e8b\u5b9e\u901a\u9053\u3001Typed Cognitive Tensor \u601d\u7ef4\u901a\u9053\u548c\u663e\u793a\u901a\u9053\u6765\u63d0\u524d\u66b4\u9732\u8bc1\u636e\u3001\u91cd\u7528\u5de5\u5177\u7ed3\u679c\u5e76\u51cf\u5c11\u91cd\u590d\u5916\u90e8\u6267\u884c\uff1b\u672c\u6587\u4e3b\u8981\u7ed9\u51fa\u5f62\u5f0f\u5316\u67b6\u6784\u3001\u8bad\u7ec3\u76ee\u6807\u548c\u8bc4\u6d4b\u534f\u8bae\uff0c\u5c1a\u65e0\u5b9e\u8bc1\u6027\u80fd\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) deployed as AI agents frequently exhibit user specification-grounding failures, executing hallucinated, undesired actions to force a resolution rather than expressing uncertainty. Existing detection methods fail to provide actionable, real-time correction as they either do not localize the hallucinations, or incur prohibitive inference latency. We introduce the Latent Critic, a lightweight low-rank adapter (LoRA) that operates concurrently with a frozen base LLM\u0027s generation to actively restructure the transformer\u0027s residual stream---amplifying latent grounding signals and translating them into localized, natural language feedback within a single sequence. By refining the base model\u0027s native uncertainty signals, this manipulation of the latent space enables reliable, granular detection without the overhead of secondary inference loops. Mechanistic analysis via activation patching and layer-wise probing shows that this rank-invariant behavior restructures pre-existing uncertainty geometry into a linearly separable representation that transfers more reliably than base model representations alone. Using tool-calling as an instantiation of granular hallucinations, we validate the detection and downstream improvements enabled by the Latent Critic architecture across Qwen and Llama-based models. Demonstrating superior real-time efficacy, our approach significantly outperforms equivalent-scale fine-tuned external detectors, semantic entropy baselines, and passive internal probes in isolating hallucinations, achieving 0.966 AUROC and \u003e80% accuracy in localization (e.g., ungrounded: date). When deployed in a closed-loop ReAct environment, the Critic acts as a negligible latency guardrail, intercepting hallucinations before execution to prevent undesired actions while simultaneously leveraging this specific localized feedback to enable efficient agent self-correction.", "arxiv_id": "2608.10430", "arxiv_url": "https://arxiv.org/abs/2608.10430", "authors": ["Sanidhya Vijayvargiya", "Rahul Lokesh"], "brief": "\u8bba\u6587\u63d0\u51fa Latent Critic\uff1a\u4e00\u4e2a\u8f7b\u91cf LoRA\uff0c\u5728\u5927\u6a21\u578b\u751f\u6210\u8fc7\u7a0b\u4e2d\u5e76\u884c\u6539\u5199\u6b8b\u5dee\u6d41\uff0c\u628a\u6f5c\u5728\u4e0d\u786e\u5b9a\u6027\u8f6c\u5316\u4e3a\u5c40\u90e8\u5316\u7684\u81ea\u7136\u8bed\u8a00\u6279\u8bc4\uff0c\u7528\u4e8e\u5b9e\u65f6\u68c0\u6d4b\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u4e2d\u7684\u5e7b\u89c9\u52a8\u4f5c\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916\u63a8\u7406\u5faa\u73af\uff0c\u5728 Qwen \u548c Llama \u7cfb\u6a21\u578b\u4e0a\u663e\u8457\u4f18\u4e8e\u5916\u90e8\u68c0\u6d4b\u5668\u3001\u8bed\u4e49\u71b5\u548c\u5185\u90e8\u63a2\u9488\uff0c\u8fbe\u5230 0.966 AUROC \u4e0e\u8d85\u8fc7 80% \u7684\u5b9a\u4f4d\u51c6\u786e\u7387\uff0c\u5e76\u80fd\u5728 ReAct \u95ed\u73af\u4e2d\u62e6\u622a\u9519\u8bef\u52a8\u4f5c\u3001\u4fc3\u8fdb\u81ea\u6211\u4fee\u6b63\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10430", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5e7b\u89c9\u68c0\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0d\u786e\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10430v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Actionable Hallucination Detection: Translating Latent Uncertainty into Agentic Critique", "tldr": "\u8bba\u6587\u63d0\u51fa Latent Critic\uff1a\u4e00\u4e2a\u8f7b\u91cf LoRA\uff0c\u5728\u5927\u6a21\u578b\u751f\u6210\u8fc7\u7a0b\u4e2d\u5e76\u884c\u6539\u5199\u6b8b\u5dee\u6d41\uff0c\u628a\u6f5c\u5728\u4e0d\u786e\u5b9a\u6027\u8f6c\u5316\u4e3a\u5c40\u90e8\u5316\u7684\u81ea\u7136\u8bed\u8a00\u6279\u8bc4\uff0c\u7528\u4e8e\u5b9e\u65f6\u68c0\u6d4b\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u4e2d\u7684\u5e7b\u89c9\u52a8\u4f5c\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916\u63a8\u7406\u5faa\u73af\uff0c\u5728 Qwen \u548c Llama \u7cfb\u6a21\u578b\u4e0a\u663e\u8457\u4f18\u4e8e\u5916\u90e8\u68c0\u6d4b\u5668\u3001\u8bed\u4e49\u71b5\u548c\u5185\u90e8\u63a2\u9488\uff0c\u8fbe\u5230 0.966 AUROC \u4e0e\u8d85\u8fc7 80% \u7684\u5b9a\u4f4d\u51c6\u786e\u7387\uff0c\u5e76\u80fd\u5728 ReAct \u95ed\u73af\u4e2d\u62e6\u622a\u9519\u8bef\u52a8\u4f5c\u3001\u4fc3\u8fdb\u81ea\u6211\u4fee\u6b63\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A slew of recent works develop agents for solving research problems end-to-end, a paradigm increasingly referred to as autoresearch. Such agents have inspired large industry investment, motivated by their potential to automate time-consuming human labor and customize machine learning solutions for specialized applications. In this paper, we study the modeling pipeline at the core of these autoresearch systems and identify common failure modes when they are applied to tabular datasets: (1) they waste compute resolving the same bugs over and over again; (2) they often fail to tune hyperparameters even when they have a large remaining compute budget; (3) the tree-search algorithms that power them do not explore; and (4) they perform data analysis, mimicking the humans whose data they are trained on, but do not use that analysis to make downstream decisions. We explore targeted interventions and find that a global debug consultant that shares discovered runtime constraints across all branches of the search tree, prompt- and control-level enhancements, and refined tree-search algorithms successfully recover wasted compute. Our results show that large gains in autoresearch agent performance are achievable through agentic design alone, holding the underlying language model fixed.", "arxiv_id": "2608.10424", "arxiv_url": "https://arxiv.org/abs/2608.10424", "authors": ["Au Kwok Chun", "Abhigyan Acherjee", "Amrutha Rao", "Zaiqian Chen", "Kazem Meidani", "C. Bayan Bruss", "Micah Goldblum"], "brief": "\u672c\u6587\u7814\u7a76\u81ea\u52a8\u79d1\u7814\u667a\u80fd\u4f53\u5728\u8868\u683c\u6570\u636e\u5efa\u6a21\u6d41\u7a0b\u4e2d\u7684\u7b97\u529b\u6d6a\u8d39\u95ee\u9898\uff0c\u53d1\u73b0\u5176\u5e38\u53cd\u590d\u4fee\u540c\u7c7b bug\u3001\u5ffd\u89c6\u8d85\u53c2\u6570\u8c03\u4f18\u3001\u6811\u641c\u7d22\u63a2\u7d22\u4e0d\u8db3\uff0c\u4e14\u6570\u636e\u5206\u6790\u672a\u6709\u6548\u7528\u4e8e\u540e\u7eed\u51b3\u7b56\u3002\u4f5c\u8005\u901a\u8fc7\u5168\u5c40\u8c03\u8bd5\u987e\u95ee\u3001\u63d0\u793a\u4e0e\u63a7\u5236\u5c42\u6539\u8fdb\u3001\u4f18\u5316\u6811\u641c\u7d22\u7b49\u667a\u80fd\u4f53\u8bbe\u8ba1\uff0c\u5728\u4e0d\u66f4\u6362\u5e95\u5c42\u8bed\u8a00\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u4e86\u6027\u80fd\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10424", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u6811\u641c\u7d22", "\u8868\u683c\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10424v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Recovering Wasted Compute in Autoresearch Agents", "tldr": "\u672c\u6587\u7814\u7a76\u81ea\u52a8\u79d1\u7814\u667a\u80fd\u4f53\u5728\u8868\u683c\u6570\u636e\u5efa\u6a21\u6d41\u7a0b\u4e2d\u7684\u7b97\u529b\u6d6a\u8d39\u95ee\u9898\uff0c\u53d1\u73b0\u5176\u5e38\u53cd\u590d\u4fee\u540c\u7c7b bug\u3001\u5ffd\u89c6\u8d85\u53c2\u6570\u8c03\u4f18\u3001\u6811\u641c\u7d22\u63a2\u7d22\u4e0d\u8db3\uff0c\u4e14\u6570\u636e\u5206\u6790\u672a\u6709\u6548\u7528\u4e8e\u540e\u7eed\u51b3\u7b56\u3002\u4f5c\u8005\u901a\u8fc7\u5168\u5c40\u8c03\u8bd5\u987e\u95ee\u3001\u63d0\u793a\u4e0e\u63a7\u5236\u5c42\u6539\u8fdb\u3001\u4f18\u5316\u6811\u641c\u7d22\u7b49\u667a\u80fd\u4f53\u8bbe\u8ba1\uff0c\u5728\u4e0d\u66f4\u6362\u5e95\u5c42\u8bed\u8a00\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u4e86\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern reinforcement learning (RL) post-training pipelines for large language models (LLMs) increasingly combine rollout workloads across multiple domains and feedback paradigms. Prefix-aware routing improves inference efficiency through cache reuse and load balancing, but it does not control how heterogeneous rollout sessions compete for KV-cache capacity. When reinforcement learning with verifiable rewards (RLVR), reinforcement learning from human feedback (RLHF), and agentic rollouts share an asynchronous inference service, their distinct sequence structures, interaction patterns, and KV-residency times create substantially different serving demands. Rollout scheduling must account for this heterogeneity without distorting the workload mixture specified by the trainer. We present MISA-T, a routing-layer admission policy for mixed rollout serving. MISA-T combines adaptive session admission, workload-aware KV-capacity allocation, and residency-time-aware KV accounting. In rollout-only ablations on Step3.7 and Qwen3.6-35B-A3B, MISA-T improves rollout throughput over a sweep-tuned cache-aware vLLM Router by 53.3% and 43.6%, respectively, while maintaining high prefix-cache hit rates. In a matched 50-iteration Step3.7 experiment, it increases rollout throughput by 35.6% and reduces mean iteration time by 22.8%, while keeping the consumed workload mixture close to the trainer target and achieving comparable task scores.", "arxiv_id": "2608.11152", "arxiv_url": "https://arxiv.org/abs/2608.11152", "authors": ["Zetao Hong", "Song Yuan", "Yuanhao Ding", "Yibo Zhu", "Daxin Jiang", "Zhibin Wang", "Chen Tian"], "brief": "\u8bba\u6587\u63d0\u51fa MISA-T\uff0c\u4e00\u79cd\u9762\u5411\u6df7\u5408\u5f3a\u5316\u5b66\u4e60 rollout \u670d\u52a1\u7684\u8def\u7531\u5c42\u51c6\u5165\u8c03\u5ea6\u7b56\u7565\uff0c\u9488\u5bf9 RLVR\u3001RLHF \u548c\u667a\u80fd\u4f53\u5f0f rollout \u5728 KV-cache \u5360\u7528\u4e0e\u9a7b\u7559\u65f6\u95f4\u4e0a\u7684\u5dee\u5f02\u8fdb\u884c\u81ea\u9002\u5e94\u5206\u914d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u8c03\u4f18\u540e\u7684 cache-aware vLLM Router\uff0cMISA-T \u53ef\u5c06 rollout \u541e\u5410\u63d0\u5347\u7ea6 43.6%\u201353.3%\uff0c\u5728\u8bad\u7ec3\u5b9e\u9a8c\u4e2d\u541e\u5410\u63d0\u5347 35.6%\u3001\u5e73\u5747\u8fed\u4ee3\u65f6\u95f4\u964d\u4f4e 22.8%\uff0c\u540c\u65f6\u4fdd\u6301\u4efb\u52a1\u8868\u73b0\u548c\u5de5\u4f5c\u8d1f\u8f7d\u914d\u6bd4\u63a5\u8fd1\u76ee\u6807\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11152", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u670d\u52a1", "\u8c03\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11152v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Scheduling Mixed RL Rollouts Beyond Prefix Locality", "tldr": "\u8bba\u6587\u63d0\u51fa MISA-T\uff0c\u4e00\u79cd\u9762\u5411\u6df7\u5408\u5f3a\u5316\u5b66\u4e60 rollout \u670d\u52a1\u7684\u8def\u7531\u5c42\u51c6\u5165\u8c03\u5ea6\u7b56\u7565\uff0c\u9488\u5bf9 RLVR\u3001RLHF \u548c\u667a\u80fd\u4f53\u5f0f rollout \u5728 KV-cache \u5360\u7528\u4e0e\u9a7b\u7559\u65f6\u95f4\u4e0a\u7684\u5dee\u5f02\u8fdb\u884c\u81ea\u9002\u5e94\u5206\u914d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u8c03\u4f18\u540e\u7684 cache-aware vLLM Router\uff0cMISA-T \u53ef\u5c06 rollout \u541e\u5410\u63d0\u5347\u7ea6 43.6%\u201353.3%\uff0c\u5728\u8bad\u7ec3\u5b9e\u9a8c\u4e2d\u541e\u5410\u63d0\u5347 35.6%\u3001\u5e73\u5747\u8fed\u4ee3\u65f6\u95f4\u964d\u4f4e 22.8%\uff0c\u540c\u65f6\u4fdd\u6301\u4efb\u52a1\u8868\u73b0\u548c\u5de5\u4f5c\u8d1f\u8f7d\u914d\u6bd4\u63a5\u8fd1\u76ee\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-document understanding often requires reasoning over many visually rich pages, making inference costly and prone to context rot. In this work, we propose InSight-doc, an agentic visual perception framework that treats visual resolution as an adaptive reasoning-time resource. InSight-doc starts from low resolution and selectively zooms into high-resolution regions for finer evidence, without relying on any external retriever. To train such an agent, we construct an active-perception corpus of 17.9K high-quality SFT examples with region-level zoom-in trajectories, accompanied by 19.2K hard RL examples. Through SFT+RL, InSight-doc-8B improves the baseline by 4.3--16.4 accuracy points over document VQA benchmarks. On long documents, it reduces hallucination by more than 40% and inference latency by 41%--68% while maintaining an accuracy lead. Our code, datasets, and model are released at https://github.com/m-Just/InSight-doc .", "arxiv_id": "2608.10628", "arxiv_url": "https://arxiv.org/abs/2608.10628", "authors": ["Kaican Li", "Weiyan Xie", "Lewei Yao", "Jiannan Wu", "Lanqing Hong", "Yongxiang Huang", "Nevin L. Zhang"], "brief": "InSight-doc \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u6587\u6863\u7406\u89e3\u7684\u667a\u80fd\u4f53\u5f0f\u89c6\u89c9\u611f\u77e5\u6846\u67b6\uff0c\u5c06\u89c6\u89c9\u5206\u8fa8\u7387\u4f5c\u4e3a\u63a8\u7406\u65f6\u53ef\u81ea\u9002\u5e94\u5206\u914d\u7684\u8d44\u6e90\uff1a\u5148\u4f4e\u5206\u8fa8\u7387\u6d4f\u89c8\uff0c\u518d\u6309\u9700\u653e\u5927\u5173\u952e\u533a\u57df\u83b7\u53d6\u8bc1\u636e\u3002\u901a\u8fc7\u5305\u542b\u533a\u57df\u7ea7\u7f29\u653e\u8f68\u8ff9\u7684 SFT \u6570\u636e\u548c\u56f0\u96be RL \u6570\u636e\u8bad\u7ec3\uff0c8B \u6a21\u578b\u5728\u6587\u6863 VQA \u4e0a\u63d0\u5347 4.3\u201316.4 \u4e2a\u51c6\u786e\u7387\u70b9\uff0c\u5e76\u5728\u957f\u6587\u6863\u4e2d\u51cf\u5c11 40% \u4ee5\u4e0a\u5e7b\u89c9\u3001\u964d\u4f4e 41%\u201368% \u63a8\u7406\u5ef6\u8fdf\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10628", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6587\u6863\u7406\u89e3", "\u89c6\u89c9\u95ee\u7b54", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10628v1", "published_at": "2026-08-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "InSight-doc: Agentic Visual Perception for Long-Document Understanding", "tldr": "InSight-doc \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u6587\u6863\u7406\u89e3\u7684\u667a\u80fd\u4f53\u5f0f\u89c6\u89c9\u611f\u77e5\u6846\u67b6\uff0c\u5c06\u89c6\u89c9\u5206\u8fa8\u7387\u4f5c\u4e3a\u63a8\u7406\u65f6\u53ef\u81ea\u9002\u5e94\u5206\u914d\u7684\u8d44\u6e90\uff1a\u5148\u4f4e\u5206\u8fa8\u7387\u6d4f\u89c8\uff0c\u518d\u6309\u9700\u653e\u5927\u5173\u952e\u533a\u57df\u83b7\u53d6\u8bc1\u636e\u3002\u901a\u8fc7\u5305\u542b\u533a\u57df\u7ea7\u7f29\u653e\u8f68\u8ff9\u7684 SFT \u6570\u636e\u548c\u56f0\u96be RL \u6570\u636e\u8bad\u7ec3\uff0c8B \u6a21\u578b\u5728\u6587\u6863 VQA \u4e0a\u63d0\u5347 4.3\u201316.4 \u4e2a\u51c6\u786e\u7387\u70b9\uff0c\u5e76\u5728\u957f\u6587\u6863\u4e2d\u51cf\u5c11 40% \u4ee5\u4e0a\u5e7b\u89c9\u3001\u964d\u4f4e 41%\u201368% \u63a8\u7406\u5ef6\u8fdf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Erasing concepts from large-scale text-to-image (T2I) diffusion models has become increasingly crucial due to the growing concerns over copyright infringement, privacy violations, and offensive content. Existing approaches struggle to achieve both precise and persistent concept erasure: inaccurate localization of concept-related representations may cause unintended semantic interference, while incomplete removal of the underlying concept knowledge allows adversarial recovery. To address this dilemma, we propose PEAK, a \\textbf{\\textit{precise}} and \\textbf{\\textit{persistent}} concept erasure framework via k-Sparse Autoencoders (kSAEs). PEAK first trains a kSAE on internal activations of the diffusion denoising network to decompose dense representations into interpretable sparse features. By contrasting sparse activations induced by target and non-target prompts, PEAK identifies a compact set of target-specific features according to both activation strength and frequency. These localized features are then used for parameter optimization, where PEAK selectively suppresses target-related activations while preserving complementary non-target ones towards the original model. This feature-guided optimization embeds concept erasure directly into diffusion parameters, eliminating the need for additional inference-time intervention and facilitating effective persistence against adversarial attacks. Extensive experiments demonstrate that PEAK achieves effective and robust concept erasure. On the I2P benchmark, PEAK reduces NudeNet detections from 582 to 6, lowers the average attack success rate (ASR) from 96.52\\% to 5.63\\%, and preserves general generation quality on MS-COCO with a near-zero KID. Our code and models are available at: https://github.com/manmanTAT/PEAK", "arxiv_id": "2608.10985", "arxiv_url": "https://arxiv.org/abs/2608.10985", "authors": ["Man Jiang", "Ouxiang Li", "Weibao Xue", "Zhenhua Tang", "Yuan Wang", "Shuo Wang", "Yanbin Hao"], "brief": "\u672c\u6587\u63d0\u51fa PEAK\uff0c\u7528 k-\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5206\u89e3\u6269\u6563\u6a21\u578b\u53bb\u566a\u7f51\u7edc\u7684\u5185\u90e8\u6fc0\u6d3b\uff0c\u7cbe\u786e\u5b9a\u4f4d\u76ee\u6807\u6982\u5ff5\u5bf9\u5e94\u7684\u7a00\u758f\u7279\u5f81\uff0c\u5e76\u901a\u8fc7\u53c2\u6570\u4f18\u5316\u76f4\u63a5\u6291\u5236\u8fd9\u4e9b\u7279\u5f81\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u66f4\u6301\u4e45\u3001\u9c81\u68d2\u5730\u64e6\u9664\u6982\u5ff5\uff1a\u5728 I2P \u4e0a NudeNet \u68c0\u6d4b\u4ece 582 \u964d\u5230 6\uff0c\u653b\u51fb\u6210\u529f\u7387\u4ece 96.52% \u964d\u5230 5.63%\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10985", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6982\u5ff5\u64e6\u9664", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10985v1", "published_at": "2026-08-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PEAK: Precise and Persistent Concept Erasure via k-Sparse Autoencoders", "tldr": "\u672c\u6587\u63d0\u51fa PEAK\uff0c\u7528 k-\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5206\u89e3\u6269\u6563\u6a21\u578b\u53bb\u566a\u7f51\u7edc\u7684\u5185\u90e8\u6fc0\u6d3b\uff0c\u7cbe\u786e\u5b9a\u4f4d\u76ee\u6807\u6982\u5ff5\u5bf9\u5e94\u7684\u7a00\u758f\u7279\u5f81\uff0c\u5e76\u901a\u8fc7\u53c2\u6570\u4f18\u5316\u76f4\u63a5\u6291\u5236\u8fd9\u4e9b\u7279\u5f81\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u66f4\u6301\u4e45\u3001\u9c81\u68d2\u5730\u64e6\u9664\u6982\u5ff5\uff1a\u5728 I2P \u4e0a NudeNet \u68c0\u6d4b\u4ece 582 \u964d\u5230 6\uff0c\u653b\u51fb\u6210\u529f\u7387\u4ece 96.52% \u964d\u5230 5.63%\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing vision-language model (VLM) backdoors are usually treated as static vulnerabilities: one-to-one and N-to-N attacks bind one or more triggers to a finite set of targets before victim training. This assumption substantially underestimates the threat. We show that a single poisoning phase can implant a programmable backdoor into a VLM, allowing an attacker to choose previously unseen target-caption semantics at inference time and synthesize corresponding stealthy triggers on demand. Unlike fixed-mapping attacks, the proposed any-to-any caption-control paradigm decouples post-training target selection from poisoning, enabling dynamic control of target captions without retraining the VLM. Our method has two components. First, a heuristic poisoning strategy exposes the model to diverse trigger-caption pairs, encouraging it to learn a general trigger-as-instruction rule rather than memorize a specific backdoor pattern. Second, a feature-space trigger steganography method maps any attacker-specified target caption to a stealthy visual trigger, implemented as either a norm-controlled perturbation or a non-semantic patch. Once inserted into arbitrary images, these triggers cause the poisoned VLM to generate outputs semantically aligned with the chosen target caption, even when the target was unseen during poisoning. Extensive experiments show that our attack achieves high any-to-any caption-control success rates, preserves clean model utility, and remains effective under several classical backdoor defenses.", "arxiv_id": "2608.10959", "arxiv_url": "https://arxiv.org/abs/2608.10959", "authors": ["Tao Lin", "Gaojie Jin", "Zongxin Liu", "Peng Wu", "Lijia Yu"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9488\u5bf9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u201c\u53ef\u7f16\u7a0b\u540e\u95e8\u201d\uff1a\u53ea\u9700\u4e00\u6b21\u6295\u6bd2\u8bad\u7ec3\uff0c\u653b\u51fb\u8005\u5c31\u80fd\u5728\u63a8\u7406\u65f6\u4e3a\u4efb\u610f\u672a\u89c1\u8fc7\u7684\u76ee\u6807 caption \u751f\u6210\u9690\u853d\u89e6\u53d1\u5668\uff0c\u4ece\u800c\u52a8\u6001\u63a7\u5236\u6a21\u578b\u8f93\u51fa\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u6837\u5316\u89e6\u53d1\u5668-caption \u6295\u6bd2\u8ba9\u6a21\u578b\u5b66\u4e60\u201c\u89e6\u53d1\u5668\u5373\u6307\u4ee4\u201d\u7684\u89c4\u5219\uff0c\u5e76\u7528\u7279\u5f81\u7a7a\u95f4\u9690\u5199\u751f\u6210\u6270\u52a8\u6216\u8865\u4e01\uff1b\u5b9e\u9a8c\u663e\u793a\u653b\u51fb\u6210\u529f\u7387\u9ad8\u3001\u5e72\u51c0\u6027\u80fd\u4fdd\u6301\u8f83\u597d\uff0c\u4e14\u80fd\u7ed5\u8fc7\u591a\u79cd\u7ecf\u5178\u540e\u95e8\u9632\u5fa1\u3002", "categories": ["cs.CV", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10959", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u540e\u95e8\u653b\u51fb", "\u6a21\u578b\u5b89\u5168", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10959v1", "published_at": "2026-08-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Once Poisoned, Arbitrarily Controlled: A Programmable Backdoor in VLMs", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9488\u5bf9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u201c\u53ef\u7f16\u7a0b\u540e\u95e8\u201d\uff1a\u53ea\u9700\u4e00\u6b21\u6295\u6bd2\u8bad\u7ec3\uff0c\u653b\u51fb\u8005\u5c31\u80fd\u5728\u63a8\u7406\u65f6\u4e3a\u4efb\u610f\u672a\u89c1\u8fc7\u7684\u76ee\u6807 caption \u751f\u6210\u9690\u853d\u89e6\u53d1\u5668\uff0c\u4ece\u800c\u52a8\u6001\u63a7\u5236\u6a21\u578b\u8f93\u51fa\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u6837\u5316\u89e6\u53d1\u5668-caption \u6295\u6bd2\u8ba9\u6a21\u578b\u5b66\u4e60\u201c\u89e6\u53d1\u5668\u5373\u6307\u4ee4\u201d\u7684\u89c4\u5219\uff0c\u5e76\u7528\u7279\u5f81\u7a7a\u95f4\u9690\u5199\u751f\u6210\u6270\u52a8\u6216\u8865\u4e01\uff1b\u5b9e\u9a8c\u663e\u793a\u653b\u51fb\u6210\u529f\u7387\u9ad8\u3001\u5e72\u51c0\u6027\u80fd\u4fdd\u6301\u8f83\u597d\uff0c\u4e14\u80fd\u7ed5\u8fc7\u591a\u79cd\u7ecf\u5178\u540e\u95e8\u9632\u5fa1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World-action models (WAMs) predict the future to act better, but nearly all of them predict only RGB latents, trained purely for pixel reconstruction, with no explicit signal for the 3D geometry or object semantics manipulation needs. We find a surprising free lunch: the same frozen video-generation VAE that encodes RGB also encodes 3D pointmaps almost losslessly, with no pointmap-specific training at all. This lets us supervise Flex-$\u03c0$, a 6B-parameter WAM, on 3D geometry and object-centric DINO semantics alongside RGB, at no cost in new sensors, new pre-training, or inference latency. Every visual signal is projected into this shared latent space and denoised jointly with actions inside a Mixture-of-Transformers backbone; per-stream dropout with cross-modality forcing then lets a single trained checkpoint run on any subset of these streams, from a fast action-only mode to full joint generation. The result is a policy that is exceptionally demonstration-efficient and generalizes well, beating the strongest baselines by up to 2-7$\\times$ on dexterous, precise, real-world bimanual manipulation tasks both in and out of distribution, all while running faster than $\u03c0_{0.5}$. Our project website: https://flex-pi.github.io/", "arxiv_id": "2608.10860", "arxiv_url": "https://arxiv.org/abs/2608.10860", "authors": ["Ge Yan", "Jinghao Liu", "Yuzhi Fan", "Lei Cai", "Minwen Liao", "Jesse Zhang", "Dieter Fox"], "brief": "\u672c\u6587\u63d0\u51fa Flex-\u03c0\uff0c\u4e00\u4e2a 6B \u53c2\u6570\u7684\u591a\u6d41\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u5c06 RGB\u30013D \u51e0\u4f55\u70b9\u56fe\u548c DINO \u7269\u4f53\u8bed\u4e49\u6295\u5c04\u5230\u540c\u4e00\u51bb\u7ed3\u89c6\u9891 VAE \u6f5c\u7a7a\u95f4\u4e2d\uff0c\u5e76\u4e0e\u52a8\u4f5c\u8054\u5408\u53bb\u566a\u5efa\u6a21\u3002\u901a\u8fc7\u591a\u6d41 dropout \u548c\u8de8\u6a21\u6001\u5f3a\u5236\uff0c\u4e00\u4e2a\u6a21\u578b\u53ef\u5728\u4ec5\u52a8\u4f5c\u5230\u5b8c\u6574\u591a\u6a21\u6001\u751f\u6210\u7684\u4e0d\u540c\u8ba1\u7b97\u9884\u7b97\u4e0b\u8fd0\u884c\uff0c\u5728\u771f\u5b9e\u53cc\u81c2\u7075\u5de7\u64cd\u4f5c\u4e2d\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u63d0\u5347\u6700\u9ad8 2-7 \u500d\u4e14\u63a8\u7406\u66f4\u5feb\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10860", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10860v1", "published_at": "2026-08-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Flex-$\u03c0$: A Multi-Stream World-Action Model with Compute Flexibility", "tldr": "\u672c\u6587\u63d0\u51fa Flex-\u03c0\uff0c\u4e00\u4e2a 6B \u53c2\u6570\u7684\u591a\u6d41\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u5c06 RGB\u30013D \u51e0\u4f55\u70b9\u56fe\u548c DINO \u7269\u4f53\u8bed\u4e49\u6295\u5c04\u5230\u540c\u4e00\u51bb\u7ed3\u89c6\u9891 VAE \u6f5c\u7a7a\u95f4\u4e2d\uff0c\u5e76\u4e0e\u52a8\u4f5c\u8054\u5408\u53bb\u566a\u5efa\u6a21\u3002\u901a\u8fc7\u591a\u6d41 dropout \u548c\u8de8\u6a21\u6001\u5f3a\u5236\uff0c\u4e00\u4e2a\u6a21\u578b\u53ef\u5728\u4ec5\u52a8\u4f5c\u5230\u5b8c\u6574\u591a\u6a21\u6001\u751f\u6210\u7684\u4e0d\u540c\u8ba1\u7b97\u9884\u7b97\u4e0b\u8fd0\u884c\uff0c\u5728\u771f\u5b9e\u53cc\u81c2\u7075\u5de7\u64cd\u4f5c\u4e2d\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u63d0\u5347\u6700\u9ad8 2-7 \u500d\u4e14\u63a8\u7406\u66f4\u5feb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models can describe an image with remarkable accuracy, yet a more fundamental question remains unanswered: what visual information actually drives their answers? In this work, we investigate this question through causal tracing, and we observe that highly causal vision tokens often lie outside the target region. Extending the analysis to larger vision-language models reveals a similar pattern across models and corruption settings, suggesting that strong multimodal performance does not necessarily imply spatially localized causal representations. We further investigate: can these models preserve visual structure when appearance cues are removed? and find that visual cues are exploited to understand visual structures. Together, our experiments expose a gap between seeing, using, and reasoning over visual structure, and provide a causal framework for studying how visual information is transformed, preserved, and ultimately used by modern vision-language models.", "arxiv_id": "2608.10758", "arxiv_url": "https://arxiv.org/abs/2608.10758", "authors": ["Naren Kumar S", "Tirth Bhatt", "Mayank Singh"], "brief": "\u672c\u6587\u7528\u56e0\u679c\u8ffd\u8e2a\u5206\u6790\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u54ea\u4e9b\u89c6\u89c9 token \u771f\u6b63\u5f71\u54cd\u56de\u7b54\uff0c\u53d1\u73b0\u9ad8\u56e0\u679c\u6027\u7684\u89c6\u89c9\u4fe1\u606f\u5e38\u5e38\u4e0d\u5728\u76ee\u6807\u533a\u57df\u5185\u3002\u8be5\u73b0\u8c61\u5728\u66f4\u5927\u6a21\u578b\u548c\u4e0d\u540c\u6270\u52a8\u8bbe\u7f6e\u4e0b\u4e5f\u5b58\u5728\uff0c\u8bf4\u660e\u5f3a\u591a\u6a21\u6001\u6027\u80fd\u5e76\u4e0d\u7b49\u540c\u4e8e\u7a7a\u95f4\u4e0a\u5c40\u90e8\u4e14\u53ef\u9760\u7684\u89c6\u89c9\u7ed3\u6784\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10758", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u56e0\u679c\u5206\u6790", "\u591a\u6a21\u6001", "\u89c6\u89c9\u8868\u5f81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10758v1", "published_at": "2026-08-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Where To Look? : Causal Tracing of Vision Encoders in VLM", "tldr": "\u672c\u6587\u7528\u56e0\u679c\u8ffd\u8e2a\u5206\u6790\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u54ea\u4e9b\u89c6\u89c9 token \u771f\u6b63\u5f71\u54cd\u56de\u7b54\uff0c\u53d1\u73b0\u9ad8\u56e0\u679c\u6027\u7684\u89c6\u89c9\u4fe1\u606f\u5e38\u5e38\u4e0d\u5728\u76ee\u6807\u533a\u57df\u5185\u3002\u8be5\u73b0\u8c61\u5728\u66f4\u5927\u6a21\u578b\u548c\u4e0d\u540c\u6270\u52a8\u8bbe\u7f6e\u4e0b\u4e5f\u5b58\u5728\uff0c\u8bf4\u660e\u5f3a\u591a\u6a21\u6001\u6027\u80fd\u5e76\u4e0d\u7b49\u540c\u4e8e\u7a7a\u95f4\u4e0a\u5c40\u90e8\u4e14\u53ef\u9760\u7684\u89c6\u89c9\u7ed3\u6784\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Embodied mobile manipulation requires language, visual observations, three-dimensional scene structure, and action feasibility to be aligned before execution. We study open-vocabulary target grounding with few-shot manipulation in local household workspaces and present an embodied multimodal grounding framework that integrates active multi-view Semantic 3D Gaussian Splatting (Semantic-3DGS), reachability-aware base positioning, and a diffusion-based vision-language-action policy. A task-driven local Semantic-3DGS serves as a shared interface across active sensing, language-conditioned 3D localization, obstacle-aware scene reasoning, base preparation, and semantic conditioning of the action model. To preserve pretrained action priors, the 3D semantic cues are injected only into the late action-expert blocks. In expanded 50-trial real-robot evaluations against representative vision-language-action (VLA) approaches, the full system achieves 60% long-horizon success compared with 40% for PointVLA and 28% for DexVLA, and reaches 74% success in heavily cluttered manipulation compared with 52% for the single-view variant and 46% for PointVLA. It also maintains 75% success under a 75 cm height shift and eliminates photo-induced false grasps. These results indicate that explicit, refreshable 3D semantic grounding can improve robustness under clutter, occlusion, viewpoint variation, and embodiment constraints.", "arxiv_id": "2608.10756", "arxiv_url": "https://arxiv.org/abs/2608.10756", "authors": ["Huosen Ou", "Dongni Song", "Yuncong Wang", "Tao Zhou", "Yiding Ji"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u5f00\u653e\u8bcd\u6c47\u79fb\u52a8\u64cd\u4f5c\u7684\u5177\u8eab\u591a\u6a21\u6001 grounding \u6846\u67b6\uff0c\u5c06\u4e3b\u52a8\u591a\u89c6\u89d2\u8bed\u4e49 3D Gaussian Splatting\u3001\u53ef\u8fbe\u6027\u5e95\u76d8\u5b9a\u4f4d\u548c\u6269\u6563\u5f0f\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u7ed3\u5408\u8d77\u6765\u3002\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\uff0c\u7cfb\u7edf\u5728\u957f\u7a0b\u4efb\u52a1\u548c\u91cd\u5ea6\u6742\u4e71\u573a\u666f\u4e0b\u663e\u8457\u4f18\u4e8e PointVLA\u3001DexVLA \u7b49\u65b9\u6cd5\uff0c\u5e76\u63d0\u5347\u4e86\u906e\u6321\u3001\u89c6\u89d2\u53d8\u5316\u548c\u4f4d\u7f6e\u7ea6\u675f\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10756", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u79fb\u52a8\u64cd\u4f5c", "\u591a\u6a21\u6001", "3D\u9ad8\u65af\u6e85\u5c04"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10756v1", "published_at": "2026-08-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Embodied Multimodal Grounding for Open-Vocabulary Mobile Manipulation via Semantic 3D Gaussian Splatting", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u5f00\u653e\u8bcd\u6c47\u79fb\u52a8\u64cd\u4f5c\u7684\u5177\u8eab\u591a\u6a21\u6001 grounding \u6846\u67b6\uff0c\u5c06\u4e3b\u52a8\u591a\u89c6\u89d2\u8bed\u4e49 3D Gaussian Splatting\u3001\u53ef\u8fbe\u6027\u5e95\u76d8\u5b9a\u4f4d\u548c\u6269\u6563\u5f0f\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u7ed3\u5408\u8d77\u6765\u3002\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\uff0c\u7cfb\u7edf\u5728\u957f\u7a0b\u4efb\u52a1\u548c\u91cd\u5ea6\u6742\u4e71\u573a\u666f\u4e0b\u663e\u8457\u4f18\u4e8e PointVLA\u3001DexVLA \u7b49\u65b9\u6cd5\uff0c\u5e76\u63d0\u5347\u4e86\u906e\u6321\u3001\u89c6\u89d2\u53d8\u5316\u548c\u4f4d\u7f6e\u7ea6\u675f\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) often rely on shortcuts rather than systematic reasoning, raising safety concerns in medical applications. Allowing models to abstain when uncertain improves reliability but introduces a coverage accuracy tradeoff. We propose a two-stage framework for medical hypothesis verification in multiple-choice settings that manages this tradeoff through targeted ontology grounding, applied only when the model abstains. We show that abstention is not random but reflects genuine uncertainty, with abstained predictions associated with lower confidence. Across two frontier models (GPT-5.5, accessed via the Azure OpenAI API, and DeepSeek-R1), the proposed framework improves question-level accuracy by 9.6 percentage points (82.9% to 92.5%) and hypothesis-level accuracy by 4.2 percentage points (92.0% to 96.2%). Our experiments conducted on MedReason and MedQA show that abstention can be repurposed as a control signal for selective reasoning refinement, achieving knowledge-graph-level performance without explicit knowledge graph construction.", "arxiv_id": "2608.10725", "arxiv_url": "https://arxiv.org/abs/2608.10725", "authors": ["Uma Ranjan", "Kunal Tilaganji", "Aditya Koul", "Anurag Mahipal", "Dashpreet Singh", "Hriday Rana", "Manan Jain", "Sidharth Gupta", "Ajo Babu George", "Vineeth Balasubramanian", "Nagarajan Natarajan", "Amit Sharma"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4e24\u9636\u6bb5\u533b\u7597\u5047\u8bbe\u9a8c\u8bc1\u6846\u67b6\uff1a\u5f53\u5927\u8bed\u8a00\u6a21\u578b\u9009\u62e9\u201c abstain/\u62d2\u7b54\u201d\u65f6\uff0c\u624d\u89e6\u53d1\u6709\u9488\u5bf9\u6027\u7684\u672c\u4f53 grounding \u6765\u8fdb\u884c\u9009\u62e9\u6027\u63a8\u7406\u7ec6\u5316\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u62d2\u7b54\u786e\u5b9e\u5bf9\u5e94\u66f4\u9ad8\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u53ef\u4f5c\u4e3a\u63a7\u5236\u4fe1\u53f7\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5728 MedReason \u548c MedQA \u4e0a\u5c06\u9898\u76ee\u7ea7\u51c6\u786e\u7387\u4ece 82.9% \u63d0\u5347\u5230 92.5%\uff0c\u5047\u8bbe\u7ea7\u51c6\u786e\u7387\u4ece 92.0% \u63d0\u5347\u5230 96.2%\u3002", "categories": ["cs.CV", "cs.SC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10725", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u533b\u7597\u63a8\u7406", "\u4e0d\u786e\u5b9a\u6027", "\u77e5\u8bc6\u56fe\u8c31"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10725v1", "published_at": "2026-08-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rethinking LLM Verification: Evidence Structure, Uncertainty, and Selective Refinement", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4e24\u9636\u6bb5\u533b\u7597\u5047\u8bbe\u9a8c\u8bc1\u6846\u67b6\uff1a\u5f53\u5927\u8bed\u8a00\u6a21\u578b\u9009\u62e9\u201c abstain/\u62d2\u7b54\u201d\u65f6\uff0c\u624d\u89e6\u53d1\u6709\u9488\u5bf9\u6027\u7684\u672c\u4f53 grounding \u6765\u8fdb\u884c\u9009\u62e9\u6027\u63a8\u7406\u7ec6\u5316\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u62d2\u7b54\u786e\u5b9e\u5bf9\u5e94\u66f4\u9ad8\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u53ef\u4f5c\u4e3a\u63a7\u5236\u4fe1\u53f7\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5728 MedReason \u548c MedQA \u4e0a\u5c06\u9898\u76ee\u7ea7\u51c6\u786e\u7387\u4ece 82.9% \u63d0\u5347\u5230 92.5%\uff0c\u5047\u8bbe\u7ea7\u51c6\u786e\u7387\u4ece 92.0% \u63d0\u5347\u5230 96.2%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Professionals across medicine, engineering, finance, manufacturing, and the sciences often make consequential decisions from charts. Existing chart benchmarks do not sufficiently measure this ability: they are dominated by bar, line, and pie formats, rely on shorter reasoning chains, and are nearing saturation, with frontier models already scoring 80-90%. We introduce Chartography, a benchmark of 100 tasks that pair charts drawn from professional practice, in domain-specific formats that standard chart benchmarks rarely include, with questions written by professionals who read these charts for a living and independently verified by three additional experts. In an evaluation of 30 frontier-model configurations (20 scored trials per task), the best configuration reaches only 45.0% mean pass@1; the remainder span 9.0-39.5%. Failures concentrate in visual perception: models can miss nuanced features, misread values along sparsely labeled axes, mishandle projected 3D geometry, and violate domain conventions encoded in the chart. We release all tasks, images, provenance metadata, and evaluation code.", "arxiv_id": "2608.10677", "arxiv_url": "https://arxiv.org/abs/2608.10677", "authors": ["Suhaas Garre", "Chris Mutty", "Sushant Mehta", "Edwin Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Chartography\uff0c\u4e00\u4e2a\u9762\u5411\u4e13\u4e1a\u56fe\u8868\u7406\u89e3\u7684\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea\u533b\u5b66\u3001\u5de5\u7a0b\u3001\u91d1\u878d\u3001\u5236\u9020\u548c\u79d1\u5b66\u7b49\u771f\u5b9e\u4e13\u4e1a\u573a\u666f\u7684100\u4e2a\u4efb\u52a1\uff0c\u5e76\u7531\u9886\u57df\u4e13\u4e1a\u4eba\u58eb\u51fa\u9898\u4e0e\u9a8c\u8bc1\u300230\u79cd\u524d\u6cbf\u6a21\u578b\u914d\u7f6e\u4e2d\u6700\u4f73\u4ec5\u8fbe\u523045.0% pass@1\uff0c\u663e\u793a\u5f53\u524d\u6a21\u578b\u5728\u7ec6\u7c92\u5ea6\u89c6\u89c9\u611f\u77e5\u3001\u7a00\u758f\u5750\u6807\u8f74\u8bfb\u6570\u30013D\u51e0\u4f55\u548c\u9886\u57df\u7ea6\u5b9a\u7406\u89e3\u4e0a\u4ecd\u6709\u660e\u663e\u77ed\u677f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10677", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u8868\u7406\u89e3", "\u89c6\u89c9\u95ee\u7b54", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10677v1", "published_at": "2026-08-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Chartography: A Benchmark for Professional Chart Understanding", "tldr": "\u8bba\u6587\u63d0\u51fa Chartography\uff0c\u4e00\u4e2a\u9762\u5411\u4e13\u4e1a\u56fe\u8868\u7406\u89e3\u7684\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea\u533b\u5b66\u3001\u5de5\u7a0b\u3001\u91d1\u878d\u3001\u5236\u9020\u548c\u79d1\u5b66\u7b49\u771f\u5b9e\u4e13\u4e1a\u573a\u666f\u7684100\u4e2a\u4efb\u52a1\uff0c\u5e76\u7531\u9886\u57df\u4e13\u4e1a\u4eba\u58eb\u51fa\u9898\u4e0e\u9a8c\u8bc1\u300230\u79cd\u524d\u6cbf\u6a21\u578b\u914d\u7f6e\u4e2d\u6700\u4f73\u4ec5\u8fbe\u523045.0% pass@1\uff0c\u663e\u793a\u5f53\u524d\u6a21\u578b\u5728\u7ec6\u7c92\u5ea6\u89c6\u89c9\u611f\u77e5\u3001\u7a00\u758f\u5750\u6807\u8f74\u8bfb\u6570\u30013D\u51e0\u4f55\u548c\u9886\u57df\u7ea6\u5b9a\u7406\u89e3\u4e0a\u4ecd\u6709\u660e\u663e\u77ed\u677f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming video generation holds strong potential for world modeling, where future frames must be inferred online sequentially to form a continuous video stream. However, streaming video diffusion models introduce a fundamental train-inference mismatch: inference follows a specialized denoising order, whereas advanced training strategies typically require diverse noise-level configurations. To address this trade-off between train-inference consistency and training coverage, we reformulate the video diffusion sampling as a frame-indexed stochastic process over noise levels. Within this stochastic process space, we construct a continuous training trajectory along which the sampling schedule progressively evolves from independent sampling to inference-consistent sampling. We further introduce a joint calibration algorithm and a temporal correlative sampling algorithm to ensure trajectory smoothness and cross-frame correlation. Building on these designs, we propose Stream Forcing, a unified training framework for streaming video generation that balances training sufficiency and inference efficiency. Extensive experiments demonstrate that Stream Forcing significantly improves generation quality with a 36.6% FVD improvement on the UCF-101 benchmark. Furthermore, our method facilitates robust zero-shot extrapolation to long-horizon video generation with a 27.9% FVD improvement on the u8d85\u8fc7\u5df2\u6709\u65b9\u6cd5\uff0c\u4e14\u989d\u5916\u5ef6\u8fdf\u8f83\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
