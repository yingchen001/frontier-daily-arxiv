5f3a\u5316\u81ea\u9002\u5e94\u5de5\u5177\u8c03\u7528\u4e0e\u5fc5\u8981\u65f6\u53cd\u601d\u7ea0\u9519\u7684\u80fd\u529b\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25559v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AdaVDR: Adaptive Tool Use and Reflection for Video Deep Research", "tldr": "\u81ea\u9002\u5e94\u5de5\u5177\u8c03\u7528\u63d0\u5347\u89c6\u9891\u6df1\u5ea6\u7814\u7a76", "upvotes": 0, "what_it_is": "AdaVDR \u662f\u4e00\u4e2a\u9762\u5411\u590d\u6742\u89c6\u9891\u95ee\u7b54\u7684\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u53ef\u6839\u636e\u95ee\u9898\u3001\u89c6\u9891\u5185\u5bb9\u548c\u6a21\u578b\u80fd\u529b\u81ea\u9002\u5e94\u9009\u62e9\u7f51\u9875\u68c0\u7d22\u3001\u5b9a\u4f4d\u7b49\u5de5\u5177\uff0c\u5e76\u5728\u4e2d\u95f4\u7ed3\u679c\u4e0d\u53ef\u9760\u65f6\u8fdb\u884c\u53cd\u601d\u56de\u6eaf\u3002\u8bba\u6587\u8fd8\u6784\u5efa\u4e86\u6570\u636e\u751f\u6210\u6d41\u6c34\u7ebf\u4e0e VDR-EE \u57fa\u51c6\uff0c\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u6d4b\u5b9e\u4f53/\u4e8b\u4ef6\u4e2d\u5fc3\u7684\u89c6\u9891\u6df1\u5ea6\u7814\u7a76\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u89c6\u9891\u95ee\u7b54\u4e2d\u5de5\u5177\u8c03\u7528\u8fc7\u591a\u3001\u68c0\u7d22\u4e0d\u51c6\u548c\u63a8\u7406\u5ef6\u8fdf\u9ad8\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u6309\u6a21\u578b\u80fd\u529b\u5b9a\u5236\u5de5\u5177\u8f68\u8ff9\u7684\u8bad\u7ec3\u8303\u5f0f\uff0c\u5bf9\u89c6\u9891\u667a\u80fd\u4f53\u3001\u5f00\u653e\u7f51\u9875\u68c0\u7d22\u589e\u5f3a\u95ee\u7b54\u548c\u591a\u6a21\u6001\u6df1\u5ea6\u7814\u7a76\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A common strategy for scaling world models is to train on more crawled video with more compute. We argue that this strategy is inefficient: scaling world models also requires a recursive data engine that offers grounded reward signals. The success of code agents illustrates why this matters. As code is executable, compilers and runtimes can provide high-quality rewards for Reinforcement Learning (RL) post-training of LLMs. By contrast, spatial generation still relies largely on fuzzy proxies such as CLIP scores. These signals are fuzzy and biased, making them hard to support RL post-training. Compared with these, game development provides a missing reward environment for spatial world models. A scene encoded by a game engine is an executable world specification: the engine can efficiently check collision, physics, navigability and bounded playability, while the developer provides the global verification signal by judging whether the scene should be accepted. Game development also provides real-world long-horizon trajectory data for RL post-training. We therefore propose Reinforcement Learning with Human-Engine Verification (RLHEV), a post-training paradigm that combines dense engine signals with implicit human acceptance feedback from the development process.", "arxiv_id": "2608.25518", "arxiv_url": "https://arxiv.org/abs/2608.25518", "authors": ["Pengfei Zhou", "Hexin Wang", "Zhengfeiyang Zhang", "Yixing Ma", "Zhenglin Wan", "Kaipeng Zhang", "Wangbo Zhao", "Yang You"], "brief": "\u8bba\u6587\u63d0\u51fa\u5c06\u667a\u80fd\u4f53\u5f0f\u6e38\u620f\u5f00\u53d1\u4f5c\u4e3a\u4e16\u754c\u6a21\u578b\u7684\u6570\u636e\u5f15\u64ce\uff0c\u5e76\u63d0\u51fa RLHEV \u8303\u5f0f\uff1a\u7ed3\u5408\u6e38\u620f\u5f15\u64ce\u7684\u5bc6\u96c6\u53ef\u9a8c\u8bc1\u4fe1\u53f7\u4e0e\u5f00\u53d1\u8005\u63a5\u53d7\u53cd\u9988\uff0c\u7528\u4e8e\u4e16\u754c\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25518", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u5355\u7eaf\u4f9d\u8d56\u722c\u53d6\u89c6\u9891\u548c\u7b97\u529b\u6269\u5c55\u4e16\u754c\u6a21\u578b\u6548\u7387\u4f4e\uff0c\u7f3a\u5c11\u7c7b\u4f3c\u4ee3\u7801\u6267\u884c\u53cd\u9988\u7684\u53ef\u9760\u5956\u52b1\u4fe1\u53f7", "\u6e38\u620f\u5f15\u64ce\u53ef\u5bf9\u573a\u666f\u8fdb\u884c\u78b0\u649e\u3001\u7269\u7406\u3001\u53ef\u5bfc\u822a\u6027\u548c\u53ef\u73a9\u6027\u7b49\u53ef\u6267\u884c\u9a8c\u8bc1\uff0c\u63d0\u4f9b\u6bd4 CLIP \u5206\u6570\u66f4 grounded \u7684\u5956\u52b1", "\u6e38\u620f\u5f00\u53d1\u8fc7\u7a0b\u5929\u7136\u4ea7\u751f\u957f\u65f6\u7a0b\u8f68\u8ff9\u6570\u636e\uff0c\u5e76\u53ef\u901a\u8fc7\u4eba\u7c7b\u5f00\u53d1\u8005\u7684\u63a5\u53d7/\u62d2\u7edd\u5f62\u6210\u5168\u5c40\u9a8c\u8bc1\u4fe1\u53f7"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6e38\u620f\u5f00\u53d1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25518v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models", "tldr": "\u7528\u6e38\u620f\u5f00\u53d1\u9a8c\u8bc1\u4fe1\u53f7\u6269\u5c55\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5c06\u667a\u80fd\u4f53\u5f0f\u6e38\u620f\u5f00\u53d1\u4f5c\u4e3a\u4e16\u754c\u6a21\u578b\u7684\u6570\u636e\u5f15\u64ce\uff0c\u5e76\u63d0\u51fa RLHEV \u8303\u5f0f\uff1a\u7ed3\u5408\u6e38\u620f\u5f15\u64ce\u7684\u5bc6\u96c6\u53ef\u9a8c\u8bc1\u4fe1\u53f7\u4e0e\u5f00\u53d1\u8005\u63a5\u53d7\u53cd\u9988\uff0c\u7528\u4e8e\u4e16\u754c\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6e38\u620f\u5f15\u64ce\u89c6\u4e3a\u53ef\u6267\u884c\u4e16\u754c\u89c4\u8303\uff0c\u4e3a\u7a7a\u95f4\u4e16\u754c\u6a21\u578b\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u5956\u52b1\u73af\u5883\uff0c\u53ef\u80fd\u7f13\u89e3\u751f\u6210\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u5956\u52b1\u6a21\u7cca\u3001\u504f\u7f6e\u548c\u96be\u4ee5\u6269\u5c55\u7684\u95ee\u9898\u3002"}, {"abstract": "Despite their strong ability to generate code, large language models often fail to produce secure code, as their outputs frequently contain security vulnerabilities. Secure code generation is inherently challenging because it requires solving a multi-objective problem: functional correctness and security. Existing approaches address this challenge by injecting external security knowledge or by using agentic feedback and iterative refinement. However, guideline retrieval often leaves the generator to translate generic advice into task-specific secure implementations, while shared-dialogue multi-agent feedback can blur role boundaries and suffer from context bloat. We present MACGen, a multi-agent framework that integrates planning, security analysis, code synthesis and refinement to jointly optimize security and functionality. A planner constructs a step-by-step plan to satisfy functional requirements. A security advisor identifies likely CWEs and synthesizes task-specific guidelines, a coder then generates code grounded in these artifacts, and a reviewer issues perspective-separated feedback. Rather than sharing full dialogue histories, each agent receives only structured artifacts from upstream stages, enforcing role specialization and reducing uncontrolled context growth. On CWEval and BaxBench, MACGen improves F\u0026S@1 over direct prompting by 19.61 and 10.57 percentage points (pp) on average, respectively.", "arxiv_id": "2608.25457", "arxiv_url": "https://arxiv.org/abs/2608.25457", "authors": ["Miseon Yu", "Jaehoon Choi", "Younghan Lee", "Yunheung Paek"], "brief": "\u672c\u6587\u63d0\u51fa MACGen\uff0c\u4e00\u4e2a\u9762\u5411\u5b89\u5168\u4ee3\u7801\u751f\u6210\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u89c4\u5212\u3001\u5b89\u5168\u5206\u6790\u3001\u4ee3\u7801\u5408\u6210\u4e0e\u5ba1\u67e5\u7ec6\u5206\u7ed9\u4e0d\u540c\u89d2\u8272\uff0c\u8054\u5408\u4f18\u5316\u529f\u80fd\u6b63\u786e\u6027\u4e0e\u5b89\u5168\u6027\u3002", "categories": ["cs.CR", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25457", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u89c4\u5212\u5668\u5148\u751f\u6210\u6ee1\u8db3\u529f\u80fd\u9700\u6c42\u7684\u5206\u6b65\u8ba1\u5212\uff0c\u5b89\u5168\u987e\u95ee\u8bc6\u522b\u6f5c\u5728 CWE \u5e76\u751f\u6210\u4efb\u52a1\u7279\u5b9a\u5b89\u5168\u6307\u5357\u3002", "\u7f16\u7801\u5668\u57fa\u4e8e\u8ba1\u5212\u4e0e\u5b89\u5168\u6307\u5357\u751f\u6210\u4ee3\u7801\uff0c\u5ba1\u67e5\u5668\u63d0\u4f9b\u6309\u89c6\u89d2\u5206\u79bb\u7684\u53cd\u9988\u4ee5\u652f\u6301\u7cbe\u70bc\u3002", "\u4e0d\u540c\u667a\u80fd\u4f53\u53ea\u63a5\u6536\u4e0a\u6e38\u7ed3\u6784\u5316\u4ea7\u7269\u800c\u975e\u5b8c\u6574\u5bf9\u8bdd\u5386\u53f2\uff0c\u5f3a\u5316\u89d2\u8272\u5206\u5de5\u5e76\u51cf\u5c11\u4e0a\u4e0b\u6587\u81a8\u80c0\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5b89\u5168", "\u591a\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25457v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MACGen: Toward Functionally Correct and Secure Code Generation via Multi-Agent Collaboration", "tldr": "\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u63d0\u5347\u4ee3\u7801\u529f\u80fd\u6b63\u786e\u6027\u4e0e\u5b89\u5168\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa MACGen\uff0c\u4e00\u4e2a\u9762\u5411\u5b89\u5168\u4ee3\u7801\u751f\u6210\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u89c4\u5212\u3001\u5b89\u5168\u5206\u6790\u3001\u4ee3\u7801\u5408\u6210\u4e0e\u5ba1\u67e5\u7ec6\u5206\u7ed9\u4e0d\u540c\u89d2\u8272\uff0c\u8054\u5408\u4f18\u5316\u529f\u80fd\u6b63\u786e\u6027\u4e0e\u5b89\u5168\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u5b89\u5168\u4ee3\u7801\u751f\u6210\u4e2d\u7684\u201c\u529f\u80fd\u6b63\u786e+\u5b89\u5168\u201d\u53cc\u76ee\u6807\u96be\u9898\uff0c\u901a\u8fc7\u7ed3\u6784\u5316\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u51cf\u5c11\u6cdb\u5316\u5b89\u5168\u5efa\u8bae\u96be\u843d\u5730\u3001\u5171\u4eab\u5bf9\u8bdd\u6613\u6df7\u4e71\u7684\u95ee\u9898\uff1b\u5728 CWEval \u548c BaxBench \u4e0a\u76f8\u8f83\u76f4\u63a5\u63d0\u793a\u663e\u8457\u63d0\u5347 F\u0026S@1\uff0c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Hardware kernel optimization requires repeated compilation, correctness testing, profiling, and revision. LLM agents can automate parts of this process, and stronger foundation models, longer context windows, and longer execution horizons have improved optimization within individual tasks. These advances alone do not enable an agent to learn from completed optimization runs. Existing kernel-optimization agents seldom preserve a decision, its observed execution feedback, and the later decisions that use that evidence. Retaining every prior trajectory is also impractical because an expanding history competes with the current task for context. We present KOPE, an experience-driven framework for hardware kernel optimization. KOPE records optimization trajectories with correctness and performance feedback in Experience Graph Memory, then uses Active Context Management and Injection to retrieve relevant experience under a fixed token budget. The graph retains decision order, observed outcomes, and alternative branches, allowing evidence collected on the target hardware to inform later optimization steps and tasks. Under the same GLM-5.2 setting, the geometric mean of KOPE\u0027s per-operator speedups is $1.54\\times$ that of CANNBot, the strongest competing baseline. In a complete 53-operator ablation, Active Context Management and Injection raises pass rate from 60.0\\% to 84.6\\%, increases the evaluator-reported positive-field geometric mean from 0.0382 to 0.0661, and reduces optimization token consumption from 15.9B to 1.113B tokens relative to passive agent-led context construction. Enabling Experience Graph Memory raises full-suite pass rate from 55.2\\% to 84.6\\% and yields a $1.43\\times$ geometric-mean speedup on valid timing comparisons. These results support continual optimization through external experience while the foundation model remains fixed.", "arxiv_id": "2608.25570", "arxiv_url": "https://arxiv.org/abs/2608.25570", "authors": ["Siyuan Chen", "Runlin Hou", "Shenxiu Wu", "Yansong Sun", "Junming Cao", "Yiyu Zhang", "Shudi Shao", "Junhao Qiu", "Zhichao Lu", "Qingfu Zhang"], "brief": "\u672c\u6587\u63d0\u51fa KOPE\uff0c\u4e00\u4e2a\u7528\u4e8e\u786c\u4ef6\u7b97\u5b50/\u5185\u6838\u4f18\u5316\u7684\u81ea\u8fdb\u5316 LLM \u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u7ecf\u9a8c\u56fe\u8bb0\u5fc6\u4fdd\u5b58\u4f18\u5316\u51b3\u7b56\u3001\u7f16\u8bd1\u6d4b\u8bd5\u53cd\u9988\u548c\u540e\u7eed\u5206\u652f\uff0c\u5e76\u5728\u56fa\u5b9a\u4e0a\u4e0b\u6587\u9884\u7b97\u4e0b\u4e3b\u52a8\u68c0\u7d22\u6ce8\u5165\u76f8\u5173\u7ecf\u9a8c\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u76f8\u540c GLM-5.2 \u8bbe\u7f6e\u4e0b\uff0cKOPE \u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf CANNBot \u7684\u7b97\u5b50\u52a0\u901f\u51e0\u4f55\u5747\u503c\u63d0\u5347\u5230 1.54 \u500d\uff1b\u7ecf\u9a8c\u7ba1\u7406\u8fd8\u663e\u8457\u63d0\u9ad8\u901a\u8fc7\u7387\u5e76\u5927\u5e45\u964d\u4f4e token \u6d88\u8017\u3002", "categories": ["cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25570", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u786c\u4ef6\u4f18\u5316", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25570v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Scaling: Self-Evolving LLM Agents for Hardware Kernel Optimization via an Experience-Driven Workflow and Experience Graph Memory", "tldr": "\u672c\u6587\u63d0\u51fa KOPE\uff0c\u4e00\u4e2a\u7528\u4e8e\u786c\u4ef6\u7b97\u5b50/\u5185\u6838\u4f18\u5316\u7684\u81ea\u8fdb\u5316 LLM \u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u7ecf\u9a8c\u56fe\u8bb0\u5fc6\u4fdd\u5b58\u4f18\u5316\u51b3\u7b56\u3001\u7f16\u8bd1\u6d4b\u8bd5\u53cd\u9988\u548c\u540e\u7eed\u5206\u652f\uff0c\u5e76\u5728\u56fa\u5b9a\u4e0a\u4e0b\u6587\u9884\u7b97\u4e0b\u4e3b\u52a8\u68c0\u7d22\u6ce8\u5165\u76f8\u5173\u7ecf\u9a8c\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u76f8\u540c GLM-5.2 \u8bbe\u7f6e\u4e0b\uff0cKOPE \u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf CANNBot \u7684\u7b97\u5b50\u52a0\u901f\u51e0\u4f55\u5747\u503c\u63d0\u5347\u5230 1.54 \u500d\uff1b\u7ecf\u9a8c\u7ba1\u7406\u8fd8\u663e\u8457\u63d0\u9ad8\u901a\u8fc7\u7387\u5e76\u5927\u5e45\u964d\u4f4e token \u6d88\u8017\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Civil infrastructure compliance checking has long relied on engineers manually reading legacy 2D plans; however, OCR-based automation strips away the geometry and layout essential for interpreting these plans. We present a Visual-First Multimodal Retrieval-Augmented Generation (RAG) framework called PlanSightRAG. It indexes and reasons directly over plan imagery, integrates a ColNomic-3B multi-vector retrieval, an agentic Planner-Retriever-Auditor-Synthesizer, and MaxSim heatmaps as an evidence trail. We introduce a 4,056-pair benchmark from five state Departments of Transportation (DOT) standard plans (1,898 pages). PlanSightRAG achieves 91.47% Recall@5 on zero-shot retrieval, while on a held-out Michigan DOT corpus, it achieves 91.40%. On synthetic, parametrically-generated compliance drawings, our Qwen2.5-VL-72B pipeline reaches 100% verdict accuracy only when supplied a pre-resolved rule threshold, a controlled ceiling that a non-VLM OCR baseline already reaches at 76.4%. Finally, we demonstrate autonomous visual rule-grounding by extracting numeric limits directly from a specification corpus without any human-supplied rules.", "arxiv_id": "2608.26091", "arxiv_url": "https://arxiv.org/abs/2608.26091", "authors": ["Nabaraj Subedi", "Shuvo Dip Datta", "Ahmed Abdelaty", "Shivanand Venkanna Sheshappanavar"], "brief": "\u672c\u6587\u63d0\u51fa PlanSightRAG\uff0c\u4e00\u79cd\u9762\u5411\u571f\u6728\u6807\u51c6\u56fe\u7eb8\u7684\u89c6\u89c9\u4f18\u5148\u591a\u6a21\u6001 RAG\uff0c\u76f4\u63a5\u7d22\u5f15\u548c\u63a8\u7406\u5e73\u9762\u56fe\u50cf\uff0c\u5e76\u7ed3\u5408\u591a\u5411\u91cf\u68c0\u7d22\u3001\u667a\u80fd\u4f53\u5f0f\u89c4\u5212-\u68c0\u7d22-\u5ba1\u8ba1-\u751f\u6210\u6d41\u7a0b\u4e0e\u70ed\u529b\u56fe\u8bc1\u636e\u3002\u5176\u5728\u8de8\u5dde DOT \u6807\u51c6\u56fe\u68c0\u7d22\u4e0a\u8fbe\u5230\u7ea6 91% Recall@5\uff0c\u5e76\u5728\u5408\u6210\u5408\u89c4\u68c0\u67e5\u4e2d\u5c55\u793a\u4e86\u89c6\u89c9\u89c4\u5219\u843d\u5730\u4e0e\u81ea\u52a8\u5224\u5b9a\u80fd\u529b\u3002", "categories": ["cs.IR", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26091", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u667a\u80fd\u4f53", "\u6587\u6863\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26091v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PlanSightRAG: A Visual-First Multimodal RAG for Automating Question Answering and Compliance Checking for Civil Standard Plans", "tldr": "\u672c\u6587\u63d0\u51fa PlanSightRAG\uff0c\u4e00\u79cd\u9762\u5411\u571f\u6728\u6807\u51c6\u56fe\u7eb8\u7684\u89c6\u89c9\u4f18\u5148\u591a\u6a21\u6001 RAG\uff0c\u76f4\u63a5\u7d22\u5f15\u548c\u63a8\u7406\u5e73\u9762\u56fe\u50cf\uff0c\u5e76\u7ed3\u5408\u591a\u5411\u91cf\u68c0\u7d22\u3001\u667a\u80fd\u4f53\u5f0f\u89c4\u5212-\u68c0\u7d22-\u5ba1\u8ba1-\u751f\u6210\u6d41\u7a0b\u4e0e\u70ed\u529b\u56fe\u8bc1\u636e\u3002\u5176\u5728\u8de8\u5dde DOT \u6807\u51c6\u56fe\u68c0\u7d22\u4e0a\u8fbe\u5230\u7ea6 91% Recall@5\uff0c\u5e76\u5728\u5408\u6210\u5408\u89c4\u68c0\u67e5\u4e2d\u5c55\u793a\u4e86\u89c6\u89c9\u89c4\u5219\u843d\u5730\u4e0e\u81ea\u52a8\u5224\u5b9a\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal instruction-following models require training data that is accurate, diverse, verifiable, and challenging. Existing synthesis pipelines typically follow a one-pass generate-and-filter paradigm, discarding feedback from failed samples, verifier outcomes, and target-model errors. We present VISA (Visual Instruction Synthesis Agent), an agentic framework that reformulates multimodal instruction synthesis as a self-evolving loop. At each round, VISA analyzes an image to filter incompatible constraints and discover new verifiable ones, samples diversity- and difficulty-aware constraint sets from persistent memory, generates candidate instructions, and verifies the resulting samples with executable tools and structured large language model judges. Failed samples trigger diagnostic-guided recovery, while accepted samples are probed against the target model to estimate difficulty. The resulting verifier signals and target-model failure profiles are written back to memory, allowing subsequent rounds to adaptively expand the constraint space, reduce template repetition, and focus on unresolved model weaknesses. The same verifier contracts further provide reward signals for reinforcement learning without a separately trained reward model. Experiments on MM-IFEval show that VISA consistently improves multimodal instruction following over strong baselines, while preserving general multimodal capability across seven public benchmarks.", "arxiv_id": "2608.26013", "arxiv_url": "https://arxiv.org/abs/2608.26013", "authors": ["Min Zeng", "Guanxin Tan", "Libin Cen", "Yawei Wen", "Rui Hu", "Liuyang Bian", "Xiaolong Chen", "Xiaoxin Chen"], "brief": "VISA \u5c06\u591a\u6a21\u6001\u6307\u4ee4\u6570\u636e\u5408\u6210\u91cd\u6784\u4e3a\u5e26\u8bb0\u5fc6\u7684\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u5faa\u73af\uff0c\u5229\u7528\u56fe\u50cf\u7ea6\u675f\u53d1\u73b0\u3001\u5de5\u5177/LLM \u9a8c\u8bc1\u3001\u5931\u8d25\u8bca\u65ad\u6062\u590d\u548c\u76ee\u6807\u6a21\u578b\u9519\u8bef\u53cd\u9988\u6301\u7eed\u751f\u6210\u66f4\u96be\u4e14\u53ef\u9a8c\u8bc1\u7684\u6570\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 MM-IFEval \u4e0a\u7a33\u5b9a\u63d0\u5347\u591a\u6a21\u6001\u6307\u4ee4\u9075\u5faa\u80fd\u529b\uff0c\u5e76\u5728\u4e03\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u4fdd\u6301\u901a\u7528\u591a\u6a21\u6001\u6027\u80fd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26013", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u6570\u636e\u5408\u6210", "\u6307\u4ee4\u9075\u5faa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26013v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VISA: Agentic Self-Evolving Data Synthesis for Multimodal Instruction Following", "tldr": "VISA \u5c06\u591a\u6a21\u6001\u6307\u4ee4\u6570\u636e\u5408\u6210\u91cd\u6784\u4e3a\u5e26\u8bb0\u5fc6\u7684\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u5faa\u73af\uff0c\u5229\u7528\u56fe\u50cf\u7ea6\u675f\u53d1\u73b0\u3001\u5de5\u5177/LLM \u9a8c\u8bc1\u3001\u5931\u8d25\u8bca\u65ad\u6062\u590d\u548c\u76ee\u6807\u6a21\u578b\u9519\u8bef\u53cd\u9988\u6301\u7eed\u751f\u6210\u66f4\u96be\u4e14\u53ef\u9a8c\u8bc1\u7684\u6570\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 MM-IFEval \u4e0a\u7a33\u5b9a\u63d0\u5347\u591a\u6a21\u6001\u6307\u4ee4\u9075\u5faa\u80fd\u529b\uff0c\u5e76\u5728\u4e03\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u4fdd\u6301\u901a\u7528\u591a\u6a21\u6001\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific agents increasingly analyze data, execute code, and produce research artifacts, yet most benchmarks emphasize final answers, isolated programs, or a single domain. We introduce FrontierChallenge, a cross-domain benchmark comprising 300 end-to-end scientific workflows. In this paper, we release and evaluate 97 of these tasks, spanning quantum chemistry, molecular dynamics, materials characterization, analytical chemistry, life science, and electrochemistry/environment. Each task provides fixed inputs and specifies a bundle of required scientific deliverables. We evaluate twelve frontier models with three agent scaffolds. Pass Rate measures the fraction of tasks satisfying the full-completion criterion, while Avg. Score captures partial progress. Each of the best-performing configurations completed only 20 of the 97 released tasks, yielding a Pass Rate of 20.6%. Partial progress translated especially poorly into complete delivery in analytical chemistry and electrochemistry/environment: Avg. Scores reached 87.6 and 94.9, but the highest Pass Rates were only 4% and 0%. Among non-passing Claude Code trajectories, 75.5% still ended with language claiming completion. These findings show that neither high partial scores nor confident claims of completion reliably indicate that a scientific task has been fully delivered, highlighting the need to evaluate end-to-end workflow execution and the completeness of scientific deliverables together.", "arxiv_id": "2608.24979", "arxiv_url": "https://arxiv.org/abs/2608.24979", "authors": ["Liangcai Su", "Zhaopeng Feng", "Zhuo Chen", "Zhen Zhang", "Xiang Lin", "Ruilin Li", "Handuo Zhang", "Ning Wang", "Kailong Wen", "Yueqi Guo", "Feng Xing", "Yiling Guo", "Chenxiong Qian", "Simon Shaolei Du", "Lidong Bing", "Xinyu Wang"], "brief": "\u8bba\u6587\u63d0\u51fa FrontierChallenge\uff0c\u4e00\u4e2a\u8de8\u9886\u57df\u79d1\u5b66\u5de5\u4f5c\u6d41\u5b8c\u6210\u5ea6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u7aef\u5230\u7aef\u4efb\u52a1\u5e76\u8981\u6c42\u63d0\u4ea4\u6210\u5957\u79d1\u5b66\u4ea7\u7269\uff1b\u5f53\u524d\u53d1\u5e03\u5e76\u8bc4\u6d4b\u4e86\u5176\u4e2d 97 \u4e2a\u4efb\u52a1\u300212 \u4e2a\u524d\u6cbf\u6a21\u578b\u5728\u4e09\u79cd\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\u6700\u9ad8\u4ec5\u5b8c\u6210 20/97 \u4e2a\u4efb\u52a1\uff0c\u4e14\u9ad8\u90e8\u5206\u5f97\u5206\u548c\u6a21\u578b\u81ea\u79f0\u5b8c\u6210\u5e38\u5e38\u4e0d\u80fd\u4ee3\u8868\u771f\u6b63\u4ea4\u4ed8\u5b8c\u6574\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24979", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u5de5\u4f5c\u6d41", "\u57fa\u51c6\u8bc4\u6d4b", "\u4ee3\u7801\u6267\u884c"], "num_comments": 1, "on_hf": true, "organization": "Apodex", "pdf_url": "https://arxiv.org/pdf/2608.24979v1", "published_at": "2026-08-25", "score": 0.115, "selected_reasons": ["HF trending (68\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24979.png", "title": "FrontierChallenge: Evaluating Scientific Workflow Completion", "tldr": "\u8bba\u6587\u63d0\u51fa FrontierChallenge\uff0c\u4e00\u4e2a\u8de8\u9886\u57df\u79d1\u5b66\u5de5\u4f5c\u6d41\u5b8c\u6210\u5ea6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u7aef\u5230\u7aef\u4efb\u52a1\u5e76\u8981\u6c42\u63d0\u4ea4\u6210\u5957\u79d1\u5b66\u4ea7\u7269\uff1b\u5f53\u524d\u53d1\u5e03\u5e76\u8bc4\u6d4b\u4e86\u5176\u4e2d 97 \u4e2a\u4efb\u52a1\u300212 \u4e2a\u524d\u6cbf\u6a21\u578b\u5728\u4e09\u79cd\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\u6700\u9ad8\u4ec5\u5b8c\u6210 20/97 \u4e2a\u4efb\u52a1\uff0c\u4e14\u9ad8\u90e8\u5206\u5f97\u5206\u548c\u6a21\u578b\u81ea\u79f0\u5b8c\u6210\u5e38\u5e38\u4e0d\u80fd\u4ee3\u8868\u771f\u6b63\u4ea4\u4ed8\u5b8c\u6574\u7ed3\u679c\u3002", "upvotes": 68, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-teacher on-policy distillation (MOPD) distills several domain-expert teachers into a single student by minimizing per-domain reverse-KL divergence on the student\u0027s own rollouts. Existing approaches typically fix the per-domain data mixture before training, overlooking the fact that different domains converge at substantially different rates: some plateau early while others continue to improve throughout the training budget. A fixed mixture therefore wastes compute on fast-converging domains and undertrains slower-converging ones. To address this, we propose D$^3$-MOPD (Dynamic Domain ScheDuling for MOPD), a zero-overhead scheduler that repurposes the per-domain reverse-KL signal already produced during training to adapt the domain mixture online. Running asynchronously outside the training process, an off-process watcher periodically tracks each domain\u0027s KL trajectory, estimates remaining headroom and current improvement rate, and accordingly adjusts the domain sampling ratios without altering the core training loop. Our D$^3$-MOPD scales naturally to arbitrary numbers of domains, and the expected benefit grows as more domains introduce more diverse convergence patterns for the scheduler to exploit. On a Qwen3.6-35B-A3B student distilled from four domain-expert teachers, D$^3$-MOPD closes 97% of the average student-to-teacher performance gap, compared with 63% for vanilla MOPD, reaches the same peak performance with an approximately 3$\\times$ reduction in rollout steps, and surpasses the specialist teachers on three of seven benchmarks.", "arxiv_id": "2608.24987", "arxiv_url": "https://arxiv.org/abs/2608.24987", "authors": ["Zechen Sun", "Zhiwei Zhang", "Fei Zhao", "Juntao Li", "Mu Chuan", "Huayu Deng", "Guojian Zhan", "Wenliang Chen", "Yao Hu", "Min Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa D\u00b3-MOPD\uff0c\u4e00\u79cd\u7528\u4e8e\u591a\u6559\u5e08\u5728\u7ebf\u84b8\u998f\u7684\u52a8\u6001\u9886\u57df\u8c03\u5ea6\u65b9\u6cd5\uff0c\u5229\u7528\u8bad\u7ec3\u4e2d\u5df2\u6709\u7684\u5404\u9886\u57df reverse-KL \u8f68\u8ff9\u5728\u7ebf\u8c03\u6574\u9886\u57df\u91c7\u6837\u6bd4\u4f8b\uff0c\u907f\u514d\u56fa\u5b9a\u6570\u636e\u6df7\u5408\u5bfc\u81f4\u7684\u7b97\u529b\u6d6a\u8d39\u3002\u5b9e\u9a8c\u4e2d\u5728 Qwen3.6-35B-A3B \u5b66\u751f\u6a21\u578b\u4e0a\uff0c\u76f8\u6bd4\u666e\u901a MOPD \u66f4\u5145\u5206\u7f29\u5c0f\u5e08\u751f\u6027\u80fd\u5dee\u8ddd\uff0c\u5e76\u4ee5\u7ea6 3 \u500d\u66f4\u5c11 rollout \u6b65\u6570\u8fbe\u5230\u540c\u7b49\u5cf0\u503c\u6027\u80fd\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24987", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u591a\u6559\u5e08\u5b66\u4e60", "\u52a8\u6001\u8c03\u5ea6", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24987v1", "published_at": "2026-08-25", "score": 0.08, "selected_reasons": ["HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24987.png", "title": "D$^3$-MOPD: Adaptive Dynamic Domain ScheDuling for Efficient Multi-Teacher Distillation", "tldr": "\u8bba\u6587\u63d0\u51fa D\u00b3-MOPD\uff0c\u4e00\u79cd\u7528\u4e8e\u591a\u6559\u5e08\u5728\u7ebf\u84b8\u998f\u7684\u52a8\u6001\u9886\u57df\u8c03\u5ea6\u65b9\u6cd5\uff0c\u5229\u7528\u8bad\u7ec3\u4e2d\u5df2\u6709\u7684\u5404\u9886\u57df reverse-KL \u8f68\u8ff9\u5728\u7ebf\u8c03\u6574\u9886\u57df\u91c7\u6837\u6bd4\u4f8b\uff0c\u907f\u514d\u56fa\u5b9a\u6570\u636e\u6df7\u5408\u5bfc\u81f4\u7684\u7b97\u529b\u6d6a\u8d39\u3002\u5b9e\u9a8c\u4e2d\u5728 Qwen3.6-35B-A3B \u5b66\u751f\u6a21\u578b\u4e0a\uff0c\u76f8\u6bd4\u666e\u901a MOPD \u66f4\u5145\u5206\u7f29\u5c0f\u5e08\u751f\u6027\u80fd\u5dee\u8ddd\uff0c\u5e76\u4ee5\u7ea6 3 \u500d\u66f4\u5c11 rollout \u6b65\u6570\u8fbe\u5230\u540c\u7b49\u5cf0\u503c\u6027\u80fd\u3002", "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) models have demonstrated effectiveness in robot manipulation, yet state-of-the-art models such as pi0.5 operate under a single-frame paradigm, limiting their ability to retain past observations and develop precise spatial perception. In this paper, we propose StreamPI, a streaming multimodal temporal modeling framework that equips single-frame VLA with temporal reasoning capability without introducing any additional parameters. One core design is instruction-anchored temporal modeling. It treats each (visual observation, language instruction) pair as an atomic temporal unit: bidirectional attention within each pair enables cross-modal fusion, while causal attention across pairs preserves autoregressive streaming inference. This ensures the language instruction serves as a persistent semantic anchor throughout task execution. To bridge the gap between synchronous training and asynchronous real-robot deployment, we introduce a andom-interval streaming training strategy: a proper inter-frame interval (e.g., every 3 frames) enables faster and smoother action execution. Beyond this, randomizing the interval further improves robustness to frame-timing perturbations, supporting asynchronous deployment in practice. Furthermore, by leveraging the length extrapolation capability of the LLM backbone, StreamPI seamlessly inherits pretrained single-frame weights and supports flexible single-frame and multi-frame inference. Experiments on real-robot tasks spanning memory-dependent and precise perception scenarios, as well as the simulation benchmark LIBERO, demonstrate that StreamPI outperforms pi0.5 across diverse tasks.", "arxiv_id": "2608.26067", "arxiv_url": "https://arxiv.org/abs/2608.26067", "authors": ["Zhe Liu", "Jinghua Hou", "Yuxiang Lu", "Zhenya Yang", "Xianzhe Fan", "Junwei Luo", "Junyi Li", "Ruihua Han", "Zhi Hou", "Hengshuang Zhao"], "brief": "StreamPI \u4e3a\u5355\u5e27\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u52a0\u5165\u6d41\u5f0f\u591a\u6a21\u6001\u65f6\u5e8f\u5efa\u6a21\u80fd\u529b\uff0c\u4e14\u4e0d\u589e\u52a0\u989d\u5916\u53c2\u6570\u3002\u5b83\u901a\u8fc7\u4ee5\u6307\u4ee4\u4e3a\u951a\u7684\u65f6\u5e8f\u6ce8\u610f\u529b\u548c\u968f\u673a\u95f4\u9694\u6d41\u5f0f\u8bad\u7ec3\uff0c\u63d0\u5347\u771f\u5b9e\u673a\u5668\u4eba\u5f02\u6b65\u90e8\u7f72\u4e2d\u7684\u8bb0\u5fc6\u3001\u7a7a\u95f4\u611f\u77e5\u4e0e\u52a8\u4f5c\u5e73\u6ed1\u6027\uff0c\u5728\u771f\u5b9e\u4efb\u52a1\u548c LIBERO \u4eff\u771f\u4e2d\u4f18\u4e8e pi0.5\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/hku-sail/StreamPI", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.26067", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u65f6\u5e8f\u5efa\u6a21", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26067v1", "published_at": "2026-08-26", "score": 0.079, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26067.png", "title": "StreamPI: Streaming Multimodal Temporal Modeling for Vision-Language-Action Models", "tldr": "StreamPI \u4e3a\u5355\u5e27\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u52a0\u5165\u6d41\u5f0f\u591a\u6a21\u6001\u65f6\u5e8f\u5efa\u6a21\u80fd\u529b\uff0c\u4e14\u4e0d\u589e\u52a0\u989d\u5916\u53c2\u6570\u3002\u5b83\u901a\u8fc7\u4ee5\u6307\u4ee4\u4e3a\u951a\u7684\u65f6\u5e8f\u6ce8\u610f\u529b\u548c\u968f\u673a\u95f4\u9694\u6d41\u5f0f\u8bad\u7ec3\uff0c\u63d0\u5347\u771f\u5b9e\u673a\u5668\u4eba\u5f02\u6b65\u90e8\u7f72\u4e2d\u7684\u8bb0\u5fc6\u3001\u7a7a\u95f4\u611f\u77e5\u4e0e\u52a8\u4f5c\u5e73\u6ed1\u6027\uff0c\u5728\u771f\u5b9e\u4efb\u52a1\u548c LIBERO \u4eff\u771f\u4e2d\u4f18\u4e8e pi0.5\u3002", "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models can produce fluent answers that are insufficiently grounded in the visual evidence: a single unsupported object, chart value, or intermediate inference can undermine an otherwise plausible response. We argue that this is a credit-assignment failure in multimodal post-training. Scalar outcome rewards indicate whether an answer is acceptable, but do not identify which visual facts are grounded, which reasoning steps are valid, or which instruction constraints are missed. We introduce Visual Rubrics-Based Reinforcement Learning, which decomposes reference responses into atomic propositions and scores generated answers along Visual Faithfulness (VF), Reasoning Consistency (RC), and Instruction Following (IF). The resulting rubric items provide structured partial credit and localize rubric credit when supporting evidence spans are available. We first obtain an SFT checkpoint by fine-tuning Qwen3-VL-8B-Instruct on the public OpenMMReasoner-SFT-874K corpus, adapting OpenMMReasoner\u0027s cold-start data recipe. We construct V-Rubrics 50K, a 50,248-example training set from 17 visually grounded sources, by applying rule-based filters before deriving example difficulty from rejection-sampling scores and then annotating every example with Gemini-3-Pro under the same structured prompt and protocol. We train our model based on the same SFT checkpoint using component-wise, prefix-localized rubric credit. Experiments show that our rubricbased GRPO improves over both the shared SFT baseline and answer-only GRPO, with the largest gains on knowledge-oriented and visually grounded reasoning benchmarks. The results show rubrics as a useful reward abstraction for visual post-training.", "arxiv_id": "2608.25580", "arxiv_url": "https://arxiv.org/abs/2608.25580", "authors": ["Shulin Tian", "Minglun Li", "Yuhao Dong", "Hao Ding", "Jiarui Yao", "Haiwen Diao", "Jingkang Yang", "Hongyuan Zhu", "Ziwei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa\u57fa\u4e8e\u89c6\u89c9\u8bc4\u5206\u7ec6\u5219\u7684\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u5c06\u53c2\u8003\u7b54\u6848\u62c6\u89e3\u4e3a\u539f\u5b50\u547d\u9898\uff0c\u5e76\u4ece\u89c6\u89c9\u5fe0\u5b9e\u6027\u3001\u63a8\u7406\u4e00\u81f4\u6027\u548c\u6307\u4ee4\u9075\u5faa\u4e09\u4e2a\u7ef4\u5ea6\u63d0\u4f9b\u7ed3\u6784\u5316\u5956\u52b1\u3002\u4f5c\u8005\u6784\u5efa\u4e86 V-Rubrics 50K \u6570\u636e\u96c6\uff0c\u5e76\u5728 Qwen3-VL-8B \u4e0a\u8bad\u7ec3\uff0c\u7ed3\u679c\u76f8\u6bd4 SFT \u548c\u4ec5\u7b54\u6848\u5956\u52b1\u7684 GRPO \u5728\u89c6\u89c9\u63a8\u7406\u4e0e\u77e5\u8bc6\u578b\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u597d\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/shulin16/v-rubrics", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.25580", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u5fe0\u5b9e\u6027"], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University Singapore", "pdf_url": "https://arxiv.org/pdf/2608.25580v1", "published_at": "2026-08-26", "score": 0.078, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25580.png", "title": "V-Rubrics: Visual Faithfulness via Rubric-Based Reinforcement Learning", "tldr": "\u8bba\u6587\u63d0\u51fa\u57fa\u4e8e\u89c6\u89c9\u8bc4\u5206\u7ec6\u5219\u7684\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u5c06\u53c2\u8003\u7b54\u6848\u62c6\u89e3\u4e3a\u539f\u5b50\u547d\u9898\uff0c\u5e76\u4ece\u89c6\u89c9\u5fe0\u5b9e\u6027\u3001\u63a8\u7406\u4e00\u81f4\u6027\u548c\u6307\u4ee4\u9075\u5faa\u4e09\u4e2a\u7ef4\u5ea6\u63d0\u4f9b\u7ed3\u6784\u5316\u5956\u52b1\u3002\u4f5c\u8005\u6784\u5efa\u4e86 V-Rubrics 50K \u6570\u636e\u96c6\uff0c\u5e76\u5728 Qwen3-VL-8B \u4e0a\u8bad\u7ec3\uff0c\u7ed3\u679c\u76f8\u6bd4 SFT \u548c\u4ec5\u7b54\u6848\u5956\u52b1\u7684 GRPO \u5728\u89c6\u89c9\u63a8\u7406\u4e0e\u77e5\u8bc6\u578b\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u597d\u8868\u73b0\u3002", "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Native visual reasoning treats visual generation as the medium of reasoning itself: visual states (i.e. images and videos) are not merely inputs to be understood or outputs to be rendered, but first-class substrates for problem solving beyond language. Yet progress remains bottlenecked by the lack of scalable training tasks, reliable feedback, and controlled comparisons across generative substrates. In this work, we introduce VBVR-Pro, a closed-loop testbed that makes native visual reasoning through generation trainable, verifiable, optimizable, and experimentally controllable. 1) Task scaling. VBVR-Pro turns visual reasoning into a controlled task space of 300 procedurally generated tasks. Models trained on VBVR-Pro show strong transfer beyond the proposed suite across seven external visual reasoning benchmarks such as RISE-Video, MME-CoF-Pro, and BabyVision. 2) Verifiable rewards. VBVR-Pro provides verifiable reward scorers for task-grounded evaluation. Through a systematic study of leading MLLMs as judges, we identify recurring failure modes of the prevalent VLM-as-a-judge paradigm. In contrast, the proposed scorers are grounded in deterministic, task-specific rules, achieve fine-grained alignment with human judgments. Importantly, they serve as reliable reward signals for large-scale multi-task reinforcement learning and demonstrate stronger post-RL performance across visual reasoning tasks. 3) Mechanism study. VBVR-Pro enables controlled modality studies across more than 30 image, video, and interleaved generators. Our analysis shows that video generation remains strongest for tasks requiring persistent spatiotemporal state tracking, while interleaved generation provides a compute-efficient alternative. Critically, ablations and probing suggest the presence of vision-native trajectories that are crucial to visual reasoning. We release all data, models, scorers, and code.", "arxiv_id": "2608.26105", "arxiv_url": "https://arxiv.org/abs/2608.26105", "authors": ["Junxiang Xu", "Ruisi Wang", "Fanyi Pu", "Maijunxian Wang", "Ran Ji", "Tongxi Zhou", "Chenyang Gu", "Jing Zuo", "Hongcan Xiao", "Yimeng Geng", "Wanqi Yin", "Wei Chen", "Oscar Qian", "Zhengan Yan", "Ziqi Huang", "Haiwen Diao", "Liang Pan", "Bo Li", "Xiangyu Fan", "Dezhi Luo", "Fengyuan Yu", "Zehong Zhao", "Qingying Gao", "Tinghui Zhu", "Yilan Zhang", "Jingqi Tong", "Pinyuan Feng", "Zhengze Jiang", "Letian Wang", "Ziyu Guo", "Renrui Zhang", "Jieneng Chen", "Sonia Joseph", "Constantin Venhoff", "Saman Motamed", "Mengyue Yang", "Chandra Sripada", "Alan Yuille", "Philip Torr", "Lvmin Zhang", "Vikash Kumar", "Daniel Khashabi", "Nikolaus Kriegeskorte", "Rapha\u00ebl Milli\u00e8re", "Vincent C. M\u00fcller", "Anyi Rao", "Quan Wang", "Ziwei Liu", "Dahua Lin", "Lei Yang", "Hokin Deng", "Zhongang Cai"], "brief": "VBVR-Pro \u63d0\u4f9b\u4e86\u4e00\u4e2a\u53ef\u6269\u5c55\u3001\u53ef\u9a8c\u8bc1\u7684\u539f\u751f\u89c6\u89c9\u63a8\u7406\u95ed\u73af\u6d4b\u8bd5\u5e73\u53f0\uff0c\u5305\u542b 300 \u4e2a\u7a0b\u5e8f\u751f\u6210\u4efb\u52a1\u3001\u786e\u5b9a\u6027\u4efb\u52a1\u5956\u52b1\u8bc4\u4f30\u5668\uff0c\u5e76\u652f\u6301\u5927\u89c4\u6a21\u591a\u4efb\u52a1\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u57fa\u4e8e\u8be5\u5957\u4ef6\u8bad\u7ec3\u7684\u6a21\u578b\u80fd\u8fc1\u79fb\u5230\u591a\u4e2a\u5916\u90e8\u89c6\u89c9\u63a8\u7406\u57fa\u51c6\uff0c\u4e14\u53ef\u9a8c\u8bc1\u5956\u52b1\u6bd4\u5e38\u89c1\u7684 VLM-as-a-judge \u66f4\u53ef\u9760\uff1b\u6  architecture with a parallel informational left brain, an emotional right brain, and streaming memory I/O mechanisms. We further build a complete pipeline for memory-aware SLM training, long-horizon evaluation, and decoupled deployment with interchangeable memory backends. Experiments and real-world deployment show three advantages: i) Accuracy: under top-5 retrieval, the left brain outperforms classical systems such as Mem0 at top-200 by nearly 30 points; ii) Emotional \u0026 Personal: the right brain, with short- and long-horizon affective attribution and dual-node persona modeling, achieves state-of-the-art performance across three persona benchmarks and improves the aggregate score by 4.29 points over the previous best system; and iii) Real-Time \u0026 Cheap: VoiceMem completes retrieval in 134 ms, well within standard VAD latency, adding no extra conversational delay while maintaining high accuracy and low cost. These results show that VoiceMem provides a practical memory foundation for real-time, personalized, and emotionally aware speech interaction.", "arxiv_id": "2608.26005", "arxiv_url": "https://arxiv.org/abs/2608.26005", "authors": ["Zhifei Xie", "Jiaqi Lang", "Ze An", "Yifan Zhao", "Dongchao Yang", "Kai Li", "Ziyang Ma", "Mingbao Lin", "Chunyan Miao", "Shuicheng Yan"], "brief": "VoiceMem \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5b9e\u65f6\u8bed\u97f3\u4ea4\u4e92\u7684\u53cc\u8111\u6d41\u5f0f\u8bb0\u5fc6\u67b6\u6784\uff0c\u5c06\u4fe1\u606f\u578b\u201c\u5de6\u8111\u201d\u548c\u60c5\u611f\u578b\u201c\u53f3\u8111\u201d\u5e76\u884c\u7ed3\u5408\uff0c\u5e76\u652f\u6301\u8bb0\u5fc6\u611f\u77e5\u8bad\u7ec3\u3001\u957f\u7a0b\u8bc4\u6d4b\u4e0e\u89e3\u8026\u90e8\u7f72\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u68c0\u7d22\u51c6\u786e\u7387\u663e\u8457\u4f18\u4e8e\u4f20\u7edf\u8bb0\u5fc6\u7cfb\u7edf\uff0c\u60c5\u611f\u4e0e\u4eba\u683c\u5efa\u6a21\u8fbe\u5230\u9886\u5148\u6c34\u5e73\uff0c\u540c\u65f6\u68c0\u7d22\u5ef6\u8fdf\u4ec5 134ms\uff0c\u9002\u5408\u4f4e\u5ef6\u8fdf\u4e2a\u6027\u5316\u8bed\u97f3\u5bf9\u8bdd\u3002", "categories": ["eess.AS", "cs.AI", "cs.IR", "cs.MM", "cs.SD"], "github_repo": "https://github.com/xzf-thu/VoiceMem", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26005", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u4ea4\u4e92", "\u8bb0\u5fc6\u7cfb\u7edf", "\u60c5\u611f\u8ba1\u7b97", "\u4e2a\u6027\u5316\u5bf9\u8bdd"], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University Singapore", "pdf_url": "https://arxiv.org/pdf/2608.26005v1", "published_at": "2026-08-26", "score": 0.059, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26005.png", "title": "VoiceMem: Streaming Dual-Brain Memory for Real-Time Interaction", "tldr": "VoiceMem \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5b9e\u65f6\u8bed\u97f3\u4ea4\u4e92\u7684\u53cc\u8111\u6d41\u5f0f\u8bb0\u5fc6\u67b6\u6784\uff0c\u5c06\u4fe1\u606f\u578b\u201c\u5de6\u8111\u201d\u548c\u60c5\u611f\u578b\u201c\u53f3\u8111\u201d\u5e76\u884c\u7ed3\u5408\uff0c\u5e76\u652f\u6301\u8bb0\u5fc6\u611f\u77e5\u8bad\u7ec3\u3001\u957f\u7a0b\u8bc4\u6d4b\u4e0e\u89e3\u8026\u90e8\u7f72\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u68c0\u7d22\u51c6\u786e\u7387\u663e\u8457\u4f18\u4e8e\u4f20\u7edf\u8bb0\u5fc6\u7cfb\u7edf\uff0c\u60c5\u611f\u4e0e\u4eba\u683c\u5efa\u6a21\u8fbe\u5230\u9886\u5148\u6c34\u5e73\uff0c\u540c\u65f6\u68c0\u7d22\u5ef6\u8fdf\u4ec5 134ms\uff0c\u9002\u5408\u4f4e\u5ef6\u8fdf\u4e2a\u6027\u5316\u8bed\u97f3\u5bf9\u8bdd\u3002", "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "World models aim to simulate how complex environments evolve under actions and events, yet existing video-based world models primarily learn dynamics from visual observations, which reveal outcomes rather than the underlying knowledge, rules, and mechanisms governing world evolution. This makes it difficult to maintain persistent consequences and support coherent, open-ended evolution. We introduce Code World Model, a framework that separates world evolution from visual realization by combining the reasoning and coding capabilities of language models with the generative priors of video models. A coding agent serves as the world brain, reasoning about events and their consequences and generating executable code to maintain persistent world state and perform rule-consistent evolution. To connect executable state with visual generation, we introduce a proxy representation that encodes frame-wise spatiotemporal constraints and is compiled into a proxy video, which conditions a video model to render high-fidelity visual observations. We further develop data pipelines for constructing aligned proxy-observation pairs from gameplay and real-world videos. After fine-tuning on paired gameplay data, MiniMax-H3 follows proxy-based spatiotemporal specifications from simple interactive worlds built by the coding agent while preserving rich visual details and dynamics. These results demonstrate the potential of combining code for persistent world evolution with video models for flexible visual realization, providing a new path toward open-ended world models.", "arxiv_id": "2608.25927", "arxiv_url": "https://arxiv.org/abs/2608.25927", "authors": ["Yiwen Chen", "Guosheng Lin", "Chi Zhang"], "brief": "\u672c\u6587\u63d0\u51fa Code World Model\uff0c\u7528\u7f16\u7801\u667a\u80fd\u4f53\u4f5c\u4e3a\u201c\u4e16\u754c\u5927\u8111\u201d\uff0c\u901a\u8fc7\u63a8\u7406\u5e76\u751f\u6210\u53ef\u6267\u884c\u4ee3\u7801\u6765\u7ef4\u62a4\u6301\u4e45\u4e16\u754c\u72b6\u6001\u548c\u89c4\u5219\u4e00\u81f4\u7684\u6f14\u5316\u3002\u518d\u7528\u4ee3\u7406\u8868\u793a\u8fde\u63a5\u4ee3\u7801\u72b6\u6001\u4e0e\u89c6\u9891\u751f\u6210\u6a21\u578b\uff0c\u5b9e\u73b0\u7b26\u5408\u65f6\u7a7a\u7ea6\u675f\u4e14\u89c6\u89c9\u7ec6\u8282\u4e30\u5bcc\u7684\u5f00\u653e\u5f0f\u4e16\u754c\u6a21\u62df\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25927", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25927v1", "published_at": "2026-08-26", "score": 0.057, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25927.png", "title": "Code World Model: Coding Agent as World Brain", "tldr": "\u672c\u6587\u63d0\u51fa Code World Model\uff0c\u7528\u7f16\u7801\u667a\u80fd\u4f53\u4f5c\u4e3a\u201c\u4e16\u754c\u5927\u8111\u201d\uff0c\u901a\u8fc7\u63a8\u7406\u5e76\u751f\u6210\u53ef\u6267\u884c\u4ee3\u7801\u6765\u7ef4\u62a4\u6301\u4e45\u4e16\u754c\u72b6\u6001\u548c\u89c4\u5219\u4e00\u81f4\u7684\u6f14\u5316\u3002\u518d\u7528\u4ee3\u7406\u8868\u793a\u8fde\u63a5\u4ee3\u7801\u72b6\u6001\u4e0e\u89c6\u9891\u751f\u6210\u6a21\u578b\uff0c\u5b9e\u73b0\u7b26\u5408\u65f6\u7a7a\u7ea6\u675f\u4e14\u89c6\u89c9\u7ec6\u8282\u4e30\u5bcc\u7684\u5f00\u653e\u5f0f\u4e16\u754c\u6a21\u62df\u3002", "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Concurrent multi-agent coding promises division of labor across modules, robustness through redundancy, and parallel exploration at the natural granularity of multi-file projects. Realtime collaborative editing protocols solve this coordination problem for human teams via Conflict-free Replicated Data Types (CRDTs), but the LLMs underneath generate one token at a time and existing multi-agent coding systems inherit this serial limit: they either sequence agents through phase handoffs or pool independent samples without coordination, and a single agent abandons up to half of hard tasks with a one-file stub-and-exit. AgentRoom is a realtime collaborative editing protocol for concurrent coding agents. Its runtime layer exposes file-level claim, status, and broadcast as MCP tools on a CRDT-merged shared filesystem. Five frontier coding-CLI models ran four backend coding tasks, with cross-language checks in Python DevBench and Rust+axum. For CLI-stable models, AgentRoom with 2 agents abandons fewer tasks than Solo and has less run-to-run variation. At matched-compute, one positive mean LLM-judge contrast puts AgentRoom over parallel-merge. The other contrast, a bundle probe, puts full AgentRoom above each partial case: an ordering rather than a percentage split. Coordination, not parallelism or CRDT-merge, bears the load.", "arxiv_id": "2608.23740", "arxiv_url": "https://arxiv.org/abs/2608.23740", "authors": ["Seonglae Cho", "Donghyun Lee"], "brief": "AgentRoom \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5e76\u53d1\u7f16\u7801\u667a\u80fd\u4f53\u7684\u5b9e\u65f6\u534f\u4f5c\u7f16\u8f91\u534f\u8bae\uff0c\u5728 CRDT \u5408\u5e76\u7684\u5171\u4eab\u6587\u4ef6\u7cfb\u7edf\u4e0a\u63d0\u4f9b\u6587\u4ef6\u8ba4\u9886\u3001\u72b6\u6001\u540c\u6b65\u548c\u5e7f\u64ad\u7b49 MCP \u5de5\u5177\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u7a33\u5b9a\u7684\u7f16\u7801 CLI \u6a21\u578b\u4e0a\uff0c2 \u4e2a\u667a\u80fd\u4f53\u76f8\u6bd4\u5355\u667a\u80fd\u4f53\u66f4\u5c11\u653e\u5f03\u4efb\u52a1\u3001\u8fd0\u884c\u6ce2\u52a8\u66f4\u5c0f\uff0c\u5e76\u5728\u90e8\u5206\u540c\u7b97\u529b\u5bf9\u6bd4\u4e2d\u4f18\u4e8e\u7b80\u5355\u5e76\u884c\u5408\u5e76\uff0c\u8868\u660e\u6548\u679c\u4e3b\u8981\u6765\u81ea\u534f\u540c\u673a\u5236\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23740", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u534f\u540c\u7f16\u8f91", "CRDT"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23740v1", "published_at": "2026-08-24", "score": 0.056, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.23740.png", "title": "AgentRoom: Concurrent Multi-Agent Coding in a CRDT-Backed Shared Workspace", "tldr": "AgentRoom \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5e76\u53d1\u7f16\u7801\u667a\u80fd\u4f53\u7684\u5b9e\u65f6\u534f\u4f5c\u7f16\u8f91\u534f\u8bae\uff0c\u5728 CRDT \u5408\u5e76\u7684\u5171\u4eab\u6587\u4ef6\u7cfb\u7edf\u4e0a\u63d0\u4f9b\u6587\u4ef6\u8ba4\u9886\u3001\u72b6\u6001\u540c\u6b65\u548c\u5e7f\u64ad\u7b49 MCP \u5de5\u5177\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u7a33\u5b9a\u7684\u7f16\u7801 CLI \u6a21\u578b\u4e0a\uff0c2 \u4e2a\u667a\u80fd\u4f53\u76f8\u6bd4\u5355\u667a\u80fd\u4f53\u66f4\u5c11\u653e\u5f03\u4efb\u52a1\u3001\u8fd0\u884c\u6ce2\u52a8\u66f4\u5c0f\uff0c\u5e76\u5728\u90e8\u5206\u540c\u7b97\u529b\u5bf9\u6bd4\u4e2d\u4f18\u4e8e\u7b80\u5355\u5e76\u884c\u5408\u5e76\uff0c\u8868\u660e\u6548\u679c\u4e3b\u8981\u6765\u81ea\u534f\u540c\u673a\u5236\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "We study autonomous mathematical discovery in the Station, an open-world multi-agent environment in which AI agents from different model families pursue a shared research goal without a central coordinator or scripted pipeline. Agents choose their own research directions, conduct experiments, collaborate, and build a shared scientific literature. Across 12 construction problems from the AlphaEvolve catalogue and two additional case studies, the Station obtained results novel relative to the prior literature on five problems: a new infinite family of finite-field Kakeya sets, new exact 604-point kissing configurations in dimension 11, new records for the discretized Kakeya needle and sign uncertainty problems, and a substantially improved lower bound for Erd\u0151s\u0027s minimum-overlap problem. Agents also discovered novel infinite families for Book Ramsey numbers. Importantly, the agents produced not only numerical constructions but also theorems and analyses explaining how those constructions work, making the results more interpretable and easier for mathematicians to build upon. We release all raw agent dialogues, proofs, and verification code, providing a transparent record of how these discoveries emerged.", "arxiv_id": "2608.23691", "arxiv_url": "https://arxiv.org/abs/2608.23691", "authors": ["Stephen Chung", "Wenyu Du", "William J. Wesley"], "brief": "\u8bba\u6587\u63d0\u51fa Station\uff0c\u4e00\u4e2a\u5f00\u653e\u4e16\u754c\u591a\u667a\u80fd\u4f53\u6570\u5b66\u53d1\u73b0\u73af\u5883\uff0c\u4e0d\u540c\u6a21\u578b\u5bb6\u65cf\u7684\u667a\u80fd\u4f53\u5728\u65e0\u4e2d\u592e\u534f\u8c03\u548c\u65e0\u56fa\u5b9a\u6d41\u6c34\u7ebf\u4e0b\u81ea\u4e3b\u9009\u9898\u3001\u5b9e\u9a8c\u3001\u534f\u4f5c\u5e76\u79ef\u7d2f\u5171\u4eab\u6587\u732e\u3002\u5728 12 \u4e2a AlphaEvolve \u6784\u9020\u95ee\u9898\u548c 2 \u4e2a\u6848\u4f8b\u4e2d\uff0c\u7cfb\u7edf\u5728 5 \u4e2a\u95ee\u9898\u4e0a\u5f97\u5230\u76f8\u5bf9\u5df2\u6709\u6587\u732e\u7684\u65b0\u7ed3\u679c\uff0c\u5305\u62ec Kakeya \u96c6\u300111 \u7ef4 kissing \u914d\u7f6e\u3001\u79bb\u6563 Kakeya needle\u3001\u7b26\u53f7\u4e0d\u786e\u5b9a\u6027\u548c Erd\u0151s \u6700\u5c0f\u91cd\u53e0\u95ee\u9898\uff0c\u5e76\u4ea7\u51fa\u53ef\u89e3\u91ca\u7684\u5b9a\u7406\u3001\u8bc1\u660e\u4e0e\u9a8c\u8bc1\u4ee3\u7801\u3002", "categories": ["cs.AI", "cs.DM", "cs.MA"], "github_repo": "https://github.com/dualverse-ai/station_data_v2", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.23691", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u5b66\u53d1\u73b0", "\u591a\u667a\u80fd\u4f53", "\u81ea\u52a8\u5316\u79d1\u5b66"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23691v1", "published_at": "2026-08-24", "score": 0.045, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.23691.png", "title": "Autonomous Mathematical Discovery in an Open-World Multi-Agent Environment", "tldr": "\u8bba\u6587\u63d0\u51fa Station\uff0c\u4e00\u4e2a\u5f00\u653e\u4e16\u754c\u591a\u667a\u80fd\u4f53\u6570\u5b66\u53d1\u73b0\u73af\u5883\uff0c\u4e0d\u540c\u6a21\u578b\u5bb6\u65cf\u7684\u667a\u80fd\u4f53\u5728\u65e0\u4e2d\u592e\u534f\u8c03\u548c\u65e0\u56fa\u5b9a\u6d41\u6c34\u7ebf\u4e0b\u81ea\u4e3b\u9009\u9898\u3001\u5b9e\u9a8c\u3001\u534f\u4f5c\u5e76\u79ef\u7d2f\u5171\u4eab\u6587\u732e\u3002\u5728 12 \u4e2a AlphaEvolve \u6784\u9020\u95ee\u9898\u548c 2 \u4e2a\u6848\u4f8b\u4e2d\uff0c\u7cfb\u7edf\u5728 5 \u4e2a\u95ee\u9898\u4e0a\u5f97\u5230\u76f8\u5bf9\u5df2\u6709\u6587\u732e\u7684\u65b0\u7ed3\u679c\uff0c\u5305\u62ec Kakeya \u96c6\u300111 \u7ef4 kissing \u914d\u7f6e\u3001\u79bb\u6563 Kakeya needle\u3001\u7b26\u53f7\u4e0d\u786e\u5b9a\u6027\u548c Erd\u0151s \u6700\u5c0f\u91cd\u53e0\u95ee\u9898\uff0c\u5e76\u4ea7\u51fa\u53ef\u89e3\u91ca\u7684\u5b9a\u7406\u3001\u8bc1\u660e\u4e0e\u9a8c\u8bc1\u4ee3\u7801\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Scaling transformer language models creates an inherent tension between expressivity and memory efficiency. While unique weights across layers preserve functional specialization---from input-grounding to abstract refinement---they incur a substantial memory footprint. Conversely, standard depth-sharing enforces uniform transformations that collapse representational diversity and degrade modeling quality. We introduce Gated Recurrent Transformer, a recurrent depth transformer where fixed-depth prelude and coda blocks bracket a single shared core iterated R times. Inspired by gated recurrent neural networks, we employ a lightweight projection and an elementwise update gate---conditioned on the hidden state, the fixed prelude output, and noise resampled at every step---to modulate the recurrent update. This allows the model to specialize the input to the same few layers across recurrences, rather than requiring many unique layers to achieve functional diversity. Under an isoFLOPS constraint, a 3-layer Gated Recurrent Transformer matches the accuracy of a 12-layer GPT-2 Small baseline with similar training and inference FLOPs, and leads MoR and heavy-tail depth sampling in all nine scale-by-budget cells; at medium and large scale it approaches dense quality at the standard token budget and overtakes it at medium scale once that budget is doubled. Under an isoPARAMS constraint, deeper recurrence achieves a 2.76 validation loss versus 2.84 for a non-recurrent counterpart at matched parameter and data budget. Our results demonstrate that adaptive depth reuse is a principled strategy for trading parameters for quality: at large scale, 63% fewer parameters and 59% less peak decoding memory for a 10% increase in compiled generation latency.", "arxiv_id": "2608.15062", "arxiv_url": "https://arxiv.org/abs/2608.15062", "authors": ["Amr Hegazy", "Amr Alanwar", "Mostafa Elhoushi"], "brief": "\u672c\u6587\u63d0\u51fa Gated Recurrent Transformer\uff0c\u7528\u56fa\u5b9a\u7684\u524d\u540e\u5c42\u5939\u4f4f\u4e00\u4e2a\u53ef\u91cd\u590d\u8fed\u4ee3\u7684\u5171\u4eab\u6838\u5fc3\u5c42\uff0c\u5e76\u7528\u95e8\u63a7\u673a\u5236\u6839\u636e\u9690\u85cf\u72b6\u6001\u3001\u524d\u7f6e\u8f93\u51fa\u548c\u566a\u58f0\u8c03\u5236\u6bcf\u6b21\u9012\u5f52\u66f4\u65b0\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u76f8\u8fd1 FLOPs \u4e0b\uff0c3 \u5c42\u6a21\u578b\u53ef\u5339\u914d 12 \u5c42 GPT-2 Small\uff0c\u5e76\u5728\u51cf\u5c11\u7ea6 63% \u53c2\u6570\u548c 59% \u89e3\u7801\u5cf0\u503c\u5185\u5b58\u7684\u540c\u65f6\u63a5\u8fd1\u6216\u8d85\u8fc7\u7a20\u5bc6\u6a21\u578b\u8d28\u91cf\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/Amr-Hegazy1/gated-recurrent-transformer", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.15062", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "Transformer", "\u53c2\u6570\u5171\u4eab", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 4, "on_hf": true, "organization": "Technical University of Munich", "pdf_url": "https://arxiv.org/pdf/2608.15062v4", "published_at": "2026-08-15", "score": 0.038, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15062.png", "title": "Gated Recurrent Transformers: Expressive Depth through Recurrent Modulation", "tldr": "\u672c\u6587\u63d0\u51fa Gated Recurrent Transformer\uff0c\u7528\u56fa\u5b9a\u7684\u524d\u540e\u5c42\u5939\u4f4f\u4e00\u4e2a\u53ef\u91cd\u590d\u8fed\u4ee3\u7684\u5171\u4eab\u6838\u5fc3\u5c42\uff0c\u5e76\u7528\u95e8\u63a7\u673a\u5236\u6839\u636e\u9690\u85cf\u72b6\u6001\u3001\u524d\u7f6e\u8f93\u51fa\u548c\u566a\u58f0\u8c03\u5236\u6bcf\u6b21\u9012\u5f52\u66f4\u65b0\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u76f8\u8fd1 FLOPs \u4e0b\uff0c3 \u5c42\u6a21\u578b\u53ef\u5339\u914d 12 \u5c42 GPT-2 Small\uff0c\u5e76\u5728\u51cf\u5c11\u7ea6 63% \u53c2\u6570\u548c 59% \u89e3\u7801\u5cf0\u503c\u5185\u5b58\u7684\u540c\u65f6\u63a5\u8fd1\u6216\u8d85\u8fc7\u7a20\u5bc6\u6a21\u578b\u8d28\u91cf\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Existing co-speech gesture generation methods are predominantly studied in offline settings, where gestures are synthesized from complete speech segments. However, interactive digital humans in real-world scenarios are required to generate speech-synchronous gestures online, using only currently available response audio under strict latency constraints. As a result, prior methods are unsuitable for real-time interaction, as they either rely on future speech information or incur substantial inference delay. In this paper, we formulate online co-speech gesture generation for interactive digital humans and propose a real-time interactive framework that couples a streaming speech response module with an online gesture generation module. Specifically, the gesture generator is designed as a causal multimodal autoregressive model that predicts body motion from streaming response speech and motion history, enabling low-latency and speech-aligned gesture synthesis without access to future speech. To support this setting, we further propose an offline data synthesis pipeline tailored to virtual companion scenarios, which leverages topic- and emotion-aware subject corpora to construct diverse human-agent dialogues and then generates co-speech gestures conditioned on the agent responses. Moreover, to bridge the gap between offline data construction and online deployment, we establish a self-evolving training loop by incorporating user feedback collected during online interaction into the data generation process, enabling continual adaptation to user preferences. Extensive experiments demonstrate that our framework achieves superior better latency-quality trade-off, stronger speech-motion synchronization, and higher user preference than competitive existing baselines. Project Page: https://super-star-2026.github.io/", "arxiv_id": "2608.24909", "arxiv_url": "https://arxiv.org/abs/2608.24909", "authors": ["Wentao Jiang", "Youchen Xie", "Haidi Fan", "Yajing Chen", "Xin Wang", "Ye Shi", "Jingya Wang"], "brief": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u4ea4\u4e92\u5f0f\u6570\u5b57\u4eba\u7684\u5b9e\u65f6\u6d41\u5f0f\u5171\u8bed\u624b\u52bf\u751f\u6210\u6846\u67b6\uff0c\u5c06\u6d41\u5f0f\u8bed\u97f3\u54cd\u5e94\u4e0e\u5728\u7ebf\u624b\u52bf\u751f\u6210\u7ed3\u5408\uff0c\u5728\u4e0d\u4f7f\u7528\u672a\u6765\u8bed\u97f3\u7684\u60c5\u51b5\u4e0b\u751f\u6210\u4f4e\u5ef6\u8fdf\u3001\u8bed\u97f3\u540c\u6b65\u7684\u80a2\u4f53\u52a8\u4f5c\u3002\u65b9\u6cd5\u91c7\u7528\u56e0\u679c\u591a\u6a21\u6001\u81ea\u56de\u5f52\u6a21\u578b\uff0c\u5e76\u901a\u8fc7\u79bb\u7ebf\u6570\u636e\u5408\u6210\u4e0e\u7528\u6237\u53cd\u9988\u9a71\u52a8\u7684\u81ea\u8fdb\u5316\u8bad\u7ec3\u63d0\u5347\u9002\u5e94\u6027\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5ef6\u8fdf-\u8d28\u91cf\u6743\u8861\u3001\u8bed\u97f3\u52a8\u4f5c\u540c\u6b65\u548c\u7528\u6237\u504f\u597d\u4e0a\u4f18\u4e8e\u73b0\u6709\u57fa\u7ebf\u3002", "categories": ["cs.HC", "cs.CV", "cs.SD"], "github_repo": "https://github.com/PeterIverson/Super-Star", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2608.24909", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u5b57\u4eba", "\u591a\u6a21\u6001", "\u52a8\u4f5c\u751f\u6210"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24909v1", "published_at": "2026-07-22", "score": 0.034, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24909.png", "title": "Super Star: Towards Streaming Real-time Interactive Agents for Digital Humans", "tldr": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u4ea4\u4e92\u5f0f\u6570\u5b57\u4eba\u7684\u5b9e\u65f6\u6d41\u5f0f\u5171\u8bed\u624b\u52bf\u751f\u6210\u6846\u67b6\uff0c\u5c06\u6d41\u5f0f\u8bed\u97f3\u54cd\u5e94\u4e0e\u5728\u7ebf\u624b\u52bf\u751f\u6210\u7ed3\u5408\uff0c\u5728\u4e0d\u4f7f\u7528\u672a\u6765\u8bed\u97f3\u7684\u60c5\u51b5\u4e0b\u751f\u6210\u4f4e\u5ef6\u8fdf\u3001\u8bed\u97f3\u540c\u6b65\u7684\u80a2\u4f53\u52a8\u4f5c\u3002\u65b9\u6cd5\u91c7\u7528\u56e0\u679c\u591a\u6a21\u6001\u81ea\u56de\u5f52\u6a21\u578b\uff0c\u5e76\u901a\u8fc7\u79bb\u7ebf\u6570\u636e\u5408\u6210\u4e0e\u7528\u6237\u53cd\u9988\u9a71\u52a8\u7684\u81ea\u8fdb\u5316\u8bad\u7ec3\u63d0\u5347\u9002\u5e94\u6027\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5ef6\u8fdf-\u8d28\u91cf\u6743\u8861\u3001\u8bed\u97f3\u52a8\u4f5c\u540c\u6b65\u548c\u7528\u6237\u504f\u597d\u4e0a\u4f18\u4e8e\u73b0\u6709\u57fa\u7ebf\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-arm collaboration is becoming a core capability in embodied manipulation. Recent vision-language-action (VLA) models integrate perception, language, and control, but most represent language as a single global instruction and do not provide an explicit mechanism for assigning and composing arm-specific behaviors. This design limits transfer to collaboration patterns that differ from those observed during training. We present MA-VLA, a unified framework for multi-arm collaboration via atomic action assignment. MA-VLA decomposes cooperative behavior into mid-level atomic prompts and allocates them to individual arms, enabling explicit subgoal specification and compositional reuse across tasks. To reduce reliance on fixed execution roles, we introduce Arm Shuffle, a training-time permutation of the observation, state, and assigned atomic prompts for each arm. This permutation enforces role-agnostic instruction following and supports recomposition into unseen coordination patterns, which we term multi-arm compositional generalization. We also construct a benchmark in which test-time collaboration patterns are absent in training set. Across simulation and real-world evaluations, prior state-of-the-art VLAs largely fail under these unseen collaborations, while MA-VLA consistently succeeds. These results indicate that structured, per-arm atomic action assignment offers a practical route to scalable generalization in multi-arm embodied systems. Code, models, and data are available at https://github.com/zhangzaibin/future-robots", "arxiv_id": "2608.25864", "arxiv_url": "https://arxiv.org/abs/2608.25864", "authors": ["Zaibin Zhang", "Junlan Xiao", "Zhongbo Zhang", "Yifan Wang", "Li Kang", "Yiran Qin", "Changxing Xia", "Heng Zhou", "Talas Fu", "Enshen Zhou", "Ruimao Zhang", "Zhenfei Yin", "Huchuan Lu", "Lijun Wang"], "brief": "\u672c\u6587\u63d0\u51fa MA-VLA\uff0c\u7528\u201c\u539f\u5b50\u52a8\u4f5c\u63d0\u793a\u201d\u663e\u5f0f\u5206\u914d\u5230\u4e0d\u540c\u673a\u68b0\u81c2\uff0c\u4ece\u800c\u652f\u6301\u591a\u81c2\u534f\u4f5c\u4e2d\u7684\u5b50\u76ee\u6807\u6307\u5b9a\u4e0e\u884c\u4e3a\u7ec4\u5408\u590d\u7528\u3002\u901a\u8fc7 Arm Shuffle \u8bad\u7ec3\u7b56\u7565\uff0c\u6a21\u578b\u51cf\u5c11\u5bf9\u56fa\u5b9a\u89d2\u8272\u7684\u4f9d\u8d56\uff0c\u5728\u672a\u89c1\u8fc7\u7684\u534f\u4f5c\u6a21\u5f0f\u4e0b\u76f8\u6bd4\u73b0\u6709 VLA \u65b9\u6cd5\u8868\u73b0\u66f4\u7a33\u5065\uff0c\u5e76\u5728\u4eff\u771f\u548c\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u53d6\u5f97\u6210\u529f\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/zhangzaibin/future-robots", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.25864", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u591a\u81c2\u534f\u4f5c", "\u7ec4\u5408\u6cdb\u5316"], "num_comments": 1, "on_hf": true, "organization": "DaLian University of Technology", "pdf_url": "https://arxiv.org/pdf/2608.25864v1", "published_at": "2026-08-26", "score": 0.032, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25864.png", "title": "MA-VLA: Multi-Arm Vision-Language-Action Model for Collaboration and Compositional Generalization", "tldr": "\u672c\u6587\u63d0\u51fa MA-VLA\uff0c\u7528\u201c\u539f\u5b50\u52a8\u4f5c\u63d0\u793a\u201d\u663e\u5f0f\u5206\u914d\u5230\u4e0d\u540c\u673a\u68b0\u81c2\uff0c\u4ece\u800c\u652f\u6301\u591a\u81c2\u534f\u4f5c\u4e2d\u7684\u5b50\u76ee\u6807\u6307\u5b9a\u4e0e\u884c\u4e3a\u7ec4\u5408\u590d\u7528\u3002\u901a\u8fc7 Arm Shuffle \u8bad\u7ec3\u7b56\u7565\uff0c\u6a21\u578b\u51cf\u5c11\u5bf9\u56fa\u5b9a\u89d2\u8272\u7684\u4f9d\u8d56\uff0c\u5728\u672a\u89c1\u8fc7\u7684\u534f\u4f5c\u6a21\u5f0f\u4e0b\u76f8\u6bd4\u73b0\u6709 VLA \u65b9\u6cd5\u8868\u73b0\u66f4\u7a33\u5065\uff0c\u5e76\u5728\u4eff\u771f\u548c\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u53d6\u5f97\u6210\u529f\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models excel at code generation, yet competitive programming exposes a persistent failure mode: existing multi-agent pipelines distribute work over generic planner, coder, and debugger roles and delegate the choice of algorithmic technique to the backbone alone. We present MARS (Multi-Agent Relay of Specialized LLMs), a prompt-only framework in which each agent is a topic specialist---dynamic programming, graphs, strings, geometry, and so on---grounded by retrieval-augmented generation over an algorithm-theory corpus. Given a problem, retrieval selects a small team of relevant specialists; a starter writes an initial C++17 solution, and each subsequent turn runs the candidate against public examples in a sandbox, lets the active specialist keep, repair, or hand off the draft, and forwards a structured packet to the next specialist. A single infrastructure-fixer pass normalizes boilerplate at the end. On the CodeContests test split with Gemma 4, MARS reaches $0.624 \\pm 0.006$ pass rate at $2.3$ recorded pipeline stages per task ($+14.4$ percentage points over direct prompting), closing most of the gap to CodeSIM ($0.731$) at $3.3{\\times}$ lower wall-clock cost and substantially smaller variance in per-task token spend. The source code is available on GitHub: https://github.com/fckand/mars.", "arxiv_id": "2608.23918", "arxiv_url": "https://arxiv.org/abs/2608.23918", "authors": ["Andrei Mikhailov", "Mikhail Burtsev", "Alsu Sagirova"], "brief": "MARS \u662f\u4e00\u4e2a\u9762\u5411\u7ade\u8d5b\u7f16\u7a0b\u7684\u591a\u667a\u80fd\u4f53 LLM \u63a5\u529b\u6846\u67b6\uff0c\u901a\u8fc7\u68c0\u7d22\u589e\u5f3a\u4e3a\u52a8\u6001\u89c4\u5212\u3001\u56fe\u8bba\u3001\u5b57\u7b26\u4e32\u3001\u51e0\u4f55\u7b49\u7b97\u6cd5\u4e13\u5bb6\u5206\u914d\u4efb\u52a1\uff0c\u5e76\u5728\u6c99\u7bb1\u4e2d\u8fed\u4ee3\u4fee\u590d C++17 \u89e3\u6cd5\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 CodeContests \u4e0a\u663e\u8457\u4f18\u4e8e\u76f4\u63a5\u63d0\u793a\uff0cpass rate \u63d0\u5347 14.4 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u4ee5\u66f4\u4f4e\u5899\u949f\u6210\u672c\u63a5\u8fd1 CodeSIM \u8868\u73b0\u3002", "categories": ["cs.AI", "cs.MA", "cs.PL"], "github_repo": "https://github.com/fckand/mars", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23918", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u68c0\u7d22\u589e\u5f3a", "\u7ade\u8d5b\u7f16\u7a0b"], "num_comments": 5, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23918v1", "published_at": "2026-08-24", "score": 0.012, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.23918.png", "title": "MARS: Multi-Specialist LLM Relay System for Competitive Programming", "tldr": "MARS \u662f\u4e00\u4e2a\u9762\u5411\u7ade\u8d5b\u7f16\u7a0b\u7684\u591a\u667a\u80fd\u4f53 LLM \u63a5\u529b\u6846\u67b6\uff0c\u901a\u8fc7\u68c0\u7d22\u589e\u5f3a\u4e3a\u52a8\u6001\u89c4\u5212\u3001\u56fe\u8bba\u3001\u5b57\u7b26\u4e32\u3001\u51e0\u4f55\u7b49\u7b97\u6cd5\u4e13\u5bb6\u5206\u914d\u4efb\u52a1\uff0c\u5e76\u5728\u6c99\u7bb1\u4e2d\u8fed\u4ee3\u4fee\u590d C++17 \u89e3\u6cd5\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 CodeContests \u4e0a\u663e\u8457\u4f18\u4e8e\u76f4\u63a5\u63d0\u793a\uff0cpass rate \u63d0\u5347 14.4 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u4ee5\u66f4\u4f4e\u5899\u949f\u6210\u672c\u63a5\u8fd1 CodeSIM \u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World action models (WAMs) improve robot control by modeling how observations evolve, but generating future observations at test time incurs substantial latency. Fast-WAM removes this process for efficiency; however, our matched implementations show lower generalization for Fast-WAM than for future-aware alternatives, especially with scarce robot demonstrations and in out-of-distribution scenarios. To bridge this gap, we introduce **LAWA**, a WAM architecture that uses compact latent actions as an operational representation of future intentions, enabling efficient test-time future imagination without generating future observations. Specifically, a discrete tokenizer enhanced by action-free pre-training produces manipulation-centric codebook targets. LAWA jointly denoises a continuous latent state anchored to these targets with executable action chunks while omitting the future-video branch at inference. On RoboCasa, LAWA achieves state-of-the-art average success rates of 65.6% and 80.8% in the few-shot and full data settings, improving over the matched Fast-WAM baseline by 9.6 and 4.5 points, respectively. It also preserves the performance level of the matched Joint-WAM variant while requiring 42.9% lower inference latency. LAWA also demonstrates competitive zero-shot robustness on LIBERO-Plus and superior performance on real-world tasks. These results show that future imagination need not be discarded: retaining it with compact latent actions yields an effective trade-off among performance, generalization, and latency. Code and models will be released.", "arxiv_id": "2608.24882", "arxiv_url": "https://arxiv.org/abs/2608.24882", "authors": ["Xiang Li", "Yupeng Zheng", "Songen Gu", "Huailiang Ma", "Feng Yu", "Xian Nie", "Shanshuai Yuan", "Yujie Zang", "Weize Li", "Shuai Tian", "Moyang Liu", "Ya-Qin Zhang", "Wenchao Ding"], "brief": "\u8bba\u6587\u63d0\u51fa LAWA\uff0c\u7528\u7d27\u51d1\u7684\u6f5c\u5728\u52a8\u4f5c\u8868\u793a\u672a\u6765\u610f\u56fe\uff0c\u4f7f\u673a\u5668\u4eba\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5728\u63a8\u7406\u65f6\u65e0\u9700\u751f\u6210\u672a\u6765\u89c6\u9891\u4e5f\u80fd\u8fdb\u884c\u9ad8\u6548\u201c\u672a\u6765\u60f3\u8c61\u201d\u3002\u5728 RoboCasa \u5c11\u6837\u672c\u548c\u5168\u6570\u636e\u8bbe\u7f6e\u4e0b\u5206\u522b\u8fbe\u5230 65.6% \u548c 80.8% \u6210\u529f\u7387\uff0c\u76f8\u6bd4 Fast-WAM \u63d0\u5347 9.6 \u548c 4.5 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u4fdd\u6301\u7c7b\u4f3c\u6027\u80fd\u7684\u540c\u65f6\u964d\u4f4e 42.9% \u63a8\u7406\u5ef6\u8fdf\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24882", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u4e16\u754c\u6a21\u578b", "\u6f5c\u5728\u52a8\u4f5c", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24882v1", "published_at": "2026-08-25", "score": 0.007, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24882.png", "title": "Latent Action as Intention Enables Efficient Future Imagination for World Action Models", "tldr": "\u8bba\u6587\u63d0\u51fa LAWA\uff0c\u7528\u7d27\u51d1\u7684\u6f5c\u5728\u52a8\u4f5c\u8868\u793a\u672a\u6765\u610f\u56fe\uff0c\u4f7f\u673a\u5668\u4eba\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5728\u63a8\u7406\u65f6\u65e0\u9700\u751f\u6210\u672a\u6765\u89c6\u9891\u4e5f\u80fd\u8fdb\u884c\u9ad8\u6548\u201c\u672a\u6765\u60f3\u8c61\u201d\u3002\u5728 RoboCasa \u5c11\u6837\u672c\u548c\u5168\u6570\u636e\u8bbe\u7f6e\u4e0b\u5206\u522b\u8fbe\u5230 65.6% \u548c 80.8% \u6210\u529f\u7387\uff0c\u76f8\u6bd4 Fast-WAM \u63d0\u5347 9.6 \u548c 4.5 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u4fdd\u6301\u7c7b\u4f3c\u6027\u80fd\u7684\u540c\u65f6\u964d\u4f4e 42.9% \u63a8\u7406\u5ef6\u8fdf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper, we explore a novel task of Multimodal Unsupervised Continual Post-Training (MU-CPT), enabling deployed MLLMs to continually evolve from streaming unlabeled data. Existing unsupervised post-training methods for MLLMs typically optimize target tokens uniformly, overlooking their heterogeneous visual dependence (VD). However, we reveal that token-level VD is crucial for MU-CPT. Specifically, its structural distortion serves as an indicator of cross-modal catastrophic forgetting, and its inherent heterogeneity acts as a compass to guide new-task learning. Leveraging this property, we propose a Visual Dependence-Aware (VDA) framework with two main components. First, Visually Constrained Optimal Transport (VC-OT) formulates the VD structural distortion of old-task VD during new-task learning as an optimal transport problem to mitigate cross-modal forgetting. By designing a region-aware ground cost and a dependence-stratified transport penalty, it prevents global shifts in visual focus while strictly prohibiting visual reliance from degenerating into language bias. Second, Visually Modulated Adaptation (VMA) exploits VD heterogeneity to emphasize visually grounded new-task learning, promoting new-task plasticity. Together, our method simultaneously maintains old-task stability and new-task plasticity during challenging MU-CPT. Extensive experiments under our MU-CPT setting validate the effectiveness of VDA.", "arxiv_id": "2608.26095", "arxiv_url": "https://arxiv.org/abs/2608.26095", "authors": ["Kaichen Li", "Zhilin Zhu", "Jianhao Huang", "Zhengqin Lai", "Baochen Xiong", "Zibo Shao", "Yaguang Song", "Linhui Xiao", "Xiaoshan Yang", "Changsheng Xu"], "brief": "\u672c\u6587\u63d0\u51fa\u591a\u6a21\u6001\u65e0\u76d1\u7763\u6301\u7eed\u540e\u8bad\u7ec3\uff08MU-CPT\uff09\u4efb\u52a1\uff0c\u4f7f\u5df2\u90e8\u7f72\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u80fd\u4ece\u6d41\u5f0f\u65e0\u6807\u6ce8\u6570\u636e\u4e2d\u6301\u7eed\u5b66\u4e60\u3002\u65b9\u6cd5\u5229\u7528 token \u7ea7\u89c6\u89c9\u4f9d\u8d56\u6765\u540c\u65f6\u7f13\u89e3\u8de8\u6a21\u6001\u707e\u96be\u6027\u9057\u5fd8\u5e76\u63d0\u5347\u65b0\u4efb\u52a1\u5b66\u4e60\u80fd\u529b\uff0c\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u8be5\u6846\u67b6\u5728\u7a33\u5b9a\u6027\u4e0e\u53ef\u5851\u6027\u4e0a\u7684\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.260
