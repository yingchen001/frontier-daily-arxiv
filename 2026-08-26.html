"why_notable": null}, {"abstract": "Multimodal medical prediction often faces incomplete pairing: auxiliary modalities with complementary signal are available for only a subset of subjects (or none) and cannot be assumed at deployment. We introduce PANDA (Prototype Anchored Data Alignment), a two-stage framework that transfers auxiliary information to a primary-modality model without auxiliary inputs at inference. Stage 1 learns a shared embedding from the paired subset and estimates class prototypes from auxiliary modalities; Stage 2 trains the primary encoder on all subjects using cross-entropy plus alignment to the frozen prototypes. Because supervision is defined at the class-prototype level, PANDA accommodates arbitrary pairing rates, including zero subject overlap. We evaluate PANDA on two applications. On a 1,021-subject multi-scanner ADNI cohort, we perform AD/CN classification with three auxiliary modalities at distinct pairing rates: tabular scores (44.8%), FDG-PET (18.7%), and external handwriting kinematics (0% overlap). Relative to the same-backbone MRI-only baseline, PANDA attains AUC 0.868 +-0.020 (+7.9pp) and reduces 1.5T CN false positives by 24.3pp; on a fully trainable Conv5-FC3 backbone it reaches AUC 0.893 (best overall). A pairing-rate ablation shows that the joint anchor remains within seed noise from 75% to 5% pairing. On TCGA-Lung survival prediction from whole-slide images with RNA-seq as auxiliary data, PANDA improves over WSI-only on 2-year OS (AUC +3.5pp) and Cox PH (C-index +9.0pts) and outperforms full-fusion training, which underperforms WSI-only, while requiring no RNA at inference; wide confidence intervals on this smaller cohort keep the gains below conventional significance. Overall, PANDA provides a deployment-oriented mechanism for leveraging incomplete auxiliary modalities to improve primary-modality prediction.", "arxiv_id": "2608.25970", "arxiv_url": "https://arxiv.org/abs/2608.25970", "authors": ["Sheethal Bhat", "Mahfuzur Rahman Chowdhury", "Paula Andrea Perez-Toro", "Stephan Wunderlich", "Rose Dawn Bharat", "Siming Bayer", "Andreas Maier"], "brief": "\u8bba\u6587\u63d0\u51fa PANDA\uff0c\u4e00\u79cd\u9762\u5411\u90e8\u5206\u672a\u914d\u5bf9\u591a\u6a21\u6001\u533b\u5b66\u5b66\u4e60\u7684\u4e24\u9636\u6bb5\u539f\u578b\u951a\u5b9a\u5bf9\u9f50\u65b9\u6cd5\uff1a\u5148\u4ece\u914d\u5bf9\u5b50\u96c6\u5b66\u4e60\u5171\u4eab\u5d4c\u5165\u548c\u8f85\u52a9\u6a21\u6001\u7c7b\u522b\u539f\u578b\uff0c\u518d\u7528\u8fd9\u4e9b\u51bb\u7ed3\u539f\u578b\u76d1\u7763\u4e3b\u6a21\u6001\u6a21\u578b\uff0c\u56e0\u6b64\u63a8\u7406\u65f6\u65e0\u9700\u8f85\u52a9\u6a21\u6001\u3002\u5b83\u5728\u963f\u5c14\u8328\u6d77\u9ed8 MRI \u5206\u7c7b\u548c TCGA \u75c5\u7406\u751f\u5b58\u9884\u6d4b\u4e2d\u63d0\u5347\u4e86\u4e3b\u6a21\u6001\u57fa\u7ebf\u8868\u73b0\uff0c\u5e76\u80fd\u9002\u5e94\u5f88\u4f4e\u751a\u81f3\u96f6\u91cd\u53e0\u7684\u6a21\u6001\u914d\u5bf9\u7387\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25970", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u533b\u5b66\u5f71\u50cf", "\u8868\u5f81\u5b66\u4e60", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25970v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PANDA - Prototype-Anchored Alignment for Partially Unpaired Multimodal Learning, with Applications to Alzheimers MRI and TCGA Pathology", "tldr": "\u8bba\u6587\u63d0\u51fa PANDA\uff0c\u4e00\u79cd\u9762\u5411\u90e8\u5206\u672a\u914d\u5bf9\u591a\u6a21\u6001\u533b\u5b66\u5b66\u4e60\u7684\u4e24\u9636\u6bb5\u539f\u578b\u951a\u5b9a\u5bf9\u9f50\u65b9\u6cd5\uff1a\u5148\u4ece\u914d\u5bf9\u5b50\u96c6\u5b66\u4e60\u5171\u4eab\u5d4c\u5165\u548c\u8f85\u52a9\u6a21\u6001\u7c7b\u522b\u539f\u578b\uff0c\u518d\u7528\u8fd9\u4e9b\u51bb\u7ed3\u539f\u578b\u76d1\u7763\u4e3b\u6a21\u6001\u6a21\u578b\uff0c\u56e0\u6b64\u63a8\u7406\u65f6\u65e0\u9700\u8f85\u52a9\u6a21\u6001\u3002\u5b83\u5728\u963f\u5c14\u8328\u6d77\u9ed8 MRI \u5206\u7c7b\u548c TCGA \u75c5\u7406\u751f\u5b58\u9884\u6d4b\u4e2d\u63d0\u5347\u4e86\u4e3b\u6a21\u6001\u57fa\u7ebf\u8868\u73b0\uff0c\u5e76\u80fd\u9002\u5e94\u5f88\u4f4e\u751a\u81f3\u96f6\u91cd\u53e0\u7684\u6a21\u6001\u914d\u5bf9\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Robust Markov Decision Processes (RMDPs) generalize classical MDPs by allowing uncertainty in transition probabilities and optimizing against their worst-case realization. We consider $(s,a)$-rectangular RMDPs with \\emph{linearly defined} uncertainty sets and study parity objectives, which are a canonical representation of $\u03c9$-regular objectives. An uncertainty set is linearly defined if it is described by linear inequalities over the transition distribution together with auxiliary variables, which capture the standard $L_1$ and $L_\\infty$ balls as well as general polytopic uncertainty sets. The quantitative value is the supremum, over all agent policies, of the satisfaction probability guaranteed against the adversarial environment. Previous work studied the qualitative analysis, namely the almost-sure (resp. positive) problem that asks whether a single agent policy guarantees satisfaction with probability one (resp. positive probability) against every environment policy. In this work, we solve the exact quantitative problem. Our contributions are threefold. First, we show that both the agent and the environment admit pure memoryless optimal policies. Second, we give a polynomial-time algorithm for quantitative parity on linearly defined robust Markov chains and use it as a subroutine in a policy-iteration algorithm for RMDPs. The algorithm combines quantitative one-step improvements with qualitative almost-sure improvements. Finally, we report experiments comparing our approach with the explicit reduction to stochastic games.", "arxiv_id": "2608.25968", "arxiv_url": "https://arxiv.org/abs/2608.25968", "authors": ["Ali Asadi", "Krishnendu Chatterjee", "Ehsan Kafshdar Goharshady", "Mehrdad Karrabi", "Alipasha Montaseri", "Ali Shafiee"], "brief": "\u672c\u6587\u7814\u7a76\u5e26\u7ebf\u6027\u4e0d\u786e\u5b9a\u96c6\u7684\u9c81\u68d2 MDP \u5728 parity\uff08\u03c9-\u6b63\u5219\uff09\u76ee\u6807\u4e0b\u7684\u7cbe\u786e\u5b9a\u91cf\u5206\u6790\uff0c\u6c42\u89e3\u5728\u6700\u574f\u73af\u5883\u8f6c\u79fb\u4e0b\u53ef\u4fdd\u8bc1\u7684\u6ee1\u8db3\u6982\u7387\u3002\u4f5c\u8005\u8bc1\u660e\u667a\u80fd\u4f53\u4e0e\u73af\u5883\u5747\u5b58\u5728\u7eaf\u65e0\u8bb0\u5fc6\u6700\u4f18\u7b56\u7565\uff0c\u5e76\u63d0\u51fa\u7ed3\u5408\u5b9a\u91cf\u4e00\u6b65\u6539\u8fdb\u4e0e\u5b9a\u6027\u51e0\u4e4e\u5fc5\u7136\u6539\u8fdb\u7684\u7b56\u7565\u8fed\u4ee3\u7b97\u6cd5\uff0c\u5b9e\u9a8c\u4e0a\u4e0e\u663e\u5f0f\u89c4\u7ea6\u5230\u968f\u673a\u535a\u5f08\u7684\u65b9\u6cd5\u8fdb\u884c\u6bd4\u8f83\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25968", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9c81\u68d2MDP", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u7b56\u7565\u8fed\u4ee3", "\u03c9-\u6b63\u5219\u76ee\u6807"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25968v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Quantitative Analysis of $\u03c9$-Regular Robust MDPs", "tldr": "\u672c\u6587\u7814\u7a76\u5e26\u7ebf\u6027\u4e0d\u786e\u5b9a\u96c6\u7684\u9c81\u68d2 MDP \u5728 parity\uff08\u03c9-\u6b63\u5219\uff09\u76ee\u6807\u4e0b\u7684\u7cbe\u786e\u5b9a\u91cf\u5206\u6790\uff0c\u6c42\u89e3\u5728\u6700\u574f\u73af\u5883\u8f6c\u79fb\u4e0b\u53ef\u4fdd\u8bc1\u7684\u6ee1\u8db3\u6982\u7387\u3002\u4f5c\u8005\u8bc1\u660e\u667a\u80fd\u4f53\u4e0e\u73af\u5883\u5747\u5b58\u5728\u7eaf\u65e0\u8bb0\u5fc6\u6700\u4f18\u7b56\u7565\uff0c\u5e76\u63d0\u51fa\u7ed3\u5408\u5b9a\u91cf\u4e00\u6b65\u6539\u8fdb\u4e0e\u5b9a\u6027\u51e0\u4e4e\u5fc5\u7136\u6539\u8fdb\u7684\u7b56\u7565\u8fed\u4ee3\u7b97\u6cd5\uff0c\u5b9e\u9a8c\u4e0a\u4e0e\u663e\u5f0f\u89c4\u7ea6\u5230\u968f\u673a\u535a\u5f08\u7684\u65b9\u6cd5\u8fdb\u884c\u6bd4\u8f83\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Graph-based RAG improves multi-hop question answering by organizing evidence as a knowledge graph. However, most existing RAG systems process each query in isolation and discard useful reasoning from the LLM\u0027s response after inference. As a result, later related queries need to retrieve evidence and reason from scratch. We propose LivingRAG, a Graph RAG framework with writable and reusable reasoning experience. LivingRAG adds a writable experience store to a graph-based retrieval backbone, enabling verified experiences to be reused during inference in two ways. Stored graph signals help retrieval find entities and passages that were useful in earlier related queries. Stored summaries provide a reference reasoning pattern for answer generation. We analyze online QA streams and find reusable signals from shared entities, graph neighborhoods, and question templates. Experiments on multi-hop QA benchmarks show that LivingRAG improves accuracy over strong RAG baselines and reduces completion-token use when relevant prior experience is reused.", "arxiv_id": "2608.25960", "arxiv_url": "https://arxiv.org/abs/2608.25960", "authors": ["Yuzhuo Cui", "Zongye Zhang", "Qingjie Liu"], "brief": "LivingRAG \u5728\u56fe RAG \u4e2d\u52a0\u5165\u53ef\u5199\u3001\u53ef\u590d\u7528\u7684\u201c\u7ecf\u9a8c\u201d\u5b58\u50a8\uff0c\u628a\u5df2\u9a8c\u8bc1\u7684\u63a8\u7406\u4fe1\u53f7\u548c\u6458\u8981\u7528\u4e8e\u540e\u7eed\u76f8\u5173\u95ee\u9898\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5b83\u5728\u591a\u8df3\u95ee\u7b54\u4e0a\u76f8\u6bd4\u5f3a RAG \u57fa\u7ebf\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e76\u5728\u590d\u7528\u76f8\u5173\u7ecf\u9a8c\u65f6\u51cf\u5c11\u751f\u6210 token \u5f00\u9500\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25960", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u77e5\u8bc6\u56fe\u8c31", "\u591a\u8df3\u95ee\u7b54", "\u7ecf\u9a8c\u590d\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25960v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LivingRAG: Augmenting Graph RAG with Experience", "tldr": "LivingRAG \u5728\u56fe RAG \u4e2d\u52a0\u5165\u53ef\u5199\u3001\u53ef\u590d\u7528\u7684\u201c\u7ecf\u9a8c\u201d\u5b58\u50a8\uff0c\u628a\u5df2\u9a8c\u8bc1\u7684\u63a8\u7406\u4fe1\u53f7\u548c\u6458\u8981\u7528\u4e8e\u540e\u7eed\u76f8\u5173\u95ee\u9898\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5b83\u5728\u591a\u8df3\u95ee\u7b54\u4e0a\u76f8\u6bd4\u5f3a RAG \u57fa\u7ebf\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e76\u5728\u590d\u7528\u76f8\u5173\u7ecf\u9a8c\u65f6\u51cf\u5c11\u751f\u6210 token \u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Physical AI models are evaluated on suites of benchmarks that differ across model reports, leaving the model-by-benchmark matrix sparse and the relationship between benchmarks unmeasured. We construct a matrix of 51 models on 12 physical AI benchmarks, selected from a registry of 51 benchmarks and 152 models by reporting density, combining scores from model cards and benchmark papers with our own evaluation runs under each benchmark\u0027s official protocol. We measure how much information the benchmarks share and show quantitative evidence of Redundancy. Redundancy affects reported rankings: collapsing the two substitute pairs into single columns moves 22 of 51 models by three or more places under an equally weighted average. We then select benchmarks greedily under a utility combining score dispersion with variance not explained by the already-selected set, and obtain a four-benchmark subset retaining 78.5\\% of the utility of all 12, on which we fit a Bradley--Terry ranking. The procedure requires only benchmark-level scores with sufficient overlap and is not specific to physical AI.", "arxiv_id": "2608.25940", "arxiv_url": "https://arxiv.org/abs/2608.25940", "authors": ["Zaruhi Navasardyan", "Hrant Davtyan"], "brief": "\u672c\u6587\u6784\u5efa\u4e8651\u4e2a\u7269\u7406AI\u6a21\u578b\u572812\u4e2a\u57fa\u51c6\u4e0a\u7684\u5f97\u5206\u77e9\u9635\uff0c\u7edf\u8ba1\u5206\u6790\u4e0d\u540c\u57fa\u51c6\u4e4b\u95f4\u7684\u4fe1\u606f\u91cd\u53e0\u4e0e\u5197\u4f59\u3002\u7ed3\u679c\u663e\u793a\u5197\u4f59\u4f1a\u663e\u8457\u5f71\u54cd\u6a21\u578b\u6392\u540d\uff0c\u5408\u5e76\u66ff\u4ee3\u6027\u57fa\u51c6\u540e\u670922\u4e2a\u6a21\u578b\u6392\u540d\u53d8\u5316\u81f3\u5c113\u4f4d\uff1b\u540c\u65f6\u7528\u8d2a\u5fc3\u65b9\u6cd5\u9009\u51fa\u76844\u4e2a\u57fa\u51c6\u53ef\u4fdd\u7559\u5168\u595712\u4e2a\u57fa\u51c678.5%\u7684\u6548\u7528\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25940", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7269\u7406AI", "\u57fa\u51c6\u8bc4\u6d4b", "\u6a21\u578b\u6392\u540d", "\u7edf\u8ba1\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25940v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Statistical Audit of Physical AI Benchmark Redundancy", "tldr": "\u672c\u6587\u6784\u5efa\u4e8651\u4e2a\u7269\u7406AI\u6a21\u578b\u572812\u4e2a\u57fa\u51c6\u4e0a\u7684\u5f97\u5206\u77e9\u9635\uff0c\u7edf\u8ba1\u5206\u6790\u4e0d\u540c\u57fa\u51c6\u4e4b\u95f4\u7684\u4fe1\u606f\u91cd\u53e0\u4e0e\u5197\u4f59\u3002\u7ed3\u679c\u663e\u793a\u5197\u4f59\u4f1a\u663e\u8457\u5f71\u54cd\u6a21\u578b\u6392\u540d\uff0c\u5408\u5e76\u66ff\u4ee3\u6027\u57fa\u51c6\u540e\u670922\u4e2a\u6a21\u578b\u6392\u540d\u53d8\u5316\u81f3\u5c113\u4f4d\uff1b\u540c\u65f6\u7528\u8d2a\u5fc3\u65b9\u6cd5\u9009\u51fa\u76844\u4e2a\u57fa\u51c6\u53ef\u4fdd\u7559\u5168\u595712\u4e2a\u57fa\u51c678.5%\u7684\u6548\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-agent systems (MAS) sometimes already have the potential to answer correctly, but still report a wrong answer. Explaining this outcome is difficult because generation, communication and final answer-selection rules usually change simultaneously. We conceptualize multi-agent reasoning as an evolutionary pipeline of candidate generation, peer communication and terminal selection, wherein consensus without quality control can exhibit patterns of memetic drift. We study two questions: (1) when an LLM judge provides effective selection pressure by supplying a signal of answer correctness for candidates generated in a multi-agent system, and (2) when using that signal improves the reported answer. To map judge reliability, we analysed 15,336 questions from MMLU-Pro, GPQA, MedXpertQA and MuSR, with Humanity\u0027s Last Exam analysed separately. To test these rules, we replayed 81,390 fixed candidate pools drawn from 16,278 questions across five benchmarks. We report three findings. (1) A correct answer is often already present among the generated candidates, but the system can still converge on and report a wrong answer. (2) Judge reliability is not a fixed trait of the model, but varies with the task, the generator and how rare the correct answer is. (3) Combining answer frequency with the judge\u0027s evaluation changed only the final answer-selection rule and raised accuracy from 63.82% to 70.82-70.95%, primarily by rescuing correct answers that were outnumbered by popular errors. In the systems studied here, the value of generating more candidates depends on whether those extra samples make correct answers present, frequent or recognisable. By isolating generation, recognition and selection, these findings establish a diagnostic basis for designing multi-agent architectures that protect generated correct answers from being lost.", "arxiv_id": "2608.25937", "arxiv_url": "https://arxiv.org/abs/2608.25937", "authors": ["Jia-Hao Ji", "Sijie Li", "Jiabei Cheng", "Zixi She", "Jin-Tai Yu", "Zhiyuan Yuan"], "brief": "\u8bba\u6587\u5c06\u591a\u667a\u80fd\u4f53\u63a8\u7406\u62c6\u89e3\u4e3a\u5019\u9009\u7b54\u6848\u751f\u6210\u3001\u540c\u4f34\u4ea4\u6d41\u4e0e\u6700\u7ec8\u9009\u62e9\uff0c\u5206\u6790\u4e3a\u4ec0\u4e48\u7cfb\u7edf\u660e\u660e\u751f\u6210\u4e86\u6b63\u786e\u7b54\u6848\u5374\u4ecd\u4f1a\u62a5\u544a\u9519\u8bef\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u53d1\u73b0\uff0cLLM \u8bc4\u5224\u5668\u7684\u53ef\u9760\u6027\u53d6\u51b3\u4e8e\u4efb\u52a1\u3001\u751f\u6210\u5668\u548c\u6b63\u786e\u7b54\u6848\u7a00\u6709\u5ea6\uff1b\u5c06\u7b54\u6848\u9891\u7387\u4e0e\u8bc4\u5224\u4fe1\u53f7\u7ed3\u5408\uff0c\u4ec5\u6539\u53d8\u6700\u7ec8\u9009\u62e9\u89c4\u5219\u5373\u53ef\u5c06\u51c6\u786e\u7387\u4ece 63.82% \u63d0\u5347\u5230\u7ea6 70.9%\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25937", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7b54\u6848\u9009\u62e9", "\u591a\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25937v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Candidate supply and answer selection shape the value of LLM judging in multi-agent systems", "tldr": "\u8bba\u6587\u5c06\u591a\u667a\u80fd\u4f53\u63a8\u7406\u62c6\u89e3\u4e3a\u5019\u9009\u7b54\u6848\u751f\u6210\u3001\u540c\u4f34\u4ea4\u6d41\u4e0e\u6700\u7ec8\u9009\u62e9\uff0c\u5206\u6790\u4e3a\u4ec0\u4e48\u7cfb\u7edf\u660e\u660e\u751f\u6210\u4e86\u6b63\u786e\u7b54\u6848\u5374\u4ecd\u4f1a\u62a5\u544a\u9519\u8bef\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u53d1\u73b0\uff0cLLM \u8bc4\u5224\u5668\u7684\u53ef\u9760\u6027\u53d6\u51b3\u4e8e\u4efb\u52a1\u3001\u751f\u6210\u5668\u548c\u6b63\u786e\u7b54\u6848\u7a00\u6709\u5ea6\uff1b\u5c06\u7b54\u6848\u9891\u7387\u4e0e\u8bc4\u5224\u4fe1\u53f7\u7ed3\u5408\uff0c\u4ec5\u6539\u53d8\u6700\u7ec8\u9009\u62e9\u89c4\u5219\u5373\u53ef\u5c06\u51c6\u786e\u7387\u4ece 63.82% \u63d0\u5347\u5230\u7ea6 70.9%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation trains a language model on its own generations while a teacher scores them token by token. It combines the dense supervision of imitation learning with the on-policy sampling of reinforcement learning. But it requires a second, larger model to act as teacher. On-Policy Self-Distillation (OPSD) removes that cost. The teacher is the model itself, conditioned on privileged information the student will not have at test time, such as a reference solution, a plan, or environment feedback. The teacher is no stronger than the student, only better informed. Early results were promising, with accuracy comparable to reinforcement learning at a fraction of the generated tokens. But the same asymmetry that produces the signal also biases it. One failure mode now dominates the field: collapse, the progressive narrowing of the set of reasoning paths the model can produce. Collapse is not specific to OPSD, though privileged information aggravates it. This review treats collapse as a symptom governed by three levers: (i) where the signal is applied, that is, how tokens are weighted; (ii) what the teacher is shown, that is, the nature of the privileged information; and (iii) when the signal changes, that is, the teacher\u0027s dynamics and the decay of guidance. We restrict our scope to mathematical reasoning, where the method originated and where its failure modes are best documented. We report no new experiments. The contribution is structural: a shared vocabulary for phenomena named differently across papers, and a clear line between what is settled and what is still disputed.", "arxiv_id": "2608.25936", "arxiv_url": "https://arxiv.org/abs/2608.25936", "authors": ["Justin Robert", "Raheel Qader"], "brief": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e86\u5728\u6570\u5b66\u63a8\u7406\u4e2d\u4f7f\u7528\u7684\u5728\u7b56\u7565\u81ea\u84b8\u998f\uff08OPSD\uff09\uff1a\u6a21\u578b\u7528\u5e26\u6709\u7279\u6743\u4fe1\u606f\u7684\u81ea\u8eab\u7248\u672c\u4f5c\u4e3a\u6559\u5e08\uff0c\u4ece\u800c\u907f\u514d\u989d\u5916\u5927\u6559\u5e08\u6a21\u578b\u6210\u672c\u3002\u6587\u7ae0\u6307\u51fa\u8be5\u65b9\u6cd5\u7684\u6838\u5fc3\u98ce\u9669\u662f\u63a8\u7406\u8def\u5f84\u201c\u574d\u7f29\u201d\uff0c\u5e76\u5c06\u5176\u5f52\u7eb3\u4e3a\u7531\u4fe1\u53f7\u65bd\u52a0\u4f4d\u7f6e\u3001\u7279\u6743\u4fe1\u606f\u5185\u5bb9\u3001\u6559\u5e08\u52a8\u6001\u53d8\u5316\u4e09\u7c7b\u6760\u6746\u5171\u540c\u5f71\u54cd\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25936", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u84b8\u998f", "\u8bed\u8a00\u6a21\u578b", "\u6570\u5b66\u63a8\u7406", "\u6a21\u578b\u574d\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25936v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One Symptom, Three Levers: A Critical Review of On-Policy Self-Distillation", "tldr": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e86\u5728\u6570\u5b66\u63a8\u7406\u4e2d\u4f7f\u7528\u7684\u5728\u7b56\u7565\u81ea\u84b8\u998f\uff08OPSD\uff09\uff1a\u6a21\u578b\u7528\u5e26\u6709\u7279\u6743\u4fe1\u606f\u7684\u81ea\u8eab\u7248\u672c\u4f5c\u4e3a\u6559\u5e08\uff0c\u4ece\u800c\u907f\u514d\u989d\u5916\u5927\u6559\u5e08\u6a21\u578b\u6210\u672c\u3002\u6587\u7ae0\u6307\u51fa\u8be5\u65b9\u6cd5\u7684\u6838\u5fc3\u98ce\u9669\u662f\u63a8\u7406\u8def\u5f84\u201c\u574d\u7f29\u201d\uff0c\u5e76\u5c06\u5176\u5f52\u7eb3\u4e3a\u7531\u4fe1\u53f7\u65bd\u52a0\u4f4d\u7f6e\u3001\u7279\u6743\u4fe1\u606f\u5185\u5bb9\u3001\u6559\u5e08\u52a8\u6001\u53d8\u5316\u4e09\u7c7b\u6760\u6746\u5171\u540c\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated fact-checking (AFC) systems retrieve evidence and predict claim veracity, yet evaluations omit simple baselines, systems are developed for a single benchmark and cannot be trusted to generalise across domains. No prior work cross-evaluates the full two-stage retrieve-then-verify pipeline across diverse datasets, complementing retrieval-only studies (Thakur et al., 2021) and single-stage benchmarking studies (Calamai et al., 2025). We benchmark nine models, ranging from random and sparse baselines to fine-tuned transformers, zero-shot LLMs, and the two highest-ranked systems from the AVeriTeC 2025 shared task, across four datasets spanning scientific, open-web, and climate domains. Three findings stand out: (1) on ClimateCheck claim-only and fine-tuned models outperform zero-shot LLM and top-performing AVeriTeC 2025 systems, highlighting that noisy evidence can degrade veracity prediction; (2) system rankings are strongly domain- and metric-dependent: the best model on SciFact (macro-F1 0.70) drops to 0.31 on ClimateCheck, while the AVeriTeC 2025 winner and runner-up swap rankings based on evaluation metrics and datasets; (3) replacing retrieved evidence with gold annotations improves veracity accuracy by 14-22 points across models, confirming retrieval remains primary bottleneck. We release code, pre-processed datasets, and all results to support reproducible AFC research.", "arxiv_id": "2608.25934", "arxiv_url": "https://arxiv.org/abs/2608.25934", "authors": ["Aida Usmanova", "Zangir Iklassov", "Markus Leippold", "Ricardo Usbeck"], "brief": "\u672c\u6587\u8de84\u4e2a\u79d1\u5b66\u3001\u5f00\u653e\u7f51\u7edc\u548c\u6c14\u5019\u9886\u57df\u6570\u636e\u96c6\u8bc4\u6d4b9\u7c7b\u81ea\u52a8\u4e8b\u5b9e\u6838\u67e5\u7cfb\u7edf\uff0c\u8986\u76d6\u968f\u673a/\u7a00\u758f\u57fa\u7ebf\u3001\u5fae\u8c03Transformer\u3001\u96f6\u6837\u672cLLM\u4ee5\u53caAVeriTeC 2025\u9876\u5c16\u7cfb\u7edf\u3002\u7ed3\u679c\u663e\u793a\u7cfb\u7edf\u9c81\u68d2\u6027\u8f83\u5f31\uff0c\u6392\u540d\u9ad8\u5ea6\u4f9d\u8d56\u9886\u57df\u548c\u6307\u6807\uff0c\u4e14\u4f7f\u7528\u91d1\u6807\u51c6\u8bc1\u636e\u53ef\u5c06\u771f\u5b9e\u6027\u5224\u65ad\u51c6\u786e\u7387\u63d0\u534714-22\u4e2a\u767e\u5206\u70b9\uff0c\u8bf4\u660e\u8bc1\u636e\u68c0\u7d22\u4ecd\u662f\u4e3b\u8981\u74f6\u9888\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25934", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e8b\u5b9e\u6838\u67e5", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u68c0\u7d22", "\u9c81\u68d2\u6027\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25934v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Robust Are Automated Fact-Checking Systems? A Cross-Benchmark Evaluation", "tldr": "\u672c\u6587\u8de84\u4e2a\u79d1\u5b66\u3001\u5f00\u653e\u7f51\u7edc\u548c\u6c14\u5019\u9886\u57df\u6570\u636e\u96c6\u8bc4\u6d4b9\u7c7b\u81ea\u52a8\u4e8b\u5b9e\u6838\u67e5\u7cfb\u7edf\uff0c\u8986\u76d6\u968f\u673a/\u7a00\u758f\u57fa\u7ebf\u3001\u5fae\u8c03Transformer\u3001\u96f6\u6837\u672cLLM\u4ee5\u53caAVeriTeC 2025\u9876\u5c16\u7cfb\u7edf\u3002\u7ed3\u679c\u663e\u793a\u7cfb\u7edf\u9c81\u68d2\u6027\u8f83\u5f31\uff0c\u6392\u540d\u9ad8\u5ea6\u4f9d\u8d56\u9886\u57df\u548c\u6307\u6807\uff0c\u4e14\u4f7f\u7528\u91d1\u6807\u51c6\u8bc1\u636e\u53ef\u5c06\u771f\u5b9e\u6027\u5224\u65ad\u51c6\u786e\u7387\u63d0\u534714-22\u4e2a\u767e\u5206\u70b9\uff0c\u8bf4\u660e\u8bc1\u636e\u68c0\u7d22\u4ecd\u662f\u4e3b\u8981\u74f6\u9888\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "*Chulin Zhao and Ruoqi Hu contributed equally to this work. State-of-the-art text-to-image (T2I) models exhibit pronounced and systematic defects when prompts involve intricate compositional factors such as multiple entities and multiple attributes. In this paper, we investigate how humans identify such defects. Specifically, we manually select 651 reference images from the four categories of people, hand, object, and scene that exhibit complex compositional characteristics, from which prompts emphasizing compositional factors are derived by manually editing ChatGPT-generated prompts. We then feed the prompts into three selected T2I models to generate AI images and conduct a comprehensive subjective study to identify their defects. For each image, 29 participants provide multi-label assessments specifying defect types and locations. The study yields the compositional AI-generated image defect (CO-AID) dataset, including reference images, prompts, AI-generated images, and information on defect locations and types. Experimental results show that training a deep model on CO-AID can both predict defects in AI-generated images and optimize AI image generation, demonstrating its usability and effectiveness. The database and supplementary materials are available at: https://github.com/Future-IQA/CO-AID .", "arxiv_id": "2608.25933", "arxiv_url": "https://arxiv.org/abs/2608.25933", "authors": ["Ruoqi Hu", "Chulin Zhao", "Jiashuo Chang", "Ramon Ruiz-Dolz", "Hanhe Lin"], "brief": "\u672c\u6587\u7814\u7a76\u4eba\u7c7b\u5982\u4f55\u8bc6\u522b\u590d\u6742\u7ec4\u5408\u63d0\u793a\u4e0b\u6587\u751f\u56fe\u6a21\u578b\u751f\u6210\u56fe\u50cf\u4e2d\u7684\u7cfb\u7edf\u6027\u7f3a\u9677\uff0c\u6784\u5efa\u4e86 CO-AID \u6570\u636e\u96c6\uff0c\u5305\u542b\u53c2\u8003\u56fe\u3001\u63d0\u793a\u8bcd\u3001AI \u751f\u6210\u56fe\u4ee5\u53ca\u7f3a\u9677\u7c7b\u578b\u548c\u4f4d\u7f6e\u6807\u6ce8\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u7528\u8be5\u6570\u636e\u96c6\u8bad\u7ec3\u7684\u6df1\u5ea6\u6a21\u578b\u53ef\u9884\u6d4b\u751f\u6210\u56fe\u50cf\u7f3a\u9677\uff0c\u5e76\u7528\u4e8e\u4f18\u5316 AI \u56fe\u50cf\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25933", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u751f\u56fe", "\u56fe\u50cf\u8d28\u91cf\u8bc4\u4f30", "\u7ec4\u5408\u6cdb\u5316", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25933v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Composition Doesn\u0027t Add Up: Humans Identifying Defects in AI-Generated Images", "tldr": "\u672c\u6587\u7814\u7a76\u4eba\u7c7b\u5982\u4f55\u8bc6\u522b\u590d\u6742\u7ec4\u5408\u63d0\u793a\u4e0b\u6587\u751f\u56fe\u6a21\u578b\u751f\u6210\u56fe\u50cf\u4e2d\u7684\u7cfb\u7edf\u6027\u7f3a\u9677\uff0c\u6784\u5efa\u4e86 CO-AID \u6570\u636e\u96c6\uff0c\u5305\u542b\u53c2\u8003\u56fe\u3001\u63d0\u793a\u8bcd\u3001AI \u751f\u6210\u56fe\u4ee5\u53ca\u7f3a\u9677\u7c7b\u578b\u548c\u4f4d\u7f6e\u6807\u6ce8\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u7528\u8be5\u6570\u636e\u96c6\u8bad\u7ec3\u7684\u6df1\u5ea6\u6a21\u578b\u53ef\u9884\u6d4b\u751f\u6210\u56fe\u50cf\u7f3a\u9677\uff0c\u5e76\u7528\u4e8e\u4f18\u5316 AI \u56fe\u50cf\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Air traffic control procedures are executed through spoken exchanges between controllers and pilots. These interactions are essential to the safety of air transportation: failures in their execution can create severe operational hazards, as evidenced by past fatal accidents. Assessing whether an instruction has been followed requires relating what was said to the aircraft concerned, its state, and the obligations that pilots must meet. We present a runtime verification framework that monitors such procedures by checking controller-pilot exchanges, surveillance data, and onboard observations. The framework parses radio communications into events linked to the entities they concern and merges them with surveillance and onboard observations into a time-stamped trace. The ICAO-derived obligations as formalized as temporal formulas with explicit time bounds and evaluated over execution traces. Every violation is reported along with the breached obligations and the observations that support the verdict. With real traffic, the complete pipeline reaches an F1 of 0.85 against blind human-annotated violations; in 1,495 synthetic situations derived from two public corpora, the monitor logic returns the expected verdict in every case. In two historical accidents reconstructed from official investigation reports, the monitor identifies the same procedural deviations documented by the investigators.", "arxiv_id": "2608.25926", "arxiv_url": "https://arxiv.org/abs/2608.25926", "authors": ["Roberto Luvini", "Giacomo Longo", "Alessandro Armando", "Enrico Russo"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u7a7a\u7ba1\u8bed\u97f3\u7a0b\u5e8f\u7684\u8fd0\u884c\u65f6\u9a8c\u8bc1\u6846\u67b6\uff0c\u5c06\u7ba1\u5236\u5458-\u98de\u884c\u5458\u901a\u8bdd\u89e3\u6790\u4e3a\u4e8b\u4ef6\uff0c\u5e76\u7ed3\u5408\u96f7\u8fbe\u76d1\u89c6\u4e0e\u673a\u8f7d\u89c2\u6d4b\u5f62\u6210\u65f6\u95f4\u8f68\u8ff9\u3002\u7cfb\u7edf\u7528\u5e26\u65f6\u95f4\u7ea6\u675f\u7684\u65f6\u5e8f\u903b\u8f91\u68c0\u67e5 ICAO \u7a0b\u5e8f\u4e49\u52a1\uff0c\u80fd\u7ed9\u51fa\u53ef\u89e3\u91ca\u8fdd\u89c4\u8bc1\u636e\uff1b\u771f\u5b9e\u4ea4\u901a\u6570\u636e\u4e0a\u8fdd\u89c4\u68c0\u6d4b F1 \u8fbe\u5230 0.85\uff0c\u5408\u6210\u4e0e\u4e8b\u6545\u590d\u73b0\u5b9e\u9a8c\u4e5f\u9a8c\u8bc1\u4e86\u76d1\u63a7\u903b\u8f91\u7684\u53ef\u9760\u6027\u3002", "categories": ["cs.AI", "cs.CL", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25926", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fd0\u884c\u65f6\u9a8c\u8bc1", "\u8bed\u97f3\u7406\u89e3", "\u65f6\u5e8f\u903b\u8f91", "\u822a\u7a7a\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25926v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Formal, Executable and Explainable Runtime Monitoring of Spoken Air Traffic Control Operational Procedures", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u7a7a\u7ba1\u8bed\u97f3\u7a0b\u5e8f\u7684\u8fd0\u884c\u65f6\u9a8c\u8bc1\u6846\u67b6\uff0c\u5c06\u7ba1\u5236\u5458-\u98de\u884c\u5458\u901a\u8bdd\u89e3\u6790\u4e3a\u4e8b\u4ef6\uff0c\u5e76\u7ed3\u5408\u96f7\u8fbe\u76d1\u89c6\u4e0e\u673a\u8f7d\u89c2\u6d4b\u5f62\u6210\u65f6\u95f4\u8f68\u8ff9\u3002\u7cfb\u7edf\u7528\u5e26\u65f6\u95f4\u7ea6\u675f\u7684\u65f6\u5e8f\u903b\u8f91\u68c0\u67e5 ICAO \u7a0b\u5e8f\u4e49\u52a1\uff0c\u80fd\u7ed9\u51fa\u53ef\u89e3\u91ca\u8fdd\u89c4\u8bc1\u636e\uff1b\u771f\u5b9e\u4ea4\u901a\u6570\u636e\u4e0a\u8fdd\u89c4\u68c0\u6d4b F1 \u8fbe\u5230 0.85\uff0c\u5408\u6210\u4e0e\u4e8b\u6545\u590d\u73b0\u5b9e\u9a8c\u4e5f\u9a8c\u8bc1\u4e86\u76d1\u63a7\u903b\u8f91\u7684\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "GNN-based Knowledge Graph Question Answering (KGQA) pipelines process queries through four discrete stages: entity linking, subgraph retrieval, GNN reasoning, and answer generation. Standard robustness evaluations conflate stage-level failures into a single end-to-end metric, obscuring both the source of brittleness and the appropriate mitigation target. We ask which stage fails, and why, when the pipeline is subjected to adversarial perturbations on the input question. We introduce a stage-isolation protocol with two answer-preserving adversarial perturbations verified against the knowledge graph: Compositional Restructuring (CR) and Relation Synonym Swap (RS) target distinct stages while leaving entity seeds intact. Evaluated across ComplexWebQuestions and WebQSP, the results run counter to prevailing assumptions: the GNN reasoning stage retains near-baseline accuracy when the subgraph is intact, while subgraph construction accounts for over 99\\% of the end-to-end collapse under CR, occurring even when the gold answer is present in 74\\% of retrieved subgraphs. This exposes a fundamental distinction between answer presence and answer reachability that end-to-end metrics cannot detect, and places the mitigation target firmly at the subgraph construction stage rather than the reasoning model. Perturbed datasets and evaluation infrastructure are released at https://anonymous.4open.science/r/atkgrag-E85C .", "arxiv_id": "2608.25922", "arxiv_url": "https://arxiv.org/abs/2608.25922", "authors": ["Pankaj Kumar", "Subhankar Mishra"], "brief": "\u672c\u6587\u7814\u7a76\u57fa\u4e8e GNN \u7684\u77e5\u8bc6\u56fe\u8c31\u95ee\u7b54\u5728\u8f93\u5165\u95ee\u9898\u53d7\u5230\u5bf9\u6297\u6270\u52a8\u65f6\u7a76\u7adf\u54ea\u4e2a\u9636\u6bb5\u5931\u6548\uff0c\u63d0\u51fa\u9636\u6bb5\u9694\u79bb\u8bc4\u6d4b\u534f\u8bae\uff0c\u5e76\u4f7f\u7528\u4fdd\u6301\u7b54\u6848\u4e0d\u53d8\u7684\u7ec4\u5408\u91cd\u6784\u548c\u5173\u7cfb\u540c\u4e49\u66ff\u6362\u6270\u52a8\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u53ea\u8981\u5b50\u56fe\u5b8c\u6574\uff0cGNN \u63a8\u7406\u51e0\u4e4e\u4fdd\u6301\u57fa\u7ebf\u8868\u73b0\uff1b\u7aef\u5230\u7aef\u5d29\u6e83\u4e3b\u8981\u6765\u81ea\u5b50\u56fe\u6784\u5efa\u9636\u6bb5\uff0c\u4e14\u63ed\u793a\u4e86\u201c\u7b54\u6848\u5b58\u5728\u201d\u548c\u201c\u7b54\u6848\u53ef\u8fbe\u201d\u7684\u5173\u952e\u5dee\u5f02\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25922", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31\u95ee\u7b54", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u9c81\u68d2\u6027", "\u5bf9\u6297\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25922v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Query-Side Attacks on GNN-Based KGQA: Tracing Failures from Entity Linking to Answer Generation", "tldr": "\u672c\u6587\u7814\u7a76\u57fa\u4e8e GNN \u7684\u77e5\u8bc6\u56fe\u8c31\u95ee\u7b54\u5728\u8f93\u5165\u95ee\u9898\u53d7\u5230\u5bf9\u6297\u6270\u52a8\u65f6\u7a76\u7adf\u54ea\u4e2a\u9636\u6bb5\u5931\u6548\uff0c\u63d0\u51fa\u9636\u6bb5\u9694\u79bb\u8bc4\u6d4b\u534f\u8bae\uff0c\u5e76\u4f7f\u7528\u4fdd\u6301\u7b54\u6848\u4e0d\u53d8\u7684\u7ec4\u5408\u91cd\u6784\u548c\u5173\u7cfb\u540c\u4e49\u66ff\u6362\u6270\u52a8\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u53ea\u8981\u5b50\u56fe\u5b8c\u6574\uff0cGNN \u63a8\u7406\u51e0\u4e4e\u4fdd\u6301\u57fa\u7ebf\u8868\u73b0\uff1b\u7aef\u5230\u7aef\u5d29\u6e83\u4e3b\u8981\u6765\u81ea\u5b50\u56fe\u6784\u5efa\u9636\u6bb5\uff0c\u4e14\u63ed\u793a\u4e86\u201c\u7b54\u6848\u5b58\u5728\u201d\u548c\u201c\u7b54\u6848\u53ef\u8fbe\u201d\u7684\u5173\u952e\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As large language model (LLM)-based multi-agent systems (MASs) are increasingly applied to long-horizon complex tasks, their reliability has emerged as the core bottleneck hindering their real-world deployment. Existing MAS debugging and repair methods typically rely on rerunning and resampling the entire execution trajectory. However, a fundamental question remains to be answered: do these methods causally repair MAS failures or merely stochastically repair by leveraging the randomness of LLM sampling? To evaluate the effectiveness of MAS repair methods, we introduce SymTrace, a controlled evaluation framework that records the MAS execution trajectory and establishes intervention anchors. During replay, it effectively reconstructs the execution before the anchor using recorded logs and only regenerates the downstream trajectory, thereby enabling the reliable reproduction of MAS failures. We further construct the dataset SymFail, comprising 536 human-annotated failure trajectories with graph-linked locations, categories, and trace evidence. Based on these foundations, we conduct a large-scale empirical study across three mainstream MAS frameworks. Our findings reveal that existing unguided rerun methods are highly unreliable, exhibiting low failure reproduction and repair rates (only 67.97% and 6.90%, respectively). Building upon these findings, we further explore the effectiveness of a symptom-driven intervention method, which successfully repairs 20.15% of the failed cases (a 191.89% improvement to state-of-the-art repair methods). This study aims to provide actionable insights for MAS debugging and repair research, paving the way for the robust deployment of multi-agent systems.", "arxiv_id": "2608.25920", "arxiv_url": "https://arxiv.org/abs/2608.25920", "authors": ["Zhongwen Luan", "Xiaoyu Zhang", "Ming Hu", "Yue Yang", "Jiongchi Yu", "Xiaohong Chen"], "brief": "\u8bba\u6587\u63d0\u51fa SymTrace\uff0c\u4e00\u4e2a\u53ef\u63a7\u8bc4\u4f30\u6846\u67b6\uff0c\u901a\u8fc7\u8bb0\u5f55\u591a\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u5e76\u5728\u951a\u70b9\u540e\u91cd\u653e/\u518d\u751f\u6210\uff0c\u533a\u5206\u771f\u6b63\u56e0\u679c\u4fee\u590d\u4e0e\u4f9d\u8d56\u968f\u673a\u91cd\u91c7\u6837\u7684\u201c\u78b0\u5de7\u4fee\u590d\u201d\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u542b 536 \u6761\u4eba\u5de5\u6807\u6ce8\u5931\u8d25\u8f68\u8ff9\u7684 SymFail \u6570\u636e\u96c6\uff0c\u5e76\u5728\u4e09\u79cd\u4e3b\u6d41\u591a\u667a\u80fd\u4f53\u6846\u67b6\u4e0a\u53d1\u73b0\u73b0\u6709\u65e0\u5f15\u5bfc\u91cd\u8dd1\u65b9\u6cd5\u4fee\u590d\u7387\u4ec5 6.90%\uff1b\u75c7\u72b6\u9a71\u52a8\u5e72\u9884\u53ef\u5c06\u4fee\u590d\u7387\u63d0\u5347\u5230 20.15%\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25920", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8c03\u8bd5\u4fee\u590d", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25920v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Repair or Resample? Rethinking Failure Debugging in LLM Multi-Agent Systems", "tldr": "\u8bba\u6587\u63d0\u51fa SymTrace\uff0c\u4e00\u4e2a\u53ef\u63a7\u8bc4\u4f30\u6846\u67b6\uff0c\u901a\u8fc7\u8bb0\u5f55\u591a\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u5e76\u5728\u951a\u70b9\u540e\u91cd\u653e/\u518d\u751f\u6210\uff0c\u533a\u5206\u771f\u6b63\u56e0\u679c\u4fee\u590d\u4e0e\u4f9d\u8d56\u968f\u673a\u91cd\u91c7\u6837\u7684\u201c\u78b0\u5de7\u4fee\u590d\u201d\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u542b 536 \u6761\u4eba\u5de5\u6807\u6ce8\u5931\u8d25\u8f68\u8ff9\u7684 SymFail \u6570\u636e\u96c6\uff0c\u5e76\u5728\u4e09\u79cd\u4e3b\u6d41\u591a\u667a\u80fd\u4f53\u6846\u67b6\u4e0a\u53d1\u73b0\u73b0\u6709\u65e0\u5f15\u5bfc\u91cd\u8dd1\u65b9\u6cd5\u4fee\u590d\u7387\u4ec5 6.90%\uff1b\u75c7\u72b6\u9a71\u52a8\u5e72\u9884\u53ef\u5c06\u4fee\u590d\u7387\u63d0\u5347\u5230 20.15%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Game-theoretic models provide principled frameworks for modeling vehicle interactions, but their underlying temporal assumptions have not been systematically examined against real-world driving behavior. In particular, it remains unclear how simultaneous, sequential, and asymmetric interaction structures can be measured from vehicle trajectories. This paper develops a trajectory-based interaction measurement framework to identify interaction events and quantify behavioral change onset, temporal organization, post-onset response dynamics, and ordering stability. The framework uses behavioral deviations to verify candidate interactions. We evaluate the framework on six real-world trajectory datasets, including INTERACTION, highD, inD, rounD, Waymo Open Motion, and nuPlan, covering diverse road geometries, traffic environments, and interaction types. The results show that concurrent and sequential behavioral changes both constitute substantial proportions of observed following, merging, and conflicting interactions. Among sequential interactions, stable ordering is more prevalent than alternating ordering, indicating that persistent asymmetric roles are a common interaction structure. Importantly, temporal precedence does not necessarily coincide with a measurable behavioral response, indicating that temporal ordering alone may not be sufficient to characterize behavioral dependence. These findings show that real-world interactions exhibit concurrent, sequential, and persistently ordered temporal structures. Different game-theoretic formulations are therefore better regarded as complementary modeling abstractions for different interaction regimes rather than as a universal structure governing all vehicle interactions.", "arxiv_id": "2608.25917", "arxiv_url": "https://arxiv.org/abs/2608.25917", "authors": ["Yueyuan Li", "Rongcheng Nie", "Weijie Xi", "Mingyang Jiang", "Songan Zhang", "Hanyang Zhuang", "Ming Yang"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u8f68\u8ff9\u7684\u4ea4\u4e92\u6d4b\u91cf\u6846\u67b6\uff0c\u7528\u4e8e\u4ece\u771f\u5b9e\u8f66\u8f86\u8f68\u8ff9\u4e2d\u8bc6\u522b\u4ea4\u4e92\u4e8b\u4ef6\uff0c\u5e76\u91cf\u5316\u884c\u4e3a\u53d8\u5316\u7684\u8d77\u70b9\u3001\u65f6\u5e8f\u7ed3\u6784\u3001\u54cd\u5e94\u52a8\u6001\u548c\u6392\u5e8f\u7a33\u5b9a\u6027\u3002\u57fa\u4e8e\u516d\u4e2a\u771f\u5b9e\u9a7e\u9a76\u6570\u636e\u96c6\u7684\u5206\u6790\u8868\u660e\uff0c\u8f66\u8f86\u4ea4\u4e92\u540c\u65f6\u5b58\u5728\u5e76\u53d1\u3001\u987a\u5e8f\u548c\u7a33\u5b9a\u975e\u5bf9\u79f0\u7b49\u7ed3\u6784\uff0c\u8bf4\u660e\u4e0d\u540c\u535a\u5f08\u8bba\u6a21\u578b\u66f4\u9002\u5408\u4f5c\u4e3a\u4e92\u8865\u62bd\u8c61\uff0c\u800c\u975e\u7edf\u4e00\u89e3\u91ca\u6240\u6709\u4ea4\u4e92\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25917", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u535a\u5f08\u8bba", "\u8f66\u8f86\u4ea4\u4e92", "\u8f68\u8ff9\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25917v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Choose Your Game Wisely: Measuring Game-Theoretic Structures in Real-World Vehicle Interactions", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u8f68\u8ff9\u7684\u4ea4\u4e92\u6d4b\u91cf\u6846\u67b6\uff0c\u7528\u4e8e\u4ece\u771f\u5b9e\u8f66\u8f86\u8f68\u8ff9\u4e2d\u8bc6\u522b\u4ea4\u4e92\u4e8b\u4ef6\uff0c\u5e76\u91cf\u5316\u884c\u4e3a\u53d8\u5316\u7684\u8d77\u70b9\u3001\u65f6\u5e8f\u7ed3\u6784\u3001\u54cd\u5e94\u52a8\u6001\u548c\u6392\u5e8f\u7a33\u5b9a\u6027\u3002\u57fa\u4e8e\u516d\u4e2a\u771f\u5b9e\u9a7e\u9a76\u6570\u636e\u96c6\u7684\u5206\u6790\u8868\u660e\uff0c\u8f66\u8f86\u4ea4\u4e92\u540c\u65f6\u5b58\u5728\u5e76\u53d1\u3001\u987a\u5e8f\u548c\u7a33\u5b9a\u975e\u5bf9\u79f0\u7b49\u7ed3\u6784\uff0c\u8bf4\u660e\u4e0d\u540c\u535a\u5f08\u8bba\u6a21\u578b\u66f4\u9002\u5408\u4f5c\u4e3a\u4e92\u8865\u62bd\u8c61\uff0c\u800c\u975e\u7edf\u4e00\u89e3\u91ca\u6240\u6709\u4ea4\u4e92\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Explaining deep learning models operating on time series data is crucial in various applications that require transparent and interpretable insights into model behavior. {Existing explanation methods generally fall into two categories: attribution-based explanations, which identify the temporal regions most responsible for a prediction, and counterfactual explanations, which reveal how an input should be modified to alter the model\u0027s decision.} {Despite valuable insights, these two fields are largely studied independently. This disconnect leaves attribution methods lacking causal validation, while counterfactual methods suffer from severe instability, producing adversarial-like noise instead of meaningful explanations.} In this work, we revisit time-series explainability from an information-theoretic perspective and show that existing explainers are vulnerable to trivial solutions and distributional shifts. To address these limitations, we propose a unified objective function for explainable time series learning that bridges attribution and counterfactual reasoning within a single framework. Building upon the Information Bottleneck principle, our formulation explicitly prevents trivial explanations and out-of-distribution counterfactuals. {Based on this objective function, we introduce {\\modelname}, a novel explanation framework that learns a parametric transformation network to construct explanation-embedded instances, where preserved information yields attribution explanations and controlled information removal produces stable counterfactual explanations.} We evaluate {\\modelname} on synthetic and real-world benchmarks against state-of-the-art baselines. Extensive quantitative and qualitative results show that {\\modelname} consistently outperforms competing methods, yielding faithful attributions and stable counterfactual explanations.", "arxiv_id": "2608.25897", "arxiv_url": "https://arxiv.org/abs/2608.25897", "authors": ["Xu Zheng", "Zichuan Liu", "Zhuomin Chen", "Mayur Akewar", "Janki Bhimani", "Jason Liu", "Mo Sha", "Jingchao Ni", "Wei Cheng", "Dongsheng Luo"], "brief": "\u8bba\u6587\u4ece\u4fe1\u606f\u74f6\u9888\u89c6\u89d2\u7edf\u4e00\u65f6\u95f4\u5e8f\u5217\u53ef\u89e3\u91ca\u6027\u4e2d\u7684\u5f52\u56e0\u89e3\u91ca\u4e0e\u53cd\u4e8b\u5b9e\u89e3\u91ca\uff0c\u6307\u51fa\u73b0\u6709\u65b9\u6cd5\u6613\u51fa\u73b0\u5e73\u51e1\u89e3\u3001\u5206\u5e03\u504f\u79fb\u548c\u4e0d\u7a33\u5b9a\u566a\u58f0\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u4e2a\u7edf\u4e00\u76ee\u6807\u548c\u53c2\u6570\u5316\u53d8\u6362\u6846\u67b6\uff0c\u53ef\u540c\u65f6\u751f\u6210\u5fe0\u5b9e\u5f52\u56e0\u4e0e\u7a33\u5b9a\u53cd\u4e8b\u5b9e\uff0c\u5728\u5408\u6210\u548c\u771f\u5b9e\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25897", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u53ef\u89e3\u91ca\u6027", "\u4fe1\u606f\u74f6\u9888", "\u53cd\u4e8b\u5b9e\u89e3\u91ca"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25897v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards A Unified Information Bottleneck Framework for Time Series Explanations", "tldr": "\u8bba\u6587\u4ece\u4fe1\u606f\u74f6\u9888\u89c6\u89d2\u7edf\u4e00\u65f6\u95f4\u5e8f\u5217\u53ef\u89e3\u91ca\u6027\u4e2d\u7684\u5f52\u56e0\u89e3\u91ca\u4e0e\u53cd\u4e8b\u5b9e\u89e3\u91ca\uff0c\u6307\u51fa\u73b0\u6709\u65b9\u6cd5\u6613\u51fa\u73b0\u5e73\u51e1\u89e3\u3001\u5206\u5e03\u504f\u79fb\u548c\u4e0d\u7a33\u5b9a\u566a\u58f0\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u4e2a\u7edf\u4e00\u76ee\u6807\u548c\u53c2\u6570\u5316\u53d8\u6362\u6846\u67b6\uff0c\u53ef\u540c\u65f6\u751f\u6210\u5fe0\u5b9e\u5f52\u56e0\u4e0e\u7a33\u5b9a\u53cd\u4e8b\u5b9e\uff0c\u5728\u5408\u6210\u548c\u771f\u5b9e\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal protein language models (pLMs) learn joint protein sequence-structure distributions, and their generation performance should also depend critically on inference-time sampling strategies. Yet prior work has focused more on model training than on how inference-time strategies behave. In this paper, we establish a three-stage investigation framework to empirically study the inference design space of multimodal pLMs across three representative pLMs and four fundamental tasks. We evaluate vanilla sampling, task-specific classifier-free guidance, and reward-guided beam search on multimodal pLMs, corresponding to controls over sampling distributions, per-step logits, and parallel trajectories. Throughout the complementary advancements centered on exploration-exploitation trade-off, we (1) reveal the suboptimality of default inference protocols and identify task-oriented sampling preferences; (2) observe substantial quantitative gains across tasks, consistently boosting the upper bound performance of multimodal pLMs without updating model parameters; (3) derive conclusions about base models that differ from prior consensus.", "arxiv_id": "2608.25855", "arxiv_url": "https://arxiv.org/abs/2608.25855", "authors": ["Yi Zhou", "Qipeng Wang", "Yunqing Liu", "Jun Xia", "Qing Li", "Wenqi Fan"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u591a\u6a21\u6001\u86cb\u767d\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u9636\u6bb5\u7684\u91c7\u6837\u7b56\u7565\uff0c\u8986\u76d6\u4e09\u4e2a\u4ee3\u8868\u6027\u6a21\u578b\u548c\u56db\u7c7b\u57fa\u7840\u4efb\u52a1\u3002\u7ed3\u679c\u8868\u660e\uff0c\u9ed8\u8ba4\u63a8\u7406\u534f\u8bae\u5f80\u5f80\u6b21\u4f18\uff0c\u800c\u4efb\u52a1\u7279\u5b9a\u91c7\u6837\u3001\u5206\u7c7b\u5668\u65e0\u5173\u5f15\u5bfc\u548c\u5956\u52b1\u5f15\u5bfc\u675f\u641c\u7d22\u53ef\u5728\u4e0d\u66f4\u65b0\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u751f\u6210\u6027\u80fd\uff0c\u5e76\u6539\u53d8\u5bf9\u57fa\u7840\u6a21\u578b\u4f18\u52a3\u observed audio representations are organized by recording device and dataset rather than TB status, predicted TB probability tracks country-level prevalence in CODA, and device mismatch degrades transfer while device-diverse training improves it. Additionally, a clinical-variable baseline generalizes more consistently (ROC-AUC $0.655 - 0.711$), indicating acquisition-specific variability is a stronger driver of poor generalizability than population shift. High within-dataset performance is not enough. External validation is essential before cough-based TB models are clinically ready.", "arxiv_id": "2608.25846", "arxiv_url": "https://arxiv.org/abs/2608.25846", "authors": ["Wensi Zhang", "Tomas Teijeiro", "J\u00e9r\u00f4me Thevenot", "David Atienza"], "brief": "\u8be5\u8bba\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e86\u57fa\u4e8e\u54b3\u55fd\u97f3\u9891\u7684\u7ed3\u6838\u7b5b\u67e5\u6a21\u578b\u5728\u4e09\u4e2a\u72ec\u7acb\u6570\u636e\u96c6\u95f4\u7684\u6cdb\u5316\u80fd\u529b\uff0c\u53d1\u73b0\u4f20\u7edf\u673a\u5668\u5b66\u4e60\u548c\u6df1\u5ea6\u5b66\u4e60\u65b9\u6cd5\u867d\u5728\u540c\u6570\u636e\u96c6\u5185\u8868\u73b0\u5c1a\u53ef\uff0c\u4f46\u8de8\u6570\u636e\u96c6 ROC-AUC \u7ecf\u5e38\u4f4e\u4e8e 0.6\u3002\u5206\u6790\u8868\u660e\u97f3\u9891\u8868\u5f81\u66f4\u591a\u53d7\u5f55\u97f3\u8bbe\u5907\u548c\u6570\u636e\u96c6\u6765\u6e90\u5f71\u54cd\uff0c\u800c\u975e\u7ed3\u6838\u72b6\u6001\uff1b\u8bbe\u5907\u591a\u6837\u5316\u8bad\u7ec3\u53ef\u6539\u5584\u8fc1\u79fb\uff0c\u4f46\u4e34\u5e8a\u53d8\u91cf\u57fa\u7ebf\u53cd\u800c\u66f4\u7a33\u5b9a\u3002\u7ed3\u8bba\u5f3a\u8c03\u6b64\u7c7b\u6a21\u578b\u5728\u4e34\u5e8a\u5e94\u7528\u524d\u5fc5\u987b\u8fdb\u884c\u4e25\u683c\u5916\u90e8\u9a8c\u8bc1\u3002", "categories": ["eess.AS", "cs.AI", "cs.LG", "cs.SD", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25846", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597AI", "\u97f3\u9891\u5206\u let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
