95", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u6301\u7eed\u5b66\u4e60", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u707e\u96be\u6027\u9057\u5fd8"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26095v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Visual Dependence-Aware Framework for Multimodal Unsupervised Continual Post-Training", "tldr": "\u672c\u6587\u63d0\u51fa\u591a\u6a21\u6001\u65e0\u76d1\u7763\u6301\u7eed\u540e\u8bad\u7ec3\uff08MU-CPT\uff09\u4efb\u52a1\uff0c\u4f7f\u5df2\u90e8\u7f72\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u80fd\u4ece\u6d41\u5f0f\u65e0\u6807\u6ce8\u6570\u636e\u4e2d\u6301\u7eed\u5b66\u4e60\u3002\u65b9\u6cd5\u5229\u7528 token \u7ea7\u89c6\u89c9\u4f9d\u8d56\u6765\u540c\u65f6\u7f13\u89e3\u8de8\u6a21\u6001\u707e\u96be\u6027\u9057\u5fd8\u5e76\u63d0\u5347\u65b0\u4efb\u52a1\u5b66\u4e60\u80fd\u529b\uff0c\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u8be5\u6846\u67b6\u5728\u7a33\u5b9a\u6027\u4e0e\u53ef\u5851\u6027\u4e0a\u7684\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing action quality assessment (AQA) datasets and methods rely primarily on visual inputs such as RGB and pose, overlooking physiological dynamics such as muscle mechanics and often modeling actions as monolithic patterns. These limitations hinder fine-grained, biomechanically grounded feedback. We introduce MyoMechanix, a multimodal ecosystem for weight-loaded actions that aligns motion with muscle activity. Expert-annotated, it contains 7,500+ samples of 20 actions from 38 subjects, with synchronized multiview RGB video, 3D pose, sEMG, and additional physiological signals, forming the largest multimodal AQA benchmark to date. We further construct the Fitness Knowledge Graph (FKG), which organizes expert annotations into structured relationships among actions, phases, key steps, errors, and corrective feedback, enabling compositional scoring and interpretable assessment. Building on these representations, we develop CUBIST (Compositional Ontological Reasoning Engine), which performs decomposition-analysis-recomposition for fine-grained error attribution and feedback generation. We also establish MyoMechanix-AQA, MyoMechanix-VideoQA, and a novel MyoMechanix-Video2EMG task. Experiments show that multimodal sensing and structured representations improve performance, interpretability, and error attribution, with CUBIST achieving state-of-the-art results; VideoQA enhances language-grounded action understanding; and Video2EMG suggests video-based alternatives to costly EMG sensing. MyoMechanix advances skilled activity understanding toward biomechanically grounded, multimodal, and compositional reasoning for Physical AI applications in fitness, rehabilitation, healthcare, and machine learning. Project page: https://haoyin116.github.io/MyoMechanix/", "arxiv_id": "2608.26094", "arxiv_url": "https://arxiv.org/abs/2608.26094", "authors": ["Hao Yin", "Paritosh Parmar", "Lijun Gu", "Lin Xu", "Tianxiao Guo", "Xiujin Liu", "Tianyou Zheng", "Yang Zhang", "Weiwei Fu"], "brief": "MyoMechanix \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8d1f\u91cd\u5065\u8eab\u52a8\u4f5c\u7684\u591a\u6a21\u6001\u52a8\u4f5c\u8d28\u91cf\u8bc4\u4f30\u751f\u6001\uff0c\u5305\u542b\u540c\u6b65\u591a\u89c6\u89d2\u89c6\u9891\u30013D\u59ff\u6001\u3001sEMG\u4e0e\u751f\u7406\u4fe1\u53f7\uff0c\u5e76\u6784\u5efa\u4e86\u76ee\u524d\u89c4\u6a21\u6700\u5927\u7684\u591a\u6a21\u6001AQA\u57fa\u51c6\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u5f15\u5165\u5065\u8eab\u77e5\u8bc6\u56fe\u8c31\u548cCUBIST\u7ec4\u5408\u63a8\u7406\u5f15\u64ce\uff0c\u5b9e\u73b0\u7ec6\u7c92\u5ea6\u9519\u8bef\u5f52\u56e0\u3001\u53ef\u89e3\u91ca\u8bc4\u5206\u4e0e\u7ea0\u6b63\u53cd\u9988\uff0c\u5728AQA\u3001VideoQA\u548cVideo2EMG\u4efb\u52a1\u4e0a\u53d6\u5f97\u66f4\u597d\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI", "cs.ET", "cs.HC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26094", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u52a8\u4f5c\u7406\u89e3", "\u591a\u6a21\u6001", "\u77e5\u8bc6\u56fe\u8c31", "\u751f\u7269\u529b\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26094v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MyoMechanix: Biomechanically-Grounded Compositional Skilled Activity Understanding and Coaching", "tldr": "MyoMechanix \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8d1f\u91cd\u5065\u8eab\u52a8\u4f5c\u7684\u591a\u6a21\u6001\u52a8\u4f5c\u8d28\u91cf\u8bc4\u4f30\u751f\u6001\uff0c\u5305\u542b\u540c\u6b65\u591a\u89c6\u89d2\u89c6\u9891\u30013D\u59ff\u6001\u3001sEMG\u4e0e\u751f\u7406\u4fe1\u53f7\uff0c\u5e76\u6784\u5efa\u4e86\u76ee\u524d\u89c4\u6a21\u6700\u5927\u7684\u591a\u6a21\u6001AQA\u57fa\u51c6\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u5f15\u5165\u5065\u8eab\u77e5\u8bc6\u56fe\u8c31\u548cCUBIST\u7ec4\u5408\u63a8\u7406\u5f15\u64ce\uff0c\u5b9e\u73b0\u7ec6\u7c92\u5ea6\u9519\u8bef\u5f52\u56e0\u3001\u53ef\u89e3\u91ca\u8bc4\u5206\u4e0e\u7ea0\u6b63\u53cd\u9988\uff0c\u5728AQA\u3001VideoQA\u548cVideo2EMG\u4efb\u52a1\u4e0a\u53d6\u5f97\u66f4\u597d\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present a first application of sparse-autoencoder-based mechanistic interpretability to particle physics. Studying a neutrino foundation model pretrained on IceCube data and fine-tuned for direction reconstruction, we identify a validated atlas of physical concepts in the model representation, using a strict validation protocol consisting of held-out tests, matched nuisance controls, and replication across independent dictionary trainings. Causal interventions show that the direction head barely draws on this atlas. Motivated by this underused information, we train an uncertainty head on the same event-level representation to predict the model\u0027s angular reconstruction error. Unlike the direction head, it depends causally on quality and brightness features from the atlas. At $20\\%$ selection efficiency, this interpretable estimator improves the median angular resolution from $20.2^\\circ$ to $3.2^\\circ$. These results suggest that mechanistic interpretability can reveal learned latent physics encoded within a model\u0027s internal representation and help design downstream tasks that exploit it.", "arxiv_id": "2608.26090", "arxiv_url": "https://arxiv.org/abs/2608.26090", "authors": ["Rapha\u00ebl Bonnet-Guerrini", "Johann Ioannou-Nikolaides", "Inar Timiryasov", "Vincenzo Piuri"], "brief": "\u8bba\u6587\u9996\u6b21\u5c06\u57fa\u4e8e\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7684\u673a\u5236\u53ef\u89e3\u91ca\u6027\u7528\u4e8e\u7c92\u5b50\u7269\u7406\uff0c\u5206\u6790\u5728 IceCube \u6570\u636e\u4e0a\u9884\u8bad\u7ec3\u7684\u4e2d\u5fae\u5b50\u57fa\u7840\u6a21\u578b\uff0c\u5e76\u9a8c\u8bc1\u51fa\u4e00\u7ec4\u5bf9\u5e94\u7269\u7406\u6982\u5ff5\u7684\u53ef\u89e3\u91ca\u6f5c\u53d8\u91cf\u3002\u4f5c\u8005\u53d1\u73b0\u65b9\u5411\u91cd\u5efa\u5934\u51e0\u4e4e\u672a\u5229\u7528\u8fd9\u4e9b\u4fe1\u606f\uff0c\u4e8e\u662f\u8bad\u7ec3\u4e0d\u786e\u5b9a\u6027\u5934\u6765\u9884\u6d4b\u89d2\u5ea6\u8bef\u5dee\uff0c\u572820%\u7b5b\u9009\u6548\u7387\u4e0b\u5c06\u4e2d\u4f4d\u89d2\u5206\u8fa8\u7387\u4ece20.2\u00b0\u63d0\u5347\u52303.2\u00b0\u3002", "categories": ["astro-ph.HE", "cs.AI", "cs.LG", "hep-ex"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26090", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u57fa\u7840\u6a21\u578b", "\u7c92\u5b50\u7269\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26090v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Finding and using interpretable latents in a neutrino foundation model with sparse autoencoders", "tldr": "\u8bba\u6587\u9996\u6b21\u5c06\u57fa\u4e8e\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7684\u673a\u5236\u53ef\u89e3\u91ca\u6027\u7528\u4e8e\u7c92\u5b50\u7269\u7406\uff0c\u5206\u6790\u5728 IceCube \u6570\u636e\u4e0a\u9884\u8bad\u7ec3\u7684\u4e2d\u5fae\u5b50\u57fa\u7840\u6a21\u578b\uff0c\u5e76\u9a8c\u8bc1\u51fa\u4e00\u7ec4\u5bf9\u5e94\u7269\u7406\u6982\u5ff5\u7684\u53ef\u89e3\u91ca\u6f5c\u53d8\u91cf\u3002\u4f5c\u8005\u53d1\u73b0\u65b9\u5411\u91cd\u5efa\u5934\u51e0\u4e4e\u672a\u5229\u7528\u8fd9\u4e9b\u4fe1\u606f\uff0c\u4e8e\u662f\u8bad\u7ec3\u4e0d\u786e\u5b9a\u6027\u5934\u6765\u9884\u6d4b\u89d2\u5ea6\u8bef\u5dee\uff0c\u572820%\u7b5b\u9009\u6548\u7387\u4e0b\u5c06\u4e2d\u4f4d\u89d2\u5206\u8fa8\u7387\u4ece20.2\u00b0\u63d0\u5347\u52303.2\u00b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Addressing critical global challenges, from food security and disaster risk to disease outbreaks and socio-economic vulnerability, demands high-fidelity geospatial modeling. However, building predictive planetary models remains bottlenecked by a fragmented data ecosystem, requiring manual data retrieval, multimodal data curation and fusion along with iterative model selection. We present the Planetary Prediction Engine (PPE), an autonomous AI system that executes this end-to-end workflow directly from natural-language queries. PPE synthesizes multimodal datasets on the fly, retrieving spatiotemporally relevant covariates across open-web and Earth observation platforms (Data Commons, Google Earth Engine) and fusing them with geospatial foundation model embeddings (PDFM, AlphaEarth). Simultaneously, it searches over task-tailored model architecture families with automated overfitting guards. Across diverse tasks, geographies, and scientific domains, PPE consistently outperforms state-of-the-art or manually tuned expert baselines. For US spatial regression, PPE improves mean $R^2$ across 21 CDC health indicators (76.8% vs. 60.0%), FEMA national risk indices (64.9% vs. 60.0%), and the Social Vulnerability Index (66.2% vs. 58.6%). For spatial downscaling in data-scarce settings, PPE integrates localized proxies to double baseline accuracy in Nigerian food security indicators ($R^2$ of 66.1% vs. 31.5%). For epidemiological nowcasting of the 2026 DRC Bundibugyo Ebola outbreak, PPE achieves a Recall@10 of 83.3% (identifying 15 of 18 newly invaded health zones across five weekly forecasts), a +10.3 percentage-point improvement over the public state-of-the-art modeling (~73%). By combining autonomous multimodal planetary data discovery with targeted model optimization, PPE lowers the technical barrier to planetary-scale analytics, enabling rapid, customized, expert-level deployment.", "arxiv_id": "2608.26088", "arxiv_url": "https://arxiv.org/abs/2608.26088", "authors": ["Evelyn Ma", "Rama Kumar Pasumarthi", "Kishwar Shafin", "Mandar Sharma", "Mimi Sun", "Hamed Sadeghi", "Dav M. Ebengo", "Mbulayi Onesime", "Rouslan Solomakhin", "John Wamburu", "William Ogallo", "Aisha Walcott-Bryant", "Sanxing Chen", "Arbaaz Muslim", "Yael Mayer", "Ronald Ho", "Roy Lee", "Ruth Alcantara", "Abdoulaye Diack", "Monica Bharel", "Lambert Rosique", "Jeremy Amez-Droz", "Christopher Haire", "James Manyika", "Yossi Matias", "Niv Efron", "Gautam Prasad", "Shravya Shetty"], "brief": "\u8bba\u6587\u63d0\u51fa Planetary Prediction Engine\uff08PPE\uff09\uff0c\u53ef\u4ece\u81ea\u7136\u8bed\u8a00\u67e5\u8be2\u51fa\u53d1\uff0c\u81ea\u52a8\u68c0\u7d22\u5f00\u653e\u7f51\u7edc\u4e0e\u5730\u7403\u89c2\u6d4b\u6570\u636e\uff0c\u878d\u5408\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b\u5d4c\u5165\uff0c\u5e76\u8fdb\u884c\u4efb\u52a1\u5b9a\u5236\u7684\u6a21\u578b\u641c\u7d22\u3002PPE \u5728\u5065\u5eb7\u3001\u707e\u5bb3\u98ce\u9669\u3001\u793e\u4f1a\u8106\u5f31\u6027\u3001\u7cae\u98df\u5b89\u5168\u548c\u57c3\u535a\u62c9\u75ab\u60c5\u9884\u6d4b\u7b49\u591a\u7c7b\u5730\u7406\u7a7a\u95f4\u4efb\u52a1\u4e0a\u8d85\u8fc7\u4e13\u5bb6\u8c03\u53c2\u6216\u73b0\u6709\u6700\u4f18\u57fa\u7ebf\uff0c\u663e\u8457\u63d0\u5347\u9884\u6d4b\u7cbe\u5ea6\u4e0e\u90e8\u7f72\u6548\u7387\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26088", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5730\u7406\u7a7a\u95f4\u5efa\u6a21", "\u57fa\u7840\u6a21\u578b", "\u81ea\u52a8\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26088v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Planetary Prediction Engine: Autonomous Geospatial Prediction via Intelligent Data Selection and Foundation Model Embeddings", "tldr": "\u8bba\u6587\u63d0\u51fa Planetary Prediction Engine\uff08PPE\uff09\uff0c\u53ef\u4ece\u81ea\u7136\u8bed\u8a00\u67e5\u8be2\u51fa\u53d1\uff0c\u81ea\u52a8\u68c0\u7d22\u5f00\u653e\u7f51\u7edc\u4e0e\u5730\u7403\u89c2\u6d4b\u6570\u636e\uff0c\u878d\u5408\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b\u5d4c\u5165\uff0c\u5e76\u8fdb\u884c\u4efb\u52a1\u5b9a\u5236\u7684\u6a21\u578b\u641c\u7d22\u3002PPE \u5728\u5065\u5eb7\u3001\u707e\u5bb3\u98ce\u9669\u3001\u793e\u4f1a\u8106\u5f31\u6027\u3001\u7cae\u98df\u5b89\u5168\u548c\u57c3\u535a\u62c9\u75ab\u60c5\u9884\u6d4b\u7b49\u591a\u7c7b\u5730\u7406\u7a7a\u95f4\u4efb\u52a1\u4e0a\u8d85\u8fc7\u4e13\u5bb6\u8c03\u53c2\u6216\u73b0\u6709\u6700\u4f18\u57fa\u7ebf\uff0c\u663e\u8457\u63d0\u5347\u9884\u6d4b\u7cbe\u5ea6\u4e0e\u90e8\u7f72\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models write correct code for isolated problems but remain far weaker at autonomous machine-learning development, where an agent must revise data pipelines, models, and validation over hours of feedback, and on most competitions still finishes below strong human competitors. Outcome-based benchmarks record this gap but not its cause, because they grade the final submission and discard the development process behind it. We introduce TraceML, which pairs human and agent work on the same competitions under one version-level schema: 4,465 human Kaggle trajectories across 134 competitions, seven of which are also worked by two agent scaffolds, giving 430 paired human and 207 agent trajectories. Every code version carries its score, its timestamp, and labels for the action taken, its intent, the edit size, and the score effect. Read this way, the gap becomes concrete. Experts alternate data work, validation, model changes, and ensembling, and return to approaches they had set aside. Each agent scaffold instead collapses into a narrow loop: Codex spends its steps re-weighting ensembles and tuning submissions, MLEvolve mutates its model in place, and neither pivots at the human rate nor reopens abandoned work. A short planning prompt distilled from human practice moves the behaviors it names toward the human profile and lifts scores, but the effort profile stays agent-shaped: instruction closes only the part of the gap that reduces to instructions. We release the corpus, the schema, the labelers, and the extraction pipeline at https://huggingface.co/datasets/jerryyan/TraceML.", "arxiv_id": "2608.26086", "arxiv_url": "https://arxiv.org/abs/2608.26086", "authors": ["Jiarui Yan", "Weiwei Sun", "Sijie Li", "Wenhan Li", "Yiming Yang"], "brief": "TraceML \u6784\u5efa\u4e86\u4e00\u4e2a\u5bf9\u9f50\u4eba\u7c7b\u4e0e\u667a\u80fd\u4f53\u5728 Kaggle \u7ade\u8d5b\u4e2d\u673a\u5668\u5b66\u4e60\u5f00\u53d1\u8fc7\u7a0b\u7684\u8f68\u8ff9\u6570\u636e\u96c6\uff0c\u8bb0\u5f55\u4ee3\u7801\u7248\u672c\u3001\u5206\u6570\u3001\u65f6\u95f4\u6233\u4ee5\u53ca\u52a8\u4f5c\u610f\u56fe\u7b49\u6807\u7b7e\uff0c\u7528\u4e8e\u5206\u6790\u6700\u7ec8\u6210\u7ee9\u5dee\u8ddd\u80cc\u540e\u7684\u8fc7\u7a0b\u539f\u56e0\u3002\u7814\u7a76\u53d1\u73b0\u4eba\u7c7b\u4e13\u5bb6\u4f1a\u5728\u6570\u636e\u5904\u7406\u3001\u9a8c\u8bc1\u3001\u6a21\u578b\u4fee\u6539\u548c\u96c6\u6210\u95f4\u7075\u6d3b\u5207\u6362\u5e76\u56de\u6eaf\u65e7\u65b9\u6848\uff0c\u800c\u667a\u80fd\u4f53\u66f4\u5bb9\u6613\u9677\u5165\u72ed\u7a84\u5faa\u73af\uff1b\u57fa\u4e8e\u4eba\u7c7b\u7ecf\u9a8c\u7684\u7b80\u77ed\u89c4\u5212\u63d0\u793a\u80fd\u6539\u5584\u90e8\u5206\u884c\u4e3a\u5e76\u63d0\u5347\u5206\u6570\uff0c\u4f46\u65e0\u6cd5\u5b8c\u5168\u5f25\u5408\u5dee\u8ddd\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26086", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u5b66\u4e60", "\u89c4\u5212", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26086v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TraceML: An Empirical Analysis of Human-Agent Planning in Machine Learning Development", "tldr": "TraceML \u6784\u5efa\u4e86\u4e00\u4e2a\u5bf9\u9f50\u4eba\u7c7b\u4e0e\u667a\u80fd\u4f53\u5728 Kaggle \u7ade\u8d5b\u4e2d\u673a\u5668\u5b66\u4e60\u5f00\u53d1\u8fc7\u7a0b\u7684\u8f68\u8ff9\u6570\u636e\u96c6\uff0c\u8bb0\u5f55\u4ee3\u7801\u7248\u672c\u3001\u5206\u6570\u3001\u65f6\u95f4\u6233\u4ee5\u53ca\u52a8\u4f5c\u610f\u56fe\u7b49\u6807\u7b7e\uff0c\u7528\u4e8e\u5206\u6790\u6700\u7ec8\u6210\u7ee9\u5dee\u8ddd\u80cc\u540e\u7684\u8fc7\u7a0b\u539f\u56e0\u3002\u7814\u7a76\u53d1\u73b0\u4eba\u7c7b\u4e13\u5bb6\u4f1a\u5728\u6570\u636e\u5904\u7406\u3001\u9a8c\u8bc1\u3001\u6a21\u578b\u4fee\u6539\u548c\u96c6\u6210\u95f4\u7075\u6d3b\u5207\u6362\u5e76\u56de\u6eaf\u65e7\u65b9\u6848\uff0c\u800c\u667a\u80fd\u4f53\u66f4\u5bb9\u6613\u9677\u5165\u72ed\u7a84\u5faa\u73af\uff1b\u57fa\u4e8e\u4eba\u7c7b\u7ecf\u9a8c\u7684\u7b80\u77ed\u89c4\u5212\u63d0\u793a\u80fd\u6539\u5584\u90e8\u5206\u884c\u4e3a\u5e76\u63d0\u5347\u5206\u6570\uff0c\u4f46\u65e0\u6cd5\u5b8c\u5168\u5f25\u5408\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep neural networks often exploit spurious associations in their training data, a failure known as shortcut learning. Concept-based explainability methods screen for shortcuts by testing whether concepts such as a patient\u0027s sex or scanner settings can be decoded from a network layer. Because each concept is evaluated in isolation, these methods can mistake correlations between concepts as evidence that the model uses them. We introduce ICON decomposition, which instead quantifies how much of a layer\u0027s variance each concept explains after accounting for all other concepts and the outcome. On synthetic data with known ground truth, ICON recovers concept importance more accurately than seven alternative baseline methods. On skin-lesion and brain-imaging models, it isolates the concepts on which a model genuinely relies, quantifies the representation unexplained by any of the supplied concepts, and yields sparse explanations that we validate by retraining and out-of-distribution testing.", "arxiv_id": "2608.26083", "arxiv_url": "https://arxiv.org/abs/2608.26083", "authors": ["Roshan Prakash Rane", "Marco Simnacher", "Manuel Pfeuffer", "Marc-Andre Schulz", "Nys Tjade Siegel", "Maximilian Dreyer", "Frederik Pahde", "Wojciech Samek", "Sonja Greven", "Kerstin Ritter"], "brief": "\u672c\u6587\u63d0\u51fa ICON \u5206\u89e3\uff0c\u7528\u4e8e\u5728\u8003\u8651\u5176\u4ed6\u6982\u5ff5\u548c\u6807\u7b7e\u5f71\u54cd\u540e\uff0c\u91cf\u5316\u6df1\u5ea6\u7f51\u7edc\u4e2d\u67d0\u4e00\u5c42\u8868\u793a\u65b9\u5dee\u7531\u5404\u6982\u5ff5\u89e3\u91ca\u7684\u7a0b\u5ea6\uff0c\u4ece\u800c\u66f4\u53ef\u9760\u5730\u5ba1\u8ba1\u6377\u5f84\u5b66\u4e60\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5408\u6210\u6570\u636e\u4e0a\u6bd4\u4e03\u79cd\u57fa\u7ebf\u66f4\u51c6\u786e\uff0c\u5e76\u5728\u76ae\u80a4\u75c5\u53d8\u4e0e\u8111\u5f71\u50cf\u6a21\u578b\u4e2d\u5206\u79bb\u51fa\u6a21\u578b\u771f\u6b63\u4f9d\u8d56\u7684\u6982\u5ff5\uff0c\u540c\u65f6\u91cf\u5316\u672a\u88ab\u7ed9\u5b9a\u6982\u5ff5\u89e3\u91ca\u7684\u8868\u793a\u6210\u5206\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26083", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u5ba1\u8ba1", "\u6377\u5f84\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26083v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ICON Decomposition: Multivariate Concept-Level Explanations of Deep Representations for Model Auditing", "tldr": "\u672c\u6587\u63d0\u51fa ICON \u5206\u89e3\uff0c\u7528\u4e8e\u5728\u8003\u8651\u5176\u4ed6\u6982\u5ff5\u548c\u6807\u7b7e\u5f71\u54cd\u540e\uff0c\u91cf\u5316\u6df1\u5ea6\u7f51\u7edc\u4e2d\u67d0\u4e00\u5c42\u8868\u793a\u65b9\u5dee\u7531\u5404\u6982\u5ff5\u89e3\u91ca\u7684\u7a0b\u5ea6\uff0c\u4ece\u800c\u66f4\u53ef\u9760\u5730\u5ba1\u8ba1\u6377\u5f84\u5b66\u4e60\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5408\u6210\u6570\u636e\u4e0a\u6bd4\u4e03\u79cd\u57fa\u7ebf\u66f4\u51c6\u786e\uff0c\u5e76\u5728\u76ae\u80a4\u75c5\u53d8\u4e0e\u8111\u5f71\u50cf\u6a21\u578b\u4e2d\u5206\u79bb\u51fa\u6a21\u578b\u771f\u6b63\u4f9d\u8d56\u7684\u6982\u5ff5\uff0c\u540c\u65f6\u91cf\u5316\u672a\u88ab\u7ed9\u5b9a\u6982\u5ff5\u89e3\u91ca\u7684\u8868\u793a\u6210\u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Intent misinterpretation during vehicle interactions causes recurring planning failures. We study a decision layer in which a language-guided intent module reads structured descriptors, computes a smoothed intent-geometry divergence score, and gates the planned maneuver before commitment, upstream of a corridor envelope. On a replayed off-road departure and four crash clips under a frozen, disclosed implementation, gating is the only layer that repairs the plan: on the main case it fires 72 ms after the drift onset but 161 ms before the corridor exit, keeping the trajectory in the corridor in all ten replays. The first calibration draws nine false triggers in 5.9 minutes, each from scoring uncertainty as half a conflict; a preregistered redesign treating uncertainty as abstention cuts this to 0.341 per minute. Two ablations bound the model\u0027s contribution: the full score detects fastest on four of five failures under the deployed eligibility, three of five against the unvetoed rule (000871 by one cycle; 000228 by a pre-onset fire on an uncertain stretch that five clips cannot classify as signal or coincidence; dropping the confidence term costs two detections), while on in-domain tracks at equal false positives the geometric rule more than triples its detection. The evidence supports the gating mechanism; the model\u0027s demonstrated roles are the fastest detection on these failures and an uncertainty veto on the geometric rule.", "arxiv_id": "2608.26074", "arxiv_url": "https://arxiv.org/abs/2608.26074", "authors": ["Cong Xu", "Ravi Sankar"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u81ea\u52a8\u9a7e\u9a76\u4ea4\u4e92\u51b3\u7b56\u524d\u7684\u95e8\u63a7\u673a\u5236\uff1a\u8bed\u8a00\u5f15\u5bfc\u7684\u610f\u56fe\u6a21\u5757\u6839\u636e\u7ed3\u6784\u5316\u63cf\u8ff0\u8ba1\u7b97\u610f\u56fe-\u51e0\u4f55\u53d1\u6563\u5206\u6570\uff0c\u5728\u8f66\u8f86\u6267\u884c\u673a\u52a8\u524d\u62e6\u622a\u53ef\u80fd\u5931\u8d25\u7684\u8ba1\u5212\u3002\u56de\u653e\u5b9e\u9a8c\u4e2d\uff0c\u8be5\u95e8\u63a7\u80fd\u5728\u5173\u952e\u6848\u4f8b\u4e2d\u63d0\u524d\u4e8e\u9a76\u51fa\u8d70\u5eca\u89e6\u53d1\u5e76\u4fee\u590d\u8f68\u8ff9\uff0c\u6539\u8fdb\u540e\u7684\u4e0d\u786e\u5b9a\u6027\u5f03\u6743\u7b56\u7565\u4e5f\u663e\u8457\u964d\u4f4e\u8bef\u89e6\u53d1\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26074", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u610f\u56fe\u8bc6\u522b", "\u51b3\u7b56\u95e8\u63a7", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26074v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Gating Before Commitment: Anticipating Intent Divergence to Prevent Post-Interaction Decision Failures in Autonomous Driving", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u81ea\u52a8\u9a7e\u9a76\u4ea4\u4e92\u51b3\u7b56\u524d\u7684\u95e8\u63a7\u673a\u5236\uff1a\u8bed\u8a00\u5f15\u5bfc\u7684\u610f\u56fe\u6a21\u5757\u6839\u636e\u7ed3\u6784\u5316\u63cf\u8ff0\u8ba1\u7b97\u610f\u56fe-\u51e0\u4f55\u53d1\u6563\u5206\u6570\uff0c\u5728\u8f66\u8f86\u6267\u884c\u673a\u52a8\u524d\u62e6\u622a\u53ef\u80fd\u5931\u8d25\u7684\u8ba1\u5212\u3002\u56de\u653e\u5b9e\u9a8c\u4e2d\uff0c\u8be5\u95e8\u63a7\u80fd\u5728\u5173\u952e\u6848\u4f8b\u4e2d\u63d0\u524d\u4e8e\u9a76\u51fa\u8d70\u5eca\u89e6\u53d1\u5e76\u4fee\u590d\u8f68\u8ff9\uff0c\u6539\u8fdb\u540e\u7684\u4e0d\u786e\u5b9a\u6027\u5f03\u6743\u7b56\u7565\u4e5f\u663e\u8457\u964d\u4f4e\u8bef\u89e6\u53d1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time scaling uses extra test-time compute to improve performance, such as letting language models reason longer when solving a problem. As models keep the entire reasoning trace in memory via full attention, hard tasks that need long thinking can be prohibitively expensive. However, we find most intermediate reasoning tokens lose importance as the model continues reasoning. This calls into question whether retaining them is worth the cost. Based on this insight, we propose Prefix Sliding, which discards tokens during reasoning that are not part of the prefix or the window of the last few thousand tokens. The prefix has key instructions and tools available to the model, while the most recent tokens are the current reasoning the model is working on. This caps the total memory requirement regardless of how long the model reasons, allowing for efficient long-horizon test-time scaling. Without training, Prefix Sliding can make existing models 3x faster while maintaining performance. Training with Prefix Sliding using reinforcement learning can achieve better performance by enabling scaling to reasoning traces beyond a hundred thousand tokens. Ablations show Prefix Sliding outperforms summarizing intermediate tokens or vanilla sliding window. Our code is at https://github.com/Muennighoff/prefix-sliding", "arxiv_id": "2608.26070", "arxiv_url": "https://arxiv.org/abs/2608.26070", "authors": ["Niklas Muennighoff", "Zhengyang Wang", "Zeyi Chen", "Weijia Shi", "Binyuan Hui", "John Yang", "Dapeng Jiang", "Mika Senghaas", "Fares Obeid", "Johannes Hagemann", "Sami Jaghouar", "Ludwig Schmidt", "Percy Liang", "Jason Wei", "Andrew Y. Ng", "Luke Zettlemoyer", "Yejin Choi", "Mike Lewis"], "brief": "\u672c\u6587\u63d0\u51fa Prefix Sliding\uff0c\u5728\u8bed\u8a00\u6a21\u578b\u957f\u94fe\u63a8\u7406\u65f6\u53ea\u4fdd\u7559\u5173\u952e\u524d\u7f00\u548c\u6700\u8fd1\u7a97\u53e3 token\uff0c\u4e22\u5f03\u4e2d\u95f4\u9010\u6e10\u5931\u53bb\u91cd\u8981\u6027\u7684\u63a8\u7406\u5185\u5bb9\uff0c\u4ece\u800c\u9650\u5236\u663e\u5b58\u968f\u63a8\u7406\u957f\u5ea6\u589e\u957f\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u5728\u57fa\u672c\u4fdd\u6301\u6027\u80fd\u4e0b\u63d0\u901f\u7ea6 3 \u500d\uff1b\u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u540e\u8fd8\u80fd\u6269\u5c55\u5230\u5341\u4e07\u7ea7 token \u63a8\u7406\u5e76\u63d0\u5347\u6027\u80fd\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26070", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u957f\u4e0a\u4e0b\u6587", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26070v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Prefix Sliding for efficient test-time scaling", "tldr": "\u672c\u6587\u63d0\u51fa Prefix Sliding\uff0c\u5728\u8bed\u8a00\u6a21\u578b\u957f\u94fe\u63a8\u7406\u65f6\u53ea\u4fdd\u7559\u5173\u952e\u524d\u7f00\u548c\u6700\u8fd1\u7a97\u53e3 token\uff0c\u4e22\u5f03\u4e2d\u95f4\u9010\u6e10\u5931\u53bb\u91cd\u8981\u6027\u7684\u63a8\u7406\u5185\u5bb9\uff0c\u4ece\u800c\u9650\u5236\u663e\u5b58\u968f\u63a8\u7406\u957f\u5ea6\u589e\u957f\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u5728\u57fa\u672c\u4fdd\u6301\u6027\u80fd\u4e0b\u63d0\u901f\u7ea6 3 \u500d\uff1b\u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u540e\u8fd8\u80fd\u6269\u5c55\u5230\u5341\u4e07\u7ea7 token \u63a8\u7406\u5e76\u63d0\u5347\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reasoning in language allows foundation models to spend more test-time compute on hard problems, such as those requiring decomposition, constraint tracking, and prediction of future consequences. Whether this mechanism can improve robotic manipulation remains unclear, where long-horizon tasks require tracking partial progress, reasoning about object relations, recovering from mistakes, and steering noisy low-level policies. In this paper, we study whether VLMs can be trained to reason directly in natural language to guide low-level manipulation policies. We introduce $R^3$, a simple post-training recipe that turns off-the-shelf VLMs into robotic reasoners: it first mid-trains a VLM on expert-generated reasoning traces to initialize the desired reasoning style, then improves the reasoner with single-step rubric-based RL from offline action data. Unlike prior robotic reasoning methods that mostly use structured traces as auxiliary supervision, $R^3$ trains free-form language reasoning to produce test-time guidance for action. We instantiate $R^3$ on Language Table and simulated bimanual grocery packing, two controlled testbeds for studying robotic reasoning and long-horizon manipulation. $R^3$ improves exploration and generalization across unseen tasks and significantly outperforms instruction-only imitation learning baselines on both benchmarks. Our analyses suggest that free-form language reasoning can function as a test-time compute mechanism for steering low-level policies. Our project page is available at https://robotic-reasoner.github.io/.", "arxiv_id": "2608.26053", "arxiv_url": "https://arxiv.org/abs/2608.26053", "authors": ["Lehong Wu", "Yuxiao Qu", "Zheyuan Hu", "Ivan Zhang", "Limin Wei", "Zackory Erickson", "Aviral Kumar"], "brief": "\u672c\u6587\u63d0\u51fa R^3\uff0c\u901a\u8fc7\u5148\u7528\u4e13\u5bb6\u63a8\u7406\u8f68\u8ff9\u4e2d\u8bad\u7ec3\u3001\u518d\u57fa\u4e8e\u79bb\u7ebf\u52a8\u4f5c\u6570\u636e\u8fdb\u884c\u5355\u6b65\u89c4\u5219\u8bc4\u5206\u5f3a\u5316\u5b66\u4e60\uff0c\u628a\u73b0\u6210 VLM \u8bad\u7ec3\u6210\u80fd\u7528\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u6765\u6307\u5bfc\u673a\u5668\u4eba\u4f4e\u5c42\u64cd\u63a7\u7b56\u7565\u7684\u6a21\u578b\u3002\u5b9e\u9a8c\u5728 Language Table \u548c\u53cc\u81c2\u6742\u8d27\u6253\u5305\u4eff\u771f\u4efb\u52a1\u4e0a\u663e\u793a\uff0cR^3 \u5728\u63a2\u7d22\u3001\u672a\u89c1\u4efb\u52a1\u6cdb\u5316\u548c\u957f\u7a0b\u64cd\u63a7\u8868\u73b0\u4e0a\u663e\u8457\u4f18\u4e8e\u4ec5\u6307\u4ee4\u6a21\u4eff\u5b66\u4e60\u57fa\u7ebf\u3002", "categories": ["cs.RO", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26053", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u7136\u8bed\u8a00\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26053v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "$R^3$: Training Robots to Reason in Natural Language via Reinforcement Learning", "tldr": "\u672c\u6587\u63d0\u51fa R^3\uff0c\u901a\u8fc7\u5148\u7528\u4e13\u5bb6\u63a8\u7406\u8f68\u8ff9\u4e2d\u8bad\u7ec3\u3001\u518d\u57fa\u4e8e\u79bb\u7ebf\u52a8\u4f5c\u6570\u636e\u8fdb\u884c\u5355\u6b65\u89c4\u5219\u8bc4\u5206\u5f3a\u5316\u5b66\u4e60\uff0c\u628a\u73b0\u6210 VLM \u8bad\u7ec3\u6210\u80fd\u7528\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u6765\u6307\u5bfc\u673a\u5668\u4eba\u4f4e\u5c42\u64cd\u63a7\u7b56\u7565\u7684\u6a21\u578b\u3002\u5b9e\u9a8c\u5728 Language Table \u548c\u53cc\u81c2\u6742\u8d27\u6253\u5305\u4eff\u771f\u4efb\u52a1\u4e0a\u663e\u793a\uff0cR^3 \u5728\u63a2\u7d22\u3001\u672a\u89c1\u4efb\u52a1\u6cdb\u5316\u548c\u957f\u7a0b\u64cd\u63a7\u8868\u73b0\u4e0a\u663e\u8457\u4f18\u4e8e\u4ec5\u6307\u4ee4\u6a21\u4eff\u5b66\u4e60\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Choosing the rank of a low-rank adaptation (LoRA) update is usually an empirical task. In this paper, we provide a task-dependent theory of the approximation error achievable at each LoRA rank for Transformer attention. We fix a pretrained attention head, a target attention function, and a distribution over inputs from the downstream task, and bound the smallest expected Kullback--Leibler (KL) error achievable by a rank-$r$ query LoRA update. When target attention probabilities are bounded away from zero, we prove a lower bound of the error proportional to $\u03c8(\\|d\\|_2)$, where $d$ is the difference between candidate and target attention scores and $\u03c8(t)=\\min\\{t^2,t\\}$. We also prove an unconditional upper bound $\\min\\{\\|d\\|_2^2/4,\\sqrt2\\|d\\|_2\\}$. Under explicit realizability, geometry, and moment conditions, we then bound the best rank-$r$ error between an explicit multiple of $\u03c8(\\sqrt{T_r})$ and $\\min\\{T_r/4,\\sqrt{2T_r}\\}$, where $T_r$ is the downstream-weighted tail energy of the target update. We also provide target-Fisher bounds when candidate scores remain within a fixed range of the target scores, and an unrestricted lower bound when a subset of tokens carries most of the probability mass. These spectral bounds describe finite-score approximation. We then construct explicit families in which softmax saturation makes the rank required to match the attention function strictly smaller than the rank required to match the finite logits. Finally, we extend the analysis to fused multi-head LoRA and joint query/key updates, exposing the effects of rank sharing and query/key factorization constraints.", "arxiv_id": "2608.26052", "arxiv_url": "https://arxiv.org/abs/2608.26052", "authors": ["Gerard Conangla Planes"], "brief": "\u672c\u6587\u4e3a Transformer \u6ce8\u610f\u529b\u4e2d\u7684 LoRA \u79e9\u9009\u62e9\u63d0\u4f9b\u4efb\u52a1\u76f8\u5173\u7406\u8bba\uff0c\u7ed9\u51fa\u4e0d\u540c\u79e9\u4e0b\u53ef\u8fbe\u5230\u7684 KL \u8fd1\u4f3c\u8bef\u5dee\u4e0a\u4e0b\u754c\uff0c\u5e76\u5c06\u8bef\u5dee\u4e0e\u76ee\u6807\u66f4\u65b0\u7684\u52a0\u6743\u8c31\u5c3e\u80fd\u91cf\u8054\u7cfb\u8d77\u6765\u3002\u7ed3\u679c\u8fd8\u5206\u6790\u4e86 softmax \u9971\u548c\u3001\u591a\u5934\u878d\u5408 LoRA \u4ee5\u53ca\u8054\u5408 query/key \u66f4\u65b0\u5bf9\u6240\u9700\u79e9\u7684\u5f71\u54cd\uff0c\u4e3a LoRA \u79e9\u7684\u9009\u62e9\u63d0\u4f9b\u7406\u8bba\u4f9d\u636e\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26052", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "LoRA", "Transformer", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26052v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Much Rank Does LoRA Need? Rank-Error Bounds for Transformer Attention", "tldr": "\u672c\u6587\u4e3a Transformer \u6ce8\u610f\u529b\u4e2d\u7684 LoRA \u79e9\u9009\u62e9\u63d0\u4f9b\u4efb\u52a1\u76f8\u5173\u7406\u8bba\uff0c\u7ed9\u51fa\u4e0d\u540c\u79e9\u4e0b\u53ef\u8fbe\u5230\u7684 KL \u8fd1\u4f3c\u8bef\u5dee\u4e0a\u4e0b\u754c\uff0c\u5e76\u5c06\u8bef\u5dee\u4e0e\u76ee\u6807\u66f4\u65b0\u7684\u52a0\u6743\u8c31\u5c3e\u80fd\u91cf\u8054\u7cfb\u8d77\u6765\u3002\u7ed3\u679c\u8fd8\u5206\u6790\u4e86 softmax \u9971\u548c\u3001\u591a\u5934\u878d\u5408 LoRA \u4ee5\u53ca\u8054\u5408 query/key \u66f4\u65b0\u5bf9\u6240\u9700\u79e9\u7684\u5f71\u54cd\uff0c\u4e3a LoRA \u79e9\u7684\u9009\u62e9\u63d0\u4f9b\u7406\u8bba\u4f9d\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We consider optimization applications with unknown parameters where the decision maker believes that the optimal value of the nominal problem-the optimization problem they would have solved if the true parameters were known-is unlikely to be large. This belief derives from information that humans have that is not captured in datasets, obtained from domain knowledge and interacting with the physical world. We propose an approach to evaluating policies that provides tighter performance guarantees if the decision maker\u0027s belief happens to be correct. Our main result shows that if computing a policy\u0027s worst-case performance is a convex program, then the value of human expertise-the maximum improvement in performance guarantees that can be obtained from the belief about the nominal problem-is equal to the minimax gap of a max-min problem. We illustrate our developments in assortment optimization and shortest path problems.", "arxiv_id": "2608.26051", "arxiv_url": "https://arxiv.org/abs/2608.26051", "authors": ["Bradley Sturt"], "brief": "\u8bba\u6587\u7814\u7a76\u542b\u672a\u77e5\u53c2\u6570\u7684\u4f18\u5316\u95ee\u9898\u4e2d\u5982\u4f55\u5229\u7528\u4eba\u7c7b\u4e13\u5bb6\u5bf9\u201c\u540d\u4e49\u95ee\u9898\u6700\u4f18\u503c\u4e0d\u5927\u201d\u7684\u5148\u9a8c\u4fe1\u5ff5\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u7b56\u7565\u8bc4\u4f30\u65b9\u6cd5\uff0c\u5e76\u8bc1\u660e\u5728\u6700\u574f\u60c5\u51b5\u6027\u80fd\u53ef\u7531\u51f8\u89c4\u5212\u8ba1\u7b97\u65f6\uff0c\u4eba\u7c7b\u4e13\u4e1a\u77e5\u8bc6\u5e26\u6765\u7684\u4fdd\u8bc1\u6539\u8fdb\u7b49\u4e8e\u67d0\u4e2a max-min \u95ee\u9898\u7684 minimax gap\uff0c\u5e76\u5728 assortment optimization \u548c\u6700\u77ed\u8def\u4e2d\u5c55\u793a\u5e94\u7528\u3002", "categories": ["math.OC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26051", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f18\u5316", "\u9c81\u68d2\u4f18\u5316", "\u4eba\u7c7b\u5148\u9a8c", "\u6027\u80fd\u4fdd\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26051v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Value of Human Expertise", "tldr": "\u8bba\u6587\u7814\u7a76\u542b\u672a\u77e5\u53c2\u6570\u7684\u4f18\u5316\u95ee\u9898\u4e2d\u5982\u4f55\u5229\u7528\u4eba\u7c7b\u4e13\u5bb6\u5bf9\u201c\u540d\u4e49\u95ee\u9898\u6700\u4f18\u503c\u4e0d\u5927\u201d\u7684\u5148\u9a8c\u4fe1\u5ff5\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u7b56\u7565\u8bc4\u4f30\u65b9\u6cd5\uff0c\u5e76\u8bc1\u660e\u5728\u6700\u574f\u60c5\u51b5\u6027\u80fd\u53ef\u7531\u51f8\u89c4\u5212\u8ba1\u7b97\u65f6\uff0c\u4eba\u7c7b\u4e13\u4e1a\u77e5\u8bc6\u5e26\u6765\u7684\u4fdd\u8bc1\u6539\u8fdb\u7b49\u4e8e\u67d0\u4e2a max-min \u95ee\u9898\u7684 minimax gap\uff0c\u5e76\u5728 assortment optimization \u548c\u6700\u77ed\u8def\u4e2d\u5c55\u793a\u5e94\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Answer accuracy is an insufficient reliability signal for LLM data agents. In structured-data tasks, a benchmark-correct answer can be produced by an invalid trace. This paper introduces Trace Integrity, a deployment reliability criterion for evaluating whether the computation recorded behind an answer is explicit, executable, schema-valid, operator-faithful, replayable, answer-consistent, and auditable. We identify the Structure Gap as the deployment failure mode that makes Trace Integrity necessary: natural-language reasoning and free-form rationales do not reliably specify the operator-level programs required by real-world systems. We operationalize Trace Integrity with execution contracts, structured artifacts that bind user intent to schema elements, operator plans, assumptions, executable queries, verification status, and final-answer linkage. We also introduce CAIT (Correct Answer / Invalid Trace) Rate, which measures how often answer-only evaluation counts computationally unsupported outputs as successes. In an empirical demonstration on BIRD Mini-Dev, Direct SQL, Operation Summary + SQL, and Contract-First SQL achieve answer accuracies of 20%, 22%, and 24%, while their Trace Integrity Pass Rates are 39%, 43%, and 40% and their CAIT Rates remain high at 55%, 59.1%, and 45.8%, showing that answer accuracy, trace validity, and silent-failure risk are distinct evaluation signals. Real-world LLM data agents should, therefore, be evaluated not only by whether their outputs match a reference answer, but by whether those outputs are backed by auditable computation.", "arxiv_id": "2608.26036", "arxiv_url": "https://arxiv.org/abs/2608.26036", "authors": ["Srimonti Dutta", "Akshata Kishore Moharir"], "brief": "\u672c\u6587\u63d0\u51fa Trace Integrity\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u6570\u636e\u667a\u80fd\u4f53\u7684\u63a8\u7406/\u8ba1\u7b97\u8f68\u8ff9\u662f\u5426\u53ef\u6267\u884c\u3001\u7b26\u5408\u6a21\u5f0f\u3001\u5fe0\u5b9e\u4e8e\u64cd\u4f5c\u5e76\u53ef\u5ba1\u8ba1\u3002\u4f5c\u8005\u6307\u51fa\u4ec5\u770b\u7b54\u6848\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u201c\u7b54\u6848\u6b63\u786e\u4f46\u8f68\u8ff9\u65e0\u6548\u201d\u7684\u98ce\u9669\uff0c\u5e76\u7528 CAIT Rate \u5728 BIRD Mini-Dev \u4e0a\u5c55\u793a\u8be5\u95ee\u9898\u666e\u904d\u5b58\u5728\uff0c\u8bf4\u660e\u771f\u5b9e\u7cfb\u7edf\u9700\u8981\u540c\u65f6\u8bc4\u4f30\u7b54\u6848\u4e0e\u53ef\u5ba1\u8ba1\u8ba1\u7b97\u8fc7\u7a0b\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26036", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7ed3\u6784\u5316\u6570\u636e", "\u53ef\u5ba1\u8ba1\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26036v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Trace Integrity for LLM Data Agents: A Vision for Auditable Structured Reasoning in Real-World Systems", "tldr": "\u672c\u6587\u63d0\u51fa Trace Integrity\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u6570\u636e\u667a\u80fd\u4f53\u7684\u63a8\u7406/\u8ba1\u7b97\u8f68\u8ff9\u662f\u5426\u53ef\u6267\u884c\u3001\u7b26\u5408\u6a21\u5f0f\u3001\u5fe0\u5b9e\u4e8e\u64cd\u4f5c\u5e76\u53ef\u5ba1\u8ba1\u3002\u4f5c\u8005\u6307\u51fa\u4ec5\u770b\u7b54\u6848\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u201c\u7b54\u6848\u6b63\u786e\u4f46\u8f68\u8ff9\u65e0\u6548\u201d\u7684\u98ce\u9669\uff0c\u5e76\u7528 CAIT Rate \u5728 BIRD Mini-Dev \u4e0a\u5c55\u793a\u8be5\u95ee\u9898\u666e\u904d\u5b58\u5728\uff0c\u8bf4\u660e\u771f\u5b9e\u7cfb\u7edf\u9700\u8981\u540c\u65f6\u8bc4\u4f30\u7b54\u6848\u4e0e\u53ef\u5ba1\u8ba1\u8ba1\u7b97\u8fc7\u7a0b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy self-distillation (OPSD) uses a privileged copy of the student model to provide dense supervision without an external teacher. OPSD keeps this privileged teacher fixed, even though the student distribution and output style change during training. We propose DualOPSD, an asymmetric alternating framework that adapts both policies. The student first learns from the privileged teacher. The teacher then moves toward the updated student distribution on the same student trajectory. This update makes later supervision responsive to the learner and does not require another rollout. On Qwen3-8B in non-thinking mode, DualOPSD improves avg@12 over OPSD by 23.61, 13.89, and 10.00 points on AIME 2024, AIME 2025, and HMMT 2025. Results at 1.7B and 4B show that the accuracy gain depends on model scale. Across all three scales, DualOPSD reduces truncation. The 4B diagnostic also shows lower KL in both directions between the teacher and student.", "arxiv_id": "2608.26019", "arxiv_url": "https://arxiv.org/abs/2608.26019", "authors": ["Yutong Chen", "Guangfu Guo", "Zhichao Xu", "Kunpeng Liu"], "brief": "\u672c\u6587\u63d0\u51fa DualOPSD\uff0c\u4e00\u79cd\u7528\u4e8e\u5728\u7ebf\u81ea\u84b8\u998f\u7684\u975e\u5bf9\u79f0\u4ea4\u66ff\u6846\u67b6\uff1a\u5b66\u751f\u5148\u5411\u7279\u6743\u6559\u5e08\u5b66\u4e60\uff0c\u968f\u540e\u6559\u5e08\u5728\u540c\u4e00\u5b66\u751f\u8f68\u8ff9\u4e0a\u5411\u66f4\u65b0\u540e\u7684\u5b66\u751f\u5206\u5e03\u9002\u914d\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916 rollout\uff0c\u5728 Qwen3-8B \u6570\u5b66\u8bc4\u6d4b\u4e0a\u76f8\u5bf9 OPSD \u663e\u8457\u63d0\u5347 avg@12\uff0c\u5e76\u5728\u4e0d\u540c\u89c4\u6a21\u6a21\u578b\u4e0a\u51cf\u5c11\u622a\u65ad\u3001\u964d\u4f4e\u5e08\u751f\u5206\u5e03\u5dee\u5f02\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26019", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5728\u7ebf\u5b66\u4e60", "\u6570\u5b66\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26019v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DualOPSD: Adaptive Privileged Teachers for On-Policy Self-Distillation", "tldr": "\u672c\u6587\u63d0\u51fa DualOPSD\uff0c\u4e00\u79cd\u7528\u4e8e\u5728\u7ebf\u81ea\u84b8\u998f\u7684\u975e\u5bf9\u79f0\u4ea4\u66ff\u6846\u67b6\uff1a\u5b66\u751f\u5148\u5411\u7279\u6743\u6559\u5e08\u5b66\u4e60\uff0c\u968f\u540e\u6559\u5e08\u5728\u540c\u4e00\u5b66\u751f\u8f68\u8ff9\u4e0a\u5411\u66f4\u65b0\u540e\u7684\u5b66\u751f\u5206\u5e03\u9002\u914d\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916 rollout\uff0c\u5728 Qwen3-8B \u6570\u5b66\u8bc4\u6d4b\u4e0a\u76f8\u5bf9 OPSD \u663e\u8457\u63d0\u5347 avg@12\uff0c\u5e76\u5728\u4e0d\u540c\u89c4\u6a21\u6a21\u578b\u4e0a\u51cf\u5c11\u622a\u65ad\u3001\u964d\u4f4e\u5e08\u751f\u5206\u5e03\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An automated theorem prover builds a proof step by step, choosing at each point what to add and what to remove. We cast this construction as a policy acting in a transition system induced by a formal calculus, which fixes which steps are sound: for clausal connection tableaux, leanCoP-style search and plCoP/rlCoP-style planning then become stateful policies over one interface, and policy-learning methods apply directly. We equip such policies with a graph neural network that scores proof edits from structure that transfers across problems, train it by imitation learning from found proofs, and measure how performance holds as we remove search scaffolding, from full symbolic backtracking to a policy the network drives alone. Within a fixed step budget on M2k, MPTP2078-bushy, and TPTP v9.2.1, learned policies solve up to 46% more problems than leanCoP, and reach proofs in an order of magnitude fewer steps.", "arxiv_id": "2608.26009", "arxiv_url": "https://arxiv.org/abs/2608.26009", "authors": ["Fredrik R\u00f8mming", "Mantas Bak\u0161ys", "Martin S. Fixman", "Sean B. Holden"], "brief": "\u672c\u6587\u5c06\u8fde\u63a5\u8868\u8bc1\u660e\u6784\u9020\u5efa\u6a21\u4e3a\u5f62\u5f0f\u6f14\u7b97\u8bf1\u5bfc\u7684\u72b6\u6001\u8f6c\u79fb\u7cfb\u7edf\uff0c\u5e76\u7528\u56fe\u795e\u7ecf\u7f51\u7edc\u5bf9\u8bc1\u660e\u7f16\u8f91\u52a8\u4f5c\u6253\u5206\uff0c\u901a\u8fc7\u4ece\u5df2\u6709\u8bc1\u660e\u4e2d\u6a21\u4eff\u5b66\u4e60\u8bad\u7ec3\u7b56\u7565\u3002\u5728\u591a\u4e2a\u5b9a\u7406\u8bc1\u660e\u57fa\u51c6\u4e0a\uff0c\u5b66\u4e60\u7b56\u7565\u76f8\u6bd4 leanCoP \u6700\u591a\u591a\u89e3 46% \u7684\u95ee\u9898\uff0c\u5e76\u5c06\u8bc1\u660e\u6b65\u6570\u964d\u4f4e\u4e00\u4e2a\u6570\u91cf\u7ea7\u3002", "categories": ["cs.AI", "cs.LG", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26009", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u5b9a\u7406\u8bc1\u660e", "\u6a21\u4eff\u5b66\u4e60", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u5f62\u5f0f\u903b\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26009v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Imitation Learning for Connection-Tableau Construction", "tldr": "\u672c\u6587\u5c06\u8fde\u63a5\u8868\u8bc1\u660e\u6784\u9020\u5efa\u6a21\u4e3a\u5f62\u5f0f\u6f14\u7b97\u8bf1\u5bfc\u7684\u72b6\u6001\u8f6c\u79fb\u7cfb\u7edf\uff0c\u5e76\u7528\u56fe\u795e\u7ecf\u7f51\u7edc\u5bf9\u8bc1\u660e\u7f16\u8f91\u52a8\u4f5c\u6253\u5206\uff0c\u901a\u8fc7\u4ece\u5df2\u6709\u8bc1\u660e\u4e2d\u6a21\u4eff\u5b66\u4e60\u8bad\u7ec3\u7b56\u7565\u3002\u5728\u591a\u4e2a\u5b9a\u7406\u8bc1\u660e\u57fa\u51c6\u4e0a\uff0c\u5b66\u4e60\u7b56\u7565\u76f8\u6bd4 leanCoP \u6700\u591a\u591a\u89e3 46% \u7684\u95ee\u9898\uff0c\u5e76\u5c06\u8bc1\u660e\u6b65\u6570\u964d\u4f4e\u4e00\u4e2a\u6570\u91cf\u7ea7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-augmented generation (RAG) is widely used to mitigate hallucination issues in large language models (LLMs) and multimodal large language models (MLLMs). In particular, knowledge graph (KG)-based RAG leverages structured knowledge to provide (M)LLMs with high-quality external information. Building on these works, recent studies have explored multimodal knowledge graphs (MMKGs) as knowledge bases for GraphRAG. This enables Graph RAG to integrate knowledge across multiple modalities, thereby further enhancing its performance. However, existing MMKG-based RAG methods generally follow a common pipeline in which different modalities are largely processed independently before being fusion. As a result, textual context is only used to a limited extent during visual information extraction and subsequent multimodal knowledge fusion. This brings a semantic gap between images and text which limits the multimodal GraphRAG performance. To address this issue, we propose a novel framework for constructing a Context-Enhanced MMKG (CEMMKG) to better support multimodal GraphRAG. The proposed CEMMKG enriches each image with complementary textual context at both local and global scopes. Local context goes beyond the surrounding text by incorporating sentences that are semantically related to the image, while global context provides a summary of the entire passage. We further introduce a multi-granularity design for the local context, allowing it to capture semantically relevant information at different levels of detail. Extensive experiments on the selected vision-centric dataset validate that CEMMKG is effective in leveraging contextual information to improve MMKG-based RAG performance. Moreover, its effectiveness across different MMKG-based RAG methods demonstrates its broad applicability.", "arxiv_id": "2608.25986", "arxiv_url": "https://arxiv.org/abs/2608.25986", "authors": ["Zongyu Wu", "Yilong Wang", "Xiaochen Wang", "Minhua Lin", "Zhichao Xu", "Fenglong Ma", "Xiang Zhang", "Suhang Wang"], "brief": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u591a\u6a21\u6001\u77e5\u8bc6\u56fe\u8c31 RAG \u7684\u4e0a\u4e0b\u6587\u589e\u5f3a MMKG\uff08CEMMKG\uff09\uff0c\u4e3a\u6bcf\u5f20\u56fe\u50cf\u8865\u5145\u5c40\u90e8\u4e0e\u5168\u5c40\u6587\u672c\u4e0a\u4e0b\u6587\uff0c\u5e76\u5728\u5c40\u90e8\u4e0a\u4e0b\u6587\u4e2d\u5f15\u5165\u591a\u7c92\u5ea6\u8bed\u4e49\u76f8\u5173\u4fe1\u606f\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u80fd\u7f29\u5c0f\u56fe\u6587\u8bed\u4e49\u5dee\u8ddd\uff0c\u63d0\u5347\u591a\u79cd MMKG-based GraphRAG \u65b9\u6cd5\u5728\u89c6\u89c9\u4e2d\u5fc3\u6570\u636e\u96c6\u4e0a\u7684\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25986", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u591a\u6a21\u6001", "\u77e5\u8bc6\u56fe\u8c31", "\u56feRAG"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25986v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Multi-Granularity Context-Enhanced RAG over Multimodal Knowledge Graphs", "tldr": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u591a\u6a21\u6001\u77e5\u8bc6\u56fe\u8c31 RAG \u7684\u4e0a\u4e0b\u6587\u589e\u5f3a MMKG\uff08CEMMKG\uff09\uff0c\u4e3a\u6bcf\u5f20\u56fe\u50cf\u8865\u5145\u5c40\u90e8\u4e0e\u5168\u5c40\u6587\u672c\u4e0a\u4e0b\u6587\uff0c\u5e76\u5728\u5c40\u90e8\u4e0a\u4e0b\u6587\u4e2d\u5f15\u5165\u591a\u7c92\u5ea6\u8bed\u4e49\u76f8\u5173\u4fe1\u606f\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u80fd\u7f29\u5c0f\u56fe\u6587\u8bed\u4e49\u5dee\u8ddd\uff0c\u63d0\u5347\u591a\u79cd MMKG-based GraphRAG \u65b9\u6cd5\u5728\u89c6\u89c9\u4e2d\u5fc3\u6570\u636e\u96c6\u4e0a\u7684\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Subgroup performance differences are the standard evidence for fairness bias in medical imaging, and the usual response removes the demographic information that a model encodes. Here we introduce Fair-model Reference And Mechanism Evaluation (FRAME), a two-step framework for auditing such a claim. The first step derives a fair-model reference, the distribution of the difference under exact fairness at the observed subgroup sizes. In the second step, we test the remainder with two operators in representation space. One operator cannot change a within-group ranking by construction. Across 702,206 images and 36 encoders, the reference accounts for a median 41% of the reported race difference and 22% of the age difference. Injecting demographic decodability leaves the remainder unchanged, while entangling the group with the disease direction raises the race difference from 0.077 to 0.118. No intervention we tested changes the remainder more than a change of random seed does. Those interventions reduce a difference at the operating point and leave the within-group ranking difference at a median of 0.000. Applied to 89 differences in 9 published studies across 6 medical imaging modalities, the reference accounts for a median 25% of a rate difference and 70% of a difference in the area under the receiver operating characteristic curve. Image-text pretraining instead raises worst-group performance by about 0.05. Applying FRAME before choosing an intervention could distinguish differences that need a mechanistic explanation from differences compatible with sampling variation at the current cohort sizes.", "arxiv_id": "2608.25981", "arxiv_url": "https://arxiv.org/abs/2608.25981", "authors": ["Mahshad Lotfinia", "Daniel Truhn", "Andreas Maier", "Soroosh Tayebi Arasteh"], "brief": "\u63d0\u51fa FRAME \u516c\u5e73\u6027\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u516c\u5e73\u6a21\u578b\u53c2\u8003\u5206\u5e03\u5148\u5206\u79bb\u6709\u9650\u6837\u672c\u5bfc\u81f4\u7684\u8868\u89c2\u4e9a\u7ec4\u5dee\u5f02\uff0c\u518d\u5728\u8868\u5f81\u7a7a\u95f4\u6d4b\u8bd5\u5269\u4f59\u5dee\u5f02\u7684\u673a\u5236\u539f\u56e0\u3002\u5927\u89c4\u6a21\u533b\u5b66\u5f71\u50cf\u5b9e\u9a8c\u663e\u793a\uff0c\u91c7\u6837\u53d8\u5f02\u53ef\u89e3\u91ca\u76f8\u5f53\u6bd4\u4f8b\u7684\u79cd\u65cf\u3001\u5e74\u9f84\u6027\u80fd\u5dee\u5f02\uff0c\u5355\u7eaf\u79fb\u9664\u4eba\u53e3\u7edf\u8ba1\u53ef\u89e3\u7801\u4fe1\u606f\u5e76\u4e0d\u80fd\u7a33\u5b9a\u6539\u5584\u516c\u5e73\u6027\uff0c\u800c\u56fe\u6587\u9884\u8bad\u7ec3\u53ef\u63d0\u5347\u6700\u5dee\u7ec4\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25981", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u516c\u5e73\u6027", "\u8868\u5f81\u5b66\u4e60", "\u91c7\u6837\u53d8\u5f02"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25981v1", "published_at": "2026-08-26", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FRAME: separating sampling variation from representational cause in medical imaging fairness", "tldr": "\u63d0\u51fa FRAME \u516c\u5e73\u6027\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u516c\u5e73\u6a21\u578b\u53c2\u8003\u5206\u5e03\u5148\u5206\u79bb\u6709\u9650\u6837\u672c\u5bfc\u81f4\u7684\u8868\u89c2\u4e9a\u7ec4\u5dee\u5f02\uff0c\u518d\u5728\u8868\u5f81\u7a7a\u95f4\u6d4b\u8bd5\u5269\u4f59\u5dee\u5f02\u7684\u673a\u5236\u539f\u56e0\u3002\u5927\u89c4\u6a21\u533b\u5b66\u5f71\u50cf\u5b9e\u9a8c\u663e\u793a\uff0c\u91c7\u6837\u53d8\u5f02\u53ef\u89e3\u91ca\u76f8\u5f53\u6bd4\u4f8b\u7684\u79cd\u65cf\u3001\u5e74\u9f84\u6027\u80fd\u5dee\u5f02\uff0c\u5355\u7eaf\u79fb\u9664\u4eba\u53e3\u7edf\u8ba1\u53ef\u89e3\u7801\u4fe1\u606f\u5e76\u4e0d\u80fd\u7a33\u5b9a\u6539\u5584\u516c\u5e73\u6027\uff0c\u800c\u56fe\u6587\u9884\u8bad\u7ec3\u53ef\u63d0\u5347\u6700\u5dee\u7ec4\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Understanding instruction-following capabilities in scientific domains is essential for effectively leveraging Multimodal Large Language Models (MLLMs) to advance the development of scientific fields. In this work, we introduce SciMIF, a novel benchmark designed to evaluate the capability of MLLMs in following complex scientific instructions. Specifically, based on an extensive analysis of 22 distinct tasks across 5 representative scientific disciplines, we propose a comprehensive taxonomy comprising 10 constraint groups that captures both general functional requirements and discipline-specific characteristics. Guided by this taxonomy, we develop a high-fidelity instruction injection pipeline to systematically augment existing scientific datasets. We conduct comprehensive experiments on multiple state-of-the-art closed-source and open-source MLLMs. Our findings reveal significant performance disparities across different scientific disciplines, with chemistry posing greater challenges for current MLLMs. Furthermore, we observe that increasing the model scale does not yield corresponding improvements in constraint adherence, and current models still struggle severely with fine-grained constraints and instructions requiring the deep application of disciplinary knowledge. SciMIF fills the current void in evaluating multimodal instruction adherence within scientific domains, laying a crucial foundation for future enhancements of MLLMs in rigorous scientific applications. Data and code will be released at https://github.com/shenye7436/SciMIF .", "arxiv_id": "2608.25973", "arxiv_url": "https://arxiv.org/abs/2608.25973", "authors": ["Ye Shen", "Yuting Zheng", "Dun Pei", "Zijian Chen", "Wenlong Zhang", "Qi Jia", "Guangtao Zhai"], "brief": "\u672c\u6587\u63d0\u51fa SciMIF\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u9886\u57df\u7684\u591a\u6a21\u6001\u6307\u4ee4\u9075\u5faa\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d65\u4e2a\u5b66\u79d1\u300122\u7c7b\u4e
