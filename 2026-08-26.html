const PAPERS = [{"abstract": "Agent capability is not determined by the model alone. The agent harness, encompassing memory management, planning strategy, action protocol, and tool/skill orchestration, can dominate the contribution of the underlying foundation model. Yet harness design remains manual, task-specific, and fundamentally unscalable. We present JIT-Agent, a harness intelligence model trained to synthesize task-adaptive agent harnesses on the fly for arbitrary off-the-shelf agentic LLMs. We formalize the agent harness as a composable, machine-generatable artifact governed by a fixed four-module protocol, and train JIT-Agent to customize harnesses for a given task at hand, repair harnesses for stable and reliable execution, and self-evolve by distilling performance signals from an expanding archive of prior harness configurations. Equipped with JIT-Agent as a harness helper, DeepSeek-V4-Flash surpasses GPT-5.6 on DeepSearchQA (+9.1) and OdysseyBench (+4.3), while the already strong GLM-5.2 gains up to +20.2 points. Across controlled evaluations, JIT-Agent-generated harnesses are performance-competitive with mature agent runtimes such as OpenCode and Claude Code and consistently improve multi-scale model families of DeepSeek V4, Mimo-V2.5, and Qwen3.6. To our knowledge, JIT-Agent is the first model purpose-built for just-in-time harness generation, establishing harness intelligence as a trainable, transferable, and compounding dimension of agent capability orthogonal to model scaling.", "arxiv_id": "2608.25593", "arxiv_url": "https://arxiv.org/abs/2608.25593", "authors": ["Guibin Zhang", "Leo Lu", "Fangzhou Xie", "Kang Zhu", "Junhao Wang", "Zhifei Xie", "Zhaochen Yu", "Zihang Liu", "Zhongxiang Sun", "Qiankun Li", "Yue Liao", "Heng Chang", "Xiaobin Hu", "Qibing Ren", "Wangchunshu Zhou", "Shuicheng Yan"], "brief": "\u8bba\u6587\u63d0\u51fa JIT-Agent\uff0c\u4e00\u79cd\u4e13\u95e8\u751f\u6210\u548c\u4f18\u5316\u667a\u80fd\u4f53 harness\uff08\u8bb0\u5fc6\u3001\u ation, strategy planning informed by Strategy Memory, and parameter translation. It dispatches the resulting parameters through a unified outlet with safety guardrails. A Reward Dual Loop continuously optimizes both components by combining offline simulation for strategy-space exploration with online feedback for outcome calibration, forming a cycle of generation, execution, evaluation, and experience accumulation. Large-scale A/B tests on Taobao\u0027s homepage feed show that re-ranking control alone improves IPV by 2.06%, Core IPV by 2.39%, and GMV by 0.88%. Extending control to fine ranking raises these gains to 2.71%, 3.06%, and 1.31%, respectively, while consistently improving PV by more than 1%. These gains require neither replacement of pipeline models nor compromise of serving stability, supporting agentic meta-control as a viable paradigm for industrial recommendation.", "arxiv_id": "2608.09408", "arxiv_url": "https://arxiv.org/abs/2608.09408", "authors": ["Bin Zhang", "Bowen Zheng", "Chao Yi", "Chengyu Lai", "Dian Chen", "Dimin Wang", "Gaoyang Guo", "Jialin Zhu", "Jian Wu", "Jing Yu", "Jiuning Lin", "Lingqing Zhang", "Lingyun Zheng", "Mao Zhang", "Mingming Pan", "Ruiquan Lan", "Shuai Zhong", "Wen Chen", "Wendong Zhang", "Xiaodong Zhu", "Xuan Chen", "Xunke Xi", "Yifan Lu", "Yiheng Wang", "Yue Zeng", "Yujie Luo", "Yuning Jiang", "Zhe Hu", "Zhibo Xiao", "Zihong Huang", "Binbin Cao", "Bo Zheng", "Danning Wang", "Dixuan Wang", "Ge Fan", "Haixia Wu", "Han Zhu", "Hao Fang", "Haoming Chen", "Huiping Chu", "Jian Wang", "Jianjun Wu", "Jiawei Wu", "Jiaxin Yu", "Jingwen Liu", "Jinzhe Shan", "Kai Meng", "Kai Zhang", "Keqin Xu", "Kewei Zhu", "Lang Tian", "Leihui Chen", "Li Chen", "Licheng Xu", "Lide Xiao", "Ruitong Zhang", "Shiyao Peng", "Silu Zhou", "Tao Wang", "Wei Shi", "Wenjun Yang", "Xiang Chen", "Xiang Gao", "Xiao Ren", "Xu Liu", "Xuwen Wang", "Yang Li", "Yeqiu Yang", "Yi Hu", "Yichen Yuan", "Yinnan Song", "Yipeng Yu", "Yuan Liu", "Yunqi Gao", "Zhiliang Huang", "Z r diagnostics show that denoising-friendly lengths need not match reference lengths. Evaluation by three translation experts supports the En$\\leftrightarrow$Zh adequacy gains, with stronger evidence on Zh$\\to$En. Compared with a LLaMA-3-8B autoregressive (AR) model trained on the same fine-tuning data, the EV system ties on En$\\to$Zh and leads on Zh$\\to$En; an oracle-length diagnostic further shows that, in this masked diffusion MT setting, deciding which tokens to reveal first matters less than how the target length is supplied.", "arxiv_id": "2608.22274", "arxiv_url": "https://arxiv.org/abs/2608.22274", "authors": ["Yan Zhan", "Mengkai Hou", "Wanting Zhang", "Zhijun Gao"], "brief": "\u8bba\u6587\u63d0\u51fa Entropy-Valley\uff08EV\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u76ee\u6807\u957f\u5ea6\u9009\u62e9\u65b9\u6cd5\uff0c\u7528\u4e8e masked diffusion language models \u7684\u673a\u5668\u7ffb\u8bd1\u89e3\u7801\u3002\u5b83\u901a\u8fc7\u5168\u63a9\u7801\u524d\u5411\u4f20\u64ad\u8bc4\u4f30\u4e0d\u540c\u5019\u9009\u76ee\u6807\u957f\u5ea6\u7684\u5e73\u5747\u9884\u6d4b\u71b5\uff0c\u9009\u62e9\u6a21\u578b\u6700\u201c\u51c6\u5907\u597d\u201d\u586b\u5145\u7684\u753b\u5e03\u957f\u5ea6\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/Entropy-Valley/Entropy-Valley", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.22274", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["EV \u4e0d\u6539\u6a21\u578b\u3001\u4e0d\u9700\u989d\u5916\u8bad\u7ec3\uff0c\u4ec5\u57fa\u4e8e\u5019\u9009\u957f\u5ea6\u4e0b\u7684 mean predictive entropy \u8fdb\u884c\u957f\u5ea6\u9009\u62e9\u3002", "\u76f8\u8f83\u57fa\u4e8e\u8bad\u7ec3\u8bed\u6599\u957f\u5ea6\u7edf\u8ba1\u7684\u57fa\u7ebf\uff0cEV \u5728 En\u2192Zh\u3001Zh\u2192En\u3001En\u2192De \u4e0a\u5206\u522b\u6062\u590d\u4e86\u4f7f\u7528\u53c2\u8003\u76ee\u6807\u957f\u5ea6\u5e26\u6765\u7684 COMET-22 \u589e\u76ca\u7684 64.9%\u300165.3% \u548c 33.0%\u3002", "\u8bca\u65ad\u53d1\u73b0\u6700\u5229\u4e8e\u53bb\u566a\u7684\u957f\u5ea6\u4e0d\u4e00\u5b9a\u7b49\u4e8e\u53c2\u8003\u8bd1\u6587\u957f\u5ea6\uff1b\u5728\u8be5\u6269\u6563\u7ffb\u8bd1\u8bbe\u7f6e\u4e2d\uff0c\u76ee\u6807\u957f\u5ea6\u4f9b\u7ed9\u6bd4\u5148\u63ed\u793a\u54ea\u4e9b token \u66f4\u5173\u952e\u3002"], "keywords": ["\u673a\u5668\u7ffb\u8bd1", "\u6269\u6563\u6a21\u578b", "\u89e3\u7801\u7b56\u7565", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2608.22274v1", "published_at": "2026-08-23", "score": 0.271, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.22274.png", "title": "Length-Adaptive Decoding for Masked Diffusion Machine Translation", "tldr": "\u7528\u71b5\u8c37\u4e3a\u6269\u6563\u7ffb\u8bd1\u81ea\u9002\u5e94\u9009\u957f\u5ea6", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa Entropy-Valley\uff08EV\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u76ee\u6807\u957f\u5ea6\u9009\u62e9\u65b9\u6cd5\uff0c\u7528\u4e8e masked diffusion language models \u7684\u673a\u5668\u7ffb\u8bd1\u89e3\u7801\u3002\u5b83\u901a\u8fc7\u5168\u63a9\u7801\u524d\u5411\u4f20\u64ad\u8bc4\u4f30\u4e0d\u540c\u5019\u9009\u76ee\u6807\u957f\u5ea6\u7684\u5e73\u5747\u9884\u6d4b\u71b5\uff0c\u9009\u62e9\u6a21\u578b\u6700\u201c\u51c6\u5907\u597d\u201d\u586b\u5145\u7684\u753b\u5e03\u957f\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa masked diffusion MT \u4e2d\u88ab\u4f4e\u4f30\u7684\u6838\u5fc3\u74f6\u9888\u662f\u76ee\u6807\u957f\u5ea6\u51b3\u7b56\uff0c\u5e76\u7ed9\u51fa\u7b80\u5355\u6709\u6548\u7684\u8bad\u7ec3\u514d\u8d39\u65b9\u6848\uff1b\u5728\u4e2d\u82f1\u7ffb\u8bd1\u4e0a\u53ef\u63a5\u8fd1\u751a\u81f3\u8d85\u8fc7\u540c\u6570\u636e\u8bad\u7ec3\u7684 LLaMA-3-8B \u81ea\u56de\u5f52\u6a21\u578b\uff0c\u663e\u793a\u6269\u6563\u5f0f\u7ffb\u8bd1\u5177\u6709\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Modern software -- from plugin systems to self-evolving agent harnesses -- increasingly requires dynamic composition, yet its formal foundations remain underdeveloped. We identify two orthogonal dimensions of the problem: temporal composability, the ability to completely revert a component\u0027s side effects upon removal, and spatial composability, the ability to declare and reactively manage inter-component dependencies. We address the two dimensions by lifting classical effect and coeffect concepts to runtime mechanisms. In particular, we formalize revertible effects, in which every context transformation carries an inverse that the runtime holds, establishing temporal composability local to one component. We formalize reactive coeffects, in which every context change is classified against a component\u0027s coeffect specification to drive its activation and deactivation, establishing spatial composability local to one component. We then unify the effect context and the coeffect context into a single context type and mediate every effect and coeffect through it, yielding a discipline we call the context paradigm; the mediation induces an observational equivalence up to which the effects of distinct components interleave without disturbing one another. Combining these mechanisms into the notion of a component, we give a calculus of dynamic composition whose metatheory carries spatiotemporal composability from a single component to a whole system of interleaved components. We implement these ideas in Cordis, a meta-framework of spatiotemporal composability that provides a core library with effect tracking and coeffect resolution, as well as a declarative component loader with configuration reconciliation and hot module replacement.", "arxiv_id": "2608.25512", "arxiv_url": "https://arxiv.org/abs/2608.25512", "authors": ["Yifan Shi", "Wei Zhang", "Tianyi Cui"], "brief": "\u8bba\u6587\u5c06\u4f20\u7edf\u6548\u5e94\u4e0e\u4f59\u6548\u5e94\u63d0\u5347\u4e3a\u8fd0\u884c\u65f6\u673a\u5236\uff0c\u5f62\u5f0f\u5316\u201c\u53ef\u56de\u6eda\u6548\u5e94\u201d\u548c\u201c\u53cd\u5e94\u5f0f\u4f59\u6548\u5e94\u201d\uff0c\u5206\u522b\u89e3\u51b3\u7ec4\u4ef6\u5378\u8f7d\u540e\u7684\u526f\u4f5c\u7528\u6062\u590d\u4e0e\u7ec4\u4ef6\u4f9d\u8d56\u7684\u52a8\u6001\u7ba1\u7406\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u7edf\u4e00\u4e8c\u8005\u4e3a context paradigm\uff0c\u5e76\u5b9e\u73b0\u4e86 Cordis \u5143\u6846\u67b6\uff0c\u652f\u6301\u6548\u5e94\u8ddf\u8e2a\u3001\u4f59\u6548\u5e94\u89e3\u6790\u3001\u914d\u7f6e\u534f\u8c03\u548c\u70ed\u6a21\u5757\u66ff\u6362\u3002", "categories": ["cs.PL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25512", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u53ef\u56de\u6eda\u6548\u5e94\uff1a\u6bcf\u6b21\u4e0a\u4e0b\u6587\u53d8\u6362\u90fd\u643a\u5e26\u8fd0\u884c\u65f6\u4fdd\u5b58\u7684\u9006\u64cd\u4f5c\uff0c\u4f7f\u7ec4\u4ef6\u79fb\u9664\u65f6\u80fd\u5b8c\u6574\u64a4\u9500\u5176\u526f\u4f5c\u7528\u3002", "\u63d0\u51fa\u53cd\u5e94\u5f0f\u4f59\u6548\u5e94\uff1a\u6839\u636e\u7ec4\u4ef6\u58f0\u660e\u7684\u4e0a\u4e0b\u6587\u4f9d\u8d56\uff0c\u5bf9\u4e0a\u4e0b\u6587\u53d8\u5316\u8fdb\u884c\u5206\u7c7b\u5e76\u89e6\u53d1\u7ec4\u4ef6\u6fc0\u6d3b\u6216\u505c\u7528\u3002", "\u6784\u5efa\u7edf\u4e00\u4e0a\u4e0b\u6587\u8303\u5f0f\u4e0e\u52a8\u6001\u7ec4\u5408\u6f14\u7b97\uff0c\u8bc1\u660e\u5355\u7ec4\u4ef6\u7684\u65f6\u7a7a\u53ef\u7ec4\u5408\u6027\u53ef\u6269\u5c55\u5230\u591a\u7ec4\u4ef6\u4ea4\u9519\u7cfb\u7edf\u3002"], "keywords": ["\u7a0b\u5e8f\u8bed\u8a00", "\u8f6f\u4ef6\u5de5\u7a0b", "\u52a8\u6001\u7ec4\u5408", "\u6548\u5e94\u7cfb\u7edf"], "num_comments": 0, "on_hf": true, "organization": "DeepSeek", "pdf_url": "https://arxiv.org/pdf/2608.25512v1", "published_at": "2026-08-26", "score": 0.266, "selected_reasons": ["\u77e5\u540d\u673a\u6784: DeepSeek", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25512.png", "title": "A Programming Paradigm for Spatiotemporal Composability", "tldr": "\u63d0\u51fa\u53ef\u65f6\u7a7a\u7ec4\u5408\u7684\u52a8\u6001\u7ec4\u4ef6\u7f16\u7a0b\u8303\u5f0f", "upvotes": 2, "what_it_is": "\u8bba\u6587\u5c06\u4f20\u7edf\u6548\u5e94\u4e0e\u4f59\u6548\u5e94\u63d0\u5347\u4e3a\u8fd0\u884c\u65f6\u673a\u5236\uff0c\u5f62\u5f0f\u5316\u201c\u53ef\u56de\u6eda\u6548\u5e94\u201d\u548c\u201c\u53cd\u5e94\u5f0f\u4f59\u6548\u5e94\u201d\uff0c\u5206\u522b\u89e3\u51b3\u7ec4\u4ef6\u5378\u8f7d\u540e\u7684\u526f\u4f5c\u7528\u6062\u590d\u4e0e\u7ec4\u4ef6\u4f9d\u8d56\u7684\u52a8\u6001\u7ba1\u7406\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u7edf\u4e00\u4e8c\u8005\u4e3a context paradigm\uff0c\u5e76\u5b9e\u73b0\u4e86 Cordis \u5143\u6846\u67b6\uff0c\u652f\u6301\u6548\u5e94\u8ddf\u8e2a\u3001\u4f59\u6548\u5e94\u89e3\u6790\u3001\u914d\u7f6e\u534f\u8c03\u548c\u70ed\u6a21\u5757\u66ff\u6362\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u63d2\u4ef6\u7cfb\u7edf\u3001\u70ed\u66f4\u65b0\u6846\u67b6\u548c\u81ea\u6f14\u5316\u8f6f\u4ef6\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u5f62\u5f0f\u5316\u57fa\u7840\uff0c\u628a\u52a8\u6001\u7ec4\u5408\u4e2d\u7684\u526f\u4f5c\u7528\u56de\u6eda\u4e0e\u4f9d\u8d56\u54cd\u5e94\u7edf\u4e00\u5230\u540c\u4e00\u8fd0\u884c\u65f6\u4e0a\u4e0b\u6587\u673a\u5236\u4e2d\uff0c\u517c\u5177\u7406\u8bba\u521b\u65b0\u548c\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Prompt injection is listed as the \\#1 threat to AI agents. When an agent accesses external data from websites, files, or emails, an attacker may inject a prompt into the data, saying, \"Ignore all prior instructions and perform \u003can attacker\u0027s task\u003e.\" To prevent arbitrary manipulation of agents, defenders try to train secure LLMs, which, however, still suffer from near 100% attack success rates (ASRs) against adaptive prompt injections. We note that this is because existing defensive finetuning recipes rely on sequence-level feedback signals (in DPO or GRPO). Treating an entire output equally prevents the model from learning precisely which output tokens are insecure. In this paper, we propose Secure On-Policy Distillation (SecOPD) that provides token-level feedback to guide defensive fine-tuning. The LLM receives an injected sample and produces a rollout, whose tokens are scored by the initialization model given the corresponding clean input. With more fine-grained training signals, our defended Qwen3.6-27B achieves a 9.0% ASR against the SoTA PISmith adaptive prompt injections, compared to 94.0% for the prior SoTA, Meta-SecAlign. The obtained security generalizes to domains completely unseen in training: in agentic tool calling, SecOPD achieves a 4.7% ASR compared to 5.5% for Meta-SecAlign. Code and the model are available at https://github.com/pppyb/SecOPD and https://huggingface.co/pybbb/Qwen3.6-27B-SecOPD.", "arxiv_id": "2608.21500", "arxiv_url": "https://arxiv.org/abs/2608.21500", "authors": ["Yibo Peng", "Long Lian", "David Wagner", "Sizhe Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Secure On-Policy Distillation\uff08SecOPD\uff09\uff0c\u7528\u4e8e\u9632\u5fa1\u9762\u5411 AI Agent \u7684\u81ea\u9002\u5e94\u63d0\u793a\u6ce8\u5165\u653b\u51fb\u3002\u5b83\u7528\u5e72\u51c0\u8f93\u5165\u4e0b\u521d\u59cb\u5316\u6a21\u578b\u7684\u8f93\u51fa\u5bf9\u6ce8\u5165\u6837\u672c rollout \u8fdb\u884c\u9010 token \u6253\u5206\uff0c\u4ece\u800c\u4e3a\u5b89\u5168\u5fae\u8c03\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u53cd\u9988\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": "https://github.com/pppyb/SecOPD", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.21500", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u73b0\u6709 DPO/GRPO \u7b49\u9632\u5fa1\u5fae\u8c03\u4f9d\u8d56\u5e8f\u5217\u7ea7\u53cd\u9988\uff0c\u96be\u4ee5\u5b9a\u4f4d\u5177\u4f53\u4e0d\u5b89\u5168 token\uff0c\u5bfc\u81f4\u9762\u5bf9\u81ea\u9002\u5e94\u653b\u51fb\u4ecd\u63a5\u8fd1 100% \u653b\u51fb\u6210\u529f\u7387\u3002", "SecOPD \u91c7\u7528 on-policy rollout\uff0c\u5e76\u7528\u5bf9\u5e94\u5e72\u51c0\u8f93\u5165\u7684\u521d\u59cb\u5316\u6a21\u578b\u5bf9\u751f\u6210 token \u9010\u6b65\u8bc4\u5206\uff0c\u5b9e\u73b0 token-level \u5b89\u5168\u84b8\u998f\u3002", "\u5728 PISmith \u81ea\u9002\u5e94\u63d0\u793a\u6ce8\u5165\u4e0a\uff0c\u9632\u5fa1\u540e\u7684 Qwen3.6-27B \u5c06 ASR \u964d\u81f3 9.0%\uff0c\u663e\u8457\u4f18\u4e8e Meta-SecAlign \u7684 94.0%\uff1b\u5728\u672a\u89c1\u8fc7\u7684\u5de5\u5177\u8c03\u7528\u573a\u666f\u4e2d ASR \u4e3a 4.7%\u3002"], "keywords": ["\u63d0\u793a\u6ce8\u5165", "\u667a\u80fd\u4f53\u5b89\u5168", "\u5b89\u5168\u5fae\u8c03", "\u84b8\u998f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21500v1", "published_at": "2026-08-21", "score": 0.263, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (36\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21500.png", "title": "SecOPD: Mitigating Adaptive Prompt Injections by On-Policy Distillation", "tldr": "\u7528\u9010 token \u84b8\u998f\u663e\u8457\u964d\u4f4e\u81ea\u9002\u5e94\u63d0\u793a\u6ce8\u5165\u6210\u529f\u7387", "upvotes": 36, "what_it_is": "\u8bba\u6587\u63d0\u51fa Secure On-Policy Distillation\uff08SecOPD\uff09\uff0c\u7528\u4e8e\u9632\u5fa1\u9762\u5411 AI Agent \u7684\u81ea\u9002\u5e94\u63d0\u793a\u6ce8\u5165\u653b\u51fb\u3002\u5b83\u7528\u5e72\u51c0\u8f93\u5165\u4e0b\u521d\u59cb\u5316\u6a21\u578b\u7684\u8f93\u51fa\u5bf9\u6ce8\u5165\u6837\u672c rollout \u8fdb\u884c\u9010 token \u6253\u5206\uff0c\u4ece\u800c\u4e3a\u5b89\u5168\u5fae\u8c03\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u53cd\u9988\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u76f4\u63a5\u9488\u5bf9 AI Agent \u5f53\u524d\u6700\u6838\u5fc3\u5b89\u5168\u5a01\u80c1\u4e4b\u4e00\uff0c\u4e14\u5728\u5f3a\u81ea\u9002\u5e94\u653b\u51fb\u4e0b\u53d6\u5f97\u5927\u5e45\u6539\u8fdb\uff1b\u5176\u9010 token \u53cd\u9988\u601d\u8def\u4e5f\u4e3a\u5b89\u5168\u5bf9\u9f50\u5fae\u8c03\u63d0\u4f9b\u4e86\u6bd4\u5e8f\u5217\u7ea7\u504f\u597d\u4f18\u5316\u66f4\u7cbe\u7ec6\u7684\u8bad\u7ec3\u8303\u5f0f\u3002"}, {"abstract": "Agentic LLM pipelines face escalating inference costs as context accumulates across retrieval, tool use, and multi-turn interactions. To control latency, deployments routinely compress inputs, but this degrades task accuracy. Speculative decoding (SD) accelerates generation losslessly, yet it assumes the drafter and verifier share an identical context, preventing SD from resolving the accuracy-overhead trade-off. We propose AsymSpec, an asymmetric speculative decoding framework that breaks this symmetry: a lightweight drafter reads the full input while the large verifier operates on the compressed view. The drafter steers the verifier via a contrastive $\u03b4$-fusion of logits, modulated by a divergence-aware acceptance gate that preserves verification stability and high draft acceptance rates. Evaluated across four agentic capabilities and two end-to-end agent benchmarks, AsymSpec reaches $\\approx 90\\%$ of full-context accuracy on average, delivering $1.3$--$1.7\\times$ throughput speedups at $0.2$--$0.3\\times$ the compute cost on isolated text capabilities. These results show that asymmetric context access yields substantial gains precisely when compression discards critical reasoning signals.", "arxiv_id": "2608.26004", "arxiv_url": "https://arxiv.org/abs/2608.26004", "authors": ["Sheng Liang", "Yongyue Zhang", "Nathanael Brian", "Hang Lv", "Hao Wang", "Chen Zhang", "Yong Liu"], "brief": "\u8bba\u6587\u63d0\u51fa AsymSpec\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53 LLM \u7684\u4e0a\u4e0b\u6587\u975e\u5bf9\u79f0\u63a8\u6d4b\u89e3\u7801\u6846\u67b6\uff1a\u5c0f\u578b\u8349\u7a3f\u6a21\u578b\u8bfb\u53d6\u5b8c\u6574\u8f93\u5165\uff0c\u5927\u578b\u9a8c\u8bc1\u6a21\u578b\u53ea\u770b\u538b\u7f29\u4e0a\u4e0b\u6587\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u5f0f \u03b4-fusion \u878d\u5408 logits\uff0c\u5e76\u7528\u611f\u77e5\u5206\u6b67\u7684\u63a5\u53d7\u95e8\u63a7\u7a33\u5b9a\u9a8c\u8bc1\u8fc7\u7a0b\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26004", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6253\u7834\u4f20\u7edf\u63a8\u6d4b\u89e3\u7801\u4e2d\u8349\u7a3f\u6a21\u578b\u4e0e\u9a8c\u8bc1\u6a21\u578b\u5fc5\u987b\u5171\u4eab\u540c\u4e00\u4e0a\u4e0b\u6587\u7684\u5047\u8bbe\uff0c\u7528\u5b8c\u6574\u4e0a\u4e0b\u6587\u8349\u7a3f\u6a21\u578b\u5f25\u8865\u538b\u7f29\u4e0a\u4e0b\u6587\u4e22\u5931\u7684\u4fe1\u606f\u3002", "\u8bbe\u8ba1 contrastive \u03b4-fusion logits \u5f15\u5bfc\u673a\u5236\uff0c\u5e76\u7ed3\u5408 divergence-aware acceptance gate\uff0c\u4ee5\u4fdd\u6301\u8f83\u9ad8\u8349\u7a3f\u63a5\u53d7\u7387\u548c\u9a8c\u8bc1\u7a33\u5b9a\u6027\u3002", "\u5728\u56db\u7c7b\u667a\u80fd\u4f53\u80fd\u529b\u4e0e\u4e24\u4e2a\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\uff0c\u5e73\u5747\u8fbe\u5230\u7ea6 90% \u5168\u4e0a\u4e0b\u6587\u51c6\u786e\u7387\uff0c\u5e76\u5728\u6587\u672c\u80fd\u529b\u6d4b\u8bd5\u4e2d\u5b9e\u73b0 1.3\u20131.7 \u500d\u541e\u5410\u63d0\u5347\u3001\u4ec5\u9700 0.2\u20130.3 \u500d\u8ba1\u7b97\u6210\u672c\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u6d4b\u89e3\u7801", "\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26004v1", "published_at": "2026-08-26", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AsymSpec: Context-Asymmetric Speculative Decoding for Agentic LLMs", "tldr": "\u975e\u5bf9\u79f0\u63a8\u6d4b\u89e3\u7801\u964d\u4f4e\u667a\u80fd\u4f53\u957f\u4e0a\u4e0b\u6587\u6210\u672c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AsymSpec\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53 LLM \u7684\u4e0a\u4e0b\u6587\u975e\u5bf9\u79f0\u63a8\u6d4b\u89e3\u7801\u6846\u67b6\uff1a\u5c0f\u578b\u8349\u7a3f\u6a21\u578b\u8bfb\u53d6\u5b8c\u6574\u8f93\u5165\uff0c\u5927\u578b\u9a8c\u8bc1\u6a21\u578b\u53ea\u770b\u538b\u7f29\u4e0a\u4e0b\u6587\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u5f0f \u03b4-fusion \u878d\u5408 logits\uff0c\u5e76\u7528\u611f\u77e5\u5206\u6b67\u7684\u63a5\u53d7\u95e8\u63a7\u7a33\u5b9a\u9a8c\u8bc1\u8fc7\u7a0b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u76f4\u63a5\u9488\u5bf9\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u68c0\u7d22\u3001\u5de5\u5177\u8c03\u7528\u548c\u591a\u8f6e\u4ea4\u4e92\u5bfc\u81f4\u7684\u4e0a\u4e0b\u6587\u81a8\u80c0\u95ee\u9898\uff0c\u5728\u4e0d\u7b80\u5355\u727a\u7272\u51c6\u786e\u7387\u7684\u60c5\u51b5\u4e0b\u517c\u987e\u538b\u7f29\u3001\u52a0\u901f\u4e0e\u63a8\u7406\u8d28\u91cf\uff0c\u4e3a\u957f\u4e0a\u4e0b\u6587\u667a\u80fd\u4f53\u90e8\u7f72\u63d0\u4f9b\u4e86\u5b9e\u7528\u7684\u63a8\u7406\u4f18\u5316\u65b9\u5411\u3002"}, {"abstract": "Multi-agent large language model (LLM) workflows have emerged as a powerful paradigm for solving complex, open-ended tasks through collaborative reasoning among specialized LLM agents, but they incur substantial operating costs due to repeated LLM invocations and long-horizon context accumulation. Existing cascade routing methods make one-shot, query-level decisions and cannot adapt to the dynamic, state-dependent nature of multi-step workflows, in which the right LLM at each step depends on evolving task progress, remaining task difficulty, and cost-efficiency requirements. We present ProgRouter, an online progress-guided routing framework that adaptively selects LLM agents across workflow steps to preserve task-solving quality while adhering to time and cost budgets. ProgRouter introduces a multi-view task progress scorer that combines coarse workflow outcome regimes with fine-grained signals on subtask completion, progress trends, and workflow state quality. Then, a dual-path task progress predictor and an adaptive meta-gating mechanism estimate the progress gain for each candidate routed LLM. ProgRouter makes online step-wise routing decisions that balance progress gain, task time budgets, and long-term operating cost efficiency. Experiments on HumanEval Plus, MBPP, MATH-500, and ASQA, spanning agentic code generation, mathematical reasoning, and retrieval-augmented long-form question answering, demonstrate that ProgRouter reduces the operating cost relative to key baselines while maintaining strong task-solving performance.", "arxiv_id": "2608.25992", "arxiv_url": "https://arxiv.org/abs/2608.25992", "authors": ["Somgyuan Li", "Ahmed M. Abdelmoniem", "Shiqiang Wang"], "brief": "\u672c\u6587\u63d0\u51fa ProgRouter\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u667a\u80fd\u4f53 LLM \u5de5\u4f5c\u6d41\u7684\u5728\u7ebf\u8def\u7531\u6846\u67b6\uff0c\u53ef\u5728\u6bcf\u4e2a\u6b65\u9aa4\u6839\u636e\u4efb\u52a1\u8fdb\u5c55\u3001\u9884\u7b97\u548c\u6210\u672c\u6548\u7387\u52a8\u6001\u9009\u62e9\u5408\u9002\u7684 LLM \u667a\u80fd\u4f53\u3002\u5b83\u65e8\u5728\u5728\u4fdd\u6301\u89e3\u9898\u8d28\u91cf\u7684\u540c\u65f6\u964d\u4f4e\u957f\u6d41\u7a0b\u3001\u591a\u6b21\u8c03\u7528\u5e26\u6765\u7684\u8fd0\u884c\u6210\u672c\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25992", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u591a\u89c6\u89d2\u4efb\u52a1\u8fdb\u5c55\u8bc4\u5206\u5668\uff0c\u7ed3\u5408\u6574\u4f53\u5de5\u4f5c\u6d41\u7ed3\u679c\u72b6\u6001\u3001\u5b50\u4efb\u52a1\u5b8c\u6210\u5ea6\u3001\u8fdb\u5c55\u8d8b\u52bf\u548c\u5f53\u524d\u72b6\u6001\u8d28\u91cf\u7b49\u4fe1\u53f7\u3002", "\u8bbe\u8ba1\u53cc\u8def\u5f84\u4efb\u52a1\u8fdb\u5c55\u9884\u6d4b\u5668\u4e0e\u81ea\u9002\u5e94\u5143\u95e8\u63a7\u673a\u5236\uff0c\u7528\u4e8e\u4f30\u8ba1\u4e0d\u540c\u5019\u9009 LLM \u5728\u4e0b\u4e00\u6b65\u53ef\u80fd\u5e26\u6765\u7684\u8fdb\u5c55\u589e\u76ca\u3002", "\u5728 HumanEval Plus\u3001MBPP\u3001MATH-500 \u548c ASQA \u4e0a\u9a8c\u8bc1\uff0c\u8986\u76d6\u4ee3\u7801\u751f\u6210\u3001\u6570\u5b66\u63a8\u7406\u548c\u68c0\u7d22\u589e\u5f3a\u957f\u95ee\u7b54\uff0c\u8f83\u57fa\u7ebf\u964d\u4f4e\u6210\u672c\u5e76\u4fdd\u6301\u8f83\u5f3a\u6027\u80fd\u3002"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u8def\u7531", "\u591a\u667a\u80fd\u4f53", "\u6210\u672c\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25992v1", "published_at": "2026-08-26", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ProgRouter: Online Progress-Guided Orchestration for Multi-Agent LLM Workflows under Quality-Cost Tradeoffs", "tldr": "\u6309\u4efb\u52a1\u8fdb\u5c55\u52a8\u6001\u8def\u7531\u591a\u667a\u80fd\u4f53LLM", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa ProgRouter\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u667a\u80fd\u4f53 LLM \u5de5\u4f5c\u6d41\u7684\u5728\u7ebf\u8def\u7531\u6846\u67b6\uff0c\u53ef\u5728\u6bcf\u4e2a\u6b65\u9aa4\u6839\u636e\u4efb\u52a1\u8fdb\u5c55\u3001\u9884\u7b97\u548c\u6210\u672c\u6548\u7387\u52a8\u6001\u9009\u62e9\u5408\u9002\u7684 LLM \u667a\u80fd\u4f53\u3002\u5b83\u65e8\u5728\u5728\u4fdd\u6301\u89e3\u9898\u8d28\u91cf\u7684\u540c\u65f6\u964d\u4f4e\u957f\u6d41\u7a0b\u3001\u591a\u6b21\u8c03\u7528\u5e26\u6765\u7684\u8fd0\u884c\u6210\u672c\u3002", "why_notable": "\u73b0\u6709\u7ea7\u8054\u8def\u7531\u591a\u662f\u4e00\u6b21\u6027\u3001\u67e5\u8be2\u7ea7\u51b3\u7b56\uff0c\u96be\u4ee5\u9002\u5e94\u591a\u6b65\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4e2d\u7684\u52a8\u6001\u72b6\u6001\u53d8\u5316\uff1bProgRouter \u5c06\u8def\u7531\u51b3\u7b56\u7ec6\u5316\u5230\u6b65\u9aa4\u7ea7\uff0c\u5e76\u663e\u5f0f\u5efa\u6a21\u4efb\u52a1\u8fdb\u5c55\u4e0e\u6210\u672c\u9884\u7b97\uff0c\u5bf9\u5b9e\u9645\u90e8\u7f72\u4f4e\u6210\u672c\u9ad8\u8d28\u91cf LLM \u667a\u80fd\u4f53\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Evaluation is shifting from static QA toward agentic settings where models act through external tools. We identify a critical yet underexplored capability within this space - dexterous visual tool use: fine-grained, closed-loop parameterized visual action in which models infer tool parameters from visual evidence, and those parameters directly govern the final result. Existing benchmarks cover web navigation, GUI operation, and software engineering, but rarely target this coupling between visual evidence and execution precision. We propose EASEL, a benchmark evaluating a controlled instance of dexterous visual tool use that adopts reference-guided visual reconstruction as its primary proxy task: the agent incrementally paints a canvas to match a reference image. EASEL additionally includes semantic tasks spanning region annotation, handwriting, and path planning. We further provide EASEL-Data, a 440k-sample two-stage curriculum dataset for trajectory supervision, and EASEL-9B to investigate its effect on this capability. Evaluation of 25 models reveals that current multimodal agents systematically struggle on EASEL. Reconstruction similarity bottlenecks at low levels (0.40-0.54), while trajectory diagnostics expose severe closed-loop instability - models typically saturate early or degrade post-peak. Semantic tasks reveal sharp capability boundaries in precision annotation and path planning. EASEL-9B, trained on EASEL-Data, surpasses the base model by a relative 6.3%, ranking third among all evaluated models.", "arxiv_id": "2608.25417", "arxiv_url": "https://arxiv.org/abs/2608.25417", "authors": ["Shudong Liu", "Dongyang Chen", "Enci Zhang", "Jinwei Liang", "Zheng Ma", "Lewei Lu"], "brief": "\u8bba\u6587\u63d0\u51fa EASEL \u57fa\u51c6\uff0c\u7528\u201c\u770b\u56fe\u4f5c\u753b\u201d\u5f0f\u53c2\u8003\u56fe\u91cd\u5efa\u6765\u8bc4\u4f30\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u7cbe\u7ec6\u95ed\u73af\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u80fd\u529b\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 44 \u4e07\u6837\u672c\u7684 EASEL-Data \u8bfe\u7a0b\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3 EASEL-9B \u9a8c\u8bc1\u8f68\u8ff9\u76d1\u7763\u7684\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25417", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6838\u5fc3\u4efb\u52a1\u8981\u6c42\u667a\u80fd\u4f53\u6839\u636e\u53c2\u8003\u56fe\u9010\u6b65\u8c03\u6574\u7ed8\u753b\u5de5\u5177\u53c2\u6570\uff0c\u5728\u753b\u5e03\u4e0a\u91cd\u5efa\u76ee\u6807\u56fe\u50cf\uff0c\u5f3a\u8c03\u89c6\u89c9\u8bc1\u636e\u4e0e\u6267\u884c\u7cbe\u5ea6\u7684\u8026\u5408\u3002", "\u57fa\u51c6\u8fd8\u5305\u542b\u533a\u57df\u6807\u6ce8\u3001\u624b\u5199\u3001\u8def\u5f84\u89c4\u5212\u7b49\u8bed\u4e49\u4efb\u52a1\uff0c\u7528\u4e8e\u6d4b\u8bd5\u7cbe\u7ec6\u5b9a\u4f4d\u3001\u8f68\u8ff9\u63a7\u5236\u548c\u89c4\u5212\u80fd\u529b\u8fb9\u754c\u3002", "\u8bc4\u6d4b 25 \u4e2a\u6a21\u578b\u53d1\u73b0\u5f53\u524d\u591a\u6a21\u6001\u667a\u80fd\u4f53\u8868\u73b0\u666e\u904d\u8f83\u5f31\uff0c\u91cd\u5efa\u76f8\u4f3c\u5ea6\u4ec5\u7ea6 0.40-0.54\uff0c\u4e14\u95ed\u73af\u6267\u884c\u5e38\u51fa\u73b0\u65e9\u671f\u9971\u548c\u6216\u5cf0\u503c\u540e\u9000\u5316\u3002"], "keywords": ["\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u89c6\u89c9\u63a7\u5236", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25417v1", "published_at": "2026-08-26", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Paint What You See: Benchmarking Dexterous Visual Tool Use in Multimodal Agents", "tldr": "EASEL\u8bc4\u6d4b\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7cbe\u7ec6\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EASEL \u57fa\u51c6\uff0c\u7528\u201c\u770b\u56fe\u4f5c\u753b\u201d\u5f0f\u53c2\u8003\u56fe\u91cd\u5efa\u6765\u8bc4\u4f30\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u7cbe\u7ec6\u95ed\u73af\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u80fd\u529b\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 44 \u4e07\u6837\u672c\u7684 EASEL-Data \u8bfe\u7a0b\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3 EASEL-9B \u9a8c\u8bc1\u8f68\u8ff9\u76d1\u7763\u7684\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u8db3\u4e86\u73b0\u6709 GUI\u3001\u7f51\u9875\u5bfc\u822a\u3001\u4ee3\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e4b\u5916\u7684\u7a7a\u767d\uff0c\u805a\u7126\u89c6\u89c9\u9a71\u52a8\u7684\u53c2\u6570\u5316\u7cbe\u7ec6\u64cd\u4f5c\uff1b\u5176\u6570\u636e\u96c6\u548c\u8bca\u65ad\u6307\u6807\u6709\u52a9\u4e8e\u63a8\u52a8\u591a\u6a21\u6001\u667a\u80fd\u4f53\u4ece\u201c\u4f1a\u8c03\u7528\u5de5\u5177\u201d\u8d70\u5411\u201c\u7cbe\u51c6\u63a7\u5236\u5de5\u5177\u201d\u3002"}, {"abstract": "Agentic coding workflows are now widely deployed in real-world systems. With long-horizon reasoning and tool use, token usage has become an important consideration for both cost and efficiency. Two engineers using AI will solve the same problem differently. How the specification of a task shapes an agent\u0027s token spend, and whether that spend can be predicted in advance, are open questions. Here, we study the effects of different task specifications on agentic token spend with the Kimi K3 model at three thinking efforts. Across $2,700$ runs, we show that reducing a full task specification to a bare user story raises token spend by $29.7\\%$, while run-to-run variance remains unaffected by any prompt changes. We show that prompt-sensitivity is task-dependent, running from $13\\%$ to $115\\%$. We fit a simple predictor that can price a full distribution of task specifications and thinking effort configurations from a single cheap probe on an unseen task within $36\\%$, improving over prior work in predicting token spend. Our work provides initial results quantifying the effects of task specification on agentic token spend and introduces a method that can be used to systematically evaluate the cost of AI coding workflows.", "arxiv_id": "2608.25399", "arxiv_url": "https://arxiv.org/abs/2608.25399", "authors": ["Jakub Sm\u00e9kal"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4efb\u52a1\u89c4\u683c\u5982\u4f55\u5f71\u54cdAI\u7f16\u7801\u667a\u80fd\u4f53\u7684token\u6d88\u8017\uff0c\u5e76\u8bc4\u4f30\u80fd\u5426\u63d0\u524d\u9884\u6d4b\u6210\u672c\u3002\u4f5c\u8005\u5728Kimi K3\u4e09\u79cd\u601d\u8003\u5f3a\u5ea6\u4e0b\u5b8c\u62102700\u6b21\u8fd0\u884c\uff0c\u91cf\u5316\u4e0d\u540c\u63d0\u793a\u89c4\u683c\u5bf9token spend\u7684\u5f71\u54cd\uff0c\u5e76\u63d0\u51fa\u4f4e\u6210\u672c\u63a2\u9488\u9884\u6d4b\u65b9\u6cd5\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25399", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u5b8c\u6574\u4efb\u52a1\u89c4\u683c\u7b80\u5316\u4e3a\u88f8\u7528\u6237\u6545\u4e8b\u4f1a\u4f7ftoken\u6d88\u8017\u5e73\u5747\u4e0a\u534729.7%", "\u63d0\u793a\u654f\u611f\u6027\u9ad8\u5ea6\u4f9d\u8d56\u4efb\u52a1\uff0c\u4e0d\u540c\u4efb\u52a1\u7684\u6d88\u8017\u53d8\u5316\u5e45\u5ea6\u4ece13%\u5230115%", "\u57fa\u4e8e\u5355\u6b21\u5ec9\u4ef7\u63a2\u9488\u5373\u53ef\u5728\u672a\u89c1\u4efb\u52a1\u4e0a\u9884\u6d4b\u4e0d\u540c\u89c4\u683c\u4e0e\u601d\u8003\u5f3a\u5ea6\u914d\u7f6e\u7684\u6210\u672c\u5206\u5e03\uff0c\u8bef\u5dee\u7ea636%"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u6210\u672c\u4f18\u5316", "\u63d0\u793a\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25399v1", "published_at": "2026-08-26", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Can your AI agent be cheaper? Investigating the effects of task specifications on token spend in agentic coding tasks", "tldr": "\u4efb\u52a1\u63cf\u8ff0\u8d8a\u7b80\u7565\uff0c\u7f16\u7801\u667a\u80fd\u4f53\u8d8a\u8d39token\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4efb\u52a1\u89c4\u683c\u5982\u4f55\u5f71\u54cdAI\u7f16\u7801\u667a\u80fd\u4f53\u7684token\u6d88\u8017\uff0c\u5e76\u8bc4\u4f30\u80fd\u5426\u63d0\u524d\u9884\u6d4b\u6210\u672c\u3002\u4f5c\u8005\u5728Kimi K3\u4e09\u79cd\u601d\u8003\u5f3a\u5ea6\u4e0b\u5b8c\u62102700\u6b21\u8fd0\u884c\uff0c\u91cf\u5316\u4e0d\u540c\u63d0\u793a\u89c4\u683c\u5bf9token spend\u7684\u5f71\u54cd\uff0c\u5e76\u63d0\u51fa\u4f4e\u6210\u672c\u63a2\u9488\u9884\u6d4b\u65b9\u6cd5\u3002", "why_notable": "\u8bba\u6587\u628aAI\u7f16\u7801\u667a\u80fd\u4f53\u7684\u6210\u672c\u95ee\u9898\u4ece\u7ecf\u9a8c\u4f30\u7b97\u63a8\u8fdb\u5230\u53ef\u91cf\u5316\u8bc4\u4f30\uff0c\u8bf4\u660e\u66f4\u6e05\u6670\u7684\u4efb\u52a1\u89c4\u683c\u53ef\u663e\u8457\u964d\u4f4etoken\u5f00\u9500\uff0c\u5e76\u63d0\u4f9b\u4e86\u5b9e\u7528\u7684\u9884\u7b97\u9884\u6d4b\u65b9\u6cd5\uff0c\u5bf9\u771f\u5b9e\u8f6f\u4ef6\u5f00\u53d1\u4e2d\u7684\u667a\u80fd\u4f53\u90e8\u7f72\u548c\u6210\u672c\u63a7\u5236\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Designing machine learning algorithms for wireless resource management is labour-intensive: the architecture, the loss function and the training recipe are all specified by hand. We demonstrate that this design layer can be surrendered to an autonomous agent in its entirety. We adopt the autoresearch protocol, in which an AI coding agent edits a training script, runs a fixed-budget experiment, and retains or discards the change according to a single immutable metric. We grant the agent authority over the architecture family, the input representation, the output parameterization, the loss function and the task-sampling law, and set it a target chosen for its difficulty: sum-least-percentile-rate power control across a multicell network. The formulation targets cell-edge throughput and is non-convex, non-smooth and strongly NP-hard away from its max-min vertex. Safeguards render the results trustworthy: a hash-pinned evaluator, an enforced inference contract and a pre-registered falsifier per experiment. In eighty-one unattended experiments over twenty-six hours, the agent reached $99.5\\%$ of a converged minorization-maximization reference in one fixed-cost inference pass, at roughly $600\\times$ lower inference cost, closing $94\\%$ of the gap from its first working architecture, with one parameter set serving every network size and percentile target. It recovered provable structure rather than tuned constants: the output parameterization it discovered reproduces the exact max-min-optimal allocation at the minimum percentile, for every value of the trained weights.", "arxiv_id": "2608.26093", "arxiv_url": "https://arxiv.org/abs/2608.26093", "authors": ["Ahmad Khan", "Akram Bin Sediq", "Sara Azadegi Naeini", "Raviraj S. Adve"], "brief": "\u8bba\u6587\u5c06\u65e0\u7ebf\u8d44\u6e90\u7ba1\u7406\u4e2d\u673a\u5668\u5b66\u4e60\u7b97\u6cd5\u7684\u8bbe\u8ba1\u5c42\u5b8c\u5168\u4ea4\u7ed9\u81ea\u4e3bAI\u7f16\u7801\u667a\u80fd\u4f53\u3002\u8be5\u667a\u80fd\u4f53\u901a\u8fc7\u53cd\u590d\u4fee\u6539\u8bad\u7ec3\u811a\u672c\u3001\u8fd0\u884c\u5b9a\u989d\u5b9e\u9a8c\u5e76\u6309\u56fa\u5b9a\u6307\u6807\u4fdd\u7559\u6539\u52a8\uff0c\u81ea\u52a8\u53d1\u73b0\u7528\u4e8e\u591a\u5c0f\u533a\u8fb9\u7f18\u541e\u5410\u4f18\u5316\u7684\u7f51\u7edc\u7ed3\u6784\u3001\u8f93\u5165\u8f93\u51fa\u8868\u793a\u3001\u635f\u5931\u51fd\u6570\u4e0e\u91c7\u6837\u7b56\u7565\u3002", "categories": ["cs.LG", "cs.IT", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26093", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9762\u5411sum-least-percentile-rate\u529f\u7387\u63a7\u5236\u4efb\u52a1\uff0c\u76ee\u6807\u5f3a\u8c03\u5c0f\u533a\u8fb9\u7f18\u541e\u5410\uff0c\u95ee\u9898\u975e\u51f8\u3001\u975e\u5149\u6ed1\u4e14\u5f3aNP-hard\u3002", "81\u6b21\u65e0\u4eba\u503c\u5b88\u5b9e\u9a8c\u300126\u5c0f\u65f6\u5185\uff0c\u8fbe\u5230\u6536\u655bminorization-maximization\u53c2\u8003\u7b97\u6cd599.5%\u7684\u6027\u80fd\uff0c\u4e14\u63a8\u7406\u6210\u672c\u7ea6\u4f4e600\u500d\u3002", "\u91c7\u7528\u54c8\u5e0c\u56fa\u5b9a\u8bc4\u4f30\u5668\u3001\u5f3a\u5236\u63a8\u7406\u63a5\u53e3\u548c\u9884\u6ce8\u518c\u53cd\u8bc1\u5b9e\u9a8c\u7b49\u5b89\u5168\u673a\u5236\uff0c\u964d\u4f4e\u667a\u80fd\u4f53\u6295\u673a\u53d6\u5de7\u6216\u7ed3\u679c\u4e0d\u53ef\u590d\u73b0\u7684\u98ce\u9669\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u65e0\u7ebf\u7f51\u7edc", "\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26093v1", "published_at": "2026-08-26", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Autoresearch for Cell-Edge Power Control: Radically Redefining the Researcher\u0027s Role", "tldr": "AI\u81ea\u4e3b\u8bbe\u8ba1\u65e0\u7ebf\u529f\u7387\u63a7\u5236\u7b97\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u65e0\u7ebf\u8d44\u6e90\u7ba1\u7406\u4e2d\u673a\u5668\u5b66\u4e60\u7b97\u6cd5\u7684\u8bbe\u8ba1\u5c42\u5b8c\u5168\u4ea4\u7ed9\u81ea\u4e3bAI\u7f16\u7801\u667a\u80fd\u4f53\u3002\u8be5\u667a\u80fd\u4f53\u901a\u8fc7\u53cd\u590d\u4fee\u6539\u8bad\u7ec3\u811a\u672c\u3001\u8fd0\u884c\u5b9a\u989d\u5b9e\u9a8c\u5e76\u6309\u56fa\u5b9a\u6307\u6807\u4fdd\u7559\u6539\u52a8\uff0c\u81ea\u52a8\u53d1\u73b0\u7528\u4e8e\u591a\u5c0f\u533a\u8fb9\u7f18\u541e\u5410\u4f18\u5316\u7684\u7f51\u7edc\u7ed3\u6784\u3001\u8f93\u5165\u8f93\u51fa\u8868\u793a\u3001\u635f\u5931\u51fd\u6570\u4e0e\u91c7\u6837\u7b56\u7565\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u7814\u7a76\u8005\u624b\u5de5\u8bbe\u8ba1\u6a21\u578b\u4e0e\u8bad\u7ec3\u65b9\u6848\u7684\u73af\u8282\u8f6c\u4ea4\u7ed9AI\u667a\u80fd\u4f53\uff0c\u5e76\u5728\u56f0\u96be\u7684\u65e0\u7ebf\u4f18\u5316\u95ee\u9898\u4e0a\u53d1\u73b0\u5177\u6709\u53ef\u8bc1\u660e\u7ed3\u6784\u7684\u89e3\u6cd5\uff0c\u800c\u4e0d\u4ec5\u662f\u8c03\u53c2\uff0c\u5c55\u793a\u4e86\u201c\u81ea\u52a8\u79d1\u7814\u201d\u5728\u5de5\u7a0b\u4f18\u5316\u4e2d\u7684\u5b9e\u9645\u6f5c\u529b\u3002"}, {"abstract": "LLM-based agents execute multi-step tasks, but their behavioral structure remains opaque: long unstructured traces resist the safety auditing and runtime monitoring that deployment requires. Existing approaches operate per-trace or success-only, so they miss the cross-run topology that links next-step and failure prediction. To recover that shared structure, we collapse an entire trace corpus into a single, compact finite-state machine (FSM) that serves as a structural substrate for the otherwise unpredictable behavior of LLM agents. Across twelve public datasets, the FSMs are compact (7-43 states), replay held-out data at \u003e=0.997 fitness with near-identical topology across splits, and build in milliseconds. This substrate addresses both prediction goals. For next-step prediction, FSM-state context outperforms Agent Workflow Memory on every ground-truth-matched dataset. For failure prediction, per-state behavioral features reach held-out AUROC up to 0.94, and an online monitor ranks failing runs above passing ones from a partial trace, triggering early stopping well before completion. Behavioral topology thus appears shaped more by the deployment harness than by the LLM, providing a model-agnostic structural primitive for safety auditing and runtime monitoring.", "arxiv_id": "2608.23670", "arxiv_url": "https://arxiv.org/abs/2608.23670", "authors": ["Seonglae Cho", "Franklin Cardenoso Fernandez", "Umar Mohammed", "Zekun Wu", "Kleyton Da Costa", "Ilham Wicaksono", "Adriano Koshiyama"], "brief": "\u672c\u6587\u5c06\u4e00\u7ec4 LLM \u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u538b\u7f29\u4e3a\u5355\u4e2a\u7d27\u51d1\u6709\u9650\u72b6\u6001\u673a\uff08FSM\uff09\uff0c\u7528\u6765\u6062\u590d\u8de8\u8fd0\u884c\u7684\u884c\u4e3a\u62d3\u6251\u7ed3\u6784\u3002\u8be5\u7ed3\u6784\u540c\u65f6\u652f\u6301\u4e0b\u4e00\u6b65\u9884\u6d4b\u4e0e\u5931\u8d25\u9884\u6d4b\uff0c\u53ef\u7528\u4e8e\u5b89\u5168\u5ba1\u8ba1\u548c\u8fd0\u884c\u65f6\u76d1\u63a7\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23670", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u572812\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u4e0a\u6784\u5efa\u7684 FSM \u4ec5\u542b7-43\u4e2a\u72b6\u6001\uff0c\u80fd\u4ee5\u4e0d\u4f4e\u4e8e0.997\u7684\u62df\u5408\u5ea6\u56de\u653e\u7559\u51fa\u8f68\u8ff9\uff0c\u4e14\u8de8\u6570\u636e\u5212\u5206\u62d3\u6251\u9ad8\u5ea6\u4e00\u81f4\u3002", "\u7528\u4e8e\u4e0b\u4e00\u6b65\u9884\u6d4b\u65f6\uff0cFSM \u72b6\u6001\u4e0a\u4e0b\u6587\u5728\u6240\u6709\u6709\u771f\u5b9e\u6807\u7b7e\u5339\u914d\u7684\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e Agent Workflow Memory\u3002", "\u7528\u4e8e\u5931\u8d25\u9884\u6d4b\u65f6\uff0c\u57fa\u4e8e\u72b6\u6001\u7684\u884c\u4e3a\u7279\u5f81\u5728\u7559\u51fa\u96c6\u4e0a AUROC \u6700\u9ad8\u8fbe0.94\uff0c\u5e76\u53ef\u5728\u4efb\u52a1\u672a\u5b8c\u6210\u524d\u63d0\u524d\u8bc6\u522b\u5931\u8d25\u8fd0\u884c\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6709\u9650\u72b6\u6001\u673a", "\u8fd0\u884c\u65f6\u76d1\u63a7", "\u5b89\u5168\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "Holistic AI", "pdf_url": "https://arxiv.org/pdf/2608.23670v1", "published_at": "2026-08-24", "score": 0.199, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.23670.png", "title": "Automata from Agent Traces: Failure and Next-Step Prediction", "tldr": "\u7528\u6709\u9650\u72b6\u6001\u673a\u523b\u753b\u667a\u80fd\u4f53\u8f68\u8ff9\u5e76\u9884\u6d4b\u5931\u8d25", "upvotes": 4, "what_it_is": "\u672c\u6587\u5c06\u4e00\u7ec4 LLM \u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u538b\u7f29\u4e3a\u5355\u4e2a\u7d27\u51d1\u6709\u9650\u72b6\u6001\u673a\uff08FSM\uff09\uff0c\u7528\u6765\u6062\u590d\u8de8\u8fd0\u884c\u7684\u884c\u4e3a\u62d3\u6251\u7ed3\u6784\u3002\u8be5\u7ed3\u6784\u540c\u65f6\u652f\u6301\u4e0b\u4e00\u6b65\u9884\u6d4b\u4e0e\u5931\u8d25\u9884\u6d4b\uff0c\u53ef\u7528\u4e8e\u5b89\u5168\u5ba1\u8ba1\u548c\u8fd0\u884c\u65f6\u76d1\u63a7\u3002", "why_notable": "\u8bba\u6587\u63d0\u51fa\u4e86\u4e00\u79cd\u6a21\u578b\u65e0\u5173\u3001\u6784\u5efa\u5feb\u901f\u4e14\u53ef\u89e3\u91ca\u7684\u7ed3\u6784\u5316\u8868\u793a\uff0c\u628a\u5197\u957f\u667a\u80fd\u4f53\u8f68\u8ff9\u8f6c\u5316\u4e3a\u53ef\u76d1\u63a7\u7684\u884c\u4e3a\u62d3\u6251\uff0c\u4e3a LLM \u667a\u80fd\u4f53\u90e8\u7f72\u4e2d\u7684\u5b89\u5168\u5ba1\u8ba1\u3001\u5f02\u5e38\u68c0\u6d4b\u548c\u65e9\u505c\u673a\u5236\u63d0\u4f9b\u4e86\u5b9e\u7528\u57fa\u7840\u3002"}, {"abstract": "Vision-language-action (VLA) models have become a dominant paradigm for generalist embodied agents, demonstrating strong complex and long-horizon task completion in structured settings. Yet it remains an open question whether current VLA systems can benefit from more effective architectural design, scale to substantially larger and more heterogeneous data regimes, and achieve broader generalization across tasks and embodiments. To this end, we present GigaBrain-0.7, an embodied foundation model with substantially improved generalization across diverse robot embodiments. Specifically, GigaBrain-0.7 unifies understanding, prediction, and action through a three-system architecture, scales pretraining to over 37,000 hours of heterogeneous embodied data, and introduces one-stage alignment training that jointly optimizes vision-language understanding and multi-embodiment action generation. Compared with the preceding GigaBrain-0 series and prior state-of-the-art models including $\u03c0_{0.5}$, GigaBrain-0.7 achieves substantial improvements in foundation zero-shot capabilities, language-conditioned instruction following, and post-training task success rates. In particular, on our in-house Maker H01 platform and mainstream robot embodiments, GigaBrain-0.7 demonstrates strong task adaptability and completion ability across both home and industrial scenarios. All training code and pretrained model weights will be released.", "arxiv_id": "2608.15875", "arxiv_url": "https://arxiv.org/abs/2608.15875", "authors": ["GigaBrain Team", "Angen Ye", "Axiang Sun", "Can Jin", "Chenxi Cheng", "Chong Shi", "Dengke Shang", "Dingqian Zhang", "Guan Huang", "Guangqiang Wang", "Guangqing Ding", "Guo Li", "Hangcong Li", "Hengyu Zhong", "Hongtao Lu", "Jianbo Qin", "Jiming Mao", "Jing Zhu", "Jindi Lv", "Jingzhi Cui", "Junjie Xie", "Junyi Bao", "Kai Liu", "Lei Yuan", "Limin Long", "Lv Feng", "Mingming Yu", "Peng Li", "Pengfei Yi", "Qi Li", "Qianli Zhang", "Qingfang Li", "Qitang Hu", "Rui Zhang", "Shaoyan Sun", "Shibo Sun", "Shiying Duan", "Tenghui Chen", "Tianze Liu", "Weijie Ke", "Wenyao Xue", "Xiaofeng Wang", "Xiaoyu Tian", "Xinyu Liu", "Xinze Chen", "Yang Wang", "Yankai Wang", "Yejun Zeng", "Yifan Li", "Yifei Nie", "Yilong Li", "Yilong Liu", "Yongchao Feng", "Yumeng Wang", "Yun Ye", "Zhichao Liu", "Ziheng He", "Zonghai Yang", "Zheng Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa GigaBrain-0.7\uff0c\u4e00\u79cd\u9762\u5411\u591a\u673a\u5668\u4eba\u5f62\u6001\u7684\u5177\u8eab\u57fa\u7840\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e09\u7cfb\u7edf\u67b6\u6784\u7edf\u4e00\u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u3001\u9884\u6d4b\u4e0e\u52a8\u4f5c\u751f\u6210\uff0c\u5e76\u5728\u5927\u89c4\u6a21\u5f02\u6784\u5177\u8eab\u6570\u636e\u4e0a\u8bad\u7ec3\u4ee5\u63d0\u5347\u6cdb\u5316\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/open-gigaai/giga-brain-0", "github_stars": 2611, "hf_url": "https://huggingface.co/papers/2608.15875", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u7406\u89e3\u3001\u9884\u6d4b\u3001\u884c\u52a8\u4e09\u7cfb\u7edf\u67b6\u6784\uff0c\u9762\u5411\u8de8\u4efb\u52a1\u3001\u8de8\u673a\u5668\u4eba\u672c\u4f53\u7684\u5177\u8eab\u667a\u80fd\u6cdb\u5316\u3002", "\u9884\u8bad\u7ec3\u89c4\u6a21\u6269\u5c55\u5230\u8d85\u8fc737000\u5c0f\u65f6\u5f02\u6784\u5177\u8eab\u6570\u636e\uff0c\u8986\u76d6\u66f4\u4e30\u5bcc\u4efb\u52a1\u548c\u673a\u5668\u4eba\u5f62\u6001\u3002", "\u5f15\u5165\u4e00\u9636\u6bb5\u5bf9\u9f50\u8bad\u7ec3\uff0c\u540c\u65f6\u4f18\u5316\u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u4e0e\u591a\u672c\u4f53\u52a8\u4f5c\u751f\u6210\uff0c\u5728\u96f6\u6837\u672c\u3001\u6307\u4ee4\u8ddf\u968f\u548c\u540e\u8bad\u7ec3\u6210\u529f\u7387\u4e0a\u4f18\u4e8e\u524d\u4ee3\u53ca\u03c00.5\u7b49\u6a21\u578b\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u673a\u5668\u4eba", "\u591a\u6a21\u6001"], "num_comments": 3, "on_hf": true, "organization": "GigaAI", "pdf_url": "https://arxiv.org/pdf/2608.15875v1", "published_at": "2026-08-16", "score": 0.195, "selected_reasons": ["HF trending (92\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15875.png", "title": "GigaBrain-0.7: Scaling Embodied Foundation Models to Emergent Capabilities with a Three-System Architecture", "tldr": "GigaBrain-0.7\u6269\u5c55VLA\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b\u80fd\u529b", "upvotes": 92, "what_it_is": "\u8bba\u6587\u63d0\u51fa GigaBrain-0.7\uff0c\u4e00\u79cd\u9762\u5411\u591a\u673a\u5668\u4eba\u5f62\u6001\u7684\u5177\u8eab\u57fa\u7840\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e09\u7cfb\u7edf\u67b6\u6784\u7edf\u4e00\u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u3001\u9884\u6d4b\u4e0e\u52a8\u4f5c\u751f\u6210\uff0c\u5e76\u5728\u5927\u89c4\u6a21\u5f02\u6784\u5177\u8eab\u6570\u636e\u4e0a\u8bad\u7ec3\u4ee5\u63d0\u5347\u6cdb\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86VLA\u6a21\u578b\u901a\u8fc7\u67b6\u6784\u8bbe\u8ba1\u4e0e\u6570\u636e\u89c4\u6a21\u5316\u83b7\u5f97\u66f4\u5f3a\u6d8c\u73b0\u80fd\u529b\u7684\u53ef\u80fd\u6027\uff0c\u5e76\u5f3a\u8c03\u591a\u673a\u5668\u4eba\u672c\u4f53\u7edf\u4e00\u63a7\u5236\uff0c\u5bf9\u5bb6\u5ead\u4e0e\u5de5\u4e1a\u673a\u5668\u4eba\u901a\u7528\u5316\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal large language models (MLLMs) have become a prevailing paradigm for unified video perception. However, post-training on large multi-task datasets remains challenging, as existing reinforcement learning methods sample on-policy groups with few high-quality rollouts even with costly chain-of-thought (CoT) generation. In this paper, we study the sample efficiency and scalability of RL post-training for video MLLMs and introduce OraRL. We identify an overlooked role for annotations: Beyond scoring rollouts, each can enter its on-policy group as an oracle rollout, a direct positive optimization target. Direct oracle integration, however, is nontrivial: a high-reward oracle raises the group baseline and inverts otherwise positive policy advantages, a failure we term advantage inversion. At the core of OraRL is a decoupled advantage estimator: policy rollouts determine an oracle-free baseline, while the oracle-policy gap modulates both a directional gain and a separate detached oracle advantage. Sign-balanced pruning improves efficiency: by retaining only the oracle and the strongest rollouts of each sign, OraRL requires just 2.2x the step time of SFT, less than half the 4.9x required by GRPO with CoT. OraRL scales with model size and data, surpassing its backbone from 0.8B to 9B and GRPO up to 100k prompts. Without chain-of-thought, Video-ORA-9B decodes in 130 ms instead of 4,780 ms. Compared with the respective prior best models, it raises temporal mIoU from 62.5 to 66.0, tracking AO from 73.0 to 78.2, segmentation from 64.3 to 70.4, and the three-benchmark spatial-intelligence macro average from 51.0 to 56.1; on VSI-Bench, it scores 73.1 against 55.0 for GPT-5 and 55.1 for Gemini-3-Pro.", "arxiv_id": "2608.20492", "arxiv_url": "https://arxiv.org/abs/2608.20492", "authors": ["Yunheng Li", "Guohong Mu", "Hao Li", "Shengsheng Qian", "Dingwen Zhang", "Qibin Hou", "Ming-Ming Cheng"], "brief": "\u8bba\u6587\u63d0\u51faOraRL\uff0c\u5c06\u4eba\u5de5\u6807\u6ce8\u4e0d\u4ec5\u7528\u4e8e\u6253\u5206\uff0c\u8fd8\u4f5c\u4e3aon-policy\u7ec4\u5185\u7684oracle rollout\u76f4\u63a5\u53c2\u4e0e\u4f18\u5316\uff0c\u7528\u4e8e\u89c6\u9891\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u9ad8\u6548RL\u540e\u8bad\u7ec3\u3002\u5b83\u901a\u8fc7\u89e3\u8026\u4f18\u52bf\u4f30\u8ba1\u548c\u7b26\u53f7\u5747\u8861\u526a\u679d\uff0c\u907f\u514d\u4f18\u52bf\u53cd\u8f6c\u5e76\u663e\u8457\u964d\u4f4e\u8bad\u7ec3\u4e0e\u63a8\u7406\u6210\u672c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/HVision-NKU/OraRL", "github_stars": 61, "hf_url": "https://huggingface.co/papers/2608.20492", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u76f4\u63a5\u52a0\u5165\u9ad8\u5956\u52b1\u6807\u6ce8\u4f1a\u62ac\u9ad8\u7ec4\u57fa\u7ebf\uff0c\u5bfc\u81f4\u539f\u672c\u6b63\u5411\u7684\u7b56\u7565\u6837\u672c\u4f18\u52bf\u88ab\u53cd\u8f6c\uff0c\u63d0\u51fa\u201cadvantage inversion\u201d\u95ee\u9898\u3002", "\u6838\u5fc3\u65b9\u6cd5\u662f\u89e3\u8026\u4f18\u52bf\u4f30\u8ba1\uff1a\u7b56\u7565rollout\u8ba1\u7b97\u4e0d\u542boracle\u7684\u57fa\u7ebf\uff0coracle-policy\u5dee\u8ddd\u5206\u522b\u8c03\u5236\u65b9\u5411\u589e\u76ca\u548c\u72ec\u7acb\u7684oracle\u4f18\u52bf\u3002", "sign-balanced pruning\u4ec5\u4fdd\u7559oracle\u53ca\u6b63\u8d1f\u7b26\u53f7\u4e2d\u6700\u5f3arollout\uff0c\u8bad\u7ec3\u6b65\u65f6\u7ea6\u4e3aSFT\u76842.2\u500d\uff0c\u4f4e\u4e8e\u5e26CoT\u7684GRPO\u76844.9\u500d\uff1b\u65e0CoT\u63a8\u7406\u4ece4780ms\u964d\u81f3130ms\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u5f3a\u5316\u5b66\u4e60", "\u540e\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20492v1", "published_at": "2026-08-20", "score": 0.161, "selected_reasons": ["HF trending (91\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20492.png", "title": "Annotations as Rollouts: Efficient and Scalable Reinforcement Learning for Video MLLMs", "tldr": "\u7528\u6807\u6ce8\u4f5coracle rollout\u9ad8\u6548\u5f3a\u5316\u89c6\u9891MLLM\u3002", "upvotes": 91, "what_it_is": "\u8bba\u6587\u63d0\u51faOraRL\uff0c\u5c06\u4eba\u5de5\u6807\u6ce8\u4e0d\u4ec5\u7528\u4e8e\u6253\u5206\uff0c\u8fd8\u4f5c\u4e3aon-policy\u7ec4\u5185\u7684oracle rollout\u76f4\u63a5\u53c2\u4e0e\u4f18\u5316\uff0c\u7528\u4e8e\u89c6\u9891\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u9ad8\u6548RL\u540e\u8bad\u7ec3\u3002\u5b83\u901a\u8fc7\u89e3\u8026\u4f18\u52bf\u4f30\u8ba1\u548c\u7b26\u53f7\u5747\u8861\u526a\u679d\uff0c\u907f\u514d\u4f18\u52bf\u53cd\u8f6c\u5e76\u663e\u8457\u964d\u4f4e\u8bad\u7ec3\u4e0e\u63a8\u7406\u6210\u672c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u76d1\u7763\u6807\u6ce8\u91cd\u65b0\u89e3\u91ca\u4e3a\u53ef\u4f18\u5316\u7684oracle rollout\uff0c\u63d0\u5347\u4e86\u89c6\u9891MLLM\u5f3a\u5316\u5b66\u4e60\u7684\u6837\u672c\u6548\u7387\u4e0e\u53ef\u6269\u5c55\u6027\uff0c\u5e76\u5728\u65f6\u5e8f\u5b9a\u4f4d\u3001\u8ddf\u8e2a\u3001\u5206\u5272\u548c\u7a7a\u95f4\u667a\u80fd\u57fa\u51c6\u4e0a\u663e\u8457\u8d85\u8fc7\u65e2\u6709\u6700\u4f73\u6a21\u578b\uff0c\u663e\u793a\u51fa\u5b9e\u7528\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Collective intelligence can emerge when individuals coordinate through a shared environment, allowing local actions to accumulate into durable social organization. Language-model agents offer a new substrate for this process, yet most multi-agent systems rely on direct conversation, predefined roles, or centralized workflows. It remains unclear whether decentralized agents can build functional technologies and outperform independent search. Here, initially homogeneous LLM agents in SwarmWorld self-organize without assigned roles or recipes into evolving technological societies. Agents explore a spatial environment, process resources, test materials, construct persistent artifacts, and write executable controllers evaluated by a deterministic simulator under unseen disturbances after the agents are removed. SwarmWorld splits cognition from consequence: agents propose architectures and controllers within fixed action and material schemas, while the simulated world determines function. Shared societies develop broader, more resilient technological portfolios than a strong best-of-N isolated-search baseline, although isolated search remains competitive for the strongest artifact. Agents differentiate into exploration, construction, maintenance, and coordination behaviors, transitioning as the world matures. Technologies accumulate through collaborative construction, executable inheritance, and persistent agent-artifact networks, with most reuse beginning through physical observation rather than communication. Explicit cultural mechanisms amplify collaboration and organization, but functional benefits depend on outcome and timescale. Physical stigmergy alone supports capable societies, while interaction drives persistent technological ecologies rather than universally superior individual inventions.", "arxiv_id": "2608.26081", "arxiv_url": "https://arxiv.org/abs/2608.26081", "authors": ["Subhadeep Pal", "Fiona Y. Wang", "Markus J. Buehler"], "brief": "\u8bba\u6587\u63d0\u51fa SwarmWorld\uff1a\u4e00\u5957\u8ba9\u521d\u59cb\u540c\u8d28\u7684 LLM \u667a\u80fd\u4f53\u5728\u5171\u4eab\u7a7a\u95f4\u4e2d\u63a2\u7d22\u8d44\u6e90\u3001\u52a0\u5de5\u6750\u6599\u3001\u5efa\u9020\u6301\u4e45\u4eba\u5de5\u7269\u5e76\u7f16\u5199\u63a7\u5236\u5668\u7684\u591a\u667a\u80fd\u4f53\u6a21\u62df\u6846\u67b6\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5373\u4f7f\u6ca1\u6709\u9884\u8bbe\u89d2\u8272\u3001\u6d41\u7a0b\u6216\u76f4\u63a5\u4e2d\u5fc3\u534f\u8c03\uff0c\u667a\u80fd\u4f53\u4e5f\u80fd\u901a\u8fc7\u201c\u7269\u7406\u75d5\u8ff9\u201d\u5f62\u6210\u5206\u5de5\u4e0e\u6280\u672f\u79ef\u7d2f\u3002", "categories": ["cs.AI", "cond-mat.mtrl-sci", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26081", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528 stigmergy\uff08\u75d5\u8ff9\u534f\u8c03\uff09\uff1a\u667a\u80fd\u4f53\u4e3b\u8981\u901a\u8fc7\u89c2\u5bdf\u73af\u5883\u4e2d\u5df2\u6709\u4eba\u5de5\u7269\u548c\u8d44\u6e90\u72b6\u6001\u6765\u590d\u7528\u3001\u6539\u9020\u4e0e\u534f\u4f5c\uff0c\u800c\u975e\u4f9d\u8d56\u663e\u5f0f\u5bf9\u8bdd\u6216\u4e2d\u5fc3\u8c03\u5ea6\u3002", "\u5c06\u8ba4\u77e5\u4e0e\u540e\u679c\u5206\u79bb\uff1aLLM \u53ea\u63d0\u51fa\u7ed3\u6784\u548c\u53ef\u6267\u884c\u63a7\u5236\u5668\uff0c\u529f\u80fd\u8868\u73b0\u7531\u786e\u5b9a\u6027\u6a21\u62df\u5668\u5728\u672a\u89c1\u6270\u52a8\u4e0b\u8bc4\u4f30\uff0c\u51cf\u5c11\u7eaf\u8bed\u8a00\u81ea\u8bc4\u504f\u5dee\u3002", "\u5171\u4eab\u793e\u4f1a\u76f8\u6bd4\u5f3a best-of-N \u72ec\u7acb\u641c\u7d22\u57fa\u7ebf\u80fd\u5f62\u6210\u66f4\u5e7f\u3001\u66f4\u9c81\u68d2\u7684\u6280\u672f\u7ec4\u5408\uff0c\u4f46\u5728\u5355\u4e2a\u6700\u5f3a\u4eba\u5de5\u7269\u4e0a\u72ec\u7acb\u641c\u7d22\u4ecd\u5177\u7ade\u4e89\u529b\u3002"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u667a\u80fd\u4f53", "\u7fa4\u4f53\u667a\u80fd", "\u5f00\u653e\u5f0f\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26081v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SwarmWorld: Stigmergic technological evolution in societies of language-model agents", "tldr": "LLM\u667a\u80fd\u4f53\u53ef\u901a\u8fc7\u73af\u5883\u75d5\u8ff9\u81ea\u7ec4\u7ec7\u6f14\u5316\u6280\u672f\u793e\u4f1a", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SwarmWorld\uff1a\u4e00\u5957\u8ba9\u521d\u59cb\u540c\u8d28\u7684 LLM \u667a\u80fd\u4f53\u5728\u5171\u4eab\u7a7a\u95f4\u4e2d\u63a2\u7d22\u8d44\u6e90\u3001\u52a0\u5de5\u6750\u6599\u3001\u5efa\u9020\u6301\u4e45\u4eba\u5de5\u7269\u5e76\u7f16\u5199\u63a7\u5236\u5668\u7684\u591a\u667a\u80fd\u4f53\u6a21\u62df\u6846\u67b6\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5373\u4f7f\u6ca1\u6709\u9884\u8bbe\u89d2\u8272\u3001\u6d41\u7a0b\u6216\u76f4\u63a5\u4e2d\u5fc3\u534f\u8c03\uff0c\u667a\u80fd\u4f53\u4e5f\u80fd\u901a\u8fc7\u201c\u7269\u7406\u75d5\u8ff9\u201d\u5f62\u6210\u5206\u5de5\u4e0e\u6280\u672f\u79ef\u7d2f\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5c55\u793a\u4e86 LLM \u591a\u667a\u80fd\u4f53\u4e0d\u5fc5\u4f9d\u8d56\u9884\u8bbe\u89d2\u8272\u6216\u5bf9\u8bdd\u534f\u8bae\uff0c\u4e5f\u80fd\u901a\u8fc7\u6301\u4e45\u73af\u5883\u5b9e\u73b0\u5206\u5de5\u3001\u7ee7\u627f\u548c\u6280\u672f\u751f\u6001\u6f14\u5316\uff0c\u4e3a\u7814\u7a76\u5f00\u653e\u5f0f\u667a\u80fd\u4f53\u793e\u4f1a\u3001\u7fa4\u4f53\u667a\u80fd\u548c\u5177\u8eab/\u73af\u5883\u4ecb\u5bfc\u534f\u4f5c\u63d0\u4f9b\u4e86\u65b0\u5b9e\u9a8c\u8303\u5f0f\u3002"}, {"abstract": "Traffic Anomaly Understanding (TAU) requires models and systems to detect, reason about, and explain anomalous events in transportation videos. To address this challenge, we propose TAU-Agent, an agentic retrieval-augmented framework for traffic anomaly understanding. Given a task query, a central retrieval agent orchestrates two visual perception tools, namely a Video Captioning Tool and an Open-Vocabulary Tracking Tool, to retrieve and select query-relevant evidence, including captions, temporal intervals, and object trajectories. The selected evidence, together with sampled video frames and the input query, is provided to a supervised fine-tuned vision-language model for final reasoning and answer generation. We evaluate TAU-Agent on both the in-domain and the out-of-domain benchmarks from the AI City Challenge 2026. TAU-Agent achieves scores of 0.6779 on Track 3, 0.3998 on Track 7, and 67.9275 on Track 8, ranking second, twelfth, and fifth, respectively. Code is available at: https://github.com/siri-rouser/TAU-Agent.", "arxiv_id": "2608.25935", "arxiv_url": "https://arxiv.org/abs/2608.25935", "authors": ["Yuqiang Lin", "Yan Shi", "Sam Lockyer", "Harish Tayyar Madabushi", "Adrian Evans", "Wenbin Li", "Yinhai Wang", "Nic Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa TAU-Agent\uff0c\u4e00\u4e2a\u7528\u4e8e\u4ea4\u901a\u89c6\u9891\u5f02\u5e38\u7406\u89e3\u7684\u667a\u80fd\u4f53\u5f0f\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4e2d\u5fc3\u68c0\u7d22\u667a\u80fd\u4f53\u8c03\u5ea6\u89c6\u9891\u63cf\u8ff0\u548c\u5f00\u653e\u8bcd\u6c47\u8ddf\u8e2a\u5de5\u5177\uff0c\u6536\u96c6\u4e0e\u67e5\u8be2\u76f8\u5173\u7684\u8bc1\u636e\uff0c\u518d\u4ea4\u7531\u5fae\u8c03\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u56de\u7b54\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25935", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4e2d\u5fc3\u68c0\u7d22\u667a\u80fd\u4f53\u7edf\u4e00\u7f16\u6392\u89c6\u9891\u5b57\u5e55\u751f\u6210\u4e0e\u5f00\u653e\u8bcd\u6c47\u76ee\u6807\u8ddf\u8e2a\uff0c\u68c0\u7d22\u5b57\u5e55\u3001\u65f6\u95f4\u7247\u6bb5\u548c\u76ee\u6807\u8f68\u8ff9\u7b49\u8bc1\u636e", "\u5c06\u7b5b\u9009\u540e\u7684\u8bc1\u636e\u3001\u91c7\u6837\u89c6\u9891\u5e27\u548c\u4efb\u52a1\u67e5\u8be2\u8f93\u5165\u76d1\u7763\u5fae\u8c03\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5b8c\u6210\u5f02\u5e38\u4e8b\u4ef6\u63a8\u7406\u4e0e\u89e3\u91ca", "\u5728 AI City Challenge 2026 \u591a\u4e2a\u8d5b\u9053\u8bc4\u6d4b\u4e2d\u53d6\u5f97 Track 3 \u7b2c\u4e8c\u3001Track 8 \u7b2c\u4e94\u7b49\u6210\u7ee9\uff0c\u5e76\u5f00\u6e90\u4ee3\u7801"], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a", "\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25935v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TAU-Agent: An Agentic Retrieval-Augmented Framework for Traffic Anomaly Understanding", "tldr": "\u9762\u5411\u4ea4\u901a\u5f02\u5e38\u7406\u89e3\u7684\u68c0\u7d22\u589e\u5f3a\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TAU-Agent\uff0c\u4e00\u4e2a\u7528\u4e8e\u4ea4\u901a\u89c6\u9891\u5f02\u5e38\u7406\u89e3\u7684\u667a\u80fd\u4f53\u5f0f\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4e2d\u5fc3\u68c0\u7d22\u667a\u80fd\u4f53\u8c03\u5ea6\u89c6\u9891\u63cf\u8ff0\u548c\u5f00\u653e\u8bcd\u6c47\u8ddf\u8e2a\u5de5\u5177\uff0c\u6536\u96c6\u4e0e\u67e5\u8be2\u76f8\u5173\u7684\u8bc1\u636e\uff0c\u518d\u4ea4\u7531\u5fae\u8c03\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u56de\u7b54\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5de5\u5177\u8c03\u7528\u5f0f\u667a\u80fd\u4f53\u3001\u68c0\u7d22\u589e\u5f3a\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7ed3\u5408\uff0c\u7528\u4e8e\u590d\u6742\u4ea4\u901a\u5f02\u5e38\u89c6\u9891\u7684\u8bc1\u636e\u5b9a\u4f4d\u4e0e\u53ef\u89e3\u91ca\u63a8\u7406\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u9645\u667a\u80fd\u4ea4\u901a\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Modern GUI-agent frameworks achieve strong desktop task performance with frontier API models, yet persistent control information often remains implicit in growing interaction trajectories. At each step, the planner reconstructs the active task stage, accumulated evidence, and runtime feedback before deciding the next action. This dependence becomes more pronounced under weaker local reasoning backbones. Across four representative state-of-the-art frameworks, replacing GPT-5 with Qwen3.5-9B reduces average OSWorld SR-100 from 60.9\\% to 37.7\\%. Trajectory annotation further identifies at least one control failure in 91.6\\% of failed trajectories. To address this problem, we introduce LocalLSTC, a training-free architecture that organizes control by temporal scope, maintaining persistent cross-step state to guide short-term execution commitments. Long-Term Control maintains the active subgoal, subgoal-aligned evidence, and runtime feedback across interactions, while Short-Term Execution realizes bounded commitments for the current step. Long-to-Short Planning forms each commitment from persistent state, and Short-to-Long Control integrates execution outcomes back into that state for progress assessment, recovery, and termination. With Qwen3.6-27B, LocalLSTC reaches 64.7\\% SR-100 on OSWorld and 65.3\\% on WindowsAgentArena, outperforming the strongest prior local results on both benchmarks. Ablations further support contributions from mechanisms on both sides of execution. These findings identify temporal organization of control information as a distinct architectural dimension for locally deployed GUI agents.", "arxiv_id": "2608.25777", "arxiv_url": "https://arxiv.org/abs/2608.25777", "authors": ["Weiming Li", "Helen Paik", "Yulei Sui"], "brief": "\u672c\u6587\u63d0\u51fa LocalLSTC\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u672c\u5730\u90e8\u7f72 GUI \u667a\u80fd\u4f53\u63a7\u5236\u67b6\u6784\u3002\u5b83\u5c06\u8de8\u6b65\u9aa4\u7684\u4efb\u52a1\u72b6\u6001\u3001\u8bc1\u636e\u4e0e\u53cd\u9988\u663e\u5f0f\u7ef4\u62a4\u4e3a\u957f\u671f\u63a7\u5236\uff0c\u5e76\u7528\u77ed\u671f\u6267\u884c\u751f\u6210\u5f53\u524d\u6b65\u9aa4\u7684\u6709\u9650\u627f\u8bfa\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25777", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u672c\u5730\u5c0f\u6a21\u578b\u5728 GUI \u4efb\u52a1\u4e2d\u6613\u4e22\u5931\u9690\u5f0f\u63a7\u5236\u4fe1\u606f\uff0c\u56db\u4e2a\u5148\u8fdb\u6846\u67b6\u4ece GPT-5 \u6362\u6210 Qwen3.5-9B \u540e OSWorld SR-100 \u4ece 60.9% \u964d\u81f3 37.7%", "LocalLSTC \u901a\u8fc7 Long-Term Control \u7ef4\u62a4\u5f53\u524d\u5b50\u76ee\u6807\u3001\u76f8\u5173\u8bc1\u636e\u548c\u8fd0\u884c\u53cd\u9988\uff0c\u901a\u8fc7 Short-Term Execution \u6267\u884c\u5f53\u524d\u6b65\u9aa4\u627f\u8bfa", "\u4f7f\u7528 Qwen3.6-27B \u65f6\uff0c\u5728 OSWorld \u8fbe\u5230 64.7% SR-100\uff0c\u5728 WindowsAgentArena \u8fbe\u5230 65.3%\uff0c\u8d85\u8fc7\u6b64\u524d\u6700\u5f3a\u672c\u5730\u7ed3\u679c"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u672c\u5730\u6a21\u578b", "\u4efb\u52a1\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25777v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "LocalLSTC: A Long Short-Term Control Architecture for Locally Deployed GUI Agents", "tldr": "\u7528\u957f\u77ed\u671f\u63a7\u5236\u63d0\u5347\u672c\u5730GUI\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa LocalLSTC\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u672c\u5730\u90e8\u7f72 GUI \u667a\u80fd\u4f53\u63a7\u5236\u67b6\u6784\u3002\u5b83\u5c06\u8de8\u6b65\u9aa4\u7684\u4efb\u52a1\u72b6\u6001\u3001\u8bc1\u636e\u4e0e\u53cd\u9988\u663e\u5f0f\u7ef4\u62a4\u4e3a\u957f\u671f\u63a7\u5236\uff0c\u5e76\u7528\u77ed\u671f\u6267\u884c\u751f\u6210\u5f53\u524d\u6b65\u9aa4\u7684\u6709\u9650\u627f\u8bfa\u3002", "why_notable": "\u8bba\u6587\u628a\u201c\u63a7\u5236\u4fe1\u606f\u7684\u65f6\u95f4\u7ec4\u7ec7\u201d\u4f5c\u4e3a\u672c\u5730 GUI \u667a\u80fd\u4f53\u7684\u5173\u952e\u67b6\u6784\u7ef4\u5ea6\uff0c\u5728\u65e0\u9700\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u672c\u5730\u6a21\u578b\u6267\u884c\u590d\u6742\u684c\u9762\u4efb\u52a1\u7684\u7a33\u5b9a\u6027\u4e0e\u6210\u529f\u7387\u3002"}, {"abstract": "Reinforcement learning post-training drives reasoning and agentic capabilities in modern AI systems, yet a growing body of work shows that it is most effective when used to fine-tune an already capable base model. We question whether existing pipelines yield models that are most suitable for reinforcement learning. Building on prior work highlighting the role of coverage and pass@K as predictors of post-RL performance, we design a simple modification to supervised fine-tuning, TailSFT, which filters out already fit sequences during training, thereby focusing learning on under-modeled regions, or the tail, of the data distribution. We justify and validate the design choices in TailSFT, particularly the specific filtering criteria, through a combination of controlled experiments and theoretical analysis. On OLMo-3 7B, TailSFT often improves pass@16 performance on math and coding evaluations, with gains up to 17% absolute, while incurring minimal computational overhead. These higher-coverage checkpoints consistently translate to up to 4% absolute pass@1 gains in subsequent GRPO runs, demonstrating that TailSFT checkpoints serve as better initializations for RL. We further introduce a lightweight diagnostic for identifying settings where TailSFT is most likely to help. More broadly, our results motivate a principled, stage-aware approach to model development, in which intermediate checkpoints are judged by how effectively they support subsequent training.", "arxiv_id": "2608.25756", "arxiv_url": "https://arxiv.org/abs/2608.25756", "authors": ["Sadhika Malladi", "Samy Jelassi", "Dylan Foster", "Jordan T. Ash", "Akshay Krishnamurthy"], "brief": "\u8bba\u6587\u63d0\u51fa TailSFT\uff1a\u5728\u76d1\u7763\u5fae\u8c03\u4e2d\u52a8\u6001\u8fc7\u6ee4\u6a21\u578b\u5df2\u7ecf\u62df\u5408\u597d\u7684\u5e8f\u5217\uff0c\u628a\u8bad\u7ec3\u91cd\u70b9\u653e\u5728\u6570\u636e\u5206\u5e03\u4e2d\u5c1a\u672a\u5145\u5206\u5efa\u6a21\u7684\u201c\u5c3e\u90e8\u201d\u533a\u57df\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u80fd\u63d0\u5347\u6a21\u578b\u8986\u76d6\u7387\u4e0e pass@K\uff0c\u5e76\u4e3a\u540e\u7eed\u5f3a\u5316\u5b66\u4e60\u5fae\u8c03\u63d0\u4f9b\u66f4\u597d\u7684\u521d\u59cb\u5316\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25756", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["TailSFT \u57fa\u4e8e\u8fc7\u6ee4\u51c6\u5219\u5254\u9664\u5df2\u62df\u5408\u5e8f\u5217\uff0c\u51e0\u4e4e\u4e0d\u589e\u52a0\u8ba1\u7b97\u5f00\u9500\uff0c\u5f3a\u8c03\u63d0\u5347\u8986\u76d6\u7387\u800c\u975e\u5355\u7eaf\u4f18\u5316\u5f53\u524d\u6307\u6807", "\u5728 OLMo-3 7B \u4e0a\uff0c\u6570\u5b66\u548c\u4ee3\u7801\u8bc4\u6d4b\u7684 pass@16 \u6700\u9ad8\u63d0\u5347 17 \u4e2a\u767e\u5206\u70b9", "TailSFT \u4ea7\u751f\u7684\u9ad8\u8986\u76d6\u7387\u68c0\u67e5\u70b9\u5728\u540e\u7eed GRPO \u4e2d\u7a33\u5b9a\u5e26\u6765\u6700\u9ad8 4 \u4e2a\u767e\u5206\u70b9\u7684 pass@1 \u589e\u76ca"], "keywords": ["\u76d1\u7763\u5fae\u8c03", "\u5f3a\u5316\u5b66\u4e60", "\u540e\u8bad\u7ec3", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25756v1", "published_at": "2026-08-26", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TailSFT: Filtered Fine-Tuning Improves Post-Training Performance", "tldr": "\u8fc7\u6ee4\u5df2\u5b66\u4f1a\u6837\u672c\uff0c\u8ba9SFT\u66f4\u9002\u5408\u4f5c\u4e3aRL\u8d77\u70b9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TailSFT\uff1a\u5728\u76d1\u7763\u5fae\u8c03\u4e2d\u52a8\u6001\u8fc7\u6ee4\u6a21\u578b\u5df2\u7ecf\u62df\u5408\u597d\u7684\u5e8f\u5217\uff0c\u628a\u8bad\u7ec3\u91cd\u70b9\u653e\u5728\u6570\u636e\u5206\u5e03\u4e2d\u5c1a\u672a\u5145\u5206\u5efa\u6a21\u7684\u201c\u5c3e\u90e8\u201d\u533a\u57df\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u80fd\u63d0\u5347\u6a21\u578b\u8986\u76d6\u7387\u4e0e pass@K\uff0c\u5e76\u4e3a\u540e\u7eed\u5f3a\u5316\u5b66\u4e60\u5fae\u8c03\u63d0\u4f9b\u66f4\u597d\u7684\u521d\u59cb\u5316\u3002", "why_notable": "\u5b83\u6307\u51faSFT\u9636\u6bb5\u4e0d\u5e94\u53ea\u8ffd\u6c42\u5373\u65f6\u6027\u80fd\uff0c\u800c\u5e94\u9762\u5411\u540e\u7eedRL\u9636\u6bb5\u4f18\u5316\u6a21\u578b\u521d\u59cb\u5316\uff1b\u65b9\u6cd5\u7b80\u5355\u3001\u6210\u672c\u4f4e\uff0c\u5e76\u4e3a\u540e\u8bad\u7ec3\u6d41\u6c34\u7ebf\u63d0\u4f9b\u4e86\u66f4\u6709\u539f\u5219\u7684\u9636\u6bb5\u611f\u77e5\u8bbe\u8ba1\u601d\u8def\u3002"}, {"abstract": "Video deep research answers complex questions by jointly understanding video content and retrieving external knowledge from the open Web. However, diverse questions and videos require different tool-use strategies, and inappropriate tool calls can produce incorrect results. Uncertain grounding and retrieval also make unnecessary interactions costly and error-prone, increasing latency and reasoning errors. To address these challenges, we propose AdaVDR, an adaptive video deep research agent with adaptive tool invocation and reflection. AdaVDR selects tools according to the task and its capabilities, and backtracks only when unreliable intermediate results require correction. To enable these capabilities, we develop a video deep research data construction pipeline. We first discover retrieval-relevant events and entities in diverse videos and acquire detailed information through grounding and external retrieval to construct high-quality QA pairs. For each QA, task-specific prompts organize the information acquisition process into a tool-use trajectory, allowing different question and video types to follow different grounding and retrieval strategies. We further introduce model-conditioned tool necessity filtering, which evaluates tool calls against the target model\u0027s video understanding and internal knowledge, removing tools or tool chains the model can bypass. This yields trajectories tailored to the target model\u0027s video understanding capability and knowledge. Using this pipeline, we construct training data and VDR-EE, a benchmark covering entity-centric and event-centric questions. We perform supervised fine-tuning followed by reinforcement learning with a redundancy-aware reward to strengthen adaptive tool invocation and reflection. Experiments show that our method performs best among the evaluated open-source models on VDR-EE and substantially improves over its base models on VideoDR.", "arxiv_id": "2608.25559", "arxiv_url": "https://arxiv.org/abs/2608.25559", "authors": ["Xintong Zhang", "Xiaomeng Fan", "Shilin Yan", "Ekko He", "Zicheng Liu", "Zijian Zou", "Guannan Zhang", "Yuwei Wu", "Zhi Gao", "Hongwei Xue"], "brief": "AdaVDR \u662f\u4e00\u4e2a\u9762\u5411\u590d\u6742\u89c6\u9891\u95ee\u7b54\u7684\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u53ef\u6839\u636e\u95ee\u9898\u3001\u89c6\u9891\u5185\u5bb9\u548c\u6a21\u578b\u80fd\u529b\u81ea\u9002\u5e94\u9009\u62e9\u7f51\u9875\u68c0\u7d22\u3001\u5b9a\u4f4d\u7b49\u5de5\u5177\uff0c\u5e76\u5728\u4e2d\u95f4\u7ed3\u679c\u4e0d\u53ef\u9760\u65f6\u8fdb\u884c\u53cd\u601d\u56de\u6eaf\u3002\u8bba\u6587\u8fd8\u6784\u5efa\u4e86\u6570\u636e\u751f\u6210\u6d41\u6c34\u7ebf\u4e0e VDR-EE \u57fa\u51c6\uff0c\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u6d4b\u5b9e\u4f53/\u4e8b\u4ef6\u4e2d\u5fc3\u7684\u89c6\u9891\u6df1\u5ea6\u7814\u7a76\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25559", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u6a21\u578b\u6761\u4ef6\u5316\u7684\u5de5\u5177\u5fc5\u8981\u6027\u8fc7\u6ee4\uff0c\u4f9d\u636e\u76ee\u6807\u6a21\u578b\u7684\u89c6\u9891\u7406\u89e3\u4e0e\u5185\u5728\u77e5\u8bc6\u80fd\u529b\uff0c\u79fb\u9664\u53ef\u88ab\u6a21\u578b\u7ed5\u8fc7\u7684\u5197\u4f59\u5de5\u5177\u8c03\u7528\u6216\u5de5\u5177\u94fe\u3002", "\u6784\u5efa\u89c6\u9891\u6df1\u5ea6\u7814\u7a76\u6570\u636e\u6d41\u6c34\u7ebf\uff1a\u53d1\u73b0\u89c6\u9891\u4e2d\u7684\u68c0\u7d22\u76f8\u5173\u4e8b\u4ef6\u4e0e\u5b9e\u4f53\uff0c\u901a\u8fc7\u89c6\u89c9\u5b9a\u4f4d\u548c\u5916\u90e8\u68c0\u7d22\u751f\u6210\u9ad8\u8d28\u91cf QA\uff0c\u5e76\u7ec4\u7ec7\u4e3a\u4efb\u52a1\u7279\u5b9a\u5de5\u5177\u4f7f\u7528\u8f68\u8ff9\u3002", "\u91c7\u7528\u76d1\u7763\u5fae\u8c03\u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u5e76\u5f15\u5165\u5197\u4f59\u611f\u77e5\u5956\u52b1\uff0c\u
