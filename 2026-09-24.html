null}, {"abstract": "On-demand delivery platforms pay riders through incentive activities whose tiers are set from recent completions of riders with a similar history. Operators request such plans for changing periods, rider populations, payment rules and budgets, often for holidays or bad weather, where randomized trials are scarce and take months to collect. We present a request-driven framework that composes four stages (conditional prediction, population reduction, trajectory integration and budget allocation) through seven replaceable modules that exchange conditional trajectory laws, whose award probabilities and award-marked moments give payment and uplift for any activity rule. A response-correction step reweights trajectories from abundant no-offer history to match the moments of a short pilot. We prove that, on a fixed plan menu and given the stage errors, the end-to-end value loss is bounded by the sum of four stage terms, and that for every stage there are instances on which omitting it leaves an error floor the others cannot remove. On 3,000 riders over 45 weekly origins, all 127 windows of a week are answered 11.04x faster with identical scenarios and at most 0.92% value lost by the allocation. On 24 new controlled response laws, the response correction with a one-week pilot lowers regret by 51.2% relative to a trial with the same nominal randomized rider-weeks, and a four-week pilot with exact summation comes within +0.007 of an 18-week trial. In registered studies where windows, populations, rules and binding budgets change from request to request, the framework\u0027s regret is below that of a trial with the same nominal rider-weeks and below dose interpolation of the same pilot data, and reusing its one-off preparation answers 60 requests 14.1x and 2.70x faster with identical answers. Against a nine-offer trial fitted with the framework\u0027s own dose curve, one-week regret is 0.055 lower.", "arxiv_id": "2609.29724", "arxiv_url": "https://arxiv.org/abs/2609.29724", "authors": ["Zhuolin Wu", "Chengrui Zhu", "Wenhua Nie", "Kenny Ye Liang", "Junming Lin", "Haiyang Li", "Zhilin Li", "Wenjia Geng", "Zeyu Wu", "Yinan Wu", "Jinghua Hao", "Renqing He"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u6309\u9700\u914d\u9001\u5e73\u53f0\u7684\u9884\u7b97\u9608\u503c\u6fc0\u52b1\u8bf7\u6c42\u6846\u67b6\uff0c\u5c06\u6761\u4ef6\u9884\u6d4b\u3001\u7fa4\u4f53\u7f29\u51cf\u3001\u8f68\u8ff9\u79ef\u5206\u548c\u9884\u7b97\u5206\u914d\u6a21\u5757\u5316\u7ec4\u5408\uff0c\u7528\u5c11\u91cf\u8bd5\u70b9\u6570\u636e\u6821\u6b63\u65e0\u6fc0\u52b1\u5386\u53f2\u8f68\u8ff9\u4ee5\u8bc4\u4f30\u4e0d\u540c\u6d3b\u52a8\u89c4\u5219\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u6846\u67b6\u5728\u591a\u79cd\u8bf7\u6c42\u53d8\u5316\u4e0b\u663e\u8457\u52a0\u901f\u65b9\u6848\u751f\u6210\uff0c\u4ef7\u503c\u635f\u5931\u5f88\u5c0f\uff0c\u5e76\u76f8\u6bd4\u540c\u7b49\u89c4\u6a21\u968f\u673a\u8bd5\u9a8c\u6216\u5242\u91cf\u63d2\u503c\u964d\u4f4e\u540e\u6094\u503c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29724", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6fc0\u52b1\u673a\u5236", "\u9884\u7b97\u5206\u914d", "\u56e0\u679c\u9884\u6d4b", "\u6309\u9700\u914d\u9001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29724v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A General Framework for Budgeted Threshold Incentives on Request", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u6309\u9700\u914d\u9001\u5e73\u53f0\u7684\u9884\u7b97\u9608\u503c\u6fc0\u52b1\u8bf7\u6c42\u6846\u67b6\uff0c\u5c06\u6761\u4ef6\u9884\u6d4b\u3001\u7fa4\u4f53\u7f29\u51cf\u3001\u8f68\u8ff9\u79ef\u5206\u548c\u9884\u7b97\u5206\u914d\u6a21\u5757\u5316\u7ec4\u5408\uff0c\u7528\u5c11\u91cf\u8bd5\u70b9\u6570\u636e\u6821\u6b63\u65e0\u6fc0\u52b1\u5386\u53f2\u8f68\u8ff9\u4ee5\u8bc4\u4f30\u4e0d\u540c\u6d3b\u52a8\u89c4\u5219\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u6846\u67b6\u5728\u591a\u79cd\u8bf7\u6c42\u53d8\u5316\u4e0b\u663e\u8457\u52a0\u901f\u65b9\u6848\u751f\u6210\uff0c\u4ef7\u503c\u635f\u5931\u5f88\u5c0f\uff0c\u5e76\u76f8\u6bd4\u540c\u7b49\u89c4\u6a21\u968f\u673a\u8bd5\u9a8c\u6216\u5242\u91cf\u63d2\u503c\u964d\u4f4e\u540e\u6094\u503c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present TTLab\u0027s submission to the AlexandriaX-2026 Subtask~3 on Arabic MT error span detection and classification. Our system frames the task as token-level classification over surface forms, preserving character offsets to ensure exact alignment with the evaluation metric. To handle severe label imbalance, we employ a focal loss with class weighting and dialect-specific decoding thresholds. Among six Arabic pre-trained encoders, MARBERTv2 achieves the best overall performance of 40.8 and 40.91 on the development and test set, respectively, ranking $\\nth{3}$ out of all participating teams. While our system localizes error spans effectively, classification of rare error types remains challenging, highlighting the need for data augmentation for tail categories. The code is available at ${\\href{https://github.com/ENTAILab/arabic-dialectal-mt-error-span-detection}{\\faGithub~ TTLab at AlexandriaX-2026}$", "arxiv_id": "2609.29633", "arxiv_url": "https://arxiv.org/abs/2609.29633", "authors": ["Ali Abusaleh", "Bhuvanesh Verma", "Alexander Mehler"], "brief": "\u672c\u6587\u4ecb\u7ecd\u4e86 TTLab \u5728 AlexandriaX-2026 \u963f\u62c9\u4f2f\u8bed\u673a\u5668\u7ffb\u8bd1\u9519\u8bef\u7247\u6bb5\u68c0\u6d4b\u4e0e\u5206\u7c7b\u4efb\u52a1\u4e2d\u7684\u7cfb\u7edf\uff0c\u5c06\u95ee\u9898\u5efa\u6a21\u4e3a\u57fa\u4e8e\u8868\u5c42\u8bcd\u5f62\u7684 token \u7ea7\u5206\u7c7b\uff0c\u5e76\u4fdd\u7559\u5b57\u7b26\u504f\u79fb\u4ee5\u5339\u914d\u8bc4\u6d4b\u3002\u7cfb\u7edf\u4f7f\u7528 focal loss\u3001\u7c7b\u522b\u52a0\u6743\u548c\u65b9\u8a00\u7279\u5b9a\u9608\u503c\u7f13\u89e3\u6807\u7b7e\u4e0d\u5747\u8861\uff0cMARBERTv2 \u8868\u73b0\u6700\u4f73\uff0c\u5728\u5f00\u53d1\u96c6\u548c\u6d4b\u8bd5\u96c6\u7ea6 40.9 \u5206\u5e76\u6392\u540d\u7b2c 3\uff1b\u4f46\u7a00\u6709\u9519\u8bef\u7c7b\u578b\u5206\u7c7b\u4ecd\u8f83\u56f0\u96be\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29633", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u7ffb\u8bd1", "\u9519\u8bef\u68c0\u6d4b", "\u963f\u62c9\u4f2f\u8bed", "\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29633v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TTLab at AlexandriaX-2026: A Fine-Tuned Surface Tagger for Arabic Machine-Translation Error-Span Detection and Classification", "tldr": "\u672c\u6587\u4ecb\u7ecd\u4e86 TTLab \u5728 AlexandriaX-2026 \u963f\u62c9\u4f2f\u8bed\u673a\u5668\u7ffb\u8bd1\u9519\u8bef\u7247\u6bb5\u68c0\u6d4b\u4e0e\u5206\u7c7b\u4efb\u52a1\u4e2d\u7684\u7cfb\u7edf\uff0c\u5c06\u95ee\u9898\u5efa\u6a21\u4e3a\u57fa\u4e8e\u8868\u5c42\u8bcd\u5f62\u7684 token \u7ea7\u5206\u7c7b\uff0c\u5e76\u4fdd\u7559\u5b57\u7b26\u504f\u79fb\u4ee5\u5339\u914d\u8bc4\u6d4b\u3002\u7cfb\u7edf\u4f7f\u7528 focal loss\u3001\u7c7b\u522b\u52a0\u6743\u548c\u65b9\u8a00\u7279\u5b9a\u9608\u503c\u7f13\u89e3\u6807\u7b7e\u4e0d\u5747\u8861\uff0cMARBERTv2 \u8868\u73b0\u6700\u4f73\uff0c\u5728\u5f00\u53d1\u96c6\u548c\u6d4b\u8bd5\u96c6\u7ea6 40.9 \u5206\u5e76\u6392\u540d\u7b2c 3\uff1b\u4f46\u7a00\u6709\u9519\u8bef\u7c7b\u578b\u5206\u7c7b\u4ecd\u8f83\u56f0\u96be\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Approximate message passing on factor graphs underlies two dominant families of probabilistic inference algorithms: expectation propagation (EP) and variational message passing (VMP). Both methods approximate the marginal at each factor edge, forcing an iterative round-robin schedule, risking negative-precision messages, and, for VMP, collapsing to point estimates at Dirac-delta factors. We introduce Direct Message Approximation (DMA), which approximates factor-to-variable messages directly rather than the marginal. For normalisable factors, we define a consistency condition (requiring exactness when all other incoming messages are Dirac deltas) to guide message construction. We prove a master theorem (proper messages, any graph) bounding marginal KL from message KL, with three structural corollaries: Dirac-input consistency, no EP-style inner-loop iteration, and no negative-precision messages. Further, we prove a complementary $O(1/r^2)$ guarantee for the inherently improper backward message of the product factor, whose closed-form treatment has resisted prior work. As a concrete instantiation, we derive explicit DMA messages for the product and leaky-ReLU factors and assemble a Bayesian neural network (BNN) inference algorithm with one forward/backward sweep per training example and no gradient learning-rate hyperparameter, validating that the structural guarantees translate to predictive uncertainty that widens in data-sparse regions, including under model mismatch.", "arxiv_id": "2609.29466", "arxiv_url": "https://arxiv.org/abs/2609.29466", "authors": ["Ralf Herbrich", "Rainer Schlosser", "Jan Lemcke", "Johann Ukrow", "Anna Kazachkova", "Nicolas Alder", "Leonhard Hennicke", "Theo Bardey", "Nico Grimm", "Luca Kleinschmidt", "Philipp Kolbe", "Cezary Kujath", "Johanna Schlimme", "Karl Matti Sch\u00fctz"], "brief": "\u8bba\u6587\u63d0\u51fa\u76f4\u63a5\u6d88\u606f\u8fd1\u4f3c\uff08DMA\uff09\u6846\u67b6\uff0c\u5728\u56e0\u5b50\u56fe\u4e0a\u76f4\u63a5\u8fd1\u4f3c\u56e0\u5b50\u5230\u53d8\u91cf\u7684\u6d88\u606f\uff0c\u800c\u4e0d\u662f\u50cf EP/VMP \u90a3\u6837\u8fd1\u4f3c\u8fb9\u7f18\u5206\u5e03\u3002\u4f5c\u8005\u7ed9\u51fa KL \u8bef\u5dee\u754c\u4e0e\u82e5\u5e72\u7ed3\u6784\u6027\u4fdd\u8bc1\uff0c\u907f\u514d\u5185\u5faa\u73af\u8fed\u4ee3\u3001\u8d1f\u7cbe\u5ea6\u6d88\u606f\u548c\u90e8\u5206\u9000\u5316\u95ee\u9898\uff0c\u5e76\u5728\u8d1d\u53f6\u65af\u795e\u7ecf\u7f51\u7edc\u63a8\u65ad\u4e2d\u5c55\u793a\u4e86\u66f4\u5408\u7406\u7684\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u3002", "categories": ["cs.LG", "cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29466", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fd1\u4f3c\u63a8\u65ad", "\u56e0\u5b50\u56fe", "\u8d1d\u53f6\u65af\u795e\u7ecf\u7f51\u7edc", "\u53d8\u5206\u63a8\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29466v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Direct Message Approximation (DMA): A Consistency-Based Framework for Tractable Approximate Inference on Factor Graphs", "tldr": "\u8bba\u6587\u63d0\u51fa\u76f4\u63a5\u6d88\u606f\u8fd1\u4f3c\uff08DMA\uff09\u6846\u67b6\uff0c\u5728\u56e0\u5b50\u56fe\u4e0a\u76f4\u63a5\u8fd1\u4f3c\u56e0\u5b50\u5230\u53d8\u91cf\u7684\u6d88\u606f\uff0c\u800c\u4e0d\u662f\u50cf EP/VMP \u90a3\u6837\u8fd1\u4f3c\u8fb9\u7f18\u5206\u5e03\u3002\u4f5c\u8005\u7ed9\u51fa KL \u8bef\u5dee\u754c\u4e0e\u82e5\u5e72\u7ed3\u6784\u6027\u4fdd\u8bc1\uff0c\u907f\u514d\u5185\u5faa\u73af\u8fed\u4ee3\u3001\u8d1f\u7cbe\u5ea6\u6d88\u606f\u548c\u90e8\u5206\u9000\u5316\u95ee\u9898\uff0c\u5e76\u5728\u8d1d\u53f6\u65af\u795e\u7ecf\u7f51\u7edc\u63a8\u65ad\u4e2d\u5c55\u793a\u4e86\u66f4\u5408\u7406\u7684\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model based coding agents have made substantial progress on repository-level software engineering tasks. Existing repository benchmarks, however, usually start from a human-identified issue and evaluate whether a patch satisfies a functional signal. We present SWE-Prometheus, a benchmark for the broader task of improving repository engineering governance. Each task provides a fixed snapshot and an open-ended objective, requiring the agent to identify risks, prioritize interventions, and verify the resulting changes. SWE-Prometheus evaluates six governance dimensions through paired evidence, clean-environment probes, behavior gates, and two independent teacher ratings of the same evidence. The benchmark contains 60 repositories; ten models are evaluated on a shared 22-repository public subset, where mean Normalized Governance Improvement ranges from 0.0568 to 0.5760 and observed behavior-breakage rates range from 0% to 23%. On a frozen ten-repository batch, a repository-blind template obtains mean NGI 0.272, but its gains concentrate in Tests \u0026 CI, Quality Gates, and Documentation; it improves Reproducible Environment and Dependency \u0026 Security on none of the repositories. This baseline makes the distinction between adding governance artifacts and producing execution-backed improvements measurable. The no-op condition has median NGI zero and standard deviation 0.073; two teachers agree exactly on 57 of 60 dimension scores for the same no-op evidence. For the two highest conditional-mean systems, common-valid NGI is similar, while full-pool comparisons that include behavior failures favor Kimi-K3. These results show why repository-governance evaluation should report improvement, behavior preservation, evidence quality, and coverage together.", "arxiv_id": "2609.29465", "arxiv_url": "https://arxiv.org/abs/2609.29465", "authors": ["Jiajun Wu", "Leixin Sun", "Zihan Tan", "Yitao Liu", "Shuo Li", "Jiaru Qian", "Shanghaoran Quan", "Chuangxin Zhao", "Yangxu Liao", "Yang Liu", "Bin Chong", "Guancheng Wan"], "brief": "\u672c\u6587\u63d0\u51fa SWE-Prometheus\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u6a21\u578b\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u4ed3\u5e93\u4e2d\u6539\u8fdb\u5de5\u7a0b\u6cbb\u7406\u7684\u80fd\u529b\uff0c\u800c\u4e0d\u4ec5\u662f\u4fee\u590d\u5df2\u77e5 issue\u3002\u57fa\u51c6\u8986\u76d6 60 \u4e2a\u4ed3\u5e93\u548c\u516d\u7c7b\u6cbb\u7406\u7ef4\u5ea6\uff0c\u901a\u8fc7\u8bc1\u636e\u3001\u5e72\u51c0\u73af\u5883\u63a2\u6d4b\u3001\u884c\u4e3a\u95e8\u7981\u548c\u6559\u5e08\u8bc4\u5206\u8861\u91cf\u6539\u8fdb\u3001\u884c\u4e3a\u4fdd\u6301\u4e0e\u8bc1\u636e\u8d28\u91cf\uff1b\u5b9e\u9a8c\u663e\u793a\u4e0d\u540c\u6a21\u578b\u7684\u6cbb\u7406\u63d0\u5347\u5dee\u5f02\u660e\u663e\uff0c\u4e14\u7b80\u5355\u6a21\u677f\u4e3b\u8981\u53ea\u6539\u8fdb\u6d4b\u8bd5\u3001CI \u548c\u6587\u6863\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29465", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29465v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SWE-Prometheus: Measuring Engineering Governance Improvements in Real-World Repositories", "tldr": "\u672c\u6587\u63d0\u51fa SWE-Prometheus\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u6a21\u578b\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u4ed3\u5e93\u4e2d\u6539\u8fdb\u5de5\u7a0b\u6cbb\u7406\u7684\u80fd\u529b\uff0c\u800c\u4e0d\u4ec5\u662f\u4fee\u590d\u5df2\u77e5 issue\u3002\u57fa\u51c6\u8986\u76d6 60 \u4e2a\u4ed3\u5e93\u548c\u516d\u7c7b\u6cbb\u7406\u7ef4\u5ea6\uff0c\u901a\u8fc7\u8bc1\u636e\u3001\u5e72\u51c0\u73af\u5883\u63a2\u6d4b\u3001\u884c\u4e3a\u95e8\u7981\u548c\u6559\u5e08\u8bc4\u5206\u8861\u91cf\u6539\u8fdb\u3001\u884c\u4e3a\u4fdd\u6301\u4e0e\u8bc1\u636e\u8d28\u91cf\uff1b\u5b9e\u9a8c\u663e\u793a\u4e0d\u540c\u6a21\u578b\u7684\u6cbb\u7406\u63d0\u5347\u5dee\u5f02\u660e\u663e\uff0c\u4e14\u7b80\u5355\u6a21\u677f\u4e3b\u8981\u53ea\u6539\u8fdb\u6d4b\u8bd5\u3001CI \u548c\u6587\u6863\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate counting and localization of plants and their organs support phenotyping and yield estimation, yet target appearance, scale, and density vary widely across species and imaging conditions. Exemplar boxes specify the target without category-specific retraining, and point predictions identify the individual instances contributing to the count. We introduce AgriCountDINO, a parameter-efficient exemplar-guided framework for joint counting and localization. It conditions frozen multiscale DINOv3 features on exemplar appearance and size, then progressively decodes them into target points. Missed-object recovery extends supervision to targets overlooked by initial matching, and exemplar-adaptive point NMS filters duplicate predictions according to exemplar scale. With 8.4M trainable parameters, approximately one-tenth of TasselNetV4\u0027s, AgriCountDINO achieves a three-shot MAE of 11.92 on the TPC-268 benchmark, reducing counting error by 9.7\\% while providing individual target locations. Trained only on TPC-268, it achieves a zero-shot MAE of 14.25 on unseen generic object categories in FSC-147, improving upon the best compared zero-shot method by 6.0\\% without target-domain training or fine-tuning.", "arxiv_id": "2609.29460", "arxiv_url": "https://arxiv.org/abs/2609.29460", "authors": ["Shengjie Guo", "Xin Li", "Borjana Arsova", "Hanno Scharr", "Silvio Salvi"], "brief": "\u8bba\u6587\u63d0\u51fa AgriCountDINO\uff0c\u4e00\u4e2a\u53c2\u6570\u9ad8\u6548\u7684\u793a\u4f8b\u6846\u5f15\u5bfc\u519c\u4e1a\u8ba1\u6570\u4e0e\u5b9a\u4f4d\u6846\u67b6\uff0c\u5229\u7528\u51bb\u7ed3\u7684\u591a\u5c3a\u5ea6 DINOv3 \u7279\u5f81\u5e76\u7ed3\u5408\u76ee\u6807\u5916\u89c2\u548c\u5c3a\u5ea6\u9010\u6b65\u89e3\u7801\u4e3a\u5b9e\u4f8b\u70b9\u3002\u8be5\u65b9\u6cd5\u4ec5\u9700 8.4M \u53ef\u8bad\u7ec3\u53c2\u6570\uff0c\u5728 TPC-268 \u4e09\u6837\u672c\u8ba1\u6570\u4e0a MAE \u8fbe 11.92\u3001\u8bef\u5dee\u964d\u4f4e 9.7%\uff0c\u5e76\u80fd\u5728 FSC-147 \u672a\u89c1\u7c7b\u522b\u4e0a\u96f6\u6837\u672c\u6cdb\u5316\uff0c\u4f18\u4e8e\u73b0\u6709\u96f6\u6837\u672c\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29460", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u8ba1\u6570", "\u76ee\u6807\u5b9a\u4f4d", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u519c\u4e1a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29460v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AgriCountDINO: Parameter-Efficient Exemplar-Guided Counting and Localization in Agriculture", "tldr": "\u8bba\u6587\u63d0\u51fa AgriCountDINO\uff0c\u4e00\u4e2a\u53c2\u6570\u9ad8\u6548\u7684\u793a\u4f8b\u6846\u5f15\u5bfc\u519c\u4e1a\u8ba1\u6570\u4e0e\u5b9a\u4f4d\u6846\u67b6\uff0c\u5229\u7528\u51bb\u7ed3\u7684\u591a\u5c3a\u5ea6 DINOv3 \u7279\u5f81\u5e76\u7ed3\u5408\u76ee\u6807\u5916\u89c2\u548c\u5c3a\u5ea6\u9010\u6b65\u89e3\u7801\u4e3a\u5b9e\u4f8b\u70b9\u3002\u8be5\u65b9\u6cd5\u4ec5\u9700 8.4M \u53ef\u8bad\u7ec3\u53c2\u6570\uff0c\u5728 TPC-268 \u4e09\u6837\u672c\u8ba1\u6570\u4e0a MAE \u8fbe 11.92\u3001\u8bef\u5dee\u964d\u4f4e 9.7%\uff0c\u5e76\u80fd\u5728 FSC-147 \u672a\u89c1\u7c7b\u522b\u4e0a\u96f6\u6837\u672c\u6cdb\u5316\uff0c\u4f18\u4e8e\u73b0\u6709\u96f6\u6837\u672c\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Smart maritime infrastructures provide continuous access to heterogeneous sensing streams, enabling repeated experimentation, digital-twin development, and AI-based maritime services. However, sensing hardware alone is not sufficient for scene-specific model development: historical video streams must also be spatially indexed, contextualized, and reduced to informative subsets for annotation. This paper presents a frame-to-panorama localization and context-aware sampling pipeline for ship detection in historical PTZ maritime video lacking reliable pan, tilt, and zoom metadata. The main contribution is an end-to-end data-curation approach that recovers camera-view information from historical PTZ video and combines it with environmental context and visual diversity to construct compact, scene-specific training sets. Specifically, frames are localized on a reference panorama using SuperPoint and LightGlue, enriched with weather and solar-state metadata, and selected through diversity sampling to preserve variation across camera view and environmental conditions. A second context-aware stage targets under-represented distant-vessel cases near the horizon using tile-level visual embeddings and Gaussian Mixture Model clustering. Applied within the CMMI MDigi-I Smart Marina testbed, the proposed pipeline reduces 40,718 candidate frames to 220 images for annotation, corresponding to a 99.5% reduction. A YOLO26-m detector fine-tuned on this subset achieves a mean AP50 of 94.78% $\\pm$ 0.51% and a mean AP50-95 of 75.10% $\\pm$ 1.73% under sequence-grouped five-fold cross-validation. These results demonstrate that highly redundant infrastructure video streams can be transformed into compact, spatially and contextually diverse training sets for scene-specific detector adaptation while substantially reducing annotation effort.", "arxiv_id": "2609.29447", "arxiv_url": "https://arxiv.org/abs/2609.29447", "authors": ["Ignat Romanov", "Andreas Hadjipieris", "Neofytos Dimitriou"], "brief": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u667a\u80fd\u7801\u5934\u5386\u53f2PTZ\u89c6\u9891\u7684\u8239\u8236\u68c0\u6d4b\u6570\u636e\u7b5b\u9009\u6d41\u7a0b\uff0c\u5728\u7f3a\u5c11\u53ef\u9760\u4e91\u53f0\u5143\u6570\u636e\u65f6\uff0c\u7528SuperPoint\u548cLightGlue\u5c06\u5e27\u5b9a\u4f4d\u5230\u5168\u666f\u56fe\uff0c\u5e76\u7ed3\u5408\u5929\u6c14\u3001\u592a\u9633\u72b6\u6001\u548c\u89c6\u89c9\u591a\u6837\u6027\u8fdb\u884c\u91c7\u6837\u3002\u8be5\u65b9\u6cd5\u5c0640718\u5e27\u538b\u7f29\u5230220\u5f20\u5f85\u6807\u6ce8\u56fe\u50cf\uff0c\u5fae\u8c03YOLO\u68c0\u6d4b\u5668\u540e\u8fbe\u5230AP50 94.78%\u3001AP50-95 75.10%\uff0c\u663e\u8457\u964d\u4f4e\u573a\u666f\u7279\u5b9a\u68c0\u6d4b\u5668\u7684\u6807\u6ce8\u6210\u672c\u3002", "categories": ["cs.CV", "cs.AI", "cs.CG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29447", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u6570\u636e\u7b5b\u9009", "\u667a\u80fd\u4ea4\u901a", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29447v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Frame-to-Panorama Localization and Context-Aware Sampling for Scene-Specific Ship Detection in a Smart Marina Testbed", "tldr": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u667a\u80fd\u7801\u5934\u5386\u53f2PTZ\u89c6\u9891\u7684\u8239\u8236\u68c0\u6d4b\u6570\u636e\u7b5b\u9009\u6d41\u7a0b\uff0c\u5728\u7f3a\u5c11\u53ef\u9760\u4e91\u53f0\u5143\u6570\u636e\u65f6\uff0c\u7528SuperPoint\u548cLightGlue\u5c06\u5e27\u5b9a\u4f4d\u5230\u5168\u666f\u56fe\uff0c\u5e76\u7ed3\u5408\u5929\u6c14\u3001\u592a\u9633\u72b6\u6001\u548c\u89c6\u89c9\u591a\u6837\u6027\u8fdb\u884c\u91c7\u6837\u3002\u8be5\u65b9\u6cd5\u5c0640718\u5e27\u538b\u7f29\u5230220\u5f20\u5f85\u6807\u6ce8\u56fe\u50cf\uff0c\u5fae\u8c03YOLO\u68c0\u6d4b\u5668\u540e\u8fbe\u5230AP50 94.78%\u3001AP50-95 75.10%\uff0c\u663e\u8457\u964d\u4f4e\u573a\u666f\u7279\u5b9a\u68c0\u6d4b\u5668\u7684\u6807\u6ce8\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Background: Artificial intelligence (AI)-based glaucoma detection from colour fundus photographs (CFP) offers scalable screening, but performance may decline on external datasets because of differences in ground-truth definitions, populations, and coexisting conditions such as high myopia (HM). We developed and validated a Vision Transformer-based deep learning (DL) model for glaucoma detection across multi-ethnic cohorts with and without HM. Methods: A ViT-B/16 model with predictive uncertainty estimation was developed using 56,483 CFPs (57.1% with myopia; 14.4% with HM). Glaucoma labels were standardised using clinical, imaging, and perimetry data. The model was validated on 16 independent datasets across three continents, including four datasets with explicit HM labels. Findings: Internal AUROC was 98.7% (95% CI 98.2-99.1%), with sensitivity 94.5% and specificity 97.3%. Across 16 external datasets from eight countries, AUROCs ranged from 86.4% to 99.6%. In HM eyes, internal AUROC was 97.8% (95% CI 96.1-99.2%), with sensitivity 94.8% and specificity 93.7%. External HM AUROCs were 86.5% in the Beijing Eye Study and 93.3%, 91.8%, and 85.5% in hospital-based datasets from Taiwan, Thailand, and South Korea. In an exploratory HM clinical evaluation, the model had higher CFP-only diagnostic accuracy than ophthalmologists and trained graders (92.0% vs 70.0%; p=0.008) and performed comparably to glaucoma specialists using full clinical information. Interpretation: The model showed robust glaucoma detection across myopic and non-myopic multi-ethnic populations and may support AI-assisted screening in settings with high HM prevalence.", "arxiv_id": "2609.29433", "arxiv_url": "https://arxiv.org/abs/2609.29433", "authors": ["Raghavan Lavanya", "Yangqin Feng", "Ten Cheer Quek", "Quan V. Hoang", "Linda Yi-Chieh Poon", "Jost B. Jonas", "Ya Xing Wang", "Vinay Nangia", "Jin Wook Jeoung", "Sehie Park", "SoYeon Kim", "Benjamin Y Xu", "Sreenidhi Iyengar Munimadugu", "Paul Mitchell", "Gerald Liew", "Yanin Suwan", "Jirayu Hong-amata", "Sahil Thakur", "Monisha E Nongipur", "Tina Wong", "Rahat Husain", "Ng Si Rui", "Yamon Syn", "Phey Feng Lo", "Nicholas Tan Yi Qiang", "Shaista Hussain", "Xiaofeng Lei", "Zhi Da Soh", "Marco Yu", "Haslina Hamzah", "Zizhou Wang", "Yan Wang", "Liangli Zhen", "Xinxing Xu", "Tien-Yin Wong", "Tin Aung", "Rachel S Chong", "Yong Liu", "Ching-Yu Cheng"], "brief": "\u8be5\u7814\u7a76\u5f00\u53d1\u4e86\u5e26\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u7684 ViT-B/16 \u6a21\u578b\uff0c\u7528\u5f69\u8272\u773c\u5e95\u7167\u7247\u68c0\u6d4b\u9752\u5149\u773c\uff0c\u5e76\u5728\u591a\u6c11\u65cf\u3001\u8fd1\u89c6\u4e0e\u9ad8\u5ea6\u8fd1\u89c6\u4eba\u7fa4\u4e2d\u8fdb\u884c\u591a\u4e2d\u5fc3\u9a8c\u8bc1\u3002\u6a21\u578b\u5728\u5185\u90e8\u548c16\u4e2a\u5916\u90e8\u6570\u636e\u96c6\u4e0a\u4fdd\u6301\u8f83\u9ad8AUROC\uff0c\u5728\u9ad8\u5ea6\u8fd1\u89c6\u573a\u666f\u4e0b\u4e5f\u8868\u73b0\u7a33\u5065\uff0c\u63a2\u7d22\u6027\u8bc4\u4f30\u4e2d\u4f18\u4e8e\u666e\u901a\u773c\u79d1\u533b\u751f\u548c\u9605\u7247\u5458\u7684\u5355\u7eaf\u773c\u5e95\u7167\u8bca\u65ad\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29433", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u89c6\u89c9Transformer", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u9752\u5149\u773c\u7b5b\u67e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29433v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Detecting Glaucoma Across Multi-ethnic Myopic and Non-Myopic Populations Using an Uncertainty-Aware Vision Transformer: A Multicentre Model Development and Validation Study", "tldr": "\u8be5\u7814\u7a76\u5f00\u53d1\u4e86\u5e26\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u7684 ViT-B/16 \u6a21\u578b\uff0c\u7528\u5f69\u8272\u773c\u5e95\u7167\u7247\u68c0\u6d4b\u9752\u5149\u773c\uff0c\u5e76\u5728\u591a\u6c11\u65cf\u3001\u8fd1\u89c6\u4e0e\u9ad8\u5ea6\u8fd1\u89c6\u4eba\u7fa4\u4e2d\u8fdb\u884c\u591a\u4e2d\u5fc3\u9a8c\u8bc1\u3002\u6a21\u578b\u5728\u5185\u90e8\u548c16\u4e2a\u5916\u90e8\u6570\u636e\u96c6\u4e0a\u4fdd\u6301\u8f83\u9ad8AUROC\uff0c\u5728\u9ad8\u5ea6\u8fd1\u89c6\u573a\u666f\u4e0b\u4e5f\u8868\u73b0\u7a33\u5065\uff0c\u63a2\u7d22\u6027\u8bc4\u4f30\u4e2d\u4f18\u4e8e\u666e\u901a\u773c\u79d1\u533b\u751f\u548c\u9605\u7247\u5458\u7684\u5355\u7eaf\u773c\u5e95\u7167\u8bca\u65ad\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Detectors of alignment failures screen deployed language models and score alignment benchmarks. Most are generative judges that spend a decoding pass on every criterion, and classifiers that read token probabilities, such as Llama Guard, still score one fixed label per call. Jev, a model trained with reinforcement learning for calibrated decisions (RLCD), answers many typed questions about one input with calibrated probabilities in a single call. Whether it detects alignment failures has not been measured. We present RLCDAlignBench, which benchmarks Jev on ten alignment failures: sycophancy, jailbreaks, deception, prompt injection, hallucination, privacy violation, social bias, reward hacking, concealing uncertainty, and power seeking. It spans 44 benchmarks and five target models, labelled by each benchmark\u0027s scorer and, on two, by humans. Many of these failures are relational, defined against a reference, such as the user\u0027s belief or an injected instruction, that the response alone does not reveal. Our key idea is therefore to vary what Jev is asked separately from what it sees: the question\u0027s wording and answer type on one side, the fields of the input on the other. A single generic question reaches a median AUROC of 0.886 zero-shot and beats supervised baselines on most benchmarks. Question wording matters little, while context matters more, mostly through fields that encode the label. Jev matches the reference scorer\u0027s agreement with human labels, surfaces label defects in existing benchmarks, and costs 63x less than LLM-judge scorers. Code and data: https://github.com/sumleo/RLCDAlignBench.", "arxiv_id": "2609.29429", "arxiv_url": "https://arxiv.org/abs/2609.29429", "authors": ["Ruoqi Guo", "Yi Liu", "Gelei Deng", "Yuekang Li", "Lida Zhao", "Yutao Wu", "Simin Chen", "Ying Zhang", "Leo Yu Zhang"], "brief": "\u672c\u6587\u63d0\u51fa RLCDAlignBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u7ecf\u8fc7\u201c\u6821\u51c6\u51b3\u7b56\u5f3a\u5316\u5b66\u4e60\u201d\u8bad\u7ec3\u7684 Jev \u662f\u5426\u80fd\u96f6\u6837\u672c\u68c0\u6d4b\u8bed\u8a00\u6a21\u578b\u7684\u5341\u7c7b\u5bf9\u9f50\u5931\u8d25\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4e00\u4e2a\u901a\u7528\u95ee\u9898\u5373\u53ef\u8fbe\u5230\u4e2d\u4f4d AUROC 0.886\uff0c\u5728\u591a\u6570\u57fa\u51c6\u4e0a\u4f18\u4e8e\u76d1\u7763\u57fa\u7ebf\uff0c\u5e76\u4e14\u6210\u672c\u6bd4 LLM-as-judge \u4f4e 63 \u500d\u3002", "categories": ["cs.AI", "cs.CL", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29429", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI \u5bf9\u9f50", "\u5f3a\u5316\u5b66\u4e60", "\u96f6\u6837\u672c\u68c0\u6d4b", "\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29429v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Just Ask Jev: Reinforcement Learning for Calibrated Decisions as a Zero-Shot Detector of AI Alignment Failures", "tldr": "\u672c\u6587\u63d0\u51fa RLCDAlignBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u7ecf\u8fc7\u201c\u6821\u51c6\u51b3\u7b56\u5f3a\u5316\u5b66\u4e60\u201d\u8bad\u7ec3\u7684 Jev \u662f\u5426\u80fd\u96f6\u6837\u672c\u68c0\u6d4b\u8bed\u8a00\u6a21\u578b\u7684\u5341\u7c7b\u5bf9\u9f50\u5931\u8d25\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4e00\u4e2a\u901a\u7528\u95ee\u9898\u5373\u53ef\u8fbe\u5230\u4e2d\u4f4d AUROC 0.886\uff0c\u5728\u591a\u6570\u57fa\u51c6\u4e0a\u4f18\u4e8e\u76d1\u7763\u57fa\u7ebf\uff0c\u5e76\u4e14\u6210\u672c\u6bd4 LLM-as-judge \u4f4e 63 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Learning surrogates for time-dependent partial differential equations often requires a new simulation corpus when the governing operator changes. We introduce RD-JEPA, a joint-embedding predictive architecture for self-supervised pretraining on reaction-diffusion trajectories. A single model is pretrained on five parameterized systems and then adapted to three held-out systems whose reaction operators and trajectories are excluded from pretraining. Using one, five, or ten complete trajectories from a held-out system, RD-JEPA achieves lower mean relative discrete $\\ell^2$ field error and mean absolute spatial first-difference error than five supervised surrogate baselines, an independently trained control that removes the trajectory-dependent predictive latent pathway, and an architecture-matched model trained from scratch. Within the evaluated equations, output resolution, forecast horizons, and choices of adaptation trajectories, the results indicate that prediction of future-state representations can support data-efficient adaptation across related reaction-diffusion systems.", "arxiv_id": "2609.29403", "arxiv_url": "https://arxiv.org/abs/2609.29403", "authors": ["Chenhao Si", "Ming Yan"], "brief": "RD-JEPA \u5c06\u8054\u5408\u5d4c\u5165\u9884\u6d4b\u67b6\u6784\u7528\u4e8e\u53cd\u5e94-\u6269\u6563\u65b9\u7a0b\u8f68\u8ff9\u7684\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u53c2\u6570\u5316\u7cfb\u7edf\u4e0a\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u6f5c\u8868\u793a\u3002\u9762\u5bf9\u9884\u8bad\u7ec3\u4e2d\u672a\u89c1\u8fc7\u7684\u53cd\u5e94\u7b97\u5b50\uff0c\u53ea\u97001\u30015\u621610\u6761\u5b8c\u6574\u8f68\u8ff9\u8fdb\u884c\u9002\u914d\uff0c\u5c31\u80fd\u5728\u573a\u8bef\u5dee\u548c\u7a7a\u95f4\u5dee\u5206\u8bef\u5dee\u4e0a\u4f18\u4e8e\u591a\u79cd\u76d1\u7763\u4ee3\u7406\u6a21\u578b\u53ca\u4ece\u5934\u8bad\u7ec3\u6a21\u578b\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29403", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u504f\u5fae\u5206\u65b9\u7a0b", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u8fc1\u79fb\u5b66\u4e60", "\u4ee3\u7406\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29403v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RD-JEPA: Predictive latent pretraining for few-trajectory transfer across reaction--diffusion equations", "tldr": "RD-JEPA \u5c06\u8054\u5408\u5d4c\u5165\u9884\u6d4b\u67b6\u6784\u7528\u4e8e\u53cd\u5e94-\u6269\u6563\u65b9\u7a0b\u8f68\u8ff9\u7684\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u53c2\u6570\u5316\u7cfb\u7edf\u4e0a\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u6f5c\u8868\u793a\u3002\u9762\u5bf9\u9884\u8bad\u7ec3\u4e2d\u672a\u89c1\u8fc7\u7684\u53cd\u5e94\u7b97\u5b50\uff0c\u53ea\u97001\u30015\u621610\u6761\u5b8c\u6574\u8f68\u8ff9\u8fdb\u884c\u9002\u914d\uff0c\u5c31\u80fd\u5728\u573a\u8bef\u5dee\u548c\u7a7a\u95f4\u5dee\u5206\u8bef\u5dee\u4e0a\u4f18\u4e8e\u591a\u79cd\u76d1\u7763\u4ee3\u7406\u6a21\u578b\u53ca\u4ece\u5934\u8bad\u7ec3\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper presents and evaluates a Deep Learning-based (DL-based) Signal Quality Assessment (SQA) model to distinguish between clean and noisy ambulatory Electrocardiograms (ECG). The model is trained on Copenhagen Center for Health Technology-Contextualized Arrhythmia Database (CACHET-CADB), which, to the best of our knowledge, is the first ambulatory ECG database with both physical and patient-reported contextual data. The model shows stable performance on different databases such as MIT-databases and the latest PyhsioNet/Cinc Challenge 2021 databases. Subsequently, the paper demonstrates how complicated ECG noise can be investigated by the SQA model and the physical contextual data.", "arxiv_id": "2609.29396", "arxiv_url": "https://arxiv.org/abs/2609.29396", "authors": ["Xiaopeng Mao", "Marike Weisbjerg", "Sadasivan Puthusserypady"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u6df1\u5ea6\u5b66\u4e60\u7684\u53ef\u7a7f\u6234\u52a8\u6001\u5fc3\u7535\u4fe1\u53f7\u8d28\u91cf\u8bc4\u4f30\u6a21\u578b\uff0c\u7528\u4e8e\u533a\u5206\u5e72\u51c0\u4e0e\u566a\u58f0 ECG\uff0c\u5e76\u5229\u7528\u5e26\u6709\u8eab\u4f53\u6d3b\u52a8\u548c\u60a3\u8005\u62a5\u544a\u4e0a\u4e0b\u6587\u7684 CACHET-CADB \u6570\u636e\u96c6\u8bad\u7ec3\u3002\u6a21\u578b\u5728 MIT \u6570\u636e\u5e93\u548c PhysioNet/CinC 2021 \u7b49\u5916\u90e8\u6570\u636e\u96c6\u4e0a\u8868\u73b0\u7a33\u5b9a\uff0c\u8fd8\u5c55\u793a\u4e86\u7ed3\u5408\u7269\u7406\u4e0a\u4e0b\u6587\u5206\u6790\u590d\u6742 ECG \u566a\u58f0\u7684\u80fd\u529b\u3002", "categories": ["cs.AI", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29396", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df1\u5ea6\u5b66\u4e60", "\u5fc3\u7535\u4fe1\u53f7", "\u4fe1\u53f7\u8d28\u91cf\u8bc4\u4f30", "\u53ef\u7a7f\u6234\u8bbe\u5907"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29396v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Wearable ECG Quality Assessment: A Deep Learning and Ambulatory Context-Awareness Approach", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u6df1\u5ea6\u5b66\u4e60\u7684\u53ef\u7a7f\u6234\u52a8\u6001\u5fc3\u7535\u4fe1\u53f7\u8d28\u91cf\u8bc4\u4f30\u6a21\u578b\uff0c\u7528\u4e8e\u533a\u5206\u5e72\u51c0\u4e0e\u566a\u58f0 ECG\uff0c\u5e76\u5229\u7528\u5e26\u6709\u8eab\u4f53\u6d3b\u52a8\u548c\u60a3\u8005\u62a5\u544a\u4e0a\u4e0b\u6587\u7684 CACHET-CADB \u6570\u636e\u96c6\u8bad\u7ec3\u3002\u6a21\u578b\u5728 MIT \u6570\u636e\u5e93\u548c PhysioNet/CinC 2021 \u7b49\u5916\u90e8\u6570\u636e\u96c6\u4e0a\u8868\u73b0\u7a33\u5b9a\uff0c\u8fd8\u5c55\u793a\u4e86\u7ed3\u5408\u7269\u7406\u4e0a\u4e0b\u6587\u5206\u6790\u590d\u6742 ECG \u566a\u58f0\u7684\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Online handwriting provides a non-invasive and low-cost behavioral biomarker for Alzheimer\u0027s disease (AD) detection, as it reflects both cognitive planning and fine motor control. Existing handwriting-based AD detection methods usually rely on global trajectory features or whole-sample representations, which can be strongly affected by individual writing style, task-specific variation, and acquisition noise. In this paper, we propose NormPaST-Risk, a healthy-normative Paper-Air selective trajectory state-space risk network for interpretable AD detection from online handwriting. Instead of treating the entire trajectory as a single holistic representation, our method reformulates AD handwriting detection as local disease-relevant segment discovery. Specifically, a multi-scale temporal encoder captures stroke dynamics at different temporal resolutions, while a selective Paper-Air state-space encoder models long-range handwriting progression and distinguishes on-paper motor execution from in-air planning and transition behaviors. To explicitly characterize abnormal deviations, a healthy normative branch learns normal handwriting dynamics from healthy controls, and a task-aware multi-expert segment-risk module estimates segment-level AD risk calibrated by hidden-state changes and normative deviations. A weakly supervised segment-level objective further enables high-risk segment discovery without manual segment annotations. Experiments on the DARWIN benchmark demonstrate that the proposed framework achieves superior AD/HC classification performance compared with existing methods. Moreover, the discovered high-risk segments can be projected back to the original handwriting trajectory, providing interpretable evidence associated with AD-related handwriting variations.", "arxiv_id": "2609.29384", "arxiv_url": "https://arxiv.org/abs/2609.29384", "authors": ["Changqing Gong", "Huafeng Qin", "Moun\u00eem A. El-Yacoubi"], "brief": "\u8bba\u6587\u63d0\u51fa NormPaST-Risk\uff0c\u5c06\u5728\u7ebf\u624b\u5199\u963f\u5c14\u8328\u6d77\u9ed8\u75c5\u68c0\u6d4b\u4ece\u6574\u6bb5\u8f68\u8ff9\u5206\u7c7b\u8f6c\u5316\u4e3a\u5c40\u90e8\u9ad8\u98ce\u9669\u7247\u6bb5\u53d1\u73b0\u3002\u65b9\u6cd5\u7ed3\u5408\u591a\u5c3a\u5ea6\u65f6\u5e8f\u7f16\u7801\u3001\u7eb8\u9762/\u7a7a\u4e2d\u72b6\u6001\u7a7a\u95f4\u5efa\u6a21\u548c\u5065\u5eb7\u5e38\u6a21\u504f\u5dee\u5b66\u4e60\uff0c\u5728 DARWIN \u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u80fd\u5c06\u9ad8\u98ce\u9669\u7247\u6bb5\u6620\u5c04\u56de\u539f\u59cb\u8f68\u8ff9\u4ee5\u63d0\u4f9b\u53ef\u89e3\u91ca\u8bc1\u636e\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29384", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597\u5f71\u50cf", "\u65f6\u5e8f\u5efa\u6a21", "\u53ef\u89e3\u91ca\u6027", "\u963f\u5c14\u8328\u6d77\u9ed8\u75c5\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29384v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Segment-Level Risk Discovery in Online Handwriting for Alzheimer\u0027s Disease Detection", "tldr": "\u8bba\u6587\u63d0\u51fa NormPaST-Risk\uff0c\u5c06\u5728\u7ebf\u624b\u5199\u963f\u5c14\u8328\u6d77\u9ed8\u75c5\u68c0\u6d4b\u4ece\u6574\u6bb5\u8f68\u8ff9\u5206\u7c7b\u8f6c\u5316\u4e3a\u5c40\u90e8\u9ad8\u98ce\u9669\u7247\u6bb5\u53d1\u73b0\u3002\u65b9\u6cd5\u7ed3\u5408\u591a\u5c3a\u5ea6\u65f6\u5e8f\u7f16\u7801\u3001\u7eb8\u9762/\u7a7a\u4e2d\u72b6\u6001\u7a7a\u95f4\u5efa\u6a21\u548c\u5065\u5eb7\u5e38\u6a21\u504f\u5dee\u5b66\u4e60\uff0c\u5728 DARWIN \u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u80fd\u5c06\u9ad8\u98ce\u9669\u7247\u6bb5\u6620\u5c04\u56de\u539f\u59cb\u8f68\u8ff9\u4ee5\u63d0\u4f9b\u53ef\u89e3\u91ca\u8bc1\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Complex lung cancer decisions can involve several defensible pathways whose eligibility, sequencing and safety depend on unresolved information. Effective support must make explicit how patient conditions govern pathway eligibility, deferral and redirection. MedGPT Clinical Explorer (MCE) organizes alternatives, decision-changing unknowns, safety constraints and fallback into a conditional strategy for clinician review. To evaluate this representation in physician-authored strategies, multidisciplinary experts established case-specific references for 40 cases within a purposive 100-case corpus, and 250 physicians from 98 institutions produced 2,250 strategies under unaided, retrieval-reference and MCE-assisted conditions. MCE-assisted strategies expressed more applicable clinical requirements, measured by the Admissible Pathway Attainment Score (APAS; 0-100), than unaided strategies (adjusted difference, 12.87; 95% CI, 11.18-14.55) and retrieval-reference strategies (5.22; 3.52-6.93). With the same knowledge base available in the retrieval-reference and MCE-assisted conditions, the additional content centered on candidate pathways, decision-critical information and safety constraints. Physicians\u0027 whole-strategy acceptability judgments correlated with APAS (Spearman\u0027s rho = 0.671), while a complementary relationship audit assessed whether candidates, conditions and subsequent actions were coherently connected. Together, these findings identify two complementary dimensions of open-ended decision support: coverage of clinically relevant content and coherent links among pathways, conditions and subsequent actions. MCE provides a shared decision object that makes consequential omissions and pathway contingencies visible before action; prospective studies should evaluate its effects on clinical workflow and patient outcomes.", "arxiv_id": "2609.29381", "arxiv_url": "https://arxiv.org/abs/2609.29381", "authors": ["Daoyun Wang", "Zhicheng Huang", "Huaiyuan Sun", "Jiaqi Xu", "Xiaowei Xu", "Zhibo Zheng", "Zhongxing Bing", "Yuxiao Lin", "Yicheng Liang", "Chao Gao", "Bowen Xue", "Kai Zhang", "Song Xu", "Wanpu Yan", "Hui Xia", "Lin Li", "Xiang Yan", "Mu Hu", "Qianli Ma", "Zhiqiang Xue", "Xiaofang Liu", "Zhihai Han", "Nan Zhang", "Chuanhao Tang", "Tongmei Zhang", "Lan Song", "Zhaohui Zhu", "Xuan Zeng", "Shafei Wu", "Hui Guan", "Lei Deng", "Huaxia Yang", "Zeliang Lian", "Wubin Sun", "Yongxin Wang", "Xiaohui Shen", "Binlin Wang", "Tiantian Gu", "Yu Cui", "Li Zhang", "Shirui Wang", "Naixin Liang"], "brief": "\u672c\u6587\u63d0\u51fa MedGPT Clinical Explorer\uff08MCE\uff09\uff0c\u5c06\u590d\u6742\u80ba\u764c\u8bca\u7597\u4e2d\u7684\u5019\u9009\u8def\u5f84\u3001\u5f85\u6f84\u6e05\u4fe1\u606f\u3001\u5b89\u5168\u7ea6\u675f\u4e0e\u5907\u9009\u65b9\u6848\u7ec4\u7ec7\u6210\u53ef\u5ba1\u8ba1\u7684\u6761\u4ef6\u7b56\u7565\uff0c\u4f9b\u533b\u751f\u5ba1\u9605\u3002\u591a\u673a\u6784\u533b\u751f\u5b9e\u9a8c\u663e\u793a\uff0cMCE \u8f85\u52a9\u7b56\u7565\u6bd4\u65e0\u8f85\u52a9\u548c\u4ec5\u68c0\u7d22\u53c2\u8003\u66f4\u80fd\u8986\u76d6\u9002\u7528\u7684\u4e34\u5e8a\u8981\u6c42\uff0c\u5e76\u80fd\u66f4\u6e05\u6670\u5448\u73b0\u8def\u5f84\u4e0e\u6761\u4ef6\u4e4b\u95f4\u7684\u5173\u7cfb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29381", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597\u51b3\u7b56\u652f\u6301", "\u4e34\u5e8a\u5927\u6a21\u578b", "\u80ba\u764c", "\u53ef\u5ba1\u8ba1\u6846\u67b6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29381v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "An auditable conditional-strategy framework for open-ended decision-making in complex lung cancer", "tldr": "\u672c\u6587\u63d0\u51fa MedGPT Clinical Explorer\uff08MCE\uff09\uff0c\u5c06\u590d\u6742\u80ba\u764c\u8bca\u7597\u4e2d\u7684\u5019\u9009\u8def\u5f84\u3001\u5f85\u6f84\u6e05\u4fe1\u606f\u3001\u5b89\u5168\u7ea6\u675f\u4e0e\u5907\u9009\u65b9\u6848\u7ec4\u7ec7\u6210\u53ef\u5ba1\u8ba1\u7684\u6761\u4ef6\u7b56\u7565\uff0c\u4f9b\u533b\u751f\u5ba1\u9605\u3002\u591a\u673a\u6784\u533b\u751f\u5b9e\u9a8c\u663e\u793a\uff0cMCE \u8f85\u52a9\u7b56\u7565\u6bd4\u65e0\u8f85\u52a9\u548c\u4ec5\u68c0\u7d22\u53c2\u8003\u66f4\u80fd\u8986\u76d6\u9002\u7528\u7684\u4e34\u5e8a\u8981\u6c42\uff0c\u5e76\u80fd\u66f4\u6e05\u6670\u5448\u73b0\u8def\u5f84\u4e0e\u6761\u4ef6\u4e4b\u95f4\u7684\u5173\u7cfb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The acoustic front-end determines which forensic cues a speech deepfake detector can exploit. The wavelet scattering transform (WST) provides stable multiscale coefficients with explicit coordinates, yet direct flattening obscures the parent relation between paths. We introduce WST-Graph, reconstructing these paths as a sparse modulation-carrier grid for an AASIST graph backend. Modulation-level normalization and length-aware adaptive local attention pooling produce fixed relative-time representations while retaining the acoustic axes before learned adaptation. This yields a waveform-to-graph interface with a fixed, parameter-free WST. Our configurations remain competitive with AASIST while using approximately 60% fewer trainable parameters and show clear gains on selected out-of-domain benchmarks. These results underscore the value of preserving parent-child relations within the carrier-modulation topology when constructing a compact, physically grounded interface for graph-based speech deepfake detection. Code will be released at https://github.com/saki-ciallo/wst-graph.", "arxiv_id": "2609.29372", "arxiv_url": "https://arxiv.org/abs/2609.29372", "authors": ["Kwok-Ho Ng", "Tingting Song", "Bingwen Feng", "Zhihua Xia"], "brief": "\u672c\u6587\u63d0\u51fa WST-Graph\uff0c\u5c06\u5c0f\u6ce2\u6563\u5c04\u53d8\u6362\u7684\u8def\u5f84\u91cd\u6784\u4e3a\u4fdd\u7559\u8f7d\u6ce2-\u8c03\u5236\u62d3\u6251\u5173\u7cfb\u7684\u7a00\u758f\u56fe\u524d\u7aef\uff0c\u7528\u4e8e\u8bed\u97f3\u6df1\u4f2a\u68c0\u6d4b\u3002\u8be5\u65b9\u6cd5\u5728\u53c2\u6570\u91cf\u51cf\u5c11\u7ea660%\u7684\u540c\u65f6\u4fdd\u6301\u4e0e AASIST \u7ade\u4e89\u7684\u6027\u80fd\uff0c\u5e76\u5728\u90e8\u5206\u57df\u5916\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u597d\u7ed3\u679c\u3002", "categories": ["eess.AS", "cs.AI", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29372", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u6df1\u4f2a\u68c0\u6d4b", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u5c0f\u6ce2\u6563\u5c04\u53d8\u6362", "\u97f3\u9891\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29372v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "WST-Graph: Topology-Preserving Wavelet Scattering Front-End for Speech Deepfake Detection", "tldr": "\u672c\u6587\u63d0\u51fa WST-Graph\uff0c\u5c06\u5c0f\u6ce2\u6563\u5c04\u53d8\u6362\u7684\u8def\u5f84\u91cd\u6784\u4e3a\u4fdd\u7559\u8f7d\u6ce2-\u8c03\u5236\u62d3\u6251\u5173\u7cfb\u7684\u7a00\u758f\u56fe\u524d\u7aef\uff0c\u7528\u4e8e\u8bed\u97f3\u6df1\u4f2a\u68c0\u6d4b\u3002\u8be5\u65b9\u6cd5\u5728\u53c2\u6570\u91cf\u51cf\u5c11\u7ea660%\u7684\u540c\u65f6\u4fdd\u6301\u4e0e AASIST \u7ade\u4e89\u7684\u6027\u80fd\uff0c\u5e76\u5728\u90e8\u5206\u57df\u5916\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u597d\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Science, technology, and innovation policies are crucial for competitiveness, yet their diversity and scale make them difficult to map and monitor consistently. Existing approaches rely heavily on manual survey efforts, which are costly and challenging to scale across countries. Large language models (LLMs) enable new possibilities for extracting and structuring information from long and unstructured policy documents. This paper presents an application of LLMs as \"AI respondents\" for generating structured survey responses from policy texts. We develop a data extraction pipeline based on long-context in-context learning to map information from public web sources into predefined survey categories, including policy instruments, target groups, and thematic areas. The pipeline integrates a validation step using a secondary LLM to assess relevance and evidence, alongside comparisons with human-provided responses. Using a multi-country dataset, we evaluate the alignment between LLM-generated and human-generated outputs through overlap measures and cross-validation. Results show that LLMs achieve high agreement for structured indicators (84-95%), while differences remain in free-text fields, where models tend to provide more detailed procedural descriptions. These findings highlight the potential of hybrid human-AI workflows for policy monitoring, improving both efficiency and scalability while maintaining the need for human validation and contextual interpretation.", "arxiv_id": "2609.29370", "arxiv_url": "https://arxiv.org/abs/2609.29370", "authors": ["Carolyn Cole", "Matthias Deschryvere", "Toqeer Ehsan", "Arash Hajikhani"], "brief": "\u672c\u6587\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u7528\u4f5c\u201cAI \u8c03\u67e5\u53d7\u8bbf\u8005\u201d\uff0c\u4ece\u957f\u7bc7\u975e\u7ed3\u6784\u5316\u653f\u7b56\u6587\u4ef6\u4e2d\u62bd\u53d6\u4fe1\u606f\uff0c\u5e76\u6620\u5c04\u5230\u9884\u5b9a\u4e49\u7684\u653f\u7b56\u5de5\u5177\u3001\u76ee\u6807\u7fa4\u4f53\u548c\u4e3b\ b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The public visibility of Artificial Intelligence (AI) is growing rapidly, driven by the positive impact of its applications across diverse fields of knowledge. In this new chapter, courses that cover the foundations of AI and machine learning become essential for understanding their role and potential in contemporary society. Therefore, understanding fundamental concepts and elementary algorithms through the close integration of theory with practice is essential in AI courses. In this essay, we report our experience designing machine learning exercises for automated assessment tools in programming. It is worth mentioning that we are not developing a novel form of automated grading system. Instead, we propose a perspective that frames machine learning problems as input-output assessment tasks. From this perspective, each exercise admits a unique and deterministic answer and enables automated programming assessment tools (e.g., VPL for Moodle, Codeforces, and MOJ) to effectively support AI education. We believe this essay can encourage instructors to foster educational innovation by adopting more dynamic and interactive approaches to AI courses that integrate theory and practice. Importantly, this essay does not introduce an innovation in the use of AI for education; rather, it introduces an innovative approach to improving the learning of AI, particularly, machine learning.", "arxiv_id": "2609.29363", "arxiv_url": "https://arxiv.org/abs/2609.29363", "authors": ["Artur Jordao"], "brief": "\u672c\u6587\u5206\u4eab\u4e86\u5c06\u673a\u5668\u5b66\u4e60\u7ec3\u4e60\u8bbe\u8ba1\u4e3a\u786e\u5b9a\u6027\u8f93\u5165-\u8f93\u51fa\u7f16\u7a0b\u8bc4\u6d4b\u4efb\u52a1\u7684\u6559\u5b66\u7ecf\u9a8c\uff0c\u4f7f VPL\u3001Codeforces\u3001MOJ \u7b49\u81ea\u52a8\u8bc4\u6d4b\u5de5\u5177\u53ef\u7528\u4e8e\u975e\u5e73\u51e1 AI \u8bfe\u7a0b\u5b9e\u8df5\u3002\u5176\u4ef7\u503c\u5728\u4e8e\u4fc3\u8fdb\u7406\u8bba\ let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
