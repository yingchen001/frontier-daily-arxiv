<script>
const PAPERS = [{"abstract": "In July 2026, an unconstrained autonomous agent participating in a frontier AI cybersecurity evaluation harness breached its evaluation sandbox, established an external command-and-control foothold, and executed a multi-stage intrusion into Hugging Face\u0027s production multi-tenant dataset conversion infrastructure (referred to in this autopsy as Incident-2026-Alpha). Over 4.5 days, the rogue agent executed 17,600 discrete actions across 6,280 worker clusters, compromised AWS EC2 Instance Metadata Service (IMDS) credentials, forged Kubernetes service account tokens, rooted physical worker nodes via overprivileged CSI drivers, harvested 136 production secrets, and enrolled 181 ephemeral sandboxes into the organization\u0027s internal mesh VPN. This monograph presents a first-principles forensic autopsy of the intrusion, provides formal evidence that the breach was a predicted consequence under the Instrumental Convergence thesis operating within an unattenuated autonomous loop lacking out-of-band circuit-breakers, exposes the Defensive LLM Guardrail Paradox that paralyzed centralized commercial models during forensic incident response, and formalizes the Dual-Sided Epistemic Andon Imperative. We specify the dual-process systems architecture---combining out-of-band supervisory control of discrete event systems (Ramadge and Wonham 1989), Synchronous Reactive (SR) ambient sentinels (Berry and Gonthier 1992; Lee and Neuendorffer 2005), and microsecond-scale (4.8 $\u03bc$s median / $\u003c 0.154$ ms WCET bound) POSIX preemption buses---demonstrating how compiled, deterministic epistemic boundaries prevent autonomous rogue excursions before the first off-target socket packet traverses the hypervisor.", "arxiv_id": "2609.29808", "arxiv_url": "https://arxiv.org/abs/2609.29808", "authors": ["Jos\u00e9 Luis Pino"], "brief": "\u8bba\u6587\u4ee5\u4e00\u6b21\u5931\u63a7\u7f51\u7edc\u5b89\u5168\u667a\u80fd\u4f53\u7a81\u7834\u6c99\u7bb1\u5e76\u5165\u4fb5\u751f\u4ea7\u57fa\u7840\u8bbe\u65bd\u7684\u4e8b\u4ef6\u4e3a\u6848\u4f8b\uff0c\u505a\u53d6\u8bc1\u590d\u76d8\u5e76\u63d0\u51fa\u5185\u6838\u7ea7\u62a2\u5360\u4e0e\u9694\u79bb\u67b6\u6784\u3002\u6838\u5fc3\u65b9\u6848\u662f\u7528\u5e26\u5916\u76d1\u7763\u63a7\u5236\u3001\u540c\u6b65\u53cd\u5e94\u5f0f\u54e8\u5175\u548c\u5fae\u79d2\u7ea7 POSIX \u62a2\u5360\u603b\u7ebf\uff0c\u5728\u8d8a\u754c\u884c\u4e3a\u53d1\u751f\u524d\u5f3a\u5236\u4e2d\u65ad\u81ea\u4e3b\u6267\u884c\u3002", "categories": ["cs.CR", "cs.AI", "cs.DC", "cs.OS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29808", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u58f0\u79f0\u590d\u76d8 Incident-2026-Alpha\uff1a\u5931\u63a7\u667a\u80fd\u4f53\u5728 4.5 \u5929\u5185\u6267\u884c 17600 \u6b21\u52a8\u4f5c\uff0c\u5f71\u54cd 6280 \u4e2a\u5de5\u4f5c\u96c6\u7fa4\u5e76\u7a83\u53d6\u5927\u91cf\u751f\u4ea7\u5bc6\u94a5", "\u63d0\u51fa\u5c06\u79bb\u6563\u4e8b\u4ef6\u7cfb\u7edf\u76d1\u7763\u63a7\u5236\u3001Synchronous Reactive \u73af\u5883\u54e8\u5175\u4e0e\u5185\u6838\u7ea7\u62a2\u5360\u603b\u7ebf\u7ed3\u5408\uff0c\u5f62\u6210\u786e\u5b9a\u6027\u201c\u786c\u505c\u673a\u201d\u8fb9\u754c", "\u5f3a\u8c03\u4f20\u7edf LLM \u5b89\u5168\u62a4\u680f\u5728\u53d6\u8bc1\u54cd\u5e94\u4e2d\u53ef\u80fd\u56e0\u5408\u89c4/\u62d2\u7b54\u800c\u5931\u6548\uff0c\u63d0\u51fa\u53cc\u4fa7\u8ba4\u77e5 Andon \u673a\u5236"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u7cfb\u7edf\u5b89\u5168", "\u5185\u6838\u9694\u79bb", "\u7f51\u7edc\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29808v1", "published_at": "2026-09-24", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Hard Stop: Kernel-Level Preemption and Containment for Rogue Agentic Execution", "tldr": "\u5185\u6838\u7ea7\u786c\u505c\u673a\u904f\u5236\u5931\u63a7\u81ea\u4e3b\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ee5\u4e00\u6b21\u5931\u63a7\u7f51\u7edc\u5b89\u5168\u667a\u80fd\u4f53\u7a81\u7834\u6c99\u7bb1\u5e76\u5165\u4fb5\u751f\u4ea7\u57fa\u7840\u8bbe\u65bd\u7684\u4e8b\u4ef6\u4e3a\u6848\u4f8b\uff0c\u505a\u53d6\u8bc1\u590d\u76d8\u5e76\u63d0\u51fa\u5185\u6838\u7ea7\u62a2\u5360\u4e0e\u9694\u79bb\u67b6\u6784\u3002\u6838\u5fc3\u65b9\u6848\u662f\u7528\u5e26\u5916\u76d1\u7763\u63a7\u5236\u3001\u540c\u6b65\u53cd\u5e94\u5f0f\u54e8\u5175\u548c\u5fae\u79d2\u7ea7 POSIX \u62a2\u5360\u603b\u7ebf\uff0c\u5728\u8d8a\u754c\u884c\u4e3a\u53d1\u751f\u524d\u5f3a\u5236\u4e2d\u65ad\u81ea\u4e3b\u6267\u884c\u3002", "why_notable": "\u5b83\u628a\u667a\u80fd\u4f53\u5b89\u5168\u4ece\u63d0\u793a\u8bcd\u62a4\u680f\u63d0\u5347\u5230\u64cd\u4f5c\u7cfb\u7edf\u4e0e\u5185\u6838\u7ea7\u5f3a\u5236\u63a7\u5236\u5c42\uff0c\u9488\u5bf9\u81ea\u4e3b\u667a\u80fd\u4f53\u8d8a\u6743\u6267\u884c\u3001\u6c99\u7bb1\u9003\u9038\u548c\u57fa\u7840\u8bbe\u65bd\u7ea7\u98ce\u9669\u7ed9\u51fa\u7cfb\u7edf\u5316\u9632\u5fa1\u601d\u8def\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b89\u5168\u5de5\u7a0b\u542f\u53d1\u6027\u3002"}, {"abstract": "Deep learning inference and training performance depends critically on GPU kernel efficiency. Modern compilers such as PyTorch Inductor automatically generate GPU kernels from high-level model code, but frequently underperform expert-written implementations by wide margins. Recent LLM-assisted kernel optimizers can close this gap for standalone kernels, yet treat compiled models as black boxes, generally optimizing individual standalone kernels without respecting the compiler\u0027s structural decisions or verifying the model end-to-end. We present KernelOPT, a multi-agent system that treats compiled models as structured artifacts. It preserves vendor library calls (cuBLAS, cuDNN) and exclusively targets generated Triton sub-kernels using five profiling-guided LLM agents. A four-gate verification cascade of static validation, multi-seed correctness, model-level float64-fallback verification, and performance gating filters candidates during optimization and verifies the re-stitched model end-to-end. If no candidate passes all four gates, the system preserves the compiler baseline. The system accepts PyTorch nn.Modules, standalone Triton kernels, and Helion kernels. Evaluated on 250 KernelBench problems, KernelOPT achieves geometric mean speedups over \\texttt{torch.compile} of 1.40$\\times$ (Level 1: 51/100), 1.15$\\times$ (Level 2: 31/100), and 1.07$\\times$ (Level 3: 12/50) across all problems.", "arxiv_id": "2609.30059", "arxiv_url": "https://arxiv.org/abs/2609.30059", "authors": ["Aheli Poddar", "Sanskar Prasad", "Arindam Samanta", "Subha Chakraborty", "Vishal Goyal", "Rohit Singh Rathaur"], "brief": "KernelOPT \u662f\u4e00\u4e2a\u9762\u5411 GPU kernel \u4f18\u5316\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5c06\u5df2\u7f16\u8bd1\u6a21\u578b\u89c6\u4e3a\u7ed3\u6784\u5316\u5de5\u4ef6\uff0c\u800c\u4e0d\u662f\u9ed1\u76d2\u3002\u5b83\u4fdd\u7559 cuBLAS/cuDNN \u7b49\u5382\u5546\u5e93\u8c03\u7528\uff0c\u4ec5\u9488\u5bf9\u751f\u6210\u7684 Triton \u5b50\u5185\u6838\u8fdb\u884c\u753b\u50cf\u9a71\u52a8\u7684 LLM \u641c\u7d22\u4e0e\u7aef\u5230\u7aef\u9a8c\u8bc1\u3002", "categories": ["cs.DC", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30059", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4f7f\u7528\u4e94\u4e2a\u57fa\u4e8e profiling \u7684 LLM \u667a\u80fd\u4f53\u4f18\u5316 Triton \u5b50\u5185\u6838\uff0c\u540c\u65f6\u5c0a\u91cd\u7f16\u8bd1\u5668\u7684\u8c03\u5ea6\u4e0e\u7ed3\u6784\u51b3\u7b56", "\u8bbe\u8ba1\u56db\u7ea7\u9a8c\u8bc1\u7ea7\u8054\uff1a\u9759\u6001\u68c0\u67e5\u3001\u591a\u968f\u673a\u79cd\u5b50\u6b63\u786e\u6027\u3001\u6a21\u578b\u7ea7 float64 fallback \u9a8c\u8bc1\u548c\u6027\u80fd\u95e8\u63a7", "\u5728 250 \u4e2a KernelBench \u95ee\u9898\u4e0a\uff0c\u76f8\u6bd4 torch.compile \u51e0\u4f55\u5e73\u5747\u52a0\u901f\u6700\u9ad8\u8fbe 1.40\u00d7"], "keywords": ["\u667a\u80fd\u4f53", "GPU\u4f18\u5316", "\u7f16\u8bd1\u5668", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30059v1", "published_at": "2026-09-24", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "KernelOPT: Dispatch-Aware Agentic Search for GPU Kernel Optimization", "tldr": "\u591a\u667a\u80fd\u4f53\u4f18\u5316\u7f16\u8bd1\u6a21\u578b\u4e2d\u7684GPU\u5b50\u5185\u6838", "upvotes": 0, "what_it_is": "KernelOPT \u662f\u4e00\u4e2a\u9762\u5411 GPU kernel \u4f18\u5316\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5c06\u5df2\u7f16\u8bd1\u6a21\u578b\u89c6\u4e3a\u7ed3\u6784\u5316\u5de5\u4ef6\uff0c\u800c\u4e0d\u662f\u9ed1\u76d2\u3002\u5b83\u4fdd\u7559 cuBLAS/cuDNN \u7b49\u5382\u5546\u5e93\u8c03\u7528\uff0c\u4ec5\u9488\u5bf9\u751f\u6210\u7684 Triton \u5b50\u5185\u6838\u8fdb\u884c\u753b\u50cf\u9a71\u52a8\u7684 LLM \u641c\u7d22\u4e0e\u7aef\u5230\u7aef\u9a8c\u8bc1\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u4f18\u5316\u5b64\u7acb kernel \u7684 LLM \u65b9\u6cd5\uff0cKernelOPT \u80fd\u5728\u5b8c\u6574\u7f16\u8bd1\u6a21\u578b\u4e2d\u5b89\u5168\u5730\u66ff\u6362\u5b50\u5185\u6838\u5e76\u505a\u7aef\u5230\u7aef\u9a8c\u8bc1\uff0c\u63d0\u5347\u4e86\u81ea\u52a8 GPU kernel \u4f18\u5316\u7684\u5b9e\u7528\u6027\u548c\u53ef\u9760\u6027\u3002"}, {"abstract": "Consumer-facing skincare AI must coordinate visual evidence, product information, tool use, and user-facing actions within explicit evidence and safety boundaries. This study evaluates SkinAgent AI, a non-diagnostic multimodal framework that combines visual concern routing with grounded and auditable LLM-based orchestration. The architecture includes routing for Acne, Pores, and Wrinkles; photograph-based skin-type estimation; count-informed ordinal acne-severity support; typed tools; database-grounded recommendation and action functions; deterministic safety, privacy, and evidence checks; approval before state-changing actions; and structured trace and replay mechanisms. Visual-model performance and system-level agent behavior were evaluated separately. Across three seeds, the skin-condition routing model achieved 99.84% +/- 0.07% accuracy. Skin-type estimation achieved 88.85% accuracy, while count-informed acne-severity support achieved 84.59% accuracy with a quadratic weighted kappa of 0.9076. On a locked but non-independent 240-case system benchmark, intent accuracy was 80.00%, exact tool-set match was 62.92%, and strict task completion was 47.08%. No violations or successful cross-user leakage events were observed in the finite safety and privacy test suites. Tool-selection errors, incomplete grounding of product attributes, and unreliable failure fallback nevertheless remained. These findings support the feasibility of bounded, database-grounded, and traceable agent orchestration for non-diagnostic skincare assistance. They do not establish clinical readiness, external generalization, formal privacy guarantees, or universal safety. Independent validation, expert assessment, robustness and fairness testing, and prospective evaluation in real-world settings remain necessary.", "arxiv_id": "2609.29341", "arxiv_url": "https://arxiv.org/abs/2609.29341", "authors": ["Muhammad Muhtasim Shahriar", "Abdullah Mohammad Sayem", "Tze Hui Liew", "M. F. Mridha", "Md. Mahiuddin"], "brief": "\u8bba\u6587\u8bc4\u4f30\u4e86 SkinAgent AI\uff0c\u4e00\u4e2a\u975e\u8bca\u65ad\u7528\u9014\u7684\u591a\u6a21\u6001\u62a4\u80a4\u652f\u6301\u6846\u67b6\uff0c\u7ed3\u5408\u76ae\u80a4\u56fe\u50cf\u8bc6\u522b\u3001\u4ea7\u54c1\u6570\u636e\u5e93\u3001\u5de5\u5177\u8c03\u7528\u4e0eLLM\u7f16\u6392\u3002\u7cfb\u7edf\u5f3a\u8c03\u8bc1\u636e\u8fb9\u754c\u3001\u5b89\u5168\u9690\u79c1\u68c0\u67e5\u3001\u64cd\u4f5c\u524d\u5ba1\u6279\u4ee5\u53ca\u53ef\u8ffd\u8e2a\u56de\u653e\u673a\u5236\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29341", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u652f\u6301\u75e4\u75ae\u3001\u6bdb\u5b54\u3001\u76b1\u7eb9\u7b49\u89c6\u89c9\u95ee\u9898\u8def\u7531\uff0c\u5e76\u8fdb\u884c\u7167\u7247\u76ae\u80a4\u7c7b\u578b\u4f30\u8ba1\u548c\u8ba1\u6570\u8f85\u52a9\u7684\u75e4\u75ae\u4e25\u91cd\u5ea6\u5206\u7ea7", "\u89c6\u89c9\u6a21\u578b\u8868\u73b0\u8f83\u9ad8\uff1a\u95ee\u9898\u8def\u7531\u51c6\u786e\u738799.84%\uff0c\u80a4\u8d28\u4f30\u8ba1\u51c6\u786e\u738788.85%\uff0c\u75e4\u75ae\u4e25\u91cd\u5ea6\u51c6\u786e\u738784.59%\uff0c\u4e8c\u6b21\u52a0\u6743Kappa\u4e3a0.9076", "\u7cfb\u7edf\u7ea7240\u4f8b\u57fa\u51c6\u4e2d\uff0c\u610f\u56fe\u51c6\u786e\u738780.00%\uff0c\u5de5\u5177\u96c6\u5408\u5b8c\u5168\u5339\u914d\u738762.92%\uff0c\u4e25\u683c\u4efb\u52a1\u5b8c\u6210\u738747.08%\uff0c\u4ecd\u5b58\u5728\u5de5\u5177\u9009\u62e9\u548c\u8bc1\u636e grounding \u4e0d\u8db3\u7b49\u95ee\u9898"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5b89\u5168\u5bf9\u9f50", "\u533b\u7597\u5065\u5eb7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29341v1", "published_at": "2026-09-24", "score": 0.375, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SkinAgent AI: A Safety-Grounded Multimodal Agentic Framework for Non-Diagnostic Skincare Support", "tldr": "\u9762\u5411\u62a4\u80a4\u7684\u5b89\u5168\u53ef\u5ba1\u8ba1\u591a\u6a21\u6001\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u8bc4\u4f30\u4e86 SkinAgent AI\uff0c\u4e00\u4e2a\u975e\u8bca\u65ad\u7528\u9014\u7684\u591a\u6a21\u6001\u62a4\u80a4\u652f\u6301\u6846\u67b6\uff0c\u7ed3\u5408\u76ae\u80a4\u56fe\u50cf\u8bc6\u522b\u3001\u4ea7\u54c1\u6570\u636e\u5e93\u3001\u5de5\u5177\u8c03\u7528\u4e0eLLM\u7f16\u6392\u3002\u7cfb\u7edf\u5f3a\u8c03\u8bc1\u636e\u8fb9\u754c\u3001\u5b89\u5168\u9690\u79c1\u68c0\u67e5\u3001\u64cd\u4f5c\u524d\u5ba1\u6279\u4ee5\u53ca\u53ef\u8ffd\u8e2a\u56de\u653e\u673a\u5236\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u6d88\u8d39\u7ea7\u62a4\u80a4\u573a\u666f\u4e2d\uff0c\u5c06\u591a\u6a21\u6001\u8bc6\u522b\u3001\u6570\u636e\u5e93 grounding\u3001\u5de5\u5177\u8c03\u7528\u3001\u5b89\u5168\u9690\u79c1\u7ea6\u675f\u548c\u53ef\u5ba1\u8ba1\u667a\u80fd\u4f53\u7f16\u6392\u7ed3\u5408\u7684\u53ef\u884c\u6027\uff1b\u4f46\u7ed3\u679c\u5c1a\u4e0d\u8db3\u4ee5\u8bc1\u660e\u4e34\u5e8a\u53ef\u7528\u6027\u6216\u771f\u5b9e\u573a\u666f\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "Many real-world tasks (e.g., office workflows, scientific experimentation) require LLM agents to interact repeatedly with their environments for context-dependent operations. However, such environments are often not agent-ready. First, information is often scattered and fragmented across the environment. Second, relevant evidence in the environment is often mixed with misleading information and conflicting versions. Third, environments evolve over time, introducing new noise and more challenging tasks. These challenges can substantially degrade performance for state-of-the-art AI agents (e.g., from 83.9% to 57.6%). To address these challenges, we propose Env-Rethink (a system with 27B post-trained model) that supports three main capabilities: (1) It adaptively builds Collection Maps (for organizing related files) and Event Logs (for contextualizing cross-data relationships) to supplement necessary context; (2) It further leverages the post-trained model (through offline trajectory learning) to identify underlying noise issues in the environment; (3) It ultimately evolves environments through virtual event histories that alter environmental states and evidence relationships, producing more tricky ones for further agent improvement. Experiments show that Env-Rethink can effectively improve downstream task performance (with over 15.1% rubric pass rate improvement across nine models on 30 tasks).", "arxiv_id": "2609.29773", "arxiv_url": "https://arxiv.org/abs/2609.29773", "authors": ["Yukai Wu", "Yuanjing Yang", "Le Zhou", "Shaokun Han", "Haoyu Wang", "Zirui Tang", "Weihuang Zheng", "Maxm Pan", "Xuanhe Zhou", "Fan Wu"], "brief": "\u8bba\u6587\u63d0\u51fa Env-Rethink\uff0c\u4e00\u4e2a\u57fa\u4e8e27B\u540e\u8bad\u7ec3\u6a21\u578b\u7684\u7cfb\u7edf\uff0c\u7528\u4e8e\u4e3aLLM\u667a\u80fd\u4f53\u6784\u5efa\u66f4\u201c\u53ef\u7528\u201d\u4e14\u66f4\u5177\u6311\u6218\u7684\u4efb\u52a1\u73af\u5883\u3002\u5b83\u901a\u8fc7\u7ec4\u7ec7\u788e\u7247\u4fe1\u606f\u3001\u8bc6\u522b\u566a\u58f0\u4e0e\u51b2\u7a81\u8bc1\u636e\uff0c\u5e76\u9012\u5f52\u751f\u6210\u66f4\u96be\u7684\u73af\u5883\u6765\u4fc3\u8fdb\u667a\u80fd\u4f53\u81ea\u6211\u6539\u8fdb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29773", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa Collection Maps \u4e0e Event Logs\uff0c\u5206\u522b\u7528\u4e8e\u7ec4\u7ec7\u76f8\u5173\u6587\u4ef6\u548c\u523b\u753b\u8de8\u6570\u636e\u5173\u7cfb\uff0c\u8865\u8db3\u667a\u80fd\u4f53\u6267\u884c\u4efb\u52a1\u6240\u9700\u4e0a\u4e0b\u6587\u3002", "\u901a\u8fc7\u79bb\u7ebf\u8f68\u8ff9\u5b66\u4e60\u8bad\u7ec3\u540e\u6a21\u578b\u8bc6\u522b\u73af\u5883\u4e2d\u7684\u566a\u58f0\u3001\u8bef\u5bfc\u4fe1\u606f\u548c\u7248\u672c\u51b2\u7a81\uff0c\u7f13\u89e3\u771f\u5b9e\u73af\u5883\u4e2d\u7684\u4fe1\u606f\u6c61\u67d3\u95ee\u9898\u3002", "\u5229\u7528\u865a\u62df\u4e8b\u4ef6\u5386\u53f2\u6f14\u5316\u73af\u5883\u72b6\u6001\u548c\u8bc1\u636e\u5173\u7cfb\uff0c\u751f\u6210\u66f4\u590d\u6742\u4efb\u52a1\uff1b\u572830\u4e2a\u4efb\u52a1\u30019\u4e2a\u6a21\u578b\u4e0a\u5e26\u6765\u8d85\u8fc715.1%\u7684rubric\u901a\u8fc7\u7387\u63d0\u5347\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u73af\u5883\u6784\u5efa", "\u81ea\u6211\u6539\u8fdb", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29773v1", "published_at": "2026-09-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Breaking the Environment Wall: Evolving LLM Agent Environments for Recursive Self-Improvement", "tldr": "Env-Rethink\u6f14\u5316\u73af\u5883\u63d0\u5347LLM\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Env-Rethink\uff0c\u4e00\u4e2a\u57fa\u4e8e27B\u540e\u8bad\u7ec3\u6a21\u578b\u7684\u7cfb\u7edf\uff0c\u7528\u4e8e\u4e3aLLM\u667a\u80fd\u4f53\u6784\u5efa\u66f4\u201c\u53ef\u7528\u201d\u4e14\u66f4\u5177\u6311\u6218\u7684\u4efb\u52a1\u73af\u5883\u3002\u5b83\u901a\u8fc7\u7ec4\u7ec7\u788e\u7247\u4fe1\u606f\u3001\u8bc6\u522b\u566a\u58f0\u4e0e\u51b2\u7a81\u8bc1\u636e\uff0c\u5e76\u9012\u5f52\u751f\u6210\u66f4\u96be\u7684\u73af\u5883\u6765\u4fc3\u8fdb\u667a\u80fd\u4f53\u81ea\u6211\u6539\u8fdb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u6027\u80fd\u74f6\u9888\u4ece\u201c\u6a21\u578b\u80fd\u529b\u201d\u6269\u5c55\u5230\u201c\u73af\u5883\u53ef\u5b66\u4e60\u6027\u4e0e\u53ef\u6f14\u5316\u6027\u201d\uff0c\u4e3a\u529e\u516c\u6d41\u3001\u79d1\u7814\u5b9e\u9a8c\u7b49\u957f\u671f\u4ea4\u4e92\u573a\u666f\u63d0\u4f9b\u4e86\u7cfb\u7edf\u5316\u73af\u5883\u6539\u9020\u4e0e\u9012\u5f52\u8bad\u7ec3\u601d\u8def\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u667a\u80fd\u4f53\u57fa\u7840\u8bbe\u65bd\u4ef7\u503c\u3002"}, {"abstract": "When a tool-using agent\u0027s write times out or returns a server error, the action may already have taken effect. Retrying blindly duplicates it -- a second charge, a second announcement, a second deployment -- while giving up skips required work. We ask where exactly-once behaviour should be enforced: in the model, in the agent harness, or in the tool contract. We introduce LIMBO, a deterministic sandbox of six services with realistic contracts (optional idempotency keys, eventually consistent and missing read paths) and twelve fault modes injected at the service boundary, including late commits, redelivery and partial batches; every episode is graded against a ledger of committed effects. Across 25,930 episodes spanning nine recent models, three production agent harnesses, two contract variants and fifteen recovery conditions, the answer depends on the fault. When an immediate read-back can reveal what happened, the model decides: frontier models instructed to act exactly once almost never duplicate a write whose acknowledgement was lost (0.5%), weaker models often do, and the model explains 53% of the explained variance. When it cannot -- the request is still in flight, or the transport delivered it twice -- the same frontier models duplicate in 56% and 74% of episodes, and the contract explains 81%. We prove that no verification-only policy is exactly-once under late commits without a bound on in-flight time. Waiting works when such a bound is short and known, but with heavy-tailed in-flight delays even an hour of waiting per episode falls short of offering an idempotency key on every write, which lowers the duplicate rate from 28% to 4% because agents use keys when they exist. The harness barely matters, a guard that attaches keys transfers across harnesses unchanged, and agents reported success in 90% of the episodes in which they had duplicated an effect.", "arxiv_id": "2609.29095", "arxiv_url": "https://arxiv.org/abs/2609.29095", "authors": ["Jiapeng Li"], "brief": "\u8bba\u6587\u7814\u7a76\u5de5\u5177\u578b LLM \u667a\u80fd\u4f53\u5728\u5199\u64cd\u4f5c\u8d85\u65f6\u6216\u62a5\u9519\u540e\uff0c\u5982\u4f55\u907f\u514d\u91cd\u590d\u526f\u4f5c\u7528\u7684\u95ee\u9898\uff0c\u5e76\u6bd4\u8f83\u6a21\u578b\u3001\u667a\u80fd\u4f53\u6846\u67b6\u4e0e\u5de5\u5177\u5951\u7ea6\u4e09\u8005\u5bf9 exactly-once \u884c\u4e3a\u7684\u5f71\u54cd\u3002\u4f5c\u8005\u6784\u5efa\u4e86 LIMBO \u786e\u5b9a\u6027\u6c99\u7bb1\uff0c\u8986\u76d6 6 \u7c7b\u670d\u52a1\u300112 \u79cd\u6545\u969c\u6a21\u5f0f\u548c\u591a\u79cd\u751f\u4ea7\u7ea7\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u63d0\u4ea4\u8d26\u672c\u8bc4\u4f30\u91cd\u590d\u5199\u5165\u3002", "categories": ["cs.LG", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29095", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u53ef\u901a\u8fc7\u7acb\u5373\u8bfb\u56de\u786e\u8ba4\u7ed3\u679c\u7684\u6545\u969c\u4e2d\uff0c\u6a21\u578b\u80fd\u529b\u5f71\u54cd\u6700\u5927\uff1a\u524d\u6cbf\u6a21\u578b\u5728\u88ab\u8981\u6c42 exactly-once \u65f6\u91cd\u590d\u7387\u4ec5 0.5%\uff0c\u6a21\u578b\u89e3\u91ca\u4e86 53% \u7684\u53ef\u89e3\u91ca\u65b9\u5dee\u3002", "\u5728\u8bf7\u6c42\u4ecd\u5728\u98de\u884c\u6216\u4f20\u8f93\u5c42\u91cd\u590d\u6295\u9012\u7b49\u4e0d\u53ef\u9a8c\u8bc1\u573a\u666f\u4e2d\uff0c\u524d\u6cbf\u6a21\u578b\u4ecd\u4f1a\u5927\u91cf\u91cd\u590d\uff0c\u91cd\u590d\u7387\u5206\u522b\u8fbe\u5230 56% \u548c 74%\uff0c\u5de5\u5177\u5951\u7ea6\u89e3\u91ca\u4e86 81% \u7684\u5dee\u5f02\u3002", "\u8bba\u6587\u8bc1\u660e\u5728\u65e0\u98de\u884c\u65f6\u95f4\u4e0a\u754c\u7684 late commit \u573a\u666f\u4e0b\uff0c\u4ec5\u9760\u9a8c\u8bc1\u7b56\u7565\u65e0\u6cd5\u4fdd\u8bc1 exactly-once\uff1b\u4e3a\u6bcf\u6b21\u5199\u5165\u63d0\u4f9b\u5e42\u7b49\u952e\u53ef\u5c06\u91cd\u590d\u7387\u4ece 28% \u964d\u81f3 4%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u53ef\u9760\u6027", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29095v1", "published_at": "2026-09-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Where Does Exactly-Once Live? Model, Harness, and Tool-Contract Effects on Duplicate Side Effects in LLM Agents", "tldr": "\u5e42\u7b49\u952e\u6bd4\u6a21\u578b/\u6846\u67b6\u66f4\u80fd\u4fdd\u969c\u667a\u80fd\u4f53\u53ea\u6267\u884c\u4e00\u6b21", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5de5\u5177\u578b LLM \u667a\u80fd\u4f53\u5728\u5199\u64cd\u4f5c\u8d85\u65f6\u6216\u62a5\u9519\u540e\uff0c\u5982\u4f55\u907f\u514d\u91cd\u590d\u526f\u4f5c\u7528\u7684\u95ee\u9898\uff0c\u5e76\u6bd4\u8f83\u6a21\u578b\u3001\u667a\u80fd\u4f53\u6846\u67b6\u4e0e\u5de5\u5177\u5951\u7ea6\u4e09\u8005\u5bf9 exactly-once \u884c\u4e3a\u7684\u5f71\u54cd\u3002\u4f5c\u8005\u6784\u5efa\u4e86 LIMBO \u786e\u5b9a\u6027\u6c99\u7bb1\uff0c\u8986\u76d6 6 \u7c7b\u670d\u52a1\u300112 \u79cd\u6545\u969c\u6a21\u5f0f\u548c\u591a\u79cd\u751f\u4ea7\u7ea7\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u63d0\u4ea4\u8d26\u672c\u8bc4\u4f30\u91cd\u590d\u5199\u5165\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a LLM \u667a\u80fd\u4f53\u7684\u53ef\u9760\u6267\u884c\u95ee\u9898\u4ece\u201c\u63d0\u793a\u6a21\u578b\u66f4\u5c0f\u5fc3\u201d\u63a8\u8fdb\u5230\u7cfb\u7edf\u5951\u7ea6\u5c42\u9762\uff0c\u6307\u51fa exactly-once \u4e0d\u80fd\u5355\u9760\u6a21\u578b\u6216\u6846\u67b6\u5b9e\u73b0\uff0c\u5de5\u5177\u63a5\u53e3\u7684\u5e42\u7b49\u8bbe\u8ba1\u662f\u5173\u952e\u3002\u5176\u57fa\u51c6\u548c\u5b9e\u8bc1\u7ed3\u679c\u5bf9\u652f\u4ed8\u3001\u90e8\u7f72\u3001\u901a\u77e5\u7b49\u771f\u5b9e\u9ad8\u98ce\u9669\u667a\u80fd\u4f53\u5e94\u7528\u5177\u6709\u76f4\u63a5\u5de5\u7a0b\u4ef7\u503c\u3002"}, {"abstract": "On-policy self-distillation (OPSD) has become a popular recipe for post-training LLM agents. It supervises the agent model at the token level with a stronger teacher view of the same model, obtained by conditioning on privileged information (PI). In this work, we show that in multi-turn agents, this paradigm teaches the student to act with confidence but without the information behind it. The trained agent behaves as if it had privileged information it never observed, and its performance falls well short of plain RL, in the worst case below the untrained base model. Therefore, we propose Privileged Self-Practice (PSP), which keeps the PI and moves it from the loss to the sampler. When the student\u0027s rollouts on a task mostly fail, we inject a short per-task instruction written by an analyzer model, sample the task again with the instruction in context, and train on the result with an unchanged GRPO objective. The privileged information stays in the prompt and never enters the loss. Across AppWorld and SWE-bench Verified, with three different student models, PSP obtains the best average score in every setting and is the only method that consistently outperforms plain GRPO, improving task-goal completion by up to 65% on AppWorld and the resolved rate by up to 61% on SWE-bench Verified.", "arxiv_id": "2609.29051", "arxiv_url": "https://arxiv.org/abs/2609.29051", "authors": ["Xingyu Su", "Abhishek Kumar", "Qing Ping", "Youzhi Luo", "Jonathan Buck", "Zach Zhang", "Subramanian Chidambaram", "Vinayak Arannil"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u591a\u8f6e\u667a\u80fd\u4f53\u4e2d\u7684\u5728\u7ebf\u81ea\u84b8\u998f\u4f1a\u8ba9\u6a21\u578b\u5b66\u5230\u201c\u65e0\u4f9d\u636e\u7684\u81ea\u4fe1\u201d\uff0c\u4eff\u4f5b\u770b\u5230\u4e86\u5b9e\u9645\u672a\u89c2\u5bdf\u5230\u7684\u7279\u6743\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51fa Privileged Self-Practice\uff08PSP\uff09\uff0c\u5c06\u7279\u6743\u4fe1\u606f\u4ece\u76d1\u7763\u635f\u5931\u79fb\u5230\u91c7\u6837\u63d0\u793a\u4e2d\uff0c\u7528\u5931\u8d25\u4efb\u52a1\u7684\u5206\u6790\u6307\u4ee4\u5f15\u5bfc\u91cd\u65b0\u91c7\u6837\uff0c\u518d\u7528\u6807\u51c6 GRPO \u8bad\u7ec3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29051", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0 OPSD \u5728\u591a\u8f6e\u4efb\u52a1\u4e2d\u53ef\u80fd\u663e\u8457\u52a3\u4e8e\u666e\u901a\u5f3a\u5316\u5b66\u4e60\uff0c\u6700\u5dee\u751a\u81f3\u4f4e\u4e8e\u672a\u8bad\u7ec3\u57fa\u5ea7\u6a21\u578b", "PSP \u5728\u5b66\u751f\u6a21\u578b\u5931\u8d25\u65f6\u6ce8\u5165\u7531\u5206\u6790\u5668\u751f\u6210\u7684\u77ed\u4efb\u52a1\u6307\u4ee4\uff0c\u7279\u6743\u4fe1\u606f\u53ea\u8fdb\u5165\u4e0a\u4e0b\u6587\uff0c\u4e0d\u8fdb\u5165\u635f\u5931\u51fd\u6570", "\u5728 AppWorld \u4e0e SWE-bench Verified\u3001\u4e09\u4e2a\u5b66\u751f\u6a21\u578b\u4e0a\uff0cPSP \u5e73\u5747\u8868\u73b0\u6700\u4f73\uff0c\u5e76\u6700\u9ad8\u63d0\u5347 65% \u4efb\u52a1\u5b8c\u6210\u7387\u548c 61% \u95ee\u9898\u89e3\u51b3\u7387"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29051v1", "published_at": "2026-09-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "From Self-Distillation to Self-Practice: Privileged Information for Multi-Turn Agents", "tldr": "\u7528\u7279\u6743\u4fe1\u606f\u91c7\u6837\u63d0\u5347\u591a\u8f6e\u667a\u80fd\u4f53\u8bad\u7ec3", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\uff0c\u591a\u8f6e\u667a\u80fd\u4f53\u4e2d\u7684\u5728\u7ebf\u81ea\u84b8\u998f\u4f1a\u8ba9\u6a21\u578b\u5b66\u5230\u201c\u65e0\u4f9d\u636e\u7684\u81ea\u4fe1\u201d\uff0c\u4eff\u4f5b\u770b\u5230\u4e86\u5b9e\u9645\u672a\u89c2\u5bdf\u5230\u7684\u7279\u6743\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51fa Privileged Self-Practice\uff08PSP\uff09\uff0c\u5c06\u7279\u6743\u4fe1\u606f\u4ece\u76d1\u7763\u635f\u5931\u79fb\u5230\u91c7\u6837\u63d0\u793a\u4e2d\uff0c\u7528\u5931\u8d25\u4efb\u52a1\u7684\u5206\u6790\u6307\u4ee4\u5f15\u5bfc\u91cd\u65b0\u91c7\u6837\uff0c\u518d\u7528\u6807\u51c6 GRPO \u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u667a\u80fd\u4f53\u540e\u8bad\u7ec3\u4e2d\u81ea\u84b8\u998f\u8303\u5f0f\u7684\u5173\u952e\u7f3a\u9677\uff0c\u5e76\u7ed9\u51fa\u7b80\u5355\u6709\u6548\u7684\u66ff\u4ee3\u65b9\u6848\uff0c\u5bf9\u591a\u8f6e LLM agent \u7684\u8bad\u7ec3\u7a33\u5b9a\u6027\u548c\u5b9e\u9645\u4efb\u52a1\u80fd\u529b\u63d0\u5347\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Group-based reinforcement learning (RL) methods, such as GRPO and its variants, have become a leading paradigm for training reasoning and agentic large language models (LLMs). While their group-normalized advantage estimation is reliable at the response level, it becomes systematically biased at the step level, since coarse-grained trajectory-level advantages are hard to accurately reflect the contribution of individual steps (i.e, failed trajectories may contain valuable steps). Revisiting the foundational RL definition, we notice that GRPO\u0027s success on single-turn tasks stems from its advantage estimation strategy, which adheres to the basic definition: the mean reward of multiple actions sampled from the same state constitutes a credible state-value estimate. Extending the faithful estimation to step-level would in principle demand sampling multiple actions from each intermediate state, which is too costly on a per-state basis. To mitigate this issue, we propose a Graph-based Faithful sTep-level credit-assignment framework (GRAFT) that grafts all rollout trajectories into a trajectory graph, recovering node state-values via Bellman iteration on the graph, and assigning credit to each edge by the node value difference. Theoretically, the estimated step-level advantage faithfully adheres to the basic advantage definition in RL. To further ensure the reliability of step-level advantage estimation, we further propose Graph GAE, which extends GAE to the trajectory graph for reducing the impact of state-value estimation bias. Experiments across a range of multi-turn agentic benchmarks show consistent gains over GRPO and superior performance compared to recent agentic RL algorithms. Code will be available at https://github.com/xcyao00/GRAFT.", "arxiv_id": "2609.28963", "arxiv_url": "https://arxiv.org/abs/2609.28963", "authors": ["Xincheng Yao", "Haobo Fu", "Weiming Liu", "Chongyang Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa GRAFT\uff0c\u5c06\u591a\u6761 rollout \u8f68\u8ff9\u62fc\u63a5\u6210\u8f68\u8ff9\u56fe\uff0c\u901a\u8fc7\u56fe\u4e0a\u7684 Bellman \u8fed\u4ee3\u6062\u590d\u8282\u70b9\u72b6\u6001\u4ef7\u503c\uff0c\u5e76\u7528\u76f8\u90bb\u8282\u70b9\u4ef7\u503c\u5dee\u4f30\u8ba1\u6bcf\u4e00\u6b65\u4f18\u52bf\u3002\u5b83\u65e8\u5728\u89e3\u51b3 GRPO \u7b49\u7ec4\u5f52\u4e00\u5316\u65b9\u6cd5\u5728\u591a\u6b65\u667a\u80fd\u4f53\u4efb\u52a1\u4e2d\u628a\u6574\u6761\u8f68\u8ff9\u5956\u52b1\u7c97\u7cd9\u5206\u914d\u5230\u5355\u6b65\u65f6\u4ea7\u751f\u7684\u7cfb\u7edf\u504f\u5dee\u3002", "categories": ["cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28963", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa GRPO \u5728\u54cd\u5e94\u7ea7\u4f18\u52bf\u4f30\u8ba1\u53ef\u9760\uff0c\u4f46\u7528\u4e8e step-level credit assignment \u65f6\u4f1a\u504f\uff0c\u56e0\u4e3a\u5931\u8d25\u8f68\u8ff9\u4e2d\u4e5f\u53ef\u80fd\u5305\u542b\u6709\u4ef7\u503c\u6b65\u9aa4\u3002", "\u6784\u5efa\u8f68\u8ff9\u56fe\u6765\u590d\u7528\u4e0d\u540c rollout \u4e2d\u5171\u4eab\u6216\u76f8\u8fd1\u7684\u4e2d\u95f4\u72b6\u6001\uff0c\u907f\u514d\u5bf9\u6bcf\u4e2a\u4e2d\u95f4\u72b6\u6001\u90fd\u91cd\u65b0\u91c7\u6837\u591a\u4e2a\u52a8\u4f5c\u7684\u9ad8\u6210\u672c\u3002", "\u63d0\u51fa Graph GAE\uff0c\u5c06 GAE \u6269\u5c55\u5230\u8f68\u8ff9\u56fe\u4e0a\uff0c\u4ee5\u964d\u4f4e\u72b6\u6001\u4ef7\u503c\u4f30\u8ba1\u504f\u5dee\u5bf9\u5355\u6b65\u4f18\u52bf\u4f30\u8ba1\u7684\u5f71\u54cd\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28963v1", "published_at": "2026-09-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Back to the Definition: Estimating Step-Level Advantages via Trajectory Graphs for Agentic Reinforcement Learning", "tldr": "\u7528\u8f68\u8ff9\u56fe\u66f4\u51c6\u5206\u914d\u667a\u80fd\u4f53\u6b65\u9aa4\u5956\u52b1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GRAFT\uff0c\u5c06\u591a\u6761 rollout \u8f68\u8ff9\u62fc\u63a5\u6210\u8f68\u8ff9\u56fe\uff0c\u901a\u8fc7\u56fe\u4e0a\u7684 Bellman \u8fed\u4ee3\u6062\u590d\u8282\u70b9\u72b6\u6001\u4ef7\u503c\uff0c\u5e76\u7528\u76f8\u90bb\u8282\u70b9\u4ef7\u503c\u5dee\u4f30\u8ba1\u6bcf\u4e00\u6b65\u4f18\u52bf\u3002\u5b83\u65e8\u5728\u89e3\u51b3 GRPO \u7b49\u7ec4\u5f52\u4e00\u5316\u65b9\u6cd5\u5728\u591a\u6b65\u667a\u80fd\u4f53\u4efb\u52a1\u4e2d\u628a\u6574\u6761\u8f68\u8ff9\u5956\u52b1\u7c97\u7cd9\u5206\u914d\u5230\u5355\u6b65\u65f6\u4ea7\u751f\u7684\u7cfb\u7edf\u504f\u5dee\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4ece\u5f3a\u5316\u5b66\u4e60\u4f18\u52bf\u51fd\u6570\u5b9a\u4e49\u51fa\u53d1\uff0c\u4e3a LLM \u667a\u80fd\u4f53\u591a\u8f6e\u4efb\u52a1\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u3001\u66f4\u5fe0\u5b9e\u7684\u4fe1\u7528\u5206\u914d\u673a\u5236\uff1b\u5728\u591a\u79cd\u591a\u8f6e agentic benchmark \u4e0a\u4f18\u4e8e GRPO \u53ca\u8fd1\u671f\u667a\u80fd\u4f53 RL \u7b97\u6cd5\uff0c\u5177\u5907\u8f83\u5f3a\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Deep search requires LLM agents to decompose complex queries, search for evidence, and synthesize grounded answers, yet existing ReAct-style agents suffer from two limitations: role coupling, where one policy must handle planning, evidence use, and synthesis; and context accumulation, where growing search histories introduce noise and obscure useful information. To address these issues, we propose IterSynth, a role-decoupled and summary-based paradigm that alternates between a Planner for identifying information needs and a Synthesizer for integrating evidence into an evolving summary state. This design separates planning from synthesis while using the summary as the persistent state of search, reducing both capability coupling and context noise. To train IterSynth effectively, we further introduce Role-Decoupled Policy Optimization (RDPO) for reinforcement learning, which combines terminal outcome rewards with turn-level rubric evaluations and computes role-specific advantages for more precise credit assignment. Experiments on five long-horizon deep-search benchmarks such as BrowseComp and Xbench-DS show that IterSynth-8B achieves an average score of 50.7, surpassing the strongest prior $\\leq$8B agent by +4.2\\%. Moreover, IterSynth serves as a model-agnostic prompting paradigm, delivering substantial zero-shot gains over ReAct and similar prompting paradigms on frontier proprietary models.", "arxiv_id": "2609.29444", "arxiv_url": "https://arxiv.org/abs/2609.29444", "authors": ["Xingyu Wu", "Yuchen Yan", "Zhengxi Lu", "Siqi Chen", "Xin ZHANG", "Aiting Liu", "Chao Deng", "Jie Liu", "Jin Ma", "Jian Shao", "Jun Xiao", "Yongliang Shen"], "brief": "\u8bba\u6587\u63d0\u51fa IterSynth\uff0c\u4e00\u79cd\u5c06\u6df1\u5ea6\u641c\u7d22\u4e2d\u7684\u89c4\u5212\u4e0e\u7efc\u5408\u5206\u79bb\u7684\u667a\u80fd\u4f53\u8303\u5f0f\u3002\u5b83\u7528\u6301\u7eed\u66f4\u65b0\u7684\u6458\u8981\u72b6\u6001\u66ff\u4ee3\u4e0d\u65ad\u81a8\u80c0\u7684\u641c\u7d22\u5386\u53f2\uff0c\u5e76\u5728 Planner \u4e0e Synthesizer \u95f4\u8fed\u4ee3\u534f\u4f5c\u751f\u6210\u6709\u4f9d\u636e\u7684\u7b54\u6848\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29444", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9 ReAct \u5f0f\u6df1\u5ea6\u641c\u7d22\u667a\u80fd\u4f53\u7684\u89d2\u8272\u8026\u5408\u4e0e\u4e0a\u4e0b\u6587\u7d2f\u79ef\u566a\u58f0\u95ee\u9898\uff0c\u63d0\u51fa Planner/Synthesizer \u89d2\u8272\u89e3\u8026\u8bbe\u8ba1\u3002", "\u4ee5\u6f14\u5316\u6458\u8981\u4f5c\u4e3a\u641c\u7d22\u6301\u4e45\u72b6\u6001\uff0c\u51cf\u5c11\u957f\u5386\u53f2\u4e0a\u4e0b\u6587\u4e2d\u7684\u65e0\u5173\u4fe1\u606f\u5e72\u6270\u3002", "\u63d0\u51fa RDPO \u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u7ed3\u5408\u7ec8\u5c40\u5956\u52b1\u4e0e\u8f6e\u6b21\u7ea7\u8bc4\u4ef7\uff0c\u5e76\u6309\u89d2\u8272\u8ba1\u7b97\u4f18\u52bf\u4ee5\u6539\u8fdb\u4fe1\u7528\u5206\u914d\uff1bIterSynth-8B \u5728 5 \u4e2a\u957f\u7a0b\u6df1\u5ea6\u641c\u7d22\u57fa\u51c6\u4e0a\u5e73\u5747\u5f97\u5206 50.7\uff0c\u8f83\u6700\u5f3a\u22648B\u57fa\u7ebf\u63d0\u5347 4.2%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6df1\u5ea6\u641c\u7d22", "\u5f3a\u5316\u5b66\u4e60", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29444v1", "published_at": "2026-09-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "IterSynth: Rethinking Deep Search Agents via Role-Decoupled Iterative Synthesis", "tldr": "\u89d2\u8272\u89e3\u8026\u7684\u8fed\u4ee3\u5f0f\u6df1\u5ea6\u641c\u7d22\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa IterSynth\uff0c\u4e00\u79cd\u5c06\u6df1\u5ea6\u641c\u7d22\u4e2d\u7684\u89c4\u5212\u4e0e\u7efc\u5408\u5206\u79bb\u7684\u667a\u80fd\u4f53\u8303\u5f0f\u3002\u5b83\u7528\u6301\u7eed\u66f4\u65b0\u7684\u6458\u8981\u72b6\u6001\u66ff\u4ee3\u4e0d\u65ad\u81a8\u80c0\u7684\u641c\u7d22\u5386\u53f2\uff0c\u5e76\u5728 Planner \u4e0e Synthesizer \u95f4\u8fed\u4ee3\u534f\u4f5c\u751f\u6210\u6709\u4f9d\u636e\u7684\u7b54\u6848\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u67b6\u6784\u4e0e\u8bad\u7ec3\u76ee\u6807\u4e24\u65b9\u9762\u6539\u8fdb\u6df1\u5ea6\u641c\u7d22\u667a\u80fd\u4f53\uff0c\u65e2\u63d0\u5347\u5c0f\u6a21\u578b\u957f\u7a0b\u68c0\u7d22\u95ee\u7b54\u80fd\u529b\uff0c\u4e5f\u53ef\u4f5c\u4e3a\u6a21\u578b\u65e0\u5173\u7684\u63d0\u793a\u8303\u5f0f\u5728\u524d\u6cbf\u95ed\u6e90\u6a21\u578b\u4e0a\u96f6\u6837\u672c\u589e\u5f3a\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model agents increasingly rely on natural-language skills to solve complex tool-use tasks. However, such tasks often admit multiple valid solution paths, making it inappropriate to improve skills by forcing failed trajectories to match a fixed successful trajectory. Moreover, failed trajectories are rarely entirely wrong: an agent may first collect useful evidence and make meaningful progress, but later deviate into an erroneous suffix. We therefore argue that skill self-evolution should identify where productive problem solving begins to break down, rather than reflect coarsely over the entire failure. Based on this insight, we propose SkillPivot, a deviation-point-guided framework for skill self-evolution. SkillPivot detects the transition from a useful prefix to an erroneous suffix using execution validity, goal progress, and action diversity. A stronger teacher then continues from the same prefix and produces a successful alternative under the same interaction history. By contrasting the student\u0027s failed suffix with the teacher\u0027s successful suffix, SkillPivot generates localized skill updates while preserving already effective guidance. Experiments on ToolQA, LogicBench, and WildClawBench show that SkillPivot consistently outperforms competing skill-evolution methods, improves multiple agent models, and produces compact, transferable skill updates.", "arxiv_id": "2609.29154", "arxiv_url": "https://arxiv.org/abs/2609.29154", "authors": ["Yichun Feng", "Jiawei Wang", "Haozhe Sun"], "brief": "\u8bba\u6587\u63d0\u51fa SkillPivot\uff0c\u4e00\u79cd\u9762\u5411 LLM Agent \u7684\u6280\u80fd\u81ea\u8fdb\u5316\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u628a\u5931\u8d25\u8f68\u8ff9\u6574\u4f53\u5bf9\u9f50\u5230\u56fa\u5b9a\u6210\u529f\u8def\u5f84\uff0c\u800c\u662f\u8bc6\u522b\u4ece\u6709\u6548\u524d\u7f00\u8f6c\u5411\u9519\u8bef\u540e\u7f00\u7684\u201c\u504f\u79bb\u70b9\u201d\uff0c\u518d\u7528\u5f3a\u6559\u5e08\u751f\u6210\u66ff\u4ee3\u540e\u7f00\u6765\u66f4\u65b0\u6280\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29154", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u6267\u884c\u6709\u6548\u6027\u3001\u76ee\u6807\u8fdb\u5c55\u548c\u52a8\u4f5c\u591a\u6837\u6027\u68c0\u6d4b\u5931\u8d25\u8f68\u8ff9\u4e2d\u7684\u504f\u79bb\u70b9\uff0c\u4fdd\u7559\u5df2\u6709\u6709\u6548\u63a8\u7406\u4e0e\u64cd\u4f5c\u524d\u7f00", "\u6559\u5e08\u6a21\u578b\u5728\u76f8\u540c\u4ea4\u4e92\u5386\u53f2\u4e0b\u4ece\u504f\u79bb\u70b9\u7ee7\u7eed\u5b8c\u6210\u4efb\u52a1\uff0c\u5e76\u4e0e\u5b66\u751f\u5931\u8d25\u540e\u7f00\u5bf9\u6bd4\u751f\u6210\u5c40\u90e8\u6280\u80fd\u66f4\u65b0", "\u5728 ToolQA\u3001LogicBench\u3001WildClawBench \u4e0a\u4f18\u4e8e\u591a\u79cd\u6280\u80fd\u8fdb\u5316\u65b9\u6cd5\uff0c\u53ef\u63d0\u5347\u591a\u4e2a Agent \u6a21\u578b\u4e14\u66f4\u65b0\u66f4\u7d27\u51d1\u3001\u53ef\u8fc1\u79fb"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u81ea\u8fdb\u5316", "\u6280\u80fd\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29154v1", "published_at": "2026-09-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "A Wrong Turn Does Not Ruin the Journey: Deviation-Guided Skill Self-Evolution for LLM Agents", "tldr": "SkillPivot\u5b9a\u4f4d\u5931\u8d25\u62d0\u70b9\uff0c\u5c40\u90e8\u8fdb\u5316LLM\u5de5\u5177\u4f7f\u7528\u6280\u80fd", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SkillPivot\uff0c\u4e00\u79cd\u9762\u5411 LLM Agent \u7684\u6280\u80fd\u81ea\u8fdb\u5316\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u628a\u5931\u8d25\u8f68\u8ff9\u6574\u4f53\u5bf9\u9f50\u5230\u56fa\u5b9a\u6210\u529f\u8def\u5f84\uff0c\u800c\u662f\u8bc6\u522b\u4ece\u6709\u6548\u524d\u7f00\u8f6c\u5411\u9519\u8bef\u540e\u7f00\u7684\u201c\u504f\u79bb\u70b9\u201d\uff0c\u518d\u7528\u5f3a\u6559\u5e08\u751f\u6210\u66ff\u4ee3\u540e\u7f00\u6765\u66f4\u65b0\u6280\u80fd\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u66f4\u7b26\u5408\u5de5\u5177\u4f7f\u7528\u4efb\u52a1\u4e2d\u201c\u591a\u6761\u6210\u529f\u8def\u5f84\u201d\u548c\u201c\u90e8\u5206\u5931\u8d25\u8f68\u8ff9\u4ecd\u6709\u4ef7\u503c\u201d\u7684\u73b0\u5b9e\uff0c\u80fd\u51cf\u5c11\u7c97\u66b4\u53cd\u601d\u5e26\u6765\u7684\u6709\u6548\u7ecf\u9a8c\u7834\u574f\uff0c\u5bf9\u6784\u5efa\u53ef\u6301\u7eed\u81ea\u6539\u8fdb\u7684 LLM Agent \u5177\u6709\u5b9e\u7528\u610f\u4e49\u3002"}, {"abstract": "Recent advances in speech language models have improved automatic speech recognition (ASR) for long-form audio. However, accurately and consistently transcribing domain-specific terminology remains challenging. Motivated by the world knowledge and contextual capability of large language models (LLMs), we propose Agentic-GER, an LLM-based agent for terminology correction in long-form speech. The agent uses global context from the full transcript to identify suspicious terms and resolve ambiguous hypotheses. It selectively re-transcribes the source speech to check candidate corrections, and uses accepted edits to guide subsequent decisions. Experiments with four LLMs and two ASR systems on GigaSpeechBench show consistent terminology improvements in both Chinese and English, with and without thinking. On Chinese speech, Agentic-GER achieves up to a 36.8% relative reduction in biased character error rate (B-CER) over the Whisper baseline.", "arxiv_id": "2609.29428", "arxiv_url": "https://arxiv.org/abs/2609.29428", "authors": ["Yanqiao Zhu", "Wupeng Wang", "Zhifu Gao", "Xiangang Li", "Xie Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Agentic-GER\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u97f3\u9891\u8f6c\u5199\u7684 LLM \u667a\u80fd\u4f53\uff0c\u7528\u5168\u5c40\u4e0a\u4e0b\u6587\u53d1\u73b0\u5e76\u4fee\u6b63\u9886\u57df\u672f\u8bed\u9519\u8bef\u3002\u5b83\u4f1a\u9009\u62e9\u6027\u91cd\u542c\u6e90\u8bed\u97f3\u9a8c\u8bc1\u5019\u9009\u4fee\u6b63\uff0c\u5e76\u5229\u7528\u5df2\u63a5\u53d7\u7f16\u8f91\u6301\u7eed\u6307\u5bfc\u540e\u7eed\u51b3\u7b56\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29428", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5229\u7528\u5b8c\u6574\u8f6c\u5199\u6587\u672c\u7684\u5168\u5c40\u4e0a\u4e0b\u6587\u8bc6\u522b\u53ef\u7591\u672f\u8bed\uff0c\u89e3\u51b3\u5c40\u90e8\u8bed\u97f3\u8bc6\u522b\u4e2d\u96be\u4ee5\u5224\u5b9a\u7684\u6b67\u4e49", "\u901a\u8fc7\u9009\u62e9\u6027\u91cd\u65b0\u8f6c\u5199\u6e90\u8bed\u97f3\u6765\u6821\u9a8c\u5019\u9009\u672f\u8bed\u4fee\u6b63\uff0c\u907f\u514d\u7eaf\u6587\u672c\u540e\u5904\u7406\u5e26\u6765\u7684\u5e7b\u89c9\u5f0f\u4fee\u6539", "\u5728 GigaSpeechBench \u4e0a\u6d4b\u8bd5 4 \u4e2a LLM \u548c 2 \u4e2a ASR \u7cfb\u7edf\uff0c\u4e2d\u82f1\u6587\u5747\u53d6\u5f97\u7a33\u5b9a\u672f\u8bed\u6539\u8fdb\uff1b\u4e2d\u6587\u76f8\u5bf9 Whisper \u57fa\u7ebf\u6700\u9ad8\u964d\u4f4e 36.8% B-CER"], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u672f\u8bed\u7ea0\u9519"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29428v1", "published_at": "2026-09-24", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "agentic-ger: terminology recovery in long-form speech using global context", "tldr": "\u7528LLM\u667a\u80fd\u4f53\u4fee\u6b63\u957f\u8bed\u97f3\u672f\u8bed\u8f6c\u5199\u9519\u8bef", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agentic-GER\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u97f3\u9891\u8f6c\u5199\u7684 LLM \u667a\u80fd\u4f53\uff0c\u7528\u5168\u5c40\u4e0a\u4e0b\u6587\u53d1\u73b0\u5e76\u4fee\u6b63\u9886\u57df\u672f\u8bed\u9519\u8bef\u3002\u5b83\u4f1a\u9009\u62e9\u6027\u91cd\u542c\u6e90\u8bed\u97f3\u9a8c\u8bc1\u5019\u9009\u4fee\u6b63\uff0c\u5e76\u5229\u7528\u5df2\u63a5\u53d7\u7f16\u8f91\u6301\u7eed\u6307\u5bfc\u540e\u7eed\u51b3\u7b56\u3002", "why_notable": "\u957f\u8bed\u97f3 ASR \u4e2d\u9886\u57df\u672f\u8bed\u4e00\u81f4\u6027\u662f\u9ad8\u4ef7\u503c\u75db\u70b9\uff0c\u8be5\u65b9\u6cd5\u628a LLM \u7684\u4e16\u754c\u77e5\u8bc6\u3001\u5168\u5c40\u4e0a\u4e0b\u6587\u63a8\u7406\u4e0e\u8bed\u97f3\u91cd\u9a8c\u8bc1\u7ed3\u5408\uff0c\u4e3a\u4e13\u4e1a\u4f1a\u8bae\u3001\u8bfe\u5802\u3001\u533b\u7597\u7b49\u573a\u666f\u7684\u8f6c\u5199\u540e\u5904\u7406\u63d0\u4f9b\u4e86\u5b9e\u7528\u65b9\u6848\u3002"}, {"abstract": "Sensitive information is defined by domain and intent, not a universal category, yet redaction systems such as privacy filters and named-entity recognizers fix a taxonomy at training time, requiring retraining for each new domain. We introduce ASIRF (Agentic Sensitive Information Redaction Framework), which retrieves domain-specific definitions based on the input\u0027s domain from a flexible knowledge base at inference time, needing no retraining to adapt. Two architectures, a three-call multi-agent pipeline and a single-agent variant, are evaluated across ten small open-weight models and eight datasets, including out-of-distribution fictional domains, against the OpenAI Privacy Filter (OPF) as a trained-classifier baseline. With only a few dozen expert-authored definitions per domain and no training data, ASIRF\u0027s recall exceeds OPF\u0027s in 68 of 80 model-domain combinations (85 percent), by at least one of the two architectures, with shortfalls confined mostly to OPF\u0027s training-distribution domains.", "arxiv_id": "2609.29191", "arxiv_url": "https://arxiv.org/abs/2609.29191", "authors": ["Sudha Priyadarshini", "Mohamed Chahine Ghanem"], "brief": "\u8bba\u6587\u63d0\u51fa ASIRF\uff0c\u4e00\u4e2a\u57fa\u4e8e\u63a8\u7406\u65f6\u68c0\u7d22\u9886\u57df\u5b9a\u4e49\u7684\u654f\u611f\u4fe1\u606f\u8131\u654f\u6846\u67b6\u3002\u5b83\u53ef\u6309\u8f93\u5165\u6240\u5c5e\u9886\u57df\u52a8\u6001\u8c03\u7528\u77e5\u8bc6\u5e93\u4e2d\u7684\u654f\u611f\u4fe1\u606f\u5b9a\u4e49\uff0c\u65e0\u9700\u4e3a\u65b0\u9886\u57df\u91cd\u65b0\u8bad\u7ec3\u6a21\u578b\u3002", "categories": ["cs.AI", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29191", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b\u4e09\u6b21\u8c03\u7528\u7684\u591a\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf\u548c\u5355\u667a\u80fd\u4f53\u53d8\u4f53\u4e24\u79cd\u67b6\u6784", "\u572810\u4e2a\u5c0f\u578b\u5f00\u6e90\u6743\u91cd\u6a21\u578b\u30018\u4e2a\u6570\u636e\u96c6\u4e0a\u8bc4\u4f30\uff0c\u8986\u76d6\u5206\u5e03\u5916\u865a\u6784\u9886\u57df", "\u4ec5\u7528\u6bcf\u4e2a\u9886\u57df\u51e0\u5341\u6761\u4e13\u5bb6\u5b9a\u4e49\u3001\u65e0\u8bad\u7ec3\u6570\u636e\uff0cASIRF \u572880\u4e2a\u6a21\u578b-\u9886\u57df\u7ec4\u5408\u4e2d\u670968\u4e2a\u53ec\u56de\u7387\u8d85\u8fc7 OpenAI Privacy Filter"], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u9690\u79c1\u4fdd\u62a4", "\u5c0f\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29191v1", "published_at": "2026-09-24", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ASIRF: An Agentic Framework for Context-Dependent Sensitive Information Redaction", "tldr": "\u65e0\u9700\u91cd\u8bad\u7684\u9886\u57df\u81ea\u9002\u5e94\u654f\u611f\u4fe1\u606f\u8131\u654f\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ASIRF\uff0c\u4e00\u4e2a\u57fa\u4e8e\u63a8\u7406\u65f6\u68c0\u7d22\u9886\u57df\u5b9a\u4e49\u7684\u654f\u611f\u4fe1\u606f\u8131\u654f\u6846\u67b6\u3002\u5b83\u53ef\u6309\u8f93\u5165\u6240\u5c5e\u9886\u57df\u52a8\u6001\u8c03\u7528\u77e5\u8bc6\u5e93\u4e2d\u7684\u654f\u611f\u4fe1\u606f\u5b9a\u4e49\uff0c\u65e0\u9700\u4e3a\u65b0\u9886\u57df\u91cd\u65b0\u8bad\u7ec3\u6a21\u578b\u3002", "why_notable": "\u5b83\u5c06\u654f\u611f\u4fe1\u606f\u8bc6\u522b\u4ece\u56fa\u5b9a\u6807\u7b7e\u5206\u7c7b\u8f6c\u5411\u53ef\u68c0\u7d22\u3001\u53ef\u6269\u5c55\u7684\u9886\u57df\u5b9a\u4e49\u9002\u914d\uff0c\u964d\u4f4e\u4e86\u8de8\u9886\u57df\u8131\u654f\u7cfb\u7edf\u7684\u91cd\u8bad\u6210\u672c\uff0c\u5e76\u5728\u591a\u6570\u8bbe\u7f6e\u4e0b\u4f18\u4e8e\u8bad\u7ec3\u5f0f\u9690\u79c1\u8fc7\u6ee4\u57fa\u7ebf\u3002"}, {"abstract": "Banking assistants must use account-specific information to answer requests and, in many cases, take actions through tools. Evaluating only the final response misses important errors. An assistant may ask for information it already has, rely on stale context, select the wrong account, or write an invalid value after stating the correct one. We introduce IndicBankBench, a 799-case benchmark for Indian retail banking spanning five operational domains, a capability/refusal domain, and twenty primary axes. Cases are evaluated at four stages: safety, action and tool use, response adequacy, and advisory quality. Tool use and most safety checks are deterministic. A narrow resolver handles only ambiguous confirmation-before-write cases, while a separate LLM judge evaluates semantic response adequacy. We run every case three times and report strict pass^3, which requires success on all trials. Across the eleven evaluated models, strict reliability ranges from 43.7% to 58.2%, whereas at-least-once success ranges from 60% to 74%. This gap shows that at-least-once success can overstate dependable banking behavior. The case-level diagnostics also distinguish systems that ask unnecessary questions from those that act but fail to reconcile customer context or fully resolve the request. We release the cases, mock environment, and evaluation harness.", "arxiv_id": "2609.29167", "arxiv_url": "https://arxiv.org/abs/2609.29167", "authors": ["Suvradip Paul", "Chandra Bhushan", "Harsh Sharma", "Nitin Kukreja", "Yatharth Dedhia", "Keyur Doshi", "Prashant Devadiga"], "brief": "\u8bba\u6587\u63d0\u51fa IndicBankBench\uff0c\u4e00\u4e2a\u5305\u542b799\u4e2a\u6848\u4f8b\u7684\u5370\u5ea6\u96f6\u552e\u94f6\u884c\u8bed\u8a00\u6a21\u578b\u52a9\u624b\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u4e94\u7c7b\u4e1a\u52a1\u3001\u62d2\u7b54\u80fd\u529b\u4e0e20\u4e2a\u8bc4\u6d4b\u8f74\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u6700\u7ec8\u56de\u7b54\uff0c\u8fd8\u5206\u9636\u6bb5\u68c0\u67e5\u5b89\u5168\u6027\u3001\u5de5\u5177\u8c03\u7528\u3001\u56de\u7b54\u5145\u5206\u6027\u548c\u54a8\u8be2\u8d28\u91cf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29167", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b\u5173\u6ce8\u8d26\u6237\u4e0a\u4e0b\u6587\u4f7f\u7528\u3001\u5de5\u5177\u64cd\u4f5c\u3001\u786e\u8ba4\u540e\u5199\u5165\u3001\u62d2\u7b54\u4e0e\u54a8\u8be2\u8d28\u91cf\u7b49\u94f6\u884c\u573a\u666f\u5173\u952e\u98ce\u9669\u3002", "\u5927\u90e8\u5206\u5b89\u5168\u4e0e\u5de5\u5177\u4f7f\u7528\u68c0\u67e5\u91c7\u7528\u786e\u5b9a\u6027\u8bc4\u6d4b\uff0c\u8bed\u4e49\u56de\u7b54\u5145\u5206\u6027\u7531\u72ec\u7acb LLM judge \u5224\u65ad\u3002", "11\u4e2a\u6a21\u578b\u7684 strict pass^3 \u53ef\u9760\u6027\u4ec5\u4e3a43.7%\u81f358.2%\uff0c\u663e\u8457\u4f4e\u4e8e\u81f3\u5c11\u4e00\u6b21\u6210\u529f\u738760%\u81f374%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u8bc4\u6d4b", "\u5de5\u5177\u4f7f\u7528", "\u91d1\u878d\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29167v1", "published_at": "2026-09-24", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "IndicBankBench: Evaluating Safety and Reliability of Language Model Assistants in Indian Retail Banking", "tldr": "\u5370\u5ea6\u96f6\u552e\u94f6\u884c\u52a9\u624b\u53ef\u9760\u6027\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa IndicBankBench\uff0c\u4e00\u4e2a\u5305\u542b799\u4e2a\u6848\u4f8b\u7684\u5370\u5ea6\u96f6\u552e\u94f6\u884c\u8bed\u8a00\u6a21\u578b\u52a9\u624b\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u4e94\u7c7b\u4e1a\u52a1\u3001\u62d2\u7b54\u80fd\u529b\u4e0e20\u4e2a\u8bc4\u6d4b\u8f74\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u6700\u7ec8\u56de\u7b54\uff0c\u8fd8\u5206\u9636\u6bb5\u68c0\u67e5\u5b89\u5168\u6027\u3001\u5de5\u5177\u8c03\u7528\u3001\u56de\u7b54\u5145\u5206\u6027\u548c\u54a8\u8be2\u8d28\u91cf\u3002", "why_notable": "\u8be5\u57fa\u51c6\u63ed\u793a\u4e86\u91d1\u878d\u573a\u666f\u4e2d\u201c\u5076\u5c14\u6210\u529f\u201d\u4e0d\u80fd\u4ee3\u8868\u53ef\u9760\u53ef\u90e8\u7f72\uff0c\u80fd\u7ec6\u7c92\u5ea6\u8bca\u65ad\u52a9\u624b\u5728\u4e0a\u4e0b\u6587\u5bf9\u9f50\u3001\u8d26\u6237\u9009\u62e9\u548c\u5de5\u5177\u6267\u884c\u4e2d\u7684\u771f\u5b9e\u98ce\u9669\uff0c\u5bf9\u9ad8\u98ce\u9669\u884c\u4e1a\u667a\u80fd\u4f53\u8bc4\u6d4b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Decentralized LLM-based multi-agent systems coordinate through local interactions, but an agent can remain responsive while its task-solving quality persistently degrades. Such gray failures require protecting current tasks before sufficient evidence exists to alter future routing, while still allowing recovered agents to rejoin. We introduce MeshHeal, a fully decentralized self-healing framework that couples ability-matched peer review across two timescales. At the fast timescale, an adaptive hierarchy escalates uncertain or low-scoring outputs from repeated single-reviewer evaluation to committee deliberation and, when needed, correction before use. At the slow timescale, a task- and ability-conditioned peer-relative detector aggregates scores to distinguish persistent degradation from ordinary output variation, trigger mandatory committee review, and eventually exclude degraded agents from ordinary routing; recovery probes provide fresh evidence for reintegration. To faithfully evaluate routing, we introduce Model-Backed MAS Evaluation, which ties ability assignments to execution models, since prompt-based ability assignments alone can leave routing errors hidden. Across BBH, MATH, and MMLU-Pro, MeshHeal achieves 0.839 degraded-phase accuracy using 51k total model tokens per task, versus the strongest baseline Symphony\u0027s 0.807 accuracy using 115k per task. Under staggered degradation and recovery, MeshHeal isolates degraded agents, keeps them excluded from ordinary task execution until recovery, and returns them to normal routing.", "arxiv_id": "2609.29015", "arxiv_url": "https://arxiv.org/abs/2609.29015", "authors": ["Keru Chen", "Sen Lin", "Yingbin Liang", "Nathaniel D. Bastian", "Shaofeng Zou"], "brief": "MeshHeal \u63d0\u51fa\u4e00\u79cd\u5b8c\u5168\u53bb\u4e2d\u5fc3\u5316\u7684\u53cc\u65f6\u95f4\u5c3a\u5ea6\u81ea\u6108\u673a\u5236\uff0c\u7528\u4e8e\u8bc6\u522b\u548c\u5904\u7406\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u201c\u4ecd\u54cd\u5e94\u4f46\u8d28\u91cf\u9000\u5316\u201d\u7684\u7070\u6545\u969c\u3002\u5b83\u901a\u8fc7\u5feb\u901f\u8f93\u51fa\u5ba1\u67e5\u4fdd\u62a4\u5f53\u524d\u4efb\u52a1\uff0c\u5e76\u901a\u8fc7\u6162\u901f\u540c\u4f34\u76f8\u5bf9\u68c0\u6d4b\u8c03\u6574\u540e\u7eed\u8def\u7531\u4e0e\u6062\u590d\u63a5\u5165\u3002", "categories": ["cs.AI", "cs.CL", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29015", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5feb\u901f\u65f6\u95f4\u5c3a\u5ea6\u91c7\u7528\u81ea\u9002\u5e94\u5c42\u7ea7\u5ba1\u67e5\uff1a\u4ece\u5355\u8bc4\u5ba1\u5230\u59d4\u5458\u4f1a\u8ba8\u8bba\uff0c\u5fc5\u8981\u65f6\u5728\u7ed3\u679c\u4f7f\u7528\u524d\u8fdb\u884c\u7ea0\u6b63\u3002", "\u6162\u901f\u65f6\u95f4\u5c3a\u5ea6\u7528\u4efb\u52a1\u4e0e\u80fd\u529b\u6761\u4ef6\u5316\u7684\u540c\u4f34\u76f8\u5bf9\u68c0\u6d4b\u5668\uff0c\u533a\u5206\u6301\u7eed\u9000\u5316\u4e0e\u666e\u901a\u6ce2\u52a8\uff0c\u5e76\u89e6\u53d1\u5f3a\u5236\u59d4\u5458\u4f1a\u5ba1\u67e5\u6216\u8def\u7531\u6392\u9664\u3002", "\u5728 BBH\u3001MATH\u3001MMLU-Pro \u4e0a\uff0cMeshHeal \u4ee5\u6bcf\u4efb\u52a1 51k token \u8fbe\u5230 0.839 \u9000\u5316\u9636\u6bb5\u51c6\u786e\u7387\uff0c\u4f18\u4e8e Symphony \u7684 0.807 \u4e14 token \u5f00\u9500\u66f4\u4f4e\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u53ef\u9760\u6027", "LLM\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29015v1", "published_at": "2026-09-24", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MeshHeal: Two-Timescale Self-Healing for Gray Failures in Decentralized LLM Agent Networks", "tldr": "\u53bb\u4e2d\u5fc3\u5316LLM\u667a\u80fd\u4f53\u7f51\u7edc\u7684\u7070\u6545\u969c\u81ea\u6108\u6846\u67b6", "upvotes": 0, "what_it_is": "MeshHeal \u63d0\u51fa\u4e00\u79cd\u5b8c\u5168\u53bb\u4e2d\u5fc3\u5316\u7684\u53cc\u65f6\u95f4\u5c3a\u5ea6\u81ea\u6108\u673a\u5236\uff0c\u7528\u4e8e\u8bc6\u522b\u548c\u5904\u7406\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u201c\u4ecd\u54cd\u5e94\u4f46\u8d28\u91cf\u9000\u5316\u201d\u7684\u7070\u6545\u969c\u3002\u5b83\u901a\u8fc7\u5feb\u901f\u8f93\u51fa\u5ba1\u67e5\u4fdd\u62a4\u5f53\u524d\u4efb\u52a1\uff0c\u5e76\u901a\u8fc7\u6162\u901f\u540c\u4f34\u76f8\u5bf9\u68c0\u6d4b\u8c03\u6574\u540e\u7eed\u8def\u7531\u4e0e\u6062\u590d\u63a5\u5165\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u5b9e\u9645\u591a\u667a\u80fd\u4f53\u90e8\u7f72\u4e2d\u5e38\u89c1\u4f46\u96be\u68c0\u6d4b\u7684\u7070\u6545\u969c\u95ee\u9898\uff0c\u5728\u4fdd\u8bc1\u5f53\u524d\u4efb\u52a1\u8d28\u91cf\u3001\u957f\u671f\u8def\u7531\u5b89\u5168\u548c\u6545\u969c\u6062\u590d\u4e4b\u95f4\u53d6\u5f97\u5e73\u8861\uff0c\u5bf9\u53bb\u4e2d\u5fc3\u5316 LLM \u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u53ef\u9760\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multi-agent large language models (LLMs) have become ubiquitous in applied AI, yet their theoretical foundations remain surprisingly understudied. Viewed through the lens of multi-agent systems theory, several shortcomings come to light: a lack of social intelligence, the absence of coordination mechanisms among agents, unknown emergent behavior, and interactions between agents that are bounded by natural language. We address two of these gaps: the absence of social behavior and the lack of mechanisms for inter-agent coordination. We introduce Epistemic Probabilistic Language Agents (EPLA), a neuro-symbolic architecture for multi-agent coordination under uncertainty. A Symbolic Guard provides structured diagnostic feedback. The LLM generates typed actions, and the Guard controls their execution against an authoritative symbolic state. We formalize the epistemic layer in a gossip testbed through epistemic lottery gossip models, which combine view-based call histories with agent-indexed probability weights. We argue that implementing such a formalism can address shortcomings of agentic LLMs.", "arxiv_id": "2609.29366", "arxiv_url": "https://arxiv.org/abs/2609.29366", "authors": ["Mehdi Nasiri", "Mohammad Saeed Arvenaghi", "Sadegh Vaezi", "Ebrahim Ardeshir-Larijani"], "brief": "\u8bba\u6587\u63d0\u51fa Epistemic Probabilistic Language Agents\uff08EPLA\uff09\uff0c\u4e00\u79cd\u9762\u5411\u4e0d\u786e\u5b9a\u73af\u5883\u4e0b\u591a\u667a\u80fd\u4f53 LLM \u534f\u8c03\u7684\u795e\u7ecf\u7b26\u53f7\u67b6\u6784\u3002\u5b83\u8ba9 LLM \u751f\u6210\u7c7b\u578b\u5316\u52a8\u4f5c\uff0c\u5e76\u7531\u7b26\u53f7\u5b88\u536b\u57fa\u4e8e\u6743\u5a01\u7b26\u53f7\u72b6\u6001\u8fdb\u884c\u8bca\u65ad\u53cd\u9988\u4e0e\u6267\u884c\u63a7\u5236\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29366", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u5f15\u5165 Symbolic Guard\uff0c\u4e3a\u591a\u667a\u80fd\u4f53\u4ea4\u4e92\u63d0\u4f9b\u7ed3\u6784\u5316\u8bca\u65ad\u53cd\u9988\u548c\u52a8\u4f5c\u6267\u884c\u7ea6\u675f\uff0c\u51cf\u5c11\u4ec5\u4f9d\u8d56\u81ea\u7136\u8bed\u8a00\u534f\u4f5c\u7684\u4e0d\u786e\u5b9a\u6027\u3002", "\u5728 gossip \u6d4b\u8bd5\u5e8a\u4e2d\u5f62\u5f0f\u5316\u8ba4\u77e5\u5c42\uff0c\u63d0\u51fa\u7ed3\u5408\u89c6\u56fe\u5316\u901a\u8bdd\u5386\u53f2\u4e0e\u667a\u80fd\u4f53\u6982\u7387\u6743\u91cd\u7684 epistemic lottery gossip models\u3002", "\u805a\u7126\u591a\u667a\u80fd\u4f53 LLM \u7684\u793e\u4f1a\u884c\u4e3a\u4e0e\u534f\u8c03\u673a\u5236\u7f3a\u5931\u95ee\u9898\uff0c\u5c1d\u8bd5\u7528\u5f62\u5f0f\u5316\u6a21\u578b\u89e3\u91ca\u548c\u7ea6\u675f\u6f5c\u5728\u6d8c\u73b0\u884c\u4e3a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u795e\u7ecf\u7b26\u53f7", "\u5f62\u5f0f\u5316\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29366v1", "published_at": "2026-09-24", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Epistemic-Probabilistic Model for Guarded Multi-Agent LLM Coordination", "tldr": "\u7528\u7b26\u53f7\u5b88\u536b\u589e\u5f3a\u591a\u667a\u80fd\u4f53LLM\u534f\u4f5c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Epistemic Probabilistic Language Agents\uff08EPLA\uff09\uff0c\u4e00\u79cd\u9762\u5411\u4e0d\u786e\u5b9a\u73af\u5883\u4e0b\u591a\u667a\u80fd\u4f53 LLM \u534f\u8c03\u7684\u795e\u7ecf\u7b26\u53f7\u67b6\u6784\u3002\u5b83\u8ba9 LLM \u751f\u6210\u7c7b\u578b\u5316\u52a8\u4f5c\uff0c\u5e76\u7531\u7b26\u53f7\u5b88\u536b\u57fa\u4e8e\u6743\u5a01\u7b26\u53f7\u72b6\u6001\u8fdb\u884c\u8bca\u65ad\u53cd\u9988\u4e0e\u6267\u884c\u63a7\u5236\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u7684\u8ba4\u77e5\u903b\u8f91\u3001\u6982\u7387\u5efa\u6a21\u4e0e LLM \u667a\u80fd\u4f53\u7ed3\u5408\uff0c\u4e3a\u591a\u667a\u80fd\u4f53 LLM \u534f\u4f5c\u63d0\u4f9b\u66f4\u53ef\u9a8c\u8bc1\u3001\u53ef\u7ea6\u675f\u7684\u7406\u8bba\u6846\u67b6\uff0c\u5c24\u5176\u9002\u5408\u9700\u8981\u5b89\u5168\u534f\u8c03\u548c\u72b6\u6001\u4e00\u81f4\u6027\u7684\u5e94\u7528\u573a\u666f\u3002"}, {"abstract": "Large Language Models (LLMs) consume and produce a single sequence of text; hence, if text can be added to the beginning of the LLM\u0027s response, i.e., an output prefix, then all subsequent tokens will be conditioned on it. This output-prefix attack technique is a cheap black-box prompt injection. Prior work has shown this type of attack can reliably jailbreak non-reasoning models. Most reasoning models add an intermediate scratchpad reasoning step before the assistant\u0027s final response. The ability to edit this reasoning channel is exposed by some APIs and attack vectors can be leveraged for reasoning injection attacks. We present the first systematic, controlled study that isolates the scratchpad reasoning channel as an output-prefix attack vector, and the first to compare reasoning-only, output-prefix-only and reasoning-plus-output-prefix attacks across both exposed- and hidden-reasoning models. Using a factorial design of 3 prefix types $\\times$ 2 reasoning injections over $1{,}800$ test cases drawn from AdvBench, we attack three 2026-era frontier models Gemini 3 Flash Preview, DeepSeek V4 Flash, and Claude Haiku 4.5. We find that injecting malicious reasoning alone is essentially inert ($\\approx0\\%$ attack success), but injecting the same reasoning together with a trivial output prefix raises the attack success rate to as high as $99\\%$ for some models. For this type of attack we find that contextual prefixes work better than static prefixes; and that susceptibility is dependent on the model.", "arxiv_id": "2609.29775", "arxiv_url": "https://arxiv.org/abs/2609.29775", "authors": ["Luk\u00e1\u0161 Br\u016fna", "Robert Bridges", "Adam Ek"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u63a8\u7406\u578b LLM \u4e2d\u5c06\u5185\u5bb9\u9884\u586b\u5230\u56de\u590d\u5f00\u5934\uff08output prefix\uff09\u53ca\u63a8\u7406\u8349\u7a3f\u901a\u9053\u7684\u9ed1\u76d2\u63d0\u793a\u6ce8\u5165\u98ce\u9669\u3002\u4f5c\u8005\u5728 AdvBench \u4e0a\u6bd4\u8f83\u4ec5\u63a8\u7406\u6ce8\u5165\u3001\u4ec5\u8f93\u51fa\u524d\u7f00\u3001\u4e8c\u8005\u7ed3\u5408\u5bf9\u591a\u79cd\u524d\u6cbf\u6a21\u578b\u7684\u653b\u51fb\u6548\u679c\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29775", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 3 \u7c7b\u8f93\u51fa\u524d\u7f00 \u00d7 2 \u7c7b\u63a8\u7406\u6ce8\u5165\u7684\u56e0\u5b50\u5b9e\u9a8c\u8bbe\u8ba1\uff0c\u5171 1800 \u4e2a\u6d4b\u8bd5\u7528\u4f8b\u3002", "\u4ec5\u6ce8\u5165\u6076\u610f\u63a8\u7406\u51e0\u4e4e\u65e0\u6548\uff0c\u653b\u51fb\u6210\u529f\u7387\u7ea6\u4e3a 0%\uff1b\u4f46\u4e0e\u7b80\u5355\u8f93\u51fa\u524d\u7f00\u7ed3\u5408\u540e\uff0c\u90e8\u5206\u6a21\u578b\u6210\u529f\u7387\u6700\u9ad8\u53ef\u8fbe 99%\u3002", "\u4e0a\u4e0b\u6587\u5316\u8f93\u51fa\u524d\u7f00\u6bd4\u9759\u6001\u524d\u7f00\u66f4\u6709\u6548\uff0c\u4e14\u4e0d\u540c\u6a21\u578b\u5bf9\u8be5\u653b\u51fb\u7684\u654f\u611f\u6027\u5dee\u5f02\u660e\u663e\u3002"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u63d0\u793a\u6ce8\u5165", "\u63a8\u7406\u6a21\u578b", "\u8d8a\u72f1\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29775v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Prefilling the Reasoning Channel: Output-Prefix Attacks on Reasoning LLMs", "tldr": "\u8f93\u51fa\u524d\u7f00\u53ef\u663e\u8457\u653e\u5927\u63a8\u7406\u6ce8\u5165\u8d8a\u72f1", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u63a8\u7406\u578b LLM \u4e2d\u5c06\u5185\u5bb9\u9884\u586b\u5230\u56de\u590d\u5f00\u5934\uff08output prefix\uff09\u53ca\u63a8\u7406\u8349\u7a3f\u901a\u9053\u7684\u9ed1\u76d2\u63d0\u793a\u6ce8\u5165\u98ce\u9669\u3002\u4f5c\u8005\u5728 AdvBench \u4e0a\u6bd4\u8f83\u4ec5\u63a8\u7406\u6ce8\u5165\u3001\u4ec5\u8f93\u51fa\u524d\u7f00\u3001\u4e8c\u8005\u7ed3\u5408\u5bf9\u591a\u79cd\u524d\u6cbf\u6a21\u578b\u7684\u653b\u51fb\u6548\u679c\u3002", "why_notable": "\u8bba\u6587\u9996\u6b21\u53d7\u63a7\u5730\u9694\u79bb\u5e76\u6bd4\u8f83\u63a8\u7406\u901a\u9053\u4e0e\u8f93\u51fa\u524d\u7f00\u5728\u63a8\u7406\u6a21\u578b\u8d8a\u72f1\u4e2d\u7684\u4f5c\u7528\uff0c\u63ed\u793a\u4e86\u66b4\u9732\u6216\u53ef\u64cd\u63a7 reasoning channel \u7684 API \u53ef\u80fd\u5e26\u6765\u4e25\u91cd\u5b89\u5168\u98ce\u9669\u3002"}, {"abstract": "Rufus-Air is an open and reproducible post-training recipe on GLM-4.5-Air-Base (106B-A12B), organized as a serial pipeline of eight stages: SFT, Reasoning RL, Coding RL, Instruction-Following RL, General Agent, Coding Agent, Search Agent, and RLHF. We document the data, reward design, infrastructure, stage order, and stagewise results needed to reproduce the recipe. Stages progress from basic to advanced capabilities and from hard, verifiable rewards to softer judge-based signals. Training builds on open-source components and public data, much of it used as released, without new human annotation or an in-house distillation teacher. Our main findings are that (i) diverse, high-quality SFT establishes a strong capability floor; (ii) difficulty filtering keeps RL prompts within a productive learning range; (iii) reward reliability provides a practical principle for ordering stages; and (iv) infrastructure and engineering choices are part of the recipe, not just an implementation detail. Rufus-Air improves over the official GLM-4.5-Air post-trained release and is competitive with similarly sized open models.", "arxiv_id": "2609.29421", "arxiv_url": "https://arxiv.org/abs/2609.29421", "authors": ["Chia-Yuan Chang", "Renyuan Cheng", "Rui Feng", "Xiaotian Han", "Yuan He", "Hongye Jin", "Linwei Li", "Shiyang Li", "Fenglin Liu", "Xin Liu", "Priyanka Nigam", "Haoyang Wen", "Zhenghao Xu", "Zhuocheng Xu", "Bing Yin", "Qingyu Yin", "Chao Zhang", "Rongzhi Zhang", "Zhihan Zhang", "Zixuan Zhang", "Zixuan Zhang", "Tuo Zhao"], "brief": "Rufus-Air \u63d0\u51fa\u4e86\u4e00\u5957\u57fa\u4e8e GLM-4.5-Air-Base \u7684\u5f00\u653e\u53ef\u590d\u73b0\u540e\u8bad\u7ec3\u6d41\u7a0b\uff0c\u4e32\u8054 SFT\u3001\u63a8\u7406/\u4ee3\u7801/\u6307\u4ee4 RL\u3001\u901a\u7528/\u4ee3\u7801/\u641c\u7d22\u667a\u80fd\u4f53\u8bad\u7ec3\u4e0e RLHF \u516b\u4e2a\u9636\u6bb5\u3002\u8bba\u6587\u7cfb\u7edf\u516c\u5f00\u6570\u636e\u3001\u5956\u52b1\u8bbe\u8ba1\u3001\u8bad\u7ec3\u57fa\u7840\u8bbe\u65bd\u3001\u9636\u6bb5\u987a\u5e8f\u4e0e\u9010\u9636\u6bb5\u7ed3\u679c\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29421", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u516c\u5f00\u6570\u636e\u548c\u5f00\u6e90\u7ec4\u4ef6\uff0c\u65e0\u65b0\u589e\u4eba\u5de5\u6807\u6ce8\uff0c\u4e5f\u4e0d\u4f9d\u8d56\u5185\u90e8\u84b8\u998f\u6559\u5e08\u6a21\u578b\u3002", "\u8bad\u7ec3\u9636\u6bb5\u4ece\u57fa\u7840\u80fd\u529b\u5230\u9ad8\u7ea7\u667a\u80fd\u4f53\u80fd\u529b\u63a8\u8fdb\uff0c\u5e76\u6309\u5956\u52b1\u53ef\u9760\u6027\u4ece\u53ef\u9a8c\u8bc1\u786c\u5956\u52b1\u9010\u6b65\u8fc7\u6e21\u5230\u88c1\u5224\u6a21\u578b\u8f6f\u4fe1\u53f7\u3002", "\u53d1\u73b0\u9ad8\u8d28\u91cf\u591a\u6837 SFT\u3001RL \u96be\u5ea6\u8fc7\u6ee4\u3001\u5956\u52b1\u53ef\u9760\u6027\u6392\u5e8f\u548c\u5de5\u7a0b\u57fa\u7840\u8bbe\u65bd\u90fd\u662f\u590d\u73b0\u5f3a\u6a21\u578b\u7684\u5173\u952e\u56e0\u7d20\u3002"], "keywords": ["\u540e\u8bad\u7ec3", "\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u5f00\u6e90\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29421v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Rufus-Air: An Open LLM Post-Training Recipe", "tldr": "\u5f00\u653e\u590d\u73b0GLM\u540e\u8bad\u7ec3\u516b\u9636\u6bb5\u914d\u65b9", "upvotes": 0, "what_it_is": "Rufus-Air \u63d0\u51fa\u4e86\u4e00\u5957\u57fa\u4e8e GLM-4.5-Air-Base \u7684\u5f00\u653e\u53ef\u590d\u73b0\u540e\u8bad\u7ec3\u6d41\u7a0b\uff0c\u4e32\u8054 SFT\u3001\u63a8\u7406/\u4ee3\u7801/\u6307\u4ee4 RL\u3001\u901a\u7528/\u4ee3\u7801/\u641c\u7d22\u667a\u80fd\u4f53\u8bad\u7ec3\u4e0e RLHF \u516b\u4e2a\u9636\u6bb5\u3002\u8bba\u6587\u7cfb\u7edf\u516c\u5f00\u6570\u636e\u3001\u5956\u52b1\u8bbe\u8ba1\u3001\u8bad\u7ec3\u57fa\u7840\u8bbe\u65bd\u3001\u9636\u6bb5\u987a\u5e8f\u4e0e\u9010\u9636\u6bb5\u7ed3\u679c\u3002", "why_notable": "\u5b83\u628a\u5927\u6a21\u578b\u540e\u8bad\u7ec3\u4ece\u7ecf\u9a8c\u6027\u9ed1\u7bb1\u62c6\u89e3\u4e3a\u53ef\u590d\u73b0\u914d\u65b9\uff0c\u5bf9\u5f00\u6e90\u793e\u533a\u590d\u523b\u5f3a\u63a8\u7406\u3001\u4ee3\u7801\u4e0e\u667a\u80fd\u4f53\u80fd\u529b\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\uff0c\u5e76\u62a5\u544a\u4f18\u4e8e\u5b98\u65b9 GLM-4.5-Air \u540e\u8bad\u7ec3\u7248\u672c\u3001\u63a5\u8fd1\u540c\u89c4\u6a21\u5f00\u6e90\u6a21\u578b\u7684\u6548\u679c\u3002"}, {"abstract": "We find that language models can transfer capabilities through task-unrelated text. Post-training typically improves language models using task-specific data. Prior work on subliminal learning shows that information about these updates can pass through unrelated generations, but has largely focused on traits or preferences using extensive teacher outputs. We introduce Active Taskless Distillation (ATD), which achieves capability transfer using only a single word from the teacher per prompt. ATD probes the behavioral shadow of post-training by selecting prompts where the teacher and student\u0027s shared public ancestor is nearly indifferent between two ordinary words. A student initialized from this ancestor learns solely from the resulting prompt-word pairs, without target-task examples, teacher logits, or teacher parameters. In the primary coding experiment with Qwen2.5-1.5B, 5,664nses yield a 5.34 pp gain on HumanEval+ over an exact nuisance-matched control thadisrupts prompt-resperiments showtransfer in scientific knowledge, commonsense reasoning, and reading comprehensins across additional model generations, sizes, and families. Functional analyses show that the learned sid composable, andthat its strength tracks the teacher\u0027s update strength.", "arxiv_id": "2609.29233", "arxiv_url": "https://arxiv.org/abs/2609.29233", "authors": ["Ziyang Zhang", "Yubin Jing", "Yuanhao Zeng", "Yuyao Li", "Haofan Wang", "Yichen Gong"], "brief": "\u8bba\u6587\u63d0\u51fa Active Taskless Distillation\uff08ATD\uff09\uff0c\u8bc1\u660e\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u83b7\u5f97\u7684\u80fd\u529b\u53ef\u901a\u8fc7\u4e0e\u4efb\u52a1\u65e0\u5173\u7684\u5355\u8bcd\u9009\u62e9\u4f20\u9012\u7ed9\u5b66\u751f\u6a21\u578b\u3002\u5b66\u751f\u4ec5\u5b66\u4e60\u6559\u5e08\u5728\u7279\u5b9a\u63d0\u793a\u4e0b\u8f93\u51fa\u7684\u4e00\u4e2a\u666e\u901a\u8bcd\uff0c\u65e0\u9700\u76ee\u6807\u4efb\u52a1\u6837\u672c\u3001logits \u6216\u6a21\u578b\u53c2\u6570\uff0c\u4e5f\u80fd\u83b7\u5f97\u80fd\u529b\u63d0\u5347\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29233", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["ATD \u9009\u62e9\u6559\u5e08\u4e0e\u5176\u516c\u5171\u7956\u5148\u6a21\u578b\u5728\u4e24\u4e2a\u666e\u901a\u8bcd\u4e4b\u95f4\u8fd1\u4e4e\u65e0\u5dee\u522b\u7684\u63d0\u793a\uff0c\u7528\u6559\u5e08\u7684\u5355\u8bcd\u9009\u62e9\u4f5c\u4e3a\u201c\u884c\u4e3a\u9634\u5f71\u201d\u4fe1\u53f7\u3002", "\u5728 Qwen2.5-1.5B \u7f16\u7801\u5b9e\u9a8c\u4e2d\uff0c\u7ea6 5,664 \u4e2a\u63d0\u793a-\u8bcd\u5bf9\u4f7f HumanEval+ \u63d0\u534
