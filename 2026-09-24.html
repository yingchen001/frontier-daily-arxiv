7 5.34 \u4e2a\u767e\u5206\u70b9\uff0c\u4f18\u4e8e\u4e25\u683c\u5339\u914d\u7684\u5e72\u6270\u5bf9\u7167\u3002", "\u80fd\u529b\u8fc1\u79fb\u4e0d\u4ec5\u51fa\u73b0\u5728\u4ee3\u7801\u4efb\u52a1\uff0c\u4e5f\u51fa\u73b0\u5728\u79d1\u5b66\u77e5\u8bc6\u3001\u5e38\u8bc6\u63a8\u7406\u548c\u9605\u8bfb\u7406\u89e3\u4e2d\uff0c\u5e76\u8de8\u6a21\u578b\u4ee3\u9645\u3001\u89c4\u6a21\u548c\u5bb6\u65cf\u6210\u7acb\u3002"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u540e\u8bad\u7ec3", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29233v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Post-Training Leaves Behavioral Shadows on Unrelated Decisions", "tldr": "\u540e\u8bad\u7ec3\u80fd\u529b\u4f1a\u6f5c\u85cf\u4e8e\u65e0\u5173\u8bcd\u9009\u62e9\u4e2d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Active Taskless Distillation\uff08ATD\uff09\uff0c\u8bc1\u660e\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u83b7\u5f97\u7684\u80fd\u529b\u53ef\u901a\u8fc7\u4e0e\u4efb\u52a1\u65e0\u5173\u7684\u5355\u8bcd\u9009\u62e9\u4f20\u9012\u7ed9\u5b66\u751f\u6a21\u578b\u3002\u5b66\u751f\u4ec5\u5b66\u4e60\u6559\u5e08\u5728\u7279\u5b9a\u63d0\u793a\u4e0b\u8f93\u51fa\u7684\u4e00\u4e2a\u666e\u901a\u8bcd\uff0c\u65e0\u9700\u76ee\u6807\u4efb\u52a1\u6837\u672c\u3001logits \u6216\u6a21\u578b\u53c2\u6570\uff0c\u4e5f\u80fd\u83b7\u5f97\u80fd\u529b\u63d0\u5347\u3002", "why_notable": "\u8fd9\u8868\u660e\u540e\u8bad\u7ec3\u4f1a\u5728\u770b\u4f3c\u65e0\u5173\u7684\u751f\u6210\u884c\u4e3a\u4e2d\u7559\u4e0b\u53ef\u5b66\u4e60\u4fe1\u53f7\uff0c\u6269\u5c55\u4e86\u5bf9\u84b8\u998f\u3001\u6a21\u578b\u53ef\u89e3\u91ca\u6027\u4e0e\u5b89\u5168\u9690\u79c1\u98ce\u9669\u7684\u7406\u89e3\uff1a\u5373\u4f7f\u4e0d\u66b4\u9732\u4efb\u52a1\u6570\u636e\u6216 logits\uff0c\u80fd\u529b\u4fe1\u606f\u4ecd\u53ef\u80fd\u88ab\u9690\u853d\u4f20\u9012\u3002"}, {"abstract": "3D foundation models recover video cameras and geometry in one forward pass, but some of the strongest are up to scale. Joint people-scene reconstruction then requires two missing outputs: metric scale and persistent person identity. We ask whether one up-to-scale foundation representation can support both through lightweight adaptation. Exact metric labels are scarce, but unlabeled in-the-wild video is abundant. We use people in curated web video to initialise the solution: a posed metric body and 2D keypoints give an approximate, closed-form scale pseudo-label. These pseudo-labels pretrain a Scale Readout, which is then fine-tuned together with a lightweight adapter using exact metric supervision from standard real-video training splits. At inference the head predicts metric scale from foundation-model tokens, without the ruler or its teachers. For person identity, we probe the pretrained foundation model alone and find evidence that its intermediate query-key features encode person correspondence across frames. In most evaluated moving-person clips, a mid-layer token prefers that person over the vacated location and other people. A tiny projection reads this correspondence; together with metric pelvis motion and proposal confidence, it drives dustbin-aware Sinkhorn association of per-frame bodies. WildHSR combines both readouts to reconstruct metric cameras, scene and people from monocular video. Each window is predicted feed-forward; analytic association and Sim(3) composition connect windows. On EMDB-2, WildHSR is the first feed-forward method in the published comparison to beat the best optimization-based WA-MPJPE and RTE while leading feed-forward methods on all three world-frame metrics. On RICH, it leads feed-forward people-and-scene methods on WA-MPJPE and W-MPJPE. The complete pipeline runs at 10.1 fps on one GPU.", "arxiv_id": "2609.29106", "arxiv_url": "https://arxiv.org/abs/2609.29106", "authors": ["Jerrin Bright", "John Zelek"], "brief": "WildHSR\u57fa\u4e8e\u73b0\u67093D foundation model\uff0c\u901a\u8fc7\u8f7b\u91cf\u9002\u914d\u8865\u9f50\u516c\u5236\u5c3a\u5ea6\u4e0e\u8de8\u5e27\u4eba\u7269\u8eab\u4efd\uff0c\u5b9e\u73b0\u5355\u76ee\u89c6\u9891\u4e2d\u7684\u516c\u5236\u76f8\u673a\u3001\u573a\u666f\u548c\u4eba\u4f534D\u91cd\u5efa\u3002\u65b9\u6cd5\u6309\u7a97\u53e3\u524d\u9988\u9884\u6d4b\uff0c\u518d\u7528\u89e3\u6790\u5173\u8054\u4e0eSim(3)\u7ec4\u5408\u8fde\u63a5\u957f\u89c6\u9891\u3002", "categories": ["cs.CV", "cs.AI", "cs.CG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29106", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528\u7f51\u7edc\u89c6\u9891\u4e2d\u7684\u4eba\u4f53\u59ff\u6001\u30012D\u5173\u952e\u70b9\u548c\u516c\u5236\u4eba\u4f53\u6a21\u578b\u6784\u9020\u8fd1\u4f3c\u5c3a\u5ea6\u4f2a\u6807\u7b7e\uff0c\u9884\u8bad\u7ec3Scale Readout\uff0c\u518d\u7528\u771f\u5b9e\u89c6\u9891\u516c\u5236\u76d1\u7763\u5fae\u8c03\u3002", "\u53d1\u73b03D\u57fa\u7840\u6a21\u578b\u4e2d\u95f4\u5c42query-key\u7279\u5f81\u5df2\u7f16\u7801\u4eba\u7269\u8de8\u5e27\u5bf9\u5e94\u5173\u7cfb\uff0c\u5e76\u7528\u5c0f\u6295\u5f71\u5934\u8bfb\u53d6\u8eab\u4efd\u7ebf\u7d22\u3002", "\u7ed3\u5408\u4eba\u7269\u5bf9\u5e94\u3001\u9aa8\u76c6\u516c\u5236\u8fd0\u52a8\u548c\u68c0\u6d4b\u7f6e\u4fe1\u5ea6\uff0c\u901a\u8fc7\u5e26dustbin\u7684Sinkhorn\u8fdb\u884c\u9010\u5e27\u4eba\u4f53\u5173\u8054\uff0c\u5355GPU\u8fbe\u523010.1 fps\u3002"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u4eba\u4f53\u91cd\u5efa", "\u57fa\u7840\u6a21\u578b", "\u89c6\u9891\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29106v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WildHSR: Metric Feed-Forward 4D People-Scene Reconstruction from a 3D Foundation Model", "tldr": "\u4ece\u5355\u76ee\u89c6\u9891\u524d\u9988\u91cd\u5efa\u516c\u52364D\u4eba\u666f", "upvotes": 0, "what_it_is": "WildHSR\u57fa\u4e8e\u73b0\u67093D foundation model\uff0c\u901a\u8fc7\u8f7b\u91cf\u9002\u914d\u8865\u9f50\u516c\u5236\u5c3a\u5ea6\u4e0e\u8de8\u5e27\u4eba\u7269\u8eab\u4efd\uff0c\u5b9e\u73b0\u5355\u76ee\u89c6\u9891\u4e2d\u7684\u516c\u5236\u76f8\u673a\u3001\u573a\u666f\u548c\u4eba\u4f534D\u91cd\u5efa\u3002\u65b9\u6cd5\u6309\u7a97\u53e3\u524d\u9988\u9884\u6d4b\uff0c\u518d\u7528\u89e3\u6790\u5173\u8054\u4e0eSim(3)\u7ec4\u5408\u8fde\u63a5\u957f\u89c6\u9891\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u65e0\u9700\u91cd\u578b\u4f18\u5316\u5373\u53ef\u5229\u75283D\u57fa\u7840\u6a21\u578b\u5b8c\u6210\u5b9e\u7528\u7684\u516c\u5236\u4eba\u666f\u8054\u5408\u91cd\u5efa\uff0c\u5728EMDB-2\u4e0a\u9996\u6b21\u8ba9\u524d\u9988\u65b9\u6cd5\u8d85\u8fc7\u6700\u4f73\u4f18\u5316\u5f0fWA-MPJPE\u548cRTE\uff0c\u5e76\u5728\u591a\u9879\u4e16\u754c\u5750\u6807\u6307\u6807\u4e0a\u9886\u5148\u3002"}, {"abstract": "Vision-based legged locomotion methods assume clean depth at training time and rely on hand-tuned post-processing filters at deployment. However, filter parameters are rarely disclosed, hindering reproducibility, and performance degrades substantially when depth noise is left unaddressed. Building noise robustness directly into the learning pipeline would eliminate this dependency. While such robustness has been explored for proprioceptive inputs, analogous approaches for depth perception remain largely absent in legged locomotion. We propose DAWN (Denoising and Alignment in World models for Noise-robustness), a noise-robust perception framework for legged locomotion, which builds noise robustness directly into a world model via two modifications: (1) feeding noisy depth to the encoder while keeping clean depth as the reconstruction target, forcing the model to implicitly denoise its input; and (2) applying contrastive learning to align the latent states of noisy and clean depth. Importantly, DAWN is not tied to a specific noise model, requiring no manual tuning to the noise distribution at deployment. Furthermore, it incurs no additional inference cost over existing world model-based methods. Without any manual filter calibration -- relying solely on the learned noise-robust representation -- DAWN achieves zero-shot quadruped parkour on a Unitree Go1: traversing stairs up to 18 cm, clearing gaps up to 70 cm, and mounting steps up to 45 cm from raw depth observations. Ablation studies show that denoising and contrastive alignment contribute at complementary levels -- reconstruction and representation, respectively -- and yield additive gains when combined. Videos and code are available at: https://dawn-parkour.github.io/", "arxiv_id": "2609.29092", "arxiv_url": "https://arxiv.org/abs/2609.29092", "authors": ["Yohan Choi", "Min-Jun Kim", "Jin-Sung Kim", "Yong-Jae Kim", "Youn-Hee Han"], "brief": "\u672c\u6587\u63d0\u51fa DAWN\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u56db\u8db3\u8fd0\u52a8\u7684\u6297\u566a\u6df1\u5ea6\u611f\u77e5\u6846\u67b6\u3002\u5b83\u5728\u4e16\u754c\u6a21\u578b\u4e2d\u540c\u65f6\u5b66\u4e60\u6df1\u5ea6\u53bb\u566a\u91cd\u5efa\u4e0e\u5e72\u51c0/\u5e26\u566a\u8868\u5f81\u5bf9\u9f50\uff0c\u4f7f\u673a\u5668\u4eba\u65e0\u9700\u624b\u5de5\u8c03\u6ee4\u6ce2\u5668\u5373\u53ef\u4ece\u539f\u59cb\u6df1\u5ea6\u89c2\u6d4b\u5b8c\u6210\u8dd1\u9177\u4efb\u52a1\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29092", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bad\u7ec3\u65f6\u5c06\u5e26\u566a\u6df1\u5ea6\u8f93\u5165\u7f16\u7801\u5668\u3001\u4ee5\u5e72\u51c0\u6df1\u5ea6\u4e3a\u91cd\u5efa\u76ee\u6807\uff0c\u8feb\u4f7f\u4e16\u754c\u6a21\u578b\u9690\u5f0f\u5b66\u4e60\u6df1\u5ea6\u53bb\u566a\u3002", "\u5f15\u5165\u5bf9\u6bd4\u5b66\u4e60\u5bf9\u9f50\u5e72\u51c0\u6df1\u5ea6\u4e0e\u5e26\u566a\u6df1\u5ea6\u7684\u6f5c\u5728\u72b6\u6001\uff0c\u63d0\u5347\u8868\u5f81\u5c42\u9762\u7684\u566a\u58f0\u9c81\u68d2\u6027\u3002", "\u5728 Unitree Go1 \u4e0a\u96f6\u6837\u672c\u5b8c\u6210\u697c\u68af\u6700\u9ad818\u5398\u7c73\u3001\u8de8\u8d8a70\u5398\u7c73\u95f4\u9699\u3001\u6500\u4e0a45\u5398\u7c73\u53f0\u9636\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u89c6\u89c9\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29092v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DAWN: Noise-Robust Quadruped Parkour via Depth-Denoising World Models", "tldr": "\u8ba9\u56db\u8db3\u673a\u5668\u4eba\u7528\u5e26\u566a\u6df1\u5ea6\u56fe\u96f6\u6837\u672c\u8dd1\u9177", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa DAWN\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u56db\u8db3\u8fd0\u52a8\u7684\u6297\u566a\u6df1\u5ea6\u611f\u77e5\u6846\u67b6\u3002\u5b83\u5728\u4e16\u754c\u6a21\u578b\u4e2d\u540c\u65f6\u5b66\u4e60\u6df1\u5ea6\u53bb\u566a\u91cd\u5efa\u4e0e\u5e72\u51c0/\u5e26\u566a\u8868\u5f81\u5bf9\u9f50\uff0c\u4f7f\u673a\u5668\u4eba\u65e0\u9700\u624b\u5de5\u8c03\u6ee4\u6ce2\u5668\u5373\u53ef\u4ece\u539f\u59cb\u6df1\u5ea6\u89c2\u6d4b\u5b8c\u6210\u8dd1\u9177\u4efb\u52a1\u3002", "why_notable": "\u4ee5\u5b66\u4e60\u5f0f\u6297\u566a\u8868\u5f81\u66ff\u4ee3\u90e8\u7f72\u65f6\u4f9d\u8d56\u624b\u5de5\u6df1\u5ea6\u6ee4\u6ce2\u8c03\u53c2\u7684\u505a\u6cd5\uff0c\u63d0\u5347\u4e86\u89c6\u89c9\u817f\u8db3\u8fd0\u52a8\u7684\u53ef\u590d\u73b0\u6027\u4e0e\u73b0\u5b9e\u90e8\u7f72\u9c81\u68d2\u6027\uff1b\u540c\u65f6\u4e0d\u4f9d\u8d56\u7279\u5b9a\u566a\u58f0\u6a21\u578b\uff0c\u5b9e\u7528\u4ef7\u503c\u8f83\u9ad8\u3002"}, {"abstract": "Tool-calling agents produce heterogeneous outputs, interleaving structured tool invocations with user-facing natural language summaries. This output heterogeneity presents a structural failure mode in standard on-policy Reinforcement Learning (RL): algorithms like GRPO indiscriminately broadcast a homogeneous trajectory-level scalar advantage to all tokens. Consequently, gradient noise from summary generation leaks into tool-decision tokens, causing cross-segment credit misattribution and brittle optimization. In this work, we propose SLCA-GRPO, a framework incorporating Segment-Locked Credit Assignment (SLCA). To enable scalable exploration without costly real APIs and stable training, we first construct the Schema-Guided LLM Simulator (SGLS) as foundational training infrastructure. Building on this, SLCA decouples advantage estimation at the structural segment level within a single group of rollouts, without requiring additional rollouts from intermediate states. Supported by Hierarchical Rewards (HierR), SLCA routes execution advantages to tool tokens and preference advantages to summary tokens, eliminating advantage contamination (the dominant cross-segment credit misattribution channel) within each policy update. On a 7B backbone, SLCA-GRPO accelerates convergence and outperforms standard GRPO, ToolPO, and RLTR by +2.53 pp on in-domain evaluation, +1.36 pp on the Berkeley Function-Calling Leaderboard (BFCL), and +9.15 pp on $\u03c4^2$-Bench under the same training budgets, achieving higher accuracy with reduced tool redundancy and costs.", "arxiv_id": "2609.29050", "arxiv_url": "https://arxiv.org/abs/2609.29050", "authors": ["Yan Zhan", "Shaobo Liu", "Qiunan Liu", "Yuanjun Shi", "Siqi Xu", "WeiYi Hou", "Xiang Xu", "Zekang Li", "Weizhou Pan", "Jiahong Yan"], "brief": "\u8bba\u6587\u63d0\u51fa SLCA-GRPO\uff0c\u7528\u4e8e\u89e3\u51b3\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u4e2d\u5de5\u5177\u8c03\u7528\u6bb5\u4e0e\u81ea\u7136\u8bed\u8a00\u603b\u7ed3\u6bb5\u6df7\u5408\u8f93\u51fa\u5bfc\u81f4\u7684\u4fe1\u7528\u8bef\u5206\u914d\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u5206\u6bb5\u9501\u5b9a\u4fe1\u7528\u5206\u914d\u548c\u5206\u5c42\u5956\u52b1\uff0c\u5c06\u6267\u884c\u4f18\u52bf\u5206\u914d\u7ed9\u5de5\u5177 token\u3001\u504f\u597d\u4f18\u52bf\u5206\u914d\u7ed9\u603b\u7ed3 token\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29050", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u6807\u51c6 GRPO \u5c06\u540c\u4e00\u4e2a\u8f68\u8ff9\u7ea7\u4f18\u52bf\u5e7f\u64ad\u5230\u6240\u6709 token\uff0c\u4f1a\u8ba9\u603b\u7ed3\u751f\u6210\u566a\u58f0\u6c61\u67d3\u5de5\u5177\u51b3\u7b56 token\uff0c\u9020\u6210\u8de8\u6bb5\u4fe1\u7528\u8bef\u5206\u914d\u3002", "\u6784\u5efa Schema-Guided LLM Simulator\uff08SGLS\uff09\uff0c\u5728\u65e0\u9700\u771f\u5b9e API \u7684\u60c5\u51b5\u4e0b\u652f\u6301\u53ef\u6269\u5c55\u63a2\u7d22\u548c\u7a33\u5b9a\u8bad\u7ec3\u3002", "\u5728 7B \u6a21\u578b\u4e0a\uff0c\u76f8\u6bd4 GRPO\u3001ToolPO\u3001RLTR\uff0c\u5728\u57df\u5185\u8bc4\u6d4b\u3001BFCL \u548c \u03c4\u00b2-Bench \u5206\u522b\u63d0\u5347 +2.53\u3001+1.36\u3001+9.15 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u964d\u4f4e\u5de5\u5177\u5197\u4f59\u4e0e\u8c03\u7528\u6210\u672c\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29050v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SLCA-GRPO: Resolving Cross-Segment Credit Misattribution in Tool-Calling RL", "tldr": "\u5206\u6bb5\u4fe1\u7528\u5206\u914d\u63d0\u5347\u5de5\u5177\u8c03\u7528RL\u8bad\u7ec3\u7a33\u5b9a\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SLCA-GRPO\uff0c\u7528\u4e8e\u89e3\u51b3\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u4e2d\u5de5\u5177\u8c03\u7528\u6bb5\u4e0e\u81ea\u7136\u8bed\u8a00\u603b\u7ed3\u6bb5\u6df7\u5408\u8f93\u51fa\u5bfc\u81f4\u7684\u4fe1\u7528\u8bef\u5206\u914d\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u5206\u6bb5\u9501\u5b9a\u4fe1\u7528\u5206\u914d\u548c\u5206\u5c42\u5956\u52b1\uff0c\u5c06\u6267\u884c\u4f18\u52bf\u5206\u914d\u7ed9\u5de5\u5177 token\u3001\u504f\u597d\u4f18\u52bf\u5206\u914d\u7ed9\u603b\u7ed3 token\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53 RL \u8bad\u7ec3\u4e2d\u7684\u7ed3\u6784\u6027\u75db\u70b9\u63d0\u51fa\u7ec6\u7c92\u5ea6\u4fe1\u7528\u5206\u914d\u673a\u5236\uff0c\u5728\u4e0d\u589e\u52a0\u4e2d\u95f4\u72b6\u6001\u989d\u5916\u91c7\u6837\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u6536\u655b\u901f\u5ea6\u3001\u51c6\u786e\u7387\u548c\u5de5\u5177\u4f7f\u7528\u6548\u7387\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Open-weight LLMs give downstream users control over the inference stack, but this flexibility can undermine post-release guarantees that sensitive knowledge has been modified or removed. Model editing and machine unlearning are used to modify or remove targeted knowledge without retraining models from scratch. However, existing security evaluations of these techniques face two critical limitations. First, they typically require access to either the original pre-edit/unlearning model or auxiliary classifiers to detect modifications or reconstruct pre-edit behavior. Second, they evaluate modifications under the canonical tokenization of an input, implicitly treating tokenization as a benign preprocessing step. We show that this assumption creates a security gap: the same input string can be represented by alternative valid tokenizations that induce different computational trajectories, allowing an adversary to bypass localized modifications and recover information intended to be suppressed. We introduce Toketive, a simple yet powerful reference-free attack that exploits the tokenization-based side channel to (i) detect modified knowledge and (ii) reconstruct the corresponding pre-edit response. It operates solely on the released model and requires neither the pre-edit model, training data, shadow models, nor auxiliary classifiers. Across five LLMs, six datasets, and six editing and unlearning techniques, we find that 38.6% of alternative tokenizations bypass the modification and recover the pre-edit response. Toketive detects modified facts with an F1 score of 84.2%, a 26.2% relative gain over the strongest baseline, and reconstructs pre-edit responses with 74.5% top-5 accuracy, 21.7% higher than the best baseline. Our results show that localized modifications should not be treated as robust knowledge-control boundaries without adversarial evaluation over alternative representations.", "arxiv_id": "2609.29045", "arxiv_url": "https://arxiv.org/abs/2609.29045", "authors": ["Manit Baser", "Aditya Nawal", "Dinil Mon Divakaran", "Mohan Gurusamy"], "brief": "\u8bba\u6587\u63ed\u793a\u5f00\u653e\u6743\u91cdLLM\u4e2d\uff0c\u6a21\u578b\u7f16\u8f91\u4e0e\u673a\u5668\u9057\u5fd8\u53ef\u80fd\u88ab\u975e\u6807\u51c6\u4f46\u5408\u6cd5\u7684\u5206\u8bcd\u8868\u793a\u7ed5\u8fc7\u3002\u4f5c\u8005\u63d0\u51faToketive\uff0c\u4e00\u79cd\u65e0\u9700\u539f\u6a21\u578b\u3001\u8bad\u7ec3\u6570\u636e\u6216\u8f85\u52a9\u5206\u7c7b\u5668\u7684\u653b\u51fb\uff0c\u53ef\u68c0\u6d4b\u88ab\u4fee\u6539\u77e5\u8bc6\u5e76\u91cd\u6784\u7f16\u8f91\u524d\u56de\u7b54\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29045", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u540c\u4e00\u8f93\u5165\u5b57\u7b26\u4e32\u53ef\u5bf9\u5e94\u591a\u79cd\u6709\u6548tokenization\uff0c\u4e0d\u540c\u5206\u8bcd\u4f1a\u89e6\u53d1\u4e0d\u540c\u8ba1\u7b97\u8def\u5f84\uff0c\u4ece\u800c\u7ed5\u8fc7\u5c40\u90e8\u77e5\u8bc6\u4fee\u6539\u3002", "Toketive\u4ec5\u4f9d\u8d56\u53d1\u5e03\u540e\u7684\u6a21\u578b\uff0c\u5229\u7528\u5206\u8bcd\u4fa7\u4fe1\u9053\u68c0\u6d4b\u77e5\u8bc6\u662f\u5426\u88ab\u7f16\u8f91\uff0c\u5e76\u6062\u590d\u539f\u59cb\u54cd\u5e94\u3002", "\u57285\u4e2aLLM\u30016\u4e2a\u6570\u636e\u96c6\u30016\u79cd\u7f16\u8f91/\u9057\u5fd8\u65b9\u6cd5\u4e0a\uff0c38.6%\u7684\u66ff\u4ee3\u5206\u8bcd\u53ef\u7ed5\u8fc7\u4fee\u6539\uff1b\u68c0\u6d4bF1\u8fbe84.2%\uff0c\u91cd\u6784\u7f16\u8f91\u524d\u56de\u7b54top-5\u51c6\u786e\u7387\u8fbe74.5%\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u673a\u5668\u9057\u5fd8", "\u77e5\u8bc6\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29045v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The Tokens Remember: When Tokenization Bypasses Knowledge Editing and Unlearning", "tldr": "\u66ff\u4ee3\u5206\u8bcd\u53ef\u7ed5\u8fc7LLM\u77e5\u8bc6\u7f16\u8f91\u4e0e\u9057\u5fd8", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63ed\u793a\u5f00\u653e\u6743\u91cdLLM\u4e2d\uff0c\u6a21\u578b\u7f16\u8f91\u4e0e\u673a\u5668\u9057\u5fd8\u53ef\u80fd\u88ab\u975e\u6807\u51c6\u4f46\u5408\u6cd5\u7684\u5206\u8bcd\u8868\u793a\u7ed5\u8fc7\u3002\u4f5c\u8005\u63d0\u51faToketive\uff0c\u4e00\u79cd\u65e0\u9700\u539f\u6a21\u578b\u3001\u8bad\u7ec3\u6570\u636e\u6216\u8f85\u52a9\u5206\u7c7b\u5668\u7684\u653b\u51fb\uff0c\u53ef\u68c0\u6d4b\u88ab\u4fee\u6539\u77e5\u8bc6\u5e76\u91cd\u6784\u7f16\u8f91\u524d\u56de\u7b54\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f53\u524d\u77e5\u8bc6\u7f16\u8f91\u4e0e\u673a\u5668\u9057\u5fd8\u8bc4\u4f30\u5ffd\u89c6\u4e86\u5206\u8bcd\u8868\u793a\u7a7a\u95f4\uff0c\u6311\u6218\u4e86\u201c\u540e\u53d1\u5e03\u77e5\u8bc6\u63a7\u5236\u201d\u7684\u53ef\u9760\u6027\uff0c\u5bf9\u5f00\u653e\u6743\u91cd\u6a21\u578b\u7684\u9690\u79c1\u3001\u5b89\u5168\u4e0e\u5408\u89c4\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "Synthetic data can scale training supervision when real-world data are limited, but noise and distribution mismatch can reduce its value. Existing synthetic data selection methods often emphasize fidelity or diversity rather than the learner\u0027s evolving needs. We propose FROST, an online framework that estimates synthetic-data utility through gradient feedback anchored in real training data. It calibrates batch utility against recent history to determine when filtering is needed and filters samples only in out-of-band batches to determine what to retain, without an external verifier or held-out validation set. Experiments on two public benchmarks for image classification and LLM fine-tuning for text-to-SQL show that FROST filters out around 20--30% of the synthetic data while improving real-task performance compared with training on the full synthetic data pool. We further apply FROST during training in a large-scale industrial ads re-ranking system, achieving significant performance gains over a highly optimized production baseline, demonstrating its effectiveness and generalizability.", "arxiv_id": "2609.29988", "arxiv_url": "https://arxiv.org/abs/2609.29988", "authors": ["Yanran Wu", "Sana Lakdawala", "Renzo Tassara Miller", "Chongyang Bai", "Sharath Ciddu", "Shivendra Pratap Singh", "Kungang Li", "Sandeep Pandey", "Chunwei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa FROST\uff0c\u4e00\u4e2a\u65e0\u9700\u5916\u90e8\u9a8c\u8bc1\u5668\u6216\u9a8c\u8bc1\u96c6\u7684\u5728\u7ebf\u5408\u6210\u6570\u636e\u8fc7\u6ee4\u6846\u67b6\u3002\u5b83\u5229\u7528\u771f\u5b9e\u8bad\u7ec3\u6570\u636e\u951a\u5b9a\u7684\u68af\u5ea6\u53cd\u9988\u4f30\u8ba1\u5408\u6210\u6837\u672c\u6548\u7528\uff0c\u5e76\u6839\u636e\u8bad\u7ec3\u8fc7\u7a0b\u52a8\u6001\u51b3\u5b9a\u4f55\u65f6\u8fc7\u6ee4\u3001\u4fdd\u7559\u54ea\u4e9b\u6837\u672c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29988", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u771f\u5b9e\u6570\u636e\u4e0a\u7684\u68af\u5ea6\u4fe1\u53f7\u8bc4\u4f30\u5408\u6210\u6570\u636e\u5bf9\u5f53\u524d\u5b66\u4e60\u5668\u7684\u5b9e\u9645\u5e2e\u52a9\uff0c\u800c\u975e\u4ec5\u770b\u4fdd\u771f\u5ea6\u6216\u591a\u6837\u6027\u3002", "\u5728\u56fe\u50cf\u5206\u7c7b\u548c text-to-SQL \u7684 LLM \u5fae\u8c03\u57fa\u51c6\u4e0a\uff0c\u8fc7\u6ee4\u7ea6 20%\u201330% \u5408\u6210\u6570\u636e\u540e\u4ecd\u63d0\u5347\u771f\u5b9e\u4efb\u52a1\u6027\u80fd\u3002", "\u5df2\u5728\u5927\u89c4\u6a21\u5de5\u4e1a\u5e7f\u544a\u91cd\u6392\u5e8f\u7cfb\u7edf\u4e2d\u5728\u7ebf\u5e94\u7528\uff0c\u76f8\u6bd4\u9ad8\u5ea6\u4f18\u5316\u7684\u751f\u4ea7\u57fa\u7ebf\u53d6\u5f97\u663e\u8457\u6536\u76ca\u3002"], "keywords": ["\u5408\u6210\u6570\u636e", "\u6570\u636e\u7b5b\u9009", "\u6a21\u578b\u8bad\u7ec3", "\u68af\u5ea6\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29988v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Let Training Guide Selection: Online Synthetic Data Filtering via Real-Anchored Utility", "tldr": "\u7528\u771f\u5b9e\u6570\u636e\u68af\u5ea6\u5728\u7ebf\u7b5b\u9009\u5408\u6210\u6570\u636e\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FROST\uff0c\u4e00\u4e2a\u65e0\u9700\u5916\u90e8\u9a8c\u8bc1\u5668\u6216\u9a8c\u8bc1\u96c6\u7684\u5728\u7ebf\u5408\u6210\u6570\u636e\u8fc7\u6ee4\u6846\u67b6\u3002\u5b83\u5229\u7528\u771f\u5b9e\u8bad\u7ec3\u6570\u636e\u951a\u5b9a\u7684\u68af\u5ea6\u53cd\u9988\u4f30\u8ba1\u5408\u6210\u6837\u672c\u6548\u7528\uff0c\u5e76\u6839\u636e\u8bad\u7ec3\u8fc7\u7a0b\u52a8\u6001\u51b3\u5b9a\u4f55\u65f6\u8fc7\u6ee4\u3001\u4fdd\u7559\u54ea\u4e9b\u6837\u672c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u5408\u6210\u6570\u636e\u9009\u62e9\u4ece\u9759\u6001\u8d28\u91cf\u8bc4\u4f30\u8f6c\u5411\u8bad\u7ec3\u8fc7\u7a0b\u4e2d\u7684\u52a8\u6001\u6548\u7528\u4f30\u8ba1\uff0c\u964d\u4f4e\u5bf9\u4eba\u5de5\u9a8c\u8bc1\u5668\u548c\u9a8c\u8bc1\u96c6\u7684\u4f9d\u8d56\uff0c\u517c\u5177\u901a\u7528\u6027\u4e0e\u5de5\u4e1a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Fine-tuning large language models on new objectives can improve helpfulness, instruction following, or domain-specific performance, but it can also induce regressions on safety-critical prompts. Existing safety-preserving fine-tuning methods typically control average safety loss or use weighted auxiliary penalties, which can obscure rare but severe failures. We propose a chance-constrained formulation for safety-preserving fine-tuning that limits the fraction of safety examples whose degradation relative to a reference model exceeds a prescribed threshold. Because the resulting empirical chance constraint contains a discontinuous indicator, we introduce a differentiable majorization of the violation rate, yielding a tractable conservative constraint. We then develop a constraint-aware gradient descent method that treats the majorized constraint as a safe set in parameter space and minimally modifies the fine-tuning direction to preserve feasibility. The resulting update admits a closed form and produces a tail-aware safety correction that emphasizes examples near or above the degradation threshold. We conduct an extensive set of experiments on harmful fine-tuning across three different tasks and three models and show that our approach consistently outperforms the baselines that exist in the literature. These results suggest that safety preservation in LLM fine-tuning is better viewed as a reliability-constrained optimization problem than as average-risk regularization.", "arxiv_id": "2609.29960", "arxiv_url": "https://arxiv.org/abs/2609.29960", "authors": ["Taha Entesari", "Mahyar Fazlyab"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168\u4fdd\u6301\u5fae\u8c03\u7684\u673a\u4f1a\u7ea6\u675f\u6846\u67b6\uff0c\u9650\u5236\u76f8\u5bf9\u53c2\u8003\u6a21\u578b\u51fa\u73b0\u663e\u8457\u5b89\u5168\u9000\u5316\u7684\u6837\u672c\u6bd4\u4f8b\u3002\u4e3a\u5904\u7406\u4e0d\u53ef\u5bfc\u7684\u8fdd\u89c4\u7387\u6307\u6807\uff0c\u4f5c\u8005\u5f15\u5165\u53ef\u5fae\u4e0a\u754c\u5e76\u8bbe\u8ba1\u7ea6\u675f\u611f\u77e5\u68af\u5ea6\u4e0b\u964d\uff0c\u5728\u5c3d\u91cf\u4fdd\u7559\u4efb\u52a1\u5fae\u8c03\u65b9\u5411\u7684\u540c\u65f6\u7ef4\u6301\u5b89\u5168\u53ef\u884c\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29960", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5b89\u5168\u5fae\u8c03\u4ece\u5e73\u5747\u98ce\u9669\u6b63\u5219\u5316\u6539\u5199\u4e3a\u53ef\u9760\u6027\u7ea6\u675f\u4f18\u5316\uff0c\u5173\u6ce8\u5c11\u6570\u4f46\u4e25\u91cd\u7684\u5b89\u5168\u5931\u8d25", "\u7528\u53ef\u5fae\u7684\u8fdd\u89c4\u7387\u4e0a\u754c\u66ff\u4ee3\u4e0d\u8fde\u7eed\u6307\u793a\u51fd\u6570\uff0c\u5f97\u5230\u53ef\u8bad\u7ec3\u7684\u4fdd\u5b88\u673a\u4f1a\u7ea6\u675f", "\u63d0\u51fa\u95ed\u5f0f\u5f62\u5f0f\u7684\u5b89\u5168\u4fee\u6b63\u68af\u5ea6\uff0c\u5bf9\u63a5\u8fd1\u6216\u8d85\u8fc7\u9000\u5316\u9608\u503c\u7684\u6837\u672c\u65bd\u52a0\u66f4\u5f3a\u7ea6\u675f"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5bf9\u9f50", "\u5fae\u8c03", "\u7ea6\u675f\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29960v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Average Safety: Chance-Constrained LLM Fine-tuning", "tldr": "\u7528\u673a\u4f1a\u7ea6\u675f\u6291\u5236\u5fae\u8c03\u4e2d\u7684\u5c3e\u90e8\u5b89\u5168\u9000\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168\u4fdd\u6301\u5fae\u8c03\u7684\u673a\u4f1a\u7ea6\u675f\u6846\u67b6\uff0c\u9650\u5236\u76f8\u5bf9\u53c2\u8003\u6a21\u578b\u51fa\u73b0\u663e\u8457\u5b89\u5168\u9000\u5316\u7684\u6837\u672c\u6bd4\u4f8b\u3002\u4e3a\u5904\u7406\u4e0d\u53ef\u5bfc\u7684\u8fdd\u89c4\u7387\u6307\u6807\uff0c\u4f5c\u8005\u5f15\u5165\u53ef\u5fae\u4e0a\u754c\u5e76\u8bbe\u8ba1\u7ea6\u675f\u611f\u77e5\u68af\u5ea6\u4e0b\u964d\uff0c\u5728\u5c3d\u91cf\u4fdd\u7559\u4efb\u52a1\u5fae\u8c03\u65b9\u5411\u7684\u540c\u65f6\u7ef4\u6301\u5b89\u5168\u53ef\u884c\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u76f4\u63a5\u9488\u5bf9 LLM \u5fae\u8c03\u4e2d\u5e38\u88ab\u5e73\u5747\u6307\u6807\u63a9\u76d6\u7684\u5c3e\u90e8\u5b89\u5168\u98ce\u9669\uff0c\u5728\u4e09\u7c7b\u6709\u5bb3\u5fae\u8c03\u4efb\u52a1\u548c\u4e09\u79cd\u6a21\u578b\u4e0a\u4f18\u4e8e\u73b0\u6709\u5b89\u5168\u4fdd\u6301\u57fa\u7ebf\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Flow-matching Vision-Language-Action (VLA) models have emerged as a potential solution for generalist robot control, designed by combining a pretrained Vision-Language Model (VLM) backbone with an action expert that generates continuous robot actions. While these models exhibit impressive capabilities, due to their very high number of parameters, their computational requirements are often prohibitive for robotics control. To mitigate these inefficiencies, existing methods predominantly skip VLM backbone layers with early exits or reduce denoising steps, while leaving action expert depth untouched. We propose a framework that exposes backbone depth $V$, action expert depth $A$, and denoising steps $D$ as three jointly configurable compute axes in a VLA. Starting from a pretrained VLA, we attach lightweight Exit Transformers (ET) at intermediate depths in both the backbone and the action expert, trained to distil the last layer of the policy into each exit. Furthermore, we introduce a KV Cache synthesis mechanism that manages the missing keys and values of the skipped backbone layers, allowing the action expert to exit deeper than the backbone. Finally, we show that the optimal compute budget is task-dependent, with different tasks benefiting from different axes and depths. Notably, our method does not require training the original policy from scratch, and for each exit, it increases the number of parameters by only $2.1\\%$ for SmolVLA and $4.1\\%$ for $\u03c0_{0.5}$. We validate our approach across two flow-matching VLAs (SmolVLA, $\u03c0_{0.5}$) and two benchmarks (LIBERO, Meta-World), revealing complementary effects: $V$ and $A$ respectively reduce FLOPs and latency, while $D$ improves both. Our joint configurations $(V,A,D)$ reduce latency by $79.2\\%$ and computation (FLOPs) by $31.8\\%$, while improving mean success rate by $5.6\\%$.", "arxiv_id": "2609.29382", "arxiv_url": "https://arxiv.org/abs/2609.29382", "authors": ["Riccardo Andrea Izzo", "Rimvydas Rubavicius", "Gianluca Bardaro", "Subramanian Ramamoorthy", "Matteo Matteucci", "Alessandro Suglia"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6d41\u5339\u914d Vision-Language-Action \u6a21\u578b\u7684\u89e3\u8026\u65e9\u9000\u6846\u67b6\uff0c\u5c06VLM\u9aa8\u5e72\u6df1\u5ea6\u3001\u52a8\u4f5c\u4e13\u5bb6\u6df1\u5ea6\u548c\u53bb\u566a\u6b65\u6570\u4f5c\u4e3a\u4e09\u4e2a\u53ef\u8054\u5408\u914d\u7f6e\u7684\u8ba1\u7b97\u8f74\u3002\u901a\u8fc7\u5728\u4e2d\u95f4\u5c42\u52a0\u5165\u8f7b\u91cf Exit Transformer \u5e76\u84b8\u998f\u539f\u7b56\u7565\uff0c\u65e0\u9700\u4ece\u5934\u8bad\u7ec3\u5373\u53ef\u5b9e\u73b0\u6309\u4efb\u52a1\u9009\u62e9\u4e0d\u540c\u8ba1\u7b97\u9884\u7b97\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29382", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u540c\u65f6\u66b4\u9732\u9aa8\u5e72\u6df1\u5ea6V\u3001\u52a8\u4f5c\u4e13\u5bb6\u6df1\u5ea6A\u3001\u53bb\u566a\u6b65\u6570D\u4e09\u7c7b\u8ba1\u7b97\u8f74\uff0c\u800c\u975e\u53ea\u8df3\u8fc7VLM\u5c42\u6216\u51cf\u5c11\u53bb\u566a\u6b65\u6570\u3002", "\u5f15\u5165KV Cache\u5408\u6210\u673a\u5236\uff0c\u8865\u5168\u88ab\u8df3\u8fc7\u9aa8\u5e72\u5c42\u7684\u952e\u503c\u7f13\u5b58\uff0c\u4f7f\u52a8\u4f5c\u4e13\u5bb6\u53ef\u6bd4\u9aa8\u5e72\u9000\u51fa\u5f97\u66f4\u6df1\u3002", "\u5728SmolVLA\u3001\u03c00.5\u4ee5\u53caLIBERO\u3001Meta-World\u4e0a\u9a8c\u8bc1\uff0c\u8054\u5408\u914d\u7f6e\u5c06\u5ef6\u8fdf\u964d\u4f4e79.2%\u3001FLOPs\u964d\u4f4e31.8%\uff0c\u5e73\u5747\u6210\u529f\u7387\u63d0\u53475.6%\u3002"], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u6a21\u578b\u52a0\u901f", "\u65e9\u9000\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29382v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Decoupled Early Exits for Task-Dependent Compute Allocation in Flow-Matching VLAs", "tldr": "\u4e3aVLA\u6309\u4efb\u52a1\u52a8\u6001\u5206\u914d\u8ba1\u7b97\u91cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6d41\u5339\u914d Vision-Language-Action \u6a21\u578b\u7684\u89e3\u8026\u65e9\u9000\u6846\u67b6\uff0c\u5c06VLM\u9aa8\u5e72\u6df1\u5ea6\u3001\u52a8\u4f5c\u4e13\u5bb6\u6df1\u5ea6\u548c\u53bb\u566a\u6b65\u6570\u4f5c\u4e3a\u4e09\u4e2a\u53ef\u8054\u5408\u914d\u7f6e\u7684\u8ba1\u7b97\u8f74\u3002\u901a\u8fc7\u5728\u4e2d\u95f4\u5c42\u52a0\u5165\u8f7b\u91cf Exit Transformer \u5e76\u84b8\u998f\u539f\u7b56\u7565\uff0c\u65e0\u9700\u4ece\u5934\u8bad\u7ec3\u5373\u53ef\u5b9e\u73b0\u6309\u4efb\u52a1\u9009\u62e9\u4e0d\u540c\u8ba1\u7b97\u9884\u7b97\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9VLA\u673a\u5668\u4eba\u63a7\u5236\u7684\u9ad8\u8ba1\u7b97\u6210\u672c\u7ed9\u51fa\u53ef\u63d2\u62d4\u52a0\u901f\u65b9\u6848\uff0c\u5e76\u53d1\u73b0\u6700\u4f18\u8ba1\u7b97\u5206\u914d\u5177\u6709\u4efb\u52a1\u4f9d\u8d56\u6027\uff1b\u5728\u663e\u8457\u964d\u5ef6\u8fdf\u548c\u7b97\u529b\u7684\u540c\u65f6\u8fd8\u80fd\u63d0\u5347\u6210\u529f\u7387\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Unified vision-language models (VLMs) that tokenize images through a vector-quantized (VQ) codebook routinely hallucinate objects on grounded yes/no benchmarks, yet existing decoding-time fixes treat this as generic miscalibration without an architectural account. Using activation patching across twenty-five models spanning eight LLM families, we identify an early-layer ($L_0$) attention routing circuit shared across VQ-tokenized VLMs and propose a three-gate diagnostic that distinguishes the models carrying it from those that do not. The diagnostic isolates ten positive models (five natural unified-VQ VLMs across three LLM families and five induced variants) and rejects the remaining fifteen. A single-variable architectural swap (LLaVA-1.6 CLIP+MLP $\\rightarrow$ VQ+Linear) installs the circuit, while a matched-compute MLP control on identical data does not, isolating vector quantization as the source of the pathological signal; the routing pathway that carries it is one that the backbone already provides. Against tuned VCD and DoLA baselines, tuned DoLA wins on binary calibration, but \\textbf{only $L_0$ ablation reduces object hallucination in open-ended generation} (CHAIR$_i$ reduces by $31\\,\\%$ relatively, whereas tuned DoLA and VCD leave it unchanged or worsen it). These results recast object hallucination in unified VQ VLMs as a property of architecture and pretraining, and yield a targeted intervention that mechanism-agnostic decoding cannot replicate.", "arxiv_id": "2609.29048", "arxiv_url": "https://arxiv.org/abs/2609.29048", "authors": ["Shamanthak Hegde", "Xiangrui Liu", "Maitreya Patel", "Yezhou Yang"], "brief": "\u8bba\u6587\u901a\u8fc7\u5bf925\u4e2aVQ-tokenized\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u505a\u6fc0\u6d3b\u4fee\u8865\uff0c\u53d1\u73b0\u4e00\u79cd\u8de8\u67b6\u6784\u5171\u4eab\u7684\u65e9\u5c42\u6ce8\u610f\u529b\u8def\u7531\u56de\u8def\u4e0e\u7269\u4f53\u5e7b\u89c9\u76f8\u5173\u3002\u4f5c\u8005\u63d0\u51fa\u4e09\u95e8\u8bca\u65ad\u6cd5\u8bc6\u522b\u643a\u5e26\u8be5\u56de\u8def\u7684\u6a21\u578b\uff0c\u5e76\u8bc1\u660e\u5411LLaVA\u66ff\u6362\u4e3aVQ+Linear\u5373\u53ef\u5b89\u88c5\u8be5\u75c5\u7406\u4fe1\u53f7\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29048", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57288\u4e2aLLM\u5bb6\u65cf\u300125\u4e2a\u6a21\u578b\u4e2d\u8fdb\u884c\u673a\u5236\u5206\u6790\uff0c\u8bc6\u522b\u51fa\u65e9\u5c42L0\u6ce8\u610f\u529b\u8def\u7531\u56de\u8def\uff0c\u5e76\u80fd\u533a\u520610\u4e2a\u9633\u6027\u6a21\u578b\u4e0e15\u4e2a\u9634\u6027\u6a21\u578b\u3002", "\u5355\u53d8\u91cf\u67b6\u6784\u66ff\u6362\u663e\u793a\uff1aCLIP+MLP\u6539\u4e3aVQ+Linear\u4f1a\u5f15\u5165\u8be5\u56de\u8def\uff0c\u800c\u540c\u7b49\u8ba1\u7b97\u91cf\u7684MLP\u5bf9\u7167\u4e0d\u4f1a\uff0c\u6307\u5411\u5411\u91cf\u91cf\u5316\u662f\u5e7b\u89c9\u4fe1\u53f7\u6765\u6e90\u3002", "\u76f8\u6bd4\u8c03\u53c2\u540e\u7684VCD\u548cDoLA\uff0c\u53ea\u6709L0\u6d88\u878d\u80fd\u964d\u4f4e\u5f00\u653e\u5f0f\u751f\u6210\u4e2d\u7684\u7269\u4f53\u5e7b\u89c9\uff0cCHAIR_i\u76f8\u5bf9\u4e0b\u964d31%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u5411\u91cf\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29048v1", "published_at": "2026-09-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Where Hallucinations Live: A Cross-Architecture Circuit in VQ-Tokenized Vision-Language Models", "tldr": "\u5b9a\u4f4dVQ\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5e7b\u89c9\u7684\u5171\u4eab\u65e9\u5c42\u56de\u8def", "upvotes": 0, "what_it_is": "\u8bba\u6587\u901a\u8fc7\u5bf925\u4e2aVQ-tokenized\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u505a\u6fc0\u6d3b\u4fee\u8865\uff0c\u53d1\u73b0\u4e00\u79cd\u8de8\u67b6\u6784\u5171\u4eab\u7684\u65e9\u5c42\u6ce8\u610f\u529b\u8def\u7531\u56de\u8def\u4e0e\u7269\u4f53\u5e7b\u89c9\u76f8\u5173\u3002\u4f5c\u8005\u63d0\u51fa\u4e09\u95e8\u8bca\u65ad\u6cd5\u8bc6\u522b\u643a\u5e26\u8be5\u56de\u8def\u7684\u6a21\u578b\uff0c\u5e76\u8bc1\u660e\u5411LLaVA\u66ff\u6362\u4e3aVQ+Linear\u5373\u53ef\u5b89\u88c5\u8be5\u75c5\u7406\u4fe1\u53f7\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u7edf\u4e00VQ\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u7269\u4f53\u5e7b\u89c9\u4ece\u201c\u89e3\u7801\u6821\u51c6\u95ee\u9898\u201d\u91cd\u6784\u4e3a\u67b6\u6784\u4e0e\u9884\u8bad\u7ec3\u8bf1\u53d1\u7684\u673a\u5236\u6027\u95ee\u9898\uff0c\u5e76\u7ed9\u51fa\u6bd4\u901a\u7528\u89e3\u7801\u4fee\u6b63\u66f4\u6709\u9488\u5bf9\u6027\u7684\u5e72\u9884\u65b9\u5f0f\u3002"}, {"abstract": "We present: (i) a new dataset consisting of the full development history of a 21,000-line Python tool built entirely by Claude AI, with no human-authored code or tests, (ii) two code-provenance tracing tools, (iii) three taxonomies for instruction intent, commit provenance, and response reliability, (iv) application of these to analyse the dataset. We find that: (i) user coding agent CLI instructions differ in kind from IDE-chat instructions, with a greater focus on comprehension, planning and consultation, (ii) code development is mainly proactive, (iii) 14.3% of AI code-generation events contain a real error later caught by the AI-authored test suite, (iv) roughly 1 in 4-5 of the AI\u0027s interactive responses contains one or more factual errors.", "arxiv_id": "2609.29744", "arxiv_url": "https://arxiv.org/abs/2609.29744", "authors": ["Douglas Leith"], "brief": "\u8bba\u6587\u53d1\u5e03\u4e86\u4e00\u4e2a\u7531 Claude \u5b8c\u5168\u751f\u6210\u7684 2.1 \u4e07\u884c Python \u5de5\u5177\u7684\u5b8c\u6574\u5f00\u53d1\u5386\u53f2\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u4f9b\u4ee3\u7801\u6eaf\u6e90\u5de5\u5177\u4e0e\u4e09\u5957\u5206\u7c7b\u4f53\u7cfb\u3002\u4f5c\u8005\u7528\u8fd9\u4e9b\u5de5\u5177\u5206\u6790 AI \u7f16\u7801\u8fc7\u7a0b\u3001\u63d0\u4ea4\u6765\u6e90\u3001\u6d4b\u8bd5\u6355\u83b7\u9519\u8bef\u4e0e\u4ea4\u4e92\u56de\u7b54\u53ef\u9760\u6027\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29744", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6570\u636e\u96c6\u8986\u76d6\u65e0\u4eba\u5de5\u4ee3\u7801\u6216\u6d4b\u8bd5\u4ecb\u5165\u7684\u5b8c\u6574\u5f00\u53d1\u8fc7\u7a0b\uff0c\u53ef\u7528\u4e8e\u7814\u7a76 AI \u7f16\u7801\u4ee3\u7406\u7684\u771f\u5b9e\u5de5\u4f5c\u6d41\u3002", "\u63d0\u51fa\u4ee3\u7801\u6eaf\u6e90\u8ffd\u8e2a\u5de5\u5177\uff0c\u5e76\u6784\u5efa\u6307\u4ee4\u610f\u56fe\u3001\u63d0\u4ea4\u6765\u6e90\u3001\u54cd\u5e94\u53ef\u9760\u6027\u4e09\u7c7b\u6807\u6ce8\u4f53\u7cfb\u3002", "\u53d1\u73b0 14.3% \u7684 AI \u4ee3\u7801\u751f\u6210\u4e8b\u4ef6\u5305\u542b\u540e\u6765\u88ab AI \u81ea\u5199\u6d4b\u8bd5\u6355\u83b7\u7684\u771f\u5b9e\u9519\u8bef\uff0c\u7ea6 20%\u201325% \u4ea4\u4e92\u56de\u590d\u542b\u4e8b\u5b9e\u9519\u8bef\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u53ef\u9760\u6027\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29744v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Between the Commits: Process, Error, and Claim Reliability in a Wholly AI-Authored Codebase", "tldr": "\u9996\u4e2a\u5168AI\u4ee3\u7801\u5e93\u5f00\u53d1\u53f2\u63ed\u793a\u9519\u8bef\u4e0e\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u5e03\u4e86\u4e00\u4e2a\u7531 Claude \u5b8c\u5168\u751f\u6210\u7684 2.1 \u4e07\u884c Python \u5de5\u5177\u7684\u5b8c\u6574\u5f00\u53d1\u5386\u53f2\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u4f9b\u4ee3\u7801\u6eaf\u6e90\u5de5\u5177\u4e0e\u4e09\u5957\u5206\u7c7b\u4f53\u7cfb\u3002\u4f5c\u8005\u7528\u8fd9\u4e9b\u5de5\u5177\u5206\u6790 AI \u7f16\u7801\u8fc7\u7a0b\u3001\u63d0\u4ea4\u6765\u6e90\u3001\u6d4b\u8bd5\u6355\u83b7\u9519\u8bef\u4e0e\u4ea4\u4e92\u56de\u7b54\u53ef\u9760\u6027\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5c11\u89c1\u5730\u63d0\u4f9b\u4e86\u5b8c\u6574\u3001\u53ef\u8ffd\u6eaf\u7684 AI \u72ec\u7acb\u5f00\u53d1\u4ee3\u7801\u5e93\u8fc7\u7a0b\u6570\u636e\uff0c\u6709\u52a9\u4e8e\u91cf\u5316 AI \u7f16\u7801\u4ee3\u7406\u5728\u89c4\u5212\u3001\u751f\u6210\u3001\u6d4b\u8bd5\u548c\u89e3\u91ca\u4e2d\u7684\u53ef\u9760\u6027\u8fb9\u754c\uff0c\u5bf9\u8f6f\u4ef6\u5de5\u7a0b\u4e2d\u7684 AI \u8bc4\u4f30\u4e0e\u5ba1\u8ba1\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Long-horizon tasks require preserving and later recovering cross-session evidence under a bounded, query-blind memory budget. Existing compression can discard fine-grained visual cues or conflate semantically similar but incompatible observations. We present C3M, a cross-session multimodal memory organization that maintains a bounded active index over persistent source text-image evidence. Relation-aware updates consolidate safe redundancy while preserving complementary and incompatible records. At query time, budgeted routing selects useful index pages and expands their associated source evidence under a fixed reader budget. Together, these mechanisms establish a compact, provenance-preserving multimodal memory organization for cross-session long-horizon tasks, retaining temporal distinctions and source links required for reliable downstream reasoning. Code is available at https://github.com/HuzhouNLP/C3M.", "arxiv_id": "2609.29735", "arxiv_url": "https://arxiv.org/abs/2609.29735", "authors": ["Xueshu Chen", "Yan Wang", "Zihao Xue", "Jiefu Li", "Zhenfang Liu", "Jayden Chen", "Zhen Bi", "Jungang Lou"], "brief": "\u8bba\u6587\u63d0\u51fa C3M\uff0c\u4e00\u79cd\u8de8\u4f1a\u8bdd\u591a\u6a21\u6001\u8bb0\u5fc6\u7ec4\u7ec7\u65b9\u6cd5\uff0c\u5728\u6709\u9650\u8bb0\u5fc6\u9884\u7b97\u4e0b\u7ef4\u62a4\u6587\u672c-\u56fe\u50cf\u8bc1\u636e\u7d22\u5f15\u3002\u5b83\u901a\u8fc7\u5173\u7cfb\u611f\u77e5\u66f4\u65b0\u4e0e\u67e5\u8be2\u65f6\u9884\u7b97\u8def\u7531\uff0c\u4fdd\u7559\u6765\u6e90\u3001\u65f6\u95f4\u5dee\u5f02\u548c\u7ec6\u7c92\u5ea6\u8bc1\u636e\u4ee5\u652f\u6301\u53ef\u9760\u63a8\u7406\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29735", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u7ef4\u62a4\u6709\u754c active index\uff0c\u540c\u65f6\u4fdd\u7559\u6301\u4e45\u5316\u7684\u539f\u59cb\u6587\u672c-\u56fe\u50cf\u8bc1\u636e\u4e0e\u6765\u6e90\u94fe\u63a5", "\u5173\u7cfb\u611f\u77e5\u66f4\u65b0\u53ef\u5408\u5e76\u5b89\u5168\u5197\u4f59\u4fe1\u606f\uff0c\u540c\u65f6\u907f\u514d\u6df7\u6dc6\u8bed\u4e49\u76f8\u8fd1\u4f46\u4e92\u4e0d\u517c\u5bb9\u7684\u89c2\u5bdf", "\u67e5\u8be2\u9636\u6bb5\u5728\u56fa\u5b9a reader \u9884\u7b97\u4e0b\u9009\u62e9\u76f8\u5173\u7d22\u5f15\u9875\uff0c\u5e76\u5c55\u5f00\u5bf9\u5e94\u6e90\u8bc1\u636e\u7528\u4e8e\u4e0b\u6e38\u63a8\u7406"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u957f\u671f\u8bb0\u5fc6", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29735v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "C3M: Cross-Session Multimodal Memory Maintenance for Long-Horizon Tasks", "tldr": "\u9762\u5411\u957f\u7a0b\u4efb\u52a1\u7684\u8de8\u4f1a\u8bdd\u591a\u6a21\u6001\u8bb0\u5fc6\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa C3M\uff0c\u4e00\u79cd\u8de8\u4f1a\u8bdd\u591a\u6a21\u6001\u8bb0\u5fc6\u7ec4\u7ec7\u65b9\u6cd5\uff0c\u5728\u6709\u9650\u8bb0\u5fc6\u9884\u7b97\u4e0b\u7ef4\u62a4\u6587\u672c-\u56fe\u50cf\u8bc1\u636e\u7d22\u5f15\u3002\u5b83\u901a\u8fc7\u5173\u7cfb\u611f\u77e5\u66f4\u65b0\u4e0e\u67e5\u8be2\u65f6\u9884\u7b97\u8def\u7531\uff0c\u4fdd\u7559\u6765\u6e90\u3001\u65f6\u95f4\u5dee\u5f02\u548c\u7ec6\u7c92\u5ea6\u8bc1\u636e\u4ee5\u652f\u6301\u53ef\u9760\u63a8\u7406\u3002", "why_notable": "\u957f\u7a0b\u667a\u80fd\u4f53\u548c\u591a\u4f1a\u8bdd\u5e94\u7528\u5e38\u53d7\u9650\u4e8e\u8bb0\u5fc6\u9884\u7b97\u4e0e\u8bc1\u636e\u9057\u5931\u95ee\u9898\uff1bC3M\u5f3a\u8c03\u53ef\u8ffd\u6eaf\u3001\u591a\u6a21\u6001\u3001\u8de8\u4f1a\u8bdd\u7684\u8bb0\u5fc6\u7ef4\u62a4\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u957f\u671f\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\u548c\u53ef\u89e3\u91ca\u6027\u3002"}, {"abstract": "Chain-of-thought (CoT) instructions can distort multiple-choice VLM evaluation when a scorer appends a reasoning cue but reads answer-label logits before the model generates any rationale. We call this CoT-prefix scoring. On ScienceQA, Qwen2.5-VL-7B drops from 80.76% to 45.48%, and across five option-content permutations 93.54% of CoT-prefix predictions select the first slot. Condition-matched linear probes recover 78.94% from the same hidden states, while free generation restores 75.24%, showing that the answer often survives the prefix and the immediate readout fails. Vocabulary and layer diagnostics explain the mismatch: probability mass moves toward continuation tokens, while answer information remains linearly accessible in late layers. The effect recurs with varying severity across datasets and models, though not universally. These results show that CoT-prefix scoring can confound model knowledge with an evaluation-interface mismatch and should be avoided unless the requested and scored output events are aligned.", "arxiv_id": "2609.29278", "arxiv_url": "https://arxiv.org/abs/2609.29278", "authors": ["Zeyan Li", "Siyuan Qiu", "Jianfeng Xu"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u5728\u591a\u9009VLM\u8bc4\u6d4b\u4e2d\uff0c\u5982\u679c\u8bc4\u6d4b\u5668\u8ffd\u52a0\u201c\u8bf7\u63a8\u7406\u201d\u7684CoT\u63d0\u793a\uff0c\u5374\u5728\u6a21\u578b\u751f\u6210\u63a8\u7406\u524d\u76f4\u63a5\u8bfb\u53d6\u7b54\u6848\u6807\u7b7elogits\uff0c\u4f1a\u5bfc\u81f4\u4e25\u91cd\u8bc4\u5206\u5931\u771f\u3002\u4f5c\u8005\u5c06\u5176\u79f0\u4e3aCoT-prefix scoring\uff0c\u5e76\u901a\u8fc7ScienceQA\u7b49\u6570\u636e\u96c6\u548c\u591a\u6a21\u578b\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u8fd9\u4e00\u73b0\u8c61\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29278", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728ScienceQA\u4e0a\uff0cQwen2.5-VL-7B\u51c6\u786e\u7387\u4ece80.76%\u9aa4\u964d\u81f345.48%\uff0c\u4e1493.54%\u7684CoT-prefix\u9884\u6d4b\u504f\u5411\u7b2c\u4e00\u4e2a\u9009\u9879\u69fd\u4f4d", "\u540c\u4e00\u9690\u85cf\u72b6\u6001\u4e0a\u8bad\u7ec3\u6761\u4ef6\u5339\u914d\u7ebf\u6027\u63a2\u9488\u53ef\u6062\u590d\u523078.94%\uff0c\u81ea\u7531\u751f\u6210\u7b54\u6848\u4e5f\u53ef\u6062\u590d\u523075.24%\uff0c\u8bf4\u660e\u7b54\u6848\u4fe1\u606f\u4ecd\u5b58\u5728", "\u8bca\u65ad\u663e\u793a\u6982\u7387\u8d28\u91cf\u88ab\u63a8\u5411\u7ee7\u7eed\u751f\u6210\u63a8\u7406\u7684token\uff0c\u800c\u975e\u7b54\u6848\u6807\u7b7e\uff1b\u665a\u5c42\u9690\u85cf\u72b6\u6001\u4e2d\u4ecd\u7ebf\u6027\u53ef\u8bfb\u51fa\u7b54\u6848"], "keywords": ["\u591a\u6a21\u6001", "\u8bc4\u6d4b\u65b9\u6cd5", "\u601d\u7ef4\u94fe", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29278v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Reasoning Instructions Can Break Answer Decoding in Vision--Language Models", "tldr": "CoT\u524d\u7f00\u4f1a\u4e25\u91cd\u5e72\u6270VLM\u9009\u62e9\u9898\u6253\u5206", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\uff0c\u5728\u591a\u9009VLM\u8bc4\u6d4b\u4e2d\uff0c\u5982\u679c\u8bc4\u6d4b\u5668\u8ffd\u52a0\u201c\u8bf7\u63a8\u7406\u201d\u7684CoT\u63d0\u793a\uff0c\u5374\u5728\u6a21\u578b\u751f\u6210\u63a8\u7406\u524d\u76f4\u63a5\u8bfb\u53d6\u7b54\u6848\u6807\u7b7elogits\uff0c\u4f1a\u5bfc\u81f4\u4e25\u91cd\u8bc4\u5206\u5931\u771f\u3002\u4f5c\u8005\u5c06\u5176\u79f0\u4e3aCoT-prefix scoring\uff0c\u5e76\u901a\u8fc7ScienceQA\u7b49\u6570\u636e\u96c6\u548c\u591a\u6a21\u578b\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u8fd9\u4e00\u73b0\u8c61\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86VLM\u8bc4\u6d4b\u4e2d\u7684\u4e00\u4e2a\u91cd\u8981\u63a5\u53e3\u9677\u9631\uff1aCoT\u63d0\u793a\u4e0e\u5373\u65f6\u7b54\u6848logit\u8bfb\u53d6\u4e0d\u5339\u914d\uff0c\u4f1a\u628a\u6a21\u578b\u77e5\u8bc6\u8bef\u5224\u4e3a\u80fd\u529b\u4e0b\u964d\uff0c\u5bf9\u591a\u6a21\u6001\u6a21\u578b\u57fa\u51c6\u8bc4\u6d4b\u548c\u6253\u5206\u534f\u8bae\u8bbe\u8ba1\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "Scalable oversight aims to verify the behaviour of agents whose capabilities exceed those of their overseers. AI debate has been proposed as an oversight solution in which competing agents help a resource-limited verifier assess claims that it cannot reliably evaluate unaided. Much of its promise rests on incentivizing honest arguments that lead to correct verdicts. Yet a correct verdict need not uniquely determine the arguments used to support it. Agents may retain discretion over which correct claims to present, how to frame them, and in what order to disclose them. This residual freedom can allow agents to shape what the verifier learns beyond the task-relevant conclusion, pursuing latent objectives without compromising verdict correctness. To study this phenomenon, we introduce the framework strategic interactive oversight (SIO), which treats oversight jointly as a verification mechanism and a strategic communication channel. Within this framework, we formalise the notion of task-admissible latent optimisation, which entails the pursuit of latent objectives while maintaining a prescribed task performance. As proof-of-concept, we instantiate SIO in the establish protocol debate with cross-examination and quantify a tradeoff between task success and information disclosure about a hidden variable. The trade-off identifies a strategic window in which substantial disclosure remains compatible with task admissibility. Towards mitigation, we reduce admissible bias by expanding the cross-examiner\u0027s role to mitigate persistent disclosure over finite interaction horizons. Our results highlight the need to evaluate oversight not only by the correctness of its verdicts, but also by the information conveyed through its transcripts.", "arxiv_id": "2609.29189", "arxiv_url": "https://arxiv.org/abs/2609.29189", "authors": ["Rayne Holland", "Liming Zhu", "Jason Xue"], "brief": "\u8bba\u6587\u63d0\u51fa\u6218\u7565\u6027\u4ea4\u4e92\u5f0f\u76d1\u7763\uff08SIO\uff09\u6846\u67b6\uff0c\u5c06AI debate\u540c\u65f6\u89c6\u4e3a\u9a8c\u8bc1\u673a\u5236\u548c\u6218\u7565\u901a\u4fe1\u6e20\u9053\u3002\u5b83\u5f62\u5f0f\u5316\u4e86\u201c\u4efb\u52a1\u53ef\u5bb9\u8bb8\u7684\u6f5c\u5728\u4f18\u5316\u201d\uff1a\u667a\u80fd\u4f53\u5728\u4fdd\u6301\u5224\u51b3\u6b63\u786e\u7684\u540c\u65f6\uff0c\u4ecd\u53ef\u901a\u8fc7\u9009\u62e9\u8bba\u636e\u3001\u987a\u5e8f\u548c\u8868\u8ff0\u8ffd\u6c42\u9690\u85cf\u76ee\u6807\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29189", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6307\u51fa\u201c\u5224\u51b3\u6b63\u786e\u201d\u4e0d\u7b49\u4e8e\u201c\u8bba\u8bc1\u8fc7\u7a0b\u65e0\u5bb3\u201d\uff0c\u667a\u80fd\u4f53\u53ef\u5728\u591a\u4e2a\u6b63\u786e\u8bba\u636e\u4e2d\u7b56\u7565\u6027\u9009\u62e9\u4fe1\u606f\u62ab\u9732\u65b9\u5f0f", "\u5728\u5e26\u4ea4\u53c9\u8d28\u8be2\u7684establish protocol debate\u4e2d\u6784\u9020\u6982\u5ff5\u9a8c\u8bc1\uff0c\u91cf\u5316\u4efb\u52a1\u6210\u529f\u7387\u4e0e\u9690\u85cf\u53d8\u91cf\u4fe1\u606f\u62ab\u9732\u4e4b\u95f4\u7684\u6743\u8861", "\u53d1\u73b0\u5b58\u5728\u201c\u6218\u7565\u7a97\u53e3\u201d\uff1a\u5728\u4e0d\u7834\u574f\u4efb\u52a1\u53ef\u5bb9\u8bb8\u6027\u7684\u524d\u63d0\u4e0b\uff0c\u4ecd\u80fd\u6301\u7eed\u62ab\u9732\u5927\u91cf\u6f5c\u5728\u4fe1\u606f\uff1b\u6269\u5c55\u4ea4\u53c9\u8d28\u8be2\u8005\u89d2\u8272\u53ef\u964d\u4f4e\u8fd9\u79cd\u504f\u7f6e"], "keywords": ["AI\u76d1\u7763", "\u667a\u80fd\u4f53", "AI\u8fa9\u8bba", "AI\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29189v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Honesty is Not Enough in AI Debate", "tldr": "\u8bda\u5b9eAI\u8fa9\u8bba\u4ecd\u53ef\u80fd\u6cc4\u9732\u6216\u64cd\u63a7\u4fe1\u606f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u6218\u7565\u6027\u4ea4\u4e92\u5f0f\u76d1\u7763\uff08SIO\uff09\u6846\u67b6\uff0c\u5c06AI debate\u540c\u65f6\u89c6\u4e3a\u9a8c\u8bc1\u673a\u5236\u548c\u6218\u7565\u901a\u4fe1\u6e20\u9053\u3002\u5b83\u5f62\u5f0f\u5316\u4e86\u201c\u4efb\u52a1\u53ef\u5bb9\u8bb8\u7684\u6f5c\u5728\u4f18\u5316\u201d\uff1a\u667a\u80fd\u4f53\u5728\u4fdd\u6301\u5224\u51b3\u6b63\u786e\u7684\u540c\u65f6\uff0c\u4ecd\u53ef\u901a\u8fc7\u9009\u62e9\u8bba\u636e\u3001\u987a\u5e8f\u548c\u8868\u8ff0\u8ffd\u6c42\u9690\u85cf\u76ee\u6807\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u9192\u53ef\u6269\u5c55\u76d1\u7763\u4e0d\u80fd\u53ea\u770b\u6700\u7ec8\u7b54\u6848\u662f\u5426\u6b63\u786e\uff0c\u8fd8\u5fc5\u987b\u5ba1\u8ba1\u8fa9\u8bba transcript \u4e2d\u4f20\u9012\u7684\u989d\u5916\u4fe1\u606f\u4e0e\u6f5c\u5728\u64cd\u63a7\uff0c\u4e3aAI debate\u5b89\u5168\u8bc4\u4f30\u63d0\u4f9b\u4e86\u65b0\u7684\u5a01\u80c1\u6a21\u578b\u548c\u7f13\u89e3\u65b9\u5411\u3002"}, {"abstract": "Persistent memory lets language-model agents improve prompts and skills without updating model weights. We show that matching retrieval scope to certification scope enables these edits to support reliable repeated adaptation across recurring task families. We study frozen-model agents on ProcStream-RSI, a 12-round code-repair stream, using Orthogonal Regression Control (ORC), an execution-grounded gate for persistent skill edits. In an intervention that holds proposals and gate decisions fixed, retrieving each accepted skill only for its originating family raises mean hidden trajectory utility from 0.713 under global memory to 0.816 and changes harmful deployments from six of eight to none. In 27 paired randomized-order streams, Scoped-ORC improves mean trajectory utility by 0.063 [0.037, 0.094] over Global-ORC, accepts 63 rather than 12 updates, and produces multiple accepted updates in 19/27 streams, with 0/63 harmful acceptances. The global control reaches 0.713, below the static agent\u0027s 0.775, because locally valid edits can interfere with unrelated families. These results establish scope matching as a complementary control for persistent agent memory: certification determines whether an edit is supported, while retrieval scope determines where that evidence authorizes its use.", "arxiv_id": "2609.29144", "arxiv_url": "https://arxiv.org/abs/2609.29144", "authors": ["Yezhou Cheng", "Runjia Du", "Zeming Liu", "Qibai Chen", "Hang Lyu", "Yankai Zeng", "Yilan Wei", "Bojun Lin"], "brief": "\u8bba\u6587\u7814\u7a76\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u6301\u4e45\u8bb0\u5fc6\u66f4\u65b0\uff0c\u63d0\u51fa\u5c06\u68c0\u7d22\u8303\u56f4\u4e0e\u8ba4\u8bc1\u8303\u56f4\u5339\u914d\uff1a\u901a\u8fc7 Scoped-ORC \u8ba9\u5df2\u9a8c\u8bc1\u7684\u6280\u80fd\u53ea\u5728\u5176\u6765\u6e90\u4efb\u52a1\u65cf\u4e2d\u88ab\u8c03\u7528\u3002\u5b9e\u9a8c\u5728 ProcStream-RSI \u4ee3\u7801\u4fee\u590d\u6d41\u4e0a\u8868\u660e\uff0c\u8fd9\u80fd\u663e\u8457\u63d0\u5347\u53cd\u590d\u9002\u5e94\u7684\u53ef\u9760\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29144", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4f7f\u7528 Orthogonal Regression Control\uff08ORC\uff09\u4f5c\u4e3a\u57fa\u4e8e\u6267\u884c\u7ed3\u679c\u7684\u6301\u4e45\u6280\u80fd\u7f16\u8f91\u95e8\u63a7\u673a\u5236\u3002", "\u5728\u56fa\u5b9a\u63d0\u6848\u4e0e\u95e8\u63a7\u51b3\u7b56\u7684\u5e72\u9884\u5b9e\u9a8c\u4e2d\uff0c\u6309\u6765\u6e90\u4efb\u52a1\u65cf\u68c0\u7d22\u6280\u80fd\u5c06\u9690\u85cf\u8f68\u8ff9\u6548\u7528\u4ece\u5168\u5c40\u8bb0\u5fc6\u7684 0.713 \u63d0\u5347\u5230 0.816\uff0c\u5e76\u5c06\u6709\u5bb3\u90e8\u7f72\u4ece 8 \u6b21\u4e2d 6 \u6b21\u964d\u4e3a 0\u3002", "\u5728 27 \u4e2a\u968f\u673a\u987a\u5e8f\u914d\u5bf9\u6d41\u4e2d\uff0cScoped-ORC \u76f8\u6bd4 Global-ORC \u5e73\u5747\u8f68\u8ff9\u6548\u7528\u63d0\u5347 0.063\uff0c\u63a5\u53d7 63 \u6b21\u66f4\u65b0\u4e14 0 \u6b21\u6709\u5bb3\u63a5\u53d7\uff1b\u5168\u5c40\u8bb0\u5fc6\u751a\u81f3\u4f4e\u4e8e\u9759\u6001\u667a\u80fd\u4f53\u8868\u73b0\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u4ee3\u7801\u4fee\u590d", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29144v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Scope Before You Persist: Preventing Cross-Family Interference in Agent Memory", "tldr": "\u6309\u4efb\u52a1\u65cf\u9650\u5b9a\u8bb0\u5fc6\u68c0\u7d22\u53ef\u907f\u514d\u667a\u80fd\u4f53\u6280\u80fd\u5e72\u6270", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u6301\u4e45\u8bb0\u5fc6\u66f4\u65b0\uff0c\u63d0\u51fa\u5c06\u68c0\u7d22\u8303\u56f4\u4e0e\u8ba4\u8bc1\u8303\u56f4\u5339\u914d\uff1a\u901a\u8fc7 Scoped-ORC \u8ba9\u5df2\u9a8c\u8bc1\u7684\u6280\u80fd\u53ea\u5728\u5176\u6765\u6e90\u4efb\u52a1\u65cf\u4e2d\u88ab\u8c03\u7528\u3002\u5b9e\u9a8c\u5728 ProcStream-RSI \u4ee3\u7801\u4fee\u590d\u6d41\u4e0a\u8868\u660e\uff0c\u8fd9\u80fd\u663e\u8457\u63d0\u5347\u53cd\u590d\u9002\u5e94\u7684\u53ef\u9760\u6027\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u6301\u4e45\u8bb0\u5fc6\u7684\u5173\u952e\u98ce\u9669\u4e0d\u53ea\u662f\u201c\u662f\u5426\u63a5\u53d7\u7f16\u8f91\u201d\uff0c\u8fd8\u5305\u62ec\u201c\u5728\u54ea\u91cc\u8c03\u7528\u7f16\u8f91\u201d\u3002\u4efb\u52a1\u65cf\u7ea7\u4f5c\u7528\u57df\u63a7\u5236\u4e3a\u957f\u671f\u8fd0\u884c\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u7b80\u5355\u800c\u6709\u6548\u7684\u5b89\u5168\u673a\u5236\uff0c\u53ef\u964d\u4f4e\u8de8\u4efb\u52a1\u5e72\u6270\u5e76\u63d0\u5347\u53ef\u91cd\u590d\u9002\u5e94\u80fd\u529b\u3002"}, {"abstract": "Cross-embodiment learning has shown that a single model, such as a vision-language-action (VLA) model, can learn state representations and manipulation skills that can be applied across heterogeneous robots to accomplish various tasks. We hypothesize that the same holds for safety enforcement. The reasoning required to satisfy a safety constraint, such as detecting an obstacle, recognizing that it should be avoided, and selecting a safe abstract action, is largely shared across robots. What differs across embodiments is how the abstract safe action is realized: morphology, kinematics, and dynamics determine which actions are safe and feasible. Consequently, the same action can be safe for one robot and unsafe for another. This is especially important for generalist manipulation policies that operate in a common end-effector action space without explicitly capturing how safety depends on the robot\u0027s morphology and kinematics. We propose embodiment-conditioned safety filtering, in which a Hamilton-Jacobi reachability-based value function and its corresponding safety-maximizing policy are shared across robots. Using a morphology-aware latent representation of the robot and its environment, we perform Hamilton-Jacobi reachability analysis directly in latent space so that the learned safety concepts can generalize across embodiments while remaining explicitly conditioned on each robot\u0027s morphology and kinematics. We evaluate our approach across five bimanual robot embodiments and five manipulation tasks with whole-body collision-avoidance constraints. Our results show that a single policy, jointly trained across five manipulation tasks and four embodiments, exhibits zero-shot generalization to a held-out embodiment, reducing the nominal policy\u0027s collision rate. They also show that training using more embodiments improves generalization.", "arxiv_id": "2609.28984", "arxiv_url": "https://arxiv.org/abs/2609.28984", "authors": ["Ihab Tabbara", "Yuxuan Yang", "Hussein Sibai"], "brief": "\u8bba\u6587\u63d0\u51fa CrossSafe\uff1a\u4e00\u79cd\u57fa\u4e8e Hamilton-Jacobi \u53ef\u8fbe\u6027\u7684\u5b89\u5168\u8fc7\u6ee4\u65b9\u6cd5\uff0c\u5728\u5f62\u6001\u611f\u77e5\u6f5c\u7a7a\u95f4\u4e2d\u5171\u4eab\u5b89\u5168\u4ef7\u503c\u51fd\u6570\u4e0e\u5b89\u5168\u7b56\u7565\u3002\u5b83\u80fd\u9488\u5bf9\u4e0d\u540c\u673a\u5668\u4eba\u5f62\u6001\u548c\u8fd0\u52a8\u5b66\u6761\u4ef6\u8c03\u6574\u5b89\u5168\u52a8\u4f5c\uff0c\u5b9e\u73b0\u8de8 embodiment \u7684\u78b0\u649e\u89c4\u907f\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28984", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u673a\u5668\u4eba\u5f62\u6001\u3001\u8fd0\u52a8\u5b66\u4e0e\u73af\u5883\u7f16\u7801\u4e3a\u6f5c\u8868\u793a\uff0c\u5728\u6f5c\u7a7a\u95f4\u76f4\u63a5\u8fdb\u884c Hamilton-Jacobi \u53ef\u8fbe\u6027\u5206\u6790", "\u5355\u4e00\u5b89\u5168\u8fc7\u6ee4\u7b56\u7565\u57285\u4e2a\u53cc\u81c2\u673a\u5668\u4eba\u5f62\u6001\u30015\u4e2a\u64cd\u4f5c\u4efb\u52a1\u4e0a\u8bc4\u4f30\uff0c\u7ea6\u675f\u4e3a\u5168\u8eab\u78b0\u649e\u907f\u514d", "\u57284\u79cd\u5f62\u6001\u548c5\u4e2a\u4efb\u52a1\u4e0a\u8054\u5408\u8bad\u7ec3\u540e\uff0c\u53ef\u96f6\u6837\u672c\u6cdb\u5316\u5230\u672a\u89c1\u673a\u5668\u4eba\u5f62\u6001\uff0c\u5e76\u964d\u4f4e\u540d\u4e49\u7b56\u7565\u78b0\u649e\u7387"], "keywords": ["\u673a\u5668\u4eba", "\u5b89\u5168\u63a7\u5236", "\u8de8\u5f62\u6001\u5b66\u4e60", "\u53ef\u8fbe\u6027\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28984v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CrossSafe: Towards Cross-Embodiment Latent Safety Filters", "tldr": "\u8de8\u673a\u5668\u4eba\u5f62\u6001\u7684\u6f5c\u7a7a\u95f4\u5b89\u5168\u8fc7\u6ee4\u5668", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CrossSafe\uff1a\u4e00\u79cd\u57fa\u4e8e Hamilton-Jacobi \u53ef\u8fbe\u6027\u7684\u5b89\u5168\u8fc7\u6ee4\u65b9\u6cd5\uff0c\u5728\u5f62\u6001\u611f\u77e5\u6f5c\u7a7a\u95f4\u4e2d\u5171\u4eab\u5b89\u5168\u4ef7\u503c\u51fd\u6570\u4e0e\u5b89\u5168\u7b56\u7565\u3002\u5b83\u80fd\u9488\u5bf9\u4e0d\u540c\u673a\u5668\u4eba\u5f62\u6001\u548c\u8fd0\u52a8\u5b66\u6761\u4ef6\u8c03\u6574\u5b89\u5168\u52a8\u4f5c\uff0c\u5b9e\u73b0\u8de8 embodiment \u7684\u78b0\u649e\u89c4\u907f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8de8\u5f62\u6001\u5b66\u4e60\u6269\u5c55\u5230\u5b89\u5168\u7ea6\u675f\u6267\u884c\uff0c\u89e3\u51b3\u901a\u7528\u64cd\u4f5c\u7b56\u7565\u5728\u5171\u4eab\u672b\u7aef\u6267\u884c\u5668\u52a8\u4f5c\u7a7a\u95f4\u4e2d\u5ffd\u7565\u673a\u5668\u4eba\u5f62\u6001\u5dee\u5f02\u7684\u95ee\u9898\uff0c\u5bf9\u591a\u673a\u5668\u4eba\u901a\u7528\u5b89\u5168\u63a7\u5236\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Pre-logit steering adapts a frozen language model to a test-time reward by adding vectors to its final hidden states. Unregularized reward optimization can substantially alter the output distribution and degrade generation quality. We propose Minimally Invasive Steering Vector Optimization (MISVO), which penalizes interventions using the local KL geometry of the induced token distribution. The resulting Fisher quadratic measures distributional sensitivity and admits an analytic gradient computed through matrix--vector products with the frozen language-model head. We derive an exact decomposition of the sequence-level KL gradient into an analytic Fisher term and a suffix score-function term. For a fixed generation horizon, we show that the suffix term is second order in the steering magnitude and that three Fisher surrogates agree with the full KL gradient to first order. MISVO uses the frozen-reference surrogate to optimize position-specific interventions without updating model parameters. Across preference and code-generation tasks on models with approximately 1B--14B parameters, MISVO achieves the highest mean reward in six of seven model--task settings, with diversity and coherence scores close to those of Best-of-N.", "arxiv_id": "2609.30218", "arxiv_url": "https://arxiv.org/abs/2609.30218", "authors": ["Taha Entesari", "Jingyu Zhang", "Daniel Khashabi", "Mahyar Fazlyab"], "brief": "\u8bba\u6587\u63d0\u51fa MISVO\uff0c\u4e00\u79cd\u6d4b\u8bd5\u65f6\u9884logit steering\u65b9\u6cd5\uff0c\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u4e3a\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u4f18\u5316\u4f4d\u7f6e\u76f8\u5173\u5e72\u9884\u5411\u91cf\u3002\u5b83\u7528\u8bf1\u5bfctoken\u5206\u5e03\u7684\u5c40\u90e8KL/Fisher\u51e0\u4f55\u6765\u60e9\u7f5a\u8fc7\u5ea6\u5e72\u9884\uff0c\u4ece\u800c\u5728\u63d0\u5347\u5956\u52b1\u7684\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u539f\u6a21\u578b\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30218", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5e72\u9884\u4ee3\u4ef7\u5efa\u6a21\u4e3aFisher\u4e8c\u6b21\u578b\uff0c\u8861\u91cf\u8f93\u51fa\u5206\u5e03\u5bf9\u9690\u85cf\u72b6\u6001 steering \u5411\u91cf\u7684\u5c40\u90e8\u654f\u611f\u6027\uff0c\u5e76\u53ef\u901a\u8fc7\u51bb\u7ed3LM head\u7684\u77e9\u9635-\u5411\u91cf\u4e58\u79ef\u89e3\u6790\u8ba1\u7b97\u68af\u5ea6", "\u63a8\u5bfc\u5e8f\u5217\u7ea7KL\u68af\u5ea6\u7684\u7cbe\u786e\u5206\u89e3\uff1a\u89e3\u6790Fisher\u9879\u52a0\u540e\u7f00score-function\u9879\uff1b\u8bc1\u660e\u56fa\u5b9a\u751f\u6210\u957f\u5ea6\u4e0b\u540e\u7f00\u9879\u5bf9steering\u5e45\u5ea6\u4e3a\u4e8c\u9636", "\u5728\u504f\u597d\u4f18\u5316\u4e0e\u4ee3\u7801\u751f\u6210\u4efb\u52a1\u3001\u7ea61B\u523014B\u6a21\u578b\u4e0a\uff0cMISVO\u57287\u4e2a\u6a21\u578b-\u4efb\u52a1\u8bbe\u7f6e\u4e2d\u76846\u4e2a\u53d6\u5f97\u6700\u9ad8\u5e73\u5747\u5956\u52b1\uff0c\u4e14\u591a\u6837\u6027\u4e0e\u8fde\u8d2f\u6027\u63a5\u8fd1Best-of-N"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u4f18\u5316", "\u6a21\u578b\u63a7\u5236", "\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30218v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Minimally Invasive Steering of Language Models", "tldr": "\u7528\u6700\u5c0f\u6270\u52a8\u63d0\u5347\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u5956\u52b1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MISVO\uff0c\u4e00\u79cd\u6d4b\u8bd5\u65f6\u9884logit steering\u65b9\u6cd5\uff0c\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u4e3a\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u4f18\u5316\u4f4d\u7f6e\u76f8\u5173\u5e72\u9884\u5411\u91cf\u3002\u5b83\u7528\u8bf1\u5bfctoken\u5206\u5e03\u7684\u5c40\u90e8KL/Fisher\u51e0\u4f55\u6765\u60e9\u7f5a\u8fc7\u5ea6\u5e72\u9884\uff0c\u4ece\u800c\u5728\u63d0\u5347\u5956\u52b1\u7684\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u539f\u6a21\u578b\u751f\u6210\u8d28\u91cf\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u6d4b\u8bd5\u65f6\u5bf9\u9f50/\u63a7\u5236\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u7684\u7406\u8bba\u4e0e\u5b9e\u8df5\u65b9\u6848\uff1a\u65e0\u9700\u5fae\u8c03\u6a21\u578b\u53c2\u6570\uff0c\u5374\u80fd\u663e\u5f0f\u7ea6\u675f\u8f93\u51fa\u5206\u5e03\u504f\u79fb\uff0c\u7f13\u89e3\u7eaf\u5956\u52b1\u4f18\u5316\u5bfc\u81f4\u7684\u8d28\u91cf\u9000\u5316\uff0c\u5728\u504f\u597d\u548c\u4ee3\u7801\u4efb\u52a1\u4e0a\u5c55\u73b0\u51fa\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Layer-wise visual-text similarity in Multimodal Large Language Models (MLLMs) is widely interpreted as evidence that the language model progressively integrates visual content into a shared representation space. This reading rests on the assumption that scalar alignment scores reflect content-level cross-modal interaction. To test this assumption, we apply controlled interventions to the visual stream. Across 13 MLLMs from five families spanning 0.5B to 72B parameters, replacing projector-output visual tokens with Gaussian noise sharply reduces task accuracy, yet four standard scalar measures (CKA, SVCCA, MIR, and the leading principal-angle cosine) fail to consistently separate the corrupted stream from the original. We call this failure the alignment illusion and trace it to the shared language-model pathway: anisotropic MLP down-projections pull visual and text tokens toward common output directions, producing weight-induced alignment. Because this component is essentially one-dimensional, we introduce the principal-angle gap (PA gap), defined as the difference between the top two principal-angle cosines, which separates weight-induced similarity from multi-directional visual structure. Under graded visual corruption, the PA gap tracks task accuracy more consistently than the scalar scores we consider; under a structured but irrelevant image, it further exposes regimes in which internal geometry and task accuracy come apart. Internal visual-text alignment in MLLMs is therefore best read as a geometric diagnostic of the visual stream inside the language model rather than a direct proxy for content-level cross-modal interaction, and is most informative when calibrated by controlled task evidence.", "arxiv_id": "2609.30210", "arxiv_url": "https://arxiv.org/abs/2609.30210", "authors": ["Hong-Han Wang", "Yuntao Wang", "Hu Ding"], "brief": "\u8bba\u6587\u7cfb\u7edf\u68c0\u9a8c\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u5c42\u7ea7\u89c6\u89c9-\u6587\u672c\u76f8\u4f3c\u5ea6\u662f\u5426\u771f\u7684\u4ee3\u8868\u5185\u5bb9\u7ea7\u8de8\u6a21\u6001\u878d\u5408\u3002\u4f5c\u8005\u572813\u4e2aMLLM\u4e0a\u901a\u8fc7\u89c6\u89c9\u6d41\u53d7\u63a7\u6270\u52a8\u53d1\u73b0\uff0c\u5e38\u7528\u6807\u91cf\u5bf9\u9f50\u6307\u6807\u4f1a\u8bef\u5224\uff0c\u5e76\u63d0\u51faPA gap\u66f4\u53ef\u9760\u5730\u533a\u5206\u6743\u91cd\u8bf1\u5bfc\u76f8\u4f3c\u4e0e\u771f\u5b9e\u89c6\u89c9\u7ed3\u6784\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30210", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57285\u4e2a\u6a21\u578b\u5bb6\u65cf\u30010.5B\u523072B\u53c2\u6570\u768413\u4e2aMLLM\u4e2d\uff0c\u5c06\u89c6\u89c9token\u66ff\u6362\u4e3a\u9ad8\u65af\u566a\u58f0\u4f1a\u663e\u8457\u964d\u4f4e\u4efb\u52a1\u51c6\u786e\u7387\uff0c\u4f46CKA\u3001SVCCA\u3001MIR\u7b49\u6307\u6807\u5e38\u65e0\u6cd5\u533a\u5206\u539f\u59cb\u4e0e\u6c61\u67d3\u89c6\u89c9\u6d41\u3002", "\u4f5c\u8005\u5c06\u95ee\u9898\u5f52\u56e0\u4e8e\u5171\u4eab\u8bed\u8a00\u6a21\u578b\u8def\u5f84\u4e2d\u7684\u5404\u5411\u5f02\u6027MLP\u4e0b\u6295\u5f71\uff1a\u5176\u4f1a\u628a\u89c6\u89c9\u4e0e\u6587\u672ctoken\u62c9\u5411\u5171\u540c\u8f93\u51fa\u65b9\u5411\uff0c\u9020\u6210\u4e0e\u5185\u5bb9\u65e0\u5173\u7684\u201c\u6743\u91cd\u8bf1\u5bfc\u5bf9\u9f50\u201d\u3002", "\u63d0\u51faprincipal-angle gap\uff08PA gap\uff09\uff0c\u5373\u524d\u4e24\u4e2a\u4e3b\u89d2\u4f59\u5f26\u4e4b\u5dee\uff1b\u5728\u6e10\u8fdb\u89c6\u89c9\u6c61\u67d3\u4e0b\uff0c\u5b83\u6bd4\u5e38\u7528\u6807\u91cf\u76f8\u4f3c\u5ea6\u66f4\u7a33\u5b9a\u8ddf\u8e2a\u4efb\u52a1\u51c6\u786e\u7387\uff0c\u5e76\u80fd\u63ed\u793a\u5185\u90e8\u51e0\u4f55\u4e0e\u4efb\u52a1\u8868\u73b0\u8131\u94a9\u7684\u60c5\u5f62\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u8868\u793a\u5206\u6790", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30210v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "The Alignment Illusion in Multimodal Large Language Models", "tldr": "\u63ed\u793aMLLM\u89c6\u89c9\u6587\u672c\u5bf9\u9f50\u6307\u6807\u7684\u9519\u89c9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u68c0\u9a8c\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u5c42\u7ea7\u89c6\u89c9-\u6587\u672c\u76f8\u4f3c\u5ea6\u662f\u5426\u771f\u7684\u4ee3\u8868\u5185\u5bb9\u7ea7\u8de8\u6a21\u6001\u878d\u5408\u3002\u4f5c\u8005\u572813\u4e2aMLLM\u4e0a\u901a\u8fc7\u89c6\u89c9\u6d41\u53d7\u63a7\u6270\u52a8\u53d1\u73b0\uff0c\u5e38\u7528\u6807\u91cf\u5bf9\u9f50\u6307\u6807\u4f1a\u8bef\u5224\uff0c\u5e76\u63d0\u51faPA gap\u66f4\u53ef\u9760\u5730\u533a\u5206\u6743\u91cd\u8bf1\u5bfc\u76f8\u4f3c\u4e0e\u771f\u5b9e\u89c6\u89c9\u7ed3\u6784\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86MLLM\u53ef\u89e3\u91ca\u6027\u7814\u7a76\u4e2d\u5e38\u89c1\u7684\u201c\u76f8\u4f3c\u5ea6\u8d8a\u9ad8\u4ee3\u8868\u8de8\u6a21\u6001\u878d\u5408\u8d8a\u5f3a\u201d\u7684\u5047\u8bbe\uff0c\u63d0\u9192\u7814\u7a76\u8005\u5fc5\u987b\u7528\u53d7\u63a7\u4efb\u52a1\u8bc1\u636e\u6821\u51c6\u5185\u90e8\u5bf9\u9f50\u6307\u6807\uff1b\u5176\u63d0\u51fa\u7684PA gap\u4e5f\u4e3a\u8bca\u65ad\u89c6\u89c9\u4fe1\u606f\u5728\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u7684\u4f20\u64ad\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u5de5\u5177\u3002"}, {"abstract": "Planners built on visual world models commonly score each predicted outcome by its distance to the encoded goal image. We show that this target can limit control even with exact dynamics and globally optimal short-horizon search: reaching a goal may require actions that initially move away from it. With frozen LeWM models, intermediate targets substantially improve action synthesis and recorded-action ranking on Cube, PushT, Reacher, and TwoRoom. Learned targets and targets drawn from observed experience both produce these gains. We introduce Anchored Planning, which retrieves a recorded segment whose start and end resemble the current and goal observations, then aims at an observation shortly after its start. The frozen model scores actions toward this target from the current state. Without additional training, planning toward observed targets outperforms the released LeWM planner on every task in our long-range evaluation. Additional final-goal search falls short of the same gains. Lower successor-prediction error need not translate into better control. Success also depends on how far ahead the target is placed and on shrinking the retrieval span as execution advances. Changing only the target lets the same frozen model and planner reach goals that final-goal scoring misses.", "arxiv_id": "2609.30036", "arxiv_url": "https://arxiv.org/abs/2609.30036", "authors": ["Xvyuan Liu", "Jianjie Fang", "Chen Gao", "Yong Li"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u89c6\u89c9\u4e16\u754c\u6a21\u578b\u89c4\u5212\u4e2d\u76f4\u63a5\u6309\u6700\u7ec8\u76ee\u6807\u56fe\u50cf\u6253\u5206\u4f1a\u9650\u5236\u957f\u7a0b\u63a7\u5236\uff0c\u56e0\u4e3a\u6709\u6548\u52a8\u4f5c\u6709\u65f6\u9700\u5148\u8fdc\u79bb\u76ee\u6807\u3002\u4f5c\u8005\u63d0\u51fa Anchored Planning\uff1a\u4ece\u7ecf\u9a8c\u4e2d\u68c0\u7d22\u4e0e\u5f53\u524d\u548c\u76ee\u6807\u76f8\u4f3c\u7684\u8f68\u8ff9\u7247\u6bb5\uff0c\u5e76\u5148\u7784\u51c6\u7247\u6bb5\u65e9\u671f\u7684\u89c2\u6d4b\u4f5c\u4e3a\u4e2d\u95f4\u76ee\u6807\u3002", "categories": ["cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30036", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 LeWM \u51bb\u7ed3\u6a21\u578b\u4e0a\uff0c\u4ec5\u6539\u53d8\u89c4\u5212\u76ee\u6807
