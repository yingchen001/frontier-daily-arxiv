\u3001\u4e0d\u989d\u5916\u8bad\u7ec3\uff0c\u5c31\u5728 Cube\u3001PushT\u3001Reacher\u3001TwoRoom \u957f\u7a0b\u4efb\u52a1\u4e2d\u8d85\u8fc7\u539f\u53d1\u5e03\u89c4\u5212\u5668\u3002", "\u5b66\u4e60\u5f97\u5230\u7684\u4e2d\u95f4\u76ee\u6807\u548c\u4ece\u5386\u53f2\u7ecf\u9a8c\u4e2d\u68c0\u7d22\u7684\u89c2\u6d4b\u76ee\u6807\u90fd\u80fd\u63d0\u5347\u52a8\u4f5c\u5408\u6210\u4e0e\u5df2\u8bb0\u5f55\u52a8\u4f5c\u6392\u5e8f\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u66f4\u4f4e\u7684\u540e\u7ee7\u9884\u6d4b\u8bef\u5dee\u4e0d\u4e00\u5b9a\u5e26\u6765\u66f4\u597d\u63a7\u5236\uff1b\u76ee\u6807\u653e\u7f6e\u8ddd\u79bb\u4e0e\u6267\u884c\u8fc7\u7a0b\u4e2d\u9010\u6b65\u7f29\u5c0f\u68c0\u7d22\u8de8\u5ea6\u540c\u6837\u5173\u952e\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c4\u5212", "\u673a\u5668\u4eba", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30036v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Aim Short to Reach Far: Your Frozen World Model Can Plan Better Than You Think", "tldr": "\u7528\u4e2d\u95f4\u76ee\u6807\u663e\u8457\u63d0\u5347\u51bb\u7ed3\u4e16\u754c\u6a21\u578b\u89c4\u5212", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\uff0c\u89c6\u89c9\u4e16\u754c\u6a21\u578b\u89c4\u5212\u4e2d\u76f4\u63a5\u6309\u6700\u7ec8\u76ee\u6807\u56fe\u50cf\u6253\u5206\u4f1a\u9650\u5236\u957f\u7a0b\u63a7\u5236\uff0c\u56e0\u4e3a\u6709\u6548\u52a8\u4f5c\u6709\u65f6\u9700\u5148\u8fdc\u79bb\u76ee\u6807\u3002\u4f5c\u8005\u63d0\u51fa Anchored Planning\uff1a\u4ece\u7ecf\u9a8c\u4e2d\u68c0\u7d22\u4e0e\u5f53\u524d\u548c\u76ee\u6807\u76f8\u4f3c\u7684\u8f68\u8ff9\u7247\u6bb5\uff0c\u5e76\u5148\u7784\u51c6\u7247\u6bb5\u65e9\u671f\u7684\u89c2\u6d4b\u4f5c\u4e3a\u4e2d\u95f4\u76ee\u6807\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u4e16\u754c\u6a21\u578b\u63a7\u5236\u5931\u8d25\u4e0d\u4e00\u5b9a\u6e90\u4e8e\u6a21\u578b\u80fd\u529b\u4e0d\u8db3\uff0c\u800c\u53ef\u80fd\u6765\u81ea\u76ee\u6807\u8bbe\u5b9a\u65b9\u5f0f\uff1b\u901a\u8fc7\u7b80\u5355\u7684\u4e2d\u95f4\u76ee\u6807\u673a\u5236\u5373\u53ef\u663e\u8457\u589e\u5f3a\u51bb\u7ed3\u6a21\u578b\u7684\u957f\u7a0b\u89c4\u5212\u80fd\u529b\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "State tracking requires composing a sequence of updates, but accuracy alone does not reveal what a model has learned. We study neural networks trained to predict the running product of group elements. We identify quotient solutions in Transformers, where models recover the quotient class while predicting nearly uniformly among its members. The reciprocal of class size predicts partial accuracy without a fitted parameter, extending parity-based accounts to non-parity quotients. Our baseline Transformers\u0027 predictions change little under prefix reordering beyond the exact-tracking frontier. We prove that, for finite groups under uniform i.i.d. full-group inputs, optimal order-blind exact accuracy converges to the reciprocal of abelianization class size as prefix length grows, consistent with the observed abelianization plateaus. Sequential updates permit more: any partition into right cosets of a subgroup, normal or not, survives sequential updates. In our census of standard Transformers, every recovered coset partition comes from a normal subgroup, whereas parameter-matched recurrent networks pass through both normal and non-normal right-coset stages during training. On $A_5$, we identify low-dimensional subspaces of the recurrent state that encode non-normal cosets. In the three-dimensional cases, coset mean vectors form approximate dodecahedra, and swapping the state components in these subspaces transfers the donor\u0027s coset state through a shared input suffix. Our results connect partial accuracy, learning stages, and internal computation through the subgroup cosets that models learn to track.", "arxiv_id": "2609.29951", "arxiv_url": "https://arxiv.org/abs/2609.29951", "authors": ["Zhiyu Zhang", "Yupeng Li"], "brief": "\u672c\u6587\u7814\u7a76\u795e\u7ecf\u7f51\u7edc\u5728\u7fa4\u5143\u7d20\u5e8f\u5217\u4e58\u79ef\u9884\u6d4b\u4efb\u52a1\u4e2d\u7684\u72b6\u6001\u8ddf\u8e2a\u673a\u5236\uff0c\u53d1\u73b0\u6a21\u578b\u4e0d\u4e00\u5b9a\u7cbe\u786e\u8ddf\u8e2a\u5b8c\u6574\u72b6\u6001\uff0c\u800c\u5e38\u5b66\u4e60\u5546\u7ed3\u6784\u6216\u5b50\u7fa4\u53f3\u966a\u96c6\u3002\u4f5c\u8005\u7528\u4ee3\u6570\u89c6\u89d2\u89e3\u91ca\u90e8\u5206\u51c6\u786e\u7387\u3001\u8bad\u7ec3\u9636\u6bb5\u4e0e\u5185\u90e8\u8868\u5f81\u4e4b\u95f4\u7684\u5173\u7cfb\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29951", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 Transformer \u4e2d\u53d1\u73b0\u201c\u5546\u89e3\u201d\uff1a\u6a21\u578b\u6062\u590d\u5546\u7c7b\uff0c\u4f46\u5728\u7c7b\u5185\u6210\u5458\u95f4\u8fd1\u4f3c\u5747\u5300\u9884\u6d4b\uff0c\u7c7b\u5927\u5c0f\u5012\u6570\u53ef\u65e0\u53c2\u9884\u6d4b\u90e8\u5206\u51c6\u786e\u7387\u3002", "\u8bc1\u660e\u5728\u5747\u5300\u72ec\u7acb\u5168\u7fa4\u8f93\u5165\u4e0b\uff0c\u987a\u5e8f\u65e0\u5173\u7684\u6700\u4f18\u7cbe\u786e\u51c6\u786e\u7387\u968f\u524d\u7f00\u957f\u5ea6\u6536\u655b\u5230\u963f\u8d1d\u5c14\u5316\u7c7b\u5927\u5c0f\u7684\u5012\u6570\uff0c\u5bf9\u5e94\u5b9e\u9a8c\u4e2d\u7684\u5e73\u53f0\u73b0\u8c61\u3002", "\u5faa\u73af\u7f51\u7edc\u5728\u8bad\u7ec3\u4e2d\u4f1a\u7ecf\u8fc7\u6b63\u89c4\u4e0e\u975e\u6b63\u89c4\u53f3\u966a\u96c6\u9636\u6bb5\uff0c\u5e76\u5728 A5 \u7fa4\u4e0a\u53d1\u73b0\u7f16\u7801\u975e\u6b63\u89c4\u966a\u96c6\u7684\u4f4e\u7ef4\u72b6\u6001\u5b50\u7a7a\u95f4\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u72b6\u6001\u8ddf\u8e2a", "\u7fa4\u8bba", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29951v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Tracking States or Tracking Cosets? An Algebraic Account of Learned State Tracking", "tldr": "\u7528\u7fa4\u8bba\u63ed\u793a\u6a21\u578b\u5b66\u5230\u7684\u662f\u72b6\u6001\u8fd8\u662f\u966a\u96c6", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u795e\u7ecf\u7f51\u7edc\u5728\u7fa4\u5143\u7d20\u5e8f\u5217\u4e58\u79ef\u9884\u6d4b\u4efb\u52a1\u4e2d\u7684\u72b6\u6001\u8ddf\u8e2a\u673a\u5236\uff0c\u53d1\u73b0\u6a21\u578b\u4e0d\u4e00\u5b9a\u7cbe\u786e\u8ddf\u8e2a\u5b8c\u6574\u72b6\u6001\uff0c\u800c\u5e38\u5b66\u4e60\u5546\u7ed3\u6784\u6216\u5b50\u7fa4\u53f3\u966a\u96c6\u3002\u4f5c\u8005\u7528\u4ee3\u6570\u89c6\u89d2\u89e3\u91ca\u90e8\u5206\u51c6\u786e\u7387\u3001\u8bad\u7ec3\u9636\u6bb5\u4e0e\u5185\u90e8\u8868\u5f81\u4e4b\u95f4\u7684\u5173\u7cfb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u795e\u7ecf\u7f51\u7edc\u72b6\u6001\u8ddf\u8e2a\u7684\u201c\u90e8\u5206\u6b63\u786e\u201d\u73b0\u8c61\u4e0e\u7fa4\u8bba\u4e2d\u7684\u5546\u7fa4\u3001\u5b50\u7fa4\u966a\u96c6\u76f4\u63a5\u8054\u7cfb\u8d77\u6765\uff0c\u4e3a\u7406\u89e3 Transformer \u4e0e\u5faa\u73af\u7f51\u7edc\u7684\u5185\u90e8\u7b97\u6cd5\u63d0\u4f9b\u4e86\u53ef\u68c0\u9a8c\u7684\u4ee3\u6570\u6846\u67b6\u3002"}, {"abstract": "Looped Transformers have attracted substantial attention as a parameter-efficient approach to increasing computational depth through repeated application of shared Transformer blocks. However, their practical advantages over conventional Transformers remain under debate: each additional loop incurs another Transformer pass and requires caching another set of KV states, causing inference FLOPs and KV-cache memory to grow continuously with loop depth. This overhead becomes particularly severe at large loop counts and long context, preventing the parameter efficiency of Looped Transformers from translating into practical inference efficiency. In this paper, we find that much of the additional computation and storage introduced by looping is redundant. As recurrence proceeds, state changes become increasingly concentrated on a small subset of tokens; attention-output differences are dominated by a sparse and stable subset of key columns; and KV residuals between adjacent loops become progressively more amenable to low-bit quantization. Building on these observations, we introduce FlashLoop, a training-free inference framework that reduces cross-loop redundancy through token-sparse updates, sparse attention, and KV-residual quantization. Across several Looped Transformers models, \\textsc{FlashLoop} delivers lossless accuracy while achieving up to 1.64$\\times$ end-to-end speedup and up to 6$\\times$ KV-cache memory reduction, substantially improving the practicality of scaling Looped Transformers to greater computational depths and longer context.", "arxiv_id": "2609.29812", "arxiv_url": "https://arxiv.org/abs/2609.29812", "authors": ["Wanqi Yang", "Shiwei Liu"], "brief": "\u672c\u6587\u63d0\u51fa FlashLoop\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u5faa\u73af Transformer \u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u5229\u7528\u8de8\u5faa\u73af\u8ba1\u7b97\u4e0e KV \u7f13\u5b58\u4e2d\u7684\u5197\u4f59\uff0c\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u548c\u591a\u5faa\u73af\u573a\u666f\u4e0b\u7684\u5b9e\u9645\u63a8\u7406\u6548\u7387\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29812", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u5faa\u73af\u63a8\u8fdb\u540e\uff0c\u72b6\u6001\u53d8\u5316\u9010\u6e10\u96c6\u4e2d\u5728\u5c11\u91cf token \u4e0a\uff0c\u53ef\u8fdb\u884c token \u7a00\u758f\u66f4\u65b0", "\u6ce8\u610f\u529b\u8f93\u51fa\u5dee\u5f02\u4e3b\u8981\u7531\u7a00\u758f\u4e14\u7a33\u5b9a\u7684 key \u5217\u4e3b\u5bfc\uff0c\u53ef\u505a\u7a00\u758f\u6ce8\u610f\u529b\u8ba1\u7b97", "\u76f8\u90bb\u5faa\u73af\u95f4\u7684 KV \u6b8b\u5dee\u66f4\u6613\u4f4e\u6bd4\u7279\u91cf\u5316\uff0c\u6700\u9ad8\u5b9e\u73b0 1.64 \u500d\u7aef\u5230\u7aef\u52a0\u901f\u548c 6 \u500d KV-cache \u663e\u5b58\u964d\u4f4e"], "keywords": ["\u5faa\u73afTransformer", "\u63a8\u7406\u52a0\u901f", "KV\u7f13\u5b58", "\u7a00\u758f\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29812v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FlashLoop: Fast and Memory-Efficient Looped Transformers via Lazy Updates", "tldr": "FlashLoop\u8ba9\u5faa\u73afTransformer\u63a8\u7406\u66f4\u5feb\u66f4\u7701\u663e\u5b58", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa FlashLoop\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u5faa\u73af Transformer \u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u5229\u7528\u8de8\u5faa\u73af\u8ba1\u7b97\u4e0e KV \u7f13\u5b58\u4e2d\u7684\u5197\u4f59\uff0c\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u548c\u591a\u5faa\u73af\u573a\u666f\u4e0b\u7684\u5b9e\u9645\u63a8\u7406\u6548\u7387\u3002", "why_notable": "\u5faa\u73af Transformer \u4ee5\u53c2\u6570\u5171\u4eab\u6362\u53d6\u66f4\u6df1\u8ba1\u7b97\uff0c\u4f46\u63a8\u7406\u5f00\u9500\u548c KV \u7f13\u5b58\u968f\u5faa\u73af\u6df1\u5ea6\u589e\u957f\u3002FlashLoop \u5728\u4fdd\u6301\u65e0\u635f\u7cbe\u5ea6\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u8fd9\u4e9b\u6210\u672c\uff0c\u4f7f\u5faa\u73af Transformer \u66f4\u6709\u673a\u4f1a\u5728\u957f\u4e0a\u4e0b\u6587\u548c\u6df1\u8ba1\u7b97\u63a8\u7406\u4e2d\u5177\u5907\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Fully continuous diffusion language models (dLMs) denoise continuous representations without intermediate discretization, then decode all response tokens in parallel at the final step. Their performance on challenging reasoning tasks remains less established than that of autoregressive (AR) LLMs and masked dLMs. We scale Embedded Language Flows (ELF) to mathematical reasoning and code generation on GSM8K, MATH-500, HumanEval, and MBPP. We introduce ELF-REG, which improves learning with representation alignment and entanglement (REPA+REG), where a frozen AR teacher supervises intermediate denoiser features and supplies a global representation that is jointly denoised with the response. ELF-REG-L achieves 55.96% pass@1 on GSM8K at 64 network function evaluations (NFE), and 13.39% on MATH-500 and 22.56% on HumanEval at 128 NFE. It outperforms the evaluated comparable-scale dLMs in pass@1 on GSM8K and code, and improves MATH-500 pass@1 from 10.55% for the ELF-L baseline to 13.39% with ELF-REG-L. Without few-step training, the same task-specific checkpoints support strong low-NFE performance through early-stop, which decodes an intermediate clean prediction without completing the denoising trajectory. At 16 NFE, ELF-REG-L reaches 41.21% HumanEval pass@10, outperforming recent continuous dLMs of comparable scale.", "arxiv_id": "2609.29102", "arxiv_url": "https://arxiv.org/abs/2609.29102", "authors": ["Zeyu Michael Li", "William Xingxu Chen", "Bingshuo Qian", "Jiayin Liu", "Xiang Cheng"], "brief": "\u8bba\u6587\u5c06\u5168\u8fde\u7eed\u6269\u6563\u8bed\u8a00\u6a21\u578b ELF \u6269\u5c55\u5230\u6570\u5b66\u63a8\u7406\u548c\u4ee3\u7801\u751f\u6210\uff0c\u5e76\u63d0\u51fa ELF-REG\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u51bb\u7ed3\u81ea\u56de\u5f52\u6559\u5e08\u6a21\u578b\u5bf9\u4e2d\u95f4\u53bb\u566a\u7279\u5f81\u8fdb\u884c\u8868\u793a\u5bf9\u9f50\uff0c\u5e76\u8054\u5408\u53bb\u566a\u5168\u5c40\u8868\u793a\u6765\u63d0\u5347\u5b66\u4e60\u6548\u679c\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29102", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165 REPA+REG\uff1a\u7528\u81ea\u56de\u5f52\u6559\u5e08\u76d1\u7763\u4e2d\u95f4 denoiser \u8868\u5f81\uff0c\u5e76\u63d0\u4f9b\u4e0e\u56de\u7b54\u5171\u540c\u53bb\u566a\u7684\u5168\u5c40\u8868\u793a\u3002", "ELF-REG-L \u5728 GSM8K 64 NFE \u8fbe\u5230 55.96% pass@1\uff0cMATH-500 128 NFE \u8fbe\u5230 13.39%\uff0cHumanEval 128 NFE \u8fbe\u5230 22.56%\u3002", "\u65e0\u9700\u5c11\u6b65\u8bad\u7ec3\u5373\u53ef\u901a\u8fc7 early-stop \u5728\u4f4e NFE \u4e0b\u89e3\u7801\u4e2d\u95f4\u5e72\u51c0\u9884\u6d4b\uff1b16 NFE \u65f6 HumanEval pass@10 \u8fbe\u5230 41.21%\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29102v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ELF-REG: Scaling Continuous Diffusion Language Models to Reasoning Tasks", "tldr": "\u8fde\u7eed\u6269\u6563\u8bed\u8a00\u6a21\u578b\u6269\u5c55\u5230\u63a8\u7406\u4e0e\u4ee3\u7801\u4efb\u52a1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u5168\u8fde\u7eed\u6269\u6563\u8bed\u8a00\u6a21\u578b ELF \u6269\u5c55\u5230\u6570\u5b66\u63a8\u7406\u548c\u4ee3\u7801\u751f\u6210\uff0c\u5e76\u63d0\u51fa ELF-REG\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u51bb\u7ed3\u81ea\u56de\u5f52\u6559\u5e08\u6a21\u578b\u5bf9\u4e2d\u95f4\u53bb\u566a\u7279\u5f81\u8fdb\u884c\u8868\u793a\u5bf9\u9f50\uff0c\u5e76\u8054\u5408\u53bb\u566a\u5168\u5c40\u8868\u793a\u6765\u63d0\u5347\u5b66\u4e60\u6548\u679c\u3002", "why_notable": "\u8fd9\u8868\u660e\u5168\u8fde\u7eed\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4e0d\u4ec5\u80fd\u5e76\u884c\u751f\u6210\u6587\u672c\uff0c\u4e5f\u5f00\u59cb\u5728\u6570\u5b66\u63a8\u7406\u548c\u4ee3\u7801\u751f\u6210\u7b49\u4f20\u7edf\u81ea\u56de\u5f52\u6a21\u578b\u4f18\u52bf\u4efb\u52a1\u4e0a\u5177\u5907\u7ade\u4e89\u529b\uff0c\u4e3a\u975e\u81ea\u56de\u5f52\u8bed\u8a00\u6a21\u578b\u6269\u5c55\u63d0\u4f9b\u4e86\u91cd\u8981\u8bc1\u636e\u3002"}, {"abstract": "We propose the Representation World Model (RWM), which learns states, transitions, and executable plans directly in representation space. Unlike existing world models that typically learn latent representations together with explicit dynamics models and perform planning through search, optimization, or policy-based prediction, RWM directly incorporates planning into the learned representation geometry. RWM learns the representation geometry by applying inverse-dynamics supervision locally along latent paths constructed from endpoint representations, requiring these paths to preserve task-relevant state and transition information. At inference, planning is performed by directly constructing a latent path between the current and goal representations, with inverse dynamics used to recover the corresponding actions, without recursive rollouts or action-space search. Experiments on continuous-control benchmarks demonstrate the effectiveness of RWM for direct planning, while results on robotic manipulation further show its potential to extend to more complex embodied control tasks. These results suggest that planning directly in representation space provides a promising alternative to conventional world-model planning.", "arxiv_id": "2609.29171", "arxiv_url": "https://arxiv.org/abs/2609.29171", "authors": ["Yijun Yuan", "Weicheng Zheng", "Weibang Wang", "Minghui Qin", "Chang Sun", "Junhao Huang", "Kenan Li", "Anmin Liu", "Yicheng Yao", "Hang Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa Representation World Model\uff08RWM\uff09\uff0c\u5728\u8868\u5f81\u7a7a\u95f4\u4e2d\u540c\u65f6\u5b66\u4e60\u72b6\u6001\u3001\u8f6c\u79fb\u4e0e\u53ef\u6267\u884c\u8ba1\u5212\u3002\u5b83\u65e0\u9700\u663e\u5f0f\u52a8\u529b\u5b66\u9012\u5f52 rollout \u6216\u52a8\u4f5c\u7a7a\u95f4\u641c\u7d22\uff0c\u800c\u662f\u901a\u8fc7\u6784\u9020\u5f53\u524d\u72b6\u6001\u5230\u76ee\u6807\u72b6\u6001\u7684\u6f5c\u5728\u8def\u5f84\uff0c\u5e76\u7528\u9006\u52a8\u529b\u5b66\u6062\u590d\u52a8\u4f5c\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29171", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u7aef\u70b9\u8868\u5f81\u6784\u9020\u6f5c\u5728\u8def\u5f84\uff0c\u5e76\u901a\u8fc7\u5c40\u90e8\u9006\u52a8\u529b\u5b66\u76d1\u7763\u7ea6\u675f\u5176\u4fdd\u7559\u4efb\u52a1\u76f8\u5173\u7684\u72b6\u6001\u4e0e\u8f6c\u79fb\u4fe1\u606f", "\u63a8\u7406\u65f6\u76f4\u63a5\u5728\u8868\u5f81\u51e0\u4f55\u4e2d\u8fde\u63a5\u5f53\u524d\u4e0e\u76ee\u6807\u8868\u5f81\uff0c\u5b9e\u73b0\u65e0\u641c\u7d22\u3001\u65e0\u9012\u5f52 rollout \u7684\u89c4\u5212", "\u5728\u8fde\u7eed\u63a7\u5236\u57fa\u51c6\u4e0a\u9a8c\u8bc1\u76f4\u63a5\u89c4\u5212\u6548\u679c\uff0c\u5e76\u5728\u673a\u5668\u4eba\u64cd\u4f5c\u4efb\u52a1\u4e2d\u5c55\u793a\u6269\u5c55\u6f5c\u529b"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u673a\u5668\u4eba", "\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29171v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Representation World Model: Learning States, Transition and Executable Plans in Representation", "tldr": "\u5728\u8868\u5f81\u7a7a\u95f4\u4e2d\u76f4\u63a5\u5b66\u4e60\u53ef\u6267\u884c\u89c4\u5212", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Representation World Model\uff08RWM\uff09\uff0c\u5728\u8868\u5f81\u7a7a\u95f4\u4e2d\u540c\u65f6\u5b66\u4e60\u72b6\u6001\u3001\u8f6c\u79fb\u4e0e\u53ef\u6267\u884c\u8ba1\u5212\u3002\u5b83\u65e0\u9700\u663e\u5f0f\u52a8\u529b\u5b66\u9012\u5f52 rollout \u6216\u52a8\u4f5c\u7a7a\u95f4\u641c\u7d22\uff0c\u800c\u662f\u901a\u8fc7\u6784\u9020\u5f53\u524d\u72b6\u6001\u5230\u76ee\u6807\u72b6\u6001\u7684\u6f5c\u5728\u8def\u5f84\uff0c\u5e76\u7528\u9006\u52a8\u529b\u5b66\u6062\u590d\u52a8\u4f5c\u3002", "why_notable": "\u5b83\u628a\u89c4\u5212\u80fd\u529b\u5185\u5d4c\u5230\u8868\u5f81\u51e0\u4f55\u4e2d\uff0c\u4e3a\u4f20\u7edf\u4e16\u754c\u6a21\u578b\u4f9d\u8d56\u663e\u5f0f\u52a8\u529b\u5b66\u5efa\u6a21\u4e0e\u641c\u7d22\u4f18\u5316\u63d0\u4f9b\u4e86\u66ff\u4ee3\u8def\u7ebf\uff0c\u53ef\u80fd\u63d0\u5347\u673a\u5668\u4eba\u63a7\u5236\u4e2d\u76ee\u6807\u5bfc\u5411\u89c4\u5212\u7684\u6548\u7387\u4e0e\u7b80\u6d01\u6027\u3002"}, {"abstract": "Vision-Language Models (VLMs) describe scenes well but reason poorly about metric 3D structure such as absolute distances, physical sizes, or egocentric directions. We present a modular, predictor agnostic, tool-augmented framework that equips a small VLM (Qwen3.5-4B) with geometric tools: 3D object detection, metric depth estimation, and deterministic solvers for distance, size and bearing. Each object is detected in the camera frame of its own best view, and the tools use that frame\u0027s pose to lift every detection into one shared world frame. Moving metric computation out of the model\u0027s weights and into explicit solvers yields large gains on three of four ReVSI-Bench tasks: with a strong monocular detector (WildDet3D), absolute distance rises from 0.46 to 0.74 Mean Relative Accuracy (MRA), relative distance from 39.1% to 67.4%, and relative direction from a below-chance 25.9% to 73.4%. Because any detector can be swapped in behind the tool interface, comparing real detectors against ground-truth boxes separates perception error from reasoning error: orchestration costs only 0.03 MRA. Object size is bounded by the detector: the tools are near-exact on groundtruth boxes (0.97) yet the best real detector barely beats the no-tool baseline (0.61 vs. 0.58), because size reads straight off a box extent monocular detectors get wrong. Without a predefined recipe, the model already sequences the tools correctly on its own, matching a scripted pipeline on three of four tasks.", "arxiv_id": "2609.29073", "arxiv_url": "https://arxiv.org/abs/2609.29073", "authors": ["Kai Glantz", "Clemens Grange"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u6a21\u5757\u5316\u3001\u4e0e\u9884\u6d4b\u5668\u65e0\u5173\u7684\u5de5\u5177\u589e\u5f3a\u6846\u67b6\uff0c\u4e3a\u5c0f\u578bVLM\u63a5\u51653D\u68c0\u6d4b\u3001\u5ea6\u91cf\u6df1\u5ea6\u4f30\u8ba1\u548c\u786e\u5b9a\u6027\u51e0\u4f55\u6c42\u89e3\u5668\uff0c\u7528\u4e8e\u8ddd\u79bb\u3001\u5c3a\u5bf8\u548c\u65b9\u4f4d\u63a8\u7406\u3002\u6838\u5fc3\u601d\u60f3\u662f\u628a\u5ea6\u91cf\u8ba1\u7b97\u4ece\u6a21\u578b\u53c2\u6570\u4e2d\u79fb\u5230\u663e\u5f0f\u51e0\u4f55\u5de5\u5177\u4e2d\uff0c\u5e76\u7edf\u4e00\u5230\u5171\u4eab\u4e16\u754c\u5750\u6807\u7cfb\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29073", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5728ReVSI-Bench\u4e0a\u663e\u8457\u63d0\u5347\u4e09\u7c7b\u4efb\u52a1\uff1a\u7edd\u5bf9\u8ddd\u79bbMRA\u4ece0.46\u52300.74\uff0c\u76f8\u5bf9\u8ddd\u79bb\u4ece39.1%\u523067.4%\uff0c\u76f8\u5bf9\u65b9\u5411\u4ece25.9%\u523073.4%\u3002", "\u901a\u8fc7\u53ef\u66ff\u6362\u68c0\u6d4b\u5668\u63a5\u53e3\uff0c\u5bf9\u6bd4\u771f\u5b9e\u68c0\u6d4b\u6846\u4e0e\u771f\u503c\u6846\uff0c\u533a\u5206\u611f\u77e5\u8bef\u5dee\u548c\u63a8\u7406\u8bef\u5dee\uff1b\u5de5\u5177\u7f16\u6392\u672c\u8eab\u4ec5\u5e26\u67650.03 MRA\u635f\u5931\u3002", "\u7269\u4f53\u5c3a\u5bf8\u4efb\u52a1\u4e3b\u8981\u53d7\u5355\u76ee3D\u68c0\u6d4b\u6846\u7cbe\u5ea6\u9650\u5236\uff1a\u771f\u503c\u6846\u4e0b\u63a5\u8fd1\u5b8c\u7f8e0.97\uff0c\u4f46\u6700\u4f73\u771f\u5b9e\u68c0\u6d4b\u5668\u4ec5\u4ece0.58\u63d0\u5347\u52300.61\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5de5\u5177\u4f7f\u7528", "\u4e09\u7ef4\u611f\u77e5", "\u7a7a\u95f4\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29073v1", "published_at": "2026-09-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Seeing Is Not Measuring: Tool-Augmented Metric Spatial Reasoning for Vision-Language Models", "tldr": "\u7528\u51e0\u4f55\u5de5\u5177\u63d0\u5347VLM\u5ea6\u91cf\u7a7a\u95f4\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u6a21\u5757\u5316\u3001\u4e0e\u9884\u6d4b\u5668\u65e0\u5173\u7684\u5de5\u5177\u589e\u5f3a\u6846\u67b6\uff0c\u4e3a\u5c0f\u578bVLM\u63a5\u51653D\u68c0\u6d4b\u3001\u5ea6\u91cf\u6df1\u5ea6\u4f30\u8ba1\u548c\u786e\u5b9a\u6027\u51e0\u4f55\u6c42\u89e3\u5668\uff0c\u7528\u4e8e\u8ddd\u79bb\u3001\u5c3a\u5bf8\u548c\u65b9\u4f4d\u63a8\u7406\u3002\u6838\u5fc3\u601d\u60f3\u662f\u628a\u5ea6\u91cf\u8ba1\u7b97\u4ece\u6a21\u578b\u53c2\u6570\u4e2d\u79fb\u5230\u663e\u5f0f\u51e0\u4f55\u5de5\u5177\u4e2d\uff0c\u5e76\u7edf\u4e00\u5230\u5171\u4eab\u4e16\u754c\u5750\u6807\u7cfb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660eVLM\u76843D\u5ea6\u91cf\u7a7a\u95f4\u63a8\u7406\u77ed\u677f\u4e0d\u4e00\u5b9a\u8981\u9760\u66f4\u5927\u6a21\u578b\u6216\u7aef\u5230\u7aef\u8bad\u7ec3\u89e3\u51b3\uff0c\u663e\u5f0f\u51e0\u4f55\u5de5\u5177\u80fd\u5e26\u6765\u53ef\u89e3\u91ca\u3001\u53ef\u66ff\u6362\u4e14\u9ad8\u6548\u7684\u6027\u80fd\u63d0\u5347\uff0c\u5e76\u80fd\u8bca\u65ad\u611f\u77e5\u4e0e\u63a8\u7406\u74f6\u9888\u3002"}, {"abstract": "A generative search answer can cite a supported passage yet omit a source relationship that changes its interpretation. We specify a claim-gated audit of the query-source-answer tuple. An omission is resolved only when relationship evidence, answer adoption, materiality, and disclosure are all observed; incomplete evidence remains unresolved rather than being treated as independence. The specification separates this endpoint from citation support and review priority, and binds decisions to versioned evidence spans. A reference checker makes the record contract executable. On an exhaustive synthetic suite, it reproduces all 81 three-state predicate combinations and rejects 192 deliberately malformed records. Common-guard baselines and predicate ablations isolate endpoint logic from missing-evidence handling, while controlled transitions check support separation and evidence removal. These are finite contract-conformance results, not detector accuracy or evidence of improved user outcomes. We define the independent annotation, held-out evaluation, and paired utility tests still required to establish semantic validity and deployment benefit.", "arxiv_id": "2609.29145", "arxiv_url": "https://arxiv.org/abs/2609.29145", "authors": ["Kainan Zhou", "Chuhong Xu", "Gangzhen Qian", "Zhaoyi Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u751f\u6210\u5f0f\u641c\u7d22\u7684\u201c\u67e5\u8be2-\u6765\u6e90-\u7b54\u6848\u201d\u5ba1\u8ba1\u89c4\u8303\uff0c\u7528\u4e8e\u8bc6\u522b\u7b54\u6848\u867d\u6709\u5f15\u7528\u652f\u6301\u3001\u5374\u9057\u6f0f\u4f1a\u6539\u53d8\u89e3\u91ca\u7684\u6765\u6e90\u5173\u7cfb\u3002\u8be5\u65b9\u6cd5\u5c06\u5173\u7cfb\u8bc1\u636e\u3001\u7b54\u6848\u91c7\u7eb3\u3001\u91cd\u8981\u6027\u4e0e\u62ab\u9732\u56db\u7c7b\u6761\u4ef6\u540c\u65f6\u6ee1\u8db3\u4f5c\u4e3a\u5df2\u89e3\u51b3\u9057\u6f0f\uff0c\u5e76\u628a\u8bc1\u636e\u7ed1\u5b9a\u5230\u7248\u672c\u5316\u6587\u672c\u7247\u6bb5\u3002", "categories": ["cs.AI", "cs.CC", "cs.CE", "cs.ET", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29145", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u533a\u5206\u201c\u5f15\u7528\u662f\u5426\u652f\u6301\u7b54\u6848\u201d\u4e0e\u201c\u662f\u5426\u5b58\u5728\u672a\u62ab\u9732\u7684\u6765\u6e90\u5173\u7cfb\u98ce\u9669\u201d\uff0c\u907f\u514d\u628a\u7f3a\u5931\u8bc1\u636e\u8bef\u5224\u4e3a\u6765\u6e90\u72ec\u7acb", "\u5b9e\u73b0\u4e86\u4e00\u4e2a\u53c2\u8003\u68c0\u67e5\u5668\uff0c\u4f7f\u5ba1\u8ba1\u8bb0\u5f55\u5951\u7ea6\u53ef\u6267\u884c\uff0c\u5e76\u5728\u5408\u6210\u6d4b\u8bd5\u96c6\u4e2d\u8986\u76d681\u79cd\u4e09\u72b6\u6001\u8c13\u8bcd\u7ec4\u5408", "\u660e\u786e\u5f53\u524d\u7ed3\u679c\u53ea\u662f\u6709\u9650\u5951\u7ea6\u4e00\u81f4\u6027\u9a8c\u8bc1\uff0c\u4e0d\u4ee3\u8868\u68c0\u6d4b\u51c6\u786e\u7387\u6216\u7528\u6237\u6548\u679c\u63d0\u5347\uff0c\u4ecd\u9700\u72ec\u7acb\u6807\u6ce8\u548c\u6548\u7528\u6d4b\u8bd5"], "keywords": ["\u751f\u6210\u5f0f\u641c\u7d22", "\u4fe1\u606f\u68c0\u7d22", "\u53ef\u4fe1AI", "\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29145v1", "published_at": "2026-09-24", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Claim-Gated Source-Risk Auditing for Generative Search", "tldr": "\u4e3a\u751f\u6210\u5f0f\u641c\u7d22\u63d0\u51fa\u58f0\u660e\u95e8\u63a7\u6765\u6e90\u98ce\u9669\u5ba1\u8ba1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u751f\u6210\u5f0f\u641c\u7d22\u7684\u201c\u67e5\u8be2-\u6765\u6e90-\u7b54\u6848\u201d\u5ba1\u8ba1\u89c4\u8303\uff0c\u7528\u4e8e\u8bc6\u522b\u7b54\u6848\u867d\u6709\u5f15\u7528\u652f\u6301\u3001\u5374\u9057\u6f0f\u4f1a\u6539\u53d8\u89e3\u91ca\u7684\u6765\u6e90\u5173\u7cfb\u3002\u8be5\u65b9\u6cd5\u5c06\u5173\u7cfb\u8bc1\u636e\u3001\u7b54\u6848\u91c7\u7eb3\u3001\u91cd\u8981\u6027\u4e0e\u62ab\u9732\u56db\u7c7b\u6761\u4ef6\u540c\u65f6\u6ee1\u8db3\u4f5c\u4e3a\u5df2\u89e3\u51b3\u9057\u6f0f\uff0c\u5e76\u628a\u8bc1\u636e\u7ed1\u5b9a\u5230\u7248\u672c\u5316\u6587\u672c\u7247\u6bb5\u3002", "why_notable": "\u751f\u6210\u5f0f\u641c\u7d22\u8d8a\u6765\u8d8a\u4f9d\u8d56\u5f15\u7528\u6765\u5efa\u7acb\u53ef\u4fe1\u5ea6\uff0c\u4f46\u5f15\u7528\u672c\u8eab\u65e0\u6cd5\u63ed\u793a\u6765\u6e90\u5173\u7cfb\u3001\u5229\u76ca\u5173\u8054\u6216\u89e3\u91ca\u6027\u504f\u5dee\u3002\u8be5\u5de5\u4f5c\u628a\u8fd9\u7c7b\u98ce\u9669\u5f62\u5f0f\u5316\u4e3a\u53ef\u5ba1\u8ba1\u5951\u7ea6\uff0c\u4e3a\u641c\u7d22\u7b54\u6848\u7684\u900f\u660e\u5ea6\u8bc4\u4f30\u548c\u540e\u7eed\u6cbb\u7406\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u6846\u67b6\u3002"}, {"abstract": "Video understanding is increasingly performed by multi-stage LLM agents that separate temporal grounding, visual observation, and reasoning. Yet these stages are typically evaluated on different benchmarks and distributions, making it difficult to determine where hallucinations originate. We first organize existing benchmarks around these stages and show that their scores provide inconsistent diagnostic signals: stronger stage-level performance does not reliably imply lower downstream hallucination, and even benchmarks targeting the same capability can disagree. We therefore introduce a causal stage-intervention protocol that overwrites individual stages while holding the downstream task fixed. Across 60,008 runs on three video-agent architectures, we find that grounding is the dominant source of downstream error, with roughly four times the causal impact of corrupting visual observations. Successful grounding depends primarily on locating the correct region rather than precise temporal overlap, explaining why standard mIoU metrics poorly predict downstream reliability. We further find that incorrect evidence is substantially more harmful than missing evidence. Finally, auditing existing benchmarks against these interventions reveals that their scores do not reliably predict causal cascade sensitivity and can fail under distribution shift. These results motivate intervention-based, stage-aware evaluation for trustworthy video agents.", "arxiv_id": "2609.28991", "arxiv_url": "https://arxiv.org/abs/2609.28991", "authors": ["Shuzhi Gong", "Fengze Sun", "Yuansan Liu"], "brief": "\u672c\u6587\u91cd\u65b0\u5ba1\u89c6\u89c6\u9891\u7406\u89e3\u6a21\u578b\u7684\u5e7b\u89c9\u8bc4\u4f30\uff0c\u6307\u51fa\u73b0\u6709\u5206\u9636\u6bb5\u57fa\u51c6\u5206\u6570\u4e0e\u4e0b\u6e38\u5e7b\u89c9\u5e76\u4e0d\u7a33\u5b9a\u76f8\u5173\uff0c\u96be\u4ee5\u5b9a\u4f4d\u9519\u8bef\u6765\u6e90\u3002\u4f5c\u8005\u63d0\u51fa\u56e0\u679c\u9636\u6bb5\u5e72\u9884\u534f\u8bae\uff0c\u5728\u56fa\u5b9a\u4e0b\u6e38\u4efb\u52a1\u65f6\u66ff\u6362\u5355\u4e2a\u9636\u6bb5\uff0c\u53d1\u73b0\u65f6\u95f4/\u533a\u57df\u5b9a\u4f4d\u662f\u4e3b\u8981\u9519\u8bef\u6e90\uff0c\u5176\u5f71\u54cd\u7ea6\u4e3a\u89c6\u89c9\u89c2\u5bdf\u9519\u8bef\u76844\u500d\uff0c\u4e14\u9519\u8bef\u8bc1\u636e\u6bd4\u7f3a\u5931\u8bc1\u636e\u66f4\u6709\u5bb3\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28991", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u5e7b\u89c9\u8bc4\u4f30", "\u56e0\u679c\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28991v1", "published_at": "2026-09-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beneath the Scores: Rethinking Hallucination Evaluation for Video Understanding Models", "tldr": "\u672c\u6587\u91cd\u65b0\u5ba1\u89c6\u89c6\u9891\u7406\u89e3\u6a21\u578b\u7684\u5e7b\u89c9\u8bc4\u4f30\uff0c\u6307\u51fa\u73b0\u6709\u5206\u9636\u6bb5\u57fa\u51c6\u5206\u6570\u4e0e\u4e0b\u6e38\u5e7b\u89c9\u5e76\u4e0d\u7a33\u5b9a\u76f8\u5173\uff0c\u96be\u4ee5\u5b9a\u4f4d\u9519\u8bef\u6765\u6e90\u3002\u4f5c\u8005\u63d0\u51fa\u56e0\u679c\u9636\u6bb5\u5e72\u9884\u534f\u8bae\uff0c\u5728\u56fa\u5b9a\u4e0b\u6e38\u4efb\u52a1\u65f6\u66ff\u6362\u5355\u4e2a\u9636\u6bb5\uff0c\u53d1\u73b0\u65f6\u95f4/\u533a\u57df\u5b9a\u4f4d\u662f\u4e3b\u8981\u9519\u8bef\u6e90\uff0c\u5176\u5f71\u54cd\u7ea6\u4e3a\u89c6\u89c9\u89c2\u5bdf\u9519\u8bef\u76844\u500d\uff0c\u4e14\u9519\u8bef\u8bc1\u636e\u6bd4\u7f3a\u5931\u8bc1\u636e\u66f4\u6709\u5bb3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conspiratorial discourse on social media is not always expressed through explicit claims or stable lexical markers. The same surface content may express endorsement, legitimate concerns, criticism, satire, or mockery. The main challenge is therefore not only recognizing conspiracy-related claims, but inferring the speaker\u0027s intent -- the utterance\u0027s illocutionary force. We argue that this can be achieved through the use of relevant social contexts and propose an agentic framework, equipped with a set of tools supporting social queries. We demonstrate the benefits of our approach on a unique dataset of Hebrew tweets, covering 80\\%--90\\% of the public Hebrew tweets published over a four-year span (late 2018-- early 2023), encompassing several election cycles as well as the COVID pandemic years and related vaccination campaigns. This extensive coverage can be used in recovering different social contexts. Evaluating our framework on a manually-annotated adversarial dataset, we find that context-aware workflows consistently outperform text-only classification and that the agentic framework performs significantly better than other frameworks and settings, including a non-agentic model exposed to the same contexts available to the agent. We further provide an analysis of the results, the errors and efficiency (token economy) tradeoffs. These findings support viewing the task of conspiracy detection as a socially embedded interpretation task, in which effective classification depends not only on access to contexts, but also on adaptive reasoning in which the agent uses tools on a per-case basis, asking only for evidence relevant to its current reasoning step.", "arxiv_id": "2609.30250", "arxiv_url": "https://arxiv.org/abs/2609.30250", "authors": ["Lior Biton", "Oren Tsur"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5e26\u5de5\u5177\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u6309\u9700\u67e5\u8be2\u793e\u4ea4\u4e0a\u4e0b\u6587\u6765\u68c0\u6d4b\u793e\u4ea4\u5a92\u4f53\u4e2d\u7684\u9634\u8c0b\u8bba\u8868\u8fbe\uff0c\u91cd\u70b9\u5224\u65ad\u8bf4\u8bdd\u8005\u610f\u56fe\u800c\u975e\u4ec5\u8bc6\u522b\u8868\u9762\u6587\u672c\u3002\u5728\u5e0c\u4f2f\u6765\u8bed\u63a8\u6587\u6570\u636e\u96c6\u4e0a\u7684\u4eba\u5de5\u5bf9\u6297\u8bc4\u6d4b\u4e2d\uff0c\u57fa\u4e8e\u4e0a\u4e0b\u6587\u7684\u6d41\u7a0b\u4f18\u4e8e\u7eaf\u6587\u672c\u5206\u7c7b\uff0c\u667a\u80fd\u4f53\u6846\u67b6\u4e5f\u663e\u8457\u4f18\u4e8e\u4f7f\u7528\u76f8\u540c\u4e0a\u4e0b\u6587\u7684\u975e\u667a\u80fd\u4f53\u6a21\u578b\uff0c\u5e76\u5206\u6790\u4e86\u9519\u8bef\u4e0e token \u6210\u672c\u6743\u8861\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30250", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6587\u672c\u5206\u7c7b", "\u793e\u4ea4\u5a92\u4f53", "\u4e0a\u4e0b\u6587\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30250v1", "published_at": "2026-09-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Detection of Online Conspiracies", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5e26\u5de5\u5177\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u6309\u9700\u67e5\u8be2\u793e\u4ea4\u4e0a\u4e0b\u6587\u6765\u68c0\u6d4b\u793e\u4ea4\u5a92\u4f53\u4e2d\u7684\u9634\u8c0b\u8bba\u8868\u8fbe\uff0c\u91cd\u70b9\u5224\u65ad\u8bf4\u8bdd\u8005\u610f\u56fe\u800c\u975e\u4ec5\u8bc6\u522b\u8868\u9762\u6587\u672c\u3002\u5728\u5e0c\u4f2f\u6765\u8bed\u63a8\u6587\u6570\u636e\u96c6\u4e0a\u7684\u4eba\u5de5\u5bf9\u6297\u8bc4\u6d4b\u4e2d\uff0c\u57fa\u4e8e\u4e0a\u4e0b\u6587\u7684\u6d41\u7a0b\u4f18\u4e8e\u7eaf\u6587\u672c\u5206\u7c7b\uff0c\u667a\u80fd\u4f53\u6846\u67b6\u4e5f\u663e\u8457\u4f18\u4e8e\u4f7f\u7528\u76f8\u540c\u4e0a\u4e0b\u6587\u7684\u975e\u667a\u80fd\u4f53\u6a21\u578b\uff0c\u5e76\u5206\u6790\u4e86\u9519\u8bef\u4e0e token \u6210\u672c\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) typically exhibit a performance profile where reliability degrades as task complexity increases. We address the challenge of generating high-quality natural language executable plans for complex tasks by introducing $\\textbf{GRASP}$, a strategy-aware, multi-stage planning framework. GRASP decouples the planning pipeline across specialized, context-isolated modules: it pre-compiles global macro-guidelines (GenPlan), explores alternative localized strategies within isolated context windows (RevPlan), and independently evaluates trajectories using a multi-criteria discriminator (VerPlan). Empirical evaluations show that GRASP consistently establishes a new state-of-the-art frontier across diverse datasets, yielding substantial accuracy gains over direct LLM planners on Natural Plan Calendar Scheduling ($\\sim$12.4$\\%$$\\uparrow$), ZebraLogic ($\\sim$30.8$\\%$$\\uparrow$), and SciBench Math. Crucially, under multi-task scaling-where standard planners suffer immediate performance collapse-GRASP completely flattens the multi-task degradation penalty. In interleaved dual-task environments, GRASP achieves an absolute accuracy gain of up to 16.7$\\%$ over direct LLM planners. Furthermore, by isolating context and enforcing strict macro-regularization, GRASP outperforms frontier reasoning models (such as GPT-5-mini) by a margin of 14.5$\\%$.", "arxiv_id": "2609.30147", "arxiv_url": "https://arxiv.org/abs/2609.30147", "authors": ["Arunabh Srivastava", "Mohammad A.", "Khojastepour", "Srimat Chakradhar", "Sennur Ulukus"], "brief": "\u672c\u6587\u63d0\u51fa GRASP\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742\u4efb\u52a1\u81ea\u7136\u8bed\u8a00\u53ef\u6267\u884c\u8ba1\u5212\u751f\u6210\u7684\u591a\u9636\u6bb5\u667a\u80fd\u4f53\u89c4\u5212\u6846\u67b6\uff0c\u5c06\u5b8f\u89c2\u7b56\u7565\u751f\u6210\u3001\u5c40\u90e8\u65b9\u6848\u4fee\u8ba2\u548c\u591a\u51c6\u5219\u9a8c\u8bc1\u89e3\u8026\u5230\u9694\u79bb\u4e0a\u4e0b\u6587\u6a21\u5757\u4e2d\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u65e5\u7a0b\u89c4\u5212\u3001\u903b\u8f91\u63a8\u7406\u548c\u6570\u5b66\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u76f4\u63a5 LLM \u89c4\u5212\u5668\uff0c\u5e76\u5728\u591a\u4efb\u52a1\u4ea4\u9519\u573a\u666f\u4e2d\u51e0\u4e4e\u6d88\u9664\u4e86\u6027\u80fd\u9000\u5316\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30147", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c4\u5212", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30147v1", "published_at": "2026-09-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "GRASP: Generating, Revising, and Assessing for Strategic Planning with Agentic AI", "tldr": "\u672c\u6587\u63d0\u51fa GRASP\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742\u4efb\u52a1\u81ea\u7136\u8bed\u8a00\u53ef\u6267\u884c\u8ba1\u5212\u751f\u6210\u7684\u591a\u9636\u6bb5\u667a\u80fd\u4f53\u89c4\u5212\u6846\u67b6\uff0c\u5c06\u5b8f\u89c2\u7b56\u7565\u751f\u6210\u3001\u5c40\u90e8\u65b9\u6848\u4fee\u8ba2\u548c\u591a\u51c6\u5219\u9a8c\u8bc1\u89e3\u8026\u5230\u9694\u79bb\u4e0a\u4e0b\u6587\u6a21\u5757\u4e2d\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u65e5\u7a0b\u89c4\u5212\u3001\u903b\u8f91\u63a8\u7406\u548c\u6570\u5b66\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u76f4\u63a5 LLM \u89c4\u5212\u5668\uff0c\u5e76\u5728\u591a\u4efb\u52a1\u4ea4\u9519\u573a\u666f\u4e2d\u51e0\u4e4e\u6d88\u9664\u4e86\u6027\u80fd\u9000\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study a matching mechanism where agents and objects are described by features rather than complete rankings. A single spectral projection reduces the problem to a one-dimensional sort, computable in O(N log N) time. We prove that on descaled features and preferences, our algorithm obtains the exact Nash Social Welfare (NSW) optimum within the projected space, with an unconditional utilitarian-welfare guarantee and a conditional NSW guarantee. The proposed mechanism is stable against exogenous noise but not strategy-proof; we provide an explicit profitable misreport. On an agentic AI shopping application, the diagnostics correctly anticipate both a success and a failure case. A 100-instance robustness study confirms the findings.", "arxiv_id": "2609.29958", "arxiv_url": "https://arxiv.org/abs/2609.29958", "authors": ["Irene Aldridge"], "brief": "\u672c\u6587\u7814\u7a76\u57fa\u4e8e\u7279\u5f81\u800c\u975e\u5b8c\u6574\u6392\u5e8f\u7684\u591a\u7ef4\u5339\u914d\u673a\u5236\uff0c\u901a\u8fc7\u4e00\u6b21\u8c31\u6295\u5f71\u5c06\u95ee\u9898\u5316\u4e3a\u4e00\u7ef4\u6392\u5e8f\uff0c\u5e76\u53ef\u5728 O(N log N) \u65f6\u95f4\u5185\u8ba1\u7b97\u3002\u7406\u8bba\u4e0a\u8bc1\u660e\u5176\u5728\u6295\u5f71\u7a7a\u95f4\u5185\u8fbe\u5230\u7cbe\u786e Nash \u793e\u4f1a\u798f\u5229\u6700\u4f18\uff0c\u5e76\u7ed9\u51fa\u798f\u5229\u4fdd\u8bc1\uff1b\u5b9e\u9a8c\u4e0e\u667a\u80fd\u8d2d\u7269\u6848\u4f8b\u9a8c\u8bc1\u4e86\u9c81\u68d2\u6027\uff0c\u540c\u65f6\u6307\u51fa\u673a\u5236\u4e0d\u5177\u5907\u7b56\u7565\u9632\u64cd\u7eb5\u6027\u3002", "categories": ["econ.EM", "cs.GT", "cs.LG", "cs.MA", "econ.TH"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29958", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5339\u914d\u673a\u5236", "\u673a\u5236\u8bbe\u8ba1", "\u793e\u4f1a\u798f\u5229", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29958v1", "published_at": "2026-09-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Multi-Dimensional Matching", "tldr": "\u672c\u6587\u7814\u7a76\u57fa\u4e8e\u7279\u5f81\u800c\u975e\u5b8c\u6574\u6392\u5e8f\u7684\u591a\u7ef4\u5339\u914d\u673a\u5236\uff0c\u901a\u8fc7\u4e00\u6b21\u8c31\u6295\u5f71\u5c06\u95ee\u9898\u5316\u4e3a\u4e00\u7ef4\u6392\u5e8f\uff0c\u5e76\u53ef\u5728 O(N log N) \u65f6\u95f4\u5185\u8ba1\u7b97\u3002\u7406\u8bba\u4e0a\u8bc1\u660e\u5176\u5728\u6295\u5f71\u7a7a\u95f4\u5185\u8fbe\u5230\u7cbe\u786e Nash \u793e\u4f1a\u798f\u5229\u6700\u4f18\uff0c\u5e76\u7ed9\u51fa\u798f\u5229\u4fdd\u8bc1\uff1b\u5b9e\u9a8c\u4e0e\u667a\u80fd\u8d2d\u7269\u6848\u4f8b\u9a8c\u8bc1\u4e86\u9c81\u68d2\u6027\uff0c\u540c\u65f6\u6307\u51fa\u673a\u5236\u4e0d\u5177\u5907\u7b56\u7565\u9632\u64cd\u7eb5\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Search quality evaluation provides essential supervision and diagnostic signals for the development and iteration of industrial search systems. Although large language models (LLMs) offer a scalable alternative to manual assessment, reliable automatic evaluation remains challenging: users experience search results at the page level, while the applicable evaluation criteria are multi-dimensional and continuously evolving. Packing all evaluation criteria into a unified prompt introduces irrelevant context and potential criterion interference, whereas internalizing them through post-training tightly couples rule updates with costly model retraining cycles. To address these issues, we propose Skill-routed Evaluation with Evolvable Knowledge (SEEK). Specifically, SEEK externalizes specific search evaluation criteria into a skill bank, dynamically routes relevant skills for each query-result list pair, and employs a task-adapted listwise evaluator to produce page-level judgments and failure mode attribution. A two-stage training pipeline teaches the evaluator to align evaluation criteria with human preferences, while a replay-gated skill bank allows recurring evaluation knowledge gaps to be incorporated without model retraining. Experiments on industrial short-video search show that SEEK improves listwise quality evaluation accuracy and achieves significant progress in attribution diagnosis. SEEK has been deployed at Kuaishou, a short-video platform with over 400 million daily active users, significantly improving the scale and quality of online search evaluation.", "arxiv_id": "2609.29803", "arxiv_url": "https://arxiv.org/abs/2609.29803", "authors": ["Zhongxin Huang", "Songyang Li", "Renzhe Zhou", "Feiran Zhu", "Chenglei Dai", "Zhen Xiao", "Xuanping Li", "Jingwei Zhuo"], "brief": "\u672c\u6587\u63d0\u51fa SEEK\uff0c\u5c06\u5de5\u4e1a\u641c\u7d22\u8bc4\u6d4b\u6807\u51c6\u5916\u7f6e\u4e3a\u53ef\u6f14\u5316\u7684\u6280\u80fd\u5e93\uff0c\u5e76\u6839\u636e\u67e5\u8be2-\u7ed3\u679c\u5217\u8868\u52a8\u6001\u8def\u7531\u76f8\u5173\u6280\u80fd\uff0c\u7531\u5217\u8868\u7ea7\u8bc4\u6d4b\u6a21\u578b\u8f93\u51fa\u9875\u9762\u7ea7\u8d28\u91cf\u5224\u65ad\u548c\u5931\u8d25\u5f52\u56e0\u3002\u8be5\u65b9\u6cd5\u5728\u5feb\u624b\u77ed\u89c6\u9891\u641c\u7d22\u573a\u666f\u4e2d\u63d0\u5347\u4e86\u5217\u8868\u7ea7\u8bc4\u6d4b\u51c6\u786e\u7387\u548c\u5f52\u56e0\u8bca\u65ad\u80fd\u529b\uff0c\u5e76\u5df2\u5728\u7ebf\u90e8\u7f72\u7528\u4e8e\u5927\u89c4\u6a21\u641c\u7d22\u8d28\u91cf\u8bc4\u4f30\u3002", "categories": ["cs.IR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29803", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u5927\u8bed\u8a00\u6a21\u578b", "\u641c\u7d22\u8bc4\u6d4b", "\u5de5\u4e1a\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29803v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SEEK: Skill-Routed Evaluation with Evolvable Knowledge for Industrial Search", "tldr": "\u672c\u6587\u63d0\u51fa SEEK\uff0c\u5c06\u5de5\u4e1a\u641c\u7d22\u8bc4\u6d4b\u6807\u51c6\u5916\u7f6e\u4e3a\u53ef\u6f14\u5316\u7684\u6280\u80fd\u5e93\uff0c\u5e76\u6839\u636e\u67e5\u8be2-\u7ed3\u679c\u5217\u8868\u52a8\u6001\u8def\u7531\u76f8\u5173\u6280\u80fd\uff0c\u7531\u5217\u8868\u7ea7\u8bc4\u6d4b\u6a21\u578b\u8f93\u51fa\u9875\u9762\u7ea7\u8d28\u91cf\u5224\u65ad\u548c\u5931\u8d25\u5f52\u56e0\u3002\u8be5\u65b9\u6cd5\u5728\u5feb\u624b\u77ed\u89c6\u9891\u641c\u7d22\u573a\u666f\u4e2d\u63d0\u5347\u4e86\u5217\u8868\u7ea7\u8bc4\u6d4b\u51c6\u786e\u7387\u548c\u5f52\u56e0\u8bca\u65ad\u80fd\u529b\uff0c\u5e76\u5df2\u5728\u7ebf\u90e8\u7f72\u7528\u4e8e\u5927\u89c4\u6a21\u641c\u7d22\u8d28\u91cf\u8bc4\u4f30\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific ideation is increasingly mediated by large language models, but current ideation systems are usually trained and evaluated on immediately judgeable proxies such as novelty, clarity, and feasibility. This leaves open whether delayed signals of scientific uptake can be used as feedback for steering models toward research directions with higher expected \\emph{impact}. We study this question using citation-normalized impact as a noisy but scalable proxy for scholarly uptake. We construct a large-scale dataset from over 100K computer science papers by extracting goal-conditioned idea descriptions and assigning each paper an ordinal, year-normalized citation label. We then train a goal-conditioned reward model to predict citation-impact labels from research goal and idea pairs, and use this reward to align an idea generator through supervised fine-tuning followed by reinforcement learning. To reduce circularity, we evaluate generated ideas with a held-out, reference-grounded protocol that compares model outputs against historical ideas under the same research goal and weights judgments by the reference idea\u0027s citation-impact label. Experiments show that our RL-tuned model consistently produces ideas with higher estimated impact than both the base model and supervised fine-tuning baselines. Our findings position scientific impact as a practical, outcome-grounded feedback signal for aligning LLMs in open-ended scientific discovery.", "arxiv_id": "2609.29802", "arxiv_url": "https://arxiv.org/abs/2609.29802", "authors": ["Shubham Kale", "Aniketh Garikaparthi", "Manasi Patwardhan"], "brief": "\u672c\u6587\u7528\u5f15\u7528\u5f52\u4e00\u5316\u5f71\u54cd\u529b\u4f5c\u4e3a\u5ef6\u8fdf\u53cd\u9988\u4fe1\u53f7\uff0c\u6784\u5efa\u4e86\u8d8510\u4e07\u7bc7\u8ba1\u7b97\u673a\u79d1\u5b66\u8bba\u6587\u7684\u76ee\u6807\u6761\u4ef6\u79d1\u7814\u60f3\u6cd5\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3\u5956\u52b1\u6a21\u578b\u9884\u6d4b\u7814\u7a76\u76ee\u6807-\u60f3\u6cd5\u5bf9\u7684\u6f5c\u5728\u5f71\u54cd\u3002\u518d\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u548c\u5f3a\u5316\u5b66\u4e60\u5bf9\u60f3\u6cd5\u751f\u6210\u6a21\u578b\u8fdb\u884c\u5bf9\u9f50\uff0c\u5b9e\u9a8c\u663e\u793a\u5176\u751f\u6210\u7684\u79d1\u7814\u60f3\u6cd5\u5728\u4f30\u8ba1\u5f71\u54cd\u529b\u4e0a\u4f18\u4e8e\u57fa\u7840\u6a21\u578b\u548c\u4ec5\u76d1\u7763\u5fae\u8c03\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29802", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u79d1\u7814\u53d1\u73b0", "\u5956\u52b1\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29802v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning to Ideate for Scientific Impact", "tldr": "\u672c\u6587\u7528\u5f15\u7528\u5f52\u4e00\u5316\u5f71\u54cd\u529b\u4f5c\u4e3a\u5ef6\u8fdf\u53cd\u9988\u4fe1\u53f7\uff0c\u6784\u5efa\u4e86\u8d8510\u4e07\u7bc7\u8ba1\u7b97\u673a\u79d1\u5b66\u8bba\u6587\u7684\u76ee\u6807\u6761\u4ef6\u79d1\u7814\u60f3\u6cd5\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3\u5956\u52b1\u6a21\u578b\u9884\u6d4b\u7814\u7a76\u76ee\u6807-\u60f3\u6cd5\u5bf9\u7684\u6f5c\u5728\u5f71\u54cd\u3002\u518d\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u548c\u5f3a\u5316\u5b66\u4e60\u5bf9\u60f3\u6cd5\u751f\u6210\u6a21\u578b\u8fdb\u884c\u5bf9\u9f50\uff0c\u5b9e\u9a8c\u663e\u793a\u5176\u751f\u6210\u7684\u79d1\u7814\u60f3\u6cd5\u5728\u4f30\u8ba1\u5f71\u54cd\u529b\u4e0a\u4f18\u4e8e\u57fa\u7840\u6a21\u578b\u548c\u4ec5\u76d1\u7763\u5fae\u8c03\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper presents an end-to-end study of automatic speech recognition (ASR) for adolescent health communication in three Ghanaian languages (Twi, Dagbani, and Ewe). The work proceeds in three connected stages; First, we benchmark five ASR systems (three language-specific Wav2Vec2 models and two multimodal LLMs, Gemma 3n and Gemma 4) on a general-domain Bible corpus and a Youth Adolescent Sexual and Reproductive Health (ASRH) Domain ASR dataset, using Character and Word Error Rate (CER, WER). Second, guided by the benchmark, we perform supervised domain adaptation: although Gemma 4 was the strongest zero-shot candidate, fine-tuning it proved computationally infeasible, so we pivoted to the compact Qwen3-ASR-0.6B, fine-tuned on a large Ghana Bible corpus (~90k samples) and evaluated strictly on held-out human-collected in-domain audio. Fine-tuning reduced WER on every language, most dramatically for Ewe (WER from 109.3% to 64.8%, a drop of 44.5 pp; CER from 65.1% to 24.9%). Third, we validate the work through KasaHealth, a live voice-first ASRH application deployed in all three languages, complemented by Senti-Check, a technical evaluation harness. KasaHealth was tested by 50 community respondents and achieved a 100% chat-approval rate, a 72% Good-or-Excellent translation rating, and a 92% would-recommend rate, while surfacing the domain gaps that most constrain real-world use. Across all three stages the evidence converges: for these languages the binding constraint is validated in-domain data, not model capability or computation.", "arxiv_id": "2609.29798", "arxiv_url": "https://arxiv.org/abs/2609.29798", "authors": ["Stephen E. Moore", "Akwasi Asare", "Mich-Seth Owusu", "Paul Azunre", "Joel Budu", "Lawrence A. Adu-Gyamfi"], "brief": "\u8bba\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86\u4e09\u79cd\u52a0\u7eb3\u8bed\u8a00\uff08Twi\u3001Dagbani\u3001Ewe\uff09\u5728\u9752\u5c11\u5e74\u5065\u5eb7\u6c9f\u901a\u573a\u666f\u4e2d\u7684\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u8868\u73b0\uff0c\u6bd4\u8f83\u4e86\u591a\u79cd Wav2Vec2 \u4e0e\u591a\u6a21\u6001\u5927\u6a21\u578b\u3002\u968f\u540e\u91c7\u7528 Qwen3-ASR-0.6B \u8fdb\u884c\u76d1\u7763\u5f0f\u9886\u57df\u9002\u914d\uff0c\u5728\u6240\u6709\u8bed\u8a00\u4e0a\u964d\u4f4e\u4e86\u8bcd\u9519\u8bef\u7387\uff0c\u5c24\u5176 Ewe \u63d0\u5347\u663e\u8457\uff1b\u5b9e\u9645\u90e8\u7f72\u7684 KasaHealth \u5e94\u7528\u4e5f\u83b7\u5f97\u8f83\u9ad8\u7528\u6237\u8ba4\u53ef\u3002\u7814\u7a76\u6307\u51fa\u4e3b\u8981\u74f6\u9888\u5728\u4e8e\u9ad8\u8d28\u91cf\u9886\u57df\u5185\u6570\u636e\u4e0d\u8db3\uff0c\u800c\u975e\u6a21\u578b\u80fd\u529b\u672c\u8eab\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29798", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b", "\u9886\u57df\u9002\u914d", "\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u5065\u5eb7\u5e94\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29798v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Benchmarking and Domain Adaptation of Automatic Speech Recognition (ASR) for Adolescent Health Communication in Ghanaian Languages", "tldr": "\u8bba\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86\u4e09\u79cd\u52a0\u7eb3\u8bed\u8a00\uff08Twi\u3001Dagbani\u3001Ewe\uff09\u5728\u9752\u5c11\u5e74\u5065\u5eb7\u6c9f\u901a\u573a\u666f\u4e2d\u7684\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u8868\u73b0\uff0c\u6bd4\u8f83\u4e86\u591a\u79cd Wav2Vec2 \u4e0e\u591a\u6a21\u6001\u5927\u6a21\u578b\u3002\u968f\u540e\u91c7\u7528 Qwen3-ASR-0.6B \u8fdb\u884c\u76d1\u7763\u5f0f\u9886\u57df\u9002\u914d\uff0c\u5728\u6240\u6709\u8bed\u8a00\u4e0a\u964d\u4f4e\u4e86\u8bcd\u9519\u8bef\u7387\uff0c\u5c24\u5176 Ewe \u63d0\u5347\u663e\u8457\uff1b\u5b9e\u9645\u90e8\u7f72\u7684 KasaHealth \u5e94\u7528\u4e5f\u83b7\u5f97\u8f83\u9ad8\u7528\u6237\u8ba4\u53ef\u3002\u7814\u7a76\u6307\u51fa\u4e3b\u8981\u74f6\u9888\u5728\u4e8e\u9ad8\u8d28\u91cf\u9886\u57df\u5185\u6570\u636e\u4e0d\u8db3\uff0c\u800c\u975e\u6a21\u578b\u80fd\u529b\u672c\u8eab\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present TimeBraid, a series of unified time-series and language models that align pretrained language models and pretrained time-series foundation models through interleaved global residual attention layers. Each model inherits knowledge, instruction following, and reasoning from one side, continuous-signal perception and zero-shot forecasting from the other, and fuses the two in a shared representation space where both modalities are understood and generated. We study the design choices that make such unified modeling work: where to align the two representation spaces, how to ground language in temporal structure, how to balance understanding with generation, and how to keep joint optimization stable. The resulting recipe combines a unified prompting scheme for diverse time-series and text tasks, stabilized joint training, and supervision from 2.2M curated series--text pairs and 4.9M instruction-tuning samples. Across benchmarks spanning time-series perception, understanding, reasoning, and both context-aided and unimodal forecasting, TimeBraid remains competitive with far larger general-purpose models and task-specific counterparts.", "arxiv_id": "2609.29792", "arxiv_url": "https://arxiv.org/abs/2609.29792", "authors": ["Xinyue Wang", "Jiacheng Pang", "Kun Zhou", "Kexin Zhang", "Defu Cao", "Fan Feng", "Faisal", "Songyao Jin", "Yan Liu", "Biwei Huang"], "brief": "TimeBraid \u5c06\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u4e0e\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u901a\u8fc7\u4ea4\u9519\u7684\u5168\u5c40\u6b8b\u5dee\u6ce8\u610f\u529b\u5c42\u5bf9\u9f50\uff0c\u7edf\u4e00\u652f\u6301\u65f6\u95f4\u5e8f\u5217\u7406\u89e3\u3001\u63a8\u7406\u4e0e\u9884\u6d4b\u3002\u6a21\u578b\u7ed3\u5408\u7edf\u4e00\u63d0\u793a\u3001\u7a33\u5b9a\u8054\u5408\u8bad\u7ec3\u4ee5\u53ca\u5927\u89c4\u6a21\u5e8f\u5217-\u6587\u672c\u4e0e\u6307\u4ee4\u6570\u636e\uff0c\u5728\u591a\u7c7b\u65f6\u95f4\u5e8f\u5217\u611f\u77e5\u3001\u7406\u89e3\u548c\u9884\u6d4b\u57fa\u51c6\u4e0a\u63a5\u8fd1\u6216\u4f18\u4e8e\u66f4\u5927\u901a\u7528\u6a21\u578b\u548c\u4e13\u7528\u6a21\u578b\u3002", "categories": ["cs.CL", "cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29792", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u8bed\u8a00\u6a21\u578b", "\u591a\u6a21\u6001", "\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29792v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TimeBraid: Unifying Time Series and Language for Understanding and Forecasting", "tldr": "TimeBraid \u5c06\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u4e0e\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u901a\u8fc7\u4ea4\u9519\u7684\u5168\u5c40\u6b8b\u5dee\u6ce8\u610f\u529b\u5c42\u5bf9\u9f50\uff0c\u7edf\u4e00\u652f\u6301\u65f6\u95f4\u5e8f\u5217\u7406\u89e3\u3001\u63a8\u7406\u4e0e\u9884\u6d4b\u3002\u6a21\u578b\u7ed3\u5408\u7edf\u4e00\u63d0\u793a\u3001\u7a33\u5b9a\u8054\u5408\u8bad\u7ec3\u4ee5\u53ca\u5927\u89c4\u6a21\u5e8f\u5217-\u6587\u672c\u4e0e\u6307\u4ee4\u6570\u636e\uff0c\u5728\u591a\u7c7b\u65f6\u95f4\u5e8f\u5217\u611f\u77e5\u3001\u7406\u89e3\u548c\u9884\u6d4b\u57fa\u51c6\u4e0a\u63a5\u8fd1\u6216\u4f18\u4e8e\u66f4\u5927\u901a\u7528\u6a21\u578b\u548c\u4e13\u7528\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Interpretable machine learning for Large Language Models (LLMs) increasingly relies on sparse probing methods that identify small sets of neurons claimed to detect and causally influence behaviors such as factuality recall, safety alignment, and hallucination. These claims have important implications for model auditing and behavioral steering, yet they are rarely tested against known failure modes of $L_1$-regularized probing in correlated, high-dimensional feature spaces. We propose a five-step diagnostic protocol covering feature correlation, bootstrap stability, sparse versus dense ranking disagreement, intervention baselines, and cross-dataset evaluation as a minimum standard for sparse-neuron localization claims. We investigate prior work using our proposed approach, specifically on H-neurons using open-source LLMs across TriviaQA, BioASQ, and NQ-Open datasets. Our results demonstrate detection replicates across both models and datasets, and exceeds the original reported AUROC gaps for TriviaQA and BioASQ datasets. Gemma 3 4B consistently outperforms MedGemma 4B on matched datasets, with AUROC gaps of +0.311 versus +0.235 on TriviaQA, +0.474 versus +0.455 on BioASQ, and +0.128 versus +0.112 on NQ-Open respectively. Causal validation at $n = 500$ with five random seeds shows statistically significant effects beyond random same-layer baselines. At the same time, the diagnostic results indicate that the selected neurons are not uniquely localized. Across the three Gemma 3 4B settings, 19 of 22 selected H-Neurons have Pearson $|r| \u003e 0.7$ with other features, bootstrap selections show only moderate stability, and sparse and dense rankings overlap only weakly. Our findings show that sparse predictive structure can coexist with non-unique neuron selection. Routine diagnostic validation is necessary to distinguish detection claims from localization claims in mechanistic interpretability.", "arxiv_id": "2609.29781", "arxiv_url": "https://arxiv.org/abs/2609.29781", "authors": ["Huseyin Cavus", "Sebin Sabu", "Joshua Spear", "Jaskaran Singh Kawatra", "Pavithra Rajendran"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u4e94\u6b65\u8bca\u65ad\u534f\u8bae\uff0c\u7528\u4e8e\u68c0\u9a8c\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u201c\u5e7b\u89c9\u795e\u7ecf\u5143\u201d\u7b49\u7a00\u758f\u63a2\u9488\u5b9a\u4f4d\u7ed3\u8bba\u662f\u5426\u53ef\u9760\u3002\u5b9e\u9a8c\u5728 TriviaQA\u3001BioASQ\u3001NQ-Open \u4e0a\u590d\u73b0\u4e86\u5e7b\u89c9\u68c0\u6d4b\u6548\u679c\uff0c\u5e76\u53d1\u73b0\u5e72\u9884\u5177\u6709\u663e\u8457\u56e0\u679c\u5f71\u54cd\uff0c\u4f46\u6240\u9009\u795e\u7ecf\u5143\u9ad8\u5ea6\u76f8\u5173\u3001\u7a33\u5b9a\u6027\u4e00\u822c\uff0c\u8bf4\u660e\u5b83\u4eec\u80fd\u9884\u6d4b\u5e7b\u89c9\u5374\u5e76\u975e\u552f\u4e00\u5b9a\u4f4d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29781", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u5e7b\u89c9\u68c0\u6d4b", "\u7a00\u758f\u63a2\u9488"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29781v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hallucination Neurons and Where to Find Them: An Investigation into the existence of Hallucination Neurons", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u4e94\u6b65\u8bca\u65ad\u534f\u8bae\uff0c\u7528\u4e8e\u68c0\u9a8c\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u201c\u5e7b\u89c9\u795e\u7ecf\u5143\u201d\u7b49\u7a00\u758f\u63a2\u9488\u5b9a\u4f4d\u7ed3\u8bba\u662f\u5426\u53ef\u9760\u3002\u5b9e\u9a8c\u5728 TriviaQA\u3001BioASQ\u3001NQ-Open \u4e0a\u590d\u73b0\u4e86\u5e7b\u89c9\u68c0\u6d4b\u6548\u679c\uff0c\u5e76\u53d1\u73b0\u5e72\u9884\u5177\u6709\u663e\u8457\u56e0\u679c\u5f71\u54cd\uff0c\u4f46\u6240\u9009\u795e\u7ecf\u5143\u9ad8\u5ea6\u76f8\u5173\u3001\u7a33\u5b9a\u6027\u4e00\u822c\uff0c\u8bf4\u660e\u5b83\u4eec\u80fd\u9884\u6d4b\u5e7b\u89c9\u5374\u5e76\u975e\u552f\u4e00\u5b9a\u4f4d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cross-speaker acoustic-to-articulatory inversion requires accounting for anatomical differences between speakers. We propose a geometric adaptation framework that uses anatomical landmarks, primarily on vertebrae and dental structures,to transfer predictions from a fixed inversion model to unseen speakers. An affine transformation followed by thin-plate spline (TPS) deformation maps the predicted contours of 10 vocal-tract structures into each target speaker\u0027s geometry without retraining. Landmarks are identified in one selected /u/ frame per speaker as a common phonetic reference without assuming identical articulatory configurations across speakers, and the resulting mapping is reused across recordings. We train the model on a single-speaker rt-MRI database and evaluate adaptation on eight speakers from a separate multi-speaker rt-MRI database. We compare affine and TPS configurations using 12 or 14 landmarks. Affine12+TPS14 achieves the lowest mean point-to-closest-point error of 3.19mm. These results support the combined value of anatomical landmark information and nonrigid alignment.", "arxiv_id": "2609.29766", "arxiv_url": "https://arxiv.org/abs/2609.29766", "authors": ["Nhat-Nam Nguyen", "Pierre-Andre Vuissoz", "Yves Laprie"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u8de8\u8bf4\u8bdd\u4eba\u7684\u58f0\u5b66\u5230\u53d1\u97f3\u5668\u5b98\u53cd\u6f14\u51e0\u4f55\u9002\u914d\u65b9\u6cd5\uff0c\u5229\u7528\u690e\u9aa8\u548c\u7259\u9f7f\u7b49\u89e3\u5256\u6807\u5fd7\u70b9\uff0c\u5c06\u5355\u8bf4\u8bdd\u4eba\u6a21\u578b\u9884\u6d4b\u768410\u7c7b\u58f0\u9053\u7ed3\u6784\u8f6e\u5ed3\u6620\u5c04\u5230\u672a\u89c1\u8bf4\u8bdd\u4eba\u7684\u51e0\u4f55\u5f62\u6001\u4e2d\uff0c\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u3002\u5b9e\u9a8c\u5728\u591a\u8bf4\u8bdd\u4ebart-MRI\u6570\u636e\u4e0a\u9a8c\u8bc1\uff0c\u4eff\u5c04\u53d8\u6362\u7ed3\u5408\u8584\u677f\u6837\u6761\u5f62\u53d8\u53d6\u5f97\u6700\u4f4e\u5e73\u5747\u8bef\u5dee3.19\u6beb\u7c73\uff0c\u8bf4\u660e\u89e3\u5256\u6807\u5fd7\u70b9\u548c\u975e\u521a\u6027\u914d\u51c6\u5bf9\u8de8\u8bf4\u8bdd\u4eba\u9002\u914d\u6709\u6548\u3002", "categories": ["eess.AS", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29766", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u5904\u7406", "\u58f0\u9053\u5efa\u6a21", "\u8de8\u8bf4\u8bdd\u4eba\u9002\u914d", "\u533b\u5b66\u5f71\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29766v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Anatomy-aware cross-speaker adaptation of complete vocal-tract acoustic-to-articulatory inversion", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u8de8\u8bf4\u8bdd\u4eba\u7684\u58f0\u5b66\u5230\u53d1\u97f3\u5668\u5b98\u53cd\u6f14\u51e0\u4f55\u9002\u914d\u65b9\u6cd5\uff0c\u5229\u7528\u690e\u9aa8\u548c\u7259\u9f7f\u7b49\u89e3\u5256\u6807\u5fd7\u70b9\uff0c\u5c06\u5355\u8bf4\u8bdd\u4eba\u6a21\u578b\u9884\u6d4b\u768410\u7c7b\u58f0\u9053\u7ed3\u6784\u8f6e\u5ed3\u6620\u5c04\u5230\u672a\u89c1\u8bf4\u8bdd\u4eba\u7684\u51e0\u4f55\u5f62\u6001\u4e2d\uff0c\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u3002\u5b9e\u9a8c\u5728\u591a\u8bf4\u8bdd\u4ebart-MRI\u6570\u636e\u4e0a\u9a8c\u8bc1\uff0c\u4eff\u5c04\u53d8\u6362\u7ed3\u5408\u8584\u677f\u6837\u6761\u5f62\u53d8\u53d6\u5f97\u6700\u4f4e\u5e73\u5747\u8bef\u5dee3.19\u6beb\u7c73\uff0c\u8bf4\u660e\u89e3\u5256\u6807\u5fd7\u70b9\u548c\u975e\u521a\u6027\u914d\u51c6\u5bf9\u8de8\u8bf4\u8bdd\u4eba\u9002\u914d\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Objective: Heart failure (HF) presents a healthcare challenge due to its high comorbidity burden, aging patient population and frequent hospitalizations. Remote monitoring offers a promising approach to managing HF patients by early detection of health deterioration. Developing autonomous systems to detect signs of worsening in telemonitoring data is of interest to reduce the workload of healthcare personnel. Methods: We propose the TRACER model, a Transformer with Contrastive Event Representation, designed to predict timelines leading to rare hospitalization events in low-resolution and irregularly sampled telemonitoring data. TRACER incorporates time-aware embeddings for each biomarker, contrastive pre-training to enhance anomaly detection via representation learning, and independent binary classifiers for detection. We used measurement data containing remotely recorded biomarker sequences from 276 HF patients segmented into overlapping windows based on temporal rules, and labeled the windows based on the occurrence of HF relevant hospitalizations at the latter edge of the window. Results: TRACER was able to correctly predict 66.7% timelines leading up to HF hospitalizations in the highly imbalanced real-world dataset with an overestimation of 7.9%. Reformulating the training of TRACER as an event detection problem improved the predictive performance compared with training directly on forecasting windows, enabling more effective use of the limited hospitalization events. Conclusion: TRACER demonstrated superior performance in detecting signs of worsening status in real-world telemonitoring data compared to the other tested models. Significance: TRACER shows promise in identifying signs of clinical deterioration that allow for alerts to be generated to provide counteractive treatment in patients with HF.", "arxiv_id": "2609.29742", "arxiv_url": "https://arxiv.org/abs/2609.29742", "authors": ["Erik Aerts", "Yinan Yu", "Annika Rosengren", "Michael Fu", "Martin Lindgren", "Falk Dippel", "Martin Adiels", "Helen Sj\u00f6land"], "brief": "\u672c\u6587\u63d0\u51fa TRACER\uff0c\u4e00\u79cd\u7ed3\u5408\u65f6\u95f4\u611f\u77e5\u5d4c\u5165\u3001\u5bf9\u6bd4\u4e8b\u4ef6\u8868\u793a\u9884\u8bad\u7ec3\u548c\u4e8c\u5206\u7c7b\u68c0\u6d4b\u5668\u7684 Transformer\uff0c\u7528\u4e8e\u4ece\u4f4e\u5206\u8fa8\u7387\u3001\u4e0d\u89c4\u5219\u8fdc\u7a0b\u76d1\u6d4b\u6570\u636e\u4e2d\u63d0\u524d\u8bc6\u522b\u5fc3\u8870\u6076\u5316\u3002\u6a21\u578b\u5728\u771f\u5b9e\u4e14\u9ad8\u5ea6\u4e0d\u5e73\u8861\u7684 276 \u540d\u60a3\u8005\u6570\u636e\u4e0a\u80fd\u68c0\u51fa 66.7% \u7684\u5fc3\u8870\u4f4f\u9662\u524d\u65f6\u95f4\u7ebf\uff0c\u8bef\u62a5/\u8fc7\u4f30\u8ba1\u4e3a 7.9%\uff0c\u4f18\u4e8e\u5176\u4ed6\u5bf9\u6bd4\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29742", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597AI", "\u65f6\u95f4\u5e8f\u5217", "Transformer", "\u5f02\u5e38\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29742v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AI-based detection of worsening heart failure from low-resolution telemonitoring data", "tldr": "\u672c\u6587\u63d0\u51fa TRACER\uff0c\u4e00\u79cd\u7ed3\u5408\u65f6\u95f4\u611f\u77e5\u5d4c\u5165\u3001\u5bf9\u6bd4\u4e8b\u4ef6\u8868\u793a\u9884\u8bad\u7ec3\u548c\u4e8c\u5206\u7c7b\u68c0\u6d4b\u5668\u7684 Transformer\uff0c\u7528\u4e8e\u4ece\u4f4e\u5206\u8fa8\u7387\u3001\u4e0d\u89c4\u5219\u8fdc\u7a0b\u76d1\u6d4b\u6570\u636e\u4e2d\u63d0\u524d\u8bc6\u522b\u5fc3\u8870\u6076\u5316\u3002\u6a21\u578b\u5728\u771f\u5b9e\u4e14\u9ad8\u5ea6\u4e0d\u5e73\u8861\u7684 276 \u540d\u60a3\u8005\u6570\u636e\u4e0a\u80fd\u68c0\u51fa 66.7% \u7684\u5fc3\u8870\u4f4f\u9662\u524d\u65f6\u95f4\u7ebf\uff0c\u8bef\u62a5/\u8fc7\u4f30\u8ba1\u4e3a 7.9%\uff0c\u4f18\u4e8e\u5176\u4ed6\u5bf9\u6bd4\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Ligand-based virtual screening (LBVS) is a practical first-pass tool in early-stage drug discovery, but existing benchmarks can overestimate performance through random negatives, easy decoys, limited target coverage, and non-standardized evaluation protocols. We introduce TopU-LBVS, a multi-target benchmark for LBVS under hard-negative screening conditions. Starting from curated ChEMBL~35 bioactivity data, TopU-LBVS covers 93 protein targets across 7 protein classes and constructs target-specific screening libraries with property-matched, structurally similar decoys at a fixed 1:40 active-to-decoy ratio. Libraries contain roughly 400 to 10,000 compounds and are designed to reduce simple physicochemical and nearest-neighbor fingerprint shortcuts. TopU-LBVS provides three fixed protocols. TopU-LBVS-full evaluates ChEMBL$^\\ast \\rightarrow$ TopU generalization across all 93 targets. TopU-LBVS-low evaluates low-data TopU $\\rightarrow$ TopU learning within the hard-negative distribution. TopU-LBVS-mini provides a compact seven-target protocol with a paired random-decoy control that changes only the test decoys, enabling low-cost development and direct measurement of the gap between random ChEMBL$^\\ast$ and TopU decoys. Across ten reference baselines spanning fingerprint methods, molecular GNNs, fingerprint hybrids, and modern molecular models, performance under random-decoy evaluation degrades sharply under hard-negative screening. We release data, fixed splits, evaluation code, and baseline implementations for reproducible comparison of future LBVS and molecular representation learning methods. Code and data are available at https://github.com/topu-benchmark/topu-lbvs and https://huggingface.co/datasets/topu-benchmark/topu-lbvs.", "arxiv_id": "2609.29740", "arxiv_url": "https://arxiv.org/abs/2609.29740", "authors": ["Surbhi Kumar", "Yuhe Zhou", "Varun Shiralkar", "Niu Huang", "Baris Coskunuzer"], "brief": "\u672c\u6587\u63d0\u51fa TopU-LBVS\uff0c\u4e00\u4e2a\u9762\u5411\u914d\u4f53\u865a\u62df\u7b5b\u9009\u7684\u591a\u9776\u70b9\u771f\u5b9e\u57fa\u51c6\uff0c\u8986\u76d6 93 \u4e2a\u86cb\u767d\u9776\u70b9\uff0c\u5e76\u4f7f\u7528\u6027\u8d28\u5339\u914d\u3001\u7ed3\u6784\u76f8\u4f3c\u7684\u56f0\u96be\u8d1f\u6837\u672c\u6765\u907f\u514d\u4f20\u7edf\u968f\u673a\u8d1f\u6837\u672c\u5bfc\u81f4\u7684\u6027\u80fd\u9ad8\u4f30\u3002\u4f5c\u8005\u63d0\u4f9b\u4e09\u5957\u56fa\u5b9a\u8bc4\u6d4b\u534f\u8bae\u3001\u6570\u636e\u5212\u5206\u3001\u4ee3\u7801\u548c\u5341\u79cd\u57fa\u7ebf\uff0c\u53d1\u73b0\u73b0\u6709\u65b9\u6cd5\u5728\u56f0\u96be\u8d1f\u6837\u672c\u7b5b\u9009\u4e0b\u6027\u80fd\u663e\u8457\u4e0b\u964d\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29740", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u836f\u7269\u53d1\u73b0", "\u865a\u62df\u7b5b\u9009", "\u5206\u5b50\u8868\u5f81\u5b66\u4e60", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29740v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TopU-LBVS: A Realistic Multi Target Benchmark for Ligand Based Virtual Screening", "tldr": "\u672c\u6587\u63d0\u51fa TopU-LBVS\uff0c\u4e00\u4e2a\u9762\u5411\u914d\u4f53\u865a\u62df\u7b5b\u9009\u7684\u591a\u9776\u70b9\u771f\u5b9e\u57fa\u51c6\uff0c\u8986\u76d6 93 \u4e2a\u86cb\u767d\u9776\u70b9\uff0c\u5e76\u4f7f\u7528\u6027\u8d28\u5339\u914d\u3001\u7ed3\u6784\u76f8\u4f3c\u7684\u56f0\u96be\u8d1f\u6837\u672c\u6765\u907f\u514d\u4f20\u7edf\u968f\u673a\u8d1f\u6837\u672c\u5bfc\u81f4\u7684\u6027\u80fd\u9ad8\u4f30\u3002\u4f5c\u8005\u63d0\u4f9b\u4e09\u5957\u56fa\u5b9a\u8bc4\u6d4b\u534f\u8bae\u3001\u6570\u636e\u5212\u5206\u3001\u4ee3\u7801\u548c\u5341\u79cd\u57fa\u7ebf\uff0c\u53d1\u73b0\u73b0\u6709\u65b9\u6cd5\u5728\u56f0\u96be\u8d1f\u6837\u672c\u7b5b\u9009\u4e0b\u6027\u80fd\u663e\u8457\u4e0b\u964d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Bias in AI systems is typically framed as a flaw to be minimized, yet it also serves as a critical indicator of underlying weaknesses in data, modeling assumptions, and system design. Existing approaches often treat bias as an isolated problem rather than as evidence that can strengthen verification and governance across the AI lifecycle. This paper aims to reconceptualize bias as a diagnostic tool that supports rigorous AI verification. We seek to develop a multidimensional framework to analyze bias, demonstrate how biases emerge in both Traditional and Generative AI, and provide a structured pathway for verification-driven mitigation. We present a multidimensional framework analyzing bias across four dimensions: origin sources, emergence points throughout the AI modeling lifecycle, technical and methodological causes, and validation approaches for detection and mitigation. Through a comprehensive typology spanning traditional and generative AI systems, we demonstrate how biases manifest and propagate across development stages. Our analysis encompasses 30 distinct bias types, 16 verification methods, and 20 countermeasures, providing an actionable roadmap for practitioners. We introduce a hierarchical evidence framework that distinguishes internal validity (mechanistic integrity of AI systems) from external validity (contextual reliability in deployment environments). The framework reveals how biases manifest and propagate across modeling stages, enabling systematic mapping between bias types, verification techniques, and effective countermeasures. The proposed evidence hierarchy clarifies how different verification strategies contribute to mechanistic integrity and contextual reliability. We advocate for \u0027\u0027Ethics by Design\u0027\u0027 principles that integrate bias verification throughout the development lifecycle, enabling the construction of fairer, more robust, and trustworthy AI systems.", "arxiv_id": "2609.29730", "arxiv_url": "https://arxiv.org/abs/2609.29730", "authors": ["Samira Maghool", "Paolo Ceravolo"], "brief": "\u672c\u6587\u5c06 AI \u504f\u89c1\u4ece\u5355\u7eaf\u7f3a\u9677\u91cd\u65b0\u5b9a\u4e49\u4e3a\u9a8c\u8bc1\u4e0e\u6cbb\u7406\u7684\u8bca\u65ad\u4fe1\u53f7\uff0c\u63d0\u51fa\u8986\u76d6\u6765\u6e90\u3001\u751f\u547d\u5468\u671f\u8282\u70b9\u3001\u6280\u672f\u6210\u56e0\u548c\u9a8c\u8bc1\u65b9\u6cd5\u7684\u591a\u7ef4\u6846\u67b6\u3002\u8bba\u6587\u68b3\u7406\u4e86\u4f20\u7edf AI \u4e0e\u751f\u6210\u5f0f AI \u4e2d 30 \u7c7b\u504f\u89c1\u300116 \u79cd\u9a8c\u8bc1\u65b9\u6cd5\u548c 20 \u79cd\u5e94\u5bf9\u63aa\u65bd\uff0c\u65e8\u5728\u5e2e\u52a9\u5b9e\u8df5\u8005\u6784\u5efa\u66f4\u516c\u5e73\u3001\u7a33\u5065\u3001\u53ef\u4fe1\u7684 AI \u7cfb\u7edf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29730", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u4fe1AI", "\u504f\u89c1\u6cbb\u7406", "\u6a21\u578b\u9a8c\u8bc1", "\u751f\u6210\u5f0fAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29730v1", "published_at": "2026-09-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Gold in Bias: Maturing the AI Design Process through Verification", "tldr": "\u672c\u6587\u5c06 AI \u504f\u89c1\u4ece\u5355\u7eaf\u7f3a\u9677\u91cd\u65b0\u5b9a\u4e49\u4e3a\u9a8c\u8bc1\u4e0e\u6cbb\u7406\u7684\u8bca\u65ad\u4fe1\u53f7\uff0c\u63d0\u51fa\u8986\u76d6\u6765\u6e90\u3001\u751f\u547d\u5468\u671f\u8282\u70b9\u3001\u6280\u672f\u6210\u56e0\u548c\u9a8c\u8bc1\u65b9\u6cd5\u7684\u591a\u7ef4\u6846\u67b6\u3002\u8bba\u6587\u68b3\u7406\u4e86\u4f20\u7edf AI \u4e0e\u751f\u6210\u5f0f AI \u4e2d 30 \u7c7b\u504f\u89c1\u300116 \u79cd\u9a8c\u8bc1\u65b9\u6cd5\u548c 20 \u79cd\u5e94\u5bf9\u63aa\u65bd\uff0c\u65e8\u5728\u5e2e\u52a9\u5b9e\u8df5\u8005\u6784\u5efa\u66f4\u516c\u5e73\u3001\u7a33\u5065\u3001\u53ef\u4fe1\u7684 AI \u7cfb\u7edf\u3002", "upvotes": 0, "what_it_is": null, "why_notable":
