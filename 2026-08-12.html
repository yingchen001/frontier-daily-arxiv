4 points under OOD settings and by 6.75 points under doubly OOD open-set evaluation. When applied to four diverse routers, CRM+RCCR improves Rank Score by 1.25--6.21 points.", "arxiv_id": "2608.12127", "arxiv_url": "https://arxiv.org/abs/2608.12127", "authors": ["Tao Yu", "Yifei Qu", "Zhiqing Cui", "Pengfei Zhou", "Zhongtian Luo", "Yujia Yang", "Shenghua Chai", "Haopeng Jin", "Zhenghao Zhang", "Xinming Wang", "Hongzhu Yi", "Wangbo Zhao", "Zhenglin Wan", "Yan Huang", "Yeshani", "Jinwen Luo", "Yang You"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u6267\u884c\u4efb\u52a1\u7684\u5f00\u653e\u96c6 VLM \u8def\u7531\u57fa\u51c6 VLM-ExecRouterBench\uff0c\u8986\u76d6\u4ee3\u7801\u3001\u667a\u80fd\u4f53\u548c\u641c\u7d22\u573a\u666f\uff0c\u5e76\u5305\u542b\u4ef7\u683c\u5dee\u5f02\u5f88\u5927\u7684 11 \u4e2a\u5019\u9009\u6a21\u578b\u3002\u63d0\u51fa SCOPE-Router \u4e0e\u6210\u672c\u611f\u77e5\u8bad\u7ec3\u76ee\u6807 CRM+RCCR\uff0c\u4f7f\u65b0\u6a21\u578b\u53ef\u65e0\u9700\u91cd\u8bad\u52a0\u5165\u8def\u7531\uff0c\u5e76\u5728 OOD \u4e0e\u53cc\u91cd OOD \u5f00\u653e\u96c6\u8bc4\u6d4b\u4e2d\u663e\u8457\u63d0\u5347 Rank Score\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12127", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u6a21\u578b\u8def\u7531", "\u6210\u672c\u4f18\u5316", "\u5f00\u653e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12127v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SCOPE-Router: Cost-Aware Open-Set VLM Routing for Execution-Oriented Tasks", "tldr": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u6267\u884c\u4efb\u52a1\u7684\u5f00\u653e\u96c6 VLM \u8def\u7531\u57fa\u51c6 VLM-ExecRouterBench\uff0c\u8986\u76d6\u4ee3\u7801\u3001\u667a\u80fd\u4f53\u548c\u641c\u7d22\u573a\u666f\uff0c\u5e76\u5305\u542b\u4ef7\u683c\u5dee\u5f02\u5f88\u5927\u7684 11 \u4e2a\u5019\u9009\u6a21\u578b\u3002\u63d0\u51fa SCOPE-Router \u4e0e\u6210\u672c\u611f\u77e5\u8bad\u7ec3\u76ee\u6807 CRM+RCCR\uff0c\u4f7f\u65b0\u6a21\u578b\u53ef\u65e0\u9700\u91cd\u8bad\u52a0\u5165\u8def\u7531\uff0c\u5e76\u5728 OOD \u4e0e\u53cc\u91cd OOD \u5f00\u653e\u96c6\u8bc4\u6d4b\u4e2d\u663e\u8457\u63d0\u5347 Rank Score\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Dynamic Master Logic (DML) provides a hierarchical framework for representing system behavior by linking functional objectives to underlying structural elements. However, DML construction typically relies on expert interpretation of technical documentation, limiting scalability for complex systems. This study presents a framework for automated construction of DML models from system descriptions and their representation as Knowledge Graphs (KG-DML), using Retrieval-Augmented Generation and Large Language Models as enabling tools. Building on prior work with small-scale systems, the framework extends automated KG-DML construction and evaluation to substantially larger and more complex systems. Model construction proceeds across the DML hierarchy using targeted retrieval while preserving functional dependencies and explicit logical relationships. The resulting KG-DML supports diagnostic reasoning, safety assessment, upward failure propagation, and downward dependency tracing. A multi-level validation methodology evaluates layer-specific precision and recall, logical gate consistency, and overall structural integrity. Application to the Low-Pressure Coolant Injection system of a decommissioned Boiling Water Reactor demonstrates consistent reconstruction across repeated runs. The results show that automated KG-DML construction can transform technical documentation into executable functional models for diagnostic and reliability analysis.", "arxiv_id": "2608.12304", "arxiv_url": "https://arxiv.org/abs/2608.12304", "authors": ["Saman Marandi", "Yu-Shu Hu", "Mohammad Modarres"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4ece\u7cfb\u7edf\u6280\u672f\u6587\u6863\u81ea\u52a8\u6784\u5efa\u52a8\u6001\u4e3b\u903b\u8f91\uff08DML\uff09\u6a21\u578b\u5e76\u8868\u793a\u4e3a\u77e5\u8bc6\u56fe\u8c31\uff08KG-DML\uff09\u7684\u6846\u67b6\u3002\u8be5\u6846\u67b6\u5229\u7528\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u548c\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u4fdd\u7559\u529f\u80fd\u4f9d\u8d56\u4e0e\u903b\u8f91\u5173\u7cfb\uff0c\u652f\u6301\u590d\u6742\u5de5\u7a0b\u7cfb\u7edf\u7684\u8bca\u65ad\u4e0e\u53ef\u9760\u6027\u5206\u6790\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12304", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6309DML\u5c42\u7ea7\u8fdb\u884c\u5b9a\u5411\u68c0\u7d22\u4e0e\u751f\u6210\uff0c\u81ea\u52a8\u62bd\u53d6\u529f\u80fd\u76ee\u6807\u3001\u7ed3\u6784\u5143\u7d20\u3001\u4f9d\u8d56\u5173\u7cfb\u548c\u903b\u8f91\u95e8", "KG-DML\u652f\u6301\u6545\u969c\u5411\u4e0a\u4f20\u64ad\u3001\u4f9d\u8d56\u5411\u4e0b\u8ffd\u8e2a\u3001\u5b89\u5168\u8bc4\u4f30\u548c\u8bca\u65ad\u63a8\u7406", "\u5728\u9000\u5f79\u6cb8\u6c34\u53cd\u5e94\u5806\u4f4e\u538b\u51b7\u5374\u6ce8\u5165\u7cfb\u7edf\u4e0a\u9a8c\u8bc1\uff0c\u91cd\u590d\u8fd0\u884c\u4e2d\u8868\u73b0\u51fa\u8f83\u7a33\u5b9a\u7684\u91cd\u6784\u80fd\u529b"], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u7cfb\u7edf\u8bca\u65ad", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12304v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Constructing Dynamic Master Logic Models as Knowledge Graphs for Complex System Diagnostics Using Retrieval-Augmented Large Language Models", "tldr": "\u7528RAG\u5927\u6a21\u578b\u81ea\u52a8\u6784\u5efa\u590d\u6742\u7cfb\u7edf\u8bca\u65ad\u77e5\u8bc6\u56fe\u8c31", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4ece\u7cfb\u7edf\u6280\u672f\u6587\u6863\u81ea\u52a8\u6784\u5efa\u52a8\u6001\u4e3b\u903b\u8f91\uff08DML\uff09\u6a21\u578b\u5e76\u8868\u793a\u4e3a\u77e5\u8bc6\u56fe\u8c31\uff08KG-DML\uff09\u7684\u6846\u67b6\u3002\u8be5\u6846\u67b6\u5229\u7528\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u548c\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u4fdd\u7559\u529f\u80fd\u4f9d\u8d56\u4e0e\u903b\u8f91\u5173\u7cfb\uff0c\u652f\u6301\u590d\u6742\u5de5\u7a0b\u7cfb\u7edf\u7684\u8bca\u65ad\u4e0e\u53ef\u9760\u6027\u5206\u6790\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u4f9d\u8d56\u4e13\u5bb6\u624b\u5de5\u89e3\u8bfb\u7684DML\u5efa\u6a21\u6d41\u7a0b\u81ea\u52a8\u5316\uff0c\u6709\u671b\u628a\u590d\u6742\u7cfb\u7edf\u6280\u672f\u6587\u6863\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u7684\u529f\u80fd\u77e5\u8bc6\u6a21\u578b\uff0c\u63d0\u5347\u5b89\u5168\u5173\u952e\u7cfb\u7edf\u8bca\u65ad\u3001\u53ef\u9760\u6027\u5206\u6790\u548c\u7ef4\u62a4\u8bc4\u4f30\u7684\u89c4\u6a21\u5316\u80fd\u529b\u3002"}, {"abstract": "Background: Accurate segmentation of the Left Anterior Descending (LAD) artery in 3D free-breathing, non-contrast CT is critical for cardiac dose sparing in thoracic radiotherapy. The LAD is extremely small, has poor soft-tissue contrast, and varies substantially across patients; even manual contours show limited inter-observer agreement, underscoring the ambiguity of the vessel boundaries. Purpose: To develop a transformer-based framework that improves LAD delineation in low-contrast, imbalanced CT through local-global context modeling and uncertainty-guided optimization. Methods: We propose NA-UNETR, a 3D transformer-based segmentation model whose Neighborhood Attention (NA) and Dilated NA (DiNA) blocks jointly capture fine structural detail and long-range context. Given the scarcity of annotated LAD data, the model is pretrained on 1,000 CTA volumes of general coronary anatomy and fine-tuned with LoRA-based parameter-efficient adaptation on 20 free-breathing institutional CT scans. A composite Dice-Focal and Hausdorff loss, dynamically balanced via homoscedastic uncertainty, improves overlap and boundary accuracy. Results: NA-UNETR reached 45.64% Dice, 38.16 mm HD95, and 10.01 mm ASD, improving Dice by 3.10 percentage points over nnU-Net and reducing HD95 by 2.96 mm relative to Swin UNETR, with the strongest boundary accuracy among all models and improved centerline stability. On ImageCAS it achieved 79.49% Dice, 8.89 mm HD95, and 1.02 mm ASD. Ablations confirmed that residual blocks, variable kernels, and uncertainty-weighted loss each contributed. Conclusions: NA-UNETR balances local precision and global context for thin, low-contrast LAD structures, offering a computationally efficient framework for substructure-level cardiac segmentation in radiotherapy planning.", "arxiv_id": "2608.12274", "arxiv_url": "https://arxiv.org/abs/2608.12274", "authors": ["Rafi Ibn Sultan", "Chengyin Li", "Yiannos Demetriou", "Ahmed I. Ghanem", "Joshua P. Kim", "Justine Cunningham", "Hassan Bagher-Ebadian", "Dongxiao Zhu", "Kundan S. Thind"], "brief": "\u672c\u6587\u63d0\u51fa NA-UNETR\uff0c\u7528\u90bb\u57df\u6ce8\u610f\u529b\u548c\u6269\u5f20\u90bb\u57df\u6ce8\u610f\u529b\u7ed3\u5408\u5c40\u90e8\u7ec6\u8282\u4e0e\u5168\u5c40\u4e0a\u4e0b\u6587\uff0c\u7528\u4e8e\u4f4e\u5bf9\u6bd4\u5ea6 3D CT \u4e2d\u5de6\u524d\u964d\u652f\u52a8\u8109\u5206\u5272\u3002\u6a21\u578b\u901a\u8fc7\u51a0\u8109 CTA \u9884\u8bad\u7ec3\u3001LoRA \u5fae\u8c03\u548c\u4e0d\u786e\u5b9a\u6027\u52a0\u6743\u635f\u5931\u63d0\u5347\u8fb9\u754c\u7cbe\u5ea6\uff0c\u76f8\u6bd4 nnU-Net \u7b49\u57fa\u7ebf\u5728 Dice\u3001HD95 \u548c\u4e2d\u5fc3\u7ebf\u7a33\u5b9a\u6027\u4e0a\u6709\u6240\u6539\u8fdb\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12274", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "Transformer", "\u6ce8\u610f\u529b\u673a\u5236", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12274v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Neighborhood Attention Transformer Network for Enhanced 3D Segmentation of the Left Anterior Descending Artery", "tldr": "\u672c\u6587\u63d0\u51fa NA-UNETR\uff0c\u7528\u90bb\u57df\u6ce8\u610f\u529b\u548c\u6269\u5f20\u90bb\u57df\u6ce8\u610f\u529b\u7ed3\u5408\u5c40\u90e8\u7ec6\u8282\u4e0e\u5168\u5c40\u4e0a\u4e0b\u6587\uff0c\u7528\u4e8e\u4f4e\u5bf9\u6bd4\u5ea6 3D CT \u4e2d\u5de6\u524d\u964d\u652f\u52a8\u8109\u5206\u5272\u3002\u6a21\u578b\u901a\u8fc7\u51a0\u8109 CTA \u9884\u8bad\u7ec3\u3001LoRA \u5fae\u8c03\u548c\u4e0d\u786e\u5b9a\u6027\u52a0\u6743\u635f\u5931\u63d0\u5347\u8fb9\u754c\u7cbe\u5ea6\uff0c\u76f8\u6bd4 nnU-Net \u7b49\u57fa\u7ebf\u5728 Dice\u3001HD95 \u548c\u4e2d\u5fc3\u7ebf\u7a33\u5b9a\u6027\u4e0a\u6709\u6240\u6539\u8fdb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-agent reinforcement learning for human-AI interaction typically relies on a single large language model to simulate user behavior. We show that this approach systematically fails to generalize, and trace the failure to simulator collapse: because the simulator LLM is mode-collapsed, an LLM policy trained against it overfits to narrow strategies that exploit the simulator\u0027s dominant mode, and such a policy transfers poorly to unseen simulators and real users. We formalize this collapse theoretically and propose two complementary solutions, one at inference time and one at training time. The inference-time solution, Verbalized Sampling, broadens the simulator\u0027s behavior by sampling from a verbalized response distribution, reducing mode collapse. The training-time solution, Co-Training, jointly optimizes the policy against a population of trainable simulators, preventing it from overfitting to any single simulator\u0027s mode. We validate both solutions on three multi-turn benchmarks: Persuasion for Good, $\u03c4^2$-bench, and CooperBench. Verbalized Sampling improves held-out success by up to 9% over single-simulator RL, and Co-Training pushes gains further to 14%; the human study shows similar gain on real users. Both solutions preserve the policy diversity that collapses under single-simulator RL. To support further work in this direction, we release SCOPE, an open-source framework for Population Co-Training multi-agent RL. More broadly, our results suggest that the diversity of the training environment, not only the policy, is critical to the generalization of multi-turn RL to real-world deployment.", "arxiv_id": "2608.12253", "arxiv_url": "https://arxiv.org/abs/2608.12253", "authors": ["Simon Yu", "Nicholas Tomlin", "Marwa Abdulhai", "Ximing Lu", "Derek Chong", "Abe Hou", "Dilara Soylu", "Sergey Levine", "Christopher D. Manning", "Weiyan Shi"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u7528\u5355\u4e2a\u51bb\u7ed3\u5927\u8bed\u8a00\u6a21\u578b\u6a21\u62df\u7528\u6237\u6765\u8bad\u7ec3\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4f1a\u51fa\u73b0\u201c\u6a21\u62df\u5668\u574d\u7f29\u201d\uff0c\u5bfc\u81f4\u7b56\u7565\u8fc7\u62df\u5408\u6a21\u62df\u5668\u7684\u4e3b\u5bfc\u884c\u4e3a\u6a21\u5f0f\uff0c\u6cdb\u5316\u5230\u65b0\u6a21\u62df\u5668\u548c\u771f\u5b9e\u7528\u6237\u65f6\u8868\u73b0\u53d8\u5dee\u3002\u4f5c\u8005\u63d0\u51fa\u63a8\u7406\u65f6\u7684 Verbalized Sampling \u548c\u8bad\u7ec3\u65f6\u7684 Co-Training\uff0c\u5728\u4e09\u4e2a\u591a\u8f6e\u4ea4\u4e92\u57fa\u51c6\u548c\u771f\u4eba\u5b9e\u9a8c\u4e2d\u63d0\u5347\u6210\u529f\u7387\uff0c\u6700\u9ad8\u5e26\u6765\u7ea614%\u7684\u589e\u76ca\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12253", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12253v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One Frozen Simulator Is Not Enough: Simulator Collapse in Multi-Agent RL", "tldr": "\u8bba\u6587\u6307\u51fa\uff0c\u7528\u5355\u4e2a\u51bb\u7ed3\u5927\u8bed\u8a00\u6a21\u578b\u6a21\u62df\u7528\u6237\u6765\u8bad\u7ec3\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4f1a\u51fa\u73b0\u201c\u6a21\u62df\u5668\u574d\u7f29\u201d\uff0c\u5bfc\u81f4\u7b56\u7565\u8fc7\u62df\u5408\u6a21\u62df\u5668\u7684\u4e3b\u5bfc\u884c\u4e3a\u6a21\u5f0f\uff0c\u6cdb\u5316\u5230\u65b0\u6a21\u62df\u5668\u548c\u771f\u5b9e\u7528\u6237\u65f6\u8868\u73b0\u53d8\u5dee\u3002\u4f5c\u8005\u63d0\u51fa\u63a8\u7406\u65f6\u7684 Verbalized Sampling \u548c\u8bad\u7ec3\u65f6\u7684 Co-Training\uff0c\u5728\u4e09\u4e2a\u591a\u8f6e\u4ea4\u4e92\u57fa\u51c6\u548c\u771f\u4eba\u5b9e\u9a8c\u4e2d\u63d0\u5347\u6210\u529f\u7387\uff0c\u6700\u9ad8\u5e26\u6765\u7ea614%\u7684\u589e\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Use this plain-text version for the arXiv abstract field: Learned image compression (LIC) models achieve strong rate-distortion performance but are hindered by high computational complexity and encoding-decoding mismatches across heterogeneous hardware platforms. Uniform fixed-precision quantization alleviates these issues but suffers severe quality degradation at low bit widths because it ignores differences in the quantization sensitivities of individual layers. To enable efficient and accurate low-bit deployment of pretrained LIC models, we propose HAMP-LIC, a Hessian-aware mixed-precision post-training quantization (PTQ) framework with a four-stage optimization strategy. First, block-wise sensitivity is estimated from the Hessian trace to capture second-order importance. Second, a task-aware refinement module adjusts these sensitivities by jointly considering quantization distortion and rate-distortion performance. Third, guided by the refined sensitivity profile, bit widths are allocated under a global model-size constraint to balance efficiency and reconstruction quality. Finally, block-wise reconstruction using a small calibration set further suppresses quantization error. Experiments on representative LIC models, including Minnen2018 and Cheng2020, demonstrate that HAMP-LIC achieves up to 4.85x model compression with as little as 0.59% BD-rate loss. It consistently outperforms existing fixed- and mixed-precision PTQ methods across multiple datasets while completely eliminating cross-platform encoding-decoding errors.", "arxiv_id": "2608.12239", "arxiv_url": "https://arxiv.org/abs/2608.12239", "authors": ["Yuefeng Zhang"], "brief": "\u672c\u6587\u63d0\u51fa HAMP-LIC\uff0c\u4e00\u79cd\u9762\u5411\u5b66\u4e60\u5f0f\u56fe\u50cf\u538b\u7f29\u6a21\u578b\u7684 Hessian \u611f\u77e5\u6df7\u5408\u7cbe\u5ea6\u540e\u8bad\u7ec3\u91cf\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u4e8c\u9636\u654f\u611f\u5ea6\u4f30\u8ba1\u3001\u4efb\u52a1\u611f\u77e5\u6821\u6b63\u3001\u5168\u5c40\u6bd4\u7279\u5206\u914d\u548c\u5757\u7ea7\u91cd\u6784\u6765\u964d\u4f4e\u4f4e\u6bd4\u7279\u91cf\u5316\u635f\u5931\u3002\u5728 Minnen2018\u3001Cheng2020 \u7b49\u6a21\u578b\u4e0a\u5b9e\u73b0\u6700\u9ad8 4.85 \u500d\u6a21\u578b\u538b\u7f29\uff0c\u4ec5\u5e26\u6765 0.59% BD-rate \u635f\u5931\uff0c\u5e76\u6d88\u9664\u8de8\u786c\u4ef6\u7f16\u89e3\u7801\u4e0d\u4e00\u81f4\u95ee\u9898\u3002", "categories": ["cs.CV", "cs.AI", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12239", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u538b\u7f29", "\u6a21\u578b\u91cf\u5316", "\u6df7\u5408\u7cbe\u5ea6", "\u540e\u8bad\u7ec3\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12239v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HAMP-LIC: Hessian-Aware Mixed-Precision Post-Training Quantization for Learned Image Compression", "tldr": "\u672c\u6587\u63d0\u51fa HAMP-LIC\uff0c\u4e00\u79cd\u9762\u5411\u5b66\u4e60\u5f0f\u56fe\u50cf\u538b\u7f29\u6a21\u578b\u7684 Hessian \u611f\u77e5\u6df7\u5408\u7cbe\u5ea6\u540e\u8bad\u7ec3\u91cf\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u4e8c\u9636\u654f\u611f\u5ea6\u4f30\u8ba1\u3001\u4efb\u52a1\u611f\u77e5\u6821\u6b63\u3001\u5168\u5c40\u6bd4\u7279\u5206\u914d\u548c\u5757\u7ea7\u91cd\u6784\u6765\u964d\u4f4e\u4f4e\u6bd4\u7279\u91cf\u5316\u635f\u5931\u3002\u5728 Minnen2018\u3001Cheng2020 \u7b49\u6a21\u578b\u4e0a\u5b9e\u73b0\u6700\u9ad8 4.85 \u500d\u6a21\u578b\u538b\u7f29\uff0c\u4ec5\u5e26\u6765 0.59% BD-rate \u635f\u5931\uff0c\u5e76\u6d88\u9664\u8de8\u786c\u4ef6\u7f16\u89e3\u7801\u4e0d\u4e00\u81f4\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study how organizations use frontier generative AI by linking ChatGPT Enterprise account records to usage, worker roles, task classifications, and public-company financial data through March 2026. These linked data enable a privacy-preserving analysis of adoption, worker roles, and message-level tasks at scale: for instance, the worker-level sample we analyze at the six-month adoption horizon includes over 1,500 organizations and over 17 million messages. We document four facts about enterprise AI adoption and use. First, ChatGPT Enterprise usage has grown rapidly due to a combination of new firm adoption and growing intensity among existing adopters. Second, U.S.-based public company adoption is concentrated among larger, more valuable, and more R\u0026D- and SG\u0026A-intensive firms. Third, active use within adopting firms spans job functions and seniority levels, with especially high usage intensity among early-career workers. Fourth, ChatGPT Enterprise usage encompasses a broad range of knowledge work tasks, including writing, technical work, communication, and information synthesis. In aggregate, these results suggest that firms differ widely in the speed, breadth and purpose of their enterprise AI adoption, and that they are still actively learning how to integrate AI into organizational workflows.", "arxiv_id": "2608.12236", "arxiv_url": "https://arxiv.org/abs/2608.12236", "authors": ["Aaron Chatterji", "David Holtz", "Neel Rakholia", "Prasanna Tambe", "Gawesha Weeratunga"], "brief": "\u672c\u6587\u5c06 ChatGPT Enterprise \u8d26\u6237\u8bb0\u5f55\u4e0e\u4f01\u4e1a\u3001\u5c97\u4f4d\u3001\u4efb\u52a1\u548c\u8d22\u52a1\u6570\u636e\u5173\u8054\uff0c\u5206\u6790\u8d85\u8fc71500\u5bb6\u7ec4\u7ec7\u30011700\u4e07\u6761\u6d88\u606f\u4e2d\u7684\u4f01\u4e1a\u751f\u6210\u5f0fAI\u91c7\u7528\u60c5\u51b5\u3002\u7ed3\u679c\u663e\u793a\uff0c\u91c7\u7528\u589e\u957f\u8fc5\u901f\u4e14\u96c6\u4e2d\u4e8e\u66f4\u5927\u3001\u66f4\u9ad8\u4ef7\u503c\u3001\u7814\u53d1\u548c\u7ba1\u7406\u6295\u5165\u66f4\u9ad8\u7684\u516c\u53f8\uff1b\u4f01\u4e1a\u5185\u90e8\u4e0d\u540c\u804c\u80fd\u548c\u5c42\u7ea7\u5747\u5728\u4f7f\u7528\uff0c\u65e9\u671f\u804c\u4e1a\u5458\u5de5\u5f3a\u5ea6\u66f4\u9ad8\uff0c\u4efb\u52a1\u8986\u76d6\u5199\u4f5c\u3001\u6280\u672f\u3001\u6c9f\u901a\u4e0e\u4fe1\u606f\u7efc\u5408\u3002", "categories": ["econ.GN", "cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12236", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u5f0fAI", "\u4f01\u4e1a\u91c7\u7528", "\u77e5\u8bc6\u5de5\u4f5c", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12236v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Organizations Use AI: Evidence from ChatGPT", "tldr": "\u672c\u6587\u5c06 ChatGPT Enterprise \u8d26\u6237\u8bb0\u5f55\u4e0e\u4f01\u4e1a\u3001\u5c97\u4f4d\u3001\u4efb\u52a1\u548c\u8d22\u52a1\u6570\u636e\u5173\u8054\uff0c\u5206\u6790\u8d85\u8fc71500\u5bb6\u7ec4\u7ec7\u30011700\u4e07\u6761\u6d88\u606f\u4e2d\u7684\u4f01\u4e1a\u751f\u6210\u5f0fAI\u91c7\u7528\u60c5\u51b5\u3002\u7ed3\u679c\u663e\u793a\uff0c\u91c7\u7528\u589e\u957f\u8fc5\u901f\u4e14\u96c6\u4e2d\u4e8e\u66f4\u5927\u3001\u66f4\u9ad8\u4ef7\u503c\u3001\u7814\u53d1\u548c\u7ba1\u7406\u6295\u5165\u66f4\u9ad8\u7684\u516c\u53f8\uff1b\u4f01\u4e1a\u5185\u90e8\u4e0d\u540c\u804c\u80fd\u548c\u5c42\u7ea7\u5747\u5728\u4f7f\u7528\uff0c\u65e9\u671f\u804c\u4e1a\u5458\u5de5\u5f3a\u5ea6\u66f4\u9ad8\uff0c\u4efb\u52a1\u8986\u76d6\u5199\u4f5c\u3001\u6280\u672f\u3001\u6c9f\u901a\u4e0e\u4fe1\u606f\u7efc\u5408\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Non-destructive food quality assessment has increasingly benefited from hyperspectral imaging (HSI), which captures spectral signatures linked to biochemical changes during storage. Estimating day-wise freshness, however, remains challenging owing to strong inter-fillet variability and scarce labelled data per product. All existing deep learning approaches for HSI-based freshness prediction operate under full supervision, requiring densely annotated training sets that are costly to obtain at the individual-product level. We introduce, to the best of our knowledge, the first few-shot learning framework for HSI-based food quality estimation. Each fillet defines a distinct episodic task, and a CORAL-style ordinal prediction head captures the ranked nature of freshness progression through cumulative threshold modelling. Biologically grounded monotonicity and embedding smoothness constraints further guide predictions toward plausible trajectories. On a 16-day salmon HSI dataset under a strict unseen-fillet protocol, our method achieves a mean absolute error of 1.58 days and 2-day accuracy of 72.3% with only three labelled days per fillet, substantially outperforming scalar regression and label-distribution baselines under an identical unseen-fillet protocol.", "arxiv_id": "2608.12230", "arxiv_url": "https://arxiv.org/abs/2608.12230", "authors": ["Kazi Nabiul Alam", "Pooneh Bagheri Zadeh", "Akbar Sheikh-Akbari"], "brief": "\u8bba\u6587\u63d0\u51fa\u9996\u4e2a\u9762\u5411\u9ad8\u5149\u8c31\u9c7c\u8089\u65b0\u9c9c\u5ea6\u4f30\u8ba1\u7684\u5c11\u6837\u672c\u5e8f\u6570\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u6bcf\u6761\u9c7c\u7247\u89c6\u4e3a\u4e00\u4e2a episodic \u4efb\u52a1\uff0c\u5e76\u7528 CORAL \u5f0f\u5e8f\u6570\u9884\u6d4b\u5934\u5efa\u6a21\u65b0\u9c9c\u5ea6\u968f\u5929\u6570\u53d8\u5316\u7684\u6709\u5e8f\u6027\u3002\u7ed3\u5408\u5355\u8c03\u6027\u4e0e\u5d4c\u5165\u5e73\u6ed1\u7ea6\u675f\u540e\uff0c\u5728\u4ec5\u6bcf\u6761\u9c7c\u7247\u6807\u6ce83\u5929\u7684\u60c5\u51b5\u4e0b\u8fbe\u52301.58\u5929\u5e73\u5747\u7edd\u5bf9\u8bef\u5dee\u548c72.3%\u76842\u5929\u5185\u51c6\u786e\u7387\uff0c\u4f18\u4e8e\u56de\u5f52\u548c\u6807\u7b7e\u5206\u5e03\u57fa\u7ebf\u3002", "categories": ["cs.CV", "cs.AI", "eess.IV", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12230", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5c11\u6837\u672c\u5b66\u4e60", "\u9ad8\u5149\u8c31\u6210\u50cf", "\u98df\u54c1\u8d28\u91cf\u8bc4\u4f30", "\u5e8f\u6570\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12230v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Few-Shot Ordinal Learning for Day-Wise Freshness Estimation with Hyperspectral Fish Images", "tldr": "\u8bba\u6587\u63d0\u51fa\u9996\u4e2a\u9762\u5411\u9ad8\u5149\u8c31\u9c7c\u8089\u65b0\u9c9c\u5ea6\u4f30\u8ba1\u7684\u5c11\u6837\u672c\u5e8f\u6570\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u6bcf\u6761\u9c7c\u7247\u89c6\u4e3a\u4e00\u4e2a episodic \u4efb\u52a1\uff0c\u5e76\u7528 CORAL \u5f0f\u5e8f\u6570\u9884\u6d4b\u5934\u5efa\u6a21\u65b0\u9c9c\u5ea6\u968f\u5929\u6570\u53d8\u5316\u7684\u6709\u5e8f\u6027\u3002\u7ed3\u5408\u5355\u8c03\u6027\u4e0e\u5d4c\u5165\u5e73\u6ed1\u7ea6\u675f\u540e\uff0c\u5728\u4ec5\u6bcf\u6761\u9c7c\u7247\u6807\u6ce83\u5929\u7684\u60c5\u51b5\u4e0b\u8fbe\u52301.58\u5929\u5e73\u5747\u7edd\u5bf9\u8bef\u5dee\u548c72.3%\u76842\u5929\u5185\u51c6\u786e\u7387\uff0c\u4f18\u4e8e\u56de\u5f52\u548c\u6807\u7b7e\u5206\u5e03\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hyperspectral imaging (HSI) offers nondestructive assessment of fish freshness by detecting biochemical alterations across spectral bands. However, conventional deep learning approaches do not fully address the particular characteristics of HSI data, such as spectral dominance over spatial textures, ordinal label structure, and a small number of training samples. We propose SGNet (Spectral-Grouped Network), a lightweight architecture that separates spectral and spatial feature extraction using grouped convolutions and a depthwise spatial pathway. A dual attention mechanism that couples channel-wise squeeze-and-excitation with spatial gating adaptively highlights informative features. SGNet achieves 97.8% classification accuracy and 0.64 days mean absolute error (MAE) with just 4.75M parameters when tested on our newly developed 16-day refrigerator-stored salmon fillet dataset. Ablation studies validate the contribution of each component, while comparisons demonstrate a five- to eighteen-fold parameter reduction relative to ResNet-50 and Vision Transformers. Our findings indicate that domain-aware design supports precise, real-time freshness prediction for industrial implementation.", "arxiv_id": "2608.12227", "arxiv_url": "https://arxiv.org/abs/2608.12227", "authors": ["Kazi Nabiul Alam", "Pooneh Bagheri Zadeh", "Akbar Sheikh-Akbari"], "brief": "\u8bba\u6587\u63d0\u51fa\u8f7b\u91cf\u7ea7\u9ad8\u5149\u8c31\u9c7c\u7c7b\u65b0\u9c9c\u5ea6\u5206\u7c7b\u7f51\u7edc SGNet\uff0c\u5c06\u5149\u8c31\u4e0e\u7a7a\u95f4\u7279\u5f81\u63d0\u53d6\u89e3\u8026\uff0c\u5e76\u7ed3\u5408\u5206\u7ec4\u5377\u79ef\u3001\u6df1\u5ea6\u53ef\u5206\u7a7a\u95f4\u8def\u5f84\u548c\u53cc\u91cd\u6ce8\u610f\u529b\u673a\u5236\u3002\u5176\u572816\u5929\u51b7\u85cf\u4e09\u6587\u9c7c\u6570\u636e\u96c6\u4e0a\u8fbe\u523097.8%\u5206\u7c7b\u51c6\u786e\u7387\u548c0.64\u5929MAE\uff0c\u53c2\u6570\u91cf\u4ec54.75M\uff0c\u663e\u8457\u5c0f\u4e8eResNet-50\u548cViT\uff0c\u9002\u5408\u5de5\u4e1a\u5b9e\u65f6\u68c0\u6d4b\u3002", "categories": ["eess.IV", "cs.AI", "cs.CV", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12227", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u5149\u8c31\u6210\u50cf", "\u8f7b\u91cf\u5316\u7f51\u7edc", "\u98df\u54c1\u68c0\u6d4b", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12227v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Domain-Aware Lightweight Spectral-Grouped Convolutions for Hyperspectral Fish Freshness Classification", "tldr": "\u8bba\u6587\u63d0\u51fa\u8f7b\u91cf\u7ea7\u9ad8\u5149\u8c31\u9c7c\u7c7b\u65b0\u9c9c\u5ea6\u5206\u7c7b\u7f51\u7edc SGNet\uff0c\u5c06\u5149\u8c31\u4e0e\u7a7a\u95f4\u7279\u5f81\u63d0\u53d6\u89e3\u8026\uff0c\u5e76\u7ed3\u5408\u5206\u7ec4\u5377\u79ef\u3001\u6df1\u5ea6\u53ef\u5206\u7a7a\u95f4\u8def\u5f84\u548c\u53cc\u91cd\u6ce8\u610f\u529b\u673a\u5236\u3002\u5176\u572816\u5929\u51b7\u85cf\u4e09\u6587\u9c7c\u6570\u636e\u96c6\u4e0a\u8fbe\u523097.8%\u5206\u7c7b\u51c6\u786e\u7387\u548c0.64\u5929MAE\uff0c\u53c2\u6570\u91cf\u4ec54.75M\uff0c\u663e\u8457\u5c0f\u4e8eResNet-50\u548cViT\uff0c\u9002\u5408\u5de5\u4e1a\u5b9e\u65f6\u68c0\u6d4b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing Vision-Language Models (VLMs) exhibits a critical bottleneck in robust spatial reasoning. Recent reinforcement learning (RL) methods aim to close this gap with verifiable outcomes, yet they suffer from poor credit assignment across intermediate reasoning steps. Concurrently, structured reasoning approaches overlook the critical depth perception necessary for comprehensive 3D understanding. To address these challenges, we propose SCOUT (Structured Chain-Of-Thought Utilizing Process-Supervised RL Training). Specifically, we design a structured Chain-of-Thought (CoT) framework that explicitly models 3D environmental perception to ensure robust spatial understanding and reasoning. Furthermore, we introduce a novel RL algorithm featuring multi-objective process rewards and a tailored advantage estimation method, facilitating fine-grained credit assignment across distinct segments of the reasoning trajectory. To support our framework, we develop SCOUT-24k, a structured spatial reasoning CoT dataset synthesized through a customized pipeline. Extensive evaluations demonstrate that SCOUT-3B improves upon baseline models by 16.85% and 6.3% on general spatial benchmarks and complex spatial reasoning tasks respectively. Notably, our larger SCOUT-7B even outperforms GPT-4o by a margin of 4.28%. Moreover, despite being trained exclusively on single image, SCOUT-7B exhibits robust out-of-domain generalization to multi-image and video scenarios. These empirical results render SCOUT as a critical step towards next generation of spatially-aware VLMs.", "arxiv_id": "2608.12220", "arxiv_url": "https://arxiv.org/abs/2608.12220", "authors": ["Zile Zhou", "Huining Yuan", "Weichen Zhang", "Xinlei Chen", "Xiao-ping Zhang"], "brief": "SCOUT\u63d0\u51fa\u7ed3\u6784\u5316\u601d\u7ef4\u94fe\u6846\u67b6\uff0c\u663e\u5f0f\u5efa\u6a213D\u73af\u5883\u611f\u77e5\uff0c\u5e76\u7ed3\u5408\u591a\u76ee\u6807\u8fc7\u7a0b\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u6765\u6539\u8fdb\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u7a7a\u95f4\u63a8\u7406\u4e0e\u4e2d\u95f4\u6b65\u9aa4\u4fe1\u7528\u5206\u914d\u3002\u57fa\u4e8e\u5408\u6210\u7684SCOUT-24k\u6570\u636e\u8bad\u7ec3\u540e\uff0cSCOUT-3B\u5728\u7a7a\u95f4\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\uff0cSCOUT-7B\u751a\u81f3\u8d85\u8fc7GPT-4o\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u591a\u56fe\u548c\u89c6\u9891\u573a\u666f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12220", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7a7a\u95f4\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u601d\u7ef4\u94fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12220v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SCOUT: Unlocking Enhanced Spatial Reasoning via Structured Chain-of-Thought and Multi-Objective Process Reward", "tldr": "SCOUT\u63d0\u51fa\u7ed3\u6784\u5316\u601d\u7ef4\u94fe\u6846\u67b6\uff0c\u663e\u5f0f\u5efa\u6a213D\u73af\u5883\u611f\u77e5\uff0c\u5e76\u7ed3\u5408\u591a\u76ee\u6807\u8fc7\u7a0b\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u6765\u6539\u8fdb\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u7a7a\u95f4\u63a8\u7406\u4e0e\u4e2d\u95f4\u6b65\u9aa4\u4fe1\u7528\u5206\u914d\u3002\u57fa\u4e8e\u5408\u6210\u7684SCOUT-24k\u6570\u636e\u8bad\u7ec3\u540e\uff0cSCOUT-3B\u5728\u7a7a\u95f4\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\uff0cSCOUT-7B\u751a\u81f3\u8d85\u8fc7GPT-4o\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u591a\u56fe\u548c\u89c6\u9891\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly trained and deployed with long contexts that span documents, code repositories, and interaction histories. This scaling reflects the implicit assumption that training on longer contexts will only help the model by exposing it to richer evidence. We challenge this view by studying how the context window shapes a model\u0027s mode of learning, shifting it between parametric internalization and contextualization. We propose the Information Abundance Paradox, which hypothesizes that abundant relevant information in the training context can reduce the incentive to encode that information parametrically, thereby increasing reliance on context. In pretraining with long documents, increasing the context window improves language modeling, natural language understanding, and closed-book MCQA only up to an intermediate optimum, after which performance consistently declines. In supervised fine-tuning, more task-relevant train-time context improves performance with supporting context, but reduces robustness when context is absent or misleading at test time. Our analysis suggests that this behavior arises when longer context provides a lower complexity solution. Mechanistically, training with informative context shifts gradient pressure from feed-forward networks, often linked to parametric knowledge, toward attention modules, and causal interventions show that this shift increases reliance on context during inference. Overall, these findings support the Information Abundance Paradox and suggest that scaling toward near-infinite context is not simply a matter of supplying more data, even when high-quality long-context data is abundant.", "arxiv_id": "2608.12218", "arxiv_url": "https://arxiv.org/abs/2608.12218", "authors": ["Arda Uzunoglu", "Benjamin van Durme", "Daniel Khashabi"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u4fe1\u606f\u4e30\u88d5\u6096\u8bba\u201d\uff1a\u8bad\u7ec3\u65f6\u4e0a\u4e0b\u6587\u4e2d\u76f8\u5173\u4fe1\u606f\u8d8a\u5145\u8db3\uff0c\u6a21\u578b\u8d8a\u53ef\u80fd\u4f9d\u8d56\u4e0a\u4e0b\u6587\u800c\u975e\u5c06\u77e5\u8bc6\u5185\u5316\u5230\u53c2\u6570\u4e2d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u9884\u8bad\u7ec3\u4e2d\u957f\u4e0a\u4e0b\u6587\u5e26\u6765\u7684\u6536\u76ca\u5b58\u5728\u4e2d\u95f4\u6700\u4f18\u70b9\uff0c\u8fc7\u957f\u53cd\u800c\u964d\u4f4e\u8bed\u8a00\u5efa\u6a21\u3001\u7406\u89e3\u548c\u95ed\u5377\u95ee\u7b54\u8868\u73b0\uff1b\u5fae\u8c03\u4e2d\u66f4\u591a\u76f8\u5173\u4e0a\u4e0b\u6587\u4e5f\u4f1a\u524a\u5f31\u65e0\u4e0a\u4e0b\u6587\u6216\u8bef\u5bfc\u4e0a\u4e0b\u6587\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12218", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u957f\u4e0a\u4e0b\u6587", "\u53c2\u6570\u77e5\u8bc6", "\u9884\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12218v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Information Abundance Paradox: Long-Context Training Undermines Parametric Knowledge", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u4fe1\u606f\u4e30\u88d5\u6096\u8bba\u201d\uff1a\u8bad\u7ec3\u65f6\u4e0a\u4e0b\u6587\u4e2d\u76f8\u5173\u4fe1\u606f\u8d8a\u5145\u8db3\uff0c\u6a21\u578b\u8d8a\u53ef\u80fd\u4f9d\u8d56\u4e0a\u4e0b\u6587\u800c\u975e\u5c06\u77e5\u8bc6\u5185\u5316\u5230\u53c2\u6570\u4e2d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u9884\u8bad\u7ec3\u4e2d\u957f\u4e0a\u4e0b\u6587\u5e26\u6765\u7684\u6536\u76ca\u5b58\u5728\u4e2d\u95f4\u6700\u4f18\u70b9\uff0c\u8fc7\u957f\u53cd\u800c\u964d\u4f4e\u8bed\u8a00\u5efa\u6a21\u3001\u7406\u89e3\u548c\u95ed\u5377\u95ee\u7b54\u8868\u73b0\uff1b\u5fae\u8c03\u4e2d\u66f4\u591a\u76f8\u5173\u4e0a\u4e0b\u6587\u4e5f\u4f1a\u524a\u5f31\u65e0\u4e0a\u4e0b\u6587\u6216\u8bef\u5bfc\u4e0a\u4e0b\u6587\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent research in machine and deep learning has shown the potential of learningbased motion planning approaches to improve the driving behavior of automated vehicles, especially in complex environments. However, their complex nature and lack of transparency can hinder explainability and trustworthiness and complicate safety assurance. Motivated by these challenges, we propose a hybrid planning architecture that combines the advantages of machine learning with the verifiability and the determinism of classical approaches. Specifically, we developed a deep neural network to interpret complex traffic scenes and propose driving behavior, while an optimization-based supervision layer validates this proposal and enforces explicit drivability and safety constraints. We evaluate the learned planner\u0027s driving behavior in open-loop studies on real-world urban data, discuss system integration aspects for stable closed-loop operation, and report results from real-world deployment on our research vehicle karl..", "arxiv_id": "2608.12198", "arxiv_url": "https://arxiv.org/abs/2608.12198", "authors": ["Jean-Pierre Busch", "Guido Linden", "Jan Bergmann", "Lutz Eckstein"], "brief": "\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u81ea\u52a8\u9a7e\u9a76\u884c\u4e3a\u89c4\u5212\u7684\u6df7\u5408\u67b6\u6784\uff1a\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u7406\u89e3\u590d\u6742\u4ea4\u901a\u573a\u666f\u5e76\u7ed9\u51fa\u9a7e\u9a76\u884c\u4e3a\u5efa\u8bae\uff0c\u518d\u7531\u4f18\u5316\u76d1\u7763\u5c42\u9a8c\u8bc1\u5e76\u5f3a\u5236\u6ee1\u8db3\u53ef\u884c\u9a76\u6027\u4e0e\u5b89\u5168\u7ea6\u675f\u3002\u8bba\u6587\u5728\u771f\u5b9e\u57ce\u5e02\u6570\u636e\u4e0a\u8fdb\u884c\u5f00\u73af\u8bc4\u4f30\uff0c\u5e76\u62a5\u544a\u4e86\u7814\u7a76\u8f66\u4e0a\u7684\u95ed\u73af\u96c6\u6210\u4e0e\u771f\u5b9e\u9053\u8def\u90e8\u7f72\u7ed3\u679c\uff0c\u5f3a\u8c03\u517c\u987e\u5b66\u4e60\u65b9\u6cd5\u7684\u8868\u73b0\u4e0e\u4f20\u7edf\u65b9\u6cd5\u7684\u53ef\u9a8c\u8bc1\u6027\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12198", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u884c\u4e3a\u89c4\u5212", "\u6df1\u5ea6\u5b66\u4e60", "\u5b89\u5168\u7ea6\u675f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12198v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning-Based Behavior Planning for Automated Driving: Real-World Integration and Deployment", "tldr": "\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u81ea\u52a8\u9a7e\u9a76\u884c\u4e3a\u89c4\u5212\u7684\u6df7\u5408\u67b6\u6784\uff1a\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u7406\u89e3\u590d\u6742\u4ea4\u901a\u573a\u666f\u5e76\u7ed9\u51fa\u9a7e\u9a76\u884c\u4e3a\u5efa\u8bae\uff0c\u518d\u7531\u4f18\u5316\u76d1\u7763\u5c42\u9a8c\u8bc1\u5e76\u5f3a\u5236\u6ee1\u8db3\u53ef\u884c\u9a76\u6027\u4e0e\u5b89\u5168\u7ea6\u675f\u3002\u8bba\u6587\u5728\u771f\u5b9e\u57ce\u5e02\u6570\u636e\u4e0a\u8fdb\u884c\u5f00\u73af\u8bc4\u4f30\uff0c\u5e76\u62a5\u544a\u4e86\u7814\u7a76\u8f66\u4e0a\u7684\u95ed\u73af\u96c6\u6210\u4e0e\u771f\u5b9e\u9053\u8def\u90e8\u7f72\u7ed3\u679c\uff0c\u5f3a\u8c03\u517c\u987e\u5b66\u4e60\u65b9\u6cd5\u7684\u8868\u73b0\u4e0e\u4f20\u7edf\u65b9\u6cd5\u7684\u53ef\u9a8c\u8bc1\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) are increasingly used in circuit design workflows, yet their reliability on simulator-facing SPICE netlist recognition and manipulation remains poorly understood and is rarely separated from high-level design reasoning. Although netlists are textual, they encode structured circuit objects through topology and parameters. We present \\textbf{NetlistBench}, a structure-verified benchmark for SPICE netlist recognition and manipulation. NetlistBench contains 2,342 cases across 24 task families, covering parameter and connectivity recognition and edits, hierarchical operations, equivalence judgment, and long-horizon compound editing. Model outputs are evaluated by a deterministic structure-aware oracle. Across six non-thinking LLMs, performance varies substantially with operation-level structural complexity. Simple local edits reach $96\\%$--$100\\%$ accuracy, while device addition drops to $41\\%$--$83\\%$ and equivalence judgment to $49\\%$--$90\\%$. Enabling reasoning substantially improves weaker models but does not eliminate structure-preservation failures, with performance still degrading sharply as the edit horizon increases. NetlistBench identifies netlist reliability as a distinct bottleneck for trustworthy LLM-based circuit design automation.", "arxiv_id": "2608.12197", "arxiv_url": "https://arxiv.org/abs/2608.12197", "authors": ["Jiarui Ma", "Jianghan Wang", "Yuheng Ma", "Ziyi Zhuang", "Xiaoguang Liu"], "brief": "\u672c\u6587\u63d0\u51fa NetlistBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728 SPICE \u7f51\u8868\u8bc6\u522b\u4e0e\u7ed3\u6784\u5316\u7f16\u8f91\u4e2d\u7684\u53ef\u9760\u6027\uff0c\u8986\u76d6\u53c2\u6570\u3001\u8fde\u63a5\u3001\u5c42\u6b21\u7ed3\u6784\u3001\u7b49\u4ef7\u5224\u65ad\u548c\u957f\u7a0b\u590d\u5408\u7f16\u8f91\u7b49 24 \u7c7b\u4efb\u52a1\u3002\u5b9e\u9a8c\u663e\u793a\u6a21\u578b\u5728\u7b80\u5355\u5c40\u90e8\u7f16\u8f91\u4e0a\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u5668\u4ef6\u6dfb\u52a0\u3001\u7b49\u4ef7\u5224\u65ad\u548c\u957f\u7f16\u8f91\u94fe\u4e2d\u51c6\u786e\u7387\u663e\u8457\u4e0b\u964d\uff0c\u63a8\u7406\u80fd\u529b\u53ef\u6539\u5584\u5f31\u6a21\u578b\u4f46\u4ecd\u96be\u907f\u514d\u7ed3\u6784\u4fdd\u6301\u5931\u8d25\u3002", "categories": ["eess.SY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12197", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7535\u8def\u8bbe\u8ba1", "\u7f51\u8868", "\u53ef\u9760\u6027\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12197v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "NetlistBench: Evaluating LLM Reliability in SPICE Netlist Recognition and Manipulation", "tldr": "\u672c\u6587\u63d0\u51fa NetlistBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728 SPICE \u7f51\u8868\u8bc6\u522b\u4e0e\u7ed3\u6784\u5316\u7f16\u8f91\u4e2d\u7684\u53ef\u9760\u6027\uff0c\u8986\u76d6\u53c2\u6570\u3001\u8fde\u63a5\u3001\u5c42\u6b21\u7ed3\u6784\u3001\u7b49\u4ef7\u5224\u65ad\u548c\u957f\u7a0b\u590d\u5408\u7f16\u8f91\u7b49 24 \u7c7b\u4efb\u52a1\u3002\u5b9e\u9a8c\u663e\u793a\u6a21\u578b\u5728\u7b80\u5355\u5c40\u90e8\u7f16\u8f91\u4e0a\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u5668\u4ef6\u6dfb\u52a0\u3001\u7b49\u4ef7\u5224\u65ad\u548c\u957f\u7f16\u8f91\u94fe\u4e2d\u51c6\u786e\u7387\u663e\u8457\u4e0b\u964d\uff0c\u63a8\u7406\u80fd\u529b\u53ef\u6539\u5584\u5f31\u6a21\u578b\u4f46\u4ecd\u96be\u907f\u514d\u7ed3\u6784\u4fdd\u6301\u5931\u8d25\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Purpose: Deep learning-based medical image segmentation has achieved remarkable success, yet purely data-driven approaches often fail to exploit the rich mathematical structure inherent in medical images. We investigate whether explicit mathematical inductive biases, specifically matrix spectral analysis and vector calculus operators, can enhance segmentation beyond data-driven learning alone. Methods: We propose M-Net (Math-Augmented Network), which integrates three complementary mathematical priors into U-Net: (1) continuous spectral features derived from the condition number of centered local pixel matrices, providing a differentiable measure of texture ill-conditioning; (2) physical field operators (divergence and a discrete curl-like boundary irregularity operator) computed from image gradient fields, capturing focal intensity extrema and edge non-smoothness; and (3) a Math-Attention Gate (MAG) that adaptively fuses mathematical features with CNN-extracted deep features at skip connections. Results: Experiments on three benchmarks (LiTS, KiTS, and BraTS) show that M-Net achieves Dice scores of 78.42%, 76.15%, and 83.67%, outperforming baseline U-Net by 12.37%, 3.52%, and 5.55% on liver, kidney, and brain tumor segmentation, respectively. Ablations reveal that the condition-number feature contributes a 2.14% gain over binary invertibility features, while MAG adds 1.45% over simple concatenation. Conclusion: M-Net establishes that mathematical inductive biases provide effective complementary information for medical image segmentation. The continuous condition-number feature offers superior gradient information over discrete alternatives, and MAG preserves these priors throughout the network. This work opens avenues for integrating linear algebra and vector calculus into deep architectures for medical imaging.", "arxiv_id": "2608.12196", "arxiv_url": "https://arxiv.org/abs/2608.12196", "authors": ["Jing Zhu", "Ye Wang", "Fumin Wang"], "brief": "\u8bba\u6587\u63d0\u51fa M-Net\uff0c\u5728 U-Net \u4e2d\u5f15\u5165\u5c40\u90e8\u77e9\u9635\u6761\u4ef6\u6570\u8c31\u7279\u5f81\u3001\u6563\u5ea6/\u7c7b\u65cb\u5ea6\u7b49\u7269\u7406\u573a\u7b97\u5b50\uff0c\u5e76\u7528 Math-Attention Gate \u878d\u5408\u6570\u5b66\u5148\u9a8c\u4e0e\u6df1\u5ea6\u7279\u5f81\u3002\u5176\u5728 LiTS\u3001KiTS\u3001BraTS \u4e09\u4e2a\u533b\u5b66\u5206\u5272\u57fa\u51c6\u4e0a\u5747\u8d85\u8fc7 U-Net\uff0cDice \u5206\u522b\u63d0\u5347 12.37%\u30013.52% \u548c 5.55%\uff0c\u8868\u660e\u663e\u5f0f\u6570\u5b66\u5f52\u7eb3\u504f\u7f6e\u80fd\u6709\u6548\u589e\u5f3a\u533b\u5b66\u56fe\u50cf\u5206\u5272\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12196", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u6570\u5b66\u5148\u9a8c", "\u6ce8\u610f\u529b\u673a\u5236", "\u5377\u79ef\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12196v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "M-Net: Integrating Spectral Features and Physical Field Operators into Deep Learning for Medical Image Segmentation", "tldr": "\u8bba\u6587\u63d0\u51fa M-Net\uff0c\u5728 U-Net \u4e2d\u5f15\u5165\u5c40\u90e8\u77e9\u9635\u6761\u4ef6\u6570\u8c31\u7279\u5f81\u3001\u6563\u5ea6/\u7c7b\u65cb\u5ea6\u7b49\u7269\u7406\u573a\u7b97\u5b50\uff0c\u5e76\u7528 Math-Attention Gate \u878d\u5408\u6570\u5b66\u5148\u9a8c\u4e0e\u6df1\u5ea6\u7279\u5f81\u3002\u5176\u5728 LiTS\u3001KiTS\u3001BraTS \u4e09\u4e2a\u533b\u5b66\u5206\u5272\u57fa\u51c6\u4e0a\u5747\u8d85\u8fc7 U-Net\uff0cDice \u5206\u522b\u63d0\u5347 12.37%\u30013.52% \u548c 5.55%\uff0c\u8868\u660e\u663e\u5f0f\u6570\u5b66\u5f52\u7eb3\u504f\u7f6e\u80fd\u6709\u6548\u589e\u5f3a\u533b\u5b66\u56fe\u50cf\u5206\u5272\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Kolmogorov-Arnold Networks (KANs) enhance nonlinear function approximation by replacing scalar weights with learnable univariate functions. However, assigning an independent function to every connection results in substantial parameter redundancy, limiting their scalability and efficiency. To reduce this redundancy, we introduce \\textbf{HY}perbolic \\textbf{D}ynamic \\textbf{R}epresentation \\textbf{A}rchitecture (HYDRA), a parameter-efficient hyperbolic extension of KAN that combines spline-based functional learning with representations in the Poincar\u00e9 ball. HYDRA maps vector-valued inputs into a bounded hyperbolic latent space, performs KAN-style updates in tangent space, and employs a low-rank prototype block to share functional transformations across hidden dimensions. The resulting hyperbolic representations provide a structured radial coordinate for interpretation, while radius control improves training stability by preventing boundary saturation. Extensive experiments across eight benchmark datasets demonstrate that HYDRA consistently achieves competitive or superior predictive performance while improving parameter efficiency and representation interpretability.", "arxiv_id": "2608.12194", "arxiv_url": "https://arxiv.org/abs/2608.12194", "authors": ["Zhao Su", "Yuxin Xia", "Haoran Li", "Jun Shen", "Qi Zhu", "Qingguo Zhou", "Binbin Yong"], "brief": "\u8bba\u6587\u63d0\u51fa HYDRA\uff0c\u4e00\u79cd\u9762\u5411 Kolmogorov-Arnold Networks \u7684\u53cc\u66f2\u52a8\u6001\u8868\u793a\u67b6\u6784\uff0c\u5c06\u8f93\u5165\u6620\u5c04\u5230\u5e9e\u52a0\u83b1\u7403\u4e2d\u7684\u53cc\u66f2\u6f5c\u7a7a\u95f4\uff0c\u5e76\u5728\u5207\u7a7a\u95f4\u8fdb\u884c KAN \u5f0f\u51fd\u6570\u66f4\u65b0\u3002\u901a\u8fc7\u4f4e\u79e9\u539f\u578b\u5757\u5171\u4eab\u51fd\u6570\u53d8\u6362\uff0cHYDRA \u5728\u516b\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u6216\u66f4\u597d\u7684\u9884\u6d4b\u6027\u80fd\uff0c\u540c\u65f6\u63d0\u5347\u53c2\u6570\u6548\u7387\u4e0e\u8868\u793a\u53ef\u89e3\u91ca\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12194", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["Kolmogorov-Arnold\u7f51\u7edc", "\u53cc\u66f2\u8868\u793a", "\u53c2\u6570\u9ad8\u6548", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12194v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HYDRA: Hyperbolic Dynamic Representation Architecture for Kolmogorov-Arnold Networks", "tldr": "\u8bba\u6587\u63d0\u51fa HYDRA\uff0c\u4e00\u79cd\u9762\u5411 Kolmogorov-Arnold Networks \u7684\u53cc\u66f2\u52a8\u6001\u8868\u793a\u67b6\u6784\uff0c\u5c06\u8f93\u5165\u6620\u5c04\u5230\u5e9e\u52a0\u83b1\u7403\u4e2d\u7684\u53cc\u66f2\u6f5c\u7a7a\u95f4\uff0c\u5e76\u5728\u5207\u7a7a\u95f4\u8fdb\u884c KAN \u5f0f\u51fd\u6570\u66f4\u65b0\u3002\u901a\u8fc7\u4f4e\u79e9\u539f\u578b\u5757\u5171\u4eab\u51fd\u6570\u53d8\u6362\uff0cHYDRA \u5728\u516b\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u6216\u66f4\u597d\u7684\u9884\u6d4b\u6027\u80fd\uff0c\u540c\u65f6\u63d0\u5347\u53c2\u6570\u6548\u7387\u4e0e\u8868\u793a\u53ef\u89e3\u91ca\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Foundation models for protein structure prediction remain unreliable on certain targets. External oracles can flag and correct these failures, but biological oracles are expensive, making oracle budget a critical constraint. Existing guidance methods, such as FK-steering, DPO, and Best K-of-N sampling, differ in how they spend this budget, yet no systematic comparison exists to guide method selection. To bridge this gap, we benchmark these methods alongside the recently proposed Optimisation Over Outputs (O3), which applies off-the-shelf optimisers within a generative model\u0027s latent subspace. We extend the usage of O3 to protein structure prediction models. Overall, our work provides the first practical reference for oracle budget-aware guidance. Our evaluation on two protein targets, calmodulin (1CLL) and E. coli aspartate transcarbamoylase (9EEH), reveals that no single method consistently dominates across all budgets and oracles. Specifically, O3 proves most effective at low oracle budgets, while FK-steering and DPO demonstrate improved performance as the budget increases. We distil these findings into actionable recommendations for practitioners operating under real-world oracle-budget constraints.", "arxiv_id": "2608.12192", "arxiv_url": "https://arxiv.org/abs/2608.12192", "authors": ["Aleksandra Kalisz", "Jack Simons", "Krisztina Sinkovics", "Noam Ghenassia", "Shikha Surana", "Henry Moss", "Paul Duckworth"], "brief": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u86cb\u767d\u8d28\u7ed3\u6784\u9884\u6d4b\u4e2d\u591a\u79cd\u5229\u7528\u5916\u90e8 oracle \u8fdb\u884c\u5f15\u5bfc/\u7ea0\u9519\u7684\u65b9\u6cd5\uff0c\u5305\u62ec FK-steering\u3001DPO\u3001Best K-of-N \u548c O3\uff0c\u5e76\u5c06 O3 \u6269\u5c55\u5230\u86cb\u767d\u8d28\u7ed3\u6784\u9884\u6d4b\u6a21\u578b\u3002\u5b9e\u9a8c\u8868\u660e\u4e0d\u540c oracle \u9884\u7b97\u4e0b\u6700\u4f18\u65b9\u6cd5\u4e0d\u540c\uff1a\u4f4e\u9884\u7b97\u65f6 O3 \u66f4\u6709\u6548\uff0c\u9884\u7b97\u589e\u52a0\u540e FK-steering \u548c DPO \u8868\u73b0\u66f4\u597d\uff0c\u8bba\u6587\u7ed9\u51fa\u4e86\u9762\u5411\u5b9e\u9645\u9884\u7b97\u7ea6\u675f\u7684\u9009\u62e9\u5efa\u8bae\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12192", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u86cb\u767d\u8d28\u7ed3\u6784\u9884\u6d4b", "\u57fa\u7840\u6a21\u578b", "\u4f18\u5316\u5f15\u5bfc", "\u9884\u7b97\u7ea6\u675f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12192v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How to Spend Your Oracle Budget: Practical Guidance for Protein Structure Prediction Models", "tldr": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u86cb\u767d\u8d28\u7ed3\u6784\u9884\u6d4b\u4e2d\u591a\u79cd\u5229\u7528\u5916\u90e8 oracle \u8fdb\u884c\u5f15\u5bfc/\u7ea0\u9519\u7684\u65b9\u6cd5\uff0c\u5305\u62ec FK-steering\u3001DPO\u3001Best K-of-N \u548c O3\uff0c\u5e76\u5c06 O3 \u6269\u5c55\u5230\u86cb\u767d\u8d28\u7ed3\u6784\u9884\u6d4b\u6a21\u578b\u3002\u5b9e\u9a8c\u8868\u660e\u4e0d\u540c oracle \u9884\u7b97\u4e0b\u6700\u4f18\u65b9\u6cd5\u4e0d\u540c\uff1a\u4f4e\u9884\u7b97\u65f6 O3 \u66f4\u6709\u6548\uff0c\u9884\u7b97\u589e\u52a0\u540e FK-steering \u548c DPO \u8868\u73b0\u66f4\u597d\uff0c\u8bba\u6587\u7ed9\u51fa\u4e86\u9762\u5411\u5b9e\u9645\u9884\u7b97\u7ea6\u675f\u7684\u9009\u62e9\u5efa\u8bae\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the increasing complexity of cyber assaults in cloud environments, adaptable security solutions are needed that can support real-time detection and autonomous response. In this paper, we propose a reinforcement learning-based dynamic cyber defense framework. We deploy a Deep Q-Network (DQN) to train effective defensive strategies to counteract the evolving cyberattacks. We leverage the CICIDS2017 dataset for model creation and the UNSW-NB15 dataset for external validation, involving preprocessing of data, feature engineering, and adaptive policy learning. We compare the proposed DQN with decision tree, support vector machine, random forest, XGBoost, and multilayer perceptron models. The proposed DQN achieves an accuracy of 99.72%, a precision of 99.68%, a recall of 99.65%, an F1-score of 99.66%, and an ROC-AUC of 0.999, while the false positive rate is 0.31%, the false negative rate is 0.35%, and the detection latency is 15 ms. The framework achieved 99.54% attack mitigation rate, demonstrating strong adaptive and real-time defensive capabilities. These results demonstrate the potential of reinforcement learning as a powerful and scalable approach for autonomous cybersecurity in modern cloud environments.", "arxiv_id": "2608.12190", "arxiv_url": "https://arxiv.org/abs/2608.12190", "authors": ["Md Yassir Mottalib", "Md Yousuf", "Eklachur Rahman Bhuiyan", "S M Ahsan Habib", "Sonjoy Kumar Dey", "Md. Salahuddin Gazi", "Molay Kumar Roy", "Asaduzzaman Anik"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u4e91\u57fa\u7840\u8bbe\u65bd\u7684\u5f3a\u5316\u5b66\u4e60\u52a8\u6001\u7f51\u7edc\u9632\u5fa1\u6846\u67b6\uff0c\u4f7f\u7528\u6df1\u5ea6Q\u7f51\u7edc\uff08DQN\uff09\u8fdb\u884c\u5165\u4fb5\u68c0\u6d4b\u4e0e\u81ea\u52a8\u5a01\u80c1\u7f13\u89e3\u3002\u6a21\u578b\u5728CICIDS2017\u8bad\u7ec3\u5e76\u7528UNSW-NB15\u5916\u90e8\u9a8c\u8bc1\uff0c\u53d6\u5f9799.72%\u51c6\u786e\u7387\u30010.999 ROC-AUC\u548c15\u6beb\u79d2\u68c0\u6d4b\u5ef6\u8fdf\uff0c\u653b\u51fb\u7f13\u89e3\u7387\u8fbe99.54%\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12190", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u5f3a\u5316\u5b66\u4e60", "\u5165\u4fb5\u68c0\u6d4b", "\u4e91\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12190v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Machine Learning-Based Cyber Defense for Cloud Infrastructure: An Adaptive Deep Q-Network Architecture for Intelligent Intrusion Detection and Automated Threat Mitigation", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u4e91\u57fa\u7840\u8bbe\u65bd\u7684\u5f3a\u5316\u5b66\u4e60\u52a8\u6001\u7f51\u7edc\u9632\u5fa1\u6846\u67b6\uff0c\u4f7f\u7528\u6df1\u5ea6Q\u7f51\u7edc\uff08DQN\uff09\u8fdb\u884c\u5165\u4fb5\u68c0\u6d4b\u4e0e\u81ea\u52a8\u5a01\u80c1\u7f13\u89e3\u3002\u6a21\u578b\u5728CICIDS2017\u8bad\u7ec3\u5e76\u7528UNSW-NB15\u5916\u90e8\u9a8c\u8bc1\uff0c\u53d6\u5f9799.72%\u51c6\u786e\u7387\u30010.999 ROC-AUC\u548c15\u6beb\u79d2\u68c0\u6d4b\u5ef6\u8fdf\uff0c\u653b\u51fb\u7f13\u89e3\u7387\u8fbe99.54%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Transformer-based methods have achieved strong performance in monocular 3D human pose estimation, but most existing approaches organise spatial and temporal reasoning as separate stages, which may weaken unified spatial-temporal interdependencies inherent in human motion and compress frame-level structural information before temporal modelling. In this paper, we propose HSTGFormer, a graph-enhanced Transformer framework that reformulates spatial-temporal reasoning as localised coupled graph aggregation over joint-time nodes. Specifically, HSTGFormer introduces a Hyper Spatial-Temporal Graph (HSTG), which decomposes global spatial-temporal reasoning into local spatial-temporal receptive fields around individual joint-time nodes by extending per-frame skeleton graphs into temporal neighbourhoods, thereby enabling structure-aware coupled reasoning while preserving local structural motion information. It further incorporates an Adaptive Dual-Scale Temporal Graph (ADSTG) to capture joint-specific temporal dependencies over complementary short- and long-range windows. A lightweight node-wise fusion module further adaptively integrates the two graph representations for each joint-time node. Experiments on Human3.6M and MPI-INF-3DHP show that HSTGFormer achieves strong accuracy with high computational efficiency.", "arxiv_id": "2608.12187", "arxiv_url": "https://arxiv.org/abs/2608.12187", "authors": ["Ruochen Li", "Shuang Chen", "Wenke E", "Farshad Arvin", "Amir Atapour-Abarghouei"], "brief": "\u672c\u6587\u63d0\u51fa HSTGFormer\uff0c\u5c06\u5355\u76ee 3D \u4eba\u4f53\u59ff\u6001\u4f30\u8ba1\u4e2d\u7684\u65f6\u7a7a\u63a8\u7406\u91cd\u6784\u4e3a\u5173\u8282-\u65f6\u95f4\u8282\u70b9\u4e0a\u7684\u5c40\u90e8\u8026\u5408\u56fe\u805a\u5408\u3002\u5176\u8d85\u65f6\u7a7a\u56fe\u4e0e\u81ea\u9002\u5e94\u53cc\u5c3a\u5ea6\u65f6\u95f4\u56fe\u80fd\u540c\u65f6\u5efa\u6a21\u5c40\u90e8\u7ed3\u6784\u8fd0\u52a8\u548c\u957f\u77ed\u671f\u65f6\u95f4\u4f9d\u8d56\uff0c\u5728 Human3.6M \u4e0e MPI-INF-3DHP \u4e0a\u53d6\u5f97\u9ad8\u7cbe\u5ea6\u4e14\u8ba1\u7b97\u6548\u7387\u8f83\u597d\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12187", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u4f53\u59ff\u6001\u4f30\u8ba1", "\u56fe\u795e\u7ecf\u7f51\u7edc", "Transformer", "\u65f6\u7a7a\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12187v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HSTGFormer: Hyper Spatial-Temporal Graph Transformer for 3D Human Pose Estimation", "tldr": "\u672c\u6587\u63d0\u51fa HSTGFormer\uff0c\u5c06\u5355\u76ee 3D \u4eba\u4f53\u59ff\u6001\u4f30\u8ba1\u4e2d\u7684\u65f6\u7a7a\u63a8\u7406\u91cd\u6784\u4e3a\u5173\u8282-\u65f6\u95f4\u8282\u70b9\u4e0a\u7684\u5c40\u90e8\u8026\u5408\u56fe\u805a\u5408\u3002\u5176\u8d85\u65f6\u7a7a\u56fe\u4e0e\u81ea\u9002\u5e94\u53cc\u5c3a\u5ea6\u65f6\u95f4\u56fe\u80fd\u540c\u65f6\u5efa\u6a21\u5c40\u90e8\u7ed3\u6784\u8fd0\u52a8\u548c\u957f\u77ed\u671f\u65f6\u95f4\u4f9d\u8d56\uff0c\u5728 Human3.6M \u4e0e MPI-INF-3DHP \u4e0a\u53d6\u5f97\u9ad8\u7cbe\u5ea6\u4e14\u8ba1\u7b97\u6548\u7387\u8f83\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Algorithm registers have been championed as a means of providing transparency on the use of algorithms in public services. Yet potential publics differ in their expectations of what should be made transparent and how, as well as in their interest in and ability to parse the information currently published in the registers. Moreover, it remains unclear how these instruments can represent the sociotechnical systems in which these algorithms are embedded, and how system-level transparency can facilitate accountability. In this paper, we ask, what do algorithm registers reveal (and occlude) about the sociotechnical systems governing algorithmic systems, and how can diverse stakeholder perspectives inform a more pluralistic system-theoretic safety analysis? To do this, we probe the municipal algorithm register of a Dutch city through a case study of a decision-support tool for caseworkers\u0027 assessment of citizens\u0027 welfare benefits eligibility based on legal automation through a business rule engine. Through interviews, surveys, and participatory system mapping workshops (with municipal staff, civil society organisations, and ombudsmen, N=8), we seek to understand to what extent the register allows stakeholders to map the algorithmic system in question. These maps inform a System-Theoretic Process Analysis (STPA) that situates the register within a wider sociotechnical governance structure. Participants\u0027 contributions allow us to identify potential safety hazards which would not have been possible to see using the algorithm register alone, including benefits eligibility denial, system performance deterioration, and inability to contest wrongful decisions. By engaging both direct and indirect stakeholders, we reflect on the normative dimensions of algorithm governance efforts and how politics shape the practice of system safety analysis.", "arxiv_id": "2608.12166", "arxiv_url": "https://arxiv.org/abs/2608.12166", "authors": ["\u00cd\u00f1igo de Troya", "Maurus Enbergs", "Neelke Doorn", "Roel Dobbe"], "brief": "\u672c\u6587\u7814\u7a76\u516c\u5171\u670d\u52a1\u4e2d\u7684\u7b97\u6cd5\u767b\u8bb0\u518c\u80fd\u63ed\u793a\u548c\u906e\u853d\u54ea\u4e9b\u793e\u4f1a\u6280\u672f\u6cbb\u7406\u4fe1\u606f\uff0c\u5e76\u4ee5\u8377\u5170\u67d0\u5e02\u798f\u5229\u8d44\u683c\u51b3\u7b56\u652f\u6301\u5de5\u5177\u4e3a\u6848\u4f8b\u3002\u4f5c\u8005\u901a\u8fc7\u8bbf\u8c08\u3001\u95ee\u5377\u548c\u53c2\u4e0e\u5f0f\u7cfb\u7edf\u6620\u5c04\uff0c\u5c06\u591a\u65b9\u5229\u76ca\u76f8\u5173\u8005\u89c2\u70b9\u7eb3\u5165\u7cfb\u7edf\u7406\u8bba\u8fc7\u7a0b\u5206\u6790\uff0c\u53d1\u73b0\u4ec5\u9760\u767b\u8bb0\u518c\u96be\u4ee5\u8bc6\u522b\u798f\u5229\u9519\u8bef\u62d2\u7edd\u3001\u7cfb\u7edf\u6027\u80fd\u9000\u5316\u3001\u7533\u8bc9\u56f0\u96be\u7b49\u98ce\u9669\u3002", "categories": ["cs.CY", "cs.AI", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12166", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u6cbb\u7406", "\u7b97\u6cd5\u900f\u660e", "\u793e\u4f1a\u6280\u672f\u7cfb\u7edf", "\u5b89\u5168\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12166v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Co-constructing sociotechnical AI governance: participatory system mapping using algorithm registers", "tldr": "\u672c\u6587\u7814\u7a76\u516c\u5171\u670d\u52a1\u4e2d\u7684\u7b97\u6cd5\u767b\u8bb0\u518c\u80fd\u63ed\u793a\u548c\u906e\u853d\u54ea\u4e9b\u793e\u4f1a\u6280\u672f\u6cbb\u7406\u4fe1\u606f\uff0c\u5e76\u4ee5\u8377\u5170\u67d0\u5e02\u798f\u5229\u8d44\u683c\u51b3\u7b56\u652f\u6301\u5de5\u5177\u4e3a\u6848\u4f8b\u3002\u4f5c\u8005\u901a\u8fc7\u8bbf\u8c08\u3001\u95ee\u5377\u548c\u53c2\u4e0e\u5f0f\u7cfb\u7edf\u6620\u5c04\uff0c\u5c06\u591a\u65b9\u5229\u76ca\u76f8\u5173\u8005\u89c2\u70b9\u7eb3\u5165\u7cfb\u7edf\u7406\u8bba\u8fc7\u7a0b\u5206\u6790\uff0c\u53d1\u73b0\u4ec5\u9760\u767b\u8bb0\u518c\u96be\u4ee5\u8bc6\u522b\u798f\u5229\u9519\u8bef\u62d2\u7edd\u3001\u7cfb\u7edf\u6027\u80fd\u9000\u5316\u3001\u7533\u8bc9\u56f0\u96be\u7b49\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Standard evaluation of large language models assumes stable model rankings across inference conditions. We challenge this assumption by varying the token generation budget, i.e., the maximum tokens a model may produce, across seven levels (64--4,096), evaluating four models on three reasoning benchmarks (56,476 inferences). We report four findings: (i) 3--19% of items exhibit non-monotone behavior (accuracy decreasing with more budget), even after controlling for truncation, and this phenomenon is model-specific (cross-model overlap: 6--14%). (ii) Model rankings reverse across budgets on all benchmarks ($p {\u003c} 0.01$, McNemar). (iii) Oracle analysis reveals model complementarity up to $+27.8$pp, most pronounced at constrained budgets. (iv) A budget-aware router captures 14.1% of the oracle gap cross-domain; budget features help within-domain ($+1.6$ to $+5.7$pp) but are domain-specific and hurt transfer ($-1.2$pp). These results argue for budget-conditioned evaluation protocols.", "arxiv_id": "2608.12150", "arxiv_url": "https://arxiv.org/abs/2608.12150", "authors": ["Rodrigo Guedes de Souza", "Alison R. Panisson"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4e0d\u540c\u751f\u6210 token \u9884\u7b97\u4e0b\u7684\u63a8\u7406\u8bc4\u6d4b\u8868\u73b0\uff0c\u53d1\u73b0\u6a21\u578b\u51c6\u786e\u7387\u5e76\u4e0d\u603b\u662f\u968f\u9884\u7b97\u589e\u52a0\u800c\u63d0\u5347\uff0c\u4e14\u4e0d\u540c\u9884\u7b97\u4f1a\u5bfc\u81f4\u6a21\u578b\u6392\u540d\u53cd\u8f6c\u3002\u7ed3\u679c\u8868\u660e\u73b0\u6709\u56fa\u5b9a\u9884\u7b97\u8bc4\u6d4b\u53ef\u80fd\u8bef\u5bfc\u6a21\u578b\u6bd4\u8f83\uff0c\u9884\u7b97\u611f\u77e5\u8def\u7531\u5668\u80fd\u90e8\u5206\u5229\u7528\u6a21\u578b\u4e92\u8865\u6027\uff0c\u4f46\u8de8\u57df\u6cdb\u5316\u6709\u9650\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12150", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b", "\u63a8\u7406", "\u8def\u7531\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12150v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Who Thinks Best Depends on How Long You Let Them: Budget-Dependent Rankings in LLM Evaluation", "tldr": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4e0d\u540c\u751f\u6210 token \u9884\u7b97\u4e0b\u7684\u63a8\u7406\u8bc4\u6d4b\u8868\u73b0\uff0c\u53d1\u73b0\u6a21\u578b\u51c6\u786e\u7387\u5e76\u4e0d\u603b\u662f\u968f\u9884\u7b97\u589e\u52a0\u800c\u63d0\u5347\uff0c\u4e14\u4e0d\u540c\u9884\u7b97\u4f1a\u5bfc\u81f4\u6a21\u578b\u6392\u540d\u53cd\u8f6c\u3002\u7ed3\u679c\u8868\u660e\u73b0\u6709\u56fa\u5b9a\u9884\u7b97\u8bc4\u6d4b\u53ef\u80fd\u8bef\u5bfc\u6a21\u578b\u6bd4\u8f83\uff0c\u9884\u7b97\u611f\u77e5\u8def\u7531\u5668\u80fd\u90e8\u5206\u5229\u7528\u6a21\u578b\u4e92\u8865\u6027\uff0c\u4f46\u8de8\u57df\u6cdb\u5316\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "General-purpose large language models (LLMs) have recently been reported to match or exceed specialized clinical AI tools on medical benchmarks, but such comparisons draw on a narrow set of systems and on benchmarks developed largely in high-income settings. We evaluate VITA, a retrieval-augmented generation (RAG) system purpose-built for contextual knowledge retrieval in India and other low- and middle-income (LMIC) settings. VITA retrieves from a curated corpus of disease-specific guidelines, India-specific antimicrobial resistance data, national formulary constraints, and resource-limited care protocols; its architecture and corpus are proprietary, but the benchmark, the physician-written rubrics, and our full response and scoring outputs are public for independent verification. On 4,023 English-language HealthBench questions (80.5% of the benchmark), scored with a GPT-4.1 judge, VITA ranked first with 51.9% of possible rubric points, ahead of GPT-5.4 (46.1%), o4-mini (44.3%), Gemini 3.1 Pro (42.6%), and Claude Sonnet 4.6 (37.3%), and scored highest on 45.4% of questions. To test robustness to newer models and judge lineage, a 500-question subset was re-run against current-generation models (GPT-5.5, Claude Opus 4.8, Gemini 3.5 Pro, Grok 4.3) and graded by a neutral open-weight judge (DeepSeek-V4-Pro) sharing no lineage with any system tested. Here the gap narrowed to parity: VITA and GPT-5.5 were statistically indistinguishable on mean per-question score, while VITA led on points-weighted score and won the most questions. VITA\u0027s advantages in accuracy and completeness persisted under the neutral judge; its communication scores were lower. These results indicate that a purpose-built clinical RAG system remains competitive with frontier LLMs on an open benchmark, consistent with corpus specificity as a design variable that improves grounding at some cost to communication polish.", "arxiv_id": "2608.12138", "arxiv_url": "https://arxiv.org/abs/2608.12138", "authors": ["Praveen Reddy", "Charuta Mandke", "Suvrankar Datta", "Sarah Khan", "Siddharth Reddy Anthireddy", "Shitij Arora", "Vishal Singh"], "brief": "\u8bba\u6587\u8bc4\u4f30\u4e86\u9762\u5411\u5370\u5ea6\u53ca\u4e2d\u4f4e\u6536\u5165\u5730\u533a\u4e34\u5e8a\u573a\u666f\u7684\u4e13\u7528 RAG \u7cfb\u7edf VITA\uff0c\u5176\u68c0\u7d22\u7279\u5b9a\u6307\u5357\u3001\u8010\u836f\u6570\u636e\u3001\u836f\u5178\u7ea6\u675f\u548c\u8d44\u6e90\u53d7\u9650\u8bca\u7597\u65b9\u6848\u3002\u5728 HealthBench \u4e0a\uff0cVITA \u603b\u4f53\u5f97\u5206\u8d85\u8fc7\u591a\u6b3e\u524d\u6cbf LLM\uff1b\u5728\u66f4\u65b0\u6a21\u578b\u548c\u4e2d\u7acb\u8bc4\u6d4b\u5668\u7684\u5b50\u96c6\u6d4b\u8bd5\u4e2d\u4e0e GPT-5.5 \u57fa\u672c\u6301\u5e73\uff0c\u5e76\u5728\u52a0\u6743\u5f97\u5206\u548c\u80dc\u51fa\u9898\u6570\u4e0a\u9886\u5148\uff0c\u4f46\u8868\u8fbe\u6c9f\u901a\u80fd\u529b\u8f83\u5f31\u3002", "categories": ["cs.CL", "cs.AI", "cs.HC", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12138", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u533b\u7597\u5927\u6a21\u578b", "\u4e34\u5e8a\u8bc4\u6d4b", "\u77e5\u8bc6\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12138v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A corpus-specific clinical RAG system matches or outperforms newer frontier LLMs on HealthBench", "tldr": "\u8bba\u6587\u8bc4\u4f30\u4e86\u9762\u5411\u5370\u5ea6\u53ca\u4e2d\u4f4e\u6536\u5165\u5730\u533a\u4e34\u5e8a\u573a\u666f\u7684\u4e13\u7528 RAG \u7cfb\u7edf VITA\uff0c\u5176\u68c0\u7d22\u7279\u5b9a\u6307\u5357\u3001\u8010\u836f\u6570\u636e\u3001\u836f\u5178\u7ea6\u675f\u548c\u8d44\u6e90\u53d7\u9650\u8bca\u7597\u65b9\u6848\u3002\u5728 HealthBench \u4e0a\uff0cVITA \u603b\u4f53\u5f97\u5206\u8d85\u8fc7\u591a\u6b3e\u524d\u6cbf LLM\uff1b\u5728\u66f4\u65b0\u6a21\u578b\u548c\u4e2d\u7acb\u8bc4\u6d4b\u5668\u7684\u5b50\u96c6\u6d4b\u8bd5\u4e2d\u4e0e GPT-5.5 \u57fa\u672c\u6301\u5e73\uff0c\u5e76\u5728\u52a0\u6743\u5f97\u5206\u548c\u80dc\u51fa\u9898\u6570\u4e0a\u9886\u5148\uff0c\u4f46\u8868\u8fbe\u6c9f\u901a\u80fd\u529b\u8f83\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study nonnegative submodular maximization subject to a general matroid when the offline algorithm is given an arbitrary controlled value oracle. Our main result is an adversarial resilience theorem for the Spiteful Greedy Swap Poisson Process (SGS-Poisson): without modifying its Poisson intensity, single-element exchange rule, or spiteful drop step, the algorithm retains limiting approximation factors $1/e$ for non-monotone objectives and $1-1/e$ for monotone objectives. More precisely, under every controlled oracle $\\widehat f$ satisfying $|\\widehat f(S)-f(S)|\\le \u03be$ for every set $S$, our implementation returns a feasible set with expected value at least $(1/e-\\varepsilon)\\OPT-O(k\u03be)$ and $(1-1/e-\\varepsilon)\\OPT-O(k\u03be)$, respectively, using $\\widetilde O(nk^2\\varepsilon^{-2})$ oracle calls. As a consequence, the offline-to-online reduction yields full-bandit CMAB algorithms for general matroid-constrained submodular rewards with exact limiting approximation-regret factors $1/e$ and $1-1/e$ and $\\widetilde O(n^{1/5}k^{4/5}T^{4/5})$ regret.", "arxiv_id": "2608.12134", "arxiv_url": "https://arxiv.org/abs/2608.12134", "authors": ["Vaneet Aggarwal"], "brief": "\u8bba\u6587\u7814\u7a76\u62df\u9635\u7ea6\u675f\u4e0b\u7684\u975e\u8d1f\u5b50\u6a21\u6700\u5927\u5316\uff0c\u8bc1\u660e SGS-Poisson \u7b97\u6cd5\u5728\u5e26\u6709\u6709\u754c\u5bf9\u6297\u566a\u58f0\u7684\u53d7\u63a7\u4ef7\u503c oracle \u4e0b\u4ecd\u4fdd\u6301\u7a33\u5065\u8fd1\u4f3c\u4fdd\u8bc1\u3002\u7ed3\u679c\u7ed9\u51fa\u975e\u5355\u8c03\u76ee\u6807\u7ea6 1/e\u3001\u5355\u8c03\u76ee\u6807\u7ea6 1-1/e \u7684\u6781\u9650\u8fd1\u4f3c\u56e0\u5b50\uff0c\u5e76\u53ef\u8f6c\u5316\u4e3a\u5168\u53cd\u9988 bandit \u7ec4\u5408\u4f18\u5316\u7b97\u6cd5\uff0c\u83b7\u5f97\u76f8\u5e94\u8fd1\u4f3c\u9057\u61be\u754c\u3002", "categories": ["cs.LG", "cs.AI", "cs.CC", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12134", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5b50\u6a21\u4f18\u5316", "\u62df\u9635\u7ea6\u675f", "\u9c81\u68d2\u4f18\u5316", "bandit\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12134v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Adversarial Resilience of Poisson-Process Submodular Maximization over Matroids: From Robust Offline Optimization to Full-Bandit Learning", "tldr": "\u8bba\u6587\u7814\u7a76\u62df\u9635\u7ea6\u675f\u4e0b\u7684\u975e\u8d1f\u5b50\u6a21\u6700\u5927\u5316\uff0c\u8bc1\u660e SGS-Poisson \u7b97\u6cd5\u5728\u5e26\u6709\u6709\u754c\u5bf9\u6297\u566a\u58f0\u7684\u53d7\u63a7\u4ef7\u503c oracle \u4e0b\u4ecd\u4fdd\u6301\u7a33\u5065\u8fd1\u4f3c\u4fdd\u8bc1\u3002\u7ed3\u679c\u7ed9\u51fa\u975e\u5355\u8c03\u76ee\u6807\u7ea6 1/e\u3001\u5355\u8c03\u76ee\u6807\u7ea6 1-1/e \u7684\u6781\u9650\u8fd1\u4f3c\u56e0\u5b50\uff0c\u5e76\u53ef\u8f6c\u5316\u4e3a\u5168\u53cd\u9988 bandit \u7ec4\u5408\u4f18\u5316\u7b97\u6cd5\uff0c\u83b7\u5f97\u76f8\u5e94\u8fd1\u4f3c\u9057\u61be\u754c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Enterprise guideline documents are heterogeneous and multimodal, combining narrative text, complex tables, and embedded images. Existing LLM and VLM systems face hallucinated content, table structure degradation, and lack governed workflows extending beyond extraction to validation and artifact generation. This leaves enterprises to perform this manually, consuming 2-3 days per document. To address this, we introduce GUIDE, a governed multi-agent framework built on a shared versioned rule store with schema-validated inter-agent contracts and end-to-end provenance tracking. Six specialized agents handle parsing, VLM-driven extraction, consistency checking, evaluation, human-in-the-loop (HITL) escalation, and persona-tailored artifact synthesis. Evaluated on 120 real-world enterprise guideline documents, GUIDE achieves 96% document success, extracts 3,896 rules with 71.4% auto-approved, produces 812 deployment-ready artifacts, and reduces turnaround to 40-125 minutes per document.", "arxiv_id": "2608.12133", "arxiv_url": "https://arxiv.org/abs/2608.12133", "authors": ["Shivali Dalmia", "Sumukha Thoppanahalli", "Mohammadreza Sediqin", "Abhishek Mukherji"], "brief": "GUIDE \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u6307\u5357\u6587\u6863\u7684\u6cbb\u7406\u5f0f\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u7248\u672c\u5316\u89c4\u5219\u5e93\u3001\u7ed3\u6784\u5316\u5408\u7ea6\u548c\u5168\u6d41\u7a0b\u6eaf\u6e90\uff0c\u5c06\u5f02\u6784\u591a\u6a21\u6001\u6587\u6863\u8f6c\u5316\u4e3a\u53ef\u90e8\u7f72\u5de5\u4ef6\u3002\u5176\u5728120\u4efd\u771f\u5b9e\u4f01\u4e1a\u6587\u6863\u4e0a\u8fbe\u523096%\u6587\u6863\u6210\u529f\u7387\uff0c\u751f\u6210812\u4e2a\u53ef\u90e8\u7f72\u5de5\u4ef6\uff0c\u5e76\u5c06\u6bcf\u4efd\u6587\u6863\u5904\u7406\u65f6\u95f4\u4ece2-3\u5929\u964d\u81f340-125\u5206\u949f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12133", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u6587\u6863\u7406\u89e3", "\u4f01\u4e1a\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null,
