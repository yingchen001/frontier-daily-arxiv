"pdf_url": "https://arxiv.org/pdf/2608.12133v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GUIDE: Governed Unified Intelligence for Document-to-Artifact Generation in Enterprise Settings", "tldr": "GUIDE \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u6307\u5357\u6587\u6863\u7684\u6cbb\u7406\u5f0f\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u7248\u672c\u5316\u89c4\u5219\u5e93\u3001\u7ed3\u6784\u5316\u5408\u7ea6\u548c\u5168\u6d41\u7a0b\u6eaf\u6e90\uff0c\u5c06\u5f02\u6784\u591a\u6a21\u6001\u6587\u6863\u8f6c\u5316\u4e3a\u53ef\u90e8\u7f72\u5de5\u4ef6\u3002\u5176\u5728120\u4efd\u771f\u5b9e\u4f01\u4e1a\u6587\u6863\u4e0a\u8fbe\u523096%\u6587\u6863\u6210\u529f\u7387\uff0c\u751f\u6210812\u4e2a\u53ef\u90e8\u7f72\u5de5\u4ef6\uff0c\u5e76\u5c06\u6bcf\u4efd\u6587\u6863\u5904\u7406\u65f6\u95f4\u4ece2-3\u5929\u964d\u81f340-125\u5206\u949f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As LLM-based agents with user-instructed goals are becoming widely deployed, they increasingly encounter each other in strategic interactions, and face challenges of finding mutually beneficial outcomes. Prior literature has argued that cooperation problems such as the Prisoner\u0027s Dilemma are resolvable in settings where agents know they follow very similar decision making patterns, as for example in monocultural AI ecosystems. Following that line of work, this paper introduces the first framework for evaluating LLM decision making when agents are provided with graded similarity signals. Among our findings, we establish that different LLM models vary drastically in how they navigate similarity signals, with some modern models showing consistent behavior across cooperation problems, payoff structures, and prompt framing. Perhaps surprisingly, our experiments also show that the dataset based on which the similarity signal is computed has small to no impact on induced cooperation, and that LLM models systematically self-identify as highly similar when asked to evaluate another model\u0027s chain-of-thought reasoning by themselves. Finally, we develop an LLM-behavioral-game-theoretic model that captures some of their reasoning rationale, and show that it can support cooperative outcomes in equilibrium under sufficiently high similarity scores.", "arxiv_id": "2608.12125", "arxiv_url": "https://arxiv.org/abs/2608.12125", "authors": ["Akash Kundu", "Emanuel Tewolde", "Ratip Emin Berker", "Samuel F. Brown", "Vincent Conitzer"], "brief": "\u672c\u6587\u63d0\u51fa\u9996\u4e2a\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u535a\u5f08\u4e2d\u5982\u4f55\u5229\u7528\u201c\u76f8\u4f3c\u6027\u4fe1\u53f7\u201d\u505a\u51b3\u7b56\u7684\u6846\u67b6\uff0c\u7814\u7a76\u5176\u5728\u56da\u5f92\u56f0\u5883\u7b49\u5408\u4f5c\u95ee\u9898\u4e2d\u7684\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u4e0d\u540c\u6a21\u578b\u5bf9\u76f8\u4f3c\u6027\u4fe1\u53f7\u7684\u53cd\u5e94\u5dee\u5f02\u5f88\u5927\uff1b\u6570\u636e\u96c6\u6765\u6e90\u5bf9\u5408\u4f5c\u8bf1\u5bfc\u5f71\u54cd\u5f88\u5c0f\uff0c\u800c\u6a21\u578b\u5728\u8bc4\u4f30\u4ed6\u4eba\u601d\u7ef4\u94fe\u65f6\u5e38\u4f1a\u81ea\u8ba4\u4e3a\u9ad8\u5ea6\u76f8\u4f3c\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u7ed3\u5408 LLM \u884c\u4e3a\u4e0e\u535a\u5f08\u8bba\u7684\u6a21\u578b\uff0c\u8bf4\u660e\u9ad8\u76f8\u4f3c\u5ea6\u4fe1\u53f7\u53ef\u5728\u5747\u8861\u4e2d\u652f\u6301\u5408\u4f5c\u3002", "categories": ["cs.GT", "cs.AI", "cs.CL", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12125", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u535a\u5f08\u8bba", "\u5408\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12125v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Do LLMs Take Care of Their Own? Similarity Signals Can Induce Cooperation", "tldr": "\u672c\u6587\u63d0\u51fa\u9996\u4e2a\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u535a\u5f08\u4e2d\u5982\u4f55\u5229\u7528\u201c\u76f8\u4f3c\u6027\u4fe1\u53f7\u201d\u505a\u51b3\u7b56\u7684\u6846\u67b6\uff0c\u7814\u7a76\u5176\u5728\u56da\u5f92\u56f0\u5883\u7b49\u5408\u4f5c\u95ee\u9898\u4e2d\u7684\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u4e0d\u540c\u6a21\u578b\u5bf9\u76f8\u4f3c\u6027\u4fe1\u53f7\u7684\u53cd\u5e94\u5dee\u5f02\u5f88\u5927\uff1b\u6570\u636e\u96c6\u6765\u6e90\u5bf9\u5408\u4f5c\u8bf1\u5bfc\u5f71\u54cd\u5f88\u5c0f\uff0c\u800c\u6a21\u578b\u5728\u8bc4\u4f30\u4ed6\u4eba\u601d\u7ef4\u94fe\u65f6\u5e38\u4f1a\u81ea\u8ba4\u4e3a\u9ad8\u5ea6\u76f8\u4f3c\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u7ed3\u5408 LLM \u884c\u4e3a\u4e0e\u535a\u5f08\u8bba\u7684\u6a21\u578b\uff0c\u8bf4\u660e\u9ad8\u76f8\u4f3c\u5ea6\u4fe1\u53f7\u53ef\u5728\u5747\u8861\u4e2d\u652f\u6301\u5408\u4f5c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-agent services repeatedly execute small deterministic transitions between model and tool calls: route an outcome, update state, and emit the next effect. We ask when this control path exposes enough concurrent work for GPU execution, and what changes when a GPU-computed route decision remains on device. We formalize the ready-cohort boundary using fixed-partition share F, exact offline share P*, local upper bound U, and online achieved share A. Under zero service time, unlimited capacity, and equal relative launch deadlines, a specialized dynamic program computes P* exactly. In a stationary Poisson replay of one pinned 851-session public trace panel, the primary condition at 100,000 target active sessions, K=256, and a 50 ms launch deadline gives F=30.19%, P*=43.00%, and U=45.85%. Exact packing recovers 81.83% of the opportunity lost at fixed window boundaries. The outcome-derived route key is a conditioning proxy, not proof of executable identity. A separate mechanism study keeps a GPU-computed binary decision on device instead of returning four bytes to the host and redispatching. Across four named GPU placements, the device-resident path is faster in all 36 configurations; within-placement row-median ratios range from 1.19x to 2.39x. Across both admissible mechanisms, all 14,557,440 tested batched invocations match a separately implemented host oracle. A fixed nested device graph that removes no host decision is slower in all 60 configurations across five placements. Together, the studies establish two measurable gates for GPU agent control: deadline-feasible cohort supply and observation placement. A joined finite online runtime is required to measure A, CPU displacement, and service-level benefit.", "arxiv_id": "2608.12123", "arxiv_url": "https://arxiv.org/abs/2608.12123", "authors": ["Josef Liyanjun Chen"], "brief": "\u672c\u6587\u7814\u7a76 LLM \u667a\u80fd\u4f53\u670d\u52a1\u4e2d\u6a21\u578b\u8c03\u7528\u4e0e\u5de5\u5177\u8c03\u7528\u4e4b\u95f4\u7684\u5c0f\u578b\u63a7\u5236\u903b\u8f91\u4f55\u65f6\u9002\u5408\u642c\u5230 GPU \u6267\u884c\uff0c\u5e76\u5f62\u5f0f\u5316\u4e86\u201cready cohort\u201d\u5e76\u53d1\u673a\u4f1a\u8fb9\u754c\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728 10 \u4e07\u6d3b\u8dc3\u4f1a\u8bdd\u7b49\u8bbe\u5b9a\u4e0b\uff0c\u7cbe\u786e\u6253\u5305\u53ef\u663e\u8457\u8ffd\u56de\u56fa\u5b9a\u7a97\u53e3\u635f\u5931\u7684\u673a\u4f1a\uff1b\u540c\u65f6\u5c06 GPU \u4e0a\u8ba1\u7b97\u51fa\u7684\u8def\u7531\u51b3\u7b56\u7559\u5728\u8bbe\u5907\u7aef\u53ef\u5728\u591a\u79cd\u914d\u7f6e\u4e2d\u5e26\u6765 1.19x \u5230 2.39x \u7684\u4e2d\u4f4d\u52a0\u901f\u3002", "categories": ["cs.DC", "cs.AI", "cs.OS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12123", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "GPU\u8c03\u5ea6", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12123v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ready Cohorts: Bounding GPU Opportunity and Avoiding Host Round Trips in LLM-Agent Control", "tldr": "\u672c\u6587\u7814\u7a76 LLM \u667a\u80fd\u4f53\u670d\u52a1\u4e2d\u6a21\u578b\u8c03\u7528\u4e0e\u5de5\u5177\u8c03\u7528\u4e4b\u95f4\u7684\u5c0f\u578b\u63a7\u5236\u903b\u8f91\u4f55\u65f6\u9002\u5408\u642c\u5230 GPU \u6267\u884c\uff0c\u5e76\u5f62\u5f0f\u5316\u4e86\u201cready cohort\u201d\u5e76\u53d1\u673a\u4f1a\u8fb9\u754c\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728 10 \u4e07\u6d3b\u8dc3\u4f1a\u8bdd\u7b49\u8bbe\u5b9a\u4e0b\uff0c\u7cbe\u786e\u6253\u5305\u53ef\u663e\u8457\u8ffd\u56de\u56fa\u5b9a\u7a97\u53e3\u635f\u5931\u7684\u673a\u4f1a\uff1b\u540c\u65f6\u5c06 GPU \u4e0a\u8ba1\u7b97\u51fa\u7684\u8def\u7531\u51b3\u7b56\u7559\u5728\u8bbe\u5907\u7aef\u53ef\u5728\u591a\u79cd\u914d\u7f6e\u4e2d\u5e26\u6765 1.19x \u5230 2.39x \u7684\u4e2d\u4f4d\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-Augmented Generation (RAG) repeatedly prefills identical text chunks across queries, incurring redundant computations. Position-Independent Caching (PIC) mitigates it by reusing precomputed Key-Value (KV) across positions, but its efficiency is constrained by the large volume of text tokens. Rendering text chunks as images can compress the text into fewer visual tokens, but the rendered-image PIC suffers more severe quality degradation than the text PIC. This representation-specific gap primarily arises from contextual mismatches across independently compiled caches and the loss of fine-grained textual evidence during visual compression. Existing PIC repair methods mainly address the former through selective recomputation, but they incur online computation and cannot recover lost textual details. We propose QV-PIC, a query-aware dual-resolution PIC reuse framework guided by model-native templates. Offline, QV-PIC compiles visual caches under the model\u0027s native chat-template prefix, improving PIC quality without online recomputation. Online, it preserves global context with low resolution and restores fine-grained textual evidence within a high-resolution budget by cumulative query relevance scores, retaining the efficiency benefit of visual compression. Across six tasks, QV-PIC improves average F1 by 21.6 points over vanilla rendered-image PIC, closes the gap to vanilla text PIC, and surpasses optimized text PIC by 2.58 F1 while reducing TTFT by 17.2\\%. Relative to full prefill, it cuts TTFT by 83.8%.", "arxiv_id": "2608.12121", "arxiv_url": "https://arxiv.org/abs/2608.12121", "authors": ["Yilin Liu", "Rui Meng", "Wangze Ni", "Jianxin Yan", "Heng Cao", "Libin Zheng", "Peng Cheng", "Jinfei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa QV-PIC\uff0c\u4e00\u79cd\u9762\u5411 RAG \u670d\u52a1\u7684\u67e5\u8be2\u611f\u77e5\u89c6\u89c9\u4f4d\u7f6e\u65e0\u5173\u7f13\u5b58\u6846\u67b6\uff0c\u5c06\u6587\u672c\u5757\u6e32\u67d3\u4e3a\u56fe\u50cf\u4ee5\u538b\u7f29\u89c6\u89c9 token\uff0c\u5e76\u901a\u8fc7\u6a21\u578b\u539f\u751f\u6a21\u677f\u79bb\u7ebf\u7f16\u8bd1\u7f13\u5b58\u3001\u5728\u7ebf\u53cc\u5206\u8fa8\u7387\u9009\u62e9\u6765\u517c\u987e\u5168\u5c40\u4e0a\u4e0b\u6587\u4e0e\u7ec6\u7c92\u5ea6\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u666e\u901a\u56fe\u50cf PIC \u5e73\u5747 F1 \u63d0\u5347 21.6 \u5206\uff0c\u8d85\u8fc7\u4f18\u5316\u6587\u672c PIC 2.58 F1\uff0c\u540c\u65f6\u5c06\u9996 token \u5ef6\u8fdf\u76f8\u5bf9\u5168\u91cf\u9884\u586b\u5145\u964d\u4f4e 83.8%\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12121", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "KV\u7f13\u5b58", "\u89c6\u89c9\u538b\u7f29", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12121v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QV-PIC: Query-Aware Visual Position-Independent Caching for Efficient RAG Serving", "tldr": "\u8bba\u6587\u63d0\u51fa QV-PIC\uff0c\u4e00\u79cd\u9762\u5411 RAG \u670d\u52a1\u7684\u67e5\u8be2\u611f\u77e5\u89c6\u89c9\u4f4d\u7f6e\u65e0\u5173\u7f13\u5b58\u6846\u67b6\uff0c\u5c06\u6587\u672c\u5757\u6e32\u67d3\u4e3a\u56fe\u50cf\u4ee5\u538b\u7f29\u89c6\u89c9 token\uff0c\u5e76\u901a\u8fc7\u6a21\u578b\u539f\u751f\u6a21\u677f\u79bb\u7ebf\u7f16\u8bd1\u7f13\u5b58\u3001\u5728\u7ebf\u53cc\u5206\u8fa8\u7387\u9009\u62e9\u6765\u517c\u987e\u5168\u5c40\u4e0a\u4e0b\u6587\u4e0e\u7ec6\u7c92\u5ea6\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u666e\u901a\u56fe\u50cf PIC \u5e73\u5747 F1 \u63d0\u5347 21.6 \u5206\uff0c\u8d85\u8fc7\u4f18\u5316\u6587\u672c PIC 2.58 F1\uff0c\u540c\u65f6\u5c06\u9996 token \u5ef6\u8fdf\u76f8\u5bf9\u5168\u91cf\u9884\u586b\u5145\u964d\u4f4e 83.8%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In high-stakes applications, reliable confidence estimates are as important as the predictions themselves. Confidence calibration ensures that predicted probabilities reflect the likelihood of correctness, making it essential for safe deployment of deep learning models. However, existing methods typically assume access to clean validation data, which is often unrealistic due to label noise and domain shifts. This thesis develops methods for improving calibration under these conditions. First, we address calibration under label noise. Standard methods can produce misleading confidence estimates when labels are unreliable. We propose a framework that uses an estimated noise model to reconstruct noise-free confidence estimates by modeling the relationship between noisy and clean label distributions. We extend this approach to Conformal Prediction (CP), which provides set-valued predictions with guaranteed coverage. Our noise-aware CP method estimates clean conformity scores despite label noise, enabling reliable uncertainty quantification. Next, we study calibration in unsupervised domain adaptation, where a model trained on a labeled source domain is adapted to an unlabeled target domain. Since labeled target data are unavailable, we estimate target-domain accuracy from source performance and domain discrepancies, enabling calibration without target labels. We also consider privacy-preserving settings in which user labels and model outputs must remain protected. We propose a locally differentially private conformal prediction framework that provides valid uncertainty quantification while maintaining privacy guarantees and balancing privacy, computational feasibility, and prediction reliability. Our results bridge calibration theory and practical deployment in safety-critical applications, contributing to reliable, privacy-preserving, and noise-resilient neural network predictions.", "arxiv_id": "2608.12100", "arxiv_url": "https://arxiv.org/abs/2608.12100", "authors": ["Coby Penso"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u6df1\u5ea6\u5b66\u4e60\u7f6e\u4fe1\u5ea6\u6821\u51c6\u5728\u771f\u5b9e\u90e8\u7f72\u4e2d\u7684\u96be\u9898\uff0c\u5305\u62ec\u6807\u7b7e\u566a\u58f0\u3001\u65e0\u76d1\u7763\u57df\u9002\u5e94\u548c\u9690\u79c1\u4fdd\u62a4\u573a\u666f\u3002\u63d0\u51fa\u566a\u58f0\u611f\u77e5\u6821\u51c6\u4e0e\u4fdd\u5f62\u9884\u6d4b\u3001\u65e0\u76ee\u6807\u6807\u7b7e\u6821\u51c6\u65b9\u6cd5\u4ee5\u53ca\u672c\u5730\u5dee\u5206\u9690\u79c1\u4fdd\u5f62\u9884\u6d4b\uff0c\u5728\u4fdd\u8bc1\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u53ef\u9760\u6027\u7684\u540c\u65f6\u63d0\u5347\u5b89\u5168\u6027\u4e0e\u5b9e\u7528\u6027\u3002", "categories": ["cs.LG", "cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12100", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f6e\u4fe1\u5ea6\u6821\u51c6", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u4fdd\u5f62\u9884\u6d4b", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12100v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Confidence Calibration of Deep Learning Systems", "tldr": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u6df1\u5ea6\u5b66\u4e60\u7f6e\u4fe1\u5ea6\u6821\u51c6\u5728\u771f\u5b9e\u90e8\u7f72\u4e2d\u7684\u96be\u9898\uff0c\u5305\u62ec\u6807\u7b7e\u566a\u58f0\u3001\u65e0\u76d1\u7763\u57df\u9002\u5e94\u548c\u9690\u79c1\u4fdd\u62a4\u573a\u666f\u3002\u63d0\u51fa\u566a\u58f0\u611f\u77e5\u6821\u51c6\u4e0e\u4fdd\u5f62\u9884\u6d4b\u3001\u65e0\u76ee\u6807\u6807\u7b7e\u6821\u51c6\u65b9\u6cd5\u4ee5\u53ca\u672c\u5730\u5dee\u5206\u9690\u79c1\u4fdd\u5f62\u9884\u6d4b\uff0c\u5728\u4fdd\u8bc1\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u53ef\u9760\u6027\u7684\u540c\u65f6\u63d0\u5347\u5b89\u5168\u6027\u4e0e\u5b9e\u7528\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Rubric-based evaluators commonly treat rubrics as prompt context or flat criteria: they specify what to judge but leave criterion composition implicit, even when natural-language rules state it. We introduce Graph-Structured Rubrics (GSR), which compiles a rubric into a response-independent typed evaluation graph before observing responses. Criterion nodes elicit judgments; transformation, reduction, and gating operators compose them through named ports; and a task-specific output mapping, termed Readout, converts the unique sink into a score or preference. Compilation rejects malformed or type-incompatible graphs. Pointwise evaluation judges rubric dimensions separately before graph aggregation; pairwise evaluation reuses the graph with one judgment for each candidate under every criterion. Under GPT-OSS-120B, GSR improves exact score agreement by 0.62--6.75 percentage points over Prometheus-style scoring on four pointwise datasets and achieves the numerically highest end-to-end pairwise accuracy on two preference benchmarks under native tie and abstention policies.", "arxiv_id": "2608.12097", "arxiv_url": "https://arxiv.org/abs/2608.12097", "authors": ["Xi Chen", "Jie Mu", "Mo Xuan", "Qun Shao"], "brief": "\u672c\u6587\u63d0\u51fa Graph-Structured Rubrics\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u8bc4\u5206\u7ec6\u5219\u9884\u7f16\u8bd1\u4e3a\u5e26\u7c7b\u578b\u7684\u8bc4\u4ef7\u56fe\uff0c\u7528\u8282\u70b9\u3001\u53d8\u6362\u3001\u5f52\u7ea6\u548c\u95e8\u63a7\u663e\u5f0f\u7ec4\u5408\u8bc4\u4ef7\u6807\u51c6\uff0c\u5e76\u901a\u8fc7 Readout \u8f93\u51fa\u5206\u6570\u6216\u504f\u597d\u3002\u8be5\u65b9\u6cd5\u80fd\u62d2\u7edd\u683c\u5f0f\u6216\u7c7b\u578b\u4e0d\u517c\u5bb9\u7684\u8bc4\u5206\u56fe\uff0c\u5728\u591a\u4e2a\u9010\u70b9\u8bc4\u5206\u6570\u636e\u96c6\u4e0a\u8f83 Prometheus \u98ce\u683c\u8bc4\u5206\u63d0\u5347 0.62\u20136.75 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u504f\u597d\u8bc4\u6d4b\u4e2d\u53d6\u5f97\u6700\u9ad8\u7684\u7aef\u5230\u7aef\u51c6\u786e\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12097", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b", "\u8bc4\u5206\u89c4\u5219", "\u504f\u597d\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12097v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Graph-Structured Rubrics: Compiling Rubrics into Typed Evaluation Graphs for LLM Judges", "tldr": "\u672c\u6587\u63d0\u51fa Graph-Structured Rubrics\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u8bc4\u5206\u7ec6\u5219\u9884\u7f16\u8bd1\u4e3a\u5e26\u7c7b\u578b\u7684\u8bc4\u4ef7\u56fe\uff0c\u7528\u8282\u70b9\u3001\u53d8\u6362\u3001\u5f52\u7ea6\u548c\u95e8\u63a7\u663e\u5f0f\u7ec4\u5408\u8bc4\u4ef7\u6807\u51c6\uff0c\u5e76\u901a\u8fc7 Readout \u8f93\u51fa\u5206\u6570\u6216\u504f\u597d\u3002\u8be5\u65b9\u6cd5\u80fd\u62d2\u7edd\u683c\u5f0f\u6216\u7c7b\u578b\u4e0d\u517c\u5bb9\u7684\u8bc4\u5206\u56fe\uff0c\u5728\u591a\u4e2a\u9010\u70b9\u8bc4\u5206\u6570\u636e\u96c6\u4e0a\u8f83 Prometheus \u98ce\u683c\u8bc4\u5206\u63d0\u5347 0.62\u20136.75 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u504f\u597d\u8bc4\u6d4b\u4e2d\u53d6\u5f97\u6700\u9ad8\u7684\u7aef\u5230\u7aef\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Graph Neural Networks (GNNs) achieve strong predictive performance on graph-structured data across domains such as chemistry, biology, and network analysis, yet they provide no intrinsic explanation of their predictions. This limits their adoption in high-stakes and safety-critical settings. Counterfactual explanations address this by revealing the minimal structural modifications that would change a model\u0027s prediction. On graphs, however, such a modification is hard to produce. The search space is discrete and combinatorial, and a valid answer must respect categorical node and edge types together with domain rules such as chemical valency in the case of molecular graphs. Existing explainers give up one of two things. Either edits are not held on the data manifold, or the search does not span the full edit space. We propose Graph Diffusion Counterfactual Explanation via Inversion (GDCE-I), which gives up neither. A discrete denoising diffusion model with a novel discrete inversion scheme enables distribution-aware edits leveraging the whole domain edit space. We further address the incomplete and inconsistent evaluation of graph counterfactuals by deriving a framework of explanation desiderata and applying it to every method under one shared protocol. Across four benchmarks, GDCE-I outperforms related work by a large margin on the defined framework. For the molecular domain, we further qualitatively show that GDCE-I attains interpretable in-distribution solutions.", "arxiv_id": "2608.12083", "arxiv_url": "https://arxiv.org/abs/2608.12083", "authors": ["David Bechtoldt", "Sidney Bender"], "brief": "\u8bba\u6587\u63d0\u51fa GDCE-I\uff0c\u7528\u79bb\u6563\u53bb\u566a\u6269\u6563\u6a21\u578b\u548c\u65b0\u7684\u79bb\u6563\u53cd\u6f14\u673a\u5236\u751f\u6210\u56fe\u795e\u7ecf\u7f51\u7edc\u7684\u53cd\u4e8b\u5b9e\u89e3\u91ca\uff0c\u5728\u4fdd\u6301\u6570\u636e\u5206\u5e03\u4e0e\u9886\u57df\u7ea6\u675f\u7684\u540c\u65f6\u8986\u76d6\u66f4\u5b8c\u6574\u7684\u56fe\u7f16\u8f91\u7a7a\u95f4\u3002\u4f5c\u8005\u8fd8\u7edf\u4e00\u4e86\u56fe\u53cd\u4e8b\u5b9e\u89e3\u91ca\u7684\u8bc4\u4f30\u51c6\u5219\uff0c\u5e76\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\uff0c\u5206\u5b50\u573a\u666f\u4e2d\u751f\u6210\u7684\u4fee\u6539\u66f4\u53ef\u89e3\u91ca\u4e14\u7b26\u5408\u5206\u5e03\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12083", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u53cd\u4e8b\u5b9e\u89e3\u91ca", "\u6269\u6563\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12083v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Faithful, Sufficient and Understandable: Rethinking Graph Counterfactual Explanations via Discrete Diffusion Inversion", "tldr": "\u8bba\u6587\u63d0\u51fa GDCE-I\uff0c\u7528\u79bb\u6563\u53bb\u566a\u6269\u6563\u6a21\u578b\u548c\u65b0\u7684\u79bb\u6563\u53cd\u6f14\u673a\u5236\u751f\u6210\u56fe\u795e\u7ecf\u7f51\u7edc\u7684\u53cd\u4e8b\u5b9e\u89e3\u91ca\uff0c\u5728\u4fdd\u6301\u6570\u636e\u5206\u5e03\u4e0e\u9886\u57df\u7ea6\u675f\u7684\u540c\u65f6\u8986\u76d6\u66f4\u5b8c\u6574\u7684\u56fe\u7f16\u8f91\u7a7a\u95f4\u3002\u4f5c\u8005\u8fd8\u7edf\u4e00\u4e86\u56fe\u53cd\u4e8b\u5b9e\u89e3\u91ca\u7684\u8bc4\u4f30\u51c6\u5219\uff0c\u5e76\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\uff0c\u5206\u5b50\u573a\u666f\u4e2d\u751f\u6210\u7684\u4fee\u6539\u66f4\u53ef\u89e3\u91ca\u4e14\u7b26\u5408\u5206\u5e03\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Learning world models from offline trajectories enables agents to accomplish different tasks through planning. Object-centric (OC) representations, which decompose a scene into a set of slots that bind to its objects, have been proposed as an inductive bias for world models that are more sample-efficient and generalize better. Yet prior object-centric world models (OCWMs) take the slot encoder as given and evaluate only in-distribution, leaving open whether the object-centric bias actually delivers for planning and what within the OCWM drives it. We conduct a controlled study of OCWMs for visual model-predictive control along two axes: object-centric representation quality and generalization under distribution shift relative to scene-centric models. We find that (i) planning success correlates positively with unsupervised slot-quality metrics (FG-ARI, mBO), though the gains saturate at high slot quality; (ii) with well-bound slots, the auxiliary proprioception inputs and masking inductive bias that prior methods relied on become unnecessary; and (iii) under unseen distribution shifts, the OCWM with well-bound slots is more robust overall than the end-to-end trained scene-centric LeWM, while DINO-WM, built on similar frozen pretrained features, remains competitive -- pointing to pretrained features as a key contributor to robustness.", "arxiv_id": "2608.12078", "arxiv_url": "https://arxiv.org/abs/2608.12078", "authors": ["Shukrullo Nazirjonov", "Sai Prasanna", "Anna Manasyan", "Georg Martius"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u7269\u4f53\u4e2d\u5fc3\u4e16\u754c\u6a21\u578b\u4e2d\u69fd\u4f4d\u8868\u793a\u8d28\u91cf\u5bf9\u89c6\u89c9\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u7684\u5f71\u54cd\uff0c\u5e76\u4e0e\u573a\u666f\u4e2d\u5fc3\u6a21\u578b\u5728\u5206\u5e03\u5916\u6cdb\u5316\u4e0b\u8fdb\u884c\u5bf9\u6bd4\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u69fd\u4f4d\u8d28\u91cf\u4e0e\u89c4\u5212\u6210\u529f\u7387\u6b63\u76f8\u5173\u4f46\u9ad8\u8d28\u91cf\u540e\u6536\u76ca\u9971\u548c\uff1b\u5f53\u69fd\u4f4d\u7ed1\u5b9a\u826f\u597d\u65f6\uff0c\u989d\u5916\u672c\u4f53\u611f\u77e5\u8f93\u5165\u548c\u63a9\u7801\u5f52\u7eb3\u504f\u7f6e\u4e0d\u518d\u5fc5\u8981\uff0c\u4e14\u5728\u5206\u5e03\u504f\u79fb\u4e0b\u66f4\u9c81\u68d2\u3002\u7814\u7a76\u8fd8\u6307\u51fa\uff0c\u9884\u8bad\u7ec3\u7279\u5f81\u53ef\u80fd\u662f\u63d0\u5347\u9c81\u68d2\u6027\u7684\u5173\u952e\u56e0\u7d20\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12078", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u7269\u4f53\u4e2d\u5fc3\u8868\u793a", "\u89c4\u5212", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12078v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Better Slots, Better Worlds: Representation Quality \u0026 Robustness in Object-Centric World Models", "tldr": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u7269\u4f53\u4e2d\u5fc3\u4e16\u754c\u6a21\u578b\u4e2d\u69fd\u4f4d\u8868\u793a\u8d28\u91cf\u5bf9\u89c6\u89c9\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u7684\u5f71\u54cd\uff0c\u5e76\u4e0e\u573a\u666f\u4e2d\u5fc3\u6a21\u578b\u5728\u5206\u5e03\u5916\u6cdb\u5316\u4e0b\u8fdb\u884c\u5bf9\u6bd4\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u69fd\u4f4d\u8d28\u91cf\u4e0e\u89c4\u5212\u6210\u529f\u7387\u6b63\u76f8\u5173\u4f46\u9ad8\u8d28\u91cf\u540e\u6536\u76ca\u9971\u548c\uff1b\u5f53\u69fd\u4f4d\u7ed1\u5b9a\u826f\u597d\u65f6\uff0c\u989d\u5916\u672c\u4f53\u611f\u77e5\u8f93\u5165\u548c\u63a9\u7801\u5f52\u7eb3\u504f\u7f6e\u4e0d\u518d\u5fc5\u8981\uff0c\u4e14\u5728\u5206\u5e03\u504f\u79fb\u4e0b\u66f4\u9c81\u68d2\u3002\u7814\u7a76\u8fd8\u6307\u51fa\uff0c\u9884\u8bad\u7ec3\u7279\u5f81\u53ef\u80fd\u662f\u63d0\u5347\u9c81\u68d2\u6027\u7684\u5173\u952e\u56e0\u7d20\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Integrating locomotion and manipulation is essential for robot autonomy, but scaling standard Reinforcement Learning (RL) to complex tasks is severely bottlenecked by the slow, manual process of dense reward shaping. To bypass this limitation, we leverage Sample-based Model Predictive Control (SMPC) entirely in simulation as an automated, rapidly tunable expert to generate massive offline datasets. Because this data solves the fundamental exploration problem, we can train an off-policy RL agent using purely sparse task rewards, drastically reducing the time required to learn new skills and eliminating the need for manual tuning. Integrating this high-level agent with a low-level dynamic stability controller yields more optimal behaviors that strictly align with true task objectives, ultimately allowing the learned policies to surpass the original optimal control teacher. We validate the robustness of this sim-to-real framework by successfully deploying complex loco-manipulation skills across different morphologies, including an arm-equipped Spot quadruped and a G1 humanoid.", "arxiv_id": "2608.12063", "arxiv_url": "https://arxiv.org/abs/2608.12063", "authors": ["Martin Schuck", "Maks Sorokin", "Simone Manni", "Duy Ta", "Angela P. Schoellig", "Marco Hutter", "Simon Le Cleac\u0027H", "Jan Br\u00fcdigam"], "brief": "\u672c\u6587\u7528\u4eff\u771f\u4e2d\u7684\u91c7\u6837\u5f0f\u6a21\u578b\u9884\u6d4b\u63a7\u5236\uff08SMPC\uff09\u81ea\u52a8\u751f\u6210\u5927\u89c4\u6a21\u4e13\u5bb6\u6570\u636e\uff0c\u518d\u7ed3\u5408\u7a00\u758f\u5956\u52b1\u7684\u79bb\u7ebf\u5230\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u6765\u5b66\u4e60\u673a\u5668\u4eba\u79fb\u52a8\u64cd\u4f5c\u6280\u80fd\u3002\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u5bc6\u96c6\u5956\u52b1\u8bbe\u8ba1\u548c\u4eba\u5de5\u8c03\u53c2\u9700\u6c42\uff0c\u5e76\u5728\u56db\u8db3\u673a\u5668\u4eba Spot \u4e0e G1 \u4eba\u5f62\u673a\u5668\u4eba\u4e0a\u5b9e\u73b0\u4e86\u8f83\u5f3a\u7684 sim-to-real \u8fc1\u79fb\uff0c\u5b66\u4e60\u7b56\u7565\u8fd8\u80fd\u8d85\u8fc7\u539f\u59cb\u63a7\u5236\u6559\u5e08\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12063", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u5f3a\u5316\u5b66\u4e60", "\u8fd0\u52a8\u64cd\u4f5c", "\u6a21\u578b\u9884\u6d4b\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12063v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Loco-Manipulation From SMPC Demonstrations With Sparse Offline-to-Online RL", "tldr": "\u672c\u6587\u7528\u4eff\u771f\u4e2d\u7684\u91c7\u6837\u5f0f\u6a21\u578b\u9884\u6d4b\u63a7\u5236\uff08SMPC\uff09\u81ea\u52a8\u751f\u6210\u5927\u89c4\u6a21\u4e13\u5bb6\u6570\u636e\uff0c\u518d\u7ed3\u5408\u7a00\u758f\u5956\u52b1\u7684\u79bb\u7ebf\u5230\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u6765\u5b66\u4e60\u673a\u5668\u4eba\u79fb\u52a8\u64cd\u4f5c\u6280\u80fd\u3002\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u5bc6\u96c6\u5956\u52b1\u8bbe\u8ba1\u548c\u4eba\u5de5\u8c03\u53c2\u9700\u6c42\uff0c\u5e76\u5728\u56db\u8db3\u673a\u5668\u4eba Spot \u4e0e G1 \u4eba\u5f62\u673a\u5668\u4eba\u4e0a\u5b9e\u73b0\u4e86\u8f83\u5f3a\u7684 sim-to-real \u8fc1\u79fb\uff0c\u5b66\u4e60\u7b56\u7565\u8fd8\u80fd\u8d85\u8fc7\u539f\u59cb\u63a7\u5236\u6559\u5e08\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Developing dialogue systems capable of engaging in multi-turn, goal-oriented conversations remains a significant challenge, especially in specialized domains with limited data. This research proposes a novel framework called Preference Tree Optimization (PTO), designed to iteratively improve agent models in such dialogue systems, by generating preference data using a method called Preference Tree with Look-Ahead. Focusing on Motivational Interviewing (MI) -- a counseling technique aimed at facilitating behavioral change -- we leverage virtual patients and an oracle evaluator to simulate conversations and generate rich preference datasets. By combining this method with Direct Preference Optimization (DPO), we aim to enhance the agent\u0027s decision-making capabilities over iterative training cycles. The proposed framework addresses data scarcity and advances the development of more nuanced and effective dialogue systems in goal-oriented domains. Experimental evaluations demonstrate that the PTO framework enhances dialogue agents\u0027 performance in goal-oriented conversations within the domain of Motivational Interviewing (MI). Models trained with PTO consistently outperformed the baseline in key metrics such as session satisfaction and working alliance. Additionally, incorporating look-ahead simulations led to improved long-term planning and more effective conversational strategies, with deeper look-ahead configurations yielding the most stable and high-scoring results.", "arxiv_id": "2608.12062", "arxiv_url": "https://arxiv.org/abs/2608.12062", "authors": ["Lior Baruch", "Moshe Butman", "Kfir Bar", "Doron Friedman"], "brief": "\u8bba\u6587\u63d0\u51fa Preference Tree Optimization\uff08PTO\uff09\uff0c\u901a\u8fc7\u5e26\u524d\u77bb\u7684\u504f\u597d\u6811\u6a21\u62df\u751f\u6210\u504f\u597d\u6570\u636e\uff0c\u5e76\u7ed3\u5408 DPO \u8fed\u4ee3\u4f18\u5316\u76ee\u6807\u5bfc\u5411\u5bf9\u8bdd\u667a\u80fd\u4f53\u3002\u8be5\u65b9\u6cd5\u5728\u52a8\u673a\u5f0f\u8bbf\u8c08\u573a\u666f\u4e2d\u63d0\u5347\u4e86\u4f1a s, with ten UDA algorithms and 13 label-free selection methods (validators), evaluating over 80,000 trained models in total. By this, we find that a capable adapted model usually exists, but identifying it without target labels is difficult: the validator-selected models leave a large and structural target performance gap to the best available one, with no evaluated validator consistently reliable. Towards closing it, we explore two strategies, ensembling and a small target-labeling budget; both narrow this gap but do not close it entirely. Overall, deployable UDA depends on the complete pipeline; addressing the less explored selection step could bring much of current UDA closer to clinical use.", "arxiv_id": "2608.12035", "arxiv_url": "https://arxiv.org/abs/2608.12035", "authors": ["Yiheng Xiong", "Luisa Gall\u00e9e", "Daniel Santak Wolf", "Heiko Hillenhagen", "Michael G\u00f6tz"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u533b\u5b66\u5f71\u50cf\u4e2d\u65e0\u76d1\u7763\u57df\u9002\u5e94\u4ece\u6a21\u578b\u8bad\u7ec3\u5230\u65e0\u6807\u7b7e\u6a21\u578b\u9009\u62e9\u7684\u5b8c\u6574\u90e8\u7f72\u6d41\u7a0b\uff0c\u8986\u76d69\u4e2a\u6570\u636e\u96c6\u300111\u4e2a\u8de8\u57df\u573a\u666f\u300110\u79cd\u7b97\u6cd5\u548c13\u79cd\u9a8c\u8bc1\u5668\uff0c\u5171\u8bc4\u4f308\u4e07\u591a\u4e2a\u6a21\u578b\u3002\u7ed3\u679c\u53d1\u73b0\u901a\u5e38\u5b58\u5728\u6027\u80fd\u4e0d\u9519\u7684\u9002\u5e94\u6a21\u578b\uff0c\u4f46\u5728\u76ee\u6807\u57df\u65e0\u6807\u7b7e\u6761\u4ef6\u4e0b\u5f88\u96be\u53ef\u9760\u9009\u51fa\uff0c\u5bfc\u81f4\u79bb\u6700\u4f73\u6a21\u578b\u4ecd\u6709\u663e\u8457\u5dee\u8ddd\uff1b\u96c6\u6210\u548c\u5c11\u91cf\u76ee\u6807\u6807\u6ce8\u53ef\u7f13\u89e3\u4f46\u4e0d\u80fd\u5b8c\u5168\u89e3\u51b3\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12035", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u65e0\u76d1\u7763\u57df\u9002\u5e94", "\u6a21\u578b\u9009\u62e9", "\u4e34\u5e8a\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12035v1", "published_at": "2026-08-12", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Far from Clinical Deployment? Evaluating the Complete Unsupervised Domain Adaptation Pipeline in Medical Imaging", "tldr": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u533b\u5b66\u5f71\u50cf\u4e2d\u65e0\u76d1\u7763\u57df\u9002\u5e94\u4ece\u6a21\u578b\u8bad\u7ec3\u5230\u65e0\u6807\u7b7e\u6a21\u578b\u9009\u62e9\u7684\u5b8c\u6574\u90e8\u7f72\u6d41\u7a0b\uff0c\u8986\u76d69\u4e2a\u6570\u636e\u96c6\u300111\u4e2a\u8de8\u57df\u573a\u666f\u300110\u79cd\u7b97\u6cd5\u548c13\u79cd\u9a8c\u8bc1\u5668\uff0c\u5171\u8bc4\u4f308\u4e07\u591a\u4e2a\u6a21\u578b\u3002\u7ed3\u679c\u53d1\u73b0\u901a\u5e38\u5b58\u5728\u6027\u80fd\u4e0d\u9519\u7684\u9002\u5e94\u6a21\u578b\uff0c\u4f46\u5728\u76ee\u6807\u57df\u65e0\u6807\u7b7e\u6761\u4ef6\u4e0b\u5f88\u96be\u53ef\u9760\u9009\u51fa\uff0c\u5bfc\u81f4\u79bb\u6700\u4f73\u6a21\u578b\u4ecd\u6709\u663e\u8457\u5dee\u8ddd\uff1b\u96c6\u6210\u548c\u5c11\u91cf\u76ee\u6807\u6807\u6ce8\u53ef\u7f13\u89e3\u4f46\u4e0d\u80fd\u5b8c\u5168\u89e3\u51b3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
