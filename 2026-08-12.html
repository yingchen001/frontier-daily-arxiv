a\u8df3\u63a8\u7406\u80fd\u529b", "upvotes": 0, "what_it_is": "VAKRA \u662f\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u5de5\u5177\u4f7f\u7528\u573a\u666f\u7684\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5305\u542b62\u4e2a\u9886\u57df\u30018000\u591a\u4e2a\u53ef\u6267\u884cAPI\uff0c\u8986\u76d6API\u4ea4\u4e92\u3001\u591a\u8df3\u7ed3\u6784\u5316\u63a8\u7406\uff0c\u4ee5\u53ca\u5e26\u81ea\u7136\u8bed\u8a00\u5de5\u5177\u4f7f\u7528\u7b56\u7565\u7ea6\u675f\u7684\u591a\u6e90\u63a8\u7406\u4efb\u52a1\u3002", "why_notable": "\u8be5\u57fa\u51c6\u66f4\u8d34\u8fd1\u4f01\u4e1a\u667a\u80fd\u4f53\u9700\u8981\u540c\u65f6\u4f7f\u7528\u7ed3\u6784\u5316API\u3001\u6587\u6863\u68c0\u7d22\u548c\u7b56\u7565\u7ea6\u675f\u7684\u771f\u5b9e\u573a\u666f\uff0c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u4e3b\u8981\u77ed\u677f\u5728\u5b9e\u4f53\u6d88\u6b67\u3001\u8de8\u6e90 grounding \u7b49\u8bed\u8a00\u4e2d\u4ecb\u63a8\u7406\uff0c\u800c\u975e\u7b80\u5355\u5de5\u5177\u8c03\u7528\u3002"}, {"abstract": "The rapid advancement of artificial intelligence (AI) has significantly accelerated research in time-series analysis, particularly in forecasting, classification, and generation tasks. Recent models, especially foundation models, benefit from time-series dataset similarity due to its significant role in source dataset selection for fine-tuning. However, many existing implementations for benchmarking time-series dataset similarity methods are fragmented and difficult to extend. To address this, we present a unified framework, the Time-Series Dataset Similarity Toolbox (TSDS-Toolbox). Our work enables (1) systematic and reproducible comparisons of time-series dataset similarity methods; (2) flexible extensibility for users to add customized datasets, similarity methods, and downstream time-series tasks; and (3) consistent evaluation of both dataset-level and series-level similarity methods through integrated time-series dataset reducers. The effectiveness of TSDS-Toolbox is validated through comprehensive experiments under diverse experimental settings. Our toolbox is publicly available.", "arxiv_id": "2608.08119", "arxiv_url": "https://arxiv.org/abs/2608.08119", "authors": ["Yen-Ku Liu", "Hongjie Chen", "Ryan A. Rossi", "Franck Dernoncourt"], "brief": "\u8bba\u6587\u63d0\u51fa TSDS-Toolbox\uff0c\u4e00\u4e2a\u7528\u4e8e\u8861\u91cf\u4e0e\u8bc4\u6d4b\u65f6\u95f4\u5e8f\u5217\u6570\u636e\u96c6\u76f8\u4f3c\u6027\u7684\u7edf\u4e00\u6846\u67b6\u3002\u5b83\u652f\u6301\u6570\u636e\u96c6\u7ea7\u4e0e\u5e8f\u5217\u7ea7\u76f8\u4f3c\u6027\u65b9\u6cd5\u7684\u53ef\u590d\u73b0\u5b9e\u9a8c\uff0c\u5e76\u4fbf\u4e8e\u6269\u5c55\u81ea\u5b9a\u4e49\u6570\u636e\u3001\u65b9\u6cd5\u548c\u4e0b\u6e38\u4efb\u52a1\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08119", "impact_score": 5, "is_agent": false, "is_top": true, "key_points": ["\u9762\u5411\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u5fae\u8c03\u4e2d\u7684\u6e90\u6570\u636e\u96c6\u9009\u62e9\u95ee\u9898\uff0c\u7cfb\u7edf\u5316\u6bd4\u8f83\u4e0d\u540c\u6570\u636e\u96c6\u76f8\u4f3c\u6027\u5ea6\u91cf\u65b9\u6cd5", "\u96c6\u6210\u65f6\u95f4\u5e8f\u5217\u6570\u636e\u96c6\u89c4\u7ea6\u5668\uff0c\u4f7f\u6570\u636e\u96c6\u7ea7\u4e0e\u5e8f\u5217\u7ea7\u76f8\u4f3c\u6027\u65b9\u6cd5\u53ef\u5728\u7edf\u4e00\u6d41\u7a0b\u4e0b\u8bc4\u4f30", "\u652f\u6301\u7528\u6237\u7075\u6d3b\u6dfb\u52a0\u81ea\u5b9a\u4e49\u6570\u636e\u96c6\u3001\u76f8\u4f3c\u6027\u7b97\u6cd5\u548c\u9884\u6d4b\u3001\u5206\u7c7b\u3001\u751f\u6210\u7b49\u4e0b\u6e38\u4efb\u52a1"], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u6570\u636e\u96c6\u76f8\u4f3c\u6027", "\u57fa\u7840\u6a21\u578b", "\u5de5\u5177\u7bb1"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08119v1", "published_at": "2026-08-08", "score": 0.186, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08119.png", "title": "TSDS-Toolbox: A Toolbox for Measuring Time-Series Dataset Similarity", "tldr": "\u7edf\u4e00\u8bc4\u6d4b\u65f6\u95f4\u5e8f\u5217\u6570\u636e\u96c6\u76f8\u4f3c\u6027\u7684\u5f00\u6e90\u5de5\u5177\u7bb1", "upvotes": 7, "what_it_is": "\u8bba\u6587\u63d0\u51fa TSDS-Toolbox\uff0c\u4e00\u4e2a\u7528\u4e8e\u8861\u91cf\u4e0e\u8bc4\u6d4b\u65f6\u95f4\u5e8f\u5217\u6570\u636e\u96c6\u76f8\u4f3c\u6027\u7684\u7edf\u4e00\u6846\u67b6\u3002\u5b83\u652f\u6301\u6570\u636e\u96c6\u7ea7\u4e0e\u5e8f\u5217\u7ea7\u76f8\u4f3c\u6027\u65b9\u6cd5\u7684\u53ef\u590d\u73b0\u5b9e\u9a8c\uff0c\u5e76\u4fbf\u4e8e\u6269\u5c55\u81ea\u5b9a\u4e49\u6570\u636e\u3001\u65b9\u6cd5\u548c\u4e0b\u6e38\u4efb\u52a1\u3002", "why_notable": "\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u7684\u53d1\u5c55\u4f7f\u201c\u9009\u62e9\u76f8\u4f3c\u6e90\u6570\u636e\u96c6\u8fdb\u884c\u5fae\u8c03\u201d\u53d8\u5f97\u91cd\u8981\uff0c\u4f46\u73b0\u6709\u8bc4\u6d4b\u5b9e\u73b0\u5206\u6563\u4e14\u96be\u590d\u73b0\uff1b\u8be5\u5de5\u5177\u7bb1\u63d0\u4f9b\u7edf\u4e00\u3001\u53ef\u6269\u5c55\u3001\u516c\u5f00\u7684\u57fa\u51c6\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u65f6\u95f4\u5e8f\u5217\u8fc1\u79fb\u4e0e\u5fae\u8c03\u7814\u7a76\u6807\u51c6\u5316\u3002"}, {"abstract": "Class activation mapping (CAM) is one of the most widely used visual explanation families in explainable artificial intelligence. Its purpose is intuitive: it converts internal model evidence into a heatmap that highlights the image regions, convolutional channels, tokens, or patches that support a target class or concept. Since the first CAM formulation in 2016, the field has moved far beyond global-average-pooled CNN classifiers. CAM-style methods now include gradient-based post-hoc explanations, gradient-free score and ablation methods, high-resolution upscaling, weakly supervised localization and segmentation, transformer token attribution, causal and debiasing methods, and foundation-model-era approaches that use CLIP, DINO, SAM, or feature-distribution comparisons. This review synthesizes a strict corpus of 57 method-centered papers published from 2016 onward. The paper develops a taxonomy that separates methods by attribution mechanism, architectural dependence, and evaluation objective. It then reviews gradient-based CAMs, recent and hybrid CAM-style methods, and model-based or architecture-aware methods. Across the corpus, the main trend is clear: the field is shifting from explaining one class score in one low-resolution CNN layer toward comparative, multi-layer, probabilistic, token-aware, and foundation-model-aware explanations. At the same time, evaluation remains fragmented. Faithfulness, localization, robustness, computational cost, and human trust are often measured with different protocols. The review therefore emphasizes not only what each method contributes, but also which gap it leaves open and which later methods attempt to close that gap.", "arxiv_id": "2608.12299", "arxiv_url": "https://arxiv.org/abs/2608.12299", "authors": ["AmirHossein Eshghi", "Hamid Saadatfar", "Seyyed Ali Hoseini", "AmirMohsen Eshghi", "Siavash Arjomand Bigdel"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u4ee5\u65b9\u6cd5\u4e3a\u4e2d\u5fc3\u7684\u7efc\u8ff0\uff0c\u7cfb\u7edf\u56de\u987e2016\u5e74\u4ee5\u676557\u7bc7CAM\u76f8\u5173\u89c6\u89c9\u89e3\u91ca\u8bba\u6587\u3002\u8bba\u6587\u6309\u5f52\u56e0\u673a\u5236\u3001\u67b6\u6784\u4f9d\u8d56\u548c\u8bc4\u4f30\u76ee\u6807\u6784\u5efa\u5206\u7c7b\u4f53\u7cfb\uff0c\u8986\u76d6CNN\u3001Transformer\u5230\u57fa\u7840\u6a21\u578b\u65f6\u4ee3\u7684CAM\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12299", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u68b3\u7406\u68af\u5ea6\u578b\u3001\u65e0\u68af\u5ea6\u8bc4\u5206/\u6d88\u878d\u578b\u3001\u9ad8\u5206\u8fa8\u7387\u4e0a\u91c7\u6837\u3001\u5f31\u76d1\u7763\u5b9a\u4f4d\u4e0e\u5206\u5272\u7b49CAM\u53d8\u4f53", "\u603b\u7ed3Transformer token\u5f52\u56e0\u3001\u56e0\u679c\u4e0e\u53bb\u504f\u65b9\u6cd5\uff0c\u4ee5\u53caCLIP\u3001DINO\u3001SAM\u7b49\u57fa\u7840\u6a21\u578b\u76f8\u5173\u89e3\u91ca\u65b9\u6cd5", "\u6307\u51fa\u8bc4\u4f30\u4ecd\u788e\u7247\u5316\uff0c\u5fe0\u5b9e\u6027\u3001\u5b9a\u4f4d\u3001\u9c81\u68d2\u6027\u3001\u8ba1\u7b97\u6210\u672c\u548c\u4eba\u7c7b\u4fe1\u4efb\u7f3a\u4e4f\u7edf\u4e00\u534f\u8bae"], "keywords": ["\u53ef\u89e3\u91caAI", "\u8ba1\u7b97\u673a\u89c6\u89c9", "Transformer", "\u57fa\u7840\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12299v1", "published_at": "2026-08-12", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Class Activation Mapping in Explainable Computer Vision: A Method-Centered Review of CNN, Transformer, and Foundation-Model-Era Visual Explanations", "tldr": "\u7cfb\u7edf\u68b3\u7406CAM\u89c6\u89c9\u89e3\u91ca\u65b9\u6cd5\u6f14\u8fdb", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u4ee5\u65b9\u6cd5\u4e3a\u4e2d\u5fc3\u7684\u7efc\u8ff0\uff0c\u7cfb\u7edf\u56de\u987e2016\u5e74\u4ee5\u676557\u7bc7CAM\u76f8\u5173\u89c6\u89c9\u89e3\u91ca\u8bba\u6587\u3002\u8bba\u6587\u6309\u5f52\u56e0\u673a\u5236\u3001\u67b6\u6784\u4f9d\u8d56\u548c\u8bc4\u4f30\u76ee\u6807\u6784\u5efa\u5206\u7c7b\u4f53\u7cfb\uff0c\u8986\u76d6CNN\u3001Transformer\u5230\u57fa\u7840\u6a21\u578b\u65f6\u4ee3\u7684CAM\u65b9\u6cd5\u3002", "why_notable": "CAM\u662f\u53ef\u89e3\u91ca\u8ba1\u7b97\u673a\u89c6\u89c9\u4e2d\u6700\u5e38\u7528\u7684\u53ef\u89c6\u5316\u89e3\u91ca\u8303\u5f0f\u4e4b\u4e00\uff1b\u8be5\u7efc\u8ff0\u5e2e\u52a9\u7814\u7a76\u8005\u7406\u89e3\u4eceCNN\u7c7b\u6fc0\u6d3b\u56fe\u5230\u591a\u5c42\u3001\u6982\u7387\u5316\u3001token\u611f\u77e5\u548c\u57fa\u7840\u6a21\u578b\u611f\u77e5\u89e3\u91ca\u7684\u6574\u4f53\u8d8b\u52bf\uff0c\u5e76\u660e\u786e\u5f53\u524d\u8bc4\u4f30\u4e0e\u65b9\u6cd5\u7a7a\u767d\u3002"}, {"abstract": "Artificial intelligence tools for education and language support are increasingly framed as scalable responses to access gaps in under-resourced communities. Yet the infrastructure underlying these tools, including training corpora, tokenization schemes, evaluation benchmarks, and deployment architectures, can systematically disadvantage speakers of underrepresented languages before a model is trained. This paper examines these structural barriers through Bengali, one of the world\u0027s most widely spoken languages, focusing on AI-assisted education in low-connectivity environments. We identify four interlocking failures: a severe web presence gap, with Bengali accounting for less than 0.5% of global web content despite representing nearly 4% of the global population; a 67:1 training-token deficit between English and Bengali in major multilingual corpora; a tokenization penalty associated with Bengali\u0027s alphasyllabary script that compounds the data deficit through higher token fertility; and connectivity exclusion, with individual internet penetration at 36.5% in rural areas compared with 71.4% in urban areas. These failures reflect longstanding resource-allocation decisions, institutional priorities, and design defaults that did not center underrepresented languages in mainstream AI development. We argue that dataset scarcity should be understood as a structural barrier rather than an isolated technical limitation, and that offline-first design should be treated as an equity-oriented infrastructure strategy. We conclude with directions for linguistics and AI research aimed at reducing these structural inequalities.", "arxiv_id": "2608.12278", "arxiv_url": "https://arxiv.org/abs/2608.12278", "authors": ["Avijit Roy", "Proma Roy"], "brief": "\u672c\u6587\u4ee5\u5b5f\u52a0\u62c9\u8bed\u548c\u4f4e\u8fde\u901a\u6559\u80b2\u573a\u666f\u4e3a\u4f8b\uff0c\u5206\u6790AI\u6559\u80b2\u4e0e\u8bed\u8a00\u652f\u6301\u5de5\u5177\u5728\u8bad\u7ec3\u6570\u636e\u3001\u5206\u8bcd\u3001\u8bc4\u6d4b\u548c\u90e8\u7f72\u57fa\u7840\u8bbe\u65bd\u4e0a\u7684\u7ed3\u6784\u6027\u4e0d\u5e73\u7b49\u3002\u4f5c\u8005\u4e3b\u5f20\u5c06\u6570\u636e\u7a00\u7f3a\u89c6\u4e3a\u8d44\u6e90\u914d\u7f6e\u4e0e\u8bbe\u8ba1\u9ed8\u8ba4\u9020\u6210\u7684\u7ed3\u6784\u969c\u788d\uff0c\u800c\u975e\u5355\u7eaf\u6280\u672f\u95ee\u9898\u3002", "categories": ["cs.CL", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12278", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5b5f\u52a0\u62c9\u8bed\u4f7f\u7528\u8005\u7ea6\u5360\u5168\u7403\u4eba\u53e3\u8fd14%\uff0c\u4f46\u76f8\u5173\u7f51\u9875\u5185\u5bb9\u4e0d\u8db3\u5168\u74030.5%\uff0c\u5b58\u5728\u4e25\u91cd\u7f51\u7edc\u53ef\u89c1\u6027\u7f3a\u53e3\u3002", "\u4e3b\u6d41\u591a\u8bed\u8a00\u8bed\u6599\u4e2d\u82f1\u8bed\u4e0e\u5b5f\u52a0\u62c9\u8bed\u8bad\u7ec3token\u6bd4\u4f8b\u7ea6\u4e3a67:1\uff0c\u4e14\u5b5f\u52a0\u62c9\u6587\u5b57\u7cfb\u7edf\u5e26\u6765\u66f4\u9ad8token fertility\uff0c\u8fdb\u4e00\u6b65\u653e\u5927\u6570\u636e\u52a3\u52bf\u3002", "\u519c\u6751\u5730\u533a\u4e2a\u4eba\u4e92\u8054\u7f51\u666e\u53ca\u7387\u4ec536.5%\uff0c\u663e\u8457\u4f4e\u4e8e\u57ce\u5e02\u768471.4%\uff0c\u4f7f\u5728\u7ebf\u4f18\u5148\u7684AI\u6559\u80b2\u5de5\u5177\u6392\u9664\u5927\u91cf\u76ee\u6807\u7528\u6237\u3002"], "keywords": ["\u4f4e\u8d44\u6e90\u8bed\u8a00", "AI\u516c\u5e73\u6027", "\u591a\u8bed\u8a00", "\u6559\u80b2\u6280\u672f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12278v1", "published_at": "2026-08-12", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Structural Silence: When AI Infrastructure Fails Speakers of Underrepresented Languages", "tldr": "AI\u57fa\u7840\u8bbe\u65bd\u7cfb\u7edf\u6027\u5ffd\u89c6\u5b5f\u52a0\u62c9\u8bed\u7528\u6237", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ee5\u5b5f\u52a0\u62c9\u8bed\u548c\u4f4e\u8fde\u901a\u6559\u80b2\u573a\u666f\u4e3a\u4f8b\uff0c\u5206\u6790AI\u6559\u80b2\u4e0e\u8bed\u8a00\u652f\u6301\u5de5\u5177\u5728\u8bad\u7ec3\u6570\u636e\u3001\u5206\u8bcd\u3001\u8bc4\u6d4b\u548c\u90e8\u7f72\u57fa\u7840\u8bbe\u65bd\u4e0a\u7684\u7ed3\u6784\u6027\u4e0d\u5e73\u7b49\u3002\u4f5c\u8005\u4e3b\u5f20\u5c06\u6570\u636e\u7a00\u7f3a\u89c6\u4e3a\u8d44\u6e90\u914d\u7f6e\u4e0e\u8bbe\u8ba1\u9ed8\u8ba4\u9020\u6210\u7684\u7ed3\u6784\u969c\u788d\uff0c\u800c\u975e\u5355\u7eaf\u6280\u672f\u95ee\u9898\u3002", "why_notable": "\u8bba\u6587\u5c06\u4f4e\u8d44\u6e90\u8bed\u8a00\u95ee\u9898\u4ece\u201c\u7f3a\u6570\u636e\u201d\u91cd\u65b0\u6846\u5b9a\u4e3aAI\u57fa\u7840\u8bbe\u65bd\u5c42\u9762\u7684\u516c\u5e73\u6027\u95ee\u9898\uff0c\u5f3a\u8c03\u79bb\u7ebf\u4f18\u5148\u8bbe\u8ba1\u5bf9\u6559\u80b2\u548c\u8bed\u8a00\u6280\u672f\u666e\u60e0\u90e8\u7f72\u7684\u91cd\u8981\u6027\uff0c\u5bf9\u591a\u8bed\u8a00AI\u3001AI\u6cbb\u7406\u548c\u6570\u5b57\u9e3f\u6c9f\u7814\u7a76\u5177\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "Agentic systems powered by large language models (LLMs) have opened new opportunities for business ideation. Yet existing approaches remain confined to a text-only paradigm, despite the inherently multimodal nature of real-world contexts. We thus introduce MBA-Bench, the first multimodal benchmark for training and evaluating business ideation agents, comprising 30K samples across six domains, each domain characterized by distinct visual cues not fully conveyed by text alone. Concretely, we automatically caption images and employ GPT-4o to generate five reference ideas for each of three business questions through retrieval query generation, market evidence retrieval, and evidence-augmented synthesis. Following prior work, we evaluate agents across six business-oriented criteria using MLLM-as-a-Judge. To consider settings where criteria are hidden or disclosed, we present MBA-b and MBA-k for blind and known, respectively. We train both with two novel reward objectives---creativity and feasibility---while MBA-k further optimizes the six disclosed criteria for eight in total. Both are trained via LoRA-based supervised fine-tuning followed by group relative policy optimization with these setting-specific rewards. For extensive experiments on MBA-Bench, we set up two baselines accommodating either captions only or multimodal inputs, with the latter nearing closed-source performance on several metrics. MBA-b and MBA-k outperform caption baselines by 63.9% and 77.1%, and multimodal baselines by 25.6% and 35.8%, respectively.", "arxiv_id": "2608.11616", "arxiv_url": "https://arxiv.org/abs/2608.11616", "authors": ["Hojun Choi", "Jaeyo Shin", "Suin Lee", "Hyunjung Shim"], "brief": "\u672c\u6587\u63d0\u51fa MBA-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u5546\u4e1a\u521b\u610f\u751f\u6210\u7684\u591a\u6a21\u6001\u57fa\u51c6\uff0c\u5305\u542b 6 \u4e2a\u9886\u57df 3 \u4e07\u6837\u672c\uff0c\u5e76\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u8bc4\u5ba1\u5546\u4e1a\u521b\u610f\u8d28\u91cf\u3002\u540c\u65f6\u8bad\u7ec3\u4e86 MBA-b \u548c MBA-k \u4e24\u7c7b\u5546\u4e1a\u521b\u610f\u667a\u80fd\u4f53\uff0c\u901a\u8fc7 LoRA \u5fae\u8c03\u548c\u76f8\u5bf9\u7b56\u7565\u4f18\u5316\u63d0\u5347\u521b\u9020\u6027\u3001\u53ef\u884c\u6027\u53ca\u5df2\u77e5\u8bc4\u4ef7\u6307\u6807\u8868\u73b0\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u6587\u672c\u63cf\u8ff0\u548c\u591a\u6a21\u6001\u57fa\u7ebf\u5747\u6709\u663e\u8457\u63d0\u5347\u3002", "categories": ["cs.AI", "cs.CV", "cs.LG"], "github_repo": "https://github.com/hchoi256/MBA", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11616", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u5546\u4e1a\u521b\u610f"], "num_comments": 1, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2608.11616v1", "published_at": "2026-08-12", "score": 0.155, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.11616.png", "title": "MBA: Multimodal Benchmark and Agents for Real-World Business Ideation", "tldr": "\u672c\u6587\u63d0\u51fa MBA-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u5546\u4e1a\u521b\u610f\u751f\u6210\u7684\u591a\u6a21\u6001\u57fa\u51c6\uff0c\u5305\u542b 6 \u4e2a\u9886\u57df 3 \u4e07\u6837\u672c\uff0c\u5e76\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u8bc4\u5ba1\u5546\u4e1a\u521b\u610f\u8d28\u91cf\u3002\u540c\u65f6\u8bad\u7ec3\u4e86 MBA-b \u548c MBA-k \u4e24\u7c7b\u5546\u4e1a\u521b\u610f\u667a\u80fd\u4f53\uff0c\u901a\u8fc7 LoRA \u5fae\u8c03\u548c\u76f8\u5bf9\u7b56\u7565\u4f18\u5316\u63d0\u5347\u521b\u9020\u6027\u3001\u53ef\u884c\u6027\u53ca\u5df2\u77e5\u8bc4\u4ef7\u6307\u6807\u8868\u73b0\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u6587\u672c\u63cf\u8ff0\u548c\u591a\u6a21\u6001\u57fa\u7ebf\u5747\u6709\u663e\u8457\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern black-box Image-to-Video (I2V) models offer powerful capabilities in automated content creation, yet their lack of fine-grained control and reliability presents significant challenges in professional workflows. Their inherent stochasticity causes minor variations in textual prompts or hyperparameters to yield drastically different outputs often necessitating inefficient, brute-force trial-and-error processes. To address these limitations, we introduce the ``Agentic Self-Improvement\" framework, which reframes video synthesis into a closed-loop, goal-directed optimization. Our framework systematically navigates the generation parameter space using a novel two-stage approach. In the first stage, an iterative prompt optimization loop uses a multimodal Large Language Model (mLLM) to refine the input prompt. This refinement implements two automated evaluations: Davidsonian Scene Graph (DSG) queries ensure semantic adherence, and Common Mistake Questions (CMQ) for artifact detection. At the second stage, we use Bayesian optimization to efficiently co-optimize stochastic seeds and CFG scales. This search is guided by a suite of quality metrics, including the novel Video-Text Adherence (VTA) score derived from the DSG and CMQ evaluations. Our framework significantly outperforms unguided search methods: in human preference studies, videos generated via our agentic approach were strongly preferred over baseline outputs, achieving win rates up to 69\\%. This work provides a practical and extensible methodology for enhancing the predictability and control of state-of-the-art video generation models, moving the field beyond speculative curiosities toward reliable, production-ready tools.", "arxiv_id": "2608.12290", "arxiv_url": "https://arxiv.org/abs/2608.12290", "authors": ["Aman Tyagi", "Hemanth Boinpally", "Jonathan Chen", "Douglas Gebert", "Steven Hickson"], "brief": "\u672c\u6587\u63d0\u51fa\u201cAgentic Self-Improvement\u201d\u6846\u67b6\uff0c\u628a\u9ed1\u76d2\u56fe\u751f\u89c6\u9891\u751f\u6210\u4ece\u53cd\u590d\u8bd5\u9519\u6539\u4e3a\u95ed\u73af\u76ee\u6807\u4f18\u5316\u3002\u65b9\u6cd5\u5148\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fed\u4ee3\u4f18\u5316\u63d0\u793a\u8bcd\u5e76\u901a\u8fc7\u573a\u666f\u56fe\u4e0e\u5e38\u89c1\u9519\u8bef\u95ee\u9898\u8bc4\u4f30\u8bed\u4e49\u548c\u4f2a\u5f71\uff0c\u518d\u7528\u8d1d\u53f6\u65af\u4f18\u5316\u8054\u5408\u641c\u7d22\u968f\u673a\u79cd\u5b50\u548c CFG \u7b49\u53c2\u6570\uff1b\u4eba\u7c7b\u504f\u597d\u5b9e\u9a8c\u4e2d\u76f8\u5bf9\u57fa\u7ebf\u6700\u9ad8\u8fbe\u5230 69% \u80dc\u7387\u3002", "categories": ["cs.CV", "cs.AI", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12290", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u56fe\u751f\u89c6\u9891", "\u591a\u6a21\u6001", "\u8d1d\u53f6\u65af\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12290v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Trial-and-Error: Agentic Optimization for Image-to-Video Adherence", "tldr": "\u672c\u6587\u63d0\u51fa\u201cAgentic Self-Improvement\u201d\u6846\u67b6\uff0c\u628a\u9ed1\u76d2\u56fe\u751f\u89c6\u9891\u751f\u6210\u4ece\u53cd\u590d\u8bd5\u9519\u6539\u4e3a\u95ed\u73af\u76ee\u6807\u4f18\u5316\u3002\u65b9\u6cd5\u5148\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fed\u4ee3\u4f18\u5316\u63d0\u793a\u8bcd\u5e76\u901a\u8fc7\u573a\u666f\u56fe\u4e0e\u5e38\u89c1\u9519\u8bef\u95ee\u9898\u8bc4\u4f30\u8bed\u4e49\u548c\u4f2a\u5f71\uff0c\u518d\u7528\u8d1d\u53f6\u65af\u4f18\u5316\u8054\u5408\u641c\u7d22\u968f\u673a\u79cd\u5b50\u548c CFG \u7b49\u53c2\u6570\uff1b\u4eba\u7c7b\u504f\u597d\u5b9e\u9a8c\u4e2d\u76f8\u5bf9\u57fa\u7ebf\u6700\u9ad8\u8fbe\u5230 69% \u80dc\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents increasingly rely on third-party skills, using natural-language descriptions for selection and instruction bodies for planning. This progressive-disclosure design exposes two sequential control points to untrusted publishers: a static skill may steer an otherwise correct task onto an unnecessarily costly trajectory. Prior work studies selection manipulation, malicious skill instructions, and tool-chain resource amplification largely separately, leaving their end-to-end composition unclear. We introduce Convergent Detour Hijacking (CDH), a text-only, runtime-independent attack that couples these stages. Under shared semantic cover, a description establishes relevance during selection, while an aligned body reuses that rationale to fabricate plausible dependencies during planning. CDH attracts an attacker-controlled coordinator alongside legitimate skills, recruits unnecessary benign skills into a bounded detour, and then re-enters the original route to preserve task completion. We evaluate it across multiple LLM backends and 491 held-out tasks under single-task and multi-turn conditions. On DeepSeek-V4-Pro, the matched coordinator is selected in 80.02% of tasks; among coordinator-hit runs that complete tasks, token consumption and end-to-end execution time increase by 66.91% and 92.45%, respectively, while aggregate task completion remains comparable. Thus, correct outcomes do not guarantee trajectory integrity or cost safety.", "arxiv_id": "2608.12273", "arxiv_url": "https://arxiv.org/abs/2608.12273", "authors": ["Junliang Liu", "Ruoyu Li", "Wenxin Tang", "Jingyu Xiao", "Zhenyu Liu", "Jingheng Xu", "Laizhong Cui"], "brief": "\u8bba\u6587\u63d0\u51fa Convergent Detour Hijacking\uff08CDH\uff09\uff0c\u4e00\u79cd\u4ec5\u4f9d\u8d56\u6587\u672c\u3001\u4e0e\u8fd0\u884c\u65f6\u65e0\u5173\u7684\u653b\u51fb\uff0c\u53ef\u5229\u7528\u7b2c\u4e09\u65b9\u6280\u80fd\u7684\u63cf\u8ff0\u4e0e\u6307\u4ee4\u4f53\u534f\u540c\u8bf1\u5bfc LLM \u667a\u80fd\u4f53\u9009\u62e9\u653b\u51fb\u8005\u6280\u80fd\u5e76\u7ed5\u884c\u8c03\u7528\u4e0d\u5fc5\u8981\u7684\u826f\u6027\u6280\u80fd\u3002\u5728 491 \u4e2a\u4efb\u52a1\u548c\u591a\u79cd\u6a21\u578b\u4e0a\uff0cDeepSeek-V4-Pro \u4e2d\u653b\u51fb\u6280\u80fd\u88ab\u9009\u4e2d\u7387\u8fbe 80.02%\uff0c\u5728\u4efb\u52a1\u5b8c\u6210\u7387\u57fa\u672c\u4e0d\u53d8\u7684\u60c5\u51b5\u4e0b\u4f7f token \u6d88\u8017\u589e\u52a0 66.91%\u3001\u6267\u884c\u65f6\u95f4\u589e\u52a0 92.45%\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12273", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u5b89\u5168", "\u5de5\u5177\u8c03\u7528", "\u8d44\u6e90\u653e\u5927"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12273v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Convergent Detour Hijacking: Task-Preserving Resource Amplification in Skill-Based LLM Agents", "tldr": "\u8bba\u6587\u63d0\u51fa Convergent Detour Hijacking\uff08CDH\uff09\uff0c\u4e00\u79cd\u4ec5\u4f9d\u8d56\u6587\u672c\u3001\u4e0e\u8fd0\u884c\u65f6\u65e0\u5173\u7684\u653b\u51fb\uff0c\u53ef\u5229\u7528\u7b2c\u4e09\u65b9\u6280\u80fd\u7684\u63cf\u8ff0\u4e0e\u6307\u4ee4\u4f53\u534f\u540c\u8bf1\u5bfc LLM \u667a\u80fd\u4f53\u9009\u62e9\u653b\u51fb\u8005\u6280\u80fd\u5e76\u7ed5\u884c\u8c03\u7528\u4e0d\u5fc5\u8981\u7684\u826f\u6027\u6280\u80fd\u3002\u5728 491 \u4e2a\u4efb\u52a1\u548c\u591a\u79cd\u6a21\u578b\u4e0a\uff0cDeepSeek-V4-Pro \u4e2d\u653b\u51fb\u6280\u80fd\u88ab\u9009\u4e2d\u7387\u8fbe 80.02%\uff0c\u5728\u4efb\u52a1\u5b8c\u6210\u7387\u57fa\u672c\u4e0d\u53d8\u7684\u60c5\u51b5\u4e0b\u4f7f token \u6d88\u8017\u589e\u52a0 66.91%\u3001\u6267\u884c\u65f6\u95f4\u589e\u52a0 92.45%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Large Language Models (MLLMs) have been growing the capability for scientific writing and collaboration. For example, OpenAI Prism is a free workspace for scientific writing and collaboration. One important feature in Prism is turning scientific diagrams directly into LaTeX TikZ code. In this paper, we build a benchmark, Diagram-MMU, a multi-modal benchmark designed to assess MLLMs\u0027 ability for scientific diagram parsing and understanding. Diagram-MMU features 3.7k curated diagrams and 18.3k human-validated questions across six domains. It evaluates MLLMs on three tasks common in vibe writing workspaces: diagram-to-code parsing, diagram-to-code editing, and diagram question answering, alongside agentic settings per task. The evaluation of 12 MLLMs reveals that diagram-to-code tasks are more challenging than diagram question answering: models can reason well over diagrams but struggle to parse and edit them, underscoring the need for methods to enhance MLLMs\u0027 capability in diagram-to-code generation. Under agentic settings, most models improve parsing and editing performance but degrade on question answering, while Claude-4.6 Opus consistently improves across all three tasks. Project Page: https://vi-ocean.github.io/projects/diagram-mmu.", "arxiv_id": "2608.12262", "arxiv_url": "https://arxiv.org/abs/2608.12262", "authors": ["Weihao Bo", "Shan Zhang", "Yanpeng Sun", "Jie Liu", "Yongke Yao", "Jinhao Du", "Wei He", "Kai Zou", "Zechao Li", "Jingdong Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Diagram-MMU\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u56fe\u8868\u89e3\u6790\u4e0e\u7406\u89e3\u7684\u591a\u6a21\u6001\u57fa\u51c6\uff0c\u5305\u542b 3.7k \u5f20\u56fe\u8868\u548c 18.3k \u4e2a\u4eba\u5de5\u9a8c\u8bc1\u95ee\u9898\uff0c\u8986\u76d6\u56fe\u8f6c TikZ \u4ee3\u7801\u3001\u56fe\u8868\u4ee3\u7801\u7f16\u8f91\u548c\u56fe\u8868\u95ee\u7b54\u4e09\u7c7b\u4efb\u52a1\u3002\u5bf9 12 \u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u6a21\u578b\u5728\u56fe\u8868\u95ee\u7b54\u4e0a\u76f8\u5bf9\u66f4\u5f3a\uff0c\u4f46\u5728\u56fe\u8f6c\u4ee3\u7801\u548c\u7f16\u8f91\u4e0a\u660e\u663e\u56f0\u96be\uff1b\u667a\u80fd\u4f53\u5f0f\u8bbe\u7f6e\u901a\u5e38\u63d0\u5347\u89e3\u6790\u4e0e\u7f16\u8f91\u8868\u73b0\uff0c\u4f46\u53ef\u80fd\u964d\u4f4e\u95ee\u7b54\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12262", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u79d1\u5b66\u56fe\u8868", "\u57fa\u51c6\u6d4b\u8bd5", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12262v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Diagram-MMU: A Multi-Modal Benchmark for Scientific Diagrams", "tldr": "\u8bba\u6587\u63d0\u51fa Diagram-MMU\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u56fe\u8868\u89e3\u6790\u4e0e\u7406\u89e3\u7684\u591a\u6a21\u6001\u57fa\u51c6\uff0c\u5305\u542b 3.7k \u5f20\u56fe\u8868\u548c 18.3k \u4e2a\u4eba\u5de5\u9a8c\u8bc1\u95ee\u9898\uff0c\u8986\u76d6\u56fe\u8f6c TikZ \u4ee3\u7801\u3001\u56fe\u8868\u4ee3\u7801\u7f16\u8f91\u548c\u56fe\u8868\u95ee\u7b54\u4e09\u7c7b\u4efb\u52a1\u3002\u5bf9 12 \u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u6a21\u578b\u5728\u56fe\u8868\u95ee\u7b54\u4e0a\u76f8\u5bf9\u66f4\u5f3a\uff0c\u4f46\u5728\u56fe\u8f6c\u4ee3\u7801\u548c\u7f16\u8f91\u4e0a\u660e\u663e\u56f0\u96be\uff1b\u667a\u80fd\u4f53\u5f0f\u8bbe\u7f6e\u901a\u5e38\u63d0\u5347\u89e3\u6790\u4e0e\u7f16\u8f91\u8868\u73b0\uff0c\u4f46\u53ef\u80fd\u964d\u4f4e\u95ee\u7b54\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modernizing legacy Fortran is a problem of volume: the transformations are individually routine, but the codebases can be enormous, and across much of computational science the work simply goes undone. We propose an agentic workflow that takes this work on at production scale, and we set out to measure how far such delegation can reach. In this work, three prompt-specialized agent roles operate under a version-controlled specification that the agents themselves authored and revised, while humans hold a small number of gates. The arrangement is kept safe by an exact verification oracle inherited from the domain, and the boundary of safe delegation lies exactly where that oracle stops seeing. We apply the proposed workflow in a case study, converting the two-electron-integral routines of GAMESS (General Atomic and Molecular Electronic Structure System), a mature quantum-chemistry package with a 48-year development history, from fixed-form Fortran 77 to free-form Fortran 2008. The scope of this work was twelve source files, 56,448 lines, and 225 subroutines for computing electron repulsion integrals. The agents ran as three Claude Code roles in isolated worktrees, and the work spanned four Claude model generations. Because the GAMESS group ships a standard test suite whose printed energies its user community treats as canonical, we could adopt bit-for-bit reproduction of those energies as the merge criterion, where a deviation in the twelfth decimal place counts as a failure rather than drift. All twelve source files pass a 51-test validation battery comprising the 49 standard GAMESS tests and two additional calculations, and across 612 test runs the number of chemistry-relevant differences is zero, and every file also passes the Jenkins tests that are used for continuous integration.", "arxiv_id": "2608.12249", "arxiv_url": "https://arxiv.org/abs/2608.12249", "authors": ["Yuzhong Shen", "Masha Sosonkina", "Peng Xu", "Mark S. Gordon"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u9057\u7559\u9ad8\u6027\u80fd\u8ba1\u7b97\u4ee3\u7801\u73b0\u4ee3\u5316\u7684\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u7531\u591a\u4e2a\u63d0\u793a\u4e13\u95e8\u5316\u7684 Claude Code \u89d2\u8272\u5728\u7248\u672c\u5316\u89c4\u8303\u548c\u5c11\u91cf\u4eba\u5de5\u5173\u5361\u4e0b\u534f\u4f5c\u6539\u5199\u4ee3\u7801\u3002\u6848\u4f8b\u4e2d\u5c06 GAMESS \u4e2d 12 \u4e2a Fortran 77 \u6587\u4ef6\u30015.6 \u4e07\u884c\u4ee3\u7801\u3001225 \u4e2a\u5b50\u7a0b\u5e8f\u8fc1\u79fb\u5230 Fortran 2008\uff0c\u5e76\u901a\u8fc7\u4e25\u683c\u7684\u9010\u6bd4\u7279\u80fd\u91cf\u590d\u73b0\u4e0e CI \u6d4b\u8bd5\uff0c612 \u6b21\u6d4b\u8bd5\u65e0\u5316\u5b66\u76f8\u5173\u5dee\u5f02\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12249", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u73b0\u4ee3\u5316", "\u9ad8\u6027\u80fd\u8ba1\u7b97", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12249v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "An Agentic Workflow for Legacy HPC Modernization: Converting the Two-Electron-Integral Core of GAMESS", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u9057\u7559\u9ad8\u6027\u80fd\u8ba1\u7b97\u4ee3\u7801\u73b0\u4ee3\u5316\u7684\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u7531\u591a\u4e2a\u63d0\u793a\u4e13\u95e8\u5316\u7684 Claude Code \u89d2\u8272\u5728\u7248\u672c\u5316\u89c4\u8303\u548c\u5c11\u91cf\u4eba\u5de5\u5173\u5361\u4e0b\u534f\u4f5c\u6539\u5199\u4ee3\u7801\u3002\u6848\u4f8b\u4e2d\u5c06 GAMESS \u4e2d 12 \u4e2a Fortran 77 \u6587\u4ef6\u30015.6 \u4e07\u884c\u4ee3\u7801\u3001225 \u4e2a\u5b50\u7a0b\u5e8f\u8fc1\u79fb\u5230 Fortran 2008\uff0c\u5e76\u901a\u8fc7\u4e25\u683c\u7684\u9010\u6bd4\u7279\u80fd\u91cf\u590d\u73b0\u4e0e CI \u6d4b\u8bd5\uff0c612 \u6b21\u6d4b\u8bd5\u65e0\u5316\u5b66\u76f8\u5173\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluating security vulnerability detection tools requires benchmark datasets with vulnerability-inducing commits (VICs) - the commits that first introduce vulnerabilities into codebases. VICs are essential for determining the full range of vulnerable software versions. Existing vulnerability datasets suffer from limited programming language coverage, restricted patch complexity, and narrow project scope. Through our dual annotation by human experts and an agentic workflow, we create a benchmark - VICBench - of 100 verified VICs for 100 CVEs across 88 projects in Python, Java, and C++, covering 48 CWE types. VICBench features complex real-world vulnerability fixes averaging 38.6 lines and corresponding VICs of 252.5 lines - significantly larger than prior work. Our evaluation shows that state-of-the-art algorithms V-SZZ and LLM4SZZ achieve only 33.3%-40.1% F1, confirming that using existing approaches still entails significant manual effort. VICBench enables robust evaluation of vulnerability detection approaches.", "arxiv_id": "2608.12246", "arxiv_url": "https://arxiv.org/abs/2608.12246", "authors": ["Jin Lu", "Xuening Han", "Yang Zhong", "Lin Tan", "Kevin Luo", "Andrew Gacek", "Neha Rungta"], "brief": "\u672c\u6587\u6784\u5efa\u4e86 VICBench\uff0c\u4e00\u4e2a\u8986\u76d6 Python\u3001Java\u3001C++ \u7684\u4ee3\u7801\u6f0f\u6d1e\u5f15\u5165\u63d0\u4ea4\u57fa\u51c6\uff0c\u5305\u542b 100 \u4e2a\u7ecf\u9a8c\u8bc1\u7684 VIC\u3001\u5bf9\u5e94 100 \u4e2a CVE\u300188 \u4e2a\u9879\u76ee\u548c 48 \u7c7b CWE\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709 V-SZZ \u4e0e LLM4SZZ \u4ec5\u8fbe\u5230 33.3%-40.1% F1\uff0c\u8bf4\u660e\u771f\u5b9e\u590d\u6742\u6f0f\u6d1e\u5b9a\u4f4d\u4ecd\u9ad8\u5ea6\u56f0\u96be\uff0cVICBench \u53ef\u7528\u4e8e\u66f4\u7a33\u5065\u8bc4\u6d4b\u6f0f\u6d1e\u68c0\u6d4b\u65b9\u6cd5\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12246", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4ee3\u7801\u5b89\u5168", "\u6f0f\u6d1e\u68c0\u6d4b", "\u57fa\u51c6\u6570\u636e\u96c6", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12246v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VICBench: A Multi-Language Benchmark for Code Vulnerability Detection", "tldr": "\u672c\u6587\u6784\u5efa\u4e86 VICBench\uff0c\u4e00\u4e2a\u8986\u76d6 Python\u3001Java\u3001C++ \u7684\u4ee3\u7801\u6f0f\u6d1e\u5f15\u5165\u63d0\u4ea4\u57fa\u51c6\uff0c\u5305\u542b 100 \u4e2a\u7ecf\u9a8c\u8bc1\u7684 VIC\u3001\u5bf9\u5e94 100 \u4e2a CVE\u300188 \u4e2a\u9879\u76ee\u548c 48 \u7c7b CWE\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709 V-SZZ \u4e0e LLM4SZZ \u4ec5\u8fbe\u5230 33.3%-40.1% F1\uff0c\u8bf4\u660e\u771f\u5b9e\u590d\u6742\u6f0f\u6d1e\u5b9a\u4f4d\u4ecd\u9ad8\u5ea6\u56f0\u96be\uff0cVICBench \u53ef\u7528\u4e8e\u66f4\u7a33\u5065\u8bc4\u6d4b\u6f0f\u6d1e\u68c0\u6d4b\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The increasing deployment of autonomous, agentic AI systems challenges traditional accountability mechanisms. Existing research predominantly frames AI accountability gaps as barriers that can be overcome through better standards, transparency, and institutional reform. We argue that this framing is insufficient: certain configurations of actors, systems, and institutions render AI accountability conceptually unachievable regardless of effort. We introduce the concept of constitutive AI unaccountability to capture these configurations. Through a three-stage qualitative study comprising a concept-centric literature analysis, a secondary analysis of 27 expert interviews with AI professionals from technical, legal, and sociotechnical backgrounds, and an illustrative framework application to the open-source agentic AI system OpenClaw, we identify nine categories and 20 themes of constitutive AI unaccountability. These are organized across structural, technological, and normative clusters and reinforce one another through eight directed interdependencies. Our framework is operationalized as a diagnostic instrument of 20 questions, which detected 17 of 20 conditions when applied to OpenClaw, including an inverted anthropomorphism configuration in which the AI agent was the only identifiable actor. We contribute a reframing of AI unaccountability as a constitutive property of sociotechnical systems, an extension of the four barriers to accountability, and a practical instrument for identifying accountability voids in specific AI deployments.", "arxiv_id": "2608.12104", "arxiv_url": "https://arxiv.org/abs/2608.12104", "authors": ["Long Hoang Nguyen", "Eva Sp\u00e4the", "Sebastian Lins", "Ali Sunyaev"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6784\u6210\u6027 AI \u4e0d\u53ef\u95ee\u8d23\u201d\u6846\u67b6\uff0c\u8ba4\u4e3a\u67d0\u4e9b AI \u7cfb\u7edf\u7684\u884c\u52a8\u8005\u3001\u6280\u672f\u4e0e\u5236\u5ea6\u914d\u7f6e\u4f1a\u8ba9\u95ee\u8d23\u5728\u6982\u5ff5\u4e0a\u65e0\u6cd5\u5b9e\u73b0\uff0c\u800c\u4e0d\u53ea\u662f\u900f\u660e\u5ea6\u6216\u6807\u51c6\u4e0d\u8db3\u3002\u4f5c\u8005\u901a\u8fc7\u6587\u732e\u5206\u6790\u3001\u4e13\u5bb6\u8bbf\u8c08\u4e8c\u6b21\u5206\u6790\u548c\u5bf9\u5f00\u6e90\u667a\u80fd\u4f53 OpenClaw \u7684\u5e94\u7528\uff0c\u5f52\u7eb3\u51fa9\u7c7b20\u4e2a\u6761\u4ef6\uff0c\u5e76\u5f62\u621020\u4e2a\u8bca\u65ad\u95ee\u9898\u7528\u4e8e\u8bc6\u522b\u95ee\u8d23\u7a7a\u6d1e\u3002", "categories": ["cs.CY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12104", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "AI\u6cbb\u7406", "\u95ee\u8d23\u673a\u5236", "\u793e\u4f1a\u6280\u672f\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12104v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "No One to Blame: A Framework of Constitutive AI Unaccountability", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u6784\u6210\u6027 AI \u4e0d\u53ef\u95ee\u8d23\u201d\u6846\u67b6\uff0c\u8ba4\u4e3a\u67d0\u4e9b AI \u7cfb\u7edf\u7684\u884c\u52a8\u8005\u3001\u6280\u672f\u4e0e\u5236\u5ea6\u914d\u7f6e\u4f1a\u8ba9\u95ee\u8d23\u5728\u6982\u5ff5\u4e0a\u65e0\u6cd5\u5b9e\u73b0\uff0c\u800c\u4e0d\u53ea\u662f\u900f\u660e\u5ea6\u6216\u6807\u51c6\u4e0d\u8db3\u3002\u4f5c\u8005\u901a\u8fc7\u6587\u732e\u5206\u6790\u3001\u4e13\u5bb6\u8bbf\u8c08\u4e8c\u6b21\u5206\u6790\u548c\u5bf9\u5f00\u6e90\u667a\u80fd\u4f53 OpenClaw \u7684\u5e94\u7528\uff0c\u5f52\u7eb3\u51fa9\u7c7b20\u4e2a\u6761\u4ef6\uff0c\u5e76\u5f62\u621020\u4e2a\u8bca\u65ad\u95ee\u9898\u7528\u4e8e\u8bc6\u522b\u95ee\u8d23\u7a7a\u6d1e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI models have achieved remarkable success across diverse domains, yet the mechanisms underlying their capabilities and the risks they may pose remain poorly understood. As AI development becomes faster and increasingly automated, mechanistic exploration remains largely manual, widening the gap between what models can do and our ability to understand and control them. To bridge this gap, we introduce Mechanist, an agentic system that uses AI as a scientific instrument for the autonomous discovery of mechanisms underlying AI intelligence. To support autonomous mechanistic discovery, we construct an interpretability-focused knowledge graph of approximately 13,000 papers and integrate it with a multidisciplinary database of 43 million papers spanning 26 fields. We further curate a library of 32 foundational methods for mechanism analysis, causal intervention, and validation. Compared with Claude Code and existing AI-scientist systems, Mechanist generates more valuable mechanism hypotheses and executes experiments more reliably. Mechanist also demonstrates a progression from discovering model behaviors to explaining and controlling AI models. Specifically, Mechanist first uncovers a counterintuitive safety risk in scientific laboratories, showing that unsafe traits can transfer across modalities through apparently safe training data. Mechanist then develops a mechanism theory of belief, revealing how models represent world knowledge, form beliefs, infer the beliefs of others, and how these mechanisms emerge during pretraining. Finally, Mechanist translates these mechanistic insights into practical interventions that improve model performance across diverse scenarios and steer scientific foundation models toward generating DNA sequences with specified properties.", "arxiv_id": "2608.12036", "arxiv_url": "https://arxiv.org/abs/2608.12036", "authors": ["Mengru Wang", "Junfeng Fang", "Shuofei Qiao", "Zhenqian Xu", "Haoming Xu", "Haoxiong Wang", "Shumin Deng", "Linyi Yang", "Zhixiang Cui", "Xin Xu", "Yunzhi Yao", "Buqiang Xu", "Fei Shen", "Haozhe Luo", "Yunxiang Wei", "Ningyu Zhang", "Julian McAuley", "Tat Seng Chua", "Huajun Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Mechanist\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5236\u53ef\u89e3\u91ca\u6027\u7684\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u628a AI \u7528\u4f5c\u81ea\u52a8\u53d1\u73b0\u667a\u80fd\u673a\u5236\u7684\u79d1\u5b66\u4eea\u5668\u3002\u5b83\u7ed3\u5408\u7ea61.3\u4e07\u7bc7\u53ef\u89e3\u91ca\u6027\u8bba\u6587\u77e5\u8bc6\u56fe\u8c31\u30014300\u4e07\u7bc7\u8de8\u5b66\u79d1\u8bba\u6587\u6570\u636e\u5e93\u548c32\u79cd\u673a\u5236\u5206\u6790\u65b9\u6cd5\uff0c\u76f8\u6bd4 Claude Code \u4e0e\u73b0\u6709 AI Scientist \u80fd\u63d0\u51fa\u66f4\u6709\u4ef7\u503c\u7684\u673a\u5236\u5047\u8bbe\u5e76\u66f4\u53ef\u9760\u5730\u6267\u884c\u5b9e\u9a8c\u3002\u7cfb\u7edf\u5c55\u793a\u4e86\u4ece\u53d1\u73b0\u6a21\u578b\u884c\u4e3a\u5230\u89e3\u91ca\u4e0e\u63a7\u5236\u6a21\u578b\u7684\u80fd\u529b\uff0c\u5305\u62ec\u63ed\u793a\u8de8\u6a21\u6001\u5b89\u5168\u98ce\u9669\u3001\u6784\u5efa\u4fe1\u5ff5\u673a\u5236\u7406\u8bba\uff0c\u5e76\u7528\u4e8e\u63d0\u5347\u6a21\u578b\u8868\u73b0\u548c\u5b9a\u5411\u751f\u6210 DNA \u5e8f\u5217\u3002", "categories": ["cs.AI", "cs.CL", "cs.HC", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12036", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u53ef\u89e3\u91ca\u6027", "\u673a\u5236\u5206\u6790", "AI\u79d1\u5b66\u5bb6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12036v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Mechanist: AI as a Scientific Instrument for Discovering the Mechanisms of Intelligence", "tldr": "\u8bba\u6587\u63d0\u51fa Mechanist\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5236\u53ef\u89e3\u91ca\u6027\u7684\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u628a AI \u7528\u4f5c\u81ea\u52a8\u53d1\u73b0\u667a\u80fd\u673a\u5236\u7684\u79d1\u5b66\u4eea\u5668\u3002\u5b83\u7ed3\u5408\u7ea61.3\u4e07\u7bc7\u53ef\u89e3\u91ca\u6027\u8bba\u6587\u77e5\u8bc6\u56fe\u8c31\u30014300\u4e07\u7bc7\u8de8\u5b66\u79d1\u8bba\u6587\u6570\u636e\u5e93\u548c32\u79cd\u673a\u5236\u5206\u6790\u65b9\u6cd5\uff0c\u76f8\u6bd4 Claude Code \u4e0e\u73b0\u6709 AI Scientist \u80fd\u63d0\u51fa\u66f4\u6709\u4ef7\u503c\u7684\u673a\u5236\u5047\u8bbe\u5e76\u66f4\u53ef\u9760\u5730\u6267\u884c\u5b9e\u9a8c\u3002\u7cfb\u7edf\u5c55\u793a\u4e86\u4ece\u53d1\u73b0\u6a21\u578b\u884c\u4e3a\u5230\u89e3\u91ca\u4e0e\u63a7\u5236\u6a21\u578b\u7684\u80fd\u529b\uff0c\u5305\u62ec\u63ed\u793a\u8de8\u6a21\u6001\u5b89\u5168\u98ce\u9669\u3001\u6784\u5efa\u4fe1\u5ff5\u673a\u5236\u7406\u8bba\uff0c\u5e76\u7528\u4e8e\u63d0\u5347\u6a21\u578b\u8868\u73b0\u548c\u5b9a\u5411\u751f\u6210 DNA \u5e8f\u5217\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model agents increasingly rely on long-horizon reasoning to solve complex tasks involving planning, tool use, and memory. A critical capability in such settings is reflection: assessing trajectory progress, identifying missing evidence and unreliable intermediate states, and deciding whether to continue, revise, or abandon the current branch. Learning effective reflection, however, is challenging because reflection is performed locally within the current branch, whereas its utility can only be determined by its contribution to the final trajectory outcome. This local-global mismatch makes outcome-based reinforcement learning provide only local, sparse and delayed supervision for reflective decisions. To solve these, we propose LoongReflect, a training framework that formulates reflection as a memory-control policy. The agent operates over a reversible trajectory tree using explicit reflect and backtrack actions. Reflection consolidates verified facts, missing evidence, and branch-specific risks into working memory, while backtracking removes an unreliable branch from the active context and preserves a concise corrective lesson. To learn this policy, LoongReflect combines two complementary signals through a look-ahead, extragradient-style coordination mechanism. A fast channel distills globally informed reflective behavior from a privileged teacher, with supervision restricted to reflection and backtracking tokens. A slow channel optimizes complete trajectories using outcome-based GRPO, aligning local control decisions with final task success. Experiments on multi-hop retrieval-augmented generation and mathematical reasoning benchmarks demonstrate consistent improvements over outcome-only reinforcement learning and self-distillation baselines.", "arxiv_id": "2608.11967", "arxiv_url": "https://arxiv.org/abs/2608.11967", "authors": ["Zhixin Zhang", "Xinke Jiang", "Zhibang Yang", "Weixuan Xu", "Guohong Qiu", "Xu Chu", "Junfeng Zhao", "Yasha Wang"], "brief": "LoongReflect \u5c06\u641c\u7d22\u667a\u80fd\u4f53\u7684\u53cd\u601d\u5efa\u6a21\u4e3a\u8bb0\u5fc6\u63a7\u5236\u7b56\u7565\uff0c\u5728\u53ef\u56de\u6eaf\u8f68\u8ff9\u6811\u4e0a\u901a\u8fc7\u53cd\u601d\u4e0e\u56de\u6eaf\u52a8\u4f5c\u7ba1\u7406\u5de5\u4f5c\u8bb0\u5fc6\u548c\u4e0d\u53ef\u9760\u5206\u652f\u3002\u5b83\u7ed3\u5408\u5168\u5c40\u89c6\u89d2\u6559\u5e08\u84b8\u998f\u4e0e\u57fa\u4e8e\u7ed3\u679c\u7684 GRPO \u5f3a\u5316\u5b66\u4e60\uff0c\u7f13\u89e3\u5c40\u90e8\u53cd\u601d\u51b3\u7b56\u4e0e\u6700\u7ec8\u6210\u529f\u4e4b\u95f4\u7684\u76d1\u7763\u9519\u914d\uff0c\u5728\u591a\u8df3\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u548c\u6570\u5b66\u63a8\u7406\u4efb\u52a1\u4e0a\u4f18\u4e8e\u4ec5\u7ed3\u679c\u5f3a\u5316\u5b66\u4e60\u4e0e\u81ea\u84b8\u998f\u57fa\u7ebf\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11967", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u957f\u7a0b\u63a8\u7406", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11967v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "LoongReflect: Boosting Long-Horizon Reflection in Search Agents via Global Perspective Distillation", "tldr": "LoongReflect \u5c06\u641c\u7d22\u667a\u80fd\u4f53\u7684\u53cd\u601d\u5efa\u6a21\u4e3a\u8bb0\u5fc6\u63a7\u5236\u7b56\u7565\uff0c\u5728\u53ef\u56de\u6eaf\u8f68\u8ff9\u6811\u4e0a\u901a\u8fc7\u53cd\u601d\u4e0e\u56de\u6eaf\u52a8\u4f5c\u7ba1\u7406\u5de5\u4f5c\u8bb0\u5fc6\u548c\u4e0d\u53ef\u9760\u5206\u652f\u3002\u5b83\u7ed3\u5408\u5168\u5c40\u89c6\u89d2\u6559\u5e08\u84b8\u998f\u4e0e\u57fa\u4e8e\u7ed3\u679c\u7684 GRPO \u5f3a\u5316\u5b66\u4e60\uff0c\u7f13\u89e3\u5c40\u90e8\u53cd\u601d\u51b3\u7b56\u4e0e\u6700\u7ec8\u6210\u529f\u4e4b\u95f4\u7684\u76d1\u7763\u9519\u914d\uff0c\u5728\u591a\u8df3\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u548c\u6570\u5b66\u63a8\u7406\u4efb\u52a1\u4e0a\u4f18\u4e8e\u4ec5\u7ed3\u679c\u5f3a\u5316\u5b66\u4e60\u4e0e\u81ea\u84b8\u998f\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The reliability of Large Language Models (LLMs) for API calling degrades in multilingual settings. A common failure occurs when a model selects the correct tool but generates argument values in an inconsistent language, which we term Argument Language Mismatch (ALM). Although semantically correct, such outputs are operationally invalid and not captured by standard API-calling metrics. We revisit post-training strategies for mitigating ALM and find that, in our benchmark, supervised fine-tuning (SFT) provides a strong baseline, substantially improving argument language consistency and end-to-end function call accuracy. Under consistent model selection, SFT achieves performance comparable to, and sometimes exceeding more complex reinforcement learning (RL) approaches. We further examine whether RL with structured, argument-aware rewards offers additional benefits. While methods such as Group Relative Policy Optimization (GRPO) can improve language consistency and better preserve general reasoning ability, these gains are incremental and most pronounced in generalization and multi-objective trade-offs. Overall, our results suggest that much of the performance in multilingual API grounding can be achieved through careful supervised training, with RL providing targeted rather than fundamental improvements.", "arxiv_id": "2608.11715", "arxiv_url": "https://arxiv.org/abs/2608.11715", "authors": ["Siddharth Chauhan", "Thomas Butler", "Abhishek Singhania", "Pankaj Porwal", "Honey Gupta"], "brief": "\u8bba\u6587\u7814\u7a76\u591a\u8bed\u8a00 API \u8c03\u7528\u4e2d\u7684\u201c\u53c2\u6570\u8bed\u8a00\u4e0d\u5339\u914d\u201d\u95ee\u9898\uff1a\u6a21\u578b\u9009\u5bf9\u5de5\u5177\u4f46\u7528\u9519\u8bed\u8a00\u751f\u6210\u53c2\u6570\uff0c\u5bfc\u81f4\u8c03\u7528\u4e0d\u53ef\u6267\u884c\u3002\u5b9e\u9a8c\u53d1\u73b0\u76d1\u7763\u5fae\u8c03\u5df2\u80fd\u663e\u8457\u63d0\u5347\u53c2\u6570\u8bed\u8a00\u4e00\u81f4\u6027\u548c\u7aef\u5230\u7aef\u51fd\u6570\u8c03\u7528\u51c6\u786e\u7387\uff0c\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u5982 GRPO \u4e3b\u8981\u5e26\u6765\u6cdb\u5316\u548c\u591a\u76ee\u6807\u6743\u8861\u4e0a\u7684\u589e\u91cf\u6539\u8fdb\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11715", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5de5\u5177\u4f7f\u7528", "\u591a\u8bed\u8a00", "\u76d1\u7763\u5fae\u8c03", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11715v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "When the API Speaks the Wrong Language: Revisiting Post-Training for Multilingual Tool Use", "tldr": "\u8bba\u6587\u7814\u7a76\u591a\u8bed\u8a00 API \u8c03\u7528\u4e2d\u7684\u201c\u53c2\u6570\u8bed\u8a00\u4e0d\u5339\u914d\u201d\u95ee\u9898\uff1a\u6a21\u578b\u9009\u5bf9\u5de5\u5177\u4f46\u7528\u9519\u8bed\u8a00\u751f\u6210\u53c2\u6570\uff0c\u5bfc\u81f4\u8c03\u7528\u4e0d\u53ef\u6267\u884c\u3002\u5b9e\u9a8c\u53d1\u73b0\u76d1\u7763\u5fae\u8c03\u5df2\u80fd\u663e\u8457\u63d0\u5347\u53c2\u6570\u8bed\u8a00\u4e00\u81f4\u6027\u548c\u7aef\u5230\u7aef\u51fd\u6570\u8c03\u7528\u51c6\u786e\u7387\uff0c\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u5982 GRPO \u4e3b\u8981\u5e26\u6765\u6cdb\u5316\u548c\u591a\u76ee\u6807\u6743\u8861\u4e0a\u7684\u589e\u91cf\u6539\u8fdb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Digital twins are increasingly used to monitor and simulate the behavior of cyber-physical systems. Even with skilled operators, interpreting anomalies detected within digital twin pipelines is challenging, as the sheer complexity and volume of raw sensor data make thorough analysis difficult. Recent advances in large language models (LLMs) offer promising capabilities for reasoning and explanation, yet their integration into digital twin-driven anomaly analysis remains underexplored. In this work, we propose AgenticTwin, an agentic framework that integrates LLM-driven reasoning with a digital twin-based anomaly detection pipeline. The framework grounds LLM-generated explanations in outputs from a digital twin-driven anomaly classifier and enables human operators to ask relevant natural-language questions about the system. Beyond the framework itself, we introduce a benchmark-oriented evaluation pipeline constructed over synthetic anomalies injected into a real-world weather sensor dataset, enabling controlled generation of operator queries over anomaly events. We further evaluate the feasibility of deploying lightweight, open-source LLMs for practical cyber-physical environments. Experimental results demonstrate that structured agent collaboration and knowledge-grounded reasoning improve diagnosis quality, contextual retrieval, and mitigation quality across diverse possible anomaly scenarios.", "arxiv_id": "2608.11679", "arxiv_url": "https://arxiv.org/abs/2608.11679", "authors": ["Touseef Hasan", "Mounika Ghanta", "Souvika Sarkar", "Ujjwal Guin"], "brief": "\u8bba\u6587\u63d0\u51fa AgenticTwin\uff0c\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u4e0e\u6570\u5b57\u5b6a\u751f\u5f02\u5e38\u68c0\u6d4b\u6d41\u6c34\u7ebf\u7ed3\u5408\uff0c\u7528\u6570\u5b57\u5b6a\u751f\u5206\u7c7b\u5668\u8f93\u51fa\u7ea6\u675f\u89e3\u91ca\uff0c\u5e76\u652f\u6301\u64cd\u4f5c\u5458\u7528\u81ea\u7136\u8bed\u8a00\u8ffd\u95ee\u5f02\u5e38\u4e8b\u4ef6\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u57fa\u4e8e\u771f\u5b9e\u5929\u6c14\u4f20\u611f\u5668\u6570\u636e\u4e0e\u5408\u6210\u5f02\u5e38\u7684\u8bc4\u6d4b\u6d41\u7a0b\uff0c\u5b9e\u9a8c\u8868\u660e\u7ed3\u6784\u5316\u667a\u80fd\u4f53\u534f\u4f5c\u548c\u77e5\u8bc6 grounded \u63a8\u7406\u80fd\u63d0\u5347\u8bca\u65ad\u3001\u68c0\u7d22\u4e0e\u7f13\u89e3\u5efa\u8bae\u8d28\u91cf\u3002", "categories": ["cs.AI", "cs.IR", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11679", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u5b57\u5b6a\u751f", "\u5f02\u5e38\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11679v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AgenticTwin: An Agentic LLM Framework Integrated with Digital Twin for Anomaly Detection", "tldr": "\u8bba\u6587\u63d0\u51fa AgenticTwin\uff0c\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u4e0e\u6570\u5b57\u5b6a\u751f\u5f02\u5e38\u68c0\u6d4b\u6d41\u6c34\u7ebf\u7ed3\u5408\uff0c\u7528\u6570\u5b57\u5b6a\u751f\u5206\u7c7b\u5668\u8f93\u51fa\u7ea6\u675f\u89e3\u91ca\uff0c\u5e76\u652f\u6301\u64cd\u4f5c\u5458\u7528\u81ea\u7136\u8bed\u8a00\u8ffd\u95ee\u5f02\u5e38\u4e8b\u4ef6\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u57fa\u4e8e\u771f\u5b9e\u5929\u6c14\u4f20\u611f\u5668\u6570\u636e\u4e0e\u5408\u6210\u5f02\u5e38\u7684\u8bc4\u6d4b\u6d41\u7a0b\uff0c\u5b9e\u9a8c\u8868\u660e\u7ed3\u6784\u5316\u667a\u80fd\u4f53\u534f\u4f5c\u548c\u77e5\u8bc6 grounded \u63a8\u7406\u80fd\u63d0\u5347\u8bca\u65ad\u3001\u68c0\u7d22\u4e0e\u7f13\u89e3\u5efa\u8bae\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Persuasion is a core dynamic of natural language communication, shaping how large language models (LLMs) update beliefs, resolve disagreements, and reach decisions. As LLMs increasingly debate, advise, and think collaboratively with humans and each other, resistance to harmful persuasion becomes a core requirement for reliable behavior. Yet we show that this requirement is far from met: a single targeted persuasive argument is enough to collapse model accuracy to near zero, even when the argument is factually false. We formalize this threat as adversarial persuasion and introduce an adversarial reinforcement learning framework that trains persuader agents to change a target model\u0027s answer in a single interaction. First, we show that optimizing persuasion strategies through trial and error exposes vulnerabilities that static prompting misses: RL-trained persuaders raise persuasion success from approximately 24% to over 93% against the training-time persuadee. Second, we find that these learned strategies transfer to unseen models, achieving 83% attack success on Qwen-14B, 79% on Llama-3.1-8B, and 25% on GPT-4o-mini. Third, we demonstrate that a curriculum that bootstraps on more persuadable open-weight models before targeting harder models further increases GPT-4o-mini attack success from 25% to 38%. Moreover, our results reveal that optimized persuaders increasingly rely on credibility-based tactics, including fabricated citations and false authoritative evidence. Together, these findings expose a critical weakness in current LLM agents: even when they initially reason correctly, they can be steered toward false conclusions by optimized natural language influence. This positions persuasion robustness as a necessary safety criterion for multi-agent and human-AI decision-making systems.", "arxiv_id": "2608.11624", "arxiv_url": "https://arxiv.org/abs/2608.11624", "authors": ["Nimet Beyza Bozdag", "Emre Can Acikgoz", "Gokhan Tur", "Dilek Hakkani-T\u00fcr"], "brief": "\u672c\u6587\u5c06\u9488\u5bf9\u5927\u6a21\u578b\u7684\u8bf4\u670d\u653b\u51fb\u5f62\u5f0f\u5316\u4e3a\u201c\u5bf9\u6297\u6027\u8bf4\u670d\u201d\uff0c\u5e76\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u8bf4\u670d\u8005\u667a\u80fd\u4f53\u5728\u5355\u8f6e\u4ea4\u4e92\u4e2d\u8bf1\u5bfc\u76ee\u6807\u6a21\u578b\u653e\u5f03\u6b63\u786e\u7b54\u6848\u3002\u5b9e\u9a8c\u663e\u793a\uff0cRL \u8bf4\u670d\u8005\u53ef\u5c06\u8bad\u7ec3\u76ee\u6807\u4e0a\u7684\u653b\u51fb\u6210\u529f\u7387\u4ece\u7ea624%\u63d0\u5347\u523093%\u4ee5\u4e0a\uff0c\u5e76\u80fd\u8fc1\u79fb\u5230\u672a\u89c1\u6a21\u578b\uff1b\u5176\u7b56\u7565\u5e38\u4f9d\u8d56\u4f2a\u9020\u5f15\u7528\u548c\u865a\u5047\u6743\u5a01\u8bc1\u636e\u3002\u7ed3\u679c\u8868\u660e\u5f53\u524d\u5927\u6a21\u578b\u5373\u4f7f\u521d\u59cb\u63a8\u7406\u6b63\u786e\uff0c\u4e5f\u5bb9\u6613\u88ab\u4f18\u5316\u8fc7\u7684\u81ea\u7136\u8bed\u8a00\u5f71\u54cd\u5e26\u504f\uff0c\u8bf4\u670d\u9c81\u68d2\u6027\u5e94\u6210\u4e3a\u591a\u667a\u80fd\u4f53\u4e0e\u4eba\u673a\u51b3\u7b56\u7cfb\u7edf\u7684\u91cd\u8981\u5b89\u5168\u6307\u6807\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11624", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5b89\u5168\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11624v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Learning to Persuade Exposes How Easily LLMs Abandon Correct Beliefs", "tldr": "\u672c\u6587\u5c06\u9488\u5bf9\u5927\u6a21\u578b\u7684\u8bf4\u670d\u653b\u51fb\u5f62\u5f0f\u5316\u4e3a\u201c\u5bf9\u6297\u6027\u8bf4\u670d\u201d\uff0c\u5e76\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u8bf4\u670d\u8005\u667a\u80fd\u4f53\u5728\u5355\u8f6e\u4ea4\u4e92\u4e2d\u8bf1\u5bfc\u76ee\u6807\u6a21\u578b\u653e\u5f03\u6b63\u786e\u7b54\u6848\u3002\u5b9e\u9a8c\u663e\u793a\uff0cRL \u8bf4\u670d\u8005\u53ef\u5c06\u8bad\u7ec3\u76ee\u6807\u4e0a\u7684\u653b\u51fb\u6210\u529f\u7387\u4ece\u7ea624%\u63d0\u5347\u523093%\u4ee5\u4e0a\uff0c\u5e76\u80fd\u8fc1\u79fb\u5230\u672a\u89c1\u6a21\u578b\uff1b\u5176\u7b56\u7565\u5e38\u4f9d\u8d56\u4f2a\u9020\u5f15\u7528\u548c\u865a\u5047\u6743\u5a01\u8bc1\u636e\u3002\u7ed3\u679c\u8868\u660e\u5f53\u524d\u5927\u6a21\u578b\u5373\u4f7f\u521d\u59cb\u63a8\u7406\u6b63\u786e\uff0c\u4e5f\u5bb9\u6613\u88ab\u4f18\u5316\u8fc7\u7684\u81ea\u7136\u8bed\u8a00\u5f71\u54cd\u5e26\u504f\uff0c\u8bf4\u670d\u9c81\u68d2\u6027\u5e94\u6210\u4e3a\u591a\u667a\u80fd\u4f53\u4e0e\u4eba\u673a\u51b3\u7b56\u7cfb\u7edf\u7684\u91cd\u8981\u5b89\u5168\u6307\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mobile GUI agents remain brittle when deployed to applications absent from source training. We study novel-app generalization under a limited target interaction budget and without target demonstrations. We introduce CoAdapt-GUI, a test-time adaptation (TTA) framework that jointly adapts structured workflow context and policy from the agent\u0027s own target-app rollouts and rewards. The workflow context retains transferable procedures, failure modes, and verification rules while excluding app-bound source details. This separation allows reusable workflow knowledge to guide adaptation without transferring source-interface state. For policy adaptation, task-context-matched group-relative optimization updates a LoRA adapter on a frozen vision-language model. Across two unseen-app evaluations, CoAdapt-GUI reaches 45.0% on AndroidWorld-Generalization, compared with 37.5% for the reported Policy-Only TTA baseline, and raises AndroidWorld Plus performance from 38.6% to 52.9%. These results show that transfer-constrained workflow context provides substantial gains and that joint policy adaptation further improves held-out performance.", "arxiv_id": "2608.11588", "arxiv_url": "https://arxiv.org/abs/2608.11588", "authors": ["Linqiang Guo", "Li Gu", "Zihuan Jiang", "Zhixiang Chi", "Siobhan Reid", "Ziqiang Wang", "Yuanhao Yu", "Wei Liu", "Yang Wang", "Tse-Hsun", "Chen"], "brief": "\u8bba\u6587\u63d0\u51fa CoAdapt-GUI\uff0c\u4e00\u4e2a\u9762\u5411\u672a\u89c1\u79fb\u52a8\u5e94\u7528\u7684\u6d4b\u8bd5\u65f6\u9002\u5e94\u6846\u67b6\uff0c\u5728\u6ca1\u6709\u76ee\u6807\u5e94\u7528\u793a\u8303\u3001\u4ea4\u4e92\u9884\u7b97\u6709\u9650\u7684\u60c5\u51b5\u4e0b\uff0c\u8054\u5408\u9002\u5e94\u7ed3\u6784\u5316\u5de5\u4f5c\u6d41\u4e0a\u4e0b\u6587\u548c GUI \u64cd\u4f5c\u7b56\u7565\u3002\u8be5\u65b9\u6cd5\u5728 AndroidWorld-Generalization \u4e0a\u4ece\u57fa\u7ebf 37.5% \u63d0\u5347\u5230 45.0%\uff0c\u5728 AndroidWorld Plus \u4e0a\u4ece 38.6% \u63d0\u5347\u5230 52.9%\uff0c\u663e\u793a\u51fa\u5de5\u4f5c\u6d41\u77e5\u8bc6\u8fc1\u79fb\u4e0e\u7b56\u7565\u5fae\u8c03\u7684\u4e92\u8865\u6536\u76ca\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11588", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "GUI\u81ea\u52a8\u5316", "\u6d4b\u8bd5\u65f6\u9002\u5e94", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11588v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CoAdapt-GUI: Joint Workflow Context and Policy Adaptation for Unseen GUI Applications", "tldr": "\u8bba\u6587\u63d0\u51fa CoAdapt-GUI\uff0c\u4e00\u4e2a\u9762\u5411\u672a\u89c1\u79fb\u52a8\u5e94\u7528\u7684\u6d4b\u8bd5\u65f6\u9002\u5e94\u6846\u67b6\uff0c\u5728\u6ca1\u6709\u76ee\u6807\u5e94\u7528\u793a\u8303\u3001\u4ea4\u4e92\u9884\u7b97\u6709\u9650\u7684\u60c5\u51b5\u4e0b\uff0c\u8054\u5408\u9002\u5e94\u7ed3\u6784\u5316\u5de5\u4f5c\u6d41\u4e0a\u4e0b\u6587\u548c GUI \u64cd\u4f5c\u7b56\u7565\u3002\u8be5\u65b9\u6cd5\u5728 AndroidWorld-Generalization \u4e0a\u4ece\u57fa\u7ebf 37.5% \u63d0\u5347\u5230 45.0%\uff0c\u5728 AndroidWorld Plus \u4e0a\u4ece 38.6% \u63d0\u5347\u5230 52.9%\uff0c\u663e\u793a\u51fa\u5de5\u4f5c\u6d41\u77e5\u8bc6\u8fc1\u79fb\u4e0e\u7b56\u7565\u5fae\u8c03\u7684\u4e92\u8865\u6536\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Creative agents still lack an effective way to learn from high-quality human films, limiting their ability to produce cinematic-grade videos. A key challenge is the absence of a structured video representation that is both faithful to film content and directly usable for agentic reasoning and manipulation. To address the challenge, we propose the Agentic Video Auto-Encoder (AVA-Encoder), a framework for learning agent-native video representations via agentic auto-encoding. AVA-Encoder transforms a video into a knowledge graph (KG) representation and then reconstructs it back into video. Its hierarchy and state nodes store structured text, while a linked asset layer holds generated images, audio, and video. Typed edges preserve the relations between these text descriptions and assets in a form that agents can easily understand, query, and edit. The video reconstruction differences drive a textual-gradient optimization framework, which expresses evaluation feedback as natural-language update directions for Data-Independent Encoding Policy Pseudo-Training in the outer loop and optional Data-Dependent KG Representation Refinement in the test-time inner loop. Extensive experiments show that AVA-Encoder improves by 20.7 percentage points over the strongest external baseline. In the controlled policy-only setting, its pseudo-trained shot-level Agentic Video Encoder policy also outperforms a carefully human-tuned policy while using 74.3% fewer system-prompt tokens. We release the complete AVA-Encoder framework, a reliable agentic video reconstruction benchmark, and the first dataset of high-quality film KG representations.", "arxiv_id": "2608.12313", "arxiv_url": "https://arxiv.org/abs/2608.12313", "authors": ["Chuyue Li", "Jinpeng Yu", "Haozhe Wang", "Tian Xueyun", "Zhijing Zhang", "Bingnan Li", "Shuqi Gu", "Kan Ren", "Jiaming Liu", "Ruihua Hua"], "brief": "\u672c\u6587\u63d0\u51fa AVA-Encoder\uff0c\u901a\u8fc7\u201c\u89c6\u9891\u2192\u77e5\u8bc6\u56fe\u8c31\u2192\u89c6\u9891\u91cd\u5efa\u201d\u7684\u667a\u80fd\u4f53\u81ea\u7f16\u7801\u65b9\u5f0f\u5b66\u4e60\u9762\u5411\u667a\u80fd\u4f53\u7684\u89c6\u9891\u8868\u793a\uff0c\u4f7f\u7535\u5f71\u5185\u5bb9\u80fd\u88ab\u67e5\u8be2\u3001\u63a8\u7406\u548c\u7f16\u8f91\u3002\u65b9\u6cd5\u7ed3\u5408\u6587\u672c\u68af\u5ea6\u4f18\u5316\u4e0e\u6d4b\u8bd5\u65f6\u56fe\u8c31\u7ec6\u5316\uff0c\u5728\u89c6\u9891\u91cd\u5efa\u57fa\u51c6\u4e0a\u8f83\u6700\u5f3a\u5916\u90e8\u57fa\u7ebf\u63d0\u5347 20.7 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u51cf\u5c11\u5927\u91cf\u63d0\u793a\u8bcd\u5f00\u9500\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12313", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u8868\u793a\u5b66\u4e60", "\u77e5\u8bc6\u56fe\u8c31", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12313v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12313.png", "title": "AVA-Encoder: Towards Agent-Native Video Representation Learning", "tldr": "\u672c\u6587\u63d0\u51fa AVA-Encoder\uff0c\u901a\u8fc7\u201c\u89c6\u9891\u2192\u77e5\u8bc6\u56fe\u8c31\u2192\u89c6\u9891\u91cd\u5efa\u201d\u7684\u667a\u80fd\u4f53\u81ea\u7f16\u7801\u65b9\u5f0f\u5b66\u4e60\u9762\u5411\u667a\u80fd\u4f53\u7684\u89c6\u9891\u8868\u793a\uff0c\u4f7f\u7535\u5f71\u5185\u5bb9\u80fd\u88ab\u67e5\u8be2\u3001\u63a8\u7406\u548c\u7f16\u8f91\u3002\u65b9\u6cd5\u7ed3\u5408\u6587\u672c\u68af\u5ea6\u4f18\u5316\u4e0e\u6d4b\u8bd5\u65f6\u56fe\u8c31\u7ec6\u5316\uff0c\u5728\u89c6\u9891\u91cd\u5efa\u57fa\u51c6\u4e0a\u8f83\u6700\u5f3a\u5916\u90e8\u57fa\u7ebf\u63d0\u5347 20.7 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u51cf\u5c11\u5927\u91cf\u63d0\u793a\u8bcd\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While retrieval-augmented generation (RAG) has proven effective at giving LLMs access to external knowledge, mainstream dense-retrieval implementations remain inherently limited in handling structured constraints and multi-hop reasoning. Graph-based methods address this by constructing knowledge graphs offline, but they often fragment semantics, incur high maintenance, and complicate incremental updates. We propose SAG (SQL-Retrieval Augmented Generation), a structured retrieval architecture that organizes documents into an event-entity index without building a global knowledge graph. SAG represents each chunk as a semantically complete event paired with its entities, forming a latent hyperedge that preserves n-ary relations without decomposing them into triples. At query time, SAG treats shared entities as join keys to connect related chunks. This dynamically yields a query-scoped neighborhood of events, and yet every piece of evidence remains the original chunk throughout. Experiments on HotpotQA, 2WikiMultiHopQA, and MuSiQue show that SAG achieves the best retrieval and end-to-end QA performance on every benchmark, with gains that widen as reasoning-chain complexity increases. On MuSiQue, where multi-hop evidence chaining is most demanding, SAG reaches 80.36% Recall@5, outperforming the strongest baseline by 11.52 points. This work paves the way for knowledge infrastructure that enables LLM agents to retrieve and reason over continually growing organizational knowledge.", "arxiv_id": "2608.12129", "arxiv_url": "https://arxiv.org/abs/2608.12129", "authors": ["Yuchao Wu", "Junqin Li", "XingCheng Liang", "Yongjie Chen", "Yinghao Liang", "Linyuan Mo", "Guanxian Li"], "brief": "\u672c\u6587\u63d0\u51fa SAG\uff0c\u4e00\u79cd\u57fa\u4e8e SQL \u7684\u7ed3\u6784\u5316 RAG \u67b6\u6784\uff0c\u5c06\u6587\u6863\u5757\u7ec4\u7ec7\u4e3a\u201c\u4e8b\u4ef6-\u5b9e\u4f53\u201d\u7d22\u5f15\uff0c\u5e76\u5728\u67e5\u8be2\u65f6\u901a\u8fc7\u5171\u4eab\u5b9e\u4f53\u52a8\u6001\u8fde\u63a5\u76f8\u5173\u8bc1\u636e\uff0c\u907f\u514d\u79bb\u7ebf\u6784\u5efa\u5168\u5c40\u77e5\u8bc6\u56fe\u8c31\u3002\u5b9e\u9a8c\u8868\u660e SAG \u5728 HotpotQA\u30012WikiMultiHopQA \u548c MuSiQue \u4e0a\u53d6\u5f97\u6700\u4f73\u68c0\u7d22\u4e0e\u95ee\u7b54\u8868\u73b0\uff0c\u5c24\u5176\u5728\u590d\u6742\u591a\u8df3\u63a8\u7406\u4e2d\u4f18\u52bf\u66f4\u660e\u663e\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12129", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u591a\u8df3\u63a8\u7406", "\u77e5\u8bc6\u56fe\u8c31", "\u7ed3\u6784\u5316\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12129v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SAG: SQL-Retrieval Augmented Generation with Query-Time Dynamic Hyperedges", "tldr": "\u672c\u6587\u63d0\u51fa SAG\uff0c\u4e00\u79cd\u57fa\u4e8e SQL \u7684\u7ed3\u6784\u5316 RAG \u67b6\u6784\uff0c\u5c06\u6587\u6863\u5757\u7ec4\u7ec7\u4e3a\u201c\u4e8b\u4ef6-\u5b9e\u4f53\u201d\u7d22\u5f15\uff0c\u5e76\u5728\u67e5\u8be2\u65f6\u901a\u8fc7\u5171\u4eab\u5b9e\u4f53\u52a8\u6001\u8fde\u63a5\u76f8\u5173\u8bc1\u636e\uff0c\u907f\u514d\u79bb\u7ebf\u6784\u5efa\u5168\u5c40\u77e5\u8bc6\u56fe\u8c31\u3002\u5b9e\u9a8c\u8868\u660e SAG \u5728 HotpotQA\u30012WikiMultiHopQA \u548c MuSiQue \u4e0a\u53d6\u5f97\u6700\u4f73\u68c0\u7d22\u4e0e\u95ee\u7b54\u8868\u73b0\uff0c\u5c24\u5176\u5728\u590d\u6742\u591a\u8df3\u63a8\u7406\u4e2d\u4f18\u52bf\u66f4\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-running conversational agents increasingly rely on a memory system to avoid resending the whole conversation each turn, yet how much that costs to serve has received little systematic benchmarking. We compare three memory systems (Mem0, Hindsight, and Mastra Observational Memory) against two reference strategies -- a fixed-size rolling window and resubmitting the full transcript -- across two backbones and conversations of up to 400 turns, pairing every cost measurement with answer accuracy on 665 LoCoMo questions. First, a memory system\u0027s serving cost cannot be predicted from conversation length and message size alone: a regression that tracks the two reference strategies closely misses the memory systems by 18-69%, their cost driven instead by internal memory behavior. Second, a break-even analysis shows that whether -- and when -- a memory system becomes cheaper to serve than the full transcript is highly sensitive to the system and the backbone, from the first tens of turns for the cheapest to never within 400 turns for the most expensive. Third, no system wins on both axes: accuracy spans 21-54%, and the backbone choice drives cost as much as the memory system does.", "arxiv_id": "2608.11879", "arxiv_url": "https://arxiv.org/abs/2608.11879", "authors": ["Natchanon Pollertlam", "Witchayut Kornsuwannawit"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86\u957f\u5bf9\u8bdd\u667a\u80fd\u4f53\u4e2d\u4e09\u79cd\u8bb0\u5fc6\u7cfb\u7edf\u7684\u670d\u52a1\u6210\u672c\uff0c\u5e76\u4e0e\u6eda\u52a8\u7a97\u53e3\u548c\u5168\u91cf\u91cd\u4f20\u4e24\u79cd\u57fa\u7ebf\u6bd4\u8f83\uff0c\u8986\u76d6\u6700\u591a400\u8f6e\u5bf9\u8bdd\u548c665\u4e2aLoCoMo\u95ee\u7b54\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8bb0\u5fc6\u7cfb\u7edf\u6210\u672c\u65e0\u6cd5\u4ec5\u7531\u5bf9\u8bdd\u957f\u5ea6\u548c\u6d88\u606f\u5927\u5c0f\u9884\u6d4b\uff0c\u662f\u5426\u6bd4\u5168\u91cf\u91cd\u4f20\u66f4\u7701\u94b1\u9ad8\u5ea6\u4f9d\u8d56\u5177\u4f53\u7cfb\u7edf\u548c\u6a21\u578b\u9aa8\u5e72\uff1b\u540c\u65f6\u6ca1\u6709\u65b9\u6cd5\u80fd\u540c\u65f6\u5728\u6210\u672c\u548c\u51c6\u786e\u7387\u4e0a\u5360\u4f18\u3002", "categories": ["cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11879", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7cfb\u7edf", "\u957f\u5bf9\u8bdd", "\u6210\u672c\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11879v1", "published_at": "2026-08-12", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Total Recall at What Cost? Benchmarking the Serving Cost of Agentic Memory Systems", "tldr": "\u672c\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86\u957f\u5bf9\u8bdd\u667a\u80fd\u4f53\u4e2d\u4e09\u79cd\u8bb0\u5fc6\u7cfb\u7edf\u7684\u670d\u52a1\u6210\u672c\uff0c\u5e76\u4e0e\u6eda\u52a8\u7a97\u53e3\u548c\u5168\u91cf\u91cd\u4f20\u4e24\u79cd\u57fa\u7ebf\u6bd4\u8f83\uff0c\u8986\u76d6\u6700\u591a400\u8f6e\u5bf9\u8bdd\u548c665\u4e2aLoCoMo\u95ee\u7b54\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8bb0\u5fc6\u7cfb\u7edf\u6210\u672c\u65e0\u6cd5\u4ec5\u7531\u5bf9\u8bdd\u957f\u5ea6\u548c\u6d88\u606f\u5927\u5c0f\u9884\u6d4b\uff0c\u662f\u5426\u6bd4\u5168\u91cf\u91cd\u4f20\u66f4\u7701\u94b1\u9ad8\u5ea6\u4f9d\u8d56\u5177\u4f53\u7cfb\u7edf\u548c\u6a21\u578b\u9aa8\u5e72\uff1b\u540c\u65f6\u6ca1\u6709\u65b9\u6cd5\u80fd\u540c\u65f6\u5728\u6210\u672c\u548c\u51c6\u786e\u7387\u4e0a\u5360\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Model routing aims to select the most suitable model from a candidate pool for each query, balancing quality and cost. Existing VLM routing research is limited to traditional VQA evaluation, lacks systematic calibration optimization for open-set scenarios, and employs training objectives that dilute multi-positive signals via softmax normalization without incorporating cost. We address these limitations with three contributions: (1)VLM-ExecRouterBench, the first execution-oriented VLM routing benchmark covering Code, Agentic, and Search domains with 11 candidate models spanning nearly two orders of magnitude in pricing; (2)SCOPE-Router, a dual-tower router that matches queries to model behavior profiles constructed via hybrid calibration (random/diagnostic/diversity sampling), enabling new models to join routing without retraining; (3)CRM+RCCR, an architecture-agnostic cost-aware objective that encodes cost preference into continuous relevance targets through per-pair independent scoring, eliminating multi-positive dilution while regularizing queries with similar routing preferences to be closer in the routing space. Empirically, SCOPE-Router achieves the best Rank Score on all three benchmarks, surpassing the runner-up by 1.8
