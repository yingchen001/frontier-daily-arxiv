const PAPERS = [{"abstract": "Large language model (LLM) agents integrated with external tools are vulnerable to indirect prompt injections embedded in environmental states. However, existing studies largely rely on manually implemented or reused environments, stochastic LLM-based tool simulation, and predefined injection locations, limiting scalable security research across broader domains. To bridge this gap, we propose **ToolHazard**, a scalable adversarial environment synthesis framework that reduces human engineering and supports expansion with additional seed domains and compute. Through an Environment Simulator, an Attacker Agent, and a User Simulator, ToolHazard synthesizes executable stateful environments, discovers viable injection points and generates environment-specific payloads, and constructs state-grounded long-horizon tasks. Based on ToolHazard, we build **ToolHazard-Bench** for stress-testing agents under complex workflows and diverse environmental attacks. Experiments reveal substantial agent vulnerabilities and show that injection timing and placement affect attack effectiveness. Moreover, ToolHazard-generated alignment data improves security on both ToolHazard-Bench and AgentDojo while preserving benign task utility.", "arxiv_id": "2608.11878", "arxiv_url": "https://arxiv.org/abs/2608.11878", "authors": ["Yutao Mou", "Pengfei Yang", "Zhe Yin", "Zhangchi Xue", "Xiaotian Luan", "Dingyao Yu", "Tong Zhang", "Shikun Zhang", "Wei Ye"], "brief": "\u8bba\u6587\u63d0\u51fa ToolHazard\uff0c\u4e00\u4e2a\u53ef\u6269\u5c55\u7684\u5bf9\u6297\u73af\u5883\u5408\u6210\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30\u548c\u5bf9\u9f50\u63a5\u5165\u5916\u90e8\u5de5\u5177\u7684 LLM \u667a\u80fd\u4f53\u5728\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u4e0b\u7684\u5b89\u5168\u6027\u3002\u5b83\u8fdb\u4e00\u6b65\u6784\u5efa ToolHazard-Bench\uff0c\u8986\u76d6\u590d\u6742\u957f\u7a0b\u5de5\u4f5c\u6d41\u3001\u591a\u6837\u653b\u51fb\u4f4d\u7f6e\u4e0e\u73af\u5883\u7279\u5b9a\u8f7d\u8377\u \u4e8e\u8bc4\u4f30\u548c\u5bf9\u9f50\u63a5\u5165\u5916\u90e8\u5de5\u5177\u7684 LLM \u667a\u80fd\u4f53\u5728\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u4e0b\u7684\u5b89\u5168\u6027\u3002\u5b83\u8fdb\u4e00\u6b65\u6784\u5efa ToolHazard-Bench\uff0c\u8986\u76d6\u590d\u6742\u957f\u7a0b\u5de5\u4f5c\u6d41\u3001\u591a\u6837\u653b\u51fb\u4f4d\u7f6e\u4e0e\u73af\u5883\u7279\u5b9a\u8f7d\u8377\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5de5\u5177\u578b LLM \u667a\u80fd\u4f53\u7684\u5b89\u5168\u8bc4\u6d4b\u4ece\u624b\u5de5\u73af\u5883\u63a8\u8fdb\u5230\u53ef\u6269\u5c55\u3001\u53ef\u81ea\u52a8\u751f\u6210\u7684\u5bf9\u6297\u73af\u5883\uff0c\u4e3a\u7cfb\u7edf\u5316\u53d1\u73b0\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u98ce\u9669\u548c\u751f\u6210\u5b89\u5168\u5bf9\u9f50\u6570\u636e\u63d0\u4f9b\u4e86\u5b9e\u7528\u57fa\u7840\u3002"}, {"abstract": "Agentic systems are increasingly expected to improve after deployment, yet single-entity self-evolution is often bounded by a static learning context, such as fixed tasks and feedback. This survey focuses on co-evolution in agentic systems, a multi-component form of self-evolution in which multiple agents and their environment impose adaptive pressure on one another. To organize existing papers, we propose a progressive three-stage taxonomy that traces how the system gradually sheds human-engineered constraints. Agent--Agent Co-Evolution studies how agents adapt through dynamic peers, including adversarial, collaborative, and organizational adaptation. Agent--Environment Co-Evolution extends this loop to adaptive tasks, feedback, and interaction spaces that change with the agents. Meta Co-Evolution further explores the possibility of making the evolution mechanism itself evolvable. We also discuss open challenges in evaluating such systems, scaling them across multiple components, and keeping increasingly autonomous evolutionary processes safe and controllable. This survey provides a unified foundation for building robust and open-ended agentic systems that can improve beyond fixed human-designed paths.", "arxiv_id": "2608.10299", "arxiv_url": "https://arxiv.org/abs/2608.10299", "authors": ["Qing Zong", "Jiayu Liu", "Junhao Shen", "Zecong Tang", "Linsi Wu", "Yuxuan Liu", "Rui Wang", "Zhaowei Wang", "Weiqi Wang", "Cheng Qian", "Xiusi Chen", "Yangqiu Song"], "brief": "\u672c\u6587\u662f\u4e00\u7bc7\u5173\u4e8e\u667a\u80fd\u4f53\u7cfb\u7edf\u534f\u540c\u8fdb\u5316\u7684\u7efc\u8ff0\uff0c\u5173\u6ce8\u591a\u4e2a\u667a\u80fd\u4f53\u53ca\u5176\u73af\u5883\u5982\u4f55\u76f8\u4e92\u65bd\u52a0\u9002\u5e94\u538b\u529b\uff0c\u4ece\u800c\u7a81\u7834\u56fa\u5b9a\u4efb\u52a1\u4e0e\u53cd\u9988\u5e26\u6765\u7684\u81ea\u8fdb\u5316\u4e0a\u9650\u3002\u8bba\u6587\u63d0\u51fa\u4e09\u9636\u6bb5\u5206\u7c7b\u6846\u67b6\uff1a\u667a\u80fd\u4f53-\u667a\u80fd\u4f53\u534f\u540c\u8fdb\u5316\u3001\u667a\u80fd\u4f53-\u73af\u5883\u534f\u540c\u8fdb\u5316\uff0c\u4ee5\u53ca\u8ba9\u8fdb\u5316\u673a\u5236\u672c\u8eab\u53ef\u8fdb\u5316\u7684\u5143\u534f\u540c\u8fdb\u5316\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/zongqing0068/awesome-co-evolution", "github_stars": 27, "hf_url": "https://huggingface.co/papers/2608.10299", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u4ece\u4eba\u7c7b\u8bbe\u8ba1\u7ea6\u675f\u9010\u6b65\u51cf\u5c11\u7684\u4e09\u9636\u6bb5\u5206\u7c7b\uff1aAgent-Agent\u3001Agent-Environment\u3001Meta Co-Evolution\u3002", "\u7cfb\u7edf\u68b3\u7406\u5bf9\u6297\u3001\u534f\u4f5c\u3001\u7ec4\u7ec7\u7ed3\u6784\u9002\u5e94\uff0c\u4ee5\u53ca\u4efb\u52a1\u3001\u53cd\u9988\u3001\u4ea4\u4e92\u7a7a\u95f4\u968f\u667a\u80fd\u4f53\u53d8\u5316\u7684\u7814\u7a76\u8109\u7edc\u3002", "\u8ba8\u8bba\u5f00\u653e\u5f0f\u667a\u80fd\u4f53\u8fdb\u5316\u4e2d\u7684\u8bc4\u4f30\u3001\u6269\u5c55\u6027\u3001\u5b89\u5168\u6027\u4e0e\u53ef\u63a7\u6027\u6311\u6218\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u8fdb\u5316", "\u591a\u667a\u80fd\u4f53", "\u5b89\u5168\u5bf9\u9f50"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.10299v1", "published_at": "2026-08-10", "score": 0.312, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (118\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.10299.png", "title": "Co-Evolution in Agentic Systems: Toward Self-Directed Evolution Beyond Human Design", "tldr": "\u7efc\u8ff0\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u534f\u540c\u81ea\u8fdb\u5316\u8def\u5f84", "upvotes": 118, "what_it_is": "\u672c\u6587\u662f\u4e00\u7bc7\u5173\u4e8e\u667a\u80fd\u4f53\u7cfb\u7edf\u534f\u540c\u8fdb\u5316\u7684\u7efc\u8ff0\uff0c\u5173\u6ce8\u591a\u4e2a\u667a\u80fd\u4f53\u53ca\u5176\u73af\u5883\u5982\u4f55\u76f8\u4e92\u65bd\u52a0\u9002\u5e94\u538b\u529b\uff0c\u4ece\u800c\u7a81\u7834\u56fa\u5b9a\u4efb\u52a1\u4e0e\u53cd\u9988\u5e26\u6765\u7684\u81ea\u8fdb\u5316\u4e0a\u9650\u3002\u8bba\u6587\u63d0\u51fa\u4e09\u9636\u6bb5\u5206\u7c7b\u6846\u67b6\uff1a\u667a\u80fd\u4f53-\u667a\u80fd\u4f53\u534f\u540c\u8fdb\u5316\u3001\u667a\u80fd\u4f53-\u73af\u5883\u534f\u540c\u8fdb\u5316\uff0c\u4ee5\u53ca\u8ba9\u8fdb\u5316\u673a\u5236\u672c\u8eab\u53ef\u8fdb\u5316\u7684\u5143\u534f\u540c\u8fdb\u5316\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u4e3a\u667a\u80fd\u4f53\u90e8\u7f72\u540e\u7684\u6301\u7eed\u6539\u8fdb\u63d0\u4f9b\u4e86\u7edf\u4e00\u89c6\u89d2\uff0c\u5f3a\u8c03\u4ece\u5355\u4f53\u81ea\u5b66\u4e60\u8f6c\u5411\u591a\u7ec4\u4ef6\u76f8\u4e92\u5851\u9020\u7684\u5f00\u653e\u5f0f\u6f14\u5316\uff0c\u5bf9\u6784\u5efa\u66f4\u81ea\u4e3b\u3001\u66f4\u9c81\u68d2\u7684 LLM agent \u7cfb\u7edf\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Self-improving coding agents that iteratively rewrite their own source code have demonstrated impressive performance on coding tasks. However, existing solutions generally derive self-modification from a single failure trajectory at a time, overlooking rich comparative signals available in the agent\u0027s expanding archive of past attempts. According to Mendelian principles of controlled inheritance, we introduce Mendel G\u00f6del Machine (MGM). In addition to the general single-trajectory clonal mutation, MGM includes two new types of self-modification that better utilizes evidences accumulated: the reaction-norm mutation edits an agent based on its trajectories on multiple tasks simultaneously, and the cross-lineage hybridization edits an agent using the trajectory of a reference agent from another lineage on the same task. Under an additive fitness landscape model, we prove theoretically and demonstrate via controlled surrogate simulation that the new strategies facilitate a faster and better convergence over single-trajectory baselines. Experiments on SWE-bench and Polyglot confirm MGM\u0027s consistent improvement in performance, efficiency, and generalizability.", "arxiv_id": "2608.07645", "arxiv_url": "https://arxiv.org/abs/2608.07645", "authors": ["Changzhi Liu", "Yilun Liu", "Sikuan Yan", "Volker Tresp", "Yunpu Ma"], "brief": "\u8bba\u6587\u63d0\u51fa Mendel G\u00f6del Machine\uff08MGM\uff09\uff0c\u4e00\u79cd\u9012\u5f52\u81ea\u6539\u8fdb\u7684\u7f16\u7a0b\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u4e0d\u4ec5\u57fa\u4e8e\u5355\u6b21\u5931\u8d25\u8f68\u8ff9\u505a\u81ea\u4fee\u6539\uff0c\u8fd8\u5229\u7528\u591a\u4efb\u52a1\u8f68\u8ff9\u548c\u8de8\u8c31\u7cfb\u53c2\u8003\u667a\u80fd\u4f53\u8fdb\u884c\u6bd4\u8f83\u5f0f\u4ee3\u7801\u6539\u5199\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/RealLcz/MGM", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.07645", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa reaction-norm mutation\uff1a\u540c\u65f6\u5229\u7528\u667a\u80fd\u4f53\u5728\u591a\u4e2a\u4efb\u52a1\u4e0a\u7684\u8f68\u8ff9\u6765\u7f16\u8f91\u81ea\u8eab\u4ee3\u7801", "\u63d0\u51fa cross-lineage hybridization\uff1a\u501f\u9274\u53e6\u4e00\u8c31\u7cfb\u667a\u80fd\u4f53\u5728\u540c\u4e00\u4efb\u52a1\u4e0a\u7684\u8f68\u8ff9\u8fdb\u884c\u81ea\u4fee\u6539", "\u5728\u52a0\u6027\u9002\u5e94\u5ea6\u666f\u89c2\u4e0b\u7ed9\u51fa\u7406\u8bba\u8bc1\u660e\uff0c\u5e76\u5728 SWE-bench \u4e0e Polyglot \u4e0a\u9a8c\u8bc1\u6027\u80fd\u3001\u6548\u7387\u548c\u6cdb\u5316\u6027\u63d0\u5347"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u81ea\u6539\u8fdb", "\u8fdb\u5316\u7b97\u6cd5"], "num_comments": 3, "on_hf": true, "organization": "Ludwig Maximilian University of Munich", "pdf_url": "https://arxiv.org/pdf/2608.07645v1", "published_at": "2026-08-07", "score": 0.308, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07645.png", "title": "Mendel G\u00f6del Machine: Recursive Self-Improving Coding Agents via Comparative Evolution", "tldr": "\u7528\u6bd4\u8f83\u8fdb\u5316\u63d0\u5347\u81ea\u6539\u5199\u7f16\u7a0b\u667a\u80fd\u4f53", "upvotes": 22, "what_it_is": "\u8bba\u6587\u63d0\u51fa Mendel G\u00f6del Machine\uff08MGM\uff09\uff0c\u4e00\u79cd\u9012\u5f52\u81ea\u6539\u8fdb\u7684\u7f16\u7a0b\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u4e0d\u4ec5\u57fa\u4e8e\u5355\u6b21\u5931\u8d25\u8f68\u8ff9\u505a\u81ea\u4fee\u6539\uff0c\u8fd8\u5229\u7528\u591a\u4efb\u52a1\u8f68\u8ff9\u548c\u8de8\u8c31\u7cfb\u53c2\u8003\u667a\u80fd\u4f53\u8fdb\u884c\u6bd4\u8f83\u5f0f\u4ee3\u7801\u6539\u5199\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u4ece\u5355\u6761\u5931\u8d25\u8f68\u8ff9\u5b66\u4e60\u7684\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\uff0cMGM \u66f4\u5145\u5206\u5229\u7528\u5386\u53f2\u5c1d\u8bd5\u4e2d\u7684\u6bd4\u8f83\u4fe1\u53f7\uff0c\u4e3a\u53ef\u6301\u7eed\u81ea\u8fdb\u5316\u7684\u4ee3\u7801\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u66f4\u5f3a\u7684\u673a\u5236\u4e0e\u5b9e\u8bc1\u652f\u6301\u3002"}, {"abstract": "Real-world data science involves long-horizon workflows that span data wrangling, exploration, modeling, visualization, and validation, and require coordinated use of tools such as notebooks, IDEs, terminals, browsers, and databases within real operating environments. Yet existing benchmarks lack real-computer interaction and do not evaluate whether agents can execute complete end-to-end data-science workflows in realistic computing environments, failing to capture the multi-stage, multi-tool nature of data-science practice. We introduce DSAgentBench, the first benchmark to evaluate whether agents can automate full data-science workflows inside real computer environments. DSAgentBench contains 275 diverse tasks covering the entire data-science life-cycle, reflecting the complexity and tool coordination required in practice. Each task requires grounding decisions in intermediate outputs and coordinated tool use, and includes a deterministic evaluator that verifies analytical correctness, visual outputs, and model performance rather than code-only execution. Our extensive experiments with 15 closed- and open-source models show that even the strongest agent, Claude-4.6-Sonnet, achieves only 56.70% task success, while all open-source agents remain below 1%, frequently failing at tool orchestration, OS grounding, and multi-step reasoning. These results reveal a substantial capability gap between current agentic systems and real data-science workflows, positioning DSAgentBench as a foundation for developing grounded, verifiable, autonomous data-science agents. We release DSAgentBench at https://github.com/vis-nlp/DSAgentBench.", "arxiv_id": "2608.10366", "arxiv_url": "https://arxiv.org/abs/2608.10366", "authors": ["Mizanur Rahman", "Mohammed Saidul Islam", "Ridwan Mahbub", "Md Tahmid Rahman Laskar", "Shafiq Joty", "Enamul Hoque Prince"], "brief": "\u672c\u6587\u63d0\u51fa DSAgentBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u80fd\u5426\u5728\u771f\u5b9e\u64cd\u4f5c\u7cfb\u7edf\u73af\u5883\u4e2d\u81ea\u52a8\u5b8c\u6210\u7aef\u5230\u7aef\u6570\u636e\u79d1\u5b66\u5de5\u4f5c\u6d41\u3002\u57fa\u51c6\u5305\u54 d\u4f53\u80fd\u5426\u5728\u771f\u5b9e\u64cd\u4f5c\u7cfb\u7edf\u73af\u5883\u4e2d\u81ea\u52a8\u5b8c\u6210\u7aef\u5230\u7aef\u6570\u636e\u79d1\u5b66\u5de5\u4f5c\u6d41\u3002\u57fa\u51c6\u5305\u542b 275 \u4e2a\u8986\u76d6\u6570\u636e\u6e05\u6d17\u3001\u63a2\u7d22\u3001\u5efa\u6a21\u3001\u53ef\u89c6\u5316\u4e0e\u9a8c\u8bc1\u7684\u4efb\u52a1\uff0c\u5e76\u7528\u786e\u5b9a\u6027\u8bc4\u4f30\u5668\u68c0\u67e5\u5206\u6790\u6b63\u786e\u6027\u3001\u56fe\u8868\u8f93\u51fa\u548c\u6a21\u578b\u6027\u80fd\u3002", "why_notable": "\u8be5\u57fa\u51c6\u9996\u6b21\u7cfb\u7edf\u8861\u91cf\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u7535\u8111\u73af\u5883\u4e2d\u5b8c\u6210\u590d\u6742\u6570\u636e\u79d1\u5b66\u5de5\u4f5c\u6d41\u7684\u80fd\u529b\uff0c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u5728\u5de5\u5177\u7f16\u6392\u3001\u64cd\u4f5c\u7cfb\u7edf grounding \u548c\u957f\u7a0b\u63a8\u7406\u4e0a\u7684\u663e\u8457\u77ed\u677f\uff0c\u5bf9\u6784\u5efa\u53ef\u9a8c\u8bc1\u7684\u81ea\u4e3b\u6570\u636e\u79d1\u5b66\u667a\u80fd\u4f53\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "We present 360CityArena, a benchmark for evaluating the urban exploration capabilities of embodied agents within a photorealistic environment constructed from 360-degree videos. Existing outdoor benchmarks either lack sufficient photorealism or complexity, resulting in a considerable gap from real-world urban environments. 360CityArena is built on a realistic reconstruction of the Akihabara district in Tokyo, Japan, using 602 360-degree video segments covering 85 streets, and consists of 175 meticulously human-crafted tasks. It encompasses three task categories: Environment Understanding, Path Reasoning, and Spatial Reasoning, covering fundamental abilities required for urban exploration, such as localization, landmark search, path planning, and relational spatial reasoning, thereby enabling comprehensive evaluation in realistic urban scenes. Our evaluation using state-of-the-art LMM-based agents shows that even the strongest model, Gemini 2.5 Flash, performs far below human level (human: 77.3% vs. Gemini 2.5 Flash: 17.1%), revealing substantial challenges that remain in city-scale embodied navigation and reasoning. 360CityArena provides a necessary and challenging testbed for photorealistic urban-district navigation and spatial reasoning.", "arxiv_id": "2608.08814", "arxiv_url": "https://arxiv.org/abs/2608.08814", "authors": ["Kenta Watanabe", "Atsuyuki Miyai", "Mizuki Takenawa", "Kiyoharu Aizawa", "Toshihiko Yamasaki"], "brief": "\u8bba\u6587\u63d0\u51fa 360CityArena\uff0c\u4e00\u4e2a\u57fa\u4e8e\u4e1c\u4eac\u79cb\u53f6\u539f 602 \u6bb5 360 \u5ea6\u89c6\u9891\u91cd\u5efa\u7684\u7167\u7247\u7ea7\u771f\u5b9e\u57ce\u5e02\u5bfc\u822a\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u5305\u542b 175 \u4e2a\u4eba\u5de5\u8bbe\u8ba1\u4efb\u52a1\uff0c\u8bc4\u4f30\u5177\u8eab\u667a\u80fd\u4f53\u5728\u73af\u5883\u7406\u89e3\u3001\u8def\u5f84\u63a8\u7406\u548c\u7a7a\u95f4\u63a8\u7406\u4e2d\u7684\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": "https://github.com/360MM-Team/360CityArena", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2608.08814", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6\u79cb\u53f6\u539f 85 \u6761\u8857\u9053\uff0c\u4f7f\u7528 360 \u5ea6\u89c6\u9891\u6784\u5efa\u66f4\u63a5\u8fd1\u771f\u5b9e\u57ce\u5e02\u73af\u5883\u7684\u865a\u62df\u573a\u666f", "\u4efb\u52a1\u6db5\u76d6\u5b9a\u4f4d\u3001\u5730\u6807\u641c\u7d22\u3001\u8def\u5f84\u89c4\u5212\u3001\u5173\u7cfb\u7a7a\u95f4\u63a8\u7406\u7b49\u57ce\u5e02\u63a2\u7d22\u6838\u5fc3\u80fd\u529b", "\u73b0\u6709 LMM \u667a\u80fd\u4f53\u8868\u73b0\u8fdc\u4f4e\u4e8e\u4eba\u7c7b\uff1aGemini 2.5 Flash \u4ec5 17.1%\uff0c\u4eba\u7c7b\u4e3a 77.3%"], "keywords": ["\u5177\u8eab\u667a\u80fd\u4f53", "\u57ce\u5e02\u5bfc\u822a", "\u591a\u6a21\u6001", "\u7a7a\u95f4\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Hal Lab UTokyo", "pdf_url": "https://arxiv.org/pdf/2608.08814v1", "published_at": "2026-08-09", "score": 0.288, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08814.png", "title": "360CityArena: A Realistic Virtual Urban Navigation Benchmark for Embodied Agents", "tldr": "\u903c\u771f\u57ce\u5e02\u7ea7\u5177\u8eab\u5bfc\u822a\u65b0\u57fa\u51c6", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa 360CityArena\uff0c\u4e00\u4e2a\u57fa\u4e8e\u4e1c\u4eac\u79cb\u53f6\u539f 602 \u6bb5 360 \u5ea6\u89c6\u9891\u91cd\u5efa\u7684\u7167\u7247\u7ea7\u771f\u5b9e\u57ce\u5e02\u5bfc\u822a\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u5305\u542b 175 \u4e2a\u4eba\u5de5\u8bbe\u8ba1\u4efb\u52a1\uff0c\u8bc4\u4f30\u5177\u8eab\u667a\u80fd\u4f53\u5728\u73af\u5883\u7406\u89e3\u3001\u8def\u5f84\u63a8\u7406\u548c\u7a7a\u95f4\u63a8\u7406\u4e2d\u7684\u80fd\u529b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5f25\u8865\u4e86\u73b0\u6709\u6237\u5916\u5bfc\u822a\u8bc4\u6d4b\u5728\u771f\u5b9e\u611f\u548c\u590d\u6742\u5ea6\u4e0a\u7684\u4e0d\u8db3\uff0c\u63ed\u793a\u4e86\u5f53\u524d\u591a\u6a21\u6001\u5177\u8eab\u667a\u80fd\u4f53\u5728\u57ce\u5e02\u7ea7\u5bfc\u822a\u4e0e\u7a7a\u95f4\u63a8\u7406\u4e2d\u7684\u5de8\u5927\u5dee\u8ddd\uff0c\u5bf9\u672a\u6765\u771f\u5b9e\u4e16\u754c\u5bfc\u822a\u667a\u80fd\u4f53\u7814\u7a76\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Turning a research idea into a complete paper requires more than text generation: the system must retrieve literature, design and execute experiments, revise claims according to evidence, produce publication-ready figures, and maintain consistency across a long generation process. We present Spark-to-Paper, an end-to-end research paper generation system implemented as thirteen composable skills inside an existing coding assistant, without requiring a separate agent platform or orchestration service. Spark-to-Paper separates model-based judgment from deterministic operations that can be directly executed and checked. It further separates experiment planning from reporting, so that required evidence is specified before results are observed and manuscript claims are revised according to measured outcomes. To improve reliability over long research trajectories, the system combines deterministic integrity checks with self-critique and bounds a failure mode we call the Self-Refutation Loop, in which repeated experiments continue to reject the original research objective. Spark-to-Paper also produces editable vector figures through programmatic plotting for experimental results and code-based reconstruction for generated method diagrams. Across eight controlled research topics, Spark-to-Paper achieves 99.5% citation validity and 96.4% figure editability. A controlled ablation increases fabrication detection from 14% for a single-pass draft to 92% with the full integrity and review stack, while adversarial review achieves 74% precision. The full system uses 11.9M tokens, costs $8.1 per manuscript, and requires 3.2 hours on average. These results show that end-to-end research paper generation can be implemented as a lightweight, composable workflow inside existing coding assistants while keeping experimental evidence central to how claims are accepted, revised, or abandoned.", "arxiv_id": "2608.11924", "arxiv_url": "https://arxiv.org/abs/2608.11924", "authors": ["Zhuoyang Qian", "Biao Wu", "Yiran Wang", "Chris D Yan", "Desan Dai", "Liangwei Zheng", "Jin Jiang", "Junsheng Zhang", "Wenhao Wang"], "brief": "Spark-to-Paper \u662f\u4e00\u4e2a\u5d4c\u5165\u73b0\u6709\u7f16\u7801\u52a9\u624b\u7684\u7aef\u5230\u7aef\u8bba\u6587\u751f\u6210\u7cfb\u7edf\uff0c\u7528\u5341\u4e09\u4e2a\u53ef\u7ec4\u5408\u6280\u80fd\u5b8c\u6210\u6587\u732e\u68c0\u7d22\u3001\u5b9e\u9a8c\u8bbe\u8ba1\u4e0e\u6267\u884c\u3001\u8bc1\u636e\u9a71\u52a8\u6539\u5199\u3001\u56fe\u8868\u751f\u6210\u548c\u4e00\u81f4\u6027\u68c0\u67e5\u3002\u5b83\u5f3a\u8c03\u5148\u89c4\u5212\u8bc1\u636e\u3001\u518d\u89c2\u5bdf\u7ed3\u679c\uff0c\u5e76\u636e\u5b9e\u63a5\u53d7\u3001\u4fee\u6539\u6216\u653e\u5f03\u8bba\u6587\u4e3b\u5f20\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Spark-To-Paper-Skills/spark-to-paper-skills", "github_stars": 505, "hf_url": "https://huggingface.co/papers/2608.11924", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6a21\u578b\u5224\u65ad\u4e0e\u53ef\u6267\u884c\u3001\u53ef\u68c0\u67e5\u7684\u786e\u5b9a\u6027\u64cd\u4f5c\u5206\u79bb\uff0c\u964d\u4f4e\u957f\u6d41\u7a0b\u751f\u6210\u4e2d\u7684\u5e7b\u89c9\u4e0e\u4e0d\u4e00\u81f4\u3002", "\u63d0\u51fa\u5e76\u7ea6\u675f Self-Refutation Loop\uff1a\u5f53\u5b9e\u9a8c\u6301\u7eed\u5426\u5b9a\u539f\u59cb\u7814\u7a76\u76ee\u6807\u65f6\uff0c\u7cfb\u7edf\u907f\u514d\u65e0\u9650\u91cd\u590d\u8bd5\u9a8c\u3002", "\u57288\u4e2a\u53d7\u63a7\u7814\u7a76\u4e3b\u9898\u4e0a\u8fbe\u523099.5%\u5f15\u7528\u6709\u6548\u6027\u300196.4%\u56fe\u8868\u53ef\u7f16\u8f91\u6027\uff1b\u5b8c\u6574\u5ba1\u67e5\u6808\u5c06\u4f2a\u9020\u68c0\u6d4b\u7387\u4ece14%\u63d0\u5347\u523092%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u7814\u81ea\u52a8\u5316", "\u4ee3\u7801\u751f\u6210", "\u53ef\u9760\u6027\u8bc4\u4f30"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11924v1", "published_at": "2026-08-12", "score": 0.277, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.11924.png", "title": "Spark-to-Paper: End-to-End Research Paper Generation as a Composable Skill", "tldr": "\u5c06\u7814\u7a76\u60f3\u6cd5\u7aef\u5230\u7aef\u751f\u6210\u53ef\u9a8c\u8bc1\u8bba\u6587", "upvotes": 1, "what_it_is": "Spark-to-Paper \u662f\u4e00\u4e2a\u5d4c\u5165\u73b0\u6709\u7f16\u7801\u52a9\u624b\u7684\u7aef\u5230\u7aef\u8bba\u6587\u751f\u6210\u7cfb\u7edf\uff0c\u7528\u5341\u4e09\u4e2a\u53ef\u7ec4\u5408\u62 verse synthetic datasets, stress-testing runtime safety guardrails, and auditing model reliability prior to real-world deployment.", "arxiv_id": "2608.09900", "arxiv_url": "https://arxiv.org/abs/2608.09900", "authors": ["Tadanobu Chuyo Kamijo", "Ori Rottenstreich", "Javier Conde", "Gonzalo Mart\u00ednez", "Pedro Reviriego"], "brief": "\u672c\u6587\u63d0\u51fa Decoding-Level Taboo\uff0c\u4e00\u79cd\u96f6\u63d0\u793a\u8bca\u65ad\u538b\u529b\u6d4b\u8bd5\u65b9\u6cd5\uff0c\u5728\u8fd0\u884c\u65f6\u76f4\u63a5\u5e72\u9884 logit \u7a7a\u95f4\uff0c\u52a8\u6001\u5c4f\u853d\u8bcd\u8fb9\u754c\u5904\u7684\u4e3b\u8981\u5019\u9009 token\uff0c\u8feb\u4f7f\u6a21\u578b\u7ed5\u5f00\u5e38\u89c4\u751f\u6210\u8def\u5f84\u3002\u4f5c\u8005\u7528\u8be5\u65b9\u6cd5\u8bc4\u4f30\u591a\u4e2a\u5f00\u6e90\u6a21\u578b\u5bb6\u65cf\uff0c\u5206\u6790\u6a21\u578b\u5728\u201c\u79bb\u8f68\u201d\u6761\u4ef6\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09900", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4e0d\u4f9d\u8d56\u989d\u5916\u63d0\u793a\u8bcd\uff0c\u800c\u662f\u5728\u89e3\u7801\u9636\u6bb5\u76f4\u63a5\u5c4f\u853d\u9ad8\u6982\u7387\u5019\u9009 token\uff0c\u5236\u9020\u53d7\u7ea6\u675f\u7684\u751f\u6210\u73af\u5883", "\u5b9e\u9a8c\u663e\u793a\u79bb\u8f68\u9c81\u68d2\u6027\u53d7\u53c2\u6570\u89c4\u6a21\u548c\u6307\u4ee4\u5bf9\u9f50\u5f71\u54cd\u8f83\u5927\uff0c\u901a\u5e38\u6a21\u578b\u8d8a\u5927\u3001\u540e\u8bad\u7ec3\u5bf9\u9f50\u8d8a\u5145\u5206\uff0c\u8868\u73b0\u8d8a\u7a33\u5065", "\u53ef\u7528\u4e8e\u751f\u6210\u591a\u6837\u5316\u5408\u6210\u6570\u636e\u3001\u538b\u529b\u6d4b\u8bd5\u8fd0\u884c\u65f6\u5b89\u5168\u62a4\u680f\uff0c\u5e76\u5728\u90e8\u7f72\u524d\u5ba1\u8ba1\u6a21\u578b\u53ef\u9760\u6027"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u9c81\u68d2\u6027\u8bc4\u4f30", "\u89e3\u7801\u7b56\u7565", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09900v2", "published_at": "2026-08-10", "score": 0.249, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09900.png", "title": "Decoding-Level Taboo: A Diagnostic Stress Test for LLM Robustness", "tldr": "\u7528\u89e3\u7801\u7981\u5fcc\u6d4b\u8bd5LLM\u79bb\u8f68\u9c81\u68d2\u6027", "upvotes": 12, "what_it_is": "\u672c\u6587\u63d0\u51fa Decoding-Level Taboo\uff0c\u4e00\u79cd\u96f6\u63d0\u793a\u8bca\u65ad\u538b\u529b\u6d4b\u8bd5\u65b9\u6cd5\uff0c\u5728\u8fd0\u884c\u65f6\u76f4\u63a5\u5e72\u9884 logit \u7a7a\u95f4\uff0c\u52a8\u6001\u5c4f\u853d\u8bcd\u8fb9\u754c\u5904\u7684\u4e3b\u8981\u5019\u9009 token\uff0c\u8feb\u4f7f\u6a21\u578b\u7ed5\u5f00\u5e38\u89c4\u751f\u6210\u8def\u5f84\u3002\u4f5c\u8005\u7528\u8be5\u65b9\u6cd5\u8bc4\u4f30\u591a\u4e2a\u5f00\u6e90\u6a21\u578b\u5bb6\u65cf\uff0c\u5206\u6790\u6a21\u578b\u5728\u201c\u79bb\u8f68\u201d\u6761\u4ef6\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5e38\u89c4\u57fa\u51c6\u53ef\u80fd\u9ad8\u4f30\u6a21\u578b\u771f\u5b9e\u90e8\u7f72\u80fd\u529b\uff0c\u5e76\u63d0\u4f9b\u4e86\u4e00\u79cd\u7b80\u5355\u4f46\u6709\u6548\u7684\u89e3\u7801\u7ea7\u538b\u529b\u6d4b\u8bd5\u539f\u8bed\uff0c\u6709\u52a9\u4e8e\u8bc4\u4f30\u6a21\u578b\u5728\u590d\u6742\u7cfb\u7edf\u63d0\u793a\u3001\u5b89\u5168\u7ea6\u675f\u548c\u7ed3\u6784\u5316\u9650\u5236\u4e0b\u7684\u7a33\u5b9a\u6027\u3002"}, {"abstract": "The dominant paradigm treats AI safety as a property to be instilled during model training via RLHF, DPO, or Constitutional AI. We argue this is structurally insufficient for autonomous agents that execute code, mutate files, send messages, and modify databases. Agent safety should be a runtime contract enforced by the harness, and the contract has two complementary faces. The preventive face blocks dangerous actions before they happen via sandboxes, permission gates, output filters, and trajectory monitors. The evidential face requires verifiable proof that good actions actually happened, gating task submission on hard evidence such as test runs, log captures, file diffs, and citation grounding. We ground the position in four lines of public evidence, with row-level protocols and data released in the supplementary JSON files: a survey of 52 documented AI-agent and LLM safety incidents, a false-completion audit with 31 non-contested core cases plus one disputed illustrative case, a trajectory-schema audit of 12 public agent systems and harnesses, and a title-level audit of all 28,560 papers accepted at NeurIPS, ICML, and ICLR 2023-2025 showing a pooled 8-12x imbalance between training-time and deployment-time publication. Two prior communities that needed to enforce safety, computer security and the experimental sciences, converged on runtime contracts with both preventive and evidential elements; agentic AI is now under the same pressure. We formalize an Agent Trajectory Schema and Evidence Chain, state a compositional gating proposition based on standard monitor composition, and outline a research agenda. The right unit of safety in agentic AI is the trajectory-with-checkable-evidence, not the model.", "arxiv_id": "2608.11274", "arxiv_url": "https://arxiv.org/abs/2608.11274", "authors": ["Albus W. Ng", "Yi Han", "Jusheng Zhang", "Wenhao Wang"], "brief": "\u8bba\u6587\u8ba4\u4e3a\u4ec5\u9760 RLHF\u3001DPO \u6216 Constitutional AI \u7b49\u8bad\u7ec3\u671f\u5bf9\u9f50\u4e0d\u8db3\u4ee5\u4fdd\u969c\u81ea\u4e3b\u667a\u80fd\u4f53\u5b89\u5168\uff0c\u5c24\u5176\u662f\u4f1a\u6267\u884c\u4ee3\u7801\u3001\u6539\u6587\u4ef6\u3001\u53d1\u6d88\u606f\u3001\u6539\u6570\u636e\u5e93\u7684\u7cfb\u7edf\u3002\u4f5c\u8005\u63d0\u51fa\u4ee5\u201c\u8fd0\u884c\u65f6\u5951\u7ea6\u201d\u4e3a\u6838\u5fc3\uff0c\u5c06\u9884\u9632\u6027\u62e6\u622a\u4e0e\u53ef\u9a8c\u8bc1\u8bc1\u636e\u94fe\u7ed3\u5408\uff0c\u5b89\u5168 4ec5\u9760 RLHF\u3001DPO \u6216 Constitutional AI \u7b49\u8bad\u7ec3\u671f\u5bf9\u9f50\u4e0d\u8db3\u4ee5\u4fdd\u969c\u81ea\u4e3b\u667a\u80fd\u4f53\u5b89\u5168\uff0c\u5c24\u5176\u662f\u4f1a\u6267\u884c\u4ee3\u7801\u3001\u6539\u6587\u4ef6\u3001\u53d1\u6d88\u606f\u3001\u6539\u6570\u636e\u5e93\u7684\u7cfb\u7edf\u3002\u4f5c\u8005\u63d0\u51fa\u4ee5\u201c\u8fd0\u884c\u65f6\u5951\u7ea6\u201d\u4e3a\u6838\u5fc3\uff0c\u5c06\u9884\u9632\u6027\u62e6\u622a\u4e0e\u53ef\u9a8c\u8bc1\u8bc1\u636e\u94fe\u7ed3\u5408\uff0c\u5b89\u5168\u8bc4\u4f30\u5355\u4f4d\u5e94\u4ece\u6a21\u578b\u8f6c\u5411\u5e26\u8bc1\u636e\u7684\u6267\u884c\u8f68\u8ff9\u3002", "why_notable": "\u8be5\u6587\u5c06\u667a\u80fd\u4f53\u5b89\u5168\u95ee\u9898\u4ece\u201c\u6a21\u578b\u662f\u5426\u5b89\u5168\u201d\u8f6c\u5411\u201c\u8fd0\u884c\u8fc7\u7a0b\u662f\u5426\u88ab\u7ea6\u675f\u4e14\u53ef\u5ba1\u8ba1\u201d\uff0c\u5f3a\u8c03\u90e8\u7f72\u671f\u6cbb\u7406\u3001\u8bc1\u636e\u95e8\u63a7\u548c\u7cfb\u7edf\u7ea7\u5b89\u5168\u67b6\u6784\uff0c\u5bf9\u4ee3\u7801\u6267\u884c\u578b\u3001GUI \u64cd\u4f5c\u578b\u548c\u4f01\u4e1a\u81ea\u52a8\u5316\u667a\u80fd\u4f53\u5177\u6709\u76f4\u63a5\u5b9e\u8df5\u4ef7\u503c\u3002"}, {"abstract": "Sparse mixture-of-experts (MoE) layers expand recommendation capacity through conditional computation, yet a trained checkpoint still stores and routes over its full expert bank. We study a deployment problem: convert that checkpoint to a smaller standard MoE under an explicit expert budget, without adding a compression-specific online module. To address this, we introduce UniMoMo, a post-training compression framework formulated as a constrained graph coarsening problem. Rather than relying on parameter distance, UniMoMo groups experts based on their functional similarity, using an unlabeled calibration set to measure how similarly experts respond to shared recommendation states. To prevent performance degradation, we introduce a layer-adaptive protection mechanism that restricts the merging of high-traffic experts based on their routing exposure. Across Amazon Beauty, KuaiRec, and TenRec with 2, 4, and 6 MoE blocks, the final four-expert checkpoints obtain source-relative five-run mean NDCG@10 ratios of 99.92%--102.30% and measured A100 speedups of 1.28$\\times$--1.63$\\times$. An aggressive two-expert, top-1 operating point obtains ratios of 98.36%--104.24% and speedups of 1.47$\\times$--2.21$\\times$. These endpoint results evaluate the complete conversion-and-adaptation workflow and show that a trained recommendation MoE can be exported at multiple serving budgets.", "arxiv_id": "2608.08627", "arxiv_url": "https://arxiv.org/abs/2608.08627", "authors": ["Lei Xin", "Bin Gu", "Peize Li", "Zitong Wang", "Jianbo Zhao", "Changjiang Jiang", "Yanyue Xie", "Chao Huang", "Xuyang Zhao", "Zunhai Su", "Fanhu Zeng", "Zhenglun Kong"], "brief": "UniMoMo \u662f\u4e00\u79cd\u9762\u5411\u5927\u578b\u63a8\u8350 MoE \u6a21\u578b\u7684\u540e\u8bad\u7ec3\u538b\u7f29\u6846\u67b6\uff0c\u5c06\u5df2\u6709 checkpoint \u8f6c\u6362\u4e3a\u66f4\u5c0f\u7684\u6807\u51c6 MoE\u3002\u5b83\u628a\u4e13\u5bb6\u5408\u5e76\u5efa\u6a21\u4e3a\u53d7\u7ea6\u675f\u56fe\u7c97\u5316\u95ee\u9898\uff0c\u5728\u4e0d\u5f15\u5165\u989d\u5916\u5728\u7ebf\u538b\u7f29\u6a21\u5757\u7684\u60c5\u51b5\u4e0b\u5b9e\u73b0\u591a\u79cd\u90e8\u7f72\u9884\u7b97\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08627", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4e0d\u6309\u53c2\u6570\u8ddd\u79bb\u5408\u5e76\u4e13\u5bb6\uff0c\u800c\u662f\u7528\u65e0\u6807\u6ce8\u6821\u51c6\u96c6\u8861\u91cf\u4e13\u5bb6\u5bf9\u76f8\u540c\u63a8\u8350\u72b6\u6001\u7684\u54cd\u5e94\u76f8\u4f3c\u6027\uff0c\u5373\u529f\u80fd\u76f8\u4f3c\u6027\u3002", "\u63d0\u51fa\u5c42\u81ea\u9002\u5e94\u4fdd\u62a4\u673a\u5236\uff0c\u6839\u636e\u4e13\u5bb6\u8def\u7531\u66dd\u5149\u5ea6\u9650\u5236\u9ad8\u6d41\u91cf\u4e13\u5bb6\u88ab\u5408\u5e76\uff0c\u964d\u4f4e\u602 \u7ed3\u6784\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Videos captured through glass often contain reflections that degrade visual quality and interfere with downstream vision tasks. Although single-image reflection removal has been extensively studied, video reflection removal remains largely underexplored due to the lack of paired video data, temporally coherent removal models, and dedicated evaluation benchmarks. We present a closed-loop framework that unifies physics-grounded reflection simulation, diffusion-based video dereflection, and benchmark evaluation. Our S2R-Synthesis pipeline generates paired reflected and reflection-free videos by performing physics-grounded augmentation in the structure space and rendering realistic reflected videos with a trained video diffusion renderer; the augmentation models key glass-related effects including roughness-induced blur, thickness-induced ghosting, and reflectance variation. Based on the synthesized data, we introduce S2R-Removal, the first diffusion-based video reflection removal model, which adapts a pretrained video diffusion prior through reflection-aware latent adaptation and one-step pixel-geometric refinement, recovering the clean transmission in a single denoising step. We further build S2R-Bench, the first benchmark for video reflection removal, supporting both full-reference evaluation and real-world human perceptual assessment. Experiments on S2R-Bench and multiple public image benchmarks demonstrate state-of-the-art performance and faster inference than even non-diffusion baselines, and validate the effectiveness of S2R-Synthesis. Project page: https://codingwzp.github.io/VideoDereflection_S2R.", "arxiv_id": "2608.11562", "arxiv_url": "https://arxiv.org/abs/2608.11562", "authors": ["Zepeng Wang", "Jiagao Hu", "Fuhao Li", "Yuxuan Chen", "Fei Wang", "Daiguo Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u4ece\u5408\u6210\u5230\u53bb\u9664\u7684\u95ed\u "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.11562.png", "title": "From Synthesis to Removal: Physics-Grounded Reflection Simulation and Diffusion-Based Video Dereflection", "tldr": "\u7269\u7406\u4eff\u771f\u6570\u636e\u9a71\u52a8\u6269\u6563\u5f0f\u89c6\u9891\u53bb\u53cd\u5c04\u3002", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u4ece\u5408\u6210\u5230\u53bb\u9664\u7684\u95ed\u73af\u6846\u67b6 S2R\uff0c\u8986\u76d6\u7269\u7406\u7ea6\u675f\u7684\u89c6\u9891\u53cd\u5c04\u5408\u6210\u3001\u6269\u6563\u6a21\u578b\u89c6\u9891\u53bb\u53cd\u5c04\u4e0e\u57fa\u51c6\u8bc4\u6d4b\u3002\u5b83\u6784\u5efa\u4e86\u6210\u5bf9\u53cd\u5c04/\u65e0\u53cd\u5c04\u89c6\u9891\u6570\u636e\uff0c\u8bad\u7ec3\u9996\u4e2a\u57fa\u4e8e\u6269\u6563\u7684\u89c6\u9891\u53bb\u53cd\u5c04\u6a21\u578b\uff0c\u5e76\u53d1\u5e03\u4e13\u7528\u8bc4\u6d4b\u57fa\u51c6 S2R-Bench\u3002", "why_notable": "\u89c6\u9891\u53bb\u53cd\u5c04\u957f\u671f\u53d7\u9650\u4e8e\u7f3a\u4e4f\u6210\u5bf9\u6570\u636e\u3001\u65f6\u5e8f\u4e00\u81f4\u6a21\u578b\u548c\u4e13\u7528\u57fa\u51c6\uff1b\u8be5\u5de5\u4f5c\u540c\u65f6\u8865\u9f50\u6570\u636e\u5408\u6210\u3001\u6a21\u578b\u8bbe\u8ba1\u4e0e\u8bc4\u6d4b\u4f53\u7cfb\uff0c\u5e76\u5c55\u793a\u6269\u6563\u5148\u9a8c\u53ef\u5728\u9ad8\u6548\u5355\u6b65\u63a8\u7406\u4e0b\u7528\u4e8e\u771f\u5b9e\u89c6\u9891\u590d\u539f\u3002"}, {"abstract": "Query-based mask transformers assemble segmentation outputs through pixel-wise competition among query predictions of the final layer, yet this inference process is not explicitly optimized during training. We identify two key mismatches: the query with the highest probability-mask score does not necessarily produce the most accurate mask, and final-layer decoding may discard superior predictions from intermediate layers. To address these issues, we propose Inference-Aware Learning (iFAN), a general training framework for plain mask transformers. iFAN introduces Adjusted Probability-Mask Ranking (APMR), which aligns query competition with predicted mask quality and suppresses high-confidence but inaccurate competitors. We further employ Cross-Layer Self-Distillation (CLSD) to transfer stronger intermediate predictions to the final layer. The ranking and distillation objectives are training-only, while inference retains efficient final-layer decoding. Experiments on COCO, ADE20K, and Cityscapes demonstrate consistent improvements across panoptic, instance, and semantic segmentation, as well as across different architectures, backbone scales, and input resolutions. Overall, iFAN improves performance by an average of 1.20 PQ, 1.30 AP, and 0.63 mIoU, with negligible additional parameters, FLOPs and inference latency.", "arxiv_id": "2608.03216", "arxiv_url": "https://arxiv.org/abs/2608.03216", "authors": ["Fang Li", "Yu He", "Haoyang Tong", "Lichen Ma", "Jingling Fu", "Wenxiao Fan", "Tongxuan Liu", "Luohang Liu", "Ke Zhang", "Junshi Huang"], "brief": "\u672c\u6587\u63d0\u51fa iFAN\uff0c\u4e00\u79cd\u9762\u5411\u666e\u901a query-based mask transformers \u7684\u63a8\u7406\u611f\u77e5\u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u5728\u8bad\u7ec3\u9636\u6bb5\u663e\u5f0f\u4f18\u5316\u6700\u7ec8\u63a8\u7406\u65f6\u7684\u50cf\u7d20\u7ea7 query \u7ade\u4e89\uff0c\u5e76\u5229\u7528\u4e2d\u95f4\u5c42\u66f4\u4f18\u9884\u6d4b\u6307\u5bfc\u6700\u7ec8\u5c42\u8f93\u51fa\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03216", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa Adjusted Probability-Mask Ranking\uff08APMR\uff09\uff0c\u4f7f query \u7684\u6982\u7387-\u63a9\u7801\u6392\u5e8f\u66f4\u7b26\u5408\u771f\u5b9e\u63a9\u7801\u8d28\u91cf\uff0c\u6291\u5236\u9ad8\u7f6e\u4fe1\u4f46\u4e0d\u51c6\u786e\u7684\u7ade\u4e89\u8005\u3002", "\u5f15\u5165 Cross-Layer Self-Distillation\uff08CLSD\uff09\uff0c\u5c06\u4e2d\u95f4\u5c42\u4e2d\u66f4\u5f3a\u7684\u5206\u5272\u9884\u6d4b\u84b8\u998f\u5230\u6700\u7ec8\u5c42\uff0c\u7f13\u89e3\u6700\u7ec8\u5c42\u89e3\u7801\u4e22\u5931\u4f18\u8d28\u9884\u6d4b\u7684\u95ee\u9898\u3002", "\u5728 COCO\u3001ADE20K\u3001Cityscapes \u4e0a\u8986\u76d6\u5168\u666f\u3001\u5b9e\u4f8b\u3001\u8bed\u4e49\u5206\u5272\u5747\u6709\u63d0\u5347\uff0c\u5e73\u5747\u63d0\u5347 1.20 PQ\u30011.30 AP\u30010.63 mIoU\uff0c\u51e0\u4e4e\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u3002"], "keywords": ["\u56fe\u50cf\u5206\u5272", "Transformer", "\u77e5\u8bc6\u84b8\u998f", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03216v2", "published_at": "2026-08-04", "score": 0.239, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03216.png", "title": "iFAN: Inference-Aware Learning for Plain Mask Transformers", "tldr": "\u8ba9\u63a9\u7801Transformer\u8bad\u7ec3\u66f4\u8d34\u8fd1\u63a8\u7406\u7ade\u4e89\u673a\u5236\u3002", "upvotes": 8, "what_it_is": "\u672c\u6587\u63d0\u51fa iFAN\uff0c\u4e00\u79cd\u9762\u5411\u666e\u901a query-based mask transformers \u7684\u63a8\u7406\u611f\u77e5\u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u5728\u8bad\u7ec3\u9636\u6bb5\u663e\u5f0f\u4f18\u5316\u6700\u7ec8\u63a8\u7406\u65f6\u7684\u50cf\u7d20\u7ea7 query \u7ade\u4e89\uff0c\u5e76\u5229\u7528\u4e2d\u95f4\u5c42\u66f4\u4f18\u9884\u6d4b\u6307\u5bfc\u6700\u7ec8\u5c42\u8f93\u51fa\u3002", "why_notable": "iFAN \u9488\u5bf9 mask transformer \u8bad\u7ec3\u4e0e\u63a8\u7406\u4e0d\u4e00\u81f4\u8fd9\u4e00\u5e38\u89c1\u4f46\u5173\u952e\u7684\u95ee\u9898\u7ed9\u51fa\u901a\u7528\u89e3\u6cd5\uff0c\u53ea\u5728\u8bad\u7ec3\u9636\u6bb5\u589e\u52a0\u6392\u5e8f\u4e0e\u84b8\u998f\u76ee\u6807\uff0c\u63a8\u7406\u4ecd\u4fdd\u6301\u9ad8\u6548\uff0c\u56e0\u800c\u5177\u5907\u8f83\u5f3a\u7684\u5b9e\u7528\u6027\u548c\u53ef\u8fc1\u79fb\u6027\u3002"}, {"abstract": "The Large Language Model from Power Law Decoder Representations (PLDR-LLM) and its attention, Power Law Graph Attention (PLGA), replace the fixed bilinear form of scaled dot-product attention (SDPA) with a learned, input-generated bilinear operator $G_{LM}$, built from a positive tensor $A_{LM}$ by elementwise power laws. The architecture is fully specified, verified against pinned reference releases; claims are labeled theorem, conditional theorem, measurement, or conjecture. Unconditionally: PLGA contains SDPA exactly at $G_{LM}=I$; $A_{LM}$ and $A_P$ are strictly entrywise positive, with Perron-Frobenius structure on $A_{LM}$; the DAG regularizer has the NOTEARS walk-counting form and positivity obstructs exact acyclicity; and, under nonresonance (satisfied by standard rotary frequencies), a commutant criterion identifies which operators preserve relative-position dependence. An inference-collapse theorem: exact input invariance of deductive outputs collapses inference to generalized SDPA with a constant operator. Measured invariance: relative fluctuations of $10^{-6}$ and below; perturbation bounds quantify but do not certify cached inference; the assembled proxy misses the decoding margin. A conditional three-stage mechanism (rotary twirl, concentration, row-map contraction) is measured on a released checkpoint. Blockwise training and scoring under the global Gram are stated with explicit target exposure; on tested samples, block and sequential scoring select identical answers and agree on the published TruthfulQA probability-mass metric within $5\\times 10^{-5}$ per item. Self-organized criticality enters as a phenomenological framework with an intrinsic order parameter; open claims become falsifiable conjectures. Selected proof cores are machine-checked in Lean 4.", "arxiv_id": "2608.10288", "arxiv_url": "https://arxiv.org/abs/2608.10288", "authors": ["Burc Gokden"], "brief": "\u8bba\u6587\u63d0\u51faPLDR-LLM\u53ca\u5176Power Law Graph Attention\uff0c\u7528\u8f93\u5165\u751f\u6210\u7684\u53ef\u5b66\u4e60\u53cc\u7ebf\u6027\u7b97\u5b50\u66ff\u4ee3\u6807\u51c6\u6ce8\u610f\u529b\u7684\u56fa\u5b9a\u70b9\u79ef\u5f62\u5f0f\u3002\u4f5c\u8005\u7ed9\u51fa\u5f62\u5f0f\u5316\u5b9a\u7406\u3001\u5b9e\u6d4b\u73b0\u8c61\u4e0eLean 4\u9a8c\u8bc1\uff0c\u8bc1\u660e\u5176\u5305\u542bSDPA\u5e76\u5206\u6790\u63a8\u7406\u65f6\u7b97\u5b50\u8fd1\u4f3c\u574d\u7f29\u4e3a\u5e38\u91cf\u7684\u6761\u4ef6\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/burcgokden/PLDR-LLM-Math-Foundations", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.10288", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["PLGA\u5728\u7b97\u5b50\u4e3a\u6052\u7b49\u77e9\u9635\u65f6\u4e25\u683c\u9000\u5316\u4e3ascaled dot-product attention\uff0c\u662fSDPA\u7684\u7cbe\u786e\u6cdb\u5316\u3002", "\u8bc1\u660e\u6b63\u5f20\u91cf\u7ed3\u6784\u5e26\u6765Perron-Frobenius\u6027\u8d28\uff0c\u5e76\u5206\u6790NOTEARS\u5f0fDAG\u6b63\u5219\u4e0e\u7cbe\u786e\u65e0\u73af\u6027\u7684\u51b2\u7a81\u3002", "\u63d0\u51fa\u63a8\u7406\u574d\u7f29\u5b9a\u7406\u4e0e\u5b9e\u6d4b\u8bc1\u636e\uff1a\u63a8\u7406\u4e2d\u76f8\u5bf9\u6ce2\u52a8\u53ef\u4f4e\u81f310^-6\uff0c\u4e14\u5757\u5f0f\u4e0e\u987a\u5e8f\u8bc4\u5206\u5728TruthfulQA\u4e0a\u51e0\u4e4e\u4e00\u81f4\u3002"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7406\u8bba\u5206\u6790", "\u5f62\u5f0f\u5316\u9a8c\u8bc1"], "num_comments": 2, "on_hf": true, "organization": "Fromthesky Research Labs", "pdf_url": "https://arxiv.org/pdf/2608.10288v1", "published_at": "2026-08-10", "score": 0.233, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.10288.png", "title": "Power law graph attention: exact generalization of scaled dot-product attention, empirical collapse at inference", "tldr": "PLGA\u7cbe\u786e\u63a8\u5e7fSDPA\u5e76\u63ed\u793a\u63a8\u7406\u574d\u7f29\u73b0\u8c61", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51faPLDR-LLM\u53ca\u5176Power Law Graph Attention\uff0c\u7528\u8f93\u5165\u751f\u6210\u7684\u53ef\u5b66\u4e60\u53cc\u7ebf\u6027\u7b97\u5b50\u66ff\u4ee3\u6807\u51c6\u6ce8\u610f\u529b\u7684\u56fa\u5b9a\u70b9\u79ef\u5f62\u5f0f\u3002\u4f5c\u8005\u7ed9\u51fa\u5f62\u5f0f\u5316\u5b9a\u7406\u3001\u5b9e\u6d4b\u73b0\u8c61\u4e0eLean 4\u9a8c\u8bc1\uff0c\u8bc1\u660e\u5176\u5305\u542bSDPA\u5e76\u5206\u6790\u63a8\u7406\u65f6\u7b97\u5b50\u8fd1\u4f3c\u574d\u7f29\u4e3a\u5e38\u91cf\u7684\u6761\u4ef6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bd5\u56fe\u4e3a\u65b0\u578b\u6ce8\u610f\u529b\u673a\u5236\u63d0\u4f9b\u4e25\u683c\u6570\u5b66\u523b\u753b\u4e0e\u53ef\u590d\u73b0\u5b9e\u8bc1\uff0c\u8fde\u63a5\u56fe\u7ed3\u6784\u3001\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801\u3001\u63a8\u7406\u7f13\u5b58\u548c\u5f62\u5f0f\u5316\u9a8c\u8bc1\uff1b\u82e5\u6210\u7acb\uff0c\u53ef\u4e3a\u8d85\u8d8a\u6807\u51c6Transformer\u6ce8\u610f\u529b\u7684\u67b6\u6784\u8bbe\u8ba1\u63d0\u4f9b\u7406\u8bba\u4f9d\u636e\u3002"}, {"abstract": "Previsualization is an intermediate layer between ideas and production in film, games, architecture, and urban design. It lets creators iteratively refine scenes, actions, cameras, and spatial-temporal dynamics. Yet existing generative methods rely on simple prompts to jointly control all of these factors through one-shot image or video synthesis, offering weak controllability and limited support for iterative editing. Fundamentally, a world comprises multiple elements with geometry, appearance, and other attributes, together with cameras. Different frames are produced through local modifications or recombinations of this shared state, which is otherwise largely reused. Therefore, we argue that the missing component is an explicit and persistent working state. To address this, we present StateFlow, a state-centric framework for generative previsualization. Rather than generating videos in one shot, StateFlow uses an editable 3D world to organize scene structure, evolution, and cameras, while off-the-shelf video models enhance visual quality when higher fidelity is desired. This world is maintained as a persistent structured 3D state of scene elements and camera configurations, serving as the core working representation for previsualization. Built on this insight, StateFlow has three stages to construct, evolve, and access the world state. State construction lifts generated 2D content into a coherent 3D world through prior-guided, conflict-aware dual-view initialization, while State evolution translates user intent into structured state transitions while preserving world memory, avoiding full-scene regeneration for each edit. State access uses render-feedback reflection to refine camera plans into visually feasible trajectories, avoiding reliance on VLM semantics alone. Experiments show that StateFlow produces high-quality 3D worlds for video creation and game-like prototyping.", "arxiv_id": "2608.12314", "arxiv_url": "https://arxiv.org/abs/2608.12314", "authors": ["Yuyang Yin", "Zixiang Li", "Longxuan Deng", "Hongkai Li", "Shifang Zhao", "Junnan Liu", "Weirong Huang", "Mengyu Wang", "Tianxiao Fu", "Yikai Wang", "Peng-Shuai Wang", "Xiaojie Jin", "Yao Zhao", "Yunchao Wei"], "brief": "StateFlow \u63d0\u51fa\u4e00\u79cd\u4ee5\u663e\u5f0f\u3001\u53ef\u7f16\u8f91\u76843D\u4e16\u754c\u72b6\u6001\u4e3a\u6838\u5fc3\u7684\u751f\u6210\u5f0f\u9884\u6f14\u6846\u67b6\uff0c\u7528\u4e8e\u7535\u5f71\u3001\u6e38\u620f\u3001\u5efa\u7b51\u7b49\u573a\u666f\u7684\u955c\u5934\u4e0e\u52a8\u6001\u8bbe\u8ba1\u3002\u5b83\u4e0d\u518d\u4e00\u6b21\u6027\u751f\u6210\u89c6\u9891\uff0c\u800c\u662f\u5148\u6784\u5efa\u3001\u518d\u6f14\u5316\u3001\u518d\u8bbf\u95ee\u5171\u4eab\u76843D\u573a\u666f\u4e0e\u76f8\u673a\u72b6\u6001\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12314", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u5148\u9a8c\u5f15\u5bfc\u3001\u51b2\u7a81\u611f\u77e5\u7684\u53cc\u89c6\u89d2\u521d\u59cb\u5316\uff0c\u5c06\u751f\u6210\u76842D\u5185\u5bb9\u63d0\u5347\u4e3a\u4e00\u81f4\u76843D\u4e16\u754c\u72b6\u6001", "\u5c06\u7528\u6237\u610f\u56fe\u8f6c\u5316\u4e3a\u7ed3\u6784\u5316\u72b6\u6001\u8f6c\u79fb\uff0c\u5728\u4fdd\u7559\u4e16\u754c\u8bb0\u5fc6\u7684\u540c\u65f6\u652f\u6301\u5c40\u90e8\u7f16\u8f91\uff0c\u907f\u514d\u6bcf\u6b21\u5168\u573a\u666f\u91cd\u751f\u6210", "\u5229\u7528\u6e32\u67d3\u53cd\u9988\u53cd\u601d\u4f18\u5316\u76f8\u673a\u89c4\u5212\uff0c\u751f\u6210\u89c6\u89c9\u4e0a\u53ef\u884c\u7684\u76f8\u673a\u8f68\u8ff9\uff0c\u5e76\u53ef\u7ed3\u5408\u73b0\u6210\u89c6\u9891\u6a21\u578b\u63d0\u5347\u753b\u8d28"], "keywords": ["3D\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u53ef\u63a7\u751f\u6210"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12314v1", "published_at": "2026-08-12", "score": 0.226, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12314.png", "title": "StateFlow: Building, Evolving, and Accessing 3D World States for Previsualization", "tldr": "\u7528\u6301\u4e453D\u4e16\u754c\u72b6\u6001\u5b9e\u73b0\u53ef\u8fed\u4ee3\u9884\u6f14\u751f\u6210", "upvotes": 6, "what_it_is": "StateFlow \u63d0\u51fa\u4e00\u79cd\u4ee5\u663e\u5f0f\u3001\u53ef\u7f16\u8f91\u76843D\u4e16\u754c\u72b6\u6001\u4e3a\u6838\u5fc3\u7684\u751f\u6210\u5f0f\u9884\u6f14\u6846\u67b6\uff0c\u7528\u4e8e\u7535\u5f71\u3001\u6e38\u620f\u3001\u5efa\u7b51\u7b49\u573a\u666f\u7684\u955c\u5934\u4e0e\u52a8\u6001\u8bbe\u8ba1\u3002\u5b83\u4e0d\u518d\u4e00\u6b21\u6027\u751f\u6210\u89c6\u9891\uff0c\u800c\u662f\u5148\u6784\u5efa\u3001\u518d\u6f14\u5316\u3001\u518d\u8bbf\u95ee\u5171\u4eab\u76843D\u573a\u666f\u4e0e\u76f8\u673a\u72b6\u6001\u3002", "why_notable": "\u8bba\u6587\u6293\u4f4f\u751f\u6210\u5f0f\u9884\u6f14\u7f3a\u5c11\u201c\u6301\u4e45\u5de5\u4f5c\u72b6\u6001\u201d\u7684\u6838\u5fc3\u75db\u70b9\uff0c\u5c06\u89c6\u9891\u751f\u6210\u4ece\u4e00\u6b21\u6027 prompt \u63a7\u5236\u8f6c\u5411\u53ef\u7f16\u8f91\u3001\u53ef\u590d\u7528\u76843D\u72b6\u6001\u7ba1\u7406\uff0c\u63d0\u5347\u4e86\u573a\u666f\u8fed\u4ee3\u3001\u955c\u5934\u8bbe\u8ba1\u548c\u6e38\u620f\u5f0f\u539f\u578b\u5236\u4f5c\u7684\u53ef\u63a7\u6027\u4e0e\u5b9e\u7528\u6027\u3002"}, {"abstract": "Tool-using LLM agents are commonly trained and evaluated in environments where tool calls succeed reliably, yet deployed tools can fail transiently, persistently, or silently. Robust recovery therefore requires more than repeated retries: an agent may need to retry the same path, switch to an alternative, or recognize that no viable path remains. We present BENCH2ROBUST, a framework that converts failure-free tool-use benchmarks into controlled stochastic environments with scenario-controlled solvability, where episodes explicitly require retrying, switching, or stopping after available paths are exhausted. We use BENCH2ROBUST to study two complementary interventions: structured runtime recovery context through Bayesian Tool Memory (BTM), and curriculum-controlled reinforcement learning. Across 7 models from 4 families and two multi-turn benchmark families, tool failures produce a near-universal robustness gap. On held-out Retail tasks, BTM improves robustness by up to 16.8 percentage points without retraining, while RL learns complementary recovery behavior that remains beneficial without inference-time BTM. Combining the two reaches 40.8-45.5% under injection while preserving failure-free performance. These results suggest that robust tool use benefits from combining environment-specific recovery knowledge with learned recovery behavior.", "arxiv_id": "2608.11977", "arxiv_url": "https://arxiv.org/abs/2608.11977", "authors": ["Chaoran Chen", "Vy Nguyen", "Ziji Zhang", "Abhinav Gullapalli", "Ziyi Wang", "Yuxuan Lu", "Dakuo Wang", "Jing Huang", "Zhou Yu", "Jin Lai"], "brief": "\u8bba\u6587\u63d0\u51fa BENCH2ROBUST\uff0c\u5c06\u539f\u672c\u65e0\u6545\u969c\u7684\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u8f6c\u6362\u4e3a\u53ef\u63a7\u968f\u673a\u6545\u969c\u73af\u5883\uff0c\u663e\u5f0f\u8003\u5bdf\u667a\u80fd\u4f53\u5728\u5de5\u5177\u5931\u8d25\u65f6\u5e94\u91cd\u8bd5\u3001\u5207\u6362\u66ff\u4ee3\u8def\u5f84\u6216\u505c\u6b62\u3002\u5e76\u7814\u7a76 Bayesian Tool Memory \u4e0e\u8bfe\u7a0b\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e24\u7c7b\u5e72\u9884\u5bf9\u9c81\u68d2\u5de5\u5177\u4f7f\u7528\u7684\u63d0\u5347\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11977", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u9020\u5177\u6709\u573a\u666f\u53ef\u63a7\u53ef\u89e3\u6027\u7684\u6545\u969c\u6ce8\u5165\u73af\u5883\uff0c\u8986\u76d6\u77ac\u65f6\u5931\u8d25\u3001\u6301\u7eed\u5931\u8d25\u4e0e\u9690\u6027\u5931\u8d25\u7b49\u5de5\u5177\u8c03\u7528\u5f02\u5e38\u3002", "Bayesian Tool Memory \u5728\u65e0\u9700\u91cd\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\uff0c\u4e3a\u8fd0\u884c\u65f6\u63d0\u4f9b\u7ed3\u6784\u5316\u6062\u590d\u4e0a\u4e0b\u6587\uff0c\u5728\u4fdd\u7559 Retail \u4efb\u52a1\u4e0a\u6700\u9ad8\u63d0\u5347 16.8 \u4e2a\u767e\u5206\u70b9\u3002", "\u8bfe\u7a0b\u5f0f\u5f3a\u5316\u5b66\u4e60\u80fd\u5b66\u5230\u4e92\u8865\u7684\u6062\u590d\u7b56\u7565\uff0c\u5373\u4f7f\u63a8\u7406\u65f6\u4e0d\u4f7f\u7528 BTM \u4e5f\u4ecd\u6709\u6536\u76ca\uff1b\u4e8c\u8005\u7ed3\u5408\u5728\u6545\u969c\u6ce8\u5165\u4e0b\u8fbe\u5230 40.8%\u201345.5% \u8868\u73b0\uff0c\u5e76\u4fdd\u6301\u65e0\u6545\u969c\u6027\u80fd\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11977v1", "published_at": "2026-08-12", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Retry, Switch, or Abstain? Learning Strategy-Aware Tool-Use Policies via Controlled Error Injection", "tldr": "\u8ba9\u5de5\u5177\u578b\u667a\u80fd\u4f53\u5b66\u4f1a\u91cd\u8bd5\u3001\u5207\u6362\u6216\u653e\u5f03", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BENCH2ROBUST\uff0c\u5c06\u539f\u672c\u65e0\u6545\u969c\u7684\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u8f6c\u6362\u4e3a\u53ef\u63a7\u968f\u673a\u6545\u969c\u73af\u5883\uff0c\u663e\u5f0f\u8003\u5bdf\u667a\u80fd\u4f53\u5728\u5de5\u5177\u5931\u8d25\u65f6\u5e94\u91cd\u8bd5\u3001\u5207\u6362\u66ff\u4ee3\u8def\u5f84\u6216\u505c\u6b62\u3002\u5e76\u7814\u7a76 Bayesian Tool Memory \u4e0e\u8bfe\u7a0b\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e24\u7c7b\u5e72\u9884\u5bf9\u9c81\u68d2\u5de5\u5177\u4f7f\u7528\u7684\u63d0\u5347\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u6307\u771f\u5b9e\u90e8\u7f72\u4e2d\u5de5\u5177\u8c03\u7528\u4e0d\u53ef\u9760\u7684\u95ee\u9898\uff0c\u4ece\u57fa\u51c6\u6784\u9020\u3001\u8fd0\u884c\u65f6\u8bb0\u5fc6\u5230\u5f3a\u5316\u5b66\u4e60\u7b56\u7565\u4e09\u65b9\u9762\u7cfb\u7edf\u63d0\u5347 LLM \u5de5\u5177\u667a\u80fd\u4f53\u9c81\u68d2\u6027\uff0c\u5bf9\u843d\u5730\u578b agent \u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Governments increasingly fund indigenous foundation models to strengthen national AI capability, digital sovereignty, and multilingual computing. Assessing the progress of such national ecosystems is complicated by inconsistent benchmark reporting, proprietary evaluation methodologies, and rapidly evolving model releases. This paper presents a structured, benchmark-based comparative assessment of publicly benchmarked Indian foundation models against global frontier and comparable-scale models, across eight capability domains: general-purpose reasoning, coding and software engineering, agentic AI and computer use, cybersecurity, vision and image understanding, video and multimodal understanding, scientific research, and Indic language capability. Using only publicly reported benchmark results, we find that Indian models achieve strong scores on established benchmarks such as MMLU and MATH-500. However, these benchmarks are now widely regarded as saturated, and frontier developers no longer report them. Indian models participate far less frequently in newer, agentic, and domain-specialized evaluations. Benchmark participation is also highly uneven across Indian organizations. Among the models surveyed, Sarvam AI reports the broadest benchmark coverage by a substantial margin. We propose an exploratory four-dimension Benchmark Maturity Index (BMI), scoring each capability domain on standardization, participation, independent verification, and national coverage. We show that the BMI refines, and in some cases revises, the maturity judgments that a purely descriptive review would produce. We argue that many apparent capability gaps in the public record cannot be distinguished, on available evidence, from evaluation-ecosystem gaps. This has direct implications for how national AI programs should design monitoring and funding criteria.", "arxiv_id": "2608.11891", "arxiv_url": "https://arxiv.org/abs/2608.11891", "authors": ["Avinash Agarwal", "Vridhi Jain"], "brief": "\u672c\u6587\u57fa\u4e8e\u516c\u5f00\u57fa\u51c6\u7ed3\u679c\uff0c\u5bf9\u5370\u5ea6\u672c\u571f\u57fa\u7840\u6a21\u578b\u4e0e\u5168\u7403\u524d\u6cbf\u53ca\u540c\u89c4\u6a21\u6a21\u578b\u8fdb\u884c\u6a2a\u5411\u6bd4\u8f83\uff0c\u8986\u76d6\u63a8\u7406\u3001\u4ee3\u7801\u3001\u667a\u80fd\u4f53\u3001\u7f51\u7edc\u5b89\u5168\u3001\u591a\u6a21\u6001\u3001\u79d1\u7814\u548c\u5370\u5ea6\u8bed\u80fd\u529b\u7b49\u516b\u7c7b\u9886\u57df\u3002\u8bba\u6587\u63d0\u51fa\u63a2\u7d22\u6027\u7684 Benchmark Maturity Index\uff0c\u7528\u4e8e\u8861\u91cf\u5404\u9886\u57df\u8bc4\u6d4b\u751f\u6001\u7684\u6210\u719f\u5ea6\u3002", "categories": ["cs.CY", "cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11891", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u5370\u5ea6\u6a21\u578b\u5728 MMLU\u3001MATH-500 \u7b49\u4f20\u7edf\u57fa\u51c6\u4e0a\u8868\u73b0\u8f83\u5f3a\uff0c\u4f46\u8fd9\u4e9b\u57fa\u51c6\u5df2\u8d8b\u4e8e\u9971\u548c\uff0c\u524d\u6cbf\u6a21\u578b\u8f83\u5c11\u7ee7\u7eed\u62a5\u544a", "\u5370\u5ea6\u6a21\u578b\u5728\u65b0\u578b\u667a\u80fd\u4f53\u3001\u9886\u57df\u4e13\u7528\u548c\u72ec\u7acb\u9a8c\u8bc1\u57fa\u51c6\u4e2d\u7684\u53c2\u4e0e\u5ea6\u660e\u663e\u4e0d\u8db3\uff0c\u4e14\u4e0d\u540c\u673a\u6784\u4e4b\u95f4\u8986\u76d6\u6781\u4e0d\u5747\u8861", "\u63d0\u51fa\u56db\u7ef4 BMI \u6307\u6807\uff1a\u6807\u51c6\u5316\u7a0b\u5ea6\u3001\u53c2\u4e0e\u5ea6\u3001\u72ec\u7acb\u9a8c\u8bc1\u548c\u56fd\u5bb6\u8986\u76d6\u5ea6\uff0c\u7528\u4e8e\u533a\u5206\u771f\u5b9e\u80fd\u529b\u5dee\u8ddd\u4e0e\u8bc4\u6d4b\u751f\u6001\u7f3a\u53e3"], "keywords": ["\u57fa\u7840\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b", "\u56fd\u5bb6AI", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11891v1", "published_at": "2026-08-12", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Benchmark-Based Comparative Assessment of Publicly Benchmarked Indian Foundation Models: A Capability and Evaluation-Maturity Framework", "tldr": "\u8bc4\u4f30\u5370\u5ea6\u57fa\u7840\u6a21\u578b\u80fd\u529b\u4e0e\u57fa\u51c6\u6210\u719f\u5ea6", "upvotes": 0, "what_it_is": "\u672c\u6587\u57fa\u4e8e\u516c\u5f00\u57fa\u51c6\u7ed3\u679c\uff0c\u5bf9\u5370\u5ea6\u672c\u571f\u57fa\u7840\u6a21\u578b\u4e0e\u5168\u7403\u524d\u6cbf\u53ca\u540c\u89c4\u6a21\u6a21\u578b\u8fdb\u884c\u6a2a\u5411\u6bd4\u8f83\uff0c\u8986\u76d6\u63a8\u7406\u3001\u4ee3\u7801\u3001\u667a\u80fd\u4f53\u3001\u7f51\u7edc\u5b89\u5168\u3001\u591a\u6a21\u6001\u3001\u79d1\u7814\u548c\u5370\u5ea6\u8bed\u80fd\u529b\u7b49\u516b\u7c7b\u9886\u57df\u3002\u8bba\u6587\u63d0\u51fa\u63a2\u7d22\u6027\u7684 Benchmark Maturity Index\uff0c\u7528\u4e8e\u8861\u91cf\u5404\u9886\u57df\u8bc4\u6d4b\u751f\u6001\u7684\u6210\u719f\u5ea6\u3002", "why_notable": "\u8be5\u7814\u7a76\u5c06\u56fd\u5bb6\u7ea7\u57fa\u7840\u6a21\u578b\u8bc4\u4f30\u4ece\u5355\u7eaf\u770b\u5206\u6570\u63a8\u8fdb\u5230\u8bc4\u6d4b\u751f\u6001\u6210\u719f\u5ea6\u5206\u6790\uff0c\u5bf9\u653f\u5e9c\u5236\u5b9a AI \u6295\u8d44\u3001\u76d1\u7ba1\u548c\u80fd\u529b\u76d1\u6d4b\u6807\u51c6\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Agent skills are the de facto mechanism for extending LLM agents with reusable guidance. A skill can shape the agent\u0027s task execution, including planning, tool use, problem-solving, and validation. Prior work reported mixed results of agent skills: some skills improve task success rates, while others have no effect, increase token use and execution time, and even reduce success rates. This paper presents a comprehensive analysis of skill-induced agent failures by attributing task failures and cost regressions to specific loaded skills. We introduce a differential analysis framework that attributes a failure or regression to a skill by comparing a target skill-guided run against a no-skill or semantically matched skill reference run that solves the same task, or solves it more cheaply. We instantiate this framework on SkillsBench and SWE-Skills-Bench, yielding 307 skill-induced failures, including 125 functional failures and 182 efficiency regressions. We also build SkillTriage, a taxonomy-guided attribution tool that normalizes paired cases, extracts differential evidence, and produces triage reports. Our major findings include: (1) Skill induced functional failures are rarely caused by obviously irrelevant skills; instead, seemingly relevant skills often make the agent incorrectly implement or omit task-required implementation elements. (2) Skill-induced efficiency regressions are not explained by prompt length alone. (3) The largest sources within Excessive Procedure are excessive verification and heavy implementation pipelines, contributing 67 and 30 cases, respectively. This shows that skills often turn validation checklists and construction recipes into mandatory work. Based on our findings, we propose research topics and tooling improvements for safer and more cost-aware skill reuse.", "arxiv_id": "2608.11888", "arxiv_url": "https://arxiv.org/abs/2608.11888", "authors": ["Gen Dong", "Yanjie Gao", "Liqun Li", "Tianyin Xu", "Yu Hua", "Fan Yang"], "brief": "\u672c\u6587\u7cfb\u7edf\u5206\u6790LLM\u667a\u80fd\u4f53\u4e2d\u53ef\u590d\u7528\u201c\u6280\u80fd\u201d\u5e26\u6765\u7684\u5931\u8d25\u4e0e\u6210\u672c\u9000\u5316\uff0c\u63d0\u51fa\u5dee\u5206\u5f52\u56e0\u6846\u67b6\uff0c\u5c06\u4efb\u52a1\u5931\u8d25\u6216\u6548\u7387\u4e0b\u964d\u5f52\u56e0\u5230\u5177\u4f53\u52a0\u8f7d\u6280\u80fd\u3002\u4f5c\u8005\u5728SkillsBench\u548cSWE-Skills-Bench\u4e0a\u8bc6\u522b\u51fa307\u4e2a\u6280\u80fd\u8bf1\u53d1\u95ee\u9898\uff0c\u5e76\u6784\u5efaSkillTriage\u5de5\u5177\u751f\u6210\u8bca\u65ad\u62a5\u544a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11888", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u5bf9\u6bd4\u6709\u6280\u80fd\u8fd0\u884c\u4e0e\u65e0\u6280\u80fd\u6216\u8bed\u4e49\u5339\u914d\u6280\u80fd\u7684\u53c2\u8003\u8fd0\u884c\uff0c\u5f52\u56e0\u529f\u80fd\u5931\u8d25\u4e0e\u6210\u672c\u56de\u5f52", "\u5171\u53d1\u73b0307\u4f8b\u6280\u80fd\u8bf1\u53d1\u95ee\u9898\uff0c\u5305\u62ec125\u4f8b\u529f\u80fd\u5931\u8d25\u548c182\u4f8b\u6548\u7387\u9000\u5316", "\u76f8\u5173\u6280\u80fd\u4e5f\u5e38\u5bfc\u81f4\u9519\u8bef\u5b9e\u73b0\u6216\u9057\u6f0f\u9700\u6c42\uff1b\u6548\u7387\u9000\u5316\u4e0d\u53ea\u662f\u63d0\u793a\u957f\u5ea6\u5bfc\u81f4\uff0c\u8fc7\u5ea6\u9a8c\u8bc1\u548c\u91cd\u578b\u5b9e\u73b0\u6d41\u7a0b\u662f\u4e3b\u8981\u6765\u6e90"], "keywords": ["\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60", "\u53ef\u9760\u6027", "\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11888v1", "published_at": "2026-08-12", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agent Skills Can Be Harmful: An Empirical Study of Skill-Induced Failures in LLM Agents", "tldr": "\u5b9e\u8bc1\u63ed\u793aLLM\u667a\u80fd\u4f53\u6280\u80fd\u4f1a\u8bf1\u53d1\u5931\u8d25", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u5206\u6790LLM\u667a\u80fd\u4f53\u4e2d\u53ef\u590d\u7528\u201c\u6280\u80fd\u201d\u5e26\u6765\u7684\u5931\u8d25\u4e0e\u6210\u672c\u9000\u5316\uff0c\u63d0\u51fa\u5dee\u5206\u5f52\u56e0\u6846\u67b6\uff0c\u5c06\u4efb\u52a1\u5931\u8d25\u6216\u6548\u7387\u4e0b\u964d\u5f52\u56e0\u5230\u5177\u4f53\u52a0\u8f7d\u6280\u80fd\u3002\u4f5c\u8005\u5728SkillsBench\u548cSWE-Skills-Bench\u4e0a\u8bc6\u522b\u51fa307\u4e2a\u6280\u80fd\u8bf1\u53d1\u95ee\u9898\uff0c\u5e76\u6784\u5efaSkillTriage\u5de5\u5177\u751f\u6210\u8bca\u65ad\u62a5\u544a\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u201c\u7ed9\u667a\u80fd\u4f53\u52a0\u8f7d\u66f4\u591a\u6280\u80fd\u5fc5\u7136\u6709\u76ca\u201d\u7684\u76f4\u89c9\uff0c\u63ed\u793a\u6280\u80fd\u590d\u7528\u4e2d\u7684\u5b89\u5168\u6027\u3001\u53ef\u9760\u6027\u548c\u6210\u672c\u98ce\u9669\uff0c\u5bf9\u6784\u5efa\u53ef\u63a7\u3001\u7ecf\u6d4e\u7684LLM\u667a\u80fd\u4f53\u5de5\u5177\u94fe\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Long-horizon research agents solve open-ended tasks through iterative retrieval, aggregation, and synthesis, but context grows rapidly while the marginal value of additional evidence often declines. This leads to unnecessary token cost, higher latency, and noisier inputs for final report generation. We study marginal value estimation for context management in deep research agents and present the first systematic stage-aware comparison of pruning strategies across the pipeline. We evaluate lightweight heuristic criteria and a learned value model at pre-retrieval, post-retrieval, and pre-synthesis stages. Our results show that pruning effectiveness depends more on where pruning is applied than on the specific scoring rule: early pruning yields the largest end-to-end savings, while later pruning mainly refines the final synthesis context. Lightweight heuristics reduce token usage by up to 73% with little quality degradation, learned pruning remains competitive on selected trade-offs, and no single method dominates across quality, efficiency, and faithfulness. These findings provide practical guidance for designing efficient long-horizon agentic systems.", "arxiv_id": "2608.08389", "arxiv_url": "https://arxiv.org/abs/2608.08389", "authors": ["Harshitha Kolukuluru", "Reshma Ashok", "Kirat Arora", "Evan William Ciccarelli", "Nischal Ashok Kumar", "Lunyiu Nie", "Franck Dernoncourt", "Samyadeep Basu", "Ryan A. Rossi", "Nedim Lipka"], "brief": "\u672c\u6587\u7814\u7a76\u957f\u7a0b\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u4e2d\u7684\u8fb9\u9645\u4ef7\u503c\u4f30\u8ba1\uff0c\u7528\u4e8e\u5728\u68c0\u7d22\u3001\u805a\u5408\u4e0e\u751f\u6210\u62a5\u544a\u8fc7\u7a0b\u4e2d\u7ba1\u7406\u4e0d\u65ad\u81a8\u80c0\u7684\u4e0a\u4e0b\u6587\u3002\u4f5c\u8005\u7cfb\u7edf\u6bd4\u8f83\u4e86\u9884\u68c0\u7d22\u3001\u68c0\u7d22\u540e\u3001\u5408\u6210\u524d\u7b49\u9636\u6bb5\u7684\u542f\u53d1\u5f0f\u526a\u679d\u4e0e\u5b66\u4e60\u5f0f\u4ef7\u503c\u6a21\u578b\u3002", "categories": ["cs.AI", "cs.IR", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08389", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u526a\u679d\u6548\u679c\u66f4\u4f9d\u8d56\u4e8e\u5e94\u7528\u9636\u6bb5\uff0c\u800c\u4e0d\u662f\u5177\u4f53\u6253\u5206\u89c4\u5219\uff1b\u65e9\u671f\u526a\u679d\u5e26\u6765\u6700\u5927\u7684\u7aef\u5230\u7aef\u6210\u672c\u8282\u7701", "\u8f7b\u91cf\u542f\u53d1\u5f0f\u65b9\u6cd5\u6700\u591a\u53ef\u51cf\u5c1173%\u7684 token \u4f7f\u7528\uff0c\u540c\u65f6\u4ec5\u9020\u6210\u8f83\u5c0f\u8d28\u91cf\u4e0b\u964d", "\u5b66\u4e60\u5f0f\u526a\u679d\u5728\u90e8\u5206\u8d28\u91cf-\u6548\u7387\u6743\u8861\u4e0a\u6709\u7ade\u4e89\u529b\uff0c\u4f46\u6ca1\u6709\u5355\u4e00\u65b9\u6cd5\u5728\u8d28\u91cf\u3001\u6548\u7387\u4e0e\u5fe0\u5b9e\u6027\u4e0a\u5168\u9762\u6700\u4f18"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u4fe1\u606f\u68c0\u7d22", "\u6548\u7387\u4f18\u5316"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08389v1", "published_at": "2026-08-09", "score": 0.224, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08389.png", "title": "Not Worth Another Token: Marginal Value Estimation for Efficient Deep Research Agents", "tldr": "\u7cfb\u7edf\u8bc4\u4f30\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u526a\u679d\u7b56\u7565", "upvotes": 11, "what_it_is": "\u672c\u6587\u7814\u7a76\u957f\u7a0b\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u4e2d\u7684\u8fb9\u9645\u4ef7\u503c\u4f30\u8ba1\uff0c\u7528\u4e8e\u5728\u68c0\u7d22\u3001\u805a\u5408\u4e0e\u751f\u6210\u62a5\u544a\u8fc7\u7a0b\u4e2d\u7ba1\u7406\u4e0d\u65ad\u81a8\u80c0\u7684\u4e0a\u4e0b\u6587\u3002\u4f5c\u8005\u7cfb\u7edf\u6bd4\u8f83\u4e86\u9884\u68c0\u7d22\u3001\u68c0\u7d22\u540e\u3001\u5408\u6210\u524d\u7b49\u9636\u6bb5\u7684\u542f\u53d1\u5f0f\u526a\u679d\u4e0e\u5b66\u4e60\u5f0f\u4ef7\u503c\u6a21\u578b\u3002", "why_notable": "\u8bba\u6587\u4e3a\u957f\u7a0b\u7814\u7a76\u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u7ba1\u7406\u63d0\u4f9b\u4e86\u7cfb\u7edf\u6027\u5b9e\u8bc1\u7ed3\u8bba\uff0c\u5f3a\u8c03\u201c\u4f55\u65f6\u526a\u679d\u201d\u6bd4\u201c\u5982\u4f55\u6253\u5206\u201d\u66f4\u5173\u952e\uff0c\u5bf9\u964d\u4f4e\u6210\u672c\u3001\u5ef6\u8fdf\u548c\u566a\u58f0\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "World modeling is an unsettled field: architectures, training objectives, and state representations interact in complex ways, and no single recipe dominates across environments. This makes it an ideal testbed for AI coding agents acting as autonomous researchers--a setting in which the improvement direction is not specified in advance, unlike the engineering-to-spec tasks that dominate current agent benchmarks. We introduce AutoWorldModel-Bench, a closed-loop benchmark in which frontier coding agents autonomously improve a provided world-model starter under a fixed compute budget. The benchmark spans eight game environments under a unified structured-state representation--ground-truth entity state extracted from each game and consumed through a shared tensor format--which isolates dynamics modeling from perception and enables minutes-per-run iteration. Across 64 sessions, Codex-5.4 and Claude Opus 4.6 improve their starter on 63; in 91% of sessions the winning edit is a non-trivial research-style modification--a new objective, representation, rollout procedure, or architectural change--rather than a hyperparameter tweak. Our benchmark offers a setting in which frontier coding agents can be evaluated on open-ended research rather than engineering-to-spec problems.", "arxiv_id": "2608.11216", "arxiv_url": "https://arxiv.org/abs/2608.11216", "authors": ["Marjan Moodi", "Xuankang Zhu", "Fernando De Mesentier Silva", "Harold Chaput", "Mohammad Reza Taesiri"], "brief": "\u8bba\u6587\u63d0\u51fa AutoWorldModel-Bench\uff0c\u4e00\u4e2a\u95ed\u73af\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u524d\u6cbf\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u56fa\u5b9a\u7b97\u529b\u4e0b\u81ea\u4e3b\u6539\u8fdb\u4e16\u754c\u6a21\u578b\u7684\u80fd\u529b\u3002\u5b83\u8986\u76d68\u4e2a\u6e38\u620f\u73af\u5883\uff0c\u4f7f\u7528\u7edf\u4e00\u7684\u7ed3\u6784\u5316\u771f\u5b9e\u5b9e\u4f53\u72b6\u6001\u8868\u793a\uff0c\u4ee5\u805a\u7126\u52a8\u529b\u5b66\u5efa\u6a21\u800c\u975e\u611f\u77e5\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11216", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u7edf\u4e00\u5f20\u91cf\u683c\u5f0f\u7684\u7ed3\u6784\u5316\u72b6\u6001\u8868\u793a\uff0c\u9694\u79bb\u611f\u77e5\u95ee\u9898\uff0c\u4f7f\u6bcf\u8f6e\u5b9e\u9a8c\u53ef\u5728\u5206\u949f\u7ea7\u5b8c\u6210\u3002", "\u572864\u6b21\u5b9e\u9a8c\u4e2d\uff0cCodex-5.4 \u548c Claude Opus 4.6 \u572863\u6b21\u4e2d\u6539\u8fdb\u4e86\u521d\u59cb\u4e16\u754c\u6a21\u578b\u3002", "91%\u7684\u6700\u4f73\u4fee\u6539\u5c5e\u4e8e\u7814\u7a76\u5f0f\u6539\u52a8\uff0c\u5982\u65b0\u8bad\u7ec3\u76ee\u6807\u3001\u8868\u793a\u65b9\u5f0f\u3001rollout\u6d41\u7a0b\u6216\u67b6\u6784\u53d8\u5316\uff0c\u800c\u975e\u7b80\u5355\u8c03\u53c2\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u81ea\u52a8\u5316\u79d1\u7814"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11216v1", "published_at": "2026-07-20", "score": 0.218, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.11216.png", "title": "AutoWorldModel-Bench: A State-Centric Benchmark for Automated World-Model Research", "tldr": "\u9762\u5411\u4e16\u754c\u6a21\u578b\u7814\u7a76\u7684\u81ea\u52a8\u5316\u667a\u80fd\u4f53\u57fa\u51c6\u3002", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoWorldModel-Bench\uff0c\u4e00\u4e2a\u95ed\u73af\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u524d\u6cbf\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u56fa\u5b9a\u7b97\u529b\u4e0b\u81ea\u4e3b\u6539\u8fdb\u4e16\u754c\u6a21\u578b\u7684\u80fd\u529b\u3002\u5b83\u8986\u76d68\u4e2a\u6e38\u620f\u73af\u5883\uff0c\u4f7f\u7528\u7edf\u4e00\u7684\u7ed3\u6784\u5316\u771f\u5b9e\u5b9e\u4f53\u72b6\u6001\u8868\u793a\uff0c\u4ee5\u805a\u7126\u52a8\u529b\u5b66\u5efa\u6a21\u800c\u975e\u611f\u77e5\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06\u667a\u80fd\u4f53\u8bc4\u4f30\u4ece\u6309\u89c4\u683c\u5b8c\u6210\u5de5\u7a0b\u4efb\u52a1\u63a8\u8fdb\u5230\u5f00\u653e\u5f0f\u79d1\u7814\u63a2\u7d22\uff0c\u66f4\u8d34\u8fd1\u81ea\u52a8\u5316AI\u7814\u7a76\u7684\u771f\u5b9e\u9700\u6c42\uff0c\u4e5f\u4e3a\u8861\u91cf\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u7814\u7a76\u521b\u9020\u529b\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u5b9e\u9a8c\u573a\u666f\u3002"}, {"abstract": "Agents deployed in enterprise settings must reason across structured APIs and document collections, yet existing benchmarks evaluate these capabilities in isolation. We introduce VAKRA (e\\textbf{V}aluating \\textbf{A}PI and \\textbf{K}nowledge \\textbf{R}etrieval \\textbf{A}gents), a benchmark of over $8{,}000$ executable APIs across $62$ domains with tasks spanning three settings of increasing difficulty: diverse API interaction styles, multi-hop reasoning over structured APIs, and multi-source reasoning with natural-language tool-use policy constraints. Correctness is verified by re-executing predicted tool calls against live APIs, accommodating multiple valid paths. Using a fixed ReAct harness to isolate model capabilities from agent architecture, we evaluate frontier and open-weight models and find that even the best model achieves only 70.4\\% on single-hop endpoint-style tasks and drops to 50--51\\% on compositional APIs; performance degrades by over 50\\% as reasoning depth increases, and policy-constrained questions expose severe failures (as low as 2.4\\% on unanswerable queries). Trace analysis shows failures concentrate at language-mediated reasoning - entity disambiguation, cross-source grounding, rather than tool invocation mechanics. Code is available https://github.com/IBM/VAKRA. Dataset is available https://huggingface.co/datasets/ibm-research/VAKRA", "arxiv_id": "2608.12282", "arxiv_url": "https://arxiv.org/abs/2608.12282", "authors": ["Ankita Rajaram Naik", "Anupama Murthi", "Benjamin Elder", "Siyu Huo", "Raavi Gupta", "Abhinav Jain", "Praveen Venkateswaran", "Abdulhamid Adebayo", "Danish Contractor"], "brief": "VAKRA \u662f\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u5de5\u5177\u4f7f\u7528\u573a\u666f\u7684\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5305\u542b62\u4e2a\u9886\u57df\u30018000\u591a\u4e2a\u53ef\u6267\u884cAPI\uff0c\u8986\u76d6API\u4ea4\u4e92\u3001\u591a\u8df3\u7ed3\u6784\u5316\u63a8\u7406\uff0c\u4ee5\u53ca\u5e26\u81ea\u7136\u8bed\u8a00\u5de5\u5177\u4f7f\u7528\u7b56\u7565\u7ea6\u675f\u7684\u591a\u6e90\u63a8\u7406\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12282", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u91cd\u65b0\u6267\u884c\u6a21\u578b\u9884\u6d4b\u7684\u5de5\u5177\u8c03\u7528\u6765\u9a8c\u8bc1\u6b63\u786e\u6027\uff0c\u5e76\u5141\u8bb8\u591a\u6761\u6709\u6548\u89e3\u9898\u8def\u5f84", "\u5728\u56fa\u5b9a ReAct \u6846\u67b6\u4e0b\u8bc4\u6d4b\u524d\u6cbf\u4e0e\u5f00\u6e90\u6a21\u578b\uff0c\u4ee5\u9694\u79bb\u6a21\u578b\u80fd\u529b\u548c\u667a\u80fd\u4f53\u67b6\u6784\u5f71\u54cd", "\u6700\u4f73\u6a21\u578b\u5728\u5355\u8df3\u7aef\u70b9\u5f0f\u4efb\u52a1\u4ec5\u8fbe70.4%\uff0c\u7ec4\u5408\u5f0fAPI\u964d\u81f350%\u201451%\uff0c\u63a8\u7406\u6df1\u5ea6\u589e\u52a0\u65f6\u6027\u80fd\u4e0b\u964d\u8d85\u8fc750%"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u68c0\u7d22\u589e\u5f3a", "\u591a\u8df3\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12282v1", "published_at": "2026-08-12", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "VAKRA: Evaluating Multi-Hop Reasoning Across APIs and Retrieval Under Tool-Use Policies", "tldr": "\u8bc4\u6d4b\u667a\u80fd\u4f53\u8de8API\u4e0e\u68c0\u7d22\u7684\u591
