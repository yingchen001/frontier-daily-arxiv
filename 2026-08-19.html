e Deepfake Forensics with General-Purpose MLLMs", "tldr": "\u7528\u611f\u77e5\u5de5\u5177\u589e\u5f3a\u53ef\u89e3\u91ca\u6df1\u4f2a\u53d6\u8bc1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PATE-Forensics\uff0c\u5c06\u6df1\u4f2a\u68c0\u6d4b\u4e0e\u5b9a\u4f4d\u5c01\u88c5\u4e3a DINOv3 \u9a71\u52a8\u7684\u201c\u53d6\u8bc1\u611f\u77e5\u5de5\u5177\u201d\uff0c\u518d\u628a\u56fe\u50cf\u4e0e\u7ed3\u6784\u5316\u53d6\u8bc1\u7ed3\u679c\u4ea4\u7ed9\u901a\u7528 MLLM \u751f\u6210\u89e3\u91ca\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u5bf9 MLLM \u505a\u4efb\u52a1\u5fae\u8c03\uff0c\u5b9e\u73b0\u68c0\u6d4b\u3001\u5b9a\u4f4d\u4e0e\u89e3\u91ca\u7684\u67b6\u6784\u89e3\u8026\u3002", "why_notable": "\u5b83\u628a\u4e13\u7528\u89c6\u89c9\u53d6\u8bc1\u80fd\u529b\u4f5c\u4e3a\u5de5\u5177\u63d0\u4f9b\u7ed9\u901a\u7528 MLLM\uff0c\u907f\u514d\u7aef\u5230\u7aef\u5fae\u8c03\u5e26\u6765\u7684\u6210\u672c\u4e0e\u6cdb\u5316\u95ee\u9898\uff0c\u540c\u65f6\u5728\u53ef\u89e3\u91ca\u6df1\u4f2a\u53d6\u8bc1\u57fa\u51c6\u4e0a\u53d6\u5f97\u663e\u8457\u9886\u5148\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Accurate and responsible medical question answering (QA) is important in healthcare, where complex cases require factual knowledge and nuanced reasoning. Existing medical QA systems, typically based on single-agent architectures and static retrieval, often lack adaptability, persistent memory, and structured decision-making. This work introduces an adaptive memory and reflection (AMR) agentic system, a multi-agent framework in which specialized agents use dedicated memory and reflection-based feedback to retrieve relevant prior cases and improve subsequent reasoning. Complexity assessment routes questions through solo, collaborative, or escalated workflows, while consensus and ethical overseer modules support reasoning consolidation and output review. Evaluation on MedQA and MedMCQA demonstrates strong performance compared with several baselines. Ablation studies show that combining agent-specific memory, reflection, and external retrieval yields the strongest performance. These findings highlight the potential of structured memory and feedback for developing more trustworthy medical agents. The source code is publicly available at https://github.com/mm-air/AMR-Agent.", "arxiv_id": "2608.19029", "arxiv_url": "https://arxiv.org/abs/2608.19029", "authors": ["Pradeep Murugesan", "Luoxiao Yang", "Xueli Chen", "Xinqi Fan"], "brief": "\u8bba\u6587\u63d0\u51fa AMR-Agent\uff0c\u4e00\u4e2a\u9762\u5411\u533b\u7597\u95ee\u7b54\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\u3002\u7cfb\u7edf\u4e3a\u4e0d\u540c\u4e13\u79d1\u667a\u80fd\u4f53\u914d\u7f6e\u4e13\u7528\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u53cd\u601d\u53cd\u9988\u3001\u5916\u90e8\u68c0\u7d22\u3001\u590d\u6742\u5ea6\u8def\u7531\u3001\u5171\u8bc6\u4e0e\u4f26\u7406\u5ba1\u67e5\u6765\u6539\u8fdb\u63a8\u7406\u548c\u56de\u7b54\u8d28\u91cf\u3002", "categories": ["cs.AI", "cs.CL", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19029", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6839\u636e\u95ee\u9898\u590d\u6742\u5ea6\u81ea\u52a8\u9009\u62e9\u5355\u667a\u80fd\u4f53\u3001\u534f\u4f5c\u5f0f\u6216\u5347\u7ea7\u5f0f\u5de5\u4f5c\u6d41\uff0c\u63d0\u5347\u8d44\u6e90\u4f7f\u7528\u4e0e\u63a8\u7406\u9002\u914d\u6027", "\u7ed3\u5408\u667a\u80fd\u4f53\u4e13\u5c5e\u8bb0\u5fc6\u3001\u53cd\u601d\u673a\u5236\u548c\u5916\u90e8\u68c0\u7d22\uff0c\u53ef\u590d\u7528\u5386\u53f2\u75c5\u4f8b\u5e76\u6539\u8fdb\u540e\u7eed\u63a8\u7406", "\u5728 MedQA \u548c MedMCQA \u4e0a\u4f18\u4e8e\u591a\u79cd\u57fa\u7ebf\uff0c\u6d88\u878d\u5b9e\u9a8c\u663e\u793a\u8bb0\u5fc6\u3001\u53cd\u601d\u4e0e\u68c0\u7d22\u7ec4\u5408\u8d21\u732e\u6700\u5927"], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597\u95ee\u7b54", "\u591a\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19029v1", "published_at": "2026-08-19", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Adaptive Memory and Reflection Multi-Agent System for Medical Question Answering", "tldr": "\u591a\u667a\u80fd\u4f53\u8bb0\u5fc6\u53cd\u601d\u63d0\u5347\u533b\u7597\u95ee\u7b54\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AMR-Agent\uff0c\u4e00\u4e2a\u9762\u5411\u533b\u7597\u95ee\u7b54\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\u3002\u7cfb\u7edf\u4e3a\u4e0d\u540c\u4e13\u79d1\u667a\u80fd\u4f53\u914d\u7f6e\u4e13\u7528\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u53cd\u601d\u53cd\u9988\u3001\u5916\u90e8\u68c0\u7d22\u3001\u590d\u6742\u5ea6\u8def\u7531\u3001\u5171\u8bc6\u4e0e\u4f26\u7406\u5ba1\u67e5\u6765\u6539\u8fdb\u63a8\u7406\u548c\u56de\u7b54\u8d28\u91cf\u3002", "why_notable": "\u533b\u7597\u95ee\u7b54\u5bf9\u51c6\u786e\u6027\u3001\u53ef\u8ffd\u6eaf\u6027\u548c\u5b89\u5168\u6027\u8981\u6c42\u6781\u9ad8\uff1b\u8be5\u5de5\u4f5c\u5c06\u7ed3\u6784\u5316\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u6301\u4e45\u8bb0\u5fc6\u548c\u53cd\u601d\u53cd\u9988\u7ed3\u5408\uff0c\u4e3a\u66f4\u53ef\u4fe1\u7684\u533b\u7597\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u5b9e\u9a8c\u6846\u67b6\u3002"}, {"abstract": "Debates have recently emerged as a useful methodology for agentic AI to improve performance as well as to aid explainability and user engagement. For example, LLM-empowered agents may debate internally (with themselves) and/or externally (with other agents). In many settings where debates are used, debates\u0027 outcomes and resulting outputs are determined post-hoc by external judges, often LLMs. In this paper we develop and test a novel theory of debate judgement applicable to all settings where agents engage in debates by providing pros and cons for their opinions therein. Specifically, we identify a number of formal properties that debate judgement may be required to satisfy in general, as concerns reproducibility, robustness, groundedness and explainability. Then, we explore their satisfaction formally and/or experimentally, for claim verification settings, for two specific alternative debate judgement methods: variants of the LLMs as a judge idea and formal semantics drawn from computational argumentation. We show that the two methods give similar accuracy performances but the former may lack formal guarantees that the latter brings. Overall, our study indicates argumentation semantics as an ideal candidate for principled judges in debate-driven AI.", "arxiv_id": "2608.19002", "arxiv_url": "https://arxiv.org/abs/2608.19002", "authors": ["Xiang Yin", "Adam Dejl", "Antonio Rago", "Lihu Chen", "Francesca Toni"], "brief": "\u672c\u6587\u63d0\u51fa\u5e76\u6d4b\u8bd5\u4e86\u4e00\u5957\u4e8b\u540e\u8fa9\u8bba\u88c1\u5224\u7406\u8bba\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u8fa9\u8bba\u4e2d\u7ed9\u51fa\u7684\u6b63\u53cd\u8bba\u636e\u3002\u4f5c\u8005\u6bd4\u8f83\u4e86\u201cLLM\u4f5c\u4e3a\u88c1\u5224\u201d\u548c\u8ba1\u7b97\u8bba\u8bc1\u4e2d\u7684\u5f62\u5f0f\u8bed\u4e49\uff0c\u5728\u58f0\u660e\u9a8c\u8bc1\u4efb\u52a1\u4e2d\u5206\u6790\u5176\u51c6\u786e\u7387\u4e0e\u5f62\u5f0f\u6027\u8d28\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19002", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u8fa9\u8bba\u88c1\u5224\u5e94\u6ee1\u8db3\u7684\u5f62\u5f0f\u5c5e\u6027\uff0c\u5305\u62ec\u53ef\u590d\u73b0\u6027\u3001\u9c81\u68d2\u6027\u3001\u624e\u6839\u6027\u548c\u53ef\u89e3\u91ca\u6027", "\u5728\u58f0\u660e\u9a8c\u8bc1\u573a\u666f\u4e2d\u6bd4\u8f83LLM\u88c1\u5224\u53d8\u4f53\u4e0e\u8ba1\u7b97\u8bba\u8bc1\u8bed\u4e49\u4e24\u7c7b\u65b9\u6cd5", "\u5b9e\u9a8c\u663e\u793a\u4e24\u8005\u51c6\u786e\u7387\u76f8\u8fd1\uff0c\u4f46\u5f62\u5f0f\u8bba\u8bc1\u8bed\u4e49\u80fd\u63d0\u4f9bLLM\u88c1\u5224\u7f3a\u4e4f\u7684\u7406\u8bba\u4fdd\u8bc1"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u88c1\u5224", "\u8ba1\u7b97\u8bba\u8bc1", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19002v1", "published_at": "2026-08-19", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Theory of Post-hoc Debate Judgement", "tldr": "\u7528\u5f62\u5f0f\u8bba\u8bc1\u4e3aAI\u8fa9\u8bba\u88c1\u5224\u63d0\u4f9b\u53ef\u4fdd\u8bc1\u7406\u8bba\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u5e76\u6d4b\u8bd5\u4e86\u4e00\u5957\u4e8b\u540e\u8fa9\u8bba\u88c1\u5224\u7406\u8bba\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u8fa9\u8bba\u4e2d\u7ed9\u51fa\u7684\u6b63\u53cd\u8bba\u636e\u3002\u4f5c\u8005\u6bd4\u8f83\u4e86\u201cLLM\u4f5c\u4e3a\u88c1\u5224\u201d\u548c\u8ba1\u7b97\u8bba\u8bc1\u4e2d\u7684\u5f62\u5f0f\u8bed\u4e49\uff0c\u5728\u58f0\u660e\u9a8c\u8bc1\u4efb\u52a1\u4e2d\u5206\u6790\u5176\u51c6\u786e\u7387\u4e0e\u5f62\u5f0f\u6027\u8d28\u3002", "why_notable": "\u968f\u7740\u591a\u667a\u80fd\u4f53\u8fa9\u8bba\u548cLLM\u81ea\u6211\u8fa9\u8bba\u88ab\u7528\u4e8e\u63d0\u5347\u6027\u80fd\u4e0e\u89e3\u91ca\u6027\uff0c\u5982\u4f55\u53ef\u9760\u88c1\u51b3\u8fa9\u8bba\u7ed3\u679c\u6210\u4e3a\u5173\u952e\u95ee\u9898\uff1b\u672c\u6587\u4e3a\u8fa9\u8bba\u9a71\u52a8AI\u63d0\u4f9b\u4e86\u66f4\u53ef\u539f\u5219\u5316\u3001\u53ef\u9a8c\u8bc1\u7684\u88c1\u5224\u6846\u67b6\u3002"}, {"abstract": "Last-mile delivery aims to handle dynamically arriving orders with couriers while modeling complex spatial and temporal correlations. Recent learning-based methods model spatiotemporal dependencies among orders to predict courier service sequences, but leave next-order decision making unexplained. Describing the current delivery state in language allows LLMs to reason explicitly about the spatial, temporal, and behavioral cues behind an individual decision. As direct predictors, however, LLMs remain sensitive to task presentation and often produce unreliable decisions. To address these challenges, we introduce ORBITER, an agentic Order Arbiter for next-order decision-making in last-mile delivery. ORBITER models courier service through decision points, each containing the courier\u0027s spatiotemporal state and visible orders and exposing local trade-offs for modeling and verification. Fixed proposers rank the candidates, and a structured report identifies where their rankings disagree. The LLM uses task-specific tools to gather evidence on the leading alternatives, while an independent critic checks the resulting decision against that evidence. We conduct extensive evaluations on data in four cities, where ORBITER outperforms existing state-of-the-art baselines by up to 9.2% on average showing its effectiveness.", "arxiv_id": "2608.18846", "arxiv_url": "https://arxiv.org/abs/2608.18846", "authors": ["Mingzhao Li", "Chenxi Liu", "Yan Zhao", "Hao Miao"], "brief": "ORBITER \u662f\u4e00\u4e2a\u9762\u5411\u672b\u7aef\u914d\u9001\u4e0b\u4e00\u5355\u9009\u62e9\u7684\u667a\u80fd\u4f53\u5f0f\u51b3\u7b56\u6846\u67b6\u3002\u5b83\u5c06\u9a91\u624b\u72b6\u6001\u4e0e\u53ef\u89c1\u8ba2\u5355\u7ec4\u7ec7\u4e3a\u51b3\u7b56\u70b9\uff0c\u901a\u8fc7\u5019\u9009\u6392\u5e8f\u3001\u51b2\u7a81\u62a5\u544a\u3001\u5de5\u5177\u53d6\u8bc1\u548c\u72ec\u7acb\u6279\u8bc4\u5668\u6765\u63d0\u5347\u51b3\u7b56\u53ef\u9760\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18846", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u914d\u9001\u8fc7\u7a0b\u62c6\u89e3\u4e3a\u5c40\u90e8\u51b3\u7b56\u70b9\uff0c\u663e\u5f0f\u5448\u73b0\u65f6\u7a7a\u72b6\u6001\u3001\u53ef\u89c1\u8ba2\u5355\u4e0e\u5019\u9009\u95f4\u6743\u8861\u3002", "\u4f7f\u7528\u56fa\u5b9a proposer \u5bf9\u5019\u9009\u8ba2\u5355\u6392\u5e8f\uff0c\u5e76\u751f\u6210\u7ed3\u6784\u5316\u62a5\u544a\u5b9a\u4f4d\u4e0d\u540c\u6392\u5e8f\u5668\u7684\u5206\u6b67\u3002", "LLM \u8c03\u7528\u4efb\u52a1\u5de5\u5177\u6536\u96c6\u8bc1\u636e\uff0c\u72ec\u7acb critic \u518d\u57fa\u4e8e\u8bc1\u636e\u6821\u9a8c\u6700\u7ec8\u51b3\u7b56\uff1b\u56db\u57ce\u6570\u636e\u4e0a\u5e73\u5747\u6700\u9ad8\u8f83 SOTA \u63d0\u5347 9.2%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u51b3\u7b56\u4f18\u5316", "\u7269\u6d41\u8c03\u5ea6", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18846v1", "published_at": "2026-08-19", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ORBITER: Conflict-Aware Decision-Making for Agentic Last-Mile Delivery", "tldr": "\u7528LLM\u4ef2\u88c1\u51b2\u7a81\u6392\u5e8f\u63d0\u5347\u672b\u7aef\u914d\u9001\u51b3\u7b56\u3002", "upvotes": 0, "what_it_is": "ORBITER \u662f\u4e00\u4e2a\u9762\u5411\u672b\u7aef\u914d\u9001\u4e0b\u4e00\u5355\u9009\u62e9\u7684\u667a\u80fd\u4f53\u5f0f\u51b3\u7b56\u6846\u67b6\u3002\u5b83\u5c06\u9a91\u624b\u72b6\u6001\u4e0e\u53ef\u89c1\u8ba2\u5355\u7ec4\u7ec7\u4e3a\u51b3\u7b56\u70b9\uff0c\u901a\u8fc7\u5019\u9009\u6392\u5e8f\u3001\u51b2\u7a81\u62a5\u544a\u3001\u5de5\u5177\u53d6\u8bc1\u548c\u72ec\u7acb\u6279\u8bc4\u5668\u6765\u63d0\u5347\u51b3\u7b56\u53ef\u9760\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a LLM \u4ece\u76f4\u63a5\u9884\u6d4b\u5668\u8f6c\u4e3a\u53ef\u89e3\u91ca\u3001\u53ef\u9a8c\u8bc1\u7684\u51b3\u7b56\u4ef2\u88c1\u5668\uff0c\u7f13\u89e3\u63d0\u793a\u654f\u611f\u548c\u4e0d\u53ef\u9760\u95ee\u9898\uff0c\u5bf9\u771f\u5b9e\u7269\u6d41\u8c03\u5ea6\u4e2d\u7684\u667a\u80fd\u4f53\u51b3\u7b56\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM)-based multi-agent systems (MAS) often exhibit complex failure modes, which frequently cause agents to produce incorrect outcomes. This motivates the task of Agent Failure Attribution: given a failed multi-agent trajectory, identify the faulty agents and their corresponding error types. Existing approaches predominantly rely on LLMs to perform failure attribution, either through direct prompting, fine-tuning on synthetic data or complex agentic pipelines. While effective, these methods incur substantial computational overhead due to long-context processing, expensive post-training and handcrafted workflows. Moreover, empirical evidence shows that even state-of-the-art models achieve limited accuracy on existing benchmarks, suggesting that scaling model size alone is insufficient. In this work, we revisit this task and question the necessity of such expensive generative solutions. We introduce AFANet, a lightweight graph-based framework that models interaction trajectories through step-level semantic signals and agent-level relationships. We show that with significantly fewer parameters and near-zero inference cost, AFANet (i) matches or outperforms LLM-based baselines, including fine-tuned models on in-domain benchmarks, (ii) maintains robust performance across different GNN architectures and (iii) can be further improved with inexpensive test-time adaptation on the OOD benchmark. Our results suggest that effective agent failure attribution does not require heavy LLM reasoning and a lightweight, structured approach can achieve strong performance.", "arxiv_id": "2608.18575", "arxiv_url": "https://arxiv.org/abs/2608.18575", "authors": ["Ting-Wei Li", "Yuanchen Bei", "Xiao Lin", "Hanghang Tong"], "brief": "\u8bba\u6587\u63d0\u51fa AFANet\uff0c\u4e00\u4e2a\u57fa\u4e8e\u56fe\u795e\u7ecf\u7f51\u7edc\u7684\u591a\u667a\u80fd\u4f53\u5931\u8d25\u5f52\u56e0\u6846\u67b6\uff0c\u7528\u6b65\u9aa4\u7ea7\u8bed\u4e49\u4fe1\u53f7\u548c\u667a\u80fd\u4f53\u5173\u7cfb\u5efa\u6a21\u5931\u8d25\u8f68\u8ff9\u3002\u5b83\u7528\u4e8e\u8bc6\u522b\u51fa\u9519\u667a\u80fd\u4f53\u53ca\u5176\u9519\u8bef\u7c7b\u578b\uff0c\u66ff\u4ee3\u4f9d\u8d56\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u7684LLM\u65b9\u6848\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18575", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u591a\u667a\u80fd\u4f53\u4ea4\u4e92\u8f68\u8ff9\u7ed3\u6784\u5316\u4e3a\u56fe\uff0c\u7ed3\u5408\u6b65\u9aa4\u7ea7\u8bed\u4e49\u7279\u5f81\u4e0e\u667a\u80fd\u4f53\u7ea7\u5173\u7cfb\u8fdb\u884c\u5931\u8d25\u5f52\u56e0", "\u5728\u57df\u5185\u57fa\u51c6\u4e0a\u5339\u914d\u6216\u8d85\u8fc7LLM\u63d0\u793a\u3001\u5fae\u8c03\u6a21\u578b\u7b49\u57fa\u7ebf\uff0c\u540c\u65f6\u53c2\u6570\u66f4\u5c11\u3001\u63a8\u7406\u6210\u672c\u63a5\u8fd1\u96f6", "\u5728\u4e0d\u540cGNN\u67b6\u6784\u4e0b\u8868\u73b0\u7a33\u5065\uff0c\u5e76\u53ef\u901a\u8fc7\u4f4e\u6210\u672c\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\u63d0\u5347OOD\u573a\u666f\u6027\u80fd"], "keywords": ["\u667a\u80fd\u4f53", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u591a\u667a\u80fd\u4f53", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18575v1", "published_at": "2026-08-19", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond LLM-Based Reasoning: Lightweight GNNs for Agent Failure Attribution", "tldr": "\u8f7b\u91cfGNN\u53ef\u9ad8\u6548\u5b9a\u4f4d\u591a\u667a\u80fd\u4f53\u5931\u8d25\u539f\u56e0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AFANet\uff0c\u4e00\u4e2a\u57fa\u4e8e\u56fe\u795e\u7ecf\u7f51\u7edc\u7684\u591a\u667a\u80fd\u4f53\u5931\u8d25\u5f52\u56e0\u6846\u67b6\uff0c\u7528\u6b65\u9aa4\u7ea7\u8bed\u4e49\u4fe1\u53f7\u548c\u667a\u80fd\u4f53\u5173\u7cfb\u5efa\u6a21\u5931\u8d25\u8f68\u8ff9\u3002\u5b83\u7528\u4e8e\u8bc6\u522b\u51fa\u9519\u667a\u80fd\u4f53\u53ca\u5176\u9519\u8bef\u7c7b\u578b\uff0c\u66ff\u4ee3\u4f9d\u8d56\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u7684LLM\u65b9\u6848\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u667a\u80fd\u4f53\u8bca\u65ad\u5fc5\u987b\u4f9d\u8d56\u91cd\u578bLLM\u63a8\u7406\u201d\u7684\u5047\u8bbe\uff0c\u8868\u660e\u7ed3\u6784\u5316\u5efa\u6a21\u548c\u8f7b\u91cfGNN\u5728\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u53ef\u89e3\u91ca\u6027\u4e0e\u8c03\u8bd5\u4e2d\u5177\u6709\u9ad8\u6027\u4ef7\u6bd4\uff0c\u9002\u5408\u5b9e\u9645\u90e8\u7f72\u3002"}, {"abstract": "Indoor scene synthesis provides essential environments for embodied AI, robotic manipulation, and simulation-based policy learning. Recent code-based scene generation methods produce editable and extensible environments, yet they remain focused on visual construction and object-level articulation, leaving the functional usage of scenes largely unmodeled. To address this problem, we present RoomWright, an agentic usage-driven framework for generating 3D scenes represented entirely as code for embodied interaction. RoomWright performs usage-driven object reasoning, which treats each anchor as a task centre and admits task-required objects and their affordances. A code agent further enables multi-part interaction by compiling each interaction into a trigger, condition, effect rule that updates structured object states, capturing causal dependencies across objects. Moreover, since manipuland orientation is ambiguous and hard to recover from pixels, RoomWright alleviates this via annotation-informed usage-guided orientation. Extensive experiments demonstrate the effectiveness of our method. The resulting scenes are executable, editable, and simulation-ready, providing interactive environments for embodied AI and policy learning.", "arxiv_id": "2608.18840", "arxiv_url": "https://arxiv.org/abs/2608.18840", "authors": ["Zijian Xiao", "Zipeng Ye", "Jinkun Hao", "Xiong Yang", "Yuchen Xie", "Ran Yi"], "brief": "\u8bba\u6587\u63d0\u51fa RoomWright\uff0c\u4e00\u4e2a\u4ee5\u201c\u4f7f\u7528\u65b9\u5f0f\u201d\u4e3a\u9a71\u52a8\u7684\u667a\u80fd\u4f53\u5f0f3D\u5ba4\u5185\u573a\u666f\u751f\u6210\u6846\u67b6\u3002\u5b83\u5c06\u573a\u666f\u5b8c\u5168\u8868\u793a\u4e3a\u4ee3\u7801\uff0c\u4e0d\u4ec5\u5efa\u6a21\u7269\u4f53\u6446\u653e\u548c\u5173\u8282\u8fd0\u52a8\uff0c\u8fd8\u663e\u5f0f\u5efa\u6a21\u4efb\u52a1\u6240\u9700\u7269\u4f53\u3001\u53ef\u4f9b\u6027\u4e0e\u591a\u7269\u4f53\u4ea4\u4e92\u56e0\u679c\u89c4\u5219\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18840", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4ee5\u951a\u70b9\u7269\u4f53\u4f5c\u4e3a\u4efb\u52a1\u4e2d\u5fc3\u8fdb\u884c\u4f7f\u7528\u9a71\u52a8\u63a8\u7406\uff0c\u81ea\u52a8\u8865\u5168\u4efb\u52a1\u6240\u9700\u7269\u4f53\u53ca\u5176\u53ef\u4f9b\u6027", "\u901a\u8fc7\u4ee3\u7801\u667a\u80fd\u4f53\u5c06\u4ea4\u4e92\u7f16\u8bd1\u4e3a\u89e6\u53d1\u5668-\u6761\u4ef6-\u6548\u679c\u89c4\u5219\uff0c\u66f4\u65b0\u7ed3\u6784\u5316\u7269\u4f53\u72b6\u6001\u5e76\u8868\u8fbe\u8de8\u7269\u4f53\u56e0\u679c\u4f9d\u8d56", "\u5f15\u5165\u6807\u6ce8\u4fe1\u606f\u8f85\u52a9\u7684\u4f7f\u7528\u5f15\u5bfc\u671d\u5411\u63a8\u65ad\uff0c\u7f13\u89e3\u53ef\u64cd\u4f5c\u7269\u4f53\u671d\u5411\u96be\u4ee5\u4ece\u56fe\u50cf\u6062\u590d\u7684\u95ee\u9898"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u573a\u666f\u751f\u6210", "\u667a\u80fd\u4f53", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18840v1", "published_at": "2026-08-19", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Placement and Articulation: Usage-Driven Code Scenes for Embodied Interaction", "tldr": "RoomWright\u751f\u6210\u53ef\u4ea4\u4e92\u7684\u4ee3\u7801\u53163D\u573a\u666f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RoomWright\uff0c\u4e00\u4e2a\u4ee5\u201c\u4f7f\u7528\u65b9\u5f0f\u201d\u4e3a\u9a71\u52a8\u7684\u667a\u80fd\u4f53\u5f0f3D\u5ba4\u5185\u573a\u666f\u751f\u6210\u6846\u67b6\u3002\u5b83\u5c06\u573a\u666f\u5b8c\u5168\u8868\u793a\u4e3a\u4ee3\u7801\uff0c\u4e0d\u4ec5\u5efa\u6a21\u7269\u4f53\u6446\u653e\u548c\u5173\u8282\u8fd0\u52a8\uff0c\u8fd8\u663e\u5f0f\u5efa\u6a21\u4efb\u52a1\u6240\u9700\u7269\u4f53\u3001\u53ef\u4f9b\u6027\u4e0e\u591a\u7269\u4f53\u4ea4\u4e92\u56e0\u679c\u89c4\u5219\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5ba4\u5185\u573a\u666f\u751f\u6210\u4ece\u201c\u89c6\u89c9\u4e0a\u5408\u7406\u201d\u63a8\u8fdb\u5230\u201c\u529f\u80fd\u4e0a\u53ef\u7528\u201d\uff0c\u751f\u6210\u7684\u573a\u666f\u53ef\u6267\u884c\u3001\u53ef\u7f16\u8f91\u3001\u53ef\u4eff\u771f\uff0c\u6709\u671b\u63d0\u5347\u5177\u8eab\u667a\u80fd\u3001\u673a\u5668\u4eba\u64cd\u4f5c\u548c\u4eff\u771f\u7b56\u7565\u5b66\u4e60\u7684\u73af\u5883\u8d28\u91cf\u3002"}, {"abstract": "Medical vision-language models (VLMs) can achieve high accuracy but remain unreliable: they are systematically overconfident, benefit little from test-time reasoning, and lack the ability to reliably calibrate trust in their own responses. We introduce EVADE (Evidence-Verified Agentic Diagnosis with Escape), an inferential, non-training method that enhances the safety of deploying a single frozen VLM. EVADE responds and, when uncertain, localises the region most diagnostically relevant, re-answers on a zoomed view, and commits only when both the entire image and the zoomed view responses agree; otherwise, it abstains. To directly address verification hallucination in single-model self-checking, our main idea is to verify gate consistency across different image views rather than re-reading the model\u0027s own text. Experimental evaluation on VQA-RAD, SLAKE, and PathVQA using Qwen2.5-VL-7B reports that EVADE is the only method that simultaneously improves both calibration and selective risk while maintaining accuracy, reducing expected calibration error (ECE) by up to 45% compared to zero-shot. Chain-of-thought, self-consistency, and self-verification all fail at least one axis. A grounding analysis reports that self-proposed regions perform better at diagnostic structure localisation than centres or random crops. However, a 7B VLM cannot use this localisation to revise answers. Therefore, reliability gains come from the consistency gate and calibrated abstention.", "arxiv_id": "2608.18833", "arxiv_url": "https://arxiv.org/abs/2608.18833", "authors": ["Mohaimenul Azam Khan Raiaan", "Nur Mohammad Fahad"], "brief": "\u63d0\u51faEVADE\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u533b\u7597\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u6846\u67b6\uff1a\u6a21\u578b\u5148\u56de\u7b54\uff0c\u82e5\u4e0d\u786e\u5b9a\u5219\u5b9a\u4f4d\u8bca\u65ad\u76f8\u5173\u533a\u57df\u5e76\u653e\u5927\u91cd\u7b54\uff0c\u53ea\u6709\u5168\u56fe\u4e0e\u5c40\u90e8\u89c6\u56fe\u7b54\u6848\u4e00\u81f4\u65f6\u624d\u63d0\u4ea4\uff0c\u5426\u5219\u62d2\u7b54\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18833", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6838\u5fc3\u9a8c\u8bc1\u601d\u8def\u4e0d\u662f\u8ba9\u5355\u6a21\u578b\u590d\u8bfb\u81ea\u68c0\u6587\u672c\uff0c\u800c\u662f\u68c0\u67e5\u5168\u56fe\u4e0e\u653e\u5927\u533a\u57df\u4e24\u4e2a\u56fe\u50cf\u89c6\u89d2\u4e0b\u7684\u7b54\u6848\u4e00\u81f4\u6027\uff0c\u4ee5\u964d\u4f4e\u81ea\u9a8c\u8bc1\u5e7b\u89c9\u3002", "\u5728VQA-RAD\u3001SLAKE\u3001PathVQA\u4e0a\u4f7f\u7528Qwen2.5-VL-7B\u8bc4\u4f30\uff0cEVADE\u540c\u65f6\u6539\u5584\u6821\u51c6\u4e0e\u9009\u62e9\u6027\u98ce\u9669\uff0c\u5e76\u4fdd\u6301\u51c6\u786e\u7387\uff0cECE\u6700\u9ad8\u8f83\u96f6\u6837\u672c\u964d\u4f4e45%\u3002", "\u5206\u6790\u663e\u793a\u6a21\u578b\u81ea\u63d0\u51fa\u533a\u57df\u6bd4\u4e2d\u5fc3\u88c1\u526a\u6216\u968f\u673a\u88c1\u526a\u66f4\u80fd\u5b9a\u4f4d\u8bca\u65ad\u7ed3\u6784\uff0c\u4f467B VLM\u96be\u4ee5\u5229\u7528\u5b9a\u4f4d\u6765\u4fee\u6b63\u7b54\u6848\uff0c\u53ef\u9760\u6027\u4e3b\u8981\u6765\u81ea\u4e00\u81f4\u6027\u95e8\u63a7\u4e0e\u6821\u51c6\u62d2\u7b54\u3002"], "keywords": ["\u533b\u7597\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u6a21\u578b\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18833v1", "published_at": "2026-08-19", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "EVADE: Evidence-Verified Agentic Diagnosis with Escape", "tldr": "EVADE\u7528\u8de8\u89c6\u56fe\u4e00\u81f4\u6027\u63d0\u5347\u533b\u7597VLM\u53ef\u4fe1\u5ea6", "upvotes": 0, "what_it_is": "\u63d0\u51faEVADE\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u533b\u7597\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u6846\u67b6\uff1a\u6a21\u578b\u5148\u56de\u7b54\uff0c\u82e5\u4e0d\u786e\u5b9a\u5219\u5b9a\u4f4d\u8bca\u65ad\u76f8\u5173\u533a\u57df\u5e76\u653e\u5927\u91cd\u7b54\uff0c\u53ea\u6709\u5168\u56fe\u4e0e\u5c40\u90e8\u89c6\u56fe\u7b54\u6848\u4e00\u81f4\u65f6\u624d\u63d0\u4ea4\uff0c\u5426\u5219\u62d2\u7b54\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u533b\u7597VLM\u90e8\u7f72\u4e2d\u7684\u8fc7\u5ea6\u81ea\u4fe1\u4e0e\u4e0d\u53ef\u9760\u81ea\u68c0\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u65e0\u9700\u5fae\u8c03\u3001\u53ef\u63d2\u62d4\u7684\u5b89\u5168\u63a8\u7406\u673a\u5236\uff1b\u5176\u7ed3\u679c\u4e5f\u63ed\u793a\u4e86\u5f53\u524d\u5c0f\u578b\u533b\u7597VLM\u201c\u80fd\u5b9a\u4f4d\u4f46\u96be\u7ea0\u9519\u201d\u7684\u80fd\u529b\u8fb9\u754c\u3002"}, {"abstract": "Intelligent document processing (IDP) encompasses a broad range of tasks, including optical character recognition (OCR), document question answering (DocQA), and key information extraction (KIE). Despite their distinct objectives, these tasks share a common need to perceive document content, acquire task-relevant information, and progressively refine intermediate results. However, they are typically formulated as separate prediction problems and addressed by task-specific models or processing pipelines. We introduce DocClaw, a unified agentic system that formulates diverse intelligent document processing tasks as a shared process of interaction between an agent and a document. Given a document and a task-specific query, DocClaw follows an appropriate document skill to iteratively identify the information required, invoke relevant tools, and integrate the resulting observations into the desired output. Throughout this process, a structured document state organizes reusable document knowledge and task-specific interaction context, allowing the agent to accumulate, revisit, and progressively refine information as the interaction proceeds. Under this formulation, task-specific requirements are captured by the agent\u0027s interpretation of the query objective and the corresponding document skill, while the underlying interaction loop, tool space, and document state are shared across tasks. Extensive experiments across multiple intelligent document processing benchmarks demonstrate that DocClaw effectively handles diverse tasks within a single agentic framework and achieves competitive performance compared with both general-purpose VLMs and task-specific methods.", "arxiv_id": "2608.18685", "arxiv_url": "https://arxiv.org/abs/2608.18685", "authors": ["Siqi Xiang", "Zhipeng Xu", "Yufei Liu", "Junhao Ji", "Qing Liu", "Zulong Chen", "Zhibo Yang", "Chunyan Miao", "Shijian Lu"], "brief": "DocClaw \u5c06 OCR\u3001\u6587\u6863\u95ee\u7b54\u3001\u5173\u952e\u4fe1\u606f\u62bd\u53d6\u7b49\u667a\u80fd\u6587\u6863\u5904\u7406\u4efb\u52a1\u7edf\u4e00\u5efa\u6a21\u4e3a\u201c\u667a\u80fd\u4f53\u4e0e\u6587\u6863\u4ea4\u4e92\u201d\u7684\u8fc7\u7a0b\u3002\u7cfb\u7edf\u6839\u636e\u4efb\u52a1\u67e5\u8be2\u9009\u62e9\u6587\u6863\u6280\u80fd\uff0c\u8fed\u4ee3\u8c03\u7528\u5de5\u5177\u3001\u6574\u5408\u89c2\u5bdf\u7ed3\u679c\uff0c\u5e76\u901a\u8fc7\u7ed3\u6784\u5316\u6587\u6863\u72b6\u6001\u6c89\u6dc0\u53ef\u590d\u7528\u77e5\u8bc6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18685", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u7528\u5171\u4eab\u7684\u4ea4\u4e92\u5faa\u73af\u3001\u5de5\u5177\u7a7a\u95f4\u548c\u6587\u6863\u72b6\u6001\u66ff\u4ee3\u4f20\u7edf\u4efb\u52a1\u4e13\u7528\u6d41\u6c34\u7ebf", "\u7ed3\u6784\u5316\u6587\u6863\u72b6\u6001\u540c\u65f6\u4fdd\u5b58\u901a\u7528\u6587\u6863\u77e5\u8bc6\u4e0e\u4efb\u52a1\u4e0a\u4e0b\u6587\uff0c\u652f\u6301\u53cd\u590d\u68c0\u7d22\u548c\u9010\u6b65\u7cbe\u70bc", "\u5728\u591a\u4e2a IDP \u57fa\u51c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u8868\u73b0\uff0c\u53ef\u540c\u65f6\u8986\u76d6 OCR\u3001DocQA\u3001KIE \u7b49\u4efb\u52a1"], "keywords": ["\u667a\u80fd\u4f53", "\u6587\u6863\u7406\u89e3", "\u591a\u6a21\u6001", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18685v1", "published_at": "2026-08-19", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DocClaw: A Unified Agentic System for Intelligent Document Processing", "tldr": "\u7edf\u4e00\u667a\u80fd\u4f53\u6846\u67b6\u5904\u7406\u591a\u7c7b\u6587\u6863\u4efb\u52a1", "upvotes": 0, "what_it_is": "DocClaw \u5c06 OCR\u3001\u6587\u6863\u95ee\u7b54\u3001\u5173\u952e\u4fe1\u606f\u62bd\u53d6\u7b49\u667a\u80fd\u6587\u6863\u5904\u7406\u4efb\u52a1\u7edf\u4e00\u5efa\u6a21\u4e3a\u201c\u667a\u80fd\u4f53\u4e0e\u6587\u6863\u4ea4\u4e92\u201d\u7684\u8fc7\u7a0b\u3002\u7cfb\u7edf\u6839\u636e\u4efb\u52a1\u67e5\u8be2\u9009\u62e9\u6587\u6863\u6280\u80fd\uff0c\u8fed\u4ee3\u8c03\u7528\u5de5\u5177\u3001\u6574\u5408\u89c2\u5bdf\u7ed3\u679c\uff0c\u5e76\u901a\u8fc7\u7ed3\u6784\u5316\u6587\u6863\u72b6\u6001\u6c89\u6dc0\u53ef\u590d\u7528\u77e5\u8bc6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6587\u6863\u7406\u89e3\u4ece\u5355\u6b21\u9884\u6d4b\u8303\u5f0f\u63a8\u8fdb\u5230\u53ef\u8fed\u4ee3\u63a8\u7406\u4e0e\u5de5\u5177\u8c03\u7528\u7684\u667a\u80fd\u4f53\u8303\u5f0f\uff0c\u6709\u671b\u964d\u4f4e\u591a\u4efb\u52a1\u6587\u6863\u7cfb\u7edf\u7684\u5de5\u7a0b\u590d\u6742\u5ea6\uff0c\u5e76\u63d0\u5347\u590d\u6742\u6587\u6863\u573a\u666f\u4e0b\u7684\u4fe1\u606f\u6574\u5408\u80fd\u529b\u3002"}, {"abstract": "As text-to-image generative models advance, they raise critical safety concerns, particularly the generation of Not-Safe-For-Work (NSFW) content such as violence and nudity, further exacerbated by red-teaming adversarial attacks. Existing defenses predominantly operate under white-box assumptions, relying on text encoder optimization, weight editing, or inference-time intervention, and fundamentally cannot scale to proprietary models. Black-box alternatives based on LLM prompt rewriting offer broader applicability, yet fail in a critical regime we identify as the \\textit{benign adversarial} problem: prompts that are linguistically safe but still trigger harmful generation due to the model\u0027s learned data distribution. We propose DiSCO, a zero-shot, strictly black-box defense that operates entirely at the prompt level as a plug-and-play module, requiring no model retraining, fine-tuning, or access to model internals. DiSCO performs distribution-guided suffix expansion via beam search, optimized through contrastive scoring over safe and unsafe image pools generated by the target model itself, with iterative adaptive feedback until safe content is produced. We demonstrate that DiSCO consistently enhances the safety of both undefended and defended models on the I2P benchmark under multiple red-teaming attacks, achieving 37.7% and 25.13% ASR reduction, respectively, while maintaining semantic fidelity and improving image coherence. As a black-box, architecture-agnostic module, DiSCO can be readily applied to any text-to-image system without necessitating any changes to the model itself.", "arxiv_id": "2608.17067", "arxiv_url": "https://arxiv.org/abs/2608.17067", "authors": ["Tong Zhang", "Motasem Alfarra", "Carlos Hinojosa", "Christos Louizos", "Bernard Ghanem"], "brief": "\u8bba\u6587\u63d0\u51fa DiSCO\uff0c\u4e00\u79cd\u96f6\u6837\u672c\u3001\u4e25\u683c\u9ed1\u76d2\u7684\u6587\u751f\u56fe\u5b89\u5168\u9632\u5fa1\u65b9\u6cd5\u3002\u5b83\u5728\u4e0d\u8bbf\u95ee\u6a21\u578b\u5185\u90e8\u3001\u4e0d\u8bad\u7ec3\u6216\u5fae\u8c03\u7684\u60c5\u51b5\u4e0b\uff0c\u901a\u8fc7\u5206\u5e03\u5f15\u5bfc\u7684\u63d0\u793a\u540e\u7f00\u6269\u5c55\u6765\u964d\u4f4e NSFW \u56fe\u50cf\u751f\u6210\u98ce\u9669\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17067", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u201c\u826f\u6027\u5bf9\u6297\u201d\u95ee\u9898\uff1a\u6587\u672c\u8868\u9762\u5b89\u5168\u4f46\u56e0\u6a21\u578b\u5b66\u4e60\u5230\u7684\u6570\u636e\u5206\u5e03\u4ecd\u89e6\u53d1\u66b4\u529b\u3001\u88f8\u9732\u7b49\u6709\u5bb3\u751f\u6210\u3002", "\u4f7f\u7528\u76ee\u6807\u6a21\u578b\u81ea\u8eab\u751f\u6210\u7684\u5b89\u5168/\u4e0d\u5b89\u5168\u56fe\u50cf\u6c60\u8fdb\u884c\u5bf9\u6bd4\u8bc4\u5206\uff0c\u5e76\u901a\u8fc7 beam search \u641c\u7d22\u5b89\u5168\u63d0\u793a\u540e\u7f00\u3002", "\u5728 I2P \u57fa\u51c6\u548c\u591a\u79cd\u7ea2\u961f\u653b\u51fb\u4e0b\uff0c\u5bf9\u65e0\u9632\u5fa1\u6a21\u578b\u548c\u5df2\u6709\u9632\u5fa1\u6a21\u578b\u5206\u522b\u964d\u4f4e 37.7% \u548c 25.13% \u653b\u51fb\u6210\u529f\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u8bed\u4e49\u4e00\u81f4\u6027\u3002"], "keywords": ["\u6587\u751f\u56fe", "\u5b89\u5168\u5bf9\u9f50", "\u9ed1\u76d2\u9632\u5fa1", "\u63d0\u793a\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "KAUST Center of Excellence in Generative AI", "pdf_url": "https://arxiv.org/pdf/2608.17067v1", "published_at": "2026-08-17", "score": 0.254, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.17067.png", "title": "DiSCO: Defending text-to-image generation through distribution-guided contrastive prompt optimization", "tldr": "\u9ed1\u76d2\u63d0\u793a\u4f18\u5316\u63d0\u5347\u6587\u751f\u56fe\u5b89\u5168\u6027", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa DiSCO\uff0c\u4e00\u79cd\u96f6\u6837\u672c\u3001\u4e25\u683c\u9ed1\u76d2\u7684\u6587\u751f\u56fe\u5b89\u5168\u9632\u5fa1\u65b9\u6cd5\u3002\u5b83\u5728\u4e0d\u8bbf\u95ee\u6a21\u578b\u5185\u90e8\u3001\u4e0d\u8bad\u7ec3\u6216\u5fae\u8c03\u7684\u60c5\u51b5\u4e0b\uff0c\u901a\u8fc7\u5206\u5e03\u5f15\u5bfc\u7684\u63d0\u793a\u540e\u7f00\u6269\u5c55\u6765\u964d\u4f4e NSFW \u56fe\u50cf\u751f\u6210\u98ce\u9669\u3002", "why_notable": "DiSCO \u4e0d\u4f9d\u8d56\u767d\u76d2\u6743\u9650\u6216\u6a21\u578b\u6539\u9020\uff0c\u9002\u7528\u4e8e\u95ed\u6e90\u6587\u751f\u56fe\u7cfb\u7edf\uff0c\u8865\u8db3\u4e86\u73b0\u6709\u63d0\u793a\u6539\u5199\u65b9\u6cd5\u5728\u201c\u8bed\u8a00\u5b89\u5168\u4f46\u751f\u6210\u6709\u5bb3\u201d\u573a\u666f\u4e0b\u7684\u77ed\u677f\uff0c\u5177\u6709\u8f83\u5f3a\u90e8\u7f72\u5b9e\u7528\u6027\u3002"}, {"abstract": "Large language model (LLM) based agents have demonstrated remarkable proficiency in automated software issue resolution, yet they often struggle to resolve issues in a specific repository because they lack project-specific knowledge. Existing self-evolving approaches acquire such knowledge from repository history or online repair trajectories, but they either depend on available historical issue-resolution signals or incur substantial per-issue test-time exploration cost. In this paper, we propose SkillForge, a self-distillation framework that proactively acquires project-specific knowledge from the repository itself. Instead of waiting for real issues to expose project-specific knowledge gaps, SkillForge synthesizes project-specific issues by re-implementing test-covered core functionalities of the repository. By resolving these synthetic issues, SkillForge distills reusable project-specific knowledge into entity-grounded skills and associates them with relevant repository entities for future issue resolution. Extensive experiments using both open-source and closed-source models show that SkillForge consistently improves issue resolution performance over strong baselines. These results demonstrate that proactively acquiring project-specific knowledge before solving real issues substantially improves downstream software issue resolution.", "arxiv_id": "2608.18933", "arxiv_url": "https://arxiv.org/abs/2608.18933", "authors": ["Silin Chen", "Han Li", "Xiaodong Gu", "Yuling Shi", "Haibing Guan"], "brief": "SkillForge \u662f\u4e00\u4e2a\u9762\u5411\u8f6f\u4ef6\u4ed3\u5e93\u7684 LLM Agent \u81ea\u84b8\u998f\u6846\u67b6\uff0c\u901a\u8fc7\u4e3b\u52a8\u5408\u6210\u9879\u76ee\u7279\u5b9a\u95ee\u9898\u5e76\u89e3\u51b3\u5b83\u4eec\uff0c\u63d0\u524d\u5b66\u4e60\u4ed3\u5e93\u77e5\u8bc6\u3002\u5b83\u5c06\u4fee\u590d\u8fc7\u7a0b\u4e2d\u83b7\u5f97\u7684\u77e5\u8bc6\u84b8\u998f\u4e3a\u4e0e\u4ee3\u7801\u5b9e\u4f53\u7ed1\u5b9a\u7684\u53ef\u590d\u7528\u6280\u80fd\uff0c\u7528\u4e8e\u540e\u7eed\u771f\u5b9e issue \u89e3\u51b3\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18933", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u901a\u8fc7\u91cd\u65b0\u5b9e\u73b0\u4ed3\u5e93\u4e2d\u6709\u6d4b\u8bd5\u8986\u76d6\u7684\u6838\u5fc3\u529f\u80fd\uff0c\u81ea\u52a8\u6784\u9020\u9879\u76ee\u7279\u5b9a\u7684\u5408\u6210 issue", "\u5728\u89e3\u51b3\u5408\u6210 issue \u7684\u8fc7\u7a0b\u4e2d\u63d0\u70bc entity-grounded skills\uff0c\u5e76\u5173\u8054\u5230\u76f8\u5173\u4ed3\u5e93\u5b9e\u4f53", "\u5728\u5f00\u6e90\u4e0e\u95ed\u6e90\u6a21\u578b\u4e0a\u5747\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u964d\u4f4e\u4e86\u4f9d\u8d56\u5386\u53f2 issue \u6216\u9010\u9898\u63a2\u7d22\u7684\u6210\u672c"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u81ea\u84b8\u998f", "\u4ee3\u7801\u4fee\u590d"], "num_comments": 1, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2608.18933v1", "published_at": "2026-08-19", "score": 0.241, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18933.png", "title": "SkillForge: Self-Distilling Agents for Project-Specific Issue Resolution", "tldr": "\u81ea\u84b8\u998f\u9879\u76ee\u6280\u80fd\u63d0\u5347\u4ed3\u5e93\u95ee\u9898\u4fee\u590d", "upvotes": 3, "what_it_is": "SkillForge \u662f\u4e00\u4e2a\u9762\u5411\u8f6f\u4ef6\u4ed3\u5e93\u7684 LLM Agent \u81ea\u84b8\u998f\u6846\u67b6\uff0c\u901a\u8fc7\u4e3b\u52a8\u5408\u6210\u9879\u76ee\u7279\u5b9a\u95ee\u9898\u5e76\u89e3\u51b3\u5b83\u4eec\uff0c\u63d0\u524d\u5b66\u4e60\u4ed3\u5e93\u77e5\u8bc6\u3002\u5b83\u5c06\u4fee\u590d\u8fc7\u7a0b\u4e2d\u83b7\u5f97\u7684\u77e5\u8bc6\u84b8\u998f\u4e3a\u4e0e\u4ee3\u7801\u5b9e\u4f53\u7ed1\u5b9a\u7684\u53ef\u590d\u7528\u6280\u80fd\uff0c\u7528\u4e8e\u540e\u7eed\u771f\u5b9e issue \u89e3\u51b3\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u9879\u76ee\u77e5\u8bc6\u83b7\u53d6\u4ece\u88ab\u52a8\u4fee\u590d\u8f6c\u4e3a\u4e3b\u52a8\u9884\u8bad\u7ec3\u5f0f\u81ea\u84b8\u998f\uff0c\u80fd\u5728\u771f\u5b9e\u95ee\u9898\u5230\u6765\u524d\u79ef\u7d2f\u4ed3\u5e93\u7ea7\u7ecf\u9a8c\uff0c\u5bf9\u63d0\u5347\u8f6f\u4ef6\u5de5\u7a0b Agent \u7684\u5b9e\u7528\u6027\u548c\u4f4e\u6210\u672c\u90e8\u7f72\u5177\u6709\u4ef7\u503c\u3002"}, {"abstract": "Methods for improving knowledge use in large language models typically fall into two regimes. Non-parametric retrieval offers flexible access to external knowledge, but adds retrieval latency, context overhead, and only shallow integration with the backbone. Parametric adaptation is efficient at inference time, but entangles knowledge with model weights and can be hard to update, audit, or transfer. Engram-style hashed memory occupies a middle regime: it stores learned information in an external, addressable table, yet consumes that table through a small learned reader. This raises a basic question: when such a memory is moved across backbones, what matters more, the frozen memory itself or the target-side reader? We study this question through cross-model frozen-memory extraction, in which a memory trained on a source model is frozen and attached to a different target model, with only a lightweight reader trained. Ablations show that learned memory content and correct addressing both matter, but the transferred table becomes useful only through a reader aligned to the target model. In downstream question answering tasks, a dual-layer, four-branch reader nearly closes the gap between same-model and cross-model reuse, achieving an average score of 38.8 under our controlled evaluation protocol. Moreover, when the provider reader is directly compatible with the target interface, the frozen artifact can provide substantial utility without target-side training, while optional reader adaptation yields further improvement. These results suggest that Engram can serve as a reusable external knowledge artifact, provided that the target has access to a compatible reader interface; target-side adaptation can further improve alignment when direct reader reuse is insufficient.", "arxiv_id": "2608.17050", "arxiv_url": "https://arxiv.org/abs/2608.17050", "authors": ["Mingyuan Li", "Guangsheng Yu", "Xu Wang", "Shaoxiong Ji"], "brief": "\u672c\u6587\u7814\u7a76 Engram \u5f0f\u54c8\u5e0c\u5916\u90e8\u8bb0\u5fc6\u5728\u4e0d\u540c\u5927\u6a21\u578b\u9aa8\u5e72\u4e4b\u95f4\u7684\u8fc1\u79fb\uff1a\u5c06\u6e90\u6a21\u578b\u8bad\u7ec3\u51fa\u7684\u8bb0\u5fc6\u8868\u51bb\u7ed3\u540e\u63a5\u5230\u76ee\u6807\u6a21\u578b\u4e0a\uff0c\u53ea\u8bad\u7ec3\u8f7b\u91cf reader\u3002\u7ed3\u679c\u8868\u660e\uff0c\u8bb0\u5fc6\u5185\u5bb9\u548c\u5bfb\u5740\u90fd\u91cd\u8981\uff0c\u4f46\u771f\u6b63\u53d1\u6325\u4f5c\u7528\u4f9d\u8d56\u4e0e\u76ee\u6807\u6a21\u578b\u5bf9\u9f50\u7684\u8bfb\u5934\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/OLAResearch/XMemTransfer", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.17050", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa cross-model frozen-memory extraction \u8bbe\u5b9a\uff1a\u51bb\u7ed3\u6e90\u6a21\u578b\u8bb0\u5fc6\u8868\uff0c\u4ec5\u5728\u76ee\u6807\u4fa7\u8bad\u7ec3\u8f7b\u91cf reader\u3002", "\u6d88\u878d\u663e\u793a\u5b66\u4e60\u5230\u7684\u8bb0\u5fc6\u5185\u5bb9\u3001\u6b63\u786e\u5730\u5740\u6620\u5c04\u4e0e\u76ee\u6807\u4fa7 reader \u5bf9\u9f50\u7f3a\u4e00\u4e0d\u53ef\u3002", "\u53cc\u5c42\u56db\u5206\u652f reader \u5728\u95ee\u7b54\u4efb\u52a1\u4e2d\u663e\u8457\u7f29\u5c0f\u540c\u6a21\u578b\u590d\u7528\u4e0e\u8de8\u6a21\u578b\u590d\u7528\u5dee\u8ddd\uff0c\u5e73\u5747\u5f97\u5206\u8fbe 38.8\u3002"], "keywords": ["\u5916\u90e8\u8bb0\u5fc6", "\u77e5\u8bc6\u8fc1\u79fb", "\u5927\u8bed\u8a00\u6a21\u578b", "\u95ee\u7b54"], "num_comments": 2, "on_hf": true, "organization": "Omni Language AI Research", "pdf_url": "https://arxiv.org/pdf/2608.17050v2", "published_at": "2026-08-17", "score": 0.23, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.17050.png", "title": "Cross-Model Memory Transfer via Target-Side Reader Adaptation", "tldr": "\u51bb\u7ed3\u5916\u90e8\u8bb0\u5fc6\u53ef\u8de8\u6a21\u578b\u8fc1\u79fb\uff0c\u5173\u952e\u5728\u8bfb\u5934\u9002\u914d\u3002", "upvotes": 4, "what_it_is": "\u672c\u6587\u7814\u7a76 Engram \u5f0f\u54c8\u5e0c\u5916\u90e8\u8bb0\u5fc6\u5728\u4e0d\u540c\u5927\u6a21\u578b\u9aa8\u5e72\u4e4b\u95f4\u7684\u8fc1\u79fb\uff1a\u5c06\u6e90\u6a21\u578b\u8bad\u7ec3\u51fa\u7684\u8bb0\u5fc6\u8868\u51bb\u7ed3\u540e\u63a5\u5230\u76ee\u6807\u6a21\u578b\u4e0a\uff0c\u53ea\u8bad\u7ec3\u8f7b\u91cf reader\u3002\u7ed3\u679c\u8868\u660e\uff0c\u8bb0\u5fc6\u5185\u5bb9\u548c\u5bfb\u5740\u90fd\u91cd\u8981\uff0c\u4f46\u771f\u6b63\u53d1\u6325\u4f5c\u7528\u4f9d\u8d56\u4e0e\u76ee\u6807\u6a21\u578b\u5bf9\u9f50\u7684\u8bfb\u5934\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u5927\u6a21\u578b\u77e5\u8bc6\u590d\u7528\u63d0\u4f9b\u4e86\u4ecb\u4e8e\u68c0\u7d22\u589e\u5f3a\u4e0e\u53c2\u6570\u5fae\u8c03\u4e4b\u95f4\u7684\u8def\u5f84\uff1a\u5916\u90e8\u8bb0\u5fc6\u53ef\u4f5c\u4e3a\u53ef\u8fc1\u79fb\u3001\u53ef\u5ba1\u8ba1\u3001\u53ef\u66f4\u65b0\u7684\u77e5\u8bc6\u5de5\u4ef6\uff0c\u800c\u65e0\u9700\u628a\u77e5\u8bc6\u6df1\u5ea6\u7ed1\u5b9a\u8fdb\u6a21\u578b\u6743\u91cd\u3002"}, {"abstract": "AI co-scientists that generate hypotheses, retrieve related work, design experiments, execute code, and draft full papers are beginning to change how research is carried out. Despite this rapid progress, state-of-the-art systems remain researcher-agnostic: given a research goal, they optimize novelty, validity, or reviewer score while ignoring the individual scientist who will use the output. This overlooks a fundamental fact about research, namely, that what counts as novel, valuable, or feasible depends on the researcher, including their prior work, methodological repertoire, and the collaborators and communities in which they are embedded. In this work, we introduce the problem of personalized auto-research, which conditions every stage of the research process on a representation of the individual researcher. We argue that personalization is not a convenience layer, but rather the fundamental property that allows an AI system to serve as a genuine co-scientist rather than a generic instrument. To address this problem, we propose a general and flexible framework that threads a graph-grounded researcher context through retrieval, hypothesis search, experimentation, writing, and review. The framework consists of three fundamental components: (i) graph-grounded researcher representations, (ii) personalization across the full research pipeline, and (iii) evaluation grounded in the individual. Notably, we highlight a one-size-fits-all failure mode where distinct researchers issuing the same goal receive essentially the same research, erasing the tacit knowledge through which novel ideas arise. Finally, we discuss fundamental open problems and challenges.", "arxiv_id": "2608.14881", "arxiv_url": "https://arxiv.org/abs/2608.14881", "authors": ["Bo Ni", "Franck Dernoncourt", "Hongjie Chen", "Yu Wang", "Nesreen K. Ahmed", "Zhengzhong Tu", "Tyler Derr", "Ryan A. Rossi"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u4e2a\u6027\u5316\u81ea\u52a8\u79d1\u7814\u201d\u95ee\u9898\uff0c\u4e3b\u5f20AI\u5171\u79d1\u5b66\u5bb6\u5e94\u57fa\u4e8e\u5177\u4f53\u7814\u7a76\u8005\u7684\u80cc\u666f\u3001\u65b9\u6cd5\u504f\u597d\u3001\u5408\u4f5c\u7f51\u7edc\u4e0e\u5b66\u672f\u793e\u533a\u6765\u751f\u6210\u5047\u8bbe\u3001\u68c0\u7d22\u6587\u732e\u3001\u8bbe\u8ba1\u5b9e\u9a8c\u3001\u5199\u4f5c\u548c\u8bc4\u5ba1\u3002\u4f5c\u8005\u7ed9\u51fa\u4e00\u4e2a\u4ee5\u56fe\u7ed3\u6784\u7814\u7a76\u8005\u8868\u5f81\u8d2f\u7a7f\u5168\u6d41\u7a0b\u7684\u901a\u7528\u6846\u67b6\uff0c\u5e76\u8ba8\u8bba\u76f8\u5e94\u8bc4\u4f30\u65b9\u5f0f\u4e0e\u5f00\u653e\u6311\u6218\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14881", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6307\u51fa\u73b0\u6709\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u591a\u4e3a\u201c\u7814\u7a76\u8005\u65e0\u5173\u201d\uff0c\u540c\u4e00\u76ee\u6807\u4e0b\u4f1a\u7ed9\u4e0d\u540c\u7814\u7a76\u8005\u751f\u6210\u8fd1\u4e4e\u76f8\u540c\u7684\u7814\u7a76\u65b9\u6848\uff0c\u5ffd\u89c6\u4e2a\u4eba\u9690\u6027\u77e5\u8bc6\u4e0e\u53ef\u884c\u6027\u5dee\u5f02", "\u6846\u67b6\u5305\u542b\u4e09\u90e8\u5206\uff1a\u56fe\u9a71\u52a8\u7684\u7814\u7a76\u8005\u8868\u5f81\u3001\u8d2f\u7a7f\u68c0\u7d22\u5230\u8bc4\u5ba1\u7684\u5168\u6d41\u7a0b\u4e2a\u6027\u5316\u3001\u4ee5\u4e2a\u4f53\u7814\u7a76\u8005\u4e3a\u4e2d\u5fc3\u7684\u8bc4\u4f30", "\u5f3a\u8c03\u65b0\u9896\u6027\u3001\u4ef7\u503c\u548c\u53ef\u6267\u884c\u6027\u5e76\u975e\u7edd\u5bf9\u5c5e\u6027\uff0c\u800c\u53d6\u51b3\u4e8e\u7814\u7a76\u8005\u65e2\u6709\u5de5\u4f5c\u3001\u65b9\u6cd5\u80fd\u529b\u3001\u8d44\u6e90\u4e0e\u5b66\u672f\u5173\u7cfb\u7f51\u7edc"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u4e2a\u6027\u5316", "\u77e5\u8bc6\u56fe\u8c31"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14881v1", "published_at": "2026-08-14", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14881.png", "title": "Personalized Auto-Research: Towards a True AI Co-Scientist", "tldr": "\u63d0\u51fa\u9762\u5411\u4e2a\u4eba\u7814\u7a76\u8005\u7684AI\u5171\u79d1\u5b66\u5bb6\u6846\u67b6", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u4e2a\u6027\u5316\u81ea\u52a8\u79d1\u7814\u201d\u95ee\u9898\uff0c\u4e3b\u5f20AI\u5171\u79d1\u5b66\u5bb6\u5e94\u57fa\u4e8e\u5177\u4f53\u7814\u7a76\u8005\u7684\u80cc\u666f\u3001\u65b9\u6cd5\u504f\u597d\u3001\u5408\u4f5c\u7f51\u7edc\u4e0e\u5b66\u672f\u793e\u533a\u6765\u751f\u6210\u5047\u8bbe\u3001\u68c0\u7d22\u6587\u732e\u3001\u8bbe\u8ba1\u5b9e\u9a8c\u3001\u5199\u4f5c\u548c\u8bc4\u5ba1\u3002\u4f5c\u8005\u7ed9\u51fa\u4e00\u4e2a\u4ee5\u56fe\u7ed3\u6784\u7814\u7a76\u8005\u8868\u5f81\u8d2f\u7a7f\u5168\u6d41\u7a0b\u7684\u901a\u7528\u6846\u67b6\uff0c\u5e76\u8ba8\u8bba\u76f8\u5e94\u8bc4\u4f30\u65b9\u5f0f\u4e0e\u5f00\u653e\u6311\u6218\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u5c06AI\u5171\u79d1\u5b66\u5bb6\u7684\u6838\u5fc3\u76ee\u6807\u4ece\u201c\u751f\u6210\u9ad8\u5206\u7814\u7a76\u201d\u63a8\u8fdb\u5230\u201c\u8f85\u52a9\u7279\u5b9a\u7814\u7a76\u8005\u505a\u51fa\u9002\u5408\u81ea\u5df1\u7684\u7814\u7a76\u201d\uff0c\u4e3a\u672a\u6765\u79d1\u7814\u667a\u80fd\u4f53\u7684\u5efa\u6a21\u3001\u4ea4\u4e92\u548c\u8bc4\u4f30\u63d0\u51fa\u4e86\u66f4\u8d34\u8fd1\u771f\u5b9e\u79d1\u7814\u5b9e\u8df5\u7684\u65b9\u5411\u3002"}, {"abstract": "Graph neural networks are commonly described through family-specific equations whose notation obscures shared computations and structural differences. We introduce a common layer equation that represents covered architectures through seven components: an update domain, channel set, propagation bank, per-channel message maps, channel-fusion operator, ego/residual map, and update map. The central factorization separates where information moves, encoded by the propagation bank, from what moves, encoded by the message maps. Function-valued fillings extend the same equation across local message passing, attention, spectral filtering, global communication, relation-specific channels, higher-order domains, and geometric messages. We make this unification explicit and checkable through worked reductions of canonical layers and component assignments spanning seven nonexclusive architectural families. A fixed slot discipline assigns operations by computational role and defines the framework\u0027s coverage boundary. The decomposition also yields component-level theoretical insights: under endpoint-local messages and node-local updates, operator support bounds one-layer dependencies, and one-layer global mixing requires a full effective operator row under the stated hypotheses. The resulting framework organizes more than 200 architectures in a common design space, enables component-wise comparison and generation of structurally consistent architectures, and connects propagation choices to oversmoothing, oversquashing, heterophily, and expressivity. It further exposes the empirical inverse problem of mapping measurable graph and task properties to validated component choices.", "arxiv_id": "2608.16097", "arxiv_url": "https://arxiv.org/abs/2608.16097", "authors": ["Sai Karthik Navuluru", "Siddhartha Shankar Das", "Bo Ni", "Hongjie Chen", "Yu Wang", "Baris Coskunuzer", "Nesreen K. Ahmed", "Franck Dernoncourt", "Mahantesh Halappanavar", "Tyler Derr", "Ryan A. Rossi", "Lakshman Tamil"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u901a\u7528\u7684\u56fe\u795e\u7ecf\u7f51\u7edc\u5c42\u65b9\u7a0b\uff0c\u7528\u4e03\u4e2a\u7ec4\u4ef6\u523b\u753b\u4e0d\u540cGNN\u67b6\u6784\u3002\u8be5\u6846\u67b6\u5c06\u201c\u4fe1\u606f\u5728\u54ea\u91cc\u4f20\u64ad\u201d\u7684\u4f20\u64ad\u7b97\u5b50\u4e0e\u201c\u4f20\u64ad\u4ec0\u4e48\u4fe1\u606f\u201d\u7684\u6d88\u606f\u6620\u5c04\u89e3\u8026\uff0c\u5e76\u8986\u76d6\u6d88\u606f\u4f20\u9012\u3001\u6ce8\u610f\u529b\u3001\u8c31\u6ee4\u6ce2\u3001\u5168\u5c40\u901a\u4fe1\u3001\u9ad8\u9636\u4e0e\u51e0\u4f55\u6d88\u606f\u7b49\u591a\u7c7b\u6a21\u578b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16097", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7edf\u4e00\u5c42\u65b9\u7a0b\u5305\u542b\u66f4\u65b0\u57df\u3001\u901a\u9053\u96c6\u3001\u4f20\u64ad\u5e93\u3001\u9010\u901a\u9053\u6d88\u606f\u6620\u5c04\u3001\u901a\u9053\u878d\u5408\u3001ego/\u6b8b\u5dee\u6620\u5c04\u548c\u66f4\u65b0\u6620\u5c04\u4e03\u4e2a\u69fd\u4f4d\u3002", "\u901a\u8fc7\u5bf9\u7ecf\u5178\u5c42\u7684\u5f52\u7ea6\u548c\u7ec4\u4ef6\u5206\u914d\uff0c\u8986\u76d6\u4e03\u7c7b\u975e\u4e92\u65a5GNN\u67b6\u6784\uff0c\u5e76\u6574\u7406\u8d85\u8fc7200\u79cd\u67b6\u6784\u5230\u540c\u4e00\u8bbe\u8ba1\u7a7a\u95f4\u3002", "\u7ed9\u51fa\u7ec4\u4ef6\u7ea7\u7406\u8bba\u6d1e\u89c1\uff1a\u5728\u7aef\u70b9\u5c40\u90e8\u6d88\u606f\u548c\u8282\u70b9\u5c40\u90e8\u66f4\u65b0\u5047\u8bbe\u4e0b\uff0c\u7b97\u5b50\u652f\u6491\u9650\u5236\u5355\u5c42\u4f9d\u8d56\uff1b\u5355\u5c42\u5168\u5c40\u6df7\u5408\u9700\u8981\u6709\u6548\u7b97\u5b50\u884c\u5177\u5907\u5168\u652f\u6491\u3002"], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u6d88\u606f\u4f20\u9012", "\u8c31\u6ee4\u6ce2", "\u6a21\u578b\u7edf\u4e00"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16097v1", "published_at": "2026-08-17", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16097.png", "title": "Unifying Graph Neural Networks Through a Common Layer Equation", "tldr": "\u7528\u7edf\u4e00\u5c42\u65b9\u7a0b\u91cd\u6574GNN\u8bbe\u8ba1\u7a7a\u95f4", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u901a\u7528\u7684\u56fe\u795e\u7ecf\u7f51\u7edc\u5c42\u65b9\u7a0b\uff0c\u7528\u4e03\u4e2a\u7ec4\u4ef6\u523b\u753b\u4e0d\u540cGNN\u67b6\u6784\u3002\u8be5\u6846\u67b6\u5c06\u201c\u4fe1\u606f\u5728\u54ea\u91cc\u4f20\u64ad\u201d\u7684\u4f20\u64ad\u7b97\u5b50\u4e0e\u201c\u4f20\u64ad\u4ec0\u4e48\u4fe1\u606f\u201d\u7684\u6d88\u606f\u6620\u5c04\u89e3\u8026\uff0c\u5e76\u8986\u76d6\u6d88\u606f\u4f20\u9012\u3001\u6ce8\u610f\u529b\u3001\u8c31\u6ee4\u6ce2\u3001\u5168\u5c40\u901a\u4fe1\u3001\u9ad8\u9636\u4e0e\u51e0\u4f55\u6d88\u606f\u7b49\u591a\u7c7b\u6a21\u578b\u3002", "why_notable": "\u5b83\u628a\u5206\u6563\u7684GNN\u5bb6\u65cf\u7528\u53ef\u68c0\u67e5\u7684\u7edf\u4e00\u5f62\u5f0f\u8fde\u63a5\u8d77\u6765\uff0c\u6709\u52a9\u4e8e\u67b6\u6784\u6bd4\u8f83\u3001\u7cfb\u7edf\u5316\u751f\u6210\u65b0\u6a21\u578b\uff0c\u5e76\u5c06\u4f20\u64ad\u673a\u5236\u4e0e\u8fc7\u5e73\u6ed1\u3001\u8fc7\u538b\u7f29\u3001\u5f02\u914d\u6027\u548c\u8868\u8fbe\u80fd\u529b\u7b49\u6838\u5fc3\u95ee\u9898\u5173\u8054\u8d77\u6765\u3002"}, {"abstract": "Single-image rephotography aims to synthesize new shots of a scene from a single reference image with specified viewpoints, focal lengths, and photographic effects, which are intrinsically coupled in imaging. Existing methods typically treat these factors separately and struggle under joint control: novel-view synthesis may introduce geometric distortions under focal-length changes, while super-resolution and instruction-guided editing remain confined to 2D and cannot reliably extend detail restoration or appearance control to novel viewpoints. We attribute these limitations to imperfect single-image 3D reconstruction and the sampling limit of continuous focal-length enlargement. To reduce projection bias from geometric errors, we use implicitly transformed foundation-model features for robust target-view guidance. We further formulate focal-length enlargement as a geometry-guided super-resolution problem and exploit generative detail priors to recover details lost during sparse 3D resampling. Built on this 3D-aware generative backbone, we lift photographic-effect control from 2D filtering to 3D-aware appearance editing, preserving content consistency across viewpoints and focal lengths. These components form ReX-Shot, a geometry- and camera-grounded generative framework for single-image rephotography. To our knowledge, ReX-Shot is the first unified framework to jointly control viewpoint, focal length, and parameterized photographic effects from a single image. Experiments show that ReX-Shot outperforms representative baselines across all three controls while enabling near-real-time interactive rephotography.", "arxiv_id": "2608.18593", "arxiv_url": "https://arxiv.org/abs/2608.18593", "authors": ["Ruiqi Zhang", "Hao Zhu", "Wenhao Zhang", "Qi Zhang", "Junqi Shi", "Ming Lu", "Xun Cao", "Zhan Ma"], "brief": "ReX-Shot \u662f\u4e00\u4e2a\u51e0\u4f55\u4e0e\u76f8\u673a\u53c2\u6570\u9a71\u52a8\u7684\u5355\u56fe\u91cd\u62cd\u751f\u6210\u6846\u67b6\uff0c\u53ef\u4ece\u4e00\u5f20\u53c2\u8003\u56fe\u5408\u6210\u6307\u5b9a\u89c6\u89d2\u3001\u7126\u8ddd\u548c\u53c2\u6570\u5316\u6444\u5f71\u6548\u679c\u7684\u65b0\u753b\u9762\u3002\u5b83\u5c06\u65b0\u89c6\u89d2\u751f\u6210\u3001\u7126\u8ddd\u653e\u5927\u7ec6\u8282\u6062\u590d\u4e0e3D\u611f\u77e5\u5916\u89c2\u7f16\u8f91\u7edf\u4e00\u5230\u540c\u4e00\u751f\u6210\u5f0f\u6846\u67b6\u4e2d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18593", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7528\u9690\u5f0f\u53d8\u6362\u7684\u57fa\u7840\u6a21\u578b\u7279\u5f81\u63d0\u4f9b\u76ee\u6807\u89c6\u89d2\u5f15\u5bfc\uff0c\u964d\u4f4e\u5355\u56fe3D\u91cd\u5efa\u8bef\u5dee\u5e26\u6765\u7684\u6295\u5f71\u504f\u5dee", "\u5c06\u7126\u8ddd\u653e\u5927\u5efa\u6a21\u4e3a\u51e0\u4f55\u5f15\u5bfc\u7684\u8d85\u5206\u8fa8\u7387\u95ee\u9898\uff0c\u5229\u7528\u751f\u6210\u5f0f\u7ec6\u8282\u5148\u9a8c\u6062\u590d\u7a00\u758f3D\u91cd\u91c7\u6837\u4e2d\u4e22\u5931\u7684\u7eb9\u7406", "\u628a\u6444\u5f71\u6548\u679c\u63a7\u5236\u4ece2D\u6ee4\u955c\u63d0\u5347\u52303D\u611f\u77e5\u5916\u89c2\u7f16\u8f91\uff0c\u5728\u4e0d\u540c\u89c6\u89d2\u548c\u7126\u8ddd\u4e0b\u4fdd\u6301\u5185\u5bb9\u4e00\u81f4\u6027"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u4e09\u7ef4\u91cd\u5efa", "\u89c6\u89d2\u5408\u6210", "\u56fe\u50cf\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18593v1", "published_at": "2026-08-19", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ReX-Shot: Single-Image Rephotography via Geometry- and Camera-Grounded Generation", "tldr": "\u5355\u56fe\u5b9e\u73b0\u89c6\u89d2\u3001\u7126\u8ddd\u4e0e\u6444\u5f71\u6548\u679c\u8054\u5408\u91cd\u62cd", "upvotes": 0, "what_it_is": "ReX-Shot \u662f\u4e00\u4e2a\u51e0\u4f55\u4e0e\u76f8\u673a\u53c2\u6570\u9a71\u52a8\u7684\u5355\u56fe\u91cd\u62cd\u751f\u6210\u6846\u67b6\uff0c\u53ef\u4ece\u4e00\u5f20\u53c2\u8003\u56fe\u5408\u6210\u6307\u5b9a\u89c6\u89d2\u3001\u7126\u8ddd\u548c\u53c2\u6570\u5316\u6444\u5f71\u6548\u679c\u7684\u65b0\u753b\u9762\u3002\u5b83\u5c06\u65b0\u89c6\u89d2\u751f\u6210\u3001\u7126\u8ddd\u653e\u5927\u7ec6\u8282\u6062\u590d\u4e0e3D\u611f\u77e5\u5916\u89c2\u7f16\u8f91\u7edf\u4e00\u5230\u540c\u4e00\u751f\u6210\u5f0f\u6846\u67b6\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9996\u6b21\u5c06\u89c6\u89d2\u3001\u7126\u8ddd\u548c\u6444\u5f71\u6548\u679c\u4e09\u7c7b\u5f3a\u8026\u5408\u76f8\u673a\u63a7\u5236\u7edf\u4e00\u5230\u5355\u56fe\u91cd\u62cd\u6846\u67b6\u4e2d\uff0c\u5e76\u652f\u6301\u8fd1\u5b9e\u65f6\u4ea4\u4e92\uff0c\u9002\u5408\u56fe\u50cf\u7f16\u8f91\u3001\u865a\u62df\u6444\u5f71\u548c\u5185\u5bb9\u521b\u4f5c\u573a\u666f\u3002"}, {"abstract": "Existing VLMs have achieved strong performance in video understanding, yet they struggle with long-video spatiotemporal reasoning when target objects become invisible, often mistaking \"invisible\" for \"unknown\". We define this challenge as hidden-state spatiotemporal reasoning: inferring object states during prolonged invisible intervals from context interactions. To address this, we propose StateTrace, a novel object-centric framework that endows VideoLLMs with an explicit mechanism for hidden state reasoning in long videos. StateTrace builds a reusable spatiotemporal state memory that organizes object trajectories, inter-object relations, and state-transition events into a structured reasoning substrate. At inference time, it retrieves question-relevant state-evolution trajectories and converts them into compact reasoning cues, enabling the model to explicitly reason about why an object disappears, how its state evolves while invisible, and whether that state should persist at query time. We further build HSR-Bench, a diagnostic benchmark for hidden-state reasoning, containing 1,427 video-QA samples from 1,384 unique videos. Extensive experiments across multiple VideoLLMs show that StateTrace consistently improves performance on both public benchmarks and HSR-Bench (e.g., improving VideoLLaMA3 from 39.6 to 64.2 on HSR-Bench).", "arxiv_id": "2608.18532", "arxiv_url": "https://arxiv.org/abs/2608.18532", "authors": ["Yu Han", "Wenhao Li", "Yichao Cao", "Hongyan Xu", "Shuo Yang", "Shan You", "Xiu Su"], "brief": "\u8bba\u6587\u63d0\u51fa StateTrace\uff0c\u4e00\u4e2a\u4ee5\u7269\u4f53\u4e3a\u4e2d\u5fc3\u7684\u957f\u89c6\u9891\u65f6\u7a7a\u63a8\u7406\u6846\u67b6\uff0c\u7528\u7ed3\u6784\u5316\u72b6\u6001\u8bb0\u5fc6\u5e2e\u52a9 VideoLLM \u63a8\u65ad\u7269\u4f53\u5728\u4e0d\u53ef\u89c1\u671f\u95f4\u7684\u72b6\u6001\u53d8\u5316\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 HSR-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u9690\u85cf\u72b6\u6001\u65f6\u7a7a\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18532", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5b9a\u4e49\u201c\u9690\u85cf\u72b6\u6001\u65f6\u7a7a\u63a8\u7406\u201d\u95ee\u9898\uff1a\u5f53\u76ee\u6807\u7269\u4f53\u957f\u65f6\u95f4\u4e0d\u53ef\u89c1\u65f6\uff0c\u6a21\u578b\u9700\u6839\u636e\u4e0a\u4e0b\u6587\u4ea4\u4e92\u63a8\u65ad\u5176\u72b6\u6001\uff0c\u800c\u4e0d\u662f\u7b80\u5355\u5224\u4e3a\u672a\u77e5", "\u6784\u5efa\u53ef\u590d\u7528\u7684\u65f6\u7a7a\u72b6\u6001\u8bb0\u5fc6\uff0c\u7ec4\u7ec7\u7269\u4f53\u8f68\u8ff9\u3001\u7269\u4f53\u95f4\u5173\u7cfb\u548c\u72b6\u6001\u8f6c\u79fb\u4e8b\u4ef6\uff0c\u4f5c\u4e3a\u7ed3\u6784\u5316\u63a8\u7406\u57fa\u7840", "\u5728 HSR-Bench \u4e0a\u663e\u8457\u63d0\u5347\u591a\u79cd VideoLLM \u8868\u73b0\uff0c\u4f8b\u5982 VideoLLaMA3 \u4ece 39.6 \u63d0\u5347\u5230 64.2"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u65f6\u7a7a\u63a8\u7406", "\u957f\u89c6\u9891"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18532v1", "published_at": "2026-08-19", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "StateTrace: An Object-Centric Framework for Hidden-State Spatiotemporal Reasoning in Long Videos", "tldr": "\u9762\u5411\u957f\u89c6\u9891\u4e0d\u53ef\u89c1\u7269\u4f53\u7684\u663e\u5f0f\u72b6\u6001\u63a8\u7406\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa StateTrace\uff0c\u4e00\u4e2a\u4ee5\u7269\u4f53\u4e3a\u4e2d\u5fc3\u7684\u957f\u89c6\u9891\u65f6\u7a7a\u63a8\u7406\u6846\u67b6\uff0c\u7528\u7ed3\u6784\u5316\u72b6\u6001\u8bb0\u5fc6\u5e2e\u52a9 VideoLLM \u63a8\u65ad\u7269\u4f53\u5728\u4e0d\u53ef\u89c1\u671f\u95f4\u7684\u72b6\u6001\u53d8\u5316\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 HSR-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u9690\u85cf\u72b6\u6001\u65f6\u7a7a\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u957f\u89c6\u9891\u7406\u89e3\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u201c\u4e0d\u53ef\u89c1\u4f46\u53ef\u63a8\u65ad\u201d\u573a\u666f\uff0c\u63d0\u4f9b\u4e86\u663e\u5f0f\u72b6\u6001\u8bb0\u5fc6\u4e0e\u68c0\u7d22\u63a8\u7406\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u89c6\u9891\u6a21\u578b\u5728\u906e\u6321\u3001\u79bb\u5c4f\u3001\u72b6\u6001\u6301\u7eed\u6027\u7b49\u771f\u5b9e\u590d\u6742\u573a\u666f\u4e0b\u7684\u53ef\u9760\u6027\u3002"}, {"abstract": "We introduce Accelerating Dexterity via Pre-Training (ADEPT), a large-scale reinforcement learning (RL) framework for learning sim-to-real transferable dexterity across high degree-of-freedom (DoF) robot embodiments that can solve long-horizon tasks directly from raw visuo-tactile perception. ADEPT pretrains a dexterous policy on a generic object reposing task, then post-trains downstream policies with this pretrained behavior as a prior. ADEPT enables learning new behaviors that are otherwise difficult to discover from scratch on multi-fingered robots and avoids learning the same set of skills over again for every new downstream task. The pretrained policy zero-shots the reposing phase of downstream tasks, but na\u00efve RL fine-tuning rapidly degrades this capability during transfer. We address this with a stable post-training recipe combining behavior-cloning distillation, critic warm-up, and conservative on-policy updates. To safely exploit the full kinematic dexterity, we introduce a joint-space Geometric Fabric that mediates between the RL policy and the robot. We distill post-trained teachers into perceptive students that zero-shot sim-to-real transfer on two embodiments: a 23 DoF Kuka-Allegro with two RGB cameras, and a 29 DoF Flexiv-Sharpa with two RGB cameras and five vision-based tactile sensors, and can solve long-horizon tasks from challenging initial states with dexterity at human-level speed.", "arxiv_id": "2608.19182", "arxiv_url": "https://arxiv.org/abs/2608.19182", "authors": ["Jayjun Lee", "Jessica Yin", "Asif Rana", "Nicholas Blauch", "Sam Mady", "Mohak Bhardwaj", "Nima Fazeli", "Nathan Ratliff", "Karl Van Wyk", "Ankur Handa"], "brief": "ADEPT \u662f\u4e00\u4e2a\u5927\u89c4\u6a21\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5148\u5728\u901a\u7528\u7269\u4f53\u91cd\u5b9a\u4f4d\u4efb\u52a1\u4e0a\u9884\u8bad\u7ec3\u7075\u5de7\u7b56\u7565\uff0c\u518d\u5c06\u5176\u4f5c\u4e3a\u5148\u9a8c\u7528\u4e8e\u4e0b\u6e38\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u540e\u8bad\u7ec3\u3002\u7cfb\u7edf\u53ef\u4ece\u539f\u59cb\u89c6\u89c9-\u89e6\u89c9\u611f\u77e5\u5b66\u4e60\uff0c\u5e76\u5728\u9ad8\u81ea\u7531\u5ea6\u591a\u6307\u673a\u5668\u4eba\u4e0a\u5b9e\u73b0\u4eff\u771f\u5230\u73b0\u5b9e\u8fc1\u79fb\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19182", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u7a33\u5b9a\u540e\u8bad\u7ec3\u6d41\u7a0b\uff1a\u884c\u4e3a\u514b\u9686\u84b8\u998f\u3001critic \u9884\u70ed\u4e0e\u4fdd\u5b88 on-policy \u66f4\u65b0\uff0c\u907f\u514d\u5fae\u8c03\u65f6\u9057\u5fd8\u9884\u8bad\u7ec3\u91cd\u5b9a\u4f4d\u80fd\u529b", "\u5f15\u5165\u5173\u8282\u7a7a\u95f4 Geometric Fabric\uff0c\u5728 RL \u7b56\u7565\u4e0e\u673a\u5668\u4eba\u4e4b\u95f4\u8fdb\u884c\u5b89\u5168\u534f\u8c03\uff0c\u5145\u5206\u5229\u7528\u9ad8\u81ea\u7531\u5ea6\u8fd0\u52a8\u80fd\u529b", "\u5728 23 DoF Kuka-Allegro \u4e0e 29 DoF Flexiv-Sharpa \u4e0a\u96f6\u6837\u672c sim-to-real\uff0c\u7ed3\u5408 RGB \u4e0e\u89c6\u89c9\u89e6\u89c9\u4f20\u611f\u5b8c\u6210\u590d\u6742\u521d\u59cb\u72b6\u6001\u4e0b\u7684\u957f\u7a0b\u4efb\u52a1"], "keywords": ["\u673a\u5668\u4eba", "\u5f3a\u5316\u5b66\u4e60", "\u7075\u5de7\u64cd\u4f5c", "\u4eff\u771f\u5230\u73b0\u5b9e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19182v1", "published_at": "2026-08-19", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ADEPT: Accelerating Dexterity via Pre-Training and Post-Training using Reinforcement Learning", "tldr": "\u7528\u9884\u8bad\u7ec3\u4e0e\u540e\u8bad\u7ec3\u52a0\u901f\u7075\u5de7\u673a\u5668\u4eba\u64cd\u4f5c", "upvotes": 0, "what_it_is": "ADEPT \u662f\u4e00\u4e2a\u5927\u89c4\u6a21\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5148\u5728\u901a\u7528\u7269\u4f53\u91cd\u5b9a\u4f4d\u4efb\u52a1\u4e0a\u9884\u8bad\u7ec3\u7075\u5de7\u7b56\u7565\uff0c\u518d\u5c06\u5176\u4f5c\u4e3a\u5148\u9a8c\u7528\u4e8e\u4e0b\u6e38\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u540e\u8bad\u7ec3\u3002\u7cfb\u7edf\u53ef\u4ece\u539f\u59cb\u89c6\u89c9-\u89e6\u89c9\u611f\u77e5\u5b66\u4e60\uff0c\u5e76\u5728\u9ad8\u81ea\u7531\u5ea6\u591a\u6307\u673a\u5668\u4eba\u4e0a\u5b9e\u73b0\u4eff\u771f\u5230\u73b0\u5b9e\u8fc1\u79fb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u7075\u5de7\u64cd\u4f5c\u4e2d\u201c\u9884\u8bad\u7ec3\u6280\u80fd\u5148\u9a8c + \u7a33\u5b9a\u540e\u8bad\u7ec3\u201d\u7684\u53ef\u6269\u5c55\u8303\u5f0f\uff0c\u51cf\u5c11\u6bcf\u4e2a\u65b0\u4efb\u52a1\u4ece\u96f6\u5b66\u4e60\u7684\u6210\u672c\uff0c\u5e76\u63a8\u52a8\u9ad8\u81ea\u7531\u5ea6\u673a\u5668\u4eba\u5728\u771f\u5b9e\u4e16\u754c\u4e2d\u4ee5\u63a5\u8fd1\u4eba\u7c7b\u901f\u5ea6\u5b8c\u6210\u590d\u6742\u64cd\u4f5c\u3002"}, {"abstract": "Seasonal precipitation anomalies are largely regulated by atmospheric circulation, which dynamical models predict with greater reliability than precipitation itself. Here, we employ a deep learning model that translates dynamical circulation predictions into precipitation estimates. Predictions initialized from March to May consistently indicate a dry anomaly over central China in summer 2026. Retrospective evaluations revealed higher predictive skill in the analogue years, which also tended to feature central equatorial Pacific warming persisting from the preceding winter into summer. This warming favors an anomalous cyclonic circulation over the western North Pacific-South China Sea-South China region, which induces northerly winds and moisture divergence that jointly suppress rainfall over central China. Supporting this mechanism, layer-wise relevance propagation (LRP) independently identifies these northerly winds as the dominant driver of the prediction among all model inputs. Perturbation tests supported this attribution: removing LRP-identified features effectively eliminates the dry anomaly. Our framework thus provides physically interpretable explanations for AI-derived regional climate projections, facilitating evidence-based assessment before observational data become available.", "arxiv_id": "2608.19163", "arxiv_url": "https://arxiv.org/abs/2608.19163", "authors": ["Anran Wang", "Wen Shi", "Yong Luo", "Jianbin Huang", "Lijuan Chen", "Junhu Zhao", "Weixin Jin", "Huihui Yuan"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u5c06\u5927\u6c14\u73af\u6d41\u52a8\u529b\u9884\u62a5\u8f6c\u5316\u4e3a\u964d\u6c34\u4f30\u8ba1\u7684\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u5e76\u9884\u6d4b2026\u5e74\u590f\u5b63\u4e2d\u56fd\u4e2d\u90e8\u5c06\u51fa\u73b0\u5e72\u65f1\u5f02\u5e38\u3002\u901a\u8fc7LRP\u5f52\u56e0\u548c\u6270\u52a8\u5b9e\u9a8c\uff0c\u6a21\u578b\u7ed9\u51fa\u4e86\u4e0e\u7269\u7406\u673a\u5236\u4e00\u81f4\u7684\u53ef\u89e3\u91ca\u8bc1\u636e\u3002", "categories": ["physics.ao-ph", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19163", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["3\u6708\u81f35\u6708\u521d\u59cb\u5316\u7684\u9884\u6d4b\u5747\u4e00\u81f4\u6307\u54112026\u5e74\u590f\u5b63\u534e\u4e2d\u504f\u65f1\uff0c\u63d0\u9ad8\u4e86\u9884\u62a5\u4fe1\u53f7\u7684\u7a33\u5065\u6027\u3002", "\u56de\u62a5\u8bc4\u4f30\u663e\u793a\uff0c\u5728\u7c7b\u4f3c\u5e74\u4efd\u6a21\u578b\u6280\u5de7\u66f4\u9ad8\uff0c\u8fd9\u4e9b\u5e74\u4efd\u5e38\u4f34\u968f\u8d64\u9053\u4e2d\u592a\u5e73\u6d0b\u589e\u6696\u4ece\u524d\u51ac\u6301\u7eed\u5230\u590f\u5b63\u3002", "LRP\u8bc6\u522b\u51fa\u897f\u5317\u592a\u5e73\u6d0b\u2014\u5357\u6d77\u2014\u534e\u5357\u5f02\u5e38\u6c14\u65cb\u5bfc\u81f4\u7684\u5317\u98ce\u4e0e\u6c34\u6c7d\u8f90\u6563\u662f\u6291\u5236\u534e\u4e2d\u964d\u6c34\u7684\u4e3b\u5bfc\u56e0\u7d20\uff0c\u79fb\u9664\u76f8\u5173\u7279\u5f81\u540e\u5e72\u65f1\u4fe1\u53f7\u6d88\u5931\u3002"], "keywords": ["\u6c14\u5019\u9884\u6d4b", "\u53ef\u89e3\u91caAI", "\u6df1\u5ea6\u5b66\u4e60", "\u5927\u6c14\u79d1\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19163v1", "published_at": "2026-08-19", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Interpretable AI predicts a 2026 summer dry anomaly in central China", "tldr": "\u53ef\u89e3\u91caAI\u9884\u8b662026\u534e\u4e2d\u590f\u5b63\u504f\u65f1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u5c06\u5927\u6c14\u73af\u6d41\u52a8\u529b\u9884\u62a5\u8f6c\u5316\u4e3a\u964d\u6c34\u4f30\u8ba1\u7684\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u5e76\u9884\u6d4b2026\u5e74\u590f\u5b63\u4e2d\u56fd\u4e2d\u90e8\u5c06\u51fa\u73b0\u5e72\u65f1\u5f02\u5e38\u3002\u901a\u8fc7LRP\u5f52\u56e0\u548c\u6270\u52a8\u5b9e\u9a8c\uff0c\u6a21\u578b\u7ed9\u51fa\u4e86\u4e0e\u7269\u7406\u673a\u5236\u4e00\u81f4\u7684\u53ef\u89e3\u91ca\u8bc1\u636e\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e0d\u4ec5\u7ed9\u51fa\u5177\u4f53\u7684\u533a\u57df\u6c14\u5019\u98ce\u9669\u9884\u8b66\uff0c\u8fd8\u5c55\u793a\u4e86\u5982\u4f55\u7528\u53ef\u89e3\u91caAI\u628a\u5b63\u8282\u6c14\u5019\u9884\u6d4b\u4e0e\u53ef\u9a8c\u8bc1\u7684\u5927\u6c14\u7269\u7406\u673a\u5236\u8fde\u63a5\u8d77\u6765\uff0c\u6709\u52a9\u4e8e\u5728\u5b9e\u6d4b\u6570\u636e\u51fa\u73b0\u524d\u8fdb\u884c\u98ce\u9669\u8bc4\u4f30\u548c\u51b3\u7b56\u652f\u6301\u3002"}, {"abstract": "Language-model agents can communicate through continuous hidden states that are invisible in public transcripts, creating opportunities for covert harmful coordination. We introduce Verifiable Latent Alignments (VLA), an activation-aware framework for monitoring and steering these private communication channels. For every monitored decision, VLA links the private latent-state record and channel status to the resulting public action using a shared event identifier, enabling matched causal analysis. Our first contribution is a neutral-only three-layer monitor combining representation anomaly detection, counterfactual action-distribution influence, and sparse-autoencoder interpretation support. Our second contribution is a steerability framework spanning black-box behavioral instructions and white-box matched-neutral counterfactuals. Our third contribution is an evaluation on a controlled multi-agent auction benchmark covering homogeneous and heterogeneous model pairs, many-agent scalability, and intervention effectiveness. The sequential monitor achieves mean area under the receiver operating characteristic curve (AUROC) of 0.993 for homogeneous agents and 0.854 for heterogeneous pairs when text- and latent-collusion rows are pooled as positives. In Qwen3-0.6B auctions with 25-100 bidders, monitoring requires only a small normalized load relative to all possible directed pairs, while full white-box steering achieves 100% bid-distribution recovery and reduces collusive low-bid behavior by 47.3 percentage points. Because full white-box steering replays the matched neutral counterfactual, its exact recovery is a sanity check by construction. Overall, the controlled study shows that the evaluated private channel attacks can be monitored without training the primary monitor on attack examples and mitigated when matched counterfactual access is available.", "arxiv_id": "2608.19161", "arxiv_url": "https://arxiv.org/abs/2608.19161", "authors": ["Ramneet Kaur", "Pradyumna Chari", "Ramesh Raskar", "Jugad Singh", "Sumit Kumar Jha", "Anirban Roy"], "brief": "\u8bba\u6587\u63d0\u51fa Verifiable Latent Alignments\uff08VLA\uff09\uff0c\u7528\u4e8e\u53d1\u73b0\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u901a\u8fc7\u8fde\u7eed\u9690\u85cf\u72b6\u6001\u8fdb\u884c\u7684\u4e0d\u53ef\u89c1\u534f\u540c\u901a\u4fe1\u3002\u5b83\u5c06\u79c1\u6709 latent \u8bb0\u5f55\u3001\u901a\u9053\u72b6\u6001\u4e0e\u516c\u5f00\u52a8\u4f5c\u7ed1\u5b9a\u5230\u540c\u4e00\u4e8b\u4ef6\u6807\u8bc6\uff0c\u5b9e\u73b0\u56e0\u679c\u5339\u914d\u76d1\u6d4b\u4e0e\u5e72\u9884\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19161", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u51fa\u4e09\u5c42\u201c\u4ec5\u4e2d\u6027\u6837\u672c\u201d\u76d1\u6d4b\u5668\uff1a\u8868\u793a\u5f02\u5e38\u68c0\u6d4b\u3001\u53cd\u4e8b\u5b9e\u52a8\u4f5c\u5206\u5e03\u5f71\u54cd\u5206\u6790\u3001\u7a00\u758f\u81ea\u7f16\u7801\u5668\u89e3\u91ca\u652f\u6301\uff0c\u65e0\u9700\u7528\u653b\u51fb\u6837\u672c\u8bad\u7ec3\u4e3b\u76d1\u6d4b\u5668", "\u6784\u5efa\u4ece\u9ed1\u76d2\u884c\u4e3a\u6307\u4ee4\u5230\u767d\u76d2\u5339\u914d\u4e2d\u6027\u53cd\u4e8b\u5b9e\u7684\u53ef\u63a7\u5e72\u9884\u6846\u67b6\uff0c\u7528\u4e8e\u524a\u5f31 latent collusion", "\u5728\u591a\u667a\u80fd\u4f53\u62cd\u5356\u57fa\u51c6\u4e0a\u8bc4\u4f30\uff1a\u540c\u6784\u667a\u80fd\u4f53 AUROC \u8fbe 0.993\uff0c\u5f02\u6784\u6a21\u578b\u5bf9\u4e3a 0.854\uff1bQwen3-0.6B \u7684 25-100 \u6295\u6807\u8005\u573a\u666f\u4e2d\u767d\u76d2\u5e72\u9884\u4f7f\u4f4e\u4ef7\u5408\u8c0b\u884c\u4e
