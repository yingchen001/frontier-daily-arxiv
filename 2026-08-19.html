6\uff0c\u5728\u4e09\u4e2a\u533b\u5b66\u5f71\u50cf\u6570\u636e\u96c6\u4e0a\u751f\u6210\u8d28\u91cf\u4f18\u4e8e\u73b0\u6709\u53cd\u4e8b\u5b9e\u89e3\u91ca\u65b9\u6cd5\uff0c\u4e14\u66f4\u4e0d\u6613\u53d7\u5206\u7c7b\u5668\u504f\u5dee\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurately extracting nuanced, contextualized data from research articles is laborious and time intensive. Here, we investigate the performance of frontier, browser-based large language models (LLMs) to extract highly contextualized information. We demonstrate four escalating workflows, 1) given an expert curated prompt and research articles, most frontier LLMs perform well at data extraction, however can struggle with interpreting scientific context and nuance, 2) given simple instructions, LLMs can author their own prompts which were almost as eNective as expert-written prompts, 3) autonomous discovery of research literature was diNicult, agents either missed or hallucinated references, and 4) LLMs can create new datasets from published guidelines that closely match human-expert judges, but still require a human-in-the-loop. Together, these findings define an auditable division of labour in which experts specify the evidence standard, models cross-check repeated extractions and researchers resolve disputed cases, providing a practical route to scaling scientific data curation without relinquishing expert oversight.", "arxiv_id": "2608.19025", "arxiv_url": "https://arxiv.org/abs/2608.19025", "authors": ["Valentin Romanov", "Monique Bax", "Steven Niederer"], "brief": "\u7814\u7a76\u8bc4\u4f30\u524d\u6cbf\u6d4f\u89c8\u5668\u5927\u8bed\u8a00\u6a21\u578b\u4ece\u79d1\u7814\u8bba\u6587\u4e2d\u62bd\u53d6\u590d\u6742\u8bed\u5883\u5316\u6570\u636e\u7684\u80fd\u529b\uff0c\u53d1\u73b0\u4e13\u5bb6\u63d0\u793a\u4e0b\u6548\u679c\u8f83\u597d\uff0c\u6a21\u578b\u81ea\u751f\u6210\u63d0\u793a\u4e5f\u63a5\u8fd1\u4e13\u5bb6\u63d0\u793a\u3002\u81ea\u4e3b\u6587\u732e\u53d1\u73b0\u4ecd\u5bb9\u6613\u6f0f\u5f15\u6216\u5e7b\u89c9\uff0c\u4f46\u901a\u8fc7\u8de8\u6a21\u578b\u91cd\u590d\u62bd\u53d6\u4e0e\u5171\u8bc6\u3001\u4eba\u5de5\u590d\u6838\u4e89\u8bae\u9879\uff0c\u53ef\u8f83\u53ef\u9760\u5730\u6269\u5c55\u79d1\u5b66\u6570\u636e\u6574\u7406\u6d41\u7a0b\u3002", "categories": ["cs.AI", "cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19025", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u62bd\u53d6", "\u79d1\u5b66\u6587\u732e", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19025v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Self-prompting and cross-model consensus enable reproducible data extraction from scientific literature with large language models", "tldr": "\u7814\u7a76\u8bc4\u4f30\u524d\u6cbf\u6d4f\u89c8\u5668\u5927\u8bed\u8a00\u6a21\u578b\u4ece\u79d1\u7814\u8bba\u6587\u4e2d\u62bd\u53d6\u590d\u6742\u8bed\u5883\u5316\u6570\u636e\u7684\u80fd\u529b\uff0c\u53d1\u73b0\u4e13\u5bb6\u63d0\u793a\u4e0b\u6548\u679c\u8f83\u597d\uff0c\u6a21\u578b\u81ea\u751f\u6210\u63d0\u793a\u4e5f\u63a5\u8fd1\u4e13\u5bb6\u63d0\u793a\u3002\u81ea\u4e3b\u6587\u732e\u53d1\u73b0\u4ecd\u5bb9\u6613\u6f0f\u5f15\u6216\u5e7b\u89c9\uff0c\u4f46\u901a\u8fc7\u8de8\u6a21\u578b\u91cd\u590d\u62bd\u53d6\u4e0e\u5171\u8bc6\u3001\u4eba\u5de5\u590d\u6838\u4e89\u8bae\u9879\uff0c\u53ef\u8f83\u53ef\u9760\u5730\u6269\u5c55\u79d1\u5b66\u6570\u636e\u6574\u7406\u6d41\u7a0b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous vehicles depend on fast and reliable perception systems to detect surrounding vehicles, pedestrians, cyclists, traffic signs, and other road objects in real time. This paper presents a comprehensive survey and analysis of one-stage object detectors for autonomous driving rather than an implementation of a new detection system. The survey reviews the evolution of major one-stage detectors, including YOLOv1, SSD, RetinaNet, EfficientDet, anchor-free detectors such as FCOS and CenterNet, and recent real-time models such as YOLOv10. It compares these architectures through their design choices, feature-fusion strategies, loss functions, deployment trade-offs, and reported benchmark performance. The paper also summarizes commonly used autonomous-driving datasets, evaluation metrics, open challenges, and future research directions. Overall, this survey highlights how one-stage detectors balance speed, accuracy, efficiency, and robustness, while also emphasizing the remaining gap between benchmark results and dependable real-world autonomous-driving performance.", "arxiv_id": "2608.19014", "arxiv_url": "https://arxiv.org/abs/2608.19014", "authors": ["Jonel Roman", "Ryan Sirjue", "Peter Nguyen", "Daniel Krutky", "Juan Jesus", "Sudip Dhakal"], "brief": "\u672c\u6587\u7efc\u8ff0\u4e86\u81ea\u52a8\u9a7e\u9a76\u4e2d\u7684\u4e00\u9636\u6bb5\u76ee\u6807\u68c0\u6d4b\u5668\uff0c\u6db5\u76d6 YOLO\u3001SSD\u3001RetinaNet\u3001EfficientDet\u3001FCOS\u3001CenterNet \u5230 YOLOv10 \u7b49\u6a21\u578b\u7684\u53d1\u5c55\u4e0e\u8bbe\u8ba1\u53d6\u820d\u3002\u8bba\u6587\u6bd4\u8f83\u4e86\u7279\u5f81\u878d\u5408\u3001\u635f\u5931\u51fd\u6570\u3001\u90e8\u7f72\u6548\u7387\u548c\u57fa\u51c6\u8868\u73b0\uff0c\u5e76\u603b\u7ed3\u6570\u636e\u96c6\u3001\u8bc4\u4f30\u6307\u6807\u4e0e\u771f\u5b9e\u9053\u8def\u5e94\u7528\u4e2d\u7684\u6311\u6218\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19014", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u81ea\u52a8\u9a7e\u9a76", "\u5b9e\u65f6\u611f\u77e5", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19014v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One-Stage Object Detectors in Autonomous Driving", "tldr": "\u672c\u6587\u7efc\u8ff0\u4e86\u81ea\u52a8\u9a7e\u9a76\u4e2d\u7684\u4e00\u9636\u6bb5\u76ee\u6807\u68c0\u6d4b\u5668\uff0c\u6db5\u76d6 YOLO\u3001SSD\u3001RetinaNet\u3001EfficientDet\u3001FCOS\u3001CenterNet \u5230 YOLOv10 \u7b49\u6a21\u578b\u7684\u53d1\u5c55\u4e0e\u8bbe\u8ba1\u53d6\u820d\u3002\u8bba\u6587\u6bd4\u8f83\u4e86\u7279\u5f81\u878d\u5408\u3001\u635f\u5931\u51fd\u6570\u3001\u90e8\u7f72\u6548\u7387\u548c\u57fa\u51c6\u8868\u73b0\uff0c\u5e76\u603b\u7ed3\u6570\u636e\u96c6\u3001\u8bc4\u4f30\u6307\u6807\u4e0e\u771f\u5b9e\u9053\u8def\u5e94\u7528\u4e2d\u7684\u6311\u6218\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Continual learning has largely been model-centric, treating model parameters as the state that changes with sequential experience. Modern agents can also adapt through a harness of prompts, memories, tools, skills, and routing rules. Because these contents jointly shape later execution, a harness update can disrupt previously reliable behavior even when the model is frozen. This raises a new question: how can an agent continually improve its state outside the model while retaining behavior acquired earlier? We formulate Harness Continual Learning (HCL), a new continual learning paradigm in which the harness evolves around a frozen foundation model, and define the resulting loss of earlier behavior as harness-level forgetting. We instantiate HCL with four execution-facing components: the Task Interface, Experience Memory, Capability Map, and Adaptive Router. We further introduce guarded harness evolution to separate update generation from state commitment. A Continual Optimizer proposes candidate harnesses from post-execution feedback, and a Continual Evaluator commits the resulting candidate harness only after checking current improvement, historical retention, and validity. Experiments on textual reasoning, multimodal perception, and open-world interaction demonstrate capability accumulation and failure recovery, with relative gains exceeding 10% over corresponding baselines in multiple settings. Component ablations assess the contribution of each harness component, while controlled retention sweeps reveal measurable harness-level forgetting and show that the stability--plasticity trade-off can be explicitly adjusted.", "arxiv_id": "2608.19013", "arxiv_url": "https://arxiv.org/abs/2608.19013", "authors": ["Borui Kang", "Jinrui Gu", "Junhan Lv", "Wenbin Li", "Lei Wang", "Yang Gao"], "brief": "\u8bba\u6587\u63d0\u51fa Harness Continual Learning\uff08HCL\uff09\uff0c\u5c06\u6301\u7eed\u5b66\u4e60\u4ece\u6a21\u578b\u53c2\u6570\u6269\u5c55\u5230\u51bb\u7ed3\u57fa\u7840\u6a21\u578b\u5916\u90e8\u7684\u63d0\u793a\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u3001\u6280\u80fd\u4e0e\u8def\u7531\u7b49\u201c\u6267\u884c\u6846\u67b6\u201d\u3002\u65b9\u6cd5\u901a\u8fc7\u6301\u7eed\u4f18\u5316\u5668\u751f\u6210\u5019\u9009\u6846\u67b6\u3001\u6301\u7eed\u8bc4\u4f30\u5668\u68c0\u67e5\u6539\u8fdb\u3001\u5386\u53f2\u4fdd\u6301\u4e0e\u6709\u6548\u6027\u540e\u518d\u63d0\u4ea4\uff0c\u5728\u6587\u672c\u63a8\u7406\u3001\u591a\u6a21\u6001\u611f\u77e5\u548c\u5f00\u653e\u4e16\u754c\u4ea4\u4e92\u4e2d\u76f8\u5bf9\u57fa\u7ebf\u63d0\u5347\u8d85\u8fc710%\uff0c\u5e76\u63ed\u793a\u53ef\u8c03\u7684\u7a33\u5b9a\u6027-\u53ef\u5851\u6027\u6743\u8861\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19013", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u8bb0\u5fc6", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19013v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Harness Continual Learning: Continual Adaptation Beyond Model Parameters", "tldr": "\u8bba\u6587\u63d0\u51fa Harness Continual Learning\uff08HCL\uff09\uff0c\u5c06\u6301\u7eed\u5b66\u4e60\u4ece\u6a21\u578b\u53c2\u6570\u6269\u5c55\u5230\u51bb\u7ed3\u57fa\u7840\u6a21\u578b\u5916\u90e8\u7684\u63d0\u793a\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u3001\u6280\u80fd\u4e0e\u8def\u7531\u7b49\u201c\u6267\u884c\u6846\u67b6\u201d\u3002\u65b9\u6cd5\u901a\u8fc7\u6301\u7eed\u4f18\u5316\u5668\u751f\u6210\u5019\u9009\u6846\u67b6\u3001\u6301\u7eed\u8bc4\u4f30\u5668\u68c0\u67e5\u6539\u8fdb\u3001\u5386\u53f2\u4fdd\u6301\u4e0e\u6709\u6548\u6027\u540e\u518d\u63d0\u4ea4\uff0c\u5728\u6587\u672c\u63a8\u7406\u3001\u591a\u6a21\u6001\u611f\u77e5\u548c\u5f00\u653e\u4e16\u754c\u4ea4\u4e92\u4e2d\u76f8\u5bf9\u57fa\u7ebf\u63d0\u5347\u8d85\u8fc710%\uff0c\u5e76\u63ed\u793a\u53ef\u8c03\u7684\u7a33\u5b9a\u6027-\u53ef\u5851\u6027\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mechanisms for dynamically converting cyber threat intelligence (CTI) into actionable detection capabilities are necessary due to the rapid evolution of Advanced Persistent Threats (APTs). Sigma rules are an essential part of contemporary threat detection workflows because they offer a platform-independent framework for expressing detection logic that can be converted into particular queries across SIEM systems. Conventional techniques for manually crafting Sigma rules are prone to mistakes, and necessitate extensive knowledge, which restricts their scalability. Although there are open-source and industry-maintained Sigma rule repositories, they often fail to keep pace with emerging threats and require frequent customization to fit diverse operational environments. This emphasizes the necessity of dynamic rule generation that is adapted to evolving attack techniques as well as particular use cases. In this work, we design AUTOSIGMA, an automated solution for transforming unstructured CTI reports into relevant Sigma rules. Rather than relying solely on language models, AUTOSIGMA leverages a structured knowledge base to enrich partial inputs, matches the enriched content against a repository of existing Sigma rules, and then employs an LLM-as-a-Judge mechanism to iteratively validate the rules. By combining knowledge-driven enrichment, template-based rule grounding, and a multi-stage solution, AUTOSIGMA enables accurate, context-aware, and relevant rule generation. Evaluations across multiple real-world APT reports and multiple security blogs demonstrate that AUTOSIGMA outperforms alternative solutions and LLM models in rule validity, rule relevancy, MITRE ATT\u0026CK technique coverage, and robustness to input quality. AUTOSIGMA\u0027s Demo: https://youtu.be/iSr6IurQ6BM", "arxiv_id": "2608.19011", "arxiv_url": "https://arxiv.org/abs/2608.19011", "authors": ["Sepehr Ghaffarzadegan", "Boubakr Nour", "Makan Pourzandi", "Mourad Debbabi", "Chadi Assi"], "brief": "\u672c\u6587\u63d0\u51fa AUTOSIGMA\uff0c\u5c06\u975e\u7ed3\u6784\u5316\u7f51\u7edc\u5a01\u80c1\u60c5\u62a5\u62a5\u544a\u81ea\u52a8\u8f6c\u5316\u4e3a Sigma \u68c0\u6d4b\u89c4\u5219\u3002\u65b9\u6cd5\u7ed3\u5408\u77e5\u8bc6\u5e93\u8865\u5168\u3001\u6a21\u677f\u5316\u89c4\u5219\u5339\u914d\u4e0e LLM-as-a-Judge \u8fed\u4ee3\u9a8c\u8bc1\uff0c\u5728\u771f\u5b9e APT \u62a5\u544a\u548c\u5b89\u5168\u535a\u5ba2\u8bc4\u6d4b\u4e2d\uff0c\u76f8\u6bd4\u73b0\u6709\u65b9\u6848\u548c\u901a\u7528 LLM \u751f\u6210\u7684\u89c4\u5219\u66f4\u6709\u6548\u3001\u76f8\u5173\u6027\u66f4\u9ad8\uff0c\u5e76\u8986\u76d6\u66f4\u591a MITRE ATT\u0026CK \u6280\u672f\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19011", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u5a01\u80c1\u60c5\u62a5", "\u5927\u8bed\u8a00\u6a21\u578b", "\u89c4\u5219\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19011v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Threat Intelligence to Detection: Knowledge-driven Enrichment and Template-based Rule Grounding for Automated Sigma Rule Generation", "tldr": "\u672c\u6587\u63d0\u51fa AUTOSIGMA\uff0c\u5c06\u975e\u7ed3\u6784\u5316\u7f51\u7edc\u5a01\u80c1\u60c5\u62a5\u62a5\u544a\u81ea\u52a8\u8f6c\u5316\u4e3a Sigma \u68c0\u6d4b\u89c4\u5219\u3002\u65b9\u6cd5\u7ed3\u5408\u77e5\u8bc6\u5e93\u8865\u5168\u3001\u6a21\u677f\u5316\u89c4\u5219\u5339\u914d\u4e0e LLM-as-a-Judge \u8fed\u4ee3\u9a8c\u8bc1\uff0c\u5728\u771f\u5b9e APT \u62a5\u544a\u548c\u5b89\u5168\u535a\u5ba2\u8bc4\u6d4b\u4e2d\uff0c\u76f8\u6bd4\u73b0\u6709\u65b9\u6848\u548c\u901a\u7528 LLM \u751f\u6210\u7684\u89c4\u5219\u66f4\u6709\u6548\u3001\u76f8\u5173\u6027\u66f4\u9ad8\uff0c\u5e76\u8986\u76d6\u66f4\u591a MITRE ATT\u0026CK \u6280\u672f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual grounding in Unmanned Aerial Vehicle (UAV) imagery aims to localize a target object in complex bird\u0027s-eye-view scenes according to a natural language description. However, the abundance of small, densely distributed, and visually similar objects creates high visual redundancy, while repetitive local configurations give rise to strong topological ambiguity. Existing approaches mainly focus on visual--language feature alignment or dense contextual interaction, yet they struggle to distinguish subtle inter-instance differences and effectively exploit spatial topological structures, leading to inaccurate grounding in highly crowded scenarios. To address these challenges, we propose $\\textbf{GrabVG}$, a novel visual grounding framework inspired by human visual search. GrabVG explicitly decomposes grounding into two sequential stages: $\\textit{preattentive hypothesis search}$ and $\\textit{graph-attentive feature binding}$. Specifically, we first generate a compact set of reliable object hypotheses through distillation-guided proposal induction and text-aware hypothesis filtering, substantially reducing background distractions and semantic mismatches. These hypotheses are then organized into a sparse graph, where language-guided intra-instance visual cues and inter-instance topological relationships are jointly bound and propagated via graph attention, enabling efficient spatial reasoning and accurate target localization. Extensive experiments on AerialVG and AerialSense show that GrabVG achieves a favorable accuracy--speed trade-off, reaching 67.31$\\%$ and 80.34$\\%$ Acc@0.5 and outperforming the corresponding baselines by 10.55 and 8.76 percentage points, respectively.", "arxiv_id": "2608.18996", "arxiv_url": "https://arxiv.org/abs/2608.18996", "authors": ["Chaowei Wang", "Yan Di", "Jingjun Sun", "Baozhe Liu", "Jiaxu Tian", "Yuheng Li", "Guangqian Guo", "Shan Gao"], "brief": "\u8bba\u6587\u63d0\u51fa GrabVG\uff0c\u7528\u4e8e\u65e0\u4eba\u673a\u4fef\u89c6\u56fe\u50cf\u4e2d\u7684\u89c6\u89c9\u5b9a\u4f4d\uff0c\u5c06\u4efb\u52a1\u5206\u89e3\u4e3a\u5019\u9009\u76ee\u6807\u641c\u7d22\u548c\u56fe\u6ce8\u610f\u529b\u7279\u5f81\u7ed1\u5b9a\u4e24\u4e2a\u9636\u6bb5\u3002\u65b9\u6cd5\u5148\u751f\u6210\u5e76\u7b5b\u9009\u7d27\u51d1\u76ee\u6807\u5019\u9009\uff0c\u518d\u7528\u7a00\u758f\u56fe\u5efa\u6a21\u8bed\u8a00\u5f15\u5bfc\u7684\u5b9e\u4f8b\u7279\u5f81\u4e0e\u7a7a\u95f4\u62d3\u6251\u5173\u7cfb\uff0c\u5728 AerialVG \u548c AerialSense \u4e0a\u5206\u522b\u8fbe\u5230 67.31% \u548c 80.34% Acc@0.5\uff0c\u8f83\u57fa\u7ebf\u63d0\u5347\u660e\u663e\u4e14\u517c\u987e\u901f\u5ea6\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18996", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u5b9a\u4f4d", "\u65e0\u4eba\u673a\u56fe\u50cf", "\u56fe\u6ce8\u610f\u529b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18996v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GrabVG: Graph-Attentive Binding for Visual Grounding in UAV Imagery", "tldr": "\u8bba\u6587\u63d0\u51fa GrabVG\uff0c\u7528\u4e8e\u65e0\u4eba\u673a\u4fef\u89c6\u56fe\u50cf\u4e2d\u7684\u89c6\u89c9\u5b9a\u4f4d\uff0c\u5c06\u4efb\u52a1\u5206\u89e3\u4e3a\u5019\u9009\u76ee\u6807\u641c\u7d22\u548c\u56fe\u6ce8\u610f\u529b\u7279\u5f81\u7ed1\u5b9a\u4e24\u4e2a\u9636\u6bb5\u3002\u65b9\u6cd5\u5148\u751f\u6210\u5e76\u7b5b\u9009\u7d27\u51d1\u76ee\u6807\u5019\u9009\uff0c\u518d\u7528\u7a00\u758f\u56fe\u5efa\u6a21\u8bed\u8a00\u5f15\u5bfc\u7684\u5b9e\u4f8b\u7279\u5f81\u4e0e\u7a7a\u95f4\u62d3\u6251\u5173\u7cfb\uff0c\u5728 AerialVG \u548c AerialSense \u4e0a\u5206\u522b\u8fbe\u5230 67.31% \u548c 80.34% Acc@0.5\uff0c\u8f83\u57fa\u7ebf\u63d0\u5347\u660e\u663e\u4e14\u517c\u987e\u901f\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieve-then-generate pipelines are commonly used to produce deep-research answers for open-ended questions, but retrieval alone is insufficient: LLMs must organize noisy and fragmented evidence into comprehensive, well-cited answers. We refer to this process as evidence synthesis. However, direct generation often underuses evidence, misaligns citations, and collapses diverse information into shallow summaries, exposing an evidence synthesis gap between retrieval and generation. Thus, we propose DeepWeaver, a novel framework that weaves noisy retrieved evidence into comprehensive answers by maintaining Thought Block Chains (TBCs), a structured representation that groups claims, salient information, keywords, and supporting evidence. DeepWeaver uses subordinate TBCs to inspect residual evidence, commit TBC revisions, and discover new claims before final generation. We evaluate DeepWeaver on open-ended QA over both knowledge bases and the web, and introduce LoQA, a high-density benchmark for evidence synthesis. Across multiple LLMs, DeepWeaver improves content sufficiency, citation grounding, and detail preservation on LoQA, while achieving deeper insights and higher citation quality on DeepResearch Bench. These results show that evidence weaving is an effective mechanism for bridging retrieval and generation in open-ended QA. Our code is available at https://github.com/KlozeWang/DeepWeaver.", "arxiv_id": "2608.18988", "arxiv_url": "https://arxiv.org/abs/2608.18988", "authors": ["Xujia Wang", "Yizhe Zhang", "Bin Xu", "Lei Hou", "Juanzi Li"], "brief": "\u8bba\u6587\u63d0\u51fa DeepWeaver\uff0c\u7528 Thought Block Chains \u7ed3\u6784\u5316\u7ec4\u7ec7\u68c0\u7d22\u5230\u7684\u566a\u58f0\u8bc1\u636e\uff0c\u5c06\u4e3b\u5f20\u3001\u5173\u952e\u4fe1\u606f\u3001\u5173\u952e\u8bcd\u4e0e\u5f15\u7528\u8bc1\u636e\u7f16\u7ec7\u6210\u66f4\u5b8c\u6574\u7684\u5f00\u653e\u5f0f\u95ee\u7b54\u7b54\u6848\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 LoQA \u548c DeepResearch Bench \u4e0a\u63d0\u5347\u4e86\u5185\u5bb9\u5145\u5206\u6027\u3001\u5f15\u7528\u624e\u5b9e\u5ea6\u4e0e\u7ec6\u8282\u4fdd\u7559\u80fd\u529b\uff0c\u7f13\u89e3\u4e86\u68c0\u7d22\u4e0e\u751f\u6210\u4e4b\u95f4\u7684\u8bc1\u636e\u7efc\u5408\u7f3a\u53e3\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18988", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f00\u653e\u5f0f\u95ee\u7b54", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u8bc1\u636e\u7efc\u5408", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18988v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DeepWeaver: Bridging the Evidence Synthesis Gap in Open-Ended Question Answering", "tldr": "\u8bba\u6587\u63d0\u51fa DeepWeaver\uff0c\u7528 Thought Block Chains \u7ed3\u6784\u5316\u7ec4\u7ec7\u68c0\u7d22\u5230\u7684\u566a\u58f0\u8bc1\u636e\uff0c\u5c06\u4e3b\u5f20\u3001\u5173\u952e\u4fe1\u606f\u3001\u5173\u952e\u8bcd\u4e0e\u5f15\u7528\u8bc1\u636e\u7f16\u7ec7\u6210\u66f4\u5b8c\u6574\u7684\u5f00\u653e\u5f0f\u95ee\u7b54\u7b54\u6848\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 LoQA \u548c DeepResearch Bench \u4e0a\u63d0\u5347\u4e86\u5185\u5bb9\u5145\u5206\u6027\u3001\u5f15\u7528\u624e\u5b9e\u5ea6\u4e0e\u7ec6\u8282\u4fdd\u7559\u80fd\u529b\uff0c\u7f13\u89e3\u4e86\u68c0\u7d22\u4e0e\u751f\u6210\u4e4b\u95f4\u7684\u8bc1\u636e\u7efc\u5408\u7f3a\u53e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models can improve recommendation quality by reasoning explicitly over user history and candidate items - for example, extracting a user\u0027s preferences or explaining why one item fits better than another - rather than mapping history directly to a ranked list. This reasoning, however, is expensive to repeat on every ranking request and, once produced, is typically consumed once and discarded, leaving it neither reusable across future requests nor easy to inspect or correct as user tastes drift. Our insight is that reasoning does not need to be regenerated at every call if it can instead be compressed once into a compact, structured memory that a lightweight model retrieves from. We propose rEDMRec, which distills a teacher LLM\u0027s reasoning into four typed, editable experience channels - long-term preference, short-term context, item-perception, and counterfactual hard-negative comparisons - maintained by an LLM memory controller that performs Add/Delete/Modify/Keep operations and refines entries via K-agent debate. A lightweight student LLM then ranks candidates purely by retrieving from this memory, without invoking the teacher again, decoupling online inference cost from reasoning depth. Across ML-1M, Amazon Beauty, and Steam and ten student backbones, rEDMRec improves HR@1 over zero-shot, few-shot, and RAG on every backbone, and over GraphRAG on most backbones, with Impv up to 13.3% vs. the second-best baseline on ML-1M. Channel ablations show that short-term context is the only channel that helps consistently across capacity tiers, whereas long-term, item-perception, and counterfactual contributions are capacity-dependent (and can reverse on the strongest students); debate-based memory optimization lowers bank duplication by 7.4 percentage points while raising downstream HR@1 by up to +0.029 over six optimization epochs.", "arxiv_id": "2608.18952", "arxiv_url": "https://arxiv.org/abs/2608.18952", "authors": ["Minh Hoang Nguyen", "Tung Le", "Huy Tien Nguyen"], "brief": "rEDMRec \u5c06\u6559\u5e08\u5927\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u8350\u63a8\u7406\u84b8\u998f\u4e3a\u53ef\u7f16\u8f91\u7684\u7ed3\u6784\u5316\u7ecf\u9a8c\u8bb0\u5fc6\uff0c\u5305\u62ec\u957f\u671f\u504f\u597d\u3001\u77ed\u671f\u4e0a\u4e0b\u6587\u3001\u7269\u54c1\u611f\u77e5\u548c\u53cd\u4e8b\u5b9e\u8d1f\u4f8b\u6bd4\u8f83\u56db\u7c7b\u901a\u9053\u3002\u5728\u7ebf\u9636\u6bb5\u8f7b\u91cf\u5b66\u751f\u6a21\u578b\u4ec5\u68c0\u7d22\u8bb0\u5fc6\u5b8c\u6210\u6392\u5e8f\uff0c\u907f\u514d\u53cd\u590d\u8c03\u7528\u6559\u5e08\u6a21\u578b\uff0c\u5e76\u5728\u591a\u4e2a\u6570\u636e\u96c6\u548c\u5b66\u751f\u9aa8\u5e72\u4e0a\u63d0\u5347 HR@1\uff0c\u6700\u9ad8\u76f8\u5bf9\u6b21\u4f18\u57fa\u7ebf\u63d0\u5347 13.3%\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18952", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u5927\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18952v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "rEDMRec: Distilling Large Language Model Reasoning into an Editable Experience Memory for Recommendation", "tldr": "rEDMRec \u5c06\u6559\u5e08\u5927\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u8350\u63a8\u7406\u84b8\u998f\u4e3a\u53ef\u7f16\u8f91\u7684\u7ed3\u6784\u5316\u7ecf\u9a8c\u8bb0\u5fc6\uff0c\u5305\u62ec\u957f\u671f\u504f\u597d\u3001\u77ed\u671f\u4e0a\u4e0b\u6587\u3001\u7269\u54c1\u611f\u77e5\u548c\u53cd\u4e8b\u5b9e\u8d1f\u4f8b\u6bd4\u8f83\u56db\u7c7b\u901a\u9053\u3002\u5728\u7ebf\u9636\u6bb5\u8f7b\u91cf\u5b66\u751f\u6a21\u578b\u4ec5\u68c0\u7d22\u8bb0\u5fc6\u5b8c\u6210\u6392\u5e8f\uff0c\u907f\u514d\u53cd\u590d\u8c03\u7528\u6559\u5e08\u6a21\u578b\uff0c\u5e76\u5728\u591a\u4e2a\u6570\u636e\u96c6\u548c\u5b66\u751f\u9aa8\u5e72\u4e0a\u63d0\u5347 HR@1\uff0c\u6700\u9ad8\u76f8\u5bf9\u6b21\u4f18\u57fa\u7ebf\u63d0\u5347 13.3%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Clifford circuits play a foundational role in quantum computing, particularly due to their importance in quantum error correction and fault-tolerant logical synthesis. While these circuits can be efficiently simulated and represented as symplectic matrices, standard synthesis methods-such as the Aaronson-Gottesman algorithm-often yield sub-optimal circuits with excessively high gate counts. In this work, we introduce AlphaClifford, a model-based Reinforcement Learning framework powered by Monte Carlo Tree Search, designed to efficiently synthesize Clifford circuits from the fundamental gate set composed of H, S, and CNOT. By modeling the state space through the algebraic properties of the symplectic group, AlphaClifford effectively explores this combinatorial space to minimize overall circuit cost. For unconstrained Clifford optimization, our approach achieves a consistent reduction in both total and two-qubit (CNOT) gate counts compared to state-of-the-art synthesis heuristics, despite operating with a strictly less expressive gate set. Furthermore, we demonstrate the broad applicability of our framework on two additional tasks: hardware-constrained Clifford transpilation, where we outperform existing RL-based compilers, and as a post-synthesis optimization component within a full Clifford+T logical synthesis pipeline. Our results underscore that model-based RL is highly effective at addressing the combinatorial complexities of quantum compilation, offering a scalable pathway to mitigate hardware constraints in both near-term and future fault-tolerant quantum devices.", "arxiv_id": "2608.18946", "arxiv_url": "https://arxiv.org/abs/2608.18946", "authors": ["Daniele Lizzio Bosco", "Jacopo Cossio", "Carla Piazza", "Giuseppe Serra"], "brief": "\u63d0\u51fa AlphaClifford\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u4e0e\u8499\u7279\u5361\u6d1b\u6811\u641c\u7d22\u6846\u67b6\uff0c\u7528\u4e8e\u4ece H\u3001S\u3001CNOT \u57fa\u672c\u95e8\u96c6\u5408\u9ad8\u6548\u5408\u6210\u4e0e\u8f6c\u8bd1 Clifford \u91cf\u5b50\u7ebf\u8def\u3002\u76f8\u6bd4\u73b0\u6709\u542f\u53d1\u5f0f\u548c RL \u7f16\u8bd1\u5668\uff0c\u8be5\u65b9\u6cd5\u5728\u603b\u95e8\u6570\u548c CNOT \u95e8\u6570\u4e0a\u6301\u7eed\u964d\u4f4e\uff0c\u5e76\u53ef\u7528\u4e8e\u786c\u4ef6\u7ea6\u675f\u8f6c\u8bd1\u548c Clifford+T \u903b\u8f91\u7efc\u5408\u540e\u7684\u4f18\u5316\u3002", "categories": ["quant-ph", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18946", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u7f16\u8bd1", "\u5f3a\u5316\u5b66\u4e60", "\u8499\u7279\u5361\u6d1b\u6811\u641c\u7d22", "\u91cf\u5b50\u7ebf\u8def"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18946v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AlphaClifford: Efficient Clifford Synthesis and Transpilation with Model-based RL", "tldr": "\u63d0\u51fa AlphaClifford\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u4e0e\u8499\u7279\u5361\u6d1b\u6811\u641c\u7d22\u6846\u67b6\uff0c\u7528\u4e8e\u4ece H\u3001S\u3001CNOT \u57fa\u672c\u95e8\u96c6\u5408\u9ad8\u6548\u5408\u6210\u4e0e\u8f6c\u8bd1 Clifford \u91cf\u5b50\u7ebf\u8def\u3002\u76f8\u6bd4\u73b0\u6709\u542f\u53d1\u5f0f\u548c RL \u7f16\u8bd1\u5668\uff0c\u8be5\u65b9\u6cd5\u5728\u603b\u95e8\u6570\u548c CNOT \u95e8\u6570\u4e0a\u6301\u7eed\u964d\u4f4e\uff0c\u5e76\u53ef\u7528\u4e8e\u786c\u4ef6\u7ea6\u675f\u8f6c\u8bd1\u548c Clifford+T \u903b\u8f91\u7efc\u5408\u540e\u7684\u4f18\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Single-step retrosynthesis is a central component of computer-aided synthesis planning, yet its intrinsically one-to-many nature is poorly captured by single-answer evaluation and benchmarking protocols. To address this, we introduce Top-K prompting as a robust training and inference paradigm to better capture diverse, plausible reaction predictions. We compile CREED-CCV-2+USPTO-XL, an ultra-large-scale dataset of ~45.6 million verified reactions to train the C3LM (Chemistry Constraint-Consistent Language Model). By integrating fine-tuning with ChemCensor-based and novelty-oriented rewards, our model achieves state-of-the-art performance on the OOD URSA-expert-2026 benchmark. Further analysis of reaction uniqueness shows that LLMs and conventional models explore complementary reaction spaces, motivating ensemble-based retrosynthesis systems. Overall, our results establish Top-K, plausibility-aware training as a practical new direction for robust future LLM-based synthesis planning.", "arxiv_id": "2608.18940", "arxiv_url": "https://arxiv.org/abs/2608.18940", "authors": ["Bogdan Zagribelnyy", "Ivan Ilin", "Nikita Bondarev", "Maksim Kuznetsov", "Mathieu Reymond", "Vladimir Aladinskiy", "Alex Aliper", "Alex Zhavoronkov"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e\u5355\u6b65\u9006\u5408\u6210\u7684 Top-K \u63d0\u793a\u8bad\u7ec3\u4e0e\u63a8\u7406\u8303\u5f0f\uff0c\u4ee5\u66f4\u597d\u8986\u76d6\u4e00\u5bf9\u591a\u7684\u5408\u7406\u53cd\u5e94\u9884\u6d4b\u3002\u4f5c\u8005\u6784\u5efa\u7ea64560\u4e07\u6761\u9a8c\u8bc1\u53cd\u5e94\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u7ed3\u5408\u5316\u5b66\u7ea6\u675f\u4e0e\u65b0\u9896\u6027\u5956\u52b1\u8bad\u7ec3 C3LM\uff0c\u5728OOD\u57fa\u51c6 URSA-expert-2026 \u4e0a\u8fbe\u5230\u6700\u4f18\u8868\u73b0\uff0c\u4e14\u53d1\u73b0LLM\u4e0e\u4f20\u7edf\u6a21\u578b\u53ef\u4e92\u8865\u96c6\u6210\u3002", "categories": ["cs.LG", "cs.AI", "cs.CE", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18940", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u9006\u5408\u6210", "\u5316\u5b66\u53cd\u5e94\u9884\u6d4b", "\u5956\u52b1\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18940v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Training Chemical Plausibility-Aware Large Language Models for Single-Step Retrosynthesis", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e\u5355\u6b65\u9006\u5408\u6210\u7684 Top-K \u63d0\u793a\u8bad\u7ec3\u4e0e\u63a8\u7406\u8303\u5f0f\uff0c\u4ee5\u66f4\u597d\u8986\u76d6\u4e00\u5bf9\u591a\u7684\u5408\u7406\u53cd\u5e94\u9884\u6d4b\u3002\u4f5c\u8005\u6784\u5efa\u7ea64560\u4e07\u6761\u9a8c\u8bc1\u53cd\u5e94\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u7ed3\u5408\u5316\u5b66\u7ea6\u675f\u4e0e\u65b0\u9896\u6027\u5956\u52b1\u8bad\u7ec3 C3LM\uff0c\u5728OOD\u57fa\u51c6 URSA-expert-2026 \u4e0a\u8fbe\u5230\u6700\u4f18\u8868\u73b0\uff0c\u4e14\u53d1\u73b0LLM\u4e0e\u4f20\u7edf\u6a21\u578b\u53ef\u4e92\u8865\u96c6\u6210\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision Language Models (VLMs) have recently emerged as a critical component of multimodal AI systems, enabling joint reasoning over visual and textual inputs in real-world and safety-critical applications. Despite their growing deployment, the robustness of VLMs against adversarial threats remains insufficiently explored, particularly in the context of evasion attacks targeting multimodal alignment. In this work, we investigate the vulnerability of VLMs to adversarial perturbations applied to visual inputs and study two attack settings: untargeted attacks, where the goal is to disrupt the model\u0027s interpretation of the original image, and targeted attacks, where the adversary aims to force the model to generate a specific semantic description unrelated to the original image. To efficiently generate adversarial examples, we propose a gradient-based attack method that performs optimization exclusively on the vision encoder of the VLM rather than on the entire multimodal architecture. This design significantly reduces the computational cost and resource requirements of the attack while maintaining strong effectiveness. We evaluate our approach on several open-source VLMs, including Qwen2.5-VL, Granite-Vision, FastVLM, and Phi-3.5-Vision, and show that small, human-imperceptible perturbations can substantially alter the textual interpretation produced by the models. Our findings highlight the vulnerability of modern VLMs to adversarial manipulation and emphasize the need for improved robustness and security mechanisms in multimodal AI systems.", "arxiv_id": "2608.18938", "arxiv_url": "https://arxiv.org/abs/2608.18938", "authors": ["Ilan Zini", "Boussad Addad", "Katarzyna Kapusta"], "brief": "\u672c\u6587\u7814\u7a76\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u89c6\u89c9\u8f93\u5165\u4e0a\u7684\u5bf9\u6297\u9003\u9038\u653b\u51fb\uff0c\u6db5\u76d6\u65e0\u76ee\u6807\u6270\u4e71\u7406\u89e3\u548c\u6709\u76ee\u6807\u8bf1\u5bfc\u7279\u5b9a\u63cf\u8ff0\u4e24\u79cd\u573a\u666f\u3002\u4f5c\u8005\u63d0\u51fa\u53ea\u4f18\u5316\u89c6\u89c9\u7f16\u7801\u5668\u7684\u68af\u5ea6\u653b\u51fb\u65b9\u6cd5\uff0c\u5728\u663e\u8457\u964d\u4f4e\u8ba1\u7b97\u6210\u672c\u7684\u540c\u65f6\uff0c\u4ecd\u80fd\u7528\u4eba\u773c\u96be\u5bdf\u89c9\u7684\u6270\u52a8\u5927\u5e45\u6539\u53d8\u591a\u4e2a\u5f00\u6e90 VLM \u7684\u6587\u672c\u8f93\u51fa\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18938", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5bf9\u6297\u653b\u51fb", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18938v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Breaking the weakest link to evade vision language models", "tldr": "\u672c\u6587\u7814\u7a76\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u89c6\u89c9\u8f93\u5165\u4e0a\u7684\u5bf9\u6297\u9003\u9038\u653b\u51fb\uff0c\u6db5\u76d6\u65e0\u76ee\u6807\u6270\u4e71\u7406\u89e3\u548c\u6709\u76ee\u6807\u8bf1\u5bfc\u7279\u5b9a\u63cf\u8ff0\u4e24\u79cd\u573a\u666f\u3002\u4f5c\u8005\u63d0\u51fa\u53ea\u4f18\u5316\u89c6\u89c9\u7f16\u7801\u5668\u7684\u68af\u5ea6\u653b\u51fb\u65b9\u6cd5\uff0c\u5728\u663e\u8457\u964d\u4f4e\u8ba1\u7b97\u6210\u672c\u7684\u540c\u65f6\uff0c\u4ecd\u80fd\u7528\u4eba\u773c\u96be\u5bdf\u89c9\u7684\u6270\u52a8\u5927\u5e45\u6539\u53d8\u591a\u4e2a\u5f00\u6e90 VLM \u7684\u6587\u672c\u8f93\u51fa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent Multimodal Large Language Models (MLLMs) are rapidly evolving into unified understanding and generation (UAG) frameworks. However, extending these unified paradigms to the medical domain is hindered by: the absence of comprehensive training and evaluation benchmarks, and the lack of broadly validated unified medical model. To address these gaps, we present a comprehensive foundation for medical UAG. First, we construct MedUAGCorpus, the largest unified medical understanding and generation dataset to date, comprising over 6 million instances across 14 imaging modalities. Second, we introduce MedUAGBench, a systematic benchmark that expands medical generation evaluation to 12 diverse tasks under standardized protocols. Finally, leveraging these resources, we develop MedUAG, an end-to-end trained unified medical model. Extensive experiments demonstrate that MedUAG achieves strong performance across a wide array of understanding and generation tasks, establishing a competitive baseline and paving the way for next-generation medical multimodal systems.", "arxiv_id": "2608.18937", "arxiv_url": "https://arxiv.org/abs/2608.18937", "authors": ["Zijie Meng", "Yuncheng Zhang", "Hualiang Wang", "Yitian Tang", "Xiaotang Gai", "Chen Shen", "Songtao Jiang", "Shaosheng Cao", "Jian Wu", "Xian Wu", "Zuozhu Liu"], "brief": "\u672c\u6587\u9762\u5411\u533b\u7597\u591a\u6a21\u6001\u6a21\u578b\u63d0\u51fa\u7edf\u4e00\u7406\u89e3\u4e0e\u751f\u6210\u6846\u67b6\uff0c\u6784\u5efa\u4e86\u5305\u542b600\u591a\u4e07\u6837\u672c\u3001\u8986\u76d614\u79cd\u5f71\u50cf\u6a21\u6001\u7684MedUAGCorpus\uff0c\u5e76\u5efa\u7acb\u4e86\u8986\u76d612\u7c7b\u751f\u6210\u4efb\u52a1\u7684MedUAGBench\u8bc4\u6d4b\u3002\u57fa\u4e8e\u8fd9\u4e9b\u8d44\u6e90\u8bad\u7ec3\u7684MedUAG\u5728\u591a\u79cd\u533b\u7597\u7406\u89e3\u4e0e\u751f\u6210\u4efb\u52a1\u4e0a\u8868\u73b0\u5f3a\u52b2\uff0c\u4e3a\u7edf\u4e00\u533b\u7597\u591a\u6a21\u6001\u7cfb\u7edf\u63d0\u4f9b\u4e86\u6709\u7ade\u4e89\u529b\u7684\u57fa\u7ebf\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18937", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597\u591a\u6a21\u6001", "\u7edf\u4e00\u7406\u89e3\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18937v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MedUAG: Unified Understanding and Generation for Medical Multimodal Models", "tldr": "\u672c\u6587\u9762\u5411\u533b\u7597\u591a\u6a21\u6001\u6a21\u578b\u63d0\u51fa\u7edf\u4e00\u7406\u89e3\u4e0e\u751f\u6210\u6846\u67b6\uff0c\u6784\u5efa\u4e86\u5305\u542b600\u591a\u4e07\u6837\u672c\u3001\u8986\u76d614\u79cd\u5f71\u50cf\u6a21\u6001\u7684MedUAGCorpus\uff0c\u5e76\u5efa\u7acb\u4e86\u8986\u76d612\u7c7b\u751f\u6210\u4efb\u52a1\u7684MedUAGBench\u8bc4\u6d4b\u3002\u57fa\u4e8e\u8fd9\u4e9b\u8d44\u6e90\u8bad\u7ec3\u7684MedUAG\u5728\u591a\u79cd\u533b\u7597\u7406\u89e3\u4e0e\u751f\u6210\u4efb\u52a1\u4e0a\u8868\u73b0\u5f3a\u52b2\uff0c\u4e3a\u7edf\u4e00\u533b\u7597\u591a\u6a21\u6001\u7cfb\u7edf\u63d0\u4f9b\u4e86\u6709\u7ade\u4e89\u529b\u7684\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Designing, implementing, and comparing interpretable architectures requires a formal language to represent them. The most common representations fall short in one of two ways. Symbolic equations give no global view of an architecture at a glance. Probabilistic graphical models and flowcharts do not describe actual tensor manipulations, thus hiding key insights and limiting reproducibility. To close this gap, we introduce a graphical notation for designing interpretable AI architectures, adapted from Penrose tensor notation. This graphical notation gives a global view of an architecture and maps one to one onto PyTorch einsum code. We first use this notation to describe architectures that are interpretable by construction, including concept bottlenecks, sparse probes, prototype networks, neural additive models, and mixtures of linear models. We then diagram the key architectural components of Steerling-8B, a frontier interpretable language model. The diagram yields global insights into the architecture (e.g., showing that Steerling is a residual model), a geometric interpretation of each individual operation, and a direct translation into 33 lines of PyTorch code.", "arxiv_id": "2608.18936", "arxiv_url": "https://arxiv.org/abs/2608.18936", "authors": ["Pietro Barbiero"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6539\u7f16\u81ea Penrose \u5f20\u91cf\u8bb0\u53f7\u7684\u56fe\u5f62\u5316\u8868\u793a\u8bed\u8a00\uff0c\u7528\u4e8e\u8bbe\u8ba1\u548c\u63cf\u8ff0\u53ef\u89e3\u91ca AI \u67b6\u6784\u3002\u8be5\u8bb0\u53f7\u65e2\u80fd\u63d0\u4f9b\u6574\u4f53\u7ed3\u6784\u89c6\u56fe\uff0c\u53c8\u80fd\u4e00\u4e00\u6620\u5c04\u5230 PyTorch einsum \u4ee3\u7801\uff0c\u5e76\u7528\u4e8e\u7edf\u4e00\u523b\u753b\u6982\u5ff5\u74f6\u9888\u3001\u539f\u578b\u7f51\u7edc\u3001\u795e\u7ecf\u52a0\u6027\u6a21\u578b\u4ee5\u53ca Steerling-8B \u7b49\u53ef\u89e3\u91ca\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.AI", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18936", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u795e\u7ecf\u7f51\u7edc\u67b6\u6784", "\u56fe\u5f62\u8868\u793a", "\u5f20\u91cf\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18936v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Graphical Design of Interpretable Architectures", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6539\u7f16\u81ea Penrose \u5f20\u91cf\u8bb0\u53f7\u7684\u56fe\u5f62\u5316\u8868\u793a\u8bed\u8a00\uff0c\u7528\u4e8e\u8bbe\u8ba1\u548c\u63cf\u8ff0\u53ef\u89e3\u91ca AI \u67b6\u6784\u3002\u8be5\u8bb0\u53f7\u65e2\u80fd\u63d0\u4f9b\u6574\u4f53\u7ed3\u6784\u89c6\u56fe\uff0c\u53c8\u80fd\u4e00\u4e00\u6620\u5c04\u5230 PyTorch einsum \u4ee3\u7801\uff0c\u5e76\u7528\u4e8e\u7edf\u4e00\u523b\u753b\u6982\u5ff5\u74f6\u9888\u3001\u539f\u578b\u7f51\u7edc\u3001\u795e\u7ecf\u52a0\u6027\u6a21\u578b\u4ee5\u53ca Steerling-8B \u7b49\u53ef\u89e3\u91ca\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time scaling (TTS) improves language model outputs by spending additional inference compute - generating multiple candidates, searching over partial sequences, or iteratively refining drafts. These techniques yield large gains on mathematics and code, but have been developed and stress-tested almost exclusively on tasks where verification is straightforward. We conduct the first compute-normalised comparison of five TTS families across five open-ended generation benchmarks spanning medicine, law, finance, general chat, and creative writing - grounded in a unified framework that decomposes the effectiveness of each method\u0027s token budget into exploration and exploitation. The answer depends on which side of that decomposition you examine. Scaling exploration works: the best candidate in the pool improves steadily with compute across all settings. What breaks is exploitation - the step that converts a rich candidate pool into a final output. With state-of-the-art generators, reward models correlate at only $\u03c1_v \\approx 0.12$ with true quality, rendering selection near-random regardless of budget. Tree search amplifies this failure through diversity collapse. Refinement helps on one of five benchmarks; its apparent gains elsewhere are confounded. Only synthesis across candidates (Fusion) consistently improves over single-sample baselines, yet still recovers only ~40% of available quality. The candidate pool is not the bottleneck - choosing from it is.", "arxiv_id": "2608.18931", "arxiv_url": "https://arxiv.org/abs/2608.18931", "authors": ["Davide Romano", "Kanak Raj", "Jerrod Parker", "Daniele Giofr\u00e8"], "brief": "\u672c\u6587\u5bf9\u4e94\u7c7b\u6d4b\u8bd5\u65f6\u6269\u5c55\u65b9\u6cd5\u5728\u533b\u7597\u3001\u6cd5\u5f8b\u3001\u91d1\u878d\u3001\u804a\u5929\u548c\u521b\u610f\u5199\u4f5c\u7b49\u5f00\u653e\u751f\u6210\u4efb\u52a1\u4e0a\u505a\u4e86\u8ba1\u7b97\u91cf\u5f52\u4e00\u5316\u6bd4\u8f83\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u591a\u91c7\u6837\u5e26\u6765\u7684\u63a2\u7d22\u786e\u5b9e\u80fd\u6301\u7eed\u4ea7\u751f\u66f4\u597d\u7684\u5019\u9009\u7b54\u6848\uff0c\u4f46\u73b0\u6709\u5956\u52b1\u6a21\u578b\u4e0e\u771f\u5b9e\u8d28\u91cf\u76f8\u5173\u6027\u5f88\u4f4e\uff0c\u5bfc\u81f4\u9009\u62e9/\u641c\u7d22\u7b49\u5229\u7528\u9636\u6bb5\u6210\u4e3a\u74f6\u9888\uff1b\u5019\u9009\u878d\u5408\u76f8\u5bf9\u6700\u7a33\u5b9a\u4f46\u4e5f\u53ea\u56de\u6536\u7ea640%\u7684\u6f5c\u5728\u8d28\u91cf\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18931", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5956\u52b1\u6a21\u578b", "\u5f00\u653e\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18931v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Test-Time Scaling in the Wild: Why Exploitation, Not Exploration, Is the Bottleneck", "tldr": "\u672c\u6587\u5bf9\u4e94\u7c7b\u6d4b\u8bd5\u65f6\u6269\u5c55\u65b9\u6cd5\u5728\u533b\u7597\u3001\u6cd5\u5f8b\u3001\u91d1\u878d\u3001\u804a\u5929\u548c\u521b\u610f\u5199\u4f5c\u7b49\u5f00\u653e\u751f\u6210\u4efb\u52a1\u4e0a\u505a\u4e86\u8ba1\u7b97\u91cf\u5f52\u4e00\u5316\u6bd4\u8f83\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u591a\u91c7\u6837\u5e26\u6765\u7684\u63a2\u7d22\u786e\u5b9e\u80fd\u6301\u7eed\u4ea7\u751f\u66f4\u597d\u7684\u5019\u9009\u7b54\u6848\uff0c\u4f46\u73b0\u6709\u5956\u52b1\u6a21\u578b\u4e0e\u771f\u5b9e\u8d28\u91cf\u76f8\u5173\u6027\u5f88\u4f4e\uff0c\u5bfc\u81f4\u9009\u62e9/\u641c\u7d22\u7b49\u5229\u7528\u9636\u6bb5\u6210\u4e3a\u74f6\u9888\uff1b\u5019\u9009\u878d\u5408\u76f8\u5bf9\u6700\u7a33\u5b9a\u4f46\u4e5f\u53ea\u56de\u6536\u7ea640%\u7684\u6f5c\u5728\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing LRM-DoS methods rely heavily on model feedback to synthesize attack queries, requiring either repeated queries to the target model or training a dedicated attack model. These expensive operations severely weaken attack leverage. In this paper, we propose \\emph{search amplification}, a novel, model-feedback-free LRM-DoS paradigm. It employs the conflict count derived from an Satisfiability Modulo Theories (SMT) solver as a low-cost external signal to guide the synthesis of inference-heavy Constraint Satisfaction Problem (CSP) instances. Our key observation is that LRMs depend on trial-and-backtracking search when solving CSPs, where higher SMT conflict counts on a given CSP instance positively correlate with more extensive LRM backtracking search and substantially longer output trajectories. Building on this finding, we propose \\textsc{SMTrap}, a lightweight, CPU-only framework. Guided by SMT conflict counts, \\textsc{SMTrap} generates inference-heavy CSP queries without model queries, attack-model training, or GPU computation. Evaluations across seven frontier models demonstrate the state-of-the-art LRM-DoS capability of \\textsc{SMTrap}, producing DoS effects multiple times stronger than existing baselines. To mitigate the threat of \\textsc{SMTrap}, we demonstrate a tool-based mitigation that significantly cuts token usage.", "arxiv_id": "2608.18921", "arxiv_url": "https://arxiv.org/abs/2608.18921", "authors": ["Jian Yang", "Zhenqi Feng", "Zhaoyang Yu", "Zhaoxin Fan", "Kejian Wu", "Xiaofeng Wang", "Zheng Zhu", "Jianjun Huang", "Wei You", "Bin Liang"], "brief": "\u8bba\u6587\u63d0\u51fa SMTrap\uff0c\u4e00\u79cd\u65e0\u9700\u76ee\u6807\u6a21\u578b\u53cd\u9988\u3001\u65e0\u9700\u8bad\u7ec3\u653b\u51fb\u6a21\u578b\u4e14\u4ec5\u9700 CPU \u7684\u5927\u63a8\u7406\u6a21\u578b DoS \u653b\u51fb\u6846\u67b6\u3002\u5b83\u5229\u7528 SMT \u6c42\u89e3\u5668\u7684\u51b2\u7a81\u8ba1\u6570\u5f15\u5bfc\u751f\u6210\u66f4\u96be\u7684\u7ea6\u675f\u6ee1\u8db3\u95ee\u9898\uff0c\u4f7f\u591a\u4e2a\u524d\u6cbf\u63a8\u7406\u6a21\u578b\u4ea7\u751f\u66f4\u957f\u63a8\u7406\u8f68\u8ff9\u548c\u66f4\u9ad8 token \u6d88\u8017\uff0c\u653b\u51fb\u6548\u679c\u663e\u8457\u5f3a\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u5c55\u793a\u4e86\u57fa\u4e8e\u5de5\u5177\u7684\u7f13\u89e3\u65b9\u6848\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18921", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u63a8\u7406\u6a21\u578b", "\u5b89\u5168\u653b\u51fb", "\u7ea6\u675f\u6ee1\u8db3", "SMT\u6c42\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18921v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SMTrap: Cost-Effective DoS Attacks Against Large Reasoning Models via SMT Conflict Guidance", "tldr": "\u8bba\u6587\u63d0\u51fa SMTrap\uff0c\u4e00\u79cd\u65e0\u9700\u76ee\u6807\u6a21\u578b\u53cd\u9988\u3001\u65e0\u9700\u8bad\u7ec3\u653b\u51fb\u6a21\u578b\u4e14\u4ec5\u9700 CPU \u7684\u5927\u63a8\u7406\u6a21\u578b DoS \u653b\u51fb\u6846\u67b6\u3002\u5b83\u5229\u7528 SMT \u6c42\u89e3\u5668\u7684\u51b2\u7a81\u8ba1\u6570\u5f15\u5bfc\u751f\u6210\u66f4\u96be\u7684\u7ea6\u675f\u6ee1\u8db3\u95ee\u9898\uff0c\u4f7f\u591a\u4e2a\u524d\u6cbf\u63a8\u7406\u6a21\u578b\u4ea7\u751f\u66f4\u957f\u63a8\u7406\u8f68\u8ff9\u548c\u66f4\u9ad8 token \u6d88\u8017\uff0c\u653b\u51fb\u6548\u679c\u663e\u8457\u5f3a\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u5c55\u793a\u4e86\u57fa\u4e8e\u5de5\u5177\u7684\u7f13\u89e3\u65b9\u6848\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Small-scale image classification is often limited by the scarcity of training data. Generative data augmentation (GDA) based on pretrained generative models has emerged as an effective solution. However, existing methods rely on task-agnostic augmentation strategies that overlook downstream model needs. Although recent dynamic GDA methods incorporate model feedback to guide augmentation, they still struggle to reliably determine sample-specific augmentation strengths and adapt augmentation strategies to different image regions while balancing image diversity and class semantics. To address these issues, we propose learning-state-aware dynamic generative data augmentation (LSADA). Specifically, LSADA constructs a learning state for each sample based on its current loss and loss-decrease rate, which is then mapped to a sample-specific augmentation strength. Furthermore, LSADA introduces a decoupled data augmentation and diffusion fusion strategy that applies strength-controlled transformations to class-relevant regions and generates diverse class-irrelevant regions, progressively fusing them to improve image diversity while preserving class semantics. Experiments on nine public datasets show that LSADA outperforms the existing SOTA dynamic GDA method by an average of 4.5% on six natural image datasets and 2.5% on three medical image datasets.", "arxiv_id": "2608.18907", "arxiv_url": "https://arxiv.org/abs/2608.18907", "authors": ["Ting Xiang", "Chenxi Deng", "Jinhui Zhao", "Bingting Jiang", "Ke Zhang", "Changjian Chen", "Zhuo Tang"], "brief": "\u8bba\u6587\u63d0\u51fa LSADA\uff0c\u7528\u6837\u672c\u5f53\u524d\u635f\u5931\u548c\u635f\u5931\u4e0b\u964d\u7387\u523b\u753b\u5b66\u4e60\u72b6\u6001\uff0c\u5e76\u636e\u6b64\u52a8\u6001\u51b3\u5b9a\u6bcf\u4e2a\u6837\u672c\u7684\u751f\u6210\u589e\u5f3a\u5f3a\u5ea6\u3002\u65b9\u6cd5\u8fd8\u5c06\u7c7b\u522b\u76f8\u5173\u533a\u57df\u7684\u53ef\u63a7\u53d8\u6362\u4e0e\u7c7b\u522b\u65e0\u5173\u533a\u57df\u7684\u6269\u6563\u751f\u6210\u89e3\u8026\u878d\u5408\uff0c\u5728\u4fdd\u6301\u8bed\u4e49\u7684\u540c\u65f6\u63d0\u5347\u591a\u6837\u6027\uff1b\u57289\u4e2a\u5c0f\u89c4\u6a21\u56fe\u50cf\u5206\u7c7b\u6570\u636e\u96c6\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u52a8\u6001\u751f\u6210\u589e\u5f3a\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18907", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6570\u636e\u589e\u5f3a", "\u6269\u6563\u6a21\u578b", "\u5c0f\u6837\u672c\u5b66\u4e60", "\u56fe\u50cf\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18907v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning-State-Aware Dynamic Generative Data Augmentation on Small-Scale Datasets", "tldr": "\u8bba\u6587\u63d0\u51fa LSADA\uff0c\u7528\u6837\u672c\u5f53\u524d\u635f\u5931\u548c\u635f\u5931\u4e0b\u964d\u7387\u523b\u753b\u5b66\u4e60\u72b6\u6001\uff0c\u5e76\u636e\u6b64\u52a8\u6001\u51b3\u5b9a\u6bcf\u4e2a\u6837\u672c\u7684\u751f\u6210\u589e\u5f3a\u5f3a\u5ea6\u3002\u65b9\u6cd5\u8fd8\u5c06\u7c7b\u522b\u76f8\u5173\u533a\u57df\u7684\u53ef\u63a7\u53d8\u6362\u4e0e\u7c7b\u522b\u65e0\u5173\u533a\u57df\u7684\u6269\u6563\u751f\u6210\u89e3\u8026\u878d\u5408\uff0c\u5728\u4fdd\u6301\u8bed\u4e49\u7684\u540c\u65f6\u63d0\u5347\u591a\u6837\u6027\uff1b\u57289\u4e2a\u5c0f\u89c4\u6a21\u56fe\u50cf\u5206\u7c7b\u6570\u636e\u96c6\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u52a8\u6001\u751f\u6210\u589e\u5f3a\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As AI systems are increasingly deployed in safety-critical application domains (e.g., autonomous driving), associated risks increase too. Deep learning models underlying modern AI systems, therefore, must undergo thorough testing to ensure their correct behaviour. A single robustness test involves thousands of inferences to empirically verify if a model\u0027s outputs remain stable under a bounded perturbation of its inputs. However, existing testing frameworks lack the means to systematically explore and summarise robustness across a combinatorial space of perturbations. We propose TestifAI, a deep learning testing framework for efficient and accurate estimation of robustness against combinations of perturbations. TestifAI enables users to specify operational conditions as structured spaces of semantic input perturbations (e.g., image blur, brightness and zoom) and discrete severity levels (e.g., low, medium and high). Users can query model robustness for any combination (e.g., \"low blur, high brightness, and medium zoom\"). To achieve efficiency and accuracy, TestifAI introduces partial model tomography, a novel approach to reconstructing model behaviour in a multi-perturbation space from tests that apply only a small number of perturbations (lower-order projections). To estimate robustness against at least three perturbations, TestifAI trains an auxiliary model on the results of tests involving up to two perturbations only, avoiding execution of an exponential number of tests. Our experiments on five image and language classification tasks show that TestifAI can predict higher-order (3 and 4 perturbations) test outcomes from low-order (1 and 2 perturbations) observations with an aggregate robustness estimation error of less than 7%, while reducing the number of inferences by 60-80%.", "arxiv_id": "2608.18900", "arxiv_url": "https://arxiv.org/abs/2608.18900", "authors": ["Arooj Arif", "Tobias Hartung", "Elena Botoeva", "Alexandros Koliousis"], "brief": "\u672c\u6587\u63d0\u51fa TestifAI\uff0c\u4e00\u4e2a\u9762\u5411\u6df1\u5ea6\u5b66\u4e60\u7cfb\u7edf\u7684\u9c81\u68d2\u6027\u6d4b\u8bd5\u6846\u67b6\uff0c\u53ef\u5728\u591a\u79cd\u8bed\u4e49\u6270\u52a8\u53ca\u5176\u5f3a\u5ea6\u7ec4\u5408\u4e0b\u9ad8\u6548\u4f30\u8ba1\u6a21\u578b\u884c\u4e3a\u3002\u5176\u6838\u5fc3\u65b9\u6cd5\u201c\u90e8\u5206\u6a21\u578b\u65ad\u5c42\u6210\u50cf\u201d\u53ea\u7528\u4f4e\u9636\u6270\u52a8\u6d4b\u8bd5\u7ed3\u679c\u9884\u6d4b\u9ad8\u9636\u7ec4\u5408\u6d4b\u8bd5\uff0c\u5728\u56fe\u50cf\u548c\u8bed\u8a00\u5206\u7c7b\u4efb\u52a1\u4e0a\u5c06\u63a8\u7406\u6b21\u657 r yet equivalent expressions, thereby producing more compact and human-readable representations without altering logical entailments. We evaluate the effectiveness of CES on class expressions learned from two medium-sized ontologies, demonstrating measurable improvements in reasoning efficiency and reductions in verbosity. This work contributes to the broader goal of making ontology-driven applications more accessible, maintainable, and scalable, with direct implications for knowledge graph construction, semantic search, and Web-scale reasoning. CES is implemented within the open-source Python framework OWLAPY and is publicly available.", "arxiv_id": "2608.18899", "arxiv_url": "https://arxiv.org/abs/2608.18899", "authors": ["Alkid Baci", "N\u0027Dah Jean Kouagou", "Caglar Demir", "Axel-Cyrille Ngonga Ngomo"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e86\u7528\u4e8e OWL/DL \u7c7b\u8868\u8fbe\u5f0f\u53e5\u6cd5\u7b80\u5316\u7684\u7b97\u6cd5 CES\uff0c\u901a\u8fc7\u4e00\u7cfb\u5217\u4fdd\u6301\u8bed\u4e49\u7b49\u4ef7\u7684\u91cd\u5199\u89c4\u5219\u6d88\u9664\u5197\u4f59\u3001\u538b\u7f29\u8868\u8fbe\u3002\u5b9e\u9a8c\u8868\u660e\uff0cCES \u80fd\u964d\u4f4e\u8868\u8fbe\u5f0f\u5197\u957f\u5ea6\u5e76\u63d0\u5347\u63a8\u7406\u6548\u7387\uff0c\u4f7f\u672c\u4f53\u548c\u77e5\u8bc6\u56fe\u8c31\u5e94\u7528\u66f4\u6613\u7ef4\u62a4\u4e0e\u6269\u5c55\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18899", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u672c\u4f53", "\u63cf\u8ff0\u903b\u8f91", "\u77e5\u8bc6\u56fe\u8c31", "\u8bed\u4e49\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18899v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Syntactic Simplification of OWL Class Expressions", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e86\u7528\u4e8e OWL/DL \u7c7b\u8868\u8fbe\u let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){

  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
