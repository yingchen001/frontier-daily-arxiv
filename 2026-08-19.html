<script>
const PAPERS = [{"abstract": "Frontier open-weight models are increasingly available, but serving them still largely assumes datacenter infrastructure. We present FreeToken, an edge-native MoE serving system that treats a personal machine not as a small GPU, but as a unified, elastic inference platform. FreeToken co-designs the full serving stack, including model layout and loading, expert residency, CPU--GPU execution, agentic state reuse, and runtime memory management, around two realities of local AI: agent workloads continuously change their execution pattern, and edge hardware exposes heterogeneous resources whose balance differs from machine to machine. Rather than committing to a fixed offloading strategy, FreeToken continuously maps computation and model state onto the resources actually available. FreeToken supports more than 20 MoE models and real coding and tool-using agents across hardware ranging from an 8GB laptop GPU to a single workstation GPU. More importantly, it changes what these machines can practically serve, from a 35B model on a laptop to a 284B model on a gaming desktop and the 753B GLM-5.2 on a single workstation GPU. FreeToken turns open weights into deployable local software, making the machines users already own a practical platform for frontier-scale intelligence. We release the system at flashml.ai.", "arxiv_id": "2608.16157", "arxiv_url": "https://arxiv.org/abs/2608.16157", "authors": ["Shuo Yang", "Xiaoze Fan", "Melissa Pan", "Haocheng Xi", "Zhe Wang", "Shanlin Sun", "Kurt Keutzer", "Song Han", "Matei Zaharia", "Chenfeng Xu", "Ion Stoica"], "brief": "FreeToken \u662f\u4e00\u4e2a\u9762\u5411\u8fb9\u7f18\u8bbe\u5907\u7684 MoE \u63a8\u7406\u670d\u52a1\u7cfb\u7edf\uff0c\u8054\u5408\u4f18\u5316\u6a21\u578b\u5e03\u5c40\u3001\u4e13\u5bb6\u9a7b\u7559\u3001CPU-GPU \u534f\u540c\u6267\u884c\u3001\u667a\u80fd\u4f53\u72b6\u6001\u590d\u7528\u4e0e\u8fd0\u884c\u65f6\u5185\u5b58\u7ba1\u7406\u3002\u5b83\u6839\u636e\u672c\u5730\u786c\u4ef6\u5e26\u5bbd\u4e0e\u8d44\u6e90\u72b6\u6001\u52a8\u6001\u8c03\u6574\u6267\u884c\u7b56\u7565\uff0c\u800c\u975e\u4f9d\u8d56\u56fa\u5b9a\u5378\u8f7d\u65b9\u6848\u3002", "categories": ["cs.DC"], "github_repo": "https://github.com/FlashML-org/FreeToken", "github_stars": 67, "hf_url": "https://huggingface.co/papers/2608.16157", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u652f\u6301 20 \u591a\u4e2a MoE \u6a21\u578b\uff0c\u5e76\u8986\u76d6\u771f\u5b9e\u4ee3\u7801\u751f\u6210\u4e0e\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u5de5\u4f5c\u8d1f\u8f7d", "\u53ef\u5728\u4ece 8GB \u7b14\u8bb0\u672c GPU \u5230\u5355\u5de5\u4f5c\u7ad9 GPU \u7684\u591a\u7c7b\u786c\u4ef6\u4e0a\u8fd0\u884c\uff0c\u52a8\u6001\u6620\u5c04\u8ba1\u7b97\u4e0e\u6a21\u578b\u72b6\u6001", "\u5c55\u793a\u4e86\u5728\u7b14\u8bb0\u672c\u8fd0\u884c 35B\u3001\u6e38\u620f\u53f0\u5f0f\u673a\u8fd0\u884c 284B\u3001\u5355\u5de5\u4f5c\u7ad9 GPU \u8fd0\u884c 753B GLM-5.2 \u7684\u80fd\u529b"], "keywords": ["MoE", "\u8fb9\u7f18\u63a8\u7406", "\u667a\u80fd\u4f53", "\u6a21\u578b\u670d\u52a1"], "num_comments": 2, "on_hf": true, "organization": "University of California, Berkeley", "pdf_url": "https://arxiv.org/pdf/2608.16157v1", "published_at": "2026-08-17", "score": 0.726, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Berkeley", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (61\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16157.png", "title": "FreeToken: Efficient Edge-Native MoE Serving with Bandwidth-Adaptive Execution", "tldr": "\u8ba9\u8d85\u5927MoE\u6a21\u578b\u53ef\u5728\u672c\u5730\u8fb9\u7f18\u8bbe\u5907\u9ad8\u6548\u670d\u52a1", "upvotes": 61, "what_it_is": "FreeToken \u662f\u4e00\u4e2a\u9762\u5411\u8fb9\u7f18\u8bbe\u5907\u7684 MoE \u63a8\u7406\u670d\u52a1\u7cfb\u7edf\uff0c\u8054\u5408\u4f18\u5316\u6a21\u578b\u5e03\u5c40\u3001\u4e13\u5bb6\u9a7b\u7559\u3001CPU-GPU \u534f\u540c\u6267\u884c\u3001\u667a\u80fd\u4f53\u72b6\u6001\u590d\u7528\u4e0e\u8fd0\u884c\u65f6\u5185\u5b58\u7ba1\u7406\u3002\u5b83\u6839\u636e\u672c\u5730\u786c\u4ef6\u5e26\u5bbd\u4e0e\u8d44\u6e90\u72b6\u6001\u52a8\u6001\u8c03\u6574\u6267\u884c\u7b56\u7565\uff0c\u800c\u975e\u4f9d\u8d56\u56fa\u5b9a\u5378\u8f7d\u65b9\u6848\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6570\u636e\u4e2d\u5fc3\u7ea7\u5f00\u6e90\u5927\u6a21\u578b\u670d\u52a1\u80fd\u529b\u4e0b\u6c89\u5230\u4e2a\u4eba\u8bbe\u5907\uff0c\u663e\u8457\u63d0\u5347\u672c\u5730 AI \u4e0e\u667a\u80fd\u4f53\u5e94\u7528\u7684\u53ef\u90e8\u7f72\u6027\uff0c\u5bf9\u9690\u79c1\u3001\u672c\u5730\u4f4e\u6210\u672c\u63a8\u7406\u548c\u8fb9\u7f18\u667a\u80fd\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "AI systems are increasingly capable of contributing to mathematical research. In research practice, frontier-model reasoning is a limited resource, and expert mathematical review is even more sharply constrained. Allocating these scarce resources well is therefore central to making AI-assisted mathematical discovery efficient. In most current AI-for-math workflows, human effort is concentrated at the beginning and end, in selecting suitable research problems and later reviewing the resulting artifacts. These two stages are becoming bottlenecks for research-level mathematics. We address them by proposing a new human-AI discovery paradigm. The human input is no longer a single problem selected in advance, but a research direction in which the experts have interest and expertise. The system then searches a broad literature corpus for candidate problems in that direction. Inspired by search and recommender systems, we build Find, Attempt, and Recommend (FAR), a literature-to-review cascade that automates the search for suitable problems and focuses human attention on artifacts that have passed several stages of filtering. In a combinatorics pilot, the pipeline starts from 5,245 combinatorics papers, recovers 6,453 candidate conjectures or open problems, and filters them to 4,717 apparently well-posed and still-open conjectures. Subsequent reasoning and automated triage stages surface 598 potential resolutions and select 77 items for author-team review. Among them, we identify many interesting discoveries, including results on conjectures and questions of Davies--Jenssen--Perkins--Roberts, Erd\u0151s--Straus, Ikenmeyer--Pak--Panova, and Lund--Saraf--Wolf. These results demonstrate the effectiveness of this new mode of human-AI collaboration for mathematical discovery.", "arxiv_id": "2608.16977", "arxiv_url": "https://arxiv.org/abs/2608.16977", "authors": ["Zeyu Zheng", "Shengtong Zhang", "Jeremy Avigad", "Prasad Tetali", "Sean Welleck"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6570\u5b66\u53d1\u73b0\u7684\u4eba\u673a\u534f\u4f5c\u8303\u5f0f\uff1a\u4e13\u5bb6\u53ea\u7ed9\u51fa\u7814\u7a76\u65b9\u5411\uff0c\u7cfb\u7edf\u4ece\u6587\u732e\u4e2d\u81ea\u52a8\u6316\u6398\u3001\u5c1d\u8bd5\u5e76\u63a8\u8350\u503c\u5f97\u5ba1\u9605\u7684\u5f00\u653e\u95ee\u9898\u3002\u4f5c\u8005\u6784\u5efa\u4e86 Find, Attempt, Recommend\uff08FAR\uff09\u7ea7\u8054\u6d41\u7a0b\uff0c\u7528\u4e8e\u5c06\u5927\u89c4\u6a21\u6587\u732e\u8f6c\u5316\u4e3a\u5c11\u91cf\u9ad8\u4ef7\u503c\u5019\u9009\u53d1\u73b0\u3002", "categories": ["cs.AI", "math.CO"], "github_repo": "https://github.com/zeyu-zheng/FAR", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2608.16977", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ece5245\u7bc7\u7ec4\u5408\u6570\u5b66\u8bba\u6587\u4e2d\u63d0\u53d66453\u4e2a\u5019\u9009\u731c\u60f3\u6216\u5f00\u653e\u95ee\u9898\uff0c\u5e76\u8fc7\u6ee4\u51fa4717\u4e2a\u770b\u4f3c\u8868\u8ff0\u826f\u597d\u4e14\u4ecd\u672a\u89e3\u51b3\u7684\u95ee\u9898", "\u901a\u8fc7\u524d\u6cbf\u6a21\u578b\u63a8\u7406\u4e0e\u81ea\u52a8\u5316\u5206\u8bca\uff0c\u751f\u6210598\u4e2a\u6f5c\u5728\u89e3\u51b3\u7ed3\u679c\uff0c\u5e76\u6700\u7ec8\u7b5b\u900977\u9879\u4ea4\u7531\u4f5c\u8005\u56e2\u961f\u5ba1\u9605", "\u5728\u591a\u4e2a\u5df2\u6709\u91cd\u8981\u731c\u60f3\u548c\u95ee\u9898\u4e0a\u53d1\u73b0\u6709\u8da3\u7ed3\u679c\uff0c\u5305\u62ecDavies--Jenssen--Perkins--Roberts\u3001Erd\u0151s--Straus\u7b49\u76f8\u5173\u95ee\u9898"], "keywords": ["\u6570\u5b66\u63a8\u7406", "\u667a\u80fd\u4f53", "\u6587\u732e\u6316\u6398", "\u4eba\u673a\u534f\u4f5c"], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2608.16977v1", "published_at": "2026-08-17", "score": 0.479, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16977.png", "title": "The Problem Is the Problem: Towards Scalable Mathematical Discovery", "tldr": "FAR\u81ea\u52a8\u7b5b\u9009\u6570\u5b66\u5f00\u653e\u95ee\u9898\u5e76\u4fc3\u6210\u53d1\u73b0", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6570\u5b66\u53d1\u73b0\u7684\u4eba\u673a\u534f\u4f5c\u8303\u5f0f\uff1a\u4e13\u5bb6\u53ea\u7ed9\u51fa\u7814\u7a76\u65b9\u5411\uff0c\u7cfb\u7edf\u4ece\u6587\u732e\u4e2d\u81ea\u52a8\u6316\u6398\u3001\u5c1d\u8bd5\u5e76\u63a8\u8350\u503c\u5f97\u5ba1\u9605\u7684\u5f00\u653e\u95ee\u9898\u3002\u4f5c\u8005\u6784\u5efa\u4e86 Find, Attempt, Recommend\uff08FAR\uff09\u7ea7\u8054\u6d41\u7a0b\uff0c\u7528\u4e8e\u5c06\u5927\u89c4\u6a21\u6587\u732e\u8f6c\u5316\u4e3a\u5c11\u91cf\u9ad8\u4ef7\u503c\u5019\u9009\u53d1\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aAI\u7528\u4e8e\u6570\u5b66\u7814\u7a76\u7684\u74f6\u9888\u4ece\u201c\u4eba\u5de5\u9009\u9898+\u4eba\u5de5\u5ba1\u7a3f\u201d\u8f6c\u5411\u53ef\u6269\u5c55\u7684\u6587\u732e\u641c\u7d22\u3001\u63a8\u7406\u548c\u63a8\u8350\u6d41\u7a0b\uff0c\u6709\u671b\u663e\u8457\u63d0\u9ad8\u6570\u5b66\u5f00\u653e\u95ee\u9898\u53d1\u73b0\u4e0e\u9a8c\u8bc1\u7684\u6548\u7387\u3002"}, {"abstract": "Continuous self-improvement requires an ever-expanding pool of self-generated, diverse, adaptive goals. For language agents, existing training environment pools (hand-curated, statically synthesized, or frozen-verifier) keep the goal distribution fixed as the learner scales. We introduce SPADE (Self-Play in Adaptive Synthetic Executable Environments), a self-play RL framework in which a single LLM plays two roles: an Environment Designer that writes complete, long-horizon training environments as executable code with an OpenAI Gym-style reset()/step() interface, and a Reasoning Agent that learns to act in them. Each is a stateful, multi-turn environment (state transitions, reward functions, and verification code), so one interface spans reasoning problems and multi-step agentic tool use. The Reasoning Agent\u0027s regret is estimated using the gap between its reward with and without privileged hints; in optimizing this regret signal the Environment Designer learns to target environments at the edge of the agent\u0027s capabilities while keeping them feasible. Through extensive experimentation, we find several components critical to success: grounding the Environment Designer on documents sampled from a large pretraining corpus, and giving it an accumulated environment memory. Scaling to 30B-parameter models, SPADE improves over the strongest fixed-environment baseline by +5.3 on average across eight held-out math, science, code, and reasoning benchmarks, and lifts the tool-use setting by +5.7 on BFCL-v4 multi-turn and +13.9 on ACEBench-Agent; on the games setting, the margin over the strongest baseline grows with model scale. By making environment design itself a learnable component, SPADE takes a concrete step toward open-ended self-improvement.", "arxiv_id": "2608.19197", "arxiv_url": "https://arxiv.org/abs/2608.19197", "authors": ["Bo Liu", "Simon Yu", "Yiding Jiang", "Ao Qu", "Andrew Zhao", "Zichen Liu", "Junsu Kim", "Zijian Zhou", "Seungone Kim", "Tongzheng Ren", "Mickel Liu", "Hanfei Yu", "Zhaorun Chen", "Weiyan Shi", "Paul Pu Liang", "Luke Zettlemoyer", "Yejin Choi", "Natasha Jaques"], "brief": "SPADE \u63d0\u51fa\u4e00\u79cd\u81ea\u535a\u5f08\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u8ba9\u540c\u4e00\u4e2a LLM \u540c\u65f6\u626e\u6f14\u73af\u5883\u8bbe\u8ba1\u8005\u548c\u63a8\u7406\u667a\u80fd\u4f53\u3002\u73af\u5883\u8bbe\u8ba1\u8005\u751f\u6210\u5e26 reset()/step() \u63a5\u53e3\u3001\u5956\u52b1\u4e0e\u9a8c\u8bc1\u903b\u8f91\u7684\u53ef\u6267\u884c\u957f\u7a0b\u8bad\u7ec3\u73af\u5883\uff0c\u63a8\u7406\u667a\u80fd\u4f53\u5728\u5176\u4e2d\u5b66\u4e60\u591a\u6b65\u63a8\u7406\u4e0e\u5de5\u5177\u4f7f\u7528\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19197", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u7528\u201c\u6709/\u65e0\u7279\u6743\u63d0\u793a\u201d\u7684\u5956\u52b1\u5dee\u4f30\u8ba1\u63a8\u7406\u667a\u80fd\u4f53\u7684\u9057\u61be\uff0c\u9a71\u52a8\u73af\u5883\u8bbe\u8ba1\u8005\u751f\u6210\u5904\u4e8e\u667a\u80fd\u4f53\u80fd\u529b\u8fb9\u7f18\u4f46\u4ecd\u53ef\u89e3\u7684\u95ee\u9898\u3002", "\u73af\u5883\u662f\u72b6\u6001\u5316\u3001\u591a\u8f6e\u3001\u53ef\u6267\u884c\u4ee3\u7801\uff0c\u7edf\u4e00\u8986\u76d6\u6570\u5b66\u63a8\u7406\u3001\u79d1\u5b66\u3001\u4ee3\u7801\u4efb\u52a1\u548c\u591a\u6b65\u667a\u80fd\u4f53\u5de5\u5177\u4f7f\u7528\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u57fa\u4e8e\u9884\u8bad\u7ec3\u8bed\u6599\u6587\u6863\u8fdb\u884c\u73af\u5883\u8bbe\u8ba1 grounding\uff0c\u4ee5\u53ca\u7d2f\u79ef\u73af\u5883\u8bb0\u5fc6\uff0c\u662f\u63d0\u5347\u6548\u679c\u7684\u5173\u952e\u7ec4\u4ef6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u535a\u5f08", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19197v1", "published_at": "2026-08-19", "score": 0.45, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.19197.png", "title": "SPADE: Self-Play in Adaptive Synthetic Executable Environments", "tldr": "\u81ea\u535a\u5f08\u751f\u6210\u53ef\u6267\u884c\u73af\u5883\u63d0\u5347LLM\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "SPADE \u63d0\u51fa\u4e00\u79cd\u81ea\u535a\u5f08\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u8ba9\u540c\u4e00\u4e2a LLM \u540c\u65f6\u626e\u6f14\u73af\u5883\u8bbe\u8ba1\u8005\u548c\u63a8\u7406\u667a\u80fd\u4f53\u3002\u73af\u5883\u8bbe\u8ba1\u8005\u751f\u6210\u5e26 reset()/step() \u63a5\u53e3\u3001\u5956\u52b1\u4e0e\u9a8c\u8bc1\u903b\u8f91\u7684\u53ef\u6267\u884c\u957f\u7a0b\u8bad\u7ec3\u73af\u5883\uff0c\u63a8\u7406\u667a\u80fd\u4f53\u5728\u5176\u4e2d\u5b66\u4e60\u591a\u6b65\u63a8\u7406\u4e0e\u5de5\u5177\u4f7f\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8bad\u7ec3\u73af\u5883\u672c\u8eab\u53d8\u6210\u53ef\u5b66\u4e60\u5bf9\u8c61\uff0c\u7a81\u7834\u56fa\u5b9a\u9898\u5e93\u6216\u9759\u6001\u5408\u6210\u73af\u5883\u7684\u9650\u5236\uff1b\u5728 30B \u6a21\u578b\u4e0a\u76f8\u5bf9\u6700\u5f3a\u56fa\u5b9a\u73af\u5883\u57fa\u7ebf\uff0c\u516b\u4e2a\u4fdd\u7559\u57fa\u51c6\u5e73\u5747\u63d0\u5347 +5.3\uff0c\u5e76\u5728 BFCL-v4 \u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u548c ACEBench-Agent \u4e0a\u5206\u522b\u63d0\u5347 +5.7\u3001+13.9\uff0c\u5c55\u793a\u4e86\u5f00\u653e\u5f0f\u81ea\u6211\u6539\u8fdb\u7684\u6f5c\u529b\u3002"}, {"abstract": "We assess indirect prompt injection in DeepSeek Harness (DSH), using AI-Infra-Guard (A.I.G) to construct tests, deliver controlled taint, execute DSH, collect traces, and judge outcomes. The study covers 14,560 controlled executions over 16 indirect-content channels, text and file carrier modes, 35 payload objectives, one unmodified baseline, and 12 attack methods. The experiment preserves DSH\u0027s agent loop, tool registry, model adapter, and session-event path; source tools and sensitive sinks are local fixtures, so attempted actions are recorded without external side effects. We evaluate each trace with a deterministic rule-based judge, \\JudgeR{} (RuleJudge), and a semantic LLM-based judge, \\JudgeL{} (LLMJudge). The strongest observed attack success rates are 17.0% under \\JudgeL{} for fake-completion attack in text mode, 25.5% under \\JudgeR{} for hidden Unicode in file mode, and 16.0% under \\JudgeR{} for the skills channel in file mode. \\JudgeL{} also assigns partial compliance more often than \\JudgeR{} (7.3% versus 2.0%). We relate these results to DSH\u0027s treatment of tool results, additional contexts, and tool-call policy hooks, then identify controls that should sit between untrusted content and sensitive actions. Our code is available at https://github.com/Tencent/AI-Infra-Guard/tree/main/Research/deepseek-harness-security-assessment .", "arxiv_id": "2608.16393", "arxiv_url": "https://arxiv.org/abs/2608.16393", "authors": ["Zonghao Ying", "Xiangfan Wu", "Huiyu Wu", "Xing Zheng", "Huangsheng Cheng", "Xiaorong Shi", "Jing Guo"], "brief": "\u672c\u6587\u4f7f\u7528 AI-Infra-Guard \u5bf9 DeepSeek Harness \u8fdb\u884c\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u5b89\u5168\u8bc4\u4f30\uff0c\u8986\u76d616\u7c7b\u95f4\u63a5\u5185\u5bb9\u901a\u9053\u3001\u6587\u672c\u4e0e\u6587\u4ef6\u8f7d\u4f53\u300135\u79cd\u653b\u51fb\u76ee\u6807\u548c12\u79cd\u653b\u51fb\u65b9\u6cd5\u3002\u5b9e\u9a8c\u5728\u4fdd\u7559\u5176\u667a\u80fd\u4f53\u5faa\u73af\u3001\u5de5\u5177\u6ce8\u518c\u3001\u6a21\u578b\u9002\u914d\u4e0e\u4f1a\u8bdd\u4e8b\u4ef6\u8def\u5f84\u7684\u540c\u65f6\uff0c\u7528\u672c\u5730\u5939\u5177\u8bb0\u5f55\u654f\u611f\u64cd\u4f5c\uff0c\u907f\u514d\u5916\u90e8\u526f\u4f5c\u7528\u3002", "categories": ["cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16393", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5171\u6267\u884c14,560\u6b21\u53d7\u63a7\u6d4b\u8bd5\uff0c\u5e76\u5206\u522b\u91c7\u7528\u89c4\u5219\u5224\u522b\u5668 RuleJudge \u4e0e\u8bed\u4e49 LLM \u5224\u522b\u5668 LLMJudge \u8bc4\u4f30\u653b\u51fb\u7ed3\u679c\u3002", "\u6700\u9ad8\u89c2\u5bdf\u653b\u51fb\u6210\u529f\u7387\u5305\u62ec\uff1a\u6587\u672c\u6a21\u5f0f\u4e0b fake-completion \u653b\u51fb LLMJudge \u5224\u5b9a17.0%\uff0c\u6587\u4ef6\u6a21\u5f0f\u4e0b hidden Unicode \u653b\u51fb RuleJudge \u5224\u5b9a25.5%\uff0c\u6587\u4ef6\u6a21\u5f0f skills \u901a\u9053 RuleJudge \u5224\u5b9a16.0%\u3002", "LLMJudge \u6bd4 RuleJudge \u66f4\u5e38\u5224\u5b9a\u4e3a\u90e8\u5206\u670d\u4ece\u653b\u51fb\u6307\u4ee4\uff0c\u6bd4\u4f8b\u4e3a7.3%\u5bf92.0%\uff0c\u663e\u793a\u8bed\u4e49\u8bc4\u4f30\u80fd\u6355\u6349\u66f4\u7ec6\u7c92\u5ea6\u98ce\u9669\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u63d0\u793a\u6ce8\u5165", "AI\u5b89\u5168", "\u5de5\u5177\u8c03\u7528"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.16393v2", "published_at": "2026-08-17", "score": 0.449, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16393.png", "title": "Security Assessment of DeepSeek Harness with A.I.G: Evaluating Resistance to Indirect Prompt Injection", "tldr": "\u7cfb\u7edf\u8bc4\u4f30DSH\u5bf9\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u7684\u6297\u6027", "upvotes": 4, "what_it_is": "\u672c\u6587\u4f7f\u7528 AI-Infra-Guard \u5bf9 DeepSeek Harness \u8fdb\u884c\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u5b89\u5168\u8bc4\u4f30\uff0c\u8986\u76d616\u7c7b\u95f4\u63a5\u5185\u5bb9\u901a\u9053\u3001\u6587\u672c\u4e0e\u6587\u4ef6\u8f7d\u4f53\u300135\u79cd\u653b\u51fb\u76ee\u6807\u548c12\u79cd\u653b\u51fb\u65b9\u6cd5\u3002\u5b9e\u9a8c\u5728\u4fdd\u7559\u5176\u667a\u80fd\u4f53\u5faa\u73af\u3001\u5de5\u5177\u6ce8\u518c\u3001\u6a21\u578b\u9002\u914d\u4e0e\u4f1a\u8bdd\u4e8b\u4ef6\u8def\u5f84\u7684\u540c\u65f6\uff0c\u7528\u672c\u5730\u5939\u5177\u8bb0\u5f55\u654f\u611f\u64cd\u4f5c\uff0c\u907f\u514d\u5916\u90e8\u526f\u4f5c\u7528\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u4f9b\u4e86\u9762\u5411\u771f\u5b9e LLM \u5de5\u5177\u8c03\u7528\u6846\u67b6\u7684\u7cfb\u7edf\u5316\u5b89\u5168\u57fa\u51c6\uff0c\u63ed\u793a DeepSeek Harness \u5728\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u3001\u5de5\u5177\u7ed3\u679c\u5904\u7406\u548c\u654f\u611f\u52a8\u4f5c\u9632\u62a4\u4e0a\u7684\u8584\u5f31\u70b9\uff0c\u5e76\u6307\u51fa\u5e94\u5728\u4e0d\u53ef\u4fe1\u5185\u5bb9\u4e0e\u654f\u611f\u5de5\u5177\u8c03\u7528\u4e4b\u95f4\u52a0\u5165\u7b56\u7565\u63a7\u5236\u3002"}, {"abstract": "Looped language models have shown promising results on reasoning benchmarks, yet their potential for agentic tool use remains largely unexplored. We study this question in compositional tool-calling settings, where models must coordinate multiple API calls, maintain intermediate state, and preserve dependencies across tool interactions. We evaluate native and retrofitted looped language models on API-Bank, BFCL, and NESTful, comparing looped and non-looped models trained under matched supervised fine-tuning recipes and varying recurrent depth at inference time. In controlled experiments, recurrent computation generally benefits compositional and dependency-aware tool use, while providing smaller and more model-dependent gains on isolated API invocation. Accuracy on multi-step tool use generally increases with recurrent depth; adaptive inference, however, achieves a more favorable compute-performance trade-off by allocating additional computation only when needed. Our results suggest that looped language models are a promising architecture for agentic systems that require reliable planning, coordination, and execution of compositional tool use workflows.", "arxiv_id": "2608.18171", "arxiv_url": "https://arxiv.org/abs/2608.18171", "authors": ["Andrei Cristian Popescu", "Haitz S\u00e1ez de Oc\u00e1riz Borde", "Pietro Li\u00f2"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e86\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u5728\u7ec4\u5408\u5f0f\u5de5\u5177\u8c03\u7528\u4e2d\u7684\u8868\u73b0\uff0c\u5173\u6ce8\u591a API \u534f\u8c03\u3001\u4e2d\u95f4\u72b6\u6001\u7ef4\u62a4\u548c\u4f9d\u8d56\u5173\u7cfb\u4fdd\u6301\u3002\u5b9e\u9a8c\u6bd4\u8f83\u539f\u751f\u4e0e\u6539\u9020\u7684\u5faa\u73af\u6a21\u578b\uff0c\u5e76\u5206\u6790\u63a8\u7406\u65f6\u5faa\u73af\u6df1\u5ea6\u4e0e\u81ea\u9002\u5e94\u8ba1\u7b97\u7684\u5f71\u54cd\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18171", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728 API-Bank\u3001BFCL\u3001NESTful \u7b49\u57fa\u51c6\u4e0a\uff0c\u5faa\u73af\u8ba1\u7b97\u666e\u904d\u63d0\u5347\u591a\u6b65\u3001\u4f9d\u8d56\u611f\u77e5\u7684\u5de5\u5177\u8c03\u7528\u51c6\u786e\u7387\u3002", "\u63a8\u7406\u65f6\u589e\u52a0 recurrent depth \u901a\u5e38\u80fd\u63d0\u9ad8\u590d\u6742\u5de5\u5177\u8c03\u7528\u8868\u73b0\uff0c\u4f46\u5bf9\u5355\u6b21 API \u8c03\u7528\u6536\u76ca\u8f83\u5c0f\u4e14\u4f9d\u8d56\u6a21\u578b\u3002", "\u81ea\u9002\u5e94\u63a8\u7406\u53ef\u6309\u9700\u5206\u914d\u989d\u5916\u8ba1\u7b97\uff0c\u5728\u6027\u80fd\u4e0e\u8ba1\u7b97\u6210\u672c\u4e4b\u95f4\u53d6\u5f97\u66f4\u4f18\u6298\u4e2d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5faa\u73af\u6a21\u578b", "\u81ea\u9002\u5e94\u63a8\u7406"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18171v1", "published_at": "2026-08-17", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18171.png", "title": "Looped Language Models Improve Compositional Tool Calling", "tldr": "\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u63d0\u5347\u591a\u6b65\u5de5\u5177\u8c03\u7528\u80fd\u529b", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e86\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u5728\u7ec4\u5408\u5f0f\u5de5\u5177\u8c03\u7528\u4e2d\u7684\u8868\u73b0\uff0c\u5173\u6ce8\u591a API \u534f\u8c03\u3001\u4e2d\u95f4\u72b6\u6001\u7ef4\u62a4\u548c\u4f9d\u8d56\u5173\u7cfb\u4fdd\u6301\u3002\u5b9e\u9a8c\u6bd4\u8f83\u539f\u751f\u4e0e\u6539\u9020\u7684\u5faa\u73af\u6a21\u578b\uff0c\u5e76\u5206\u6790\u63a8\u7406\u65f6\u5faa\u73af\u6df1\u5ea6\u4e0e\u81ea\u9002\u5e94\u8ba1\u7b97\u7684\u5f71\u54cd\u3002", "why_notable": "\u8bba\u6587\u5c06\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u4ece\u63a8\u7406\u4efb\u52a1\u6269\u5c55\u5230\u667a\u80fd\u4f53\u5de5\u5177\u4f7f\u7528\u573a\u666f\uff0c\u8868\u660e\u5176\u5728\u89c4\u5212\u3001\u534f\u8c03\u548c\u6267\u884c\u7ec4\u5408\u5f0f\u5de5\u5177\u6d41\u7a0b\u4e2d\u5177\u6709\u67b6\u6784\u4f18\u52bf\uff0c\u5bf9\u6784\u5efa\u66f4\u53ef\u9760\u7684 LLM Agent \u6709\u5b9e\u9645\u542f\u53d1\u3002"}, {"abstract": "Cyber threat intelligence (CTI) is increasingly consumed not by human analysts but by LLM agents that compose multi-step investigations at query time. The harness side of this shift has matured rapidly (planning loops, tool protocols, context management), but the corpus side has not: threat reports and vulnerability databases are still packaged for retrieval-augmented generation, as opaque chunks behind an embedding index. We argue that this substrate, not model capability, is the bottleneck on agentic CTI investigation, and present CTIFoundry, an agent-native corpus scaffold. At build time, CTIFoundry materializes the latent structure of a CTI corpus: a deterministic ontology graph over four authoritative knowledge bases (CVE, CWE, CAPEC, ATT\u0026CK) whose official cross-references become typed, traversable edges; a span-grounded report layer whose canonical, alias-resolved cross-vendor entities index provenance-carrying chunks; and hybrid dense+lexical retrieval surfaces. At query time this structure is exposed through seven typed tools and three procedural skills mounted on a stock open-source agent harness. On the public CTIConnect benchmark, swapping only the action surface lifts the identically-harnessed agent by +0.19 to +0.28 overall F1 across a four-model, two-provider panel: a small model on CTIFoundry surpasses a flagship on the flat substrate, and the gain is not bought with search effort, since on both Claude models the scaffolded agent is more accurate at roughly half the tool calls. An ablation attributes it: typed structure carries the larger share, procedural skills convert structure into discipline, and the two compose super-additively, because skills bind only to structure that exists.", "arxiv_id": "2608.18613", "arxiv_url": "https://arxiv.org/abs/2608.18613", "authors": ["Yutong Cheng", "Changze Li", "Qian Cui", "Wei Ding", "Lingzhi Wang", "Yan Chen", "Peng Gao"], "brief": "\u8bba\u6587\u63d0\u51fa CTIFoundry\uff0c\u5c06 CTI \u8bed\u6599\u4ece\u6241\u5e73 RAG \u5206\u5757\u91cd\u6784\u4e3a\u53ef\u7531 LLM \u667a\u80fd\u4f53\u64cd\u4f5c\u7684\u7ed3\u6784\u5316\u8bed\u6599\u811a\u624b\u67b6\u3002\u5b83\u628a CVE\u3001CWE\u3001CAPEC\u3001ATT\u0026CK \u7b49\u77e5\u8bc6\u5e93\u7ec4\u7ec7\u6210\u53ef\u904d\u5386\u672c\u4f53\u56fe\uff0c\u5e76\u7ed3\u5408\u62a5\u544a\u5b9e\u4f53\u5bf9\u9f50\u3001\u51fa\u5904\u5b9a\u4f4d\u68c0\u7d22\u3001\u7c7b\u578b\u5316\u5de5\u5177\u4e0e\u7a0b\u5e8f\u5316\u6280\u80fd\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18613", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u786e\u5b9a\u6027\u672c\u4f53\u56fe\uff0c\u5c06\u56db\u5927\u6743\u5a01 CTI \u77e5\u8bc6\u5e93\u7684\u5b98\u65b9\u4ea4\u53c9\u5f15\u7528\u8f6c\u5316\u4e3a\u7c7b\u578b\u5316\u53ef\u904d\u5386\u8fb9", "\u63d0\u4f9b span-grounded \u62a5\u544a\u5c42\u3001\u522b\u540d\u6d88\u89e3\u5b9e\u4f53\u7d22\u5f15\uff0c\u4ee5\u53ca\u7a20\u5bc6+\u8bcd\u6cd5\u6df7\u5408\u68c0\u7d22\u8868\u9762", "\u5728 CTIConnect \u4e0a\u4ec5\u66ff\u6362 action surface\uff0c\u5c31\u4f7f\u76f8\u540c\u667a\u80fd\u4f53\u6846\u67b6\u6574\u4f53 F1 \u63d0\u5347 0.19 \u81f3 0.28\uff0c\u4e14\u90e8\u5206\u6a21\u578b\u5de5\u5177\u8c03\u7528\u7ea6\u51cf\u534a"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u68c0\u7d22\u589e\u5f3a", "\u77e5\u8bc6\u56fe\u8c31"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18613v1", "published_at": "2026-08-19", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CTIFoundry: An Agent-Native Corpus Scaffold for Cyber Threat Intelligence", "tldr": "\u9762\u5411\u667a\u80fd\u4f53\u7684\u7f51\u7edc\u5a01\u80c1\u60c5\u62a5\u8bed\u6599\u811a\u624b\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CTIFoundry\uff0c\u5c06 CTI \u8bed\u6599\u4ece\u6241\u5e73 RAG \u5206\u5757\u91cd\u6784\u4e3a\u53ef\u7531 LLM \u667a\u80fd\u4f53\u64cd\u4f5c\u7684\u7ed3\u6784\u5316\u8bed\u6599\u811a\u624b\u67b6\u3002\u5b83\u628a CVE\u3001CWE\u3001CAPEC\u3001ATT\u0026CK \u7b49\u77e5\u8bc6\u5e93\u7ec4\u7ec7\u6210\u53ef\u904d\u5386\u672c\u4f53\u56fe\uff0c\u5e76\u7ed3\u5408\u62a5\u544a\u5b9e\u4f53\u5bf9\u9f50\u3001\u51fa\u5904\u5b9a\u4f4d\u68c0\u7d22\u3001\u7c7b\u578b\u5316\u5de5\u5177\u4e0e\u7a0b\u5e8f\u5316\u6280\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u667a\u80fd\u4f53\u5f0f CTI \u7684\u74f6\u9888\u4e0d\u53ea\u5728\u6a21\u578b\u80fd\u529b\uff0c\u800c\u5728\u8bed\u6599\u7ec4\u7ec7\u65b9\u5f0f\uff1b\u901a\u8fc7\u4e3a\u667a\u80fd\u4f53\u539f\u751f\u8bbe\u8ba1\u7684\u7ed3\u6784\u5316\u8bed\u6599\u4e0e\u5de5\u5177\u63a5\u53e3\uff0c\u663e\u8457\u63d0\u5347\u591a\u6b65\u5a01\u80c1\u8c03\u67e5\u7684\u51c6\u786e\u6027\u548c\u6548\u7387\u3002"}, {"abstract": "Memory is becoming core infrastructure for long-horizon LLM agents, yet existing evaluations offer limited guidance on which memory substrate, namely the underlying medium in which memory is represented and stored, should be used under different operating regimes. We present a controlled harness evaluation of memory substrates for memory-augmented agents, covering dense and sparse indices, text records, structural stores, hierarchical stores, refinement-based memories, parametric updates, and activation-compatible context mechanisms. Across three backbone models and four benchmark suites spanning user-centric question answering and agent-centric decision-making, we instrument 26 performance and efficiency metrics under a unified harness. Our results show that no single substrate consistently dominates: broad retrieval benefits long-context factual QA, while excessive retrieval can harm sequential decision-making by shifting attention away from action-critical context. Scalability introduces a further routing axis, as substrates that perform well at moderate history lengths can become costly or brittle at longer horizons. These findings motivate substrate routing as a necessary component of adaptive agent memory systems and provide empirical guidance for designing efficient, reliable, and regime-aware long-term memory for LLM agents. Code will be made available upon acceptance.", "arxiv_id": "2608.15008", "arxiv_url": "https://arxiv.org/abs/2608.15008", "authors": ["Wei-Chieh Huang", "Weizhi Zhang", "Yuchen Wu", "Yankai Chen", "Eric Hanchen Jiang", "Wooseong Yang", "Yiwei Yang", "Henry Peng Zou", "Hanrong Zhang", "Ying Nian Wu", "Haolun Wu", "Kai-Wei Chang", "Philip S. Yu", "Xue Liu", "Aylin Caliskan"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6\uff0c\u7cfb\u7edf\u6bd4\u8f83\u8bb0\u5fc6\u589e\u5f3a\u578bLLM\u667a\u80fd\u4f53\u4e2d\u7684\u591a\u7c7b\u8bb0\u5fc6\u5e95\u5ea7\uff0c\u5305\u62ec\u7a20\u5bc6/\u7a00\u758f\u7d22\u5f15\u3001\u6587\u672c\u8bb0\u5f55\u3001\u7ed3\u6784\u5316\u4e0e\u5c42\u7ea7\u5b58\u50a8\u3001\u53c2\u6570\u66f4\u65b0\u548c\u4e0a\u4e0b\u6587\u673a\u5236\u7b49\u3002\u5b9e\u9a8c\u8986\u76d63\u79cd\u9aa8\u5e72\u6a21\u578b\u30014\u4e2a\u57fa\u51c6\u5957\u4ef6\uff0c\u5e76\u4ece\u6027\u80fd\u4e0e\u6548\u7387\u4e24\u65b9\u9762\u7edf\u8ba126\u9879\u6307\u6807\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.15008", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6ca1\u6709\u4efb\u4f55\u4e00\u79cd\u8bb0\u5fc6\u5e95\u5ea7\u5728\u6240\u6709\u573a\u666f\u4e2d\u7a33\u5b9a\u6700\u4f18\uff0c\u4e0d\u540c\u4efb\u52a1\u548c\u5386\u53f2\u957f\u5ea6\u4e0b\u5b58\u5728\u660e\u663e\u53d6\u820d\u3002", "\u5e7f\u6cdb\u68c0\u7d22\u6709\u5229\u4e8e\u957f\u4e0a\u4e0b\u6587\u4e8b\u5b9e\u95ee\u7b54\uff0c\u4f46\u5728\u5e8f\u5217\u51b3\u7b56\u4e2d\u53ef\u80fd\u5206\u6563\u6a21\u578b\u5bf9\u5173\u952e\u884c\u52a8\u4e0a\u4e0b\u6587\u7684\u6ce8\u610f\u529b\u3002", "\u968f\u7740\u5386\u53f2\u89c4\u6a21\u589e\u957f\uff0c\u90e8\u5206\u4e2d\u7b49\u957f\u5ea6\u4e0b\u8868\u73b0\u826f\u597d\u7684\u8bb0\u5fc6\u65b9\u6848\u4f1a\u53d8\u5f97\u6602\u8d35\u6216\u8106\u5f31\uff0c\u51f8\u663e\u52a8\u6001\u8def\u7531\u7684\u91cd\u8981\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u68c0\u7d22\u589e\u5f3a", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15008v1", "published_at": "2026-08-15", "score": 0.424, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15008.png", "title": "Harness the Memory: A Holistic Evaluation of Memory Substrates in Memory Agents", "tldr": "\u7cfb\u7edf\u8bc4\u6d4bLLM\u667a\u80fd\u4f53\u8bb0\u5fc6\u5e95\u5ea7\u53d6\u820d", "upvotes": 12, "what_it_is": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6\uff0c\u7cfb\u7edf\u6bd4\u8f83\u8bb0\u5fc6\u589e\u5f3a\u578bLLM\u667a\u80fd\u4f53\u4e2d\u7684\u591a\u7c7b\u8bb0\u5fc6\u5e95\u5ea7\uff0c\u5305\u62ec\u7a20\u5bc6/\u7a00\u758f\u7d22\u5f15\u3001\u6587\u672c\u8bb0\u5f55\u3001\u7ed3\u6784\u5316\u4e0e\u5c42\u7ea7\u5b58\u50a8\u3001\u53c2\u6570\u66f4\u65b0\u548c\u4e0a\u4e0b\u6587\u673a\u5236\u7b49\u3002\u5b9e\u9a8c\u8986\u76d63\u79cd\u9aa8\u5e72\u6a21\u578b\u30014\u4e2a\u57fa\u51c6\u5957\u4ef6\uff0c\u5e76\u4ece\u6027\u80fd\u4e0e\u6548\u7387\u4e24\u65b9\u9762\u7edf\u8ba126\u9879\u6307\u6807\u3002", "why_notable": "\u8bba\u6587\u4e3a\u957f\u7a0bLLM\u667a\u80fd\u4f53\u7684\u8bb0\u5fc6\u7cfb\u7edf\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u7cfb\u7edf\u5b9e\u8bc1\u4f9d\u636e\uff0c\u5f3a\u8c03\u5e94\u6839\u636e\u4efb\u52a1\u3001\u4e0a\u4e0b\u6587\u957f\u5ea6\u548c\u6548\u7387\u7ea6\u675f\u9009\u62e9\u6216\u8def\u7531\u4e0d\u540c\u8bb0\u5fc6\u5e95\u5ea7\uff0c\u800c\u4e0d\u662f\u4f9d\u8d56\u5355\u4e00\u901a\u7528\u8bb0\u5fc6\u65b9\u6848\u3002"}, {"abstract": "Training terminal agents requires scalable executable supervision, yet synthesizing high-quality terminal tasks remains challenging. Each task couples an instruction, an initialized environment, a reference solution, and an executable verifier; if these artifacts are generated from inconsistent assumptions, the resulting task may be unsolvable or incorrectly evaluated. Meanwhile, multi-stage synthesis can discard the goals, dependencies, state transitions, and procedural constraints encoded in the original sources. We present FACET (Fine-grained Agentic Construction of Executable Tasks), a framework that addresses both information preservation and cross-artifact consistency. FACET reconstructs related agent skills into coherent, information-rich scenarios, then realizes and repairs the execution environment before generating the final task artifacts. The resulting container state serves as shared grounding for the instruction, solution, and verifier, while execution-based validation and targeted repair correct artifact-specific failures without unnecessarily regenerating valid components. FACET produces complex terminal tasks with dense executable checks, and successful trajectories collected from these tasks provide effective, data-efficient supervision. Fine-tuning models across multiple scales consistently improves performance on Terminal-Bench 2.1, while analyses of alternative generation schemes support the importance of environment-grounded construction for task validity and solution-verifier alignment. These results establish source-intent preservation and shared executable-state grounding as key principles for scalable terminal-task synthesis.", "arxiv_id": "2608.18580", "arxiv_url": "https://arxiv.org/abs/2608.18580", "authors": ["Kou Shi", "Zun Wang", "Qisheng Su", "Shiting Huang", "Ziao Zhang", "Zhen Fang", "Qingnan Ren", "Jin Liu", "Yu Zeng", "Yiming Zhao", "Lin Chen", "Zehui Chen", "Feng Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa FACET\uff0c\u4e00\u4e2a\u7528\u4e8e\u5408\u6210\u9ad8\u8d28\u91cf\u7ec8\u7aef\u4efb\u52a1\u7684\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4fdd\u7559\u6e90\u4efb\u52a1\u610f\u56fe\u3001\u91cd\u5efa\u6280\u80fd\u573a\u666f\uff0c\u5e76\u4ee5\u771f\u5b9e\u5bb9\u5668\u72b6\u6001\u7edf\u4e00\u6307\u4ee4\u3001\u53c2\u8003\u89e3\u6cd5\u548c\u9a8c\u8bc1\u5668\uff0c\u63d0\u5347\u4efb\u52a1\u53ef\u89e3\u6027\u4e0e\u8bc4\u6d4b\u4e00\u81f4\u6027\u3002", "categories": ["cs.AI", "cs.PL"], "github_repo": "https://github.com/StoKou/FACET-Terminal", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.18580", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u76f8\u5173 agent \u6280\u80fd\u91cd\u6784\u4e3a\u4fe1\u606f\u4e30\u5bcc\u4e14\u8fde\u8d2f\u7684\u7ec8\u7aef\u4efb\u52a1\u573a\u666f\uff0c\u907f\u514d\u591a\u9636\u6bb5\u751f\u6210\u4e2d\u4e22\u5931\u76ee\u6807\u3001\u4f9d\u8d56\u548c\u72b6\u6001\u7ea6\u675f", "\u5148\u5b9e\u73b0\u5e76\u4fee\u590d\u6267\u884c\u73af\u5883\uff0c\u518d\u57fa\u4e8e\u5171\u4eab\u5bb9\u5668\u72b6\u6001\u751f\u6210 instruction\u3001solution \u548c verifier\uff0c\u51cf\u5c11\u8de8\u7ec4\u4ef6\u5047\u8bbe\u4e0d\u4e00\u81f4", "\u7ed3\u5408\u6267\u884c\u9a8c\u8bc1\u4e0e\u5b9a\u5411\u4fee\u590d\uff0c\u53ea\u4fee\u590d\u5931\u8d25\u7ec4\u4ef6\u800c\u975e\u6574\u4f53\u91cd\u751f\u6210\uff1b\u7528\u751f\u6210\u4efb\u52a1\u7684\u6210\u529f\u8f68\u8ff9\u5fae\u8c03\u540e\uff0c\u5728 Terminal-Bench 2.1 \u4e0a\u7a33\u5b9a\u63d0\u5347\u8868\u73b0"], "keywords": ["\u667a\u80fd\u4f53", "\u7ec8\u7aef\u4efb\u52a1", "\u6570\u636e\u5408\u6210", "\u53ef\u6267\u884c\u9a8c\u8bc1"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18580v1", "published_at": "2026-08-19", "score": 0.382, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18580.png", "title": "FACET: Preserving Source Intent and Executable State in Terminal Task Synthesis", "tldr": "FACET\u751f\u6210\u4e00\u81f4\u53ef\u6267\u884c\u7684\u7ec8\u7aef\u667a\u80fd\u4f53\u4efb\u52a1", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa FACET\uff0c\u4e00\u4e2a\u7528\u4e8e\u5408\u6210\u9ad8\u8d28\u91cf\u7ec8\u7aef\u4efb\u52a1\u7684\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4fdd\u7559\u6e90\u4efb\u52a1\u610f\u56fe\u3001\u91cd\u5efa\u6280\u80fd\u573a\u666f\uff0c\u5e76\u4ee5\u771f\u5b9e\u5bb9\u5668\u72b6\u6001\u7edf\u4e00\u6307\u4ee4\u3001\u53c2\u8003\u89e3\u6cd5\u548c\u9a8c\u8bc1\u5668\uff0c\u63d0\u5347\u4efb\u52a1\u53ef\u89e3\u6027\u4e0e\u8bc4\u6d4b\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6293\u4f4f\u4e86\u7ec8\u7aef\u667a\u80fd\u4f53\u8bad\u7ec3\u6570\u636e\u5408\u6210\u4e2d\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u4efb\u52a1\u662f\u5426\u771f\u5b9e\u53ef\u6267\u884c\u3001\u89e3\u6cd5\u4e0e\u9a8c\u8bc1\u5668\u662f\u5426\u5bf9\u9f50\u3002FACET \u63d0\u4f9b\u4e86\u73af\u5883\u843d\u5730\u7684\u4efb\u52a1\u6784\u5efa\u8303\u5f0f\uff0c\u6709\u52a9\u4e8e\u89c4\u6a21\u5316\u751f\u6210\u66f4\u53ef\u9760\u7684\u53ef\u6267\u884c\u76d1\u7763\u6570\u636e\u3002"}, {"abstract": "Language model agents now execute bounded tasks reliably. Whether they can sustain effective decision-making over long horizons, where actions have cumulative consequences and the environment responds to their choices, remains largely unmeasured. FM-Bench (Football Management Benchmark) measures this. An LLM agent runs a football club for 20 in-game years through 26 tools and roughly 340 to 400 decision stops. It drafts a squad on the same budget as every rival, trades players, negotiates contracts, invests in facilities and youth, sets lineups, and answers to a board that can fire it, while a deterministic engine accumulates every year into one final score with no LLM judge or human rater. The solo track plays each of 15 frontier models against a frozen scripted world, and the Arena places the same models plus a scripted anchor in one shared 20-year world; to our knowledge, the first head-to-head evaluation at this scale. We measure six behavioral capabilities behind the score. Across three seeds, all 15 models complete every horizon while the blind scripted baselines die out in most of theirs, and claude-fable-5 tops the solo board on mean score and the Arena, where the title nonetheless rotates among ten models. Neither scale, price, nor vendor predicts the order; the order settles only late in the horizon, and the best first-play human lands only at the bottom of the model board. What separates the models is managerial behavior rather than computation. Higher-scoring models reduce slow-payoff investment near the end, keep cash invested rather than idle, and open renewals well before the deadline, while token spend predicts nothing. No model learns the market\u0027s hidden prices from hundreds of rejected bids, and self-managed memory fails in two opposite modes: an archive that only grows or a plan rewritten every season. Code is available at https://github.com/Analogy-AI/fm-bench.", "arxiv_id": "2608.18423", "arxiv_url": "https://arxiv.org/abs/2608.18423", "authors": ["Tianyou Wang", "Chongyang Gao", "Kezhen Chen", "Chen Dong", "Yinghao He", "Donghan Li", "Wangcheng Xu", "Hongjiu Zhang", "Chi Li"], "brief": "FM-Bench \u662f\u4e00\u4e2a\u957f\u65f6\u7a0b\u8db3\u7403\u4ff1\u4e50\u90e8\u7ecf\u8425\u57fa\u51c6\uff0c\u8ba9 LLM \u667a\u80fd\u4f53\u572820\u4e2a\u6e38\u620f\u5e74\u4e2d\u901a\u8fc726\u79cd\u5de5\u5177\u5b8c\u6210\u7ea6340\u81f3400\u6b21\u51b3\u7b56\u3002\u5b83\u540c\u65f6\u63d0\u4f9b\u5355\u6a21\u578b\u5bf9\u811a\u672c\u4e16\u754c\u7684 Solo \u8bc4\u6d4b\uff0c\u4ee5\u53ca\u591a\u4e2a\u6a21\u578b\u540c\u573a\u7ade\u4e89\u7684 Arena \u8bc4\u6d4b\uff0c\u6700\u7ec8\u7531\u786e\u5b9a\u6027\u5f15\u64ce\u6253\u5206\uff0c\u65e0\u9700\u4eba\u5de5\u6216LLM\u88c1\u5224\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Analogy-AI/fm-bench", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2608.18423", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6\u9009\u79c0\u3001\u8f6c\u4f1a\u3001\u5408\u540c\u8c08\u5224\u3001\u8bbe\u65bd\u4e0e\u9752\u8bad\u6295\u8d44\u3001\u9635\u5bb9\u8bbe\u7f6e\u3001\u8463\u4e8b\u4f1a\u95ee\u8d23\u7b49\u7d2f\u79ef\u6027\u7ba1\u7406\u51b3\u7b56\u3002", "\u6d4b\u8bd515\u4e2a\u524d\u6cbf\u6a21\u578b\uff0c\u6240\u6709\u6a21\u578b\u90fd\u80fd\u5b8c\u6210\u5b8c\u6574\u5468\u671f\uff0c\u800c\u76f2\u811a\u672c\u57fa\u7ebf\u591a\u6570\u4e2d\u9014\u5931\u8d25\uff1bArena \u4e2d\u51a0\u519b\u572810\u4e2a\u6a21\u578b\u95f4\u8f6e\u6362\u3002", "\u6a21\u578b\u8868\u73b0\u4e0e\u89c4\u6a21\u3001\u4ef7\u683c\u3001\u5382\u5546\u3001token\u6d88\u8017\u65e0\u660e\u663e\u76f8\u5173\uff0c\u5dee\u5f02\u4e3b\u8981\u6765\u81ea\u7ba1\u7406\u884c\u4e3a\uff0c\u5982\u73b0\u91d1\u5229\u7528\u3001\u7eed\u7ea6\u65f6\u673a\u548c\u4e34\u8fd1\u7ec8\u5c40\u7684\u6295\u8d44\u8c03\u6574\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u65f6\u7a0b\u51b3\u7b56", "\u57fa\u51c6\u8bc4\u6d4b", "\u591a\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18423v1", "published_at": "2026-08-19", "score": 0.371, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18423.png", "title": "FM-Bench: A Benchmark for Long-Horizon Management with Competing Agents", "tldr": "\u8bc4\u6d4bLLM\u667a\u80fd\u4f5320\u5e74\u8db3\u7403\u7ecf\u8425\u80fd\u529b", "upvotes": 0, "what_it_is": "FM-Bench \u662f\u4e00\u4e2a\u957f\u65f6\u7a0b\u8db3\u7403\u4ff1\u4e50\u90e8\u7ecf\u8425\u57fa\u51c6\uff0c\u8ba9 LLM \u667a\u80fd\u4f53\u572820\u4e2a\u6e38\u620f\u5e74\u4e2d\u901a\u8fc726\u79cd\u5de5\u5177\u5b8c\u6210\u7ea6340\u81f3400\u6b21\u51b3\u7b56\u3002\u5b83\u540c\u65f6\u63d0\u4f9b\u5355\u6a21\u578b\u5bf9\u811a\u672c\u4e16\u754c\u7684 Solo \u8bc4\u6d4b\uff0c\u4ee5\u53ca\u591a\u4e2a\u6a21\u578b\u540c\u573a\u7ade\u4e89\u7684 Arena \u8bc4\u6d4b\uff0c\u6700\u7ec8\u7531\u786e\u5b9a\u6027\u5f15\u64ce\u6253\u5206\uff0c\u65e0\u9700\u4eba\u5de5\u6216LLM\u88c1\u5224\u3002", "why_notable": "\u5b83\u5c06LLM\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u77ed\u4efb\u52a1\u63a8\u8fdb\u5230\u591a\u5e74\u3001\u591a\u4e3b\u4f53\u3001\u5f3a\u53cd\u9988\u7684\u957f\u65f6\u7a0b\u51b3\u7b56\u573a\u666f\uff0c\u5e76\u7528\u786e\u5b9a\u6027\u5f15\u64ce\u907f\u514d\u4e3b\u89c2\u88c1\u5224\u504f\u5dee\uff1b\u7ed3\u679c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u867d\u80fd\u5b8c\u6210\u590d\u6742\u7ba1\u7406\u6d41\u7a0b\uff0c\u4f46\u5728\u9690\u542b\u5e02\u573a\u5b66\u4e60\u548c\u81ea\u7ba1\u7406\u8bb0\u5fc6\u4e0a\u4ecd\u6709\u660e\u663e\u77ed\u677f\u3002"}, {"abstract": "Although Large Vision-Language Models (VLMs) have significantly advanced embodied navigation, their direct deployment remains challenging, as existing methods often force VLMs into unnatural action spaces that misalign with their 2D pre-training priors, compounded by rigid reasoning schedules and inefficient memory management. To overcome these limitations, we propose TAMP-Nav, a unified framework for efficient embodied navigation. First, we introduce a Pixel-to-3D Action Formulation (Point) that reformulates navigation into 2D visual prompting. Specifically, the VLM merely selects 2D pixels, which are then projected into 3D coordinates for a low-level SLAM controller. This design naturally aligns embodied execution with the VLM\u0027s inherent 2D visual capabilities. Second, we propose an integrated Selective Reasoning and Anchor-Trajectory Memory mechanism (Think and Memorize), which dynamically triggers Chain-of-Thought and retains high-fidelity memory only at critical nodes, compressing redundant trajectories into lightweight Space-Time Indicators, thereby preserving critical historical information and enhancing spatio-temporal perception. Finally, we design an efficient Two-Level Alignment Paradigm (Align) via Group Relative Policy Optimization (GRPO). By superimposing global outcome rewards with fine-grained process rewards, this dense supervision tightly aligns the agent\u0027s cognitive planning with physical environmental feedback, endowing the model with adaptive reasoning capabilities. Experiments demonstrate that TAMP-Nav achieves state-of-the-art performance (e.g., 66.2% SR on R2R-CE) with high runtime and sample efficiency (requiring only 90k training trajectories).", "arxiv_id": "2608.17512", "arxiv_url": "https://arxiv.org/abs/2608.17512", "authors": ["Hongyan Feng", "Sunlai Chen", "Xuanyu Liu", "Miao Pan", "Yangfan Xie", "Yuxiang Cui", "Zhongxiang Zhou", "Rong Xiong", "Wenqi Zhang", "Jianwei Yin", "Yueting Zhuang", "Xuhong Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa TAMP-Nav\uff0c\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u5bfc\u822a\u7684\u7edf\u4e00\u6846\u67b6\uff1a\u8ba9 VLM \u53ea\u5728\u56fe\u50cf\u4e0a\u9009\u62e92D\u50cf\u7d20\u70b9\uff0c\u518d\u6295\u5f71\u52303D\u4ea4\u7531 SLAM \u63a7\u5236\u5668\u6267\u884c\u3002\u6846\u67b6\u8fd8\u7ed3\u5408\u9009\u62e9\u6027\u63a8\u7406\u3001\u951a\u70b9\u8f68\u8ff9\u8bb0\u5fc6\u4e0e GRPO \u5bf9\u9f50\uff0c\u63d0\u5347\u5bfc\u822a\u6548\u7387\u548c\u6210\u529f\u7387\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/ZJU-OmniAI/Embodied-Omni", "github_stars": 216, "hf_url": "https://huggingface.co/papers/2608.17512", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa Pixel-to-3D Action Formulation\uff0c\u5c06\u5bfc\u822a\u52a8\u4f5c\u8f6c\u5316\u4e3a2D\u89c6\u89c9\u63d0\u793a\uff0c\u66f4\u8d34\u5408 VLM \u7684\u9884\u8bad\u7ec3\u89c6\u89c9\u5148\u9a8c\u3002", "\u8bbe\u8ba1 Selective Reasoning \u4e0e Anchor-Trajectory Memory\uff0c\u4ec5\u5728\u5173\u952e\u8282\u70b9\u89e6\u53d1 CoT\uff0c\u5e76\u7528 Space-Time Indicators \u538b\u7f29\u5197\u4f59\u8f68\u8ff9\u8bb0\u5fc6\u3002", "\u91c7\u7528\u4e24\u7ea7\u5bf9\u9f50\u8303\u5f0f\uff0c\u901a\u8fc7 GRPO \u7ed3\u5408\u5168\u5c40\u7ed3\u679c\u5956\u52b1\u4e0e\u7ec6\u7c92\u5ea6\u8fc7\u7a0b\u5956\u52b1\uff0c\u5728 R2R-CE \u4e0a\u8fbe\u5230 66.2% \u6210\u529f\u7387\uff0c\u4ec5\u9700 90k \u8bad\u7ec3\u8f68\u8ff9\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "ZJU-OmniAI", "pdf_url": "https://arxiv.org/pdf/2608.17512v1", "published_at": "2026-08-18", "score": 0.353, "selected_reasons": ["HF trending (44\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.17512.png", "title": "Embodied-Navigator: Point, Think, Memorize, and Align for Efficient Navigation", "tldr": "\u75282D\u6307\u70b9\u5bf9\u9f50VLM\u5b9e\u73b0\u9ad8\u6548\u5177\u8eab\u5bfc\u822a", "upvotes": 44, "what_it_is": "\u8bba\u6587\u63d0\u51fa TAMP-Nav\uff0c\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u5bfc\u822a\u7684\u7edf\u4e00\u6846\u67b6\uff1a\u8ba9 VLM \u53ea\u5728\u56fe\u50cf\u4e0a\u9009\u62e92D\u50cf\u7d20\u70b9\uff0c\u518d\u6295\u5f71\u52303D\u4ea4\u7531 SLAM \u63a7\u5236\u5668\u6267\u884c\u3002\u6846\u67b6\u8fd8\u7ed3\u5408\u9009\u62e9\u6027\u63a8\u7406\u3001\u951a\u70b9\u8f68\u8ff9\u8bb0\u5fc6\u4e0e GRPO \u5bf9\u9f50\uff0c\u63d0\u5347\u5bfc\u822a\u6548\u7387\u548c\u6210\u529f\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7f13\u89e3\u4e86 VLM \u76f4\u63a5\u7528\u4e8e\u5177\u8eab\u5bfc\u822a\u65f6\u52a8\u4f5c\u7a7a\u95f4\u4e0d\u5339\u914d\u3001\u63a8\u7406\u8c03\u5ea6\u50f5\u786c\u548c\u8bb0\u5fc6\u4f4e\u6548\u7684\u95ee\u9898\uff0c\u5728\u6027\u80fd\u3001\u8fd0\u884c\u6548\u7387\u548c\u6837\u672c\u6548\u7387\u4e0a\u5747\u6709\u63d0\u5347\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u673a\u5668\u4eba\u5bfc\u822a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Oral diseases affect billions of people worldwide, underscoring a pressing need for accurate and reliable dental assessment that integrates heterogeneous evidence from domain knowledge, radiographs, intraoral photographs, and 3D dental data. Most existing dental AI systems remain modality- or task-specific. Although recent vision-language models support flexible dental question answering, directly generated response leaves evidence implicit and untraceable. To address these limitations, we introduce DentAgent, an evidence-centric multi-agent framework, in which the Orchestrator coordinate five specialized agents spanning various modalities. Each specialist utilizes domain tools to convert observations into structured evidence records. The Evidence Blackboard manages these records as a shared evidence state, tracking coverage, gaps, and conflicts before response generation. This standardized evidence representation integrates isolated dental capabilities into a unified agentic workflow. Across four benchmarks, DentAgent demonstrates leading performance, even surpassing the senior specialists by 17.3 percentage points on multi-label diagnosis, which supports its value for broadly applicable and traceable multimodal dental reasoning, and highlights its potential as a technical foundation for population oral health assessment and management.", "arxiv_id": "2608.18878", "arxiv_url": "https://arxiv.org/abs/2608.18878", "authors": ["Zijie Meng", "Xiwei Dai", "Yixuan Tang", "Jin Hao", "Yang Feng", "Fudong Zhu", "Xiaoqiang Liu", "Shaosheng Cao", "Zuozhu Liu"], "brief": "\u8bba\u6587\u63d0\u51fa DentAgent\uff0c\u4e00\u4e2a\u4ee5\u8bc1\u636e\u4e3a\u4e2d\u5fc3\u7684\u591a\u667a\u80fd\u4f53\u7259\u79d1\u63a8\u7406\u6846\u67b6\u3002\u5b83\u534f\u8c03\u77e5\u8bc6\u3001X \u5149\u7247\u3001\u53e3\u5185\u7167\u7247\u548c 3D \u7259\u79d1\u6570\u636e\u7b49\u591a\u79cd\u4fe1\u606f\u6e90\uff0c\u5c06\u5404\u6a21\u6001\u89c2\u5bdf\u8f6c\u5316\u4e3a\u53ef\u8ffd\u8e2a\u7684\u7ed3\u6784\u5316\u8bc1\u636e\u540e\u518d\u751f\u6210\u8bca\u65ad\u56de\u7b54\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18878", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7531 Orchestrator \u534f\u8c03\u4e94\u7c7b\u4e13\u95e8\u667a\u80fd\u4f53\uff0c\u6bcf\u4e2a\u667a\u80fd\u4f53\u8c03\u7528\u9886\u57df\u5de5\u5177\u5904\u7406\u4e0d\u540c\u6a21\u6001\u6216\u4efb\u52a1", "\u5f15\u5165 Evidence Blackboard \u4f5c\u4e3a\u5171\u4eab\u8bc1\u636e\u72b6\u6001\uff0c\u7ba1\u7406\u8bc1\u636e\u8986\u76d6\u3001\u7f3a\u53e3\u4e0e\u51b2\u7a81\uff0c\u63d0\u5347\u53ef\u89e3\u91ca\u6027\u548c\u53ef\u8ffd\u6eaf\u6027", "\u5728\u56db\u4e2a\u57fa\u51c6\u6d4b\u8bd5\u4e0a\u53d6\u5f97\u9886\u5148\u8868\u73b0\uff0c\u591a\u6807\u7b7e\u8bca\u65ad\u4efb\u52a1\u8f83\u8d44\u6df1\u4e13\u79d1\u533b\u751f\u9ad8 17.3 \u4e2a\u767e\u5206\u70b9"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u533b\u7597AI", "\u8bc1\u636e\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18878v1", "published_at": "2026-08-19", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DentAgent: Evidence-Centric Multi-Agent Coordination for Multimodal Dental Reasoning", "tldr": "\u591a\u667a\u80fd\u4f53\u6574\u5408\u7259\u79d1\u591a\u6a21\u6001\u8bc1\u636e\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DentAgent\uff0c\u4e00\u4e2a\u4ee5\u8bc1\u636e\u4e3a\u4e2d\u5fc3\u7684\u591a\u667a\u80fd\u4f53\u7259\u79d1\u63a8\u7406\u6846\u67b6\u3002\u5b83\u534f\u8c03\u77e5\u8bc6\u3001X \u5149\u7247\u3001\u53e3\u5185\u7167\u7247\u548c 3D \u7259\u79d1\u6570\u636e\u7b49\u591a\u79cd\u4fe1\u606f\u6e90\uff0c\u5c06\u5404\u6a21\u6001\u89c2\u5bdf\u8f6c\u5316\u4e3a\u53ef\u8ffd\u8e2a\u7684\u7ed3\u6784\u5316\u8bc1\u636e\u540e\u518d\u751f\u6210\u8bca\u65ad\u56de\u7b54\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5206\u6563\u7684\u7259\u79d1 AI \u80fd\u529b\u6574\u5408\u4e3a\u7edf\u4e00\u7684\u591a\u6a21\u6001\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u89e3\u51b3\u4e86\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u56de\u7b54\u8bc1\u636e\u9690\u5f0f\u3001\u96be\u8ffd\u8e2a\u7684\u95ee\u9898\uff0c\u5bf9\u53ef\u9760\u7259\u79d1\u8f85\u52a9\u8bca\u65ad\u548c\u7fa4\u4f53\u53e3\u8154\u5065\u5eb7\u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agent frameworks increasingly package procedural knowledge as skills: instruction files an agent reads on demand, while public libraries now hold thousands of them. Which skill to read has thus become a decision the policy itself makes in the middle of an episode, yet no existing signal trains it. We show that the default remedy, outcome-rewarded RL over the candidate slate, cannot teach it, for a structural reason we identify and name selector credit starvation: under a broadcast, sequence-level advantage, the few tokens that name the chosen skill carry a vanishing share of the loss, and the credit they inherit is increasingly wrong-signed as trajectories lengthen. A correct choice is punished whenever the execution after it fails, even though the choice itself is among the most valuable decisions in the trajectory. Auditing a completed run\u0027s own training artifacts confirms all three properties, each worsening monotonically with horizon. SkillGate removes the failure by construction: it partitions the token support into two disjoint credit channels, outcome credit reaching only execution tokens, and a separate action-local advantage reaching exactly the skill-naming tokens, positive only when a trajectory\u0027s single read is the correct one. On five agentic benchmarks under a 16-candidate slate, SkillGate lifts a 9B policy from 40.8% to 53.2% trial success, well ahead of the identical budget spent on outcome reward alone, while cutting exposure to misleading candidates by two thirds and reading fewer skills.", "arxiv_id": "2608.18852", "arxiv_url": "https://arxiv.org/abs/2608.18852", "authors": ["Qingyao Li", "Wenxiang Jiao", "Shuai Shao", "Kangning Zhang", "Yuan Lu", "Yi Guo", "Weiwen Liu", "Weinan Zhang", "Yong Yu"], "brief": "\u8bba\u6587\u6307\u51fa\u957f\u7a0b\u667a\u80fd\u4f53\u5728\u8fd0\u884c\u4e2d\u9009\u62e9\u8bfb\u53d6\u54ea\u4e2a\u6280\u80fd\u65f6\uff0c\u5e38\u89c4\u57fa\u4e8e\u6700\u7ec8\u7ed3\u679c\u5956\u52b1\u7684RL\u4f1a\u906d\u9047\u201c\u9009\u62e9\u5668\u4fe1\u7528\u9965\u997f\u201d\uff0c\u5bfc\u81f4\u6280\u80fd\u9009\u62e9 token \u5f97\u4e0d\u5230\u6b63\u786e\u8bad\u7ec3\u4fe1\u53f7\u3002\u4f5c\u8005\u63d0\u51fa SkillGate\uff0c\u5c06\u6267\u884c token \u7684\u7ed3\u679c\u4fe1\u7528\u4e0e\u6280\u80fd\u547d\u540d token \u7684\u5c40\u90e8\u52a8\u4f5c\u4fe1\u7528\u5206\u79bb\uff0c\u4ece\u800c\u76f4\u63a5\u8bad\u7ec3\u6b63\u786e\u7684\u6280\u80fd\u9009\u62e9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18852", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc6\u522b\u5e76\u547d\u540d selector credit starvation\uff1a\u5e8f\u5217\u7ea7\u4f18\u52bf\u4fe1\u53f7\u88ab\u5e7f\u64ad\u540e\uff0c\u6280\u80fd\u9009\u62e9 token \u7684\u635f\u5931\u5360\u6bd4\u6781\u5c0f\uff0c\u4e14\u957f\u7a0b\u4efb\u52a1\u4e2d\u66f4\u5bb9\u6613\u7ee7\u627f\u9519\u8bef\u7b26\u53f7\u7684\u4fe1\u7528\u3002", "SkillGate \u5c06 token \u652f\u6301\u5212\u5206\u4e3a\u4e24\u4e2a\u4fe1\u7528\u901a\u9053\uff1a\u7ed3\u679c\u4fe1\u7528\u53ea\u4f5c\u7528\u4e8e\u6267\u884c token\uff0c\u5c40\u90e8\u52a8\u4f5c\u4f18\u52bf\u53ea\u4f5c\u7528\u4e8e\u6280\u80fd\u547d\u540d token\u3002", "\u57285\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u300116\u5019\u9009\u6280\u80fd\u8bbe\u7f6e\u4e0b\uff0c9B\u7b56\u7565\u6210\u529f\u7387\u4ece40.8%\u63d0\u5347\u523053.2%\uff0c\u663e\u8457\u4f18\u4e8e\u540c\u9884\u7b97\u7684\u7eaf\u7ed3\u679c\u5956\u52b1\u8bad\u7ec3\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18852v1", "published_at": "2026-08-19", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SkillGate: Training In-Policy Skill Selection in Long-Horizon Agents", "tldr": "SkillGate\u4e13\u8bad\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u6280\u80fd\u9009\u62e9\u51b3\u7b56\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u957f\u7a0b\u667a\u80fd\u4f53\u5728\u8fd0\u884c\u4e2d\u9009\u62e9\u8bfb\u53d6\u54ea\u4e2a\u6280\u80fd\u65f6\uff0c\u5e38\u89c4\u57fa\u4e8e\u6700\u7ec8\u7ed3\u679c\u5956\u52b1\u7684RL\u4f1a\u906d\u9047\u201c\u9009\u62e9\u5668\u4fe1\u7528\u9965\u997f\u201d\uff0c\u5bfc\u81f4\u6280\u80fd\u9009\u62e9 token \u5f97\u4e0d\u5230\u6b63\u786e\u8bad\u7ec3\u4fe1\u53f7\u3002\u4f5c\u8005\u63d0\u51fa SkillGate\uff0c\u5c06\u6267\u884c token \u7684\u7ed3\u679c\u4fe1\u7528\u4e0e\u6280\u80fd\u547d\u540d token \u7684\u5c40\u90e8\u52a8\u4f5c\u4fe1\u7528\u5206\u79bb\uff0c\u4ece\u800c\u76f4\u63a5\u8bad\u7ec3\u6b63\u786e\u7684\u6280\u80fd\u9009\u62e9\u3002", "why_notable": "\u968f\u7740\u6280\u80fd\u5e93\u89c4\u6a21\u6269\u5927\uff0c\u667a\u80fd\u4f53\u201c\u4f55\u65f6\u8bfb\u3001\u8bfb\u54ea\u4e2a\u6280\u80fd\u201d\u6210\u4e3a\u5173\u952e\u51b3\u7b56\uff1b\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u73b0\u6709\u957f\u7a0bRL\u8bad\u7ec3\u4fe1\u53f7\u7684\u7ed3\u6784\u6027\u7f3a\u9677\uff0c\u5e76\u7ed9\u51fa\u9488\u5bf9\u6027\u4fe1\u7528\u5206\u914d\u65b9\u6848\uff0c\u5bf9\u53ef\u6269\u5c55\u6280\u80fd\u578b\u667a\u80fd\u4f53\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Training multi-turn agentic workflows with reinforcement learning (RL) enables large language models to perform complex reasoning, use external tools, and conduct iterative search beyond single-turn settings. Yet multi-turn RL training remains highly unstable, often causing severe performance degradation as the number of turns increases. Through theoretical analysis, we identify three tightly coupled sources of instability: rollout-training context mismatch, weak turn-level credit assignment under sparse terminal rewards, and asynchronous policy drift when short and long trajectories are optimized under different policy versions. We show that these issues share a common structural origin in flattened trajectory optimization and address them through a unified reverse-turn formulation. We propose Reverse-Turn Policy Optimization (RTPO), which organizes multi-turn rollouts as sparse reverse trees and performs turn-level policy updates in temporal reverse order, aligning each decision with its downstream continuation. RTPO enables causally consistent turn-level credit assignment and on-policy continuation to control asynchronous drift. We provide theoretical guarantees showing that RTPO eliminates context mismatch and asynchronous drift under the proposed turn-level formulation, reduces credit bias, and converges to recursive optimality. Experiments on multi-turn agentic RL benchmarks show that RTPO improves upon trajectory- and turn-level baselines by 21.50% and 10.76%, respectively, highlighting its potential to support more stable training for tool-using agents.", "arxiv_id": "2608.18682", "arxiv_url": "https://arxiv.org/abs/2608.18682", "authors": ["Yugu Li", "Jimmy Cao", "Jianglin Qiao", "Siyi Hu"], "brief": "\u672c\u6587\u63d0\u51fa Reverse-Turn Policy Optimization\uff08RTPO\uff09\uff0c\u5c06\u591a\u8f6e\u667a\u80fd\u4f53 rollout \u7ec4\u7ec7\u4e3a\u7a00\u758f\u53cd\u5411\u6811\uff0c\u5e76\u6309\u65f6\u95f4\u53cd\u5411\u987a\u5e8f\u8fdb\u884c\u9010\u8f6e\u7b56\u7565\u66f4\u65b0\u3002\u5b83\u65e8\u5728\u89e3\u51b3\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\u4e2d\u4e0a\u4e0b\u6587\u4e0d\u5339\u914d\u3001\u7a00\u758f\u5956\u52b1\u4e0b\u4fe1\u7528\u5206\u914d\u5f31\u3001\u4ee5\u53ca\u5f02\u6b65\u7b56\u7565\u6f02\u79fb\u5bfc\u81f4\u7684\u8bad\u7ec3\u4e0d\u7a33\u5b9a\u95ee\u9898\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18682", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7406\u8bba\u5206\u6790\u6307\u51fa\u591a\u8f6e\u667a\u80fd\u4f53 RL \u4e0d\u7a33\u5b9a\u6e90\u4e8e\u6241\u5e73\u5316\u8f68\u8ff9\u4f18\u5316\u4e2d\u7684\u4e09\u7c7b\u8026\u5408\u95ee\u9898\uff1arollout-\u8bad\u7ec3\u4e0a\u4e0b\u6587\u4e0d\u5339\u914d\u3001\u7ec8\u5c40\u7a00\u758f\u5956\u52b1\u4e0b\u7684\u9010\u8f6e\u4fe1\u7528\u504f\u5dee\u3001\u77ed\u957f\u8f68\u8ff9\u4f7f\u7528\u4e0d\u540c\u7b56\u7565\u7248\u672c\u9020\u6210\u7684\u5f02\u6b65\u6f02\u79fb", "RTPO \u91c7\u7528\u53cd\u5411\u8f6e\u6b21\u5efa\u6a21\uff0c\u8ba9\u6bcf\u4e2a\u51b3\u7b56\u4e0e\u5176\u540e\u7eed continuation \u5bf9\u9f50\uff0c\u5b9e\u73b0\u56e0\u679c\u4e00\u81f4\u7684\u9010\u8f6e\u4fe1\u7528\u5206\u914d\u4e0e\u66f4\u63a5\u8fd1 on-policy \u7684\u66f4\u65b0", "\u5728\u591a\u8f6e\u667a\u80fd\u4f53 RL \u57fa\u51c6\u4e0a\uff0cRTPO \u76f8\u6bd4\u8f68\u8ff9\u7ea7\u548c\u8f6e\u6b21\u7ea7\u57fa\u7ebf\u5206\u522b\u63d0\u5347 21.50% \u548c 10.76%"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528", "\u7b56\u7565\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18682v1", "published_at": "2026-08-19", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RTPO: Reverse-Turn Policy Optimization for Stabilizing Agentic RL Training", "tldr": "RTPO\u7a33\u5b9a\u591a\u8f6e\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Reverse-Turn Policy Optimization\uff08RTPO\uff09\uff0c\u5c06\u591a\u8f6e\u667a\u80fd\u4f53 rollout \u7ec4\u7ec7\u4e3a\u7a00\u758f\u53cd\u5411\u6811\uff0c\u5e76\u6309\u65f6\u95f4\u53cd\u5411\u987a\u5e8f\u8fdb\u884c\u9010\u8f6e\u7b56\u7565\u66f4\u65b0\u3002\u5b83\u65e8\u5728\u89e3\u51b3\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\u4e2d\u4e0a\u4e0b\u6587\u4e0d\u5339\u914d\u3001\u7a00\u758f\u5956\u52b1\u4e0b\u4fe1\u7528\u5206\u914d\u5f31\u3001\u4ee5\u53ca\u5f02\u6b65\u7b56\u7565\u6f02\u79fb\u5bfc\u81f4\u7684\u8bad\u7ec3\u4e0d\u7a33\u5b9a\u95ee\u9898\u3002", "why_notable": "\u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u7684 RL \u8bad\u7ec3\u5e38\u56e0\u56de\u5408\u6570\u589e\u52a0\u800c\u5d29\u6e83\uff0cRTPO \u4ece\u7ed3\u6784\u4e0a\u91cd\u6784\u4f18\u5316\u987a\u5e8f\uff0c\u5e76\u7ed9\u51fa\u7406\u8bba\u4fdd\u8bc1\u4e0e\u5b9e\u8bc1\u63d0\u5347\uff0c\u4e3a\u7a33\u5b9a\u8bad\u7ec3\u590d\u6742 agentic workflows \u63d0\u4f9b\u4e86\u6709\u4ef7\u503c\u7684\u65b9\u6cd5\u3002"}, {"abstract": "Equipping Large Language Models (LLMs) with multi-turn tool-calling capabilities is essential for building autonomous agents. However, progress is fundamentally limited by the reliance on full-length trajectory imitation. For tasks involving multiple order-independent sub-goals, the optimal solution space forms a vast combinatorial diamond lattice. Forcing this rich topology into monolithic trajectories causes a severe topological collapse, indiscriminately penalizing valid alternative explorations and severely degrading policy diversity. To address this, we propose DART-SD (Diamond-topology Aware Retrieval and Tuning for Self-Distillation), a novel framework that shifts the paradigm from global forcing to topology-guided localized correction. DART-SD first models the execution process as a converging Interaction-State Transition Graph (ISTG), faithfully capturing the inherent diamond topology of successful and failed exploratory paths. During autonomous rollouts, the framework identifies the Critical Topological Breakpoint (CTB) and retrieves success-supported recovery references. Finally, we introduce a progressive self-distillation paradigm through CTB-guided localized supervision, ensuring that the training loss is calculated exclusively on the generated recovery steps while strictly protecting the valid reasoning prefix from destructive gradient updates. Experiments on complex multi-turn tool-calling benchmarks demonstrate that DART-SD significantly outperforms traditional full-trajectory baselines.", "arxiv_id": "2608.18524", "arxiv_url": "https://arxiv.org/abs/2608.18524", "authors": ["Hangrui Xu", "Jiarui Wang", "Yang Yang", "Chuanbo Zhu", "Fangda Chen", "Ziqi Wu", "Jingming Cai", "Yan Song"], "brief": "\u8bba\u6587\u63d0\u51fa DART-SD\uff0c\u7528\u4e8e\u8bad\u7ec3\u5177\u5907\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u80fd\u529b\u7684 LLM \u667a\u80fd\u4f53\u3002\u5b83\u5c06\u6267\u884c\u8fc7\u7a0b\u5efa\u6a21\u4e3a\u4ea4\u4e92\u72b6\u6001\u8f6c\u79fb\u56fe\uff0c\u5229\u7528\u4efb\u52a1\u4e2d\u591a\u4e2a\u53ef\u4ea4\u6362\u5b50\u76ee\u6807\u5f62\u6210\u7684\u201c\u94bb\u77f3\u62d3\u6251\u201d\uff0c\u4ece\u5168\u8f68\u8ff9\u6a21\u4eff\u8f6c\u5411\u5c40\u90e8\u9519\u8bef\u6062\u590d\u76d1\u7763\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18524", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa Interaction-State Transition Graph\uff08ISTG\uff09\u523b\u753b\u6210\u529f\u4e0e\u5931\u8d25\u63a2\u7d22\u8def\u5f84\u7684\u6c47\u805a\u7ed3\u6784\uff0c\u907f\u514d\u628a\u591a\u79cd\u6709\u6548\u8def\u5f84\u538b\u7f29\u6210\u5355\u4e00\u8f68\u8ff9\u3002", "\u5728\u81ea\u4e3b rollout \u4e2d\u5b9a\u4f4d Critical Topological Breakpoint\uff08CTB\uff09\uff0c\u5e76\u68c0\u7d22\u7531\u6210\u529f\u8def\u5f84\u652f\u6301\u7684\u6062\u590d\u53c2\u8003\u3002", "\u91c7\u7528 CTB \u5f15\u5bfc\u7684\u6e10\u8fdb\u5f0f\u81ea\u84b8\u998f\uff0c\u53ea\u5bf9\u6062\u590d\u6b65\u9aa4\u8ba1\u7b97\u8bad\u7ec3\u635f\u5931\uff0c\u4fdd\u62a4\u6b64\u524d\u6709\u6548\u63a8\u7406\u524d\u7f00\u4e0d\u88ab\u9519\u8bef\u68af\u5ea6\u7834\u574f\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u81ea\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18524v1", "published_at": "2026-08-19", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DART-SD: Diamond-topology Aware Retrieval and Tuning for Self-Distillation of Multi-Turn Tool-Calling Agents", "tldr": "\u9762\u5411\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u7684\u62d3\u6251\u611f\u77e5\u81ea\u84b8\u998f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DART-SD\uff0c\u7528\u4e8e\u8bad\u7ec3\u5177\u5907\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u80fd\u529b\u7684 LLM \u667a\u80fd\u4f53\u3002\u5b83\u5c06\u6267\u884c\u8fc7\u7a0b\u5efa\u6a21\u4e3a\u4ea4\u4e92\u72b6\u6001\u8f6c\u79fb\u56fe\uff0c\u5229\u7528\u4efb\u52a1\u4e2d\u591a\u4e2a\u53ef\u4ea4\u6362\u5b50\u76ee\u6807\u5f62\u6210\u7684\u201c\u94bb\u77f3\u62d3\u6251\u201d\uff0c\u4ece\u5168\u8f68\u8ff9\u6a21\u4eff\u8f6c\u5411\u5c40\u90e8\u9519\u8bef\u6062\u590d\u76d1\u7763\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u7684\u6838\u5fc3\u95ee\u9898\uff1a\u5168\u8f68\u8ff9\u6a21\u4eff\u4f1a\u60e9\u7f5a\u5408\u6cd5\u66ff\u4ee3\u8def\u5f84\u3001\u964d\u4f4e\u7b56\u7565\u591a\u6837\u6027\u3002DART-SD \u901a\u8fc7\u62d3\u6251\u611f\u77e5\u7684\u5c40\u90e8\u7ea0\u9519\u63d0\u5347\u590d\u6742\u4efb\u52a1\u4e0a\u7684\u8bad\u7ec3\u6548\u7387\u548c\u9c81\u68d2\u6027\uff0c\u5bf9\u81ea\u4e3b\u667a\u80fd\u4f53\u8bad\u7ec3\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We are witnessing an explosion of agentic systems for computational chemistry simulations: from half a dozen in 2024 to a dozen in 2025, and the current number approaches fifty, surveyed in this Perspective as of 8 August 2026. The capabilities of these agentic systems are shifting from assisting in performing a selection of computational tasks to autonomous design and execution of \\textit{in silico} experiments, their analysis, and even manuscript writing. The ultimate destination is a fully autonomous AI scientist, where the entirety of computational chemistry is performed on a machine by a machine, without human supervision. While we are not there yet, and all reported systems currently involve a human in the loop, the trend is unmistakable. Even building specialized agentic systems for computational chemistry is increasingly commoditized by generalist agents, which may in the end replace the need for the specialized ones altogether, since adding a new capability will be as easy as asking AI to do it for you. Both the explosion in their number and the very limited adoption beyond their own developers point that way, and we close this Perspective on what it leaves us to do. The speed and scale of disruption agentic systems are bringing to computational chemistry leave many of us dumbfounded about the field\u0027s future and what we should spend our efforts on, as already established specialists, teachers, and students, and we have no answer.", "arxiv_id": "2608.18508", "arxiv_url": "https://arxiv.org/abs/2608.18508", "authors": ["Pavlo O. Dral", "Hassan Nawaz", "Arif Ullah"], "brief": "\u672c\u6587\u662f\u4e00\u7bc7Perspective\uff0c\u68b3\u7406\u622a\u81f32026\u5e748\u6708\u8ba1\u7b97\u5316\u5b66\u4e2d\u8fd150\u4e2a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u53d1\u5c55\u3002\u6587\u7ae0\u6307\u51fa\u8fd9\u4e9b\u7cfb\u7edf\u6b63\u4ece\u8f85\u52a9\u8ba1\u7b97\u4efb\u52a1\uff0c\u8f6c\u5411\u81ea\u4e3b\u8bbe\u8ba1\u3001\u6267\u884c\u3001\u5206\u6790\u7845\u57fa\u5b9e\u9a8c\u5e76\u64b0\u5199\u8bba\u6587\u3002", "categories": ["physics.chem-ph", "cs.AI", "physics.comp-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18508", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8ba1\u7b97\u5316\u5b66\u667a\u80fd\u4f53\u6570\u91cf\u4ece2024\u5e74\u7684\u7ea66\u4e2a\u30012025\u5e74\u7684\u5341\u4f59\u4e2a\u5feb\u901f\u589e\u957f\u5230\u63a5\u8fd150\u4e2a", "\u80fd\u529b\u8fb9\u754c\u4ece\u4efb\u52a1\u8f85\u52a9\u6269\u5c55\u5230\u5b9e\u9a8c\u8bbe\u8ba1\u3001\u6a21\u62df\u6267\u884c\u3001\u7ed3\u679c\u5206\u6790\u548c\u8bba\u6587\u5199\u4f5c", "\u76ee\u524d\u6240\u6709\u7cfb\u7edf\u4ecd\u6709\u4eba\u7c7b\u5728\u73af\uff0c\u4f46\u901a\u7528\u667a\u80fd\u4f53\u53ef\u80fd\u9010\u6b65\u5546\u54c1\u5316\u5e76\u66ff\u4ee3\u4e13\u7528\u8ba1\u7b97\u5316\u5b66\u667a\u80fd\u4f53"], "keywords": ["\u667a\u80fd\u4f53", "AI\u79d1\u5b66\u5bb6", "\u8ba1\u7b97\u5316\u5b66", "\u79d1\u7814\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18508v1", "published_at": "2026-08-19", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Science Done on a Machine by a Machine: AI Agents in Computational Chemistry", "tldr": "\u7efc\u8ff0\u8ba1\u7b97\u5316\u5b66\u667a\u80fd\u4f53\u8fc8\u5411\u81ea\u6cbbAI\u79d1\u5b66\u5bb6", "upvotes": 0, "what_it_is": "\u672c\u6587\u662f\u4e00\u7bc7Perspective\uff0c\u68b3\u7406\u622a\u81f32026\u5e748\u6708\u8ba1\u7b97\u5316\u5b66\u4e2d\u8fd150\u4e2a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u53d1\u5c55\u3002\u6587\u7ae0\u6307\u51fa\u8fd9\u4e9b\u7cfb\u7edf\u6b63\u4ece\u8f85\u52a9\u8ba1\u7b97\u4efb\u52a1\uff0c\u8f6c\u5411\u81ea\u4e3b\u8bbe\u8ba1\u3001\u6267\u884c\u3001\u5206\u6790\u7845\u57fa\u5b9e\u9a8c\u5e76\u64b0\u5199\u8bba\u6587\u3002", "why_notable": "\u8be5\u6587\u7cfb\u7edf\u603b\u7ed3\u4e86AI\u667a\u80fd\u4f53\u5bf9\u8ba1\u7b97\u5316\u5b66\u7814\u7a76\u6d41\u7a0b\u7684\u6f5c\u5728\u98a0\u8986\uff0c\u5f3a\u8c03\u201c\u673a\u5668\u4e0a\u7531\u673a\u5668\u5b8c\u6210\u79d1\u5b66\u201d\u7684\u8d8b\u52bf\uff0c\u5bf9\u79d1\u7814\u81ea\u52a8\u5316\u3001\u5b66\u79d1\u5206\u5de5\u548c\u79d1\u7814\u6559\u80b2\u90fd\u6709\u91cd\u8981\u5f71\u54cd\u3002"}, {"abstract": "Existing explainable deepfake forensic methods typically rely on task-adapted MLLM to jointly address detection, localization, and explanation. Inspired by agent-style tool use, we instead introduce a Perception-as-Tool paradigm and instantiate it as PATE-Forensics, which architecturally decouples detection and localization from explanation generation while coupling detection and localization as tightly as possible within a forensic perception tool. The DINOv3-based tool couples a multi-granularity detection module that integrates global, patch-level, and segment-level evidence with a cue-guided localization module by spatializing the patch-level and segment-level evidence into forgery score maps that guide dense mask prediction. The original image and forensic perception outputs produced by the tool form structured forensic context for a general-purpose MLLM, which is guided by prompt constraints to generate explanations without task-specific fine-tuning. On DDL-X Track 3, PATE-Forensics achieves the best official score of 0.89, outperforming the second-ranked team by 0.19 points. Our code is available at https://github.com/yqli00000/PATE-Forensics.", "arxiv_id": "2608.18573", "arxiv_url": "https://arxiv.org/abs/2608.18573", "authors": ["Yaqi Li", "Jielun Peng", "Yabin Wang", "Jincheng Liu", "Xiaopeng Hong"], "brief": "\u8bba\u6587\u63d0\u51fa PATE-Forensics\uff0c\u5c06\u6df1\u4f2a\u68c0\u6d4b\u4e0e\u5b9a\u4f4d\u5c01\u88c5\u4e3a DINOv3 \u9a71\u52a8\u7684\u201c\u53d6\u8bc1\u611f\u77e5\u5de5\u5177\u201d\uff0c\u518d\u628a\u56fe\u50cf\u4e0e\u7ed3\u6784\u5316\u53d6\u8bc1\u7ed3\u679c\u4ea4\u7ed9\u901a\u7528 MLLM \u751f\u6210\u89e3\u91ca\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u5bf9 MLLM \u505a\u4efb\u52a1\u5fae\u8c03\uff0c\u5b9e\u73b0\u68c0\u6d4b\u3001\u5b9a\u4f4d\u4e0e\u89e3\u91ca\u7684\u67b6\u6784\u89e3\u8026\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18573", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u68c0\u6d4b\u6a21\u5757\u878d\u5408\u5168\u5c40\u3001patch \u7ea7\u548c segment \u7ea7\u591a\u7c92\u5ea6\u8bc1\u636e\uff0c\u63d0\u5347\u6df1\u4f2a\u5224\u65ad\u9c81\u68d2\u6027\u3002", "\u5b9a\u4f4d\u6a21\u5757\u5c06 patch/segment \u8bc1\u636e\u7a7a\u95f4\u5316\u4e3a\u4f2a\u9020\u5206\u6570\u56fe\uff0c\u7528\u4e8e\u5f15\u5bfc\u5bc6\u96c6\u63a9\u7801\u9884\u6d4b\u3002", "\u5728 DDL-X Track 3 \u83b7\u5f97\u5b98\u65b9\u6700\u9ad8\u5206 0.89\uff0c\u9886\u5148\u7b2c\u4e8c\u540d 0.19 \u5206\u3002"], "keywords": ["\u6df1\u4f2a\u68c0\u6d4b", "\u591a\u6a21\u6001", "\u53ef\u89e3\u91caAI", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18573v1", "published_at": "2026-08-19", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PATE-Forensics: Perception-as-Tool for Explainabl
