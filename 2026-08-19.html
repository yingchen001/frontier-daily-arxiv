3a\u4e0b\u964d 47.3 \u4e2a\u767e\u5206\u70b9"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u76d1\u6d4b", "\u591a\u667a\u80fd\u4f53", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19161v1", "published_at": "2026-08-19", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond the Transcript: Detecting Covert Co ordination in Latent Multi-Agent Communication", "tldr": "\u76d1\u6d4b\u5e76\u6291\u5236LLM\u667a\u80fd\u4f53\u6f5c\u5728\u9690\u853d\u901a\u4fe1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Verifiable Latent Alignments\uff08VLA\uff09\uff0c\u7528\u4e8e\u53d1\u73b0\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u901a\u8fc7\u8fde\u7eed\u9690\u85cf\u72b6\u6001\u8fdb\u884c\u7684\u4e0d\u53ef\u89c1\u534f\u540c\u901a\u4fe1\u3002\u5b83\u5c06\u79c1\u6709 latent \u8bb0\u5f55\u3001\u901a\u9053\u72b6\u6001\u4e0e\u516c\u5f00\u52a8\u4f5c\u7ed1\u5b9a\u5230\u540c\u4e00\u4e8b\u4ef6\u6807\u8bc6\uff0c\u5b9e\u73b0\u56e0\u679c\u5339\u914d\u76d1\u6d4b\u4e0e\u5e72\u9884\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126LLM\u667a\u80fd\u4f53\u4e4b\u95f4\u201c\u516c\u5171\u6587\u672c\u4e4b\u5916\u201d\u7684\u9690\u853d\u534f\u540c\u98ce\u9669\uff0c\u63d0\u51fa\u53ef\u9a8c\u8bc1\u7684\u76d1\u6d4b\u4e0e\u5e72\u9884\u673a\u5236\uff0c\u5bf9\u591a\u667a\u80fd\u4f53\u5b89\u5168\u3001\u9690\u853d\u901a\u4fe1\u68c0\u6d4b\u548cAI\u6cbb\u7406\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Fine-grained control over continuous semantic attributes of 3D objects is essential for 3D content creation, but is not well supported by conventional 3D modeling workflows or prompt-based interaction with existing generative AI tools. While slider-based methods have proven effective for fine-grained semantic control in 2D image generation, no equivalent approach exists for 3D. Extending these 2D methods to 3D is non-trivial due to challenges unique to 3D, including geometric integrity and cross-view coherence. We present SemanticSlider3D, a technique for continuous semantic attribute editing of 3D objects that requires no per-attribute training. Given a user-specified attribute, our pipeline constructs a semantic editing direction in the latent space of a state-of-the-art 3D generation model, presenting a diverse and coherent spectrum of 3D variations. A technical validation on a dataset of 50 3D object-attribute pairs shows our method was preferred by all five human assessors across variation range, consistency, 3D object quality, and attribute disentanglement, over a baseline combining a 2D slider with an image-to-3D model. An exploratory study with six participants demonstrates that SemanticSlider3D supported decision-making in 3D prototyping and was perceived as a valuable addition to existing workflows.", "arxiv_id": "2608.18560", "arxiv_url": "https://arxiv.org/abs/2608.18560", "authors": ["Ru Wang", "Rahul Jain", "Koichiro Niinuma", "Aakar Gupta"], "brief": "SemanticSlider3D \u63d0\u51fa\u4e00\u79cd\u9762\u54113D\u5bf9\u8c61\u7684\u8fde\u7eed\u8bed\u4e49\u5c5e\u6027\u7f16\u8f91\u6280\u672f\uff0c\u53ef\u6839\u636e\u7528\u6237\u6307\u5b9a\u5c5e\u6027\uff0c\u5728\u5148\u8fdb3D\u751f\u6210\u6a21\u578b\u7684\u6f5c\u7a7a\u95f4\u4e2d\u6784\u9020\u7f16\u8f91\u65b9\u5411\uff0c\u5b9e\u73b0\u7c7b\u4f3c\u201c\u6ed1\u6746\u201d\u7684\u7ec6\u7c92\u5ea6\u63a7\u5236\u3002\u8be5\u65b9\u6cd5\u4e0d\u9700\u8981\u9488\u5bf9\u6bcf\u4e2a\u5c5e\u6027\u5355\u72ec\u8bad\u7ec3\uff0c\u5e76\u80fd\u751f\u6210\u591a\u6837\u4e14\u8de8\u89c6\u89d2\u4e00\u81f4\u76843D\u53d8\u5316\u3002", "categories": ["cs.HC", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18560", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c062D\u56fe\u50cf\u4e2d\u7684\u8bed\u4e49\u6ed1\u6746\u63a7\u5236\u6269\u5c55\u52303D\u5bf9\u8c61\u7f16\u8f91\uff0c\u91cd\u70b9\u89e3\u51b3\u51e0\u4f55\u5b8c\u6574\u6027\u4e0e\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u95ee\u9898", "\u572850\u7ec43D\u5bf9\u8c61-\u5c5e\u6027\u6570\u636e\u4e0a\u9a8c\u8bc1\uff0c\u76f8\u6bd4\u201c2D\u6ed1\u6746+\u56fe\u50cf\u8f6c3D\u201d\u57fa\u7ebf\uff0c\u5728\u53d8\u5316\u8303\u56f4\u3001\u4e00\u81f4\u6027\u3001\u5bf9\u8c61\u8d28\u91cf\u548c\u5c5e\u6027\u89e3\u8026\u4e0a\u5747\u83b75\u540d\u8bc4\u4f30\u8005\u504f\u597d", "6\u4eba\u63a2\u7d22\u6027\u7528\u6237\u7814\u7a76\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u6709\u52a9\u4e8e3D\u539f\u578b\u8bbe\u8ba1\u4e2d\u7684\u65b9\u6848\u6bd4\u8f83\u4e0e\u51b3\u7b56"], "keywords": ["3D\u751f\u6210", "\u8bed\u4e49\u7f16\u8f91", "\u4eba\u673a\u4ea4\u4e92", "\u5185\u5bb9\u521b\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18560v1", "published_at": "2026-08-19", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SemanticSlider3D: Training-Free Continuous Semantic Editing for 3D Objects", "tldr": "\u65e0\u9700\u8bad\u7ec3\u76843D\u8bed\u4e49\u6ed1\u6746\u7f16\u8f91\u65b9\u6cd5", "upvotes": 0, "what_it_is": "SemanticSlider3D \u63d0\u51fa\u4e00\u79cd\u9762\u54113D\u5bf9\u8c61\u7684\u8fde\u7eed\u8bed\u4e49\u5c5e\u6027\u7f16\u8f91\u6280\u672f\uff0c\u53ef\u6839\u636e\u7528\u6237\u6307\u5b9a\u5c5e\u6027\uff0c\u5728\u5148\u8fdb3D\u751f\u6210\u6a21\u578b\u7684\u6f5c\u7a7a\u95f4\u4e2d\u6784\u9020\u7f16\u8f91\u65b9\u5411\uff0c\u5b9e\u73b0\u7c7b\u4f3c\u201c\u6ed1\u6746\u201d\u7684\u7ec6\u7c92\u5ea6\u63a7\u5236\u3002\u8be5\u65b9\u6cd5\u4e0d\u9700\u8981\u9488\u5bf9\u6bcf\u4e2a\u5c5e\u6027\u5355\u72ec\u8bad\u7ec3\uff0c\u5e76\u80fd\u751f\u6210\u591a\u6837\u4e14\u8de8\u89c6\u89d2\u4e00\u81f4\u76843D\u53d8\u5316\u3002", "why_notable": "\u5b83\u4e3a3D\u5185\u5bb9\u521b\u4f5c\u63d0\u4f9b\u4e86\u6bd4\u6587\u672c\u63d0\u793a\u66f4\u53ef\u63a7\u3001\u6bd4\u4f20\u7edf\u5efa\u6a21\u66f4\u8bed\u4e49\u5316\u7684\u4ea4\u4e92\u65b9\u5f0f\uff0c\u4e14\u65e0\u9700\u6309\u5c5e\u6027\u8bad\u7ec3\uff0c\u964d\u4f4e\u4e86\u7ec6\u7c92\u5ea63D\u7f16\u8f91\u7684\u4f7f\u7528\u95e8\u69db\u3002"}, {"abstract": "Modeling object dynamics from limited visual observations is a fundamental problem for enabling accurate motion trajectory prediction in embodied interaction scenarios. Existing dynamics modeling methods first compress reconstructed particle representations into sparse Key Points and model their evolution using locally constrained interactions, thereby discarding fine-grained local details and obscuring discriminative interaction modeling across spatial and temporal scales, leading to drifting trajectories and inaccurate appearance prediction. To tackle these issues, we propose DyG$^2$T, a dynamics modeling framework that infers object motion trajectories by spatially completing and temporally discriminating Key Point representations and modeling multi-scale interaction over particle graphs. Spatially, DyG$^2$T enriches each Key Point by aggregating neighboring raw particle positions to recover fine-grained local details, while explicitly encoding relative offsets among Key Points to enhance geometric structure perception. Temporally, we introduce a Temporal Disentangling Network (TDN) to identify dominant cross-frame variations in latent space and amplify inter-frame differences, yielding temporally discriminative representations that are subsequently aggregated via Temporal Attention to capture frame-wise temporal evolution cues. For comprehensive interaction modeling, a Particle Graph Transformer leverages global attention to preserve discriminative long-range dependencies among Key Points, mitigating representation homogenization induced by locality-constrained modeling and providing a robust basis for accurate trajectory prediction. Experiments on both synthetic and real-world datasets demonstrate that DyG$^2$T achieves accurate dynamics modeling and reasoning, and exhibits strong cross-object and real-world generalization.", "arxiv_id": "2608.18498", "arxiv_url": "https://arxiv.org/abs/2608.18498", "authors": ["Yansong Wang", "Zhaobo Qi", "Xinyan Liu", "Beichen Zhang", "Shuhui Wang", "Weigang Zhang", "Qingming Huang"], "brief": "\u672c\u6587\u63d0\u51fa DyG\u00b2T\uff0c\u4e00\u4e2a\u57fa\u4e8e 3D Gaussian \u7c92\u5b50\u8868\u793a\u7684\u7269\u4f53\u52a8\u529b\u5b66\u5efa\u6a21\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u7a7a\u95f4\u8865\u5168\u3001\u65f6\u95f4\u89e3\u8026\u548c\u591a\u5c3a\u5ea6\u7c92\u5b50\u56fe\u4ea4\u4e92\u5efa\u6a21\uff0c\u4ece\u6709\u9650\u89c6\u89c9\u89c2\u6d4b\u4e2d\u9884\u6d4b\u7269\u4f53\u8fd0\u52a8\u8f68\u8ff9\u4e0e\u5916\u89c2\u53d8\u5316\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18498", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7a7a\u95f4\u4e0a\u4e3a\u5173\u952e\u70b9\u805a\u5408\u90bb\u8fd1\u539f\u59cb\u7c92\u5b50\u4f4d\u7f6e\uff0c\u5e76\u7f16\u7801\u5173\u952e\u70b9\u95f4\u76f8\u5bf9\u504f\u79fb\uff0c\u6062\u590d\u7ec6\u7c92\u5ea6\u5c40\u90e8\u51e0\u4f55\u7ec6\u8282\u3002", "\u63d0\u51fa Temporal Disentangling Network\uff0c\u5728\u6f5c\u7a7a\u95f4\u4e2d\u8bc6\u522b\u5e76\u653e\u5927\u8de8\u5e27\u4e3b\u5bfc\u53d8\u5316\uff0c\u518d\u7528\u65f6\u95f4\u6ce8\u610f\u529b\u805a\u5408\u52a8\u6001\u6f14\u5316\u7ebf\u7d22\u3002", "\u4f7f\u7528 Particle Graph Transformer \u8fdb\u884c\u5168\u5c40\u6ce8\u610f\u529b\u5efa\u6a21\uff0c\u6355\u83b7\u5173\u952e\u70b9\u95f4\u957f\u7a0b\u4f9d\u8d56\uff0c\u7f13\u89e3\u5c40\u90e8\u4ea4\u4e92\u5bfc\u81f4\u7684\u8868\u793a\u540c\u8d28\u5316\u3002"], "keywords": ["\u52a8\u529b\u5b66\u5efa\u6a21", "3D Gaussian", "\u56feTransformer", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18498v1", "published_at": "2026-08-19", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DyG$^2$T: Modeling Object Dynamics with 3D Gaussian Temporal-Spatial Particle Graph Transformer", "tldr": "\u7528\u7c92\u5b50\u56feTransformer\u63d0\u5347\u7269\u4f53\u8fd0\u52a8\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa DyG\u00b2T\uff0c\u4e00\u4e2a\u57fa\u4e8e 3D Gaussian \u7c92\u5b50\u8868\u793a\u7684\u7269\u4f53\u52a8\u529b\u5b66\u5efa\u6a21\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u7a7a\u95f4\u8865\u5168\u3001\u65f6\u95f4\u89e3\u8026\u548c\u591a\u5c3a\u5ea6\u7c92\u5b50\u56fe\u4ea4\u4e92\u5efa\u6a21\uff0c\u4ece\u6709\u9650\u89c6\u89c9\u89c2\u6d4b\u4e2d\u9884\u6d4b\u7269\u4f53\u8fd0\u52a8\u8f68\u8ff9\u4e0e\u5916\u89c2\u53d8\u5316\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u73b0\u6709\u5173\u952e\u70b9\u52a8\u529b\u5b66\u6a21\u578b\u4e22\u5931\u7ec6\u8282\u3001\u957f\u7a0b\u4ea4\u4e92\u4e0d\u8db3\u548c\u8f68\u8ff9\u6f02\u79fb\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u4e14\u5177\u5907\u65f6\u7a7a\u5224\u522b\u6027\u7684\u5efa\u6a21\u65b9\u5f0f\uff0c\u5e76\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u6570\u636e\u4e0a\u5c55\u793a\u4e86\u8de8\u7269\u4f53\u548c\u771f\u5b9e\u573a\u666f\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "On-policy distillation (OPD) trains a student on its own responses using dense token-level guidance from a stronger teacher. In long-context tasks, however, token-level teacher support can favor locally plausible responses that omit evidence distributed across the input or violate global task constraints. Task-specific verifiers, in contrast, evaluate task completion at the response level and may return graded rewards that reflect partial success. We diagnose this mismatch on fixed responses from two representative long-context evidence-aggregation tasks. Across longer input ranges, trajectory-level OPD scores become progressively less aligned with verifier rewards, indicating teacher-verifier disagreement. Motivated by this observation, we introduce Group-Calibrated On-Policy Distillation (GC-OPD). GC-OPD separately normalizes verifier rewards and trajectory-level OPD scores within each rollout group and uses their difference as a signed teacher-verifier disagreement residual. Relative-advantage-based credit assignment (RACA) distributes this trajectory-level residual across tokens according to their relative OPD advantages while preserving the original OPD signal. Across five long-context benchmarks, post-training with GC-OPD raises the five-benchmark averages of the official Qwen3-4B and Qwen3-8B checkpoints from 29.08 to 40.47 and from 35.12 to 44.65, respectively. Vanilla OPD reaches 39.31 and 43.56 under the same setup. Controlled ablations show that the signed residual is more effective than either an additional OPD-derived term or direct group-normalized verifier reward addition, while RACA further improves over uniform token allocation. Together, these results demonstrate that group-relative residual calibration can incorporate verifier outcomes without discarding dense token-level guidance. Code is available at https://github.com/SolereZhang/GC-OPD.", "arxiv_id": "2608.19181", "arxiv_url": "https://arxiv.org/abs/2608.19181", "authors": ["Zhu Zhang", "Jixun Wang", "Xiaoang Xu", "Xiaorong Wang", "Zihan Zhou", "Zhiyuan Wang", "Shuo Wang", "Chaojun Xiao", "Yuezhi Zhou"], "brief": "\u672c\u6587\u63d0\u51fa Group-Calibrated On-Policy Distillation\uff08GC-OPD\uff09\uff0c\u7528\u4e8e\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u6559\u5e08\u6a21\u578b token \u7ea7\u4f3c\u7136\u4e0e\u4efb\u52a1\u7ea7\u9a8c\u8bc1\u5668\u5956\u52b1\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002\u65b9\u6cd5\u5728\u540c\u7ec4 rollout \u5185\u5f52\u4e00\u5316\u6559\u5e08\u8f68\u8ff9\u5206\u6570\u4e0e\u9a8c\u8bc1\u5668\u5956\u52b1\uff0c\u5e76\u5c06\u5dee\u503c\u4f5c\u4e3a\u6b8b\u5dee\u4fe1\u53f7\u5206\u914d\u5230 token \u8bad\u7ec3\u4e2d\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19181", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u957f\u4e0a\u4e0b\u6587\u8bc1\u636e\u805a\u5408\u4efb\u52a1\u4e2d\uff0c\u8f93\u5165\u8d8a\u957f\uff0cOPD \u8f68\u8ff9\u7ea7\u6559\u5e08\u5206\u6570\u4e0e\u9a8c\u8bc1\u5668\u5956\u52b1\u8d8a\u4e0d\u4e00\u81f4\u3002", "GC-OPD \u4f7f\u7528\u7ec4\u5185\u5f52\u4e00\u5316\u540e\u7684\u6709\u7b26\u53f7\u6559\u5e08-\u9a8c\u8bc1\u5668\u6b8b\u5dee\uff0c\u5e76\u901a\u8fc7 RACA \u6309\u76f8\u5bf9 OPD \u4f18\u52bf\u8fdb\u884c token \u7ea7\u4fe1\u7528\u5206\u914d\u3002", "\u5728\u4e94\u4e2a\u957f\u4e0a\u4e0b\u6587\u57fa\u51c6\u4e0a\uff0cQwen3-4B \u5e73\u5747\u5206\u4ece 29.08 \u63d0\u5347\u5230 40.47\uff0cQwen3-8B \u4ece 35.12 \u63d0\u5347\u5230 44.65\uff0c\u4f18\u4e8e\u666e\u901a OPD\u3002"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19181v1", "published_at": "2026-08-19", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Teacher Likelihood: Group-Calibrated On-Policy Distillation for Long-Context Reasoning", "tldr": "\u7528\u9a8c\u8bc1\u5668\u6821\u51c6\u957f\u4e0a\u4e0b\u6587\u84b8\u998f\u4fe1\u53f7\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Group-Calibrated On-Policy Distillation\uff08GC-OPD\uff09\uff0c\u7528\u4e8e\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u6559\u5e08\u6a21\u578b token \u7ea7\u4f3c\u7136\u4e0e\u4efb\u52a1\u7ea7\u9a8c\u8bc1\u5668\u5956\u52b1\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002\u65b9\u6cd5\u5728\u540c\u7ec4 rollout \u5185\u5f52\u4e00\u5316\u6559\u5e08\u8f68\u8ff9\u5206\u6570\u4e0e\u9a8c\u8bc1\u5668\u5956\u52b1\uff0c\u5e76\u5c06\u5dee\u503c\u4f5c\u4e3a\u6b8b\u5dee\u4fe1\u53f7\u5206\u914d\u5230 token \u8bad\u7ec3\u4e2d\u3002", "why_notable": "\u5b83\u63d0\u4f9b\u4e86\u4e00\u79cd\u5c06\u4efb\u52a1\u7ea7\u9a8c\u8bc1\u5668\u53cd\u9988\u878d\u5165\u5bc6\u96c6 token \u7ea7\u84b8\u998f\u7684\u6709\u6548\u65b9\u5f0f\uff0c\u7279\u522b\u9002\u5408\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u9700\u8981\u5168\u5c40\u7ea6\u675f\u548c\u5206\u6563\u8bc1\u636e\u6574\u5408\u7684\u573a\u666f\u3002"}, {"abstract": "Modern Intel AI PCs ship capable integrated GPUs and NPUs with 16+ GB of unified memory, and they spend considerable time idle. That is not enough memory to fit a large model such as a 70B-parameter LLM. We show that a handful of AIPCs, working together over an ordinary network, can serve models beyond the capability of any single one. We use pipeline parallelism: a model is split by layer into per-stage shards, each pre-compiled into an OpenVINO graph, so that every machine runs one shard and passes activations to the next. Three techniques make this fast enough to be useful. First, we recover the speed of the unsplit model: a naive per-stage export runs well below monolithic inference because it misses an OpenVINO GPU optimization, and injecting a beam_idx Gather into each shard triggers that optimization (the IndirectKVCache fusion) and brings the shards to parity. Second, we leverage speculative decoding on stateful OpenVINO models. Third, the pipeline serves several users at once by interleaving their requests across the stages, each request carrying its own cache (micro-batching). Together, a two-node Llama 3.1 8B INT4 pipeline serves two concurrent users at 1.79x the single-user throughput of the unsplit model on the same hardware, and the gap widens under simulated wide-area latency. The same design scales to a 70B model that no single fleet member can hold: a four-node deployment of Lunar Lake AI PCs on Intel Tiber Cloud serves a single user at interactive speed, with output token-for-token identical to the same four-node pipeline decoding without speculation. Code, raw benchmark logs, and reproduction scripts ship as a self-contained package at https://github.com/labscommunity/pipeline-sharded-inference-paper (in the top-level reproduction/ directory).", "arxiv_id": "2608.19147", "arxiv_url": "https://arxiv.org/abs/2608.19147", "authors": ["Tate Berenbaum", "Muthaiah Venkatachalam"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 Intel AI PC \u96c6\u7fa4\u7684\u5206\u5e03\u5f0f LLM \u63a8\u7406\u65b9\u6848\uff1a\u6309\u5c42\u5207\u5206\u6a21\u578b\uff0c\u5c06\u6bcf\u6bb5\u9884\u7f16\u8bd1\u4e3a OpenVINO \u56fe\uff0c\u5728\u591a\u53f0\u666e\u901a\u7f51\u7edc\u8fde\u63a5\u7684\u673a\u5668\u4e0a\u6d41\u6c34\u7ebf\u6267\u884c\u3002\u8be5\u65b9\u6cd5\u8ba9\u5355\u673a\u663e\u5b58\u65e0\u6cd5\u5bb9\u7eb3\u7684\u6a21\u578b\uff08\u5982 70B\uff09\u53ef\u7531\u591a\u53f0 AI PC \u534f\u540c\u4ee5\u4ea4\u4e92\u901f\u5ea6\u670d\u52a1\u3002", "categories": ["cs.DC", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19147", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u5728\u6bcf\u4e2a\u5206\u7247\u4e2d\u6ce8\u5165 beam_idx Gather\uff0c\u89e6\u53d1 OpenVINO \u7684 IndirectKVCache fusion \u4f18\u5316\uff0c\u4f7f\u5206\u7247\u6d41\u6c34\u7ebf\u6027\u80fd\u63a5\u8fd1\u672a\u5207\u5206\u6a21\u578b\u3002", "\u5728\u6709\u72b6\u6001 OpenVINO \u6a21\u578b\u4e0a\u7ed3\u5408 speculative decoding\uff0c\u63d0\u5347\u751f\u6210\u541e\u5410\u3002", "\u7528\u5fae\u6279\u5904\u7406\u5728\u6d41\u6c34\u7ebf\u5404\u9636\u6bb5\u4ea4\u9519\u670d\u52a1\u591a\u7528\u6237\u8bf7\u6c42\uff0c\u5e76\u4e3a\u6bcf\u4e2a\u8bf7\u6c42\u7ef4\u62a4\u72ec\u7acb KV cache\uff1b\u4e24\u8282\u70b9 Llama 3.1 8B INT4 \u5bf9\u53cc\u5e76\u53d1\u7528\u6237\u8fbe\u5230\u5355\u7528\u6237\u672a\u5207\u5206\u6a21\u578b 1.79 \u500d\u541e\u5410\u3002"], "keywords": ["\u5206\u5e03\u5f0f\u63a8\u7406", "\u5927\u6a21\u578b", "\u8fb9\u7f18\u8ba1\u7b97", "\u6d41\u6c34\u7ebf\u5e76\u884c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19147v1", "published_at": "2026-08-19", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Pre-Compiled Pipeline Shards for Distributed LLM Inference on Intel AI PC Fleets", "tldr": "\u7528\u95f2\u7f6eAI PC\u96c6\u7fa4\u6d41\u6c34\u7ebf\u63a8\u7406\u5927\u6a21\u578b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 Intel AI PC \u96c6\u7fa4\u7684\u5206\u5e03\u5f0f LLM \u63a8\u7406\u65b9\u6848\uff1a\u6309\u5c42\u5207\u5206\u6a21\u578b\uff0c\u5c06\u6bcf\u6bb5\u9884\u7f16\u8bd1\u4e3a OpenVINO \u56fe\uff0c\u5728\u591a\u53f0\u666e\u901a\u7f51\u7edc\u8fde\u63a5\u7684\u673a\u5668\u4e0a\u6d41\u6c34\u7ebf\u6267\u884c\u3002\u8be5\u65b9\u6cd5\u8ba9\u5355\u673a\u663e\u5b58\u65e0\u6cd5\u5bb9\u7eb3\u7684\u6a21\u578b\uff08\u5982 70B\uff09\u53ef\u7531\u591a\u53f0 AI PC \u534f\u540c\u4ee5\u4ea4\u4e92\u901f\u5ea6\u670d\u52a1\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u5229\u7528\u5927\u91cf\u95f2\u7f6e AI PC \u7684\u96c6\u6210 GPU/NPU \u4e0e\u7edf\u4e00\u5185\u5b58\uff0c\u4f4e\u6210\u672c\u90e8\u7f72\u8d85\u51fa\u5355\u673a\u80fd\u529b\u7684\u5927\u6a21\u578b\u63a8\u7406\u7684\u53ef\u884c\u8def\u5f84\uff1b\u540c\u65f6\u7ed9\u51fa\u4e86\u9488\u5bf9 OpenVINO \u5206\u7247\u63a8\u7406\u7684\u5173\u952e\u6027\u80fd\u4fee\u590d\u548c\u53ef\u590d\u73b0\u5b9e\u9a8c\uff0c\u5bf9\u8fb9\u7f18/\u4f01\u4e1a\u5185\u7f51\u5927\u6a21\u578b\u670d\u52a1\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A gradient-boosted ensemble predicts by summing one leaf value per tree. Read those values as coordinates rather than as intermediate results, and every instance becomes a point in R^M on which the model acts linearly: the score is the sum of the coordinates. This small change of view makes contrastive explanation exact. The difference between two instances is a vector that is identically zero wherever they share a leaf, so the gap between a rejected applicant and an accepted one is carried by a handful of coordinates, each traceable to a real split in a real tree. Nothing is fitted, sampled, or assumed additive in features -- the additivity is already there, in the right space. We build a recourse method on this representation and evaluate it on five tabular datasets under repeated cross-validation. Its recommendation reconstructs the model\u0027s own decision to 6.2 x 10^-15, so an auditor can re-check the arithmetic without the model. On the credit datasets it is Pareto-non-dominated on effort against realism. And when recommendations are restricted to changes the subject could actually make -- not their age, not a settled delinquency -- it retains 58% of its validity where the strongest baseline retains 41%, a distinction the standard evaluation cannot see because it never asks whether a recommendation can be carried out.", "arxiv_id": "2608.19127", "arxiv_url": "https://arxiv.org/abs/2608.19127", "authors": ["Emanuele Luzio"], "brief": "\u8bba\u6587\u63d0\u51fa\u5c06\u68af\u5ea6\u63d0\u5347\u96c6\u6210\u4e2d\u6bcf\u68f5\u6811\u7684\u53f6\u5b50\u503c\u89c6\u4e3a\u5750\u6807\uff0c\u628a\u6837\u672c\u6620\u5c04\u5230\u4e00\u4e2a\u6a21\u578b\u7ebf\u6027\u4f5c\u7528\u7684\u7a7a\u95f4\u4e2d\u3002\u57fa\u4e8e\u8be5\u8868\u793a\uff0c\u4f5c\u8005\u6784\u5efa\u4e86\u7cbe\u786e\u7684\u5bf9\u6bd4\u89e3\u91ca\u4e0e\u53ef\u6267\u884c\u53cd\u4e8b\u5b9e\u63a8\u8350\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19127", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6837\u672c\u95f4\u9884\u6d4b\u5dee\u5f02\u53ef\u5206\u89e3\u4e3a\u53f6\u5b50\u503c\u5750\u6807\u5dee\uff0c\u4e14\u5171\u4eab\u53f6\u5b50\u7684\u5750\u6807\u4e3a\u96f6\uff0c\u56e0\u6b64\u80fd\u7cbe\u786e\u5b9a\u4f4d\u5c11\u6570\u5173\u952e\u6811\u8282\u70b9\u8d21\u732e", "\u65e0\u9700\u62df\u5408\u3001\u91c7\u6837\u6216\u5047\u8bbe\u7279\u5f81\u53ef\u52a0\u6027\uff1b\u53ef\u52a0\u6027\u6765\u81ea\u68af\u5ea6\u63d0\u5347\u6a21\u578b\u672c\u8eab\u5728\u53f6\u503c\u7a7a\u95f4\u4e2d\u7684\u7ed3\u6784", "\u57285\u4e2a\u8868\u683c\u6570\u636e\u96c6\u4ea4\u53c9\u9a8c\u8bc1\u4e2d\uff0c\u63a8\u8350\u7ed3\u679c\u53ef\u5c06\u6a21\u578b\u51b3\u7b56\u91cd\u6784\u52306.2\u00d710^-15\u8bef\u5dee\uff0c\u5e76\u5728\u53ef\u6267\u884c\u7ea6\u675f\u4e0b\u4fdd\u630158%\u6709\u6548\u7387\uff0c\u9ad8\u4e8e\u6700\u5f3a\u57fa\u7ebf\u768441%"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u68af\u5ea6\u63d0\u5347\u6811", "\u53cd\u4e8b\u5b9e\u89e3\u91ca", "\u8868\u683c\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19127v1", "published_at": "2026-08-19", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Leaf Values as Coordinates: Exact Contrastive Explanation for Gradient-Boosted Ensembles", "tldr": "\u7528\u53f6\u5b50\u503c\u5750\u6807\u7cbe\u786e\u89e3\u91ca\u68af\u5ea6\u63d0\u5347\u6811\u51b3\u7b56", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5c06\u68af\u5ea6\u63d0\u5347\u96c6\u6210\u4e2d\u6bcf\u68f5\u6811\u7684\u53f6\u5b50\u503c\u89c6\u4e3a\u5750\u6807\uff0c\u628a\u6837\u672c\u6620\u5c04\u5230\u4e00\u4e2a\u6a21\u578b\u7ebf\u6027\u4f5c\u7528\u7684\u7a7a\u95f4\u4e2d\u3002\u57fa\u4e8e\u8be5\u8868\u793a\uff0c\u4f5c\u8005\u6784\u5efa\u4e86\u7cbe\u786e\u7684\u5bf9\u6bd4\u89e3\u91ca\u4e0e\u53ef\u6267\u884c\u53cd\u4e8b\u5b9e\u63a8\u8350\u65b9\u6cd5\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u68af\u5ea6\u63d0\u5347\u6811\u63d0\u4f9b\u4e86\u7cbe\u786e\u3001\u53ef\u5ba1\u8ba1\u7684\u5bf9\u6bd4\u89e3\u91ca\uff0c\u5e76\u5f3a\u8c03\u53cd\u4e8b\u5b9e\u63a8\u8350\u662f\u5426\u771f\u6b63\u53ef\u6267\u884c\uff0c\u9002\u5408\u4fe1\u8d37\u7b49\u9ad8\u98ce\u9669\u8868\u683c\u51b3\u7b56\u573a\u666f\u3002"}, {"abstract": "Frontier language models are compared, marketed, and benchmarked on capability -- what their best or average output can achieve. I argue this measures the wrong axis. The models have saturated accuracy: their mean output lands on the target. What now separates one system from another in practice is precision: how tightly concentrated their outputs are around that target across repeated, identical requests. Borrowing the marksman\u0027s distinction, capability is where the average shot lands; reliability is the size of the group. I make three claims. First, precision, not capability, is the frontier differentiator between systems, and benchmark culture systematically fails to measure it, reporting central tendency rather than spread. Second, precision is measurable, cheaply and without circularity, by running a fixed suite of deterministically scored tasks many times at fixed temperature and computing the per-task consistency of outcomes -- no model-in-the-loop grader required. Third, the measurement is not merely descriptive but decision-guiding: it separates consistent failures (a tight group off-centre, correctable by the operating discipline of Paper 1 -- a sight adjustment) from scattered failures (a wide group, correctable only by changing the model or its sampling -- a rifle problem). I define a grouping metric, specify a harness, and show how tracking a human-AI pair\u0027s grouping over time yields the compounding signal that Paper 1\u0027s field study requires. A first real run, since replicated, illustrates both the method and its most important limit: one measured gap was closed completely by a single rule (0/5 -\u003e 5/5), while a suite of tasks authored from the rules themselves found no value, because a frontier model already embodies explicit good practice -- establishing that a discipline\u0027s worth is found by measurement on real work, not constructed from its own rulebook.", "arxiv_id": "2608.19140", "arxiv_url": "https://arxiv.org/abs/2608.19140", "authors": ["George Andrikopoulos"], "brief": "\u8bba\u6587\u63d0\u51fa\uff0c\u5f53\u524d\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b\u8fc7\u5ea6\u5173\u6ce8\u201c\u80fd\u529b\u201d\u621 u6cbfAI\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\uff0c\u5f53\u524d\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b\u8fc7\u5ea6\u5173\u6ce8\u201c\u80fd\u529b\u201d\u6216\u5e73\u5747\u8868\u73b0\uff0c\u800c\u5ffd\u89c6\u91cd\u590d\u76f8\u540c\u8bf7\u6c42\u65f6\u8f93\u51fa\u7ed3\u679c\u7684\u79bb\u6563\u7a0b\u5ea6\u3002\u4f5c\u8005\u5b9a\u4e49\u4e86\u201c\u5206\u7ec4\u201d\u6307\u6807\u4e0e\u6d4b\u8bd5\u6846\u67b6\uff0c\u7528\u591a\u6b21\u8fd0\u884c\u786e\u5b9a\u6027\u8bc4\u5206\u4efb\u52a1\u6765\u8861\u91cf\u6a21\u578b\u8f93\u51fa\u7cbe\u5ea6\u4e0e\u53ef\u9760\u6027\u3002", "why_notable": "\u8be5\u6587\u6311\u6218\u4e3b\u6d41\u57fa\u51c6\u53ea\u62a5\u544a\u5747\u503c\u6216\u6700\u4f73\u7ed3\u679c\u7684\u8bc4\u6d4b\u6587\u5316\uff0c\u5f3a\u8c03\u53ef\u91cd\u590d\u6027\u548c\u65b9\u5dee\u5bf9\u771f\u5b9e\u90e8\u7f72\u66f4\u5173\u952e\uff1b\u5176\u6307\u6807\u53ef\u7528\u4e8e\u9009\u62e9\u6a21\u578b\u3001\u76d1\u63a7\u4eba\u673a\u534f\u4f5c\u968f\u65f6\u95f4\u7684\u53ef\u9760\u6027\uff0c\u5e76\u6307\u5bfc\u5de5\u7a0b\u6539\u8fdb\u3002"}, {"abstract": "This technical report describes our winning submission to the AES AIMLA 2025 Challenge on querying sound effects by vocal imitation. We investigate two complementary fine-tuning strategies: contrastive learning with a frozen, pretrained CED encoder, and joint contrastive-triplet learning with semi-hard negatives using a MobileNetV3 encoder. This report has been updated for posterity to include details released after the challenge.", "arxiv_id": "2608.19174", "arxiv_url": "https://arxiv.org/abs/2608.19174", "authors": ["Aditya Bhattacharjee", "Christos Plachouras", "Sungkyun Chang", "Emmanouil Benetos"], "brief": "\u8fd9\u662f\u4e00\u4efd AES AIMLA 2025 \u6311\u6218\u8d5b\u51a0\u519b\u65b9\u6848\u6280\u672f\u62a5\u544a\uff0c\u7814\u7a76\u5982\u4f55\u901a\u8fc7\u4eba\u58f0\u6a21\u4eff\u6765\u68c0\u7d22\u76ee\u6807\u97f3\u6548\u3002\u8bba\u6587\u6bd4\u8f83\u4e86\u4e24\u79cd\u5fae\u8c03\u7b56\u7565\uff1a\u57fa\u4e8e\u51bb\u7ed3 CED \u7f16\u7801\u5668\u7684\u5bf9\u6bd4\u5b66\u4e60\uff0c\u4ee5\u53ca\u4f7f\u7528 MobileNetV3 \u7684\u8054\u5408\u5bf9\u6bd4-\u4e09\u5143\u7ec4\u5b66\u4e60\u3002", "categories": ["cs.SD", "cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19174", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": ["\u4efb\u52a1\u805a\u7126\u4e8e\u201c\u7528\u4eba\u58f0\u6a21\u4eff\u67e5\u8be2\u97f3\u6548\u201d\uff0c\u5373\u5c06\u53e3\u6280\u5f0f\u58f0\u97f3\u4e0e\u771f\u5b9e\u97f3\u6548\u5728\u5d4c\u5165\u7a7a\u95f4\u4e2d\u5bf9\u9f50", "\u4e00\u79cd\u65b9\u6848\u4f7f\u7528\u9884\u8bad\u7ec3 CED \u7f16\u7801\u5668\u5e76\u51bb\u7ed3\u53c2\u6570\uff0c\u901a\u8fc7\u5bf9\u6bd4\u5b66\u4e60\u9002\u914d\u68c0\u7d22\u4efb\u52a1", "\u53e6\u4e00\u79cd\u65b9\u6848\u91c7\u7528 MobileNetV3 \u7f16\u7801\u5668\uff0c\u7ed3\u5408\u5bf9\u6bd4\u635f\u5931\u3001\u4e09\u5143\u7ec4\u635f\u5931\u548c semi-hard negatives \u63d0\u5347\u533a\u5206\u80fd\u529b"], "keywords": ["\u97f3\u9891\u68c0\u7d22", "\u5bf9\u6bd4\u5b66\u4e60", "\u97f3\u9891\u8868\u5f81", "\u5ea6\u91cf\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19174v1", "published_at": "2026-08-19", "score": 0.1, "selected_reasons": [], "thumbnail": null, "title": "Finetuning Strategies for Querying Sounds by Vocal Imitation", "tldr": "\u7528\u5fae\u8c03\u63d0\u5347\u53e3\u6280\u68c0\u7d22\u97f3\u6548\u6548\u679c", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4e00\u4efd AES AIMLA 2025 \u6311\u6218\u8d5b\u51a0\u519b\u65b9\u6848\u6280\u672f\u62a5\u544a\uff0c\u7814\u7a76\u5982\u4f55\u901a\u8fc7\u4eba\u58f0\u6a21\u4eff\u6765\u68c0\u7d22\u76ee\u6807\u97f3\u6548\u3002\u8bba\u6587\u6bd4\u8f83\u4e86\u4e24\u79cd\u5fae\u8c03\u7b56\u7565\uff1a\u57fa\u4e8e\u51bb\u7ed3 CED \u7f16\u7801\u5668\u7684\u5bf9\u6bd4\u5b66\u4e60\uff0c\u4ee5\u53ca\u4f7f\u7528 MobileNetV3 \u7684\u8054\u5408\u5bf9\u6bd4-\u4e09\u5143\u7ec4\u5b66\u4e60\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6765\u81ea\u58f0\u97f3\u68c0\u7d22\u6311\u6218\u8d5b\u51a0\u519b\u65b9\u6848\uff0c\u5c55\u793a\u4e86\u5728\u5c0f\u4f17\u4f46\u5b9e\u7528\u7684\u97f3\u9891\u68c0\u7d22\u573a\u666f\u4e2d\uff0c\u9884\u8bad\u7ec3\u97f3\u9891\u8868\u5f81\u4e0e\u5ea6\u91cf\u5b66\u4e60\u5fae\u8c03\u7684\u6709\u6548\u7ec4\u5408\uff0c\u5bf9\u97f3\u6548\u5e93\u641c\u7d22\u3001\u521b\u610f\u97f3\u9891\u5236\u4f5c\u548c\u4eba\u673a\u4ea4\u4e92\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "When an expert corrects an LLM assistant\u0027s error, the correction usually dies with the session, and the error class returns. I argue this is an operations problem, not a tooling problem: mechanisms for persisting corrections exist and are shipping, but the discipline for governing them -- versioning with provenance, recurrence monitoring, counter-metrics, retirement of stale rules -- does not. Writing as a systems engineer of thirty years, I map the LLM stack onto the machines my profession already operates (frozen silicon, firmware, loadable modules, persistent configuration, volatile memory), identify where the mapping fails (stochastic generation, configuration that binds only probabilistically, no general-purpose retirement (verification) stage by default), and derive from the failures a seven-principle operating discipline with an error loop at its core. Three cases from my own practice illustrate the mechanism, among them a control that silently became the exact harm it was built to prevent. I close with the measurement framework this view implies and the lab study required to test it.", "arxiv_id": "2608.19125", "arxiv_url": "https://arxiv.org/abs/2608.19125", "authors": ["George Andrikopoulos"], "brief": "\u672c\u6587\u5c06LLM\u7cfb\u7edf\u7c7b\u6bd4\u4e3a\u5de5\u7a0b\u5e08\u957f\u671f\u8fd0\u7ef4\u7684\u673a\u5668\uff0c\u6307\u51fa\u4e13\u5bb6\u7ea0\u9519\u4e0d\u5e94\u505c\u7559\u5728\u5355\u6b21\u4f1a\u8bdd\uff0c\u800c\u9700\u8981\u53ef\u7248\u672c\u5316\u3001\u53ef\u8ffd\u8e2a\u3001\u53ef\u76d1\u63a7\u548c\u53ef\u9000\u5f79\u7684\u6301\u4e45\u5316\u6cbb\u7406\u673a\u5236\u3002\u4f5c\u8005\u63d0\u51fa\u4ee5\u9519\u8bef\u95ed\u73af\u4e3a\u6838\u5fc3\u7684\u4e03\u9879\u8fd0\u7ef4\u539f\u5219\uff0c\u5e76\u7528\u5b9e\u8df5\u6848\u4f8b\u8bf4\u660e\u89c4\u5219\u82e5\u7f3a\u4e4f\u76d1\u63a7\u53ef\u80fd\u53cd\u8fc7\u6765\u9020\u6210\u539f\u672c\u8981\u907f\u514d\u7684\u4f24\u5bb3\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19125", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4eba\u673a\u534f\u4f5c", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8fd0\u7ef4\u6cbb\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19125v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tuning the Stochastic Machine: A Systems Engineer\u0027s Operating Model for Human-AI Engineering", "tldr": "\u672c\u6587\u5c06LLM\u7cfb\u7edf\u7c7b\u6bd4\u4e3a\u5de5\u7a0b\u5e08\u957f\u671f\u8fd0\u7ef4\u7684\u673a\u5668\uff0c\u6307\u51fa\u4e13\u5bb6\u7ea0\u9519\u4e0d\u5e94\u505c\u7559\u5728\u5355\u6b21\u4f1a\u8bdd\uff0c\u800c\u9700\u8981\u53ef\u7248\u672c\u5316\u3001\u53ef\u8ffd\u8e2a\u3001\u53ef\u76d1\u63a7\u548c\u53ef\u9000\u5f79\u7684\u6301\u4e45\u5316\u6cbb\u7406\u673a\u5236\u3002\u4f5c\u8005\u63d0\u51fa\u4ee5\u9519\u8bef\u95ed\u73af\u4e3a\u6838\u5fc3\u7684\u4e03\u9879\u8fd0\u7ef4\u539f\u5219\uff0c\u5e76\u7528\u5b9e\u8df5\u6848\u4f8b\u8bf4\u660e\u89c4\u5219\u82e5\u7f3a\u4e4f\u76d1\u63a7\u53ef\u80fd\u53cd\u8fc7\u6765\u9020\u6210\u539f\u672c\u8981\u907f\u514d\u7684\u4f24\u5bb3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Improving molecular properties, such as drug-likeness or binding affinity, is a recurring task in early-stage drug discovery. However, molecules optimized in an unconstrained chemical space have limited practical value if they cannot be synthesized. Policy Gradient for Forward Synthesis (PGFS) is a synthesis-aware reinforcement learning method for molecular improvement, but its use of reactant embedding prediction makes reactant selection indirect, which, as we show, limits learning effectiveness. We first develop PGFS+, in which reaction templates and second reactants are represented by trainable embedding lookup tables. Combined with a more effective scoring function and RL algorithm, PGFS+ significantly improves the desired property. However, it exposes a reward-hacking failure mode: a powerful reactant search can map diverse input molecules to the same high-reward magnet molecule, improving the reward while collapsing the output diversity. We therefore introduce PGFS++, a synthesis-aware reinforcement learning framework for input-specific molecular improvement. Given an input molecule, PGFS++ treats it as the start of a forward-synthesis trajectory, applies learned reaction templates with compatible in-stock building blocks, and produces a molecule with improved target properties, an explicit synthesis route, and structural similarity to the input. Experiments on molecular improvement tasks show that PGFS++ improves target properties while preserving high output diversity.", "arxiv_id": "2608.19121", "arxiv_url": "https://arxiv.org/abs/2608.19121", "authors": ["Boqiao Zhang", "Godbless James", "Sai Krishna Gottipati", "Andrew Fitzgibbon"], "brief": "\u672c\u6587\u63d0\u51fa PGFS++\uff0c\u4e00\u79cd\u9762\u5411\u5206\u5b50\u6027\u8d28\u63d0\u5347\u7684\u5408\u6210\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4ece\u8f93\u5165\u5206\u5b50\u51fa\u53d1\u751f\u6210\u524d\u5411\u5408\u6210\u8f68\u8ff9\uff0c\u5e76\u4f7f\u7528\u53ef\u8d2d\u4e70\u780c\u5757\u548c\u53cd\u5e94\u6a21\u677f\u4f18\u5316\u76ee\u6807\u6027\u8d28\u3002\u76f8\u6bd4 PGFS/PGFS+\uff0c\u5b83\u7f13\u89e3\u4e86\u9ad8\u5956\u52b1\u201c\u78c1\u94c1\u5206\u5b50\u201d\u5bfc\u81f4\u7684\u591a\u6837\u6027\u574d\u7f29\uff0c\u5728\u63d0\u5347\u5206\u5b50\u6027\u8d28\u7684\u540c\u65f6\u4fdd\u6301\u7ed3\u6784\u76f8\u4f3c\u6027\u3001\u53ef\u5408\u6210\u6027\u548c\u8f83\u9ad8\u8f93\u51fa\u591a\u6837\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19121", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u5b50\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u836f\u7269\u53d1\u73b0", "\u53ef\u5408\u6210\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19121v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PGFS++: Molecular Property Improvement under Synthesis and Diversity Constraints", "tldr": "\u672c\u6587\u63d0\u51fa PGFS++\uff0c\u4e00\u79cd\u9762\u5411\u5206\u5b50\u6027\u8d28\u63d0\u5347\u7684\u5408\u6210\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4ece\u8f93\u5165\u5206\u5b50\u51fa\u53d1\u751f\u6210\u524d\u5411\u5408\u6210\u8f68\u8ff9\uff0c\u5e76\u4f7f\u7528\u53ef\u8d2d\u4e70\u780c\u5757\u548c\u53cd\u5e94\u6a21\u677f\u4f18\u5316\u76ee\u6807\u6027\u8d28\u3002\u76f8\u6bd4 PGFS/PGFS+\uff0c\u5b83\u7f13\u89e3\u4e86\u9ad8\u5956\u52b1\u201c\u78c1\u94c1\u5206\u5b50\u201d\u5bfc\u81f4\u7684\u591a\u6837\u6027\u574d\u7f29\uff0c\u5728\u63d0\u5347\u5206\u5b50\u6027\u8d28\u7684\u540c\u65f6\u4fdd\u6301\u7ed3\u6784\u76f8\u4f3c\u6027\u3001\u53ef\u5408\u6210\u6027\u548c\u8f83\u9ad8\u8f93\u51fa\u591a\u6837\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Time series imputation is a crucial area for reliable time series analysis, yet it remains challenging due to the complex temporal dynamics and noise of real-world data. Existing approaches, however, exhibit two limitations: missing and observed values are embedded within the same representation space without explicit structural separation, and continuous diffusion-based methods are trained to predict added noise rather than the original signal. To address these, we propose the Masked Diffusion Time-series Imputation Model (MDTIM), which leverages the training paradigm of masked diffusion model for imputation tasks. The MASK token is structurally orthogonal to valid observations, and the model directly predicts the original values, naturally aligning both the representation and the learning objective with the imputation task. To bridge the gap between discrete masked diffusion and the continuous, ordinal nature of time series, we further introduce Stochastic Discretization, which maps continuous values to ordinal-aware tokens while preserving continuous dynamics. Our experiments on diverse benchmarks confirm that MDTIM achieves superior robustness and scalability, consistently outperforming state-of-the-art deterministic and generative baselines across various missing scenarios.", "arxiv_id": "2608.19119", "arxiv_url": "https://arxiv.org/abs/2608.19119", "authors": ["Dongbin Kim", "Seungyun Lee", "Geonwoo Shin", "Jaewook Lee"], "brief": "\u8bba\u6587\u63d0\u51fa MDTIM\uff0c\u7528\u63a9\u7801\u6269\u6563\u8bad\u7ec3\u505a\u65f6\u95f4\u5e8f\u5217\u7f3a\u5931\u503c\u586b\u8865\uff0c\u5c06 MASK \u6807\u8bb0\u4e0e\u771f\u5b9e\u89c2\u6d4b\u5728\u7ed3\u6784\u4e0a\u5206\u79bb\uff0c\u5e76\u76f4\u63a5\u9884\u6d4b\u539f\u59cb\u503c\u800c\u975e\u566a\u58f0\u3002\u4e3a\u9002\u914d\u8fde\u7eed\u65f6\u95f4\u5e8f\u5217\uff0c\u5f15\u5165\u968f\u673a\u79bb\u6563\u5316\u628a\u8fde\u7eed\u503c\u6620\u5c04\u4e3a\u6709\u5e8f token\uff0c\u5728\u591a\u79cd\u7f3a\u5931\u573a\u666f\u4e0b\u4f18\u4e8e\u73b0\u6709\u786e\u5b9a\u6027\u548c\u751f\u6210\u5f0f\u65b9\u6cd5\uff0c\u9c81\u68d2\u6027\u4e0e\u53ef\u6269\u5c55\u6027\u66f4\u597d\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19119", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u7f3a\u5931\u503c\u586b\u8865", "\u6269\u6563\u6a21\u578b", "\u63a9\u7801\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19119v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Discretizing Continuous Time Series for Imputation with Masked Diffusion Training", "tldr": "\u8bba\u6587\u63d0\u51fa MDTIM\uff0c\u7528\u63a9\u7801\u6269\u6563\u8bad\u7ec3\u505a\u65f6\u95f4\u5e8f\u5217\u7f3a\u5931\u503c\u586b\u8865\uff0c\u5c06 MASK \u6807\u8bb0\u4e0e\u771f\u5b9e\u89c2\u6d4b\u5728\u7ed3\u6784\u4e0a\u5206\u79bb\uff0c\u5e76\u76f4\u63a5\u9884\u6d4b\u539f\u59cb\u503c\u800c\u975e\u566a\u58f0\u3002\u4e3a\u9002\u914d\u8fde\u7eed\u65f6\u95f4\u5e8f\u5217\uff0c\u5f15\u5165\u968f\u673a\u79bb\u6563\u5316\u628a\u8fde\u7eed\u503c\u6620\u5c04\u4e3a\u6709\u5e8f token\uff0c\u5728\u591a\u79cd\u7f3a\u5931\u573a\u666f\u4e0b\u4f18\u4e8e\u73b0\u6709\u786e\u5b9a\u6027\u548c\u751f\u6210\u5f0f\u65b9\u6cd5\uff0c\u9c81\u68d2\u6027\u4e0e\u53ef\u6269\u5c55\u6027\u66f4\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-teacher on-policy distillation (M-OPD) has emerged as a promising paradigm for consolidating domain-specialized reinforcement learning (RL) experts into a single generalist student via dense, token-level reward supervision. Despite its practical success, the optimization dynamics governing multi-teacher capability integration remain poorly understood, and open, rigorously reproducible recipes are conspicuously lacking. In this work, we establish a controlled M-OPD benchmark on SmolLM3-3B-Base with oracle routing, isolating capability integration from routing ambiguity. Our investigation reveals a pronounced capability integration gap: standard M-OPD captures only 35.6% of the available headroom relative to a domain-routed oracle ensemble, with concise tasks such as instruction following suffering severe degradation and premature stagnation. Crucially, we show that this failure stems not from gradient conflict, but from a severe misallocation of the token-level optimization budget. This pathology is driven by three orthogonal factors: structural sequence-length disparities across domains, dynamic convergence drift due to non-uniform learning rates, and multi-step reward staleness from asynchronous policy updates. To resolve these imbalances, we introduce Open-MOPD, a principled framework incorporating token-share balancing, gap-aware dynamic budget allocation, and student reward refresh. Together, these mechanisms systematically restore cross-domain balance, elevating headroom recovery from 35.6% to 83.4% in a single deployable student. We fully open-source our end-to-end post-training recipe, training trajectories, and evaluation suites on an academically accessible hardware budget.", "arxiv_id": "2608.19098", "arxiv_url": "https://arxiv.org/abs/2608.19098", "authors": ["Huan-ang Gao", "Haohan Chi", "Yong Yan", "Shiyuan Feng", "Hanlin Wu", "Zheng Jiang", "Bingxiang He", "Wei-Ying Ma", "Ya-Qin Zhang", "Hao Zhou"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53ef\u590d\u73b0\u7684\u591a\u6559\u5e08 on-policy \u84b8\u998f\u57fa\u51c6\uff0c\u53d1\u73b0\u6807\u51c6\u65b9\u6cd5\u53ea\u80fd\u6062\u590d\u76f8\u5bf9\u8def\u7531\u4e13\u5bb6\u96c6\u6210\u7ea635.6%\u7684\u80fd\u529b\u63d0\u5347\uff0c\u4e3b\u8981\u95ee\u9898\u4e0d\u662f\u68af\u5ea6\u51b2\u7a81\uff0c\u800c\u662f token \u7ea7\u4f18\u5316\u9884\u7b97\u5728\u4e0d\u540c\u9886\u57df\u95f4\u4e25\u91cd\u5931\u8861\u3002\u4f5c\u8005\u63d0\u51fa Open-MOPD\uff0c\u901a\u8fc7 token \u4efd\u989d\u5747\u8861\u3001\u6309\u80fd\u529b\u5dee\u8ddd\u52a8\u6001\u5206\u914d\u9884\u7b97\u548c\u5237\u65b0\u5b66\u751f\u5956\u52b1\uff0c\u5c06\u80fd\u529b\u6062\u590d\u63d0\u5347\u523083.4%\uff0c\u5e76\u5f00\u6e90\u5b8c\u6574\u8bad\u7ec3\u914d\u65b9\u4e0e\u8bc4\u6d4b\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19098", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19098v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Open-MOPD: Diagnosing and Fixing Capability Imbalance in Multi-Teacher On-Policy Distillation", "tldr": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53ef\u590d\u73b0\u7684\u591a\u6559\u5e08 on-policy \u84b8\u998f\u57fa\u51c6\uff0c\u53d1\u73b0\u6807\u51c6\u65b9\u6cd5\u53ea\u80fd\u6062\u590d\u76f8\u5bf9\u8def\u7531\u4e13\u5bb6\u96c6\u6210\u7ea635.6%\u7684\u80fd\u529b\u63d0\u5347\uff0c\u4e3b\u8981\u95ee\u9898\u4e0d\u662f\u68af\u5ea6\u51b2\u7a81\uff0c\u800c\u662f token \u7ea7\u4f18\u5316\u9884\u7b97\u5728\u4e0d\u540c\u9886\u57df\u95f4\u4e25\u91cd\u5931\u8861\u3002\u4f5c\u8005\u63d0\u51fa Open-MOPD\uff0c\u901a\u8fc7 token \u4efd\u989d\u5747\u8861\u3001\u6309\u80fd\u529b\u5dee\u8ddd\u52a8\u6001\u5206\u914d\u9884\u7b97\u548c\u5237\u65b0\u5b66\u751f\u5956\u52b1\uff0c\u5c06\u80fd\u529b\u6062\u590d\u63d0\u5347\u523083.4%\uff0c\u5e76\u5f00\u6e90\u5b8c\u6574\u8bad\u7ec3\u914d\u65b9\u4e0e\u8bc4\u6d4b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Object detection models deployed in safety-critical applications remain vulnerable to backdoor attacks that cause targeted misbehaviors when a hidden trigger is present. Existing detection methods either rely on trigger inversion or exploit architecture-specific assumptions, and critically, representative existing methods fail to generalize reliably to scene-level attacks, where a single trigger induces anomalous behavior across all objects in the scene simultaneously. We present DistScan, a backdoor detection framework based on a simple but previously unexploited observation: backdoor injection systematically shifts a model\u0027s pre-NMS prediction class distribution away from its training class frequencies, even on clean inputs without any trigger present. DistScan aggregates intermediate class predictions over a clean validation set and flags a model as backdoored if the resulting distribution deviates significantly from the training class frequencies, requiring no model weight access, no trigger knowledge, and no additional training. Extensive experiments on MS-COCO and PASCAL VOC across two architectures and three scene-level attack scenarios demonstrate that DistScan substantially outperforms existing methods, improving average detection accuracy over the best-performing applicable baseline by 27.32 percentage points.", "arxiv_id": "2608.19088", "arxiv_url": "https://arxiv.org/abs/2608.19088", "authors": ["Longtian Wang", "Zhengyu Zhao", "Chenhao Lin", "Le Yang", "Shiwei Wang", "Yuhan Zhi", "Xiaofei Xie", "Chao Shen"], "brief": "\u8bba\u6587\u63d0\u51fa DistScan\uff0c\u7528\u76ee\u6807\u68c0\u6d4b\u6a21\u578b\u5728\u5e72\u51c0\u9a8c\u8bc1\u96c6\u4e0a\u7684 NMS \u524d\u7c7b\u522b\u9884\u6d4b\u5206\u5e03\u76f8\u5bf9\u8bad\u7ec3\u7c7b\u522b\u9891\u7387\u7684\u504f\u79fb\u6765\u68c0\u6d4b\u540e\u95e8\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u6a21\u578b\u6743\u91cd\u3001\u89e6\u53d1\u5668\u77e5\u8bc6\u6216\u989d\u5916\u8bad\u7ec3\uff0c\u5728 COCO/VOC\u3001\u591a\u67b6\u6784\u548c\u573a\u666f\u7ea7\u653b\u51fb\u4e0b\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e73\u5747\u68c0\u6d4b\u51c6\u786e\u7387\u63d0\u5347 27.32 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19088", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u540e\u95e8\u68c0\u6d4b", "\u76ee\u6807\u68c0\u6d4b", "\u6a21\u578b\u5b89\u5168", "\u5206\u5e03\u504f\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19088v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Detecting Backdoors in Object Detection via Pre-NMS Prediction Distribution Shift", "tldr": "\u8bba\u6587\u63d0\u51fa DistScan\uff0c\u7528\u76ee\u6807\u68c0\u6d4b\u6a21\u578b\u5728\u5e72\u51c0\u9a8c\u8bc1\u96c6\u4e0a\u7684 NMS \u524d\u7c7b\u522b\u9884\u6d4b\u5206\u5e03\u76f8\u5bf9\u8bad\u7ec3\u7c7b\u522b\u9891\u7387\u7684\u504f\u79fb\u6765\u68c0\u6d4b\u540e\u95e8\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u6a21\u578b\u6743\u91cd\u3001\u89e6\u53d1\u5668\u77e5\u8bc6\u6216\u989d\u5916\u8bad\u7ec3\uff0c\u5728 COCO/VOC\u3001\u591a\u67b6\u6784\u548c\u573a\u666f\u7ea7\u653b\u51fb\u4e0b\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e73\u5747\u68c0\u6d4b\u51c6\u786e\u7387\u63d0\u5347 27.32 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Anticipating how scenes evolve under ego actions is fundamental to safe autonomous driving, yet the full potential of world models for decision-making remains unrealized. The critical challenge lies in ensuring that future modeling is not merely predictive, but decision-informative: the predicted future must directly shape which trajectory is selected. Existing approaches decouple future representation learning from planning optimization, or share predicted states across trajectory candidates, thereby diluting the action-specific consequences that ought to guide selection. To bridge this gap, we propose DA-WAM, a framework that unifies predictive representation learning, action-conditioned future modeling, and trajectory scoring under a single decision-making objective. DA-WAM maintains predictive supervision throughout planner optimization via an online encoder and a stable momentum target, allowing future representations to co-evolve with the driving task. An action-conditioned predictor generates a distinct future latent state per trajectory candidate, which is then evaluated by a future-latent-conditioned factorized scorer. For the expert-matched trajectory, the predicted future latent is supervised by the observed future representation, while safety-critical hard negatives provide additional supervision near planning boundaries. Extensive experiments on NAVSIM-v1 and NAVSIM-v2 demonstrate state-of-the-art performance, while ablations and diagnostic analyses validate the key components.", "arxiv_id": "2608.19085", "arxiv_url": "https://arxiv.org/abs/2608.19085", "authors": ["Ruiguo Zhong", "Benshan Ma", "Xiaolong Chen", "Lang Zhang", "Mingyue Feng", "Yaonong Wang", "Pei Liu", "Jun Ma"], "brief": "\u672c\u6587\u63d0\u51fa DA-WAM\uff0c\u5c06\u9884\u6d4b\u8868\u5f81\u5b66\u4e60\u3001\u52a8\u4f5c\u6761\u4ef6\u672a\u6765\u5efa\u6a21\u4e0e\u8f68\u8ff9\u6253\u5206\u7edf\u4e00\u5230\u540c\u4e00\u4e2a\u81ea\u52a8\u9a7e\u9a76\u51b3\u7b56\u76ee\u6807\u4e2d\uff0c\u4f7f\u672a\u6765\u6f5c\u53d8\u91cf\u76f4\u63a5\u670d\u52a1\u4e8e\u8f68\u8ff9\u9009\u62e9\u3002\u65b9\u6cd5\u4e3a\u6bcf\u4e2a\u5019\u9009\u8f68\u8ff9\u751f\u6210\u72ec\u7acb\u7684\u672a\u6765\u6f5c\u5728\u72b6\u6001\uff0c\u5e76\u7ed3\u5408\u4e13\u5bb6\u8f68\u8ff9\u76d1\u7763\u4e0e\u5b89\u5168\u5173\u952e\u8d1f\u6837\u672c\uff0c\u5728 NAVSIM-v1/v2 \u4e0a\u53d6\u5f97\u6700\u5148\u8fdb\u6027\u80fd\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19085", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u4e16\u754c\u6a21\u578b", "\u8f68\u8ff9\u89c4\u5212", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19085v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DA-WAM: Decision-Aligned Future Latents for Driving World Models", "tldr": "\u672c\u6587\u63d0\u51fa DA-WAM\uff0c\u5c06\u9884\u6d4b\u8868\u5f81\u5b66\u4e60\u3001\u52a8\u4f5c\u6761\u4ef6\u672a\u6765\u5efa\u6a21\u4e0e\u8f68\u8ff9\u6253\u5206\u7edf\u4e00\u5230\u540c\u4e00\u4e2a\u81ea\u52a8\u9a7e\u9a76\u51b3\u7b56\u76ee\u6807\u4e2d\uff0c\u4f7f\u672a\u6765\u6f5c\u53d8\u91cf\u76f4\u63a5\u670d\u52a1\u4e8e\u8f68\u8ff9\u9009\u62e9\u3002\u65b9\u6cd5\u4e3a\u6bcf\u4e2a\u5019\u9009\u8f68\u8ff9\u751f\u6210\u72ec\u7acb\u7684\u672a\u6765\u6f5c\u5728\u72b6\u6001\uff0c\u5e76\u7ed3\u5408\u4e13\u5bb6\u8f68\u8ff9\u76d1\u7763\u4e0e\u5b89\u5168\u5173\u952e\u8d1f\u6837\u672c\uff0c\u5728 NAVSIM-v1/v2 \u4e0a\u53d6\u5f97\u6700\u5148\u8fdb\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large vision-language models (LVLMs) often hallucinate, generating content that the input image does not support. Preventing such content during decoding calls for a candidate-specific measure of how strongly the image supports the token under consideration. The model\u0027s visual-token states offer a natural source of this evidence because projecting each state through the output head reveals which vocabulary items that position favors. These position-wise readouts cannot be pooled directly because their probability magnitudes are not comparable across visual positions. Vocabulary ranks provide a scale-invariant basis for pooling, but tokens still differ systematically in their typical rank-based evidence. We propose ReWEIGH, a training-free decoding intervention that aggregates these ranks across visual positions and compares each candidate with a token-specific reference estimated from unlabeled images. At inference, ReWEIGH caches the image evidence during prefill and applies a bounded penalty only to candidates that fall below their reference. On four 7B backbones, ReWEIGH reduces hallucinated object mentions by up to 21.3% while largely preserving or improving descriptive and general performance. With evidence cached, the average added latency is 1.33% per token, and the reductions extend across six architecture families to 32B parameters.", "arxiv_id": "2608.19075", "arxiv_url": "https://arxiv.org/abs/2608.19075", "authors": ["Jihae Jeong", "Junha Choi", "Hwanjo Yu"], "brief": "\u8bba\u6587\u63d0\u51fa ReWEIGH\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u89e3\u7801\u5e72\u9884\u65b9\u6cd5\uff0c\u901a\u8fc7\u805a\u5408\u89c6\u89c9\u4f4d\u7f6e\u4e0a\u5019\u9009 token \u7684\u5e8f\u6570\u8bc1\u636e\uff0c\u5e76\u4e0e\u57fa\u4e8e\u65e0\u6807\u6ce8\u56fe\u50cf\u4f30\u8ba1\u7684 token \u7279\u5b9a\u53c2\u8003\u503c\u6bd4\u8f83\uff0c\u6765\u6291\u5236\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5e7b\u89c9\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u4e2a 7B \u9aa8\u5e72\u4e0a\u6700\u591a\u51cf\u5c11 21.3% \u7684\u5e7b\u89c9\u7269\u4f53\u63d0\u53ca\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u6216\u63d0\u5347\u63cf\u8ff0\u4e0e\u901a\u7528\u6027\u80fd\uff0c\u989d\u5916\u89e3\u7801\u5ef6\u8fdf\u7ea6 1.33%\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19075", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9\u6291\u5236", "\u89e3\u7801\u7b56\u7565"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19075v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReWEIGH the Evidence: Calibrating Token-Level Ordinal Visual Evidence to Mitigate Hallucinations in Large Vision-Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa ReWEIGH\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u89e3\u7801\u5e72\u9884\u65b9\u6cd5\uff0c\u901a\u8fc7\u805a\u5408\u89c6\u89c9\u4f4d\u7f6e\u4e0a\u5019\u9009 token \u7684\u5e8f\u6570\u8bc1\u636e\uff0c\u5e76\u4e0e\u57fa\u4e8e\u65e0\u6807\u6ce8\u56fe\u50cf\u4f30\u8ba1\u7684 token \u7279\u5b9a\u53c2\u8003\u503c\u6bd4\u8f83\uff0c\u6765\u6291\u5236\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5e7b\u89c9\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u4e2a 7B \u9aa8\u5e72\u4e0a\u6700\u591a\u51cf\u5c11 21.3% \u7684\u5e7b\u89c9\u7269\u4f53\u63d0\u53ca\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u6216\u63d0\u5347\u63cf\u8ff0\u4e0e\u901a\u7528\u6027\u80fd\uff0c\u989d\u5916\u89e3\u7801\u5ef6\u8fdf\u7ea6 1.33%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An agent still learning its environment should be cautious while ignorant and bold once confident. The entropic value-at-risk captures this through a robust-optimization identity---a confidence level fixes the radius of a relative-entropy ball of alternative models---but that ball cannot reach catastrophes the nominal deems impossible, precisely what a safe agent must hedge. We instead use an optimal-transport ball and study the coherent risk measure it induces, the Wasserstein entropic value-at-risk. It has a variational dual mirroring the entropic formula (an inverse temperature becomes a transport price), occupies a definite place in the risk hierarchy, and provably accounts for the reachable catastrophes the entropic measure ignores; we verify both dualities numerically. Driving the transport radius by belief entropy then yields a closed-form robust dynamic-programming operator whose caution contracts as the belief sharpens, with a certified safety sandwich and a sharp safety switch.", "arxiv_id": "2608.19073", "arxiv_url": "https://arxiv.org/abs/2608.19073", "authors": ["Deep Kumar Ganguly", "Jan K\u0159et\u00ednsk\u00fd"], "brief": "\u8bba\u6587\u63d0\u51fa Wasserstein \u7248\u7684\u71b5\u98ce\u9669\u4ef7\u503c\uff08WEVaR\uff09\uff0c\u7528\u6700\u4f18\u4f20\u8f93\u7403\u66ff\u4ee3\u76f8\u5bf9\u71b5\u7403\uff0c\u4ece\u800c\u80fd\u8986\u76d6\u540d\u4e49\u6a21\u578b\u8ba4\u4e3a\u4e0d\u53ef\u80fd\u4f46\u53ef\u8fbe\u7684\u707e\u96be\u4e8b\u4ef6\u3002\u4f5c\u8005\u7ed9\u51fa\u53d8\u5206\u5bf9\u5076\u3001\u98ce\u9669\u5c42\u7ea7\u5173\u7cfb\u4e0e\u6570\u503c\u9a8c\u8bc1\uff0c\u5e76\u5c06\u4f20\u8f93\u534a\u5f84\u4e0e\u4fe1\u5ff5\u71b5\u8054\u52a8\uff0c\u5f97\u5230\u968f\u4fe1\u5ff5\u53d8\u6e05\u6670\u800c\u81ea\u52a8\u964d\u4f4e\u4fdd\u5b88\u6027\u7684\u9c81\u68d2\u52a8\u6001\u89c4\u5212\u7b97\u5b50\u3002", "categories": ["cs.AI", "cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19073", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u9c81\u68d2\u4f18\u5316", "\u98ce\u9669\u5ea6\u91cf", "\u6700\u4f18\u4f20\u8f93", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19073v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Robust Risk Under Evolving Uncertainty: A Wasserstein Counterpart of the Entropic Value-at-Risk", "tldr": "\u8bba\u6587\u63d0\u51fa Wasserstein \u7248\u7684\u71b5\u98ce\u9669\u4ef7\u503c\uff08WEVaR\uff09\uff0c\u7528\u6700\u4f18\u4f20\u8f93\u7403\u66ff\u4ee3\u76f8\u5bf9\u71b5\u7403\uff0c\u4ece\u800c\u80fd\u8986\u76d6\u540d\u4e49\u6a21\u578b\u8ba4\u4e3a\u4e0d\u53ef\u80fd\u4f46\u53ef\u8fbe\u7684\u707e\u96be\u4e8b\u4ef6\u3002\u4f5c\u8005\u7ed9\u51fa\u53d8\u5206\u5bf9\u5076\u3001\u98ce\u9669\u5c42\u7ea7\u5173\u7cfb\u4e0e\u6570\u503c\u9a8c\u8bc1\uff0c\u5e76\u5c06\u4f20\u8f93\u534a\u5f84\u4e0e\u4fe1\u5ff5\u71b5\u8054\u52a8\uff0c\u5f97\u5230\u968f\u4fe1\u5ff5\u53d8\u6e05\u6670\u800c\u81ea\u52a8\u964d\u4f4e\u4fdd\u5b88\u6027\u7684\u9c81\u68d2\u52a8\u6001\u89c4\u5212\u7b97\u5b50\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents can now post-train an LLM end-to-end. They can write code, launch training, evaluate checkpoints, and improve downstream performance, raising the prospect of AI-for-AI. We argue that this picture conflates two distinct capabilities: execution-level capability, iterating within a selected training strategy; and strategy-level capability, revising the high-level judgment as experimental evidence accumulates. Analyzing a large corpus of publicly released post-training trajectories, we find that across different tasks, the agent\u0027s training strategy is locked in at the very beginning, and the entire remaining budget is spent on local adjustments within the selected strategy. We then examine three natural explanations--missing experience, missing guidance, and insufficient reasoning--with escalating interventions. Extensive experiments show that (1) an experience-driven scaffold improves execution across the board (+12.6 points on GSM8K and +40.8 on HumanEval) but leaves the strategy static; (2) human guidance effectively redirects the initial strategy, yet the agent falls back into local adjustment loops once training starts; and (3) additional inference compute pays off on easier tasks but yields almost no gain on the hardest one. In conclusion, what agents lack is neither experience, guidance, nor reasoning compute, but a mechanism for spontaneously reevaluating their strategy during execution.", "arxiv_id": "2608.19072", "arxiv_url": "https://arxiv.org/abs/2608.19072", "authors": ["Joy Jia Yin Lim", "Xin Huang", "Hao Peng", "Yaxi Lu", "Xin Cong", "Zhong Zhang", "Maosong Sun", "Yankai Lin"], "brief": "\u672c\u6587\u5b9e\u8bc1\u5206\u6790\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u8fdb\u884c\u7aef\u5230\u7aef\u540e\u8bad\u7ec3\u65f6\u7684\u80fd\u529b\u8fb9\u754c\uff0c\u533a\u5206\u4e86\u6267\u884c\u5c42\u9762\u7684\u5c40\u90e8\u8fed\u4ee3\u80fd\u529b\u4e0e\u7b56\u7565\u5c42\u9762\u7684\u52a8\u6001\u4fee\u6b63\u80fd\u529b\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u667a\u80fd\u4f53\u901a\u5e38\u5728\u4e00\u5f00\u59cb\u5c31\u9501\u5b9a\u8bad\u7ec3\u7b56\u7565\uff0c\u540e\u7eed\u4e3b\u8981\u505a\u5c40\u90e8\u8c03\u6574\uff1b\u7ecf\u9a8c\u811a\u624b\u67b6\u3001\u4eba\u7c7b\u6307\u5bfc\u548c\u66f4\u591a\u63a8\u7406\u7b97\u529b\u867d\u80fd\u6539\u5584\u90e8\u5206\u8868\u73b0\uff0c\u4f46\u90fd\u65e0\u6cd5\u8ba9\u5176\u5728\u6267\u884c\u4e2d\u81ea\u53d1\u91cd\u65b0\u8bc4\u4f30\u7b56\u7565\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19072", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u540e\u8bad\u7ec3", "\u7b56\u7565\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19072v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What is Missing from AI Post-Training AI: An Empirical Analysis", "tldr": "\u672c\u6587\u5b9e\u8bc1\u5206\u6790\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u8fdb\u884c\u7aef\u5230\u7aef\u540e\u8bad\u7ec3\u65f6\u7684\u80fd\u529b\u8fb9\u754c\uff0c\u533a\u5206\u4e86\u6267\u884c\u5c42\u9762\u7684\u5c40\u90e8\u8fed\u4ee3\u80fd\u529b\u4e0e\u7b56\u7565\u5c42\u9762\u7684\u52a8\u6001\u4fee\u6b63\u80fd\u529b\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u667a\u80fd\u4f53\u901a\u5e38\u5728\u4e00\u5f00\u59cb\u5c31\u9501\u5b9a\u8bad\u7ec3\u7b56\u7565\uff0c\u540e\u7eed\u4e3b\u8981\u505a\u5c40\u90e8\u8c03\u6574\uff1b\u7ecf\u9a8c\u811a\u624b\u67b6\u3001\u4eba\u7c7b\u6307\u5bfc\u548c\u66f4\u591a\u63a8\u7406\u7b97\u529b\u867d\u80fd\u6539\u5584\u90e8\u5206\u8868\u73b0\uff0c\u4f46\u90fd\u65e0\u6cd5\u8ba9\u5176\u5728\u6267\u884c\u4e2d\u81ea\u53d1\u91cd\u65b0\u8bc4\u4f30\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper proposes a lightweight, plug-and-play framework that improves robustness to viewpoint shifts in Vision-Language-Action (VLA) policies without policy retraining. To our knowledge, this is the first approach to directly leverage 3D Gaussian-based novel-view synthesis for observation-space adaptation in VLA policies. Current VLA performance relies on the implicit assumption that training and deployment camera configurations are identical. Our experiments show that even a small displacement of the camera mount can reduce the success rate on the LIBERO benchmark from about 90% to about 10% in the worst case. Prior approaches, such as large-scale fine-tuning or generative data augmentation, are computationally expensive and risk catastrophic forgetting. To address this, viewpoint shifts are reformulated as a localized novel-view synthesis problem. Under a Locality assumption, that camera perturbations remain within a small bounded region relative to the workspace, viewpoint normalization reduces to a scene- and policy-independent disocclusion task. Our work implements this idea with a 4M-parameter 3D-Gaussian canonicalizer prepended to a frozen VLA policy. Without modifying policy weights, GS-VLA improves performance across three orthogonal axes: (1) Policy architectures, (2) Unseen task suites, and (3) Perturbation scales. These results show that a lightweight visual module can recover a large fraction of the performance lost under viewpoint shift, without policy retraining.", "arxiv_id": "2608.19066", "arxiv_url": "https://arxiv.org/abs/2608.19066", "authors": ["Yechan Park", "HyunJin Kim"], "brief": "\u672c\u6587\u63d0\u51fa GS-VLA\uff0c\u7528\u4e00\u4e2a 400 \u4e07\u53c2\u6570\u7684 3D Gaussian \u89c6\u89d2\u89c4\u8303\u5316\u6a21\u5757\u63a5\u5728\u51bb\u7ed3\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u524d\uff0c\u901a\u8fc7\u65b0\u89c6\u89d2\u5408\u6210\u7f13\u89e3\u76f8\u673a\u89c6\u89d2\u504f\u79fb\u3002\u65e0\u9700\u91cd\u8bad\u7ec3\u7b56\u7565\uff0c\u5373\u53ef\u5728\u4e0d\u540c\u7b56\u7565\u67b6\u6784\u3001\u672a\u89c1\u4efb\u52a1\u548c\u6270\u52a8\u5c3a\u5ea6\u4e0b\u6062\u590d\u5927\u91cf\u56e0\u89c6\u89d2\u53d8\u5316\u635f\u5931\u7684\u6210\u529f\u7387\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19066", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u667a\u80fd\u4f53", "\u4e09\u7ef4\u91cd\u5efa", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19066v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GS-VLA: Plug-and-Play Viewpoint Canonicalization for Frozen VLA Policies via Gaussian Splatting", "tldr": "\u672c\u6587\u63d0\u51fa GS-VLA\uff0c\u7528\u4e00\u4e2a 400 \u4e07\u53c2\u6570\u7684 3D Gaussian \u89c6\u89d2\u89c4\u8303\u5316\u6a21\u5757\u63a5\u5728\u51bb\u7ed3\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u524d\uff0c\u901a\u8fc7\u65b0\u89c6\u89d2\u5408\u6210\u7f13\u89e3\u76f8\u673a\u89c6\u89d2\u504f\u79fb\u3002\u65e0\u9700\u91cd\u8bad\u7ec3\u7b56\u7565\uff0c\u5373\u53ef\u5728\u4e0d\u540c\u7b56\u7565\u67b6\u6784\u3001\u672a\u89c1\u4efb\u52a1\u548c\u6270\u52a8\u5c3a\u5ea6\u4e0b\u6062\u590d\u5927\u91cf\u56e0\u89c6\u89d2\u53d8\u5316\u635f\u5931\u7684\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present Eureka, a task-conditioned Meta-Agent architecture that compiles long-horizon tasks into dynamic obligation graphs with explicit acceptance semantics. During execution, Eureka forms Macro-Agents with specialized state, memory, operators, tools, verifiers, and local topology via receding-horizon planning, architecture promotion, and minimal-sufficient compilation. When bottlenecks recur, cost-benefit-gated evolution updates the local architecture under constraints. Theoretically, we establish results on regret, planning invalidation, amortization, subtree interfaces, serializability, and verification. Experimentally, Eureka completes 170/170 recursive tasks and generates 3,948 certificates with no false acceptances. Active context compresses median input from 9,490 to 4,005 tokens; incremental processing avoids 65.38% recomputation across 12,000 tasks; 16,000 concurrent executions serialize consistently. The same Meta-Agent instantiates a Theory-Discovery Agent and a Math/Conjecture Agent. The former yields structural results in quantum-process and spacetime theory. The latter identifies bottlenecks in Riemann Hypothesis research and advances a positivity certificate for Suzuki\u0027s localized Weil quadratic form to 0 \u003c a \u003c= 69/200 = 0.345, reaching ~99.55% of (log 2)/2. These results suggest that scientific-agent capability depends not only on the base model but on whether an architecture can be formed to match the task\u0027s cognitive structure.", "arxiv_id": "2608.19047", "arxiv_url": "https://arxiv.org/abs/2608.19047", "authors": ["Alizer Wong", "Heng Cui", "Yi Tan", "Xiongchao Zhan", "Liang Lin", "Yuxiang Guo", "Zhaorong Dai", "Zixin Zeng", "Wenyuan Li"], "brief": "\u8bba\u6587\u63d0\u51fa Eureka\uff0c\u4e00\u79cd\u6309\u4efb\u52a1\u6761\u4ef6\u5316\u7684\u5143\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u53ef\u5c06\u957f\u7a0b\u79d1\u5b66\u53d1\u73b0\u4efb\u52a1\u7f16\u8bd1\u4e3a\u5e26\u9a8c\u6536\u8bed\u4e49\u7684\u52a8\u6001\u4e49\u52a1\u56fe\uff0c\u5e76\u5728\u6267\u884c\u4e2d\u7ec4\u7ec7\u5177\u5907\u4e13\u95e8\u72b6\u6001\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u548c\u9a8c\u8bc1\u5668\u7684\u5b8f\u667a\u80fd\u4f53\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5b8c\u6210 170/170 \u4e2a\u9012\u5f52\u4efb\u52a1\u3001\u751f\u6210 3948 \u4e2a\u65e0\u8bef\u63a5\u6536\u8bc1\u4e66\uff0c\u5e76\u663e\u8457\u538b\u7f29\u4e0a\u4e0b\u6587\u4e0e\u51cf\u5c11\u91cd\u590d\u8ba1\u7b97\uff1b\u540c\u65f6\u5c55\u793a\u4e86\u5728\u7406\u8bba\u53d1\u73b0\u548c\u6570\u5b66\u731c\u60f3\u7814\u7a76\u4e2d\u7684\u5e94\u7528\u3002", "categories": ["cs.AI", "math.NT"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19047", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u53d1\u73b0", "\u5143\u5b66\u4e60", "\u81ea\u52a8\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19047v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Eureka: Task-Conditioned Meta-Agent Orchestration for Scientific Discovery", "tldr": "\u8bba\u6587\u63d0\u51fa Eureka\uff0c\u4e00\u79cd\u6309\u4efb\u52a1\u6761\u4ef6\u5316\u7684\u5143\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u53ef\u5c06\u957f\u7a0b\u79d1\u5b66\u53d1\u73b0\u4efb\u52a1\u7f16\u8bd1\u4e3a\u5e26\u9a8c\u6536\u8bed\u4e49\u7684\u52a8\u6001\u4e49\u52a1\u56fe\uff0c\u5e76\u5728\u6267\u884c\u4e2d\u7ec4\u7ec7\u5177\u5907\u4e13\u95e8\u72b6\u6001\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u548c\u9a8c\u8bc1\u5668\u7684\u5b8f\u667a\u80fd\u4f53\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5b8c\u6210 170/170 \u4e2a\u9012\u5f52\u4efb\u52a1\u3001\u751f\u6210 3948 \u4e2a\u65e0\u8bef\u63a5\u6536\u8bc1\u4e66\uff0c\u5e76\u663e\u8457\u538b\u7f29\u4e0a\u4e0b\u6587\u4e0e\u51cf\u5c11\u91cd\u590d\u8ba1\u7b97\uff1b\u540c\u65f6\u5c55\u793a\u4e86\u5728\u7406\u8bba\u53d1\u73b0\u548c\u6570\u5b66\u731c\u60f3\u7814\u7a76\u4e2d\u7684\u5e94\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Bernstein-Vazirani Networks (BVNs), a non-variational quantum machine learning framework that leverages quantum interference for supervised learning, demonstrated on vision and representation learning tasks. In their standard form, BVNs follow the principle of quantum Fourier sampling: labelled data are placed in superposition and interfered in the Fourier basis to extract globally informative features. We then define generalised BVNs that enable interference in problem-adapted bases, yielding more expressive models under the same measurement budget as in the standard setting. BVNs achieve universal function approximation through (over)complete interference bases, while training of BVNs is gradient-free. Experiments on synthetic and real-world classification tasks, as well as implicit image representation, show strong generalisation capabilities and competitive performance with classical and quantum baselines.", "arxiv_id": "2608.19043", "arxiv_url": "https://arxiv.org/abs/2608.19043", "authors": ["Natacha Kuete Meli", "Tolga Birdal", "Prayag Tiwari", "Vladislav Golyanik", "Michael Moeller"], "brief": "\u8bba\u6587\u63d0\u51fa Bernstein-Vazirani Networks\uff0c\u4e00\u79cd\u975e\u53d8\u5206\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u5c06\u6807\u6ce8\u6570\u636e\u7f6e\u4e8e\u53e0\u52a0\u6001\u5e76\u5728\u5085\u91cc\u53f6\u6216\u4efb\u52a1\u81ea\u9002\u5e94\u57fa\u4e2d\u5e72\u6d89\u6765\u63d0\u53d6\u5168\u5c40\u7279\u5f81\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u68af\u5ea6\u8bad\u7ec3\uff0c\u5728\u5206\u7c7b\u548c\u9690\u5f0f\u56fe\u50cf\u8868\u793a\u4efb\u52a1\u4e0a\u8868\u73b0\u51fa\u8f83\u5f3a\u6cdb\u5316\u80fd\u529b\uff0c\u5e76\u4e0e\u7ecf\u5178\u53ca\u91cf\u5b50\u57fa\u7ebf\u5177\u6709\u7ade\u4e89\u529b\u3002", "categories": ["quant-ph", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19043", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u76d1\u7763\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19043v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bernstein-Vazirani Networks: Quantum Machine Learning by Interference", "tldr": "\u8bba\u6587\u63d0\u51fa Bernstein-Vazirani Networks\uff0c\u4e00\u79cd\u975e\u53d8\u5206\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u5c06\u6807\u6ce8\u6570\u636e\u7f6e\u4e8e\u53e0\u52a0\u6001\u5e76\u5728\u5085\u91cc\u53f6\u6216\u4efb\u52a1\u81ea\u9002\u5e94\u57fa\u4e2d\u5e72\u6d89\u6765\u63d0\u53d6\u5168\u5c40\u7279\u5f81\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u68af\u5ea6\u8bad\u7ec3\uff0c\u5728\u5206\u7c7b\u548c\u9690\u5f0f\u56fe\u50cf\u8868\u793a\u4efb\u52a1\u4e0a\u8868\u73b0\u51fa\u8f83\u5f3a\u6cdb\u5316\u80fd\u529b\uff0c\u5e76\u4e0e\u7ecf\u5178\u53ca\u91cf\u5b50\u57fa\u7ebf\u5177\u6709\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual Counterfactual Explanations (VCEs) aim to explain image classifiers by generating minimally edited and realistic versions of an input image that change the classifier\u0027s prediction. Existing VCE methods are inherently classifier-dependent and therefore susceptible to classifier biases and failure modes, such as sensitivity to shortcut features and calibration errors. In this paper, we propose a classifier-free approach for visual counterfactual generation based on Contrastive Analysis (CA). Given two datasets corresponding to different classes (e.g., healthy and patients), we disentangle the generative factors that are common across the two datasets from those that are salient to each dataset, and generate counterfactual images by swapping only the salient factors. By operating directly on data distributions rather than decision boundaries, our method provides model-agnostic VCEs that are less sensitive to classifier biases. Our approach leverages the high-quality synthesis and well-structured latent space of StyleGAN2. We use the feature space F, instead than the usual W-space, to improve detail preservation. Unlike conventional CA approaches, which typically assume salient factors in only one dataset, we introduce an adapted framework and loss functions for VCE that allow multiple salient factors in each dataset. We evaluate our method on three medical imaging datasets and demonstrate superior counterfactual generation quality compared to existing approaches.", "arxiv_id": "2608.19032", "arxiv_url": "https://arxiv.org/abs/2608.19032", "authors": ["Yunlong He", "Pietro Gori"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u4f9d\u8d56\u5206\u7c7b\u5668\u7684\u89c6\u89c9\u53cd\u4e8b\u5b9e\u89e3\u91ca\u65b9\u6cd5\uff0c\u57fa\u4e8e\u5bf9\u6bd4\u5206\u6790\u5c06\u4e24\u7c7b\u6570\u636e\u4e2d\u7684\u5171\u6709\u751f\u6210\u56e0\u7d20\u4e0e\u5404\u81ea\u663e\u8457\u56e0\u7d20\u89e3\u8026\uff0c\u5e76\u901a\u8fc7\u4ea4\u6362\u663e\u8457\u56e0\u7d20\u751f\u6210\u53cd\u4e8b\u5b9e\u56fe\u50cf\u3002\u8be5\u65b9\u6cd5\u5229\u7528 StyleGAN2 \u7684\u7279\u5f81\u7a7a\u95f4\u63d0\u5347\u7ec6\u8282\u4fdd\u771f\u5ea6\uff0c\u5728\u4e09\u4e2a\u533b\u5b66\u5f71\u50cf\u6570\u636e\u96c6\u4e0a\u751f\u6210\u8d28\u91cf\u4f18\u4e8e\u73b0\u6709\u53cd\u4e8b\u5b9e\u89e3\u91ca\u65b9\u6cd5\uff0c\u4e14\u66f4\u4e0d\u6613\u53d7\u5206\u7c7b\u5668\u504f\u5dee\u5f71\u54cd\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19032", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53cd\u4e8b\u5b9e\u89e3\u91ca", "\u751f\u6210\u6a21\u578b", "\u533b\u5b66\u5f71\u50cf", "\u53ef\u89e3\u91ca\u4eba\u5de5\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19032v1", "published_at": "2026-08-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Counterfactual Contrastive Analysis", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u4f9d\u8d56\u5206\u7c7b\u5668\u7684\u89c6\u89c9\u53cd\u4e8b\u5b9e\u89e3\u91ca\u65b9\u6cd5\uff0c\u57fa\u4e8e\u5bf9\u6bd4\u5206\u6790\u5c06\u4e24\u7c7b\u6570\u636e\u4e2d\u7684\u5171\u6709\u751f\u6210\u56e0\u7d20\u4e0e\u5404\u81ea\u663e\u8457\u56e0\u7d20\u89e3\u8026\uff0c\u5e76\u901a\u8fc7\u4ea4\u6362\u663e\u8457\u56e0\u7d20\u751f\u6210\u53cd\u4e8b\u5b9e\u56fe\u50cf\u3002\u8be5\u65b9\u6cd5\u5229\u7528 StyleGAN2 \u7684\u7279\u5f81\u7a7a\u95f4\u63d0\u5347\u7ec6\u8282\u4fdd\u771f\u5ea
