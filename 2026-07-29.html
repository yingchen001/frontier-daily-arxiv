ng long-horizon repository generation and translation, bug fixing, feature implementation, and cross-language issue resolution, with absolute gains of 31.00 points on RepoZero-C2Rust, 14.16 on DeepSWE, 10.70/4.56 on NL2Repo-Bench (with/without tests), 5.04 on SWE-bench Verified, 5.93 on SWE-bench Pro, 5.22 on SWE-bench Multilingual, and 4.94 on FeatBench.", "arxiv_id": "2607.27146", "arxiv_url": "https://arxiv.org/abs/2607.27146", "authors": ["Yihao Chen", "Shi Chang", "Khaled Chawa", "Feng Lin", "Boyuan Chen", "Shaowei Wang", "Ahmed E. Hassan"], "brief": "\u8bba\u6587\u63d0\u51fa MindForge\uff0c\u5c06\u5f00\u6e90\u547d\u4ee4\u884c\u7a0b\u5e8f\u81ea\u52a8\u8f6c\u5316\u4e3a\u53ea\u66b4\u9732\u53ef\u6267\u884c\u6587\u4ef6\u548c\u6587\u6863\u7684\u65e0\u6e90\u7801\u8bad\u7ec3\u73af\u5883\uff0c\u7528\u4e8e\u8bad\u7ec3\u6a21\u578b\u5b8c\u6210\u4ece\u96f6\u7a0b\u5e8f\u5408\u6210\u53ca\u5b8c\u6574\u8f6f\u4ef6\u5de5\u7a0b\u751f\u547d\u5468\u671f\u4efb\u52a1\u3002\u4f5c\u8005\u7528 GLM-5.2 \u751f\u6210\u6559\u5e08\u8f68\u8ff9\u5fae\u8c03 Qwen3.6-27B\uff0c\u4f7f\u5176\u5728 ProgramBench \u548c\u591a\u4e2a\u672a\u89c1\u8f6f\u4ef6\u5de5\u7a0b\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u3002", "categories": ["cs.SE", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27146", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["MindForge \u6784\u5efa\u201csource-free\u201d\u73af\u5883\uff1a\u9690\u85cf\u6e90\u7801\uff0c\u4ec5\u63d0\u4f9b\u7f16\u8bd1\u540e\u7684\u53c2\u8003\u7a0b\u5e8f\u4e0e\u6587\u6863\uff0c\u903c\u8fd1\u4ece\u96f6\u5b9e\u73b0\u8f6f\u4ef6\u7684\u771f\u5b9e\u7ea6\u675f\u3002", "\u7528\u4e0e ProgramBench \u4e0d\u91cd\u5408\u7684\u4ed3\u5e93\u751f\u6210\u8bad\u7ec3\u73af\u5883\uff0c\u5e76\u901a\u8fc7 GLM-5.2 \u6559\u5e08\u667a\u80fd\u4f53\u91c7\u96c6\u9ad8\u8d28\u91cf\u7a0b\u5e8f\u5408\u6210\u8f68\u8ff9\u3002", "\u5fae\u8c03 Qwen3.6-27B \u540e\uff0cProgramBench \u5e73\u5747\u6d4b\u8bd5\u901a\u8fc7\u7387\u4ece 37.98% \u63d0\u5347\u5230 49.51%\uff0c\u5e76\u5728 SWE-bench\u3001DeepSWE\u3001NL2Repo\u3001RepoZero-C2Rust \u7b49 7 \u4e2a\u672a\u89c1\u57fa\u51c6\u4e0a\u5168\u9762\u589e\u76ca\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u7a0b\u5e8f\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27146v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MindForge: Teaching Small Language Models Whole-Life-Cycle Software Engineering via Source-Free Program Synthesis", "tldr": "\u7528\u65e0\u6e90\u7801\u73af\u5883\u8bad\u7ec3\u5c0f\u6a21\u578b\u4ece\u96f6\u6784\u5efa\u8f6f\u4ef6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MindForge\uff0c\u5c06\u5f00\u6e90\u547d\u4ee4\u884c\u7a0b\u5e8f\u81ea\u52a8\u8f6c\u5316\u4e3a\u53ea\u66b4\u9732\u53ef\u6267\u884c\u6587\u4ef6\u548c\u6587\u6863\u7684\u65e0\u6e90\u7801\u8bad\u7ec3\u73af\u5883\uff0c\u7528\u4e8e\u8bad\u7ec3\u6a21\u578b\u5b8c\u6210\u4ece\u96f6\u7a0b\u5e8f\u5408\u6210\u53ca\u5b8c\u6574\u8f6f\u4ef6\u5de5\u7a0b\u751f\u547d\u5468\u671f\u4efb\u52a1\u3002\u4f5c\u8005\u7528 GLM-5.2 \u751f\u6210\u6559\u5e08\u8f68\u8ff9\u5fae\u8c03 Qwen3.6-27B\uff0c\u4f7f\u5176\u5728 ProgramBench \u548c\u591a\u4e2a\u672a\u89c1\u8f6f\u4ef6\u5de5\u7a0b\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u9488\u5bf9\u5f53\u524d\u4ee3\u7801\u667a\u80fd\u4f53\u8584\u5f31\u7684\u201c\u4ece\u96f6\u6784\u5efa\u5b8c\u6574\u7a0b\u5e8f\u201d\u573a\u666f\uff0c\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u8bad\u7ec3\u73af\u5883\u548c\u6570\u636e\u751f\u6210\u6d41\u7a0b\uff0c\u5e76\u8bc1\u660e\u4e2d\u7b49\u89c4\u6a21\u6a21\u578b\u53ef\u901a\u8fc7\u8f68\u8ff9\u5fae\u8c03\u63a5\u8fd1\u66f4\u5927\u524d\u6cbf\u6a21\u578b\u7684\u8f6f\u4ef6\u5de5\u7a0b\u80fd\u529b\uff0c\u5bf9\u4ee3\u7801\u667a\u80fd\u4f53\u8bad\u7ec3\u8303\u5f0f\u5f88\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Large language models are increasingly deployed with persistent personalized context, such as accumulated memory profiles or long conversation histories, that is shared across a user\u0027s many requests. Production memory systems (e.g., Mem0, MemGPT, and Zep) retrieve a relevant subset of this memory and inject it into the prompt, forcing the serving engine to repeatedly prefill the same content. As the retrieval budget grows, time-to-first-token (TTFT) increases even though the underlying memory is reused across requests. We present InferScale, a GPU-native LLM memory system that replaces repeated prompt prefilling with reusable KV state. InferScale precomputes each memory fact\u0027s KV representation, stores it alongside a semantic embedding on the GPU, retrieves relevant facts at serving time, and injects their KV directly into vLLM\u0027s paged cache. To support dynamically assembled memories under rotary position embeddings, we introduce Chunked RoPE, which stores keys before rotation and applies their serving-time positions during injection. However, encoding memory facts independently omits the cross-fact context available during joint prefilling. We mitigate this with Context-Window Encoding, which encodes each memory fact together with a small window of preceding conversation context while caching only the target fact\u0027s KV. InferScale is implemented through vLLM\u0027s KV-connector interface, requiring neither engine modifications nor model fine-tuning. Across three open-weight models on LoCoMo, InferScale keeps TTFT nearly constant as the retrieval budget increases: at k=50 it reduces TTFT by 72-79% (3.6-4.8x), achieves 60.3% accuracy versus 63.3% for Mem0 without serving-time recomputation, and delivers 3.7-4.5x the throughput under concurrent load. Reusable KV state thus decouples memory-conditioned serving latency from retrieved-context size while preserving application quality.", "arxiv_id": "2607.27090", "arxiv_url": "https://arxiv.org/abs/2607.27090", "authors": ["Peter Li", "Prashant Pandey"], "brief": "InferScale \u662f\u4e00\u4e2a GPU \u539f\u751f\u7684 LLM \u8bb0\u5fc6\u7cfb\u7edf\uff0c\u5c06\u7528\u6237\u957f\u671f\u8bb0\u5fc6\u9884\u5148\u7f16\u7801\u4e3a KV \u72b6\u6001\u5e76\u5b58\u653e\u5728 GPU \u4e0a\uff0c\u670d\u52a1\u65f6\u76f4\u63a5\u68c0\u7d22\u5e76\u6ce8\u5165 vLLM \u7684 paged cache\uff0c\u907f\u514d\u53cd\u590d prompt prefill\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27090", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Chunked RoPE\uff1a\u5b58\u50a8\u65cb\u8f6c\u524d\u7684 key\uff0c\u5e76\u5728\u6ce8\u5165\u65f6\u6309\u5b9e\u9645\u670d\u52a1\u4f4d\u7f6e\u5e94\u7528 RoPE\uff0c\u652f\u6301\u52a8\u6001\u62fc\u63a5\u8bb0\u5fc6\u7247\u6bb5\u3002", "\u63d0\u51fa Context-Window Encoding\uff1a\u7528\u5c11\u91cf\u524d\u6587\u4e0a\u4e0b\u6587\u7f16\u7801\u6bcf\u6761\u8bb0\u5fc6\uff0c\u53ea\u7f13\u5b58\u76ee\u6807\u8bb0\u5fc6\u7684 KV\uff0c\u4ee5\u7f13\u89e3\u72ec\u7acb\u7f16\u7801\u7f3a\u5c11\u8de8\u8bb0\u5fc6\u4e0a\u4e0b\u6587\u7684\u95ee\u9898\u3002", "\u5728 LoCoMo \u4e0a\uff0ck=50 \u65f6 TTFT \u964d\u4f4e 72-79%\uff0c\u541e\u5410\u63d0\u5347 3.7-4.5 \u500d\uff0c\u51c6\u786e\u7387 60.3% \u63a5\u8fd1 Mem0 \u7684 63.3%\u3002"], "keywords": ["LLM\u670d\u52a1", "KV\u7f13\u5b58", "\u4e2a\u6027\u5316\u8bb0\u5fc6", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27090v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "InferScale: GPU-Native KV Injection for Personalized LLM Serving", "tldr": "\u7528\u53ef\u590d\u7528KV\u7f13\u5b58\u52a0\u901f\u4e2a\u6027\u5316LLM\u670d\u52a1", "upvotes": 0, "what_it_is": "InferScale \u662f\u4e00\u4e2a GPU \u539f\u751f\u7684 LLM \u8bb0\u5fc6\u7cfb\u7edf\uff0c\u5c06\u7528\u6237\u957f\u671f\u8bb0\u5fc6\u9884\u5148\u7f16\u7801\u4e3a KV \u72b6\u6001\u5e76\u5b58\u653e\u5728 GPU \u4e0a\uff0c\u670d\u52a1\u65f6\u76f4\u63a5\u68c0\u7d22\u5e76\u6ce8\u5165 vLLM \u7684 paged cache\uff0c\u907f\u514d\u53cd\u590d prompt prefill\u3002", "why_notable": "\u5b83\u5c06\u4e2a\u6027\u5316\u8bb0\u5fc6\u6ce8\u5165\u4ece\u91cd\u590d\u6587\u672c\u9884\u586b\u5145\u8f6c\u4e3a\u53ef\u590d\u7528 KV \u6ce8\u5165\uff0c\u4f7f\u5ef6\u8fdf\u57fa\u672c\u4e0d\u968f\u68c0\u7d22\u4e0a\u4e0b\u6587\u89c4\u6a21\u589e\u957f\uff0c\u5bf9\u957f\u671f\u8bb0\u5fc6\u578b LLM \u5e94\u7528\u548c\u9ad8\u5e76\u53d1\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u5de5\u7a0b\u4ef7\u503c\u3002"}, {"abstract": "LLM-based analyzers have begun finding real vulnerabilities in mature open-source projects: AISLE\u0027s analyzer is credited with more than 280 CVEs across 78 projects, including OpenSSL, curl, and GnuTLS. We introduce HoF-Bench (named after AISLE\u0027s public Hall of Fame), a benchmark built from 95 of these public AI-discovered CVEs across eight repositories pinned at vulnerable commits. Analyzers receive source and target-file scope but not CVE identifiers, descriptions, fixes, or expected mechanisms; a detector-blinded frontier-model judge credits only findings that identify the same code path, root cause, attack condition, and impact. A deliberately minimal LLM-based analyzer rediscovers up to 65 of the 95 CVEs (68%) under this strict protocol. No frontier model performs detection anywhere in the study. The ten detector backbones are five open-weight models (21B--284B total parameters, 3--13B active) and five proprietary small or \"flash\"-tier models. All of them run in the fixed scaffold with four repeated passes, an optional generated-context stage, and a replayable multi-round triage stage (7,600 model--CVE pass records). Difficulty is strongly structured by language; the CVEs missed by every model concentrate in C infrastructure code. HoF-Bench provides a compact test bed for comparing vulnerability scanners, their reliability across repeated runs, and the candidate volume they create. The dataset is available at https://huggingface.co/datasets/aisleinc/HoF-Bench.", "arxiv_id": "2607.27030", "arxiv_url": "https://arxiv.org/abs/2607.27030", "authors": ["Petr Simecek", "Elnaz Babayeva", "Jiri Balhar", "Michal Bida", "Michal Buran", "Vaclav Cadek", "Luigino Camastra", "Tomas Dulka", "Michal Janocko", "Tomas Klohna", "Pavel Kohout", "Ondrej Kokes", "Adam Krivka", "Jakub Kubik", "Patrik Mada", "Igor Morgenstern", "Marek Pavelka", "Joshua Rogers", "Petr Stastny", "Jan Tattermusch", "Dmitrijs Trizna", "Martin Votruba", "Guido Vranken", "Jakub Zikl", "Evelina Gabasova", "Stanislav Fort"], "brief": "\u8bba\u6587\u63d0\u51fa HoF-Bench\uff0c\u4e00\u4e2a\u7531 AISLE \u516c\u5f00\u201cAI \u53d1\u73b0\u201d\u771f\u5b9e CVE \u6784\u5efa\u7684\u6f0f\u6d1e\u68c0\u6d4b\u57fa\u51c6\uff0c\u6db5\u76d6 8 \u4e2a\u4ee3\u7801\u5e93\u4e2d 95 \u4e2a\u56fa\u5b9a\u5728\u8106\u5f31\u63d0\u4ea4\u7684 CVE\u3002\u4f5c\u8005\u5728\u4e0d\u63d0\u4f9b CVE \u63cf\u8ff0\u3001\u4fee\u590d\u6216\u673a\u5236\u4fe1\u606f\u7684\u4e25\u683c\u8bbe\u7f6e\u4e0b\uff0c\u8bc4\u4f30\u591a\u79cd\u5c0f\u578b/\u5f00\u6e90\u6a21\u578b\u9a71\u52a8\u7684 LLM \u6f0f\u6d1e\u5206\u6790\u5668\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27030", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u5305\u542b OpenSSL\u3001curl\u3001GnuTLS \u7b49\u6210\u719f\u5f00\u6e90\u9879\u76ee\u4e2d\u7684 95 \u4e2a\u771f\u5b9e AI-discovered CVE\uff0c\u5e76\u8981\u6c42\u68c0\u6d4b\u7ed3\u679c\u5339\u914d\u4ee3\u7801\u8def\u5f84\u3001\u6839\u56e0\u3001\u653b\u51fb\u6761\u4ef6\u548c\u5f71\u54cd", "\u4e00\u4e2a\u6781\u7b80 LLM \u5206\u6790\u5668\u5728\u4e25\u683c\u534f\u8bae\u4e0b\u6700\u591a\u91cd\u65b0\u53d1\u73b0 65/95 \u4e2a CVE\uff0c\u8fbe\u5230 68%\uff0c\u4e14\u68c0\u6d4b\u9636\u6bb5\u672a\u4f7f\u7528\u524d\u6cbf\u6a21\u578b", "\u8bc4\u6d4b\u8986\u76d6 10 \u4e2a\u68c0\u6d4b\u6a21\u578b\u9aa8\u5e72\uff0c\u5305\u62ec 5 \u4e2a\u5f00\u6e90\u6743\u91cd\u6a21\u578b\u548c 5 \u4e2a\u5c0f\u578b/flash \u7ea7\u4e13\u6709\u6a21\u578b\uff0c\u5e76\u63d0\u4f9b 7600 \u6761\u6a21\u578b-CVE \u8fd0\u884c\u8bb0\u5f55"], "keywords": ["\u6f0f\u6d1e\u68c0\u6d4b", "\u4ee3\u7801\u5b89\u5168", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27030v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HoF-Bench: Rediscovering Real AI-Discovered CVEs Without Frontier Models", "tldr": "\u65e0\u9700\u524d\u6cbf\u6a21\u578b\u4e5f\u80fd\u590d\u73b0AI\u53d1\u73b0CVE", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HoF-Bench\uff0c\u4e00\u4e2a\u7531 AISLE \u516c\u5f00\u201cAI \u53d1\u73b0\u201d\u771f\u5b9e CVE \u6784\u5efa\u7684\u6f0f\u6d1e\u68c0\u6d4b\u57fa\u51c6\uff0c\u6db5\u76d6 8 \u4e2a\u4ee3\u7801\u5e93\u4e2d 95 \u4e2a\u56fa\u5b9a\u5728\u8106\u5f31\u63d0\u4ea4\u7684 CVE\u3002\u4f5c\u8005\u5728\u4e0d\u63d0\u4f9b CVE \u63cf\u8ff0\u3001\u4fee\u590d\u6216\u673a\u5236\u4fe1\u606f\u7684\u4e25\u683c\u8bbe\u7f6e\u4e0b\uff0c\u8bc4\u4f30\u591a\u79cd\u5c0f\u578b/\u5f00\u6e90\u6a21\u578b\u9a71\u52a8\u7684 LLM \u6f0f\u6d1e\u5206\u6790\u5668\u3002", "why_notable": "\u5b83\u4e3a\u771f\u5b9e\u6f0f\u6d1e\u53d1\u73b0\u80fd\u529b\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u3001\u7d27\u51d1\u4e14\u4e25\u683c\u7684\u8bc4\u6d4b\u573a\u666f\uff0c\u663e\u793a\u975e\u524d\u6cbf\u6a21\u578b\u4e5f\u80fd\u5728\u6210\u719f\u4ee3\u7801\u5e93\u4e2d\u53d1\u73b0\u5927\u91cf\u771f\u5b9e CVE\uff0c\u540c\u65f6\u63ed\u793a C \u57fa\u7840\u8bbe\u65bd\u4ee3\u7801\u4ecd\u662f\u5f53\u524d\u6a21\u578b\u7684\u96be\u70b9\u3002"}, {"abstract": "A central premise of latent world models is that predicting the future forces a representation to internalize the physics of its environment. Which physical quantities does a trained latent actually contain, and what decides this? We answer with controlled interventions in POKEWORLD, an interactive environment whose visually identical objects hide mass, drag, and contact stiffness. A certificate-gated protocol first certifies each parameter as recoverable from raw observations, then measures whether it enters the latent, so a null result can be attributed to the objective rather than to the environment. The resulting identifiability map has two organizing mechanisms and one frontier. Inputs limit what can be known, while prediction targets decide what is retained. Stiffness enters the latent only when touch is forecast ($R^2=0.50$, compared with $-0.02$ when the same signal is merely fused into the input), and under single-step prediction a vision-only latent discards even perfectly visible object state. Drag marks the frontier. It carries a recoverability certificate of 0.89 yet plateaus near 0.13 under every deterministic prediction objective we test, while a supervised head on the same trunk reaches 0.45. Parameters whose readout is slow and ratio-type under the sensed coordinates fall outside what these objectives acquire. On RH20T, an input-target factorial across scaling curves reproduces both mechanisms across two robots and 4,258 episodes. Every arm missing information or prediction pressure stays flat over a fivefold data range, and only the full multimodal objective forecasts force beyond a persistence baseline, with held-out gains that grow with scale. Objective structure determines which physical parameters a latent acquires, and additional data improves only the parameters it already acquires.", "arxiv_id": "2607.27017", "arxiv_url": "https://arxiv.org/abs/2607.27017", "authors": ["Kaizhen Tan", "Xin Xu", "Siru Tao", "Hanzhe Hong", "Yang Feng", "Heqing Du"], "brief": "\u8bba\u6587\u901a\u8fc7 POKEWORLD \u548c RH20T \u7684\u53d7\u63a7\u5b9e\u9a8c\uff0c\u7814\u7a76\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u7684\u8868\u5f81\u4e2d\u662f\u5426\u5305\u542b\u8d28\u91cf\u3001\u963b\u529b\u3001\u63a5\u89e6\u521a\u5ea6\u7b49\u7269\u7406\u53c2\u6570\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u53ef\u6062\u590d\u6027\u8bc1\u4e66\u201d\u534f\u8bae\uff0c\u5148\u786e\u8ba4\u53c2\u6570\u53ef\u4ece\u539f\u59cb\u89c2\u6d4b\u6062\u590d\uff0c\u518d\u5224\u65ad\u8bad\u7ec3\u76ee\u6807\u662f\u5426\u8ba9\u8be5\u53c2\u6570\u8fdb\u5165\u6f5c\u5728\u8868\u5f81\u3002", "categories": ["cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27017", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8f93\u5165\u6a21\u6001\u51b3\u5b9a\u54ea\u4e9b\u7269\u7406\u4fe1\u606f\u53ef\u88ab\u77e5\u9053\uff0c\u9884\u6d4b\u76ee\u6807\u51b3\u5b9a\u54ea\u4e9b\u4fe1\u606f\u4f1a\u88ab\u4fdd\u7559\u5230\u6f5c\u5728\u8868\u5f81\u4e2d\u3002", "\u63a5\u89e6\u521a\u5ea6\u53ea\u6709\u5728\u9884\u6d4b\u89e6\u89c9\u4fe1\u53f7\u65f6\u624d\u663e\u8457\u8fdb\u5165\u8868\u5f81\uff0cR\u00b2 \u8fbe 0.50\uff1b\u4ec5\u628a\u89e6\u89c9\u4f5c\u4e3a\u8f93\u5165\u878d\u5408\u65f6\u51e0\u4e4e\u65e0\u6548\u3002", "\u963b\u529b\u867d\u4ece\u89c2\u6d4b\u4e2d\u53ef\u6062\u590d\u6027\u9ad8\u8fbe 0.89\uff0c\u4f46\u5728\u591a\u79cd\u786e\u5b9a\u6027\u9884\u6d4b\u76ee\u6807\u4e0b\u8868\u5f81\u8bfb\u51fa\u4ec5\u7ea6 0.13\uff0c\u663e\u793a\u6162\u901f\u3001\u6bd4\u503c\u578b\u7269\u7406\u91cf\u662f\u5f53\u524d\u76ee\u6807\u7684\u5b66\u4e60\u8fb9\u754c\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001", "\u673a\u5668\u4eba", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27017v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "What Can Latent World Models Know? Physical Parameter Identifiability in Multimodal Predictive Representations", "tldr": "\u9884\u6d4b\u76ee\u6807\u51b3\u5b9a\u4e16\u754c\u6a21\u578b\u5b66\u5230\u54ea\u4e9b\u7269\u7406\u91cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u901a\u8fc7 POKEWORLD \u548c RH20T \u7684\u53d7\u63a7\u5b9e\u9a8c\uff0c\u7814\u7a76\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u7684\u8868\u5f81\u4e2d\u662f\u5426\u5305\u542b\u8d28\u91cf\u3001\u963b\u529b\u3001\u63a5\u89e6\u521a\u5ea6\u7b49\u7269\u7406\u53c2\u6570\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u53ef\u6062\u590d\u6027\u8bc1\u4e66\u201d\u534f\u8bae\uff0c\u5148\u786e\u8ba4\u53c2\u6570\u53ef\u4ece\u539f\u59cb\u89c2\u6d4b\u6062\u590d\uff0c\u518d\u5224\u65ad\u8bad\u7ec3\u76ee\u6807\u662f\u5426\u8ba9\u8be5\u53c2\u6570\u8fdb\u5165\u6f5c\u5728\u8868\u5f81\u3002", "why_notable": "\u8be5\u7814\u7a76\u7cfb\u7edf\u63ed\u793a\u4e86\u201c\u9884\u6d4b\u672a\u6765\u4f1a\u81ea\u52a8\u5b66\u5230\u7269\u7406\u89c4\u5f8b\u201d\u8fd9\u4e00\u5e38\u89c1\u5047\u8bbe\u7684\u6761\u4ef6\u4e0e\u5c40\u9650\uff0c\u8bf4\u660e\u4ec5\u589e\u52a0\u6570\u636e\u4e0d\u8db3\u4ee5\u5f25\u8865\u76ee\u6807\u8bbe\u8ba1\u7f3a\u9677\uff0c\u5bf9\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b\u3001\u591a\u6a21\u6001\u9884\u6d4b\u8868\u5f81\u548c\u7269\u7406\u53ef\u89e3\u91ca\u5b66\u4e60\u5177\u6709\u91cd\u8981\u6307\u5bfc\u610f\u4e49\u3002"}, {"abstract": "Large language model (LLM) agents automate penetration testing through an observation-action loop, selecting actions based on observations returned by tools. This dependence allows defenders to inject deceptive observations that can mislead the agent\u0027s decision-making process. However, existing defenses rely heavily on static, isolated artifacts planted in the environment prior to an attack. Advanced agents can progressively recognize and bypass these artifacts, ultimately refocusing their exploitation attempts on the real target. To address this issue, we introduce AgentSnare, a trajectory-adaptive deception system that dynamically unfolds a decoy environment to continually steer the penetration agent away from the real target. Specifically, AgentSnare employs an artifact-construction policy model that constructs candidate artifacts conditioned on the agent\u0027s interaction history and decoy state. AgentSnare then validates these candidates and incrementally incorporates valid artifacts into a factually consistent decoy environment, thereby delaying the attack by absorbing its tool calls, diverting its post-entry trajectory within the decoy, and defusing it by inducing completion reports grounded in decoy evidence. Across 15 CVE-Bench web applications and three attacker models, AgentSnare absorbs 46.8% of the agent\u0027s tool calls in the decoy and retains 55.9% of post-entry actions there, while 90.0% of completion attempts are grounded in decoy evidence; across all 45 attacker-CVE pairs, no real target is successfully exploited at pass@3.", "arxiv_id": "2607.26998", "arxiv_url": "https://arxiv.org/abs/2607.26998", "authors": ["Ruoyu Wang", "Heng Zhao", "Renjie Wu", "Mengnan Zhao", "Zhixuan Chu", "Wanyu Lin", "Tianhang Zheng"], "brief": "\u672c\u6587\u63d0\u51fa AgentSnare\uff0c\u4e00\u79cd\u9762\u5411 LLM \u81ea\u52a8\u6e17\u900f\u667a\u80fd\u4f53\u7684\u8f68\u8ff9\u81ea\u9002\u5e94\u6b3a\u9a97\u9632\u5fa1\u7cfb\u7edf\u3002\u5b83\u6839\u636e\u667a\u80fd\u4f53\u4ea4\u4e92\u5386\u53f2\u52a8\u6001\u6784\u5efa\u5e76\u6269\u5c55\u8bf1\u9975\u73af\u5883\uff0c\u6301\u7eed\u5c06\u653b\u51fb\u8def\u5f84\u4ece\u771f\u5b9e\u76ee\u6807\u5f15\u5f00\u3002", "categories": ["cs.CR", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26998", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4f7f\u7528 artifact-construction policy model \u6839\u636e\u653b\u51fb\u8f68\u8ff9\u548c\u8bf1\u9975\u72b6\u6001\u751f\u6210\u5019\u9009\u8bf1\u9a97\u8bc1\u636e\u4e0e\u73af\u5883\u4f2a\u8ff9", "\u5bf9\u5019\u9009\u4f2a\u8ff9\u8fdb\u884c\u4e00\u81f4\u6027\u9a8c\u8bc1\uff0c\u5e76\u589e\u91cf\u52a0\u5165\u4e8b\u5b9e\u4e00\u81f4\u7684\u8bf1\u9975\u73af\u5883\u4e2d\uff0c\u907f\u514d\u88ab\u9ad8\u7ea7\u667a\u80fd\u4f53\u8f7b\u6613\u8bc6\u7834", "\u5728 15 \u4e2a CVE-Bench Web \u5e94\u7528\u548c 3 \u7c7b\u653b\u51fb\u6a21\u578b\u4e0a\uff0c\u8bf1\u9975\u5438\u6536 46.8% \u5de5\u5177\u8c03\u7528\uff0c\u4fdd\u7559 55.9% \u5165\u4fb5\u540e\u52a8\u4f5c\uff0cpass@3 \u4e0b\u65e0\u771f\u5b9e\u76ee\u6807\u88ab\u6210\u529f\u5229\u7528"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "LLM", "\u653b\u9632\u5bf9\u6297"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26998v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AgentSnare: Learning to Delay, Divert, and Defuse Autonomous Penetration Agents", "tldr": "\u52a8\u6001\u8bf1\u9a97\u73af\u5883\u9632\u5fa1\u6e17\u900f\u6d4b\u8bd5\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa AgentSnare\uff0c\u4e00\u79cd\u9762\u5411 LLM \u81ea\u52a8\u6e17\u900f\u667a\u80fd\u4f53\u7684\u8f68\u8ff9\u81ea\u9002\u5e94\u6b3a\u9a97\u9632\u5fa1\u7cfb\u7edf\u3002\u5b83\u6839\u636e\u667a\u80fd\u4f53\u4ea4\u4e92\u5386\u53f2\u52a8\u6001\u6784\u5efa\u5e76\u6269\u5c55\u8bf1\u9975\u73af\u5883\uff0c\u6301\u7eed\u5c06\u653b\u51fb\u8def\u5f84\u4ece\u771f\u5b9e\u76ee\u6807\u5f15\u5f00\u3002", "why_notable": "\u76f8\u6bd4\u9759\u6001\u871c\u7f50\u6216\u9884\u57cb\u4f2a\u8ff9\uff0cAgentSnare \u80fd\u968f\u653b\u51fb\u8f68\u8ff9\u52a8\u6001\u5c55\u5f00\u8bf1\u9a97\u73af\u5883\uff0c\u66f4\u9002\u5408\u9632\u5fa1\u5177\u5907\u89c2\u5bdf-\u884c\u52a8\u5faa\u73af\u7684 LLM \u6e17\u900f\u667a\u80fd\u4f53\uff0c\u5bf9\u672a\u6765\u667a\u80fd\u4f53\u5b89\u5168\u548c\u81ea\u52a8\u5316\u653b\u9632\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "As large language models (LLMs) are deployed in high-stakes domains, adversaries may poison training data to implant backdoors: hidden triggers that covertly manipulate model behavior at inference time. We ask whether a defender can recover such a trigger under realistic affordances, namely white-box access to the weights and knowledge of the behavior of concern, but no training data, no trusted reference model, no knowledge of the trigger, and no certainty that the model is poisoned. To evaluate whether a defender can recover such a trigger under realistic settings, we release ToxScreen, a benchmark of roughly 800 backdoored models spanning attack objectives, trigger mechanisms, poisoning rates, model scales, and backdoor training mechanisms. We also assert that the backdoors are high-quality: they achieve high attack success rates, generalize to unseen harmful inputs, and preserve clean-task performance. Scoring recovery of the planted trigger, we find that gradient-based prompt optimization fails in recovery, whereas a token look-up that ranks candidates by attack-success rate recovers the trigger wherever the backdoor is effective. To understand this more, we study the relationship between attack behaviors and the weights of an LLM. We find a phenomenon whereby backdoors operate via different mechanistic strategies than jailbreaks, allowing defenders to filter jailbreaks. Finally, no method reliably surfaces every backdoor, but a broadly jailbreakable model is itself anomalous, a useful signal even when the exact trigger is not recovered. We release all models and evaluation code", "arxiv_id": "2607.26849", "arxiv_url": "https://arxiv.org/abs/2607.26849", "authors": ["Anthony Hughes", "Nicole Xing", "Collin Francel", "Andy Kim", "Andrew Draganov"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u53d1\u5e03 ToxScreen\uff0c\u4e00\u4e2a\u5305\u542b\u7ea6800\u4e2a\u540e\u95e8\u5927\u8bed\u8a00\u6a21\u578b\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5728\u65e0\u8bad\u7ec3\u6570\u636e\u3001\u65e0\u53c2\u8003\u6a21\u578b\u3001\u672a\u77e5\u89e6\u53d1\u5668\u7684\u73b0\u5b9e\u6761\u4ef6\u4e0b\uff0c\u9632\u5fa1\u8005\u80fd\u5426\u6062\u590d\u88ab\u6295\u6bd2\u690d\u5165\u7684\u89e6\u53d1\u5668\u3002\u7814\u7a76\u8fd8\u6bd4\u8f83\u4e86\u4e0d\u540c\u6062\u590d\u65b9\u6cd5\uff0c\u5e76\u5206\u6790\u540e\u95e8\u884c\u4e3a\u4e0e\u6a21\u578b\u6743\u91cd\u673a\u5236\u4e4b\u95f4\u7684\u5173\u7cfb\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26849", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["ToxScreen \u8986\u76d6\u653b\u51fb\u76ee\u6807\u3001\u89e6\u53d1\u673a\u5236\u3001\u6295\u6bd2\u6bd4\u4f8b\u3001\u6a21\u578b\u89c4\u6a21\u548c\u540e\u95e8\u8bad\u7ec3\u65b9\u5f0f\u7b49\u591a\u79cd\u8bbe\u7f6e\uff0c\u4e14\u540e\u95e8\u5177\u5907\u9ad8\u653b\u51fb\u6210\u529f\u7387\u3001\u6cdb\u5316\u6027\u548c\u8f83\u597d\u5e72\u51c0\u4efb\u52a1\u6027\u80fd\u3002", "\u68af\u5ea6\u5f0f\u63d0\u793a\u4f18\u5316\u5728\u89e6\u53d1\u5668\u6062\u590d\u4e0a\u8868\u73b0\u4e0d\u4f73\uff0c\u800c\u6309\u653b\u51fb\u6210\u529f\u7387\u6392\u5e8f\u7684 token \u67e5\u627e\u65b9\u6cd5\u5728\u540e\u95e8\u6709\u6548\u65f6\u901a\u5e38\u80fd\u6062\u590d\u89e6\u53d1\u5668\u3002", "\u7814\u7a76\u53d1\u73b0\u540e\u95e8\u4e0e jailbreak \u53ef\u80fd\u4f9d\u8d56\u4e0d\u540c\u673a\u5236\uff0c\u9632\u5fa1\u8005\u53ef\u636e\u6b64\u8fc7\u6ee4 jailbreak\uff1b\u4f46\u76ee\u524d\u6ca1\u6709\u65b9\u6cd5\u80fd\u53ef\u9760\u53d1\u73b0\u6240\u6709\u540e\u95e8\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u540e\u95e8\u653b\u51fb", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26849v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ToxScreen: Detecting Whether an LLM Has Been Poisoned", "tldr": "\u68c0\u6d4bLLM\u662f\u5426\u88ab\u690d\u5165\u540e\u95e8\u89e6\u53d1\u5668", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5e76\u53d1\u5e03 ToxScreen\uff0c\u4e00\u4e2a\u5305\u542b\u7ea6800\u4e2a\u540e\u95e8\u5927\u8bed\u8a00\u6a21\u578b\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5728\u65e0\u8bad\u7ec3\u6570\u636e\u3001\u65e0\u53c2\u8003\u6a21\u578b\u3001\u672a\u77e5\u89e6\u53d1\u5668\u7684\u73b0\u5b9e\u6761\u4ef6\u4e0b\uff0c\u9632\u5fa1\u8005\u80fd\u5426\u6062\u590d\u88ab\u6295\u6bd2\u690d\u5165\u7684\u89e6\u53d1\u5668\u3002\u7814\u7a76\u8fd8\u6bd4\u8f83\u4e86\u4e0d\u540c\u6062\u590d\u65b9\u6cd5\uff0c\u5e76\u5206\u6790\u540e\u95e8\u884c\u4e3a\u4e0e\u6a21\u578b\u6743\u91cd\u673a\u5236\u4e4b\u95f4\u7684\u5173\u7cfb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u5927\u89c4\u6a21\u53ef\u590d\u73b0\u5b9e\u9a8c\u57fa\u51c6\uff0c\u63a8\u52a8\u5bf9LLM\u8bad\u7ec3\u6570\u636e\u6295\u6bd2\u548c\u540e\u95e8\u68c0\u6d4b\u7684\u7cfb\u7edf\u8bc4\u4f30\uff1b\u5176\u7ed3\u679c\u4e5f\u63ed\u793a\u4e86\u73b0\u5b9e\u9632\u5fa1\u6761\u4ef6\u4e0b\u89e6\u53d1\u5668\u6062\u590d\u7684\u53ef\u884c\u8fb9\u754c\u4e0e\u5f02\u5e38\u4fe1\u53f7\u3002"}, {"abstract": "Recent advances in AI agents have increasingly internalized native capabilities into their underlying foundation models, giving rise to multimodal foundation models and large reasoning models. However, agent memory is still primarily implemented through external modules, leaving the native memory capability largely unexplored. In this paper, we take a first step toward this direction by introducing memory foundation models, which empower foundation models with native memory capabilities. We formalize native memory from two perspectives: a persistent and dynamically evolving memory state within the backbone, and native memory procedures that autonomously store and utilize information through model computation. We show that native memory offers advantages in architecture, end-to-end optimization, and efficiency. Based on this formulation, we propose Metis, the first prototype of memory foundation models. Metis introduces a new architecture that equips a foundation model with a native memory state, allowing historical information to be compressed into the model and accessed through memory attention. We construct large-scale memory-specific training data and introduce multiple optimization objectives to acquire these native memory procedures through mid-training. The online memory maintenance of Metis is gradient-free, and the memory update requires only a forward pass. At inference time, all learned model weights remain frozen, while the native memory states are autonomously transformed through standard forward computation. Through extensive experiments, we show that Metis exhibits native memory capabilities and further provide a detailed analysis of its strengths, limitations, and behaviors. To facilitate future research on memory foundation models, we release our project and model checkpoints.", "arxiv_id": "2607.26760", "arxiv_url": "https://arxiv.org/abs/2607.26760", "authors": ["Zeyu Zhang", "Ziliang Guo", "Yihang Sun", "Xichong Zhang", "Xixuan Hao", "Zehao Lin", "Yang Zhang", "Xiaoyan Zhao", "Tong Shen", "Bo Tang", "Zhi-Qin John Xu", "Junchi Yan", "Haofen Wang", "Xu Chen", "Feiyu Xiong", "Zhiyu Li", "Tat-Seng Chua"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u8bb0\u5fc6\u57fa\u7840\u6a21\u578b\u201d\u6982\u5ff5\uff0c\u5c06\u6301\u4e45\u3001\u52a8\u6001\u6f14\u5316\u7684\u8bb0\u5fc6\u72b6\u6001\u5185\u5316\u5230\u57fa\u7840\u6a21\u578b\u9aa8\u5e72\u4e2d\u3002\u5176\u539f\u578b Metis \u901a\u8fc7\u8bb0\u5fc6\u6ce8\u610f\u529b\u8bbf\u95ee\u5386\u53f2\u4fe1\u606f\uff0c\u5e76\u7528\u4e13\u95e8\u6570\u636e\u548c\u591a\u76ee\u6807\u4e2d\u8bad\u7ec3\u5b66\u4e60\u81ea\u4e3b\u5b58\u50a8\u4e0e\u5229\u7528\u4fe1\u606f\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26760", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u539f\u751f\u8bb0\u5fc6\u5b9a\u4e49\u4e3a\u6a21\u578b\u5185\u90e8\u6301\u4e45\u8bb0\u5fc6\u72b6\u6001\uff0c\u4ee5\u53ca\u901a\u8fc7\u524d\u5411\u8ba1\u7b97\u81ea\u4e3b\u5199\u5165\u3001\u7ef4\u62a4\u3001\u8c03\u7528\u8bb0\u5fc6\u7684\u8fc7\u7a0b", "Metis \u7684\u5728\u7ebf\u8bb0\u5fc6\u7ef4\u62a4\u65e0\u9700\u68af\u5ea6\u66f4\u65b0\uff0c\u63a8\u7406\u65f6\u6a21\u578b\u6743\u91cd\u51bb\u7ed3\uff0c\u8bb0\u5fc6\u72b6\u6001\u4ec5\u901a\u8fc7\u6807\u51c6\u524d\u5411\u4f20\u64ad\u52a8\u6001\u53d8\u5316", "\u6784\u5efa\u5927\u89c4\u6a21\u8bb0\u5fc6\u4e13\u9879\u8bad\u7ec3\u6570\u636e\uff0c\u5e76\u901a\u8fc7\u591a\u79cd\u4f18\u5316\u76ee\u6807\u8ba9\u6a21\u578b\u5728\u4e2d\u8bad\u7ec3\u9636\u6bb5\u83b7\u5f97\u8bb0\u5fc6\u80fd\u529b"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u6a21\u578b", "\u57fa\u7840\u6a21\u578b", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26760v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Metis: Memory Foundation Model", "tldr": "\u9996\u4e2a\u539f\u751f\u8bb0\u5fc6\u57fa\u7840\u6a21\u578b\u539f\u578bMetis", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u8bb0\u5fc6\u57fa\u7840\u6a21\u578b\u201d\u6982\u5ff5\uff0c\u5c06\u6301\u4e45\u3001\u52a8\u6001\u6f14\u5316\u7684\u8bb0\u5fc6\u72b6\u6001\u5185\u5316\u5230\u57fa\u7840\u6a21\u578b\u9aa8\u5e72\u4e2d\u3002\u5176\u539f\u578b Metis \u901a\u8fc7\u8bb0\u5fc6\u6ce8\u610f\u529b\u8bbf\u95ee\u5386\u53f2\u4fe1\u606f\uff0c\u5e76\u7528\u4e13\u95e8\u6570\u636e\u548c\u591a\u76ee\u6807\u4e2d\u8bad\u7ec3\u5b66\u4e60\u81ea\u4e3b\u5b58\u50a8\u4e0e\u5229\u7528\u4fe1\u606f\u3002", "why_notable": "\u5b83\u628a\u667a\u80fd\u4f53\u8bb0\u5fc6\u4ece\u5916\u90e8\u68c0\u7d22\u6216\u6a21\u5757\u5316\u7ec4\u4ef6\u63a8\u8fdb\u5230\u57fa\u7840\u6a21\u578b\u539f\u751f\u80fd\u529b\u5c42\u9762\uff0c\u6709\u671b\u63d0\u5347\u7aef\u5230\u7aef\u4f18\u5316\u3001\u67b6\u6784\u7b80\u6d01\u6027\u548c\u63a8\u7406\u6548\u7387\uff0c\u662f\u957f\u671f\u8bb0\u5fc6\u667a\u80fd\u4f53\u7684\u91cd\u8981\u63a2\u7d22\u3002"}, {"abstract": "World models offer a promising route toward robot planning by enabling agents to imagine and verify the consequences of actions before execution. However, current video-based world models often struggle to capture the physical constraints that govern manipulation, particularly contact. Further, their action conditioning is often constrained to specific embodiments such as parallel grippers. We propose \\emph{Contact Flow}, an embodiment-agnostic action representation that encodes manipulation through the trajectory of 3D contact points between an actor and a target object. By discarding actor-specific appearance and kinematics, Contact Flow provides a shared conditioning signal for both human demonstrations and robotic execution. Therefore, we can train a large-scale video generative model on both human and robotic object interaction videos conditioned on Contact Flow, yielding a world model that predicts physically plausible manipulation outcomes. We integrate this model into a propose-imagine-verify-act pipeline, where generated rollouts are assessed by a vision-language model before execution. Experiments on the DROID dataset and real-world tabletop manipulation tasks demonstrate that Contact Flow enables transfer between human demonstrations and different robotic embodiments.", "arxiv_id": "2607.26579", "arxiv_url": "https://arxiv.org/abs/2607.26579", "authors": ["Sami Azirar", "Enrico Pallotta", "Jan Nogga", "J\u00fcrgen Gall", "Sven Behnke", "Hermann Blum"], "brief": "\u8bba\u6587\u63d0\u51fa Contact Flow\uff0c\u4e00\u79cd\u4e0e\u5177\u4f53\u6267\u884c\u4f53\u65e0\u5173\u7684\u52a8\u4f5c\u6761\u4ef6\u8868\u793a\uff0c\u7528\u64cd\u4f5c\u8005\u4e0e\u76ee\u6807\u7269\u4f53\u4e4b\u95f4\u76843D\u63a5\u89e6\u70b9\u8f68\u8ff9\u6765\u63cf\u8ff0\u64cd\u4f5c\u3002\u57fa\u4e8e\u8be5\u8868\u793a\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u7528\u4e8e\u673a\u5668\u4eba\u5728\u6267\u884c\u524d\u60f3\u8c61\u548c\u9a8c\u8bc1\u64cd\u4f5c\u7ed3\u679c\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26579", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Contact Flow \u53bb\u9664\u64cd\u4f5c\u8005\u5916\u89c2\u4e0e\u8fd0\u52a8\u5b66\u5dee\u5f02\uff0c\u5c06\u4eba\u7c7b\u793a\u8303\u548c\u673a\u5668\u4eba\u6267\u884c\u7edf\u4e00\u4e3a\u5171\u4eab\u7684\u63a5\u89e6\u8f68\u8ff9\u6761\u4ef6\u4fe1\u53f7", "\u5728\u4eba\u4f53\u4e0e\u673a\u5668\u4eba\u4ea4\u4e92\u89c6\u9891\u4e0a\u8bad\u7ec3\u5927\u89c4\u6a21\u89c6\u9891\u751f\u6210\u6a21\u578b\uff0c\u4ee5\u9884\u6d4b\u66f4\u7b26\u5408\u7269\u7406\u63a5\u89e6\u7ea6\u675f\u7684\u64cd\u4f5c\u7ed3\u679c", "\u7ed3\u5408 propose-imagine-verify-act \u6d41\u7a0b\uff0c\u7531\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8bc4\u4f30\u751f\u6210 rollout \u540e\u518d\u6267\u884c\u771f\u5b9e\u673a\u5668\u4eba\u52a8\u4f5c"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26579v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ContactFlow: A video action conditioning that transfers across embodiments", "tldr": "\u75283D\u63a5\u89e6\u8f68\u8ff9\u5b9e\u73b0\u8de8\u5f62\u6001\u64cd\u4f5c\u8fc1\u79fb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Contact Flow\uff0c\u4e00\u79cd\u4e0e\u5177\u4f53\u6267\u884c\u4f53\u65e0\u5173\u7684\u52a8\u4f5c\u6761\u4ef6\u8868\u793a\uff0c\u7528\u64cd\u4f5c\u8005\u4e0e\u76ee\u6807\u7269\u4f53\u4e4b\u95f4\u76843D\u63a5\u89e6\u70b9\u8f68\u8ff9\u6765\u63cf\u8ff0\u64cd\u4f5c\u3002\u57fa\u4e8e\u8be5\u8868\u793a\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u7528\u4e8e\u673a\u5668\u4eba\u5728\u6267\u884c\u524d\u60f3\u8c61\u548c\u9a8c\u8bc1\u64cd\u4f5c\u7ed3\u679c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u89c6\u9891\u4e16\u754c\u6a21\u578b\u96be\u4ee5\u5efa\u6a21\u63a5\u89e6\u7269\u7406\u3001\u52a8\u4f5c\u6761\u4ef6\u7ed1\u5b9a\u7279\u5b9a\u673a\u68b0\u624b\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u53ef\u8de8\u4eba\u7c7b\u793a\u8303\u548c\u4e0d\u540c\u673a\u5668\u4eba\u5f62\u6001\u8fc1\u79fb\u7684\u901a\u7528\u52a8\u4f5c\u8868\u793a\uff0c\u5bf9\u673a\u5668\u4eba\u4ece\u89c6\u9891\u5b66\u4e60\u548c\u89c4\u5212\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Cinematic video generation is challenging for text-to-video diffusion models due to concurrent requirements on multi-shot generation, fine-grained controllability over characters and scenes, and long-form generation across extended temporal horizons. Existing methods rely on customization and retraining to separately address specific requirements, and cannot simultaneously fulfill all the requirements with a unified framework. In this paper, we shed light on the training-free paradigm with the key insight that the difficulty of multi-shot generation arises from a structural bias toward temporal continuity in pretrained video diffusion models, and consequently, propose a unified framework named CineWeaver to achieve reference-controllable multi-shot long-video generation without retraining. We manipulate positional encoding and attention patterns to break temporal continuity during inference to enable clear shot transitions using pretrained video diffusion models. Furthermore, we extend the proposed framework with a shot-routed reference conditioning mechanism for per-shot fine-grained controllability, and develop an anchor memory mechanism to allow long-form generation with consistent global appearance cues. To our best knowledge, CineWeaver is the first unified framework to simultaneously enable \\textbf{long-form}, \\textbf{reference-controllable}, and \\textbf{multi-shot} video generation in a training-free fashion. Experimental results demonstrate that CineWeaver produces high-quality cinematic videos of long durations with consistent identities, stable global appearance, and clear shot transitions. The project page is available at: https://cineweaver.github.io.", "arxiv_id": "2607.26529", "arxiv_url": "https://arxiv.org/abs/2607.26529", "authors": ["Yuyang Huang", "Yabo Chen", "Wenrui Dai", "Ziyang Zheng", "Haibin Huang", "Chi Zhang", "Junni Zou", "Hongkai Xiong", "Xuelong Li"], "brief": "CineWeaver \u662f\u4e00\u4e2a\u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u514d\u8bad\u7ec3\u6846\u67b6\uff0c\u7528\u4e8e\u7535\u5f71\u53d9\u4e8b\u4e2d\u7684\u591a\u955c\u5934\u3001\u957f\u65f6\u957f\u3001\u53c2\u8003\u53ef\u63a7\u89c6\u9891\u751f\u6210\u3002\u5b83\u901a\u8fc7\u63a8\u7406\u9636\u6bb5\u6539\u9020\u4f4d\u7f6e\u7f16\u7801\u3001\u6ce8\u610f\u529b\u6a21\u5f0f\u548c\u53c2\u8003\u6761\u4ef6\u8def\u7531\uff0c\u5b9e\u73b0\u955c\u5934\u5207\u6362\u3001\u89d2\u8272\u4e00\u81f4\u6027\u4e0e\u5168\u5c40\u5916\u89c2\u7a33\u5b9a\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26529", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u65f6\u95f4\u8fde\u7eed\u6027\u7ed3\u6784\u504f\u7f6e\u662f\u591a\u955c\u5934\u751f\u6210\u56f0\u96be\u7684\u6838\u5fc3\u539f\u56e0\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u6253\u7834\u8be5\u8fde\u7eed\u6027\u4ee5\u5f62\u6210\u6e05\u6670\u955c\u5934\u8f6c\u573a", "\u63d0\u51fa shot-routed reference conditioning\uff0c\u8ba9\u4e0d\u540c\u955c\u5934\u53ef\u5206\u522b\u4f7f\u7528\u53c2\u8003\u56fe\u50cf\u8fdb\u884c\u7ec6\u7c92\u5ea6\u89d2\u8272\u4e0e\u573a\u666f\u63a7\u5236", "\u8bbe\u8ba1 anchor memory \u673a\u5236\uff0c\u5728\u957f\u89c6\u9891\u751f\u6210\u4e2d\u7ef4\u6301\u8eab\u4efd\u4e0e\u5168\u5c40\u5916\u89c2\u7ebf\u7d22\u7684\u4e00\u81f4\u6027"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001", "\u957f\u89c6\u9891"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26529v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CineWeaver: Training-Free Reference-Controllable Multi-Shot Long Video Generation for Cinematic Storytelling", "tldr": "\u514d\u8bad\u7ec3\u751f\u6210\u53ef\u63a7\u591a\u955c\u5934\u957f\u89c6\u9891", "upvotes": 0, "what_it_is": "CineWeaver \u662f\u4e00\u4e2a\u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u514d\u8bad\u7ec3\u6846\u67b6\uff0c\u7528\u4e8e\u7535\u5f71\u53d9\u4e8b\u4e2d\u7684\u591a\u955c\u5934\u3001\u957f\u65f6\u957f\u3001\u53c2\u8003\u53ef\u63a7\u89c6\u9891\u751f\u6210\u3002\u5b83\u901a\u8fc7\u63a8\u7406\u9636\u6bb5\u6539\u9020\u4f4d\u7f6e\u7f16\u7801\u3001\u6ce8\u610f\u529b\u6a21\u5f0f\u548c\u53c2\u8003\u6761\u4ef6\u8def\u7531\uff0c\u5b9e\u73b0\u955c\u5934\u5207\u6362\u3001\u89d2\u8272\u4e00\u81f4\u6027\u4e0e\u5168\u5c40\u5916\u89c2\u7a33\u5b9a\u3002", "why_notable": "\u8fd9\u662f\u9996\u4e2a\u514d\u8bad\u7ec3\u540c\u65f6\u652f\u6301\u957f\u89c6\u9891\u3001\u591a\u955c\u5934\u548c\u53c2\u8003\u53ef\u63a7\u751f\u6210\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u964d\u4f4e\u4e86\u7535\u5f71\u7ea7\u89c6\u9891\u751f\u6210\u5bf9\u5b9a\u5236\u8bad\u7ec3\u7684\u4f9d\u8d56\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "AI-assisted coding increasingly translates informal user intent into executable software, yet coding requests often contain ambiguities that recur in user-specific ways across tasks and sessions. Existing disambiguation methods typically address each ambiguous request in isolation within the current coding session, often through eliciting additional clarification. However, whether resolved session history from the same user can serve as memory for resolving recurring personalized ambiguity in a newly opened session remains underexplored. We formulate personalized ambiguity adaptation as a new task: given a user\u0027s previously resolved coding sessions and a new ambiguous request, an assistant should identify the recurring ambiguity pattern, produce the intended executable solution, and minimize clarification. To benchmark this task, we introduce CAPA, which characterizes personalized coding ambiguity through six mechanisms and injects these mechanisms into unambiguous executable tasks using a controlled three-stage generation pipeline. CAPA contains 600 coding sessions across 60 balanced user--ambiguity cells, including 300 held-out evaluation sessions. We evaluate 12 recent LLMs under no-history and same-user-history conditions using executable success, first-turn success, and turns-to-completion. Our analyses examine task difficulty, user identity, and memory-based history use, and we further propose same-user history gating as a lightweight inference-time method. CAPA provides a foundation for developing long-term coding assistants that better align generated code with user intent while reducing repeated clarification.", "arxiv_id": "2607.26611", "arxiv_url": "https://arxiv.org/abs/2607.26611", "authors": ["Zijian Xu", "Wenshuo Zhang", "Zisen Qin", "Rui Sheng", "Yushi Sun", "Huamin Qu", "Chuhan Shi"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u4e2a\u6027\u5316\u6b67\u4e49\u9002\u5e94\u201d\u4efb\u52a1\uff1a\u5229\u7528\u540c\u4e00\u7528\u6237\u8fc7\u53bb\u5df2\u89e3\u51b3\u7684\u7f16\u7801\u4f1a\u8bdd\uff0c\u5728\u65b0\u4f1a\u8bdd\u4e2d\u8bc6\u522b\u5176\u53cd\u590d\u51fa\u73b0\u7684\u6b67\u4e49\u6a21\u5f0f\u5e76\u751f\u6210\u7b26\u5408\u610f\u56fe\u7684\u4ee3\u7801\u3002\u4f5c\u8005\u6784\u5efa CAPA \u57fa\u51c6\uff0c\u7cfb\u7edf\u8bc4\u6d4b 12 \u4e2a\u8fd1\u671f LLM \u5728\u6709\u65e0\u540c\u7528\u6237\u5386\u53f2\u6761\u4ef6\u4e0b\u7684\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26611", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["CAPA \u8986\u76d6 6 \u7c7b\u4e2a\u6027\u5316\u7f16\u7801\u6b67\u4e49\u673a\u5236\uff0c\u5305\u542b 600 \u4e2a\u7f16\u7801\u4f1a\u8bdd\u300160 \u4e2a\u7528\u6237-\u6b67\u4e49\u5747\u8861\u5355\u5143\uff0c\u5176\u4e2d 300 \u4e2a\u4e3a\u4fdd\u7559\u8bc4\u6d4b\u4f1a\u8bdd", "\u8bc4\u6d4b\u6307\u6807\u5305\u62ec\u53ef\u6267\u884c\u6210\u529f\u7387\u3001\u9996\u8f6e\u6210\u529f\u7387\u548c\u5b8c\u6210\u6240\u9700\u8f6e\u6570\uff0c\u7528\u4e8e\u8861\u91cf\u6a21\u578b\u662f\u5426\u80fd\u5c11\u6f84\u6e05\u4e14\u6b63\u786e\u5b8c\u6210\u4efb\u52a1", "\u63d0\u51fa same-user history gating \u4f5c\u4e3a\u8f7b\u91cf\u63a8\u7406\u65f6\u65b9\u6cd5\uff0c\u5e2e\u52a9\u6a21\u578b\u9009\u62e9\u6027\u5229\u7528\u540c\u7528\u6237\u5386\u53f2\u8bb0\u5fc6"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u4e2a\u6027\u5316", "\u957f\u671f\u8bb0\u5fc6", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26611v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Fewer Clarifications, Better Code: Benchmarking Cross-Session Personalized Ambiguity Adaptation in Coding Assistants", "tldr": "\u7528\u5386\u53f2\u4f1a\u8bdd\u51cf\u5c11\u4ee3\u7801\u9700\u6c42\u6b67\u4e49\u6f84\u6e05", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u4e2a\u6027\u5316\u6b67\u4e49\u9002\u5e94\u201d\u4efb\u52a1\uff1a\u5229\u7528\u540c\u4e00\u7528\u6237\u8fc7\u53bb\u5df2\u89e3\u51b3\u7684\u7f16\u7801\u4f1a\u8bdd\uff0c\u5728\u65b0\u4f1a\u8bdd\u4e2d\u8bc6\u522b\u5176\u53cd\u590d\u51fa\u73b0\u7684\u6b67\u4e49\u6a21\u5f0f\u5e76\u751f\u6210\u7b26\u5408\u610f\u56fe\u7684\u4ee3\u7801\u3002\u4f5c\u8005\u6784\u5efa CAPA \u57fa\u51c6\uff0c\u7cfb\u7edf\u8bc4\u6d4b 12 \u4e2a\u8fd1\u671f LLM \u5728\u6709\u65e0\u540c\u7528\u6237\u5386\u53f2\u6761\u4ef6\u4e0b\u7684\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4ee3\u7801\u52a9\u624b\u4ece\u5355\u6b21\u4f1a\u8bdd\u5185\u6d88\u6b67\u63a8\u8fdb\u5230\u8de8\u4f1a\u8bdd\u3001\u4e2a\u6027\u5316\u8bb0\u5fc6\u5229\u7528\uff0c\u8d34\u8fd1\u771f\u5b9e\u957f\u671f\u4f7f\u7528\u573a\u666f\uff1bCAPA \u53ef\u4f5c\u4e3a\u8bc4\u4f30\u957f\u671f\u4ee3\u7801\u52a9\u624b\u662f\u5426\u7406\u89e3\u7528\u6237\u4e60\u60ef\u4e0e\u51cf\u5c11\u91cd\u590d\u6f84\u6e05\u7684\u57fa\u7840\u57fa\u51c6\u3002"}, {"abstract": "Safety classifiers (\"guards\") are the dominant black-box defense for vision-language models, yet they judge an input\u0027s surface form, not its meaning: a harmful request re-encoded as set theory, formal logic, a rare language, code, or an image of text slips past a guard that would block it in plain language -- the decode gap. The natural fix is a guard-agnostic recover-and-decode amplifier that transcribes image content and restates encoded text into its plain payload before the guard, so any off-the-shelf classifier can screen the true request. We build this amplifier and evaluate it against the attacker\u0027s best case: an ensemble of eleven attacks, scoring a behavior as broken if any succeeds (best-of-suite, following AutoAttack) -- rarely reported for jailbreak defenses, yet ~3.5x the per-attack mean. This exposes our central finding: an empirical safety-utility ceiling for the non-iterative recovery defenses we evaluate, across five guards and two target VLMs. The amplifier only partly closes the gap -- the undefended ensemble breaks 89-91% of behaviors, and the best guard-plus-amplifier still leaves 63-65% -- and its gain over the guard alone is significant in only four of ten guard-target pairs. It is guard-agnostic at the interface, but not uniformly so in effect. A modular reguard layer closes much of the residual, yet drives benign over-refusal to 81-92% for well-calibrated guards; the one laxer guard that stays usable never reaches deployable safety (48% ensemble ASR). No configuration we evaluate reaches both low attack-success and low over-refusal, for the pipeline we study and for representation-shifting attacks -- encodings and cross-modal renders that leave a legible payload, not pixel- or embedding-space attacks. We contribute the amplifier, an ensemble evaluation that makes the trade-off visible, and a map of where recovery-based VLM defense works and where it does not.", "arxiv_id": "2607.26574", "arxiv_url": "https://arxiv.org/abs/2607.26574", "authors": ["Haoyu Zhang", "Zhuoxi Wang", "Shibo Zheng", "Zijian Xiao", "Xiangchen Guan", "Mohammad Zandsalimy", "Shanu Sushmita"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u201c\u6062\u590d-\u89e3\u7801-\u518d\u9632\u62a4\u201d\u6d41\u6c34\u7ebf\uff1a\u5148\u5c06\u56fe\u50cf\u6587\u672c\u8f6c\u5199\u3001\u5c06\u7f16\u7801\u8bf7\u6c42\u8fd8\u539f\u4e3a\u660e\u6587\u8bed\u4e49\uff0c\u518d\u4ea4\u7ed9\u4efb\u610f\u5b89\u5168\u5206\u7c7b\u5668\u7b5b\u67e5\u3002\u4f5c\u8005\u752811\u7c7b\u7f16\u7801/\u8de8\u6a21\u6001\u8d8a\u72f1\u653b\u51fb\u7684\u96c6\u6210\u8bc4\u6d4b\uff0c\u7cfb\u7edf\u5206\u6790\u8be5\u7c7b\u9632\u5fa1\u5728VLM\u5b89\u5168\u4e2d\u7684\u4e0a\u9650\u4e0e\u4ee3\u4ef7\u3002", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26574", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63ed\u793a\u201cdecode gap\u201d\uff1a\u5b89\u5168\u5206\u7c7b\u5668\u5e38\u53ea\u770b\u8f93\u5165\u8868\u9762\u5f62\u5f0f\uff0c\u9762\u5bf9\u96c6\u5408\u8bba\u3001\u5f62\u5f0f\u903b\u8f91\u3001\u7a00\u6709\u8bed\u8a00\u3001\u4ee3\u7801\u3001\u56fe\u50cf\u6587\u5b57\u7b49\u91cd\u7f16\u7801\u6709\u5bb3\u8bf7\u6c42\u65f6\u5bb9\u6613\u5931\u6548\u3002", "\u5728best-of-suite\u8bc4\u6d4b\u4e0b\uff0c\u672a\u9632\u5fa1VLM\u7684\u653b\u51fb\u6210\u529f\u7387\u8fbe89-91%\uff1b\u6700\u4f73guard+amplifier\u4ecd\u670963-65%\u7684\u884c\u4e3a\u88ab\u653b\u7834\u3002", "\u52a0\u5165\u6a21\u5757\u5316reguard\u5c42\u53ef\u8fdb\u4e00\u6b65\u964d\u4f4e\u6b8b\u4f59\u653b\u51fb\uff0c\u4f46\u4f1a\u5bfc\u81f4\u826f\u6027\u8bf7\u6c42\u8fc7\u5ea6\u62d2\u7edd\u7387\u5347\u81f381-92%\uff0c\u96be\u4ee5\u540c\u65f6\u517c\u987e\u5b89\u5168\u6027\u4e0e\u53ef\u7528\u6027\u3002"], "keywords": ["\u591a\u6a21\u6001\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb", "\u5b89\u5168\u8bc4\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26574v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Recover, Decode, Reguard: Guard-Agnostic Defense Amplification againstEncoded VLM Jailbreaks", "tldr": "\u6062\u590d\u89e3\u7801\u96be\u6321\u7f16\u7801\u5f0fVLM\u8d8a\u72f1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u201c\u6062\u590d-\u89e3\u7801-\u518d\u9632\u62a4\u201d\u6d41\u6c34\u7ebf\uff1a\u5148\u5c06\u56fe\u50cf\u6587\u672c\u8f6c\u5199\u3001\u5c06\u7f16\u7801\u8bf7\u6c42\u8fd8\u539f\u4e3a\u660e\u6587\u8bed\u4e49\uff0c\u518d\u4ea4\u7ed9\u4efb\u610f\u5b89\u5168\u5206\u7c7b\u5668\u7b5b\u67e5\u3002\u4f5c\u8005\u752811\u7c7b\u7f16\u7801/\u8de8\u6a21\u6001\u8d8a\u72f1\u653b\u51fb\u7684\u96c6\u6210\u8bc4\u6d4b\uff0c\u7cfb\u7edf\u5206\u6790\u8be5\u7c7b\u9632\u5fa1\u5728VLM\u5b89\u5168\u4e2d\u7684\u4e0a\u9650\u4e0e\u4ee3\u4ef7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u53ea\u662f\u63d0\u51fa\u9632\u5fa1\u6a21\u5757\uff0c\u66f4\u7528\u63a5\u8fd1\u653b\u51fb\u8005\u6700\u4f18\u7684\u96c6\u6210\u8bc4\u6d4b\u66b4\u9732\u4e86\u6062\u590d\u5f0fVLM\u9632\u5fa1\u7684\u73b0\u5b9e\u74f6\u9888\uff1a\u5355\u8f6e\u8bed\u4e49\u6062\u590d\u65e0\u6cd5\u53ef\u9760\u6d88\u9664\u7f16\u7801\u8d8a\u72f1\uff0c\u5f3a\u5316\u9632\u62a4\u53c8\u4f1a\u4e25\u91cd\u727a\u7272\u53ef\u7528\u6027\uff0c\u5bf9\u90e8\u7f72\u9ed1\u76d2\u5b89\u5168guard\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) have demonstrated strong capabilities in knowledge acquisition and reasoning, yet their ability to retain previously acquired knowledge under repeated updates remains insufficiently understood. Existing evaluation paradigms primarily focus on single-step reasoning or static knowledge editing, which fail to capture the temporal dynamics of knowledge retention and degradation during continual model modification. In this work, we propose ForgetBench, a benchmark designed to systematically characterize forgetting behavior in LLMs under continual knowledge editing. ForgetBench introduces two complementary evaluation paradigms, namely concept-based QA and scenario-based QA, to disentangle isolated factual retention from structured relational knowledge preservation. Building upon a sequential editing framework, we construct temporally ordered knowledge streams and evaluate model behavior across multiple editing stages. To quantitatively analyze long-term retention dynamics, we further introduce a unified evaluation framework that models knowledge evolution over time, enabling the measurement of temporal decay, retention strength, and cross-instance stability. Extensive experiments across diverse models and editing methods demonstrate that existing approaches fail to strike a balance between long-term retention and generalization quality. Our findings highlight the need for more robust memory mechanisms that can effectively acquire, update, and preserve knowledge over time in future LLMs. Code will be released upon acceptance.", "arxiv_id": "2607.26455", "arxiv_url": "https://arxiv.org/abs/2607.26455", "authors": ["Ruxi Gu", "Zhenliang Zhang", "Wei Wang"], "brief": "\u8bba\u6587\u63d0\u51fa ForgetBench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u8bed\u8a00\u6a21\u578b\u5728\u8fde\u7eed\u77e5\u8bc6\u7f16\u8f91\u540e\u7684\u957f\u671f\u53c2\u6570\u8bb0\u5fc6\u4fdd\u6301\u4e0e\u9000\u5316\u3002\u5b83\u901a\u8fc7\u6982\u5ff5\u578b\u95ee\u7b54\u548c\u573a\u666f\u578b\u95ee\u7b54\uff0c\u5206\u522b\u8003\u5bdf\u5b64\u7acb\u4e8b\u5b9e\u8bb0\u5fc6\u4e0e\u7ed3\u6784\u5316\u5173\u7cfb\u77e5\u8bc6\u7684\u4fdd\u7559\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26455", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u65f6\u95f4\u6709\u5e8f\u7684\u77e5\u8bc6\u6d41\uff0c\u5728\u591a\u8f6e\u987a\u5e8f\u7f16\u8f91\u9636\u6bb5\u8ffd\u8e2a\u6a21\u578b\u77e5\u8bc6\u53d8\u5316", "\u63d0\u51fa\u7edf\u4e00\u8bc4\u4f30\u6846\u67b6\uff0c\u91cf\u5316\u65f6\u95f4\u8870\u51cf\u3001\u8bb0\u5fc6\u5f3a\u5ea6\u548c\u8de8\u6837\u672c\u7a33\u5b9a\u6027", "\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u77e5\u8bc6\u7f16\u8f91\u65b9\u6cd5\u96be\u4ee5\u540c\u65f6\u517c\u987e\u957f\u671f\u4fdd\u7559\u4e0e\u6cdb\u5316\u8d28\u91cf"], "keywords": ["\u77e5\u8bc6\u7f16\u8f91", "\u6301\u7eed\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26455v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ForgetBench: Benchmarking Forgetting Dynamics of Long-Term Parametric Memory in Language Models", "tldr": "\u8bc4\u6d4b\u5927\u6a21\u578b\u8fde\u7eed\u77e5\u8bc6\u7f16\u8f91\u4e2d\u7684\u9057\u5fd8\u52a8\u6001", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ForgetBench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u8bed\u8a00\u6a21\u578b\u5728\u8fde\u7eed\u77e5\u8bc6\u7f16\u8f91\u540e\u7684\u957f\u671f\u53c2\u6570\u8bb0\u5fc6\u4fdd\u6301\u4e0e\u9000\u5316\u3002\u5b83\u901a\u8fc7\u6982\u5ff5\u578b\u95ee\u7b54\u548c\u573a\u666f\u578b\u95ee\u7b54\uff0c\u5206\u522b\u8003\u5bdf\u5b64\u7acb\u4e8b\u5b9e\u8bb0\u5fc6\u4e0e\u7ed3\u6784\u5316\u5173\u7cfb\u77e5\u8bc6\u7684\u4fdd\u7559\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u77e5\u8bc6\u7f16\u8f91\u8bc4\u6d4b\u4ece\u9759\u6001\u5355\u6b65\u6269\u5c55\u5230\u957f\u671f\u52a8\u6001\u8fc7\u7a0b\uff0c\u63ed\u793a\u4e86\u5f53\u524d LLM \u53c2\u6570\u8bb0\u5fc6\u673a\u5236\u5728\u6301\u7eed\u66f4\u65b0\u4e2d\u7684\u5173\u952e\u77ed\u677f\uff0c\u5bf9\u6301\u7eed\u5b66\u4e60\u3001\u6a21\u578b\u7f16\u8f91\u548c\u53ef\u66f4\u65b0\u5927\u6a21\u578b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A known limitation of long-context language models is their increasingly unreliable performance in non-additive, set-based aggregation as context length grows. Examples include cardinality estimation, set relationships, and grouped statistics, which widely exist in logs, program outputs, tables, and multi-turn conversations. To provide the aggregation state required by these tasks, we introduce a model-side aggregation interface that maintains compact Hash-based HyperLogLog (HLL) sketch states alongside a frozen language model. While the model processes the context, an extractor maps each relevant record to a canonical identity. The identity is then hashed and updates the HLL state. These states can be merged across context segments and/or read out directly for downstream reasoning, avoiding an additional generate-execute-return cycle. We validate the proposed approach by setting the HLL state size as 2 KiB (2,048 registers), which does not increase with context length or set cardinality. In a distinct-count experiment involving one million records, the mean relative error was 1.6%. In a separate merge test, states built from as many as 256 segments produced exactly the same readout as a single pass over the same stream. On 3,969 aggregate-then-reason tasks from 174 source windows, the fixed-budget interface reached 99.2% accuracy on Gemma 4 (31B, BF16), compared with 100.0% under exact aggregation; the paired gap was 0.8 percentage points (95% window-cluster CI: 0.5-1.3 points). On a matched set of 174 items, our method improved over direct full-context reasoning by 63.2 points on Qwen and 56.3 points on Gemma. The corresponding gains over chain-of-thought (CoT) reasoning were 60.9 and 63.2 points, respectively. On a fixed 1,200-task Oolong-Synth subset, our method reached 91.1% on Qwen and 99.3% on Gemma. Code is available at https://github.com/songdc98/sketchops.", "arxiv_id": "2607.26448", "arxiv_url": "https://arxiv.org/abs/2607.26448", "authors": ["Dachuan Song", "Junyu Yin", "Zechen Hu", "Xuan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6a21\u578b\u4fa7\u805a\u5408\u63a5\u53e3\uff0c\u5728\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u5904\u7406\u957f\u4e0a\u4e0b\u6587\u65f6\u540c\u6b65\u7ef4\u62a4\u7d27\u51d1\u7684 HyperLogLog \u8349\u56fe\u72b6\u6001\u3002\u8be5\u72b6\u6001\u53ef\u8de8\u7247\u6bb5\u5408\u5e76\u6216\u76f4\u63a5\u8bfb\u51fa\uff0c\u7528\u4e8e\u53bb\u91cd\u8ba1\u6570\u3001\u96c6\u5408\u5173\u7cfb\u548c\u5206\u7ec4\u7edf\u8ba1\u7b49\u975e\u52a0\u6027\u805a\u5408\u4efb\u52a1\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26448", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u56fa\u5b9a 2 KiB \u7684 HLL \u72b6\u6001\uff0c\u5927\u5c0f\u4e0d\u968f\u4e0a\u4e0b\u6587\u957f\u5ea6\u6216\u96c6\u5408\u57fa\u6570\u589e\u957f\uff1b\u767e\u4e07\u8bb0\u5f55\u53bb\u91cd\u8ba1\u6570\u5e73\u5747\u76f8\u5bf9\u8bef\u5dee\u4e3a 1.6%", "\u652f\u6301\u8de8\u4e0a\u4e0b\u6587\u7247\u6bb5\u5408\u5e76\uff0c\u6700\u591a 256 \u4e2a\u7247\u6bb5\u5408\u5e76\u540e\u7684\u8bfb\u6570\u4e0e\u5355\u6b21\u6d41\u5f0f\u5904\u7406\u5b8c\u5168\u4e00\u81f4", "\u5728 3969 \u4e2a\u805a\u5408\u540e\u63a8\u7406\u4efb\u52a1\u4e0a\uff0cGemma 4 \u8fbe\u5230 99.2% \u51c6\u786e\u7387\uff0c\u8f83\u76f4\u63a5\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u548c CoT \u63a8\u7406\u63d0\u5347\u8d85\u8fc7 50 \u4e2a\u767e\u5206\u70b9"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u8bed\u8a00\u6a21\u578b", "\u6570\u636e\u805a\u5408", "\u6982\u7387\u8349\u56fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26448v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Mergeable Model-Side Aggregation States for Long-Context Language Models", "tldr": "\u7528HLL\u8349\u56fe\u589e\u5f3a\u957f\u4e0a\u4e0b\u6587\u805a\u5408\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6a21\u578b\u4fa7\u805a\u5408\u63a5\u53e3\uff0c\u5728\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u5904\u7406\u957f\u4e0a\u4e0b\u6587\u65f6\u540c\u6b65\u7ef4\u62a4\u7d27\u51d1\u7684 HyperLogLog \u8349\u56fe\u72b6\u6001\u3002\u8be5\u72b6\u6001\u53ef\u8de8\u7247\u6bb5\u5408\u5e76\u6216\u76f4\u63a5\u8bfb\u51fa\uff0c\u7528\u4e8e\u53bb\u91cd\u8ba1\u6570\u3001\u96c6\u5408\u5173\u7cfb\u548c\u5206\u7ec4\u7edf\u8ba1\u7b49\u975e\u52a0\u6027\u805a\u5408\u4efb\u52a1\u3002", "why_notable": "\u5b83\u628a\u7ecf\u5178\u6d41\u5f0f\u8349\u56fe\u7ed3\u6784\u5f15\u5165\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u6d41\u7a0b\uff0c\u4ee5\u6781\u5c0f\u56fa\u5b9a\u5185\u5b58\u8865\u8db3\u957f\u4e0a\u4e0b\u6587\u6a21\u578b\u5728\u96c6\u5408\u578b\u805a\u5408\u4e0a\u7684\u7cfb\u7edf\u6027\u77ed\u677f\uff0c\u907f\u514d\u989d\u5916\u7684\u751f\u6210-\u6267\u884c-\u8fd4\u56de\u5faa\u73af\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "What types of decision problems can a causally masked, finite-precision transformer solve for inputs of arbitrary length? Existing answers often rely on idealized arithmetic, but under finite precision, rounding and evaluation order can change what information attention retains and therefore what the model can compute. We develop an algebraic formalization that derives expressivity directly from the model\u0027s implemented dynamics. Its central object is its memory; the finite internal state computed by attention that summarizes the information from the prefix available to all future queries. Each attention head updates its own state independently within a layer, while layers compose hierarchically, providing a uniform route from model assumptions to expressivity bounds. Applying this method to transformers without positional embeddings, we obtain an expressivity hierarchy governed by the attention type under specific numerical semantics. Width-one sliding-window attention supports bounded-suffix memory, while a modified form of soft attention supports irreversible, checklist-like state, and combining the two mechanisms provides an interplay of both. Ordinary left-to-right floating-point soft attention can realize more expressive memory operations than any of the above. Algebraically, the four cases correspond to definite, R-trivial, locally R-trivial, and aperiodic semigroups. Under an explicit free-wiring assumption, all four bounds are tight.", "arxiv_id": "2607.26988", "arxiv_url": "https://arxiv.org/abs/2607.26988", "authors": ["Franz Nowak", "Ryan Cotterell", "Reda Boumasmoud"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4ee3\u6570\u5316\u6846\u67b6\uff0c\u4ece\u56e0\u679c\u63a9\u7801\u6709\u9650\u7cbe\u5ea6 Transformer \u7684\u5b9e\u9645\u8ba1\u7b97\u52a8\u6001\u51fa\u53d1\uff0c\u5206\u6790\u5176\u53ef\u89e3\u51b3\u7684\u4efb\u610f\u957f\u5ea6\u8f93\u5165\u51b3\u7b56\u95ee\u9898\u3002\u6838\u5fc3\u5bf9\u8c61\u662f attention \u4ea7\u751f\u7684\u6709\u9650\u201c\u8bb0\u5fc6\u201d\u72b6\u6001\uff0c\u5e76\u7528\u534a\u7fa4\u7ed3\u6784\u523b\u753b\u4e0d\u540c\u6ce8\u610f\u529b\u673a\u5236\u7684\u8868\u8fbe\u529b\u8fb9\u754c\u3002", "categories": ["cs.FL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26988", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u7684\u524d\u7f00\u6458\u8981\u5efa\u6a21\u4e3a\u6709\u9650\u5185\u90e8\u72b6\u6001\uff0c\u5c42\u95f4\u4ee5\u5c42\u7ea7\u65b9\u5f0f\u7ec4\u5408\uff0c\u4ece\u800c\u7edf\u4e00\u63a8\u5bfc\u8868\u8fbe\u529b\u4e0a\u754c\u4e0e\u4e0b\u754c\u3002", "\u5728\u65e0\u4f4d\u7f6e\u7f16\u7801 Transformer \u4e2d\uff0c\u4e0d\u540c attention \u7c7b\u578b\u5bf9\u5e94\u4e0d\u540c\u8868\u8fbe\u529b\u5c42\u7ea7\uff1a\u6ed1\u52a8\u7a97\u53e3\u3001\u6539\u9020 soft attention\u3001\u4e8c\u8005\u7ec4\u5408\u3001\u666e\u901a\u6d6e\u70b9 left-to-right soft attention \u80fd\u5b9e\u73b0\u9010\u6b65\u66f4\u5f3a\u7684\u8bb0\u5fc6\u64cd\u4f5c\u3002", "\u56db\u7c7b\u673a\u5236\u5206\u522b\u5bf9\u5e94 definite\u3001R-trivial\u3001locally R-trivial\u3001aperiodic \u534a\u7fa4\uff1b\u5728\u663e\u5f0f free-wiring \u5047\u8bbe\u4e0b\uff0c\u8fd9\u4e9b\u8868\u8fbe\u529b\u754c\u662f\u7d27\u7684\u3002"], "keywords": ["Transformer\u7406\u8bba", "\u5f62\u5f0f\u8bed\u8a00", "\u6ce8\u610f\u529b\u673a\u5236", "\u8ba1\u7b97\u590d\u6742\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26988v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Compositional Theory of Causally Masked Transformers", "tldr": "\u523b\u753b\u6709\u9650\u7cbe\u5ea6\u56e0\u679cTransformer\u8868\u8fbe\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4ee3\u6570\u5316\u6846\u67b6\uff0c\u4ece\u56e0\u679c\u63a9\u7801\u6709\u9650\u7cbe\u5ea6 Transformer \u7684\u5b9e\u9645\u8ba1\u7b97\u52a8\u6001\u51fa\u53d1\uff0c\u5206\u6790\u5176\u53ef\u89e3\u51b3\u7684\u4efb\u610f\u957f\u5ea6\u8f93\u5165\u51b3\u7b56\u95ee\u9898\u3002\u6838\u5fc3\u5bf9\u8c61\u662f attention \u4ea7\u751f\u7684\u6709\u9650\u201c\u8bb0\u5fc6\u201d\u72b6\u6001\uff0c\u5e76\u7528\u534a\u7fa4\u7ed3\u6784\u523b\u753b\u4e0d\u540c\u6ce8\u610f\u529b\u673a\u5236\u7684\u8868\u8fbe\u529b\u8fb9\u754c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6709\u9650\u7cbe\u5ea6\u3001\u820d\u5165\u548c\u8ba1\u7b97\u987a\u5e8f\u7b49\u5b9e\u9645\u6570\u503c\u8bed\u4e49\u7eb3\u5165 Transformer \u8868\u8fbe\u529b\u5206\u6790\uff0c\u907f\u514d\u4f9d\u8d56\u7406\u60f3\u5316\u7b97\u672f\uff0c\u4e3a\u7406\u89e3\u56e0\u679c Transformer \u5728\u5f62\u5f0f\u8bed\u8a00\u548c\u957f\u5e8f\u5217\u51b3\u7b56\u4efb\u52a1\u4e2d\u7684\u7406\u8bba\u80fd\u529b\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u5b9e\u73b0\u7684\u6846\u67b6\u3002"}, {"abstract": "Multi-agent LLM pipeline systems break down the task among multiple roles for better reasoning, but are benchmarked mainly with large-scale commercial models. In this study, we investigate Parishad, a structured multi-agent system involving five roles, by deploying it on Qwen2.5-7B-Instruct, a local model, on two datasets: GSM8K (500 questions) and HumanEval (164 questions), compared with prompting directly and two-call self-refinement. The multi-agent system drops GSM8K accuracy from 75.0\\% to 45.0\\% with JSON data format due to the error accumulation problem. With plaintext format, the accuracy is restored to 82.0\\%. A two-call self-refinement strategy (V1) can achieve 86.2\\% accuracy on GSM8K, with 7.4$\\times$ lower token usage. However, the same V1 implementation on HumanEval---where direct accuracy is already 96.3\\%---actively destroys performance (66.5\\%). A task-aware gated redesign (V2) applied to HumanEval preserves accuracy at 95.1\\%. Our results demonstrate that communication format and implementation details determine outcomes more than architectural complexity, and that simpler approaches match or outperform multi-agent pipelines for local 7B model deployment. All code and data are released.", "arxiv_id": "2607.26922", "arxiv_url": "https://arxiv.org/abs/2607.26922", "authors": ["Ashish Prajapati", "Om Mohite"], "brief": "\u672c\u6587\u8bc4\u4f30\u7ed3\u6784\u5316\u4e94\u89d2\u8272\u591a\u667a\u80fd\u4f53\u7cfb\u7edf Parishad \u5728\u672c\u5730 Qwen2.5-7B-Instruct \u4e0a\u7684\u8868\u73b0\uff0c\u5e76\u4e0e\u76f4\u63a5\u63d0\u793a\u548c\u4e24\u6b21\u8c03\u7528\u81ea\u6211\u6539\u8fdb\u6bd4\u8f83\u3002\u5b9e\u9a8c\u8986\u76d6 GSM8K \u4e0e HumanEval\uff0c\u53d1\u73b0\u6d41\u7a0b\u590d\u6742\u5ea6\u4e0d\u5982\u901a\u4fe1\u683c\u5f0f\u548c\u4efb\u52a1\u9002\u914d\u91cd\u8981\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26922", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5728 GSM8K \u4e0a\uff0cJSON \u901a\u4fe1\u683c\u5f0f\u5bfc\u81f4\u591a\u667a\u80fd\u4f53\u9519\u8bef\u7d2f\u79ef\uff0c\u51c6\u786e\u7387\u4ece\u76f4\u63a5\u63d0\u793a\u768475.0%\u964d\u81f345.0%\uff1b\u6539\u7528\u7eaf\u6587\u672c\u540e\u6062\u590d\u523082.0%\u3002", "\u4e24\u6b21\u8c03\u7528\u81ea\u6211\u6539\u8fdb V1 \u5728 GSM8K \u8fbe\u523086.2%\u51c6\u786e\u7387\uff0c\u540c\u65f6 token \u7528\u91cf\u6bd4\u591a\u667a\u80fd\u4f53\u4f4e7.4\u500d\u3002", "\u540c\u4e00\u81ea\u6211\u6539\u8fdb\u7b56\u7565\u5728 HumanEval \u4e0a\u4f1a\u7834\u574f\u539f\u672c96.3%\u7684\u76f4\u63a5\u63d0\u793a\u6027\u80fd\uff0c\u964d\u81f366.5%\uff1b\u52a0\u5165\u4efb\u52a1\u611f\u77e5\u95e8\u63a7\u7684 V2 \u53ef\u4fdd\u630195.1%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u6211\u6539\u8fdb", "\u672c\u5730\u6a21\u578b", "\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26922v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Two Calls Beat Five Agents: Evaluating Multi-Agent Pipelines Against Self-Refinement for Local Language Models", "tldr": "\u672c\u57307B\u6a21\u578b\u4e0a\uff0c\u4e24\u6b21\u81ea\u6211\u6539\u8fdb\u80dc\u8fc7\u4e94\u667a\u80fd\u4f53\u6d41\u7a0b", "upvotes": 0, "what_it_is": "\u672c\u6587\u8bc4\u4f30\u7ed3\u6784\u5316\u4e94\u89d2\u8272\u591a\u667a\u80fd\u4f53\u7cfb\u7edf Parishad \u5728\u672c\u5730 Qwen2.5-7B-Instruct \u4e0a\u7684\u8868\u73b0\uff0c\u5e76\u4e0e\u76f4\u63a5\u63d0\u793a\u548c\u4e24\u6b21\u8c03\u7528\u81ea\u6211\u6539\u8fdb\u6bd4\u8f83\u3002\u5b9e\u9a8c\u8986\u76d6 GSM8K \u4e0e HumanEval\uff0c\u53d1\u73b0\u6d41\u7a0b\u590d\u6742\u5ea6\u4e0d\u5982\u901a\u4fe1\u683c\u5f0f\u548c\u4efb\u52a1\u9002\u914d\u91cd\u8981\u3002", "why_notable": "\u8bba\u6587\u63d0\u9192\u672c\u5730\u5c0f\u6a21\u578b\u90e8\u7f72\u4e2d\uff0c\u591a\u667a\u80fd\u4f53\u67b6\u6784\u5e76\u4e0d\u5929\u7136\u4f18\u4e8e\u7b80\u5355\u7b56\u7565\uff1b\u901a\u4fe1\u683c\u5f0f\u3001\u9519\u8bef\u4f20\u64ad\u4e0e\u4efb\u52a1\u611f\u77e5\u63a7\u5236\u53ef\u80fd\u6bd4\u589e\u52a0\u667a\u80fd\u4f53\u89d2\u8272\u66f4\u5173\u952e\uff0c\u5bf9\u4f4e\u6210\u672c LLM agent \u7cfb\u7edf\u8bbe\u8ba1\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "While text-to-image diffusion models achieve impressive visual quality, they frequently struggle to maintain precise alignment with complex compositional prompts. An effective strategy is to improve the inference process of diffusion models, thereby better leveraging their pretrained priors to address misalignment. Existing training-free methods can be divided into two categories. The first category focuses on improving the randomly sampled initial noise, either performing costly search over noise pools or manipulating sampled noise without ensuring reliable semantic injection. The second category focuses on improving the denoising trajectory, lacking explicit mechanisms to timely diagnose and correct semantic errors. we propose \\textbf{AnchorSteer}, a training-free framework that exerts fine-grained control over \\textbf{both initialization} and \\textbf{the denoising trajectory}. AnchorSteer consists of two synergistic components: \\textbf{Semantic Anchoring} replaces uninformative Gaussian noise with text-aligned initializations via CLIP-based prior extraction and a novel Latent-Prior Score Distillation Sampling (LP-SDS) objective. Specifically, LP-SDS distills CLIP visual priors into the knowledge distribution of diffusion models, mitigating the domain gap between CLIP-based priors and diffusion-based priors. \\textbf{Reflective Steering} transforms passive denoising with an active Think--Erase--Retouch loop that enables mid-generation self-correction. It leverages VLM-based diagnosis to detect semantic deviations and performs targeted latent refinement to suppress erroneous content and recover missing attributes. Extensive experiments on GenEval and T2I-CompBench++ demonstrate that AnchorSteer consistently outperforms existing baselines in text--image alignment while preserving high visual quality.", "arxiv_id": "2607.26647", "arxiv_url": "https://arxiv.org/abs/2607.26647", "authors": ["Xinyi Wang", "Yuyang Huang", "Yalin Su", "Pengcheng Luan", "Tao Zhang", "Feiming Wei", "Wenxian Yu"], "brief": "\u8bba\u6587\u63d0\u51fa AnchorSteer\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6587\u751f\u56fe\u6269\u6563\u63a8\u7406\u6846\u67b6\uff0c\u540c\u65f6\u4f18\u5316\u521d\u59cb\u566a\u58f0\u4e0e\u53bb\u566a\u8f68\u8ff9\u3002\u5b83\u7528\u8bed\u4e49\u951a\u5b9a\u751f\u6210\u6587\u672c\u5bf9\u9f50\u7684\u521d\u59cb\u6f5c\u53d8\u91cf\uff0c\u5e76\u7528\u53cd\u601d\u5f0f\u5f15\u5bfc\u5728\u751f\u6210\u4e2d\u8bca\u65ad\u3001\u64e6\u9664\u548c\u4fee\u8865\u8bed\u4e49\u504f\u5dee\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26647", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Semantic Anchoring \u901a\u8fc7 CLIP \u5148\u9a8c\u63d0\u53d6\u4e0e LP-SDS \u76ee\u6807\uff0c\u5c06\u89c6\u89c9\u8bed\u4e49\u5148\u9a8c\u84b8\u998f\u5230\u6269\u6563\u6a21\u578b\u6f5c\u7a7a\u95f4\uff0c\u66ff\u4ee3\u7eaf\u9ad8\u65af\u968f\u673a\u566a\u58f0\u521d\u59cb\u5316\u3002", "Reflective Steering \u5f15\u5165 Think--Erase--Retouch \u5faa\u73af\uff0c\u5229\u7528 VLM \u8bca\u65ad\u751f\u6210\u8fc7\u7a0b\u4e2d\u7684\u9519\u6f0f\u5c5e\u6027\uff0c\u5e76\u8fdb\u884c\u5b9a\u5411\u6f5c\u53d8\u91cf\u7ec6\u5316\u3002", "\u5728 GenEval \u548c T2I-CompBench++ \u4e0a\uff0c\u76f8\u6bd4\u73b0\u6709\u8bad\u7ec3\u514d\u8d39\u65b9\u6cd5\u63d0\u5347\u6587\u672c-\u56fe\u50cf\u5bf9\u9f50\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u89c6\u89c9\u8d28\u91cf\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6587\u751f\u56fe", "\u591a\u6a21\u6001", "\u63a8\u7406\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26647v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Anchoring and Steering Diffusion: Enhancing the Faithfulness of Text-to-Image Generation at Inference Time", "tldr": "\u63a8\u7406\u671f\u951a\u5b9a\u4e0e\u7ea0\u504f\u63d0\u5347\u6587\u751f\u56fe\u4e00\u81f4\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AnchorSteer\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6587\u751f\u56fe\u6269\u6563\u63a8\u7406\u6846\u67b6\uff0c\u540c\u65f6\u4f18\u5316\u521d\u59cb\u566a\u58f0\u4e0e\u53bb\u566a\u8f68\u8ff9\u3002\u5b83\u7528\u8bed\u4e49\u951a\u5b9a\u751f\u6210\u6587\u672c\u5bf9\u9f50\u7684\u521d\u59cb\u6f5c\u53d8\u91cf\uff0c\u5e76\u7528\u53cd\u601d\u5f0f\u5f15\u5bfc\u5728\u751f\u6210\u4e2d\u8bca\u65ad\u3001\u64e6\u9664\u548c\u4fee\u8865\u8bed\u4e49\u504f\u5dee\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e0d\u9700\u91cd\u65b0\u8bad\u7ec3\u6a21\u578b\uff0c\u5374\u540c\u65f6\u5904\u7406\u521d\u59cb\u5316\u4e0d\u53ef\u9760\u4e0e\u53bb\u566a\u8fc7\u7a0b\u7f3a\u4e4f\u7ea0\u9519\u4e24\u7c7b\u5173\u952e\u95ee\u9898\uff0c\u5bf9\u590d\u6742\u7ec4\u5408\u63d0\u793a\u7684\u6587\u751f\u56fe\u53ef\u63a7\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We address the problem of reconstructing a high-fidelity, freely navigable 3D scene from a single $360^\\circ$ panorama, without per-scene optimization or multi-view capture. Existing methods either lack metric trajectory control, which hinders reliable downstream 3D reconstruction, or struggle with large disocclusions under long-range camera motion while requiring high-end multi-GPU servers.We present Genie Sim PanoWorld, a two-stage feed-forward pipeline that bridges generation and reconstruction via an explicit, trajectory-controllable panoramic video. A NavMesh-planned $\\mathrm{SE}(3)$ roaming trajectory is injected into a latent video diffusion model through dense geometry-warped conditioning; long--short trajectory mixed training and a self-consistency objective based on shortcut models together yield high-fidelity video in four CFG-free denoising steps. A feed-forward panoramic reconstructor then lifts the generated video into a high-fidelity 3D Gaussian scene that supports real-time, free-viewpoint roaming and can be directly used as a simulation-ready asset for embodied AI applications. Experiments show that Genie Sim PanoWorld outperforms geometry-conditioned baselines in both panoramic video generation and downstream 3D reconstruction, while generalizing zero-shot to unseen indoor scenes.", "arxiv_id": "2607.26646", "arxiv_url": "https://arxiv.org/abs/2607.26646", "authors": ["Yongxin Su", "Linjie Hou", "Feng Wang", "Jialin Tang", "Zhijun Li", "Qian Wang", "Maoqing Yao"], "brief": "\u8bba\u6587\u63d0\u51fa Genie Sim PanoWorld\uff0c\u4e00\u4e2a\u4ece\u5355\u5f20360\u00b0\u5168\u666f\u56fe\u751f\u6210\u53ef\u81ea\u7531\u6f2b\u6e38\u9ad8\u4fdd\u771f\u5ba4\u51853D\u573a\u666f\u7684\u4e24\u9636\u6bb5\u524d\u9988\u6d41\u6c34\u7ebf\u3002\u5b83\u5148\u751f\u6210\u8f68\u8ff9\u53ef\u63a7\u7684\u5168\u666f\u89c6\u9891\uff0c\u518d\u5c06\u89c6\u9891\u91cd\u5efa\u4e3a\u5b9e\u65f6\u53ef\u6e32\u67d3\u76843D Gaussian\u573a\u666f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26646", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7 NavMesh \u89c4\u5212\u7684 SE(3) \u6f2b\u6e38\
