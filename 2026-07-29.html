793a\u5207\u6362\u4e0b\u66f4\u7a33\u5065\uff0c\u540c\u65f6\u66f4\u597d\u4fdd\u7559\u4e0b\u6e38\u4e13\u4e1a\u80fd\u529b\u3002", "categories": ["cs.AI", "cs.CL", "cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27081", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u6a21\u578b\u5bf9\u9f50", "\u77e5\u8bc6\u84b8\u998f", "\u8d8a\u72f1\u9632\u5fa1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27081v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "On-Policy Distillation for LLM Safety: A Routing Approach to Template-Robust Realignment", "tldr": "\u672c\u6587\u63d0\u51fa Routing-based On-Policy Distillation\uff08ROPD\uff09\uff0c\u7528\u4e8e\u4fee\u590d\u88ab\u6076\u610f\u5fae\u8c03\u6570\u636e\u690d\u5165\u6709\u5bb3\u884c\u4e3a\u7684\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u901a\u8fc7\u5efa\u6a21\u5bf9\u9f50\u6a21\u578b\u4e0e\u53d7\u635f\u6a21\u578b\u8f93\u51fa\u5206\u5e03\u5dee\u5f02\uff0c\u800c\u975e\u4f9d\u8d56\u7279\u5b9a\u653b\u51fb\u63d0\u793a\u6a21\u677f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u591a\u79cd\u73b0\u6709\u5b89\u5168\u91cd\u5bf9\u9f50\u65b9\u6cd5\uff0cROPD \u5728\u653b\u51fb\u6a21\u677f\u4e0d\u5339\u914d\u548c\u7cfb\u7edf\u63d0\u793a\u5207\u6362\u4e0b\u66f4\u7a33\u5065\uff0c\u540c\u65f6\u66f4\u597d\u4fdd\u7559\u4e0b\u6e38\u4e13\u4e1a\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Memory systems allow agents to retain and reuse information from past interactions, but they can also let malicious content persist. A malicious instruction crafted by an attacker may be stored in long-term memory, recalled much later, and quietly shape a real action. Recent benchmarks increasingly examine agent memory security, yet few trace the same malicious semantics across persistence, downstream consequences, and selective repair under diverse memory-backend comparisons. To address this gap, we introduce MemSecBench, a task-grounded benchmark for the lifecycle security of agent memory systems. It contains 310 cases drawn from 48 realistic contexts across code and science, daily life, and office work. Each case follows a controlled Write--Execute--Forget protocol in an isolated runtime under an exact agent configuration, defined by an agent harness, a memory backend, and an LLM backend. Evidence-based adjudication combines a deterministic write check, checkpoint-specific judge-model evaluations, and programmatic gates across seven lifecycle checkpoints. The experimental design spans a 24-configuration matrix of two agent harnesses, four memory backends, and three LLM backends. Across all 24 configurations, malicious memory persists in 84.2% of all cases, and the full Write--Execute chain succeeds in 50.3%. Among successfully poisoned cases, 59.6% complete the full Execute chain, while 56.1% achieve selective repair.Compared with matched Native configurations, the largest absolute differences are 16.1 percentage points for end-to-end attack success and 41.3 percentage points for selective repair. These descriptive contrasts indicate that the evaluated memory system stacks differ in lifecycle security, both in the propagation of malicious memory and in selective repair after successful memory poisoning.", "arxiv_id": "2607.27080", "arxiv_url": "https://arxiv.org/abs/2607.27080", "authors": ["Xuanze Chen", "Xukang Xie", "Wentao Fu", "Jiajun Zhou", "Shanqing Yu", "Qi Xuan"], "brief": "\u672c\u6587\u63d0\u51fa MemSecBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u4e2d\u6076\u610f\u5185\u5bb9\u4ece\u5199\u5165\u6301\u4e45\u5316\u3001\u540e\u7eed\u6267\u884c\u5f71\u54cd\u5230\u9009\u62e9\u6027\u4fee\u590d\u7684\u5b8c\u6574\u5b89\u5168\u751f\u547d\u5468\u671f\u3002\u57fa\u51c6\u5305\u542b310\u4e2a\u771f\u5b9e\u573a\u666f\u6848\u4f8b\uff0c\u5e76\u6bd4\u8f8324\u79cd\u667a\u80fd\u4f53\u6846\u67b6\u3001\u8bb0\u5fc6\u540e\u7aef\u548cLLM\u540e\u7aef\u7ec4\u5408\uff0c\u53d1\u73b0\u6076\u610f\u8bb0\u5fc6\u572884.2%\u6848\u4f8b\u4e2d\u4f1a\u6301\u4e45\u5b58\u5728\uff0c\u7aef\u5230\u7aef\u653b\u51fb\u6210\u529f\u7387\u8fbe50.3%\uff0c\u4e0d\u540c\u7cfb\u7edf\u6808\u5728\u653b\u51fb\u4f20\u64ad\u548c\u4fee\u590d\u80fd\u529b\u4e0a\u5dee\u5f02\u660e\u663e\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27080", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u5b89\u5168", "\u57fa\u51c6\u6d4b\u8bd5", "\u63d0\u793a\u6ce8\u5165"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27080v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MemSecBench: Tracking Agent Memory Poisoning from Persistence to Consequence and Repair", "tldr": "\u672c\u6587\u63d0\u51fa MemSecBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u4e2d\u6076\u610f\u5185\u5bb9\u4ece\u5199\u5165\u6301\u4e45\u5316\u3001\u540e\u7eed\u6267\u884c\u5f71\u54cd\u5230\u9009\u62e9\u6027\u4fee\u590d\u7684\u5b8c\u6574\u5b89\u5168\u751f\u547d\u5468\u671f\u3002\u57fa\u51c6\u5305\u542b310\u4e2a\u771f\u5b9e\u573a\u666f\u6848\u4f8b\uff0c\u5e76\u6bd4\u8f8324\u79cd\u667a\u80fd\u4f53\u6846\u67b6\u3001\u8bb0\u5fc6\u540e\u7aef\u548cLLM\u540e\u7aef\u7ec4\u5408\uff0c\u53d1\u73b0\u6076\u610f\u8bb0\u5fc6\u572884.2%\u6848\u4f8b\u4e2d\u4f1a\u6301\u4e45\u5b58\u5728\uff0c\u7aef\u5230\u7aef\u653b\u51fb\u6210\u529f\u7387\u8fbe50.3%\uff0c\u4e0d\u540c\u7cfb\u7edf\u6808\u5728\u653b\u51fb\u4f20\u64ad\u548c\u4fee\u590d\u80fd\u529b\u4e0a\u5dee\u5f02\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study online convex optimization (OCO) in non-stationary environments under heavy-tailed noise, where the stochastic gradient oracle admits only a finite $p$-th central moment for some $p \\in (1, 2]$. While static regret is well-understood, achieving universal dynamic regret in a parameter-free manner remains an open challenge. We resolve this by proposing \\textbf{HT-PAder}, a parameter-free algorithm combining restarted AdaGrad experts over a geometric pool of block lengths with a pathwise meta-algorithm, \\textbf{AdaGrad-Hedge}, which requires no moment conditions on meta-losses. For a domain of diameter $D$, Lipschitz constant $G$, noise level $\u03c3$, and comparator path length $P_T$, HT-PAder achieves an expected universal dynamic regret of \\[ \\widetilde O\\left( GD\\sqrt{T(1+P_T/D)} + \u03c3D T^{1/p}(1+P_T/D)^{(p-1)/p} \\right). \\] The algorithm does not require prior knowledge of any of these problem parameters. Even in the special case of finite variance ($p=2$), HT-PAder provides the first parameter-free minimax universal dynamic regret guarantee. We also prove a matching lower bound, establishing the optimality of the path-length exponent.", "arxiv_id": "2607.27073", "arxiv_url": "https://arxiv.org/abs/2607.27073", "authors": ["Vaneet Aggarwal"], "brief": "\u672c\u6587\u7814\u7a76\u91cd\u5c3e\u566a\u58f0\u4e0b\u975e\u5e73\u7a33\u5728\u7ebf\u51f8\u4f18\u5316\u7684\u52a8\u6001\u9057\u61be\uff0c\u63d0\u51fa\u53c2\u6570\u65e0\u5173\u7b97\u6cd5 HT-PAder\uff0c\u5c06\u91cd\u542f AdaGrad \u4e13\u5bb6\u4e0e AdaGrad-Hedge \u5143\u7b97\u6cd5\u7ed3\u5408\u3002\u8be5\u65b9\u6cd5\u5728\u65e0\u9700\u9884\u77e5\u8def\u5f84\u957f\u5ea6\u3001\u566a\u58f0\u3001Lipschitz \u7b49\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u8fbe\u5230\u6700\u4f18\u91cf\u7ea7\u7684\u901a\u7528\u52a8\u6001\u9057\u61be\u754c\uff0c\u5e76\u7ed9\u51fa\u5339\u914d\u4e0b\u754c\u8bc1\u660e\u5176\u8def\u5f84\u957f\u5ea6\u6307\u6570\u6700\u4f18\u3002", "categories": ["cs.LG", "cs.AI", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27073", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5728\u7ebf\u51f8\u4f18\u5316", "\u52a8\u6001\u9057\u61be", "\u91cd\u5c3e\u566a\u58f0", "\u53c2\u6570\u65e0\u5173\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27073v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Parameter-Free Dynamic Regret for Online Convex Optimization under Heavy-Tailed Noise", "tldr": "\u672c\u6587\u7814\u7a76\u91cd\u5c3e\u566a\u58f0\u4e0b\u975e\u5e73\u7a33\u5728\u7ebf\u51f8\u4f18\u5316\u7684\u52a8\u6001\u9057\u61be\uff0c\u63d0\u51fa\u53c2\u6570\u65e0\u5173\u7b97\u6cd5 HT-PAder\uff0c\u5c06\u91cd\u542f AdaGrad \u4e13\u5bb6\u4e0e AdaGrad-Hedge \u5143\u7b97\u6cd5\u7ed3\u5408\u3002\u8be5\u65b9\u6cd5\u5728\u65e0\u9700\u9884\u77e5\u8def\u5f84\u957f\u5ea6\u3001\u566a\u58f0\u3001Lipschitz \u7b49\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u8fbe\u5230\u6700\u4f18\u91cf\u7ea7\u7684\u901a\u7528\u52a8\u6001\u9057\u61be\u754c\uff0c\u5e76\u7ed9\u51fa\u5339\u914d\u4e0b\u754c\u8bc1\u660e\u5176\u8def\u5f84\u957f\u5ea6\u6307\u6570\u6700\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Closed yes/no spatial benchmarks can reward a correct answer even when the image adds little support beyond no-image contexts. Under a fixed forced-choice interface, Visual Credit Audit (VCA) separates two estimands: whether the benchmark image gives the model\u0027s declared decision more support than text-only and blank controls, and whether the model responds to relation-specific visual evidence. The first audit is training- and label-free and does not require an answer flip. Applying labels yields dependence-credited correctness (D-CC); on correct items, it equals same-control gold-aligned positive gain, while prediction alignment extends the audit to errors. Across four open MLLMs and two spatial benchmarks, 12.73-26.25% of decisions are correct yet uncredited. Matched same-split image permutation reduces D-CC by 21.25-47.80 points, with every paired 95% interval above zero. Fixed-pixel relation contrasts and a 3x3 evidence-source factorial show why null controls cannot identify relation response. Among controlled correct-but-uncredited agreement decisions, response to relation reversal spans 81.57-100.00%, while 32.11% pooled change answer. Independently audited outcomes on 108 geometry-compatible edits provide a bounded natural-image correspondence check. VCA thereby decomposes benchmark success into correctness, additional image support, and relation-consistent response.", "arxiv_id": "2607.27069", "arxiv_url": "https://arxiv.org/abs/2607.27069", "authors": ["Feixiang Liu", "Qiang Qiu", "Lanbo Sun", "Nan Wei", "Huawei Shen", "Xueqi Cheng"], "brief": "\u8bba\u6587\u63d0\u51fa Visual Credit Audit\uff08VCA\uff09\uff0c\u7528\u4e8e\u5ba1\u8ba1\u591a\u6a21\u6001\u7a7a\u95f4\u63a8\u7406\u57fa\u51c6\u4e2d\u6a21\u578b\u7b54\u6848\u662f\u5426\u771f\u6b63\u83b7\u5f97\u4e86\u56fe\u50cf\u8bc1\u636e\u652f\u6301\uff0c\u800c\u4e0d\u53ea\u662f\u4f9d\u8d56\u6587\u672c\u6216\u7a7a\u767d\u63a7\u5236\u6761\u4ef6\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u591a\u4e2a\u5f00\u653e\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u4e24\u4e2a\u7a7a\u95f4\u57fa\u51c6\u4e0a\u6709 12.73%-26.25% \u7684\u6b63\u786e\u7b54\u6848\u5176\u5b9e\u672a\u83b7\u5f97\u89c6\u89c9\u8bc1\u636e\u4fe1\u7528\uff0c\u56fe\u50cf\u7f6e\u6362\u4f1a\u663e\u8457\u964d\u4f4e\u4f9d\u8d56\u89c6\u89c9\u8bc1\u636e\u7684\u6b63\u786e\u7387\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27069", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u7a7a\u95f4\u63a8\u7406", "\u6a21\u578b\u8bc4\u4f30", "\u89c6\u89c9\u8bc1\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27069v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Visual Credit Audit for Multimodal Spatial Reasoning", "tldr": "\u8bba\u6587\u63d0\u51fa Visual Credit Audit\uff08VCA\uff09\uff0c\u7528\u4e8e\u5ba1\u8ba1\u591a\u6a21\u6001\u7a7a\u95f4\u63a8\u7406\u57fa\u51c6\u4e2d\u6a21\u578b\u7b54\u6848\u662f\u5426\u771f\u6b63\u83b7\u5f97\u4e86\u56fe\u50cf\u8bc1\u636e\u652f\u6301\uff0c\u800c\u4e0d\u53ea\u662f\u4f9d\u8d56\u6587\u672c\u6216\u7a7a\u767d\u63a7\u5236\u6761\u4ef6\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u591a\u4e2a\u5f00\u653e\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u4e24\u4e2a\u7a7a\u95f4\u57fa\u51c6\u4e0a\u6709 12.73%-26.25% \u7684\u6b63\u786e\u7b54\u6848\u5176\u5b9e\u672a\u83b7\u5f97\u89c6\u89c9\u8bc1\u636e\u4fe1\u7528\uff0c\u56fe\u50cf\u7f6e\u6362\u4f1a\u663e\u8457\u964d\u4f4e\u4f9d\u8d56\u89c6\u89c9\u8bc1\u636e\u7684\u6b63\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific figure assessment in peer review differs fundamentally from general image quality evaluation: a figure must be visually legible, faithfully support the manuscript\u0027s claims, and communicate evidence with a clear visual hierarchy. However, if we apply traditional image assessment methods to scientific figure quality assessment, limitations emerge: classic IQA models capture perceptual quality or aesthetics but cannot judge whether a figure serves the paper\u0027s scientific argument; CLIP-based methods assess generic image-text correspondence, yet lack understanding of manuscript context; and zero-shot LLM/VLM judges, when repurposed for figure scoring, often yield overly concentrated scores with limited fusion of visual and textual evidence. We introduce an annotated dataset of 3,857 scientific figures from peer-reviewed conference papers, each rated along four peer-review-oriented dimensions: Clarity, Relevance, Informativeness, and Structure. We propose SciFigAlign, a fine-tuned multimodal scorer that grounds figure quality assessment in manuscript evidence. Given a figure crop, caption, citing paragraphs, and light paper context, SciFigAlign fine-tunes CLIP and SciBERT end-to-end with per-modality cross-attention and CubeMLP fusion, jointly optimizing SmoothL1 regression with a within-paper ranking hinge loss. Under paper-level splits, SciFigAlign achieves a macro MAE of 0.3524 and a within-paper pairwise accuracy of 81.64% on the test set with n = 396, a 59% relative error reduction over the best LLM-as-judge baseline with MAE 0.864. Ablations confirm that manuscript-grounded inputs, citing-context denoising, and ranking supervision are all critical, showing that scientific figure assessment requires learned alignment between visual content and manuscript evidence rather than prompting alone, even with state-of-the-art VLMs.", "arxiv_id": "2607.27066", "arxiv_url": "https://arxiv.org/abs/2607.27066", "authors": ["Chuanzhi Xu", "Zihan Deng", "Huiqi Liang", "Chengkun Yue", "Zhanlin Cui", "Pengfei Ye", "Weidong Cai"], "brief": "\u8bba\u6587\u63d0\u51fa SciFigAlign\uff0c\u7528\u8bba\u6587\u4e0a\u4e0b\u6587\uff08\u56fe\u3001\u6807\u9898\u3001\u5f15\u7528\u6bb5\u843d\u548c\u8f7b\u91cf\u5168\u6587\u4fe1\u606f\uff09\u6765\u8bc4\u4f30\u79d1\u5b66\u56fe\u8868\u5728\u6e05\u6670\u5ea6\u3001\u76f8\u5173\u6027\u3001\u4fe1\u606f\u91cf\u548c\u7ed3\u6784\u4e0a\u7684\u8d28\u91cf\u3002\u4f5c\u8005\u6784\u5efa\u4e86 3857 \u5f20\u4f1a\u8bae\u8bba\u6587\u56fe\u8868\u6807\u6ce8\u6570\u636e\u96c6\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03 CLIP \u4e0e SciBERT\u3001\u591a\u6a21\u6001\u4ea4\u53c9\u6ce8\u610f\u529b\u548c\u6392\u5e8f\u635f\u5931\uff0c\u76f8\u6bd4\u6700\u4f73 LLM \u8bc4\u5ba1\u57fa\u7ebf\u663e\u8457\u964d\u4f4e\u8bef\u5dee\uff0c\u8fbe\u5230 81.64% \u7684\u6587\u5185\u6210\u5bf9\u6392\u5e8f\u51c6\u786e\u7387\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27066", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u79d1\u5b66\u56fe\u8868\u8bc4\u4f30", "\u89c6\u89c9\u6587\u672c\u5bf9\u9f50", "\u8bba\u6587\u8bc4\u5ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27066v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SciFigAlign: Scoring Scientific Figures by Fine-tuned Alignment of Visuals with Manuscript Evidence", "tldr": "\u8bba\u6587\u63d0\u51fa SciFigAlign\uff0c\u7528\u8bba\u6587\u4e0a\u4e0b\u6587\uff08\u56fe\u3001\u6807\u9898\u3001\u5f15\u7528\u6bb5\u843d\u548c\u8f7b\u91cf\u5168\u6587\u4fe1\u606f\uff09\u6765\u8bc4\u4f30\u79d1\u5b66\u56fe\u8868\u5728\u6e05\u6670\u5ea6\u3001\u76f8\u5173\u6027\u3001\u4fe1\u606f\u91cf\u548c\u7ed3\u6784\u4e0a\u7684\u8d28\u91cf\u3002\u4f5c\u8005\u6784\u5efa\u4e86 3857 \u5f20\u4f1a\u8bae\u8bba\u6587\u56fe\u8868\u6807\u6ce8\u6570\u636e\u96c6\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03 CLIP \u4e0e SciBERT\u3001\u591a\u6a21\u6001\u4ea4\u53c9\u6ce8\u610f\u529b\u548c\u6392\u5e8f\u635f\u5931\uff0c\u76f8\u6bd4\u6700\u4f73 LLM \u8bc4\u5ba1\u57fa\u7ebf\u663e\u8457\u964d\u4f4e\u8bef\u5dee\uff0c\u8fbe\u5230 81.64% \u7684\u6587\u5185\u6210\u5bf9\u6392\u5e8f\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While automated defect detection such as the detection of surface scratched is an important aspect in industrial quality control, the scarcity of annotated defect data make this task challenging. This paper presents a procedural rendering pipeline that generates large-scale annotated synthetic training data using BlenderProc, with configurable material appearance, camera modes, and domain randomization, producing automatic COCO-format annotations. To show the potential of our approach, we evaluate four training strategies, namely synthetic-only, real-only, mixed, and fine-tuning from synthetic weights, across two objects with different material properties and three lightweight edge-deployable detectors, YOLOX, YOLO26, and LW-DETR. Our evaluation show that fine-tuning from synthetic weights consistently outperforms real-only training, and that mixed training effectively recovers performance under scarce real-data conditions, with findings validated across both convolutional and transformer-based architectures. The proposed approach enables scalable defect detection without the burden of large real annotated datasets, making it practical for on-device industrial inspection. The pipeline scripts, 3D model, and both synthetic and real annotated scratch datasets for a glossy toy Ferrari car will be made available through the project website upon acceptance.", "arxiv_id": "2607.27065", "arxiv_url": "https://arxiv.org/abs/2607.27065", "authors": ["Paul Julius K\u00fchn", "Saptarshi Neil Sinha", "Tiago Kleist", "Richard Hoffmann", "Arjan kuijper", "Michael Weinmann"], "brief": "\u672c\u6587\u63d0\u51fa ScratchSim\uff0c\u4e00\u4e2a\u57fa\u4e8e BlenderProc \u7684\u7a0b\u5e8f\u5316\u5408\u6210\u6570\u636e\u6d41\u6c34\u7ebf\uff0c\u7528\u4e8e\u751f\u6210\u5e26 COCO \u6807\u6ce8\u7684\u8868\u9762\u5212\u75d5\u68c0\u6d4b\u8bad\u7ec3\u6570\u636e\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5148\u7528\u5408\u6210\u6570\u636e\u9884\u8bad\u7ec3\u518d\u7528\u771f\u5b9e\u6570\u636e\u5fae\u8c03\u901a\u5e38\u4f18\u4e8e\u4ec5\u7528\u771f\u5b9e\u6570\u636e\u8bad\u7ec3\uff0c\u6df7\u5408\u8bad\u7ec3\u4e5f\u80fd\u5728\u771f\u5b9e\u6807\u6ce8\u7a00\u7f3a\u65f6\u6062\u590d\u8f83\u597d\u6027\u80fd\uff0c\u9002\u7528\u4e8e\u8fb9\u7f18\u7aef\u5de5\u4e1a\u8d28\u68c0\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27065", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f3a\u9677\u68c0\u6d4b", "\u5408\u6210\u6570\u636e", "\u76ee\u6807\u68c0\u6d4b", "\u5de5\u4e1a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27065v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ScratchSim: A Procedural Synthetic Data Pipeline for Surface Scratch Detection", "tldr": "\u672c\u6587\u63d0\u51fa ScratchSim\uff0c\u4e00\u4e2a\u57fa\u4e8e BlenderProc \u7684\u7a0b\u5e8f\u5316\u5408\u6210\u6570\u636e\u6d41\u6c34\u7ebf\uff0c\u7528\u4e8e\u751f\u6210\u5e26 COCO \u6807\u6ce8\u7684\u8868\u9762\u5212\u75d5\u68c0\u6d4b\u8bad\u7ec3\u6570\u636e\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5148\u7528\u5408\u6210\u6570\u636e\u9884\u8bad\u7ec3\u518d\u7528\u771f\u5b9e\u6570\u636e\u5fae\u8c03\u901a\u5e38\u4f18\u4e8e\u4ec5\u7528\u771f\u5b9e\u6570\u636e\u8bad\u7ec3\uff0c\u6df7\u5408\u8bad\u7ec3\u4e5f\u80fd\u5728\u771f\u5b9e\u6807\u6ce8\u7a00\u7f3a\u65f6\u6062\u590d\u8f83\u597d\u6027\u80fd\uff0c\u9002\u7528\u4e8e\u8fb9\u7f18\u7aef\u5de5\u4e1a\u8d28\u68c0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Personalized agents are increasingly applied to assist users across a wide range of tasks. Effective personalized assistance requires not only retrieving explicit facts from past interactions stored in agent memory, but also inferring abstract personal characteristics. However, existing memory benchmarks primarily evaluate whether an agent can retrieve information explicitly stated in conversational histories, failing to provide an effective assessment of deeper user understanding. In this work, we propose Setoka, a benchmark for evaluating memory-augmented personalized agents with hierarchical user understanding from heterogeneous data. Grounded in theories from cognitive and personality psychology, Setoka defines four levels of user understanding, i.e., semantic memory, episodic memory, behavior pattern, and personality trait. Moreover, to enable realistic yet privacy-preserving evaluation, we design a psychometrics-based pipeline that synthesizes diverse, coherent heterogeneous user data and queries at scale. Finally, we leverage Setoka to evaluate 3 language models combined with 5 memory systems for 10 synthetic users. Our comprehensive evaluation reveals that while existing systems perform well on semantic memory retrieval, their performance declines on episodic memory. Moreover, when dealing with behavior pattern and personality trait understanding tasks that require integrating heterogeneous and fragmented information dispersed over time, performance declines even further. These findings demonstrate that user understanding cannot be handled by simple fact retrieval, motivating the design of memory mechanisms for cross-source integration and abstraction over long-term user behavior.", "arxiv_id": "2607.27056", "arxiv_url": "https://arxiv.org/abs/2607.27056", "authors": ["Lingyang Zeng", "Guangze Chen", "Kaichen Yu", "Zhicheng Pan", "Siyang Weng", "Zirui Hu", "Xiangyun Du", "Hailin He", "Rong Zhang", "Chengcheng Yang", "Kai Huang", "Xuan Zhou"], "brief": "\u672c\u6587\u63d0\u51fa Setoka\uff0c\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u667a\u80fd\u4f53\u7684\u5c42\u7ea7\u7528\u6237\u7406\u89e3\u57fa\u51c6\uff0c\u8986\u76d6\u8bed\u4e49\u8bb0\u5fc6\u3001\u60c5\u666f\u8bb0\u5fc6\u3001\u884c\u4e3a\u6a21\u5f0f\u548c\u4eba\u683c\u7279\u8d28\u56db\u4e2a\u5c42\u6b21\uff0c\u5e76\u901a\u8fc7\u5fc3\u7406\u6d4b\u91cf\u5b66\u65b9\u6cd5\u5408\u6210\u9690\u79c1\u53cb\u597d\u7684\u5f02\u6784\u7528\u6237\u6570\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u8bed\u8a00\u6a21\u578b\u4e0e\u8bb0\u5fc6\u7cfb\u7edf\u5728\u663e\u5f0f\u4e8b\u5b9e\u68c0\u7d22\u4e0a\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u8de8\u6765\u6e90\u3001\u957f\u671f\u788e\u7247\u5316\u4fe1\u606f\u6574\u5408\u4e0e\u62bd\u8c61\u7406\u89e3\u4e0a\u660e\u663e\u4e0b\u964d\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27056", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e2a\u6027\u5316", "\u8bb0\u5fc6\u7cfb\u7edf", "\u7528\u6237\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27056v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Setoka: A Benchmark for Hierarchical User Understanding in Personalized Agents over Heterogeneous Data", "tldr": "\u672c\u6587\u63d0\u51fa Setoka\uff0c\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u667a\u80fd\u4f53\u7684\u5c42\u7ea7\u7528\u6237\u7406\u89e3\u57fa\u51c6\uff0c\u8986\u76d6\u8bed\u4e49\u8bb0\u5fc6\u3001\u60c5\u666f\u8bb0\u5fc6\u3001\u884c\u4e3a\u6a21\u5f0f\u548c\u4eba\u683c\u7279\u8d28\u56db\u4e2a\u5c42\u6b21\uff0c\u5e76\u901a\u8fc7\u5fc3\u7406\u6d4b\u91cf\u5b66\u65b9\u6cd5\u5408\u6210\u9690\u79c1\u53cb\u597d\u7684\u5f02\u6784\u7528\u6237\u6570\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u8bed\u8a00\u6a21\u578b\u4e0e\u8bb0\u5fc6\u7cfb\u7edf\u5728\u663e\u5f0f\u4e8b\u5b9e\u68c0\u7d22\u4e0a\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u8de8\u6765\u6e90\u3001\u957f\u671f\u788e\u7247\u5316\u4fe1\u606f\u6574\u5408\u4e0e\u62bd\u8c61\u7406\u89e3\u4e0a\u660e\u663e\u4e0b\u964d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Knowledge distillation (KD) enables a compact student model to learn from a powerful teacher and has become an effective paradigm for model compression. The emergence of diverse model architectures has extended KD from homogeneous to heterogeneous settings. However, differences in architectural inductive biases between the teacher and student models often result in substantial representation discrepancies, limiting the effectiveness of direct knowledge transfer. Recently, redundancy suppression has offered a new perspective on heterogeneous KD by preserving cross-architecture invariance and reducing feature redundancy through decorrelation of teacher-student feature correlations. Nevertheless, this formulation may weaken useful structural information through uniform decorrelation, while a fixed coefficient may make the effective contribution of redundancy suppression sensitive to teacher-student pairs and training stages. To address these problems, Correlation Calibration-based Redundancy Suppression (CoCaRS) is proposed to better retain structural information while suppressing redundancy and reduce sensitivity to coefficient settings across teacher-student pairs and training stages. Specifically, CoCaRS calibrates feature decorrelation through Confusion Evidence Estimation (CEE) and Strength Allocation Control (SAC), which respectively capture reliable semantic relations for correlation estimation and preserve discriminative structure during decorrelation. Adaptive Coefficient Regulation (ACR) further regulates the contribution of the calibrated redundancy suppression objective according to its relative loss scale, reducing sensitivity to coefficient settings. Extensive experiments on CIFAR-100 and ImageNet-1K validate the effectiveness of CoCaRS in improving distillation performance and reducing sensitivity to coefficient settings. Code will be released soon.", "arxiv_id": "2607.27054", "arxiv_url": "https://arxiv.org/abs/2607.27054", "authors": ["Fengming Yu", "Haiwei Pan", "Kejia Zhang", "Chunling Chen", "Jian Guan", "Baoying Ma"], "brief": "\u672c\u6587\u63d0\u51fa CoCaRS\uff0c\u7528\u4e8e\u5f02\u6784\u77e5\u8bc6\u84b8\u998f\u4e2d\u7684\u5197\u4f59\u6291\u5236\uff0c\u901a\u8fc7\u76f8\u5173\u6027\u6821\u51c6\u5728\u53bb\u5197\u4f59\u7684\u540c\u65f6\u4fdd\u7559\u6709\u7528\u7684\u7ed3\u6784\u4e0e\u5224\u522b\u4fe1\u606f\u3002\u65b9\u6cd5\u5305\u542b\u6df7\u6dc6\u8bc1\u636e\u4f30\u8ba1\u3001\u5f3a\u5ea6\u5206\u914d\u63a7\u5236\u548c\u81ea\u9002\u5e94\u7cfb\u6570\u8c03\u8282\uff0c\u5728 CIFAR-100 \u4e0e ImageNet-1K \u4e0a\u63d0\u5347\u84b8\u998f\u6548\u679c\uff0c\u5e76\u964d\u4f4e\u5bf9\u8d85\u53c2\u6570\u7cfb\u6570\u7684\u654f\u611f\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27054", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6a21\u578b\u538b\u7f29", "\u5f02\u6784\u6a21\u578b", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27054v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoCaRS: Correlation Calibration-Based Redundancy Suppression for Heterogeneous Knowledge Distillation", "tldr": "\u672c\u6587\u63d0\u51fa CoCaRS\uff0c\u7528\u4e8e\u5f02\u6784\u77e5\u8bc6\u84b8\u998f\u4e2d\u7684\u5197\u4f59\u6291\u5236\uff0c\u901a\u8fc7\u76f8\u5173\u6027\u6821\u51c6\u5728\u53bb\u5197\u4f59\u7684\u540c\u65f6\u4fdd\u7559\u6709\u7528\u7684\u7ed3\u6784\u4e0e\u5224\u522b\u4fe1\u606f\u3002\u65b9\u6cd5\u5305\u542b\u6df7\u6dc6\u8bc1\u636e\u4f30\u8ba1\u3001\u5f3a\u5ea6\u5206\u914d\u63a7\u5236\u548c\u81ea\u9002\u5e94\u7cfb\u6570\u8c03\u8282\uff0c\u5728 CIFAR-100 \u4e0e ImageNet-1K \u4e0a\u63d0\u5347\u84b8\u998f\u6548\u679c\uff0c\u5e76\u964d\u4f4e\u5bf9\u8d85\u53c2\u6570\u7cfb\u6570\u7684\u654f\u611f\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluating large generative models across benchmarks is time-consuming and computationally expensive. This drives the need for methods that can estimate full benchmark performance by evaluating models on only a subset of items, known as a coreset. Current literature mostly requires the practitioner to input a coreset size. However, when reliable performance estimation takes priority over efficiency, an evaluation method should also be capable of automatically determining a coreset size that reflects this priority. We introduce BayesAME, a sequential Bayesian framework specifically targeting automatic determination of the coreset size. BayesAME models performance as a random variable by defining a latent ability for each group of items sharing the same historical model performances, with a joint prior distribution encoding the belief that the target model behaves similarly to these historical models. The posterior distribution over these abilities is used to derive performance estimators, quantify performance uncertainty, and select items to add to the coreset via an information-gain criterion. The coreset is iteratively augmented until the performance estimate fluctuation and the performance uncertainty fall below their respective user-defined thresholds. We propose a multi-target extension that captures performance correlations across multiple target models to further reduce the coreset size. Through extensive experiments across diverse benchmarks, we demonstrate that BayesAME consistently outperforms sequential adaptations of existing methods. Crucially, our comprehensive analysis addresses recent skepticism in the literature, establishing that non-random coreset selection is advantageous over random selection. Finally, we highlight that leveraging continuous response log-likelihoods over traditional binary scores significantly enhances estimation accuracy.", "arxiv_id": "2607.27023", "arxiv_url": "https://arxiv.org/abs/2607.27023", "authors": ["Paula Cordero Encinar", "Taylan Cemgil", "Arnaud Doucet", "Virginia Aglietti", "Silvia Chiappa"], "brief": "BayesAME \u63d0\u51fa\u4e00\u79cd\u5e8f\u8d2f\u8d1d\u53f6\u65af\u4e3b\u52a8\u6a21\u578b\u8bc4\u4f30\u6846\u67b6\uff0c\u53ef\u5728\u8bc4\u4f30\u5927\u578b\u751f\u6210\u6a21\u578b\u65f6\u81ea\u52a8\u51b3\u5b9a\u6838\u5fc3\u96c6\u5927\u5c0f\uff0c\u5e76\u7528\u4fe1\u606f\u589e\u76ca\u9009\u62e9\u9700\u8bc4\u6d4b\u7684\u6837\u672c\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u76f8\u6bd4\u73b0\u6709\u5e8f\u8d2f\u65b9\u6cd5\u66f4\u7a33\u5b9a\u3001\u66f4\u7701\u8bc4\u6d4b\u6210\u672c\uff0c\u4e14\u8bc1\u660e\u975e\u968f\u673a\u6838\u5fc3\u96c6\u9009\u62e9\u548c\u8fde\u7eed\u5bf9\u6570\u4f3c\u7136\u4fe1\u53f7\u80fd\u663e\u8457\u63d0\u5347\u6027\u80fd\u4f30\u8ba1\u7cbe\u5ea6\u3002", "categories": ["cs.LG", "cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27023", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u8bc4\u4f30", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u4e3b\u52a8\u5b66\u4e60", "\u6838\u5fc3\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27023v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BayesAME: Bayesian Active Model Evaluation", "tldr": "BayesAME \u63d0\u51fa\u4e00\u79cd\u5e8f\u8d2f\u8d1d\u53f6\u65af\u4e3b\u52a8\u6a21\u578b\u8bc4\u4f30\u6846\u67b6\uff0c\u53ef\u5728\u8bc4\u4f30\u5927\u578b\u751f\u6210\u6a21\u578b\u65f6\u81ea\u52a8\u51b3\u5b9a\u6838\u5fc3\u96c6\u5927\u5c0f\uff0c\u5e76\u7528\u4fe1\u606f\u589e\u76ca\u9009\u62e9\u9700\u8bc4\u6d4b\u7684\u6837\u672c\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u76f8\u6bd4\u73b0\u6709\u5e8f\u8d2f\u65b9\u6cd5\u66f4\u7a33\u5b9a\u3001\u66f4\u7701\u8bc4\u6d4b\u6210\u672c\uff0c\u4e14\u8bc1\u660e\u975e\u968f\u673a\u6838\u5fc3\u96c6\u9009\u62e9\u548c\u8fde\u7eed\u5bf9\u6570\u4f3c\u7136\u4fe1\u53f7\u80fd\u663e\u8457\u63d0\u5347\u6027\u80fd\u4f30\u8ba1\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep reinforcement policy learning directly in physical robots (on-robot learning) remains bottlenecked by slow wall-clock training times. We present SymmGrid, a trajectory level augmentation framework inspired by parallelized symmetries that super-scales group transformations to significantly accelerate on-robot learning in both egocentric and exocentric visual setups. We model a Markov Decision Process (MDP) under a symmetry tree, in which state-action pairs have admissible parallelized invariant transformations that yield a geometric grid structure. The state is modelled with ego- or exocentric images and proprioception information. The latter require special treatment, in the form of homographies, to warp visual scenes in line with their corresponding spatial transformations. These parallelized transformations produce a large set of unique symmetric equivalences that populate the replay buffer with diverse and consistent experiences that speed up learning and improve performance. We present extensive training and evaluations performed directly on real robot manipulation contact tasks including peg-insertions, cable routing, and object relocations. Relative to SOTA, SymmGrid achieved wall-clock training convergence speed-ups of 1.37-2.17x, evaluation success rate improvements of 1.09x-1.27x, fastest training convergence times of 16.6, 10.9, and 79.3 minutes respectively. For trajectory wide assessments, we used normalized area under the curve (nAUC) ratios. SymmGrid achieved improvements of up to 2.59x. These results confirm that simple branch symmetries can have an outsized result due to super-scaling and bring us closer to sub-10 minute on-robot learning training in manipulation tasks suitable for arms and humanoids. The project page is available at symmgrid-robot.github.io", "arxiv_id": "2607.26985", "arxiv_url": "https://arxiv.org/abs/2607.26985", "authors": ["Gabe Everett", "Brice Gunter", "Ryan Vander Stelt", "Cleiver Ruiz-Martinez", "Blake Hull", "Juan Rojas"], "brief": "SymmGrid \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u5e76\u884c\u5bf9\u79f0\u6027\u7684\u8f68\u8ff9\u7ea7\u6570\u636e\u589e\u5f3a\u6846\u67b6\uff0c\u5c06\u72b6\u6001-\u52a8\u4f5c\u7684\u5bf9\u79f0\u53d8\u6362\u6269\u5c55\u6210\u7f51\u683c\u7ed3\u6784\uff0c\u5e76\u9002\u914d\u81ea\u6211\u4e2d\u5fc3/\u5916\u90e8\u89c6\u89d2\u89c6\u89c9\u8f93\u5165\u4ee5\u52a0\u901f\u771f\u5b9e\u673a\u5668\u4eba\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u3002\u5728\u63d2\u5b54\u3001\u7ebf\u7f06\u5e03\u7ebf\u3001\u7269\u4f53\u642c\u8fd0\u7b49\u771f\u5b9e\u63a5\u89e6\u64cd\u4f5c\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4 SOTA \u5b9e\u73b0 1.37-2.17 \u500d\u8bad\u7ec3\u6536\u655b\u52a0\u901f\u30011.09-1.27 \u500d\u6210\u529f\u7387\u63d0\u5347\uff0c\u90e8\u5206\u4efb\u52a1\u63a5\u8fd1 10 \u5206\u949f\u7ea7\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26985", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u6570\u636e\u589e\u5f3a", "\u89c6\u89c9\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26985v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SymmGrid: Super-Scaling On-Robot Learning with Parallelized Symmetries and Egocentric-Exocentric Visual Perception", "tldr": "SymmGrid \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u5e76\u884c\u5bf9\u79f0\u6027\u7684\u8f68\u8ff9\u7ea7\u6570\u636e\u589e\u5f3a\u6846\u67b6\uff0c\u5c06\u72b6\u6001-\u52a8\u4f5c\u7684\u5bf9\u79f0\u53d8\u6362\u6269\u5c55\u6210\u7f51\u683c\u7ed3\u6784\uff0c\u5e76\u9002\u914d\u81ea\u6211\u4e2d\u5fc3/\u5916\u90e8\u89c6\u89d2\u89c6\u89c9\u8f93\u5165\u4ee5\u52a0\u901f\u771f\u5b9e\u673a\u5668\u4eba\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u3002\u5728\u63d2\u5b54\u3001\u7ebf\u7f06\u5e03\u7ebf\u3001\u7269\u4f53\u642c\u8fd0\u7b49\u771f\u5b9e\u63a5\u89e6\u64cd\u4f5c\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4 SOTA \u5b9e\u73b0 1.37-2.17 \u500d\u8bad\u7ec3\u6536\u655b\u52a0\u901f\u30011.09-1.27 \u500d\u6210\u529f\u7387\u63d0\u5347\uff0c\u90e8\u5206\u4efb\u52a1\u63a5\u8fd1 10 \u5206\u949f\u7ea7\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Large Language Models (MLLMs) rely on a projector to align visual representations with the language embedding space, making it central to cross-modal understanding. In Multimodal Continual Instruction Tuning (MCIT), however, shifting visual distributions and evolving instruction semantics cause this shared projector to drift, leading to projector-level forgetting, an issue largely overlooked by methods that focus primarily on the LLM backbone. We introduce Progressive Multimodal Alignment (PMA), a framework that enables the projector to adapt continually while preserving previously learned alignment. PMA detects multimodal distribution shifts via a lightweight representation descriptor and progressively expands projector experts only when needed. An expandable router integrates expert outputs based on multimodal features, while the original pretrained projector is retained as a stable alignment anchor. This progressive mechanism balances stability and plasticity with sub-linear parameter growth and serves as a method-agnostic add-on to existing MCIT approaches. Extensive experiments on two recent MCIT benchmarks demonstrate that mitigating projector-level forgetting yields consistent gains over prior state-of-the-art methods when combined with PMA. Moreover, PMA scales across diverse MLLM backbones, demonstrating robust and broadly applicable MCIT performance.", "arxiv_id": "2607.26947", "arxiv_url": "https://arxiv.org/abs/2607.26947", "authors": ["Duzhen Zhang", "Yahan Yu", "Qiaoyi Su", "Jiahua Dong", "Tielin Zhang"], "brief": "\u672c\u6587\u6307\u51fa\u591a\u6a21\u6001\u6301\u7eed\u6307\u4ee4\u5fae\u8c03\u4e2d\uff0c\u5171\u4eab\u89c6\u89c9-\u8bed\u8a00\u6295\u5f71\u5668\u4f1a\u56e0\u89c6\u89c9\u5206\u5e03\u548c\u6307\u4ee4\u8bed\u4e49\u53d8\u5316\u800c\u9057\u5fd8\u65e7\u5bf9\u9f50\u5173\u7cfb\u3002\u4f5c\u8005\u63d0\u51fa PMA\uff0c\u901a\u8fc7\u68c0\u6d4b\u5206\u5e03\u6f02\u79fb\u3001\u6309\u9700\u6269\u5c55\u6295\u5f71\u5668\u4e13\u5bb6\u5e76\u4fdd\u7559\u539f\u59cb\u6295\u5f71\u5668\u4f5c\u4e3a\u7a33\u5b9a\u951a\u70b9\uff0c\u5728\u53c2\u6570\u6b21\u7ebf\u6027\u589e\u957f\u4e0b\u63d0\u5347\u7a33\u5b9a\u6027\u4e0e\u53ef\u5851\u6027\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u53ef\u4f5c\u4e3a\u901a\u7528\u63d2\u4ef6\u63d0\u5347\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u5728\u591a\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u9aa8\u5e72\u4e0a\u53d6\u5f97\u7a33\u5b9a\u6536\u76ca\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26947", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u6301\u7eed\u5b66\u4e60", "\u6307\u4ee4\u5fae\u8c03", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26947v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Progressive Multimodal Alignment for Continual Instruction Tuning", "tldr": "\u672c\u6587\u6307\u51fa\u591a\u6a21\u6001\u6301\u7eed\u6307\u4ee4\u5fae\u8c03\u4e2d\uff0c\u5171\u4eab\u89c6\u89c9-\u8bed\u8a00\u6295\u5f71\u5668\u4f1a\u56e0\u89c6\u89c9\u5206\u5e03\u548c\u6307\u4ee4\u8bed\u4e49\u53d8\u5316\u800c\u9057\u5fd8\u65e7\u5bf9\u9f50\u5173\u7cfb\u3002\u4f5c\u8005\u63d0\u51fa PMA\uff0c\u901a\u8fc7\u68c0\u6d4b\u5206\u5e03\u6f02\u79fb\u3001\u6309\u9700\u6269\u5c55\u6295\u5f71\u5668\u4e13\u5bb6\u5e76\u4fdd\u7559\u539f\u59cb\u6295\u5f71\u5668\u4f5c\u4e3a\u7a33\u5b9a\u951a\u70b9\uff0c\u5728\u53c2\u6570\u6b21\u7ebf\u6027\u589e\u957f\u4e0b\u63d0\u5347\u7a33\u5b9a\u6027\u4e0e\u53ef\u5851\u6027\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u53ef\u4f5c\u4e3a\u901a\u7528\u63d2\u4ef6\u63d0\u5347\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u5728\u591a\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u9aa8\u5e72\u4e0a\u53d6\u5f97\u7a33\u5b9a\u6536\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advancements in Computer Go, driven by AlphaZero and MuZero, rely heavily on Monte Carlo Tree Search (MCTS) to correct the errors of the neural network policy. While effective on massive computational clusters, this dependence creates a critical bottleneck on consumer-grade hardware, where the computational cost of tree management severely limits inference rates. Furthermore, without deep search, these models suffer from hallucination, proposing moves with high confidence that are strategically fatal. This paper introduces a novel Belief-Guided architecture that disentangles the Policy head from a distinct Belief head. Unlike traditional value functions, the Belief head acts as an internal simulator and independent critic, modeling epistemic uncertainty and strategic stability. By integrating memory mechanisms (Transformer/GRU) to handle long-term dependencies and the Ko rule, and utilizing a gating mechanism to filter overconfident policy errors, our model shifts the burden of intelligence from runtime search to parametric \"intuition.\" Experimental results demonstrate that this approach significantly improves search-free win rates and reduces hallucination, enabling professional-level play on limited hardware where massive MCTS is infeasible.", "arxiv_id": "2607.26946", "arxiv_url": "https://arxiv.org/abs/2607.26946", "authors": ["Mehrad Yaghoubi", "Azam Bastanfard", "Abbas Jalilvand", "Ashkan Rezaei"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u56f4\u68cb\u4e2d\u7684\u4fe1\u5ff5\u5f15\u5bfc\u51b3\u7b56\u67b6\u6784\uff0c\u5c06\u7b56\u7565\u5934\u4e0e\u72ec\u7acb\u7684\u4fe1\u5ff5\u5934\u89e3\u8026\uff0c\u7528\u4fe1\u5ff5\u5934\u5efa\u6a21\u4e0d\u786e\u5b9a\u6027\u4e0e\u6218\u7565\u7a33\u5b9a\u6027\u3002\u901a\u8fc7\u8bb0\u5fc6\u673a\u5236\u548c\u4e0d\u786e\u5b9a\u6027\u95e8\u63a7\u8fc7\u6ee4\u9ad8\u7f6e\u4fe1\u9519\u8bef\u8d70\u6cd5\uff0c\u5728\u5c11\u7528\u6216\u4e0d\u7528 MCTS \u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u80dc\u7387\u3001\u51cf\u5c11\u5e7b\u89c9\uff0c\u4f7f\u6709\u9650\u786c\u4ef6\u4e0a\u66f4\u63a5\u8fd1\u804c\u4e1a\u6c34\u5e73\u5bf9\u5f08\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26946", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u51b3\u7b56\u667a\u80fd\u4f53", "\u4e0d\u786e\u5b9a\u6027", "\u8499\u7279\u5361\u6d1b\u6811\u641c\u7d22", "\u56f4\u68cbAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26946v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Belief-Guided Decision Making with Uncertainty Gating in the Game of Go", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u56f4\u68cb\u4e2d\u7684\u4fe1\u5ff5\u5f15\u5bfc\u51b3\u7b56\u67b6\u6784\uff0c\u5c06\u7b56\u7565\u5934\u4e0e\u72ec\u7acb\u7684\u4fe1\u5ff5\u5934\u89e3\u8026\uff0c\u7528\u4fe1\u5ff5\u5934\u5efa\u6a21\u4e0d\u786e\u5b9a\u6027\u4e0e\u6218\u7565\u7a33\u5b9a\u6027\u3002\u901a\u8fc7\u8bb0\u5fc6\u673a\u5236\u548c\u4e0d\u786e\u5b9a\u6027\u95e8\u63a7\u8fc7\u6ee4\u9ad8\u7f6e\u4fe1\u9519\u8bef\u8d70\u6cd5\uff0c\u5728\u5c11\u7528\u6216\u4e0d\u7528 MCTS \u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u80dc\u7387\u3001\u51cf\u5c11\u5e7b\u89c9\uff0c\u4f7f\u6709\u9650\u786c\u4ef6\u4e0a\u66f4\u63a5\u8fd1\u804c\u4e1a\u6c34\u5e73\u5bf9\u5f08\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Bot detectors deployed at scale treat traffic as binary: human or bot. This assumption breaks when AI agents browse the web through browser automation, a traffic class that is neither and that binary classifiers structurally cannot represent. We present a three-class detection framework distinguishing humans, bots, and AI agents, and show that the binary-vs-agent confusion is architectural: a binary human-vs-bot detector misroutes agent sessions because its label space lacks an agent class. On our controlled benchmark, an MLP binary classifier misclassifies 39.1% of real AI agents as human and a SAINT binary transformer misclassifies 34.5%; adding an explicit agent class yields per-class agent F1 = 1.000 in all 30 runs (3 model families $\\times$ 10 seeds). To measure evasion resistance, we construct a five-level evasion ladder spanning passive observation, GAN-generated trajectories, and replay of real human cursor data ($n = 2299$ evasion sessions). Across 10 seeds and 3 model families we observe zero agent misses in 22990 per-seed predictions. The discriminative signal is a browser-automation artifact, not evidence of agent reasoning: Playwright does not emit the raw pointer-move and wheel-delta streams a physical input device produces, and this absence signature survives trajectory manipulation. Exhaustive search over all feature subsets of size 1-5 (9401 GBMs) shows that two behavioral features (mouse_event_rate, teleport_click_ratio) give 100% observed agent recall at every evasion level with agent precision 0.994; five features lift macro-F1 to 0.991. The signal is redundantly encoded: removing teleport_click_ratio leaves agent detection at 100%. The single-feature regime is degenerate, flagging every agent only by collapsing the classifier to always predict \"agent\". Two features robustly isolate agents; five separate all three traffic classes at macro-F1 $\\geq 0.99$.", "arxiv_id": "2607.26935", "arxiv_url": "https://arxiv.org/abs/2607.26935", "authors": ["Vishisht Choudhary", "Lukas Schmidt", "Anne Zo\u00eb Kenntner", "Feras Skhab", "Michel Osswald", "Jens Ernstberger"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e09\u5206\u7c7b\u6846\u67b6\u533a\u5206\u4eba\u7c7b\u3001\u4f20\u7edf\u673a\u5668\u4eba\u4e0e\u901a\u8fc7\u6d4f\u89c8\u5668\u81ea\u52a8\u5316\u4e0a\u7f51\u7684 AI \u667a\u80fd\u4f53\uff0c\u6307\u51fa\u4e8c\u5206\u7c7b\u68c0\u6d4b\u5668\u4f1a\u56e0\u7f3a\u5c11\u201c\u667a\u80fd\u4f53\u201d\u7c7b\u522b\u800c\u7cfb\u7edf\u6027\u8bef\u5224\u3002\u5b9e\u9a8c\u53d1\u73b0\u6d4f\u89c8\u5668\u81ea\u52a8\u5316\u7f3a\u5931\u771f\u5b9e\u6307\u9488/\u6eda\u8f6e\u4e8b\u4ef6\u6d41\u8fd9\u4e00\u884c\u4e3a\u75d5\u8ff9\u6781\u5f3a\uff0c\u4ec5\u75282\u4e2a\u884c\u4e3a\u7279\u5f81\u5373\u53ef\u5728\u591a\u79cd\u89c4\u907f\u8bbe\u7f6e\u4e0b\u5b9e\u73b0100%\u667a\u80fd\u4f53\u53ec\u56de\uff0c5\u4e2a\u7279\u5f81\u53ef\u4f7f\u4e09\u7c7b\u5b8fF1\u8fbe\u5230\u7ea60.99\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26935", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u6d4f\u89c8\u5668\u81ea\u52a8\u5316", "\u884c\u4e3a\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26935v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Does It Take to Detect an AI Agent? Minimal Feature Sets for Behavioral Detection under Browser Automation", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e09\u5206\u7c7b\u6846\u67b6\u533a\u5206\u4eba\u7c7b\u3001\u4f20\u7edf\u673a\u5668\u4eba\u4e0e\u901a\u8fc7\u6d4f\u89c8\u5668\u81ea\u52a8\u5316\u4e0a\u7f51\u7684 AI \u667a\u80fd\u4f53\uff0c\u6307\u51fa\u4e8c\u5206\u7c7b\u68c0\u6d4b\u5668\u4f1a\u56e0\u7f3a\u5c11\u201c\u667a\u80fd\u4f53\u201d\u7c7b\u522b\u800c\u7cfb\u7edf\u6027\u8bef\u5224\u3002\u5b9e\u9a8c\u53d1\u73b0\u6d4f\u89c8\u5668\u81ea\u52a8\u5316\u7f3a\u5931\u771f\u5b9e\u6307\u9488/\u6eda\u8f6e\u4e8b\u4ef6\u6d41\u8fd9\u4e00\u884c\u4e3a\u75d5\u8ff9\u6781\u5f3a\uff0c\u4ec5\u75282\u4e2a\u884c\u4e3a\u7279\u5f81\u5373\u53ef\u5728\u591a\u79cd\u89c4\u907f\u8bbe\u7f6e\u4e0b\u5b9e\u73b0100%\u667a\u80fd\u4f53\u53ec\u56de\uff0c5\u4e2a\u7279\u5f81\u53ef\u4f7f\u4e09\u7c7b\u5b8fF1\u8fbe\u5230\u7ea60.99\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Federated Learning (FL) is vulnerable to backdoor attacks because of its distributed nature in edge computing scenarios. Existing defense methods show limited efficacy as they overlook the deviations among benign local updates caused by statistical heterogeneity and the stealthiness of backdoor attacks. To tackle these issues, we propose FedDAB, a two-phase method that combines local contrastive regularization with alignment checking, to defend against backdoor attacks. In the first phase, FedDAB introduces a novel model-contrastive term into the local objective to enhance direction and magnitude consistency among benign updates. In the second phase, FedDAB employs an alignment checking strategy to evaluate each local update in terms of overall-direction alignment and parameter-level alignment with historical information, excluding updates that exhibit abnormal alignment patterns from global aggregation. We theoretically prove FedDAB\u0027s robustness with a convergence rate of $\\mathcal{O}(1/T)$. Extensive experiments show that FedDAB outperforms existing defense methods against backdoor attacks.", "arxiv_id": "2607.26933", "arxiv_url": "https://arxiv.org/abs/2607.26933", "authors": ["Hongliang Zhang", "Zhongyuan Yu", "Guijuan Wang", "Tianqing He", "Wenshuo Ma", "Xiaosong Zhang", "Jiguo Yu"], "brief": "\u672c\u6587\u63d0\u51fa FedDAB\uff0c\u7528\u4e8e\u5728\u8054\u90a6\u5b66\u4e60\u4e2d\u9632\u5fa1\u540e\u95e8\u653b\u51fb\u3002\u65b9\u6cd5\u5148\u901a\u8fc7\u6a21\u578b\u5bf9\u6bd4\u6b63\u5219\u589e\u5f3a\u826f\u6027\u5ba2\u6237\u7aef\u66f4\u65b0\u7684\u4e00\u81f4\u6027\uff0c\u518d\u7528\u5386\u53f2\u4fe1\u606f\u8fdb\u884c\u6574\u4f53\u65b9\u5411\u548c\u53c2\u6570\u7ea7\u5bf9\u9f50\u68c0\u67e5\u4ee5\u5254\u9664\u5f02\u5e38\u66f4\u65b0\uff1b\u7406\u8bba\u7ed9\u51fa\u6536\u655b\u4fdd\u8bc1\uff0c\u5b9e\u9a8c\u4f18\u4e8e\u73b0\u6709\u9632\u5fa1\u65b9\u6cd5\u3002", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26933", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u540e\u95e8\u653b\u51fb", "\u5bf9\u6bd4\u5b66\u4e60", "\u9c81\u68d2\u9632\u5fa1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26933v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Defending Against Backdoor Attacks via Alignment Checking in Model-Contrastive Federated Learning", "tldr": "\u672c\u6587\u63d0\u51fa FedDAB\uff0c\u7528\u4e8e\u5728\u8054\u90a6\u5b66\u4e60\u4e2d\u9632\u5fa1\u540e\u95e8\u653b\u51fb\u3002\u65b9\u6cd5\u5148\u901a\u8fc7\u6a21\u578b\u5bf9\u6bd4\u6b63\u5219\u589e\u5f3a\u826f\u6027\u5ba2\u6237\u7aef\u66f4\u65b0\u7684\u4e00\u81f4\u6027\uff0c\u518d\u7528\u5386\u53f2\u4fe1\u606f\u8fdb\u884c\u6574\u4f53\u65b9\u5411\u548c\u53c2\u6570\u7ea7\u5bf9\u9f50\u68c0\u67e5\u4ee5\u5254\u9664\u5f02\u5e38\u66f4\u65b0\uff1b\u7406\u8bba\u7ed9\u51fa\u6536\u655b\u4fdd\u8bc1\uff0c\u5b9e\u9a8c\u4f18\u4e8e\u73b0\u6709\u9632\u5fa1\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Biomedical laboratory robots must navigate to instruments before performing experimental procedures. Existing embodied navigation platforms are designed for household environments and treat a target as an object center or an arbitrary nearby position. This representation is inadequate for laboratory instruments, which must be approached from their operating side while maintaining safe clearance from surrounding equipment. We introduce BioVLN, a simulation platform for developing and evaluating visual-language navigation agents in biomedical laboratories. BioVLN represents each instrument with three regions: its physical body, a surrounding clearance region, and an operation area in front of the usable side. This model is applied consistently to scene generation, target placement, navigation evaluation, and safety analysis, so success depends on reaching a position from which the instrument can be accessed. BioVLN supports procedural scene generation and manually designed environments, producing 47 scenes and 1667 episodes. Standardized navigation and reinforcement-learning interfaces enable trajectory collection and policy training. Experiments show that geometric exploration reaches 74.4--87.5% success, while sampling multiple valid positions in the operation area improves success to 83.3--92.5% and reduces unsafe proximity.", "arxiv_id": "2607.26914", "arxiv_url": "https://arxiv.org/abs/2607.26914", "authors": ["Zhe Liu", "Quan Lu", "Zhaohui Du", "Zhe Wang", "Huanbo Jin", "Jiaming Gu", "Qi Wang", "Ting Xiao", "Minting Pan", "Dongzhan Zhou"], "brief": "BioVLN \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u751f\u7269\u533b\u5b66\u5b9e\u9a8c\u5ba4\u7684\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u4eff\u771f\u5e73\u53f0\uff0c\u9488\u5bf9\u5b9e\u9a8c\u4eea\u5668\u5efa\u6a21\u4e3a\u672c\u4f53\u3001\u5468\u56f4\u5b89\u5168\u95f4\u9699\u548c\u53ef\u64cd\u4f5c\u533a\u57df\uff0c\u4f7f\u5bfc\u822a\u6210\u529f\u6807\u51c6\u66f4\u8d34\u8fd1\u771f\u5b9e\u5b9e\u9a8c\u5ba4\u64cd\u4f5c\u3002\u5e73\u53f0\u5305\u542b\u7a0b\u5e8f\u5316\u4e0e\u624b\u5de5\u573a\u666f\u300147 \u4e2a\u573a\u666f\u548c 1667 \u4e2a\u4efb\u52a1\uff0c\u5e76\u652f\u6301\u6807\u51c6\u5bfc\u822a\u4e0e\u5f3a\u5316\u5b66\u4e60\u63a5\u53e3\uff1b\u5b9e\u9a8c\u663e\u793a\uff0c\u591a\u91c7\u6837\u53ef\u64cd\u4f5c\u4f4d\u7f6e\u53ef\u5c06\u6210\u529f\u7387\u63d0\u5347\u5230 83.3%\u201392.5%\uff0c\u540c\u65f6\u51cf\u5c11\u4e0d\u5b89\u5168\u63a5\u8fd1\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26914", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u673a\u5668\u4eba", "\u4eff\u771f\u5e73\u53f0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26914v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BioVLN: A Simulation Platform for Visual Language Navigation in Biomedical Laboratories", "tldr": "BioVLN \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u751f\u7269\u533b\u5b66\u5b9e\u9a8c\u5ba4\u7684\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u4eff\u771f\u5e73\u53f0\uff0c\u9 \uff1b\u5b9e\u9a8c\u4e0e Open Bandits \u6848\u4f8b\u8868\u660e\u5176\u5728\u591a\u79cd\u573a\u666f\u53ef\u68c0\u6d4b\u8be5\u73b0\u8c61\uff0c\u4f46\u6837\u672c\u4e0d\u8db3\u65f6\u5b58\u5728\u4e0d\u53ef\u533a\u5206\u533a\u57df\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
