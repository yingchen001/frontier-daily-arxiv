u8f68\u8ff9\uff0c\u5e76\u7528\u51e0\u4f55\u626d\u66f2\u7684\u7a20\u5bc6\u6761\u4ef6\u6ce8\u5165\u6f5c\u5728\u89c6\u9891\u6269\u6563\u6a21\u578b\uff0c\u5b9e\u73b0\u53ef\u63a7\u76f8\u673a\u8fd0\u52a8\u4e0b\u7684\u5168\u666f\u89c6\u9891\u751f\u6210\u3002", "\u91c7\u7528\u957f\u77ed\u8f68\u8ff9\u6df7\u5408\u8bad\u7ec3\u4e0e\u57fa\u4e8e shortcut models \u7684\u81ea\u4e00\u81f4\u6027\u76ee\u6807\uff0c\u5728\u65e0\u9700 CFG \u76844\u6b65\u53bb\u566a\u4e2d\u751f\u6210\u9ad8\u8d28\u91cf\u89c6\u9891\u3002", "\u524d\u9988\u5f0f\u5168\u666f\u91cd\u5efa\u5668\u5c06\u751f\u6210\u89c6\u9891\u63d0\u5347\u4e3a\u9ad8\u4fdd\u771f3D Gaussian\u573a\u666f\uff0c\u652f\u6301\u5b9e\u65f6\u81ea\u7531\u89c6\u89d2\u6f2b\u6e38\uff0c\u5e76\u53ef\u4f5c\u4e3a\u5177\u8eabAI\u4eff\u771f\u8d44\u4ea7\u3002"], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u5168\u666f\u5efa\u6a21", "\u6269\u6563\u6a21\u578b", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26646v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Genie Sim PanoWorld: An Infinite Indoor 3D World Generation Pipeline via Panoramic Scene Modeling and Simulation", "tldr": "\u5355\u5f20\u5168\u666f\u56fe\u751f\u6210\u53ef\u6f2b\u6e38\u5ba4\u51853D\u4e16\u754c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Genie Sim PanoWorld\uff0c\u4e00\u4e2a\u4ece\u5355\u5f20360\u00b0\u5168\u666f\u56fe\u751f\u6210\u53ef\u81ea\u7531\u6f2b\u6e38\u9ad8\u4fdd\u771f\u5ba4\u51853D\u573a\u666f\u7684\u4e24\u9636\u6bb5\u524d\u9988\u6d41\u6c34\u7ebf\u3002\u5b83\u5148\u751f\u6210\u8f68\u8ff9\u53ef\u63a7\u7684\u5168\u666f\u89c6\u9891\uff0c\u518d\u5c06\u89c6\u9891\u91cd\u5efa\u4e3a\u5b9e\u65f6\u53ef\u6e32\u67d3\u76843D Gaussian\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5355\u56fe\u751f\u6210\u3001\u53ef\u63a7\u89c6\u9891\u751f\u6210\u4e0e3D\u91cd\u5efa\u8fde\u63a5\u8d77\u6765\uff0c\u907f\u514d\u9010\u573a\u666f\u4f18\u5316\u548c\u591a\u89c6\u89d2\u91c7\u96c6\uff0c\u964d\u4f4e\u4e86\u9ad8\u8d28\u91cf\u5ba4\u5185\u4eff\u771f\u573a\u666f\u6784\u5efa\u95e8\u69db\uff0c\u5bf9\u5177\u8eabAI\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reliable visual safety understanding in real-world scenarios demands more than just object recognition; it requires causal reasoning under epistemic uncertainty. While Large Vision-Language Models (LVLMs) demonstrate impressive semantic alignment on standard benchmarks, they often struggle to distinguish between superficial correlation and genuine forensic logic when grounded in the dynamic, partially observable nature of first-person experiences. Existing evaluations, dominated by third-person surveillance footage and binary classification metrics, fail to expose this cognitive gap. To address this, we introduce EgoSafe-Bench, a benchmark specifically designed to probe forensic reasoning in egocentric safety scenarios. It comprises 12,000 unique evaluation samples, generated by pairing each of the 3,000 video clips with a QA chain governed by our proposed Hierarchical Reasoning Evaluation (HRE) protocol. Unlike standard benchmarks, HRE mandates a rigorous reasoning trajectory from initial feature anchoring to blind-spot deduction and intent inference, thereby enforcing logical consistency and penalizing shortcut-based predictions.Extensive evaluations of state-of-the-art LVLMs (e.g., Qwen3-VL, Gemini, VideoLLaMA 3) reveal a significant perception-reasoning decoupling: models often achieve high descriptive scores but exhibit notable fragility in causal reasoning and logical closure. Our work provides both a challenging dataset and a systematic evaluation framework to foster the development of logically robust video understanding systems.", "arxiv_id": "2607.26518", "arxiv_url": "https://arxiv.org/abs/2607.26518", "authors": ["Yuyun Chen", "Tianao Li", "TianQuan Feng", "Cen Chen", "Huiping Zhuang", "Hao Peng", "Ziqian Zeng"], "brief": "\u8bba\u6587\u63d0\u51fa EgoSafe-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u7b2c\u4e00\u4eba\u79f0\u79fb\u52a8\u7aef\u89c6\u9891\u7684\u89c6\u89c9\u5b89\u5168\u7406\u89e3\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u5728\u771f\u5b9e\u5b89\u5168\u573a\u666f\u4e2d\u7684\u56e0\u679c\u4e0e\u53d6\u8bc1\u5f0f\u63a8\u7406\u80fd\u529b\u3002\u5176\u6838\u5fc3\u662f\u5206\u5c42\u63a8\u7406\u8bc4\u4f30\u534f\u8bae HRE\uff0c\u8981\u6c42\u6a21\u578b\u4ece\u7279\u5f81\u5b9a\u4f4d\u3001\u76f2\u533a\u63a8\u65ad\u5230\u610f\u56fe\u5224\u65ad\u5f62\u6210\u4e00\u81f4\u63a8\u7406\u94fe\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26518", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5305\u542b 3000 \u4e2a\u7b2c\u4e00\u4eba\u79f0\u89c6\u9891\u7247\u6bb5\uff0c\u5e76\u6784\u5efa 12000 \u4e2a\u72ec\u7279\u8bc4\u6d4b\u6837\u672c", "\u63d0\u51fa HRE \u534f\u8bae\uff0c\u663e\u5f0f\u8003\u5bdf\u7279\u5f81\u951a\u5b9a\u3001\u76f2\u70b9\u63a8\u7406\u3001\u610f\u56fe\u63a8\u65ad\u548c\u903b\u8f91\u4e00\u81f4\u6027", "\u8bc4\u6d4b Qwen3-VL\u3001Gemini\u3001VideoLLaMA 3 \u7b49\u6a21\u578b\uff0c\u53d1\u73b0\u5176\u63cf\u8ff0\u80fd\u529b\u5f3a\u4f46\u56e0\u679c\u63a8\u7406\u8106\u5f31"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u5b89\u5168\u8bc4\u6d4b", "\u56e0\u679c\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26518v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "EgoSafe: A First-Person Mobile-Captured Benchmark for Visual Safety Understanding", "tldr": "\u9996\u4e2a\u7b2c\u4e00\u4eba\u79f0\u89c6\u89c9\u5b89\u5168\u63a8\u7406\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EgoSafe-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u7b2c\u4e00\u4eba\u79f0\u79fb\u52a8\u7aef\u89c6\u9891\u7684\u89c6\u89c9\u5b89\u5168\u7406\u89e3\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u5728\u771f\u5b9e\u5b89\u5168\u573a\u666f\u4e2d\u7684\u56e0\u679c\u4e0e\u53d6\u8bc1\u5f0f\u63a8\u7406\u80fd\u529b\u3002\u5176\u6838\u5fc3\u662f\u5206\u5c42\u63a8\u7406\u8bc4\u4f30\u534f\u8bae HRE\uff0c\u8981\u6c42\u6a21\u578b\u4ece\u7279\u5f81\u5b9a\u4f4d\u3001\u76f2\u533a\u63a8\u65ad\u5230\u610f\u56fe\u5224\u65ad\u5f62\u6210\u4e00\u81f4\u63a8\u7406\u94fe\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u73b0\u6709\u89c6\u89c9\u5b89\u5168\u8bc4\u6d4b\u8fc7\u5ea6\u4f9d\u8d56\u7b2c\u4e09\u4eba\u79f0\u76d1\u63a7\u89c6\u9891\u548c\u4e8c\u5206\u7c7b\u6307\u6807\uff0c\u96be\u4ee5\u63ed\u793a LVLM \u5728\u771f\u5b9e\u7b2c\u4e00\u4eba\u79f0\u573a\u666f\u4e2d\u7684\u8ba4\u77e5\u7f3a\u9677\uff1bEgoSafe-Bench \u4e3a\u5b89\u5168\u5173\u952e\u89c6\u9891\u7406\u89e3\u63d0\u4f9b\u4e86\u66f4\u63a5\u8fd1\u73b0\u5b9e\u3001\u66f4\u5f3a\u8c03\u903b\u8f91\u9c81\u68d2\u6027\u7684\u8bc4\u4f30\u6846\u67b6\u3002"}, {"abstract": "Unified multimodal models (UMMs) aim to integrate understanding and generation within a single architecture, yet it remains unclear whether these capabilities share a unified and transferable semantic space. This question is fundamentally challenging, as the two branches operate over heterogeneous representations (text tokens vs.\\ visual latents) and distinct training objectives, making direct comparison difficult. To address this, we introduce \\emph{cross-branch semantic steering}, an intervention-based framework that extracts semantic directions from one branch and applies them to the other. We show that steering vectors learned from the understanding branch can transfer to generation, enabling controllable image synthesis and improved semantic faithfulness. In contrast, the reverse direction consistently shows limited effectiveness. Our analysis suggests that this asymmetry may be related to a practical representational mismatch: understanding-derived vectors capture transferable, object-centric semantics, while generation-derived vectors primarily encode low-level appearance features. Our results reveal that architectural unification does not guarantee semantic alignment, and establish cross-branch steering as a practical tool for probing multimodal representations.", "arxiv_id": "2607.26411", "arxiv_url": "https://arxiv.org/abs/2607.26411", "authors": ["Yu Wang", "Sharon Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u8de8\u5206\u652f\u8bed\u4e49\u64cd\u63a7\u201d\u6846\u67b6\uff1a\u4ece\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u7406\u89e3\u5206\u652f\u63d0\u53d6\u8bed\u4e49\u65b9\u5411\uff0c\u5e76\u65bd\u52a0\u5230\u751f\u6210\u5206\u652f\uff0c\u53cd\u4e4b\u4ea6\u7136\uff0c\u4ee5\u68c0\u9a8c\u4e24\u8005\u662f\u5426\u5171\u4eab\u53ef\u8fc1\u79fb\u8bed\u4e49\u7a7a\u95f4\u3002\u5b9e\u9a8c\u53d1\u73b0\u7406\u89e3\u5230\u751f\u6210\u53ef\u6709\u6548\u8fc1\u79fb\u5e76\u63d0\u5347\u56fe\u50cf\u751f\u6210\u8bed\u4e49\u4e00\u81f4\u6027\uff0c\u800c\u751f\u6210\u5230\u7406\u89e3\u8fc1\u79fb\u6548\u679c\u6709\u9650\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26411", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u5e72\u9884\u5f0f steering vector \u4f5c\u4e3a\u63a2\u9488\uff0c\u7ed5\u5f00\u6587\u672c token \u4e0e\u89c6\u89c9 latent \u8868\u793a\u5f02\u6784\u5e26\u6765\u7684\u76f4\u63a5\u6bd4\u8f83\u56f0\u96be\u3002", "\u7406\u89e3\u5206\u652f\u5b66\u5230\u7684\u65b9\u5411\u66f4\u504f\u7269\u4f53\u4e2d\u5fc3\u8bed\u4e49\uff0c\u53ef\u7528\u4e8e\u53ef\u63a7\u56fe\u50cf\u5408\u6210\u5e76\u6539\u5584\u8bed\u4e49\u5fe0\u5b9e\u5ea6\u3002", "\u751f\u6210\u5206\u652f\u65b9\u5411\u4e3b\u8981\u7f16\u7801\u4f4e\u5c42\u5916\u89c2\u7279\u5f81\uff0c\u96be\u4ee5\u53cd\u5411\u8fc1\u79fb\u5230\u7406\u89e3\u4efb\u52a1\uff0c\u663e\u793a\u67b6\u6784\u7edf\u4e00\u4e0d\u7b49\u4e8e\u8bed\u4e49\u5bf9\u9f50\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u8868\u5f81\u5206\u6790", "\u53ef\u63a7\u751f\u6210", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26411v1", "published_at": "2026-07-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Do Unified Multimodal Models Think in One Space? A Lens Through Cross-Branch Steering", "tldr": "\u8de8\u5206\u652f\u5e72\u9884\u63ed\u793a\u591a\u6a21\u6001\u8bed\u4e49\u7a7a\u95f4\u4e0d\u5bf9\u79f0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u8de8\u5206\u652f\u8bed\u4e49\u64cd\u63a7\u201d\u6846\u67b6\uff1a\u4ece\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u7406\u89e3\u5206\u652f\u63d0\u53d6\u8bed\u4e49\u65b9\u5411\uff0c\u5e76\u65bd\u52a0\u5230\u751f\u6210\u5206\u652f\uff0c\u53cd\u4e4b\u4ea6\u7136\uff0c\u4ee5\u68c0\u9a8c\u4e24\u8005\u662f\u5426\u5171\u4eab\u53ef\u8fc1\u79fb\u8bed\u4e49\u7a7a\u95f4\u3002\u5b9e\u9a8c\u53d1\u73b0\u7406\u89e3\u5230\u751f\u6210\u53ef\u6709\u6548\u8fc1\u79fb\u5e76\u63d0\u5347\u56fe\u50cf\u751f\u6210\u8bed\u4e49\u4e00\u81f4\u6027\uff0c\u800c\u751f\u6210\u5230\u7406\u89e3\u8fc1\u79fb\u6548\u679c\u6709\u9650\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u662f\u5426\u771f\u6b63\u201c\u5728\u540c\u4e00\u7a7a\u95f4\u601d\u8003\u201d\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u7684\u5206\u6790\u65b9\u6cd5\uff0c\u5e76\u63ed\u793a\u7406\u89e3\u4e0e\u751f\u6210\u80fd\u529b\u4e4b\u95f4\u5b58\u5728\u91cd\u8981\u8868\u5f81\u4e0d\u5bf9\u79f0\uff0c\u5bf9\u591a\u6a21\u6001\u6a21\u578b\u53ef\u63a7\u751f\u6210\u3001\u53ef\u89e3\u91ca\u6027\u548c\u67b6\u6784\u8bbe\u8ba1\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Thermal infrared (TIR) imaging is essential for UAV swarm operations in visually degraded environments. However, tracking tiny UAVs remains challenging due to limited appearance cues, frequent occlusions, and rapid maneuvers. Despite significant progress driven by benchmarks such as the Anti-UAV challenge, existing methods primarily prioritize accuracy while overlooking the computational constraints of real-time edge deployment. The standard Kalman Filter (KF) offers the efficiency required for edge devices, yet its constant-velocity assumption often breaks down under highly dynamic UAV motion and thermal sensor jitter. More sophisticated nonlinear estimators can improve robustness but often introduce additional computational costs. To address this gap, we propose an edge-aware online tracking pipeline centered on the Adaptive Kinematic Kalman Filter (AKKF), which augments the linear KF with state-dependent kinematic modeling while preserving real-time efficiency. Combined with transient false-positive suppression and kinematics-driven predictive coasting, the presented pipeline improves trajectory continuity under challenging TIR conditions. Experiments on the Beyond Strong Baseline (BSB) benchmark provide a starting point for edge-aware UAV tracking by jointly evaluating tracking performance and computational efficiency, offering insights toward future real-time deployment.", "arxiv_id": "2607.12544", "arxiv_url": "https://arxiv.org/abs/2607.12544", "authors": ["Yu-Hsi Chen"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u8fb9\u7f18\u90e8\u7f72\u7684\u5728\u7ebf\u70ed\u7ea2\u5916\u65e0\u4eba\u673a\u8ddf\u8e2a\u6d41\u6c34\u7ebf\uff0c\u6838\u5fc3\u662f\u81ea\u9002\u5e94\u8fd0\u52a8\u5b66\u5361\u5c14\u66fc\u6ee4\u6ce2\u5668\uff08AKKF\uff09\u3002\u5b83\u5728\u4fdd\u6301\u7ebf\u6027\u5361\u5c14\u66fc\u6ee4\u6ce2\u9ad8\u6548\u7387\u7684\u540c\u65f6\uff0c\u5f15\u5165\u72b6\u6001\u76f8\u5173\u8fd0\u52a8\u5efa\u6a21\uff0c\u4ee5\u5e94\u5bf9\u5c0f\u76ee\u6807\u65e0\u4eba\u673a\u7684\u5feb\u901f\u673a\u52a8\u3001\u906e\u6321\u548c\u4f20\u611f\u5668\u6296\u52a8\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.12544", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["AKKF \u5728\u4f20\u7edf KF \u57fa\u7840\u4e0a\u52a0\u5165\u72b6\u6001\u4f9d\u8d56\u7684\u8fd0\u52a8\u5b66\u5efa\u6a21\uff0c\u63d0\u5347\u5bf9\u9ad8\u52a8\u6001 UAV \u8fd0\u52a8\u7684\u9002\u5e94\u6027\u3002", "\u7ed3\u5408\u77ac\u65f6\u8bef\u68c0\u6291\u5236\u4e0e\u57fa\u4e8e\u8fd0\u52a8\u5b66\u9884\u6d4b\u7684 coasting \u673a\u5236\uff0c\u589e\u5f3a\u906e\u6321\u548c\u6f0f\u68c0\u60c5\u51b5\u4e0b\u7684\u8f68\u8ff9\u8fde\u7eed\u6027\u3002", "\u5728 BSB benchmark \u4e0a\u540c\u65f6\u8bc4\u4f30\u8ddf\u8e2a\u7cbe\u5ea6\u4e0e\u8ba1\u7b97\u6548\u7387\uff0c\u5f3a\u8c03\u771f\u5b9e\u8fb9\u7f18\u8bbe\u5907\u5b9e\u65f6\u90e8\u7f72\u7ea6\u675f\u3002"], "keywords": ["\u76ee\u6807\u8ddf\u8e2a", "\u65e0\u4eba\u673a", "\u70ed\u7ea2\u5916", "\u8fb9\u7f18\u8ba1\u7b97"], "num_comments": 1, "on_hf": true, "organization": "The University of Melbourne", "pdf_url": "https://arxiv.org/pdf/2607.12544v1", "published_at": "2026-07-14", "score": 0.155, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.12544.png", "title": "Edge-Aware Thermal Infrared UAV Swarm Tracking", "tldr": "\u9762\u5411\u8fb9\u7f18\u7aef\u7684\u70ed\u7ea2\u5916\u65e0\u4eba\u673a\u7fa4\u5b9e\u65f6\u8ddf\u8e2a\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u8fb9\u7f18\u90e8\u7f72\u7684\u5728\u7ebf\u70ed\u7ea2\u5916\u65e0\u4eba\u673a\u8ddf\u8e2a\u6d41\u6c34\u7ebf\uff0c\u6838\u5fc3\u662f\u81ea\u9002\u5e94\u8fd0\u52a8\u5b66\u5361\u5c14\u66fc\u6ee4\u6ce2\u5668\uff08AKKF\uff09\u3002\u5b83\u5728\u4fdd\u6301\u7ebf\u6027\u5361\u5c14\u66fc\u6ee4\u6ce2\u9ad8\u6548\u7387\u7684\u540c\u65f6\uff0c\u5f15\u5165\u72b6\u6001\u76f8\u5173\u8fd0\u52a8\u5efa\u6a21\uff0c\u4ee5\u5e94\u5bf9\u5c0f\u76ee\u6807\u65e0\u4eba\u673a\u7684\u5feb\u901f\u673a\u52a8\u3001\u906e\u6321\u548c\u4f20\u611f\u5668\u6296\u52a8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u70ed\u7ea2\u5916\u65e0\u4eba\u673a\u8ddf\u8e2a\u4ece\u5355\u7eaf\u8ffd\u6c42\u7cbe\u5ea6\u63a8\u8fdb\u5230\u7cbe\u5ea6\u4e0e\u8fb9\u7f18\u8ba1\u7b97\u6548\u7387\u7684\u8054\u5408\u4f18\u5316\uff0c\u5bf9\u591c\u95f4\u3001\u70df\u96fe\u3001\u4f4e\u80fd\u89c1\u5ea6\u7b49\u590d\u6742\u73af\u5883\u4e0b\u7684\u65e0\u4eba\u673a\u7fa4\u5b9e\u65f6\u611f\u77e5\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Inference-time thinking improves the performance of large language models, but aggregate outcomes do not reveal whether models use available evidence more effectively or seek information that could improve future decisions. We distinguish these responses by measuring action preference, thinking length, and reported confidence under matched uncertainty. Ten open-weight models completed matched horizon-style two-armed bandit trials in thinking and non-thinking modes. A cognitive model separated value-guided action and uncertainty-independent choice noise from two behavioral signatures of exploration: a UCB-like preference for the less-known arm and Thompson-like choice variability that increases with total uncertainty. On average, thinking strengthened value-guided action and reduced uncertainty-independent choice noise, without producing UCB-like exploration or strengthening Thompson-like exploration. Outside action, the information-imbalanced history condition, which also displayed more observations than the matched balanced condition, was associated with greater thinking length. Reported confidence became more sensitive to decision difficulty and more strongly associated with chosen task evidence. We interpret these thinking-length and reported-confidence patterns as consistent with metacognitive control and metacognitive monitoring, respectively, without establishing either process. Decoder sweeps, especially temperature, altered choice noise and thinking length but did not reproduce the joint cross-output pattern. In this controlled decision setting, thinking improved how models acted on current evidence, while neither measured signature supported a shift toward a more information-seeking policy.", "arxiv_id": "2607.26845", "arxiv_url": "https://arxiv.org/abs/2607.26845", "authors": ["Hua-Dong Xiong", "Xinyuan Yan", "Ji-An Li", "Jingming Xue", "Marcelo G. Mattar", "Robert C. Wilson"], "brief": "\u672c\u6587\u5728\u5339\u914d\u4e0d\u786e\u5b9a\u6027\u7684\u53cc\u81c2\u8001\u864e\u673a\u4efb\u52a1\u4e2d\u8bc4\u4f3010\u4e2a\u5f00\u6e90\u5927\u6a21\u578b\u7684\u201c\u601d\u8003\u201d\u6a21\u5f0f\uff0c\u533a\u5206\u6a21\u578b\u662f\u5728\u66f4\u597d\u5229\u7528\u5df2\u6709\u8bc1\u636e\uff0c\u8fd8\u662f\u66f4\u79ef\u6781\u5bfb\u6c42\u4fe1\u606f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u63a8\u7406\u65f6\u601d\u8003\u4e3b\u8981\u63d0\u5347\u4ef7\u503c\u5f15\u5bfc\u51b3\u7b56\u3001\u964d\u4f4e\u65e0\u5173\u566a\u58f0\uff0c\u4f46\u672a\u5e26\u6765\u66f4\u5f3a\u7684\u4fe1\u606f\u63a2\u7d22\u7b56\u7565\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26845", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u8ba4\u77e5\u6a21\u578b\u5206\u79bb\u4ef7\u503c\u5f15\u5bfc\u884c\u4e3a\u3001\u4e0e\u4e0d\u786e\u5b9a\u6027\u65e0\u5173\u7684\u9009\u62e9\u566a\u58f0\uff0c\u4ee5\u53ca\u4e24\u7c7b\u63a2\u7d22\u4fe1\u53f7\uff1aUCB\u5f0f\u504f\u597d\u672a\u77e5\u9009\u9879\u548cThompson\u5f0f\u968f\u603b\u4e0d\u786e\u5b9a\u6027\u589e\u52a0\u7684\u9009\u62e9\u53d8\u5f02\u3002", "\u601d\u8003\u6a21\u5f0f\u5e73\u5747\u589e\u5f3a\u4e86\u57fa\u4e8e\u5f53\u524d\u8bc1\u636e\u7684\u884c\u52a8\u9009\u62e9\uff0c\u5e76\u964d\u4f4e\u9009\u62e9\u566a\u58f0\uff0c\u4f46\u6ca1\u6709\u4ea7\u751fUCB\u5f0f\u63a2\u7d22\uff0c\u4e5f\u672a\u589e\u5f3aThompson\u5f0f\u63a2\u7d22\u3002", "\u601d\u8003\u957f\u5ea6\u548c\u7f6e\u4fe1\u5ea6\u62a5\u544a\u5448\u73b0\u5143\u8ba4\u77e5\u76f8\u5173\u6a21\u5f0f\uff1a\u4fe1\u606f\u4e0d\u5e73\u8861\u5386\u53f2\u4f1a\u589e\u52a0\u601d\u8003\u957f\u5ea6\uff0c\u7f6e\u4fe1\u5ea6\u5bf9\u51b3\u7b56\u96be\u5ea6\u548c\u6240\u9009\u8bc1\u636e\u66f4\u654f\u611f\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u4e0d\u786e\u5b9a\u6027", "\u51b3\u7b56"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26845v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Thinking Under Uncertainty: Evidence Use and Information-Seeking in Language Models", "tldr": "\u63a8\u7406\u589e\u5f3a\u8bc1\u636e\u5229\u7528\u800c\u975e\u4e3b\u52a8\u63a2\u7d22", "upvotes": 0, "what_it_is": "\u672c\u6587\u5728\u5339\u914d\u4e0d\u786e\u5b9a\u6027\u7684\u53cc\u81c2\u8001\u864e\u673a\u4efb\u52a1\u4e2d\u8bc4\u4f3010\u4e2a\u5f00\u6e90\u5927\u6a21\u578b\u7684\u201c\u601d\u8003\u201d\u6a21\u5f0f\uff0c\u533a\u5206\u6a21\u578b\u662f\u5728\u66f4\u597d\u5229\u7528\u5df2\u6709\u8bc1\u636e\uff0c\u8fd8\u662f\u66f4\u79ef\u6781\u5bfb\u6c42\u4fe1\u606f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u63a8\u7406\u65f6\u601d\u8003\u4e3b\u8981\u63d0\u5347\u4ef7\u503c\u5f15\u5bfc\u51b3\u7b56\u3001\u964d\u4f4e\u65e0\u5173\u566a\u58f0\uff0c\u4f46\u672a\u5e26\u6765\u66f4\u5f3a\u7684\u4fe1\u606f\u63a2\u7d22\u7b56\u7565\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3a\u201c\u63a8\u7406\u65f6\u601d\u8003\u201d\u5230\u5e95\u6539\u5584\u4e86\u4ec0\u4e48\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u8bc1\u636e\uff1a\u5b83\u66f4\u50cf\u662f\u63d0\u5347\u8bc1\u636e\u5229\u7528\u548c\u5143\u8ba4\u77e5\u76d1\u63a7\uff0c\u800c\u4e0d\u662f\u8ba9\u6a21\u578b\u5f62\u6210\u4e3b\u52a8\u4fe1\u606f\u5bfb\u6c42\u7b56\u7565\uff0c\u5bf9\u7406\u89e3\u548c\u8bc4\u4f30\u5927\u6a21\u578b\u63a8\u7406\u673a\u5236\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "As LLM agents increasingly depend on diverse external services such as search engines, databases, and connectors, agent harnesses face a fundamental tool-selection challenge: acquiring too few tools leaves the task under-informed, while too many adds cost, context load, and privacy exposure. Routers and retrievers can rank candidate tools by relevance, but a ranking alone does not determine how many are worth selecting. Existing approaches leave acquisition under heterogeneous costs unaddressed. We formulate this decision as cost-aware marginal decision-focused stopping (CAM-DF) over ranked tool prefixes, with CAM-DF-lite as a compact interpretable variant. We train directly on the offline gap between stopping now and the best continuation: its sign labels the decision, its magnitude weights each error by the payoff at stake. We prove this objective is Bayes-aligned with the stopping target and that score-only rules are suboptimal under heterogeneous costs. We evaluate on 1,343 tasks across five tool-use domains. On $\u03c4$-bench Retail, CAM-DF attains the highest payoff among deployable methods, with gains over a predict-then-threshold baseline across all five ranking sources and two cost regimes. Our approach is state-of-the-art under heterogeneous costs and high cost pressure, with larger gains under weaker rankings. In live execution, CAM-DF exposes the agent to 37\\% fewer tools than full access while maintaining comparable task success. The CAM-DF family is a lightweight pre-execution plugin that turns existing tool rankings into lower-cost acquisition decisions without fine-tuning the underlying LLM.", "arxiv_id": "2607.27083", "arxiv_url": "https://arxiv.org/abs/2607.27083", "authors": ["Yicheng Feng", "Yan Zhang", "Yan Cheng", "Wei Qi"], "brief": "\u672c\u6587\u7814\u7a76 LLM \u667a\u80fd\u4f53\u5728\u8c03\u7528\u5916\u90e8\u5de5\u5177\u524d\u5e94\u9009\u62e9\u591a\u5c11\u5de5\u5177\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u6210\u672c\u611f\u77e5\u7684\u505c\u6b62\u51b3\u7b56\u65b9\u6cd5 CAM-DF\uff0c\u5c06\u5df2\u6709\u5de5\u5177\u6392\u5e8f\u8f6c\u5316\u4e3a\u662f\u5426\u7ee7\u7eed\u83b7\u53d6\u5de5\u5177\u7684\u51b3\u7b56\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u9886\u57df\u5de5\u5177\u4f7f\u7528\u4efb\u52a1\u4e0a\u4f18\u4e8e\u9608\u503c\u7b49\u57fa\u7ebf\uff0c\u5728\u4fdd\u6301\u76f8\u8fd1\u4efb\u52a1\u6210\u529f\u7387\u7684\u540c\u65f6\u51cf\u5c11 37% \u5de5\u5177\u66b4\u9732\uff0c\u5c24\u5176\u9002\u5408\u5de5\u5177\u6210\u672c\u4e0d\u5747\u548c\u6392\u5e8f\u8f83\u5f31\u7684\u573a\u666f\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27083", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u6210\u672c\u611f\u77e5", "\u51b3\u7b56\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27083v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Scores Are Not Decisions: Cost-Aware Stopping for Tool Acquisition in LLM Agents", "tldr": "\u672c\u6587\u7814\u7a76 LLM \u667a\u80fd\u4f53\u5728\u8c03\u7528\u5916\u90e8\u5de5\u5177\u524d\u5e94\u9009\u62e9\u591a\u5c11\u5de5\u5177\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u6210\u672c\u611f\u77e5\u7684\u505c\u6b62\u51b3\u7b56\u65b9\u6cd5 CAM-DF\uff0c\u5c06\u5df2\u6709\u5de5\u5177\u6392\u5e8f\u8f6c\u5316\u4e3a\u662f\u5426\u7ee7\u7eed\u83b7\u53d6\u5de5\u5177\u7684\u51b3\u7b56\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u9886\u57df\u5de5\u5177\u4f7f\u7528\u4efb\u52a1\u4e0a\u4f18\u4e8e\u9608\u503c\u7b49\u57fa\u7ebf\uff0c\u5728\u4fdd\u6301\u76f8\u8fd1\u4efb\u52a1\u6210\u529f\u7387\u7684\u540c\u65f6\u51cf\u5c11 37% \u5de5\u5177\u66b4\u9732\uff0c\u5c24\u5176\u9002\u5408\u5de5\u5177\u6210\u672c\u4e0d\u5747\u548c\u6392\u5e8f\u8f83\u5f31\u7684\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents following the ReAct paradigm are promising enablers of complex multi-step tasks, including multi-hop question answering, code generation, and control of physical AI systems. Yet, when deployed at the edge, they must tightly manage their reasoning budget while remaining reliable and deferring to a cloud-side model only when local uncertainty is too high to act safely. We propose Think Short, Defer Smart (TSDS), a framework that synergistically integrates a lightweight convergence probe, which halts on-device reasoning once the intended action has stabilized, with a perplexity-based deferral rule that escalates uncertain actions to a cloud-side model. Both mechanisms are jointly calibrated on end-to-end episode trajectories via a multi-objective Learn-Then-Test (LTT) procedure, providing simultaneous finite-sample guarantees on expected episode reward and cloud-call rate. We evaluate TSDS on four ReAct benchmarks spanning arithmetic reasoning (GSM8K), multi-hop question answering (HotpotQA), code generation (MBPP), and multi-step embodied planning (household robot), and compare against thought-calibration-only and calibrated-deferral-only standalone baselines. TSDS reduces per-episode thinking compute by 43%-73% over deferral-only baselines across HotpotQA, MBPP, and the household robot task, while maintaining certified reward and cloud-call rate guarantees.", "arxiv_id": "2607.26865", "arxiv_url": "https://arxiv.org/abs/2607.26865", "authors": ["Amirmohammad Farzaneh", "Osvaldo Simeone"], "brief": "\u672c\u6587\u63d0\u51fa TSDS \u6846\u67b6\uff0c\u7528\u4e8e\u8fb9\u7f18\u7aef ReAct \u5927\u6a21\u578b\u667a\u80fd\u4f53\uff1a\u901a\u8fc7\u8f7b\u91cf\u6536\u655b\u63a2\u9488\u5c3d\u65e9\u505c\u6b62\u672c\u5730\u63a8\u7406\uff0c\u5e76\u7528\u56f0\u60d1\u5ea6\u89c4\u5219\u5728\u4e0d\u786e\u5b9a\u65f6\u8f6c\u4ea4\u4e91\u7aef\u6a21\u578b\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u591a\u76ee\u6807 Learn-Then-Test \u6821\u51c6\uff0c\u5728\u591a\u4e2a\u95ee\u7b54\u3001\u4ee3\u7801\u548c\u5177\u8eab\u89c4\u5212\u4efb\u52a1\u4e0a\u4fdd\u6301\u5956\u52b1\u4e0e\u4e91\u8c03\u7528\u7387\u7684\u6709\u9650\u6837\u672c\u4fdd\u8bc1\uff0c\u540c\u65f6\u5c06\u6bcf\u8f6e\u63a8\u7406\u8ba1\u7b97\u51cf\u5c11 43%-73%\u3002", "categories": ["stat.ML", "cs.AI", "cs.IT", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26865", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u8fb9\u7f18\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26865v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Think Short, Defer Smart, Act, and Repeat: Calibrated Reasoning and Uncertainty-Aware Deferral for Edge LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa TSDS \u6846\u67b6\uff0c\u7528\u4e8e\u8fb9\u7f18\u7aef ReAct \u5927\u6a21\u578b\u667a\u80fd\u4f53\uff1a\u901a\u8fc7\u8f7b\u91cf\u6536\u655b\u63a2\u9488\u5c3d\u65e9\u505c\u6b62\u672c\u5730\u63a8\u7406\uff0c\u5e76\u7528\u56f0\u60d1\u5ea6\u89c4\u5219\u5728\u4e0d\u786e\u5b9a\u65f6\u8f6c\u4ea4\u4e91\u7aef\u6a21\u578b\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u591a\u76ee\u6807 Learn-Then-Test \u6821\u51c6\uff0c\u5728\u591a\u4e2a\u95ee\u7b54\u3001\u4ee3\u7801\u548c\u5177\u8eab\u89c4\u5212\u4efb\u52a1\u4e0a\u4fdd\u6301\u5956\u52b1\u4e0e\u4e91\u8c03\u7528\u7387\u7684\u6709\u9650\u6837\u672c\u4fdd\u8bc1\uff0c\u540c\u65f6\u5c06\u6bcf\u8f6e\u63a8\u7406\u8ba1\u7b97\u51cf\u5c11 43%-73%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Model (LLM) agents are increasingly adopted in real-world security operations with access to host artifacts and command-line interfaces (CLIs), making it critical to thoroughly assess their security capabilities. However, existing cybersecurity benchmarks focus on pre-compromise settings where agents are placed in a clean and idealized environment before an attack occurs. This leaves the post-compromise setting underexplored. To address this gap, we introduce SecRespond, the first benchmark for evaluating LLM agents on the post-compromise incident-response workflow. Given a forensic disk snapshot of a compromised host together with the alerts, vulnerability scans, and baseline checks reported by a host security product, agents are required to produce forensic reports on intrusions, baseline risks, and vulnerability risks, together with a remediation plan. We instantiate this task across 10 cyber ranges, each constructed from a distinct compromised cloud host, spanning 4 entry-point types, 21 ATT\u0026CK techniques, and 5 operating systems. We evaluate 23 frontier LLMs on the OpenCode agent harness. Experimental results show that although current agents can reliably uncover the problems exposed by alerts, they struggle to proactively investigate the disk for silent intrusions and to produce comprehensive, verified remediation plans, with no model achieving complete detection and remediation on any single range. This reveals a fundamental bottleneck in building agents for real-world incident response. The benchmark is publicly available at https://github.com/Alibaba-NLP/qqr/tree/main/data/secrespond.", "arxiv_id": "2607.26791", "arxiv_url": "https://arxiv.org/abs/2607.26791", "authors": ["Lehan Wang", "Boli Chen", "Ruixue Ding", "Pengjun Xie", "Jinwei Huang", "Zhendong Liu", "Shuo Wang", "Tao Lei", "Xin Ouyang", "Xiaomeng Li"], "brief": "\u8bba\u6587\u63d0\u51fa SecRespond\uff0c\u9996\u4e2a\u9762\u5411\u5165\u4fb5\u540e\u4e8b\u4ef6\u54cd\u5e94\u6d41\u7a0b\u7684 LLM \u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u57fa\u4e8e\u53d7\u5bb3\u4e3b\u673a\u78c1\u76d8\u5feb\u7167\u3001\u5b89\u5168\u544a\u8b66\u3001\u6f0f\u6d1e\u626b\u63cf\u548c\u57fa\u7ebf\u68c0\u67e5\u751f\u6210\u53d6\u8bc1\u62a5\u544a\u4e0e\u4fee\u590d\u65b9\u6848\u3002\u8bc4\u6d4b 23 \u4e2a\u524d\u6cbf\u5927\u6a21\u578b\u53d1\u73b0\uff0c\u5f53\u524d\u667a\u80fd\u4f53\u80fd\u8f83\u597d\u5904\u7406\u544a\u8b66\u66b4\u9732\u7684\u95ee\u9898\uff0c\u4f46\u96be\u4ee5\u4e3b\u52a8\u53d1\u73b0\u9759\u9ed8\u5165\u4fb5\u5e76\u7ed9\u51fa\u5b8c\u6574\u53ef\u4fe1\u7684\u4fee\u590d\u8ba1\u5212\uff0c\u6ca1\u6709\u6a21\u578b\u80fd\u5728\u4efb\u4f55\u5355\u4e2a\u9776\u573a\u4e2d\u5b9e\u73b0\u5b8c\u6574\u68c0\u6d4b\u4e0e\u4fee\u590d\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26791", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u4e8b\u4ef6\u54cd\u5e94", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26791v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SecRespond: Benchmarking AI Agents for Real-World Post-Compromise Incident Response", "tldr": "\u8bba\u6587\u63d0\u51fa SecRespond\uff0c\u9996\u4e2a\u9762\u5411\u5165\u4fb5\u540e\u4e8b\u4ef6\u54cd\u5e94\u6d41\u7a0b\u7684 LLM \u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u57fa\u4e8e\u53d7\u5bb3\u4e3b\u673a\u78c1\u76d8\u5feb\u7167\u3001\u5b89\u5168\u544a\u8b66\u3001\u6f0f\u6d1e\u626b\u63cf\u548c\u57fa\u7ebf\u68c0\u67e5\u751f\u6210\u53d6\u8bc1\u62a5\u544a\u4e0e\u4fee\u590d\u65b9\u6848\u3002\u8bc4\u6d4b 23 \u4e2a\u524d\u6cbf\u5927\u6a21\u578b\u53d1\u73b0\uff0c\u5f53\u524d\u667a\u80fd\u4f53\u80fd\u8f83\u597d\u5904\u7406\u544a\u8b66\u66b4\u9732\u7684\u95ee\u9898\uff0c\u4f46\u96be\u4ee5\u4e3b\u52a8\u53d1\u73b0\u9759\u9ed8\u5165\u4fb5\u5e76\u7ed9\u51fa\u5b8c\u6574\u53ef\u4fe1\u7684\u4fee\u590d\u8ba1\u5212\uff0c\u6ca1\u6709\u6a21\u578b\u80fd\u5728\u4efb\u4f55\u5355\u4e2a\u9776\u573a\u4e2d\u5b9e\u73b0\u5b8c\u6574\u68c0\u6d4b\u4e0e\u4fee\u590d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Ascend C operator optimization is critical for NPU (Neural Processing Unit) inference performance but requires deep hardware expertise.While large language models (LLMs) have shown promise in automated CUDA kernel generation, the fundamentally different programming model of Ascend C introduces unique challenges that remain unexplored. In this paper, we propose AgenticCANN, a knowledge-augmented agentic evolution framework specifically tailored for automated Ascend C operator synthesis in low-corpus NPU environments.To overcome the severe platform knowledge deficit on unfamiliar hardware, AgenticCANN incorporates a knowledge-orchestrated generation system that delivers structured, multi-level domain insights across the development lifecycle to resolve the upstream feasibility bottleneck.Building on this foundation, it features a stage-adaptive agentic evolution strategy that dynamically aligns LLM interaction modes with specific generation and evolution phases, balancing high-exploration candidate discovery with high-convergence performance tuning.Extensive experiments on Huawei Ascend 910B across six operators spanning five pattern categories demonstrate that our method achieves 90 to 100 percent feasibility on elementwise and normalization operators, 56% on fusion operators, and up to 6.65$\\times$ speedup on 1B Pangu model inference kernels. Further analysis reveals that knowledge injection monotonically improves feasibility from 57% to 86% on elementwise operators, demonstrating its general rather than operator-specific benefit.", "arxiv_id": "2607.26661", "arxiv_url": "https://arxiv.org/abs/2607.26661", "authors": ["Junhao Qiu", "Zidong Wang", "Yansong Sun", "Zhitong Ma", "Ping Guo", "Qingfu Zhang"], "brief": "\u672c\u6587\u63d0\u51fa AgenticCANN\uff0c\u4e00\u4e2a\u9762\u5411\u534e\u4e3a Ascend C \u7b97\u5b50\u81ea\u52a8\u751f\u6210\u7684\u77e5\u8bc6\u589e\u5f3a\u667a\u80fd\u4f53\u6f14\u5316\u6846\u67b6\uff0c\u7528\u7ed3\u6784\u5316\u786c\u4ef6/\u5e73\u53f0\u77e5\u8bc6\u5f25\u8865\u4f4e\u8bed\u6599 NPU \u73af\u5883\u4e0b\u7684\u5927\u6a21\u578b\u77e5\u8bc6\u7f3a\u53e3\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u9010\u5143\u7d20\u548c\u5f52\u4e00\u5316\u7b97\u5b50\u4e0a\u53ef\u8fbe 90% \u5230 100% \u53ef\u884c\u7387\uff0c\u5728\u878d\u5408\u7b97\u5b50\u4e0a\u8fbe 56%\uff0c\u5e76\u5728\u76d8\u53e4 1B \u63a8\u7406\u5185\u6838\u4e0a\u53d6\u5f97\u6700\u9ad8 6.65 \u500d\u52a0\u901f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26661", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u7b97\u5b50\u4f18\u5316", "\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26661v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AgenticCANN: Automated Ascend C Operator Generation via Knowledge-Augmented Agentic Evolution", "tldr": "\u672c\u6587\u63d0\u51fa AgenticCANN\uff0c\u4e00\u4e2a\u9762\u5411\u534e\u4e3a Ascend C \u7b97\u5b50\u81ea\u52a8\u751f\u6210\u7684\u77e5\u8bc6\u589e\u5f3a\u667a\u80fd\u4f53\u6f14\u5316\u6846\u67b6\uff0c\u7528\u7ed3\u6784\u5316\u786c\u4ef6/\u5e73\u53f0\u77e5\u8bc6\u5f25\u8865\u4f4e\u8bed\u6599 NPU \u73af\u5883\u4e0b\u7684\u5927\u6a21\u578b\u77e5\u8bc6\u7f3a\u53e3\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u9010\u5143\u7d20\u548c\u5f52\u4e00\u5316\u7b97\u5b50\u4e0a\u53ef\u8fbe 90% \u5230 100% \u53ef\u884c\u7387\uff0c\u5728\u878d\u5408\u7b97\u5b50\u4e0a\u8fbe 56%\uff0c\u5e76\u5728\u76d8\u53e4 1B \u63a8\u7406\u5185\u6838\u4e0a\u53d6\u5f97\u6700\u9ad8 6.65 \u500d\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world vulnerabilities often span multiple functions, yet most learning-based detectors classify each function in isolation: on a sample of real CVEs, we find that 71.7% of vulnerable functions require evidence from outside the function to be classified correctly. Agentic reinforcement learning (RL) could close this gap by enabling a model to gather that evidence itself, but it lacks a reliable reward, since a reward defined on the final verdict alone can be obtained without performing any investigation. We propose VulAgentRL, an agentic RL framework for interprocedural vulnerability detection built on a Code Property Graph (CPG). The CPG serves two roles: at inference time the policy queries it for callers, callees, dataflow, and other queries, and at training time the same graph verifies the evidence the policy cites. Because every CPG node carries a persistent integer identifier, this verification is an exact comparison rather than a textual match, so the reward credits verdicts that are supported by evidence. We further initialize the policy by distilling teacher investigations, and show that this warm start is necessary, since RL cannot acquire tool-use behavior it never samples. Under a repository-level split that prevents leakage, VulAgentRL outperforms state-of-the-art baselines, including frontier models, on the strict pair-wise-correct metric while issuing fewer tool calls, and its advantage persists on an out-of-distribution corpus and under class imbalance.", "arxiv_id": "2607.26656", "arxiv_url": "https://arxiv.org/abs/2607.26656", "authors": ["Yikun Li", "Ting Zhang", "Jiakun Liu", "Jinfeng Jiang", "Yuheng Yieh", "Yixin Yang", "Wen Bin Leow", "Yide Yin", "Yintong Huo", "Eng Lieh Ouh", "Lwin Khin Shar", "David Lo"], "brief": "\u8bba\u6587\u63d0\u51fa VulAgentRL\uff0c\u7528\u4ee3\u7801\u5c5e\u6027\u56fe\uff08CPG\uff09\u4f5c\u4e3a\u63a8\u7406\u65f6\u7684\u67e5\u8be2\u5de5\u5177\u548c\u8bad\u7ec3\u65f6\u7684\u8bc1\u636e\u9a8c\u8bc1\u5668\uff0c\u89e3\u51b3\u8de8\u8fc7\u7a0b\u6f0f\u6d1e\u68c0\u6d4b\u4e2d\u4ec5\u770b\u5355\u51fd\u6570\u8bc1\u636e\u4e0d\u8db3\u7684\u95ee\u9898\u3002\u901a\u8fc7\u6559\u5e08\u8f68\u8ff9\u84b8\u998f\u521d\u59cb\u5316\u548c\u57fa\u4e8e\u56fe\u8282\u70b9\u7cbe\u786e\u5339\u914d\u7684\u5956\u52b1\u8bbe\u8ba1\uff0c\u8be5\u65b9\u6cd5\u5728\u4ed3\u5e93\u7ea7\u5212\u5206\u3001\u5206\u5e03\u5916\u6570\u636e\u548c\u7c7b\u522b\u4e0d\u5747\u8861\u573a\u666f\u4e0b\u4f18\u4e8e\u73b0\u6709\u57fa\u7ebf\u4e0e\u524d\u6cbf\u6a21\u578b\uff0c\u5e76\u51cf\u5c11\u5de5\u5177\u8c03\u7528\u6b21\u6570\u3002", "categories": ["cs.CR", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26656", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6f0f\u6d1e\u68c0\u6d4b", "\u4ee3\u7801\u56fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26656v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Graph Is the Verifier: Agentic Reinforcement Learning for Interprocedural Vulnerability Detection", "tldr": "\u8bba\u6587\u63d0\u51fa VulAgentRL\uff0c\u7528\u4ee3\u7801\u5c5e\u6027\u56fe\uff08CPG\uff09\u4f5c\u4e3a\u63a8\u7406\u65f6\u7684\u67e5\u8be2\u5de5\u5177\u548c\u8bad\u7ec3\u65f6\u7684\u8bc1\u636e\u9a8c\u8bc1\u5668\uff0c\u89e3\u51b3\u8de8\u8fc7\u7a0b\u6f0f\u6d1e\u68c0\u6d4b\u4e2d\u4ec5\u770b\u5355\u51fd\u6570\u8bc1\u636e\u4e0d\u8db3\u7684\u95ee\u9898\u3002\u901a\u8fc7\u6559\u5e08\u8f68\u8ff9\u84b8\u998f\u521d\u59cb\u5316\u548c\u57fa\u4e8e\u56fe\u8282\u70b9\u7cbe\u786e\u5339\u914d\u7684\u5956\u52b1\u8bbe\u8ba1\uff0c\u8be5\u65b9\u6cd5\u5728\u4ed3\u5e93\u7ea7\u5212\u5206\u3001\u5206\u5e03\u5916\u6570\u636e\u548c\u7c7b\u522b\u4e0d\u5747\u8861\u573a\u666f\u4e0b\u4f18\u4e8e\u73b0\u6709\u57fa\u7ebf\u4e0e\u524d\u6cbf\u6a21\u578b\uff0c\u5e76\u51cf\u5c11\u5de5\u5177\u8c03\u7528\u6b21\u6570\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deployed LLM agents increasingly keep their long-term memory as a filesystem: a directory tree of markdown files that the agent itself reads, writes, and reorganizes through generic file tools. Yet research has largely passed over this medium: prior systems design bespoke memory representations and study retrieval over them, leaving the default\u0027s two working assumptions untested: that an agent can keep a growing store organized as memories accumulate, conflict, and go stale, and that this organization pays. We present the first systematic exploration of filesystem-based memory for LLM agents. We formalize the setting as three roles around one memory filesystem: a management agent integrates and organizes incoming content, a search agent answers queries with cited sources, and an execution agent supplies task trajectories that are distilled into skills, unifying declarative memory and skills in a single store. Across long-conversation benchmarks and embodied tasks, we vary memory shape (agent-organized hierarchy, verbatim dump, chunk retrieval), stream scale, tool harness (sandboxed shell, memory-tool-style functions, varied search tooling), and the strengths of the management and search agents, tracking answer quality, cost, and store health as memory grows. What organization reliably buys is search economy: organized stores roughly halve retrieval cost where material is large. Today\u0027s agents, however, fall short of the default\u0027s promise: in our growth study, organization erodes for all but the strongest management agent, and no agent we measure converts organization itself into better answers. And the model is not the only lever over a store\u0027s shape: changing the tool set alone reshapes the store as strongly as swapping the model. The study turns the filesystem default from an assumption into a design space for agent memory.", "arxiv_id": "2607.26637", "arxiv_url": "https://arxiv.org/abs/2607.26637", "authors": ["Sizhe Zhou", "Sheldon Yu", "Hui Wei", "Junda Wu", "Siru Ouyang", "Yizhu Jiao", "Shijia Pan", "Julian McAuley", "Yu Zhang", "Tong Yu", "Jiawei Han"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86 LLM \u667a\u80fd\u4f53\u5c06\u957f\u671f\u8bb0\u5fc6\u5b58\u4e3a\u6587\u4ef6\u7cfb\u7edf\uff08\u76ee\u5f55\u6811\u4e0e Markdown \u6587\u4ef6\uff09\u7684\u9ed8\u8ba4\u505a\u6cd5\uff0c\u6bd4\u8f83\u4e86\u5c42\u7ea7\u7ec4\u7ec7\u3001\u539f\u59cb\u5806\u653e\u3001\u5206\u5757\u68c0\u7d22\u7b49\u5f62\u6001\uff0c\u4ee5\u53ca\u4e0d\u540c\u5de5\u5177\u548c\u7ba1\u7406/\u641c\u7d22\u667a\u80fd\u4f53\u80fd\u529b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6709\u7ec4\u7ec7\u7684\u6587\u4ef6\u7cfb\u7edf\u4e3b\u8981\u80fd\u663e\u8457\u964d\u4f4e\u68c0\u7d22\u6210\u672c\uff0c\u4f46\u5f53\u524d\u667a\u80fd\u4f53\u96be\u4ee5\u957f\u671f\u7ef4\u6301\u826f\u597d\u7ec4\u7ec7\uff0c\u4e5f\u672a\u80fd\u7a33\u5b9a\u5c06\u7ec4\u7ec7\u4f18\u52bf\u8f6c\u5316\u4e3a\u66f4\u9ad8\u7b54\u9898\u8d28\u91cf\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26637", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u6587\u4ef6\u7cfb\u7edf", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26637v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Filesystem-Based Memory for LLM Agents: Organization, Evolution, and Sustainability", "tldr": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86 LLM \u667a\u80fd\u4f53\u5c06\u957f\u671f\u8bb0\u5fc6\u5b58\u4e3a\u6587\u4ef6\u7cfb\u7edf\uff08\u76ee\u5f55\u6811\u4e0e Markdown \u6587\u4ef6\uff09\u7684\u9ed8\u8ba4\u505a\u6cd5\uff0c\u6bd4\u8f83\u4e86\u5c42\u7ea7\u7ec4\u7ec7\u3001\u539f\u59cb\u5806\u653e\u3001\u5206\u5757\u68c0\u7d22\u7b49\u5f62\u6001\uff0c\u4ee5\u53ca\u4e0d\u540c\u5de5\u5177\u548c\u7ba1\u7406/\u641c\u7d22\u667a\u80fd\u4f53\u80fd\u529b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6709\u7ec4\u7ec7\u7684\u6587\u4ef6\u7cfb\u7edf\u4e3b\u8981\u80fd\u663e\u8457\u964d\u4f4e\u68c0\u7d22\u6210\u672c\uff0c\u4f46\u5f53\u524d\u667a\u80fd\u4f53\u96be\u4ee5\u957f\u671f\u7ef4\u6301\u826f\u597d\u7ec4\u7ec7\uff0c\u4e5f\u672a\u80fd\u7a33\u5b9a\u5c06\u7ec4\u7ec7\u4f18\u52bf\u8f6c\u5316\u4e3a\u66f4\u9ad8\u7b54\u9898\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Physical Unified Device Architecture (PUDA) is an AI-native hardware harness for self-driving laboratories (SDLs). Rather than building a human-centered graphical user interface (GUI) orchestration layer, PUDA creates a command-line runtime environment that lets agents observe, orient, decide, and act over experiments while hardware execution remains deterministic, atomic, and auditable. Headless by design, devices appear through discoverable command-line interfaces, JSON protocols are routed through a distributed messaging system, and command responses, data products, and reports are preserved as structured records. PUDA organizes protocols, runs, samples, measurements, and command logs into an AI-native data structure linked by run identifiers and timestamps, preserving provenance from submitted protocol through hardware response to resulting data products. PUDA separates scientific orchestration from physical operation and data telemetry: agents choose experiments, while PUDA executes validated commands and captures provenance-linked state, responses, and data. The contribution is not another optimizer, orchestrator, or recipe language. It is a practical execution and data environment for agentic SDLs; the broader physical AI implication is that PUDA provides an AI-native hardware harness for AI systems to interact with physical tools.", "arxiv_id": "2607.26464", "arxiv_url": "https://arxiv.org/abs/2607.26464", "authors": ["Zekun Ren", "Hongzhao Tan", "Jiaen Yee", "Kedar Hippalgaonkar"], "brief": "PUDA \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u81ea\u9a71\u52a8\u5b9e\u9a8c\u5ba4\u7684 AI \u539f\u751f\u786c\u4ef6\u8fd0\u884c\u6846\u67b6\uff0c\u7528\u547d\u4ee4\u884c\u63a5\u53e3\u3001JSON \u534f\u8bae\u548c\u5206\u5e03\u5f0f\u6d88\u606f\u7cfb\u7edf\u66ff\u4ee3\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684 GUI \u7f16\u6392\u3002\u5b83\u8ba9\u667a\u80fd\u4f53\u8d1f\u8d23\u5b9e\u9a8c\u51b3\u7b56\uff0c\u800c\u786c\u4ef6\u6267\u884c\u4fdd\u6301\u786e\u5b9a\u6027\u3001\u539f\u5b50\u6027\u548c\u53ef\u5ba1\u8ba1\uff0c\u5e76\u5b8c\u6574\u8bb0\u5f55\u534f\u8bae\u3001\u547d\u4ee4\u3001\u6837\u54c1\u3001\u6d4b\u91cf\u4e0e\u6570\u636e\u6eaf\u6e90\u3002\u8be5\u5de5\u4f5c\u66f4\u504f\u57fa\u7840\u8bbe\u65bd\uff0c\u6709\u52a9\u4e8e\u667a\u80fd\u4f53\u5b89\u5168\u3001\u53ef\u8ffd\u8e2a\u5730\u64cd\u4f5c\u7269\u7406\u5b9e\u9a8c\u8bbe\u5907\u3002", "categories": ["cond-mat.mtrl-sci", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26464", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u9a71\u52a8\u5b9e\u9a8c\u5ba4", "\u786c\u4ef6\u63a7\u5236", "\u7269\u7406AI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26464v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PUDA: An AI-Native Hardware Harness for Self-Driving Laboratories", "tldr": "PUDA \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u81ea\u9a71\u52a8\u5b9e\u9a8c\u5ba4\u7684 AI \u539f\u751f\u786c\u4ef6\u8fd0\u884c\u6846\u67b6\uff0c\u7528\u547d\u4ee4\u884c\u63a5\u53e3\u3001JSON \u534f\u8bae\u548c\u5206\u5e03\u5f0f\u6d88\u606f\u7cfb\u7edf\u66ff\u4ee3\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684 GUI \u7f16\u6392\u3002\u5b83\u8ba9\u667a\u80fd\u4f53\u8d1f\u8d23\u5b9e\u9a8c\u51b3\u7b56\uff0c\u800c\u786c\u4ef6\u6267\u884c\u4fdd\u6301\u786e\u5b9a\u6027\u3001\u539f\u5b50\u6027\u548c\u53ef\u5ba1\u8ba1\uff0c\u5e76\u5b8c\u6574\u8bb0\u5f55\u534f\u8bae\u3001\u547d\u4ee4\u3001\u6837\u54c1\u3001\u6d4b\u91cf\u4e0e\u6570\u636e\u6eaf\u6e90\u3002\u8be5\u5de5\u4f5c\u66f4\u504f\u57fa\u7840\u8bbe\u65bd\uff0c\u6709\u52a9\u4e8e\u667a\u80fd\u4f53\u5b89\u5168\u3001\u53ef\u8ffd\u8e2a\u5730\u64cd\u4f5c\u7269\u7406\u5b9e\u9a8c\u8bbe\u5907\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As large language models (LLMs) evolve from standalone assistants into autonomous agents, ensuring their safety requires shifting beyond pointwise risk assessment to understand how risks emerge and unfold over long-horizon trajectories. In multi-turn interactions, malicious intent can be decomposed across seemingly harmless turns and gradually reconstructed through interaction trajectories, eventually resulting in safety failures. Existing safeguards remain largely reactive, detecting manifested violations while lacking the ability to predict latent risk evolution and enable preemptive prevention. To address this limitation, we propose Recast, a safety risk forecasting framework that advances LLM safeguarding beyond turn-level violation detection to trajectory-level risk prediction. Recast first retrieves risk-relevant evidence from both short-term dialogue progression and long-term historical context via a dual-scale trajectory view. It then models compositional risk evolution by capturing the current risk configuration and its temporal dynamics. Finally, a causal temporal encoder learns latent risk evolution patterns and predicts the distribution of future risk emergence turns. Extensive experiments across 7 risk categories show that Recast predicts 88.3% of future safety failures with an average lead time of 2.41 turns, while maintaining a false alarm rate of 12.3%, showcasing the effectiveness of trajectory-level forecasting in identifying emerging risks before safety violations occur.", "arxiv_id": "2607.26820", "arxiv_url": "https://arxiv.org/abs/2607.26820", "authors": ["Shi Lin", "Peng Qian", "Dinghao Liu", "Renjie Sun", "Sifan Wu", "Dezhang Kong", "Chenpei Wang", "Xun Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Recast\uff0c\u7528\u4e8e\u5728\u9ed1\u76d2\u591a\u8f6e\u4ea4\u4e92\u4e2d\u4ece\u8f68\u8ff9\u5c42\u9762\u9884\u6d4b\u5927\u6a21\u578b\u5b89\u5168\u98ce\u9669\uff0c\u800c\u4e0d\u662f\u53ea\u5728\u5355\u8f6e\u8fdd\u89c4\u51fa\u73b0\u540e\u68c0\u6d4b\u3002\u65b9\u6cd5\u7ed3\u5408\u77ed\u671f\u5bf9\u8bdd\u8fdb\u5c55\u4e0e\u957f\u671f\u5386\u53f2\u4e0a\u4e0b\u6587\uff0c\u5efa\u6a21\u98ce\u9669\u968f\u65f6\u95f4\u7684\u7ec4\u5408\u5f0f\u6f14\u5316\uff1b\u57287\u7c7b\u98ce\u9669\u5b9e\u9a8c\u4e2d\u53ef\u63d0\u524d\u5e73\u57472.41\u8f6e\u9884\u6d4b88.3%\u7684\u672a\u6765\u5b89\u5168\u5931\u8d25\uff0c\u8bef\u62a5\u7387\u4e3a12.3%\u3002", "categories": ["cs.LG", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26820", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u5b89\u5168", "\u98ce\u9669\u9884\u6d4b", "\u591a\u8f6e\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26820v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Forecasting Trajectory-Level Safety Risks in Black-Box Multi-Turn Interactions", "tldr": "\u8bba\u6587\u63d0\u51fa Recast\uff0c\u7528\u4e8e\u5728\u9ed1\u76d2\u591a\u8f6e\u4ea4\u4e92\u4e2d\u4ece\u8f68\u8ff9\u5c42\u9762\u9884\u6d4b\u5927\u6a21\u578b\u5b89\u5168\u98ce\u9669\uff0c\u800c\u4e0d\u662f\u53ea\u5728\u5355\u8f6e\u8fdd\u89c4\u51fa\u73b0\u540e\u68c0\u6d4b\u3002\u65b9\u6cd5\u7ed3\u5408\u77ed\u671f\u5bf9\u8bdd\u8fdb\u5c55\u4e0e\u957f\u671f\u5386\u53f2\u4e0a\u4e0b\u6587\uff0c\u5efa\u6a21\u98ce\u9669\u968f\u65f6\u95f4\u7684\u7ec4\u5408\u5f0f\u6f14\u5316\uff1b\u57287\u7c7b\u98ce\u9669\u5b9e\u9a8c\u4e2d\u53ef\u63d0\u524d\u5e73\u57472.41\u8f6e\u9884\u6d4b88.3%\u7684\u672a\u6765\u5b89\u5168\u5931\u8d25\uff0c\u8bef\u62a5\u7387\u4e3a12.3%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Harness plays a critical role in large language model agent performance, and building a high-performing harness requires substantial expert effort. Therefore, recent research has increasingly explored harness self-evolution, which iteratively proposes, evaluates, and improves harnesses using historical trial experience. However, accumulated historical experience does not always translate into stable search guidance, and performance often fluctuates substantially across evolution iterations, making it difficult to reliably discover high-performing harnesses under a limited evolution budget. We identify two limitations in how existing harness self-evolution methods leverage historical experience: (1) Lack of dynamic reassessment of whether historical experience remains valid for the current harness, and (2) Lack of explicit mechanisms for translating valid historical experience into actionable search directions. To address these limitations, we propose a new harness self-evolution method, named DREvo, which integrates function-level evidence anchoring, state-dependent evidence recalibration, and role-conditioned search intent distillation to determine which historical evidence remains valid and where the harness should evolve next. Under limited evolution budgets, DREvo exhibits smoother evolution trajectories, achieves the highest accuracy on all five benchmarks, and delivers average gains of 16.2% and 14.2% over the evaluated baselines on domain reasoning and agentic tasks, respectively.", "arxiv_id": "2607.26722", "arxiv_url": "https://arxiv.org/abs/2607.26722", "authors": ["Hanghui Guo", "Weijie Shi", "Zhangze Chen", "Shengxiang Xu", "Yishu Wang", "Yimei Zhang", "Wangze Ni", "Jia Zhu", "Shimin Di"], "brief": "\u672c\u6587\u63d0\u51fa DREvo\uff0c\u4e00\u79cd\u7528\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53 harness \u81ea\u8fdb\u5316\u7684\u65b9\u6cd5\uff0c\u901a\u8fc7\u51fd\u6570\u7ea7\u8bc1\u636e\u951a\u5b9a\u3001\u72b6\u6001\u4f9d\u8d56\u7684\u8bc1\u636e\u91cd\u6821\u51c6\u548c\u89d2\u8272\u6761\u4ef6\u7684\u641c\u7d22\u610f\u56fe\u84b8\u998f\uff0c\u66f4\u6709\u6548\u5730\u7b5b\u9009\u5e76\u5229\u7528\u5386\u53f2\u8bd5\u9a8c\u7ecf\u9a8c\u3002 \u5728\u6709\u9650\u8fdb\u5316\u9884\u7b97\u4e0b\uff0cDREvo \u7684\u641c\u7d22\u8fc7\u7a0b\u66f4\u7a33\u5b9a\uff0c\u5e76\u57285\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u9ad8\u51c6\u786e\u7387\uff0c\u76f8\u6bd4\u57fa\u7ebf\u5728\u9886\u57df\u63a8\u7406\u548c\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u5e73\u5747\u63d0\u534716.2%\u548c14.2%\u3002", "categories": ["cs.MA", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26722", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u8fdb\u5316", "\u641c\u7d22\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26722v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DREvo: Distilling Recalibrated Historical Experience for Harness Self-Evolution", "tldr": "\u672c\u6587\u63d0\u51fa DREvo\uff0c\u4e00\u79cd\u7528\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53 harness \u81ea\u8fdb\u5316\u7684\u65b9\u6cd5\uff0c\u901a\u8fc7\u51fd\u6570\u7ea7\u8bc1\u636e\u951a\u5b9a\u3001\u72b6\u6001\u4f9d\u8d56\u7684\u8bc1\u636e\u91cd\u6821\u51c6\u548c\u89d2\u8272\u6761\u4ef6\u7684\u641c\u7d22\u610f\u56fe\u84b8\u998f\uff0c\u66f4\u6709\u6548\u5730\u7b5b\u9009\u5e76\u5229\u7528\u5386\u53f2\u8bd5\u9a8c\u7ecf\u9a8c\u3002 \u5728\u6709\u9650\u8fdb\u5316\u9884\u7b97\u4e0b\uff0cDREvo \u7684\u641c\u7d22\u8fc7\u7a0b\u66f4\u7a33\u5b9a\uff0c\u5e76\u57285\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u9ad8\u51c6\u786e\u7387\uff0c\u76f8\u6bd4\u57fa\u7ebf\u5728\u9886\u57df\u63a8\u7406\u548c\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u5e73\u5747\u63d0\u534716.2%\u548c14.2%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Travel planning is a demanding stress test for tool-using LLM agents: a usable itinerary is a single artifact that must be right along many axes at once - every flight, hotel, and attraction must exist and be bookable, the days must be physically traversable, the total must clear a budget, and the plan must serve a traveler whose needs are only partly stated. Existing agent benchmarks reward these properties one at a time and grade the final output with soft or LLM-judged rubrics, which cannot certify that a returned plan is executable and are neither reproducible nor auditable. We introduce TREK (Travel Reasoning and Evaluation Kit), a benchmark for feasible itinerary synthesis: producing a single plan that is jointly constraint-correct, hallucination-free, spatio-temporally executable, budget-valid, and responsive to the traveler\u0027s unstated persona needs. TREK comprises 800 multi-constraint tasks - 533 feasible and 267 provably infeasible with typed route/entity/budget causes - over a synthetic, internally consistent knowledge base of 212,530 records across 375 cities and 13 personas, served through a production-style tool sandbox of validated RESTful APIs. Every task is scored by a fully deterministic, rule-based evaluator with no LLM judge and ships a human-verified gold reference that scores a perfect 1.0 under that same evaluator, so the ceiling is demonstrably achievable and every remaining gap is an agent limitation rather than scorer strictness. Evaluating 15 LLM agents across nine constraint dimensions, we find that even the strongest (GPT-5.6) produces a fully-feasible plan on only 46.2% of solvable tasks, with a median of 6.6% and a floor of 0.0%; satisfying travelers\u0027 unstated needs emerges as the universal bottleneck, unsolved even at the frontier. We release the dataset, tool sandbox, deterministic evaluator, and agent code as a fully reproducible benchmark.", "arxiv_id": "2607.26977", "arxiv_url": "https://arxiv.org/abs/2607.26977", "authors": ["Jinhu Qi", "Wentao Zhang", "Siu Man Ng", "Feiyang Xu", "Yanyu Chen", "Yaoman Li", "Irwin King"], "brief": "TREK \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u590d\u6742\u65c5\u884c\u89c4\u5212\u7684 LLM \u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u8981\u6c42\u751f\u6210\u540c\u65f6\u6ee1\u8db3\u771f\u5b9e\u5b9e\u4f53\u3001\u8def\u7ebf\u53ef\u8fbe\u3001\u9884\u7b97\u6709\u6548\u3001\u65e0\u5e7b\u89c9\u548c\u9690\u542b\u7528\u6237\u504f\u597d\u7684\u5b8c\u6574\u884c\u7a0b\u3002\u5b83\u5305\u542b 800 \u4e2a\u591a\u7ea6\u675f\u4efb\u52a1\u3001\u5de5\u5177\u6c99\u76d2\u548c\u5b8c\u5168\u786e\u5b9a\u6027\u7684\u89c4\u5219\u8bc4\u6d4b\u5668\uff1b\u5b9e\u9a8c\u663e\u793a\u6700\u5f3a\u6a21\u578b\u5728\u53ef\u884c\u4efb\u52a1\u4e0a\u4e5f\u4ec5\u6709 46.2% \u5b8c\u5168\u6210\u529f\uff0c\u9690\u542b\u9700\u6c42\u6ee1\u8db3\u662f\u4e3b\u8981\u74f6\u9888\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26977", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5de5\u5177\u4f7f\u7528", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26977v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TREK: A Travel Reasoning and Evaluation Kit for LLM Agents in Complex Trip Planning", "tldr": "TREK \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u590d\u6742\u65c5\u884c\u89c4\u5212\u7684 LLM \u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u8981\u6c42\u751f\u6210\u540c\u65f6\u6ee1\u8db3\u771f\u5b9e\u5b9e\u4f53\u3001\u8def\u7ebf\u53ef\u8fbe\u3001\u9884\u7b97\u6709\u6548\u3001\u65e0\u5e7b\u89c9\u548c\u9690\u542b\u7528\u6237\u504f\u597d\u7684\u5b8c\u6574\u884c\u7a0b\u3002\u5b83\u5305\u542b 800 \u4e2a\u591a\u7ea6\u675f\u4efb\u52a1\u3001\u5de5\u5177\u6c99\u76d2\u548c\u5b8c\u5168\u786e\u5b9a\u6027\u7684\u89c4\u5219\u8bc4\u6d4b\u5668\uff1b\u5b9e\u9a8c\u663e\u793a\u6700\u5f3a\u6a21\u578b\u5728\u53ef\u884c\u4efb\u52a1\u4e0a\u4e5f\u4ec5\u6709 46.2% \u5b8c\u5168\u6210\u529f\uff0c\u9690\u542b\u9700\u6c42\u6ee1\u8db3\u662f\u4e3b\u8981\u74f6\u9888\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-augmented generation (RAG) methods range from lexical and dense retrieval to graph-based indexing and agentic search. They are usually evaluated on different benchmarks at one corpus size, leaving their accuracy-cost scaling unclear. To bridge this gap, we present a controlled corpus-scaling study of these four paradigms. A ladder of 28 strictly nested tiers grows from roughly 1,000 to 512,000 documents while questions and a fixed bedrock of relevant and adversarial documents remain unchanged. Under one reader and judging protocol, we measure official accuracy, construction and query tokens, and latency. Our experimental results show that BM25 scales best in this controlled setting: it defines the low-cost end of the Pareto frontier at every measured tier and leads accuracy from mid-scale onward, without LLM-based construction. The File-System Agent matches or slightly exceeds BM25 at the smallest tiers but uses 39 times more query tokens per answer at the bedrock and falls nearly 20 points behind at full scale. A matched retrieval swap reverses this failure: Agent+BM25 scores 69.4 at full scale, versus 36.9 for raw-file agency and 54.8 for native BM25 on the same 150 questions. Graph-based RAG hits a construction wall: its heaviest builders use up to 24.6 generative LLM tokens per indexed corpus token yet stop within the first 2% of the full corpus, while scalable variants remain less accurate than BM25 at shared tiers.", "arxiv_id": "2607.26497", "arxiv_url": "https://arxiv.org/abs/2607.26497", "authors": ["Pengyu Wang", "Benfeng Xu", "Shaohan Wang", "Xin Zeng", "Huarui Wu", "Lei Zhang", "Licheng Zhang"], "brief": "\u672c\u6587\u5728\u4e25\u683c\u63a7\u5236\u7684\u8bed\u6599\u89c4\u6a21\u9636\u68af\u4e0a\u6bd4\u8f83\u8bcd\u6cd5\u68c0\u7d22\u3001\u7a20\u5bc6\u68c0\u7d22\u3001\u56fe\u5f0f RAG \u4e0e\u667a\u80fd\u4f53\u5f0f\u641c\u7d22\u7684\u51c6\u786e\u7387\u3001\u6210\u672c\u548c\u5ef6\u8fdf\u3002\u7ed3\u679c\u663e\u793a BM25 \u5728\u8be5\u8bbe\u7f6e\u4e0b\u6269\u5c55\u6027\u6700\u597d\uff0c\u59cb\u7ec8\u5904\u4e8e\u4f4e\u6210\u672c\u5e15\u7d2f\u6258\u524d\u6cbf\u5e76\u5728\u4e2d\u5927\u89c4\u6a21\u9886\u5148\uff1b\u539f\u59cb\u6587\u4ef6\u667a\u80fd\u4f53\u968f\u89c4\u6a21\u589e\u5927\u660e\u663e\u9000\u5316\uff0c\u4f46\u66ff\u6362\u4e3a BM25 \u68c0\u7d22\u540e\u6027\u80fd\u5927\u5e45\u63d0\u5347\uff0c\u56fe\u5f0f RAG \u5219\u53d7\u6784\u5efa\u6210\u672c\u9650\u5236\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26497", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u89c4\u6a21\u5316\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26497v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Which RAG Paradigm Wins at Scale? A Scaling Study of Retrieval-Augmented Generation Paradigms", "tldr": "\u672c\u6587\u5728\u4e25\u683c\u63a7\u5236\u7684\u8bed\u6599\u89c4\u6a21\u9636\u68af\u4e0a\u6bd4\u8f83\u8bcd\u6cd5\u68c0\u7d22\u3001\u7a20\u5bc6\u68c0\u7d22\u3001\u56fe\u5f0f RAG \u4e0e\u667a\u80fd\u4f53\u5f0f\u641c\u7d22\u7684\u51c6\u786e\u7387\u3001\u6210\u672c\u548c\u5ef6\u8fdf\u3002\u7ed3\u679c\u663e\u793a BM25 \u5728\u8be5\u8bbe\u7f6e\u4e0b\u6269\u5c55\u6027\u6700\u597d\uff0c\u59cb\u7ec8\u5904\u4e8e\u4f4e\u6210\u672c\u5e15\u7d2f\u6258\u524d\u6cbf\u5e76\u5728\u4e2d\u5927\u89c4\u6a21\u9886\u5148\uff1b\u539f\u59cb\u6587\u4ef6\u667a\u80fd\u4f53\u968f\u89c4\u6a21\u589e\u5927\u660e\u663e\u9000\u5316\uff0c\u4f46\u66ff\u6362\u4e3a BM25 \u68c0\u7d22\u540e\u6027\u80fd\u5927\u5e45\u63d0\u5347\uff0c\u56fe\u5f0f RAG \u5219\u53d7\u6784\u5efa\u6210\u672c\u9650\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automatically generating cinematically expressive camera trajectories through 3D scenes from natural language descriptions is a challenging task of high practical value, with applications ranging from real-estate advertising to virtual tour creation. Existing methods either lack true 3D spatial awareness by relying on 2D image priors, or treat trajectory generation as a geometric path planning problem divorced from cinematographic semantics. We present CinemaTraj, a framework that reframes camera trajectory planning as a language-grounded spatial reasoning problem. Given a set of RGB-D images and a user prompt, CinemaTraj equips an LLM agent with a structured 3D scene graph: the agent decomposes the prompt into a sequence of atomic cinematographic movements (dolly, orbit, crane, pan, tilt, zoom, arc). Each movement is instantiated via a novel parametric trajectory representation that is both cinematographically expressive and optimizable for collision avoidance. The scene graph acts as a structured spatial prior, grounding the agent\u0027s reasoning in accurate geometric and semantic knowledge of the environment. CinemaTraj further generates synchronized voiceover and subtitles aligned with camera motion, producing narrated cinematic video outputs. We evaluate CinemaTraj on real-world ScanNet++ environments, and show that it produces prompt-faithful, collision-free trajectories with high cinematographic quality, outperforming existing approaches on prompt alignment, trajectory quality, and safety metrics.", "arxiv_id": "2607.26910", "arxiv_url": "https://arxiv.org/abs/2607.26910", "authors": ["Qianru Li", "Xuyang Chen", "Erkin T\u00fcrk\u00f6z", "Lu Liu", "Xuqin Wang", "Liqiu Meng", "Tao Wu", "Yanfeng Zhang"], "brief": "CinemaTraj \u5c06\u81ea\u7136\u8bed\u8a00\u9a71\u52a8\u7684 3D \u573a\u666f\u8fd0\u955c\u89c4\u5212\u5efa\u6a21\u4e3a\u8bed\u8a00 grounding \u7684\u7a7a\u95f4\u63a8\u7406\u95ee\u9898\uff0c\u8ba9 LLM \u667a\u80fd\u4f53\u57fa\u4e8e\u7ed3\u6784\u5316 3D \u573a\u666f\u56fe\u5206\u89e3\u5e76\u7ec4\u5408\u63a8\u62c9\u6447\u79fb\u7b49\u539f\u5b50\u7535\u5f71\u955c\u5934\u8fd0\u52a8\u3002\u8be5\u65b9\u6cd5\u5728 ScanNet++ \u771f\u5b9e\u573a\u666f\u4e2d\u751f\u6210\u66f4\u7b26\u5408\u63d0\u793a\u3001\u65e0\u78b0\u649e\u4e14\u7535\u5f71\u611f\u66f4\u5f3a\u7684\u76f8\u673a\u8f68\u8ff9\uff0c\u5e76\u53ef\u540c\u6b65\u751f\u6210\u65c1\u767d\u548c\u5b57\u5e55\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26910", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "3D\u573a\u666f", "\u76f8\u673a\u8f68\u8ff9", "\u7a7a\u95f4\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26910v1", "published_at": "2026-07-29", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CinemaTraj: Composing Atomic Camera Trajectories for 3D Scenes with LLM Agents", "tldr": "CinemaTraj \u5c06\u81ea\u7136\u8bed\u8a00\u9a71\u52a8\u7684 3D \u573a\u666f\u8fd0\u955c\u89c4\u5212\u5efa\u6a21\u4e3a\u8bed\u8a00 grounding \u7684\u7a7a\u95f4\u63a8\u7406\u95ee\u9898\uff0c\u8ba9 LLM \u667a\u80fd\u4f53\u57fa\u4e8e\u7ed3\u6784\u5316 3D \u573a\u666f\u56fe\u5206\u89e3\u5e76\u7ec4\u5408\u63a8\u62c9\u6447\u79fb\u7b49\u539f\u5b50\u7535\u5f71\u955c\u5934\u8fd0\u52a8\u3002\u8be5\u65b9\u6cd5\u5728 ScanNet++ \u771f\u5b9e\u573a\u666f\u4e2d\u751f\u6210\u66f4\u7b26\u5408\u63d0\u793a\u3001\u65e0\u78b0\u649e\u4e14\u7535\u5f71\u611f\u66f4\u5f3a\u7684\u76f8\u673a\u8f68\u8ff9\uff0c\u5e76\u53ef\u540c\u6b65\u751f\u6210\u65c1\u767d\u548c\u5b57\u5e55\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the development of audio large language models (AudioLLMs), audio captioning needs to move from brief descriptions toward open-ended and fine-grained free-form descriptions. Existing evaluations often focus on generation quality or task performance, making it difficult to diagnose information coverage and description reliability. We propose MMAC, a \\textbf{M}assive \\textbf{M}ulti-dimensional benchmark for \\textbf{A}udio \\textbf{C}aptioning. MMAC contains 5,638 audio clips from more than 20 data sources, covering 6 capability categories and 15 evaluation dimensions. Given a model-generated caption, MMAC checks whether it mentions relevant information in the target dimension and whether the mentioned content is consistent with the reference label. We evaluate representative open-source and proprietary AudioLLMs. Results show clear differences across evaluation dimensions, information coverage, and description reliability. We will release the MMAC benchmark and evaluation code.", "arxiv_id": "2607.27109", "arxiv_url": "https://arxiv.org/abs/2607.27109", "authors": ["Weijie Wu", "Junbo Li", "Lin Li", "Jun Fang", "Qingyang Hong"], "brief": "\u8bba\u6587\u63d0\u51fa MMAC\uff0c\u4e00\u4e2a\u9762\u5411\u97f3\u9891\u5b57\u5e55\u751f\u6210\u7684\u5927\u89c4\u6a21\u591a\u7ef4\u5ea6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea 20 \u591a\u4e2a\u6570\u636e\u6e90\u7684 5638 \u6bb5\u97f3\u9891\uff0c\u8986\u76d6 6 \u7c7b\u80fd\u529b\u548c 15 \u4e2a\u8bc4\u6d4b\u7ef4\u5ea6\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u751f\u6210\u8d28\u91cf\uff0c\u8fd8\u68c0\u67e5\u5b57\u5e55\u662f\u5426\u8986\u76d6\u76ee\u6807\u4fe1\u606f\u3001\u5185\u5bb9\u662f\u5426\u4e0e\u53c2\u8003\u6807\u7b7e\u4e00\u81f4\uff0c\u5e76\u63ed\u793a\u4e86\u4e0d\u540c AudioLLM \u5728\u4fe1\u606f\u8986\u76d6\u548c\u53ef\u9760\u6027\u4e0a\u7684\u5dee\u5f02\u3002", "categories": ["cs.SD", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27109", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u9891\u7406\u89e3", "\u97f3\u9891\u5b57\u5e55", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27109v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MMAC: A Massive Multi-dimensional Benchmark for Audio Captioning", "tldr": "\u8bba\u6587\u63d0\u51fa MMAC\uff0c\u4e00\u4e2a\u9762\u5411\u97f3\u9891\u5b57\u5e55\u751f\u6210\u7684\u5927\u89c4\u6a21\u591a\u7ef4\u5ea6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea 20 \u591a\u4e2a\u6570\u636e\u6e90\u7684 5638 \u6bb5\u97f3\u9891\uff0c\u8986\u76d6 6 \u7c7b\u80fd\u529b\u548c 15 \u4e2a\u8bc4\u6d4b\u7ef4\u5ea6\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u751f\u6210\u8d28\u91cf\uff0c\u8fd8\u68c0\u67e5\u5b57\u5e55\u662f\u5426\u8986\u76d6\u76ee\u6807\u4fe1\u606f\u3001\u5185\u5bb9\u662f\u5426\u4e0e\u53c2\u8003\u6807\u7b7e\u4e00\u81f4\uff0c\u5e76\u63ed\u793a\u4e86\u4e0d\u540c AudioLLM \u5728\u4fe1\u606f\u8986\u76d6\u548c\u53ef\u9760\u6027\u4e0a\u7684\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific images are the core elements of presenting experimental conclusions, elaborating system architecture, and supporting comparative arguments in scientific papers. However, existing image quality assessment (IQA) methods are predominantly designed for natural photographs or AI-generated content, which cannot be directly applied to scientific papers. The few existing studies on scholarly charts remain confined to visual-surface comparisons, failing to verify caption alignment, citation relevance, or visual misleadingness. To address this, we propose SciFigQual-Bench, a full-text contextual benchmark that evaluates scientific images across five dimensions (clarity, layout, caption fit, context relevance, and misleading risk). The data covers top computer-science conferences from 2020 to 2025; 6,308 images were independently scored by multiple domain experts in five dimensions and aggregated into gold-standard annotations. Unlike previous scientific figure benchmarks, our dataset binds each image to its caption, citing sentence, and manuscript context. To enable automated evaluation on this benchmark, we designed a staged cross-modal evaluation framework SFQ-Agent to achieve auditable and refined scoring through the collection and fusion of modal evidence. Multiple mainstream large models were evaluated on the test subset eval1200, and SFQ-Agent (F3) equipped with GPT-5.6-Sol achieved the lowest overall average absolute error (0.418) and the highest consistency rate (93.4%), consistently outperforming both direct evaluation and auxiliary (Sidecar) visual language model evaluation schemes.", "arxiv_id": "2607.27084", "arxiv_url": "https://arxiv.org/abs/2607.27084", "authors": ["Zihan Deng", "Chuanzhi Xu", "Huiqi Liang", "Haoyang Li", "Xiaozhen Zhong", "Lequan Yu"], "brief": "\u8bba\u6587\u63d0\u51fa SciFigQual-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u8bba\u6587\u56fe\u50cf\u8d28\u91cf\u8bc4\u4f30\u7684\u5168\u7a3f\u4e0a\u4e0b\u6587\u57fa\u51c6\uff0c\u8986\u76d6\u6e05\u6670\u5ea6\u3001\u5e03\u5c40\u3001\u56fe\u6ce8\u5339\u914d\u3001\u4e0a\u4e0b\u6587\u76f8\u5173\u6027\u548c\u8bef\u5bfc\u98ce\u9669\u4e94\u4e2a\u7ef4\u5ea6\uff0c\u5305\u542b 6308 \u5f20\u7531\u9886\u57df\u4e13\u5bb6\u6807\u6ce8\u7684\u8ba1\u7b97\u673a\u79d1\u5b66\u4f1a\u8bae\u8bba\u6587\u56fe\u50cf\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u8de8\u6a21\u6001\u8bc4\u4f30\u6846\u67b6 SFQ-Agent\uff0c\u5728 eval1200 \u4e0a\u76f8\u6bd4\u76f4\u63a5\u8bc4\u4f30\u548c\u8f85\u52a9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u65b9\u6848\u53d6\u5f97\u66f4\u4f4e\u8bef\u5dee\u548c\u66f4\u9ad8\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27084", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u5b66\u56fe\u50cf\u8bc4\u4f30", "\u591a\u6a21\u6001", "\u57fa\u51c6\u6570\u636e\u96c6", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27084v1", "published_at": "2026-07-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SciFigQual-Bench: A Benchmark for Scientific Figure Quality Assessment with Full-Manuscript Context", "tldr": "\u8bba\u6587\u63d0\u51fa SciFigQual-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u8bba\u6587\u56fe\u50cf\u8d28\u91cf\u8bc4\u4f30\u7684\u5168\u7a3f\u4e0a\u4e0b\u6587\u57fa\u51c6\uff0c\u8986\u76d6\u6e05\u6670\u5ea6\u3001\u5e03\u5c40\u3001\u56fe\u6ce8\u5339\u914d\u3001\u4e0a\u4e0b\u6587\u76f8\u5173\u6027\u548c\u8bef\u5bfc\u98ce\u9669\u4e94\u4e2a\u7ef4\u5ea6\uff0c\u5305\u542b 6308 \u5f20\u7531\u9886\u57df\u4e13\u5bb6\u6807\u6ce8\u7684\u8ba1\u7b97\u673a\u79d1\u5b66\u4f1a\u8bae\u8bba\u6587\u56fe\u50cf\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u8de8\u6a21\u6001\u8bc4\u4f30\u6846\u67b6 SFQ-Agent\uff0c\u5728 eval1200 \u4e0a\u76f8\u6bd4\u76f4\u63a5\u8bc4\u4f30\u548c\u8f85\u52a9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u65b9\u6848\u53d6\u5f97\u66f4\u4f4e\u8bef\u5dee\u548c\u66f4\u9ad8\u4e00\u81f4\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fine-tuning is the dominant paradigm for specializing large language models (LLMs), yet it exposes a critical vulnerability: malicious data providers can embed harmful behaviors into downstream corpora, creating models that retain professional skills while violating human values on demand. Existing safety-realignment defenses often fail in practice due to three key limitations: they frequently cause catastrophic forgetting of specialized skills; their effectiveness collapses when the defender cannot observe the attacker\u0027s prompt template; and successfully realigned models remain susceptible to re-jailbreaking via simple system prompt switches. To address these challenges, we propose Routing-based On-Policy Distillation (ROPD), a novel realignment framework that models the divergence between aligned and compromised output probability distributions rather than fitting specific prompt templates. We conduct extensive experiments comparing ROPD against four state-of-the-art baselines across three datasets and three base models with varying alignment strengths. Our results demonstrate that when baseline defenses face template mismatches, often accompanied by severe degradation in downstream task performance. In contrast, ROPD substantially mitigates template-mismatch risks, maintaining superior robustness in both defense effectiveness and capability preservation. While our analysis indicates ROPD is not entirely immune to template shifts, its performance degradation is negligible compared to existing methods, establishing a new standard for robust LLM realignment.", "arxiv_id": "2607.27081", "arxiv_url": "https://arxiv.org/abs/2607.27081", "authors": ["Yongjian Guo", "Wanlun Ma", "Lingyu Shen", "Xi Xiao", "Sheng Wen"], "brief": "\u672c\u6587\u63d0\u51fa Routing-based On-Policy Distillation\uff08ROPD\uff09\uff0c\u7528\u4e8e\u4fee\u590d\u88ab\u6076\u610f\u5fae\u8c03\u6570\u636e\u690d\u5165\u6709\u5bb3\u884c\u4e3a\u7684\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u901a\u8fc7\u5efa\u6a21\u5bf9\u9f50\u6a21\u578b\u4e0e\u53d7\u635f\u6a21\u578b\u8f93\u51fa\u5206\u5e03\u5dee\u5f02\uff0c\u800c\u975e\u4f9d\u8d56\u7279\u5b9a\u653b\u51fb\u63d0\u793a\u6a21\u677f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u591a\u79cd\u73b0\u6709\u5b89\u5168\u91cd\u5bf9\u9f50\u65b9\u6cd5\uff0cROPD \u5728\u653b\u51fb\u6a21\u677f\u4e0d\u5339\u914d\u548c\u7cfb\u7edf\u63d0\u
