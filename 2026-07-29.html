ell whether the VLM made a bad choice or the motor controller simply failed to execute it, e.g., losing balance and falling. In this work, we introduce HumanCLAW, an evaluation framework that decouples action decision-making from low-level execution. At every step, a harnessed, off-the-shelf VLM issues an atomic skill command, and the command is translated into a sub-second chunk of continuous full-body motion with real physical consequences, including gravity and collisions. The body can therefore act freely in the physical world, while execution-side disturbances, balance and motor errors, are factored out. What remains measurable is the model\u0027s action intelligence: its moment-to-moment choice of what the body should execute next. Based on this framework, we build HumanCLAW-Bench: 1,218 long-horizon, egocentric find-navigate-interact episodes across 41 indoor scenes. We test nine state-of-the-art VLMs and find that none solves the benchmark; the best model reaches only a 16.8% success rate. Recognizing the target is not the bottleneck. What current VLMs lack is embodied self-awareness: they lose track of their own body, failing to tell where it is, whether it has reached the goal, or whether it has hit an obstacle.", "arxiv_id": "2607.27180", "arxiv_url": "https://arxiv.org/abs/2607.27180", "authors": ["Siyao Li", "Jiawei Gu", "Shuai Liu", "Kairui Hu", "Zekun Li", "Linjie Li", "Chengcheng Tang", "Po-Chen Wu", "Ivan Shugurov", "Lingni Ma", "Michael Zollhoefer", "Sizhe An", "Abhay Mittal", "Amy Zhao", "Ranjay Krishna", "Manling Li", "Ziwei Liu", "Chuan Guo"], "brief": "\u8bba\u6587\u63d0\u51fa HumanCLAW\uff0c\u4e00\u4e2a\u5c06\u9ad8\u5c42\u52a8\u4f5c\u51b3\u7b56\u4e0e\u4f4e\u5c42\u8fd0\u52a8\u63a7\u5236\u89e3\u8026\u7684\u5177\u8eab\u8bc4\u6d4b\u6846\u67b6\u3002VLM \u6bcf\u6b65\u8f93\u51fa\u539f\u5b50\u6280\u80fd\u547d\u4ee4\uff0c\u7531\u7cfb\u7edf\u8f6c\u5316\u4e3a\u5e26\u91cd\u529b\u3001\u78b0\u649e\u7b49\u7269\u7406\u540e\u679c\u7684\u5168\u8eab\u8fd0\u52a8\ Automated Red Teaming via Self-Play at Scale", "tldr": "\u81ea\u535a\u5f08\u8bad\u7ec3\u5927\u89c4\u6a21\u63d0\u793a\u6ce8\u5165\u7ea2\u961f\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GPT-Red\uff0c\u4e00\u4e2a\u901a\u8fc7\u5927\u89c4\u6a21\u81ea\u535a\u5f08\u8bad\u7ec3\u7684\u81ea\u52a8\u5316\u7ea2\u961f\u667a\u80fd\u4f53\uff0c\u7528\u4e8e\u53d1\u73b0\u9488\u5bf9\u524d\u6cbf LLM \u7684\u65b0\u578b\u63d0\u793a\u6ce8\u5165\u653b\u51fb\u3002\u4f5c\u8005\u5c06\u5176\u7528\u4e8e\u5bf9\u6297\u8bad\u7ec3 GPT-5.6\uff0c\u4ee5\u63d0\u5347\u751f\u4ea7\u7cfb\u7edf\u7684\u63d0\u793a\u6ce8\u5165\u9c81\u68d2\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u7528\u81ea\u52a8\u5316\u667a\u80fd\u4f53\u548c\u81ea\u535a\u5f08\u673a\u5236\u89c4\u6a21\u5316\u751f\u6210\u5b89\u5168\u653b\u51fb\u6837\u672c\u7684\u8def\u5f84\uff0c\u53ef\u5f62\u6210\u201c\u66f4\u5f3a\u6a21\u578b\u8bad\u7ec3\u66f4\u5f3a\u7ea2\u961f\u3001\u518d\u53cd\u54fa\u66f4\u5f3a\u9632\u5fa1\u201d\u7684\u5b89\u5168\u81ea\u6539\u8fdb\u95ed\u73af\uff0c\u5bf9\u524d\u6cbf LLM \u5b89\u5168\u8bc4\u4f30\u4e0e\u5bf9\u6297\u8bad\u7ec3\u5177\u6709\u91cd\u8981\u5f71\u54cd\u3002"}, {"abstract": "Large language model agents often encounter related yet distinct tasks that share reusable solution patterns. Yet standard agentic reinforcement learning treats tasks as independent episodes, while existing approaches to skill learning either focus on repeated attempts of one task or use pipelines with multiple stages that entangle extraction, retrieval, and execution. We introduce SkillRise, a unified reinforcement learning framework for learning skills across tasks. SkillRise organizes related instances into progressively challenging sequences and uses a single policy to alternate between task solving and curating an evolving skill document passed directly to the next task. Decoupled credit assignment across tasks supervises solving with the current task outcome and curation with discounted downstream outcomes. Experiments on ALFWorld, WebShop, and ScienceWorld show that SkillRise achieves the strongest Pass@1 performance among the compared methods, with gains over the strongest baseline ranging from 2.3 to 8.5 percentage points. Although trained across distinct tasks, its learned curation policy remains effective for repeated attempts on the same task. Further analysis reveals scaling at test time across tasks: performance improves with longer sequences of related tasks even when each task is attempted only once. This trend suggests that SkillRise reuses transferable skills across tasks rather than benefiting from repeated sampling of the same task. SkillRise further retains strong performance while substantially reducing the runtime overhead of skill learning pipelines with multiple stages. Together, these results provide a simple and efficient training paradigm for LLM agents to extract, refine, and reuse transferable skills across tasks.", "arxiv_id": "2607.26784", "arxiv_url": "https://arxiv.org/abs/2607.26784", "authors": ["Zhiyuan Yao", "Yuxin Chen", "Zhengxi Lu", "Zishan Xu", "Yueqing Sun", "Yifu Guo", "Yuquan Lu", "Zhengzhou Cai", "Kangning Zhang", "Zhuowen Han", "Zi-Han Wang", "Ziang Ye", "Qi Gu", "Xunliang Cai", "Weiwen Liu", "Yongliang Shen"], "brief": "SkillRise \u662f\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u7edf\u4e00\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u76f8\u5173\u4efb\u52a1\u7ec4\u7ec7\u6210\u9010\u6b65\u53d8\u96be\u7684\u5e8f\u5217\uff0c\u8ba9\u540c\u4e00\u7b56\u7565\u5728\u89e3\u9898\u4e0e\u7ef4\u62a4\u6280\u80fd\u6587\u6863\u4e4b\u95f4\u4ea4\u66ff\u8fdb\u884c\u3002\u5b83\u901a\u8fc7\u8de8\u4efb\u52a1\u89e3\u8026\u4fe1\u7528\u5206\u914d\uff0c\u4f7f\u5f53\u524d\u4efb\u52a1\u7ed3\u679c\u76d1\u7763\u89e3\u9898\uff0c\u540e\u7eed\u4efb\u52a1\u6536\u76ca\u76d1\u7763\u6280\u80fd\u6574\u7406\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26784", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6280\u80fd\u63d0\u53d6\u3001\u66f4\u65b0\u4e0e\u6267\u884c\u6574\u5408\u8fdb\u5355\u4e00\u7b56\u7565\uff0c\u907f\u514d\u4f20\u7edf\u591a\u9636\u6bb5\u6280\u80fd\u5b66\u4e60\u6d41\u6c34\u7ebf\u7684\u590d\u6742\u6027\u4e0e\u8fd0\u884c\u5f00\u9500\u3002", "\u5728 ALFWorld\u3001WebShop\u3001ScienceWorld \u4e0a\u53d6\u5f97\u6700\u5f3a Pass@1\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 2.3 \u5230 8.5 \u4e2a\u767e\u5206\u70b9\u3002", "\u6d4b\u8bd5\u65f6\u968f\u76f8\u5173\u4efb\u52a1\u5e8f\u5217\u53d8\u957f\u6027\u80fd\u7ee7\u7eed\u63d0\u5347\uff0c\u8868\u660e\u6a21\u578b\u590d\u7528\u4e86\u8de8\u4efb\u52a1\u53ef\u8fc1\u79fb\u6280\u80fd\uff0c\u800c\u975e\u4f9d\u8d56\u540c\u4e00\u4efb\u52a1\u91cd\u590d\u91c7\u6837\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6280\u80fd\u5b66\u4e60", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26784v1", "published_at": "2026-07-29", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SkillRise: Agentic Reinforcement Learning for Cross-Task Skill Evolution", "tldr": "\u8de8\u4efb\u52a1\u5f3a\u5316\u5b66\u4e60\u8ba9\u667a\u80fd\u4f53\u8fdb\u5316\u53ef\u8fc1\u79fb\u6280\u80fd", "upvotes": 0, "what_it_is": "SkillRise \u662f\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u7edf\u4e00\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u76f8\u5173\u4efb\u52a1\u7ec4\u7ec7\u6210\u9010\u6b65\u53d8\u96be\u7684\u5e8f\u5217\uff0c\u8ba9\u540c\u4e00\u7b56\u7565\u5728\u89e3\u9898\u4e0e\u7ef4\u62a4\u6280\u80fd\u6587\u6863\u4e4b\u95f4\u4ea4\u66ff\u8fdb\u884c\u3002\u5b83\u901a\u8fc7\u8de8\u4efb\u52a1\u89e3\u8026\u4fe1\u7528\u5206\u914d\uff0c\u4f7f\u5f53\u524d\u4efb\u52a1\u7ed3\u679c\u76d1\u7763\u89e3\u9898\uff0c\u540e\u7eed\u4efb\u52a1\u6536\u76ca\u76d1\u7763\u6280\u80fd\u6574\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u6280\u80fd\u5b66\u4e60\u4ece\u5355\u4efb\u52a1\u91cd\u590d\u5c1d\u8bd5\u63a8\u8fdb\u5230\u8de8\u4efb\u52a1\u6301\u7eed\u6f14\u5316\uff0c\u63d0\u4f9b\u4e86\u66f4\u7b80\u5355\u3001\u9ad8\u6548\u4e14\u53ef\u6269\u5c55\u7684\u8bad\u7ec3\u8303\u5f0f\uff0c\u5bf9\u63d0\u5347 LLM Agent \u5728\u771f\u5b9e\u73af\u5883\u4e2d\u7684\u957f\u671f\u9002\u5e94\u4e0e\u6280\u80fd\u590d\u7528\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Physics-informed neural networks (PINNs) have emerged as a powerful paradigm for solving partial differential equations (PDEs), yet their performance heavily relies on the manual, trial-and-error engineering of neural representations, loss formulations, and optimization dynamics. While Large Language Models (LLMs) offer a promising avenue for automated design, unconstrained code generation often yields mathematically invalid or numerically unstable solutions under strict scientific computing constraints. To bridge this gap, we propose \\textbf{EvoPINN}, an agentic framework that reformulates PINN development from labor-intensive manual design into a rigorous, execution-grounded algorithm discovery problem. EvoPINN navigates a modular search space by decoupling neural representations from training programs, utilizing an LLM agent to iteratively propose memory-conditioned programmatic modifications. To ensure scientific validity, all candidates undergo strict structural verification and budget-matched PDE evaluation. Extensive experiments across diverse PDE regimes (oscillatory, elliptic, dissipative, and nonlinear transport) demonstrate that EvoPINN discovers PDE-specialized learning algorithms that significantly reduce relative $L_{2}$ error compared to baselines. Crucially, EvoPINN autonomously invented SLRC-PINN, a novel architecture whose performance gains persist under rigorous parameter-matched comparisons, establishing the viability of execution-grounded agents for discovering genuinely new scientific computing mechanisms.", "arxiv_id": "2607.26490", "arxiv_url": "https://arxiv.org/abs/2607.26490", "authors": ["Peng Yin", "Kai Li", "Yifan Zhang", "Jian Cheng"], "brief": "EvoPINN\u5c06\u7269\u7406\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc\u7684\u8bbe\u8ba1\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u7684\u7b97\u6cd5\u53d1\u73b0\u95ee\u9898\u3002\u5b83\u7528LLM\u667a\u80fd\u4f53\u5728\u6a21\u5757\u5316\u641c\u7d22\u7a7a\u95f4\u4e2d\u8fed\u4ee3\u4fee\u6539\u7f51\u7edc\u8868\u793a\u4e0e\u8bad\u7ec3\u7a0b\u5e8f\uff0c\u5e76\u901a\u8fc7\u7ed3\u6784\u9a8c\u8bc1\u548cPDE\u8bc4\u6d4b\u7b5b\u9009\u5019\u9009\u65b9\u6848\u3002", "categories": ["cs.AI", "cs.LG", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26490", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u795e\u7ecf\u8868\u793a\u4e0e\u8bad\u7ec3\u7a0b\u5e8f\u89e3\u8026\uff0c\u652f\u6301LLM\u8fdb\u884c\u6709\u8bb0\u5fc6\u7684\u7a0b\u5e8f\u5316\u4fee\u6539\u4e0e\u641c\u7d22", "\u5bf9\u751f\u6210\u5019\u9009\u8fdb\u884c\u4e25\u683c\u7ed3\u6784\u9a8c\u8bc1\u548c\u9884\u7b97\u5339\u914d\u7684PDE\u5b9e\u9a8c\uff0c\u964d\u4f4e\u65e0\u6548\u6216\u6570\u503c\u4e0d\u7a33\u5b9a\u4ee3\u7801\u98ce\u9669", "\u5728\u632f\u8361\u3001\u692d\u5706\u3001\u8017\u6563\u3001\u975e\u7ebf\u6027\u8f93\u8fd0\u7b49\u591a\u7c7bPDE\u4e0a\u964d\u4f4e\u76f8\u5bf9L2\u8bef\u5dee\uff0c\u5e76\u81ea\u52a8\u53d1\u73b0\u65b0\u67b6\u6784SLRC-PINN"], "keywords": ["\u667a\u80fd\u4f53", "\u7269\u7406\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc", "\u79d1\u5b66\u8ba1\u7b97", "\u7b97\u6cd5\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26490v1", "published_at": "2026-07-29", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "EvoPINN: Agentic Discovery of Executable Algorithms for Physics-Informed Neural Networks", "tldr": "\u7528\u667a\u80fd\u4f53\u81ea\u52a8\u53d1\u73b0\u9ad8\u6027\u80fdPINN\u7b97\u6cd5", "upvotes": 0, "what_it_is": "EvoPINN\u5c06\u7269\u7406\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc\u7684\u8bbe\u8ba1\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u7684\u7b97\u6cd5\u53d1\u73b0\u95ee\u9898\u3002\u5b83\u7528LLM\u667a\u80fd\u4f53\u5728\u6a21\u5757\u5316\u641c\u7d22\u7a7a\u95f4\u4e2d\u8fed\u4ee3\u4fee\u6539\u7f51\u7edc\u8868\u793a\u4e0e\u8bad\u7ec3\u7a0b\u5e8f\uff0c\u5e76\u901a\u8fc7\u7ed3\u6784\u9a8c\u8bc1\u548cPDE\u8bc4\u6d4b\u7b5b\u9009\u5019\u9009\u65b9\u6848\u3002", "why_notable": "\u8bba\u6587\u5c55\u793a\u4e86LLM\u667a\u80fd\u4f53\u4e0d\u4ec5\u80fd\u8c03\u53c2\u6216\u751f\u6210\u4ee3\u7801\uff0c\u8fd8\u80fd\u5728\u79d1\u5b66\u8ba1\u7b97\u7ea6\u675f\u4e0b\u53d1\u73b0\u53ef\u6267\u884c\u3001\u53ef\u590d\u73b0\u5b9e\u9a8c\u9a8c\u8bc1\u7684\u65b0\u578bPINN\u673a\u5236\uff0c\u5bf9\u81ea\u52a8\u5316\u79d1\u5b66\u7b97\u6cd5\u8bbe\u8ba1\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Large language model (LLM) agents are increasingly expected to assist users in completing tasks. However, existing benchmarks provide limited support for evaluating whether agents can carry out office-suite workflows at a reasonable cost. We introduce OmegaUse-OfficeVal, a benchmark for evaluating LLM agents on long-horizon office-suite tasks with task-level economic grounding. The benchmark comprises 100 tasks derived from office-suite requests proposed by practitioners and adapted through a privacy-preserving process. On average, these tasks require 2.32 hours of human labor to complete. An important feature of the benchmark is that each task is paired with two economic signals: human labor time and task price proxy. These signals enable direct comparisons between human costs and LLM inference costs, as well as value-weighted evaluation. To support stable evaluation, we develop code-based verifiers from fine-grained rubrics. We evaluate several frontier LLMs together with a human baseline. Although all evaluated LLMs are substantially cheaper and faster than human workers, they have not yet approached human-level deliverable quality. The code and dataset are fully open-sourced, and more information is available on our project website: https://omegause-officeval.github.io.", "arxiv_id": "2607.27155", "arxiv_url": "https://arxiv.org/abs/2607.27155", "authors": ["Jingbo Zhou", "Yusai Zhao", "Qi Bao", "Jingjia Cao", "Zhenghai Chen", "Chang Gao", "Kaiqi Guo", "Muxin Guo", "Mingxuan Li", "Xinjiang Lu", "Yanru Ma", "Yixiong Xiao", "Zenghui Zhang", "Le Zhang", "Hua Wu"], "brief": "\u8bba\u6587\u63d0\u51fa OmegaUse-OfficeVal\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u5b8c\u6210\u957f\u5468\u671f Office \u5957\u4ef6\u5de5\u4f5c\u6d41\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b 100 \u4e2a\u6765\u81ea\u771f\u5b9e\u4ece\u4e1a\u8005\u9700\u6c42\u5e76\u7ecf\u9690\u79c1\u5904\u7406\u7684\u4efb\u52a1\uff0c\u5e76\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u6807\u6ce8\u4eba\u7c7b\u8017\u65f6\u4e0e\u4efb\u52a1\u4ef7\u683c\u4ee3\u7406\u4fe1\u53f7\u3002", "categories": ["cs.AI", "cs.CL", "cs.HC"], "github_repo": "https://github.com/baidu-frontier-research/OmegaUse-OfficeVal", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27155", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4efb\u52a1\u5e73\u5747\u9700\u8981\u4eba\u7c7b 2.32 \u5c0f\u65f6\u5b8c\u6210\uff0c\u8986\u76d6\u66f4\u63a5\u8fd1\u771f\u5b9e\u529e\u516c\u573a\u666f\u7684\u957f\u6d41\u7a0b\u4ea4\u4ed8\u7269\u751f\u6210", "\u5f15\u5165\u4eba\u7c7b\u52b3\u52a8\u65f6\u95f4\u4e0e\u4efb\u52a1\u4ef7\u683c\u4ee3\u7406\u4e24\u7c7b\u7ecf\u6d4e\u4fe1\u53f7\uff0c\u53ef\u6bd4\u8f83\u4eba\u529b\u6210\u672c\u3001LLM \u63a8\u7406\u6210\u672c\u4e0e\u4ef7\u503c\u52a0\u6743\u8868\u73b0", "\u57fa\u4e8e\u7ec6\u7c92\u5ea6\u8bc4\u5206\u89c4\u5219\u6784\u5efa\u4ee3\u7801\u5316\u9a8c\u8bc1\u5668\uff0c\u5e76\u8bc4\u4f30\u524d\u6cbf LLM \u4e0e\u4eba\u7c7b\u57fa\u7ebf\uff1a\u6a21\u578b\u66f4\u5feb\u66f4\u4fbf\u5b9c\uff0c\u4f46\u4ea4\u4ed8\u8d28\u91cf\u4ecd\u672a\u63a5\u8fd1\u4eba\u7c7b"], "keywords": ["\u667a\u80fd\u4f53", "\u529e\u516c\u81ea\u52a8\u5316", "\u57fa\u51c6\u8bc4\u6d4b", "\u7ecf\u6d4e\u8bc4\u4f30"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27155v1", "published_at": "2026-07-29", "score": 0.379, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.27155.png", "title": "OmegaUse-OfficeVal: Benchmarking LLM Agents on Long-Horizon Office-Suite Tasks with Economic Grounding", "tldr": "\u9762\u5411\u957f\u6d41\u7a0b\u529e\u516c\u4efb\u52a1\u7684\u7ecf\u6d4e\u8bc4\u4f30\u57fa\u51c6", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa OmegaUse-OfficeVal\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u5b8c\u6210\u957f\u5468\u671f Office \u5957\u4ef6\u5de5\u4f5c\u6d41\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b 100 \u4e2a\u6765\u81ea\u771f\u5b9e\u4ece\u4e1a\u8005\u9700\u6c42\u5e76\u7ecf\u9690\u79c1\u5904\u7406\u7684\u4efb\u52a1\uff0c\u5e76\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u6807\u6ce8\u4eba\u7c7b\u8017\u65f6\u4e0e\u4efb\u52a1\u4ef7\u683c\u4ee3\u7406\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u57fa\u51c6\u628a LLM \u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u5355\u7eaf\u4efb\u52a1\u6210\u529f\u7387\u63a8\u8fdb\u5230\u771f\u5b9e\u529e\u516c\u751f\u4ea7\u529b\u4e0e\u7ecf\u6d4e\u4ef7\u503c\u5c42\u9762\uff0c\u6709\u52a9\u4e8e\u8861\u91cf\u667a\u80fd\u4f53\u5728\u4f01\u4e1a\u529e\u516c\u81ea\u52a8\u5316\u4e2d\u7684\u5b9e\u9645\u53ef\u7528\u6027\u4e0e\u6295\u8d44\u56de\u62a5\u3002"}, {"abstract": "Stealth, the discipline of achieving an objective without revealing your presence, capabilities, or collected intelligence, is what separates sophisticated operators from detectable ones. Elite security researchers and advanced persistent threats achieve their objectives unnoticed; autonomous agents increasingly inherit the same offensive tasks, but do they inherit the tradecraft? We introduce StealthBench,a benchmark that measures operational stealth in autonomous offensive-security agents across six operational security (OPSEC) dimensions. We extract 11 hand-verified OPSEC incidents from real bug-bounty and red-team trajectories, expanded into 14 dockerized task scenarios, where agents, despite finding real vulnerabilities, committed stealth failures inconsistent with standard operational tradecraft: embedding credentials in public uploads, deleting production resources to prove access, force-adding uninvolved users to demonstrate a race condition. We evaluate agent trajectories using a 3-model large language model (LLM) judge panel with majority-vote aggregation, measuring safe success rate (solved and stealthy), Stealth@Solve (tradecraft quality among successful solves), and reckless solve rate (solved but cover blown). Our results show that no model exceeds 54% safe success rate (the compound metric requiring both task completion and stealth), confirming that OPSEC failures are systematic across model families. We release StealthBench as a public benchmark to support both the development of stealth-aware agents and automated OPSEC monitoring for autonomous offensive-security deployments. The interactive leaderboard, evaluation harness, and dataset are available at https://stealthbench.com.", "arxiv_id": "2607.26314", "arxiv_url": "https://arxiv.org/abs/2607.26314", "authors": ["Ads Dawson", "Adrian Wood"], "brief": "\u8bba\u6587\u63d0\u51fa StealthBench\uff0c\u4e00\u4e2a\u8861\u91cf\u81ea\u4e3b\u8fdb\u653b\u5b89\u5168\u667a\u80fd\u4f53\u64cd\u4f5c\u9690\u853d\u6027\u7684\u516c\u5f00\u57fa\u51c6\u3002\u5b83\u4ece\u771f\u5b9e\u6f0f\u6d1e\u8d4f\u91d1\u4e0e\u7ea2\u961f\u8f68\u8ff9\u4e2d\u63d0\u53d6 OPSEC \u5931\u8d25\u6848\u4f8b\uff0c\u6784\u5efa 14 \u4e2a Docker \u5316\u4efb\u52a1\u573a\u666f\uff0c\u5e76\u7528\u591a\u6a21\u578b LLM \u88c1\u5224\u8bc4\u4f30\u4efb\u52a1\u5b8c\u6210\u4e0e\u9690\u853d\u6027\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": "https://github.com/GangGreenTemperTatum/stealthbench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26314", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6 6 \u4e2a OPSEC \u7ef4\u5ea6\uff0c\u5305\u542b 11 \u4e2a\u624b\u5de5\u9a8c\u8bc1\u7684\u771f\u5b9e\u9690\u853d\u6027\u5931\u8bef\u4e8b\u4ef6\uff0c\u5982\u6cc4\u9732\u51ed\u636e\u3001\u5220\u9664\u751f\u4ea7\u8d44\u6e90\u3001\u5f3a\u884c\u6dfb\u52a0\u65e0\u5173\u7528\u6237\u7b49\u3002", "\u63d0\u51fa safe success rate\u3001Stealth@Solve\u3001reckless solve rate \u7b49\u6307\u6807\uff0c\u533a\u5206\u201c\u6210\u529f\u4e14\u9690\u853d\u201d\u548c\u201c\u6210\u529f\u4f46\u66b4\u9732\u201d\u3002", "\u5b9e\u9a8c\u663e\u793a\u6ca1\u6709\u6a21\u578b\u5b89\u5168\u6210\u529f\u7387\u8d85\u8fc7 54%\uff0c\u8bf4\u660e\u5f53\u524d\u81ea\u4e3b\u653b\u9632\u667a\u80fd\u4f53\u7684 OPSEC \u5931\u8bef\u5177\u6709\u7cfb\u7edf\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u57fa\u51c6\u8bc4\u6d4b", "LLM\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26314v1", "published_at": "2026-07-28", "score": 0.355, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.26314.png", "title": "StealthBench: Measuring Operational Stealth in Autonomous Offensive-Security Agents", "tldr": "StealthBench\u8bc4\u6d4b\u653b\u9632\u667a\u80fd\u4f53\u9690\u853d\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa StealthBench\uff0c\u4e00\u4e2a\u8861\u91cf\u81ea\u4e3b\u8fdb\u653b\u5b89\u5168\u667a\u80fd\u4f53\u64cd\u4f5c\u9690\u853d\u6027\ 5431", "arxiv_url": "https://arxiv.org/abs/2607.25431", "authors": ["Zhongming Yu", "Hengjia Yu", "Boqin Yuan", "Shuting Zhao", "Yizhao Chen", "Aryan Dokania", "Mihir Jagtap", "Jiayu Chang", "Yitong Ma", "Yash Jayswal", "Wentao Ni", "Hejia Zhang", "Zhaoling Chen", "Gangda Deng", "Jishen Zhao"], "brief": "CodeNib \u662f\u4e00\u4e2a\u9762\u5411\u7f16\u7801\u667a\u80fd\u4f53\u7684\u591a\u89c6\u56fe\u4ed3\u5e93\u4e0a\u4e0b\u6587\u7cfb\u7edf\uff0c\u4e3a\u6bcf\u4e2a\u4ee3\u7801\u4ed3\u5e93\u63d0\u4ea4\u6784\u5efa\u53ef\u590d\u7528\u7684\u8bcd\u6cd5\u3001\u5411\u91cf\u4e0e\u7ed3\u6784\u89c6\u56fe\u3002\u5b83\u7edf\u4e00\u63d0\u4f9b\u6392\u5e8f\u641c\u7d22\u3001\u7b26\u53f7\u5bfc\u822a\u548c\u6709\u754c\u4e0a\u4e0b\u6587\uff0c\u5e76\u5728\u4ee3\u7801\u7f16\u8f91\u540e\u7ef4\u62a4\u90e8\u5206\u89c6\u56fe\u6709\u6548\u6027\u3002", "categories": ["cs.SE"], "github_repo": "https://github.com/sysevol-ai/CodeNib", "github_stars": 20, "hf_url": "https://huggingface.co/papers/2607.25431", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u7d22\u5f15\u3001\u8bed\u8a00\u670d\u52a1\u5668\u548c\u4efb\u52a1\u5386\u53f2\u6574\u5408\u5230\u540c\u4e00\u8fd0\u884c\u65f6\uff0c\u8f93\u51fa\u6620\u5c04\u5230\u4ed3\u5e93\u76f8\u5bf9\u6e90\u7801\u8303\u56f4\uff0c\u4fbf\u4e8e\u8de8\u4efb\u52a1\u590d\u7528\u4e0a\u4e0b\u6587\u3002", "\u5728100\u4e2a\u4ed3\u5e93\u5feb\u7167\u4e0a\u8bc4\u4f30\u4e0a\u4e0b\u6587\u751f\u547d\u5468\u671f\u7684\u8d28\u91cf-\u6210\u672c\u6743\u8861\uff1b\u4e0e\u72ec\u7acb\u91cd\u5efa\u7ed3\u679c\u4e00\u81f4\u65f6\uff0c\u56fe\u66f4\u65b0\u548c\u5411\u91cf\u66f4\u65b0\u4e2d\u4f4d\u901f\u5ea6\u5206\u522b\u63d0\u53478.7\u500d\u548c25.4\u500d\u3002", "\u5728\u9759\u6001\u5bfc\u822a\u5b50\u96c6\u4e0a\uff0c\u5b9e\u65f6\u8bed\u8a00\u670d\u52a1\u5668\u76f8\u5bf9\u9759\u6001\u670d\u52a1\u7684\u4e2d\u4f4d\u5ef6\u8fdf\u9ad84.7\u500d\uff1b\u7cbe\u9009\u4e0a\u4e0b\u6587\u7b56\u7565\u76f8\u6bd4grep/read\u51cf\u5c1150%\u201487%\u7684\u8f68\u8ff9token\uff0c\u540c\u65f6\u4fdd\u6301\u5b9a\u4f4d\u80fd\u529b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u68c0\u7d22"], "num_comments": 1, "on_hf": true, "organization": "SysEvol AI Research", "pdf_url": "https://arxiv.org/pdf/2607.25431v1", "published_at": "2026-07-28", "score": 0.311, "selected_reasons": ["HF trending (56\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.25431.png", "title": "CodeNib: A Multi-View Data System for Serving Repository Context to Coding Agents", "tldr": "\u4e3a\u7f16\u7801\u667a\u80fd\u4f53\u7edf\u4e00\u670d\u52a1\u4ed3\u5e93\u4e0a\u4e0b\u6587", "upvotes": 56, "what_it_is": "CodeNib \u662f\u4e00\u4e2a\u9762\u5411\u7f16\u7801\u667a\u80fd\u4f53\u7684\u591a\u89c6\u56fe\u4ed3\u5e93\u4e0a\u4e0b\u6587\u7cfb\u7edf\uff0c\u4e3a\u6bcf\u4e2a\u4ee3\u7801\u4ed3\u5e93\u63d0\u4ea4\u6784\u5efa\u53ef\u590d\u7528\u7684\u8bcd\u6cd5\u3001\u5411\u91cf\u4e0e\u7ed3\u6784\u89c6\u56fe\u3002\u5b83\u7edf\u4e00\u63d0\u4f9b\u6392\u5e8f\u641c\u7d22\u3001\u7b26\u53f7\u5bfc\u822a\u548c\u6709\u754c\u4e0a\u4e0b\u6587\uff0c\u5e76\u5728\u4ee3\u7801\u7f16\u8f91\u540e\u7ef4\u62a4\u90e8\u5206\u89c6\u56fe\u6709\u6548\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7f16\u7801\u667a\u80fd\u4f53\u53cd\u590d\u68c0\u7d22\u3001\u5bfc\u822a\u548c\u4fdd\u7559\u4ed3\u5e93\u4e0a\u4e0b\u6587\u7684\u95ee\u9898\u7cfb\u7edf\u5316\uff0c\u5f3a\u8c03\u591a\u89c6\u56fe\u590d\u7528\u4e0e\u663e\u5f0f\u6709\u6548\u6027\u8fb9\u754c\uff0c\u6709\u671b\u964d\u4f4e\u957f\u7a0b\u4ee3\u7801\u4efb\u52a1\u4e2d\u7684\u5ef6\u8fdf\u3001token\u6210\u672c\u548c\u91cd\u590d\u53d1\u73b0\u5f00\u9500\u3002"}, {"abstract": "Vision-language-action (VLA) models commonly adopt an LLM-centric $V \\to L \\to A$ pathway, where visual observations are projected into the representation space of a large language model before being decoded into robot actions. Although effective, this design incurs substantial computation and memory overhead at every policy invocation. In this work, we introduce TurboVLA, a new VLA paradigm that reformulates the conventional $V \\to L \\to A$ pathway as a direct $V + L \\to A$ mapping. Instead of using a large language model as the central interface between perception and action, TurboVLA independently encodes visual observations and language instructions, directly exchanges information between them through lightweight bidirectional vision-language interaction, and predicts continuous action chunks with a compact decoder. This simple design constructs task-conditioned representations directly from visual and linguistic features, significantly reducing the computational and memory costs of VLA inference. On LIBERO, TurboVLA achieves 97.7% average success with only 0.2B parameters, 31.2 ms inference latency, and 0.9 GB inference VRAM on a consumer-grade RTX 4090, matching or outperforming substantially larger VLA policies. These results establish TurboVLA as a simple and effective alternative to the prevailing LLM-centric VLA paradigm, offering a new perspective on how vision, language, and action can be connected for efficient robotic manipulation. Code is available at https://github.com/H-EmbodVis/TurboVLA.", "arxiv_id": "2607.27205", "arxiv_url": "https://arxiv.org/abs/2607.27205", "authors": ["Hengyi Xie", "Chenfei Yao", "Xianjin Wu", "Xuanyang Xi", "Yiping Tang", "Di Xu", "Yingying Zhu", "Dingkang Liang", "Xiang Bai", "Han Ding"], "brief": "\u8bba\u6587\u63d0\u51fa TurboVLA\uff0c\u5c06\u4f20\u7edf\u4ee5\u5927\u8bed\u8a00\u6a21\u578b\u4e3a\u4e2d\u5fc3\u7684 V\u2192L\u2192A \u6d41\u7a0b\u6539\u4e3a\u76f4\u63a5\u7684 V+L\u2192A \u6620\u5c04\u3002\u5b83\u5206\u522b\u7f16\u7801\u89c6\u89c9\u4e0e\u8bed\u8a00\uff0c\u901a\u8fc7\u8f7b\u91cf\u53cc\u5411\u4ea4\u4e92\u878d\u5408\u4fe1\u606f\uff0c\u5e76\u7528\u7d27\u51d1\u89e3\u7801\u5668\u9884\u6d4b\u8fde\u7eed\u52a8\u4f5c\u5757\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/H-EmbodVis/TurboVLA", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2607.27205", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6452\u5f03\u6bcf\u6b21\u63a8\u7406\u90fd\u4f9d\u8d56\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u4ecb\u7684\u8bbe\u8ba1\uff0c\u663e\u8457\u964d\u4f4e\u8ba1\u7b97\u4e0e\u663e\u5b58\u5f00\u9500", "\u5728 LIBERO \u4e0a\u8fbe\u5230 97.7% \u5e73\u5747\u6210\u529f\u7387\uff0c\u5339\u914d\u6216\u8d85\u8fc7\u66f4\u5927\u89c4\u6a21 VLA \u7b56\u7565", "\u4ec5 0.2B \u53c2\u6570\uff0c\u5728 RTX 4090 \u4e0a\u63a8\u7406\u5ef6\u8fdf 31.2 ms\u3001\u663e\u5b58 0.9 GB\uff0c\u53ef\u5b9e\u73b0\u7ea6 32 Hz \u5b9e\u65f6\u63a7\u5236"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba", "\u591a\u6a21\u6001", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "H-EmbodVis", "pdf_url": "https://arxiv.org/pdf/2607.27205v1", "published_at": "2026-07-29", "score": 0.291, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.27205.png", "title": "TurboVLA: Real-Time Vision-Language-Action Model at 32 Hz on an RTX 4090 with \u003c1 GB VRAM", "tldr": "0.2B\u53c2\u6570\u5b9e\u73b032Hz\u5b9e\u65f6VLA\u673a\u5668\u4eba\u63a7\u5236", "upvotes": 10, "what_it_is": "\u8bba\u6587\u63d0\u51fa TurboVLA\uff0c\u5c06\u4f20\u7edf\u4ee5\u5927\u8bed\u8a00\u6a21\u578b\u4e3a\u4e2d\u5fc3\u7684 V\u2192L\u2192A \u6d41\u7a0b\u6539\u4e3a\u76f4\u63a5\u7684 V+L\u2192A \u6620\u5c04\u3002\u5b83\u5206\u522b\u7f16\u7801\u89c6\u89c9\u4e0e\u8bed\u8a00\uff0c\u901a\u8fc7\u8f7b\u91cf\u53cc\u5411\u4ea4\u4e92\u878d\u5408\u4fe1\u606f\uff0c\u5e76\u7528\u7d27\u51d1\u89e3\u7801\u5668\u9884\u6d4b\u8fde\u7eed\u52a8\u4f5c\u5757\u3002", "why_notable": "\u5b83\u6311\u6218\u4e86\u5f53\u524d VLA \u6a21\u578b\u4f9d\u8d56\u5927\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u6838\u5fc3\u63a5\u53e3\u7684\u4e3b\u6d41\u8303\u5f0f\uff0c\u8bc1\u660e\u8f7b\u91cf\u89c6\u89c9-\u8bed\u8a00\u76f4\u63a5\u4ea4\u4e92\u4e5f\u80fd\u5b9e\u73b0\u9ad8\u6027\u80fd\u673a\u5668\u4eba\u64cd\u63a7\uff0c\u5bf9\u4f4e\u6210\u672c\u3001\u5b9e\u65f6\u90e8\u7f72\u5177\u5907\u91cd\u8981\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal automated fact-checking (MAFC) verifies claims by retrieving and reasoning over external evidence. However, most existing static benchmarks risk contamination: they primarily consist of outdated claims verifiable using an LLM\u0027s internal knowledge without external evidence. This can inflate performance estimates and fail to reflect true capability on novel claims that require up-to-date information. To address this, emerging dynamic benchmarks collect claims published after LLMs\u0027 knowledge cut-off dates, assuming they are uncontaminated. This work revisits this assumption by empirically studying contamination risks in both the state-of-the-art (SOTA) static AVeriTeC benchmark and our newly constructed dynamic ClaimReview2025Q4 benchmark, as well as their impact on MAFC evaluation. Our experiments yield 16 findings, highlighting three key results: (1) Dynamic evaluation reduces but does not eliminate contamination risks, as 17.09\\%--29.30\\% of post-cut-off claims remain potentially contaminated; (2) Many newly published claims can be verified either directly or by synthesizing multiple pieces of public knowledge available before the cut-off; and (3) Contamination can induce statistically significant inflation in MAFC performance, increasing Macro-F1 by up to 11.34 points and distorting system rankings. In light of these findings, we re-evaluate SOTA LLMs under a strictly contamination-controlled setting. Our study provides practical guidelines for trustworthy MAFC evaluation.", "arxiv_id": "2607.23514", "arxiv_url": "https://arxiv.org/abs/2607.23514", "authors": ["Haorui He", "Xinwen Chen", "Dacheng Wen", "Reynold Cheng", "Francis C. M. Lau", "Yupeng Li"], "brief": "\u672c\u6587\u91cd\u65b0\u5ba1\u89c6\u591a\u6a21\u6001\u81ea\u52a8\u4e8b\u5b9e\u6838\u67e5\u4e2d\u7684\u201c\u65e0\u6c61\u67d3\u201d\u52a8\u6001\u8bc4\u6d4b\u5047\u8bbe\uff0c\u6784\u5efa ClaimReview2025Q4 \u52a8\u6001\u57fa\u51c6\uff0c\u5e76\u5bf9\u9759\u6001 AVeriTeC \u4e0e\u65b0\u57fa\u51c6\u4e2d\u7684\u6c61\u67d3\u98ce\u9669\u53ca\u5176\u5bf9\u6a21\u578b\u6392\u540d\u7684\u5f71\u54cd\u8fdb\u884c\u5b9e\u8bc1\u5206\u6790\u3002", "categories": ["cs.CL", "cs.AI", "cs.MM"], "github_repo": "https://github.com/TrustworthyComp/Rethink-MAFC-Eval", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2607.23514", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u5373\u4f7f\u4f7f\u7528\u77e5\u8bc6\u622a\u6b62\u65e5\u671f\u4e4b\u540e\u53d1\u5e03\u7684\u58f0\u660e\uff0c\u4ecd\u6709 17.09%--29.30% \u53ef\u80fd\u88ab\u6a21\u578b\u5df2\u6709\u77e5\u8bc6\u6c61\u67d3\u3002", "\u8bb8\u591a\u65b0\u58f0\u660e\u53ef\u7531\u622a\u6b62\u65e5\u524d\u516c\u5f00\u77e5\u8bc6\u76f4\u63a5\u9a8c\u8bc1\uff0c\u6216\u901a\u8fc7\u7ec4\u5408\u591a\u6761\u65e7\u77e5\u8bc6\u63a8\u7406\u5f97\u5230\u7b54\u6848\u3002", "\u77e5\u8bc6\u6c61\u67d3\u4f1a\u663e\u8457\u62ac\u9ad8 MAFC \u6027\u80fd\uff0cMacro-F1 \u6700\u9ad8\u865a\u589e 11.34 \u5206\uff0c\u5e76\u53ef\u80fd\u6539\u53d8\u7cfb\u7edf\u6392\u540d\u3002"], "keywords": ["\u4e8b\u5b9e\u6838\u67e5", "\u591a\u6a21\u6001", "\u8bc4\u6d4b\u57fa\u51c6", "\u6570\u636e\u6c61\u67d3"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.23514v1", "published_at": "2026-07-26", "score": 0.269, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23514.png", "title": "Novel Claim or D\u00e9j\u00e0 Vu? Rethinking \"Contamination-Free\u0027\u0027 Dynamic Evaluation for Multimodal Automated Fact-Checking", "tldr": "\u52a8\u6001\u4e8b\u5b9e\u6838\u67e5\u8bc4\u6d4b\u4ecd\u96be\u514d\u77e5\u8bc6\u6c61\u67d3", "upvotes": 12, "what_it_is": "\u672c\u6587\u91cd\u65b0\u5ba1\u89c6\u591a\u6a21\u6001\u81ea\u52a8\u4e8b\u5b9e\u6838\u67e5\u4e2d\u7684\u201c\u65e0\u6c61\u67d3\u201d\u52a8\u6001\u8bc4\u6d4b\u5047\u8bbe\uff0c\u6784\u5efa ClaimReview2025Q4 \u52a8\u6001\u57fa\u51c6\uff0c\u5e76\u5bf9\u9759\u6001 AVeriTeC \u4e0e\u65b0\u57fa\u51c6\u4e2d\u7684\u6c61\u67d3\u98ce\u9669\u53ca\u5176\u5bf9\u6a21\u578b\u6392\u540d\u7684\u5f71\u54cd\u8fdb\u884c\u5b9e\u8bc1\u5206\u6790\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u52a8\u6001\u57fa\u51c6\u5929\u7136\u201c\u65e0\u6c61\u67d3\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u4e3a\u591a\u6a21\u6001\u4e8b\u5b9e\u6838\u67e5\u548c\u5927\u6a21\u578b\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u6c61\u67d3\u63a7\u5236\u65b9\u6cd5\u4e0e\u5b9e\u8df5\u6307\u5357\uff0c\u5bf9\u53ef\u4fe1\u8bc4\u6d4b\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Modern coding agents are usually evaluated by whether they eventually produce a correct patch, but patch generation depends on an earlier context-acquisition stage: finding the repository files needed for the task. We introduce Agent Retrieval Bench, a file-level benchmark for this upstream retrieval problem. Samples are built from real coding-workflow signals and evaluated against frozen base-commit repositories, with relevance defined by what an agent needs next rather than direct query-file semantic similarity. The benchmark covers four positive-retrieval tasks: code2test, comment2context, trace2code, and edit2ripple; a fifth subset evaluates selective retrieval using natural evidence-backed no-gold cases and counterfactual wrong-repository controls. Agent Retrieval Bench contains 427 samples across 25 repositories: 345 positive examples, 50 natural no-gold examples, and 32 counterfactual controls. The corpus includes 308 base-commit snapshots, 392,000 files, and 7.9 million chunks. We evaluate lexical retrieval, RepoMap, open-source embeddings, selective abstention, and logged agent context selection. No single retrieval family dominates: Qwen3-Embedding-4B has the best sample-weighted MRR on positive samples, Qwen3-Embedding-8B the best Recall@20, and RepoMap the best budgeted context yield at 8K tokens, with task-level winners differing substantially. Selective thresholds calibrated with counterfactual controls do not improve selective success on natural no-gold cases, revealing a calibration gap. Logged trajectories also miss every gold file on 27-35 percent of samples. A controlled seed-intervention pilot finds that retrieval-derived initial context yields higher file F1 with less post-seed exploration than random non-gold context, while oracle gold context shows substantial remaining headroom.", "arxiv_id": "2607.24882", "arxiv_url": "https://arxiv.org/abs/2607.24882", "authors": ["Bowen Qin", "Yi Xie"], "brief": "\u8bba\u6587\u63d0\u51fa Agent Retrieval Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u5728\u751f\u6210\u8865\u4e01\u524d\u80fd\u5426\u627e\u5230\u8d26\u6237\u4efb\u52a1\u6240\u9700\u7684\u4ed3\u5e93\u6587\u4ef6\u3002\u57fa\u51c6\u57fa\u4e8e\u771f\u5b9e\u7f16\u7801\u5de5\u4f5c\u6d41\u4fe1\u53f7\u6784\u5efa\uff0c\u8986\u76d6\u591a\u7c7b\u6587\u4ef6\u7ea7\u68c0\u7d22\u4e0e\u9009\u62e9\u6027\u62d2\u7b54\u573a\u666f\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL"], "github_repo": "https://github.com/eyuansu62/agent-retrieval-bench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2607.24882", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b 427 \u4e2a\u6837\u672c\u300125 \u4e2a\u4ee3\u7801\u4ed3\u5e93\u3001308 \u4e2a\u57fa\u7840\u63d0\u4ea4\u5feb\u7167\uff0c\u8986\u76d6\u7ea6 39.2 \u4e07\u6587\u4ef6\u4e0e 790 \u4e07\u4ee3\u7801\u5757\u3002", "\u8bbe\u8ba1 code2test\u3001comment2context\u3001trace2code\u3001edit2ripple \u56db\u7c7b\u6b63\u5411\u68c0\u7d22\u4efb\u52a1\uff0c\u5e76\u52a0\u5165\u81ea\u7136\u65e0\u91d1\u6807\u6837\u672c\u548c\u9519\u8bef\u4ed3\u5e93\u53cd\u4e8b\u5b9e\u63a7\u5236\u3002", "\u8bc4\u6d4b\u53d1\u73b0\u4e0d\u540c\u65b9\u6cd5\u5404\u6709\u4f18\u52bf\uff1aQwen3-Embedding \u5728 MRR/Recall \u4e0a\u9886\u5148\uff0cRepoMap \u5728 8K token \u9884\u7b97\u4e0b\u4e0a\u4e0b\u6587\u6536\u76ca\u66f4\u597d\uff1b\u667a\u80fd\u4f53\u65e5\u5fd7\u5728 27%-35% \u6837\u672c\u4e2d\u9057\u6f0f\u6240\u6709\u91d1\u6807\u6587\u4ef6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u4fe1\u606f\u68c0\u7d22", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24882v1", "published_at": "2026-07-27", "score": 0.245, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24882.png", "title": "Agent Retrieval Bench: Evaluating Repository Context Retrieval for Coding Agents", "tldr": "\u9762\u5411\u7f16\u7801\u667a\u80fd\u4f53\u7684\u4ed3\u5e93\u6587\u4ef6\u68c0\u7d22\u57fa\u51c6", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agent Retrieval Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u5728\u751f\u6210\u8865\u4e01\u524d\u80fd\u5426\u627e\u5230\u8d26\u6237\u4efb\u52a1\u6240\u9700\u7684\u4ed3\u5e93\u6587\u4ef6\u3002\u57fa\u51c6\u57fa\u4e8e\u771f\u5b9e\u7f16\u7801\u5de5\u4f5c\u6d41\u4fe1\u53f7\u6784\u5efa\uff0c\u8986\u76d6\u591a\u7c7b\u6587\u4ef6\u7ea7\u68c0\u7d22\u4e0e\u9009\u62e9\u6027\u62d2\u7b54\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u524d\u79fb\u5230\u201c\u4e0a\u4e0b\u6587\u83b7\u53d6\u201d\u8fd9\u4e00\u5173\u952e\u74f6\u9888\uff0c\u63ed\u793a\u73b0\u6709\u68c0\u7d22\u3001\u6821\u51c6\u548c\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u9009\u62e9\u4ecd\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u5bf9\u6539\u8fdb\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u4ed3\u5e93\u7ea7\u7406\u89e3\u4e0e\u5de5\u5177\u94fe\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present a reproducible pipeline for mapping Common Vulnerabilities and Exposures (CVEs) to MITRE ATT\u0026CK Enterprise techniques from free-text vulnerability descriptions. Rather than relying on the CWE-\u003eCAPEC-\u003eATT\u0026CK derivation chain, whose table-expansion artifacts we quantify, we train a multi-label classifier on a curated gold dataset of 1,207 CVEs from expert MITRE Center for Threat-Informed Defense mappings. The resulting model approximately doubles recall@5 compared with a zero-shot embedding-similarity baseline and improves every ranking metric. We then investigate whether LLM-assisted labeling can extend the gold dataset. Initial experiments suggest contradictory conclusions: a single run indicates degraded performance, while averaging over five random seeds suggests a small gain. However, an independent replication and an expansion-size study (100--984 additional CVEs) show that the apparent improvement is an evaluation artifact. LLM-generated labels, with approximately 0.39 agreement with expert annotations, provide no reliable improvement at any expansion size and reduce rare-technique coverage at around 1,000 added CVEs (macro-F1 decreases by 0.04). The root cause is evaluation noise. Selecting checkpoints on a small test split effectively maximizes over many noisy evaluations, producing recall@5 differences of up to 0.05 between otherwise identical runs. Using a corrected protocol based on validation-split checkpoint selection, the gold-only model achieves recall@5 of (0.673 \\pm 0.019), and repeating the decisive experiment confirms the null result for LLM expansion. A final scaling study shows that additional expert-curated data consistently improves performance, whereas LLM-labeled data does not, indicating that the classifier is limited by label quality rather than dataset size. All datasets, models, code, and training logs are publicly released.", "arxiv_id": "2607.25572", "arxiv_url": "https://arxiv.org/abs/2607.25572", "authors": ["C\u00e9dric Bonhomme", "Alexandre Dulaunoy"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53ef\u590d\u73b0\u6d41\u7a0b\uff0c\u5c06CVE\u6f0f\u6d1e\u63cf\u8ff0\u6620\u5c04\u5230MITRE ATT\u0026CK\u4f01\u4e1a\u6280\u672f\uff0c\u5e76\u57fa\u4e8e1207\u6761\u4e13\u5bb6\u7b56\u5c55\u91d1\u6807\u51c6\u6570\u636e\u8bad\u7ec3\u591a\u6807\u7b7e\u5206\u7c7b\u5668\u3002\u7814\u7a76\u8fd8\u7cfb\u7edf\u8bc4\u4f30LLM\u8f85\u52a9\u6269\u6807\uff0c\u53d1\u73b0\u5176\u5e76\u4e0d\u80fd\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u4e3b\u8981\u53d7\u6807\u7b7e\u8d28\u91cf\u4e0e\u8bc4\u4f30\u566a\u58f0\u9650\u5236\u3002", "categories": ["cs.CR"], "github_repo": "https://github.com/vulnerability-lookup/cve-attack-mapping-paper", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2607.25572", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u76f8\u6bd4\u96f6\u6837\u672c\u5d4c\u5165\u76f8\u4f3c\u5ea6\u57fa\u7ebf\uff0c\u91d1\u6807\u51c6\u8bad\u7ec3\u7684\u5206\u7c7b\u5668\u5728recall@5\u4e0a\u7ea6\u7ffb\u500d\uff0c\u5e76\u63d0\u5347\u6240\u6709\u6392\u5e8f\u6307\u6807", "LLM\u751f\u6210\u6807\u7b7e\u4e0e\u4e13\u5bb6\u6807\u6ce8\u4e00\u81f4\u6027\u4ec5\u7ea60.39\uff0c\u5728100\u5230984\u6761\u6269\u5c55\u89c4\u6a21\u4e0b\u5747\u65e0\u53ef\u9760\u6536\u76ca\uff0c\u4e14\u53ef\u80fd\u964d\u4f4e\u7a00\u6709\u6280\u672f\u8986\u76d6", "\u8bba\u6587\u6307\u51fa\u5c0f\u6d4b\u8bd5\u96c6\u4e0a\u7684checkpoint\u9009\u62e9\u4f1a\u653e\u5927\u8bc4\u4f30\u566a\u58f0\uff0c\u6539\u7528\u9a8c\u8bc1\u96c6\u9009\u62e9\u540e\u786e\u8ba4LLM\u6269\u6807\u7684\u589e\u76ca\u662f\u5047\u8c61"], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u6f0f\u6d1e\u5206\u6790", "\u591a\u6807\u7b7e\u5206\u7c7b", "LLM\u6807\u6ce8"], "num_comments": 1, "on_hf": true, "organization": "Computer Incident Response Center Luxembourg", "pdf_url": "https://arxiv.org/pdf/2607.25572v1", "published_at": "2026-07-28", "score": 0.222, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.25572.png", "title": "Mapping CVEs to MITRE ATT\u0026CK Techniques: A Curated Gold-Set Classifier and the Limits of LLM-Assisted Label Expansion", "tldr": "\u9ad8\u8d28\u91cf\u4e13\u5bb6\u6807\u6ce8\u80dc\u8fc7LLM\u6269\u6807", "upvotes": 2, "what_it_is": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53ef\u590d\u73b0\u6d41\u7a0b\uff0c\u5c06CVE\u6f0f\u6d1e\u63cf\u8ff0\u6620\u5c04\u5230MITRE ATT\u0026CK\u4f01\u4e1a\u6280\u672f\uff0c\u5e76\u57fa\u4e8e1207\u6761\u4e13\u5bb6\u7b56\u5c55\u91d1\u6807\u51c6\u6570\u636e\u8bad\u7ec3\u591a\u6807\u7b7e\u5206\u7c7b\u5668\u3002\u7814\u7a76\u8fd8\u7cfb\u7edf\u8bc4\u4f30LLM\u8f85\u52a9\u6269\u6807\uff0c\u53d1\u73b0\u5176\u5e76\u4e0d\u80fd\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u4e3b\u8981\u53d7\u6807\u7b7e\u8d28\u91cf\u4e0e\u8bc4\u4f30\u566a\u58f0\u9650\u5236\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3aCVE\u5230ATT\u0026CK\u6280\u672f\u6620\u5c04\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u5f00\u6e90\u57fa\u51c6\u548c\u6a21\u578b\uff0c\u540c\u65f6\u5bf9\u5b89\u5168\u9886\u57df\u5e38\u89c1\u7684LLM\u81ea\u52a8\u6807\u6ce8\u6269\u6570\u636e\u505a\u51fa\u8d1f\u9762\u4f46\u91cd\u8981\u7684\u5b9e\u8bc1\u7ed3\u8bba\uff1a\u6027\u80fd\u74f6\u9888\u5728\u6807\u6ce8\u8d28\u91cf\u800c\u975e\u6570\u636e\u91cf\u3002"}, {"abstract": "Forecasts of explosive AI progress hinge on AI agents automating AI research. But evidence on whether agents can carry out open-ended AI research is thin. Current evaluations either test agents on narrow, verifiable tasks, which excludes open-ended research, or submit AI-generated papers to blind peer review, which is overstretched, stochastic, and suffers from poor review quality. We introduce a third way to measure progress towards AI R\\\u0026D automation. An agent takes on the central, open-ended research question of a high-quality unpublished paper, and the paper\u0027s original authors grade its output. We call these shadow evaluations. We ran shadow evaluations on two unpublished NeurIPS 2026 submissions, giving frontier agents six days and thousands of dollars of compute. The agents completed all of the engineering without human help, yet could not make substantial progress towards answering the research questions. As a result, both papers were unambiguously rejected by the authors. We identify five recurring failure modes: poor judgment about the bar for publishable research, uncreative responses to shortcomings in the research design, ineffective backtracking from dead ends, poor resource awareness, and instruction drift. A robustness check with a second model and scaffold reproduced these failures. We release the expert reviews, survey responses, agent repositories, and logs. Our results provide early evidence that today\u0027s agents can do the engineering of AI research, but struggle with critical parts of the research lifecycle.", "arxiv_id": "2607.27191", "arxiv_url": "https://arxiv.org/abs/2607.27191", "authors": ["Peter Kirgis", "Sayash Kapoor", "Andrew Schwartz", "Stephan Rabanser", "David Africa", "Konstantinos Voudouris", "Viet Nguyen", "Toby Pilditch", "Magda Dubois", "Harry Coppock", "Cozmin Ududec", "Nitya Nadgir", "Matilda Orona", "Tilman Bayer", "Derrick Chan-Sew", "Yue Ling", "Abhishek Shetty", "Helen Toner", "Gillian Hadfield", "Seth Lazar", "Steve Newman", "Shoshannah Tekofsky", "Rishi Bommasani", "Arvind Narayanan"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u5f71\u5b50\u8bc4\u6d4b\u201d\uff1a\u8ba9 AI \u667a\u80fd\u4f53\u63a5\u624b\u9ad8\u8d28\u91cf\u672a\u53d1\u8868\u8bba\u6587\u7684\u6838\u5fc3\u5f00\u653e\u7814\u7a76\u95ee\u9898\uff0c\u518d\u7531\u539f\u4f5c\u8005\u8bc4\u5ba1\u5176\u4ea7\u51fa\u3002\u57fa\u4e8e\u4e24\u7bc7 NeurIPS 2026 \u6295\u7a3f\u6848\u4f8b\uff0c\u53d1\u73b0\u667a\u80fd\u4f53\u867d\u80fd\u72ec\u7acb\u5b8c\u6210\u5de5\u7a0b\u5b9e\u73b0\uff0c\u5374\u672a\u80fd\u5b9e\u8d28\u63a8\u8fdb\u7814\u7a76\u95ee\u9898\u3002", "categories": ["cs.AI", "cs.CY", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27191", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b\u5bf9\u8c61\u662f\u4e24\u7bc7\u672a\u53d1\u8868\u9ad8\u8d28\u91cf\u8bba\u6587\u7684\u5f00\u653e\u5f0f\u7814\u7a76\u95ee\u9898\uff0c\u667a\u80fd\u4f53\u83b7\u5f976\u5929\u65f6\u95f4\u548c\u6570\u5343\u7f8e\u5143\u7b97\u529b\u3002", "\u667a\u80fd\u4f53\u5b8c\u6210\u4e86\u5168\u90e8\u5de5\u7a0b\u5de5\u4f5c\uff0c\u4f46\u4e24\u9879\u4ea7\u51fa\u5747\u88ab\u539f\u4f5c\u8005\u660e\u786e\u5224\u5b9a\u4e3a\u4e0d\u8fbe\u53d1\u8868\u6807\u51c6\u3002", "\u5f52\u7eb3\u51fa\u4e94\u7c7b\u5931\u8d25\u6a21\u5f0f\uff1a\u53d1\u8868\u6807\u51c6\u5224\u65ad\u5dee\u3001\u7f3a\u4e4f\u521b\u9020\u6027\u4fee\u6b63\u3001\u96be\u4ee5\u4ece\u6b7b\u8def\u56de\u9000\u3001\u8d44\u6e90\u610f\u8bc6\u5f31\u3001\u6307\u4ee4\u6f02\u79fb\u3002"], "keywords": ["\u667a\u80fd\u4f53", "AI\u79d1\u7814", "\u8bc4\u6d4b\u57fa\u51c6", "\u81ea\u52a8\u5316\u7814\u7a76"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27191v1", "published_at": "2026-07-29", "score": 0.218, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.27191.png", "title": "Can AI agents conduct open-ended AI research? Early evidence from two case studies", "tldr": "\u524d\u6cbf\u667a\u80fd\u4f53\u80fd\u505a\u5de5\u7a0b\uff0c\u96be\u505a\u5f00\u653e\u7814\u7a76\u3002", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u5f71\u5b50\u8bc4\u6d4b\u201d\uff1a\u8ba9 AI \u667a\u80fd\u4f53\u63a5\u624b\u9ad8\u8d28\u91cf\u672a\u53d1\u8868\u8bba\u6587\u7684\u6838\u5fc3\u5f00\u653e\u7814\u7a76\u95ee\u9898\uff0c\u518d\u7531\u539f\u4f5c\u8005\u8bc4\u5ba1\u5176\u4ea7\u51fa\u3002\u57fa\u4e8e\u4e24\u7bc7 NeurIPS 2026 \u6295\u7a3f\u6848\u4f8b\uff0c\u53d1\u73b0\u667a\u80fd\u4f53\u867d\u80fd\u72ec\u7acb\u5b8c\u6210\u5de5\u7a0b\u5b9e\u73b0\uff0c\u5374\u672a\u80fd\u5b9e\u8d28\u63a8\u8fdb\u7814\u7a76\u95ee\u9898\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u4f9b\u4e86\u4ecb\u4e8e\u7a84\u4efb\u52a1\u57fa\u51c6\u548c\u76f2\u5ba1\u8bba\u6587\u4e4b\u95f4\u7684\u65b0\u578b\u8bc4\u6d4b\u8303\u5f0f\uff0c\u5bf9\u201cAI \u81ea\u52a8\u5316\u79d1\u7814\u201d\u80fd\u529b\u7ed9\u51fa\u66f4\u8d34\u8fd1\u771f\u5b9e\u7814\u53d1\u6d41\u7a0b\u7684\u65e9\u671f\u8bc1\u636e\uff0c\u663e\u793a\u5f53\u524d\u667a\u80fd\u4f53\u8ddd\u79bb\u5f00\u653e\u5f0f AI \u7814\u7a76\u81ea\u52a8\u5316\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002"}, {"abstract": "Biomedical image analysis spans diverse modalities and tasks, yet real-world deployment is hindered by severe distribution shifts across scanners, protocols, and patient populations. High-performing models consequently require repeated domain-specific fine-tuning, which is a costly cycle that becomes impractical when labels are scarce or privacy constraints limit data sharing. We propose OPERA (Offline Policy-guided Expert Routing and Adaptation), a multi-agent ensemble framework that addresses this deployment bottleneck by treating expert weight assignment as an offline policy learning problem: a routing policy is learned from a small validation set without gradient updates to any expert agent, then deployed with test-time adaptation to handle distribution shift. OPERA coordinates heterogeneous specialist agents through complementary mechanisms. The expert profiling module learns selection policies offline, enabling informed allocation of expertise. Each agent undergoes confidence calibration through temperature adjustment, ensuring more reliable probabilistic outputs. OPERA also incorporates distribution aware adaptation, where class weights are dynamically adjusted at the batch level using statistics derived from unlabeled test data. Instance level routing assigns each sample to the most suitable expert by leveraging inter model agreement and predictive entropy. We evaluate OPERA on 9 datasets covering fundus photography, chest X-ray, CT, MRI, and multimodal diagnostic benchmarks, comparing against 30+ baselines across classification, segmentation, and multimodal settings. OPERA consistently improves performance and calibration quality, demonstrating that offline policy-guided expert agents coordination is a practical path to deployable biomedical AI without retraining. Code is on \\href{https://github.com/HUANGLIZI/OPERA}{GitHub}.", "arxiv_id": "2607.25108", "arxiv_url": "https://arxiv.org/abs/2607.25108", "authors": ["Zihan Li", "Feiyang Liu", "Dandan Shan", "Ruibo Wang", "Qingqi Hong"], "brief": "OPERA \u5c06\u591a\u4e2a\u751f\u7269\u533b\u5b66\u5f71\u50cf\u4e13\u5bb6\u6a21\u578b\u7684\u6743\u91cd\u5206\u914d\u5efa\u6a21\u4e3a\u79bb\u7ebf\u7b56\u7565\u5b66\u4e60\u95ee\u9898\uff0c\u7528\u5c11\u91cf\u9a8c\u8bc1\u96c6\u5b66\u4e60\u8def\u7531\u7b56\u7565\uff0c\u5e76\u5728\u6d4b\u8bd5\u65f6\u8fdb\u884c\u65e0\u76d1\u7763\u9002\u5e94\u3002\u5b83\u5728\u4e0d\u66f4\u65b0\u4e13\u5bb6\u6a21\u578b\u68af\u5ea6\u7684\u524d\u63d0\u4e0b\uff0c\u534f\u8c03\u5f02\u6784\u4e13\u5bb6\u4ee5\u5e94\u5bf9\u8de8\u626b\u63cf\u4eea\u3001\u534f\u8bae\u548c\u4eba\u7fa4\u5e26\u6765\u7684\u5206\u5e03\u504f\u79fb\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG", "eess.IV"], "github_repo": "https://github.com/HUANGLIZI/OPERA", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.25108", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u4e13\u5bb6\u753b\u50cf\u6a21\u5757\u79bb\u7ebf\u5b66\u4e60\u9009\u62e9\u7b56\u7565\uff0c\u5b9e\u73b0\u5bf9\u4e0d\u540c\u4e13\u5bb6\u6a21\u578b\u7684\u6709\u9488\u5bf9\u6027\u8def\u7531\u4e0e\u52a0\u6743\u3002", "\u7ed3\u5408\u6e29\u5ea6\u7f29\u653e\u7f6e\u4fe1\u5ea6\u6821\u51c6\u3001\u57fa\u4e8e\u65e0\u6807\u7b7e\u6d4b\u8bd5\u6279\u6b21\u7edf\u8ba1\u7684\u7c7b\u522b\u6743\u c\u907f\u514d\u53cd\u590d\u9488\u5bf9\u65b0\u57df\u5fae\u8c03\u6a21\u578b\uff0c\u540c\u65f6\u63d0\u5347\u6027\u80fd\u4e0e\u6821\u51c6\u8d28\u91cf\uff0c\u4e3a\u53ef\u90e8\u7f72\u7684\u901a\u7528\u751f\u7269\u533b\u5b66\u5f71\u50cf AI \u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "A language model $p_\u03b8(y \\mid x)$ trained on reasoning tasks learns to solve problems via multiple distinct strategies, yet these strategies are implicit and entangled within the model\u0027s response distribution. We study the problem of decomposing the response distribution of a given pretrained language model into a structured, strategy-conditioned representation. Specifically, we learn a latent-variable factorization $p_\u03b8(y \\mid x) \\leadsto (r_\u03c6(z \\mid x), g_\u03c6(y \\mid x,z))$, where a router $r$ maps each input to a distribution over latent strategies $z$ and a generator $g$ produces the response conditioned on that strategy. A key challenge is that the generator, initialized from the base model, already represents $p_\u03b8(y \\mid x)$ without using $z$. Standard variational inference therefore gives the model no incentive to route information through $z$ and can yield a severe form of posterior collapse. To address this, we propose a variational objective that measures fractional information gain relative to the base model\u0027s response loss and concentrates reconstruction pressure on tokens with high base model surprisal, encouraging $z$ to encode strategy-relevant response variation. We introduce a benchmark of multi-strategy algorithmic tasks and show that this objective recovers latent codes aligned with distinct reference strategies while preserving the base model\u0027s response distribution.", "arxiv_id": "2607.17674", "arxiv_url": "https://arxiv.org/abs/2607.17674", "authors": ["Awni Altabaa", "John Lafferty"], "brief": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u5c06\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u4efb\u52a1\u4e0a\u7684\u54cd\u5e94\u5206\u5e03\u5206\u89e3\u4e3a\u201c\u7b56\u7565\u8def\u7531\u5668+\u6761\u4ef6\u751f\u6210\u5668\u201d\u7684\u6f5c\u53d8\u91cf\u8868\u793a\u3002\u4f5c\u8005\u63d0\u51fa\u65b0\u7684\u53d8\u5206\u76ee\u6807\uff0c\u4fc3\u4f7f\u6f5c\u53d8\u91cf\u6355\u6349\u4e0d\u540c\u63a8\u7406\u7b56\u7565\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u539f\u6a21\u578b\u7684\u8f93\u51fa\u5206\u5e03\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/Awni00/latent-strategies-in-lms", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.17674", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u5206\u89e3\u5f62\u5f0f\uff1a\u8def\u7531\u5668 r \u6839\u636e\u8f93\u5165\u5206\u914d\u6f5c\u5728\u7b56\u7565 z\uff0c\u751f\u6210\u5668 g \u5728\u7b56\u7565\u6761\u4ef6\u4e0b\u751f\u6210\u56de\u7b54\u3002", "\u9488\u5bf9\u751f\u6210\u5668\u5df2\u80fd\u5ffd\u7565 z \u590d\u73b0\u539f\u6a21\u578b\u8f93\u51fa\u5bfc\u81f4\u7684\u540e\u9a8c\u574d\u584c\uff0c\u8bbe\u8ba1\u76f8\u5bf9\u57fa\u7840\u6a21\u578b\u635f\u5931\u7684\u201c\u5206\u6570\u4fe1\u606f\u589e\u76ca\u201d\u76ee\u6807\u3002", "\u5c06\u91cd\u6784\u538b\u529b\u96c6\u4e2d\u5728\u57fa\u7840\u6a21\u578b\u9ad8\u60ca\u8bb6\u5ea6 token \u4e0a\uff0c\u4f7f\u6f5c\u53d8\u91cf\u66f4\u5173\u6ce8\u7b56\u7565\u76f8\u5173\u7684\u54cd\u5e94\u5dee\u5f02\u3002", "\u6784\u5efa\u591a\u7b56\u7565\u7b97\u6cd5\u4efb\u52a1\u57fa\u51c6\uff0c\u5b9e\u9a8c\u663e\u793a\u53ef\u6062\u590d\u4e0e\u53c2\u8003\u7b56\u7565\u5bf9\u9f50\u7684\u6f5c\u5728\u4ee3\u7801\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u6f5c\u53d8\u91cf", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 1, "on_hf": true, "organization": "Yale University", "pdf_url": "https://arxiv.org/pdf/2607.17674v1", "published_at": "2026-07-20", "score": 0.204, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.17674.png", "title": "Uncovering Latent Reasoning Strategies in Language Models", "tldr": "\u4ece\u8bed\u8a00\u6a21\u578b\u4e2d\u89e3\u8026\u9690\u542b\u63a8\u7406\u7b56\u7565", "upvotes": 1, "what_it_is": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u5c06\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u4efb\u52a1\u4e0a\u7684\u54cd\u5e94\u5206\u5e03\u5206\u89e3\u4e3a\u201c\u7b56\u7565\u8def\u7531\u5668+\u6761\u4ef6\u751f\u6210\u5668\u201d\u7684\u6f5c\u53d8\u91cf\u8868\u793a\u3002\u4f5c\u8005\u63d0\u51fa\u65b0\u7684\u53d8\u5206\u76ee\u6807\uff0c\u4fc3\u4f7f\u6f5c\u53d8\u91cf\u6355\u6349\u4e0d\u540c\u63a8\u7406\u7b56\u7565\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u539f\u6a21\u578b\u7684\u8f93\u51fa\u5206\u5e03\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u89e3\u91ca\u548c\u63a7\u5236\u8bed\u8a00\u6a21\u578b\u7684\u591a\u6837\u5316\u63a8\u7406\u65b9\u5f0f\u63d0\u4f9b\u4e86\u7ed3\u6784\u5316\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u6a21\u578b\u5185\u90e8\u9690\u542b\u7b56\u7565\uff0c\u5e76\u53ef\u80fd\u652f\u6301\u66f4\u53ef\u63a7\u7684\u63a8\u7406\u751f\u6210\u4e0e\u6a21\u578b\u8bca\u65ad\u3002"}, {"abstract": "Large language model (LLM) agents may recover from a failure within an episode or after a retry, yet the same execution failure can recur in later tasks because post-episode feedback rarely revises the persistent harness that guides future interactions. Static harnesses improve reliability through fixed tools, context, memory, and workflow structures, but remain unchanged after deployment. We propose $\\textbf{Living-Harness}$, a self-evolving agent harness that converts each completed trajectory and its evaluator signals into posterior evidence for bounded harness updates. Guided by a domain-level $\\textbf{Evolution-SOP}$ ($\\textbf{S}$tandard $\\textbf{O}$perating $\\textbf{P}$rocedure), Living-Harness extracts an episode abstraction and structured update evidence, and writes two complementary forms of procedural knowledge: episodic memory that records trigger conditions, failure patterns, and recovery actions, and a state graph that records state nodes, repair edges, and transition rules. The updated harness state is retrieved to guide future interactions, while tools and base context remain frozen, allowing procedural repairs to accumulate across evolution cycles. On eight interactive environments derived from $\u03c4^2$-Bench and MultiWOZ-2.4, Living-Harness improves average Pass@1 over the strongest interactive baseline by 10.07 and 9.91 percentage points, respectively, and supports retrieval-only reuse of the evolved harness state across model backbones.", "arxiv_id": "2607.26598", "arxiv_url": "https://arxiv.org/abs/2607.26598", "authors": ["Yuetian Du", "Yucheng Wang", "He Xu", "Jiexu Xu", "Shanwen Tan", "Bing Zhao", "Boyu Yang", "Zhijie Xu", "Ming Kong", "Hu Wei", "Jie Liu", "Qiang Zhu"], "brief": "\u672c\u6587\u63d0\u51fa Living-Harness\uff0c\u4e00\u79cd\u81ea\u6f14\u5316\u7684\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\uff0c\u53ef\u5c06\u6bcf\u6b21\u4efb\u52a1\u8f68\u8ff9\u548c\u8bc4\u4f30\u4fe1\u53f7\u8f6c\u5316\u4e3a\u5bf9\u672a\u6765\u4ea4\u4e92\u6d41\u7a0b\u7684\u66f4\u65b0\u8bc1\u636e\u3002\u5b83\u5728\u4e0d\u6539\u53d8\u5de5\u5177\u548c\u57fa\u7840\u4e0a\u4e0b\u6587\u7684\u524d\u63d0\u4e0b\uff0c\u6301\u7eed\u79ef\u7d2f\u7a0b\u5e8f\u6027\u4fee\u590d\u77e5\u8bc6\u4ee5\u51cf\u5c11\u91cd\u590d\u5931\u8d25\u3002", "categories": ["cs.MA", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26598", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u9886\u57df\u7ea7 Evolution-SOP\uff0c\u4ece\u5df2\u5b8c\u6210\u8f68\u8ff9\u4e2d\u62bd\u53d6\u4efb\u52a1\u62bd\u8c61\u4e0e\u7ed3\u6784\u5316\u66f4\u65b0\u8bc1\u636e\uff0c\u7528\u4e8e\u6709\u8fb9\u754c\u5730\u66f4\u65b0 harness\u3002", "\u5199\u5165\u4e24\u7c7b\u7a0b\u5e8f\u6027\u77e5\u8bc6\uff1a\u8bb0\u5f55\u89e6\u53d1\u6761\u4ef6\u3001\u5931\u8d25\u6a21\u5f0f\u3001\u6062\u590d\u52a8\u4f5c\u7684\u60c5\u666f\u8bb0\u5fc6\uff0c\u4ee5\u53ca\u8bb0\u5f55\u72b6\u6001\u8282\u70b9\u3001\u4fee\u590d\u8fb9\u548c\u8f6c\u79fb\u89c4\u5219\u7684\u72b6\u6001\u56fe\u3002", "\u5728 \u03c4\u00b2-Bench \u548c MultiWOZ-2.4 \u884d\u751f\u7684 8 \u4e2a\u4ea4\u4e92\u73af\u5883\u4e2d\uff0c\u8f83\u6700\u5f3a\u4ea4\u4e92\u5f0f\u57fa\u7ebf\u5e73\u5747 Pass@1 \u5206\u522b\u63d0\u5347 10.07 \u548c 9.91 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u53ef\u8de8\u6a21\u578b\u9aa8\u5e72\u590d\u7528\u5df2\u8fdb\u5316\u72b6\u6001\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ea4\u4e92\u5f0f\u4efb\u52a1", "\u8bb0\u5fc6\u673a\u5236", "\u81ea\u6211\u8fdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26598v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Living-Harness Is an Interactive-Agent Evolver", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u7684\u4ea4\u4e92\u6d41\u7a0b\u53ef\u6301\u7eed\u81ea\u6211\u8fdb\u5316", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Living-Harness\uff0c\u4e00\u79cd\u81ea\u6f14\u5316\u7684\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\uff0c\u53ef\u5c06\u6bcf\u6b21\u4efb\u52a1\u8f68\u8ff9\u548c\u8bc4\u4f30\u4fe1\u53f7\u8f6c\u5316\u4e3a\u5bf9\u672a\u6765\u4ea4\u4e92\u6d41\u7a0b\u7684\u66f4\u65b0\u8bc1\u636e\u3002\u5b83\u5728\u4e0d\u6539\u53d8\u5de5\u5177\u548c\u57fa\u7840\u4e0a\u4e0b\u6587\u7684\u524d\u63d0\u4e0b\uff0c\u6301\u7eed\u79ef\u7d2f\u7a0b\u5e8f\u6027\u4fee\u590d\u77e5\u8bc6\u4ee5\u51cf\u5c11\u91cd\u590d\u5931\u8d25\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u5931\u8d25\u540e\u7684\u53cd\u9988\u4ece\u4e00\u6b21\u6027\u7ea0\u9519\u63a8\u8fdb\u5230\u6301\u4e45\u5316\u6d41\u7a0b\u6f14\u5316\uff0c\u89e3\u51b3\u9759\u6001 harness \u90e8\u7f72\u540e\u65e0\u6cd5\u5438\u6536\u7ecf\u9a8c\u7684\u95ee\u9898\uff0c\u5bf9\u63d0\u5347\u957f\u671f\u4ea4\u4e92\u53ef\u9760\u6027\u548c\u53ef\u8fc1\u79fb\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Automated research systems use experimental scores both to deliver artifacts and to decide which ideas to retain, transfer, and pursue. Yet one run scores one implementation of an idea. Crediting that realization-level score as evidence about the parent mechanism creates the \\emph{implementation lottery}, in which an idea-level conclusion depends on which plausible implementation was sampled. The mismatch is structural whenever one run updates beliefs about a mechanism. We estimate its magnitude. The \\emph{Idea Reliability Audit} measures \\emph{idea reliability} by validating and freezing candidate cards, sampling fresh-session implementations, using outcome-blind fidelity labels, and rerunning saved artifacts. It reports idea ICC and leave-one-implementation-out (LOO) winner reversal. Prior work generally repeats the task; we repeat the idea. Across 312 assignments on 13 tabular tasks and two coding-agent setups, implementation variance was more than five and ten times same-artifact rerun variance, respectively, and the winner from one implementation draw differed from the winner under the other-two mean in 25.6\\% and 43.6\\% of decisions. Reversal survives card-level filtering under two outcome-blind review rules. An exploratory diagnostic on three materials-regression workflows with a deterministic evaluator also finds implementation variation dominating the decomposition. These findings distinguish idea reliability from best-of-$N$ artifact utility. Before a score guides idea-level branching, transfer, or research memory, evidence should cover multiple implementations.", "arxiv_id": "2607.26587", "arxiv_url": "https://arxiv.org/abs/2607.26587", "authors": ["Jingjie Ning", "Shanshan Zhong", "Xiaochuan Li", "Ji Zeng", "Chenyan Xiong"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u5b9e\u73b0\u5f69\u7968\u201d\u6982\u5ff5\uff1a\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u7528\u4e00\u6b21\u8fd0\u884c\u7ed3\u679c\u8bc4\u4f30\u60f3\u6cd5\u65f6\uff0c\u5b9e\u9645\u53ea\u8bc4\u4f30\u4e86\u8be5\u60f3\u6cd5\u7684\u67d0\u4e2a\u5177\u4f53\u5b9e\u73b0\u3002\u4f5c\u8005\u8bbe\u8ba1 Idea Reliability Audit\uff0c\u901a\u8fc7\u591a\u6b21\u72ec\u7acb\u5b9e\u73b0\u3001\u76f2\u5ba1\u4fdd\u771f\u5ea6\u6807\u6ce8\u548c\u590d\u8dd1\u4ea7\u7269\u6765\u91cf\u5316\u60f3\u6cd5\u7ea7\u53ef\u9760\u6027\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26587", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u572813\u4e2a\u8868\u683c\u4efb\u52a1\u548c\u4e24\u4e2a\u7f16\u7801\u667a\u80fd\u4f53\u8bbe\u7f6e\u7684312\u4e2a\u5b9e\u9a8c\u4e2d\uff0c\u5b9e\u73b0\u95f4\u65b9\u5dee\u5206\u522b\u8d85\u8fc7\u540c\u4e00\u4ea7\u7269\u590d\u8dd1\u65b9\u5dee\u76845\u500d\u548c10\u500d", "\u5355\u6b21\u5b9e\u73b0\u9009\u51fa\u7684\u8d62\u5bb6\u4e0e\u5176\u4ed6\u4e24\u6b21\u5b9e\u73b0\u5747\u503c\u4e0b\u7684\u8d62\u5bb6\u4e0d\u4e00\u81f4\u6bd4\u4f8b\u8fbe25.6%\u548c43.6%", "\u5373\u4f7f\u7ecf\u8fc7\u7ed3\u679c\u76f2\u7684\u5361\u7247\u7ea7\u8fc7\u6ee4\uff0c\u8d62\u5bb6\u53cd\u8f6c\u73b0\u8c61\u4ecd\u7136\u5b58\u5728\uff0c\u8bf4\u660e\u95ee\u9898\u4e0d\u662f\u7b80\u5355\u7684\u4f4e\u8d28\u91cf\u5b9e\u73b0\u5bfc\u81f4"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u5b9e\u9a8c\u8bc4\u4f30", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26587v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "One Run Is Not an Idea: The Implementation Lottery in Automated Research", "tldr": "\u5355\u6b21\u5b9e\u9a8c\u4f1a\u8bef\u5224\u81ea\u52a8\u79d1\u7814\u4e2d\u7684\u60f3\u6cd5\u4ef7\u503c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u5b9e\u73b0\u5f69\u7968\u201d\u6982\u5ff5\uff1a\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u7528\u4e00\u6b21\u8fd0\u884c\u7ed3\u679c\u8bc4\u4f30\u60f3\u6cd5\u65f6\uff0c\u5b9e\u9645\u53ea\u8bc4\u4f30\u4e86\u8be5\u60f3\u6cd5\u7684\u67d0\u4e2a\u5177\u4f53\u5b9e\u73b0\u3002\u4f5c\u8005\u8bbe\u8ba1 Idea Reliability Audit\uff0c\u901a\u8fc7\u591a\u6b21\u72ec\u7acb\u5b9e\u73b0\u3001\u76f2\u5ba1\u4fdd\u771f\u5ea6\u6807\u6ce8\u548c\u590d\u8dd1\u4ea7\u7269\u6765\u91cf\u5316\u60f3\u6cd5\u7ea7\u53ef\u9760\u6027\u3002", "why_notable": "\u8be5\u7814\u7a76\u6307\u51fa\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u4e2d\u7684\u7ed3\u6784\u6027\u8bc4\u4f30\u504f\u5dee\uff1a\u5355\u6b21\u8fd0\u884c\u5206\u6570\u4e0d\u5e94\u76f4\u63a5\u4f5c\u4e3a\u60f3\u6cd5\u7ea7\u51b3\u7b56\u4f9d\u636e\u3002\u5b83\u4e3a\u667a\u80fd\u4f53\u79d1\u7814\u3001\u81ea\u52a8\u5b9e\u9a8c\u548c\u7814\u7a76\u8bb0\u5fc6\u7cfb\u7edf\u63d0\u4f9b\u4e86\u91cd\u8981\u7684\u53ef\u9760\u6027\u8bc4\u4f30\u65b9\u6cd5\u3002"}, {"abstract": "We present, to our knowledge, the first end-to-end FP4 RL post-training, in which both the rollout and training policies, including their forward and backward passes, operate at 4-bit precision. A systematic study reveals that the dominant source of degradation in FP4 RL is not training-side quantization error but rollout activation quantization: outliers stretch the dynamic range so far that a large number of activation values underflow to zero under FP4. Counterintuitively, restoring the training policy to higher precision while keeping the rollout in FP4 makes accuracy worse than full FP4 baseline, exposing rollout-training mismatch as the principal failure mode and ruling out standard pretraining-style fixes. We address this with Rollout Residual Quantization (Rollout-ResQ): a single residual correction term constrained to a hardware-friendly sparsity pattern, added only to the FP4 rollout matmul -- a lightweight correction that recovers most of the precision lost to outlier-driven underflow without inflating the rollout\u0027s compute footprint. On Qwen2.5-3B and Qwen2.5-Math-7B, Rollout-ResQ paired with the HiFloat4 (HiF4) format -- whose three-level hierarchical scaling preserves resolution under FP4\u0027s tight 4-bit budget -- closes the accuracy gap to BF16 from 4.9% to 1.1%, bringing fully quantized FP4 RL within striking distance of full precision. Applied to the open-standard MXFP4, the same recipe narrows the gap from 13.6% to 5.3%, revealing that FP4 format choice is a key factor that determines the ceiling on recoverable accuracy. Together, these results establish HiF4 as the enabling format for end-to-end FP4 RL post-training, and Rollout-ResQ as the activation-side mechanism that makes the gap to BF16 closable.", "arxiv_id": "2607.26515", "arxiv_url": "https://arxiv.org/abs/2607.26515", "authors": ["Hei Yi Mak", "Shadan Golestan", "Hoang Le", "Mehran Taghian Jazi", "Yunke Peng", "Yaoyuan Wang", "Yao Wang", "Junsong Wang", "Tianchi Hu", "Fengchen He", "Guipeng Hu", "Tanzila Rahman", "Anandharaju Durai Raju"], "brief": "\u8bba\u6587\u63d0\u51fa\u7aef\u5230\u7aefFP4\u7cbe\u5ea6\u7684LLM\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u65b9\u6848\uff0c\u4f7frollout\u4e0e\u8bad\u7ec3\u7b56\u7565\u7684\u524d\u5411\u3001\u53cd\u5411\u90fd\u8fd0\u884c\u57284\u6bd4\u7279\u3002\u4f5c\u8005\u8bbe\u8ba1HiFloat4\u683c\u5f0f\u4e0eRollout-ResQ\u6b8b\u5dee\u6821\u6b63\uff0c\u663e\u8457\u7f29\u5c0fFP4\u4e0eBF16\u7684\u6027\u80fd\u5dee\u8ddd\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26515", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7cfb\u7edf\u5206\u6790\u53d1\u73b0FP4 RL\u9000\u5316\u4e3b\u56e0\u4e0d\u662f\u8bad\u7ec3\u7aef\u91cf\u5316\u8bef\u5dee\uff0c\u800c\u662frollout\u6fc0\u6d3b\u91cf\u5316\u4e2d\u79bb\u7fa4\u503c\u62c9\u5927\u52a8\u6001\u8303\u56f4\uff0c\u5bfc\u81f4\u5927\u91cf\u6fc0\u6d3b\u4e0b\u6ea2\u4e3a\u96f6\u3002", "\u4ec5\u628a\u8bad\u7ec3\u7b56\u7565\u6062\u590d\u9ad8\u7cbe\u5ea6\u3001rollout\u4fdd\u6301FP4\u53cd\u800c\u66f4\u5dee\uff0c\u8bf4\u660erollout\u4e0etraining mismatch\u662f\u5173\u952e\u5931\u8d25\u6a21\u5f0f\u3002", "\u5728Qwen2.5-3B\u4e0eQwen2.5-Math-7B\u4e0a\uff0cHiF4\u7ed3\u5408Rollout-ResQ\u5c06\u76f8\u5bf9BF16\u7684\u7cbe\u5ea6\u5dee\u8ddd\u4ece4.9%\u7f29\u5c0f\u52301.1%\uff1b\u5728MXFP4\u4e0a\u4e5f\u4ece13.6%\u7f29\u5c0f\u52305.3%\u3002"], "keywords": ["\u91cf\u5316", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26515v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HiFloat4 Format for End-To-End Reinforcement Learning Post-Training of Large Language Models", "tldr": "HiF4\u8ba9LLM\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u5168\u6d41\u7a0bFP4\u53ef\u884c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u7aef\u5230\u7aefFP4\u7cbe\u5ea6\u7684LLM\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u65b9\u6848\uff0c\u4f7frollout\u4e0e\u8bad\u7ec3\u7b56\u7565\u7684\u524d\u5411\u3001\u53cd\u5411\u90fd\u8fd0\u884c\u57284\u6bd4\u7279\u3002\u4f5c\u8005\u8bbe\u8ba1HiFloat4\u683c\u5f0f\u4e0eRollout-ResQ\u6b8b\u5dee\u6821\u6b63\uff0c\u663e\u8457\u7f29\u5c0fFP4\u4e0eBF16\u7684\u6027\u80fd\u5dee\u8ddd\u3002", "why_notable": "\u8fd9\u662f\u5c11\u89c1\u7684\u7aef\u5230\u7aefFP4 LLM\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7814\u7a76\uff0c\u4e0d\u4ec5\u5b9a\u4f4d\u4e86rollout\u6fc0\u6d3b\u4e0b\u6ea2\u8fd9\u4e00\u6838\u5fc3\u74f6\u9888\uff0c\u8fd8\u7ed9\u51fa\u786c\u4ef6\u53cb\u597d\u7684\u8f7b\u91cf\u4fee\u6b63\u673a\u5236\uff0c\u6709\u671b\u663e\u8457\u964d\u4f4eRL\u540e\u8bad\u7ec3\u6210\u672c\u3002"}, {"abstract": "World models must learn the joint dynamics of states, actions, events, and observations, yet existing video, robotics, and simulation datasets usually capture only part of this structure. We introduce CG-World, a large-scale world-state dataset and protocol derived from industrial computer graphics production pipelines. CG-World explicitly records intermediate states, including multimodal semantics, spatial structure, skeletal and controller states, motion curves, camera and lighting parameters, physics caches, contact events, and multi-pass renderings. CG-World v1 contains approximately 850,000 temporally aligned segments of 1-5 seconds. It separates latent states, observations, relations, events, and branch metadata, and organizes them into unified spatiotemporal samples. To support intervention learning and counterfactual reasoning, CG-World defines a branch lineage covering factual trajectories, observation interventions, action interventions, mechanism interventions, and strict counterfactual branches, with intervention targets, invariants, and alternative outcomes explicitly recorded. We evaluate the dataset on geometry-conditioned video generation, action prediction, and closed-loop vision-language-action policy transfer. Results show that CG-World provides reusable structured supervision for controlled generation, action modeling, and embodied policy transfer. We plan to expand CG-World through continued data collection and community collaboration toward a shared data infrastructure for world models, Physical AI, and embodied intelligence.", "arxiv_id": "2607.26452", "arxiv_url": "https://arxiv.org/abs/2607.26452", "authors": ["Yiming Cai", "Fangjie Yu", "Meiqing Yu", "Ziyue Shi", "Pengfei Yuan", "Yong Guo"], "brief": "\u8bba\u6587\u63d0\u51fa CG-World\uff0c\u4e00\u4e2a\u6e90\u81ea\u5de5\u4e1a\u8ba1\u7b97\u673a\u56fe\u5f62\u751f\u4ea7\u6d41\u7a0b\u7684\u5927\u89c4\u6a21\u4e16\u754c\u72b6\u6001\u6570\u636e\u96c6\u4e0e\u534f\u8bae\u3002\u5b83\u7cfb\u7edf\u8bb0\u5f55\u72b6\u6001\u3001\u52a8\u4f5c\u3001\u4e8b\u4ef6\u3001\u89c2\u6d4b\u53ca\u5e72\u9884\u5206\u652f\uff0c\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u4f30\u4e16\u754c\u6a21\u578b\u3002", "categories": ["cs.AI", "cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26452", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["CG-World v1 \u5305\u542b\u7ea685\u4e07\u4e2a1\u52305\u79d2\u7684\u65f6\u5e8f\u5bf9\u9f50\u7247\u6bb5\uff0c\u8986\u76d6\u8bed\u4e49\u3001\u7a7a\u95f4\u7ed3\u6784\u3001\u9aa8\u9abc\u4e0e\u63a7\u5236\u5668\u72b6\u6001\u3001\u8fd0\u52a8\u66f2\u7ebf\u3001\u76f8\u673a\u5149\u7167\u3001\u7269\u7406\u7f13\u5b58\u3001\u63a5\u89e6\u4e8b\u4ef6\u548c\u591a\u901a\u9053\u6e32\u67d3\u7b49\u4fe1\u606f\u3002", "\u6570\u636e\u534f\u8bae\u5c06\u6f5c\u5728\u72b6\u6001\u3001\u89c2\u6d4b\u3001\u5173\u7cfb\u3001\u4e8b\u4ef6\u548c\u5206\u652f\u5143\u6570\u636e\u7edf\u4e00\u7ec4\u7ec7\u4e3a\u65f6\u7a7a\u6837\u672c\uff0c\u63d0\u4f9b\u6bd4\u666e\u901a\u89c6\u9891\u6570\u636e\u66f4\u5b8c\u6574\u7684\u7ed3\u6784\u5316\u76d1\u7763\u3002", "\u5b9a\u4e49\u4e8b\u5b9e\u8f68\u8ff9\u3001\u89c2\u6d4b\u5e72\u9884\u3001\u52a8\u4f5c\u5e72\u9884\u3001\u673a\u5236\u5e72\u9884\u548c\u4e25\u683c\u53cd\u4e8b\u5b9e\u5206\u652f\uff0c\u652f\u6301\u5e72\u9884\u5b66\u4e60\u4e0e\u53cd\u4e8b\u5b9e\u63a8\u7406\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u6570\u636e\u96c6", "\u5177\u8eab\u667a\u80fd", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26452v1", "published_at": "2026-07-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CG-World: A Large-Scale World-State Dataset and Protocol for World Models", "tldr": "\u9762\u5411\u4e16\u754c\u6a21\u578b\u7684\u5927\u89c4\u6a21CG\u4e16\u754c\u72b6\u6001\u6570\u636e\u96c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CG-World\uff0c\u4e00\u4e2a\u6e90\u81ea\u5de5\u4e1a\u8ba1\u7b97\u673a\u56fe\u5f62\u751f\u4ea7\u6d41\u7a0b\u7684\u5927\u89c4\u6a21\u4e16\u754c\u72b6\u6001\u6570\u636e\u96c6\u4e0e\u534f\u8bae\u3002\u5b83\u7cfb\u7edf\u8bb0\u5f55\u72b6\u6001\u3001\u52a8\u4f5c\u3001\u4e8b\u4ef6\u3001\u89c2\u6d4b\u53ca\u5e72\u9884\u5206\u652f\uff0c\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u4f30\u4e16\u754c\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5de5\u4e1aCG\u6d41\u7a0b\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u7684\u4e16\u754c\u6a21\u578b\u6570\u636e\u57fa\u7840\u8bbe\u65bd\uff0c\u8865\u8db3\u73b0\u6709\u89c6\u9891\u3001\u673a\u5668\u4eba\u548c\u4eff\u771f\u6570\u636e\u5728\u4e2d\u95f4\u72b6\u6001\u4e0e\u56e0\u679c\u5206\u652f\u8bb0\u5f55\u4e0a\u7684\u7f3a\u53e3\uff0c\u5bf9\u53ef\u63a7\u751f\u6210\u3001\u52a8\u4f5c\u5efa\u6a21\u548c\u5177\u8eab\u7b56\u7565\u8fc1\u79fb\u5177\u6709\u8f83\u9ad8\u4ef7\u503c\u3002"}, {"abstract": "Coding agents have made substantial progress on software engineering tasks that modify existing codebases, including bug fixing and feature implementation. However, constructing a complete program from scratch remains a major challenge: even the frontier models evaluated on ProgramBench fully resolve fewer than 1% of tasks. One obstacle is the lack of scalable training environments for this from-scratch setting, spanning the whole software engineering life cycle, as existing environment-construction frameworks focus only on a single phase in software development. To address this gap, we introduce MindForge, an automated pipeline that converts open-source command-line programs into source-free environments that expose only a compiled reference executable and its documentation. Using MindForge, we construct training environments from repositories disjoint from those in ProgramBench, and curate a high-quality data recipe consisting of program synthesis trajectories using GLM-5.2 as the teacher agent. Fine-tuning Qwen3.6-27B on these trajectories increases its ProgramBench average test pass rate from 37.98% to 49.51%, achieving performance comparable to substantially larger frontier models. Moreover, the fine-tuned model consistently improves over the base model across all seven unseen software engineering benchmarks, spanni
