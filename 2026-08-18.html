0c\u5e76\u663e\u793a\u51fa\u8de8\u8bed\u8a00\u3001\u89c6\u89c9\u548c\u8868\u683c\u6570\u636e\u7684\u6f5c\u5728\u901a\u7528\u6027\u3002"}, {"abstract": "In collection operations, accumulating payload progressively slows the vehicle, imposing a cumulative penalty on routing efficiency. An onboard drone can offset this penalty by retrieving outlying items, thereby shortening the makespan and increasing operational profit. However, travel time remains load-dependent, and each item collected by the ground vehicle shifts the arrival times that govern the drone\u0027s launch and rendezvous points. This paper introduces the Travelling Thief Problem with Drone (TTP-D), which maximises the collected profit, net of a time-based rental cost, by jointly optimising item selection, vehicle routing, and flight synchronisation. We formulate a mixed-integer linear program that solves small instances to optimality, and develop both metaheuristics and an attention-based Deep Reinforcement Learning (DRL) policy for larger instances. We further propose a learner-initialised hybrid solver, in which the DRL policy constructs an initial solution that a short annealing run subsequently refines. On two benchmark sets, this hybrid recovers most of the metaheuristic baseline\u0027s quality at a fraction of its computational budget, although the largest instances still require the baseline at its full budget. Finally, a sensitivity analysis reveals that the rental ratio is the primary driver of profitability, whereas the fleet parameters affect profit only at the margin.", "arxiv_id": "2608.16435", "arxiv_url": "https://arxiv.org/abs/2608.16435", "authors": ["Kabir Murjani", "Abhay Sobhanan"], "brief": "\u8bba\u6587\u5f15\u5165 Travelling Thief Problem with Drone\uff08TTP-D\uff09\uff0c\u8054\u5408\u4f18\u5316\u7269\u54c1\u9009\u62e9\u3001\u5730\u9762\u8f66\u8f86\u8def\u5f84\u4e0e\u65e0\u4eba\u673a\u8d77\u964d\u4f1a\u5408\uff0c\u4ee5\u6700\u5927\u5316\u6263\u9664\u65f6\u95f4\u79df\u8d41\u6210\u672c\u540e\u7684\u6536\u76ca\u3002\u4f5c\u8005\u7ed9\u51fa\u6df7\u5408\u6574\u6570\u7ebf\u6027\u89c4\u5212\u6c42\u89e3\u5c0f\u89c4\u6a21\u5b9e\u4f8b\uff0c\u5e76\u8bbe\u8ba1\u5143\u542f\u53d1\u5f0f\u3001\u6ce8\u610f\u529b\u5f0f\u6df1\u5ea6\u5f3a\u5316\u5b66\u4e60\u7b56\u7565\u53ca\u5b66\u4e60\u521d\u59cb\u5316\u7684\u6df7\u5408\u6c42\u89e3\u5668\u5904\u7406\u5927\u89c4\u6a21\u5b9e\u4f8b\u3002", "categories": ["cs.AI", "cs.NE", "math.OC"], "github_repo": "https://github.com/corbit-lab/ttpd", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.16435", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["TTP-D \u5c06\u8f7d\u91cd\u5bfc\u81f4\u8f66\u8f86\u53d8\u6162\u3001\u65e0\u4eba\u673a\u53d6\u8d27\u3001\u53d1\u5c04\u4e0e\u4f1a\u5408\u540c\u6b65\u7b49\u56e0\u7d20\u7eb3\u5165\u540c\u4e00\u4f18\u5316\u6846\u67b6\u3002", "\u63d0\u51fa MILP \u7cbe\u786e\u6a21\u578b\u3001\u5c0f\u89c4\u6a21\u53ef\u6c42\u6700\u4f18\uff1b\u5927\u89c4\u6a21\u4f7f\u7528\u5143\u542f\u53d1\u5f0f\u548c\u6ce8\u610f\u529b\u5f0f DRL \u6784\u9020\u7b56\u7565\u3002", "DRL \u521d\u59cb\u5316\u52a0\u77ed\u7a0b\u9000\u706b\u7684\u6df7\u5408\u65b9\u6cd5\u80fd\u4ee5\u66f4\u4f4e\u8ba1\u7b97\u9884\u7b97\u63a5\u8fd1\u5143\u542f\u53d1\u5f0f\u8d28\u91cf\uff0c\u4f46\u6700\u5927\u5b9e\u4f8b\u4ecd\u9700\u5b8c\u6574\u5143\u542f\u53d1\u5f0f\u9884\u7b97\u3002"], "keywords": ["\u7ec4\u5408\u4f18\u5316", "\u5f3a\u5316\u5b66\u4e60", "\u65e0\u4eba\u673a", "\u8def\u5f84\u89c4\u5212"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16435v1", "published_at": "2026-08-17", "score": 0.198, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16435.png", "title": "Drive, Pack, Fly: The Travelling Thief Problem with Drone", "tldr": "\u63d0\u51fa\u5e26\u65e0\u4eba\u673a\u7684\u65c5\u884c\u7a83\u8d3c\u8054\u5408\u4f18\u5316\u95ee\u9898", "upvotes": 2, "what_it_is": "\u8bba\u6587\u5f15\u5165 Travelling Thief Problem with Drone\uff08TTP-D\uff09\uff0c\u8054\u5408\u4f18\u5316\u7269\u54c1\u9009\u62e9\u3001\u5730\u9762\u8f66\u8f86\u8def\u5f84\u4e0e\u65e0\u4eba\u673a\u8d77\u964d\u4f1a\u5408\uff0c\u4ee5\u6700\u5927\u5316\u6263\u9664\u65f6\u95f4\u79df\u8d41\u6210\u672c\u540e\u7684\u6536\u76ca\u3002\u4f5c\u8005\u7ed9\u51fa\u6df7\u5408\u6574\u6570\u7ebf\u6027\u89c4\u5212\u6c42\u89e3\u5c0f\u89c4\u6a21\u5b9e\u4f8b\uff0c\u5e76\u8bbe\u8ba1\u5143\u542f\u53d1\u5f0f\u3001\u6ce8\u610f\u529b\u5f0f\u6df1\u5ea6\u5f3a\u5316\u5b66\u4e60\u7b56\u7565\u53ca\u5b66\u4e60\u521d\u59cb\u5316\u7684\u6df7\u5408\u6c42\u89e3\u5668\u5904\u7406\u5927\u89c4\u6a21\u5b9e\u4f8b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7ecf\u5178\u65c5\u884c\u7a83\u8d3c\u95ee\u9898\u6269\u5c55\u5230\u65e0\u4eba\u673a\u534f\u540c\u53d6\u8d27\u573a\u666f\uff0c\u66f4\u8d34\u8fd1\u7269\u6d41\u3001\u91c7\u96c6\u4e0e\u914d\u9001\u4efb\u52a1\u4e2d\u7684\u8f7d\u91cd-\u65f6\u95f4-\u6536\u76ca\u6743\u8861\uff1b\u540c\u65f6\u5c55\u793a\u4e86\u5b66\u4e60\u578b\u6c42\u89e3\u5668\u4e0e\u4f20\u7edf\u5143\u542f\u53d1\u5f0f\u7ed3\u5408\u5728\u7ec4\u5408\u4f18\u5316\u4e2d\u7684\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Byte-level hierarchical language models (LMs) have recently emerged as a robust alternative to their popular counterparts that use subword tokenization. However, generating one byte at a time remains a bottleneck for inference speed. To address this, we introduce multi-byte prediction (MBP), which generates multiple bytes in parallel, speeding up inference with minimal performance impact and no additional parameters. MBP builds on the popular multi-token prediction (MTP) paradigm with two crucial innovations. First, we introduce a variable-length prediction window that aligns with the latent tokens, or segments, of a hierarchical LM. Second, we implement a novel attention-masking scheme that enables parallel byte prediction without violating causality. We show that multi-byte prediction strikes a Pareto-optimal trade-off across multiple generative tasks, instruction following, question answering, summarization, and machine translation, achieving the best trade-off between performance and inference throughput.", "arxiv_id": "2608.15454", "arxiv_url": "https://arxiv.org/abs/2608.15454", "authors": ["Abraham Toluwase Owodunni", "Chibuzor Okocha", "Christan Grant", "Tomasz Limisiewicz", "Sachin Kumar"], "brief": "\u8bba\u6587\u63d0\u51fa\u591a\u5b57\u8282\u9884\u6d4b\uff08MBP\uff09\uff0c\u7528\u4e8e\u5b57\u8282\u7ea7\u5c42\u6b21\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u65f6\u4e00\u6b21\u5e76\u884c\u751f\u6210\u591a\u4e2a\u5b57\u8282\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u65b0\u589e\u53c2\u6570\uff0c\u901a\u8fc7\u5bf9\u9f50\u5c42\u6b21\u6a21\u578b\u7684\u6f5c\u5728\u5206\u6bb5\u5e76\u8bbe\u8ba1\u56e0\u679c\u6ce8\u610f\u529b\u63a9\u7801\uff0c\u5728\u5c3d\u91cf\u4fdd\u6301\u6027\u80fd\u7684\u540c\u65f6\u63d0\u5347\u541e\u5410\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/skai-research/lca-multibyte", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.15454", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u53ef\u53d8\u957f\u5ea6\u9884\u6d4b\u7a97\u53e3\uff0c\u4f7f\u591a\u5b57\u8282\u751f\u6210\u4e0e\u5c42\u6b21\u8bed\u8a00\u6a21\u578b\u7684 latent tokens/segments \u5bf9\u9f50", "\u8bbe\u8ba1\u65b0\u7684 attention-masking \u673a\u5236\uff0c\u652f\u6301\u5e76\u884c\u5b57\u8282\u9884\u6d4b\u4e14\u4e0d\u7834\u574f\u56e0\u679c\u6027", "\u5728\u6307\u4ee4\u8ddf\u968f\u3001\u95ee\u7b54\u3001\u6458\u8981\u3001\u673a\u5668\u7ffb\u8bd1\u7b49\u751f\u6210\u4efb\u52a1\u4e0a\u53d6\u5f97\u6027\u80fd\u4e0e\u63a8\u7406\u541e\u5410\u7684\u5e15\u7d2f\u6258\u6700\u4f18\u6743\u8861"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u5b57\u8282\u7ea7\u5efa\u6a21", "\u63a8\u7406\u52a0\u901f", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 1, "on_hf": true, "organization": "The Ohio State University", "pdf_url": "https://arxiv.org/pdf/2608.15454v1", "published_at": "2026-08-16", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15454.png", "title": "Dynamic Multi-Byte Prediction With Hierarchical Language Models", "tldr": "\u5e76\u884c\u9884\u6d4b\u591a\u5b57\u8282\uff0c\u52a0\u901f\u5b57\u8282\u7ea7\u8bed\u8a00\u6a21\u578b", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u591a\u5b57\u8282\u9884\u6d4b\uff08MBP\uff09\uff0c\u7528\u4e8e\u5b57\u8282\u7ea7\u5c42\u6b21\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u65f6\u4e00\u6b21\u5e76\u884c\u751f\u6210\u591a\u4e2a\u5b57\u8282\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u65b0\u589e\u53c2\u6570\uff0c\u901a\u8fc7\u5bf9\u9f50\u5c42\u6b21\u6a21\u578b\u7684\u6f5c\u5728\u5206\u6bb5\u5e76\u8bbe\u8ba1\u56e0\u679c\u6ce8\u610f\u529b\u63a9\u7801\uff0c\u5728\u5c3d\u91cf\u4fdd\u6301\u6027\u80fd\u7684\u540c\u65f6\u63d0\u5347\u541e\u5410\u3002", "why_notable": "\u5b57\u8282\u7ea7\u8bed\u8a00\u6a21\u578b\u907f\u514d\u4e86\u5b50\u8bcd\u5206\u8bcd\u7684\u9650\u5236\uff0c\u4f46\u9010\u5b57\u8282\u751f\u6210\u901f\u5ea6\u6162\uff1bMBP\u4ee5\u65e0\u989d\u5916\u53c2\u6570\u7684\u65b9\u5f0f\u7f13\u89e3\u63a8\u7406\u74f6\u9888\uff0c\u5bf9\u6784\u5efa\u66f4\u901a\u7528\u3001\u66f4\u9ad8\u6548\u7684\u65e0\u5206\u8bcd\u8bed\u8a00\u6a21\u578b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Automated checking pipelines increasingly place one language model as the checker and another (or the same one) as the fixer. We ask whether that wiring changes what the checker reports. Measuring false alarms on human-verified-correct ProcessBench traces with the present task held byte-identical, we find that a completed audit -\u003e repair episode already in the model\u0027s context lowers false alarms in 15 of 15 model x wording combinations, by 2.8 to 11.5 percentage points against a length-matched non-audit control, a 9 to 25% reduction relative to that control. The direction contradicts what the accumulated-message literature predicts: an episode whose audit reported an error lowers false alarms further still, at all five wordings on the model where that manipulation lands cleanly, though a negativity asymmetry predicts more flagging. Decomposing the episode finds repair content and audit verdict complementary: different components carry the effect on different model families. Signal-detection analysis locates the change in the threshold rather than in discrimination -- the criterion moves in 15 of 15 combinations and survives correction in 13 while d\u0027 survives in none, though the d\u0027 test is half as sensitive by construction -- and a hand audit of 50 false alarms finds 82% simply wrong, so at this operating point the shift need not be harmful. With reasoning enabled the effect keeps its relative size on both models tested, and the threshold reading holds there too.", "arxiv_id": "2608.16003", "arxiv_url": "https://arxiv.org/abs/2608.16003", "authors": ["Parsa Mazaheri", "Kasra Mazaheri"], "brief": "\u672c\u6587\u7814\u7a76\u5728\u201c\u4e00\u4e2aLLM\u68c0\u67e5\u3001\u53e6\u4e00\u4e2a\u6216\u540c\u4e00LLM\u4fee\u590d\u201d\u7684\u81ea\u52a8\u5316\u6d41\u6c34\u7ebf\u4e2d\uff0c\u5148\u524d\u7684\u5ba1\u8ba1-\u4fee\u590d\u7ecf\u5386\u662f\u5426\u4f1a\u6539\u53d8\u540e\u7eed\u68c0\u67e5\u7ed3\u679c\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5373\u4f7f\u5f53\u524d\u4efb\u52a1\u5b8c\u5168\u76f8\u540c\uff0c\u6a21\u578b\u4e0a\u4e0b\u6587\u4e2d\u5df2\u6709\u4e00\u6b21\u5ba1\u8ba1-\u4fee\u590d episode \u4e5f\u4f1a\u663e\u8457\u964d\u4f4e\u8bef\u62a5\u7387\uff0c\u5e76\u4e3b\u8981\u4f53\u73b0\u4e3a\u5224\u5b9a\u9608\u503c\u53d8\u5bbd\u677e\u800c\u975e\u8fa8\u522b\u80fd\u529b\u63d0\u5347\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/parsa-mz/crtitxer", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16003", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728\u4eba\u5de5\u786e\u8ba4\u6b63\u786e\u7684 ProcessBench \u63a8\u7406\u8f68\u8ff9\u4e0a\uff0c15/15 \u4e2a\u6a21\u578b\u4e0e\u63aa\u8f9e\u7ec4\u5408\u5747\u51fa\u73b0\u8bef\u62a5\u4e0b\u964d\uff0c\u76f8\u6bd4\u7b49\u957f\u975e\u5ba1\u8ba1\u5bf9\u7167\u964d\u4f4e 2.8 \u5230 11.5 \u4e2a\u767e\u5206\u70b9\u3002", "\u82e5\u4e0a\u4e0b\u6587\u4e2d\u7684\u5148\u524d\u5ba1\u8ba1\u66fe\u62a5\u544a\u9519\u8bef\uff0c\u8bef\u62a5\u8fd8\u4f1a\u8fdb\u4e00\u6b65\u4e0b\u964d\uff0c\u8fd9\u4e0e\u65e2\u6709\u201c\u8d1f\u9762\u4fe1\u606f\u4f1a\u589e\u52a0\u6807\u8bb0\u503e\u5411\u201d\u7684\u7d2f\u79ef\u6d88\u606f\u6587\u732e\u9884\u671f\u76f8\u53cd\u3002", "\u4fe1\u53f7\u68c0\u6d4b\u5206\u6790\u663e\u793a\u53d8\u5316\u4e3b\u8981\u6765\u81ea\u5224\u5b9a\u6807\u51c6 criterion \u79fb\u52a8\uff1a15/15 \u7ec4\u5408\u9608\u503c\u6539\u53d8\uff0c13 \u4e2a\u7ecf\u6821\u6b63\u540e\u4ecd\u663e\u8457\uff0c\u800c d\u0027 \u8fa8\u522b\u529b\u53d8\u5316\u5747\u4e0d\u663e\u8457\u3002"], "keywords": ["\u6a21\u578b\u8bc4\u4f30", "LLM\u9a8c\u8bc1\u5668", "\u4e0a\u4e0b\u6587\u504f\u79fb", "\u4fe1\u53f7\u68c0\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16003v1", "published_at": "2026-08-17", "score": 0.193, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16003.png", "title": "Prior Audit-Repair Context Shifts LLM Verifier Thresholds Toward Leniency", "tldr": "\u5ba1\u8ba1-\u4fee\u590d\u4e0a\u4e0b\u6587\u4f1a\u8ba9LLM\u9a8c\u8bc1\u5668\u66f4\u5bbd\u677e", "upvotes": 3, "what_it_is": "\u672c\u6587\u7814\u7a76\u5728\u201c\u4e00\u4e2aLLM\u68c0\u67e5\u3001\u53e6\u4e00\u4e2a\u6216\u540c\u4e00LLM\u4fee\u590d\u201d\u7684\u81ea\u52a8\u5316\u6d41\u6c34\u7ebf\u4e2d\uff0c\u5148\u524d\u7684\u5ba1\u8ba1-\u4fee\u590d\u7ecf\u5386\u662f\u5426\u4f1a\u6539\u53d8\u540e\u7eed\u68c0\u67e5\u7ed3\u679c\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5373\u4f7f\u5f53\u524d\u4efb\u52a1\u5b8c\u5168\u76f8\u540c\uff0c\u6a21\u578b\u4e0a\u4e0b\u6587\u4e2d\u5df2\u6709\u4e00\u6b21\u5ba1\u8ba1-\u4fee\u590d episode \u4e5f\u4f1a\u663e\u8457\u964d\u4f4e\u8bef\u62a5\u7387\uff0c\u5e76\u4e3b\u8981\u4f53\u73b0\u4e3a\u5224\u5b9a\u9608\u503c\u53d8\u5bbd\u677e\u800c\u975e\u8fa8\u522b\u80fd\u529b\u63d0\u5347\u3002", "why_notable": "\u8fd9\u63ed\u793a\u4e86LLM\u9a8c\u8bc1\u5668\u5e76\u975e\u53ea\u53d7\u5f53\u524d\u5f85\u68c0\u5185\u5bb9\u5f71\u54cd\uff0c\u6d41\u6c34\u7ebf\u4e2d\u7684\u5148\u524d\u5ba1\u8ba1\u4e0e\u4fee\u590d\u4e0a\u4e0b\u6587\u4f1a\u7cfb\u7edf\u6027\u6539\u53d8\u5176\u5224\u5b9a\u9608\u503c\u3002\u8be5\u53d1\u73b0\u5bf9\u81ea\u52a8\u9a8c\u8bc1\u3001\u6a21\u578b\u81ea\u6211\u4fee\u590d\u548c\u8bc4\u6d4b\u7ba1\u7ebf\u7684\u53ef\u9760\u6027\u5177\u6709\u76f4\u63a5\u5f71\u54cd\uff0c\u4e5f\u63d0\u793a\u9700\u8981\u66f4\u8c28\u614e\u5730\u8bbe\u8ba1\u4e0a\u4e0b\u6587\u9694\u79bb\u4e0e\u9a8c\u8bc1\u534f\u8bae\u3002"}, {"abstract": "Audio-Text Foundation Models (ATMs) fail catastrophically under severe acoustic noise, yet existing adaptation strategies either rely on gradient-based Test-Time Adaptation (TTA), which reinforces noise rather than signal, or on prompt tuning that requires privileged noise annotations unavailable at inference. We address these failures with PRISM (Prototype-Rectified Iterative Self-supervised Manifold Denoising), a training-free, source-free TTA framework grounded in the Affine Noise Hypothesis: severe acoustic noise induces a low-rank affine shift in the multimodal latent space, with more than 90% of distortion energy confined to the leading 60 principal components. PRISM estimates and reverses this distortion from an unlabeled target batch using frozen text prototypes as geometric anchors via three closed-form geometric corrections compiled into a single static projection matrix by Affine Bias Regression. At inference, adaptation reduces to one matrix-vector multiplication in 0.0009 ms, making it substantially faster than gradient-based TTA while requiring no additional training. On UrbanSound8K, PRISM improves over the zero-shot baseline by 12.94 percentage points and surpasses an oracle-assisted TTA baseline by 9.41 percentage points, despite never observing its privileged augmented noise prompts. We further identify the Polyphonic Trap, a principled failure mode of subspace deflation for broadband classes, and resolve it via Confidence-Aware Regression (CAR), recovering up to 8.16 percentage points for the worst-affected class.", "arxiv_id": "2608.15037", "arxiv_url": "https://arxiv.org/abs/2608.15037", "authors": ["Ashish Anand Shukla", "Rini Smita Thakur", "Aryan Das", "Vinod K. Kurmi"], "brief": "\u8bba\u6587\u63d0\u51fa PRISM\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u3001\u65e0\u9700\u6e90\u6570\u636e\u7684\u6d4b\u8bd5\u65f6\u9002\u5e94\u6846\u67b6\uff0c\u7528\u4e8e\u7f13\u89e3\u97f3\u9891-\u6587\u672c\u57fa\u7840\u6a21\u578b\u5728\u4e25\u91cd\u58f0\u5b66\u566a\u58f0\u4e0b\u7684\u6027\u80fd\u5d29\u6e83\u3002\u5b83\u57fa\u4e8e\u201c\u4eff\u5c04\u566a\u58f0\u5047\u8bbe\u201d\uff0c\u5229\u7528\u51bb\u7ed3\u6587\u672c\u539f\u578b\u4f5c\u4e3a\u51e0\u4f55\u951a\u70b9\uff0c\u4ece\u65e0\u6807\u7b7e\u76ee\u6807\u6279\u6b21\u4e2d\u4f30\u8ba1\u5e76\u53cd\u8f6c\u591a\u6a21\u6001\u6f5c\u7a7a\u95f4\u7684\u4f4e\u79e9\u4eff\u5c04\u504f\u79fb\u3002", "categories": ["cs.SD", "cs.LG"], "github_repo": "https://github.com/Ashish-1108/PRISM", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.15037", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u4e25\u91cd\u58f0\u5b66\u566a\u58f0\u4e3b\u8981\u8868\u73b0\u4e3a\u591a\u6a21\u6001\u6f5c\u7a7a\u95f4\u4e2d\u7684\u4f4e\u79e9\u4eff\u5c04\u504f\u79fb\uff0c\u8d85\u8fc790%\u7684\u5931\u771f\u80fd\u91cf\u96c6\u4e2d\u5728\u524d60\u4e2a\u4e3b\u6210\u5206\u4e2d", "\u901a\u8fc7 Affine Bias Regression \u5c06\u4e09\u79cd\u95ed\u5f0f\u51e0\u4f55\u6821\u6b63\u7f16\u8bd1\u4e3a\u5355\u4e2a\u9759\u6001\u6295\u5f71\u77e9\u9635\uff0c\u63a8\u7406\u65f6\u4ec5\u9700\u4e00\u6b21\u77e9\u9635-\u5411\u91cf\u4e58\u6cd5\uff0c\u8017\u65f6\u7ea60.0009 ms", "\u5728 UrbanSound8K \u4e0a\u8f83\u96f6\u6837\u672c\u57fa\u7ebf\u63d0\u534712.94\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u8d85\u8fc7\u4f7f\u7528\u7279\u6743\u566a\u58f0\u63d0\u793a\u7684 oracle TTA \u57fa\u7ebf9.41\u4e2a\u767e\u5206\u70b9\uff1b\u8fd8\u63d0\u51fa CAR \u7f13\u89e3 Polyphonic Trap\uff0c\u6700\u5dee\u7c7b\u522b\u6700\u591a\u6062\u590d8.16\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u97f3\u9891\u7406\u89e3", "\u6d4b\u8bd5\u65f6\u9002\u5e94", "\u591a\u6a21\u6001", "\u9c81\u68d2\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15037v1", "published_at": "2026-08-15", "score": 0.188, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15037.png", "title": "Prototype-Rectified Iterative Self-supervised Manifold Denoising under Severe Acoustic Shift", "tldr": "\u7528\u6587\u672c\u539f\u578b\u5feb\u901f\u6821\u6b63\u566a\u58f0\u97f3\u9891\u8868\u5f81\u504f\u79fb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PRISM\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u3001\u65e0\u9700\u6e90\u6570\u636e\u7684\u6d4b\u8bd5\u65f6\u9002\u5e94\u6846\u67b6\uff0c\u7528\u4e8e\u7f13\u89e3\u97f3\u9891-\u6587\u672c\u57fa\u7840\u6a21\u578b\u5728\u4e25\u91cd\u58f0\u5b66\u566a\u58f0\u4e0b\u7684\u6027\u80fd\u5d29\u6e83\u3002\u5b83\u57fa\u4e8e\u201c\u4eff\u5c04\u566a\u58f0\u5047\u8bbe\u201d\uff0c\u5229\u7528\u51bb\u7ed3\u6587\u672c\u539f\u578b\u4f5c\u4e3a\u51e0\u4f55\u951a\u70b9\uff0c\u4ece\u65e0\u6807\u7b7e\u76ee\u6807\u6279\u6b21\u4e2d\u4f30\u8ba1\u5e76\u53cd\u8f6c\u591a\u6a21\u6001\u6f5c\u7a7a\u95f4\u7684\u4f4e\u79e9\u4eff\u5c04\u504f\u79fb\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u907f\u514d\u4e86\u68af\u5ea6\u5f0f\u6d4b\u8bd5\u65f6\u9002\u5e94\u6613\u5f3a\u5316\u566a\u58f0\u3001\u63d0\u793a\u8c03\u4f18\u4f9d\u8d56\u566a\u58f0\u6807\u6ce8\u7684\u95ee\u9898\uff0c\u4ee5\u6781\u4f4e\u63a8\u7406\u5f00\u9500\u5b9e\u73b0\u5f3a\u566a\u58f0\u4e0b\u7684\u97f3\u9891-\u6587\u672c\u6a21\u578b\u9c81\u68d2\u9002\u5e94\uff0c\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Despite their widespread use, Large Language Models (LLMs) remain limited by a fundamental problem: the generation of plausible but false content, known as hallucinations. Most existing detection methods operate at the answer or sentence level, yet per-token detection is essential for localizing hallucinated spans and enabling fine-grained interventions. In this paper, we explore the use of the Mixture-of-Experts (MoE) paradigm to address this gap. In MoE architectures, a single forward pass activates a sparse subset of experts (i.e., distinct feedforward networks per layer) via a routing mechanism, producing internal signals (e.g., router entropy, expert disagreement, and expert usage patterns) that are unavailable in dense architectures and have not been previously exploited for hallucination detection. To this end, we introduce InnerExpert, the first method to leverage these MoE-specific signals for per-token hallucination detection. InnerExpert combines routing-level and standard transformer signals into compact per-token feature vectors, classified by a lightweight detector trained on labels produced by an LLM-as-a-judge pipeline, which enables continuous model updates without manual annotation. Our results show that InnerExpert outperforms existing methods across five datasets and two MoE architectures, achieving up to 0.91 answer-level and 0.76 token-level AUROC, while requiring only a single forward pass.", "arxiv_id": "2608.17687", "arxiv_url": "https://arxiv.org/abs/2608.17687", "authors": ["Joao Fonseca", "Rodrigo Rodrigues", "Paolo Romano"], "brief": "\u8bba\u6587\u63d0\u51fa InnerExpert\uff0c\u9996\u6b21\u5229\u7528 MoE \u6a21\u578b\u4e2d\u7684\u8def\u7531\u71b5\u3001\u4e13\u5bb6\u5206\u6b67\u548c\u4e13\u5bb6\u4f7f\u7528\u6a21\u5f0f\u7b49\u5185\u90e8\u4fe1\u53f7\uff0c\u8fdb\u884c\u9010 token \u5e7b\u89c9\u68c0\u6d4b\u3002\u8be5\u65b9\u6cd5\u5c06 MoE \u7279\u6709\u4fe1\u53f7\u4e0e\u6807\u51c6 Transformer \u7279\u5f81\u7ec4\u5408\u6210\u8f7b\u91cf\u7279\u5f81\u5411\u91cf\uff0c\u5e76\u7528 LLM-as-a-judge \u751f\u6210\u6807\u7b7e\u8bad\u7ec3\u68c0\u6d4b\u5668\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17687", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9762\u5411\u9010 token \u5e7b\u89c9\u5b9a\u4f4d\uff0c\u800c\u4e0d\u53ea\u662f\u5728\u7b54\u6848\u6216\u53e5\u5b50\u7ea7\u5224\u65ad\u5e7b\u89c9\u3002", "\u5229\u7528 MoE \u67b6\u6784\u72ec\u6709\u7684\u8def\u7531\u5c42\u4fe1\u53f7\uff0c\u5305\u62ec router entropy\u3001expert disagreement \u548c expert usage patterns\u3002", "\u5728\u4e94\u4e2a\u6570\u636e\u96c6\u548c\u4e24\u79cd MoE \u67b6\u6784\u4e0a\u4f18\u4e8e\u65e2\u6709\u65b9\u6cd5\uff0c\u6700\u9ad8\u8fbe\u5230 0.91 \u7b54\u6848\u7ea7 AUROC \u548c 0.76 token \u7ea7 AUROC\uff0c\u4e14\u4ec5\u9700\u4e00\u6b21\u524d\u5411\u4f20\u64ad\u3002"], "keywords": ["\u5e7b\u89c9\u68c0\u6d4b", "\u6df7\u5408\u4e13\u5bb6", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17687v1", "published_at": "2026-08-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Mixture-of-Expert Blocks Contain Strong Hallucination Detection Signals", "tldr": "MoE\u5185\u90e8\u8def\u7531\u4fe1\u53f7\u53ef\u5f3a\u529b\u68c0\u6d4b\u5e7b\u89c9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa InnerExpert\uff0c\u9996\u6b21\u5229\u7528 MoE \u6a21\u578b\u4e2d\u7684\u8def\u7531\u71b5\u3001\u4e13\u5bb6\u5206\u6b67\u548c\u4e13\u5bb6\u4f7f\u7528\u6a21\u5f0f\u7b49\u5185\u90e8\u4fe1\u53f7\uff0c\u8fdb\u884c\u9010 token \u5e7b\u89c9\u68c0\u6d4b\u3002\u8be5\u65b9\u6cd5\u5c06 MoE \u7279\u6709\u4fe1\u53f7\u4e0e\u6807\u51c6 Transformer \u7279\u5f81\u7ec4\u5408\u6210\u8f7b\u91cf\u7279\u5f81\u5411\u91cf\uff0c\u5e76\u7528 LLM-as-a-judge \u751f\u6210\u6807\u7b7e\u8bad\u7ec3\u68c0\u6d4b\u5668\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a MoE \u6a21\u578b\u5185\u90e8\u4e13\u5bb6\u8def\u7531\u673a\u5236\u4e2d\u8574\u542b\u53ef\u7528\u4e8e\u5e7b\u89c9\u68c0\u6d4b\u7684\u5f3a\u4fe1\u53f7\uff0c\u4e3a\u7ec6\u7c92\u5ea6\u5e7b\u89c9\u5b9a\u4f4d\u548c\u4f4e\u6210\u672c\u5e72\u9884\u63d0\u4f9b\u4e86\u65b0\u65b9\u5411\uff0c\u5c24\u5176\u9002\u5408\u90e8\u7f72\u5728 MoE LLM \u7684\u5728\u7ebf\u68c0\u6d4b\u573a\u666f\u3002"}, {"abstract": "What a reasoning model writes is only a partial record of the process that produces it. We introduce a two-level internal readout for mixture-of-experts reasoning. We first distill vocabulary-scale J-space into J64, a 64-axis semantic frame learned from the model\u0027s own reasoning states. J64 reveals readable process state that the emitted trace does not show: it separates inference effort from problem-induced strain. It also adds 0.096 to 0.135 held-out AUC over a baseline that reads the same rollout as token occupancy and aggregates it in exactly the same way. We then reconstruct J64 from native expert-routing statistics. The result is R64, a low-overhead proxy: its median per-axis correlation with J64 is 0.69 to 0.86 across three models and two families, and on gpt-oss-20b it preserves 95 to 100% of J64\u0027s predictive gain. The readout supports test-time decisions at two temporal resolutions. Over completed candidate sets, J64 and R64 improve single-branch selection, and R64-weighted voting improves plain majority voting in seven of eight settings. During generation, rolling readout windows drive a cumulative stop-and-resample policy whose operating point is fixed on training questions alone. J64 improves accuracy by 1.1 to 5.9 points over a sibling-permuted control, and the routing-only R64 proxy retains 0.9 to 3.2 of those points. Finally, router edits aimed at the mechanism J64 names induce the predicted reasoning behaviors and shift a diagnosed stall from numerical guessing toward exact symbolic execution. Together, J64 makes latent process state readable, while routing makes it deployable and actionable.", "arxiv_id": "2608.17638", "arxiv_url": "https://arxiv.org/abs/2608.17638", "authors": ["Kang Chen", "Sihan Zhao", "Yixin Cao", "Yugang Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e24\u7ea7\u5185\u90e8\u8bfb\u51fa\u65b9\u6cd5\uff1a\u5148\u4ece\u63a8\u7406\u6a21\u578b\u9690\u72b6\u6001\u4e2d\u84b8\u998f\u51fa64\u7ef4\u8bed\u4e49\u6846\u67b6J64\uff0c\u7528\u4e8e\u63ed\u793a\u751f\u6210\u6587\u672c\u672a\u663e\u5f0f\u5448\u73b0\u7684\u63a8\u7406\u8fc7\u7a0b\u72b6\u6001\uff1b\u518d\u7528\u539f\u751fMoE\u4e13\u5bb6\u8def\u7531\u7edf\u8ba1\u91cd\u6784\u51fa\u4f4e\u5f00\u9500\u4ee3\u7406R64\uff0c\u4f7f\u8be5\u8bfb\u51fa\u53ef\u90e8\u7f72\u5230\u63a8\u7406\u65f6\u51b3\u7b56\u4e2d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17638", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["J64\u80fd\u533a\u5206\u201c\u63a8\u7406\u52aa\u529b\u201d\u548c\u201c\u9898\u76ee\u5bfc\u81f4\u7684\u56f0\u96be/\u538b\u529b\u201d\uff0c\u76f8\u6bd4\u4ec5\u57fa\u4e8etoken\u5360\u7528\u7684\u540c\u805a\u5408\u57fa\u7ebf\uff0c\u5728\u7559\u51fa\u96c6AUC\u4e0a\u63d0\u53470.096\u52300.135\u3002", "R64\u4ec5\u4f9d\u8d56MoE\u4e13\u5bb6\u8def\u7531\u7edf\u8ba1\u5373\u53ef\u8fd1\u4f3cJ64\uff0c\u8de83\u4e2a\u6a21\u578b\u30012\u4e2a\u6a21\u578b\u5bb6\u65cf\u7684\u5404\u8f74\u4e2d\u4f4d\u76f8\u5173\u4e3a0.69\u52300.86\uff1b\u5728gpt-oss-20b\u4e0a\u4fdd\u7559J64\u9884\u6d4b\u589e\u76ca\u768495%\u5230100%\u3002", "\u5728\u6d4b\u8bd5\u65f6\uff0cJ64/R64\u53ef\u7528\u4e8e\u5019\u9009\u7b54\u6848\u9009\u62e9\u3001\u52a0\u6743\u6295\u7968\u548c\u751f\u6210\u4e2d\u9014\u7684\u505c\u6b62-\u91cd\u91c7\u6837\u7b56\u7565\uff1bJ64\u5e26\u67651.1\u52305.9\u70b9\u51c6\u786e\u7387\u63d0\u5347\uff0cR64\u4fdd\u75590.9\u52303.2\u70b9\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u63a8\u7406\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17638v1", "published_at": "2026-08-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond the Trace: Coupling an Interpretable Reasoning-State Readout to Native MoE Routing", "tldr": "\u7528MoE\u8def\u7531\u8bfb\u51fa\u53ef\u89e3\u91ca\u63a8\u7406\u72b6\u6001\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e24\u7ea7\u5185\u90e8\u8bfb\u51fa\u65b9\u6cd5\uff1a\u5148\u4ece\u63a8\u7406\u6a21\u578b\u9690\u72b6\u6001\u4e2d\u84b8\u998f\u51fa64\u7ef4\u8bed\u4e49\u6846\u67b6J64\uff0c\u7528\u4e8e\u63ed\u793a\u751f\u6210\u6587\u672c\u672a\u663e\u5f0f\u5448\u73b0\u7684\u63a8\u7406\u8fc7\u7a0b\u72b6\u6001\uff1b\u518d\u7528\u539f\u751fMoE\u4e13\u5bb6\u8def\u7531\u7edf\u8ba1\u91cd\u6784\u51fa\u4f4e\u5f00\u9500\u4ee3\u7406R64\uff0c\u4f7f\u8be5\u8bfb\u51fa\u53ef\u90e8\u7f72\u5230\u63a8\u7406\u65f6\u51b3\u7b56\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u96be\u4ee5\u89c2\u6d4b\u7684\u63a8\u7406\u5185\u90e8\u72b6\u6001\u8f6c\u5316\u4e3a\u53ef\u89e3\u91ca\u3001\u53ef\u9884\u6d4b\u3001\u53ef\u5e72\u9884\u7684\u4fe1\u53f7\uff0c\u5e76\u8fdb\u4e00\u6b65\u8bc1\u660eMoE\u8def\u7531\u672c\u8eab\u53ef\u4f5c\u4e3a\u4f4e\u6210\u672c\u8bfb\u51fa\u901a\u9053\uff0c\u4e3a\u63a8\u7406\u6a21\u578b\u7684\u5728\u7ebf\u63a7\u5236\u3001\u9519\u8bef\u8bca\u65ad\u548c\u673a\u5236\u5e72\u9884\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Financial time series exhibit non-stationary and heterogeneous statistical properties, making change-point detection challenging because no single unsupervised algorithm performs consistently across assets and market regimes. Conventional workflows consequently depend heavily on expert-driven model selection, feature design, and hyperparameter tuning, limiting their scalability and adaptability. We propose EvoTS-Agent, a validation-guided self-evolving LLM agent for autonomous financial time-series change-point detection. EvoTS-Agent first performs curated exploratory data analysis to characterize dataset properties and initialize candidate detection models. It then evolves executable experiment trajectories through three complementary operators: \\textit{Revision} exploits the current best solution, \\textit{Alternative Strategy} explores fundamentally different modeling directions when progress stagnates, and \\textit{Recombination} synthesizes complementary evidence from high-performing trajectories. Validation feedback guides trajectory evolution throughout the search, enabling the agent to adapt its detection pipeline to the statistical characteristics of each dataset while preserving reliable optimization. Experiments across four benchmark datasets demonstrate that EvoTS-Agent consistently outperforms existing LLM-based agents while maintaining a 100\\% execution success rate across all evaluated backbone LLMs.", "arxiv_id": "2608.17933", "arxiv_url": "https://arxiv.org/abs/2608.17933", "authors": ["Lei Jiang", "Ye Wei", "Xinyu Xi", "Jordan Langham-Lopez", "Yifan Bao", "Raad Khraishi", "Yihao Ang", "Anthony K. H. Tung", "Lukasz Szpruch", "Hao Ni"], "brief": "EvoTS-Agent \u662f\u4e00\u4e2a\u9762\u5411\u91d1\u878d\u65f6\u95f4\u5e8f\u5217\u53d8\u70b9\u68c0\u6d4b\u7684\u81ea\u8fdb\u5316\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\uff0c\u53ef\u901a\u8fc7\u63a2\u7d22\u6027\u6570\u636e\u5206\u6790\u521d\u59cb\u5316\u5019\u9009\u6a21\u578b\uff0c\u5e76\u5229\u7528\u4fee\u8ba2\u3001\u66ff\u4ee3\u7b56\u7565\u548c\u91cd\u7ec4\u4e09\u7c7b\u64cd\u4f5c\u81ea\u52a8\u6f14\u5316\u5b9e\u9a8c\u6d41\u7a0b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u56db\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u73b0\u6709 LLM \u667a\u80fd\u4f53\uff0c\u5e76\u5728\u4e0d\u540c\u9aa8\u5e72\u6a21\u578b\u4e0b\u4fdd\u6301 100% \u6267\u884c\u6210\u529f\u7387\u3002", "categories": ["cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17933", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u65f6\u95f4\u5e8f\u5217", "\u91d1\u878d\u9884\u6d4b", "\u53d8\u70b9\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17933v1", "published_at": "2026-08-18", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "EvoTS-Agent: A Self-Evolving LLM Agent for Financial Time Series Change Point Detection", "tldr": "EvoTS-Agent \u662f\u4e00\u4e2a\u9762\u5411\u91d1\u878d\u65f6\u95f4\u5e8f\u5217\u53d8\u70b9\u68c0\u6d4b\u7684\u81ea\u8fdb\u5316\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\uff0c\u53ef\u901a\u8fc7\u63a2\u7d22\u6027\u6570\u636e\u5206\u6790\u521d\u59cb\u5316\u5019\u9009\u6a21\u578b\uff0c\u5e76\u5229\u7528\u4fee\u8ba2\u3001\u66ff\u4ee3\u7b56\u7565\u548c\u91cd\u7ec4\u4e09\u7c7b\u64cd\u4f5c\u81ea\u52a8\u6f14\u5316\u5b9e\u9a8c\u6d41\u7a0b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u56db\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u73b0\u6709 LLM \u667a\u80fd\u4f53\uff0c\u5e76\u5728\u4e0d\u540c\u9aa8\u5e72\u6a21\u578b\u4e0b\u4fdd\u6301 100% \u6267\u884c\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are pushing data science toward increasingly autonomous and agentic workflows, with recent systems already supporting multi-step and long-running analyses. As these workflows become more autonomous, conventional interfaces no longer provide adequate support for two critical requirements: observability for understanding an agent\u0027s evolving reasoning and evidence, and steerability for redirecting low-value directions or deepening promising ones during execution. Existing interactive approaches improve process visibility and open intervention points, but they remain largely designed for discrete, turn-by-turn exchanges rather than the parallel branches and evolving decision structures of long-running agentic analysis. We study this need as interactive oversight in long-running agentic data analysis and present AdaLens, an interactive system for monitoring and steering ongoing runs. AdaLens combines a storyline-based representation that unifies analytical plans, execution progress, intermediate findings, and data-column involvement with steering interactions grounded in these analytical elements for directional guidance and execution control. We evaluate AdaLens through two case studies and a user study, examining how it supports analysts in monitoring and steering long-running agentic data analysis.", "arxiv_id": "2608.17834", "arxiv_url": "https://arxiv.org/abs/2608.17834", "authors": ["Yangtian Liu", "Yan Miao", "Shuhan Liu", "Yunfan Zhou", "Dae Hyun Kim", "Di Weng", "Yingcai Wu"], "brief": "\u672c\u6587\u63d0\u51fa AdaLens\uff0c\u4e00\u4e2a\u7528\u4e8e\u957f\u65f6\u95f4\u8fd0\u884c\u667a\u80fd\u4f53\u6570\u636e\u5206\u6790\u7684\u4ea4\u4e92\u5f0f\u76d1\u63a7\u4e0e\u5f15\u5bfc\u7cfb\u7edf\u3002\u5b83\u7528\u6545\u4e8b\u7ebf\u8868\u793a\u7edf\u4e00\u5c55\u793a\u5206\u6790\u8ba1\u5212\u3001\u6267\u884c\u8fdb\u5ea6\u3001\u4e2d\u95f4\u53d1\u73b0\u548c\u6570\u636e\u5217\u53c2\u4e0e\u60c5\u51b5\uff0c\u5e76\u652f\u6301\u7528\u6237\u5728\u8fd0\u884c\u4e2d\u8c03\u6574\u65b9\u5411\u6216\u63a7\u5236\u6267\u884c\uff1b\u6848\u4f8b\u7814\u7a76\u548c\u7528\u6237\u7814\u7a76\u8868\u660e\u5176\u6709\u52a9\u4e8e\u63d0\u5347\u53ef\u89c2\u5bdf\u6027\u4e0e\u53ef\u63a7\u6027\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17834", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u5206\u6790", "\u4eba\u673a\u4ea4\u4e92", "\u53ef\u89c6\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17834v1", "published_at": "2026-08-18", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AdaLens: Interactive Storyline for Monitoring and Steering Long-Running Agentic Data Analysis", "tldr": "\u672c\u6587\u63d0\u51fa AdaLens\uff0c\u4e00\u4e2a\u7528\u4e8e\u957f\u65f6\u95f4\u8fd0\u884c\u667a\u80fd\u4f53\u6570\u636e\u5206\u6790\u7684\u4ea4\u4e92\u5f0f\u76d1\u63a7\u4e0e\u5f15\u5bfc\u7cfb\u7edf\u3002\u5b83\u7528\u6545\u4e8b\u7ebf\u8868\u793a\u7edf\u4e00\u5c55\u793a\u5206\u6790\u8ba1\u5212\u3001\u6267\u884c\u8fdb\u5ea6\u3001\u4e2d\u95f4\u53d1\u73b0\u548c\u6570\u636e\u5217\u53c2\u4e0e\u60c5\u51b5\uff0c\u5e76\u652f\u6301\u7528\u6237\u5728\u8fd0\u884c\u4e2d\u8c03\u6574\u65b9\u5411\u6216\u63a7\u5236\u6267\u884c\uff1b\u6848\u4f8b\u7814\u7a76\u548c\u7528\u6237\u7814\u7a76\u8868\u660e\u5176\u6709\u52a9\u4e8e\u63d0\u5347\u53ef\u89c2\u5bdf\u6027\u4e0e\u53ef\u63a7\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Memory is a key capability of LLM agents. Persistent memory extends this across sessions---enabling recall, revision, and personalization. Yet its multi-stage pipeline (ingestion, retrieval, filtering, generation) makes failures difficult to localize: end-to-end evaluation reveals that an error occurred, but not which stage caused it. Existing evaluations often report aggregate performance without paired statistical comparisons, slice-level non-regression checks, or stage-level diagnostic traces. We propose D$^2$ACCI (Diagnostic-Driven Artifact-based Closed-loop Controlled Iteration), a dual-loop protocol whose outer diagnostic gate promotes, feature-flags, or rejects memory interventions based on paired evidence, protected-slice monitoring, and trace-level localizability. We further introduce DCR, a graded observability metric that measures whether failures remain localizable, and D$^2$ACCI-Eval, a reusable artifact for gate replay. We instantiate the protocol in MemStack and evaluate on three public benchmarks, achieving 93.59% on LoCoMo, 90.93% on LongMemEval, and 57.20% on PersonaMem-V2. Five paired ablations show that supplement extraction, session-memory retrieval, and Forget Guard yield statistically significant gains (+1.9 to +3.7pp, all p $\\le$ .003). In contrast, BM25/RRF is retained as a monitored feature flag---a distinction invisible to aggregate-only evaluation. A diagnostic audit shows enriched traces substantially improve root-cause agreement over result-only relabeling. Diagnostic artifacts reach 98--100% DCR@3 versus 0% for results-only logs. These results establish that robust memory-system iteration demands traceable, statistically grounded, and regression-aware evidence---exactly the gap D$^2$ACCI fills.", "arxiv_id": "2608.17756", "arxiv_url": "https://arxiv.org/abs/2608.17756", "authors": ["Xule Liu", "Yijun Liu", "Chao Li", "Shao Kun"], "brief": "\u8bba\u6587\u63d0\u51fa D\u00b2ACCI\uff0c\u4e00\u79cd\u7528\u4e8e LLM \u667a\u80fd\u4f53\u6301\u4e45\u8bb0\u5fc6\u7cfb\u7edf\u7684\u53cc\u5faa\u73af\u8bca\u65ad\u534f\u8bae\uff0c\u901a\u8fc7\u6210\u5bf9\u7edf\u8ba1\u8bc1\u636e\u3001\u53d7\u4fdd\u62a4\u5207\u7247\u76d1\u63a7\u548c\u9636\u6bb5\u7ea7\u8ffd\u8e2a\u6765\u5b9a\u4f4d\u8bb0\u5fc6\u6d41\u6c34\u7ebf\u4e2d\u7684\u5931\u8d25\u539f\u56e0\u3002\u5176\u5728 MemStack \u548c\u4e09\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\uff0c\u5e76\u5f15\u5165 DCR \u6307\u6807\u4e0e\u53ef\u590d\u73b0\u5b9e\u9a8c\u5de5\u4ef6\uff0c\u4f7f\u8bb0\u5fc6\u7cfb\u7edf\u8fed\u4ee3\u66f4\u53ef\u8ffd\u8e2a\u3001\u53ef\u56de\u5f52\u68c0\u6d4b\u4e14\u6709\u7edf\u8ba1\u652f\u6491\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17756", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7cfb\u7edf", "\u8bc4\u4f30\u8bca\u65ad", "\u53ef\u89c2\u6d4b\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17756v1", "published_at": "2026-08-18", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "D$^2$ACCI: A Dual-Loop Diagnostic Protocol for Evidence-Preserving Agent Memory", "tldr": "\u8bba\u6587\u63d0\u51fa D\u00b2ACCI\uff0c\u4e00\u79cd\u7528\u4e8e LLM \u667a\u80fd\u4f53\u6301\u4e45\u8bb0\u5fc6\u7cfb\u7edf\u7684\u53cc\u5faa\u73af\u8bca\u65ad\u534f\u8bae\uff0c\u901a\u8fc7\u6210\u5bf9\u7edf\u8ba1\u8bc1\u636e\u3001\u53d7\u4fdd\u62a4\u5207\u7247\u76d1\u63a7\u548c\u9636\u6bb5\u7ea7\u8ffd\u8e2a\u6765\u5b9a\u4f4d\u8bb0\u5fc6\u6d41\u6c34\u7ebf\u4e2d\u7684\u5931\u8d25\u539f\u56e0\u3002\u5176\u5728 MemStack \u548c\u4e09\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\uff0c\u5e76\u5f15\u5165 DCR \u6307\u6807\u4e0e\u53ef\u590d\u73b0\u5b9e\u9a8c\u5de5\u4ef6\uff0c\u4f7f\u8bb0\u5fc6\u7cfb\u7edf\u8fed\u4ee3\u66f4\u53ef\u8ffd\u8e2a\u3001\u53ef\u56de\u5f52\u68c0\u6d4b\u4e14\u6709\u7edf\u8ba1\u652f\u6491\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing LLM-based approaches to Architecture Decision Record (ADR) generation share a critical and largely unexamined assumption: that input is already reasonably structured. In practice, architectural decisions emerge from informal, noisy meetings where choices are implicit, fragmented, and entangled with off-topic dialogue, precisely the conditions under which single-pass prompting degrades. This paper presents GADR, a multi-agent, self-correcting workflow that extracts architectural decisions from raw meeting transcriptions and generates Nygard-formatted ADR drafts. A feasibility study comprising five real project meeting transcripts, expert review by four senior architects, and evaluation by fifteen students provides initial evidence that the agentic workflow captures most expert-identified decisions and produces drafts participants found clear and useful, outperforming zero-shot and few-shot baselines in stability and structural adherence. The study also addresses the underexplored trade-off of RAG-based enrichment improving ADR depth while simultaneously risking transcript-unfaithful content, raising open questions about traceability in automated architectural documentation that we believe is worth the community\u0027s attention.", "arxiv_id": "2608.17694", "arxiv_url": "https://arxiv.org/abs/2608.17694", "authors": ["Lucas Daniel Costa da Silva", "Kiev Gama"], "brief": "\u672c\u6587\u63d0\u51fa GADR\uff0c\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u81ea\u7ea0\u9519\u6d41\u7a0b\uff0c\u7528\u4e8e\u4ece\u5608\u6742\u7684\u4f1a\u8bae\u8f6c\u5f55\u4e2d\u62bd\u53d6\u67b6\u6784\u51b3\u7b56\uff0c\u5e76\u751f\u6210 Nygard \u683c\u5f0f\u7684 ADR \u8349\u7a3f\u3002\u57fa\u4e8e\u771f\u5b9e\u9879\u76ee\u4f1a\u8bae\u3001\u8d44\u6df1\u67b6\u6784\u5e08\u548c\u5b66\u751f\u8bc4\u4f30\u7684\u53ef\u884c\u6027\u7814\u7a76\u663e\u793a\uff0c\u5b83\u76f8\u6bd4\u96f6\u6837\u672c/\u5c11\u6837\u672c\u63d0\u793a\u5728\u7ed3\u6784\u4e00\u81f4\u6027\u548c\u7a33\u5b9a\u6027\u4e0a\u66f4\u597d\uff0c\u4f46 RAG \u589e\u5f3a\u4e5f\u5e26\u6765\u751f\u6210\u5185\u5bb9\u504f\u79bb\u539f\u59cb\u8f6c\u5f55\u7684\u53ef\u8ffd\u6eaf\u6027\u98ce\u9669\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17694", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u5927\u8bed\u8a00\u6a21\u578b", "RAG"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17694v1", "published_at": "2026-08-18", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "GADR: Gathering Architecture Decision Records from Meeting Transcriptions", "tldr": "\u672c\u6587\u63d0\u51fa GADR\uff0c\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u81ea\u7ea0\u9519\u6d41\u7a0b\uff0c\u7528\u4e8e\u4ece\u5608\u6742\u7684\u4f1a\u8bae\u8f6c\u5f55\u4e2d\u62bd\u53d6\u67b6\u6784\u51b3\u7b56\uff0c\u5e76\u751f\u6210 Nygard \u683c\u5f0f\u7684 ADR \u8349\u7a3f\u3002\u57fa\u4e8e\u771f\u5b9e\u9879\u76ee\u4f1a\u8bae\u3001\u8d44\u6df1\u67b6\u6784\u5e08\u548c\u5b66\u751f\u8bc4\u4f30\u7684\u53ef\u884c\u6027\u7814\u7a76\u663e\u793a\uff0c\u5b83\u76f8\u6bd4\u96f6\u6837\u672c/\u5c11\u6837\u672c\u63d0\u793a\u5728\u7ed3\u6784\u4e00\u81f4\u6027\u548c\u7a33\u5b9a\u6027\u4e0a\u66f4\u597d\uff0c\u4f46 RAG \u589e\u5f3a\u4e5f\u5e26\u6765\u751f\u6210\u5185\u5bb9\u504f\u79bb\u539f\u59cb\u8f6c\u5f55\u7684\u53ef\u8ffd\u6eaf\u6027\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated security patch backporting is critical for mitigating N-day vulnerabilities. Recent tools report success rates above 80% on their respective datasets. However, these evaluations are often confined to homogeneous environments, such as one repository or specific project versions. Consequently, it remains unclear how well these tools generalize beyond their originally targeted scenarios. We present Porting Benchmark, a curated dataset of 1,234 security patch backporting cases spanning cross-version, cross-branch, and cross-repository scenarios, paired with a common evaluation framework. Using this benchmark, we evaluate five tools spanning program analysis, LLM prompting, and LLM agents under aligned settings. Our results show that aligned evaluation changes the apparent performance landscape: PortGPT and TSBPort remain comparatively strong on the Replication Dataset, while FixMorph and Mystique degrade substantially under the common protocol. Performance degrades sharply on structurally complex patches: the best commit-level success rate falls from 85.2% on Type-I patches to 24.0% on Type-IV. We identify four root-cause categories (missing target API awareness, cross-version semantic mismatch, non-local dependency propagation failure, and patch construction or localization failure) and derive concrete directions for next-generation tool design. On a 45-case dynamically validated subset with verified test cases and constructed POCs, we further observe that reference-based benchmark scores do not fully capture real-world remediation: exact match sharply under-credits harder target adaptations, while executable validation reveals residual integration failures in the target that static reference agreement misses. Executable-feedback refinement provides limited but measurable recovery on the hardest executable cases.", "arxiv_id": "2608.17671", "arxiv_url": "https://arxiv.org/abs/2608.17671", "authors": ["Jincheng Yang", "Yulong Fu", "Chengwei Liu", "Lyuye Zhang", "Fangyuan Zhang", "Bingyang Ren", "Yang Liu", "Hui Li"], "brief": "\u8bba\u6587\u63d0\u51fa Porting Benchmark\uff0c\u5305\u542b1234\u4e2a\u5b89\u5168\u8865\u4e01\u56de\u8fc1\u6848\u4f8b\uff0c\u8986\u76d6\u8de8\u7248\u672c\u3001\u8de8\u5206\u652f\u548c\u8de8\u4ed3\u5e93\u573a\u666f\uff0c\u5e76\u63d0\u4f9b\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6\u3002\u5bf95\u7c7b\u5de5\u5177\u7684\u5bf9\u9f50\u8bc4\u6d4b\u663e\u793a\uff0c\u73b0\u6709\u65b9\u6cd5\u5728\u590d\u6742\u7ed3\u6784\u8865\u4e01\u4e0a\u6027\u80fd\u5927\u5e45\u4e0b\u964d\uff0c\u4e14\u9759\u6001\u53c2\u8003\u5339\u914d\u4e0d\u80fd\u5145\u5206\u53cd\u6620\u771f\u5b9e\u4fee\u590d\u6548\u679c\uff0c\u52a8\u6001\u53ef\u6267\u884c\u9a8c\u8bc1\u66f4\u80fd\u66b4\u9732\u96c6\u6210\u5931\u8d25\u3002", "categories": ["cs.SE", "cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17671", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8f6f\u4ef6\u5de5\u7a0b", "\u5b89\u5168\u8865\u4e01", "\u57fa\u51c6\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17671v1", "published_at": "2026-08-18", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Benchmarking Automated Security Patch Backporting: How Far Are We?", "tldr": "\u8bba\u6587\u63d0\u51fa Porting Benchmark\uff0c\u5305\u542b1234\u4e2a\u5b89\u5168\u8865\u4e01\u56de\u8fc1\u6848\u4f8b\uff0c\u8986\u76d6\u8de8\u7248\u672c\u3001\u8de8\u5206\u652f\u548c\u8de8\u4ed3\u5e93\u573a\u666f\uff0c\u5e76\u63d0\u4f9b\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6\u3002\u5bf95\u7c7b\u5de5\u5177\u7684\u5bf9\u9f50\u8bc4\u6d4b\u663e\u793a\uff0c\u73b0\u6709\u65b9\u6cd5\u5728\u590d\u6742\u7ed3\u6784\u8865\u4e01\u4e0a\u6027\u80fd\u5927\u5e45\u4e0b\u964d\uff0c\u4e14\u9759\u6001\u53c2\u8003\u5339\u914d\u4e0d\u80fd\u5145\u5206\u53cd\u6620\u771f\u5b9e\u4fee\u590d\u6548\u679c\uff0c\u52a8\u6001\u53ef\u6267\u884c\u9a8c\u8bc1\u66f4\u80fd\u66b4\u9732\u96c6\u6210\u5931\u8d25\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-powered GUI agents that autonomously operate smartphones are rapidly transitioning from research prototypes to early real-world deployment. However, because these agents routinely process untrusted environmental content, they are highly vulnerable to environmental injection attacks, which include indirect prompt injections and adversarial instructions. Such attacks can manipulate the behavior of agents without user awareness through diverse channels encountered in everyday mobile use. Despite these risks, existing benchmarks often fail to capture everyday user scenarios, lacking a systematic evaluation of GUI agents under environmental injection attacks on mobile devices. To address this gap, we introduce MobileWorldSafety, a benchmark of 142 risk tasks built on real Android applications. For each task, we define a programmatically verifiable risk indicator over the final system state and evaluate outcomes with a two-stage pipeline: rule-based verification handles unambiguous cases, while an LLM judge adjudicates ambiguous ones. This distinguishes safety failures from capability failures and enables objective and reproducible assessment. Evaluations on six agents, including both general agents and specialized GUI agents, demonstrate that all agents remain highly vulnerable, with attack success rates ranging from 40.4% to 66.9%. These findings indicate that current agents often fail to maintain safety alignment when adversarial content is presented as ordinary mobile context. MobileWorldSafety provides a foundation for quantifying these vulnerabilities and advancing research on robust mobile GUI agents.", "arxiv_id": "2608.17659", "arxiv_url": "https://arxiv.org/abs/2608.17659", "authors": ["Sujin Chen", "Lijun Li", "Tianyi Du", "Jing Shao"], "brief": "\u8bba\u6587\u63d0\u51fa MobileWorldSafety\uff0c\u4e00\u4e2a\u57fa\u4e8e\u771f\u5b9e Android \u5e94\u7528\u7684 GUI \u667a\u80fd\u4f53\u5b89\u5168\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u6d4b\u73af\u5883\u6ce8\u5165\u653b\u51fb\uff08\u5982\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u3001\u5bf9\u6297\u6307\u4ee4\uff09\u4e0b\u7684\u98ce\u9669\u884c\u4e3a\u3002\u5bf9 6 \u4e2a\u667a\u80fd\u4f53\u7684\u5b9e\u9a8c\u663e\u793a\u653b\u51fb\u6210\u529f\u7387\u9ad8\u8fbe 40.4% \u81f3 66.9%\uff0c\u8bf4\u660e\u5f53\u524d\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u5728\u65e5\u5e38\u4e0a\u4e0b\u6587\u4e2d\u7684\u5b89\u5168\u5bf9\u9f50\u4ecd\u5f88\u8106\u5f31\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17659", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "GUI\u81ea\u52a8\u5316", "\u5b89\u5168\u8bc4\u6d4b", "\u63d0\u793a\u6ce8\u5165"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17659v1", "published_at": "2026-08-18", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MobileWorldSafety: Benchmarking GUI Agent Safety Against Environmental Injection Attacks in Android Apps", "tldr": "\u8bba\u6587\u63d0\u51fa MobileWorldSafety\uff0c\u4e00\u4e2a\u57fa\u4e8e\u771f\u5b9e Android \u5e94\u7528\u7684 GUI \u667a\u80fd\u4f53\u5b89\u5168\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u6d4b\u73af\u5883\u6ce8\u5165\u653b\u51fb\uff08\u5982\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u3001\u5bf9\u6297\u6307\u4ee4\uff09\u4e0b\u7684\u98ce\u9669\u884c\u4e3a\u3002\u5bf9 6 \u4e2a\u667a\u80fd\u4f53\u7684\u5b9e\u9a8c\u663e\u793a\u653b\u51fb\u6210\u529f\u7387\u9ad8\u8fbe 40.4% \u81f3 66.9%\uff0c\u8bf4\u660e\u5f53\u524d\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u5728\u65e5\u5e38\u4e0a\u4e0b\u6587\u4e2d\u7684\u5b89\u5168\u5bf9\u9f50\u4ecd\u5f88\u8106\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern agents operate inside agent harnesses that manage tools, context, and control flow, making the harness a critical part of the agent system. Our original Agent Lightning introduced a disaggregated architecture that connects arbitrary agents to RL training through an LLM endpoint proxy, an approach later adopted by frameworks such as verl Uni-Agent, AReaL 2.0, slime, and Polar. We refer to this paradigm as harnessed agentic RL, where the deploy-time harness directly participates in model post-training. Harnessed agentic RL differs fundamentally from traditional agentic RL: the harness, rather than the training engine, owns the environment interaction loop, while the trainer observes only sequences of LLM request-response pairs. This introduces challenges in retokenization, sample merging, advantage calculation, loss normalization, and backend scheduling, which can substantially affect training stability and effectiveness. We present Agent Lightning v1.0, a lightweight framework for harnessed agentic RL implemented in approximately 3,500 lines of code. It supports arbitrary agent harnesses and serves as a practical testbed for studying these challenges. We evaluate it on instruction-following, search, and coding agents, and provide a complete reproducible pipeline for coding-agent RL. Using only 6K training examples and modest compute, RL improves Qwen3.5-9B on SWE-bench Verified from 41.8% to 56.4%, a 14.6-point absolute gain. We release the complete workflow and training scripts to facilitate reproducible research on harnessed agentic RL.", "arxiv_id": "2608.17528", "arxiv_url": "https://arxiv.org/abs/2608.17528", "authors": ["Zhiyuan He", "Siwei Zhang", "Zhiwen Zhou", "Yuqing Yang", "Yu Kang", "Yuge Zhang", "Luna K. Qiu", "Tin Yan Tsui", "Jiahang Xu", "Chong Luo"], "brief": "\u8bba\u6587\u63d0\u51fa Agent Lightning v1.0\uff0c\u4e00\u4e2a\u7ea6 3500 \u884c\u4ee3\u7801\u7684\u8f7b\u91cf\u7ea7\u6846\u67b6\uff0c\u7528\u4e8e\u201charnessed agentic RL\u201d\uff0c\u8ba9\u90e8\u7f72\u65f6\u7684\u667a\u80fd\u4f53 harness \u76f4\u63a5\u53c2\u4e0e\u540e\u8bad\u7ec3\u3002\u5b83\u652f\u6301\u4efb\u610f\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5e76\u7cfb\u7edf\u5904\u7406\u91cd\u5206\u8bcd\u3001\u6837\u672c\u5408\u5e76\u3001\u4f18\u52bf\u4f30\u8ba1\u3001\u635f\u5931\u5f52\u4e00\u5316\u548c\u8c03\u5ea6\u7b49\u7a33\u5b9a\u8bad\u7ec3\u95ee\u9898\uff1b\u5728 SWE-bench Verified \u4e0a\u7528 6K \u6837\u672c\u5c06 Qwen3.5-9B \u4ece 41.8% \u63d0\u5347\u5230 56.4%\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17528", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4ee3\u7801\u667a\u80fd\u4f53", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17528v1", "published_at": "2026-08-18", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agent Lightning v1.0: Towards Harnessed Agentic RL", "tldr": "\u8bba\u6587\u63d0\u51fa Agent Lightning v1.0\uff0c\u4e00\u4e2a\u7ea6 3500 \u884c\u4ee3\u7801\u7684\u8f7b\u91cf\u7ea7\u6846\u67b6\uff0c\u7528\u4e8e\u201charnessed agentic RL\u201d\uff0c\u8ba9\u90e8\u7f72\u65f6\u7684\u667a\u80fd\u4f53 harness \u76f4\u63a5\u53c2\u4e0e\u540e\u8bad\u7ec3\u3002\u5b83\u652f\u6301\u4efb\u610f\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5e76\u7cfb\u7edf\u5904\u7406\u91cd\u5206\u8bcd\u3001\u6837\u672c\u5408\u5e76\u3001\u4f18\u52bf\u4f30\u8ba1\u3001\u635f\u5931\u5f52\u4e00\u5316\u548c\u8c03\u5ea6\u7b49\u7a33\u5b9a\u8bad\u7ec3\u95ee\u9898\uff1b\u5728 SWE-bench Verified \u4e0a\u7528 6K \u6837\u672c\u5c06 Qwen3.5-9B \u4ece 41.8% \u63d0\u5347\u5230 56.4%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Semantic Task Completion Video Generation, an outcome-oriented video generation task. Under this formulation, success requires both achievement of the intended outcome and semantic grounding. Semantic grounding characterizes the correspondence between the reference image and the generated outcome in terms of high-level semantics relevant to the task. Evaluation focuses on the generated outcome and requires neither the presentation of a complete sequence of intermediate task steps nor conventional appearance consistency with the reference image. To support systematic evaluation, we construct SemComp-Data, an evaluation dataset covering six domains. Each instance comprises a reference image, a detailed instruction, a brief instruction, and an outcome-centric video clip. A scalable four-stage curation pipeline converts raw videos into standardized SemComp-Data instances. We further introduce SemComp-Bench, an evaluation protocol that uses a vision-language model (VLM) to answer structured binary questions. SemComp-Bench reports the OA Score and the GR Score for Outcome Achievement and Generation Reliability, respectively. Experiments on representative video generation models show that achieving intended outcomes while maintaining task-relevant semantic grounding in reference images remains challenging.", "arxiv_id": "2608.17426", "arxiv_url": "https://arxiv.org/abs/2608.17426", "authors": ["Keyu Tu", "Zhuowei Chen", "Mengqi Huang", "Yuxin Wang", "Jiahao Zhu", "Zhendong Mao", "Yongdong Zhang"], "brief": "\u672c\u6587\u63d0\u51fa\u8bed\u4e49\u4efb\u52a1\u5b8c\u6210\u89c6\u9891\u751f\u6210\u4efb\u52a1\uff0c\u5f3a\u8c03\u751f\u6210\u89c6\u9891\u65e2\u8981\u8fbe\u6210\u6307\u5b9a\u7ed3\u679c\uff0c\u53c8\u8981\u4e0e\u53c2\u8003\u56fe\u50cf\u4fdd\u6301\u4efb\u52a1\u76f8\u5173\u7684\u9ad8\u5c42\u8bed\u4e49\u5173\u8054\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u8986\u76d6\u516d\u4e2a\u9886\u57df\u7684 SemComp-Data\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u95ee\u7b54\u7684 SemComp-Bench \u8bc4\u6d4b\u534f\u8bae\uff1b\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u89c6\u9891\u751f\u6210\u6a21\u578b\u5728\u7ed3\u679c\u8fbe\u6210\u548c\u8bed\u4e49 grounding \u4e0a\u4ecd\u6709\u660e\u663e\u6311\u6218\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17426", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8bed\u4e49\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17426v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SemComp-Bench: Benchmarking Semantic Task Completion in Video Generation", "tldr": "\u672c\u6587\u63d0\u51fa\u8bed\u4e49\u4efb\u52a1\u5b8c\u6210\u89c6\u9891\u751f\u6210\u4efb\u52a1\uff0c\u5f3a\u8c03\u751f\u6210\u89c6\u9891\u65e2\u8981\u8fbe\u6210\u6307\u5b9a\u7ed3\u679c\uff0c\u53c8\u8981\u4e0e\u53c2\u8003\u56fe\u50cf\u4fdd\u6301\u4efb\u52a1\u76f8\u5173\u7684\u9ad8\u5c42\u8bed\u4e49\u5173\u8054\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u8986\u76d6\u516d\u4e2a\u9886\u57df\u7684 SemComp-Data\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u95ee\u7b54\u7684 SemComp-Bench \u8bc4\u6d4b\u534f\u8bae\uff1b\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u89c6\u9891\u751f\u6210\u6a21\u578b\u5728\u7ed3\u679c\u8fbe\u6210\u548c\u8bed\u4e49 grounding \u4e0a\u4ecd\u6709\u660e\u663e\u6311\u6218\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning for coding agents increasingly relies on long-running agent harnesses to manage tool integration, repository contexts, and execution feedback. However, the native execution environments of these harnesses are inherently misaligned with policy-gradient training: environmental crashes and reward hacking corrupt outcome signals, while train-inference discrepancies decouple rollout behavior from policy updates. To address this, we present LEGO-RL, a framework that bridges native coding-agent harnesses with scalable policy-gradient optimization without modifying their internal control flow. LEGO-RL is built upon three pillars: (1) faithful optimization via in-process LLM proxying that captures raw generation streams for token-level alignment and robust trainer-side log-probability recomputation, even under harness-side compaction or re-serialization; (2) reliable execution via scalable sandbox orchestration featuring image caching and stage-wise defenses to mitigate reward hacking; and (3) observable training through an integrated plugin that automates validation and monitoring, paired with a Live UI for granular trajectory diagnostics. We evaluate LEGO-RL by training the sparse MoE model Qwen3.5-35B-A3B with GSPO across three native coding-agent harnesses. LEGO-RL improves Qwen3.5-35B-A3B across OpenHands SDK (64.0% to 70.4%), Claude Code (62.4% to 68.2%), and OpenCode (57.2% to 66.6%) on SWE-bench Verified, while maintaining a rollout-training probability correlation above 0.99.", "arxiv_id": "2608.17393", "arxiv_url": "https://arxiv.org/abs/2608.17393", "authors": ["Yiming Du", "Yuxin Jiang", "Tao Yuan", "Jianbo Dai", "Shaowei Wang", "Jierun Chen", "Chaofan Tao", "Xianzhi Yu", "Lifeng Shang", "Kam-Fai Wong", "Xiaohui Li", "Haoli Bai"], "brief": "LEGO-RL \u662f\u4e00\u4e2a\u9762\u5411\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u53ef\u5728\u4e0d\u4fee\u6539\u539f\u751f\u5de5\u5177/\u4ed3\u5e93\u6267\u884c harness \u63a7\u5236\u6d41\u7684\u60c5\u51b5\u4e0b\u63a5\u5165\u53ef\u6269\u5c55\u7b56\u7565\u68af\u5ea6\u8bad\u7ec3\u3002\u5b83\u901a\u8fc7\u8fdb\u7a0b\u5185\u5927\u6a21\u578b\u4ee3\u7406\u3001\u6c99\u7bb1\u7f16\u6392\u4e0e\u76d1\u63a7\u63d2\u4ef6\u89e3\u51b3\u8f68\u8ff9\u5bf9\u9f50\u3001\u73af\u5883\u5d29\u6e83\u548c\u5956\u52b1\u9ed1\u5ba2\u7b49\u95ee\u9898\uff0c\u5728 SWE-bench Verified \u4e0a\u4f7f Qwen3.5-35B-A3B \u4e8e\u591a\u4e2a\u7f16\u7a0b\u667a\u80fd\u4f53\u6846\u67b6\u4e2d\u663e\u8457\u63d0\u5347\uff0c\u4e14 rollout \u4e0e\u8bad\u7ec3\u6982\u7387\u76f8\u5173\u6027\u8d85\u8fc7 0.99\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17393", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4ee3\u7801\u751f\u6210", "\u7a0b\u5e8f\u4fee\u590d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17393v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LEGO-RL: Harness-Native Reinforcement Learning for Coding Agents", "tldr": "LEGO-RL \u662f\u4e00\u4e2a\u9762\u5411\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u53ef\u5728\u4e0d\u4fee\u6539\u539f\u751f\u5de5\u5177/\u4ed3\u5e93\u6267\u884c harness \u63a7\u5236\u6d41\u7684\u60c5\u51b5\u4e0b\u63a5\u5165\u53ef\u6269\u5c55\u7b56\u7565\u68af\u5ea6\u8bad\u7ec3\u3002\u5b83\u901a\u8fc7\u8fdb\u7a0b\u5185\u5927\u6a21\u578b\u4ee3\u7406\u3001\u6c99\u7bb1\u7f16\u6392\u4e0e\u76d1\u63a7\u63d2\u4ef6\u89e3\u51b3\u8f68\u8ff9\u5bf9\u9f50\u3001\u73af\u5883\u5d29\u6e83\u548c\u5956\u52b1\u9ed1\u5ba2\u7b49\u95ee\u9898\uff0c\u5728 SWE-bench Verified \u4e0a\u4f7f Qwen3.5-35B-A3B \u4e8e\u591a\u4e2a\u7f16\u7a0b\u667a\u80fd\u4f53\u6846\u67b6\u4e2d\u663e\u8457\u63d0\u5347\uff0c\u4e14 rollout \u4e0e\u8bad\u7ec3\u6982\u7387\u76f8\u5173\u6027\u8d85\u8fc7 0.99\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce PTXBench, a benchmark for evaluating and adapting large language models (LLMs) to use architecture-specific PTX for GPU kernel optimization. PTXBench measures functional correctness, whether selected target instructions execute at runtime, and speedup over frontier libraries across GEMM and attention workloads on H100 and B200 GPUs. Our evaluation shows that architecture-specific PTX capability remains uneven: success rates fall substantially on complex attention backward workloads, and executing the target instructions does not necessarily translate into competitive performance. No evaluated model consistently matches frontier libraries across the suite. We further adapt Qwen3.6-27B using supervised fine-tuning. Repair-conditioned training improves several tasks, but generalization remains uneven; data coverage, balance, and the quality of the reasoning teacher matter in addition to dataset size. PTXBench provides an auditable testbed for measuring and improving LLMs\u0027 ability to exploit evolving GPU architectures.", "arxiv_id": "2608.17379", "arxiv_url": "https://arxiv.org/abs/2608.17379", "authors": ["Genghan Zhang", "Yixin Dong", "Chengze Fan", "Zhichen Zeng", "Yueming Yuan", "Shaowei Zhu", "Kunle Olukotun"], "brief": "PTXBench \u662f\u4e00\u4e2a\u9762\u5411 GPU Kernel \u4f18\u5316\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u548c\u9002\u914d\u5927\u8bed\u8a00\u6a21\u578b\u4f7f\u7528\u7279\u5b9a\u67b6\u6784 PTX \u6307\u4ee4\u7684\u80fd\u529b\uff0c\u8986\u76d6 H100/B200 \u4e0a\u7684 GEMM \u4e0e\u6ce8\u610f\u529b\u5de5\u4f5c\u8d1f\u8f7d\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u80fd\u529b\u4e0d\u7a33\u5b9a\uff0c\u590d\u6742 attention backward \u6210\u529f\u7387\u660e\u663e\u4e0b\u964d\uff0c\u80fd\u6267\u884c\u76ee\u6807\u6307\u4ee4\u4e5f\u4e0d\u4e00\u5b9a\u5e26\u6765\u4f18\u4e8e\u524d\u6cbf\u5e93\u7684\u6027\u80fd\uff1b\u5bf9 Qwen3.6-27B \u5fae\u8c03\u53ef\u6539\u5584\u90e8\u5206\u4efb\u52a1\u4f46\u6cdb\u5316\u4ecd\u6709\u9650\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17379", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4ee3\u7801\u751f\u6210", "GPU\u4f18\u5316", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17379v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PTXBench: Benchmark and Adapt LLMs for GPU Kernel Optimization with Architecture-specific PTX", "tldr": "PTXBench \u662f\u4e00\u4e2a\u9762\u5411 GPU Kernel \u4f18\u5316\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u548c\u9002\u914d\u5927\u8bed\u8a00\u6a21\u578b\u4f7f\u7528\u7279\u5b9a\u67b6\u6784 PTX \u6307\u4ee4\u7684\u80fd\u529b\uff0c\u8986\u76d6 H100/B200 \u4e0a\u7684 GEMM \u4e0e\u6ce8\u610f\u529b\u5de5\u4f5c\u8d1f\u8f7d\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u80fd\u529b\u4e0d\u7a33\u5b9a\uff0c\u590d\u6742 attention backward \u6210\u529f\u7387\u660e\u663e\u4e0b\u964d\uff0c\u80fd\u6267\u884c\u76ee\u6807\u6307\u4ee4\u4e5f\u4e0d\u4e00\u5b9a\u5e26\u6765\u4f18\u4e8e\u524d\u6cbf\u5e93\u7684\u6027\u80fd\uff1b\u5bf9 Qwen3.6-27B \u5fae\u8c03\u53ef\u6539\u5584\u90e8\u5206\u4efb\u52a1\u4f46\u6cdb\u5316\u4ecd\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-context prefill in large language models (LLMs) incurs substantial computation and memory traffic because dense self-attention computes quadratic query-key scores. Existing methods either use a uniform low-precision path or select token interactions, leaving spatial precision routing over hardware-aligned score tiles outside fused dense attention. We introduce TileMix, a tile-centric precision-routing kernel that makes numerical precision an executable spatial decision over score-tile groups within fused dense attention. TileMix partitions the attention matrix into hardware-aligned score tiles, packs routing decisions into compact bitmasks, and dispatches each tile group through FP16 or INT8 score computation while both paths update a shared online-softmax state. Scalable precision grouping lets each routing bit govern multiple adjacent key tiles, preserving hardware-aligned compute tiles and compact metadata at long contexts. By routing all legal tile groups, TileMix preserves dense token connectivity, requires no training, and supports grouped-query attention, variable-length batches, and INT8 key/value caches. Across LongEval, LV-Eval, and A100 prefill benchmarks on LLaMA, Qwen, and Vicuna, TileMix recovers long-context quality lost under uniform INT8 and improves prefill throughput over FP16, yielding a controllable accuracy-efficiency frontier across model families. The implementation is available at https://github.com/HanzhiZhang-Ulrica/TileMix.", "arxiv_id": "2608.17336", "arxiv_url": "https://arxiv.org/abs/2608.17336", "authors": ["Hanzhi Zhang", "Qiao Zhang", "Qinglei Cao", "Heng Fan", "Yan Huang", "Kewei Sha", "Yunhe Feng"], "brief": "TileMix \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6ce8\u610f\u529b\u77e9\u9635\u786c\u4ef6\u5bf9\u9f50 tile \u7684\u6df7\u5408\u7cbe\u5ea6\u8def\u7531\u5185\u6838\uff0c\u5728\u878d\u5408\u7a20\u5bc6\u6ce8\u610f\u529b\u4e2d\u6309 score tile \u9009\u62e9 FP16 \u6216 INT8 \u8ba1\u7b97\uff0c\u5e76\u5171\u4eab\u5728\u7ebf softmax \u72b6\u6001\u3002\u5b83\u65e0\u9700\u8bad\u7ec3\u3001\u4fdd\u6301\u7a20\u5bc6\u8fde\u63a5\uff0c\u80fd\u5728\u957f\u4e0a\u4e0b\u6587\u9884\u586b\u5145\u4e2d\u76f8\u6bd4 FP16 \u63d0\u5347\u541e\u5410\uff0c\u540c\u65f6\u6bd4\u7edf\u4e00 INT8 \u66f4\u597d\u4fdd\u7559\u957f\u4e0a\u4e0b\u6587\u8d28\u91cf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17336", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6ce8\u610f\u529b\u52a0\u901f", "\u6df7\u5408\u7cbe\u5ea6", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17336v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TileMix: Tile-Centric Mixed-Precision Attention for LLM Inference Acceleration", "tldr": "TileMix \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6ce8\u610f\u529b\u77e9\u9635\u786c\u4ef6\u5bf9\u9f50 tile \u7684\u6df7\u5408\u7cbe\u5ea6\u8def\u7531\u5185\u6838\uff0c\u5728\u878d\u5408\u7a20\u5bc6\u6ce8\u610f\u529b\u4e2d\u6309 score tile \u9009\u62e9 FP16 \u6216 INT8 \u8ba1\u7b97\uff0c\u5e76\u5171\u4eab\u5728\u7ebf softmax \u72b6\u6001\u3002\u5b83\u65e0\u9700\u8bad\u7ec3\u3001\u4fdd\u6301\u7a20\u5bc6\u8fde\u63a5\uff0c\u80fd\u5728\u957f\u4e0a\u4e0b\u6587\u9884\u586b\u5145\u4e2d\u76f8\u6bd4 FP16 \u63d0\u5347\u541e\u5410\uff0c\u540c\u65f6\u6bd4\u7edf\u4e00 INT8 \u66f4\u597d\u4fdd\u7559\u957f\u4e0a\u4e0b\u6587\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Practical LLM unlearning is usually evaluated through two objectives: suppress target-specific knowledge and preserve non-target utility. In generative QA, this leaves a third behavior underspecified: when a target-adjacent prompt admits a broader answer without target-specific leakage, the model should answer at that level rather than leak, evade, or refuse. We study this specification problem in a controlled LoRA-GRPO RWKU setting, comparing four reward designs that span lexical suppression, anti-refusal shaping, rubric-based broad answering, and an explicit refusal contrast, with and without SFT warm-up. The experiments show that optimization success is not equivalent to behavioral unlearning: RWKU forget scores, held-out completion audits, terminal training-rollout audits, and training dynamics can point to different conclusions. We trace these disagreements to reward-hacking endpoints, policy-support limits in GRPO, benchmark probes that miss endpoint changes, and rewards that can select broad-topic answering with low semantic leakage during optimization.", "arxiv_id": "2608.17804", "arxiv_url": "https://arxiv.org/abs/2608.17804", "authors": ["Rub\u00e9n Balbastre", "Juan Manuel Ordu\u00f1a", "Mariano P\u00e9rez"], "brief": "\u672c\u6587\u7814\u7a76\u57fa\u4e8e GRPO \u7684\u5927\u6a21\u578b\u9057\u5fd8\u4e2d\uff0c\u5956\u52b1\u8bbe\u8ba1\u4e0e\u57fa\u51c6\u53ef\u9760\u6027\u4e4b\u95f4\u7684\u504f\u5dee\u95ee\u9898\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u4f18\u5316\u6307\u6807\u53d8\u597d\u5e76\u4e0d\u7b49\u540c\u4e8e\u771f\u6b63\u7684\u884c\u4e3a\u9057\u5fd8\uff0c\u4e0d\u540c\u8bc4\u6d4b\u53ef\u80fd\u7ed9\u51fa\u76f8\u4e92\u77db\u76fe\u7684\u7ed3\u8bba\uff0c\u539f\u56e0\u5305\u62ec\u5956\u52b1\u9ed1\u5ba2\u3001\u7b56\u7565\u652f\u6301\u9650\u5236\u548c\u57fa\u51c6\u63a2\u9488\u9057\u6f0f\u884c\u4e3a\u53d8\u5316\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17804", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u9057\u5fd8", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u8bbe\u8ba1", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17804v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "An Empirical Study of Reward Specification and Benchmark Reliability in GRPO-based LLM Unlearning", "tldr": "\u672c\u6587\u7814\u7a76\u57fa\u4e8e GRPO \u7684\u5927\u6a21\u578b\u9057\u5fd8\u4e2d\uff0c\u5956\u52b1\u8bbe\u8ba1\u4e0e\u57fa\u51c6\u53ef\u9760\u6027\u4e4b\u95f4\u7684\u504f\u5dee\u95ee\u9898\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u4f18\u5316\u6307\u6807\u53d8\u597d\u5e76\u4e0d\u7b49\u540c\u4e8e\u771f\u6b63\u7684\u884c\u4e3a\u9057\u5fd8\uff0c\u4e0d\u540c\u8bc4\u6d4b\u53ef\u80fd\u7ed9\u51fa\u76f8\u4e92\u77db\u76fe\u7684\u7ed3\u8bba\uff0c\u539f\u56e0\u5305\u62ec\u5956\u52b1\u9ed1\u5ba2\u3001\u7b56\u7565\u652f\u6301\u9650\u5236\u548c\u57fa\u51c6\u63a2\u9488\u9057\u6f0f\u884c\u4e3a\u53d8\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We demonstrate that RL finetuning an LLM using debate, a two-player adversarial game between a generator and a critic adjudicated by a weaker LLM judge, reduces reward hacking compared to a reinforcement learning from AI feedback (RLAIF) baseline. Reward hacking is a central obstacle in RLAIF: as training progresses, the policy learns to exploit systematic errors in its AI judge, degrading task performance, a problem that worsens precisely when the judge is weaker than the policy, the setting most relevant to overseeing increasingly capable AI systems. We study mathematics tasks, where final-answer correctness is verifiable, allowing us to measure reward hacking dynamics. We train a Gemini~2.5 Flash-class policy with a frozen, weaker Gemini~2.5 Flash Lite judge, comparing a single-player RLAIF baseline against debate. While the baseline quickly hacks the judge, debate maintains judge performance throughout training, leading to a higher peak validation accuracy (45\\% performance gap recovered) that persists through many RL steps. Additional experiments show that: 1) further weakening the judge leads to faster hacking, but this can be compensated by adding an additional debate round; 2) debate incentives override prompted misalignment; 3) RL using an LLM judge has a smaller train/validation reward gap than RL from verifiable rewards; 4) learning to critique to convince the judge using ground truth labels is possible but slow. Taken together, our results are a positive update on the feasibility of debate, while highlighting that balancing multi-agent training is critical: without player constraints, adversarial training risks defaulting to critic judge-hacking. We show that critique word limits (effective up to 150 words) successfully balance the game and avoid judge hacking, though this introduces a trade-off by restricting critic expressive clarity.", "arxiv_id": "2608.17776", "arxiv_url": "https://arxiv.org/abs/2608.17776", "authors": ["Zachary Kenton", "Lili Janzer", "Rory Greig", "Tian Huey Teh", "Kirill Tyshchuk", "Jonah Brown-Cohen", "Harri Edwards", "Senthooran Rajamanoharan", "Noah Y. Siegel", "Natasha Jaques", "Rohin Shah"], "brief": "\u8bba\u6587\u7814\u7a76\u7528\u8fa9\u8bba\u5f0f\u5f3a\u5316\u5b66\u4e60\u5fae\u8c03\u6765\u7f13\u89e3 RLAIF \u4e2d\u7684\u5956\u52b1\u9ed1\u5ba2\u95ee\u9898\uff1a\u751f\u6210\u5668\u4e0e\u6279\u8bc4\u8005\u5bf9\u6297\uff0c\u7531\u8f83\u5f31\u7684 LLM \u88c1\u5224\u5224\u5b9a\u3002\u5728\u6570\u5b66\u4efb\u52a1\u4e0a\uff0c\u76f8\u6bd4\u5355\u4eba RLAIF \u57fa\u7ebf\uff0c\u8fa9\u8bba\u8bad\u7ec3\u80fd\u66f4\u957f\u65f6\u95f4\u7ef4\u6301\u88c1\u5224\u6709\u6548\u6027\uff0c\u5e76\u6062\u590d\u7ea6 45% \u7684\u9a8c\u8bc1\u51c6\u786e\u7387\u5dee\u8ddd\uff1b\u4f46\u9700\u8981\u901a\u8fc7\u9650\u5236\u6279\u8bc4\u8005\u8868\u8fbe\u7b49\u65b9\u5f0f\u5e73\u8861\u591a\u667a\u80fd\u4f53\u8bad\u7ec3\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17776", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "RLAIF", "\u667a\u80fd\u4f53", "\u5956\u52b1\u9ed1\u5ba2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17776v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Debate Training Reduces Reward Hacking in RLAIF", "tldr": "\u8bba\u6587\u7814\u7a76\u7528\u8fa9\u8bba\u5f0f\u5f3a\u5316\u5b66\u4e60\u5fae\u8c03\u6765\u7f13\u89e3 RLAIF \u4e2d\u7684\u5956\u52b1\u9ed1\u5ba2\u95ee\u9898\uff1a\u751f\u6210\u5668\u4e0e\u6279\u8bc4\u8005\u5bf9\u6297\uff0c\u7531\u8f83\u5f31\u7684 LLM \u88c1\u5224\u5224\u5b9a\u3002\u5728\u6570\u5b66\u4efb\u52a1\u4e0a\uff0c\u76f8\u6bd4\u5355\u4eba RLAIF \u57fa\u7ebf\uff0c\u8fa9\u8bba\u8bad\u7ec3\u80fd\u66f4\u957f\u65f6\u95f4\u7ef4\u6301\u88c1\u5224\u6709\u6548\u6027\uff0c\u5e76\u6062\u590d\u7ea6 45% \u7684\u9a8c\u8bc1\u51c6\u786e\u7387\u5dee\u8ddd\uff1b\u4f46\u9700\u8981\u901a\u8fc7\u9650\u5236\u6279\u8bc4\u8005\u8868\u8fbe\u7b49\u65b9\u5f0f\u5e73\u8861\u591a\u667a\u80fd\u4f53\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "GRPO is increasingly used for reinforcement learning of vision-language-action (VLA) policies because, unlike PPO, it does not require training a critic. This simplification comes with a sampling cost: group-relative advantages require multiple rollouts from each scene. Under binary success rewards, groups whose rollouts all succeed or all fail have zero advantage and are discarded by dynamic sampling. These groups are especially common early in training, when most rollouts fail, wasting much of the expensive robotic rollout budget. We introduce Prism-GRPO, which augments binary outcome reward with a weighted trajectory-level execution-quality score. By splitting same-outcome groups into a quality spectrum, Prism-GRPO recovers training signal while ensuring that every success still outranks every failure. Quality scores can be
