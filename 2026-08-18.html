 derived from simulator contacts, executed actions, or visual observations, avoiding task-specific progress rewards. We prove that Prism-GRPO never increases the probability that a sampled group is discarded for having zero advantages, and derive a gradient-alignment condition under which its combined update remains a local ascent direction for task success. Across four RoboTwin tasks spanning different horizons and coordination patterns, Prism-GRPO improves success and quality at matched rollout budgets and reaches target success rates with up to 56% fewer rollouts. It also suppresses a reward-hacking shortcut, with the cleaner behavior transferring under direct deployment to a real robot. Through ablations, we show consistent gains across contact-, smoothness-, and VLM-derived quality signals.", "arxiv_id": "2608.17423", "arxiv_url": "https://arxiv.org/abs/2608.17423", "authors": ["Zeyun Deng", "Yuzhe Lu", "Yawei Wang", "Linbo Liu", "Qing Ping", "Han Ding", "Guande Wu", "Panpan Xu", "Jun Huan"], "brief": "\u672c\u6587\u63d0\u51fa Prism-GRPO\uff0c\u5728\u4e8c\u5143\u6210\u529f\u5956\u52b1\u4e4b\u5916\u52a0\u5165\u8f68\u8ff9\u7ea7\u6267\u884c\u8d28\u91cf\u8bc4\u5206\uff0c\u5c06\u5168\u6210\u529f\u6216\u5168\u5931\u8d25\u7684\u540c\u7ed3\u679c\u7ec4\u62c6\u5206\u51fa\u53ef\u5b66\u4e60\u7684\u8d28\u91cf\u5dee\u5f02\uff0c\u4ece\u800c\u51cf\u5c11 GRPO \u5728 VLA \u673a\u5668\u4eba\u8bad\u7ec3\u4e2d\u7684\u65e0\u6548\u91c7\u6837\u3002\u5b9e\u9a8c\u5728 RoboTwin \u591a\u4efb\u52a1\u4e0a\u4ee5\u76f8\u540c rollout \u9884\u7b97\u63d0\u5347\u6210\u529f\u7387\u4e0e\u884c\u4e3a\u8d28\u91cf\uff0c\u8fbe\u5230\u76ee\u6807\u6210\u529f\u7387\u6700\u591a\u51cf\u5c11 56% rollout\uff0c\u5e76\u80fd\u6291\u5236\u5956\u52b1\u6295\u673a\u4e14\u8fc1\u79fb\u5230\u771f\u5b9e\u673a\u5668\u4eba\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17423", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u7b56\u7565\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17423v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Prism-GRPO: Faster VLA Policy Optimization via Splitting Same-outcome Groups", "tldr": "\u672c\u6587\u63d0\u51fa Prism-GRPO\uff0c\u5728\u4e8c\u5143\u6210\u529f\u5956\u52b1\u4e4b\u5916\u52a0\u5165\u8f68\u8ff9\u7ea7\u6267\u884c\u8d28\u91cf\u8bc4\u5206\uff0c\u5c06\u5168\u6210\u529f\u6216\u5168\u5931\u8d25\u7684\u540c\u7ed3\u679c\u7ec4\u62c6\u5206\u51fa\u53ef\u5b66\u4e60\u7684\u8d28\u91cf\u5dee\u5f02\uff0c\u4ece\u800c\u51cf\u5c11 GRPO \u5728 VLA \u673a\u5668\u4eba\u8bad\u7ec3\u4e2d\u7684\u65e0\u6548\u91c7\u6837\u3002\u5b9e\u9a8c\u5728 RoboTwin \u591a\u4efb\u52a1\u4e0a\u4ee5\u76f8\u540c rollout \u9884\u7b97\u63d0\u5347\u6210\u529f\u7387\u4e0e\u884c\u4e3a\u8d28\u91cf\uff0c\u8fbe\u5230\u76ee\u6807\u6210\u529f\u7387\u6700\u591a\u51cf\u5c11 56% rollout\uff0c\u5e76\u80fd\u6291\u5236\u5956\u52b1\u6295\u673a\u4e14\u8fc1\u79fb\u5230\u771f\u5b9e\u673a\u5668\u4eba\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Group Relative Policy Optimization (GRPO) has become a widely used approach for post-training Large Language Models (LLMs) for reasoning. In GRPO, the group gradients induced by different queries within the same mini-batch are directly averaged to form the policy update. However, these group gradients can point in conflicting directions. Our empirical analysis suggests that group-gradient conflicts tend to be associated with less effective policy updates, motivating the need for a reliable aggregated update direction under such conflicts. Standard GRPO aggregation treats the realized group gradients as deterministic contributions and does not account for differences in their reliability during aggregation. To address this issue, we propose Gradient Uncertainty-Aware Policy Optimization (GUPO), which models each group gradient as a random variable under a Bayesian formulation and estimates its probability distribution. GUPO then derives gradient uncertainty using a Dirichlet-based formulation and uses it to calibrate the contribution of each group gradient during aggregation. Extensive experiments on multiple benchmarks demonstrate the effectiveness of GUPO.", "arxiv_id": "2608.17411", "arxiv_url": "https://arxiv.org/abs/2608.17411", "authors": ["Peizheng Guo", "Jianqi Zhang", "Xingyu Zhang", "Yun Fan", "Jiahuan Zhou", "Changwen Zheng", "Wenwen Qiang"], "brief": "\u672c\u6587\u6307\u51fa GRPO \u5728\u540c\u4e00 mini-batch \u5185\u76f4\u63a5\u5e73\u5747\u4e0d\u540c\u67e5\u8be2\u4ea7\u751f\u7684\u7ec4\u68af\u5ea6\u65f6\uff0c\u53ef\u80fd\u56e0\u68af\u5ea6\u65b9\u5411\u51b2\u7a81\u5bfc\u81f4\u4f4e\u6548\u66f4\u65b0\u3002\u4f5c\u8005\u63d0\u51fa GUPO\uff0c\u7528\u8d1d\u53f6\u65af\u65b9\u5f0f\u5efa\u6a21\u7ec4\u68af\u5ea6\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u57fa\u4e8e Dirichlet \u4f30\u8ba1\u6821\u51c6\u5404\u7ec4\u68af\u5ea6\u8d21\u732e\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u6548\u679c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17411", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u7b56\u7565\u4f18\u5316", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17411v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GUPO: Gradient Uncertainty-aware Policy Optimization for Post-Training Large Language Models", "tldr": "\u672c\u6587\u6307\u51fa GRPO \u5728\u540c\u4e00 mini-batch \u5185\u76f4\u63a5\u5e73\u5747\u4e0d\u540c\u67e5\u8be2\u4ea7\u751f\u7684\u7ec4\u68af\u5ea6\u65f6\uff0c\u53ef\u80fd\u56e0\u68af\u5ea6\u65b9\u5411\u51b2\u7a81\u5bfc\u81f4\u4f4e\u6548\u66f4\u65b0\u3002\u4f5c\u8005\u63d0\u51fa GUPO\uff0c\u7528\u8d1d\u53f6\u65af\u65b9\u5f0f\u5efa\u6a21\u7ec4\u68af\u5ea6\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u57fa\u4e8e Dirichlet \u4f30\u8ba1\u6821\u51c6\u5404\u7ec4\u68af\u5ea6\u8d21\u732e\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Humans continuously learn from experience, whereas conventional large language model (LLM) evaluations ignore the models\u0027 ability to improve through inference-time interaction. In this paper, we study how LLMs learn from iterative experience at test time, a setting we refer to as Chain-of-Experience (CoE), where models accumulate experiential traces through iterative interactions with self or environmental feedback to form a continual improvement loop beyond zero-shot inference. We instantiate CoE with diverse feedback mechanisms, including model self-feedback and environmental signals such as correctness or public coding test pass rates, and evaluate across math, coding, and knowledge domains using 8 LLMs, including GPT-5, Gemini-2.5 Pro, Claude-4.5 Sonnet. Our study shows that leveraging iterative experience consistently outperforms feedback-free baselines, achieving substantial gains with self feedback alone, alongside a 5.6% overall improvement and 19% lower API cost across tasks and models. We further show that combining complementary feedback channels (e.g., model and correctness signals) yields additional gains, and that CoE delivers higher accuracy per token than existing test-time strategies. We observe a positive correlation between LLM base ability and improvement capacity, and show that models remain robust under weak or spurious feedback, with different feedback contributing to distinct improvement aspects and most gains emerging early in the iterations.", "arxiv_id": "2608.18027", "arxiv_url": "https://arxiv.org/abs/2608.18027", "authors": ["Haoqin Tu", "Yunhao Fang", "Yizhong Wang", "Cihang Xie", "Shen Yan"], "brief": "\u8bba\u6587\u63d0\u51fa Chain-of-Experience\uff08CoE\uff09\uff0c\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6d4b\u8bd5\u65f6\u901a\u8fc7\u81ea\u53cd\u9988\u6216\u73af\u5883\u53cd\u9988\u8fed\u4ee3\u79ef\u7d2f\u7ecf\u9a8c\uff0c\u4ece\u800c\u5f62\u6210\u6301\u7eed\u6539\u8fdb\u5faa\u73af\u3002\u5b9e\u9a8c\u8986\u76d6\u6570\u5b66\u3001\u4ee3\u7801\u548c\u77e5\u8bc6\u4efb\u52a1\uff0c\u663e\u793a CoE \u7a33\u5b9a\u4f18\u4e8e\u65e0\u53cd\u9988\u57fa\u7ebf\uff0c\u6574\u4f53\u63d0\u5347 5.6% \u4e14 API \u6210\u672c\u964d\u4f4e 19%\uff0c\u591a\u79cd\u53cd\u9988\u7ec4\u5408\u8fd8\u80fd\u8fdb\u4e00\u6b65\u589e\u76ca\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18027", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u5b66\u4e60", "\u81ea\u53cd\u9988", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18027v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Chain-of-Experience for Continual LLM Improvement", "tldr": "\u8bba\u6587\u63d0\u51fa Chain-of-Experience\uff08CoE\uff09\uff0c\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6d4b\u8bd5\u65f6\u901a\u8fc7\u81ea\u53cd\u9988\u6216\u73af\u5883\u53cd\u9988\u8fed\u4ee3\u79ef\u7d2f\u7ecf\u9a8c\uff0c\u4ece\u800c\u5f62\u6210\u6301\u7eed\u6539\u8fdb\u5faa\u73af\u3002\u5b9e\u9a8c\u8986\u76d6\u6570\u5b66\u3001\u4ee3\u7801\u548c\u77e5\u8bc6\u4efb\u52a1\uff0c\u663e\u793a CoE \u7a33\u5b9a\u4f18\u4e8e\u65e0\u53cd\u9988\u57fa\u7ebf\uff0c\u6574\u4f53\u63d0\u5347 5.6% \u4e14 API \u6210\u672c\u964d\u4f4e 19%\uff0c\u591a\u79cd\u53cd\u9988\u7ec4\u5408\u8fd8\u80fd\u8fdb\u4e00\u6b65\u589e\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Using LLMs as judges has become standard practice for evaluating model outputs at scale. This is particularly common for subjective, open-ended tasks such as assessing helpfulness or alignment, where no single reference answer exists. However, objective tasks introduce a distinct reliability challenge for reference-free LLM judging. In the absence of a reference answer, the judge evaluates factual correctness either through its parametric knowledge or through tool augmentation. Although the former enables efficient evaluation, the judge may hallucinate or lack sufficient evidence for its verdict. Conversely, tool augmentation can provide additional evidence but introduces extra computational cost and requires an appropriate mechanism to determine when and how that evidence should be used reliably. More importantly, neither approach alone provides formal control over the risk of accepted verdicts or guarantees their reliability at a specified level. We propose a risk-controlled framework that calibrates uncertainty thresholds on a held-out set so that the false discovery rate among accepted verdicts remains below a user-specified level~$\u03b1$ with high probability, using finite-sample Clopper--Pearson intervals. When the parametric mode is not sufficiently confident, the instance is routed to a retrieval-augmented mode, where the judge gathers web evidence and re-evaluates the instance under a second calibrated threshold. The finite-sample guarantee carries over to this two-threshold routing without additional assumptions. Across open-domain QA benchmarks and judges of varying scales, the framework maintains the target error rate while achieving substantially higher coverage than single-mode baselines.", "arxiv_id": "2608.17994", "arxiv_url": "https://arxiv.org/abs/2608.17994", "authors": ["Sher Badshah", "Ali Emami", "Hassan Sajjad"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5e26\u4e0d\u786e\u5b9a\u6027\u4fdd\u62a4\u7684 LLM \u88c1\u5224\u6846\u67b6\uff1a\u5148\u7528\u53c2\u6570\u77e5\u8bc6\u5224\u5b9a\uff0c\u7f6e\u4fe1\u4e0d\u8db3\u65f6\u8f6c\u5411\u68c0\u7d22\u589e\u5f3a\u5224\u5b9a\uff0c\u5426\u5219\u9009\u62e9\u62d2\u5224\u3002\u65b9\u6cd5\u901a\u8fc7\u7559\u51fa\u96c6\u6821\u51c6\u9608\u503c\u548c Clopper-Pearson \u533a\u95f4\uff0c\u4e3a\u88ab\u63a5\u53d7\u88c1\u51b3\u7684\u9519\u8bef\u53d1\u73b0\u7387\u63d0\u4f9b\u6709\u9650\u6837\u672c\u98ce\u9669\u4fdd\u8bc1\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u5f00\u653e\u57df\u95ee\u7b54\u548c\u4e0d\u540c\u89c4\u6a21\u88c1\u5224\u6a21\u578b\u4e0a\uff0c\u8be5\u6846\u67b6\u80fd\u7ef4\u6301\u76ee\u6807\u9519\u8bef\u7387\uff0c\u540c\u65f6\u6bd4\u5355\u4e00\u6a21\u5f0f\u57fa\u7ebf\u8986\u76d6\u66f4\u591a\u6837\u672c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17994", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u4f30", "\u68c0\u7d22\u589e\u5f3a", "\u4e0d\u786e\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17994v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Judge, Retrieve, or Abstain: Uncertainty-Guarded LLM Judging with Provable Risk Guarantees", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5e26\u4e0d\u786e\u5b9a\u6027\u4fdd\u62a4\u7684 LLM \u88c1\u5224\u6846\u67b6\uff1a\u5148\u7528\u53c2\u6570\u77e5\u8bc6\u5224\u5b9a\uff0c\u7f6e\u4fe1\u4e0d\u8db3\u65f6\u8f6c\u5411\u68c0\u7d22\u589e\u5f3a\u5224\u5b9a\uff0c\u5426\u5219\u9009\u62e9\u62d2\u5224\u3002\u65b9\u6cd5\u901a\u8fc7\u7559\u51fa\u96c6\u6821\u51c6\u9608\u503c\u548c Clopper-Pearson \u533a\u95f4\uff0c\u4e3a\u88ab\u63a5\u53d7\u88c1\u51b3\u7684\u9519\u8bef\u53d1\u73b0\u7387\u63d0\u4f9b\u6709\u9650\u6837\u672c\u98ce\u9669\u4fdd\u8bc1\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u5f00\u653e\u57df\u95ee\u7b54\u548c\u4e0d\u540c\u89c4\u6a21\u88c1\u5224\u6a21\u578b\u4e0a\uff0c\u8be5\u6846\u67b6\u80fd\u7ef4\u6301\u76ee\u6807\u9519\u8bef\u7387\uff0c\u540c\u65f6\u6bd4\u5355\u4e00\u6a21\u5f0f\u57fa\u7ebf\u8986\u76d6\u66f4\u591a\u6837\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Expert-written natural language skills can improve tool-using agents, yet agent-authored skills perform 8-11 points worse than using no skill. This gap suggests that following procedural guidance and improving it from execution evidence are distinct capabilities. Inference time loops can repair skills but do not improve the model that writes the next one. We study how to organize execution experience from intermediate skills into training states for an optimizer. We introduce WER (Write, Execute, and Refine), a multi-phase framework that trains a Skill Optimizer outside a frozen executor. The optimizer proposes skills, a frozen agent executes each repeatedly, and a programmatic verifier scores the outcomes. The scores provide relative credit and select mixed-outcome records. Matched successful and failed trajectories from these records form the next phase\u0027s refinement states, so the optimizer learns from the consequences of its earlier outputs. On BFCL v4 multi-turn and tau2-bench, WER improves average Pass@1 over the no-skill baseline by 7.80 and 3.85 points, respectively. Under an identical refinement workflow, it outperforms the same backbone without optimizer training by 9.35 and 10.29 points. The trained 4B optimizer reaches 76.63 percent on BFCL v4, outperforming all evaluated off-the-shelf general-purpose models used as skill optimizers on average.", "arxiv_id": "2608.17587", "arxiv_url": "https://arxiv.org/abs/2608.17587", "authors": ["Kang Peng", "Zhiwei Zhang", "Yichen Zhang", "Zezhong Wang", "Yiming Du", "Geng Tu", "Baojun Wang", "Bin Liang", "Ruifeng Xu", "Kam-Fai Wong"], "brief": "\u672c\u6587\u63d0\u51fa WER\uff08Write, Execute, Refine\uff09\u6846\u67b6\uff0c\u5728\u51bb\u7ed3\u6267\u884c\u667a\u80fd\u4f53\u5916\u8bad\u7ec3\u4e00\u4e2a\u6280\u80fd\u4f18\u5316\u5668\uff1a\u5148\u751f\u6210\u81ea\u7136\u8bed\u8a00\u6280\u80fd\uff0c\u518d\u7531\u6267\u884c\u5668\u591a\u6b21\u8fd0\u884c\u5e76\u7528\u7a0b\u5e8f\u9a8c\u8bc1\u5668\u6253\u5206\uff0c\u6700\u540e\u7528\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u6784\u9020\u7cbe\u70bc\u8bad\u7ec3\u72b6\u6001\u3002\u8be5\u65b9\u6cd5\u5728 BFCL v4 \u548c tau2-bench \u4e0a\u76f8\u8f83\u65e0\u6280\u80fd\u57fa\u7ebf\u5206\u522b\u63d0\u5347 Pass@1 7.80 \u548c 3.85 \u70b9\uff0c\u5e76\u663e\u8457\u4f18\u4e8e\u672a\u8bad\u7ec3\u4f18\u5316\u5668\u7684\u540c\u9aa8\u5e72\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17587", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528", "\u6267\u884c\u53cd\u9988"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17587v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Write, Execute, Refine: From Skill Followers to Skill Optimizers via Reinforcement Learning from Execution Feedback", "tldr": "\u672c\u6587\u63d0\u51fa WER\uff08Write, Execute, Refine\uff09\u6846\u67b6\uff0c\u5728\u51bb\u7ed3\u6267\u884c\u667a\u80fd\u4f53\u5916\u8bad\u7ec3\u4e00\u4e2a\u6280\u80fd\u4f18\u5316\u5668\uff1a\u5148\u751f\u6210\u81ea\u7136\u8bed\u8a00\u6280\u80fd\uff0c\u518d\u7531\u6267\u884c\u5668\u591a\u6b21\u8fd0\u884c\u5e76\u7528\u7a0b\u5e8f\u9a8c\u8bc1\u5668\u6253\u5206\uff0c\u6700\u540e\u7528\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u6784\u9020\u7cbe\u70bc\u8bad\u7ec3\u72b6\u6001\u3002\u8be5\u65b9\u6cd5\u5728 BFCL v4 \u548c tau2-bench \u4e0a\u76f8\u8f83\u65e0\u6280\u80fd\u57fa\u7ebf\u5206\u522b\u63d0\u5347 Pass@1 7.80 \u548c 3.85 \u70b9\uff0c\u5e76\u663e\u8457\u4f18\u4e8e\u672a\u8bad\u7ec3\u4f18\u5316\u5668\u7684\u540c\u9aa8\u5e72\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most large language model services use stateless defenses, which judge only the current request, to refuse harmful tasks. Decomposition attacks exploit this limitation by splitting a harmful task into individually permissible requests and combining their answers. Defending against them therefore requires a stateful monitor that considers requests together. If it can group all requests for one attacker task, it can stop the attack. However, attackers can use unlinkable identities and combine answers elsewhere, leaving no reliable grouping signal. We ask whether decomposition attacks can still be stopped under this setting. For a fixed attack strategy without retries, we prove that the achievable security and utility tradeoff depends entirely on how benign requests for the same capabilities are grouped. Persistent, recognizable groups permit a useful defense; fresh, indistinguishable groups do not. When attackers can retry and learn from Allow/Block decisions, this useful operating point disappears: the feedback reveals what passes but not whether a block was correct. Experiments on 91 executable tasks and 11,393 capability-matched benign requests support these results. Under a 1% denial cap for these requests and a 0.5% cap for unrelated background traffic, all ten tested policies, including one privileged policy with an exact request-to-operation map, either fail to stop attacks or exceed the budget. On defense-unseen task families, attack success is at least 99% after one attempt and 100% after two. Effective defenses therefore require additional evidence or mechanisms tied to grouping, such as reliable identity linkage, costs for fresh identities, or control over answer use.", "arxiv_id": "2608.17445", "arxiv_url": "https://arxiv.org/abs/2608.17445", "authors": ["Bowen Sun", "Zhengyue Zhao", "Xiaogeng Liu", "Yinzhi Cao", "Chaowei Xiao"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u6a21\u578b\u670d\u52a1\u4e2d\u9488\u5bf9\u201c\u4efb\u52a1\u5206\u89e3\u653b\u51fb\u201d\u7684\u6709\u72b6\u6001\u9632\u5fa1\u6781\u9650\uff1a\u653b\u51fb\u8005\u53ef\u7528\u4e0d\u53ef\u5173\u8054\u8eab\u4efd\u5206\u522b\u8bf7\u6c42\u65e0\u5bb3\u5b50\u4efb\u52a1\uff0c\u518d\u5728\u5916\u90e8\u5408\u6210\u6709\u5bb3\u7ed3\u679c\u3002\u7406\u8bba\u4e0e\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u7f3a\u4e4f\u53ef\u9760\u8eab\u4efd\u5173\u8054\u6216\u8bf7\u6c42\u5206\u7ec4\u4fe1\u53f7\u65f6\uff0c\u5373\u4f7f\u6709\u72b6\u6001\u76d1\u63a7\u4e5f\u96be\u4ee5\u5728\u4f4e\u8bef\u62d2\u7387\u9884\u7b97\u4e0b\u963b\u6b62\u653b\u51fb\uff1b\u653b\u51fb\u8005\u53ef\u901a\u8fc7\u91cd\u8bd5\u5b66\u4e60\u7ed5\u8fc7\u7b56\u7565\uff0c\u9632\u5fa1\u6210\u529f\u7a7a\u95f4\u57fa\u672c\u6d88\u5931\u3002", "categories": ["cs.CR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17445", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u5bf9\u6297\u653b\u51fb", "\u6709\u72b6\u6001\u9632\u5fa1", "\u8eab\u4efd\u5173\u8054"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17445v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Decomposition Attacks Across Unlinkable Identities: Limits of Stateful Defenses for LLM Services", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u6a21\u578b\u670d\u52a1\u4e2d\u9488\u5bf9\u201c\u4efb\u52a1\u5206\u89e3\u653b\u51fb\u201d\u7684\u6709\u72b6\u6001\u9632\u5fa1\u6781\u9650\uff1a\u653b\u51fb\u8005\u53ef\u7528\u4e0d\u53ef\u5173\u8054\u8eab\u4efd\u5206\u522b\u8bf7\u6c42\u65e0\u5bb3\u5b50\u4efb\u52a1\uff0c\u518d\u5728\u5916\u90e8\u5408\u6210\u6709\u5bb3\u7ed3\u679c\u3002\u7406\u8bba\u4e0e\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u7f3a\u4e4f\u53ef\u9760\u8eab\u4efd\u5173\u8054\u6216\u8bf7\u6c42\u5206\u7ec4\u4fe1\u53f7\u65f6\uff0c\u5373\u4f7f\u6709\u72b6\u6001\u76d1\u63a7\u4e5f\u96be\u4ee5\u5728\u4f4e\u8bef\u62d2\u7387\u9884\u7b97\u4e0b\u963b\u6b62\u653b\u51fb\uff1b\u653b\u51fb\u8005\u53ef\u901a\u8fc7\u91cd\u8bd5\u5b66\u4e60\u7ed5\u8fc7\u7b56\u7565\uff0c\u9632\u5fa1\u6210\u529f\u7a7a\u95f4\u57fa\u672c\u6d88\u5931\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tokenization is a fundamental component of language modeling pipelines. Despite its importance, it is often fixed, even though it significantly impacts model performance across languages. In this work, we analyze what tokens are learned when tokenization is jointly optimized with language modeling. We compare tokenizer-free approaches such as SSLMs and H-Nets with fixed tokenizers across 18 typologically and script-diverse languages. Our results show that joint optimization fundamentally alters token structure. SSLMs recover morphologically aligned and contextually efficient tokens, whereas H-Nets prioritize byte-level efficiency, producing longer tokens with very low overlap with standard subword vocabularies. We further show that tokenization behavior varies across language typologies. Agglutinative languages exhibit more dynamic segmentation patterns while learning. Through downstream evaluation, with pretrained-then-finetuned BERT models, we find that SSLM-based pretokenization consistently reduces language modeling perplexity and achieves competitive downstream performance despite distinct vocabularies. Overall, tokenizer-free approaches optimize for contextual and computational efficiency rather than strict morphological structure, resulting in fundamentally different yet effective vocabularies for downstream NLP.", "arxiv_id": "2608.17325", "arxiv_url": "https://arxiv.org/abs/2608.17325", "authors": ["Saketh Reddy Vemula", "Parameswari Krishnamurthy"], "brief": "\u672c\u6587\u7814\u7a76\u5206\u8bcd\u4e0e\u8bed\u8a00\u5efa\u6a21\u8054\u5408\u4f18\u5316\u65f6\u4f1a\u5b66\u5230\u4ec0\u4e48\u6837\u7684 token\uff0c\u5e76\u572818\u79cd\u4e0d\u540c\u6587\u5b57\u548c\u7c7b\u578b\u8bed\u8a00\u4e0a\u6bd4\u8f83\u65e0\u56fa\u5b9a\u5206\u8bcd\u5668\u65b9\u6cd5\u4e0e\u4f20\u7edf\u5206\u8bcd\u5668\u3002\u7ed3\u679c\u663e\u793a\uff0cSSLM \u66f4\u503e\u5411\u5b66\u4e60\u5f62\u6001\u4e00\u81f4\u4e14\u4e0a\u4e0b\u6587\u9ad8\u6548\u7684 token\uff0cH-Net \u5219\u504f\u5411\u5b57\u8282\u7ea7\u8ba1\u7b97\u6548\u7387\uff1bSSLM \u9884\u5206\u8bcd\u8fd8\u80fd\u964d\u4f4e\u56f0\u60d1\u5ea6\u5e76\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u4e0b\u6e38\u6027\u80fd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17325", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u8bcd", "\u8bed\u8a00\u6a21\u578b", "\u591a\u8bed\u8a00", "\u81ea\u7136\u8bed\u8a00\u5904\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17325v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Tokens are Learned when Tokenization is Optimized Jointly with Language Modeling?", "tldr": "\u672c\u6587\u7814\u7a76\u5206\u8bcd\u4e0e\u8bed\u8a00\u5efa\u6a21\u8054\u5408\u4f18\u5316\u65f6\u4f1a\u5b66\u5230\u4ec0\u4e48\u6837\u7684 token\uff0c\u5e76\u572818\u79cd\u4e0d\u540c\u6587\u5b57\u548c\u7c7b\u578b\u8bed\u8a00\u4e0a\u6bd4\u8f83\u65e0\u56fa\u5b9a\u5206\u8bcd\u5668\u65b9\u6cd5\u4e0e\u4f20\u7edf\u5206\u8bcd\u5668\u3002\u7ed3\u679c\u663e\u793a\uff0cSSLM \u66f4\u503e\u5411\u5b66\u4e60\u5f62\u6001\u4e00\u81f4\u4e14\u4e0a\u4e0b\u6587\u9ad8\u6548\u7684 token\uff0cH-Net \u5219\u504f\u5411\u5b57\u8282\u7ea7\u8ba1\u7b97\u6548\u7387\uff1bSSLM \u9884\u5206\u8bcd\u8fd8\u80fd\u964d\u4f4e\u56f0\u60d1\u5ea6\u5e76\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u4e0b\u6e38\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Flow matching models for video generation achieve impressive performance but suffer from high computational overhead due to iterative denoising. In fact, the original model is not necessary for all denoising steps, allowing some steps to use lightweight alternatives for faster sampling. However, directly using caching or lightweight models can deviate from the original denoising trajectory, resulting in suboptimal performance. Through empirical analysis, we find that lightweight models can robustly capture the magnitude components of the original model\u0027s output, while caching provides reliable directional guidance. Building on this insight, we propose the Magnitude-Direction Decoupling (MDD) method, which adaptively employs a direction-calibrated lightweight model as a substitute for the original model to accelerate inference and effectively correct deviations in the denoising trajectory. Moreover, MDD further reduces inference costs by reusing magnitude information under classifier-free guidance (CFG). As a result, MDD offers a more reliable and lightweight solution to accelerate sampling. Experiments show that MDD outperforms existing acceleration methods, delivering promising speedups (e.g., up to 2.95x on Wan2.1) while preserving high visual fidelity and content richness.", "arxiv_id": "2608.17695", "arxiv_url": "https://arxiv.org/abs/2608.17695", "authors": ["Haonan Xu", "Feiyang Chen", "Songkui Chen", "Hongpeng Pan", "Zhefeng Wang", "Xinyu Duan", "Baoxing Huai", "Yang Yang"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e45\u503c-\u65b9\u5411\u89e3\u8026\uff08MDD\uff09\u65b9\u6cd5\uff0c\u7528\u8f7b\u91cf\u6a21\u578b\u4f30\u8ba1\u53bb\u566a\u8f93\u51fa\u7684\u5e45\u503c\u3001\u7528\u7f13\u5b58\u7ed3\u679c\u6821\u51c6\u65b9\u5411\uff0c\u4ee5\u66ff\u4ee3\u90e8\u5206\u539f\u59cb\u6d41\u5339\u914d\u89c6\u9891\u751f\u6210\u6a21\u578b\u63a8\u7406\u6b65\u9aa4\u3002\u8be5\u65b9\u6cd5\u5728\u4fdd\u6301\u89c6\u89c9\u8d28\u91cf\u548c\u5185\u5bb9\u4e30\u5bcc\u5ea6\u7684\u540c\u65f6\u663e\u8457\u52a0\u901f\u91c7\u6837\uff0c\u5728 Wan2.1 \u4e0a\u6700\u9ad8\u8fbe\u5230 2.95 \u500d\u52a0\u901f\uff0c\u5e76\u4f18\u4e8e\u5df2\u6709\u52a0\u901f\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17695", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6d41\u5339\u914d", "\u6a21\u578b\u52a0\u901f", "\u6269\u6563\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17695v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Magnitude-Direction Decoupling for Fast Video Generation with Flow Matching Models", "tldr": "\u8bba\u6587\u63d0\u51fa\u5e45\u503c-\u65b9\u5411\u89e3\u8026\uff08MDD\uff09\u65b9\u6cd5\uff0c\u7528\u8f7b\u91cf\u6a21\u578b\u4f30\u8ba1\u53bb\u566a\u8f93\u51fa\u7684\u5e45\u503c\u3001\u7528\u7f13\u5b58\u7ed3\u679c\u6821\u51c6\u65b9\u5411\uff0c\u4ee5\u66ff\u4ee3\u90e8\u5206\u539f\u59cb\u6d41\u5339\u914d\u89c6\u9891\u751f\u6210\u6a21\u578b\u63a8\u7406\u6b65\u9aa4\u3002\u8be5\u65b9\u6cd5\u5728\u4fdd\u6301\u89c6\u89c9\u8d28\u91cf\u548c\u5185\u5bb9\u4e30\u5bcc\u5ea6\u7684\u540c\u65f6\u663e\u8457\u52a0\u901f\u91c7\u6837\uff0c\u5728 Wan2.1 \u4e0a\u6700\u9ad8\u8fbe\u5230 2.95 \u500d\u52a0\u901f\uff0c\u5e76\u4f18\u4e8e\u5df2\u6709\u52a0\u901f\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Whole-slide pathology reasoning requires models to integrate gigapixel-scale visual evidence across complete case-linked slides, yet current question-answering benchmarks primarily measure final answer accuracy--a metric vulnerable to linguistic priors and benchmark regularities, and insufficient to establish that predictions are grounded in the supplied tissue. We introduce PathoArgus-Bench, a benchmark and evaluation protocol that explicitly tests the full evidence chain: availability, accessibility, use, and responsiveness. PathoArgus-Bench comprises 22,078 four-choice questions from 4,913 patients across 15 TCGA projects, covering six pathology capabilities across three levels of evidence demand, and operates under a fixed reader budget that retains only a small fraction of the gigapixel context. To further isolate evidence-grounded reasoning, we contribute ESG (Evidence State Quartets), a controlled set of 483 quartets where the question text is fixed while the target WSI set is moved, replaced, or removed, requiring consistent predictions across all states. Evaluating 20 general-purpose, medical, and pathology-specific systems reveals a stark gap: while GPT-5.6 achieves 57.09% overall accuracy and 57.04% on ESG, it correctly completes only 19 of 483 quartets (3.93% QExact), exposing that row-level accuracy does not translate into reliable evidence grounding. We also introduce PathoArgus, a fixed-budget reader that allocates context via question relevance and spatial coverage, attaining 50.39% overall accuracy yet only 1.86% QExact--demonstrating that improved context access alone does not ensure consistent evidence-based prediction. Our benchmark and diagnostics establish that acquiring useful whole-slide context is necessary but far from sufficient, and call for a shift from answer-centric to evidence-grounded evaluation in computational pathology.", "arxiv_id": "2608.17607", "arxiv_url": "https://arxiv.org/abs/2608.17607", "authors": ["Bowen Liu", "Qixiang Zhang", "Xiaomeng Li"], "brief": "\u8bba\u6587\u63d0\u51fa PathoArgus-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u75c5\u7406\u5168\u5207\u7247\u4e0e\u591a\u5207\u7247\u573a\u666f\u4e2d\u7684\u957f\u4e0a\u4e0b\u6587\u89c6\u89c9\u63a8\u7406\uff0c\u91cd\u70b9\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u771f\u6b63\u57fa\u4e8e\u7ec4\u7ec7\u8bc1\u636e\u5b8c\u6210\u4ece\u53ef\u7528\u6027\u3001\u53ef\u8bbf\u95ee\u6027\u3001\u4f7f\u7528\u5230\u54cd\u5e94\u7684\u4e00\u6574\u6761\u8bc1\u636e\u94fe\u3002\u5b9e\u9a8c\u53d1\u73b0 20 \u4e2a\u901a\u7528\u3001\u533b\u5b66\u548c\u75c5\u7406\u6a21\u578b\u5373\u4f7f\u6709\u8f83\u9ad8\u9010\u9898\u51c6\u786e\u7387\uff0c\u5728\u53d7\u63a7 ESG \u56db\u5143\u7ec4\u4e0a\u7684\u4e00\u81f4\u8bc1\u636e grounding \u4ecd\u6781\u5dee\uff0c\u8bf4\u660e\u7b54\u6848\u51c6\u786e\u7387\u4e0d\u8db3\u4ee5\u8861\u91cf\u53ef\u9760\u75c5\u7406\u63a8\u7406\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u56fa\u5b9a\u9884\u7b97\u8bfb\u53d6\u5668 PathoArgus\uff0c\u4f46\u7ed3\u679c\u8868\u660e\u6539\u5584\u4e0a\u4e0b\u6587\u8bbf\u95ee\u5e76\u4e0d\u80fd\u81ea\u52a8\u5e26\u6765\u7a33\u5b9a\u7684\u8bc1\u636e\u9a71\u52a8\u9884\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17607", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u75c5\u7406", "\u89c6\u89c9\u63a8\u7406", "\u957f\u4e0a\u4e0b\u6587", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17607v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PathoArgus: Advancing Evidence-Grounded Long-Context Visual Reasoning across Gigapixel Whole-Slide and Multi-Slide Case Contexts", "tldr": "\u8bba\u6587\u63d0\u51fa PathoArgus-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u75c5\u7406\u5168\u5207\u7247\u4e0e\u591a\u5207\u7247\u573a\u666f\u4e2d\u7684\u957f\u4e0a\u4e0b\u6587\u89c6\u89c9\u63a8\u7406\uff0c\u91cd\u70b9\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u771f\u6b63\u57fa\u4e8e\u7ec4\u7ec7\u8bc1\u636e\u5b8c\u6210\u4ece\u53ef\u7528\u6027\u3001\u53ef\u8bbf\u95ee\u6027\u3001\u4f7f\u7528\u5230\u54cd\u5e94\u7684\u4e00\u6574\u6761\u8bc1\u636e\u94fe\u3002\u5b9e\u9a8c\u53d1\u73b0 20 \u4e2a\u901a\u7528\u3001\u533b\u5b66\u548c\u75c5\u7406\u6a21\u578b\u5373\u4f7f\u6709\u8f83\u9ad8\u9010\u9898\u51c6\u786e\u7387\uff0c\u5728\u53d7\u63a7 ESG \u56db\u5143\u7ec4\u4e0a\u7684\u4e00\u81f4\u8bc1\u636e grounding \u4ecd\u6781\u5dee\uff0c\u8bf4\u660e\u7b54\u6848\u51c6\u786e\u7387\u4e0d\u8db3\u4ee5\u8861\u91cf\u53ef\u9760\u75c5\u7406\u63a8\u7406\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u56fa\u5b9a\u9884\u7b97\u8bfb\u53d6\u5668 PathoArgus\uff0c\u4f46\u7ed3\u679c\u8868\u660e\u6539\u5584\u4e0a\u4e0b\u6587\u8bbf\u95ee\u5e76\u4e0d\u80fd\u81ea\u52a8\u5e26\u6765\u7a33\u5b9a\u7684\u8bc1\u636e\u9a71\u52a8\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The quality and diversity of instruction-based video editing datasets are steadily improving, yet existing datasets mainly focus on single editing operations and fall short in supporting compositional instruction-guided video editing. In particular, multiple editing intents must be jointly understood and faithfully executed within the same video. To address this issue, we introduce CoinVE-200K, a large-scale, high-quality dataset for Compositional Instruction-Guided Video Editing. CoinVE-200K contains 1080p video-editing pairs of up to 201 frames, covering diverse compositional scenarios where each sample involves 2 to 5 atomic editing operations. The instructions target humans, objects, and backgrounds, and cover edit types such as addition, removal, modification, and stylization. All samples are built through a carefully designed generation and filtering pipeline to ensure instruction faithfulness, visual quality, temporal consistency, and compositional diversity. We also introduce CoinVE-Bench, a benchmark for compositional-instruction video editing across diverse subjects, operation types, and instruction complexities. Furthermore, we present CoinVE-Edit, a 22B compositional video editing model built upon Wan2.1-T2V-14B and Qwen3-VL-8B-Instruct. CoinVE-Edit disentangles region-aware attention for different editing instructions, enabling precise multi-region editing while preserving irrelevant content and temporal coherence. Experiments on CoinVE-Bench show that CoinVE-Edit achieves strong performance in instruction following, compositional editing accuracy, visual quality, and temporal consistency.", "arxiv_id": "2608.17566", "arxiv_url": "https://arxiv.org/abs/2608.17566", "authors": ["Fuchen Long", "Cong Wang", "Zitao Gao", "Wenhao Zhong", "Yu Cheng", "Xiaolu Hou", "Yan Li", "Xiao Cao", "Xinlong Sun", "Xi Chen", "Yu Liu"], "brief": "\u8bba\u6587\u63d0\u51fa CoinVE-200K\uff0c\u4e00\u4e2a\u9762\u5411\u7ec4\u5408\u5f0f\u6307\u4ee4\u89c6\u9891\u7f16\u8f91\u7684\u5927\u89c4\u6a21\u9ad8\u8d28\u91cf\u6570\u636e\u96c6\uff0c\u6bcf\u4e2a\u6837\u672c\u5305\u542b 2 \u5230 5 \u4e2a\u539f\u5b50\u7f16\u8f91\u64cd\u4f5c\uff0c\u8986\u76d6\u4eba\u7269\u3001\u7269\u4f53\u3001\u80cc\u666f\u53ca\u589e\u5220\u6539\u3001\u98ce\u683c\u5316\u7b49\u7c7b\u578b\u3002\u4f5c\u8005\u540c\u65f6\u53d1\u5e03 CoinVE-Bench \u548c 22B \u6a21\u578b CoinVE-Edit\uff0c\u901a\u8fc7\u533a\u57df\u611f\u77e5\u6ce8\u610f\u529b\u5b9e\u73b0\u591a\u533a\u57df\u7cbe\u786e\u7f16\u8f91\uff0c\u5728\u6307\u4ee4\u9075\u5faa\u3001\u7ec4\u5408\u7f16\u8f91\u51c6\u786e\u6027\u3001\u753b\u8d28\u548c\u65f6\u5e8f\u4e00\u81f4\u6027\u4e0a\u8868\u73b0\u8f83\u5f3a\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17566", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u6570\u636e\u96c6", "\u591a\u6a21\u6001", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17566v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoinVE-200K: A Large-Scale High-Quality Dataset for Compositional Instruction-Guided Video Editing", "tldr": "\u8bba\u6587\u63d0\u51fa CoinVE-200K\uff0c\u4e00\u4e2a\u9762\u5411\u7ec4\u5408\u5f0f\u6307\u4ee4\u89c6\u9891\u7f16\u8f91\u7684\u5927\u89c4\u6a21\u9ad8\u8d28\u91cf\u6570\u636e\u96c6\uff0c\u6bcf\u4e2a\u6837\u672c\u5305\u542b 2 \u5230 5 \u4e2a\u539f\u5b50\u7f16\u8f91\u64cd\u4f5c\uff0c\u8986\u76d6\u4eba\u7269\u3001\u7269\u4f53\u3001\u80cc\u666f\u53ca\u589e\u5220\u6539\u3001\u98ce\u683c\u5316\u7b49\u7c7b\u578b\u3002\u4f5c\u8005\u540c\u65f6\u53d1\u5e03 CoinVE-Bench \u548c 22B \u6a21\u578b CoinVE-Edit\uff0c\u901a\u8fc7\u533a\u57df\u611f\u77e5\u6ce8\u610f\u529b\u5b9e\u73b0\u591a\u533a\u57df\u7cbe\u786e\u7f16\u8f91\uff0c\u5728\u6307\u4ee4\u9075\u5faa\u3001\u7ec4\u5408\u7f16\u8f91\u51c6\u786e\u6027\u3001\u753b\u8d28\u548c\u65f6\u5e8f\u4e00\u81f4\u6027\u4e0a\u8868\u73b0\u8f83\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper, we tackle the problem of performing consistent, unified modifications to a multi-shot video sequence. This task is particularly challenging because multi-shot videos consist of discontinuous temporal segments that vary significantly in viewpoint, camera scale, and subject pose, leading to severe identity drift and cumulative error propagation. Achieving coherent edits requires establishing reliable cross-shot semantic awareness to maintain stable subject appearance and visual continuity across these disjointed boundaries. To address this, we propose MSEditor, the first framework designed specifically for consistent multi-shot video editing. To overcome the scarcity of high-quality multi-shot training data, we repurpose existing multi-view video datasets to provide robust cross-shot supervision. Architecturally, we introduce a Supervisory Adapter that injects this cross-shot information into the diffusion backbone, enabling the model to learn identity-consistent representations. Furthermore, to effectively mitigate cumulative errors and ensure long-range temporal coherence, we design a Cross-Shot Packing strategy that dynamically aggregates information from semantically related shots within the self-attention window. Extensive experiments demonstrate that MSEditor significantly outperforms existing methods on our curated multi-shot video editing benchmark in terms of identity preservation, temporal stability, and overall visual quality.", "arxiv_id": "2608.17559", "arxiv_url": "https://arxiv.org/abs/2608.17559", "authors": ["Kunyu Feng", "Yue Ma", "Bingyuan Wang", "Yuefeng Wang", "Zhiyuan Qin", "Hao Cheng", "Hao Li", "Qifeng Chen", "Zeyu Wang"], "brief": "\u8bba\u6587\u63d0\u51fa MSEditor\uff0c\u9762\u5411\u591a\u955c\u5934\u89c6\u9891\u7684\u4e00\u81f4\u6027\u7f16\u8f91\uff0c\u89e3\u51b3\u4e0d\u540c\u955c\u5934\u95f4\u89c6\u89d2\u3001\u5c3a\u5ea6\u548c\u59ff\u6001\u53d8\u5316\u5bfc\u81f4\u7684\u8eab\u4efd\u6f02\u79fb\u4e0e\u65f6\u5e8f\u4e0d\u7a33\u5b9a\u95ee\u9898\u3002\u65b9\u6cd5\u5229\u7528\u591a\u89c6\u89d2\u89c6\u9891\u6570\u636e\u63d0\u4f9b\u8de8\u955c\u5934\u76d1\u7763\uff0c\u5e76\u901a\u8fc7 Supervisory Adapter \u4e0e Cross-Shot Packing \u589e\u5f3a\u6269\u6563\u6a21\u578b\u7684\u8eab\u4efd\u4e00\u81f4\u6027\u548c\u957f\u7a0b\u8fde\u8d2f\u6027\uff0c\u5b9e\u9a8c\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17559", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u6269\u6563\u6a21\u578b", "\u591a\u955c\u5934\u4e00\u81f4\u6027", "\u65f6\u5e8f\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17559v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MSEditor: Toward Consistent Multi-Shot Video Editing", "tldr": "\u8bba\u6587\u63d0\u51fa MSEditor\uff0c\u9762\u5411\u591a\u955c\u5934\u89c6\u9891\u7684\u4e00\u81f4\u6027\u7f16\u8f91\uff0c\u89e3\u51b3\u4e0d\u540c\u955c\u5934\u95f4\u89c6\u89d2\u3001\u5c3a\u5ea6\u548c\u59ff\u6001\u53d8\u5316\u5bfc\u81f4\u7684\u8eab\u4efd\u6f02\u79fb\u4e0e\u65f6\u5e8f\u4e0d\u7a33\u5b9a\u95ee\u9898\u3002\u65b9\u6cd5\u5229\u7528\u591a\u89c6\u89d2\u89c6\u9891\u6570\u636e\u63d0\u4f9b\u8de8\u955c\u5934\u76d1\u7763\uff0c\u5e76\u901a\u8fc7 Supervisory Adapter \u4e0e Cross-Shot Packing \u589e\u5f3a\u6269\u6563\u6a21\u578b\u7684\u8eab\u4efd\u4e00\u81f4\u6027\u548c\u957f\u7a0b\u8fde\u8d2f\u6027\uff0c\u5b9e\u9a8c\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Differentially private training adds isotropic Gaussian noise to clipped gradients, corrupting every singular direction equally. In vision models, where spatial correlation concentrates gradient energy into a low-rank subspace, most of this noise falls in directions that carry little signal. Spectral gradient orthogonalization via polar decomposition is introduced as a post-processing step that recovers directional signal from the noisy gradient\u0027s low-rank structure at zero additional privacy cost. A phase transition governs the utility of this approach: orthogonalization improves accuracy only when the per-direction spectral signal-to-noise ratio (SNR) suffices for singular vector recovery; in low-SNR regimes, the directional bias of the gradient is replaced by a nearly random orthogonal update, and the transformation is harmful. The recovery threshold is determined by the spectral gap of the gradient and is surpassed at large batch sizes. Empirically, the benefit scales with model capacity: spectral orthogonalization achieves a +20.9% improvement over DP-SGD on WRN-28-10 (B = 4096) and +14.9% on ResNet-18, while reducing inter-run variance by a factor of two to three. In the fine-tuning regime, spectral orthogonalization matches the stability of DP-Adam while maintaining a first-order memory footprint. Combining spectral with temporal denoising yields 50.3% on CIFAR-10 (epsilon = 4), the highest accuracy in any tested configuration. These gains are specific to moderate-to-high-SNR regimes such as large-batch training of higher-capacity models. Small-batch or low-SNR settings are better served by DP-SGD or temporal denoising.", "arxiv_id": "2608.17415", "arxiv_url": "https://arxiv.org/abs/2608.17415", "authors": ["Sabari Shanmugam", "Nick Barnes", "Kerry Taylor"], "brief": "\u8bba\u6587\u63d0\u51fa\u5728\u5dee\u5206\u9690\u79c1\u8bad\u7ec3\u4e2d\u5bf9\u5e26\u566a\u88c1\u526a\u68af\u5ea6\u505a\u8c31\u68af\u5ea6\u6b63\u4ea4\u5316\uff0c\u5229\u7528\u89c6\u89c9\u6a21\u578b\u68af\u5ea6\u7684\u4f4e\u79e9\u7ed3\u6784\u6062\u590d\u65b9\u5411\u4fe1\u53f7\uff0c\u4e14\u4e0d\u589e\u52a0\u989d\u5916\u9690\u79c1\u6210\u672c\u3002\u8be5\u65b9\u6cd5\u5728\u5927\u6279\u91cf\u3001\u9ad8\u5bb9\u91cf\u6a21\u578b\u7b49\u4e2d\u9ad8\u4fe1\u566a\u6bd4\u573a\u666f\u663e\u8457\u4f18\u4e8e DP-SGD\uff0c\u4f8b\u5982 WRN-28-10 \u63d0\u5347 20.9%\uff0c\u5e76\u964d\u4f4e\u591a\u6b21\u8fd0\u884c\u65b9\u5dee\uff1b\u4f46\u5728\u4f4e\u4fe1\u566a\u6bd4\u6216\u5c0f\u6279\u91cf\u573a\u666f\u53ef\u80fd\u6709\u5bb3\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17415", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5dee\u5206\u9690\u79c1", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u68af\u5ea6\u53bb\u566a", "\u5927\u89c4\u6a21\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17415v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Spectral Gradient Orthogonalization Improves Differentially Private Training at Scale", "tldr": "\u8bba\u6587\u63d0\u51fa\u5728\u5dee\u5206\u9690\u79c1\u8bad\u7ec3\u4e2d\u5bf9\u5e26\u566a\u88c1\u526a\u68af\u5ea6\u505a\u8c31\u68af\u5ea6\u6b63\u4ea4\u5316\uff0c\u5229\u7528\u89c6\u89c9\u6a21\u578b\u68af\u5ea6\u7684\u4f4e\u79e9\u7ed3\u6784\u6062\u590d\u65b9\u5411\u4fe1\u53f7\uff0c\u4e14\u4e0d\u589e\u52a0\u989d\u5916\u9690\u79c1\u6210\u672c\u3002\u8be5\u65b9\u6cd5\u5728\u5927\u6279\u91cf\u3001\u9ad8\u5bb9\u91cf\u6a21\u578b\u7b49\u4e2d\u9ad8\u4fe1\u566a\u6bd4\u573a\u666f\u663e\u8457\u4f18\u4e8e DP-SGD\uff0c\u4f8b\u5982 WRN-28-10 \u63d0\u5347 20.9%\uff0c\u5e76\u964d\u4f4e\u591a\u6b21\u8fd0\u884c\u65b9\u5dee\uff1b\u4f46\u5728\u4f4e\u4fe1\u566a\u6bd4\u6216\u5c0f\u6279\u91cf\u573a\u666f\u53ef\u80fd\u6709\u5bb3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision encoders are a critical component of vision-language models, and scaling their capacity effectively improves performance. However, dense scaling increases compute cost and inference latency. Mixture-of-Experts (MoE) architectures offer a compelling alternative, having enabled efficient scaling in LLMs, yet the MoE design space for CLIP-style vision encoders remains underexplored at State-of-the-Art (SOTA) levels. In this work, we systematically study MoE designs for vision encoder scaling and find that fine-grained MoE topologies yield substantial gains over both dense and standard MoE counterparts. We further propose an auxiliary-loss-free balancing variant for better expert utilization, and design a specialized MoE kernel to mitigate inference latency overhead. To enhance video capabilities while preserving image knowledge, we introduce frame-level distillation paired with a novel freezing mechanism. We pretrain a series of Mixture-of-Experts Vision Encoders (MoE-ViE) across a range of sizes, all consistently outperforming their dense counterparts. Our largest model matches the zero-shot performance of a SOTA encoder 1.7x its size at 76% of its latency. When aligned with an LLM, MoE-ViE surpasses all compared encoders on image and video benchmarks, including those with up to 5x more activated parameters. Code is available at https://github.com/facebookresearch/moe_vie.", "arxiv_id": "2608.17402", "arxiv_url": "https://arxiv.org/abs/2608.17402", "authors": ["Bonan Zhang", "Shiyu Dong", "Quan Hung Tran", "Katharina Gschwind", "Shuqi Yang", "Sijia Chen", "Adel Ahmadyan", "Seungwhan Moon", "Lu Zhang", "Ahmed Kirmani", "Babak Damavandi", "Anuj Kumar"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u7528\u4e8e CLIP \u98ce\u683c\u89c6\u89c9\u7f16\u7801\u5668\u6269\u5c55\u7684 MoE \u8bbe\u8ba1\uff0c\u63d0\u51fa\u7ec6\u7c92\u5ea6 MoE \u7ed3\u6784\u3001\u65e0\u8f85\u52a9\u635f\u5931\u7684\u8d1f\u8f7d\u5747\u8861\u65b9\u6cd5\u548c\u4e13\u7528 MoE \u63a8\u7406\u6838\uff0c\u4ee5\u63d0\u5347\u5bb9\u91cf\u540c\u65f6\u63a7\u5236\u5ef6\u8fdf\u3002MoE-ViE \u5728\u56fe\u50cf\u4e0e\u89c6\u9891\u7406\u89e3\u4e0a\u6301\u7eed\u4f18\u4e8e\u540c\u89c4\u6a21\u7a20\u5bc6\u6a21\u578b\uff0c\u6700\u5927\u6a21\u578b\u4ee5\u66f4\u4f4e\u5ef6\u8fdf\u5339\u914d\u66f4\u5927 SOTA \u7f16\u7801\u5668\uff0c\u5e76\u5728\u63a5\u5165 LLM \u540e\u8d85\u8fc7\u591a\u79cd\u56fe\u50cf/\u89c6\u9891\u57fa\u51c6\u4e0a\u7684\u5bf9\u6bd4\u7f16\u7801\u5668\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17402", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u7f16\u7801\u5668", "\u6df7\u5408\u4e13\u5bb6", "\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17402v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MoE-ViE: Mixture of Experts Vision Encoder for Efficient Image and Video Understanding", "tldr": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u7528\u4e8e CLIP \u98ce\u683c\u89c6\u89c9\u7f16\u7801\u5668\u6269\u5c55\u7684 MoE \u8bbe\u8ba1\uff0c\u63d0\u51fa\u7ec6\u7c92\u5ea6 MoE \u7ed3\u6784\u3001\u65e0\u8f85\u52a9\u635f\u5931\u7684\u8d1f\u8f7d\u5747\u8861\u65b9\u6cd5\u548c\u4e13\u7528 MoE \u63a8\u7406\u6838\uff0c\u4ee5\u63d0\u5347\u5bb9\u91cf\u540c\u65f6\u63a7\u5236\u5ef6\u8fdf\u3002MoE-ViE \u5728\u56fe\u50cf\u4e0e\u89c6\u9891\u7406\u89e3\u4e0a\u6301\u7eed\u4f18\u4e8e\u540c\u89c4\u6a21\u7a20\u5bc6\u6a21\u578b\uff0c\u6700\u5927\u6a21\u578b\u4ee5\u66f4\u4f4e\u5ef6\u8fdf\u5339\u914d\u66f4\u5927 SOTA \u7f16\u7801\u5668\uff0c\u5e76\u5728\u63a5\u5165 LLM \u540e\u8d85\u8fc7\u591a\u79cd\u56fe\u50cf/\u89c6\u9891\u57fa\u51c6\u4e0a\u7684\u5bf9\u6bd4\u7f16\u7801\u5668\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-sequence 3D reconstruction from RGB videos requires both accurate local geometry and globally consistent camera motion. Feed-forward models provide strong depth and pose predictions, but their memory cost prevents joint inference over long sequences. Chunk-wise processing improves scalability, yet independently predicted chunks often exhibit scale drift, pose errors, and point-cloud misalignment. We present GeoWeaver, a unified framework comprising a Geometric Prior Model (GPM) and Test-Time Adaptation (TTA). The GPM predicts chunk-wise depth, confidence, and camera parameters as adjustable geometric priors. TTA then performs sequential initialization, global chunk-level Sim(3) alignment, and coarse-to-fine refinement of camera poses, affine depth corrections, and intrinsics. Dense correspondences provide adjacent, cross-chunk, and long-range constraints, while a robust CDF-style objective jointly optimizes weighted 2D reprojection and 3D consistency residuals. This design preserves local geometric accuracy while correcting accumulated pose, scale, depth, and calibration errors. Experiments across diverse long-sequence benchmarks demonstrate improved camera accuracy, global consistency, and point-cloud quality. Ablations verify the contribution of each adaptation stage, and applying the same TTA procedure to different geometric prior models consistently improves their trajectory estimates, demonstrating that GeoWeaver is not tied to a specific GPM.", "arxiv_id": "2608.17389", "arxiv_url": "https://arxiv.org/abs/2608.17389", "authors": ["Tinghao Jiang", "Sheng Tang", "Shengzhe Wei", "Juntong Fang", "Weiqi Zhang", "Junsheng Zhou", "Zesong Li"], "brief": "GeoWeaver \u9762\u5411\u957f\u5e8f\u5217 RGB \u89c6\u9891\u4e09\u7ef4\u91cd\u5efa\uff0c\u5148\u7528\u51e0\u4f55\u5148\u9a8c\u6a21\u578b\u5206\u5757\u9884\u6d4b\u6df1\u5ea6\u3001\u7f6e\u4fe1\u5ea6\u548c\u76f8\u673a\u53c2\u6570\uff0c\u518d\u901a\u8fc7\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\u8fdb\u884c\u5168\u5c40 Sim(3) \u5bf9\u9f50\u4e0e\u7c97\u5230\u7ec6\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u80fd\u7f13\u89e3\u5206\u5757\u5e26\u6765\u7684\u5c3a\u5ea6\u6f02\u79fb\u3001\u4f4d\u59ff\u8bef\u5dee\u548c\u70b9\u4e91\u9519\u4f4d\uff0c\u5728\u591a\u4e2a\u957f\u5e8f\u5217\u57fa\u51c6\u4e0a\u63d0\u5347\u76f8\u673a\u7cbe\u5ea6\u3001\u5168\u5c40\u4e00\u81f4\u6027\u548c\u70b9\u4e91\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17389", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u76f8\u673a\u4f4d\u59ff", "\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94", "\u51e0\u4f55\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17389v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GeoWeaver: Accurate Long-Sequence 3D Reconstruction via Hierarchical Geometric Assembly", "tldr": "GeoWeaver \u9762\u5411\u957f\u5e8f\u5217 RGB \u89c6\u9891\u4e09\u7ef4\u91cd\u5efa\uff0c\u5148\u7528\u51e0\u4f55\u5148\u9a8c\u6a21\u578b\u5206\u5757\u9884\u6d4b\u6df1\u5ea6\u3001\u7f6e\u4fe1\u5ea6\u548c\u76f8\u673a\u53c2\u6570\uff0c\u518d\u901a\u8fc7\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\u8fdb\u884c\u5168\u5c40 Sim(3) \u5bf9\u9f50\u4e0e\u7c97\u5230\u7ec6\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u80fd\u7f13\u89e3\u5206\u5757\u5e26\u6765\u7684\u5c3a\u5ea6\u6f02\u79fb\u3001\u4f4d\u59ff\u8bef\u5dee\u548c\u70b9\u4e91\u9519\u4f4d\uff0c\u5728\u591a\u4e2a\u957f\u5e8f\u5217\u57fa\u51c6\u4e0a\u63d0\u5347\u76f8\u673a\u7cbe\u5ea6\u3001\u5168\u5c40\u4e00\u81f4\u6027\u548c\u70b9\u4e91\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language navigation agents are often evaluated on their ability to follow route-like instructions toward a fixed goal. Yet, real navigation instructions often depend on observed states of the environment: if a condition holds, then follow one path, otherwise take another. Such instructions require an agent to evaluate scene evidence, select the correct logical branch, and execute the corresponding navigation behavior. Existing evaluations provide limited control over conditional branch execution, making it difficult to determine whether agents fail because of perception, grounding, navigation, or logical decision-making. We introduce CondVLN, a scene-graph-grounded benchmark for diagnosing conditional branching in vision-language navigation. CondVLN programmatically generates instructions whose branch conditions are grounded in verifiable 3D scene-graph predicates, with controlled variation in branch depth, dependency chain length, spatial composition, evidence observability, and instruction horizon. CondVLN contains over 11,500 generated conditional instructions across AI2-THOR, Matterport3D, Gibson, and ReplicaCAD, and evaluates agents using standard VLN metrics and branch-specific diagnostics: Branch Selection Accuracy and Conditional Success Rate. Evaluating four state-of-the-art VLN agents (VLN-Zero, NaVid, NaVILA, and Open-Nav) shows that conditional branching exposes failures that are not captured by standard success rate or path length alone: agents can navigate plausibly while committing to a branch inconsistent with the observed scene condition. We also present a lightweight neurosymbolic branch-selection model that separates condition grounding from navigation execution, improving performance by 2x. CondVLN provides a reusable testbed for measuring whether embodied agents can not only follow instructions, but follow the right instruction under the right condition.", "arxiv_id": "2608.17318", "arxiv_url": "https://arxiv.org/abs/2608.17318", "authors": ["Seoyoung Lee", "Neel P. Bhatt", "Pranay Samineni", "Cong Liu", "S P Sharan", "Timothy Barclay", "Gregory M. Wagner", "Daniel Milan", "Sandeep Chinchali", "Ufuk Topcu", "Atlas Wang"], "brief": "\u672c\u6587\u63d0\u51fa CondVLN\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u7684\u6761\u4ef6\u5206\u652f\u8bca\u65ad\u57fa\u51c6\uff0c\u7528\u53ef\u9a8c\u8bc1\u7684 3D \u573a\u666f\u56fe\u8c13\u8bcd\u81ea\u52a8\u751f\u6210\u201c\u5982\u679c\u2026\u5426\u5219\u2026\u201d\u5bfc\u822a\u6307\u4ee4\uff0c\u5e76\u63a7\u5236\u5206\u652f\u6df1\u5ea6\u3001\u4f9d\u8d56\u94fe\u3001\u7a7a\u95f4\u7ec4\u5408\u548c\u53ef\u89c2\u6d4b\u6027\u7b49\u56e0\u7d20\u3002\u5bf9\u591a\u79cd\u73b0\u6709 VLN \u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u6807\u51c6\u6210\u529f\u7387\u96be\u4ee5\u53d1\u73b0\u5206\u652f\u9009\u62e9\u9519\u8bef\uff1b\u4e00\u4e2a\u8f7b\u91cf\u795e\u7ecf\u7b26\u53f7\u5206\u652f\u9009\u62e9\u6a21\u578b\u901a\u8fc7\u5206\u79bb\u6761\u4ef6 grounding \u4e0e\u5bfc\u822a\u6267\u884c\uff0c\u5c06\u6027\u80fd\u63d0\u5347\u7ea6 2 \u500d\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17318", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u5177\u8eab\u667a\u80fd", "\u795e\u7ecf\u7b26\u53f7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17318v1", "published_at": "2026-08-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "If, Then, Otherwise: Diagnosing Conditional Branching in Vision-Language Navigation", "tldr": "\u672c\u6587\u63d0\u51fa CondVLN\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u7684\u6761\u4ef6\u5206\u652f\u8bca\u65ad\u57fa\u51c6\uff0c\u7528\u53ef\u9a8c\u8bc1\u7684 3D \u573a\u666f\u56fe\u8c13\u8bcd\u81ea\u52a8\u751f\u6210\u201c\u5982\u679c\u2026\u5426\u5219\u2026\u201d\u5bfc\u822a\u6307\u4ee4\uff0c\u5e76\u63a7\u5236\u5206\u652f\u6df1\u5ea6\u3001\u4f9d\u8d56\u94fe\u3001\u7a7a\u95f4\u7ec4\u5408\u548c\u53ef\u89c2\u6d4b\u6027\u7b49\u56e0\u7d20\u3002\u5bf9\u591a\u79cd\u73b0\u6709 VLN \u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u6807\u51c6\u6210\u529f\u7387\u96be\u4ee5\u53d1\u73b0\u5206\u652f\u9009\u62e9\u9519\u8bef\uff1b\u4e00\u4e2a\u8f7b\u91cf\u795e\u7ecf\u7b26\u53f7\u5206\u652f\u9009\u62e9\u6a21\u578b\u901a\u8fc7\u5206\u79bb\u6761\u4ef6 grounding \u4e0e\u5bfc\u822a\u6267\u884c\uff0c\u5c06\u6027\u80fd\u63d0\u5347\u7ea6 2 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
