its heavyweight backpropagation-based training stack makes it impractical to fine-tune larger LLMs, and longer-horizon trajectories make credit assignment in RL substantially harder. This paper argues that evolution strategies (ES) can be a better choice for fine-tuning long-horizon LLM agents. Compared with agentic RL, ES offers three key advantages: 1) Model Scalability: ES enables full-parameter optimization with only minimal, inference-level GPU memory, making it possible to fine-tune large LLMs. 2) Flexibility: its lightweight, black-box feedback interface makes ES fine-tuning easy to compose with prompt-space evolution (e.g., skill optimization \u0026 test-time compute); and 3) Long-Horizon Scalability: ES performs trajectory-level parameter attribution without decomposing rewards across horizons, yielding better scalability than Agentic RL as the horizon length grows. Based on this insight, we propose Agentic ESOpt, a full-parameter agentic fine-tuning framework tailored to flexible parameter--context co-evolution. At each step, Agentic ESOpt samples perturbations around the current LLM parameters, evaluates the resulting agents with rewards, and applies an online reward-weighted update. To improve the exploration--adaptation trade-off, Agentic ESOpt further introduces a cosine decay schedule of the perturbation scale $\u03c3$. On WebArena-Lite, full-parameter optimization of Qwen-3.5-27B improves the No Skill baseline by 6.69%. In test-time automatic heuristic design, Agentic ESOpt performs online prompt--parameter co-evolution, improving its matched baseline in 28 of 36 settings.", "arxiv_id": "2608.17310", "arxiv_url": "https://arxiv.org/abs/2608.17310", "authors": ["Zhi Zheng", "Rongsheng Chen", "Yunpeng Ba", "Zhenkun Wang", "Yee Whye Teh", "Wee Sun Lee"], "brief": "\u8bba\u6587\u63d0\u51fa Agentic ESOpt\uff0c\u7528\u8fdb\u5316\u7b56\u7565\u66ff\u4ee3\u4f20\u7edf\u5f3a\u5316\u5b66\u4e60\u6765\u5fae\u8c03\u957f\u7a0b LLM \u667a\u80fd\u4f53\u3002\u5b83\u901a\u8fc7\u53c2\u6570\u6270\u52a8\u3001\u8f68\u8ff9\u7ea7\u5956\u52b1\u8bc4\u4f30\u548c\u5728\u7ebf\u5956\u52b1\u52a0\u6743\u66f4\u65b0\uff0c\u5b9e\u73b0\u4f4e\u663e\u5b58\u7684\u5168\u53c2\u6570\u4f18\u5316\uff0c\u5e76\u652f\u6301\u63d0\u793a\u8bcd\u4e0e\u53c2\u6570\u534f\u540c\u8fdb\u5316\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/zz1358m/Agentic-ESOpt", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.17310", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u76f8\u6bd4\u57fa\u4e8e\u53cd\u5411\u4f20\u64ad\u7684 Agentic RL\uff0cES \u53ea\u9700\u63a5\u8fd1\u63a8\u7406\u7ea7 GPU \u663e\u5b58\uff0c\u53ef\u5bf9\u66f4\u5927 LLM \u8fdb\u884c\u5168\u53c2\u6570\u5fae\u8c03\u3002", "\u91c7\u7528\u9ed1\u76d2\u8f68\u8ff9\u7ea7\u5956\u52b1\u5f52\u56e0\uff0c\u907f\u514d\u957f\u7a0b\u4efb\u52a1\u4e2d\u9010\u6b65\u4fe1\u7528\u5206\u914d\u56f0\u96be\uff0c\u66f4\u9002\u5408\u7a00\u758f\u5956\u52b1\u548c\u957f\u4ea4\u4e92\u94fe\u8def\u3002", "\u5728 WebArena-Lite \u4e0a\uff0cQwen-3.5-27B \u5168\u53c2\u6570\u4f18\u5316\u8f83 No Skill \u57fa\u7ebf\u63d0\u5347 6.69%\uff1b\u5728\u6d4b\u8bd5\u65f6\u542f\u53d1\u5f0f\u8bbe\u8ba1\u4e2d\uff0c36 \u4e2a\u8bbe\u7f6e\u91cc\u6709 28 \u4e2a\u4f18\u4e8e\u5339\u914d\u57fa\u7ebf\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8fdb\u5316\u7b56\u7565", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 1, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2608.17310v1", "published_at": "2026-08-18", "score": 0.66, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.17310.png", "title": "Agentic ESOpt: Fine-Tuning Long-Horizon LLM Agents with Minimal GPU Requirements", "tldr": "\u7528\u8fdb\u5316\u7b56\u7565\u4f4e\u663e\u5b58\u5fae\u8c03\u957f\u7a0bLLM\u667a\u80fd\u4f53", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agentic ESOpt\uff0c\u7528\u8fdb\u5316\u7b56\u7565\u66ff\u4ee3\u4f20\u7edf\u5f3a\u5316\u5b66\u4e60\u6765\u5fae\u8c03\u957f\u7a0b LLM \u667a\u80fd\u4f53\u3002\u5b83\u901a\u8fc7\u53c2\u6570\u6270\u52a8\u3001\u8f68\u8ff9\u7ea7\u5956\u52b1\u8bc4\u4f30\u548c\u5728\u7ebf\u5956\u52b1\u52a0\u6743\u66f4\u65b0\uff0c\u5b9e\u73b0\u4f4e\u663e\u5b58\u7684\u5168\u53c2\u6570\u4f18\u5316\uff0c\u5e76\u652f\u6301\u63d0\u793a\u8bcd\u4e0e\u53c2\u6570\u534f\u540c\u8fdb\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u957f\u7a0b LLM \u667a\u80fd\u4f53\u8bad\u7ec3\u63d0\u4f9b\u4e86\u4e00\u4e2a\u6bd4 RL \u66f4\u8f7b\u91cf\u3001\u53ef\u6269\u5c55\u7684\u66ff\u4ee3\u8def\u7ebf\uff0c\u5c24\u5176\u9002\u5408\u663e\u5b58\u53d7\u9650\u4f46\u9700\u8981\u4f18\u5316\u5927\u6a21\u578b\u5168\u53c2\u6570\u548c\u590d\u6742\u4ea4\u4e92\u7b56\u7565\u7684\u573a\u666f\u3002"}, {"abstract": "As large language models become increasingly widespread, third-party providers that deploy open-weight models have become an important part of the ecosystem. Auditing the quality of their inference APIs is therefore an open problem. We formalize hosted model routing as a stochastic process and propose \\mbox{\\textbf{Ventor-QTest}}, a composite black-box audit that requires no probability information from the target API. Its repeated-request component sends each frozen constrained context to the target multiple times, reconstructs a categorical output distribution from the returned text counts, and reports \\emph{average fidelity loss} (AFL) as a null-bias-corrected, within-window mean coarsened-KL statistic. Its long-sequence component uses independent runs to report \\emph{extreme fidelity loss} (EFL) through the empirical upper tail of a run-level reference-centered-surprisal statistic. Across three logprob-capable route conditions, AFL shows strong linear descriptive agreement with a logprob-derived coarsened-KL comparator. Across seven route snapshots, 20-run sequence probes reveal route-specific EFL variation. AFL and EFL have little detectable route-level association with GPQA-Diamond accuracy. In contrast, pronounced EFL coincides with a decline in Terminal-Bench pass rate as task exposure increases. This pattern may arise because correctness in long-horizon tasks is more sensitive to extreme fidelity loss. These results motivate reporting AFL and EFL jointly, particularly when auditing long-horizon agentic tasks. The open-source implementation is available at https://github.com/Tencent/AI-Infra-Guard/tree/main/services/api_checker/ventor_qtest.", "arxiv_id": "2608.16391", "arxiv_url": "https://arxiv.org/abs/2608.16391", "authors": ["Xiangfan Wu", "Zonghao Ying", "Huiyu Wu", "Xing Zheng", "Huangsheng Cheng", "Xiaorong Shi", "Jing Guo"], "brief": "\u8bba\u6587\u63d0\u51fa Ventor-QTest\uff0c\u4e00\u79cd\u9762\u5411\u5a01\u80c1\u6a21\u578b\u7684\u9ed1\u76d2\u5ba1\u8ba1\u65b9\u6cd5\uff0c\u7528\u4e8e\u9a8c\u8bc1\u7b2c\u4e09\u65b9\u6258\u7ba1\u5f00\u6e90\u6743\u91cd LLM API \u7684\u63a8\u7406\u8def\u7531\u4e0e\u8f93\u51fa\u4fdd\u771f\u5ea6\u3002\u5b83\u901a\u8fc7\u91cd\u590d\u8bf7\u6c42\u548c\u957f\u5e8f\u5217\u63a2\u6d4b\uff0c\u5206\u522b\u5ea6\u91cf\u5e73\u5747\u4fdd\u771f\u635f\u5931 AFL \u4e0e\u6781\u7aef\u4fdd\u771f\u635f\u5931 EFL\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16391", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6258\u7ba1\u6a21\u578b\u8def\u7531\u5f62\u5f0f\u5316\u4e3a\u968f\u673a\u8fc7\u7a0b\uff0c\u65e0\u9700\u76ee\u6807 API \u63d0\u4f9b\u6982\u7387\u6216 logprob \u4fe1\u606f\u5373\u53ef\u5ba1\u8ba1\u3002", "AFL \u57fa\u4e8e\u91cd\u590d\u8bf7\u6c42\u91cd\u5efa\u7c7b\u522b\u8f93\u51fa\u5206\u5e03\uff0c\u5e76\u7528\u6821\u6b63\u540e\u7684 coarsened-KL \u7edf\u8ba1\u91cf\u8861\u91cf\u5e73\u5747\u504f\u79bb\u3002", "EFL \u901a\u8fc7\u591a\u6b21\u72ec\u w an agent should allocate limited computation to maximize expected value. Most reasoning and agent benchmarks use independent per-task budgets; existing shared-budget studies do not calibrate suite performance against the same model\u0027s demonstrated single-problem competence. We introduce $R^3$-Bench, which evaluates six-problem suites under shared budgets across mathematics, competitive programming, and abstract reasoning in tool-free and agentic settings. Matched single-problem response curves define an offline empirical oracle over observed successes. Across 72 main-table cells for six models, the oracle mean matches or exceeds the contest mean in all cells and is strictly higher in 71. Under moderate tool-free pressure, equal-allocation replay also exceeds contest performance for four of six models. Trajectory diagnostics reveal limited strategy updating and pressure-dependent failure patterns. In a three-model diagnostic under strong agentic pressure, at least one fixed scheduler exceeds the contest mean in six of nine cells, but no policy dominates across domains. These results expose a persistent gap between demonstrated competence and shared-budget realization.", "arxiv_id": "2608.16033", "arxiv_url": "https://arxiv.org/abs/2608.16033", "authors": ["Peisong Wang", "Zhiwei Ma", "Bowen Liu", "Feixue Liu", "Aochuan Chen", "Chenyi Zi", "Hongchuan Zeng", "Yuhan Li", "Jia Li"], "brief": "\u8bba\u6587\u63d0\u51fa R\u00b3-Bench\uff0c\u7528\u5171\u4eab\u8ba1\u7b97\u9884\u7b97\u8bc4\u4f30 LLM \u5728\u6570\u5b66\u3001\u7ade\u8d5b\u7f16\u7a0b\u548c\u62bd\u8c61\u63a8\u7406\u516d\u9898\u5957\u4ef6\u4e2d\u7684\u8d44\u6e90\u7406\u6027\u8868\u73b0\u3002\u5b83\u7528\u540c\u4e00\u6a21\u578b\u7684\u5355\u9898\u54cd\u5e94\u66f2\u7ebf\u6784\u5efa\u7ecf\u9a8c oracle\uff0c\u5bf9\u6bd4\u6a21\u578b\u5728\u6709\u9650\u603b\u9884\u7b97\u4e0b\u7684\u771f\u5b9e\u7b56\u7565\u6548\u679c\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/NineAbyss/R-3-Bench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.16033", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6\u5de5\u5177\u65e0\u5173\u4e0e\u667a\u80fd\u4f53\u4e24\u79cd\u8bbe\u7f6e\uff0c\u8bc4\u4f30\u516d\u4e2a\u6a21\u578b\u5728\u5171\u4eab\u9884\u7b97\u4e0b\u7684\u591a\u9898\u63a8\u7406\u8868\u73b0", "72 \u4e2a\u4e3b\u8868\u5b9e\u9a8c\u5355\u5143\u4e2d\uff0c\u7ecf\u9a8c oracle \u5728\u5168\u90e8\u5355\u5143\u4e0d\u4f4e\u4e8e\u771f\u5b9e\u7ade\u8d5b\u5747\u503c\uff0c\u5e76\u5728 71 \u4e2a\u5355\u5143\u4e25\u683c\u66f4\u9ad8", "\u8bca\u65ad\u53d1\u73b0\u6a21\u578b\u7b56\u7565\u66f4\u65b0\u6709\u9650\uff0c\u4e14\u4e0d\u540c\u538b\u529b\u6c34\u5e73\u4e0b\u5448\u73b0\u4e0d\u540c\u5931\u8d25\u6a21\u5f0f\uff1b\u56fa\u5b9a\u8c03\u5ea6\u5668\u6709\u65f6\u4f18\u4e8e\u6a21\u578b\u81ea\u8eab\u7b56\u7565"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u63a8\u7406\u8bc4\u6d4b", "\u8d44\u6e90\u5206\u914d"], "num_comments": 2, "on_hf": true, "organization": "Data Science \u0026 Artificial Intelligence Lab at HKUST", "pdf_url": "https://arxiv.org/pdf/2608.16033v1", "published_at": "2026-08-17", "score": 0.606, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16033.png", "title": "$R^3$-Bench: LLMs Struggle with Resource-Rational Reasoning under Shared Budgets", "tldr": "LLM\u5171\u4eab\u9884\u7b97\u63a8\u7406\u663e\u8457\u4f4e\u4e8e\u5355\u9898\u80fd\u529b\u4e0a\u9650", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa R\u00b3-Bench\uff0c\u7528\u5171\u4eab\u8ba1\u7b97\u9884\u7b97\u8bc4\u4f30 LLM \u5728\u6570\u5b66\u3001\u7ade\u8d5b\u7f16\u7a0b\u548c\u62bd\u8c61\u63a8\u7406\u516d\u9898\u5957\u4ef6\u4e2d\u7684\u8d44\u6e90\u7406\u6027\u8868\u73b0\u3002\u5b83\u7528\u540c\u4e00\u6a21\u578b\u7684\u5355\u9898\u54cd\u5e94\u66f2\u7ebf\u6784\u5efa\u7ecf\u9a8c oracle\uff0c\u5bf9\u6bd4\u6a21\u578b\u5728\u6709\u9650\u603b\u9884\u7b97\u4e0b\u7684\u771f\u5b9e\u7b56\u7565\u6548\u679c\u3002", "why_notable": "\u8be5\u57fa\u51c6\u63ed\u793a\u4e86 LLM \u5df2\u5177\u5907\u7684\u5355\u9898\u80fd\u529b\u4e0e\u5728\u5171\u4eab\u9884\u7b97\u573a\u666f\u4e2d\u5b9e\u9645\u53d1\u6325\u80fd\u529b\u4e4b\u95f4\u7684\u7cfb\u7edf\u6027\u5dee\u8ddd\uff0c\u5bf9\u8bc4\u4f30\u63a8\u7406\u6a21\u578b\u3001\u667a\u80fd\u4f53\u8c03\u5ea6\u548c\u8ba1\u7b97\u9884\u7b97\u5206\u914d\u5177\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "The current best bounds on the matrix multiplication exponent $\u03c9$ are obtained through a refinement of the laser method called combination loss analysis (Duan et al., 2022; Williams et al., 2024; Alman et al., 2025). In this note, we address the optimization problem at the core of this approach and propose several improvements. First, we reformulate the optimization problem allowing us to solve it in a larger setting than was previously possible. Second, we leverage recent advances in machine learning to design a new optimization algorithm for this problem. Finally, we refine the resulting optimization algorithm with AlphaEvolve. Our combined approach yields an upper bound of $\u03c9$ \u003c 2.371177, improving the previous best bound of 2.371339.", "arxiv_id": "2608.16884", "arxiv_url": "https://arxiv.org/abs/2608.16884", "authors": ["Emilien Dupont", "Marvin Eisenberger", "Borislav Kozlovskii", "Abbas Mehrabian", "Francisco J. R. Ruiz", "Abigail See", "Renfei Zhou", "Josh Alman", "Virginia Vassilevska Williams", "Matej Balog"], "brief": "\u8bba\u6587\u6539\u8fdb\u4e86\u7ec4\u5408\u635f\u5931\u5206\u6790\u4e2d\u7684\u6838\u5fc3\u4f18\u5316\u95ee\u9898\uff0c\u91cd\u65b0\u8868\u8ff0\u95ee\u9898\u4ee5\u652f\u6301\u66f4\u5927\u89c4\u6a21\u6c42\u89e3\uff0c\u5e76\u7ed3\u5408\u673a\u5668\u5b66\u4e60\u4f18\u5316\u7b97\u6cd5\u4e0e AlphaEvolve \u8fdb\u4e00\u6b65\u8c03\u4f18\u3002\u6700\u7e \u4ece 2.371339 \u964d\u81f3 2.371177\u3002", "why_notable": "\u77e9\u9635\u4e58\u6cd5\u6307\u6570\u662f\u7406\u8bba\u8ba1\u7b97\u673a\u79d1\u5b66\u4e2d\u7684\u6838\u5fc3\u5e38\u6570\uff0c\u4efb\u4f55\u6539\u8fdb\u90fd\u6781\u5177\u96be\u5ea6\uff1b\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u673a\u5668\u5b66\u4e60\u4e0e AlphaEvolve \u53ef\u8f85\u52a9\u63a8\u8fdb\u9ad8\u96be\u5ea6\u6570\u5b66\u4e0e\u7b97\u6cd5\u5206\u6790\u95ee\u9898\u3002"}, {"abstract": "Multimodal large language models increasingly use visual chain-of-thought (Visual CoT) to reason about spatial, temporal, and embodied environments. By generating intermediate reasoning images, Visual CoT provides an intuitive mechanism for visual foresight but introduces substantial inference overhead, which is particularly problematic for proactive video reasoning. We ask whether models can learn to think visually during training while reasoning directly at inference. We introduce Internalized Visual Thinking (IVT), a post-training framework that jointly optimizes textual prediction and next-embedding prediction over unlabeled videos. Given a partially observed video, IVT predicts latent representations of future frames together with the target textual answer, encouraging the model to capture motion, object transitions, interactions, and latent intent. At inference, IVT generates the answer directly without synthesizing or re-encoding future frames. We conduct controlled studies across target representations, decoder designs, prediction horizons, data mixtures, training curricula, and predictive objectives. IVT improves over direct-answer fine-tuning on all six evaluation settings while retaining the same inference pathway. Compared with explicit Visual CoT, IVT achieves comparable or better performance and reduces average end-to-end latency by more than 5x. Together, our findings suggest that explicit pixel-space generation at inference time, as used in visual chain-of-thought, may not be necessary for effective proactive video reasoning. Predictive world modeling can be internalized during training to produce multimodal reasoners that are both more accurate and substantially more efficient.", "arxiv_id": "2608.15869", "arxiv_url": "https://arxiv.org/abs/2608.15869", "authors": ["Xiaoyu Zhu", "Xinke Deng", "Suresh Taddewadikar", "Arnab Kumar Mondal", "Zhongyu Jiang", "Ian Fasel", "Joerg Liebelt"], "brief": "\u8bba\u6587\u63d0\u51fa Internalized Visual Thinking\uff08IVT\uff09\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u8ba9\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u8bad\u7ec3\u65f6\u9884\u6d4b\u672a\u6765\u5e27\u7684\u6f5c\u5728\u8868\u793a\u548c\u6587\u672c\u7b54\u6848\u3002\u63a8\u7406\u65f6\u65e0\u9700\u663e\u5f0f\u751f\u6210\u89c6\u89c9 CoT \u6216\u672a\u6765\u56fe\u50cf\uff0c\u76f4\u63a5\u8f93\u51fa\u7b54\u6848\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.15869", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["IVT \u5728\u672a\u6807\u6ce8\u89c6\u9891\u4e0a\u8054\u5408\u4f18\u5316\u6587\u672c\u9884\u6d4b\u4e0e next-embedding prediction\uff0c\u5b66\u4e60\u8fd0\u52a8\u3001\u7269\u4f53\u53d8\u5316\u3001\u4ea4\u4e92\u548c\u6f5c\u5728\u610f\u56fe\u3002", "\u7cfb\u7edf\u6bd4\u8f83\u4e86\u76ee\u6807\u8868\u793a\u3001\u89e3\u7801\u5668\u8bbe\u8ba1\u3001\u9884\u6d4b\u65f6\u57df\u3001\u6570\u636e\u6df7\u5408\u3001\u8bad\u7ec3\u8bfe\u7a0b\u548c\u9884\u6d4b\u76ee\u6807\u7b49\u56e0\u7d20\u3002", "\u5728\u516d\u7c7b\u8bc4\u6d4b\u4e2d\u5747\u4f18\u4e8e\u76f4\u63a5\u7b54\u6848\u5fae\u8c03\uff1b\u76f8\u6bd4\u663e\u5f0f Visual CoT\uff0c\u6027\u80fd\u76f8\u5f53\u6216\u66f4\u597d\uff0c\u540c\u65f6\u7aef\u5230\u7aef\u5ef6\u8fdf\u5e73\u5747\u964d\u4f4e\u8d85\u8fc75\u500d\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Apple", "pdf_url": "https:/ their product workflows and users, to identify real-world tasks for which AI has established practical demand across diverse professional domains. We translate these workflows into complete deliverable-oriented tasks and evaluate them with fine-grained rubrics capturing their complex requirements. Across representative models evaluated under a unified agent harness, even the strongest model successfully completes only approximately 30\\% of StartupBench, despite making substantial partial progress on many tasks. Further analysis identifies aspects like complex instruction following and domain-specific expertise as major sources of failure. Our results reveal that many market-validated workflows remain beyond the reliable capabilities of current general-purpose agents, establishing StartupBench as an empirical measure of progress toward E2E completions of real-world user tasks.", "arxiv_id": "2608.17800", "arxiv_url": "https://arxiv.org/abs/2608.17800", "authors": ["Liya Zhu", "Xin Ma", "Tao Liu", "Haodong Wang", "Ge Zhang", "Jingzhe Ding", "Qingshui Gu", "Yongjie Zhong", "Jinxiang Meng", "Yuan Gao", "Yunqiu Zhou", "Hao Zhu", "Jifeng He", "Yongzhi Liao", "Xinyi Zhang", "Chaoxin Li", "Yi Zhu", "Xi Lin", "Duju Zeng", "Xiang Gao", "Wen Zhang", "Yunyang Wang", "Duo Wang", "Huan Zhou", "Zuo Wang", "Jin Chen", "Kaiyuan Zhang", "Chuqian Yu", "Tianhao Yu", "Longxiang Liu", "Jianbo Xue", "Huimin Che", "Jiahao Wang", "Yujia Qin", "Jiaheng Liu", "Shen Yan", "Xiaolong Chang", "Wenhao Huang"], "brief": "\u8bba\u6587\u63d0\u51fa StartupBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5df2\u83b7\u5e02\u573a\u9a8c\u8bc1\u7684 AI \u521b\u4e1a\u4ea7\u54c1\u5de5\u4f5c\u6d41\u6784\u5efa\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u57fa\u51c6\u3002\u5b83\u5c06\u771f\u5b9e\u7528\u6237\u9700\u6c42\u8f6c\u5316\u4e3a\u53ef\u4ea4\u4ed8\u4efb\u52a1\uff0c\u5e76\u7528\u7ec6\u7c92\u5ea6\u8bc4\u5206\u6807\u51c6\u8bc4\u4f30\u901a\u7528\u667a\u80fd\u4f53\u7684\u5b8c\u6210\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17800", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4efb\u52a1\u6765\u6e90\u4e0d\u662f\u7814\u7a76\u8005\u9884\u8bbe\uff0c\u800c\u662f\u7cfb\u7edf\u5206\u6790\u5df2\u6709\u7528\u6237\u91c7\u7528\u7684 AI \u4ea7\u54c1\u3001\u5de5\u4f5c\u6d41\u548c\u76ee\u6807\u7528\u6237\uff0c\u5f3a\u8c03\u771f\u5b9e\u5e02\u573a\u9700\u6c42\u3002", "\u5728\u7edf\u4e00 agent harness \u4e0b\u8bc4\u6d4b\u4ee3\u8868\u6027\u6a21\u578b\uff0c\u6700\u5f3a\u6a21\u578b\u4e5f\u53ea\u80fd\u5b8c\u6574\u5b8c\u6210\u7ea6 30% \u7684\u4efb\u52a1\u3002", "\u5931\u8d25\u4e3b\u8981\u6765\u81ea\u590d\u6742\u6307\u4ee4\u9075\u5faa\u3001\u9886\u57df\u4e13\u4e1a\u77e5\u8bc6\u4e0d\u8db3\uff0c\u4ee5\u53ca\u7aef\u5230\u7aef\u4ea4\u4ed8\u4e2d\u591a\u7ea6\u675f\u534f\u8c03\u56f0\u96be\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u771f\u5b9e\u5de5\u4f5c\u6d41"], "num_comments": 0, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2608.17800v1", "published_at": "2026-08-18", "score": 0.456, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.17800.png", "title": "StartupBench: Benchmarking General-Purpose Agents on Market-Validated End-to-End Workflows", "tldr": "\u7528\u771f\u5b9e\u521b\u4e1a\u4ea7\u54c1\u5de5\u4f5c\u6d41\u8bc4\u6d4b\u901a\u7528\u667a\u80fd\u4f53\u3002", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa StartupBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5df2\u83b7\u5e02\u573a\u9a8c\u8bc1\u7684 AI \u521b\u4e1a\u4ea7\u54c1\u5de5\u4f5c\u6d41\u6784\u5efa\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u57fa\u51c6\u3002\u5b83\u5c06\u771f\u5b9e\u7528\u6237\u9700\u6c42\u8f6c\u5316\u4e3a\u53ef\u4ea4\u4ed8\u4efb\u52a1\uff0c\u5e76\u7528\u7ec6\u7c92\u5ea6\u8bc4\u5206\u6807\u51c6\u8bc4\u4f30\u901a\u7528\u667a\u80fd\u4f53\u7684\u5b8c\u6210\u80fd\u529b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u628a\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u5408\u6210\u6216\u7814\u7a76\u8005\u9009\u62e9\u4efb\u52a1\u63a8\u8fdb\u5230\u5e02\u573a\u9a8c\u8bc1\u7684\u771f\u5b9e\u5de5\u4f5c\u6d41\uff0c\u6709\u52a9\u4e8e\u66f4\u51c6\u786e\u8861\u91cf\u901a\u7528\u667a\u80fd\u4f53\u8ddd\u79bb\u5b9e\u9645\u53ef\u7528\u8fd8\u6709\u591a\u8fdc\uff0c\u5e76\u63ed\u793a\u5f53\u524d\u6a21\u578b\u5728\u7aef\u5230\u7aef\u4e13\u4e1a\u4efb\u52a1\u4e2d\u7684\u5173\u952e\u77ed\u677f\u3002"}, {"abstract": "AI has long assisted scientific research, but the rapid advance of LLMs and agentic scaffolds is reshaping the landscape; a single system can now carry whole-stage research from an initial hypothesis all the way to final published paper, which is a paradigm now referred to as AutoResearch. Existing evaluations reveal little about how these agents operate or where they break down. Tasks are narrowly-scoped, evaluation measures performance but not process, and failure diagnoses lack systematic coverage or artifact-level visibility. To address this gap, we introduce AutoResearchEval, featuring 100 tasks grounded in published frontier science across 7 scientific domains and the full research lifecycle, including ideation, retrieval, execution, analysis, writing, and review. Evaluating 8 harness-model combinations yields 800 autoresearch agent trajectories, with process-level annotation. We organize these insights into AutoResearch Failure Taxonomy or ARFT, a framework of 45 empirically-grounded failure patterns. To enable scalable fine-grained attribution, we leverage a human-calibrated agent-as-a-judge pipeline to inspect complete trajectories and intermediate artifacts. Failure patterns converge on a single overarching limitation, namely that current agents lack a metacognitive loop, which entails the ability to check what they produced against what they found, revise when it does not hold up, and question whether the path they took was sound. The same patterns recur across all 8 harness-model combinations, including the strongest models tested, locating the deficit at the model level rather than in any particular scaffold; whether orchestration-level interventions can close it is an open question this work does not test. We publicly release AutoResearchEval and ARFT to facilitate continued research and development in autonomous scientific discovery.", "arxiv_id": "2608.14905", "arxiv_url": "https://arxiv.org/abs/2608.14905", "authors": ["Yanlin Fei", "Nazhou Liu", "Xinmiao Yu", "Shaolong Chen", "Lei Li", "Rahul Thapa", "Madalina Ciobanu", "Qingqing Mao", "Ritankar Das"], "brief": "\u8bba\u6587\u63d0\u51fa AutoResearchEval\uff1a\u5305\u542b100\u4e2a\u6765\u81ea7\u4e2a\u79d1\u5b66\u9886\u57df\u3001\u8986\u76d6\u5b8c\u6574\u79d1\u7814\u751f\u547d\u5468\u671f\u7684\u771f\u5b9e\u524d\u6cbf\u7814\u7a76\u4efb\u52a1\u3002\u4f5c\u8005\u8bc4\u6d4b8\u79cd\u667a\u80fd\u4f53\u6846\u67b6-\u6a21\u578b\u7ec4\u5408\u7684800\u6761\u8f68\u8ff9\uff0c\u5e76\u6784\u5efa\u5305\u542b45\u7c7b\u5931\u8d25\u6a21\u5f0f\u7684 AutoResearch Failure Taxonomy\uff08ARFT\uff09\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14905", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4efb\u52a1\u8986\u76d6\u4ece\u9009\u9898\u3001\u68c0\u7d22\u3001\u5b9e\u9a8c\u6267\u884c\u3001\u5206\u6790\u3001\u5199\u4f5c\u5230\u8bc4\u5ba1\u7684\u7aef\u5230\u7aef AutoResearch \u6d41\u7a0b\uff0c\u800c\u975e\u5355\u4e00\u5b50\u4efb\u52a1\u8bc4\u6d4b\u3002", "\u901a\u8fc7\u4eba\u5de5\u6821\u51c6\u7684 agent-as-a-judge \u6d41\u6c34\u7ebf\uff0c\u5bf9\u5b8c\u6574\u8f68\u8ff9\u548c\u4e2d\u95f4\u4ea7\u7269\u8fdb\u884c\u7ec6\u7c92\u5ea6\u5f52\u56e0\u4e0e\u8fc7\u7a0b\u7ea7\u6807\u6ce8\u3002", "\u53d1\u73b0\u4e0d\u540c\u6a21\u578b\u4e0e\u6846\u67b6\u53cd\u590d\u51fa\u73b0\u76f8\u4f3c\u5931\u8d25\uff0c\u6838\u5fc3\u74f6\u9888\u662f\u7f3a\u4e4f\u201c\u5143\u8ba4\u77e5\u5faa\u73af\u201d\uff1a\u65e0\u6cd5\u6709\u6548\u6838\u5bf9\u4ea7\u51fa\u4e0e\u8bc1\u636e\u3001\u53d1\u73b0\u95ee\u9898\u540e\u4fee\u6b63\u3001\u53cd\u601d\u7814\u7a76\u8def\u5f84\u662f\u5426\u53ef\u9760\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u7814\u81ea\u52a8\u5316", "\u8bc4\u6d4b\u57fa\u51c6", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "Prentis AI", "pdf_url": "https://arxiv.org/pdf/2608.14905v1", "published_at": "2026-08-14", "score": 0.442, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14905.png", "title": "How Do Agents Fail on AutoResearch: End-to-End Diagnostic Evaluation on 100 Real-World Frontier Research Tasks", "tldr": "\u7cfb\u7edf\u8bca\u65ad\u79d1\u7814\u667a\u80fd\u4f53\u7684\u771f\u5b9e\u5931\u8d25\u6a21\u5f0f", "upvotes": 23, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoResearchEval\uff1a\u5305\u542b100\u4e2a\u6765\u81ea7\u4e2a\u79d1\u5b66\u9886\u57df\u3001\u8986\u76d6\u5b8c\u6574\u79d1\u7814\u751f\u547d\u5468\u671f\u7684\u771f\u5b9e\u524d\u6cbf\u7814\u7a76\u4efb\u52a1\u3002\u4f5c\u8005\u8bc4\u6d4b8\u79cd\u667a\u80fd\u4f53\u6846\u67b6-\u6a21\u578b\u7ec4\u5408\u7684800\u6761\u8f68\u8ff9\uff0c\u5e76\u6784\u5efa\u5305\u542b45\u7c7b\u5931\u8d25\u6a21\u5f0f\u7684 AutoResearch Failure Taxonomy\uff08ARFT\uff09\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u7ed3\u679c\u8bc4\u6d4b\u63a8\u8fdb\u5230\u8fc7\u7a0b\u8bca\u65ad\uff0c\u4e3a\u81ea\u4e3b\u79d1\u7814\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u771f\u5b9e\u4efb\u52a1\u57fa\u51c6\u548c\u7cfb\u7edf\u5316\u5931\u8d25\u5206\u7c7b\uff0c\u6709\u52a9\u4e8e\u5b9a\u4f4d\u5f53\u524d LLM \u667a\u80fd\u4f53\u5728\u79d1\u5b66\u53d1\u73b0\u4e2d\u7684\u6839\u672c\u77ed\u677f\u3002"}, {"abstract": "Video understanding is a fundamental task for evaluating the capabilities of multimodal large language models (MLLMs). However, existing leading models have already achieved approximately 90% accuracy on the Video-MME leaderboard, suggesting that conventional single-turn video understanding tasks are becoming increasingly saturated and insufficient for assessing the intelligence of advanced MLLMs. Towards this end, we introduce VideoGAIA, an agentic video understanding benchmark for general artificial intelligence (AI) assistants. Moving beyond one-shot video question answering, VideoGAIA formulates video understanding as a multi-turn, tool-augmented interaction process, where models must iteratively perceive videos, invoke external tools, gather complementary information, and integrate multimodal evidence across turns. VideoGAIA contains 271 model-human co-designed tasks covering diverse and complex real-world scenarios. Each video-question-answer instance is independently verified by three human experts to ensure both correctness and appropriate difficulty. All evaluated MLLMs, including frontier models such as GPT-5.5 and Kimi-K3, achieve less than 60% accuracy on VideoGAIA, highlighting its value as a high-quality and timely benchmark for evaluating next-generation MLLMs. We hope that VideoGAIA will facilitate the transition from conventional video understanding toward agentic video understanding.", "arxiv_id": "2608.14718", "arxiv_url": "https://arxiv.org/abs/2608.14718", "authors": ["Fan Zhang", "Guangming Yao", "Jinyang Wu", "Hao Wu", "Zheng Lian", "Xinyu Geng", "Jingdong Chen", "Yi Yuan", "Pheng-Ann Heng"], "brief": "\u8bba\u6587\u63d0\u51fa VideoGAIA\uff0c\u4e00\u4e2a\u9762\u5411\u901a\u7528 AI \u52a9\u624b\u7684\u667a\u80fd\u4f53\u5f0f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u3002\u5b83\u5c06\u89c6\u9891\u95ee\u7b54\u4ece\u5355\u8f6e\u56de\u7b54\u6269\u5c55\u4e3a\u591a\u8f6e\u3001\u5de5\u5177\u589e\u5f3a\u7684\u4ea4\u4e92\u8fc7\u7a0b\uff0c\u8981\u6c42\u6a21\u578b\u8c03\u7528\u5916\u90e8\u5de5\u5177\u5e76\u6574\u5408\u8de8\u8f6e\u591a\u6a21\u6001\u8bc1\u636e\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/zfkarl/VideoGAIA", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.14718", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b 271 \u4e2a\u7531\u6a21\u578b\u4e0e\u4eba\u7c7b\u5171\u540c\u8bbe\u8ba1\u7684\u590d\u6742\u771f\u5b9e\u573a\u666f\u4efb\u52a1", "\u6bcf\u4e2a\u89c6\u9891-\u95ee\u9898-\u7b54\u6848\u6837\u672c\u5747\u7531\u4e09\u540d\u4eba\u7c7b\u4e13\u5bb6\u72ec\u7acb\u9a8c\u8bc1\uff0c\u4fdd\u8bc1\u6b63\u786e\u6027\u4e0e\u96be\u5ea6", "GPT-5.5\u3001Kimi-K3 \u7b49\u524d\u6cbf MLLM \u5728\u8be5\u57fa\u51c6\u4e0a\u51c6\u786e\u7387\u5747\u4f4e\u4e8e 60%"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "The Chinese University of Hong Kong", "pdf_url": "https://arxiv.org/pdf/2608.14718v1", "published_at": "2026-08-12", "score": 0.434, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14718.png", "title": "VideoGAIA: A Benchmark for General AI Assistants on Agentic Video Understanding", "tldr": "\u9762\u5411\u667a\u80fd\u4f53\u5f0f\u89c6\u9891\u7406\u89e3\u7684\u65b0\u57fa\u51c6", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa VideoGAIA\uff0c\u4e00\u4e2a\u9762\u5411\u901a\u7528 AI \u52a9\u624b\u7684\u667a\u80fd\u4f53\u5f0f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u3002\u5b83\u5c06\u89c6\u9891\u95ee\u7b54\u4ece\u5355\u8f6e\u56de\u7b54\u6269\u5c55\u4e3a\u591a\u8f6e\u3001\u5de5\u5177\u589e\u5f3a\u7684\u4ea4\u4e92\u8fc7\u7a0b\uff0c\u8981\u6c42\u6a21\u578b\u8c03\u7528\u5916\u90e8\u5de5\u5177\u5e76\u6574\u5408\u8de8\u8f6e\u591a\u6a21\u6001\u8bc1\u636e\u3002", "why_notable": "\u73b0\u6709\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u5df2\u63a5\u8fd1\u9971\u548c\uff0cVideoGAIA \u8f6c\u5411\u66f4\u63a5\u8fd1\u771f\u5b9e\u52a9\u624b\u80fd\u529b\u7684\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u5f0f\u8bc4\u6d4b\uff0c\u6709\u52a9\u4e8e\u8861\u91cf\u4e0b\u4e00\u4ee3\u591a\u6a21\u6001\u6a21\u578b\u7684\u63a8\u7406\u3001\u4fe1\u606f\u6574\u5408\u4e0e\u667a\u80fd\u4f53\u80fd\u529b\u3002"}, {"abstract": "As AI datacenters retire functional GPUs, vast quantities of still capable accelerators enter secondary markets. This paper investigates whether these retired GPUs can find a productive afterlife to form a DumpsterCluster that can serve modern LLM inference, and under what conditions such repurposing is economically viable and environmentally sustainable. We physically built a 128-GPU DumpsterCluster from scratch using only second-hand components and ran it for one year. At current market prices (\\$22K for the DumpsterCluster vs. \\$600K for an 8-GPU B200 system), the economic advantages are substantial. Through pipeline-parallel optimizations, our V100 based DumpsterCluster achieves competitive LLaMA-70B throughput, validating production viability. However, our deployment reveals critical context dependencies. Older GPUs consume significantly more energy per token, making total cost of ownership favorable only in regions with inexpensive electricity. Under grid-average carbon intensity, second-hand systems can produce approximately 4x higher total carbon emissions per token for 8B models, and over 40x for 70B models, compared to current-generation hardware. These findings show that GPU afterlife is not universally sustainable - hardware repurposing must be strategically coupled with low carbon energy sources. When deployed in regions with favourable energy economics and clean electricity, second-hand GPUs offer a viable pathway for expanding AI capacity while advancing affordability, energy security, and environmental responsibility.", "arxiv_id": "2608.14614", "arxiv_url": "https://arxiv.org/abs/2608.14614", "authors": ["Zeyu Cao", "Xuan Guo", "Cheng Zhang", "Cheuk Hang Lau", "Ilia Shumailov", "Yiren Zhao"], "brief": "\u8bba\u6587\u4ece\u96f6\u642d\u5efa\u5e76\u8fd0\u884c\u4e86\u4e00\u5957\u7531128\u5757\u4e8c\u624bGPU\u7ec4\u6210\u7684 DumpsterCluster\uff0c\u8bc4\u4f30\u9000\u5f79GPU\u7528\u4e8e\u73b0\u4ee3\u5927\u6a21\u578b\u63a8\u7406\u7684\u53ef\u884c\u6027\u3001\u7ecf\u6d4e\u6027\u4e0e\u78b3\u6392\u653e\u5f71\u54cd\u3002\u901a\u8fc7\u6d41\u6c34\u7ebf\u5e76\u884c\u4f18\u5316\uff0c\u8be5V100\u96c6\u7fa4\u5728LLaMA-70B\u63a8\u7406\u4e0a\u8fbe\u5230\u6709\u7ade\u4e89\u529b\u7684\u541e\u5410\u8868\u73b0\u3002", "categories": ["cs.LG", "cs.AI", "cs.AR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14614", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5b9e\u6d4b\u90e8\u7f72\u4e00\u5e74\uff1a128-GPU\u4e8c\u624b\u96c6\u7fa4\u6210\u672c\u7ea62.2\u4e07\u7f8e\u5143\uff0c\u8fdc\u4f4e\u4e8e\u7ea660\u4e07\u7f8e\u5143\u76848-GPU B200\u7cfb\u7edf\u3002", "\u901a\u8fc7pipeline parallel\u4f18\u5316\uff0cV100\u96c6\u7fa4\u53ef\u652f\u6491LLaMA-70B\u751f\u4ea7\u7ea7\u63a8\u7406\u541e\u5410\uff0c\u8bc1\u660e\u65e7\u786c\u4ef6\u4ecd\u6709\u5b9e\u7528\u4ef7\u503c\u3002", "\u80fd\u8017\u4e0e\u78b3\u6392\u653e\u9ad8\u5ea6\u4f9d\u8d56\u7535\u4ef7\u548c\u7535\u7f51\u78b3\u5f3a\u5ea6\uff1a\u5728\u5e73\u5747\u7535\u7f51\u4e0b\uff0c\u4e8c\u624b\u7cfb\u7edf\u6bcftoken\u78b3\u6392\u53ef\u80fd\u663e\u8457\u9ad8\u4e8e\u65b0\u786c\u4ef6\u3002"], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "\u7cfb\u7edf\u4f18\u5316", "\u7eff\u8272AI", "\u786c\u4ef6\u590d\u7528"], "num_comments": 2, "on_hf": true, "organization": "University of Oxford", "pdf_url": "https://arxiv.org/pdf/2608.14614v1", "published_at": "2026-07-10", "score": 0.411, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Oxford", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14614.png", "title": "DumpsterCluster: From Dumpster Diving to Serving LLaMA-70B on $60 GPUs", "tldr": "\u4e8c\u624bV100\u96c6\u7fa4\u53ef\u4f4e\u6210\u672c\u670d\u52a1LLaMA-70B", "upvotes": 2, "what_it_is": "\u8bba\u6587\u4ece\u96f6\u642d\u5efa\u5e76\u8fd0\u884c\u4e86\u4e00\u5957\u7531128\u5757\u4e8c\u624bGPU\u7ec4\u6210\u7684 DumpsterCluster\uff0c\u8bc4\u4f30\u9000\u5f79GPU\u7528\u4e8e\u73b0\u4ee3\u5927\u6a21\u578b\u63a8\u7406\u7684\u53ef\u884c\u6027\u3001\u7ecf\u6d4e\u6027\u4e0e\u78b3\u6392\u653e\u5f71\u54cd\u3002\u901a\u8fc7\u6d41\u6c34\u7ebf\u5e76\u884c\u4f18\u5316\uff0c\u8be5V100\u96c6\u7fa4\u5728LLaMA-70B\u63a8\u7406\u4e0a\u8fbe\u5230\u6709\u7ade\u4e89\u529b\u7684\u541e\u5410\u8868\u73b0\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u7528\u771f\u5b9e\u5927\u89c4\u6a21\u90e8\u7f72\u800c\u975e\u6a21\u62df\uff0c\u7cfb\u7edf\u63ed\u793a\u4e86\u201c\u65e7GPU\u518d\u5229\u7528\u201d\u5728AI\u7b97\u529b\u6269\u5f20\u4e2d\u7684\u673a\u4f1a\u4e0e\u8fb9\u754c\uff1a\u5b83\u80fd\u663e\u8457\u964d\u4f4e\u8d44\u672c\u6210\u672c\uff0c\u4f46\u53ea\u6709\u5728\u4f4e\u7535\u4ef7\u3001\u4f4e\u78b3\u7535\u529b\u6761\u4ef6\u4e0b\u624d\u771f\u6b63\u5177\u5907\u7ecf\u6d4e\u548c\u73af\u5883\u53ef\u6301\u7eed\u6027\u3002"}, {"abstract": "Reliable uncertainty quantification (UQ) is essential for deploying large language model (LLM) agents in complex interactive environments. Existing UQ methods largely rely on local signals, such as token probabilities, predictive entropy, or per-step confidence, and therefore overlook the long-range dependencies through which errors accumulate across an execution trajectory. As a result, they may fail to identify agent failures whose causes originate several reasoning or interaction steps before the final answer. We propose RUPA (Relational Uncertainty Propagation for Agents), a trajectory-level UQ framework for LLM agents. RUPA represents an execution history as a directed trajectory graph in which reasoning states, tool interactions, and environment feedback are nodes connected by temporal and semantic dependency edges. It then propagates uncertainty over this graph to capture how execution risk accumulates and transfers across interaction steps. The propagated signal is combined with trajectory-level behavioral features and goal-alignment information to produce a confidence estimate for the full agent trajectory. We evaluate RUPA on representative agent benchmarks, including $\u03c4$-2, Terminal-Bench-2, and GAIA, using 6 open-source LLMs spanning multiple model families. Experimental results show that RUPA consistently outperforms existing UQ methods by providing more accurate uncertainty estimates, enabling earlier failure detection, and improving uncertainty-guided agent execution across diverse agent tasks. These results demonstrate that explicitly modeling relational dependency is crucial to reliable UQ for long-horizon LLM agents, providing a practical foundation for trustworthy agent execution.", "arxiv_id": "2608.16002", "arxiv_url": "https://arxiv.org/abs/2608.16002", "authors": ["Zhengzhao Ma. Boxi Cao", "Yaojie Lu", "Hongyu Lin", "Xianpei Han", "Le Sun"], "brief": "\u8bba\u6587\u63d0\u51fa RUPA\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8f68\u8ff9\u7ea7\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\u6846\u67b6\u3002\u5b83\u5c06\u63a8\u7406\u72b6\u6001\u3001\u5de5\u5177\u8c03\u7528\u548c\u73af\u5883\u53cd\u9988\u5efa\u6a21\u4e3a\u5e26\u6709\u65f6\u5e8f\u4e0e\u8bed\u4e49\u4f9d\u8d56\u7684\u6709\u5411\u8f68\u8ff9\u56fe\uff0c\u5e76\u5728\u56fe\u4e0a\u4f20\u64ad\u4e0d\u786e\u5b9a\u6027\u6765\u4f30\u8ba1\u6574\u6761\u6267\u884c\u8f68\u8ff9\u7684\u7f6e\u4fe1\u5ea6\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/icip-cas/RUPA", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.16002", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0d\u518d\u53ea\u4f9d\u8d56 token \u6982\u7387\u3001\u9884\u6d4b\u71b5\u6216\u5355\u6b65\u7f6e\u4fe1\u5ea6\u7b49\u5c40\u90e8\u4fe1\u53f7\uff0c\u800c\u662f\u663e\u5f0f\u5efa\u6a21\u957f\u7a0b\u4ea4\u4e92\u4e2d\u7684\u9519\u8bef\u7d2f\u79ef\u4e0e\u4f20\u64ad\u3002", "\u6784\u5efa\u6709\u5411\u8f68\u8ff9\u56fe\uff0c\u5c06\u63a8\u7406\u6b65\u9aa4\u3001\u5de5\u5177\u4ea4\u4e92\u3001\u73af\u5883\u53cd\u9988\u4f5c\u4e3a\u8282\u70b9\uff0c\u5e76\u7528\u65f6\u95f4\u8fb9\u548c\u8bed\u4e49\u4f9d\u8d56\u8fb9\u8fde\u63a5\u3002", "\u5728 \u03c4-2\u3001Terminal-Bench-2\u3001GAIA \u7b49\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\uff0c\u4f7f\u7528 6 \u4e2a\u5f00\u6e90 LLM \u9a8c\u8bc1\uff0cRUPA \u5728\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u3001\u65e9\u671f\u5931\u8d25\u68c0\u6d4b\u548c\u4e0d\u786e\u5b9a\u6027\u5f15\u5bfc\u6267\u884c\u65b9\u9762\u5747\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0d\u786e\u5b9a\u6027\u91cf\u5316", "\u56fe\u5efa\u6a21", "\u53ef\u4fe1AI"], "num_comments": 1, "on_hf": true, "organization": "ICIP", "pdf_url": "https://arxiv.org/pdf/2608.16002v1", "published_at": "2026-08-17", "score": 0.397, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16002.png", "title": "From Sequence to Structure: Relational Uncertainty Propagation for LLM Agents", "tldr": "\u7528\u8f68\u8ff9\u56fe\u4f20\u64ad\u4e0d\u786e\u5b9a\u6027\uff0c\u63d0\u5347\u957f\u7a0bLLM\u667a\u80fd\u4f53\u53ef\u9760\u6027", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa RUPA\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8f68\u8ff9\u7ea7\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\u6846\u67b6\u3002\u5b83\u5c06\u63a8\u7406\u72b6\u6001\u3001\u5de5\u5177\u8c03\u7528\u548c\u73af\u5883\u53cd\u9988\u5efa\u6a21\u4e3a\u5e26\u6709\u65f6\u5e8f\u4e0e\u8bed\u4e49\u4f9d\u8d56\u7684\u6709\u5411\u8f68\u8ff9\u56fe\uff0c\u5e76\u5728\u56fe\u4e0a\u4f20\u64ad\u4e0d\u786e\u5b9a\u6027\u6765\u4f30\u8ba1\u6574\u6761\u6267\u884c\u8f68\u8ff9\u7684\u7f6e\u4fe1\u5ea6\u3002", "why_notable": "\u957f\u7a0b\u667a\u80fd\u4f53\u5931\u8d25\u5f80\u5f80\u6e90\u4e8e\u65e9\u671f\u63a8\u7406\u6216\u4ea4\u4e92\u9519\u8bef\uff0c\u4f20\u7edf\u5c40\u90e8\u7f6e\u4fe1\u5ea6\u96be\u4ee5\u53ca\u65f6\u53d1\u73b0\uff1bRUPA \u901a\u8fc7\u5173\u7cfb\u4f9d\u8d56\u4f20\u64ad\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u8f68\u8ff9\u7ea7\u98ce\u9669\u8bc4\u4f30\uff0c\u5bf9\u63d0\u5347\u5de5\u5177\u4f7f\u7528\u3001\u7ec8\u7aef\u64cd\u4f5c\u548c\u590d\u6742\u4efb\u52a1\u667a\u80fd\u4f53\u7684\u53ef\u4fe1\u6267\u884c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Long-horizon agents can fail even when their underlying models can solve the constituent steps. They may lose track of mutable state, fail to reactivate lessons from earlier executions, skip known procedures, or stop prematurely. We bet on harness scaling to improve the execution system around an agent without changing its model weights. We introduce StateM, an agent-native runtime that organizes execution around durable states, phase-local context, checked transitions, recoverable runbooks, and versioned procedural practices that agents and users can inspect together. On Terminal-Bench 2.1, StateM raises GPT-5.5 xhigh to 92.1\\%, versus 83.1\\% reference and GPT-5.6 Sol Ultra at 91.9\\%. The runbook transfers unchanged to GPT-5.6. With GPT-5.6 Sol xhigh, StateM reaches 95.3\\% raw accuracy across 445 trials and succeeds on all 89 tasks at least once. The frozen profile raises GPT-5.6 Luna from 76.7 to 85.4\\%, above the 84.9\\% Sol xhigh reference. Using the same runtime, runbook structure, and golden rules, less than \\$38 of adaptation raises DeepSeek-V4 Flash from 82.7 to 88.1\\% under standard timeouts and to 89.1\\% on an 88-task common core. Extending only the remaining latency-sensitive task matches the reported 88.8\\% GPT-5.6 Sol max result. Final-score API usage is about \\$15 versus \\$574.68 for the GPT reference; total DeepSeek expenditure is \\$52.22. On BusinessBench, family-specific runbooks built on development sets yield held-out gains of 0.55 macro and 1.34 micro points; two mechanism-matched families improve by 10.04 points. Concrete rules generalize when tasks share execution structure, while the control methodology applies broadly. StateM turns selected postmortem findings into persistent, executable preconditions and practices, making learned controls explicit and enforceable through stateful controls. Code at github.com/henryqin1997/statem.", "arxiv_id": "2608.15089", "arxiv_url": "https://arxiv.org/abs/2608.15089", "authors": ["Ziheng Qin", "Yaxin Lu", "Zhangyang Atlas Wang", "Kai Wang"], "brief": "\u8bba\u6587\u63d0\u51fa StateM\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u7684\u8fd0\u884c\u65f6\u6846\u67b6\uff0c\u4e0d\u6539\u6a21\u578b\u6743\u91cd\uff0c\u800c\u901a\u8fc7\u6301\u4e45\u72b6\u6001\u3001\u9636\u6bb5\u4e0a\u4e0b\u6587\u3001\u53ef\u68c0\u67e5\u8f6c\u79fb\u548c\u53ef\u6062\u590d runbook \u6765\u589e\u5f3a\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u3002\u5728 Terminal-Bench 2.1 \u4e0a\uff0cStateM \u5c06\u591a\u79cd\u524d\u6cbf\u6a21\u578b\u548c\u5f00\u6e90/\u4f4e\u6210\u672c\u6a21\u578b\u7684\u8868\u73b0\u663e\u8457\u62c9\u9ad8\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/henryqin1997/statem", "github_stars": 49, "hf_url": "https://huggingface.co/papers/2608.15089", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728 Terminal-Bench 2.1 \u4e0a\uff0cGPT-5.6 Sol xhigh + StateM \u8fbe\u5230 95.3% raw accuracy\uff0c445 \u6b21\u8bd5\u9a8c\u8986\u76d6\u7684 89 \u4e2a\u4efb\u52a1\u5747\u81f3\u5c11\u6210\u529f\u4e00\u6b21\u3002", "\u540c\u4e00\u5957 runbook \u53ef\u8de8\u6a21\u578b\u8fc1\u79fb\uff1aGPT-5.5 xhigh \u4ece 83.1% \u63d0\u5347\u5230 92.1%\uff0cGPT-5.6 Luna \u4ece 76.7% \u63d0\u5347\u5230 85.4%\u3002", "DeepSeek-V4 Flash \u4ec5\u7528\u4e0d\u5230 38 \u7f8e\u5143\u9002\u914d\u6210\u672c\u4ece 82.7% \u63d0\u5347\u5230 88.1%\uff0c\u6700\u7ec8\u8bc4\u5206 API \u6210\u672c\u7ea6 15 \u7f8e\u5143\uff0c\u663e\u8457\u4f4e\u4e8e GPT \u53c2\u8003\u7684 574.68 \u7f8e\u5143\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7ec8\u7aef\u81ea\u52a8\u5316", "\u72b6\u6001\u7ba1\u7406", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15089v1", "published_at": "2026-08-15", "score": 0.373, "selected_reasons": ["HF trending (157\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15089.png", "title": "StateM: Reaching 95.3% Raw Accuracy, or a \\$15 Frontier Run, on Terminal-Bench 2.1 via Harness Scaling", "tldr": "StateM\u7528\u72b6\u6001\u5316\u8fd0\u884c\u65f6\u63d0\u5347\u7ec8\u7aef\u667a\u80fd\u4f53", "upvotes": 157, "what_it_is": "\u8bba\u6587\u63d0\u51fa StateM\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u7684\u8fd0\u884c\u65f6\u6846\u67b6\uff0c\u4e0d\u6539\u6a21\u578b\u6743\u91cd\uff0c\u800c\u901a\u8fc7\u6301\u4e45\u72b6\u6001\u3001\u9636\u6bb5\u4e0a\u4e0b\u6587\u3001\u53ef\u68c0\u67e5\u8f6c\u79fb\u548c\u53ef\u6062\u590d runbook \u6765\u589e\u5f3a\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u3002\u5728 Terminal-Bench 2.1 \u4e0a\uff0cStateM \u5c06\u591a\u79cd\u524d\u6cbf\u6a21\u578b\u548c\u5f00\u6e90/\u4f4e\u6210\u672c\u6a21\u578b\u7684\u8868\u73b0\u663e\u8457\u62c9\u9ad8\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u5f3a\u8c03\u201charness scaling\u201d\u800c\u975e\u7ee7\u7eed\u6269\u5927\u6a21\u578b\u672c\u8eab\uff0c\u5c55\u793a\u4e86\u901a\u8fc7\u72b6\u6001\u7ba1\u7406\u3001\u6d41\u7a0b\u7ea6\u675f\u548c\u53ef\u590d\u7528\u7ecf\u9a8c\u628a\u667a\u80fd\u4f53\u5931\u8d25\u6848\u4f8b\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u63a7\u5236\u89c4\u5219\u7684\u8def\u5f84\uff0c\u5bf9\u957f\u7a0b\u4efb\u52a1\u3001\u7ec8\u7aef\u81ea\u52a8\u5316\u548c\u4f4e\u6210\u672c\u667a\u80fd\u4f53\u90e8\u7f72\u90fd\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "We present MOSS-VL, an open vision-language model family that treats real-time interaction -- perceiving while it speaks -- as a first-class capability. It is co-designed across the stack: the language decoder attends to vision only through gated cross-attention, so the model can naturally see incoming frames while generating; a synthesized interaction corpus supervises when to speak, when to stay silent, and when to revise; and a staged curriculum concentrates all real-time-specific training in one light final stage over a strong offline foundation. Offline, MOSS-VL-Instruct is competitive at comparable scale and leads temporal-reasoning video sets. Across four streaming benchmarks, MOSS-VL-Realtime posts the best average on three (second on the fourth) among open-source streaming models, sweeping the three subsets that squarely test proactive behavior -- 66.0 vs. 37.5 for the best baseline on OmniMMI Proactive Alerting. With 11.3B parameters but visual tokens outside the decoded sequence, MOSS-VL widens its time-to-first-token advantage over same-backbone Qwen3-VL-8B from 2.8x to 5.1x as visual context grows. We release all five checkpoints, the training curriculum, and the real-time inference code at https://github.com/OpenMOSS/MOSS-VL.", "arxiv_id": "2608.15045", "arxiv_url": "https://arxiv.org/abs/2608.15045", "authors": ["Pengyu Wang", "Chenkun Tan", "Shaojun Zhou", "Qirui Zhou", "Yanxin Chen", "Xingyang He", "Huazheng Zeng", "Jijun Cheng", "Chenghao Wang", "Xiaomeng Qian", "Pengfei Wang", "Zhan Huang", "Shanqing Gao", "Wei Huang", "Longjun Cao", "Wu Ran", "Jie Liu", "Changtai Zhu", "Hongkai Wang", "Yixian Tian", "Chenghao Liu", "Zhen Ye", "Xinghao Wang", "Botian Jiang", "Guoguo Feng", "Zhaoye Fei", "Ruixiao Li", "Mingshu Chen", "Yang Gao", "Qinyuan Cheng", "Shimin Li", "Xipeng Qiu"], "brief": "MOSS-VL \u662f\u4e00\u7ec4\u5f00\u6e90\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u4e13\u95e8\u628a\u5b9e\u65f6\u4ea4\u4e92\u80fd\u529b\u4f5c\u4e3a\u6838\u5fc3\u8bbe\u8ba1\u76ee\u6807\uff0c\u8ba9\u6a21\u578b\u5728\u751f\u6210\u56de\u7b54\u65f6\u6301\u7eed\u611f\u77e5\u65b0\u89c6\u9891\u5e27\u3002\u8bba\u6587\u540c\u65f6\u53d1\u5e03\u79bb\u7ebf\u6307\u4ee4\u6a21\u578b\u3001\u5b9e\u65f6\u6a21\u578b\u3001\u8bad\u7ec3\u8bfe\u7a0b\u4e0e\u63a8\u7406\u4ee3\u7801\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/OpenMOSS/MOSS-VL", "github_stars": 436, "hf_url": "https://huggingface.co/papers/2608.15045", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u95e8\u63a7\u4ea4\u53c9\u6ce8\u610f\u529b\uff0c\u8ba9\u8bed\u8a00\u89e3\u7801\u5668\u4e0d\u628a\u89c6\u89c9 token \u653e\u5165\u751f\u6210\u5e8f\u5217\u4e2d\uff0c\u4e5f\u80fd\u5728\u751f\u6210\u65f6\u63a5\u6536\u65b0\u89c6\u89c9\u4fe1\u606f\u3002", "\u6784\u5efa\u5408\u6210\u4ea4\u4e92\u8bed\u6599\uff0c\u76d1\u7763\u6a21\u578b\u5b66\u4e60\u4f55\u65f6\u8bf4\u8bdd\u3001\u4f55\u65f6\u4fdd\u6301\u6c89\u9ed8\u3001\u4f55\u65f6\u6839\u636e\u65b0\u4fe1\u606f\u4fee\u6b63\u56de\u7b54\u3002", "\u5728\u56db\u4e2a\u6d41\u5f0f\u57fa\u51c6\u4e2d\u8868\u73b0\u9886\u5148\uff0cOmniMMI Proactive Alerting \u8fbe\u5230 66.0\uff0c\u663e\u8457\u9ad8\u4e8e\u6700\u4f73\u57fa\u7ebf 37.5\uff1b\u89c6\u89c9\u4e0a\u4e0b\u6587\u589e\u957f\u65f6\u9996 token \u5ef6\u8fdf\u4f18\u52bf\u6269\u5927\u5230 5.1 \u500d\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5b9e\u65f6\u4ea4\u4e92", "\u89c6\u9891\u7406\u89e3"], "num_comments": 2, "on_hf": true, "organization": "OpenMOSS", "pdf_url": "https://arxiv.org/pdf/2608.15045v1", "published_at": "2026-08-15", "score": 0.356, "selected_reasons": ["HF trending (39\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15045.png", "title": "MOSS-VL Technical Report", "tldr": "\u5f00\u6e90\u5b9e\u65f6\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u53ef\u8fb9\u8bf4\u8fb9\u770b", "upvotes": 39, "what_it_is": "MOSS-VL \u662f\u4e00\u7ec4\u5f00\u6e90\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u4e13\u95e8\u628a\u5b9e\u65f6\u4ea4\u4e92\u80fd\u529b\u4f5c\u4e3a\u6838\u5fc3\u8bbe\u8ba1\u76ee\u6807\uff0c\u8ba9\u6a21\u578b\u5728\u751f\u6210\u56de\u7b54\u65f6\u6301\u7eed\u611f\u77e5\u65b0\u89c6\u9891\u5e27\u3002\u8bba\u6587\u540c\u65f6\u53d1\u5e03\u79bb\u7ebf\u6307\u4ee4\u6a21\u578b\u3001\u5b9e\u65f6\u6a21\u578b\u3001\u8bad\u7ec3\u8bfe\u7a0b\u4e0e\u63a8\u7406\u4ee3\u7801\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4ece\u79bb\u7ebf\u95ee\u7b54\u63a8\u8fdb\u5230\u6d41\u5f0f\u3001\u4e3b\u52a8\u3001\u4f4e\u5ef6\u8fdf\u4ea4\u4e92\u573a\u666f\uff0c\u5e76\u5f00\u6e90\u591a\u7ec4\u68c0\u67e5\u70b9\u548c\u5b9e\u65f6\u63a8\u7406\u4ee3\u7801\uff0c\u5bf9\u89c6\u9891\u52a9\u624b\u3001\u5b9e\u65f6\u76d1\u63a7\u548c\u4ea4\u4e92\u5f0f\u591a\u6a21\u6001\u5e94\u7528\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Programmatic representations provide a compelling paradigm for 3D content creation, enabling fine-grained edits, interpretability, and explicit structural control. Yet, agentic workflows that rely on large language models (LLMs) to author 3D programs remain brittle, often failing to translate high-level intent into consistent low-level geometry. We attribute this fragility to a mismatch between existing programmatic interfaces and the reasoning strengths of LLMs, which favor semantic structure and spatial relations over fragile numeric choices. In this paper, we jointly design an Agent-centric Domain-Specific Language (aDSL) and a role-specialized multi-agent system to close this gap. aDSL bridges semantic logic and geometric constraints by emphasizing composability and spatial reasoning; it enables agents to manipulate geometry through relational operators instead of brittle absolute coordinates. Building on aDSL, our training-free multi-agent system follows a Plan-Execute-Critic loop to decompose requests, synthesize code, and iteratively repair errors and constraint violations using execution feedback. Experiments show that this co-design improves robustness, controllability, and faithfulness to user intent. Our method outperforms prior LLM-based baselines on text-to-shape and image-to-shape tasks while preserving explicit structure, editability, and interpretability. It also enables downstream applications such as articulated object creation and structured scene composition. Our code is available at https://github.com/sig-pku/aDSL.", "arxiv_id": "2608.17975", "arxiv_url": "https://arxiv.org/abs/2608.17975", "authors": ["Rui-Huan Wang", "Si-Tong Wei", "Jia-Qi He", "Heng-Yi Wei", "Baoquan Chen", "Peng-Shuai Wang"], "brief": "\u8bba\u6587\u8054\u5408\u8bbe\u8ba1\u4e86\u9762\u5411\u667a\u80fd\u4f53\u76843D\u9886\u57df\u4e13\u7528\u8bed\u8a00 aDSL \u4e0e\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u8ba9 LLM \u901a\u8fc7\u8bed\u4e49\u7ed3\u6784\u548c\u7a7a\u95f4\u5173\u7cfb\u800c\u975e\u7edd\u5bf9\u5750\u6807\u6765\u751f\u62103D\u7a0b\u5e8f\u3002\u7cfb\u7edf\u91c7\u7528 Plan-Execute-Critic \u5faa\u73af\uff0c\u81ea\u52a8\u5206\u89e3\u9700\u6c42\u3001\u751f\u6210\u4ee3\u7801\u5e76\u57fa\u4e8e\u6267\u884c\u53cd\u9988\u4fee\u590d\u9519\u8bef\u3002", "categories": ["cs.GR", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17975", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["aDSL \u5f3a\u8c03\u53ef\u7ec4\u5408\u6027\u4e0e\u7a7a\u95f4\u63a8\u7406\uff0c\u7528\u5173\u7cfb\u7b97\u5b50\u8868\u8fbe\u51e0\u4f55\u7ea6\u675f\uff0c\u964d\u4f4eLLM\u9009\u62e9\u8106\u5f31\u6570\u503c\u53c2\u6570\u7684\u96be\u5ea6", "\u65e0\u9700\u8bad\u7ec3\u7684\u89d2\u8272\u4e13\u95e8\u5316\u591a\u667a\u80fd\u4f53\u6846\u67b6\u901a\u8fc7\u89c4\u5212\u3001\u6267\u884c\u3001\u6279\u5224\u8fed\u4ee3\u63d0\u5347\u4ee3\u7801\u6b63\u786e\u6027\u548c\u7ea6\u675f\u6ee1\u8db3\u7387", "\u5728 text-to-shape \u4e0e image-to-shape \u4efb\u52a1\u4e0a\u4f18\u4e8e\u65e2\u6709LLM\u751f\u62103D\u7a0b\u5e8f\u57fa\u7ebf\uff0c\u5e76\u652f\u6301\u53ef\u7f16\u8f91\u7ed3\u6784\u3001\u5173\u8282\u7269\u4f53\u548c\u7ed3\u6784\u5316\u573a\u666f\u7ec4\u5408"], "keywords": ["\u667a\u80fd\u4f53", "3D\u751f\u6210", "\u7a0b\u5e8f\u751f\u6210", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17975v1", "published_at": "2026-08-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.17975.png", "title": "aDSL: Agentic 3D Creation via Joint Agent-Program Design", "tldr": "\u7528\u667a\u80fd\u4f53DSL\u63d0\u53473D\u7a0b\u5e8f\u5316\u751f\u6210\u7a33\u5b9a\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u8054\u5408\u8bbe\u8ba1\u4e86\u9762\u5411\u667a\u80fd\u4f53\u76843D\u9886\u57df\u4e13\u7528\u8bed\u8a00 aDSL \u4e0e\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u8ba9 LLM \u901a\u8fc7\u8bed\u4e49\u7ed3\u6784\u548c\u7a7a\u95f4\u5173\u7cfb\u800c\u975e\u7edd\u5bf9\u5750\u6807\u6765\u751f\u62103D\u7a0b\u5e8f\u3002\u7cfb\u7edf\u91c7\u7528 Plan-Execute-Critic \u5faa\u73af\uff0c\u81ea\u52a8\u5206\u89e3\u9700\u6c42\u3001\u751f\u6210\u4ee3\u7801\u5e76\u57fa\u4e8e\u6267\u884c\u53cd\u9988\u4fee\u590d\u9519\u8bef\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8bed\u8a00\u8bbe\u8ba1\u4e0e\u667a\u80fd\u4f53\u6d41\u7a0b\u534f\u540c\u4f18\u5316\uff0c\u9488\u5bf9LLM\u57283D\u51e0\u4f55\u7a0b\u5e8f\u751f\u6210\u4e2d\u7684\u6838\u5fc3\u77ed\u677f\u7ed9\u51fa\u7cfb\u7edf\u6027\u89e3\u51b3\u65b9\u6848\uff0c\u6709\u671b\u63d0\u5347\u53ef\u63a7\u3001\u53ef\u89e3\u91ca\u3001\u53ef\u7f16\u8f91\u76843D\u5185\u5bb9\u751f\u4ea7\u80fd\u529b\u3002"}, {"abstract": "Scientific discovery often involves optimising expensive-to-evaluate objectives over vast, structured, and open-ended hypothesis spaces, such as molecules, protein sequences, and computer programs. Generative models such as large language models (LLMs) provide expressive priors over such spaces, but their likelihoods and self-assessments are unreliable proxies for the objectives and calibrated epistemic uncertainty, especially for novel candidates outside the observed data distribution. We introduce the Large Discovery Model (LDM), an empirically grounded recurrent architecture that couples a generative model with a Bayesian non-parametric reward surrogate model. The generative model proposes and refines candidate designs, while the surrogate predicts their performance and quantifies uncertainty, yielding an uncertainty-aware value that guides candidate generation, refinement, and selection. The discovery memory and the surrogate model are continually updated as each new experimental observation arrives. We evaluate LDM on three scenarios spanning different design modalities and objectives, including neural-network training, antibody design, and molecular optimisation. Compared to LLM-only reflection or traditional statistical search across these domains, LDM achieves a $2.4\\times$ greater reduction in validation BPB, an $18.2\\%$ relative decrease in binding energy, and more than $60\\%$ relative gains in molecular multi-objective performance. These results suggests that LDM could serve as a general-purpose discovery engine for effective search over open-ended hypothesis spaces.", "arxiv_id": "2608.15669", "arxiv_url": "https://arxiv.org/abs/2608.15669", "authors": ["Zhongwei Yu", "Yan Song", "Xue Yan", "Anjie Liu", "Xingyu Lu", "Yihang Chen", "Huichi Zhou", "Siyuan Guo", "Luoyang Sun", "Sihan Chen", "Xiangning Yu", "Jun Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Large Discovery Model\uff08LDM\uff09\uff0c\u5c06\u751f\u6210\u6a21\u578b\u4e0e\u8d1d\u53f6\u65af\u975e\u53c2\u6570\u5956\u52b1\u4ee3\u7406\u6a21\u578b\u8026\u5408\uff0c\u7528\u4e8e\u5728\u5206\u5b50\u3001\u86cb\u767d\u5e8f\u5217\u3001\u7a0b\u5e8f\u7b49\u5f00\u653e\u5f0f\u5047\u8bbe\u7a7a\u95f4\u4e2d\u8fdb\u884c\u7ecf\u9a8c\u9a71\u52a8\u641c\u7d22\u3002\u6a21\u578b\u901a\u8fc7\u5b9e\u9a8c\u53cd\u9988\u6301\u7eed\u66f4\u65b0\u53d1\u73b0\u8bb0\u5fc6\u4e0e\u4ee3\u7406\u6a21\u578b\uff0c\u4ee5\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u4ef7\u503c\u6307\u5bfc\u5019\u9009\u751f\u6210\u3001\u4f18\u5316\u548c\u9009\u62e9\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/yzailab/Large-Discovery-Models", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2608.15669", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6838\u5fc3\u67b6\u6784\u7531\u751f\u6210\u6a21\u578b\u3001\u8d1d\u53f6\u65af\u975e\u53c2\u6570\u5956\u52b1\u4ee3\u7406\u3001\u53d1\u73b0\u8bb0\u5fc6\u7ec4\u6210\uff0c\u517c\u987e\u5019\u9009\u751f\u6210\u80fd\u529b\u4e0e\u7ecf\u9a8c\u6821\u51c6\u7684\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u3002", "\u4ee3\u7406\u6a21\u578b\u4e0d\u4ec5\u9884\u6d4b\u5019\u9009\u6027\u80fd\uff0c\u8fd8\u91cf\u5316\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\uff0c\u7528\u4e8e\u907f\u514d\u4ec5\u4f9d\u8d56 LLM likelihood \u6216\u81ea\u8bc4\u5e26\u6765\u7684\u9519\u8bef\u641c\u7d22\u65b9\u5411\u3002", "\u5728\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u3001\u6297\u4f53\u8bbe\u8ba1\u3001\u5206\u5b50\u591a\u76ee\u6807\u4f18\u5316\u4e09\u7c7b\u4efb\u52a1\u4e2d\uff0c\u5206\u522b\u53d6\u5f97\u9a8c\u8bc1 BPB \u964d\u4f4e 2.4 \u500d\u3001\u7ed3\u5408\u80fd\u76f8\u5bf9\u4e0b\u964d 18.2%\u3001\u5206\u5b50\u591a\u76ee\u6807\u6027\u80fd\u76f8\u5bf9\u63d0\u5347\u8d85\u8fc7 60%\u3002"], "keywords": ["\u79d1\u5b66\u53d1\u73b0", "\u751f\u6210\u6a21\u578b", "\u8d1d\u53f6\u65af\u4f18\u5316", "\u5f00\u653e\u5f0f\u641c\u7d22"], "num_comments": 3, "on_hf": true, "organization": "yangtze-ailab", "pdf_url": "https://arxiv.org/pdf/2608.15669v1", "published_at": "2026-08-16", "score": 0.336, "selected_reasons": ["HF trending (52\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15669.png", "title": "Large Discovery Models: Empirically-grounded Model-Based Open-Ended Search", "tldr": "LDM\u7528\u4e0d\u786e\u5b9a\u6027\u4ee3\u7406\u6a21\u578b\u5f15\u5bfc\u5f00\u653e\u5f0f\u79d1\u5b66\u53d1\u73b0", "upvotes": 52, "what_it_is": "\u8bba\u6587\u63d0\u51fa Large Discovery Model\uff08LDM\uff09\uff0c\u5c06\u751f\u6210\u6a21\u578b\u4e0e\u8d1d\u53f6\u65af\u975e\u53c2\u6570\u5956\u52b1\u4ee3\u7406\u6a21\u578b\u8026\u5408\uff0c\u7528\u4e8e\u5728\u5206\u5b50\u3001\u86cb\u767d\u5e8f\u5217\u3001\u7a0b\u5e8f\u7b49\u5f00\u653e\u5f0f\u5047\u8bbe\u7a7a\u95f4\u4e2d\u8fdb\u884c\u7ecf\u9a8c\u9a71\u52a8\u641c\u7d22\u3002\u6a21\u578b\u901a\u8fc7\u5b9e\u9a8c\u53cd\u9988\u6301\u7eed\u66f4\u65b0\u53d1\u73b0\u8bb0\u5fc6\u4e0e\u4ee3\u7406\u6a21\u578b\uff0c\u4ee5\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u4ef7\u503c\u6307\u5bfc\u5019\u9009\u751f\u6210\u3001\u4f18\u5316\u548c\u9009\u62e9\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u5927\u751f\u6210\u6a21\u578b\u7684\u5f00\u653e\u5f0f\u8868\u8fbe\u80fd\u529b\u4e0e\u8d1d\u53f6\u65af\u6a21\u578b\u7684\u5b9e\u9a8c\u6821\u51c6\u548c\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u7ed3\u5408\u8d77\u6765\uff0c\u4e3a\u6602\u8d35\u5b9e\u9a8c\u76ee\u6807\u4e0a\u7684\u79d1\u5b66\u53d1\u73b0\u63d0\u4f9b\u4e86\u66f4\u901a\u7528\u7684\u95ed\u73af\u641c\u7d22\u6846\u67b6\uff0c\u5177\u6709\u8de8\u836f\u7269\u3001\u86cb\u767d\u3001\u6a21\u578b\u8bbe\u8ba1\u7b49\u9886\u57df\u7684\u6f5c\u5728\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agent harnesses have substantially improved performance on long-horizon tasks by coordinating agent interactions with the environment. However, reinforcement learning through complex harnesses remains largely unexplored, as scaling such training to long-horizon agent tasks introduces fundamental challenges. In this work, we present a unified black-box RL framework for stable and scalable optimization of general agents through complex harnesses. Concretely, we first build a sandbox-based execution infrastructure that isolates task environments and harnesses within temporary sandboxes for large-scale concurrent rollouts. We then decouple policy optimization from opaque harness execution and place a serving proxy at the model boundary to capture model calls. To reconstruct multi-turn trajectories and improve training efficiency, we organize the captured calls into prefix trees and further adapt both critic-based PPO and critic-free GRPO to optimize over the recovered tree structure. Meanwhile, we maintain training-inference consistency throughout the optimization process. Finally, we introduce mix-harness training, allowing a single model to be jointly optimized by heterogeneous harnesses. With Qwen3-30A3B, black-box RL improves Pass@1 on ClawGym-Bench by 9.98 and 14.81 points through OpenClaw and Claude Code, respectively, while remaining stable over 200-400 optimization steps. Moreover, the framework yields consistent gains on more challenging tasks such as JobBench and OfficeQA. Overall, our framework enables effective, stable, and scalable optimization of general agents through black-box harnesses, supporting unified training across heterogeneous execution systems.", "arxiv_id": "2608.16798", "arxiv_url": "https://arxiv.org/abs/2608.16798", "authors": ["Huatong Song", "Fei Bai", "Ming Yang", "Renyuan Li", "Jia Deng", "Jujie He", "Zhange Zhang", "Daixuan Cheng", "Yan Xing", "Qi Yun", "Xuxing Chen", "Danyang Li", "Feng Chang", "Chuan Hao", "Ran Tao", "Jian Yang", "Bryan Dai", "Wayne Xin Zhao", "Mingjie Tang", "Ji-Rong Wen"], "brief": "\u8bba\u6587\u63d0\u51fa ClawGym II\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742 agent harness \u7684\u7edf\u4e00\u9ed1\u76d2\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5728\u4e0d\u4fb5\u5165\u6267\u884c\u6846\u67b6\u5185\u90e8\u7684\u60c5\u51b5\u4e0b\u6355\u83b7\u6a21\u578b\u8c03\u7528\u3001\u91cd\u5efa\u591a\u8f6e\u8f68\u8ff9\uff0c\u5e76\u7528 PPO/GRPO \u4f18\u5316\u901a\u7528\u667a\u80fd\u4f53\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/ClawGym/ClawGym-Agents", "github_stars": 36, "hf_url": "https://huggingface.co/papers/2608.16798", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u57fa\u4e8e\u6c99\u7bb1\u7684\u5927\u89c4\u6a21\u5e76\u53d1\u6267\u884c\u57fa\u7840\u8bbe\u65bd\uff0c\u9694\u79bb\u4efb\u52a1\u73af\u5883\u4e0e harness\uff0c\u652f\u6301\u957f\u7a0b\u4efb\u52a1\u7a33\u5b9a rollout\u3002", "\u901a\u8fc7 serving proxy \u5728\u6a21\u578b\u8fb9\u754c\u6355\u83b7\u8c03\u7528\uff0c\u5c06\u4e0d\u900f\u660e harness \u6267\u884c\u89e3\u8026\u4e3a\u53ef\u8bad\u7ec3\u8f68\u8ff9\uff0c\u5e76\u7528\u524d\u7f00\u6811\u91cd\u5efa\u591a\u8f6e\u4ea4\u4e92\u3002", "\u9002\u914d\u57fa\u4e8e critic \u7684 PPO \u4e0e\u65e0 critic \u7684 GRPO \u5230\u6811\u7ed3\u6784\u8f68\u8ff9\uff0c\u5e76\u63d0\u51fa mix-harness training \u652f\u6301\u5f02\u6784 harness \u8054\u5408\u8bad\u7ec3\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "PPO", "\u4ee3\u7801\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "Renmin University of China", "pdf_url": "https://arxiv.org/pdf/2608.16798v1", "published_at": "2026-08-17", "score": 0.332, "selected_reasons": ["HF trending (35\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16798.png", "title": "ClawGym II: Exploring Black-Box RL on Agent Harness", "tldr": "\u9ed1\u76d2\u5f3a\u5316\u5b66\u4e60\u53ef\u7a33\u5b9a\u4f18\u5316\u590d\u6742\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 35, "what_it_is": "\u8bba\u6587\u63d0\u51fa ClawGym II\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742 agent harness \u7684\u7edf\u4e00\u9ed1\u76d2\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5728\u4e0d\u4fb5\u5165\u6267\u884c\u6846\u67b6\u5185\u90e8\u7684\u60c5\u51b5\u4e0b\u6355\u83b7\u6a21\u578b\u8c03\u7528\u3001\u91cd\u5efa\u591a\u8f6e\u8f68\u8ff9\uff0c\u5e76\u7528 PPO/GRPO \u4f18\u5316\u901a\u7528\u667a\u80fd\u4f53\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u89e3\u51b3\u4e86\u590d\u6742\u667a\u80fd\u4f53\u6267\u884c\u6846\u67b6\u4e2d\u5f3a\u5316\u5b66\u4e60\u96be\u4ee5\u89c4\u6a21\u5316\u3001\u96be\u4ee5\u83b7\u53d6\u8f68\u8ff9\u7684\u95ee\u9898\uff0c\u4f7f\u901a\u7528\u6a21\u578b\u53ef\u901a\u8fc7\u9ed1\u76d2 harness \u7a33\u5b9a\u8bad\u7ec3\uff1b\u5728 ClawGym-Bench\u3001JobBench\u3001OfficeQA \u4e0a\u5747\u5e26\u6765\u660e\u663e\u63d0\u5347\uff0c\u5bf9\u4ee3\u7801\u667a\u80fd\u4f53\u548c\u529e\u516c/\u4efb\u52a1\u578b\u667a\u80fd\u4f53\u8bad\u7ec3\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "This first release of Prior Labs in relational learning shows our continued commitment to open science. We open-source three pieces of software that we expect to accelerate research in the field towards meaningful real-world impact. We aim to steer further development based on feedback from, and in collaboration with, the community. Given the early stage of development, our $\u03b1$-release targets researchers and early-adopting practitioners. Over the past years, a variety of datasets and tasks for relational learning have emerged, but the community has not converged on a reliable, reproducible way to compare different methods on these tasks. Our $\u03b1$-release, RelArena-$\u03b1$, provides a unified framework for running and comparing baselines on RelBench v1 by standardizing data loading, evaluation protocols, tuning regimes, and support for systems with custom tuning, inspired by established tabular benchmarks such as TabArena. We plan to work with the research community to further develop RelArena-$\u03b1$ into a catalyst for progress in the relational learning community. We release the initial version of TabPFN-Rel, a purpose-built relational harness for TabPFN-3. Currently ranked first among models on RelArena-$\u03b1$, TabPFN-Rel makes key improvements upon RDBLearn. Beyond its ranking, TabPFN-Rel serves as a strong baseline, adding to the growing evidence that flattening a relational database into a single table remains competitive with specialized relational architectures on real-world tasks. To facilitate adoption of relational learning methods in research and industry, we release an initial $\u03b1$-version of our Relational Predictive Interface, RPI, an open-source, model-agnostic interface that enables early adopters to easily define problems on new databases and apply any model implemented in RelArena-$\u03b1$, including TabPFN-Rel, to these problems.", "arxiv_id": "2608.16319", "arxiv_url": "https://arxiv.org/abs/2608.16319", "authors": ["Adrian Hayler", "Klemens Fl\u00f6ge", "Alan Arazi", "Rishabh Ranjan", "Jure Leskovec", "Felix Birkel", "Brendan Roof", "Anurag Garg", "Kristina Collins", "Lydia Sidhoum", "Jonas K\u00fcbler", "Siyuan Guo", "Oscar Key", "Jan Hendrik Metzen", "Rylee Grace", "David Salinas", "Arthur Cahu", "Simon Bing", "Benjamin J\u00e4ger", "Tuana \u00c7elik", "Mihir Manium", "Vitor Monteiro", "Jake Robertson", "Jerry Chen", "Eliott Kalfon", "Tom\u00e1s Pereda", "Lilly Wehrhahn", "Dominik Safaric", "Tobias Schroeder", "Georg Grab", "Diana Kriuchkova", "Clara Cornu", "Philipp Singer", "Nick Erickson", "Vahid Balazadeh", "Marie Salmon", "Simone Alessi", "K\u00fcr\u015fat Kaya", "Philipp Jund", "L\u00e9o Grinsztajn", "Yann LeCun", "Bernhard Sch\u00f6lkopf", "Madelon Hulsebos", "Lennart Purucker", "Sauraj Gambhir", "Frank Hutter", "Noah Hollmann"], "brief": "\u8bba\u6587\u53d1\u5e03 Prior Labs \u5728\u5173\u7cfb\u5b66\u4e60\u65b9\u5411\u7684\u9996\u4e2a\u5f00\u6e90 \u03b1 \u7248\u672c\uff0c\u5305\u62ec\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6 RelArena-\u03b1\u3001\u57fa\u4e8e TabPFN-3 \u7684\u5173\u7cfb\u5b66\u4e60\u57fa\u7ebf TabPFN-Rel\uff0c\u4ee5\u53ca\u6a21\u578b\u65e0\u5173\u7684\u5173\u7cfb\u9884\u6d4b\u63a5\u53e3 RPI\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/PriorLabs/relarena", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2608.16319", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["RelArena-\u03b1 \u9762\u5411 RelBench v1\uff0c\u6807\u51c6\u5316\u6570\u636e\u52a0\u8f7d\u3001\u8bc4\u4f30\u534f\u8bae\u3001\u8c03\u53c2\u673a\u5236\u4e0e\u81ea\u5b9a\u4e49\u7cfb\u7edf\u652f\u6301\uff0c\u63d0\u5347\u53ef\u590d\u73b0\u6bd4\u8f83\u80fd\u529b\u3002", "TabPFN-Rel \u5728 RelArena-\u03b1 \u5f53\u524d\u6392\u540d\u7b2c\u4e00\uff0c\u6539\u8fdb\u4e86 RDBLearn\uff0c\u5e76\u8868\u660e\u5c06\u5173\u7cfb\u6570\u636e\u5e93\u5c55\u5e73\u6210\u5355\u8868\u5728\u771f\u5b9e\u4efb\u52a1\u4e0a\u4ecd\u5177\u7ade\u4e89\u529b\u3002", "RPI \u63d0\u4f9b\u5f00\u6e90\u3001\u6a21\u578b\u65e0\u5173\u63a5\u53e3\uff0c\u65b9\u4fbf\u7814\u7a76\u548c\u5de5\u4e1a\u7528\u6237\u5728\u65b0\u6570\u636e\u5e93\u4e0a\u5b9a\u4e49\u9884\u6d4b\u95ee\u9898\u5e76\u8c03\u7528 RelArena-\u03b1 \u4e2d\u7684\u65b9\u6cd5\u3002"], "keywords": ["\u5173\u7cfb\u5b66\u4e60", "\u57fa\u51c6\u8bc4\u6d4b", "\u8868\u683c\u5b66\u4e60", "\u5f00\u6e90\u5de5\u5177"], "num_comments": 2, "on_hf": true, "organization": "Prior Labs", "pdf_url": "https://arxiv.org/pdf/2608.16319v1", "published_at": "2026-08-17", "score": 0.293, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16319.png", "title": "Advancing Open and Reproducible Relational Learning: RelArena-$\u03b1$, TabPFN-Rel and RPI", "tldr": "\u5f00\u6e90\u5173\u7cfb\u5b66\u4e60\u57fa\u51c6\u3001\u5f3a\u57fa\u7ebf\u4e0e\u9884\u6d4b\u63a5\u53e3\u3002", "upvotes": 22, "what_it_is": "\u8bba\u6587\u53d1\u5e03 Prior Labs \u5728\u5173\u7cfb\u5b66\u4e60\u65b9\u5411\u7684\u9996\u4e2a\u5f00\u6e90 \u03b1 \u7248\u672c\uff0c\u5305\u62ec\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6 RelArena-\u03b1\u3001\u57fa\u4e8e TabPFN-3 \u7684\u5173\u7cfb\u5b66\u4e60\u57fa\u7ebf TabPFN-Rel\uff0c\u4ee5\u53ca\u6a21\u578b\u65e0\u5173\u7684\u5173\u7cfb\u9884\u6d4b\u63a5\u53e3 RPI\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u9f50\u4e86\u5173\u7cfb\u5b66\u4e60\u9886\u57df\u7f3a\u4e4f\u7edf\u4e00\u3001\u53ef\u590d\u73b0\u8bc4\u6d4b\u751f\u6001\u7684\u95ee\u9898\uff0c\u540c\u65f6\u63d0\u4f9b\u5f3a\u57fa\u7ebf\u548c\u6613\u7528\u63a5\u53e3\uff0c\u6709\u671b\u52a0\u901f\u5173\u7cfb\u6570\u636e\u5e93\u573a\u666f\u4e0b\u673a\u5668\u5b66\u4e60\u65b9\u6cd5\u7684\u7814\u7a76\u4e0e\u843d\u5730\u3002"}, {"abstract": "Reinforcement learning (RL) with group-relative advantages has become the de facto standard for post-training language model reasoners. However, when optimizing multiple reward objectives, existing methods typically scalarize the reward vector with a fixed weighted sum before group-wise standardization. We show that this design leads to two fundamental problems: rollouts with distinct reward profiles can receive identical advantages, and all objectives are optimized with fixed relative weights regardless of their current level of saturation. As a result, training continues to allocate gradient budget to already-solved objectives instead of focusing on those with greater remaining headroom. We introduce \\textbf{Saturation Aware Advantage Reweighting for Multi-Reward Policy Optimization} (SA-MRPO), which standardizes each reward objective independently and adaptively discounts its contribution according to a batch-level estimate of objective saturation. This dynamically reallocates optimization effort toward under-optimized objectives while empirically maintaining performance on those that are already well satisfied. We further show that saturation-aware reweighting can reverse the sign of an update, rather than merely rescale its magnitude. Across mathematical reasoning with two- and three-objective reward combinations, SA-MRPO improves the harder correctness objective over GDPO in 12 of 15 benchmark comparisons, with gains of up to $5\\%$ on AIME24. On adaptive reasoning it improves accuracy on all five benchmarks, by $3.8\\%$ on average and up to $9.2 \\%$ on AMC23, and on coding benchmarks it improves pass rate by up to $2.3\\%$, while in all settings maintaining the easier objectives near their already satisfied levels.", "arxiv_id": "2608.16072", "arxiv_url": "https://arxiv.org/abs/2608.16072", "authors": ["Yixuan Wang", "Yifei Chen", "Haichao Zhang", "Haozheng Luo", "Xander Wu", "Jie Ni", "Yun Fu", "Nuno Vasconcelos", "Yijiang Li"], "brief": "\u672c\u6587\u63d0\u51fa SA-MRPO\uff0c\u7528\u4e8e\u8bed\u8a00\u6a21\u578b\u591a\u5956\u52b1\u76ee\u6807\u7684\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u3002\u5b83\u4e0d\u518d\u5148\u56fa\u5b9a\u52a0\u6743\u6c47\u603b\u5956\u52b1\uff0c\u800c\u662f\u5bf9\u6bcf\u4e2a\u5956\u52b1\u72ec\u7acb\u6807\u51c6\u5316\uff0c\u5e76\u6839\u636e\u6279\u6b21\u7ea7\u76ee\u6807\u9971\u548c\u5ea6\u81ea\u9002\u5e94\u964d\u4f4e\u5df2\u89e3\u51b3\u76ee\u6807\u7684\u6743\u91cd\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16072", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u56fa\u5b9a\u52a0\u6743\u6807\u91cf\u5316\u4f1a\u8ba9\u4e0d\u540c\u5956\u52b1\u753b\u50cf\u83b7\u5f97\u76f8\u540c advantage\uff0c\u4e14\u6301\u7eed\u6d6a\u8d39\u68af\u5ea6\u5728\u5df2\u9971\u548c\u76ee\u6807\u4e0a\u3002", "SA-MRPO \u6839\u636e\u76ee\u6807\u9971\u548c\u5ea6\u52a8\u6001\u91cd\u52a0\u6743 advantage\uff0c\u5c06\u4f18\u5316\u91cd\u70b9\u8f6c\u5411\u4ecd\u6709\u63d0\u5347\u7a7a\u95f4\u7684\u56f0\u96be\u76ee\u6807\u3002", "\u5728\u6570\u5b66\u63a8\u7406\u3001\u81ea\u9002\u5e94\u63a8\u7406\u548c\u4ee3\u7801\u4efb\u52a1\u4e0a\u4f18\u4e8e GDPO\uff0cAIME24 \u6700\u9ad8\u63d0\u5347 5%\uff0cAMC23 \u6700\u9ad8\u63d0\u5347 9.2%\uff0c\u4ee3\u7801 pass rate \u6700\u9ad8\u63d0\u5347 2.3%\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u76ee\u6807\u4f18\u5316", "\u63a8\u7406"], "num_comments": 3, "on_hf": true, "organization": "University of California at San Diego", "pdf_url": "https://arxiv.org/pdf/2608.16072v1", "published_at": "2026-08-17", "score": 0.286, "selected_reasons": ["HF trending (49\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16072.png", "title": "Learn What\u0027s Left, Not What\u0027s Mastered: Saturation Aware Advantage Reweighting for Multi-Reward Policy Optimization", "tldr": "\u6309\u5956\u52b1\u9971\u548c\u5ea6\u52a8\u6001\u91cd\u5206\u914dRL\u4f18\u5316\u68af\u5ea6\u3002", "upvotes": 49, "what_it_is": "\u672c\u6587\u63d0\u51fa SA-MRPO\uff0c\u7528\u4e8e\u8bed\u8a00\u6a21\u578b\u591a\u5956\u52b1\u76ee\u6807\u7684\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u3002\u5b83\u4e0d\u518d\u5148\u56fa\u5b9a\u52a0\u6743\u6c47\u603b\u5956\u52b1\uff0c\u800c\u662f\u5bf9\u6bcf\u4e2a\u5956\u52b1\u72ec\u7acb\u6807\u51c6\u5316\uff0c\u5e76\u6839\u636e\u6279\u6b21\u7ea7\u76ee\u6807\u9971\u548c\u5ea6\u81ea\u9002\u5e94\u964d\u4f4e\u5df2\u89e3\u51b3\u76ee\u6807\u7684\u6743\u91cd\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u591a\u5956\u52b1 RL \u540e\u8bad\u7ec3\u4e2d\u7684\u76ee\u6807\u9971\u548c\u4e0e\u68af\u5ea6\u9884\u7b97\u5206\u914d\u95ee\u9898\u7ed9\u51fa\u76f4\u63a5\u6539\u8fdb\uff0c\u80fd\u5728\u4fdd\u6301\u7b80\u5355\u76ee\u6807\u8868\u73b0\u7684\u540c\u65f6\u63d0\u5347\u66f4\u96be\u76ee\u6807\uff0c\u5bf9\u8bad\u7ec3\u591a\u76ee\u6807\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u5668\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reasoning in LLMs is overwhelmingly studied in domains that provide a model with rules: mathematics and code. Linguistic puzzles invert this: the solver must first discover the system before reasoning within it. We present the IOL-AI Challenge, an open-science competition run on the unseen problems of the International Linguistics Olympiad (IOL) 2026 Individual Contest, evaluated both automatically and, for the first time, by members of the official IOL Jury under the same rubrics applied to human contestants. The challenge drew 731 submissions from 46 teams under a strict compute budg
