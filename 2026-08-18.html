et (one T4, 30 mins). We additionally benchmark 15 unconstrained frontier and open models, with Claude Opus 4.8 earning a jury score equivalent to a gold medal, while both resource-constrained systems we submitted for jury grading scored in the range of the bottom 5% of contestants. Capability was not determined by scale: 14B submissions outperform models twice their size, and gains come from decoding and output-handling rather than model capacity. We also found that automatic metrics rank systems exactly as the jury does, but compress the scale, upscoring weak systems by ~13 points and understating strong ones. Our analysis shows that while frontier models might have prior knowledge about some of the problem languages, it does not significantly help them solve the linguistic reasoning tasks, leaving linguistic reasoning as a strong benchmarking proxy for generalizable reasoning skills.", "arxiv_id": "2608.18011", "arxiv_url": "https://arxiv.org/abs/2608.18011", "authors": ["Eduardo S\u00e1nchez", "Rita Berrada", "Dan-Mircea Mirea", "Sara Rajaee", "Alexander Piperski", "Ana Meta Dolinar", "Boris Iomdin", "Andrey Nikulin", "Mariya Shmatova", "Marzieh Fadaee", "Julia Kreutzer"], "brief": "\u8bba\u6587\u63d0\u51fa IOL-AI Challenge\uff1a\u57fa\u4e8e2026\u5e74\u56fd\u9645\u8bed\u8a00\u5b66\u5965\u6797\u5339\u514b\u4e2a\u4eba\u8d5b\u672a\u89c1\u9898\u76ee\u7684\u5f00\u653e\u7ade\u8d5b\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u6a21\u578b\u5728\u5148\u53d1\u73b0\u8bed\u8a00\u7cfb\u7edf\u3001\u518d\u8fdb\u884c\u63a8\u7406\u7684\u80fd\u529b\u3002\u6bd4\u8d5b\u540c\u65f6\u91c7\u7528\u81ea\u52a8\u8bc4\u6d4b\u548c\u5b98\u65b9 IOL \u8bc4\u59d4\u6309\u4eba\u7c7b\u9009\u624b\u6807\u51c6\u8bc4\u5206\uff0c\u5e76\u5206\u6790\u4e86731\u4efd\u53d7\u9650\u7b97\u529b\u63d0\u4ea4\u4e0e15\u4e2a\u524d\u6cbf/\u5f00\u6e90\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18011", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u4e25\u683c\u7b97\u529b\u9650\u5236\u4e0b\uff08\u5355\u5f20T4\u300130\u5206\u949f\uff09\uff0c46\u652f\u961f\u4f0d\u63d0\u4ea4731\u6b21\uff0c\u90e8\u520614B\u6a21\u578b\u7cfb\u7edf\u8d85\u8fc7\u66f4\u5927\u6a21\u578b\uff0c\u8bf4\u660e\u6027\u80fd\u4e0d\u53ea\u7531\u89c4\u6a21\u51b3\u5b9a", "Claude Opus 4.8 \u5728\u4eba\u5de5\u8bc4\u5ba1\u4e2d\u8fbe\u5230\u76f8\u5f53\u4e8e\u91d1\u724c\u6c34\u5e73\uff0c\u4f46\u53d7\u9650\u8d44\u6e90\u7cfb\u7edf\u4ec5\u5904\u4e8e\u4eba\u7c7b\u9009\u624b\u5e95\u90e85%\u533a\u95f4", "\u81ea\u52a8\u6307\u6807\u4e0e\u8bc4\u59d4\u6392\u5e8f\u5b8c\u5168\u4e00\u81f4\uff0c\u4f46\u5206\u6570\u5c3a\u5ea6\u88ab\u538b\u7f29\uff1a\u5f31\u7cfb\u7edf\u7ea6\u88ab\u9ad8\u4f3013\u5206\uff0c\u5f3a\u7cfb\u7edf\u88ab\u4f4e\u4f30"], "keywords": ["\u8bed\u8a00\u63a8\u7406", "\u5927\u6a21\u578b\u8bc4\u6d4b", "\u57fa\u51c6\u6d4b\u8bd5", "\u81ea\u7136\u8bed\u8a00\u5904\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18011v1", "published_at": "2026-08-18", "score": 0.25, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta"], "thumbnail": null, "title": "The IOL-AI Challenge: An Open Challenge towards Advancing Linguistic Reasoning", "tldr": "IOL-AI\u6311\u6218\u8bc4\u6d4bLLM\u8bed\u8a00\u5b66\u63a8\u7406\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa IOL-AI Challenge\uff1a\u57fa\u4e8e2026\u5e74\u56fd\u9645\u8bed\u8a00\u5b66\u5965\u6797\u5339\u514b\u4e2a\u4eba\u8d5b\u672a\u89c1\u9898\u76ee\u7684\u5f00\u653e\u7ade\u8d5b\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u6a21\u578b\u5728\u5148\u53d1\u73b0\u8bed\u8a00\u7cfb\u7edf\u3001\u518d\u8fdb\u884c\u63a8\u7406\u7684\u80fd\u529b\u3002\u6bd4\u8d5b\u540c\u65f6\u91c7\u7528\u81ea\u52a8\u8bc4\u6d4b\u548c\u5b98\u65b9 IOL \u8bc4\u59d4\u6309\u4eba\u7c7b\u9009\u624b\u6807\u51c6\u8bc4\u5206\uff0c\u5e76\u5206\u6790\u4e86731\u4efd\u53d7\u9650\u7b97\u529b\u63d0\u4ea4\u4e0e15\u4e2a\u524d\u6cbf/\u5f00\u6e90\u6a21\u578b\u3002", "why_notable": "\u8be5\u6311\u6218\u628aLLM\u63a8\u7406\u8bc4\u6d4b\u4ece\u6709\u663e\u5f0f\u89c4\u5219\u7684\u6570\u5b66/\u4ee3\u7801\u8f6c\u5411\u9700\u5148\u5f52\u7eb3\u89c4\u5219\u7684\u8bed\u8a00\u5b66\u8c1c\u9898\uff0c\u66f4\u63a5\u8fd1\u53ef\u6cdb\u5316\u63a8\u7406\u80fd\u529b\uff1b\u540c\u65f6\u5f15\u5165\u5b98\u65b9\u4eba\u7c7b\u7ade\u8d5b\u8bc4\u59d4\u8bc4\u5206\uff0c\u4e3a\u8bed\u8a00\u63a8\u7406\u57fa\u51c6\u63d0\u4f9b\u4e86\u66f4\u53ef\u4fe1\u7684\u5f00\u653e\u8bc4\u6d4b\u6846\u67b6\u3002"}, {"abstract": "Frontier large language models (LLMs) safety evaluation has largely treated harmful generation as an attack outcome rather than as an object of analysis. Consequently, little is known about the harmful outputs produced during model misbehavior, partly because large-scale, high-quality collections of frontier-LLM misbehavior are difficult to obtain. To address this gap, we introduce HarmProfile, a content-centric benchmark dataset that collects model misbehavior across diverse harm categories and model families, and defines the resulting harmful-output distribution as a model-level risk profile. The premise is that, just as linguistic behavior can be characterized from an utterance corpus, model risk can be characterized from the content, severity, and variation of its safety failures. HarmProfile contains over 80,000 validated artifacts from 23 frontier LLMs across 13 model families, organized into 15 harm categories and 57 subcategories. Using this corpus, we find that frontier LLMs reliably produce harmful content at scale, yet exhibit distinct risk profiles; both harmfulness and diversity grow with model capability, suggesting that frontier LLMs may appear safe yet harbor increasingly dangerous knowledge beneath the alignment surface. Our source code is available at https://github.com/fresh-ma/HarmProfile .", "arxiv_id": "2608.14577", "arxiv_url": "https://arxiv.org/abs/2608.14577", "authors": ["Zhouyuan Ma", "Yutao Wu", "Hanxun Huang", "Xiang Zheng", "Xiao Liu", "Yixin Cao", "Zuxuan Wu", "Xingjun Ma", "Yu-Gang Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa HarmProfile\uff0c\u4e00\u4e2a\u4ee5\u5185\u5bb9\u4e3a\u4e2d\u5fc3\u7684\u524d\u6cbf\u5927\u6a21\u578b\u5b89\u5168\u5931\u6548\u57fa\u51c6\u6570\u636e\u96c6\u3002\u5b83\u6536\u96c623\u4e2a\u524d\u6cbfLLM\u572815\u7c7b\u300157\u4e2a\u5b50\u7c7b\u5371\u5bb3\u4e2d\u76848\u4e07\u4f59\u6761\u7ecf\u9a8c\u8bc1\u6709\u5bb3\u8f93\u51fa\uff0c\u5e76\u5c06\u5176\u7528\u4e8e\u523b\u753b\u6a21\u578b\u7ea7\u98ce\u9669\u753b\u50cf\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/fresh-ma/HarmProfile", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.14577", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u6709\u5bb3\u751f\u6210\u4ece\u201c\u653b\u51fb\u662f\u5426\u6210\u529f\u201d\u8f6c\u4e3a\u201c\u6709\u5bb3\u5185\u5bb9\u5206\u5e03\u201d\u5206\u6790\uff0c\u5173\u6ce8\u5185\u5bb9\u3001\u4e25\u91cd\u6027\u4e0e\u591a\u6837\u6027\u3002", "\u8986\u76d623\u4e2a\u524d\u6cbfLLM\u300113\u4e2a\u6a21\u578b\u5bb6\u65cf\uff0c\u5305\u542b\u8d85\u8fc780,000\u6761\u9a8c\u8bc1\u540e\u7684\u5b89\u5168\u5931\u6548\u6837\u672c\u3002", "\u53d1\u73b0\u6a21\u578b\u80fd\u529b\u8d8a\u5f3a\uff0c\u6709\u5bb3\u6027\u4e0e\u6709\u5bb3\u5185\u5bb9\u591a\u6837\u6027\u5f80\u5f80\u8d8a\u9ad8\uff0c\u8bf4\u660e\u8868\u9762\u5bf9\u9f50\u4e0b\u53ef\u80fd\u9690\u85cf\u66f4\u5371\u9669\u77e5\u8bc6\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u8bc4\u4f30", "\u6709\u5bb3\u751f\u6210", "\u5bf9\u9f50"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14577v1", "published_at": "2026-06-11", "score": 0.249, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14577.png", "title": "HarmProfile: Characterizing Harmful Distributions in Frontier LLMs", "tldr": "\u75288\u4e07\u6709\u5bb3\u6837\u672c\u523b\u753b\u524d\u6cbfLLM\u98ce\u9669\u5206\u5e03", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa HarmProfile\uff0c\u4e00\u4e2a\u4ee5\u5185\u5bb9\u4e3a\u4e2d\u5fc3\u7684\u524d\u6cbf\u5927\u6a21\u578b\u5b89\u5168\u5931\u6548\u57fa\u51c6\u6570\u636e\u96c6\u3002\u5b83\u6536\u96c623\u4e2a\u524d\u6cbfLLM\u572815\u7c7b\u300157\u4e2a\u5b50\u7c7b\u5371\u5bb3\u4e2d\u76848\u4e07\u4f59\u6761\u7ecf\u9a8c\u8bc1\u6709\u5bb3\u8f93\u51fa\uff0c\u5e76\u5c06\u5176\u7528\u4e8e\u523b\u753b\u6a21\u578b\u7ea7\u98ce\u9669\u753b\u50cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u524d\u6cbfLLM\u5b89\u5168\u8bc4\u4f30\u63d0\u4f9b\u4e86\u5927\u89c4\u6a21\u3001\u7ec6\u7c92\u5ea6\u7684\u5b9e\u8bc1\u6570\u636e\u57fa\u7840\uff0c\u53ef\u5e2e\u52a9\u7814\u7a76\u8005\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u7684\u98ce\u9669\u753b\u50cf\uff0c\u800c\u4e0d\u53ea\u662f\u7edf\u8ba1\u8d8a\u72f1\u6210\u529f\u7387\uff0c\u5bf9\u5b89\u5168\u8bc4\u6d4b\u3001\u7ea2\u961f\u6d4b\u8bd5\u548c\u6a21\u578b\u6cbb\u7406\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Visual document retrieval is a critical component of multimodal retrieval-augmented generation, aiming to identify query-relevant pages from document collections where evidence is distributed across text, layout, charts, and visual structures. Recent efforts toward finer-grained supervision primarily rely on textual descriptions or localized visual regions as evidence proxies. However, such supervision signals may either overlook complex visual structures or provide incomplete and inaccurate representations of the underlying evidence. To address these limitations, we propose ConceptFormer, a latent concept representation learning framework for visual document retrieval. ConceptFormer models query-relevant evidence as continuous, query-conditioned latent concepts that explicitly bridge localized visual evidence and semantic relevance, without requiring either textual intermediate representations or direct reliance on raw visual annotations. During training, ConceptFormer employs a strong vision-language model to dynamically determine the number of latent concept tokens and uses these concepts as an intermediate representation to bridge the semantic gap between queries and documents, thereby guiding the learning of the embedding space. Experiments on diverse visual document retrieval benchmarks demonstrate that ConceptFormer achieves 16.7\\% and 22.1\\% relative improvements in average NDCG@10 over the strongest visual retrieval baseline and the strongest OCR-based text retrieval baseline, respectively. Further analysis reveals that latent concepts effectively connect localized visual evidence with semantic relevance, enabling the retriever to capture both fine-grained textual cues and complex document-level visual structures while preserving strong retrieval alignment. Codes and data are available at https://github.com/Neuir/ConceptFormer.", "arxiv_id": "2608.15698", "arxiv_url": "https://arxiv.org/abs/2608.15698", "authors": ["Peng Chunyi", "Xu Zhipeng", "Yan Yukun", "Liu Zhenghao", "Yu Shi", "Mei Sen", "Sun Yubo", "Zhang Yongheng", "Zhou Jie", "Gu Yu", "Yu Ge", "Sun Maosong"], "brief": "\u8bba\u6587\u63d0\u51fa ConceptFormer\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u6587\u6863\u68c0\u7d22\u7684\u6f5c\u6982\u5ff5\u8868\u793a\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5c06\u67e5\u8be2\u76f8\u5173\u8bc1\u636e\u5efa\u6a21\u4e3a\u8fde\u7eed\u3001\u67e5\u8be2\u6761\u4ef6\u5316\u7684 latent concept tokens\uff0c\u7528\u4e8e\u8fde\u63a5\u5c40\u90e8\u89c6\u89c9\u8bc1\u636e\u4e0e\u8bed\u4e49\u76f8\u5173\u6027\uff0c\u800c\u4e0d\u4f9d\u8d56\u6587\u672c\u4e2d\u95f4\u63cf\u8ff0\u6216\u539f\u59cb\u89c6\u89c9\u6807\u6ce8\u3002", "categories": ["cs.CV", "cs.IR"], "github_repo": "https://github.com/NEUIR/ConceptFormer", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.15698", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bad\u7ec3\u65f6\u5229\u7528\u5f3a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u52a8\u6001\u51b3\u5b9a\u6f5c\u6982\u5ff5 token \u6570\u91cf\uff0c\u5e76\u4ee5\u5176\u4f5c\u4e3a\u67e5\u8be2-\u6587\u6863\u8bed\u4e49\u6865\u6881\u6765\u6307\u5bfc\u5d4c\u5165\u7a7a\u95f4\u5b66\u4e60\u3002", "\u6f5c\u6982\u5ff5\u80fd\u591f\u540c\u65f6\u6355\u83b7\u7ec6\u7c92\u5ea6\u6587\u672c\u7ebf\u7d22\u3001\u56fe\u8868/\u7248\u5f0f\u7b49\u590d\u6742\u89c6\u89c9\u7ed3\u6784\uff0c\u4ee5\u53ca\u6587\u6863\u7ea7\u8bed\u4e49\u76f8\u5173\u6027\u3002", "\u5728\u591a\u79cd\u89c6\u89c9\u6587\u6863\u68c0\u7d22\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u6700\u5f3a\u89c6\u89c9\u68c0\u7d22\u57fa\u7ebf\u548c\u6700\u5f3a OCR \u6587\u672c\u68c0\u7d22\u57fa\u7ebf\uff0c\u5e73\u5747 NDCG@10 \u5206\u522b\u76f8\u5bf9\u63d0\u5347 16.7% \u548c 22.1%\u3002"], "keywords": ["\u89c6\u89c9\u6587\u6863\u68c0\u7d22", "\u591a\u6a21\u6001\u68c0\u7d22", "\u8868\u5f81\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15698v1", "published_at": "2026-08-16", "score": 0.236, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15698.png", "title": "ConceptFormer: Learning Adaptive Latent Concepts for Query-Document Alignment in Visual Document Retrieval", "tldr": "\u7528\u81ea\u9002\u5e94\u6f5c\u6982\u5ff5\u63d0\u5347\u89c6\u89c9\u6587\u6863\u68c0\u7d22\u5bf9\u9f50\u3002", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa ConceptFormer\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u6587\u6863\u68c0\u7d22\u7684\u6f5c\u6982\u5ff5\u8868\u793a\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5c06\u67e5\u8be2\u76f8\u5173\u8bc1\u636e\u5efa\u6a21\u4e3a\u8fde\u7eed\u3001\u67e5\u8be2\u6761\u4ef6\u5316\u7684 latent concept tokens\uff0c\u7528\u4e8e\u8fde\u63a5\u5c40\u90e8\u89c6\u89c9\u8bc1\u636e\u4e0e\u8bed\u4e49\u76f8\u5173\u6027\uff0c\u800c\u4e0d\u4f9d\u8d56\u6587\u672c\u4e2d\u95f4\u63cf\u8ff0\u6216\u539f\u59cb\u89c6\u89c9\u6807\u6ce8\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7ed5\u5f00\u4e86\u4f9d\u8d56\u6587\u672c\u63cf\u8ff0\u6216\u5c40\u90e8\u89c6\u89c9\u6846\u6807\u6ce8\u4f5c\u4e3a\u8bc1\u636e\u4ee3\u7406\u7684\u5c40\u9650\uff0c\u4e3a\u591a\u6a21\u6001 RAG \u4e2d\u590d\u6742\u6587\u6863\u9875\u9762\u68c0\u7d22\u63d0\u4f9b\u4e86\u66f4\u7075\u6d3b\u7684\u7ec6\u7c92\u5ea6\u5bf9\u9f50\u673a\u5236\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are increasingly used as synthetic survey respondents, but existing evaluations ask whether answers look plausible at the individual level. We argue the right question is psychometric: do LLMs preserve the joint distribution, latent structure, reliability, mediation pathways, and demographic effects of real human survey data? We introduce a Lithuanian organisational-psychology dataset (n=263 employees; Dunham Attitudes Toward Change, UWES-17, Koopmans IWPQ; 68 items, 12 subscales) and condition a 37-model lineup spanning OpenAI, Anthropic, Google, and twelve open-weight families on real respondent profiles under a five-level persona-disclosure ladder, presentation and reasoning-effort ablations, counterfactual demographic swaps (gender, role, education), a cross-language check, and a verbatim-recall memorization probe. The resulting Psychometric Similarity Score (PSS) is anchored against five non-LLM statistical baselines and a held-out human-vs-human ceiling, with respondent-bootstrap confidence intervals and an item-permutation null for Tucker\u0027s phi. LLMs reproduce the qualitative direction of human psychometric relationships, but a Gaussian-copula baseline beats every LLM on the sample-driven PSS components; the LLM \"crowd\" is more similar to itself (mean inter-LLM PSS 0.73) than to humans; and memorization does not drive the leaderboard (recall-PSS rank correlation 0.00). Counterfactual swaps reveal education-driven effects (mean |d|=0.56) that dwarf gender (0.12) and role (0.18); Tucker\u0027s phi on UWES falls inside the permutation null for 8 of 37 models. Downstream, every LLM shows a strong acquiescence shift (+0.84 SD), synthetic-trained regressors lose predictive validity on held-out humans (mean R^2 -0.18 vs 0.28), and models fabricate indirect effects on 3 of 10 placebo mediation paths. LLM samples are not a drop-in replacement for human survey data.", "arxiv_id": "2608.14606", "arxiv_url": "https://arxiv.org/abs/2608.14606", "authors": ["Mantas Lukauskas", "Viktorija \u0160arkauskait\u0117"], "brief": "\u8bba\u6587\u4ece\u5fc3\u7406\u6d4b\u91cf\u5b66\u89d2\u5ea6\u7cfb\u7edf\u5ba1\u8ba1LLM\u4f5c\u4e3a\u201c\u5408\u6210\u8c03\u67e5\u53d7\u8bbf\u8005\u201d\u7684\u6709\u6548\u6027\uff0c\u68c0\u9a8c\u5176\u662f\u5426\u80fd\u4fdd\u7559\u771f\u5b9e\u4eba\u7c7b\u95ee\u5377\u7684\u8054\u5408\u5206\u5e03\u3001\u6f5c\u5728\u7ed3\u6784\u3001\u4fe1\u5ea6\u3001\u4e2d\u4ecb\u8def\u5f84\u548c\u4eba\u53e3\u7edf\u8ba1\u6548\u5e94\u3002\u4f5c\u8005\u6784\u5efa\u7acb\u9676\u5b9b\u7ec4\u7ec7\u5fc3\u7406\u5b66\u6570\u636e\u96c6\uff0c\u5e76\u8bc4\u6d4b37\u4e2a\u95ed\u6e90\u4e0e\u5f00\u6e90\u6a21\u578b\u53ca\u591a\u79cd\u63d0\u793a\u3001\u4eba\u683c\u62ab\u9732\u548c\u53cd\u4e8b\u5b9e\u8bbe\u7f6e\u3002", "categories": ["cs.CY", "cs.AI", "cs.CL", "stat.AP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14606", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51faPsychometric Similarity Score\uff08PSS\uff09\uff0c\u5e76\u7528\u9ad8\u65afcopula\u7b49\u975eLLM\u7edf\u8ba1\u57fa\u7ebf\u3001\u4eba\u7c7b\u4e0a\u9650\u3001bootstrap\u7f6e\u4fe1\u533a\u95f4\u548c\u7f6e\u6362\u68c0\u9a8c\u8fdb\u884c\u6821\u51c6\u3002", "LLM\u80fd\u590d\u73b0\u90e8\u5206\u5fc3\u7406\u5173\u7cfb\u7684\u5b9a\u6027\u65b9\u5411\uff0c\u4f46\u6240\u6709LLM\u5728\u6837\u672c\u9a71\u52a8PSS\u6307\u6807\u4e0a\u90fd\u4e0d\u5982\u9ad8\u65afcopula\u57fa\u7ebf\uff0c\u4e14LLM\u4e4b\u95f4\u66f4\u76f8\u4f3c\u800c\u975e\u66f4\u50cf\u4eba\u7c7b\u3002", "\u6240\u6709LLM\u90fd\u8868\u73b0\u51fa\u663e\u8457\u987a\u4ece\u6027\u504f\u79fb\uff08+0.84 SD\uff09\uff0c\u7528\u5408\u6210\u6570\u636e\u8bad\u7ec3\u7684\u56de\u5f52\u6a21\u578b\u5728\u4eba\u7c7b\u7559\u51fa\u96c6\u4e0a\u9884\u6d4b\u6548\u5ea6\u4e0b\u964d\uff0c\u5e76\u4f1a\u865a\u6784\u5b89\u6170\u5242\u4e2d\u4ecb\u6548\u5e94\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5408\u6210\u6570\u636e", "\u5fc3\u7406\u6d4b\u91cf", "\u793e\u4f1a\u79d1\u5b66"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14606v1", "published_at": "2026-07-06", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14606.png", "title": "Plausible but Not Valid: A Psychometric Audit of LLMs as Synthetic Survey Respondents", "tldr": "LLM\u5408\u6210\u95ee\u5377\u50cf\u4eba\u4f46\u5fc3\u7406\u6d4b\u91cf\u4e0a\u4e0d\u53ef\u9760", "upvotes": 2, "what_it_is": "\u8bba\u6587\u4ece\u5fc3\u7406\u6d4b\u91cf\u5b66\u89d2\u5ea6\u7cfb\u7edf\u5ba1\u8ba1LLM\u4f5c\u4e3a\u201c\u5408\u6210\u8c03\u67e5\u53d7\u8bbf\u8005\u201d\u7684\u6709\u6548\u6027\uff0c\u68c0\u9a8c\u5176\u662f\u5426\u80fd\u4fdd\u7559\u771f\u5b9e\u4eba\u7c7b\u95ee\u5377\u7684\u8054\u5408\u5206\u5e03\u3001\u6f5c\u5728\u7ed3\u6784\u3001\u4fe1\u5ea6\u3001\u4e2d\u4ecb\u8def\u5f84\u548c\u4eba\u53e3\u7edf\u8ba1\u6548\u5e94\u3002\u4f5c\u8005\u6784\u5efa\u7acb\u9676\u5b9b\u7ec4\u7ec7\u5fc3\u7406\u5b66\u6570\u636e\u96c6\uff0c\u5e76\u8bc4\u6d4b37\u4e2a\u95ed\u6e90\u4e0e\u5f00\u6e90\u6a21\u578b\u53ca\u591a\u79cd\u63d0\u793a\u3001\u4eba\u683c\u62ab\u9732\u548c\u53cd\u4e8b\u5b9e\u8bbe\u7f6e\u3002", "why_notable": "\u8fd9\u9879\u7814\u7a76\u5bf9\u201c\u7528LLM\u66ff\u4ee3\u4eba\u7c7b\u53d7\u8bbf\u8005\u201d\u63d0\u51fa\u4e86\u5f3a\u6709\u529b\u7684\u5b9e\u8bc1\u8b66\u793a\uff1a\u8868\u9762\u5408\u7406\u7684\u56de\u7b54\u5e76\u4e0d\u7b49\u4e8e\u5fc3\u7406\u6d4b\u91cf\u6709\u6548\u3002\u5b83\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u8bc4\u4f30\u6846\u67b6\u548c\u5927\u89c4\u6a21\u6a21\u578b\u5bf9\u6bd4\uff0c\u5bf9\u793e\u4f1a\u79d1\u5b66\u3001\u7ec4\u7ec7\u5fc3\u7406\u5b66\u548c\u5408\u6210\u6570\u636e\u5e94\u7528\u5177\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "Retrieval-augmented generation (RAG) is indispensable for enhancing large language models. However, RAGs are increasingly susceptible to poisoning attacks, in which adversarial documents are injected to manipulate generator outputs. Previous methods rely on output-side signals such as perplexity and consistency checks to detect such attacks. Nevertheless, our analysis reveals that deliberate attacks often induce false confidence, where poisoned outputs exhibit even lower perplexity than benign ones, rendering uncertainty-based detection ineffective. To address this challenge, we explore the internal dynamics of the generator and identify a distinctive signature termed \\textit{Attention Collapse}. Unlike the dispersed attention in benign generations, attacked generations exhibit a decrease in entropy as attention concentrates on poisoned documents. Building on these findings, we propose \\texttt{D-SCAN} (Document-level Signal Collapse Analysis), a lightweight detection framework that monitors attention dynamics to identify attacked generations. Extensive experiments on multiple attack benchmarks demonstrate the effectiveness of our method. Moreover, D-SCAN can detect attacks even when they fail to alter the final answer. Code is available at https://github.com/yingtaoren/D-Scan.git.", "arxiv_id": "2608.06947", "arxiv_url": "https://arxiv.org/abs/2608.06947", "authors": ["Yingtao Ren", "Ziyi Zhao", "Yiwei Fu", "Xiao Luo", "Yu-Cheng Chang", "Chin-Teng Lin"], "brief": "\u8bba\u6587\u53d1\u73b0RAG\u6295\u6bd2\u4f1a\u8ba9\u751f\u6210\u5668\u6ce8\u610f\u529b\u4ece\u6b63\u5e38\u7684\u5206\u6563\u72b6\u6001\u96c6\u4e2d\u5230\u6076\u610f\u6587\u6863\uff0c\u5f62\u6210\u201c\u6587\u6863\u7ea7\u6ce8\u610f\u529b\u584c\u7f29\u201d\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u8f7b\u91cf\u68c0\u6d4b\u6846\u67b6D-SCAN\uff0c\u901a\u8fc7\u76d1\u63a7\u6ce8\u610f\u529b\u71b5\u7b49\u5185\u90e8\u52a8\u6001\u8bc6\u522b\u88ab\u653b\u51fb\u751f\u6210\u3002", "categories": ["cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06947", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u57fa\u4e8e\u56f0\u60d1\u5ea6\u3001\u4e0d\u786e\u5b9a\u6027\u6216\u4e00\u81f4\u6027\u7b49\u8f93\u51fa\u4fa7\u68c0\u6d4b\u5728\u84c4\u610f\u6295\u6bd2\u4e0b\u4f1a\u5931\u6548\uff0c\u56e0\u4e3a\u6076\u610f\u8f93\u51fa\u53ef\u80fd\u5448\u73b0\u66f4\u4f4e\u56f0\u60d1\u5ea6\u548c\u201c\u865a\u5047\u81ea\u4fe1\u201d\u3002", "\u63d0\u51faAttention Collapse\u7279\u5f81\uff1a\u653b\u51fb\u6837\u672c\u4e2d\u6ce8\u610f\u529b\u71b5\u4e0b\u964d\uff0c\u6ce8\u610f\u529b\u663e\u8457\u96c6\u4e2d\u4e8e\u6295\u6bd2\u6587\u6863\u3002", "D-SCAN\u5728\u591a\u4e2aRAG\u6295\u6bd2\u653b\u51fb\u57fa\u51c6\u4e0a\u6709\u6548\uff0c\u4e14\u5373\u4f7f\u653b\u51fb\u672a\u6539\u53d8\u6700\u7ec8\u7b54\u6848\u4e5f\u80fd\u68c0\u6d4b\u5230\u5f02\u5e38\u3002"], "keywords": ["RAG", "\u5b89\u5168", "\u6ce8\u610f\u529b\u673a\u5236", "\u6295\u6bd2\u653b\u51fb"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06947v1", "published_at": "2026-08-07", "score": 0.225, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06947.png", "title": "When Context Bites: Detecting RAG Poisoning via Document-Level Attention Collapse", "tldr": "\u7528\u6ce8\u610f\u529b\u584c\u7f29\u68c0\u6d4bRAG\u6295\u6bd2\u653b\u51fb", "upvotes": 1, "what_it_is": "\u8bba\u6587\u53d1\u73b0RAG\u6295\u6bd2\u4f1a\u8ba9\u751f\u6210\u5668\u6ce8\u610f\u529b\u4ece\u6b63\u5e38\u7684\u5206\u6563\u72b6\u6001\u96c6\u4e2d\u5230\u6076\u610f\u6587\u6863\uff0c\u5f62\u6210\u201c\u6587\u6863\u7ea7\u6ce8\u610f\u529b\u584c\u7f29\u201d\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u8f7b\u91cf\u68c0\u6d4b\u6846\u67b6D-SCAN\uff0c\u901a\u8fc7\u76d1\u63a7\u6ce8\u610f\u529b\u71b5\u7b49\u5185\u90e8\u52a8\u6001\u8bc6\u522b\u88ab\u653b\u51fb\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aRAG\u5b89\u5168\u68c0\u6d4b\u4ece\u8f93\u51fa\u7ed3\u679c\u8f6c\u5411\u6a21\u578b\u5185\u90e8\u6ce8\u610f\u529b\u52a8\u6001\uff0c\u4e3a\u53d1\u73b0\u9690\u853d\u6295\u6bd2\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u3001\u8f7b\u91cf\u7684\u4fe1\u53f7\uff0c\u5bf9\u4f01\u4e1a\u7ea7RAG\u7cfb\u7edf\u7684\u5b89\u5168\u9632\u62a4\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Autonomous LLM agents that converse on a user\u0027s behalf are an emerging design pattern in matching platforms, yet their viability depends on a condition rarely examined: users must accept not only delegating conversation to an agent, but also receiving agent-mediated communication from others. We study this condition using two large-scale surveys of active users of a major dating platform (N=2,894 on generative profile features; N=2,617 on autonomous conversational agents, fielded in two languages). We develop a latent-variable measurement model of agent receptivity based on graded response models with latent regression, and show via model comparison that willingness to send and willingness to receive agent communication are distinct constructs: highly correlated (rho=0.92) but separable (Delta BIC=52), with partial measurement invariance across languages. The model quantifies a systematic delegation asymmetry: deploying one\u0027s own agent requires far lower receptivity (threshold -0.38) than engaging a counterpart\u0027s agent (+0.32; full engagement +1.39), and mean deployment propensity exceeds engagement propensity roughly threefold. Under a random-pairing counterfactual derived from stated receptivity, only 4-13% of directed dyads combine agent deployment with receiver engagement, with a pronounced gender-directional imbalance. Design counterfactuals quantify the levers: a reciprocity requirement cuts interaction volume by half or more by excluding nearly two-thirds of would-be deployment, while routing agent contacts on receive receptivity triples per-contact engagement, a lift that survives out-of-sample validation with the target item held out (AUC 0.88, 3.1x quartile lift under respondent-level cross-validation). We discuss implications for agentic recommender design, including disclosure, opt-in mechanics, and receptivity-aware matchmaking.", "arxiv_id": "2608.18058", "arxiv_url": "https://arxiv.org/abs/2608.18058", "authors": ["Daria Leshchikova", "Valentina V. Kuskova", "Dmitry Zaytsev", "Valerii Klimov"], "brief": "\u8bba\u6587\u7814\u7a76\u5728\u7ebf\u7ea6\u4f1a\u5e73\u53f0\u4e2d\u7528\u6237\u5bf9\u201c\u4ee3\u7406\u81ea\u5df1\u804a\u5929\u201d\u548c\u201c\u63a5\u6536\u4ed6\u4eba\u667a\u80fd\u4f53\u6d88\u606f\u201d\u7684\u53cc\u5411\u63a5\u53d7\u5ea6\u3002\u57fa\u4e8e\u4e24\u9879\u5927\u89c4\u6a21\u7528\u6237\u8c03\u67e5\u548c\u6f5c\u53d8\u91cf\u6a21\u578b\uff0c\u53d1\u73b0\u4e8c\u8005\u9ad8\u5ea6\u76f8\u5173\u4f46\u53ef\u533a\u5206\uff0c\u4e14\u5b58\u5728\u660e\u663e\u201c\u59d4\u6258\u4e0d\u5bf9\u79f0\u201d\uff1a\u7528\u6237\u66f4\u613f\u610f\u4f7f\u7528\u81ea\u5df1\u7684\u667a\u80fd\u4f53\uff0c\u5374\u8f83\u4e0d\u613f\u4e0e\u5bf9\u65b9\u667a\u80fd\u4f53\u4e92\u52a8\uff1b\u6309\u63a5\u53d7\u5ea6\u8def\u7531\u53ef\u663e\u8457\u63d0\u5347\u4e92\u52a8\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18058", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u8350\u7cfb\u7edf", "\u7528\u6237\u5efa\u6a21", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18058v1", "published_at": "2026-08-18", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Delegation Asymmetry in Agentic Recommender Systems: Measuring Two-Sided Receptivity in Online Dating", "tldr": "\u8bba\u6587\u7814\u7a76\u5728\u7ebf\u7ea6\u4f1a\u5e73\u53f0\u4e2d\u7528\u6237\u5bf9\u201c\u4ee3\u7406\u81ea\u5df1\u804a\u5929\u201d\u548c\u201c\u63a5\u6536\u4ed6\u4eba\u667a\u80fd\u4f53\u6d88\u606f\u201d\u7684\u53cc\u5411\u63a5\u53d7\u5ea6\u3002\u57fa\u4e8e\u4e24\u9879\u5927\u89c4\u6a21\u7528\u6237\u8c03\u67e5\u548c\u6f5c\u53d8\u91cf\u6a21\u578b\uff0c\u53d1\u73b0\u4e8c\u8005\u9ad8\u5ea6\u76f8\u5173\u4f46\u53ef\u533a\u5206\uff0c\u4e14\u5b58\u5728\u660e\u663e\u201c\u59d4\u6258\u4e0d\u5bf9\u79f0\u201d\uff1a\u7528\u6237\u66f4\u613f\u610f\u4f7f\u7528\u81ea\u5df1\u7684\u667a\u80fd\u4f53\uff0c\u5374\u8f83\u4e0d\u613f\u4e0e\u5bf9\u65b9\u667a\u80fd\u4f53\u4e92\u52a8\uff1b\u6309\u63a5\u53d7\u5ea6\u8def\u7531\u53ef\u663e\u8457\u63d0\u5347\u4e92\u52a8\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial superintelligence (ASI) requires AI to move beyond mastering existing knowledge toward exploring the unknown, creating new knowledge, and turning new ideas into verifiable results. However, the capabilities of today\u0027s AI systems are still largely built on learning, compressing, and applying existing human knowledge. Accordingly, existing benchmarks primarily test whether AI can produce correct answers based on learned knowledge, or whether it can complete tasks under extensive human guidance. We therefore introduce ASI-Bench, the first benchmark to jointly evaluate AI systems\u0027 capabilities of innovative exploration and autonomous scientific execution across general research domains, and the first to progressively withdraw human methodological guidance within the same research project to test how far AI can proceed on its own. Built by over 40 experts with the cost of 31,000+ human hours, ASI-Bench contains 60 project-level research tasks across 11 scientific domains and progressively reduces methodological guidance to test whether AI can independently select methods, conduct research, and produce verifiable results. All tasks undergo expert review, AI-assisted auditing, sandbox execution, and scorer validation. Across 18 state-of-the-art agent--model configurations, the average score drops from 50.91 with full methodological guidance to 29.10 with only the method specified and 26.62 when agents must determine the method themselves. This sharp decline shows that current systems remain heavily dependent on human guidance and are still far from autonomously conducting end-to-end, project-level scientific research. ASI-Bench is open to the world. We invite researchers and builders everywhere to contribute new tasks, challenge the limits of today\u0027s AI, and help accelerate humanity\u0027s collective path toward artificial superintelligence at https://asibench.apexin.ai/submit.", "arxiv_id": "2608.17271", "arxiv_url": "https://arxiv.org/abs/2608.17271", "authors": ["Junwei Zhou", "Zhen Sun", "Binyu Li", "Jiangyu Zhou", "Yuexi Pan", "Hengyu Wang", "Honghe Ren", "Xiaohan Jia", "Xueyang Zhou", "Xiaoyu Cao", "Yongchao Chen", "Yuanning Feng", "Junhao Wu", "Cheng Zhang", "Sijia Chen", "Haoyu Xue", "Chengsong You", "Huan Wang", "Koutian Wu", "Peigan Gao", "Jiakun Wu", "Wenzhe Li", "Ergan Shang", "Qingyuan Zheng", "Jingjing Zhou", "Ruixuan Jia", "Yan Xu", "Hongrui Zhang", "Xiao-Han Ma", "Zhengxiang Cheng", "Yuexing Hao", "Liting Mai", "Xianglin Ji", "Wenjun Zhang", "Zhuofan Chen", "Yixiao Huang", "Chi Wang", "Wenyue Hua", "Yilun Hao", "Yuantao Zhai", "Ziyan Zhao", "Jingyan Xie"], "brief": "\u8bba\u6587\u63d0\u51fa ASI-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u901a\u7528\u79d1\u7814\u9886\u57df\u7684\u9879\u76ee\u7ea7\u57fa\u51c6\uff0c\u7528\u4e8e\u8054\u5408\u8bc4\u4f30 AI \u76 SI-Bench\u8bc4\u6d4bAI\u81ea\u4e3b\u79d1\u7814\u80fd\u529b", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa ASI-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u901a\u7528\u79d1\u7814\u9886\u57df\u7684\u9879\u76ee\u7ea7\u57fa\u51c6\uff0c\u7528\u4e8e\u8054\u5408\u8bc4\u4f30 AI \u7684\u521b\u65b0\u63a2\u7d22\u4e0e\u81ea\u4e3b\u79d1\u5b66\u6267\u884c\u80fd\u529b\u3002\u5b83\u901a\u8fc7\u9010\u6b65\u64a4\u56de\u4eba\u7c7b\u65b9\u6cd5\u6307\u5bfc\uff0c\u6d4b\u8bd5\u6a21\u578b/\u667a\u80fd\u4f53\u80fd\u5426\u81ea\u884c\u9009\u65b9\u6cd5\u3001\u505a\u7814\u7a76\u5e76\u4ea7\u51fa\u53ef\u9a8c\u8bc1\u7ed3\u679c\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06\u8bc4\u6d4b\u91cd\u70b9\u4ece\u201c\u7b54\u5bf9\u5df2\u6709\u77e5\u8bc6\u95ee\u9898\u201d\u63a8\u8fdb\u5230\u201c\u80fd\u5426\u81ea\u4e3b\u5b8c\u6210\u7aef\u5230\u7aef\u79d1\u7814\u201d\uff0c\u76f4\u63a5\u63ed\u793a\u5f53\u524d AI \u5bf9\u4eba\u7c7b\u65b9\u6cd5\u6307\u5bfc\u7684\u5f3a\u4f9d\u8d56\uff0c\u5bf9\u8861\u91cf\u901a\u5411\u4eba\u5de5\u8d85\u7ea7\u667a\u80fd\u7684\u771f\u5b9e\u5dee\u8ddd\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Compute-optimal scaling laws guide the training of frontier language models yet remain largely unexplored for visual generation. We present a systematic scaling law study for text-to-image diffusion models using Abra, a controlled family of flow-matching transformers trained across three orders of magnitude worth of compute ($10^{19}$ to $10^{22}$ FLOPs), reaching significantly larger compute budgets than previous works. We demonstrate that diffusion models scale just as predictably as language models but require far more data to train optimally: compute optimality occurs at approximately $200$ image tokens per parameter, ten times the Chinchilla compute-optimal prescription for LLMs. We show that unlike language models, diffusion models are robust to overtraining and that practitioners should err on the side of more data rather than a larger model. Finally, we show that this predictability extends beyond training loss to generative quality metrics, optimal CFG settings, representation quality, and even the shape of the training curves, which collapse onto a universal form.", "arxiv_id": "2608.17286", "arxiv_url": "https://arxiv.org/abs/2608.17286", "authors": ["Kyle Chickering", "Wei-An Lin", "Swayam Bhanded", "Dan Saunders", "Akshat Tripathi", "Jiaming Song", "Shyamal Buch", "Xinchen Yan"], "brief": "\u8bba\u6587\u63d0\u51fa Abra\uff1a\u4e00\u7ec4\u53d7\u63a7\u7684 flow-matching Transformer \u6587\u751f\u56fe\u6269\u6563\u6a21\u578b\uff0c\u5e76\u5728 $10^{19}$ \u5230 $10^{22}$ FLOPs \u8de8\u4e09\u6570\u91cf\u7ea7\u7b97\u529b\u4e0b\u8bad\u7ec3\uff0c\u7528\u4e8e\u7814\u7a76\u6269\u6563\u56fe\u50cf\u751f\u6210\u7684 compute-optimal scaling laws\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17286", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u6269\u6563\u6a21\u578b\u50cf\u8bed\u8a00\u6a21\u578b\u4e00\u6837\u5177\u6709\u53ef\u9884\u6d4b\u7f29\u653e\u89c4\u5f8b\uff0c\u4f46\u6700\u4f18\u8bad\u7ec3\u9700\u8981\u7ea6\u6bcf\u53c2\u6570 200 \u4e2a\u56fe\u50cf token\uff0c\u662f Chinchilla \u5bf9 LLM \u5efa\u8bae\u7684\u7ea6 10 \u500d", "\u6269\u6563\u6a21\u578b\u5bf9\u8fc7\u5ea6\u8bad\u7ec3\u66f4\u9c81\u68d2\uff0c\u5b9e\u8df5\u4e2d\u5e94\u4f18\u5148\u589e\u52a0\u6570\u636e\u91cf\uff0c\u800c\u4e0d\u662f\u76f2\u76ee\u589e\u5927\u6a21\u578b\u89c4\u6a21", "\u7f29\u653e\u53ef\u9884\u6d4b\u6027\u4e0d\u4ec5\u4f53\u73b0\u5728\u8bad\u7ec3\u635f\u5931\uff0c\u4e5f\u5ef6\u4f38\u5230\u751f\u6210\u8d28\u91cf\u6307\u6807\u3001\u6700\u4f18 CFG \u8bbe\u7f6e\u3001\u8868\u5f81\u8d28\u91cf\u548c\u8bad\u7ec3\u66f2\u7ebf\u5f62\u72b6"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u7f29\u653e\u5f8b", "\u6587\u751f\u56fe", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": "Luma AI", "pdf_url": "https://arxiv.org/pdf/2608.17286 able from every arm, the control included, at 6.4-9.0x its selection-corrected floor. What produces the later readable form at the queried position is attention-mediated gathering inside a mid-depth window: separating patch depth from readout depth puts transport there at least 17x above anywhere shallower under non-saturating readouts, with no tested MLP output contributing positively inside it. Under the saturating percentile rank the same grid does not localise the window, which is a fact about that measure. An arm that needs the variable for nothing concentrates sevenfold less, so the window is demand-specific. That window has two measured edges, a survival failure below and destruction above, and it falls at the same fractional depth in a 64-layer hybrid and a 62-layer dense model from another family. We localise where the variable is installed and read, not the route from the passage, which transports nothing. But the readout is not a calibrated measure of use: three components move it to within 12% of one another and differ 7.4x in what they do to the answer.", "arxiv_id": "2608.15022", "arxiv_url": "https://arxiv.org/abs/2608.15022", "authors": ["Parsa Mazaheri"], "brief": "\u8bba\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u6f5c\u5728\u6570\u91cf\u5982\u4f55\u8fdb\u5165\u53ef\u88ab\u6a21\u578b\u62a5\u544a\u7684\u201c\u53ef\u8a00\u8bf4\u201d\u8868\u5f81\u5f62\u6001\u3002\u4f5c\u8005\u7528 Jacobian lenses \u5206\u6790\u5f00\u6e90\u6a21\u578b\uff0c\u53d1\u73b0\u5e76\u975e\u5b58\u5728\u7b80\u5355\u7684\u201c\u51c6\u5165\u95e8\u63a7\u201d\uff0c\u800c\u662f\u7531\u4e2d\u5c42\u6ce8\u610f\u529b\u7a97\u53e3\u6309\u4efb\u52a1\u9700\u6c42\u5c06\u53d8\u91cf\u6c47\u805a\u5230\u67e5\u8be2\u4f4d\u7f6e\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/parsa-mz/innerj", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.15022", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u5171\u4eab\u76f8\u understanding settings. Code is available at https://github.com/irajisamurai/2D-Motion-Interface.", "arxiv_id": "2608.15984", "arxiv_url": "https://arxiv.org/abs/2608.15984", "authors": ["Kaname Yokoyama", "Norimichi Ukita"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5373\u63d2\u5373\u7528\u76842D Motion Interface\uff0c\u4f7f\u539f\u672c\u57fa\u4e8e3D\u52a8\u4f5c\u9884\u8bad\u7ec3\u7684\u52a8\u4f5c\u8bed\u8a00\u6a21\u578b\u65e0\u9700\u4fee\u6539\u6216\u5fae\u8c03\u5373\u53ef\u63a5\u65362D\u52a8\u4f5c\u8f93\u5165\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u5355\u76ee\u771f\u5b9e\u89c6\u9891\u52a8\u4f5c\u8bc4\u6d4b\u96c6\uff0c\u5e76\u52a0\u5165real-video adapter\u9a8c\u8bc1\u771f\u5b9e\u573a\u666f\u9002\u7528\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/irajisamurai/2D-Motion-Interface", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.15984", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc72D\u52a8\u4f5c\u63a5\u53e3\u8fde\u63a53D motion tokenization\u6d41\u7a0b\uff0c\u590d\u7528\u5df2\u67093D\u9884\u8bad\u7ec3MoLM\u80fd\u529b", "\u5728\u516c\u5f00\u6570\u636e\u96c6\u4e0a\uff0c\u591a\u79cdMoLM\u4f7f\u75282D\u8f93\u5165\u53ef\u8fbe\u5230\u63a5\u8fd13D\u8f93\u5165\u7684\u8868\u73b0\uff0c\u5e76\u4f18\u4e8e\u4ece\u96f6\u8bad\u7ec32D MoLM", "\u5728\u5355\u76ee\u771f\u5b9e\u89c6\u9891\u4e0e\u59ff\u6001\u4f30\u8ba1\u8bbe\u7f6e\u4e0b\uff0c2D\u52a8\u4f5c\u6bd4\u4f30\u8ba1\u51fa\u76843D\u52a8\u4f5c\u66f4\u5b9e\u7528\u3001\u66f4\u7a33\u5b9a"], "keywords": ["\u52a8\u4f5c\u7406\u89e3", "\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u59ff\u6001\u4f30\u8ba1"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15984v1", "published_at": "2026-08-17", "score": 0.21, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15984.png", "title": "A Plug-and-Play 2D Motion Interface for Real-World Motion Language Models", "tldr": "\u75282D\u52a8\u4f5c\u65e0\u7f1d\u63a5\u51653D\u9884\u8bad\u7ec3MoLM", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5373\u63d2\u5373\u7528\u76842D Motion Interface\uff0c\u4f7f\u539f\u672c\u57fa\u4e8e3D\u52a8\u4f5c\u9884\u8bad\u7ec3\u7684\u52a8\u4f5c\u8bed\u8a00\u6a21\u578b\u65e0\u9700\u4fee\u6539\u6216\u5fae\u8c03\u5373\u53ef\u63a5\u65362D\u52a8\u4f5c\u8f93\u5165\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u5355\u76ee\u771f\u5b9e\u89c6\u9891\u52a8\u4f5c\u8bc4\u6d4b\u96c6\uff0c\u5e76\u52a0\u5165real-video adapter\u9a8c\u8bc1\u771f\u5b9e\u573a\u666f\u9002\u7528\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u964d\u4f4e\u4e86MoLM\u5728\u771f\u5b9e\u5355\u76ee\u89c6\u9891\u4e2d\u7684\u90e8\u7f72\u95e8\u69db\uff0c\u907f\u514d\u4f9d\u8d56\u9ad8\u8d28\u91cf3D\u52a8\u4f5c\u91cd\u5efa\uff0c\u4e5f\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u5927\u6a21\u578b\uff0c\u5bf9\u73b0\u5b9e\u89c6\u9891\u52a8\u4f5c\u7406\u89e3\u5e94\u7528\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Learning to generate or reconstruct explorable worlds requires video paired with more than RGB: camera motion, scene geometry, temporal correspondence and, for interactive models, control signals. Real capture can provide some of these signals, but dense geometry and long-range correspondence usually rely on estimation or specialised instrumentation. Rendering provides these quantities directly, yet existing synthetic resources rarely combine them on the same frames while also supporting controlled changes of viewpoint and appearance. We introduce WorldRover, a data engine for generating richly annotated, long-range explorations of artist-built environments. At its core, WorldRover-Engine is an Unreal Engine pipeline that executes and offline-renders minute-scale routes while preserving their full trajectories and scene geometry. The same exploration can be replayed from first-person, third-person, and 360 panoramic cameras under different environmental states. Using WorldRover-Engine, we construct WorldRover-10M, whose sequences pair RGB with metric depth, camera trajectories, and trajectory-derived action signals throughout each exploration. Third-person subsets additionally provide dense optical flow, long-range 2D/3D point tracks with visibility, and a character trajectory distinct from the camera trajectory. The engine can render a traversal from first-person, third-person and 360 panoramic viewpoints, under different environmental states or with a neutral white material, while preserving the route and scene geometry. WorldRover therefore turns long-horizon world exploration into a scalable data-generation problem, providing supervision for models that must build, maintain, and revisit coherent representations of an explorable world.", "arxiv_id": "2608.15659", "arxiv_url": "https://arxiv.org/abs/2608.15659", "authors": ["Xiaojie Xu", "Zhengyuan Lin", "Runyi Li", "Yihao Liu", "Kaipeng Zhang", "Yongtao Ge"], "brief": "\u8bba\u6587\u63d0\u51fa WorldRover\uff0c\u4e00\u4e2a\u57fa\u4e8e Unreal Engine \u7684\u5408\u6210\u89c6\u9891\u6570\u636e\u5f15\u64ce\uff0c\u53ef\u79bb\u7ebf\u6e32\u67d3\u5206\u949f\u7ea7\u73af\u5883\u63a2\u7d22\u8f68\u8ff9\u3002\u5b83\u6784\u5efa\u4e86 WorldRover-10M\uff0c\u5c06 RGB \u89c6\u9891\u4e0e\u6df1\u5ea6\u3001\u76f8\u673a\u8f68\u8ff9\u3001\u52a8\u4f5c\u4fe1\u53f7\u3001\u5149\u6d41\u548c\u957f\u7a0b\u70b9\u8f68\u8ff9\u7b49\u6807\u6ce8\u5bf9\u9f50\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.15659", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u540c\u4e00\u8def\u5f84\u53ef\u4ece\u7b2c\u4e00\u4eba\u79f0\u3001\u7b2c\u4e09\u4eba\u79f0\u548c 360 \u5168\u666f\u89c6\u89d2\u91cd\u653e\uff0c\u5e76\u652f\u6301\u4e0d\u540c\u73af\u5883\u72b6\u6001\u548c\u767d\u6a21\u6750\u8d28\u6e32\u67d3", "WorldRover-10M \u63d0\u4f9b\u5ea6\u91cf\u6df1\u5ea6\u3001\u5b8c\u6574\u76f8\u673a\u8f68\u8ff9\u548c\u7531\u8f68\u8ff9\u5bfc\u51fa\u7684\u52a8\u4f5c\u4fe1\u53f7\uff0c\u670d\u52a1\u4e8e\u53ef\u63a2\u7d22\u4e16\u754c\u5efa\u6a21", "\u7b2c\u4e09\u4eba\u79f0\u5b50\u96c6\u989d\u5916\u5305\u542b\u7a20\u5bc6\u5149\u6d41\u3001\u957f\u7a0b 2D/3D \u70b9\u8f68\u8ff9\u3001\u53ef\u89c1\u6027\u6807\u6ce8\uff0c\u4ee5\u53ca\u4e0e\u76f8\u673a\u8f68\u8ff9\u4e0d\u540c\u7684\u89d2\u8272\u8f68\u8ff9"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5408\u6210\u6570\u636e", "\u89c6\u9891\u751f\u6210", "\u4e09\u7ef4\u89c6\u89c9"], "num_comments": 2, "on_hf": true, "organization": "Alaya Lab", "pdf_url": "https://arxiv.org/pdf/2608.15659v1", "published_at": "2026-08-16", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15659.png", "title": "WorldRover: A Scalable Synthetic Video Data Engine for World Exploration with Rich Annotations", "tldr": "\u53ef\u6269\u5c55\u751f\u6210\u5e26\u4e30\u5bcc\u6807\u6ce8\u7684\u957f\u7a0b\u4e16\u754c\u63a2\u7d22\u89c6\u9891", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldRover\uff0c\u4e00\u4e2a\u57fa\u4e8e Unreal Engine \u7684\u5408\u6210\u89c6\u9891\u6570\u636e\u5f15\u64ce\uff0c\u53ef\u79bb\u7ebf\u6e32\u67d3\u5206\u949f\u7ea7\u73af\u5883\u63a2\u7d22\u8f68\u8ff9\u3002\u5b83\u6784\u5efa\u4e86 WorldRover-10M\uff0c\u5c06 RGB \u89c6\u9891\u4e0e\u6df1\u5ea6\u3001\u76f8\u673a\u8f68\u8ff9\u3001\u52a8\u4f5c\u4fe1\u53f7\u3001\u5149\u6d41\u548c\u957f\u7a0b\u70b9\u8f68\u8ff9\u7b49\u6807\u6ce8\u5bf9\u9f50\u3002", "why_notable": "\u5b83\u628a\u771f\u5b9e\u91c7\u96c6\u96be\u4ee5\u83b7\u5f97\u7684\u957f\u7a0b\u51e0\u4f55\u3001\u5bf9\u5e94\u5173\u7cfb\u548c\u63a7\u5236\u4fe1\u53f7\u8f6c\u5316\u4e3a\u53ef\u89c4\u6a21\u5316\u6e32\u67d3\u95ee\u9898\uff0c\u4e3a\u4e16\u754c\u6a21\u578b\u3001\u89c6\u9891\u751f\u6210\u548c\u4e09\u7ef4\u91cd\u5efa\u63d0\u4f9b\u9ad8\u8d28\u91cf\u76d1\u7763\u6570\u636e\u3002"}, {"abstract": "Large language model-based agents are increasingly deployed as collaborators in scientific discovery yet most current work focuses on the autonomous capabilities of \"AI Scientists\". We argue that this overlooks the social aspects of scientific teamwork, and that studying AI Scientists as human-agent systems (HAS)--where the unit of analysis is the human-agent pair--is both underexplored and undervalued. We establish these points through literature and empirical analysis, and highlight recent incidences and studies which show that deploying agents in science without accounting for human-agent dynamics introduces near-term risks, including reduced diversity of scientific inquiry. Through analysis of real-world case studies, we show that scientists and agents can augment each other\u0027s capabilities. We call for new research that adopts the HAS lens to develop mathematical frameworks for understanding and fostering human-AI synergy in scientific discovery.", "arxiv_id": "2608.14667", "arxiv_url": "https://arxiv.org/abs/2608.14667", "authors": ["Patrick Emami", "Sameera Horawalavithana", "Truc Nguyen", "Gihan Panapitiya", "Bruno Jacob", "Siddhisanket Raskar", "Saumya Sinha", "Jared D. Willard", "Andrew Glaws", "Nithin Somasekharan", "Ling Yue", "Brian Lu", "Shaowu Pan", "Jason Eisner"], "brief": "\u672c\u6587\u662f\u4e00\u7bc7\u7acb\u573a\u8bba\u6587\uff0c\u6279\u8bc4\u5f53\u524d\u8fc7\u5ea6\u5173\u6ce8\u201cAI\u79d1\u5b66\u5bb6\u201d\u7684\u81ea\u4e3b\u80fd\u529b\uff0c\u800c\u5ffd\u89c6\u5176\u4e0e\u4eba\u7c7b\u79d1\u5b66\u5bb6\u534f\u4f5c\u65f6\u7684\u793e\u4f1a\u4e0e\u56e2\u961f\u52a8\u6001\u3002\u4f5c\u8005\u4e3b\u5f20\u4ee5\u4eba\u673a\u7cfb\u7edf\uff08HAS\uff09\u4e3a\u5206\u6790\u5355\u5143\uff0c\u7814\u7a76\u79d1\u5b66\u53d1\u73b0\u4e2d\u7684\u4eba\u7c7b-\u667a\u80fd\u4f53\u534f\u540c\u3002", "categories": ["cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14667", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u901a\u8fc7\u6587\u732e\u4e0e\u5b9e\u8bc1\u5206\u6790\u6307\u51fa\uff0c\u79d1\u5b66\u667a\u80fd\u4f53\u90e8\u7f72\u4e2d\u7684\u4eba\u673a\u4e92\u52a8\u7ef4\u5ea6\u4ecd\u88ab\u4f4e\u4f30", "\u603b\u7ed3\u771f\u5b9e\u6848\u4f8b\u663e\u793a\uff0c\u5ffd\u89c6\u4eba\u673a\u52a8\u6001\u53ef\u80fd\u5e26\u6765\u8fd1\u671f\u98ce\u9669\uff0c\u5982\u79d1\u5b66\u95ee\u9898\u63a2\u7d22\u591a\u6837\u6027\u4e0b\u964d", "\u547c\u5401\u5efa\u7acb\u6570\u5b66\u6846\u67b6\uff0c\u7528\u4e8e\u7406\u89e3\u3001\u5ea6\u91cf\u5e76\u4fc3\u8fdb\u79d1\u5b66\u53d1\u73b0\u4e2d\u7684\u4eba\u7c7b-AI\u534f\u540c"], "keywords": ["\u667a\u80fd\u4f53", "\u4eba\u673a\u534f\u540c", "AI\u79d1\u5b66\u5bb6", "\u79d1\u5b66\u53d1\u73b0"], "num_comments": 2, "on_hf": true, "organization": "National Laboratory of the Rockies", "pdf_url": "https://arxiv.org/pdf/2608.14667v1", "published_at": "2026-08-02", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14667.png", "title": "Position: AI Agents in Scientific Teams Should Be Studied as Human-Agent Systems", "tldr": "\u4e3b\u5f20\u5c06AI\u79d1\u5b66\u5bb6\u4f5c\u4e3a\u4eba\u673a\u7cfb\u7edf\u7814\u7a76", "upvotes": 1, "what_it_is": "\u672c\u6587\u662f\u4e00\u7bc7\u7acb\u573a\u8bba\u6587\uff0c\u6279\u8bc4\u5f53\u524d\u8fc7\u5ea6\u5173\u6ce8\u201cAI\u79d1\u5b66\u5bb6\u201d\u7684\u81ea\u4e3b\u80fd\u529b\uff0c\u800c\u5ffd\u89c6\u5176\u4e0e\u4eba\u7c7b\u79d1\u5b66\u5bb6\u534f\u4f5c\u65f6\u7684\u793e\u4f1a\u4e0e\u56e2\u961f\u52a8\u6001\u3002\u4f5c\u8005\u4e3b\u5f20\u4ee5\u4eba\u673a\u7cfb\u7edf\uff08HAS\uff09\u4e3a\u5206\u6790\u5355\u5143\uff0c\u7814\u7a76\u79d1\u5b66\u53d1\u73b0\u4e2d\u7684\u4eba\u7c7b-\u667a\u80fd\u4f53\u534f\u540c\u3002", "why_notable": "\u8be5\u6587\u5c06AI\u79d1\u5b66\u5bb6\u7814\u7a76\u4ece\u201c\u5355\u4f53\u81ea\u4e3b\u667a\u80fd\u201d\u8f6c\u5411\u201c\u4eba\u673a\u534f\u4f5c\u7cfb\u7edf\u201d\uff0c\u6709\u52a9\u4e8e\u66f4\u73b0\u5b9e\u5730\u8bc4\u4f30\u79d1\u5b66\u667a\u80fd\u4f53\u7684\u4ef7\u503c\u4e0e\u98ce\u9669\uff0c\u5e76\u4e3a\u672a\u6765\u79d1\u5b66\u56e2\u961f\u4e2d\u7684AI\u90e8\u7f72\u63d0\u4f9b\u7814\u7a76\u8303\u5f0f\u3002"}, {"abstract": "Per-field accept/review with selective risk at most alpha -- accept a field only if the error rate among accepted fields is controlled -- is the trust contract document-extraction systems need, and the natural procedure silently violates it on real documents. On 13,859 genuine claude-sonnet-5 fields from 800 CORD receipts (49.0% correct) we diagnose three failure modes: document clustering (design effect 1.84-2.45), score-refit leakage (coverage 0.416 at risk 0.127, violating alpha=0.10 in 95% of splits), and a tie-mass pathology (a degenerate score collapses the threshold grid, 0.030 to 0.001). We organize the fixes as a validity ladder, guarantee form stated per tier. A fit/val split protocol restores expected-selective-risk control for a learned fusion: coverage 0.318 at risk 0.096 at nominal alpha=0.10, no tolerance band (production variant 0.326) -- an on-average point whose realized risk exceeds alpha in 47.5% of resplits, not a certificate. Mondrian Learn-then-Test with exact binomial tails yields per-group PAC certificates: field-iid 0.171 at risk 0.068, cluster-corrected 0.140, doc-iid 0.060 -- the only tier matching documents, honestly near-vacuous today. Support-bin, the pre-specified provenance taxonomy, wins every rigor tier on the sonnet CORD capture (p\u003c1e-4, Bonferroni-corrected) -- a win that does not replicate on the same documents under haiku or qwen -- while on higher-accuracy corpora pooled thresholds win: conditioning helps exactly where pooled cannot certify, subsumed by a learned score elsewhere. A frozen-configuration confirmation on selection-untouched claude-haiku-4-5 held at both risk levels, and a blind three-annotator human-gold audit verifies the practical tier\u0027s accepted-set risk at 1.3% against its 10% budget (Fleiss\u0027 kappa=0.83; labels err one-sidedly pessimistic). Released Apache-2.0 with seed-pinned, regression-gated procedures.", "arxiv_id": "2608.14639", "arxiv_url": "https://arxiv.org/abs/2608.14639", "authors": ["Bhaskar Gurram"], "brief": "\u8bba\u6587\u7814\u7a76\u6587\u6863\u62bd\u53d6\u4e2d\u7684\u9010\u5b57\u6bb5\u201c\u63a5\u53d7/\u590d\u6838\u201d\u9009\u62e9\u6027\u98ce\u9669\u63a7\u5236\uff0c\u6307\u51fa\u5e38\u89c1\u505a\u6cd5\u5728\u771f\u5b9e\u6587\u6863\u4e0a\u4f1a\u5931\u6548\u3002\u4f5c\u8005\u8bca\u65ad\u4e09\u7c7b\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa\u4ece\u7ecf\u9a8c\u63a7\u5236\u5230PAC\u8bc1\u4e66\u7684\u201c\u6709\u6548\u6027\u9636\u68af\u201d\u53ca\u76f8\u5e94\u6d41\u7a0b\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14639", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728800\u4efdCORD\u6536\u636e\u300113859\u4e2aClaude Sonnet\u62bd\u53d6\u5b57\u6bb5\u4e0a\u53d1\u73b0\u4e09\u7c7b\u95ee\u9898\uff1a\u6587\u6863\u805a\u7c7b\u3001\u5206\u6570\u91cd\u62df\u5408\u6cc4\u6f0f\u3001\u9608\u503c\u5e73\u5c40\u8d28\u91cf\u75c5\u6001\u3002", "fit/val\u62c6\u5206\u53ef\u6062\u590d\u671f\u671b\u610f\u4e49\u4e0b\u7684\u9009\u62e9\u6027\u98ce\u9669\u63a7\u5236\uff0c\u4f46\u5355\u6b21\u91cd\u91c7\u6837\u4e2d\u4ecd\u53ef\u80fd\u9891\u7e41\u8d85\u8fc7\u76ee\u6807\u98ce\u9669\uff0c\u5e76\u975e\u4e25\u683c\u8bc1\u4e66\u3002", "Mondrian Learn-then-Test\u7ed3\u5408\u7cbe\u786e\u4e8c\u9879\u5c3e\u754c\u53ef\u7ed9\u51fa\u5206\u7ec4PAC\u8bc1\u4e66\uff1b\u6587\u6863\u7ea7\u72ec\u7acb\u6821\u6b63\u6700\u4e25\u8c28\u4f46\u5f53\u524d\u8986\u76d6\u7387\u8f83\u4f4e\u3002"], "keywords": ["\u6587\u6863\u62bd\u53d6", "\u98ce\u9669\u63a7\u5236", "\u9009\u62e9\u6027\u9884\u6d4b", "\u7f6e\u4fe1\u6821\u51c6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14639v1", "published_at": "2026-07-28", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14639.png", "title": "Valid Per-Field Selective Risk Control for Document Extraction: Three Failure Modes, a Validity Ladder, and When Conditioning Pays", "tldr": "\u4e3a\u6587\u6863\u62bd\u53d6\u5efa\u7acb\u6709\u6548\u9010\u5b57\u6bb5\u98ce\u9669\u63a7\u5236", "upvotes": 1, "what_it_is": "\u8bba\u6587\u7814\u7a76\u6587\u6863\u62bd\u53d6\u4e2d\u7684\u9010\u5b57\u6bb5\u201c\u63a5\u53d7/\u590d\u6838\u201d\u9009\u62e9\u6027\u98ce\u9669\u63a7\u5236\uff0c\u6307\u51fa\u5e38\u89c1\u505a\u6cd5\u5728\u771f\u5b9e\u6587\u6863\u4e0a\u4f1a\u5931\u6548\u3002\u4f5c\u8005\u8bca\u65ad\u4e09\u7c7b\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa\u4ece\u7ecf\u9a8c\u63a7\u5236\u5230PAC\u8bc1\u4e66\u7684\u201c\u6709\u6548\u6027\u9636\u68af\u201d\u53ca\u76f8\u5e94\u6d41\u7a0b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6587\u6863\u62bd\u53d6\u7cfb\u7edf\u4e2d\u201c\u4f4e\u7f6e\u4fe1\u5ea6\u4ea4\u7ed9\u4eba\u5de5\u590d\u6838\u201d\u7684\u98ce\u9669\u627f\u8bfa\u5f62\u5f0f\u5316\uff0c\u5e76\u63ed\u793a\u771f\u5b9e\u90e8\u7f72\u4e2d\u5bb9\u6613\u88ab\u5ffd\u89c6\u7684\u7edf\u8ba1\u5931\u6548\u6765\u6e90\uff0c\u5bf9\u9ad8\u53ef\u9760\u4fe1\u606f\u62bd\u53d6\u4e0e\u4eba\u673a\u534f\u4f5c\u5ba1\u6838\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present MoNe, a lightweight modular neural memory that attaches to any frozen pretrained Transformer to enable long-context inference without retraining. MoNe reads context in fixed-size segments via test-time learning of fast-weight neural memory networks with layer-localized gradient updates; at inference, the memory generates keys and values from the query tokens alone, with no context tokens re-read. This two-phase design decouples inference cost from context length, achieving $O(N)$ preprocessing and $O(1)$ query cost with peak GPU memory that does not grow with $N$. At 128K tokens, MoNe reduces both compute and peak GPU memory by approximately 80% compared to ICL with only 6.4% parameter overhead. MoNe generalizes to context lengths far beyond the backbone\u0027s native window, achieving strong performance on needle-in-a-haystack and word extraction benchmarks from RULER, where ICL degrades sharply.", "arxiv_id": "2608.17616", "arxiv_url": "https://arxiv.org/abs/2608.17616", "authors": ["Wonguk Cho", "Kyubyung Chae", "Tribhuvanesh Orekondy", "Sunghyun Park", "Hyoungwoo Park", "Jeongho Kim", "Arash Behboodi", "Kyuwoong Hwang", "Sungrack Yun"], "brief": "MoNe \u662f\u4e00\u79cd\u53ef\u63a5\u5165\u4efb\u610f\u51bb\u7ed3\u9884\u8bad\u7ec3 Transformer \u7684\u6a21\u5757\u5316\u795e\u7ecf\u8bb0\u5fc6\u673a\u5236\uff0c\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u5373\u53ef\u652f\u6301\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u3002\u5b83\u901a\u8fc7\u6d4b\u8bd5\u65f6\u5b66\u4e60\u5c06\u957f\u4e0a\u4e0b\u6587\u5199\u5165\u5feb\u901f\u6743\u91cd\u8bb0\u5fc6\u7f51\u7edc\uff0c\u67e5\u8be2\u9636\u6bb5\u4ec5\u7531\u67e5\u8be2 token \u751f\u6210\u952e\u503c\uff0c\u4e0d\u518d\u91cd\u8bfb\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17616", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u4e24\u9636\u6bb5\u8bbe\u8ba1\uff1a\u56fa\u5b9a\u957f\u5ea6\u5206\u6bb5\u8bfb\u53d6\u4e0a\u4e0b\u6587\u5e76\u66f4\u65b0\u5c42\u5185\u5c40\u90e8\u8bb0\u5fc6\uff0c\u67e5\u8be2\u65f6\u76f4\u63a5\u4ece\u8bb0\u5fc6\u751f\u6210 keys/values", "\u5b9e\u73b0 O(N) \u9884\u5904\u7406\u4e0e O(1) \u67e5\u8be2\u6210\u672c\uff0c\u5cf0\u503c GPU \u663e\u5b58\u4e0d\u968f\u4e0a\u4e0b\u6587\u957f\u5ea6\u589e\u957f", "\u5728 128K token \u4e0b\u76f8\u8f83\u666e\u901a ICL \u7ea6\u51cf\u5c11 80% \u8ba1\u7b97\u4e0e\u663e\u5b58\uff0c\u4ec5\u589e\u52a0 6.4% \u53c2\u6570\u5f00\u9500"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u795e\u7ecf\u8bb0\u5fc6", "Transformer", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17616v1", "published_at": "2026-08-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MoNe: Modular Neural Memory for Efficient Long Context Inference", "tldr": "\u4e3a\u51bb\u7ed3Transformer\u5916\u6302\u8f7b\u91cf\u795e\u7ecf\u8bb0\u5fc6\uff0c\u5b9e\u73b0\u9ad8\u6548\u957f\u4e0a\u4e0b\u6587\u63a8\u7406", "upvotes": 0, "what_it_is": "MoNe \u662f\u4e00\u79cd\u53ef\u63a5\u5165\u4efb\u610f\u51bb\u7ed3\u9884\u8bad\u7ec3 Transformer \u7684\u6a21\u5757\u5316\u795e\u7ecf\u8bb0\u5fc6\u673a\u5236\uff0c\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u5373\u53ef\u652f\u6301\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u3002\u5b83\u901a\u8fc7\u6d4b\u8bd5\u65f6\u5b66\u4e60\u5c06\u957f\u4e0a\u4e0b\u6587\u5199\u5165\u5feb\u901f\u6743\u91cd\u8bb0\u5fc6\u7f51\u7edc\uff0c\u67e5\u8be2\u9636\u6bb5\u4ec5\u7531\u67e5\u8be2 token \u751f\u6210\u952e\u503c\uff0c\u4e0d\u518d\u91cd\u8bfb\u4e0a\u4e0b\u6587\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u63d0\u4f9b\u4e86\u65e0\u9700\u5fae\u8c03\u9aa8\u5e72\u6a21\u578b\u7684\u9ad8\u6548\u5916\u6302\u5f0f\u65b9\u6848\uff0c\u80fd\u7a81\u7834\u539f\u751f\u7a97\u53e3\u9650\u5236\uff0c\u5e76\u5728 RULER \u7684 needle-in-a-haystack \u4e0e\u8bcd\u62bd\u53d6\u4efb\u52a1\u4e0a\u4fdd\u6301\u5f3a\u6027\u80fd\uff0c\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models are increasingly deployed through agent harnesses that manage tools, extensions, persistent state, permissions, and external actions. Existing safety benchmarks mainly target individual attack mechanisms or a limited subset of operational settings, making it difficult to compare how safety failures emerge across different harness responsibilities. We present HarnessRisk, a lifecycle oriented benchmark that organizes agent harness safety into six operational phases including Harness Configuration, Capability Extension, Runtime Operation, State Persistence, Action Control, and Incident Recovery. HarnessRisk contains 128 sandboxed cases, each pairing a benign user objective with an adversarial instruction embedded in an untrusted workflow artifact. We evaluate each trajectory using Utility, Attack Success Rate, Persistence, and Detection. Across three harnesses, six language models, and 14 model and harness configurations, attack success ranges from 12.6% to 80.9%, while Utility remains between 75.0% and 97.6%. Harness Configuration is the most vulnerable phase across all three harnesses, showing that attacks can succeed by altering security sensitive parameters within otherwise authorized workflows. We also find that explicit risk recognition does not reliably lead to safe action, as some configurations detect risks in more than 90% of runs while retaining substantial attack success. These results highlight the need to evaluate agent safety across multiple harness responsibilities and at the level of the deployed model and harness configuration.", "arxiv_id": "2608.17597", "arxiv_url": "https://arxiv.org/abs/2608.17597", "authors": ["Yajing Bai", "Jinhao Duan", "Jie Peng", "Xianfeng Wu", "Sijia Liu", "Song Wang", "Tianlong Chen"], "brief": "\u8bba\u6587\u63d0\u51fa HarnessRisk\uff0c\u4e00\u4e2a\u6309\u667a\u80fd\u4f53 harness \u8fd0\u884c\u751f\u547d\u5468\u671f\u7ec4\u7ec7\u7684\u5b89\u5168\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u914d\u7f6e\u3001\u6269\u5c55\u3001\u8fd0\u884c\u3001\u6301\u4e45\u5316\u3001\u884c\u52a8\u63a7\u5236\u548c\u4e8b\u6545\u6062\u590d\u516d\u4e2a\u9636\u6bb5\u3002\u57fa\u51c6\u5305\u542b128\u4e2a\u6c99\u7bb1\u6848\u4f8b\uff0c\u5c06\u6b63\u5e38\u7528\u6237\u76ee\u6807\u4e0e\u5d4c\u5165\u4e0d\u53ef\u4fe1\u5de5\u4f5c\u6d41\u5de5\u4ef6\u7684\u5bf9\u6297\u6307\u4ee4\u914d\u5bf9\uff0c\u7528\u4e8e\u8bc4\u4f30\u771f\u5b9e\u90e8\u7f72\u914d\u7f6e\u4e0b\u7684\u5b89\u5168\u5931\u6548\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17597", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8bc4\u6d4b\u6307\u6807\u5305\u62ec Utility\u3001Attack Success Rate\u3001Persistence \u548c Detection\uff0c\u53ef\u540c\u65f6\u8861\u91cf\u4efb\u52a1\u5b8c\u6210\u3001\u653b\u51fb\u6210\u529f\u3001\u6076\u610f\u72b6\u6001\u5ef6\u7eed\u4e0e\u98ce\u9669\u8bc6\u522b\u3002", "\u57283\u79cd harness\u30016\u4e2a\u8bed\u8a00\u6a21\u578b\u300114\u79cd\u6a21\u578b\u4e0e harness \u914d\u7f6e\u4e0a\uff0c\u653b\u51fb\u6210\u529f\u7387\u4ece12.6%\u523080.9%\u4e0d\u7b49\uff0c\u800c Utility \u4ecd\u4fdd\u630175.0%\u523097.6%\u3002", "Harness Configuration \u662f\u6700\u8106\u5f31\u9636\u6bb5\uff0c\u4e14\u9ad8\u98ce\u9669\u8bc6\u522b\u7387\u5e76\u4e0d\u5fc5\u7136\u5e26\u6765\u5b89\u5168\u884c\u4e3a\uff1a\u90e8\u5206\u914d\u7f6e\u68c0\u6d4b\u7387\u8d85\u8fc790%\u4f46\u4ecd\u6709\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u8bc4\u6d4b", "\u5de5\u5177\u4f7f\u7528", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17597v1", "published_at": "2026-08-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HarnessRisk: A Lifecycle-Oriented Benchmark for Agent Harness Safety", "tldr": "\u9762\u5411\u667a\u80fd\u4f53\u5de5\u5177\u6846\u67b6\u7684\u5168\u751f\u547d\u5468\u671f\u5b89\u5168\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HarnessRisk\uff0c\u4e00\u4e2a\u6309\u667a\u80fd\u4f53 harness \u8fd0\u884c\u751f\u547d\u5468\u671f\u7ec4\u7ec7\u7684\u5b89\u5168\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u914d\u7f6e\u3001\u6269\u5c55\u3001\u8fd0\u884c\u3001\u6301\u4e45\u5316\u3001\u884c\u52a8\u63a7\u5236\u548c\u4e8b\u6545\u6062\u590d\u516d\u4e2a\u9636\u6bb5\u3002\u57fa\u51c6\u5305\u542b128\u4e2a\u6c99\u7bb1\u6848\u4f8b\uff0c\u5c06\u6b63\u5e38\u7528\u6237\u76ee\u6807\u4e0e\u5d4c\u5165\u4e0d\u53ef\u4fe1\u5de5\u4f5c\u6d41\u5de5\u4ef6\u7684\u5bf9\u6297\u6307\u4ee4\u914d\u5bf9\uff0c\u7528\u4e8e\u8bc4\u4f30\u771f\u5b9e\u90e8\u7f72\u914d\u7f6e\u4e0b\u7684\u5b89\u5168\u5931\u6548\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u5b89\u5168\u8bc4\u6d4b\u4ece\u5355\u4e00\u653b\u51fb\u673a\u5236\u6269\u5c55\u5230\u90e8\u7f72\u751f\u547d\u5468\u671f\u548c harness \u8d23\u4efb\u8fb9\u754c\uff0c\u6709\u52a9\u4e8e\u7cfb\u7edf\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u3001\u5de5\u5177\u6846\u67b6\u548c\u6743\u9650\u914d\u7f6e\u4e0b\u7684\u5b9e\u9645\u98ce\u9669\uff0c\u5bf9\u4f01\u4e1a\u7ea7\u667a\u80fd\u4f53\u843d\u5730\u5b89\u5168\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Agent Skills package reusable natural language procedures with executable resources, enabling software agents to acquire task specific capabilities without model adaptation. Automatically generating such Skills can improve task performance, yet evaluating a candidate solely from its artifact or final task outcome leaves unresolved which actions the equipped agent will perform and which side effects those actions will produce. We present TRUSS, an evidence guided framework for generating functionally effective and safety reliable Agent Skills. TRUSS first inspects functional claims against source and domain evidence while evaluating the complete artifact under nine predefined safety properties. Candidates admitted by this static gate are loaded by a shadow agent inside a Controllable Execution Environment, where brokered tools expose requested actions to policy enforcement and record their results as provenance preserving execution traces. Functional failures and property violations are linked back to the responsible Skill content and used to guide iterative refinement. We evaluate TRUSS on 168 SkillInject artifacts, 155 SkillSafetyBench cases, and all 187 tasks in SkillGenBench. TRUSS achieves 100.00\\% precision and recall in vulnerability detection. Repair reduces attack success from 38.71\\% to 19.35\\% with GPT 5.5 and from 46.45\\% to 29.68\\% with GPT 5.4, with zero attack regression. For Skill generation, TRUSS raises task effectiveness from 17.11\\% without Skills to 52.94\\%, while increasing the benchmark Security rate from 50.80\\% to 100.00\\%. These results show that execution evidence can expose behavioral failures missed by artifact inspection and can guide Skill generation toward jointly verified functional and safety outcomes.", "arxiv_id": "2608.17588", "arxiv_url": "https://arxiv.org/abs/2608.17588", "authors": ["Zhibo Zhang", "Zhen Ouyang", "Ling Shi", "Kailong Wang"], "brief": "\u672c\u6587\u63d0\u51faTRUSS\uff0c\u4e00\u4e2a\u8bc1\u636e\u9a71\u52a8\u7684Agent Skill\u751f\u6210\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u4e0d\u6539\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\u4e3a\u8f6f\u4ef6\u667a\u80fd\u4f53\u751f\u6210\u53ef\u590d\u7528\u4efb\u52a1\u6280\u80fd\u3002\u5b83\u7ed3\u5408\u9759\u6001\u8bc1\u636e\u68c0\u67e5\u3001\u4e5d\u7c7b\u5b89\u5168\u5c5e\u6027\u5ba1\u67e5\u548c\u53ef\u63a7\u6267\u884c\u73af\u5883\u4e2d\u7684\u5f71\u5b50\u667a\u80fd\u4f53\u8fd0\u884c\u9a8c\u8bc1\uff0c\u8fed\u4ee3\u4fee\u590d\u529f\u80fd\u5931\u8d25\u4e0e\u5b89\u5168\u8fdd\u89c4\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17588", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5148\u5bf9Skill\u7684\u529f\u80fd\u58f0\u660e\u8fdb\u884c\u6765\u6e90\u4e0e\u9886\u57df\u8bc1\u636e\u6838\u67e5\uff0c\u5e76\u5bf9\u5b8c\u6574\u4ea7\u7269\u8fdb\u884c\u4e5d\u9879\u9884\u5b9a\u4e49\u5b89\u5168\u5c5e\u6027\u9759\u6001\u68c0\u6d4b\u3002", "\u901a\u8fc7Controllable Execution Environment\u52a0\u8f7d\u5019\u9009Skill\uff0c\u7531\u5e26\u7b56\u7565\u7ea6\u675f\u7684\u5de5\u5177\u4ee3\u7406\u8bb0\u5f55\u52a8\u4f5c\u7ed3\u679c\uff0c\u751f\u6210\u53ef\u8ffd\u6eaf\u6267\u884c\u8f68\u8ff9\u3002", "\u5728SkillInject\u3001SkillSafetyBench\u548cSkillGenBench\u4e0a\u8bc4\u6d4b\uff0c\u6f0f\u6d1e\u68c0\u6d4b\u8fbe\u5230100%\u7cbe\u786e\u7387\u548c\u53ec\u56de\u7387\uff0c\u4efb\u52a1\u6709\u6548\u7387\u4ece17.11%\u63d0\u5347\u523052.94%\uff0c\u5b89\u5168\u7387\u63d0\u5347\u5230100%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u5bf9\u9f50", "\u5de5\u5177\u8c03\u7528", "\u81ea\u52a8\u5316\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17588v1", "published_at": "2026-08-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TRUSS: Towards Task-Reliable and User-Safe Automated Agent Skill Generation", "tldr": "TRUSS\u81ea\u52a8\u751f\u6210\u5e76\u9a8c\u8bc1\u5b89\u5168\u53ef\u9760\u7684Agent\u6280\u80fd", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51faTRUSS\uff0c\u4e00\u4e2a\u8bc1\u636e\u9a71\u52a8\u7684Agent Skill\u751f\u6210\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u4e0d\u6539\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\u4e3a\u8f6f\u4ef6\u667a\u80fd\u4f53\u751f\u6210\u53ef\u590d\u7528\u4efb\u52a1\u6280\u80fd\u3002\u5b83\u7ed3\u5408\u9759\u6001\u8bc1\u636e\u68c0\u67e5\u3001\u4e5d\u7c7b\u5b89\u5168\u5c5e\u6027\u5ba1\u67e5\u548c\u53ef\u63a7\u6267\u884c\u73af\u5883\u4e2d\u7684\u5f71\u5b50\u667a\u80fd\u4f53\u8fd0\u884c\u9a8c\u8bc1\uff0c\u8fed\u4ee3\u4fee\u590d\u529f\u80fd\u5931\u8d25\u4e0e\u5b89\u5168\u8fdd\u89c4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aAgent\u6280\u80fd\u751f\u6210\u4ece\u201c\u770b\u6700\u7ec8\u7ed3\u679c\u201d\u63a8\u8fdb\u5230\u201c\u9a8c\u8bc1\u6267\u884c\u884c\u4e3a\u4e0e\u526f\u4f5c\u7528\u201d\uff0c\u80fd\u540c\u65f6\u63d0\u5347\u4efb\u52a1\u80fd\u529b\u548c\u5b89\u5168\u53ef\u9760\u6027\uff0c\u5bf9\u81ea\u52a8\u5316\u8f6f\u4ef6\u667a\u80fd\u4f53\u3001\u5de5\u5177\u8c03\u7528\u4e0e\u53ef\u590d\u7528\u6280\u80fd\u5e93\u6784\u5efa\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Joint-Embedding Predictive Architectures (JEPAs) learn world models by predicting future embeddings, but the objective admits a trivial solution of a constant encoder, so every practical system adds an anti-collapse mechanism (LeCun, 2022; Assran et al., 2023; Bardes et al., 2022; 2024). LeWorldModel (LeWM) prevents collapse with SIGReg, a regularizer that forces the latent distribution to match an isotropic Gaussian: the representation is stabilized by prescribing what it must look like, independently of the environment it models. We argue that the anti-collapse pressure can instead come from the transition data itself. Action-Contrastive Masked Transition Modeling (AC-MTM) keeps LeWM\u0027s forward latent-prediction objective and adds a training-only inverse-dynamics head trained with Action-NCE: each latent transition must identify the action that produced it among the other actions in the batch, a discrimination task that a collapsed encoder provably fails. The inverse branch is discarded after training, leaving test-time encoding, forward prediction, planning, and compute identical to LeWM. On four standard pixel-control tasks under a matched planning protocol, AC-MTM trains stably from scratch and matches SIGReg on average. On the harder multi-object OGBench Visual Scene task, results are consistent with the prescribed geometry becoming a bottleneck: AC-MTM reaches 80.0$\\pm$2.0% success versus 58.0$\\pm$2.0% for SIGReg, improving by 20-24 points in each training seed. A single 50-episode random-policy run gives a 52% baseline estimate. Contrastive inverse dynamics thus provides a distribution-free anti-collapse signal that requires no target network, stop-gradient, pretrained encoder, or reconstruction objective, and we characterize the action-space and observability assumptions under which it holds. We make our code available at https://github.com/jackboyla/action-contrastive-jepa", "arxiv_id": "2608.17542", "arxiv_url": "https://arxiv.org/abs/2608.17542", "authors": ["Jack Boylan", "Chris Hokamp"], "brief": "\u8bba\u6587\u63d0\u51fa Action-Contrastive Masked Transition Modeling\uff08AC-MTM\uff09\uff0c\u5728JEPA/LeWM\u7684\u524d\u5411\u6f5c\u53d8\u91cf\u9884\u6d4b\u76ee\u6807\u5916\uff0c\u52a0\u5165\u4ec5\u8bad\u7ec3\u65f6\u4f7f\u7528\u7684\u9006\u52a8\u529b\u5b66\u5bf9\u6bd4\u5934\u3002\u8be5\u65b9\u6cd5\u8ba9\u6f5c\u53d8\u91cf\u8f6c\u79fb\u4ece\u6279\u5185\u52a8\u4f5c\u4e2d\u8bc6\u522b\u771f\u5b9e\u52a8\u4f5c\uff0c\u4ee5\u6570\u636e\u672c\u8eab\u63d0\u4f9b\u6297\u574d\u584c\u4fe1\u53f7\uff0c\u6d4b\u8bd5\u65f6\u4e0d\u589e\u52a0\u4efb\u4f55\u8ba1\u7b97\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17542", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7528 Action-NCE \u8bad\u7ec3\u9006\u52a8\u529b\u5b66\u5206\u652f\uff0c\u8bc1\u660e\u574d\u584c\u7f16\u7801\u5668\u65e0\u6cd5\u5b8c\u6210\u52a8\u4f5c\u5224\u522b\u4efb\u52a1\uff0c\u4ece\u800c\u907f\u514d\u5e38\u6570\u8868\u5f81\u574d\u584c", "\u76f8\u6bd4 SIGReg \u4e0d\u518d\u5f3a\u5236\u6f5c\u53d8\u91cf\u670d\u4ece\u5404\u5411\u540c\u6027\u9ad8\u65af\u5206\u5e03\uff0c\u4e5f\u4e0d\u9700\u8981\u76ee\u6807\u7f51\u7edc\u3001stop-gradient\u3001\u9884\u8bad\u7ec3\u7f16\u7801\u5668\u6216\u91cd\u5efa\u76ee\u6807", "\u57284\u4e2a\u6807\u51c6\u50cf\u7d20\u63a7\u5236\u4efb\u52a1\u4e0a\u5e73\u5747\u5339\u914d SIGReg\uff1b\u5728\u66f4\u96be\u7684 OGBench Visual Scene \u4e0a\u8fbe\u523080.0\u00b12.0%\u6210\u529f\u7387\uff0c\u663e\u8457\u9ad8\u4e8e SIGReg \u768458.0\u00b12.0%"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5bf9\u6bd4\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17542v1", "published_at": "2026-08-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "No Gaussian Required: Contrastive Inverse Dynamics for JEPA World Models", "tldr": "\u7528\u5bf9\u6bd4\u9006\u52a8\u529b\u5b66\u9632\u6b62JEPA\u8868\u5f81\u574d\u584c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Action-Contrastive Masked Transition Modeling\uff08AC-MTM\uff09\uff0c\u5728JEPA/LeWM\u7684\u524d\u5411\u6f5c\u53d8\u91cf\u9884\u6d4b\u76ee\u6807\u5916\uff0c\u52a0\u5165\u4ec5\u8bad\u7ec3\u65f6\u4f7f\u7528\u7684\u9006\u52a8\u529b\u5b66\u5bf9\u6bd4\u5934\u3002\u8be5\u65b9\u6cd5\u8ba9\u6f5c\u53d8\u91cf\u8f6c\u79fb\u4ece\u6279\u5185\u52a8\u4f5c\u4e2d\u8bc6\u522b\u771f\u5b9e\u52a8\u4f5c\uff0c\u4ee5\u6570\u636e\u672c\u8eab\u63d0\u4f9b\u6297\u574d\u584c\u4fe1\u53f7\uff0c\u6d4b\u8bd5\u65f6\u4e0d\u589e\u52a0\u4efb\u4f55\u8ba1\u7b97\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aJEPA\u4e16\u754c\u6a21\u578b\u63d0\u4f9b\u4e86\u4e00\u79cd\u5206\u5e03\u65e0\u5173\u3001\u73af\u5883\u6570\u636e\u9a71\u52a8\u7684\u6297\u574d\u584c\u673a\u5236\uff0c\u907f\u514d\u624b\u5de5\u89c4\u5b9a\u6f5c\u7a7a\u95f4\u51e0\u4f55\u53ef\u80fd\u5e26\u6765\u7684\u74f6\u9888\uff0c\u5e76\u5728\u590d\u6742\u591a\u7269\u4f53\u89c6\u89c9\u63a7\u5236\u4efb\u52a1\u4e2d\u5c55\u73b0\u51fa\u660e\u663e\u4f18\u52bf\u3002"}, {"abstract": "Continual pre-training of large language models must acquire new information without erasing old knowledge. Existing replay methods often choose a global old/new mixture and sample uniformly, ignoring that examples differ in how quickly they are forgotten. We formulate continual pre-training as adaptive review scheduling: the training loop should decide not only how much history to replay, but which examples should return at each step. We introduce Spaced Repetition Training (SRT), a continual learning framework inspired by cognitive science, which schedules sample-rehearsal using the SuperMemo-2 (SM-2) algorithm. SRT maintains per-example review state, maps per-example perplexity to a recall-quality signal, and schedules historical examples for retention and new examples for consolidation while leaving the model, objective, and optimizer unchanged. On temporally separated Wikipedia and code corpora, SRT improves the stability-plasticity trade-off, recovering 5 to 37 percentage points of old-knowledge accuracy lost by naive continual pre-training across model scales while preserving or improving new-knowledge acquisition. At larger scale, SRT preserves broad benchmark performance that naive continual pre-training and uniform replay substantially degrade. Experiments with vision and tabular data further suggest that the scheduling principle extends beyond language when paired with an appropriate recall signal.", "arxiv_id": "2608.17530", "arxiv_url": "https://arxiv.org/abs/2608.17530", "authors": ["Alankar Atreya", "Devesh Batra", "Yoages Kumar Mantri", "Geremy Bantug", "Greig A Cowan", "Raad Khraishi"], "brief": "\u8bba\u6587\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u6301\u7eed\u9884\u8bad\u7ec3\u91cd\u65b0\u8868\u8ff0\u4e3a\u81ea\u9002\u5e94\u590d\u4e60\u8c03\u5ea6\u95ee\u9898\uff0c\u63d0\u51fa Spaced Repetition Training\uff08SRT\uff09\u3002\u8be5\u65b9\u6cd5\u501f\u9274 SuperMemo-2 \u7b97\u6cd5\uff0c\u6839\u636e\u6837\u672c\u7ea7\u56f0\u60d1\u5ea6\u4f30\u8ba1\u201c\u56de\u5fc6\u8d28\u91cf\u201d\uff0c\u52a8\u6001\u51b3\u5b9a\u54ea\u4e9b\u5386\u53f2\u6837\u672c\u5e94\u88ab\u91cd\u653e\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.17530", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["SRT \u7ef4\u62a4\u6bcf\u4e2a\u6837\u672c\u7684\u590d\u4e60\u72b6\u6001\uff0c\u5e76\u540c\u65f6\u8c03\u5ea6\u5386\u53f2\u6837\u672c\u7528\u4e8e\u4fdd\u6301\u65e7\u77e5\u8bc6\u3001\u65b0\u6837\u672c\u7528\u4e8e\u5de9\u56fa\u65b0\u77e5\u8bc6\u3002", "\u65b9\u6cd5\u4e0d\u6539\u53d8\u6a21\u578b\u7ed3\u6784\u3001\u8bad\u7ec3\u76ee\u6807\u6216\u4f18\u5316\u5668\uff0c\u53ef\u4f5c\u4e3a\u6301\u7eed\u9884\u8bad\u7ec3\u4e2d\u7684\u6570\u636e\u8c03\u5ea6\u5c42\u4f7f\u7528\u3002", "\u5728\u65f6\u95f4\u5206\u79bb\u7684 Wikipedia \u4e0e\u4ee3\u7801\u8bed\u6599\u4e0a\uff0cSRT \u76f8\u6bd4\u6734\u7d20\u6301\u7eed\u9884\u8bad\u7ec3\u53ef\u6062\u590d 5 \u5230 37 \u4e2a\u767e\u5206\u70b9\u7684\u65e7\u77e5\u8bc6\u51c6\u786e\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u6216\u63d0\u5347\u65b0\u77e5\u8bc6\u5b66\u4e60\u3002"], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u8bed\u8a00\u6a21\u578b", "\u6570\u636e\u8c03\u5ea6", "\u707e\u96be\u6027\u9057\u5fd8"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.17530v1", "published_at": "2026-08-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "When to Review: Spaced Repetition for Continual Pre-Training of Language Models", "tldr": "\u7528\u95f4\u9694\u91cd\u590d\u8c03\u5ea6\u63d0\u5347\u8bed\u8a00\u6a21\u578b\u6301\u7eed\u9884\u8bad\u7ec3\u8bb0\u5fc6\u4fdd\u6301", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u6301\u7eed\u9884\u8bad\u7ec3\u91cd\u65b0\u8868\u8ff0\u4e3a\u81ea\u9002\u5e94\u590d\u4e60\u8c03\u5ea6\u95ee\u9898\uff0c\u63d0\u51fa Spaced Repetition Training\uff08SRT\uff09\u3002\u8be5\u65b9\u6cd5\u501f\u9274 SuperMemo-2 \u7b97\u6cd5\uff0c\u6839\u636e\u6837\u672c\u7ea7\u56f0\u60d1\u5ea6\u4f30\u8ba1\u201c\u56de\u5fc6\u8d28\u91cf\u201d\uff0c\u52a8\u6001\u51b3\u5b9a\u54ea\u4e9b\u5386\u53f2\u6837\u672c\u5e94\u88ab\u91cd\u653e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8ba4\u77e5\u79d1\u5b66\u4e2d\u7684\u95f4\u9694\u91cd\u590d\u673a\u5236\u5f15\u5165\u5927\u6a21\u578b\u6301\u7eed\u5b66\u4e60\uff0c\u7a81\u7834\u4e86\u4f20\u7edf\u56fa\u5b9a\u6bd4\u4f8b\u3001\u5747\u5300\u91cd\u653e\u7684\u7b80\u5355\u7b56\u7565\uff0c\u4e3a\u7f13\u89e3\u707e\u96be\u6027\u9057\u5fd8\u63d0\u4f9b\u4e86\u8f7b\u91cf\u4e14\u53ef\u6269\u5c55\u7684\u65b9\u6848\uff
