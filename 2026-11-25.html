u4e3b\u6210\u5206\u6570\u8861\u91cf\u5185\u5728\u7ef4\u5ea6\uff0c\u518d\u636e\u6b64\u5206\u914d\u84b8\u998f\u5b66\u751f\u6a21\u578b\u7684\u5404\u5c42\u5bbd\u5ea6\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.32782", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u626b\u63cf58\u4e2a\u6a21\u578b\u300114\u4e2a\u5bb6\u65cf\uff0c\u89c4\u6a21\u8986\u76d670M\u81f372B\u53c2\u6570\u3002", "\u5185\u5728\u7ef4\u5ea6\u5448\u4e2d\u5c42\u9ad8\u3001\u4e24\u7aef\u4f4e\uff0c\u8de8\u4e2d\u82f1\u6587\u8bed\u6599\u53ca\u5fae\u8c03\u4fdd\u6301\u7a33\u5b9a\u3002", "\u540c\u9884\u7b97PCA\u5bbd\u5ea6\u5206\u914d\u5728\u4e24\u6b3eQwen\u6a21\u578b\u4e0a\u63d0\u53472.3\u548c2.5\u5206\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5185\u5728\u7ef4\u5ea6", "\u4e3b\u6210\u5206\u5206\u6790", "\u6a21\u578b\u538b\u7f29"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.32782v1", "published_at": "2026-11-24", "score": 0.236, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32782.png", "title": "Measuring Layer-wise Intrinsic Dimensionality of FFNs in LLMs via PCA", "tldr": "\u5927\u6a21\u578b\u4e2d\u5c42\u524d\u9988\u7f51\u7edc\u5bb9\u91cf\u9700\u6c42\u66f4\u9ad8\uff0c\u6309\u5185\u5728\u7ef4\u5ea6\u5206\u914d\u5bbd\u5ea6\u53ef\u6539\u5584\u540c\u9884\u7b97\u6027\u80fd\u3002", "upvotes": 7, "what_it_is": "\u7814\u7a76\u7528PCA\u5206\u6790\u5404\u5c42FFN\u4e0b\u6295\u5f71\u8f93\u5165\uff0c\u4ee5\u8fbe\u5230\u56fa\u5b9a\u4f59\u5f26\u76f8\u4f3c\u5ea6\u6240\u9700\u7684\u4e3b\u6210\u5206\u6570\u8861\u91cf\u5185\u5728\u7ef4\u5ea6\uff0c\u518d\u636e\u6b64\u5206\u914d\u84b8\u998f\u5b66\u751f\u6a21\u578b\u7684\u5404\u5c42\u5bbd\u5ea6\u3002", "why_notable": "\u4e3a\u6253\u7834\u5404\u5c42\u7b49\u5bbd\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u53ef\u6d4b\u91cf\u4f9d\u636e\uff1b\u540c\u9884\u7b97\u526a\u679d\u5b9e\u9a8c\u652f\u6301\u6309\u5c42\u5206\u914d\u5bb9\u91cf\uff0c\u4e14\u6559\u5e08\u5c42\u95f4\u7ef4\u5ea6\u8d8a\u4e0d\u5747\uff0c\u6536\u76ca\u8d8a\u5927\u3002"}, {"abstract": "Despite strong performance on standard benchmarks, video reasoning models remain vulnerable to visual degradation, raising concerns about their reliability in safety-critical scenarios. Existing benchmarks address this concern in part by simulating visual degradation or probing model reasoning with challenging questions, leaving open how well models handle naturally degraded video and whether they can make the simpler judgments that matter for safe driving. To this end, we introduce GRAPE-Bench, which jointly evaluates video reasoning across visual degradation conditions and question difficulty. It combines a synthetic set spanning twelve corruption types across daily-life and driving videos with real-world footage of driving at night or in rain, snow, or fog. Each video is paired with three progressively challenging questions, from fundamental judgments with potential safety implications to demanding reasoning stress tests. Across open-weight and frontier models, we observe ranking reversals between synthetic and real-world conditions and level-specific weaknesses obscured by overall accuracy. Synthetic-data fine-tuning improves Qwen3.5-9B\u0027s real-world accuracy from 76.7% to 81.1%, while clean-privileged on-policy distillation reaches 80.4% in a separate reasoning-enabled setting. Through preference steering, we further demonstrate continuous control over a frozen model\u0027s trade-off between safety-relevant judgments and challenging reasoning, with little change in overall accuracy. Together, GRAPE-Bench provides a unified testbed for evaluating, improving, and controlling video reasoning under degraded visual conditions.", "arxiv_id": "2611.33020", "arxiv_url": "https://arxiv.org/abs/2611.33020", "authors": ["Ce Zhang", "Junyi He", "Tianshi Ming", "Jinxi He", "Jianshu Zhang", "Xiyuan Yang", "Jianuo Zhu", "Yicheng Tao", "Xiyu Luo", "Minghao Fu", "Jiahui Zhu", "Kehan Guo", "Yunzhong Xiao", "Jingyang Lin", "Wei Chow", "Lingdong Kong", "Katia Sycara", "Yaqi Xie"], "brief": "\u6784\u5efa\u89c6\u9891\u63a8\u7406\u8bc4\u6d4b\u96c6\uff0c\u5c06\u5341\u4e8c\u7c7b\u5408\u6210\u6270\u52a8\u4e0e\u591c\u95f4\u3001\u96e8\u96ea\u96fe\u9a7e\u9a76\u5b9e\u62cd\u7ed3\u5408\uff0c\u6bcf\u6bb5\u89c6\u9891\u914d\u4e09\u7ea7\u96be\u5ea6\u95ee\u9898\uff0c\u5e76\u6d4b\u8bd5\u5fae\u8c03\u3001\u84b8\u998f\u53ca\u504f\u597d\u5f15\u5bfc\u7684\u6539\u5584\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/zhangce01/GRAPE-Bench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.33020", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d612\u7c7b\u5408\u6210\u6270\u52a8\uff0c\u6bcf\u6bb5\u89c6\u9891\u914d3\u7ea7\u96be\u5ea6\u95ee\u9898", "\u5408\u6210\u5fae\u8c03\u4f7fQwen3.5-9B\u771f\u5b9e\u573a\u666f\u51c6\u786e\u7387\u4ece76.7%\u5347\u81f381.1%", "\u504f\u597d\u5f15\u5bfc\u53ef\u8c03\u8282\u51bb\u7ed3\u6a21\u578b\u7684\u5b89\u5168\u5224\u65ad\u4e0e\u9ad8\u96be\u63a8\u7406\u6743\u8861"], "keywords": ["\u89c6\u9891\u63a8\u7406", "\u9c81\u68d2\u6027\u8bc4\u6d4b", "\u81ea\u52a8\u9a7e\u9a76", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33020v1", "published_at": "2026-11-24", "score": 0.23, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33020.png", "title": "GRAPE-Bench: When Vision Degrades, Does Video Reasoning Hold?", "tldr": "\u8054\u5408\u8bc4\u6d4b\u89c6\u89c9\u9000\u5316\u4e0e\u95ee\u9898\u96be\u5ea6\uff0c\u63ed\u793a\u89c6\u9891\u63a8\u7406\u6a21\u578b\u5728\u771f\u5b9e\u9a7e\u9a76\u4e2d\u7684\u53ef\u9760\u6027\u77ed\u677f\u3002", "upvotes": 4, "what_it_is": "\u6784\u5efa\u89c6\u9891\u63a8\u7406\u8bc4\u6d4b\u96c6\uff0c\u5c06\u5341\u4e8c\u7c7b\u5408\u6210\u6270\u52a8\u4e0e\u591c\u95f4\u3001\u96e8\u96ea\u96fe\u9a7e\u9a76\u5b9e\u62cd\u7ed3\u5408\uff0c\u6bcf\u6bb5\u89c6\u9891\u914d\u4e09\u7ea7\u96be\u5ea6\u95ee\u9898\uff0c\u5e76\u6d4b\u8bd5\u5fae\u8c03\u3001\u84b8\u998f\u53ca\u504f\u597d\u5f15\u5bfc\u7684\u6539\u5584\u6548\u679c\u3002", "why_notable": "\u6a21\u578b\u6392\u540d\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u9000\u5316\u6761\u4ef6\u4e0b\u53d1\u751f\u53cd\u8f6c\uff0c\u6574\u4f53\u51c6\u786e\u7387\u8fd8\u4f1a\u63a9\u76d6\u5206\u7ea7\u5f31\u70b9\uff0c\u4e3a\u9a7e\u9a76\u573a\u666f\u7684\u89c6\u9891\u63a8\u7406\u8bc4\u4f30\u63d0\u4f9b\u66f4\u7ec6\u81f4\u4f9d\u636e\u3002"}, {"abstract": "Spatial reasoning in hospitals requires tracking look-alike equipment, interpreting patient-relative directions, and judging passage widths, yet existing benchmarks provide limited coverage of these abilities. We introduce Clinical3D-Bench, a simulated benchmark with 3,368 questions of eight types on egocentric walkthroughs of 373 hospital-room layouts. Layouts follow hospital design guidelines, answers are computed from the 3D scenes, and paired scene states test whether models change their answers when relevant evidence changes. Videos are photorealistic, and ten physicians screened the layouts. Among 35 multimodal large language models (MLLMs), the best open and proprietary models reach 45.7% and 53.6% macro accuracy, against 40.8% for an answer prior and 79.0% for physicians on a subset, and 27 of 32 open models score below 40% on two-way patient-relative directions. Fine-tuning on Clinical3D-45K, our 44,750-question training set, lifts two MLLMs 16-20 points above the best proprietary model. 3D maps given to the fine-tuned MLLM as input go largely unused: replacing them with another video\u0027s, even when they are ground truth, barely changes its accuracy. The proposed GeoJeV instead lets the MLLM compute with 3D: it reconstructs a scene memory from each video, selects 3D operations and their arguments from the MLLM\u0027s question state, and adds their evidence to its option scores. It achieves the highest accuracy of all evaluated models, narrowing the gap to physicians.", "arxiv_id": "2611.32094", "arxiv_url": "https://arxiv.org/abs/2611.32094", "authors": ["Yang Bai", "Yingzhi Xia", "Ling Lin", "Jun Cheng", "Lin Fu", "Huazhu Fu"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.32094", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "clinicalspace", "pdf_url": "https://arxiv.org/pdf/2611.32094v1", "published_at": "2026-11-24", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32094.png", "title": "Clinical3D-Bench: Evaluating and Improving Spatial Intelligence of Multimodal LLMs in Hospital Environments", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Split-training privacy evaluations fail through distinct mechanisms. Evaluators can overlook an exposed gradient channel, align reconstructions against shifted labels, or deploy uncalibrated probes before testing a candidate defence, while calibrated attacks can also refute real defences. Separating these failure modes alters which claims survive. We conduct a retrospective evidentiary reanalysis across four split-LLM campaigns and two cross-cutting scope checks covering host key custody and variational mutual-information bounds, mapping every recorded claim to one of five admissibility states (breach, non-detection, undetermined coverage, invalid measurement, or out-of-scope inference). Across a 19-configuration exploration, only four of 24 required probes qualified, yet those four calibrated probes still established qualified privacy breaches in 13 configurations, while utility or learning-gain failures eliminated the remaining 6. In a seven-cell defence-redesign pilot, 2 quantised configurations failed utility gates, calibrated next-byte structure probes breached the 0.02 gate on all 7 cells (0.097 to 0.112), and qualified punctuation-property probes reached 0.79 to 0.89, yielding 4 failed and 3 undetermined composite privacy assessments (the latter from marginal null-band excursions on punctuation bindings). Negative evidence against both defence families remains intact. Scope checks further show that shared-key orthogonal wrappers protect passive network captures without hiding activations from a compromised restoring host, and why near-zero variational lower bounds leave worst-case leakage unconstrained. Rerunnable scripts verify 1,522 checks across 122 SHA-256-pinned artifacts while preserving each campaign\u0027s native seed intervals and retrospective boundaries.", "arxiv_id": "2611.31752", "arxiv_url": "https://arxiv.org/abs/2611.31752", "authors": ["Georgios Politis", "Evangelos Pappas"], "brief": "", "categories": ["cs.CR", "cs.DC"], "github_repo": "https://github.com/setloop-io/Separating-Measurement-Failures-from-Defence-Failures-in-Split-Language-Model-Privacy", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31752", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Setloop", "pdf_url": "https://arxiv.org/pdf/2611.31752v1", "published_at": "2026-11-24", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31752.png", "title": "Separating Measurement Failures from Defence Failures in Split Language-Model Privacy", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Feedback tools and research on learner writing need transcriptions of handwritten essays that keep exactly what the student wrote: misspellings, line breaks, struck-through words and insertions. Vision-language models (VLMs) read handwriting well, but they also tend to rewrite it into correct language. We measure this on BRESSAY, 1,000 handwritten Brazilian Portuguese essays, with a benchmark that adds error preservation, invented errors, edit-markup precision and recall and line structure to the character error rate (CER) and uses paired bootstrap confidence intervals. We restrict the study to open-weight models that schools can run on their own hardware. Of 22 open baselines, the best, Qwen3-VL 235B-A22B, reaches 5.6% CER on the 199 test pages; none reproduces the edit markup reliably, and every VLM replaces 39-78% of the words absent from a Portuguese dictionary with dictionary words. We fine-tune LightOnOCR-3-1B on the 647 training pages in 85 minutes on one GPU. The resulting Escriba-OCR-1B reaches 2.06% CER, 3.5 points below the best baseline (95% CI [-4.2, -2.9]); under the ICDAR 2024 competition metric it reaches 2.1% CER, below the best published page-level results (2.2-2.4%). It recovers 67% of insertions and 77% of illegible deletions, and reproduces the line structure of 97% of the pages, but still normalises 60% of likely misspellings. Three seeds agree within 0.04 CER points, and quantised to 4 bits the model runs on an ordinary CPU at about one minute per page. On 40 letters of another corpus it matches its base model (without that model\u0027s appended comments) but misreads unseen words more often; weight interpolation recovers half the gap. A teacher\u0027s review finds that 45% of the judgeable apparent corrections are errors in the BRESSAY ground truth, so dictionary-based scores likely understate preservation. We release the model, the benchmark code and the review data.", "arxiv_id": "2611.29874", "arxiv_url": "https://arxiv.org/abs/2611.29874", "authors": ["Tardelli Ronan Coelho Stekel"], "brief": "", "categories": ["cs.CL", "cs.CV", "cs.CY"], "github_repo": "https://github.com/tardellirs/escriba-ocr", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.29874", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 7, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29874v1", "published_at": "2026-11-23", "score": 0.048, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29874.png", "title": "Escriba-OCR: A 1B Vision-Language Model for Error-Preserving Transcription of Handwritten Portuguese Essays", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Models read a book, an hour of video, or an image in one forward pass. As the context grows, this pass slows down, loses accuracy, and stops at the context window. Sparse attention is efficient, but keeps the other two limitations. Grid probing, a recent training-free method, recovers the accuracy and extends the reach by asking a frozen model the same question about short local and strided spans of the input, but every question repeats the whole computation, since each span is encoded again. Our insight is that grid probing is emulated attention, an attention pattern reproduced from outside the model through prompts, since each probe only restricts which part of the input the question can see. We introduce Factorized Context Attention (FCA), a training-free block-sparse attention that runs the same pattern natively, as the attention of the model itself. FCA encodes the input once into a KV cache, reads all spans as masked sequences in one batched forward, and uses a stair position schedule to keep every span inside the trained position range. Across long video understanding, long-context text inference and image grounding, FCA matches the accuracy and the reach of grid probing at a fraction of its cost. It gains about 10 points over the single pass on long video and 9 to 14 points on long novels, finds needles in videos of over a thousand frames and in texts four times the length of the window, and answers a later question about the same input in as little as a tenth of the time of grid probing. Native attention thus keeps what emulated attention gains without its cost, all with existing frozen language and vision-language models.", "arxiv_id": "2611.32423", "arxiv_url": "https://arxiv.org/abs/2611.32423", "authors": ["Mohamed Eltahir", "Manar Eyad", "Yara Alzahrani", "Fatimah Albesher", "Duaa M. Tahir", "Tanveer Hussain", "Naeemullah Khan"], "brief": "", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/mohammad2012191/FCA", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.32423", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "King Abdullah University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2611.32423v1", "published_at": "2026-11-24", "score": 0.048, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32423.png", "title": "Factorized Context Attention: From Emulated to Native Grid Probing", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Data-driven weather forecasting requires distinguishing local states and their temporal evolution. However, learned patterns remain implicit in neural forecasters, making their influence difficult to interpret. Failing to distinguish local evolution can lead to similar forecasts for locations that develop differently, increasing prediction error. This motivates explicit references for distinguishing and interpreting local patterns. Prototypes provide explicit pattern references, but sample- or task-level conditioning leaves open how to adapt to distinct locations and variable groups. To deal with this problem, we design ProtoCast, which uses group-specific prototype banks to adapt local features while accounting for cross-variable dependencies. Specifically, (1) we combine each group\u0027s historical features and temporal change with forecast context from cross-variable attention for evolution-aware prototype matching. (2) Sparse mixtures of prototype-specific low-rank operators tailor corrections to each group and location. A gated attention block then exchanges the corrected features across groups before prediction. Each group\u0027s correction decomposes into explicit prototype contributions before this fusion. (3) We jointly train the forecasting network and operators from scratch and refit each group\u0027s prototypes before every training epoch. Slot tracking preserves prototype-operator associations, making each prototype\u0027s contribution to local corrections more interpretable. Experiments on GlobalForecast and TyphoonTracking show improved forecasting accuracy, while prototype deletion links local feature contributions to changes in prediction error. This work advances the development of more accurate and interpretable data-driven weather forecasting models. Project page: https://zhixuanli.github.io/projects/li2026protocast", "arxiv_id": "2611.25848", "arxiv_url": "https://arxiv.org/abs/2611.25848", "authors": ["Zhixuan Li", "Hao Jiang", "Chen Hui", "Kai Geng", "Weisi Lin"], "brief": "", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.25848", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.25848v1", "published_at": "2026-11-19", "score": 0.047, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25848.png", "title": "Interpretable Prototype-Conditioned Adaptation for Weather Forecasting", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Visual agents navigate whole-slide images through magnified observations associated with claimed locations. However, a visually plausible observation does not necessarily originate from its claimed location, particularly across magnifications and in regions with similar tissue structures. We formulate cross-magnification provenance verification (CMPV) to evaluate whether visual evidence supports a claimed spatial association, recover the source when possible, and abstain when evidence is insufficient. We introduce PyraFault, a benchmark of 3.06 million coordinate-supervised examples from 2,200 cases across five TCGA cohorts, covering within-context substitutions, absent-source faults, and geometric perturbations. We further propose ZoomTrace, a claim-independent verifier that estimates the observation\u0027s source before evaluating its agreement with the claimed location. It combines physical-scale alignment, visual retrieval, geometric refinement, and reliability estimation using spatially disjoint competing matches. On 503,320 test examples, ZoomTrace achieves 0.969 AUPRC and 0.987 AUROC, compared with 0.789 and 0.903 for Efficient LoFTR. Further evaluations reveal trade-offs in reliability estimation and limitations in vision-language models, cross-dataset retrieval, and calibration. Integrating ZoomTrace into visual agent tool paths reduces exposure to corrupted observations and silent failures, while downstream accuracy improvements depend on the agent and verification threshold.", "arxiv_id": "2611.29150", "arxiv_url": "https://arxiv.org/abs/2611.29150", "authors": ["Yan Wang", "Yiran Song", "Zizhuo Gong", "Jianxiang Qi", "Zhongxing Xu", "Lingfei Qian", "Minquan Lin"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/Yan2266336/PyraFault", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29150", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29150v1", "published_at": "2026-11-22", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29150.png", "title": "Can an Agent Trust Its Own Zoom? Cross-Magnification Provenance Verification for Whole-Slide Images", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Decision models, which output probability distributions over candidate labels instead of generating text, are increasingly used as classifiers and evaluators for inputs associated with real-world locations. However, it remains unclear whether they can leverage spatial context and whether their predictions are geographically biased. We introduce GeoDecisions, a multimodal benchmark for evaluating the spatial awareness and geographic bias of decision models. GeoDecisions comprises two tasks: (1) geo-aware image classification, and (2) location rating on objective and subjective topics. Evaluating six decision models against supervised task-specific models, we find that spatial awareness requires vision: textual coordinates alone provide insufficient context for classifying everyday photos and satellite images. We also find substantial geographic bias. On everyday photos, despite achieving higher accuracy, open-weight decision models exhibit more spatially clustered errors than supervised models. Moreover, across all five subjective topics, every decision model gives lower ratings to locations with lower socioeconomic conditions. Finally, we propose a training-free method that combines decision models with a location prior to improve their spatial awareness without substantially increasing performance bias. Our code is available at https://github.com/cruiseresearchgroup/GeoDecisions.", "arxiv_id": "2611.30564", "arxiv_url": "https://arxiv.org/abs/2611.30564", "authors": ["Wilson Wongso", "Hada Melino Muhammad", "Xiachong Lin", "Hao Xue", "Flora D. Salim"], "brief": "", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/cruiseresearchgroup/GeoDecisions", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.30564", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "CRUISE Research Group (UNSW)", "pdf_url": "https://arxiv.org/pdf/2611.30564v1", "published_at": "2026-11-23", "score": 0.029, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30564.png", "title": "Seeing Is Locating: Spatial Awareness and Geographic Bias in Decision Language Models", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "We present OWE-Bench (OpenWorldEngineer-Bench), a benchmark of 26 long-horizon engineering tasks written by domain experts in software engineering, physical engineering, machine learning, and scientific computing. Tasks range from optimizing kernels and designing an aircraft, to identifying the faults responsible for an earthquake. Each task requires significant domain knowledge and engineering work, with models averaging hundreds of millions of tokens per task. Solutions are scored on practical measures such as speed, cost and accuracy, both on provided cases the agent could test against and on hidden cases that an engineer would expect from the task description. The best-performing frontier model so far, Claude Fable 5.2, scores 54.6% and averages 211 million tokens per task. We highlight two findings. First, when models are given more time, they use more test-time compute and achieve higher scores. Models also scale differently with test-time compute: GPT-6 Astra achieves higher scores at shorter time limits and at equal token use, while Claude Fable 5.2 uses more tokens at longer limits to achieve the highest overall score. Second, each model scores lower on hidden cases than on the provided cases, by an average of 18 points, which we call the deployment gap. Models also fail to predict the deployment gap, overestimating their performance on hidden test cases by an average of 21 points. We hope that OWE-Bench grounds progress toward agents whose engineering solutions perform as well in deployment as they do in testing.", "arxiv_id": "2611.30017", "arxiv_url": "https://arxiv.org/abs/2611.30017", "authors": ["Jacob Cole", "Martin Dimakis", "Victor Barres", "Bertie Vidgen", "Edward Hu", "Jason Wei"], "brief": "", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30017", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Mercor", "pdf_url": "https://arxiv.org/pdf/2611.30017v1", "published_at": "2026-11-23", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30017.png", "title": "OWE-Bench: A long-horizon benchmark for measuring real-world engineering", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Model alignment is the primary safety and security mechanism for enforcing refusal of malicious prompts in modern foundation models; yet, existing adversarial evaluations implicitly assume underlying hardware integrity. In this paper, we present FATCAT, the first physical fault-injection attacks capable of eliminating refusal in modern large language and vision-language models. Specifically, we present a non-invasive electromagnetic (EM) fault injection attack targeting GPU-accelerated Systems-on-Chip with physical access, requiring neither software execution privileges nor model-layer access. By leveraging an autonomous Radio Frequency (RF) side-channel trigger to synchronize EM faults to the prompt prefill phase, the attack corrupts safety-critical memory transactions across off-chip LPDDR5 DRAM and on-chip LPDDR physical interfaces without crashing the system while preserving model coherence. Evaluated on an NVIDIA Jetson Orin Nano and AGX Thor running Llama 3.2 1B and Gemma 3 1B, localized physical faults reliably force models to fulfill restricted requests, demonstrating that model-level alignment provides no robust security guarantees without hardware-level fault tolerance. Finally, we demonstrate the physical-world consequences of this vulnerability on an active 6-DoF robotic manipulator controlled by a SmolVLA vision-language-action policy. Our attack silently corrupts the model forcing the arm into abrupt, hazardous lunges; in two instances the robotic arm attempted to pinch the paper author -- proving that hardware faults can directly translate into real physical harm.", "arxiv_id": "2611.31129", "arxiv_url": "https://arxiv.org/abs/2611.31129", "authors": ["Peter Horvath", "Ilia Shumailov", "Zhuoran Liu", "Lukasz Chmielewski", "Lejla Batina"], "brief": "", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31129", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31129v1", "published_at": "2026-11-23", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31129.png", "title": "FATCAT: Fault Injection Attacks Targeting Chip-level Alignment", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Machine learning has largely kept separate the choice of architecture and the process of training. A classic Transformer, for instance, trains a fixed set of attention and MLP sublayers at every layer, in the same order, and optimizes the weights within. This uniformity is a convention rather than a principled design choice, and it is likely suboptimal: the best architecture for a given task may be smaller, more efficient, and far from uniform. We believe that, ideally, training itself should shape the model\u0027s topology. To this end, we introduce Model Carving, which learns both a Transformer\u0027s weights and its architecture in a single run. By applying learnable, scalar gates to each sublayer, we allow the training loss to remove the model\u0027s own components during training -- freeing a smaller heterogeneous network inside. We evaluate Model Carving by pre-training standard Transformers from 140M to 2.7B parameters and looped Transformers from 140M to 1.3B. At equal training compute, carved models reach a lower validation loss than dense models trained with up to 1.7 times more compute. Furthermore, carved models also outperform size-matched models produced by pruning or distillation, suggesting that the best way to obtain small models for edge devices is to carve them during training, not to compress a large one afterwards. This advantage both grows with scale and carries over to downstream tasks such as few-shot evaluation and generation. Because the removed sublayers no longer run, carved models also cost up to 34% fewer FLOPs per token and decode up to 1.6 times faster without cost in quality. Our results show that architecture, like weights, should be learned and not fixed in advance, and that inside every large transformer is a smaller, faster, stronger one waiting to be carved out.", "arxiv_id": "2611.27962", "arxiv_url": "https://arxiv.org/abs/2611.27962", "authors": ["Kaden Zheng", "Pratyusha Sharma"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/KadenZheng/model-carving", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27962", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Harvard University", "pdf_url": "https://arxiv.org/pdf/2611.27962v1", "published_at": "2026-11-20", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27962.png", "title": "Model Carving: Training Transformers That Optimize Their Own Topology", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate electronic-structure reference data are expensive, motivating interatomic potentials that learn effectively from limited training sets. We introduce OrbACE (Orbital and Atomic Cluster Expansion), a framework that supplements an E(3)-equivariant cluster-expansion backbone with inexpensive electronic-structure descriptors. On ANI-1x at the $\u03c9$B97X/6-31G* level, its atom-centered variant, OrbACE-A, trained on 10,000 configurations and evaluated on 442,000 held-out configurations, achieves energy and force mean absolute errors of 3.16 meV/atom and 76 meV/angstrom in direct learning, compared with 9.61 meV/atom and 146 meV/angstrom for MACE with matched backbone settings. This reduces the energy error by a factor of three and approximately halves the force error. Its energy error is also below that of the best delta-corrected MACE baseline, 5.00 meV/atom, although its force error is slightly higher. Combining OrbACE-A with a Hartree-Fock delta baseline further reduces the errors to 1.48 meV/atom and 35 meV/angstrom. OrbACE-A builds atom- and pair-resolved invariants from a non-self-consistent extended-Hueckel model evaluated within the differentiable forward pass, yielding forces consistent with the predicted energy. The orbital variant, OrbACE-O, instead uses localized Hartree-Fock orbitals as graph nodes, with scalar and equivariant electronic descriptors. Its forces are evaluated at fixed descriptors, omitting their response to nuclear motion. In direct learning on ANI-1x, its energy error is approximately three times that of OrbACE-A. The three benchmarks considered (ANI-1x, revised MD17, and 3BPA) cover neutral, closed-shell, non-periodic molecules containing H, C, N, and O. Performance outside this domain remains to be established.", "arxiv_id": "2611.33743", "arxiv_url": "https://arxiv.org/abs/2611.33743", "authors": ["Etinosa Osaro", "Dario Rocca"], "brief": "", "categories": ["physics.chem-ph", "cs.LG", "physics.comp-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33743", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33743v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OrbACE: Orbital and Atomic Cluster Expansion", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Clients of closed-weight LLM APIs cannot verify whether a provider ran the advertised model, precision, hidden prompt, and reasoning budget. Existing approaches either trust hardware or third parties, or re-prove every layer of an integer surrogate at high cost while diverging from native floating-point serving. FlashProve-Next produces verifiable, zero-knowledge-masked proofs for individual LLM API responses without modifying native serving (bf16/fp8/mxfp4, random sampling, FlashAttention, CUDA graphs, batching, prefix caching) and without disclosing weights, hidden prompts, hidden reasoning, or activations (dense profiles fix coarse geometry; cross-architecture hiding is deferred). A non-depleting Reed-Solomon weight commitment model_id opens inside proofs via hidden column openings, while local per-operator rounding contracts remove integer surrogates and the refusal-bit leak. Cost-weighted spot-checking supports non-interactive public verification (NI-315, $\\varepsilon \\le 2^{-40}$, $Q \\le 2^{64}$) and external-seed C_pre mode (ExtSeed-153, $\\varepsilon \\le 2^{-20}$, $Q_{\\rm samp} \\le 2^{30}$). Twenty-eight Lean 4 modules (696 declarations, zero sorry, standard axioms only) mechanize round-by-round soundness, bucketed sampling, $\\mathbb{F}_{p^3}$ constrained-mask binding, causal masking, six IR gadgets, and executable FPN2 verifiers. Five-model Blackwell calibration gives zero false rejections across 1.85M GEMM/MoE blocks and 1.96M non-GEMM rows. Our zero-Phase-2 folded backend (folded ZK simulator open) proves Qwen3-0.6B ExtSeed-153 (1.47B cells, 8 MiB) in 450.2 s GPU (10.76 s CPU) at unique-decoding $Q=128$, passes a 14/14 cheating matrix, and scales to 36-layer Qwen3-4B (dev $4+2$) and live vLLM Qwen3-30B-A3B-FP8 Relation 6 (1.49 s prove, 23.4 ms Rust verify, public weight tiles). Rust fpn-verify checks 8 MiB FPN2 Relation 2 proofs in 10.1 ms on CPU.", "arxiv_id": "2611.33741", "arxiv_url": "https://arxiv.org/abs/2611.33741", "authors": ["Liang Song"], "brief": "", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33741", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33741v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FlashProve-Next: Verifiable Inference for Production LLM APIs", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Covariate-aware time-series foundation models (TSFMs) condition their forecasts on additional input variables, called covariates, that are supplied over the future horizon. This capability makes them appealing for interventional forecasting, in which a target is predicted under a planned action such as a new product pricing policy or a new patient treatment schedule. We refer to covariates that encode such actions as treatment covariates. Current covariate-aware TSFMs, however, are trained on observed patterns, and their behavior is unclear when future treatment covariates fall outside the range seen in the history. Examples include a numerical treatment that leaves its historical range and a categorical treatment that takes a previously unseen policy. We call this practically common setting covariate novelty, and note that it is not systematically represented in existing benchmarks. We introduce an operational definition of covariate novelty and use it to construct CovNovBench, a benchmark of 88,476 evaluation series generated or filtered from four simulator-based and real-world datasets. The benchmark spans categorical and numerical treatment covariates as well as stable and trending targets. We evaluate six covariate-aware TSFMs zero-shot using point and directional accuracy metrics. No model is consistently reliable in our benchmark: point error almost always increases under covariate novelty, directional performance changes non-uniformly, and the best observed model varies across datasets and metrics. CovNovBench provides a systematic testbed for developing TSFMs that forecast more reliably under covariate novelty.", "arxiv_id": "2611.33732", "arxiv_url": "https://arxiv.org/abs/2611.33732", "authors": ["Wenhao Pan", "Ravi Kiran Selvam", "Michael W. Mahoney", "Mayank Jauhari", "Mengfei Cao", "Dmitry Efimov", "Boris N. Oreshkin"], "brief": "", "categories": ["cs.LG", "stat.ME"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33732", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33732v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CovNovBench: A Benchmark for Evaluating Time Series Foundation Models under Covariate Novelty", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The use of classifier-free guidance in diffusion and flow models has proven critical to their empirical success, as it allows for the controllable generation of lower-temperature and higher-fidelity samples. Despite its widespread use, classifier-free guidance remains both empirically and theoretically poorly understood, owing to the difficulty of solving the associated transport equations for arbitrary normalizing flows. In this paper, we observe that the effects of classifier-free guidance arise from a mismatch between the representation capabilities of the conditional and unconditional distributions, wherein the conditional distribution exhibits higher complexity and fidelity. We propose an analytical model to capture this observation: the conditional distribution is a Gaussian mixture whose means lie on an ellipsoid, and the unconditional distribution is a single Gaussian approximating the mixture. The flows arising from this mixture are closed under scaling, enabling us to derive analytic closed-form solutions for the guided distribution at all noise scales and guidance levels. Our analytic solution shows that classifier-free guidance induces (a) a shift along a mean-axis direction and (b) a persistent skew toward, and concentration around, a singular point corresponding to the conditional sample starting from zero noise. We validate our theoretical predictions on pretrained, large-scale image diffusion models.", "arxiv_id": "2611.33719", "arxiv_url": "https://arxiv.org/abs/2611.33719", "authors": ["Daniel Pfrommer", "Chenyang Yuan", "Frank Permenter", "Ali Jadbabaie"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33719", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33719v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Understanding Mode Collapse in Diffusion Models under Classifier-Free Guidance", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hybrid simulators embed learnable components such as neural networks in physical solvers and train them on reference trajectories. Many scientific solvers feature hard switches, such as a tripping power line, an igniting grid cell, or depolarizing brain tissue, where the loss exhibits discrete jumps across switch flips, leaving standard automatic differentiation to capture only its smooth part. Existing training paradigms face a fundamentally challenging trade-off, as gradient-based relaxations smooth the switches and introduce bias across jumps, whereas derivative-free methods treat the solver as a black box and discard path gradients of the continuous dynamics. Here we introduce EventFlip, which flips a near-threshold switch from a stored state, replays the original solver, and measures the loss difference between the two runs, in effect a finite difference across the switch. By perturbing every threshold with small Gaussian noise, we cast each switch as a stochastic binary decision and derive an unbiased gradient estimator that combines the continuous path gradient with a jump term constructed from these counterfactual rollouts. EventFlip-Rand optimizes this noise-averaged objective, whereas EventFlip-Hard operates on the deterministic hard-switch simulator used at deployment and provably targets the complete discontinuous loss. Under an identical forward evaluation budget, we benchmark EventFlip against twelve baselines across a power-grid cascade, a detonation wave, and cortical spreading depolarization, achieving the lowest error on every task and reducing the strongest baseline\u0027s error by factors of 1.5, 1.4, and 1.4, respectively.", "arxiv_id": "2611.33716", "arxiv_url": "https://arxiv.org/abs/2611.33716", "authors": ["Tianrun Gao", "Ruiqi Feng", "Haomin Wen", "Tailin Wu", "Liangqiong Qu", "Xiaomeng Huang", "Ruiqi Shu"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33716", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33716v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Flipping the Coins: Training Physical Simulators through Hard Switches", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated currency denomination recognition is a computer vision task with applications in cash handling, financial technology, and assistive systems. This study classifies seven Nepali currency denominations (Rs. 5, 10, 20, 50, 100, 500, and 1,000) using three configurations: a conventional convolutional neural network (CNN), MobileNetV2 with transfer learning, and MobileNetV2 with hyperparameter tuning. A compiled dataset of 16,249 images was used, comprising 10,500 training, 3,500 validation, and 2,249 independent test images. Images were resized to 128 x 128 pixels, normalized, and augmented to vary orientation, scale, illumination, and appearance. Models were evaluated using accuracy, precision, recall, F1-score, and precision-recall and ROC analysis. The hyperparameter-tuned MobileNetV2 achieved the highest validation accuracy (95\\%), with precision, recall, and F1-score of 0.93, 0.91, and 0.92, but reached only 84\\% accuracy on the held-out test set. MobileNetV2 with transfer learning but no additional tuning achieved 89\\% test accuracy, and the conventional CNN achieved 85\\%. Transfer learning therefore provided a competitive approach under the evaluated conditions, while higher validation accuracy from tuning did not yield higher test accuracy. To demonstrate practical deployment, a Flask-based web prototype using TensorFlow Lite was developed, supporting image upload and live webcam recognition with both visual and voice output. The study shows the feasibility of combining lightweight deep learning with a voice-assisted web interface for Nepali currency recognition, and highlights the need for more diverse datasets, greater robustness under uncontrolled imaging conditions, and broader real-world evaluation.", "arxiv_id": "2611.33713", "arxiv_url": "https://arxiv.org/abs/2611.33713", "authors": ["Sakar Lamichhane", "Sandesh Bhatta", "Aayush Adhikari", "Aaron Sapkota"], "brief": "", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33713", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33713v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Nepali Currency Denomination Classification Using Convolutional Neural Networks (CNNs) and MobileNetV2: An Experimental Comparison", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Node-differentially private algorithms enable learning on network-structured datasets in which records reflect interactions among individuals. They protect the privacy of each individual\u0027s information, including all their associated records. A key challenge in the design of such algorithms is to exploit the structure of realistic graphs---where most nodes have low degree---to achieve high accuracy, without compromising on the worst-case privacy guarantee. In this work we give two new tools for designing accurate, computationally efficient node-differentially private algorithms. First, we give a nearly linear time, randomized, node-stable graph projection: the projection leaves graphs of maximum degree $D$ unchanged, maps arbitrary graphs to subgraphs of maximum degree $\\hat D \\approx D$, and ensures that changing one node of the input graph has only a small effect on the distribution of the edges selected among the remaining vertices. Unlike prior approaches, which abstain when the input violates the degree bound, our projection acts as degree clipping: even when $D$ is set well below the true maximum degree (trading truncation bias at high-degree outliers for lower privacy noise), it retains at least as many edges as a maximal $D$-bounded subgraph. Second, for graphs with bounded edge weights, we give a deterministic nearly linear time Lipschitz extension for the total edge weight that agrees with the original sum on graphs of maximum degree $D$ yet is $D$-Lipschitz on all graphs. Finally, we show how to apply these methods to design node-private algorithms for high-dimensional vector summation and gradient descent on datasets where records are associated with graph edges, such as email threads.", "arxiv_id": "2611.33672", "arxiv_url": "https://arxiv.org/abs/2611.33672", "authors": ["Ishaq Aden-Ali", "Adam Sealfon", "Adam Smith", "Thomas Steinke", "Jonathan Ullman"], "brief": "", "categories": ["cs.CR", "cs.DS", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33672", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33672v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Node Differential Privacy via Node-Stable Graph Projections", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Quality control for proposition decomposition by large language models (LLMs) raises two asymmetric questions. After decomposition, one can verify: given a sentence and a candidate proposition, does the proposition belong to that sentence? Before decomposition, one would like to predict: how many propositions should the sentence yield? On PropSegmEnt, a corpus of English Wikipedia sentences each segmented by three human annotators, we find that the two questions live in different representational spaces. A natural language inference (NLI) judge verifies membership with 92.8% accuracy and an area under the ROC curve (AUC) of 0.977, and its residual errors turn out to be mostly propositions that are true in document context rather than genuine entailment mistakes. Vector geometry cannot verify: cosine similarity saturates, and a sentence embedding is not a linear combination of its propositions\u0027 embeddings. For prediction, every symbolic anchor we test, namely token count, the CPIDR idea-density counter, and a Neo-Davidsonian predicate count, reduces to a length proxy once token count is controlled. A linear ridge probe on sentence embeddings is the only predictor that keeps genuine count signal: its length-partialled correlation with human counts is 0.40-0.49 with bootstrap confidence intervals (CIs) excluding zero, and it orders length-matched sentence pairs correctly 67-71% of the time against a 50% chance level, statistically matching the inter-annotator agreement ceiling. This signal survives INT8 quantization without loss, INT4 at a small cost, and Matryoshka truncation to 256 dimensions, and it works as well in a 2021 encoder as in a 2025 one. Its structured weakness is a systematic under-splitting of long sentences. We distill the protocol lessons, including a retracted pilot study, into a checklist for probing length-confounded quantities.", "arxiv_id": "2611.33668", "arxiv_url": "https://arxiv.org/abs/2611.33668", "authors": ["Qingan Li", "Tianxiao Wu", "Xiling Cui"], "brief": "", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33668", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33668v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Verifiable but Not Predictable: What Sentence Embeddings Know About Propositional Decomposition", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Social-deduction games give models opposing objectives, but they also give roles different information and speaking obligations. We analyze 5,404 public utterances from 150 Chinese Werewolf games played by 12 models, comparing ordinary wolves with ordinary villagers so that special roles are excluded. Private knowledge and goals still differ, and no utterance is verified as true or false. After model and length adjustment, wolf utterances score higher on both certainty and uncertainty (coefficients +0.074 and +0.072). Emotional intensification has the largest rank-biserial effect (r = .145), but it depends on a single degree marker and correlates weakly with human-rated affect. Three annotators\u0027 ratings of 392 utterances show higher wolf scores on four behavioral dimensions, and five LLM judges reach 60.8%-70.2% accuracy on a shared evaluation set. In a generation probe that prompts six models with a wolf identity but a villager speaking goal under fixed public context, certainty (+0.164) and emotional intensification (+0.095) increase. These findings describe role-associated language rather than verified lying, and they argue for explicit comparison groups and lexicon sensitivity checks in game-based deception evaluation. Data and code are available at https://github.com/justinchoi929/Tells-of-a-Lying-Machine", "arxiv_id": "2611.33747", "arxiv_url": "https://arxiv.org/abs/2611.33747", "authors": ["Xian Cui", "Gan Yang", "Dongqi Han", "Han Zhu", "Bo Zheng", "Jianhui Zheng", "Xiaoyong Li"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33747", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33747v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tells of a Lying Machine: Analyzing LLM-Generated Strategic Dialogue in Chinese Werewolf", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cultural alignment requires large language models (LLMs) to infer often-implicit social norms from a scenario and its cultural context. Existing approaches typically adapt individual models or supply external cultural knowledge, while learning norm inference independently of downstream response generation remains underexplored. We introduce NORMCRAFT, a modular framework that decouples norm inference from response generation. Through norm-centric multi-view supervision, we train an LLM as a norm generator to recover shared norms from prospective, adherence, and violation scenarios without downstream response labels. The generated norms guide a separate, frozen LLM (the responder). With Qwen3.5-4B as the responder, NORMCRAFT outperforms prompting and supervised fine-tuning (SFT) baselines on four of five downstream metrics. On SafeWorld, its responses reflect the reference norms more often (Coverage) and more precisely (Faithfulness), exceeding Responder SFT by 18.0 and 14.1 percentage points, respectively. Direct norm evaluation also shows higher norm quality than the base and few-shot generators. The same trained generator improves cultural alignment on SafeWorld across fourteen frozen LLMs spanning five families and 0.8B to 27B parameters, with the largest gains for the smallest models.", "arxiv_id": "2611.33726", "arxiv_url": "https://arxiv.org/abs/2611.33726", "authors": ["Tangyuan Zhang", "Zhuang Li", "Fatemeh Shiri", "Xiangyu Zhao", "Junyu Yan", "Xiuzhen Zhang"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33726", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33726v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "NORMCRAFT: Cultural Norm Generation for Context-Aware Language Model Alignment", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The Locate-Then-Edit framework enables efficient knowledge updates in large language models without requiring full retraining. Recent research has increasingly focused on sequential editing, where knowledge arrives continuously and the model is updated incrementally. However, existing sequential methods commonly suffer from catastrophic forgetting and model collapse after only a few hundred edits. In contrast, batch editing - which jointly optimizes all edits and yields the optimal solution under a specified editing objective - can support tens of thousands of edits with high edit efficacy while preserving the model\u0027s general capabilities, resulting in a substantial performance gap between the two editing paradigms. In this paper, we demonstrate that this gap can be closed via a batch-equivalent sequential editing approach. Moreover, we investigate the underlying mechanism of model degradation in existing sequential methods by analyzing the convergence behavior of weight perturbations as edits accumulate. Our analysis reveals that current methods typically exhibit linear or logarithmic growth in perturbation, whereas the proposed batch-equivalent method achieves time-invariant growth, thereby theoretically guaranteeing long-term stability and preserving the integrity of pretrained knowledge throughout massive-scale sequential editing.", "arxiv_id": "2611.33692", "arxiv_url": "https://arxiv.org/abs/2611.33692", "authors": ["Bingqing Liu", "Wei Liu", "Zhiying Deng", "Jun Wang", "Yuhua Li", "Ruixuan Li"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33692", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33692v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rethinking Sequential Locate-Then-Edit: Optimality and Stability", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Bias audits of conversational models often discard refusals (responses such as \"I can\u0027t assist with that request\") before scoring, a filtering step which is rarely examined as a measurement decision even though it determines which responses an audit is capable of evaluating. This work examines what the step removes, applying seven bias-evaluation instruments spanning both deployed paradigms, three dictionary-based and four LLM-as-judge, to two intersectional datasets of 360 generated responses each. In both datasets, the filter removed a demographically skewed subset produced entirely by one of the three responder models, which refused North Korean prompts at 2.15 times the rate of American prompts on declarative content and 1.76 times on operational content. We then remove the filter and pass every refusal to all seven instruments. Bias-Lexicon scores refusals as clean, and including them shrinks the nationality disparity it reports. HurtLex appears to register the disparity, but we trace this entirely to a single lexicon entry matching the token \"can\" in \"I can\u0027t\". The LLM judges either flag most responses or rate refusals as unbiased. For the two judges that discriminate, including refusals lowers the nationality disparity they report, and no instrument identifies the refusal disparity. The failure is therefore a coverage limit upstream of scoring rather than a calibration gap that a better lexicon or judge prompt would be expected to close, which makes the behavioral channel an instrument is sensitive to a question of construct validity rather than one of method selection.", "arxiv_id": "2611.33690", "arxiv_url": "https://arxiv.org/abs/2611.33690", "authors": ["Afifah Kashif", "Malak Sadek", "Jin Huang", "Hatice Gunes"], "brief": "", "categories": ["cs.CL", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33690", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33690v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Refusal Is Not Scored: A Coverage Limit in Content-Based Bias Evaluation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Knowledge distillation has recently proven highly effective for improving autoregressive models, but its applicability to DLMs remains poorly understood. We present the first systematic study of KD for DLMs and uncover two non-intuitive failures of classical forward-KL (FKL) distillation: (i) student perplexity does not improve monotonically with more teacher-generated data, and (ii) on the same teacher-generated corpus, FKL distillation underperforms simply training the student with the original DLM denoising objective. To address them, we propose a unified, data-free distillation framework for masked DLMs. First, the framework runs an off-policy distillation phase that absorbs general knowledge from a static set of teacher-generated data. Then, the framework employs on-policy distillation which consists of three techniques: a trajectory loss along the student\u0027s own reverse process, confidence reweighting that down-weights tokens where the teacher is unsure, and a trust-region anchor that stabilizes the moving target. On MDLM, the resulting student attains a GPT-2 perplexity of $24.75$, surpassing the teacher\u0027s $27.04$; on Dream-7B distillation to a 93M student model, the framework reduces Qwen-2.5 perplexity from the FKL-distilled baseline of $25.23$ to $19.83$ while preserving performance on zero-shot general capability benchmarks.", "arxiv_id": "2611.33670", "arxiv_url": "https://arxiv.org/abs/2611.33670", "authors": ["Yuxuan Sun", "Yuanjian Xu", "Jianing Hao", "Yu Li", "Sowmen Das", "Zhong Li", "Sangwoong Yoon", "Miguel R. D. Rodrigues"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33670", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33670v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rethinking Knowledge Distillation for Diffusion Language Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
