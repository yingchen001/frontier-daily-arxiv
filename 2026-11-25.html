 containing observations, generated programs, actions, and feedback to support research on how coding agents reason and act in the physical world.", "arxiv_id": "2611.31205", "arxiv_url": "https://arxiv.org/abs/2611.31205", "authors": ["Zexin He", "Rui Li", "Yushi Lan", "Chengkai Jin", "Zhi Hou", "Xingang Pan"], "brief": "ACAP\u8ba9\u6301\u4e45\u7f16\u7801\u667a\u80fd\u4f53\u5206\u522b\u8d1f\u8d23\u673a\u68b0\u81c2\u3001\u5e95\u76d8\u7b49\u63a7\u5236\u7ec4\uff0c\u5f02\u6b65\u63a8\u7406\u5e76\u6267\u884c\u7a0b\u5e8f\uff1b\u7531\u4e0a\u5c42\u667a\u80fd\u4f53\u5206\u6d3e\u4efb\u52a1\u3001\u534f\u8c03\u7269\u7406\u4f9d\u8d56\uff0c\u5e76\u52a8\u6001\u5206\u914d\u63a7\u5236\u6743\u3002", "categories": ["cs.RO", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31205", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0a\u5c42\u667a\u80fd\u4f53\u52a8\u6001\u5206\u914d\u63a7\u5236\u6743\uff0c\u517c\u987e\u5e76\u884c\u4e0e\u534f\u4f5c\u64cd\u4f5c", "72\u6b21\u771f\u5b9e\u8bd5\u9a8c\u300125\u79cd\u8bbe\u7f6e\uff0c\u4efb\u52a1\u5747\u8861\u8017\u65f6\u964d\u4f4e28.2%", "\u53e690\u6b21\u8bd5\u9a8c\u4e2d\uff0c\u516d\u9879\u4efb\u52a1\u7684\u9650\u65f6\u5e73\u5747\u8017\u65f6\u5747\u4f18\u4e8eDirect"], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u673a\u5668\u4eba\u63a7\u5236", "\u4ee3\u7801\u751f\u6210", "\u5f02\u6b65\u6267\u884c"], "num_comments": 3, "on_hf": true, "organization": "MMLab@NTU", "pdf_url": "https://arxiv.org/pdf/2611.31205v1", "published_at": "2026-11-23", "score": 0.317, "selected_reasons": ["HF trending (62\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31205.png", "title": "ACAP: Asynchronous Coding Agents for Efficient Robot Control", "tldr": "\u5c06\u673a\u5668\u4eba\u62c6\u5206\u4e3a\u5f02\u6b65\u7f16\u7801\u667a\u80fd\u4f53\u56e2\u961f\uff0c\u534f\u8c03\u90e8\u4ef6\u4f9d\u8d56\u5e76\u964d\u4f4e\u4efb\u52a1\u8017\u65f6\u3002", "upvotes": 62, "what_it_is": "ACAP\u8ba9\u6301\u4e45\u7f16\u7801\u667a\u80fd\u4f53\u5206\u522b\u8d1f\u8d23\u673a\u68b0\u81c2\u3001\u5e95\u76d8\u7b49\u63a7\u5236\u7ec4\uff0c\u5f02\u6b65\u63a8\u7406\u5e76\u6267\u884c\u7a0b\u5e8f\uff1b\u7531\u4e0a\u5c42\u667a\u80fd\u4f53\u5206\u6d3e\u4efb\u52a1\u3001\u534f\u8c03\u7269\u7406\u4f9d\u8d56\uff0c\u5e76\u52a8\u6001\u5206\u914d\u63a7\u5236\u6743\u3002", "why_notable": "\u628a\u591a\u667a\u80fd\u4f53\u5e76\u884c\u4ece\u8f6f\u4ef6\u4efb\u52a1\u63a8\u8fdb\u5230\u5b9e\u4f53\u673a\u5668\u4eba\u63a7\u5236\uff0c\u540c\u65f6\u5904\u7406\u90e8\u4ef6\u95f4\u7269\u7406\u8026\u5408\uff1b\u771f\u5b9e\u8bd5\u9a8c\u663e\u793a\u5176\u6548\u7387\u4f18\u52bf\u4e0d\u5c40\u9650\u4e8e\u72ec\u7acb\u4efb\u52a1\u3002"}, {"abstract": "People reason with pictures as well as words. Interleaved multimodal reasoning gives models a similar way to solve problems by creating intermediate images and using them to guide further reasoning. Training models with this ability usually relies on task-specific demonstrations, which are difficult to collect. We introduce ThinkMorph-SSL, a two-stage training recipe that uses images themselves as a source of supervision. The first stage, pretext reasoning, converts visual pretext tasks, such as image colorization and denoising, into instruction-free interleaved traces. Models describe a corrupted or transformed image, generate a restored or canonical image, and interpret the result. The second stage uses automatically constructed demonstrations for question-driven instruction tuning. At the same instruction-tuning budget, models trained with pretext reasoning outperform those trained with instruction tuning alone. The full recipe improves over the base model by an average of 11.33 accuracy points across twelve benchmarks. These results show that supervision derived from images can build the visual skills needed for interleaved reasoning and improve learning from task-specific demonstrations.", "arxiv_id": "2611.32183", "arxiv_url": "https://arxiv.org/abs/2611.32183", "authors": ["Jiawei Gu", "Linjie Li", "Yiming Liu", "Yunzhuo Hao", "Huichen Wang", "Guanzheng Chen", "Zhichao Peng", "Luxin Xu", "Xinyu Zhang", "Li Luo", "Disen Lan", "Zican Hu", "Mingyang Song", "David Valente", "Alex Jinpeng Wang", "Yafu Li", "Ganqu Cui", "Zhengyuan Yang", "Qizhe Xie", "Yejin Choi", "Ranjay Krishna", "Yu Cheng"], "brief": "\u63d0\u51fa\u4e24\u9636\u6bb5\u8bad\u7ec3\u65b9\u6848\uff1a\u5148\u5c06\u7740\u8272\u3001\u53bb\u566a\u7b49\u89c6\u89c9\u9884\u6587\u672c\u4efb\u52a1\u8f6c\u4e3a\u63cf\u8ff0\u3001\u751f\u6210\u3001\u89e3\u8bfb\u56fe\u50cf\u7684\u4ea4\u9519\u8f68\u8ff9\uff0c\u518d\u7528\u81ea\u52a8\u6784\u5efa\u7684\u95ee\u7b54\u793a\u8303\u8fdb\u884c\u6307\u4ee4\u5fae\u8c03\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": "https://github.com/ThinkMorph/ThinkMorph-SSL", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.32183", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9884\u6587\u672c\u63a8\u7406\uff1a\u63cf\u8ff0\u53d7\u635f\u56fe\u50cf\u3001\u751f\u6210\u590d\u539f\u56fe\u50cf\u5e76\u89e3\u8bfb", "\u76f8\u540c\u6307\u4ee4\u5fae\u8c03\u9884\u7b97\u4e0b\uff0c\u4f18\u4e8e\u4ec5\u505a\u6307\u4ee4\u5fae\u8c03", "\u5341\u4e8c\u9879\u57fa\u51c6\u5e73\u5747\u51c6\u786e\u7387\u8f83\u57fa\u7840\u6a21\u578b\u63d0\u534711.33\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u591a\u6a21\u6001\u63a8\u7406", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u6307\u4ee4\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.32183v1", "published_at": "2026-11-24", "score": 0.31, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32183.png", "title": "ThinkMorph-SSL: Scaling Interleaved Multimodal Reasoning with Pretext Tasks", "tldr": "\u7528\u56fe\u50cf\u81ea\u76d1\u7763\u8bad\u7ec3\u56fe\u6587\u4ea4\u9519\u63a8\u7406\uff0c\u51cf\u5c11\u5bf9\u4efb\u52a1\u793a\u8303\u4f9d\u8d56\u5e76\u63d0\u5347\u591a\u6a21\u6001\u51c6\u786e\u7387\u3002", "upvotes": 21, "what_it_is": "\u63d0\u51fa\u4e24\u9636\u6bb5\u8bad\u7ec3\u65b9\u6848\uff1a\u5148\u5c06\u7740\u8272\u3001\u53bb\u566a\u7b49\u89c6\u89c9\u9884\u6587\u672c\u4efb\u52a1\u8f6c\u4e3a\u63cf\u8ff0\u3001\u751f\u6210\u3001\u89e3\u8bfb\u56fe\u50cf\u7684\u4ea4\u9519\u8f68\u8ff9\uff0c\u518d\u7528\u81ea\u52a8\u6784\u5efa\u7684\u95ee\u7b54\u793a\u8303\u8fdb\u884c\u6307\u4ee4\u5fae\u8c03\u3002", "why_notable": "\u5c06\u56fe\u50cf\u672c\u8eab\u8f6c\u5316\u4e3a\u63a8\u7406\u76d1\u7763\uff0c\u63d0\u4f9b\u4e86\u7ed5\u5f00\u6602\u8d35\u4eba\u5de5\u793a\u8303\u7684\u8bad\u7ec3\u8def\u5f84\uff0c\u5e76\u8ba9\u6a21\u578b\u66f4\u6709\u6548\u5730\u5229\u7528\u540e\u7eed\u4efb\u52a1\u793a\u8303\u3002"}, {"abstract": "Modern visual generative models operate on tokens, and every visual asset they receive, whether an identity, a scribble, a depth map, or a motion video, is tokenized and appended to the input token sequence. Consequently, conditioning quickly dominates the computation cost. Yet most of these tokens carry redundant spatiotemporal information. Our key insight is that identifying what is genuinely new is exactly the problem that classical video codecs have long solved. Thus, we first introduce a codec-based token pruning method that discards redundant tokens. Then, we propose an on-policy self-distillation (OPSD) strategy to train a DiT adapter capable of learning the codec pruning pattern well without quality degradation. Together, they form On-Policy Codec Distillation (CodecOPSD). We scale CodecOPSD to 16 condition modalities on our own video diffusion model, where it prunes 66% of the condition tokens on average with almost no quality drop. Therefore, denoising becomes 2x faster, and the cache memory shrinks by up to 73% in KV cache mode. CodecOPSD also extends to other state-of-the-art pretrained image and video generative models, where its benefit grows further with more conditions, longer frames, and higher resolution.", "arxiv_id": "2611.31184", "arxiv_url": "https://arxiv.org/abs/2611.31184", "authors": ["Boyang Wang", "Kevin Blackburn-Matzen", "Oindrila Saha", "Matheus Gadelha", "Zezhou Cheng"], "brief": "CodecOPSD\u5229\u7528\u89c6\u9891\u7f16\u7801\u5668\u8bc6\u522b\u6761\u4ef6\u8f93\u5165\u4e2d\u7684\u65f6\u7a7a\u5197\u4f59\u5e76\u526a\u9664\u4ee4\u724c\uff0c\u518d\u901a\u8fc7\u5728\u7b56\u7565\u81ea\u84b8\u998f\u8bad\u7ec3DiT\u9002\u914d\u5668\uff0c\u4f7f\u6a21\u578b\u9002\u5e94\u526a\u679d\u800c\u57fa\u672c\u4e0d\u635f\u5931\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Kiteretsu77/CodecOPSD", "github_stars": 19, "hf_url": "https://huggingface.co/papers/2611.31184", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7f16\u7801\u5668\u526a\u679d\u7ed3\u5408\u5728\u7b56\u7565\u81ea\u84b8\u998f\uff08OPSD\uff09\u8bad\u7ec3DiT\u9002\u914d\u5668", "\u8986\u76d616\u79cd\u6761\u4ef6\u6a21\u6001\uff0c\u5e73\u5747\u526a\u966466%\u6761\u4ef6\u4ee4\u724c\uff0c\u8d28\u91cf\u51e0\u4e4e\u4e0d\u964d", "\u53bb\u566a\u63d0\u901f2\u500d\uff0cKV\u7f13\u5b58\u6a21\u5f0f\u4e0b\u7f13\u5b58\u5185\u5b58\u6700\u591a\u51cf\u5c1173%"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u4ee4\u724c\u526a\u679d", "\u77e5\u8bc6\u84b8\u998f", "\u591a\u6a21\u6001\u6761\u4ef6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31184v1", "published_at": "2026-11-23", "score": 0.3, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31184.png", "title": "On-Policy Codec Distillation for Efficient All-in-One Video Generation", "tldr": "\u501f\u52a9\u89c6\u9891\u7f16\u7801\u5668\u526a\u679d\u4e0e\u81ea\u84b8\u998f\uff0c\u524a\u51cf\u591a\u6a21\u6001\u6761\u4ef6\u5197\u4f59\uff0c\u8ba9\u89c6\u9891\u751f\u6210\u53bb\u566a\u63d0\u901f\u4e24\u500d\u3002", "upvotes": 12, "what_it_is": "CodecOPSD\u5229\u7528\u89c6\u9891\u7f16\u7801\u5668\u8bc6\u522b\u6761\u4ef6\u8f93\u5165\u4e2d\u7684\u65f6\u7a7a\u5197\u4f59\u5e76\u526a\u9664\u4ee4\u724c\uff0c\u518d\u901a\u8fc7\u5728\u7b56\u7565\u81ea\u84b8\u998f\u8bad\u7ec3DiT\u9002\u914d\u5668\uff0c\u4f7f\u6a21\u578b\u9002\u5e94\u526a\u679d\u800c\u57fa\u672c\u4e0d\u635f\u5931\u751f\u6210\u8d28\u91cf\u3002", "why_notable": "\u5c06\u4f20\u7edf\u89c6\u9891\u7f16\u7801\u7684\u53bb\u5197\u4f59\u80fd\u529b\u8fc1\u79fb\u5230\u751f\u6210\u6a21\u578b\uff0c\u76f4\u63a5\u964d\u4f4e\u591a\u6761\u4ef6\u8f93\u5165\u6210\u672c\uff1b\u8fd8\u80fd\u9002\u914d\u5176\u4ed6\u9884\u8bad\u7ec3\u6a21\u578b\uff0c\u6761\u4ef6\u8d8a\u591a\u3001\u89c6\u9891\u8d8a\u957f\uff0c\u6536\u76ca\u8d8a\u660e\u663e\u3002"}, {"abstract": "We present KMed-31B, a medical large language model post-trained from an open-weight model for on-premises deployment with limited hardware. Post-training a model for diverse medical tasks remains difficult, because improving one kind of task can lower performance on another. We attribute this to differences between tasks in expected output and available feedback. Medical question answering and diagnosis prediction have reference answers, whereas clinical inquiry has no single correct response and is judged with rubrics. We therefore divide medical training tasks into four categories by these two properties, train one specialist per category with a reward that its feedback supports, and integrate the specialists into a single student with Multi-teacher On-policy Delta Distillation (MOPD$^2$). For clinical inquiry, we build Synthetic Health Dialogue, a simulated corpus of consultations with lay users and clinicians whose patient cases span common clinical presentations in primary care. Relative to its base model, KMed-31B raises HealthBench Hard from 22.95 to 41.87 and HealthBench Professional from 37.92 to 50.20 in non-thinking mode, and from 23.80 to 51.48 and from 41.97 to 59.18 in thinking mode, while its scores on four multiple-choice medical benchmarks are maintained or slightly improved. KMed-31B has the highest unadjusted HealthBench Hard score among the compared models, including proprietary ones, and scores higher on HealthBench Professional than every open-weight model we compare, including models with more than ten times as many total parameters. Applied to another base model, Qwen3.8-27B, the same training recipe also raises both HealthBench scores. We describe the training recipe, data construction, and settings in detail so that institutions requiring on-premises deployment can develop medical models from open-weight foundations.", "arxiv_id": "2611.28719", "arxiv_url": "https://arxiv.org/abs/2611.28719", "authors": ["KMed Team"], "brief": "\u57fa\u4e8e\u5f00\u653e\u6743\u91cd\u6a21\u578b\u540e\u8bad\u7ec3\u9762\u5411\u672c\u5730\u90e8\u7f72\u7684\u533b\u7597\u6a21\u578b\uff0c\u6309\u8f93\u51fa\u5f62\u5f0f\u4e0e\u53cd\u9988\u7c7b\u578b\u5212\u5206\u56db\u7c7b\u4efb\u52a1\uff0c\u5206\u522b\u8bad\u7ec3\u4e13\u5bb6\uff0c\u518d\u7528\u591a\u6559\u5e08\u5728\u7ebf\u5dee\u5206\u84b8\u998f\u6574\u5408\u4e3a\u5355\u4e00\u6a21\u578b\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28719", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["MOPD\u00b2\u5c06\u56db\u7c7b\u4efb\u52a1\u4e13\u5bb6\u84b8\u998f\u5230\u5355\u4e00\u5b66\u751f\u6a21\u578b", "\u6784\u5efaSynthetic Health Dialogue\u6a21\u62df\u95ee\u8bca\u8bed\u6599", "\u601d\u8003\u6a21\u5f0fHealthBench Hard\u4ece23.80\u5347\u81f351.48"], "keywords": ["\u533b\u7597\u5927\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u5408\u6210\u6570\u636e", "\u672c\u5730\u90e8\u7f72"], "num_comments": 2, "on_hf": true, "organization": "NAVER", "pdf_url": "https://arxiv.org/pdf/2611.28719v1", "published_at": "2026-11-21", "score": 0.285, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28719.png", "title": "KMed-31B Technical Report", "tldr": "\u901a\u8fc7\u5206\u7c7b\u4e13\u5bb6\u8bad\u7ec3\u4e0e\u591a\u6559\u5e08\u84b8\u998f\uff0c\u63d0\u5347\u533b\u7597\u6a21\u578b\u95ee\u8bca\u80fd\u529b\u5e76\u4fdd\u6301\u7b54\u9898\u8868\u73b0\u3002", "upvotes": 19, "what_it_is": "\u57fa\u4e8e\u5f00\u653e\u6743\u91cd\u6a21\u578b\u540e\u8bad\u7ec3\u9762\u5411\u672c\u5730\u90e8\u7f72\u7684\u533b\u7597\u6a21\u578b\uff0c\u6309\u8f93\u51fa\u5f62\u5f0f\u4e0e\u53cd\u9988\u7c7b\u578b\u5212\u5206\u56db\u7c7b\u4efb\u52a1\uff0c\u5206\u522b\u8bad\u7ec3\u4e13\u5bb6\uff0c\u518d\u7528\u591a\u6559\u5e08\u5728\u7ebf\u5dee\u5206\u84b8\u998f\u6574\u5408\u4e3a\u5355\u4e00\u6a21\u578b\u3002", "why_notable": "\u5728\u4fdd\u6301\u56db\u9879\u533b\u7597\u9009\u62e9\u9898\u57fa\u51c6\u8868\u73b0\u7684\u540c\u65f6\u663e\u8457\u6539\u5584\u95ee\u8bca\u8bc4\u6d4b\uff0c\u4e14\u8bad\u7ec3\u914d\u65b9\u5728\u53e6\u4e00\u57fa\u5ea7\u4e0a\u540c\u6837\u6709\u6548\uff0c\u4e3a\u533b\u7597\u673a\u6784\u672c\u5730\u90e8\u7f72\u63d0\u4f9b\u53c2\u8003\u3002"}, {"abstract": "Fine-tuning a generator on a complete high-resolution canvas requires long image sequences and substantial computation, yet local regions can still exhibit unnatural repetitive stripes when training resources are limited. We introduce Qwen-Image-HD, which adapts Qwen-Image 2.0 to high-resolution synthesis through local training and blockwise autoregressive generation. Each prediction covers a target tile at 1K scale, conditioned on high-resolution upper and left neighbors and a compressed historical thumbnail. These conditions provide adjacent fine-scale structures and an overview of the scene generated so far. To integrate these complementary cues, we map both forms of history and the target to a shared canvas coordinate system to express their spatial relationships and scale differences. On Qwen-Image-Bench at 4K, Qwen-Image-HD achieves stronger overall evaluation performance than direct 4K generation with FLUX-3-Image-Klein. Compared with full-image 4K supervised fine-tuning of the same backbone, it achieves better generation quality with lower training compute and higher inference efficiency, while exhibiting fewer unnatural repetitive stripes in original-resolution comparisons. We further introduce a Wavefront-AutoRegressive inference schedule that generates tiles on the same anti-diagonal concurrently across GPUs to reduce single-image latency.", "arxiv_id": "2611.32736", "arxiv_url": "https://arxiv.org/abs/2611.32736", "authors": ["Zihao Liu", "Zekai Zhang", "Shengming Yin", "Zikai Zhou", "Donghao Zhou", "Chenyang Zhu", "Lihan Jiang", "Ningyuan Tang", "Bingxuan Zhao", "Yanran Zhang", "Yan Shu", "Zhening Liu", "Jiahao Li", "Jie Zhang", "Kaiyuan Gao", "Kun Yan", "Qihang Ai", "Rui Song", "Shuo Cao", "Xiao Xu", "Xiaoyue Chen", "Yuxiang Chen", "Zhendong Wang", "Zhouyang Li", "Bo Zheng", "Jun Zhou", "Xiu Li", "Chenfei Wu"], "brief": "\u8be5\u65b9\u6cd5\u5c06Qwen-Image 2.0\u9002\u914d\u4e3a\u9ad8\u6e05\u751f\u6210\u5668\uff0c\u6bcf\u6b21\u751f\u62101K\u56fe\u5757\u3002\u7ed3\u5408\u4e0a\u65b9\u4e0e\u5de6\u4fa7\u9ad8\u6e05\u90bb\u5757\u53ca\u5386\u53f2\u7f29\u7565\u56fe\uff0c\u5e76\u7528\u7edf\u4e00\u753b\u5e03\u5750\u6807\u7f16\u7801\u7a7a\u95f4\u4e0e\u5c3a\u5ea6\u5173\u7cfb\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.32736", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u6b21\u9884\u6d4b1K\u56fe\u5757\uff0c\u8054\u5408\u90bb\u5757\u7ec6\u8282\u4e0e\u5386\u53f2\u7f29\u7565\u56fe", "4K\u8bc4\u6d4b\u4f18\u4e8eFLUX-3-Image-Klein\u76f4\u63a5\u751f\u6210", "Wavefront-AutoRegressive\u8de8GPU\u5e76\u884c\u540c\u4e00\u53cd\u5bf9\u89d2\u7ebf\u56fe\u5757"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u81ea\u56de\u5f52\u751f\u6210", "\u9ad8\u5206\u8fa8\u7387"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.32736v1", "published_at": "2026-11-24", "score": 0.284, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32736.png", "title": "Qwen-Image-HD: Autoregressive Diffusion for High Definition Image Generation", "tldr": "\u901a\u8fc7\u5c40\u90e8\u8bad\u7ec3\u4e0e\u5206\u5757\u81ea\u56de\u5f52\u6269\u6563\uff0c\u4ee5\u66f4\u4f4e\u8ba1\u7b97\u6210\u672c\u751f\u6210\u9ad8\u8d28\u91cf\u56db\u5343\u50cf\u7d20\u56fe\u50cf\u3002", "upvotes": 20, "what_it_is": "\u8be5\u65b9\u6cd5\u5c06Qwen-Image 2.0\u9002\u914d\u4e3a\u9ad8\u6e05\u751f\u6210\u5668\uff0c\u6bcf\u6b21\u751f\u62101K\u56fe\u5757\u3002\u7ed3\u5408\u4e0a\u65b9\u4e0e\u5de6\u4fa7\u9ad8\u6e05\u90bb\u5757\u53ca\u5386\u53f2\u7f29\u7565\u56fe\uff0c\u5e76\u7528\u7edf\u4e00\u753b\u5e03\u5750\u6807\u7f16\u7801\u7a7a\u95f4\u4e0e\u5c3a\u5ea6\u5173\u7cfb\u3002", "why_notable": "\u76f8\u6bd4\u540c\u9aa8\u5e72\u6574\u56fe4K\u5fae\u8c03\uff0c\u5c40\u90e8\u8bad\u7ec3\u517c\u987e\u66f4\u4f4e\u8bad\u7ec3\u8ba1\u7b97\u91cf\u3001\u66f4\u9ad8\u63a8\u7406\u6548\u7387\u4e0e\u66f4\u597d\u753b\u8d28\uff0c\u5e76\u51cf\u5c11\u539f\u5206\u8fa8\u7387\u4e0b\u7684\u4e0d\u81ea\u7136\u91cd\u590d\u6761\u7eb9\u3002"}, {"abstract": "Reasoning models become long-horizon agents through reinforcement learning or, more cheaply, through fine-tuning on a stronger teacher\u0027s trajectories, which contain the teacher\u0027s chain-of-thought as well as its actions. The standard fine-tuning approach imitates both, yet the strongest teachers are closed models whose chain-of-thought is hidden behind an API. We show that the chain-of-thought can be left out altogether and that the long-horizon policy can be distilled from the teacher\u0027s actions alone. The student is trained on these trajectories with its reasoning block left empty, while a KL loss on a replay buffer of its own generations limits drift from its initial model. Surprisingly, the policy learned from these trajectories with an empty reasoning block carries over to inference with thinking enabled, where the student reasons in its own style while acting like the teacher, an effect we call cross-format transfer. Distilling the actions of Qwen3.6-27B raises the task success of Qwen3-4B on AppWorld from 7% to 18% and that of Qwen3-32B from 12% to 25%. We further introduce CoT-proxies, short summaries of the teacher\u0027s reasoning placed after the empty reasoning block, which raise Qwen3-4B further, to 35%. Since neither actions nor CoT-proxies need the hidden chain-of-thought, the recipe applies unchanged to closed teachers. Distilling GPT-5.6 Luna from its visible outputs and the reasoning summaries its API returns raises Qwen3-4B from 7% to 48% on AppWorld and from 3% to 28% on SWE-bench Verified.", "arxiv_id": "2611.33148", "arxiv_url": "https://arxiv.org/abs/2611.33148", "authors": ["Dawid J. Kopiczko", "Tijmen Blankevoort", "Yuki M. Asano"], "brief": "\u8bad\u7ec3\u65f6\u7559\u7a7a\u5b66\u751f\u63a8\u7406\u5757\uff0c\u4ec5\u6a21\u4eff\u6559\u5e08\u52a8\u4f5c\uff0c\u5e76\u4ee5\u81ea\u8eab\u751f\u6210\u56de\u653e\u4e0a\u7684KL\u635f\u5931\u7ea6\u675f\u6f02\u79fb\uff1b\u63a8\u7406\u65f6\u5f00\u542f\u601d\u8003\u4ecd\u80fd\u8fc1\u79fb\u7b56\u7565\uff0c\u52a0\u5165\u7b80\u77ed\u63a8\u7406\u4ee3\u7406\u53ef\u8fdb\u4e00\u6b65\u63d0\u5347\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33148", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8de8\u683c\u5f0f\u8fc1\u79fb\uff1a\u7a7a\u63a8\u7406\u5757\u8bad\u7ec3\uff0c\u5f00\u542f\u601d\u8003\u63a8\u7406", "CoT-proxies\u4f7f4B\u6a21\u578bAppWorld\u6210\u529f\u7387\u8fbe35%", "GPT-5.6\u84b8\u998f\u4f7fSWE-bench\u6210\u529f\u7387\u4ece3%\u5347\u81f328%"], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u601d\u7ef4\u94fe", "\u7b56\u7565\u8fc1\u79fb"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33148v1", "published_at": "2026-11-24", "score": 0.278, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33148.png", "title": "CoT-Proxy: Cross-Format Transfer for Distilling Long-Horizon Policies", "tldr": "\u65e0\u9700\u6559\u5e08\u9690\u85cf\u601d\u7ef4\u94fe\uff0c\u4ec5\u7528\u52a8\u4f5c\u4e0e\u7b80\u77ed\u63a8\u7406\u6458\u8981\u5373\u53ef\u84b8\u998f\u957f\u7a0b\u667a\u80fd\u4f53\u7b56\u7565\u3002", "upvotes": 14, "what_it_is": "\u8bad\u7ec3\u65f6\u7559\u7a7a\u5b66\u751f\u63a8\u7406\u5757\uff0c\u4ec5\u6a21\u4eff\u6559\u5e08\u52a8\u4f5c\uff0c\u5e76\u4ee5\u81ea\u8eab\u751f\u6210\u56de\u653e\u4e0a\u7684KL\u635f\u5931\u7ea6\u675f\u6f02\u79fb\uff1b\u63a8\u7406\u65f6\u5f00\u542f\u601d\u8003\u4ecd\u80fd\u8fc1\u79fb\u7b56\u7565\uff0c\u52a0\u5165\u7b80\u77ed\u63a8\u7406\u4ee3\u7406\u53ef\u8fdb\u4e00\u6b65\u63d0\u5347\u3002", "why_notable": "\u5c06\u957f\u7a0b\u7b56\u7565\u5b66\u4e60\u4e0e\u6559\u5e08\u601d\u7ef4\u94fe\u89e3\u8026\uff0c\u4f7f\u95ed\u6e90\u6a21\u578b\u7684\u53ef\u89c1\u8f93\u51fa\u4e5f\u80fd\u7528\u4e8e\u84b8\u998f\uff0c\u5e76\u8ba9\u5b66\u751f\u4fdd\u7559\u81ea\u8eab\u63a8\u7406\u98ce\u683c\u3002"}, {"abstract": "Audio-visual deepfakes can spread misinformation and enable impersonation, undermining trust in digital media. However, existing datasets provide limited coverage of forgery operations and their combinations, constraining detector development and systematic evaluation. We introduce Mega-MMDF, containing 100,000 real and 1.2 million forged clips across 22 pipelines spanning modality-specific manipulations, stacked forgeries, and joint audio-video generation. To assess its training value and enable fair comparisons, we develop DeepfakeBench-MM, which standardizes training and evaluation across 8 datasets and 10 detectors. Training-based detectors achieve their highest mean AUC when trained on Mega-MMDF, with gains of up to 0.0784 over the best alternative training dataset for each detector. Experiments on data scale and pipeline coverage further support the value of large, diverse training data. Cross-pipeline evaluations reveal bidirectional and asymmetric generalization. Training on composite forgeries does not necessarily enable detection of their constituent operations in isolation. Our analysis of altered inputs shows that modality masking can increase false alarms and missed detections, and temporal misalignment can raise mean predicted forgery probabilities. Together, these resources provide a foundation for understanding and improving multimodal deepfake detection, with publicly available code and dataset access subject to application and usage terms.", "arxiv_id": "2510.22622", "arxiv_url": "https://arxiv.org/abs/2510.22622", "authors": ["Kangran Zhao", "Xiaoyu Zhang", "Yupeng Chen", "Yize Chen", "Weinan Guan", "Bo Zheng", "Yufan Liao", "Chengzhe Sun", "Soumyya Kanti Datta", "Qingshan Liu", "Siwei Lyu", "Baoyuan Wu"], "brief": "\u7814\u7a76\u6784\u5efa\u8986\u76d6\u591a\u7c7b\u97f3\u89c6\u9891\u4f2a\u9020\u6d41\u7a0b\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u4f9b\u7edf\u4e00\u8bad\u7ec3\u8bc4\u6d4b\u6846\u67b6\uff1b\u901a\u8fc7\u8de8\u6570\u636e\u96c6\u3001\u8de8\u6d41\u7a0b\u53ca\u8f93\u5165\u6270\u52a8\u5b9e\u9a8c\uff0c\u68c0\u9a8c\u68c0\u6d4b\u6027\u80fd\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.CR", "cs.CV", "cs.MM"], "github_repo": "https://github.com/SCLBD/DeepfakeBench-MM", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2510.22622", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Mega-MMDF\u542b10\u4e07\u771f\u5b9e\u3001120\u4e07\u4f2a\u9020\u7247\u6bb5\uff0c\u8986\u76d622\u79cd\u6d41\u7a0b", "DeepfakeBench-MM\u7edf\u4e00\u8bc4\u6d4b8\u4e2a\u6570\u636e\u96c6\u300110\u79cd\u68c0\u6d4b\u5668", "\u8bad\u7ec3\u4e8eMega-MMDF\u7684\u68c0\u6d4b\u5668\u5e73\u5747AUC\u589e\u76ca\u6700\u9ad8\u8fbe0.0784"], "keywords": ["\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b", "\u591a\u6a21\u6001\u5b66\u4e60", "\u8bc4\u6d4b\u57fa\u51c6", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 2, "on_hf": true, "organization": "The Chinese University of Hongkong,Shenzhen", "pdf_url": "https://arxiv.org/pdf/2510.22622v3", "published_at": "2025-10-26", "score": 0.275, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2510.22622.png", "title": "Mega-MMDF and DeepfakeBench-MM: Benchmarking Multimodal Deepfake Detection Across Diverse Forgery Pipelines", "tldr": "\u4ee5\u767e\u4e07\u7ea7\u97f3\u89c6\u9891\u4f2a\u9020\u6570\u636e\u7edf\u4e00\u8bc4\u6d4b\uff0c\u63ed\u793a\u68c0\u6d4b\u5668\u8de8\u4f2a\u9020\u6d41\u7a0b\u7684\u6cdb\u5316\u77ed\u677f\u3002", "upvotes": 7, "what_it_is": "\u7814\u7a76\u6784\u5efa\u8986\u76d6\u591a\u7c7b\u97f3\u89c6\u9891\u4f2a\u9020\u6d41\u7a0b\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u4f9b\u7edf\u4e00\u8bad\u7ec3\u8bc4\u6d4b\u6846\u67b6\uff1b\u901a\u8fc7\u8de8\u6570\u636e\u96c6\u3001\u8de8\u6d41\u7a0b\u53ca\u8f93\u5165\u6270\u52a8\u5b9e\u9a8c\uff0c\u68c0\u9a8c\u68c0\u6d4b\u6027\u80fd\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "why_notable": "\u5927\u89c4\u6a21\u3001\u591a\u6d41\u7a0b\u6570\u636e\u63d0\u5347\u68c0\u6d4b\u6027\u80fd\uff0c\u540c\u65f6\u63ed\u793a\u590d\u5408\u4f2a\u9020\u8bad\u7ec3\u672a\u5fc5\u8986\u76d6\u5355\u9879\u64cd\u4f5c\uff0c\u4e3a\u8bc4\u4f30\u771f\u5b9e\u6cdb\u5316\u80fd\u529b\u63d0\u4f9b\u66f4\u6709\u529b\u7684\u57fa\u51c6\u3002"}, {"abstract": "Understanding a scene requires both geometry and semantics: geometry recovers its spatial structure, and semantics separates it into objects. Current models obtain the two from separate networks or separate passes. We present PINE, a one-step Omni Diffusion Transformer that predicts the point map, the surface normals, and the instance map of an image in one forward pass. PINE treats each map as a token stream, and a stream mask decides which streams interact. A camera-aware ray encoding positions every token by its camera ray rather than its pixel. Grounding attention adds the affinity of pretrained DINOv3 features to the attention logits. Trained on only 139K synthetic images for geometry, PINE achieves state-of-the-art point maps whether or not intrinsics are given and the best average rank on surface normals. It also exceeds SAM on large objects with less than 1 percent of its training images, and it predicts all three maps 5.7x faster than MoGe-3 with SAM.", "arxiv_id": "2611.29389", "arxiv_url": "https://arxiv.org/abs/2611.29389", "authors": ["Zeyu Ren", "Jie Ni", "Rui Qian", "Jiahao Wei", "Hao Tang", "Yongtai Liu", "Zeyu Zhang"], "brief": "PINE\u7528\u5355\u6b65\u6269\u6563Transformer\u4e00\u6b21\u524d\u5411\u9884\u6d4b\u70b9\u56fe\u3001\u8868\u9762\u6cd5\u7ebf\u548c\u5b9e\u4f8b\u56fe\u3002\u901a\u8fc7\u6d41\u63a9\u7801\u63a7\u5236\u4efb\u52a1\u4ea4\u4e92\uff0c\u5e76\u5f15\u5165\u76f8\u673a\u5c04\u7ebf\u7f16\u7801\u4e0e\u9884\u8bad\u7ec3\u7279\u5f81\u5f15\u5bfc\u6ce8\u610f\u529b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AIGeeksGroup/PINE", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.29389", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u76f8\u673a\u5c04\u7ebf\u7f16\u7801\u5b9a\u4f4d\u4ee4\u724c\uff0cDINOv3\u4eb2\u548c\u5ea6\u5f15\u5bfc\u6ce8\u610f\u529b", "\u4ec5\u752813.9\u4e07\u5f20\u5408\u6210\u56fe\u8bad\u7ec3\u51e0\u4f55\uff0c\u70b9\u56fe\u8fbe\u6700\u5148\u8fdb\u6c34\u5e73", "\u4e09\u56fe\u8054\u5408\u9884\u6d4b\u6bd4MoGe-3\u52a0SAM\u5feb5.7\u500d"], "keywords": ["\u573a\u666f\u7406\u89e3", "\u6269\u6563\u6a21\u578b", "\u4e09\u7ef4\u91cd\u5efa", "\u5b9e\u4f8b\u5206\u5272"], "num_comments": 2, "on_hf": true, "organization": "The University of Melbourne", "pdf_url": "https://arxiv.org/pdf/2611.29389v1", "published_at": "2026-11-22", "score": 0.275, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29389.png", "title": "PINE: Point, Instance and Normal Estimation in One-Step Diffusion Model", "tldr": "\u4ee5\u5355\u6b65\u6269\u6563\u7edf\u4e00\u9884\u6d4b\u573a\u666f\u51e0\u4f55\u4e0e\u7269\u4f53\u5b9e\u4f8b\uff0c\u5728\u7cbe\u5ea6\u548c\u63a8\u7406\u901f\u5ea6\u4e0a\u517c\u83b7\u63d0\u5347\u3002", "upvotes": 6, "what_it_is": "PINE\u7528\u5355\u6b65\u6269\u6563Transformer\u4e00\u6b21\u524d\u5411\u9884\u6d4b\u70b9\u56fe\u3001\u8868\u9762\u6cd5\u7ebf\u548c\u5b9e\u4f8b\u56fe\u3002\u901a\u8fc7\u6d41\u63a9\u7801\u63a7\u5236\u4efb\u52a1\u4ea4\u4e92\uff0c\u5e76\u5f15\u5165\u76f8\u673a\u5c04\u7ebf\u7f16\u7801\u4e0e\u9884\u8bad\u7ec3\u7279\u5f81\u5f15\u5bfc\u6ce8\u610f\u529b\u3002", "why_notable": "\u5c06\u51e0\u4f55\u6062\u590d\u4e0e\u5b9e\u4f8b\u5206\u5272\u5408\u5e76\u5230\u5355\u6b21\u63a8\u7406\uff0c\u51cf\u5c11\u591a\u6a21\u578b\u6d41\u6c34\u7ebf\u5f00\u9500\uff1b\u5728\u8f83\u5c11\u8bad\u7ec3\u6570\u636e\u4e0b\u4ecd\u53d6\u5f97\u9886\u5148\u51e0\u4f55\u7cbe\u5ea6\u4e0e\u5927\u7269\u4f53\u5206\u5272\u8868\u73b0\u3002"}, {"abstract": "Physical counterfactual video editing turns a source video and a language-specified physical edit at a given execution frame into a counterfactual video that shows how the scene would evolve after the edit. Existing evaluations with counterfactual target videos mainly cover object removal or specific rigid-body motions, although real scenes also involve elastic deformation, fluid flow, and interactions among rigid bodies, elastic solids, and fluids. We introduce PhyCoVE, a benchmark of 533 cases on 110 source videos that covers rigid, elastic, and fluid dynamics in five interaction patterns, with edits that remove an object, change a physical quantity, or insert a new object. For the simulated cases, a language model proposes scene designs, coding agents build them with solvers suited to each material and physically based rendering and then simulate each edit from the source scene state, and humans check every stage. For the real cases, we record continuously from one camera position before and after each edit. We also propose counterfactual fidelity, a metric that applies across materials and their interactions and measures how much of the physical change from the source video to the target video a generated video reproduces. We evaluate seven open-source and commercial video editing models and find that counterfactual fidelity ranks them nearly as human preference does, but even the best model reproduces only about one seventh of the physical change. The models change how a scene looks but rarely how it evolves, whereas a physical edit requires understanding the dynamics that it changes. Physical counterfactual video editing thus remains far from solved, and PhyCoVE provides a foundation for developing and evaluating methods for it.", "arxiv_id": "2611.29184", "arxiv_url": "https://arxiv.org/abs/2611.29184", "authors": ["Conghan Yue", "Yuanjie Chen", "Yunyan Xiao", "Zeyu Peng", "Xingsong Ye", "Ya Gao", "Yanglin Huang", "WeiYao Zhang", "Yue Han", "Zhineng Chen", "Yu-Gang Jiang"], "brief": "\u6784\u5efa\u8986\u76d6\u521a\u4f53\u3001\u5f39\u6027\u4f53\u4e0e\u6d41\u4f53\u7684\u89c6\u9891\u7f16\u8f91\u57fa\u51c6\uff0c\u901a\u8fc7\u4eff\u771f\u4e0e\u5b9e\u62cd\u83b7\u53d6\u7269\u7406\u5e72\u9884\u540e\u7684\u76ee\u6807\u89c6\u9891\uff0c\u5e76\u63d0\u51fa\u53cd\u4e8b\u5b9e\u4fdd\u771f\u5ea6\uff0c\u8861\u91cf\u751f\u6210\u89c6\u9891\u590d\u73b0\u7269\u7406\u53d8\u5316\u7684\u7a0b\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Hammour-steak/PhyCoVE", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.29184", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["533\u4e2a\u6848\u4f8b\u3001110\u6bb5\u6e90\u89c6\u9891\uff0c\u8986\u76d65\u79cd\u4ea4\u4e92\u6a21\u5f0f", "\u652f\u6301\u79fb\u9664\u7269\u4f53\u3001\u4fee\u6539\u7269\u7406\u91cf\u3001\u63d2\u5165\u65b0\u7269\u4f53\u4e09\u7c7b\u7f16\u8f91", "\u8bc4\u6d4b7\u4e2a\u6a21\u578b\uff0c\u6700\u4f73\u4ec5\u590d\u73b0\u7ea6\u4e03\u5206\u4e4b\u4e00\u7684\u7269\u7406\u53d8\u5316"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u7269\u7406\u53cd\u4e8b\u5b9e", "\u52a8\u529b\u5b66", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2611.29184v1", "published_at": "2026-11-22", "score": 0.273, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29184.png", "title": "PhyCoVE: Benchmarking Physical Counterfactual Video Editing across Diverse Material Dynamics", "tldr": "\u8de8\u6750\u6599\u7269\u7406\u53cd\u4e8b\u5b9e\u89c6\u9891\u8bc4\u6d4b\u63ed\u793a\uff0c\u73b0\u6709\u6a21\u578b\u64c5\u6539\u5916\u89c2\u5374\u96be\u6539\u53d8\u52a8\u529b\u5b66\u6f14\u5316\u3002", "upvotes": 15, "what_it_is": "\u6784\u5efa\u8986\u76d6\u521a\u4f53\u3001\u5f39\u6027\u4f53\u4e0e\u6d41\u4f53\u7684\u89c6\u9891\u7f16\u8f91\u57fa\u51c6\uff0c\u901a\u8fc7\u4eff\u771f\u4e0e\u5b9e\u62cd\u83b7\u53d6\u7269\u7406\u5e72\u9884\u540e\u7684\u76ee\u6807\u89c6\u9891\uff0c\u5e76\u63d0\u51fa\u53cd\u4e8b\u5b9e\u4fdd\u771f\u5ea6\uff0c\u8861\u91cf\u751f\u6210\u89c6\u9891\u590d\u73b0\u7269\u7406\u53d8\u5316\u7684\u7a0b\u5ea6\u3002", "why_notable": "\u5c06\u89c6\u9891\u7f16\u8f91\u8bc4\u4ef7\u4ece\u5916\u89c2\u53d8\u5316\u63a8\u8fdb\u5230\u52a8\u529b\u5b66\u54cd\u5e94\uff1b\u53cd\u4e8b\u5b9e\u4fdd\u771f\u5ea6\u6392\u5e8f\u63a5\u8fd1\u4eba\u7c7b\u504f\u597d\uff0c\u4e3a\u68c0\u9a8c\u6a21\u578b\u7684\u7269\u7406\u7406\u89e3\u63d0\u4f9b\u66f4\u6709\u9488\u5bf9\u6027\u7684\u5c3a\u5ea6\u3002"}, {"abstract": "World action models (WAMs) couple generative video modeling with robotic action prediction but typically require large video and action transformers, limiting deployment efficiency. We present LoopedWAM, a compact WAM that recurrently applies a shared six-block core in each expert, executing 30 transformer layers while storing only 12 blocks per expert. To account for their asymmetric inference costs, the video and action experts can operate at different depths: visual features are computed once per query, whereas action computation repeats at every sampling step. We further propose elastic self-distillation, which trains a single elastic checkpoint, LoopedWAM-E, across action-depth and sampling-step budgets. With only 0.58B policy parameters and no robot pretraining, LoopedWAM achieves 96.1% success on LIBERO, 91.9% on RoboTwin 2.0, and 52.2% on RoboCasaGR1, while using $7.4\\times$ less peak GPU memory than Fast-WAM under matched inference measurements. On LIBERO, LoopedWAM-E achieves 96.0% success in 27.6 ms or 95.2% in 24.7 ms on an H100, providing multiple accuracy-latency operating points from a single checkpoint; with two sampling steps and four action loops, it stays within 0.5 points of LoopedWAM on all three benchmarks. Ablations demonstrate that weight-shared depth preserves competitive performance, while aggressive action-depth reduction requires explicit budget-aware training. On a real AgileX PiPER arm, LoopedWAM succeeds in 71.3% of 80 trials across four tasks.", "arxiv_id": "2611.25595", "arxiv_url": "https://arxiv.org/abs/2611.25595", "authors": ["Anh Dao", "Xinxin Liu", "Hang Yu", "Jeffrey A Chan Santiago", "Yuzhang Shang"], "brief": "\u63d0\u51fa\u7d27\u51d1\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\uff0c\u4ee5\u5171\u4eab\u516d\u5757\u6838\u5fc3\u5faa\u73af\u6267\u884c\u6df1\u5c42\u8ba1\u7b97\uff0c\u5e76\u8ba9\u89c6\u9891\u4e0e\u52a8\u4f5c\u4e13\u5bb6\u91c7\u7528\u4e0d\u540c\u6df1\u5ea6\u3002\u5f39\u6027\u81ea\u84b8\u998f\u4f7f\u5355\u4e00\u68c0\u67e5\u70b9\u9002\u914d\u52a8\u4f5c\u6df1\u5ea6\u4e0e\u91c7\u6837\u6b65\u6570\u9884\u7b97\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/anhdao69/LoopedWAM", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.25595", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u4e2a\u4e13\u5bb6\u4ec5\u5b5812\u5757\uff0c\u5faa\u73af\u6267\u884c30\u5c42Transformer", "0.58B\u7b56\u7565\u53c2\u6570\uff0cLIBERO\u6210\u529f\u738796.1%", "\u5f39\u6027\u68c0\u67e5\u70b9\u5728H100\u4e0a\u4ee524.7\u6beb\u79d2\u8fbe95.2%\u6210\u529f\u7387"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u4e16\u754c\u6a21\u578b", "\u6a21\u578b\u538b\u7f29", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Center for Research in Computer Vision, University of Central Florida", "pdf_url": "https://arxiv.org/pdf/2611.25595v3", "published_at": "2026-11-19", "score": 0.265, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25595.png", "title": "LoopedWAM: Looped World Action Models for Elastic Inference", "tldr": "\u901a\u8fc7\u5faa\u73af\u5171\u4eab\u6743\u91cd\u4e0e\u5f39\u6027\u81ea\u84b8\u998f\uff0c\u517c\u987e\u673a\u5668\u4eba\u52a8\u4f5c\u9884\u6d4b\u7cbe\u5ea6\u3001\u663e\u5b58\u4e0e\u63a8\u7406\u901f\u5ea6\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51fa\u7d27\u51d1\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\uff0c\u4ee5\u5171\u4eab\u516d\u5757\u6838\u5fc3\u5faa\u73af\u6267\u884c\u6df1\u5c42\u8ba1\u7b97\uff0c\u5e76\u8ba9\u89c6\u9891\u4e0e\u52a8\u4f5c\u4e13\u5bb6\u91c7\u7528\u4e0d\u540c\u6df1\u5ea6\u3002\u5f39\u6027\u81ea\u84b8\u998f\u4f7f\u5355\u4e00\u68c0\u67e5\u70b9\u9002\u914d\u52a8\u4f5c\u6df1\u5ea6\u4e0e\u91c7\u6837\u6b65\u6570\u9884\u7b97\u3002", "why_notable": "\u76f8\u8f83Fast-WAM\uff0c\u5cf0\u503c\u663e\u5b58\u964d\u4f4e7.4\u500d\uff1b\u540c\u4e00\u68c0\u67e5\u70b9\u63d0\u4f9b\u591a\u4e2a\u7cbe\u5ea6\u4e0e\u5ef6\u8fdf\u6863\u4f4d\uff0c\u4e3a\u8d44\u6e90\u53d7\u9650\u7684\u673a\u5668\u4eba\u90e8\u7f72\u63d0\u4f9b\u5b9e\u7528\u9014\u5f84\u3002"}, {"abstract": "We propose LoopDVR, a framework for converting pretrained Transformer-based dense visual recognition models into parameter-efficient looped networks. Rather than reducing the network width or depth directly, LoopDVR reuses Transformer blocks across layers in both the ViT backbone and Transformer decoder, reducing the number of parameters while retaining the original computational structure. However, naively sharing parameters can disrupt the distinct transformations learned at different depths. To address this challenge, we identify suitable sharing groups based on inter-layer representation dissimilarity and keep the final backbone block independent for multi-scale feature construction. We then initialize each shared backbone block with the pretrained weights of its group\u0027s terminal layer to better preserve the learned representations. An independent Loop Adapter at each layer further helps retain depth-specific transformations within shared blocks. Subsequently, we distill visual representations into the looped backbone and integrate it with a looped decoder for task-specific training. Experiments demonstrate that LoopDVR achieves the best accuracy--parameter trade-offs across dense recognition tasks. Compared with the reference models, it reduces parameters by approximately 28% while maintaining competitive accuracy. Notably, LoopDet-S achieves 50.9 box AP with only 7.0M parameters, highlighting its effectiveness in compact models.", "arxiv_id": "2611.32067", "arxiv_url": "https://arxiv.org/abs/2611.32067", "authors": ["Sirui Liang", "Xuanlong Yu", "Longfei Liu", "Xiaodong Cun", "Xi Shen"], "brief": "LoopDVR\u5c06\u9884\u8bad\u7ec3\u5bc6\u96c6\u89c6\u89c9\u8bc6\u522b\u6a21\u578b\u7684\u9aa8\u5e72\u548c\u89e3\u7801\u5668\u6539\u4e3a\u5faa\u73af\u5171\u4eab\u6a21\u5757\uff0c\u6309\u5c42\u95f4\u8868\u5f81\u5dee\u5f02\u5206\u7ec4\uff0c\u518d\u7ed3\u5408\u9010\u5c42\u9002\u914d\u5668\u4e0e\u8868\u5f81\u84b8\u998f\u4fdd\u7559\u6df1\u5ea6\u7279\u5f02\u53d8\u6362\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Intellindust-AI-Lab/LoopDVR", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.32067", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6309\u5c42\u95f4\u8868\u5f81\u5dee\u5f02\u5206\u7ec4\u5171\u4eab\uff0c\u9aa8\u5e72\u672b\u5757\u72ec\u7acb\u4fdd\u7559", "\u5171\u4eab\u9aa8\u5e72\u5757\u7528\u7ec4\u672b\u5c42\u6743\u91cd\u521d\u59cb\u5316\uff0c\u9010\u5c42\u914d\u7f6eLoop Adapter", "LoopDet-S\u4ec57.0M\u53c2\u6570\uff0c\u8fbe\u523050.9 box AP"], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u53c2\u6570\u5171\u4eab", "\u89c6\u89c9\u8bc6\u522b", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 2, "on_hf": true, "organization": "GVC Lab at Great Bay University", "pdf_url": "https://arxiv.org/pdf/2611.32067v1", "published_at": "2026-11-24", "score": 0.263, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32067.png", "title": "LoopDVR: Looped Transformer for Efficient Dense Visual Recognition", "tldr": "\u901a\u8fc7\u8de8\u5c42\u590d\u7528\u4e0e\u9010\u5c42\u9002\u914d\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u89c9\u6a21\u578b\u538b\u7f29\u7ea628%\u5e76\u4fdd\u6301\u7ade\u4e89\u6027\u7cbe\u5ea6\u3002", "upvotes": 9, "what_it_is": "LoopDVR\u5c06\u9884\u8bad\u7ec3\u5bc6\u96c6\u89c6\u89c9\u8bc6\u522b\u6a21\u578b\u7684\u9aa8\u5e72\u548c\u89e3\u7801\u5668\u6539\u4e3a\u5faa\u73af\u5171\u4eab\u6a21\u5757\uff0c\u6309\u5c42\u95f4\u8868\u5f81\u5dee\u5f02\u5206\u7ec4\uff0c\u518d\u7ed3\u5408\u9010\u5c42\u9002\u914d\u5668\u4e0e\u8868\u5f81\u84b8\u998f\u4fdd\u7559\u6df1\u5ea6\u7279\u5f02\u53d8\u6362\u3002", "why_notable": "\u5728\u4e0d\u76f4\u63a5\u7f29\u51cf\u7f51\u7edc\u5bbd\u5ea6\u6216\u6df1\u5ea6\u7684\u60c5\u51b5\u4e0b\u6539\u5584\u7cbe\u5ea6\u4e0e\u53c2\u6570\u91cf\u6743\u8861\uff0c\u4e3a\u5bc6\u96c6\u89c6\u89c9\u6a21\u578b\u538b\u7f29\u63d0\u4f9b\u8def\u5f84\uff0c\u4f46\u53c2\u6570\u51cf\u5c11\u4e0d\u7b49\u540c\u4e8e\u8ba1\u7b97\u91cf\u4e0b\u964d\u3002"}, {"abstract": "Looped transformers reuse one block of shared weights along the depth of the network. Recent looped diffusion transformers are trained from scratch, which repeats the full pretraining cost although strong pretrained non-looped diffusion transformers exist. We propose Distill to Loop (Dooop), which distills a pretrained non-looped diffusion transformer into a looped student whose blocks are initialized from the teacher\u0027s. We cast distillation as a fixed-point iteration toward the teacher, in which the output after every loop is trained toward the teacher, and each loop is one step of an ordinary differential equation in depth. As a result, one model runs any number of loops at test time without retraining, and the higher-order ODE solvers of diffusion model sampling can be applied along the depth dimension for better results. Meanwhile, because a looped model produces an output after every loop, we also construct loop guidance between the outputs of different loop counts, which improves the generated samples at little extra compute. On SD3-medium, a looped student with about 37% of the teacher\u0027s parameters matches the teacher on average over GenEval, ImageReward, PickScore and HPSv2.1 with two to four loops, and with two loops it uses about 58% of the teacher\u0027s compute. And on a four-step SD3-medium, loop guidance raises the average of the four metrics from 88.2 to 99.2.", "arxiv_id": "2611.31977", "arxiv_url": "https://arxiv.org/abs/2611.31977", "authors": ["Chenru Wang", "Shengwei An"], "brief": "Dooop\u7528\u6559\u5e08\u6743\u91cd\u521d\u59cb\u5316\u5faa\u73af\u5b66\u751f\uff0c\u5e76\u8ba9\u6bcf\u8f6e\u8f93\u51fa\u903c\u8fd1\u6559\u5e08\uff1b\u5c06\u5faa\u73af\u5efa\u6a21\u4e3a\u6df1\u5ea6\u65b9\u5411\u7684\u5e38\u5fae\u5206\u65b9\u7a0b\uff0c\u4f7f\u63a8\u7406\u65f6\u53ef\u81ea\u7531\u8c03\u6574\u5faa\u73af\u6b21\u6570\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/WinterCCC/Distill-to-Loop", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.31977", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u56fa\u5b9a\u70b9\u84b8\u998f\u9010\u8f6e\u5bf9\u9f50\u6559\u5e08\uff0c\u652f\u6301\u6df1\u5ea6\u65b9\u5411\u9ad8\u9636ODE\u6c42\u89e3\u3002", "SD3-medium\u5b66\u751f\u4ec5\u752837%\u53c2\u6570\uff0c2\u81f34\u8f6e\u5e73\u5747\u8868\u73b0\u5339\u654c\u6559\u5e08\u3002", "\u56db\u6b65\u6a21\u578b\u7528loop guidance\uff0c\u56db\u9879\u6307\u6807\u5747\u503c\u4ece88.2\u5347\u81f399.2\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u6743\u91cd\u5171\u4eab", "\u53ef\u8c03\u6df1\u5ea6"], "num_comments": 2, "on_hf": true, "organization": "Virginia Polytechnic Institute and State University", "pdf_url": "https://arxiv.org/pdf/2611.31977v1", "published_at": "2026-11-24", "score": 0.261, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31977.png", "title": "Distill to Loop: Turning Pretrained Diffusion Transformers into Looped Models with Adjustable Depth", "tldr": "\u5c06\u9884\u8bad\u7ec3\u6269\u6563\u6a21\u578b\u84b8\u998f\u4e3a\u5171\u4eab\u6743\u91cd\u5faa\u73af\u6a21\u578b\uff0c\u4ee5\u66f4\u5c11\u53c2\u6570\u5b9e\u73b0\u53ef\u8c03\u6df1\u5ea6\u4e0e\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 4, "what_it_is": "Dooop\u7528\u6559\u5e08\u6743\u91cd\u521d\u59cb\u5316\u5faa\u73af\u5b66\u751f\uff0c\u5e76\u8ba9\u6bcf\u8f6e\u8f93\u51fa\u903c\u8fd1\u6559\u5e08\uff1b\u5c06\u5faa\u73af\u5efa\u6a21\u4e3a\u6df1\u5ea6\u65b9\u5411\u7684\u5e38\u5fae\u5206\u65b9\u7a0b\uff0c\u4f7f\u63a8\u7406\u65f6\u53ef\u81ea\u7531\u8c03\u6574\u5faa\u73af\u6b21\u6570\u3002", "why_notable": "\u590d\u7528\u5df2\u6709\u6269\u6563\u6a21\u578b\uff0c\u907f\u514d\u5faa\u73af\u67b6\u6784\u4ece\u5934\u9884\u8bad\u7ec3\uff1b\u540c\u4e00\u6a21\u578b\u53ef\u8c03\u6574\u63a8\u7406\u6df1\u5ea6\uff0c\u4e14\u4e24\u8f6e\u4ec5\u7528\u6559\u5e08\u7ea658%\u7684\u8ba1\u7b97\u91cf\u3002"}, {"abstract": "Real-time interactive video generation allows users to change the prompt during generation to steer the evolving video. However, existing streaming models, which generate videos chunk by chunk, often keep following the previous prompt after a switch. We trace this failure to context inertia, where the previous chunk acts as a strong prior that suppresses the new prompt. Furthermore, we find that this inertia persists even when the cache retains only the previous chunk, yet discarding the context breaks visual continuity, which limits approaches that edit the cache. Rather than editing the cache, we propose Residual Guidance (RG), a simple, training-free method that counteracts context inertia with a correction measured outside the cache. Specifically, RG denoises the re-noised previous chunk once under the new prompt without the cache and adds the resulting residual to the early denoising steps of the next chunk, where its content is largely decided and the new prompt is most suppressed. Across settings ranging from a single switch to long multi-switch generation, RG substantially improves prompt switching capability on existing streaming models, including those with dedicated switching mechanisms, while largely retaining visual quality. As it requires no training or per-model tuning and adds only one forward pass per chunk, RG can be easily integrated into existing real-time video generation pipelines.", "arxiv_id": "2611.32820", "arxiv_url": "https://arxiv.org/abs/2611.32820", "authors": ["NaHyeon Park", "Kyeong-Hwan Moon", "Youjin Jeon", "Hyunjung Shim"], "brief": "\u63d0\u51fa\u6b8b\u5dee\u5f15\u5bfc\uff08RG\uff09\uff1a\u5728\u7f13\u5b58\u5916\uff0c\u7528\u65b0\u63d0\u793a\u5bf9\u91cd\u65b0\u52a0\u566a\u7684\u4e0a\u4e00\u7247\u6bb5\u53bb\u566a\u4e00\u6b21\uff0c\u518d\u5c06\u6240\u5f97\u6b8b\u5dee\u6ce8\u5165\u4e0b\u4e00\u7247\u6bb5\u7684\u65e9\u671f\u53bb\u566a\u6b65\u9aa4\uff0c\u7ea0\u6b63\u65e7\u5185\u5bb9\u5bf9\u65b0\u63d0\u793a\u7684\u538b\u5236\u3002", "categories": ["cs.MM", "cs.AI", "cs.CV"], "github_repo": "https://github.com/nahyeonkaty/residual-guidance", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.32820", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["RG\u4e0d\u4fee\u6539\u7f13\u5b58\uff0c\u4ee5\u7f13\u5b58\u5916\u6b8b\u5dee\u62b5\u6d88\u4e0a\u4e0b\u6587\u60ef\u6027", "\u65e0\u9700\u8bad\u7ec3\u6216\u9010\u6a21\u578b\u8c03\u53c2\uff0c\u6bcf\u7247\u6bb5\u4ec5\u589e\u52a0\u4e00\u6b21\u524d\u5411\u8ba1\u7b97", "\u5355\u6b21\u53ca\u957f\u5e8f\u5217\u591a\u6b21\u5207\u6362\u5747\u6539\u5584\uff0c\u57fa\u672c\u4fdd\u6301\u89c6\u89c9\u8d28\u91cf"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u5b9e\u65f6\u4ea4\u4e92", "\u6b8b\u5dee\u5f15\u5bfc", "\u53bb\u566a"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2611.32820v1", "published_at": "2026-11-24", "score": 0.26, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32820.png", "title": "Residual Guidance for Real-Time Interactive Video Generation", "tldr": "\u7528\u514d\u8bad\u7ec3\u6b8b\u5dee\u5f15\u5bfc\u7f13\u89e3\u4e0a\u4e0b\u6587\u60ef\u6027\uff0c\u8ba9\u6d41\u5f0f\u89c6\u9891\u53ca\u65f6\u54cd\u5e94\u63d0\u793a\u5207\u6362\u5e76\u4fdd\u6301\u8fde\u8d2f\u3002", "upvotes": 8, "what_it_is": "\u63d0\u51fa\u6b8b\u5dee\u5f15\u5bfc\uff08RG\uff09\uff1a\u5728\u7f13\u5b58\u5916\uff0c\u7528\u65b0\u63d0\u793a\u5bf9\u91cd\u65b0\u52a0\u566a\u7684\u4e0a\u4e00\u7247\u6bb5\u53bb\u566a\u4e00\u6b21\uff0c\u518d\u5c06\u6240\u5f97\u6b8b\u5dee\u6ce8\u5165\u4e0b\u4e00\u7247\u6bb5\u7684\u65e9\u671f\u53bb\u566a\u6b65\u9aa4\uff0c\u7ea0\u6b63\u65e7\u5185\u5bb9\u5bf9\u65b0\u63d0\u793a\u7684\u538b\u5236\u3002", "why_notable": "\u5c06\u63d0\u793a\u5207\u6362\u8fdf\u6ede\u5b9a\u4f4d\u4e3a\u4e0a\u4e0b\u6587\u60ef\u6027\uff0c\u5e76\u7ed9\u51fa\u4f4e\u6210\u672c\u4fee\u6b63\uff1b\u65e2\u6709\u4e13\u7528\u5207\u6362\u673a\u5236\u7684\u6a21\u578b\u4e5f\u80fd\u53d7\u76ca\uff0c\u4fbf\u4e8e\u63a5\u5165\u5b9e\u65f6\u751f\u6210\u7ba1\u7ebf\u3002"}, {"abstract": "3D perception is shifting from task-specific pipelines to geometric foundation models: monocular depth networks, feed-forward 3D/4D reconstruction models, and vision--language models that predict geometry. However, their progress cannot be measured reliably. Published numbers are not comparable, because every paper samples frames, sets resolutions, and selects test splits differently. They are not robust because the alignment required for every up-to-scale prediction can outweigh the gap between models: fitting depth in the wrong space nearly triples its error, and standard trajectory alignment understates the error of failing methods by up to $2.6\\times$. And they rarely cover long recordings, dynamic scenes, or aerial views. We present SpatialArena, an open arena that scores geometric models with the same metrics and rules, with robust and deterministic alignment. SpatialArena spans five tasks, from monocular depth to SLAM. It covers 23 public datasets with 418,929 images across indoor, outdoor, aerial, object-centric, and dynamic scenes, together with Spatial Arena, our own captures with accurate poses and depth. Evaluating 52 models, we find that single-image depth is close to saturation on public benchmarks but not on large, uncontrolled scenes, and that progress now comes from consistency across frames and views, where feed-forward 3D/4D models match or surpass monocular specialists and overtake video depth models. The benchmark, toolbox, and leaderboard will be publicly released.", "arxiv_id": "2611.32816", "arxiv_url": "https://arxiv.org/abs/2611.32816", "authors": ["Yu Chen", "Haosen Yang", "Su Ee Tan", "Zhensong Zhang", "Jifei Song", "Jiankang Deng"], "brief": "SpatialArena\u4e3a\u51e0\u4f55\u57fa\u7840\u6a21\u578b\u5efa\u7acb\u7edf\u4e00\u8bc4\u6d4b\u5e73\u53f0\uff0c\u4ee5\u4e00\u81f4\u6307\u6807\u3001\u89c4\u5219\u548c\u7a33\u5065\u786e\u5b9a\u6027\u5bf9\u9f50\u8986\u76d6\u4e94\u7c7b\u4efb\u52a1\uff0c\u5e76\u7eb3\u5165\u957f\u5e8f\u5217\u3001\u52a8\u6001\u53ca\u822a\u62cd\u573a\u666f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/mvp-ai-lab/SpatialArena", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.32816", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d65\u7c7b\u4efb\u52a1\u300123\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u4e0e418929\u5f20\u56fe\u50cf", "\u6807\u51c6\u8f68\u8ff9\u5bf9\u9f50\u53ef\u5c06\u5931\u8d25\u65b9\u6cd5\u7684\u8bef\u5dee\u4f4e\u4f30\u81f3\u591a2.6\u500d", "\u8bc4\u6d4b52\u4e2a\u6a21\u578b\uff0c\u524d\u99883D/4D\u6a21\u578b\u8d85\u8d8a\u89c6\u9891\u6df1\u5ea6\u6a21\u578b"], "keywords": ["\u4e09\u7ef4\u611f\u77e5", "\u51e0\u4f55\u57fa\u7840\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6", "\u6df1\u5ea6\u4f30\u8ba1"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.32816v1", "published_at": "2026-11-24", "score": 0.255, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32816.png", "title": "SpatialArena: Where Do Geometric Foundation Models Stand?", "tldr": "\u7edf\u4e00\u8bc4\u6d4b\u4e94\u5341\u4e8c\u4e2a\u51e0\u4f55\u6a21\u578b\uff0c\u63ed\u793a\u5bf9\u9f50\u504f\u5dee\u53ca\u8de8\u5e27\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u7684\u91cd\u8981\u6027\u3002", "upvotes": 2, "what_it_is": "SpatialArena\u4e3a\u51e0\u4f55\u57fa\u7840\u6a21\u578b\u5efa\u7acb\u7edf\u4e00\u8bc4\u6d4b\u5e73\u53f0\uff0c\u4ee5\u4e00\u81f4\u6307\u6807\u3001\u89c4\u5219\u548c\u7a33\u5065\u786e\u5b9a\u6027\u5bf9\u9f50\u8986\u76d6\u4e94\u7c7b\u4efb\u52a1\uff0c\u5e76\u7eb3\u5165\u957f\u5e8f\u5217\u3001\u52a8\u6001\u53ca\u822a\u62cd\u573a\u666f\u3002", "why_notable": "\u5b83\u5c06\u6a21\u578b\u80fd\u529b\u5dee\u5f02\u4e0e\u8bc4\u6d4b\u5bf9\u9f50\u504f\u5dee\u533a\u5206\u5f00\u6765\uff0c\u5e76\u6307\u51fa\u516c\u5f00\u6df1\u5ea6\u699c\u5355\u8d8b\u4e8e\u9971\u548c\u540e\uff0c\u8de8\u5e27\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u662f\u66f4\u5173\u952e\u7684\u8fdb\u6b65\u65b9\u5411\u3002"}, {"abstract": "Generating 3D indoor scenes requires a representation that captures object semantics, instance identity, height structure, and orientation while respecting room geometry. Methods that model scenes as sequences of object vectors learn spatial constraints implicitly, leaving collisions and boundary violations to losses or post-processing; semantic-map methods make occupancy explicit, but collapse instance and directional structure. We introduce RoomTokens, a sliced structured-token representation in which each token stores semantic class, instance-color identity, and facing field. This representation allows a scene to be generated as a discrete grid while preserving cues for instance grouping, orientation estimation, and 3D extent prediction. To learn the RoomToken distribution, we propose MDIRT (Masked Diffusion over RoomTokens), a masked discrete diffusion model that denoises semantic/instance-color/facing channels jointly with a shared cross-slice backbone. Architectural tokens are clamped as explicit floor- plan constraints, so the model samples furniture layouts that respect room geometry while retaining instance and object-attribute structure. Experiments on 3D-FRONT show that RoomTokens with MDIRT improve layout fidelity and physical consistency over sequence/vector- and map-based methods, suggesting structured spatial tokens as a practical choice for discrete 3D scene synthesis.", "arxiv_id": "2611.30219", "arxiv_url": "https://arxiv.org/abs/2611.30219", "authors": ["Xiaohao Sun", "Angel X. Chang"], "brief": "\u5c06\u5ba4\u5185\u573a\u666f\u7f16\u7801\u4e3a\u5206\u5c42\u79bb\u6563\u7f51\u683c\uff0c\u4ee4\u724c\u4fdd\u5b58\u8bed\u4e49\u3001\u5b9e\u4f8b\u8eab\u4efd\u548c\u671d\u5411\u3002MDIRT\u901a\u8fc7\u5171\u4eab\u8de8\u5c42\u9aa8\u5e72\u8054\u5408\u53bb\u566a\u5404\u901a\u9053\uff0c\u5e76\u56fa\u5b9a\u5efa\u7b51\u4ee4\u724c\u7ea6\u675f\u5bb6\u5177\u5e03\u5c40\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": "https://github.com/3dlg-hcvc/RoomToken", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.30219", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["RoomTokens\u4fdd\u7559\u8bed\u4e49\u3001\u5b9e\u4f8b\u989c\u8272\u8eab\u4efd\u4e0e\u671d\u5411\u573a", "MDIRT\u8054\u5408\u53bb\u566a\u4e09\u7c7b\u901a\u9053\uff0c\u56fa\u5b9a\u5efa\u7b51\u4ee4\u724c", "3D-FRONT\u5b9e\u9a8c\u663e\u793a\u5e03\u5c40\u4fdd\u771f\u5ea6\u4e0e\u7269\u7406\u4e00\u81f4\u6027\u63d0\u5347"], "keywords": ["\u4e09\u7ef4\u573a\u666f\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u7a7a\u95f4\u8868\u793a"], "num_comments": 2, "on_hf": true, "organization": "3D Language \u0026 Generation Research Group", "pdf_url": "https://arxiv.org/pdf/2611.30219v1", "published_at": "2026-11-23", "score": 0.253, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30219.png", "title": "RoomTokens: Masked Diffusion over Structured Tokens for Indoor Scene Synthesis", "tldr": "\u7528\u5206\u5c42\u7ed3\u6784\u5316\u4ee4\u724c\u4e0e\u63a9\u7801\u6269\u6563\u751f\u6210\u5ba4\u5185\u573a\u666f\uff0c\u517c\u987e\u7269\u4f53\u5c5e\u6027\u4e0e\u623f\u95f4\u7ea6\u675f\u3002", "upvotes": 11, "what_it_is": "\u5c06\u5ba4\u5185\u573a\u666f\u7f16\u7801\u4e3a\u5206\u5c42\u79bb\u6563\u7f51\u683c\uff0c\u4ee4\u724c\u4fdd\u5b58\u8bed\u4e49\u3001\u5b9e\u4f8b\u8eab\u4efd\u548c\u671d\u5411\u3002MDIRT\u901a\u8fc7\u5171\u4eab\u8de8\u5c42\u9aa8\u5e72\u8054\u5408\u53bb\u566a\u5404\u901a\u9053\uff0c\u5e76\u56fa\u5b9a\u5efa\u7b51\u4ee4\u724c\u7ea6\u675f\u5bb6\u5177\u5e03\u5c40\u3002", "why_notable": "\u5728\u663e\u5f0f\u8868\u8fbe\u7a7a\u95f4\u5360\u7528\u7684\u540c\u65f6\u4fdd\u7559\u5b9e\u4f8b\u4e0e\u65b9\u5411\u4fe1\u606f\uff0c\u5f25\u5408\u7269\u4f53\u5e8f\u5217\u548c\u8bed\u4e49\u5730\u56fe\u7684\u8868\u793a\u77ed\u677f\uff0c\u4e3a\u53d7\u623f\u95f4\u51e0\u4f55\u7ea6\u675f\u7684\u4e09\u7ef4\u751f\u6210\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Learned image captioning metrics are trained and tested on human judgments, so their reported correlation is a claim about generalization. We audit this claim for the three most recent collections of such judgments, Polaris, Nebula, and Spica, matching images at the pixel level. First, test samples reappear in training sets: the Spica training set contains about two-thirds of the Polaris test set, with identical human ratings. Second, controlled retraining shows that duplicates can inflate a metric: for Pearl, the gain is confined to the duplicated samples and grows with every epoch; for DENEB, it stays below one point. The gain depends on the learner and on how often a training set repeats a sample. Third, Kendall\u0027s $\u03c4$ over all samples is the sum of two terms, detecting captions with the lowest human score and ranking the others; the first supplies most of the reported correlation and is nearly saturated. The recent test sets cannot order Polos, DENEB and Pearl consistently, and a ridge regression on frozen features matches or exceeds all three. Fourth, we propose a protocol that ranks a learned metric only with a model trained without test samples, reports both terms, and compares metrics by paired tests. Under it, zero-shot vision--language judges rank first on the three recent test sets, and a fine-tuned judge ranks first on the three earlier benchmarks. The same analysis applies to any evaluator learned from human judgments; filter lists and code are released at https://github.com/morninghut/ic-dataset-audit .", "arxiv_id": "2611.30488", "arxiv_url": "https://arxiv.org/abs/2611.30488", "authors": ["Xiaochen Zhang", "Jin Li", "Chunlong Xia", "Longjiang Guo"], "brief": "\u7814\u7a76\u4ee5\u50cf\u7d20\u7ea7\u5339\u914d\u5ba1\u8ba1\u4e09\u4e2a\u56fe\u50cf\u63cf\u8ff0\u4eba\u8bc4\u57fa\u51c6\uff0c\u5e76\u901a\u8fc7\u53d7\u63a7\u91cd\u8bad\u7ec3\u68c0\u9a8c\u91cd\u590d\u6837\u672c\u5f71\u54cd\uff1b\u62c6\u89e3\u76f8\u5173\u6027\u6765\u6e90\uff0c\u63d0\u51fa\u6392\u9664\u6d4b\u8bd5\u6837\u672c\u3001\u5206\u9879\u62a5\u544a\u548c\u914d\u5bf9\u68c0\u9a8c\u7684\u8bc4\u4f30\u534f\u8bae\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/morninghut/ic-dataset-audit", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.30488", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Spica\u8bad\u7ec3\u96c6\u542b\u7ea6\u4e09\u5206\u4e4b\u4e8cPolaris\u6d4b\u8bd5\u96c6\uff0c\u8bc4\u5206\u76f8\u540c", "\u53d7\u63a7\u91cd\u8bad\u7ec3\u4e2dPearl\u589e\u76ca\u968f\u8f6e\u6b21\u589e\u957f\uff0cDENEB\u4f4e\u4e8e1\u70b9", "Kendall\u2019s \u03c4\u62c6\u89e3\u663e\u793a\uff0c\u8bc6\u522b\u6700\u4f4e\u4eba\u8bc4\u5206\u8d21\u732e\u591a\u6570\u76f8\u5173\u6027"], "keywords": ["\u56fe\u50cf\u63cf\u8ff0", "\u8bc4\u4f30\u6307\u6807", "\u6570\u636e\u6cc4\u6f0f", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30488v1", "published_at": "2026-11-23", "score": 0.251, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30488.png", "title": "Do learned image captioning metrics generalize? Auditing duplicated samples in human-judgment benchmarks", "tldr": "\u56fe\u50cf\u63cf\u8ff0\u8bc4\u6d4b\u5ba1\u8ba1\u63ed\u793a\u6837\u672c\u6cc4\u6f0f\u4e0e\u76f8\u5173\u6027\u504f\u5dee\uff0c\u53bb\u91cd\u8bc4\u4f30\u6539\u53d8\u6307\u6807\u6392\u540d\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u4ee5\u50cf\u7d20\u7ea7\u5339\u914d\u5ba1\u8ba1\u4e09\u4e2a\u56fe\u50cf\u63cf\u8ff0\u4eba\u8bc4\u57fa\u51c6\uff0c\u5e76\u901a\u8fc7\u53d7\u63a7\u91cd\u8bad\u7ec3\u68c0\u9a8c\u91cd\u590d\u6837\u672c\u5f71\u54cd\uff1b\u62c6\u89e3\u76f8\u5173\u6027\u6765\u6e90\uff0c\u63d0\u51fa\u6392\u9664\u6d4b\u8bd5\u6837\u672c\u3001\u5206\u9879\u62a5\u544a\u548c\u914d\u5bf9\u68c0\u9a8c\u7684\u8bc4\u4f30\u534f\u8bae\u3002", "why_notable": "\u8bf4\u660e\u9ad8\u76f8\u5173\u6027\u672a\u5fc5\u4ee3\u8868\u6392\u5e8f\u80fd\u529b\u6216\u771f\u5b9e\u6cdb\u5316\uff1b\u65b0\u534f\u8bae\u4e0b\u96f6\u6837\u672c\u89c6\u89c9\u8bed\u8a00\u8bc4\u5ba1\u5728\u4e09\u4e2a\u8fd1\u671f\u6d4b\u8bd5\u96c6\u9886\u5148\uff0c\u4e3a\u5b66\u4e60\u578b\u8bc4\u4f30\u5668\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u6bd4\u8f83\u65b9\u5f0f\u3002"}, {"abstract": "Autonomous specification engineering requires coding agents to translate functional requirements into executable tests and use the results to discover and validate defects. However, existing benchmarks evaluate coding agents on explicitly specified test generation tasks, commonly providing an issue description, a designated test entry point, or files to inspect, leaving the ability to determine what to test and where to investigate insufficiently evaluated. Relying on such clues bypasses the challenge of mapping requirements to implementations and proactively uncovering unknown defects. We propose SpecEngineeringBench, comprising 100 instances from 78 open-source Python repositories across 16 application categories, with multiple recorded defects in each instance. Two independent tasks evaluate complementary capabilities: generating test suites and discovering defects through execution analysis. The evaluation combines test validity, defect detection, and coverage with localization precision and recall. Across seven frontier coding agents, results reveal that test validity and coverage decouple from defect exposure: agents achieve a 91.47% Head Pass Rate and 80.48% Change-focused Coverage alongside a 26.36% Fail-to-Pass Rate, while localization recall drops from 78.11% at the file level to 51.29% at the function level. Autonomous test generation improves file, function, and hunk localization recall by 4.99, 2.77, and 2.69 percentage points over relying solely on existing repository test suites.", "arxiv_id": "2611.32973", "arxiv_url": "https://arxiv.org/abs/2611.32973", "authors": ["Xingjian Wang", "Shijian Wang", "Minghao Liu", "Ji Zou", "Zetao Yang", "Xinping Lei", "Yiming Liang", "Shen Yan", "Enduo Zhao", "Xiaoyang Shen", "Weihao Xuan", "Jiaheng Liu", "Ge Zhang"], "brief": "\u6784\u5efa\u9762\u5411\u81ea\u4e3b\u89c4\u683c\u5de5\u7a0b\u7684\u7f16\u7801\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u8981\u6c42\u4ece\u529f\u80fd\u9700\u6c42\u81ea\u884c\u786e\u5b9a\u6d4b\u8bd5\u5bf9\u8c61\u4e0e\u8c03\u67e5\u4f4d\u7f6e\u3002\u901a\u8fc7\u6d4b\u8bd5\u751f\u6210\u3001\u6267\u884c\u5206\u6790\u4e24\u9879\u72ec\u7acb\u4efb\u52a1\uff0c\u8bc4\u4f30\u7f3a\u9677\u53d1\u73b0\u548c\u5b9a\u4f4d\u80fd\u529b\u3002", "categories": ["cs.SE"], "github_repo": "https://github.com/TokenWave-AI/SpecEngineeringBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.32973", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["100\u4e2a\u5b9e\u4f8b\u6765\u81ea78\u4e2aPython\u4ed3\u5e93\uff0c\u8986\u76d616\u7c7b\u5e94\u7528", "\u4e03\u4e2a\u667a\u80fd\u4f53\uff1a\u6d4b\u8bd5\u901a\u8fc7\u738791.47%\uff0cFail-to-Pass\u738726.36%", "\u81ea\u4e3b\u751f\u6210\u6d4b\u8bd5\u4f7f\u6587\u4ef6\u7ea7\u5b9a\u4f4d\u53ec\u56de\u7387\u63d0\u53474.99\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u7f3a\u9677\u5b9a\u4f4d", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 4, "on_hf": true, "organization": "Tokenwave.AI", "pdf_url": "https://arxiv.org/pdf/2611.32973v1", "published_at": "2026-11-24", "score": 0.25, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32973.png", "title": "SpecEngineeringBench: Evaluating Coding Agents as Autonomous Specification Engineers", "tldr": "\u65b0\u57fa\u51c6\u68c0\u9a8c\u7f16\u7801\u667a\u80fd\u4f53\u81ea\u4e3b\u6d4b\u8bd5\u4e0e\u627e\u9519\u80fd\u529b\uff0c\u63ed\u793a\u9ad8\u8986\u76d6\u7387\u4e0d\u7b49\u4e8e\u6709\u6548\u53d1\u73b0\u7f3a\u9677\u3002", "upvotes": 11, "what_it_is": "\u6784\u5efa\u9762\u5411\u81ea\u4e3b\u89c4\u683c\u5de5\u7a0b\u7684\u7f16\u7801\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u8981\u6c42\u4ece\u529f\u80fd\u9700\u6c42\u81ea\u884c\u786e\u5b9a\u6d4b\u8bd5\u5bf9\u8c61\u4e0e\u8c03\u67e5\u4f4d\u7f6e\u3002\u901a\u8fc7\u6d4b\u8bd5\u751f\u6210\u3001\u6267\u884c\u5206\u6790\u4e24\u9879\u72ec\u7acb\u4efb\u52a1\uff0c\u8bc4\u4f30\u7f3a\u9677\u53d1\u73b0\u548c\u5b9a\u4f4d\u80fd\u529b\u3002", "why_notable": "\u6446\u8131\u6307\u5b9a\u5165\u53e3\u548c\u95ee\u9898\u63cf\u8ff0\u7b49\u7ebf\u7d22\uff0c\u66f4\u8d34\u8fd1\u4e3b\u52a8\u627e\u9519\u573a\u666f\uff1b\u7ed3\u679c\u63ed\u793a\u6d4b\u8bd5\u6709\u6548\u6027\u3001\u8986\u76d6\u7387\u4e0e\u7f3a\u9677\u66b4\u9732\u8131\u94a9\uff0c\u63a8\u52a8\u8bc4\u4f30\u5173\u6ce8\u771f\u5b9e\u627e\u9519\u80fd\u529b\u3002"}, {"abstract": "Representation alignment markedly accelerates diffusion training, but one-step generators raise a question that diffusion does not: \\emph{which training path should receive the loss?} A one-step generator sees two kinds of inputs. Corrupted real images come with their clean counterpart, which provides an instance-paired target. Samples generated from pure noise have no corresponding real image, yet this is where the final model operates. We study this question on Priming, which trains one-step generators from scratch by reconstructing corrupted images and then matching feature distributions with optimal transport. Aligning the generative path, the natural choice, collapses recall ($0.45\\!\\to\\!0.15$--$0.25$) in all 17 configurations we test, including five target constructions and loss weights down to $0.05$. Aligning the paired reconstruction path with a frozen DINOv2 encoder instead helps in every setting we test. A short analysis explains this asymmetry: when the target carries no instance information about the input, the optimal aligned feature is constant within each class, so the loss pulls samples toward class prototypes. A control confirms this: aligning the paired path to a random same-class image instead of the input\u0027s own image removes most of the gain. Inside the generator, paired-path alignment creates an interface block through which post-training routes noise, and the image semantics carried through it predict sample quality across 16 models. The resulting recipe, \\method, accelerates \\emph{both} training stages on ImageNet $256\\!\\times\\!256$: it matches the 160-epoch baseline with $2\\times$ fewer priming epochs, surpasses its final quality with $4\\times$ fewer post-training updates, and lowers FID to 1.30 (B) and 1.155 (L) at the standard budget. A joint single-stage variant trains native one-step generators and reaches FID 1.22 with 115M parameters.", "arxiv_id": "2611.29547", "arxiv_url": "https://arxiv.org/abs/2611.29547", "authors": ["Mingxiao Li", "Xuantuo Huang", "Encheng Su", "Aoran Wang", "Han Zhang", "Jinouwen Zhang", "Shixiang Tang"], "brief": "\u7814\u7a76\u5728Priming\u4e00\u6b65\u751f\u6210\u5668\u4e2d\u5e94\u5c06\u8868\u5f81\u5bf9\u9f50\u65bd\u52a0\u4e8e\u54ea\u6761\u8bad\u7ec3\u8def\u5f84\u3002\u6838\u5fc3\u505a\u6cd5\u662f\u7528\u51bb\u7ed3\u7684DINOv2\u5bf9\u9f50\u6210\u5bf9\u91cd\u5efa\u8def\u5f84\uff0c\u907f\u514d\u65e0\u5b9e\u4f8b\u5bf9\u5e94\u7684\u751f\u6210\u8def\u5f84\u635f\u5931\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Mingxiao-Li/RePrime", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.29547", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["17\u79cd\u914d\u7f6e\u4e2d\uff0c\u751f\u6210\u8def\u5f84\u5bf9\u9f50\u4f7f\u53ec\u56de\u7387\u75310.45\u964d\u81f30.15\u20140.25", "ImageNet 256\uff1a\u9884\u70ed\u8f6e\u6570\u51cf\u534a\uff0c\u540e\u8bad\u7ec3\u66f4\u65b0\u51cf\u81f3\u56db\u5206\u4e4b\u4e00", "\u6807\u51c6\u9884\u7b97\u4e0b\uff0cB/L\u6a21\u578bFID\u8fbe1.30/1.155"], "keywords": ["\u8868\u5f81\u5bf9\u9f50", "\u4e00\u6b65\u751f\u6210", "\u56fe\u50cf\u751f\u6210", "\u8bad\u7ec3\u6548\u7387"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29547v2", "published_at": "2026-11-22", "score": 0.249, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29547.png", "title": "Align the Pair, Not the Sample: Representation Alignment for Faster and Better One-Step Generators", "tldr": "\u5c06\u8868\u5f81\u5bf9\u9f50\u7528\u4e8e\u6210\u5bf9\u91cd\u5efa\u800c\u975e\u566a\u58f0\u751f\u6210\uff0c\u53ef\u52a0\u901f\u4e00\u6b65\u751f\u6210\u5668\u8bad\u7ec3\u5e76\u63d0\u5347\u8d28\u91cf\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u5728Priming\u4e00\u6b65\u751f\u6210\u5668\u4e2d\u5e94\u5c06\u8868\u5f81\u5bf9\u9f50\u65bd\u52a0\u4e8e\u54ea\u6761\u8bad\u7ec3\u8def\u5f84\u3002\u6838\u5fc3\u505a\u6cd5\u662f\u7528\u51bb\u7ed3\u7684DINOv2\u5bf9\u9f50\u6210\u5bf9\u91cd\u5efa\u8def\u5f84\uff0c\u907f\u514d\u65e0\u5b9e\u4f8b\u5bf9\u5e94\u7684\u751f\u6210\u8def\u5f84\u635f\u5931\u3002", "why_notable": "\u63ed\u793a\u65e0\u5b9e\u4f8b\u5bf9\u5e94\u7684\u5bf9\u9f50\u4f1a\u5c06\u6837\u672c\u62c9\u5411\u7c7b\u522b\u539f\u578b\uff0c\u8bf4\u660e\u5bf9\u9f50\u8def\u5f84\u6bd4\u76f4\u63a5\u589e\u52a0\u635f\u5931\u66f4\u5173\u952e\uff0c\u5e76\u7ed9\u51fa\u517c\u987e\u8bad\u7ec3\u6548\u7387\u4e0e\u751f\u6210\u8d28\u91cf\u7684\u65b9\u6848\u3002"}, {"abstract": "Robot leading requires executing a route while continuously adapting to a designated follower. Existing robot-leading systems often mediate follower understanding and physical route execution through explicit states, planners, or modular interfaces; directly learning this coupling through end-to-end trajectory prediction can instead entangle route execution with follower response. We introduce LeadVLA, a structured multimodal policy that preserves the route as an explicit Path reference while learning a Pace for route progress and a Residual for local follower- and scene-conditioned adaptation. To make this problem trainable and measurable, we develop LeadInfra, a configurable Unreal Engine-based closed-loop data-generation infrastructure from which we instantiate an approximately 4M-sample training corpus, and LeadBench, a standardized benchmark with 108 fully held-out closed-loop episodes. LeadVLA achieves the highest task success (39.6%) among evaluated robot policies on LeadBench while maintaining strong route fidelity and follower responsiveness, and transfers to unseen real-world environments without real-world policy fine-tuning. Project Page: https://louiszengCN.github.io/LeadVLA_PAGE/", "arxiv_id": "2611.30149", "arxiv_url": "https://arxiv.org/abs/2611.30149", "authors": ["Tianle Zeng", "Hanjing Ye", "Bingyi Xia", "Yuchen Zhou", "Zibo Zhang", "Yufei Huang", "Yonggen Ling", "Hong Zhang"], "brief": "LeadVLA\u662f\u4e00\u79cd\u9762\u5411\u673a\u5668\u4eba\u9886\u8def\u7684\u7ed3\u6784\u5316\u591a\u6a21\u6001\u7b56\u7565\uff0c\u4ee5\u663e\u5f0f\u8def\u5f84\u4e3a\u53c2\u7167\uff0c\u5b66\u4e60\u884c\u8fdb\u6b65\u901f\u548c\u5c40\u90e8\u6b8b\u5dee\u8c03\u6574\uff0c\u5e76\u901a\u8fc7\u95ed\u73af\u4eff\u771f\u6570\u636e\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30149", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["Path\u3001Pace\u3001Residual\u5206\u522b\u5efa\u6a21\u8def\u7ebf\u3001\u8fdb\u5ea6\u4e0e\u5c40\u90e8\u9002\u5e94", "LeadInfra\u751f\u6210\u7ea6400\u4e07\u6837\u672c\uff0cLeadBench\u542b108\u4e2a\u72ec\u7acb\u6d4b\u8bd5\u56de\u5408", "\u4efb\u52a1\u6210\u529f\u738739.6%\uff0c\u65e0\u9700\u771f\u5b9e\u7b56\u7565\u5fae\u8c03\u5373\u53ef\u8fc1\u79fb"], "keywords": ["\u673a\u5668\u4eba\u9886\u8def", "\u591a\u6a21\u6001\u7b56\u7565", "\u95ed\u73af\u4eff\u771f", "\u4eff\u771f\u5230\u73b0\u5b9e\u8fc1\u79fb"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30149v1", "published_at": "2026-11-23", "score": 0.249, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30149.png", "title": "LeadVLA: Learning Follower-Aware Route Execution for Robot Leading", "tldr": "\u5c06\u8def\u7ebf\u3001\u6b65\u901f\u4e0e\u5c40\u90e8\u8c03\u6574\u89e3\u8026\uff0c\u8ba9\u9886\u8def\u673a\u5668\u4eba\u517c\u987e\u8def\u5f84\u6267\u884c\u4e0e\u8ddf\u968f\u8005\u54cd\u5e94\u3002", "upvotes": 12, "what_it_is": "LeadVLA\u662f\u4e00\u79cd\u9762\u5411\u673a\u5668\u4eba\u9886\u8def\u7684\u7ed3\u6784\u5316\u591a\u6a21\u6001\u7b56\u7565\uff0c\u4ee5\u663e\u5f0f\u8def\u5f84\u4e3a\u53c2\u7167\uff0c\u5b66\u4e60\u884c\u8fdb\u6b65\u901f\u548c\u5c40\u90e8\u6b8b\u5dee\u8c03\u6574\uff0c\u5e76\u901a\u8fc7\u95ed\u73af\u4eff\u771f\u6570\u636e\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u3002", "why_notable": "\u5b83\u5c06\u8def\u7ebf\u7ea6\u675f\u4e0e\u8ddf\u968f\u8005\u9002\u5e94\u5206\u5f00\u5efa\u6a21\uff0c\u5728\u8bc4\u6d4b\u7b56\u7565\u4e2d\u53d6\u5f97\u6700\u9ad8\u6210\u529f\u7387\uff0c\u5e76\u5c55\u793a\u4e86\u5411\u672a\u89c1\u771f\u5b9e\u73af\u5883\u8fc1\u79fb\u7684\u80fd\u529b\u3002"}, {"abstract": "Modern large language models (LLMs) keep the feed-forward network (FFN) intermediate width identical across every layer, a convention inherited from the original Transformer. Yet mechanistic work suggests layers at different depths do qualitatively different work, raising a natural question: are their capacity demands also non-uniform, and if so, can a fixed parameter budget be allocated more wisely than uniformly? To probe this, we apply principal component analysis (PCA) to the input of each FFN down-projection and measure, for every layer, its intrinsic dimensionality as the smallest number of principal components needed to reconstruct the activation up to a fixed cosine similarity. Scanning 58 open-weight LLMs spanning 14 families and 70M to 72B parameters, we find a recurring middle-heavy profile in which middle layers carry higher intrinsic dimensionality than edge layers; the profile is robust to the calibration corpus, even across English and Chinese, and is largely preserved through post-training fine-tuning. As a direct test that this signal is structurally meaningful, we use it to guide width pruning in a knowledge-distilled student under a matched parameter budget: the PCA-guided allocation outperforms the uniform-width convention by +2.3 points on Qwen3-8B and +2.5 on Qwen2.5-3B, while lower-dispersion teachers show smaller gaps (+0.9 on Gemma-3-4B, +0.5 on LLaMA-3-8B), and a budget-matched inverted control does worst on all four teachers. Across these four teachers, the size of the gap tracks how unevenly the teacher\u0027s intrinsic dimensionality is distributed across layers (a single-number summary we call $\u03c3_{99}$), and the advantage persists through downstream supervised fine-tuning. Code is available at https://github.com/naver-ai/lidf.", "arxiv_id": "2611.32782", "arxiv_url": "https://arxiv.org/abs/2611.32782", "authors": ["Daehee Kim"], "brief": "\u7814\u7a76\u7528PCA\u5206\u6790\u5404\u5c42FFN\u4e0b\u6295\u5f71\u8f93\u5165\uff0c\u4ee5\u8fbe\u5230\u56fa\u5b9a\u4f59\u5f26\u76f8\u4f3c\u5ea6\u6240\u9700\u7684\
