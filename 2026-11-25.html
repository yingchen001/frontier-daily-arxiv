<script>
const PAPERS = [{"abstract": "Segmenting a 3D object into semantically meaningful parts requires joint reasoning about geometric structure and semantic context. Pretrained 3D experts provide spatially grounded region proposals, while 2D experts provide semantic cues for identifying object parts. The challenge is to integrate these complementary capabilities into a framework that can both produce meaningful part segmentations and progressively refine them. We present PartAgent, a training-free agentic framework for 3D part segmentation built upon two complementary modules: (i) Structural-Semantic Expert Integration combines regions predicted by the 3D expert with multiview semantic evidence from the 2D expert through image-to-surface correspondences, constructing compositional part partitions at multiple granularities. (ii) Observation-Driven Closed-Loop Partition Refinement observes the current partition and its supporting evidence to select targeted inspection, evidence repair, composition, or reselection actions. It verifies proposed changes and uses the updated state and action outcomes to guide subsequent decisions. On PartObjaverse-Tiny-WT, PartAgent achieves 68.41 mIoU, outperforming the strongest competing method by 8.53 points. Across 3DCoMPaT200, PartNeXt, PartNetE, and PartObjaverse-Tiny, PartAgent achieves the highest mIoU on each dataset, averaging 69.36 across the four datasets, 7.28 points above the highest mean among competing methods.", "arxiv_id": "2611.32554", "arxiv_url": "https://arxiv.org/abs/2611.32554", "authors": ["Yang Cao", "Zhe Zhu", "Yiheng Zhang", "Zhengqiang Zhang", "Haoyuan Li", "Le Wan", "Dan Xu"], "brief": "PartAgent\u662f\u514d\u8bad\u7ec3\u7684\u4e09\u7ef4\u90e8\u4ef6\u5206\u5272\u667a\u80fd\u4f53\uff0c\u4ee5\u56fe\u50cf\u5230\u8868\u9762\u7684\u5bf9\u5e94\u5173\u7cfb\u878d\u5408\u4e09\u7ef4\u533a\u57df\u4e0e\u591a\u89c6\u89d2\u8bed\u4e49\uff0c\u518d\u901a\u8fc7\u89c2\u5bdf\u3001\u884c\u52a8\u548c\u9a8c\u8bc1\u95ed\u73af\u7ec6\u531 e3a\u53ef\u9a8c\u8bc1\u7684\u8fed\u4ee3\u5206\u5272\u6d41\u7a0b\uff0c\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u5728\u4e94\u4e2a\u6570\u636e\u96c6\u9886\u5148\uff0c\u5c55\u793a\u667a\u80fd\u4f53\u5904\u7406\u4e09\u7ef4\u611f\u77e5\u4efb\u52a1\u7684\u4ef7\u503c\u3002"}, {"abstract": "Computer-use agents (CUAs) are rapidly improving, yet their evaluation remains largely static. Existing benchmarks provide a strong foundation, but fixed difficulty ceilings, limited feature coverage, and coarse aggregate scores progressively weaken their discriminative and diagnostic value. We introduce CUA-SEE, a closed-loop evaluation environment that co-evolves tasks and executable verifiers from rollout evidence. It disentangles three objectives: benchmark evolution expands evaluation scope through cohort-calibrated difficulty and coverage growth; diagnostic evolution increases resolution through agent-conditional capability-boundary probes; and verifier evolution improves precision by translating changing requirements into state-grounded checkpoints with adversarial validation. Across multiple agents, applications, and rounds, CUA-SEE generates challenging, measurable tasks while preserving process-level evidence. Our results position adaptive evaluation as a scalable counterpart to self-evolving agents, continuously tracking what agents can do, where their boundaries lie, and how reliably progress is measured.", "arxiv_id": "2611.30962", "arxiv_url": "https://arxiv.org/abs/2611.30962", "authors": ["Wenhao Wang", "Panrong Tong", "Quyu Kong", "Pengxiang Li", "Haowen Yang", "chenglin Cai", "Siheng Chen", "Yue Wang"], "brief": "CUA-SEE\u6784\u5efa\u95ed\u73af\u8bc4\u6d4b\u73af\u5883\uff0c\u4f9d\u636e\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u5171\u540c\u66f4\u65b0\u4efb\u52a1\u4e0e\u53ef\u6267\u884c\u9a8c\u8bc1\u5668\uff0c\u5e76\u5206\u522b\u4f18\u5316\u8bc4\u6d4b\u8986\u76d6\u3001\u80fd\u529b\u8fb9\u754c\u8bca\u65ad\u548c\u9a8c\u8bc1\u7cbe\u5ea6\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30962", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u6f14\u5316\uff1a\u6309\u667a\u80fd\u4f53\u7fa4\u4f53\u6821\u51c6\u96be\u5ea6\u5e76\u6269\u5c55\u8986\u76d6", "\u8bca\u65ad\u6f14\u5316\uff1a\u9488\u5bf9\u7279\u5b9a\u667a\u80fd\u4f53\u63a2\u6d4b\u80fd\u529b\u8fb9\u754c", "\u9a8c\u8bc1\u5668\u6f14\u5316\uff1a\u72b6\u6001\u68c0\u67e5\u70b9\u7ed3\u5408\u5bf9\u6297\u9a8c\u8bc1"], "keywords": ["\u7535\u8111\u64cd\u4f5c\u667a\u80fd\u4f53", "\u81ea\u9002\u5e94\u8bc4\u6d4b", "\u80fd\u529b\u8bca\u65ad", "\u53ef\u6267\u884c\u9a8c\u8bc1"], "num_comments": 2, "on_hf": true, "organization": "Tongyi-MAI", "pdf_url": "https://arxiv.org/pdf/2611.30962v1", "published_at": "2026-11-23", "score": 0.52, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (47\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30962.png", "title": "Self-Evolving Evaluation Environments for Computer-Use Agents", "tldr": "\u901a\u8fc7\u6267\u884c\u8bc1\u636e\u540c\u6b65\u6f14\u5316\u4efb\u52a1\u4e0e\u9a8c\u8bc1\u5668\uff0c\u8ba9\u7535\u8111\u64cd\u4f5c\u667a\u80fd\u4f53\u8bc4\u6d4b\u6301\u7eed\u8ffd\u8e2a\u80fd\u529b\u8fb9\u754c\u3002", "upvotes": 47, "what_it_is": "CUA-SEE\u6784\u5efa\u95ed\u73af\u8bc4\u6d4b\u73af\u5883\uff0c\u4f9d\u636e\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u5171\u540c\u66f4\u65b0\u4efb\u52a1\u4e0e\u53ef\u6267\u884c\u9a8c\u8bc1\u5668\uff0c\u5e76\u5206\u522b\u4f18\u5316\u8bc4\u6d4b\u8986\u76d6\u3001\u80fd\u529b\u8fb9\u754c\u8bca\u65ad\u548c\u9a8c\u8bc1\u7cbe\u5ea6\u3002", "why_notable": "\u5c06\u56fa\u5b9a\u9898\u5e93\u8f6c\u4e3a\u6301\u7eed\u9002\u914d\u80fd\u529b\u53d8\u5316\u7684\u8bc4\u6d4b\u673a\u5236\uff0c\u540c\u65f6\u4fdd\u7559\u8fc7\u7a0b\u8bc1\u636e\uff0c\u6709\u52a9\u4e8e\u533a\u5206\u771f\u5b9e\u8fdb\u6b65\u3001\u80fd\u529b\u77ed\u677f\u4e0e\u9a8c\u8bc1\u8bef\u5dee\u3002"}, {"abstract": "We present VenusOCR2.0, a compact 1B-parameter vision-language recognizer designed for both high-accuracy and high-throughput document parsing across text, tables, and formulas. To continuously improve recognition quality without self-training collapse, we build a bounded recursive self-improvement (RSI) data engine where the model acts strictly as a weakness probe, while external multi-expert medoid consensus, VLM visual verification, and factorized synthesis supply reliable supervision across pretraining, curated SFT, and RLVR. VenusOCR2.0 couples a dynamic-resolution SigLIP2 encoder and 2x2 spatial token merging with a Qwen3-0.6B decoder, adopting compact atomic OTSL tokens to shorten table sequences and reduce structural errors. To further eliminate the autoregressive decoding bottleneck, we introduce PTPv2, a lightweight ($\\sim$67M) decoupled parallel draft module that combines frozen multi-layer verifier conditioning, a standalone learned mask, and block-causal all-position next-token prediction. On OmniDocBenchv1.6, VenusOCR2.0 achieves an overall score of 96.45 and a state-of-the-art 98.57 formula CDM, substantially outperforming massive general-purpose VLMs such as Gemini-3-Pro (92.91) and Qwen3-VL-235B (89.78). Deployed in vLLM on a single H20 GPU, PTPv2 delivers a 2.96x single-request speedup and up to 2.36x higher batched throughput while guaranteeing lossless, token-for-token equivalence with standard autoregressive decoding.", "arxiv_id": "2611.32617", "arxiv_url": "https://arxiv.org/abs/2611.32617", "authors": ["Lei Li", "Zheng Wei", "Yi Yuan", "Qingbin Liu", "Jiang Bian", "Zang Li"], "brief": "\u8fd9\u662f\u9762\u5411\u6587\u672c\u3001\u8868\u683c\u548c\u516c\u5f0f\u7684\u7d27\u51d1\u89c6\u89c9\u8bed\u8a00\u8bc6\u522b\u5668\u3002\u901a\u8fc7\u5916\u90e8\u591a\u4e13\u5bb6\u76d1\u7763\u9a71\u52a8\u53d7\u7ea6\u675f\u9012\u5f52\u6539\u8fdb\uff0c\u7ed3\u5408\u52a8\u6001\u5206\u8fa8\u7387\u7f16\u7801\u4e0e\u5e76\u884c\u8349\u7a3f\u6a21\u5757\uff0c\u517c\u987e\u89e3\u6790\u7cbe\u5ea6\u548c\u541e\u5410\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/flow3rdown/VenusOCR", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.32617", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["RSI\u4ec5\u7528\u6a21\u578b\u63a2\u6d4b\u5f31\u70b9\uff0c\u7531\u5916\u90e8\u4e13\u5bb6\u5171\u8bc6\u63d0\u4f9b\u76d1\u7763", "SigLIP2\u914d\u54082\u00d72\u4ee4\u724c\u5408\u5e76\uff0cOTSL\u538b\u7f29\u8868\u683c\u5e8f\u5217", "\u7ea66700\u4e07\u53c2\u6570PTPv2\u4f7f\u5355\u8bf7\u6c42\u63d0\u901f2.96\u500d"], "keywords": ["\u6587\u6863\u89e3\u6790", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u63a8\u6d4b\u89e3\u7801", "\u6570\u636e\u5408\u6210"], "num_comments": 3, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2611.32617v1", "published_at": "2026-11-24", "score": 0.513, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32617.png", "title": "VenusOCR2.0: Towards Efficient and Effective Document Parsing", "tldr": "\u4ee5\u5341\u4ebf\u53c2\u6570\u5b9e\u73b0\u9ad8\u7cbe\u5ea6\u6587\u6863\u89e3\u6790\uff0c\u5e76\u7528\u65e0\u635f\u5e76\u884c\u8349\u7a3f\u89e3\u7801\u663e\u8457\u63d0\u901f\u3002", "upvotes": 9, "what_it_is": "\u8fd9\u662f\u9762\u5411\u6587\u672c\u3001\u8868\u683c\u548c\u516c\u5f0f\u7684\u7d27\u51d1\u89c6\u89c9\u8bed\u8a00\u8bc6\u522b\u5668\u3002\u901a\u8fc7\u5916\u90e8\u591a\u4e13\u5bb6\u76d1\u7763\u9a71\u52a8\u53d7\u7ea6\u675f\u9012\u5f52\u6539\u8fdb\uff0c\u7ed3\u5408\u52a8\u6001\u5206\u8fa8\u7387\u7f16\u7801\u4e0e\u5e76\u884c\u8349\u7a3f\u6a21\u5757\uff0c\u517c\u987e\u89e3\u6790\u7cbe\u5ea6\u548c\u541e\u5410\u3002", "why_notable": "\u5341\u4ebf\u53c2\u6570\u6a21\u578b\u5728OmniDocBench\u53d6\u5f9796.45\u5206\uff0c\u8d85\u8fc7\u6240\u5217\u8d85\u5927\u901a\u7528\u6a21\u578b\uff1b\u52a0\u901f\u4ecd\u4fdd\u6301\u9010\u4ee4\u724c\u4e00\u81f4\uff0c\u4e3a\u9ad8\u6548\u90e8\u7f72\u63d0\u4f9b\u4e86\u6709\u529b\u8bc1\u636e\u3002"}, {"abstract": "Forward diffusion reinforcement learning (RL)---enabling deterministic ODE sampling without trajectory backpropagation---has grown increasingly popular for efficiently aligning diffusion models. However, we reveal that existing methods essentially rely on signed reward-weighted regression (RWR), regressing the trainable policy velocity onto rollouts from a behavior distribution. Unbiased baseline subtraction implicitly assumes that the policy velocity equals the behavior marginal velocity---an idealized assumption violated under classifier-free guidance (CFG) rollouts, offline/off-policy updates, and imperfect online self-consistency. This behavior--policy mismatch breaks baseline invariance and injects baseline-induced gradient drift, destabilizing training. To resolve this issue, we propose Instantaneous Trajectory Distribution Matching (iTDM), taking the infinitesimal limit of Trajectory Distribution Matching toward a time-local reward-guided target via the posterior-score identity to yield a sample-level gradient anchored at the behavior velocity without learning an additional reward-tilted target score. Tracking this velocity with an online auxiliary denoiser guarantees exact baseline invariance at the auxiliary optimum, effectively suppressing baseline drift across both online and offline RL. Extensive experiments across compositional generation, text rendering, and preference alignment show that iTDM achieves state-of-the-art in-domain and out-of-domain performance across group-wise online/offline RL and pairwise offline RL. Notably, on the challenging GenEval2 benchmark, iTDM converges nearly 3\\times faster than competing methods while scaling smoothly to 0.87 without collapse. Furthermore, iTDM scales effectively to the 5.6B FLUX.3 model, achieving better performance across both in-domain and unseen metrics. Code is available at https://github.com/Luo-Yihong/iTDM", "arxiv_id": "2611.30986", "arxiv_url": "https://arxiv.org/abs/2611.30986", "authors": ["Yihong Luo"], "brief": "\u63d0\u51fa iTDM\uff0c\u5c06\u8f68\u8ff9\u5206\u5e03\u5339\u914d\u53d6\u65e0\u7a77\u5c0f\u6781\u9650\uff0c\u6784\u9020\u65f6\u95f4\u5c40\u90e8\u7684\u5956\u52b1\u5f15\u5bfc\u68af\u5ea6\uff1b\u7528\u5728\u7ebf\u8f85\u52a9\u53bb\u566a\u5668\u8ffd\u8e2a\u884c\u4e3a\u901f\u5ea6\uff0c\u4fee\u6b63\u884c\u4e3a\u4e0e\u7b56\u7565\u4e0d\u4e00\u81f4\u5bfc\u81f4\u7684\u8bad\u7ec3\u6f02\u79fb\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": "https://github.com/Luo-Yihong/iTDM", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.30986", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8f85\u52a9\u53bb\u566a\u5668\u8fbe\u5230\u6700\u4f18\u65f6\uff0ciTDM \u4fdd\u8bc1\u7cbe\u786e\u57fa\u7ebf\u4e0d\u53d8\u6027", "GenEval2 \u6536\u655b\u8fd1\u5feb3\u500d\uff0c\u5f97\u5206\u8fbe0.87\u4e14\u672a\u5d29\u6e83", "\u6269\u5c55\u81f35.6B FLUX.3\uff0c\u57df\u5185\u4e0e\u672a\u89c1\u6307\u6807\u5747\u63d0\u5347"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5206\u5e03\u5339\u914d", "\u504f\u597d\u5bf9\u9f50"], "num_comments": 2, "on_hf": true, "organization": "HKUST", "pdf_url": "https://arxiv.org/pdf/2611.30986v2", "published_at": "2026-11-23", "score": 0.5, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30986.png", "title": "Reinforcing Diffusion Models by Instantaneous Trajectory Distribution Matching", "tldr": "\u901a\u8fc7\u77ac\u65f6\u8f68\u8ff9\u5206\u5e03\u5339\u914d\u6291\u5236\u57fa\u7ebf\u68af\u5ea6\u6f02\u79fb\uff0c\u8ba9\u6269\u6563\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u66f4\u7a33\u66f4\u5feb\u3002", "upvotes": 14, "what_it_is": "\u63d0\u51fa iTDM\uff0c\u5c06\u8f68\u8ff9\u5206\u5e03\u5339\u914d\u53d6\u65e0\u7a77\u5c0f\u6781\u9650\uff0c\u6784\u9020\u65f6\u95f4\u5c40\u90e8\u7684\u5956\u52b1\u5f15\u5bfc\u68af\u5ea6\uff1b\u7528\u5728\u7ebf\u8f85\u52a9\u53bb\u566a\u5668\u8ffd\u8e2a\u884c\u4e3a\u901f\u5ea6\uff0c\u4fee\u6b63\u884c\u4e3a\u4e0e\u7b56\u7565\u4e0d\u4e00\u81f4\u5bfc\u81f4\u7684\u8bad\u7ec3\u6f02\u79fb\u3002", "why_notable": "\u6307\u51fa\u73b0\u6709\u65b9\u6cd5\u5728\u5f15\u5bfc\u91c7\u6837\u53ca\u79bb\u7b56\u7565\u66f4\u65b0\u4e2d\u7684\u9690\u542b\u5047\u8bbe\u5931\u6548\uff0c\u5e76\u7ed9\u51fa\u7edf\u4e00\u4fee\u6b63\uff0c\u4e3a\u5728\u7ebf\u548c\u79bb\u7ebf\u6269\u6563\u6a21\u578b\u5956\u52b1\u5bf9\u9f50\u63d0\u4f9b\u66f4\u7a33\u5b9a\u7684\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Games, especially modern AAA games, challenge language models to perceive complex scenes, control actions, and make decisions over long horizons. Existing game benchmarks primarily test language models as computer-use agents that query a language model throughout play, incurring repeated inference cost and, in real-time games, acting while the environment continues to evolve. We ask whether coding agents can learn from game interaction to develop standalone game-playing programs that run without language model inference. We thus introduce Coding4Games, a benchmark for evaluating whether coding agents can develop standalone programs that play modern games through visual observations and standard game inputs. Coding4Games has three defining features: 1) Diverse Modern Games, covering 15 games with diverse visual, strategic, and control demands; 2) Development-Test Separation, in which a coding agent uses a sandbox and the standard player interface to iteratively develop a program, after which the selected program is frozen and independently tested without language-model inference; and 3) Outcome and Process Evaluation, which measures not only game performance and reliability but also how agents use feedback, revise programs, and resolve problems during development. Across 15 games, the best program per game outscores the strongest GUI baseline on 13 and ties it on one. The human player outscores all agents on 10 games. We additionally examine the effects of development budgets. Coding4Games evaluates whether coding agents can turn their understanding of complex interactive environments into programs that work reliably on their own.", "arxiv_id": "2611.31974", "arxiv_url": "https://arxiv.org/abs/2611.31974", "authors": ["Shifang Zhao", "Haoyu Wang", "Yuyang Yin", "Dong Chen", "Xingyilang Yin", "Yunkang Tao", "Honghao Chen", "Guangzhi Wang", "Yiran Wang", "Junfu Pu", "Cheng Cheng", "Xiaodong Cun", "Ying Shan"], "brief": "\u63d0\u51fa\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\u7684\u6e38\u620f\u57fa\u51c6\uff1a\u667a\u80fd\u4f53\u5728\u6c99\u76d2\u4e2d\u901a\u8fc7\u753b\u9762\u4e0e\u6807\u51c6\u64cd\u4f5c\u63a5\u53e3\u8fed\u4ee3\u7f16\u7a0b\uff0c\u968f\u540e\u51bb\u7ed3\u7a0b\u5e8f\uff0c\u5728\u4e0d\u8c03\u7528\u8bed\u8a00\u6a21\u578b\u7684\u6761\u4ef6\u4e0b\u72ec\u7acb\u6d4b\u8bd5\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/GVCLab/Coding4Games", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2611.31974", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d615\u6b3e\u73b0\u4ee3\u6e38\u620f\uff0c\u6db5\u76d6\u4e0d\u540c\u89c6\u89c9\u3001\u7b56\u7565\u4e0e\u63a7\u5236\u9700\u6c42", "\u5f00\u53d1\u4e0e\u6d4b\u8bd5\u5206\u79bb\uff0c\u540c\u65f6\u8bc4\u4f30\u6210\u7ee9\u3001\u53ef\u9760\u6027\u53ca\u7a0b\u5e8f\u4fee\u8ba2\u8fc7\u7a0b", "\u9010\u6e38\u620f\u6700\u4f18\u7a0b\u5e8f\u572813\u6b3e\u80dc\u8fc7\u6700\u5f3aGUI\u57fa\u7ebf\uff0c1\u6b3e\u6301\u5e73"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u6e38\u620f\u667a\u80fd", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "ARC Lab, Tencent", "pdf_url": "https://arxiv.org/pdf/2611.31974v1", "published_at": "2026-11-24", "score": 0.494, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31974.png", "title": "Coding4Games: Can Modern Coding Agents Play Modern Video Games?", "tldr": "\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5f00\u53d1\u65e0\u9700\u6a21\u578b\u63a8\u7406\u7684\u72ec\u7acb\u6e38\u620f\u7a0b\u5e8f\uff0c\u5e76\u5728\u5341\u4e94\u6b3e\u6e38\u620f\u4e2d\u68c0\u9a8c\u8868\u73b0\u3002", "upvotes": 10, "what_it_is": "\u63d0\u51fa\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\u7684\u6e38\u620f\u57fa\u51c6\uff1a\u667a\u80fd\u4f53\u5728\u6c99\u76d2\u4e2d\u901a\u8fc7\u753b\u9762\u4e0e\u6807\u51c6\u64cd\u4f5c\u63a5\u53e3\u8fed\u4ee3\u7f16\u7a0b\uff0c\u968f\u540e\u51bb\u7ed3\u7a0b\u5e8f\uff0c\u5728\u4e0d\u8c03\u7528\u8bed\u8a00\u6a21\u578b\u7684\u6761\u4ef6\u4e0b\u72ec\u7acb\u6d4b\u8bd5\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u91cd\u70b9\u4ece\u5b9e\u65f6\u8c03\u7528\u6a21\u578b\u8f6c\u5411\u53ef\u72ec\u7acb\u8fd0\u884c\u7684\u7a0b\u5e8f\uff0c\u68c0\u9a8c\u667a\u80fd\u4f53\u80fd\u5426\u628a\u4ea4\u4e92\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u9760\u4ee3\u7801\uff1b\u4f46\u4eba\u7c7b\u4ecd\u572810\u6b3e\u6e38\u620f\u4e2d\u9886\u5148\u5168\u90e8\u667a\u80fd\u4f53\u3002"}, {"abstract": "In-context learning (ICL) lets agents acquire new rules from context and adapt to user-specific requirements at inference time. The same frontier agents now operate both computers and robots, yet their ICL remains insufficiently assessed: existing benchmarks are largely offline, rely on text or static images, and risk training-data contamination, while robot evaluations are limited to method-level ablations. We present ICLWorld, an online benchmark that evaluates the ICL of agents from digital to physical worlds, covering computer use and robot use, together with UIverse, a unified harness that turns every environment into a user interface. We build 30 environments, record 630 demonstration videos (10+ hours), and design 160 tasks with customized, often counter-intuitive rules that cannot be satisfied without learning from the context. Each task comes with three rule versions, given as text or video, and we test generalization at three levels, from replaying the demonstration to new instances and unseen environments. Across six frontier models, the strongest agents, Claude Opus 5.5 and GPT-6 Astra, succeed on 82% and 76% of computer-use runs but only 27% and 26% of robot-use runs, and a no-rule control reduces success to at most 8%. GPT-6 Astra succeeds under all three rule versions on only 38% of computer-use tasks, half its rate under a single rule, and answers 98% of robot rule questions correctly yet completes only 20% of these tasks. Frontier agents learn rules comparably well from video and from text and transfer them across environments, whereas weaker agents rely on text and lose most of their video-based success once the demonstrated situation is resampled. These findings reveal substantial gaps between the digital and the physical world and between identifying a rule and acting on it.", "arxiv_id": "2611.32649", "arxiv_url": "https://arxiv.org/abs/2611.32649", "authors": ["Qingle Liu", "Jieming Li", "Pei-lin Li", "Shenghan Zheng", "Ruize Yang", "Sunqi Fan", "Deyao Hong", "Huan-ang Gao", "Meng-Hao Guo", "Shuojin Yang"], "brief": "ICLWorld\u901a\u8fc7UIverse\u5c06\u7535\u8111\u4e0e\u673a\u5668\u4eba\u73af\u5883\u7edf\u4e00\u4e3a\u7528\u6237\u754c\u9762\uff0c\u4ee5\u6587\u672c\u6216\u89c6\u9891\u4f20\u6388\u5b9a\u5236\u89c4\u5219\u3002\u8bc4\u6d4b\u667a\u80fd\u4f53\u4ece\u793a\u8303\u590d\u73b0\u5230\u65b0\u5b9e\u4f8b\u3001\u672a\u89c1\u73af\u5883\u7684\u5728\u7ebf\u5b66\u4e60\u4e0e\u6267\u884c\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": "https://github.com/ICLWorld/ICLWorld", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.32649", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa30\u4e2a\u73af\u5883\u3001160\u9879\u4efb\u52a1\u53ca630\u6bb5\u793a\u8303\u89c6\u9891", "\u516d\u6b3e\u6a21\u578b\u53c2\u8bc4\uff0c\u6700\u9ad8\u7535\u8111\u6210\u529f\u738782%\u3001\u673a\u5668\u4eba27%", "GPT-6 Astra\u673a\u5668\u4eba\u89c4\u5219\u95ee\u7b54\u6b63\u786e\u738798%\uff0c\u6267\u884c\u4ec520%"], "keywords": ["\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u673a\u5668\u4eba", "\u8de8\u73af\u5883\u6cdb\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.32649v1", "published_at": "2026-11-24", "score": 0.456, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32649.png", "title": "ICLWorld: Benchmarking In-Context Learning of Agents from Digital to Physical Worlds", "tldr": "\u5728\u7ebf\u4ea4\u4e92\u8bc4\u6d4b\u63ed\u793a\u667a\u80fd\u4f53\u80fd\u7406\u89e3\u4e0a\u4e0b\u6587\u89c4\u5219\uff0c\u5374\u96be\u4ee5\u5728\u7269\u7406\u4efb\u52a1\u4e2d\u53ef\u9760\u6267\u884c\u3002", "upvotes": 18, "what_it_is": "ICLWorld\u901a\u8fc7UIverse\u5c06\u7535\u8111\u4e0e\u673a\u5668\u4eba\u73af\u5883\u7edf\u4e00\u4e3a\u7528\u6237\u754c\u9762\uff0c\u4ee5\u6587\u672c\u6216\u89c6\u9891\u4f20\u6388\u5b9a\u5236\u89c4\u5219\u3002\u8bc4\u6d4b\u667a\u80fd\u4f53\u4ece\u793a\u8303\u590d\u73b0\u5230\u65b0\u5b9e\u4f8b\u3001\u672a\u89c1\u73af\u5883\u7684\u5728\u7ebf\u5b66\u4e60\u4e0e\u6267\u884c\u80fd\u529b\u3002", "why_notable": "\u5c06\u4e0a\u4e0b\u6587\u5b66\u4e60\u8bc4\u6d4b\u4ece\u9759\u6001\u95ee\u7b54\u63a8\u8fdb\u5230\u5728\u7ebf\u884c\u52a8\uff0c\u63ed\u793a\u89c4\u5219\u7406\u89e3\u4e0e\u6267\u884c\u4e4b\u95f4\u7684\u843d\u5dee\uff0c\u4e3a\u8de8\u6570\u5b57\u4e0e\u7269\u7406\u73af\u5883\u7684\u667a\u80fd\u4f53\u63d0\u4f9b\u8bca\u65ad\u57fa\u51c6\u3002"}, {"abstract": "Our goal is to build language models that are steerable by design. Today\u0027s language models are pretrained with next-token prediction, which relegates alignment and control to the final 1% of training tokens or inference-time interventions. These models repurpose a single input channel for both instructions and data, leading to common failure modes where the model mistakenly treats data as instructions such as intentional jailbreaks and unintentional in-context alignment drift. To correct this, we propose a pretraining method and architecture that separates the two from the very start, producing Mancelle-3B. An encoder processes high-level semantic features of upcoming text with cross-attention that prevents the token stream from writing back into this control channel. During pretraining, the model learns to rely on these features to predict the next token, turning the channel into an effective handle for steering the model. Mancelle-3B steers more strongly than prompt- and activation-based methods on comparable open models while maintaining fluency, and it withstands adversarial black-box and soft-prompt counter-steering that defeats those baselines. We reproduce this against a more controlled baseline with Mancelle-400M. Our results show that robust control can be built into language models if we do so early and intentionally.", "arxiv_id": "2611.32199", "arxiv_url": "https://arxiv.org/abs/2611.32199", "authors": ["Henry Castillo", "Yanchen Liu", "Claudio Mayrink Verdun", "Dylan Hadfield-Menell"], "brief": "\u63d0\u51fa\u6761\u4ef6\u9884\u8bad\u7ec3\u67b6\u6784\uff0c\u7528\u7f16\u7801\u5668\u63d0\u53d6\u540e\u7eed\u6587\u672c\u7684\u9ad8\u5c42\u8bed\u4e49\u7279\u5f81\uff0c\u901a\u8fc7\u4ea4\u53c9\u6ce8\u610f\u529b\u5f15\u5bfc\u9884\u6d4b\uff1b\u6587\u672c\u6d41\u65e0\u6cd5\u56de\u5199\u63a7\u5236\u901a\u9053\uff0c\u4f7f\u6307\u4ee4\u4e0e\u6570\u636e\u4ece\u8bad\u7ec3\u8d77\u5c31\u5206\u79bb\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": bf9\u6297\u6d4b\u8bd5\u9a8c\u8bc1\u63a7\u5236\u7684\u7a33\u5065\u6027\u3002"}, {"abstract": "Fine-tuning an instruction-tuned language model on new facts often erodes its general abilities. We find that standard fine-tuning lowers instruction-following, reasoning and coding benchmarks by 35 points on average, and that these losses track a collapse in answer length: fine-tuned models at least halve their responses, and the further a response drifts from the initial model\u0027s length, the more often it fails. We propose InstructReplay: the initial model answers a set of general instructions once, and during fine-tuning the model is kept close to the initial model on these answers. Across three model families and two domains, InstructReplay reduces the average decline on five general benchmarks from 28.1 to 2.4 points and keeps answer length close to the initial model\u0027s, while learning the new facts as well as standard fine-tuning. It balances learning and retention better than seven adaptation methods in all six settings. Controlled comparisons attribute the gain to replaying the model\u0027s own answers to general instructions rather than to the form of the loss.", "arxiv_id": "2611.32918", "arxiv_url": "https://arxiv.org/abs/2611.32918", "authors": ["Xiaofeng Shi", "Qian Kou", "Hua Zhou"], "brief": "InstructReplay\u5148\u8ba9\u521d\u59cb\u6a21\u578b\u56de\u7b54\u4e00\u7ec4\u901a\u7528\u6307\u4ee4\uff0c\u518d\u5728\u4e8b\u5b9e\u5fae\u8c03\u65f6\u7ea6\u675f\u6a21\u578b\u4fdd\u6301\u8fd9\u4e9b\u56de\u7b54\uff0c\u517c\u987e\u65b0\u77e5\u8bc6\u5b66\u4e60\u4e0e\u539f\u6709\u884c\u4e3a\u4fdd\u7559\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/xiaofengShi/InstructReplay", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.32918", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8de83\u4e2a\u6a21\u578b\u5bb6\u65cf\u30012\u4e2a\u9886\u57df\uff0c\u5e73\u5747\u9000\u5316\u4ece28.1\u964d\u81f32.4\u5206", "\u516d\u79cd\u8bbe\u7f6e\u5747\u4f18\u4e8e7\u79cd\u9002\u914d\u65b9\u6cd5\uff0c\u65b0\u4e8b\u5b9e\u5b66\u4e60\u4e0d\u900a\u4e8e\u6807\u51c6\u5fae\u8c03", "\u53d7\u63a7\u5b9e\u9a8c\u8868\u660e\uff0c\u6536\u76ca\u6765\u81ea\u81ea\u8eab\u56de\u7b54\u91cd\u653e\uff0c\u800c\u975e\u635f\u5931\u5f62\u5f0f"], "keywords": ["\u4e8b\u5b9e\u5fae\u8c03", "\u707e\u96be\u6027\u9057\u5fd8", "\u6307\u4ee4\u9075\u5faa", "\u7ecf\u9a8c\u91cd\u653e"], "num_comments": 3, "on_hf": true, "organization": "Beijing Academy of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2611.32918v1", "published_at": "2026-11-24", "score": 0.445, "selected_reasons": ["\u77e5\u540d\u673a\u6784: BAAI", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32918.png", "title": "InstructReplay: Replaying Assistant Turns to Preserve General Behavior During Factual Fine-Tuning", "tldr": "\u91cd\u653e\u6a21\u578b\u81ea\u8eab\u7684\u6307\u4ee4\u56de\u7b54\uff0c\u5728\u5b66\u4e60\u65b0\u4e8b\u5b9e\u65f6\u663e\u8457\u51cf\u5c11\u901a\u7528\u80fd\u529b\u9000\u5316\u3002", "upvotes": 3, "what_it_is": "InstructReplay\u5148\u8ba9\u521d\u59cb\u6a21\u578b\u56de\u7b54\u4e00\u7ec4\u901a\u7528\u6307\u4ee4\uff0c\u518d\u5728\u4e8b\u5b9e\u5fae\u8c03\u65f6\u7ea6\u675f\u6a21\u578b\u4fdd\u6301\u8fd9\u4e9b\u56de\u7b54\uff0c\u517c\u987e\u65b0\u77e5\u8bc6\u5b66\u4e60\u4e0e\u539f\u6709\u884c\u4e3a\u4fdd\u7559\u3002", "why_notable": "\u5b83\u5c06\u901a\u7528\u80fd\u529b\u9000\u5316\u4e0e\u56de\u7b54\u957f\u5ea6\u6536\u7f29\u8054\u7cfb\u8d77\u6765\uff0c\u5e76\u7528\u7b80\u5355\u7684\u81ea\u8eab\u56de\u7b54\u91cd\u653e\u5927\u5e45\u7f13\u89e3\u9057\u5fd8\uff0c\u4e3a\u4e8b\u5b9e\u66f4\u65b0\u63d0\u4f9b\u5b9e\u7528\u65b9\u6848\u3002"}, {"abstract": "As medical AI is increasingly used for patient consultation and clinical decision support, identifying harmful, non-compliant, or ethically problematic responses is essential for responsible deployment. Assessing these risks requires checking clinical claims against relevant evidence, verifying calculations, and applying medical requirements under their intended conditions. We introduce LingSante MedGuard, a capability-enhanced guardrail that integrates supervision from a medical guardrail teacher model and six specialized medical capability experts into a unified model. The guardrail teacher supervises risk decisions and explanations across medical safety, compliance, and ethics, while the capability experts support medical rule understanding, numerical reasoning, multimodal hallucination detection, agentic safety verification, risk localization, and multimodal entity understanding. We consolidate these sources of supervision through offline supervised fine-tuning on teacher-generated demonstrations, followed by multi-teacher on-policy distillation using feedback on student-generated responses. We further introduce LingSante MedGuardBench, a benchmark comprising 11 risk-detection subsets spanning medical safety, compliance, and ethics. At 4B, 9B, and 27B scales, LingSante MedGuard achieves mean benchmark F1 scores of 82.3%, 82.4%, and 87.4%, respectively. The 4B model also achieves 73.9% mean accuracy across MedHallu and MedHALT-NOTA under retrieval-enabled evaluation. Additional evaluations of the verification components show improvements in evidence-supported consistency, source traceability, and rule-guided rationale quality across model scales. These results support the integration of specialized medical capabilities into a unified guardrail for medical risk assessment and evidence-based medical safety verification.", "arxiv_id": "2611.25509", "arxiv_url": "https://arxiv.org/abs/2611.25509", "authors": ["LingSante MedGuard Team"], "brief": "\u6784\u5efa\u7edf\u4e00\u533b\u7597\u62a4\u680f\uff0c\u7531\u62a4\u680f\u6559\u5e08\u548c\u516d\u7c7b\u80fd\u529b\u4e13\u5bb6\u5171\u540c\u76d1\u7763\u3002\u5148\u7528\u6559\u5e08\u793a\u8303\u8fdb\u884c\u79bb\u7ebf\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u5bf9\u5b66\u751f\u751f\u6210\u7684\u56de\u7b54\u5b9e\u65bd\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u3002", "categories": ["cs.CR"], "github_repo": "https://github.com/inclusionAI/LingSante-MedGuard", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.25509", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u516d\u7c7b\u4e13\u5bb6\u8986\u76d6\u89c4\u5219\u7406\u89e3\u3001\u8ba1\u7b97\u53ca\u591a\u6a21\u6001\u6838\u9a8c\u7b49\u80fd\u529b", "MedGuardBench\u5305\u542b11\u4e2a\u98ce\u9669\u68c0\u6d4b\u5b50\u96c6", "4B\u30019B\u300127B\u6a21\u578b\u5e73\u5747F1\u4e3a82.3%\u300182.4%\u300187.4%"], "keywords": ["\u533b\u7597\u4eba\u5de5\u667a\u80fd", "\u5b89\u5168\u62a4\u680f", "\u77e5\u8bc6\u84b8\u998f", "\u98ce\u9669\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "inclusionAI", "pdf_url": "https://arxiv.org/pdf/2611.25509v3", "published_at": "2026-11-19", "score": 0.444, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25509.png", "title": "LingSante MedGuard Technical Report", "tldr": "\u5c06\u516d\u7c7b\u533b\u5b66\u4e13\u5bb6\u80fd\u529b\u878d\u5165\u7edf\u4e00\u62a4\u680f\uff0c\u63d0\u5347\u533b\u7597\u98ce\u9669\u8bc6\u522b\u4e0e\u5faa\u8bc1\u5b89\u5168\u6838\u9a8c\u3002", "upvotes": 30, "what_it_is": "\u6784\u5efa\u7edf\u4e00\u533b\u7597\u62a4\u680f\uff0c\u7531\u62a4\u680f\u6559\u5e08\u548c\u516d\u7c7b\u80fd\u529b\u4e13\u5bb6\u5171\u540c\u76d1\u7763\u3002\u5148\u7528\u6559\u5e08\u793a\u8303\u8fdb\u884c\u79bb\u7ebf\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u5bf9\u5b66\u751f\u751f\u6210\u7684\u56de\u7b54\u5b9e\u65bd\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u3002", "why_notable": "\u628a\u533b\u5b66\u80fd\u529b\u6838\u9a8c\u4e0e\u5b89\u5168\u5224\u65ad\u7ed3\u5408\uff0c\u800c\u975e\u4ec5\u505a\u98ce\u9669\u5206\u7c7b\uff1b\u5c0f\u81f34B\u7684\u6a21\u578b\u4e5f\u53d6\u5f97\u8f83\u9ad8\u68c0\u6d4b\u5206\u6570\uff0c\u4e3a\u8f7b\u91cf\u533b\u7597\u62a4\u680f\u90e8\u7f72\u63d0\u4f9b\u53c2\u8003\u3002"}, {"abstract": "Can a simple mirror expose the limitations of today\u0027s robotic manipulation policies? Inspired by the mirror self-recognition test in animal cognition, we investigate whether robot policies can reliably manipulate physical objects in scenes containing their reflections. We introduce RoboDojo-Mirror, a benchmark built on RoboDojo that preserves task objectives, success criteria, and policy checkpoints while comparing a mirror-free baseline with single-mirror, dual-mirror, and mirrored-tabletop conditions. Across five policies spanning Vision-Language-Action models, World Action Models, and agentic policies, every mirror condition reduces aggregate success rates: averaged over the three conditions, the drop ranges from 10.8 to 56.7 percentage points across policies, and it reaches 62.5 points on the mirrored tabletop. Because a mirror is also a physical obstacle, we compare it against geometrically matched non-reflective panels; 50--88\\% of mirror-specific failures occur without recorded robot--panel contact, so direct collisions alone do not explain the degradation. Trajectory and contact analyses instead reveal recurring behaviors consistent with phantom targeting of reflected objects and spatial mislocalization of real ones. Targeted diagnostics further characterize grasping near reflections, policy-dependent pushing progress, and physical-target interaction under main-camera occlusion. Real-robot experiments with $\u03c0_{0.5}$ and FastWAM also show lower overall success rates under the upright-mirror and mirrored-tabletop conditions. These findings reveal a shared vulnerability to reflective environments across diverse robot policies and motivate reflection-aware evaluation of embodied intelligence. Code is available at https://github.com/iPPLab/robodojo-mirror.", "arxiv_id": "2611.33010", "arxiv_url": "https://arxiv.org/abs/2611.33010", "authors": ["Xuanchen Liu", "Hejun Zhang", "Boxuan Dong", "Ying Wu", "Heshuai Li", "Wen Gao", "Yonghong Tian", "Weihao Yu"], "brief": "\u63d0\u51faRoboDojo-Mirror\u57fa\u51c6\uff0c\u56fa\u5b9a\u4efb\u52a1\u76ee\u6807\u3001\u6210\u529f\u6807\u51c6\u4e0e\u7b56\u7565\u6743\u91cd\uff0c\u5bf9\u6bd4\u65e0\u955c\u53ca\u4e09\u79cd\u955c\u9762\u573a\u666f\uff0c\u5e76\u7528\u975e\u53cd\u5c04\u9762\u677f\u533a\u5206\u53cd\u5c04\u5e72\u6270\u4e0e\u969c\u788d\u7269\u5f71\u54cd\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": "https://github.com/iPPLab/robodojo-mirror", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.33010", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4e94\u79cd\u7b56\u7565\u5728\u4e09\u7c7b\u955c\u9762\u6761\u4ef6\u4e0b\u5e73\u5747\u4e0b\u964d10.8\u201456.7\u4e2a\u767e\u5206\u70b9", "50%\u201488%\u7684\u955c\u9762\u7279\u6709\u5931\u8d25\u672a\u8bb0\u5f55\u673a\u5668\u4eba\u4e0e\u9762\u677f\u63a5\u89e6", "\u03c0\u2080.\u2085\u4e0eFastWAM\u771f\u673a\u5b9e\u9a8c\u4e5f\u51fa\u73b0\u6210\u529f\u7387\u4e0b\u964d"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u955c\u9762\u53cd\u5c04", "\u9c81\u68d2\u6027\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "intelligence++", "pdf_url": "https://arxiv.org/pdf/2611.33010v1", "published_at": "2026-11-24", "score": 0.438, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33010.png", "title": "Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies", "tldr": "\u955c\u9762\u53cd\u5c04\u663e\u8457\u964d\u4f4e\u591a\u7c7b\u673a\u5668\u4eba\u7b56\u7565\u7684\u64cd\u4f5c\u6210\u529f\u7387\uff0c\u66b4\u9732\u865a\u5b9e\u76ee\u6807\u8fa8\u8bc6\u7f3a\u9677\u3002", "upvotes": 27, "what_it_is": "\u63d0\u51faRoboDojo-Mirror\u57fa\u51c6\uff0c\u56fa\u5b9a\u4efb\u52a1\u76ee\u6807\u3001\u6210\u529f\u6807\u51c6\u4e0e\u7b56\u7565\u6743\u91cd\uff0c\u5bf9\u6bd4\u65e0\u955c\u53ca\u4e09\u79cd\u955c\u9762\u573a\u666f\uff0c\u5e76\u7528\u975e\u53cd\u5c04\u9762\u677f\u533a\u5206\u53cd\u5c04\u5e72\u6270\u4e0e\u969c\u788d\u7269\u5f71\u54cd\u3002", "why_notable": "\u901a\u8fc7\u53d7\u63a7\u5bf9\u7167\u63ed\u793a\u591a\u7c7b\u673a\u5668\u4eba\u7b56\u7565\u5bf9\u53cd\u5c04\u73af\u5883\u7684\u5171\u540c\u8106\u5f31\u6027\uff0c\u8bf4\u660e\u8bc4\u6d4b\u9700\u68c0\u9a8c\u865a\u5b9e\u76ee\u6807\u8fa8\u8bc6\uff0c\u800c\u4e0d\u53ea\u5173\u6ce8\u78b0\u649e\u3002"}, {"abstract": "Multi-reference image generation requires a model to preserve the appearance of selected subjects while arranging them according to an instruction. Despite recent progress in reference-based generation and compositional control, reliably organizing selected subjects into the intended scene remains challenging. Although existing methods provide various forms of compositional guidance, the planned relationships are not always explicitly instantiated for inspection and refinement before image synthesis. To address this limitation, we introduce MAGPIE, which represents the intended composition as a simplified 3D scene defined by an executable Blender program. A coding agent links each scene instance to its reference, checks the geometry and rendered view against the instruction, and revises the program to correct discrepancies. The final proxy rendering serves as a visual plan for the image generator. Using MAGPIE-Instruct-3K, we train the generator to follow this plan while drawing each subject\u0027s appearance from its reference. MAGPIE improves both Qwen and FLUX on DreamOmni2 and SconeEval. With FLUX, it improves overall success on DreamOmni2 by 28.21 percentage points over the original backbone and achieves the highest overall score among the models evaluated on SconeEval.", "arxiv_id": "2611.32462", "arxiv_url": "https://arxiv.org/abs/2611.32462", "authors": ["Yifan Dai", "Daili Hua", "Bohan Zeng", "Yuran Wang", "Jialing Liu", "Bozhou Li", "Chengzhuo Tong", "Yang Shi", "Kai Zeng", "Liu Yang", "Xinyu Liu", "Shujie Li", "Yiyan Ji", "Bingyin Mei", "Yushuo Guan", "Yuanxing Zhang", "Fangcheng Fu", "Wentao Zhang"], "brief": "MAGPIE\u5c06\u76ee\u6807\u6784\u56fe\u8f6c\u4e3a\u53ef\u6267\u884c\u7684Blender\u7b80\u5316\u4e09\u7ef4\u573a\u666f\uff0c\u7531\u7f16\u7801\u667a\u80fd\u4f53\u5173\u8054\u53c2\u8003\u3001\u68c0\u67e5\u5e76\u4fee\u6b63\u5e03\u5c40\uff0c\u518d\u7528\u4ee3\u7406\u6e32\u67d3\u6307\u5bfc\u751f\u6210\u5668\u4fdd\u7559\u4e3b\u4f53\u5916\u89c2\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.32462", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7f16\u7801\u667a\u80fd\u4f53\u68c0\u67e5\u51e0\u4f55\u4e0e\u6e32\u67d3\u89c6\u56fe\u5e76\u4fee\u8ba2Blender\u7a0b\u5e8f", "\u4f7f\u7528MAGPIE-Instruct-3K\u8bad\u7ec3\u751f\u6210\u5668\u9075\u5faa\u89c6\u89c9\u8ba1\u5212", "FLUX\u5728DreamOmni2\u6574\u4f53\u6210\u529f\u7387\u63d0\u534728.21\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u591a\u53c2\u8003\u56fe\u50cf\u751f\u6210", "\u4e09\u7ef4\u573a\u666f\u89c4\u5212", "\u7f16\u7801\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "KlingAI Research", "pdf_url": "https://arxiv.org/pdf/2611.32462v1", "published_at": "2026-11-24", "score": 0.426, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32462.png", "title": "MAGPIE: Agentic Multi-Reference Image Generation via Executable Scene Construction", "tldr": "\u901a\u8fc7\u53ef\u6267\u884c\u4e09\u7ef4\u573a\u666f\u89c4\u5212\u4e0e\u667a\u80fd\u4f53\u7ea0\u9519\uff0c\u63d0\u5347\u591a\u53c2\u8003\u56fe\u50cf\u751f\u6210\u7684\u5e03\u5c40\u51c6\u786e\u6027", "upvotes": 13, "what_it_is": "MAGPIE\u5c06\u76ee\u6807\u6784\u56fe\u8f6c\u4e3a\u53ef\u6267\u884c\u7684Blender\u7b80\u5316\u4e09\u7ef4\u573a\u666f\uff0c\u7531\u7f16\u7801\u667a\u80fd\u4f53\u5173\u8054\u53c2\u8003\u3001\u68c0\u67e5\u5e76\u4fee\u6b63\u5e03\u5c40\uff0c\u518d\u7528\u4ee3\u7406\u6e32\u67d3\u6307\u5bfc\u751f\u6210\u5668\u4fdd\u7559\u4e3b\u4f53\u5916\u89c2\u3002", "why_notable": "\u5c06\u6784\u56fe\u610f\u56fe\u53d8\u4e3a\u751f\u6210\u524d\u53ef\u68c0\u67e5\u3001\u53ef\u4fee\u6b63\u7684\u663e\u5f0f\u573a\u666f\uff1b\u540c\u65f6\u6539\u5584Qwen\u4e0eFLUX\uff0c\u5e76\u5728SconeEval\u83b7\u53c2\u8bc4\u6a21\u578b\u6700\u9ad8\u6574\u4f53\u5206\u3002"}, {"abstract": "Recent advances in video generation have made automated advertising production increasingly feasible. However, an effective advertisement must faithfully represent the product and communicate its selling points through compelling visual storytelling, which requires more than visual synthesis: it calls for deeper product understanding and strategic decisions about how to present product value. Crucially, product research and creative design are closely intertwined, as the information gathered about a product determines which features can be faithfully demonstrated and how they should be presented. In this paper, we introduce AdProducer, the first end-to-end agentic framework for advertising video creation, transforming concise creative briefs into finished advertisements. Our multimodal agent autonomously researches products through web and image search and translates its findings into selling-point-driven storyboards that guide a frozen video generator. To achieve this, we develop a dedicated data construction pipeline that yields two training datasets, AdProducer-SFT and AdProducer-RL, and train the agent through supervised fine-tuning followed by reinforcement learning with joint optimization of storyboard- and video-level rewards. We further introduce AdCreation-Bench, comprising 305 advertising briefs across eight domains, with two complementary metrics: PG-Score for product correctness and creative execution, and Ad-Score for overall advertising effectiveness assessed by an independent judge. Experiments demonstrate that AdProducer improves the PG-Score of MiniMax H3 from 17.3 to 51.3 and generalizes to Veo 3.1 without additional training, improving its score from 28.0 to 35.9, with consistent gains in Ad-Score, VideoScore2, and human evaluations. Code, models, and data are released.", "arxiv_id": "2611.31466", "arxiv_url": "https://arxiv.org/abs/2611.31466", "authors": ["Kunyang Li", "Chaoyang Wang", "Mubarak Shah", "Yuzhang Shang"], "brief": "AdProducer\u5c06\u7b80\u77ed\u521b\u610f\u9700\u6c42\u8f6c\u5316\u4e3a\u6210\u7247\uff1a\u591a\u6a21\u6001\u667a\u80fd\u4f53\u901a\u8fc7\u7f51\u9875\u4e0e\u56fe\u50cf\u641c\u7d22\u7814\u7a76\u4ea7\u54c1\uff0c\u518d\u751f\u6210\u5356\u70b9\u9a71\u52a8\u7684\u5206\u955c\uff0c\u6307\u5bfc\u51bb\u7ed3\u7684\u89c6\u9891\u751f\u6210\u5668\u5236\u4f5c\u5e7f\u544a\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/lky-ang/AdProducer", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.31466", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5148\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u7528\u5206\u955c\u7ea7\u4e0e\u89c6\u9891\u7ea7\u8054\u5408\u5956\u52b1\u5f3a\u5316\u5b66\u4e60", "AdCreation-Bench\u542b8\u4e2a\u9886\u57df\u3001305\u6761\u5e7f\u544a\u9700\u6c42", "MiniMax H3\u7684PG-Score\u4ece17.3\u5347\u81f351.3"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5e7f\u544a\u521b\u4f5c"], "num_comments": 2, "on_hf": true, "organization": "University of Central Florida", "pdf_url": "https://arxiv.org/pdf/2611.31466v1", "published_at": "2026-11-23", "score": 0.411, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31466.png", "title": "AdProducer: Towards Agentic Advertising Video Generation", "tldr": "\u7528\u591a\u6a21\u6001\u667a\u80fd\u4f53\u4e32\u8054\u4ea7\u54c1\u8c03\u7814\u4e0e\u5206\u955c\u8bbe\u8ba1\uff0c\u63d0\u5347\u5e7f\u544a\u89c6\u9891\u7684\u4ea7\u54c1\u51c6\u786e\u6027\u4e0e\u521b\u610f\u8868\u73b0\u3002", "upvotes": 4, "what_it_is": "AdProducer\u5c06\u7b80\u77ed\u521b\u610f\u9700\u6c42\u8f6c\u5316\u4e3a\u6210\u7247\uff1a\u591a\u6a21\u6001\u667a\u80fd\u4f53\u901a\u8fc7\u7f51\u9875\u4e0e\u56fe\u50cf\u641c\u7d22\u7814\u7a76\u4ea7\u54c1\uff0c\u518d\u751f\u6210\u5356\u70b9\u9a71\u52a8\u7684\u5206\u955c\uff0c\u6307\u5bfc\u51bb\u7ed3\u7684\u89c6\u9891\u751f\u6210\u5668\u5236\u4f5c\u5e7f\u544a\u3002", "why_notable": "\u5c06\u4ea7\u54c1\u8c03\u7814\u4e0e\u521b\u610f\u51b3\u7b56\u7eb3\u5165\u540c\u4e00\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u800c\u975e\u4ec5\u4f18\u5316\u753b\u9762\u751f\u6210\uff1b\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u5373\u53ef\u8fc1\u79fb\u81f3Veo 3.1\uff0c\u4ee3\u7801\u3001\u6a21\u578b\u4e0e\u6570\u636e\u5747\u5df2\u5f00\u653e\u3002"}, {"abstract": "Context compaction enables large language model agents to tackle long-horizon tasks within limited context budgets by replacing interaction histories with compressed summaries. However, learning effective compaction jointly with the agent policy remains challenging, as summaries affect task success over many subsequent interactions. We introduce RECAP, a reinforcement learning (RL) framework based on the principle that a summary should preserve the behavior induced by the original interaction history. We formalize this principle with a behavior distortion objective that measures the divergence between the agent\u0027s subsequent behavior under compressed and original contexts. We show that the gradient of the distortion objective decomposes into two complementary learning signals: distortion-based reward for summary generation and self-distillation for subsequent actions. Experiments on Qwen3.5-4B show that RECAP consistently outperforms the task-reward-only RL baselines on both environments, leading to an absolute improvement of 4.6% and 4.3% on BrowseComp-plus and SWE-bench Verified, respectively. Ablations further highlight the value of jointly supervising summary generation and post-compaction behavior for RECAP.", "arxiv_id": "2611.31258", "arxiv_url": "https://arxiv.org/abs/2611.31258", "authors": ["Yulun Jiang", "Maria Brbic", "Michael Moor"], "brief": "RECAP\u662f\u8054\u5408\u5b66\u4e60\u4e0a\u4e0b\u6587\u538b\u7f29\u4e0e\u667a\u80fd\u4f53\u7b56\u7565\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u4ee5\u884c\u4e3a\u5931\u771f\u8861\u91cf\u538b\u7f29\u524d\u540e\u7684\u540e\u7eed\u884c\u4e3a\u5dee\u5f02\uff0c\u5c06\u68af\u5ea6\u5206\u89e3\u4e3a\u6458\u8981\u5956\u52b1\u4e0e\u52a8\u4f5c\u81ea\u84b8\u998f\u4fe1\u53f7\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/eth-medical-ai-lab/recap", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.31258", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u884c\u4e3a\u5931\u771f\u76ee\u6807\u7ea6\u675f\u539f\u59cb\u4e0e\u538b\u7f29\u4e0a\u4e0b\u6587\u7684\u540e\u7eed\u884c\u4e3a\u5dee\u5f02", "\u68af\u5ea6\u5206\u89e3\u5f97\u5230\u5931\u771f\u5956\u52b1\u4e0e\u540e\u7eed\u52a8\u4f5c\u81ea\u84b8\u998f", "Qwen3.5-4B\u4e24\u9879\u8bc4\u6d4b\u7edd\u5bf9\u63d0\u53474.6\u548c4.3\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u4e0a\u4e0b\u6587\u538b\u7f29", "\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u81ea\u84b8\u998f"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31258v1", "published_at": "2026-10-19", "score": 0.383, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31258.png", "title": "RECAP: Training Long-horizon LLM Agents with Context Compaction", "tldr": "\u901a\u8fc7\u7ea6\u675f\u538b\u7f29\u524d\u540e\u7684\u884c\u4e3a\u4e00\u81f4\u6027\uff0c\u8054\u5408\u8bad\u7ec3\u6458\u8981\u4e0e\u7b56\u7565\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u957f\u7a0b\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 1, "what_it_is": "RECAP\u662f\u8054\u5408\u5b66\u4e60\u4e0a\u4e0b\u6587\u538b\u7f29\u4e0e\u667a\u80fd\u4f53\u7b56\u7565\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u4ee5\u884c\u4e3a\u5931\u771f\u8861\u91cf\u538b\u7f29\u524d\u540e\u7684\u540e\u7eed\u884c\u4e3a\u5dee\u5f02\uff0c\u5c06\u68af\u5ea6\u5206\u89e3\u4e3a\u6458\u8981\u5956\u52b1\u4e0e\u52a8\u4f5c\u81ea\u84b8\u998f\u4fe1\u53f7\u3002", "why_notable": "\u5c06\u6458\u8981\u8d28\u91cf\u4ece\u6587\u672c\u4fdd\u771f\u8f6c\u5411\u540e\u7eed\u884c\u4e3a\u4fdd\u771f\uff0c\u4e3a\u957f\u7a0b\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u76f4\u63a5\u7684\u8bad\u7ec3\u4fe1\u53f7\uff0c\u5e76\u5728\u6d4f\u89c8\u4e0e\u8f6f\u4ef6\u4fee\u590d\u4efb\u52a1\u4e0a\u9a8c\u8bc1\u6536\u76ca\u3002"}, {"abstract": "AI agents working on long tasks often commit to an answer before they have enough evidence, a behavior called laziness. In our evaluations, they frequently commit even while their stated belief still names several possible answers. An outcome reward at the end of the episode scores only the final answer, so it cannot teach the agent when to commit, because a lucky guess receives the same reward as an answer backed by evidence. During training, however, the simulator can compute the exact posterior over the answer at every step and tell whether the evidence is already enough. We propose Reinforcement Learning with Verifiable Beliefs (RLVB), which rewards the agent for taking further steps while this posterior still allows several answers and for committing once the evidence is sufficient. The reward needs no judge, critic or reward model, and it never reads the belief line the agent writes before each action. We also introduce Pro Worlds, a benchmark of visual puzzles where the agent views a large world through a small window. We evaluate three vision-language models on three benchmarks, two of which are never seen in training. RLVB improves the base model in all nine settings, by 17.1% on average. Under the outcome reward, GRPO and PPO fall below the base model on average. RLVB also outperforms PPO with a process reward from an LLM judge by 9.3% on average while using 1.6 times fewer GPU-hours. The trained agent answers with sufficient evidence in 51%, 12% and 74% of the episodes on the three benchmarks, against 8%, 0.4% and 36% for the base model. Its accuracy gain therefore comes from answering more often at high levels of evidence. The belief line shows how the agent reaches this evidence: it acts on its own belief. It commits at only 0.1 to 2.2% of the turns at which the evidence is insufficient and its line still names several answers, against 3 to 68% for the base model.", "arxiv_id": "2611.32884", "arxiv_url": "https://arxiv.org/abs/2611.32884", "authors": ["Richmond Sin Jing Xuan", "Peilin Feng", "Wenbin Wang", "Soujanya Poria"], "brief": "\u63d0\u51faRLVB\uff0c\u5229\u7528\u6a21\u62df\u5668\u9010\u6b65\u8ba1\u7b97\u7b54\u6848\u7684\u7cbe\u786e\u540e\u9a8c\uff0c\u5956\u52b1\u8bc1\u636e\u4e0d\u8db3\u65f6\u7ee7\u7eed\u63a2\u7d22\u3001\u5145\u5206\u65f6\u63d0\u4ea4\u7b54\u6848\u3002\u5956\u52b1\u65e0\u9700\u88c1\u5224\u6216\u5956\u52b1\u6a21\u578b\uff0c\u4e5f\u4e0d\u8bfb\u53d6\u667a\u80fd\u4f53\u81ea\u8ff0\u7684\u4fe1\u5ff5\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/declare-lab/RLVB", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2611.32884", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RLVB\u4ee5\u7cbe\u786e\u540e\u9a8c\u5224\u65ad\u8bc1\u636e\u5145\u5206\u6027\uff0c\u63d0\u4f9b\u8fc7\u7a0b\u5956\u52b1", "\u5f15\u5165\u89c6\u89c9\u8c1c\u9898Pro Worlds\uff1b3\u6a21\u578b\u00d73\u57fa\u51c6\u5e73\u5747\u63d0\u534717.1%", "\u6bd4LLM\u88c1\u5224\u8fc7\u7a0b\u5956\u52b1\u7684PPO\u9ad89.3%\uff0cGPU\u65f6\u8017\u4e3a\u5176\u7ea663%"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u8fc7\u7a0b\u5956\u52b1", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 6, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.32884v1", "published_at": "2026-11-24", "score": 0.36, "selected_reasons": ["HF trending (96\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32884.png", "title": "Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe", "tldr": "\u7528\u53ef\u9a8c\u8bc1\u7684\u540e\u9a8c\u4fe1\u5ff5\u5956\u52b1\u667a\u80fd\u4f53\uff0c\u8ba9\u5b83\u8bc1\u636e\u4e0d\u8db3\u65f6\u7ee7\u7eed\u63a2\u7d22\u3001\u5145\u5206\u65f6\u518d\u4f5c\u7b54\u3002", "upvotes": 96, "what_it_is": "\u63d0\u51faRLVB\uff0c\u5229\u7528\u6a21\u62df\u5668\u9010\u6b65\u8ba1\u7b97\u7b54\u6848\u7684\u7cbe\u786e\u540e\u9a8c\uff0c\u5956\u52b1\u8bc1\u636e\u4e0d\u8db3\u65f6\u7ee7\u7eed\u63a2\u7d22\u3001\u5145\u5206\u65f6\u63d0\u4ea4\u7b54\u6848\u3002\u5956\u52b1\u65e0\u9700\u88c1\u5224\u6216\u5956\u52b1\u6a21\u578b\uff0c\u4e5f\u4e0d\u8bfb\u53d6\u667a\u80fd\u4f53\u81ea\u8ff0\u7684\u4fe1\u5ff5\u3002", "why_notable": "\u628a\u8bad\u7ec3\u76ee\u6807\u4ece\u731c\u5bf9\u7b54\u6848\u8f6c\u5411\u4f9d\u636e\u5145\u5206\u8bc1\u636e\u884c\u52a8\uff0c\u51cf\u5c11\u8fc7\u65e9\u4f5c\u7b54\uff1b\u5728\u5305\u542b\u672a\u89c1\u4efb\u52a1\u7684\u4e5d\u7ec4\u8bc4\u6d4b\u4e2d\u5747\u6709\u63d0\u5347\uff0c\u663e\u793a\u8de8\u4efb\u52a1\u4ef7\u503c\u3002"}, {"abstract": "Conversational sports analytics requires accurate, evidence-based responses with low latency. Changes in query distributions, data resources, and model behavior can degrade static agent configurations, motivating controlled evolution guided by runtime evidence. We present Sports Agent, a self-evolving framework integrating an Agentic SQL Model for structured-data reasoning, a harness for planning and tool orchestration, and a unified Feedback Engine connecting online execution with offline evolution. The engine assesses responses and execution trajectories, verifies factual claims, diagnoses failures, and generates evolution signals. Model evolution combines SQL-to-Question Scaling for coverage expansion with Graph-Guided Scaling for error-targeted synthesis. Generated questions undergo trajectory distillation and quality filtering for iterative supervised fine-tuning, followed by a separate Post-RL stage. Harness evolution translates recurrent failures into bounded prompt and skill updates, validated through independent audits, execution replay, and regression testing. Performance-tolerance checks guard against unacceptable degradation during simplification. The resulting Qwen3.6-35B-A3B-based model outperforms Qwen3.8-Max on sports question answering and analysis while achieving approximately three times the inference efficiency. Across 30 harness-evolution rounds, the aggregate performance score improves by 10.8 points. In a live sports analytics product, the evolved system improves factual correctness by 10.5 points and average response length, a proxy for answer richness, by 158.1%, while reducing average latency by 41.3% relative to the baseline.", "arxiv_id": "2611.33700", "arxiv_url": "https://arxiv.org/abs/2611.33700", "authors": ["Chao Chen", "Fuqi Lin", "Ze Chen", "Ziyan Liu", "Chen Li", "Haishu Jiang", "Bo Xu", "Zihan Jiang", "Yue Wu", "Zheng Wang", "Kun Wang", "Zhihang Fu", "Jieping Ye"], "brief": "\u8be5\u6846\u67b6\u5c06\u7ed3\u6784\u5316\u6570\u636e\u63a8\u7406\u3001\u5de5\u5177\u7f16\u6392\u4e0e\u7edf\u4e00\u53cd\u9988\u5f15\u64ce\u8054\u52a8\uff0c\u7528\u4e8b\u5b9e\u6838\u9a8c\u548c\u5931\u8d25\u8bca\u65ad\u6307\u5bfc\u6a21\u578b\u8bad\u7ec3\uff0c\u5e76\u4ee5\u5ba1\u8ba1\u3001\u6267\u884c\u56de\u653e\u548c\u56de\u5f52\u6d4b\u8bd5\u7ea6\u675f\u63d0\u793a\u4e0e\u6280\u80fd\u66f4\u65b0\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33700", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["SQL-to-Question\u4e0e\u56fe\u5f15\u5bfc\u6269\u589e\u652f\u6491\u8bad\u7ec3", "\u57fa\u4e8eQwen3.6\u6a21\u578b\u8d85\u8d8aQwen3.8-Max\uff0c\u63a8\u7406\u6548\u7387\u7ea63\u500d", "\u7ebf\u4e0a\u4e8b\u5b9e\u6b63\u786e\u6027\u589e10.5\u70b9\uff0c\u5ef6\u8fdf\u964d41.3%"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u5206\u6790", "\u81ea\u8fdb\u5316", "\u4e8b\u5b9e\u6838\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33700v1", "published_at": "2026-11-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Sports Agent: A Self-Evolving System for Conversational Data Analytics", "tldr": "\u4ee5\u8fd0\u884c\u53cd\u9988\u9a71\u52a8\u6a21\u578b\u4e0e\u5de5\u5177\u7f16\u6392\u53cc\u91cd\u8fdb\u5316\uff0c\u63d0\u5347\u4f53\u80b2\u95ee\u7b54\u51c6\u786e\u6027\u5e76\u964d\u4f4e\u5ef6\u8fdf\u3002", "upvotes": 0, "what_it_is": "\u8be5\u6846\u67b6\u5c06\u7ed3\u6784\u5316\u6570\u636e\u63a8\u7406\u3001\u5de5\u5177\u7f16\u6392\u4e0e\u7edf\u4e00\u53cd\u9988\u5f15\u64ce\u8054\u52a8\uff0c\u7528\u4e8b\u5b9e\u6838\u9a8c\u548c\u5931\u8d25\u8bca\u65ad\u6307\u5bfc\u6a21\u578b\u8bad\u7ec3\uff0c\u5e76\u4ee5\u5ba1\u8ba1\u3001\u6267\u884c\u56de\u653e\u548c\u56de\u5f52\u6d4b\u8bd5\u7ea6\u675f\u63d0\u793a\u4e0e\u6280\u80fd\u66f4\u65b0\u3002", "why_notable": "\u5c06\u81ea\u8fdb\u5316\u843d\u5b9e\u4e3a\u6a21\u578b\u8bad\u7ec3\u4e0e\u7f16\u6392\u66f4\u65b0\u4e24\u6761\u53d7\u63a7\u95ed\u73af\uff0c\u5e76\u5728\u771f\u5b9e\u4ea7\u54c1\u4e2d\u540c\u65f6\u6539\u5584\u4e8b\u5b9e\u6b63\u786e\u6027\u548c\u5ef6\u8fdf\uff0c\u4f53\u73b0\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "We propose loom attention, which allows a Transformer to dynamically rewire its circuits at every token by interweaving a head\u0027s vertical attention over the outputs of earlier heads (to obtain its query, key and value) with its horizontal attention over tokens. We instantiate vertical attention efficiently with normalized and gated linear attention over a per-token matrix memory, which stores the compressed head outputs and serves as a second residual stream. This yields LoomFormer, a dual-stream architecture that splits control and content between the vector and matrix streams. Across model sizes and training token budgets in language modeling and downstream tasks, LoomFormer matches Transformers trained with over 3x compute and recent residual-stream baselines (HC/mHC, MUDDFormer, AttnRes) trained with ~1.7-2.8x. For example, trained on the same 300B tokens with only 2% extra FLOPs, LoomPythia-2.8B achieves ~1.6x the average downstream gain of mHC-Pythia-2.8B over Pythia-2.8B, and matches (0-shot) or surpasses (5-shot) Pythia-12B. Code is available at https://github.com/Caiyun-AI/LoomFormer", "arxiv_id": "2611.30634", "arxiv_url": "https://arxiv.org/abs/2611.30634", "authors": ["Da Xiao", "Qingye Meng", "Shengping Li", "Xingyuan Yuan"], "brief": "\u63d0\u51faLoom attention\uff0c\u5c06\u8de8\u6ce8\u610f\u529b\u5934\u7684\u7eb5\u5411\u6ce8\u610f\u529b\u4e0e\u8de8\u8bcd\u5143\u7684\u6a2a\u5411\u6ce8\u610f\u529b\u4ea4\u7ec7\u3002\u501f\u52a9\u77e9\u9635\u8bb0\u5fc6\u6784\u5efa\u53cc\u6b8b\u5dee\u6d41\uff0c\u5206\u522b\u627f\u8f7d\u63a7\u5236\u4e0e\u5185\u5bb9\uff0c\u5b9e\u73b0\u9010\u8bcd\u52a8\u6001\u91cd\u8fde\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/Caiyun-AI/LoomFormer", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.30634", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5f52\u4e00\u5316\u3001\u95e8\u63a7\u7ebf\u6027\u6ce8\u610f\u529b\u8bfb\u53d6\u538b\u7f29\u5934\u8f93\u51fa\u7684\u77e9\u9635\u8bb0\u5fc6", "LoomFormer\u5339\u654c\u4f7f\u7528\u8d853\u500d\u8ba1\u7b97\u91cf\u8bad\u7ec3\u7684Transformer", "\u540c\u8bad300B\u8bcd\u5143\u4ec5\u589e2% FLOPs\uff0c\u4e0b\u6e38\u589e\u76ca\u7ea6\u4e3amHC\u76841.6\u500d"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u67b6\u6784", "\u8ba1\u7b97\u6548\u7387"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30634v2", "published_at": "2026-11-23", "score": 0.339, "selected_reasons": ["HF trending (86\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30634.png", "title": "Rewirable Circuits in Transformers with Loom Attention", "tldr": "\u901a\u8fc7\u9010\u8bcd\u52a8\u6001\u91cd\u8fde\u6ce8\u610f\u529b\u5934\uff0c\u53cc\u6d41\u67b6\u6784\u4ee5\u8f83\u4f4e\u8ba1\u7b97\u91cf\u83b7\u5f97\u66f4\u5f3a\u8bed\u8a00\u5efa\u6a21\u80fd\u529b\u3002", "upvotes": 86, "what_it_is": "\u63d0\u51faLoom attention\uff0c\u5c06\u8de8\u6ce8\u610f\u529b\u5934\u7684\u7eb5\u5411\u6ce8\u610f\u529b\u4e0e\u8de8\u8bcd\u5143\u7684\u6a2a\u5411\u6ce8\u610f\u529b\u4ea4\u7ec7\u3002\u501f\u52a9\u77e9\u9635\u8bb0\u5fc6\u6784\u5efa\u53cc\u6b8b\u5dee\u6d41\uff0c\u5206\u522b\u627f\u8f7d\u63a7\u5236\u4e0e\u5185\u5bb9\uff0c\u5b9e\u73b0\u9010\u8bcd\u52a8\u6001\u91cd\u8fde\u3002", "why_notable": "\u628a\u56fa\u5b9a\u7684\u6ce8\u610f\u529b\u5934\u8fde\u63a5\u6539\u4e3a\u9010\u8bcd\u53ef\u53d8\u7684\u4fe1\u606f\u8def\u7531\uff0c\u4e3a\u6b8b\u5dee\u6d41\u8bbe\u8ba1\u63d0\u4f9b\u65b0\u65b9\u5411\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u8ba1\u7b97\u6548\u7387\u4f18\u52bf\u8986\u76d6\u591a\u79cd\u89c4\u6a21\u4e0e\u8bad\u7ec3\u9884\u7b97\u3002"}, {"abstract": "Computer-use agents (CUAs) built on vision-language models are increasingly entrusted with long-horizon tasks in live desktop, web, and mobile environments, where the screen keeps changing on its own. However, current CUAs lack real-time situational awareness: they perceive the environment through discrete snapshots, and the substantial inference latency of VLMs, compounded by highly dynamic interfaces, opens a perception-action gap in which the observed state frequently becomes stale before the corresponding action is executed. To bridge this gap, we present NightWatch, a plug-and-play framework that endows any CUA with continuous, temporally grounded perception without changing the agent\u0027s model, prompt, or action space. NightWatch couples the VLM agent with NightWatch-0.8B, a lightweight System-1 model that performs streaming monitoring of the interface state and keeps the agent synchronized with the evolving environment at low computational cost and latency, thereby grounding each decision in the current state rather than an outdated snapshot and reducing both stale actions and idle waiting while preserving task success. Experiments on desktop and dynamic web environments (OSWorld-Verified and DynaCU-Bench) show that NightWatch, driven by a watcher of only 0.8B parameters, reduces non-reasoning wall-clock time by 33% and wasted time by 53% on OSWorld while keeping task success on par, raises success on DynaCU-Bench from 39.5% to 44.2% with the large VLM agent, and is more efficient than passive-watching baselines such as AOI and PUSV under the same screenshot-only input, as well as a System-1 decision model more than $30\\times$ its size. Overall, NightWatch demonstrates that the timing of perception is as critical as its content, marking a step toward agents that maintain continuous awareness of their environment rather than perceiving it turn by turn.", "arxiv_id": "2611.28947", "arxiv_url": "https://arxiv.org/abs/2611.28947", "authors": ["Jiaqi Su", "Jie-Jing Shao", "Yichen Liu", "Long-Kai Huang", "Haiyan Yin"], "brief": "NightWatch\u662f\u5373\u63d2\u5373\u7528\u7684\u6301\u7eed\u611f\u77e5\u6846\u67b6\uff0c\u4ee50.8B\u53c2\u6570\u6a21\u578b\u6d41\u5f0f\u76d1\u63a7\u754c\u9762\u53d8\u5316\uff0c\u540c\u6b65\u89c6\u89c9\u8bed\u8a00\u667a\u80fd\u4f53\uff0c\u65e0\u9700\u4fee\u6539\u5176\u6a21\u578b\u3001\u63d0\u793a\u8bcd\u6216\u52a8\u4f5c\u7a7a\u95f4\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": "https://github.com/SuJQ0722/NightWatch", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.28947", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["NightWatch-0.8B\u4ee5\u4f4e\u5ef6\u8fdf\u6301\u7eed\u76d1\u63a7\u754c\u9762\u72b6\u6001", "OSWorld\u975e\u63a8\u7406\u8017\u65f6\u964d33%\uff0c\u6d6a\u8d39\u65f6\u95f4\u964d53%", "DynaCU-Bench\u6210\u529f\u7387\u4ece39.5%\u5347\u81f344.2%"], "keywords": ["\u7535\u8111\u64cd\u4f5c\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6301\u7eed\u611f\u77e5", "\u63a8\u7406\u5ef6\u8fdf"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.28947v1", "published_at": "2026-11-21", "score": 0.335, "selected_reasons": ["HF trending (95\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28947.png", "title": "Don\u0027t Sleep, Keep Watch: Proactive Perception for Computer-Use Agents", "tldr": "\u7528\u8f7b\u91cf\u6a21\u578b\u6301\u7eed\u76d1\u63a7\u754c\u9762\uff0c\u8ba9\u7535\u8111\u64cd\u4f5c\u667a\u80fd\u4f53\u51cf\u5c11\u8fc7\u65f6\u52a8\u4f5c\u4e0e\u65e0\u6548\u7b49\u5f85\u3002", "upvotes": 95, "what_it_is": "NightWatch\u662f\u5373\u63d2\u5373\u7528\u7684\u6301\u7eed\u611f\u77e5\u6846\u67b6\uff0c\u4ee50.8B\u53c2\u6570\u6a21\u578b\u6d41\u5f0f\u76d1\u63a7\u754c\u9762\u53d8\u5316\uff0c\u540c\u6b65\u89c6\u89c9\u8bed\u8a00\u667a\u80fd\u4f53\uff0c\u65e0\u9700\u4fee\u6539\u5176\u6a21\u578b\u3001\u63d0\u793a\u8bcd\u6216\u52a8\u4f5c\u7a7a\u95f4\u3002", "why_notable": "\u5b83\u628a\u611f\u77e5\u65f6\u673a\u4f5c\u4e3a\u667a\u80fd\u4f53\u6548\u7387\u7684\u5173\u952e\u53d8\u91cf\uff0c\u4ee5\u5c0f\u6a21\u578b\u7f13\u89e3\u63a8\u7406\u671f\u95f4\u754c\u9762\u53d8\u5316\u9020\u6210\u7684\u72b6\u6001\u8fc7\u65f6\uff0c\u5728\u4fdd\u6301\u4efb\u52a1\u6210\u529f\u7387\u7684\u540c\u65f6\u51cf\u5c11\u7b49\u5f85\u3002"}, {"abstract": "We report the development of Antom 3-in-1 Transformer, a payment foundation model that integrates sequence, tabular, and graph representations for payment risk detection. The model contains approximately 7B parameters, with approximately 1.7B activated per task route. Antom 3-in-1 Transformer is pretrained to learn reusable behavioral and relational representations, primarily on Ant International\u0027s internal payment data. In a cross-business transfer experiment, pretraining improves the target business metric by 34.5% over the same architecture trained from scratch. With only 25% of the training labels, the pretrained model outperforms the full-label scratch baseline in Average Precision (AP) and Recall@0.5% on different merchant domains. In a four-month online experiment on Ant International\u0027s billion-scale payment platform, the model reduced the overall loss rate by 37.88% relative to XGB-Online.", "arxiv_id": "2611.25403", "arxiv_url": "https://arxiv.org/abs/2611.25403", "authors": ["Weiyu Han", "Haoyu Jiang", "Jie Sheng", "Youxi Pan", "Xianglong Liu", "Zeqi Ren", "Dongquan Yi", "Yinhao Liu", "Ruobing Zuo", "Ze Zhao", "Huilin He", "Nairong Zhang", "Xinyi He", "Xiao Tan", "Jun Wang", "Pan Fang", "Wei Zeng", "Jianan Su", "Kaixin Shen", "Jingtong Wu", "Hao Li", "Shuai Chen", "Jiangming Yang", "Tianyi Zhang"], "brief": "\u8be5\u6a21\u578b\u4e3b\u8981\u7528\u8682\u8681\u56fd\u9645\u5185\u90e8\u652f\u4ed8\u6570\u636e\u9884\u8bad\u7ec3\uff0c\u8054\u5408\u5b66\u4e60\u5e8f\u5217\u3001\u8868\u683c\u4e0e\u56fe\u4e2d\u7684\u884c\u4e3a\u548c\u5173\u7cfb\u8868\u793a\u3002\u603b\u53c2\u6570\u7ea670\u4ebf\uff0c\u6bcf\u6761\u4efb\u52a1\u8def\u7531\u6fc0\u6d3b\u7ea617\u4ebf\uff0c\u7528\u4e8e\u652f\u4ed8\u98ce\u9669\u68c0\u6d4b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.25403", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8de8\u4e1a\u52a1\u8fc1\u79fb\u4e2d\uff0c\u9884\u8bad\u7ec3\u8f83\u540c\u67b6\u6784\u4ece\u96f6\u8bad\u7ec3\u63d0\u5347\u4e1a\u52a1\u6307\u680734.5%", "\u4ec5\u752825%\u6807\u7b7e\uff0cAP\u4e0eRecall@0.5%\u8d85\u5168\u6807\u7b7e\u57fa\u7ebf", "\u56db\u4e2a\u6708\u7ebf\u4e0a\u5b9e\u9a8c\uff1a\u635f\u5931\u7387\u8f83XGB-Online\u964d\u4f4e37.88%"], "keywords": ["\u652f\u4ed8\u98ce\u63a7", "\u57fa\u7840\u6a21\u578b", "\u591a\u6a21\u6001\u878d\u5408", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "ant-international", "pdf_url": "https://arxiv.org/pdf/2611.25403v1", "published_at": "2026-11-19", "score": 0.33, "selected_reasons": ["HF trending (102\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25403.png", "title": "Antom 3-in-1 Transformer: A Payment Foundation Model", "tldr": "\u878d\u5408\u5e8f\u5217\u3001\u8868\u683c\u4e0e\u56fe\u8868\u793a\u7684\u652f\u4ed8\u98ce\u63a7\u6a21\u578b\uff0c\u4ee5\u9884\u8bad\u7ec3\u63d0\u5347\u8de8\u4e1a\u52a1\u8fc1\u79fb\u548c\u7ebf\u4e0a\u6548\u679c\u3002", "upvotes": 102, "what_it_is": "\u8be5\u6a21\u578b\u4e3b\u8981\u7528\u8682\u8681\u56fd\u9645\u5185\u90e8\u652f\u4ed8\u6570\u636e\u9884\u8bad\u7ec3\uff0c\u8054\u5408\u5b66\u4e60\u5e8f\u5217\u3001\u8868\u683c\u4e0e\u56fe\u4e2d\u7684\u884c\u4e3a\u548c\u5173\u7cfb\u8868\u793a\u3002\u603b\u53c2\u6570\u7ea670\u4ebf\uff0c\u6bcf\u6761\u4efb\u52a1\u8def\u7531\u6fc0\u6d3b\u7ea617\u4ebf\uff0c\u7528\u4e8e\u652f\u4ed8\u98ce\u9669\u68c0\u6d4b\u3002", "why_notable": "\u7ed3\u679c\u540c\u65f6\u5c55\u793a\u4e86\u9884\u8bad\u7ec3\u5728\u8de8\u4e1a\u52a1\u8fc1\u79fb\u3001\u6807\u7b7e\u6548\u7387\u548c\u771f\u5b9e\u652f\u4ed8\u98ce\u63a7\u4e2d\u7684\u4ef7\u503c\uff1b\u5341\u4ebf\u7ea7\u5e73\u53f0\u7684\u7ebf\u4e0a\u9a8c\u8bc1\uff0c\u8ba9\u6536\u76ca\u4e0d\u53ea\u505c\u7559\u5728\u79bb\u7ebf\u6307\u6807\u3002"}, {"abstract": "Spatial intelligence, the ability to reason about 3D space from visual observations, becomes essential as multimodal large language models (MLLMs) move into the physical world. Beyond perceiving each view, it rests on two cornerstones of human cognition: fusing multiple views into one coherent 3D scene and mentally transforming that scene to new viewpoints as reasoning unfolds. Yet our spatial probes reveal that MLLMs largely lack both capabilities, even after spatial fine-tuning. We therefore present S-Mind, which internalizes multi-view geometry within the MLLM through a compact set of spatial tokens. It supervises these tokens to hold the fused 3D scene and re-emits them to re-express this scene from every viewpoint the reasoning adopts. Across four spatial benchmarks, S-Mind improves its Qwen3.5 backbones by up to 22.26 points and surpasses frontier general models such as GPT-6-Astra (+0.45), Kimi-K3.1-Pro (+1.97), and GLM-5.3-Flash (+7.80) in average accuracy. Moreover, the same probes confirm that it acquires both capabilities, reaching fusion and transformation accuracies of 65.11% and 82.17%, against at most 16.02% and 37.28% for the baselines. At inference, S-Mind also runs about 100x faster than a tool-based agent on the same backbone. Instilled through these spatial tokens during training, spatial capability becomes intrinsic to the backbone and persists even when the tokens are withheld, offering a promising path toward spatial intelligence in MLLMs.", "arxiv_id": "2611.28649", "arxiv_url": "https://arxiv.org/abs/2611.28649", "authors": ["Muxin Fu", "Peike Yu", "Guibin Zhang", "Wenrui Zhou", "Runze Liu", "Lang Feng", "Fuchao Yang", "Feng Chen", "Yixuan Li", "Mengao Zhang", "Shiying Zhang", "Wen Shen", "Ling Pan", "Shuicheng Yan", "Bo An"], "brief": "S-Mind\u7528\u4e00\u7ec4\u7d27\u51d1\u7a7a\u95f4\u4ee4\u724c\u627f\u8f7d\u591a\u89c6\u89d2\u878d\u5408\u540e\u7684\u4e09\u7ef4\u573a\u666f\uff0c\u901a\u8fc7\u76d1\u7763\u8bad\u7ec3\u5b66\u4e60\u51e0\u4f55\u8868\u793a\uff0c\u5e76\u5728\u63a8\u7406\u5207\u6362\u89c6\u89d2\u65f6\u91cd\u65b0\u8f93\u51fa\u4ee4\u724c\uff0c\u8868\u8fbe\u53d8\u6362\u540e\u7684\u573a\u666f\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/KANABOON1/S-Mind", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.28649", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u56db\u9879\u7a7a\u95f4\u57fa\u51c6\u4e0a\uff0cQwen3.5\u6700\u9ad8\u63d0\u534722.26\u5206", "\u573a\u666f\u878d\u5408\u4e0e\u89c6\u89d2\u53d8\u6362\u51c6\u786e\u7387\u8fbe65.11%\u548c82.17%", "\u63a8\u7406\u6bd4\u540c\u9aa8\u5e72\u5de5\u5177\u667a\u80fd\u4f53\u5feb\u7ea6100\u500d\uff0c\u79fb\u9664\u4ee4\u724c\u4ecd\u4fdd\u7559\u80fd\u529b"], "keywords": ["\u7a7a\u95f4\u63a8\u7406", "\u591a\u89c6\u89d2\u51e0\u4f55", "\u591a\u6a21\u6001\u5927\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.28649v1", "published_at": "2026-11-21", "score": 0.329, "selected_reasons": ["HF trending (41\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28649.png", "title": "S-Mind: Internalizing Multi-View Geometry for Spatial Intelligence", "tldr": "\u901a\u8fc7\u7a7a\u95f4\u4ee4\u724c\u5185\u5316\u591a\u89c6\u89d2\u51e0\u4f55\uff0c\u8ba9\u591a\u6a21\u6001\u6a21\u578b\u66f4\u51c6\u786e\u5730\u878d\u5408\u573a\u666f\u5e76\u8f6c\u6362\u89c6\u89d2\u3002", "upvotes": 41, "what_it_is": "S-Mind\u7528\u4e00\u7ec4\u7d27\u51d1\u7a7a\u95f4\u4ee4\u724c\u627f\u8f7d\u591a\u89c6\u89d2\u878d\u5408\u540e\u7684\u4e09\u7ef4\u573a\u666f\uff0c\u901a\u8fc7\u76d1\u7763\u8bad\u7ec3\u5b66\u4e60\u51e0\u4f55\u8868\u793a\uff0c\u5e76\u5728\u63a8\u7406\u5207\u6362\u89c6\u89d2\u65f6\u91cd\u65b0\u8f93\u51fa\u4ee4\u724c\uff0c\u8868\u8fbe\u53d8\u6362\u540e\u7684\u573a\u666f\u3002", "why_notable": "\u5b83\u5c06\u4e09\u7ef4\u878d\u5408\u4e0e\u89c6\u89d2\u53d8\u6362\u4ece\u5916\u90e8\u5de5\u5177\u64cd\u4f5c\u8f6c\u4e3a\u6a21\u578b\u5185\u5728\u80fd\u529b\uff0c\u540c\u65f6\u63d0\u5347\u7a7a\u95f4\u63a8\u7406\u51c6\u786e\u7387\u4e0e\u901f\u5ea6\uff0c\u4e3a\u9762\u5411\u7269\u7406\u4e16\u754c\u7684\u591a\u6a21\u6001\u6a21\u578b\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Coding agents can construct and revise robot behavior during execution, but using one agent for the whole robot can delay otherwise independent work. We introduce Asynchronous Coding Agents as Policy (ACAP), an asynchronous framework that organizes one robot as a team of persistent agents. Each member reasons and acts for a configurable control group, such as an arm with its gripper or the torso and chassis, enabling asynchronous reasoning and execution. However, different robot components often have physical dependencies that require coordination. To address this challenge, ACAP introduces a hyper-agent that assigns tasks, coordinates dependencies, and dynamically allocates control between the lead and member agents. This allows independent work to progress concurrently while supporting tightly coupled manipulation when necessary. Across 72 real-world rollouts covering 25 task/platform settings, ACAP reduces task-balanced time cost by 28.2% compared with a single-agent Direct Policy, with improvements across Fully Parallel, Parallel-Sequential, and Collaborative tasks. Across all eight Collaborative settings, ACAP also achieves lower mean time cost than Fixed Delegation, where only member agents can control their assigned groups. An additional 90-rollout study shows lower mean 30-minute-capped time cost than Direct on all six tasks. We further demonstrate mobile manipulation using the same member interface for chassis and torso control. We present the framework and a real-world rollout dataset
