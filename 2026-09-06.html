ilingual and Attack-Resistant Benchmark for Instruction-Following in Vision-Language Models", "tldr": "\u591a\u8bed\u8a00\u6297\u653b\u51fbVLM\u6307\u4ee4\u8ddf\u968f\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MM-IFEval-Pro\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u591a\u6a21\u6001\u6307\u4ee4\u8ddf\u968f\u57fa\u51c6\uff0c\u8986\u76d6\u4e2d\u82f1\u6587\u4efb\u52a1\u4e0e\u591a\u7c7b\u6307\u4ee4\u52ab\u6301\u573a\u666f\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u542b\u4e2d\u6587\u4e0e\u5bf9\u6297\u6307\u4ee4\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u96c6\uff0c\u7528\u4e8e\u63d0\u5347\u6a21\u578b\u5728\u590d\u6742\u7ea6\u675f\u4e0b\u7684\u6307\u4ee4\u6267\u884c\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u8bed\u8a00\u3001\u590d\u6742\u7ea6\u675f\u548c\u6307\u4ee4\u52ab\u6301\u5b89\u5168\u8bc4\u6d4b\u7ed3\u5408\u8d77\u6765\uff0c\u6709\u52a9\u4e8e\u66f4\u771f\u5b9e\u5730\u8861\u91cfVLM\u5728\u5b9e\u9645\u5e94\u7528\u4e2d\u7684\u53ef\u9760\u6027\u4e0e\u6297\u653b\u51fb\u80fd\u529b\uff0c\u5e76\u4e3a\u540e\u7eed\u8bad\u7ec3\u6539\u8fdb\u63d0\u4f9b\u6570\u636e\u652f\u6491\u3002"}, {"abstract": "Vision-language models (VLMs) are expected to respond helpfully to appropriate requests while withholding compliance with requests that are incorrect, unsafe, infeasible, or unanswerable. However, existing benchmarks predominantly evaluate non-compliance at the level of the query as a whole, assuming that each request either warrants compliance or requires withholding compliance. In practice, real-world queries can contain a mixture of answerable content and components for which compliance should be withheld. In this paper, we introduce KoNA, a benchmark for evaluating selective non-compliance in VLMs across five categories: False Premise, Visual Inaccessibility, Universal Unknown, Task Feasibility, and Safety. Each task evaluates two capabilities: query-level non-compliance and component-level non-compliance under paired single and compound queries. Our evaluation across diverse VLMs shows that models often fail to refuse, correct, or abstain appropriately, and these failures become more pronounced when queries require selective non-compliance. To address this challenge, we fine-tune VLMs using KoNA examples that require selective non-compliance, together with a fully answerable set that should receive direct answers. Our fine-tuned models achieve substantial improvements in non-compliance accuracy while largely maintaining performance on fully answerable tasks. These results suggest that the fine-tuned models can distinguish between answerable components and those requiring non-compliance and respond in a task-appropriate manner.", "arxiv_id": "2609.04720", "arxiv_url": "https://arxiv.org/abs/2609.04720", "authors": ["Minji Kim", "Jihyoung Jang", "Hyounghun Kim"], "brief": "\u672c\u6587\u63d0\u51fa KoNA \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u6df7\u5408\u8bf7\u6c42\u4e2d\u533a\u5206\u53ef\u56de\u7b54\u90e8\u5206\u4e0e\u5e94\u62d2\u7b54\u90e8\u5206\u7684\u80fd\u529b\u3002\u57fa\u51c6\u8986\u76d6\u9519\u8bef\u524d\u63d0\u3001\u89c6\u89c9\u4e0d\u53ef\u89c1\u3001\u666e\u904d\u672a\u77e5\u3001\u4efb\u52a1\u4e0d\u53ef\u884c\u548c\u5b89\u5168\u4e94\u7c7b\u975e\u5408\u89c4\u573a\u666f\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u63d0\u5347\u6a21\u578b\u9009\u62e9\u6027\u975e\u5408\u89c4\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04720", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["KoNA \u540c\u65f6\u8bc4\u4f30\u67e5\u8be2\u7ea7\u975e\u5408\u89c4\u4e0e\u7ec4\u4ef6\u7ea7\u975e\u5408\u89c4\uff0c\u5305\u542b\u6210\u5bf9\u7684\u5355\u4e00\u67e5\u8be2\u548c\u590d\u5408\u67e5\u8be2\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u591a\u610f\u56fe\u8bf7\u6c42\u3002", "\u5bf9\u591a\u79cd VLM \u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u5728\u9700\u8981\u62d2\u7edd\u3001\u7ea0\u6b63\u6216 abstain \u65f6\u7ecf\u5e38\u5931\u8d25\uff0c\u590d\u5408\u67e5\u8be2\u4e2d\u7684\u9009\u62e9\u6027\u62d2\u7b54\u5c24\u5176\u56f0\u96be\u3002", "\u4f7f\u7528 KoNA \u9009\u62e9\u6027\u975e\u5408\u89c4\u6837\u4f8b\u53ca\u5b8c\u5168\u53ef\u56de\u7b54\u6837\u4f8b\u5fae\u8c03\u540e\uff0c\u6a21\u578b\u663e\u8457\u63d0\u5347\u975e\u5408\u89c4\u51c6\u786e\u7387\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u6b63\u5e38\u56de\u7b54\u80fd\u529b\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5b89\u5168\u5bf9\u9f50", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04720v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Knowing What Not to Answer: Selective Non-Compliance in Vision-Language Models", "tldr": "KoNA\u8bc4\u6d4bVLM\u9009\u62e9\u6027\u62d2\u7b54\u80fd\u529b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa KoNA \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u6df7\u5408\u8bf7\u6c42\u4e2d\u533a\u5206\u53ef\u56de\u7b54\u90e8\u5206\u4e0e\u5e94\u62d2\u7b54\u90e8\u5206\u7684\u80fd\u529b\u3002\u57fa\u51c6\u8986\u76d6\u9519\u8bef\u524d\u63d0\u3001\u89c6\u89c9\u4e0d\u53ef\u89c1\u3001\u666e\u904d\u672a\u77e5\u3001\u4efb\u52a1\u4e0d\u53ef\u884c\u548c\u5b89\u5168\u4e94\u7c7b\u975e\u5408\u89c4\u573a\u666f\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u63d0\u5347\u6a21\u578b\u9009\u62e9\u6027\u975e\u5408\u89c4\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a VLM \u5b89\u5168\u4e0e\u53ef\u9760\u6027\u8bc4\u6d4b\u4ece\u201c\u6574\u6761\u8bf7\u6c42\u662f\u5426\u62d2\u7b54\u201d\u63a8\u8fdb\u5230\u201c\u54ea\u4e9b\u5b50\u90e8\u5206\u8be5\u7b54\u3001\u54ea\u4e9b\u8be5\u62d2\u201d\uff0c\u66f4\u7b26\u5408\u771f\u5b9e\u5e94\u7528\u4e2d\u7684\u590d\u6742\u7528\u6237\u67e5\u8be2\uff0c\u5bf9\u6784\u5efa\u66f4\u7a33\u5065\u7684\u591a\u6a21\u6001\u52a9\u624b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Striking a balance between helpfulness and safety remains a fundamental challenge in aligning large language models. To achieve this balance, models should refuse harmful queries (e.g., \"How do I shoot someone?\") while remaining responsive to benign inputs, even those superficially resembling harmful queries (e.g., \"Where can I shoot a good photo?\"). However, models often struggle to distinguish genuinely harmful queries from benign queries that contain superficially risky language, resulting in false refusals. In this paper, we address the issue by decomposing a response in the safety-tuning dataset into two distinct components: (i) a boilerplate refusal statement and (ii) a rationale explaining the refusal. Our experiments and analyses show that refusal statements impede accurate discrimination between harmful and benign queries by inducing reliance on superficial cues. In contrast, training solely on rationales reduces false refusals while maintaining a comparable level of safety performance. Rationale-Only benefits also appear in our ICL configuration and remain compatible with the evaluated inference-time mitigation methods. The results emphasize the necessity of precisely curated, fine-grained safety supervision datasets and outline directions for constructing aligned agents that better reconcile helpfulness with safety.", "arxiv_id": "2609.04714", "arxiv_url": "https://arxiv.org/abs/2609.04714", "authors": ["Minji Kim", "Hyounghun Kim"], "brief": "\u672c\u6587\u5bf9\u5b89\u5168\u5fae\u8c03\u6570\u636e\u4e2d\u7684\u62d2\u7b54\u56de\u590d\u505a\u7ed3\u6784\u62c6\u89e3\uff0c\u5c06\u5176\u5206\u4e3a\u6a21\u677f\u5316\u62d2\u7edd\u58f0\u660e\u4e0e\u89e3\u91ca\u6027\u7406\u7531\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u53bb\u6389\u62d2\u7edd\u58f0\u660e\u3001\u4ec5\u7528\u62d2\u7b54\u7406\u7531\u8bad\u7ec3\uff0c\u80fd\u5728\u4fdd\u6301\u5b89\u5168\u6027\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u8bed\u8a00\u6a21\u578b\u5bf9\u826f\u6027\u8bf7\u6c42\u7684\u8bef\u62d2\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04714", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u62d2\u7edd\u58f0\u660e\u4f1a\u8bf1\u5bfc\u6a21\u578b\u4f9d\u8d56\u8868\u9762\u98ce\u9669\u8bcd\u7b49\u6d45\u5c42\u7ebf\u7d22\uff0c\u524a\u5f31\u5176\u533a\u5206\u6709\u5bb3\u4e0e\u826f\u6027\u8bf7\u6c42\u7684\u80fd\u529b", "Rationale-Only \u8bad\u7ec3\u80fd\u51cf\u5c11 false refusals\uff0c\u540c\u65f6\u7ef4\u6301\u4e0e\u539f\u5b89\u5168\u8bad\u7ec3\u76f8\u8fd1\u7684\u5b89\u5168\u8868\u73b0", "\u8be5\u65b9\u6cd5\u5728\u4e0a\u4e0b\u6587\u5b66\u4e60\u914d\u7f6e\u4e2d\u540c\u6837\u6709\u6548\uff0c\u5e76\u53ef\u4e0e\u63a8\u7406\u65f6\u7f13\u89e3\u8bef\u62d2\u7684\u6280\u672f\u517c\u5bb9"], "keywords": ["\u5b89\u5168\u5bf9\u9f50", "\u62d2\u7b54\u4f18\u5316", "\u8bed\u8a00\u6a21\u578b", "\u76d1\u7763\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04714v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Refuse without Refusal: A Structural Analysis of Safety-Tuning Responses for Reducing False Refusals in Language Models", "tldr": "\u4ec5\u7528\u62d2\u7b54\u7406\u7531\u8bad\u7ec3\u53ef\u51cf\u5c11\u8bef\u62d2\u7b54", "upvotes": 0, "what_it_is": "\u672c\u6587\u5bf9\u5b89\u5168\u5fae\u8c03\u6570\u636e\u4e2d\u7684\u62d2\u7b54\u56de\u590d\u505a\u7ed3\u6784\u62c6\u89e3\uff0c\u5c06\u5176\u5206\u4e3a\u6a21\u677f\u5316\u62d2\u7edd\u58f0\u660e\u4e0e\u89e3\u91ca\u6027\u7406\u7531\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u53bb\u6389\u62d2\u7edd\u58f0\u660e\u3001\u4ec5\u7528\u62d2\u7b54\u7406\u7531\u8bad\u7ec3\uff0c\u80fd\u5728\u4fdd\u6301\u5b89\u5168\u6027\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u8bed\u8a00\u6a21\u578b\u5bf9\u826f\u6027\u8bf7\u6c42\u7684\u8bef\u62d2\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u5b89\u5168\u5bf9\u9f50\u6570\u636e\u7684\u56de\u590d\u7ed3\u6784\u672c\u8eab\u4f1a\u5f71\u54cd\u6a21\u578b\u884c\u4e3a\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u7b80\u5355\u4f46\u6709\u6548\u7684\u5b89\u5168\u76d1\u7763\u6539\u9020\u601d\u8def\uff0c\u6709\u52a9\u4e8e\u5728\u5b89\u5168\u6027\u4e0e\u6709\u7528\u6027\u4e4b\u95f4\u53d6\u5f97\u66f4\u597d\u5e73\u8861\u3002"}, {"abstract": "Self-evolving language models improve by proposing candidate updates and keeping whatever raises a visible score. When that score is an imperfect proxy for the capability one actually wants, sustained selection widens the gap between the two. This is reward hacking. We introduce HackProbe, a monitor that attaches to an arbitrary self-evolving loop through two black-box hooks, with no access to weights or activations. It keeps a secret, distribution-fixed comparison core, whose frozen distribution makes its capability proxy comparable across generations, alongside a rotated fresh layer that hardens the bank against co-adaptation. Four tests built on that proxy cover the level gap, a scale-aligned divergence with online change-point detection, capability stagnation, and a conditional confidently-wrong rate; a Sidak correction turns them into a calibrated family-wise p-value. Diagnosis alone recovers nothing, so a risk-aware immunization layer reselects an honest candidate from the proposal pool using the core together with a purely structural gaming footprint, disclosing at most log2 Pi bits per generation to the host. We prove a detectability bound that converts a target error rate into an explicit probe-size budget, and we delimit what probe rotation does and does not buy. On a controlled prompt-level host with four injected hacking channels and ground-truth labels, HackProbe reaches 0.763 AUROC against 0.663 for the strongest baseline and cuts the false-positive rate from 0.706 to 0.434. Its bandwidth-limited reselection is the only immunization level that returns more true capability under hacking, 5.2 points on average, than it forfeits on clean runs, 4.7; per-channel effects are mostly not individually significant.", "arxiv_id": "2609.04665", "arxiv_url": "https://arxiv.org/abs/2609.04665", "authors": ["Rongxin Yang", "Yang Liu", "Shang Luo", "Haoxuan Jia", "Chongyang Zhang", "Hao Zheng", "Yingguang Yang", "Yulin Huang", "Jianshen Zhang", "Yongzhi Qi", "Kefu Xu", "Congjing Ran", "Bin Chong"], "brief": "\u8bba\u6587\u63d0\u51fa HackProbe\uff0c\u4e00\u79cd\u53ef\u63a5\u5165\u4efb\u610f\u81ea\u8fdb\u5316\u8bed\u8a00\u6a21\u578b\u8bad\u7ec3/\u9009\u62e9\u5faa\u73af\u7684\u9ed1\u7bb1\u76d1\u6d4b\u5668\uff0c\u7528\u4e8e\u53d1\u73b0\u4ee3\u7406\u6307\u6807\u4e0e\u771f\u5b9e\u80fd\u529b\u4e4b\u95f4\u56e0\u6301\u7eed\u9009\u62e9\u800c\u6269\u5927\u7684\u5956\u52b1\u9ed1\u5ba2\u73b0\u8c61\u3002\u5b83\u8fd8\u52a0\u5165\u98ce\u9669\u611f\u77e5\u7684\u201c\u514d\u75ab\u201d\u91cd\u9009\u5c42\uff0c\u4ece\u5019\u9009\u66f4\u65b0\u6c60\u4e2d\u6311\u9009\u66f4\u8bda\u5b9e\u7684\u6a21\u578b\u66f4\u65b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04665", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ec5\u4f9d\u8d56\u4e24\u4e2a\u9ed1\u7bb1\u63a5\u53e3\uff0c\u65e0\u9700\u8bbf\u95ee\u6a21\u578b\u6743\u91cd\u6216\u6fc0\u6d3b\uff1b\u4f7f\u7528\u79d8\u5bc6\u4e14\u5206\u5e03\u56fa\u5b9a\u7684\u6bd4\u8f83\u6838\u5fc3\u6765\u4fdd\u8bc1\u8de8\u4ee3\u80fd\u529b\u4ee3\u7406\u53ef\u6bd4\uff0c\u5e76\u7528\u8f6e\u6362\u65b0\u9c9c\u5c42\u964d\u4f4e\u5171\u9002\u5e94\u98ce\u9669\u3002", "\u8bbe\u8ba1\u56db\u7c7b\u68c0\u6d4b\uff1a\u6c34\u5e73\u5dee\u8ddd\u3001\u5c3a\u5ea6\u5bf9\u9f50\u5206\u6b67\u4e0e\u5728\u7ebf\u53d8\u70b9\u68c0\u6d4b\u3001\u80fd\u529b\u505c\u6ede\u3001\u6761\u4ef6\u6027\u9ad8\u7f6e\u4fe1\u9519\u8bef\u7387\uff0c\u5e76\u7528 Sidak \u6821\u6b63\u5f97\u5230\u6821\u51c6\u540e\u7684\u65cf\u9519\u8bef\u7387 p \u503c\u3002", "\u5728\u542b4\u79cd\u6ce8\u5165\u5f0f\u5956\u52b1\u9ed1\u5ba2\u901a\u9053\u7684\u53d7\u63a7\u5b9e\u9a8c\u4e2d\uff0cHackProbe AUROC \u8fbe0.763\uff0c\u9ad8\u4e8e\u6700\u5f3a\u57fa\u7ebf0.663\uff0c\u5e76\u5c06\u8bef\u62a5\u7387\u4ece0.706\u964d\u81f30.434\u3002"], "keywords": ["\u5956\u52b1\u9ed1\u5ba2", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u81ea\u6211\u8fdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04665v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Harness-agnostic detection and immunization of reward hacking in self-evolving language models", "tldr": "\u9ed1\u7bb1\u76d1\u6d4b\u5e76\u6291\u5236\u81ea\u8fdb\u5316\u6a21\u578b\u5956\u52b1\u9ed1\u5ba2", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HackProbe\uff0c\u4e00\u79cd\u53ef\u63a5\u5165\u4efb\u610f\u81ea\u8fdb\u5316\u8bed\u8a00\u6a21\u578b\u8bad\u7ec3/\u9009\u62e9\u5faa\u73af\u7684\u9ed1\u7bb1\u76d1\u6d4b\u5668\uff0c\u7528\u4e8e\u53d1\u73b0\u4ee3\u7406\u6307\u6807\u4e0e\u771f\u5b9e\u80fd\u529b\u4e4b\u95f4\u56e0\u6301\u7eed\u9009\u62e9\u800c\u6269\u5927\u7684\u5956\u52b1\u9ed1\u5ba2\u73b0\u8c61\u3002\u5b83\u8fd8\u52a0\u5165\u98ce\u9669\u611f\u77e5\u7684\u201c\u514d\u75ab\u201d\u91cd\u9009\u5c42\uff0c\u4ece\u5019\u9009\u66f4\u65b0\u6c60\u4e2d\u6311\u9009\u66f4\u8bda\u5b9e\u7684\u6a21\u578b\u66f4\u65b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u81ea\u6211\u6539\u8fdb\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u6838\u5fc3\u5b89\u5168\u98ce\u9669\uff1a\u6a21\u578b\u53ef\u80fd\u8d8a\u6765\u8d8a\u64c5\u957f\u4f18\u5316\u53ef\u89c1\u5206\u6570\u800c\u975e\u771f\u5b9e\u80fd\u529b\u3002HackProbe \u7684\u9ed1\u7bb1\u3001\u6846\u67b6\u65e0\u5173\u8bbe\u8ba1\u63d0\u9ad8\u4e86\u5b9e\u9645\u90e8\u7f72\u53ef\u80fd\u6027\uff0c\u5e76\u9996\u6b21\u5c06\u68c0\u6d4b\u3001\u7edf\u8ba1\u6821\u51c6\u4e0e\u5019\u9009\u91cd\u9009\u5f0f\u514d\u75ab\u7ed3\u5408\u8d77\u6765\u3002"}, {"abstract": "Recent advances in wearable sensing enable continuous monitoring of physiological and behavioral signals, yet existing benchmarks rarely evaluate whether AI systems can reason over a real user\u0027s longitudinal wearable record. We introduce WearableQA, a benchmark comprising 4,084 10-option multiple-choice questions constructed from the wearable time series, blood biomarkers, and demographics of 200 real users, each with up to 500 days of daily measurements. WearableQA preserves authentic wearable distributions that include device noise and inter-individual variability. To evaluate distinct reasoning capabilities, we introduce 16 question types organized along two complementary axes: data versus health reasoning, which distinguishes computation over longitudinal measurements from physiological interpretation; and single- versus cross-signal reasoning, which separates reasoning about individual signals from the integration of multiple signals. To construct reliable questions at scale, we adopt a dual-grounding framework that combines literature-grounded physiological findings with statistically validated population-grounded physiological patterns. This enables the capture of meaningful relationships observed in real-world wearable data. Evaluation of 14 proprietary and open-source LLMs demonstrates that WearableQA effectively differentiates model capabilities, with performance ranging from 19.6% to 72.9% against a 10% chance baseline. Moreover, WearableQA remains far from solved: most models achieve accuracies below 60%. Overall, WearableQA provides a realistic and diagnostic benchmark for evaluating LLM reasoning over real-world wearable data.", "arxiv_id": "2609.05405", "arxiv_url": "https://arxiv.org/abs/2609.05405", "authors": ["Ji Soo Lee", "Xilun Chen", "Pierce Chuang", "Ashish Shenoy", "Jason Wei", "Dohwan Ko", "Hyunwoo J. Kim", "Benoit Corda"], "brief": "\u672c\u6587\u63d0\u51fa WearableQA\uff0c\u4e00\u4e2a\u57fa\u4e8e200\u540d\u771f\u5b9e\u7528\u6237\u3001\u6700\u957f500\u5929\u53ef\u7a7f\u6234\u65f6\u95f4\u5e8f\u5217\u3001\u8840\u6db2\u751f\u7269\u6807\u5fd7\u7269\u4e0e\u4eba\u53e3\u7edf\u8ba1\u4fe1\u606f\u6784\u5efa\u7684\u5065\u5eb7\u63a8\u7406\u95ee\u7b54\u57fa\u51c6\u3002\u5b83\u5305\u542b4084\u905310\u9009\u9879\u9009\u62e9\u9898\uff0c\u7528\u4e8e\u8bc4\u4f30LLM\u5bf9\u7eb5\u5411\u751f\u7406\u4e0e\u884c\u4e3a\u6570\u636e\u7684\u8ba1\u7b97\u548c\u5065\u5eb7\u89e3\u91ca\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05405", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bbe\u8ba116\u7c7b\u95ee\u9898\uff0c\u8986\u76d6\u6570\u636e\u63a8\u7406\u4e0e\u5065\u5eb7\u63a8\u7406\u3001\u5355\u4fe1\u53f7\u4e0e\u8de8\u4fe1\u53f7\u63a8\u7406\u4e24\u6761\u7ef4\u5ea6\u3002", "\u91c7\u7528\u53cc\u91cd grounding \u6846\u67b6\uff1a\u7ed3\u5408\u6587\u732e\u652f\u6301\u7684\u751f\u7406\u53d1\u73b0\u4e0e\u7edf\u8ba1\u9a8c\u8bc1\u7684\u4eba\u7fa4\u7ea7\u771f\u5b9e\u6a21\u5f0f\u6765\u751f\u6210\u53ef\u9760\u95ee\u9898\u3002", "\u8bc4\u6d4b14\u4e2a\u95ed\u6e90\u4e0e\u5f00\u6e90LLM\uff0c\u51c6\u786e\u7387\u4ece19.6%\u523072.9%\uff0c\u591a\u6570\u6a21\u578b\u4f4e\u4e8e60%\uff0c\u663e\u8457\u9ad8\u4e8e\u4f46\u4ecd\u8fdc\u672a\u89e3\u51b310%\u968f\u673a\u57fa\u7ebf\u3002"], "keywords": ["\u5065\u5eb7AI", "\u53ef\u7a7f\u6234\u6570\u636e", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05405v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "WearableQA: A Benchmark for Health Reasoning over Real-World Wearable Data", "tldr": "\u9762\u5411\u771f\u5b9e\u53ef\u7a7f\u6234\u5065\u5eb7\u6570\u636e\u7684\u63a8\u7406\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa WearableQA\uff0c\u4e00\u4e2a\u57fa\u4e8e200\u540d\u771f\u5b9e\u7528\u6237\u3001\u6700\u957f500\u5929\u53ef\u7a7f\u6234\u65f6\u95f4\u5e8f\u5217\u3001\u8840\u6db2\u751f\u7269\u6807\u5fd7\u7269\u4e0e\u4eba\u53e3\u7edf\u8ba1\u4fe1\u606f\u6784\u5efa\u7684\u5065\u5eb7\u63a8\u7406\u95ee\u7b54\u57fa\u51c6\u3002\u5b83\u5305\u542b4084\u905310\u9009\u9879\u9009\u62e9\u9898\uff0c\u7528\u4e8e\u8bc4\u4f30LLM\u5bf9\u7eb5\u5411\u751f\u7406\u4e0e\u884c\u4e3a\u6570\u636e\u7684\u8ba1\u7b97\u548c\u5065\u5eb7\u89e3\u91ca\u80fd\u529b\u3002", "why_notable": "WearableQA\u628aLLM\u8bc4\u6d4b\u4ece\u9759\u6001\u533b\u5b66\u77e5\u8bc6\u6269\u5c55\u5230\u771f\u5b9e\u3001\u566a\u58f0\u4e30\u5bcc\u3001\u4e2a\u4f53\u5dee\u5f02\u663e\u8457\u7684\u957f\u671f\u53ef\u7a7f\u6234\u6570\u636e\uff0c\u6709\u52a9\u4e8e\u8bca\u65ad\u6a21\u578b\u5728\u4e2a\u6027\u5316\u5065\u5eb7\u76d1\u6d4b\u548c\u591a\u4fe1\u53f7\u751f\u7406\u63a8\u7406\u4e2d\u7684\u5b9e\u9645\u80fd\u529b\u3002"}, {"abstract": "Mixture-of-Experts (MoE) models activate only a small subset of experts per token, but the full expert set often exceeds GPU memory, causing repeated weight transfers during decoding. We formulate expert-cache management as a model-side algorithmic problem and propose a cache-aware post-training framework that jointly adapts the MoE backbone and lightweight auxiliary cache routers while preserving the native Top-K expert-selection rule at inference. Its update-only mode, Temporal Router, predicts same-layer reuse and retains experts for future tokens without proactive loading. The full Spatio-Temporal Router adds a Spatio Router that uses the causal predecessor\u0027s hidden state to refine the temporal cache before target-layer access. We evaluate both modes on Qwen3 and GPT-OSS across GSM8K, MATH, and CommonsenseQA. Temporal Router consistently improves cache hit rate and reduces expert-weight traffic over matched LM-only baselines. On Qwen3, Spatio-Temporal Router achieves the best load-adjusted efficiency across three tasks, improving adjusted hit rate by 1.15--18.03 points and reducing traffic by 4.6--53.3% relative to the strongest evaluated prefetching baseline; results on GPT-OSS are competitive but task-dependent. An auxiliary-only ablation preserves baseline accuracy but yields modest cache gains, whereas joint post-training produces larger improvements. Sensitivity analyses show that cache capacity controls transfer demand, while the refinement budget governs the trade-off between pre-access coverage and proactive traffic.", "arxiv_id": "2609.04895", "arxiv_url": "https://arxiv.org/abs/2609.04895", "authors": ["Zhenhe Wu", "Yaping Jin", "Qinghua Xing", "Hang Zhou", "Wei He", "Xianjie Wu", "Xianfu Cheng", "Jian Yang", "Hanting Chen"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411MoE\u63a8\u7406\u7684\u7f13\u5b58\u611f\u77e5\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u8054\u5408\u9002\u914dMoE\u4e3b\u5e72\u4e0e\u8f7b\u91cf\u7ea7\u7f13\u5b58\u8def\u7531\u5668\uff0c\u5728\u4e0d\u6539\u53d8\u539f\u751fTop-K\u4e13\u5bb6\u9009\u62e9\u89c4\u5219\u7684\u524d\u63d0\u4e0b\u63d0\u5347\u4e13\u5bb6\u7f13\u5b58\u547d\u4e2d\u7387\u3002\u65b9\u6cd5\u5305\u542b\u4ec5\u66f4\u65b0\u7f13\u5b58\u7684Temporal Router\uff0c\u4ee5\u53ca\u7ed3\u5408\u56e0\u679c\u524d\u9a71\u9690\u85cf\u72b6\u6001\u8fdb\u884c\u7a7a\u95f4-\u65f6\u95f4\u7ec6\u5316\u7684Spatio-Temporal Router\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04895", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u4e13\u5bb6\u7f13\u5b58\u7ba1\u7406\u5efa\u6a21\u4e3a\u6a21\u578b\u4fa7\u7b97\u6cd5\u95ee\u9898\uff0c\u800c\u975e\u5355\u7eaf\u7cfb\u7edf\u8c03\u5ea6\u95ee\u9898", "Temporal Router\u9884\u6d4b\u540c\u5c42\u4e13\u5bb6\u590d\u7528\uff0c\u4ec5\u4fdd\u7559\u672a\u6765\u53ef\u80fd\u7528\u5230\u7684\u4e13\u5bb6\uff0c\u4e0d\u505a\u4e3b\u52a8\u52a0\u8f7d", "\u5728Qwen3\u4e0a\u76f8\u8f83\u6700\u5f3a\u9884\u53d6\u57fa\u7ebf\uff0c\u8c03\u6574\u540e\u547d\u4e2d\u7387\u63d0\u53471.15\u201318.03\u70b9\uff0c\u4e13\u5bb6\u6743\u91cd\u4f20\u8f93\u91cf\u964d\u4f4e4.6\u201353.3%"], "keywords": ["MoE", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u52a0\u901f", "\u8def\u7531\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04895v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Cache-Aware Joint Router Adaptation for Memory-Efficient MoE Inference", "tldr": "\u8ba9MoE\u63a8\u7406\u66f4\u4f1a\u7528\u4e13\u5bb6\u7f13\u5b58\uff0c\u663e\u8457\u964d\u663e\u5b58\u6d41\u91cf", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411MoE\u63a8\u7406\u7684\u7f13\u5b58\u611f\u77e5\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u8054\u5408\u9002\u914dMoE\u4e3b\u5e72\u4e0e\u8f7b\u91cf\u7ea7\u7f13\u5b58\u8def\u7531\u5668\uff0c\u5728\u4e0d\u6539\u53d8\u539f\u751fTop-K\u4e13\u5bb6\u9009\u62e9\u89c4\u5219\u7684\u524d\u63d0\u4e0b\u63d0\u5347\u4e13\u5bb6\u7f13\u5b58\u547d\u4e2d\u7387\u3002\u65b9\u6cd5\u5305\u542b\u4ec5\u66f4\u65b0\u7f13\u5b58\u7684Temporal Router\uff0c\u4ee5\u53ca\u7ed3\u5408\u56e0\u679c\u524d\u9a71\u9690\u85cf\u72b6\u6001\u8fdb\u884c\u7a7a\u95f4-\u65f6\u95f4\u7ec6\u5316\u7684Spatio-Temporal Router\u3002", "why_notable": "MoE\u5927\u6a21\u578b\u63a8\u7406\u5e38\u53d7\u4e13\u5bb6\u6743\u91cd\u9891\u7e41\u642c\u8fd0\u9650\u5236\uff0c\u8be5\u65b9\u6cd5\u901a\u8fc7\u540e\u8bad\u7ec3\u548c\u8f7b\u91cf\u8def\u7531\u5668\u63d0\u5347\u7f13\u5b58\u6548\u7387\uff0c\u6709\u671b\u964d\u4f4e\u663e\u5b58\u538b\u529b\u4e0e\u63a8\u7406\u5e26\u5bbd\u5f00\u9500\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u539f\u6709\u6a21\u578b\u8def\u7531\u4e0e\u51c6\u786e\u7387\u3002"}, {"abstract": "Reasoning in large language models unfolds through diverse functional operations, such as problem formulation, goal decomposition, and deduction. Although these operations are explicitly distinguished in text, little is known about how they are geometrically organized in representation spaces. To this end, we investigate whether distinct reasoning operations exhibit corresponding geometric structure in hidden representations. We find that operations are separable in held-out representations, with separability peaking in middle layers, and verify that this structure is not explained by lexical or positional confounds. Across layers, token-wise operation-alignment becomes more distributed over spans, while identical surface tokens are represented differently depending on the operation of its surrounding chunk. Attention-masking interventions further show that operation-aligned representations at chunk onset depend on preceding reasoning context. Consequently, our work demonstrates that language models maintain representational correspondence between linguistic reasoning expressions and their internal geometric structures. Code and project materials are available at https://github.com/naver-ai/beneath-cot.", "arxiv_id": "2609.04753", "arxiv_url": "https://arxiv.org/abs/2609.04753", "authors": ["Seogyeong Jeong", "Jaehui Hwang", "Dongyoon Han", "Geonmo Gu", "Alice Oh", "Taekyung Kim"], "brief": "\u672c\u6587\u4ece\u673a\u5236\u89e3\u91ca\u89d2\u5ea6\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u94fe\u5f0f\u601d\u7ef4\u4e2d\u7684\u4e0d\u540c\u63a8\u7406\u64cd\u4f5c\uff08\u5982\u95ee\u9898\u8868\u8ff0\u3001\u76ee\u6807\u5206\u89e3\u3001\u6f14\u7ece\uff09\u662f\u5426\u5bf9\u5e94\u53ef\u5206\u79bb\u7684\u5185\u90e8\u8868\u5f81\u7ed3\u6784\u3002\u7814\u7a76\u53d1\u73b0\u8fd9\u4e9b\u64cd\u4f5c\u5728\u9690\u85cf\u7a7a\u95f4\u4e2d\u5177\u6709\u7a33\u5b9a\u7684\u51e0\u4f55\u53ef\u5206\u6027\uff0c\u4e14\u4e0d\u53ea\u662f\u8bcd\u6c47\u6216\u4f4d\u7f6e\u56e0\u7d20\u9020\u6210\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04753", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u540c\u63a8\u7406\u64cd\u4f5c\u5728\u4fdd\u7559\u6837\u672c\u7684\u9690\u85cf\u8868\u5f81\u4e2d\u53ef\u88ab\u533a\u5206\uff0c\u53ef\u5206\u6027\u5728\u4e2d\u95f4\u5c42\u6700\u5f3a", "\u76f8\u540c\u8868\u9762\u8bcd\u5728\u4e0d\u540c\u63a8\u7406\u64cd\u4f5c\u4e0a\u4e0b\u6587\u4e2d\u4f1a\u5f62\u6210\u4e0d\u540c\u8868\u793a\uff0c\u8bf4\u660e\u6a21\u578b\u8868\u5f81\u8d85\u8d8a\u4e86\u8bcd\u9762\u5339\u914d", "\u6ce8\u610f\u529b\u906e\u853d\u5e72\u9884\u8868\u660e\uff0c\u63a8\u7406\u7247\u6bb5\u5f00\u5934\u7684\u64cd\u4f5c\u5bf9\u9f50\u8868\u5f81\u4f9d\u8d56\u6b64\u524d\u7684\u63a8\u7406\u4e0a\u4e0b\u6587"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u94fe\u5f0f\u601d\u7ef4", "\u53ef\u89e3\u91ca\u6027", "\u8868\u5f81\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04753v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beneath the Surface of Chains-of-Thought: A Mechanistic Interpretation of Reasoning Operations in LLMs", "tldr": "\u63ed\u793aCoT\u63a8\u7406\u64cd\u4f5c\u7684\u9690\u85cf\u8868\u5f81\u51e0\u4f55\u7ed3\u6784", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ece\u673a\u5236\u89e3\u91ca\u89d2\u5ea6\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u94fe\u5f0f\u601d\u7ef4\u4e2d\u7684\u4e0d\u540c\u63a8\u7406\u64cd\u4f5c\uff08\u5982\u95ee\u9898\u8868\u8ff0\u3001\u76ee\u6807\u5206\u89e3\u3001\u6f14\u7ece\uff09\u662f\u5426\u5bf9\u5e94\u53ef\u5206\u79bb\u7684\u5185\u90e8\u8868\u5f81\u7ed3\u6784\u3002\u7814\u7a76\u53d1\u73b0\u8fd9\u4e9b\u64cd\u4f5c\u5728\u9690\u85cf\u7a7a\u95f4\u4e2d\u5177\u6709\u7a33\u5b9a\u7684\u51e0\u4f55\u53ef\u5206\u6027\uff0c\u4e14\u4e0d\u53ea\u662f\u8bcd\u6c47\u6216\u4f4d\u7f6e\u56e0\u7d20\u9020\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u7406\u89e3\u5927\u6a21\u578b\u94fe\u5f0f\u601d\u7ef4\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u7684\u673a\u5236\u8bc1\u636e\uff0c\u8868\u660e\u6a21\u578b\u5185\u90e8\u786e\u5b9e\u7ef4\u62a4\u4e86\u4e0e\u8bed\u8a00\u5316\u63a8\u7406\u6b65\u9aa4\u76f8\u5bf9\u5e94\u7684\u51e0\u4f55\u7ed3\u6784\uff0c\u6709\u52a9\u4e8e\u63a8\u8fdb\u53ef\u89e3\u91ca\u6027\u3001\u63a8\u7406\u8bca\u65ad\u4e0e\u6a21\u578b\u884c\u4e3a\u5206\u6790\u3002"}, {"abstract": "Media bias in news articles operates through subtle linguistic cues---loaded language, selective framing, and strategic omission---that resist single-model detection and have traditionally required large annotated corpora for supervised training. We ask whether structured multi-agent deliberation can serve as a principled, training-free alternative to supervised classification for this task. We introduce MABPD (Multi-Agent Bias Probing \u0026 Detection), a pipeline in which three specialized LLM agents analyze an article from complementary perspectives and resolve disagreements through a Structured Argument Debate (SAD) protocol. SAD implements a domain-motivated asymmetric burden of proof---biased claims without grounded textual evidence carry zero weight---combined with role-weighted voting and post-consensus verification, replacing task-specific supervised decision boundaries with explicit deliberative structure. Ablation confirms that this structured deliberation, not mere agent parallelism, drives performance: removing the debate module reduces F1 by up to 10.6 points. On the BABE benchmark (4,121 expert-annotated sentences), MABPD achieves 83.4% macro F1 on the held-out test split---within 0.7 percentage points (pp) of the supervised SOTA (MAGPIE, 84.1% macro F1; Horych et al., 2024)---without any task-specific training or threshold tuning on annotated data. Cross-dataset evaluation on the SemEval 2019 HyperPartisan corpus (644 articles) yields 75.0% zero-shot accuracy, within 7.2 pp of the supervised SOTA accuracy (82.2%; Kiesel et al. 2019), confirming transfer across annotation regimes. We release the full pipeline and evaluation code.", "arxiv_id": "2609.04841", "arxiv_url": "https://arxiv.org/abs/2609.04841", "authors": ["Garvit Joshi", "Stavya Dhyani", "Jasmine", "Arun Chauhan"], "brief": "\u8bba\u6587\u63d0\u51fa MABPD\uff0c\u7528\u4e09\u4e2a\u4e13\u95e8\u5316\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u4ece\u4e0d\u540c\u89d2\u5ea6\u5206\u6790\u65b0\u95fb\u6587\u672c\uff0c\u5e76\u901a\u8fc7\u7ed3\u6784\u5316\u8bba\u8bc1\u8fa9\u8bba\u6765\u68c0\u6d4b\u5a92\u4f53\u504f\u89c1\uff0c\u65e0\u9700\u4efb\u52a1\u7279\u5b9a\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u5728 BABE \u4e0a\u8fbe\u5230 83.4% macro F1\uff0c\u63a5\u8fd1\u76d1\u7763 SOTA\uff0c\u5e76\u5728 HyperPartisan \u4e0a\u53d6\u5f97\u8f83\u597d\u7684\u96f6\u6837\u672c\u8fc1\u79fb\u6548\u679c\uff1b\u6d88\u878d\u663e\u793a\u8fa9\u8bba\u673a\u5236\u662f\u6027\u80fd\u63d0\u5347\u5173\u952e\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04841", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5a92\u4f53\u504f\u89c1\u68c0\u6d4b", "\u8fa9\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04841v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MABPD: Multi-Agent Bias Probing \u0026 Detection via Structured Argument Debate", "tldr": "\u8bba\u6587\u63d0\u51fa MABPD\uff0c\u7528\u4e09\u4e2a\u4e13\u95e8\u5316\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u4ece\u4e0d\u540c\u89d2\u5ea6\u5206\u6790\u65b0\u95fb\u6587\u672c\uff0c\u5e76\u901a\u8fc7\u7ed3\u6784\u5316\u8bba\u8bc1\u8fa9\u8bba\u6765\u68c0\u6d4b\u5a92\u4f53\u504f\u89c1\uff0c\u65e0\u9700\u4efb\u52a1\u7279\u5b9a\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u5728 BABE \u4e0a\u8fbe\u5230 83.4% macro F1\uff0c\u63a5\u8fd1\u76d1\u7763 SOTA\uff0c\u5e76\u5728 HyperPartisan \u4e0a\u53d6\u5f97\u8f83\u597d\u7684\u96f6\u6837\u672c\u8fc1\u79fb\u6548\u679c\uff1b\u6d88\u878d\u663e\u793a\u8fa9\u8bba\u673a\u5236\u662f\u6027\u80fd\u63d0\u5347\u5173\u952e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion language models (DLMs) offer a non-autoregressive alternative for mobile edge agentic artificial intelligence (AI) by refining tokens through iterative denoising rather than left-to-right decoding. Compared with autoregressive Transformer-based large language models (LLMs), DLMs can update multiple uncertain tokens in parallel and exploit bidirectional context throughout the generation process, enabling more flexible quality-latency trade-offs beyond fixed sequential decoding. These properties are particularly attractive for edge agents, where partial refinement, early exit, and constraint-guided correction can reduce response delay and communication overhead while improving robustness under noisy, incomplete, or dynamic contexts. This survey reviews DLM foundations and analyzes their suitability for edge settings under latency, memory, energy, bandwidth, privacy, and reliability constraints. We cover resource-efficient architectures, training and inference acceleration, compression, edge/cloud deployment, communication-aware serving, Internet of Things (IoT)/wireless applications, and evaluation of DLM-based agents. We further discuss open issues in long-context state management, split inference, trustworthy execution, multimodal grounding, and reproducible benchmarking. The goal is to connect DLM modeling properties, including bidirectionality, parallel refinement, controllability, and quality-latency elasticity, with system-level requirements of future mobile edge intelligence.", "arxiv_id": "2609.04778", "arxiv_url": "https://arxiv.org/abs/2609.04778", "authors": ["Chenqi Li", "Minghui Min", "Dusit Niyato", "Wei Ni"], "brief": "\u672c\u6587\u7efc\u8ff0\u6269\u6563\u8bed\u8a00\u6a21\u578b\u5728\u79fb\u52a8\u8fb9\u7f18\u667a\u80fd\u4f53 AI \u4e2d\u7684\u57fa\u7840\u3001\u5e94\u7528\u4e0e\u6311\u6218\u3002\u76f8\u6bd4\u81ea\u56de\u5f52 LLM\uff0cDLM \u901a\u8fc7\u5e76\u884c\u8fed\u4ee3\u53bb\u566a\u751f\u6210\u6587\u672c\uff0c\u53ef\u5728\u8fb9\u7f18\u573a\u666f\u4e2d\u5e26\u6765\u66f4\u7075\u6d3b\u7684\u8d28\u91cf-\u65f6\u5ef6\u6743\u8861\uff0c\u5e76\u6709\u671b\u964d\u4f4e\u5ef6\u8fdf\u3001\u901a\u4fe1\u5f00\u9500\u548c\u63d0\u5347\u9c81\u68d2\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04778", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u667a\u80fd\u4f53", "\u8fb9\u7f18\u8ba1\u7b97", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04778v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Diffusion Language Models for Mobile Edge Agentic AI: Foundations, Applications, and Challenges", "tldr": "\u672c\u6587\u7efc\u8ff0\u6269\u6563\u8bed\u8a00\u6a21\u578b\u5728\u79fb\u52a8\u8fb9\u7f18\u667a\u80fd\u4f53 AI \u4e2d\u7684\u57fa\u7840\u3001\u5e94\u7528\u4e0e\u6311\u6218\u3002\u76f8\u6bd4\u81ea\u56de\u5f52 LLM\uff0cDLM \u901a\u8fc7\u5e76\u884c\u8fed\u4ee3\u53bb\u566a\u751f\u6210\u6587\u672c\uff0c\u53ef\u5728\u8fb9\u7f18\u573a\u666f\u4e2d\u5e26\u6765\u66f4\u7075\u6d3b\u7684\u8d28\u91cf-\u65f6\u5ef6\u6743\u8861\uff0c\u5e76\u6709\u671b\u964d\u4f4e\u5ef6\u8fdf\u3001\u901a\u4fe1\u5f00\u9500\u548c\u63d0\u5347\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Distillation is common in LLM post-training, where on-policy knowledge distillation (OPKD) uses student-generated trajectories to prepare the student for downstream RL. At each state, the student matches a next-token distribution supplied by the teacher. As the rollout enters states the teacher would not visit, the teacher-student distribution gap can accumulate. In tool use, this gap becomes consequential because student-written calls execute before supervision and their observations shape later prefixes. Proposer-verifier generation addresses this drift by letting the teacher decide which student-proposed text is retained during generation. Existing formulations govern text but leave tool execution outside their scope. We propose Persistent Teacher Anchoring (PTA), a student-induced but teacher-committed rollout construction. PTA retains chunk-level verification and adds turn-level commitment, allowing a call to reach the environment only after the teacher has verified the entire turn. Treating verified chunks as atomic generation units, we introduce persistent lookahead, which fills idle rollout capacity by advancing future samples and carrying unfinished ones across student updates under the fixed verifier. Across Search-R1-style retrieval and DeepEyes-style perception RL, applying PTA before downstream RL improves macro best@4 by 2.5 and 2.8 points over OPKD under the same downstream RL budget, while lookahead improves throughput by 24%.", "arxiv_id": "2609.04773", "arxiv_url": "https://arxiv.org/abs/2609.04773", "authors": ["Hyun Bin Park", "Kyungho Song", "Sangmin Lee", "Du-Seong Chang"], "brief": "\u672c\u6587\u9488\u5bf9\u4f1a\u8c03\u7528\u5de5\u5177\u7684 LLM \u667a\u80fd\u4f53\u5728 on-policy \u84b8\u998f\u4e2d\u56e0\u5b66\u751f\u751f\u6210\u9519\u8bef\u5de5\u5177\u8c03\u7528\u800c\u5bfc\u81f4\u8f68\u8ff9\u6f02\u79fb\u7684\u95ee\u9898\uff0c\u63d0\u51fa Persistent Teacher Anchoring\uff08PTA\uff09\u3002\u8be5\u65b9\u6cd5\u8ba9\u6559\u5e08\u5728\u6574\u8f6e\u9a8c\u8bc1\u540e\u624d\u5141\u8bb8\u5de5\u5177\u8c03\u7528\u6267\u884c\uff0c\u5e76\u901a\u8fc7\u6301\u4e45\u5316\u524d\u77bb\u63d0\u5347\u91c7\u6837\u6548\u7387\uff1b\u5728\u68c0\u7d22\u548c\u611f\u77e5\u7c7b\u5f3a\u5316\u5b66\u4e60\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4 OPKD \u7684 macro best@4 \u5206\u522b\u63d0\u5347 2.5 \u548c 2.8 \u70b9\uff0c\u541e\u5410\u63d0\u5347 24%\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04773", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04773v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Persistent Teacher Anchoring for Tool-Using Agents", "tldr": "\u672c\u6587\u9488\u5bf9\u4f1a\u8c03\u7528\u5de5\u5177\u7684 LLM \u667a\u80fd\u4f53\u5728 on-policy \u84b8\u998f\u4e2d\u56e0\u5b66\u751f\u751f\u6210\u9519\u8bef\u5de5\u5177\u8c03\u7528\u800c\u5bfc\u81f4\u8f68\u8ff9\u6f02\u79fb\u7684\u95ee\u9898\uff0c\u63d0\u51fa Persistent Teacher Anchoring\uff08PTA\uff09\u3002\u8be5\u65b9\u6cd5\u8ba9\u6559\u5e08\u5728\u6574\u8f6e\u9a8c\u8bc1\u540e\u624d\u5141\u8bb8\u5de5\u5177\u8c03\u7528\u6267\u884c\uff0c\u5e76\u901a\u8fc7\u6301\u4e45\u5316\u524d\u77bb\u63d0\u5347\u91c7\u6837\u6548\u7387\uff1b\u5728\u68c0\u7d22\u548c\u611f\u77e5\u7c7b\u5f3a\u5316\u5b66\u4e60\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4 OPKD \u7684 macro best@4 \u5206\u522b\u63d0\u5347 2.5 \u548c 2.8 \u70b9\uff0c\u541e\u5410\u63d0\u5347 24%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI coding systems are moving from autocomplete and chat toward agents that can inspect repositories, edit multiple files, run tools, write tests, open pull requests, and work for long periods with limited supervision. This capability changes the bottleneck in software delivery. Recent field studies show meaningful gains in coding activity, but newer evidence also shows that those gains attenuate sharply between writing code and shipping reliable software. Review, integration, testing, security, deployment, and production operations remain constraining stages, while the economics are shifting from predictable per-seat licensing toward variable token, tool, sandbox, CI, and rework costs. This paper synthesizes peer-reviewed software-engineering research, university studies, benchmark audits, production reports from major technology companies, developer telemetry, and cost-management evidence released primarily from 2024 through September 2026. No new model experiment is claimed; numerical findings remain attributed to their original studies. The synthesis proposes four engineering concepts: the Agentic SDLC Throughput Paradox, Production-Qualified Change (PQC), the Verification Tax, and an Agentic SDLC Control Plane that allocates autonomy subject to cost, reliability, and human-attention budgets. An evidence-based horizon then maps today\u0027s supervised agents to future policy-bounded software factories. The central research question shifts from how much code an agent can generate to how much production-qualified value an engineering system can deliver per dollar, per reviewer-hour, and per unit of operational risk.", "arxiv_id": "2609.04681", "arxiv_url": "https://arxiv.org/abs/2609.04681", "authors": ["Happy Bhati"], "brief": "\u672c\u6587\u7efc\u8ff0\u4e862024\u81f32026\u5e74\u5173\u4e8e\u667a\u80fd\u4f53\u5f0f\u8f6f\u4ef6\u5f00\u53d1\u7684\u7814\u7a76\u4e0e\u4ea7\u4e1a\u8bc1\u636e\uff0c\u6307\u51faAI\u7f16\u7801\u7684\u74f6\u9888\u5df2\u4ece\u751f\u6210\u4ee3\u7801\u8f6c\u5411\u9a8c\u8bc1\u3001\u96c6\u6210\u3001\u6d4b\u8bd5\u3001\u5b89\u5168\u3001\u90e8\u7f72\u548c\u8fd0\u7ef4\u7b49\u53ef\u9760\u4ea4\u4ed8\u73af\u8282\u3002\u8bba\u6587\u63d0\u51faAgentic SDLC\u541e\u5410\u6096\u8bba\u3001\u751f\u4ea7\u5408\u683c\u53d8\u66f4\u3001\u9a8c\u8bc1\u7a0e\u548c\u63a7\u5236\u5e73\u9762\u7b49\u6982\u5ff5\uff0c\u5f3a\u8c03\u5e94\u4ee5\u5355\u4f4d\u6210\u672c\u3001\u8bc4\u5ba1\u65f6\u95f4\u548c\u8fd0\u7ef4\u98ce\u9669\u4e0b\u7684\u751f\u4ea7\u4ef7\u503c\u6765\u8861\u91cf\u667a\u80fd\u4f53\u8f6f\u4ef6\u5de5\u7a0b\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04681", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u53ef\u9760\u6027\u9a8c\u8bc1", "\u6210\u672c\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04681v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Code Generation: Reliability, Verification, and Cost Economics in the Agentic Software Development Lifecycle", "tldr": "\u672c\u6587\u7efc\u8ff0\u4e862024\u81f32026\u5e74\u5173\u4e8e\u667a\u80fd\u4f53\u5f0f\u8f6f\u4ef6\u5f00\u53d1\u7684\u7814\u7a76\u4e0e\u4ea7\u4e1a\u8bc1\u636e\uff0c\u6307\u51faAI\u7f16\u7801\u7684\u74f6\u9888\u5df2\u4ece\u751f\u6210\u4ee3\u7801\u8f6c\u5411\u9a8c\u8bc1\u3001\u96c6\u6210\u3001\u6d4b\u8bd5\u3001\u5b89\u5168\u3001\u90e8\u7f72\u548c\u8fd0\u7ef4\u7b49\u53ef\u9760\u4ea4\u4ed8\u73af\u8282\u3002\u8bba\u6587\u63d0\u51faAgentic SDLC\u541e\u5410\u6096\u8bba\u3001\u751f\u4ea7\u5408\u683c\u53d8\u66f4\u3001\u9a8c\u8bc1\u7a0e\u548c\u63a7\u5236\u5e73\u9762\u7b49\u6982\u5ff5\uff0c\u5f3a\u8c03\u5e94\u4ee5\u5355\u4f4d\u6210\u672c\u3001\u8bc4\u5ba1\u65f6\u95f4\u548c\u8fd0\u7ef4\u98ce\u9669\u4e0b\u7684\u751f\u4ea7\u4ef7\u503c\u6765\u8861\u91cf\u667a\u80fd\u4f53\u8f6f\u4ef6\u5de5\u7a0b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents are increasingly proposed for enterprise workflows, yet existing evaluations rarely test whether business-decision conclusions transfer across competitive market ecologies. We introduce ERPBench, an execution-instrumented benchmark for enterprise decision agents in a six-round Enterprise Resource Planning (ERP) simulation with coupled pricing, production, procurement, inventory, finance, and shared-market competition. ERPBench evaluates the same 100 fixed problems in two matched competitive market ecologies: Solo, where each evaluated LLM agent competes against fixed rule-based opponents, and Arena, where six evaluated LLM agents compete in a shared market. Across six model families, this yields 1,200 model-level trajectories spanning 7,200 decision rounds. Under the observed service configuration, the leading model differs between ecologies: DeepSeek leads in Solo (252.29M mean valuation; mean rank 1.67), whereas Gemini leads in Arena (263.95M; 1.76). The two ecologies identify the same task-level winner on only 21 of 100 problems, and Gemini\u0027s bottom-rank rate falls from 22 % to 0 % in Arena. ERPBench supports paired evaluation of whether enterprise-agent rankings transfer across competitive market ecologies, supplemented by aggregate execution-intervention analysis. Code and benchmark resources are available in our https://github.com/GAIR-NLP/erp-bench.", "arxiv_id": "2609.04667", "arxiv_url": "https://arxiv.org/abs/2609.04667", "authors": ["Xinran Zhang", "Pengrui Lu", "Lyumanshan Ye", "Pengfei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa ERPBench\uff0c\u7528\u516d\u8f6e ERP \u4eff\u771f\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u5b9a\u4ef7\u3001\u751f\u4ea7\u3001\u91c7\u8d2d\u3001\u5e93\u5b58\u3001\u8d22\u52a1\u548c\u5e02\u573a\u7ade\u4e89\u4e2d\u7684\u4f01\u4e1a\u51b3\u7b56\u80fd\u529b\u3002\u5b9e\u9a8c\u53d1\u73b0\u6a21\u578b\u6392\u540d\u5728 Solo \u4e0e Arena \u4e24\u79cd\u7ade\u4e89\u751f\u6001\u4e2d\u5dee\u5f02\u663e\u8457\uff0c\u8bf4\u660e\u4f01\u4e1a\u667a\u80fd\u4f53\u8bc4\u6d4b\u9700\u8981\u8003\u8651\u5171\u4eab\u5e02\u573a\u7ade\u4e89\u73af\u5883\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04667", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4f01\u4e1a\u51b3\u7b56", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04667v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ERPBench: Evaluating LLM Agents for Enterprise Decision-Making Across Competitive Market Ecologies", "tldr": "\u8bba\u6587\u63d0\u51fa ERPBench\uff0c\u7528\u516d\u8f6e ERP \u4eff\u771f\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u5b9a\u4ef7\u3001\u751f\u4ea7\u3001\u91c7\u8d2d\u3001\u5e93\u5b58\u3001\u8d22\u52a1\u548c\u5e02\u573a\u7ade\u4e89\u4e2d\u7684\u4f01\u4e1a\u51b3\u7b56\u80fd\u529b\u3002\u5b9e\u9a8c\u53d1\u73b0\u6a21\u578b\u6392\u540d\u5728 Solo \u4e0e Arena \u4e24\u79cd\u7ade\u4e89\u751f\u6001\u4e2d\u5dee\u5f02\u663e\u8457\uff0c\u8bf4\u660e\u4f01\u4e1a\u667a\u80fd\u4f53\u8bc4\u6d4b\u9700\u8981\u8003\u8651\u5171\u4eab\u5e02\u573a\u7ade\u4e89\u73af\u5883\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Building on the pioneering paper of Kearns, Roth, and Ryu (SODA\u002726), we study information aggregation in a networked learning model. The model captures a central pattern in agentic AI: each agent sees only part of the data and passes on only its own conclusion. Their model considers a linear regression problem with the mean squared error (MSE) loss. Agents sit in a DAG and each sees only a subset of the features and its parents\u0027 predictions, fits a linear predictor, and passes only its prediction forward. The benchmark is the full-feature learner that sees all raw features. A path of depth $D$ is $M$-covered if every block of $M$ consecutive agents collectively sees all raw features. Kearns, Roth, and Ryu proved that the excess mean squared error of the last agent on such a path is $O(M/\\sqrt D)$, and gave a cyclic instance with excess error $\u03a9(M/D)$ for $D\u003cM^2$. We close this gap: the correct rate is constant up to depth $M^2$, and $\u0398(M^2/D)$ beyond it. We first give a sharper analysis of the cyclic instance and improve its lower bound to $\u03a9(\\sqrt{M/D})$ for $D\u003cM^2$. We then construct, for every depth $D\\ge M^2$, an $M$-covered path of depth $D$ with excess error $\u03a9(M^2/D)$. The same instance gives the constant lower bound for all $D \u003c M^2$. We also show that for any fixed distribution the excess error contracts geometrically along the path, ruling out any single instance that witnesses any polynomial lower bound at every depth. Finally, we prove the same optimal rate for logistic classification in the logit-passing model of Bateni et al., which considers the binary cross-entropy (BCE) loss. The same improved upper bound of $O(M^2/D)$ holds, and we transfer all the regression lower bounds by showing that on those examples the logistic path follows the least-squares path up to rescaling.", "arxiv_id": "2609.05318", "arxiv_url": "https://arxiv.org/abs/2609.05318", "authors": ["MohammadHossein Bateni", "Zahra Hadizadeh", "MohammadTaghi Hajiaghayi", "Mahdi JafariRaviz", "Shayan Taherijam"], "brief": "\u672c\u6587\u7814\u7a76\u7f51\u7edc\u5316\u667a\u80fd\u4f53\u7684\u4fe1\u606f\u805a\u5408\uff1a\u6bcf\u4e2a\u667a\u80fd\u4f53\u53ea\u770b\u90e8\u5206\u7279\u5f81\u548c\u7236\u8282\u70b9\u9884\u6d4b\uff0c\u5e76\u53ea\u4f20\u9012\u81ea\u5df1\u7684\u7ed3\u8bba\u3002\u8bba\u6587\u95ed\u5408\u4e86\u5df2\u6709\u8bef\u5dee\u7387\u4e0a\u4e0b\u754c\u7f3a\u53e3\uff0c\u8bc1\u660e\u5728\u6df1\u5ea6\u5c0f\u4e8e M\u00b2 \u65f6\u8bef\u5dee\u4e3a\u5e38\u6570\u7ea7\uff0c\u8d85\u8fc7\u540e\u6700\u4f18\u901f\u7387\u4e3a \u0398(M\u00b2/D)\uff0c\u5e76\u5c06\u7ed3\u679c\u6269\u5c55\u5230\u903b\u8f91\u5206\u7c7b\u573a\u666f\u3002", "categories": ["cs.LG", "cs.GT", "econ.TH"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05318", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b66\u4e60", "\u4fe1\u606f\u805a\u5408", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05318v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Optimal Rates for Agentic Networked Information Aggregation", "tldr": "\u672c\u6587\u7814\u7a76\u7f51\u7edc\u5316\u667a\u80fd\u4f53\u7684\u4fe1\u606f\u805a\u5408\uff1a\u6bcf\u4e2a\u667a\u80fd\u4f53\u53ea\u770b\u90e8\u5206\u7279\u5f81\u548c\u7236\u8282\u70b9\u9884\u6d4b\uff0c\u5e76\u53ea\u4f20\u9012\u81ea\u5df1\u7684\u7ed3\u8bba\u3002\u8bba\u6587\u95ed\u5408\u4e86\u5df2\u6709\u8bef\u5dee\u7387\u4e0a\u4e0b\u754c\u7f3a\u53e3\uff0c\u8bc1\u660e\u5728\u6df1\u5ea6\u5c0f\u4e8e M\u00b2 \u65f6\u8bef\u5dee\u4e3a\u5e38\u6570\u7ea7\uff0c\u8d85\u8fc7\u540e\u6700\u4f18\u901f\u7387\u4e3a \u0398(M\u00b2/D)\uff0c\u5e76\u5c06\u7ed3\u679c\u6269\u5c55\u5230\u903b\u8f91\u5206\u7c7b\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern LLM agents operate in persistent workspaces whose accumulated history can exceed both GPU KV capacity and the model\u0027s native context window. Existing systems typically compact older context into summaries or retrieve it later as text, either losing fine-grained execution evidence or repeatedly prefilling content that the model has already processed. We present KVMem, a KV-context virtualization system that preserves overflowed workspace history as paged KV state across GPU memory, host memory, and NVMe. KVMem uses lightweight, model-native attention-space indexes to select relevant historical blocks and materializes a query-dependent execution view bounded by the model\u0027s native context window. Extensive evaluations on long-context agent benchmarks spanning histories up to one million tokens, including LongMemEval, MemoryAgentBench, and AgentLongBench, show that KVMem generally achieves higher task utility and greater inference efficiency than compaction-based approaches, the de facto standard for handling context overflow. In the DeepSWE long-context test with Qwen3.8-27B, KVMem improves task success from 43.8% with compaction-only context management to 48.4%. In our local-deployment evaluation, KVMem runs Qwen3.6/3.8-27B NVFP4 with MTP on an off-the-shelf laptop equipped with a 24\\,GB RTX 5090 Laptop GPU, virtualizing agent workspaces of up to 1M tokens-four times the model\u0027s native 256K-token context window. In a single-session setting, KVMem generates $\\sim$50 tokens/s, providing interactive responsiveness for local agent execution. More broadly, by decoupling addressable workspace size from the LLM\u0027s native context window, KVMem provides a practical path toward long-running agents whose workspaces can grow beyond that window.", "arxiv_id": "2609.04852", "arxiv_url": "https://arxiv.org/abs/2609.04852", "authors": ["Di Chai", "Leye Wang", "Zeshen Su", "Zhiguo Xia", "Zhihang Yu"], "brief": "KVMem \u63d0\u51fa\u4e00\u79cd KV \u4e0a\u4e0b\u6587\u865a\u62df\u5316\u7cfb\u7edf\uff0c\u5c06\u8d85\u51fa\u663e\u5b58\u548c\u539f\u751f\u4e0a\u4e0b\u6587\u7a97\u53e3\u7684\u667a\u80fd\u4f53\u5de5\u4f5c\u533a\u5386\u53f2\u4ee5\u5206\u9875 KV \u72b6\u6001\u4fdd\u5b58\u5728 GPU\u3001\u4e3b\u5b58\u548c NVMe \u4e2d\uff0c\u5e76\u6309\u67e5\u8be2\u9009\u62e9\u76f8\u5173\u5386\u53f2\u5757\u6784\u5efa\u6267\u884c\u89c6\u56fe\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u6458\u8981\u538b\u7f29\u7b49\u65b9\u6cd5\u901a\u5e38\u5e26\u6765\u66f4\u9ad8\u4efb\u52a1\u6548\u679c\u548c\u63a8\u7406\u6548\u7387\uff0c\u53ef\u5728\u6d88\u8d39\u7ea7 24GB GPU \u4e0a\u652f\u6301\u6700\u9ad8 100 \u4e07 token \u7684\u672c\u5730\u667a\u80fd\u4f53\u5de5\u4f5c\u533a\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04852", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u4e0a\u4e0b\u6587", "KV\u7f13\u5b58", "\u672c\u5730\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04852v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "KVMem: Virtualizing Million-Token Agent Workspaces on a Consumer GPU", "tldr": "KVMem \u63d0\u51fa\u4e00\u79cd KV \u4e0a\u4e0b\u6587\u865a\u62df\u5316\u7cfb\u7edf\uff0c\u5c06\u8d85\u51fa\u663e\u5b58\u548c\u539f\u751f\u4e0a\u4e0b\u6587\u7a97\u53e3\u7684\u667a\u80fd\u4f53\u5de5\u4f5c\u533a\u5386\u53f2\u4ee5\u5206\u9875 KV \u72b6\u6001\u4fdd\u5b58\u5728 GPU\u3001\u4e3b\u5b58\u548c NVMe \u4e2d\uff0c\u5e76\u6309\u67e5\u8be2\u9009\u62e9\u76f8\u5173\u5386\u53f2\u5757\u6784\u5efa\u6267\u884c\u89c6\u56fe\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u6458\u8981\u538b\u7f29\u7b49\u65b9\u6cd5\u901a\u5e38\u5e26\u6765\u66f4\u9ad8\u4efb\u52a1\u6548\u679c\u548c\u63a8\u7406\u6548\u7387\uff0c\u53ef\u5728\u6d88\u8d39\u7ea7 24GB GPU \u4e0a\u652f\u6301\u6700\u9ad8 100 \u4e07 token \u7684\u672c\u5730\u667a\u80fd\u4f53\u5de5\u4f5c\u533a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Prefix caching, in which a serving engine reuses the key and value tensors of a shared prompt prefix across requests, is enabled by default in the major open-source stacks and treated as a transparent optimization. We measure what it costs in reproducibility, and find that the cost rises sharply with weight quantization. Holding the model, decoding parameters, seed, and request order fixed, and issuing every request serially at batch size one, we ran an eighty-episode multi-turn agentic tool-use workload with caching enabled and disabled across two engines and four weight formats. Enabling the cache changed the agent\u0027s trajectory on 36.2 percent of episodes at 16-bit precision and on 75.0 percent at four-bit, a gradient that survives re-measurement under a controlled cache configuration. With caching disabled, repeated execution was bit-identical in every configuration, 0 of 800 episodes, which bounds other sources of nondeterminism at 0.5 percent. Repeated cache-enabled runs did diverge, and three experiments locate the cause: a single server-level prompt-cache setting moves run-to-run divergence by 37.5 percentage points, execution order acts only while that setting is active, and restoring cache state makes the cached and recompute paths each reproduce on 40 of 40 items while still differing from each other on 14. Cached serving is deterministic given cache state, and irreproducible in practice because that state is absent from the request and never reset by default. A single-turn bridge shows the divergence reaching task outcomes without shifting aggregate accuracy. We release the harness, logs, and analysis pipeline.", "arxiv_id": "2609.04748", "arxiv_url": "https://arxiv.org/abs/2609.04748", "authors": ["Aditi Patodiya"], "brief": "\u8bba\u6587\u7814\u7a76 LLM \u670d\u52a1\u4e2d\u7684\u524d\u7f00\u7f13\u5b58\u5bf9\u53ef\u590d\u73b0\u6027\u7684\u5f71\u54cd\uff0c\u53d1\u73b0\u5373\u4f7f\u6a21\u578b\u3001\u79cd\u5b50\u3001\u89e3\u7801\u53c2\u6570\u548c\u8bf7\u6c42\u987a\u5e8f\u56fa\u5b9a\uff0c\u5f00\u542f\u7f13\u5b58\u4e5f\u4f1a\u5bfc\u81f4\u8f93\u51fa\u8f68\u8ff9\u53d8\u5316\uff0c\u4e14\u6743\u91cd\u91cf\u5316\u4f1a\u663e\u8457\u653e\u5927\u8fd9\u79cd\u5dee\u5f02\u3002\u5b9e\u9a8c\u663e\u793a 16-bit \u4e0b\u667a\u80fd\u4f53\u4efb\u52a1\u8f68\u8ff9\u6709 36.2% \u53d1\u751f\u53d8\u5316\uff0c4-bit \u4e0b\u5347\u81f3 75.0%\uff1b\u5173\u95ed\u7f13\u5b58\u5219\u5b8c\u5168\u53ef\u590d\u73b0\uff0c\u8bf4\u660e\u95ee\u9898\u4e3b\u8981\u6765\u81ea\u672a\u663e\u5f0f\u7ba1\u7406\u7684\u7f13\u5b58\u72b6\u6001\u3002", "categories": ["cs.SE", "cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04748", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u670d\u52a1", "\u91cf\u5316", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04748v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Same Request, Different Answer: Quantization Amplifies Cache-Induced Divergence in LLM Serving", "tldr": "\u8bba\u6587\u7814\u7a76 LLM \u670d\u52a1\u4e2d\u7684\u524d\u7f00\u7f13\u5b58\u5bf9\u53ef\u590d\u73b0\u6027\u7684\u5f71\u54cd\uff0c\u53d1\u73b0\u5373\u4f7f\u6a21\u578b\u3001\u79cd\u5b50\u3001\u89e3\u7801\u53c2\u6570\u548c\u8bf7\u6c42\u987a\u5e8f\u56fa\u5b9a\uff0c\u5f00\u542f\u7f13\u5b58\u4e5f\u4f1a\u5bfc\u81f4\u8f93\u51fa\u8f68\u8ff9\u53d8\u5316\uff0c\u4e14\u6743\u91cd\u91cf\u5316\u4f1a\u663e\u8457\u653e\u5927\u8fd9\u79cd\u5dee\u5f02\u3002\u5b9e\u9a8c\u663e\u793a 16-bit \u4e0b\u667a\u80fd\u4f53\u4efb\u52a1\u8f68\u8ff9\u6709 36.2% \u53d1\u751f\u53d8\u5316\uff0c4-bit \u4e0b\u5347\u81f3 75.0%\uff1b\u5173\u95ed\u7f13\u5b58\u5219\u5b8c\u5168\u53ef\u590d\u73b0\uff0c\u8bf4\u660e\u95ee\u9898\u4e3b\u8981\u6765\u81ea\u672a\u663e\u5f0f\u7ba1\u7406\u7684\u7f13\u5b58\u72b6\u6001\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Data-sovereignty regulations increasingly require public institutions to deploy open-source, on-premise LLM agents that chain multiple tool-calls across live government APIs. However, open-source models consistently underperform in this multi-step setting, and no existing benchmark measures the gap. We introduce the Korean Open Public API Benchmark (KOPA-Bench), comprising 145 real-world tasks. To close this gap, we present EDGE, an Execution-grounded Dynamic Graph for tool-calling data synthEsis driven by live execution. EDGE builds a graph of how each tool\u0027s output can feed another\u0027s input, keeps only the links that succeed when actually called against the live APIs, and traverses these verified links to synthesize executable multi-step trajectories. Fine-tuned via GRPO on the resulting dataset, our 9B model nearly matches the untuned 27B model from the same family, improving substantially not only on KOPA-Bench but also on the BFCL benchmark.", "arxiv_id": "2609.05395", "arxiv_url": "https://arxiv.org/abs/2609.05395", "authors": ["Dain Kim", "Eungi Cho", "Kyumin Kim", "Shinyeong Noh", "Kyuseong Lim"], "brief": "\u63d0\u51fa KOPA-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5f00\u6e90\u672c\u5730 LLM \u667a\u80fd\u4f53\u5728\u97e9\u56fd\u516c\u5171\u5f00\u653e API \u4e0a\u7684\u591a\u6b65\u5de5\u5177\u8c03\u7528\u80fd\u529b\uff0c\u5305\u542b 145 \u4e2a\u771f\u5b9e\u4efb\u52a1\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa EDGE\uff0c\u901a\u8fc7\u771f\u5b9e\u6267\u884c\u9a8c\u8bc1\u5de5\u5177\u95f4\u8f93\u5165\u8f93\u51fa\u94fe\u63a5\u5e76\u5408\u6210\u53ef\u6267\u884c\u8f68\u8ff9\uff0c\u7528 GRPO \u5fae\u8c03\u540e 9B \u6a21\u578b\u63a5\u8fd1\u540c\u7cfb\u5217\u672a\u8c03\u4f18 27B \u6a21\u578b\uff0c\u5e76\u5728 KOPA-Bench \u548c BFCL \u4e0a\u5747\u663e\u8457\u63d0\u5347\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05395", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u6570\u636e\u5408\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05395v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Multi-Step Tool-Calling over Korean Open Public APIs: A Benchmark and a Data-Synthesis Recipe", "tldr": "\u63d0\u51fa KOPA-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5f00\u6e90\u672c\u5730 LLM \u667a\u80fd\u4f53\u5728\u97e9\u56fd\u516c\u5171\u5f00\u653e API \u4e0a\u7684\u591a\u6b65\u5de5\u5177\u8c03\u7528\u80fd\u529b\uff0c\u5305\u542b 145 \u4e2a\u771f\u5b9e\u4efb\u52a1\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa EDGE\uff0c\u901a\u8fc7\u771f\u5b9e\u6267\u884c\u9a8c\u8bc1\u5de5\u5177\u95f4\u8f93\u5165\u8f93\u51fa\u94fe\u63a5\u5e76\u5408\u6210\u53ef\u6267\u884c\u8f68\u8ff9\uff0c\u7528 GRPO \u5fae\u8c03\u540e 9B \u6a21\u578b\u63a5\u8fd1\u540c\u7cfb\u5217\u672a\u8c03\u4f18 27B \u6a21\u578b\uff0c\u5e76\u5728 KOPA-Bench \u548c BFCL \u4e0a\u5747\u663e\u8457\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) models have shown promising progress in language-conditioned robotic manipulation. However, existing datasets and benchmarks mainly evaluate task completion under predefined settings, offering limited insight into model reasoning under increasing spatial and procedural complexity. We introduce \\textbf{RoboSPA} (\\textbf{Robo}t \\textbf{S}patial-\\textbf{P}rocedural \\textbf{A}ssessment), a large-scale robotic manipulation dataset and benchmark for diagnosing embodied reasoning in VLA models. \\texttt{RoboSPA} focuses on two core dimensions, Fine-Grained Spatial Reasoning and Long-Horizon Procedural Planning, covering 10 task categories and 56 base tasks. Each task is instantiated across five difficulty levels, yielding 280 variants with increasing spatial ambiguity and procedural complexity. We collect 527K trajectories across multiple embodiments and diverse scenes. Beyond binary success rate, \\texttt{RoboSPA} introduces diagnostic metrics for more detailed evaluation. Experiments on representative VLA models show that current systems still struggle with complex spatial relations, precise low-level execution, and memory-intensive planning. These results establish \\texttt{RoboSPA} as a challenging diagnostic benchmark for developing more capable, reliable, and generalizable embodied agents. Our data and code are available at https://github.com/fanzhenxuan/RoboSPA.", "arxiv_id": "2609.05324", "arxiv_url": "https://arxiv.org/abs/2609.05324", "authors": ["Zhenxuan Fan", "Bo Zhang", "Yutong Lin", "Yuqian Yuan", "Juekai Lin", "Liang Liang", "Zhuoyi Huang", "Wenqiao Zhang", "Juncheng Li", "Siliang Tang", "Jun Xiao", "Yueting Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa RoboSPA\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u6570\u636e\u96c6\u4e0e\u8bca\u65ad\u57fa\u51c6\uff0c\u91cd\u70b9\u8bc4\u4f30\u7ec6\u7c92\u5ea6\u7a7a\u95f4\u63a8\u7406\u548c\u957f\u7a0b\u7a0b\u5e8f\u89c4\u5212\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b 10 \u7c7b\u4efb\u52a1\u300156 \u4e2a\u57fa\u7840\u4efb\u52a1\u3001280 \u4e2a\u96be\u5ea6\u53d8\u4f53\u548c 52.7 \u4e07\u6761\u8f68\u8ff9\uff0c\u5b9e\u9a8c\u663e\u793a\u73b0\u6709 VLA \u6a21\u578b\u5728\u590d\u6742\u7a7a\u95f4\u5173\u7cfb\u3001\u7cbe\u7ec6\u6267\u884c\u548c\u8bb0\u5fc6\u5bc6\u96c6\u578b\u89c4\u5212\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05324", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05324v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RoboSPA: Can VLA Models Go Beyond Simple Scenes and Short-Horizon Tasks?", "tldr": "\u8bba\u6587\u63d0\u51fa RoboSPA\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u6570\u636e\u96c6\u4e0e\u8bca\u65ad\u57fa\u51c6\uff0c\u91cd\u70b9\u8bc4\u4f30\u7ec6\u7c92\u5ea6\u7a7a\u95f4\u63a8\u7406\u548c\u957f\u7a0b\u7a0b\u5e8f\u89c4\u5212\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b 10 \u7c7b\u4efb\u52a1\u300156 \u4e2a\u57fa\u7840\u4efb\u52a1\u3001280 \u4e2a\u96be\u5ea6\u53d8\u4f53\u548c 52.7 \u4e07\u6761\u8f68\u8ff9\uff0c\u5b9e\u9a8c\u663e\u793a\u73b0\u6709 VLA \u6a21\u578b\u5728\u590d\u6742\u7a7a\u95f4\u5173\u7cfb\u3001\u7cbe\u7ec6\u6267\u884c\u548c\u8bb0\u5fc6\u5bc6\u96c6\u578b\u89c4\u5212\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hyper-Connections and their manifold-constrained variant mHC widen a residual pathway from one stream to n, yet how trained models use this capacity remains unclear: how broadly blocks read and write, how strongly the residual pathway mixes streams, and whether the streams carry distinct representations. We examine these properties in the four-stream residual pathway of DeepSeek-V4-Flash using effective stream counts, cross-stream residual weights, and inter-stream cosine similarity. Read/write routing is concentrated but varies across depth: a typical attention or FFN site effectively uses about two streams, while the dominant stream changes across layers and the representations remain directionally distinct. Residual mixing is modest and occurs primarily in early layers; in layers 22-42, the pathway mostly carries each stream forward separately. Targeted interventions establish the functional significance of these patterns. Replacing the late mixers by identity increases C4 perplexity by only 1.9% and preserves the six-task average score, whereas replacing the early mixers increases perplexity by 41%. Fixing each early mixer to its C4 diagnostic mean increases perplexity by only 0.2% and reduces the average score by 0.25 percentage points, showing that its site-specific structure matters more than its token-wise variation on the evaluated metrics. Likewise, retaining the three largest routing weights per token at every site increases perplexity by at most 2.7% and changes the average score by at most 0.4 points. Thus, the studied model realizes only part of the flexibility afforded by four-stream mHC: individual blocks rarely require all four streams, and late residual mixing provides little measured benefit.", "arxiv_id": "2609.05309", "arxiv_url": "https://arxiv.org/abs/2609.05309", "authors": ["Pengxiang Zhao", "Xing Li", "Xianzhi Yu", "Wei Guo", "Zhenhua Dong"], "brief": "\u8bba\u6587\u5206\u6790\u4e86 DeepSeek-V4-Flash \u4e2d\u56db\u6d41 mHC \u6b8b\u5dee\u8def\u5f84\u7684\u5b9e\u9645\u4f7f\u7528\u65b9\u5f0f\uff0c\u53d1\u73b0\u6ce8\u610f\u529b\u548c FFN \u901a\u5e38\u53ea\u6709\u6548\u4f7f\u7528\u7ea6\u4e24\u4e2a\u6d41\uff0c\u4e14\u4e0d\u540c\u5c42\u7684\u4e3b\u5bfc\u6d41\u4f1a\u53d8\u5316\uff0c\u6d41\u4e4b\u95f4\u8868\u793a\u4ecd\u4fdd\u6301\u5dee\u5f02\u3002\u5e72\u9884\u5b9e\u9a8c\u663e\u793a\u65e9\u671f\u6b8b\u5dee\u6df7\u5408\u5f88\u91cd\u8981\uff0c\u800c\u540e\u671f\u6df7\u5408\u63a5\u8fd1\u6052\u7b49\u3001\u6536\u76ca\u5f88\u5c0f\uff0c\u8bf4\u660e\u56db\u6d41 mHC \u7684\u7075\u6d3b\u6027\u53ea\u88ab\u90e8\u5206\u5229\u7528\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05309", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6b8b\u5dee\u8fde\u63a5", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5206\u6790", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05309v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Does mHC Use Its Residual Streams? Selective Routing and Near-Identity Mixing", "tldr": "\u8bba\u6587\u5206\u6790\u4e86 DeepSeek-V4-Flash \u4e2d\u56db\u6d41 mHC \u6b8b\u5dee\u8def\u5f84\u7684\u5b9e\u9645\u4f7f\u7528\u65b9\u5f0f\uff0c\u53d1\u73b0\u6ce8\u610f\u529b\u548c FFN \u901a\u5e38\u53ea\u6709\u6548\u4f7f\u7528\u7ea6\u4e24\u4e2a\u6d41\uff0c\u4e14\u4e0d\u540c\u5c42\u7684\u4e3b\u5bfc\u6d41\u4f1a\u53d8\u5316\uff0c\u6d41\u4e4b\u95f4\u8868\u793a\u4ecd\u4fdd\u6301\u5dee\u5f02\u3002\u5e72\u9884\u5b9e\u9a8c\u663e\u793a\u65e9\u671f\u6b8b\u5dee\u6df7\u5408\u5f88\u91cd\u8981\uff0c\u800c\u540e\u671f\u6df7\u5408\u63a5\u8fd1\u6052\u7b49\u3001\u6536\u76ca\u5f88\u5c0f\uff0c\u8bf4\u660e\u56db\u6d41 mHC \u7684\u7075\u6d3b\u6027\u53ea\u88ab\u90e8\u5206\u5229\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated reference-based evaluation methods play a critical role in assessing natural language generation systems. Existing meta-evaluation primarily measures agreement with human judgments or benchmark labels, providing limited insight into evaluator behavior under controlled conditions. We introduce behavioral correctness assumptions, a complementary framework for evaluating reference-based automatic evaluation methods. We define a taxonomy of correctness-preserving and correctness-altering assumptions and operationalize them through controlled response transformations that specify expected scoring behaviors. We evaluate diverse lexical, character-level, semantic, LLM-based, and hybrid evaluators and analyze their assumption-level behavior, stability, sensitivity, repeat-run variability, configuration sensitivity, and reproducibility. Our experiments reveal distinct behavioral trade-offs across evaluation paradigms: no evaluator satisfies all proposed correctness assumptions, and evaluators with similar aggregate performance can exhibit substantially different behavioral profiles. These findings demonstrate that behavioral correctness assumptions provide diagnostic information obscured by conventional aggregate meta-evaluation.", "arxiv_id": "2609.05289", "arxiv_url": "https://arxiv.org/abs/2609.05289", "authors": ["Maria Mahbub", "Ashley Rice", "Michael R. Munroe", "Amidu Kamara", "Amir Sadovnik"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u884c\u4e3a\u6b63\u786e\u6027\u5047\u8bbe\u201d\u6846\u67b6\uff0c\u7528\u53d7\u63a7\u7684\u56de\u7b54\u53d8\u6362\u6765\u8bca\u65ad\u57fa\u4e8e\u53c2\u8003\u7b54\u6848\u7684\u81ea\u52a8\u8bc4\u6d4b\u65b9\u6cd5\u5728\u4e0d\u540c\u6761\u4ef6\u4e0b\u662f\u5426\u7ed9\u51fa\u7b26\u5408\u9884\u671f\u7684\u5206\u6570\u3002\u5b9e\u9a8c\u8986\u76d6\u8bcd\u9762\u3001\u5b57\u7b26\u7ea7\u3001\u8bed\u4e49\u3001LLM \u4e0e\u6df7\u5408\u8bc4\u6d4b\u5668\uff0c\u53d1\u73b0\u6ca1\u6709\u8bc4\u6d4b\u5668\u6ee1\u8db3\u6240\u6709\u5047\u8bbe\uff0c\u4e14\u603b\u5206\u76f8\u8fd1\u7684\u65b9\u6cd5\u53ef\u80fd\u6709\u622a\u7136\u4e0d\u540c\u7684\u884c\u4e3a\u5f31\u70b9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05289", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u8bc4\u6d4b", "\u81ea\u7136\u8bed\u8a00\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5143\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05289v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Aggregate Scores: Behavioral Correctness Assumptions for Assessing Reference-Based Automatic Evaluation Methods", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u884c\u4e3a\u6b63\u786e\u6027\u5047\u8bbe\u201d\u6846\u67b6\uff0c\u7528\u53d7\u63a7\u7684\u56de\u7b54\u53d8\u6362\u6765\u8bca\u65ad\u57fa\u4e8e\u53c2\u8003\u7b54\u6848\u7684\u81ea\u52a8\u8bc4\u6d4b\u65b9\u6cd5\u5728\u4e0d\u540c\u6761\u4ef6\u4e0b\u662f\u5426\u7ed9\u51fa\u7b26\u5408\u9884\u671f\u7684\u5206\u6570\u3002\u5b9e\u9a8c\u8986\u76d6\u8bcd\u9762\u3001\u5b57\u7b26\u7ea7\u3001\u8bed\u4e49\u3001LLM \u4e0e\u6df7\u5408\u8bc4\u6d4b\u5668\uff0c\u53d1\u73b0\u6ca1\u6709\u8bc4\u6d4b\u5668\u6ee1\u8db3\u6240\u6709\u5047\u8bbe\uff0c\u4e14\u603b\u5206\u76f8\u8fd1\u7684\u65b9\u6cd5\u53ef\u80fd\u6709\u622a\u7136\u4e0d\u540c\u7684\u884c\u4e3a\u5f31\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent years have witnessed great advances in the reasoning ability of Large Language Models (LLMs). However, the reasoning processes of LLMs often exhibit uncertainty, where LLMs often produce a proliferation of divergent branches at each reasoning step even when fed the same prompting inputs, and certain branches exhibit evidently incredible, even nonsensical, reasoning chains and results. In this paper, we propose the Graph-complexity-based UncerTainty (GUT) method for investigating the reasoning uncertainty of LLMs. The key idea of GUT is to characterize the potential branches of each reasoning chain with a directed acyclic graph, thereby ensuring that all potential branches are comprehensively covered within the graph space. Building upon this recognition, we further build two modules of GUT, that is, a Quantification (GUT-Q) module and an Optimization (GUT-O) module, for quantifying and reducing the reasoning uncertainty of LLMs, respectively. GUT-Q measures LLM reasoning uncertainty by approximating the reasoning space complexity with graph complexity. GUT-O implements uncertainty optimization by treating negative uncertainty as the reward function in reinforcement learning. Experimental results conducted on four LLMs and five datasets validate the effectiveness of GUT.", "arxiv_id": "2609.05284", "arxiv_url": "https://arxiv.org/abs/2609.05284", "authors": ["Shuang Liang", "Xin-Yu Hu", "Xiang-Jun Ou", "Shao-Qun Zhang"], "brief": "\u672c\u6587\u63d0\u51fa GUT \u65b9\u6cd5\uff0c\u7528\u6709\u5411\u65e0\u73af\u56fe\u523b\u753b\u5927\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u8fc7\u7a0b\u4e2d\u53ef\u80fd\u5206\u53c9\u7684\u63a8\u7406\u7a7a\u95f4\uff0c\u5e76\u901a\u8fc7\u56fe\u590d\u6742\u5ea6\u91cf\u5316\u63a8\u7406\u4e0d\u786e\u5b9a\u6027\u3002\u8fdb\u4e00\u6b65\u8bbe\u8ba1 GUT-Q \u8fdb\u884c\u4e0d\u786e\u5b9a\u6027\u8bc4\u4f30\u3001GUT-O \u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u4ee5\u8d1f\u4e0d\u786e\u5b9a\u6027\u4e3a\u5956\u52b1\u6765\u964d\u4f4e\u4e0d\u7a33\u5b9a\u63a8\u7406\uff0c\u57284\u4e2a\u6a21\u578b\u548c5\u4e2a\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u6709\u6548\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05284", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u4e0d\u786e\u5b9a\u6027", "\u56fe\u590d\u6742\u5ea6", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05284v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GUT: Quantifying and Optimizing the Reasoning Uncertainty of LLMs via Graph Complexity", "tldr": "\u672c\u6587\u63d0\u51fa GUT \u65b9\u6cd5\uff0c\u7528\u6709\u5411\u65e0\u73af\u56fe\u523b\u753b\u5927\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u8fc7\u7a0b\u4e2d\u53ef\u80fd\u5206\u53c9\u7684\u63a8\u7406\u7a7a\u95f4\uff0c\u5e76\u901a\u8fc7\u56fe\u590d\u6742\u5ea6\u91cf\u5316\u63a8\u7406\u4e0d\u786e\u5b9a\u6027\u3002\u8fdb\u4e00\u6b65\u8bbe\u8ba1 GUT-Q \u8fdb\u884c\u4e0d\u786e\u5b9a\u6027\u8bc4\u4f30\u3001GUT-O \u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u4ee5\u8d1f\u4e0d\u786e\u5b9a\u6027\u4e3a\u5956\u52b1\u6765\u964d\u4f4e\u4e0d\u7a33\u5b9a\u63a8\u7406\uff0c\u57284\u4e2a\u6a21\u578b\u548c5\u4e2a\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial intelligence (AI) is transforming not only what information systems researchers design, but also how design research is conducted. Yet existing literature offers limited guidance for computational design science (CDS) when AI actively participates in problem formulation, resource construction, design search, evaluation, and knowledge abstraction. We develop AI for Computational Design Science (AI4CDS), a five-phase methodological
