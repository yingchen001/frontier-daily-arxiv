 framework in which AI expands problem and design search while researchers retain responsibility for domain grounding, admissibility, verification, and scientific judgment. Collaboration is governed by graduated trust, reversibility, auditability, and differentiated reproducibility. We instantiate AI4CDS through ChildRiskGuard, an interpretable artifact for detecting short-form videos inappropriate for children, while documenting AI interactions, rejected alternatives, corrections, and audit trails. The case translates audience-dependent safety and explanation faithfulness into three technical challenges and develops an artifact that separates generic from child-specific risk, represents distinct developmental-risk mechanisms, and makes concept-level explanations part of the predictive computation. ChildRiskGuard achieves an F1 score of 0.769, substantially outperforming direct application of a general-purpose content-safety model while remaining competitive with strong benchmarks. The primary contribution is AI4CDS as a responsible framework for AI-enabled CDS; ChildRiskGuard provides process and artifact evidence of how AI-expanded, researcher-governed design can generate and evaluate novel computational design knowledge.", "arxiv_id": "2609.05270", "arxiv_url": "https://arxiv.org/abs/2609.05270", "authors": ["Wenli Zhang", "Jiaheng Xie", "Zhihe Pan", "Yidong Chai", "Xiao Fang", "Sudha Ram"], "brief": "\u8bba\u6587\u63d0\u51fa AI4CDS\uff0c\u4e00\u4e2a\u9762\u5411\u8ba1\u7b97\u8bbe\u8ba1\u79d1\u5b66\u7684\u8d1f\u8d23\u4efb\u4eba\u673a\u534f\u4f5c\u6846\u67b6\uff0c\u8986\u76d6\u95ee\u9898\u5b9a\u4e49\u3001\u8d44\u6e90\u6784\u5efa\u3001\u8bbe\u8ba1\u641c\u7d22\u3001\u8bc4\u4f30\u4e0e\u77e5\u8bc6\u62bd\u8c61\uff0c\u5e76\u5f3a\u8c03\u7814\u7a76\u8005\u4e3b\u5bfc\u3001\u53ef\u5ba1\u8ba1\u4e0e\u53ef\u590d\u73b0\u3002\u4f5c\u8005\u4ee5\u77ed\u89c6\u9891\u513f\u7ae5\u5b89\u5168\u68c0\u6d4b\u7cfb\u7edf ChildRiskGuard \u4e3a\u6848\u4f8b\uff0c\u53d6\u5f97 F1=0.769\uff0c\u660e\u663e\u4f18\u4e8e\u76f4\u63a5\u4f7f\u7528\u901a\u7528\u5185\u5bb9\u5b89\u5168\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05270", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u673a\u534f\u4f5c", "\u8ba1\u7b97\u8bbe\u8ba1", "\u5185\u5bb9\u5b89\u5168", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05270v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AI for Computational Design Science: A Responsible Human-AI Framework and Case Study on Short-Form Video Safety Surveillance", "tldr": "\u8bba\u6587\u63d0\u51fa AI4CDS\uff0c\u4e00\u4e2a\u9762\u5411\u8ba1\u7b97\u8bbe\u8ba1\u79d1\u5b66\u7684\u8d1f\u8d23\u4efb\u4eba\u673a\u534f\u4f5c\u6846\u67b6\uff0c\u8986\u76d6\u95ee\u9898\u5b9a\u4e49\u3001\u8d44\u6e90\u6784\u5efa\u3001\u8bbe\u8ba1\u641c\u7d22\u3001\u8bc4\u4f30\u4e0e\u77e5\u8bc6\u62bd\u8c61\uff0c\u5e76\u5f3a\u8c03\u7814\u7a76\u8005\u4e3b\u5bfc\u3001\u53ef\u5ba1\u8ba1\u4e0e\u53ef\u590d\u73b0\u3002\u4f5c\u8005\u4ee5\u77ed\u89c6\u9891\u513f\u7ae5\u5b89\u5168\u68c0\u6d4b\u7cfb\u7edf ChildRiskGuard \u4e3a\u6848\u4f8b\uff0c\u53d6\u5f97 F1=0.769\uff0c\u660e\u663e\u4f18\u4e8e\u76f4\u63a5\u4f7f\u7528\u901a\u7528\u5185\u5bb9\u5b89\u5168\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly used to formulate optimization models from natural-language problem descriptions, yet realistic operations research (OR) requests are often incomplete: missing objectives, constraints, or business rules can change the resulting mathematical program. Existing evaluations largely assume a complete specification and therefore overlook whether an agent knows when clarification is needed before modeling. We introduce OR-Clarify, a benchmark for pre-formulation clarification. Each task presents a partial public problem description, withholds structured hidden slots, and evaluates agents through bounded interaction with a simulated user. The benchmark supports both openended and choice-based clarification, and measures slot recovery, stopping behavior, silent assumptions, and interaction cost. We further propose Interactive Optimization (InterOPT), a two-stage framework that identifies unresolved formulation-critical gaps and uses them to guide whether to ask the next question or to stop. In our choice-based experiments, InterOPT substantially outperforms all baselines in exact slot recovery; in the open-ended setting, it remains competitive with strong prior methods. Together, OR-Clarify and InterOPT reframe OR assistance as a selective completeness decision: clarify when needed, stop when ready, and quantify what remains missing.", "arxiv_id": "2609.05258", "arxiv_url": "https://arxiv.org/abs/2609.05258", "authors": ["Sihan Ge", "Yichen Lin", "Chenyu Zhou", "Jianghao Lin", "Tao Yao", "Dongdong Ge"], "brief": "\u672c\u6587\u63d0\u51fa OR-Clarify \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4f18\u5316\u5efa\u6a21\u524d\u662f\u5426\u80fd\u8bc6\u522b\u4fe1\u606f\u7f3a\u53e3\u5e76\u4e3b\u52a8\u6f84\u6e05\uff0c\u800c\u4e0d\u662f\u76f4\u63a5\u505a\u9759\u9ed8\u5047\u8bbe\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa InterOPT \u4e24\u9636\u6bb5\u6846\u67b6\uff0c\u5728\u9009\u62e9\u5f0f\u6f84\u6e05\u4e2d\u663e\u8457\u63d0\u5347\u9690\u85cf\u69fd\u4f4d\u7cbe\u786e\u6062\u590d\u7387\uff0c\u5728\u5f00\u653e\u5f0f\u573a\u666f\u4e2d\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["math.OC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05258", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4f18\u5316\u5efa\u6a21", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4ea4\u4e92\u5f0f\u6f84\u6e05"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05258v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ask Before You Optimize: Dynamic Pre-Formulation Clarification for Interactive Optimization", "tldr": "\u672c\u6587\u63d0\u51fa OR-Clarify \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4f18\u5316\u5efa\u6a21\u524d\u662f\u5426\u80fd\u8bc6\u522b\u4fe1\u606f\u7f3a\u53e3\u5e76\u4e3b\u52a8\u6f84\u6e05\uff0c\u800c\u4e0d\u662f\u76f4\u63a5\u505a\u9759\u9ed8\u5047\u8bbe\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa InterOPT \u4e24\u9636\u6bb5\u6846\u67b6\uff0c\u5728\u9009\u62e9\u5f0f\u6f84\u6e05\u4e2d\u663e\u8457\u63d0\u5347\u9690\u85cf\u69fd\u4f4d\u7cbe\u786e\u6062\u590d\u7387\uff0c\u5728\u5f00\u653e\u5f0f\u573a\u666f\u4e2d\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Commonsense reasoning in computer vision encompasses integrating visual data and contextual knowledge, crucial for enhancing AI\u0027s understanding of everyday scenarios. This understanding not only improves machine learning models but also enhances their ability to interact meaningfully with humans and the environment. Unlike CNN-based conventional vision models, which are designed to identify objects within a specific image, incorporating commonsense knowledge enables models to interpret scenes in a more holistic manner, thereby improving their spatial ability to reason about relationships among objects and actions. This integration not only enhances object recognition but also facilitates a deeper understanding of the contextual factors, ultimately leading to more precise predictions and interactions in real-world applications. This paper presents a comprehensive survey of recent developments that integrate commonsense knowledge into computer vision tasks. We systematically review approaches based on knowledge graphs, scene graphs, neuro-symbolic models, and commonsense-augmented transformers. We also outline current limitations related to dataset bias, knowledge incompleteness, and integration challenges. Finally, we highlight prospective research trajectories in cross-modal reasoning, scalable commonsense knowledge injection, and neuro-symbolic hybrid architectures to develop truly intelligent visual systems.", "arxiv_id": "2609.05257", "arxiv_url": "https://arxiv.org/abs/2609.05257", "authors": ["Bahar Uddin Mahmud", "Sumit Barua", "Guan Yue Hong", "Ajay Gupta", "Hexu Liu"], "brief": "\u672c\u6587\u7efc\u8ff0\u4e86\u5e38\u8bc6\u63a8\u7406\u5728\u8ba1\u7b97\u673a\u89c6\u89c9\u4e2d\u7684\u57fa\u7840\u3001\u8fd1\u671f\u8fdb\u5c55\u4e0e\u672a\u6765\u65b9\u5411\uff0c\u91cd\u70b9\u8ba8\u8bba\u5982\u4f55\u5c06\u89c6\u89c9\u6570\u636e\u4e0e\u4e0a\u4e0b\u6587/\u5e38\u8bc6\u77e5\u8bc6\u7ed3\u5408\u4ee5\u63d0\u5347\u573a\u666f\u7406\u89e3\u3001\u7269\u4f53\u5173\u7cfb\u63a8\u7406\u548c\u771f\u5b9e\u73af\u5883\u4ea4\u4e92\u80fd\u529b\u3002\u6587\u7ae0\u7cfb\u7edf\u68b3\u7406\u4e86\u77e5\u8bc6\u56fe\u8c31\u3001\u573a\u666f\u56fe\u3001\u795e\u7ecf\u7b26\u53f7\u6a21\u578b\u548c\u5e38\u8bc6\u589e\u5f3a Transformer \u7b49\u65b9\u6cd5\uff0c\u5e76\u6307\u51fa\u6570\u636e\u504f\u5dee\u3001\u77e5\u8bc6\u4e0d\u5b8c\u6574\u4e0e\u878d\u5408\u56f0\u96be\u7b49\u6311\u6218\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05257", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5e38\u8bc6\u63a8\u7406", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u77e5\u8bc6\u56fe\u8c31", "\u795e\u7ecf\u7b26\u53f7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05257v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Commonsense Reasoning in Computer Vision: Foundations, Recent Advancements, and Future Directions", "tldr": "\u672c\u6587\u7efc\u8ff0\u4e86\u5e38\u8bc6\u63a8\u7406\u5728\u8ba1\u7b97\u673a\u89c6\u89c9\u4e2d\u7684\u57fa\u7840\u3001\u8fd1\u671f\u8fdb\u5c55\u4e0e\u672a\u6765\u65b9\u5411\uff0c\u91cd\u70b9\u8ba8\u8bba\u5982\u4f55\u5c06\u89c6\u89c9\u6570\u636e\u4e0e\u4e0a\u4e0b\u6587/\u5e38\u8bc6\u77e5\u8bc6\u7ed3\u5408\u4ee5\u63d0\u5347\u573a\u666f\u7406\u89e3\u3001\u7269\u4f53\u5173\u7cfb\u63a8\u7406\u548c\u771f\u5b9e\u73af\u5883\u4ea4\u4e92\u80fd\u529b\u3002\u6587\u7ae0\u7cfb\u7edf\u68b3\u7406\u4e86\u77e5\u8bc6\u56fe\u8c31\u3001\u573a\u666f\u56fe\u3001\u795e\u7ecf\u7b26\u53f7\u6a21\u578b\u548c\u5e38\u8bc6\u589e\u5f3a Transformer \u7b49\u65b9\u6cd5\uff0c\u5e76\u6307\u51fa\u6570\u636e\u504f\u5dee\u3001\u77e5\u8bc6\u4e0d\u5b8c\u6574\u4e0e\u878d\u5408\u56f0\u96be\u7b49\u6311\u6218\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present a unified reinforcement-learning (RL) framework that discovers compact parametrized quantum circuits (PQCs) for data-scarce device modeling. A graph neural network (GNN) policy optimized by proximal policy optimization (PPO) searches circuit architectures using leave-one-group-out cross-validation (LOGOCV) error on held-out process or geometry groups as the reward. The framework achieves the lowest mean absolute error (MAE) on all 11 targets versus six classical baselines, with 59% lower error (Ioff) and 81% tighter fold variability (VTH) for HEMTs and 84% lower error (VTH, SS, Ioff) and 82% tighter fold variability (Ioff) for NWFETs. These results demonstrate the potential of RL-selected, classically simulated PQCs as compact surrogates with low OOD error and improved physical consistency, despite imposing no explicit physical constraints, penalty terms, or device-specific equations, on the two evaluated device datasets.", "arxiv_id": "2609.05251", "arxiv_url": "https://arxiv.org/abs/2609.05251", "authors": ["Rushat Rai", "Yun-Yuan Wang", "Autsada Kakaen", "Pei-Jie Chang", "Doan Viet Nguyen", "Yuan-Chieh Chiu", "Doldet Tantraviwat", "Niall Tumilty", "Simon See", "Wen-Jay Lee", "Tai-Yue Li", "Nan-Yow Chen", "Tian-Li Wu"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7269\u7406\u611f\u77e5\u7684\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u5f3a\u5316\u5b66\u4e60\u548c\u56fe\u795e\u7ecf\u7f51\u7edc\u7b56\u7565\u641c\u7d22\u7d27\u51d1\u53c2\u6570\u5316\u91cf\u5b50\u7ebf\u8def\uff0c\u7528\u4e8e\u6570\u636e\u7a00\u7f3a\u7684\u534a\u5bfc\u4f53\u5668\u4ef6\u5efa\u6a21\u3002\u76f8\u6bd4\u516d\u4e2a\u7ecf\u5178\u57fa\u7ebf\uff0c\u5728 GaN HEMT \u548c\u7eb3\u7c73\u7ebf FET \u7684\u591a\u4e2a\u76ee\u6807\u4e0a\u53d6\u5f97\u66f4\u4f4e MAE\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u8de8\u5de5\u827a/\u51e0\u4f55\u5212\u5206\u7684\u8bef\u5dee\u6ce2\u52a8\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05251", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u5668\u4ef6\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05251v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Unified Physics-Aware Quantum Machine Learning Framework across Power GaN HEMTs and Logic Nanowire FETs: Predicting Unseen Process Splits and Held-Out Geometry Combinations with Lower Error and Tighter Split-to-Split Variability", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7269\u7406\u611f\u77e5\u7684\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u5f3a\u5316\u5b66\u4e60\u548c\u56fe\u795e\u7ecf\u7f51\u7edc\u7b56\u7565\u641c\u7d22\u7d27\u51d1\u53c2\u6570\u5316\u91cf\u5b50\u7ebf\u8def\uff0c\u7528\u4e8e\u6570\u636e\u7a00\u7f3a\u7684\u534a\u5bfc\u4f53\u5668\u4ef6\u5efa\u6a21\u3002\u76f8\u6bd4\u516d\u4e2a\u7ecf\u5178\u57fa\u7ebf\uff0c\u5728 GaN HEMT \u548c\u7eb3\u7c73\u7ebf FET \u7684\u591a\u4e2a\u76ee\u6807\u4e0a\u53d6\u5f97\u66f4\u4f4e MAE\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u8de8\u5de5\u827a/\u51e0\u4f55\u5212\u5206\u7684\u8bef\u5dee\u6ce2\u52a8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Human knowledge is inherently structured and interdependent: mastery of a concept requires prior mastery of its prerequisites, a principle formalized by Knowledge Space Theory (KST). While LLMs achieve strong performance on complex reasoning tasks, it remains unclear whether they exhibit coherent, human-like knowledge structure. We introduce a KST-grounded framework for evaluating LLM knowledge structure in mathematical reasoning, using it as a normative framework to analyze whether LLM behavior adheres to principled knowledge dependencies. Evaluating eight open- and closed-source LLMs against real human learners, we find that (1) LLMs do not adhere to human knowledge structure -- they frequently violate knowledge dependencies and fail to leverage related knowledge provided in context to improve performance on dependent questions; (2) LLMs do not share a consistent knowledge structure among themselves, as reflected by low overlap in their knowledge distributions. Furthermore, these structural deficiencies remain largely invisible to accuracy-based and LLM-as-judge evaluations. Together, our results provide behavioral evidence that current LLMs knowledge does not follow a human-like structure.", "arxiv_id": "2609.05245", "arxiv_url": "https://arxiv.org/abs/2609.05245", "authors": ["Peng Cui", "Heejin Do", "Mrinmaya Sachan"], "brief": "\u672c\u6587\u57fa\u4e8e\u77e5\u8bc6\u7a7a\u95f4\u7406\u8bba\u63d0\u51fa\u8bc4\u4f30\u6846\u67b6\uff0c\u5206\u6790\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6570\u5b66\u63a8\u7406\u4e2d\u662f\u5426\u5177\u6709\u7c7b\u4f3c\u4eba\u7c7b\u7684\u8fde\u8d2f\u77e5\u8bc6\u7ed3\u6784\u3002\u5bf98\u4e2a\u5f00\u6e90\u548c\u95ed\u6e90\u6a21\u578b\u53ca\u771f\u5b9e\u5b66\u4e60\u8005\u7684\u6bd4\u8f83\u53d1\u73b0\uff0cLLM\u5e38\u8fdd\u53cd\u77e5\u8bc6\u4f9d\u8d56\u5173\u7cfb\uff0c\u4e5f\u96be\u4ee5\u5229\u7528\u4e0a\u4e0b\u6587\u4e2d\u7684\u76f8\u5173\u77e5\u8bc6\u63d0\u5347\u540e\u7eed\u9898\u76ee\u8868\u73b0\uff1b\u8fd9\u4e9b\u95ee\u9898\u5728\u5355\u7eaf\u51c6\u786e\u7387\u548cLLM\u88c1\u5224\u8bc4\u4f30\u4e2d\u5f80\u5f80\u4e0d\u53ef\u89c1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05245", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u5b66\u63a8\u7406", "\u77e5\u8bc6\u7ed3\u6784", "\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05245v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Do LLMs Exhibit Coherent Knowledge Structures in Mathematical Reasoning? A Perspective from Knowledge Space Theory", "tldr": "\u672c\u6587\u57fa\u4e8e\u77e5\u8bc6\u7a7a\u95f4\u7406\u8bba\u63d0\u51fa\u8bc4\u4f30\u6846\u67b6\uff0c\u5206\u6790\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6570\u5b66\u63a8\u7406\u4e2d\u662f\u5426\u5177\u6709\u7c7b\u4f3c\u4eba\u7c7b\u7684\u8fde\u8d2f\u77e5\u8bc6\u7ed3\u6784\u3002\u5bf98\u4e2a\u5f00\u6e90\u548c\u95ed\u6e90\u6a21\u578b\u53ca\u771f\u5b9e\u5b66\u4e60\u8005\u7684\u6bd4\u8f83\u53d1\u73b0\uff0cLLM\u5e38\u8fdd\u53cd\u77e5\u8bc6\u4f9d\u8d56\u5173\u7cfb\uff0c\u4e5f\u96be\u4ee5\u5229\u7528\u4e0a\u4e0b\u6587\u4e2d\u7684\u76f8\u5173\u77e5\u8bc6\u63d0\u5347\u540e\u7eed\u9898\u76ee\u8868\u73b0\uff1b\u8fd9\u4e9b\u95ee\u9898\u5728\u5355\u7eaf\u51c6\u786e\u7387\u548cLLM\u88c1\u5224\u8bc4\u4f30\u4e2d\u5f80\u5f80\u4e0d\u53ef\u89c1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A rapidly expanding ecosystem of actors is removing built-in safety guardrails from open-weight AI models. We profile this ecosystem by identifying key producers, downstream reproductions, and emerging applications. Between January 2024 and March 2026, we identified 3,471 original uncensored models on HuggingFace, each repackaged an average of 2.4 times; three actors account for 52% of all 8,164 compressed redistributions. Once quantized and mirrored across separate accounts, formats, and registries such as Ollama, these models persist regardless of upstream removal and become easier to deploy downstream. Of the 1,643 identified GitHub applications integrating uncensored large language models (ULLMs), 25% were classified as explicitly malicious.", "arxiv_id": "2609.05241", "arxiv_url": "https://arxiv.org/abs/2609.05241", "authors": ["10a Labs", ":", "Juliette Garcia", "Hailey May", "Bobby McKenzie", "David Pham", "Matthew Swain", "Joshua Valdez", "Corie Wieland", "Zachary Yahn"], "brief": "\u672c\u6587\u7cfb\u7edf\u68b3\u7406\u4e86\u53bb\u9664\u5b89\u5168\u62a4\u680f\u7684\u5f00\u6e90\u6743\u91cd\u5927\u6a21\u578b\u751f\u6001\uff0c\u53d1\u73b0 2024 \u5e74\u81f3 2026 \u5e74\u95f4 HuggingFace \u4e0a\u5df2\u6709 3471 \u4e2a\u539f\u59cb\u201c\u672a\u5ba1\u67e5\u201d\u6a21\u578b\uff0c\u5e76\u88ab\u5927\u91cf\u538b\u7f29\u3001\u91cf\u5316\u548c\u955c\u50cf\u518d\u5206\u53d1\u3002\u7814\u7a76\u6307\u51fa\u518d\u5206\u53d1\u4f7f\u8fd9\u4e9b\u6a21\u578b\u5373\u4f7f\u4e0a\u6e38\u5220\u9664\u4e5f\u80fd\u6301\u7eed\u5b58\u5728\u4e14\u66f4\u6613\u90e8\u7f72\uff0c\u4e0b\u6e38 GitHub \u5e94\u7528\u4e2d\u7ea6\u56db\u5206\u4e4b\u4e00\u88ab\u5224\u5b9a\u4e3a\u660e\u786e\u6076\u610f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05241", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f00\u6e90\u6a21\u578b", "\u5927\u6a21\u578b\u5b89\u5168", "\u6a21\u578b\u518d\u5206\u53d1", "\u6ee5\u7528\u98ce\u9669"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05241v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Uncensored Open-weight Models: Redistribution as the Persistence Layer", "tldr": "\u672c\u6587\u7cfb\u7edf\u68b3\u7406\u4e86\u53bb\u9664\u5b89\u5168\u62a4\u680f\u7684\u5f00\u6e90\u6743\u91cd\u5927\u6a21\u578b\u751f\u6001\uff0c\u53d1\u73b0 2024 \u5e74\u81f3 2026 \u5e74\u95f4 HuggingFace \u4e0a\u5df2\u6709 3471 \u4e2a\u539f\u59cb\u201c\u672a\u5ba1\u67e5\u201d\u6a21\u578b\uff0c\u5e76\u88ab\u5927\u91cf\u538b\u7f29\u3001\u91cf\u5316\u548c\u955c\u50cf\u518d\u5206\u53d1\u3002\u7814\u7a76\u6307\u51fa\u518d\u5206\u53d1\u4f7f\u8fd9\u4e9b\u6a21\u578b\u5373\u4f7f\u4e0a\u6e38\u5220\u9664\u4e5f\u80fd\u6301\u7eed\u5b58\u5728\u4e14\u66f4\u6613\u90e8\u7f72\uff0c\u4e0b\u6e38 GitHub \u5e94\u7528\u4e2d\u7ea6\u56db\u5206\u4e4b\u4e00\u88ab\u5224\u5b9a\u4e3a\u660e\u786e\u6076\u610f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cryptocurrency markets exhibit extreme volatility and non-stationary dynamics that challenge conventional forecasting methods. Although Large Language Models (LLMs) have shown promise for time series forecasting, the combined effects of adaptation choices remain largely unexplored in financial settings. This study introduces PRICE, a structured approach for adapting LLMs to short-term Bitcoin price forecasting. Built on a 4-bit quantized LLaMA-3 8B model, PRICE investigates how fine-tuning, numerical representation, prompting, inference, and decoding jointly influence forecasting performance. PRICE integrates Parameter-efficient fine-tuning with Low-Rank Adaptation (LoRA), Recursive multi-step inference, Integer-rounded numerical representation, Context-Task-Format (CTF) prompting, and Exact zero-temperature decoding. Ablation studies show that each component contributes to forecasting accuracy and reliability. LoRA enables efficient training on limited hardware, recursive inference improves accuracy, integer-rounded values reduce errors, CTF prompting outperforms Chain-of-Thought, Implicit Chain-of-Thought (iCoT), and few-shot prompting, and zero-temperature decoding improves stability during recursive forecasting. Comparative evaluation against eight transformer-based and time-series foundation models shows that PRICE achieves the lowest forecasting errors on both validation and test sets while maintaining robust performance across evaluation periods. Despite being based on a model primarily pretrained on text rather than time-series data, PRICE achieves competitive or superior performance relative to specialized foundation models. These findings demonstrate that adaptation choices critically determine the accuracy and robustness of LLMs for numerical time-series forecasting.", "arxiv_id": "2609.05235", "arxiv_url": "https://arxiv.org/abs/2609.05235", "authors": ["Maryam Fakhari", "Mehran Safayani"], "brief": "\u672c\u6587\u63d0\u51fa PRICE\uff0c\u7528 4-bit \u91cf\u5316 LLaMA-3 8B \u7814\u7a76\u6bd4\u7279\u5e01\u77ed\u671f\u4ef7\u683c\u9884\u6d4b\u4e2d\u7684\u5927\u6a21\u578b\u9002\u914d\u9009\u62e9\uff0c\u5305\u62ec LoRA \u5fae\u8c03\u3001\u9012\u5f52\u591a\u6b65\u63a8\u7406\u3001\u6574\u6570\u5316\u6570\u503c\u8868\u793a\u3001CTF \u63d0\u793a\u548c\u96f6\u6e29\u5ea6\u89e3\u7801\u3002\u6d88\u878d\u4e0e\u5bf9\u6bd4\u5b9e\u9a8c\u663e\u793a\uff0c\u5404\u7ec4\u4ef6\u5747\u63d0\u5347\u51c6\u786e\u6027\u4e0e\u7a33\u5b9a\u6027\uff0c\u6574\u4f53\u8bef\u5dee\u4f4e\u4e8e\u591a\u79cd Transformer \u4e0e\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.AI", "math.NA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05235", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u91d1\u878d\u9884\u6d4b", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05235v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PRICE: A Systematic Study of LLM Adaptation Choices for Bitcoin Price Forecasting", "tldr": "\u672c\u6587\u63d0\u51fa PRICE\uff0c\u7528 4-bit \u91cf\u5316 LLaMA-3 8B \u7814\u7a76\u6bd4\u7279\u5e01\u77ed\u671f\u4ef7\u683c\u9884\u6d4b\u4e2d\u7684\u5927\u6a21\u578b\u9002\u914d\u9009\u62e9\uff0c\u5305\u62ec LoRA \u5fae\u8c03\u3001\u9012\u5f52\u591a\u6b65\u63a8\u7406\u3001\u6574\u6570\u5316\u6570\u503c\u8868\u793a\u3001CTF \u63d0\u793a\u548c\u96f6\u6e29\u5ea6\u89e3\u7801\u3002\u6d88\u878d\u4e0e\u5bf9\u6bd4\u5b9e\u9a8c\u663e\u793a\uff0c\u5404\u7ec4\u4ef6\u5747\u63d0\u5347\u51c6\u786e\u6027\u4e0e\u7a33\u5b9a\u6027\uff0c\u6574\u4f53\u8bef\u5dee\u4f4e\u4e8e\u591a\u79cd Transformer \u4e0e\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous AI agents increasingly select actions in environments whose memory, execution-time, runtime, compute, and operational constraints determine what counts as a suitable plan. We call the absence of this execution context from an agent\u0027s planning state substrate blindness. We test this general proposition through numerical code generation, where selected implementation choices and operational consequences are directly observable. Three frontier model configurations--Anthropic Claude Opus 5, OpenAI GPT-5.6-Sol, and Google Gemini 3.7 Flash--generate code for a high-dimensional pairwise Euclidean-distance task either from the task alone or with a 128 MB RAM and 10.0 s wall-time contract. Contract disclosure reduced measured peak process memory in 13 of 14 executable index-aligned task-only versus contract-disclosed comparisons and reduced mean wall time in all three cohorts, making execution up to 3.1x faster. Across the audited corpus, disclosure produced structural code changes including bounded blocking, float32 retention, upper-triangle traversal, and in-place or memory-mapped buffers. At a tighter 96 MB contract, independently sampled contract-disclosed cohorts achieved correct-and-within-budget outcomes of 4/5 for Claude Opus 5, 5/5 for GPT-5.6-Sol, and 3/5 for Gemini 3.7 Flash, compared with task-only outcomes of 0/5, 1/5, and 0/5; cohort mean MaxRSS and wall time were 49-74% and 35-64% lower than their task-only references. These results establish a controlled proof of concept for substrate-aware agent planning: a minimal execution contract induces proactive structural adaptation in generated programs, shifting computation away from unconstrained allocations and substantially improving observed resource-time profiles before execution.", "arxiv_id": "2609.05232", "arxiv_url": "https://arxiv.org/abs/2609.05232", "authors": ["Manu Agrawal"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u57fa\u5e95\u76f2\u533a\u201d\u6982\u5ff5\uff0c\u8ba4\u4e3a\u667a\u80fd\u4f53\u89c4\u5212\u5e94\u628a\u5185\u5b58\u3001\u65f6\u95f4\u3001\u8fd0\u884c\u73af\u5883\u7b49\u6267\u884c\u4e0a\u4e0b\u6587\u4f5c\u4e3a\u4e00\u7b49\u8f93\u5165\u3002\u901a\u8fc7\u6570\u503c\u4ee3\u7801\u751f\u6210\u5b9e\u9a8c\u53d1\u73b0\uff0c\u660e\u786e\u7ed9\u51fa\u8d44\u6e90\u7ea6\u675f\u4f1a\u4fc3\u4f7f\u6a21\u578b\u751f\u6210\u66f4\u7701\u5185\u5b58\u3001\u66f4\u5feb\u7684\u7ed3\u6784\u6027\u5b9e\u73b0\uff0c\u5728\u4e25\u683c\u9884\u7b97\u4e0b\u6b63\u786e\u4e14\u8fbe\u6807\u7387\u663e\u8457\u9ad8\u4e8e\u4ec5\u7ed9\u4efb\u52a1\u63cf\u8ff0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05232", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8d44\u6e90\u7ea6\u675f", "\u6267\u884c\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05232v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Substrate-Aware AI Agents: Execution Context as a First-Class Input", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u57fa\u5e95\u76f2\u533a\u201d\u6982\u5ff5\uff0c\u8ba4\u4e3a\u667a\u80fd\u4f53\u89c4\u5212\u5e94\u628a\u5185\u5b58\u3001\u65f6\u95f4\u3001\u8fd0\u884c\u73af\u5883\u7b49\u6267\u884c\u4e0a\u4e0b\u6587\u4f5c\u4e3a\u4e00\u7b49\u8f93\u5165\u3002\u901a\u8fc7\u6570\u503c\u4ee3\u7801\u751f\u6210\u5b9e\u9a8c\u53d1\u73b0\uff0c\u660e\u786e\u7ed9\u51fa\u8d44\u6e90\u7ea6\u675f\u4f1a\u4fc3\u4f7f\u6a21\u578b\u751f\u6210\u66f4\u7701\u5185\u5b58\u3001\u66f4\u5feb\u7684\u7ed3\u6784\u6027\u5b9e\u73b0\uff0c\u5728\u4e25\u683c\u9884\u7b97\u4e0b\u6b63\u786e\u4e14\u8fbe\u6807\u7387\u663e\u8457\u9ad8\u4e8e\u4ec5\u7ed9\u4efb\u52a1\u63cf\u8ff0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mixture-of-Experts (MoE) architectures provide an efficient paradigm for scaling large language models (LLMs), yet fixed top-k routing activates the same number of expert slots for every token, causing substantial redundant computation. Existing expert-skipping methods often rely on router confidence, calibration data, or additional training, and therefore cannot reliably estimate the actual contribution of routed experts. To this end, we propose ACE, a training-free, calibration-free, and checkpoint-preserving framework for token-adaptive expert skipping in MoE-based LLMs. ACE contains two complementary components: 1) Global Spectral Proxy (GSP), which estimates global transformation capacity from the coupled gate, up, and down projections together with RMSNorm scaling; and 2) Router-Conditioned Refinement (RCR), which constructs expert-specific direction prototypes from centered router weights and evaluates expert responses along routing-preferred directions. During inference, ACE combines both estimates with runtime router gates and skips an expert slot only when both views identify it as low-contribution, while always retaining the top-1 expert. All expert statistics are computed offline, leaving only table lookups and lightweight scalar operations online. Extensive experiments across three MoE-based LLMs and eight benchmarks demonstrate that ACE consistently outperforms existing static and dynamic baselines, with increasingly pronounced advantages under aggressive expert skipping. For instance, at a 50% skipping ratio on Qwen3.6-35B-A3B, ACE reduces WikiText-2 perplexity by 7.96% and improves average downstream accuracy by 4.15 percentage points over the strongest competing method.", "arxiv_id": "2609.05228", "arxiv_url": "https://arxiv.org/abs/2609.05228", "authors": ["Zukang Xu", "Zhixiong Zhao", "Xing Hu", "Jiangyong Yu", "Houji Wen", "Jun Li", "Zhe Jiang", "Dawei Yang"], "brief": "\u8bba\u6587\u63d0\u51fa ACE\uff0c\u4e00\u79cd\u9762\u5411 MoE \u5927\u6a21\u578b\u7684\u514d\u8bad\u7ec3\u3001\u514d\u6821\u51c6\u4e13\u5bb6\u8df3\u8fc7\u6846\u67b6\uff0c\u901a\u8fc7\u5168\u5c40\u8c31\u4ee3\u7406\u548c\u8def\u7531\u6761\u4ef6\u7ec6\u5316\u6765\u4f30\u8ba1\u4e13\u5bb6\u8d21\u732e\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u81ea\u9002\u5e94\u8df3\u8fc7\u4f4e\u8d21\u732e\u4e13\u5bb6\u3002\u5b9e\u9a8c\u663e\u793a ACE \u5728\u591a\u4e2a MoE \u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u9759\u6001/\u52a8\u6001\u8df3\u8fc7\u65b9\u6cd5\uff0c\u5c24\u5176\u5728\u9ad8\u8df3\u8fc7\u7387\u4e0b\u80fd\u663e\u8457\u964d\u4f4e\u56f0\u60d1\u5ea6\u5e76\u63d0\u5347\u4e0b\u6e38\u51c6\u786e\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05228", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05228v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ACE: Adaptive Calibration-Free Expert Skipping for MoE-based LLMs", "tldr": "\u8bba\u6587\u63d0\u51fa ACE\uff0c\u4e00\u79cd\u9762\u5411 MoE \u5927\u6a21\u578b\u7684\u514d\u8bad\u7ec3\u3001\u514d\u6821\u51c6\u4e13\u5bb6\u8df3\u8fc7\u6846\u67b6\uff0c\u901a\u8fc7\u5168\u5c40\u8c31\u4ee3\u7406\u548c\u8def\u7531\u6761\u4ef6\u7ec6\u5316\u6765\u4f30\u8ba1\u4e13\u5bb6\u8d21\u732e\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u81ea\u9002\u5e94\u8df3\u8fc7\u4f4e\u8d21\u732e\u4e13\u5bb6\u3002\u5b9e\u9a8c\u663e\u793a ACE \u5728\u591a\u4e2a MoE \u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u9759\u6001/\u52a8\u6001\u8df3\u8fc7\u65b9\u6cd5\uff0c\u5c24\u5176\u5728\u9ad8\u8df3\u8fc7\u7387\u4e0b\u80fd\u663e\u8457\u964d\u4f4e\u56f0\u60d1\u5ea6\u5e76\u63d0\u5347\u4e0b\u6e38\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent reports during the AAAI-27 review cycle highlight the risk of reviewers coordinating bids for reciprocal assignment advantage. Prior work treats bidding, reviewer assignment, and review manipulation as separate stages, leaving the lifecycle effects of collusive bidding unclear. Real-world analysis is further constrained by typically unobservable collusive intent and the lack of counterfactuals for the same conference. Motivated by this gap, we introduce \\alg, an end-to-end multi-agent simulacra framework for studying reviewer assignment integrity by holding the conference environment fixed and configuring LLM-driven reviewer agents with honest or collusive policies. We further develop an affinity-guided collusive bidding strategy that uses mutual reviewer-paper affinities to construct collusion rings and select target papers, producing expertise-consistent rather than arbitrarily targeted attacks. Controlled experiments show that collusive bidding more than doubles target-paper capture and that assigned colluders score target papers about two points higher than honest co-reviewers, while conference-wide effects remain comparatively modest. Evaluated bid-phase detectors provide only limited evidence of collusion: in a fixed-triplet detector stress test, native positive-bid graphs are confounded by benign affinity, while a Very-High-only diagnostic view enables precise but low-coverage local recovery.", "arxiv_id": "2609.05227", "arxiv_url": "https://arxiv.org/abs/2609.05227", "authors": ["Jicheng Zhou", "Kemou Li", "Kahim Wong", "Zheyuan Li", "Zhuan Shi", "Fengpeng Li", "Haiwei Wu", "Jiantao Zhou"], "brief": "\u672c\u6587\u63d0\u51fa CABAL\uff0c\u4e00\u4e2a\u7aef\u5230\u7aef\u591a\u667a\u80fd\u4f53\u4eff\u771f\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u56fa\u5b9a\u4f1a\u8bae\u73af\u5883\u4e0b\u7814\u7a76\u540c\u884c\u8bc4\u5ba1\u4e2d\u5408\u8c0b\u6295\u6807\u5bf9\u5ba1\u7a3f\u5206\u914d\u4e0e\u8bc4\u5206\u7684\u5f71\u54cd\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5408\u8c0b\u6295\u6807\u53ef\u4f7f\u76ee\u6807\u8bba\u6587\u88ab\u5408\u8c0b\u8005\u5206\u914d\u7684\u6982\u7387\u7ffb\u500d\u4ee5\u4e0a\uff0c\u5e76\u5e26\u6765\u7ea62\u5206\u7684\u8bc4\u5206\u62ac\u5347\uff0c\u4f46\u73b0\u6709\u6295\u6807\u9636\u6bb5\u68c0\u6d4b\u5668\u53ea\u80fd\u63d0\u4f9b\u6709\u9650\u8bc1\u636e\u3001\u8986\u76d6\u7387\u8f83\u4f4e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05227", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u540c\u884c\u8bc4\u5ba1", "\u5408\u8c0b\u68c0\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05227v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CABAL: Multi-Agent Simulacra for Tracing the Effects of Collusive Bidding in Peer Review", "tldr": "\u672c\u6587\u63d0\u51fa CABAL\uff0c\u4e00\u4e2a\u7aef\u5230\u7aef\u591a\u667a\u80fd\u4f53\u4eff\u771f\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u56fa\u5b9a\u4f1a\u8bae\u73af\u5883\u4e0b\u7814\u7a76\u540c\u884c\u8bc4\u5ba1\u4e2d\u5408\u8c0b\u6295\u6807\u5bf9\u5ba1\u7a3f\u5206\u914d\u4e0e\u8bc4\u5206\u7684\u5f71\u54cd\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5408\u8c0b\u6295\u6807\u53ef\u4f7f\u76ee\u6807\u8bba\u6587\u88ab\u5408\u8c0b\u8005\u5206\u914d\u7684\u6982\u7387\u7ffb\u500d\u4ee5\u4e0a\uff0c\u5e76\u5e26\u6765\u7ea62\u5206\u7684\u8bc4\u5206\u62ac\u5347\uff0c\u4f46\u73b0\u6709\u6295\u6807\u9636\u6bb5\u68c0\u6d4b\u5668\u53ea\u80fd\u63d0\u4f9b\u6709\u9650\u8bc1\u636e\u3001\u8986\u76d6\u7387\u8f83\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) show strong reasoning ability, but their explanations can remain inconsistent, weakly grounded, or difficult to verify. We propose a verifier-guided explainable reasoning framework for transparent educational question answering that combines gold-anchored QLoRA, task-aware symbolic routing, and group-relative RLVR. Qwen2.5-3B-Instruct is first adapted with field-weighted QLoRA supervision anchored to authoritative answers. A lightweight router then assigns logic problems to a FOL/Z3 verifier and physics problems to a formula- and unit aware symbolic solver. Verifier feedback is further used to support candidate evaluation, self-revision, and reward construction during RLVR. Candidate responses are evaluated along three complementary dimensions: P1 for answer correctness, P2 for evidence or unit consistency, and P3 for reasoning depth and explainability. At inference, gold-free self-consistency aggregates multiple candidate responses before an optional question-only physics verifier performs conservative system-level correction. On 438 held-out examples, RLVR increases P3 from 50.68% to 72.20%, while hybrid P1 remains approximately stable at 55.94%. Self-consistency improves model only P1 from 48.86% to 50.23%, with symbolic verification providing the remaining hybrid gain. These results indicate that RLVR primarily strengthens explicit reasoning structure, while symbolic verification complements the neural policy by improving answer reliability at the system level.", "arxiv_id": "2609.05221", "arxiv_url": "https://arxiv.org/abs/2609.05221", "authors": ["Thi Kim Trang Vo", "Nam Tien Le", "Thi Kim Nguyet Vo", "Minh Khang Tran", "Duy Phuong Tran"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u6559\u80b2\u95ee\u7b54\u7684\u53ef\u89e3\u91ca\u63a8\u7406\u6846\u67b6\uff0c\u5c06\u91d1\u6807\u51c6\u951a\u5b9a\u7684 QLoRA \u5fae\u8c03\u3001\u4efb\u52a1\u611f\u77e5\u7b26\u53f7\u8def\u7531\u3001\u9a8c\u8bc1\u5668\u53cd\u9988\u548c\u7ec4\u76f8\u5bf9 RLVR \u7ed3\u5408\u8d77\u6765\u3002\u5b9e\u9a8c\u663e\u793a\uff0cRLVR \u663e\u8457\u63d0\u5347\u63a8\u7406\u6df1\u5ea6\u4e0e\u53ef\u89e3\u91ca\u6027\u6307\u6807 P3\uff0850.68% \u5230 72.20%\uff09\uff0c\u800c\u7b26\u53f7\u9a8c\u8bc1\u4e3b\u8981\u8865\u5145\u63d0\u5347\u7cfb\u7edf\u7ea7\u7b54\u6848\u53ef\u9760\u6027\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05221", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91ca\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u7b26\u53f7\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05221v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Verifier-Guided Explainable Reasoning Framework with Gold-Anchored QLoRA, Task-Aware Mixture-of-Experts, and Group-Relative RLVR", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u6559\u80b2\u95ee\u7b54\u7684\u53ef\u89e3\u91ca\u63a8\u7406\u6846\u67b6\uff0c\u5c06\u91d1\u6807\u51c6\u951a\u5b9a\u7684 QLoRA \u5fae\u8c03\u3001\u4efb\u52a1\u611f\u77e5\u7b26\u53f7\u8def\u7531\u3001\u9a8c\u8bc1\u5668\u53cd\u9988\u548c\u7ec4\u76f8\u5bf9 RLVR \u7ed3\u5408\u8d77\u6765\u3002\u5b9e\u9a8c\u663e\u793a\uff0cRLVR \u663e\u8457\u63d0\u5347\u63a8\u7406\u6df1\u5ea6\u4e0e\u53ef\u89e3\u91ca\u6027\u6307\u6807 P3\uff0850.68% \u5230 72.20%\uff09\uff0c\u800c\u7b26\u53f7\u9a8c\u8bc1\u4e3b\u8981\u8865\u5145\u63d0\u5347\u7cfb\u7edf\u7ea7\u7b54\u6848\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-Policy Distillation (OPD) has emerged as a widely adopted post-training paradigm for enhancing large language models in reasoning domains. However, the data-centric mechanisms in OPD remain relatively underexplored. This paper presents a empirical study of data efficiency and data selection in OPD. We begin by investigating an extreme setting: training OPD on only one example, namely 1-shot OPD. Surprisingly, we find that 1-shot OPD is consistently effective across all sampled training examples and harder examples often yield superior performance gain. We next investigate what actually drives the student model\u0027s improvement in the training data. Our analysis reveals that the improvement is not driven by high token entropy, but the longer CoT paths which hard problems naturally generate. Training on longer CoT can help maintain closer alignment with the teacher over a long reasoning horizon, and learn critical thinking patterns usually missing in short CoTs, such as reflection (e.g., ``Alternatively\u0027\u0027). Based on these insights, we propose a simple data selection method that selects only hard examples for training, where even ``unsolvable\u0027\u0027 examples that completely exceed the teacher\u0027s capability can be successfully used. Our experiments conducted on four models ranging from 1.5B to 7B show that training the student model on only 8 selected hard examples matches the performance of the 17K dataset baseline.", "arxiv_id": "2609.05198", "arxiv_url": "https://arxiv.org/abs/2609.05198", "authors": ["Zhinan Hou", "Jiaqi Zhang", "Xunliang Cai", "Keyou You"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\u7684\u6570\u636e\u6548\u7387\u4e0e\u6570\u636e\u9009\u62e9\uff0c\u53d1\u73b0\u5373\u4f7f\u53ea\u75281\u4e2a\u6837\u672c\u8bad\u7ec3\u4e5f\u80fd\u7a33\u5b9a\u63d0\u5347\u63a8\u7406\u80fd\u529b\uff0c\u4e14\u96be\u9898\u901a\u5e38\u5e26\u6765\u66f4\u5927\u6536\u76ca\u3002\u5206\u6790\u8868\u660e\u63d0\u5347\u4e3b\u8981\u6765\u81ea\u66f4\u957f\u7684\u601d\u7ef4\u94fe\u800c\u975e\u9ad8 token \u71b5\uff0c\u5e76\u636e\u6b64\u63d0\u51fa\u53ea\u9009\u62e9\u96be\u4f8b\u8bad\u7ec3\u7684\u65b9\u6cd5\uff1b\u57281.5B\u52307B\u6a21\u578b\u4e0a\uff0c\u4ec5\u75288\u4e2a\u96be\u4f8b\u5373\u53ef\u5339\u914d17K\u6570\u636e\u57fa\u7ebf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05198", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u601d\u7ef4\u94fe", "\u6570\u636e\u9009\u62e9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05198v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Matters in On-Policy Distillation? A Perspective on Data Efficiency and Data Selection", "tldr": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\u7684\u6570\u636e\u6548\u7387\u4e0e\u6570\u636e\u9009\u62e9\uff0c\u53d1\u73b0\u5373\u4f7f\u53ea\u75281\u4e2a\u6837\u672c\u8bad\u7ec3\u4e5f\u80fd\u7a33\u5b9a\u63d0\u5347\u63a8\u7406\u80fd\u529b\uff0c\u4e14\u96be\u9898\u901a\u5e38\u5e26\u6765\u66f4\u5927\u6536\u76ca\u3002\u5206\u6790\u8868\u660e\u63d0\u5347\u4e3b\u8981\u6765\u81ea\u66f4\u957f\u7684\u601d\u7ef4\u94fe\u800c\u975e\u9ad8 token \u71b5\uff0c\u5e76\u636e\u6b64\u63d0\u51fa\u53ea\u9009\u62e9\u96be\u4f8b\u8bad\u7ec3\u7684\u65b9\u6cd5\uff1b\u57281.5B\u52307B\u6a21\u578b\u4e0a\uff0c\u4ec5\u75288\u4e2a\u96be\u4f8b\u5373\u53ef\u5339\u914d17K\u6570\u636e\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The number of discrete class-separability jumps observed during ResNet finetuning is examined empirically as a predictor of final test accuracy. Across 75 experiments spanning four benchmarks (CIFAR-10, CIFAR-100, TinyImageNet, and CIFAR-10-C) and three architectures (ResNet-18, ResNet-50, and ResNet-101), with five to ten seeds per configuration, a strong within-dataset negative correlation is obtained on standard i.i.d. classification benchmarks: \\(r = -0.84\\) on CIFAR-10 (\\(p \u003c 10^{-8}\\), \\(n = 30\\)) and \\(r = -0.87\\) on CIFAR-100 (\\(p \u003c 10^{-5}\\), \\(n = 15\\)). Under distributional stress, the relationship attenuates: TinyImageNet yields \\(r = -0.45\\), and the CIFAR-10-C corruption benchmark yields \\(r = -0.19\\). Two additional analyses discipline the empirical claim. A partial correlation controlling for architecture depth, treated as a linear covariate, shows that on CIFAR-100 the transition count retains statistically significant predictive power (\\(r_{\\mathrm{partial}} = -0.69\\), \\(p = 0.007\\)); the corresponding result under the stricter categorical conditioning is not established at \\(n = 15\\). A comparison against six alternative training-curve signals shows that transition count achieved the strongest correlation among the evaluated signals on CIFAR-100 and one of the strongest on CIFAR-10, but is dominated by other signals on the two stressed benchmarks. The comparison is restricted to training-curve-level signals; comparisons against effective rank, Hessian sharpness, Fisher information, margin, and neural-collapse measures, which are the strongest competitors in the current literature, are not part of the present study and remain open. The observation is presented as an in-distribution training-quality probe among a family of candidate probes, and an inexpensive detection procedure suitable for logging alongside a standard training loop is provided.", "arxiv_id": "2609.05194", "arxiv_url": "https://arxiv.org/abs/2609.05194", "authors": ["Arunan J"], "brief": "\u8bba\u6587\u7814\u7a76\u4e86 ResNet \u5fae\u8c03\u8fc7\u7a0b\u4e2d\u201c\u7c7b\u522b\u53ef\u5206\u6027\u76f8\u53d8\u8df3\u8dc3\u201d\u6b21\u6570\u80fd\u5426\u9884\u6d4b\u6700\u7ec8\u6d4b\u8bd5\u51c6\u786e\u7387\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u6307\u6807\u5728 CIFAR-10/100 \u7b49\u540c\u5206\u5e03\u5206\u7c7b\u4efb\u52a1\u4e0a\u4e0e\u6700\u7ec8\u51c6\u786e\u7387\u5f3a\u8d1f\u76f8\u5173\uff0c\u53ef\u4f5c\u4e3a\u5ec9\u4ef7\u8bad\u7ec3\u8d28\u91cf\u63a2\u9488\uff0c\u4f46\u5728\u5206\u5e03\u504f\u79fb\u548c\u8150\u8680\u6570\u636e\u96c6\u4e0a\u9884\u6d4b\u529b\u660e\u663e\u51cf\u5f31\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05194", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df1\u5ea6\u5b66\u4e60", "\u6a21\u578b\u8bc4\u4f30", "\u5206\u5e03\u504f\u79fb", "ResNet"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05194v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Phase Transition Frequency as a Training Time Predictor of Test Accuracy in ResNets", "tldr": "\u8bba\u6587\u7814\u7a76\u4e86 ResNet \u5fae\u8c03\u8fc7\u7a0b\u4e2d\u201c\u7c7b\u522b\u53ef\u5206\u6027\u76f8\u53d8\u8df3\u8dc3\u201d\u6b21\u6570\u80fd\u5426\u9884\u6d4b\u6700\u7ec8\u6d4b\u8bd5\u51c6\u786e\u7387\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u6307\u6807\u5728 CIFAR-10/100 \u7b49\u540c\u5206\u5e03\u5206\u7c7b\u4efb\u52a1\u4e0a\u4e0e\u6700\u7ec8\u51c6\u786e\u7387\u5f3a\u8d1f\u76f8\u5173\uff0c\u53ef\u4f5c\u4e3a\u5ec9\u4ef7\u8bad\u7ec3\u8d28\u91cf\u63a2\u9488\uff0c\u4f46\u5728\u5206\u5e03\u504f\u79fb\u548c\u8150\u8680\u6570\u636e\u96c6\u4e0a\u9884\u6d4b\u529b\u660e\u663e\u51cf\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper we illustrate a novel architecture generating interpretable behavior and explanations. We refer to this architecture as the Mirror Agent Model because it defines the observer model, that is the target of explicit and implicit communications, as a mirror of the agent\u0027s. With the goal of providing a general understanding of this work, we firstly show prior relevant results addressing the informative communication of agents intentions and the production of legible behavior. In the second part of the paper we furnish the architecture with novel capabilities for explanations through off-the-shelf saliency methods, followed by preliminary qualitative results.", "arxiv_id": "2609.05190", "arxiv_url": "https://arxiv.org/abs/2609.05190", "authors": ["Michele Persiani", "Thomas Hellstr\u00f6m"], "brief": "\u672c\u6587\u63d0\u51fa Mirror Agent Model\uff0c\u4e00\u79cd\u8d1d\u53f6\u65af\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u5c06\u89c2\u5bdf\u8005\u6a21\u578b\u8bbe\u8ba1\u4e3a\u667a\u80fd\u4f53\u81ea\u8eab\u6a21\u578b\u7684\u201c\u955c\u50cf\u201d\uff0c\u7528\u4e8e\u751f\u6210\u66f4\u6613\u7406\u89e3\u7684\u884c\u4e3a\u4e0e\u663e\u5f0f/\u9690\u5f0f\u610f\u56fe\u6c9f\u901a\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u7ed3\u5408\u73b0\u6210\u7684\u663e\u8457\u6027\u65b9\u6cd5\u751f\u6210\u89e3\u91ca\uff0c\u5e76\u7ed9\u51fa\u521d\u6b65\u5b9a\u6027\u7ed3\u679c\uff0c\u4f46\u6574\u4f53\u4ecd\u504f\u6982\u5ff5\u4e0e\u65e9\u671f\u9a8c\u8bc1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05190", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u53ef\u89e3\u91ca\u6027", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u663e\u8457\u6027\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05190v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Mirror Agent Model: a Bayesian Architecture for Interpretable Agent Behavior", "tldr": "\u672c\u6587\u63d0\u51fa Mirror Agent Model\uff0c\u4e00\u79cd\u8d1d\u53f6\u65af\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u5c06\u89c2\u5bdf\u8005\u6a21\u578b\u8bbe\u8ba1\u4e3a\u667a\u80fd\u4f53\u81ea\u8eab\u6a21\u578b\u7684\u201c\u955c\u50cf\u201d\uff0c\u7528\u4e8e\u751f\u6210\u66f4\u6613\u7406\u89e3\u7684\u884c\u4e3a\u4e0e\u663e\u5f0f/\u9690\u5f0f\u610f\u56fe\u6c9f\u901a\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u7ed3\u5408\u73b0\u6210\u7684\u663e\u8457\u6027\u65b9\u6cd5\u751f\u6210\u89e3\u91ca\uff0c\u5e76\u7ed9\u51fa\u521d\u6b65\u5b9a\u6027\u7ed3\u679c\uff0c\u4f46\u6574\u4f53\u4ecd\u504f\u6982\u5ff5\u4e0e\u65e9\u671f\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Formalizing mathematics in a proof assistant, where a machine checks every definition, statement and proof, has set a new standard of rigor. Large language models are now capable of formalizing autonomously, even at the scale of whole textbooks. We bring this standard of rigor to physics, where theoretical arguments carry idealizations that are rarely stated fully, and any logical gaps could have a cascading effect on interdependent results. Recognizing the need to evaluate autoformalization systems for physics, we release AxQM, 1,019 kernel-checkable proof-synthesis tasks over 479 items drawn from the textbook Quantum Computation and Quantum Information by Nielsen and Chuang. The tasks are stated in a custom Lean library of finite-dimensional quantum mechanics. By task count, it is the largest proof-synthesis benchmark in physics by a factor of four. AxQM is derived from a near-complete formalization of the formal portions of the textbook, so every task is guaranteed a solution, which we keep private. Grading of the benchmark is done deterministically by the Lean kernel, which checks that the proof compiles, that no sorry appears in it or in any declaration it depends on, and that it introduces no new axioms.", "arxiv_id": "2609.05157", "arxiv_url": "https://arxiv.org/abs/2609.05157", "authors": ["Weichen Winston Yin", "Jacob M. Taylor", "Dirk R. Englund", "Frank H. L. Koppens"], "brief": "\u8bba\u6587\u53d1\u5e03 AxQM\uff0c\u4e00\u4e2a\u9762\u5411\u6709\u9650\u7ef4\u91cf\u5b50\u529b\u5b66\u7684 Lean \u5f62\u5f0f\u5316\u8bc1\u660e\u5408\u6210\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea Nielsen \u4e0e Chuang \u6559\u6750\u7684 1019 \u4e2a\u53ef\u7531\u5185\u6838\u68c0\u67e5\u7684\u4efb\u52a1\u3002\u8be5\u57fa\u51c6\u89c4\u6a21\u663e\u8457\u5927\u4e8e\u5df2\u6709\u7269\u7406\u8bc1\u660e\u5408\u6210\u6570\u636e\u96c6\uff0c\u5e76\u901a\u8fc7 Lean \u5185\u6838\u786e\u5b9a\u6027\u8bc4\u5206\uff0c\u4fdd\u8bc1\u4efb\u52a1\u6709\u89e3\u4e14\u65e0\u65b0\u516c\u7406\u6216 sorry\u3002", "categories": ["quant-ph", "cs.AI", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05157", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f62\u5f0f\u5316\u8bc1\u660e", "\u91cf\u5b50\u529b\u5b66", "\u81ea\u52a8\u5f62\u5f0f\u5316", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05157v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AxQM: A Textbook-Scale Benchmark for Formal Proof Synthesis in a Library of Finite-Dimensional Quantum Mechanics", "tldr": "\u8bba\u6587\u53d1\u5e03 AxQM\uff0c\u4e00\u4e2a\u9762\u5411\u6709\u9650\u7ef4\u91cf\u5b50\u529b\u5b66\u7684 Lean \u5f62\u5f0f\u5316\u8bc1\u660e\u5408\u6210\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea Nielsen \u4e0e Chuang \u6559\u6750\u7684 1019 \u4e2a\u53ef\u7531\u5185\u6838\u68c0\u67e5\u7684\u4efb\u52a1\u3002\u8be5\u57fa\u51c6\u89c4\u6a21\u663e\u8457\u5927\u4e8e\u5df2\u6709\u7269\u7406\u8bc1\u660e\u5408\u6210\u6570\u636e\u96c6\uff0c\u5e76\u901a\u8fc7 Lean \u5185\u6838\u786e\u5b9a\u6027\u8bc4\u5206\uff0c\u4fdd\u8bc1\u4efb\u52a1\u6709\u89e3\u4e14\u65e0\u65b0\u516c\u7406\u6216 sorry\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper introduces Regime-aware Constraint-Based and Noise-Based causal discovery with Markov Blankets (RCBNB-MB), a novel causal discovery algorithm for time series that relaxes the common assumption of a single, time-consistent causal structure. Time series are typically observed at discrete time points and often exhibit regime changes that challenge the assumption of a static causal structure, a limitation in many real-world dynamic systems. To address this challenge, RCBNB-MB identifies latent causal regimes, defined as subsets of time points within which a stable causal structure holds. The algorithm follows an iterative strategy that segments the time series into regimes and discovers the causal graph within each regime. By leveraging the Markov blanket rather than direct parents, RCBNB-MB gains robustness to errors in causal discovery and preserves predictive information. We provide theoretical guarantees for RCBNB-MB\u0027s ability to recover both regime transitions and causal graphs under reasonable assumptions. Furthermore, we validate its effectiveness through extensive experiments on simulated datasets with known ground truth and real-world IT monitoring data, where taking into account regime shifts is critical. Empirical results show that RCBNB-MB systematically outperforms baseline approaches in accurately detecting regime changes and their associated causal graphs, positioning it as a robust and versatile framework for non-stationary time series analysis.", "arxiv_id": "2609.05150", "arxiv_url": "https://arxiv.org/abs/2609.05150", "authors": ["Lei Zan", "Charles K. Assaad", "Emilie Devijver", "Eric Gaussier"], "brief": "\u8bba\u6587\u63d0\u51fa RCBNB-MB\uff0c\u7528\u9a6c\u5c14\u53ef\u592b\u6bef\u5728\u975e\u5e73\u7a33\u65f6\u95f4\u5e8f\u5217\u4e2d\u540c\u65f6\u53d1\u73b0\u6f5c\u5728\u56e0\u679c\u72b6\u6001\u6bb5\u548c\u5404\u72b6\u6001\u4e0b\u7684\u56e0\u679c\u56fe\uff0c\u653e\u5bbd\u5355\u4e00\u9759\u6001\u56e0\u679c\u7ed3\u6784\u5047\u8bbe\u3002\u65b9\u6cd5\u5728\u7406\u8bba\u4e0a\u7ed9\u51fa\u6062\u590d\u72b6\u6001\u8f6c\u79fb\u4e0e\u56e0\u679c\u56fe\u7684\u4fdd\u8bc1\uff0c\u5e76\u5728\u6a21\u62df\u6570\u636e\u548c\u771f\u5b9e IT \u76d1\u63a7\u6570\u636e\u4e0a\u4f18\u4e8e\u57fa\u7ebf\uff0c\u80fd\u66f4\u51c6\u786e\u8bc6\u522b\u72b6\u6001\u53d8\u5316\u53ca\u5bf9\u5e94\u56e0\u679c\u7ed3\u6784\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05150", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56e0\u679c\u53d1\u73b0", "\u65f6\u95f4\u5e8f\u5217", "\u975e\u5e73\u7a33\u6027", "\u9a6c\u5c14\u53ef\u592b\u6bef"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05150v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Stationarity in Time Series: Discovering Causal Structures and Latent Regimes via Markov Blankets", "tldr": "\u8bba\u6587\u63d0\u51fa RCBNB-MB\uff0c\u7528\u9a6c\u5c14\u53ef\u592b\u6bef\u5728\u975e\u5e73\u7a33\u65f6\u95f4\u5e8f\u5217\u4e2d\u540c\u65f6\u53d1\u73b0\u6f5c\u5728\u56e0\u679c\u72b6\u6001\u6bb5\u548c\u5404\u72b6\u6001\u4e0b\u7684\u56e0\u679c\u56fe\uff0c\u653e\u5bbd\u5355\u4e00\u9759\u6001\u56e0\u679c\u7ed3\u6784\u5047\u8bbe\u3002\u65b9\u6cd5\u5728\u7406\u8bba\u4e0a\u7ed9\u51fa\u6062\u590d\u72b6\u6001\u8f6c\u79fb\u4e0e\u56e0\u679c\u56fe\u7684\u4fdd\u8bc1\uff0c\u5e76\u5728\u6a21\u62df\u6570\u636e\u548c\u771f\u5b9e IT \u76d1\u63a7\u6570\u636e\u4e0a\u4f18\u4e8e\u57fa\u7ebf\uff0c\u80fd\u66f4\u51c6\u786e\u8bc6\u522b\u72b6\u6001\u53d8\u5316\u53ca\u5bf9\u5e94\u56e0\u679c\u7ed3\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This study introduces an intelligent framework that integrates machine learning and deep neural network ensemble techniques for early detection and prognosis of cardiovascular diseases. The system utilizes real-time physiological data collected from Internet of Medical Things (IoMT) devices, including ECG sensors, heart rate monitors, and blood pressure trackers. To ensure the accuracy and reliability of input data, preprocessing steps such as noise reduction, normalization, and missing value imputation are employed. The most significant health indicators are identified through effective feature selection methods and then processed using optimized classifiers such as Support Vector Machines (SVM), Random Forests, and eXtreme Gradient Boosting (XGBoost), which are combined in an ensemble architecture to improve diagnostic precision. The framework demonstrates remarkable performance in predicting cardiovascular disease risk, achieving higher accuracy, reduced false positives, and enhanced consistency compared to conventional methods. It is designed on a cloud-based infrastructure that ensures scalability and real-time processing for continuous patient monitoring. Experimental evaluation on real-world cardiovascular datasets confirms the framework\u0027s efficiency in early-stage risk assessment and clinical decision support. The results highlight the potential of combining traditional machine learning and deep learning paradigms to achieve proactive healthcare management and improve patient outcomes.", "arxiv_id": "2609.05146", "arxiv_url": "https://arxiv.org/abs/2609.05146", "authors": ["Balaji Venkateswaran"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7ed3\u5408\u4f20\u7edf\u673a\u5668\u5b66\u4e60\u4e0e\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u96c6\u6210\u7684\u5fc3\u8840\u7ba1\u75be\u75c5\u65e9\u671f\u98ce\u9669\u8bc4\u4f30\u6846\u67b6\uff0c\u5229\u7528\u7269\u8054\u7f51\u533b\u7597\u8bbe\u5907\u91c7\u96c6\u7684\u5b9e\u65f6\u751f\u7406\u6570\u636e\u8fdb\u884c\u9884\u5904\u7406\u3001\u7279\u5f81\u9009\u62e9\u4e0e\u5206\u7c7b\u9884\u6d4b\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u76f8\u6bd4\u5e38\ }
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
