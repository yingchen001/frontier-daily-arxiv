rated compositionally by adapting a strong single-object 3D generative prior to multi-view observations. We instantiate this paradigm with Pixal3D, extending it with a multi-view conditioning pathway that grounds object generation in multiple posed observations. Although the model is finetuned entirely on single objects in canonical space, it generalizes to large scenes with severe occlusion without any scene-level training, demonstrating the feasibility and scalability of this paradigm. We further introduce UE-MeshyScene, a photorealistic benchmark of densely cluttered scenes with hundreds of objects, per-object annotations, and ground-truth meshes. Across single-object, controlled multi-object, and UE-MeshyScene evaluations, our method consistently outperforms prior approaches, with larger gains as scene complexity and occlusion increase. Finally, we demonstrate broader applicability by converting generated 3DGS worlds, such as Marble and HY-World 2.0, into compositional mesh scenes.", "arxiv_id": "2609.05416", "arxiv_url": "https://arxiv.org/abs/2609.05416", "authors": ["Muyao Niu", "Jixuan He", "Ruihan Yu", "Lian Fu", "Yonghao Yu", "Zheng-Hui Huang", "Yifan Zhan", "Fengbo Lan", "Yongtao Ge", "Yinqiang Zheng", "Kaipeng Zhang", "Zhixiang Wang"], "brief": "\u8bba\u6587\u63d0\u51fa WorldSculpt\uff0c\u5c06\u5f3a\u5355\u7269\u4f533D\u751f\u6210\u5148\u9a8c\u6269\u5c55\u4e3a\u591a\u89c6\u89d2\u6761\u4ef6\u751f\u6210\uff0c\u7528\u4e8e\u628a\u5305\u542b\u6570\u767e\u7269\u4f53\u7684\u6742\u4e71\u573a\u666f\u8868\u793a\u4e3a\u5171\u4eab\u4e16\u754c\u5750\u6807\u7cfb\u4e2d\u7684\u72ec\u7acb\u7269\u4f53\u7f51\u683c\u96c6\u5408\u3002\u65b9\u6cd5\u57fa\u4e8e Pixal3D \u5fae\u8c03\uff0c\u867d\u53ea\u5728\u89c4\u8303\u7a7a\u95f4\u5355\u7269\u4f53\u4e0a\u8bad\u7ec3\uff0c\u5374\u80fd\u6cdb\u5316\u5230\u4e25\u91cd\u906e\u6321\u7684\u5927\u89c4\u6a21\u573a\u666f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AlayaLab/WorldSculpt", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.05416", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u591a\u89c6\u89d2\u6761\u4ef6\u8def\u5f84\u628a\u5355\u7269\u4f533D\u751f\u6210\u6a21\u578b\u951a\u5b9a\u5230\u5e26\u4f4d\u59ff\u7684\u89c6\u9891\u89c2\u6d4b\uff0c\u5b9e\u73b0\u9010\u7269\u4f53\u7ec4\u5408\u5f0f\u91cd\u5efa/\u751f\u6210", "\u65e0\u9700\u573a\u666f\u7ea7\u8bad\u7ec3\u5373\u53ef\u5904\u7406\u6570\u767e\u7269\u4f53\u548c\u5f3a\u906e\u6321\uff0c\u590d\u6742\u5ea6\u4e0e\u906e\u6321\u589e\u52a0\u65f6\u76f8\u5bf9\u4f18\u52bf\u66f4\u660e\u663e", "\u63d0\u51fa UE-MeshyScene\uff1a\u5305\u542b\u5bc6\u96c6\u6742\u4e71\u573a\u666f\u3001\u9010\u7269\u4f53\u6807\u6ce8\u4e0e\u771f\u503c\u7f51\u683c\u7684\u7167\u7247\u7ea7\u57fa\u51c6\uff0c\u5e76\u652f\u6301\u5c063DGS\u4e16\u754c\u8f6c\u6362\u4e3a\u7ec4\u5408\u5f0f\u7f51\u683c\u573a\u666f"], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u7ec4\u5408\u5f0f\u8868\u793a", "\u591a\u89c6\u89d2\u91cd\u5efa", "3DGS"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05416v1", "published_at": "2026-09-04", "score": 0.23, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05416.png", "title": "WorldSculpt: Generating Compositional Worlds from Grounded Videos", "tldr": "\u4ece\u591a\u89c6\u89d2\u89c6\u9891\u751f\u6210\u62e5\u6324\u573a\u666f\u7684\u7ec4\u5408\u5f0f3D\u7269\u4f53\u7f51\u683c", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldSculpt\uff0c\u5c06\u5f3a\u5355\u7269\u4f533D\u751f\u6210\u5148\u9a8c\u6269\u5c55\u4e3a\u591a\u89c6\u89d2\u6761\u4ef6\u751f\u6210\uff0c\u7528\u4e8e\u628a\u5305\u542b\u6570\u767e\u7269\u4f53\u7684\u6742\u4e71\u573a\u666f\u8868\u793a\u4e3a\u5171\u4eab\u4e16\u754c\u5750\u6807\u7cfb\u4e2d\u7684\u72ec\u7acb\u7269\u4f53\u7f51\u683c\u96c6\u5408\u3002\u65b9\u6cd5\u57fa\u4e8e Pixal3D \u5fae\u8c03\uff0c\u867d\u53ea\u5728\u89c4\u8303\u7a7a\u95f4\u5355\u7269\u4f53\u4e0a\u8bad\u7ec3\uff0c\u5374\u80fd\u6cdb\u5316\u5230\u4e25\u91cd\u906e\u6321\u7684\u5927\u89c4\u6a21\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5355\u7269\u4f53\u751f\u6210\u5148\u9a8c\u6269\u5c55\u5230\u771f\u5b9e\u590d\u6742\u591a\u7269\u4f53\u4e16\u754c\uff0c\u7f13\u89e3\u4f20\u7edf\u51e0\u4f55\u91cd\u5efa\u5728\u906e\u6321\u533a\u57df\u4e0d\u5b8c\u6574\u7684\u95ee\u9898\uff0c\u5bf9\u6e38\u620f\u3001AR/VR\u3001\u4eff\u771f\u548c\u673a\u5668\u4eba\u4e2d\u7684\u53ef\u7f16\u8f91\u3001\u53ef\u4ea4\u4e923D\u573a\u666f\u6784\u5efa\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Layer dropout (a.k.a. stochastic depth) has been shown to enable faster training, higher accuracy, and robustness to zero-shot layer pruning in both language and vision transformers. However, as models and datasets have scaled, dropout - particularly layer dropout - has largely disappeared from large language models (LLMs) pre-training recipes. While some prior work has reported that dropout can degrade accuracy, no comprehensive study has quantified, let alone mitigated, this effect. In this study, we show that layer dropout should be used in state-of-the-art LLM training, establishing best practices and scaling analysis for both training and post-training benefits. Concretely, with optimal layer distribution, time schedule, and optimizer hyperparameters, we observe that at the same training FLOPs layer dropout leads to lower loss. For a given number of training steps, LLMs can achieve lower or similar validation loss while saving upto 25% of training FLOPs. Moreover, layer dropout enables significant post-training optimizations, such as early exit, intermediate-layer skipping, and self-speculative decoding, yielding up to 1.5x inference speedup with negligible accuracy loss. Across more than 2400 training experiments, spanning models from 271M to 8.2B parameters and datasets up to 160B tokens, we demonstrate that these findings extend reliably to large-scale training regimes. All pre-training experiments were run on Cerebras CS-3 systems.", "arxiv_id": "2609.05275", "arxiv_url": "https://arxiv.org/abs/2609.05275", "authors": ["Mostafa Elhoushi", "Alex Pretko", "Nolan Dey", "Bin Claire Zhang", "Gavia Gray", "Gurpreet Gosal", "Abdulrahman Mahmoud", "Shane Bergsma", "Joel Hestness"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5c42Dropout\uff08\u968f\u673a\u6df1\u5ea6\uff09\u5728\u5927\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u7684\u4f5c\u7528\uff0c\u63d0\u51fa\u5176\u5206\u5e03\u3001\u65f6\u95f4\u8c03\u5ea6\u548c\u4f18\u5316\u5668\u8d85\u53c2\u7684\u6700\u4f73\u5b9e\u8df5\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5408\u7406\u4f7f\u7528\u5c42Dropout\u4e0d\u4ec5\u4e0d\u4f1a\u635f\u5bb3\u6027\u80fd\uff0c\u8fd8\u80fd\u5728\u540c\u7b49\u6216\u66f4\u5c11\u8bad\u7ec3FLOPs\u4e0b\u83b7\u5f97\u66f4\u4f4e\u9a8c\u8bc1\u635f\u5931\uff0c\u5e76\u652f\u6301\u591a\u79cd\u63a8\u7406\u52a0\u901f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05275", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57282400\u591a\u6b21\u8bad\u7ec3\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\uff0c\u8986\u76d6271M\u52308.2B\u53c2\u6570\u6a21\u578b\u3001\u6700\u9ad8160B tokens\u6570\u636e\u89c4\u6a21\u3002", "\u901a\u8fc7\u4f18\u5316\u5c42Dropout\u5206\u5e03\u3001\u8bad\u7ec3\u65f6\u95f4\u8c03\u5ea6\u548c\u4f18\u5316\u5668\u8d85\u53c2\u6570\uff0c\u53ef\u5728\u76f8\u540c\u8bad\u7ec3FLOPs\u4e0b\u964d\u4f4eloss\uff0c\u6216\u5728\u56fa\u5b9a\u6b65\u6570\u4e0b\u8282\u7701\u6700\u9ad825%\u8bad\u7ec3FLOPs\u3002", "\u5c42Dropout\u5e26\u6765\u540e\u8bad\u7ec3\u63a8\u7406\u4f18\u5316\u80fd\u529b\uff0c\u5305\u62ecearly exit\u3001\u4e2d\u95f4\u5c42\u8df3\u8fc7\u548cself-speculative decoding\uff0c\u6700\u9ad8\u5b9e\u73b01.5\u500d\u63a8\u7406\u52a0\u901f\u4e14\u7cbe\u5ea6\u635f\u5931\u5f88\u5c0f\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u9ad8\u6548\u8bad\u7ec3", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": true, "organization": "Cerebras", "pdf_url": "https://arxiv.org/pdf/2609.05275v1", "published_at": "2026-09-04", "score": 0.218, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05275.png", "title": "Don\u0027t Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference", "tldr": "\u5c42Dropout\u53ef\u964d\u4f4eLLM\u8bad\u7ec3\u4e0e\u63a8\u7406\u6210\u672c", "upvotes": 1, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5c42Dropout\uff08\u968f\u673a\u6df1\u5ea6\uff09\u5728\u5927\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u7684\u4f5c\u7528\uff0c\u63d0\u51fa\u5176\u5206\u5e03\u3001\u65f6\u95f4\u8c03\u5ea6\u548c\u4f18\u5316\u5668\u8d85\u53c2\u7684\u6700\u4f73\u5b9e\u8df5\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5408\u7406\u4f7f\u7528\u5c42Dropout\u4e0d\u4ec5\u4e0d\u4f1a\u635f\u5bb3\u6027\u80fd\uff0c\u8fd8\u80fd\u5728\u540c\u7b49\u6216\u66f4\u5c11\u8bad\u7ec3FLOPs\u4e0b\u83b7\u5f97\u66f4\u4f4e\u9a8c\u8bc1\u635f\u5931\uff0c\u5e76\u652f\u6301\u591a\u79cd\u63a8\u7406\u52a0\u901f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u5f53\u524dLLM\u9884\u8bad\u7ec3\u4e2d\u666e\u904d\u5f03\u7528Dropout\u7684\u8d8b\u52bf\uff0c\u7ed9\u51fa\u4e86\u5927\u89c4\u6a21\u5b9e\u8bc1\u8bc1\u636e\u548c\u53ef\u64cd\u4f5c\u8bad\u7ec3\u914d\u65b9\uff0c\u517c\u5177\u8bad\u7ec3\u964d\u672c\u548c\u63a8\u7406\u52a0\u901f\u4ef7\u503c\u3002"}, {"abstract": "Computer-use agents can execute increasingly complex tasks in graphical interfaces, but their interaction experience is typically transient: procedural knowledge acquired from one rollout is not systematically retained, refined, and reused in later tasks. Existing skill libraries provide external procedural knowledge, yet their incremental value over the same agent operating without skills, as well as their longitudinal dynamics under repeated interaction, remain insufficiently characterized. We present an online skill-evolution framework that converts interaction trajectories and evaluator feedback into a persistent, versioned library of reusable procedures. Each iteration executes against a frozen library snapshot, and evidence-guided skill updates become available in subsequent iterations without changing model parameters. We compare the full evolving-library system with a configuration-matched empty-library control across four OSWorld application domains under the same fixed action-generation and GUI-grounding stack, task sets, and iteration horizons. Following a five-iteration empty-library warm-up, Full attains a higher post-warm-up mean evaluator score in all four observed domain runs, with mean differences ranging from 5.7 to 18.6 percentage points and domain-dependent temporal stability. In GIMP, provenance-aware analysis reveals retrieval across task-of-origin boundaries and revision churn, where repeated accepted edits fail to recover the originating task. These findings characterize evolving skill libraries as auditable, shared procedural memory that can improve a fixed computer-use stack, while showing that their benefits are conditional and repeated revision does not guarantee recovery. Code is released at https://github.com/LongtaoHu/Skill-Evo4GUI.", "arxiv_id": "2609.04869", "arxiv_url": "https://arxiv.org/abs/2609.04869", "authors": ["Longtao Hu", "Xiao Liang", "Linchao Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5728\u7ebf\u6280\u80fd\u8fdb\u5316\u6846\u67b6\uff0c\u5c06\u8ba1\u7b97\u673a\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u4ea4\u4e92\u8f68\u8ff9\u4e0e\u8bc4\u4f30\u53cd\u9988\u8f6c\u5316\u4e3a\u6301\u4e45\u3001\u53ef\u7248\u672c\u5316\u3001\u53ef\u590d\u7528\u7684\u8fc7\u7a0b\u6280\u80fd\u5e93\u3002\u8be5\u65b9\u6cd5\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\uff0c\u800c\u662f\u5728\u540e\u7eed\u8fed\u4ee3\u4e2d\u901a\u8fc7\u68c0\u7d22\u548c\u4fee\u8ba2\u6280\u80fd\u63d0\u5347\u56fa\u5b9aGUI\u64cd\u4f5c\u6808\u7684\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04869", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6bcf\u8f6e\u4efb\u52a1\u57fa\u4e8e\u51bb\u7ed3\u7684\u6280\u80fd\u5e93\u5feb\u7167\u6267\u884c\uff0c\u8fed\u4ee3\u540e\u518d\u6839\u636e\u8bc1\u636e\u4e0e\u53cd\u9988\u66f4\u65b0\u6280\u80fd\uff0c\u4fdd\u8bc1\u53ef\u5ba1\u8ba1\u7684\u7eb5\u5411\u6f14\u5316\u8fc7\u7a0b\u3002", "\u5728OSWorld\u56db\u4e2a\u5e94\u7528\u9886\u57df\u4e2d\uff0c\u4e0e\u914d\u7f6e\u4e00\u81f4\u7684\u7a7a\u6280\u80fd\u5e93\u5bf9\u7167\u76f8\u6bd4\uff0c\u5b8c\u6574\u7cfb\u7edf\u5728\u9884\u70ed\u540e\u5e73\u5747\u8bc4\u4f30\u5f97\u5206\u5747\u66f4\u9ad8\uff0c\u63d0\u5347\u7ea65.7\u523018.6\u4e2a\u767e\u5206\u70b9\u3002", "GIMP\u5206\u6790\u663e\u793a\u6280\u80fd\u53ef\u8de8\u539f\u59cb\u4efb\u52a1\u8fb9\u754c\u590d\u7528\uff0c\u4f46\u4e5f\u5b58\u5728\u4fee\u8ba2\u9707\u8361\uff1a\u591a\u6b21\u88ab\u63a5\u53d7\u7684\u7f16\u8f91\u4e0d\u4e00\u5b9a\u80fd\u6062\u590d\u6700\u521d\u4efb\u52a1\u80fd\u529b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u64cd\u4f5c", "\u6280\u80fd\u5b66\u4e60", "\u957f\u671f\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04869v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "From Interaction Traces to Persistent Skills: Online Evolution for Computer-Use Agents", "tldr": "\u8ba9GUI\u667a\u80fd\u4f53\u4ece\u4ea4\u4e92\u8f68\u8ff9\u4e2d\u6301\u7eed\u8fdb\u5316\u6280\u80fd\u5e93", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5728\u7ebf\u6280\u80fd\u8fdb\u5316\u6846\u67b6\uff0c\u5c06\u8ba1\u7b97\u673a\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u4ea4\u4e92\u8f68\u8ff9\u4e0e\u8bc4\u4f30\u53cd\u9988\u8f6c\u5316\u4e3a\u6301\u4e45\u3001\u53ef\u7248\u672c\u5316\u3001\u53ef\u590d\u7528\u7684\u8fc7\u7a0b\u6280\u80fd\u5e93\u3002\u8be5\u65b9\u6cd5\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\uff0c\u800c\u662f\u5728\u540e\u7eed\u8fed\u4ee3\u4e2d\u901a\u8fc7\u68c0\u7d22\u548c\u4fee\u8ba2\u6280\u80fd\u63d0\u5347\u56fa\u5b9aGUI\u64cd\u4f5c\u6808\u7684\u8868\u73b0\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628aGUI\u667a\u80fd\u4f53\u7684\u4e00\u6b21\u6027\u4ea4\u4e92\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u957f\u671f\u5171\u4eab\u7684\u7a0b\u5e8f\u8bb0\u5fc6\uff0c\u7cfb\u7edf\u8bc4\u4f30\u4e86\u6280\u80fd\u5e93\u76f8\u5bf9\u65e0\u6280\u80fd\u57fa\u7ebf\u7684\u589e\u76ca\u4e0e\u957f\u671f\u52a8\u6001\uff0c\u5bf9\u6784\u5efa\u53ef\u6301\u7eed\u5b66\u4e60\u3001\u53ef\u5ba1\u8ba1\u7684computer-use agent\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Embodied agents performing long-horizon tasks require a memory representation in which the state transitions of dynamic objects remain queryable in natural language across hours-to-days observation horizons. Existing systems either drop fine-grained motion (clip-level video-language embeddings), keep it only as raw coordinates (geometric SLAM), or organise it around immediate task context (agent working memories). None of them gives the agent a per-object timeline whose state transitions are themselves queryable in language. Our key contribution is \\textbf{Linguistic Trajectory Encoding} (LTE), which compresses dynamic object motion histories via a hybrid representation combining natural language descriptions, sparse spatial anchors, and visual anchors. LTE adapts compression to motion complexity by anchoring periods without reliable observations to the last seen location, while representing motion with geometric waypoints and linguistic descriptions to preserve accuracy. To evaluate these capabilities across extended time horizons, we construct the \\textbf{Spatial Memory Benchmark} (SMB) from EgoLife multi-day recordings, targeting capabilities absent in existing benchmarks: semantic trajectory retrieval and long-horizon object retrieval. On SMB, the LTE-based system achieves $45.3\\%$ success in semantic trajectory retrieval and $48.7\\%$ in long-horizon object retrieval, outperforming structured-memory and VLM baselines (best prior: $31.9\\%$ and $34.4\\%$). LTE achieves trajectory compression by factors of $8.7\\times$ to $26.1\\times$ with sub-second query latency on $24$\\,h video. On Ego4D natural-language queries, the system reaches $28.75\\%$ / $55.10\\%$ R@1/R@5, $+15.80$ / $+31.30$ pts over EgoVLPv2.", "arxiv_id": "2609.04802", "arxiv_url": "https://arxiv.org/abs/2609.04802", "authors": ["Tianyidan Xie", "Shenyi Wang", "Qiang Tang", "Mingjie Wang", "Zhicheng Qiu", "Xuanfu Li", "Zhan Xu", "Jian Yang", "Lanjun Wang", "Zili Yi"], "brief": "\u8bba\u6587\u63d0\u51fa Linguistic Trajectory Encoding\uff08LTE\uff09\uff0c\u4e3a\u52a8\u6001\u7269\u4f53\u6784\u5efa\u53ef\u7528\u81ea\u7136\u8bed\u8a00\u67e5\u8be2\u7684\u957f\u671f\u8f68\u8ff9\u8bb0\u5fc6\u3002\u5b83\u7ed3\u5408\u8bed\u8a00\u63cf\u8ff0\u3001\u7a00\u758f\u7a7a\u95f4\u951a\u70b9\u548c\u89c6\u89c9\u951a\u70b9\uff0c\u5728\u538b\u7f29\u591a\u5929\u89c2\u6d4b\u5386\u53f2\u7684\u540c\u65f6\u4fdd\u7559\u7269\u4f53\u72b6\u6001\u8f6c\u79fb\u4fe1\u606f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04802", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["LTE \u6839\u636e\u8fd0\u52a8\u590d\u6742\u5ea6\u81ea\u9002\u5e94\u538b\u7f29\uff1a\u5bf9\u7f3a\u5931\u6216\u4e0d\u53ef\u9760\u89c2\u6d4b\u951a\u5b9a\u5230\u6700\u540e\u53ef\u89c1\u4f4d\u7f6e\uff0c\u5bf9\u771f\u5b9e\u8fd0\u52a8\u7528\u51e0\u4f55\u8def\u6807\u4e0e\u8bed\u8a00\u63cf\u8ff0\u8054\u5408\u8868\u793a\u3002", "\u6784\u5efa Spatial Memory Benchmark\uff08SMB\uff09\uff0c\u57fa\u4e8e EgoLife \u591a\u65e5\u5f55\u5236\uff0c\u8bc4\u4f30\u8bed\u4e49\u8f68\u8ff9\u68c0\u7d22\u4e0e\u957f\u65f6\u7269\u4f53\u68c0\u7d22\u7b49\u73b0\u6709\u57fa\u51c6\u7f3a\u5931\u80fd\u529b\u3002", "\u5728 SMB \u4e0a\u8bed\u4e49\u8f68\u8ff9\u68c0\u7d22\u6210\u529f\u7387\u8fbe 45.3%\uff0c\u957f\u65f6\u7269\u4f53\u68c0\u7d22\u8fbe 48.7%\uff0c\u4f18\u4e8e\u7ed3\u6784\u5316\u8bb0\u5fc6\u548c VLM \u57fa\u7ebf\uff1b24 \u5c0f\u65f6\u89c6\u9891\u538b\u7f29 8.7\u00d7\u201326.1\u00d7 \u4e14\u67e5\u8be2\u5ef6\u8fdf\u4f4e\u4e8e 1 \u79d2\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd\u4f53", "\u7a7a\u95f4\u8bb0\u5fc6", "\u591a\u6a21\u6001", "\u957f\u65f6\u89c6\u9891\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04802v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Linguistic Trajectory Encoding for Efficient Long-Horizon Spatial Memory in Embodied Agents", "tldr": "\u7528\u8bed\u8a00\u8f68\u8ff9\u7f16\u7801\u63d0\u5347\u5177\u8eab\u667a\u80fd\u4f53\u957f\u65f6\u7a7a\u8bb0\u5fc6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Linguistic Trajectory Encoding\uff08LTE\uff09\uff0c\u4e3a\u52a8\u6001\u7269\u4f53\u6784\u5efa\u53ef\u7528\u81ea\u7136\u8bed\u8a00\u67e5\u8be2\u7684\u957f\u671f\u8f68\u8ff9\u8bb0\u5fc6\u3002\u5b83\u7ed3\u5408\u8bed\u8a00\u63cf\u8ff0\u3001\u7a00\u758f\u7a7a\u95f4\u951a\u70b9\u548c\u89c6\u89c9\u951a\u70b9\uff0c\u5728\u538b\u7f29\u591a\u5929\u89c2\u6d4b\u5386\u53f2\u7684\u540c\u65f6\u4fdd\u7559\u7269\u4f53\u72b6\u6001\u8f6c\u79fb\u4fe1\u606f\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u5177\u8eab\u667a\u80fd\u4f53\u7684\u7a7a\u95f4\u8bb0\u5fc6\u4ece\u77ed\u671f\u4efb\u52a1\u4e0a\u4e0b\u6587\u6216\u539f\u59cb\u5750\u6807\u8bb0\u5f55\uff0c\u63a8\u8fdb\u5230\u53ef\u8bed\u8a00\u67e5\u8be2\u7684\u5bf9\u8c61\u7ea7\u957f\u671f\u8f68\u8ff9\u8bb0\u5fc6\uff0c\u5bf9\u5bb6\u5ead\u673a\u5668\u4eba\u3001\u53ef\u7a7f\u6234\u52a9\u624b\u548c\u957f\u65f6\u81ea\u4e3b\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Training a competitive Text-to-SQL agent usually depends on human-annotated natural-language/SQL pairs, which are expensive, domain-specific, and a bottleneck for scaling to new databases. We show it is possible to train a competitive solver with zero annotated pairs. We introduce SQL-Zero, a proposer-solver self-play in which a challenger and a solver start from the same base LLM and the only ground truth is execution against the database itself. The challenger generates SQL pairs calibrated to the solver\u0027s current difficulty (targeting \"hard but solvable\"), and both roles are updated with GRPO in alternating turns, with a template-level repetition penalty on the challenger to prevent diversity collapse. Training on BIRD databases with no labels, self-play improves over the zero-shot base on BIRD dev by 6.6 points at 3B and 7.3 points at 7B. It also scores higher than a matched control trained under the same recipe on human BIRD gold over the same databases, although an exact paired test does not resolve that margin. Transfer depends on scale: at 3B every iteration outperforms the base on unseen Spider databases and under lexical perturbation (Spider-Syn), where it also degrades less than the matched BIRD-gold control, whereas at 7B only the first iteration preserves transfer.", "arxiv_id": "2609.04697", "arxiv_url": "https://arxiv.org/abs/2609.04697", "authors": ["Daniel Machado Pedrozo", "Julia Soares Dollis", "Bryan Lincoln Marques de Oliveira", "Vinicius Alboneti Aguiar", "S\u00e1vio Salvarino Teles de Oliveira", "Telma Woerle de Lima Soares"], "brief": "\u8bba\u6587\u63d0\u51fa SQL-Zero\uff0c\u7528 proposer-solver \u81ea\u535a\u5f08\u5728\u6ca1\u6709\u4eba\u5de5\u81ea\u7136\u8bed\u8a00/SQL \u6807\u6ce8\u5bf9\u7684\u60c5\u51b5\u4e0b\u8bad\u7ec3 Text-to-SQL \u6c42\u89e3\u5668\u3002\u7cfb\u7edf\u4ec5\u4f9d\u8d56\u6570\u636e\u5e93\u6267\u884c\u7ed3\u679c\u4f5c\u4e3a\u53cd\u9988\uff0c\u8ba9\u6311\u6218\u8005\u751f\u6210\u9002\u914d\u6c42\u89e3\u5668\u96be\u5ea6\u7684SQL\u4efb\u52a1\uff0c\u53cc\u65b9\u4ea4\u66ff\u7528 GRPO \u66f4\u65b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04697", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6311\u6218\u8005\u4e0e\u6c42\u89e3\u5668\u4ece\u540c\u4e00\u57fa\u7840 LLM \u51fa\u53d1\uff0c\u6311\u6218\u8005\u751f\u6210\u201c\u56f0\u96be\u4f46\u53ef\u89e3\u201d\u7684SQL\u5bf9\uff0c\u6c42\u89e3\u5668\u5c1d\u8bd5\u89e3\u9898\u5e76\u901a\u8fc7\u6267\u884c\u7ed3\u679c\u83b7\u5f97\u4fe1\u53f7\u3002", "\u91c7\u7528 GRPO \u4ea4\u66ff\u8bad\u7ec3\u4e24\u4e2a\u89d2\u8272\uff0c\u5e76\u52a0\u5165\u6a21\u677f\u7ea7\u91cd\u590d\u60e9\u7f5a\uff0c\u7f13\u89e3\u6311\u6218\u8005\u751f\u6210\u6a21\u5f0f\u574d\u7f29\u3001\u63d0\u5347\u4efb\u52a1\u591a\u6837\u6027\u3002", "\u5728 BIRD \u65e0\u6807\u7b7e\u8bad\u7ec3\u4e2d\uff0c\u76f8\u6bd4\u96f6\u6837\u672c\u57fa\u5ea7\u6a21\u578b\uff0c3B \u63d0\u5347 6.6 \u5206\u30017B \u63d0\u5347 7.3 \u5206\uff1b3B \u5728 Spider \u4e0e Spider-Syn \u4e0a\u4e5f\u4fdd\u6301\u8f83\u597d\u8fc1\u79fb\u4e0e\u9c81\u68d2\u6027\u3002"], "keywords": ["Text-to-SQL", "\u667a\u80fd\u4f53", "\u81ea\u535a\u5f08", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04697v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SQL-Zero: Self-Evolving Text-to-SQL", "tldr": "\u96f6\u6807\u6ce8\u81ea\u535a\u5f08\u8bad\u7ec3Text-to-SQL", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SQL-Zero\uff0c\u7528 proposer-solver \u81ea\u535a\u5f08\u5728\u6ca1\u6709\u4eba\u5de5\u81ea\u7136\u8bed\u8a00/SQL \u6807\u6ce8\u5bf9\u7684\u60c5\u51b5\u4e0b\u8bad\u7ec3 Text-to-SQL \u6c42\u89e3\u5668\u3002\u7cfb\u7edf\u4ec5\u4f9d\u8d56\u6570\u636e\u5e93\u6267\u884c\u7ed3\u679c\u4f5c\u4e3a\u53cd\u9988\uff0c\u8ba9\u6311\u6218\u8005\u751f\u6210\u9002\u914d\u6c42\u89e3\u5668\u96be\u5ea6\u7684SQL\u4efb\u52a1\uff0c\u53cc\u65b9\u4ea4\u66ff\u7528 GRPO \u66f4\u65b0\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86 Text-to-SQL \u53ef\u4ee5\u6446\u8131\u6602\u8d35\u4e14\u9886\u57df\u7ed1\u5b9a\u7684\u4eba\u5de5\u6807\u6ce8\uff0c\u901a\u8fc7\u6570\u636e\u5e93\u6267\u884c\u53cd\u9988\u8fdb\u884c\u81ea\u8fdb\u5316\u8bad\u7ec3\uff0c\u5bf9\u4f4e\u6210\u672c\u6269\u5c55\u5230\u65b0\u6570\u636e\u5e93\u548c\u6784\u5efa\u81ea\u8bad\u7ec3\u6570\u636e\u751f\u6210\u8303\u5f0f\u5177\u6709\u91cd\u8981\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Reasoning Models (LRMs) achieve superior problem-solving through extended Chain-of-Thought (CoT) generation, but the resulting key-value (KV) cache grows linearly with sequence length and creates severe memory bottlenecks, often exceeding GPU capacity for long reasoning traces. Existing KV cache compression methods rely on recent queries to estimate future token importance, implicitly assuming these serve as reliable proxies for future attention patterns. We demonstrate that this assumption fails in long-horizon reasoning: certain decoding steps generate Thought Revisiting Tokens (TRT) that re-attend to distant previous context, such as task-solving plans formulated early in the trace. Through systematic analysis, we discover that queries corresponding to the TRT cluster into a small number of similarity groups in the embedding space. Based on this insight, we propose BeaconKV, a training-free KV cache compression method that maintains beacon queries, compact representatives for each global query cluster, to anticipate which KV pairs will be revisited without storing the entire query history. Across four open-source LRMs and diverse reasoning benchmarks, BeaconKV generally outperforms existing compression methods, achieving up to $5.8\\times$ memory reduction while nearly preserving full cache accuracy and improving throughput by over $4.3\\times$.", "arxiv_id": "2609.04971", "arxiv_url": "https://arxiv.org/abs/2609.04971", "authors": ["Janghyeon Kim", "Minsoo Kim", "Kyuhong Shim", "Jungwook Choi"], "brief": "\u8bba\u6587\u53d1\u73b0\u957f\u94fe\u5f0f\u63a8\u7406\u4e2d\u5b58\u5728\u4f1a\u56de\u770b\u8fdc\u7aef\u4e0a\u4e0b\u6587\u7684\u201cThought Revisiting Tokens\u201d\uff0c\u4e14\u5176\u67e5\u8be2\u5411\u91cf\u805a\u6210\u5c11\u6570\u7c07\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u514d\u8bad\u7ec3\u7684 BeaconKV\uff0c\u7528\u5c11\u91cf\u4fe1\u6807\u67e5\u8be2\u4ee3\u8868\u5168\u5c40\u67e5\u8be2\u7c07\uff0c\u9884\u6d4b\u54ea\u4e9bKV\u4f1a\u5728\u672a\u6765\u88ab\u91cd\u65b0\u5173\u6ce8\uff0c\u4ece\u800c\u538b\u7f29\u7f13\u5b58\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04971", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u73b0\u6709\u65b9\u6cd5\u7528\u8fd1\u671f\u67e5\u8be2\u4f30\u8ba1\u672a\u6765\u6ce8\u610f\u529b\u7684\u5047\u8bbe\u5728\u957f\u7a0b\u63a8\u7406\u4e2d\u5931\u6548\uff0c\u5c24\u5176\u96be\u4ee5\u6355\u6349\u56de\u770b\u65e9\u671f\u8ba1\u5212\u7b49\u8fdc\u8ddd\u4f9d\u8d56\u3002", "BeaconKV \u7ef4\u62a4\u6bcf\u4e2a\u5168\u5c40\u67e5\u8be2\u7c07\u7684\u7d27\u51d1\u4ee3\u8868\u201cbeacon queries\u201d\uff0c\u65e0\u9700\u4fdd\u5b58\u5b8c\u6574\u67e5\u8be2\u5386\u53f2\uff0c\u4e5f\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u3002", "\u57284\u4e2a\u5f00\u6e90\u5927\u63a8\u7406\u6a21\u578b\u548c\u591a\u7c7b\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u6700\u9ad8\u5b9e\u73b05.8\u500d\u663e\u5b58\u964d\u4f4e\u3001\u51e0\u4e4e\u4fdd\u6301\u5168\u7f13\u5b58\u7cbe\u5ea6\uff0c\u5e76\u5e26\u6765\u8d85\u8fc74.3\u500d\u541e\u5410\u63d0\u5347\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "KV\u7f13\u5b58", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04971v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "BeaconKV: Key-Value Cache Compression Guided by Beacon Queries for Efficient Large Reasoning Model Inference", "tldr": "\u7528\u4fe1\u6807\u67e5\u8be2\u538b\u7f29LRM\u957f\u63a8\u7406KV\u7f13\u5b58\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\u957f\u94fe\u5f0f\u63a8\u7406\u4e2d\u5b58\u5728\u4f1a\u56de\u770b\u8fdc\u7aef\u4e0a\u4e0b\u6587\u7684\u201cThought Revisiting Tokens\u201d\uff0c\u4e14\u5176\u67e5\u8be2\u5411\u91cf\u805a\u6210\u5c11\u6570\u7c07\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u514d\u8bad\u7ec3\u7684 BeaconKV\uff0c\u7528\u5c11\u91cf\u4fe1\u6807\u67e5\u8be2\u4ee3\u8868\u5168\u5c40\u67e5\u8be2\u7c07\uff0c\u9884\u6d4b\u54ea\u4e9bKV\u4f1a\u5728\u672a\u6765\u88ab\u91cd\u65b0\u5173\u6ce8\uff0c\u4ece\u800c\u538b\u7f29\u7f13\u5b58\u3002", "why_notable": "\u957fCoT\u63a8\u7406\u7684KV\u7f13\u5b58\u662f\u5927\u63a8\u7406\u6a21\u578b\u843d\u5730\u7684\u6838\u5fc3\u74f6\u9888\u4e4b\u4e00\uff1bBeaconKV\u4ece\u957f\u7a0b\u6ce8\u610f\u529b\u6a21\u5f0f\u51fa\u53d1\u6539\u8fdb\u7f13\u5b58\u4fdd\u7559\u7b56\u7565\uff0c\u5728\u514d\u8bad\u7ec3\u6761\u4ef6\u4e0b\u540c\u65f6\u63d0\u5347\u663e\u5b58\u6548\u7387\u548c\u63a8\u7406\u541e\u5410\uff0c\u5b9e\u7528\u4ef7\u503c\u8f83\u9ad8\u3002"}, {"abstract": "Designing viable drug candidates requires searching a combinatorially large and rugged chemical space for molecules that satisfy multiple, often competing, objectives. Large language models (LLMs) provide a useful generative prior for this problem because of their representational capacity, reasoning ability, and flexibility when incorporating information from the external environment. While reinforcement learning from verifiable rewards (RLVR) can be used to improve the capabilities of LLMs, many chemically relevant scoring functions require hours or even days per evaluation, making them prohibitively expensive to use directly during online training. Here, we investigate whether LLMs can learn molecular design strategies from cheaper synthetic tasks that generalize to expensive molecular lead optimization settings. We find that curriculum-based training recipes that gradually incorporate more challenging synthetic design tasks enable strong performance that surpasses that of much larger frontier models on structure-based lead optimization. Our results suggest that scaling post-training using synthetic tasks is an effective strategy for adapting LLMs to high-cost experimental scenarios that are too expensive to directly train on.", "arxiv_id": "2609.04735", "arxiv_url": "https://arxiv.org/abs/2609.04735", "authors": ["Frank Hu", "Shriram Chennakesavalu", "Zichen Wang", "Patricia Suriana", "Bodhi Vani", "Kirill Shmilovich", "Kangway Chuang", "Colin Grambow"], "brief": "\u8bba\u6587\u7814\u7a76\u5982\u4f55\u7528\u4f4e\u6210\u672c\u5408\u6210\u5206\u5b50\u8bbe\u8ba1\u4efb\u52a1\u5bf9LLM\u8fdb\u884c\u540e\u8bad\u7ec3\uff0c\u4f7f\u5176\u5b66\u5230\u53ef\u8fc1\u79fb\u7684\u5206\u5b50\u4f18\u5316\u7b56\u7565\u3002\u901a\u8fc7\u8bfe\u7a0b\u5f0f\u8bad\u7ec3\u9010\u6b65\u589e\u52a0\u4efb\u52a1\u96be\u5ea6\uff0c\u6a21\u578b\u5728\u9ad8\u6210\u672c\u7684\u7ed3\u6784\u578b\u5148\u5bfc\u5316\u5408\u7269\u4f18\u5316\u4e2d\u8d85\u8fc7\u66f4\u5927\u7684\u524d\u6cbf\u6a21\u578b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04735", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u771f\u5b9e\u5316\u5b66\u8bc4\u5206\u51fd\u6570\u8bc4\u4f30\u6602\u8d35\u7684\u95ee\u9898\uff0c\u7528\u53ef\u9a8c\u8bc1\u3001\u4f4e\u6210\u672c\u7684\u5408\u6210\u4efb\u52a1\u66ff\u4ee3\u5728\u7ebfRL\u8bad\u7ec3\u4fe1\u53f7", "\u91c7\u7528\u8bfe\u7a0b\u5b66\u4e60\u5f0f\u540e\u8bad\u7ec3\uff0c\u9010\u6b65\u5f15\u5165\u66f4\u590d\u6742\u7684\u5408\u6210\u8bbe\u8ba1\u76ee\u6807\uff0c\u63d0\u5347LLM\u7684\u5206\u5b50\u4f18\u5316\u80fd\u529b", "\u5b9e\u9a8c\u663e\u793a\u5c0f\u6a21\u578b\u53ef\u5728\u7ed3\u6784\u578b\u5148\u5bfc\u5316\u5408\u7269\u4f18\u5316\u4efb\u52a1\u4e0a\u8d85\u8d8a\u66f4\u5927\u7684\u901a\u7528\u524d\u6cbf\u6a21\u578b"], "keywords": ["\u836f\u7269\u8bbe\u8ba1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u79d1\u5b66\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04735v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Training Large Language Models for Small-Molecule Design with Synthetic Task Scaling", "tldr": "\u7528\u5408\u6210\u4efb\u52a1\u8bad\u7ec3LLM\u63d0\u5347\u5c0f\u5206\u5b50\u8bbe\u8ba1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5982\u4f55\u7528\u4f4e\u6210\u672c\u5408\u6210\u5206\u5b50\u8bbe\u8ba1\u4efb\u52a1\u5bf9LLM\u8fdb\u884c\u540e\u8bad\u7ec3\uff0c\u4f7f\u5176\u5b66\u5230\u53ef\u8fc1\u79fb\u7684\u5206\u5b50\u4f18\u5316\u7b56\u7565\u3002\u901a\u8fc7\u8bfe\u7a0b\u5f0f\u8bad\u7ec3\u9010\u6b65\u589e\u52a0\u4efb\u52a1\u96be\u5ea6\uff0c\u6a21\u578b\u5728\u9ad8\u6210\u672c\u7684\u7ed3\u6784\u578b\u5148\u5bfc\u5316\u5408\u7269\u4f18\u5316\u4e2d\u8d85\u8fc7\u66f4\u5927\u7684\u524d\u6cbf\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u201c\u5408\u6210\u4efb\u52a1\u6269\u5c55\u201d\u53ef\u4f5c\u4e3a\u9ad8\u6210\u672c\u79d1\u5b66\u5b9e\u9a8c\u573a\u666f\u4e2d\u8bad\u7ec3LLM\u7684\u6709\u6548\u8def\u5f84\uff0c\u6709\u671b\u964d\u4f4e\u836f\u7269\u8bbe\u8ba1\u4e2d\u5f3a\u5316\u5b66\u4e60\u548c\u5b9e\u9a8c\u53cd\u9988\u7684\u6210\u672c\u3002"}, {"abstract": "Where inside a language model does refusal live, and does that place change when the architecture does? In a transformer, refusal is governed by a single direction in the residual stream, a finding that safety and interpretability tooling now depend on. State-space models (SSMs) route information through a recurrent update instead of attention, sharing no token-mixing mechanism with a transformer. Does the same safety representation survive this shift, or must it be rediscovered per architecture? It survives. A single rigid rotation, which can only reorient a space and not reshape it, aligns one model\u0027s representation space with another\u0027s, so the two genuinely share the representation. A harm probe trained on a transformer then flags an SSM\u0027s harmful inputs, and removing the aligned direction makes a model answer attacks it would otherwise refuse, while a random direction of the same size does far less. What is architecture-specific is not where the direction is steered but where it must be read. Each layer computes a fresh output that is then added into the residual stream, and harm is cleanly readable at this output, the write site, before the addition. A control that holds the intervention\u0027s strength fixed shows that what matters is where the direction is estimated, not where it is applied. Applied through a detector-triggered gate, this direction lowers jailbreak success in all four architecture families we test (SSM, transformer, recurrent, hybrid), and on the SSM it holds against an attacker that tunes its prompt against the defense. The gate only matches a trivial rule that returns a fixed refusal whenever the same detector fires, so what transfers across architectures is the direction itself, not defense strength. Safety tooling built on refusal therefore ports to a new architecture by re-estimating the direction at that architecture\u0027s write site, not by rebuilding it.", "arxiv_id": "2609.04721", "arxiv_url": "https://arxiv.org/abs/2609.04721", "authors": ["Preethi Carmel Bosco", "Gopalakrishnan Srinivasan"], "brief": "\u8bba\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u201c\u62d2\u7edd\u201d\u5b89\u5168\u8868\u5f81\u662f\u5426\u4f9d\u8d56 Transformer \u6ce8\u610f\u529b\u673a\u5236\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u62d2\u7edd\u65b9\u5411\u4e0d\u4ec5\u5b58\u5728\u4e8e Transformer\uff0c\u4e5f\u53ef\u901a\u8fc7\u521a\u6027\u65cb\u8f6c\u5bf9\u9f50\u5230 SSM\u3001\u5faa\u73af\u4e0e\u6df7\u5408\u67b6\u6784\uff0c\u5e76\u80fd\u7528\u4e8e\u68c0\u6d4b\u548c\u5e72\u9884\u6709\u5bb3\u8f93\u5165\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04721", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Transformer \u4e2d\u7684\u62d2\u7edd\u65b9\u5411\u53ef\u4e0e SSM \u8868\u5f81\u7a7a\u95f4\u901a\u8fc7\u5355\u4e00\u521a\u6027\u65cb\u8f6c\u5bf9\u9f50\uff0c\u8bf4\u660e\u8be5\u8868\u5f81\u5177\u6709\u8de8\u67b6\u6784\u5171\u4eab\u6027\u3002", "\u6709\u5bb3\u6027\u63a2\u9488\u5728 Transformer \u4e0a\u8bad\u7ec3\u540e\uff0c\u53ef\u8fc1\u79fb\u5230 SSM\uff1b\u79fb\u9664\u5bf9\u9f50\u540e\u7684\u62d2\u7edd\u65b9\u5411\u4f1a\u663e\u8457\u964d\u4f4e\u6a21\u578b\u62d2\u7edd\u653b\u51fb\u63d0\u793a\u7684\u80fd\u529b\u3002", "\u67b6\u6784\u5dee\u5f02\u4e3b\u8981\u4f53\u73b0\u5728\u8bfb\u53d6\u4f4d\u7f6e\uff1a\u62d2\u7edd\u4fe1\u53f7\u66f4\u6e05\u6670\u5730\u51fa\u73b0\u5728\u6bcf\u5c42\u5199\u5165\u6b8b\u5dee\u6d41\u524d\u7684\u8f93\u51fa\u4f4d\u7f6e\uff0c\u800c\u975e\u6700\u7ec8\u6b8b\u5dee\u6d41\u672c\u8eab\u3002", "\u57fa\u4e8e\u68c0\u6d4b\u5668\u89e6\u53d1\u7684\u65b9\u5411\u95e8\u63a7\u5728 SSM\u3001Transformer\u3001\u5faa\u73af\u548c\u6df7\u5408\u67b6\u6784\u4e0a\u5747\u964d\u4f4e\u8d8a\u72f1\u6210\u529f\u7387\uff0c\u4f46\u9632\u5fa1\u5f3a\u5ea6\u672c\u8eab\u4e0d\u4e00\u5b9a\u4f18\u4e8e\u7b80\u5355\u56fa\u5b9a\u62d2\u7edd\u89c4\u5219\u3002"], "keywords": ["\u6a21\u578b\u5b89\u5168", "\u53ef\u89e3\u91ca\u6027", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "\u8868\u5f81\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04721v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Locating and Steering Refusal Beyond Attention", "tldr": "\u62d2\u7edd\u8868\u5f81\u53ef\u8de8\u6a21\u578b\u67b6\u6784\u8fc1\u79fb\u4e0e\u64cd\u63a7", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u201c\u62d2\u7edd\u201d\u5b89\u5168\u8868\u5f81\u662f\u5426\u4f9d\u8d56 Transformer \u6ce8\u610f\u529b\u673a\u5236\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u62d2\u7edd\u65b9\u5411\u4e0d\u4ec5\u5b58\u5728\u4e8e Transformer\uff0c\u4e5f\u53ef\u901a\u8fc7\u521a\u6027\u65cb\u8f6c\u5bf9\u9f50\u5230 SSM\u3001\u5faa\u73af\u4e0e\u6df7\u5408\u67b6\u6784\uff0c\u5e76\u80fd\u7528\u4e8e\u68c0\u6d4b\u548c\u5e72\u9884\u6709\u5bb3\u8f93\u5165\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660e\u62d2\u7edd\u673a\u5236\u5e76\u975e Transformer \u6ce8\u610f\u529b\u7279\u6709\uff0c\u800c\u662f\u53ef\u8de8\u67b6\u6784\u5bf9\u9f50\u7684\u5b89\u5168\u8868\u5f81\uff0c\u4e3a\u65b0\u578b\u6a21\u578b\u67b6\u6784\u4e0a\u7684\u5b89\u5168\u89e3\u91ca\u3001\u63a2\u9488\u8fc1\u79fb\u548c\u62d2\u7edd\u63a7\u5236\u63d0\u4f9b\u4e86\u53ef\u590d\u7528\u65b9\u6cd5\u3002"}, {"abstract": "Vision-language models are increasingly used as reward functions for robotic learning, but this role requires paraphrase invariance: the same trajectory should receive the same reward under semantically equivalent goal descriptions. We show that current VLM reward models often violate this property. Paraphrasing the instruction alone can substantially change predicted progress scores, and can even flip identical robot behavior between failure and success. To measure this failure mode, we introduce ROBORMBENCH, a benchmark with 2,390 real-robot trajectories, ground-truth progress labels, and 21,673 verified paraphrases spanning lexical, syntactic, and action-goal rewrites. Across proprietary and open-source VLMs, paraphrase-induced instability is widespread and severe, grows under more divergent rewrites, and is not reliably reduced by scale or explicit reasoning. Dedicated reward models trained with trajectory-grounded supervision are substantially more stable. These results show that paraphrase robustness is a core requirement for reliable VLM-based reward modeling in robotics.", "arxiv_id": "2609.05401", "arxiv_url": "https://arxiv.org/abs/2609.05401", "authors": ["Wonje Jeung", "Sangyeon Yoon", "Hyesoo Hong", "Yoonjun Cho", "Dongjae Jeon", "Bumjun Kim", "Jean Oh", "Youngjae Yu", "Albert No"], "brief": "\u8bba\u6587\u63ed\u793a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u673a\u5668\u4eba\u5b66\u4e60\u5956\u52b1\u51fd\u6570\u65f6\u7f3a\u4e4f\u201c\u91ca\u4e49\u4e0d\u53d8\u6027\u201d\uff1a\u540c\u4e00\u8f68\u8ff9\u5728\u8bed\u4e49\u7b49\u4ef7\u7684\u76ee\u6807\u63cf\u8ff0\u4e0b\u53ef\u80fd\u5f97\u5230\u4e0d\u540c\u8fdb\u5ea6\u5206\u6570\u3002\u4f5c\u8005\u63d0\u51fa ROBORMBENCH\uff0c\u7528\u771f\u5b9e\u673a\u5668\u4eba\u8f68\u8ff9\u548c\u5927\u91cf\u4eba\u5de5\u9a8c\u8bc1\u6539\u5199\u7cfb\u7edf\u8bc4\u6d4b\u8fd9\u4e00\u5931\u6548\u6a21\u5f0f\u3002", "categories": ["cs.RO", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05401", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["ROBORMBENCH \u5305\u542b 2390 \u6761\u771f\u5b9e\u673a\u5668\u4eba\u8f68\u8ff9\u3001\u771f\u5b9e\u8fdb\u5ea6\u6807\u7b7e\u548c 21673 \u4e2a\u9a8c\u8bc1\u8fc7\u7684\u91ca\u4e49\u6307\u4ee4\uff0c\u8986\u76d6\u8bcd\u6c47\u3001\u53e5\u6cd5\u4e0e\u52a8\u4f5c\u76ee\u6807\u6539\u5199\u3002", "\u591a\u79cd\u95ed\u6e90\u548c\u5f00\u6e90 VLM \u5728\u4ec5\u6539\u53d8\u6307\u4ee4\u63aa\u8f9e\u65f6\u4f1a\u51fa\u73b0\u663e\u8457\u5956\u52b1\u6ce2\u52a8\uff0c\u751a\u81f3\u628a\u540c\u4e00\u884c\u4e3a\u4ece\u5931\u8d25\u5224\u4e3a\u6210\u529f\u3002", "\u6a21\u578b\u89c4\u6a21\u589e\u5927\u6216\u663e\u5f0f\u63a8\u7406\u5e76\u4e0d\u80fd\u7a33\u5b9a\u7f13\u89e3\u8be5\u95ee\u9898\uff0c\u800c\u7528\u8f68\u8ff9\u76d1\u7763\u8bad\u7ec3\u7684\u4e13\u7528\u5956\u52b1\u6a21\u578b\u66f4\u7a33\u5065\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5956\u52b1\u6a21\u578b", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05401v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Same Trajectory, Contradictory Rewards (ROBORMBENCH): Paraphrase Fragility in Vision Language Reward Models", "tldr": "VLM\u673a\u5668\u4eba\u5956\u52b1\u6a21\u578b\u5bf9\u6539\u5199\u6307\u4ee4\u5f88\u8106\u5f31", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63ed\u793a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u673a\u5668\u4eba\u5b66\u4e60\u5956\u52b1\u51fd\u6570\u65f6\u7f3a\u4e4f\u201c\u91ca\u4e49\u4e0d\u53d8\u6027\u201d\uff1a\u540c\u4e00\u8f68\u8ff9\u5728\u8bed\u4e49\u7b49\u4ef7\u7684\u76ee\u6807\u63cf\u8ff0\u4e0b\u53ef\u80fd\u5f97\u5230\u4e0d\u540c\u8fdb\u5ea6\u5206\u6570\u3002\u4f5c\u8005\u63d0\u51fa ROBORMBENCH\uff0c\u7528\u771f\u5b9e\u673a\u5668\u4eba\u8f68\u8ff9\u548c\u5927\u91cf\u4eba\u5de5\u9a8c\u8bc1\u6539\u5199\u7cfb\u7edf\u8bc4\u6d4b\u8fd9\u4e00\u5931\u6548\u6a21\u5f0f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa VLM \u4f5c\u4e3a\u673a\u5668\u4eba\u5956\u52b1\u6a21\u578b\u7684\u4e00\u4e2a\u6838\u5fc3\u53ef\u9760\u6027\u98ce\u9669\uff1a\u5956\u52b1\u5e94\u53cd\u6620\u884c\u4e3a\u800c\u975e\u63d0\u793a\u63aa\u8f9e\u3002\u5176\u57fa\u51c6\u53ef\u5e2e\u52a9\u8bc4\u4f30\u548c\u6539\u8fdb\u673a\u5668\u4eba\u5b66\u4e60\u4e2d\u7684\u8bed\u8a00\u9c81\u68d2\u6027\uff0c\u5bf9\u5b89\u5168\u90e8\u7f72\u548c\u81ea\u52a8\u5956\u52b1\u8bbe\u8ba1\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Model upgrades are routine; memory migrations are not. An agent can keep the same memory store and still forget: a new model may interpret old notes differently, mixed embedding versions may break retrieval, and repair may fail without the original evidence. We compare memory as the same history is preserved verbatim for long-context reading (LC-RAW), divided into chunks for retrieval-augmented generation (RAG), compressed by a model into natural-language notes (NOTES), or normalized into a fixed-schema knowledge graph (KG-fixed). The study uses 48 synthetic histories with randomized answer codes, exact scoring, and two open-weight models with sub 10 billion parameters. Our measurements show that fixed-schema structures transfer reliably, with KG-fixed accuracy changing by only $+0.0004 \\pm 0.0020$ following a writer swap. Conversely, compressed NOTES exhibit high model coupling, with accuracy shifting asymmetrically by $+9.91$ or $-13.28$ percentage points depending on the specific migration direction. In RAG systems, partial embedding migrations using a 50/50 mixed index capture only a 4.96-point accuracy improvement, forfeiting the majority of the 11.90-point gain achieved through full re-embedding. Diagnostic decomposition attributes 80% ($0.467 \\pm 0.014$) of the NOTES accuracy deficit to information lost during initial construction, whereas retrieval failures drive 81% ($0.364 \\pm 0.012$) of the RAG deficit. Finally, store-only repair of NOTES fails to reach a 90% performance recovery target in all 48 test cases, whereas retaining the raw source history enables successful recovery in 34 of 48 cases for one tested direction. These findings highlight the necessity of direction-specific migration testing, strict embedding space isolation, and the retention of source histories for memory repair.", "arxiv_id": "2609.05339", "arxiv_url": "https://arxiv.org/abs/2609.05339", "authors": ["Ankit Goyal", "Jaideep Ray"], "brief": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u667a\u80fd\u4f53\u5728\u6a21\u578b\u5347\u7ea7\u540e\u590d\u7528\u65e7\u8bb0\u5fc6\u65f6\u7684\u8868\u73b0\uff0c\u8bc4\u4f30\u957f\u4e0a\u4e0b\u6587\u539f\u6587\u3001RAG \u5206\u5757\u3001\u81ea\u7136\u8bed\u8a00 NOTES \u538b\u7f29\u548c\u56fa\u5b9a\u6a21\u5f0f\u77e5\u8bc6\u56fe\u8c31\u56db\u79cd\u8bb0\u5fc6\u5f62\u5f0f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4e0d\u540c\u8bb0\u5fc6\u8868\u793a\u5bf9\u6a21\u578b\u66f4\u6362\u7684\u9c81\u68d2\u6027\u5dee\u5f02\u663e\u8457\u3002", "categories": ["cs.AI", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05339", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u56fa\u5b9a\u6a21\u5f0f\u77e5\u8bc6\u56fe\u8c31 KG-fixed \u6700\u7a33\u5b9a\uff0c\u5199\u5165\u6a21\u578b\u66f4\u6362\u540e\u51c6\u786e\u7387\u4ec5\u53d8\u5316 +0.0004 \u00b1 0.0020\u3002", "\u81ea\u7136\u8bed\u8a00 NOTES \u4e0e\u751f\u6210\u6a21\u578b\u5f3a\u8026\u5408\uff0c\u8fc1\u79fb\u65b9\u5411\u4e0d\u540c\u4f1a\u5bfc\u81f4 +9.91 \u6216 -13.28 \u4e2a\u767e\u5206\u70b9\u7684\u975e\u5bf9\u79f0\u6027\u80fd\u53d8\u5316\u3002", "RAG \u7684\u6df7\u5408\u5d4c\u5165\u7d22\u5f15\u8fc1\u79fb\u6548\u679c\u6709\u9650\uff0c50/50 \u6df7\u5408\u7d22\u5f15\u4ec5\u83b7\u5f97 4.96 \u70b9\u63d0\u5347\uff0c\u8fdc\u4f4e\u4e8e\u5168\u91cf\u91cd\u5d4c\u5165\u7684 11.90 \u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "RAG", "\u77e5\u8bc6\u56fe\u8c31"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05339v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Does Your Agent\u0027s Memory Survive a Model Upgrade? A Controlled Study of Memory Portability", "tldr": "\u7814\u7a76\u667a\u80fd\u4f53\u8bb0\u5fc6\u5728\u6a21\u578b\u5347\u7ea7\u4e2d\u7684\u53ef\u8fc1\u79fb\u6027\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u667a\u80fd\u4f53\u5728\u6a21\u578b\u5347\u7ea7\u540e\u590d\u7528\u65e7\u8bb0\u5fc6\u65f6\u7684\u8868\u73b0\uff0c\u8bc4\u4f30\u957f\u4e0a\u4e0b\u6587\u539f\u6587\u3001RAG \u5206\u5757\u3001\u81ea\u7136\u8bed\u8a00 NOTES \u538b\u7f29\u548c\u56fa\u5b9a\u6a21\u5f0f\u77e5\u8bc6\u56fe\u8c31\u56db\u79cd\u8bb0\u5fc6\u5f62\u5f0f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4e0d\u540c\u8bb0\u5fc6\u8868\u793a\u5bf9\u6a21\u578b\u66f4\u6362\u7684\u9c81\u68d2\u6027\u5dee\u5f02\u663e\u8457\u3002", "why_notable": "\u8be5\u7814\u7a76\u6307\u51fa\u667a\u80fd\u4f53\u8bb0\u5fc6\u5e76\u975e\u7b80\u5355\u6301\u4e45\u5316\u5373\u53ef\u8de8\u6a21\u578b\u590d\u7528\uff0c\u6a21\u578b\u5347\u7ea7\u53ef\u80fd\u5bfc\u81f4\u89e3\u91ca\u504f\u79fb\u3001\u68c0\u7d22\u5931\u6548\u548c\u4fee\u590d\u56f0\u96be\uff1b\u5bf9\u957f\u671f\u8bb0\u5fc6\u667a\u80fd\u4f53\u3001RAG \u7cfb\u7edf\u7ef4\u62a4\u548c\u6a21\u578b\u8fed\u4ee3\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u5de5\u7a0b\u4ef7\u503c\u3002"}, {"abstract": "Retrieval-Augmented Generation (RAG) enhances language models with external knowledge, but the lengthy retrieved context inflates the input and degrades inference efficiency. Soft context compression encodes each document into a substantially shorter embedding sequence. However, most existing approaches are trained by distilling outputs from uncompressed RAG systems, inherently limiting their performance relative to the original model. To address this limitation, we propose DEX-Comp, a two-stage training recipe: Pure Distillation warm-starts the compression model on the uncompressed RAG\u0027s correct responses only, and Hard Exploration then runs reinforcement learning solely on queries the uncompressed RAG fails, forcing the model to explore computation patterns better suited to compressed representations. On five open-domain QA benchmarks at retrieval depths from top-5 to top-30, DEX-Comp compresses retrieved contexts by $16\\times$ and accelerates inference by $4\\times$--$24\\times$, while achieving performance comparable to or exceeding the uncompressed RAG baseline across retrieval depths. Ablations and evaluations across diverse datasets and backbones further confirm the contribution of each stage and the generalization of our approach.", "arxiv_id": "2609.05152", "arxiv_url": "https://arxiv.org/abs/2609.05152", "authors": ["Shuyu Guo", "Shuo Zhang", "Zhaochun Ren"], "brief": "\u8bba\u6587\u63d0\u51faDEX-Comp\uff0c\u4e00\u79cd\u7528\u4e8eRAG\u8f6f\u4e0a\u4e0b\u6587\u538b\u7f29\u7684\u4e24\u9636\u6bb5\u8bad\u7ec3\u65b9\u6cd5\u3002\u5b83\u5148\u7528\u672a\u538b\u7f29RAG\u7684\u6b63\u786e\u7b54\u6848\u8fdb\u884c\u7eaf\u84b8\u998f\u70ed\u542f\u52a8\uff0c\u518d\u9488\u5bf9\u672a\u538b\u7f29RAG\u5931\u8d25\u7684\u95ee\u9898\u8fdb\u884c\u5f3a\u5316\u5b66\u4e60\u63a2\u7d22\uff0c\u4f7f\u538b\u7f29\u8868\u793a\u5b66\u5230\u66f4\u9002\u914d\u7684\u63a8\u7406\u6a21\u5f0f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05152", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u68c0\u7d22\u4e0a\u4e0b\u6587\u538b\u7f2916\u500d\uff0c\u5e76\u5e26\u67654\u500d\u523024\u500d\u7684\u63a8\u7406\u52a0\u901f", "\u57285\u4e2a\u5f00\u653e\u57df\u95ee\u7b54\u57fa\u51c6\u3001top-5\u5230top-30\u68c0\u7d22\u6df1\u5ea6\u4e0b\uff0c\u6027\u80fd\u53ef\u6301\u5e73\u6216\u8d85\u8fc7\u672a\u538b\u7f29RAG", "\u6d88\u878d\u5b9e\u9a8c\u8868\u660e\u7eaf\u84b8\u998f\u4e0e\u56f0\u96be\u6837\u672c\u5f3a\u5316\u63a2\u7d22\u4e24\u4e2a\u9636\u6bb5\u5747\u6709\u8d21\u732e\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u4e0d\u540c\u6570\u636e\u96c6\u548c\u6a21\u578b\u9aa8\u5e72"], "keywords": ["RAG", "\u4e0a\u4e0b\u6587\u538b\u7f29", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05152v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Compression Beyond the Uncompressed: A Two-Stage Training Recipe for Soft Context Compression in RAG", "tldr": "DEX-Comp\u8ba9\u538b\u7f29RAG\u6027\u80fd\u8d85\u8d8a\u672a\u538b\u7f29\u57fa\u7ebf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faDEX-Comp\uff0c\u4e00\u79cd\u7528\u4e8eRAG\u8f6f\u4e0a\u4e0b\u6587\u538b\u7f29\u7684\u4e24\u9636\u6bb5\u8bad\u7ec3\u65b9\u6cd5\u3002\u5b83\u5148\u7528\u672a\u538b\u7f29RAG\u7684\u6b63\u786e\u7b54\u6848\u8fdb\u884c\u7eaf\u84b8\u998f\u70ed\u542f\u52a8\uff0c\u518d\u9488\u5bf9\u672a\u538b\u7f29RAG\u5931\u8d25\u7684\u95ee\u9898\u8fdb\u884c\u5f3a\u5316\u5b66\u4e60\u63a2\u7d22\uff0c\u4f7f\u538b\u7f29\u8868\u793a\u5b66\u5230\u66f4\u9002\u914d\u7684\u63a8\u7406\u6a21\u5f0f\u3002", "why_notable": "\u73b0\u6709\u8f6f\u538b\u7f29\u65b9\u6cd5\u53d7\u9650\u4e8e\u84b8\u998f\u672a\u538b\u7f29RAG\uff0c\u901a\u5e38\u96be\u4ee5\u8d85\u8fc7\u6559\u5e08\u6a21\u578b\uff1b\u8be5\u65b9\u6cd5\u901a\u8fc7\u5728\u5931\u8d25\u6837\u672c\u4e0a\u5f3a\u5316\u5b66\u4e60\u63a2\u7d22\uff0c\u5c55\u793a\u4e86\u538b\u7f29\u540e\u4e0d\u4ec5\u80fd\u63d0\u901f\uff0c\u8fd8\u53ef\u80fd\u63d0\u5347RAG\u6548\u679c\uff0c\u5177\u6709\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Leveraging their inherent sparse event-driven computation, spiking neural networks (SNNs) offer a promising path toward energy-efficient large language models (LLMs). Time-to-first-spike (TTFS) coding generates at most one spike per neuron within a time window, yielding extremely low firing rates. However, conventional TTFS SNNs are restricted to specific structures, making it challenging to encode certain blocks in LLM -- such as layer normalization and matrix multiplication --using TTFS. To overcome this limitation, we introduce a reference-based strategy specifically to encode the four core LLM components: embedding layers, layer normalization, attention-related operations and dropout. We construct a fully TTFS-based SNN architecture and train it end-to-end. Experiments on modern LLMs like BERT and GPT-2 demonstrate that our approach achieves performance comparable to ANN counterparts on natural language understanding and common-sense reasoning, while a clear gap remains on language modeling perplexity. To the best of our knowledge, this is the first work to scale a spiking LLM to 1.5 billion parameters using TTFS coding. We also report an estimate of spike-related energy; this is a spike-count proxy under an established cost model rather than a measurement on neuromorphic hardware.", "arxiv_id": "2609.05151", "arxiv_url": "https://arxiv.org/abs/2609.05151", "authors": ["Zhuoya Zhao", "Parsa Omidi", "Aref Jafari", "Richard Naud"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u53c2\u8003\u503c\u7684\u7f16\u7801\u7b56\u7565\uff0c\u5c06\u5d4c\u5165\u5c42\u3001\u5c42\u5f52\u4e00\u5316\u3001\u6ce8\u610f\u529b\u76f8\u5173\u64cd\u4f5c\u548cdropout\u7b49LLM\u6838\u5fc3\u7ec4\u4ef6\u6539\u9020\u6210TTFS\u8109\u51b2\u795e\u7ecf\u7f51\u7edc\u5f62\u5f0f\uff0c\u5e76\u7aef\u5230\u7aef\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u5728BERT\u3001GPT-2\u7b49\u6a21\u578b\u4e0a\u5b9e\u73b0\u4e86\u6bcf\u4e2a\u795e\u7ecf\u5143\u65f6\u95f4\u7a97\u5185\u6700\u591a\u4e00\u6b21\u8109\u51b2\u7684\u4f4e\u53d1\u653e\u7387LLM\u3002", "categories": ["cs.NE", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05151", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u4f20\u7edfTTFS\u96be\u4ee5\u8868\u793a\u5c42\u5f52\u4e00\u5316\u3001\u77e9\u9635\u4e58\u6cd5\u7b49LLM\u6a21\u5757\u7684\u95ee\u9898\uff0c\u8bbe\u8ba1\u53c2\u8003\u503c\u7f16\u7801\u6765\u8986\u76d6\u56db\u7c7b\u6838\u5fc3\u7ec4\u4ef6\u3002", "\u6784\u5efa\u5168TTFS\u5316\u7684\u8109\u51b2LLM\u67b6\u6784\uff0c\u5e76\u5728\u81ea\u7136\u8bed\u8a00\u7406\u89e3\u548c\u5e38\u8bc6\u63a8\u7406\u4efb\u52a1\u4e0a\u8fbe\u5230\u63a5\u8fd1ANN\u6a21\u578b\u7684\u6027\u80fd\u3002", "\u9996\u6b21\u5c06TTFS\u8109\u51b2LLM\u6269\u5c55\u523015\u4ebf\u53c2\u6570\u89c4\u6a21\uff0c\u4f46\u8bed\u8a00\u5efa\u6a21\u56f0\u60d1\u5ea6\u4ecd\u4e0e\u5e38\u89c4ANN\u5b58\u5728\u660e\u663e\u5dee\u8ddd\uff1b\u80fd\u8017\u7ed3\u679c\u4e3a\u57fa\u4e8e\u8109\u51b2\u8ba1\u6570\u7684\u4ee3\u7406\u4f30\u8ba1\u3002"], "keywords": ["\u8109\u51b2\u795e\u7ecf\u7f51\u7edc", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4f4e\u529f\u8017\u8ba1\u7b97", "\u795e\u7ecf\u5f62\u6001\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05151v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Large Language Models with At Most One Spike per Neuron", "tldr": "\u9996\u4e2a15\u4ebf\u53c2\u6570TTFS\u8109\u51b2LLM", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u53c2\u8003\u503c\u7684\u7f16\u7801\u7b56\u7565\uff0c\u5c06\u5d4c\u5165\u5c42\u3001\u5c42\u5f52\u4e00\u5316\u3001\u6ce8\u610f\u529b\u76f8\u5173\u64cd\u4f5c\u548cdropout\u7b49LLM\u6838\u5fc3\u7ec4\u4ef6\u6539\u9020\u6210TTFS\u8109\u51b2\u795e\u7ecf\u7f51\u7edc\u5f62\u5f0f\uff0c\u5e76\u7aef\u5230\u7aef\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u5728BERT\u3001GPT-2\u7b49\u6a21\u578b\u4e0a\u5b9e\u73b0\u4e86\u6bcf\u4e2a\u795e\u7ecf\u5143\u65f6\u95f4\u7a97\u5185\u6700\u591a\u4e00\u6b21\u8109\u51b2\u7684\u4f4e\u53d1\u653e\u7387LLM\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u6781\u4f4e\u53d1\u653e\u7387\u7684TTFS\u8109\u51b2\u7f16\u7801\u63a8\u8fdb\u5230\u73b0\u4ee3\u5927\u8bed\u8a00\u6a21\u578b\u89c4\u6a21\uff0c\u4e3a\u4f4e\u529f\u8017LLM\u548c\u795e\u7ecf\u5f62\u6001\u8ba1\u7b97\u63d0\u4f9b\u4e86\u65b0\u7684\u53ef\u884c\u8def\u5f84\uff0c\u540c\u65f6\u4e5f\u660e\u786e\u66b4\u9732\u4e86\u751f\u6210\u5f0f\u8bed\u8a00\u5efa\u6a21\u4e0a\u7684\u6027\u80fd\u74f6\u9888\u3002"}, {"abstract": "Group relative policy optimization for reinforcement learning with verifiable rewards (RLVR) typically uses a fixed importance-sampling (IS) ratio clipping boundary across all rollouts. We identify a key limitation: rare correct rollouts on harder problems and abundant correct rollouts on easier problems are clipped at comparable rates, despite contributing very different learning signals. Rollouts with low group success exhibit larger IS ratios and carry stronger gradient signal for exploration and solving new problems, yet are disproportionately suppressed by fixed clipping. To address this, we propose Group Adaptive Clipping Policy Optimization (GAPO), a plug-in modification to GRPO methods that adapts the clipping boundary to the rollout advantage. GAPO is motivated by a reverse-KL trust-region perspective, which suggests that rollouts with larger learning signal should receive proportionally greater update headroom. GAPO requires no reward shaping and preserves the standard PPO/GSPO surrogate while adapting only the clipping threshold. Across Qwen and Llama models, GAPO consistently improves both Pass@1 and Pass@k over fixed clipping and advantage-shaping baselines on math reasoning and coding benchmarks where the pass rates by the base model are relatively low.", "arxiv_id": "2609.00444", "arxiv_url": "https://arxiv.org/abs/2609.00444", "authors": ["Sheng Jia", "Xiao Wang", "Shiva Prasad Kasiviswanathan", "Rein Houthooft"], "brief": "\u8bba\u6587\u63d0\u51fa Group Adaptive Clipping Policy Optimization\uff08GAPO\uff09\uff0c\u4f5c\u4e3a GRPO \u7c7b\u65b9\u6cd5\u7684\u5373\u63d2\u5373\u7528\u6539\u8fdb\u3002\u5b83\u6839\u636e rollout \u7684\u4f18\u52bf\u52a8\u6001\u8c03\u6574\u91cd\u8981\u6027\u91c7\u6837\u6bd4\u7387\u88c1\u526a\u8fb9\u754c\uff0c\u8ba9\u66f4\u6709\u5b66\u4e60\u4ef7\u503c\u7684\u6837\u672c\u83b7\u5f97\u66f4\u5927\u66f4\u65b0\u7a7a\u95f4\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00444", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u56fa\u5b9a IS ratio \u88c1\u526a\u4f1a\u540c\u7b49\u538b\u5236\u7b80\u5355\u9898\u548c\u96be\u9898\u4e2d\u7684\u6b63\u786e rollout\uff0c\u5bfc\u81f4\u96be\u9898\u4e2d\u7a00\u6709\u6b63\u786e\u6837\u672c\u7684\u5f3a\u68af\u5ea6\u4fe1\u53f7\u88ab\u8fc7\u5ea6\u524a\u5f31\u3002", "\u4ece reverse-KL trust-region \u89c6\u89d2\u51fa\u53d1\uff0c\u63d0\u51fa\u6309 rollout advantage \u81ea\u9002\u5e94\u653e\u5bbd\u88c1\u526a\u9608\u503c\uff0c\u800c\u4e0d\u6539\u53d8\u6807\u51c6 PPO/GSPO surrogate\u3002", "\u5728 Qwen \u548c Llama \u6a21\u578b\u4e0a\uff0cGAPO \u5728\u6570\u5b66\u63a8\u7406\u4e0e\u4ee3\u7801\u57fa\u51c6\u4e2d\u76f8\u8f83\u56fa\u5b9a\u88c1\u526a\u548c advantage shaping \u57fa\u7ebf\u7a33\u5b9a\u63d0\u5347 Pass@1 \u4e0e Pass@k\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u5b66\u63a8\u7406", "\u4ee3\u7801\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Amazon", "pdf_url": "https://arxiv.org/pdf/2609.00444v1", "published_at": "2026-08-31", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00444.png", "title": "Group Adaptive Clipping Policy Optimization", "tldr": "\u81ea\u9002\u5e94\u88c1\u526a\u63d0\u5347RLVR\u96be\u9898\u5b66\u4e60\u4fe1\u53f7\u3002", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Group Adaptive Clipping Policy Optimization\uff08GAPO\uff09\uff0c\u4f5c\u4e3a GRPO \u7c7b\u65b9\u6cd5\u7684\u5373\u63d2\u5373\u7528\u6539\u8fdb\u3002\u5b83\u6839\u636e rollout \u7684\u4f18\u52bf\u52a8\u6001\u8c03\u6574\u91cd\u8981\u6027\u91c7\u6837\u6bd4\u7387\u88c1\u526a\u8fb9\u754c\uff0c\u8ba9\u66f4\u6709\u5b66\u4e60\u4ef7\u503c\u7684\u6837\u672c\u83b7\u5f97\u66f4\u5927\u66f4\u65b0\u7a7a\u95f4\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9 RLVR/GRPO \u8bad\u7ec3\u4e2d\u7684\u5173\u952e\u7ec6\u8282\u2014\u2014\u88c1\u526a\u7b56\u7565\u2014\u2014\u7ed9\u51fa\u7b80\u5355\u6709\u6548\u7684\u6539\u8fdb\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u57fa\u7840\u6a21\u578b\u901a\u8fc7\u7387\u8f83\u4f4e\u3001\u6b63\u786e\u6837\u672c\u7a00\u7f3a\u7684\u63a8\u7406\u4e0e\u4ee3\u7801\u4efb\u52a1\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Quantization is widely used to reduce the computational and memory demands of neural-network inference. In recurrent networks, however, the quantized state is stored and returned at the next time step, so the rule used to store that state can alter subsequent computations. Here, we introduce recurrent-state write-back to denote this rule and isolate its effect in a compact GRU encoder--decoder for fluorescence lifetime imaging, a molecular imaging modality used in quantitative biological imaging. A central task is estimating two lifetime parameters, the short-lived component \u03c41 and the long-lived component \u03c42, from high-noise time-resolved fluorescence signals. Holding the trained model fixed, replacing continuous state propagation with deterministic 4-bit state storage increases estimation errors for \u03c41 and \u03c42 by approximately 70x and 300x, respectively. Failure occurs when repeated small updates remain below the write threshold, leaving the stored state nearly fixed while the network continues to propose change. Error feedback, residual memory, and direction memory carry information from these suppressed updates across time and recover accuracy without retraining. Precision sweeps show that increasing state precision can worsen a fixed recurrent solution, while matched training shows that compatibility with the state interface can be learned. To test whether this behavior extends beyond the GRU, we repeat the post-training intervention in an independently trained LSTM, where coarse write-back reproduces the failure, error feedback restores accuracy, and state-specific interventions reveal greater sensitivity of the cell state than the hidden state. Our results establish recurrent-state write-back as a key determinant of low-precision recurrent dynamics and identify the state-storage interface as a central design consideration for quantized recurrent inference.", "arxiv_id": "2609.04490", "arxiv_url": "https://arxiv.org/abs/2609.04490", "authors": ["Ismail Erbas", "Xavier Intes", "Vikas Pandey"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u5faa\u73af\u72b6\u6001\u5199\u56de\u201d\u6982\u5ff5\uff0c\u7814\u7a76\u4f4e\u7cbe\u5ea6\u63a8\u7406\u4e2d\u5faa\u73af\u7f51\u7edc\u5982\u4f55\u5b58\u50a8\u5e76\u590d\u7528\u91cf\u5316\u72b6\u6001\u3002\u4f5c\u8005\u5728\u7528\u4e8e\u8367\u5149\u5bff\u547d\u6210\u50cf\u7684 GRU/LSTM \u6a21\u578b\u4e2d\u53d1\u73b0\uff0c\u7c97\u7c92\u5ea6\u72b6\u6001\u5199\u56de\u4f1a\u663e\u8457\u653e\u5927\u53c2\u6570\u4f30\u8ba1\u8bef\u5dee\uff0c\u800c\u8bef\u5dee\u53cd\u9988\u3001\u6b8b\u5dee\u8bb0\u5fc6\u548c\u65b9\u5411\u8bb0\u5fc6\u53ef\u5728\u65e0\u9700\u91cd\u8bad\u4e0b\u6062\u590d\u7cbe\u5ea6\u3002", "categories": ["cs.AI", "cs.LG", "physics.optics", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04490", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u56fa\u5b9a\u5df2\u8bad\u7ec3 GRU \u540e\uff0c\u5c06\u8fde\u7eed\u72b6\u6001\u4f20\u64ad\u66ff\u6362\u4e3a\u786e\u5b9a\u6027 4-bit \u72b6\u6001\u5b58\u50a8\uff0c\u4f7f \u03c41 \u548c \u03c42 \u4f30\u8ba1\u8bef\u5dee\u5206\u522b\u589e\u52a0\u7ea6 70 \u500d\u548c 300 \u500d\u3002", "\u5931\u6548\u539f\u56e0\u662f\u53cd\u590d\u7684\u5c0f\u5e45\u72b6\u6001\u66f4\u65b0\u4f4e\u4e8e\u5199\u5165\u9608\u503c\uff0c\u5bfc\u81f4\u5b58\u50a8\u72b6\u6001\u51e0\u4e4e\u4e0d\u53d8\uff0c\u5faa\u73af\u52a8\u6001\u88ab\u7834\u574f\u3002", "\u5728\u72ec\u7acb\u8bad\u7ec3\u7684 LSTM \u4e0a\u590d\u73b0\u5b9e\u9a8c\uff0c\u53d1\u73b0\u7c97\u91cf\u5316\u5199\u56de\u540c\u6837\u5931\u6548\uff0c\u4e14 cell state \u6bd4 hidden state \u5bf9\u72b6\u6001\u5199\u56de\u66f4\u654f\u611f\u3002"], "keywords": ["\u91cf\u5316", "\u5faa\u73af\u795e\u7ecf\u7f51\u7edc", "\u4f4e\u7cbe\u5ea6\u63a8\u7406", "\u751f\u7269\u533b\u5b66\u6210\u50cf"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04490v1", "published_at": "2026-09-03", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04490.png", "title": "When Quantization Breaks Memory: Recurrent-State Write-Back in Low-Precision Temporal Inference", "tldr": "\u63ed\u793a\u4f4e\u7cbe\u5ea6\u91cf\u5316\u4f1a\u7834\u574f\u5faa\u73af\u7f51\u7edc\u72b6\u6001\u8bb0\u5fc6", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u5faa\u73af\u72b6\u6001\u5199\u56de\u201d\u6982\u5ff5\uff0c\u7814\u7a76\u4f4e\u7cbe\u5ea6\u63a8\u7406\u4e2d\u5faa\u73af\u7f51\u7edc\u5982\u4f55\u5b58\u50a8\u5e76\u590d\u7528\u91cf\u5316\u72b6\u6001\u3002\u4f5c\u8005\u5728\u7528\u4e8e\u8367\u5149\u5bff\u547d\u6210\u50cf\u7684 GRU/LSTM \u6a21\u578b\u4e2d\u53d1\u73b0\uff0c\u7c97\u7c92\u5ea6\u72b6\u6001\u5199\u56de\u4f1a\u663e\u8457\u653e\u5927\u53c2\u6570\u4f30\u8ba1\u8bef\u5dee\uff0c\u800c\u8bef\u5dee\u53cd\u9988\u3001\u6b8b\u5dee\u8bb0\u5fc6\u548c\u65b9\u5411\u8bb0\u5fc6\u53ef\u5728\u65e0\u9700\u91cd\u8bad\u4e0b\u6062\u590d\u7cbe\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5faa\u73af\u7f51\u7edc\u91cf\u5316\u7684\u5173\u952e\u98ce\u9669\u4e0d\u53ea\u662f\u7b97\u5b50\u7cbe\u5ea6\uff0c\u800c\u662f\u8de8\u65f6\u95f4\u6b65\u5b58\u50a8\u72b6\u6001\u7684\u5199\u56de\u63a5\u53e3\uff1b\u8fd9\u5bf9\u4f4e\u529f\u8017\u65f6\u5e8f\u63a8\u7406\u3001\u8fb9\u7f18\u90e8\u7f72\u548c\u751f\u7269\u533b\u5b66\u6210\u50cf\u7b49\u9ad8\u566a\u58f0\u5e94\u7528\u5177\u6709\u5b9e\u9645\u8bbe\u8ba1\u4ef7\u503c\u3002"}, {"abstract": "Repository-scale refactoring requires coding agents to propagate a single change across many interdependent files without altering program behavior, yet to our knowledge no existing harness isolates the design choices that determine agent success on this task. We present RefactorPlatform, an open-source evaluation harness that holds the environment fixed and varies each design axis explicitly: model backbone (via OpenRouter and GitHub Copilot CLI), execution regime (baseline, retrieval-augmented, and multi-agent), and prompt specificity. Each run executes in an isolated workspace with live terminal streaming, per-task logging of tokens, diffs, and transcripts, AST-based verification, and exportable telemetry for audit and reproduction. Demonstrating the platform on 100 multi-file RefactorBench tasks across four model families, we illustrate the analyses it supports: AST-aware chunking outperforms naive token-window chunking by 25-30% across prompt modes, whereas naive retrieval falls below the retrieval-free baseline; a lean retrieval-augmented single agent (86%) beats the sub-agent configuration we evaluated (66%) on matched tasks with no task passing under delegation that fails under retrieval; and retrieval\u0027s accuracy gains absorb its token overhead, leaving cost per successful refactoring unchanged. RefactorPlatform is open-sourced to make refactoring-agent evaluation reproducible and auditable.", "arxiv_id": "2609.04898", "arxiv_url": "https://arxiv.org/abs/2609.04898", "authors": ["Aziz Ben Amor", "Drish Mali", "Mann Acharya", "Vijayasri Iyer", "S\u00e9bastien Brati\u00e8res"], "brief": "\u8bba\u6587\u63d0\u51fa RefactorPlatform\uff0c\u4e00\u4e2a\u7528\u4e8e\u53ef\u63a7\u8bc4\u4f30\u4ed3\u5e93\u7ea7\u91cd\u6784\u667a\u80fd\u4f53\u7684\u5f00\u6e90\u6d4b\u8bd5\u6846\u67b6\u3002\u5b83\u56fa\u5b9a\u6267\u884c\u73af\u5883\uff0c\u7cfb\u7edf\u6bd4\u8f83\u6a21\u578b\u9aa8\u5e72\u3001\u68c0\u7d22\u589e\u5f3a\u3001\u591a\u667a\u80fd\u4f53\u6267\u884c\u4e0e\u63d0\u793a\u5177\u4f53\u6027\u7b49\u8bbe\u8ba1\u56e0\u7d20\u5bf9\u91cd\u6784\u6210\u529f\u7387\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04898", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6bcf\u6b21\u8fd0\u884c\u5728\u9694\u79bb\u5de5\u4f5c\u533a\u6267\u884c\uff0c\u652f\u6301\u7ec8\u7aef\u6d41\u5f0f\u8f93\u51fa\u3001token/\u4ee3\u7801 diff/\u5bf9\u8bdd\u65e5\u5fd7\u8bb0\u5f55\u3001AST \u9a8c\u8bc1\u4e0e\u53ef\u5bfc\u51fa\u9065\u6d4b\u6570\u636e", "\u5728 100 \u4e2a\u591a\u6587\u4ef6 RefactorBench \u4efb\u52a1\u4e0a\u6d4b\u8bd5\u56db\u7c7b\u6a21\u578b\uff0c\u53d1\u73b0 AST \u611f\u77e5\u5207\u5757\u6bd4\u6734\u7d20 token \u7a97\u53e3\u5207\u5757\u9ad8 25-30%", "\u6734\u7d20\u68c0\u7d22\u4f4e\u4e8e\u65e0\u68c0\u7d22\u57fa\u7ebf\uff1b\u7cbe\u7b80\u7684\u68c0\u7d22\u589e\u5f3a\u5355\u667a\u80fd\u4f53\u6210\u529f\u7387\u8fbe 86%\uff0c\u4f18\u4e8e\u6240\u8bc4\u4f30\u7684\u591a\u5b50\u667a\u80fd\u4f53\u914d\u7f6e 66%"], "keywords": ["\u4ee3\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8bc4\u6d4b\u6846\u67b6", "\u4ee3\u7801\u91cd\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04898v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RefactorPlatform: An Open-Source Harness for Controlled Evaluation of Repository-Scale Refactoring Agents", "tldr": "\u5f00\u6e90\u4ed3\u5e93\u7ea7\u91cd\u6784\u667a\u80fd\u4f53\u8bc4\u6d4b\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RefactorPlatform\uff0c\u4e00\u4e2a\u7528\u4e8e\u53ef\u63a7\u8bc4\u4f30\u4ed3\u5e93\u7ea7\u91cd\u6784\u667a\u80fd\u4f53\u7684\u5f00\u6e90\u6d4b\u8bd5\u6846\u67b6\u3002\u5b83\u56fa\u5b9a\u6267\u884c\u73af\u5883\uff0c\u7cfb\u7edf\u6bd4\u8f83\u6a21\u578b\u9aa8\u5e72\u3001\u68c0\u7d22\u589e\u5f3a\u3001\u591a\u667a\u80fd\u4f53\u6267\u884c\u4e0e\u63d0\u793a\u5177\u4f53\u6027\u7b49\u8bbe\u8ba1\u56e0\u7d20\u5bf9\u91cd\u6784\u6210\u529f\u7387\u7684\u5f71\u54cd\u3002", "why_notable": "\u4ed3\u5e93\u7ea7\u91cd\u6784\u662f\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u91cd\u8981\u5b9e\u9645\u80fd\u529b\uff0c\u4f46\u6b64\u524d\u7f3a\u5c11\u53ef\u590d\u73b0\u3001\u53ef\u5ba1\u8ba1\u4e14\u80fd\u9694\u79bb\u53d8\u91cf\u7684\u8bc4\u6d4b\u5de5\u5177\u3002\u8be5\u5e73\u53f0\u4e3a\u6bd4\u8f83\u4e0d\u540c\u667a\u80fd\u4f53\u67b6\u6784\u3001\u68c0\u7d22\u7b56\u7565\u548c\u63d0\u793a\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u6807\u51c6\u5316\u57fa\u7840\uff0c\u5e76\u63ed\u793a\u4e86\u591a\u667a\u80fd\u4f53\u4e0e\u68c0\u7d22\u5e76\u4e0d\u603b\u662f\u5e26\u6765\u6536\u76ca\u3002"}, {"abstract": "Text-to-audio-video (T2AV) generation has advanced rapidly, but its evaluation still underestimates the audio modality. Existing benchmarks either treat audio as an auxiliary component of video quality or assess it in isolation from audiovisual grounding, making it difficult to diagnose where current systems truly succeed or fail in audio generation. We present PRISM-Bench, the first audio-centric diagnostic benchmark for T2AV generation. Built from a rigorously curated dataset of 900 human-verified samples, PRISM-Bench factorizes audio evaluation along two orthogonal axes: audio type (Speech, Music, and Sound) and sound-source visibility (On-screen vs. Off-screen). It evaluates generated content across four perceptual dimensions (Audio-Visual Coherence, Audio Quality, Audio Expressiveness, and Prompt Following) with 35 fine-grained criteria. To ensure reliable assessment, we adopt an enhanced MLLM-as-a-Judge protocol based on blind, side-by-side comparison against ground-truth references, demonstrating strong alignment (over 70% mean agreement) with human raters. Our evaluation of recent T2AV systems highlights a significant performance gap between frontier and open-source models. Furthermore, we demonstrate that current generation paradigms overfit to perceptual fidelity while struggling with complex grounding and control tasks, particularly in generating music and synchronized On-screen audio.", "arxiv_id": "2609.04867", "arxiv_url": "https://arxiv.org/abs/2609.04867", "authors": ["Yuchen Sun", "Qian Yang", "Jun Wang", "Detai Xin", "Guoqiao Yu", "Guanglu Wan", "Qi Jia"], "brief": "PRISM-Bench \u662f\u9762\u5411\u6587\u672c\u5230\u97f3\u9891\u89c6\u9891\u751f\u6210\u7684\u97f3\u9891\u4e2d\u5fc3\u8bca\u65ad\u57fa\u51c6\uff0c\u57fa\u4e8e900\u4e2a\u4eba\u5de5\u9a8c\u8bc1\u6837\u672c\uff0c\u4ece\u97f3\u9891\u7c7b\u578b\u4e0e\u58f0\u6e90\u53ef\u89c1\u6027\u4e24\u6761\u8f74\u7ebf\u7cfb\u7edf\u8bc4\u4f30\u751f\u6210\u97f3\u9891\u3002\u5b83\u75284\u4e2a\u611f\u77e5\u7ef4\u5ea6\u300135\u9879\u7ec6\u7c92\u5ea6\u6807\u51c6\uff0c\u5e76\u7ed3\u5408\u589e\u5f3a\u7248 MLLM-as-a-Judge \u4e0e\u4eba\u5de5\u8bc4\u6d4b\u5bf9\u9f50\u3002", "categories": ["cs.MM", "cs.AI", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04867", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6309 Speech\u3001Music\u3001Sound \u4e09\u7c7b\u97f3\u9891\uff0c\u4ee5\u53ca On-screen/Off-screen \u58f0\u6e90\u53ef\u89c1\u6027\u8fdb\u884c\u56e0\u5b50\u5316\u8bc4\u4f30", "\u8986\u76d6\u97f3\u89c6\u9891\u4e00\u81f4\u6027\u3001\u97f3\u9891\u8d28\u91cf\u3001\u97f3\u9891\u8868\u73b0\u529b\u3001\u63d0\u793a\u8bcd\u9075\u5faa4\u4e2a\u7ef4\u5ea6\uff0c\u517135\u9879\u7ec6\u7c92\u5ea6\u51c6\u5219", "\u76f2\u6d4b\u5e76\u6392\u6bd4\u8f83\u751f\u6210\u7ed3\u679c\u4e0e\u771f\u5b9e\u53c2\u8003\uff0cMLLM\u8bc4\u5ba1\u4e0e\u4eba\u7c7b\u8bc4\u5ba1\u5e73\u5747\u4e00\u81f4\u7387\u8d85\u8fc770%"], "keywords": ["\u591a\u6a21\u6001", "\u97f3\u9891\u751f\u6210", "\u89c6\u9891\u751f\u6210", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04867v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "PRISM-Bench: An Audio-Centric Diagnostic Benchmark for Text-to-Audio-Video Generation", "tldr": "\u9996\u4e2a\u97f3\u9891\u4e2d\u5fc3T2AV\u8bca\u65ad\u57fa\u51c6", "upvotes": 0, "what_it_is": "PRISM-Bench \u662f\u9762\u5411\u6587\u672c\u5230\u97f3\u9891\u89c6\u9891\u751f\u6210\u7684\u97f3\u9891\u4e2d\u5fc3\u8bca\u65ad\u57fa\u51c6\uff0c\u57fa\u4e8e900\u4e2a\u4eba\u5de5\u9a8c\u8bc1\u6837\u672c\uff0c\u4ece\u97f3\u9891\u7c7b\u578b\u4e0e\u58f0\u6e90\u53ef\u89c1\u6027\u4e24\u6761\u8f74\u7ebf\u7cfb\u7edf\u8bc4\u4f30\u751f\u6210\u97f3\u9891\u3002\u5b83\u75284\u4e2a\u611f\u77e5\u7ef4\u5ea6\u300135\u9879\u7ec6\u7c92\u5ea6\u6807\u51c6\uff0c\u5e76\u7ed3\u5408\u589e\u5f3a\u7248 MLLM-as-a-Judge \u4e0e\u4eba\u5de5\u8bc4\u6d4b\u5bf9\u9f50\u3002", "why_notable": "\u8be5\u57fa\u51c6\u8865\u8db3\u4e86\u73b0\u6709T2AV\u8bc4\u6d4b\u4f4e\u4f30\u97f3\u9891\u3001\u7f3a\u5c11\u97f3\u89c6\u9891 grounding \u8bca\u65ad\u7684\u95ee\u9898\uff0c\u63ed\u793a\u524d\u6cbf\u6a21\u578b\u4e0e\u5f00\u6e90\u6a21\u578b\u5dee\u8ddd\uff0c\u5e76\u6307\u51fa\u5f53\u524d\u65b9\u6cd5\u5728\u97f3\u4e50\u751f\u6210\u548c\u5c4f\u5e55\u5185\u540c\u6b65\u97f3\u9891\u63a7\u5236\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3\u3002"}, {"abstract": "As vision-language models (VLMs) rapidly advance in image understanding, cross-modal reasoning, and complex instruction execution, instruction-following capability has become a key indicator of their reliability and practicality. However, existing multimodal instruction-following benchmarks still suffer from limited language coverage and insufficient adversarial safety scenarios, making them inadequate for evaluating real-world multilingual and safety-sensitive settings. To address these gaps, we present MM-IFEval-Pro, a multimodal instruction-following benchmark covering Chinese and English tasks as well as diverse instruction hijacking cases. MM-IFEval-Pro includes 4 major task categories and 24 subcategories and 8 instruction categories with 52 subcategories, with each sample containing an average of 3.0 constraints to realistically simulate complex instruction scenarios. We further construct a reinforcement-learning training set enriched with Chinese and adversarial instructions, which significantly improves model performance on MM-IFEval-Pro and transfers effectively to other mainstream multimodal benchmarks, demonstrating strong cross-task and cross-language generalization.", "arxiv_id": "2609.04859", "arxiv_url": "https://arxiv.org/abs/2609.04859", "authors": ["Changming Xiao", "Zhenliang Ni", "Jinhui He", "Han Shu", "Jie Hu"], "brief": "\u8bba\u6587\u63d0\u51fa MM-IFEval-Pro\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u591a\u6a21\u6001\u6307\u4ee4\u8ddf\u968f\u57fa\u51c6\uff0c\u8986\u76d6\u4e2d\u82f1\u6587\u4efb\u52a1\u4e0e\u591a\u7c7b\u6307\u4ee4\u52ab\u6301\u573a\u666f\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u542b\u4e2d\u6587\u4e0e\u5bf9\u6297\u6307\u4ee4\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u96c6\uff0c\u7528\u4e8e\u63d0\u5347\u6a21\u578b\u5728\u590d\u6742\u7ea6\u675f\u4e0b\u7684\u6307\u4ee4\u6267\u884c\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04859", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u5305\u542b4\u5927\u4efb\u52a1\u7c7b\u522b\u300124\u4e2a\u5b50\u7c7b\uff0c\u4ee5\u53ca8\u7c7b\u6307\u4ee4\u300152\u4e2a\u5b50\u7c7b\uff0c\u5e73\u5747\u6bcf\u4e2a\u6837\u672c\u542b3.0\u4e2a\u7ea6\u675f\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u590d\u6742\u6307\u4ee4\u573a\u666f", "\u91cd\u70b9\u8865\u8db3\u73b0\u6709\u591a\u6a21\u6001\u6307\u4ee4\u8ddf\u968f\u8bc4\u6d4b\u5728\u591a\u8bed\u8a00\u8986\u76d6\u548c\u5bf9\u6297\u5b89\u5168\u573a\u666f\u4e0a\u7684\u4e0d\u8db3", "\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u96c6\u53ef\u663e\u8457\u63d0\u5347 MM-IFEval-Pro \u8868\u73b0\uff0c\u5e76\u8fc1\u79fb\u5230\u5176\u4ed6\u4e3b\u6d41\u591a\u6a21\u6001\u57fa\u51c6\uff0c\u4f53\u73b0\u8de8\u4efb\u52a1\u3001\u8de8\u8bed\u8a00\u6cdb\u5316"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6307\u4ee4\u8ddf\u968f", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04859v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MM-IFEval-Pro: A Mult
