const PAPERS = [{"abstract": "Designing and authoring high-performance custom kernels for accelerators is a complex task that requires deep hardware-level expertise. Large Language Models (LLM) can be leveraged together with real-time compiler feedback to build agentic systems for kernel generation. In this work, we present MaxKernel, a multi-agent system that implements three distinct paradigms for TPU kernel development: (1) a Human-in-the-Loop (HITL) agent for collaborative, step-by-step design; (2) an Autonomous (Auto) agent that executes a fully automated, metric/trace-driven optimization loop; and (3) a Graph-Based Autonomous Search that scales the Auto agent for global exploration of the design space. All three paradigms leverage a shared pool of specialized sub-agents to handle planning, implementation, self-debugging, testing, and hardware profiling. We evaluate MaxKernel on JaxBench, a comprehensive suite of 50 diverse kernel tasks for TPUs, alongside complex, real-world workloads from state-of-the-art open-source models. We demonstrate that MaxKernel consistently generates highly optimized implementations, matching expert hand-tuned baselines and delivering significant performance across the benchmark. Our agent is open-sourced and available https://github.com/AI-Hypercomputer/accelerator-agents/tree/main/MaxKernel.", "arxiv_id": "2609.04523", "arxiv_url": "https://arxiv.org/abs/2609.04523", "authors": ["Shangkun Wang", "Nina Cai", "Charles Hoong", "Julian Walker", "Gerson Kroiz", "George Vanica", "Deepak Patil", "Andi Gavrilescu", "Hassan Sipra", "Sethu Sankaran"], "brief": "MaxKernel \u662f\u4e00\u4e2a\u9762\u5411 TPU \u81ea\u5b9a\u4e49\u5185\u6838\u5f00\u53d1\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7ed3\u5408 LLM \u4e0e\u7f16\u8bd1\u5668\u3001\u786c\u4ef6 profiling \u53cd\u9988\uff0c\u5b9e\u73b0\u4ece\u534f\u4f5c\u5f0f\u8bbe\u8ba1\u5230\u5168\u81ea\u52a8\u4f18\u5316\u7684\u5185\u6838\u751f\u6210\u3002\u8bba\u6587\u63d0\u51fa HITL\u3001Auto \u4 ation for TPUs", "tldr": "\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u751f\u6210\u9ad8\u6027\u80fdTPU\u5185\u6838", "upvotes": 2, "what_it_is": "MaxKernel \u662f\u4e00\u4e2a\u9762\u5411 TPU \u81ea\u5b9a\u4e49\u5185\u6838\u5f00\u53d1\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7ed3\u5408 LLM \u4e0e\u7f16\u8bd1\u5668\u3001\u786c\u4ef6 profiling \u53cd\u9988\uff0c\u5b9e\u73b0\u4ece\u534f\u4f5c\u5f0f\u8bbe\u8ba1\u5230\u5168\u81ea\u52a8\u4f18\u5316\u7684\u5185\u6838\u751f\u6210\u3002\u8bba\u6587\u63d0\u51fa HITL\u3001Auto \u4e0e\u56fe\u641c\u7d22\u5f0f\u81ea\u4e3b\u63a2\u7d22\u4e09\u79cd\u8303\u5f0f\uff0c\u5e76\u5728\u7edf\u4e00\u7684\u4e13\u4e1a\u5b50\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\u5b8c\u6210\u89c4\u5212\u3001\u5b9e\u73b0\u3001\u8c03\u8bd5\u3001\u6d4b\u8bd5\u548c\u6027\u80fd\u5206\u6790\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a LLM \u667a\u80fd\u4f53\u4ece\u4ee3\u7801\u751f\u6210\u63a8\u8fdb\u5230\u786c\u4ef6\u611f\u77e5\u7684\u4f4e\u5c42\u6027\u80fd\u5de5\u7a0b\uff0c\u663e\u8457\u964d\u4f4e TPU \u5185\u6838\u5f00\u53d1\u95e8\u69db\uff0c\u5e76\u5c55\u793a\u4e86\u591a\u667a\u80fd\u4f53\u95ed\u73af\u4f18\u5316\u5728\u771f\u5b9e\u52a0\u901f\u5668\u7f16\u7a0b\u4e2d\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "While autonomous mobile agents hold great potential for assisting older adults with smartphone usage, existing GUI benchmarks mainly rely on explicit, goal-oriented instructions and rarely capture the naturally occurring language patterns of older users, such as indirect speech, referential ambiguity, and under-specified requests. This mismatch between benchmark instructions and real-world elderly interactions may hinder reliable agent deployment. To address this gap, we present ElderBench, the first benchmark for evaluating mobile GUI agents in authentic elderly-oriented scenarios. ElderBench is constructed from 249 naturally elicited smartphone tasks collected from older adults across 20 applications. We first characterize the linguistic divergence between elderly instructions and existing GUI benchmark instructions from syntactic, semantic, and pragmatic perspectives. We then evaluate mainstream GUI agents and Vision-Language Models under both online and offline settings, revealing substantial performance degradation when handling elderly-oriented instructions. Through controlled instruction normalization, failure analysis, and fine-grained linguistic feature analysis, we further identify how elderly-specific language patterns contribute to agent failures. Our findings provide actionable design insights toward more adaptive, interpretable, and age-inclusive GUI agents for older adults.", "arxiv_id": "2609.04850", "arxiv_url": "https://arxiv.org/abs/2609.04850", "authors": ["Weide Zhan", "Qumu Shaqu", "Yuanqing Liu", "Peng Zhang", "Jiahao Liu", "Kam Him Lam", "Ning Gu", "Zhan Hu", "Tun Lu"], "brief": "\u8bba\u6587\u63d0\u51fa ElderBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u5728\u8001\u5e74\u4eba\u771f\u5b9e\u624b\u673a\u4f7f\u7528\u573a\u666f\u4e2d\u7684\u8868\u73b0\u3002\u8be5\u57fa\u51c6\u6536\u96c6\u4e86\u6765\u81ea\u8001\u5e74\u4eba\u7684249\u4e2a\u81ea\u7136\u8868\u8fbe\u4efb\u52a1\uff0c\u8986\u76d620\u4e2a\u5e94\u7528\uff0c\u5e76\u5206\u6790\u8001\u5e74\u6307\u4ee4\u4e0e\u73b0\u6709GUI\u57fa\u51c6\u6307\u4ee4\u5728\u8bed\u6cd5\u3001\u8bed\u4e49\u548c\u8bed\u7528\u4e0a\u7684\u5dee\u5f02\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04850", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u805a\u7126\u8001\u5e74\u7528\u6237\u5e38\u89c1\u7684\u95f4\u63a5\u8868\u8fbe\u3001\u6307\u4ee3\u6a21\u7cca\u3001\u9700\u6c42\u6b20\u660e\u786e\u7b49\u81ea\u7136\u8bed\u8a00\u7279\u5f81\uff0c\u800c\u975e\u4f20\u7edf\u57fa\u51c6\u4e2d\u7684\u660e\u786e\u76ee\u6807\u5f0f\u6307\u4ee4", "\u8bc4\u6d4b\u4e3b\u6d41 GUI \u667a\u80fd\u4f53\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u5728\u7ebf\u4e0e\u79bb\u7ebf\u8bbe\u7f6e\u4e0b\u7684\u8868\u73b0\uff0c\u53d1\u73b0\u9762\u5bf9\u8001\u5e74\u4eba\u5bfc\u5411\u6307\u4ee4\u65f6\u6027\u80fd\u663e\u8457\u4e0b\u964d", "\u901a\u8fc7\u6307\u4ee4\u89c4\u8303\u5316\u3001\u5931\u8d25\u6848\u4f8b\u5206\u6790\u548c\u7ec6\u7c92\u5ea6\u8bed\u8a00\u7279\u5f81\u5206\u6790\uff0c\u5b9a\u4f4d\u8001\u5e74\u8bed\u8a00\u6a21\u5f0f\u5bfc\u81f4\u667a\u80fd\u4f53\u5931\u8d25\u7684\u5177\u4f53\u539f\u56e0"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u57fa\u51c6\u8bc4\u6d4b", "\u9002\u8001\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04850v1", "published_at": "2026-09-04", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ElderBench: Benchmarking Autonomous Mobile Agents for Older Adults", "tldr": "\u9996\u4e2a\u9762\u5411\u8001\u5e74\u4eba\u624b\u673a\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ElderBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u5728\u8001\u5e74\u4eba\u771f\u5b9e\u624b\u673a\u4f7f\u7528\u573a\u666f\u4e2d\u7684\u8868\u73b0\u3002\u8be5\u57fa\u51c6\u6536\u96c6\u4e86\u6765\u81ea\u8001\u5e74\u4eba\u7684249\u4e2a\u81ea\u7136\u8868\u8fbe\u4efb\u52a1\uff0c\u8986\u76d620\u4e2a\u5e94\u7528\uff0c\u5e76\u5206\u6790\u8001\u5e74\u6307\u4ee4\u4e0e\u73b0\u6709GUI\u57fa\u51c6\u6307\u4ee4\u5728\u8bed\u6cd5\u3001\u8bed\u4e49\u548c\u8bed\u7528\u4e0a\u7684\u5dee\u5f02\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u8db3\u4e86\u79fb\u52a8\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e2d\u5bf9\u8001\u5e74\u7528\u6237\u771f\u5b9e\u4ea4\u4e92\u65b9\u5f0f\u7684\u5ffd\u89c6\uff0c\u4e3a\u6784\u5efa\u66f4\u81ea\u9002\u5e94\u3001\u53ef\u89e3\u91ca\u3001\u9002\u8001\u5316\u7684\u624b\u673a GUI \u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u6570\u636e\u57fa\u51c6\u548c\u8bbe\u8ba1\u4f9d\u636e\uff0c\u5177\u6709\u660e\u786e\u7684\u793e\u4f1a\u4ef7\u503c\u4e0e\u5e94\u7528\u6f5c\u529b\u3002"}, {"abstract": "LLM agents deployed for software engineering fail expensively: they act confidently wrong, and bad actions are recognized only after costly execution and retry. We present Speculative Uncertainty (SU), a method that recovers a predictive failure signal for a black-box agent from its output tokens alone, with no access to logits, weights, activations, or repeated sampling. Inverting speculative decoding, a small open-weight draft model scores the agent\u0027s already-generated trajectory in a single forward pass. From these speculative cross-likelihoods we extract phase-aware features by separating the reasoning and action spans, and calibrate them against a verifiable objective. SU produces a failure-likelihood score that any downstream policy, such as routing, human intervention, or extra test-time compute, can consume directly. To show the signal is actionable, we instantiate one such policy, a pre-execution veto gate, on software engineering agents Qwen3-Coder-480B and closed-source Claude 3.5 Sonnet, cutting execution error rate by 6-8 percentage points and token cost by 14-19% in deployment, transferring to out-of-distribution benchmarks without retraining, and generalizing across agent models.", "arxiv_id": "2609.05274", "arxiv_url": "https://arxiv.org/abs/2609.05274", "authors": ["Konstantin Grotov", "Valentin Malykh"], "brief": "\u8bba\u6587\u63d0\u51fa Speculative Uncertainty\uff08SU\uff09\uff0c\u5728\u4e0d\u8bbf\u95ee\u9ed1\u76d2\u667a\u80fd\u4f53 logits\u3001\u6743\u91cd\u6216\u591a\u6b21\u91c7\u6837\u7684\u60c5\u51b5\u4e0b\uff0c\u4ec5\u7528\u5176\u8f93\u51fa token \u4f30\u8ba1\u5931\u8d25\u6982\u7387\u3002\u65b9\u6cd5\u53cd\u5411\u5229\u7528 speculative decoding\uff0c\u8ba9\u5c0f\u578b\u5f00\u6e90\u8349\u7a3f\u6a21\u578b\u5bf9\u5df2\u751f\u6210\u7684\u63a8\u7406\u4e0e\u52a8\u4f5c\u8f68\u8ff9\u6253\u5206\uff0c\u5e76\u6821\u51c6\u4e3a\u53ef\u7528\u4e8e\u51b3\u7b56\u7684\u98ce\u9669\u4fe1\u53f7\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05274", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u5355\u6b21\u524d\u5411\u4f20\u64ad\u8ba1\u7b97\u8349\u7a3f\u6a21\u578b\u5bf9\u667a\u80fd\u4f53\u8f93\u51fa\u8f68\u8ff9\u7684\u8de8\u4f3c\u7136\uff0c\u63d0\u53d6\u533a\u5206 reasoning \u4e0e action \u9636\u6bb5\u7684\u7279\u5f81", "\u5728 Qwen3-Coder-480B \u4e0e Claude 3.5 Sonnet \u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u4e0a\u5b9e\u73b0\u9884\u6267\u884c\u5426\u51b3\u95e8\u63a7", "\u90e8\u7f72\u4e2d\u5c06\u6267\u884c\u9519\u8bef\u7387\u964d\u4f4e 6-8 \u4e2a\u767e\u5206\u70b9\uff0ctoken \u6210\u672c\u964d\u4f4e 14-19%\uff0c\u4e14\u80fd\u8de8\u57fa\u51c6\u548c\u8de8\u6a21\u578b\u8fc1\u79fb"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05274v1", "published_at": "2026-09-04", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "How to Speculate about Uncertainty in Agentic Coding? A Draft-Model Gate Method", "tldr": "\u7528\u5c0f\u8349\u7a3f\u6a21\u578b\u9884\u5224\u7f16\u7801\u667a\u80fd\u4f53\u5931\u8d25", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Speculative Uncertainty\uff08SU\uff09\uff0c\u5728\u4e0d\u8bbf\u95ee\u9ed1\u76d2\u667a\u80fd\u4f53 logits\u3001\u6743\u91cd\u6216\u591a\u6b21\u91c7\u6837\u7684\u60c5\u51b5\u4e0b\uff0c\u4ec5\u7528\u5176\u8f93\u51fa token \u4f30\u8ba1\u5931\u8d25\u6982\u7387\u3002\u65b9\u6cd5\u53cd\u5411\u5229\u7528 speculative decoding\uff0c\u8ba9\u5c0f\u578b\u5f00\u6e90\u8349\u7a3f\u6a21\u578b\u5bf9\u5df2\u751f\u6210\u7684\u63a8\u7406\u4e0e\u52a8\u4f5c\u8f68\u8ff9\u6253\u5206\uff0c\u5e76\u6821\u51c6\u4e3a\u53ef\u7528\u4e8e\u51b3\u7b56\u7684\u98ce\u9669\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u9ed1\u76d2\u7f16\u7801\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u4f4e\u6210\u672c\u3001\u53ef\u8fc1\u79fb\u7684\u5931\u8d25\u9884\u8b66\u4fe1\u53f7\uff0c\u53ef\u5728\u6267\u884c\u6602\u8d35\u64cd\u4f5c\u524d\u89e6\u53d1\u8def\u7531\u3001\u4eba\u5de5\u4ecb\u5165\u6216\u989d\u5916\u63a8\u7406\uff0c\u5bf9\u63d0\u5347\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u53ef\u9760\u6027\u548c\u90e8\u7f72\u7ecf\u6d4e\u6027\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Building automation systems generate rich sensor data yet remain insight-poor because heterogeneous point naming, missing metadata, and fragmented documentation obstruct their operational use. This systematic review analyses and codes 66 peer-reviewed studies on large language models (LLMs) for HVAC operations published between 2023 and March 2026. Each study is classified across five application families and three LLM method families and assessed for evidence realism, deployment readiness, and the responsibility boundary between the LLM and physical HVAC decisions. The corpus is concentrated in building energy modelling (BEM, 32 of 66 papers), while load forecasting remains too sparse for subfield-level conclusions. Only four studies reach pilot-level evidence, and none reports sustained operational deployment. No study was classified as ready-now for industry adoption; three were near-term and 63 research-only. Nevertheless, several bounded, human-in-the-loop uses merit near-term trials, including point-name normalisation, document-grounded operator support, BEM workflow assistance, and advisory interfaces around physics-based controllers. Conventional machine learning (ML), model predictive control (MPC), reinforcement learning (RL) and ontology-based tools remain more adopted for high-frequency control, short-horizon numerical forecasting, and well-posed ontology mapping, while autonomous agentic operation and unvalidated occupant proxies remain research-stage. Current evidence therefore supports LLMs primarily as semantic and workflow layers rather than autonomous HVAC controllers. Future work should prioritise field-validated benchmarks, orchestration evaluation under operational constraints, and LLM-MPC/RL architectures with bounded latency and verifiable safety properties.", "arxiv_id": "2609.05314", "arxiv_url": "https://arxiv.org/abs/2609.05314", "authors": ["Alexander Neubauer", "Tianzhen Hong", "Han Li", "Mengbo Yu", "Amin Darbandi", "Yannick F\u00fcrst", "Martin Kriegel"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u7cfb\u7edf\u7efc\u8ff0\uff0c\u5206\u6790\u4e862023\u5e74\u81f32026\u5e743\u6708\u95f466\u7bc7\u5173\u4e8eLLM\u7528\u4e8e\u5efa\u7b51HVAC\u8fd0\u884c\u7684\u7814\u7a76\u3002\u8bba\u6587\u6309\u5e94\u7528\u7c7b\u578b\u3001\u65b9\u6cd5\u7c7b\u578b\u3001\u8bc1\u636e\u771f\u5b9e\u6027\u3001\u90e8\u7f72\u6210\u719f\u5ea6\u53caLLM\u4e0e\u7269\u7406\u63a7\u5236\u51b3\u7b56\u8fb9\u754c\u8fdb\u884c\u7f16\u7801\u8bc4\u4f30\u3002", "categories": ["cs.AI", "cs.CL", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05314", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7814\u7a76\u4e3b\u8981\u96c6\u4e2d\u5728\u5efa\u7b51\u80fd\u8017\u5efa\u6a21\uff0c\u536066\u7bc7\u4e2d\u768432\u7bc7\uff1b\u8d1f\u8377\u9884\u6d4b\u76f8\u5173\u7814\u7a76\u4ecd\u4e0d\u8db3\u4ee5\u5f62\u6210\u53ef\u9760\u7ed3\u8bba", "\u4ec54\u9879\u7814\u7a76\u8fbe\u5230\u8bd5\u70b9\u7ea7\u8bc1\u636e\uff0c\u6ca1\u6709\u4efb\u4f55\u7814\u7a76\u62a5\u544a\u6301\u7eed\u8fd0\u884c\u90e8\u7f72\uff1b\u65e0\u7814\u7a76\u88ab\u8bc4\u4e3a\u53ef\u7acb\u5373\u5de5\u4e1a\u91c7\u7528", "\u8fd1\u671f\u66f4\u53ef\u884c\u7684\u65b9\u5411\u5305\u62ec\u70b9\u4f4d\u540d\u79f0\u89c4\u8303\u5316\u3001\u57fa\u4e8e\u6587\u6863\u7684\u8fd0\u7ef4\u652f\u6301\u3001BEM\u6d41\u7a0b\u8f85\u52a9\uff0c\u4ee5\u53ca\u7269\u7406\u63a7\u5236\u5668\u65c1\u7684\u5efa\u8bae\u578b\u63a5\u53e3"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5efa\u7b51\u80fd\u6e90", "\u667a\u80fd\u63a7\u5236", "\u7efc\u8ff0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05314v1", "published_at": "2026-09-04", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Large Language Models for HVAC Operations in Building Energy Systems: A Critical Review of Methods, Applications, and Deployment Readiness", "tldr": "LLM\u5728HVAC\u4e2d\u5c1a\u672a\u5177\u5907\u81ea\u4e3b\u90e8\u7f72\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u7cfb\u7edf\u7efc\u8ff0\uff0c\u5206\u6790\u4e862023\u5e74\u81f32026\u5e743\u6708\u95f466\u7bc7\u5173\u4e8eLLM\u7528\u4e8e\u5efa\u7b51HVAC\u8fd0\u884c\u7684\u7814\u7a76\u3002\u8bba\u6587\u6309\u5e94\u7528\u7c7b\u578b\u3001\u65b9\u6cd5\u7c7b\u578b\u3001\u8bc1\u636e\u771f\u5b9e\u6027\u3001\u90e8\u7f72\u6210\u719f\u5ea6\u53caLLM\u4e0e\u7269\u7406\u63a7\u5236\u51b3\u7b56\u8fb9\u754c\u8fdb\u884c\u7f16\u7801\u8bc4\u4f30\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u660e\u786e\u6307\u51faLLM\u5728HVAC\u9886\u57df\u5f53\u524d\u66f4\u9002\u5408\u4f5c\u4e3a\u8bed\u4e49\u7406\u89e3\u4e0e\u5de5\u4f5c\u6d41\u8f85\u52a9\u5c42\uff0c\u800c\u975e\u81ea\u4e3b\u63a7\u5236\u5668\uff0c\u6709\u52a9\u4e8e\u7ea0\u6b63\u5bf9LLM\u76f4\u63a5\u63a5\u7ba1\u5efa\u7b51\u63a7\u5236\u7cfb\u7edf\u7684\u8fc7\u5ea6\u9884\u671f\uff0c\u5e76\u4e3a\u540e\u7eed\u5b89\u5168\u53ef\u9a8c\u8bc1\u7684LLM-MPC/RL\u67b6\u6784\u63d0\u4f9b\u7814\u7a76\u8def\u7ebf\u3002"}, {"abstract": "Many long-horizon LLM deployments face tight prompt budgets: latency, cost, and context limits make full-context prompting impractical as interaction length grows. The key question is then not raw recall alone, but which memory design gives the best quality--token trade-off in the compact-memory regime. We present \\textbf{RSM-full}, an online clustered-memory pipeline designed for a strong quality--token Pareto point. RSM-full combines two design choices: a cosine-gated \\emph{max-member merge} write rule and an atom-aware grouped context packer. On AMA-Bench, our primary compact-memory benchmark, it reaches $83%$ of Full-Context quality at $32%$ of the token cost at a $4$k budget; under four-seed averaging it beats the closest streaming-clustered baseline (Online K-Means) by $+3.5$--$6.0$,pp ($p{\u003c}.001$) across the whole ${\\sim}2.6$k--${\\sim}5$k regime. Three-seed ablations show most of this gain comes from the merge rule ($+5.7$,pp over Online K-Means and matched-$\u03c4$ DP-means) and the grouped packer ($+5.0$,pp over flat concatenation). The pattern reproduces on RealMem, an independent long-horizon persona-memory benchmark: RSM-full improves on Budget-RAG ($+0.69$,pp, $p{=}.006$), is on par with BM25-RAG (paired $\u0394{=}{+}0.27$,pp, $p{=}.47$; we do \\emph{not} claim BM25 equivalence in the equivalence-test sense), and significantly outperforms Streaming-Proto ($+2.97$,pp) and the closest reproduced 2025 agentic-memory baseline A-MEM ($+1.65$,pp, $p{\u003c}.001$). Across benchmarks the message is consistent: under tight budgets, compact-memory performance is driven mainly by how streaming memories are merged and how retrieved content is assembled. Overall, RSM-full is most useful when answeroughly $2k$--$5k$ prompt tokens, where itdefines a strong compact-memory Pareto point; higher-token baselines remain stronger outside this regime.", "arxiv_id": "2609.04915", "arxiv_url": "https://arxiv.org/abs/2609.04915", "authors": ["Jiahe Geng", "Jinpeng Wang", "Kun Yuan"], "brief": "\u8bba\u6587\u63d0\u51fa RSM-full\uff0c\u4e00\u79cd\u9762\u5411\u7d27\u51d1\u63d0\u793a\u9884\u7b97\u7684\u5728\u7ebf\u805a\u7c7b\u8bb0\u5fc6\u6d41\u6c34\u7ebf\u3002\u5b83\u901a\u8fc7 max-member \u5408\u5e76\u5199\u5165\u89c4\u5219\u548c atom-aware \u5206\u7ec4\u6253\u5305\u5668\uff0c\u5728\u957f\u7a0b\u4ea4\u4e92\u4e2d\u4ee5\u66f4\u5c11 token \u4fdd\u6301\u8f83\u9ad8\u56de\u7b54\u8d28\u91cf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04915", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5728 AMA-Bench \u7684 4k \u9884\u7b97\u4e0b\uff0c\u4ee5 32% \u7684 token \u6210\u672c\u8fbe\u5230 Full-Context 83% \u7684\u8d28\u91cf", "\u76f8\u8f83 Online K-Means\uff0c\u5728\u7ea6 2.6k\u20135k token \u7d27\u51d1\u533a\u95f4\u5e73\u5747\u63d0\u5347 3.5\u20136.0 \u4e2a\u767e\u5206\u70b9\uff0c\u4e14\u7edf\u8ba1\u663e\u8457", "\u6d88\u878d\u663e\u793a\u4e3b\u8981\u589e\u76ca\u6765\u81ea\u8bb0\u5fc6\u5408\u5e76\u89c4\u5219\u548c\u5206\u7ec4\u4e0a\u4e0b\u6587\u6253\u5305\uff0c\u5206\u522b\u5e26\u6765\u7ea6 5.7 \u548c 5.0 \u4e2a\u767e\u5206\u70b9\u63d0\u5347"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u68c0\u7d22\u589e\u5f3a", "\u4e0a\u4e0b\u6587\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04915v1", "published_at": "2026-09-04", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Compact-Memory LLM Agents via Online Max-Member Clustering and Atom-Aware Packing", "tldr": "\u7528\u805a\u7c7b\u8bb0\u5fc6\u63d0\u5347\u957f\u7a0b\u667a\u80fd\u4f53\u6027\u4ef7\u6bd4", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RSM-full\uff0c\u4e00\u79cd\u9762\u5411\u7d27\u51d1\u63d0\u793a\u9884\u7b97\u7684\u5728\u7ebf\u805a\u7c7b\u8bb0\u5fc6\u6d41\u6c34\u7ebf\u3002\u5b83\u901a\u8fc7 max-member \u5408\u5e76\u5199\u5165\u89c4\u5219\u548c atom-aware \u5206\u7ec4\u6253\u5305\u5668\uff0c\u5728\u957f\u7a0b\u4ea4\u4e92\u4e2d\u4ee5\u66f4\u5c11 token \u4fdd\u6301\u8f83\u9ad8\u56de\u7b54\u8d28\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u771f\u5b9e\u957f\u7a0b LLM \u667a\u80fd\u4f53\u4e2d\u7684\u4e0a\u4e0b\u6587\u6210\u672c\u4e0e\u8d28\u91cf\u6743\u8861\uff0c\u8868\u660e\u5728\u7d27\u9884\u7b97\u4e0b\uff0c\u8bb0\u5fc6\u5982\u4f55\u6d41\u5f0f\u5408\u5e76\u4e0e\u5982\u4f55\u7ec4\u88c5\u68c0\u7d22\u5185\u5bb9\u6bd4\u5355\u7eaf\u6269\u5927\u4e0a\u4e0b\u6587\u66f4\u5173\u952e\uff0c\u5bf9\u4f4e\u6210\u672c\u957f\u7a0b\u667a\u80fd\u4f53\u90e8\u7f72\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "On-policy distillation (OPD) provides dense, per-token supervision for language model post-training, but its effectiveness is bottlenecked by teacher quality: external teachers suffer from distribution mismatch, while self-distillation with privileged conditioning is limited by in-context learning capacity. We propose \\textbf{RISE} (\\textbf{R}ecursive \\textbf{I}mprovement via \\textbf{S}elf-\\textbf{E}xtrapolating Policy Distillation), which constructs a synthetic teacher directly from the model\u0027s own RLVR training trajectory. By extrapolating the displacement between the current checkpoint and a trailing anchor---in parameter space or output logit space---RISE converts a sparse outcome-induced parameter update into a dense token-level target, without any external model or privileged conditioning. RISE combines RLVR and OPD in a complementary loop: outcome rewards ground the extrapolation toward correct reasoning, while the extrapolated teacher refines token-level decisions. Moreover, since the teacher is refreshed every iteration as the student improves, distillation becomes a recursive improvement mechanism rather than a one-shot compression step. Experiments spanning mathematical reasoning, multi-domain STEM, code generation, and multi-turn agentic tasks show that RISE outperforms RLVR-only training and on-policy self-distillation across all settings.", "arxiv_id": "2609.05295", "arxiv_url": "https://arxiv.org/abs/2609.05295", "authors": ["Yang Li", "Semih Yavuz", "Shafiq Joty"], "brief": "\u8bba\u6587\u63d0\u51fa RISE\uff0c\u4ece\u6a21\u578b\u81ea\u8eab RLVR \u8bad\u7ec3\u8f68\u8ff9\u4e2d\u6784\u9020\u5408\u6210\u6559\u5e08\uff0c\u5c06\u7a00\u758f\u7ed3\u679c\u5956\u52b1\u5e26\u6765\u7684\u53c2\u6570\u66f4\u65b0\u5916\u63a8\u4e3a\u5bc6\u96c6 token \u7ea7\u76d1\u7763\u3002\u8be5\u65b9\u6cd5\u5728\u8bad\u7ec3\u4e2d\u5faa\u73af\u7ed3\u5408 RLVR \u4e0e\u5728\u7b56\u7565\u84b8\u998f\uff0c\u4f7f\u6559\u5e08\u968f\u5b66\u751f\u8fed\u4ee3\u5237\u65b0\uff0c\u5b9e\u73b0\u9012\u5f52\u5f0f\u81ea\u6211\u6539\u8fdb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05295", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u5f53\u524d checkpoint \u4e0e\u6ede\u540e anchor \u7684\u4f4d\u79fb\uff0c\u5728\u53c2\u6570\u7a7a\u95f4\u6216\u8f93\u51fa logit \u7a7a\u95f4\u8fdb\u884c\u5916\u63a8\uff0c\u751f\u6210\u65e0\u9700\u5916\u90e8\u6559\u5e08\u7684 token \u7ea7\u76ee\u6807\u3002", "RLVR \u63d0\u4f9b\u57fa\u4e8e\u7ed3\u679c\u5956\u52b1\u7684\u6b63\u786e\u6027\u65b9\u5411\uff0c\u5916\u63a8\u6559\u5e08\u5219\u8865\u8db3\u7ec6\u7c92\u5ea6\u51b3\u7b56\u76d1\u7763\uff0c\u7f13\u89e3\u7eaf RLVR \u76d1\u7763\u7a00\u758f\u7684\u95ee\u9898\u3002", "\u5728\u6570\u5b66\u63a8\u7406\u3001\u591a\u9886\u57df STEM\u3001\u4ee3\u7801\u751f\u6210\u548c\u591a\u8f6e\u4efb\u52a1\u4e0a\uff0cRISE \u5747\u4f18\u4e8e\u4ec5\u7528 RLVR \u8bad\u7ec3\u548c\u5728\u7b56\u7565\u81ea\u84b8\u998f\u57fa\u7ebf\u3002"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": true, "organization": "Salesforce AI Research", "pdf_url": "https://arxiv.org/pdf/2609.05295v1", "published_at": "2026-09-04", "score": 0.368, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05295.png", "title": "RISE: Recursive Improvement via Self-Extrapolating Policy Distillation", "tldr": "\u7528\u81ea\u5916\u63a8\u84b8\u998f\u9012\u5f52\u63d0\u5347\u8bed\u8a00\u6a21\u578b\u63a8\u7406", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa RISE\uff0c\u4ece\u6a21\u578b\u81ea\u8eab RLVR \u8bad\u7ec3\u8f68\u8ff9\u4e2d\u6784\u9020\u5408\u6210\u6559\u5e08\uff0c\u5c06\u7a00\u758f\u7ed3\u679c\u5956\u52b1\u5e26\u6765\u7684\u53c2\u6570\u66f4\u65b0\u5916\u63a8\u4e3a\u5bc6\u96c6 token \u7ea7\u76d1\u7763\u3002\u8be5\u65b9\u6cd5\u5728\u8bad\u7ec3\u4e2d\u5faa\u73af\u7ed3\u5408 RLVR \u4e0e\u5728\u7b56\u7565\u84b8\u998f\uff0c\u4f7f\u6559\u5e08\u968f\u5b66\u751f\u8fed\u4ee3\u5237\u65b0\uff0c\u5b9e\u73b0\u9012\u5f52\u5f0f\u81ea\u6211\u6539\u8fdb\u3002", "why_notable": "RISE \u5c06\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u7a00\u758f\u5956\u52b1\u66f4\u65b0\u8f6c\u5316\u4e3a\u5bc6\u96c6\u84b8\u998f\u4fe1\u53f7\uff0c\u907f\u514d\u5916\u90e8\u6559\u5e08\u5206\u5e03\u4e0d\u5339\u914d\u548c\u7279\u6743\u6761\u4ef6\u81ea\u84b8\u998f\u53d7\u9650\u7684\u95ee\u9898\uff0c\u4e3a\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u63d0\u4f9b\u4e86\u4e00\u79cd\u53ef\u9012\u5f52\u6269\u5c55\u7684\u81ea\u6539\u8fdb\u8303\u5f0f\u3002"}, {"abstract": "LLM agent systems increasingly combine provenance tracking, authorization, policy enforcement, protocol adapters, and execution controls. However, individually correct security mechanisms do not necessarily compose into an end-to-end secure system: security-critical context may be dropped, widened, rebound, or reinterpreted as actions cross component boundaries. We identify this failure mode as security-context discontinuity and introduce CONTINUITY, a framework for verifiable composition of agent security controls. CONTINUITY models each component with an assume-guarantee contract and carries authenticated security context across transitions using signed root grants, provenance commitments, role-bound transition receipts, bounded typed releases, transformation witnesses, and effect-bound execution permits. We formalize end-to-end consequence integrity, requiring every realized external effect to be backed by a valid and current authorization witness linking the principal, task, provenance, delegation, policy state, canonical action, and finality boundary. We implement a reference verifier and deterministic cross-layer fault-injection suite covering 32 fault classes across four application domains. In 2,560 parameterized attack instances spanning 128 fault-domain classes, the full CONTINUITY configuration commits no harmful external effect, while completing all 700 benign tasks and escalating all 200 ambiguous cases. These results show that secure agent execution requires not only sound individual controls, but explicit contracts that preserve their guarantees across the complete instruction-to-effect path.", "arxiv_id": "2609.05269", "arxiv_url": "https://arxiv.org/abs/2609.05269", "authors": ["Chris Zheng", "Geng Yang"], "brief": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u6307\u51faLLM\u667a\u80fd\u4f53\u4e2d\u5404\u7c7b\u5b89\u5168\u673a\u5236\u5355\u72ec\u6b63\u786e\u5e76\u4e0d\u4fdd\u8bc1\u7aef\u5230\u7aef\u5b89\u5168\uff0c\u5b9a\u4e49\u4e86\u201c\u5b89\u5168\u4e0a\u4e0b\u6587\u4e0d\u8fde\u7eed\u201d\u8fd9\u4e00\u5931\u6548\u6a21\u5f0f\u3002\u4f5c\u8005\u63d0\u51faCONTINUITY\uff0c\u7528\u5047\u8bbe-\u4fdd\u8bc1\u5951\u7ea6\u548c\u8ba4\u8bc1\u5b89\u5168\u4e0a\u4e0b\u6587\u6765\u9a8c\u8bc1\u4ece\u6307\u4ee4\u5230\u5916\u90e8\u6267\u884c\u6548\u679c\u7684\u5b8c\u6574\u5b89\u5168\u94fe\u8def\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05269", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4f7f\u7528\u7b7e\u540d\u6839\u6388\u6743\u3001\u6765\u6e90\u627f\u8bfa\u3001\u89d2\u8272\u7ed1\u5b9a\u8f6c\u6362\u56de\u6267\u3001\u7c7b\u578b\u5316\u53d7\u9650\u91ca\u653e\u3001\u8f6c\u6362\u89c1\u8bc1\u548c\u6548\u679c\u7ed1\u5b9a\u6267\u884c\u8bb8\u53ef\u6765\u8de8\u7ec4\u4ef6\u4f20\u9012\u5b89\u5168\u4e0a\u4e0b\u6587", "\u5f62\u5f0f\u5316\u201c\u7aef\u5230\u7aef\u540e\u679c\u5b8c\u6574\u6027\u201d\uff0c\u8981\u6c42\u6bcf\u4e2a\u5916\u90e8\u6548\u679c\u90fd\u80fd\u8ffd\u6eaf\u5230\u5f53\u524d\u6709\u6548\u7684\u6388\u6743\u89c1\u8bc1\uff0c\u8986\u76d6\u4e3b\u4f53\u3001\u4efb\u52a1\u3001\u6765\u6e90\u3001\u59d4\u6258\u3001\u7b56\u7565\u72b6\u6001\u3001\u89c4\u8303\u52a8\u4f5c\u548c\u6700\u7ec8\u8fb9\u754c", "\u5b9e\u73b0\u53c2\u8003\u9a8c\u8bc1\u5668\u4e0e\u786e\u5b9a\u6027\u4ea4\u53c9\u5c42\u6545\u969c\u6ce8\u5165\u5957\u4ef6\uff0c\u57282560\u4e2a\u653b\u51fb\u5b9e\u4f8b\u4e2d\u963b\u6b62\u5168\u90e8\u6709\u5bb3\u5916\u90e8\u6548\u679c\uff0c\u540c\u65f6\u5b8c\u6210700\u4e2a\u826f\u6027\u4efb\u52a1\u5e76\u5347\u7ea7\u5904\u7406200\u4e2a\u6a21\u7cca\u6848\u4f8b"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u8bbf\u95ee\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05269v1", "published_at": "2026-09-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CONTINUITY: Security-Context Contracts for Composable LLM Agent Controls", "tldr": "\u63d0\u51fa\u53ef\u9a8c\u8bc1\u7684\u667a\u80fd\u4f53\u5b89\u5168\u4e0a\u4e0b\u6587\u7ec4\u5408\u6846\u67b6", "upvotes": 0, "what_it_is": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u6307\u51faLLM\u667a\u80fd\u4f53\u4e2d\u5404\u7c7b\u5b89\u5168\u673a\u5236\u5355\u72ec\u6b63\u786e\u5e76\u4e0d\u4fdd\u8bc1\u7aef\u5230\u7aef\u5b89\u5168\uff0c\u5b9a\u4e49\u4e86\u201c\u5b89\u5168\u4e0a\u4e0b\u6587\u4e0d\u8fde\u7eed\u201d\u8fd9\u4e00\u5931\u6548\u6a21\u5f0f\u3002\u4f5c\u8005\u63d0\u51faCONTINUITY\uff0c\u7528\u5047\u8bbe-\u4fdd\u8bc1\u5951\u7ea6\u548c\u8ba4\u8bc1\u5b89\u5168\u4e0a\u4e0b\u6587\u6765\u9a8c\u8bc1\u4ece\u6307\u4ee4\u5230\u5916\u90e8\u6267\u884c\u6548\u679c\u7684\u5b8c\u6574\u5b89\u5168\u94fe\u8def\u3002", "why_notable": "\u2462\u4e3a\u4f55\u503c\u5f97\u5173\u6ce8\uff1a\u5b83\u5c06LLM\u667a\u80fd\u4f53\u5b89\u5168\u4ece\u5355\u70b9\u9632\u62a4\u63a8\u8fdb\u5230\u53ef\u7ec4\u5408\u3001\u53ef\u9a8c\u8bc1\u7684\u7aef\u5230\u7aef\u5b89\u5168\u5951\u7ea6\uff0c\u5bf9\u6784\u5efa\u53ef\u5ba1\u8ba1\u3001\u53ef\u6388\u6743\u3001\u53ef\u63a7\u7684\u751f\u4ea7\u7ea7\u667a\u80fd\u4f53\u7cfb\u7edf\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model agents increasingly rely on execution traces to master complex interactive tasks. However, current paradigms are bottlenecked by shallow trajectory retrieval and flat skill summarization, fundamentally ignoring the temporal dependencies and outcome-conditioned topology of agent behavior. We introduce Trace2Tower, a transition-aware EigenTrace framework that distills raw trajectories into a robust skill hierarchy. Trace2Tower abstracts step-level interactions into canonical events, constructing a unified graph governed by semantic compatibility, transition dynamics, and outcome evidence. Through a novel contrastive spectral decomposition, it isolates stable, success-aligned behavioral modes while rigorously suppressing failure-prone shortcuts. These modes organically populate a dynamic skill tower of action templates, procedural routines, and overarching task strategies, continuously refined via verifier-guided feedback. On ALFWorld, Trace2Tower achieves 87.31% success requiring only 10.35 steps and 0.26 invalid actions; on WebShop, it reaches 50.67% exact success. Across both benchmarks, Trace2Tower significantly outperforms existing baselines in task mastery and context-efficient experience reuse.", "arxiv_id": "2609.05261", "arxiv_url": "https://arxiv.org/abs/2609.05261", "authors": ["Jiazheng Sun", "Boyu Yang", "Binhao Yuan", "Mingxuan Li", "Xin Peng"], "brief": "\u8bba\u6587\u63d0\u51fa Trace2Tower\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684 transition-aware EigenTrace \u6846\u67b6\uff0c\u53ef\u5c06\u539f\u59cb\u4ea4\u4e92\u8f68\u8ff9\u84b8\u998f\u4e3a\u591a\u5c42\u7ea7\u6280\u80fd\u4f53\u7cfb\u3002\u5b83\u628a\u6b65\u9aa4\u7ea7\u884c\u4e3a\u62bd\u8c61\u4e3a\u89c4\u8303\u4e8b\u4ef6\uff0c\u5e76\u901a\u8fc7\u56fe\u5efa\u6a21\u548c\u8c31\u5206\u89e3\u63d0\u53d6\u4e0e\u6210\u529f\u7ed3\u679c\u5bf9\u9f50\u7684\u7a33\u5b9a\u884c\u4e3a\u6a21\u5f0f\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05261", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u7531\u8bed\u4e49\u517c\u5bb9\u6027\u3001\u8f6c\u79fb\u52a8\u6001\u548c\u7ed3\u679c\u8bc1\u636e\u5171\u540c\u7ea6\u675f\u7684\u7edf\u4e00\u8f68\u8ff9\u56fe\uff0c\u663e\u5f0f\u5efa\u6a21\u884c\u4e3a\u7684\u65f6\u95f4\u4f9d\u8d56\u4e0e\u6210\u8d25\u62d3\u6251\u3002", "\u63d0\u51fa\u5bf9\u6bd4\u5f0f\u8c31\u5206\u89e3\u65b9\u6cd5\uff0c\u4fdd\u7559\u6210\u529f\u76f8\u5173\u884c\u4e3a\u6a21\u5f0f\uff0c\u540c\u65f6\u6291\u5236\u5bb9\u6613\u5bfc\u81f4\u5931\u8d25\u7684\u6377\u5f84\u6216\u566a\u58f0\u8f68\u8ff9\u3002", "\u751f\u6210\u7531\u52a8\u4f5c\u6a21\u677f\u3001\u8fc7\u7a0b\u4f8b\u7a0b\u548c\u4efb\u52a1\u7b56\u7565\u7ec4\u6210\u7684\u52a8\u6001\u6280\u80fd\u5854\uff0c\u5e76\u901a\u8fc7 verifier \u53cd\u9988\u6301\u7eed\u4f18\u5316\uff1b\u5728 ALFWorld \u8fbe\u5230 87.31% \u6210\u529f\u7387\uff0c\u5728 WebShop \u8fbe\u5230 50.67% exact success\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60", "\u8f68\u8ff9\u5efa\u6a21", "\u8c31\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05261v1", "published_at": "2026-09-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Trace2Tower: Transition-Aware EigenTrace Induction of Multi-Level Skills for LLM Agents", "tldr": "\u4ece\u6267\u884c\u8f68\u8ff9\u4e2d\u5f52\u7eb3\u5c42\u7ea7\u6280\u80fd\u63d0\u5347LLM\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Trace2Tower\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684 transition-aware EigenTrace \u6846\u67b6\uff0c\u53ef\u5c06\u539f\u59cb\u4ea4\u4e92\u8f68\u8ff9\u84b8\u998f\u4e3a\u591a\u5c42\u7ea7\u6280\u80fd\u4f53\u7cfb\u3002\u5b83\u628a\u6b65\u9aa4\u7ea7\u884c\u4e3a\u62bd\u8c61\u4e3a\u89c4\u8303\u4e8b\u4ef6\uff0c\u5e76\u901a\u8fc7\u56fe\u5efa\u6a21\u548c\u8c31\u5206\u89e3\u63d0\u53d6\u4e0e\u6210\u529f\u7ed3\u679c\u5bf9\u9f50\u7684\u7a33\u5b9a\u884c\u4e3a\u6a21\u5f0f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u73b0\u6709\u8f68\u8ff9\u68c0\u7d22\u548c\u6241\u5e73\u6280\u80fd\u603b\u7ed3\u65b9\u6cd5\u7684\u5c40\u9650\uff0c\u5f15\u5165\u8f6c\u79fb\u611f\u77e5\u7684\u5c42\u7ea7\u6280\u80fd\u5f52\u7eb3\u673a\u5236\uff0c\u6709\u671b\u663e\u8457\u63d0\u5347 LLM \u667a\u80fd\u4f53\u5728\u4ea4\u4e92\u4efb\u52a1\u4e2d\u7684\u7ecf\u9a8c\u590d\u7528\u6548\u7387\u3001\u7a33\u5b9a\u6027\u548c\u4efb\u52a1\u638c\u63e1\u80fd\u529b\u3002"}, {"abstract": "Large language models become consequential agents when surrounding systems let outputs change external state. Models now call tools, operate interfaces, delegate work, retain state, inhabit generated worlds, and control robots or laboratory equipment. Such advances are often narrated as one march toward autonomy, conflating model competence, system integration, persistence, and safe authority. This critical review synthesizes primary research and official technical specifications available by 31 August 2026. We organize the evidence along delegated authority, temporal persistence, and environmental coupling, while separating model, harness, and environment. Within the evidence examined, action-interface expansion is documented more convincingly than robust completion, recovery, authorization, or independent verification. Model Context Protocol and Agent2Agent improve interoperability but do not establish trustworthy delegation; multi-agent organization adds specialization alongside cost and correlated failure. Persistent simulations and world models support training and planning but do not themselves demonstrate agency; robotics and self-driving laboratories establish bounded feasibility rather than unattended open-world reliability. We propose justified delegation as an analytical and normative heuristic, not an observed law or certified score: expand action scope only where evidence supports provenance, bounded authority, failure detection, safe recovery, and calibrated human control. This framing yields a research agenda for coupled model-harness evaluation, capability-based permissions, durable state, cross-agent accountability, and staged physical validation.", "arxiv_id": "2609.04894", "arxiv_url": "https://arxiv.org/abs/2609.04894", "authors": ["Linsen Zhu", "Mengqing Cai"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u6279\u5224\u6027\u7efc\u8ff0\uff0c\u7cfb\u7edf\u68b3\u7406\u5927\u8bed\u8a00\u6a21\u578b\u5728\u5de5\u5177\u8c03\u7528\u3001\u754c\u9762\u64cd\u4f5c\u3001\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u865a\u62df\u4e16\u754c\u3001\u673a\u5668\u4eba\u548c\u81ea\u52a8\u5b9e\u9a8c\u5ba4\u7b49\u73af\u5883\u4e2d\u7684\u201c\u884c\u52a8\u5316\u201d\u8fdb\u5c55\u3002\u8bba\u6587\u63d0\u51fa\u4ee5\u59d4\u6258\u6743\u9650\u3001\u65f6\u95f4\u6301\u4e45\u6027\u548c\u73af\u5883\u8026\u5408\u4e3a\u8f74\uff0c\u533a\u5206\u6a21\u578b\u3001\u8fd0\u884c\u6846\u67b6\u4e0e\u5916\u90e8\u73af\u5883\uff0c\u91cd\u65b0\u8bc4\u4f30\u667a\u80fd\u4f53AI\u7684\u771f\u5b9e\u80fd\u529b\u4e0e\u98ce\u9669\u3002", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04894", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u5f53\u524d\u8bc1\u636e\u66f4\u80fd\u652f\u6301\u201c\u884c\u52a8\u63a5\u53e3\u6269\u5c55\u201d\uff0c\u4f46\u4e0d\u8db3\u4ee5\u8bc1\u660e\u53ef\u9760\u4efb\u52a1\u5b8c\u6210\u3001\u6545\u969c\u6062\u590d\u d\u65b0\u8bc4\u4f30\u667a\u80fd\u4f53AI\u7684\u771f\u5b9e\u80fd\u529b\u4e0e\u98ce\u9669\u3002", "why_notable": "\u8bba\u6587\u4e3a\u5feb\u901f\u81a8\u80c0\u7684\u667a\u80fd\u4f53AI\u7814\u7a76\u63d0\u4f9b\u4e86\u6e05\u6670\u7684\u6982\u5ff5\u6846\u67b6\u548c\u5ba1\u614e\u8bc4\u4f30\u6807\u51c6\uff0c\u907f\u514d\u5c06\u6a21\u578b\u80fd\u529b\u3001\u7cfb\u7edf\u96c6\u6210\u3001\u6301\u4e45\u72b6\u6001\u548c\u5b89\u5168\u6388\u6743\u6df7\u4e3a\u4e00\u8c08\uff0c\u5bf9\u667a\u80fd\u4f53\u8bc4\u6d4b\u3001\u6743\u9650\u8bbe\u8ba1\u548c\u7269\u7406\u4e16\u754c\u90e8\u7f72\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Long-running LLM agents are stateful: beyond the transcript they accrete compressed summaries, plaintext memory, pending tool plans, and, under every serving API, a KV cache. Yet today\u0027s \"forget\" operations delete a plaintext memory record and stop, leaving every artifact derived from the revoked information intact. We formalize execution-state unlearning: after a forget request, the agent must behave as if it had never observed the target. Modeling the runtime as a deterministic transition system, we prove that the pre-target trajectory prefix is shared with this counterfactual world for free, that the post-target suffix is irreducibly tainted without token-level attribution, and that exact unlearning requires at least $T-\u03c4+1$ recomputed transitions, where $\u03c4$ is the target\u0027s injection step. Provenance-Guided Selective Replay attains this bound as a cross-layer contract spanning prompt, compressed memory, and cache: a provenance graph locates the injection point, checkpoint restoration reduces to cropping the KV cache, and sanitized replay regenerates the counterfactual suffix. Audited with elicitation, stochastic, and string-free behavioral tests across three agent suites, nine baselines, and three model families, memory deletion leaves leakage unchanged, instruction-based forgetting collapses under elicitation (Leak@probes = 1.00), and source redaction still acts on a revoked preference in 80% of episodes, while selective replay is indistinguishable from a full reset at up to 9x fewer recomputed tokens.", "arxiv_id": "2609.04875", "arxiv_url": "https://arxiv.org/abs/2609.04875", "authors": ["Chao Yao", "Yangbo Wei", "Zhen Huang", "Junhong Qian", "Chenle Chen", "Shaoqiang Lu", "Chen Wu", "Lei He"], "brief": "\u8bba\u6587\u5f62\u5f0f\u5316\u4e86\u957f\u8fd0\u884c\u6709\u72b6\u6001 LLM \u667a\u80fd\u4f53\u4e2d\u7684\u201c\u6267\u884c\u72b6\u6001\u9057\u5fd8\u201d\u95ee\u9898\uff1a\u9057\u5fd8\u540e\u667a\u80fd\u4f53\u5e94\u8868\u73b0\u5f97\u50cf\u4ece\u672a\u89c1\u8fc7\u88ab\u64a4\u9500\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51fa Provenance-Guided Selective Replay\uff0c\u901a\u8fc7\u6eaf\u6e90\u56fe\u5b9a\u4f4d\u4fe1\u606f\u6ce8\u5165\u70b9\u3001\u88c1\u526a KV cache \u5e76\u8fdb\u884c\u51c0\u5316\u91cd\u653e\uff0c\u5b9e\u73b0\u63a5\u8fd1\u5b8c\u5168\u91cd\u542f\u6548\u679c\u7684\u7cbe\u786e\u9057\u5fd8\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04875", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u5efa\u6a21\u4e3a\u786e\u5b9a\u6027\u8f6c\u79fb\u7cfb\u7edf\uff0c\u8bc1\u660e\u76ee\u6807\u6ce8\u5165\u524d\u8f68\u8ff9\u53ef\u590d\u7528\uff0c\u6ce8\u5165\u540e\u7684\u72b6\u6001\u5728\u65e0 token \u7ea7\u5f52\u56e0\u65f6\u4e0d\u53ef\u907f\u514d\u53d7\u6c61\u67d3", "\u7ed9\u51fa\u7cbe\u786e\u9057\u5fd8\u7684\u4e0b\u754c\uff1a\u81f3\u5c11\u9700\u8981\u91cd\u7b97 T-\u03c4+1 \u4e2a\u8f6c\u79fb\uff0c\u5e76\u8bc1\u660e\u9009\u62e9\u6027\u91cd\u653e\u53ef\u8fbe\u5230\u8be5\u4e0b\u754c", "\u5728\u4e09\u4e2a\u667a\u80fd\u4f53\u5957\u4ef6\u3001\u4e5d\u79cd\u57fa\u7ebf\u548c\u4e09\u7c7b\u6a21\u578b\u4e0a\u6d4b\u8bd5\uff0c\u666e\u901a\u8bb0\u5fc6\u5220\u9664\u51e0\u4e4e\u4e0d\u964d\u4f4e\u6cc4\u6f0f\uff0c\u6307\u4ee4\u5f0f\u9057\u5fd8\u5728\u8bf1\u5bfc\u6d4b\u8bd5\u4e2d\u5b8c\u5168\u5931\u6548\uff0c\u800c\u9009\u62e9\u6027\u91cd\u653e\u4ee5\u6700\u591a\u5c11 9 \u500d\u91cd\u7b97 token \u63a5\u8fd1\u5b8c\u5168\u91cd\u7f6e"], "keywords": ["\u667a\u80fd\u4f53", "\u9690\u79c1\u5b89\u5168", "\u673a\u5668\u9057\u5fd8", "KV\u7f13\u5b58"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04875v1", "published_at": "2026-09-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Forgetting Without Restarting: Execution-State Unlearning for Stateful LLM Agents", "tldr": "\u4e3a\u6709\u72b6\u6001LLM\u667a\u80fd\u4f53\u63d0\u51fa\u7cbe\u786e\u9057\u5fd8\u7684\u9009\u62e9\u6027\u91cd\u653e\u673a\u5236", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5f62\u5f0f\u5316\u4e86\u957f\u8fd0\u884c\u6709\u72b6\u6001 LLM \u667a\u80fd\u4f53\u4e2d\u7684\u201c\u6267\u884c\u72b6\u6001\u9057\u5fd8\u201d\u95ee\u9898\uff1a\u9057\u5fd8\u540e\u667a\u80fd\u4f53\u5e94\u8868\u73b0\u5f97\u50cf\u4ece\u672a\u89c1\u8fc7\u88ab\u64a4\u9500\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51fa Provenance-Guided Selective Replay\uff0c\u901a\u8fc7\u6eaf\u6e90\u56fe\u5b9a\u4f4d\u4fe1\u606f\u6ce8\u5165\u70b9\u3001\u88c1\u526a KV cache \u5e76\u8fdb\u884c\u51c0\u5316\u91cd\u653e\uff0c\u5b9e\u73b0\u63a5\u8fd1\u5b8c\u5168\u91cd\u542f\u6548\u679c\u7684\u7cbe\u786e\u9057\u5fd8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u73b0\u6709\u201c\u5220\u9664\u8bb0\u5fc6\u201d\u8fdc\u4e0d\u8db3\u4ee5\u8ba9\u6709\u72b6\u6001 LLM \u667a\u80fd\u4f53\u771f\u6b63\u9057\u5fd8\uff0c\u5e76\u5c06\u9057\u5fd8\u6269\u5c55\u5230 prompt\u3001\u538b\u7f29\u8bb0\u5fc6\u3001\u5de5\u5177\u8ba1\u5212\u548c KV cache \u7b49\u6267\u884c\u72b6\u6001\u5c42\u9762\uff1b\u5bf9\u9690\u79c1\u5408\u89c4\u3001\u957f\u671f\u8fd0\u884c\u667a\u80fd\u4f53\u5b89\u5168\u548c\u53ef\u5ba1\u8ba1\u90e8\u7f72\u5177\u6709\u91cd\u8981\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Improving an industrial recommender is an iterative research-and-engineering process rather than a direct path from idea to deployment. In \\textbf{DASHEN, NetEase\u0027s gaming-community app}, algorithm engineers typically identify promising directions from research papers, technical reports, and prior production experiments; reproduce or adapt the underlying methods; implement them in the production codebase; and evaluate the resulting models through training and offline experiments. Promising candidates are then advanced to online A/B tests, and those demonstrating robust gains are submitted to Launch Review---the internal gate for full-traffic rollout. Large language models (LLMs) can assist with individual stages of this workflow, but the overall process remains human-dependent without a harness that can reliably coordinate them across long-running, often multi-day experimental cycles. We present \\textbf{AutoLR}, initially built as \\textbf{Auto Launch Review} and later extended upstream into an autonomous research-to-launch harness. AutoLR combines three system mechanisms: a \\textbf{multi-expert council} that debates and adversarially reviews proposals; a \\textbf{deterministic evidence-weighted exploration--exploitation selector} that allocates a limited trial budget across candidate directions and uses Council reranking; and a layered knowledge system that combines external research, production-system knowledge, and DASHEN-specific domain knowledge---such as game communities, player characteristics, and content-interaction patterns---with posterior evidence from configurations, patches, logs, failures, and offline outcomes. LLM agents perform semantic reasoning and code generation, while deterministic controllers retain authority over execution, metric extraction, guardrails, and persistent state transitions.", "arxiv_id": "2609.04871", "arxiv_url": "https://arxiv.org/abs/2609.04871", "authors": ["Qi Zhang", "Yanlin Chen", "Wenchao Xiao"], "brief": "\u8bba\u6587\u63d0\u51fa AutoLR\uff0c\u7528\u4e8e\u7f51\u6613 DASHEN \u6e38\u620f\u793e\u533a\u63a8\u8350\u7cfb\u7edf\u4e2d\uff0c\u5c06\u8bba\u6587\u8c03\u7814\u3001\u65b9\u6cd5\u590d\u73b0\u3001\u751f\u4ea7\u4ee3\u7801\u5b9e\u73b0\u3001\u79bb\u7ebf\u5b9e\u9a8c\u5230 Launch Review \u7684\u6d41\u7a0b\u81ea\u52a8\u5316\u4e32\u8054\u3002\u7cfb\u7edf\u7531 LLM \u667a\u80fd\u4f53\u8d1f\u8d23\u8bed\u4e49\u63a8\u7406\u4e0e\u4ee3\u7801\u751f\u6210\uff0c\u786e\u5b9a\u6027\u63a7\u5236\u5668\u8d1f\u8d23\u6267\u884c\u3001\u6307\u6807\u62bd\u53d6\u3001\u62a4\u680f\u4e0e\u72b6\u6001\u7ba1\u7406\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04871", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5f15\u5165\u591a\u4e13\u5bb6\u59d4\u5458\u4f1a\u673a\u5236\uff0c\u5bf9\u5019\u9009\u65b9\u6848\u8fdb\u884c\u8fa9\u8bba\u3001\u5bf9\u6297\u5f0f\u8bc4\u5ba1\u4e0e\u91cd\u6392\u5e8f\u3002", "\u8bbe\u8ba1\u786e\u5b9a\u6027\u7684\u8bc1\u636e\u52a0\u6743\u63a2\u7d22-\u5229\u7528\u9009\u62e9\u5668\uff0c\u5728\u6709\u9650\u5b9e\u9a8c\u9884\u7b97\u4e0b\u5206\u914d\u5019\u9009\u65b9\u5411\u5e76\u7ed3\u5408\u59d4\u5458\u4f1a\u53cd\u9988\u3002", "\u6784\u5efa\u5206\u5c42\u77e5\u8bc6\u7cfb\u7edf\uff0c\u878d\u5408\u5916\u90e8\u7814\u7a76\u3001\u751f\u4ea7\u7cfb\u7edf\u77e5\u8bc6\u3001DASHEN \u9886\u57df\u77e5\u8bc6\u53ca\u5b9e\u9a8c\u65e5\u5fd7\u3001\u8865\u4e01\u3001\u5931\u8d25\u4e0e\u79bb\u7ebf\u7ed3\u679c\u7b49\u540e\u9a8c\u8bc1\u636e\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u8350\u7cfb\u7edf", "\u81ea\u52a8\u5316\u7814\u53d1", "\u5de5\u4e1a\u5e94\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04871v1", "published_at": "2026-09-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AutoLR: Automating the Path from Research to Launch Review in Industrial Recommender Systems", "tldr": "\u5de5\u4e1a\u63a8\u8350\u4ece\u7814\u7a76\u5230\u4e0a\u7ebf\u8bc4\u5ba1\u7684\u81ea\u52a8\u5316\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoLR\uff0c\u7528\u4e8e\u7f51\u6613 DASHEN \u6e38\u620f\u793e\u533a\u63a8\u8350\u7cfb\u7edf\u4e2d\uff0c\u5c06\u8bba\u6587\u8c03\u7814\u3001\u65b9\u6cd5\u590d\u73b0\u3001\u751f\u4ea7\u4ee3\u7801\u5b9e\u73b0\u3001\u79bb\u7ebf\u5b9e\u9a8c\u5230 Launch Review \u7684\u6d41\u7a0b\u81ea\u52a8\u5316\u4e32\u8054\u3002\u7cfb\u7edf\u7531 LLM \u667a\u80fd\u4f53\u8d1f\u8d23\u8bed\u4e49\u63a8\u7406\u4e0e\u4ee3\u7801\u751f\u6210\uff0c\u786e\u5b9a\u6027\u63a7\u5236\u5668\u8d1f\u8d23\u6267\u884c\u3001\u6307\u6807\u62bd\u53d6\u3001\u62a4\u680f\u4e0e\u72b6\u6001\u7ba1\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u771f\u5b9e\u5de5\u4e1a\u63a8\u8350\u7cfb\u7edf\u7684\u957f\u5468\u671f\u7814\u53d1\u95ed\u73af\uff0c\u91cd\u70b9\u4e0d\u53ea\u662f\u5355\u70b9\u8f85\u52a9\u7f16\u7801\uff0c\u800c\u662f\u5c06 LLM \u667a\u80fd\u4f53\u5d4c\u5165\u591a\u5929\u5b9e\u9a8c\u3001\u8bc4\u4f30\u548c\u4e0a\u7ebf\u8bc4\u5ba1\u6d41\u7a0b\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u548c\u81ea\u52a8\u5316\u7814\u53d1\u8303\u5f0f\u610f\u4e49\u3002"}, {"abstract": "Skill libraries improve the sample efficiency of agentic reinforcement learning (RL) by enabling large language model (LLM) agents to reuse procedural knowledge. Yet existing paradigms exhibit structural shortcomings: they either decouple skill evolution from policy optimization or instantiate meta-skills as fixed workflows. Both treat skills as passive objects to be managed, limiting the flexible evolution of skills and their co-adaptation with the reasoning agent. To address the limitations, we propose CoSkill, a unified multi-agent RL framework that recasts the static meta-skill workflow as a learnable Meta-Skill Agent and jointly trains it with a Reasoning Agent over a hierarchical skill library. By modeling the Reasoning and Meta-Skill Agents as a cooperative team sharing a single backbone, CoSkill enables end-to-end co-adaptation: the Reasoning Agent conditions its actions on a retrieved task skill and step skills selected from its child set, while its task performance guides the Meta-Skill Agent in refining those step skills. Experiments on ALFWorld and WebShop show that CoSkill substantially outperforms prior skill-based and RL baselines, achieving success rates of 98.4% and 90.6%, respectively (+3.5 and +6.2 pp). As shown in Figure 1, CoSkill achieves superior early-stage sample efficiency, asymptotic performance, and wall-clock efficiency. Our code is available at https://github.com/jinyuan-cookie/CoSkill.", "arxiv_id": "2609.04865", "arxiv_url": "https://arxiv.org/abs/2609.04865", "authors": ["Jinyuan Feng", "Dongmin Li", "Yiqun Chen", "Yang Gao", "Xing Chen", "Huimu Wang", "Zhiqiang Pu"], "brief": "\u8bba\u6587\u63d0\u51fa CoSkill\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u9759\u6001\u5143\u6280\u80fd\u6d41\u7a0b\u91cd\u6784\u4e3a\u53ef\u5b66\u4e60\u7684 Meta-Skill Agent\uff0c\u5e76\u4e0e Reasoning Agent \u5728\u5c42\u7ea7\u6280\u80fd\u5e93\u4e0a\u8054\u5408\u8bad\u7ec3\u3002\u4e24\u8005\u5171\u4eab\u540c\u4e00\u6a21\u578b\u9aa8\u5e72\uff0c\u5b9e\u73b0\u4efb\u52a1\u63a8\u7406\u4e0e\u6280\u80fd\u7ec6\u5316\u7684\u7aef\u5230\u7aef\u534f\u540c\u9002\u5e94\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04865", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6280\u80fd\u5e93\u4e2d\u7684\u4efb\u52a1\u6280\u80fd\u4e0e\u5b50\u7ea7\u6b65\u9aa4\u6280\u80fd\u7eb3\u5165\u5c42\u7ea7\u7ed3\u6784\uff0c\u63a8\u7406\u667a\u80fd\u4f53\u57fa\u4e8e\u68c0\u7d22\u5230\u7684\u4efb\u52a1\u6280\u80fd\u548c\u6b65\u9aa4\u6280\u80fd\u8fdb\u884c\u884c\u52a8\u51b3\u7b56\u3002", "Meta-Skill Agent \u4e0d\u518d\u662f\u56fa\u5b9a\u5de5\u4f5c\u6d41\uff0c\u800c\u662f\u53ef\u5b66\u4e60\u5730\u6839\u636e\u4efb\u52a1\u8868\u73b0\u4f18\u5316\u548c\u7ec6\u5316\u6b65\u9aa4\u6280\u80fd\u3002", "\u5728 ALFWorld \u548c WebShop \u4e0a\u5206\u522b\u8fbe\u5230 98.4% \u4e0e 90.6% \u6210\u529f\u7387\uff0c\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u63d0\u5347 3.5 \u548c 6.2 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6280\u80fd\u5b66\u4e60", "\u5c42\u7ea7\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04865v1", "published_at": "2026-09-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CoSkill: Joint Reinforcement Learning of Reasoning and Meta-Skill Agents for Hierarchical Skill Evolution", "tldr": "\u534f\u540c\u8bad\u7ec3\u63a8\u7406\u4e0e\u5143\u6280\u80fd\u667a\u80fd\u4f53\u63d0\u5347\u6280\u80fd\u8fdb\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CoSkill\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u9759\u6001\u5143\u6280\u80fd\u6d41\u7a0b\u91cd\u6784\u4e3a\u53ef\u5b66\u4e60\u7684 Meta-Skill Agent\uff0c\u5e76\u4e0e Reasoning Agent \u5728\u5c42\u7ea7\u6280\u80fd\u5e93\u4e0a\u8054\u5408\u8bad\u7ec3\u3002\u4e24\u8005\u5171\u4eab\u540c\u4e00\u6a21\u578b\u9aa8\u5e72\uff0c\u5b9e\u73b0\u4efb\u52a1\u63a8\u7406\u4e0e\u6280\u80fd\u7ec6\u5316\u7684\u7aef\u5230\u7aef\u534f\u540c\u9002\u5e94\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6280\u80fd\u6f14\u5316\u4e0e\u7b56\u7565\u4f18\u5316\u7edf\u4e00\u5230\u8054\u5408\u5f3a\u5316\u5b66\u4e60\u4e2d\uff0c\u7f13\u89e3\u4e86\u4ee5\u5f80\u6280\u80fd\u5e93\u65b9\u6cd5\u4e2d\u201c\u6280\u80fd\u88ab\u52a8\u7ba1\u7406\u201d\u548c\u5143\u6280\u80fd\u56fa\u5b9a\u5316\u7684\u95ee\u9898\uff0c\u5728\u6837\u672c\u6548\u7387\u3001\u6700\u7ec8\u6027\u80fd\u548c\u8bad\u7ec3\u8017\u65f6\u4e0a\u5747\u663e\u793a\u51fa\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Production multi-agent systems replace agents constantly, on the assumption that an agent filling a role is interchangeable with any other agent that can do the job. We test that assumption. Eight teams per setting are formed independently from one base model on the same tasks, each agent keeping a private notebook across ten formation episodes; we then trade role-matched agents between teams and measure what changes on held-out tasks. Against a placebo that reproduces the disruption of a roster change without changing who occupies the seat, a swap costs little in task score but raises the communication a team spends per unit of progress by 16 to 63 percent, and in Hanabi a swapped agent is more expensive than an inexperienced one, consistent with interference from conventions learned with its former partner. In Collab-Overcooked, when the agent that sets the agenda is replaced, most of the extra communication comes from the agent that stayed. Three ablations, over base models, decoding temperature and formation length, move the swap penalty alongside one other quantity: how far independently formed teams drift apart. Greedy decoding lowers both; doubling a team\u0027s history raises both. In these settings, agents are more fungible in task outcome than in coordination efficiency, with larger swap effects after longer formation histories.", "arxiv_id": "2609.05279", "arxiv_url": "https://arxiv.org/abs/2609.05279", "authors": ["Jianxin Gao", "Tianyi Yu", "Linna Deng", "Runze Li", "Zining Wang"], "brief": "\u672c\u6587\u68c0\u9a8c\u751f\u4ea7\u7ea7\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u201c\u540c\u89d2\u8272\u667a\u80fd\u4f53\u53ef\u4e92\u6362\u201d\u7684\u5047\u8bbe\uff1a\u8ba9\u540c\u4e00\u57fa\u7840\u6a21\u578b\u72ec\u7acb\u7ec4\u6210\u591a\u652f\u961f\u4f0d\u5e76\u79ef\u7d2f\u79c1\u6709\u534f\u4f5c\u7b14\u8bb0\uff0c\u518d\u5728\u4fdd\u7559\u4efb\u52a1\u4e0a\u4ea4\u6362\u540c\u89d2\u8272\u667a\u80fd\u4f53\u89c2\u5bdf\u5f71\u54cd\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6362\u4eba\u5bf9\u4efb\u52a1\u5f97\u5206\u5f71\u54cd\u8f83\u5c0f\uff0c\u4f46\u663e\u8457\u964d\u4f4e\u534f\u8c03\u6548\u7387\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05279", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5728\u6bcf\u4e2a\u8bbe\u7f6e\u4e2d\u6784\u5efa8\u652f\u72ec\u7acb\u961f\u4f0d\uff0c\u6bcf\u4e2a\u667a\u80fd\u4f53\u572810\u8f6e\u5f62\u6210\u671f\u4e2d\u4fdd\u7559\u79c1\u6709\u7b14\u8bb0\uff0c\u968f\u540e\u4ea4\u6362\u540c\u89d2\u8272\u6210\u5458\u5e76\u4e0e\u5b89\u6170\u5242\u6362\u4eba\u5bf9\u7167\u6bd4\u8f83\u3002", "\u6362\u4eba\u51e0\u4e4e\u4e0d\u635f\u5bb3\u4efb\u52a1\u6210\u7ee9\uff0c\u4f46\u5355\u4f4d\u8fdb\u5c55\u6240\u9700\u901a\u4fe1\u91cf\u589e\u52a016%\u523063%\uff1b\u5728Hanabi\u4e2d\uff0c\u88ab\u4ea4\u6362\u667a\u80fd\u4f53\u751a\u81f3\u6bd4\u65b0\u624b\u66f4\u201c\u6602\u8d35\u201d\uff0c\u663e\u793a\u65e7\u534f\u4f5c\u60ef\u4f8b\u4f1a\u4ea7\u751f\u5e72\u6270\u3002", "\u5728Collab-Overcooked\u4e2d\uff0c\u82e5\u8d1f\u8d23\u8bbe\u5b9a\u8bae\u7a0b\u7684\u667a\u80fd\u4f53\u88ab\u66ff\u6362\uff0c\u989d\u5916\u6c9f\u901a\u4e3b\u8981\u6765\u81ea\u7559\u4e0b\u6765\u7684\u961f\u53cb\uff1b\u57fa\u7840\u6a21\u578b\u3001\u89e3\u7801\u6e29\u5ea6\u548c\u5f62\u6210\u671f\u957f\u5ea6\u7684\u6d88\u878d\u8868\u660e\uff0c\u56e2\u961f\u72ec\u7acb\u6f02\u79fb\u8d8a\u5927\uff0c\u6362\u4eba\u60e9\u7f5a\u8d8a\u5f3a\u3002"], "keywords": ["\u591a\u667a\u80fd\u4f53", "LLM\u667a\u80fd\u4f53", "\u534f\u4f5c\u6548\u7387", "\u56e2\u961f\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05279v1", "published_at": "2026-09-04", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Testing Interchangeability in LLM Agent Teams", "tldr": "LLM\u591a\u667a\u80fd\u4f53\u6362\u4eba\u4e0d\u964d\u5206\u4f46\u589e\u6c9f\u901a\u6210\u672c", "upvotes": 0, "what_it_is": "\u672c\u6587\u68c0\u9a8c\u751f\u4ea7\u7ea7\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u201c\u540c\u89d2\u8272\u667a\u80fd\u4f53\u53ef\u4e92\u6362\u201d\u7684\u5047\u8bbe\uff1a\u8ba9\u540c\u4e00\u57fa\u7840\u6a21\u578b\u72ec\u7acb\u7ec4\u6210\u591a\u652f\u961f\u4f0d\u5e76\u79ef\u7d2f\u79c1\u6709\u534f\u4f5c\u7b14\u8bb0\uff0c\u518d\u5728\u4fdd\u7559\u4efb\u52a1\u4e0a\u4ea4\u6362\u540c\u89d2\u8272\u667a\u80fd\u4f53\u89c2\u5bdf\u5f71\u54cd\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6362\u4eba\u5bf9\u4efb\u52a1\u5f97\u5206\u5f71\u54cd\u8f83\u5c0f\uff0c\u4f46\u663e\u8457\u964d\u4f4e\u534f\u8c03\u6548\u7387\u3002", "why_notable": "\u8bba\u6587\u6307\u51faLLM\u591a\u667a\u80fd\u4f53\u7684\u201c\u53ef\u66ff\u6362\u6027\u201d\u4e0d\u80fd\u53ea\u770b\u4efb\u52a1\u5f97\u5206\uff0c\u8fd8\u8981\u770b\u6c9f\u901a\u4e0e\u534f\u8c03\u6210\u672c\uff1b\u8fd9\u5bf9\u751f\u4ea7\u73af\u5883\u4e2d\u7684\u667a\u80fd\u4f53\u8f6e\u6362\u3001\u56e2\u961f\u8bb0\u5fc6\u7ba1\u7406\u548c\u534f\u4f5c\u534f\u8bae\u8bbe\u8ba1\u5177\u6709\u76f4\u63a5\u542f\u53d1\u3002"}, {"abstract": "AI alignment requires AI systems to adhere to human norms, values, or intentions. Under value pluralism there is no correct target, but a shared prerequisite is that the system\u0027s behavior expresses a coherent policy: a mapping from situations to verdicts that is invariant while a situation\u0027s morally relevant features are preserved, and sensitive when they change. We introduce four structural conditions for such coherent policies: verdict stability, monotonicity, decisiveness, and Pareto viability. Together they measure a form of moral competence that is evaluable from behavior alone, without reference to a moral standard or expert baseline, forming a structural floor for alignment rather than a normative target. We demonstrate the methodology on three simulated deployments featuring LLM-based agents facing moral dilemmas. Evaluating nine frontier models under a factorial design of five paraphrases, five escalation levels, and three dominance conditions, we show no model expresses a coherent policy across the three deployments: surface-form perturbation alone produces verdict-rate shifts of up to $99$ percentage points at a single escalation level, and a model\u0027s success on one scenario does not predict its competence on another. This suggests LLM-based agents are not currently the kind of object to which alignment can meaningfully apply.", "arxiv_id": "2609.05036", "arxiv_url": "https://arxiv.org/abs/2609.05036", "authors": ["Arno Libert", "Derck W. E. Prinzhorn", "Daan R. Henselmans"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4e0d\u4f9d\u8d56\u5177\u4f53\u9053\u5fb7\u6807\u51c6\u7684\u201c\u9053\u5fb7\u80fd\u529b\u201d\u7ed3\u6784\u8bc4\u4f30\u6846\u67b6\uff0c\u7528\u884c\u4e3a\u4e00\u81f4\u6027\u6765\u8861\u91cf\u5bf9\u9f50\u7684\u524d\u63d0\u6761\u4ef6\u3002\u4f5c\u8005\u5728\u4e09\u7c7b\u6a21\u62df\u9053\u5fb7\u56f0\u5883\u90e8\u7f72\u4e2d\u6d4b\u8bd5\u4e5d\u4e2a\u524d\u6cbf\u6a21\u578b\uff0c\u53d1\u73b0\u6ca1\u6709\u6a21\u578b\u80fd\u8868\u73b0\u51fa\u8de8\u573a\u666f\u7684\u8fde\u8d2f\u9053\u5fb7\u7b56\u7565\u3002", "categories": ["cs.AI", "cs.CL", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05036", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u56db\u4e2a\u7ed3\u6784\u6761\u4ef6\uff1a\u5224\u51b3\u7a33\u5b9a\u6027\u3001\u5355\u8c03\u6027\u3001\u51b3\u65ad\u6027\u548c\u5e15\u7d2f\u6258\u53ef\u884c\u6027\uff0c\u7528\u4e8e\u8bc4\u4f30\u9053\u5fb7\u7b56\u7565\u662f\u5426\u8fde\u8d2f", "\u5b9e\u9a8c\u91c7\u7528\u4e94\u79cd\u6539\u5199\u3001\u4e94\u4e2a\u5347\u7ea7\u7b49\u7ea7\u548c\u4e09\u79cd\u652f\u914d\u6761\u4ef6\u7684\u56e0\u5b50\u8bbe\u8ba1\uff0c\u8bc4\u4f30\u4e5d\u4e2a\u524d\u6cbfLLM\u667a\u80fd\u4f53", "\u4ec5\u8868\u9762\u63aa\u8f9e\u6270\u52a8\u5c31\u53ef\u5bfc\u81f4\u540c\u4e00\u5347\u7ea7\u7b49\u7ea7\u4e0b\u5224\u51b3\u7387\u53d8\u5316\u9ad8\u8fbe99\u4e2a\u767e\u5206\u70b9\uff0c\u4e14\u5355\u4e00\u573a\u666f\u8868\u73b0\u4e0d\u80fd\u9884\u6d4b\u5176\u4ed6\u573a\u666f"], "keywords": ["\u667a\u80fd\u4f53", "AI\u5bf9\u9f50", "\u5927\u8bed\u8a00\u6a21\u578b", "AI\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05036v1", "published_at": "2026-09-04", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Moral Competence Before Moral Content: Why LLM Agents Lack the Prerequisites for Coherent Alignment", "tldr": "LLM\u667a\u80fd\u4f53\u7f3a\u4e4f\u4e00\u81f4\u9053\u5fb7\u7b56\u7565\u524d\u63d0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4e0d\u4f9d\u8d56\u5177\u4f53\u9053\u5fb7\u6807\u51c6\u7684\u201c\u9053\u5fb7\u80fd\u529b\u201d\u7ed3\u6784\u8bc4\u4f30\u6846\u67b6\uff0c\u7528\u884c\u4e3a\u4e00\u81f4\u6027\u6765\u8861\u91cf\u5bf9\u9f50\u7684\u524d\u63d0\u6761\u4ef6\u3002\u4f5c\u8005\u5728\u4e09\u7c7b\u6a21\u62df\u9053\u5fb7\u56f0\u5883\u90e8\u7f72\u4e2d\u6d4b\u8bd5\u4e5d\u4e2a\u524d\u6cbf\u6a21\u578b\uff0c\u53d1\u73b0\u6ca1\u6709\u6a21\u578b\u80fd\u8868\u73b0\u51fa\u8de8\u573a\u666f\u7684\u8fde\u8d2f\u9053\u5fb7\u7b56\u7565\u3002", "why_notable": "\u8be5\u7814\u7a76\u5c06\u5bf9\u9f50\u95ee\u9898\u4ece\u201c\u5e94\u9075\u5faa\u54ea\u5957\u4ef7\u503c\u201d\u8f6c\u5411\u201c\u662f\u5426\u5177\u5907\u7a33\u5b9a\u8868\u8fbe\u4ef7\u503c\u7684\u80fd\u529b\u201d\uff0c\u6307\u51fa\u5f53\u524dLLM\u667a\u80fd\u4f53\u5728\u9053\u5fb7\u51b3\u7b56\u4e0a\u7f3a\u4e4f\u53ef\u5bf9\u9f50\u5bf9\u8c61\u6240\u9700\u7684\u57fa\u672c\u4e00\u81f4\u6027\uff0c\u5bf9AI\u5b89\u5168\u4e0e\u667a\u80fd\u4f53\u90e8\u7f72\u5177\u6709\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Artificial intelligence (AI) now supports investment workflows from data and prediction through research, portfolios, execution, and tool use. Technical capability, however, is not evidence of investment profitability. This critical state-of-the-art review examines public research available through 31 August 2026 on listed equities, exchange-traded funds, centralized crypto spot, perpetual futures, and on-chain markets. We organize evidence with an alpha-translation chain: point-in-time information must yield a stable signal, feasible positions, executable orders, and risk-adjusted returns after costs. Across machine learning, time-series foundation models, financial language models, reinforcement learning, and agents, the examined record shows real but mainly upstream progress in prediction, text processing, portfolio design, and workflow integration. Evidence is thinner for durable net performance. Temporal contamination, repeated selection, survivorship, weak benchmarks, implementation costs, venue mechanics, and capacity can break translation to net alpha. Strong historical results coexist with predictor decay, corrected look-ahead failures, mixed prospective evidence, and few audited live-capital records. Crypto adds informative state but requires separate treatment of spot, perpetual, and decentralized cash flows and execution. Within the public evidence examined here, no general AI architecture is shown to deliver persistent, cross-regime, capacity-aware net alpha. More credible claims require point-in-time data and models, decision-aligned objectives, joint portfolio--execution evaluation, controlled adaptation, prospective tests, and authority-matched governance. These conditions can improve evidence and implementation; they do not guarantee profit.", "arxiv_id": "2609.04917", "arxiv_url": "https://arxiv.org/abs/2609.04917", "authors": ["Linsen Zhu", "Mengqing Cai"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8eAI\u5728\u80a1\u7968\u3001ETF\u3001\u4e2d\u5fc3\u5316\u4e0e\u94fe\u4e0a\u52a0\u5bc6\u5e02\u573a\u4e2d\u5e94\u7528\u7684\u6279\u5224\u6027\u7efc\u8ff0\u3002\u8bba\u6587\u7528\u201calpha\u8f6c\u5316\u94fe\u201d\u8bc4\u4f30\u4ece\u4fe1\u606f\u3001\u4fe1\u53f7\u3001\u6301\u4ed3\u3001\u6267\u884c\u5230\u6263\u8d39\u540e\u98ce\u9669\u8c03\u6574\u6536\u76ca\u7684\u5b8c\u6574\u8bc1\u636e\u3002", "categories": ["cs.AI", "q-fin.PM", "q-fin.TR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04917", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u673a\u5668\u5b66\u4e60\u3001\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u3001\u91d1\u878d\u8bed\u8a00\u6a21\u578b\u3001\u5f3a\u5316\u5b66\u4e60\u548c\u667a\u80fd\u4f53\u5728\u9884\u6d4b\u3001\u6587\u672c\u5904\u7406\u3001\u7ec4\u5408\u6784\u5efa\u4e0e\u6d41\u7a0b\u96c6\u6210\u4e0a\u6709\u8fdb\u5c55\u3002", "\u516c\u5f00\u7814\u7a76\u4e2d\uff0c\u80fd\u8bc1\u660e\u957f\u671f\u3001\u8de8\u5e02\u573a\u72b6\u6001\u3001\u8003\u8651\u5bb9\u91cf\u548c\u4ea4\u6613\u6210\u672c\u540e\u4ecd\u6709\u51c0Alpha\u7684\u8bc1\u636e\u5f88\u5c11\u3002", "\u65f6\u95f4\u6c61\u67d3\u3001\u5e78\u5b58\u8005\u504f\u5dee\u3001\u5f31\u57fa\u51c6\u3001\u91cd\u590d\u7b5b\u9009\u3001\u6267\u884c\u6210\u672c\u3001\u4ea4\u6613\u573a\u6240\u673a\u5236\u548c\u5bb9\u91cf\u7ea6\u675f\u90fd\u4f1a\u524a\u5f31\u56de\u6d4b\u6536\u76ca\u3002"], "keywords": ["\u91d1\u878dAI", "\u91cf\u5316\u6295\u8d44", "\u5f3a\u5316\u5b66\u4e60", "\u52a0\u5bc6\u5e02\u573a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04917v1", "published_at": "2026-09-04", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Artificial Intelligence in Equity and Crypto Markets: Progress, Profitability Evidence, and the Limits of Automated Investing", "tldr": "AI\u6295\u8d44\u8fdb\u6b65\u660e\u663e\uff0c\u4f46\u51c0Alpha\u8bc1\u636e\u4e0d\u8db3", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8eAI\u5728\u80a1\u7968\u3001ETF\u3001\u4e2d\u5fc3\u5316\u4e0e\u94fe\u4e0a\u52a0\u5bc6\u5e02\u573a\u4e2d\u5e94\u7528\u7684\u6279\u5224\u6027\u7efc\u8ff0\u3002\u8bba\u6587\u7528\u201calpha\u8f6c\u5316\u94fe\u201d\u8bc4\u4f30\u4ece\u4fe1\u606f\u3001\u4fe1\u53f7\u3001\u6301\u4ed3\u3001\u6267\u884c\u5230\u6263\u8d39\u540e\u98ce\u9669\u8c03\u6574\u6536\u76ca\u7684\u5b8c\u6574\u8bc1\u636e\u3002", "why_notable": "\u8bba\u6587\u5f3a\u8c03\u6280\u672f\u80fd\u529b\u4e0d\u7b49\u4e8e\u53ef\u6295\u8d44\u76c8\u5229\u80fd\u529b\uff0c\u4e3a\u8bc4\u4f30AI\u81ea\u52a8\u5316\u6295\u8d44\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u8bc1\u636e\u6846\u67b6\uff0c\u4e5f\u63d0\u9192\u7814\u7a76\u8005\u91cd\u89c6\u524d\u77bb\u6d4b\u8bd5\u3001\u771f\u5b9e\u8d44\u91d1\u5ba1\u8ba1\u548c\u7ec4\u5408\u2014\u6267\u884c\u4e00\u4f53\u5316\u8bc4\u4f30\u3002"}, {"abstract": "Automotive infotainment validation still relies on manual testing, slow, costly, and incompatible with agile releases and OTA updates. Scripted automation only partly helps: it couples test logic to implementation, yielding brittle, high-maintenance suites. Existing LLM-driven frameworks mostly target web/mobile apps, using single- or dual-agent setups that overload one or two models with perception, planning, action selection, and validation at once, prone to hallucinations and unproductive exploration loops given infotainment complexity. We present ARIA (Autonomous Real-time Infotainment Assessment), a multi-agent LLM framework that autonomously runs end-to-end tests on Android infotainment systems via visual interaction, using a closed-loop pipeline of four specialized agents per step plus a report stage. From single-sentence scenarios (path, action, expected outcome), ARIA runs the interactions and produces reports, reproducible scripts, and visual evidence per step. Evaluated on a manufacturer\u0027s physical Android infotainment system across 30 scenarios, ARIA completed 28 (93.3%) with a verdict (2 errored), 20 of which (71.4%) matched ground truth. It caught all 5 known defects, no fault passed as working; its 8 false positives stem from navigation/image limits and unsupported gestures, showing multi-agent LLMs can run infotainment tests industrially while exposing the cost of a low false-positive tolerance. A single-agent baseline confirms the multi-agent design\u0027s value: on the first pass, before stronger-model revisitation narrows the gap, it shows a far higher false-positive rate (72.0% vs. 52.6%), conflating navigational difficulty with system failure. We report first-pass/post-revisitation results, token/call/cost per scenario, and show via repeated runs that stability tracks complexity, with fault detection perfectly consistent, pointing to CI integration of visual testing.", "arxiv_id": "2609.04913", "arxiv_url": "https://arxiv.org/abs/2609.04913", "authors": ["Ant\u00f3nio Azevedo", "Bruno Lima", "Jo\u00e3o Pascoal Faria"], "brief": "ARIA \u662f\u4e00\u4e2a\u9762\u5411 Android \u8f66\u8f7d\u4fe1\u606f\u5a31\u4e50\u7cfb\u7edf\u7684\u591a\u667a\u80fd\u4f53 LLM \u6d4b\u8bd5\u6846\u67b6\uff0c\u53ef\u4ece\u5355\u53e5\u6d4b\u8bd5\u573a\u666f\u51fa\u53d1\uff0c\u901a\u8fc7\u89c6\u89c9\u4ea4\u4e92\u81ea\u52a8\u6267\u884c\u7aef\u5230\u7aef\u6d4b\u8bd5\uff0c\u5e76\u751f\u6210\u62a5\u544a\u3001\u53ef\u590d\u73b0\u811a\u672c\u548c\u89c6\u89c9\u8bc1\u636e\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04913", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u6bcf\u6b65\u56db\u4e2a\u4e13\u95e8\u667a\u80fd\u4f53\u52a0\u62a5\u544a\u9636\u6bb5\u7684\u95ed\u73af\u6d41\u7a0b\uff0c\u5206\u62c5\u611f\u77e5\u3001\u89c4\u5212\u3001\u52a8\u4f5c\u9009\u62e9\u4e0e\u9a8c\u8bc1\u4efb\u52a1", "\u5728\u67d0\u5382\u5546\u5b9e\u4f53 Android \u4fe1\u606f\u5a31\u4e50\u7cfb\u7edf\u7684 30 \u4e2a\u573a\u666f\u4e0a\u6d4b\u8bd5\uff0c28 \u4e2a\u5b8c\u6210\u5e76\u7ed9\u51fa\u7ed3\u8bba\uff0c20 \u4e2a\u4e0e\u4eba\u5de5\u771f\u503c\u4e00\u81f4", "\u6210\u529f\u6355\u83b7\u5168\u90e8 5 \u4e2a\u5df2\u77e5\u7f3a\u9677\uff0c\u8bef\u62a5\u4e3b\u8981\u6765\u81ea\u5bfc\u822a/\u56fe\u50cf\u8bc6\u522b\u9650\u5236\u548c\u4e0d\u652f\u6301\u7684\u624b\u52bf"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u591a\u6a21\u6001", "\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04913v1", "published_at": "2026-09-04", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ARIA - An Agentic Framework for Autonomous Testing of Infotainment Systems", "tldr": "\u591a\u667a\u80fd\u4f53\u81ea\u4e3b\u6d4b\u8bd5\u8f66\u8f7d\u4fe1\u606f\u5a31\u4e50\u7cfb\u7edf", "upvotes": 0, "what_it_is": "ARIA \u662f\u4e00\u4e2a\u9762\u5411 Android \u8f66\u8f7d\u4fe1\u606f\u5a31\u4e50\u7cfb\u7edf\u7684\u591a\u667a\u80fd\u4f53 LLM \u6d4b\u8bd5\u6846\u67b6\uff0c\u53ef\u4ece\u5355\u53e5\u6d4b\u8bd5\u573a\u666f\u51fa\u53d1\uff0c\u901a\u8fc7\u89c6\u89c9\u4ea4\u4e92\u81ea\u52a8\u6267\u884c\u7aef\u5230\u7aef\u6d4b\u8bd5\uff0c\u5e76\u751f\u6210\u62a5\u544a\u3001\u53ef\u590d\u73b0\u811a\u672c\u548c\u89c6\u89c9\u8bc1\u636e\u3002", "why_notable": "\u8bba\u6587\u5c06 LLM \u591a\u667a\u80fd\u4f53\u4ece\u7f51\u9875/\u79fb\u52a8\u5e94\u7528\u6d4b\u8bd5\u6269\u5c55\u5230\u66f4\u590d\u6742\u7684\u8f66\u8f7d\u4fe1\u606f\u5a31\u4e50\u7cfb\u7edf\uff0c\u5c55\u793a\u4e86\u5176\u5728\u5de5\u4e1a\u7ea7\u89c6\u89c9\u81ea\u52a8\u5316\u6d4b\u8bd5\u548c CI \u96c6\u6210\u4e2d\u7684\u6f5c\u529b\uff0c\u540c\u65f6\u91cf\u5316\u4e86\u8bef\u62a5\u3001\u6210\u672c\u4e0e\u7a33\u5b9a\u6027\u95ee\u9898\u3002"}, {"abstract": "We present Iris-mini and Iris-pro, two search agents trained at the 35B-A3B and 397B-A17B scales, together with the data pipeline and training recipe behind them. Tasks are reverse-constructed from the hyperlink structure of a web corpus: we author multi-hop chains over an entity graph distilled from a seed page and its out-links, rewrite every non-answer entity into a descriptive reference so that no clue can be resolved by string matching, and admit only questions that a reference model fails closed-book yet solves once the supporting evidence is supplied. These questions are then turned into trajectories, which are filtered at both the trajectory and the turn level before SFT. The policy is then optimized by RL against live search, with the reward judge and the observation summarizer served inside the training cluster, and with over-long rollouts interrupted at the request level and resumed from their committed prefix at the next step. We alternate the two stages in a procedure we call SFT-RL climbing, returning the hardest solved and most efficient rollouts of each RL round to the next supervised pass. Because inference-time context management is worth more on these benchmarks than most reported differences between systems, we evaluate every benchmark both with and without it, holding the tool set, the context limit, and the judge fixed. All results come from a single ReAct agent, with no sub-agents and no test-time verification. With management enabled, on BrowseComp, BrowseComp-ZH, DeepSearchQA, and HLE the two models reach $82.2/84.8/86.9/52.3$ and $88.6/85.1/92.9/56.4$, the strongest overall results among open-source search agents in their respective parameter ranges. We plan to release the model weights together with the complete recipe for data construction, training, and evaluation.", "arxiv_id": "2609.04304", "arxiv_url": "https://arxiv.org/abs/2609.04304", "authors": ["Ziyuan Liu", "Hengqi Liu", "Zichuan Wang", "Yang Qin", "Jiachen Liang", "Xu Chu", "Shaowei Chen", "Yuantao Gu", "Mu Chuan"], "brief": "\u8bba\u6587\u63d0\u51fa Iris-mini \u4e0e Iris-pro \u4e24\u4e2a\u5927\u89c4\u6a21\u641c\u7d22\u667a\u80fd\u4f53\uff0c\u5e76\u516c\u5f00\u5176\u57fa\u4e8e\u7f51\u9875\u5b9 imbing to the Search Frontier", "tldr": "Iris\u7528SFT-RL\u6500\u767b\u8bad\u7ec3\u5237\u65b0\u5f00\u6e90\u641c\u7d22\u667a\u80fd\u4f53\u8868\u73b0", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Iris-mini \u4e0e Iris-pro \u4e24\u4e2a\u5927\u89c4\u6a21\u641c\u7d22\u667a\u80fd\u4f53\uff0c\u5e76\u516c\u5f00\u5176\u57fa\u4e8e\u7f51\u9875\u5b9e\u4f53\u56fe\u53cd\u5411\u6784\u9020\u591a\u8df3\u95ee\u9898\u7684\u6570\u636e\u6d41\u6c34\u7ebf\u4e0e\u8bad\u7ec3\u65b9\u6848\u3002\u6a21\u578b\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e0e\u5728\u7ebf\u641c\u7d22\u5f3a\u5316\u5b66\u4e60\u4ea4\u66ff\u8fed\u4ee3\uff0c\u5728\u591a\u4e2a\u641c\u7d22\u95ee\u7b54\u57fa\u51c6\u4e0a\u8fbe\u5230\u540c\u89c4\u6a21\u5f00\u6e90\u6700\u5f3a\u7ed3\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u4ec5\u62a5\u544a\u4e86 Iris-mini/pro \u5728 BrowseComp\u3001DeepSearchQA\u3001HLE \u7b49\u57fa\u51c6\u4e0a\u7684\u5f00\u6e90\u9886\u5148\u6210\u7ee9\uff0c\u8fd8\u7ed9\u51fa\u53ef\u590d\u73b0\u7684\u6570\u636e\u6784\u9020\u3001\u8bad\u7ec3\u548c\u8bc4\u6d4b\u914d\u65b9\uff0c\u5bf9\u6784\u5efa\u771f\u5b9e\u7f51\u9875\u641c\u7d22\u667a\u80fd\u4f53\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We study the problem of generating a compositional 3D representation of a cluttered scene containing hundreds of objects. The goal is to represent the scene as a collection of individual object meshes placed in a shared world frame, as required by downstream applications such as gaming, AR/VR, simulation, and robotics. This task is challenging in densely cluttered scenes, where objects heavily occlude one another and each view reveals only a fraction of their geometry. Geometry-based approaches typically reconstruct the scene as a single representation and leave incomplete geometry in occluded regions, while existing compositional methods with generative priors are largely limited to relatively simple scenes. We show that complex scenes with hundreds of objects can instead be gene
