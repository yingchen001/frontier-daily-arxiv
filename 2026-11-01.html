<script>
const PAPERS = [{"abstract": "Robot agents built on vision-language models depend on both the planner and its harness: the tools, feedback, memory, and recovery logic around it. Can improvements to a large teacher\u0027s harness be carried into a compact agent with lower inference compute cost? We present TinyAstral, a two-stage approach. We first freeze an open-weight teacher and improve its harness through recursive self-improvement (RSI): frontier LLM agents read the teacher\u0027s trajectories and propose harness edits, and each edit is accepted only if it passes a paired statistical test. We then freeze the final harness, collect teacher trajectories with reasoning and failure recovery, and distill a small student that replaces the teacher in the same harness. On RoboTwin, harness evolution raises the teacher\u0027s success from 33.4% to 63.6%; the final 4B student reaches 62.8%. Across four harness versions, distilled 4B students score close to their corresponding teachers, and later versions yield stronger students, showing that harness evolution gains carry into compact models. The harness gains also transfer to other frozen planners without retraining. On identical episodes, the final 4B student outperforms open 4B agents, the open 27B harness-RSI model SenseNova-RoboRSI, and our own teacher model placed in three competitors\u0027 harnesses. It stays close to its teacher on all three training benchmarks, and on three benchmarks never used for RSI or training it scores close to a 552B planner running the same harness. On the measured deployment episodes, it uses about one fifth of its teacher\u0027s accelerator time.", "arxiv_id": "2610.41216", "arxiv_url": "https://arxiv.org/abs/2610.41216", "authors": ["Kehong Gong", "Xiaoxu Zheng", "Guanli Hou", "Seunghun Lee", "Mengqi Guo", "Runjia Tan", "Zhengyu Wen", "Qi Wang", "Xiaoyu He", "Mingyuan Zhang", "Michael Bi Mi"], "brief": "TinyAstral\u5148\u7528\u9012\u5f52\u81ea\u6539\u8fdb\u4f18\u5316\u51bb\u7ed3\u6559\u s trustworthy. Unlike prior work on conflicts between a model\u0027s knowledge and its context, we study conflicts among the tools themselves: what happens when this machine-generated evidence is conflicting or wrong. On the corrected CIC-IDS2017 dataset, four heterogeneous detectors emit labels and confidences that we corrupt under a threat model varying the number of corrupted tools, the persistence of the corruption, and the confidence attached to wrong outputs. Across open-weight LLMs from 3B to 14B parameters, unverified investigators are fragile: one corrupted detector out of four lowers naive accuracy to .50-.72, three lower every unverified investigator to .13 or less, and honest disagreement alone makes them abstain on up to 63% of flows. We propose Conflict-Aware Evidence Verification (CAV), built from established components: an equal-weight vote that ignores reported confidences, an evidence-conflict gate, and an independent nearest-neighbour trust check that tests the leading candidates. With its prompt frozen before testing, CAV-LLM improves on the naive investigator in every corrupted condition ($p \u003c 0.001$), reaching .84-.88 with three corrupted detectors against at most .08, while calling the LLM on 0.4% of clean traffic. A fixed verification rule is as accurate or better unless most tools are corrupted. When we make the independent channel itself noisy, CAV inherits its errors: it stays ahead when two or more tools are corrupted, but adding the channel as an extra voter is better when at most one is. Verification thus moves trust from the tools to the check, which must be measured and protected in turn.", "arxiv_id": "2610.41191", "arxiv_url": "https://arxiv.org/abs/2610.41191", "authors": ["Yuchen Zhang"], "brief": "\u8bba\u6587\u6a21\u62df\u591a\u68c0\u6d4b\u5668\u8f93\u51fa\u88ab\u6c61\u67d3\u6216\u76f8\u4e92\u51b2\u7a81\u7684\u5a01\u80c1\u8c03\u67e5\u573a\u666f\uff0c\u8bc4\u4f303B\u523014B\u5f00\u6e90LLM\u3002\u63d0\u51faCAV\uff1a\u7b49\u6743\u6295\u7968\u3001\u51b2\u7a81\u95e8\u63a7\u4e0e\u72ec\u7acb\u8fd1\u90bb\u4fe1\u4efb\u68c0\u67e5\u7ec4\u5408\u9a8c\u8bc1\u8bc1\u636e\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41191", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["CIC-IDS2017\u4fee\u6b63\u7248\uff0c4\u4e2a\u5f02\u6784\u68c0\u6d4b\u5668", "\u4e09\u5de5\u5177\u6c61\u67d3\u65f6CAV\u51c6\u786e\u7387\u8fbe0.84-0.88", "\u5e72\u51c0\u6d41\u91cf\u4ec50.4%\u9700\u8c03\u7528LLM"], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u8bc1\u636e\u9a8c\u8bc1", "LLM\u4ee3\u7406", "\u5f02\u5e38\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41191v1", "published_at": "2026-10-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "When AI Investigators Cannot Trust Their Tools: Conflict-Aware Evidence Verification for Cyber Threat Investigation", "tldr": "\u7814\u7a76\u5b89\u5168\u544a\u8b66\u4e2d\u5de5\u5177\u8bc1\u636e\u51b2\u7a81\uff0c\u63d0\u51faCAV\u9a8c\u8bc1\u673a\u5236\u663e\u8457\u63d0\u5347\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6a21\u62df\u591a\u68c0\u6d4b\u5668\u8f93\u51fa\u88ab\u6c61\u67d3\u6216\u76f8\u4e92\u51b2\u7a81\u7684\u5a01\u80c1\u8c03\u67e5\u573a\u666f\uff0c\u8bc4\u4f303B\u523014B\u5f00\u6e90LLM\u3002\u63d0\u51faCAV\uff1a\u7b49\u6743\u6295\u7968\u3001\u51b2\u7a81\u95e8\u63a7\u4e0e\u72ec\u7acb\u8fd1\u90bb\u4fe1\u4efb\u68c0\u67e5\u7ec4\u5408\u9a8c\u8bc1\u8bc1\u636e\u3002", "why_notable": "\u6307\u51faLLM\u5b89\u5168\u8c03\u67e5\u5e76\u975e\u53ea\u9700\u4fe1\u4efb\u4e0a\u4e0b\u6587\uff0c\u8fd8\u8981\u9a8c\u8bc1\u673a\u5668\u8bc1\u636e\u672c\u8eab\uff1b\u7b80\u5355\u56fa\u5b9a\u89c4\u5219\u5728\u591a\u6570\u573a\u666f\u5df2\u80fd\u80dc\u8fc7\u672a\u9a8c\u8bc1\u4ee3\u7406\u3002"}, {"abstract": "Existing sketch generation methods often rely on image guidance and are largely limited to individual objects or simplified scenes, leaving text-guided complex scene sketching underexplored. We present SketchDirector, an agentic framework that mimics the human sketching workflow for automatic multi-concept scene sketching. Given a scene-level text prompt, SketchDirector first employs a large language model~(LLM) to decompose the scene into multiple draft assets, where each is represented by a set of B\u00e9zier curves. Then, an agentic reasoning loop iteratively plans and executes their spatial arrangement, guided by self-evolving memory. Finally, a detail refinement module leverages diffusion priors to enhance sketch quality while preserving geometric structure. To support future research and applications in multi-concept scene sketch generation, we further introduce the \\textit{MCSketch8K} dataset, comprising editable vector assets, compositional layouts, and object-level manipulation annotations. Extensive experiments show that SketchDirector outperforms state-of-the-art baselines in semantic and compositional quality while effectively preserving overall contour organization during refinement. The project page is: \\href{https://yiki77.github.io/SketchDirector/}{https://yiki77.github.io/SketchDirector/}.", "arxiv_id": "2610.41260", "arxiv_url": "https://arxiv.org/abs/2610.41260", "authors": ["Yiqi Liang", "Xiaodong Cun"], "brief": "SketchDirector\u5c06\u573a\u666f\u6587\u672c\u62c6\u6210\u591a\u4e2a\u8d1d\u585e\u5c14\u66f2\u7ebf\u8349\u56fe\u8d44\u4ea7\uff0c\u518d\u901a\u8fc7\u5e26\u81ea\u6f14\u5316\u8bb0\u5fc6\u7684\u4ee3\u7406\u5faa\u73af\u63a8\u7406\u7a7a\u95f4\u5e03\u5c40\uff0c\u6700\u540e\u7528\u6269\u6563\u5148\u9a8c\u7ec6\u5316\u7ec6\u8282\u5e76\u4fdd\u6301\u51e0\u4f55\u7ed3\u6784\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41260", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["LLM\u5206\u89e3\u573a\u666f\u4e3a\u591a\u6982\u5ff5\u8d1d\u585e\u5c14\u8d44\u4ea7", "\u4ee3\u7406\u5f0f\u5e03\u5c40\u63a8\u7406\u7ed3\u5408\u81ea\u6f14\u5316\u8bb0\u5fc6", "\u53d1\u5e03MCSketch8K\u77e2\u91cf\u8349\u56fe\u6570\u636e\u96c6"], "keywords": ["\u8349\u56fe\u751f\u6210", "\u667a\u80fd\u4f53", "\u5e03\u5c40\u63a8\u7406", "\u6269\u6563\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41260v1", "published_at": "2026-10-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SketchDirector: Complex Scene Sketching via Agentic Layout Reasoning and Detail Refinement", "tldr": "\u7528LLM\u4ee3\u7406\u89c4\u5212\u5e03\u5c40\u5e76\u6269\u6563\u7ec6\u5316\uff0c\u5b9e\u73b0\u6587\u672c\u9a71\u52a8\u590d\u6742\u573a\u666f\u77e2\u91cf\u8349\u56fe\u751f\u6210\u3002", "upvotes": 0, "what_it_is": "SketchDirector\u5c06\u573a\u666f\u6587\u672c\u62c6\u6210\u591a\u4e2a\u8d1d\u585e\u5c14\u66f2\u7ebf\u8349\u56fe\u8d44\u4ea7\uff0c\u518d\u901a\u8fc7\u5e26\u81ea\u6f14\u5316\u8bb0\u5fc6\u7684\u4ee3\u7406\u5faa\u73af\u63a8\u7406\u7a7a\u95f4\u5e03\u5c40\uff0c\u6700\u540e\u7528\u6269\u6563\u5148\u9a8c\u7ec6\u5316\u7ec6\u8282\u5e76\u4fdd\u6301\u51e0\u4f55\u7ed3\u6784\u3002", "why_notable": "\u628a\u8349\u56fe\u751f\u6210\u4ece\u5355\u7269\u4f53\u63a8\u8fdb\u5230\u53ef\u7f16\u8f91\u590d\u6742\u573a\u666f\uff0c\u517c\u987e\u8bed\u4e49\u7ec4\u5408\u3001\u5e03\u5c40\u63a7\u5236\u4e0e\u8f6e\u5ed3\u4fdd\u6301\uff0c\u5229\u4e8e\u540e\u7eed\u8bbe\u8ba1\u5de5\u5177\u548c\u6570\u636e\u7814\u7a76\u3002"}, {"abstract": "Cameras and vision sensors are widely used for product and process inspection in manufacturing environments. Traditionally, this process required thousands of images of both nominal and defective products to train such models. Recent research shows that vision transformer (ViT) models, such as CLIP, can reduce this requirement to 50-100 images per nominal and defective class. However, collecting even 50 defective images can be difficult in high-yield or low-volume manufacturing processes. In this paper, we examine the utility of two recently proposed structured decision models (Jev and Clef-Flash) in applications using as few as k=2 reference images per class at inference. In the process, we provide three main contributions: (a) a framework for k-shot learning of these models for image classification/inspection applications; (b) an agentic approach for automatically refining the text descriptions that guide image classification in these decision models; and (c) an approach to calibrate the resulting defect probabilities to improve their reliability for inspection decisions. We test these contributions in five manufacturing case studies. Using two reference images per class, both Jev and Clef-Flash outperform CLIP\u0027s test accuracies with the same references (0.75-1.00 [Jev] and 0.71-0.99 [Clef-Flash] vs 0.67-0.84 [CLIP]). Furthermore, we show that our agentic refinement of text descriptions significantly improves accuracy across 6 of 8 model-application combinations, and our calibration approach reduces the Brier score in 13 of the 15 model-application configurations. To support the reproducibility of our work, we provide our replication code and have created the R \"decisions\" package for evaluating additional models. We also provide a publicly available web app that allows practitioners to inspect their own images with no code.", "arxiv_id": "2610.41199", "arxiv_url": "https://arxiv.org/abs/2610.41199", "authors": ["Fadel M. Megahed", "Ying-Ju Chen"], "brief": "\u7814\u7a76\u5c06 Jev \u4e0e Clef-Flash \u7528\u4e8e\u6781\u5c11\u6837\u672c\u56fe\u50cf\u68c0\u6d4b\uff0c\u6bcf\u7c7b\u4ec5\u97002\u5f20\u53c2\u8003\u56fe\uff1b\u901a\u8fc7\u81ea\u52a8\u4f18\u5316\u6587\u672c\u63cf\u8ff0\u548c\u6982\u7387\u6821\u51c6\uff0c\u63d0\u5347\u7f3a\u9677\u5206\u7c7b\u7cbe\u5ea6\u4e0e\u51b3\u7b56\u53ef\u4fe1\u5ea6\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41199", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["k=2\u53c2\u8003\u56fe\u8fdb\u884c\u5c11\u6837\u672c\u68c0\u6d4b", "Jev\u51c6\u786e\u73870.75-1.00\uff0c\u4f18\u4e8eCLIP", "\u6821\u51c6\u4f7f13/15\u914d\u7f6eBrier\u5206\u6570\u4e0b\u964d"], "keywords": ["\u7f3a\u9677\u68c0\u6d4b", "\u5c11\u6837\u672c\u5b66\u4e60", "\u6982\u7387\u6821\u51c6", "\u5236\u9020\u8d28\u68c0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41199v1", "published_at": "2026-10-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond CLIP: Calibrated (Few-Shot) Defect Detection With System One Decision Models", "tldr": "\u7528\u7ed3\u6784\u5316\u51b3\u7b56\u6a21\u578b\u5b9e\u73b0\u4e24\u6837\u672c\u5236\u9020\u7f3a\u9677\u68c0\u6d4b\uff0c\u5e76\u6821\u51c6\u6982\u7387\u63d0\u5347\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5c06 Jev \u4e0e Clef-Flash \u7528\u4e8e\u6781\u5c11\u6837\u672c\u56fe\u50cf\u68c0\u6d4b\uff0c\u6bcf\u7c7b\u4ec5\u97002\u5f20\u53c2\u8003\u56fe\uff1b\u901a\u8fc7\u81ea\u52a8\u4f18\u5316\u6587\u672c\u63cf\u8ff0\u548c\u6982\u7387\u6821\u51c6\uff0c\u63d0\u5347\u7f3a\u9677\u5206\u7c7b\u7cbe\u5ea6\u4e0e\u51b3\u7b56\u53ef\u4fe1\u5ea6\u3002", "why_notable": "\u9762\u5411\u9ad8\u826f\u7387\u5236\u9020\u4e2d\u7f3a\u9677\u6837\u672c\u7a00\u7f3a\u7684\u75db\u70b9\uff0c\u663e\u8457\u964d\u4f4e\u89c6\u89c9\u8d28\u68c0\u90e8\u7f72\u95e8\u69db\uff0c\u5e76\u63d0\u4f9b\u4ee3\u7801\u3001R\u5305\u548c\u7f51\u9875\u5e94\u7528\u3002"}, {"abstract": "Why does length generalization (LG) depend so sharply on the positional encoding (PE)? Relative schemes extrapolate fixed offsets, absolute schemes fix positions, and neither handles growing offsets. We give a realizability theory for a deliberately controlled abstraction, a single positional-only attention head, that derives this well-documented empirical pattern and says precisely where it holds and breaks. The device is a simulation transfer operator $T_L$ that re-evaluates a selected length-$L_0$-realizing positional kernel on the longer grid, with a scalar $\u03b1_L \\in [0,1]$ read off before any training from $(\u03a6, t_n)$ alone. Here $\u03b1_L$ serves as the computable witness of that taxonomy\u0027s derivation, not as a stronger empirical predictor. Our results are a relative-head deep-row characterization for kernels with a strict unique global maximizer (Theorem 2), an absolute/relative duality that derives the pattern (Proposition 4), a learned-absolute underdetermination result, and a static expressivity bound; a sufficiency theorem (Theorem 1) bridges $\u03b1_L$ to LG, and the general deterministic case is a precise open conjecture (correcting a tempting but invalid \"outside-colspan\" argument). Experiments confirm the structure: in the controlled single-head regime $\u03b1_L$ exactly separates the taxonomy\u0027s generalizing and non-generalizing (PE, task) cells (2625 trained-model measurements; stable at vocab 64/d=128). Together, these results turn the received PE taxonomy into a positional-kernel transfer theorem, and identify the content and depth mechanisms that escape it. The theory concerns the positional channel alone: tasks whose targets depend on token content, including the standard length-generalization suite such as addition and sorting, fall outside Theorem 2.", "arxiv_id": "2610.41218", "arxiv_url": "https://arxiv.org/abs/2610.41218", "authors": ["Jiasong Han", "Yunkai Chai", "Jintao Wang"], "brief": "\u8bba\u6587\u6784\u5efa\u53d7\u63a7\u7684\u5355\u5934\u7eaf\u4f4d\u7f6e\u6ce8\u610f\u529b\u62bd\u8c61\uff0c\u7528\u4eff\u771f\u8fc1\u79fb\u7b97\u5b50\u5728\u66f4\u957f\u5e8f\u5217\u4e0a\u91cd\u8bc4\u4f4d\u7f6e\u6838\uff0c\u5e76\u4ee5\u8bad\u7ec3\u524d\u53ef\u8ba1\u7b97\u7684\u03b1_L\u523b\u753b\u957f\u5ea6\u6cdb\u5316\u6761\u4ef6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41218", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["T_L\u8fc1\u79fb\u7b97\u5b50\u91cd\u8bc4\u957f\u5ea6L0\u4f4d\u7f6e\u6838", "\u03b1_L\u7531\u03a6\u4e0et_n\u8bad\u7ec3\u524d\u8ba1\u7b97", "2625\u6b21\u5355\u5934\u5b9e\u9a8c\u9a8c\u8bc1\u5206\u7c7b\u5206\u754c"], "keywords": ["\u957f\u5ea6\u6cdb\u5316", "\u4f4d\u7f6e\u7f16\u7801", "\u6ce8\u610f\u529b\u673a\u5236", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41218v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Positional Realizability Theory of Length Generalization in Single-Head Attention", "tldr": "\u7528\u5355\u5934\u4f4d\u7f6e\u6ce8\u610f\u529b\u7406\u8bba\u89e3\u91ca\u957f\u5ea6\u6cdb\u5316\u4e3a\u4f55\u5f3a\u4f9d\u8d56\u4f4d\u7f6e\u7f16\u7801\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u53d7\u63a7\u7684\u5355\u5934\u7eaf\u4f4d\u7f6e\u6ce8\u610f\u529b\u62bd\u8c61\uff0c\u7528\u4eff\u771f\u8fc1\u79fb\u7b97\u5b50\u5728\u66f4\u957f\u5e8f\u5217\u4e0a\u91cd\u8bc4\u4f4d\u7f6e\u6838\uff0c\u5e76\u4ee5\u8bad\u7ec3\u524d\u53ef\u8ba1\u7b97\u7684\u03b1_L\u523b\u753b\u957f\u5ea6\u6cdb\u5316\u6761\u4ef6\u3002", "why_notable": "\u628a\u7ecf\u9a8c\u6027\u4f4d\u7f6e\u7f16\u7801\u5206\u7c7b\u8f6c\u5316\u4e3a\u53ef\u8bc1\u660e\u7684\u4f4d\u7f6e\u6838\u8fc1\u79fb\u5b9a\u7406\uff0c\u540c\u65f6\u660e\u786e\u5185\u5bb9\u4f9d\u8d56\u4efb\u52a1\u548c\u6df1\u5c42\u673a\u5236\u4e0d\u5728\u9002\u7528\u8303\u56f4\u5185\u3002"}, {"abstract": "End-to-end (E2E) autonomous driving models achieve strong planning performance but remain largely opaque, limiting observability and trust. We apply mechanistic interpretability to E2E driving by training Sparse Autoencoders (SAEs) on the internal activations of a simple, single-camera end-to-end path planning model. Unsupervised clustering of SAE latents reveals interpretable structure aligned with route intent, vehicle speed, and braking behavior, recovering route intent with 98.3% accuracy without supervision. Through paired counterfactual image edits, we further show that specific SAE features are visually grounded and systematically respond to scene changes such as traffic light state and stop sign presence. Steering individual SAE latents produces predictable, monotonic changes in planner outputs including lateral displacement, curvature, and braking. Finally, we demonstrate a practical application of these representations: we build a lightweight adapter trained on SAE latents that reduces trajectory selection error by 3.44%, outperforming an equivalent adapter that omits SAE latents, confirming that the sparse representation captures useful information for interpretability. Code and visualizations are available at https://mgagvani.github.io/mechanistic-interpretability-for-e2e-driving/", "arxiv_id": "2610.41185", "arxiv_url": "https://arxiv.org/abs/2610.41185", "authors": ["Manav Gagvani", "Benjamin Namikas", "Sivamurugan Velmurugan", "Nysa Kumar", "Shrey Sharma", "Thomas Peterson", "Pratyush Mathur", "Hyunseo Chang", "Rohan Paleja"], "brief": "\u7814\u7a76\u5c06\u673a\u5236\u53ef\u89e3\u91ca\u6027\u5f15\u5165\u5355\u76ee\u7aef\u5230\u7aef\u8def\u5f84\u89c4\u5212\u6a21\u578b\uff0c\u5728\u5185\u90e8\u6fc0\u6d3b\u4e0a\u8bad\u7ec3SAE\uff0c\u5e76\u5206\u6790\u5176\u7a00\u758f\u6f5c\u53d8\u91cf\u4e0e\u8def\u7ebf\u610f\u56fe\u3001\u901f\u5ea6\u3001\u5239\u8f66\u53ca\u573a\u666f\u5143\u7d20\u7684\u5bf9\u5e94\u5173\u7cfb\u3002", "categories": ["cs.RO", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41185", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["SAE\u6f5c\u53d8\u91cf\u65e0\u76d1\u7763\u6062\u590d\u8def\u7ebf\u610f\u56fe98.3%", "\u53cd\u4e8b\u5b9e\u56fe\u50cf\u7f16\u8f91\u9a8c\u8bc1\u7ea2\u7eff\u706f\u3001\u505c\u724c\u7279\u5f81", "\u64cd\u63a7\u5355\u4e2a\u6f5c\u53d8\u91cf\u5355\u8c03\u6539\u53d8\u6a2a\u5411\u504f\u79fb\u548c\u5239\u8f66"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u7aef\u5230\u7aef\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41185v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Mechanistic Interpretability for End-to-End Self-Driving", "tldr": "\u7528\u7a00\u758f\u81ea\u7f16\u7801\u5668\u62c6\u89e3\u7aef\u5230\u7aef\u9a7e\u9a76\u6a21\u578b\u5185\u90e8\u8868\u5f81\uff0c\u53d1\u73b0\u53ef\u63a7\u4e14\u6709\u7528\u7684\u8bed\u4e49\u7279\u5f81\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5c06\u673a\u5236\u53ef\u89e3\u91ca\u6027\u5f15\u5165\u5355\u76ee\u7aef\u5230\u7aef\u8def\u5f84\u89c4\u5212\u6a21\u578b\uff0c\u5728\u5185\u90e8\u6fc0\u6d3b\u4e0a\u8bad\u7ec3SAE\uff0c\u5e76\u5206\u6790\u5176\u7a00\u758f\u6f5c\u53d8\u91cf\u4e0e\u8def\u7ebf\u610f\u56fe\u3001\u901f\u5ea6\u3001\u5239\u8f66\u53ca\u573a\u666f\u5143\u7d20\u7684\u5bf9\u5e94\u5173\u7cfb\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86E2E\u81ea\u52a8\u9a7e\u9a76\u9ed1\u7bb1\u5185\u90e8\u53ef\u88ab\u8bed\u4e49\u5316\u5206\u89e3\uff0c\u5e76\u80fd\u76f4\u63a5\u6539\u5584\u8f68\u8ff9\u9009\u62e9\uff0c\u4e3a\u53ef\u4fe1\u89c4\u5212\u63d0\u4f9b\u65b0\u5de5\u5177\u3002"}, {"abstract": "Real-world image editing requires coordinating multiple visual transformations with content preservation and reference constraints, yet aggregate scores can readily obscure unmet local requirements. Effective evaluation must therefore identify local failures and translate them into priorities for subsequent model improvement. We introduce WeGenEditBench, comprising 2,740 evaluation instances and 148 task types across single-image, text-intensive, and multi-reference editing. Pre-generated checklists shared across models decompose each request into atomic requirements; item-level deductions and visual evidence are established first and then summarized into scores for edit execution, preservation, visual quality, and task-specific correctness. To support the experience-acquisition component of recursive self-improvement (RSI), we develop WeGenEvoStudio, a unified multi-agent harness for RSI-oriented learning that integrates model-conditioned failure diagnosis, retrieval-grounded data construction, supervised adaptation, and re-evaluation. Among 15 evaluated configurations, GPT-Image-2 leads single-image editing with an Overall score of 4.076, while Seedream-5.0-Pro leads text-intensive editing at 4.291. Evolution experiments across four generation and editing benchmarks demonstrate substantial targeted gains: on their report-selected Top-5 single-image targets, FLUX.2 [dev] improves Overall from 1.083 to 3.517, while Qwen-Image-Edit-2511 gains 13.2%. Together, our benchmark and harness provide a foundation for developing more reliable image models through interpretable evaluation and feedback-driven learning.", "arxiv_id": "2610.41210", "arxiv_url": "https://arxiv.org/abs/2610.41210", "authors": ["Jun He", "Canmiao Fu", "Ying Zhang", "Zhipeng Huang", "Chenyu Mu", "Yazhen Xie", "Chen Li", "Jing Lyu", "Weijia Li", "Xiang Zhang"], "brief": "\u63d0\u51fa WeGenEditBench\uff0c\u8986\u76d62740\u4e2a\u5b9e\u4f8b\u548c148\u7c7b\u56fe\u50cf\u7f16\u8f91\u4efb\u52a1\uff1b\u540c\u65f6\u6784\u5efa WeGenEvoStudio\uff0c\u7528\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\u5b8c\u6210\u5931\u8d25\u8bca\u65ad\u3001\u68c0\u7d22\u9020\u6570\u3001\u76d1\u7763\u5fae\u8c03\u4e0e\u590d\u6d4b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41210", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["2740\u5b9e\u4f8b\u3001148\u4efb\u52a1\u7c7b\u578b\u7684\u7f16\u8f91\u57fa\u51c6", "\u539f\u5b50\u6e05\u5355\u9010\u9879\u6263\u5206\u5e76\u4fdd\u7559\u89c6\u89c9\u8bc1\u636e", "15\u79cd\u914d\u7f6e\u8bc4\u6d4b\uff0c\u542b\u56db\u4e2a\u8fdb\u5316\u5b9e\u9a8c"], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u6a21\u578b\u8bc4\u6d4b", "\u81ea\u6211\u6539\u8fdb", "\u591a\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41210v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Evaluation to Evolution: Benchmarking Image Editing and Evolving Image Models", "tldr": "\u7528\u7ec6\u7c92\u5ea6\u6e05\u5355\u8bc4\u6d4b\u56fe\u50cf\u7f16\u8f91\uff0c\u5e76\u628a\u5931\u8d25\u8bca\u65ad\u8f6c\u5316\u4e3a\u6a21\u578b\u8fed\u4ee3\u6570\u636e\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa WeGenEditBench\uff0c\u8986\u76d62740\u4e2a\u5b9e\u4f8b\u548c148\u7c7b\u56fe\u50cf\u7f16\u8f91\u4efb\u52a1\uff1b\u540c\u65f6\u6784\u5efa WeGenEvoStudio\uff0c\u7528\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\u5b8c\u6210\u5931\u8d25\u8bca\u65ad\u3001\u68c0\u7d22\u9020\u6570\u3001\u76d1\u7763\u5fae\u8c03\u4e0e\u590d\u6d4b\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u4ece\u603b\u5206\u63a8\u8fdb\u5230\u53ef\u5b9a\u4f4d\u5931\u8d25\uff0c\u5e76\u95ed\u73af\u9a71\u52a8\u9488\u5bf9\u6027\u6539\u8fdb\uff0c\u4e3a\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u7684\u53ef\u9760\u8fed\u4ee3\u63d0\u4f9b\u5de5\u5177\u94fe\u3002"}, {"abstract": "We study the general problem of estimating $D(\\dde(S))$, the probability that an unknown distribution $D$ assigns to an event determined by a sample $S$ of $n$ i.i.d.\\ draws from $D$ through a known mapping $\\dde$. The estimation algorithm knows $\\dde$ and $S$ but does not have access to any additional samples from $D$. This formulation captures classical missing mass, the data-dependent targets of adaptive data analysis and post-selection inference, and the test error of a data-trained predictor, whose estimation was recently studied by \\new{Gastpar et al.\\ (2024a,b)}. Within this framework we examine the two classical approaches to estimation. The error of the empirical plug-in estimator is exactly a generalization gap, so generalization bounds transfer to it directly. The leave-one-out estimator, which recovers the Good--Turing estimator, is accurate for every mapping that is stable under the deletion of one sample point, including new structured examples such as neighborhoods of the sample and pierced sets. The main application of our framework is to error estimation for a predictor that combines a base classifier with memorized exceptions, a structure common in theory and in practice. For it, the test error is exactly the missing mass restricted to the error region of the base classifier, a region selected by the same sample. We formulate the general problem of \\emph{adaptive missing mass estimation} to address such dependence and propose a natural hybrid estimator, the Good--Turing estimator restricted to the selected region. We show that the generalization of the base classifier alone does not guarantee the accuracy of this estimator, and derive two bounds on its error: the first one based on the VC dimension of possible error regions and another based on the mutual information of the selected region with the sample.", "arxiv_id": "2610.41244", "arxiv_url": "https://arxiv.org/abs/2610.41244", "authors": ["Vitaly Feldman", "Satyen Kale", "Vinod Raman", "Kunal Talwar", "Ambuj Tewari"], "brief": "\u8bba\u6587\u7814\u7a76\u4ec5\u51ed\u6837\u672c\u4f30\u8ba1\u7531\u8be5\u6837\u672c\u51b3\u5b9a\u7684\u4e8b\u4ef6\u6982\u7387\uff0c\u7edf\u4e00\u7ecf\u9a8c\u63d2\u5165\u4e0e\u7559\u4e00\u6cd5\u4e24\u7c7b\u4f30\u8ba1\u5668\uff0c\u5e76\u5206\u6790\u5e26\u8bb0\u5fc6\u4f8b\u5916\u5206\u7c7b\u5668\u7684\u6d4b\u8bd5\u8bef\u5dee\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41244", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d2\u5165\u4f30\u8ba1\u8bef\u5dee\u7b49\u4e8e\u6cdb\u5316\u95f4\u9699", "\u7559\u4e00\u6cd5\u63a8\u5e7fGood\u2013Turing\u4f30\u8ba1", "\u7ed9\u51faVC\u7ef4\u4e0e\u4e92\u4fe1\u606f\u8bef\u5dee\u754c"], "keywords": ["\u6982\u7387\u4f30\u8ba1", "\u7f3a\u5931\u8d28\u91cf", "\u6cdb\u5316\u754c", "\u6d4b\u8bd5\u8bef\u5dee"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41244v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Unified Framework for Probability Estimation of Data-Dependent Events", "tldr": "\u7edf\u4e00\u523b\u753b\u6837\u672c\u4f9d\u8d56\u4e8b\u4ef6\u6982\u7387\u4f30\u8ba1\uff0c\u8fde\u63a5\u7f3a\u5931\u8d28\u91cf\u3001\u81ea\u9002\u5e94\u5206\u6790\u4e0e\u6d4b\u8bd5\u8bef\u5dee\u4f30\u8ba1\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u4ec5\u51ed\u6837\u672c\u4f30\u8ba1\u7531\u8be5\u6837\u672c\u51b3\u5b9a\u7684\u4e8b\u4ef6\u6982\u7387\uff0c\u7edf\u4e00\u7ecf\u9a8c\u63d2\u5165\u4e0e\u7559\u4e00\u6cd5\u4e24\u7c7b\u4f30\u8ba1\u5668\uff0c\u5e76\u5206\u6790\u5e26\u8bb0\u5fc6\u4f8b\u5916\u5206\u7c7b\u5668\u7684\u6d4b\u8bd5\u8bef\u5dee\u3002", "why_notable": "\u8be5\u6846\u67b6\u628a\u591a\u4e2a\u7ecf\u5178\u95ee\u9898\u7eb3\u5165\u540c\u4e00\u89c6\u89d2\uff0c\u5e76\u6307\u51fa\u57fa\u5206\u7c7b\u5668\u6cdb\u5316\u4e0d\u8db3\u4ee5\u4fdd\u8bc1\u81ea\u9002\u5e94\u7f3a\u5931\u8d28\u91cf\u4f30\u8ba1\u53ef\u9760\u3002"}, {"abstract": "We develop a divergence-kernel method for jointly optimizing neural SDE drift and diffusion fields and the initial Gaussian distribution, using losses that depend directly on the terminal density. In two- and eight-dimensional Gaussian-mixture experiments, we learn time-independent fields and obtain far fewer off-mode samples than score-based generators with similar parameter counts. The drift attracts samples toward the modes, while the diffusion helps disperse excess probability between them.", "arxiv_id": "2610.41243", "arxiv_url": "https://arxiv.org/abs/2610.41243", "authors": ["Angxiu Ni"], "brief": "\u63d0\u51fadivergence-kernel\u65b9\u6cd5\uff0c\u76f4\u63a5\u57fa\u4e8e\u7ec8\u7aef\u5bc6\u5ea6\u4f18\u5316\u795e\u7ecfSDE\u7684\u6f02\u79fb\u573a\u3001\u6269\u6563\u573a\u548c\u521d\u59cb\u9ad8\u65af\u5206\u5e03\u3002\u5728\u9ad8\u65af\u6df7\u5408\u5b9e\u9a8c\u4e2d\u5b66\u4e60\u65f6\u95f4\u65e0\u5173\u52a8\u529b\u5b66\u3002", "categories": ["cs.LG", "math.DS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41243", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u8054\u5408\u8bad\u7ec3\u6f02\u79fb\u3001\u6269\u6563\u548c\u521d\u59cb\u9ad8\u65af", "\u635f\u5931\u76f4\u63a5\u4f9d\u8d56\u7ec8\u7aef\u5bc6\u5ea6", "2\u7ef4\u4e0e8\u7ef4\u9ad8\u65af\u6df7\u5408\u9a8c\u8bc1"], "keywords": ["\u751f\u6210\u6a21\u578b", "\u968f\u673a\u5fae\u5206\u65b9\u7a0b", "\u5bc6\u5ea6\u4f30\u8ba1", "\u6269\u6563\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41243v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Generative SDEs with Trainable Diffusion and Density-Based Losses", "tldr": "\u7528\u5bc6\u5ea6\u635f\u5931\u8054\u5408\u5b66\u4e60SDE\u6f02\u79fb\u3001\u6269\u6563\u4e0e\u521d\u59cb\u5206\u5e03\uff0c\u751f\u6210\u6837\u672c\u66f4\u5c11\u504f\u79bb\u6a21\u6001\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fadivergence-kernel\u65b9\u6cd5\uff0c\u76f4\u63a5\u57fa\u4e8e\u7ec8\u7aef\u5bc6\u5ea6\u4f18\u5316\u795e\u7ecfSDE\u7684\u6f02\u79fb\u573a\u3001\u6269\u6563\u573a\u548c\u521d\u59cb\u9ad8\u65af\u5206\u5e03\u3002\u5728\u9ad8\u65af\u6df7\u5408\u5b9e\u9a8c\u4e2d\u5b66\u4e60\u65f6\u95f4\u65e0\u5173\u52a8\u529b\u5b66\u3002", "why_notable": "\u76f8\u6bd4\u540c\u89c4\u6a21score-based\u751f\u6210\u5668\u663e\u8457\u51cf\u5c11off-mode\u6837\u672c\uff0c\u5c55\u793a\u53ef\u8bad\u7ec3\u6269\u6563\u9879\u5728\u591a\u6a21\u6001\u751f\u6210\u4e2d\u7684\u4f5c\u7528\u3002"}, {"abstract": "In pattern analysis, models trained independently for the same task often develop complementary capabilities through differences in architecture, data, and optimization. Exploiting complementarity while retaining independent deployment is central to collaborative learning. Most methods establish transfer by reducing differences in predictions, relations, or representations between target and collaborator, although these differences also underlie complementarity. This creates a structural trade-off between reducing differences for knowledge exchange and preserving them for complementarity. We therefore propose Corroborative Learning (CL). Each model forms task-driven responses, with cross-group support from its collaborator. Source-excluded reconstruction of response increments from collaborator representations separates fitting and evaluation across disjoint groups and selectively constrains directions by cross-group reconstructability. The process requires no direct output or feature matching or additional inference dependency. Furthermore, with linear reconstruction and fixed collaborator representations, the loss equals a positive semidefinite directional regularizer, constraining less reconstructable directions more strongly. Signal and noise conditions characterize when directional shrinkage reduces response-estimation error. Across six language tasks, 24 models, and 36 pairs, CL improves over capacity-matched independent adaptation on every task, with positive gains across most directed model combinations. Pairwise comparisons show broad advantages over transfer and mutual-learning methods and different gains from complementarity across collaboration rules. Low-label language and vision results support cross-domain applicability. Task-relevant differences can support mutual enhancement without eliminating disagreement.", "arxiv_id": "2610.41222", "arxiv_url": "https://arxiv.org/abs/2610.41222", "authors": ["Zexing Zhang", "Jichao Li", "Tianyang Lei", "Yiyin Zhang", "Kewei Yang"], "brief": "\u63d0\u51fa Corroborative Learning\uff0c\u8ba9\u72ec\u7acb\u6a21\u578b\u7528\u534f\u4f5c\u8005\u8868\u5f81\u91cd\u6784\u81ea\u8eab\u4efb\u52a1\u54cd\u5e94\u589e\u91cf\uff0c\u5e76\u6309\u8de8\u7ec4\u53ef\u91cd\u6784\u6027\u65bd\u52a0\u65b9\u5411\u7ea6\u675f\uff0c\u5b9e\u73b0\u8bad\u7ec3\u671f\u4e92\u52a9\u3001\u63a8\u7406\u671f\u72ec\u7acb\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41222", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6e90\u6392\u9664\u54cd\u5e94\u589e\u91cf\u91cd\u6784\u5206\u79bb\u62df\u5408\u4e0e\u8bc4\u4f30", "\u7ebf\u6027\u60c5\u5f62\u7b49\u4ef7\u534a\u6b63\u5b9a\u65b9\u5411\u6b63\u5219", "\u516d\u4e2a\u8bed\u8a00\u4efb\u52a1\u300124\u6a21\u578b\u300136\u7ec4\u5408\u9a8c\u8bc1"], "keywords": ["\u534f\u540c\u5b66\u4e60", "\u6a21\u578b\u4e92\u8865", "\u6b63\u5219\u5316", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41222v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Corroborative Learning: Mutual Enhancement through Task-Response Reconstruction", "tldr": "\u901a\u8fc7\u4efb\u52a1\u54cd\u5e94\u91cd\u6784\u5229\u7528\u6a21\u578b\u4e92\u8865\u6027\uff0c\u5728\u4e0d\u62c9\u9f50\u8f93\u51fa\u7279\u5f81\u4e0b\u5b9e\u73b0\u534f\u540c\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa Corroborative Learning\uff0c\u8ba9\u72ec\u7acb\u6a21\u578b\u7528\u534f\u4f5c\u8005\u8868\u5f81\u91cd\u6784\u81ea\u8eab\u4efb\u52a1\u54cd\u5e94\u589e\u91cf\uff0c\u5e76\u6309\u8de8\u7ec4\u53ef\u91cd\u6784\u6027\u65bd\u52a0\u65b9\u5411\u7ea6\u675f\uff0c\u5b9e\u73b0\u8bad\u7ec3\u671f\u4e92\u52a9\u3001\u63a8\u7406\u671f\u72ec\u7acb\u3002", "why_notable": "\u5b83\u7ed5\u5f00\u4f20\u7edf\u4e92\u5b66\u4e60\u4e2d\u201c\u7f29\u5c0f\u5dee\u5f02\u201d\u548c\u201c\u4fdd\u7559\u4e92\u8865\u201d\u7684\u51b2\u7a81\uff0c\u663e\u793a\u6a21\u578b\u5206\u6b67\u672c\u8eab\u4e5f\u53ef\u6210\u4e3a\u7a33\u5b9a\u589e\u76ca\u6765\u6e90\u3002"}, {"abstract": "Long-tailed recognition often learns a shared representation before correcting the classifier for class imbalance. Once the classifier has been rebalanced, however, final accuracy does not reveal whether further encoder adaptation remains worthwhile. Standard imbalance benchmarks obscure this question because they jointly vary the number of distinct examples available to rare classes and the frequency with which those examples shape the representation. We introduce a controlled evaluation framework that separates unique support from representation allocation and estimates the incremental value of encoder updates through matched classifier-only and full-network continuations from a common corrected model. The framework combines stage-specific controls, multiple representation and adaptation objectives, whole-distribution metrics, and hierarchical inference over class assignments, support reconstructions, and optimization runs. Across the controlled study, the same low-support regime moves from one in which classifier-only training is adequate to one in which encoder adaptation yields a practically meaningful benefit solely as representation allocation becomes more imbalanced. The transition persists across classifier corrections, representation objectives, normalization and augmentation controls, and ImageNet-scale evaluation, while preserving frequent-class accuracy. Under the prespecified one-percentage-point operating margin, the two regimes are separated by simultaneous confidence bounds. These results show that benchmark construction can alter a post-correction training decision and that support size alone does not characterize the remaining value of representation adaptation.", "arxiv_id": "2610.41213", "arxiv_url": "https://arxiv.org/abs/2610.41213", "authors": ["Zexing Zhang", "Jichao Li", "Tianyang Lei", "Yiyin Zhang", "Kewei Yang"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u53d7\u63a7\u8bc4\u4f30\u6846\u67b6\uff0c\u628a\u7a00\u6709\u7c7b\u7684\u72ec\u7acb\u6837\u672c\u652f\u6301\u4e0e\u5176\u53c2\u4e0e\u8868\u5f81\u5b66\u4e60\u7684\u9891\u7387\u5206\u5f00\uff0c\u5e76\u4ece\u540c\u4e00\u6821\u6b63\u6a21\u578b\u6bd4\u8f83\u4ec5\u8bad\u5206\u7c7b\u5668\u4e0e\u5168\u7f51\u7ee7\u7eed\u8bad\u7ec3\u7684\u589e\u76ca\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41213", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5339\u914dclassifier-only\u4e0efull-network\u5ef6\u7eed\u8bad\u7ec3", "\u5c42\u7ea7\u63a8\u65ad\u8986\u76d6\u7c7b\u522b\u3001\u652f\u6301\u91cd\u6784\u548c\u4f18\u5316\u8fd0\u884c", "ImageNet\u89c4\u6a21\u9a8c\u8bc1\u4e14\u4fdd\u6301\u9ad8\u9891\u7c7b\u7cbe\u5ea6"], "keywords": ["\u957f\u5c3e\u8bc6\u522b", "\u8868\u5f81\u5b66\u4e60", "\u7f16\u7801\u5668\u9002\u914d", "\u53d7\u63a7\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41213v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Scarcity: When Encoder Adaptation Is Worthwhile", "tldr": "\u63a7\u5236\u53d8\u91cf\u8bc4\u4f30\u8868\u660e\uff0c\u957f\u5c3e\u5b66\u4e60\u4e2d\u662f\u5426\u7ee7\u7eed\u8c03\u7f16\u7801\u5668\u53d6\u51b3\u4e8e\u8868\u5f81\u5206\u914d\u5931\u8861\u800c\u975e\u6837\u672c\u6570\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u53d7\u63a7\u8bc4\u4f30\u6846\u67b6\uff0c\u628a\u7a00\u6709\u7c7b\u7684\u72ec\u7acb\u6837\u672c\u652f\u6301\u4e0e\u5176\u53c2\u4e0e\u8868\u5f81\u5b66\u4e60\u7684\u9891\u7387\u5206\u5f00\uff0c\u5e76\u4ece\u540c\u4e00\u6821\u6b63\u6a21\u578b\u6bd4\u8f83\u4ec5\u8bad\u5206\u7c7b\u5668\u4e0e\u5168\u7f51\u7ee7\u7eed\u8bad\u7ec3\u7684\u589e\u76ca\u3002", "why_notable": "\u5b83\u6307\u51fa\u5e38\u89c4\u957f\u5c3e\u57fa\u51c6\u4f1a\u6539\u53d8\u8bad\u7ec3\u51b3\u7b56\uff1a\u6821\u6b63\u5206\u7c7b\u5668\u540e\uff0c\u7f16\u7801\u5668\u9002\u914d\u7684\u4ef7\u503c\u4e0d\u80fd\u4ec5\u7531\u5c11\u6837\u672c\u652f\u6301\u5224\u65ad\u3002"}, {"abstract": "RGB-thermal (RGB-T) object detectors combine visible and thermal imagery for robust detection, but signal corruption in either stream can substantially degrade accuracy. Restoration-based methods incur significant latency and do not consistently improve downstream accuracy, raising a more direct question: rather than restoring corrupted inputs, can we efficiently adapt the detector to their varying signal quality? Conventional PEFT offers an efficient route, but its input-independent corrections cannot track diverse test-time corruptions. Our controlled corruption sweeps show that corruption types have similar effects near clean conditions but diverge increasingly with severity, motivating corruption-aware, per-input adaptation. We therefore propose PG-FM (Prompt-Guided Feature Modulation), which adapts RGB-T object detectors to the estimated corruption type and severity of each modality. Under controlled RGB-T corruption simulations, PG-FM preserves clean-set performance, improves mAP50 by up to 20.8 points on FLIR and 19.9 points on KAIST, and transfers without retraining to unmodified, naturally acquired external RGB-T datasets.", "arxiv_id": "2610.41204", "arxiv_url": "https://arxiv.org/abs/2610.41204", "authors": ["Liuyin Shi", "Chengqi Li", "Wenbo He"], "brief": "\u63d0\u51faPG-FM\uff0c\u7528\u63d0\u793a\u4f30\u8ba1RGB\u4e0e\u70ed\u6210\u50cf\u5404\u81ea\u7684\u9000\u5316\u7c7b\u578b\u548c\u5f3a\u5ea6\uff0c\u518d\u5bf9\u68c0\u6d4b\u5668\u7279\u5f81\u8fdb\u884c\u6309\u8f93\u5165\u8c03\u5236\uff0c\u907f\u514d\u5148\u590d\u539f\u56fe\u50cf\u5e26\u6765\u7684\u5ef6\u8fdf\u4e0e\u4e0d\u7a33\u5b9a\u6536\u76ca\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41204", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["Prompt-Guided Feature Modulation\u9010\u6837\u672c\u9002\u914d", "FLIR\u4e0amAP50\u6700\u9ad8\u63d0\u534720.8\u70b9", "KAIST\u4e0amAP50\u6700\u9ad8\u63d0\u534719.9\u70b9"], "keywords": ["\u591a\u6a21\u6001\u68c0\u6d4b", "RGB-T", "\u9c81\u68d2\u6027", "\u7279\u5f81\u8c03\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41204v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Shifting Focus by Reliability: Geometric Fusion Modulation for Robust RGB-T Detection", "tldr": "\u6309\u6bcf\u8def\u56fe\u50cf\u53ef\u9760\u6027\u52a8\u6001\u8c03\u5236\u7279\u5f81\uff0c\u663e\u8457\u63d0\u5347\u53d7\u635fRGB-T\u68c0\u6d4b\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faPG-FM\uff0c\u7528\u63d0\u793a\u4f30\u8ba1RGB\u4e0e\u70ed\u6210\u50cf\u5404\u81ea\u7684\u9000\u5316\u7c7b\u578b\u548c\u5f3a\u5ea6\uff0c\u518d\u5bf9\u68c0\u6d4b\u5668\u7279\u5f81\u8fdb\u884c\u6309\u8f93\u5165\u8c03\u5236\uff0c\u907f\u514d\u5148\u590d\u539f\u56fe\u50cf\u5e26\u6765\u7684\u5ef6\u8fdf\u4e0e\u4e0d\u7a33\u5b9a\u6536\u76ca\u3002", "why_notable": "\u628a\u9c81\u68d2\u6027\u95ee\u9898\u4ece\u56fe\u50cf\u590d\u539f\u8f6c\u5411\u68c0\u6d4b\u5668\u81ea\u9002\u5e94\uff0c\u65e2\u4fdd\u7559\u5e72\u51c0\u96c6\u6027\u80fd\uff0c\u4e5f\u80fd\u96f6\u8bad\u7ec3\u8fc1\u79fb\u5230\u81ea\u7136RGB-T\u6570\u636e\u3002"}, {"abstract": "Multimodal federated learning (MFL) trains a shared model by aggregating client updates without exchanging raw data. Under missing modalities, clients adapt active modality encoders and a shared prediction block (fusion and classifier) to different input subsets. This raises two server-side questions: which clients should contribute to each component, and how should their aggregates be incorporated across rounds? We observe that an absent-modality encoder can still adapt through missing-input handling. Availability- based aggregation can therefore omit its update while retaining jointly learned prediction-block updates. Contributor selection also shapes server momentum, a weighted history of aggregated updates. We observe that prediction-block momentum can improve or reduce performance depending on the encoder update policy. We therefore propose Role-Aware Server Optimization (RASO), which coordinates contributor selection with role-specific server updates. RASO selects contributors through prediction dependence and inclusion in local optimization, retains encoder momentum, and synchronizes the shared prediction block to its current aggregate. Experiments across datasets and fusion architectures demonstrate the effectiveness of RASO under missing modalities.", "arxiv_id": "2610.41193", "arxiv_url": "https://arxiv.org/abs/2610.41193", "authors": ["Liuyin Shi", "Wenbo He"], "brief": "\u63d0\u51fa\u4e00\u79cd\u670d\u52a1\u5668\u7aef\u4f18\u5316\u7b56\u7565RASO\uff0c\u9488\u5bf9\u7f16\u7801\u5668\u4e0e\u5171\u4eab\u9884\u6d4b\u6a21\u5757\u91c7\u7528\u4e0d\u540c\u805a\u5408\u4e0e\u52a8\u91cf\u89c4\u5219\u3002\u5b83\u4f9d\u636e\u9884\u6d4b\u4f9d\u8d56\u548c\u672c\u5730\u4f18\u5316\u53c2\u4e0e\u60c5\u51b5\u9009\u62e9\u5ba2\u6237\u7aef\uff0c\u5e76\u534f\u8c03\u8de8\u8f6e\u66f4\u65b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41193", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u6309\u9884\u6d4b\u4f9d\u8d56\u9009\u62e9\u7ec4\u4ef6\u8d21\u732e\u5ba2\u6237\u7aef", "\u4fdd\u7559\u7f16\u7801\u5668\u670d\u52a1\u5668\u52a8\u91cf\u66f4\u65b0", "\u9884\u6d4b\u5757\u540c\u6b65\u5230\u5f53\u524d\u8f6e\u805a\u5408\u7ed3\u679c"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u591a\u6a21\u6001\u5b66\u4e60", "\u6a21\u6001\u7f3a\u5931", "\u670d\u52a1\u5668\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41193v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Role-Aware Server Optimization for Multimodal Federated Learning with Missing Modalities", "tldr": "RASO\u6309\u7ec4\u4ef6\u89d2\u8272\u9009\u62e9\u805a\u5408\u8d21\u732e\u8005\uff0c\u7f13\u89e3\u591a\u6a21\u6001\u8054\u90a6\u5b66\u4e60\u4e2d\u7684\u6a21\u6001\u7f3a\u5931\u95ee\u9898", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e00\u79cd\u670d\u52a1\u5668\u7aef\u4f18\u5316\u7b56\u7565RASO\uff0c\u9488\u5bf9\u7f16\u7801\u5668\u4e0e\u5171\u4eab\u9884\u6d4b\u6a21\u5757\u91c7\u7528\u4e0d\u540c\u805a\u5408\u4e0e\u52a8\u91cf\u89c4\u5219\u3002\u5b83\u4f9d\u636e\u9884\u6d4b\u4f9d\u8d56\u548c\u672c\u5730\u4f18\u5316\u53c2\u4e0e\u60c5\u51b5\u9009\u62e9\u5ba2\u6237\u7aef\uff0c\u5e76\u534f\u8c03\u8de8\u8f6e\u66f4\u65b0\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u63ed\u793a\u7f3a\u5931\u6a21\u6001\u4e0b\u7ec4\u4ef6\u89d2\u8272\u5dee\u5f02\u5bf9\u805a\u5408\u548c\u52a8\u91cf\u7684\u5f71\u54cd\uff0c\u4e3aMFL\u63d0\u4f9b\u66f4\u7a33\u5065\u7684\u670d\u52a1\u5668\u66f4\u65b0\u673a\u5236\u3002"}, {"abstract": "In this paper, we study a general frequency principle under gradient descent training for the finite linear approximation classes. Under suitable assumptions, we prove that the learner amplitude relative to the target amplitude vanishes at high frequencies, uniformly throughout training. We also establish sufficient conditions for low-frequency priority, covering single-frequency targets trained separately and two frequency components trained in the same run. This general frequency principle does not imply that lower frequencies always converge faster. Instead, for two frequencies that satisfy certain comparison conditions, one component will take longer to learn than the other; and in common cases, the longer component has higher frequency. Numerical experiments with Legendre and trigonometric bases validate the theoretical results.", "arxiv_id": "2610.41179", "arxiv_url": "https://arxiv.org/abs/2610.41179", "authors": ["Yujun Wang", "Yiqi Gu"], "brief": "\u8bba\u6587\u7814\u7a76\u6709\u9650\u7ebf\u6027\u903c\u8fd1\u7c7b\u5728\u68af\u5ea6\u4e0b\u964d\u8bad\u7ec3\u4e0b\u7684\u9891\u7387\u5b66\u4e60\u89c4\u5f8b\uff0c\u8bc1\u660e\u9ad8\u9891\u5904\u5b66\u4e60\u5e45\u5ea6\u76f8\u5bf9\u76ee\u6807\u5e45\u5ea6\u5728\u5168\u7a0b\u8bad\u7ec3\u4e2d\u4e00\u81f4\u8d8b\u96f6\uff0c\u5e76\u7ed9\u51fa\u4f4e\u9891\u4f18\u5148\u7684\u5145\u5206\u6761\u4ef6\u3002", "categories": ["cs.LG", "math.NA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41179", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6\u6709\u9650\u7ebf\u6027\u903c\u8fd1\u7c7b\u4e0e\u68af\u5ea6\u4e0b\u964d", "\u8bc1\u660e\u9ad8\u9891\u76f8\u5bf9\u5e45\u5ea6\u5168\u7a0b\u4e00\u81f4\u6d88\u5931", "Legendre\u4e0e\u4e09\u89d2\u57fa\u5b9e\u9a8c\u9a8c\u8bc1\u7406\u8bba"], "keywords": ["\u9891\u7387\u539f\u5219", "\u68af\u5ea6\u4e0b\u964d", "\u7ebf\u6027\u903c\u8fd1", "\u6570\u503c\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41179v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "General Frequency Principle for Linear Approximation Classes", "tldr": "\u8bc1\u660e\u6709\u9650\u7ebf\u6027\u903c\u8fd1\u7c7b\u68af\u5ea6\u4e0b\u964d\u4e2d\u7684\u666e\u904d\u9891\u7387\u539f\u5219\uff0c\u5e76\u6f84\u6e05\u4f4e\u9891\u4f18\u5148\u7684\u9002\u7528\u6761\u4ef6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u6709\u9650\u7ebf\u6027\u903c\u8fd1\u7c7b\u5728\u68af\u5ea6\u4e0b\u964d\u8bad\u7ec3\u4e0b\u7684\u9891\u7387\u5b66\u4e60\u89c4\u5f8b\uff0c\u8bc1\u660e\u9ad8\u9891\u5904\u5b66\u4e60\u5e45\u5ea6\u76f8\u5bf9\u76ee\u6807\u5e45\u5ea6\u5728\u5168\u7a0b\u8bad\u7ec3\u4e2d\u4e00\u81f4\u8d8b\u96f6\uff0c\u5e76\u7ed9\u51fa\u4f4e\u9891\u4f18\u5148\u7684\u5145\u5206\u6761\u4ef6\u3002", "why_notable": "\u5de5\u4f5c\u628a\u9891\u7387\u539f\u5219\u4ece\u7ecf\u9a8c\u73b0\u8c61\u63a8\u8fdb\u5230\u66f4\u4e00\u822c\u7684\u7ebf\u6027\u7406\u8bba\u6846\u67b6\uff0c\u540c\u65f6\u6307\u51fa\u4f4e\u9891\u5e76\u975e\u5fc5\u7136\u66f4\u5feb\u6536\u655b\uff0c\u7ec6\u5316\u4e86\u5e38\u89c1\u7406\u89e3\u3002"}, {"abstract": "In experiment-driven black-box optimization, each evaluation can consume materials, equipment time, and other resources, limiting the number of experiments available for a new task. Records from completed related optimization campaigns could help, but learning a sequential query policy remains challenging when task-specific experience consists of only a few sparse histories. We propose CAP (Candidate Acquisition Policy), which models shared structure and task-specific variation in fixed historical records to sample interactive practice functions. On these functions, CAP learns a feedback-conditioned query policy aimed at final optimization performance under a fixed evaluation budget. At deployment, its parameters remain fixed while each new observation informs the next query. Across five synthetic task families spanning 6 and 20 dimensions and two engineering simulation benchmarks, BOPTEST and SU2, CAP attains the lowest median final-budget value among the reported methods on four synthetic families and both engineering benchmarks. These results indicate that sparse records from completed related tasks can support adaptive query decisions on new tasks, making more effective use of limited, costly experimental evaluations.", "arxiv_id": "2610.41173", "arxiv_url": "https://arxiv.org/abs/2610.41173", "authors": ["Lin Fu", "Siwei Fu", "Dong Ni"], "brief": "\u63d0\u51faCandidate Acquisition Policy\uff0c\u5229\u7528\u5df2\u5b8c\u6210\u4f18\u5316\u4efb\u52a1\u7684\u56fa\u5b9a\u7a00\u758f\u5386\u53f2\u5efa\u6a21\u5171\u4eab\u7ed3\u6784\u4e0e\u4efb\u52a1\u5dee\u5f02\uff0c\u5e76\u91c7\u6837\u4ea4\u4e92\u5f0f\u7ec3\u4e60\u51fd\u6570\u6765\u8bad\u7ec3\u53cd\u9988\u6761\u4ef6\u5316\u67e5\u8be2\u7b56\u7565\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41173", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u56fa\u5b9a\u53c2\u6570\u90e8\u7f72\uff0c\u89c2\u6d4b\u53cd\u9988\u51b3\u5b9a\u4e0b\u4e00\u6b21\u67e5\u8be2", "\u8986\u76d66\u7ef4\u300120\u7ef4\u4e94\u7c7b\u5408\u6210\u4efb\u52a1", "\u5728BOPTEST\u4e0eSU2\u5de5\u7a0b\u4eff\u771f\u4e0a\u9886\u5148"], "keywords": ["\u9ed1\u7bb1\u4f18\u5316", "\u5143\u5b66\u4e60", "\u8d1d\u53f6\u65af\u4f18\u5316", "\u5b9e\u9a8c\u8bbe\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41173v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CAP: Learning to Optimize from Sparse Observations of Related Tasks", "tldr": "CAP\u4ece\u7a00\u758f\u76f8\u5173\u4efb\u52a1\u8bb0\u5f55\u4e2d\u5b66\u4e60\u9ed1\u7bb1\u4f18\u5316\u7b56\u7565\uff0c\u63d0\u5347\u65b0\u4efb\u52a1\u6709\u9650\u9884\u7b97\u8868\u73b0", "upvotes": 0, "what_it_is": "\u63d0\u51faCandidate Acquisition Policy\uff0c\u5229\u7528\u5df2\u5b8c\u6210\u4f18\u5316\u4efb\u52a1\u7684\u56fa\u5b9a\u7a00\u758f\u5386\u53f2\u5efa\u6a21\u5171\u4eab\u7ed3\u6784\u4e0e\u4efb\u52a1\u5dee\u5f02\uff0c\u5e76\u91c7\u6837\u4ea4\u4e92\u5f0f\u7ec3\u4e60\u51fd\u6570\u6765\u8bad\u7ec3\u53cd\u9988\u6761\u4ef6\u5316\u67e5\u8be2\u7b56\u7565\u3002", "why_notable": "\u8bc1\u660e\u5c11\u91cf\u5386\u53f2\u5b9e\u9a8c\u8bb0\u5f55\u4e5f\u80fd\u8fc1\u79fb\u4e3a\u81ea\u9002\u5e94\u67e5\u8be2\u51b3\u7b56\uff0c\u9002\u5408\u6750\u6599\u3001\u8bbe\u5907\u7b49\u8bc4\u4f30\u6602\u8d35\u573a\u666f\u3002"}, {"abstract": "Simplicial neural networks (SNNs) are powerful tools for prediction tasks on higher-order relational datasets stored on simplicial complexes (SCs), a higher-order generalization of graphs. However, SNNs usually lack rigorous uncertainty quantification (UQ), limiting their usefulness in high-stakes scenarios. We propose conformalized SNN (CF-SNN), a framework that, given a simplicial-complex entity with m prediction targets, generates prediction sets for all m targets simultaneously. Under mild assumptions, CF-SNN guarantees that, for each target, the prediction set contains the true label with a user-specified nominal coverage probability, and the realized miscoverage proportion across all m targets is guaranteed to remain close to the nominal level with high probability. Extensive experiments across a wide range of SC prediction tasks demonstrate that CF-SNN is a flexible UQ framework that achieves user-specified coverage while producing informative prediction sets of small size.", "arxiv_id": "2610.41166", "arxiv_url": "https://arxiv.org/abs/2610.41166", "authors": ["Lekun Wang", "Jaidev Goel", "Yulia R. Gel", "Yao Xie"], "brief": "\u63d0\u51fa CF-SNN \u6846\u67b6\uff0c\u5c06\u4fdd\u5f62\u9884\u6d4b\u63a5\u5165\u5355\u7eaf\u590d\u5f62\u795e\u7ecf\u7f51\u7edc\uff0c\u5bf9\u4e00\u4e2a\u5b9e\u4f53\u7684\u591a\u4e2a\u9884\u6d4b\u76ee\u6807\u540c\u65f6\u751f\u6210\u9884\u6d4b\u96c6\u5408\uff0c\u5e76\u7ed9\u51fa\u8986\u76d6\u7387\u4e0e\u6574\u4f53\u5931\u8986\u76d6\u6bd4\u4f8b\u7684\u6982\u7387\u4fdd\u8bc1\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41166", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9762\u5411\u5355\u7eaf\u590d\u5f62\u4e0a\u7684\u9ad8\u9636\u5173\u7cfb\u6570\u636e", "\u540c\u65f6\u5904\u7406\u5355\u5b9e\u4f53 m \u4e2a\u9884\u6d4b\u76ee\u6807", "\u4fdd\u8bc1\u9010\u76ee\u6807\u540d\u4e49\u8986\u76d6\u7387\u4e0e\u5c0f\u9884\u6d4b\u96c6"], "keywords": ["\u4e0d\u786e\u5b9a\u6027\u91cf\u5316", "\u4fdd\u5f62\u9884\u6d4b", "\u5355\u7eaf\u590d\u5f62", "\u56fe\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41166v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Adaptive Uncertainty Quantification on Simplicial Complexes with Conformalized Simplicial Neural Networks", "tldr": "\u7528\u4fdd\u5f62\u9884\u6d4b\u4e3a\u5355\u7eaf\u590d\u5f62\u795e\u7ecf\u7f51\u7edc\u63d0\u4f9b\u591a\u76ee\u6807\u53ef\u9760\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa CF-SNN \u6846\u67b6\uff0c\u5c06\u4fdd\u5f62\u9884\u6d4b\u63a5\u5165\u5355\u7eaf\u590d\u5f62\u795e\u7ecf\u7f51\u7edc\uff0c\u5bf9\u4e00\u4e2a\u5b9e\u4f53\u7684\u591a\u4e2a\u9884\u6d4b\u76ee\u6807\u540c\u65f6\u751f\u6210\u9884\u6d4b\u96c6\u5408\uff0c\u5e76\u7ed9\u51fa\u8986\u76d6\u7387\u4e0e\u6574\u4f53\u5931\u8986\u76d6\u6bd4\u4f8b\u7684\u6982\u7387\u4fdd\u8bc1\u3002", "why_notable": "\u628a\u4e25\u683c\u4e0d\u786e\u5b9a\u6027\u4fdd\u8bc1\u5e26\u5165\u9ad8\u9636\u56fe\u7ed3\u6784\u5b66\u4e60\uff0c\u9002\u5408\u9700\u8981\u53ef\u9760\u98ce\u9669\u63a7\u5236\u7684\u5355\u7eaf\u590d\u5f62\u9884\u6d4b\u4efb\u52a1\u3002"}, {"abstract": "Burst super-resolution (BSR) achieves higher reconstruction fidelity than single-image super-resolution (SISR) by aggregating sub-pixel information from multiple frames. However, it requires a burst of frames captured under near-static conditions, and such frames are unavailable for single photographs or archival images. We propose Pseudo-Burst Super-Resolution (PBSR), which brings BSR-style reconstruction to the single-image input setting by synthesizing pseudo-burst frames via zero-shot novel view synthesis (NVS). PBSR first generates pseudo-burst frames with realistic parallax using a viewpoint sampling strategy calibrated to the pixel-shift distribution of real burst datasets. The frames are then processed by a BSR backbone equipped with a geometry-aware alignment module that reuses the NVS camera parameters and estimated depth. While the NVS stage is zero-shot, the backbone is fine-tuned with an artifact-aware adaptation so that it can exploit the synthesized frames despite their generative artifacts. Experiments on the BurstSR dataset show that PBSR consistently improves in PSNR, SSIM, and LPIPS over the single-frame baseline with the same reconstruction backbone.", "arxiv_id": "2610.41258", "arxiv_url": "https://arxiv.org/abs/2610.41258", "authors": ["Yuki Kondo", "Norimichi Ukita"], "brief": "\u8be5\u65b9\u6cd5\u4ece\u5355\u5f20\u4f4e\u6e05\u56fe\u50cf\u51fa\u53d1\uff0c\u901a\u8fc7\u96f6\u6837\u672cNVS\u751f\u6210\u5e26\u771f\u5b9e\u89c6\u5dee\u7684\u4f2a\u8fde\u62cd\u5e27\uff0c\u518d\u7528\u7ed3\u5408\u76f8\u673a\u53c2\u6570\u4e0e\u6df1\u5ea6\u7684\u51e0\u4f55\u611f\u77e5\u5bf9\u9f50\u6a21\u5757\u8fdb\u884cBSR\u91cd\u5efa\u3002", "categories": ["eess.IV", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41258", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u89c6\u89d2\u91c7\u6837\u5339\u914d\u771f\u5b9eBurstSR\u50cf\u7d20\u504f\u79fb\u5206\u5e03", "\u5bf9\u9f50\u6a21\u5757\u590d\u7528NVS\u76f8\u673a\u53c2\u6570\u4e0e\u4f30\u8ba1\u6df1\u5ea6", "\u4f2a\u5e27\u4f2a\u5f71\u611f\u77e5\u5fae\u8c03\u63d0\u5347PSNR/SSIM/LPIPS"], "keywords": ["\u56fe\u50cf\u8d85\u5206\u8fa8\u7387", "\u65b0\u89c6\u89d2\u5408\u6210", "\u8fde\u62cd\u91cd\u5efa", "\u96f6\u6837\u672c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41258v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PBSR: Pseudo-Burst Super-Resolution via Zero-Shot Novel View Synthesis", "tldr": "\u7528\u96f6\u6837\u672c\u65b0\u89c6\u89d2\u5408\u6210\u4f2a\u8fde\u62cd\uff0c\u8ba9\u5355\u5f20\u56fe\u50cf\u4e5f\u80fd\u5229\u7528\u8fde\u62cd\u8d85\u5206\u4fe1\u606f\u3002", "upvotes": 0, "what_it_is": "\u8be5\u65b9\u6cd5\u4ece\u5355\u5f20\u4f4e\u6e05\u56fe\u50cf\u51fa\u53d1\uff0c\u901a\u8fc7\u96f6\u6837\u672cNVS\u751f\u6210\u5e26\u771f\u5b9e\u89c6\u5dee\u7684\u4f2a\u8fde\u62cd\u5e27\uff0c\u518d\u7528\u7ed3\u5408\u76f8\u673a\u53c2\u6570\u4e0e\u6df1\u5ea6\u7684\u51e0\u4f55\u611f\u77e5\u5bf9\u9f50\u6a21\u5757\u8fdb\u884cBSR\u91cd\u5efa\u3002", "why_notable": "\u5b83\u628a\u8fde\u62cd\u8d85\u5206\u6269\u5c55\u5230\u5355\u5f20\u6216\u5386\u53f2\u7167\u7247\u573a\u666f\uff0c\u63d0\u4f9b\u4e86\u4e00\u6761\u5229\u7528\u751f\u6210\u5f0f\u89c6\u5dee\u8865\u5145\u4e9a\u50cf\u7d20\u4fe1\u606f\u7684\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Reasoning video object segmentation (ReVOS) requires segmenting the target specified by an implicit query throughout a video. Existing MLLM-based methods typically require costly cross-model alignment, tying MLLM training to a downstream segmentation model. We present ReVEAL, a decoupled thinking-with-video framework for ReVOS that elicits role-aware latent visual evidence from MLLM reasoning to directly guide segmentation. ReVEAL introduces Visual Evidence Tokens (VETs) into video reasoning to associate necessary visual regions or entities with target, background, or distractor roles, while a Dynamic Attention Layer Router adaptively aggregates VET-to-video attention across layers into role-specific grounding evidence. We train the MLLM to perform VET-augmented reasoning on our constructed ReVEAL-47K dataset, with a Contrastive Attention Grounding Loss as auxiliary supervision to apply role-specific constraints to VET attention and optimize layer routing for reliable latent grounding. At inference, ReVEAL identifies the target through this thinking-with-video process and fuses the resulting role-specific evidence to guide a frozen SAM2 in predicting target masks. Experiments on five benchmarks show that ReVEAL outperforms alignment-free baselines and remains competitive with alignment-based methods.", "arxiv_id": "2610.41257", "arxiv_url": "https://arxiv.org/abs/2610.41257", "authors": ["Zhongyuan Bao", "Cunjie He", "Lejun Zhang", "Zenglin Xu", "Yanwei Fu"], "brief": "\u63d0\u51faReVEAL\u6846\u67b6\uff0c\u8ba9MLLM\u5728\u89c6\u9891\u63a8\u7406\u4e2d\u751f\u6210\u76ee\u6807\u3001\u80cc\u666f\u3001\u5e72\u6270\u7269\u89d2\u8272\u5bf9\u5e94\u7684\u6f5c\u5728\u89c6\u89c9\u8bc1\u636e\uff0c\u518d\u878d\u5408\u8fd9\u4e9b\u8bc1\u636e\u6307\u5bfc\u51bb\u7ed3\u7684SAM2\u5b8c\u6210\u76ee\u6807\u63a9\u7801\u9884\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41257", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5f15\u5165Visual Evidence Tokens\u5efa\u6a21\u89d2\u8272\u533a\u57df", "Dynamic Attention Layer Router\u805a\u5408\u8de8\u5c42\u6ce8\u610f\u529b", "\u6784\u5efaReVEAL-47K\u5e76\u52a0\u5165\u5bf9\u6bd4\u6ce8\u610f\u529b\u5b9a\u4f4d\u635f\u5931"], "keywords": ["\u89c6\u9891\u76ee\u6807\u5206\u5272", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u89c6\u89c9\u8bc1\u636e", "SAM2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41257v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReVEAL: Eliciting Role-Aware Latent Visual Evidence from MLLMs for Reasoning Video Object Segmentation", "tldr": "\u7528\u89d2\u8272\u611f\u77e5\u89c6\u89c9\u8bc1\u636e\u5f15\u5bfc\u51bb\u7ed3SAM2\uff0c\u5b9e\u73b0\u89e3\u8026\u5f0f\u89c6\u9891\u63a8\u7406\u5206\u5272\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faReVEAL\u6846\u67b6\uff0c\u8ba9MLLM\u5728\u89c6\u9891\u63a8\u7406\u4e2d\u751f\u6210\u76ee\u6807\u3001\u80cc\u666f\u3001\u5e72\u6270\u7269\u89d2\u8272\u5bf9\u5e94\u7684\u6f5c\u5728\u89c6\u89c9\u8bc1\u636e\uff0c\u518d\u878d\u5408\u8fd9\u4e9b\u8bc1\u636e\u6307\u5bfc\u51bb\u7ed3\u7684SAM2\u5b8c\u6210\u76ee\u6807\u63a9\u7801\u9884\u6d4b\u3002", "why_notable": "\u907f\u514dMLLM\u4e0e\u5206\u5272\u6a21\u578b\u7684\u6602\u8d35\u5bf9\u9f50\u8bad\u7ec3\uff0c\u5728\u4e94\u4e2a\u57fa\u51c6\u4e0a\u4f18\u4e8e\u65e0\u5bf9\u9f50\u57fa\u7ebf\uff0c\u5e76\u63a5\u8fd1\u5bf9\u9f50\u5f0f\u65b9\u6cd5\u8868\u73b0\u3002"}, {"abstract": "While modern Vision-Language Models (VLMs) have been remarkably successful in general scene text recognition, they consistently struggle with the long-tail distribution of text that is degraded by motion blur or low resolution. These limitations are particularly apparent in egocentric applications like smart glasses, where text is often captured in noisy environments. In this paper, we introduce the \\textbf{BSTRB} (Blurry Scene Text Recognition Benchmark), a novel benchmark of 8,398 noisy image samples with high-fidelity annotations derived from 1,699 real-world video sequences. To support this, we present \\textbf{Hawkeye}, a VLM fine-tuned on BSTRB to read and reason about illegible text by leveraging contextual priors and pixel-level alignment. Our results show that \\name matches much larger VLMs on BSTRB overall and exceeds them on text at or below 20 pixels, in a single pass suited to real-time deployment. We characterize the resolution at which current VLMs begin to fail.", "arxiv_id": "2610.41254", "arxiv_url": "https://arxiv.org/abs/2610.41254", "authors": ["Brian Tang", "Kang G. Shin"], "brief": "\u7814\u7a76\u6784\u5efa\u542b8398\u4e2a\u566a\u58f0\u56fe\u50cf\u6837\u672c\u7684BSTRB\u57fa\u51c6\uff0c\u5e76\u7528\u5176\u5fae\u8c03Hawkeye\u3002\u6a21\u578b\u7ed3\u5408\u4e0a\u4e0b\u6587\u5148\u9a8c\u4e0e\u50cf\u7d20\u7ea7\u5bf9\u9f50\uff0c\u5728\u5355\u6b21\u524d\u5411\u4e2d\u8bc6\u522b\u6a21\u7cca\u3001\u4f4e\u5206\u8fa8\u7387\u573a\u666f\u6587\u5b57\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41254", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["BSTRB\u542b8398\u6837\u672c\u30011699\u6bb5\u771f\u5b9e\u89c6\u9891", "Hawkeye\u4f7f\u7528\u4e0a\u4e0b\u6587\u5148\u9a8c\u4e0e\u50cf\u7d20\u7ea7\u5bf9\u9f50", "20\u50cf\u7d20\u53ca\u4ee5\u4e0b\u6587\u5b57\u4f18\u4e8e\u66f4\u5927VLM"], "keywords": ["\u573a\u666f\u6587\u5b57\u8bc6\u522b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4f4e\u5206\u8fa8\u7387", "\u57fa\u51c6\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41254v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hawkeye: Reading Illegible Text with Vision Language Models", "tldr": "\u63d0\u51fa\u6a21\u7cca\u573a\u666f\u6587\u5b57\u57fa\u51c6\u4e0e\u5fae\u8c03VLM\uff0c\u63d0\u5347\u4f4e\u5206\u8fa8\u7387\u6587\u5b57\u8bfb\u53d6\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u6784\u5efa\u542b8398\u4e2a\u566a\u58f0\u56fe\u50cf\u6837\u672c\u7684BSTRB\u57fa\u51c6\uff0c\u5e76\u7528\u5176\u5fae\u8c03Hawkeye\u3002\u6a21\u578b\u7ed3\u5408\u4e0a\u4e0b\u6587\u5148\u9a8c\u4e0e\u50cf\u7d20\u7ea7\u5bf9\u9f50\uff0c\u5728\u5355\u6b21\u524d\u5411\u4e2d\u8bc6\u522b\u6a21\u7cca\u3001\u4f4e\u5206\u8fa8\u7387\u573a\u666f\u6587\u5b57\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u9f50\u4e86\u81ea\u6211\u4e2d\u5fc3\u89c6\u9891\u4e2d\u52a3\u8d28\u6587\u5b57\u8bc4\u6d4b\u7f3a\u53e3\uff0c\u5e76\u5c55\u793a\u5c0f\u578b\u53ef\u5b9e\u65f6\u90e8\u7f72VLM\u5728\u957f\u5c3e\u6a21\u7cca\u6587\u5b57\u4e0a\u7684\u6f5c\u529b\u3002"}, {"abstract": "Coarse-to-fine 3D-native generation relies heavily on the first-stage sparse structure, which determines the global orientation and overall geometry for subsequent refinement. However, existing coarse generators suffer from two key limitations: their orientation is difficult to control due to ambiguous semantic canonicalization, and their structures are often inconsistent with input images due to weak 2D-3D grounding. We propose Coarse3D, a sparse-structure generation model that produces orientation-controllable and structurally faithful voxel geometry from arbitrary unposed images. Coarse3D introduces three designs: a first-frame anchored canonical space that aligns generation with the first input view while preserving object-centric normalization; a dual-tower DiT that couples generation with auxiliary feed-forward reconstruction to learn spatially grounded features; and spatial-prior guided attention that regularizes cross-attention with pixel-to-voxel correspondence. Coarse3D can directly replace the coarse stage of existing pipelines. Experiments show that it substantially improves sparse structure quality and consistently enhances final 3D generation, achieving state-of-the-art performance.", "arxiv_id": "2610.41231", "arxiv_url": "https://arxiv.org/abs/2610.41231", "authors": ["Gaige Wang", "Bowen Pan", "Hao Ren", "Jiangjing Lyu", "Chengfei Lyu"], "brief": "\u8be5\u5de5\u4f5c\u9762\u5411\u56fe\u50cf\u52303D\u7684\u7c97\u9636\u6bb5\u751f\u6210\uff0c\u4ece\u672a\u6807\u5b9a\u591a\u89c6\u56fe\u6216\u5355\u89c6\u56fe\u8f93\u5165\u4e2d\u751f\u6210\u4f53\u7d20\u7a00\u758f\u51e0\u4f55\u3002\u6838\u5fc3\u662f\u9996\u5e27\u951a\u5b9a\u89c4\u8303\u7a7a\u95f4\u3001\u53cc\u5854DiT\u91cd\u5efa\u8f85\u52a9\u548c\u50cf\u7d20-\u4f53\u7d20\u5148\u9a8c\u7ea6\u675f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41231", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9996\u5e27\u951a\u5b9a\u89c4\u8303\u7a7a\u95f4\u63a7\u5236\u671d\u5411", "\u53cc\u5854DiT\u8054\u5408\u6269\u6563\u4e0e\u524d\u9988\u91cd\u5efa", "\u7a7a\u95f4\u5148\u9a8c\u6ce8\u610f\u529b\u7ea6\u675f2D-3D\u5bf9\u5e94"], "keywords": ["\u56fe\u50cf\u52303D", "\u7a00\u758f\u4f53\u7d20", "\u6269\u6563\u6a21\u578b", "\u53ef\u63a7\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41231v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Coarse3D: Controllable and Faithful Sparse Structure Generation for Image-to-3D", "tldr": "\u7528\u9996\u5e27\u951a\u5b9a\u4e0e\u7a7a\u95f4\u5148\u9a8c\u6ce8\u610f\u529b\uff0c\u751f\u6210\u53ef\u63a7\u4e14\u8d34\u56fe\u4e00\u81f4\u7684\u7a00\u758f3D\u7ed3\u6784\u3002", "upvotes": 0, "what_it_is": "\u8be5\u5de5\u4f5c\u9762\u5411\u56fe\u50cf\u52303D\u7684\u7c97\u9636\u6bb5\u751f\u6210\uff0c\u4ece\u672a\u6807\u5b9a\u591a\u89c6\u56fe\u6216\u5355\u89c6\u56fe\u8f93\u5165\u4e2d\u751f\u6210\u4f53\u7d20\u7a00\u758f\u51e0\u4f55\u3002\u6838\u5fc3\u662f\u9996\u5e27\u951a\u5b9a\u89c4\u8303\u7a7a\u95f4\u3001\u53cc\u5854DiT\u91cd\u5efa\u8f85\u52a9\u548c\u50cf\u7d20-\u4f53\u7d20\u5148\u9a8c\u7ea6\u675f\u3002", "why_notable": "\u5b83\u9488\u5bf9\u7c97\u5230\u7ec6\u6d41\u7a0b\u4e2d\u6700\u6613\u4f20\u9012\u8bef\u5dee\u7684\u7a00\u758f\u7ed3\u6784\u9636\u6bb5\uff0c\u53ef\u76f4\u63a5\u66ff\u6362\u73b0\u6709\u6a21\u5757\uff0c\u5e76\u63d0\u5347\u6700\u7ec83D\u751f\u6210\u8d28\u91cf\u3002"}, {"abstract": "Monocular depth estimation is a fundamental capability for 3D spatial perception in robotic and intelligent systems. While data-driven discriminative methods have achieved compelling performance for monocular depth estimation, generative approaches can reconstruct fine structural details with stronger generalization. However, most existing generative diffusion models suffer from low inference efficiency caused by multi-step sampling, whereas single-step diffusion models struggle to recover high-fidelity depth maps. To mitigate these drawbacks, this paper presents FlowMoDE, a coarse-to-fine flow-matching-based framework for efficient, structure-aware monocular depth estimation supporting sim-to-real and cross-scene generalization. The core architecture first conducts coarse-level decoding conditioned on diffused features extracted from a pre-trained semantic encoder, and subsequently restores fine-grained structural patterns via expanded decoding layers. Trained exclusively on a single synthetic indoor dataset, our proposed method outperforms prior methods across five real-world indoor and outdoor datasets, yielding an average 14.1% reduction in relative error against state-of-the-art works as well as 9.9\\% reduction in chamfer distance for point cloud reconstruction. We further validate the generalization capability of FlowMoDE on realistic robotic scenes, with qualitative comparisons against state-of-the-art methods. The project page is https://flowmode-shao.netlify.app/", "arxiv_id": "2610.41190", "arxiv_url": "https://arxiv.org/abs/2610.41190", "authors": ["Liangjing Shao", "Wanhao Liu", "Jinsong Lin", "Zhiwei Fang", "Hongliang Ren"], "brief": "FlowMoDE\u4ee5\u7c97\u5230\u7ec6\u6d41\u5339\u914d\u63d0\u5347\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u7684\u6548\u7387\u4e0e\u7ec6\u8282\uff0c\u4ec5\u7528\u5408\u6210\u6570\u636e\u8bad\u7ec3\uff0c\u5728\u4e94\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u76f8\u5bf9\u8bef\u5dee\u964d\u4f4e14.1%\uff0c\u70b9\u4e91\u91cd\u5efa\u8ddd\u79bb\u964d\u4f4e9.9%\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41190", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1", "\u6d41\u5339\u914d", "\u4eff\u771f\u5230\u73b0\u5b9e", "\u8de8\u573a\u666f\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41190v1", "published_at": "2026-10-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FlowMoDE: Coarse-to-fine Flow Matching for Detail-aware Sim-to-Real Monocular Depth Estimation", "tldr": "FlowMoDE\u4ee5\u7c97\u5230\u7ec6\u6d41\u5339\u914d\u63d0\u5347\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u7684\u6548\u7387\u4e0e\u7ec6\u8282\uff0c\u4ec5\u7528\u5408\u6210\u6570\u636e\u8bad\u7ec3\uff0c\u5728\u4e94\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u76f8\u5bf9\u8bef\u5dee\u964d\u4f4e14.1%\uff0c\u70b9\u4e91\u91cd\u5efa\u8ddd\u79bb\u964d\u4f4e9.9%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Synthesizing realistic tumors on medical images helps address data scarcity for clinical AI. Existing diffusion-based methods, however, lack fine-grained attribute-level controllability, closed-loop quality verification, and awareness of which morphological patterns are underrepresented in the target distribution. We present MATS, a multi-agent framework for text-controllable, cross-organ tumor synthesis. Given a target disease, MATS first profiles its morphological distribution over a fine-grained attribute space covering tumor geometry and appearance, and constructs a generation plan that amplifies underrepresented subtypes while keeping common ones dominant. It then localizes the target organ, proposes anatomically valid placement, and executes two-stage diffusion to produce the tumor mask and render texture, each conditioned on the corresponding attributes. A closed-loop reflective mechanism verifies attribute alignment at three checkpoints throughout synthesis and provides targeted feedback to guide re-generation when misalignment is detected. Trained exclusively on a single-source pancreatic neuroendocrine tumor dataset, MATS consistently improves downstream segmentation both in-domain and across LiTS, KiTS, and MSD-Pancreas benchmarks, whereas most prior generative augmentation methods fall below real-only training.", "arxiv_id": "2610.41159", "arxiv_url": "https://arxiv.org/abs/2610.41159", "authors": ["Zhongnan Shi", "Keyang Zhou", "Siyi Li", "Qichao Ying", "Xinchen Ma", "Shuyi Gong", "Wei Tang", "Sheng Li", "Zhenxing Qian"], "brief": "MATS\u4ee5\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u5b9e\u73b0\u8de8\u5668\u5b98\u80bf\u7624\u5408\u6210\uff0c\u901a\u8fc7\u5c5e\u6027\u63a7\u5236\u4e0e\u95ed\u73af\u53cd\u601d\u7ea0\u504f\u8865\u8db3\u7a00\u7f3a\u5f62\u6001\uff1b\u4ec5\u7528\u5355\u6e90\u6570\u636e\u8bad\u7ec3\uff0c\u4ecd\u63d0\u5347\u57df\u5185\u53ca\u8de8\u6570\u636e\u96c6\u5206\u5272\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41159", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u533b\
