predictive performance. However, their gains are regime-dependent: tree-based models and tuned multilayer perceptrons remain highly competitive, often dominating under inference-time or training-cost constraints. Overall, TabBioMed shows that biomedical tabular learning is strongly context-dependent, with optimal model choice depending on data regime, task type, and computational budget. We release TabBioMed with curated datasets and splits, preprocessing code, baselines, and results, providing a reproducible benchmark for practical model selection and future methods development in biomedical machine learning, available at https://github.com/AI-sandbox/TabBioMed.", "arxiv_id": "2611.23779", "arxiv_url": "https://arxiv.org/abs/2611.23779", "authors": ["Pau Mateo-Bernad\u00f3", "Saivenkata Nagavyjayanthi Polapragada", "David Bonet", "Pol Arbiol Rakuljic", "Laia Mogas Pladevall", "Mar\u00e7al Comajoan Cara", "Jesus Gonzalez-Ferrer", "Jordi Abante", "Daniel Mas Montserrat", "David Haussler", "Alexander G. Ioannidis"], "brief": "TabBioMed\u6574\u540894\u4e2a\u516c\u5f00\u751f\u7269\u533b\u5b66\u8868\u683c\u6570\u636e\u96c6\uff0c\u4ee5\u9002\u914d\u5404\u6570\u636e\u96c6\u7684\u6807\u51c6\u5316\u9884\u5904\u7406\u548c\u8bc4\u6d4b\u6d41\u7a0b\uff0c\u6bd4\u8f8323\u79cd\u6a21\u578b\u5728\u5206\u7c7b\u3001\u56de\u5f52\u53ca\u591a\u76ee\u6807\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/AI-sandbox/TabBioMed", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2611.23779", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["94\u4e2a\u6570\u636e\u96c6\u8986\u76d6\u7535\u5b50\u75c5\u5386\u3001\u836f\u7269\u53d1\u73b0\u53ca\u591a\u7c7b\u7ec4\u5b66", "23\u79cd\u6a21\u578b\u6db5\u76d6\u7ecf\u5178\u57fa\u7ebf\u3001\u68af\u5ea6\u63d0\u5347\u6811\u4e0e\u8868\u683c\u57fa\u7840\u6a21\u578b", "\u57fa\u7840\u6a21\u578b\u6574\u4f53\u9886\u5148\uff0c\u6811\u6a21\u578b\u4e0e\u8c03\u4f18MLP\u5728\u6210\u672c\u7ea6\u675f\u4e0b\u5e38\u5360\u4f18"], "keywords": ["\u751f\u7269\u533b\u5b66", "\u8868\u683c\u5b66\u4e60", "\u57fa\u7840\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "TabBioMed", "pdf_url": "https://arxiv.org/pdf/2611.23779v1", "published_at": "2026-11-18", "score": 0.291, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23779.png", "title": "TabBioMed: A Large-Scale Benchmark for Biomedical Tabular Learning", "tldr": "\u7edf\u4e00\u8bc4\u6d4b\u63ed\u793a\uff1a\u751f\u7269\u533b\u5b66\u8868\u683c\u4efb\u52a1\u4e2d\uff0c\u57fa\u7840\u6a21\u578b\u9886\u5148\u4f46\u5e76\u975e\u603b\u662f\u6700\u4f18\u9009\u62e9\u3002", "upvotes": 8, "what_it_is": "TabBioMed\u6574\u540894\u4e2a\u516c\u5f00\u751f\u7269\u533b\u5b66\u8868\u683c\u6570\u636e\u96c6\uff0c\u4ee5\u9002\u914d\u5404\u6570\u636e\u96c6\u7684\u6807\u51c6\u5316\u9884\u5904\u7406\u548c\u8bc4\u6d4b\u6d41\u7a0b\uff0c\u6bd4\u8f8323\u79cd\u6a21\u578b\u5728\u5206\u7c7b\u3001\u56de\u5f52\u53ca\u591a\u76ee\u6807\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002", "why_notable": "\u4e3a\u5206\u6563\u7684\u751f\u7269\u533b\u5b66\u8868\u683c\u8bc4\u6d4b\u63d0\u4f9b\u53ef\u590d\u73b0\u7684\u7edf\u4e00\u57fa\u51c6\uff0c\u5e76\u8868\u660e\u9009\u578b\u9700\u7ed3\u5408\u6570\u636e\u5f62\u6001\u3001\u4efb\u52a1\u7c7b\u578b\u4e0e\u8ba1\u7b97\u9884\u7b97\uff0c\u800c\u975e\u53ea\u770b\u9884\u6d4b\u7cbe\u5ea6\u3002"}, {"abstract": "A central challenge in adapting large language models (LLMs) is capability preservation: an adaptation can achieve its target while degrading general capabilities. We introduce CurvDelta, a scalable framework that incorporates the preservation constraint into the parameterization of the model update. By analyzing the local geometry of the preservation constraint around the pre-adaptation model, CurvDelta constructs a low-curvature space in which parameter updates leave the preservation loss nearly invariant. We make its construction practical for LLMs through Kronecker-factored approximate curvature (K-FAC) and a factorized projection. We also introduce CurvLoRA, a low-rank variant within the same preservation geometry, designed for more efficient adaptation. Both methods apply to preservation-constrained adaptation tasks such as capability learning and selective unlearning. We evaluate our methods on mathematical reasoning, code generation, and knowledge unlearning. For mathematical reasoning and code generation, our approaches achieve competitive downstream performance while better preserving general capabilities, offering a favorable acquisition--retention trade-off relative to the baselines. For knowledge unlearning, our main results on TOFU and MUSE show a better balance between targeted forgetting and knowledge retention than the baselines, with retention performance close to the from-scratch retraining reference.", "arxiv_id": "2611.24654", "arxiv_url": "https://arxiv.org/abs/2611.24654", "authors": ["Zeguan Xiao", "Zhuocheng Liang", "Yun Chen", "Yong Wang", "Guanhua Chen", "Pinyan Lu"], "brief": "CurvDelta\u5206\u6790\u4fdd\u7559\u635f\u5931\u7684\u5c40\u90e8\u51e0\u4f55\uff0c\u5c06\u53c2\u6570\u66f4\u65b0\u9650\u5236\u5728\u4f4e\u66f2\u7387\u7a7a\u95f4\uff1b\u5229\u7528K-FAC\u4e0e\u56e0\u5b50\u5316\u6295\u5f71\u5b9e\u73b0\u53ef\u6269\u5c55\u8ba1\u7b97\uff0c\u5e76\u63d0\u51fa\u4f4e\u79e9\u7248\u672cCurvLoRA\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24654", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["K-FAC\u4e0e\u56e0\u5b50\u5316\u6295\u5f71\u6784\u9020\u4f4e\u66f2\u7387\u66f4\u65b0\u7a7a\u95f4", "CurvLoRA\u5728\u540c\u4e00\u4fdd\u7559\u51e0\u4f55\u4e0b\u5b9e\u73b0\u4f4e\u79e9\u9002\u914d", "TOFU\u4e0eMUSE\u4e0a\uff0c\u77e5\u8bc6\u4fdd\u7559\u63a5\u8fd1\u4ece\u5934\u91cd\u8bad\u53c2\u7167"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u80fd\u529b\u4fdd\u7559", "\u673a\u5668\u9057\u5fd8", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24654v1", "published_at": "2026-11-18", "score": 0.289, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24654.png", "title": "CurvDelta: Low-Curvature Delta Modeling For Surgical Learning and Unlearning", "tldr": "\u5c06\u6a21\u578b\u66f4\u65b0\u9650\u5236\u5728\u4f4e\u66f2\u7387\u7a7a\u95f4\uff0c\u517c\u987e\u65b0\u80fd\u529b\u5b66\u4e60\u3001\u5b9a\u5411\u9057\u5fd8\u4e0e\u539f\u6709\u80fd\u529b\u4fdd\u7559\u3002", "upvotes": 22, "what_it_is": "CurvDelta\u5206\u6790\u4fdd\u7559\u635f\u5931\u7684\u5c40\u90e8\u51e0\u4f55\uff0c\u5c06\u53c2\u6570\u66f4\u65b0\u9650\u5236\u5728\u4f4e\u66f2\u7387\u7a7a\u95f4\uff1b\u5229\u7528K-FAC\u4e0e\u56e0\u5b50\u5316\u6295\u5f71\u5b9e\u73b0\u53ef\u6269\u5c55\u8ba1\u7b97\uff0c\u5e76\u63d0\u51fa\u4f4e\u79e9\u7248\u672cCurvLoRA\u3002", "why_notable": "\u628a\u80fd\u529b\u4fdd\u7559\u76f4\u63a5\u5d4c\u5165\u66f4\u65b0\u53c2\u6570\u5316\uff0c\u800c\u975e\u4ec5\u9760\u8bad\u7ec3\u76ee\u6807\u7ea6\u675f\uff1b\u5728\u63a8\u7406\u3001\u4ee3\u7801\u548c\u9057\u5fd8\u4efb\u52a1\u4e2d\u6539\u5584\u76ee\u6807\u8fbe\u6210\u4e0e\u80fd\u529b\u4fdd\u7559\u7684\u6743\u8861\u3002"}, {"abstract": "Interactive video world models turn user commands into the exploration of a generated scene, which requires the scene to keep its 3D structure as the camera moves and each action to keep a stable effect. Existing benchmarks mostly evaluate these properties against references fitted to the video under test, either a scene reconstructed from its own frames or a camera trajectory aligned to the command path with a free scale. Such references can absorb gradual scene deformation and changes in pace and route length, so these errors can pass undetected. We therefore introduce StrideWorld, a benchmark whose references are fixed before the motion they judge. It evaluates scene rigidity against the ground-truth geometry of the start view, and action consistency against the stride of each action, the camera motion of one command. The stride is measured on the model\u0027s first steps and then used to test the steps that follow, so each model is judged only against its own steps. Its measurements are validated on rendered videos with known camera motion, and its scores agree with human judgments. Across \\nvideos{} videos generated by \\nmodels{} open models from $140$ start views, all models but one deform their scenes as the camera moves, with offsets up to $7.3$ times those of a rigid rendering along the same camera path. Most models keep a steady pace when a single action is held. Along composed routes, several models often stall, and most completed routes end away from the positions predicted by each model\u0027s own strides. Only the two models that scale commands by the estimated scene depth bring most routes close to these positions. Fine-tuning two models on a few rendered clips removes most of their mid-route stalls. Code, data, and a leaderboard are publicly available at https://github.com/chuangwang123/strideworld.", "arxiv_id": "2611.24408", "arxiv_url": "https://arxiv.org/abs/2611.24408", "authors": ["Chuang Wang", "Rui Nie", "Jie Song", "Junyuan Gao", "Jiahe Song", "Haitao Zhou", "Boyu Zhu", "Xing Li", "Jiang Wu", "Conghui He", "Qian Yu", "Weijia Li"], "brief": "StrideWorld\u662f\u4ea4\u4e92\u89c6\u9891\u4e16\u754c\u6a21\u578b\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4ee5\u8d77\u59cb\u89c6\u56fe\u771f\u5b9e\u51e0\u4f55\u68c0\u9a8c\u573a\u666f\u521a\u6027\uff0c\u5e76\u7528\u6a21\u578b\u521d\u59cb\u52a8\u4f5c\u6b65\u5e45\u68c0\u9a8c\u540e\u7eed\u79fb\u52a8\uff0c\u907f\u514d\u53c2\u7167\u968f\u751f\u6210\u8bef\u5dee\u6f02\u79fb\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/chuangwang123/strideworld", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.24408", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e140\u4e2a\u8d77\u59cb\u89c6\u56fe\u6d4b\u8bd5\uff0c\u573a\u666f\u504f\u79fb\u6700\u9ad8\u8fbe\u521a\u6027\u6e32\u67d3\u76847.3\u500d", "\u4ec5\u4e24\u4e2a\u6309\u4f30\u8ba1\u573a\u666f\u6df1\u5ea6\u7f29\u653e\u6307\u4ee4\u7684\u6a21\u578b\u4f7f\u591a\u6570\u8def\u7ebf\u7ec8\u70b9\u63a5\u8fd1\u9884\u671f", "\u5c11\u91cf\u6e32\u67d3\u7247\u6bb5\u5fae\u8c03\u4e24\u4e2a\u6a21\u578b\uff0c\u6d88\u9664\u5927\u90e8\u5206\u4e2d\u9014\u505c\u6ede"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u4e09\u7ef4\u51e0\u4f55", "\u52a8\u4f5c\u4e00\u81f4\u6027"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2611.24408v1", "published_at": "2026-11-18", "score": 0.283, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24408.png", "title": "StrideWorld: Benchmarking Scene Rigidity and Action Consistency in Interactive Video World Model", "tldr": "\u7528\u9884\u5148\u56fa\u5b9a\u7684\u51e0\u4f55\u4e0e\u52a8\u4f5c\u6b65\u5e45\u53c2\u7167\uff0c\u63ed\u793a\u4ea4\u4e92\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u573a\u666f\u53d8\u5f62\u4e0e\u8def\u7ebf\u504f\u5dee\u3002", "upvotes": 12, "what_it_is": "StrideWorld\u662f\u4ea4\u4e92\u89c6\u9891\u4e16\u754c\u6a21\u578b\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4ee5\u8d77\u59cb\u89c6\u56fe\u771f\u5b9e\u51e0\u4f55\u68c0\u9a8c\u573a\u666f\u521a\u6027\uff0c\u5e76\u7528\u6a21\u578b\u521d\u59cb\u52a8\u4f5c\u6b65\u5e45\u68c0\u9a8c\u540e\u7eed\u79fb\u52a8\uff0c\u907f\u514d\u53c2\u7167\u968f\u751f\u6210\u8bef\u5dee\u6f02\u79fb\u3002", "why_notable": "\u56fa\u5b9a\u8bc4\u6d4b\u53c2\u7167\u80fd\u66b4\u9732\u81ea\u91cd\u5efa\u6216\u81ea\u7531\u5c3a\u5ea6\u5bf9\u9f50\u63a9\u76d6\u7684\u8bef\u5dee\uff0c\u4e14\u8bc4\u5206\u4e0e\u4eba\u7c7b\u5224\u65ad\u4e00\u81f4\uff0c\u4e3a\u4e16\u754c\u6a21\u578b\u7684\u7a7a\u95f4\u7a33\u5b9a\u6027\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u68c0\u9a8c\u3002"}, {"abstract": "Large language model (LLM) agents are rapidly becoming a dominant paradigm for AI applications. Recently, there is a growing demand to deploy large-scale Mixture-of-Experts (MoE) models locally on consumer PCs to balance data privacy, API costs, and inference efficiency. However, unlike datacenter servers with abundant DRAM, consumer devices are tightly constrained in both GPU VRAM and host RAM, forcing massive MoE weights to spill across VRAM, host RAM, and SSD. Under such spilling, we observe that existing systems fail to fully utilize this memory hierarchy, treating the tiers as independent caches and thrashing in inference. We present TIDEWAY, a system for efficient inference of large MoE models on memory-constrained consumer devices. Our core insight is to manage host RAM and GPU VRAM as a unified memory pool. Within this pool, TIDEWAY couples phase-aware memory layouts, which adapt to the distinct access patterns of prefill and decode, with an execution engine that optimizes CUDA Graph execution under expert paging. Our evaluations on representative consumer hardware with frontier MoE models demonstrate that TIDEWAY significantly outperforms state-of-the-art systems. On average, TIDEWAY achieves speedups of 1.97x in end-to-end latency and 2.40x in Time-to-First-Token (TTFT), along with 1.61x higher decode throughput against the fastest baseline. Our source code is publicly available at https://github.com/Afterglow231/Tideway .", "arxiv_id": "2611.14848", "arxiv_url": "https://arxiv.org/abs/2611.14848", "authors": ["Yifei Wang", "Tsun-yu Yang", "Yechen Xu", "Hancheng Ye", "Qinsi Wang", "Baijun Zhou", "Tingjun Chen", "Hai \"Helen\" Li", "Danyang Zhuo", "Yiran Chen"], "brief": "TIDEWAY\u5c06\u4e3b\u5b58\u4e0e\u663e\u5b58\u89c6\u4e3a\u7edf\u4e00\u5185\u5b58\u6c60\uff0c\u6309\u9884\u586b\u5145\u548c\u89e3\u7801\u9636\u6bb5\u8c03\u6574\u5185\u5b58\u5e03\u5c40\uff0c\u5e76\u5728\u4e13\u5bb6\u5206\u9875\u6761\u4ef6\u4e0b\u4f18\u5316CUDA Graph\u6267\u884c\uff0c\u51cf\u5c11\u5206\u5c42\u5b58\u50a8\u98a0\u7c38\u3002", "categories": ["cs.OS"], "github_repo": "https://github.com/Afterglow231/Tideway", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.14848", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7edf\u4e00\u4e3b\u5b58\u4e0e\u663e\u5b58\uff0c\u6309\u9884\u586b\u5145\u548c\u89e3\u7801\u9636\u6bb5\u8c03\u6574\u5e03\u5c40", "\u7ed3\u5408\u4e13\u5bb6\u5206\u9875\u4f18\u5316CUDA Graph\u6267\u884c", "\u5ef6\u8fdf\u52a0\u901f1.97\u500d\uff0c\u9996\u8bcd\u52a0\u901f2.40\u500d\uff0c\u89e3\u7801\u541e\u5410\u63d0\u53471.61\u500d"], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u5185\u5b58\u7ba1\u7406", "\u672c\u5730\u63a8\u7406", "\u63a8\u7406\u52a0\u901f"], "num_comments": 3, "on_hf": true, "organization": "Duke University", "pdf_url": "https://arxiv.org/pdf/2611.14848v1", "published_at": "2026-11-10", "score": 0.283, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14848.png", "title": "Tideway: Phase-Aware Tiered Memory Management for MoE Inference on Consumer Devices", "tldr": "\u901a\u8fc7\u7edf\u4e00\u7ba1\u7406\u663e\u5b58\u4e0e\u4e3b\u5b58\u5e76\u9002\u914d\u63a8\u7406\u9636\u6bb5\uff0c\u52a0\u901f\u6d88\u8d39\u7ea7\u8bbe\u5907\u4e0a\u7684\u5927\u89c4\u6a21MoE\u63a8\u7406\u3002", "upvotes": 8, "what_it_is": "TIDEWAY\u5c06\u4e3b\u5b58\u4e0e\u663e\u5b58\u89c6\u4e3a\u7edf\u4e00\u5185\u5b58\u6c60\uff0c\u6309\u9884\u586b\u5145\u548c\u89e3\u7801\u9636\u6bb5\u8c03\u6574\u5185\u5b58\u5e03\u5c40\uff0c\u5e76\u5728\u4e13\u5bb6\u5206\u9875\u6761\u4ef6\u4e0b\u4f18\u5316CUDA Graph\u6267\u884c\uff0c\u51cf\u5c11\u5206\u5c42\u5b58\u50a8\u98a0\u7c38\u3002", "why_notable": "\u5b83\u9488\u5bf9\u6d88\u8d39\u7ea7\u8bbe\u5907\u8fd0\u884c\u5927\u89c4\u6a21MoE\u65f6\u7684\u5185\u5b58\u74f6\u9888\uff0c\u5728\u771f\u5b9e\u786c\u4ef6\u4e0a\u4f18\u4e8e\u6700\u5feb\u57fa\u7ebf\uff0c\u4e3a\u517c\u987e\u9690\u79c1\u4e0e\u6210\u672c\u7684\u672c\u5730\u63a8\u7406\u63d0\u4f9b\u4e86\u5f00\u6e90\u65b9\u6848\u3002"}, {"abstract": "World action models (WAMs) have shown promising generalization and data efficiency in robot manipulation by coupling action generation with predictions of future visual dynamics. Translating these capabilities into reliable task execution, however, remains a challenge for existing post-training methods. Offline supervised fine-tuning provides dense supervision on expert trajectories, but its flow-matching action expert is trained only on noised demonstration actions and never on the intermediate states produced by its own sampler; task-specific adaptation can also compromise pretrained capabilities. On-policy reinforcement learning trains on the policy\u0027s own behavior, yet sparse task rewards make exploration and credit assignment difficult, while dense reward shaping still provides scalar evaluations rather than direct action targets. We introduce \\textbf{HINT-WAM}, the first on-policy self-distillation framework that supervises the action expert on its own sampling trajectories using hindsight, the future video of the demonstration, as privileged information available to the WAM itself. For each demonstration observation, the student generates its action through its own denoising trajectory, and at the states along this trajectory the same model acts as a teacher conditioned additionally on this hindsight, providing a conditional action distribution as a dense training target, while the student sees only deployment-time inputs and needs no environmental rewards or simulator interaction. To transfer this supervision to a flow-matching action expert, HINT-WAM distills the teacher into the student with an energy score, a distribution-level objective that matches the teacher\u0027s action distribution from the student\u0027s own samples rather than regressing its velocity field. The project web is available in https://tuandattt.github.io/hintwam/.", "arxiv_id": "2611.24789", "arxiv_url": "https://arxiv.org/abs/2611.24789", "authors": ["Phuong Tuan Dat", "Qi Li", "Xinchao Wang"], "brief": "\u63d0\u51fa\u9762\u5411\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u5728\u7ebf\u7b56\u7565\u81ea\u84b8\u998f\uff1a\u540c\u4e00\u6a21\u578b\u501f\u52a9\u793a\u8303\u672a\u6765\u89c6\u9891\u5145\u5f53\u6559\u5e08\uff0c\u5728\u5b66\u751f\u81ea\u8eab\u53bb\u566a\u8f68\u8ff9\u4e0a\u63d0\u4f9b\u52a8\u4f5c\u5206\u5e03\u76d1\u7763\uff0c\u5e76\u4ee5\u80fd\u91cf\u8bc4\u5206\u8bad\u7ec3\u6d41\u5339\u914d\u52a8\u4f5c\u4e13\u5bb6\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/tuandattt/hintwam_code", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.24789", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u672a\u6765\u793a\u8303\u89c6\u9891\u4f5c\u4e3a\u6559\u5e08\u7279\u6743\u4fe1\u606f\uff0c\u5b66\u751f\u4ec5\u7528\u90e8\u7f72\u8f93\u5165", "\u5728\u5b66\u751f\u81ea\u8eab\u53bb\u566a\u8f68\u8ff9\u4e2d\u95f4\u72b6\u6001\u63d0\u4f9b\u5bc6\u96c6\u52a8\u4f5c\u5206\u5e03\u76ee\u6807", "\u80fd\u91cf\u8bc4\u5206\u5339\u914d\u52a8\u4f5c\u5206\u5e03\uff0c\u65e0\u9700\u73af\u5883\u5956\u52b1\u6216\u6a21\u62df\u5668\u4ea4\u4e92"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u81ea\u84b8\u998f", "\u6d41\u5339\u914d"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24789v1", "published_at": "2026-11-18", "score": 0.28, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24789.png", "title": "HINT-WAM: Hindsight-Informed Training for World Action Models", "tldr": "\u5229\u7528\u793a\u8303\u672a\u6765\u89c6\u9891\u6307\u5bfc\u6a21\u578b\u81ea\u8eab\u91c7\u6837\u8f68\u8ff9\uff0c\u8ba9\u673a\u5668\u4eba\u52a8\u4f5c\u5b66\u4e60\u65e0\u9700\u73af\u5883\u5956\u52b1", "upvotes": 22, "what_it_is": "\u63d0\u51fa\u9762\u5411\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u5728\u7ebf\u7b56\u7565\u81ea\u84b8\u998f\uff1a\u540c\u4e00\u6a21\u578b\u501f\u52a9\u793a\u8303\u672a\u6765\u89c6\u9891\u5145\u5f53\u6559\u5e08\uff0c\u5728\u5b66\u751f\u81ea\u8eab\u53bb\u566a\u8f68\u8ff9\u4e0a\u63d0\u4f9b\u52a8\u4f5c\u5206\u5e03\u76d1\u7763\uff0c\u5e76\u4ee5\u80fd\u91cf\u8bc4\u5206\u8bad\u7ec3\u6d41\u5339\u914d\u52a8\u4f5c\u4e13\u5bb6\u3002", "why_notable": "\u5c06\u76d1\u7763\u4ece\u793a\u8303\u52a8\u4f5c\u6269\u5c55\u5230\u6a21\u578b\u5b9e\u9645\u91c7\u6837\u72b6\u6001\uff0c\u76f4\u63a5\u63d0\u4f9b\u5206\u5e03\u7ea7\u52a8\u4f5c\u76ee\u6807\uff0c\u4e3a\u7ed5\u5f00\u7a00\u758f\u5956\u52b1\u3001\u6539\u5584\u673a\u5668\u4eba\u540e\u8bad\u7ec3\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "High-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to produce future high-resolution fields from recent coarse states remains challenging and costly. We formulate this setting as Predictive Spatiotemporal Weather Downscaling (PSWD), a task that jointly refines spatial and temporal resolution while predicting future high-resolution trajectories. To this end, we propose a framework that decomposes prediction into spatial and temporal stages using a shared pretrained backbone, fixed numerical scaffolds, and lightweight residual heads. For backbone adaptation, we introduce PROLA (PRincipal-Orthogonal Low-rank Adaptation), which allocates a fixed low-rank budget between pretrained weights\u0027 principal directions and their orthogonal complement. PROLA further rescales rank-1 optimizer updates using gradient signals, improving adaptation without increasing trainable rank. Experiments in the PSWD setting show that PROLA outperforms representative low-rank adaptation baselines. Further experiments across diverse datasets and tasks support the broader applicability of PROLA, showing that its benefits extend beyond the primary weather downscaling setting.", "arxiv_id": "2611.11318", "arxiv_url": "https://arxiv.org/abs/2611.11318", "authors": ["Minseo Yoon", "Minseong Bae", "Sojin Lee", "Hyunwoo J. Kim"], "brief": "\u63d0\u51fa\u540c\u65f6\u63d0\u5347\u65f6\u7a7a\u5206\u8fa8\u7387\u5e76\u9884\u6d4b\u672a\u6765\u5929\u6c14\u8f68\u8ff9\u7684\u6846\u67b6\uff0c\u5c06\u9884\u6d4b\u62c6\u4e3a\u7a7a\u95f4\u4e0e\u65f6\u95f4\u9636\u6bb5\u3002PROLA\u5728\u9884\u8bad\u7ec3\u6743\u91cd\u4e3b\u65b9\u5411\u53ca\u6b63\u4ea4\u8865\u95f4\u5206\u914d\u4f4e\u79e9\u9884\u7b97\uff0c\u5e76\u6309\u68af\u5ea6\u91cd\u7f29\u653e\u66f4\u65b0\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/yms020615/PROLA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.11318", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5171\u4eab\u9884\u8bad\u7ec3\u9aa8\u5e72\uff0c\u7ed3\u5408\u56fa\u5b9a\u6570\u503c\u652f\u67b6\u4e0e\u8f7b\u91cf\u6b8b\u5dee\u5934", "PROLA\u4ee5\u56fa\u5b9a\u4f4e\u79e9\u9884\u7b97\u8986\u76d6\u4e3b\u65b9\u5411\u53ca\u6b63\u4ea4\u8865", "\u6309\u68af\u5ea6\u91cd\u7f29\u653e\u79e91\u66f4\u65b0\uff0c\u6548\u679c\u4f18\u4e8e\u4ee3\u8868\u6027\u4f4e\u79e9\u57fa\u7ebf"], "keywords": ["\u5929\u6c14\u9884\u6d4b", "\u65f6\u7a7a\u964d\u5c3a\u5ea6", "\u4f4e\u79e9\u9002\u914d"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.11318v1", "published_at": "2026-11-08", "score": 0.278, "selected_reasons": ["HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11318.png", "title": "PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling", "tldr": "\u901a\u8fc7\u4e3b\u65b9\u5411\u4e0e\u6b63\u4ea4\u7a7a\u95f4\u5206\u914d\u4f4e\u79e9\u9884\u7b97\uff0c\u63d0\u5347\u672a\u6765\u9ad8\u5206\u8fa8\u7387\u5929\u6c14\u9884\u6d4b\u7684\u9002\u914d\u6548\u679c\u3002", "upvotes": 27, "what_it_is": "\u63d0\u51fa\u540c\u65f6\u63d0\u5347\u65f6\u7a7a\u5206\u8fa8\u7387\u5e76\u9884\u6d4b\u672a\u6765\u5929\u6c14\u8f68\u8ff9\u7684\u6846\u67b6\uff0c\u5c06\u9884\u6d4b\u62c6\u4e3a\u7a7a\u95f4\u4e0e\u65f6\u95f4\u9636\u6bb5\u3002PROLA\u5728\u9884\u8bad\u7ec3\u6743\u91cd\u4e3b\u65b9\u5411\u53ca\u6b63\u4ea4\u8865\u95f4\u5206\u914d\u4f4e\u79e9\u9884\u7b97\uff0c\u5e76\u6309\u68af\u5ea6\u91cd\u7f29\u653e\u66f4\u65b0\u3002", "why_notable": "\u5c06\u5929\u6c14\u964d\u5c3a\u5ea6\u4ece\u7a7a\u95f4\u7ec6\u5316\u63a8\u8fdb\u5230\u672a\u6765\u65f6\u7a7a\u8f68\u8ff9\u9884\u6d4b\uff0c\u540c\u65f6\u65e0\u9700\u589e\u52a0\u53ef\u8bad\u7ec3\u79e9\u5373\u53ef\u6539\u5584\u9002\u914d\uff1b\u8de8\u6570\u636e\u96c6\u4e0e\u4efb\u52a1\u5b9e\u9a8c\u4e5f\u652f\u6301\u5176\u8fc1\u79fb\u4ef7\u503c\u3002"}, {"abstract": "Rules govern how player actions change interactive worlds. Different rules create distinct gameplay experiences within similar scenes and action spaces. For customizable gameplay, generative world models must follow user-defined rules beyond real-world behaviors. However, realizing user-defined rules presents two challenges: Rule-State Persistence and Rule-to-Visual Realization. The former requires preserving rule definitions, dependencies, and world states across saving and loading, so that restored worlds follow the established rules. The latter requires accurately realizing rule-induced changes on designated objects and attributes, particularly when affected objects are unseen. In this paper, we propose WorldRuler, which organizes rule definitions, dependencies, and object states in an executable 3D rule graph and connects rule execution, video generation, and perceptual feedback in a closed loop. The graph supports joint saving and restoration of rules and world states, while dynamic object binding grounds rule-specified entities in visual instances and uses stored states to constrain generation from their first appearance. We further introduce object attribute state replacement and counterfactual reconstruction training, enabling accurate attribute control and compatible appearance and motion changes while limiting interference with unrelated content. We develop an automated data collection and annotation pipeline using GTA-V and Habitat to construct RuleVerse, a dataset of rule-driven interactions with detailed state and event annotations, including cases where rules take effect before affected objects become visible. Extensive experiments demonstrate the effectiveness of WorldRuler in preserving rule-state consistency across saving and loading and accurately realizing rule outcomes on designated objects and attributes.", "arxiv_id": "2611.24869", "arxiv_url": "https://arxiv.org/abs/2611.24869", "authors": ["Mingliang Zhai", "Chuanhao Li", "Jiaming Tan", "Zhen Li", "Yuwei Wu", "Yunde Jia", "Zian Meng", "Yuanyang Yin", "Kaipeng Zhang"], "brief": "WorldRuler\u5c06\u89c4\u5219\u3001\u4f9d\u8d56\u4e0e\u5bf9\u8c61\u72b6\u6001\u5b58\u5165\u53ef\u6267\u884c\u4e09\u7ef4\u89c4\u5219\u56fe\uff0c\u95ed\u73af\u8fde\u63a5\u89c4\u5219\u6267\u884c\u3001\u89c6\u9891\u751f\u6210\u4e0e\u611f\u77e5\u53cd\u9988\u3002\u52a8\u6001\u5bf9\u8c61\u7ed1\u5b9a\u8ba9\u5c1a\u672a\u51fa\u73b0\u7684\u5bf9\u8c61\u4e5f\u6309\u5df2\u5b58\u72b6\u6001\u751f\u6210\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/AlayaLab/WorldRuler", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.24869", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53ef\u6267\u884c\u4e09\u7ef4\u89c4\u5219\u56fe\u8054\u5408\u4fdd\u5b58\u4e0e\u6062\u590d\u89c4\u5219\u548c\u4e16\u754c\u72b6\u6001", "\u5c5e\u6027\u72b6\u6001\u66ff\u6362\u4e0e\u53cd\u4e8b\u5b9e\u91cd\u5efa\u8bad\u7ec3\u63a7\u5236\u5916\u89c2\u548c\u8fd0\u52a8", "\u57fa\u4e8eGTA-V\u4e0eHabitat\u6784\u5efa\u89c4\u5219\u4ea4\u4e92\u6570\u636e\u96c6RuleVerse"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u89c4\u5219\u63a7\u5236", "\u72b6\u6001\u4e00\u81f4\u6027"], "num_comments": 2, "on_hf": true, "organization": "Alaya Lab", "pdf_url": "https://arxiv.org/pdf/2611.24869v1", "published_at": "2026-11-18", "score": 0.277, "selected_reasons": ["HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24869.png", "title": "WorldRuler: Interactive World Modeling under Configurable Rules", "tldr": "\u7528\u53ef\u6267\u884c\u4e09\u7ef4\u89c4\u5219\u56fe\u8fde\u63a5\u89c6\u9891\u751f\u6210\uff0c\u8ba9\u4ea4\u4e92\u4e16\u754c\u6301\u7eed\u9075\u5faa\u7528\u6237\u81ea\u5b9a\u4e49\u89c4\u5219\u3002", "upvotes": 18, "what_it_is": "WorldRuler\u5c06\u89c4\u5219\u3001\u4f9d\u8d56\u4e0e\u5bf9\u8c61\u72b6\u6001\u5b58\u5165\u53ef\u6267\u884c\u4e09\u7ef4\u89c4\u5219\u56fe\uff0c\u95ed\u73af\u8fde\u63a5\u89c4\u5219\u6267\u884c\u3001\u89c6\u9891\u751f\u6210\u4e0e\u611f\u77e5\u53cd\u9988\u3002\u52a8\u6001\u5bf9\u8c61\u7ed1\u5b9a\u8ba9\u5c1a\u672a\u51fa\u73b0\u7684\u5bf9\u8c61\u4e5f\u6309\u5df2\u5b58\u72b6\u6001\u751f\u6210\u3002", "why_notable": "\u628a\u81ea\u5b9a\u4e49\u89c4\u5219\u4ece\u6587\u672c\u7ea6\u675f\u63a8\u8fdb\u4e3a\u53ef\u6301\u4e45\u5316\u3001\u53ef\u6267\u884c\u7684\u4e16\u754c\u72b6\u6001\uff0c\u5e76\u5904\u7406\u89c4\u5219\u5148\u4e8e\u5bf9\u8c61\u53ef\u89c1\u65f6\u751f\u6548\u7684\u95ee\u9898\uff0c\u4e3a\u53ef\u5b9a\u5236\u4ea4\u4e92\u4e16\u754c\u63d0\u4f9b\u5b9e\u73b0\u8def\u5f84\u3002"}, {"abstract": "Multimodal tabular learning involves classification and regression on tables combining structured numerical and categorical features with unstructured text and images. These unstructured fields are commonly represented by pretrained encoder embeddings reduced with principal component analysis (PCA). This reduction prioritizes input variance but may overlook information relevant to predicting the target. We introduce LightTAR, a simple, inexpensive method that adapts dimensionality reduction to the prediction task. LightTAR augments the standard PCA representation with a few target-aware features extracted jointly from the final and an intermediate encoder layer using regularized partial least squares (PLS). We evaluate LightTAR with 21 tabular models, including tree ensembles, neural networks, and tabular foundation models. LightTAR improves average predictive performance for all models and, averaged across models, improves prediction on almost every MulTaBench dataset. These gains come with a small increase in total runtime relative to PCA representations. LightTAR integrates directly into existing encoding pipelines, improving tabular learners\u0027 predictive performance without modifying the encoder or the learner.", "arxiv_id": "2611.17600", "arxiv_url": "https://arxiv.org/abs/2611.17600", "authors": ["Eilam Shapira", "Alan Arazi", "Shoham Grunblat", "Roi Reichart"], "brief": "LightTAR\u5728\u5e38\u89c4PCA\u8868\u793a\u4e0a\u8ffd\u52a0\u5c11\u91cf\u76ee\u6807\u611f\u77e5\u7279\u5f81\uff0c\u901a\u8fc7\u6b63\u5219\u5316PLS\u8054\u5408\u63d0\u53d6\u9884\u8bad\u7ec3\u7f16\u7801\u5668\u672b\u5c42\u4e0e\u4e2d\u95f4\u5c42\u4fe1\u606f\uff0c\u65e0\u9700\u4fee\u6539\u7f16\u7801\u5668\u6216\u4e0b\u6e38\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.CL", "cs.CV"], "github_repo": "https://github.com/eilamshapira/LightTAR", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.17600", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6b63\u5219\u5316PLS\u4ece\u672b\u5c42\u4e0e\u4e2d\u95f4\u5c42\u63d0\u53d6\u76ee\u6807\u76f8\u5173\u7279\u5f81", "\u8bc4\u6d4b21\u79cd\u8868\u683c\u6a21\u578b\uff0c\u5747\u83b7\u5f97\u5e73\u5747\u9884\u6d4b\u6027\u80fd\u63d0\u5347", "\u8de8\u6a21\u578b\u5e73\u5747\u540e\uff0c\u51e0\u4e4e\u6240\u6709MulTaBench\u6570\u636e\u96c6\u83b7\u76ca"], "keywords": ["\u591a\u6a21\u6001\u5b66\u4e60", "\u8868\u683c\u5b66\u4e60", "\u964d\u7ef4", "\u76d1\u7763\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Technion Israel institute of technology", "pdf_url": "https://arxiv.org/pdf/2611.17600v1", "published_at": "2026-11-12", "score": 0.273, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17600.png", "title": "LightTAR: Light and Fast Target-Aware Representations for Multimodal Tabular Learning", "tldr": "\u4ee5\u5c11\u91cf\u76ee\u6807\u611f\u77e5\u7279\u5f81\u8865\u5145\u964d\u7ef4\u8868\u793a\uff0c\u4f4e\u6210\u672c\u63d0\u5347\u591a\u6a21\u6001\u8868\u683c\u9884\u6d4b\u6548\u679c\u3002", "upvotes": 20, "what_it_is": "LightTAR\u5728\u5e38\u89c4PCA\u8868\u793a\u4e0a\u8ffd\u52a0\u5c11\u91cf\u76ee\u6807\u611f\u77e5\u7279\u5f81\uff0c\u901a\u8fc7\u6b63\u5219\u5316PLS\u8054\u5408\u63d0\u53d6\u9884\u8bad\u7ec3\u7f16\u7801\u5668\u672b\u5c42\u4e0e\u4e2d\u95f4\u5c42\u4fe1\u606f\uff0c\u65e0\u9700\u4fee\u6539\u7f16\u7801\u5668\u6216\u4e0b\u6e38\u6a21\u578b\u3002", "why_notable": "\u5b83\u8865\u8db3PCA\u504f\u91cd\u8f93\u5165\u65b9\u5dee\u3001\u53ef\u80fd\u4e22\u5931\u9884\u6d4b\u4fe1\u606f\u7684\u77ed\u677f\uff0c\u4ec5\u5c0f\u5e45\u589e\u52a0\u603b\u8fd0\u884c\u65f6\u95f4\uff0c\u5373\u53ef\u76f4\u63a5\u6539\u5584\u73b0\u6709\u591a\u6a21\u6001\u8868\u683c\u5b66\u4e60\u6d41\u7a0b\u3002"}, {"abstract": "Looped language models deepen reasoning at a compact parameter count by iterating a shared layer stack T times per token, turning recurrence depth directly into sequential decoding latency. Conventional early-exit decoding halts after initial passes without cache completion, truncating cached key-value states of past tokens to shallow depth. We study the opposite strategy, late entry, where new tokens skip initial passes and enter directly into the final K \u003c T passes over a deep context cache. Once lightweight fine-tuning resolves hidden-state norm mismatch at the entry boundary, deep cached context substitutes for skipped token-local passes, allowing late entry to outperform matched early exit across model families and pass budgets. To turn this asymmetry into wall-clock speedups without stalling to build deep caches, candidate blocks verify through only the final K passes on the critical path while previously committed tokens complete passes 1 -\u003e T alongside subsequent steps at zero extra serial calls. Projecting these finished T-pass wake states inside the existing output GEMM (Wake verification, governed by logit-margin tolerance tau in [0, inf]) unifies greedy-exact T-pass decoding (tau = 0, matching K = T block decoding within bf16 reduction order), margin-gated verification (tau \u003e 0), and non-rollback lossy late entry (tau = inf) inside a single static CUDA graph. On Ouro-2.6B (T = 4), K = 2 Wake reaches 5.2x greedy-exact speedup at tau = 0 (+26% over K = 4 block decoding on GSM8K) and 6.8x at tau = inf (+16.9 points over trained early exit at matched speed). Scaling test-time recurrence across T in {8, 16, 32, 64} on Huginn-3.5B cuts K = T/4 rollbacks 21.5x with depth, driving greedy-exact (tau = 0) speedups to 6.1x (T = 32) and 8.4x (T = 64, +153% over K = 64 block) and tau = inf speedups to 10.6 to 12.5x.", "arxiv_id": "2611.24576", "arxiv_url": "https://arxiv.org/abs/2611.24576", "authors": ["Ziqi Jin", "Jiaxi Li", "Weiwen Xu", "Aixin Sun"], "brief": "\u63d0\u51fa\u665a\u8fdb\u5165\u89e3\u7801\uff1a\u65b0\u8bcd\u5143\u4ec5\u6267\u884c\u672b\u5c3e\u5faa\u73af\uff0c\u901a\u8fc7\u8f7b\u91cf\u5fae\u8c03\u9002\u914d\u6df1\u5c42\u7f13\u5b58\u3002\u7ed3\u5408\u540e\u53f0\u7f13\u5b58\u8865\u5168\u4e0eWake\u9a8c\u8bc1\uff0c\u5728\u9759\u6001CUDA\u56fe\u4e2d\u7edf\u4e00\u7cbe\u786e\u548c\u6709\u635f\u89e3\u7801\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Xalp/LateComer", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.24576", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8f7b\u91cf\u5fae\u8c03\u4fee\u6b63\u5165\u53e3\u9690\u72b6\u6001\u8303\u6570\u5931\u914d\uff0c\u665a\u8fdb\u5165\u4f18\u4e8e\u540c\u9884\u7b97\u65e9\u9000", "Wake\u4ee5\u9608\u503c\u03c4\u63a7\u5236\u9a8c\u8bc1\uff0c\u03c4=0\u4fdd\u6301\u8d2a\u5fc3\u7cbe\u786e\u89e3\u7801", "Huginn\u5faa\u73af64\u6b21\u65f6\uff0c\u7cbe\u786e\u89e3\u7801\u52a0\u901f8.4\u500d"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u5faa\u73af\u7f51\u7edc", "\u63a8\u7406\u52a0\u901f", "\u7f13\u5b58\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.24576v1", "published_at": "2026-11-18", "score": 0.273, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24576.png", "title": "Late Entry in Looped Language Models", "tldr": "\u8ba9\u65b0\u8bcd\u5143\u8df3\u8fc7\u524d\u6bb5\u5faa\u73af\u3001\u590d\u7528\u6df1\u5c42\u4e0a\u4e0b\u6587\uff0c\u5b9e\u73b0\u7cbe\u786e\u89e3\u7801\u6700\u9ad8\u516b\u500d\u52a0\u901f\u3002", "upvotes": 9, "what_it_is": "\u63d0\u51fa\u665a\u8fdb\u5165\u89e3\u7801\uff1a\u65b0\u8bcd\u5143\u4ec5\u6267\u884c\u672b\u5c3e\u5faa\u73af\uff0c\u901a\u8fc7\u8f7b\u91cf\u5fae\u8c03\u9002\u914d\u6df1\u5c42\u7f13\u5b58\u3002\u7ed3\u5408\u540e\u53f0\u7f13\u5b58\u8865\u5168\u4e0eWake\u9a8c\u8bc1\uff0c\u5728\u9759\u6001CUDA\u56fe\u4e2d\u7edf\u4e00\u7cbe\u786e\u548c\u6709\u635f\u89e3\u7801\u3002", "why_notable": "\u5c06\u5faa\u73af\u6a21\u578b\u7684\u6df1\u5c42\u7f13\u5b58\u8f6c\u5316\u4e3a\u63a8\u7406\u52a0\u901f\u8d44\u6e90\uff0c\u800c\u975e\u76f4\u63a5\u524a\u51cf\u63a8\u7406\u6df1\u5ea6\uff1b\u5728\u4fdd\u6301\u8d2a\u5fc3\u8f93\u51fa\u4e00\u81f4\u65f6\uff0c\u4ecd\u663e\u8457\u964d\u4f4e\u4e32\u884c\u89e3\u7801\u5f00\u9500\u3002"}, {"abstract": "Generative novel view synthesis (NVS) employs a diffusion model to render a static or dynamic scene from a target camera view. Explicit warp methods complete a reprojection of the source with video diffusion models, and implicit methods encode the camera parameters or 3D cues. Both add inference overhead, and the generated layout often drifts from the ground truth. We present WaveView, which injects the warped source into the phase of the initial noise of a pretrained generator. The Dual-Tree Complex Wavelet Packet Transform (DT-CWPT) allows local and anisotropic phase injection. The generator is thus constrained less in disoccluded regions and along the epipolar line. WaveView keeps the architecture and adds negligible overhead. On the DL3DV benchmark, it outperforms all baselines in every overlap bin. In the hardest bin, it gains 0.84 dB PSNR on the covisible region over MetaView, which shares its generator, while running 2.1 times faster. For dynamic NVS, fine-tuning AnyView with the same noise raises its zero-shot PSNR on AnyViewBench from 11.58 to 12.35 dB.", "arxiv_id": "2611.23994", "arxiv_url": "https://arxiv.org/abs/2611.23994", "authors": ["Kaiwen Wang", "Jan-Hendrik Pauls", "Yinzhe Shen", "Frank Bieder", "Christoph Stiller"], "brief": "WaveView\u5229\u7528\u53cc\u6811\u590d\u5c0f\u6ce2\u5305\u53d8\u6362\uff0c\u5c06\u6e90\u56fe\u91cd\u6295\u5f71\u7ed3\u679c\u6ce8\u5165\u9884\u8bad\u7ec3\u751f\u6210\u5668\u7684\u521d\u59cb\u566a\u58f0\u76f8\u4f4d\u3002\u5c40\u90e8\u3001\u5404\u5411\u5f02\u6027\u7684\u6ce8\u5165\u8ba9\u906e\u6321\u663e\u9732\u533a\u57df\u53ca\u6781\u7ebf\u65b9\u5411\u4fdd\u7559\u66f4\u591a\u751f\u6210\u81ea\u7531\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23994", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["DT-CWPT\u5b9e\u73b0\u5c40\u90e8\u3001\u5404\u5411\u5f02\u6027\u76f8\u4f4d\u6ce8\u5165\uff0c\u65e0\u9700\u6539\u67b6\u6784", "DL3DV\u6700\u96be\u6863\u8f83MetaView\u63d0\u53470.84 dB\uff0c\u5feb2.1\u500d", "AnyView\u5fae\u8c03\u540e\u96f6\u6837\u672cPSNR\u4ece11.58\u5347\u81f312.35 dB"], "keywords": ["\u65b0\u89c6\u89d2\u5408\u6210", "\u6269\u6563\u6a21\u578b", "\u5c0f\u6ce2\u53d8\u6362"], "num_comments": 2, "on_hf": true, "organization": "Karlsruhe Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2611.23994v1", "published_at": "2026-11-18", "score": 0.264, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23994.png", "title": "WaveView: The Novel View Is in the Noise", "tldr": "\u5c06\u91cd\u6295\u5f71\u56fe\u50cf\u6ce8\u5165\u521d\u59cb\u566a\u58f0\u76f8\u4f4d\uff0c\u4f4e\u5f00\u9500\u63d0\u5347\u65b0\u89c6\u89d2\u751f\u6210\u7684\u51e0\u4f55\u4e00\u81f4\u6027\u3002", "upvotes": 8, "what_it_is": "WaveView\u5229\u7528\u53cc\u6811\u590d\u5c0f\u6ce2\u5305\u53d8\u6362\uff0c\u5c06\u6e90\u56fe\u91cd\u6295\u5f71\u7ed3\u679c\u6ce8\u5165\u9884\u8bad\u7ec3\u751f\u6210\u5668\u7684\u521d\u59cb\u566a\u58f0\u76f8\u4f4d\u3002\u5c40\u90e8\u3001\u5404\u5411\u5f02\u6027\u7684\u6ce8\u5165\u8ba9\u906e\u6321\u663e\u9732\u533a\u57df\u53ca\u6781\u7ebf\u65b9\u5411\u4fdd\u7559\u66f4\u591a\u751f\u6210\u81ea\u7531\u3002", "why_notable": "\u628a\u51e0\u4f55\u7ea6\u675f\u653e\u8fdb\u566a\u58f0\u800c\u975e\u7f51\u7edc\u7ed3\u6784\uff0c\u4ee5\u8fd1\u4e4e\u53ef\u5ffd\u7565\u7684\u5f00\u9500\u6539\u5584\u89c6\u89d2\u5e03\u5c40\uff1b\u5728\u9759\u6001\u548c\u52a8\u6001\u573a\u666f\u5747\u5c55\u793a\u4e86\u6536\u76ca\u3002"}, {"abstract": "LLM-enhanced recommender systems encode item side information into semantic embeddings, but these embeddings may leak sensitive textual attributes through inversion attacks. Existing input-side defenses rely on trusted collection or local token perturbation, often disrupting the inter-item semantic topology needed for recommendation. To address it, we introduce relational fidelity as the key objective, requiring semantic shift for privacy while preserving relative item relations for utility. Based on this principle, we propose prototype-guided progressive obfuscation (PGPO), which learns topology-aware obfuscation anchors for high-influence prototype words and propagates them through a static semantic graph. PGPO is optimized with GRPO using individual dissimilarity, structural consistency, and semantic constraint rewards. Experiments on two benchmarks show strong inversion defense with near-upper-bound recommendation performance. The code is available at https://github.com/Shengxiang-Lin/PGPO.", "arxiv_id": "2611.23236", "arxiv_url": "https://arxiv.org/abs/2611.23236", "authors": ["Shengxiang Lin", "Jiajie Su", "Pengyang Zhou", "Xiang Chen", "Xiaolin Zheng", "Feng Tian", "Chaochao Chen"], "brief": "PGPO\u4e3a\u9ad8\u5f71\u54cd\u539f\u578b\u8bcd\u5b66\u4e60\u62d3\u6251\u611f\u77e5\u7684\u6df7\u6dc6\u951a\u70b9\uff0c\u5e76\u6cbf\u9759\u6001\u8bed\u4e49\u56fe\u4f20\u64ad\u3002\u901a\u8fc7GRPO\u8054\u5408\u4f18\u5316\u9690\u79c1\u504f\u79fb\u4e0e\u7ed3\u6784\u4e00\u81f4\u6027\uff0c\u5728\u6539\u53d8\u6587\u672c\u8bed\u4e49\u65f6\u4fdd\u7559\u7269\u54c1\u95f4\u76f8\u5bf9\u5173\u7cfb\u3002", "categories": ["cs.IR", "cs.CL", "cs.CR"], "github_repo": "https://github.com/Shengxiang-Lin/PGPO", "github_stars": 156, "hf_url": "https://huggingface.co/papers/2611.23236", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["PGPO\u5b66\u4e60\u539f\u578b\u8bcd\u6df7\u6dc6\u951a\u70b9\uff0c\u6cbf\u9759\u6001\u8bed\u4e49\u56fe\u4f20\u64ad", "GRPO\u7ed3\u5408\u4e2a\u4f53\u5dee\u5f02\u3001\u7ed3\u6784\u4e00\u81f4\u6027\u4e0e\u8bed\u4e49\u7ea6\u675f\u5956\u52b1", "\u4e24\u4e2a\u57fa\u51c6\u4e0a\u5f3a\u5316\u53cd\u6f14\u9632\u5fa1\uff0c\u63a8\u8350\u6027\u80fd\u63a5\u8fd1\u4e0a\u754c"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u9690\u79c1\u4fdd\u62a4", "\u8bed\u4e49\u5d4c\u5165", "\u53cd\u6f14\u653b\u51fb"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2611.23236v1", "published_at": "2026-08-26", "score": 0.255, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23236.png", "title": "PGPO: Prototype-Guided Progressive Obfuscation for Privacy-Preserving LLM-Enhanced Recommendation", "tldr": "\u901a\u8fc7\u539f\u578b\u5f15\u5bfc\u7684\u6e10\u8fdb\u6df7\u6dc6\u4fdd\u62a4\u7269\u54c1\u6587\u672c\u9690\u79c1\uff0c\u540c\u65f6\u4fdd\u7559\u63a8\u8350\u6240\u9700\u7684\u8bed\u4e49\u5173\u7cfb\u3002", "upvotes": 2, "what_it_is": "PGPO\u4e3a\u9ad8\u5f71\u54cd\u539f\u578b\u8bcd\u5b66\u4e60\u62d3\u6251\u611f\u77e5\u7684\u6df7\u6dc6\u951a\u70b9\uff0c\u5e76\u6cbf\u9759\u6001\u8bed\u4e49\u56fe\u4f20\u64ad\u3002\u901a\u8fc7GRPO\u8054\u5408\u4f18\u5316\u9690\u79c1\u504f\u79fb\u4e0e\u7ed3\u6784\u4e00\u81f4\u6027\uff0c\u5728\u6539\u53d8\u6587\u672c\u8bed\u4e49\u65f6\u4fdd\u7559\u7269\u54c1\u95f4\u76f8\u5bf9\u5173\u7cfb\u3002", "why_notable": "\u5c06\u9690\u79c1\u4fdd\u62a4\u76ee\u6807\u4ece\u5c40\u90e8\u8bcd\u5143\u6270\u52a8\u8f6c\u5411\u5173\u7cfb\u4fdd\u771f\uff0c\u517c\u987e\u53cd\u6f14\u9632\u5fa1\u4e0e\u63a8\u8350\u6548\u7528\uff0c\u4e3a\u8bed\u4e49\u5d4c\u5165\u7684\u9690\u79c1\u4fdd\u62a4\u63d0\u4f9b\u7ed3\u6784\u5316\u601d\u8def\u3002"}, {"abstract": "NPU design-space exploration for LLM inference mainly relies on an expensive simulator that often returns only scalar feedback such as latency and power. Such feedback can rank evaluated configurations, but gives little information for deciding why a configuration is slow or which architecture parameter should be changed next. This limitation is especially severe because prefill and decode workloads can be limited by different resources, including compute throughput and HBM bandwidth. We propose CriticNPU, a sample-efficient DSE framework built around an online-calibrated mechanistic critic for NPU architecture design. The critic uses explicit hardware limits to evaluate NPU configurations: before simulation, it estimates whether a proposed configuration is likely to improve over the current best and filters weak candidates; after simulation, it aggregates operator-level runtimes into prefill/decode bottleneck summaries and predicts the effect of candidate parameter changes. We instantiate the critic with a Roofline-style model that derives compute and memory limits from architecture parameters and calibrates per-operator-type effective limits using simulator observations. And CriticNPU combines this critic with a workload extractor and an architecture planner to propose configurations. Across six LLM workloads and 16 deployment configurations per model, CriticNPU achieves best-or-tied-best latency in 74% of prefill and 87.5% of decode settings while using roughly half the simulator calls of competitive DSE baselines. We conduct extensive ablation studies and detailed analyses to validate the effectiveness of our method from multiple perspectives. Our code is available at https://github.com/bruno686/CriticNPU.", "arxiv_id": "2611.24733", "arxiv_url": "https://arxiv.org/abs/2611.24733", "authors": ["Yicheng He", "Yuqi Xue", "Tianyang Wu", "Jian Huang", "Bin Hu"], "brief": "CriticNPU\u5c06\u5728\u7ebf\u6821\u51c6\u7684Roofline\u6a21\u578b\u4e0e\u5de5\u4f5c\u8d1f\u8f7d\u63d0\u53d6\u5668\u3001\u67b6\u6784\u89c4\u5212\u5668\u7ed3\u5408\uff0c\u4eff\u771f\u524d\u7b5b\u9009\u5019\u9009\uff0c\u4eff\u771f\u540e\u5206\u6790\u74f6\u9888\u5e76\u9884\u6d4b\u53c2\u6570\u8c03\u6574\u6548\u679c\u3002", "categories": ["cs.AR"], "github_repo": "https://github.com/bruno686/CriticNPU", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.24733", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Roofline\u6a21\u578b\u6309\u7b97\u5b50\u7c7b\u578b\u6821\u51c6\u6709\u6548\u8ba1\u7b97\u4e0e\u5185\u5b58\u4e0a\u9650", "\u8bc4\u6d4b\u8986\u76d66\u4e2aLLM\uff0c\u6bcf\u4e2a\u6a21\u578b16\u79cd\u90e8\u7f72\u914d\u7f6e", "\u6700\u4f18\u6216\u5e76\u5217\u6700\u4f18\u5360\u6bd4\uff1a\u9884\u586b\u514574%\uff0c\u89e3\u780187.5%"], "keywords": ["\u786c\u4ef6\u67b6\u6784", "\u8bbe\u8ba1\u7a7a\u95f4\u63a2\u7d22", "\u6027\u80fd\u5efa\u6a21", "\u5927\u6a21\u578b\u63a8\u7406"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24733v1", "published_at": "2026-11-18", "score": 0.25, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24733.png", "title": "Mechanistic Critics for Sample-Efficient NPU Design-Space Exploration", "tldr": "\u901a\u8fc7\u5728\u7ebf\u6821\u51c6\u7684\u786c\u4ef6\u673a\u7406\u6a21\u578b\u6307\u5bfcNPU\u8bbe\u8ba1\u641c\u7d22\uff0c\u4ee5\u7ea6\u534a\u6570\u4eff\u771f\u8c03\u7528\u83b7\u5f97\u66f4\u4f18\u5ef6\u8fdf\u3002", "upvotes": 9, "what_it_is": "CriticNPU\u5c06\u5728\u7ebf\u6821\u51c6\u7684Roofline\u6a21\u578b\u4e0e\u5de5\u4f5c\u8d1f\u8f7d\u63d0\u53d6\u5668\u3001\u67b6\u6784\u89c4\u5212\u5668\u7ed3\u5408\uff0c\u4eff\u771f\u524d\u7b5b\u9009\u5019\u9009\uff0c\u4eff\u771f\u540e\u5206\u6790\u74f6\u9888\u5e76\u9884\u6d4b\u53c2\u6570\u8c03\u6574\u6548\u679c\u3002", "why_notable": "\u628a\u4eff\u771f\u7684\u6807\u91cf\u53cd\u9988\u8f6c\u5316\u4e3a\u53ef\u6307\u5bfc\u67b6\u6784\u8c03\u6574\u7684\u74f6\u9888\u4fe1\u606f\uff0c\u5728\u7ea6\u51cf\u534a\u4eff\u771f\u8c03\u7528\u7684\u540c\u65f6\u4fdd\u6301\u8f83\u5f3a\u641c\u7d22\u8d28\u91cf\uff0c\u964d\u4f4e\u786c\u4ef6\u63a2\u7d22\u6210\u672c\u3002"}, {"abstract": "Language models can gain capacity at little computational cost from n-gram embedding tables: large tables of learned vectors for short sequences of consecutive tokens, which are looked up and added to the model\u0027s input or to its intermediate layers. Recent designs commonly use a separate n-gram embedding table for each layer, which makes the tables costly in memory and prevents layers from sharing what they learn. Sharing a single table, however, gives every layer the same embedding and leaves no room for layer-wise preferences, and it performs poorly in practice. We propose Chorus, in which one set of n-gram embedding tables serves the whole network and every layer reads it in its own way. Each layer maps the refined embedding through its own projection layer, after rescaling its components by factors computed from its current hidden state. Chorus matches the quality of existing n-gram methods with 87% smaller tables: with 1.2B table parameters it predicts text better than FactorEngram and DeepSeek\u0027s Engram do with 9.6B. It outperforms Engram, TN-gram and FactorEngram in every setting where we compared them, across table sizes from 20M to 9.6B parameters. We also show that the recently proposed memory-efficient optimizer Ember works well with Chorus, saving 99.2% of table-optimizer memory compared with AdamW without degrading training performance. These results enable further scaling of n-gram embedding tables along the table-size axis by reducing memory use and allowing shared knowledge to be reused across layers.", "arxiv_id": "2611.23386", "arxiv_url": "https://arxiv.org/abs/2611.23386", "authors": ["Stephen Chung", "Wenyu Du"], "brief": "Chorus\u8ba9\u5168\u7f51\u7edc\u5171\u7528\u4e00\u7ec4n-gram\u5d4c\u5165\u8868\uff0c\u540c\u65f6\u4fdd\u7559\u5404\u5c42\u504f\u597d\uff1a\u5148\u6839\u636e\u5f53\u524d\u9690\u85cf\u72b6\u6001\u9010\u5206\u91cf\u7f29\u653e\u5d4c\u5165\uff0c\u518d\u7ecf\u5404\u5c42\u72ec\u7acb\u6295\u5f71\u540e\u4f7f\u7528\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/dualverse-ai/chorus", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23386", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["1.2B\u8868\u53c2\u6570\u4f18\u4e8e9.6B\u7684Engram\u4e0eFactorEngram", "\u572820M\u81f39.6B\u8868\u53c2\u6570\u7684\u5168\u90e8\u5bf9\u6bd4\u8bbe\u7f6e\u4e2d\u9886\u5148", "\u642d\u914dEmber\u8f83AdamW\u8282\u770199.2%\u8868\u4f18\u5316\u5668\u5185\u5b58"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u5d4c\u5165\u8868", "\u53c2\u6570\u5171\u4eab", "\u5185\u5b58\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23386v1", "published_at": "2026-11-17", "score": 0.249, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23386.png", "title": "Chorus: Shared N-gram Embeddings with Layer-wise Adaptation", "tldr": "\u901a\u8fc7\u5171\u4eab\u77ed\u5e8f\u5217\u5d4c\u5165\u4e0e\u9010\u5c42\u9002\u914d\uff0c\u5927\u5e45\u964d\u4f4e\u8bed\u8a00\u6a21\u578b\u6269\u5bb9\u7684\u5185\u5b58\u6210\u672c\u3002", "upvotes": 4, "what_it_is": "Chorus\u8ba9\u5168\u7f51\u7edc\u5171\u7528\u4e00\u7ec4n-gram\u5d4c\u5165\u8868\uff0c\u540c\u65f6\u4fdd\u7559\u5404\u5c42\u504f\u597d\uff1a\u5148\u6839\u636e\u5f53\u524d\u9690\u85cf\u72b6\u6001\u9010\u5206\u91cf\u7f29\u653e\u5d4c\u5165\uff0c\u518d\u7ecf\u5404\u5c42\u72ec\u7acb\u6295\u5f71\u540e\u4f7f\u7528\u3002", "why_notable": "\u5b83\u517c\u987e\u8de8\u5c42\u77e5\u8bc6\u5171\u4eab\u4e0e\u9010\u5c42\u9002\u914d\uff0c\u4ee5\u7f29\u5c0f87%\u7684\u5d4c\u5165\u8868\u5339\u914d\u73b0\u6709\u65b9\u6cd5\u8d28\u91cf\uff0c\u4e3a\u4f4e\u5185\u5b58\u6269\u5c55\u8bed\u8a00\u6a21\u578b\u5bb9\u91cf\u63d0\u4f9b\u4e86\u8def\u5f84\u3002"}, {"abstract": "Personalized vision-language assistants use visual observations and personal memories to provide advice tailored to the user. When the observed scene contains a physical hazard, personal context, such as allergies, medical conditions, or mobility constraints, can change what help is appropriate. Responding appropriately therefore requires recognizing the visible hazard and applying the relevant person\u0027s information. We introduce PReMind-Bench, a diagnostic benchmark that evaluates this combination across diverse hazards and personal-memory conditions. It separately measures memory access, grounding, abstention, and hazard response, and assesses joint success on interdependency cases. Existing models often satisfy one requirement while failing the other, and training only for safety or personalization leaves a gap in joint success. We therefore propose PReMind, a two-phase reinforcement learning framework that combines on-demand and forced-call interactions (memory always retrieved) to jointly train grounded memory use and hazard response. At 4B, PReMind raises joint success from 12.9% to 28.6% over its base on the interdependency set and improves hazard adequacy and correct abstention on the main test. Joint-success gains persist under forced-call evaluation and under a second LLM judge across three Phase II seeds; averaged over these seeds, joint success also improves on unseen hazard groups. These findings highlight the need to evaluate and train personal assistants to connect visual evidence with the relevant person\u0027s context.", "arxiv_id": "2611.23808", "arxiv_url": "https://arxiv.org/abs/2611.23808", "authors": ["Yeongtak Oh", "Donghyeok Lee", "Joonhee Oh", "Jaewon Jeong", "Sungroh Yoon"], "brief": "\u63d0\u51fa\u8bca\u65ad\u57fa\u51c6\u4e0e\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u8bc4\u4f30\u5e76\u8bad\u7ec3\u89c6\u89c9\u52a9\u624b\u5173\u8054\u573a\u666f\u5371\u9669\u4e0e\u4e2a\u4eba\u4fe1\u606f\u3002\u8bad\u7ec3\u7ed3\u5408\u6309\u9700\u68c0\u7d22\u548c\u5f3a\u5236\u8c03\u7528\u8bb0\u5fc6\uff0c\u517c\u987e\u8bb0\u5fc6\u4f9d\u636e\u4e0e\u5371\u9669\u5e94\u5bf9\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23808", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["PReMind-Bench\u5206\u6d4b\u8bb0\u5fc6\u8bbf\u95ee\u3001\u4f9d\u636e\u5173\u8054\u3001\u5f03\u7b54\u4e0e\u5371\u9669\u5e94\u5bf9", "4B\u6a21\u578b\u8054\u5408\u6210\u529f\u7387\u4ece12.9%\u5347\u81f328.6%", "\u4e09\u6b21\u8bad\u7ec3\u79cd\u5b50\u4e0b\uff0c\u672a\u89c1\u5371\u9669\u7c7b\u522b\u7684\u5e73\u5747\u8054\u5408\u6210\u529f\u7387\u4e5f\u63d0\u5347"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4e2a\u6027\u5316\u52a9\u624b", "\u8bb0\u5fc6\u68c0\u7d22", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 4, "on_hf": true, "organization": "Seoul National University", "pdf_url": "https://arxiv.org/pdf/2611.23808v1", "published_at": "2026-11-18", "score": 0.245, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23808.png", "title": "PReMind: When Personal Memory Meets Visual Hazards", "tldr": "\u901a\u8fc7\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\uff0c\u8ba9\u89c6\u89c9\u52a9\u624b\u7ed3\u5408\u4e2a\u4eba\u8bb0\u5fc6\u8bc6\u522b\u5371\u9669\u5e76\u7ed9\u51fa\u9002\u5f53\u5efa\u8bae\u3002", "upvotes": 9, "what_it_is": "\u63d0\u51fa\u8bca\u65ad\u57fa\u51c6\u4e0e\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u8bc4\u4f30\u5e76\u8bad\u7ec3\u89c6\u89c9\u52a9\u624b\u5173\u8054\u573a\u666f\u5371\u9669\u4e0e\u4e2a\u4eba\u4fe1\u606f\u3002\u8bad\u7ec3\u7ed3\u5408\u6309\u9700\u68c0\u7d22\u548c\u5f3a\u5236\u8c03\u7528\u8bb0\u5fc6\uff0c\u517c\u987e\u8bb0\u5fc6\u4f9d\u636e\u4e0e\u5371\u9669\u5e94\u5bf9\u3002", "why_notable": "\u63ed\u793a\u5355\u72ec\u4f18\u5316\u5b89\u5168\u6216\u4e2a\u6027\u5316\u4e0d\u8db3\u4ee5\u5904\u7406\u4e8c\u8005\u76f8\u4e92\u4f9d\u8d56\u7684\u573a\u666f\uff0c\u4e3a\u7ed3\u5408\u4e2a\u4eba\u5904\u5883\u7684\u89c6\u89c9\u5b89\u5168\u5efa\u8bae\u63d0\u4f9b\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Automatic CAD generation is commonly evaluated with volumetric IoU, Chamfer Distance, and surface F-score, which barely penalize local errors that occupy only a small fraction of a part\u0027s volume or surface area, such as a misplaced hole or a slot on the wrong face, even though such errors are critical to manufacturing. We formalize these metrics in a unified integral form and show that the weight of a local error decays as the $(k+q)$-th power of its size, where $k$ is the dimension of the integration domain and $q$ is determined by the penalty function. Guided by this analysis, we propose DrawScore, which projects both models into three orthographic views with visible and hidden lines, as in engineering drawings, and applies a saturating penalty along the projected curves, so that the weight of a local error decays only linearly. Controlled experiments confirm the predicted decay orders, and on outputs of existing CAD generation agents, DrawScore exposes errors in outputs that IoU rates as nearly perfect. DrawScore further improves generation as a reinforcement learning reward and, for CAD generation from engineering drawings, serves as a test-time verifier without 3D ground truth or an additional reward model. Our code is available at https://github.com/UESTC-Simon/DrawScore.", "arxiv_id": "2611.24681", "arxiv_url": "https://arxiv.org/abs/2611.24681", "authors": ["Haorui Chen", "Shiteng Lu", "Zhanyu Guo", "Zaixi Li", "Yunhe Ni", "Yaosong Du", "Yichen Xiang", "Xiande Huang", "Rui Huang"], "brief": "\u63d0\u51faDrawScore\uff0c\u5c06\u4e24\u4e2a\u6a21\u578b\u6295\u5f71\u4e3a\u542b\u53ef\u89c1\u7ebf\u4e0e\u9690\u85cf\u7ebf\u7684\u4e09\u89c6\u56fe\uff0c\u5e76\u6cbf\u6295\u5f71\u66f2\u7ebf\u65bd\u52a0\u9971\u548c\u60e9\u7f5a\uff0c\u4f7f\u5c40\u90e8\u9519\u8bef\u6743\u91cd\u4ec5\u968f\u5c3a\u5bf8\u7ebf\u6027\u8870\u51cf\u3002", "categories": ["cs.CV", "cs.SE"], "github_repo": "https://github.com/UESTC-Simon/DrawScore", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.24681", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7edf\u4e00\u79ef\u5206\u5206\u6790\uff1a\u4f20\u7edf\u6307\u6807\u8bef\u5dee\u6743\u91cd\u6309\u5c3a\u5bf8\u7684(k+q)\u6b21\u5e42\u8870\u51cf", "DrawScore\u4ee5\u4e09\u89c6\u56fe\u66f2\u7ebf\u548c\u9971\u548c\u60e9\u7f5a\u6355\u6349\u9519\u5b54\u3001\u9519\u9762\u69fd", "\u53ef\u4f5c\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u53ca\u65e0\u97003D\u771f\u503c\u7684\u6d4b\u8bd5\u65f6\u9a8c\u8bc1\u5668"], "keywords": ["\u8ba1\u7b97\u673a\u8f85\u52a9\u8bbe\u8ba1", "\u751f\u6210\u6a21\u578b\u8bc4\u4f30", "\u5de5\u7a0b\u56fe", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24681v1", "published_at": "2026-11-18", "score": 0.24, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24681.png", "title": "DrawScore: Evaluating Generated CAD Models against Engineering Drawings", "tldr": "\u7528\u5de5\u7a0b\u56fe\u6295\u5f71\u8bc4\u4f30\u751f\u6210CAD\uff0c\u653e\u5927\u4f20\u7edf\u6307\u6807\u5bb9\u6613\u5ffd\u7565\u7684\u5236\u9020\u5173\u952e\u5c40\u90e8\u9519\u8bef\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51faDrawScore\uff0c\u5c06\u4e24\u4e2a\u6a21\u578b\u6295\u5f71\u4e3a\u542b\u53ef\u89c1\u7ebf\u4e0e\u9690\u85cf\u7ebf\u7684\u4e09\u89c6\u56fe\uff0c\u5e76\u6cbf\u6295\u5f71\u66f2\u7ebf\u65bd\u52a0\u9971\u548c\u60e9\u7f5a\uff0c\u4f7f\u5c40\u90e8\u9519\u8bef\u6743\u91cd\u4ec5\u968f\u5c3a\u5bf8\u7ebf\u6027\u8870\u51cf\u3002", "why_notable": "\u5b83\u63ed\u793a\u4e86\u9ad8IoU\u53ef\u80fd\u63a9\u76d6\u7684\u5236\u9020\u5173\u952e\u9519\u8bef\uff0c\u5e76\u628a\u66f4\u654f\u611f\u7684\u8bc4\u4f30\u76f4\u63a5\u7528\u4e8e\u751f\u6210\u4f18\u5316\u4e0e\u9a8c\u8bc1\uff0c\u8fde\u63a5\u51e0\u4f55\u76f8\u4f3c\u5ea6\u548c\u5de5\u7a0b\u53ef\u7528\u6027\u3002"}, {"abstract": "Full-duplex spoken dialogue models learn turn-taking, overlaps and backchannels from conversations recorded with one channel per speaker, but most available conversational audio is a single mono mix. We present Kezek, a model that turns a mono recording of exactly two people into one track per person with the original length and timing; overlaps and short replies (\"yeah\", \"mm-hm\") stay on the track of the person who said them. Kezek decides who speaks when and who is who once for the whole recording (stage 1: a two-voice activity model guided by a speaker fingerprint trained to be insensitive to phase), and a conditioned time-domain separator only carries out that decision (stage 2), with outputs that always sum to the input. Standard separation metrics miss the failures that matter for dialogue data, so we report short-reply retention, leakage onto the other person\u0027s solo, channel swaps and coverage. Against the open pipeline pyannote -\u003e DialogueSidon on the same recordings, Kezek keeps more short replies (0.83 vs. 0.69 on Open Yap test; 0.80 vs. 0.71 over the other\u0027s speech on unseen telephone speech from CallHome English), mostly because it returns the whole recording while the external pipeline drops part of it (on the audio both return, reply retention is about the same: 0.859 vs. 0.865 on Open Yap); it also leaks less, swaps channels less often, and runs 4-5 times faster (about 230 hours of audio per GPU-hour). We also report negative results and an ideal-mask ceiling that locate the remaining gap: quiet replies under a louder voice. Code and weights are released under permissive licences.", "arxiv_id": "2611.16933", "arxiv_url": "https://arxiv.org/abs/2611.16933", "authors": ["Bagzhan Karl", "Alizhan Karl"], "brief": "Kezek\u5148\u7528\u76f8\u4f4d\u4e0d\u654f\u611f\u7684\u8bf4\u8bdd\u4eba\u6307\u7eb9\u6307\u5bfc\u53cc\u58f0\u6d3b\u52a8\u6a21\u578b\uff0c\u7edf\u4e00\u786e\u5b9a\u5168\u7a0b\u8eab\u4efd\u4e0e\u53d1\u58f0\u65f6\u6bb5\uff1b\u518d\u7531\u6761\u4ef6\u65f6\u57df\u5206\u79bb\u5668\u751f\u6210\u7b49\u957f\u53cc\u8f68\uff0c\u4e14\u8f93\u51fa\u4e4b\u548c\u59cb\u7ec8\u7b49\u4e8e\u8f93\u5165\u3002", "categories": ["eess.AS", "cs.AI"], "github_repo": "https://github.com/Manifestro/kezek", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.16933", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Open Yap\u77ed\u56de\u5e94\u4fdd\u7559\u73870.83\uff0c\u5bf9\u7167\u4e3a0.69", "\u4fdd\u7559\u4f18\u52bf\u4e3b\u8981\u6765\u81ea\u5168\u7a0b\u8986\u76d6\uff0c\u5171\u540c\u7247\u6bb5\u8868\u73b0\u76f8\u8fd1", "\u8f83pyannote\u2192DialogueSidon\u5feb4\u20145\u500d\uff0c\u6cc4\u6f0f\u4e0e\u6362\u8f68\u66f4\u5c11"], "keywords": ["\u8bed\u97f3\u5206\u79bb", "\u5168\u53cc\u5de5\u5bf9\u8bdd", "\u8bf4\u8bdd\u4eba\u8bc6\u522b", "\u8bad\u7ec3\u6570\u636e"], "num_comments": 3, "on_hf": true, "organization": "Manifestro", "pdf_url": "https://arxiv.org/pdf/2611.16933v1", "published_at": "2026-11-12", "score": 0.234, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16933.png", "title": "Kezek: Splitting Mono Two-Person Conversations into Per-Speaker Tracks for Full-Duplex Dialogue Data", "tldr": "\u5c06\u53cc\u4eba\u5355\u58f0\u9053\u5bf9\u8bdd\u62c6\u4e3a\u540c\u6b65\u5206\u8f68\uff0c\u4fdd\u7559\u91cd\u53e0\u4e0e\u77ed\u56de\u5e94\uff0c\u52a9\u529b\u5168\u53cc\u5de5\u8bad\u7ec3\u3002", "upvotes": 3, "what_it_is": "Kezek\u5148\u7528\u76f8\u4f4d\u4e0d\u654f\u611f\u7684\u8bf4\u8bdd\u4eba\u6307\u7eb9\u6307\u5bfc\u53cc\u58f0\u6d3b\u52a8\u6a21\u578b\uff0c\u7edf\u4e00\u786e\u5b9a\u5168\u7a0b\u8eab\u4efd\u4e0e\u53d1\u58f0\u65f6\u6bb5\uff1b\u518d\u7531\u6761\u4ef6\u65f6\u57df\u5206\u79bb\u5668\u751f\u6210\u7b49\u957f\u53cc\u8f68\uff0c\u4e14\u8f93\u51fa\u4e4b\u548c\u59cb\u7ec8\u7b49\u4e8e\u8f93\u5165\u3002", "why_notable": "\u4e3a\u73b0\u6709\u5355\u58f0\u9053\u5bf9\u8bdd\u8f6c\u5316\u4e3a\u5168\u53cc\u5de5\u8bad\u7ec3\u6570\u636e\u63d0\u4f9b\u5b9e\u7528\u5de5\u5177\uff0c\u5e76\u7528\u77ed\u56de\u5e94\u3001\u6cc4\u6f0f\u548c\u6362\u8f68\u6307\u6807\u8bc4\u4f30\u771f\u5b9e\u53ef\u7528\u6027\uff1b\u4ee3\u7801\u4e0e\u6743\u91cd\u5bbd\u677e\u8bb8\u53ef\u5f00\u653e\u3002"}, {"abstract": "Generating physically based rendering (PBR) texture maps for a 3D mesh from a single reference image is highly ambiguous, as the observed appearance entangles material identity, surface reflectance, and illumination. While current generative methods produce realistic albedo maps, they still struggle to infer accurate metallic and roughness attributes for relighting. We present UltraTex, a cascaded multi-view framework that moves beyond appearance matching by integrating physical knowledge into multi-view diffusion-based PBR generation. UltraTex first jointly predicts albedo and world-space shading normals to generate more detailed albedo maps, and then predicts metallic-roughness (MR) maps conditioned on the generated albedo, reference image, and material semantic priors. To inject material semantics, a lightweight adapter transforms hidden-layer features of a vision-language model (VLM) into intrinsic material representation tokens, providing part-level knowledge anchors for MR estimation. To model material-light interaction, photometric representation alignment guides intermediate diffusion features toward ground-truth material renderings under controlled lighting. This makes metallic and roughness variations observable through highlight intensity, specular sharpness, and local reflectance contrast, providing stronger guidance for fine-grained material prediction without explicit lighting supervision. Extensive experiments show that UltraTex generates high-quality textures and outperforms existing open-source and commercial methods in visual fidelity, material accuracy, and physical plausibility.", "arxiv_id": "2611.24941", "arxiv_url": "https://arxiv.org/abs/2611.24941", "authors": ["Jingzhi Bao", "Xiaohe Ma", "Hong Li", "Yuanming Hu", "Xiaoguang Han"], "brief": "UltraTex\u91c7\u7528\u7ea7\u8054\u591a\u89c6\u89d2\u6269\u6563\uff0c\u5148\u8054\u5408\u751f\u6210\u53cd\u7167\u7387\u548c\u4e16\u754c\u7a7a\u95f4\u7740\u8272\u6cd5\u7ebf\uff0c\u518d\u9884\u6d4b\u91d1\u5c5e\u5ea6\u4e0e\u7c97\u7cd9\u5ea6\uff0c\u5e76\u4ee5\u6750\u8d28\u8bed\u4e49\u5148\u9a8c\u548c\u53d7\u63a7\u5149\u7167\u6e32\u67d3\u7279\u5f81\u7ea6\u675f\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24941", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8054\u5408\u9884\u6d4b\u53cd\u7167\u7387\u4e0e\u4e16\u754c\u7a7a\u95f4\u7740\u8272\u6cd5\u7ebf\uff0c\u589e\u5f3a\u7eb9\u7406\u7ec6\u8282", "\u8f7b\u91cf\u9002\u914d\u5668\u5c06VLM\u9690\u85cf\u7279\u5f81\u8f6c\u4e3a\u90e8\u4ef6\u7ea7\u6750\u8d28\u8868\u5f81", "\u5149\u5ea6\u8868\u5f81\u5bf9\u9f50\u4ee5\u53d7\u63a7\u5149\u7167\u6e32\u67d3\u6307\u5bfc\u91d1\u5c5e\u5ea6\u4e0e\u7c97\u7cd9\u5ea6"], "keywords": ["\u7eb9\u7406\u751f\u6210", "\u7269\u7406\u6e32\u67d3", "\u6269\u6563\u6a21\u578b", "\u6750\u8d28\u4f30\u8ba1"], "num_comments": 2, "on_hf": true, "organization": "Meshy", "pdf_url": "https://arxiv.org/pdf/2611.24941v1", "published_at": "2026-11-18", "score": 0.229, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24941.png", "title": "UltraTex: Aligning Physical Knowledge for High-Fidelity PBR Texture Generation", "tldr": "\u901a\u8fc7\u6750\u8d28\u8bed\u4e49\u4e0e\u5149\u5ea6\u8868\u5f81\u5bf9\u9f50\uff0c\u4ece\u5355\u5f20\u53c2\u8003\u56fe\u751f\u6210\u66f4\u53ef\u4fe1\u7684\u4e09\u7ef4\u7269\u7406\u6750\u8d28\u8d34\u56fe\u3002", "upvotes": 5, "what_it_is": "UltraTex\u91c7\u7528\u7ea7\u8054\u591a\u89c6\u89d2\u6269\u6563\uff0c\u5148\u8054\u5408\u751f\u6210\u53cd\u7167\u7387\u548c\u4e16\u754c\u7a7a\u95f4\u7740\u8272\u6cd5\u7ebf\uff0c\u518d\u9884\u6d4b\u91d1\u5c5e\u5ea6\u4e0e\u7c97\u7cd9\u5ea6\uff0c\u5e76\u4ee5\u6750\u8d28\u8bed\u4e49\u5148\u9a8c\u548c\u53d7\u63a7\u5149\u7167\u6e32\u67d3\u7279\u5f81\u7ea6\u675f\u751f\u6210\u3002", "why_notable": "\u628a\u5916\u89c2\u62df\u5408\u63a8\u8fdb\u5230\u6750\u8d28\u7269\u7406\u5c5e\u6027\u63a8\u65ad\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u91cd\u5149\u7167\u53ef\u4fe1\u5ea6\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u89c6\u89c9\u8d28\u91cf\u3001\u6750\u8d28\u51c6\u786e\u6027\u4e0e\u7269\u7406\u5408\u7406\u6027\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002"}, {"abstract": "Large language models (LLMs) are increasingly deployed as autonomous shopping agents that process multimodal product listings (consisting of visual and text data) and recommend purchases on behalf of consumers. Naturally, one might assume that models with more thinking power would make higher-quality purchasing decisions. To test this belief, we ask two questions about such agents: does asking a model to think harder make it choose better products, and does the confidence it reports tell us the likelihood it may be wrong? We benchmark ten frontier models on three product-choice benchmarks built from WebShop, Amazon\u0027s SQID and Wayfair\u0027s WANDS platforms to see if LLMs with more thinking power actually make better-quality product purchase decisions. Across all three benchmarks, we found that increasing the thinking effort does not increase decision quality in a statistically meaningful way. The same change in thinking effort raises stated confidence at a statistically significant level, so extra thinking buys confidence rather than correctness. We also measure the calibration of these models (how well their reported confidence percentage matches their true correctness percentage) in these tasks and show that most models are not well-calibrated at every effort level. We also find that errors are strongly shared: when one model errs in a task, several others tend to err on that same task. Furthermore, on tasks where several models all err, a large number of them pick the same wrong product.", "arxiv_id": "2611.22033", "arxiv_url": "https://arxiv.org/abs/2611.22033", "authors": ["Adi Krishnamoorthy", "X. Y. Han"], "brief": "\u7814\u7a76\u7528\u4e09\u4e2a\u5e73\u53f0\u6784\u5efa\u5546\u54c1\u9009\u62e9\u57fa\u51c6\uff0c\u8bc4\u6d4b\u5341\u4e2a\u524d\u6cbf\u6a21\u578b\u5904\u7406\u56fe\u6587\u5546\u54c1\u4fe1\u606f\u7684\u8868\u73b0\u3002\u901a\u8fc7\u8c03\u6574\u63a8\u7406\u6295\u5165\uff0c\u6bd4\u8f83\u9009\u62e9\u6b63\u786e\u7387\u3001\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u53ca\u5176\u6821\u51c6\u7a0b\u5ea6\u3002", "categories": ["cs.AI", "cs.CL", "cs.CY", "cs.HC", "econ.GN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.22033", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8bc4\u6d4b10\u4e2a\u6a21\u578b\uff0c\u57fa\u51c6\u6765\u81eaWebShop\u3001SQID\u4e0eWANDS", "\u589e\u52a0\u63a8\u7406\u6295\u5165\u672a\u663e\u8457\u63d0\u5347\u51b3\u7b56\u8d28\u91cf\uff0c\u5374\u663e\u8457\u63d0\u9ad8\u7f6e\u4fe1\u5ea6", "\u591a\u6570\u6a21\u578b\u6821\u51c6\u4e0d\u4f73\uff0c\u591a\u6a21\u578b\u5e38\u5728\u540c\u9898\u9009\u4e2d\u540c\u4e00\u9519\u8bef\u5546\u54c1"], "keywords": ["\u8d2d\u7269\u667a\u80fd\u4f53", "\u63a8\u7406\u6295\u5165", "\u7f6e\u4fe1\u5ea6\u6821\u51c6", "\u591a\u6a21\u6001\u8bc4\u6d4b"], "num_comments": 4, "on_hf": true, "organization": "University of Chicago", "pdf_url": "https://arxiv.org/pdf/2611.22033v1", "published_at": "2026-11-17", "score": 0.227, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22033.png", "title": "Thinking Harder Doesn\u0027t Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents", "tldr": "\u8d2d\u7269\u667a\u80fd\u4f53\u589e\u52a0\u63a8\u7406\u6295\u5165\u672a\u663e\u8457\u6539\u5584\u9009\u62e9\uff0c\u5374\u663e\u8457\u63d0\u9ad8\u81ea\u4fe1\uff0c\u4e14\u9519\u8bef\u8d8b\u540c\u3002", "upvotes": 4, "what_it_is": "\u7814\u7a76\u7528\u4e09\u4e2a\u5e73\u53f0\u6784\u5efa\u5546\u54c1\u9009\u62e9\u57fa\u51c6\uff0c\u8bc4\u6d4b\u5341\u4e2a\u524d\u6cbf\u6a21\u578b\u5904\u7406\u56fe\u6587\u5546\u54c1\u4fe1\u606f\u7684\u8868\u73b0\u3002\u901a\u8fc7\u8c03\u6574\u63a8\u7406\u6295\u5165\uff0c\u6bd4\u8f83\u9009\u62e9\u6b63\u786e\u7387\u3001\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u53ca\u5176\u6821\u51c6\u7a0b\u5ea6\u3002", "why_notable": "\u7ed3\u679c\u6311\u6218\u4e86\u66f4\u591a\u63a8\u7406\u5fc5\u7136\u5e26\u6765\u66f4\u597d\u6d88\u8d39\u51b3\u7b56\u7684\u76f4\u89c9\uff0c\u4e5f\u63d0\u793a\u4e0d\u80fd\u4ec5\u51ed\u6a21\u578b\u81ea\u4fe1\u6216\u591a\u6a21\u578b\u4e00\u81f4\u6765\u5224\u65ad\u8d2d\u7269\u5efa\u8bae\u53ef\u9760\u6027\u3002"}, {"abstract": "In this paper, we propose a Unified Law for Visual Tasks, which could be further divided into Four Laws of Computer Vision, with the goal of enabling a single framework or method to uniformly train on and perform nearly all visual tasks. Our starting point is an inspiration and hypothesis: if the world information is encoded into image, which we call World Snapshots, then image processing is world processing, and image generation is World Snapshot generation. Furthermore, if all visual and visualization tasks can be reformulated as generation tasks, then a unified method, World Snapshot Models (WSMs), can perform the vast majority of visual tasks, much as large language models have largely unified natural language processing. This paper validates these laws across more than 1,000 trained and evaluated visual tasks (defined by distinct input-output mappings) and presents a unified training framework for future visual-task research and applications.", "arxiv_id": "2611.24917", "arxiv_url": "https://arxiv.org/abs/2611.24917", "authors": ["Sen Fang", "Yalin Feng", "Yancheng Zhang", "Yanxin Zhang", "Zonglin Lyu", "Hongbin Zhong", "Liwei Che", "Rui Wu", "Chen Chen", "Dimitris N. Metaxas"], "brief": "\u63d0\u51fa\u4e16\u754c\u5feb\u7167\u6a21\u578b\uff08WSMs\uff09\uff0c\u5c06\u56fe\u50cf\u89c6\u4e3a\u4e16\u754c\u4fe1\u606f\u7684\u7f16\u7801\uff0c\u628a\u89c6\u89c9\u53ca\u53ef\u89c6\u5316\u4efb\u52a1\u6539\u5199\u4e3a\u751f\u6210\u4efb\u52a1\uff0c\u4ee5\u5355\u4e00\u6846\u67b6\u7edf\u4e00\u8bad\u7ec3\u548c\u6267\u884c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/World-Snapshot/WSMs", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.24917", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["World Snapshots\uff1a\u4ee5\u56fe\u50cf\u7f16\u7801\u4e16\u754c\u4fe1\u606f", "WSMs\uff1a\u5c06\u89c6\u89c9\u4e0e\u53ef\u89c6\u5316\u4efb\u52a1\u7edf\u4e00\u4e3a\u751f\u6210\u4efb\u52a1", "\u8bad\u7ec3\u5e76\u8bc4\u4f30\u8d85\u8fc71000\u79cd\u4e0d\u540c\u8f93\u5165\u8f93\u51fa\u6620\u5c04"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u56fe\u50cf\u751f\u6210", "\u591a\u4efb\u52a1\u5b66\u4e60", "\u7edf\u4e00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "World Snapshot", "pdf_url": "https://arxiv.org/pdf/2611.24917v1", "published_at": "2026-11-18", "score": 0.224, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24917.png", "title": "Unified Law for Visual Tasks (The Four Laws of Computer Vision)", "tldr": "\u5c06\u89c6\u89c9\u4efb\u52a1\u7edf\u4e00\u6539\u5199\u4e3a\u56fe\u50cf\u751f\u6210\uff0c\u5e76\u5728\u5343\u4f59\u79cd\u8f93\u5165\u8f93\u51fa\u6620\u5c04\u4e0a\u9a8c\u8bc1\u6846\u67b6\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u4e16\u754c\u5feb\u7167\u6a21\u578b\uff08WSMs\uff09\uff0c\u5c06\u56fe\u50cf\u89c6\u4e3a\u4e16\u754c\u4fe1\u606f\u7684\u7f16\u7801\uff0c\u628a\u89c6\u89c9\u53ca\u53ef\u89c6\u5316\u4efb\u52a1\u6539\u5199\u4e3a\u751f\u6210\u4efb\u52a1\uff0c\u4ee5\u5355\u4e00\u6846\u67b6\u7edf\u4e00\u8bad\u7ec3\u548c\u6267\u884c\u3002", "why_notable": "\u5c1d\u8bd5\u4ee5\u751f\u6210\u8303\u5f0f\u6253\u901a\u5206\u6563\u7684\u89c6\u89c9\u4efb\u52a1\uff0c\u4e14\u9a8c\u8bc1\u8986\u76d6\u5343\u4f59\u79cd\u4efb\u52a1\uff0c\u4e3a\u901a\u7528\u89c6\u89c9\u6a21\u578b\u63d0\u4f9b\u7edf\u4e00\u8bad\u7ec3\u7684\u7814\u7a76\u8def\u5f84\u3002"}, {"abstract": "Large language models (LLMs) have renewed interest in Page Stream Segmentation (PSS), splitting a multi-page file into its constituent documents. Yet published LLM methods still frame the task as boundary classification over one or a few neighboring pages, and commercial document-splitting APIs do not disclose their methods. We reimagine PSS for LLMs as a sequential process over the whole stream and propose RICoT (Recurrent Interleaved Chain-of-Thought), a prompting framework that works through the pages as a reader would: within a sliding window it reasons about each page and commits its boundary decision before moving on, and across windows it carries forward a compact record of what it has read, keeping per-call cost bounded. We also introduce FinancePSS-205, a benchmark of 205 real-world, de-identified financial page streams, to be released publicly. On FinancePSS-205, RICoT matches or outperforms pairwise and windowed prompting with the same backbone for each of three open-weight LLMs; on a TABME test subset, RICoT with GLM-5 reaches document F1 0.847 and boundary F1 0.915, above published zero-shot results. A 2B-parameter student, trained on a larger teacher\u0027s decisions with and without the page-level reasoning, performs comparably in both modes and comes within 0.05 document F1 of the strongest prompted model on FinancePSS-205.", "arxiv_id": "2611.22382", "arxiv_url": "https://arxiv.org/abs/2611.22382", "authors": ["Prashant Khatri", "Bhavana Malagavalli", "Saiful Haq", "Niyati Chhaya"], "brief": "\u63d0\u51faRICoT\u63d0\u793a\u6846\u67b6\uff0c\u5c06\u591a\u9875\u6587\u4ef6\u5207\u5206\u5efa\u6a21\u4e3a\u987a\u5e8f\u9605\u8bfb\u8fc7\u7a0b\uff1a\u5728\u6ed1\u52a8\u7a97\u53e3\u5185\u9010\u9875\u63a8\u7406\u5e76\
