cf\u589e\u76ca\u5f88\u5c0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "User simulators offer a scalable way to evaluate interactive agents, but how to assess their quality remains underexplored. In particular, it is unclear whether existing user simulator evaluation frameworks reliably detect meaningful failures in simulated user behavior. This uncertainty makes it difficult to interpret simulator evaluation. To understand what a high benchmark score tells us about simulator quality, we (meta-)evaluate the metrics themselves. To instantiate this meta-evaluation, we deliberately perturb simulated replays to induce failures such as altered goals, omitted constraints, premature stopping, and acceptance of broken work, then test whether the metrics penalize these failures. Evaluation methods from three prior studies detect only 5-6 of the 10 perturbations; their combined scores even favor populations instructed to accept broken work over unmodified controls. Motivated by these gaps, we propose a new evaluation suite that combines utility of user simulators for evaluating agents and two measures of fidelity to real users: population-level fidelity assesses collective interaction patterns, while trace-level fidelity assesses the preservation of individual users\u0027 goals, constraints, and persona. Under the same detection criterion, our evaluation suite detects all 10 perturbations. Evaluating six user simulators on 351 real multi-turn sessions in which 348 distinct users across 23 languages and agents work together to create and refine artifacts such as full-stack web apps, games, design assets, and automated workflows, we find that population-level measures can miss when a simulated user pursues the wrong goal, ignores a constraint, or behaves out of character, highlighting the need to assess fidelity at comprehensive granularities.", "arxiv_id": "2611.24892", "arxiv_url": "https://arxiv.org/abs/2611.24892", "authors": ["Hengguang Zhou", "I-Hung Hsu", "Li Chen", "Priyanshi Shrivastava", "Anastasios Angelopoulos", "Wei-Lin Chiang", "Ion Stoica", "Cho-Jui Hsieh"], "brief": "\u901a\u8fc7\u4eba\u4e3a\u6ce8\u5165\u7528\u6237\u884c\u4e3a\u504f\u5dee\uff0c\u53d1\u73b0\u65e2\u6709\u6a21\u62df\u5668\u8bc4\u4f30\u4ec5\u8bc6\u522b\u5341\u7c7b\u5931\u6548\u4e2d\u7684\u4e94\u81f3\u516d\u7c7b\uff1b\u65b0\u65b9\u6848\u7ed3\u5408\u8bc4\u4f30\u6548\u7528\u3001\u7fa4\u4f53\u4e0e\u8f68\u8ff9\u4fdd\u771f\u5ea6\uff0c\u8bc6\u522b\u5168\u90e8\u5341\u7c7b\u5931\u6548\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24892", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7528\u6237\u6a21\u62df", "\u4ea4\u4e92\u667a\u80fd\u4f53", "\u8bc4\u4f30\u6307\u6807", "\u884c\u4e3a\u4fdd\u771f\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24892v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "On Evaluating User Simulators for Interactive Agents", "tldr": "\u901a\u8fc7\u4eba\u4e3a\u6ce8\u5165\u7528\u6237\u884c\u4e3a\u504f\u5dee\uff0c\u53d1\u73b0\u65e2\u6709\u6a21\u62df\u5668\u8bc4\u4f30\u4ec5\u8bc6\u522b\u5341\u7c7b\u5931\u6548\u4e2d\u7684\u4e94\u81f3\u516d\u7c7b\uff1b\u65b0\u65b9\u6848\u7ed3\u5408\u8bc4\u4f30\u6548\u7528\u3001\u7fa4\u4f53\u4e0e\u8f68\u8ff9\u4fdd\u771f\u5ea6\uff0c\u8bc6\u522b\u5168\u90e8\u5341\u7c7b\u5931\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visualizing intermediate representations could help us inspect the reasoning steps underlying a model output. Unified multimodal models offer this opportunity by combining understanding and generation in one architecture. Their image generators can access representations formed while processing text. We introduce the V-lens, which uses this connection to visualize a chosen token\u0027s hidden state without training a decoder. Across four diffusion-based and two purely autoregressive unified models, the resulting images reveal key intermediate concepts that connect a question to its answer even when the concepts are never named explicitly. Controlled tests show how this content changes with context, token position, and depth. We then introduce lens tuning, which supervises selected hidden states with pictures through the V-lens. Across BAGEL, SenseNova-U1, and HunyuanImage-3.0, the rate of correct visualizations of pronoun referents rises from 2-11% to 86-94%. Surprisingly, such visual supervision also improves text answers without supervising the answer tokens directly. Code is available at https://github.com/multimodal-ai-lab/V-lens.", "arxiv_id": "2611.24793", "arxiv_url": "https://arxiv.org/abs/2611.24793", "authors": ["Tobias Braun", "Marcus Rohrbach", "Lorenzo Cavallaro"], "brief": "\u63d0\u51faV-lens\uff0c\u65e0\u9700\u8bad\u7ec3\u89e3\u7801\u5668\u5373\u53ef\u53ef\u89c6\u5316\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u9690\u542b\u6982\u5ff5\uff1b\u89c6\u89c9\u76d1\u7763\u5c06\u4ee3\u8bcd\u6307\u4ee3\u53ef\u89c6\u5316\u51c6\u786e\u7387\u63d0\u5347\u81f386\u201394%\uff0c\u5e76\u6539\u5584\u6587\u672c\u56de\u7b54\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24793", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u9690\u5c42\u8868\u5f81", "\u89c6\u89c9\u76d1\u7763"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24793v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Elephant in the Question: Unified Models Picture the Concepts Behind Their Answers", "tldr": "\u63d0\u51faV-lens\uff0c\u65e0\u9700\u8bad\u7ec3\u89e3\u7801\u5668\u5373\u53ef\u53ef\u89c6\u5316\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u9690\u542b\u6982\u5ff5\uff1b\u89c6\u89c9\u76d1\u7763\u5c06\u4ee3\u8bcd\u6307\u4ee3\u53ef\u89c6\u5316\u51c6\u786e\u7387\u63d0\u5347\u81f386\u201394%\uff0c\u5e76\u6539\u5584\u6587\u672c\u56de\u7b54\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Muon updates each hidden weight matrix along the polar factor of its momentum, the steepest-descent direction under the spectral norm. That choice fixes two allocations without consulting the loss: every singular direction of the momentum receives the same step, and in a non-square matrix each neuron\u0027s step is set by its leverage score. Whether they are good is a question about curvature, which steepest-descent arguments do not answer; we measure it. Using held-out gradients and Hessian-vector products, we decompose Muon\u0027s step by singular-value band and by neuron group and compute each group\u0027s second-order optimal multiplier. In a 124M-parameter decoder trained on FineWeb-Edu, the multipliers rise monotonically from the top singular directions to the tail: Muon over-steps the high-curvature top of its spectrum. We prove in Lean when such a diagnostic licenses an intervention at Muon\u0027s own update norm. On the measured curvature, the criterion predicts, and held-out losses confirm, that moving step length off the top helps mid-training and early in the cooldown, but not at its end. We then test interventions under per-step norm matching, tuned baselines and paired seeds. Orthogonalizing Q, K and V separately rather than as one fused matrix lowers the loss by 0.0250 nats and accounts for all of the gain of block-wise variants. A matmul-only, rotation-equivariant spectral tilt $\u03c3^{-1/4}$ applied in the cooldown lowers the loss of this stronger baseline by a further 0.0120 nats, additively with NorMuon (0.0158 nats together, three seeds; the baseline needs about 4.3% more tokens to match), and by 0.0188 nats at 355M parameters (three seeds). Energy-matched Schatten-1 weight decay adds a further 0.0052 nats. Geometrically principled changes that do not act on the measured miscalibration, namely exact polar factors, steepest-descent input whitening and top-heavy decay, do not help.", "arxiv_id": "2611.24644", "arxiv_url": "https://arxiv.org/abs/2611.24644", "authors": ["Biswa Sengupta", "Jinhua Wang", "L\u00e9o Maxime Brunswic"], "brief": "\u7814\u7a76\u53d1\u73b0Muon\u5bf9\u9ad8\u66f2\u7387\u5947\u5f02\u65b9\u5411\u6b65\u957f\u8fc7\u5927\uff1b\u5206\u5f00\u6b63\u4ea4\u5316\u6ce8\u610f\u529b\u77e9\u9635\u5e76\u91cd\u5206\u914d\u8c31\u65b9\u5411\u6b65\u957f\u53ef\u964d\u4f4e\u8bed\u8a00\u6a21\u578b\u635f\u5931\uff0c\u57fa\u7ebf\u9700\u591a\u7528\u7ea64.3%\u6570\u636e\u624d\u80fd\u8ffd\u5e73\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24644", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f18\u5316\u5668", "\u66f2\u7387\u5206\u6790", "\u8bed\u8a00\u6a21\u578b\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24644v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Equal Steps, Unequal Curvature: Where Muon\u0027s Update Goes Wrong", "tldr": "\u7814\u7a76\u53d1\u73b0Muon\u5bf9\u9ad8\u66f2\u7387\u5947\u5f02\u65b9\u5411\u6b65\u957f\u8fc7\u5927\uff1b\u5206\u5f00\u6b63\u4ea4\u5316\u6ce8\u610f\u529b\u77e9\u9635\u5e76\u91cd\u5206\u914d\u8c31\u65b9\u5411\u6b65\u957f\u53ef\u964d\u4f4e\u8bed\u8a00\u6a21\u578b\u635f\u5931\uff0c\u57fa\u7ebf\u9700\u591a\u7528\u7ea64.3%\u6570\u636e\u624d\u80fd\u8ffd\u5e73\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion models have transformed generative modeling through their ability to capture and generate samples from complex data distributions. This success has spurred substantial interest in using pretrained diffusion models as expressive priors for highly ill-posed inverse problems in imaging and sensing. Despite strong empirical performance, theoretical understanding of this approach remains limited: existing guarantees are often asymptotic or entail prohibitive computational costs in the worst case. In this paper, we address this gap by studying sparse recovery from a small number of linear measurements, a classical problem in compressed sensing. We show that, given an accurate diffusion model capturing a sparsity-promoting Bernoulli-Gaussian prior, a likelihood-guided annealed Langevin sampler provably recovers the sparse signal in polynomial time with near-optimal sample complexity for a broad family of random and deterministic sensing matrices. When the signal is indeed drawn from the postulated prior, we further establish total variation guarantees for posterior sampling after a final denoising step. These results lay a theoretical foundation for statistically and computationally efficient inverse solvers with diffusion priors.", "arxiv_id": "2611.24602", "arxiv_url": "https://arxiv.org/abs/2611.24602", "authors": ["Ivan Lee", "Xingyu Xu", "Yuejie Chi"], "brief": "\u7814\u7a76\u6269\u6563\u6a21\u578b\u4f5c\u4e3a\u7a00\u758f\u6062\u590d\u5148\u9a8c\uff0c\u8bc1\u660e\u4f3c\u7136\u5f15\u5bfc\u91c7\u6837\u53ef\u5728\u591a\u9879\u5f0f\u65f6\u95f4\u5185\u4ee5\u8fd1\u6700\u4f18\u6d4b\u91cf\u6570\u6062\u590d\u4fe1\u53f7\uff0c\u5e76\u5728\u5148\u9a8c\u5339\u914d\u65f6\u7ed9\u51fa\u540e\u9a8c\u91c7\u6837\u7684\u603b\u53d8\u5dee\u4fdd\u8bc1\u3002", "categories": ["stat.ML", "cs.IT", "cs.LG", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24602", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u7a00\u758f\u6062\u590d", "\u538b\u7f29\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24602v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Diffusion Models are Provably Efficient Priors for Sparse Recovery", "tldr": "\u7814\u7a76\u6269\u6563\u6a21\u578b\u4f5c\u4e3a\u7a00\u758f\u6062\u590d\u5148\u9a8c\uff0c\u8bc1\u660e\u4f3c\u7136\u5f15\u5bfc\u91c7\u6837\u53ef\u5728\u591a\u9879\u5f0f\u65f6\u95f4\u5185\u4ee5\u8fd1\u6700\u4f18\u6d4b\u91cf\u6570\u6062\u590d\u4fe1\u53f7\uff0c\u5e76\u5728\u5148\u9a8c\u5339\u914d\u65f6\u7ed9\u51fa\u540e\u9a8c\u91c7\u6837\u7684\u603b\u53d8\u5dee\u4fdd\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
