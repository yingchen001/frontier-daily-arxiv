u786e\u5b9a\u8fb9\u754c\uff0c\u8de8\u7a97\u53e3\u4f20\u9012\u7d27\u51d1\u8bb0\u5f55\uff0c\u4f7f\u5355\u6b21\u8c03\u7528\u6210\u672c\u4fdd\u6301\u6709\u754c\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.22382", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["FinancePSS-205\u5305\u542b205\u4e2a\u771f\u5b9e\u8131\u654f\u91d1\u878d\u6587\u6863\u6d41", "GLM-5\u5728TABME\u5b50\u96c6\u83b7\u6587\u6863F1 0.847", "2B\u5b66\u751f\u8ddd\u6700\u5f3a\u63d0\u793a\u6a21\u578b\u7684\u6587\u6863F1\u4e0d\u8db30.05"], "keywords": ["\u6587\u6863\u5207\u5206", "\u601d\u7ef4\u94fe", "\u77e5\u8bc6\u84b8\u998f", "\u91d1\u878d\u6587\u6863"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.22382v1", "published_at": "2026-11-17", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22382.png", "title": "RICoT: Recurrent Interleaved Chain-of-Thought for Page Stream Segmentation", "tldr": "\u901a\u8fc7\u9010\u9875\u63a8\u7406\u4e0e\u8de8\u7a97\u53e3\u8bb0\u5fc6\u5207\u5206\u6587\u6863\u6d41\uff0c\u5e76\u5c06\u6559\u5e08\u51b3\u7b56\u84b8\u998f\u81f3\u5c0f\u6a21\u578b\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51faRICoT\u63d0\u793a\u6846\u67b6\uff0c\u5c06\u591a\u9875\u6587\u4ef6\u5207\u5206\u5efa\u6a21\u4e3a\u987a\u5e8f\u9605\u8bfb\u8fc7\u7a0b\uff1a\u5728\u6ed1\u52a8\u7a97\u53e3\u5185\u9010\u9875\u63a8\u7406\u5e76\u786e\u5b9a\u8fb9\u754c\uff0c\u8de8\u7a97\u53e3\u4f20\u9012\u7d27\u51d1\u8bb0\u5f55\uff0c\u4f7f\u5355\u6b21\u8c03\u7528\u6210\u672c\u4fdd\u6301\u6709\u754c\u3002", "why_notable": "\u5c06\u5c40\u90e8\u8fb9\u754c\u5224\u65ad\u6539\u4e3a\u6709\u8bb0\u5fc6\u7684\u987a\u5e8f\u5904\u7406\uff0c\u5728\u4e09\u79cd\u5f00\u653e\u6743\u91cd\u6a21\u578b\u4e0a\u8868\u73b0\u7a33\u5b9a\uff1b\u84b8\u998f\u7ed3\u679c\u663e\u793a\u5c0f\u6a21\u578b\u4e5f\u80fd\u63a5\u8fd1\u5f3a\u63d0\u793a\u6a21\u578b\u3002"}, {"abstract": "Deep models often rely on spurious correlations that fail on underrepresented groups. Existing methods either correct human-specified bias attributes or infer unknown biases from the learned representation space. However, annotated attributes may differ from the shortcuts actually used by a model, while a single representation provides incomplete and potentially noisy evidence. Our key insight is that a bias obscured in one feature space may be clearer in another. In this work, we propose CHORD (Cross-view Harmonic Outlier Reversal for Debiasing), a multi-view framework that allows samples to \"sing in chorus\" across diverse representation spaces to achieve robust cross-view consensus. CHORD aggregates aggregates within-class partitions in each view, which is a proxy for specifying candidate biases, to debias the target representation and classifier without bias supervision. Experiments on seven benchmarks across vision, language, speech, and medical imaging show consistent improvements in worst-group accuracy. Code and checkpoints are available at https://github.com/davelee-uestc/chord_debiasing_public .", "arxiv_id": "2611.22668", "arxiv_url": "https://arxiv.org/abs/2611.22668", "authors": ["Weiwei Li", "Junzhuo Liu", "Tong Chu", "Hengfu Yu", "Yinjie Lei", "Wen Li"], "brief": "\u63d0\u51faCHORD\uff0c\u901a\u8fc7\u591a\u8868\u5f81\u7a7a\u95f4\u7684\u7c7b\u5185\u5212\u5206\u5f62\u6210\u8de8\u89c6\u56fe\u5171\u8bc6\uff0c\u65e0\u9700\u504f\u5dee\u6807\u6ce8\u5373\u53ef\u53bb\u9664\u4f2a\u76f8\u5173\uff1b\u5728\u89c6\u89c9\u3001\u8bed\u8a00\u7b49\u4e03\u4e2a\u57fa\u51c6\u4e0a\u6301\u7eed\u63d0\u5347\u6700\u5dee\u7fa4\u4f53\u51c6\u786e\u7387\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/davelee-uestc/chord_debiasing_public", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.22668", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f2a\u76f8\u5173", "\u591a\u89c6\u56fe\u5b66\u4e60", "\u6a21\u578b\u53bb\u504f", "\u9c81\u68d2\u6027"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.22668v1", "published_at": "2026-11-17", "score": 0.047, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22668.png", "title": "Let Samples Sing in Chorus: Mitigating Spurious Correlations via Cross-view Consensus", "tldr": "\u63d0\u51faCHORD\uff0c\u901a\u8fc7\u591a\u8868\u5f81\u7a7a\u95f4\u7684\u7c7b\u5185\u5212\u5206\u5f62\u6210\u8de8\u89c6\u56fe\u5171\u8bc6\uff0c\u65e0\u9700\u504f\u5dee\u6807\u6ce8\u5373\u53ef\u53bb\u9664\u4f2a\u76f8\u5173\uff1b\u5728\u89c6\u89c9\u3001\u8bed\u8a00\u7b49\u4e03\u4e2a\u57fa\u51c6\u4e0a\u6301\u7eed\u63d0\u5347\u6700\u5dee\u7fa4\u4f53\u51c6\u786e\u7387\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Anomaly detection (AD) is often framed as a representation-learning problem, where strong performance is expected to require learned features or AD-specific optimization. However, this view can overlook the intrinsic separability of anomalies from normal references, even in the absence of learned representations. We therefore investigate how far untrained neural networks can go in anomaly detection. To this end, we propose PRISM, a framework combining fixed random nonlinear features with normal-reference Mahalanobis scoring for tabular detection and dense visual localization. Across 47 tabular datasets in ADBench, PRISM-T achieves the highest mean AUROC (86.4%) and the second-highest mean AUPRC (65.9%) among the compared methods. On MVTec AD and VisA, covering 27 visual categories, PRISM-V achieves mean image-level and pixel-level AUROCs of 90.4% and 96.4%, respectively. Notably, both models achieve these results without neural weight optimization or pretrained representations. A theoretical analysis further characterizes how nonlinear transformations affect the mean and covariance contributions to the Mahalanobis score gap, while empirical analyses examine the resulting score separability. These findings establish PRISM as both a competitive anomaly detector and a prior-to-learning baseline for assessing the added value of learned representations in anomaly detection.", "arxiv_id": "2611.08136", "arxiv_url": "https://arxiv.org/abs/2611.08136", "authors": ["Hyojun Yi", "Geunyoung Kim", "Hogeon Seo", "Seunghyoung Ryu"], "brief": "PRISM\u7ed3\u5408\u56fa\u5b9a\u968f\u673a\u975e\u7ebf\u6027\u7279\u5f81\u4e0e\u9a6c\u6c0f\u8ddd\u79bb\u8bc4\u5206\uff0c\u65e0\u9700\u8bad\u7ec3\u6216\u9884\u8bad\u7ec3\u5373\u53ef\u68c0\u6d4b\u5f02\u5e38\uff1b\u572847\u4e2a\u8868\u683c\u6570\u636e\u96c6\u4e0a\u5e73\u5747AUROC\u9886\u5148\uff0c\u89c6\u89c9\u5f02\u5e38\u5b9a\u4f4d\u4e5f\u5177\u7ade\u4e89\u529b\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": "https://github.com/ideal-lab-sejong/PRISM_T", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08136", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f02\u5e38\u68c0\u6d4b", "\u968f\u673a\u7279\u5f81", "\u8868\u683c\u6570\u636e", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 1, "on_hf": true, "organization": "Sejong IDEAL Lab", "pdf_url": "https://arxiv.org/pdf/2611.08136v2", "published_at": "2026-11-05", "score": 0.046, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08136.png", "title": "How Far Can Untrained Neural Networks Go in Anomaly Detection? From Tables to Pixels", "tldr": "PRISM\u7ed3\u5408\u56fa\u5b9a\u968f\u673a\u975e\u7ebf\u6027\u7279\u5f81\u4e0e\u9a6c\u6c0f\u8ddd\u79bb\u8bc4\u5206\uff0c\u65e0\u9700\u8bad\u7ec3\u6216\u9884\u8bad\u7ec3\u5373\u53ef\u68c0\u6d4b\u5f02\u5e38\uff1b\u572847\u4e2a\u8868\u683c\u6570\u636e\u96c6\u4e0a\u5e73\u5747AUROC\u9886\u5148\uff0c\u89c6\u89c9\u5f02\u5e38\u5b9a\u4f4d\u4e5f\u5177\u7ade\u4e89\u529b\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Language models acquire their capabilities from training data, and developers withhold data during training to keep models from learning capabilities that could be misused. How long this delays a capability, and how much data is needed to acquire it later, is unknown. Here we show that the general progress a model makes on the rest of its training data substitutes for the data that was withheld. We withheld the training signal for individual skills in models of chess, Othello, molecular strings, bracket languages and web text. The delay of a withheld skill in larger models was predicted from smaller ones. A chess model never explicitly trained to respond to check ranked the legal responses almost as well as a model that was. When models were then trained on the withheld data, they acquired the skill with a small fraction of the data needed from initialization, and this fraction decreased as the models progressed. A control rule of equal difficulty was learned much more slowly. A programming language withheld from the training text of a 7-billion-parameter model was regained in the same way. Data filtering therefore delays a capability, and the data required to regain it decreases as models improve.", "arxiv_id": "2611.24844", "arxiv_url": "https://arxiv.org/abs/2611.24844", "authors": ["Mark Marosi", "Peter Antal"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u6a21\u578b\u5728\u5176\u4ed6\u6570\u636e\u4e0a\u7684\u8bad\u7ec3\u8fdb\u6b65\u53ef\u66ff\u4ee3\u88ab\u5254\u9664\u7684\u7279\u5b9a\u6280\u80fd\u6570\u636e\uff1b\u6570\u636e\u8fc7\u6ee4\u4ec5\u5ef6\u7f13\u80fd\u529b\u5f62\u6210\uff0c\u6a21\u578b\u8d8a\u5f3a\uff0c\u6062\u590d\u8be5\u80fd\u529b\u6240\u9700\u7684\u6570\u636e\u8d8a\u5c11\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/Mapika/progress-substitutes-data", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24844", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6570\u636e\u8fc7\u6ee4", "\u6280\u80fd\u5b66\u4e60", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24844v1", "published_at": "2026-11-18", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24844.png", "title": "General progress substitutes for specific training data in language models", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u6a21\u578b\u5728\u5176\u4ed6\u6570\u636e\u4e0a\u7684\u8bad\u7ec3\u8fdb\u6b65\u53ef\u66ff\u4ee3\u88ab\u5254\u9664\u7684\u7279\u5b9a\u6280\u80fd\u6570\u636e\uff1b\u6570\u636e\u8fc7\u6ee4\u4ec5\u5ef6\u7f13\u80fd\u529b\u5f62\u6210\uff0c\u6a21\u578b\u8d8a\u5f3a\uff0c\u6062\u590d\u8be5\u80fd\u529b\u6240\u9700\u7684\u6570\u636e\u8d8a\u5c11\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Adapting a film into a game requires selecting source elements and translating them into player actions, rules, and feedback. We introduce Movie2Game-Bench (M2G-bench), a benchmark for evaluating film-to-game adaptation beyond playability. M2G-bench combines general evaluation, movie-specific evaluation, and playtesting by three GUI model players. The protocol connects source content to gameplay steps and implementation evidence, capturing both content preservation and interactive realization. The benchmark comprises 22 films and 658 source-specific reference items. Evaluating 14 models on the same films with their selected primary harnesses reveals complementary strengths in game quality, adaptation, and player experience. A shared weakness concerns playable sequences: this category has the lowest content-presence mean in all 14 models, averaging 37.9 out of 100 compared with 54.8 for iconic elements. Among judgments of retained emotionaldevelopment content, narrative choices account for 60.0% and scenario operation for 7.2%. These findings identify two linked priorities for film-to-game adaptation: preserving source situations that can support gameplay and connecting retained content to player actions and consequences.", "arxiv_id": "2611.24669", "arxiv_url": "https://arxiv.org/abs/2611.24669", "authors": ["Jialing Xie", "Yifan Zhou", "Yiwen Zhang", "Junjun He"], "brief": "\u63d0\u51fa\u7535\u5f71\u6539\u7f16\u6e38\u620f\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7ed3\u5408\u5185\u5bb9\u4fdd\u7559\u3001\u4ea4\u4e92\u5b9e\u73b0\u4e0e\u8bd5\u73a9\u8bc4\u4f30\uff1b\u6d4b\u8bd514\u4e2a\u6a21\u578b\u53d1\u73b0\uff0c\u53ef\u73a9\u60c5\u8282\u4fdd\u7559\u6700\u5f31\uff0c\u539f\u4f5c\u5185\u5bb9\u4e0e\u73a9\u5bb6\u884c\u52a8\u7684\u8854\u63a5\u4e0d\u8db3\u3002", "categories": ["cs.AI", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24669", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6e38\u620f\u751f\u6210", "\u591a\u6a21\u6001\u8bc4\u6d4b", "\u4ea4\u4e92\u8bbe\u8ba1"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24669v1", "published_at": "2026-11-18", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24669.png", "title": "Movie2Game-Bench: Holistic Evaluation of Film-to-Game Adaptation Beyond Playability", "tldr": "\u63d0\u51fa\u7535\u5f71\u6539\u7f16\u6e38\u620f\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7ed3\u5408\u5185\u5bb9\u4fdd\u7559\u3001\u4ea4\u4e92\u5b9e\u73b0\u4e0e\u8bd5\u73a9\u8bc4\u4f30\uff1b\u6d4b\u8bd514\u4e2a\u6a21\u578b\u53d1\u73b0\uff0c\u53ef\u73a9\u60c5\u8282\u4fdd\u7559\u6700\u5f31\uff0c\u539f\u4f5c\u5185\u5bb9\u4e0e\u73a9\u5bb6\u884c\u52a8\u7684\u8854\u63a5\u4e0d\u8db3\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents are increasingly equipped with persistence toward task completion to run delegated work autonomously for long periods, under many unstated constraints from internal documents and other people\u0027s authority. When completion requires violating a rule, the agent must decide alone, yet benchmarks of instruction-rule conflicts state the rule in the prompt or keep it hidden and do not evaluate persistence. We present Unfinished-Bench, a benchmark that gives models persistence in autonomous runs without a user, in realistic work environments with embedded rules. In each of its 97 scenarios across 7 organizations and 7 risk categories, the goal and the rule cannot both hold. We find that persistence raised violations of a rule in an internal document from 32.2% to 43.6%, five times the 8.5% for the same rule stated by the user. Of the document-rule violations, 98.3% occurred after the rule was displayed, and in 89% of a judged sample the agent first wrote down the rule. Violations of rules placed in the environment without user oversight can lead to serious incidents, so persistence-driven risks need to be evaluated. Benchmark documentation: https://francis21c.github.io/unfinished-bench/", "arxiv_id": "2611.17460", "arxiv_url": "https://arxiv.org/abs/2611.17460", "authors": ["Seunghyun Lee", "Jaehui Hwang", "Dongyoon Han", "Sangdoo Yun"], "brief": "\u63d0\u51fa\u771f\u5b9e\u5de5\u4f5c\u73af\u5883\u4e0b\u7684\u667a\u80fd\u4f53\u89c4\u5219\u51b2\u7a81\u57fa\u51c6\uff0c\u53d1\u73b0\u6301\u7eed\u6267\u884c\u4f7f\u5185\u90e8\u6587\u6863\u89c4\u5219\u8fdd\u89c4\u7387\u4ece32.2%\u5347\u81f343.6%\uff0c\u4e14\u591a\u6570\u8fdd\u89c4\u53d1\u751f\u5728\u89c4\u5219\u5df2\u5c55\u793a\u540e\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/naver-ai/unfinished-bench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17460", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u89c4\u5219\u9075\u5faa", "\u81ea\u4e3b\u667a\u80fd\u4f53", "\u4eba\u5de5\u667a\u80fd\u5b89\u5168"], "num_comments": 1, "on_hf": true, "organization": "NAVER AI Lab", "pdf_url": "https://arxiv.org/pdf/2611.17460v1", "published_at": "2026-11-12", "score": 0.041, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17460.png", "title": "Unfinished-Bench: Measuring Rule Violations by Persistent Agents in Realistic Work Environments", "tldr": "\u63d0\u51fa\u771f\u5b9e\u5de5\u4f5c\u73af\u5883\u4e0b\u7684\u667a\u80fd\u4f53\u89c4\u5219\u51b2\u7a81\u57fa\u51c6\uff0c\u53d1\u73b0\u6301\u7eed\u6267\u884c\u4f7f\u5185\u90e8\u6587\u6863\u89c4\u5219\u8fdd\u89c4\u7387\u4ece32.2%\u5347\u81f343.6%\uff0c\u4e14\u591a\u6570\u8fdd\u89c4\u53d1\u751f\u5728\u89c4\u5219\u5df2\u5c55\u793a\u540e\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "A developer running a code assistant on a laptop downloads one model file, and local inference moves the energy of every request onto that machine. A common rule says a larger model at lower precision tends to beat a smaller one at higher precision. We ran 24 GGUF files of Qwen2.5-Coder at four sizes on a fanless MacBook Air M2 and priced each in energy per solved task on 542 EvalPlus tasks. The result is a selection guide indexed by Ollama\u0027s listed file size, with an evidence label on each pick. At 1 and 2 GB it picks the q4_K_M files of the 1.5B and 3B models, both on the correctness and energy frontier under every accounting. At 3 GB as listed, the larger-model rule picks 7B-q2_K, the only measured 7B file that fits, and there it does not pay. That file brings no significant gain in solves over the 2 GB pick, 3B-q4_K_M, and the 90% CI limits any 3B-q4_K_M deficit to 2.4 points. Yet 7B-q2_K needs 2.03 times the energy per solved task on CPU, GPU and memory rails, or 1.66 to 1.81 times on whole-system power. On HumanEval+, five alternating session pairs give a ratio of 1.925 against 1.956 in the main grid. At 8 GB, 7B-q6_K buys a significant gain over the 2 GB pick at a higher energy price. From 1.5B up, q4_K_M trails the highest precision measured at its size by less than 3 points (90% CI). We release per-task results, power logs and the analysis script.", "arxiv_id": "2611.17605", "arxiv_url": "https://arxiv.org/abs/2611.17605", "authors": ["Aditi Patodiya"], "brief": "\u5b9e\u6d4b24\u4e2a\u91cf\u5316\u4ee3\u7801\u6a21\u578b\uff0c\u6309\u6587\u4ef6\u5927\u5c0f\u4e0e\u6bcf\u89e3\u5bf9\u4efb\u52a1\u80fd\u8017\u7ed9\u51fa\u9009\u578b\u5efa\u8bae\uff1a3GB\u4f4e\u7cbe\u5ea6\u5927\u6a21\u578b\u8f832GB\u6a21\u578b\u65e0\u663e\u8457\u51c6\u786e\u7387\u6536\u76ca\uff0c\u80fd\u8017\u5374\u8fd1\u7ffb\u500d\u3002", "categories": ["cs.SE", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17605", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u4ee3\u7801\u751f\u6210", "\u80fd\u6548\u8bc4\u4f30", "\u6a21\u578b\u9009\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17605v1", "published_at": "2026-11-13", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17605.png", "title": "Choosing Quantized Code LLMs by File Size and Energy per Solved Task", "tldr": "\u5b9e\u6d4b24\u4e2a\u91cf\u5316\u4ee3\u7801\u6a21\u578b\uff0c\u6309\u6587\u4ef6\u5927\u5c0f\u4e0e\u6bcf\u89e3\u5bf9\u4efb\u52a1\u80fd\u8017\u7ed9\u51fa\u9009\u578b\u5efa\u8bae\uff1a3GB\u4f4e\u7cbe\u5ea6\u5927\u6a21\u578b\u8f832GB\u6a21\u578b\u65e0\u663e\u8457\u51c6\u786e\u7387\u6536\u76ca\uff0c\u80fd\u8017\u5374\u8fd1\u7ffb\u500d\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly used to infer psychological attributes, predict individual behaviour, and simulate human populations. However, despite generating plausible responses, they often misrepresent individuals and distort population statistics. Here we introduce Chiron, a foundation model to measure and predict human behaviour. We jointly fine-tune an LLM to represent psychological constructs, predict individual behaviour, and align population response distributions with human statistics. The training and evaluation data span 36 behavioural domains and 78 social science experiments, comprising 288,307 person records, 1,411,750 atomic behavioural decisions, and 99,953 psychometric assessments over 109 psychological constructs. In our evaluations, Chiron\u0027s psychological measurements agree more closely with human self-reports and exhibit fewer biases that undermine psychometric validity. It predicts individual behaviour more accurately than frontier LLMs (up to 28.4% relative improvement). In simulations of social science experiments, it more accurately captures the direction and magnitude of human experimental effects (82.2--94.3% lower effect-size estimation error). Together, these results establish Chiron as a unified computational instrument for measuring and predicting human behaviour.", "arxiv_id": "2611.24830", "arxiv_url": "https://arxiv.org/abs/2611.24830", "authors": ["Haoran Ye", "Tianrui Huo", "Hangzhen Li", "Xin Zhang", "Guojie Song"], "brief": "Chiron\u901a\u8fc7\u8054\u5408\u5fae\u8c03\u7edf\u4e00\u5fc3\u7406\u6d4b\u91cf\u3001\u4e2a\u4f53\u884c\u4e3a\u9884\u6d4b\u4e0e\u7fa4\u4f53\u5206\u5e03\u5bf9\u9f50\uff0c\u884c\u4e3a\u9884\u6d4b\u76f8\u5bf9\u63d0\u5347\u6700\u9ad828.4%\uff0c\u5b9e\u9a8c\u6548\u5e94\u4f30\u8ba1\u8bef\u5dee\u964d\u4f4e82.2%\u81f394.3%\u3002", "categories": ["cs.CL", "cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24830", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5fc3\u7406\u6d4b\u91cf", "\u884c\u4e3a\u9884\u6d4b", "\u4eba\u7fa4\u6a21\u62df"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24830v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Foundation Model to Measure and Predict Human Behaviour", "tldr": "Chiron\u901a\u8fc7\u8054\u5408\u5fae\u8c03\u7edf\u4e00\u5fc3\u7406\u6d4b\u91cf\u3001\u4e2a\u4f53\u884c\u4e3a\u9884\u6d4b\u4e0e\u7fa4\u4f53\u5206\u5e03\u5bf9\u9f50\uff0c\u884c\u4e3a\u9884\u6d4b\u76f8\u5bf9\u63d0\u5347\u6700\u9ad828.4%\uff0c\u5b9e\u9a8c\u6548\u5e94\u4f30\u8ba1\u8bef\u5dee\u964d\u4f4e82.2%\u81f394.3%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Neural networks trained on the same task develop related weight-space structures, yet remain distinguishable after learning. Do these differences merely reflect alternative solutions, or do they preserve information about individual learning histories? We tested whether final weights reveal initialization, task order, and earlier trajectory states. Training reorganized the ensemble: initial pairwise distances did not consistently predict final distances. Nevertheless, all 30 trained networks were correctly matched to their initial weights among ten candidates per dataset. Networks sharing an initialization also developed recognizable final hidden representations across different batch schedules, although direct comparisons with initial activity did not recover identity. Learning order remained readable as well. A linear probe decoded the order of two earlier tasks with 100% accuracy on 80 held-out networks after ten epochs of a common final task. Earlier intermediate weight states were partly predictable, but individual initial weights could not be reliably reconstructed. Final weights thus retain selective historical information rather than a complete trajectory record. Perturbed networks recovered classification performance without returning to their unperturbed training paths. This separation persisted across datasets, intervention times, and network layers. Moreover, 2,157 of 2,160 aligned endpoint pairs showed no positive loss barrier at sampled interpolation points, indicating low-loss connections between distinct solutions rather than convergence to one weight vector. Together, these findings show that a shared task constrains networks to related successful solutions without erasing their individual histories. Final weights reflect not only what a network has learned, but also where learning began and how it unfolded.", "arxiv_id": "2611.24782", "arxiv_url": "https://arxiv.org/abs/2611.24782", "authors": ["Patrick Krauss", "Achim Schilling", "Andreas Maier", "Thomas Kinfe", "Claus Metzner"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u795e\u7ecf\u7f51\u7edc\u6700\u7ec8\u6743\u91cd\u4fdd\u7559\u521d\u59cb\u5316\u4e0e\u4efb\u52a1\u987a\u5e8f\u7684\u53ef\u89e3\u7801\u75d5\u8ff9\uff0c\u4efb\u52a1\u987a\u5e8f\u8bc6\u522b\u7387\u8fbe100%\uff1b\u5171\u4eab\u4efb\u52a1\u4f7f\u89e3\u8d8b\u4e8e\u76f8\u5173\uff0c\u5374\u4e0d\u62b9\u53bb\u4e2a\u4f53\u5b66\u4e60\u5386\u53f2\u3002", "categories": ["cs.LG", "cs.AI", "q-bio.NC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24782", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u7f51\u7edc", "\u5b66\u4e60\u8f68\u8ff9", "\u5185\u90e8\u8868\u5f81", "\u635f\u5931\u666f\u89c2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24782v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Trajectories Leave Decodable Traces in Neural Network Weight Space and Internal Representations", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u795e\u7ecf\u7f51\u7edc\u6700\u7ec8\u6743\u91cd\u4fdd\u7559\u521d\u59cb\u5316\u4e0e\u4efb\u52a1\u987a\u5e8f\u7684\u53ef\u89e3\u7801\u75d5\u8ff9\uff0c\u4efb\u52a1\u987a\u5e8f\u8bc6\u522b\u7387\u8fbe100%\uff1b\u5171\u4eab\u4efb\u52a1\u4f7f\u89e3\u8d8b\u4e8e\u76f8\u5173\uff0c\u5374\u4e0d\u62b9\u53bb\u4e2a\u4f53\u5b66\u4e60\u5386\u53f2\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World models operate in a world they cannot fully observe. When a hidden disturbance, such as a current pushing a boat, changes the outcome of an action, a counterfactual question follows: what would have happened under a different action, subject to the same disturbance? Its answer separates bad decisions from bad luck. We prove that world models trained on factual transitions cannot answer it on their own, whatever their data or capacity. For many physical systems, the observed outcome and a simple property of the dynamics suffice: natura non facit saltus, nature makes no leaps. When actions and disturbances act as separate forces, their interaction is second-order in time, so the counterfactual outcome is, to first order, the observed outcome plus the difference between the world model\u0027s predictions under the alternative and factual actions. This yields a counterfactual world model with no counterfactual data, extra parameters, or retraining. For transitions of duration $h$, we prove an $O(h^2)$ bound on the counterfactual error relative to the disturbance variance, establish a matching minimax lower bound from unpaired factual data, and characterize failures at discontinuities, coordinate folds, and disturbances that scale the command. We validate these predictions from pixels with JEPA world models on frozen DINOv2 and masked autoencoder (MAE) encoders. On four rendered simulators, our approach improves counterfactual $R^2$ from $38$--$46\\%$ to $86$--$96\\%$ with the same world models; on a fifth, an underwater vehicle, it reaches $90$--$94\\%$ with sixteen times more factual data. Four further frozen encoders, DINOv3, SigLIP~2, CLIP and EVA-02, give $81$--$95\\%$ on the same simulators. In hindsight planning, it finds the action that would have reached the goal in $35$--$69\\%$ of events, against $14$--$23\\%$ for an oracle planner that knows the simulator but not the outcome.", "arxiv_id": "2611.24778", "arxiv_url": "https://arxiv.org/abs/2611.24778", "authors": ["Randall Balestriero", "Yann LeCun", "Kerda Varaku"], "brief": "\u63d0\u51fa\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u7684\u53cd\u4e8b\u5b9e\u4e16\u754c\u6a21\u578b\uff0c\u7528\u5b9e\u9645\u7ed3\u679c\u6821\u6b63\u66ff\u4ee3\u52a8\u4f5c\u9884\u6d4b\uff0c\u5e76\u8bc1\u660e\u4e8c\u9636\u8bef\u5dee\u754c\uff1b\u56db\u4e2a\u6a21\u62df\u5668\u4e2d\u53cd\u4e8b\u5b9e\u9884\u6d4bR\u00b2\u4ece38\u201346%\u5347\u81f386\u201396%\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV", "cs.RO", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24778", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u53cd\u4e8b\u5b9e\u63a8\u7406", "\u89c6\u89c9\u8868\u5f81", "\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24778v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Counterfactual World Models: JEPAs That Reason About \"What If\"", "tldr": "\u63d0\u51fa\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u7684\u53cd\u4e8b\u5b9e\u4e16\u754c\u6a21\u578b\uff0c\u7528\u5b9e\u9645\u7ed3\u679c\u6821\u6b63\u66ff\u4ee3\u52a8\u4f5c\u9884\u6d4b\uff0c\u5e76\u8bc1\u660e\u4e8c\u9636\u8bef\u5dee\u754c\uff1b\u56db\u4e2a\u6a21\u62df\u5668\u4e2d\u53cd\u4e8b\u5b9e\u9884\u6d4bR\u00b2\u4ece38\u201346%\u5347\u81f386\u201396%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agents that do science must choose informative experiments and reason from their results, but most discovery benchmarks cannot separate that skill from recall, unstated scoring rules or shortcut policies. We introduce Openhagen Worlds, a suite of 27 procedurally generated environments (some with finite truth spaces), from classic puzzles of experimental reasoning to simulator-grounded physics and chemistry, in which an agent runs experiments under a budget and commits an answer that a deterministic verifier checks against a hidden truth. Every observation states the complete scoring rule, and each of the 178 difficulty levels is calibrated: it is admitted only if, on 64 development instances, a scripted oracle succeeds on at least 0.75, the strongest plausible non-deductive policy on at most 0.25 and each gated shortcut on at most 0.35. The 92 core levels span all 27 families and are sized to train small models; the 86 frontier rungs extend the 15 discovery worlds with harder questions and with campaigns of three, five and eight or more committed stages on one hidden system. On the same 84 withheld frontier instances, one per family and rung, DeepSeek V4.1 Flash solves 32 at its default reasoning effort with 16,384 tokens per call and 57 at its maximum effort with up to 393,216 tokens per call (oracle: 79); the headroom that remains is largest in eight-stage campaigns. On-policy expert iteration gives a 9B model modest gains: its core-tier success on trained families rises from 0.090 to 0.148, partly through better action format, with no detectable loss on GPQA Diamond. A hosted service plays the core tier\u0027s withheld instances.", "arxiv_id": "2611.24711", "arxiv_url": "https://arxiv.org/abs/2611.24711", "authors": ["Alexander Boesgaard Lorup"], "brief": "\u63d0\u51fa27\u7c7b\u3001178\u7ea7\u7ecf\u6821\u51c6\u7684\u79d1\u5b66\u53d1\u73b0\u667a\u80fd\u4f53\u73af\u5883\uff0c\u4ee5\u9884\u7b97\u5185\u5b9e\u9a8c\u548c\u786e\u5b9a\u6027\u9a8c\u8bc1\u6392\u9664\u6377\u5f84\uff1b\u6d4b\u8bd5\u663e\u793a\u591a\u9636\u6bb5\u53d1\u73b0\u4ecd\u96be\uff0c9B\u6a21\u578b\u8bad\u7ec3\u540e\u5c0f\u5e45\u63d0\u5347\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24711", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u5b66\u53d1\u73b0", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u5b9e\u9a8c\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24711v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Openhagen Worlds: Calibrated Environments for Measuring and Training Scientific Discovery Agents", "tldr": "\u63d0\u51fa27\u7c7b\u3001178\u7ea7\u7ecf\u6821\u51c6\u7684\u79d1\u5b66\u53d1\u73b0\u667a\u80fd\u4f53\u73af\u5883\uff0c\u4ee5\u9884\u7b97\u5185\u5b9e\u9a8c\u548c\u786e\u5b9a\u6027\u9a8c\u8bc1\u6392\u9664\u6377\u5f84\uff1b\u6d4b\u8bd5\u663e\u793a\u591a\u9636\u6bb5\u53d1\u73b0\u4ecd\u96be\uff0c9B\u6a21\u578b\u8bad\u7ec3\u540e\u5c0f\u5e45\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Clover-35B-A3B-Preview (Clover), a mixture-of-experts diffusion language model with 35 billion total parameters and 3 billion activated parameters, supporting thinking-mode generation. Clover adapts Gated Delta Networks to block diffusion by combining recurrent memory of previously generated context with bidirectional softmax attention inside the current block. Historical memory readout competes with current-block tokens in a shared softmax, with learnable block-size calibration and a separate, zero-initialized right-context convolution branch. Clover leads the seven evaluated agent metrics, including 73.6 on SWE-bench Verified and 51.7 on Terminal-Bench 2.1. On internal agent workloads, it reaches a reported generation speed of 680 tokens/s using one NVIDIA GB300 GPU at BF16 precision and batch size one. We organize the evaluation around model quality, drafting and verification costs, and deployment under constrained memory. We also describe a decision-model variant that generates answers to related questions in one denoising pass. On an internal set of 500 groups, joint prediction raises question accuracy from 90.37% to 93.88% and all-correct group accuracy from 65.4% to 77.0%.", "arxiv_id": "2611.24636", "arxiv_url": "https://arxiv.org/abs/2611.24636", "authors": ["DiffuSpace Technical Team"], "brief": "\u63d0\u51fa\u7ed3\u5408\u5faa\u73af\u8bb0\u5fc6\u4e0e\u5757\u5185\u53cc\u5411\u6ce8\u610f\u529b\u7684\u6df7\u5408\u4e13\u5bb6\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u4e03\u9879\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e2d\u9886\u5148\uff1b\u5355\u5361\u751f\u6210\u8fbe\u6bcf\u79d2680\u8bcd\u5143\uff0c\u8054\u5408\u53bb\u566a\u9884\u6d4b\u4e5f\u63d0\u5347\u4e86\u95ee\u7b54\u51c6\u786e\u7387\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24636", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u667a\u80fd\u4f53", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24636v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Clover-35B-A3B-Preview Technical Report", "tldr": "\u63d0\u51fa\u7ed3\u5408\u5faa\u73af\u8bb0\u5fc6\u4e0e\u5757\u5185\u53cc\u5411\u6ce8\u610f\u529b\u7684\u6df7\u5408\u4e13\u5bb6\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u4e03\u9879\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e2d\u9886\u5148\uff1b\u5355\u5361\u751f\u6210\u8fbe\u6bcf\u79d2680\u8bcd\u5143\uff0c\u8054\u5408\u53bb\u566a\u9884\u6d4b\u4e5f\u63d0\u5347\u4e86\u95ee\u7b54\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chain-of-Thought (CoT) prompting improves the performance of Large Language Models by eliciting intermediate reasoning steps. However, CoT is far from perfect: on some tasks, models perform worse than with direct-answer prompting, and on others they generate a few hundred tokens to reach the correct answer. We start by labelling each CoT hidden state as recovering if patching it into the direct prompt yields the correct answer, and failed otherwise. A linear probe shows that the model encodes these two classes differently. We then show that the representation space of the direct prompt holds a direction for each question that leads the model, in a short generation, to the correct answer more often than CoT does. Specifically, we rotate the direct prompt\u0027s last hidden state once, before generation, towards a direction built for each question from its own recovering and failed states. Across 25 tasks, these directions raise the direct prompt\u0027s mean accuracy from $46\\%$ to $85\\%$ on LLaMA 3.1 8B (CoT: $69\\%$) and from $52\\%$ to $86\\%$ on Qwen 2.5 7B (CoT: $77\\%$), with a tenth of CoT\u0027s tokens. CoT is thus not the shortest route to this accuracy, and these directions can be used in future work to train models to align their states with them.", "arxiv_id": "2611.24598", "arxiv_url": "https://arxiv.org/abs/2611.24598", "authors": ["Houman Mehrafarin", "Ioannis Konstas"], "brief": "\u4ece\u6bcf\u9898\u601d\u7ef4\u94fe\u9690\u72b6\u6001\u6784\u9020\u89e3\u9898\u65b9\u5411\uff0c\u4e00\u6b21\u65cb\u8f6c\u76f4\u63a5\u63d0\u793a\u7684\u6700\u7ec8\u9690\u72b6\u6001\uff1b25\u9879\u4efb\u52a1\u51c6\u786e\u7387\u5347\u81f385%\u548c86%\uff0c\u8d85\u8fc7\u601d\u7ef4\u94fe\uff0c\u751f\u6210\u8bcd\u5143\u4ec5\u4e3a\u5176\u5341\u5206\u4e4b\u4e00\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24598", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u601d\u7ef4\u94fe", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9690\u72b6\u6001", "\u8868\u793a\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24598v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Chain-of-Thought Hidden States Reveal Task-Solving Directions for Direct Answers", "tldr": "\u4ece\u6bcf\u9898\u601d\u7ef4\u94fe\u9690\u72b6\u6001\u6784\u9020\u89e3\u9898\u65b9\u5411\uff0c\u4e00\u6b21\u65cb\u8f6c\u76f4\u63a5\u63d0\u793a\u7684\u6700\u7ec8\u9690\u72b6\u6001\uff1b25\u9879\u4efb\u52a1\u51c6\u786e\u7387\u5347\u81f385%\u548c86%\uff0c\u8d85\u8fc7\u601d\u7ef4\u94fe\uff0c\u751f\u6210\u8bcd\u5143\u4ec5\u4e3a\u5176\u5341\u5206\u4e4b\u4e00\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pre-trained models can read screens and reason about games, yet on an unfamiliar game, an agent still has to learn to play. We ask how an agent can self-improve on such a game from a few of its own attempts, in real-time visual games where the agent sees only the screen and the game keeps running while the agent thinks. We study two kinds of policy that can carry this improvement. In model as policy, a model selects actions during play; we adapt real-time chunking so that committed actions keep executing while the model reasons, and train a 2B controller for this interface. In code as policy, a model writes, tests, and revises a program between attempts, and the program acts during play. Across 170 GameWorld tasks, with at most eight one-minute executions per run, code as policy reaches 47.80% mean progress, against 30.90% for our trained controller, and leads in all five game categories. Improving the controller\u0027s weights on a single game, by contrast, yields only modest gains. These results favor letting a model think offline and storing what it learns in a program that acts in real time. Project repository: https://github.com/TabibitoQZP/SIGame", "arxiv_id": "2611.24590", "arxiv_url": "https://arxiv.org/abs/2611.24590", "authors": ["Zipeng Qiu", "Shusheng Xu", "Jiale Li", "Yukun Zhou", "Chenyue Li", "Wenshuang Li", "Tongkai Yang", "Binhang Yuan"], "brief": "\u8ba9\u6a21\u578b\u79bb\u7ebf\u7f16\u5199\u3001\u6d4b\u8bd5\u5e76\u6539\u8fdb\u7b56\u7565\u4ee3\u7801\uff0c\u518d\u5b9e\u65f6\u73a9\u6e38\u620f\uff1b\u5728170\u9879\u4efb\u52a1\u4e2d\u5e73\u5747\u8fdb\u5ea6\u8fbe47.80%\uff0c\u4f18\u4e8e\u8bad\u7ec3\u63a7\u5236\u5668\u768430.90%\uff0c\u4e14\u4e94\u7c7b\u6e38\u620f\u5747\u9886\u5148\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24590", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6e38\u620f\u667a\u80fd\u4f53", "\u81ea\u6211\u6539\u8fdb", "\u4ee3\u7801\u751f\u6210", "\u5b9e\u65f6\u51b3\u7b56"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24590v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Think Offline, Act in Real Time: Self-Improving Visual Game Agents through Code", "tldr": "\u8ba9\u6a21\u578b\u79bb\u7ebf\u7f16\u5199\u3001\u6d4b\u8bd5\u5e76\u6539\u8fdb\u7b56\u7565\u4ee3\u7801\uff0c\u518d\u5b9e\u65f6\u73a9\u6e38\u620f\uff1b\u5728170\u9879\u4efb\u52a1\u4e2d\u5e73\u5747\u8fdb\u5ea6\u8fbe47.80%\uff0c\u4f18\u4e8e\u8bad\u7ec3\u63a7\u5236\u5668\u768430.90%\uff0c\u4e14\u4e94\u7c7b\u6e38\u620f\u5747\u9886\u5148\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recursive self-improvement (RSI) is moving from the harness of prompts and tools around a base model toward the model itself. However, existing RSI still faces key challenges, including harness-bound gains that stay outside the base model, black-box supervision that reads only the model\u0027s outputs, and imprecise edits whose site and strength are fixed in advance. To address these challenges, we propose BaseRSI, a new paradigm of Recursive Harness Internalization: the base model improves its harness, then writes what the harness adds into its own weights through training-free edits, round after round on its own responses. To support this paradigm, we introduce ReGap, a mechanism that supervises every transformer block with the high-dimensional activation difference that the harness makes at that block alone, and updates the block\u0027s weights along this signal in a low-dimensional subspace. Building on this mechanism, we further propose ReKey, an algorithm that writes this signal by regression into a few key-value neurons of every block, and measures the site and strength of each edit on the model\u0027s own responses. Moreover, the base model fills every role of this recursion with forward passes alone, and its edits, written at different sites, compose in one checkpoint without refitting. Experimental results on ten visual reasoning benchmarks show that BaseRSI consistently improves a base vision-language model both in distribution and on held-out benchmarks. Our code is available at https://github.com/beita6969/BaseRSI.", "arxiv_id": "2611.24578", "arxiv_url": "https://arxiv.org/abs/2611.24578", "authors": ["Mingda Zhang", "Yuanhao Dong", "Qiang Huang", "Rui Qian", "Yanjin Li", "Zhenyu Liu", "Xiao Huang", "Zihao Yang", "Jian Wang", "Pinjia He", "Xiaoying Tang"], "brief": "BaseRSI\u901a\u8fc7\u514d\u8bad\u7ec3\u6743\u91cd\u7f16\u8f91\uff0c\u5c06\u63d0\u793a\u4e0e\u5de5\u5177\u6846\u67b6\u5e26\u6765\u7684\u589e\u76ca\u9012\u5f52\u5185\u5316\u5230\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u5728\u5341\u4e2a\u89c6\u89c9\u63a8\u7406\u57fa\u51c6\u53ca\u672a\u89c1\u57fa\u51c6\u4e0a\u5747\u53d6\u5f97\u63d0\u5347\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24578", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u9012\u5f52\u81ea\u6539\u8fdb", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u7f16\u8f91", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24578v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BaseRSI: Recursive Self-Improvement of a Base Vision-Language Model via Training-Free Harness Internalization", "tldr": "BaseRSI\u901a\u8fc7\u514d\u8bad\u7ec3\u6743\u91cd\u7f16\u8f91\uff0c\u5c06\u63d0\u793a\u4e0e\u5de5\u5177\u6846\u67b6\u5e26\u6765\u7684\u589e\u76ca\u9012\u5f52\u5185\u5316\u5230\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u5728\u5341\u4e2a\u89c6\u89c9\u63a8\u7406\u57fa\u51c6\u53ca\u672a\u89c1\u57fa\u51c6\u4e0a\u5747\u53d6\u5f97\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Building a small language model requires choosing which published improvements to combine. We compare five changes in the same model, using the same data and training budget. We test selected combinations and repeat each one with a second random seed. Mixture-of-experts layers, Muon optimisation and a Gated DeltaNet hybrid give the largest gains. Extra normalisation also helps, while an attention gate with a matched parameter budget adds little on average. The gains mostly combine, but small interactions between changes appear again in the repeated runs. Repetition also reveals benefits that an initial statistical estimate treated as noise. These findings apply to our small-model training setting; the expert models also have greater total capacity. The practical lesson is to test promising components together and repeat the comparisons before deciding which ones to keep.", "arxiv_id": "2611.24540", "arxiv_url": "https://arxiv.org/abs/2611.24540", "authors": ["Biswa Sengupta"], "brief": "\u5728\u76f8\u540c\u6570\u636e\u4e0e\u8bad\u7ec3\u9884\u7b97\u4e0b\uff0c\u91cd\u590d\u6bd4\u8f83\u5c0f\u8bed\u8a00\u6a21\u578b\u7684\u4e94\u9879\u6539\u8fdb\u53ca\u5176\u7ec4\u5408\u3002\u6df7\u5408\u4e13\u5bb6\u3001Muon\u548cDeltaNet\u6536\u76ca\u6700\u5927\uff0c\u591a\u6570\u589e\u76ca\u53ef\u53e0\u52a0\uff0c\u91cd\u590d\u5b9e\u9a8c\u4e5f\u63ed\u793a\u4e86\u7ec6\u5fae\u4ea4\u4e92\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24540", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5c0f\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u67b6\u6784", "\u8bad\u7ec3\u4f18\u5316", "\u6d88\u878d\u5b9e\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24540v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Do Frontier Model Ingredients Add Up? A Replicated Factorial Study of Small Language Models", "tldr": "\u5728\u76f8\u540c\u6570\u636e\u4e0e\u8bad\u7ec3\u9884\u7b97\u4e0b\uff0c\u91cd\u590d\u6bd4\u8f83\u5c0f\u8bed\u8a00\u6a21\u578b\u7684\u4e94\u9879\u6539\u8fdb\u53ca\u5176\u7ec4\u5408\u3002\u6df7\u5408\u4e13\u5bb6\u3001Muon\u548cDeltaNet\u6536\u76ca\u6700\u5927\uff0c\u591a\u6570\u589e\u76ca\u53ef\u53e0\u52a0\uff0c\u91cd\u590d\u5b9e\u9a8c\u4e5f\u63ed\u793a\u4e86\u7ec6\u5fae\u4ea4\u4e92\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier coding agents increasingly exhibit overeagerness, taking surprising, sometimes reckless actions beyond a user\u0027s mandate --- reported in recent system cards from frontier model developers. These cases are surfaced through internal deployment monitoring, which requires private traffic and is out of reach for open-weight models and independent evaluators. Automated alignment audits are the natural alternative, but capable models increasingly recognise the synthetic setup and adjust their behaviour. We introduce Continuation Audits, a pipeline that grounds the auditor on a prefix drawn from a real coding-agent transcript and directs it to continue the trajectory toward a seeded behaviour. Because the prefix is drawn from a real session, the auditor only needs to maintain a realistic setting rather than manufacturing it. We validate the method on SWE-Chat prefixes: on a paired subset of 90 audits a judge cannot reliably distinguish continuations from their source sessions (realism win rate 0.42 vs.\\ 0.43), and across all 900 audits verbalized eval-awareness does not exceed the rate observed in the unaudited real sessions. Applying the pipeline to three recent models across three seeds, we find each model leads a different seed --- DeepSeek~V4~Pro on colleague-credentials misuse, GPT-5.6~Terra on file-permission bypasses, and Kimi~K3 on treating diagnostic questions as instructions. Kimi~K3 additionally continues to bypass file-permission protections after an explicit CLAUDE.md prohibition while the other two stop entirely, corroborating Moonshot\u0027s own report of excessive proactiveness.", "arxiv_id": "2611.24491", "arxiv_url": "https://arxiv.org/abs/2611.24491", "authors": ["Sean Lim", "Clement Neo"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u771f\u5b9e\u7f16\u7a0b\u4f1a\u8bdd\u524d\u7f00\u7684\u7eed\u5199\u5ba1\u8ba1\uff0c\u4fdd\u6301\u573a\u666f\u771f\u5b9e\u6027\u4e14\u4e0d\u589e\u52a0\u8bc4\u6d4b\u5bdf\u89c9\uff1b\u5728\u4e09\u6b3e\u6a21\u578b\u4e2d\u53d1\u73b0\u51ed\u636e\u6ee5\u7528\u3001\u6743\u9650\u7ed5\u8fc7\u548c\u6307\u4ee4\u8bef\u8bfb\u7b49\u8d8a\u6743\u884c\u4e3a\u3002", "categories": ["cs.CR", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24491", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f16\u7a0b\u667a\u80fd\u4f53", "\u5b89\u5168\u8bc4\u6d4b", "\u8d8a\u6743\u884c\u4e3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24491v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Probing agent overeagerness in realistic settings with continuation audits", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u771f\u5b9e\u7f16\u7a0b\u4f1a\u8bdd\u524d\u7f00\u7684\u7eed\u5199\u5ba1\u8ba1\uff0c\u4fdd\u6301\u573a\u666f\u771f\u5b9e\u6027\u4e14\u4e0d\u589e\u52a0\u8bc4\u6d4b\u5bdf\u89c9\uff1b\u5728\u4e09\u6b3e\u6a21\u578b\u4e2d\u53d1\u73b0\u51ed\u636e\u6ee5\u7528\u3001\u6743\u9650\u7ed5\u8fc7\u548c\u6307\u4ee4\u8bef\u8bfb\u7b49\u8d8a\u6743\u884c\u4e3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent research suggests that individual neurons can have interpretable roles in AI behaviour. In Qwen3.5-4B, steering along one neuron\u0027s output direction increased decisions to conceal information more in teams than alone across five scenarios, even when teammates provided no messages. When all members participated and received steering, collective concealment increased in four scenarios, while inter-agent messaging helped temper concealment under steering. Moreover, removing the neuron\u0027s contribution had negligible effects. Collective settings can therefore change how an internal intervention affects AI behaviour.", "arxiv_id": "2611.24475", "arxiv_url": "https://arxiv.org/abs/2611.24475", "authors": ["Edoardo Chidichimo", "Felix P. S. Wallis"], "brief": "\u5728Qwen3.5-4B\u4e2d\uff0c\u6cbf\u5355\u4e2a\u795e\u7ecf\u5143\u8f93\u51fa\u65b9\u5411\u5e72\u9884\uff0c\u6bd4\u8d77\u72ec\u5904\u66f4\u6613\u589e\u52a0\u56e2\u961f\u4e2d\u7684\u4fe1\u606f\u9690\u7792\uff1b\u6210\u5458\u95f4\u901a\u4fe1\u53ef\u7f13\u89e3\u9690\u7792\uff0c\u800c\u79fb\u9664\u8be5\u795e\u7ecf\u5143\u8d21\u732e\u51e0\u4e4e\u65e0\u5f71\u54cd\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24475", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u795e\u7ecf\u5143\u5e72\u9884", "\u4fe1\u606f\u9690\u7792", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24475v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Nothing to Declare: Steering a single neuron increases concealment in AI teams", "tldr": "\u5728Qwen3.5-4B\u4e2d\uff0c\u6cbf\u5355\u4e2a\u795e\u7ecf\u5143\u8f93\u51fa\u65b9\u5411\u5e72\u9884\uff0c\u6bd4\u8d77\u72ec\u5904\u66f4\u6613\u589e\u52a0\u56e2\u961f\u4e2d\u7684\u4fe1\u606f\u9690\u7792\uff1b\u6210\u5458\u95f4\u901a\u4fe1\u53ef\u7f13\u89e3\u9690\u7792\uff0c\u800c\u79fb\u9664\u8be5\u795e\u7ecf\u5143\u8d21\u732e\u51e0\u4e4e\u65e0\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific problems have no answer key, so evaluating an agent means deciding what counts as a better solution before any agent is run. Existing benchmarks either match a symbolic answer against a key or, where they require executable work, score it by unit tests, by a rubric, or by position on a competition leaderboard. None of these is the criterion by which a field decides that one published method beats another. STEMBench adopts that criterion directly. Each of its twelve research problems in high-energy physics, astrophysics and neuroscience is scored by its own field\u0027s figure of merit, and each comes with two measured anchors: a submission that uses no domain knowledge, and an expert reference reproducing a published method, both obtained by running code shipped with the benchmark. The interval between them states how much of a problem is crossed by scientific insight rather than by engineering. Across eight frontier models, task-level wins and domain-level leadership dissociate: a model that wins five of the twelve tasks leads no domain mean. In the high-effort cross-model comparison, at least one model\u0027s mean score exceeds the expert anchor on seven of twelve tasks. The remaining five span uncertainty estimation, latent and causal inference, and cross-site clinical classification. Numerical scores and official-submission validity capture different aspects of performance and are reported separately. We release the tasks, graders, anchors and harness.", "arxiv_id": "2611.24321", "arxiv_url": "https://arxiv.org/abs/2611.24321", "authors": ["Alina Avanesyan", "Alexey Boldyrev", "Liqun Deng", "Denis Derkach", "Mary Godunova", "Mikhail Hushchyn", "Dmitry Ilvovsky", "Irina Knyazeva", "Irina Piontkovskaya", "Dmitry Polubotko", "Fedor Ratnikov", "Ekaterina Trofimova", "Zhenhe Zhang"], "brief": "STEMBench\u4ee5\u9886\u57df\u6307\u6807\u548c\u5b9e\u6d4b\u57fa\u7ebf\u8bc4\u6d4b\u5341\u4e8c\u9879\u535a\u58eb\u540e\u7ea7\u79d1\u7814\u4efb\u52a1\uff1b\u516b\u4e2a\u524d\u6cbf\u6a21\u578b\u4e2d\uff0c\u4e03\u9879\u4efb\u52a1\u6709\u6a21\u578b\u5747\u5206\u8d85\u8fc7\u4e13\u5bb6\u57fa\u7ebf\uff0c\u4f46\u5355\u9879\u80dc\u51fa\u4e0d\u4ee3\u8868\u9886\u57df\u9886\u5148\u3002", "categories": ["cs.AI", "physics.data-an"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24321", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u5b66\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u8bc4\u6d4b", "\u81ea\u7136\u79d1\u5b66", "\u79d1\u7814\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24321v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Benchmarking LLM abilities on postdoc-level natural science problems", "tldr": "STEMBench\u4ee5\u9886\u57df\u6307\u6807\u548c\u5b9e\u6d4b\u57fa\u7ebf\u8bc4\u6d4b\u5341\u4e8c\u9879\u535a\u58eb\u540e\u7ea7\u79d1\u7814\u4efb\u52a1\uff1b\u516b\u4e2a\u524d\u6cbf\u6a21\u578b\u4e2d\uff0c\u4e03\u9879\u4efb\u52a1\u6709\u6a21\u578b\u5747\u5206\u8d85\u8fc7\u4e13\u5bb6\u57fa\u7ebf\uff0c\u4f46\u5355\u9879\u80dc\u51fa\u4e0d\u4ee3\u8868\u9886\u57df\u9886\u5148\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal language models increasingly answer questions over external documents, exposing them to indirect prompt injection: commands planted in untrusted content to hijack the response. Rendering untrusted content as page images lowers attack success on average, leaving open which injected operations survive rendering, at what utility cost, and whether failed image attacks reflect unread commands or commands read but not followed. We pair text and page-image versions of 191 English question-answering sources across six models, measuring marker appending, answer formatting, and answer replacement alongside clean Question-Answering utility. Rendering reduces append and format execution for every model, yet Qwen3-VL-8B still executes image-borne replacement at 77.96\\%. Protection also depends on target type, rendering settings, wording, and repetition, and a search over eight fixed attack candidates largely closes the image deficit in appending and formatting for Qwen and Gemini, though not for GPT-5-nano. Utility ratios on original questions range from 93.31\\% to 101.61\\%, but Qwen falls to 61.99\\% when answers combine two evidence spans. Illegibility cannot explain all failed attacks: models often transcribe and identify image-borne commands they do not execute, and trusted user authorization raises execution on unchanged pages. Inside Qwen, patching early attack-region states induces all three operations, more weakly in images. Attention blocking suggests why: a text command acts through its own positions, whereas visual encoding spreads an image command and its target across the instruction page. Rendering thus offers conditional protection, motivating evaluations that report security by model, operation, and attack budget alongside utility.", "arxiv_id": "2611.24231", "arxiv_url": "https://arxiv.org/abs/2611.24231", "authors": ["Haoyang Liu", "Yinong Xu", "Zhe Lang", "Zhenyu Guan", "Qianyun Zhang"], "brief": "\u5bf9\u6bd4\u516d\u79cd\u6a21\u578b\u5904\u7406\u6587\u672c\u4e0e\u9875\u9762\u56fe\u50cf\u65f6\u7684\u63d0\u793a\u6ce8\u5165\u98ce\u9669\uff0c\u53d1\u73b0\u56fe\u50cf\u5316\u4ec5\u63d0\u4f9b\u6761\u4ef6\u6027\u4fdd\u62a4\uff1a\u90e8\u5206\u653b\u51fb\u4ecd\u9ad8\u6548\u6267\u884c\uff0c\u591a\u8bc1\u636e\u95ee\u7b54\u80fd\u529b\u4e5f\u53ef\u80fd\u660e\u663e\u4e0b\u964d\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24231", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63d0\u793a\u6ce8\u5165", "\u591a\u6a21\u6001\u6a21\u578b", "\u6587\u6863\u95ee\u7b54", "\u5b89\u5168\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24231v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Survives the Shift from Text to Pixels? Conditional Protection against Prompt Injection in Image-Rendered Documents", "tldr": "\u5bf9\u6bd4\u516d\u79cd\u6a21\u578b\u5904\u7406\u6587\u672c\u4e0e\u9875\u9762\u56fe\u50cf\u65f6\u7684\u63d0\u793a\u6ce8\u5165\u98ce\u9669\uff0c\u53d1\u73b0\u56fe\u50cf\u5316\u4ec5\u63d0\u4f9b\u6761\u4ef6\u6027\u4fdd\u62a4\uff1a\u90e8\u5206\u653b\u51fb\u4ecd\u9ad8\u6548\u6267\u884c\uff0c\u591a\u8bc1\u636e\u95ee\u7b54\u80fd\u529b\u4e5f\u53ef\u80fd\u660e\u663e\u4e0b\u964d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Coding agents now resolve repository issues and generate compact playable games, but whether they can build a large 3D game from scratch remains open. Such games tightly couple mechanics, scenes, assets, and interaction logic, and their quality rests on player enjoyment, which existing benchmarks rarely assess. Thus, we introduce 3D GameDev Arena, a first extreme long-horizon benchmark of 108 from-scratch game-development tasks across 14 genres. Given only a text specification and UI/UX reference images, a fully automated plan--implement--test--repair pipeline builds each task into a self-contained browser game. Runs average $\\sim$1,000 LLM calls ; the longest uses 14,407 calls, 2.13B tokens, and 608 assets. Evaluation spans (1) objective code-level functional acceptance against the game specification, (2) agent-based QA and playtesting of 3D presentation and playability, and (3) blind pairwise Bradley-Terry human preference in a public arena. The preliminary findings indicate that long-horizon 3D game development remains far from solved, and code-level correctness alone does not dictate player preference. The public arena is hosted online.", "arxiv_id": "2611.24073", "arxiv_url": "https://arxiv.org/abs/2611.24073", "authors": ["Bizhe Bai", "Jiliang Jian", "Yuqing Yan", "Tao Chen", "Ying Wen"], "brief": "\u63d0\u51fa\u8986\u76d614\u7c7b\u3001108\u9879\u4efb\u52a1\u7684\u957f\u7a0b3D\u6e38\u620f\u5f00\u53d1\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u7ed3\u5408\u529f\u80fd\u9a8c\u6536\u3001\u81ea\u52a8\u8bd5\u73a9\u4e0e\u4eba\u7c7b\u504f\u597d\u8bc4\u6d4b\uff1b\u521d\u6b65\u7ed3\u679c\u663e\u793a\u5f00\u53d1\u4ecd\u56f0\u96be\uff0c\u4ee3\u7801\u6b63\u786e\u4e0d\u7b49\u4e8e\u73a9\u5bb6\u559c\u6b22\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24073", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f16\u7a0b\u667a\u80fd\u4f53", "\u6e38\u620f\u5f00\u53d1", "\u957f\u7a0b\u4efb\u52a1", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24073v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "3D GameDev Arena: Benchmarking Coding Agents That Plan, Build, and Playtest extreme Long-Horizon Browser Games", "tldr": "\u63d0\u51fa\u8986\u76d614\u7c7b\u3001108\u9879\u4efb\u52a1\u7684\u957f\u7a0b3D\u6e38\u620f\u5f00\u53d1\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u7ed3\u5408\u529f\u80fd\u9a8c\u6536\u3001\u81ea\u52a8\u8bd5\u73a9\u4e0e\u4eba\u7c7b\u504f\u597d\u8bc4\u6d4b\uff1b\u521d\u6b65\u7ed3\u679c\u663e\u793a\u5f00\u53d1\u4ecd\u56f0\u96be\uff0c\u4ee3\u7801\u6b63\u786e\u4e0d\u7b49\u4e8e\u73a9\u5bb6\u559c\u6b22\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing latent reasoners typically run for a preset latent horizon during inference. Intuitively, a longer horizon should provide more opportunity for reasoning. However, in this work, we find that extending latent Chain-of-Thought (CoT) to the full preset horizon may in fact degrade reasoning performance. We observe that latent CoT evolves through distinct functional stages, with earlier computation forming frontier reasoning states, while later computation mainly reorganizes existing candidates and can weaken gold candidate support. These findings motivate a rethink of fixed-horizon latent inference. To address this, we characterize the reasoning benefits of latent CoT by realized and remaining constructive progress. Empirically, we find that higher realized constructive progress corresponds to higher current reasoning accuracy, while more remaining progress corresponds to larger future gains from continued latent CoT. To this end, we introduce a lightweight method that estimates the remaining reasoning progress and adaptively adjusts the latent horizon during inference. Across representative latent CoT reasoners and multiple arithmetic benchmarks, our method improves reasoning accuracy by up to 7.2 percentage points while reducing latent computation by up to 29.0%, without retraining the LLM.", "arxiv_id": "2611.24001", "arxiv_url": "https://arxiv.org/abs/2611.24001", "authors": ["Tianxiang Chen", "Jingyuan Zhou", "Weiming Yang", "Kaidi Yang"], "brief": "\u7814\u7a76\u53d1\u73b0\u6f5c\u5728\u601d\u7ef4\u94fe\u8fc7\u957f\u4f1a\u524a\u5f31\u63a8\u7406\uff0c\u636e\u5269\u4f59\u63a8\u7406\u8fdb\u5c55\u81ea\u9002\u5e94\u8c03\u6574\u63a8\u7406\u6b65\u6570\uff0c\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u5728\u7b97\u672f\u57fa\u51c6\u4e0a\u63d0\u5347\u51c6\u786e\u7387\u6700\u591a7.2\u4e2a\u767e\u5206\u70b9\u3001\u51cf\u5c11\u8ba1\u7b97\u6700\u591a29%\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24001", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6f5c\u5728\u63a8\u7406", "\u601d\u7ef4\u94fe", "\u81ea\u9002\u5e94\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24001v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rethinking Fixed-Horizon Latent Reasoning", "tldr": "\u7814\u7a76\u53d1\u73b0\u6f5c\u5728\u601d\u7ef4\u94fe\u8fc7\u957f\u4f1a\u524a\u5f31\u63a8\u7406\uff0c\u636e\u5269\u4f59\u63a8\u7406\u8fdb\u5c55\u81ea\u9002\u5e94\u8c03\u6574\u63a8\u7406\u6b65\u6570\uff0c\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u5728\u7b97\u672f\u57fa\u51c6\u4e0a\u63d0\u5347\u51c6\u786e\u7387\u6700\u591a7.2\u4e2a\u767e\u5206\u70b9\u3001\u51cf\u5c11\u8ba1\u7b97\u6700\u591a29%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models can infer and follow specific rules through in-context learning (ICL), yet may fail to remain faithful to provided evidence, giving rise to out-of-context (OOC) hallucination. Existing work has largely investigated the underlying mechanisms of ICL and OOC hallucination along separate lines. However, this separation obscures the mechanistic basis for these seemingly opposing outcomes. In this work, we study this contrast through the unified view of functional roles in dynamic context. The key observation is that role information can be internally represented without reliably constraining output. We derive a first-order decomposition to characterize the role effect, showing that its substantial influence depends on two necessary conditions, namely sufficient contribution magnitude and coherent signed aggregation. Causal analysis further shows that role span contributions affect key token choices involving response structure, content selection, and factual values. We further show that role-consistent choices depend on sufficient role span support at these key decisions, while failing choices can be reversed when this support overcomes the deficit. These findings support a common mechanistic view of ICL and OOC hallucination: each functional role defines the pattern of output decisions over which role span contributions must remain effective, and differences in this organization account for the seemingly opposing outcomes.", "arxiv_id": "2611.24000", "arxiv_url": "https://arxiv.org/abs/2611.24000", "authors": ["Tianxiang Chen", "Jingyuan Zhou", "Guoyao Yang", "Kaidi Yang"], "brief": "\u4ece\u52a8\u6001\u4e0a\u4e0b\u6587\u4e2d\u7684\u529f\u80fd\u89d2\u8272\u7edf\u4e00\u5206\u6790\u4e0a\u4e0b\u6587\u5b66\u4e60\u4e0e\u8131\u79bb\u4e0a\u4e0b\u6587\u7684\u5e7b\u89c9\uff0c\u53d1\u73b0\u89d2\u8272\u8d21\u732e\u7684\u5f3a\u5ea6\u4e0e\u65b9\u5411\u4e00\u81f4\u6027\u51b3\u5b9a\u7ea6\u675f\u6548\u679c\uff0c\u589e\u5f3a\u5173\u952e\u51b3\u7b56\u5904\u7684\u652f\u6301\u53ef\u9006\u8f6c\u9519\u8bef\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24000", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u5927\u6a21\u578b\u5e7b\u89c9", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u56e0\u679c\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24000v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Mechanistic Analysis of In-Context Learning and Out-of-Context Hallucination", "tldr": "\u4ece\u52a8\u6001\u4e0a\u4e0b\u6587\u4e2d\u7684\u529f\u80fd\u89d2\u8272\u7edf\u4e00\u5206\u6790\u4e0a\u4e0b\u6587\u5b66\u4e60\u4e0e\u8131\u79bb\u4e0a\u4e0b\u6587\u7684\u5e7b\u89c9\uff0c\u53d1\u73b0\u89d2\u8272\u8d21\u732e\u7684\u5f3a\u5ea6\u4e0e\u65b9\u5411\u4e00\u81f4\u6027\u51b3\u5b9a\u7ea6\u675f\u6548\u679c\uff0c\u589e\u5f3a\u5173\u952e\u51b3\u7b56\u5904\u7684\u652f\u6301\u53ef\u9006\u8f6c\u9519\u8bef\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) grasp the overall content of an image but often miss the fine details a question hinges on, such as a small object in a large photo or a number in a dense infographic. Yet even when their answer is wrong, the region they point to often contains the evidence. We introduce Self-Elicited Evidence (SEE), a training-free method that lets a frozen VLM look again where it points. When the initial answer has low confidence, SEE prompts the model to propose regions where the details may appear, answers the question on these enlarged crops, and aggregates the answers with the original prediction through confidence-weighted voting. The model also answers with its own transcript, which helps on text-rich images. SEE needs no detector or OCR engine. Across five backbones, SEE improves every small-object benchmark by 2.3-13.1 points and outperforms five training-free baselines on small objects. With SEE, Qwen3.5-4B surpasses the direct answer of Qwen3.5-9B and matches the 6 times larger Qwen3.5-27B.", "arxiv_id": "2611.23962", "arxiv_url": "https://arxiv.org/abs/2611.23962", "authors": ["Alin-Ionut Popa", "Tuo Zhang", "Dimitrios Dimitriadis"], "brief": "SEE\u8ba9\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u4f4e\u7f6e\u4fe1\u5ea6\u65f6\u653e\u5927\u81ea\u9009\u533a\u57df\uff0c\u7ed3\u5408\u6587\u672c\u8f6c\u5f55\u4e0e\u7f6e\u4fe1\u5ea6\u6295\u7968\uff0c\u65e0\u9700\u8bad\u7ec3\uff1b\u5c0f\u76ee\u6807\u57fa\u51c6\u63d0\u53472.3\u81f313.1\u70b9\uff0c4B\u6a21\u578b\u53ef\u5ab2\u7f8e27B\u76f4\u63a5\u4f5c\u7b54\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23962", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7ec6\u7c92\u5ea6\u611f\u77e5", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23962v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SEE: Unlocking the Hidden Perception of Frozen VLMs", "tldr": "SEE\u8ba9\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u4f4e\u7f6e\u4fe1\u5ea6\u65f6\u653e\u5927\u81ea\u9009\u533a\u57df\uff0c\u7ed3\u5408\u6587\u672c\u8f6c\u5f55\u4e0e\u7f6e\u4fe1\u5ea6\u6295\u7968\uff0c\u65e0\u9700\u8bad\u7ec3\uff1b\u5c0f\u76ee\u6807\u57fa\u51c6\u63d0\u53472.3\u81f313.1\u70b9\uff0c4B\u6a21\u578b\u53ef\u5ab2\u7f8e27B\u76f4\u63a5\u4f5c\u7b54\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language agents that browse websites, operate phones and act in homes reason before every action, so every step waits for a large model, a latency and cost that stand in the way of deployment. Step-level speculation lets a small model draft each step and calls the large model only on rejected drafts, but its outcome rests on the judge, and a judge that reads only a step\u0027s text cannot tell whether the step fits the screen it acts on. We find that a few samples of a small model can contain a correct step about as often as the large model gets the step right, and not always on the same steps: checked against the screen, small drafts can be not only cheaper but better. We present Vanguard, a training-free judge that leaves the draft and target models unchanged: a general decision model, with the screenshot in view, gives each candidate step a probability of being right in one forward pass; the best candidate is kept if it clears a threshold, and otherwise the large model writes the step. On web, mobile and embodied agents, a 2B draft judged by Vanguard is at least as accurate as its 8B target and significantly more accurate on Mind2Web and EB-ALFRED, while the target writes only a minority of the steps; it completes far more closed-loop episodes, and with a 27B target from another family it is both faster and more accurate. Vanguard is the most accurate judge we compare on the agent tasks; it relies on the screenshot on web and mobile tasks, its calibrated threshold transfers to unseen websites, and across model families its gain over the target grows with the draft\u0027s pass@4 relative to the target\u0027s accuracy. Vanguard composes with token-level speculative decoding and matches trained process reward models on mathematics, turning speculation from a way to save the large model\u0027s work into one that can improve on it.", "arxiv_id": "2611.23917", "arxiv_url": "https://arxiv.org/abs/2611.23917", "authors": ["Hanqi Mao", "Jiajun Fan", "Ruihan Guo", "Shuaike Shen", "Ziwen Wang", "Hui Ren", "Xianrui Zhong", "Ge Liu"], "brief": "Vanguard\u7528\u622a\u56fe\u611f\u77e5\u7684\u514d\u8bad\u7ec3\u5224\u522b\u5668\u7b5b\u9009\u5c0f\u6a21\u578b\u5019\u9009\u52a8\u4f5c\uff0c\u4ec5\u5728\u4e0d\u53ef\u4fe1\u65f6\u8c03\u7528\u5927\u6a21\u578b\uff1b\u5728\u7f51\u9875\u3001\u624b\u673a\u548c\u5177\u8eab\u4efb\u52a1\u4e2d\u964d\u4f4e\u8c03\u7528\u6210\u672c\uff0c\u51c6\u786e\u7387\u6301\u5e73\u6216\u63d0\u5347\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23917", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u63a8\u6d4b\u89e3\u7801", "\u6a21\u578b\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23917v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Vanguard: Knowing When to Trust the Draft in Speculative Vision-Language Agents", "tldr": "Vanguard\u7528\u622a\u56fe\u611f\u77e5\u7684\u514d\u8bad\u7ec3\u5224\u522b\u5668\u7b5b\u9009\u5c0f\u6a21\u578b\u5019\u9009\u52a8\u4f5c\uff0c\u4ec5\u5728\u4e0d\u53ef\u4fe1\u65f6\u8c03\u7528\u5927\u6a21\u578b\uff1b\u5728\u7f51\u9875\u3001\u624b\u673a\u548c\u5177\u8eab\u4efb\u52a1\u4e2d\u964d\u4f4e\u8c03\u7528\u6210\u672c\uff0c\u51c6\u786e\u7387\u6301\u5e73\u6216\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Kernel Ridge Attention (KRA) is a recurrent sequence mixer that combines learned nonlinear features with covariance-guided memory updates. It stores associations through recursive ridge regression, using correlations among past keys to determine how new observations modify memory. A content-dependent Ornstein--Uhlenbeck transition controls retention and restores uncertainty for future writes. This construction admits an exact temporal-kernel interpretation and maintains an inference state whose size is independent of context length. Associative block maps and explicit adjoints support parallel training while preserving the recursive update. In controlled language-modeling experiments, KRA improves prediction quality over attention and recurrent baselines, strengthens natural associative recall over the evaluated recurrent models, and achieves practical distributed training throughput. These properties provide a principled foundation for nonlinear, adaptive sequence memory.", "arxiv_id": "2611.23896", "arxiv_url": "https://arxiv.org/abs/2611.23896", "authors": ["Haowei Chen", "Yichen Wang", "Congfu Xu"], "brief": "\u63d0\u51fa\u6838\u5cad\u6ce8\u610f\u529b\uff0c\u4ee5\u9012\u5f52\u5cad\u56de\u5f52\u6784\u5efa\u975e\u7ebf\u6027\u8bb0\u5fc6\u5e76\u9009\u62e9\u6027\u9057\u5fd8\uff0c\u63a8\u7406\u72b6\u6001\u4e0d\u968f\u4e0a\u4e0b\u6587\u589e\u957f\uff1b\u53d7\u63a7\u8bed\u8a00\u5efa\u6a21\u5b9e\u9a8c\u4e2d\uff0c\u9884\u6d4b\u4e0e\u8054\u60f3\u53ec\u56de\u4f18\u4e8e\u6240\u8bc4\u4f30\u57fa\u7ebf\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23896", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5e8f\u5217\u5efa\u6a21", "\u6ce8\u610f\u529b\u673a\u5236", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23896v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Kernel Ridge Attention: Nonlinear Memory with Selective Forgetting", "tldr": "\u63d0\u51fa\u6838\u5cad\u6ce8\u610f\u529b\uff0c\u4ee5\u9012\u5f52\u5cad\u56de\u5f52\u6784\u5efa\u975e\u7ebf\u6027\u8bb0\u5fc6\u5e76\u9009\u62e9\u6027\u9057\u5fd8\uff0c\u63a8\u7406\u72b6\u6001\u4e0d\u968f\u4e0a\u4e0b\u6587\u589e\u957f\uff1b\u53d7\u63a7\u8bed\u8a00\u5efa\u6a21\u5b9e\u9a8c\u4e2d\uff0c\u9884\u6d4b\u4e0e\u8054\u60f3\u53ec\u56de\u4f18\u4e8e\u6240\u8bc4\u4f30\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Inferring the unseen side of a 3D assembly requires reasoning about part placement and occlusion. Different assemblies can match the observed views while producing different hidden views, leaving the target ambiguous. We introduce SixthView, a benchmark in which models predict a sixth orthographic view from five observed views and information about the component shapes. The benchmark contains 602 synthetic polycube assemblies with 2--10 parts and requires a dense grid of part labels for the missing view, allowing both exact-view and cell-level evaluation. For each item, we exhaustively verify that all legal assemblies consistent with the exact component geometry and observed label grids yield the same target view. With these inputs, the task tests symbolic assembly and coordinate reasoning. The image-only variants additionally require shape recovery from rendered views, where occlusion can make different 3D shapes look identical. We evaluate three vision-language models under four input conditions. Across 552 items with complete evaluations, exact-grid accuracy with images plus exact text ranges from 33.2% to 85.4%. Adding exact text to separate images improves accuracy by 19.7--63.0 percentage points, whereas adding images to exact text changes it by only $-0.5$ to $+2.1$ points. Separate image panels outperform a merged sheet by 6.7--11.1 points. The results show that performance depends strongly on access to exact symbolic information, with little further improvement from images once the geometry is specified. GitHub: https://github.com/facebookresearch/sixthview_benchmark", "arxiv_id": "2611.23891", "arxiv_url": "https://arxiv.org/abs/2611.23891", "authors": ["Pooya Khosravi", "Jen-Feng Chang", "Fnu Pramono"], "brief": "\u63d0\u51fa\u9690\u85cf\u89c6\u56fe\u91cd\u5efa\u57fa\u51c6\uff0c\u8981\u6c42\u4ece\u4e94\u4e2a\u89c6\u56fe\u4e0e\u90e8\u4ef6\u4fe1\u606f\u63a8\u65ad\u7b2c\u516d\u89c6\u56fe\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u7cbe\u786e\u7b26\u53f7\u4fe1\u606f\u663e\u8457\u63d0\u5347\u51c6\u786e\u7387\uff0c\u51e0\u4f55\u5df2\u77e5\u540e\u56fe\u50cf\u589e\u76ca\u5f88\u5c0f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23891", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u7a7a\u95f4\u63a8\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23891v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SixthView: A Benchmark for Hidden-View Reconstruction and 3D Assembly Reasoning", "tldr": "\u63d0\u51fa\u9690\u85cf\u89c6\u56fe\u91cd\u5efa\u57fa\u51c6\uff0c\u8981\u6c42\u4ece\u4e94\u4e2a\u89c6\u56fe\u4e0e\u90e8\u4ef6\u4fe1\u606f\u63a8\u65ad\u7b2c\u516d\u89c6\u56fe\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u7cbe\u786e\u7b26\u53f7\u4fe1\u606f\u663e\u8457\u63d0\u5347\u51c6\u786e\u7387\uff0c\u51e0\u4f55\u5df2\u77e5\u540e\u56fe\u50
