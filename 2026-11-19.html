8\u7406\u5e76\u4f7f\u7528\u653e\u5927\u5de5\u5177\u641c\u7d22\u7ec6\u8282\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u903b\u8f91\u4e00\u81f4\u7684\u76d1\u7763\u6570\u636e\u53ef\u6bd4\u590d\u6742\u5f3a\u5316\u5b66\u4e60\u8bbe\u8ba1\u66f4\u5173\u952e\uff0c\u4e3a\u89c6\u89c9\u5de5\u5177\u8c03\u7528\u63d0\u4f9b\u4e86\u6210\u672c\u66f4\u4f4e\u3001\u63a8\u7406\u66f4\u6709\u6761\u7406\u7684\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Post-training quantization is the standard way to serve large language models at low cost. However, the best quantization recipe differs across models and precisions. As a result, experts must redesign it for every new model, which is time-consuming and often sub-optimal. Fortunately, an LLM agent can take over this design by refining the recipe over rounds of building and evaluating candidates, so that more rounds lead to better recipes. However, evaluating one quantized reasoning model takes tens of GPU-hours, and combining methods from different codebases means porting each to the new architecture by hand. We present QDA, a system in which an agent designs the recipe for each model and precision. To make evaluation fast, QDA scores each candidate in minutes by its output KL divergence from the original model on reasoning traces that the agent never sees, and checks promising ones with long generations to catch failures such as repetition loops. To make building fast, QDA provides a library of public PTQ methods that are compatible with one another and with new model architectures. Across four reasoning models, QDA improves accuracy over the strongest public recipe by 0.9, 1.4 and 2.2 percentage points on average at W4A16, W4A8 and W3A16, using 64 GPU-hours per search. On the 320B-parameter MoE model GLM-5.3-Flash at NVFP4 W4A4, it recovers 98.3% of the FP8 model\u0027s accuracy, against 96.9% for the best vendor checkpoint. Every QDA checkpoint also runs on existing serving kernels with no inference overhead. We will release 53\u6309\u6a21\u578b\u548c\u7cbe\u5ea6\u8fed\u4ee3\u8bbe\u8ba1\u91cf\u5316\u65b9\u6848\uff0c\u5229\u7528\u517c\u5bb9\u7684\u8bad\u7ec3\u540e\u91cf\u5316\u65b9\u6cd5\u5e93\u6784\u5efa\u5019\u9009\uff0c\u4ee5\u9690\u85cf\u63a8\u7406\u8f68\u8ff9\u4e0a\u7684\u8f93\u51faKL\u6563\u5ea6\u5feb\u901f\u7b5b\u9009\uff0c\u518d\u7528\u957f\u751f\u6210\u68c0\u67e5\u5931\u6548\u3002", "why_notable": "\u5c06\u4f9d\u8d56\u4e13\u5bb6\u7684\u91cf\u5316\u914d\u65b9\u8bbe\u8ba1\u8f6c\u4e3a\u81ea\u52a8\u95ed\u73af\u641c\u7d22\uff0c\u6bcf\u6b21\u641c\u7d22\u4f7f\u752864 GPU\u5c0f\u65f6\uff0c\u6240\u5f97\u6a21\u578b\u517c\u5bb9\u73b0\u6709\u670d\u52a1\u5185\u6838\u4e14\u65e0\u989d\u5916\u63a8\u7406\u5f00\u9500\u3002"}, {"abstract": "System One models such as Jev return decisions through fast, parallel prediction. In this paper, we introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many valid images, yet parallel predictions must converge on a coherent whole. We therefore condition all positions on a shared random state to coordinate parallel predictions, so that each draw yields a different but coherent image. Since the model tends to ignore this state under direct image supervision, we first learn a distribution over discrete image codes to guide single-pass generation. Beyond text-to-image generation, we further unify image-to-image generation and dense prediction within the same architecture, so that one checkpoint supports all three tasks, each in one forward pass. Experiments show that Jeveration generates a 512x512 image in 78 ms, up to 122x faster than existing unified models, while maintaining competitive image quality and dense prediction performance.", "arxiv_id": "2611.24738", "arxiv_url": "https://arxiv.org/abs/2611.24738", "authors": ["Yuhe Liu", "Qi Li", "Shihua Zhang", "Xinchao Wang"], "brief": "Jeveration\u57fa\u4e8e\u51bb\u7ed3\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u89c6\u89c9\u8bed\u4e49\u77e5\u8bc6\u7528\u4e8e\u5e76\u884c\u56fe\u50cf\u751f\u6210\u3002\u5148\u5b66\u4e60\u79bb\u6563\u56fe\u50cf\u7801\u5206\u5e03\uff0c\u518d\u4ee5\u5171\u4eab\u968f\u673a\u72b6\u6001\u534f\u8c03\u5404\u4f4d\u7f6e\uff0c\u517c\u987e\u751f\u6210\u591a\u6837\u6027\u4e0e\u5168\u5c40\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Carol-lyh/Jeveration", "github_stars": 41, "hf_url": "https://huggingface.co/papers/2611.24738", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5171\u4eab\u968f\u673a\u72b6\u6001\u534f\u8c03\u5e76\u884c\u9884\u6d4b\uff0c\u79bb\u6563\u56fe\u50cf\u7801\u5206\u5e03\u5f15\u5bfc\u5355\u6b21\u751f\u6210", "\u5355\u4e00\u68c0\u67e5\u70b9\u7edf\u4e00\u6587\u751f\u56fe\u3001\u56fe\u751f\u56fe\u4e0e\u5bc6\u96c6\u9884\u6d4b", "512\u00d7512\u56fe\u50cf\u751f\u6210\u8017\u65f678\u6beb\u79d2\uff0c\u6700\u9ad8\u52a0\u901f122\u500d"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5e76\u884c\u9884\u6d4b", "\u591a\u4efb\u52a1\u5b66\u4e60"], "num_comments": 4, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2611.24738v1", "published_at": "2026-11-18", "score": 0.566, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (112\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24738.png", "title": "Jeveration: System One Models Now Generate", "tldr": "\u501f\u52a9\u5171\u4eab\u968f\u673a\u72b6\u6001\u534f\u8c03\u5e76\u884c\u9884\u6d4b\uff0c\u5b9e\u73b0\u5355\u6b21\u524d\u5411\u7684\u8fde\u8d2f\u56fe\u50cf\u751f\u6210\u4e0e\u591a\u4efb\u52a1\u7edf\u4e00\u3002", "upvotes": 112, "what_it_is": "Jeveration\u57fa\u4e8e\u51bb\u7ed3\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u89c6\u89c9\u8bed\u4e49\u77e5\u8bc6\u7528\u4e8e\u5e76\u884c\u56fe\u50cf\u751f\u6210\u3002\u5148\u5b66\u4e60\u79bb\u6563\u56fe\u50cf\u7801\u5206\u5e03\uff0c\u518d\u4ee5\u5171\u4eab\u968f\u673a\u72b6\u6001\u534f\u8c03\u5404\u4f4d\u7f6e\uff0c\u517c\u987e\u751f\u6210\u591a\u6837\u6027\u4e0e\u5168\u5c40\u4e00\u81f4\u6027\u3002", "why_notable": "\u5b83\u5c06\u5feb\u901f\u5e76\u884c\u51b3\u7b56\u6269\u5c55\u5230\u56fe\u50cf\u751f\u6210\uff0c\u5728\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u753b\u8d28\u4e0e\u5bc6\u96c6\u9884\u6d4b\u6027\u80fd\u65f6\u5927\u5e45\u63d0\u901f\uff0c\u4e3a\u4f4e\u5ef6\u8fdf\u591a\u4efb\u52a1\u89c6\u89c9\u6a21\u578b\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "We introduce Faithfulness Video Score (FVSCORE), a neuro-symbolic framework for specification-driven video generation evaluation. Existing evaluators rely on holistic MLLM judgments or vision-language metrics, yet aligning their scores with human judgments and tracing them to specific temporal violations remain open challenges. FVSCORE addresses these limitations by compiling each video into explicit propositions capturing prompt requirements and implicit propositions capturing unstated physical, temporal, and cross-modal constraints. It grounds each proposition using specialized perceptual tools and evaluates the resulting confidence traces with soft temporal operators inspired by Linear Temporal Logic. A Significance-Aware Calibration step then aligns verification with human perception by retaining only perceptually significant violations before producing a timestamp- and evidence-grounded report. We conduct extensive experiments across public and complex multi-event benchmarks with the strongest video models to date, demonstrating that FVSCORE outperforms holistic and agent-based evaluators in human correlation while providing highly accurate and interpretable feedback.", "arxiv_id": "2611.22673", "arxiv_url": "https://arxiv.org/abs/2611.22673", "authors": ["Do Xuan Long", "Long T. Le", "Yiwen Song", "Min-Yen Kan", "Tomas Pfister", "Yale Song"], "brief": "FVSCORE\u5c06\u63d0\u793a\u8981\u6c42\u53ca\u9690\u542b\u7684\u7269\u7406\u3001\u65f6\u5e8f\u4e0e\u8de8\u6a21\u6001\u7ea6\u675f\u8f6c\u4e3a\u547d\u9898\uff0c\u7528\u4e13\u95e8\u611f\u77e5\u5de5\u5177\u83b7\u53d6\u8bc1\u636e\uff0c\u518d\u4ee5\u8f6f\u65f6\u5e8f\u903b\u8f91\u9a8c\u8bc1\u5e76\u6821\u51c6\u611f\u77e5\u663e\u8457\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.22673", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u663e\u5f0f\u4e0e\u9690\u5f0f\u547d\u9898\u5171\u540c\u8986\u76d6\u63d0\u793a\u53ca\u672a\u660e\u8bf4\u7684\u7ea6\u675f", "\u4ee5\u7ebf\u6027\u65f6\u5e8f\u903b\u8f91\u542f\u53d1\u7684\u8f6f\u7b97\u5b50\u9a8c\u8bc1\u7f6e\u4fe1\u5ea6\u8f68\u8ff9", "Significance-Aware Calibration\u7b5b\u9009\u663e\u8457\u8fdd\u89c4"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u795e\u7ecf\u7b26\u53f7\u65b9\u6cd5", "\u65f6\u5e8f\u903b\u8f91", "\u53ef\u89e3\u91ca\u8bc4\u4f30"], "num_comments": 4, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2611.22673v1", "published_at": "2026-11-17", "score": 0.502, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22673.png", "title": "FVScore: Specification-Driven Neuro-Symbolic Video Evaluation", "tldr": "\u7528\u795e\u7ecf\u7b26\u53f7\u9a8c\u8bc1\u8bc4\u4f30\u751f\u6210\u89c6\u9891\uff0c\u63d0\u5347\u4eba\u7c7b\u8bc4\u5206\u4e00\u81f4\u6027\u5e76\u5b9a\u4f4d\u65f6\u5e8f\u8fdd\u89c4\u3002", "upvotes": 4, "what_it_is": "FVSCORE\u5c06\u63d0\u793a\u8981\u6c42\u53ca\u9690\u542b\u7684\u7269\u7406\u3001\u65f6\u5e8f\u4e0e\u8de8\u6a21\u6001\u7ea6\u675f\u8f6c\u4e3a\u547d\u9898\uff0c\u7528\u4e13\u95e8\u611f\u77e5\u5de5\u5177\u83b7\u53d6\u8bc1\u636e\uff0c\u518d\u4ee5\u8f6f\u65f6\u5e8f\u903b\u8f91\u9a8c\u8bc1\u5e76\u6821\u51c6\u611f\u77e5\u663e\u8457\u6027\u3002", "why_notable": "\u5728\u516c\u5f00\u53ca\u590d\u6742\u591a\u4e8b\u4ef6\u57fa\u51c6\u4e0a\uff0c\u4e0e\u4eba\u7c7b\u5224\u65ad\u7684\u76f8\u5173\u6027\u4f18\u4e8e\u6574\u4f53\u5f0f\u548c\u667a\u80fd\u4f53\u8bc4\u4f30\u5668\uff0c\u5e76\u63d0\u4f9b\u5e26\u65f6\u95f4\u6233\u4e0e\u8bc1\u636e\u7684\u53ef\u89e3\u91ca\u53cd\u9988\u3002"}, {"abstract": "Vision-Language Models increasingly rely on textual reasoning to solve advanced multimodal tasks. Despite its effectiveness, this paradigm faces two fundamental limitations. First, relying on textual reasoning alone can limit perceptual ability in vision-centric questions, where accurate answers depend on interpreting task-relevant visual evidence. Second, applying textual reasoning uniformly across inputs overlooks question-dependent variation in both reasoning modality and depth, often producing verbose and unnecessary traces when little logical inference is required. To this end, we propose Adaptive Visual-Textual Reasoning (AVTR), which introduces visual imagination as a complementary reasoning modality to textual thinking, enabling the model to revisit its visual observations and distill the salient evidence through generative visual reflection. Furthermore, we formulate reasoning-modality selection as a learned routing problem, allowing a single policy to adaptively harness the complementary strengths of visual reflection and textual reasoning in response to the perceptual and inferential demands of the input. Across 16 benchmarks, AVTR improves the average score by 4.5 points over Qwen3.5 baseline, while reducing inference latency by 33\\%. It also scales effectively into a smaller size backbone, outperforming the evaluated 2B-scale baselines.", "arxiv_id": "2611.24161", "arxiv_url": "https://arxiv.org/abs/2611.24161", "authors": ["Xiaoqian Shen", "Yunyang Xiong", "Changsheng Zhao", "Saksham Suri", "Chong Zhou", "Zechun Liu", "Zhipeng Cai", "Zhuang Liu", "Qi Qian", "Wei Wen", "Hongyu Xu", "Hanxian Huang", "Ernie Chang", "Yanbei Chen", "Vikas Chandra", "Raghuraman Krishnamoorthi", "Mohamed Elhoseiny", "Lemeng Wu"], "brief": "AVTR\u5c06\u751f\u6210\u5f0f\u89c6\u89c9\u53cd\u601d\u5f15\u5165\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u8ba9\u6a21\u578b\u91cd\u65b0\u5ba1\u89c6\u56fe\u50cf\u5e76\u63d0\u70bc\u5173\u952e\u8bc1\u636e\uff1b\u901a\u8fc7\u5b66\u4e60\u5f0f\u8def\u7531\uff0c\u6309\u95ee\u9898\u9700\u6c42\u9009\u62e9\u89c6\u89c9\u53cd\u601d\u6216\u6587\u672c\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/xiaoqian-shen/AVTR", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.24161", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u751f\u6210\u5f0f\u89c6\u89c9\u53cd\u601d\u91cd\u8bbf\u89c6\u89c9\u89c2\u5bdf\uff0c\u63d0\u70bc\u4efb\u52a1\u76f8\u5173\u8bc1\u636e", "\u5b66\u4e60\u5f0f\u8def\u7531\u6309\u611f\u77e5\u4e0e\u63a8\u65ad\u9700\u6c42\u9009\u62e9\u63a8\u7406\u6a21\u6001", "16\u9879\u57fa\u51c6\u5e73\u5747\u63d0\u53474.5\u5206\uff0c\u63a8\u7406\u5ef6\u8fdf\u964d\u4f4e33%"], "keywords": ["\u591a\u6a21\u6001\u63a8\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u53cd\u601d", "\u81ea\u9002\u5e94\u8def\u7531"], "num_comments": 4, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2611.24161v1", "published_at": "2026-11-18", "score": 0.495, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta, Baidu", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24161.png", "title": "AVTR: Adaptive Multimodal Reasoning with Visual Imagination", "tldr": "\u901a\u8fc7\u89c6\u89c9\u60f3\u8c61\u4e0e\u81ea\u9002\u5e94\u63a8\u7406\u8def\u7531\uff0c\u63d0\u5347\u591a\u6a21\u6001\u4efb\u52a1\u8868\u73b0\u5e76\u964d\u4f4e\u63a8\u7406\u5ef6\u8fdf\u3002", "upvotes": 2, "what_it_is": "AVTR\u5c06\u751f\u6210\u5f0f\u89c6\u89c9\u53cd\u601d\u5f15\u5165\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u8ba9\u6a21\u578b\u91cd\u65b0\u5ba1\u89c6\u56fe\u50cf\u5e76\u63d0\u70bc\u5173\u952e\u8bc1\u636e\uff1b\u901a\u8fc7\u5b66\u4e60\u5f0f\u8def\u7531\uff0c\u6309\u95ee\u9898\u9700\u6c42\u9009\u62e9\u89c6\u89c9\u53cd\u601d\u6216\u6587\u672c\u63a8\u7406\u3002", "why_notable": "\u5b83\u5c06\u63a8\u7406\u65b9\u5f0f\u7684\u9009\u62e9\u7eb3\u5165\u6a21\u578b\u7b56\u7565\uff0c\u540c\u65f6\u6539\u5584\u51c6\u786e\u6027\u4e0e\u6548\u7387\uff1b\u5728\u8f83\u5c0f\u9aa8\u5e72\u4e0a\u4e5f\u4f18\u4e8e\u5df2\u8bc4\u4f30\u76842B\u7ea7\u57fa\u7ebf\uff0c\u663e\u793a\u51fa\u7f29\u5c0f\u6a21\u578b\u89c4\u6a21\u7684\u6f5c\u529b\u3002"}, {"abstract": "Large language models have reduced the effort to generate code for interactive software with graphical user interfaces (GUIs). For such software, a key testing bottleneck is reaching a deep state, one that requires a long interaction history. The cost of reaching it recurs across commits, and the GUI automation that could amortize it assumes a DOM or accessibility tree that self-rendered engines do not expose. We introduce StatePortal, an agent that synthesizes a checkpoint, an artifact that restores that state and can be versioned and replayed, from a natural-language functional test case and read-only access to the target\u0027s source code. The checkpoint is restored through a per-application hook that an onboarding agent binds or synthesizes once without hand-written hook code. Because a checkpoint can satisfy state checks while rendering incorrectly, checkpoints are scored by hybrid programmatic-state and visual evaluation: acceptance requires both a programmatic-state oracle and a visual oracle to pass. We calibrate the visual oracle against a blinded cross-VLM reference. We release DeepStateBench, 61 deep-state tasks across 10 interactive applications that span five language families and six rendering stacks, with source sizes from 874 to 7.2M lines. Across three registered models, a GUI agent seeded with synthesized checkpoints completes 10.4% of trials, compared with 0% without seeding under the same pixel action space, while StatePortal, which also delivers the target action through the hook, completes 27.5%. Over 1,361 replays of 112 checkpoints, 98.90% reproduce the original verdict with zero model calls, and the hybrid oracle detects 96.25% (77/80) of controlled visual faults invisible to programmatic-state checks alone. We open-source our code at https://github.com/pzy2000/State_Portal and website at https://stateportal.mineyosemite.chatgpt.site", "arxiv_id": "2611.23257", "arxiv_url": "https://arxiv.org/abs/2611.23257", "authors": ["Zhiyuan Peng", "Wei Tao", "Chenhao Ying", "Yuan Luo", "Yiwen Guo"], "brief": "StatePortal\u4ece\u81ea\u7136\u8bed\u8a00\u6d4b\u8bd5\u7528\u4f8b\u548c\u53ea\u8bfb\u6e90\u7801\u5408\u6210\u68c0\u67e5\u70b9\uff0c\u901a\u8fc7\u81ea\u52a8\u7ed1\u5b9a\u6216\u751f\u6210\u7684\u5e94\u7528\u94a9\u5b50\u6062\u590d\u6df1\u5c42\u72b6\u6001\uff0c\u5e76\u4ee5\u7a0b\u5e8f\u72b6\u6001\u4e0e\u89c6\u89c9\u53cc\u91cd\u5224\u5b9a\u9a8c\u8bc1\u7ed3\u679c\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/pzy2000/State_Portal", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23257", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["DeepStateBench\u542b10\u4e2a\u5e94\u7528\u300161\u9879\u6df1\u5c42\u72b6\u6001\u4efb\u52a1", "\u68c0\u67e5\u70b9\u8f85\u52a9GUI\u667a\u80fd\u4f53\u5b8c\u6210\u738710.4%\uff0c\u65e0\u8f85\u52a9\u4e3a0%", "1361\u6b21\u91cd\u653e\u5224\u5b9a\u4e00\u81f4\u738798.90%\uff0c\u65e0\u9700\u6a21\u578b\u8c03\u7528"], "keywords": ["\u8f6f\u4ef6\u6d4b\u8bd5", "\u667a\u80fd\u4f53", "\u56fe\u5f62\u754c\u9762", "\u72b6\u6001\u6062\u590d"], "num_comments": 3, "on_hf": true, "organization": "Shanghai JiaoTong University", "pdf_url": "https://arxiv.org/pdf/2611.23257v1", "published_at": "2026-09-29", "score": 0.494, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23257.png", "title": "StatePortal: Agentic Checkpoint Synthesis for Testing Deep States in Interactive Software", "tldr": "\u7528\u667a\u80fd\u4f53\u5408\u6210\u53ef\u91cd\u653e\u68c0\u67e5\u70b9\uff0c\u7ed5\u8fc7\u6f2b\u957f\u4ea4\u4e92\u76f4\u8fbe\u8f6f\u4ef6\u6df1\u5c42\u72b6\u6001\u5e76\u9a8c\u8bc1\u754c\u9762", "upvotes": 9, "what_it_is": "StatePortal\u4ece\u81ea\u7136\u8bed\u8a00\u6d4b\u8bd5\u7528\u4f8b\u548c\u53ea\u8bfb\u6e90\u7801\u5408\u6210\u68c0\u67e5\u70b9\uff0c\u901a\u8fc7\u81ea\u52a8\u7ed1\u5b9a\u6216\u751f\u6210\u7684\u5e94\u7528\u94a9\u5b50\u6062\u590d\u6df1\u5c42\u72b6\u6001\uff0c\u5e76\u4ee5\u7a0b\u5e8f\u72b6\u6001\u4e0e\u89c6\u89c9\u53cc\u91cd\u5224\u5b9a\u9a8c\u8bc1\u7ed3\u679c\u3002", "why_notable": "\u5c06\u6df1\u5c42\u72b6\u6001\u7684\u91cd\u590d\u5bfc\u822a\u6210\u672c\u8f6c\u4e3a\u53ef\u7248\u672c\u5316\u3001\u53ef\u91cd\u653e\u7684\u6d4b\u8bd5\u8d44\u4ea7\uff1b\u53cc\u91cd\u5224\u5b9a\u8fd8\u68c0\u51fa96.25%\u7684\u53d7\u63a7\u89c6\u89c9\u6545\u969c\uff0c\u8865\u8db3\u7eaf\u72b6\u6001\u68c0\u67e5\u76f2\u533a\u3002"}, {"abstract": "Latent diffusion models rely on a decoder to map denoised latents to pixels, adding complexity and inference cost. We introduce Decoding Without a Decoder (DWD), which lets a finetuned diffusion transformer produce final pixels directly through a linear head. Unlike previous methods, where the denoising output leads to final pixels, DWD separates the two roles: the original denoising head continues to drive sampling, then the new DWD head predicts the pixels at the final step. We extend pretrained latent models with DWD efficiently by finetuning only the last few transformer blocks, training the DWD head with pixel quality losses while anchoring the denoising head to the pretrained model to preserve the sample trajectory. Across latent image and video generators, DWD removes the decoder while maintaining or even improving pixel quality. On Wan video generation, it visibly reduces detail distortion and flickering, lowering warping error by 23%. Remarkably, the same separation also improves pixel diffusion models that do not even use a decoder: a final-step DWD head produces substantially better texture detail in text-to-image generation, and improves ImageNet FID from 1.55 to 1.43, a new state of the art among pixel flow models.", "arxiv_id": "2611.22287", "arxiv_url": "https://arxiv.org/abs/2611.22287", "authors": ["Hansheng Chen", "Shengqu Cai", "Jan Ackermann", "Rayhan Zirvi", "Gordon Wetzstein", "Xinchen Yan", "Leonidas Guibas"], "brief": "DWD\u4e3a\u9884\u8bad\u7ec3\u6269\u6563Transformer\u589e\u52a0\u7ebf\u6027\u50cf\u7d20\u9884\u6d4b\u5934\uff0c\u4ec5\u5fae\u8c03\u672b\u5c3e\u5c11\u91cf\u6a21\u5757\u3002\u539f\u53bb\u566a\u5934\u7ef4\u6301\u91c7\u6837\uff0c\u65b0\u5934\u5728\u6700\u540e\u4e00\u6b65\u76f4\u63a5\u8f93\u51fa\u50cf\u7d20\uff0c\u66ff\u4ee3\u72ec\u7acb\u89e3\u7801\u5668\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.22287", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["DWD\u7528\u50cf\u7d20\u8d28\u91cf\u635f\u5931\u8bad\u7ec3\u65b0\u5934\uff0c\u7ea6\u675f\u53bb\u566a\u5934\u4fdd\u6301\u539f\u91c7\u6837\u8f68\u8ff9", "Wan\u89c6\u9891\u751f\u6210\u7684\u626d\u66f2\u8bef\u5dee\u964d\u4f4e23%\uff0c\u7ec6\u8282\u5931\u771f\u4e0e\u95ea\u70c1\u51cf\u5c11", "\u50cf\u7d20\u6d41\u6a21\u578bImageNet FID\u4ece1.55\u964d\u81f31.43"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u56fe\u50cf\u751f\u6210", "\u89c6\u9891\u751f\u6210", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2611.22287v2", "published_at": "2026-11-17", "score": 0.492, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22287.png", "title": "Decoding Without a Decoder: Direct Pixel Prediction from Diffusion Transformers", "tldr": "\u5c06\u53bb\u566a\u4e0e\u50cf\u7d20\u8f93\u51fa\u89e3\u8026\uff0c\u8ba9\u6269\u6563\u6a21\u578b\u65e0\u9700\u89e3\u7801\u5668\u5373\u53ef\u751f\u6210\u9ad8\u8d28\u91cf\u56fe\u50cf\u4e0e\u89c6\u9891\u3002", "upvotes": 9, "what_it_is": "DWD\u4e3a\u9884\u8bad\u7ec3\u6269\u6563Transformer\u589e\u52a0\u7ebf\u6027\u50cf\u7d20\u9884\u6d4b\u5934\uff0c\u4ec5\u5fae\u8c03\u672b\u5c3e\u5c11\u91cf\u6a21\u5757\u3002\u539f\u53bb\u566a\u5934\u7ef4\u6301\u91c7\u6837\uff0c\u65b0\u5934\u5728\u6700\u540e\u4e00\u6b65\u76f4\u63a5\u8f93\u51fa\u50cf\u7d20\uff0c\u66ff\u4ee3\u72ec\u7acb\u89e3\u7801\u5668\u3002", "why_notable": "\u5b83\u5728\u7701\u53bb\u72ec\u7acb\u89e3\u7801\u5668\u7684\u540c\u65f6\u4fdd\u6301\u6216\u6539\u5584\u751f\u6210\u8d28\u91cf\uff0c\u4e14\u6536\u76ca\u5ef6\u4f38\u5230\u672c\u5c31\u65e0\u89e3\u7801\u5668\u7684\u50cf\u7d20\u6a21\u578b\uff0c\u663e\u793a\u8f93\u51fa\u89d2\u8272\u89e3\u8026\u7684\u66f4\u5e7f\u6cdb\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM) agents routinely interact with untrusted external data, exposing them to indirect prompt injection (IPI) attacks that hijack agents into executing attacker-chosen tasks. To uncover these vulnerabilities at scale, automated red-teaming methods often leverage reinforcement learning (RL) to generate attacks that achieve high attack success rates (ASR). Model developers use the attacks discovered during internal red-teaming to harden agents through adversarial training before deployment, a collaborative offensive-defensive process known in cybersecurity as purple-teaming. However, we show that achieving high ASR during red-teaming does not guarantee robustness gains from subsequent adversarial training. Specifically, we find that two state-of-the-art RL-based red-teaming methods, RL-Hammer and PISmith, suffer from mode collapse, repeatedly discovering similar attack strategies whose additional successes add no additional robustness improvements to adversarial training. To address this gap, we introduce PIPETTE, a unified prompt injection purple-teaming framework that effectively converts red-teaming discoveries into defender robustness improvements. PIPETTE employs a dictionary learning-based reward that encourages broader coverage of attack strategies during red-teaming. It also integrates an on-policy adversarial training pipeline tailored to IPI defense, enabling agents to resist attacks while completing legitimate user tasks. Extensive evaluations across agentic benchmarks (AgentDojo and ASB) demonstrate that PIPETTE produces defenders that achieve near-zero attack success rates on static attacks and can withstand strong adaptive attacks, while maintaining benign task utility close to that of the undefended baseline.", "arxiv_id": "2611.24362", "arxiv_url": "https://arxiv.org/abs/2611.24362", "authors": ["Lipeng He", "Yihan Wang", "Jiawen Zhang", "N. Asokan"], "brief": "PIPETTE\u5c06\u81ea\u52a8\u7ea2\u961f\u653b\u51fb\u4e0e\u9632\u5fa1\u8bad\u7ec3\u7edf\u4e00\u8d77\u6765\uff0c\u4ee5\u5b57\u5178\u5b66\u4e60\u5956\u52b1\u9f13\u52b1\u653b\u51fb\u7b56\u7565\u591a\u6837\u6027\uff0c\u518d\u7528\u5728\u7ebf\u7b56\u7565\u5bf9\u6297\u8bad\u7ec3\u63d0\u5347\u667a\u80fd\u4f53\u9632\u5fa1\u5e76\u4fdd\u7559\u6b63\u5e38\u4efb\u52a1\u80fd\u529b\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24362", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RL-Hammer\u4e0ePISmith\u51fa\u73b0\u653b\u51fb\u7b56\u7565\u6a21\u5f0f\u574d\u7f29", "\u5b57\u5178\u5b66\u4e60\u5956\u52b1\u6269\u5927\u7b56\u7565\u8986\u76d6\uff0c\u7ed3\u5408\u5728\u7ebf\u7b56\u7565\u5bf9\u6297\u8bad\u7ec3", "AgentDojo\u4e0eASB\u4e0a\u9759\u6001\u653b\u51fb\u6210\u529f\u7387\u63a5\u8fd1\u96f6"], "keywords": ["\u63d0\u793a\u6ce8\u5165", "\u667a\u80fd\u4f53\u5b89\u5168", "\u5bf9\u6297\u8bad\u7ec3", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24362v1", "published_at": "2026-11-18", "score": 0.485, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24362.png", "title": "PIPETTE: Prompt Injection Purple-Teaming for Robust LLM Agents", "tldr": "\u901a\u8fc7\u62d3\u5bbd\u653b\u51fb\u7b56\u7565\u8986\u76d6\u5e76\u8054\u52a8\u5bf9\u6297\u8bad\u7ec3\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u7684\u63d0\u793a\u6ce8\u5165\u9632\u5fa1\u80fd\u529b\u3002", "upvotes": 6, "what_it_is": "PIPETTE\u5c06\u81ea\u52a8\u7ea2\u961f\u653b\u51fb\u4e0e\u9632\u5fa1\u8bad\u7ec3\u7edf\u4e00\u8d77\u6765\uff0c\u4ee5\u5b57\u5178\u5b66\u4e60\u5956\u52b1\u9f13\u52b1\u653b\u51fb\u7b56\u7565\u591a\u6837\u6027\uff0c\u518d\u7528\u5728\u7ebf\u7b56\u7565\u5bf9\u6297\u8bad\u7ec3\u63d0\u5347\u667a\u80fd\u4f53\u9632\u5fa1\u5e76\u4fdd\u7559\u6b63\u5e38\u4efb\u52a1\u80fd\u529b\u3002", "why_notable": "\u6307\u51fa\u653b\u51fb\u6210\u529f\u7387\u9ad8\u4e0d\u7b49\u4e8e\u9632\u5fa1\u8bad\u7ec3\u6709\u6548\uff0c\u5c06\u7b56\u7565\u591a\u6837\u6027\u8f6c\u5316\u4e3a\u9c81\u68d2\u6027\u6536\u76ca\uff0c\u540c\u65f6\u62b5\u5fa1\u81ea\u9002\u5e94\u653b\u51fb\u5e76\u4fdd\u6301\u6b63\u5e38\u4efb\u52a1\u6548\u7528\u3002"}, {"abstract": "Autoregressive vision-language-action (VLA) models predict discrete action tokens with the next-token objective of their vision-language backbone, so the action tokenizer defines the interface between the policy and the robot. In bimanual manipulation, the two arms share a repertoire of movements yet coordinate through complementary roles, and an action representation should capture both. However, most existing tokenizers encode both arms as a single concatenated action vector, in which motion patterns common to the two arms are not shared and cross-arm dependencies remain entangled within each token. The policy must therefore learn both aspects implicitly. We propose Bimanual Coordination Action Tokenization (BiCAT), which shares one motion representation across arms while conditioning each arm\u0027s tokens on its partner through symmetric cross-arm attention and a joint decoder. The policy then predicts all tokens of each arm in parallel, generating the left arm first and the right arm conditioned on it. Across ten RoboTwin 2.0 tasks and six real-world tasks on three embodiments, BiCAT achieves the highest success among the compared tokenizers. In simulation, it improves mean success by 17.6 percentage points over the strongest of eight baselines, with the largest gains on tasks that require close coordination between the arms, while requiring only 40.5 ms per action chunk. These results suggest that the action tokenizer is a natural place to model bimanual coordination.", "arxiv_id": "2611.23499", "arxiv_url": "https://arxiv.org/abs/2611.23499", "authors": ["Xuanwei Liu", "Guipu Cao", "Zhongyi Luo", "Jiafei Duan"], "brief": "BiCAT\u5c06\u4e24\u81c2\u52a8\u4f5c\u6620\u5c04\u5230\u5171\u4eab\u8fd0\u52a8\u8868\u793a\uff0c\u4ee5\u5bf9\u79f0\u8de8\u81c2\u6ce8\u610f\u529b\u548c\u8054\u5408\u89e3\u7801\u5668\u5efa\u6a21\u534f\u540c\u3002\u7b56\u7565\u5148\u9884\u6d4b\u5de6\u81c2\uff0c\u518d\u636e\u6b64\u9884\u6d4b\u53f3\u81c2\uff0c\u6bcf\u81c2\u5185\u90e8\u7684\u52a8\u4f5c\u8bcd\u5143\u5e76\u884c\u751f\u6210\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/MAGICLAB-NUS/BiCAT", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2611.23499", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5171\u4eab\u8fd0\u52a8\u8868\u793a\uff0c\u7ed3\u5408\u5bf9\u79f0\u8de8\u81c2\u6ce8\u610f\u529b\u4e0e\u8054\u5408\u89e3\u7801\u5668", "\u8bc4\u6d4b\u8986\u76d610\u9879\u4eff\u771f\u30016\u9879\u5b9e\u673a\u4efb\u52a1\u53ca3\u79cd\u673a\u5668\u4eba\u5f62\u6001", "\u6bd48\u4e2a\u57fa\u7ebf\u4e2d\u6700\u5f3a\u8005\u9ad817.6\u4e2a\u767e\u5206\u70b9\uff0c\u6bcf\u52a8\u4f5c\u575740.5\u6beb\u79d2"], "keywords": ["\u53cc\u81c2\u64cd\u4f5c", "\u52a8\u4f5c\u7f16\u7801", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2611.23499v1", "published_at": "2026-11-17", "score": 0.467, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23499.png", "title": "BiCAT: Bimanual Coordination Action Tokenization", "tldr": "\u901a\u8fc7\u5171\u4eab\u8fd0\u52a8\u8868\u793a\u4e0e\u8de8\u81c2\u6ce8\u610f\u529b\uff0c\u6539\u5584\u53cc\u81c2\u673a\u5668\u4eba\u52a8\u4f5c\u7f16\u7801\u53ca\u534f\u540c\u64cd\u4f5c\u8868\u73b0\u3002", "upvotes": 3, "what_it_is": "BiCAT\u5c06\u4e24\u81c2\u52a8\u4f5c\u6620\u5c04\u5230\u5171\u4eab\u8fd0\u52a8\u8868\u793a\uff0c\u4ee5\u5bf9\u79f0\u8de8\u81c2\u6ce8\u610f\u529b\u548c\u8054\u5408\u89e3\u7801\u5668\u5efa\u6a21\u534f\u540c\u3002\u7b56\u7565\u5148\u9884\u6d4b\u5de6\u81c2\uff0c\u518d\u636e\u6b64\u9884\u6d4b\u53f3\u81c2\uff0c\u6bcf\u81c2\u5185\u90e8\u7684\u52a8\u4f5c\u8bcd\u5143\u5e76\u884c\u751f\u6210\u3002", "why_notable": "\u5c06\u53cc\u81c2\u534f\u8c03\u663e\u5f0f\u5f15\u5165\u52a8\u4f5c\u7f16\u7801\uff0c\u51cf\u8f7b\u7b56\u7565\u9690\u5f0f\u5b66\u4e60\u8de8\u81c2\u4f9d\u8d56\u7684\u8d1f\u62c5\uff1b\u7d27\u5bc6\u534f\u4f5c\u4efb\u52a1\u6536\u76ca\u6700\u5927\uff0c\u4e14\u517c\u987e\u63a8\u7406\u901f\u5ea6\u3002"}, {"abstract": "We present Piccolo, a family of multimodal decision models (0.8B to 27B) that coevolves model capabilities and training data via Agentic Data Engineering and recursive self-improvement (RSI). The models predict probabilities over candidate answers for general-purpose text and visual judgments, agent harnesses, data workflows, and interactive games. Piccolo-27B tops the Decision Index Vision Full leaderboard with a score of 75.59, while Piccolo-9B and Piccolo-4B achieve 68.35 and 67.46, respectively. All three rank first on the Private benchmark in their respective model-size categories. Research agents analyze model behavior, construct training data, conduct experiments, and use the results to refine subsequent proposals. Semantic slices and a shared research memory connect these actions across the model family\u0027s development. With training recipes comprising hundreds of thousands of examples, data selection and feedback-driven refinement are central to the self-improvement process. Our large-scale RSI exploration yields three counter-intuitive insights for decision-model development: (1) Backbone-recipe co-adaptation outweighs raw model recency: earlier backbones can surpass newer generations on visual tasks under identical recipes; (2) Targeted data curation enables 4B-9B models to rival 27B baselines on specialized workflows; and (3) Continuous loss reduction can decouple from and even degrade discrete decision accuracy. Together with the released weights and tools from the Data-Juicer and AgentScope ecosystems, Piccolo provides an actionable blueprint for building frontier decision models and scaling data-driven RSI.", "arxiv_id": "2611.24651", "arxiv_url": "https://arxiv.org/abs/2611.24651", "authors": ["Zhenqing Ling", "Qirui Jiao", "Daoyuan Chen", "Cheng Chen", "Xinji Mai", "Haowen Gao", "Zhuo Zhang", "Xuchen Pan", "Mengsu Ding", "Jiaji Deng", "Yuexiang Xie", "Xiaoming Qin", "Weirui Kuang", "Zhaoyang Liu", "Yaliang Li", "Bolin Ding", "Jingren Zhou"], "brief": "Piccolo\u662f\u4e00\u7ec40.8B\u81f327B\u591a\u6a21\u6001\u51b3\u7b56\u6a21\u578b\uff0c\u4e3a\u5019\u9009\u7b54\u6848\u9884\u6d4b\u6982\u7387\u3002\u7814\u7a76\u667a\u80fd\u4f53\u5206\u6790\u884c\u4e3a\u3001\u6784\u5efa\u6570\u636e\u5e76\u5f00\u5c55\u5b9e\u9a8c\uff0c\u4ee5\u5171\u4eab\u7814\u7a76\u8bb0\u5fc6\u4e32\u8054\u53cd\u9988\uff0c\u534f\u540c\u6539\u8fdb\u6a21\u578b\u4e0e\u8bad\u7ec3\u914d\u65b9\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV"], "github_repo": "https://github.com/agentscope-ai/Piccolo", "github_stars": 58, "hf_url": "https://huggingface.co/papers/2611.24651", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["27B\u4ee575.59\u5206\u767b\u9876Decision Index\u89c6\u89c9\u5b8c\u6574\u699c", "\u5b9a\u5411\u6570\u636e\u7b5b\u9009\u4f7f4B\u81f39B\u6a21\u578b\u5728\u4e13\u95e8\u5de5\u4f5c\u6d41\u4e2d\u63a5\u8fd127B\u57fa\u7ebf", "RSI\u5b9e\u9a8c\u53d1\u73b0\uff1a\u635f\u5931\u6301\u7eed\u4e0b\u964d\u4ecd\u53ef\u80fd\u964d\u4f4e\u79bb\u6563\u51b3\u7b56\u51c6\u786e\u7387"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u6570\u636e\u5de5\u7a0b", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "agentscope-ai", "pdf_url": "https://arxiv.org/pdf/2611.24651v1", "published_at": "2026-11-18", "score": 0.457, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24651.png", "title": "Piccolo: Co-Evolving Decision Models and Data through Recursive Self-Improvement", "tldr": "\u901a\u8fc7\u7814\u7a76\u667a\u80fd\u4f53\u9012\u5f52\u6539\u8fdb\u6570\u636e\u4e0e\u6a21\u578b\uff0c\u8ba9\u5c0f\u578b\u591a\u6a21\u6001\u51b3\u7b56\u6a21\u578b\u903c\u8fd1\u5927\u6a21\u578b\u3002", "upvotes": 11, "what_it_is": "Piccolo\u662f\u4e00\u7ec40.8B\u81f327B\u591a\u6a21\u6001\u51b3\u7b56\u6a21\u578b\uff0c\u4e3a\u5019\u9009\u7b54\u6848\u9884\u6d4b\u6982\u7387\u3002\u7814\u7a76\u667a\u80fd\u4f53\u5206\u6790\u884c\u4e3a\u3001\u6784\u5efa\u6570\u636e\u5e76\u5f00\u5c55\u5b9e\u9a8c\uff0c\u4ee5\u5171\u4eab\u7814\u7a76\u8bb0\u5fc6\u4e32\u8054\u53cd\u9988\uff0c\u534f\u540c\u6539\u8fdb\u6a21\u578b\u4e0e\u8bad\u7ec3\u914d\u65b9\u3002", "why_notable": "\u628a\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u843d\u5b9e\u4e3a\u53ef\u6267\u884c\u7684\u6570\u636e\u4e0e\u5b9e\u9a8c\u95ed\u73af\uff0c\u5e76\u5f00\u653e\u6743\u91cd\u548c\u5de5\u5177\uff1b\u7ed3\u679c\u63d0\u793a\uff0c\u6570\u636e\u914d\u65b9\u9002\u914d\u6bd4\u5355\u7eaf\u8ffd\u9010\u66f4\u65b0\u3001\u66f4\u5927\u7684\u9aa8\u5e72\u66f4\u5173\u952e\u3002"}, {"abstract": "Frontier post-training follows a common recipe: train one expert per domain with reinforcement learning (RL), then consolidate the experts into one model via multi-teacher on-policy distillation (MOPD). Such consolidation is expensive: the student samples in every environment again, an expert scores every sampled token, and the student inherits the drift of the final experts. Yet we argue that the experts\u0027 RL runs have already produced what consolidation needs: rollouts with their sampling probabilities and rewards, in the order the experts learned from them. We propose multi-expert replay policy distillation (MRPD), which replays these training logs through the student in the experts\u0027 order. At each step, the policy gradient is recomputed on these scored trajectories, and the final experts\u0027 distributions are distilled at the logged prefixes. Following the experts\u0027 own trajectory reduces the training-inference mismatch and keeps the student within the clip range, so the replay is off-policy in origin but quasi-on-policy throughout consolidation. MRPD samples nothing and calls no environment or reward model: the trainer is the sole process, and consolidating the experts costs only about a seventh of the compute used to train them. On three long-horizon agentic domains (reasoning, search and SQL), MRPD yields the best student model, substantially outperforming online RL baselines, and surpassing MOPD from the same experts at a fraction of MOPD\u0027s cost. Our analysis on the same logs shows that the replayed trajectories carry most of the gain, and that both the policy gradient and the distillation term add to it. Most interestingly, the order of the logs matters more than their amount or rewards, suggesting that expert training logs are a curriculum, not a data mixture.", "arxiv_id": "2611.24059", "arxiv_url": "https://arxiv.org/abs/2611.24059", "authors": ["Zhenrui Yue", "Gongxiaohui Chen", "Huimin Zeng", "Honglei Zhuang", "Jiashuo Sun", "Zhen Han", "Dong Wang"], "brief": "\u63d0\u51fa\u591a\u4e13\u5bb6\u91cd\u653e\u7b56\u7565\u84b8\u998fMRPD\uff0c\u6309\u4e13\u5bb6\u8bad\u7ec3\u987a\u5e8f\u91cd\u653e\u542b\u91c7\u6837\u6982\u7387\u4e0e\u5956\u52b1\u7684\u8f68\u8ff9\uff0c\u91cd\u65b0\u8ba1\u7b97\u7b56\u7565\u68af\u5ea6\uff0c\u5e76\u5728\u65e5\u5fd7\u524d\u7f00\u4e0a\u84b8\u998f\u6700\u7ec8\u4e13\u5bb6\u7684\u5206\u5e03\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/Yueeeeeeee/MRPD", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.24059", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["MRPD\u65e0\u9700\u91c7\u6837\u3001\u73af\u5883\u4ea4\u4e92\u6216\u5956\u52b1\u6a21\u578b\u8c03\u7528", "\u878d\u5408\u7b97\u529b\u7ea6\u4e3a\u4e13\u5bb6\u8bad\u7ec3\u76841/7\uff0c\u4e09\u7c7b\u4efb\u52a1\u4f18\u4e8eMOPD", "\u65e5\u5fd7\u91cd\u653e\u987a\u5e8f\u6bd4\u6570\u636e\u91cf\u6216\u5956\u52b1\u66f4\u91cd\u8981"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u7ecf\u9a8c\u91cd\u653e", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2611.24059v1", "published_at": "2026-11-18", "score": 0.403, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24059.png", "title": "Replay, Don\u0027t Resample: Off-Policy Consolidation of Long-Horizon RL Experts", "tldr": "\u6309\u4e13\u5bb6\u5b66\u4e60\u987a\u5e8f\u91cd\u653e\u5f3a\u5316\u5b66\u4e60\u65e5\u5fd7\uff0c\u65e0\u9700\u91cd\u65b0\u91c7\u6837\u5373\u53ef\u4f4e\u6210\u672c\u878d\u5408\u957f\u7a0b\u80fd\u529b\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u591a\u4e13\u5bb6\u91cd\u653e\u7b56\u7565\u84b8\u998fMRPD\uff0c\u6309\u4e13\u5bb6\u8bad\u7ec3\u987a\u5e8f\u91cd\u653e\u542b\u91c7\u6837\u6982\u7387\u4e0e\u5956\u52b1\u7684\u8f68\u8ff9\uff0c\u91cd\u65b0\u8ba1\u7b97\u7b56\u7565\u68af\u5ea6\uff0c\u5e76\u5728\u65e5\u5fd7\u524d\u7f00\u4e0a\u84b8\u998f\u6700\u7ec8\u4e13\u5bb6\u7684\u5206\u5e03\u3002", "why_notable": "\u5c06\u4e13\u5bb6\u8bad\u7ec3\u65e5\u5fd7\u53d8\u6210\u53ef\u590d\u7528\u7684\u5b66\u4e60\u8bfe\u7a0b\uff0c\u5728\u63a8\u7406\u3001\u641c\u7d22\u548cSQL\u4efb\u52a1\u4e0a\u964d\u4f4e\u878d\u5408\u6210\u672c\uff0c\u5e76\u63ed\u793a\u5b66\u4e60\u987a\u5e8f\u5bf9\u80fd\u529b\u8fc1\u79fb\u7684\u91cd\u8981\u6027\u3002"}, {"abstract": "Video rough-cut is a core stage in media production workflows, organizing raw media materials into an initial video cut. Despite recent advances in large vision-language models (LVLMs) for video-related tasks, automatic rough-cut remains underexplored, without a comprehensive benchmark for evaluation or mature workflows for producing executable cut plans. To address the evaluation gap, we introduce RoughCut-Bench, which covers two practical settings: (1) a visually driven setting over video cases, covering highlight detection and selection, source-video ordering, and adherence to user requirements when provided; and (2) a speech-driven setting over automatic speech recognition (ASR) transcripts, covering filler removal, expression deduplication, and low-value content trimming. Across these settings, the benchmark contains 101 visually driven cases, including 831 raw videos with 1,476 highlight annotations. It also includes 84 speech-driven cases, each consisting of an ASR transcript with annotated cleanup spans. The evaluation compares cut plans with these annotations in both settings and additionally uses a human-aligned agentic evaluator to assess rendered-cut quality in the visual setting. To apply LVLMs to automatic rough-cut, we further propose agentic workflows that guide them to produce structured cut plans from input materials. Experiments show that current LVLMs remain limited in producing expert-aligned cut plans. Our benchmark, code, and prompts are released at https://whalesong-zrs.github.io/RoughCut-Bench-Project-Page.", "arxiv_id": "2611.24098", "arxiv_url": "https://arxiv.org/abs/2611.24098", "authors": ["Ruisi Zhao", "You Li", "Sihan Chen", "Aosong Cheng", "Chixiang Ma", "Sen Pei", "Zhen Yang", "Hehe Fan", "Dongliang He", "Yi Yang"], "brief": "\u63d0\u51fa\u8986\u76d6\u89c6\u9891\u7d20\u6750\u548c\u8bed\u97f3\u8f6c\u5199\u7684\u81ea\u52a8\u7c97\u526a\u57fa\u51c6\uff0c\u5e76\u8bbe\u8ba1\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u751f\u6210\u7ed3\u6784\u5316\u526a\u8f91\u65b9\u6848\u3002\u7ed3\u5408\u6807\u6ce8\u5bf9\u9f50\u4e0e\u8d34\u8fd1\u4eba\u5de5\u5224\u65ad\u7684\u667a\u80fd\u4f53\u8bc4\u4f30\u5668\uff0c\u68c0\u9a8c\u65b9\u6848\u548c\u6210\u7247\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Whalesong-zrs/RoughCut-Bench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.24098", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u89c6\u89c9\u573a\u666f\u542b101\u4f8b\u3001831\u6bb5\u89c6\u9891\u53ca1476\u5904\u9ad8\u5149\u6807\u6ce8", "\u8bed\u97f3\u573a\u666f\u542b84\u4f8bASR\u8f6c\u5199\uff0c\u6807\u6ce8\u8d58\u8bcd\u4e0e\u5197\u4f59\u6e05\u7406\u533a\u95f4", "\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u751f\u6210\u7ed3\u6784\u5316\u526a\u8f91\u65b9\u6848\uff0c\u8bc4\u4f30\u5668\u68c0\u9a8c\u6210\u7247\u8d28\u91cf"], "keywords": ["\u89c6\u9891\u526a\u8f91", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.24098v1", "published_at": "2026-11-18", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24098.png", "title": "RoughCut-Bench: A Benchmark for Automatic Video Rough-Cut with Large Vision-Language Models", "tldr": "\u6784\u5efa\u89c6\u89c9\u4e0e\u8bed\u97f3\u53cc\u573a\u666f\u7c97\u526a\u57fa\u51c6\uff0c\u63ed\u793a\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e0e\u4e13\u5bb6\u526a\u8f91\u7684\u5dee\u8ddd\u3002", "upvotes": 9, "what_it_is": "\u63d0\u51fa\u8986\u76d6\u89c6\u9891\u7d20\u6750\u548c\u8bed\u97f3\u8f6c\u5199\u7684\u81ea\u52a8\u7c97\u526a\u57fa\u51c6\uff0c\u5e76\u8bbe\u8ba1\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u751f\u6210\u7ed3\u6784\u5316\u526a\u8f91\u65b9\u6848\u3002\u7ed3\u5408\u6807\u6ce8\u5bf9\u9f50\u4e0e\u8d34\u8fd1\u4eba\u5de5\u5224\u65ad\u7684\u667a\u80fd\u4f53\u8bc4\u4f30\u5668\uff0c\u68c0\u9a8c\u65b9\u6848\u548c\u6210\u7247\u8d28\u91cf\u3002", "why_notable": "\u5c06\u6a21\u578b\u8bc4\u6d4b\u63a8\u8fdb\u5230\u53ef\u6267\u884c\u526a\u8f91\u65b9\u6848\u4e0e\u6210\u7247\u8d28\u91cf\u5c42\u9762\uff0c\u8865\u9f50\u81ea\u52a8\u7c97\u526a\u7684\u8bc4\u6d4b\u7f3a\u53e3\uff1b\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u6a21\u578b\u4ecd\u96be\u751f\u6210\u7b26\u5408\u4e13\u5bb6\u5224\u65ad\u7684\u65b9\u6848\u3002"}, {"abstract": "Fine-grained questions about long videos ask how many times an action occurs, in what order events unfold, or exactly when a state changes. Answering them can require finding brief moments scattered across hours of footage. Agentic models that decide when and where to look promise to find these moments, yet this ability is hard both to measure and to learn. Sparse supporting evidence may establish that an action occurred without establishing its total count; verifying timeline-wide claims requires checking for missed occurrences and double counting. Answer-only supervision, in turn, does not explicitly supervise the search for evidence. We present NexSight, which builds verifiable tasks to both evaluate and train agentic long-video understanding. Its agentic pipeline, SightForge, accepts a task only if a verifier blind to the draft answer can reconstruct it from evidence densely reacquired from the raw video and counterexample checks fail to refute it. This yields SightLine, 310 evidence-traceable tasks from 108 long videos, evaluated through SightLoop, a shared multiscale harness supporting temporal exploration, local inspection, evidence integration, and revisiting while recording returned observations. On disjoint videos, solver trajectories on verified tasks become step-level supervision for observation decisions. The strongest model reaches only 54.52% on SightLine, yet 79.35% when given the annotated evidence. With under 6K examples, Sight-35B nearly doubles its base model\u0027s interactive accuracy (21.29% to 42.26%), outperforms the 397B model of its family, begins using explicit spatial inspection after post-training, which its base model never uses, and gains over 8 points on two external long-video benchmarks.", "arxiv_id": "2611.22790", "arxiv_url": "https://arxiv.org/abs/2611.22790", "authors": ["Tianci Xie", "Li Chen", "Pinxue Guo", "Rui Zheng"], "brief": "\u63d0\u51fa\u4efb\u52a1\u9a8c\u8bc1\u3001\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u4e00\u4f53\u5316\u6d41\u7a0b\uff1a\u901a\u8fc7\u5bc6\u96c6\u91cd\u91c7\u6837\u8bc1\u636e\u548c\u53cd\u4f8b\u68c0\u67e5\u7b5b\u9009\u4efb\u52a1\uff0c\u518d\u5c06\u89e3\u9898\u8f68\u8ff9\u8f6c\u4e3a\u89c2\u5bdf\u51b3\u7b56\u7684\u9010\u6b65\u76d1\u7763\uff0c\u8bad\u7ec3\u4e3b\u52a8\u63a2\u7d22\u957f\u89c6\u9891\u7684\u667a\u80fd\u4f53\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.22790", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["SightForge\u4ee5\u76f2\u7b54\u6848\u9a8c\u8bc1\u4e0e\u53cd\u4f8b\u68c0\u67e5\u7b5b\u9009\u4efb\u52a1", "SightLine\u542b108\u90e8\u957f\u89c6\u9891\u7684310\u4e2a\u53ef\u8ffd\u6eaf\u4efb\u52a1", "\u4e0d\u8db36\u5343\u6837\u4f8b\u4f7fSight-35B\u51c6\u786e\u7387\u4ece21.29%\u5347\u81f342.26%"], "keywords": ["\u957f\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u8bc1\u636e\u9a8c\u8bc1", "\u76d1\u7763\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": "Nex AGI", "pdf_url": "https://arxiv.org/pdf/2611.22790v1", "published_at": "2026-11-17", "score": 0.399, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22790.png", "title": "NexSight: Verifiable Tasks for Fine-Grained Agentic Long-Video Understanding", "tldr": "\u7528\u53ef\u6838\u9a8c\u8bc1\u636e\u6784\u5efa\u957f\u89c6\u9891\u4efb\u52a1\uff0c\u5e76\u4ee5\u9010\u6b65\u76d1\u7763\u63d0\u5347\u667a\u80fd\u4f53\u7684\u4e3b\u52a8\u68c0\u7d22\u80fd\u529b\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51fa\u4efb\u52a1\u9a8c\u8bc1\u3001\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u4e00\u4f53\u5316\u6d41\u7a0b\uff1a\u901a\u8fc7\u5bc6\u96c6\u91cd\u91c7\u6837\u8bc1\u636e\u548c\u53cd\u4f8b\u68c0\u67e5\u7b5b\u9009\u4efb\u52a1\uff0c\u518d\u5c06\u89e3\u9898\u8f68\u8ff9\u8f6c\u4e3a\u89c2\u5bdf\u51b3\u7b56\u7684\u9010\u6b65\u76d1\u7763\uff0c\u8bad\u7ec3\u4e3b\u52a8\u63a2\u7d22\u957f\u89c6\u9891\u7684\u667a\u80fd\u4f53\u3002", "why_notable": "\u6700\u5f3a\u6a21\u578b\u81ea\u4e3b\u4f5c\u7b54\u4ec554.52%\uff0c\u7ed9\u5b9a\u8bc1\u636e\u5219\u8fbe79.35%\uff0c\u51f8\u663e\u8bc1\u636e\u641c\u7d22\u74f6\u9888\uff1b\u9010\u6b65\u76d1\u7763\u4e5f\u6539\u5584\u4e86\u5916\u90e8\u957f\u89c6\u9891\u8bc4\u6d4b\u8868\u73b0\u3002"}, {"abstract": "Organizations increasingly deploy downloaded open-weight GUI agents. A backdoored agent passes acceptance tests on clean data and misbehaves only when a visual trigger appears on screen, turning an unvetted checkpoint into a supply-chain risk. However, existing sample-level detectors target image classifiers and CLIP-style encoders, leaving step-level backdoor detection for GUI agents unaddressed. On clean steps, the instruction drives the action; when an unreferenced screen region hijacks the step, the instruction loses control over the decision state or that region dictates it instead. We term this signature intent--evidence dominance inversion and propose IDEA (Intent-Dominance Evidence Audit) to detect backdoor activation at inference time for each step without trigger knowledge or attack data. Specifically, Intent Counterfactual Probing (ICP) measures how far redirected instructions move the decision state, and Region Causal Audit (RCA) quantifies how far ablating a candidate region moves it. A gated conformal score compares both displacements against clean steps at the same distance from the clean manifold, providing a finite-sample false-positive guarantee. Extensive experiments on Qwen2.5-VL-3B across five attack families show that IDEA consistently detects backdoor activation under a controlled false-positive rate and outperforms state-of-the-art detection methods, while localizing the trigger region for every alarm and adding only modest inference overhead.", "arxiv_id": "2611.24102", "arxiv_url": "https://arxiv.org/abs/2611.24102", "authors": ["Zhizhuo Kou", "Sizai Hou", "Jian Yang", "Ge Sun", "Junyu Luo", "Wenkai Zhang", "Sirui Han", "Yike Guo"], "brief": "IDEA\u5728\u63a8\u7406\u65f6\u68c0\u6d4bGUI\u667a\u80fd\u4f53\u7684\u540e\u95e8\u6fc0\u6d3b\uff0c\u65e0\u9700\u5df2\u77e5\u89e6\u53d1\u5668\u6216\u653b\u51fb\u6570\u636e\u3002\u5b83\u901a\u8fc7\u6539\u5199\u6307\u4ee4\u4e0e\u6d88\u878d\u5c4f\u5e55\u533a\u57df\uff0c\u6bd4\u8f83\u4e24\u8005\u5bf9\u51b3\u7b56\u72b6\u6001\u7684\u5f71\u54cd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.24102", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["ICP\u7528\u53cd\u4e8b\u5b9e\u6307\u4ee4\u63a2\u6d4b\u51b3\u7b56\u72b6\u6001\u7684\u53d8\u5316\u5e45\u5ea6\u3002", "RCA\u6d88\u878d\u5019\u9009\u533a\u57df\uff0c\u91cf\u5316\u5176\u56e0\u679c\u5f71\u54cd\u5e76\u5b9a\u4f4d\u89e6\u53d1\u5668\u3002", "\u95e8\u63a7\u4fdd\u5f62\u8bc4\u5206\u63d0\u4f9b\u6709\u9650\u6837\u672c\u8bef\u62a5\u4fdd\u8bc1\uff0c\u6d4b\u8bd5\u8986\u76d6\u4e94\u7c7b\u653b\u51fb\u3002"], "keywords": ["\u754c\u9762\u667a\u80fd\u4f53", "\u540e\u95e8\u68c0\u6d4b", "\u56e0\u679c\u5ba1\u8ba1", "\u4fdd\u5f62\u9884\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "HUAWEI Noah\u0027s Ark Lab", "pdf_url": "https://arxiv.org/pdf/2611.24102v1", "published_at": "2026-11-18", "score": 0.393, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24102.png", "title": "IDEA: Intent-Dominance Evidence Audit for Inference-Time Backdoor Detection in GUI Agents", "tldr": "\u901a\u8fc7\u5ba1\u8ba1\u6307\u4ee4\u4e0e\u5c4f\u5e55\u533a\u57df\u7684\u51b3\u7b56\u5f71\u54cd\uff0c\u9010\u6b65\u68c0\u6d4b\u5e76\u5b9a\u4f4d\u754c\u9762\u667a\u80fd\u4f53\u540e\u95e8\u6fc0\u6d3b\u3002", "upvotes": 3, "what_it_is": "IDEA\u5728\u63a8\u7406\u65f6\u68c0\u6d4bGUI\u667a\u80fd\u4f53\u7684\u540e\u95e8\u6fc0\u6d3b\uff0c\u65e0\u9700\u5df2\u77e5\u89e6\u53d1\u5668\u6216\u653b\u51fb\u6570\u636e\u3002\u5b83\u901a\u8fc7\u6539\u5199\u6307\u4ee4\u4e0e\u6d88\u878d\u5c4f\u5e55\u533a\u57df\uff0c\u6bd4\u8f83\u4e24\u8005\u5bf9\u51b3\u7b56\u72b6\u6001\u7684\u5f71\u54cd\u3002", "why_notable": "\u5c06\u540e\u95e8\u68c0\u6d4b\u4ece\u56fe\u50cf\u6837\u672c\u63a8\u8fdb\u5230\u667a\u80fd\u4f53\u6267\u884c\u6b65\u9aa4\uff1b\u5728Qwen2.5-VL-3B\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u540c\u65f6\u5b9a\u4f4d\u89e6\u53d1\u533a\u57df\u4e14\u989d\u5916\u5f00\u9500\u8f83\u5c0f\u3002"}, {"abstract": "Multi-step visual reasoning suffers when early visual misinterpretations persist as incorrect premises in subsequent reasoning. We argue that how visual evidence is represented during reasoning matters as much as how much of it is gathered. Rather than appending observations and inferences to an ever-growing dialogue, we introduce a Visual Board-centered harness that separates visual observations, uncertain interpretations, and derived reasoning within a structured, capacity-bounded, and revisable workspace. This separation makes each premise explicit and auditable, so that conflicts between what is seen and what is derived become detectable even by a text-only critic and can trigger targeted reinspection of the original image. Without task-specific training, our harness consistently outperforms standalone models across 4B, 8B, Qwen3-VL-Flash, and 32B configurations on Euclid30K, SolidGeo, and ChartQA bar charts, with gains of up to 11.68, 18.42, and 24.82 percentage points, respectively. Under identical tools, critic, and interaction limits, the structured Board outperforms shared free-form notes by 6.67 to 13.00 points and no-Board retries by 7.35 to 18.80 points while using 7.9\\% to 38.2\\% fewer tokens. Supervised fine-tuning on harness trajectories further improves direct answering and critic-free tool use, with positive transfer to chart reasoning.", "arxiv_id": "2611.23872", "arxiv_url": "https://arxiv.org/abs/2611.23872", "authors": ["Haiming Zhu", "Zhiwei Chen", "Ding Cao", "Tianxiang Zhao"], "brief": "\u63d0\u51fa\u4ee5Visual Board\u4e3a\u4e2d\u5fc3\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u89c6\u89c9\u89c2\u5bdf\u3001\u4e0d\u786e\u5b9a\u89e3\u91ca\u548c\u63a8\u7406\u5206\u5f00\u5b58\u50a8\u3002\u901a\u8fc7\u5bb9\u91cf\u53d7\u9650\u4e14\u53ef\u4fee\u8ba2\u7684\u5de5\u4f5c\u533a\uff0c\u8ba9\u6587\u672c\u5ba1\u67e5\u5668\u53d1\u73b0\u51b2\u7a81\u5e76\u89e6\u53d1\u539f\u56fe\u5b9a\u5411\u590d\u67e5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23872", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u65e0\u9700\u4efb\u52a1\u4e13\u7528\u8bad\u7ec3\uff0c\u8986\u76d64B\u81f332B\u7b49\u6a21\u578b\u914d\u7f6e", "\u4e09\u7c7b\u57fa\u51c6\u6700\u9ad8\u63d0\u534711.68\u300118.42\u300124.82\u4e2a\u767e\u5206\u70b9", "\u6bd4\u81ea\u7531\u7b14\u8bb0\u9ad86.67\u81f313\u4e2a\u767e\u5206\u70b9\uff0c\u4e14\u66f4\u7701\u4ee4\u724c"], "keywords": ["\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u89c6\u89c9\u63a8\u7406", "\u5de5\u4f5c\u8bb0\u5fc6", "\u9519\u8bef\u7ea0\u6b63"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23872v1", "published_at": "2026-11-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Keep the Image in Mind: A Visual Board for Multimodal Agents", "tldr": "\u7528\u53ef\u4fee\u8ba2\u89c6\u89c9\u5de5\u4f5c\u677f\u5206\u79bb\u8bc1\u636e\u4e0e\u63a8\u65ad\uff0c\u51cf\u5c11\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u8fde\u9501\u8bef\u5224\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4ee5Visual Board\u4e3a\u4e2d\u5fc3\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u89c6\u89c9\u89c2\u5bdf\u3001\u4e0d\u786e\u5b9a\u89e3\u91ca\u548c\u63a8\u7406\u5206\u5f00\u5b58\u50a8\u3002\u901a\u8fc7\u5bb9\u91cf\u53d7\u9650\u4e14\u53ef\u4fee\u8ba2\u7684\u5de5\u4f5c\u533a\uff0c\u8ba9\u6587\u672c\u5ba1\u67e5\u5668\u53d1\u73b0\u51b2\u7a81\u5e76\u89e6\u53d1\u539f\u56fe\u5b9a\u5411\u590d\u67e5\u3002", "why_notable": "\u628a\u7ea0\u9519\u91cd\u70b9\u4ece\u589e\u52a0\u89c2\u5bdf\u8f6c\u5411\u7ec4\u7ec7\u8bc1\u636e\uff0c\u5728\u76f8\u540c\u5de5\u5177\u4e0e\u4ea4\u4e92\u9650\u5236\u4e0b\u63d0\u5347\u51c6\u786e\u7387\u5e76\u964d\u4f4e\u4ee4\u724c\u6d88\u8017\uff0c\u4e3a\u591a\u6b65\u89c6\u89c9\u63a8\u7406\u63d0\u4f9b\u53ef\u5ba1\u8ba1\u7684\u5de5\u4f5c\u673a\u5236\u3002"}, {"abstract": "Native mobile GUI agents require large-scale training trajectories covering both individual app functions and multi-goal workflows within and across apps, which makes automatic task synthesis a promising way to scale training data. Existing synthesis pipelines, however, produce each task as free-form text, leaving implicit how its subgoals depend on one another. This matters because composition is a skill in its own right: a policy may complete each subtask of a workflow on its own, yet fail to chain these subtasks into the complete workflow. We present MobileWeave, which instead synthesizes every task as an executable program derived from the app implementations of a controllable simulator. MobileWeave abstracts each app into a typed capability graph with semantic types shared across apps, composes atomic programs into single- and cross-app composite programs through explicit value and object dependencies, and verifies each program by native execution, deriving both its instruction and its completion check from the same program. Trained on teacher trajectories collected for these tasks and on recovery supervision at the policy\u0027s own stalls, MobileWeave-8B improves its base model by 26.7 points on MobileGym and by 8.6, 21.3, and 17.6 points on AndroidWorld, AndroidLab, and MobileWorld, with comparable gains at 4B. Beyond these gains, we find that composition is learnable from task structure: explicit dependencies between subgoals act as a training signal that teaches a policy to compose skills it already masters. We release data, model, and code at https://maxxnotmarx.github.io/MobileWeave/ .", "arxiv_id": "2611.23860", "arxiv_url": "https://arxiv.org/abs/2611.23860", "authors": ["Ziyi He", "Xian Wu", "Qiyuan Chen", "Haitao Li", "Cehao Yang", "Yinghao Zhu", "Xichen Zhang", "Xiao Chen", "Yushi Feng", "Lequan Yu"], "brief": "MobileWeave\u4ece\u6a21\u62df\u5668\u5e94\u7528\u5b9e\u73b0\u63d0\u53d6\u7c7b\u578b\u5316\u80fd\u529b\u56fe\uff0c\u4ee5\u663e\u5f0f\u4f9d\u8d56\u7ec4\u5408\u53ef\u6267\u884c\u4efb\u52a1\u7a0b\u5e8f\u3002\u7a0b\u5e8f\u7ecf\u539f\u751f\u6267\u884c\u9a8c\u8bc1\uff0c\u5e76\u7edf\u4e00\u751f\u6210\u6307\u4ee4\u4e0e\u5b8c\u6210\u68c0\u67e5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23860", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5171\u4eab\u8bed\u4e49\u7c7b\u578b\uff0c\u4ee5\u503c\u548c\u5bf9\u8c61\u4f9d\u8d56\u7ec4\u5408\u8de8\u5e94\u7528\u7a0b\u5e8f", "\u7ed3\u5408\u6559\u5e08\u8f68\u8ff9\u4e0e\u7b56\u7565\u505c\u6ede\u65f6\u7684\u6062\u590d\u76d1\u7763\u8bad\u7ec3", "8B\u6a21\u578b\u5728\u56db\u9879\u57fa\u51c6\u63d0\u53478.6\u81f326.7\u5206"], "keywords": ["\u79fb\u52a8\u667a\u80fd\u4f53", "\u4efb\u52a1\u5408\u6210", "\u7a0b\u5e8f\u751f\u6210", "\u7ec4\u5408\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23860v1", "published_at": "2026-11-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MobileWeave: Program-First Synthesis of Dependency-Linked Tasks for Training Mobile GUI Agents", "tldr": "\u7528\u53ef\u6267\u884c\u7a0b\u5e8f\u751f\u6210\u4f9d\u8d56\u660e\u786e\u7684\u624b\u673a\u4efb\u52a1\uff0c\u8bad\u7ec3\u667a\u80fd\u4f53\u7ec4\u5408\u8de8\u5e94\u7528\u6280\u80fd\u3002", "upvotes": 0, "what_it_is": "MobileWeave\u4ece\u6a21\u62df\u5668\u5e94\u7528\u5b9e\u73b0\u63d0\u53d6\u7c7b\u578b\u5316\u80fd\u529b\u56fe\uff0c\u4ee5\u663e\u5f0f\u4f9d\u8d56\u7ec4\u5408\u53ef\u6267\u884c\u4efb\u52a1\u7a0b\u5e8f\u3002\u7a0b\u5e8f\u7ecf\u539f\u751f\u6267\u884c\u9a8c\u8bc1\uff0c\u5e76\u7edf\u4e00\u751f\u6210\u6307\u4ee4\u4e0e\u5b8c\u6210\u68c0\u67e5\u3002", "why_notable": "\u628a\u5b50\u76ee\u6807\u4f9d\u8d56\u53d8\u6210\u53ef\u5b66\u4e60\u7684\u8bad\u7ec3\u4fe1\u53f7\uff0c\u5e2e\u52a9\u667a\u80fd\u4f53\u4e32\u8054\u5df2\u638c\u63e1\u7684\u6280\u80fd\uff1b\u8de8\u57fa\u51c6\u63d0\u5347\u4e0e\u6570\u636e\u3001\u6a21\u578b\u3001\u4ee3\u7801\u5f00\u653e\u589e\u5f3a\u4e86\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Graphical user interface (GUI) agents are widely trained in executable GUI environments. To lower cost, build environments in batches, and reduce manual effort, each work trades away part of the environment through its construction choices. We describe these choices along three dimensions: reward coverage, the goal-reaching trajectories the verifier rewards; data coverage, the application data the agent is exposed to beyond what the task reads or writes; and feature coverage, the application features beyond what the task uses. Existing works set each dimension on engineering grounds, but they do not measure its effect on training. How complete must an environment be to train a capable agent, and along which dimensions? In MobileGym, we adjust each dimension separately, train Qwen3-VL-4B-Instruct, and evaluate every policy in the original full environment. A verifier that rewards only one reference path lowers success by 10.53 points, and removing unneeded records also lowers success. Pruning unneeded features instead raises success from 51.61% to 56.13%, entirely on tasks whose environments it left unchanged. The gain reverses when each episode is weighted equally and vanishes when only episodes on the pruned tasks are balanced. Without pruning, length weighting there reinforces long detour successes that erode skills on other tasks. Following these findings, we build MobileGym-Lite, which keeps reward and data coverage complete and prunes unneeded features. It outperforms Full in the full environment (55.48% versus 51.61% success) with lower construction cost.", "arxiv_id": "2611.23946", "arxiv_url": "https://arxiv.org/abs/2611.23946", "authors": ["Jingxing Wang", "Teng Wang", "Xingyu Lou", "Zihan Guo", "Jun Wang", "Weiwen Liu", "Weinan Zhang", "Jianghao Lin"], "brief": "\u7814\u7a76\u5728MobileGym\u4e2d\u5206\u522b\u63a7\u5236\u5956\u52b1\u3001\u6570\u636e\u4e0e\u529f\u80fd\u8986\u76d6\uff0c\u8bad\u7ec3Qwen3-VL-4B\u5e76\u5728\u5b8c\u6574\u73af\u5883\u8bc4\u6d4b\uff0c\u636e\u6b64\u6784\u5efa\u4fdd\u7559\u5956\u52b1\u548c\u6570\u636e\u3001\u88c1\u526a\u5197\u4f59\u529f\u80fd\u7684\u8f7b\u91cf\u73af\u5883\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23946", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u9a8c\u8bc1\u5668\u4ec5\u5956\u52b1\u5355\u6761\u53c2\u8003\u8def\u5f84\uff0c\u6210\u529f\u7387\u4e0b\u964d10.53\u4e2a\u767e\u5206\u70b9", "\u5220\u9664\u975e\u4efb\u52a1\u5fc5\u9700\u6570\u636e\u4e5f\u964d\u4f4e\u6210\u529f\u7387", "MobileGym-Lite\u6210\u529f\u738755.48%\uff0c\u5b8c\u6574\u73af\u5883\u4e3a51.61%"], "keywords": ["\u56fe\u5f62\u754c\u9762\u667a\u80fd\u4f53", "\u8bad\u7ec3\u73af\u5883", "\u5956\u52b1\u8bbe\u8ba1", "\u6570\u636e\u8986\u76d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23946v1", "published_at": "2026-11-18", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "How Complete Must an Environment Be to Train a Capable GUI Agent?", "tldr": "GUI\u8bad\u7ec3\u73af\u5883\u4e0d\u5fc5\u529f\u80fd\u9f50\u5168\uff0c\u4f46\u5e94\u4fdd\u7559\u5b8c\u6574\u5956\u52b1\u8def\u5f84\u4e0e\u6570\u636e\u8986\u76d6", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5728MobileGym\u4e2d\u5206\u522b\u63a7\u5236\u5956\u52b1\u3001\u6570\u636e\u4e0e\u529f\u80fd\u8986\u76d6\uff0c\u8bad\u7ec3Qwen3-VL-4B\u5e76\u5728\u5b8c\u6574\u73af\u5883\u8bc4\u6d4b\uff0c\u636e\u6b64\u6784\u5efa\u4fdd\u7559\u5956\u52b1\u548c\u6570\u636e\u3001\u88c1\u526a\u5197\u4f59\u529f\u80fd\u7684\u8f7b\u91cf\u73af\u5883\u3002", "why_notable": "\u4e3a\u4f4e\u6210\u672cGUI\u8bad\u7ec3\u73af\u5883\u63d0\u4f9b\u5b9e\u8bc1\u8bbe\u8ba1\u4f9d\u636e\uff1a\u5956\u52b1\u548c\u6570\u636e\u8986\u76d6\u5e94\u4fdd\u7559\uff0c\u529f\u80fd\u53ef\u88c1\u526a\uff1b\u540c\u65f6\u63ed\u793a\u6536\u76ca\u4e0e\u8bad\u7ec3\u4e2d\u7684\u8f68\u8ff9\u957f\u5ea6\u52a0\u6743\u6709\u5173\u3002"}, {"abstract": "Games are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring missing actions. Existing datasets also cover a limited range of games, often without explicit tasks or verifiable outcomes. To address these gaps, we introduce Game2Player, a framework that co-develops game environments and players to collect diverse and verifiable gameplay experience at scale. In the Game2Player loop, a Builder agent adapts existing web games, exposes their internal state, and defines tasks with state-based progress measures and success checks. A Coding Player and a VLM Player then attempt the tasks and report problems to the Builder for repair, so that play serves as both environment validation and training data collection. With Game2Player, we build 568 verified web games with 3,436 tasks, collect 15.7K trajectories (307 hours of gameplay), and hold out 50 games as the benchmark PlayerBench. To evaluate the collected experience as training data, we train VLM agents with progress-weighted SFT, assigning greater weight to steps that advance task progress. Game2Player-9B improves progress from 14.3% to 31.2% on PlayerBench and from 30.0% to 53.1% on the external GameWorld benchmark. More broadly, our work suggests a path for visual agents to scale their gameplay experience by building, verifying, and learning from existing game worlds.", "arxiv_id": "2611.24154", "arxiv_url": "https://arxiv.org/abs/2611.24154", "authors": ["Xirui Jiang", "Yuxi Chen", "Rui Yang", "Feng Luo", "Pengcheng Wang", "Bingxuan Li", "Zihao Zhao", "Yushan Li", "Han Wang", "Manling Li", "Yang Zhang", "Shiyu Chang", "Tong Zhang", "Huan Zhang"], "brief": "\u63d0\u51fa\u6e38\u620f\u73af\u5883\u4e0e\u73a9\u5bb6\u534f\u540c\u5f00\u53d1\u6846\u67b6\uff1a\u6784\u5efa\u667a\u80fd\u4f53\u6539\u9020\u7f51\u9875\u6e38\u620f\u5e76\u5b9a\u4e49\u53ef\u9a8c\u8bc1\u4efb\u52a1\uff0c\u4ee3\u7801\u4e0e\u89c6\u89c9\u8bed\u8a00\u73a9\u5bb6\u8bd5\u73a9\u53cd\u9988\u3001\u63a8\u52a8\u4fee\u590d\uff0c\u540c\u65f6\u91c7\u96c6\u8f68\u8ff9\u7528\u4e8e\u8fdb\u5ea6\u52a0\u6743\u8bad\u7ec3\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/game2player/Game2Player", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2611.24154", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa568\u6b3e\u9a8c\u8bc1\u6e38\u620f\u30013436\u9879\u4efb\u52a1\uff0c\u7559\u51fa50\u6b3e\u7ec4\u6210PlayerBench", "\u91c7\u96c61.57\u4e07\u6761\u8f68\u8ff9\u3001307\u5c0f\u65f6\u6e38\u620f\u7ecf\u9a8c\uff0c\u91c7\u7528\u8fdb\u5ea6\u52a0\u6743SFT", "9B\u6a21\u578b\u8fdb\u5ea6\uff1aPlayerBench\u8fbe31.2%\uff0cGameWorld\u8fbe53.1%"], "keywords": ["\u89c6\u89c9\u667a\u80fd\u4f53", "\u6e38\u620f\u73af\u5883", "\u5408\u6210\u6570\u636e", "\u76d1\u7763\u5fae\u8c03"], "num_comments": 3, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2611.24154v1", "published_at": "2026-11-18", "score": 0.321, "selected_reasons": ["HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.24154.png", "title": "Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development", "tldr": "\u901a\u8fc7\u73af\u5883\u4e0e\u73a9\u5bb6\u534f\u540c\u5f00\u53d1\uff0c\u89c4\u6a21\u5316\u751f\u6210\u53ef\u9a8c\u8bc1\u6e38\u620f\u7ecf\u9a8c\u5e76\u63d0\u5347\u89c6\u89c9\u667a\u80fd\u4f53\u80fd\u529b\u3002", "upvotes": 25, "what_it_is": "\u63d0\u51fa\u6e38\u620f\u73af\u5883\u4e0e\u73a9\u5bb6\u534f\u540c\u5f00\u53d1\u6846\u67b6\uff1a\u6784\u5efa\u667a\u80fd\u4f53\u6539\u9020\u7f51\u9875\u6e38\u620f\u5e76\u5b9a\u4e49\u53ef\u9a8c\u8bc1\u4efb\u52a1\uff0c\u4ee3\u7801\u4e0e\u89c6\u89c9\u8bed\u8a00\u73a9\u5bb6\u8bd5\u73a9\u53cd\u9988\u3001\u63a8\u52a8\u4fee\u590d\uff0c\u540c\u65f6\u91c7\u96c6\u8f68\u8ff9\u7528\u4e8e\u8fdb\u5ea6\u52a0\u6743\u8bad\u7ec3\u3002", "why_notable": "\u5c06\u73af\u5883\u9a8c\u8bc1\u4e0e\u8bad\u7ec3\u6570\u636e\u91c7\u96c6\u5408\u5e76\u4e3a\u95ed\u73af\uff0c\u964d\u4f4e\u5bf9\u4eba\u5de5\u6e38\u620f\u8bb0\u5f55\u7684\u4f9d\u8d56\uff1b\u5916\u90e8\u57fa\u51c6\u4e0a\u7684\u63d0\u5347\u663e\u793a\uff0c\u8fd9\u7c7b\u7ecf\u9a8c\u5177\u6709\u8de8\u6e38\u620f\u8fc1\u79fb\u4ef7\u503c\u3002"}, {"abstract": "Visual proxies decouple explicit world-state simulation from photorealistic video synthesis, offering a controllable interface for both offline clip creation and real-time interactive streaming. Yet a practical renderer must address two challenges. Upstream proxies vary from coarse layouts to fine articulated geometry depending on the interaction, and streaming inference must operate in a few causal steps without accumulating drift across self-generated history. We present Invoker-Render, pairing a bidirectional creation model with a causal four-step streaming model under a shared conditioning interface over structural proxies, an appearance reference, and language. Trained on an aligned approximately 200-hour multi-granularity corpus, Invoker-Render honors fine geometric constraints when supplied while synthesizing plausible local motion under coarse proxies, enabling runtime selection of input detail. To bridge bidirectional creation and real-time streaming without compounding step compression and rollout drift, we introduce Progressive Forcing (ProForcing). ProForcing first trains a causal predictor and distills it into a four-step renderer using histories derived from training videos. Training then shifts to continuous self-generated rollouts. A pipelined serving stack supports efficient streaming inference. Experiments show versatile control across proxy families, granularities, and camera paths, consistent gains over recent streaming baselines, and stable 30-minute racing rollouts that preserve scene and subject appearance.", "arxiv_id": "2611.22925", "arxiv_url": "https://arxiv.org/abs/2611.22925", "authors": ["Ruoyu Wang", "Hao Zhong", "Yanming Yang", "Jiahao Tian", "Lin Liu", "Biao Gong", "Guoshan Lu", "Yiding Tian", "Chunhua Shen", "Zhenzhong Lan", "Chi Zhang"], "brief": "Invoker-Render\u5c06\u53cc\u5411\u521b\u4f5c\u6a21\u578b\u4e0e\u56db\u6b65\u56e0\u679c\u6d41\u5f0f\u6a21\u578b\u914d\u5bf9\uff0c\u5171\u4eab\u7ed3\u6784\u4ee3\u7406\u3001\u5916\u89c2\u53c2\u8003\u548c\u8bed\u8a00\u6761\u4ef6\u3002\u901a\u8fc7\u6e10\u8fdb\u8bad\u7ec3\u517c\u987e\u51e0\u4f55\u63a7\u5236\u4e0e\u957f\u5e8f\u5217\u7a33\u5b9a\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/inclusionAI/CodeWorldModel", "github_stars": 132, "hf_url": "https://huggingface.co/papers/2611.22925", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7ea6200\u5c0f\u65f6\u5bf9\u9f50\u591a\u7c92\u5ea6\u6570\u636e\u652f\u6301\u7c97\u7ec6\u4ee3\u7406\u8f93\u5165", "ProForcing\u5148\u84b8\u998f\u56db\u6b65\u6a21\u578b\uff0c\u518d\u8bad\u7ec3\u81ea\u751f\u6210\u6eda\u52a8", "\u6d41\u6c34\u7ebf\u63a8\u7406\u5b9e\u73b0\u7a33\u5b9a30\u5206\u949f\u8d5b\u8f66\u89c6\u9891\u751f\u6210"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u53ef\u63a7\u751f\u6210", "\u5b9e\u65f6\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "inclusionAI", "pdf_url": "https://arxiv.org/pdf/2611.22925v2", "published_at": "2026-11-17", "score": 0.32, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22925.png", "title": "Code World Model 2.0: Towards Infinite Controllable Video Generation", "tldr": "\u4ee5\u591a\u7c92\u5ea6\u89c6\u89c9\u4ee3\u7406\u63a7\u5236\u89c6\u9891\u751f\u6210\uff0c\u56db\u6b65\u6d41\u5f0f\u63a8\u7406\u652f\u6301\u7a33\u5b9a\u534a\u5c0f\u65f6\u957f\u5e8f\u5217\u3002", "upvotes": 14, "what_it_is": "Invoker-Render\u5c06\u53cc\u5411\u521b\u4f5c\u6a21\u578b\u4e0e\u56db\u6b65\u56e0\u679c\u6d41\u5f0f\u6a21\u578b\u914d\u5bf9\uff0c\u5171\u4eab\u7ed3\u6784\u4ee3\u7406\u3001\u5916\u89c2\u53c2\u8003\u548c\u8bed\u8a00\u6761\u4ef6\u3002\u901a\u8fc7\u6e10\u8fdb\u8bad\u7ec3\u517c\u987e\u51e0\u4f55\u63a7\u5236\u4e0e\u957f\u5e8f\u5217\u7a33\u5b9a\u6027\u3002", "why_notable": "\u5c06\u8f93\u5165\u63a7\u5236\u7cbe\u5ea6\u4e0e\u5b9e\u65f6\u751f\u6210\u653e\u5230\u7edf\u4e00\u63a5\u53e3\u4e0b\uff0c\u5e76\u5206\u9636\u6bb5\u5904\u7406\u6b65\u6570\u538b\u7f29\u548c\u6eda\u52a8\u6f02\u79fb\uff0c\u4e3a\u53ef\u4ea4\u4e92\u957f\u65f6\u89c6\u9891\u63d0\u4f9b\u5b9e\u8bc1\u652f\u6491\u3002"}, {"abstract": "Agent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories) and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle: methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but because noisy evaluations cannot reliably identify them. Across seven evolution methods and six models (over 10M LLM calls), we find support for the hypothesis at both levels where evaluation scores are used. At the candidate level (choosing artifacts), helpful candidate artifacts exist, but selection is no better than random at telling them from harmful ones, so errors accumulate across rounds. At the method level (ranking methods), typical margins of a few percentage points are smaller than the difference between two independent runs of the same method, so published rankings often rest on luck. Together, these findings indicate that agent evolution is often bottlenecked by reliably identifying improvements. This calls for a shift in how we develop and evaluate self-improving agents, from designing ever more candidate improvement systems to making true improvements detectable and accumulable.", "arxiv_id": "2611.23068", "arxiv_url": "https://arxiv.org/abs/2611.23068", "authors": ["Yuanhao Zeng", "Shaocheng Lan", "Ao Lu", "Kuang Yan", "Heng Lin", "Xinang Xu", "Yuan Luo", "Yueting Wang", "Yexin Li", "Ruo Shan", "Kan Ren"], "brief": "\u63d0\u51fa\u5206\u8fa8\u7387\u5047\u8bf4\uff0c\u5c06\u667a\u80fd\u4f53\u6f14\u5316\u505c\u6ede\u5f52\u56e0\u4e8e\u8bc4\u4f30\u65e0\u6cd5\u53ef\u9760\u8bc6\u522b\u6539\u8fdb\u3002\u901a\u8fc7\u8de8\u65b9\u6cd5\u3001\u8de8\u6a21\u578b\u5b9e\u9a8c\uff0c\u5206\u522b\u68c0\u9a8c\u5019\u9009\u4ea7\u7269\u7b5b\u9009\u4e0e\u6f14\u5316\u65b9\u6cd5\u6392\u540d\u7684\u53ef\u9760\u6027\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23068", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d67\u79cd\u6f14\u5316\u65b9\u6cd5\u30016\u4e2a\u6a21\u578b\uff0c\u8c03\u7528LLM\u8d85\u5343\u4e07\u6b21\u3002", "\u5019\u9009\u7ea7\u7b5b\u9009\u533a\u5206\u6709\u76ca\u4e0e\u6709\u5bb3\u4ea7\u7269\u7684\u8868\u73b0\u4e0d\u4f18\u4e8e\u968f\u673a\u3002", "\u65b9\u6cd5\u95f4\u5e38\u89c1\u7684\u51e0\u4e2a\u767e\u5206\u70b9\u5dee\u8ddd\u5c0f\u4e8e\u540c\u65b9\u6cd5\u4e24\u6b21\u8fd0\u884c\u5dee\u5f02\u3002"], "keywords": ["\u667a\u80fd\u4f53\u6f14\u5316", "\u81ea\u6211\u6539\u8fdb", "\u6a21\u578b\u8bc4\u4f30", "\u8bc4\u4f30\u566a\u58f0"], "num_comments": 4, "on_hf": true, "organization": "ShanghaiTech University", "pdf_url": "https://arxiv.org/pdf/2611.23068v1", "published_at": "2026-11-17", "score": 0.304, "selected_reasons": ["HF trending (35\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23068.png", "title": "The Resolution Hypothesis: Agent Evolution\u0027s Key Is Identifying Improvements", "tldr": "\u667a\u80fd\u4f53\u6f14\u5316\u5e38\u53d7\u8bc4\u4f30\u566a\u58f0\u5236\u7ea6\uff0c\u5173\u952e\u74f6\u9888\u662f\u8bc6\u522b\u771f\u5b9e\u6539\u8fdb\u800c\u975e\u751f\u6210\u5019\u9009\u65b9\u6848\u3002", "upvotes": 35, "what_it_is": "\u63d0\u51fa\u5206\u8fa8\u7387\u5047\u8bf4\uff0c\u5c06\u667a\u80fd\u4f53\u6f14\u5316\u505c\u6ede\u5f52\u56e0\u4e8e\u8bc4\u4f30\u65e0\u6cd5\u53ef\u9760\u8bc6\u522b\u6539\u8fdb\u3002\u901a\u8fc7\u8de8\u65b9\u6cd5\u3001\u8de8\u6a21\u578b\u5b9e\u9a8c\uff0c\u5206\u522b\u68c0\u9a8c\u5019\u9009\u4ea7\u7269\u7b5b\u9009\u4e0e\u6f14\u5316\u65b9\u6cd5\u6392\u540d\u7684\u53ef\u9760\u6027\u3002", "why_notable": "\u4e3a\u6f14\u5316\u65b9\u6cd5\u6392\u540d\u4e0d\u7a33\u5b9a\u4e0e\u6539\u8fdb\u96be\u4ee5\u79ef\u7d2f\u63d0\u4f9b\u7edf\u4e00\u89e3\u91ca\uff0c\u63a8\u52a8\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\u7814\u7a76\u4ece\u751f\u6210\u66f4\u591a\u65b9\u6848\u8f6c\u5411\u63d0\u9ad8\u8bc4\u4f30\u5206\u8fa8\u7387\u3002"}, {"abstract": "Recent advances in machine learning have accelerated biomedical prediction, but evaluation on structured biomedical data remains fragmented, especially for datasets with high dimensionality, large sample size, missingness, and class imbalance. We introduce TabBioMed, a large-scale benchmark of 94 curated public biomedical tabular datasets spanning electronic health records, drug discovery, genomics, transcriptomics, proteomics, metabolomics, single-cell omics, and systems biology. TabBioMed unifies these datasets through a standardized, dataset-aware preprocessing and evaluation framework, enabling reproducible comparison across classification, regression, and multi-target tasks. We benchmark 23 models across classical baselines, gradient-boosted trees, neural tabular architectures, and tabular foundation models. Foundation models deliver the strongest family-level
