\u89c6\u4e3a\u52a0\u6743\u21132\u6295\u5f71\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u6807\u51c6\u6570\u636e\u96c6\u3001\u9884\u8bad\u7ec3\u6a21\u578b\u548c\u5bf9\u6297\u9c81\u68d2\u6a21\u578b\u4e0a\u90fd\u5f88\u6709\u6548\uff0c\u5e76\u80fd\u8fc1\u79fb\u5230\u672a\u89c1\u67b6\u6784\uff0c\u7528\u4e8e\u66f4\u7cfb\u7edf\u5730\u8bc4\u4f30\u6a21\u578b\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Activation steering is a powerful training-free paradigm for controlling large language models at inference time. However, standard approaches estimate a per-layer steering direction from contrastive data and apply it on the layer\u0027s entire representation space, which may couple the intervention to off-target properties present in the contrastive data and degrade unrelated capabilities. To mitigate this issue, we introduce LocUS (Localized Unembedding Steering), a method which grounds activation steering to the model\u0027s own output vocabulary subspace. By identifying a property-specific linear subspace within the unembedding matrix, LocUS enforces a geometric constraint that restricts the steering transformation to a specific subspace and at the same time localizes its application to a sparse subset of attention heads. Extensive evaluations across three model families on toxicity mitigation, sentiment redirection and sycophancy suppression show that LocUS matches or outperforms state-of-the-art baselines while intervening on under 6% of parameters and better preserving general capability.", "arxiv_id": "2609.31122", "arxiv_url": "https://arxiv.org/abs/2609.31122", "authors": ["Irene Tallini", "Lorenzo Basile", "Valentino Maiorca", "Francesco Locatello", "Alberto Cazzaniga"], "brief": "LocUS \u63d0\u51fa\u4e00\u79cd\u8bad\u7ec3-free \u7684\u6fc0\u6d3b steering \u65b9\u6cd5\uff0c\u901a\u8fc7\u5728\u6a21\u578b\u8f93\u51fa\u8bcd\u8868\u7684 unembedding \u77e9\u9635\u4e2d\u5b9a\u4f4d\u5c5e\u6027\u76f8\u5173\u5b50\u7a7a\u95f4\uff0c\u5e76\u53ea\u4f5c\u7528\u4e8e\u7a00\u758f\u6ce8\u610f\u529b\u5934\u6765\u5b9e\u73b0\u66f4\u7cbe\u51c6\u5e72\u9884\u3002\u5b83\u5728\u6bd2\u6027\u7f13\u89e3\u3001\u60c5\u611f\u91cd\u5b9a\u5411\u548c\u6291\u5236\u8c04\u5a9a\u7b49\u4efb\u52a1\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u73b0\u6709\u65b9\u6cd5\uff0c\u540c\u65f6\u4ec5\u5e72\u9884\u4e0d\u5230 6% \u7684\u53c2\u6570\u5e76\u66f4\u597d\u4fdd\u7559\u901a\u7528\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31122", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6fc0\u6d3b steering", "\u6a21\u578b\u63a7\u5236", "\u6ce8\u610f\u529b\u5934"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31122v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LocUS: Head Selection and Subspace Projection for Targeted Activation Steering", "tldr": "LocUS \u63d0\u51fa\u4e00\u79cd\u8bad\u7ec3-free \u7684\u6fc0\u6d3b steering \u65b9\u6cd5\uff0c\u901a\u8fc7\u5728\u6a21\u578b\u8f93\u51fa\u8bcd\u8868\u7684 unembedding \u77e9\u9635\u4e2d\u5b9a\u4f4d\u5c5e\u6027\u76f8\u5173\u5b50\u7a7a\u95f4\uff0c\u5e76\u53ea\u4f5c\u7528\u4e8e\u7a00\u758f\u6ce8\u610f\u529b\u5934\u6765\u5b9e\u73b0\u66f4\u7cbe\u51c6\u5e72\u9884\u3002\u5b83\u5728\u6bd2\u6027\u7f13\u89e3\u3001\u60c5\u611f\u91cd\u5b9a\u5411\u548c\u6291\u5236\u8c04\u5a9a\u7b49\u4efb\u52a1\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u73b0\u6709\u65b9\u6cd5\uff0c\u540c\u65f6\u4ec5\u5e72\u9884\u4e0d\u5230 6% \u7684\u53c2\u6570\u5e76\u66f4\u597d\u4fdd\u7559\u901a\u7528\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Neural algorithmic reasoning aims to train neural networks to follow known algorithms and generalize beyond the input sizes seen during training. However, correct final outputs and intermediate supervision do not necessarily show that a model follows the intended execution. We study this problem using insertion sort. Our analysis of the CLRS30 baseline NAR shows that the hint objective is weakly optimized and that hint accuracy remains low. Moreover, many intermediate representations can already be decoded into sorted sequences before the reference insertion-sort execution terminates, suggesting that the model learns a shortcut to the final output. Motivated by these findings, we introduce Discrete Neural Insertion Sort. Our model represents the sequence as a chain, separates scalar exchanges from control-state transitions, and projects node representations back to discrete states after every processor step. When trained only on sequences of length 16, the model achieves $100\\%$ sorted-sequence accuracy on sequences of length 64 and 128. However, an ablation shows that discretization and graph structure alone are insufficient: without additional supervision of the global inner-loop state, the model fails even at the training length. Our results show that discrete execution can support strong length generalization, while also highlighting the problem-specific inductive bias required to learn a faithful algorithmic execution.", "arxiv_id": "2609.31114", "arxiv_url": "https://arxiv.org/abs/2609.31114", "authors": ["Konstantinos Mylonas", "Thrasyvoulos Spyropoulos"], "brief": "\u8bba\u6587\u5206\u6790\u4e86\u795e\u7ecf\u7b97\u6cd5\u63a8\u7406\u5728\u63d2\u5165\u6392\u5e8f\u4efb\u52a1\u4e2d\u7684\u201c\u6377\u5f84\u5b66\u4e60\u201d\u73b0\u8c61\uff1a\u5373\u4f7f\u6709\u4e2d\u95f4\u76d1\u7763\uff0c\u6a21\u578b\u4e5f\u53ef\u80fd\u5e76\u672a\u6309\u9884\u671f\u7b97\u6cd5\u6267\u884c\uff0c\u800c\u662f\u63d0\u524d\u7f16\u7801\u51fa\u5df2\u6392\u5e8f\u7ed3\u679c\u3002\u4f5c\u8005\u63d0\u51fa\u79bb\u6563\u795e\u7ecf\u63d2\u5165\u6392\u5e8f\uff0c\u901a\u8fc7\u94fe\u5f0f\u7ed3\u6784\u3001\u63a7\u5236\u72b6\u6001\u5206\u79bb\u548c\u6bcf\u6b65\u79bb\u6563\u6295\u5f71\uff0c\u5728\u957f\u5ea616\u8bad\u7ec3\u540e\u53ef\u6cdb\u5316\u5230\u957f\u5ea664\u548c128\u5e76\u8fbe\u5230100%\u6392\u5e8f\u51c6\u786e\u7387\uff0c\u4f46\u9700\u8981\u989d\u5916\u76d1\u7763\u5168\u5c40\u5185\u5faa\u73af\u72b6\u6001\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31114", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u7b97\u6cd5\u63a8\u7406", "\u957f\u5ea6\u6cdb\u5316", "\u79bb\u6563\u6267\u884c", "\u5f52\u7eb3\u504f\u7f6e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31114v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Shortcut Learning to Discrete Neural Insertion Sort", "tldr": "\u8bba\u6587\u5206\u6790\u4e86\u795e\u7ecf\u7b97\u6cd5\u63a8\u7406\u5728\u63d2\u5165\u6392\u5e8f\u4efb\u52a1\u4e2d\u7684\u201c\u6377\u5f84\u5b66\u4e60\u201d\u73b0\u8c61\uff1a\u5373\u4f7f\u6709\u4e2d\u95f4\u76d1\u7763\uff0c\u6a21\u578b\u4e5f\u53ef\u80fd\u5e76\u672a\u6309\u9884\u671f\u7b97\u6cd5\u6267\u884c\uff0c\u800c\u662f\u63d0\u524d\u7f16\u7801\u51fa\u5df2\u6392\u5e8f\u7ed3\u679c\u3002\u4f5c\u8005\u63d0\u51fa\u79bb\u6563\u795e\u7ecf\u63d2\u5165\u6392\u5e8f\uff0c\u901a\u8fc7\u94fe\u5f0f\u7ed3\u6784\u3001\u63a7\u5236\u72b6\u6001\u5206\u79bb\u548c\u6bcf\u6b65\u79bb\u6563\u6295\u5f71\uff0c\u5728\u957f\u5ea616\u8bad\u7ec3\u540e\u53ef\u6cdb\u5316\u5230\u957f\u5ea664\u548c128\u5e76\u8fbe\u5230100%\u6392\u5e8f\u51c6\u786e\u7387\uff0c\u4f46\u9700\u8981\u989d\u5916\u76d1\u7763\u5168\u5c40\u5185\u5faa\u73af\u72b6\u6001\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study Bayesian optimization (BO) through the lens of information geometry. Pulling back the Fisher information metric through the surrogate posterior map yields a local sensitivity tensor on the input space, which leads to an upper bound on the gradient of reparameterizable acquisition functions. This view explains vanishing-gradient behavior in high-dimensional BO and provides a common interpretation of heuristics such as RAASP and dimension-scaled lengthscales. Building on this analysis, we propose FITR, a trust-region-based BO method that replaces lengthscale-based scaling by local pullback-Fisher weights. FITR is not restricted to GP kernels with explicit lengthscales. On GP benchmarks with an SE kernel, experiments show competitive performance using FITR. The proposed method also easily generalizes to non-isotropic surrogates, although the gains are more task-dependent in that setting.", "arxiv_id": "2609.31107", "arxiv_url": "https://arxiv.org/abs/2609.31107", "authors": ["Saksham Kiroriwal", "Julius Pfrommer", "J\u00fcrgen Beyerer"], "brief": "\u672c\u6587\u4ece\u4fe1\u606f\u51e0\u4f55\u89c6\u89d2\u5206\u6790\u8d1d\u53f6\u65af\u4f18\u5316\uff0c\u5c06 Fisher \u4fe1\u606f\u5ea6\u91cf\u62c9\u56de\u5230\u8f93\u5165\u7a7a\u95f4\uff0c\u5f97\u5230\u91c7\u96c6\u51fd\u6570\u68af\u5ea6\u4e0a\u754c\uff0c\u5e76\u89e3\u91ca\u9ad8\u7ef4 BO \u4e2d\u68af\u5ea6\u6d88\u5931\u53ca\u82e5\u5e72\u542f\u53d1\u5f0f\u65b9\u6cd5\u7684\u4f5c\u7528\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa FITR \u4fe1\u8d56\u57df\u65b9\u6cd5\uff0c\u7528\u5c40\u90e8 Fisher \u6743\u91cd\u66ff\u4ee3\u957f\u5ea6\u5c3a\u5ea6\u7f29\u653e\uff0c\u5728 GP \u57fa\u51c6\u4e0a\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u53ef\u6269\u5c55\u5230\u975e\u5404\u5411\u540c\u6027\u4ee3\u7406\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.AI", "cs.IT"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31107", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8d1d\u53f6\u65af\u4f18\u5316", "\u4fe1\u606f\u51e0\u4f55", "\u4fe1\u8d56\u57df"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31107v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bayesian Optimization with Fisher Information Geometry: Gradient Bounds and Trust-Region Methods", "tldr": "\u672c\u6587\u4ece\u4fe1\u606f\u51e0\u4f55\u89c6\u89d2\u5206\u6790\u8d1d\u53f6\u65af\u4f18\u5316\uff0c\u5c06 Fisher \u4fe1\u606f\u5ea6\u91cf\u62c9\u56de\u5230\u8f93\u5165\u7a7a\u95f4\uff0c\u5f97\u5230\u91c7\u96c6\u51fd\u6570\u68af\u5ea6\u4e0a\u754c\uff0c\u5e76\u89e3\u91ca\u9ad8\u7ef4 BO \u4e2d\u68af\u5ea6\u6d88\u5931\u53ca\u82e5\u5e72\u542f\u53d1\u5f0f\u65b9\u6cd5\u7684\u4f5c\u7528\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa FITR \u4fe1\u8d56\u57df\u65b9\u6cd5\uff0c\u7528\u5c40\u90e8 Fisher \u6743\u91cd\u66ff\u4ee3\u957f\u5ea6\u5c3a\u5ea6\u7f29\u653e\uff0c\u5728 GP \u57fa\u51c6\u4e0a\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u53ef\u6269\u5c55\u5230\u975e\u5404\u5411\u540c\u6027\u4ee3\u7406\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The flatness of the loss landscape at a minimizer is a widely used heuristic for reasoning about neural-network generalization, yet evidence for this relation is mostly empirical and controversial. We study this relation in a teacher-student tree committee machine, where both the ERM estimator and the Hessian spectrum are analytically tractable in the proportional high-dimensional limit. First, we use a zero-temperature Gibbs formulation to obtain predictions for the observables of the typical minimizers of the empirical loss. Secondly, we use Edwards-Jones formalism to derive the limiting Hessian resolvent around these typical minimizers. All predictions agree with finite-size gradient-descent simulations. Finally, we study three measures of flatness, namely the left and right edges and the spectral mean, and check if a decrease in generalization error as the dataset size is increased corresponds to an increase in flatness. We find that the answer strongly depends on the learning task and on the ratio of the number of parameters to the number of data points. In regression, the spectral mean and right edge correlate with the generalization error, while the left edge does so only in the overparametrized regime. In classification this correlation reliably holds only in the highly overparametrized phase, while for underparametrized networks it can even reverse.", "arxiv_id": "2609.31101", "arxiv_url": "https://arxiv.org/abs/2609.31101", "authors": ["Brandon Livio Annesi", "Davide Straziota", "Enrico Maria Malatesta"], "brief": "\u672c\u6587\u5728\u6559\u5e08-\u5b66\u751f\u6811\u59d4\u5458\u4f1a\u673a\u6a21\u578b\u4e2d\u89e3\u6790\u7814\u7a76\u635f\u5931\u666f\u89c2\u5e73\u5766\u6027\u4e0e\u6cdb\u5316\u8bef\u5dee\u7684\u5173\u7cfb\uff0c\u63a8\u5bfc\u4e86\u5178\u578b\u7ecf\u9a8c\u98ce\u9669\u6700\u5c0f\u89e3\u53ca\u5176 Hessian \u8c31\uff0c\u5e76\u4e0e\u6709\u9650\u89c4\u6a21\u68af\u5ea6\u4e0b\u964d\u5b9e\u9a8c\u543b\u5408\u3002\u7ed3\u679c\u8868\u660e\u5e73\u5766\u6027-\u6cdb\u5316\u76f8\u5173\u6027\u5e76\u4e0d\u666e\u9002\uff0c\u5f3a\u70c8\u4f9d\u8d56\u4efb\u52a1\u7c7b\u578b\u548c\u53c2\u6570/\u6570\u636e\u6bd4\u4f8b\uff1a\u56de\u5f52\u4e2d\u90e8\u5206\u8c31\u6307\u6807\u76f8\u5173\uff0c\u5206\u7c7b\u4e2d\u4e3b\u8981\u53ea\u5728\u9ad8\u5ea6\u8fc7\u53c2\u6570\u5316\u9636\u6bb5\u53ef\u9760\uff0c\u6b20\u53c2\u6570\u5316\u65f6\u751a\u81f3\u53ef\u80fd\u53cd\u8f6c\u3002", "categories": ["cond-mat.dis-nn", "cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31101", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6cdb\u5316\u7406\u8bba", "\u635f\u5931\u666f\u89c2", "Hessian\u8c31", "\u9ad8\u7ef4\u7edf\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31101v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Flatness-Generalization Relation in the Teacher-Student Tree-Committee Machine", "tldr": "\u672c\u6587\u5728\u6559\u5e08-\u5b66\u751f\u6811\u59d4\u5458\u4f1a\u673a\u6a21\u578b\u4e2d\u89e3\u6790\u7814\u7a76\u635f\u5931\u666f\u89c2\u5e73\u5766\u6027\u4e0e\u6cdb\u5316\u8bef\u5dee\u7684\u5173\u7cfb\uff0c\u63a8\u5bfc\u4e86\u5178\u578b\u7ecf\u9a8c\u98ce\u9669\u6700\u5c0f\u89e3\u53ca\u5176 Hessian \u8c31\uff0c\u5e76\u4e0e\u6709\u9650\u89c4\u6a21\u68af\u5ea6\u4e0b\u964d\u5b9e\u9a8c\u543b\u5408\u3002\u7ed3\u679c\u8868\u660e\u5e73\u5766\u6027-\u6cdb\u5316\u76f8\u5173\u6027\u5e76\u4e0d\u666e\u9002\uff0c\u5f3a\u70c8\u4f9d\u8d56\u4efb\u52a1\u7c7b\u578b\u548c\u53c2\u6570/\u6570\u636e\u6bd4\u4f8b\uff1a\u56de\u5f52\u4e2d\u90e8\u5206\u8c31\u6307\u6807\u76f8\u5173\uff0c\u5206\u7c7b\u4e2d\u4e3b\u8981\u53ea\u5728\u9ad8\u5ea6\u8fc7\u53c2\u6570\u5316\u9636\u6bb5\u53ef\u9760\uff0c\u6b20\u53c2\u6570\u5316\u65f6\u751a\u81f3\u53ef\u80fd\u53cd\u8f6c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce \\emph{effective depth} ($\\Deff$), a scalar diagnostic that treats the layer-wise residual stream of a transformer as a discrete-time process, measures how representation similarity decays with layer distance, and aggregates that profile into one number. Across sixteen decoder-only language models, $\\Deff$ separates a structural consequence of residual accumulation from an empirical one: even maximally diverse orthogonal updates have the closed-form reference $F_L = 2L/(L+1)\u003c2$, yet fifteen of sixteen default measurements lie below $F_L$ (Qwen3.5: 32--44\\%, OLMo-2: 40--41\\%, Pythia: 23--28\\%). Matched references show that the gap is not caused by the persistent initial state or update-size imbalance, but is largely a calibrated signature of correlated residual updates rather than evidence that depth is unused. Symmetric position-0, token-normalisation, and top-PC controls show the regime is not reducible to BOS or top-PC artefacts: the lone above-reference default outlier joins the same regime, and all sixteen models are sub-reference after token-normalisation or top-1-PC removal. Intermediate checkpoints show that the regime is established early in OLMo-2 and stable through 5T tokens, while Pythia-1.4B follows a distinct decreasing trajectory. A controlled residual-carry intervention supports the mechanism, and $\\Deff$ is best read as a \\emph{global} accumulated-state diagnostic, not as a capability score or pruning method.", "arxiv_id": "2609.31098", "arxiv_url": "https://arxiv.org/abs/2609.31098", "authors": ["Barak Gahtan", "Ido Galil", "Alex M. Bronstein"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6709\u6548\u6df1\u5ea6\u201d\u6307\u6807\uff0c\u5c06 Transformer \u6b8b\u5dee\u6d41\u89c6\u4e3a\u79bb\u6563\u65f6\u95f4\u8fc7\u7a0b\uff0c\u7528\u8868\u793a\u76f8\u4f3c\u5ea6\u968f\u5c42\u8ddd\u8870\u51cf\u6765\u6982\u62ec\u5168\u5c40\u7d2f\u79ef\u72b6\u6001\u3002\u5bf916\u4e2a\u89e3\u7801\u5f0f\u8bed\u8a00\u6a21\u578b\u7684\u5206\u6790\u8868\u660e\uff0c\u591a\u6570\u6a21\u578b\u4f4e\u4e8e\u6b63\u4ea4\u66f4\u65b0\u53c2\u8003\u503c\uff0c\u4e3b\u8981\u53cd\u6620\u6b8b\u5dee\u66f4\u65b0\u76f8\u5173\u6027\uff0c\u800c\u975e\u6df1\u5ea6\u672a\u88ab\u4f7f\u7528\uff1b\u8be5\u73b0\u8c61\u5728\u591a\u79cd\u63a7\u5236\u5b9e\u9a8c\u548c\u8bad\u7ec3\u68c0\u67e5\u70b9\u4e2d\u8f83\u7a33\u5b9a\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31098", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "Transformer", "\u53ef\u89e3\u91ca\u6027", "\u8868\u793a\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31098v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Residual Stream\u0027s Effective Depth", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u6709\u6548\u6df1\u5ea6\u201d\u6307\u6807\uff0c\u5c06 Transformer \u6b8b\u5dee\u6d41\u89c6\u4e3a\u79bb\u6563\u65f6\u95f4\u8fc7\u7a0b\uff0c\u7528\u8868\u793a\u76f8\u4f3c\u5ea6\u968f\u5c42\u8ddd\u8870\u51cf\u6765\u6982\u62ec\u5168\u5c40\u7d2f\u79ef\u72b6\u6001\u3002\u5bf916\u4e2a\u89e3\u7801\u5f0f\u8bed\u8a00\u6a21\u578b\u7684\u5206\u6790\u8868\u660e\uff0c\u591a\u6570\u6a21\u578b\u4f4e\u4e8e\u6b63\u4ea4\u66f4\u65b0\u53c2\u8003\u503c\uff0c\u4e3b\u8981\u53cd\u6620\u6b8b\u5dee\u66f4\u65b0\u76f8\u5173\u6027\uff0c\u800c\u975e\u6df1\u5ea6\u672a\u88ab\u4f7f\u7528\uff1b\u8be5\u73b0\u8c61\u5728\u591a\u79cd\u63a7\u5236\u5b9e\u9a8c\u548c\u8bad\u7ec3\u68c0\u67e5\u70b9\u4e2d\u8f83\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scaling language models to long contexts is limited by the quadratic cost of self-attention. Block sparse attention offers an efficient alternative, but selecting the retained blocks remains a bottleneck. Conventional block selection requires scoring all query-block pairs and therefore remains quadratic in sequence length. To address this issue, we propose PISA, a block-sparse attention mechanism that employs a pyramid Top-$K$ selection strategy. The main idea is to gradually narrow down the candidates across different levels, making it more efficient to find the most relevant keys. Specifically, we construct a coarse-to-fine hierarchy of keys and perform selection from the coarsest level. At each level, LogSumExp scoring is applied to a bounded candidate set to select candidates for the next finer level, continuing until the finest level is reached. Through pooling, we construct $O(\\log N)$ levels of keys, yielding an overall complexity of $O(N\\log N)$, where $N$ denotes the sequence length. We develop hardware-aware Triton kernels for both training and inference, fusing hierarchical routing and LogSumExp scoring without materializing the query-key score matrix. We further evaluate our method on language modeling tasks. Compared with the baseline, our method achieves comparable performance on benchmarks such as commonsense reasoning while delivering better results on retrieval tasks.", "arxiv_id": "2609.31093", "arxiv_url": "https://arxiv.org/abs/2609.31093", "authors": ["Bohao Tang", "Zhen Qin", "Yuqi Pan", "Zheng Li", "Pengfei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa PISA\uff0c\u4e00\u79cd\u7528\u91d1\u5b57\u5854\u5f0f Top-K \u7c97\u5230\u7ec6\u7b5b\u9009\u7684\u5757\u7a00\u758f\u6ce8\u610f\u529b\uff0c\u907f\u514d\u5bf9\u6240\u6709 query-block \u7ec4\u5408\u9010\u4e00\u6253\u5206\u3002\u901a\u8fc7\u6784\u5efa O(log N) \u5c42\u7ea7\u5e76\u4f7f\u7528\u786c\u4ef6\u611f\u77e5 Triton kernel\uff0c\u5c06\u590d\u6742\u5ea6\u964d\u81f3 O(N log N)\uff0c\u5728\u8bed\u8a00\u5efa\u6a21\u4e2d\u4fdd\u6301\u76f8\u8fd1\u5e38\u8bc6\u63a8\u7406\u8868\u73b0\uff0c\u5e76\u63d0\u5347\u68c0\u7d22\u4efb\u52a1\u6548\u679c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31093", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a00\u758f\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587", "\u8bed\u8a00\u6a21\u578b", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31093v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Block Sparse Attention with Log-Linear Complexity", "tldr": "\u8bba\u6587\u63d0\u51fa PISA\uff0c\u4e00\u79cd\u7528\u91d1\u5b57\u5854\u5f0f Top-K \u7c97\u5230\u7ec6\u7b5b\u9009\u7684\u5757\u7a00\u758f\u6ce8\u610f\u529b\uff0c\u907f\u514d\u5bf9\u6240\u6709 query-block \u7ec4\u5408\u9010\u4e00\u6253\u5206\u3002\u901a\u8fc7\u6784\u5efa O(log N) \u5c42\u7ea7\u5e76\u4f7f\u7528\u786c\u4ef6\u611f\u77e5 Triton kernel\uff0c\u5c06\u590d\u6742\u5ea6\u964d\u81f3 O(N log N)\uff0c\u5728\u8bed\u8a00\u5efa\u6a21\u4e2d\u4fdd\u6301\u76f8\u8fd1\u5e38\u8bc6\u63a8\u7406\u8868\u73b0\uff0c\u5e76\u63d0\u5347\u68c0\u7d22\u4efb\u52a1\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Knowing where species occur is fundamental for biodiversity research and conservation. Species distribution models (SDMs) link species observations to environmental conditions to estimate their spatial distribution. However, accuracy varies with the underlying data and models, making it essential to know for which species models can be trusted. Deep-learning-based SDMs (\"DeepSDMs\") now jointly model thousands of species, drawing on hundreds of millions of community-science records. At this scale, averaging performance hides substantial species-level variability, particularly for rare species, often of greatest conservation concern. Records are also strongly biased, making occurrence counts misleading. Accounting for these factors is essential for a reliable and informative evaluation of multi-species SDMs. Here, we introduce a Sampling-Aware Global Evaluation (SAGE) benchmark, combining GBIF records for training with sPlotOpen vegetation plots for presence-absence evaluation across 5771 plant species. We propose an evaluation framework that groups species based on two properties, sampling effort and relative prevalence, which describe how densely a species\u0027 range is sampled and how frequently the species is recorded. Evaluating single-species SDMs and multi-species DeepSDMs, we find that Random Forests and DeepSDMs perform best overall, but neither dominates: DeepSDMs outperform single-species SDMs for infrequently recorded species while offering no consistent advantage for well-sampled ones. Crucially, this advantage emerges only when established bias-correction practices, such as spatial thinning and reweighting, are carried over to the deep-learning setting. SAGE helps identify the species and data conditions for which a given approach is beneficial, thereby supporting the development of more transparent and ecologically credible SDMs. Data and code: https://earens.github.io/sage/", "arxiv_id": "2609.31082", "arxiv_url": "https://arxiv.org/abs/2609.31082", "authors": ["Emilia Arens", "Nina van Tiel", "Robin Zbinden", "Damien Robert", "Lukas Drees", "Chiara Vanalli", "Benjamin Kellenberger", "Niklaus E. Zimmermann", "Lo\u00efc Pellissier", "Devis Tuia", "Jan Dirk Wegner"], "brief": "\u8bba\u6587\u63d0\u51fa SAGE\uff0c\u4e00\u4e2a\u9762\u5411\u7269\u79cd\u5206\u5e03\u5efa\u6a21\u7684\u91c7\u6837\u611f\u77e5\u5168\u7403\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7ed3\u5408 GBIF \u8bad\u7ec3\u8bb0\u5f55\u4e0e sPlotOpen \u6837\u5730\u7684\u5b58\u5728-\u7f3a\u5931\u6570\u636e\uff0c\u8986\u76d6 5771 \u79cd\u690d\u7269\u3002\u7814\u7a76\u53d1\u73b0\u968f\u673a\u68ee\u6797\u548c\u6df1\u5ea6\u591a\u7269\u79cd SDM \u6574\u4f53\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u4f18\u52bf\u53d6\u51b3\u4e8e\u7269\u79cd\u91c7\u6837\u5f3a\u5ea6\u4e0e\u6d41\u884c\u5ea6\uff1b\u6df1\u5ea6\u6a21\u578b\u4e3b\u8981\u5728\u8bb0\u5f55\u7a00\u5c11\u7269\u79cd\u4e0a\u66f4\u6709\u4f18\u52bf\uff0c\u4e14\u9700\u8981\u7a7a\u95f4\u7a00\u758f\u5316\u3001\u91cd\u52a0\u6743\u7b49\u504f\u5dee\u6821\u6b63\u3002", "categories": ["cs.LG", "q-bio.PE", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31082", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7269\u79cd\u5206\u5e03\u5efa\u6a21", "\u57fa\u51c6\u8bc4\u6d4b", "\u6df1\u5ea6\u5b66\u4e60", "\u751f\u6001\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31082v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SAGE: A sampling-aware global evaluation benchmark for species distribution modeling", "tldr": "\u8bba\u6587\u63d0\u51fa SAGE\uff0c\u4e00\u4e2a\u9762\u5411\u7269\u79cd\u5206\u5e03\u5efa\u6a21\u7684\u91c7\u6837\u611f\u77e5\u5168\u7403\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7ed3\u5408 GBIF \u8bad\u7ec3\u8bb0\u5f55\u4e0e sPlotOpen \u6837\u5730\u7684\u5b58\u5728-\u7f3a\u5931\u6570\u636e\uff0c\u8986\u76d6 5771 \u79cd\u690d\u7269\u3002\u7814\u7a76\u53d1\u73b0\u968f\u673a\u68ee\u6797\u548c\u6df1\u5ea6\u591a\u7269\u79cd SDM \u6574\u4f53\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u4f18\u52bf\u53d6\u51b3\u4e8e\u7269\u79cd\u91c7\u6837\u5f3a\u5ea6\u4e0e\u6d41\u884c\u5ea6\uff1b\u6df1\u5ea6\u6a21\u578b\u4e3b\u8981\u5728\u8bb0\u5f55\u7a00\u5c11\u7269\u79cd\u4e0a\u66f4\u6709\u4f18\u52bf\uff0c\u4e14\u9700\u8981\u7a7a\u95f4\u7a00\u758f\u5316\u3001\u91cd\u52a0\u6743\u7b49\u504f\u5dee\u6821\u6b63\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Quantum Machine Learning is a novel field of research aimed at devising machine learning approaches exploiting principles of quantum mechanics, such as superposition, entanglement and interference. In this context, we present a scalable hybrid Quantum Diffusion Model, and evaluate its use for medical image analysis. Specifically, our method is based on a Discrete-Time Quantum Walk algorithm, executed on a real quantum device, to model the forward dynamics of the diffusion model. For the backward step of the diffusion model, we devise and evaluate a classical learning model, which is used to reversely denoise the data. In contrast with other existing attempts at applying quantum machine learning for image analysis tasks, severely limited by the size of existing quantum devices, our method allows to process real-world large size medical data. In particular, we present results on grayscale and RGB images, as well as 3D volumes of moderate sizes. We benchmark our results by reproducing an alternative classical counterpart model, based on diffusion models on discrete state spaces. By doing so, we compare the generation capabilities of both models in terms of three distinct state-of-the-art metrics in the field of image generation, showing the competitive, promising results of our approach.", "arxiv_id": "2609.31070", "arxiv_url": "https://arxiv.org/abs/2609.31070", "authors": ["Francesco Aldo Venturelli", "Stefano Martina", "Marco Parigi", "Filippo Caruso", "Alba Cervera-Lierta", "Miguel A. Gonz\u00e1lez Ballester"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u6269\u5c55\u7684\u6df7\u5408\u91cf\u5b50\u6269\u6563\u6a21\u578b\uff0c\u7528\u79bb\u6563\u65f6\u95f4\u91cf\u5b50\u6e38\u8d70\u5728\u771f\u5b9e\u91cf\u5b50\u8bbe\u5907\u4e0a\u5efa\u6a21\u6269\u6563\u524d\u5411\u8fc7\u7a0b\uff0c\u5e76\u7528\u7ecf\u5178\u5b66\u4e60\u6a21\u578b\u5b8c\u6210\u53cd\u5411\u53bb\u566a\u3002\u65b9\u6cd5\u53ef\u5904\u7406\u7070\u5ea6\u3001RGB \u533b\u5b66\u56fe\u50cf\u53ca\u4e2d\u7b49\u89c4\u6a21 3D \u4f53\u6570\u636e\uff0c\u5728\u591a\u79cd\u751f\u6210\u6307\u6807\u4e0a\u76f8\u8f83\u7ecf\u5178\u79bb\u6563\u6269\u6563\u6a21\u578b\u8868\u73b0\u5177\u6709\u7ade\u4e89\u529b\u3002", "categories": ["eess.IV", "cs.AI", "cs.CV", "cs.ET", "cs.LG", "quant-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31070", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u6269\u6563\u6a21\u578b", "\u533b\u5b66\u5f71\u50cf", "\u56fe\u50cf\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31070v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Quantum Diffusion Models for Medical Image Analysis", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u6269\u5c55\u7684\u6df7\u5408\u91cf\u5b50\u6269\u6563\u6a21\u578b\uff0c\u7528\u79bb\u6563\u65f6\u95f4\u91cf\u5b50\u6e38\u8d70\u5728\u771f\u5b9e\u91cf\u5b50\u8bbe\u5907\u4e0a\u5efa\u6a21\u6269\u6563\u524d\u5411\u8fc7\u7a0b\uff0c\u5e76\u7528\u7ecf\u5178\u5b66\u4e60\u6a21\u578b\u5b8c\u6210\u53cd\u5411\u53bb\u566a\u3002\u65b9\u6cd5\u53ef\u5904\u7406\u7070\u5ea6\u3001RGB \u533b\u5b66\u56fe\u50cf\u53ca\u4e2d\u7b49\u89c4\u6a21 3D \u4f53\u6570\u636e\uff0c\u5728\u591a\u79cd\u751f\u6210\u6307\u6807\u4e0a\u76f8\u8f83\u7ecf\u5178\u79bb\u6563\u6269\u6563\u6a21\u578b\u8868\u73b0\u5177\u6709\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Application developers of distributed learning services face challenges that a typical federated learning loop does not address. Specifically, the model updates can still leak private data, devices might not be able to participate in the training due to limited resources, a single aggregator might not be able to scale, and the transmissions of model weights induce a considerable bandwidth cost. This paper demonstrates DLaaS (Distributed Learning as a Service) from the developer\u0027s vantage point. Using a single admin dashboard, the developer initiates a distributed/federated learning job and is able to activate Differential Privacy (DP), Split Learning (SL), Hierarchical Aggregation (HA), and Knowledge Distillation (KD) as declarative options, with no change to the clients\u0027 code. We demonstrate the complete service lifecycle on an industrial smart-home Wake-up Word (WuW) task, using the \"Ok Aura\" dataset. Once the developer initiates a distributed learning job by toggling DP, SL, HA, and KD in the admin dashboard, the system dispatches the job to a set of Android clients and Dockerized helper aggregators. In the demonstration, these mechanisms run live across configurations. Then, the clients train the model locally and return their updates. The trained model is served to a consumer-side Android application that performs on-device WuW detection on a live microphone stream. In particular, the conference attendees will be invited to speak the trigger phrase and monitor in real time the per-class confidence and inference latency. Finally, we release the source code and short video walkthroughs of these configurations.", "arxiv_id": "2609.31061", "arxiv_url": "https://arxiv.org/abs/2609.31061", "authors": ["Tianyue Chu", "Filippo Vannella", "Dimitra Tsigkari", "Paula Delgado-Santos", "Fernando L\u00f3pez", "Pablo Gomez Guerrero", "Sotirios Spantideas", "David Solans Noguero"], "brief": "\u672c\u6587\u4ece\u5f00\u53d1\u8005\u89c6\u89d2\u5c55\u793a\u4e86\u4e00\u4e2a\u5206\u5e03\u5f0f\u5b66\u4e60\u5373\u670d\u52a1\uff08DLaaS\uff09\u7cfb\u7edf\uff0c\u53ef\u901a\u8fc7\u7ba1\u7406\u9762\u677f\u58f0\u660e\u5f0f\u5f00\u542f\u5dee\u5206\u9690\u79c1\u3001\u5206\u5272\u5b66\u4e60\u3001\u5c42\u6b21\u805a\u5408\u548c\u77e5\u8bc6\u84b8\u998f\uff0c\u800c\u65e0\u9700\u4fee\u6539\u5ba2\u6237\u7aef\u4ee3\u7801\u3002\u7cfb\u7edf\u5728\u667a\u80fd\u5bb6\u5c45\u5524\u9192\u8bcd\u4efb\u52a1\u4e0a\u5b8c\u6210\u7aef\u5230\u7aef\u6f14\u793a\uff0c\u5c06\u8bad\u7ec3\u4efb\u52a1\u5206\u53d1\u5230\u5b89\u5353\u5ba2\u6237\u7aef\u548c\u5bb9\u5668\u5316\u805a\u5408\u5668\uff0c\u5e76\u5c06\u8bad\u7ec3\u6a21\u578b\u90e8\u7f72\u5230\u7aef\u4fa7\u5b9e\u65f6\u68c0\u6d4b\u5e94\u7528\u4e2d\u3002", "categories": ["cs.LG", "cs.DC", "cs.NI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31061", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u5206\u5e03\u5f0f\u5b66\u4e60", "\u9690\u79c1\u4fdd\u62a4", "\u7aef\u4fa7\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31061v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Distributed Learning as a Service: The Developer\u0027s Perspective", "tldr": "\u672c\u6587\u4ece\u5f00\u53d1\u8005\u89c6\u89d2\u5c55\u793a\u4e86\u4e00\u4e2a\u5206\u5e03\u5f0f\u5b66\u4e60\u5373\u670d\u52a1\uff08DLaaS\uff09\u7cfb\u7edf\uff0c\u53ef\u901a\u8fc7\u7ba1\u7406\u9762\u677f\u58f0\u660e\u5f0f\u5f00\u542f\u5dee\u5206\u9690\u79c1\u3001\u5206\u5272\u5b66\u4e60\u3001\u5c42\u6b21\u805a\u5408\u548c\u77e5\u8bc6\u84b8\u998f\uff0c\u800c\u65e0\u9700\u4fee\u6539\u5ba2\u6237\u7aef\u4ee3\u7801\u3002\u7cfb\u7edf\u5728\u667a\u80fd\u5bb6\u5c45\u5524\u9192\u8bcd\u4efb\u52a1\u4e0a\u5b8c\u6210\u7aef\u5230\u7aef\u6f14\u793a\uff0c\u5c06\u8bad\u7ec3\u4efb\u52a1\u5206\u53d1\u5230\u5b89\u5353\u5ba2\u6237\u7aef\u548c\u5bb9\u5668\u5316\u805a\u5408\u5668\uff0c\u5e76\u5c06\u8bad\u7ec3\u6a21\u578b\u90e8\u7f72\u5230\u7aef\u4fa7\u5b9e\u65f6\u68c0\u6d4b\u5e94\u7528\u4e2d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conversational agents, generative recommenders, and personalized advertising all rest on one capability: understanding each user from raw behavior. Prevailing industrial practice is task-specific: for each task, a relevant subsequence is extracted from the full history and a dedicated model trained on it. In production it hits two bottlenecks. First, even after filtering, a single-task sequence stays extremely long: content-interest summarization reads several hundred items per user, tens of thousands of tokens once serialized as prompt text. Second, profiles are refreshed routinely: a billion users weekly, roughly 100K QPM in aggregate, which under a fixed GPU budget sets a hard throughput floor. Compression is therefore mandatory, yet truncation or coarse compression can silently distort the profile, introducing four hallucination types (fabrication, omission, date misattribution, broken logic) that, with no way to evaluate the compressed representation itself, surface only as diffuse degradation in downstream metrics. We present KuaFu, a unified behavior-compression layer whose minimal unit is one behavior item. A two-axis projector compresses each item into 2-4 tokens of width 128-256 (about 10x along the token axis, 20x along width; per-item cache 10 KB to 0.5 KB), with fidelity-oriented four-stage training and layered intermediate evaluation. Across four production profiling tasks it matches or exceeds uncompressed single-task production models on all five headline metrics, raises per-GPU throughput by 37%-350%, and saves 190 GPUs. On public benchmarks it nearly always beats prior compressors at the same compression ratio (up to +17.7 EM on out-of-domain MRQA); on RecBench, a 4B model surpasses its 8B counterpart by 1.90 points. KuaFu has run on the Tencent advertising and recommendation platform for ten months, lifting overall GMV by 1.37%.", "arxiv_id": "2609.31045", "arxiv_url": "https://arxiv.org/abs/2609.31045", "authors": ["Jiahao Hui", "Lin Zhu", "Yishen Hu", "Jingdong Shu", "Zetai Jiang", "Xining Ran", "Ben Tan", "Yeshou Cai", "Gong Chen", "Haijie Gu", "Jie Jiang"], "brief": "KuaFu\u63d0\u51fa\u7edf\u4e00\u7684\u7528\u6237\u884c\u4e3a\u538b\u7f29\u5c42\uff0c\u4ee5\u5355\u4e2a\u884c\u4e3a\u9879\u4e3a\u6700\u5c0f\u5355\u4f4d\uff0c\u901a\u8fc7\u53cc\u8f74\u6295\u5f71\u5c06\u957f\u884c\u4e3a\u5e8f\u5217\u5927\u5e45\u538b\u7f29\u4e3a\u5c11\u91cf\u4f4e\u7ef4token\uff0c\u5e76\u914d\u5408\u56db\u9636\u6bb5\u4fdd\u771f\u8bad\u7ec3\u4e0e\u4e2d\u95f4\u8bc4\u6d4b\u6765\u51cf\u5c11\u753b\u50cf\u5e7b\u89c9\u3002\u5b83\u57284\u4e2a\u7ebf\u4e0a\u753b\u50cf\u4efb\u52a1\u4e2d\u8fbe\u5230\u6216\u8d85\u8fc7\u672a\u538b\u7f29\u751f\u4ea7\u6a21\u578b\uff0c\u5355\u5361\u541e\u5410\u63d0\u534737%-350%\uff0c\u8282\u7701190\u5757GPU\uff0c\u5e76\u5df2\u5728\u817e\u8baf\u5e7f\u544a\u4e0e\u63a8\u8350\u5e73\u53f0\u8fd0\u884c10\u4e2a\u6708\u5e26\u67651.37% GMV\u63d0\u5347\u3002", "categories": ["cs.IR", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31045", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u7528\u6237\u5efa\u6a21", "\u6a21\u578b\u538b\u7f29", "\u5de5\u4e1a\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31045v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "KuaFu: Compressing Long User Behavior into Understanding at Billion Scale", "tldr": "KuaFu\u63d0\u51fa\u7edf\u4e00\u7684\u7528\u6237\u884c\u4e3a\u538b\u7f29\u5c42\uff0c\u4ee5\u5355\u4e2a\u884c\u4e3a\u9879\u4e3a\u6700\u5c0f\u5355\u4f4d\uff0c\u901a\u8fc7\u53cc\u8f74\u6295\u5f71\u5c06\u957f\u884c\u4e3a\u5e8f\u5217\u5927\u5e45\u538b\u7f29\u4e3a\u5c11\u91cf\u4f4e\u7ef4token\uff0c\u5e76\u914d\u5408\u56db\u9636\u6bb5\u4fdd\u771f\u8bad\u7ec3\u4e0e\u4e2d\u95f4\u8bc4\u6d4b\u6765\u51cf\u5c11\u753b\u50cf\u5e7b\u89c9\u3002\u5b83\u57284\u4e2a\u7ebf\u4e0a\u753b\u50cf\u4efb\u52a1\u4e2d\u8fbe\u5230\u6216\u8d85\u8fc7\u672a\u538b\u7f29\u751f\u4ea7\u6a21\u578b\uff0c\u5355\u5361\u541e\u5410\u63d0\u534737%-350%\uff0c\u8282\u7701190\u5757GPU\uff0c\u5e76\u5df2\u5728\u817e\u8baf\u5e7f\u544a\u4e0e\u63a8\u8350\u5e73\u53f0\u8fd0\u884c10\u4e2a\u6708\u5e26\u67651.37% GMV\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Time series foundation models (TSFMs) enable cross-domain forecasting, but their development as general-purpose forecasters remains constrained by underexplored training potential and limited architectural versatility. To address these challenges, we introduce Aurora-X, a billion-scale TSFM with a progressive curriculum and a unified architecture. We first use channel-independent pretraining to learn temporal patterns, then introduce cross-variable dependencies, varied context and horizon lengths, and future covariates if available during midtraining. Variable-resolution post-training further enables an adjustable temporal span per token at inference. With fixed model weights, this supports longer histories under a fixed token budget or fewer tokens for the same history, enabling test-time scaling. With a versatile architecture, Aurora-X supports cross-variable modeling, covariate conditioning, and parallel decoding of future patches for probabilistic forecasting. These are supported by a novel pattern-guided mixture-of-experts that expands model capacity through sparse activation and uses shallow patch similarities to constrain deep-layer routing, guiding expert specialization across heterogeneous time series. Furthermore, we propose an implicit quantile network head that predicts arbitrary quantiles to characterize predictive distributions, enhancing probabilistic forecasting flexibility. Comprehensive experiments on GIFT-Eval, TIME, FEV-Bench, TFB, and DAG-Bench demonstrate state-of-the-art forecasting performance against pretrained TSFMs and task-specific supervised models.", "arxiv_id": "2609.31038", "arxiv_url": "https://arxiv.org/abs/2609.31038", "authors": ["Xingjian Wu", "Chenjuan Guo", "Xiangfei Qiu", "Zhigang Hu", "Hanyin Cheng", "Peng Chen", "Yang Shu", "Jilin Hu", "Bin Yang"], "brief": "Aurora-X \u662f\u4e00\u4e2a\u5341\u4ebf\u7ea7\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u6e10\u8fdb\u5f0f\u8bad\u7ec3\u8bfe\u7a0b\u548c\u7edf\u4e00\u67b6\u6784\uff0c\u9010\u6b65\u5b66\u4e60\u5355\u53d8\u91cf\u6a21\u5f0f\u3001\u8de8\u53d8\u91cf\u4f9d\u8d56\u3001\u4e0d\u540c\u4e0a\u4e0b\u6587/\u9884\u6d4b\u957f\u5ea6\u53ca\u672a\u6765\u534f\u53d8\u91cf\u3002\u5b83\u5f15\u5165\u53ef\u53d8\u5206\u8fa8\u7387\u63a8\u7406\u3001\u6a21\u5f0f\u5f15\u5bfc\u7684\u7a00\u758f\u4e13\u5bb6\u6df7\u5408\u548c\u9690\u5f0f\u5206\u4f4d\u6570\u9884\u6d4b\u5934\uff0c\u5728\u591a\u4e2a\u65f6\u95f4\u5e8f\u5217\u8bc4\u6d4b\u4e2d\u8fbe\u5230\u9886\u5148\u7684\u6982\u7387\u9884\u6d4b\u6027\u80fd\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31038", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u57fa\u7840\u6a21\u578b", "\u4e13\u5bb6\u6df7\u5408", "\u6982\u7387\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31038v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Aurora-X: Built for Extreme Time Series Forecasting", "tldr": "Aurora-X \u662f\u4e00\u4e2a\u5341\u4ebf\u7ea7\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u6e10\u8fdb\u5f0f\u8bad\u7ec3\u8bfe\u7a0b\u548c\u7edf\u4e00\u67b6\u6784\uff0c\u9010\u6b65\u5b66\u4e60\u5355\u53d8\u91cf\u6a21\u5f0f\u3001\u8de8\u53d8\u91cf\u4f9d\u8d56\u3001\u4e0d\u540c\u4e0a\u4e0b\u6587/\u9884\u6d4b\u957f\u5ea6\u53ca\u672a\u6765\u534f\u53d8\u91cf\u3002\u5b83\u5f15\u5165\u53ef\u53d8\u5206\u8fa8\u7387\u63a8\u7406\u3001\u6a21\u5f0f\u5f15\u5bfc\u7684\u7a00\u758f\u4e13\u5bb6\u6df7\u5408\u548c\u9690\u5f0f\u5206\u4f4d\u6570\u9884\u6d4b\u5934\uff0c\u5728\u591a\u4e2a\u65f6\u95f4\u5e8f\u5217\u8bc4\u6d4b\u4e2d\u8fbe\u5230\u9886\u5148\u7684\u6982\u7387\u9884\u6d4b\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Clustering on graphs where both node attributes and structural links are partially missing remains a challenging task. Existing methods typically rely on imputation-then-clustering on single-view missingness incomplete graphs, which are vulnerable to cross-view error propagation and cluster-boundary blurring under simultaneous attribute and structure missingness. To address these limitations, we propose a Robust Graph Clustering Network for Multiple Missing Data (RGCN), which is designed to handle simultaneous node attribute and graph structure incompleteness. RGCN introduces three key innovations: First, we design a view-decoupled dual-branch imputation to mitigate interference and enable mutual enhancement in recovering missing data. Second, we employ a multi-hyperspherical mixture prior to enhance intra-cluster compactness and inter-cluster separability on a directional latent manifold. Third, a boundary-aware contrastive enhancement objective mitigates the blurring of clusters caused by imputation bias. Extensive experiments on real-world datasets demonstrate that RGCN consistently outperforms state-of-the-art baselines under various missing patterns.", "arxiv_id": "2609.31033", "arxiv_url": "https://arxiv.org/abs/2609.31033", "authors": ["Keyuan Qiu", "Renda Han", "Zhen Tang", "Qiang He", "Xingwei Wang", "Wenxin Zhang", "Guangzhen Yao", "Junxin Chen", "Qingjian Ni"], "brief": "\u672c\u6587\u63d0\u51fa RGCN\uff0c\u7528\u4e8e\u540c\u65f6\u5b58\u5728\u8282\u70b9\u5c5e\u6027\u7f3a\u5931\u548c\u56fe\u7ed3\u6784\u7f3a\u5931\u7684\u56fe\u805a\u7c7b\u4efb\u52a1\u3002\u65b9\u6cd5\u901a\u8fc7\u89c6\u56fe\u89e3\u8026\u7684\u53cc\u5206\u652f\u8865\u5168\u3001\u591a\u8d85\u7403\u9762\u6df7\u5408\u5148\u9a8c\u548c\u8fb9\u754c\u611f\u77e5\u5bf9\u6bd4\u5b66\u4e60\uff0c\u51cf\u5c11\u8de8\u89c6\u56fe\u8bef\u5dee\u4f20\u64ad\u4e0e\u7c07\u8fb9\u754c\u6a21\u7cca\uff0c\u5728\u591a\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31033", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u805a\u7c7b", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u7f3a\u5931\u6570\u636e", "\u5bf9\u6bd4\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31033v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Robust Graph Clustering Network for Multiple Missing Data", "tldr": "\u672c\u6587\u63d0\u51fa RGCN\uff0c\u7528\u4e8e\u540c\u65f6\u5b58\u5728\u8282\u70b9\u5c5e\u6027\u7f3a\u5931\u548c\u56fe\u7ed3\u6784\u7f3a\u5931\u7684\u56fe\u805a\u7c7b\u4efb\u52a1\u3002\u65b9\u6cd5\u901a\u8fc7\u89c6\u56fe\u89e3\u8026\u7684\u53cc\u5206\u652f\u8865\u5168\u3001\u591a\u8d85\u7403\u9762\u6df7\u5408\u5148\u9a8c\u548c\u8fb9\u754c\u611f\u77e5\u5bf9\u6bd4\u5b66\u4e60\uff0c\u51cf\u5c11\u8de8\u89c6\u56fe\u8bef\u5dee\u4f20\u64ad\u4e0e\u7c07\u8fb9\u754c\u6a21\u7cca\uff0c\u5728\u591a\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep ensembles improve robustness in mobile sensing, but repeatedly executing many models over continuous sensor streams is costly. Selecting only a few members reduces this cost, yet adaptive selection often requires additional model execution to obtain reliable evidence about inactive candidates. We present MetaSE, an active ensemble framework that exploits short-term persistence in per-model reliability. MetaSE maintains a small active set across windows, uses post-execution evidence to reject unreliable members, and invokes lightweight routing only when replacement is needed. This stateful design accesses the diversity of a larger pool without repeated full-pool evaluation. Across four HAR datasets and four model architectures, MetaSE consistently improves over a fixed three-model ensemble and achieves accuracy comparable to substantially more expensive adaptive and full-ensemble inference. On a Raspberry Pi 4B, MetaSE is 2.7x faster and uses 69% less memory than full ten-model inference.", "arxiv_id": "2609.31031", "arxiv_url": "https://arxiv.org/abs/2609.31031", "authors": ["Sungmin Lee", "Kichang Lee", "Joonhee Lee", "JaeYeon Park", "Songkuk Kim", "JeongGil Ko"], "brief": "\u8bba\u6587\u63d0\u51fa MetaSE\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8\u611f\u77e5\u7684\u6709\u72b6\u6001\u9009\u62e9\u6027\u96c6\u6210\u65b9\u6cd5\uff0c\u5229\u7528\u5404\u6a21\u578b\u53ef\u9760\u6027\u7684\u77ed\u671f\u6301\u7eed\u6027\uff0c\u53ea\u5728\u9700\u8981\u66ff\u6362\u6210\u5458\u65f6\u8fdb\u884c\u8f7b\u91cf\u8def\u7531\u3002\u5b83\u5728\u591a\u4e2a\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b\u6570\u636e\u96c6\u548c\u6a21\u578b\u67b6\u6784\u4e0a\u8fbe\u5230\u63a5\u8fd1\u5b8c\u6574\u96c6\u6210\u7684\u7cbe\u5ea6\uff0c\u540c\u65f6\u5728 Raspberry Pi 4B \u4e0a\u6bd4\u5341\u6a21\u578b\u5168\u91cf\u63a8\u7406\u5feb 2.7 \u500d\u3001\u5185\u5b58\u51cf\u5c11 69%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31031", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u96c6\u6210", "\u79fb\u52a8\u611f\u77e5", "\u9ad8\u6548\u63a8\u7406", "\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31031v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Metacognitive Selective Ensemble for Mobile Systems", "tldr": "\u8bba\u6587\u63d0\u51fa MetaSE\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8\u611f\u77e5\u7684\u6709\u72b6\u6001\u9009\u62e9\u6027\u96c6\u6210\u65b9\u6cd5\uff0c\u5229\u7528\u5404\u6a21\u578b\u53ef\u9760\u6027\u7684\u77ed\u671f\u6301\u7eed\u6027\uff0c\u53ea\u5728\u9700\u8981\u66ff\u6362\u6210\u5458\u65f6\u8fdb\u884c\u8f7b\u91cf\u8def\u7531\u3002\u5b83\u5728\u591a\u4e2a\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b\u6570\u636e\u96c6\u548c\u6a21\u578b\u67b6\u6784\u4e0a\u8fbe\u5230\u63a5\u8fd1\u5b8c\u6574\u96c6\u6210\u7684\u7cbe\u5ea6\uff0c\u540c\u65f6\u5728 Raspberry Pi 4B \u4e0a\u6bd4\u5341\u6a21\u578b\u5168\u91cf\u63a8\u7406\u5feb 2.7 \u500d\u3001\u5185\u5b58\u51cf\u5c11 69%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Precise, high-speed control remains challenging for robots with complex actuation dynamics. Learning directly on hardware is further constrained by the cost of real-world interaction. We present an online model-based reinforcement learning framework that learns a probabilistic dynamics ensemble model from scratch for sampling-based model predictive control. A precision-gated contouring objective conditions the progress reward on path accuracy, prioritizing precision over speed. In a data-driven excavator simulator, the framework achieves higher sample efficiency than the evaluated model-based reinforcement learning baselines. We validate the framework by learning directly on an 11.5-ton Menzi Muck M445 hydraulic excavator, without demonstrations or simulation pretraining. After 20 minutes of interaction, the controller reaches tracking accuracy comparable to prior learned controllers trained on 100-150 minutes of data. After 40 minutes, it sustains sub-centimeter mean path error at high operating speeds.", "arxiv_id": "2609.31025", "arxiv_url": "https://arxiv.org/abs/2609.31025", "authors": ["Claudio Canales", "Fang Nan", "Marco Hutter", "Javier Ruiz-del-Solar"], "brief": "\u63d0\u51fa\u4e00\u79cd\u5728\u7ebf\u57fa\u4e8e\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4ece\u96f6\u5b66\u4e60\u6982\u7387\u52a8\u529b\u5b66\u96c6\u6210\u6a21\u578b\u5e76\u7528\u4e8e\u91c7\u6837\u5f0f\u6a21\u578b\u9884\u6d4b\u63a7\u5236\uff0c\u4ee5\u63d0\u5347\u6db2\u538b\u6316\u6398\u673a\u7684\u9ad8\u901f\u7cbe\u786e\u63a7\u5236\u3002\u8be5\u65b9\u6cd5\u5728\u4eff\u771f\u4e2d\u6837\u672c\u6548\u7387\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u5728\u771f\u5b9e11.5\u5428\u6316\u6398\u673a\u4e0a\u4ec5\u4ea4\u4e9220\u5206\u949f\u8fbe\u5230\u63a5\u8fd1\u65e2\u6709\u957f\u65f6\u95f4\u8bad\u7ec3\u65b9\u6cd5\u7684\u7cbe\u5ea6\uff0c40\u5206\u949f\u540e\u53ef\u5728\u9ad8\u901f\u4e0b\u4fdd\u6301\u4e9a\u5398\u7c73\u7ea7\u8def\u5f84\u8bef\u5dee\u3002", "categories": ["cs.RO", "cs.LG", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31025", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba\u63a7\u5236", "\u6a21\u578b\u9884\u6d4b\u63a7\u5236", "\u6837\u672c\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31025v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Precision at Speed: Sample-Efficient Online Model-Based Reinforcement Learning for Hydraulic Excavator Control", "tldr": "\u63d0\u51fa\u4e00\u79cd\u5728\u7ebf\u57fa\u4e8e\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4ece\u96f6\u5b66\u4e60\u6982\u7387\u52a8\u529b\u5b66\u96c6\u6210\u6a21\u578b\u5e76\u7528\u4e8e\u91c7\u6837\u5f0f\u6a21\u578b\u9884\u6d4b\u63a7\u5236\uff0c\u4ee5\u63d0\u5347\u6db2\u538b\u6316\u6398\u673a\u7684\u9ad8\u901f\u7cbe\u786e\u63a7\u5236\u3002\u8be5\u65b9\u6cd5\u5728\u4eff\u771f\u4e2d\u6837\u672c\u6548\u7387\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u5728\u771f\u5b9e11.5\u5428\u6316\u6398\u673a\u4e0a\u4ec5\u4ea4\u4e9220\u5206\u949f\u8fbe\u5230\u63a5\u8fd1\u65e2\u6709\u957f\u65f6\u95f4\u8bad\u7ec3\u65b9\u6cd5\u7684\u7cbe\u5ea6\uff0c40\u5206\u949f\u540e\u53ef\u5728\u9ad8\u901f\u4e0b\u4fdd\u6301\u4e9a\u5398\u7c73\u7ea7\u8def\u5f84\u8bef\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sound matching can be formulated as optimizing synthesizer parameters against an audio-domain objective. However, objectives derived from generic audio representations are often difficult to optimize, while direct search requires rendering every candidate. We introduce Synth-JEPA, which learns mutually predictive audio and parameter representations from paired synthesizer data. At inference, candidate parameters are scored directly in this learned space, yielding a renderer-free objective whose audio geometry is shaped by parameter correspondences rather than generic audio similarity. We evaluate Synth-JEPA on Surge XT using held-out synthesizer sounds and out-of-domain NSynth and FSD50K targets, against inverse models, direct search, and learned proxy objectives. Synth-JEPA outperforms all baselines in-domain and remains competitive out-of-domain. Its matching quality continues to improve with additional test-time search, allowing compute to be traded for match quality. In pairwise listening tests, listeners preferred Synth-JEPA in 85% of trials overall. Together, these results show that an audio representation with a parameter-induced geometry allows synthesizer sound matching to be approached as an effective renderer-free search problem.", "arxiv_id": "2609.31024", "arxiv_url": "https://arxiv.org/abs/2609.31024", "authors": ["Ben Hayes", "Haokun Tian", "Stefan Lattner"], "brief": "\u672c\u6587\u63d0\u51fa Synth-JEPA\uff0c\u901a\u8fc7\u6210\u5bf9\u76 olicies in unseen tasks after the agent has been trained on a different set of tasks. Building on the seminal work of the successor representation and further adaptations with function approximation, Transfer in RL has traditionally focused on generalizing to tasks that only differ in the reward function. A decade after the introduction of the successor representation, Robust RL emerged simultaneously from several articles in the field of operations research. In Robust RL, the transition kernel is unknown, and the goal is to maximize the expected reward under this uncertainty. Our work unifies these two paradigms through robust successor features, which generalize across both the reward function and the transition kernel, under the assumption that tasks are linear Markov Decision Processes. We derive a bound on Generalized Policy Improvement (GPI) that explicitly quantifies how performance degrades with the mismatch between transition kernels, recovering existing successor-feature guarantees when dynamics are shared. Finally, the generalization capabilities of robust successor features are validated on several grid-based benchmarks and compared to previous alternatives that focus solely on either the reward or the transition kernel.", "arxiv_id": "2609.31016", "arxiv_url": "https://arxiv.org/abs/2609.31016", "authors": ["Erik Nikulski", "Yamen Habib", "Vicen\u00e7 Gomez", "Anders Jonsson", "Rub\u00e9n Moreno-Bote", "Javier Segovia-Aguas"], "brief": "\u672c\u6587\u63d0\u51fa\u9c81\u68d2\u540e\u7ee7\u7279\u5f81\uff0c\u5c06\u540e\u7ee7\u8868\u793a/\u540e\u7ee7\u7279\u5f81\u7684\u5956\u52b1\u6cdb\u5316\u4e0e\u9c81\u68d2\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u8f6c\u79fb\u6838\u4e0d\u786e\u5b9a\u6027\u7edf\u4e00\u8d77\u6765\u3002\u65b9\u6cd5\u5728\u7ebf\u6027 MDP \u5047\u8bbe\u4e0b\u53ef\u540c\u65f6\u8de8\u5956\u52b1\u51fd\u6570\u548c\u73af\u5883\u52a8\u529b\u5b66\u6cdb\u5316\uff0c\u5e76\u7ed9\u51fa GPI \u6027\u80fd\u9000\u5316\u754c\uff1b\u7f51\u683c\u4efb\u52a1\u5b9e\u9a8c\u663e\u793a\u5176\u4f18\u4e8e\u53ea\u5904\u7406\u5956\u52b1\u6216\u8f6c\u79fb\u53d8\u5316\u7684\u66ff\u4ee3\u65b9\u6cd5\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31016", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u8fc1\u79fb\u5b66\u4e60", "\u9c81\u68d2\u5b66\u4e60", "\u540e\u7ee7\u7279\u5f81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31016v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Robust Successor Features", "tldr": "\u672c\u6587\u63d0\u51fa\u9c81\u68d2\u540e\u7ee7\u7279\u5f81\uff0c\u5c06\u540e\u7ee7\u8868\u793a/\u540e\u7ee7\u7279\u5f81\u7684\u5956\u52b1\u6cdb\u5316\u4e0e\u9c81\u68d2\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u8f6c\u79fb\u6838\u4e0d\u786e\u5b9a\u6027\u7edf\u4e00\u8d77\u6765\u3002\u65b9\u6cd5\u5728\u7ebf\u6027 MDP \u5047\u8bbe\u4e0b\u53ef\u540c\u65f6\u8de8\u5956\u52b1\u51fd\u6570\u548c\u73af\u5883\u52a8\u529b\u5b66\u6cdb\u5316\uff0c\u5e76\u7ed9\u51fa GPI \u6027\u80fd\u9000\u5316\u754c\uff1b\u7f51\u683c\u4efb\u52a1\u5b9e\u9a8c\u663e\u793a\u5176\u4f18\u4e8e\u53ea\u5904\u7406\u5956\u52b1\u6216\u8f6c\u79fb\u53d8\u5316\u7684\u66ff\u4ee3\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
