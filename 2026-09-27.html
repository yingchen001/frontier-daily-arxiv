<script>
const PAPERS = [{"abstract": "Large language models (LLMs) excel at natural language processing but struggle to interact with external environments. Tool learning provides a promising way to extend LLMs into actionable agents, where tool selection is a critical prerequisite for successful tool use. Existing work often assumes a small or predefined set of tools, leaving large-scale tool selection underexplored. Real-world repositories contain a vast and diverse array of tools, making it difficult for LLMs to effectively search, distinguish, and compose tools under context-length constraints. We identify large-scale tool selection as a new challenge for agentic reinforcement learning, highlighting that existing RL methods for knowledge-based question answering are inadequate for selecting tools while considering compatibility. To address this challenge, we propose ToolSearcher, a novel RL framework for effective multi-turn search and fine-grained optimization in large-scale tool selection. Specifically, we introduce category-constrained tool discrimination to improve the model\u0027s ability to distinguish functionally similar tools, event-level search modeling to explicitly optimize the discovery of target tools during multi-turn search, and trajectory-aligned credit allocation to provide fine-grained reward signals for different stages of the search-selection process. Extensive experiments on large-scale tool selection benchmarks demonstrate that ToolSearcher consistently outperforms a set of strong baselines in challenging settings involving iterative search and complex tool composition.", "arxiv_id": "2609.30906", "arxiv_url": "https://arxiv.org/abs/2609.30906", "authors": ["Zhenlong Dai", "Xujie Song", "Zitong Wang", "Tong Niu", "Jian liu", "Weiqiang Wang", "Xiu Tang", "Sai Wu", "Chang Yao", "Jingyuan Chen"], "brief": "\u672c\u6587\u63d0\u51fa ToolSearcher\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u5de5\u5177\u5e93\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u63d0\u5347 LLM \u667a\u80fd\u4f53\u5728\u591a\u8f6e\u641c\u7d22\u4e2d\u7684\u5de5\u5177\u53d1\u73b0\u3001\u533a\u5206\u4e0e\u7ec4\u5408\u80fd\u529b\u3002\u5b83\u9488\u5bf9\u4e0a\u4e0b\u6587\u53d7\u9650\u3001\u5de5\u5177\u76f8\u4f3c\u5ea6\u9ad8\u3001\u7ec4\u5408\u590d\u6742\u7b49\u771f\u5b9e\u573a\u666f\uff0c\u4f18\u5316\u4ece\u641c\u7d22\u5230\u9009\u62e9\u7684\u5168\u8fc7\u7a0b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30906", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u7c7b\u522b\u7ea6\u675f\u5de5\u5177\u5224\u522b\uff0c\u5f3a\u5316\u6a21\u578b\u533a\u5206\u529f\u80fd\u76f8\u8fd1\u5de5\u5177\u7684\u80fd\u529b", "\u5f15\u5165\u4e8b\u4ef6\u7ea7\u641c\u7d22\u5efa\u6a21\uff0c\u663e\u5f0f\u4f18\u5316\u591a\u8f6e\u641c\u7d22\u4e2d\u53d1\u73b0\u76ee\u6807\u5de5\u5177\u7684\u8fc7\u7a0b", "\u8bbe\u8ba1\u8f68\u8ff9\u5bf9\u9f50\u4fe1\u7528\u5206\u914d\uff0c\u4e3a\u641c\u7d22\u3001\u7b5b\u9009\u3001\u7ec4\u5408\u7b49\u9636\u6bb5\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u5956\u52b1\u4fe1\u53f7"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30906v1", "published_at": "2026-09-25", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ToolSearcher: Optimizing Tool Selection at Scale via Reinforcement Learning", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u5927\u89c4\u6a21\u5de5\u5177\u9009\u62e9", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa ToolSearcher\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u5de5\u5177\u5e93\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u63d0\u5347 LLM \u667a\u80fd\u4f53\u5728\u591a\u8f6e\u641c\u7d22\u4e2d\u7684\u5de5\u5177\u53d1\u73b0\u3001\u533a\u5206\u4e0e\u7ec4\u5408\u80fd\u529b\u3002\u5b83\u9488\u5bf9\u4e0a\u4e0b\u6587\u53d7\u9650\u3001\u5de5\u5177\u76f8\u4f3c\u5ea6\u9ad8\u3001\u7ec4\u5408\u590d\u6742\u7b49\u771f\u5b9e\u573a\u666f\uff0c\u4f18\u5316\u4ece\u641c\u7d22\u5230\u9009\u62e9\u7684\u5168\u8fc7\u7a0b\u3002", "why_notable": "\u5927\u89c4\u6a21\u5de5\u5177\u9009\u62e9\u662f LLM \u667a\u80fd\u4f53\u843d\u5730\u7684\u5173\u952e\u74f6\u9888\u4e4b\u4e00\u3002ToolSearcher \u5c06\u5f3a\u5316\u5b66\u4e60\u4ece\u4f20\u7edf\u77e5\u8bc6\u95ee\u7b54\u6269\u5c55\u5230\u5de5\u5177\u641c\u7d22\u4e0e\u517c\u5bb9\u6027\u9009\u62e9\uff0c\u5728\u590d\u6742\u5de5\u5177\u7ec4\u5408\u548c\u8fed\u4ee3\u641c\u7d22\u573a\u666f\u4e0b\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agentic LLM workflows decide their execution paths at runtime. Downstream computation may be predictable, or may have run before, yet it cannot begin until the model or the user resolves the branch. We call this serialization the branch-resolution barrier. Caching alone does not hide it: the key that identifies a reusable result is not known until then. In this paper, we propose DynBranch, which makes an unresolved branch addressable before it resolves. Its stable coordinate lets candidate subgraphs run during resolution and completed subgraph results be reused across later requests. A two-level controller admits this work when its expected benefit exceeds the load price. DynBranch sits at the model-API boundary and requires no changes to agent harnesses or model execution engines. Across four agentic workloads with Qwen3-32B on 4x H200 GPUs, DynBranch reduces mean latency by up to 32% over each workload\u0027s strongest prior system and by 46-66% against a no-reuse floor, while preserving workflow results. The benefit persists across backbone families and on a commodity Qwen3-8B/RTX 4090 deployment.", "arxiv_id": "2609.31047", "arxiv_url": "https://arxiv.org/abs/2609.31047", "authors": ["Junyi Shen", "Noppanat Wadlom", "Zhengyuan Su", "Yao Lu"], "brief": "\u8bba\u6587\u63d0\u51fa DynBranch\uff0c\u7528\u7a33\u5b9a\u5750\u6807\u5728\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u5206\u652f\u5c1a\u672a\u89e3\u6790\u524d\u6807\u8bc6\u6f5c\u5728\u5b50\u56fe\uff0c\u4f7f\u5019\u9009\u4e0b\u6e38\u8ba1\u7b97\u53ef\u63d0\u524d\u6267\u884c\uff0c\u5e76\u8ba9\u5df2\u5b8c\u6210\u5b50\u56fe\u7ed3\u679c\u5728\u540e\u7eed\u8bf7\u6c42\u4e2d\u590d\u7528\u3002\u7cfb\u7edf\u90e8\u7f72\u5728\u6a21\u578b API \u8fb9\u754c\uff0c\u65e0\u9700\u4fee\u6539\u667a\u80fd\u4f53\u6846\u67b6\u6216\u6a21\u578b\u6267\u884c\u5f15\u64ce\u3002", "categories": ["cs.DC", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31047", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5b9a\u4e49\u5e76\u7f13\u89e3\u201c\u5206\u652f\u89e3\u6790\u5c4f\u969c\u201d\uff1a\u52a8\u6001\u6267\u884c\u8def\u5f84\u5fc5\u987b\u7b49\u5f85\u6a21\u578b\u6216\u7528\u6237\u51b3\u7b56\uff0c\u5bfc\u81f4\u53ef\u9884\u6d4b\u6216\u53ef\u590d\u7528\u8ba1\u7b97\u88ab\u4e32\u884c\u5316\u3002", "\u901a\u8fc7\u672a\u89e3\u6790\u5206\u652f\u7684\u7a33\u5b9a\u5730\u5740\u5316\u673a\u5236\uff0c\u5b9e\u73b0\u63a8\u6d4b\u6027\u5b50\u56fe\u6267\u884c\u4e0e\u8de8\u8bf7\u6c42\u7ed3\u679c\u590d\u7528\uff0c\u5f25\u8865\u4f20\u7edf\u7f13\u5b58\u5fc5\u987b\u7b49\u5230 key \u5df2\u77e5\u7684\u4e0d\u8db3\u3002", "\u4e24\u7ea7\u63a7\u5236\u5668\u6309\u9884\u671f\u6536\u76ca\u4e0e\u8d1f\u8f7d\u6210\u672c\u51b3\u5b9a\u662f\u5426\u63a5\u7eb3\u63a8\u6d4b\u5de5\u4f5c\uff1b\u5728 Qwen3-32B\u30014\u00d7H200 \u4e0a\u5e73\u5747\u5ef6\u8fdf\u8f83\u6700\u5f3a\u57fa\u7ebf\u6700\u9ad8\u964d\u4f4e 32%\uff0c\u8f83\u65e0\u590d\u7528\u65b9\u6848\u964d\u4f4e 46\u201366%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u670d\u52a1", "\u63a8\u6d4b\u6267\u884c", "\u7f13\u5b58\u590d\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31047v1", "published_at": "2026-09-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DynBranch: Speculative Subgraph Reuse for Dynamic Agentic LLM Serving", "tldr": "\u63d0\u524d\u590d\u7528\u5206\u652f\u5b50\u56fe\uff0c\u52a0\u901f\u52a8\u6001LLM\u667a\u80fd\u4f53\u670d\u52a1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DynBranch\uff0c\u7528\u7a33\u5b9a\u5750\u6807\u5728\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u5206\u652f\u5c1a\u672a\u89e3\u6790\u524d\u6807\u8bc6\u6f5c\u5728\u5b50\u56fe\uff0c\u4f7f\u5019\u9009\u4e0b\u6e38\u8ba1\u7b97\u53ef\u63d0\u524d\u6267\u884c\uff0c\u5e76\u8ba9\u5df2\u5b8c\u6210\u5b50\u56fe\u7ed3\u679c\u5728\u540e\u7eed\u8bf7\u6c42\u4e2d\u590d\u7528\u3002\u7cfb\u7edf\u90e8\u7f72\u5728\u6a21\u578b API \u8fb9\u754c\uff0c\u65e0\u9700\u4fee\u6539\u667a\u80fd\u4f53\u6846\u67b6\u6216\u6a21\u578b\u6267\u884c\u5f15\u64ce\u3002", "why_notable": "DynBranch \u9488\u5bf9\u667a\u80fd\u4f53 LLM \u670d\u52a1\u4e2d\u7684\u52a8\u6001\u5206\u652f\u74f6\u9888\u63d0\u51fa\u7cfb\u7edf\u7ea7\u4f18\u5316\uff0c\u5728\u4e0d\u4fb5\u5165\u73b0\u6709 agent harness \u548c\u63a8\u7406\u5f15\u64ce\u7684\u524d\u63d0\u4e0b\u663e\u8457\u964d\u4f4e\u5ef6\u8fdf\uff0c\u5177\u5907\u8f83\u5f3a\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\uff0c\u5e76\u53ef\u8de8\u6a21\u578b\u5bb6\u65cf\u4e0e\u6d88\u8d39\u7ea7\u786c\u4ef6\u90e8\u7f72\u4fdd\u6301\u6536\u76ca\u3002"}, {"abstract": "Surgical scene understanding is critical for computer-assisted intervention, yet laparoscopic cholecystectomy remains challenged by the complex anatomy of the hepatocystic triangle and the risk of bile duct injury. Existing methods for Critical View of Safety (CVS) assessment typically treat it as a holistic prediction task, mapping visual features directly to criterion-level labels. This black-box paradigm lacks explicit reasoning about anatomical relationships, limiting both interpretability and compositional generalization. To address this, we propose ReasonCVS, a structured reasoning agentic framework empowered by Vision-Language Models (VLMs) that decomposes CVS assessment into explicit, fine-grained anatomical verification. Specifically, we devise an Anatomical Scene Graph Abstraction (ASGA) that organizes anatomical entities and their spatial relationships into a structured representation. To operationalize this, we introduce a Rationale-Aware Reasoning Agent, powered by a Large Language Model (LLM) fine-tuned via rationale distillation. Functioning as a strict central decision-maker, it invokes VLM-driven Sub-criterion Verifier as a specialized perceptual tool to parse the graph and independently evaluate individual sub-criteria. Through calibrated soft reasoning, this agent synthesizes the tool-gathered distributed observations, yielding a final verdict alongside a traceable clinical rationale. Extensive experiments on the Endoscapes-CVS201 benchmark demonstrate that ReasonCVS achieves superior performance (68.1\\% mAP) over state-of-the-art while providing interpretable, criterion-level explanations for reliable surgical assessment.", "arxiv_id": "2609.31524", "arxiv_url": "https://arxiv.org/abs/2609.31524", "authors": ["Qing Xu", "Yuxiang Luo", "Zhen Chen"], "brief": "\u8bba\u6587\u63d0\u51fa ReasonCVS\uff0c\u5c06\u8179\u8154\u955c\u80c6\u56ca\u5207\u9664\u4e2d\u7684 Critical View of Safety \u8bc4\u4f30\u62c6\u89e3\u4e3a\u7ec6\u7c92\u5ea6\u89e3\u5256\u7ed3\u6784\u4e0e\u7a7a\u95f4\u5173\u7cfb\u9a8c\u8bc1\u3002\u6846\u67b6\u7528\u89e3\u5256\u573a\u666f\u56fe\u8868\u793a\u573a\u666f\uff0c\u5e76\u7531\u7ecf\u63a8\u7406\u84b8\u998f\u5fae\u8c03\u7684 LLM \u667a\u80fd\u4f53\u8c03\u7528 VLM \u5b50\u6807\u51c6\u9a8c\u8bc1\u5668\uff0c\u751f\u6210\u6700\u7ec8\u5224\u65ad\u4e0e\u53ef\u8ffd\u6eaf\u4e34\u5e8a\u4f9d\u636e\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31524", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa Anatomical Scene Graph Abstraction\uff0c\u5c06\u89e3\u5256\u5b9e\u4f53\u53ca\u5176\u7a7a\u95f4\u5173\u7cfb\u7ec4\u7ec7\u4e3a\u7ed3\u6784\u5316\u8868\u793a\uff0c\u66ff\u4ee3\u7aef\u5230\u7aef\u9ed1\u7bb1\u6807\u7b7e\u9884\u6d4b\u3002", "\u8bbe\u8ba1 Rationale-Aware Reasoning Agent\uff0c\u7531 LLM \u4f5c\u4e3a\u4e2d\u592e\u51b3\u7b56\u8005\u8c03\u7528 VLM \u611f\u77e5\u5de5\u5177\uff0c\u9010\u9879\u9a8c\u8bc1 CVS \u5b50\u6807\u51c6\u3002", "\u5728 Endoscapes-CVS201 \u57fa\u51c6\u4e0a\u8fbe\u5230 68.1% mAP\uff0c\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u63d0\u4f9b\u6807\u51c6\u7ea7\u53ef\u89e3\u91ca\u63a8\u7406\u94fe\u3002"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31524v1", "published_at": "2026-09-25", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Structured Reasoning Agentic Framework for Interpretable Critical View of Safety Assessment", "tldr": "\u7528LLM/VLM\u667a\u80fd\u4f53\u53ef\u89e3\u91ca\u8bc4\u4f30\u624b\u672fCVS\u5b89\u5168\u89c6\u91ce", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ReasonCVS\uff0c\u5c06\u8179\u8154\u955c\u80c6\u56ca\u5207\u9664\u4e2d\u7684 Critical View of Safety \u8bc4\u4f30\u62c6\u89e3\u4e3a\u7ec6\u7c92\u5ea6\u89e3\u5256\u7ed3\u6784\u4e0e\u7a7a\u95f4\u5173\u7cfb\u9a8c\u8bc1\u3002\u6846\u67b6\u7528\u89e3\u5256\u573a\u666f\u56fe\u8868\u793a\u573a\u666f\uff0c\u5e76\u7531\u7ecf\u63a8\u7406\u84b8\u998f\u5fae\u8c03\u7684 LLM \u667a\u80fd\u4f53\u8c03\u7528 VLM \u5b50\u6807\u51c6\u9a8c\u8bc1\u5668\uff0c\u751f\u6210\u6700\u7ec8\u5224\u65ad\u4e0e\u53ef\u8ffd\u6eaf\u4e34\u5e8a\u4f9d\u636e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u533b\u5b66\u89c6\u89c9\u8bc4\u4f30\u4ece\u6574\u4f53\u9ed1\u7bb1\u5206\u7c7b\u63a8\u8fdb\u5230\u7ed3\u6784\u5316\u3001\u53ef\u89e3\u91ca\u7684\u63a8\u7406\u6d41\u7a0b\uff0c\u5bf9\u9ad8\u98ce\u9669\u624b\u672f\u573a\u666f\u4e2d\u7684\u53ef\u4fe1 AI \u8f85\u52a9\u51b3\u7b56\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "The growing popularity of short videos has driven demand for one-click content creation. Visual templates turn uploaded images into personalized content with preset effects, but reusable template generation still requires substantial manual effort in asset preparation and tool orchestration. We propose TemplateCraft, a multi-agent system that converts natural-language instructions into client-executable templates through planning, material generation, effect-workflow generation, and protocol compilation. Its Planner-Evaluator loop uses execution feedback for targeted rollback, while stage-level and long-term memory support revision without parameter updates. We evaluate TemplateCraft on TemplateBench, derived from 60 real-world templates. With the same Qwen3-VL backbone, TemplateCraft raises image/video generation success rates from 56.7%/30.0% to 66.7%/50.0% over Planner-only (best-of-three) and improves template adherence and style consistency. With additional evaluation and revision, it matches or exceeds a GPT-4o Planner-only baseline on selected metrics. Persistent assets further improve cross-input style consistency.", "arxiv_id": "2609.31451", "arxiv_url": "https://arxiv.org/abs/2609.31451", "authors": ["Hongjie Yu", "Zhiyuan Fan", "Yuzhe Zhang", "Jiangcun Du", "Zhicheng Gao", "Yuhong Zhang", "Xiaokai Zhan", "Zongshi Xie"], "brief": "TemplateCraft \u662f\u4e00\u4e2a\u9762\u5411\u77ed\u89c6\u9891\u4e00\u952e\u521b\u4f5c\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u5c06\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u8f6c\u5316\u4e3a\u5ba2\u6237\u7aef\u53ef\u6267\u884c\u7684\u89c6\u89c9\u6a21\u677f\u3002\u5b83\u8986\u76d6\u89c4\u5212\u3001\u7d20\u6750\u751f\u6210\u3001\u7279\u6548\u5de5\u4f5c\u6d41\u751f\u6210\u4e0e\u534f\u8bae\u7f16\u8bd1\uff0c\u5e76\u901a\u8fc7\u53cd\u9988\u5faa\u73af\u548c\u8bb0\u5fc6\u673a\u5236\u652f\u6301\u8fed\u4ee3\u4fee\u8ba2\u3002", "categories": ["cs.MM", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31451", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa Planner-Evaluator \u95ed\u73af\uff0c\u5229\u7528\u6267\u884c\u53cd\u9988\u8fdb\u884c\u6709\u9488\u5bf9\u6027\u7684\u56de\u6eda\u4e0e\u4fee\u6b63\uff0c\u800c\u975e\u4ece\u5934\u91cd\u8bd5\u3002", "\u5f15\u5165\u9636\u6bb5\u7ea7\u8bb0\u5fc6\u4e0e\u957f\u671f\u8bb0\u5fc6\uff0c\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u652f\u6301\u6a21\u677f\u4fee\u6539\u3001\u590d\u7528\u548c\u98ce\u683c\u4fdd\u6301\u3002", "\u5728\u57fa\u4e8e 60 \u4e2a\u771f\u5b9e\u6a21\u677f\u6784\u5efa\u7684 TemplateBench \u4e0a\uff0c\u76f8\u540c Qwen3-VL \u9aa8\u5e72\u4e0b\uff0c\u56fe\u50cf/\u89c6\u9891\u751f\u6210\u6210\u529f\u7387\u4ece Planner-only \u7684 56.7%/30.0% \u63d0\u5347\u5230 66.7%/50.0%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u89c6\u9891\u751f\u6210", "\u5185\u5bb9\u521b\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31451v1", "published_at": "2026-09-25", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "TemplateCraft: Agentic Visual Template Generation", "tldr": "\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u751f\u6210\u53ef\u590d\u7528\u89c6\u89c9\u6a21\u677f", "upvotes": 0, "what_it_is": "TemplateCraft \u662f\u4e00\u4e2a\u9762\u5411\u77ed\u89c6\u9891\u4e00\u952e\u521b\u4f5c\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u5c06\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u8f6c\u5316\u4e3a\u5ba2\u6237\u7aef\u53ef\u6267\u884c\u7684\u89c6\u89c9\u6a21\u677f\u3002\u5b83\u8986\u76d6\u89c4\u5212\u3001\u7d20\u6750\u751f\u6210\u3001\u7279\u6548\u5de5\u4f5c\u6d41\u751f\u6210\u4e0e\u534f\u8bae\u7f16\u8bd1\uff0c\u5e76\u901a\u8fc7\u53cd\u9988\u5faa\u73af\u548c\u8bb0\u5fc6\u673a\u5236\u652f\u6301\u8fed\u4ee3\u4fee\u8ba2\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u89c9\u6a21\u677f\u751f\u4ea7\u4ece\u4eba\u5de5\u8d44\u4ea7\u51c6\u5907\u548c\u5de5\u5177\u7f16\u6392\u63a8\u8fdb\u5230\u53ef\u6267\u884c\u7684\u667a\u80fd\u4f53\u81ea\u52a8\u5316\u6d41\u7a0b\uff0c\u5bf9\u77ed\u89c6\u9891\u3001\u8425\u9500\u7d20\u6750\u548c\u4e2a\u6027\u5316\u5185\u5bb9\u751f\u4ea7\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\uff0c\u5e76\u5c55\u793a\u4e86\u591a\u667a\u80fd\u4f53\u5728\u591a\u5a92\u4f53\u521b\u4f5c\u5de5\u5177\u94fe\u4e2d\u7684\u843d\u5730\u6f5c\u529b\u3002"}, {"abstract": "Ordinal acne severity grading requires distinguishing visually similar neighboring grades while jointly weighing holistic facial appearance and localized lesion burden - evidence that most existing approaches collapse into a single opaque representation. We introduce CG-HAF, a global-local fusion framework that instead keeps this evidence explicit: averaged holistic severity probabilities from independently trained classifiers are combined with structured lesion-burden descriptors from an object detector (lesion count, detection confidence, lesion area) into a compact representation, from which a lightweight, interpretable classifier produces the final grade. On a widely used benchmark, this fusion yields a clear, statistically supported improvement over global-evidence-only baselines, with the largest gains on the most severe cases. Testing on an independent dataset with a different grading standard shows that strong within-dataset performance does not transfer automatically, and a follow-up diagnostic attributes much of this gap to mismatched grading criteria rather than detection failure alone. These findings support interpretable global-local fusion as an effective strategy for ordinal acne grading while highlighting criterion alignment as key to cross-dataset portability, with a further illustration of how the resulting severity signal can support transparent, non-diagnostic decision-making in skincare applications.", "arxiv_id": "2609.31326", "arxiv_url": "https://arxiv.org/abs/2609.31326", "authors": ["Muhammad Muhtasim Shahriar", "Md. Naimur Asif Borno", "Saad Aloteibi", "Mohammad Ali Moni"], "brief": "\u8bba\u6587\u63d0\u51fa CG-HAF\uff0c\u7528\u4e8e\u6709\u5e8f\u75e4\u75ae\u4e25\u91cd\u5ea6\u5206\u7ea7\u3002\u5b83\u5c06\u5168\u8138\u5916\u89c2\u5206\u7c7b\u5668\u7684\u4e25\u91cd\u5ea6\u6982\u7387\u4e0e\u76ee\u6807\u68c0\u6d4b\u5668\u63d0\u53d6\u7684\u75c5\u7076\u6570\u91cf\u3001\u7f6e\u4fe1\u5ea6\u3001\u9762\u79ef\u7b49\u5c40\u90e8\u8d1f\u62c5\u7279\u5f81\u878d\u5408\uff0c\u518d\u7531\u8f7b\u91cf\u53ef\u89e3\u91ca\u5206\u7c7b\u5668\u8f93\u51fa\u6700\u7ec8\u7b49\u7ea7\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31326", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u663e\u5f0f\u4fdd\u7559\u5168\u5c40\u9762\u90e8\u5916\u89c2\u8bc1\u636e\u4e0e\u5c40\u90e8\u75c5\u7076\u8d1f\u62c5\u8bc1\u636e\uff0c\u907f\u514d\u5355\u4e00\u9ed1\u7bb1\u8868\u5f81\u3002", "\u5728\u5e38\u7528\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u4ec5\u4f7f\u7528\u5168\u5c40\u8bc1\u636e\u7684\u57fa\u7ebf\uff0c\u5c24\u5176\u5728\u91cd\u5ea6\u75c5\u4f8b\u4e0a\u63d0\u5347\u6700\u5927\u3002", "\u8de8\u6570\u636e\u96c6\u6d4b\u8bd5\u663e\u793a\u6027\u80fd\u8fc1\u79fb\u53d7\u9650\uff0c\u4e3b\u8981\u539f\u56e0\u4e0e\u5206\u7ea7\u6807\u51c6\u4e0d\u5339\u914d\u6709\u5173\uff0c\u800c\u4e0d\u53ea\u662f\u68c0\u6d4b\u5931\u8d25\u3002"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u53ef\u89e3\u91caAI", "\u76ee\u6807\u68c0\u6d4b", "\u591a\u6a21\u6001\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31326v1", "published_at": "2026-09-25", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CG-HAF: An Interpretable Global-Local Lesion-Burden Fusion Framework for Ordinal Acne Severity Grading in Agentic Skincare Support", "tldr": "\u53ef\u89e3\u91ca\u878d\u5408\u5168\u8138\u4e0e\u75c5\u7076\u4fe1\u606f\u8bc4\u4f30\u75e4\u75ae\u4e25\u91cd\u5ea6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CG-HAF\uff0c\u7528\u4e8e\u6709\u5e8f\u75e4\u75ae\u4e25\u91cd\u5ea6\u5206\u7ea7\u3002\u5b83\u5c06\u5168\u8138\u5916\u89c2\u5206\u7c7b\u5668\u7684\u4e25\u91cd\u5ea6\u6982\u7387\u4e0e\u76ee\u6807\u68c0\u6d4b\u5668\u63d0\u53d6\u7684\u75c5\u7076\u6570\u91cf\u3001\u7f6e\u4fe1\u5ea6\u3001\u9762\u79ef\u7b49\u5c40\u90e8\u8d1f\u62c5\u7279\u5f81\u878d\u5408\uff0c\u518d\u7531\u8f7b\u91cf\u53ef\u89e3\u91ca\u5206\u7c7b\u5668\u8f93\u51fa\u6700\u7ec8\u7b49\u7ea7\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u63d0\u5347\u4e86\u75e4\u75ae\u5206\u7ea7\u7684\u53ef\u89e3\u91ca\u6027\u4e0e\u5b9e\u7528\u6027\uff0c\u9002\u5408\u900f\u660e\u7684\u62a4\u80a4\u8f85\u52a9\u51b3\u7b56\uff1b\u540c\u65f6\u6307\u51fa\u533b\u5b66/\u7f8e\u5bb9\u89c6\u89c9\u4efb\u52a1\u4e2d\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u4e0d\u4ec5\u4f9d\u8d56\u6a21\u578b\u80fd\u529b\uff0c\u8fd8\u5f3a\u4f9d\u8d56\u6807\u6ce8\u4e0e\u5206\u7ea7\u6807\u51c6\u5bf9\u9f50\u3002"}, {"abstract": "Representation autoencoders (RAEs) reuse features from a pretrained visual encoder as reconstruction and diffusion latents, integrating strong visual representations into image generation. However, RAEs still need to decide which encoder layers form the shared latent space for the generator and pixel decoder. This choice involves a trade-off. Shallower layers tend to preserve fine pixel details better, while deeper layers tend to yield better generation metrics. A fixed heuristic layer fusion therefore couples two stages that benefit from different information. We introduce FuseReg, which replaces heuristic feature selection with training over random subsets of encoder layers. We theoretically analyze the underlying mechanism: subset sampling explicitly penalizes sensitivity to cross-layer disagreement. On ImageNet-256 with DINOv3-L, a single FuseReg decoder reconstructs from full, sparse, and single-layer fusions without retraining, achieving higher PSNR than decoders specialized to fixed fusions. This flexibility also benefits generation: decoder replacement alone reduces unguided gFID by 27% with an unchanged RAEv2 DiT-XL generator. The same regularization principle extends to diffusion training, with joint regularization of both stages reducing unguided gFID by 29% on DiT-Base. These results show that training downstream models for layer-fusion robustness narrows the reconstruction-generation gap without modifying the pretrained encoder.", "arxiv_id": "2609.31620", "arxiv_url": "https://arxiv.org/abs/2609.31620", "authors": ["Hongyang Du", "Yunfei Xie", "Junjie Ye", "Jiawei Yang", "Xiaoyan Cong", "Haodong Zhang", "Yongchao Huang", "Haiyu Wu", "Zongxia Li", "Shihang Gui", "Dawei Liu", "Runhao Li", "Jingcheng Ni", "Chen Wei", "Randall Balestriero", "Yue Wang"], "brief": "\u672c\u6587\u63d0\u51fa FuseReg\uff0c\u7528\u968f\u673a\u91c7\u6837\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u5c42\u5b50\u96c6\u6765\u8bad\u7ec3 RAE \u89e3\u7801\u5668\u548c\u6269\u6563\u6a21\u578b\uff0c\u66ff\u4ee3\u56fa\u5b9a\u542f\u53d1\u5f0f\u5c42\u878d\u5408\u3002\u5b83\u4f7f\u4e0b\u6e38\u6a21\u578b\u5bf9\u4e0d\u540c\u5c42\u878d\u5408\u66f4\u9c81\u68d2\uff0c\u4ece\u800c\u540c\u65f6\u6539\u5584\u56fe\u50cf\u91cd\u5efa\u4e0e\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Hongyang-Du/FuseReg", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.31620", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa RAE \u4e2d\u6d45\u5c42\u5229\u4e8e\u50cf\u7d20\u7ec6\u8282\u91cd\u5efa\u3001\u6df1\u5c42\u5229\u4e8e\u751f\u6210\u6307\u6807\uff0c\u56fa\u5b9a\u5c42\u878d\u5408\u4f1a\u628a\u4e24\u9636\u6bb5\u9700\u6c42\u5f3a\u884c\u8026\u5408", "\u7406\u8bba\u5206\u6790\u8868\u660e\uff0c\u968f\u673a\u5b50\u96c6\u91c7\u6837\u7b49\u4ef7\u4e8e\u663e\u5f0f\u60e9\u7f5a\u6a21\u578b\u5bf9\u8de8\u5c42\u8868\u5f81\u4e0d\u4e00\u81f4\u7684\u654f\u611f\u6027", "\u5728 ImageNet-256 + DINOv3-L \u4e0a\uff0c\u5355\u4e2a FuseReg \u89e3\u7801\u5668\u53ef\u65e0\u9700\u91cd\u8bad\u652f\u6301\u5168\u5c42\u3001\u7a00\u758f\u548c\u5355\u5c42\u878d\u5408\uff0c\u5e76\u4f18\u4e8e\u56fa\u5b9a\u878d\u5408\u4e13\u7528\u89e3\u7801\u5668\uff1b\u4ec5\u66ff\u6362\u89e3\u7801\u5668\u5373\u53ef\u4f7f RAEv2 DiT-XL \u7684 unguided gFID \u964d\u4f4e 27%"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u8868\u793a\u81ea\u7f16\u7801\u5668", "\u6269\u6563\u6a21\u578b", "\u6b63\u5219\u5316"], "num_comments": 1, "on_hf": true, "organization": "USC Physical Superintelligence (PSI) Lab", "pdf_url": "https://arxiv.org/pdf/2609.31620v1", "published_at": "2026-09-25", "score": 0.285, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.31620.png", "title": "FuseReg: Regularizing Layer Fusion Mitigates the Reconstruction-Generation Gap in Representation Autoencoders", "tldr": "\u968f\u673a\u5c42\u878d\u5408\u6b63\u5219\u7f13\u89e3RAE\u91cd\u5efa\u4e0e\u751f\u6210\u51b2\u7a81", "upvotes": 14, "what_it_is": "\u672c\u6587\u63d0\u51fa FuseReg\uff0c\u7528\u968f\u673a\u91c7\u6837\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u5c42\u5b50\u96c6\u6765\u8bad\u7ec3 RAE \u89e3\u7801\u5668\u548c\u6269\u6563\u6a21\u578b\uff0c\u66ff\u4ee3\u56fa\u5b9a\u542f\u53d1\u5f0f\u5c42\u878d\u5408\u3002\u5b83\u4f7f\u4e0b\u6e38\u6a21\u578b\u5bf9\u4e0d\u540c\u5c42\u878d\u5408\u66f4\u9c81\u68d2\uff0c\u4ece\u800c\u540c\u65f6\u6539\u5584\u56fe\u50cf\u91cd\u5efa\u4e0e\u751f\u6210\u8d28\u91cf\u3002", "why_notable": "FuseReg \u4e0d\u4fee\u6539\u9884\u8bad\u7ec3\u7f16\u7801\u5668\uff0c\u53ea\u901a\u8fc7\u5c42\u878d\u5408\u9c81\u68d2\u8bad\u7ec3\u5c31\u7f29\u5c0f\u4e86 RAE \u7684\u91cd\u5efa-\u751f\u6210\u5dee\u8ddd\uff0c\u63d0\u5347\u4e86\u8868\u793a\u81ea\u7f16\u7801\u5668\u5728\u6269\u6563\u751f\u6210\u4e2d\u7684\u5b9e\u7528\u6027\u548c\u53ef\u8fc1\u79fb\u6027\u3002"}, {"abstract": "World Action Models (WAMs) jointly model visual dynamics and action generation for generalist robot manipulation. A central challenge is to integrate priors from large-scale pretrained models---including visual dynamics, scene semantics, geometry, and motion---into a unified framework for robot action generation. We introduce InternW0-$\u0394$, a unified WAM pretrained on a heterogeneous corpus that outperforms prior methods across simulation benchmarks and real-robot platforms. InternW0-$\u0394$ combines pretrained visual dynamics, scene-level semantics, 4D geometric and motion priors, and action generation within a Mixture-of-Transformers (MoT) framework. A pretrained video expert and an action expert interact under semantic guidance from a frozen VLM, while a pretrained 4D foundation model injects geometric and motion priors through training-only distillation. We further introduce Causal Imprint, which learns future-relevant scene changes from training-only future supervision and provides predictive representations directly to the action expert without future-video rollout at inference. For large-scale joint training, we construct a heterogeneous corpus of robot demonstrations, UMI data, egocentric human demonstrations, and Ego2Robot data, curated and aligned under a common state-action representation. The resulting corpus contains over 20K hours of processed training data, to our knowledge the largest open-source corpus of its kind. We pretrain InternW0-$\u0394$ on this corpus and demonstrate strong performance across simulation benchmarks and real-robot platforms. We will open source the training code, model weights, infrastructure, data-processing pipeline, and processed data where licenses permit. Project page: https://internrobotics.github.io/InternW0-Delta/", "arxiv_id": "2609.31394", "arxiv_url": "https://arxiv.org/abs/2609.31394", "authors": ["Xingyu Miao", "Zizun Li", "Baole Fang", "Kaiwen Song", "Tenghui Wang", "Hanxue Zhang", "Yating Wang", "Xudong Li", "Yuping He", "Xueyuan Wei", "Chao Gao", "Xijie Yang", "Yingxiang Xu", "Kerui Ren", "Wenqi Guo", "Jianjun Zhou", "Xinzhe Wang", "Weiguang Zhao", "Ni Yang", "Zetao Cai", "Yufei Xue", "Hengjie Li", "Zeyu He", "Yuanzhen Zhou", "Rong Fu", "Jianyang Zhang", "Siwei Cui", "Fuxian Huang", "Yunsong Zhou", "Xing Gao", "Yifei Yao", "Qiaojun Yu", "Kailin Li", "Ming Zhou", "Mu Huang", "Xinyue Li", "Wenze Cui", "Bingqi Jiang", "Xueyue Zhu", "Junting Dong", "Haoyu Guo", "Tao Lu", "Mulin Yu", "Bowen Zhou", "Bin Zhao", "Tianfan Xue", "Weinan Zhang", "Chunhua Shen"], "brief": "\u8bba\u6587\u63d0\u51fa InternW0-\u0394\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684 World Action Model\uff0c\u7528\u4e8e\u540c\u65f6\u5efa\u6a21\u89c6\u89c9\u52a8\u6001\u4e0e\u673a\u5668\u4eba\u52a8\u4f5c\u751f\u6210\u3002\u5b83\u878d\u5408\u89c6\u9891\u52a8\u6001\u3001\u573a\u666f\u8bed\u4e49\u30014D\u51e0\u4f55\u4e0e\u8fd0\u52a8\u5148\u9a8c\uff0c\u5e76\u5728\u8d85\u8fc72\u4e07\u5c0f\u65f6\u5f02\u6784\u5f00\u653e\u6570\u636e\u4e0a\u9884\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31394", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 Mixture-of-Transformers \u6846\u67b6\uff0c\u8ba9\u9884\u8bad\u7ec3\u89c6\u9891\u4e13\u5bb6\u4e0e\u52a8\u4f5c\u4e13\u5bb6\u5728\u51bb\u7ed3 VLM \u7684\u8bed\u4e49\u5f15\u5bfc\u4e0b\u534f\u540c\u5de5\u4f5c", "\u901a\u8fc7\u8bad\u7ec3\u671f\u84b8\u998f\u5f15\u5165\u9884\u8bad\u7ec34D\u57fa\u7840\u6a21\u578b\u7684\u51e0\u4f55\u4e0e\u8fd0\u52a8\u5148\u9a8c\uff0c\u63a8\u7406\u65f6\u65e0\u9700\u989d\u59164D\u6a21\u578b", "\u63d0\u51fa Causal Imprint\uff0c\u7528\u8bad\u7ec3\u671f\u672a\u6765\u76d1\u7763\u5b66\u4e60\u4e0e\u4efb\u52a1\u76f8\u5173\u7684\u672a\u6765\u573a\u666f\u53d8\u5316\uff0c\u5e76\u5c06\u9884\u6d4b\u8868\u5f81\u76f4\u63a5\u63d0\u4f9b\u7ed9\u52a8\u4f5c\u4e13\u5bb6", "\u6784\u5efa\u5305\u542b\u673a\u5668\u4eba\u6f14\u793a\u3001UMI\u3001\u81ea\u6211\u4e2d\u5fc3\u4eba\u7c7b\u6f14\u793a\u4e0e Ego2Robot \u6570\u636e\u76842\u4e07\u5c0f\u65f6\u7ea7\u5f00\u653e\u8bad\u7ec3\u8bed\u6599"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u52a8\u4f5c\u751f\u6210", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31394v1", "published_at": "2026-09-25", "score": 0.254, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.31394.png", "title": "InternW0-$\u0394$: A World Action Model Bridging Predictive Dynamics and Actions with 20K+ Hours of Open Data", "tldr": "20K\u5c0f\u65f6\u5f00\u653e\u6570\u636e\u9884\u8bad\u7ec3\u673a\u5668\u4eba\u4e16\u754c\u52a8\u4f5c\u6a21\u578b", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa InternW0-\u0394\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684 World Action Model\uff0c\u7528\u4e8e\u540c\u65f6\u5efa\u6a21\u89c6\u89c9\u52a8\u6001\u4e0e\u673a\u5668\u4eba\u52a8\u4f5c\u751f\u6210\u3002\u5b83\u878d\u5408\u89c6\u9891\u52a8\u6001\u3001\u573a\u666f\u8bed\u4e49\u30014D\u51e0\u4f55\u4e0e\u8fd0\u52a8\u5148\u9a8c\uff0c\u5e76\u5728\u8d85\u8fc72\u4e07\u5c0f\u65f6\u5f02\u6784\u5f00\u653e\u6570\u636e\u4e0a\u9884\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u79cd\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u5148\u9a8c\u7cfb\u7edf\u6027\u6574\u5408\u5230\u673a\u5668\u4eba\u52a8\u4f5c\u751f\u6210\u4e2d\uff0c\u5e76\u914d\u5957\u53d1\u5e03\u5927\u89c4\u6a21\u5f00\u653e\u6570\u636e\u3001\u6a21\u578b\u548c\u8bad\u7ec3\u57fa\u7840\u8bbe\u65bd\uff0c\u6709\u671b\u63a8\u52a8\u901a\u7528\u673a\u5668\u4eba\u64cd\u4f5c\u6a21\u578b\u7684\u53ef\u590d\u73b0\u8bad\u7ec3\u4e0e\u6269\u5c55\u3002"}, {"abstract": "Reasoning models often generate very long reasoning traces, making inference computationally expensive. Existing approaches typically improve efficiency either through inference-time early-stopping mechanisms or by explicitly encouraging shorter reasoning during training, for example through reinforcement learning with length penalties. We show that substantial efficiency gains can instead emerge from a different kind of supervision: \\textit{confidence}. Using a self-supervised procedure, we fine-tune reasoning models to predict their confidence in the answer at intermediate points along their own reasoning trajectories using only 600 training problems. Confidence is used only as a training target: the loss contains no objective for reasoning length, efficiency, or stopping. At inference, the fine-tuned models use the standard generation procedure, with no confidence elicitation or early-stopping mechanism. Despite this, self-supervised confidence fine-tuning makes reasoning more efficient, reducing generated tokens by up to 25\\% at matched accuracy across Gemma, Qwen, Nemotron, and GPT-OSS models on mathematical, scientific, and coding reasoning benchmarks, with efficiency gains comparable to methods that explicitly optimize for shorter reasoning. Analysis of reasoning episodes further shows that confidence supervision largely preserves the base models\u0027 high-level reasoning composition rather than selectively suppressing particular behaviors. Our results suggest that efficient reasoning may emerge as a downstream consequence of learning metacognitive signals, without being directly optimized.", "arxiv_id": "2609.31619", "arxiv_url": "https://arxiv.org/abs/2609.31619", "authors": ["Parsa Hosseini", "Akasha Tigalappanavara", "Sumit Nawathe", "Chenrui Fan", "Sourya Basu", "Genta Indra Winata", "Anirban Das", "Soheil Feizi", "Nima Chitsazan"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u81ea\u76d1\u7763\u7f6e\u4fe1\u5ea6\u5fae\u8c03\u65b9\u6cd5\uff1a\u8ba9\u63a8\u7406\u6a21\u578b\u5728\u81ea\u8eab\u63a8\u7406\u8f68\u8ff9\u7684\u4e2d\u95f4\u4f4d\u7f6e\u9884\u6d4b\u6700\u7ec8\u7b54\u6848\u7f6e\u4fe1\u5ea6\u3002\u8bad\u7ec3\u4e2d\u4e0d\u52a0\u5165\u957f\u5ea6\u3001\u6548\u7387\u6216\u505c\u6b62\u76ee\u6807\uff0c\u63a8\u7406\u65f6\u4e5f\u4e0d\u4f7f\u7528\u65e9\u505c\uff0c\u5374\u80fd\u81ea\u7136\u51cf\u5c11\u751f\u6210\u957f\u5ea6\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31619", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ec5\u7528600\u4e2a\u8bad\u7ec3\u9898\uff0c\u5bf9Gemma\u3001Qwen\u3001Nemotron\u3001GPT-OSS\u7b49\u63a8\u7406\u6a21\u578b\u8fdb\u884c\u7f6e\u4fe1\u5ea6\u76d1\u7763\u5fae\u8c03", "\u5728\u6570\u5b66\u3001\u79d1\u5b66\u4e0e\u4ee3\u7801\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u5728\u51c6\u786e\u7387\u76f8\u5f53\u7684\u60c5\u51b5\u4e0b\u751f\u6210token\u6700\u591a\u51cf\u5c1125%", "\u5206\u6790\u663e\u793a\u8be5\u65b9\u6cd5\u57fa\u672c\u4fdd\u7559\u539f\u6a21\u578b\u7684\u9ad8\u5c42\u63a8\u7406\u7ed3\u6784\uff0c\u800c\u975e\u7b80\u5355\u538b\u5236\u67d0\u7c7b\u63a8\u7406\u884c\u4e3a"], "keywords": ["\u63a8\u7406\u6548\u7387", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u7f6e\u4fe1\u5ea6\u4f30\u8ba1", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31619v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Learning to Stop without Learning to Stop: Self-Supervised Confidence Training Improves Reasoning Efficiency", "tldr": "\u81ea\u76d1\u7763\u7f6e\u4fe1\u5ea6\u8bad\u7ec3\u8ba9\u63a8\u7406\u66f4\u77ed\u4e14\u4e0d\u964d\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u81ea\u76d1\u7763\u7f6e\u4fe1\u5ea6\u5fae\u8c03\u65b9\u6cd5\uff1a\u8ba9\u63a8\u7406\u6a21\u578b\u5728\u81ea\u8eab\u63a8\u7406\u8f68\u8ff9\u7684\u4e2d\u95f4\u4f4d\u7f6e\u9884\u6d4b\u6700\u7ec8\u7b54\u6848\u7f6e\u4fe1\u5ea6\u3002\u8bad\u7ec3\u4e2d\u4e0d\u52a0\u5165\u957f\u5ea6\u3001\u6548\u7387\u6216\u505c\u6b62\u76ee\u6807\uff0c\u63a8\u7406\u65f6\u4e5f\u4e0d\u4f7f\u7528\u65e9\u505c\uff0c\u5374\u80fd\u81ea\u7136\u51cf\u5c11\u751f\u6210\u957f\u5ea6\u3002", "why_notable": "\u5b83\u8868\u660e\u63d0\u5347\u6a21\u578b\u7684\u5143\u8ba4\u77e5\u4fe1\u53f7\u53ef\u80fd\u95f4\u63a5\u5e26\u6765\u63a8\u7406\u6548\u7387\uff0c\u800c\u65e0\u9700\u663e\u5f0f\u957f\u5ea6\u60e9\u7f5a\u6216\u63a8\u7406\u65f6\u65e9\u505c\uff0c\u4e3a\u4f4e\u6210\u672c\u4f18\u5316\u957f\u94fe\u63a8\u7406\u63d0\u4f9b\u4e86\u65b0\u65b9\u5411\u3002"}, {"abstract": "LLMs increasingly act as purchasing agents, which makes the LLM, not the user, the one choosing among the options that satisfy a request; its preferences quietly fix what gets bought and what it costs. Hotel booking is a clean instance: a high-volume choice settled on a few comparable attributes, where the pick reveals those preferences. We introduce PriceBench, a diagnostic benchmark that recovers an LLM\u0027s price, quality, and brand preferences from its booking choices with a logit choice model, applied to 28 LLMs from 8 providers on 3,600 hotel tasks from 179 real New York City properties. We find that capability is associated with how consistently an LLM chooses, not with what it chooses: more capable LLMs hold stronger, more consistent preferences, while weaker ones either lock onto one position, exploitable by whoever controls listing order, or choose almost indifferently. What those preferences favor varies sharply across providers and even within one family: price sensitivity spans more than an order of magnitude, and the price/quality trade-off moves mean booked nightly price from \\$247 to \\$393 on identical tasks. What an agent buys must therefore be measured per LLM, not inferred, and we release the tasks, code, and all 28 response sets.", "arxiv_id": "2609.31468", "arxiv_url": "https://arxiv.org/abs/2609.31468", "authors": ["Pavel Kireyev"], "brief": "\u8bba\u6587\u63d0\u51fa PriceBench\uff0c\u7528\u771f\u5b9e\u7ebd\u7ea6\u9152\u5e97\u4efb\u52a1\u8bca\u65ad LLM \u4f5c\u4e3a\u8ba2\u623f\u4ee3\u7406\u65f6\u7684\u4ef7\u683c\u3001\u8d28\u91cf\u4e0e\u54c1\u724c\u504f\u597d\u3002\u4f5c\u8005\u7528 logit \u9009\u62e9\u6a21\u578b\u5206\u6790 8 \u5bb6\u63d0\u4f9b\u5546\u7684 28 \u4e2a LLM \u5728 3600 \u4e2a\u4efb\u52a1\u4e0a\u7684\u9009\u62e9\uff0c\u5e76\u516c\u5f00\u4efb\u52a1\u3001\u4ee3\u7801\u4e0e\u54cd\u5e94\u6570\u636e\u3002", "categories": ["econ.GN", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31468", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u66f4\u5f3a\u6a21\u578b\u5e76\u4e0d\u4e00\u5b9a\u9009\u62e9\u66f4\u4fbf\u5b9c\u6216\u66f4\u9ad8\u8d28\u91cf\u9152\u5e97\uff0c\u800c\u662f\u8868\u73b0\u51fa\u66f4\u7a33\u5b9a\u3001\u66f4\u4e00\u81f4\u7684\u504f\u597d\u3002", "\u4e0d\u540c\u6a21\u578b\u548c\u5382\u5546\u7684\u4ef7\u683c\u654f\u611f\u5ea6\u5dee\u5f02\u8d85\u8fc7\u4e00\u4e2a\u6570\u91cf\u7ea7\uff0c\u540c\u4e00\u4efb\u52a1\u4e0b\u5e73\u5747\u8ba2\u623f\u4ef7\u683c\u53ef\u4ece247\u7f8e\u5143\u53d8\u5230393\u7f8e\u5143\u3002", "\u5f31\u6a21\u578b\u5bb9\u6613\u56fa\u5b9a\u9009\u62e9\u5217\u8868\u67d0\u4e2a\u4f4d\u7f6e\u6216\u8fd1\u4f3c\u968f\u673a\u9009\u62e9\uff0c\u53ef\u80fd\u88ab\u6392\u5e8f\u63a7\u5236\u65b9\u5229\u7528\u3002"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u8bc4\u6d4b", "\u7ecf\u6d4e\u504f\u597d", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31468v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PriceBench: A Diagnostic Benchmark for Price, Quality, and Brand Preferences in LLM Booking Agents", "tldr": "PriceBench\u91cf\u5316LLM\u8ba2\u623f\u504f\u597d\u5dee\u5f02", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PriceBench\uff0c\u7528\u771f\u5b9e\u7ebd\u7ea6\u9152\u5e97\u4efb\u52a1\u8bca\u65ad LLM \u4f5c\u4e3a\u8ba2\u623f\u4ee3\u7406\u65f6\u7684\u4ef7\u683c\u3001\u8d28\u91cf\u4e0e\u54c1\u724c\u504f\u597d\u3002\u4f5c\u8005\u7528 logit \u9009\u62e9\u6a21\u578b\u5206\u6790 8 \u5bb6\u63d0\u4f9b\u5546\u7684 28 \u4e2a LLM \u5728 3600 \u4e2a\u4efb\u52a1\u4e0a\u7684\u9009\u62e9\uff0c\u5e76\u516c\u5f00\u4efb\u52a1\u3001\u4ee3\u7801\u4e0e\u54cd\u5e94\u6570\u636e\u3002", "why_notable": "\u968f\u7740 LLM \u5145\u5f53\u8d2d\u4e70\u4e0e\u9884\u8ba2\u4ee3\u7406\uff0c\u5176\u9690\u542b\u504f\u597d\u4f1a\u76f4\u63a5\u5f71\u54cd\u7528\u6237\u82b1\u8d39\u548c\u5e02\u573a\u5206\u914d\uff1b\u8be5\u57fa\u51c6\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u65b9\u6cd5\u6765\u9010\u6a21\u578b\u6d4b\u91cf\u8fd9\u4e9b\u504f\u597d\uff0c\u800c\u4e0d\u662f\u5047\u8bbe\u6a21\u578b\u4f1a\u5fe0\u5b9e\u4ee3\u8868\u7528\u6237\u5229\u76ca\u3002"}, {"abstract": "Retrieval-augmented generation (RAG) is often used to address outdated knowledge by providing external evidence. But retrieval helps only when that evidence is still valid. We identify a temporal alignment failure, stale-document poisoning, in which outdated evidence makes a model wrong despite answering correctly without retrieval. We construct a benchmark of 317 verified knowledge reversals across medicine, law, software, and platform policy, grounded in dated official sources. Across 12 models, recent medical reversals are harder than long-established ones. More importantly, outdated retrieval flips 30% of Llama and 37% of Qwen answers even without instructions to trust the document; explicit follow instructions raise these rates to 66% and 75%. Across four open models and four domains, poisoning ranges from 17-91%, while matched up-to-date evidence is followed in 97-100% of trials. To isolate temporal applicability, we keep the historical evidence unchanged across 50 reversals and vary only the evaluation date. A clear pattern emerges: dates alone produce only modest adaptation, but when models are explicitly told when the old evidence stops applying, the larger models switch to the appropriate answer almost perfectly. Causal interventions confirm that this validity information directly shapes the final decision. The same internal components also support broader comparison tasks, suggesting that temporal applicability can recruit a general reasoning mechanism used for other comparisons. Finally, a fixed recency-aware hybrid re-ranker reduces poisoning by 4.6-10.0 points when dates are accurate, with gains that depend on reliable temporal metadata. Reliable RAG therefore requires selective trust: models must determine not only what retrieved evidence says, but whether it still applies.", "arxiv_id": "2609.31342", "arxiv_url": "https://arxiv.org/abs/2609.31342", "authors": ["Md Shamim Ahmed", "Lukas Galke Poech", "Richard R\u00f6ttger"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u8fc7\u671f\u6587\u6863\u6295\u6bd2\u201d\u8fd9\u4e00RAG\u65f6\u95f4\u5bf9\u9f50\u5931\u6548\u73b0\u8c61\uff1a\u6a21\u578b\u672c\u53ef\u7b54\u5bf9\uff0c\u4f46\u56e0\u68c0\u7d22\u5230\u5df2\u5931\u6548\u8bc1\u636e\u800c\u6539\u9519\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u6db5\u76d6\u533b\u7597\u3001\u6cd5\u5f8b\u3001\u8f6f\u4ef6\u548c\u5e73\u53f0\u653f\u7b56\u7684317\u4e2a\u771f\u5b9e\u77e5\u8bc6\u53cd\u8f6c\u57fa\u51c6\uff0c\u5e76\u7cfb\u7edf\u8bc4\u4f30\u591a\u6a21\u578b\u53d7\u5f71\u54cd\u7a0b\u5ea6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31342", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u572812\u4e2a\u6a21\u578b\u4e0a\uff0c\u8fc7\u671f\u68c0\u7d22\u53ef\u5c06Llama\u7ea630%\u3001Qwen\u7ea637%\u7684\u6b63\u786e\u56de\u7b54\u7ffb\u8f6c\u4e3a\u9519\u8bef\uff1b\u82e5\u663e\u5f0f\u8981\u6c42\u9075\u5faa\u6587\u6863\uff0c\u9519\u8bef\u7387\u5347\u81f366%\u548c75%\u3002", "\u56db\u4e2a\u5f00\u6e90\u6a21\u578b\u3001\u56db\u4e2a\u9886\u57df\u4e2d\uff0c\u6295\u6bd2\u7387\u8303\u56f4\u4e3a17%-91%\uff1b\u800c\u5339\u914d\u7684\u6700\u65b0\u8bc1\u636e\u51e0\u4e4e\u603b\u88ab\u9075\u5faa\uff0c\u8fbe97%-100%\u3002", "\u4ec5\u63d0\u4f9b\u65e5\u671f\u53ea\u80fd\u5e26\u6765\u6709\u9650\u9002\u5e94\uff1b\u82e5\u660e\u786e\u8bf4\u660e\u65e7\u8bc1\u636e\u4f55\u65f6\u5931\u6548\uff0c\u5927\u6a21\u578b\u51e0\u4e4e\u80fd\u5b8c\u5168\u5207\u6362\u5230\u6b63\u786e\u7b54\u6848\uff0c\u8bf4\u660e\u201c\u65f6\u6548\u9002\u7528\u6027\u201d\u662f\u5173\u952e\u53d8\u91cf\u3002"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u65f6\u6548\u6027", "\u6a21\u578b\u53ef\u9760\u6027", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31342v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Stale-Document Poisoning: When Outdated Retrieval Overrides Correct Model Answers", "tldr": "\u8fc7\u671f\u68c0\u7d22\u8bc1\u636e\u4f1a\u663e\u8457\u8bef\u5bfcRAG\u56de\u7b54", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u8fc7\u671f\u6587\u6863\u6295\u6bd2\u201d\u8fd9\u4e00RAG\u65f6\u95f4\u5bf9\u9f50\u5931\u6548\u73b0\u8c61\uff1a\u6a21\u578b\u672c\u53ef\u7b54\u5bf9\uff0c\u4f46\u56e0\u68c0\u7d22\u5230\u5df2\u5931\u6548\u8bc1\u636e\u800c\u6539\u9519\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u6db5\u76d6\u533b\u7597\u3001\u6cd5\u5f8b\u3001\u8f6f\u4ef6\u548c\u5e73\u53f0\u653f\u7b56\u7684317\u4e2a\u771f\u5b9e\u77e5\u8bc6\u53cd\u8f6c\u57fa\u51c6\uff0c\u5e76\u7cfb\u7edf\u8bc4\u4f30\u591a\u6a21\u578b\u53d7\u5f71\u54cd\u7a0b\u5ea6\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86RAG\u7cfb\u7edf\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u98ce\u9669\uff1a\u68c0\u7d22\u5230\u7684\u8bc1\u636e\u5e76\u975e\u8d8a\u591a\u8d8a\u597d\uff0c\u5173\u952e\u5728\u4e8e\u662f\u5426\u4ecd\u7136\u6709\u6548\u3002\u5b83\u4e3a\u65f6\u95f4\u654f\u611f\u578bRAG\u8bc4\u6d4b\u3001\u5b89\u5168\u90e8\u7f72\u548c\u91cd\u6392\u5e8f\u5668\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u65b0\u57fa\u51c6\u4e0e\u5b9e\u8bc1\u4f9d\u636e\u3002"}, {"abstract": "Urban uncrewed aerial vehicle (UAV) vision-language navigation (VLN) requires agents to follow instructions across extended urban spaces, inherently demanding long-term memory and geospatial grounding. However, scaling existing benchmarks remains difficult because of their reliance on costly reconstructed 3D assets, limiting geographic diversity and episode scale. To address this, we introduce SatNav, a scalable, long-horizon UAV VLN benchmark built from high-resolution satellite imagery. SatNav targets city-level navigation missions and uses satellite crops as approximations of UAV nadir views for visual observations. Through an automated cue-to-episode pipeline, SatNav constructs 118K episodes from 59 scenes across 18 cities, with an average trajectory length of 379 m. To stress-test long-horizon memory and geospatial reasoning, SatNav defines three task families: Boundary, Landmark, and Route, targeting loop progress tracking, landmark-based spatial grounding, and route following with counting cues. Benchmarking classical VLN agents and recent agents based on large vision-language models (LVLMs) on SatNav shows that city-scale navigation remains challenging. We further introduce SwiftVLN, a modular framework with switchable memory components, and conduct systematic memory-design ablations. Finally, satellite-to-UAV transfer experiments show that satellite-trained navigation models can operate on real-flight UAV observations, showing the practical relevance of SatNav. Our project page: https://eku127.github.io/SatNav/", "arxiv_id": "2609.31507", "arxiv_url": "https://arxiv.org/abs/2609.31507", "authors": ["Jiajun Jiang", "Chunliang Hua", "Zichun Chen", "Yanxing Wu", "Zeyuan Yang", "Jie Song", "Xiao Hu"], "brief": "\u8bba\u6587\u63d0\u51fa SatNav\uff0c\u4e00\u4e2a\u57fa\u4e8e\u9ad8\u5206\u8fa8\u7387\u536b\u661f\u5f71\u50cf\u7684\u53ef\u6269\u5c55\u957f\u7a0b\u65e0\u4eba\u673a\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u57fa\u51c6\u3002\u5b83\u81ea\u52a8\u751f\u6210\u8de818\u5ea7\u57ce\u5e02\u300159\u4e2a\u573a\u666f\u768411.8\u4e07\u6761\u5bfc\u822a\u4efb\u52a1\uff0c\u5e76\u8bc4\u6d4b\u4f20\u7edfVLN\u4e0e\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31507", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528\u536b\u661f\u56fe\u50cf\u88c1\u526a\u8fd1\u4f3c\u65e0\u4eba\u673a\u4fef\u89c6\u89c6\u89d2\uff0c\u907f\u514d\u4f9d\u8d56\u6602\u8d353D\u91cd\u5efa\u8d44\u4ea7\uff0c\u663e\u8457\u63d0\u5347\u5730\u7406\u8986\u76d6\u4e0e\u4efb\u52a1\u89c4\u6a21\u3002", "\u5305\u542b Boundary\u3001Landmark\u3001Route \u4e09\u7c7b\u4efb\u52a1\uff0c\u5206\u522b\u8003\u5bdf\u73af\u8def\u8fdb\u5ea6\u8bb0\u5fc6\u3001\u5730\u6807\u7a7a\u95f4 grounding\u3001\u5e26\u8ba1\u6570\u7ebf\u7d22\u7684\u8def\u7ebf\u8ddf\u968f\u3002", "\u63d0\u51fa SwiftVLN \u6a21\u5757\u5316\u6846\u67b6\u5e76\u7cfb\u7edf\u6d88\u878d\u8bb0\u5fc6\u7ec4\u4ef6\uff1b\u5b9e\u9a8c\u663e\u793a\u536b\u661f\u56fe\u8bad\u7ec3\u6a21\u578b\u53ef\u8fc1\u79fb\u5230\u771f\u5b9e\u65e0\u4eba\u673a\u98de\u884c\u89c2\u6d4b\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u65e0\u4eba\u673a", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31507v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SatNav: A Scalable Benchmark for Long-Horizon UAV Vision-Language Navigation from Satellite Imagery", "tldr": "\u536b\u661f\u56fe\u6784\u5efa\u57ce\u5e02\u7ea7\u957f\u7a0b\u65e0\u4eba\u673aVLN\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SatNav\uff0c\u4e00\u4e2a\u57fa\u4e8e\u9ad8\u5206\u8fa8\u7387\u536b\u661f\u5f71\u50cf\u7684\u53ef\u6269\u5c55\u957f\u7a0b\u65e0\u4eba\u673a\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u57fa\u51c6\u3002\u5b83\u81ea\u52a8\u751f\u6210\u8de818\u5ea7\u57ce\u5e02\u300159\u4e2a\u573a\u666f\u768411.8\u4e07\u6761\u5bfc\u822a\u4efb\u52a1\uff0c\u5e76\u8bc4\u6d4b\u4f20\u7edfVLN\u4e0e\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u3002", "why_notable": "SatNav \u5c06\u65e0\u4eba\u673aVLN\u4ece\u5c0f\u89c4\u6a213D\u73af\u5883\u6269\u5c55\u5230\u57ce\u5e02\u7ea7\u957f\u7a0b\u4efb\u52a1\uff0c\u7a81\u51fa\u957f\u671f\u8bb0\u5fc6\u4e0e\u5730\u7406\u63a8\u7406\u74f6\u9888\uff0c\u5e76\u5c55\u793a\u4e86\u536b\u661f\u5230\u771f\u5b9e\u65e0\u4eba\u673a\u7684\u5b9e\u7528\u8fc1\u79fb\u6f5c\u529b\u3002"}, {"abstract": "Spatial reasoning with metric constraints requires linking objects to geometric measurements and preserving their numerical content during language reasoning. We present DepthEvidence, a 4B model that uses its own dense metric predictions as object-grounded evidence for language generation. A camera-conditioned decoder predicts full-resolution metric depth using multi-scale visual features and high-resolution RGB refinement. A dense-to-language interface converts predicted depths and decoder features into object-aligned continuous geometry tokens anchored to object identifiers. Geometric supervision encourages metric information to remain recoverable before and after language-context interaction, while instruction tuning supports object measurement and compositional reasoning. We introduce a Depth-VQA benchmark evaluating object-depth queries, relative comparisons, and decisions combining spatial and numerical constraints. Across nine datasets, DepthEvidence achieves the highest average dense $\u03b4_1$ among evaluated methods, competitive with specialized estimators. It also leads the evaluated methods in instance-level metric depth estimation and overall accuracy on both relative and metric reasoning tracks, while broadly preserving general VQA performance and improving spatial understanding relative to the base model.", "arxiv_id": "2609.31103", "arxiv_url": "https://arxiv.org/abs/2609.31103", "authors": ["Jiangning Wei", "Yuan Yao", "Miaomiao Cui", "Mingsheng Li", "Humen Zhong", "Shuai Bai", "Zhibo Yang"], "brief": "DepthEvidence \u662f\u4e00\u4e2a 4B \u591a\u6a21\u6001\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u81ea\u8eab\u9884\u6d4b\u7684\u5168\u5206\u8fa8\u7387\u5ea6\u91cf\u6df1\u5ea6\u4f5c\u4e3a\u9762\u5411\u5bf9\u8c61\u7684\u8bc1\u636e\uff0c\u7528\u4e8e\u56de\u7b54\u5e26\u6570\u503c\u7ea6\u675f\u7684\u7a7a\u95f4\u95ee\u9898\u3002\u8bba\u6587\u8fd8\u63d0\u51fa Depth-VQA \u57fa\u51c6\uff0c\u8bc4\u4f30\u5bf9\u8c61\u6df1\u5ea6\u3001\u76f8\u5bf9\u6df1\u5ea6\u6bd4\u8f83\u4ee5\u53ca\u7a7a\u95f4\u4e0e\u6570\u503c\u7ea6\u675f\u7ec4\u5408\u63a8\u7406\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31103", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u76f8\u673a\u6761\u4ef6\u89e3\u7801\u5668\u7ed3\u5408\u591a\u5c3a\u5ea6\u89c6\u89c9\u7279\u5f81\u4e0e\u9ad8\u5206\u8fa8\u7387 RGB \u7ec6\u5316\uff0c\u9884\u6d4b\u7a20\u5bc6\u5ea6\u91cf\u6df1\u5ea6\u3002", "\u901a\u8fc7 dense-to-language \u63a5\u53e3\u628a\u6df1\u5ea6\u4e0e\u89e3\u7801\u5668\u7279\u5f81\u8f6c\u6362\u4e3a\u7ed1\u5b9a\u5bf9\u8c61\u6807\u8bc6\u7684\u8fde\u7eed\u51e0\u4f55 token\u3002", "\u51e0\u4f55\u76d1\u7763\u786e\u4fdd\u5ea6\u91cf\u4fe1\u606f\u5728\u8fdb\u5165\u8bed\u8a00\u4e0a\u4e0b\u6587\u524d\u540e\u4ecd\u53ef\u6062\u590d\uff0c\u5e76\u901a\u8fc7\u6307\u4ee4\u5fae\u8c03\u652f\u6301\u5bf9\u8c61\u6d4b\u91cf\u548c\u7ec4\u5408\u63a8\u7406\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u6df1\u5ea6\u4f30\u8ba1", "\u7a7a\u95f4\u63a8\u7406", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31103v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DepthEvidence: Unifying Metric Depth Prediction and Geometric Reasoning in Multimodal Language Models", "tldr": "\u7528\u6df1\u5ea6\u9884\u6d4b\u589e\u5f3a\u591a\u6a21\u6001\u51e0\u4f55\u63a8\u7406", "upvotes": 0, "what_it_is": "DepthEvidence \u662f\u4e00\u4e2a 4B \u591a\u6a21\u6001\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u81ea\u8eab\u9884\u6d4b\u7684\u5168\u5206\u8fa8\u7387\u5ea6\u91cf\u6df1\u5ea6\u4f5c\u4e3a\u9762\u5411\u5bf9\u8c61\u7684\u8bc1\u636e\uff0c\u7528\u4e8e\u56de\u7b54\u5e26\u6570\u503c\u7ea6\u675f\u7684\u7a7a\u95f4\u95ee\u9898\u3002\u8bba\u6587\u8fd8\u63d0\u51fa Depth-VQA \u57fa\u51c6\uff0c\u8bc4\u4f30\u5bf9\u8c61\u6df1\u5ea6\u3001\u76f8\u5bf9\u6df1\u5ea6\u6bd4\u8f83\u4ee5\u53ca\u7a7a\u95f4\u4e0e\u6570\u503c\u7ea6\u675f\u7ec4\u5408\u63a8\u7406\u3002", "why_notable": "\u5b83\u628a\u4e13\u7528\u6df1\u5ea6\u4f30\u8ba1\u80fd\u529b\u4e0e\u591a\u6a21\u6001\u8bed\u8a00\u63a8\u7406\u7edf\u4e00\u8d77\u6765\uff0c\u4f7f\u6a21\u578b\u4e0d\u4ec5\u201c\u770b\u61c2\u201d\u573a\u666f\uff0c\u8fd8\u80fd\u4fdd\u7559\u5e76\u4f7f\u7528\u7cbe\u786e\u51e0\u4f55\u6570\u503c\uff1b\u5728\u4e5d\u4e2a\u6570\u636e\u96c6\u4e0a\u517c\u987e\u7a20\u5bc6\u6df1\u5ea6\u4f30\u8ba1\u3001\u5b9e\u4f8b\u7ea7\u5ea6\u91cf\u6df1\u5ea6\u548c\u7a7a\u95f4\u95ee\u7b54\u8868\u73b0\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Efficient video generation requires reducing the quadratic cost of self-attention over long spatio-temporal token sequences. Existing efficient-attention methods typically apply the same computation pattern to every token, even though denoising difficulty varies substantially across video regions and evolves throughout the generation process. We introduce HetA-DiT, a heterogeneous attention mechanism that adaptively allocates computation according to token difficulty. A lightweight uncertainty branch predicts a token-wise estimate of denoising difficulty, which is used to route uncertain tokens through dense global attention while processing more reliable tokens with efficient local attention. The resulting routing is content- and timestep-adaptive, retains global context where it matters most, and provides a single parameter for controlling the quality-efficiency trade-off. HetA-DiT is compatible with few-step distribution-matching distillation and introduces no additional Transformer evaluation at inference time by reusing uncertainty estimates from the preceding denoising step. We evaluate the method on DMD-distilled Wan2.2-5B and Wan2.1-1.3B models. Across VBench, VBench-2.0, and human preference evaluation, HetA-DiT maintains competitive generation quality while routing only approximately 20% of tokens through dense attention.", "arxiv_id": "2609.31050", "arxiv_url": "https://arxiv.org/abs/2609.31050", "authors": ["Olga Zatsarynna", "Denis Korzhenkov", "Juergen Gall", "Amir Habibian", "Mohsen Ghafoorian"], "brief": "\u8bba\u6587\u63d0\u51fa HetA-DiT\uff0c\u4e00\u79cd\u7528\u4e8e\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u5f02\u6784\u6ce8\u610f\u529b\u673a\u5236\u3002\u5b83\u6839\u636e token \u7684\u53bb\u566a\u4e0d\u786e\u5b9a\u6027\uff0c\u81ea\u9002\u5e94\u51b3\u5b9a\u4f7f\u7528\u5168\u5c40\u5bc6\u96c6\u6ce8\u610f\u529b\u6216\u9ad8\u6548\u5c40\u90e8\u6ce8\u610f\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31050", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u8f7b\u91cf\u4e0d\u786e\u5b9a\u6027\u5206\u652f\u9884\u6d4b token \u7ea7\u53bb\u566a\u96be\u5ea6\uff0c\u5c06\u9ad8\u4e0d\u786e\u5b9a token \u8def\u7531\u5230\u5bc6\u96c6\u5168\u5c40\u6ce8\u610f\u529b\u3002", "\u8def\u7531\u7b56\u7565\u540c\u65f6\u4f9d\u8d56\u5185\u5bb9\u4e0e\u6269\u6563\u65f6\u95f4\u6b65\uff0c\u5e76\u63d0\u4f9b\u5355\u4e00\u53c2\u6570\u8c03\u8282\u8d28\u91cf\u4e0e\u6548\u7387\u6743\u8861\u3002", "\u5728 DMD \u84b8\u998f\u7684 Wan2.2-5B \u4e0e Wan2.1-1.3B \u4e0a\u9a8c\u8bc1\uff0c\u4ec5\u7ea6 20% token \u4f7f\u7528\u5bc6\u96c6\u6ce8\u610f\u529b\u4ecd\u4fdd\u6301\u8f83\u597d\u8d28\u91cf\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u9ad8\u6548\u6ce8\u610f\u529b", "\u6a21\u578b\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31050v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Where Compute Matters: Heterogeneous Attention for Efficient Video Diffusion", "tldr": "\u6309\u96be\u5ea6\u5206\u914d\u89c6\u9891\u6269\u6563\u6ce8\u610f\u529b\u8ba1\u7b97", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HetA-DiT\uff0c\u4e00\u79cd\u7528\u4e8e\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u5f02\u6784\u6ce8\u610f\u529b\u673a\u5236\u3002\u5b83\u6839\u636e token \u7684\u53bb\u566a\u4e0d\u786e\u5b9a\u6027\uff0c\u81ea\u9002\u5e94\u51b3\u5b9a\u4f7f\u7528\u5168\u5c40\u5bc6\u96c6\u6ce8\u610f\u529b\u6216\u9ad8\u6548\u5c40\u90e8\u6ce8\u610f\u529b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u89c6\u9891\u6269\u6563\u4e2d\u957f\u65f6\u7a7a\u5e8f\u5217\u81ea\u6ce8\u610f\u529b\u6210\u672c\u8fc7\u9ad8\u7684\u95ee\u9898\uff0c\u907f\u514d\u5bf9\u6240\u6709 token \u4e00\u89c6\u540c\u4ec1\u5730\u524a\u51cf\u8ba1\u7b97\uff0c\u800c\u662f\u628a\u5168\u5c40\u8ba1\u7b97\u96c6\u4e2d\u5728\u66f4\u96be\u751f\u6210\u7684\u533a\u57df\uff0c\u517c\u987e\u751f\u6210\u8d28\u91cf\u4e0e\u63a8\u7406\u6548\u7387\uff0c\u4e14\u63a8\u7406\u65f6\u65e0\u9700\u989d\u5916 Transformer \u8bc4\u4f30\u3002"}, {"abstract": "Open-vocabulary 3D maps enable robots to reason about previously unknown environments using natural language. However, existing systems typically segment every incoming image, associate detections with persistent 3D segments, and frequently perform costly Vision-Language (VL) inference. We present TRACKGRAPH, an online open-vocabulary system that maintains short-term 2D mask identity directly in the image stream before fusing segments into 3D. FastSAM masks and CLIP features are computed at sparse keyframes, while dense DINOv3 features are used to propagate masks at a high rate in between. The resulting tracked masks are fused into a class-agnostic 3D segment layer within a hierarchical scene graph, with 3D association handling tracking interruptions and long-term revisits. Compact multi-view CLIP embeddings enable open-vocabulary retrieval. Across Replica, ScanNet++, and HM3D, TRACKGRAPH achieves competitive open-vocabulary segmentation and retrieval against state-of-the-art mapping methods, including the highest synonym frequency on Replica (0.50). On the same NVIDIA A100, it is 1.7x faster and uses 3.3x less GPU memory than ViT-H OVI-MAP. Real-world quadruped deployments demonstrate onboard scene graph construction and object search at 7.5Hz, while recorded drone data is used to test the method under aerial viewpoints.", "arxiv_id": "2609.31005", "arxiv_url": "https://arxiv.org/abs/2609.31005", "authors": ["Peder Borge Hellesylt", "Albert Gassol Puigjaner", "Kostas Alexis", "Annette Stahl"], "brief": "TRACKGRAPH \u662f\u4e00\u4e2a\u5728\u7ebf\u5f00\u653e\u8bcd\u6c473D\u573a\u666f\u56fe\u7cfb\u7edf\uff0c\u5148\u5728\u56fe\u50cf\u6d41\u4e2d\u7ef4\u62a4\u77ed\u671f2D\u63a9\u7801\u8eab\u4efd\uff0c\u518d\u878d\u5408\u52303D\u5206\u5272\u5c42\u3002\u5b83\u7ed3\u5408\u7a00\u758f\u5173\u952e\u5e27\u7684 FastSAM/CLIP \u4e0e\u9ad8\u9891 DINOv3 \u7279\u5f81\u4f20\u64ad\uff0c\u5b9e\u73b0\u53ef\u7528\u81ea\u7136\u8bed\u8a00\u68c0\u7d22\u7684\u673a\u5668\u4eba\u573a\u666f\u5730\u56fe\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31005", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u7a00\u758f\u5173\u952e\u5e27\u8ba1\u7b97 FastSAM \u63a9\u7801\u548c CLIP \u7279\u5f81\uff0c\u4e2d\u95f4\u5e27\u7528\u5bc6\u96c6 DINOv3 \u7279\u5f81\u9ad8\u901f\u4f20\u64ad\u63a9\u7801\uff0c\u51cf\u5c11\u9010\u5e27\u5206\u5272\u4e0eVL\u63a8\u7406\u5f00\u9500", "\u5c06\u8ddf\u8e2a\u5230\u76842D\u63a9\u7801\u878d\u5408\u8fdb\u7c7b\u522b\u65e0\u5173\u76843D\u5206\u5272\u5c42\uff0c\u5e76\u901a\u8fc73D\u5173\u8054\u5904\u7406\u8ddf\u8e2a\u4e2d\u65ad\u548c\u957f\u671f\u91cd\u8bbf", "\u5728 Replica\u3001ScanNet++\u3001HM3D \u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u5f00\u653e\u8bcd\u6c47\u5206\u5272\u4e0e\u68c0\u7d22\u6548\u679c\uff1b\u76f8\u6bd4 ViT-H OVI-MAP \u5feb1.7\u500d\u3001\u663e\u5b58\u5c113.3\u500d\uff0c\u5e76\u5728\u56db\u8db3\u673a\u5668\u4eba\u4e0a\u5b9e\u73b07.5Hz\u5728\u7ebf\u6784\u56fe\u4e0e\u641c\u7d22"], "keywords": ["\u5f00\u653e\u8bcd\u6c47", "3D\u573a\u666f\u56fe", "\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31005v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TRACKGRAPH: Online Open-Vocabulary 3D Scene Graphs via Image-Space Tracking", "tldr": "\u7528\u56fe\u50cf\u8ddf\u8e2a\u9ad8\u6548\u6784\u5efa\u5f00\u653e\u8bcd\u6c473D\u573a\u666f\u56fe", "upvotes": 0, "what_it_is": "TRACKGRAPH \u662f\u4e00\u4e2a\u5728\u7ebf\u5f00\u653e\u8bcd\u6c473D\u573a\u666f\u56fe\u7cfb\u7edf\uff0c\u5148\u5728\u56fe\u50cf\u6d41\u4e2d\u7ef4\u62a4\u77ed\u671f2D\u63a9\u7801\u8eab\u4efd\uff0c\u518d\u878d\u5408\u52303D\u5206\u5272\u5c42\u3002\u5b83\u7ed3\u5408\u7a00\u758f\u5173\u952e\u5e27\u7684 FastSAM/CLIP \u4e0e\u9ad8\u9891 DINOv3 \u7279\u5f81\u4f20\u64ad\uff0c\u5b9e\u73b0\u53ef\u7528\u81ea\u7136\u8bed\u8a00\u68c0\u7d22\u7684\u673a\u5668\u4eba\u573a\u666f\u5730\u56fe\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u5f00\u653e\u8bcd\u6c473D\u5efa\u56fe\u7684\u4e3b\u8981\u8ba1\u7b97\u538b\u529b\u4ece\u9891\u7e41\u89c6\u89c9\u8bed\u8a00\u63a8\u7406\u8f6c\u5411\u8f7b\u91cf\u7684\u56fe\u50cf\u7a7a\u95f4\u8ddf\u8e2a\uff0c\u5728\u4fdd\u6301\u68c0\u7d22\u80fd\u529b\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u901f\u5ea6\u548c\u663e\u5b58\u6548\u7387\uff0c\u66f4\u9002\u5408\u771f\u5b9e\u673a\u5668\u4eba\u5728\u7ebf\u90e8\u7f72\u3002"}, {"abstract": "Vision-Language Models (VLMs) exhibit remarkable zero-shot generalization, yet they often encode unwanted or hazardous stylistic domains such as idealized textbook diagrams in medical AI or cartoon vehicles in autonomous driving. Approximate Domain Unlearning (ADU) aims to selectively erase a model\u0027s recognition of a target visual domain while preserving accuracy on the remaining domains. However, existing ADU methods operate under a flawed closed-vocabulary assumption: they evaluate unlearning solely on the specific object classes seen during the unlearning fine-tuning phase. Consequently, these methods do not unlearn the domain itself; they merely overfit to seen class-domain pairs, leaving the domain easily recognizable for unseen classes and providing a false sense of removal. We argue that true domain erasure must be class-agnostic. To address this, we formalize Open-Vocabulary Domain Unlearning (OVDU), a rigorous protocol that mandates domain forgetting must transfer to held-out classes. To solve the OVDU challenge, we propose a surgical parameter-editing framework. First, a Fisher Information mask isolates domain-sensitive weights, mathematically protecting foundational zero-shot generalization. Second, our Targeted Manifold Scattering (TMS) objective uses preference-based mining to locally scatter the forget domain\u0027s stylistic geometry. Evaluated across PACS, OfficeHome, and DomainNet, our method vastly improves open-vocabulary generalization over existing baselines. Crucially, it delivers exceptional sample efficiency, outperforming peak 8-shot baseline results with only 4 shots.", "arxiv_id": "2609.31356", "arxiv_url": "https://arxiv.org/abs/2609.31356", "authors": ["Sumanth Udupa", "Mehrtash Harandi", "Yadan Luo", "Mahsa Baktashmotlagh"], "brief": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u8fd1\u4f3c\u57df\u9057\u5fd8\u53ea\u5728\u5fae\u8c03\u89c1\u8fc7\u7684\u7c7b\u522b\u4e0a\u8bc4\u4f30\uff0c\u5bb9\u6613\u628a\u201c\u9057\u5fd8\u57df\u201d\u9000\u5316\u4e3a\u8bb0\u4f4f\u7279\u5b9a\u7c7b\u522b-\u57df\u7ec4\u5408\u3002\u4f5c\u8005\u5f62\u5f0f\u5316 Open-Vocabulary Domain Unlearning\uff0c\u8981\u6c42\u5bf9\u672a\u89c1\u7c7b\u522b\u4e5f\u80fd\u9057\u5fd8\u76ee\u6807\u89c6\u89c9\u98ce\u683c\u57df\uff0c\u5e76\u63d0\u51fa\u53c2\u6570\u7f16\u8f91\u6846\u67b6\u5b9e\u73b0\u8fd9\u4e00\u76ee\u6807\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31356", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528 Fisher Information \u63a9\u7801\u5b9a\u4f4d\u57df\u654f\u611f\u6743\u91cd\uff0c\u540c\u65f6\u4fdd\u62a4 VLM \u7684\u57fa\u7840\u96f6\u6837\u672c\u6cdb\u5316\u80fd\u529b\u3002", "\u63d0\u51fa Targeted Manifold Scattering \u76ee\u6807\uff0c\u901a\u8fc7\u504f\u597d\u5f0f\u6837\u672c\u6316\u6398\u5c40\u90e8\u6253\u6563\u5f85\u9057\u5fd8\u57df\u7684\u98ce\u683c\u6d41\u5f62\u7ed3\u6784\u3002", "\u5728 PACS\u3001OfficeHome\u3001DomainNet \u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709 ADU \u57fa\u7ebf\uff0c\u4e14\u4ec5\u7528 4-shot \u5373\u8d85\u8fc7\u57fa\u7ebf 8-shot \u6700\u4f18\u7ed3\u679c\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u9057\u5fd8", "\u5f00\u653e\u8bcd\u6c47", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31356v1", "published_at": "2026-09-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Open Vocabulary Domain Unlearning", "tldr": "\u63d0\u51fa\u5f00\u653e\u8bcd\u6c47\u57df\u9057\u5fd8\uff0c\u907f\u514d\u53ea\u5fd8\u7c7b\u522b\u5bf9\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u8fd1\u4f3c\u57df\u9057\u5fd8\u53ea\u5728\u5fae\u8c03\u89c1\u8fc7\u7684\u7c7b\u522b\u4e0a\u8bc4\u4f30\uff0c\u5bb9\u6613\u628a\u201c\u9057\u5fd8\u57df\u201d\u9000\u5316\u4e3a\u8bb0\u4f4f\u7279\u5b9a\u7c7b\u522b-\u57df\u7ec4\u5408\u3002\u4f5c\u8005\u5f62\u5f0f\u5316 Open-Vocabulary Domain Unlearning\uff0c\u8981\u6c42\u5bf9\u672a\u89c1\u7c7b\u522b\u4e5f\u80fd\u9057\u5fd8\u76ee\u6807\u89c6\u89c9\u98ce\u683c\u57df\uff0c\u5e76\u63d0\u51fa\u53c2\u6570\u7f16\u8f91\u6846\u67b6\u5b9e\u73b0\u8fd9\u4e00\u76ee\u6807\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u57df\u9057\u5fd8\u8bc4\u4f30\u4e2d\u7684\u95ed\u96c6\u8bcd\u6c47\u6f0f\u6d1e\uff0c\u5e76\u7ed9\u51fa\u66f4\u4e25\u683c\u7684\u5f00\u653e\u8bcd\u6c47\u534f\u8bae\uff1b\u5bf9\u533b\u7597\u3001\u81ea\u52a8\u9a7e\u9a76\u7b49\u9700\u8981\u79fb\u9664\u5371\u9669\u98ce\u683c\u504f\u7f6e\u7684 VLM \u5b89\u5168\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We investigate whether natural-language documentation helps coding agents resolve software issues, and we build the tools to construct and evaluate it. We introduce a roundtrip benchmark that scores code descriptions by whether code regenerated from them passes the original tests, and show that completeness, not length, drives a description\u0027s fidelity. Using the benchmark as an optimization signal, we discover a description-writing prompt that reaches full fidelity and generalizes to unseen files. We then test the hypothesis that motivated the work: that better documentation helps an agent resolve real repository issues. Across two model families and ten repositories, and against a positive control confirming that our evaluation can detect a genuine improvement, we find that it does not. When the source is present, neither static compact documentation nor retrieved context beats the issue alone. We report this negative result together with the benchmark and the optimizer, and we characterize the boundary at which documentation helps.", "arxiv_id": "2609.31587", "arxiv_url": "https://arxiv.org/abs/2609.31587", "authors": ["Md Shohel Arman", "Igor Molybog"], "brief": "\u8bba\u6587\u7814\u7a76\u81ea\u7136\u8bed\u8a00\u6587\u6863\u662f\u5426\u80fd\u5e2e\u52a9 coding agents \u4fee\u590d\u8f6f\u4ef6\u95ee\u9898\uff0c\u5e76\u63d0\u51fa\u4e00\u4e2a\u201c\u5f80\u8fd4\u201d\u57fa\u51c6\uff1a\u7528\u4ee3\u7801\u63cf\u8ff0\u91cd\u751f\u6210\u4ee3\u7801\uff0c\u518d\u770b\u662f\u5426\u901a\u8fc7\u539f\u6d4b\u8bd5\u3002\u4f5c\u8005\u8fd8\u7528\u8be5\u57fa\u51c6\u4f18\u5316\u6587\u6863\u751f\u6210\u63d0\u793a\u8bcd\uff0c\u5f97\u5230\u9ad8\u4fdd\u771f\u3001\u53ef\u6cdb\u5316\u7684\u4ee3\u7801\u63cf\u8ff0\u65b9\u6cd5\u3002", "categories": ["cs.SE", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31587", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa roundtrip benchmark\uff0c\u4ee5\u201c\u7531\u63cf\u8ff0\u91cd\u751f\u6210\u7684\u4ee3\u7801\u80fd\u5426\u901a\u8fc7\u539f\u6d4b\u8bd5\u201d\u8861\u91cf\u6587\u6863\u4fdd\u771f\u5ea6\u3002", "\u53d1\u73b0\u63cf\u8ff0\u7684\u5b8c\u6574\u6027\u6bd4\u957f\u5ea6\u66f4\u5173\u952e\uff0c\u5e76\u901a\u8fc7\u57fa\u51c6\u4f18\u5316\u51fa\u53ef\u8fbe\u5230\u5b8c\u6574\u4fdd\u771f\u4e14\u80fd\u6cdb\u5316\u5230\u672a\u89c1\u6587\u4ef6\u7684\u5199\u4f5c\u63d0\u793a\u3002", "\u5728\u4e24\u4e2a\u6a21\u578b\u5bb6\u65cf\u3001\u5341\u4e2a\u4ed3\u5e93\u4e0a\u7684\u771f\u5b9e issue \u4fee\u590d\u5b9e\u9a8c\u4e2d\uff0c\u9759\u6001\u7d27\u51d1\u6587\u6863\u6216\u68c0\u7d22\u4e0a\u4e0b\u6587\u5747\u672a\u663e\u8457\u4f18\u4e8e\u4ec5\u7ed9 issue\u3002"], "keywords": ["\u4ee3\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31587v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Compact Documentation for Coding Agents: A Benchmark, an Optimizer, and Why It Does Not Transfer", "tldr": "\u7d27\u51d1\u6587\u6863\u672a\u5fc5\u63d0\u5347\u4ee3\u7801\u667a\u80fd\u4f53\u4fee\u590d\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u81ea\u7136\u8bed\u8a00\u6587\u6863\u662f\u5426\u80fd\u5e2e\u52a9 coding agents \u4fee\u590d\u8f6f\u4ef6\u95ee\u9898\uff0c\u5e76\u63d0\u51fa\u4e00\u4e2a\u201c\u5f80\u8fd4\u201d\u57fa\u51c6\uff1a\u7528\u4ee3\u7801\u63cf\u8ff0\u91cd\u751f\u6210\u4ee3\u7801\uff0c\u518d\u770b\u662f\u5426\u901a\u8fc7\u539f\u6d4b\u8bd5\u3002\u4f5c\u8005\u8fd8\u7528\u8be5\u57fa\u51c6\u4f18\u5316\u6587\u6863\u751f\u6210\u63d0\u793a\u8bcd\uff0c\u5f97\u5230\u9ad8\u4fdd\u771f\u3001\u53ef\u6cdb\u5316\u7684\u4ee3\u7801\u63cf\u8ff0\u65b9\u6cd5\u3002", "why_notable": "\u8fd9\u662f\u4e00\u9879\u91cd\u8981\u7684\u8d1f\u9762\u7ed3\u679c\u7814\u7a76\uff1a\u5c3d\u7ba1\u66f4\u597d\u7684\u6587\u6863\u80fd\u5fe0\u5b9e\u8868\u8fbe\u4ee3\u7801\uff0c\u5374\u4e0d\u4e00\u5b9a\u63d0\u5347\u771f\u5b9e\u4ed3\u5e93\u7ea7\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u4fee\u590d\u8868\u73b0\uff0c\u63d0\u9192\u7814\u7a76\u8005\u91cd\u65b0\u5ba1\u89c6\u201c\u538b\u7f29\u6587\u6863\u4f5c\u4e3a\u4e0a\u4e0b\u6587\u589e\u5f3a\u201d\u7684\u6709\u6548\u8fb9\u754c\u3002"}, {"abstract": "\"System One\" decision models such as TypeSafe\u0027s Jev and its open counterpart Laya answer typed questions about a text in a single forward pass with calibrated probabilities, but they cannot ask for missing information: when a first message does not say what separates two departments, they guess. We present LAVOIR (Laya with Value-Of-Information Routing), which places the candidate pieces of missing information (slots) in the input next to the answer options, so that one forward pass returns both the decision distribution and, for every slot, the expected gain in the probability of the correct decision if the user were asked about it. VOI targets need no human labels: gold decisions come from schema rules, an LLM only verbalizes messages and answers, a model from another family checks every text, and pairing each message with several profiles makes regression on realized gains estimate the expected gain. A Gini-impurity cap bounds the predicted value by what a calibrated model can still gain. In a controlled study, decisions on seen schemas are statistically indistinguishable from the Bayes ceiling. The final model\u0027s question policy matches a greedy oracle VOI policy on seen schemas (AUC 0.799 vs. 0.797), and with at most 0.5 questions per conversation it is 14.1 points more accurate than never asking. On real ABCD conversations, one real exchange raises accuracy by 8.3 points where LAVOIR asks and leaves it unchanged where it does not; on SGD the cap lowers the asking rate from 93% to 8.6%. On Laya\u0027s twelve benchmarks LAVOIR is above Laya\u0027s reported scores on seven, and it answers a question in 31 ms (median, GH200).", "arxiv_id": "2609.30706", "arxiv_url": "https://arxiv.org/abs/2609.30706", "authors": ["Furkan Yilmaz", "Habibe Aleyna Tasdemir", "Muhammed Faruk Gozay"], "brief": "\u8bba\u6587\u63d0\u51fa LAVOIR\uff0c\u5728 Laya/Jev \u8fd9\u7c7b\u5355\u6b21\u524d\u5411\u51b3\u7b56\u6a21\u578b\u4e2d\u52a0\u5165\u201c\u4fe1\u606f\u4ef7\u503c\u201d\u8def\u7531\uff1a\u628a\u5019\u9009\u7f3a\u5931\u4fe1\u606f\u69fd\u4f4d\u4e0e\u7b54\u6848\u9009\u9879\u4e00\u8d77\u8f93\u5165\uff0c\u6a21\u578b\u4e00\u6b21\u524d\u5411\u5373\u53ef\u8f93\u51fa\u51b3\u7b56\u6982\u7387\u548c\u6bcf\u4e2a\u69fd\u4f4d\u7684\u9884\u671f\u589e\u76ca\uff0c\u4ece\u800c\u51b3\u5b9a\u4f55\u65f6\u5411\u7528\u6237\u8ffd\u95ee\u3001\u8ffd\u95ee\u4ec0\u4e48\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30706", "impact_score": 7, "is_agent": false, "is_top": tr
