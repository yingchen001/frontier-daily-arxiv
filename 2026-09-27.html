5206\u5b50\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u63a8\u7406\u5f15\u5bfc", "\u836f\u7269\u8bbe\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31222v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Budgeted Quotient-Residual Guidance for Frozen Pocket-Conditioned Molecular Diffusion", "tldr": "\u65e0\u9700\u91cd\u8bad\u8ba9\u5206\u5b50\u6269\u6563\u611f\u77e5\u8ddd\u79bb/\u63a5\u89e6\u7b49\u76ee\u6807", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u9884\u7b97\u5316\u5546-\u6b8b\u5dee\u5f15\u5bfc\uff08QRG\uff09\uff0c\u4e00\u79cd\u7528\u4e8e\u51bb\u7ed3\u53e3\u888b\u6761\u4ef6\u5206\u5b50\u6269\u6563\u6a21\u578b\u7684\u63a8\u7406\u671f\u6821\u6b63\u65b9\u6cd5\u3002\u5b83\u5c06\u8ddd\u79bb\u3001\u63a5\u89e6\u3001\u951a\u5b9a\u5b50\u7ed3\u6784\u7b49\u5546\u7a7a\u95f4\u76ee\u6807\u63d0\u5347\u4e3a\u73af\u5883\u5750\u6807\u4e2d\u7684\u53ef\u6267\u884c\u65b9\u5411\uff0c\u5e76\u7528\u91c7\u6837\u5668\u81ea\u8eab\u6b65\u957f\u4f5c\u4e3a\u4fe1\u4efb\u9884\u7b97\u63a7\u5236\u66f4\u65b0\u5e45\u5ea6\u3002", "why_notable": "QRG \u5728\u4e0d\u91cd\u8bad\u751f\u6210\u5668\u3001\u4e0d\u6539\u52a8\u9aa8\u5e72\u7f51\u7edc\u7684\u60c5\u51b5\u4e0b\uff0c\u628a\u4f20\u7edf\u5c40\u90e8\u68af\u5ea6\u96be\u4ee5\u6fc0\u6d3b\u7684\u5546\u7279\u5f81\u76ee\u6807\u6709\u6548\u6ce8\u5165\u5206\u5b50\u6269\u6563\u91c7\u6837\uff0c\u5e76\u4fdd\u7559\u65b0\u9896\u6027\u4e0e\u591a\u6837\u6027\uff0c\u5177\u6709\u76f4\u63a5\u7684\u836f\u7269\u5206\u5b50\u4f18\u5316\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Estimating the influence of training examples on model behavior is essential for data debugging, valuation, and attribution. Existing influence estimators often produce incompatible rankings, which are commonly ascribed to approximation error. We argue that a more fundamental source of disagreement is specification mismatch: influence depends on the behavior being attributed, the intervention applied to each training example, and the counterfactual training process that maps the intervention to a model response. These choices are especially important when the target behavior requires a tractable surrogate, such as query loss, a logit, or a margin. We formalize influence as a counterfactual estimand, distinguish specification mismatch across estimands from approximation error in estimating a fixed estimand, and organize representative estimators by their implied specifications. We further derive a local decomposition that exposes how behavior signals, training signals, and counterfactual parameter responses interact. Controlled experiments show that exact estimands under different specifications can induce different rankings, whereas approximation error grows as perturbations move farther from their linearization points. Experiments on noisy label detection and LLM attribution show that specification choices significantly affect attribution quality, especially for the choice of behavior surrogate. Behavior-aligned specifications can identify target-specific training examples obscured by default loss-based or similarity-based specifications. These results establish specification analysis as a necessary first step for interpreting and comparing data influence estimators.", "arxiv_id": "2609.31214", "arxiv_url": "https://arxiv.org/abs/2609.31214", "authors": ["Zhe Li", "Wei Zhao", "Peixin Zhang", "Jun Sun"], "brief": "\u8bba\u6587\u5c06\u8bad\u7ec3\u6837\u672c\u5f71\u54cd\u529b\u5f62\u5f0f\u5316\u4e3a\u53cd\u4e8b\u5b9e\u4f30\u8ba1\u91cf\uff0c\u6307\u51fa\u4e0d\u540c\u5f71\u54cd\u529b\u65b9\u6cd5\u7684\u5206\u6b67\u4e0d\u53ea\u662f\u8fd1\u4f3c\u8bef\u5dee\uff0c\u66f4\u6765\u81ea\u76ee\u6807\u884c\u4e3a\u3001\u6837\u672c\u5e72\u9884\u548c\u53cd\u4e8b\u5b9e\u8bad\u7ec3\u8fc7\u7a0b\u7684\u89c4\u683c\u9009\u62e9\u4e0d\u4e00\u81f4\u3002\u4f5c\u8005\u7cfb\u7edf\u6574\u7406\u4ee3\u8868\u6027\u4f30\u8ba1\u5668\u7684\u9690\u542b\u89c4\u683c\uff0c\u5e76\u5206\u6790\u8fd9\u4e9b\u89c4\u683c\u5982\u4f55\u5f71\u54cd\u5f52\u56e0\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31214", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u533a\u5206\u201c\u4f30\u8ba1\u540c\u4e00\u76ee\u6807\u7684\u8fd1\u4f3c\u8bef\u5dee\u201d\u548c\u201c\u76ee\u6807\u4f30\u8ba1\u91cf\u672c\u8eab\u4e0d\u540c\u7684\u89c4\u683c\u4e0d\u5339\u914d\u201d\uff0c\u4e3a\u6bd4\u8f83\u6570\u636e\u5f71\u54cd\u65b9\u6cd5\u63d0\u4f9b\u7edf\u4e00\u6846\u67b6\u3002", "\u63a8\u5bfc\u5c40\u90e8\u5206\u89e3\uff0c\u63ed\u793a\u884c\u4e3a\u4fe1\u53f7\u3001\u8bad\u7ec3\u4fe1\u53f7\u4e0e\u53cd\u4e8b\u5b9e\u53c2\u6570\u54cd\u5e94\u5982\u4f55\u5171\u540c\u51b3\u5b9a\u6837\u672c\u5f71\u54cd\u6392\u540d\u3002", "\u5728\u566a\u58f0\u6807\u7b7e\u68c0\u6d4b\u548c LLM \u5f52\u56e0\u5b9e\u9a8c\u4e2d\u53d1\u73b0\uff0c\u884c\u4e3a\u4ee3\u7406\u76ee\u6807\uff08\u5982\u67e5\u8be2\u635f\u5931\u3001logit\u3001margin\uff09\u7684\u9009\u62e9\u4f1a\u663e\u8457\u5f71\u54cd\u5f52\u56e0\u8d28\u91cf\u3002"], "keywords": ["\u6570\u636e\u5f52\u56e0", "\u5f71\u54cd\u51fd\u6570", "\u53cd\u4e8b\u5b9e\u63a8\u65ad", "\u6a21\u578b\u89e3\u91ca"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31214v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Which Influence Are We Estimating? The Role of Counterfactual Specifications in Data Attribution", "tldr": "\u6570\u636e\u5f71\u54cd\u4f30\u8ba1\u5dee\u5f02\u6e90\u4e8e\u53cd\u4e8b\u5b9e\u89c4\u683c\u4e0d\u5339\u914d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u8bad\u7ec3\u6837\u672c\u5f71\u54cd\u529b\u5f62\u5f0f\u5316\u4e3a\u53cd\u4e8b\u5b9e\u4f30\u8ba1\u91cf\uff0c\u6307\u51fa\u4e0d\u540c\u5f71\u54cd\u529b\u65b9\u6cd5\u7684\u5206\u6b67\u4e0d\u53ea\u662f\u8fd1\u4f3c\u8bef\u5dee\uff0c\u66f4\u6765\u81ea\u76ee\u6807\u884c\u4e3a\u3001\u6837\u672c\u5e72\u9884\u548c\u53cd\u4e8b\u5b9e\u8bad\u7ec3\u8fc7\u7a0b\u7684\u89c4\u683c\u9009\u62e9\u4e0d\u4e00\u81f4\u3002\u4f5c\u8005\u7cfb\u7edf\u6574\u7406\u4ee3\u8868\u6027\u4f30\u8ba1\u5668\u7684\u9690\u542b\u89c4\u683c\uff0c\u5e76\u5206\u6790\u8fd9\u4e9b\u89c4\u683c\u5982\u4f55\u5f71\u54cd\u5f52\u56e0\u7ed3\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u9192\u7814\u7a76\u8005\u5728\u4f7f\u7528\u5f71\u54cd\u51fd\u6570\u3001\u76f8\u4f3c\u5ea6\u6216\u635f\u5931\u5f52\u56e0\u524d\uff0c\u5fc5\u987b\u5148\u660e\u786e\u8981\u5f52\u56e0\u7684\u884c\u4e3a\u548c\u53cd\u4e8b\u5b9e\u8bbe\u5b9a\uff1b\u8fd9\u5bf9\u6570\u636e\u8c03\u8bd5\u3001\u6570\u636e\u4f30\u503c\u3001LLM \u8bad\u7ec3\u6570\u636e\u5f52\u56e0\u7b49\u4efb\u52a1\u5177\u6709\u76f4\u63a5\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002"}, {"abstract": "Vision-language models (VLMs), despite their success in optical character recognition (OCR) tasks, are vulnerable to typographic attacks and have a fragile structure for images with multiple text layers. In this study, the DecoyBench dataset was created using the Decoy Font method. The dataset consists of 300 images, each containing text with sharp contour lines superimposed on another text with soft shading. Six recent closed-source models from three different model families were evaluated using this dataset under two different prompting conditions (naive and guided) and at two different resolutions ($512\\times512$ and $64\\times64$). A validation study showed that human participants could read both text layers with high accuracy. In contrast, the models, with most variants and both prompting methods, read the contour text with near-human accuracy at high resolution, but almost never fully extracted the shading text. At low resolution, the contour text could not be read by either the models or humans, while the shading text could be extracted with high accuracy. The findings indicate that the evaluated VLMs exhibit a consistent behavioral limitation when processing typographic structures containing multiple spatial frequency layers.", "arxiv_id": "2609.31403", "arxiv_url": "https://arxiv.org/abs/2609.31403", "authors": ["Mert \u0130ncidelen", "Yamen Kashkash", "Asya Berker", "Murat Aydo\u011fan"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 DecoyBench\uff0c\u7528 Decoy Font \u751f\u6210300\u5f20\u5305\u542b\u6e05\u6670\u8f6e\u5ed3\u6587\u5b57\u4e0e\u67d4\u548c\u9634\u5f71\u6587\u5b57\u53e0\u52a0\u7684\u56fe\u50cf\uff0c\u6d4b\u8bd5\u8fd1\u671f\u95ed\u6e90 VLM \u7684\u53cc\u5c42\u6587\u5b57\u8bfb\u53d6\u80fd\u529b\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u4eba\u7c7b\u80fd\u540c\u65f6\u8bfb\u51fa\u4e24\u5c42\u6587\u5b57\uff0c\u800c\u591a\u6570 VLM \u5728\u9ad8\u5206\u8fa8\u7387\u4e0b\u51e0\u4e4e\u53ea\u8bfb\u8f6e\u5ed3\u6587\u5b57\uff0c\u5728\u4f4e\u5206\u8fa8\u7387\u4e0b\u624d\u8f6c\u5411\u8bfb\u53d6\u9634\u5f71\u6587\u5b57\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31403", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u8bc4\u6d4b\u8986\u76d66\u4e2a\u8fd1\u671f\u95ed\u6e90\u6a21\u578b\u30013\u4e2a\u6a21\u578b\u5bb6\u65cf\uff0c\u5e76\u6bd4\u8f83\u6734\u7d20\u63d0\u793a\u4e0e\u5f15\u5bfc\u63d0\u793a\u3001512\u00d7512\u4e0e64\u00d764\u4e24\u79cd\u5206\u8fa8\u7387\u3002", "\u9ad8\u5206\u8fa8\u7387\u4e0b\uff0c\u6a21\u578b\u63a5\u8fd1\u4eba\u7c7b\u6c34\u5e73\u8bfb\u53d6\u8f6e\u5ed3\u6587\u5b57\uff0c\u4f46\u51e0\u4e4e\u65e0\u6cd5\u5b8c\u6574\u63d0\u53d6\u9634\u5f71\u6587\u5b57\u3002", "\u4f4e\u5206\u8fa8\u7387\u4e0b\uff0c\u8f6e\u5ed3\u6587\u5b57\u5bf9\u6a21\u578b\u548c\u4eba\u7c7b\u90fd\u4e0d\u53ef\u8bfb\uff0c\u800c\u9634\u5f71\u6587\u5b57\u53ef\u88ab\u9ad8\u51c6\u786e\u7387\u63d0\u53d6\uff0c\u66b4\u9732\u51faVLM\u5bf9\u7a7a\u95f4\u9891\u7387\u5c42\u7684\u504f\u7f6e\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "OCR", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31403v1", "published_at": "2026-09-25", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Sorry Robot, Happy Human: Vision-Language Models Read Only One of Two Legible Typographic Layers", "tldr": "VLM\u53ea\u80fd\u8bfb\u53cc\u5c42\u6587\u5b57\u4e2d\u7684\u4e00\u5c42", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 DecoyBench\uff0c\u7528 Decoy Font \u751f\u6210300\u5f20\u5305\u542b\u6e05\u6670\u8f6e\u5ed3\u6587\u5b57\u4e0e\u67d4\u548c\u9634\u5f71\u6587\u5b57\u53e0\u52a0\u7684\u56fe\u50cf\uff0c\u6d4b\u8bd5\u8fd1\u671f\u95ed\u6e90 VLM \u7684\u53cc\u5c42\u6587\u5b57\u8bfb\u53d6\u80fd\u529b\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u4eba\u7c7b\u80fd\u540c\u65f6\u8bfb\u51fa\u4e24\u5c42\u6587\u5b57\uff0c\u800c\u591a\u6570 VLM \u5728\u9ad8\u5206\u8fa8\u7387\u4e0b\u51e0\u4e4e\u53ea\u8bfb\u8f6e\u5ed3\u6587\u5b57\uff0c\u5728\u4f4e\u5206\u8fa8\u7387\u4e0b\u624d\u8f6c\u5411\u8bfb\u53d6\u9634\u5f71\u6587\u5b57\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86VLM\u5728\u591a\u5c42\u6392\u7248\u4e0eOCR\u573a\u666f\u4e2d\u7684\u7cfb\u7edf\u6027\u8106\u5f31\u6027\uff1a\u6a21\u578b\u5e76\u975e\u50cf\u4eba\u7c7b\u4e00\u6837\u6574\u5408\u591a\u79cd\u89c6\u89c9\u7ebf\u7d22\uff0c\u800c\u53ef\u80fd\u53ea\u4f9d\u8d56\u7279\u5b9a\u7a7a\u95f4\u9891\u7387\u5c42\u3002\u8fd9\u5bf9\u89c6\u89c9\u5b89\u5168\u3001\u63d0\u793a\u653b\u51fb\u3001\u6587\u6863\u7406\u89e3\u548c\u9c81\u68d2OCR\u8bc4\u6d4b\u90fd\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Large language models (LLMs) have demonstrated promising performance in log anomaly detection, yet how their adaptation strategies, architectures, and deployment configurations affect detection effectiveness remains insufficiently understood. To investigate these factors, we conduct a systematic empirical analysis across three public log datasets, examining different adaptation strategies, model architectures, parameter scales, and quantization settings. Our results reveal substantial performance differences across adaptation strategies, while model scaling yields varying detection gains across datasets. We further observe that models with comparable detection accuracy can exhibit markedly different computational costs, and that low-bit quantization largely preserves detection performance in the evaluated configurations. Finally, we examine detection robustness under structural, semantic, and label noise at different perturbation levels. These findings provide empirical insights into the performance, efficiency, and robustness of LLM-based log anomaly detection, highlighting practical considerations beyond conventional accuracy-oriented evaluation.", "arxiv_id": "2609.31371", "arxiv_url": "https://arxiv.org/abs/2609.31371", "authors": ["Bin Li", "Dongdong Wang", "Siyang Lu"], "brief": "\u672c\u6587\u9488\u5bf9LLM\u7528\u4e8e\u65e5\u5fd7\u5f02\u5e38\u68c0\u6d4b\u5f00\u5c55\u7cfb\u7edf\u5b9e\u8bc1\u7814\u7a76\uff0c\u6bd4\u8f83\u4e0d\u540c\u9002\u914d\u7b56\u7565\u3001\u6a21\u578b\u67b6\u6784\u3001\u53c2\u6570\u89c4\u6a21\u4e0e\u91cf\u5316\u914d\u7f6e\u5728\u4e09\u4e2a\u516c\u5f00\u65e5\u5fd7\u6570\u636e\u96c6\u4e0a\u7684\u8868\u73b0\u3002\u7814\u7a76\u8fd8\u5206\u6790\u4e86\u7ed3\u6784\u3001\u8bed\u4e49\u548c\u6807\u7b7e\u566a\u58f0\u4e0b\u7684\u68c0\u6d4b\u9c81\u68d2\u6027\u3002", "categories": ["cs.LG", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31371", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u540cLLM\u9002\u914d\u7b56\u7565\u5e26\u6765\u663e\u8457\u6027\u80fd\u5dee\u5f02\uff0c\u6a21\u578b\u89c4\u6a21\u6269\u5927\u5728\u4e0d\u540c\u6570\u636e\u96c6\u4e0a\u7684\u6536\u76ca\u5e76\u4e0d\u4e00\u81f4", "\u68c0\u6d4b\u51c6\u786e\u7387\u76f8\u8fd1\u7684\u6a21\u578b\u53ef\u80fd\u8ba1\u7b97\u6210\u672c\u5dee\u5f02\u5f88\u5927\uff0c\u8bf4\u660e\u4ec5\u770b\u51c6\u an entire model class as a finite set of grammatical rules, from which candidate models are assembled as trees. Existing TAG-based identifiers rely on evolutionary optimisation and return point estimates of the model structure. This paper instead proposes the TAG framework within a Bayesian setting. A generative prior is defined over tree structures and their parameters, and a Reversible-Jump MCMC sampler with structure-preserving tree moves is used to infer the joint posterior over model structure, parameters and predictions. Two training objectives are considered; that is, a one-step-ahead objective with conjugate parameter proposals, and a simulation-based objective handled by likelihood-free inference. The approach is validated on a simulated polynomial NARX system, the Silverbox benchmark, and wave-loading data from the Christchurch Bay Tower, where embedding Morison\u0027s equation as a fixed initial tree yields a grey-box model that outperforms the physics-driven baseline. The results demonstrate that Bayesian TAGs are well suited to quantifying uncertainty in equation discovery for dynamical systems and to fitting physics-informed models.", "arxiv_id": "2609.31368", "arxiv_url": "https://arxiv.org/abs/2609.31368", "authors": ["Christopher A. Lindley", "Nikolaos Dervilis", "Keith Worden"], "brief": "\u8bba\u6587\u5c06\u6811\u90bb\u63a5\u6587\u6cd5\uff08TAG\uff09\u65b9\u7a0b\u53d1\u73b0\u6846\u67b6\u6269\u5c55\u5230\u8d1d\u53f6\u65af\u8bbe\u5b9a\uff0c\u4e3a\u6a21\u578b\u6811\u7ed3\u6784\u548c\u53c2\u6570\u5b9a\u4e49\u751f\u6210\u5f0f\u5148\u9a8c\uff0c\u5e76\u7528\u53ef\u9006\u8df3MCMC\u63a8\u65ad\u7ed3\u6784\u3001\u53c2\u6570\u4e0e\u9884\u6d4b\u7684\u4e0d\u786e\u5b9a\u6027\u3002\u65b9\u6cd5\u652f\u6301\u4e00\u6b65\u9884\u6d4b\u76ee\u6807\u548c\u4eff\u771f\u76ee\u6807\uff0c\u5e76\u53ef\u5d4c\u5165\u7269\u7406\u65b9\u7a0b\u5f62\u6210\u7070\u76d2\u6a21\u578b\u3002", "categories": ["stat.ML", "cs.LG", "eess.SY", "stat.CO"], "github_repo": null, "github_stars": 0, 53ea\u7ed9\u51fa\u70b9\u4f30\u8ba1\uff0c\u8be5\u5de5\u4f5c\u80fd\u7cfb\u7edf\u91cf\u5316\u65b9\u7a0b\u53d1\u73b0\u4e2d\u7684\u7ed3\u6784\u4e0e\u53c2\u6570\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u628a\u6570\u636e\u9a71\u52a8\u641c\u7d22\u4e0e\u7269\u7406\u5148\u9a8c\u81ea\u7136\u7ed3\u5408\uff0c\u9002\u7528\u4e8e\u52a8\u529b\u7cfb\u7edf\u8fa8\u8bc6\u548c\u7269\u7406\u4fe1\u606f\u5efa\u6a21\u3002"}, {"abstract": "Tabular in-context learners such as TabPFN, Mitra, or ConTextTab rely on alternating row and column attention over 2D sequences of latent embeddings. These attention patterns differ markedly from the one-dimensional case in language models: row attention involves longer sequences while column attention operates on much shorter ones, and the strided memory layout of tabular data makes producing contiguous tensors costly. Moreover, the hidden dimensions used in current models are small compared to recent language models. Yet efficient attention has been studied mostly for one-dimensional sequences, leaving the two-dimensional tabular setting unexplored. To this end, we create a reproducible benchmarking setup and study the unique characteristics of tabular attention across several backends -- Torch SDPA (efficient and cuDNN), FlashAttention-2/3/4, and the inference-only backends vLLM and SageAttention -- measuring forward and backward throughput across realistic tabular shapes on three GPU generations (A100, H100, B200). We find that the optimal backend choice differs between column and row attention and varies across hardware as well as model specifics: While the FlashAttention implementations tailored for each GPU generation perform overall best, they are at times outperformed by CuDNN in the case of column attention at longer sequences with cross-over points depending on the head dimension. Among inference-only backends, SageAttention performs well for row attention and large sequences beyond 16\\,k rows. Our reproducible benchmark lays the foundation for future improvements to table-native attention. The self-contained benchmarking and evaluation code is openly available at: https://github.com/SAP-samples/tabular-attention-benchmark", "arxiv_id": "2609.31306", "arxiv_url": "https://arxiv.org/abs/2609.31306", "authors": ["Maximilian Schambach", "Clemens Biehl", "Sam Thelin"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u53ef\u590d\u73b0\u7684\u8868\u683c\u57fa\u7840\u6a21\u578b\u6ce8\u610f\u529b\u57fa\u51c6\uff0c\u9488\u5bf9 TabPFN\u3001Mitra\u3001ConTextTab \u7b49\u6a21\u578b\u4e2d\u7684\u884c/\u5217\u4ea4\u66ff\u6ce8\u610f\u529b\uff0c\u6bd4\u8f83\u591a\u79cd\u6ce8\u610f\u529b\u540e\u7aef\u5728\u4e0d\u540c GPU \u4e0a\u7684\u8bad\u7ec3\u4e0e\u63a8\u7406\u541e\u5410\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31306", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d6 Torch SDPA\u3001cuDNN\u3001FlashAttention-2/3/4\u3001vLLM\u3001SageAttention \u7b49\u540e\u7aef\uff0c\u5e76\u6d4b\u8bd5 A100\u3001H100\u3001B200 \u4e09\u4ee3 GPU\u3002", "\u53d1\u73b0\u8868\u683c\u884c\u6ce8\u610f\u529b\u4e0e\u5217\u6ce8\u610f\u529b\u7684\u6700\u4f18\u540e\u7aef\u4e0d\u540c\uff0c\u4e14\u53d7\u5e8f\u5217\u957f\u5ea6\u3001head dimension\u3001\u786c\u4ef6\u4ee3\u9645\u5f71\u54cd\u660e\u663e\u3002", "FlashAttention \u7cfb\u5217\u6574\u4f53\u8868\u73b0\u6700\u597d\uff0c\u4f46\u957f\u5e8f\u5217\u5217\u6ce8\u610f\u529b\u4e2d cuDNN \u6709\u65f6\u66f4\u4f18\uff1bSageAttention \u5728\u8d85\u8fc7 16k \u884c\u7684\u5927\u89c4\u6a21\u884c\u6ce8\u610f\u529b\u63a8\u7406\u4e2d\u8868\u73b0\u7a81\u51fa\u3002"], "keywords": ["\u8868\u683c\u5b66\u4e60", "\u57fa\u7840\u6a21\u578b", "\u9ad8\u6548\u6ce8\u610f\u529b", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31306v1", "published_at": "2026-09-25", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Benchmarking Attention for Tabular Foundation Models", "tldr": "\u7cfb\u7edf\u8bc4\u6d4b\u8868\u683c\u6a21\u578b\u4e8c\u7ef4\u6ce8\u610f\u529b\u540e\u7aef", "upvotes": 0, "what_it_is": "\u672c\u6587\u6784\u5efa\u4e86\u53ef\u590d\u73b0\u7684\u8868\u683c\u57fa\u7840\u6a21\u578b\u6ce8\u610f\u529b\u57fa\u51c6\uff0c\u9488\u5bf9 TabPFN\u3001Mitra\u3001ConTextTab \u7b49\u6a21\u578b\u4e2d\u7684\u884c/\u5217\u4ea4\u66ff\u6ce8\u610f\u529b\uff0c\u6bd4\u8f83\u591a\u79cd\u6ce8\u610f\u529b\u540e\u7aef\u5728\u4e0d\u540c GPU \u4e0a\u7684\u8bad\u7ec3\u4e0e\u63a8\u7406\u541e\u5410\u3002", "why_notable": "\u9ad8\u6548\u6ce8\u610f\u529b\u7814\u7a76\u957f\u671f\u504f\u5411\u8bed\u8a00\u6a21\u578b\u7684\u4e00\u7ef4\u5e8f\u5217\uff0c\u672c\u6587\u9996\u6b21\u7cfb\u7edf\u63ed\u793a\u8868\u683c\u4e8c\u7ef4\u6ce8\u610f\u529b\u7684\u6027\u80fd\u7279\u6027\uff0c\u5e76\u63d0\u4f9b\u5f00\u6e90\u57fa\u51c6\uff0c\u4e3a\u8868\u683c\u57fa\u7840\u6a21\u578b\u52a0\u901f\u548c\u4e13\u7528\u5185\u6838\u4f18\u5316\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "We study geometric moment contraction (GMC) of the constant-parameter stochastic Nesterov recursion \\[ Y_k=\u0398_k+\u03b2(\u0398_k-\u0398_{k-1}),\\qquad \u0398_{k+1}=Y_k-\u03b3G(Y_k,X_{k+1}). \\] Under mean strong monotonicity and stochastic $L^p$ Lipschitz continuity, an explicit Perron comparison proves synchronous $L^p$ contraction when $\u03b2\u03b3L_p\u003c(1-\u03b2)(1-q_{\u03b3,p})$. This direct criterion includes infinite-variance gradients for $1\u003cp\u003c2$, but its small-step regime requires $\u03b2\u003c\u03bc/(\u03bc+L_p)$. A complementary power-Lyapunov argument establishes a positive, generally much smaller, step-size interval for every fixed $\u03b2\u003c1$ and every $p\u003e1$, using only a finite $p$th gradient moment. At $p=2$, a simpler explicit certificate gives \\[ 0\u003c\u03b3\u003c\\frac{2\u03bc(1-\u03b2)^2}{L_2^2(1-\u03b2+2\u03b2^2)}. \\] Its quadratic high-momentum scaling is a limitation of the chosen metric, not a sharp stability boundary. We quantify this loss, provide a general mean-only quadratic $S$-procedure, and exploit endpoint Lyapunov inequalities under stronger samplewise sector information. Verified endpoint certificates can be orders of magnitude less conservative than the explicit metric.", "arxiv_id": "2609.31303", "arxiv_url": "https://arxiv.org/abs/2609.31303", "authors": ["Wei Biao Wu"], "brief": "\u672c\u6587\u7814\u7a76\u5e38\u53c2\u6570\u968f\u673a Nesterov \u9012\u63a8\u7684\u51e0\u4f55\u77e9\u6536\u7f29\u6027\u8d28\uff0c\u5728\u5747\u503c\u5f3a\u5355\u8c03\u4e0e\u968f\u673a Lp Lipschitz \u6761\u4ef6\u4e0b\uff0c\u7ed9\u51fa\u540c\u6b65 Lp \u6536\u7f29\u5224\u636e\u4e0e Lyapunov \u6b65\u957f\u8bc1\u4e66\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31303", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7 Perron \u6bd4\u8f83\u5f97\u5230\u663e\u5f0f\u6536\u7f29\u6761\u4ef6\uff0c\u53ef\u76f4\u63a5\u5224\u65ad\u968f\u673a Nesterov \u8fed\u4ee3\u7684 Lp \u7a33\u5b9a\u6027\u3002", "\u7ed3\u679c\u8986\u76d6 1\u003cp\u003c2 \u7684\u65e0\u9650\u65b9\u5dee\u68af\u5ea6\u60c5\u5f62\uff0c\u4f46\u663e\u5f0f\u5c0f\u6b65\u957f\u6761\u4ef6\u5728\u9ad8\u52a8\u91cf\u4e0b\u8f83\u4fdd\u5b88\u3002", "\u63d0\u51fa power-Lyapunov \u5206\u6790\uff0c\u5bf9\u4efb\u610f\u56fa\u5b9a \u03b2\u003c1\u3001p\u003e1 \u5efa\u7acb\u6b63\u6b65\u957f\u533a\u95f4\uff0c\u5e76\u5728 p=2 \u7ed9\u51fa\u66f4\u7b80\u5355\u7684\u663e\u5f0f\u8bc1\u4e66\u4e0e\u4fdd\u5b88\u6027\u91cf\u5316\u3002"], "keywords": ["\u968f\u673a\u4f18\u5316", "Nesterov\u52a0\u901f", "\u6536\u7f29\u5206\u6790", "Lyapunov\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31303v1", "published_at": "2026-09-25", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Geometric Moment Contraction for Stochastic Nesterov Acceleration", "tldr": "\u523b\u753b\u968f\u673aNesterov\u52a0\u901f\u7684Lp\u6536\u7f29\u6761\u4ef6", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5e38\u53c2\u6570\u968f\u673a Nesterov \u9012\u63a8\u7684\u51e0\u4f55\u77e9\u6536\u7f29\u6027\u8d28\uff0c\u5728\u5747\u503c\u5f3a\u5355\u8c03\u4e0e\u968f\u673a Lp Lipschitz \u6761\u4ef6\u4e0b\uff0c\u7ed9\u51fa\u540c\u6b65 Lp \u6536\u7f29\u5224\u636e\u4e0e Lyapunov \u6b65\u957f\u8bc1\u4e66\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u968f\u673a\u52a0\u901f\u4f18\u5316\u7684\u7a33\u5b9a\u6027\u63d0\u4f9b\u4e86\u66f4\u7cbe\u7ec6\u7684\u7406\u8bba\u5de5\u5177\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u91cd\u5c3e\u566a\u58f0\u6216\u4ec5\u6709\u9650 p \u9636\u77e9\u7684\u573a\u666f\uff0c\u5e76\u7ed9\u51fa\u53ef\u9a8c\u8bc1\u7684 Lyapunov/S-procedure \u8bc1\u4e66\u4ee5\u51cf\u5c11\u6b65\u957f\u4fdd\u5b88\u6027\u3002"}, {"abstract": "We report fine-grained, deterministic instability in Dynamic Tensor Rematerialization (DTR), an online eviction policy for memory-constrained DNN training, measured on the reference DTR simulator (simrd) using public execution traces. On an LSTM trace, memory budgets differing by 0.10% of unconstrained peak memory select fast and slow execution regimes whose overheads differ by as much as 7.3x; the slow regime is driven by broadly repeated re-eviction of the same storages (evictions per storage rise from 1.33 to 8.27 while the set of distinct evicted storages is essentially unchanged: 5,233 vs 5,236, with the two sets overlapping at Jaccard 0.999). On a ResNet-32 trace, a fine budget sweep reveals a deterministic feasibility inversion: the run is feasible at ratio 0.101, infeasible (OOM) across 0.102-0.106, and feasible again from 0.107. We trace the immediate cause of the OOM to a fully pinned recursive rematerialization frontier that exceeds the budget after every evictable tensor has been evicted. Ablations using the DTR authors\u0027 own variants implicate the joint size-staleness scoring term in the observed LSTM instability. We argue these are at least two distinct budget-sensitive pathologies rather than one mechanism, and we separate what is demonstrated from what remains hypothesised. All results concern the reference simulator; reproduction in a production runtime is future work. Code, instrumentation, and raw results accompany this preprint.", "arxiv_id": "2609.31250", "arxiv_url": "https://arxiv.org/abs/2609.31250", "authors": ["Mahesh Reddy Pagadala"], "brief": "\u8bba\u6587\u57fa\u4e8e\u516c\u5f00\u6267\u884c\u8f68\u8ff9\u548c\u53c2\u8003DTR\u6a21\u62df\u5668simrd\uff0c\u7cfb\u7edf\u6d4b\u91cf\u52a8\u6001\u5f20\u91cf\u91cd\u7269\u5316\u5728\u53d7\u9650\u663e\u5b58\u8bad\u7ec3\u4e2d\u7684\u7ec6\u7c92\u5ea6\u786e\u5b9a\u6027\u4e0d\u7a33\u5b9a\u73b0\u8c61\u3002\u4f5c\u8005\u53d1\u73b0\u6781\u5c0f\u5185\u5b58\u9884\u7b97\u53d8\u5316\u4f1a\u89e6\u53d1\u5feb\u6162\u6267\u884c regime \u5207\u6362\uff0c\u5e76\u5728ResNet-32\u8f68\u8ff9\u4e0a\u89c2\u5bdf\u5230\u201c\u53ef\u884c-\u4e0d\u53ef\u884c-\u518d\u53ef\u884c\u201d\u7684\u53cd\u76f4\u89c9\u53ef\u884c\u6027\u53cd\u8f6c\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31250", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728LSTM\u8f68\u8ff9\u4e0a\uff0c\u4ec50.10%\u65e0\u7ea6\u675f\u5cf0\u503c\u5185\u5b58\u7684\u9884\u7b97\u5dee\u5f02\u53ef\u5bfc\u81f4\u6700\u9ad87.3\u500d\u8fd0\u884c\u5f00\u9500\u5dee\u5f02\uff0c\u6162 regime \u4e3b\u8981\u7531\u540c\u4e00\u6279\u5b58\u50a8\u53cd\u590d\u9a71\u9010\u9020\u6210\u3002", "\u5728ResNet-32\u8f68\u8ff9\u4e2d\uff0c\u9884\u7b97\u6bd4\u4f8b0.101\u53ef\u884c\u30010.102-0.106\u53d1\u751fOOM\u30010.107\u540e\u518d\u6b21\u53ef\u884c\uff0c\u5448\u73b0\u786e\u5b9a\u6027\u53ef\u884c\u6027\u53cd\u8f6c\u3002", "\u6d88\u878d\u5b9e\u9a8c\u6307\u5411DTR\u4e2d\u8054\u5408size-staleness\u8bc4\u5206\u9879\u53ef\u80fd\u5bfc\u81f4LSTM\u4e0d\u7a33\u5b9a\uff1b\u4f5c\u8005\u5f3a\u8c03\u8fd9\u4e9b\u73b0\u8c61\u6765\u81ea\u53c2\u8003\u6a21\u62df\u5668\uff0c\u751f\u4ea7\u8fd0\u884c\u65f6\u590d\u73b0\u4ecd\u5f85\u9a8c\u8bc1\u3002"], "keywords": ["\u6df1\u5ea6\u5b66\u4e60\u7cfb\u7edf", "\u5185\u5b58\u4f18\u5316", "\u5f20\u91cf\u91cd\u7269\u5316", "\u8c03\u5ea6\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31250v1", "published_at": "2026-09-25", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Deterministic Regime Switching and Feasibility Inversion in Dynamic Tensor Rematerialization", "tldr": "\u63ed\u793aDTR\u5185\u5b58\u7b56\u7565\u7684\u9884\u7b97\u654f\u611f\u5f02\u5e38", "upvotes": 0, "what_it_is": "\u8bba\u6587\u57fa\u4e8e\u516c\u5f00\u6267\u884c\u8f68\u8ff9\u548c\u53c2\u8003DTR\u6a21\u62df\u5668simrd\uff0c\u7cfb\u7edf\u6d4b\u91cf\u52a8\u6001\u5f20\u91cf\u91cd\u7269\u5316\u5728\u53d7\u9650\u663e\u5b58\u8bad\u7ec3\u4e2d\u7684\u7ec6\u7c92\u5ea6\u786e\u5b9a\u6027\u4e0d\u7a33\u5b9a\u73b0\u8c61\u3002\u4f5c\u8005\u53d1\u73b0\u6781\u5c0f\u5185\u5b58\u9884\u7b97\u53d8\u5316\u4f1a\u89e6\u53d1\u5feb\u6162\u6267\u884c regime \u5207\u6362\uff0c\u5e76\u5728ResNet-32\u8f68\u8ff9\u4e0a\u89c2\u5bdf\u5230\u201c\u53ef\u884c-\u4e0d\u53ef\u884c-\u518d\u53ef\u884c\u201d\u7684\u53cd\u76f4\u89c9\u53ef\u884c\u6027\u53cd\u8f6c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u5728\u7ebf\u663e\u5b58\u7ba1\u7406\u4e0e\u5f20\u91cf\u91cd\u7269\u5316\u7b56\u7565\u4e2d\u9690\u85cf\u7684\u9884\u7b97\u654f\u611f\u75c5\u6001\u884c\u4e3a\uff0c\u5bf9DNN\u8bad\u7ec3\u7cfb\u7edf\u7684\u53ef\u9760\u6027\u3001\u8c03\u53c2\u9c81\u68d2\u6027\u548c\u5185\u5b58\u8c03\u5ea6\u7b97\u6cd5\u8bbe\u8ba1\u5177\u6709\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Auroral spectrographs such as the Auroral Spectrograph In Skibotn (ASIS) record hundreds of thousands of emission spectra, but only a few hundred can be labelled by an expert. To exploit the rest, we pretrain a 1D Vision Transformer with a masked autoencoder on 223,000 unlabelled spectra. Without labels, its representation recovers the emission-line intensity ratios that physicists use to diagnose the precipitating particles (R^2 0.91 vs. 0.77 for an untrained control) and, under one linear probe, classifies as well as 13 features designed by experts. Fine-tuned, the model outperforms the previous supervised auroral classifier on its own benchmark (macro-AP 88.5 vs. 77.8), reaches 0.870 mAP, and exceeds the same architecture trained from scratch by +0.159 with 10% of the labels; attribution shows that it uses both N2+ bands. Could an existing pretrained model replace it? Two astronomical spectral foundation models and a time-series model transfer according to their spectral window: SpectraFM, trained in the infrared, falls below the untrained control, whereas SpecFormer, trained in the optical, approaches in-domain pretraining without reaching it.", "arxiv_id": "2609.31206", "arxiv_url": "https://arxiv.org/abs/2609.31206", "authors": ["Matthieu Le Lain", "Ga\u00ebl Cessateur", "S\u00e9bastien Lef\u00e8vre"], "brief": "\u672c\u6587\u752822.3\u4e07\u6761\u672a\u6807\u6ce8\u6781\u5149\u53d1\u5c04\u5149\u8c31\uff0c\u901a\u8fc7\u63a9\u7801\u81ea\u7f16\u7801\u5668\u9884\u8bad\u7ec31D Vision Transformer\uff0c\u5b66\u4e60\u5230\u80fd\u6062\u590d\u7269\u7406\u5b66\u5bb6\u5173\u6ce8\u7684\u53d1\u5c04\u7ebf\u5f3a\u5ea6\u6bd4\u7684\u8868\u5f81\u3002\u6a21\u578b\u5728\u7ebf\u6027\u63a2\u6d4b\u548c\u5fae\u8c03\u5206\u7c7b\u4e2d\u5747\u4f18\u4e8e\u672a\u9884\u8bad\u7ec3\u4e0e\u65e2\u6709\u76d1\u7763\u65b9\u6cd5\uff0c\u4e14\u8de8\u9886\u57df\u5149\u8c31\u57fa\u7840\u6a21\u578b\u8fc1\u79fb\u6548\u679c\u53d6\u51b3\u4e8e\u9884\u8bad\u7ec3\u5149\u8c31\u7a97\u53e3\uff0c\u57df\u5185\u9884\u8bad\u7ec3\u4ecd\u6700\u4f73\u3002", "categories": ["cs.LG", "physics.space-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31206", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u5149\u8c31\u5206\u6790", "\u57fa\u7840\u6a21\u578b", "\u6781\u5149\u7269\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31206v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Self-Supervised Representation Learning: From Spectral Foundation Models to Auroral Emission Spectra", "tldr": "\u672c\u6587\u752822.3\u4e07\u6761\u672a\u6807\u6ce8\u6781\u5149\u53d1\u5c04\u5149\u8c31\uff0c\u901a\u8fc7\u63a9\u7801\u81ea\u7f16\u7801\u5668\u9884\u8bad\u7ec31D Vision Transformer\uff0c\u5b66\u4e60\u5230\u80fd\u6062\u590d\u7269\u7406\u5b66\u5bb6\u5173\u6ce8\u7684\u53d1\u5c04\u7ebf\u5f3a\u5ea6\u6bd4\u7684\u8868\u5f81\u3002\u6a21\u578b\u5728\u7ebf\u6027\u63a2\u6d4b\u548c\u5fae\u8c03\u5206\u7c7b\u4e2d\u5747\u4f18\u4e8e\u672a\u9884\u8bad\u7ec3\u4e0e\u65e2\u6709\u76d1\u7763\u65b9\u6cd5\uff0c\u4e14\u8de8\u9886\u57df\u5149\u8c31\u57fa\u7840\u6a21\u578b\u8fc1\u79fb\u6548\u679c\u53d6\u51b3\u4e8e\u9884\u8bad\u7ec3\u5149\u8c31\u7a97\u53e3\uff0c\u57df\u5185\u9884\u8bad\u7ec3\u4ecd\u6700\u4f73\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Machine learning for scientific discovery is almost systematically data bound. Producing relevant high quality data, under budget constraints, is amongst the most promising ways to advance the field. Active learning (AL) offers promise wherever labelling requires expensive experiment, measurement, or simulation. Most existing tools cover only part of the data acquisition loop, and typically focus on either offline benchmarking or online deployment, but not both. We present ALF, a modular AL Framework that runs the full data acquisition loop via five modular components. One clear API for both settings: offline, against an existing dataset for controlled and reproducible experimentation; and online, against an oracle for acquiring new candidates in real-world deployments. ALF is open-source and available at https://github.com/instadeepai/alf.", "arxiv_id": "2609.31197", "arxiv_url": "https://arxiv.org/abs/2609.31197", "authors": ["Shikha Surana", "Alex Hawkins-Hooker", "Olivia Gallup", "Christoph Brunken", "Jules Tilly", "Paul Duckworth"], "brief": "\u672c\u6587\u63d0\u51fa ALF\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u53d1\u73b0\u7684\u6a21\u5757\u5316\u4e3b\u52a8\u5b66\u4e60\u6846\u67b6\uff0c\u8986\u76d6\u4ece\u5019\u9009\u9009\u62e9\u5230\u6570\u636e\u83b7\u53d6\u7684\u5b8c\u6574\u95ed\u73af\u3002\u5b83\u7528\u7edf\u4e00 API \u540c\u65f6\u652f\u6301\u79bb\u7ebf\u57fa\u51c6\u5b9e\u9a8c\u548c\u5728\u7ebf\u771f\u5b9e\u90e8\u7f72\uff0c\u6709\u52a9\u4e8e\u5728\u5b9e\u9a8c\u3001\u6d4b\u91cf\u6216\u4eff\u771f\u6210\u672c\u53d7\u9650\u65f6\u66f4\u9ad8\u6548\u83b7\u53d6\u9ad8\u8d28\u91cf\u6570\u636e\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31197", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e3b\u52a8\u5b66\u4e60", "\u79d1\u5b66\u53d1\u73b0", "\u6570\u636e\u83b7\u53d6", "\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31197v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ALF: An Active Learning Framework for Scientific Discovery", "tldr": "\u672c\u6587\u63d0\u51fa ALF\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u53d1\u73b0\u7684\u6a21\u5757\u5316\u4e3b\u52a8\u5b66\u4e60\u6846\u67b6\uff0c\u8986\u76d6\u4ece\u5019\u9009\u9009\u62e9\u5230\u6570\u636e\u83b7\u53d6\u7684\u5b8c\u6574\u95ed\u73af\u3002\u5b83\u7528\u7edf\u4e00 API \u540c\u65f6\u652f\u6301\u79bb\u7ebf\u57fa\u51c6\u5b9e\u9a8c\u548c\u5728\u7ebf\u771f\u5b9e\u90e8\u7f72\uff0c\u6709\u52a9\u4e8e\u5728\u5b9e\u9a8c\u3001\u6d4b\u91cf\u6216\u4eff\u771f\u6210\u672c\u53d7\u9650\u65f6\u66f4\u9ad8\u6548\u83b7\u53d6\u9ad8\u8d28\u91cf\u6570\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-as-a-judge has become the de facto standard for scalable, subjective evaluation, yet current leaderboards compensate for systematic measurement bias by running ever more comparisons, an approach that is both statistically unsound and computationally wasteful. The root cause is an incomplete measurement model, treating LLM judges as neutral, interchangeable instruments ignores documented biases like position bias, verbosity bias, judge severity, and self-enhancement, that no volume of additional data can eliminate. We propose a unified latent variable framework that jointly models pairwise and ordinal data while explicitly correcting for these confounders, recovering reliable rankings from substantially fewer comparisons. Because fitting this model costs negligible compute relative to a single round of LLM inference, bias correction is not only more statistically rigorous but also a more sustainable approach to trustworthy evaluation.", "arxiv_id": "2609.31184", "arxiv_url": "https://arxiv.org/abs/2609.31184", "authors": ["Harshita Katoch", "David Antony Selby", "Gerrit Gro\u00dfmann", "Sebastian Vollmer"], "brief": "\u8bba\u6587\u6307\u51fa\u5f53\u524d\u7528 LLM \u4f5c\u4e3a\u8bc4\u5ba1\u8fdb\u884c\u6392\u884c\u699c\u8bc4\u6d4b\u65f6\uff0c\u5e38\u9760\u589e\u52a0\u6bd4\u8f83\u6b21\u6570\u6765\u63a9\u76d6\u7cfb\u7edf\u6027\u504f\u5dee\uff0c\u65e2\u4e0d\u4e25\u8c28\u4e5f\u6d6a\u8d39\u7b97\u529b\u3002\u4f5c\u8005\u63d0\u51fa\u7edf\u4e00\u7684\u6f5c\u53d8\u91cf\u6846\u67b6\uff0c\u540c\u65f6\u5efa\u6a21\u6210\u5bf9\u4e0e\u5e8f\u6570\u6570\u636e\uff0c\u5e76\u663e\u5f0f\u6821\u6b63\u4f4d\u7f6e\u504f\u5dee\u3001\u5197\u957f\u504f\u5dee\u3001\u8bc4\u5ba1\u4e25\u5389\u5ea6\u7b49\u56e0\u7d20\uff0c\u4ece\u800c\u7528\u66f4\u5c11\u6bd4\u8f83\u83b7\u5f97\u66f4\u53ef\u9760\u6392\u540d\u3002", "categories": ["cs.AI", "cs.LG", "stat.AP", "stat.ME"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31184", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b", "\u504f\u5dee\u6821\u6b63", "\u6f5c\u53d8\u91cf\u6a21\u578b", "\u53ef\u6301\u7eed\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31184v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Accounting for Bias Enables Sustainable LLM Evaluation", "tldr": "\u8bba\u6587\u6307\u51fa\u5f53\u524d\u7528 LLM \u4f5c\u4e3a\u8bc4\u5ba1\u8fdb\u884c\u6392\u884c\u699c\u8bc4\u6d4b\u65f6\uff0c\u5e38\u9760\u589e\u52a0\u6bd4\u8f83\u6b21\u6570\u6765\u63a9\u76d6\u7cfb\u7edf\u6027\u504f\u5dee\uff0c\u65e2\u4e0d\u4e25\u8c28\u4e5f\u6d6a\u8d39\u7b97\u529b\u3002\u4f5c\u8005\u63d0\u51fa\u7edf\u4e00\u7684\u6f5c\u53d8\u91cf\u6846\u67b6\uff0c\u540c\u65f6\u5efa\u6a21\u6210\u5bf9\u4e0e\u5e8f\u6570\u6570\u636e\uff0c\u5e76\u663e\u5f0f\u6821\u6b63\u4f4d\u7f6e\u504f\u5dee\u3001\u5197\u957f\u504f\u5dee\u3001\u8bc4\u5ba1\u4e25\u5389\u5ea6\u7b49\u56e0\u7d20\uff0c\u4ece\u800c\u7528\u66f4\u5c11\u6bd4\u8f83\u83b7\u5f97\u66f4\u53ef\u9760\u6392\u540d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Decoding and interpreting naturalistic speech from the brain increasingly relies on alignment to pretrained speech and language representation spaces. However, current CLIP-style brain-speech alignment ground neural activity to a single anchor modality-audio or text-despite the brain\u0027s inherently multimodal speech processing. This induces a trade-off: audio anchoring preserves temporal structure but weakens linguistic separability, while text anchoring captures semantics yet discards acoustic detail. We propose BAT-CLIP, the first CLIP-style trimodal alignment framework for iEEG that jointly aligns neural embeddings to both pretrained audio and text anchors in a shared, frozen audio-text manifold. On the naturalistic Podcast benchmark, BAT-CLIP yields more robust representations than bimodal CLIP baselines. We also highlight the importance of using self-supervised foundation models for CLIP training.", "arxiv_id": "2609.31180", "arxiv_url": "https://arxiv.org/abs/2609.31180", "authors": ["Suhyun Kim", "Jinmo Han", "Danny Dongyeop Han", "Ahhyun Lucy Lee", "Jewoon Lee", "Yonghyeon Gwon", "Zach Paris", "Chun Kee Chung", "Saewoong Bahk", "Nam Soo Kim", "Seong Jae Hwang", "Jiook Cha"], "brief": "BAT-CLIP\u63d0\u51fa\u9996\u4e2a\u9762\u5411iEEG\u7684\u8111-\u97f3\u9891-\u6587\u672c\u4e09\u6a21\u6001CLIP\u5f0f\u5bf9\u9f50\u6846\u67b6\uff0c\u5c06\u795e\u7ecf\u8868\u5f81\u540c\u65f6\u5bf9\u9f50\u5230\u51bb\u7ed3\u7684\u9884\u8bad\u7ec3\u97f3\u9891\u4e0e\u6587\u672c\u5171\u4eab\u7a7a\u95f4\u3002\u76f8\u6bd4\u53ea\u5bf9\u9f50\u97f3\u9891\u6216\u6587\u672c\u7684\u53cc\u6a21\u6001\u65b9\u6cd5\uff0c\u5b83\u5728\u81ea\u7136\u8bed\u97f3Podcast\u57fa\u51c6\u4e0a\u83b7\u5f97\u66f4\u7a33\u5065\u7684\u8111\u8bed\u97f3\u8868\u5f81\uff0c\u5e76\u5f3a\u8c03\u81ea\u76d1\u7763\u57fa\u7840\u6a21\u578b\u5bf9\u8bad\u7ec3\u7684\u91cd\u8981\u6027\u3002", "categories": ["cs.SD", "cs.AI", "cs.LG", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31180", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u8111\u673a\u63a5\u53e3", "\u8bed\u97f3\u7406\u89e3", "\u5bf9\u6bd4\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31180v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BAT-CLIP: Trimodal Alignment of Brain, Audio and Text", "tldr": "BAT-CLIP\u63d0\u51fa\u9996\u4e2a\u9762\u5411iEEG\u7684\u8111-\u97f3\u9891-\u6587\u672c\u4e09\u6a21\u6001CLIP\u5f0f\u5bf9\u9f50\u6846\u67b6\uff0c\u5c06\u795e\u7ecf\u8868\u5f81\u540c\u65f6\u5bf9\u9f50\u5230\u51bb\u7ed3\u7684\u9884\u8bad\u7ec3\u97f3\u9891\u4e0e\u6587\u672c\u5171\u4eab\u7a7a\u95f4\u3002\u76f8\u6bd4\u53ea\u5bf9\u9f50\u97f3\u9891\u6216\u6587\u672c\u7684\u53cc\u6a21\u6001\u65b9\u6cd5\uff0c\u5b83\u5728\u81ea\u7136\u8bed\u97f3Podcast\u57fa\u51c6\u4e0a\u83b7\u5f97\u66f4\u7a33\u5065\u7684\u8111\u8bed\u97f3\u8868\u5f81\uff0c\u5e76\u5f3a\u8c03\u81ea\u76d1\u7763\u57fa\u7840\u6a21\u578b\u5bf9\u8bad\u7ec3\u7684\u91cd\u8981\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "My doctoral work aims to explore Audio Emotion Recognition (AER) in the context of atypical listening. This research focuses on auditory hypersensitivity in people with autism, a phenomenon that is often difficult to evaluate and unique to each individual. Our core idea is to leverage our understanding of affect from acoustic traits, relying on the possibility of generalizing affective responses from a small amount of annotated data. As a first step, we fine-tune a large foundation model, Contrastive Language-Audio Pretraining (CLAP) using low-rank adaptation (LoRA), trained on a valence and arousal dataset of neurotypical listeners.", "arxiv_id": "2609.31168", "arxiv_url": "https://arxiv.org/abs/2609.31168", "authors": ["Ulysse Roussel"], "brief": "\u8be5\u535a\u58eb\u7814\u7a76\u5173\u6ce8\u975e\u5178\u578b\u542c\u89c9\u573a\u666f\u4e0b\u7684\u97f3\u9891\u60c5\u611f\u8bc6\u522b\uff0c\u7279\u522b\u662f\u81ea\u95ed\u75c7\u4eba\u7fa4\u7684\u542c\u89c9\u8fc7\u654f\u4e0e\u4e2a\u4f53\u5316\u60c5\u611f\u53cd\u5e94\u8bc4\u4f30\u3002\u521d\u6b65\u65b9\u6cd5\u662f\u5728\u795e\u7ecf\u5178\u578b\u542c\u8005\u7684\u6548\u4ef7-\u5524\u9192\u5ea6\u6570\u636e\u4e0a\uff0c\u7528 LoRA \u5fae\u8c03 CLAP \u97f3\u9891\u57fa\u7840\u6a21\u578b\uff0c\u4ee5\u63a2\u7d22\u5c11\u91cf\u6807\u6ce8\u6570\u636e\u4e0b\u60c5\u611f\u53cd\u5e94\u7684\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31168", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u9891\u60c5\u611f\u8bc6\u522b", "\u57fa\u7840\u6a21\u578b", "\u81ea\u95ed\u75c7", "\u4f4e\u79e9\u9002\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31168v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Audio emotion recognition for atypical hearing", "tldr": "\u8be5\u535a\u58eb\u7814\u7a76\u5173\u6ce8\u975e\u5178\u578b\u542c\u89c9\u573a\u666f\u4e0b\u7684\u97f3\u9891\u60c5\u611f\u8bc6\u522b\uff0c\u7279\u522b\u662f\u81ea\u95ed\u75c7\u4eba\u7fa4\u7684\u542c\u89c9\u8fc7\u654f\u4e0e\u4e2a\u4f53\u5316\u60c5\u611f\u53cd\u5e94\u8bc4\u4f30\u3002\u521d\u6b65\u65b9\u6cd5\u662f\u5728\u795e\u7ecf\u5178\u578b\u542c\u8005\u7684\u6548\u4ef7-\u5524\u9192\u5ea6\u6570\u636e\u4e0a\uff0c\u7528 LoRA \u5fae\u8c03 CLAP \u97f3\u9891\u57fa\u7840\u6a21\u578b\uff0c\u4ee5\u63a2\u7d22\u5c11\u91cf\u6807\u6ce8\u6570\u636e\u4e0b\u60c5\u611f\u53cd\u5e94\u7684\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speech-breath segmentation is a fundamental preprocessing step in respiratory audio analysis, enabling applications such as respiratory acoustic biomarker extraction, lung function prediction and disease monitoring. Existing approaches, including threshold methods, Fourier Transform-based techniques, and unsupervised and pretrained voice activity detection (VAD) models, primarily focus on speech detection and often classify breathing events as non-speech or silence, limiting their applicability for precise breath detection. To address this limitation, we propose BreathGRU, a semi-supervised Bidirectional Gated Recurrent Unit (BiGRU) framework specifically designed for speech-breath segmentation. The proposed framework combines frame-level acoustic feature extraction with bidirectional recurrent modelling, pseudo-label refinement and duration-constrained Segmental Viterbi decoding to produce speech and breath segmentation. BreathGRU was evaluated against the existing approaches, using manually annotated recordings. Performance was assessed using event-based, time-based, overlap-based, duration-based and boundary-based segmentation metrics. Experiment results demonstrated that BreathGRU achieved the highest breath event recall (0.83), the lowest onset-localisation error (0.14s) and the highest Mean Match Intersection over Union (0.81), with competitive overall segmentation performance compared to large pretrained VAD models like Silero. Qualitative evaluation on manually annotated recordings further showed close agreement between BreathGRU and manual annotation, with better breath detection compared to Silero. These findings demonstrate that explicit breath event modelling provides advantages over general-purpose VAD models and establish BreathGRU as an effective speech-breath segmentation framework which can be applied for respiratory audio analysis and pulmonary healthcare applications.", "arxiv_id": "2609.31165", "arxiv_url": "https://arxiv.org/abs/2609.31165", "authors": ["Sania Fatima Sayed", "John W. Holloway", "Reyer Zwiggelaar", "Faisal I. Rezwan"], "brief": "\u8bba\u6587\u63d0\u51fa BreathGRU\uff0c\u4e00\u4e2a\u534a\u76d1\u7763\u53cc\u5411 GRU \u6846\u67b6\uff0c\u7528\u4e8e\u547c\u5438\u97f3\u9891\u4e2d\u7684\u8bed\u97f3\u4e0e\u547c\u5438\u4e8b\u4ef6\u5206\u5272\uff0c\u7ed3\u5408\u4f2a\u6807\u7b7e\u4f18\u5316\u548c\u5e26\u65f6\u957f\u7ea6\u675f\u7684 Segmental Viterbi \u89e3\u7801\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u547c\u5438\u4e8b\u4ef6\u53ec\u56de\u7387\u3001\u8d77\u70b9\u5b9a\u4f4d\u8bef\u5dee\u548c IoU \u7b49\u6307\u6807\u4e0a\u4f18\u4e8e\u4f20\u7edf\u65b9\u6cd5\uff0c\u5e76\u5728\u547c\u5438\u68c0\u6d4b\u4e0a\u6bd4\u901a\u7528\u9884\u8bad\u7ec3 VAD \u66f4\u53ef\u9760\u3002", "categories": ["cs.SD", "cs.LG", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31165", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u5206\u5272", "\u547c\u5438\u97f3\u9891", "\u534a\u76d1\u7763\u5b66\u4e60", "\u5faa\u73af\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31165v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BreathGRU: A Novel Semi-Supervised Bidirectional Gated Recurrent Unit Framework for Speech and Breath Segmentation for Respiratory Audio", "tldr": "\u8bba\u6587\u63d0\u51fa BreathGRU\uff0c\u4e00\u4e2a\u534a\u76d1\u7763\u53cc\u5411 GRU \u6846\u67b6\uff0c\u7528\u4e8e\u547c\u5438\u97f3\u9891\u4e2d\u7684\u8bed\u97f3\u4e0e\u547c\u5438\u4e8b\u4ef6\u5206\u5272\uff0c\u7ed3\u5408\u4f2a\u6807\u7b7e\u4f18\u5316\u548c\u5e26\u65f6\u957f\u7ea6\u675f\u7684 Segmental Viterbi \u89e3\u7801\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u547c\u5438\u4e8b\u4ef6\u53ec\u56de\u7387\u3001\u8d77\u70b9\u5b9a\u4f4d\u8bef\u5dee\u548c IoU \u7b49\u6307\u6807\u4e0a\u4f18\u4e8e\u4f20\u7edf\u65b9\u6cd5\uff0c\u5e76\u5728\u547c\u5438\u68c0\u6d4b\u4e0a\u6bd4\u901a\u7528\u9884\u8bad\u7ec3 VAD \u66f4\u53ef\u9760\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recommender systems engineer serendipity to foster active exploration and break predictable consumption cycles. The problem with existing offline beyond-accuracy metrics is that they often either isolate historical similarity or global popularity. We aim to design an evaluation metric that examines similarity, popularity, and actual user relevance. To achieve this, we introduce SPADE (Serendipitous Pareto Distance Evaluation). SPADE maps all items into a two-dimensional space to directly calculate a user-specific Pareto frontier of maximally popular and historically similar items. The final serendipity score is then computed by averaging the minimum Euclidean distance from this boundary strictly for the correctly recommended test-set items. Evaluating SPADE across five datasets and five baseline algorithms confirms its effectiveness; our results show that the metric successfully prevents algorithms from exploiting beyond-accuracy measures with irrelevant or non-personalized recommendations, reliably isolating serendipitous discoveries.", "arxiv_id": "2609.31164", "arxiv_url": "https://arxiv.org/abs/2609.31164", "authors": ["Tobias Vente", "Maarten Peirsman", "Noah Dani\u00ebls", "Hannu Toivonen", "Bart Goethals"], "brief": "\u8bba\u6587\u63d0\u51fa SPADE\uff0c\u4e00\u79cd\u7528\u4e8e\u8bc4\u4f30\u63a8\u8350\u7cfb\u7edf\u60ca\u559c\u6027\u7684\u79bb\u7ebf\u6307\u6807\uff0c\u540c\u65f6\u8003\u8651\u7269\u54c1\u7684\u5386\u53f2\u76f8\u4f3c\u5ea6\u3001\u5168\u5c40\u6d41\u884c\u5ea6\u548c\u7528\u6237\u771f\u5b9e\u76f8\u5173\u6027\u3002\u5b83\u901a\u8fc7\u6784\u5efa\u7528\u6237\u7279\u5b9a\u7684\u201c\u6d41\u884c\u5ea6-\u76f8\u4f3c\u5ea6\u201d\u5e15\u7d2f\u6258\u8fb9\u754c\uff0c\u53ea\u5bf9\u6b63\u786e\u63a8\u8350\u7684\u6d4b\u8bd5\u96c6\u7269\u54c1\u8ba1\u7b97\u8ddd\u79bb\uff0c\u4ece\u800c\u66f4\u53ef\u9760\u5730\u533a\u5206\u771f\u6b63\u6709\u4ef7\u503c\u7684\u60ca\u559c\u63a8\u8350\uff0c\u907f\u514d\u88ab\u65e0\u5173\u6216\u975e\u4e2a\u6027\u5316\u63a8\u8350\u5237\u9ad8\u5206\u3002", "categories": ["cs.IR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31164", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u8bc4\u4f30\u6307\u6807", "\u4e2a\u6027\u5316", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31164v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SPADE: Escaping the Popularity-Similarity Frontier to Measure Serendipitous Recommendations", "tldr": "\u8bba\u6587\u63d0\u51fa SPADE\uff0c\u4e00\u79cd\u7528\u4e8e\u8bc4\u4f30\u63a8\u8350\u7cfb\u7edf\u60ca\u559c\u6027\u7684\u79bb\u7ebf\u6307\u6807\uff0c\u540c\u65f6\u8003\u8651\u7269\u54c1\u7684\u5386\u53f2\u76f8\u4f3c\u5ea6\u3001\u5168\u5c40\u6d41\u884c\u5ea6\u548c\u7528\u6237\u771f\u5b9e\u76f8\u5173\u6027\u3002\u5b83\u901a\u8fc7\u6784\u5efa\u7528\u6237\u7279\u5b9a\u7684\u201c\u6d41\u884c\u5ea6-\u76f8\u4f3c\u5ea6\u201d\u5e15\u7d2f\u6258\u8fb9\u754c\uff0c\u53ea\u5bf9\u6b63\u786e\u63a8\u8350\u7684\u6d4b\u8bd5\u96c6\u7269\u54c1\u8ba1\u7b97\u8ddd\u79bb\uff0c\u4ece\u800c\u66f4\u53ef\u9760\u5730\u533a\u5206\u771f\u6b63\u6709\u4ef7\u503c\u7684\u60ca\u559c\u63a8\u8350\uff0c\u907f\u514d\u88ab\u65e0\u5173\u6216\u975e\u4e2a\u6027\u5316\u63a8\u8350\u5237\u9ad8\u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Time series forecasting is typically framed as learning a direct mapping from historical to future observations in the observation space. However, sequences of observations generally provide only a partial view of the dynamics of the underlying system, with future observations being shaped by latent dynamics. Recent latent-space forecasting methods thus achieve improved performance by predicting future observations from latent-space representations of historical observations rather than directly forecasting future observations in the observation space. Next, while future observations are also shaped by external factors, how to incorporate external, often multimodal, information into forecasting, so that it can shape latent-state formation and evolution directly, remains underexplored. We propose WorldTS, a world-modeling based forecasting framework that integrates multimodal covariates directly into the forecasting to further improve forecasting performance. Specifically, WorldTS employs a two-stage training strategy. First, it learns forecasting-relevant latent state dynamics conditioned on multimodal covariates, yielding encoded future states. Next, the learned state dynamics are frozen, and an observation decoder is trained to map the predicted future states back to future observations. Extensive experiments on 21 real-world datasets offer insight into WorldTS and its effectiveness.", "arxiv_id": "2609.31162", "arxiv_url": "https://arxiv.org/abs/2609.31162", "authors": ["Yuhan Zhu", "Xiangfei Qiu", "Hanyin Cheng", "Wangmeng Shen", "Chenjuan Guo", "Bin Yang", "Jilin Hu", "Christian S. Jensen"], "brief": "WorldTS \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u4e16\u754c\u6a21\u578b\u7684\u591a\u6a21\u6001\u534f\u53d8\u91cf\u611f\u77e5\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u6846\u67b6\uff0c\u5728\u6f5c\u5728\u7a7a\u95f4\u4e2d\u5efa\u6a21\u53d7\u5916\u90e8\u591a\u6a21\u6001\u4fe1\u606f\u6761\u4ef6\u5316\u7684\u72b6\u6001\u52a8\u6001\u3002\u65b9\u6cd5\u91c7\u7528\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u5148\u5b66\u4e60\u4e0e\u9884\u6d4b\u76f8\u5173\u7684\u6f5c\u5728\u72b6\u6001\u6f14\u5316\uff0c\u518d\u51bb\u7ed3\u52a8\u6001\u6a21\u578b\u5e76\u8bad\u7ec3\u89e3\u7801\u5668\u8fd8\u539f\u672a\u6765\u89c2\u6d4b\uff1b\u572821\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31162", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001", "\u6f5c\u5728\u7a7a\u95f4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31162v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "WorldTS: World Modeling for Multimodal Covariate-aware Time Series Forecasting", "tldr": "WorldTS \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u4e16\u754c\u6a21\u578b\u7684\u591a\u6a21\u6001\u534f\u53d8\u91cf\u611f\u77e5\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u6846\u67b6\uff0c\u5728\u6f5c\u5728\u7a7a\u95f4\u4e2d\u5efa\u6a21\u53d7\u5916\u90e8\u591a\u6a21\u6001\u4fe1\u606f\u6761\u4ef6\u5316\u7684\u72b6\u6001\u52a8\u6001\u3002\u65b9\u6cd5\u91c7\u7528\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u5148\u5b66\u4e60\u4e0e\u9884\u6d4b\u76f8\u5173\u7684\u6f5c\u5728\u72b6\u6001\u6f14\u5316\uff0c\u518d\u51bb\u7ed3\u52a8\u6001\u6a21\u578b\u5e76\u8bad\u7ec3\u89e3\u7801\u5668\u8fd8\u539f\u672a\u6765\u89c2\u6d4b\uff1b\u572821\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent empirical and theoretical advances suggest that joint-embedding predictive architectures (JEPAs) may learn meaningful representations for action-conditioned prediction of future outcomes, thus becoming one of the foundational structures for world models. However, accurate prediction does not, in general, necessarily imply recovery of underlying causal states that give rise to the observed dynamics. This work investigates when and how JEPAs can recover the underlying causal states from observations. We first introduce a latent variable model, in which high-dimensional observations are generated from latent causal states whose dynamics are governed by action-conditioned transition mechanisms. Based on this formulation, we develop a general information-theoretic objective that combines conditional likelihood maximization for learning transition dynamics with entropy maximization for preserving latent state information. We then establish identifiability conditions under which representations learned by this general objective recover the underlying latent causal states up to component-wise invertible transformations and permutation. One key condition for such identifiability is sufficient action-induced variation in the transition mechanisms. Guided by this finding, we instantiate the general objective with an action-modulated Gaussian additive-noise model, yielding action-modulated JEPA (A-JEPA). Experiments on synthetic environments verify the theoretical findings under the identifiability conditions and robustness to moderate violations, while visual benchmarks demonstrate improved state recovery and transfer to unseen transition mechanisms.", "arxiv_id": "2609.31161", "arxiv_url": "https://arxiv.org/abs/2609.31161", "authors": ["Yuhang Liu", "Zhuo Huang", "Javen Qinfeng Shi"], "brief": "\u672c\u6587\u7814\u7a76\u52a8\u4f5c\u6761\u4ef6\u5316\u7684 JEPA \u5728\u4ec0\u4e48\u6761\u4ef6\u4e0b\u4e0d\u4ec5\u80fd\u9884\u6d4b\u672a\u6765\uff0c\u8fd8\u80fd\u6062\u590d\u89c2\u6d4b\u80cc\u540e\u7684\u6f5c\u5728\u56e0\u679c\u72b6\u6001\u3002\u4f5c\u8005\u63d0\u51fa\u4fe1\u606f\u8bba\u76ee\u6807\u5e76\u7ed9\u51fa\u53ef\u8bc6\u522b\u6027\u6761\u4ef6\uff0c\u6307\u51fa\u8db3\u591f\u7684\u52a8\u4f5c\u8bf1\u5bfc\u8f6c\u79fb\u53d8\u5316\u662f\u5173\u952e\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba1 A-JEPA\uff0c\u5728\u5408\u6210\u4e0e\u89c6\u89c9\u57fa\u51c6\u4e0a\u63d0\u5347\u72b6\u6001\u6062\u590d\u548c\u5bf9\u672a\u89c1\u8f6c\u79fb\u673a\u5236\u7684\u8fc1\u79fb\u80fd\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31161", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u5f81\u5b66\u4e60", "\u56e0\u679c\u8868\u793a", "\u4e16\u754c\u6a21\u578b", "JEPA"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31161v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "I Act Therefore I Am: When Is JEPA\u0027s Action-Conditioning Enough to Learn Causal Mechanisms?", "tldr": "\u672c\u6587\u7814\u7a76\u52a8\u4f5c\u6761\u4ef6\u5316\u7684 JEPA \u5728\u4ec0\u4e48\u6761\u4ef6\u4e0b\u4e0d\u4ec5\u80fd\u9884\u6d4b\u672a\u6765\uff0c\u8fd8\u80fd\u6062\u590d\u89c2\u6d4b\u80cc\u540e\u7684\u6f5c\u5728\u56e0\u679c\u72b6\u6001\u3002\u4f5c\u8005\u63d0\u51fa\u4fe1\u606f\u8bba\u76ee\u6807\u5e76\u7ed9\u51fa\u53ef\u8bc6\u522b\u6027\u6761\u4ef6\uff0c\u6307\u51fa\u8db3\u591f\u7684\u52a8\u4f5c\u8bf1\u5bfc\u8f6c\u79fb\u53d8\u5316\u662f\u5173\u952e\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba1 A-JEPA\uff0c\u5728\u5408\u6210\u4e0e\u89c6\u89c9\u57fa\u51c6\u4e0a\u63d0\u5347\u72b6\u6001\u6062\u590d\u548c\u5bf9\u672a\u89c1\u8f6c\u79fb\u673a\u5236\u7684\u8fc1\u79fb\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-dimensional time series, inherently tensorial, are common in practice. Despite great progress in time series anomaly detection, most existing methods are confined to uni-/multi-variate time series. When handling multi-dimensional time series using these methods, reshaping operations are required, which inevitably break the intrinsic correlations and thus lead to performance degradation. In uni-/multi-variate time series anomaly detection, AutoEncoders (AEs) are widely adopted and generally categorized into reconstruction-based and prediction-based AEs. The reconstruction-based AE utilizes the current observation for reconstruction, while the prediction-based AE utilizes the historical information to predict the current observation. Thus, the two AEs utilize different information. To bridge the gap between reconstruction-based and prediction-based AEs, so as to fully leverage the available information and thus further enhance performance, we propose a predictive prior and incorporate it into the reconstruction-based AE. It may not be very difficult to conceive this idea, but designing the predictive prior so that it can work for tensor anomaly detection is non-trivial. Specifically, to avoid breaking the intrinsic correlations within the multi-dimensional time series, we use the tensor AE as the backbone. To incorporate the predictive prior into the reconstruction-based AE, we propose a Bayesian fusion approach and our analysis reveals that this approach can enhance the modeling capability of the model for normal data. To mitigate the over-generalization problem of AE, we incorporate physical laws, i.e. tensor low-rank decomposition rules, into the neural networks in the predictive prior, leading to the Physics-informed Predictive Prior Tensor AE (PPPTAE) framework. Experimental results on real-world datasets demonstrate the effectiveness of the proposed method.", "arxiv_id": "2609.31157", "arxiv_url": "https://arxiv.org/abs/2609.31157", "authors": ["Jianan Liu", "Chunguang Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u591a\u7ef4\u65f6\u95f4\u5e8f\u5217\u5f02\u5e38\u68c0\u6d4b\u7684\u8d1d\u53f6\u65af\u5f20\u91cf\u81ea\u7f16\u7801\u5668\uff0c\u5728\u91cd\u6784\u5f0f\u81ea\u7f16\u7801\u5668\u4e2d\u878d\u5408\u9884\u6d4b\u5148\u9a8c\uff0c\u907f\u514d\u5c06\u5f20\u91cf\u6570\u636e\u5c55\u5e73\u5bfc\u81f4\u7684\u76f8\u5173\u6027\u7834\u574f\u3002\u65b9\u6cd5\u8fdb\u4e00\u6b65\u5f15\u5165\u5f20\u91cf\u4f4e\u79e9\u5206\u89e3\u7b49\u7269\u7406\u7ea6\u675f\uff0c\u7f13\u89e3\u81ea\u7f16\u7801\u5668\u8fc7\u5ea6\u6cdb\u5316\u95ee\u9898\uff0c\u5e76\u5728\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u68c0\u6d4b\u6548\u679c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31157", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u5f02\u5e38\u68c0\u6d4b", "\u81ea\u7f16\u7801\u5668", "\u5f20\u91cf\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31157v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bayesian Tensor Autoencoder with Physics-informed Predictive Prior for Multi-dimensional Time Series Anomaly Detection", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u591a\u7ef4\u65f6\u95f4\u5e8f\u5217\u5f02\u5e38\u68c0\u6d4b\u7684\u8d1d\u53f6\u65af\u5f20\u91cf\u81ea\u7f16\u7801\u5668\uff0c\u5728\u91cd\u6784\u5f0f\u81ea\u7f16\u7801\u5668\u4e2d\u878d\u5408\u9884\u6d4b\u5148\u9a8c\uff0c\u907f\u514d\u5c06\u5f20\u91cf\u6570\u636e\u5c55\u5e73\u5bfc\u81f4\u7684\u76f8\u5173\u6027\u7834\u574f\u3002\u65b9\u6cd5\u8fdb\u4e00\u6b65\u5f15\u5165\u5f20\u91cf\u4f4e\u79e9\u5206\u89e3\u7b49\u7269\u7406\u7ea6\u675f\uff0c\u7f13\u89e3\u81ea\u7f16\u7801\u5668\u8fc7\u5ea6\u6cdb\u5316\u95ee\u9898\uff0c\u5e76\u5728\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u68c0\u6d4b\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Compressing a trained model yields a family of deployment candidates, and under domain shift the most compressed one need not be the one to deploy. We study selection over such a family, with candidates and teacher fixed and target labels absent or scarce. Two findings organize the label-free case. Minimum teacher distortion behaves almost as a constant rule, selecting the same eight-bit, per-channel, unclipped configuration in every run, which does not minimize empirical target cross-entropy. Established estimators divide sharply: in the overconfident-collapse regime of the CNN families, confidence-based estimators order the family close to backwards, and the diagnostics that identify it need the labels the setting denies, while output-distribution estimators match the teacher-relative anchor and on one architecture beat it. Distortion is nonetheless stable, so a supervised term can move selection away from it. Combining the two, we give exact quadratic identities for a canonical quadratic analogue of the family. We also show that under symmetric corruption the label-dependent part of a criterion linear in the label indicator is multiplied by one common factor whenever its coefficient sums are candidate-invariant, a class holding teacher contrasts and accuracy but not cross-entropy. These characterize the score\u0027s components without bounding selection regret. Across one hundred and thirty-four candidate families, one per independently trained convolutional or Vision Transformer teacher, anchoring reduces mean regret at the smallest label budget in every setting, an advantage that fades beyond twenty-five labels.", "arxiv_id": "2609.31155", "arxiv_url": "https://arxiv.org/abs/2609.31155", "authors": ["Alejandro Rodriguez Dominguez", "Muhammad Shahzad", "Xia Hong"], "brief": "\u8bba\u6587\u7814\u7a76\u5728\u57df\u504f\u79fb\u4e14\u76ee\u6807\u57df\u6807\u7b7e\u7f3a\u5931\u6216\u5f88\u5c11\u65f6\uff0c\u5982\u4f55\u4ece\u4e00\u7ec4\u540e\u8bad\u7ec3\u91cf\u5316\u6a21\u578b\u4e2d\u9009\u62e9\u90e8\u7f72\u7248\u672c\u3002\u4f5c\u8005\u53d1\u73b0\u5355\u7eaf\u6700\u5c0f\u5316\u6559\u5e08\u5931\u771f\u4f1a\u51e0\u4e4e\u56fa\u5b9a\u9009\u62e9\u540c\u4e00\u79cd8\u6bd4\u7279\u914d\u7f6e\u4e14\u4e0d\u4e00\u5b9a\u6700\u4f18\uff0c\u800c\u7ed3\u5408\u6559\u5e08\u951a\u5b9a\u4e0e\u5c11\u91cf\u76d1\u7763\u4fe1\u53f7\u53ef\u5728\u6781\u5c0f\u6807\u7b7e\u9884\u7b97\u4e0b\u663e\u8457\u964d\u4f4e\u9009\u62e9\u540e\u6094\uff0c\u4f46\u4f18\u52bf\u5728\u8d85\u8fc7\u7ea625\u4e2a\u6807\u7b7e\u540e\u51cf\u5f31\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31155", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u91cf\u5316", "\u57df\u504f\u79fb", "\u6a21\u578b\u9009\u62e9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31155v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Teacher-Anchored Selection of Post-Training Quantized Models under Domain Shift", "tldr": "\u8bba\u6587\u7814\u7a76\u5728\u57df\u504f\u79fb\u4e14\u76ee\u6807\u57df\u6807\u7b7e\u7f3a\u5931\u6216\u5f88\u5c11\u65f6\uff0c\u5982\u4f55\u4ece\u4e00\u7ec4\u540e\u8bad\u7ec3\u91cf\u5316\u6a21\u578b\u4e2d\u9009\u62e9\u90e8\u7f72\u7248\u672c\u3002\u4f5c\u8005\u53d1\u73b0\u5355\u7eaf\u6700\u5c0f\u5316\u6559\u5e08\u5931\u771f\u4f1a\u51e0\u4e4e\u56fa\u5b9a\u9009\u62e9\u540c\u4e00\u79cd8\u6bd4\u7279\u914d\u7f6e\u4e14\u4e0d\u4e00\u5b9a\u6700\u4f18\uff0c\u800c\u7ed3\u5408\u6559\u5e08\u951a\u5b9a\u4e0e\u5c11\u91cf\u76d1\u7763\u4fe1\u53f7\u53ef\u5728\u6781\u5c0f\u6807\u7b7e\u9884\u7b97\u4e0b\u663e\u8457\u964d\u4f4e\u9009\u62e9\u540e\u6094\uff0c\u4f46\u4f18\u52bf\u5728\u8d85\u8fc7\u7ea625\u4e2a\u6807\u7b7e\u540e\u51cf\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific measurements such as single-cell RNA (scRNA) sequencing often take the form of nonnegative integer counts, whereas continuous-state diffusion models approximate this discrete structure using continuous coordinates. Building on stochastic chemical reaction networks (CRNs), a class of count-native Markov jump processes, we introduce CRNDiff, a structured framework that combines count-space diffusion with inference-time conditioning on rare subpopulations. An independent birth--death instantiation yields a closed-form transition kernel for forward noising. This kernel enables reverse sampling via forward-filtering backward-sampling (FFBS) and supports data-driven selection of the terminal noising time, eliminating the need for a validation sweep. This tractability also lets us introduce tilted Feynman--Kac (FK) steering, a method for sampling target subpopulations from a frozen generator without retraining. By tilting posterior marginals before FK particle correction, steering mitigates importance-weight concentration when the target population is rare. Using scRNA-seq data from the human heart cell atlas, we test the ability of CRNDiff to generate cell-type-specific distributions. Across the three evaluated target populations, CRNDiff achieves the highest conditional fidelity among the evaluated generative models, with larger mean purity margins for rarer target populations. Generated cells preserve marker-level differential-expression structure. Replacing real training cells for the target classes with generated cells yields downstream classification performance approaching that of the real-data reference.", "arxiv_id": "2609.31149", "arxiv_url": "https://arxiv.org/abs/2609.31149", "authors": ["Yuxuan Qiu", "Praful Gagrani", "Tetsuya J Kobayashi"], "brief": "\u63d0\u51fa CRNDiff\uff0c\u5c06\u57fa\u4e8e\u5316\u5b66\u53cd\u5e94\u7f51\u7edc\u7684\u6574\u6570\u8ba1\u6570\u7a7a\u95f4\u6269\u6563\u7528\u4e8e\u5355\u7ec6\u80de RNA \u6d4b\u5e8f\u7b49\u8ba1\u6570\u578b\u79d1\u5b66\u6570\u636e\uff0c\u5e76\u7ed9\u51fa\u72ec\u7acb\u51fa\u751f-\u6b7b\u4ea1\u8fc7\u7a0b\u7684\u95ed\u5f0f\u524d\u5411\u6838\u4e0e FFBS \u53cd\u5411\u91c7\u6837\u3002\u65b9\u6cd5\u652f\u6301\u65e0\u9700\u91cd\u8bad\u7684\u7a00\u6709\u4e9a\u7fa4\u6761\u4ef6\u751f\u6210\uff0c\u5728\u4eba\u7c7b\u5fc3\u810f\u5355\u7ec6\u80de\u6570\u636e\u4e0a\u76f8\u6bd4\u8bc4\u6d4b\u6a21\u578b\u83b7\u5f97\u66f4\u9ad8\u7684\u6761\u4ef6\u4fdd\u771f\u5ea6\uff0c\u5e76\u4fdd\u7559\u6807\u8bb0\u57fa\u56e0\u5dee\u5f02\u8868\u8fbe\u7ed3\u6784\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31149", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5355\u7ec6\u80de\u5206\u6790", "\u751f\u6210\u6a21\u578b", "\u8ba1\u6570\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31149v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CRNDiff: Count-Native Diffusion Framework via Chemical Reaction Networks", "tldr": "\u63d0\u51fa CRNDiff\uff0c\u5c06\u57fa\u4e8e\u5316\u5b66\u53cd\u5e94\u7f51\u7edc\u7684\u6574\u6570\u8ba1\u6570\u7a7a\u95f4\u6269\u6563\u7528\u4e8e\u5355\u7ec6\u80de RNA \u6d4b\u5e8f\u7b49\u8ba1\u6570\u578b\u79d1\u5b66\u6570\u636e\uff0c\u5e76\u7ed9\u51fa\u72ec\u7acb\u51fa\u751f-\u6b7b\u4ea1\u8fc7\u7a0b\u7684\u95ed\u5f0f\u524d\u5411\u6838\u4e0e FFBS \u53cd\u5411\u91c7\u6837\u3002\u65b9\u6cd5\u652f\u6301\u65e0\u9700\u91cd\u8bad\u7684\u7a00\u6709\u4e9a\u7fa4\u6761\u4ef6\u751f\u6210\uff0c\u5728\u4eba\u7c7b\u5fc3\u810f\u5355\u7ec6\u80de\u6570\u636e\u4e0a\u76f8\u6bd4\u8bc4\u6d4b\u6a21\u578b\u83b7\u5f97\u66f4\u9ad8\u7684\u6761\u4ef6\u4fdd\u771f\u5ea6\uff0c\u5e76\u4fdd\u7559\u6807\u8bb0\u57fa\u56e0\u5dee\u5f02\u8868\u8fbe\u7ed3\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Knowledge distillation is the standard way to compress encrypted-traffic classifiers for the edge, and almost all such work judges students by accuracy alone. We ask what else a student inherits: unknown-traffic detection, calibration, shortcut reliance, and whether any survives a year of drift. Resemblance proves little on its own, since soft targets also regularise. We therefore distil one 101k-parameter student from two teachers of equal accuracy but different construction, a five-member ensemble and a single wider model, so that following one rather than the other is attributable to it. The design was pre-registered before any test result was seen. We tested ten hypotheses on CESNET-TLS-Year22, a year of real TLS traffic, across 18 test windows over 35 weeks. Two are supported: a student\u0027s per-flow unknown-scores shift toward its own teacher, but only at a conventional temperature, not the accuracy-optimal one; and a shortcut-reliant teacher passes its over-confidence to a student that never sees the feature. The drift prediction is reversed under both scores, the gap narrowing rather than widening and the student overtaking under the energy score in two of three replicates, as is the prediction that such a teacher harms its student\u0027s detection, which improves slightly. Shortcut reliance is set by model size, not distillation. Under the logit-based scores nothing else transfers: distillation beats neither a temperature-scaled direct student nor label smoothing. Exploratory analysis shows this turns on the scoring rule: with a feature-space detector the teacher detects unknown traffic 0.073 AUROC better than the direct student, where the energy score sees 0.000, and the conventional-temperature student inherits most of it. Label smoothing, with no teacher, recovers more. Distillation transfers the teacher\u0027s habits; what looks like an inherited ability is available without one.", "arxiv_id": "2609.31141", "arxiv_url": "https://arxiv.org/abs/2609.31141", "authors": ["Mahmoud Abbasi"], "brief": "\u672c\u6587\u7814\u7a76\u52a0\u5bc6\u6d41\u91cf\u5206\u7c7b\u5668\u7684\u77e5\u8bc6\u84b8\u998f\u662f\u5426\u4f1a\u7ee7\u627f\u6559\u5e08\u6a21\u578b\u7684\u672a\u77e5\u6d41\u91cf\u68c0\u6d4b\u3001\u6821\u51c6\u3001\u6377\u5f84\u4f9d\u8d56\uff0c\u5e76\u5728\u4e00\u5e74\u771f\u5b9e TLS \u6d41\u91cf\u6f02\u79fb\u4e2d\u68c0\u9a8c\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5b66\u751f\u4f1a\u5728\u7279\u5b9a\u6e29\u5ea6\u4e0b\u7ee7\u627f\u6559\u5e08\u7684\u672a\u77e5\u5206\u6570\u504f\u79fb\u548c\u8fc7\u5ea6\u81ea\u4fe1\uff0c\u4f46\u591a\u6570\u80fd\u529b\u5e76\u672a\u7a33\u5b9a\u8fc1\u79fb\uff0c\u6807\u7b7e\u5e73\u6ed1\u7b49\u65e0\u6559\u5e08\u65b9\u6cd5\u4e5f\u80fd\u8fbe\u5230\u751a\u81f3\u8d85\u8fc7\u7c7b\u4f3c\u6548\u679c\u3002", "categories": ["cs.NI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31141", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u52a0\u5bc6\u6d41\u91cf", "\u6a21\u578b\u6821\u51c6", "\u5206\u5e03\u6f02\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31141v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unknown-Traffic Detection, Calibration and Shortcut Reliance in Distilled Encrypted-Traffic Classifiers over One Year", "tldr": "\u672c\u6587\u7814\u7a76\u52a0\u5bc6\u6d41\u91cf\u5206\u7c7b\u5668\u7684\u77e5\u8bc6\u84b8\u998f\u662f\u5426\u4f1a\u7ee7\u627f\u6559\u5e08\u6a21\u578b\u7684\u672a\u77e5\u6d41\u91cf\u68c0\u6d4b\u3001\u6821\u51c6\u3001\u6377\u5f84\u4f9d\u8d56\uff0c\u5e76\u5728\u4e00\u5e74\u771f\u5b9e TLS \u6d41\u91cf\u6f02\u79fb\u4e2d\u68c0\u9a8c\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5b66\u751f\u4f1a\u5728\u7279\u5b9a\u6e29\u5ea6\u4e0b\u7ee7\u627f\u6559\u5e08\u7684\u672a\u77e5\u5206\u6570\u504f\u79fb\u548c\u8fc7\u5ea6\u81ea\u4fe1\uff0c\u4f46\u591a\u6570\u80fd\u529b\u5e76\u672a\u7a33\u5b9a\u8fc1\u79fb\uff0c\u6807\u7b7e\u5e73\u6ed1\u7b49\u65e0\u6559\u5e08\u65b9\u6cd5\u4e5f\u80fd\u8fbe\u5230\u751a\u81f3\u8d85\u8fc7\u7c7b\u4f3c\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frequency-based adversarial attacks have recently grown popular by exploiting spectral sensitivities shared across neural architectures. Unlike spatial perturbations, frequency-based attacks expose deeper vulnerabilities, making them especially valuable for robust evaluation of safety-critical and security-sensitive applications. Yet, existing approaches are typically not derived as solutions to an optimization problem that explicitly captures transform-domain structure. In this paper, we propose a methodology for crafting principled frequency-based adversarial attacks, via a dedicated optimization framework. A cornerstone of our method hinges on the introduction of a perturbation constraint set, tied to highly structured non-orthogonal transforms, well-known for their flexible, non-predefined frequency handling. We prove that the attacks emerge as weighted $\\ell_2$-projections onto this set, yielding a general and controlled attack generation mechanism. By this, we provide a clear geometric attack characterization, ensuring alignment between the optimization objective and the perturbation constraint. We assess our framework on standardized datasets, for pretrained and adversarially robust models. Results highlight that our attacks, being solutions to an optimization problem, over a structured perturbation set, are highly effective, even across different, unseen architectures. Our methodology could serve as a theoretical baseline for designing and analyzing transformed-based attacks, targeting fundamental model vulnerabilities, instead of mere architecture-specific artifacts typically studied in the robustness literature.", "arxiv_id": "2609.31128", "arxiv_url": "https://arxiv.org/abs/2609.31128", "authors": ["Vicky Kouni", "Stelios Perrakis", "Francis Bach", "Pascal Frossard", "Yann Chevaleyre"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7ed3\u6784\u611f\u77e5\u7684\u9891\u57df\u5bf9\u6297\u653b\u51fb\u65b9\u6cd5\uff0c\u5c06\u653b\u51fb\u6784\u9020\u8868\u8ff0\u4e3a\u5e26\u6709\u975e\u6b63\u4ea4\u53d8\u6362\u7ed3\u6784\u7ea6\u675f\u7684\u4f18\u5316\u95ee\u9898\uff0c\u5e76\u8bc1\u660e\u653b\u51fb\u53ef\u89c6\u4e3a\u52a0\u6743\u21132\u6295\u5f71\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u6807\u51c6\u6570\u636e\u96c6\u3001\u9884\u8bad\u7ec3\u6a21\u578b\u548c\u5bf9\u6297\u9c81\u68d2\u6a21\u578b\u4e0a\u90fd\u5f88\u6709\u6548\uff0c\u5e76\u80fd\u8fc1\u79fb\u5230\u672a\u89c1\u67b6\u6784\uff0c\u7528\u4e8e\u66f4\u7cfb\u7edf\u5730\u8bc4\u4f30\u6a21\u578b\u9c81\u68d2\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31128", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5bf9\u6297\u653b\u51fb", "\u9c81\u68d2\u6027", "\u9891\u57df\u65b9\u6cd5", "\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31128v1", "published_at": "2026-09-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Frame the adversary: a structure-aware attack methodology", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7ed3\u6784\u611f\u77e5\u7684\u9891\u57df\u5bf9\u6297\u653b\u51fb\u65b9\u6cd5\uff0c\u5c06\u653b\u51fb\u6784\u9020\u8868\u8ff0\u4e3a\u5e26\u6709\u975e\u6b63\u4ea4\u53d8\u6362\u7ed3\u6784\u7ea6\u675f\u7684\u4f18\u5316\u95ee\u9898\uff0c\u5e76\u8bc1\u660e\u653b\u51fb\u53ef
