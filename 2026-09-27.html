ue, "key_points": ["VOI \u8bad\u7ec3\u76ee\u6807\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\uff1a\u7531\u89c4\u5219\u751f\u6210\u91d1\u6807\u51c6\u51b3\u7b56\uff0cLLM \u8d1f\u8d23\u6539\u5199\u6d88\u606f\u4e0e\u7b54\u6848\uff0c\u53e6\u4e00\u4e2a\u6a21\u578b\u6821\u9a8c\u6587\u672c\uff0c\u591a\u914d\u7f6e\u914d\u5bf9\u4f30\u8ba1\u8ffd\u95ee\u540e\u7684\u5b9e\u9645\u6536\u76ca\u3002", "\u5f15\u5165 Gini impurity \u4e0a\u9650\uff0c\u7ea6\u675f\u9884\u6d4b\u7684\u4fe1\u606f\u4ef7\u503c\u4e0d\u8d85\u8fc7\u6821\u51c6\u6a21\u578b\u7406\u8bba\u4e0a\u8fd8\u80fd\u83b7\u5f97\u7684\u6536\u76ca\uff0c\u51cf\u5c11\u8fc7\u5ea6\u8ffd\u95ee\u3002", "\u5b9e\u9a8c\u4e2d\u5728\u5df2\u89c1 schema \u4e0a\u63a5\u8fd1 Bayes \u4e0a\u9650\uff1b0.5 \u4e2a\u95ee\u9898/\u5bf9\u8bdd\u9884\u7b97\u4e0b\u6bd4\u4ece\u4e0d\u8ffd\u95ee\u51c6\u786e\u7387\u9ad8 14.1 \u4e2a\u767e\u5206\u70b9\uff0c\u5728 ABCD \u771f\u5b9e\u5bf9\u8bdd\u4e2d\u6709\u6548\u8ffd\u95ee\u5e26\u6765 8.3 \u4e2a\u70b9\u63d0\u5347\u3002"], "keywords": ["\u4fe1\u606f\u4ef7\u503c", "\u51b3\u7b56\u6a21\u578b", "\u4e3b\u52a8\u63d0\u95ee", "\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30706v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LAVOIR: Teaching a Single-Pass Decision Encoder When and What to Ask with Amortized Value of Information", "tldr": "\u5355\u6b21\u524d\u5411\u540c\u65f6\u51b3\u7b56\u5e76\u4f30\u8ba1\u8be5\u95ee\u4ec0\u4e48", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LAVOIR\uff0c\u5728 Laya/Jev \u8fd9\u7c7b\u5355\u6b21\u524d\u5411\u51b3\u7b56\u6a21\u578b\u4e2d\u52a0\u5165\u201c\u4fe1\u606f\u4ef7\u503c\u201d\u8def\u7531\uff1a\u628a\u5019\u9009\u7f3a\u5931\u4fe1\u606f\u69fd\u4f4d\u4e0e\u7b54\u6848\u9009\u9879\u4e00\u8d77\u8f93\u5165\uff0c\u6a21\u578b\u4e00\u6b21\u524d\u5411\u5373\u53ef\u8f93\u51fa\u51b3\u7b56\u6982\u7387\u548c\u6bcf\u4e2a\u69fd\u4f4d\u7684\u9884\u671f\u589e\u76ca\uff0c\u4ece\u800c\u51b3\u5b9a\u4f55\u65f6\u5411\u7528\u6237\u8ffd\u95ee\u3001\u8ffd\u95ee\u4ec0\u4e48\u3002", "why_notable": "\u5b83\u628a\u4e3b\u52a8\u63d0\u95ee\u80fd\u529b\u538b\u7f29\u8fdb\u5355\u6b21\u524d\u5411\u7684\u8f7b\u91cf\u51b3\u7b56\u7f16\u7801\u5668\u4e2d\uff0c\u517c\u987e\u4f4e\u5ef6\u8fdf\u3001\u6982\u7387\u6821\u51c6\u548c\u53ef\u63a7\u8ffd\u95ee\u7b56\u7565\uff1b\u76f8\u6bd4\u4f9d\u8d56\u591a\u8f6e\u5927\u6a21\u578b\u63a8\u7406\uff0c\u66f4\u9002\u5408\u9ad8\u541e\u5410\u3001\u4f4e\u6210\u672c\u7684\u5b9e\u9645\u6587\u672c\u51b3\u7b56\u7cfb\u7edf\u3002"}, {"abstract": "Vision-language models (VLMs) often struggle with compositional reasoning tasks, but the reasons for this underperformance remain unclear. A common hypothesis is that models struggle to integrate multiple components, leading to training interventions to improve compositional binding. However, this assumption has never been directly quantified. Existing benchmarks evaluate captions only in their composed form, making it impossible to separate the cost of joint reasoning from the cost of recognizing individual components under increasing load. We introduce COMPASS (COMPositional Analysis of SkillS), a controlled evaluation framework designed to isolate and measure the distinct factors underlying compositional failure. By comparing performance on composed captions with their decomposed counterparts , we directly quantify the cost of compositional integration across 87K image-caption pairs. Across multiple VLMs, this gap is real but partial, accounting for only part of the observed degradation. This motivates a finer-grained investigation into what additional factors govern model behavior. We analyze performance at the level of individual skills: object detection, attribute binding, and relation reasoning, using skill-targeted perturbations across 274K image-caption pairs. We find a consistent skill-specific pattern: each skill degrades primarily with the count of its own primitive type (self-load), while cross-load effects are predominantly positive, suggesting that primitives of different types provide useful grounding context. This pattern holds across standard contrastive encoders, explicitly trained compositional reasoning models, and non-contrastive architectures. These findings show that compositional degradation reflects multiple separable factors that cannot be reduced to joint reasoning alone.", "arxiv_id": "2609.31456", "arxiv_url": "https://arxiv.org/abs/2609.31456", "authors": ["Mona Gandhi", "Cenk Merih Olcay", "Kuan-Chieh Lo", "Santiago Castro", "Christopher W. Myers", "Srinivasan Parthasarathy"], "brief": "\u8bba\u6587\u63d0\u51faCOMPASS\u53d7\u63a7\u8bc4\u4f30\u6846\u67b6\uff0c\u901a\u8fc7\u6bd4\u8f83\u7ec4\u5408\u63cf\u8ff0\u4e0e\u62c6\u89e3\u63cf\u8ff0\uff0c\u5728\u5927\u89c4\u6a21\u56fe\u6587\u5bf9\u4e0a\u5206\u79bb\u8861\u91cfVLM\u7684\u7ec4\u5408\u6574\u5408\u6210\u672c\u4e0e\u5355\u9879\u6280\u80fd\u9000\u5316\u3002\u7814\u7a76\u53d1\u73b0\u7ec4\u5408\u5931\u8d25\u5e76\u975e\u53ea\u6e90\u4e8e\u8054\u5408\u63a8\u7406\u56f0\u96be\uff0c\u8fd8\u53d7\u5230\u5bf9\u8c61\u3001\u5c5e\u6027\u3001\u5173\u7cfb\u7b49\u6280\u80fd\u81ea\u8eab\u8d1f\u8f7d\u7684\u663e\u8457\u5f71\u54cd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31456", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u572887K\u56fe\u6587\u5bf9\u4e0a\u76f4\u63a5\u91cf\u5316\u7ec4\u5408\u63cf\u8ff0\u76f8\u5bf9\u62c6\u89e3\u63cf\u8ff0\u7684\u6027\u80fd\u5dee\u8ddd\uff0c\u53d1\u73b0\u7ec4\u5408\u6574\u5408\u6210\u672c\u771f\u5b9e\u5b58\u5728\u4f46\u53ea\u80fd\u89e3\u91ca\u90e8\u5206\u9000\u5316\u3002", "\u5728274K\u56fe\u6587\u5bf9\u4e0a\u7528\u6280\u80fd\u5b9a\u5411\u6270\u52a8\u5206\u6790\u5bf9\u8c61\u68c0\u6d4b\u3001\u5c5e\u6027\u7ed1\u5b9a\u3001\u5173\u7cfb\u63a8\u7406\u4e09\u7c7b\u80fd\u529b\u3002", "\u5404\u6280\u80fd\u4e3b\u8981\u968f\u81ea\u8eab\u539f\u8bed\u6570\u91cf\u589e\u52a0\u800c\u9000\u5316\uff0c\u81ea\u8eab\u8d1f\u8f7d\u6548\u5e94\u663e\u8457\uff1b\u4e0d\u540c\u7c7b\u578b\u539f\u8bed\u7684\u4ea4\u53c9\u8d1f\u8f7d\u591a\u4e3a\u6b63\u5411\uff0c\u53ef\u80fd\u63d0\u4f9b\u989d\u5916 grounding \u7ebf\u7d22\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7ec4\u5408\u63a8\u7406", "\u6a21\u578b\u8bc4\u6d4b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31456v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Diagnosing the Sources of Compositional Failure in Vision-Language Models: A Controlled Analysis", "tldr": "\u91cf\u5316VLM\u7ec4\u5408\u5931\u8d25\u7684\u591a\u91cd\u6765\u6e90", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faCOMPASS\u53d7\u63a7\u8bc4\u4f30\u6846\u67b6\uff0c\u901a\u8fc7\u6bd4\u8f83\u7ec4\u5408\u63cf\u8ff0\u4e0e\u62c6\u89e3\u63cf\u8ff0\uff0c\u5728\u5927\u89c4\u6a21\u56fe\u6587\u5bf9\u4e0a\u5206\u79bb\u8861\u91cfVLM\u7684\u7ec4\u5408\u6574\u5408\u6210\u672c\u4e0e\u5355\u9879\u6280\u80fd\u9000\u5316\u3002\u7814\u7a76\u53d1\u73b0\u7ec4\u5408\u5931\u8d25\u5e76\u975e\u53ea\u6e90\u4e8e\u8054\u5408\u63a8\u7406\u56f0\u96be\uff0c\u8fd8\u53d7\u5230\u5bf9\u8c61\u3001\u5c5e\u6027\u3001\u5173\u7cfb\u7b49\u6280\u80fd\u81ea\u8eab\u8d1f\u8f7d\u7684\u663e\u8457\u5f71\u54cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201cVLM\u7ec4\u5408\u5931\u8d25\u4e3b\u8981\u6765\u81ea\u8054\u5408\u63a8\u7406/\u7ed1\u5b9a\u56f0\u96be\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u63d0\u4f9b\u4e86\u53ef\u5206\u89e3\u3001\u53ef\u91cf\u5316\u7684\u8bca\u65ad\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u66f4\u7cbe\u786e\u5730\u8bbe\u8ba1\u7ec4\u5408\u6cdb\u5316\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u5e72\u9884\u3002"}, {"abstract": "Closed-loop driving simulation requires rendered observations to remain reliable as the ego vehicle and surrounding actors move beyond their recorded trajectories, exposing views absent from the source log. Existing data-driven simulators reconstruct dynamic actors from sparse observations, which can result in rendering artifacts under these viewpoint changes. We introduce RECAST (REconstructing Controllable Actors for Simulation and Testing), a 3D Gaussian Splatting framework that generates a view-complete actor from a single segmented vehicle observation in a driving log and registers the generated actor in the reconstructed scene. RECAST supports planner-in-the-loop rendering under controlled ego-actor interactions. To adapt an image-to-3D prior to real vehicles, we further introduce RECAR, a dataset of approximately 20K real vehicles with 600K background-free RGBA images spanning diverse vehicle colors and types. We use two-stage adaptation to improve vehicle generation from real driving-log observations. At the actor level, RECAST reduces $\\mathrm{FD}_{\\mathrm{incep}}$ from 9.788 to 7.992 relative to unadapted TRELLIS. At the scene level, under actor motion beyond logged trajectories, RECAST reduces $\\mathrm{FD}_{\\mathrm{incep}}$ from 129.35 to 112.10 and increases $\\mathrm{CLIP}_{\\mathrm{margin}}$ ($\\times1000$) from 0.14 to 3.47 relative to Street Gaussians. We demonstrate planner-in-the-loop simulation with the image-conditioned planner GTRS-Dense. Compared with native Street Gaussians actors, RECAST increases the no-collision (NC) rate from 22.2% (12/54) to 63.0% (34/54) and the mean minimum predicted time-to-collision (TTC) from 0.798 s to 2.150 s. These experiments show that RECAST supports closed-loop planner evaluation under controlled ego-actor interactions beyond log replay. Visit our project page at https://zijunkr.github.io/RECAST/", "arxiv_id": "2609.31374", "arxiv_url": "https://arxiv.org/abs/2609.31374", "authors": ["Zijun Zhao", "Liewen Liao", "Kang Shen", "Songan Zhang", "Ming Yang"], "brief": "RECAST \u662f\u4e00\u4e2a\u57fa\u4e8e 3D Gaussian Splatting \u7684\u95ed\u73af\u9a7e\u9a76\u4eff\u771f\u6846\u67b6\uff0c\u53ef\u4ece\u65e5\u5fd7\u4e2d\u5355\u5f20\u5206\u5272\u8f66\u8f86\u89c2\u6d4b\u751f\u6210\u89c6\u89d2\u5b8c\u6574\u3001\u53ef\u63a7\u7684 3D \u8f66\u8f86\uff0c\u5e76\u6ce8\u518c\u56de\u91cd\u5efa\u573a\u666f\u4e2d\u3002\u8bba\u6587\u8fd8\u6784\u5efa\u4e86 RECAR \u6570\u636e\u96c6\uff0c\u7528\u771f\u5b9e\u8f66\u8f86\u56fe\u50cf\u9002\u914d image-to-3D \u5148\u9a8c\uff0c\u4ee5\u51cf\u5c11\u8f66\u8f86\u8131\u79bb\u8bb0\u5f55\u8f68\u8ff9\u540e\u7684\u6e32\u67d3\u4f2a\u5f71\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31374", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u4ece\u5355\u5f20\u771f\u5b9e\u9a7e\u9a76\u65e5\u5fd7\u8f66\u8f86\u89c2\u6d4b\u751f\u6210 view-complete actor\uff0c\u652f\u6301\u81ea\u8f66\u4e0e\u4ea4\u901a\u53c2\u4e0e\u8005\u53d7\u63a7\u4ea4\u4e92\u4e0b\u7684 planner-in-the-loop \u6e32\u67d3\u3002", "\u6784\u5efa RECAR \u6570\u636e\u96c6\uff0c\u5305\u542b\u7ea6 2 \u4e07\u8f86\u771f\u5b9e\u8f66\u8f86\u300160 \u4e07\u5f20\u53bb\u80cc\u666f RGBA \u56fe\u50cf\uff0c\u8986\u76d6\u591a\u79cd\u8f66\u578b\u548c\u989c\u8272\uff0c\u5e76\u91c7\u7528\u4e24\u9636\u6bb5\u9002\u914d\u63d0\u5347\u771f\u5b9e\u8f66\u8f86\u751f\u6210\u8d28\u91cf\u3002", "\u76f8\u8f83\u57fa\u7ebf\uff0c\u5728\u573a\u666f\u7ea7\u8d85\u51fa\u65e5\u5fd7\u8f68\u8ff9\u7684\u6f14\u5458\u8fd0\u52a8\u4e2d\u964d\u4f4e FD_incep\uff08129.35\u2192112.10\uff09\uff0c\u5e76\u5728 GTRS-Dense \u89c4\u5212\u5668\u8bc4\u6d4b\u4e2d\u5c06\u65e0\u78b0\u649e\u7387\u4ece 22.2% \u63d0\u5347\u5230 63.0%\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u95ed\u73af\u4eff\u771f", "3D\u751f\u6210", "\u9ad8\u65af\u6e85\u5c04"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31374v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RECAST: From Log Replay to Closed-Loop Driving Simulation with View-Complete Actors", "tldr": "\u7528\u89c6\u89d2\u5b8c\u6574\u8f66\u8f86\u63d0\u5347\u95ed\u73af\u9a7e\u9a76\u4eff\u771f", "upvotes": 0, "what_it_is": "RECAST \u662f\u4e00\u4e2a\u57fa\u4e8e 3D Gaussian Splatting \u7684\u95ed\u73af\u9a7e\u9a76\u4eff\u771f\u6846\u67b6\uff0c\u53ef\u4ece\u65e5\u5fd7\u4e2d\u5355\u5f20\u5206\u5272\u8f66\u8f86\u89c2\u6d4b\u751f\u6210\u89c6\u89d2\u5b8c\u6574\u3001\u53ef\u63a7\u7684 3D \u8f66\u8f86\uff0c\u5e76\u6ce8\u518c\u56de\u91cd\u5efa\u573a\u666f\u4e2d\u3002\u8bba\u6587\u8fd8\u6784\u5efa\u4e86 RECAR \u6570\u636e\u96c6\uff0c\u7528\u771f\u5b9e\u8f66\u8f86\u56fe\u50cf\u9002\u914d image-to-3D \u5148\u9a8c\uff0c\u4ee5\u51cf\u5c11\u8f66\u8f86\u8131\u79bb\u8bb0\u5f55\u8f68\u8ff9\u540e\u7684\u6e32\u67d3\u4f2a\u5f71\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u95ed\u73af\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u4e2d\u201c\u65e5\u5fd7\u56de\u653e\u89c6\u89d2\u4e0d\u5b8c\u6574\u201d\u7684\u5173\u952e\u75db\u70b9\uff0c\u901a\u8fc7\u751f\u6210\u53ef\u63a7\u4e14\u89c6\u89d2\u5b8c\u6574\u7684\u8f66\u8f86\u63d0\u5347\u975e\u8bb0\u5f55\u8f68\u8ff9\u4e0b\u7684\u6e32\u67d3\u53ef\u9760\u6027\uff0c\u4f7f\u89c4\u5212\u5668\u8bc4\u6d4b\u66f4\u63a5\u8fd1\u771f\u5b9e\u4ea4\u4e92\u573a\u666f\uff0c\u5177\u6709\u8f83\u5f3a\u4eff\u771f\u6d4b\u8bd5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large video diffusion models offer expressive priors for embodied prediction and learning, yet their many-step sampling remains costly for interactive downstream use. Distribution Matching Distillation (DMD) enables few-step video generation, but can suppress robot--object motion while preserving visual quality. Examining DMD\u0027s teacher and fake-score signals, we find that weak re-noising keeps the teacher posterior concentrated near motion-deficient rollouts, limiting motion-restoring guidance. Meanwhile, stronger-motion rollouts tend to incur larger fake-score fitting errors, which can hinder the generator\u0027s learning of interaction dynamics. We propose DyMD, a DMD framework that adapts both teacher supervision and critic fitting to the evolving student. Temporal affinity--conditioned re-noise sampling adapts the timestep distribution to each rollout\u0027s current interaction fidelity by mixing the base schedule with a teacher prior motivated by local posterior variation, thereby balancing motion recovery and appearance refinement. To better track stronger-motion rollouts, dynamics-guided fake-score tracking uses a noise-conditioned predictor to estimate noise-relative fitting difficulty from latent temporal dynamics, then upweights predicted-hard rollouts in the critic loss. Using DyMD, we distill a 14B teacher into a four-step 1.3B student with no auxiliary modules at inference. On embodied-video benchmarks, the student improves R-Bench task adherence by $9.6$ percentage points and PAI-Bench-G Domain score by $5.1$ points over Base DMD while maintaining comparable visual quality. As a backbone for downstream action planning, our student achieves 34% mean success across two WorldArena tasks, compared with 16% for Base DMD.", "arxiv_id": "2609.31349", "arxiv_url": "https://arxiv.org/abs/2609.31349", "authors": ["Haojun Xu", "Jie Huang", "Xin Lu", "Mingchen Zhong", "Zihao Fan", "Linjiang Huang", "Si Liu"], "brief": "\u8bba\u6587\u63d0\u51fa DyMD\uff0c\u4e00\u79cd\u9762\u5411\u5c11\u6b65\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u5206\u5e03\u5339\u914d\u84b8\u998f\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u52a0\u901f\u91c7\u6837\u7684\u540c\u65f6\u4fdd\u7559\u673a\u5668\u4eba-\u7269\u4f53\u4ea4\u4e92\u52a8\u529b\u5b66\u3002\u5b83\u5c06 14B \u89c6\u9891\u6269\u6563\u6559\u5e08\u84b8\u998f\u4e3a\u56db\u6b65 1.3B \u5b66\u751f\u6a21\u578b\uff0c\u63a8\u7406\u65f6\u4e0d\u9700\u989d\u5916\u6a21\u5757\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31349", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u6807\u51c6 DMD \u867d\u80fd\u4fdd\u6301\u89c6\u89c9\u8d28\u91cf\uff0c\u4f46\u5f31\u91cd\u52a0\u566a\u4f1a\u8ba9\u6559\u5e08\u540e\u9a8c\u505c\u7559\u5728\u8fd0\u52a8\u4e0d\u8db3\u6837\u672c\u9644\u8fd1\uff0c\u5bfc\u81f4\u4ea4\u4e92\u8fd0\u52a8\u88ab\u6291\u5236\u3002", "\u63d0\u51fa\u65f6\u95f4\u4eb2\u548c\u6761\u4ef6\u91cd\u52a0\u566a\u91c7\u6837\uff0c\u6839\u636e\u5f53\u524d rollout \u7684\u4ea4\u4e92\u4fdd\u771f\u5ea6\u81ea\u9002\u5e94\u8c03\u6574\u65f6\u95f4\u6b65\u5206\u5e03\uff0c\u5e73\u8861\u8fd0\u52a8\u6062\u590d\u4e0e\u5916\u89c2\u7ec6\u5316\u3002", "\u63d0\u51fa\u52a8\u529b\u5b66\u5f15\u5bfc\u7684 fake-score \u8ddf\u8e2a\uff0c\u7528\u566a\u58f0\u6761\u4ef6\u9884\u6d4b\u5668\u4f30\u8ba1\u62df\u5408\u96be\u5ea6\uff0c\u5e76\u5728 critic loss \u4e2d\u4e0a\u6743\u91cd\u96be\u6837\u672c\u4ee5\u5b66\u4e60\u66f4\u5f3a\u8fd0\u52a8\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u84b8\u998f", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31349v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DyMD: Preserving Interaction Dynamics through Distribution Matching Distillation in Few-Step Video World Models", "tldr": "DyMD\u8ba9\u5c11\u6b65\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4fdd\u7559\u4ea4\u4e92\u8fd0\u52a8\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DyMD\uff0c\u4e00\u79cd\u9762\u5411\u5c11\u6b65\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u5206\u5e03\u5339\u914d\u84b8\u998f\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u52a0\u901f\u91c7\u6837\u7684\u540c\u65f6\u4fdd\u7559\u673a\u5668\u4eba-\u7269\u4f53\u4ea4\u4e92\u52a8\u529b\u5b66\u3002\u5b83\u5c06 14B \u89c6\u9891\u6269\u6563\u6559\u5e08\u84b8\u998f\u4e3a\u56db\u6b65 1.3B \u5b66\u751f\u6a21\u578b\uff0c\u63a8\u7406\u65f6\u4e0d\u9700\u989d\u5916\u6a21\u5757\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u5c11\u6b65\u89c6\u9891\u6269\u6563\u4e16\u754c\u6a21\u578b\u7684\u6838\u5fc3\u75db\u70b9\uff1a\u91c7\u6837\u52a0\u901f\u540e\u4ea4\u4e92\u52a8\u529b\u5b66\u9000\u5316\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5177\u8eab\u89c6\u9891\u57fa\u51c6\u548c\u4e0b\u6e38\u52a8\u4f5c\u89c4\u5212\u4e2d\u663e\u8457\u4f18\u4e8e Base DMD\uff0cR-Bench \u4efb\u52a1\u9075\u5faa\u63d0\u5347 9.6 \u4e2a\u767e\u5206\u70b9\uff0cWorldArena \u5e73\u5747\u6210\u529f\u7387\u4ece 16% \u63d0\u5347\u5230 34%\u3002"}, {"abstract": "Problem. Ultra-high-resolution (UHR) remote sensing with vague user intents has two bottlenecks: visual tokens are expensive, and tool calling must be format-reliable (pretrained models emit zero tool calls zero-shot). Method. WeaveAgent, a two-stage tool-routing agent, decouples routing from visual perception. Stage A is routing-first: emission is trained, not elicited. Stage B executes conditionally: intrinsic queries enter visual answering (full-scene thumbnail; a WeaveEarth-style evidence board as an optional fixed-budget, approx. 5k-token compression interface); extrinsic queries execute tool call on original full-resolution imagery, answering from tool observations in a second, observation-masked round. Training: alignment SFT, then GRPO under reward R_WA2. Results. Alignment SFT lifts extrinsic routing from 0% to 80.75% (323/400); GRPO suppresses 9 intrinsic mis-emissions while tool selection is unchanged. The trained 2B system does not beat the zero-shot 8B baseline overall (0.263 vs. 0.250), a diagnostic contribution. Oracle attribution separates two repair ingredients: loading the observation into context lifts extrinsic answer accuracy from 0.025 to 0.425 under marker-free cross-mode returns, and the two-turn SFT stage adds a further +9.3 points to 0.518 at a small routing cost. A +/- image ablation shows emission suppression is visually grounded, and a query-register matrix shows LLM-rewritten queries cost trained checkpoints 2-11 points. Scope. All training and evaluation use the 5,000 / 3,273 / 1,000-record VagueUHR corpus (600 intrinsic + 400 tool-requiring; the base seeds synthesis and is not used for optimization). Single-pass evidence construction runs at 7.31 s per image on an RTX 4090. Code, data, and evaluation protocols will be released.", "arxiv_id": "2609.31234", "arxiv_url": "https://arxiv.org/abs/2609.31234", "authors": ["Zhongyu Pang"], "brief": "\u8bba\u6587\u63d0\u51fa WeaveAgent\uff0c\u5c06\u5de5\u5177\u8def\u7531\u4e0e\u89c6\u89c9\u611f\u77e5\u89e3\u8026\uff1a\u5148\u5224\u65ad\u662f\u5426\u9700\u8981\u8c03\u7528\u5de5\u5177\uff0c\u518d\u6309\u67e5\u8be2\u7c7b\u578b\u8fdb\u5165\u89c6\u89c9\u95ee\u7b54\u6216\u5bf9\u539f\u59cb\u5168\u5206\u8fa8\u7387\u56fe\u50cf\u6267\u884c\u5de5\u5177\u8c03\u7528\u3002\u4f5c\u8005\u5728 VagueUHR \u6570\u636e\u96c6\u4e0a\u7528 SFT \u4e0e GRPO \u8bad\u7ec3\u5e76\u7cfb\u7edf\u8bca\u65ad\u4e86\u8def\u7531\u3001\u89c2\u6d4b\u52a0\u8f7d\u548c\u4e24\u8f6e\u56de\u7b54\u7684\u4f5c\u7528\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31234", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5bf9\u5916\u90e8\u5de5\u5177\u578b\u67e5\u8be2\uff0cSFT \u5c06\u96f6\u6837\u672c\u5de5\u5177\u8c03\u7528\u7387\u4ece 0% \u63d0\u5347\u5230 80.75%\uff0cGRPO \u8fdb\u4e00\u6b65\u6291\u5236\u5185\u5728\u89c6\u89c9\u67e5\u8be2\u7684\u8bef\u8c03\u7528\u3002", "\u5916\u90e8\u67e5\u8be2\u901a\u8fc7\u539f\u59cb\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\u8c03\u7528\u5de5\u5177\uff0c\u5e76\u5728\u7b2c\u4e8c\u8f6e\u57fa\u4e8e\u5de5\u5177\u89c2\u6d4b\u56de\u7b54\uff1b\u5185\u5728\u67e5\u8be2\u53ef\u4f7f\u7528\u7f29\u7565\u56fe\u4e0e\u7ea6 5k token \u7684\u8bc1\u636e\u677f\u538b\u7f29\u63a5\u53e3\u3002", "2B \u8bad\u7ec3\u7cfb\u7edf\u6574\u4f53\u672a\u8d85\u8fc7 8B \u96f6\u6837\u672c\u57fa\u7ebf\uff0c\u4f46\u6d88\u878d\u663e\u793a\u89c2\u6d4b\u5165\u4e0a\u4e0b\u6587\u548c\u4e24\u8f6e SFT \u53ef\u663e\u8457\u63d0\u5347\u5916\u90e8\u7b54\u6848\u51c6\u786e\u7387\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u9065\u611f\u5f71\u50cf", "\u5de5\u5177\u8c03\u7528", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31234v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "WeaveAgent: A Two-Stage Tool-Routing Agent for Ultra-High-Resolution Remote Sensing Imagery", "tldr": "\u9762\u5411\u8d85\u9ad8\u5206\u9065\u611f\u7684\u4e24\u9636\u6bb5\u5de5\u5177\u8def\u7531\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa WeaveAgent\uff0c\u5c06\u5de5\u5177\u8def\u7531\u4e0e\u89c6\u89c9\u611f\u77e5\u89e3\u8026\uff1a\u5148\u5224\u65ad\u662f\u5426\u9700\u8981\u8c03\u7528\u5de5\u5177\uff0c\u518d\u6309\u67e5\u8be2\u7c7b\u578b\u8fdb\u5165\u89c6\u89c9\u95ee\u7b54\u6216\u5bf9\u539f\u59cb\u5168\u5206\u8fa8\u7387\u56fe\u50cf\u6267\u884c\u5de5\u5177\u8c03\u7528\u3002\u4f5c\u8005\u5728 VagueUHR \u6570\u636e\u96c6\u4e0a\u7528 SFT \u4e0e GRPO \u8bad\u7ec3\u5e76\u7cfb\u7edf\u8bca\u65ad\u4e86\u8def\u7531\u3001\u89c2\u6d4b\u52a0\u8f7d\u548c\u4e24\u8f6e\u56de\u7b54\u7684\u4f5c\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u8d85\u9ad8\u5206\u8fa8\u7387\u9065\u611f\u4e2d\u89c6\u89c9 token \u6210\u672c\u9ad8\u3001\u5de5\u5177\u8c03\u7528\u4e0d\u7a33\u5b9a\u7684\u5b9e\u9645\u74f6\u9888\uff0c\u63d0\u4f9b\u4e86\u53ef\u8bad\u7ec3\u7684\u5de5\u5177\u8def\u7531\u8303\u5f0f\u548c\u7ec6\u7c92\u5ea6\u8bca\u65ad\u7ed3\u679c\uff0c\u5bf9\u9065\u611f\u667a\u80fd\u4f53\u4e0e\u9ad8\u5206\u8fa8\u7387\u591a\u6a21\u6001\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Reliable online video question answering requires tracking state transitions while selectively abstaining when visual evidence is insufficient. Existing benchmarks focus on static recognition or long-range retrieval, rarely evaluating these coupled capabilities under evolving and incomplete evidence. We present STORM-Bench, comprising 5,736 questions across 630 compact, change-dense episodes spanning five egocentric domains (STORM-Real) and two controlled simulation subsets (STORM-Sim) at 1 FPS. Questions are stratified by a proxy for accumulated change intensity (Low, Medium, High) and query-time answerability (Known, Uncertain). To measure reliability, we introduce STORM-BR, a harmonic metric over joint answer-status correctness that exposes abstention failures masked by aggregate accuracy, alongside STORM-BR-ATTR for uncertainty attribution. Across 14 video LLMs, online accuracy peaks at 60.3\\% (mean 51.7\\%), whereas STORM-BR ranges from 5.7\\% to 35.6\\% (mean 18.8\\%), driven by pervasive overconfidence on uncertain queries. STORM-Bench shows that task accuracy masks these gaps in epistemic reliability and state tracking. Benchmark and code are available at https://github.com/siruzhong/STORM-Bench.", "arxiv_id": "2609.30981", "arxiv_url": "https://arxiv.org/abs/2609.30981", "authors": ["Siru Zhong", "Shenghan Tan", "Rihong Yan", "Xiaohui Lv", "Yuzheng Zhuang", "Shuai Tao", "Wulong Liu", "Haohuan Fu", "Yuxuan Liang"], "brief": "\u8bba\u6587\u63d0\u51fa STORM-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u5728\u7ebf\u89c6\u9891\u95ee\u7b54\u7684\u57fa\u51c6\uff0c\u4e13\u95e8\u8003\u5bdf\u6a21\u578b\u5728\u8bc1\u636e\u6301\u7eed\u53d8\u5316\u4e14\u4e0d\u5b8c\u6574\u65f6\u7684\u72b6\u6001\u8ffd\u8e2a\u3001\u56de\u7b54\u4e0e\u62d2\u7b54\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b\u771f\u5b9e\u7b2c\u4e00\u89c6\u89d2\u4e0e\u53d7\u63a7\u6a21\u62df\u573a\u666f\uff0c\u5e76\u5f15\u5165 STORM-BR \u7b49\u53ef\u9760\u6027\u6307\u6807\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30981", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5305\u542b 630 \u4e2a\u53d8\u5316\u5bc6\u96c6\u7684\u89c6\u9891\u7247\u6bb5\u30015736 \u4e2a\u95ee\u9898\uff0c\u8986\u76d6 5 \u4e2a\u7b2c\u4e00\u89c6\u89d2\u771f\u5b9e\u9886\u57df\u548c 2 \u4e2a\u6a21\u62df\u5b50\u96c6\uff0c\u91c7\u6837\u7387\u4e3a 1 FPS", "\u95ee\u9898\u6309\u7d2f\u8ba1\u53d8\u5316\u5f3a\u5ea6 Low/Medium/High \u4ee5\u53ca\u67e5\u8be2\u65f6\u53ef\u56de\u7b54\u6027 Known/Uncertain \u5206\u5c42\u8bbe\u8ba1", "\u8bc4\u6d4b 14 \u4e2a\u89c6\u9891 LLM \u540e\u53d1\u73b0\uff0c\u5728\u7ebf\u51c6\u786e\u7387\u6700\u9ad8 60.3%\uff0c\u4f46 STORM-BR \u6700\u9ad8\u4ec5 35.6%\uff0c\u4e3b\u8981\u95ee\u9898\u662f\u6a21\u578b\u5bf9\u4e0d\u786e\u5b9a\u95ee\u9898\u8fc7\u5ea6\u81ea\u4fe1"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u95ee\u7b54\u8bc4\u6d4b", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30981v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "STORM-Bench: Evaluating Online Video QA under Evolving and Incomplete Evidence", "tldr": "\u8bc4\u6d4b\u89c6\u9891\u95ee\u7b54\u4e2d\u7684\u72b6\u6001\u8ffd\u8e2a\u4e0e\u53ef\u9760\u62d2\u7b54", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa STORM-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u5728\u7ebf\u89c6\u9891\u95ee\u7b54\u7684\u57fa\u51c6\uff0c\u4e13\u95e8\u8003\u5bdf\u6a21\u578b\u5728\u8bc1\u636e\u6301\u7eed\u53d8\u5316\u4e14\u4e0d\u5b8c\u6574\u65f6\u7684\u72b6\u6001\u8ffd\u8e2a\u3001\u56de\u7b54\u4e0e\u62d2\u7b54\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b\u771f\u5b9e\u7b2c\u4e00\u89c6\u89d2\u4e0e\u53d7\u63a7\u6a21\u62df\u573a\u666f\uff0c\u5e76\u5f15\u5165 STORM-BR \u7b49\u53ef\u9760\u6027\u6307\u6807\u3002", "why_notable": "\u8be5\u57fa\u51c6\u63ed\u793a\u4e86\u4f20\u7edf\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u89c6\u9891\u6a21\u578b\u5728\u8bc1\u636e\u4e0d\u8db3\u65f6\u7684\u53ef\u9760\u6027\u7f3a\u9677\uff0c\u5c24\u5176\u662f\u65e0\u6cd5\u6b63\u786e\u62d2\u7b54\u548c\u8ffd\u8e2a\u72b6\u6001\u53d8\u5316\u7684\u95ee\u9898\uff0c\u5bf9\u6784\u5efa\u53ef\u4fe1\u5728\u7ebf\u89c6\u9891\u7406\u89e3\u7cfb\u7edf\u6709\u91cd\u8981\u4ef7\u503c\u3002"}, {"abstract": "Vision-language models (VLMs) have demonstrated excellent performance in visual tasks, but their visual causal reasoning capabilities still lack reliable evaluation. Existing evaluations struggle to distinguish whether a model is performing causal reasoning based on visual evidence or relying on statistical correlations for shortcut learning, thereby potentially overestimating their actual capabilities. This paper proposes CCRV-Bench, a constraint-driven visual causal reasoning benchmark for single-image physical scenarios. We construct an orthogonal framework that evaluates four causal task dimensions: causal relation discovery, state prediction, causal diagnosis, and intervention. We further introduce entity symbolization, spatial grounding, the factual adversarial constraint, and minimalist output constraints to reduce shortcut cues while preserving the physical commonsense required by the task. Experiments across 15 multimodal models show that constraint sensitivity is task- and model-dependent: intervention has the largest average effective degradation among the four causal tasks, spatial grounding is the most damaging constraint on average, and the factual adversarial constraint improves DCR for all evaluated models. These results show that unconstrained performance does not determine constrained robustness and that a single aggregate score can obscure distinct failures in causal identification, spatial grounding, and constraint-compliant expression. CCRV-Bench provides a standardized framework for diagnosing image-grounded causal reasoning under controlled constraints. The code is available at https://github.com/0815linyuan/CCRV-Bench-Constraint-Based-Evaluation-of-Causal-Reasoning-in-Vision-Language-Models", "arxiv_id": "2609.30979", "arxiv_url": "https://arxiv.org/abs/2609.30979", "authors": ["Linyuan Gao", "Yuan Wu", "Yi Chang"], "brief": "\u8bba\u6587\u63d0\u51fa CCRV-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u5355\u56fe\u50cf\u7269\u7406\u573a\u666f\u7684\u7ea6\u675f\u9a71\u52a8\u89c6\u89c9\u56e0\u679c\u63a8\u7406\u57fa\u51c6\uff0c\u8bc4\u4f30 VLM \u662f\u5426\u771f\u6b63\u57fa\u4e8e\u89c6\u89c9\u8bc1\u636e\u8fdb\u884c\u56e0\u679c\u63a8\u7406\u3002\u5b83\u8986\u76d6\u56e0\u679c\u5173\u7cfb\u53d1\u73b0\u3001\u72b6\u6001\u9884\u6d4b\u3001\u56e0\u679c\u8bca\u65ad\u548c\u5e72\u9884\u56db\u7c7b\u4efb\u52a1\uff0c\u5e76\u901a\u8fc7\u591a\u79cd\u7ea6\u675f\u524a\u5f31\u6377\u5f84\u7ebf\u7d22\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30979", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u6b63\u4ea4\u8bc4\u6d4b\u6846\u67b6\uff0c\u8986\u76d6\u56e0\u679c\u5173\u7cfb\u53d1\u73b0\u3001\u72b6\u6001\u9884\u6d4b\u3001\u56e0\u679c\u8bca\u65ad\u3001\u5e72\u9884\u56db\u4e2a\u89c6\u89c9\u56e0\u679c\u4efb\u52a1\u7ef4\u5ea6", "\u5f15\u5165\u5b9e\u4f53\u7b26\u53f7\u5316\u3001\u7a7a\u95f4\u5b9a\u4f4d\u3001\u4e8b\u5b9e\u5bf9\u6297\u7ea6\u675f\u548c\u6781\u7b80\u8f93\u51fa\u7ea6\u675f\uff0c\u4ee5\u533a\u5206\u771f\u5b9e\u56e0\u679c\u63a8\u7406\u4e0e\u7edf\u8ba1\u76f8\u5173\u6027\u6377\u5f84", "\u572815\u4e2a\u591a\u6a21\u6001\u6a21\u578b\u4e0a\u5b9e\u9a8c\u53d1\u73b0\uff1a\u5e72\u9884\u4efb\u52a1\u53d7\u7ea6\u675f\u9000\u5316\u6700\u5927\uff0c\u7a7a\u95f4\u5b9a\u4f4d\u7ea6\u675f\u5e73\u5747\u5f71\u54cd\u6700\u5f3a\uff0c\u4e8b\u5b9e\u5bf9\u6297\u7ea6\u675f\u63d0\u5347\u6240\u6709\u6a21\u578b\u7684DCR"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u56e0\u679c\u63a8\u7406", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30979v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CCRV-Bench: Constraint-Based Evaluation of Causal Reasoning in Vision-Language Models", "tldr": "\u7528\u7ea6\u675f\u57fa\u51c6\u8bc4\u6d4bVLM\u89c6\u89c9\u56e0\u679c\u63a8\u7406\u9c81\u68d2\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CCRV-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u5355\u56fe\u50cf\u7269\u7406\u573a\u666f\u7684\u7ea6\u675f\u9a71\u52a8\u89c6\u89c9\u56e0\u679c\u63a8\u7406\u57fa\u51c6\uff0c\u8bc4\u4f30 VLM \u662f\u5426\u771f\u6b63\u57fa\u4e8e\u89c6\u89c9\u8bc1\u636e\u8fdb\u884c\u56e0\u679c\u63a8\u7406\u3002\u5b83\u8986\u76d6\u56e0\u679c\u5173\u7cfb\u53d1\u73b0\u3001\u72b6\u6001\u9884\u6d4b\u3001\u56e0\u679c\u8bca\u65ad\u548c\u5e72\u9884\u56db\u7c7b\u4efb\u52a1\uff0c\u5e76\u901a\u8fc7\u591a\u79cd\u7ea6\u675f\u524a\u5f31\u6377\u5f84\u7ebf\u7d22\u3002", "why_notable": "\u8be5\u57fa\u51c6\u6307\u51fa\u65e0\u7ea6\u675f\u9ad8\u5206\u5e76\u4e0d\u4ee3\u8868\u53d7\u63a7\u6761\u4ef6\u4e0b\u7684\u56e0\u679c\u9c81\u68d2\u6027\uff0c\u80fd\u66f4\u7ec6\u7c92\u5ea6\u66b4\u9732 VLM \u5728\u56e0\u679c\u8bc6\u522b\u3001\u7a7a\u95f4 grounding \u548c\u7ea6\u675f\u9075\u5faa\u8868\u8fbe\u4e0a\u7684\u5931\u8d25\uff0c\u5bf9\u8bc4\u4f30\u591a\u6a21\u6001\u6a21\u578b\u771f\u5b9e\u63a8\u7406\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multi-view video understanding requires integrating spatial and temporal evidence across multiple, often non-overlapping camera streams: tracking entities as they transition between viewpoints, aligning events across time, and reasoning about latent 4D continuity rather than any single visible frame. We introduce MVVBench, a benchmark for multi-view video reasoning built from real world multi camera datasets. Questions are curated to be monocular-ambiguous along both the view and the temporal axis: each question is unanswerable from any single view in the designated input set, and the majority are further unanswerable from any single moment. Each question becomes uniquely solvable only by jointly reasoning across views and across time. MVVBench spans diverse dynamic scenes and probes six capabilities: implicit/explicit attribute identification, implicit/explicit relative distance, relative camera pose, and compositional counting, with human-authored QA and rigorous verification. Beyond benchmarking, we provide an extensive analysis of when and why current vision language models succeed or fail, characterizing errors due to temporal mis-localization, cross-view identity breaks, and brittle multi-hop reasoning. We then study inference-time elicitation strategies that unlock latent multi-view competence---task-specific chain-of-thought scaffolds and structured cross-view evidence aggregation---yielding substantial gains without retraining. Finally, we present preliminary evidence that reinforcement learning with verifiable rewards can elicit some latent multi-view competence in the base model, pointing to training-time approaches as a promising direction for future work. Together, MVVBench offers a rigorous evaluation of 4D multi-view reasoning and a foundation for future progress toward reliable embodied perception.", "arxiv_id": "2609.30952", "arxiv_url": "https://arxiv.org/abs/2609.30952", "authors": ["Hyungjin Chung", "Byeongjun Park", "Joonseok Lee", "Hojun Kim", "Jaeho Choi", "Byung-Hoon Kim"], "brief": "\u8bba\u6587\u63d0\u51fa MVVBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u771f\u5b9e\u591a\u6444\u50cf\u5934\u89c6\u9891\u6570\u636e\u7684\u591a\u89c6\u89d2\u89c6\u9891\u63a8\u7406\u57fa\u51c6\u3002\u5b83\u8981\u6c42\u6a21\u578b\u8de8\u89c6\u89d2\u3001\u8de8\u65f6\u95f4\u6574\u5408\u8bc1\u636e\uff0c\u89e3\u51b3\u5355\u4e00\u89c6\u89d2\u6216\u5355\u4e00\u65f6\u523b\u65e0\u6cd5\u56de\u7b54\u7684\u95ee\u9898\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30952", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u95ee\u9898\u8bbe\u8ba1\u4e3a\u5355\u76ee\u89c6\u89d2\u548c\u5355\u65f6\u523b\u5747\u5b58\u5728\u6b67\u4e49\uff0c\u5fc5\u987b\u8054\u5408\u591a\u6444\u50cf\u5934\u89c6\u9891\u4e0e\u65f6\u95f4\u7ebf\u7d22\u624d\u80fd\u552f\u4e00\u6c42\u89e3", "\u8986\u76d6\u516d\u7c7b\u80fd\u529b\uff1a\u9690\u5f0f/\u663e\u5f0f\u5c5e\u6027\u8bc6\u522b\u3001\u9690\u5f0f/\u663e\u5f0f\u76f8\u5bf9\u8ddd\u79bb\u3001\u76f8\u673a\u76f8\u5bf9\u4f4d\u59ff\u3001\u7ec4\u5408\u8ba1\u6570", "\u5206\u6790\u5f53\u524d\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u5931\u8d25\u6a21\u5f0f\uff0c\u5305\u62ec\u65f6\u95f4\u5b9a\u4f4d\u9519\u8bef\u3001\u8de8\u89c6\u89d2\u8eab\u4efd\u65ad\u88c2\u548c\u591a\u8df3\u63a8\u7406\u8106\u5f31"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u5177\u8eab\u667a\u80fd", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30952v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MVVBench: Benchmarking 4D Reasoning in Vision-Language Models", "tldr": "\u8bc4\u6d4b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u591a\u89c6\u89d24D\u63a8\u7406\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MVVBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u771f\u5b9e\u591a\u6444\u50cf\u5934\u89c6\u9891\u6570\u636e\u7684\u591a\u89c6\u89d2\u89c6\u9891\u63a8\u7406\u57fa\u51c6\u3002\u5b83\u8981\u6c42\u6a21\u578b\u8de8\u89c6\u89d2\u3001\u8de8\u65f6\u95f4\u6574\u5408\u8bc1\u636e\uff0c\u89e3\u51b3\u5355\u4e00\u89c6\u89d2\u6216\u5355\u4e00\u65f6\u523b\u65e0\u6cd5\u56de\u7b54\u7684\u95ee\u9898\u3002", "why_notable": "MVVBench \u5c06\u8bc4\u6d4b\u91cd\u70b9\u4ece\u5355\u5e27\u6216\u5355\u89c6\u89d2\u7406\u89e3\u63a8\u8fdb\u5230\u66f4\u63a5\u8fd1\u771f\u5b9e\u5177\u8eab\u611f\u77e5\u76844D\u591a\u89c6\u89d2\u63a8\u7406\uff0c\u5e76\u5c55\u793a\u4e86\u63a8\u7406\u65f6\u94fe\u5f0f\u601d\u7ef4\u811a\u624b\u67b6\u3001\u7ed3\u6784\u5316\u8bc1\u636e\u805a\u5408\u4ee5\u53ca\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u5bf9\u63d0\u5347\u80fd\u529b\u7684\u6f5c\u529b\u3002"}, {"abstract": "Action-conditioned video world models aim to predict scene evolution under different actions, a capability that is essential for reliable planning, decision-making, and interaction in dynamic environments. However, futures generated independently from the same initial scene may each appear plausible while implying incompatible physical properties, such as friction or mass. This inconsistency can lead to contradictory predictions across interventions, making it difficult for the model to maintain a coherent understanding of the underlying world and limiting its reliability for planning and decision-making. To address these issues, we propose OneWorld, a shared-mechanism counterfactual generation framework that jointly models multiple action-conditioned futures under a common latent physical mechanism. A physical mechanism interpreter first infers a distribution over latent mechanisms from each action-outcome branch. These distributions are then aggregated into shared-world evidence, which captures whether the branches admit a common physical explanation while accounting for uncertainty in less informative branches. This evidence constrains flow training and guides sampling, encouraging consistency in the underlying physical mechanism while preserving the distinct outcomes induced by different actions. We further introduce a multi-intervention evaluation protocol in controlled environments, following the interaction settings of ACWM-Phys, to assess whether generated futures can be jointly explained by the same physical parameters, alongside standard measures of single-rollout prediction quality. Experiments in these environments show that OneWorld improves cross-intervention physical consistency while maintaining competitive single-rollout prediction quality.", "arxiv_id": "2609.30946", "arxiv_url": "https://arxiv.org/abs/2609.30946", "authors": ["Ke He", "Yichen Ding", "Bin Yang"], "brief": "\u8bba\u6587\u63d0\u51fa OneWorld\uff0c\u4e00\u4e2a\u5171\u4eab\u673a\u5236\u7684\u53cd\u4e8b\u5b9e\u751f\u6210\u6846\u67b6\uff0c\u7528\u540c\u4e00\u6f5c\u5728\u7269\u7406\u673a\u5236\u8054\u5408\u5efa\u6a21\u540c\u4e00\u521d\u59cb\u573a\u666f\u4e0b\u7684\u591a\u4e2a\u52a8\u4f5c\u6761\u4ef6\u672a\u6765\u3002\u5b83\u901a\u8fc7\u63a8\u65ad\u5e76\u805a\u5408\u5404\u5206\u652f\u7684\u7269\u7406\u673a\u5236\u8bc1\u636e\uff0c\u7ea6\u675f\u751f\u6210\u8fc7\u7a0b\uff0c\u4f7f\u4e0d\u540c\u52a8\u4f5c\u7ed3\u679c\u867d\u4e0d\u540c\u4f46\u9075\u5faa\u4e00\u81f4\u7684\u6469\u64e6\u3001\u8d28\u91cf\u7b49\u7269\u7406\u5c5e\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30946", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u7269\u7406\u673a\u5236\u89e3\u91ca\u5668\uff0c\u4ece\u6bcf\u4e2a\u52a8\u4f5c-\u7ed3\u679c\u5206\u652f\u63a8\u65ad\u6f5c\u5728\u7269\u7406\u673a\u5236\u5206\u5e03\u3002", "\u5c06\u591a\u5206\u652f\u673a\u5236\u5206\u5e03\u805a\u5408\u4e3a\u5171\u4eab\u4e16\u754c\u8bc1\u636e\uff0c\u7528\u4e8e\u5224\u65ad\u8fd9\u4e9b\u672a\u6765\u662f\u5426\u53ef\u7531\u540c\u4e00\u7269\u7406\u89e3\u91ca\u652f\u6301\u3002", "\u63d0\u51fa\u591a\u5e72\u9884\u8bc4\u6d4b\u534f\u8bae\uff0c\u5728\u53d7\u63a7\u73af\u5883\u4e2d\u540c\u65f6\u8bc4\u4f30\u8de8\u52a8\u4f5c\u7269\u7406\u4e00\u81f4\u6027\u4e0e\u5355\u6b21\u9884\u6d4b\u8d28\u91cf\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u7269\u7406\u4e00\u81f4\u6027", "\u53cd\u4e8b\u5b9e\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30946v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "OneWorld: Learning Consistent Physics Across Actions in World Models", "tldr": "\u8ba9\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5728\u591a\u52a8\u4f5c\u672a\u6765\u4e2d\u4fdd\u6301\u7269\u7406\u4e00\u81f4\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OneWorld\uff0c\u4e00\u4e2a\u5171\u4eab\u673a\u5236\u7684\u53cd\u4e8b\u5b9e\u751f\u6210\u6846\u67b6\uff0c\u7528\u540c\u4e00\u6f5c\u5728\u7269\u7406\u673a\u5236\u8054\u5408\u5efa\u6a21\u540c\u4e00\u521d\u59cb\u573a\u666f\u4e0b\u7684\u591a\u4e2a\u52a8\u4f5c\u6761\u4ef6\u672a\u6765\u3002\u5b83\u901a\u8fc7\u63a8\u65ad\u5e76\u805a\u5408\u5404\u5206\u652f\u7684\u7269\u7406\u673a\u5236\u8bc1\u636e\uff0c\u7ea6\u675f\u751f\u6210\u8fc7\u7a0b\uff0c\u4f7f\u4e0d\u540c\u52a8\u4f5c\u7ed3\u679c\u867d\u4e0d\u540c\u4f46\u9075\u5faa\u4e00\u81f4\u7684\u6469\u64e6\u3001\u8d28\u91cf\u7b49\u7269\u7406\u5c5e\u6027\u3002", "why_notable": "\u73b0\u6709\u52a8\u4f5c\u6761\u4ef6\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5e38\u72ec\u7acb\u751f\u6210\u4e0d\u540c\u672a\u6765\uff0c\u53ef\u80fd\u4ea7\u751f\u4e92\u76f8\u77db\u76fe\u7684\u7269\u7406\u5047\u8bbe\uff1bOneWorld \u9762\u5411\u89c4\u5212\u4e0e\u51b3\u7b56\u4e2d\u7684\u53ef\u9760\u6027\u95ee\u9898\uff0c\u63d0\u5347\u4e86\u8de8\u5e72\u9884\u9884\u6d4b\u7684\u4e00\u81f4\u6027\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u597d\u7684\u5355 rollout \u8d28\u91cf\u3002"}, {"abstract": "Reasoning segmentation aims to interpret implicit textual queries and enable fine-grained visual perception, which is critical for applications such as human-computer interaction and embodied agents. Existing methods typically generate explicit Chain-of-Thought (CoT) by multimodal large language models (MLLMs) before localizing the target. Although intuitive, such explicit verbal reasoning introduces substantial attention interference: redundant textual tokens disrupt attention during perception-token generation and also increase the effective distance between visual tokens. To address this issue, we propose LIRSeg, which fully replaces explicit CoT with a compact set of learnable latent tokens for reasoning segmentation. LIRSeg is trained in two stages: spatial alignment grounds the latent tokens in object-relevant visual evidence, and GRPO further optimizes them with segmentation rewards. To make these compact latent tokens more informative, we introduce three complementary mechanisms from an information perspective: extreme-advantage sampling for selecting informative training signals, decoupled exploration-stability updates for learning complementary representations, and latent diversity amplification for preventing representational collapse. Extensive experiments on benchmarks demonstrate that LIRSeg consistently improves both segmentation accuracy and reasoning efficiency. Compared with the VisionReasoner baseline, LIRSeg achieves absolute gIoU improvements of 4.9% on ReasonSeg, 7.1% on MUSE, and 4.7% on MMR, while achieving a approximately 16x reduction in reasoning tokens. Code is available in supplementary materials.", "arxiv_id": "2609.30783", "arxiv_url": "https://arxiv.org/abs/2609.30783", "authors": ["Tianhang Guo", "Yulin He", "Wei Chen", "Wenjuan Zhou", "Yuhang Li", "Xinbiao Gan"], "brief": "\u8bba\u6587\u63d0\u51fa LIRSeg\uff0c\u7528\u5c11\u91cf\u53ef\u5b66\u4e60\u6f5c\u5728\u4ee4\u724c\u5b8c\u5168\u66ff\u4ee3\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u7684\u663e\u5f0f Chain-of-Thought\uff0c\u7528\u4e8e\u9690\u5f0f\u6587\u672c\u67e5\u8be2\u4e0b\u7684\u63a8\u7406\u5206\u5272\u3002\u5b83\u901a\u8fc7\u7a7a\u95f4\u5bf9\u9f50\u548c\u57fa\u4e8e GRPO \u7684\u5206\u5272\u5956\u52b1\u4f18\u5316\uff0c\u8ba9\u6f5c\u5728\u4ee4\u724c\u627f\u8f7d\u89c6\u89c9\u63a8\u7406\u4fe1\u606f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30783", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u663e\u5f0f\u6587\u672c CoT \u4f1a\u5f15\u5165\u6ce8\u610f\u529b\u5e72\u6270\uff1a\u5197\u4f59\u6587\u5b57\u4ee4\u724c\u5f71\u54cd\u611f\u77e5\u4ee4\u724c\u751f\u6210\uff0c\u5e76\u62c9\u5927\u89c6\u89c9\u4ee4\u724c\u95f4\u6709\u6548\u8ddd\u79bb\u3002", "\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u5148\u5c06\u6f5c\u5728\u4ee4\u724c\u4e0e\u76ee\u6807\u76f8\u5173\u89c6\u89c9\u8bc1\u636e\u7a7a\u95f4\u5bf9\u9f50\uff0c\u518d\u7528 GRPO \u6839\u636e\u5206\u5272\u5956\u52b1\u8fdb\u4e00\u6b65\u4f18\u5316\u3002", "\u5728 ReasonSeg\u3001MUSE\u3001MMR \u4e0a\u76f8\u5bf9 VisionReasoner \u5206\u522b\u63d0\u5347 gIoU 4.9%\u30017.1%\u30014.7%\uff0c\u540c\u65f6\u63a8\u7406\u4ee4\u724c\u51cf\u5c11\u7ea6 16 \u500d\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u63a8\u7406\u5206\u5272", "\u6f5c\u5728\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30783v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Skip the Talk, Re-Focus on Vision: Latent Reasoning for Reasoning Segmentation in Multimodal Large Language Models", "tldr": "\u7528\u6f5c\u5728\u4ee4\u724c\u66ff\u4ee3CoT\u63d0\u5347\u63a8\u7406\u5206\u5272", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LIRSeg\uff0c\u7528\u5c11\u91cf\u53ef\u5b66\u4e60\u6f5c\u5728\u4ee4\u724c\u5b8c\u5168\u66ff\u4ee3\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u7684\u663e\u5f0f Chain-of-Thought\uff0c\u7528\u4e8e\u9690\u5f0f\u6587\u672c\u67e5\u8be2\u4e0b\u7684\u63a8\u7406\u5206\u5272\u3002\u5b83\u901a\u8fc7\u7a7a\u95f4\u5bf9\u9f50\u548c\u57fa\u4e8e GRPO \u7684\u5206\u5272\u5956\u52b1\u4f18\u5316\uff0c\u8ba9\u6f5c\u5728\u4ee4\u724c\u627f\u8f7d\u89c6\u89c9\u63a8\u7406\u4fe1\u606f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u663e\u5f0f\u8bed\u8a00\u63a8\u7406\u6709\u52a9\u4e8e\u89c6\u89c9\u5b9a\u4f4d\u201d\u7684\u5e38\u89c1\u8303\u5f0f\uff0c\u8bc1\u660e\u7d27\u51d1\u6f5c\u5728\u63a8\u7406\u53ef\u540c\u65f6\u63d0\u5347\u5206\u5272\u7cbe\u5ea6\u4e0e\u63a8\u7406\u6548\u7387\uff0c\u5bf9\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u9ad8\u6548\u89c6\u89c9\u63a8\u7406\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Distributionally robust optimization (DRO) provides a principled framework for learning under distribution shift, but its practical use is hindered by the difficulty of evaluating worst-case risks for nonconvex loss functions. We study a penalized DRO formulation in which the adversary may choose any distribution but incurs a Wasserstein penalty for deviating from the empirical distribution. We show that the adversary\u0027s problem can be reformulated as an optimization problem over transport maps that push empirical samples to adversarial ones, and we prove that optimal maps are cyclically monotone. We also show that standard adversarial training---based on per-sample local optimization---violates cyclical monotonicity and wastes transport costs unless the adversary is severely restricted. We propose two remedies. First, we introduce multi-start particle ascent, which alternates parallel gradient ascent with reassignment to enforce cyclical monotonicity across samples. Second, we parameterize adversarial maps as gradients of input-convex neural networks, which guarantees cyclical monotonicity by construction. Experiments on robust regression, image classification, and robust control show that our methods consistently outperform standard adversarial training and state-of-the-art baselines, achieving improved robustness and better generalization under distribution shift.", "arxiv_id": "2609.31363", "arxiv_url": "https://arxiv.org/abs/2609.31363", "authors": ["Alireza Abdollahpoorrostam", "Ehsan Sharifian", "Buse \u015een", "Marco Cuturi", "Daniel Kuhn"], "brief": "\u672c\u6587\u7814\u7a76\u5e26 Wasserstein \u60e9\u7f5a\u7684\u5206\u5e03\u9c81\u68d2\u4f18\u5316\uff0c\u5c06\u5bf9\u6297\u5206\u5e03\u641c\u7d22\u6539\u5199\u4e3a\u7ecf\u9a8c\u6837\u672c\u5230\u5bf9\u6297\u6837\u672c\u7684\u4f20\u8f93\u6620\u5c04\u4f18\u5316\uff0c\u5e76\u8bc1\u660e\u6700\u4f18\u6620\u5c04\u5177\u6709\u5faa\u73af\u5355\u8c03\u6027\u3002\u57fa\u4e8e\u8fd9\u4e00\u51e0\u4f55\u7ed3\u6784\uff0c\u63d0\u51fa\u591a\u8d77\u70b9\u7c92\u5b50\u4e0a\u5347\u548c\u8f93\u5165\u51f8\u795e\u7ecf\u7f51\u7edc\u6620\u5c04\u4e24\u7c7b\u8bad\u7ec3\u65b9\u6cd5\u3002", "categories": ["cs.LG", "math.OC", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31363", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u660e\u60e9\u7f5a\u578b DRO \u4e2d\u5bf9\u6297\u8005\u7684\u6700\u4f18\u4f20\u8f93\u6620\u5c04\u6ee1\u8db3\u5faa\u73af\u5355\u8c03\u6027\uff0c\u8fde\u63a5 Brenier \u7406\u8bba\u4e0e\u5bf9\u6297\u8bad\u7ec3\u3002", "\u6307\u51fa\u6807\u51c6\u9010\u6837\u672c\u5c40\u90e8\u5bf9\u6297\u8bad\u7ec3\u901a\u5e38\u8fdd\u53cd\u5faa\u73af\u5355\u8c03\u6027\uff0c\u4f1a\u6d6a\u8d39 Wasserstein \u4f20\u8f93\u6210\u672c\uff0c\u9664\u975e\u5bf9\u6297\u7a7a\u95f4\u88ab\u4e25\u683c\u9650\u5236\u3002", "\u63d0\u51fa\u591a\u8d77\u70b9\u7c92\u5b50\u4e0a\u5347\u4e0e\u57fa\u4e8e\u8f93\u5165\u51f8\u795e\u7ecf\u7f51\u7edc\u7684\u5bf9\u6297\u6620\u5c04\uff0c\u5728\u9c81\u68d2\u56de\u5f52\u3001\u56fe\u50cf\u5206\u7c7b\u548c\u9c81\u68d2\u63a7\u5236\u4e2d\u4f18\u4e8e\u73b0\u6709\u57fa\u7ebf\u3002"], "keywords": ["\u5206\u5e03\u9c81\u68d2\u4f18\u5316", "\u6700\u4f18\u4f20\u8f93", "\u5bf9\u6297\u8bad\u7ec3", "\u9c81\u68d2\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31363v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Brenier Meets Adversarial Training: Optimal Transport Geometry for Robust Learning", "tldr": "\u7528\u6700\u4f18\u4f20\u8f93\u6539\u8fdb\u5206\u5e03\u9c81\u68d2\u8bad\u7ec3", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5e26 Wasserstein \u60e9\u7f5a\u7684\u5206\u5e03\u9c81\u68d2\u4f18\u5316\uff0c\u5c06\u5bf9\u6297\u5206\u5e03\u641c\u7d22\u6539\u5199\u4e3a\u7ecf\u9a8c\u6837\u672c\u5230\u5bf9\u6297\u6837\u672c\u7684\u4f20\u8f93\u6620\u5c04\u4f18\u5316\uff0c\u5e76\u8bc1\u660e\u6700\u4f18\u6620\u5c04\u5177\u6709\u5faa\u73af\u5355\u8c03\u6027\u3002\u57fa\u4e8e\u8fd9\u4e00\u51e0\u4f55\u7ed3\u6784\uff0c\u63d0\u51fa\u591a\u8d77\u70b9\u7c92\u5b50\u4e0a\u5347\u548c\u8f93\u5165\u51f8\u795e\u7ecf\u7f51\u7edc\u6620\u5c04\u4e24\u7c7b\u8bad\u7ec3\u65b9\u6cd5\u3002", "why_notable": "\u5b83\u4e3a\u5bf9\u6297\u8bad\u7ec3\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u6700\u4f18\u4f20\u8f93\u51e0\u4f55\u89e3\u91ca\uff0c\u5e76\u5c06\u7406\u8bba\u7ea6\u675f\u8f6c\u5316\u4e3a\u53ef\u5b9e\u73b0\u7b97\u6cd5\uff0c\u6709\u671b\u63d0\u5347\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u9c81\u68d2\u6027\u4e0e\u6cdb\u5316\u8868\u73b0\u3002"}, {"abstract": "Time-series carry structure simultaneously at multiple scales (fine-grained variation, mid-range motifs, and global properties) and downstream tasks operate at correspondingly different scales. Most existing self-supervised learning approaches supervise representations globally via instance-level contrastive losses and limited temporal neighborhood supervision, but do not explicitly exploit the structural hierarchy. We propose a learning framework that explicitly enforces a structural hierarchy across three scales independently: a local objective for token continuity, a mid-range objective for window-level motifs, and a global objective for sequence-level agreement. Realizing this framework requires the backbone to expose a representation at each scale; we introduce \\textbf{Progressive Memory Transformer} (PMT), which augments a transformer with writable, window-aligned memory that exposes the mid-range scale alongside the token and sequence-level representations conventional transformers already provide. Across seven UCR/UEA/UCI classification benchmarks, a cue-retention probe, and forecasting benchmarks, PMT learns representations that probe well at the global, mid-range, and local scales---strong low-label classification (1--5\\% labels), competitive forecasting performance across multiple horizons, and quantitative and qualitative evidence that memory states capture mid-range motifs.", "arxiv_id": "2609.31351", "arxiv_url": "https://arxiv.org/abs/2609.31351", "authors": ["Tord Sture Stangeland", "Andreas K\u00f6hler", "Steffen M\u00e6land", "Ad\u00edn Ram\u00edres Rivera"], "brief": "\u8bba\u6587\u63d0\u51fa Progressive Memory Transformer\uff08PMT\uff09\uff0c\u5728 Transformer \u4e2d\u52a0\u5165\u4e0e\u65f6\u95f4\u7a97\u53e3\u5bf9\u9f50\u7684\u53ef\u5199\u8bb0\u5fc6\uff0c\u4f7f\u6a21\u578b\u540c\u65f6\u66b4\u9732\u5c40\u90e8 token\u3001\u4e2d\u7a0b\u7a97\u53e3\u548c\u5168\u5c40\u5e8f\u5217\u8868\u793a\u3002\u5176\u81ea\u76d1\u7763\u6846\u67b6\u5206\u522b\u7ea6\u675f token \u8fde\u7eed\u6027\u3001\u7a97\u53e3\u7ea7 motif \u548c\u5e8f\u5217\u7ea7\u4e00\u81f4\u6027\uff0c\u4ee5\u663e\u5f0f\u5b66\u4e60\u65f6\u95f4\u5e8f\u5217\u7684\u5c42\u7ea7\u7ed3\u6784\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31351", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bbe\u8ba1\u4e09\u5c3a\u5ea6\u81ea\u76d1\u7763\u76ee\u6807\uff1a\u5c40\u90e8\u8fde\u7eed\u6027\u3001\u4e2d\u7a0b\u7a97\u53e3 motif\u3001\u5168\u5c40\u5e8f\u5217\u4e00\u81f4\u6027\uff0c\u907f\u514d\u4ec5\u4f9d\u8d56\u5b9e\u4f8b\u7ea7\u5bf9\u6bd4\u5b66\u4e60\u3002", "PMT \u901a\u8fc7 window-aligned memory \u6355\u83b7\u4e2d\u7a0b\u7ed3\u6784\uff0c\u8865\u8db3\u5e38\u89c4 Transformer \u7f3a\u4e4f\u663e\u5f0f\u4e2d\u5c3a\u5ea6\u8868\u793a\u7684\u95ee\u9898\u3002", "\u5728 7 \u4e2a UCR/UEA/UCI \u5206\u7c7b\u57fa\u51c6\u3001\u7ebf\u7d22\u4fdd\u7559\u63a2\u9488\u548c\u9884\u6d4b\u4efb\u52a1\u4e0a\u9a8c\u8bc1\uff0c\u4f4e\u6807\u7b7e\u5206\u7c7b\u548c\u591a\u6b65\u9884\u6d4b\u8868\u73b0\u5177\u6709\u7ade\u4e89\u529b\u3002"], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u81ea\u76d1\u7763\u5b66\u4e60", "Transformer", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31351v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Progressive Memory Transformer: Memory-Aware Attention for Time-Series", "tldr": "\u7528\u53ef\u5199\u8bb0\u5fc6\u5efa\u6a21\u65f6\u95f4\u5e8f\u5217\u591a\u5c3a\u5ea6\u7ed3\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Progressive Memory Transformer\uff08PMT\uff09\uff0c\u5728 Transformer \u4e2d\u52a0\u5165\u4e0e\u65f6\u95f4\u7a97\u53e3\u5bf9\u9f50\u7684\u53ef\u5199\u8bb0\u5fc6\uff0c\u4f7f\u6a21\u578b\u540c\u65f6\u66b4\u9732\u5c40\u90e8 token\u3001\u4e2d\u7a0b\u7a97\u53e3\u548c\u5168\u5c40\u5e8f\u5217\u8868\u793a\u3002\u5176\u81ea\u76d1\u7763\u6846\u67b6\u5206\u522b\u7ea6\u675f token \u8fde\u7eed\u6027\u3001\u7a97\u53e3\u7ea7 motif \u548c\u5e8f\u5217\u7ea7\u4e00\u81f4\u6027\uff0c\u4ee5\u663e\u5f0f\u5b66\u4e60\u65f6\u95f4\u5e8f\u5217\u7684\u5c42\u7ea7\u7ed3\u6784\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u65f6\u95f4\u5e8f\u5217\u4e2d\u7684\u591a\u5c3a\u5ea6\u7ed3\u6784\u663e\u5f0f\u7eb3\u5165\u8868\u5f81\u5b66\u4e60\u76ee\u6807\u548c\u6a21\u578b\u67b6\u6784\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u4f4e\u6807\u6ce8\u573a\u666f\u4e0b\u7684\u5206\u7c7b\u3001\u9884\u6d4b\u53ca\u4e2d\u7a0b\u6a21\u5f0f\u89e3\u91ca\u80fd\u529b\uff0c\u5bf9\u901a\u7528\u65f6\u95f4\u5e8f\u5217\u8868\u5f81\u5b66\u4e60\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Morphology--control co-design jointly optimizes an agent\u0027s body structure and control policy as an integrated embodied system. However, existing methods typically model morphology design and control with separate networks coupled only indirectly through a shared task objective, limiting explicit high-level coordination. Inspired by natural genes that coordinate biological development, we introduce \\textbf{Morphogene}, a compact latent blueprint that bridges an agent\u0027s body and brain. Through AdaConcat, Morphogene jointly conditions morphology and control generation at the limb level, allowing its variations to induce coordinated changes in both components. Building on this representation, we propose \\textbf{GeCode}, which formulates co-design as exploration in the compact Morphogene space. Each Morphogene anchors a local design region in which nearby body--brain designs are explored, while performance-guided updates move these anchors toward promising regions for more efficient exploration of the broader design space. This process combines local refinement with global exploration while preserving body--brain compatibility. Extensive experiments across diverse 2D and 3D co-design tasks demonstrate that GeCode consistently outperforms existing state-of-the-art methods, achieving substantially faster convergence and higher final performance.", "arxiv_id": "2609.31329", "arxiv_url": "https://arxiv.org/abs/2609.31329", "authors": ["Fu Feng", "Ruixiao Shi", "Yucheng Xie", "Jing Wang", "Xin Geng"], "brief": "\u8bba\u6587\u63d0\u51fa Morphogene\uff0c\u4e00\u79cd\u7d27\u51d1\u7684\u201c\u57fa\u56e0\u201d\u6f5c\u5728\u84dd\u56fe\uff0c\u7528\u4e8e\u5728\u80a2\u4f53\u5c42\u9762\u540c\u65f6\u6761\u4ef6\u5316\u667a\u80fd\u4f53\u5f62\u6001\u751f\u6210\u4e0e\u63a7\u5236\u7b56\u7565\u751f\u6210\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa GeCode\uff0c\u5c06\u5f62\u6001\u2014\u63a7\u5236\u534f\u540c\u8bbe\u8ba1\u8f6c\u5316\u4e3a\u5728 Morphogene \u7a7a\u95f4\u4e2d\u7684\u9ad8\u6548\u63a2\u7d22\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31329", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Morphogene \u901a\u8fc7 AdaConcat \u663e\u5f0f\u8fde\u63a5\u8eab\u4f53\u7ed3\u6784\u4e0e\u63a7\u5236\u7b56\u7565\uff0c\u4f7f\u6f5c\u53d8\u91cf\u53d8\u5316\u80fd\u8bf1\u5bfc\u4e8c\u8005\u534f\u8c03\u6539\u53d8\u3002", "GeCode \u8ba9\u6bcf\u4e2a Morphogene \u951a\u5b9a\u4e00\u4e2a\u5c40\u90e8\u8bbe\u8ba1\u533a\u57df\uff0c\u5e76\u7ed3\u5408\u6027\u80fd\u53cd\u9988\u66f4\u65b0\u951a\u70b9\uff0c\u5b9e\u73b0\u5c40\u90e8\u4f18\u5316\u4e0e\u5168\u5c40\u63a2\u7d22\u517c\u987e\u3002", "\u5728\u591a\u79cd 2D \u548c 3D \u5f62\u6001\u2014\u63a7\u5236\u534f\u540c\u8bbe\u8ba1\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u6536\u655b\u66f4\u5feb\u3001\u6700\u7ec8\u6027\u80fd\u66f4\u9ad8\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba\u8bbe\u8ba1", "\u534f\u540c\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31329v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Bridging Body and Brain: Gene-Driven Morphology--Control Co-Design", "tldr": "\u7528\u57fa\u56e0\u5f0f\u6f5c\u53d8\u91cf\u534f\u540c\u8bbe\u8ba1\u8eab\u4f53\u4e0e\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Morphogene\uff0c\u4e00\u79cd\u7d27\u51d1\u7684\u201c\u57fa\u56e0\u201d\u6f5c\u5728\u84dd\u56fe\uff0c\u7528\u4e8e\u5728\u80a2\u4f53\u5c42\u9762\u540c\u65f6\u6761\u4ef6\u5316\u667a\u80fd\u4f53\u5f62\u6001\u751f\u6210\u4e0e\u63a7\u5236\u7b56\u7565\u751f\u6210\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa GeCode\uff0c\u5c06\u5f62\u6001\u2014\u63a7\u5236\u534f\u540c\u8bbe\u8ba1\u8f6c\u5316\u4e3a\u5728 Morphogene \u7a7a\u95f4\u4e2d\u7684\u9ad8\u6548\u63a2\u7d22\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7528\u7edf\u4e00\u6f5c\u53d8\u91cf\u66ff\u4ee3\u4ee5\u5f80\u5f62\u6001\u7f51\u7edc\u4e0e\u63a7\u5236\u7f51\u7edc\u7684\u677e\u8026\u5408\u4f18\u5316\uff0c\u66f4\u76f4\u63a5\u5730\u5efa\u6a21\u201c\u8eab\u4f53\u2014\u5927\u8111\u201d\u517c\u5bb9\u6027\uff0c\u6709\u671b\u63d0\u5347\u5177\u8eab\u667a\u80fd\u4f53\u3001\u673a\u5668\u4eba\u81ea\u52a8\u8bbe\u8ba1\u548c\u8fdb\u5316\u5f0f\u5f3a\u5316\u5b66\u4e60\u7684\u641c\u7d22\u6548\u7387\u4e0e\u6027\u80fd\u3002"}, {"abstract": "Continual spatio-temporal forecasting supports traffic management and environmental monitoring under evolving dynamics and expanding sensor networks. However, conventional graph-based continual learning methods tie forecasting representations to the current sensor layout, so sensor expansion can alter the representation of learned spatial relationships. Our key insight is that sensor expansion changes the evidence available about a process without necessarily changing the dynamics to be learned. We propose STFO (Spatio-Temporal Field Operator), which parameterizes forecasting knowledge as a shared field-evolution operator and handles changing sensor layouts through observation and query interfaces. Normalized coordinate-based aggregation lifts irregular sensor histories onto a fixed latent grid, enabling reuse of learned spatial maps across observation sets without sensor-specific parameters. To accommodate process drift, a spectral descriptor summarizes variation across spatial scales and conditions Fourier propagation and attention to adapt operator responses to the current spatial regime. Coordinate-based decoding queries the evolved field at sensor locations and combines spatial corrections with local-history predictions. Experiments on PEMS-Stream, CA-Stream, and AIR-Stream demonstrate state-of-the-art average forecasting performance. STFO-Large reduces average MAE over DOL by 8.4% on PEMS-Stream and 4.7% on CA-Stream. Our code is available at https://github.com/Xielewei/Spatio-Temporal-Field-Operator.", "arxiv_id": "2609.31325", "arxiv_url": "https://arxiv.org/abs/2609.31325", "authors": ["Lewei Xie", "Haoyu Zhang", "Jiajun Zhou", "Yulong Chen", "Guanxing Chen", "Yu-An Huang", "Hau-San Wong", "Yifan Zhang", "Zhi-An Huang"], "brief": "\u8bba\u6587\u63d0\u51fa STFO\uff08Spatio-Temporal Field Operator\uff09\uff0c\u5c06\u6301\u7eed\u65f6\u7a7a\u9884\u6d4b\u77e5\u8bc6\u53c2\u6570\u5316\u4e3a\u5171\u4eab\u7684\u573a\u6f14\u5316\u7b97\u5b50\uff0c\u800c\u4e0d\u662f\u7ed1\u5b9a\u5230\u56fa\u5b9a\u4f20\u611f\u5668\u56fe\u7ed3\u6784\u3002\u5b83\u901a\u8fc7\u89c2\u6d4b\u4e0e\u67e5\u8be2\u63a5\u53e3\u9002\u914d\u4e0d\u65ad\u53d8\u5316\u7684\u4f20\u611f\u5668\u5e03\u5c40\uff0c\u5e76\u5728\u4ea4\u901a\u3001\u7a7a\u6c14\u8d28\u91cf\u7b49\u6d41\u5f0f\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u9886\u5148\u7ed3\u679c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31325", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u5f52\u4e00\u5316\u5750\u6807\u805a\u5408\u628a\u4e0d\u89c4\u5219\u4f20\u611f\u5668\u5386\u53f2\u6620\u5c04\u5230\u56fa\u5b9a\u6f5c\u5728\u7f51\u683c\uff0c\u907f\u514d\u4e3a\u65b0\u589e\u4f20\u611f\u5668\u5f15\u5165\u7279\u5b9a\u53c2\u6570\u3002", "\u5f15\u5165\u8c31\u63cf\u8ff0\u7b26\u523b\u753b\u4e0d\u540c\u7a7a\u95f4\u5c3a\u5ea6\u548c\u72b6\u6001\u4e0b\u7684\u8fc7\u7a0b\u6f02\u79fb\uff0c\u5e76\u8c03\u5236\u5085\u91cc\u53f6\u4f20\u64ad\u4e0e\u6ce8\u610f\u529b\u6a21\u5757\u3002", "\u5750\u6807\u89e3\u7801\u53ef\u5728\u4efb\u610f\u4f20\u611f\u5668\u4f4d\u7f6e\u67e5\u8be2\u6f14\u5316\u540e\u7684\u573a\uff0c\u7ed3\u5408\u7a7a\u95f4\u4fee\u6b63\u4e0e\u672c\u5730\u5386\u53f2\u9884\u6d4b\u63d0\u5347\u7cbe\u5ea6\u3002"], "keywords": ["\u65f6\u7a7a\u9884\u6d4b", "\u6301\u7eed\u5b66\u4e60", "\u795e\u7ecf\u7b97\u5b50", "\u4f20\u611f\u5668\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31325v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "More Sensors Only One Field: Rethinking Continual Spatio-Temporal Forecasting", "tldr": "\u7528\u573a\u7b97\u5b50\u89e3\u8026\u4f20\u611f\u5668\u6269\u5c55\u4e0e\u65f6\u7a7a\u9884\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa STFO\uff08Spatio-Temporal Field Operator\uff09\uff0c\u5c06\u6301\u7eed\u65f6\u7a7a\u9884\u6d4b\u77e5\u8bc6\u53c2\u6570\u5316\u4e3a\u5171\u4eab\u7684\u573a\u6f14\u5316\u7b97\u5b50\uff0c\u800c\u4e0d\u662f\u7ed1\u5b9a\u5230\u56fa\u5b9a\u4f20\u611f\u5668\u56fe\u7ed3\u6784\u3002\u5b83\u901a\u8fc7\u89c2\u6d4b\u4e0e\u67e5\u8be2\u63a5\u53e3\u9002\u914d\u4e0d\u65ad\u53d8\u5316\u7684\u4f20\u611f\u5668\u5e03\u5c40\uff0c\u5e76\u5728\u4ea4\u901a\u3001\u7a7a\u6c14\u8d28\u91cf\u7b49\u6d41\u5f0f\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u9886\u5148\u7ed3\u679c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u91cd\u65b0\u601d\u8003\u4e86\u6301\u7eed\u65f6\u7a7a\u9884\u6d4b\u4e2d\u7684\u4f20\u611f\u5668\u6269\u5c55\u95ee\u9898\uff1a\u65b0\u589e\u4f20\u611f\u5668\u53ea\u662f\u589e\u52a0\u89c2\u6d4b\u8bc1\u636e\uff0c\u4e0d\u4e00\u5b9a\u6539\u53d8\u5e95\u5c42\u52a8\u529b\u5b66\u3002\u76f8\u6bd4\u4f20\u7edf\u56fe\u6301\u7eed\u5b66\u4e60\u66f4\u5177\u5e03\u5c40\u6cdb\u5316\u80fd\u529b\uff0c\u5728 PEMS-Stream\u3001CA-Stream\u3001AIR-Stream \u4e0a\u8fbe\u5230 SOTA\uff0c\u5e76\u663e\u8457\u964d\u4f4e MAE\u3002"}, {"abstract": "Unobserved common causes are pervasive in real-world time series and can induce spurious associations that causal discovery methods mistake for direct edges. We propose LUCID (Learning Under Confounding for Inference and Discovery, a regime-adaptive deconfounding layer that first estimates the confounding regime from data using a Mar\u010denko--Pastur spectral router, then applies a deconfounding strategy matched to that regime. When the spectrum indicates pervasive factor confounding, LUCID attenuates factor-dominated variation and recovers contemporaneous (lag-$0$) structure from the resulting innovations, with edge selection calibrated against a data-driven edge-free null. Rather than being tied to a particular discovery algorithm, it can wrap existing discovery engines; we demonstrate consistent improvements across three such methods. On a diverse synthetic out-of-distribution benchmark spanning changes in confounder strength and sparsity, loading density, lag structure, volatility dynamics, edge heterogeneity, persistence, intermittency, and tail behavior, LUCID achieves the best family-weighted directed, lag-resolved graph $F_1$ ($0.60$), improving over the strongest baseline by $0.19$ absolute ($\\approx\\!46\\%$ relative). Its advantage widens relative to looser lag-collapsed scoring, and remains robust under intermittent and heavy-tailed confounding. Code reproducing the method, the benchmark generators, and every reported experiment is available at https://github.com/bloomberg/causal-ts.", "arxiv_id": "2609.31315", "arxiv_url": "https://arxiv.org/abs/2609.31315", "authors": ["Mohammad Fesanghary"], "brief": "\u8bba\u6587\u63d0\u51fa LUCID\uff0c\u4e00\u4e2a\u7528\u4e8e\u65f6\u95f4\u5e8f\u5217\u56e0\u679c\u63a8\u65ad\u4e0e\u53d1\u73b0\u7684\u81ea\u9002\u5e94\u53bb\u6df7\u6742\u5c42\u3002\u5b83\u5148\u7528 Mar\u010denko\u2013Pastur \u8c31\u8def\u7531\u5668\u5224\u65ad\u672a\u89c2\u6d4b\u6df7\u6742\u7684\u7c7b\u578b\uff0c\u518d\u9009\u62e9\u5339\u914d\u7684\u53bb\u6df7\u6742\u7b56\u7565\uff0c\u5e76\u53ef\u4f5c\u4e3a\u5916\u5c42\u6a21\u5757\u63a5\u5165\u73b0\u6709\u56e0\u679c\u53d1\u73b0\u7b97\u6cd5\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31315", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u666e\u904d\u5b58\u5728\u7684\u672a\u89c2\u6d4b\u5171\u540c\u539f\u56e0\uff0c\u51cf\u5c11\u56e0\u679c\u53d1\u73b0\u4e2d\u5c06\u865a\u5047\u76f8\u5173\u8bef\u5224\u4e3a\u76f4\u63a5\u8fb9\u7684\u95ee\u9898", "\u5728\u56e0\u5b50\u578b\u6df7\u6742\u573a\u666f\u4e0b\u6291\u5236\u56e0\u5b50\u4e3b\u5bfc\u53d8\u5316\uff0c\u4ece\u521b\u65b0\u9879\u4e2d\u6062\u590d\u540c\u65f6\u523b\uff08lag-0\uff09\u7ed3\u6784\uff0c\u5e76\u7528\u6570\u636e\u9a71\u52a8\u7684\u65e0\u8fb9\u7a7a\u6a21\u578b\u6821\u51c6\u8fb9\u9009\u62e9", "\u5728\u8986\u76d6\u6df7\u6742\u5f3a\u5ea6\u3001\u7a00\u758f\u6027\u3001\u6ede\u540e\u7ed3\u6784\u3001\u6ce2\u52a8\u6027\u3001\u91cd\u5c3e\u4e0e\u95f4\u6b47\u6df7\u6742\u7b49\u53d8\u5316\u7684\u5408\u6210 OOD \u57fa\u51c6\u4e0a\uff0clag-resolved \u56fe F1 \u8fbe\u5230 0.60\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347\u7ea6 46%"], "keywords": ["\u56e0\u679c\u53d1\u73b0", "\u65f6\u95f4\u5e8f\u5217", "\u53bb\u6df7\u6742", "\u7edf\u8ba1\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31315v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LUCID: Learning Under Confounding for Inference and Discovery in Time Series", "tldr": "\u81ea\u9002\u5e94\u53bb\u6df7\u6742\u63d0\u5347\u65f6\u95f4\u5e8f\u5217\u56e0\u679c\u53d1\u73b0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LUCID\uff0c\u4e00\u4e2a\u7528\u4e8e\u65f6\u95f4\u5e8f\u5217\u56e0\u679c\u63a8\u65ad\u4e0e\u53d1\u73b0\u7684\u81ea\u9002\u5e94\u53bb\u6df7\u6742\u5c42\u3002\u5b83\u5148\u7528 Mar\u010denko\u2013Pastur \u8c31\u8def\u7531\u5668\u5224\u65ad\u672a\u89c2\u6d4b\u6df7\u6742\u7684\u7c7b\u578b\uff0c\u518d\u9009\u62e9\u5339\u914d\u7684\u53bb\u6df7\u6742\u7b56\u7565\uff0c\u5e76\u53ef\u4f5c\u4e3a\u5916\u5c42\u6a21\u5757\u63a5\u5165\u73b0\u6709\u56e0\u679c\u53d1\u73b0\u7b97\u6cd5\u3002", "why_notable": "LUCID \u4e0d\u7ed1\u5b9a\u7279\u5b9a\u56e0\u679c\u53d1\u73b0\u7b97\u6cd5\uff0c\u800c\u662f\u4f5c\u4e3a\u901a\u7528\u53bb\u6df7\u6742\u5305\u88c5\u5c42\u63d0\u5347\u591a\u79cd\u65b9\u6cd5\u7684\u9c81\u68d2\u6027\uff1b\u5bf9\u771f\u5b9e\u65f6\u95f4\u5e8f\u5217\u4e2d\u5e38\u89c1\u7684\u672a\u89c2\u6d4b\u6df7\u6742\u95ee\u9898\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\uff0c\u5e76\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u5b9e\u9a8c\u4e0e\u57fa\u51c6\u751f\u6210\u4ee3\u7801\u3002"}, {"abstract": "Large vocabularies make output heads a substantial inference cost in small language models. We propose softmax reparameterization, a post-training method that selects a functionally equivalent output head before quantization. The method subtracts a scalar multiple of the vocabulary-row mean from every output row and selects the coefficient by validation KL separately for RTN, activation-weighted MSE, and full-Hessian GPTQ. This one-dimensional search includes the original head and fixed mean-centering, preserves the full-precision softmax distribution, and leaves the trained decoder unchanged; a rank-one correction handles nonlinear logit paths such as soft-capping. Across seven heads, W4 gains concentrate where baseline quantization substantially distorts predictions: on Phi-4-mini, AW-MSE KL falls from 0.936 to 0.256. The gains survive stronger GPTQ calibration and remain complementary to exact per-channel scaling and affine quantization. Across four heads and three W4 quantizers, frozen WikiText-selected coefficients also transfer to C4 and OpenWebMath, outperforming mean-centering in all 18 comparisons where the frozen coefficient differs from $1$ and matching it in the remaining six. At W2, used as a compression stress test, benefits broaden across nearly the full model--quantizer matrix. Matched residual analysis shows that improved fidelity can accompany greater logit reconstruction error while reducing the residual\u0027s Fisher-weighted cost. For shift-compatible heads, reparameterization adds no inference operation and preserves packed W4 execution: with the decoder held in BF16, quantizing the Phi output head reduces batch-one generation latency by 10.8% relative to the BF16-head baseline.", "arxiv_id": "2609.31291", "arxiv_url": "https://arxiv.org/abs/2609.31291", "authors": ["Asim Kadav", "Christian Flores", "Chirag Arora", "Varun Kotte", "Hongbo Zheng", "Lan Yan", "Priya Shanmugasundaram", "Tracy Holloway King"], "brief": "\u8bba\u6587\u63d0\u51fa softmax reparameterization\uff1a\u4e00\u79cd\u540e\u8bad\u7ec3\u8f93\u51fa\u5934\u91cf\u5316\u65b9\u6cd5\uff0c\u5728\u4e0d\u6539\u53d8\u5168\u7cbe\u5ea6 softmax \u5206\u5e03\u548c\u89e3\u7801\u5668\u7684\u524d\u63d0\u4e0b\uff0c\u901a\u8fc7\u4ece\u8f93\u51fa\u884c\u4e2d\u51cf\u53bb\u8bcd\u8868\u884c\u5747\u503c\u7684\u6807\u91cf\u500d\u6570\uff0c\u9009\u62e9\u66f4\u9002\u5408\u91cf\u5316\u7684\u7b49\u4ef7\u8f93\u51fa\u5934\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31291", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u4e00\u7ef4\u9a8c\u8bc1 KL \u641c\u7d22\u7cfb\u6570\uff0c\u8986\u76d6\u539f\u59cb\u8f93\u51fa\u5934\u4e0e\u56fa\u5b9a\u5747\u503c\u4e2d\u5fc3\u5316\uff0c\u5e76\u5206\u522b\u9002\u914d RTN\u3001\u6fc0\u6d3b\u52a0\u6743 MSE \u548c GPTQ \u7b49\u91cf\u5316\u5668", "\u5728\u591a\u4e2a\u5c0f\u8bed\u8a00\u6a21\u578b\u8f93\u51fa\u5934\u4e0a\u663e\u8457\u964d\u4f4e W4 \u91cf\u5316\u5931\u771f\uff0c\u4f8b\u5982 Phi-4-mini \u4e0a AW-MSE \u7684 KL \u4ece 0.936 \u964d\u81f3 0.256", "\u65b9\u6cd5\u4e0e per-channel scaling\u3001\u4eff\u5c04\u91cf\u5316\u4e92\u8865\uff1b\u51bb\u7ed3\u5728 WikiText \u4e0a\u9009\u51fa\u7684\u7cfb\u6570\u53ef\u8fc1\u79fb\u5230 C4 \u548c OpenWebMath\uff0c\u4e14\u4e0d\u589e\u52a0\u517c\u5bb9\u8f93\u51fa\u5934\u7684\u63a8\u7406\u5f00\u9500"], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31291v1", "published_at": "2026-09-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Softmax Reparameterization for Output-Head Quantization", "tldr": "\u91cd\u53c2\u6570\u5316\u8f93\u51fa\u5934\u4ee5\u63d0\u5347\u91cf\u5316\u4fdd\u771f\u5ea6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa softmax reparameterization\uff1a\u4e00\u79cd\u540e\u8bad\u7ec3\u8f93\u51fa\u5934\u91cf\u5316\u65b9\u6cd5\uff0c\u5728\u4e0d\u6539\u53d8\u5168\u7cbe\u5ea6 softmax \u5206\u5e03\u548c\u89e3\u7801\u5668\u7684\u524d\u63d0\u4e0b\uff0c\u901a\u8fc7\u4ece\u8f93\u51fa\u884c\u4e2d\u51cf\u53bb\u8bcd\u8868\u884c\u5747\u503c\u7684\u6807\u91cf\u500d\u6570\uff0c\u9009\u62e9\u66f4\u9002\u5408\u91cf\u5316\u7684\u7b49\u4ef7\u8f93\u51fa\u5934\u3002", "why_notable": "\u5927\u8bcd\u8868\u8f93\u51fa\u5934\u662f\u5c0f\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u7684\u91cd\u8981\u6210\u672c\uff0c\u8be5\u65b9\u6cd5\u4ee5\u51e0\u4e4e\u96f6\u90e8\u7f72\u4ee3\u4ef7\u63d0\u5347\u4f4e\u6bd4\u7279\u8f93\u51fa\u5934\u91cf\u5316\u8d28\u91cf\uff0c\u5e76\u5e26\u6765\u5b9e\u6d4b\u751f\u6210\u5ef6\u8fdf\u4e0b\u964d\uff0c\u5177\u6709\u76f4\u63a5\u5de5\u7a0b\u4ef7\u503c\u3002"}, {"abstract": "Pocket-conditioned molecular diffusion updates ambient atom coordinates, but many lead-optimization objectives are expressed on quotient features such as distances, contacts, and anchored substructures. We introduce budgeted quotient-residual guidance (QRG), an inference-time correction that makes these quotient objectives active without retraining the molecular generator. QRG lifts quotient covectors to metric-horizontal ambient directions and delivers them through a trust budget set by the frozen sampler\u0027s own step norm: quotient geometry chooses the direction, while sampler motion bounds the scale. We derive the horizontal lift, closed-form sampler-budget update, KL/kinetic interpretation around a frozen reverse step, equivariance conditions, and a product-budget split for budget-capped section and residual controls. Controlled quotient tasks confirm that sampler-relative delivery activates signals that raw local quotient gradients leave dormant. On frozen TargetDiff backbones, official seed-0 CBGBench ligand-generation/editing sweeps show practical quality-runtime gains: Local-QRG improves validity from 0.815 to 0.864 on fragment growing, 0.664 to 0.707 on scaffold hopping, and 0.681 to 0.712 on linker design, while PredNext-QRG improves fragment/scaffold and remains near-neutral on linker. Novelty remains 1.000 and diversity is preserved in the matched multi-seed molecular slice, giving task-dependent improvements without sampler retraining or backbone modification. Overall, QRG provides a lightweight route to quotient-aware inference for frozen molecular samplers with explicit runtime accounting.", "arxiv_id": "2609.31222", "arxiv_url": "https://arxiv.org/abs/2609.31222", "authors": ["Xinyu Wang", "Jinbo Bi", "Minghu Song"], "brief": "\u8bba\u6587\u63d0\u51fa\u9884\u7b97\u5316\u5546-\u6b8b\u5dee\u5f15\u5bfc\uff08QRG\uff09\uff0c\u4e00\u79cd\u7528\u4e8e\u51bb\u7ed3\u53e3\u888b\u6761\u4ef6\u5206\u5b50\u6269\u6563\u6a21\u578b\u7684\u63a8\u7406\u671f\u6821\u6b63\u65b9\u6cd5\u3002\u5b83\u5c06\u8ddd\u79bb\u3001\u63a5\u89e6\u3001\u951a\u5b9a\u5b50\u7ed3\u6784\u7b49\u5546\u7a7a\u95f4\u76ee\u6807\u63d0\u5347\u4e3a\u73af\u5883\u5750\u6807\u4e2d\u7684\u53ef\u6267\u884c\u65b9\u5411\uff0c\u5e76\u7528\u91c7\u6837\u5668\u81ea\u8eab\u6b65\u957f\u4f5c\u4e3a\u4fe1\u4efb\u9884\u7b97\u63a7\u5236\u66f4\u65b0\u5e45\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31222", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63a8\u5bfc\u4e86\u5546\u534f\u5411\u91cf\u5230\u5ea6\u91cf\u6c34\u5e73\u73af\u5883\u65b9\u5411\u7684\u6c34\u5e73\u63d0\u5347\uff0c\u4ee5\u53ca\u57fa\u4e8e\u51bb\u7ed3\u91c7\u6837\u5668\u6b65\u957f\u7684\u95ed\u5f0f\u9884\u7b97\u66f4\u65b0\u3002", "\u7ed9\u51fa\u56f4\u7ed5\u51bb\u7ed3\u53cd\u5411\u6269\u6563\u6b65\u7684 KL/\u52a8\u80fd\u89e3\u91ca\u3001\u7b49\u53d8\u6027\u6761\u4ef6\uff0c\u4ee5\u53ca\u622a\u9762\u63a7\u5236\u4e0e\u6b8b\u5dee\u63a7\u5236\u7684\u4e58\u79ef\u9884\u7b97\u62c6\u5206\u3002", "\u5728\u51bb\u7ed3 TargetDiff \u4e0e CBGBench \u4efb\u52a1\u4e0a\u63d0\u5347\u751f\u6210\u8d28\u91cf\uff1afragment growing \u6709\u6548\u6027 0.815\u21920.864\uff0cscaffold hopping 0.664\u21920.707\uff0clinker design 0.681\u21920.712\u3002"], "keywords": ["\u
