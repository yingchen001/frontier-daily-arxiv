the multi-turn decisions between successive experiment results as an execution window and assigns it a shared outcome-based reward. Asynchronous collection and policy correction support policy updates before the trajectory ends. On MLE-Bench Lite, MLExpert improves the average medal rate of the base model from 37.9% to 72.7%, achieving performance comparable to larger frontier models such as Kimi-K3 and GLM-5.3. Further experiments show that MLExpert improves performance on NatureBench Lite, agent scaffold optimization, and algorithm optimization, suggesting that the learned optimization capability generalizes to other tasks.", "arxiv_id": "2610.22344", "arxiv_url": "https://arxiv.org/abs/2610.22344", "authors": ["Shangheng Du", "Jinxin Shi", "Shuaiyu Zhang", "Yiming Wu", "Junpeng Zhao", "Shiyang Feng", "Xin Li", "Liang He", "Xiangchao Yan", "Bo Zhang"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22344", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22344v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MLExpert: Towards a Generalist Agentic Model for Autonomous Machine Learning Engineering", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Meta deploys a heterogeneous fleet comprising NVIDIA GPUs, AMD GPUs, and proprietary MTIA accelerators to reduce costs and mitigate vendor lock-in. However, the extensive history of NVIDIA-specific optimizations hinders performance portability to other hardware. This paper presents our methods for optimizing alternative accelerators, using AMD Instinct MI350X versus NVIDIA B200 for recommendation model training as a case study. We propose three reusable principles. First, hardware-model co-design is essential: rather than directly porting models from NVIDIA GPUs, revising model structures and software recipes allows full exploitation of accelerator-specific strengths (e.g., MI350X\u0027s 1.6x HBM capacity relative to B200). Second, our analytical performance model enables zero-warmup optimal kernel selection across diverse datatypes and matrix shapes in production models, drastically simplifying tuning. Third, increasingly mature agentic workflows have lowered the barrier to porting from the CUDA ecosystem; we extend these workflows for microarchitecture-aware kernel optimizations and custom shim generation. Compared to the directly ported baseline, these methods deliver up to 1.5x improvement in end-to-end training throughput. To our knowledge, this is the first hyperscaler report on productionizing AMD GPUs for large-scale training. Our contributions have been upstreamed to the open-source PyTorch, Triton, and ROCm ecosystems.", "arxiv_id": "2610.22230", "arxiv_url": "https://arxiv.org/abs/2610.22230", "authors": ["Haoyu Zhang", "Arshad Rahman", "Adnan Aziz", "Ajith Prabhudev", "Amin Farmahini", "Ben Rhoads", "Benson Ma", "Brian Shi", "Cen Zhao", "CK Luk", "Dingming Wu", "Emad El-Haraty", "Eric Chen", "Frank Li", "Gary Huang", "Gefei Zuo", "Haoran Zhang", "Hiwot Kassa", "Hongyi Zeng", "Jack Taylor", "Jeremy Hadidjojo", "John Donati", "Jonathan Sheffield", "Julio Machado Silva", "Karthik Ganesan", "Kent Russell", "KR Kishore", "Lei Tian", "Liu Ke", "Muhammad Osama", "Peng Chen", "Rakesh Hemnani", "Ryan Swann", "Saleel Kudchadker", "Shankar Yanamandram", "Shobhit Kanaujia", "Shucai Xiao", "Srinath Bayareddy", "Srinivas Vaidyanathan", "Sudharssun Subramanian", "Supadchaya Puangpontip", "Taylor Robie", "Tianhao Huang", "Tyler Hart", "Viswesh Sankaran", "Weijun Jiang", "Wenkai Du", "Xiaodong Wang", "Xiaohu Guo", "Yao Rong", "Yinbin Ma", "Yue Dong", "Yuzhen Huang", "Yvonne Liu", "Zhan Shu", "Dan Rabinovitsj", "Ajit Mathews", "Chunqiang Tang"], "brief": "", "categories": ["cs.DC", "cs.AR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22230", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22230v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Architecting for Hardware Diversity: Meta\u0027s End-to-End Co-Design for High-Performance AI Training on AMD GPUs", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most existing agentic reinforcement learning methods assume single-session trajectories, where interaction proceeds within one continuously accumulated context. However, agentic techniques such as context compaction and subagent forking may produce trajectories spanning multiple sessions, creating a mismatch between the single-session training assumption and inference-time execution. Therefore, we introduce Multi-Session Agentic Reinforcement Learning, a more general setting that supports an arbitrary number of sessions within a trajectory. Under this setting, a widely adopted method is to broadcast trajectory-level advantages to all sessions, but this does not distinguish contributions from various sessions or guide session allocation within trajectories. To address this issue, we propose Mosaic, a multi-session agentic RL method with critic-free hierarchical optimization. At the trajectory level, it incorporates session-usage signals into advantage estimation. At the session level, it shapes each session\u0027s advantage according to the estimated marginal contribution. Experiments on BrowseComp with Qwen3.5-4B show that Mosaic outperforms broadcasting in both context compaction and subagent forking scenarios while using fewer sessions on average. Further analyses show that our method achieves improvements in session utility and allocation, which we suggested is a promising target for future advances in multi-session agentic RL.", "arxiv_id": "2610.22174", "arxiv_url": "https://arxiv.org/abs/2610.22174", "authors": ["Yilong Xu", "Minrui Xu", "Xinyu Zhou", "Xiang Long", "Haochen Tan", "Zhijiang Guo"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22174", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22174v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Mosaic: Multi-Session Agentic Reinforcement Learning", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier models, general-purpose and domain-specific alike, now include a midtraining stage between pretraining and post-training, but little has been published about how this stage is built. We present an open midtraining recipe that primes base models for agentic post-training, and we show its effectiveness on two Nemotron models of different sizes. Pretraining typically runs at short context and sees almost no agent interactions, while SFT data is mostly synthetic, and very long SFT stages can hurt the model\u0027s later RL trainability. Our midtraining stage sits between the two. It trains at 256K context for hundreds of billions of tokens on a diverse mixture of natural software-engineering data like packed repositories, pull requests, commit histories, and build logs together with a small share of agentic traces. On Nemotron 3.5 Lightning, 500B midtraining tokens improve SWE-bench Verified from 60.7 to 64.5, SWE-bench Multilingual from 55.8 to 62.8, and SWE-bench Pro from 32.0 to 35.5 after identical full SFT. On the larger Nemotron 3.5 Super, 280B midtraining tokens improve DeepSWE, a harder benchmark of long-horizon tasks, from 11.7 to 15.7 and SWE-bench Verified from 72.9 to 74.3 after identical full SFT. Midtraining also improves robustness across agent harnesses on both models. We report the ablations behind the recipe and an evaluation protocol built on short fixed SFT runs, since base-model proxy metrics did not correlate reliably with post-training results.", "arxiv_id": "2610.22019", "arxiv_url": "https://arxiv.org/abs/2610.22019", "authors": ["Soumye Singhal", "Joseph Jennings", "Ka Shun Shum", "Alexander Bukharin", "Khushi Bhardwaj", "Zirui Liu", "Venkat Srinivasan", "Jonathan Li", "Yash Jain", "Kezhi Kong", "Markus Kliegl", "Olivier Delalleau", "Sanjeev Satheesh", "Mostofa Patwary"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22019", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22019v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Priming Base Models for Agentic Post-Training: An Open Midtraining Recipe", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When an LLM agent misbehaves, a human steps in, and that intervention is usually discarded or replayed as training data. We treat it instead as a measurement: a label pointing at the internal computation that failed. We study it in a controlled agent environment, on one failure (asking a clarifying question when the request was already unambiguous), with labels from a rule-based overseer validated against blind human judgment. Claims cover eligible models, which both over-ask and sometimes act on matched unambiguous requests: five of thirteen qualified (Qwen2.5-3B, gemma-2-2b, OLMo-3-7B, Mistral-Nemo-12B, Phi-4). Four findings. First, the ask-vs-act decision is causally localizable in every eligible family: a direction learned from intervention labels flips 72-100% of held-out over-asks at a definite residual-stream depth, with site and dose chosen on training data, and random directions under the same procedure flip at most one episode. Second, over-asking has two mechanistic signatures: in four families the model demonstrably knows the request is unambiguous (the belief is decodable, causally inert and orthogonal to the decision) and asks anyway; in the fifth, the rare over-asks track different world-representations. Third, steering gated on a probe readout removes most of the simulated oversight burden while legitimate questions survive (bootstrap 95% intervals exclude zero); a prompt instruction makes it worse. Fourth, consolidating the fix into the weights yields a map, not a rule: on one model a LoRA confined to the causal band passes every criterion fixed in advance while behavior cloning on identical data breaks retention; on three families the reverse holds; on the fifth the outcome crosses the boundary across seeds. A geometric rule written down in advance to predict the regime failed on two out-of-family tests; we report the failure and stop rather than fit a replacement.", "arxiv_id": "2610.21708", "arxiv_url": "https://arxiv.org/abs/2610.21708", "authors": ["Cesare Zavattari", "Alessandro Tommasi", "Giuseppe Prencipe"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21708", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21708v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Human Interventions as Labels: Localizing, Steering, and (Sometimes) Editing the Computations Behind LLM Agent Failures", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the rise of large language models, agentic systems are becoming increasingly autonomous, as they write code, call tools, revise prompts, and propose modifications to their own components. This autonomy raises a fundamental question for safe self-improvement: can an automated gate like a reward model or an automated reviewer reliably decide whether a proposed update should be accepted? The difficulty is structural. The gate must be a terminating, computable procedure, while the property we ultimately care about, namely whether an update is a genuine semantic improvement, depends on potentially unbounded program behavior. We formalize this mismatch by modeling agents as programs and defining improvement in terms of a semantic score that need not be computable. We study two evaluation abstractions. The first is a certifier that approves or rejects an update. The second is a search procedure that, given access to a proposal generator, attempts to output some improving candidate if one exists. We show that, in the fully general setting, no terminating procedure can simultaneously guarantee reliability (never accepting a non-improvement) and non-conservatism (never missing an available improvement): self-referential constructions can force any such gate or searcher to fail. Randomized gates with bounded error face the same limit. We then identify a standard decidable regime used in practice (bounded evaluation and a finite proposal budget) under which exhaustive simulation yields a terminating search procedure with the desired guarantees. We also show the limit of this recovery: a chain of accepted updates can raise the bounded score in every round while the true score falls. Our results draw a boundary between unbounded, universal settings where correctness guarantees collapse and bounded settings where they can be recovered by design.", "arxiv_id": "2610.21646", "arxiv_url": "https://arxiv.org/abs/2610.21646", "authors": ["Brian B. Moser", "Stanislav Frolov", "Tobias C. Nauen", "Federico Raue", "Andreas Dengel"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21646", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21646v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "The Self-Improvement Problem", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) has been a critical paradigm for improving large language model (LLM) reasoning and agentic capabilities, but its efficiency remains a major bottleneck. Existing RL systems commonly rely on asynchronous execution to overlap rollout generation with policy optimization for enhanced efficiency. However, this approach faces inherent limitations: mild policy staleness offers only limited training efficiency gains, whereas aggressive asynchrony can degrade model quality and yields diminishing efficiency gains. The dynamic nature of LLM RL and multi-turn agentic workloads further challenges RL system design, as resource demands shift over time, making static resource allocation and generation strategy inefficient. This paper presents ReFlow, a system-algorithm co-designed RL framework for efficient LLM post-training. Its key insight is that, unlike existing RL frameworks which consume each trajectory only once, experience replay of recent trajectories enables effective sample reuse, thereby amortizing the high cost of rollout generation without incurring excessive policy staleness. To fully exploit this opportunity, ReFlow adopts a decoupled and adaptive architecture with three key designs: a dual replay data cycle supports efficient experience reuse while balancing training throughput and optimization stability; an elastic resource pool enables dynamic resource placement to accommodate evolving RL workloads; an adaptive scheduler coordinates generation strategies and resource allocation to improve resource utilization and boost generation throughput. Experiments across representative single-turn reasoning and multi-turn agentic RL tasks show that ReFlow improves training throughput by up to $2.06\\times$ over state-of-the-art synchronous and asynchronous RL systems, while maintaining comparable or better model performance.", "arxiv_id": "2610.21640", "arxiv_url": "https://arxiv.org/abs/2610.21640", "authors": ["Yukun Tian", "Junwei Su", "Haofeng Xu", "Lansong Diao", "Zhengping Qian", "Weibo Zhao", "Wenchao Zhou", "Ruiting Zhou", "Chuan Wu"], "brief": "", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21640", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21640v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ReFlow: Replay-Driven Decoupling for Efficient RL Post-Training", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic knowledge graph question answering(KGQA) relies on sequences of executable operations, but trajectory-level rewards obscure their individual contributions. Successful trajectories may contain ineffective operations, while failed trajectories may contain useful ones. To assess individual operations, we propose OpCredit, an operationaware policy-learning framework that combines downstream outcome credit with immediate transition credit: Branch Outcome Credit (BOC) reuses ordinary rollouts to compare terminal task rewards observed after different operations under matched navigation contexts; Frontier Transition Credit (FTC) measures operation-induced changes in answer-conditioned frontier potential. The two complementary signals jointly supervise the corresponding decision spans during training, while inference uses only the learned policy and standard KG interface. Experiments on ComplexWebQuestions, WebQSP, and GrailQA across three backbones demonstrate consistent improvements in KGQA performance.", "arxiv_id": "2610.21345", "arxiv_url": "https://arxiv.org/abs/2610.21345", "authors": ["Yucheng Li", "Mingyuan Li", "Xiaxia Wang", "Gong Cheng"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21345", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21345v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "OpCredit: Operation-Aware Policy Learning for Agentic Knowledge Graph Question Answering", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Current value alignment evaluations for large language models (LLMs) heavily rely on output compliance, overlooking whether LLMs maintain value consistency when alternating between generator and evaluator roles. Such consistency is increasingly important because modern LLM agents and alignment pipelines often rely on the same LLM to both generate actions and evaluate their acceptability. To mitigate this limitation, we propose VALCON, a role-driven data construction framework that operationalizes value consistency into three benchmark suites (VAB-Consistency, VAB-Boundary, VAB-Challenge) via dual-role variation. By systematically pairing an LLM\u0027s generative behavior with its evaluative judgments under identical principles, VALCON synthesizes target evaluation data that exposes hidden value discrepancies. Experiments on 28 LLMs reveal pervasive cross-role inconsistency: models with highly compliant outputs frequently fail to align their judgments with their own generations. To understand and address this gap, we perform mechanistic probing that uncovers a role-dependent representational decoupling associated with this behavioral asymmetry. Guided by these insights, we propose a representation-directed intervention that effectively mitigates consistency failures. Our work establishes value consistency as a distinct alignment dimension and provides a complete evaluation-analysis-mitigation pipeline. Code and data are available at https://github.com/tjunlp-lab/VALCON.", "arxiv_id": "2610.21304", "arxiv_url": "https://arxiv.org/abs/2610.21304", "authors": ["Junru Wu", "Jingting Zheng", "Yuqi Ren", "Deyi Xiong"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21304", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21304v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VALCON: Benchmarking and Enhancing Value Consistency in Large Language Models via Dual-Role Variation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Computer use has reached a turning point: the focus is expanding from GUI-only interaction to systems that complete tasks on users\u0027 computers through visual and programmatic interfaces. We define a generalist computer-use agent (GCUA) as a system in which the model chooses how to observe, act, and organize its work across visual and programmatic interfaces. Yet frontier implementations, such as GPT-6 Astra\u0027s computer-use system, remain largely closed, limiting systematic study of their design. We introduce Open Generalist CUA (OpenGCUA), an ongoing project to develop and open the full stack for GCUAs with the community. This report presents the first release of OpenGCUA. Code execution is a key feature of our agent design: it lets intermediate results determine subsequent operations and enables models to apply their existing programming capabilities directly to computer interaction. We also propose harness-to-model decision transfer, moving selected observations and task-state decisions from fixed harness rules to the model. On OSWorld-v2, our full configuration improves task scores across all eight evaluated models, including GPT-6 Astra and Claude Opus 5, raising mean partial score by +19.6 points and reducing reported steps per task by an average of 53.0% relative to batched GUI-only execution. We release our implementation and prompts, evaluation trajectories from all eight models, and preliminary versions of a real-device harness and a cross-device SDK. The harness addresses real-device challenges not fully captured by benchmarks, while the SDK provides a common programming interface across computers, mobiles and browsers. Across four real macOS tasks under our real-device harness, selected Qwen3.8-Max runs use 19.4 times as many reported reasoning tokens as GPT-6 Astra, highlighting substantial differences between models in real-device execution efficiency.", "arxiv_id": "2610.22200", "arxiv_url": "https://arxiv.org/abs/2610.22200", "authors": ["Hanzhang Zhou", "Long Li", "Quyu Kong", "Lei Wang", "Panrong Tong", "Long Chen", "Tianyu Xia", "Gongjie Zhang", "Xu Zhang", "Chen Liu", "Jianan Zhang", "Chenglin Cai", "Zhengwen Zeng", "Steven Hoi", "Yue Wang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22200", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22200v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As multimodal AI systems are becoming our everyday thought partners, the shift towards studying how users transfer control to these systems becomes especially urgent. In this paper, we report an overview of findings from an online study with n=56 AI-literate participants and 392 Video Question Answering trials. After inspecting each multimodal AI response, participants rated task-specific trust and selected one of three intended policies for an analogous future task: reject AI assistance, use it with verification, or delegate fully to the AI. Within participants, post-interaction trust strongly predicted the user\u0027s delegation choices (OR=14.97, 95% CI [7.14,31.37]). Trust and delegation nevertheless remained distinct. Verification was the dominant policy and often co-occurred with high trust. Delegation also increased with task order after adjustment for momentary and participant-level trust (OR=1.22, 95% CI [1.02,1.45]), indicating an experience-related component that self-reported trust ratings alone could not capture. These findings motivate a shift from intended delegation to a non-intrusive observation of how delegation is enacted in collaborative human-AI tasks. We therefore conclude by proposing enacted delegation traces as a methodological framework for future studies of multimodal and agentic AI use.", "arxiv_id": "2610.21948", "arxiv_url": "https://arxiv.org/abs/2610.21948", "authors": ["Agnese Chiatti", "Matteo Matteucci", "Viola Schiaffonati"], "brief": "", "categories": ["cs.HC", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21948", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21948v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Following Delegation Traces to Study Human Oversight in Interaction with Multimodal AI", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Despite the remarkable generalization capabilities of Large Language Models, generating clinically accurate and structured radiology reports from medical images remains a significant challenge. Current end-to-end approaches function as black boxes, prone to factual hallucinations and generating ungrounded findings. This lack of reliability and failure to adhere to domain-specific structuring protocols, fundamentally limits their clinical utility. We present MedPAO-VL, a multimodal agent that shifts the paradigm from monolithic generation to explainable, iterative, protocol-compliant structured report generation. Unlike deterministic models, our plan-act-observe loop functions as a goal-oriented agent: it first perceives the Chest X-Ray through an explainable vision module designed to capture inherent diagnostic uncertainty, then iteratively refines the generated report by observing semantic discrepancies and self-correcting its generation for better alignment with visually detected clinical findings. Evaluation of our framework demonstrates that this agentic reasoning improves clinical correctness and completeness, achieving an expert-rated accuracy score of 3.5/5 and a structural score of 4.3/5. By prioritizing pathology specific explainability and iterative refinement over opaque end-to-end mapping, MedPAO-VL offers a transparent and clinically viable alternative for automated structured radiology report generation.", "arxiv_id": "2610.21794", "arxiv_url": "https://arxiv.org/abs/2610.21794", "authors": ["Shrish Shrinath Vaidya", "Gowthamaan Palani", "Minmini Selvam", "Gokulraja Srinivasaraja", "Ganapathy Krishnamurthi"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21794", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21794v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MedPAO-VL: Interpretable and Protocol-Compliant Agent for Structured Radiology Report Generation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-to-sim conversion aims to turn a captured video of a real environment into an editable 3D scene while preserving the geometry and layout of what was observed. Existing methods often follow a one-pass, loosely coupled paradigm: each stage receives only limited feedback from previous stages, allowing errors to propagate without reliable correction and leaving the final scene inconsistent. We present GRASE, an agentic framework that closes this loop by treating the captured multi-view video observations as a standing reference throughout scene modeling. Instead of committing to intermediate estimates, GRASE revises its current hypothesis whenever rendered evidence disagrees with the capture, overcoming the fixed intermediate assumptions of conventional pipelines. Specifically, GRASE first fits the architectural shell and its openings from depth and multi-view cues. An agent then places generated assets in a shared coordinate frame while checking their spatial relationships. Finally, each asset\u0027s geometry and placement are refined iteratively to improve agreement across the observed views. By coupling these steps through feedback, GRASE localizes structural discrepancies and revises only the responsible components, while preserving cross-view consistency. The resulting 3D scenes are faithful to the input, consistent across views, and suitable for simulations. In our experiments, GRASE substantially outperforms other state-of-the-art methods, including a direct real-to-sim conversion using GPT6-Astra.", "arxiv_id": "2610.21498", "arxiv_url": "https://arxiv.org/abs/2610.21498", "authors": ["Zhaorui Lin", "Haohan Liu", "Zhen Chen", "Xiangru Huang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21498", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21498v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "GRASE: Geometry-native Real-to-sim Agentic Scene Modeling from Video", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Exact $k$-nearest-neighbor (kNN) search over image descriptors and embeddings underlies visual retrieval, near-duplicate detection, the evaluation of learned representations, and increasingly the memory of LLM agents. However, exhaustive search computes every distance at full precision, whereas approximate indexes return recall below one. We observe that exact search only needs a proof that each excluded vector cannot be a neighbor. Because such a proof only has to be conservative, it can be checked in low precision, much as the retina examines the whole scene at low resolution. We call this principle certified exclusion and realize it in an exact kNN method for GPUs, which we call \\certex. Specifically, \\certex\\ stores a lower-bounding projection of each vector in half precision and folds a rounding certificate into the same tensor-core dot product, so that only the few vectors that the test keeps need exact distances. We prove that \\certex\\ returns the exact kNN of every query. On sixteen datasets with up to 100M vectors, \\certex\\ is exact for every query at 7.1$\\times$ to 18.0$\\times$ the throughput of the fastest cuVS search on one H100 and outperforms quantized and graph indexes whenever every query must be exact.", "arxiv_id": "2610.21325", "arxiv_url": "https://arxiv.org/abs/2610.21325", "authors": ["Dongfang Zhao"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21325", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21325v1", "published_at": "2026-10-15", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CertEx: Exact Visual Retrieval at Scale by Certified Exclusion", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the rapid development of multimodal large language models (MLLMs), evaluating their video understanding capabilities has become increasingly important. Existing video understanding benchmarks cover only part of the evaluation dimensions, limiting systematic diagnosis of omni-modal video understanding. We introduce OmniCompass, a holistic benchmark for omni-modal video grounding and understanding. OmniCompass defines two evaluation tracks: OmniCompass-VL assesses vision-language models on tasks requiring visual evidence, while OmniCompass-AV assesses omni-modal models on tasks requiring joint audio-visual evidence. Each track includes three complementary tasks: temporal grounding (TG), spatial grounding (SG), and question answering (QA), assessing when a referenced target appears, where it is, and what happens. QA covers five perception and three reasoning categories in OmniCompass-VL, and three perception and two reasoning categories in OmniCompass-AV. OmniCompass-VL contains 820 videos and 2,460 instances across domains and three duration types: short, medium, and long. A narrative- and audio-rich subset forms OmniCompass-AV with 240 videos and 720 instances. Each instance is evaluated under two paired settings: text-only and text+image, specifying the same target through text and visual-language guidance. All instances are manually annotated with multi-round quality verification. Evaluations of 50 MLLMs show that open-source models still lag behind proprietary counterparts, particularly in audio-visual understanding. Precise temporal and spatial grounding remains challenging even for leading models, and their predictions still exhibit inconsistencies across the paired target specifications.", "arxiv_id": "2610.18829", "arxiv_url": "https://arxiv.org/abs/2610.18829", "authors": ["Xuyang Liu", "Shihao Wang", "Xinyu Wei", "Minghan Li", "Zeqing Wang", "Zuhao Yang", "Zichen Wen", "Lei Zhang"], "brief": "", "categories": ["cs.CV", "cs.CL", "cs.MM"], "github_repo": "https://github.com/PolyU-VCLab/OmniCompass", "github_stars": 54, "hf_url": "https://huggingface.co/papers/2610.18829", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "VCLab", "pdf_url": "https://arxiv.org/pdf/2610.18829v1", "published_at": "2026-10-13", "score": 0.143, "selected_reasons": ["HF trending (52\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18829.png", "title": "OmniCompass: A Holistic Benchmark for Omni-Modal Video Grounding and Understanding", "tldr": null, "upvotes": 52, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce StartLux-Decision, decision models from 0.8B to 27B parameters that combine efficient single-pass prediction with adaptive, confidence-guided reasoning. The Instant models use bidirectional attention in full-attention layers to improve decision accuracy while keeping single-pass inference. The AutoThink models invoke explicit reasoning for uncertain decisions and answer confident cases directly. A three-stage training pipeline establishes shared decision capabilities, specializes the two variants, and equips AutoThink with reasoning through reasoning supervision and reinforcement learning. We introduce Reinforcement Learning for Calibrated Deliberative Decisions (RLCD$^2$), which uses a frozen model and proper scoring rules to reward improvements in decision probability quality and applies a soft penalty to overlong reasoning traces. RLCD$^2$ raises the share of reasoning traces that terminate within the generation limit by up to 48 percentage points and cuts average reasoning length by up to 65%, while largely preserving decision accuracy. On the public subset of Decision Index 0.3, the Instant models outperform the strongest evaluated comparable-scale open-weight decision models by 7.4-16.9 points, and the 27B AutoThink model reaches 73.4. We also introduce DecisionPivot, a programmatically verifiable benchmark of computational decisions built from contrast pairs that differ in a single answer-changing detail. On DecisionPivot, AutoThink outperforms its Instant counterparts by 11.5-18.4 points in pair accuracy and leads among evaluated systems. The models run on vLLM, llama.cpp and MLX, with quantized variants for lower memory use.", "arxiv_id": "2610.17309", "arxiv_url": "https://arxiv.org/abs/2610.17309", "authors": ["Xialie Zhuang", "Zunhai Su", "Jia Pan", "Ngai Wong", "Guanhua Chen", "Chuan-Wei Kuo"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/StartLuxLabs/StartLux-Decision", "github_stars": 416, "hf_url": "https://huggingface.co/papers/2610.17309", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "StartLux", "pdf_url": "https://arxiv.org/pdf/2610.17309v1", "published_at": "2026-10-12", "score": 0.122, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17309.png", "title": "StartLux-Decision: AutoThink Decision Models with Reinforcement Learning for Calibrated Deliberative Decisions", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "Few-step autoregressive video generators enable streaming generation, yet they run every token through the final denoising step, regardless of how much refinement it needs. We find this uniform computation is often unnecessary: many tokens already closely match their eventual full-step outputs in the initial steps, while others require refinement until the end. We introduce Speculative Forcing, a framework that treats intermediate clean estimates as drafts and predicts when individual tokens can be safely accepted early. Once accepted, a token is frozen as its final output and undergoes no further denoising, while its cached keys and values remain available as context for the remaining tokens. We explore two alternative verifier designs: a training-free one based on similarity to clean content and stability across steps, and a learned one that reads the frozen generator\u0027s intermediate features to estimate each token\u0027s remaining gap to its full-step output. Across short-video, long-video, and world generation, Speculative Forcing preserves the quality of full-step sampling while substantially reducing computation. On LongLive, it matches the four-step generator with ~1.7 denoising steps per token, running over 1.5x faster at 41.7 and 37.8 fps. On Lingbot-World 2.0, where camera motion continually changes the visible content, it maintains quality with ~2.5 denoising steps per token and runs 1.35x faster at 24.5 fps.", "arxiv_id": "2610.22347", "arxiv_url": "https://arxiv.org/abs/2610.22347", "authors": ["Hyunwook Choi", "Seungryong Kim", "Dongyoon Han", "Sangdoo Yun"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/naver-ai/speculative-forcing", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.22347", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "NAVER AI Lab", "pdf_url": "https://arxiv.org/pdf/2610.22347v1", "published_at": "2026-10-15", "score": 0.114, "selected_reasons": ["HF trending (41\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22347.png", "title": "Speculative Forcing for Efficient Autoregressive Video Generation", "tldr": null, "upvotes": 41, "what_it_is": null, "why_notable": null}, {"abstract": "A recommendation request on Reddit draws several replies, each naming different titles. When an LLM recommender is trained on such threads with reinforcement learning (RL), which replies should a generated list be rewarded against? The state-of-the-art recipe, Rank-GRPO, picks one reply per training example, so the advantage mostly records which reply was drawn (85% of its variance) rather than how good the list is. We argue that RL should train on the request, not on each answer, and propose ReMaRk: it scores every list once against the union of all replies\u0027 titles and samples each request equally. This makes RL cheaper. On seven backbones and three datasets, ReMaRk reaches the validation recall of 2,000 per-reply RL steps in 25 to 53% of the steps and leads at that budget; trained until neither improves, it is never significantly behind Rank-GRPO and in four of seven pairs reaches Rank-GRPO\u0027s best with fewer GPU-hours. The same reward helps on ProtoQA, where about 100 people answer each question, which points to a simple rule for RL with several valid human answers: reward them jointly.", "arxiv_id": "2610.17771", "arxiv_url": "https://arxiv.org/abs/2610.17771", "authors": ["Xin Li", "Hao Jiang", "Jinghao Guo", "Weisi Lin", "Chau Yuen"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/LiXin97/ReMaRk", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.17771", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2610.17771v1", "published_at": "2026-10-13", "score": 0.109, "selected_reasons": ["HF trending (39\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17771.png", "title": "Many Right Answers, One Training Example: Removing Responder Noise from GRPO for LLM Recommenders", "tldr": null, "upvotes": 39, "what_it_is": null, "why_notable": null}, {"abstract": "Interactive agents repeatedly choose among a finite set of actions, labels, or ordinal outcomes. Generating a free-form response for each choice adds latency and complicates the interface between a model and its environment. We present Intern-Decision, a family of 0.8B, 2B, and 4B multimodal decision models that return structured choices and candidate probabilities from text and optional images. Our autoregressive masked language modeling objective places one decision placeholder per field in a complete assistant JSON skeleton. Ground-truth symbols appear only in supervision, while all fields are evaluated in a single causal forward pass using the backbone\u0027s native language-model head. The 4B model achieves a 90.02% unweighted average accuracy across seven evaluation suites, compared with 88.74% for Jev v1.13.0. For a fixed 289-token request with three fields on one RTX 4090, mean latency is 44.16 ms for the 4B model and approximately 33--34 ms for the smaller models. On a separate 96-case known-distribution pilot, temperature scaling reduces expected multiclass Brier from 0.628 to 0.550 and expected calibration error from 0.213 to 0.089. A confidence-based handoff study on 111 public Jevbench-Hard items improves accuracy from 82/111 (73.87%) to 97/111 (87.39%) by routing 42 items to Atria-Dawn-Preview. We also describe qualitative game, visual interface, and browser demonstrations. These results support compact decision models as a practical component of larger agent systems.", "arxiv_id": "2610.22131", "arxiv_url": "https://arxiv.org/abs/2610.22131", "authors": ["Tong Zhu", "Zhe Xu", "Zefeng He", "Yunkai Chai", "Xuyang Hu", "Dehong Zheng", "Yun Luo", "Yafu Li", "Qi Zhang", "Yu Cheng"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/InternLM/Intern-Decision", "github_stars": 786, "hf_url": "https://huggingface.co/papers/2610.22131", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Intern Large Models", "pdf_url": "https://arxiv.org/pdf/2610.22131v1", "published_at": "2026-10-15", "score": 0.109, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22131.png", "title": "Intern-Decision: Efficient Multimodal Decision Making with Autoregressive Masked Language Modeling", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Self-driving laboratories (SDLs) aim to automate the full experimental loop, from scientific decision-making to physical execution. Ideally, AI-generated plans could be carried out directly by robotic systems, but reliable automation remains difficult in complex, open-world laboratory environments, where experiments often involve fine-grained manipulation, long-horizon procedures, and substantial variation across tasks and setups. Humans therefore remain an important execution interface between AI-generated plans and physical experiments, creating a need for clear and effective human-facing experimental guidance. Because laboratory procedures are inherently visual, spatial, and dynamic, video is particularly well suited to communicating apparatus configurations, manipulation actions, temporal dependencies, and state changes. Recent advances in video generation now make it possible to synthesize experimental demonstrations directly from an initial workspace image and a natural-language instruction. However, whether such models can reliably communicate real laboratory procedures has not been systematically studied. We introduce LabInstruct, a benchmark for situated instructional video generation in real laboratories. LabInstruct contains 204 tasks across 5 scientific disciplines, with real reference executions and structured annotations of objects, actions, contacts, and state transitions. Evaluating 8 frontier image-to-video models, we find that visually plausible generations frequently remain procedurally incorrect, revealing a substantial gap between visual realism and the reliability required for experimental instruction.", "arxiv_id": "2610.14020", "arxiv_url": "https://arxiv.org/abs/2610.14020", "authors": ["Yuming Fu", "Weijia Wu", "Jing Chen", "Jiahao Tang", "Feifei Chen", "Hongyu Zhu", "Xin Jin", "Alex Jinpeng Wang"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/CSU-JPG/LabInstruct", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2610.14020", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.14020v1", "published_at": "2026-09-29", "score": 0.103, "selected_reasons": ["HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14020.png", "title": "LabInstruct: Benchmarking Situated Instructional Video Generation for Lab Procedures", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce 3DCodeVerse, a research ecosystem that enables coding agents to create editable and verifiable 3D content at scale. 3DCodeVerse comprises large-scale, high-quality datasets of executable 3D code, a coding harness for spatial reasoning and automated verification, and practical guidance for 3D coding. First, we construct 3DCodeVerse-2M, a large-scale curated dataset of standalone 3D executable code. We build this corpus by collecting open-source data, converting specialized representations, and generating new programs with coding agents. Each program is packaged with the source files and associated assets required for execution in its declared environment, along with available descriptions and verification records. Second, we develop the 3DCodeVerse Harness, a multi-agent directed acyclic graph framework for generating and refining 3D content. It uses execution checks, spatial measurements, and visual feedback to automatically evaluate and revise generated programs without human feedback during generation. Third, we conduct systematic empirical studies of 3D coding, establishing baselines with fine-tuned open models and deriving practical guidance through component-level analyses of our harness. Extensive experiments demonstrate that fine-tuning on our dataset significantly improves the 3D coding capabilities of open-source models. Notably, our 3DCodeVerse harness achieves a 90% win rate against Claude Design (3D Object) in pairwise human evaluations, when both are utilized by Claude Opus 5.5.", "arxiv_id": "2610.22341", "arxiv_url": "https://arxiv.org/abs/2610.22341", "authors": ["Yipeng Gao", "Ziyao Zeng", "Jinfa Huang", "Yijiang Li", "Haolin Xiong", "Wang Qin", "Xinlei Yu", "Youheng Yao", "Jie Zhang", "Kun-Yu Lin", "Rong Liu", "Yinyuan Zhao", "Yajie Zhao", "Meiqi Guo", "Jiebo Luo", "Lei Shu", "Yunhao Ge", "Xinyu Hu", "Laurent Itti"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/gaoypeng/3dcodeverse", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2610.22341", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "University of Southern California", "pdf_url": "https://arxiv.org/pdf/2610.22341v1", "published_at": "2026-10-15", "score": 0.098, "selected_reasons": ["HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22341.png", "title": "3DCodeVerse: Exploring 3D Worlds as Code", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Hybrid reasoning models such as the Qwen3 series switch between a THINK mode and a NO-THINK mode through a few chat-template tokens. A popular recipe trains such models with reinforcement learning in NO-THINK mode and reports improved reasoning performance. We provide evidence that much of this gain can be explained by thinking leakage: the gain comes largely from partially reactivating the reasoning abilities of the original model\u0027s THINK mode instead of learning enhanced reasoning behavior. We train Qwen3-1.7B, 4B, and 8B with GRPO in NO-THINK mode. As accuracy improves, responses become longer and more reflective, are increasingly judged by the original model to resemble its own thinking, and the model\u0027s internal activations shift toward its THINK mode. We then investigate at the level of weights, activations, and attention heads: scaling the RL update further elicits THINK-mode behavior and approaches THINK-mode accuracy but does not exceed it; in Qwen3-8B, replacing a low-dimensional THINK-related activation subspace of the RL-trained model with its original-model value removes most of the RL gain, and the reverse exchange transfers a considerable fraction of the gain to the original model; and the RL-induced shift passes through the attention heads that read the empty think block. We further identify a possible mechanism in the GRPO training signal: responses favored by the advantage-weighted update are more THINK-like, and a gradient step computed from this signal moves the model toward its THINK state. Thus, gains in NO-THINK mode can largely reflect reactivation of reasoning abilities already present in the original model.", "arxiv_id": "2610.14270", "arxiv_url": "https://arxiv.org/abs/2610.14270", "authors": ["Wenxuan Zhu", "Shuming Liu", "Bang An", "Aznaur Aliev", "Bing Li", "Yibo Yang", "Bernard Ghanem"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/WenxuanZhu1103/think-leakage", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.14270", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "KAUST Center of Excellence in Generative AI", "pdf_url": "https://arxiv.org/pdf/2610.14270v1", "published_at": "2026-10-09", "score": 0.088, "selected_reasons": ["HF trending (21\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14270.png", "title": "The Thinking Leakage in Reinforcement Learning for LLMs", "tldr": null, "upvotes": 21, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluating model uncertainty on real-world data is challenging because each instance provides only a single observed label, leaving true conditional class probabilities unknown. To address this, we introduce ProbabilityBench, a benchmark that provides exact, instance-level class probabilities across three simulated text-based domains: peer review, covert information transfer, and credit risk. By explicitly defining the full data-generating process for each environment, we analytically compute both exact class probabilities and Bayes error. Furthermore, we provide a theoretical guarantee that rendering these cases into natural-language memos strictly preserves their underlying generative probabilities. This exactness enables direct measurement of reported probability quality via KL divergence. Across 16 evaluated models, most models on the observed cost-quality Pareto frontiers are decision models, including Jev and Perplexity Decider. Finally, ProbabilityBench serves as a meta-evaluation framework, leveraging known ground-truth values to benchmark the accuracy of standard calibration metrics and Bayes-error estimators themselves.", "arxiv_id": "2610.17016", "arxiv_url": "https://arxiv.org/abs/2610.17016", "authors": ["Yuyang Dai", "Yuting Tang", "Futoshi Futami", "Takashi Ishida"], "brief": "", "categories": ["cs.LG", "cs.AI", "stat.ML"], "github_repo": "https://github.com/ishida-lab/ProbabilityBench", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2610.17016", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ishidalab", "pdf_url": "https://arxiv.org/pdf/2610.17016v1", "published_at": "2026-10-12", "score": 0.083, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17016.png", "title": "ProbabilityBench: Model Evaluation and Calibration with Exact Ground-Truth Uncertainty", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "In an image latent space, the embeddings of high-resolution, natural, and sharp images form a manifold. Degradation of high-resolution images pushes their embeddings off this manifold. Real-world super-resolution (SR) then becomes the task of mapping the degraded embedding back onto this manifold --- not anywhere on the manifold, but to the point that preserves what the input still carries, both its semantics and pixel details. Every published method implements this mapping in a reconstruction-oriented latent space or pixel space. We claim these spaces are the wrong substrates for SR. Low-resolution and degraded images are embedded far from the manifold, making the mapping difficult and expensive. The lack of semantic information in these substrates also makes it difficult to navigate to the faithful point on the manifold, causing severe hallucination when degradation is heavy. Thus, restoring in a suitable latent space is crucial to the SR task. We show that the latent space of 23 fused layers of a frozen DINOv3-L is one such space that makes the SR task easier. Degraded images are embedded near the manifold. Moreover, this substrate contains a hierarchy of information, from pixel record to degradation robust semantics, guiding the model to find the faithful point on the manifold. On this substrate, a 415M decoder is trained under reconstruction and adversarial objectives to map the degraded embeddings back and decode to pixel space in one pass. The resulting model, RAESR, attains the best fidelity--perception trade-off among state-of-the-art adversarial and diffusion-based restorers on RealSR, DRealSR, LSDIR and DIV2K-Val, at 37 ms per 512 by 512 image on a single H20 GPU. Swapping the substrate for a VAE latent under an identical recipe loses on every metric.", "arxiv_id": "2610.04781", "arxiv_url": "https://arxiv.org/abs/2610.04781", "authors": ["Wanzhou Lei", "Cuifeng Shen", "Yanjin He", "Maohua Li", "Hua Yuan", "Per-Olof Persson", "Tao Lan", "Kan Liu", "Hanlin Tang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.04781", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "RTP-LLM", "pdf_url": "https://arxiv.org/pdf/2610.04781v2", "published_at": "2026-10-03", "score": 0.082, "selected_reasons": ["HF trending (19\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04781.png", "title": "Super-Resolution in The Right Latent Space: A Frozen Vision-Foundation Substrate", "tldr": null, "upvotes": 19, "what_it_is": null, "why_notable": null}, {"abstract": "As coding agents become increasingly capable, robust evaluation requires a broader and more diverse supply of verifiable software engineering (SWE) tasks. However, real-world tasks are constrained by the natural frequency of issue reporting and the substantial cost of manual curation. Furthermore, existing synthetic approaches rely primarily on the pretrained knowledge of large models coupled with heuristic prompting, often failing to capture the authentic, complex mechanics of software failures. To exponentially scale SWE task production, we introduce SWE-at-Scale, a framework that automatically synthesizes realistic issues by reverse-engineering real-world software fixes. Our key insight is that historical fixes encapsulate deep mechanistic knowledge of bug formation: inverting a fix transforms repair supervision into bug-induction supervision grounded in actual development scenarios. SWE-at-Scale transfers these learned bug patterns to novel code contexts, repeatedly sampling diverse bug typologies to construct executable SWE tasks. Extensive experiments show that SWE-at-Scale generates more diverse and realistic SWE tasks than current synthesis baselines while posing greater challenges to state-of-the-art coding agents. Notably, SWE-at-Scale can generate distinct bug types from a single code context, with bug diversity scaling robustly even up to 200 generations per file. Overall, SWE-at-Scale turns finite real-world fixes into reusable supervision for scalable synthesis of realistic, diverse, and challenging SWE tasks.", "arxiv_id": "2610.21359", "arxiv_url": "https://arxiv.org/abs/2610.21359", "authors": ["Silin Chen", "Zihan Zhang", "Xiaodong Gu", "Jiale Huang", "Yuling Shi", "Han Li", "Zhao Shan", "Chengcheng Wan", "Zhensu Sun", "Haibing Guan"], "brief": "", "categories": ["cs.SE"], "github_repo": "https://github.com/cslsolow/SWE-at-scale", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.21359", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2610.21359v1", "published_at": "2026-10-15", "score": 0.076, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.21359.png", "title": "SWE-at-Scale: Scalable Issue Synthesis from Historical Bug Fixes", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "Language models are becoming infrastructure, and infrastructure built in the open, by public institutions, on documented data, is the alternative to dependence on a few providers; Apertus shows this is viable at scale. Apertus 1.5 extends the fully open Apertus family from text to multimodal reasoning. Continued pretraining of the Apertus 1.0 models, on 4T additional tokens for the 8B and 2T for the 70B, adds image and audio understanding and extends the context window fourfold to 262,144 tokens; multimodality enters through the tokenizer, the language-model head remains restricted to text, and the architecture is unchanged. Supervised finetuning, long-context finetuning, reinforcement learning with verifiable rewards, and preference alignment complete the released models. Thinking is a flag of the chat template rather than a separate model, and lifts mathematical reasoning by up to 20 points on the 8B model. The released models improve over their predecessors on nearly every benchmark; among fully open models of its class, the 8B leads on knowledge, instruction following, and cultural benchmarks, and its instruction following surpasses all compared models, including open-weight ones. On image and audio understanding, a first for the family, the models are competitive with fully open multimodal models, strongest on document understanding and long-form and lower-resource speech recognition, while specialized vision and audio models remain ahead on perception and transcription of English and other high-resource languages. As in Apertus 1.0, we train only on openly available data, respect crawler opt-outs retroactively, and exclude restrictively licensed material. We release the model weights, data preparation and training recipes, and evaluation suites under permissive licenses; openness extends to values, with the Apertus charter guiding alignment stages published alongside the models.", "arxiv_id": "2610.15542", "arxiv_url": "https://arxiv.org/abs/2610.15542", "authors": ["Project Apertus", ":", "Yixuan Xu", "Yassine Turki", "Vinko Sabol\u010dec", "Valentina Pyatkin", "Tommy Chu", "Sven Najem-Meyer", "Sean F. Carroll", "Robert Smith", "Raphael Kreft", "Oscar Alessandro Tazza", "Oleg Lavrovsky", "Nicola Irmiger", "Matteo Santelmo", "Marian Schneider", "Juan Garc\u00eda Giraldo", "Hanna Yukhymenko", "Eduard \u010eurech", "Davit Melikidze", "Dani Tamayo", "Bettina Messmer", "Aryan Ahadinia", "Anunay Yadav", "Allen Huang", "Ahmad Fraij", "Alessandro Bombarda", "Alex Padula", "Alexander H\u00e4gele", "Alexander Sternfeld", "Anna Hedstr\u00f6m", "Anna Kosovskaia", "Arthur Wuhrmann", "Arundhati Balasubramaniam", "Badr Al Mahouri", "Barna Pasztor", "Bartosz Szostakiewicz", "Bich Ngoc Doan", "Bryan Schmid", "Burak Sezen", "Camille Challier", "Cl\u00e9ment Charmillot", "Dana Shayakhmetova", "Daniel Perruchoud", "David Br\u00fcggemann", "David Isztl", "Elia Palme", "Emma Anastassova", "Fabian B\u00f6sch", "Faruk Zahiragi\u0107", "Fawzi Roberto Mohamed", "Fiona Panicali", "Florian Kolly", "Flynn Guerra", "Francesco Monti", "Frederike L\u00fcbeck", "Gennaro Oliva", "Haofeng Yang", "Haoliang Shang", "Helen El Khoury", "Henrique Mendon\u00e7a", "Jannis Vamvas", "J\u00e9rome Landolt", "Jessica Lam", "Jingchun Xiao", "Jonathan Coles", "Joshua Oyebanji", "Khanh Nguyen", "Konstantinos Pitas", "Lasse B. Strand", "Li Mi", "Lo\u00efc Deslarzes", "Lorenzo Baggi", "Lorenzo Noci", "Luca Baumann", "Luca Sartori", "Lukas Drescher", "Marco De Negri", "Marco Passerini", "Mark Klein", "Marko Stojanovic", "Martin Majsec", "Matin Ansaripour", "Mattea Busato", "Mauro Pellonara", "Max Neuwinger", "Michael Graber", "Michal Te\u0161nar", "Michelle Wastl", "Miguel Gila", "Mikolaj Boronski", "Morgane Magnin", "Moritz Reihs", "Mukhammadali Sayfiddinov", "Nathan Ranchin", "Nicolas Cuveillier", "Oscar Wohlfahrt", "Qianqian Zou", "Rada Kamysheva", "Rita Sevastjanova", "Roman Machacek", "Sebastian Keller", "Simon Matrenok", "Simon Pierre", "Stefano Schuppli", "Suei-Wen Chen", "Szabina Horv\u00e1th-Mikulas", "Taliesin Perez", "Thilo Spinner", "Thomas Kleine Buening", "Tim Robinson", "Tymoteusz Kwiecinski", "Vil\u00e9m Zouhar", "Vinzenz Thoma", "Xiaozhe Yao", "Yannick Metz", "Yuhei Fukuhara", "Yusif Askari", "Zixuan Chen", "Alexander Ilic", "Ana Klimovic", "Andreas Krause", "Andrei Kucharavy", "Elliott Ash", "Joost VandeVondele", "Martin Rajman", "Mennatallah El-Assady", "Thomas Schulthess", "Timo Kehrer", "Torsten Hoefler", "Antoine Bosselut", "Martin Jaggi", "Imanol Schlag"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.15542", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Swiss AI Initiative", "pdf_url": "https://arxiv.org/pdf/2610.15542v1", "published_at": "2026-10-11", "score": 0.074, "selected_reasons": ["HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.15542.png", "title": "Apertus 1.5: From Open Text Models to Open Multimodal Reasoners", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal LLMs are typically trained by first aligning a vision encoder with a language model via projector training on large image-caption datasets, followed by joint training of the full multimodal model. Despite its widespread use, the role of the projector training stage remains poorly understood. We find that (i) using only $10$ to $20\\%$ of the data for training the projector already recovers most downstream performance gains, and (ii) projectors trained on different datasets can be linearly interpolated while largely preserving performance. These results suggest that projector training mainly performs a coarse alignment, which many different projectors achieve equally well. Motivated by these findings, we propose PORTAL, a training-free projector initialization that requires neither paired image-caption data nor gradient-based optimization, but only per-modality summary statistics. PORTAL computes an optimal-transport-based map between Gaussian approximations of the vision and language feature distributions on a shared principal subspace, so that the projector training stage can be skipped entirely. Without any paired data, PORTAL matches the standard pipeline trained on 558k image-caption pairs across six LLM backbones, two vision encoders, and 16 benchmarks. It outperforms that pipeline in $3$ of $7$ (vision encoder, LLM) settings and reaches an average $98\\%$ of its score across the other four.", "arxiv_id": "2610.18598", "arxiv_url": "https://arxiv.org/abs/2610.18598", "authors": ["Fabian Gr\u00f6ger", "Na\u00ebl Ouerghemi", "Shuo Wen", "Maria Brbi\u0107"], "brief": "", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": "https://github.com/mlbio-epfl/PORTAL", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.18598", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "EPFL", "pdf_url": "https://arxiv.org/pdf/2610.18598v1", "published_at": "2026-10-13", "score": 0.074, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18598.png", "title": "Rethinking Projector Training in Multimodal LLMs", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse attention reduces the KV-cache traffic that dominates long-context LLM decoding, but practical methods largely operate at coarse granularity. Token-level selection offers finer control, yet presents two challenges: low-dimensional scoring may lose query--key structure needed for accurate ranking, while gathering scattered selected tokens can offset the resulting latency benefit. We introduce Joint Subspace Sparse Attention (JSSA) to address both challenges. For selection quality, JSSA learns a shared low-dimensional query--key subspace by minimizing token-score preservation error. We upper-bound the resulting non-convex objective with a tractable marginal objective that admits a closed-form spectral solution; direct refinement of the exact objective provides no measurable improvement in the tested settings. For execution efficiency, we develop a gather-free token-level indexed-attention kernel that supports distinct per-KV-head selections under the standard grouped-query attention (GQA) KV-cache layout. Across standard GQA, hybrid sliding-window/global attention, and Multi-head Latent Attention (MLA) models, JSSA consistently remains close to full-KV accuracy while avoiding the substantial generation-length inflation and architecture-dependent failures observed with competing methods. On an NVIDIA B200 GPU, JSSA achieves up to $6.43\\times$ the decoding throughput of full-KV attention at 128K context. JSSA achieves reasoning accuracy comparable to model-native DSA without model training and reaches 96--99\\% of its decoding throughput even at 700B scale large models.", "arxiv_id": "2610.19026", "arxiv_url": "https://arxiv.org/abs/2610.19026", "authors": ["Jiwon Song", "Yoongon Kim", "Jae-Joon Kim"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/jiwonsong-dev/JSSA", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.19026", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Seoul National University VLSI Lab", "pdf_url": "https://arxiv.org/pdf/2610.19026v1", "published_at": "2026-10-13", "score": 0.07, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.19026.png", "title": "Joint Subspace Sparse Attention for Efficient Long-Context Decoding", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "Simulated environments enable scalable training data generation for embodied agents, but more data does not necessarily provide what a particular agent needs to learn. Existing environment-generation pipelines largely optimize generic properties such as realism, diversity, or task coverage, while different pretrained policies can fail for different environmental reasons. We therefore introduce WEDGE, a framework for weakness-guided navigation learning in which the failure modes of a pretrained agent guide the generation of training environments at each adaptation round. Given a pretrained policy, WEDGE uses an LLM to propose executable weakness features from contrasting successful and failed rollouts, automatically validates them on the diagnostic set, and selects the strongest validated weakness based on its success-rate gap. The validated weaknesses are then mapped to the environmental factors that control them. WEDGE varies these factors to construct environments in the difficulty regimes where the policy struggles, producing targeted training experience for adaptation. Across three navigation agents with different adaptation mechanisms, we find that policies exhibit distinct weakness profiles and benefit from different training environments. Weakness-conditioned adaptation consistently outperforms matched random and hard-example alternatives on ProcTHOR, while the resulting gains for Uni-NaVid and Gemini also extend to HM3D after ProcTHOR adaptation. Iterative re-diagnosis further shows that dominant weaknesses can persist or shift as the policy improves, providing updated guidance for subsequent environment construction. Together, these results show that policy failures are not only diagnostic signals, but actionable guidance for constructing training environments that target a policy\u0027s current weaknesses.", "arxiv_id": "2610.19420", "arxiv_url": "https://arxiv.org/abs/2610.19420", "authors": ["Yue Zhang", "Han Lin", "Zun Wang", "Yidong Huang", "Zaid Khan", "Mohit Bansal"], "brief": "", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": "https://github.com/zhangyuejoslin/WEDGE", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.19420", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "University of North Carolina at Chapel Hill", "pdf_url": "https://arxiv.org/pdf/2610.19420v1", "published_at": "2026-10-14", "score": 0.064, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.19420.png", "title": "From Failures to Learnable Worlds: Policy-Conditioned Environment Generation for Navigation Agents", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Whole-slide images (WSIs) are gigapixel-scale digital scans of histopathology tissue and serve as the primary basis for cancer diagnosis. Existing histopathology generative models operate at the patch scale, producing fixed-size tiles of at most 1024$\\times$1024 pixels which encompass only a small fraction of the WSI. In contrast, text reports for clinical diagnoses and slide-level diagnostic labels -- the supervision that exists at scale -- operate at the whole-slide level. We present BigCell, the first approach to generate coherent whole-slide histopathology images at native gigapixel resolution. BigCell trains a flow-matching transformer at 2048$\\times$2048 pixels on over 120,000 publicly available WSIs spanning multiple organ types. Conditioning on embeddings from pathology foundation models and using an inference-time sliding-window pipeline, BigCell generates coherent images of up to 32,768$\\times$32,768 pixels, outperforming prior tile generators on both tile-level and slide-level fidelity metrics. To make gigapixel synthesis practical, we introduce an adaptive scheduling strategy that prioritizes important slide regions, speeding up image generation by over 3\\ttimes with minimal quality degradation. Furthermore, we propose the first text-to-image synthesis at 8k resolution by training a separate model that produces dense conditioning grids directly from pathology text reports. We demonstrate that augmenting with synthetic samples improves slide-level few-shot classification performance by up to $18 \\%$ over baselines trained on real data.", "arxiv_id": "2610.14261", "arxiv_url": "https://arxiv.org/abs/2610.14261", "authors": ["Srikar Yellapragada", "Alexandros Graikos", "Zilinghan Li", "Kostas Triaridis", "Tarak Nath Nandi", "Ji Dong K Bai", "Beatrice Knudsen", "Tahsin Kurc", "Prateek Prasanna", "Rajarsi R. Gupta", "Ravi K Madduri", "Joel Saltz", "Dimitris Samaras"], "brief": "", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.14261", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "CVLab @ Stony Brook University", "pdf_url": "https://arxiv.org/pdf/2610.14261v1", "published_at": "2026-10-09", "score": 0.064, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14261.png", "title": "BigCell: Generating Gigapixel Whole-Slide Images", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Video subtitle removal (VSR) is an important video restoration task, yet existing evaluation remains limited by low-resolution datasets, fragmented test sets, and generic video-inpainting protocols that fail to adequately capture localized restoration errors, unintended modifications, temporal instability, and incomplete outputs. In this paper, we introduce MFVSR, a large-scale multi-style benchmark for fine-grained and reliability-aware video subtitle removal evaluation. MFVSR distinguishes itself through three key features: (1) Large-scale and diverse data, comprising 3,000 paired videos from Real-HQ, Real-LQ, and AI-Generated sources, with an auxiliary set of 953 in-the-wild real videos for real-world coverage analysis; (2) Controlled subtitle diversity, spanning 16 languages and four factors covering spatial layout, temporal behavior, visual style, and language mode; (3) Fine-grained evaluation, introducing an information-conditioned, spatially decoupled protocol that separates blind from mask-guided removal and measures Restoration Fidelity, Preservation Fidelity, Temporal Fidelity, coverage, and failures. Experiments on six representative methods reveal substantial discrepancies between local restoration, outside-region preservation, temporal consistency, and full-set reliability that are obscured by conventional full-frame metrics. MFVSR therefore provides a more comprehensive and diagnostic foundation for evaluating and advancing video subtitle removal methods.", "arxiv_id": "2610.18461", "arxiv_url": "https://arxiv.org/abs/2610.18461", "authors": ["Xiyan Huang", "Qingdong He", "Peng Tang", "Bo Yin", "Chaoyi Wang", "Xiaobin Hu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/hxyiiii/MFVSR", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.18461", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.18461v1", "published_at": "2026-10-13", "score": 0.053, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18461.png", "title": "MFVSR: A Multi-Style and Fine-Grained Benchmark for Video Subtitle Removal", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming vision-language models (VLMs) must continuously integrate information from the past while remaining responsive to current observations and user queries. Existing memory mechanisms typically compress, retrieve, or cache historical observations and reintroduce them into the input context, forcing historical memory and current observations to compete for limited context. We propose MaLoW, a streaming memory framework that instead internalizes historical context into evolving lightweight parameter updates. MaLoW uses a recurrent HyperNetwork to incrementally consolidate incoming video observations into fixed-size LoRA weights, allowing historical information to be carried forward without revisiting the full video stream. In doing so, MaLoW represents history as weights, while keeping the current observation as input. To support training, we further construct MaLoW-Instruct, a large-scale streaming video dataset containing 381K question-answer pairs over 56K videos. We conduct extensive experiments to demonstrate that MaLoW achieves strong performance on OVO-Bench, StreamingBench, and StreamArena. On the backward split of OVO-Bench, MaLoW outperforms prior memory approaches by 3.9% to 11.8% across different video backbones while incurring only modest latency overhead. Beyond streaming video understanding, MaLoW also generalizes to vision-language-action models, improving the action success rate on Simpler WidowX by 9.3%.", "arxiv_id": "2610.22070", "arxiv_url": "https://arxiv.org/abs/2610.22070", "authors": ["Zhuoming Liu", "Jinhong Lin", "Lin Zhang", "Yiwu Zhong", "Yin
