const PAPERS = [{"abstract": "Agentic AI systems act through multi-step trajectories that combine planning, tool use, memory, interaction, and adaptation. This behavior stretches validation practice beyond component testing and one-shot input--output evaluation, because acceptable system behavior now depends on how decisions unfold over time and under changing environmental conditions. This survey synthesizes 257 papers spanning agent evaluation, software assurance, cyber-physical systems, runtime monitoring, and regulatory guidance in order to characterize the validation problem for agentic systems. The review is organized around a five-dimension taxonomy covering behavioral, safety, temporal, regulatory, and multi-agent concerns, and uses that taxonomy to map current approaches and expose recurrent coverage gaps. The analysis shows that behavioral evaluation is comparatively mature, while temporal validity, runtime evidence maintenance, regulatory legibility, and open-ended multi-agent systems assurance remain under-developed. Three cross-domain case studies (medical care, industrial operations, smart-mobility systems) provide operational illustrations of how the five taxonomy dimensions recur in safety-critical settings, grounded in the failure patterns documented in the reviewed literature. The paper concludes with a lifecycle-oriented research agenda centered on bounded-autonomy specifications, adversarial trajectory generation, runtime monitoring, and audit-ready evidence structures. The central claim is that trustworthy deployment of agentic AI depends on validating trajectories in context rather than assessing isolated components alone.", "arxiv_id": "2607.29405", "arxiv_url": "https://arxiv.org/abs/2607.29405", "authors": ["Fabio Orazio Mirto", "Luca D\u0027Agati", "Giuseppe Tricomi", "Stefano Silvestri", "Francesco Longo", "Antonio Puliafito", "Giovanni Merlino"], "brief": "\u672c\u6587\u7efc\u8ff0257\u7bc7\u5173\u4e8e\u667a\u80fd\u4f53\u8bc4\u4f30\u3001\u uments, known values for synthetic lists, and human verification for forms. We report order-insensitive value F1 for value accuracy, plus two grounding metrics for source traceability: word- and page-level F1. Commercial VLMs perform well on short documents but often truncate record lists on long ones, while coding agents retain higher accuracy at much higher cost. LlamaExtract Agentic Plus ranks first on all three metrics, with accuracy comparable to coding agents at a fraction of the cost. Dataset and evaluation code are available on \\href{https://huggingface.co/datasets/llamaindex/ExtractBench}{HuggingFace} and \\href{https://github.com/run-llama/ExtractBench}{GitHub}.", "arxiv_id": "2607.29677", "arxiv_url": "https://arxiv.org/abs/2607.29677", "authors": ["Boyang Zhang", "Adrian Lyjak", "Eli Stewart", "Zhaoqi Li", "Simon Suo"], "brief": "\u8bba\u6587\u63d0\u51fa ExtractBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u6309\u7528\u6237\u81ea\u5b9a\u4e49 schema \u4ece\u4f01\u4e1a\u6587\u6863\u4e2d\u62bd\u53d6\u7ed3\u6784\u5316\u4fe1\u606f\u5e76\u63d0\u4f9b\u6765\u6e90\u8bc1\u636e\u7684\u80fd\u529b\u3002\u57fa\u51c6\u8986\u76d6 370 \u4efd\u4f01\u4e1a\u6587\u6863\u30014869 \u9875\u30018 \u4e2a\u4e1a\u52a1\u9886\u57df\u548c 67 \u7c7b\u6587\u6863\uff0c\u5e76\u540c\u65f6\u8861\u91cf\u503c\u51c6\u786e\u7387\u3001\u8bb0\u5f55\u5b8c\u6574\u6027\u3001\u8bc1\u636e\u5b9a\u4f4d\u548c\u6210\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29677", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u53ef\u6269\u5c55\u6807\u6ce8\u6d41\u7a0b\uff1a\u771f\u5b9e\u6587\u6863\u7528\u591a\u7cfb\u7edf\u4e00\u81f4\u6027\uff0c\u5408\u6210\u5217\u8868\u7528\u5df2\u77e5\u503c\uff0c\u8868\u5355\u7531\u4eba\u5de5\u9a8c\u8bc1\u3002", "\u8bc4\u6d4b\u6307\u6807\u5305\u62ec\u987a\u5e8f\u65e0\u5173\u7684 value F1\uff0c\u4ee5\u53ca\u8bcd\u7ea7\u548c\u9875\u7ea7 grounding F1\uff0c\u7528\u4e8e\u8861\u91cf\u6 77\u6709\u8f83\u5f3a\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Graphical user interface (GUI) agents based on large language models are increasingly deployed across mobile, web, and desktop environments. However, existing agents are typically domain-specific, limiting the deployment and user experience. This motivates the consolidation of specialized models into a single cross-environment policy. Weight merging directly merges domain-specific experts but can corrupt executable actions under expert disagreement, while on-policy distillation (OPD) avoids conflicting teacher supervision yet still treats all response tokens equally during distillation, ignoring that action tokens are the only interface between the environment and the agent. To address this, We introduce MAGA that re-allocates training signal according to the structured action. Based on the correctness of the generated action, it suppresses unnecessary or invalid distillation signals and focuses learning on erroneous actions. Besides, a training-only hint optimizes the supervision signal provided by domain-specific teachers without changing the student input. Across two model scales, MAGA achieves the highest mean success rate, outperforming the strongest baseline by 2.0% at 8B and achieves almost the same average performance with teachers.", "arxiv_id": "2607.29320", "arxiv_url": "https://arxiv.org/abs/2607.29320", "authors": ["Hang Yan", "Zhangxuan GU", "Beitong Zhou", "Jiaxuan Chen", "Runze Li", "Yusong Hu", "Shuheng Shen", "Changhua Meng"], "brief": "\u8bba\u6587\u63d0\u51fa MAGA\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8\u3001\u7f51\u9875\u548c\u684c\u9762 GUI \u667a\u80fd\u4f53\u7684\u591a\u5e73\u53f0\u81ea\u878d\u5408\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u5316\u52a8\u4f5c\u84b8\u998f\uff0c\u5c06\u591a\u4e2a\u9886\u57df\u4e13\u7528\u6559\u5e08\u6a21\u578b\u6574\u5408\u4e3a\u4e00\u4e2a\u8de8\u73af\u5883\u7b56\u7565\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29320", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u4f20\u7edf\u6743\u91cd\u5408\u5e76\u5728\u4e13\u5bb6\u5206\u6b67\u65f6\u4f1a\u7834\u574f\u53ef\u6267\u884c\u52a8\u4f5c\u7684\u95ee\u9898\uff0cMAGA\u907f\u514d\u76f4\u63a5\u5408\u5e76\u51b2\u7a81\u7b56\u7565", "\u6839\u636e\u751f\u6210\u52a8\u4f5c\u7684\u6b63\u786e\u6027\u91cd\u65b0\u5206\u914d\u84b8\u998f\u4fe1\u53f7\uff0c\u6291\u5236\u65e0\u6548\u76d1\u7763\u5e76\u805a\u7126\u9519\u8bef\u52a8\u4f5c", "\u5f15\u5165\u4ec5\u8bad\u7ec3\u9636\u6bb5\u4f7f\u7528\u7684 hint \u6765\u4f18\u5316\u6559\u5e08\u76d1\u7763\uff0c\u5728\u4e0d\u6539\u53d8\u5b66\u751f\u8f93\u5165\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u5b66\u4e60\u6548\u679c"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u64cd\u4f5c", "\u77e5\u8bc6\u84b8\u998f", "\u591a\u5e73\u53f0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29320v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MAGA: Multi-Platform Self-Fusion of GUI Agents via Structured Action Distillation", "tldr": "MAGA\u878d\u5408\u591a\u5e73\u53f0GUI\u667a\u80fd\u4f53\u5e76\u63d0\u5347\u6210\u529f\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MAGA\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8\u3001\u7f51\u9875\u548c\u684c\u9762 GUI \u667a\u80fd\u4f53\u7684\u591a\u5e73\u53f0\u81ea\u878d\u5408\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u5316\u52a8\u4f5c\u84b8\u998f\uff0c\u5c06\u591a\u4e2a\u9886\u57df\u4e13\u7528\u6559\u5e08\u6a21\u578b\u6574\u5408\u4e3a\u4e00\u4e2a\u8de8\u73af\u5883\u7b56\u7565\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9762\u5411\u5b9e\u9645\u90e8\u7f72\u4e2d\u7684\u591a\u5e73\u53f0GUI\u667a\u80fd\u4f53\u7edf\u4e00\u9700\u6c42\uff0c\u57288B\u89c4\u6a21\u4e0a\u8f83\u6700\u5f3a\u57fa\u7ebf\u5e73\u5747\u6210\u529f\u7387\u63d0\u53472.0%\uff0c\u5e76\u63a5\u8fd1\u6559\u5e08\u6a21\u578b\u5e73\u5747\u8868\u73b0\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Tool-using LLM agents act on typed tool returns, records pairing provenance and categorical fields with numerical values. Runtime permission gates generally authorize the observed return and action, leaving the decision unprotected against small errors in how the return was bound to its source. We ask whether a candidate action stays authorized over a declared neighborhood of plausible correctly bound returns: one admissible binding fault plus bounded numerical drift. We prove that certifying the categorical and numerical channels separately does not compose: perturbations that are safe on each channel alone can jointly turn the same action unsafe. CAGE certifies this joint neighborhood directly, enumerating the discrete branches exactly and certifying the continuous perturbation within each branch. Across synthetic, policy-as-code, regulatory, and real-transaction settings, CAGE removes the in-budget false allows that accurate pointwise gates admit, while keeping a useful fraction of decisions autonomous. When the policy is executable, CAGE-Exact certifies the policy itself; otherwise CAGE-Lip and CAGE-RS certify a learned gate under an explicit, measured fidelity assumption.", "arxiv_id": "2607.29190", "arxiv_url": "https://arxiv.org/abs/2607.29190", "authors": ["Blaise Delattre", "Cong Wang", "Yang Cao"], "brief": "\u672c\u6587\u63d0\u51fa CAGE\uff0c\u7528\u4e8e\u9a8c\u8bc1\u5de5\u5177\u8c03\u7528\u578b LLM \u667a\u80fd\u4f53\u7684\u5019\u9009\u52a8\u4f5c\u5728\u201c\u7c7b\u578b\u5316\u8fd4\u56de\u503c\u201d\u5b58\u5728\u6765\u6e90\u7ed1\u5b9a\u9519\u8bef\u548c\u6570\u503c\u6f02\u79fb\u65f6\u4ecd\u662f\u5426\u88ab\u6388\u6743\u3002\u5b83\u76f4\u63a5\u5bf9\u79bb\u6563\u7c7b\u522b\u5206\u652f\u4e0e\u8fde\u7eed\u6570\u503c\u6270\u52a8\u7684\u8054\u5408\u90bb\u57df\u8fdb\u884c\u8ba4\u8bc1\uff0c\u800c\u975e\u5206\u522b\u68c0\u67e5\u540e\u7b80\u5355\u7ec4\u5408\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29190", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc1\u660e\u7c7b\u522b\u901a\u9053\u4e0e\u6570\u503c\u901a\u9053\u7684\u72ec\u7acb\u5b89\u5168\u8ba4\u8bc1\u4e0d\u53ef\u7ec4\u5408\uff1a\u5404\u81ea\u5b89\u5168\u7684\u6270\u52a8\u8054\u5408\u540e\u53ef\u80fd\u5bfc\u81f4\u672a\u6388\u6743\u52a8\u4f5c\u88ab\u653e\u884c\u3002", "CAGE \u7cbe\u786e\u679a\u4e3e\u79bb\u6563\u7ed1\u5b9a/\u7c7b\u522b\u5206\u652f\uff0c\u5e76\u5728\u6bcf\u4e2a\u5206\u652f\u5185\u8ba4\u8bc1\u8fde\u7eed\u6570\u503c\u6270\u52a8\u8303\u56f4\u3002", "\u5728\u5408\u6210\u4efb\u52a1\u3001policy-as-code\u3001\u76d1\u7ba1\u89c4\u5219\u548c\u771f\u5b9e\u4ea4\u6613\u573a\u666f\u4e2d\uff0cCAGE \u80fd\u6d88\u9664\u70b9\u5f0f\u6743\u9650\u95e8\u4ea7\u751f\u7684\u9884\u7b97\u5185\u8bef\u653e\u884c\uff0c\u540c\u65f6\u4fdd\u7559\u4e00\u5b9a\u81ea\u4e3b\u51b3\u7b56\u6bd4\u4f8b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u5b89\u5168\u8ba4\u8bc1", "\u8bbf\u95ee\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29190v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CAGE: Certified Authorization under Typed-Return Uncertainty for Tool-Using Agents", "tldr": "\u4e3a\u5de5\u5177\u578b\u667a\u80fd\u4f53\u63d0\u4f9b\u6297\u7ed1\u5b9a\u8bef\u5dee\u7684\u6388\u6743\u8ba4\u8bc1\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa CAGE\uff0c\u7528\u4e8e\u9a8c\u8bc1\u5de5\u5177\u8c03\u7528\u578b LLM \u667a\u80fd\u4f53\u7684\u5019\u9009\u52a8\u4f5c\u5728\u201c\u7c7b\u578b\u5316\u8fd4\u56de\u503c\u201d\u5b58\u5728\u6765\u6e90\u7ed1\u5b9a\u9519\u8bef\u548c\u6570\u503c\u6f02\u79fb\u65f6\u4ecd\u662f\u5426\u88ab\u6388\u6743\u3002\u5b83\u76f4\u63a5\u5bf9\u79bb\u6563\u7c7b\u522b\u5206\u652f\u4e0e\u8fde\u7eed\u6570\u503c\u6270\u52a8\u7684\u8054\u5408\u90bb\u57df\u8fdb\u884c\u8ba4\u8bc1\uff0c\u800c\u975e\u5206\u522b\u68c0\u67e5\u540e\u7b80\u5355\u7ec4\u5408\u3002", "why_notable": "\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u8d8a\u6765\u8d8a\u4f9d\u8d56\u5916\u90e8\u8fd4\u56de\u503c\u505a\u9ad8\u98ce\u9669\u51b3\u7b56\uff0cCAGE \u5c06\u6388\u6743\u4ece\u201c\u89c2\u5bdf\u5230\u7684\u5355\u70b9\u8fd4\u56de\u201d\u63d0\u5347\u5230\u201c\u53ef\u89e3\u91ca\u6270\u52a8\u90bb\u57df\u5185\u7684\u53ef\u8ba4\u8bc1\u5b89\u5168\u201d\uff0c\u5bf9\u91d1\u878d\u3001\u5408\u89c4\u3001\u81ea\u52a8\u5316\u64cd\u4f5c\u7b49\u573a\u666f\u5177\u6709\u5b9e\u9645\u5b89\u5168\u4ef7\u503c\u3002"}, {"abstract": "Long-term memory lets large language model(LLM) agents reuse prior preferences and work flows, but it also turns untrusted observations into persistent action context. We identify memory provenance laundering: during LLM-based memory consolidation, an external observation may be rewritten as apparent user history or workflow support, preserving an action trigger while erasing the low-trust source that should limit its authority. Existing prompt filters, content sanitizers, and tool guards do not enforce source-authority non-amplification after lossy memory consolidation. We formalize this boundary and instantiate it as Provenance-Preserving Memory Fire wall (PPMF), a lightweight memory middleware that preserves platform-maintained provenance and authorizes tool calls by matching action risk to the authority of action-relevant memories. In our schema-grounded evaluation with fixed risk policies, vulnerable consolidated memories reach up to 1.000 attack success rate(ASR); with intact platform-maintained provenance, confirmation, and risk labels, no evaluated unauthorized high-risk action passes the PPMF gate while confirmed benign actions and targeted low-risk memory use remain executable.", "arxiv_id": "2607.29167", "arxiv_url": "https://arxiv.org/abs/2607.29167", "authors": ["Jinghan Xu", "Yiyong Xiao", "Wanru Shao", "Hankai Liu", "Xinjin Li"], "brief": "\u8bba\u6587\u8bc6\u522b\u4e86 LLM \u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u4e2d\u7684\u201c\u8bb0\u5fc6\u6765\u6e90\u6d17\u767d\u201d\u98ce\u9669\uff1a\u4e0d\u53ef\u4fe1\u5916\u90e8\u89c2\u5bdf\u5728\u8bb0\u5fc6\u6574\u5408\u540e\u88ab\u6539\u5199\u6210\u53ef\u4fe1\u7528\u6237\u5386\u53f2\u6216\u5de5\u4f5c\u6d41\u4f9d\u636e\u3002\u4f5c\u8005\u63d0\u51fa Provenance-Preserving Memory Firewall\uff08PPMF\uff09\uff0c\u5728\u8bb0\u5fc6\u4e2d\u4fdd\u7559\u5e73\u53f0\u7ef4\u62a4\u7684\u6765\u6e90\u4fe1\u606f\uff0c\u5e76\u6309\u884c\u52a8\u98ce\u9669\u4e0e\u8bb0\u5fc6\u6743\u9650\u5339\u914d\u6765\u62e6\u622a\u5de5\u5177\u8c03\u7528\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29167", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5f62\u5f0f\u5316\u4e86\u8bb0\u5fc6\u6574\u5408\u4e2d\u7684\u6765\u6e90\u6743\u9650\u975e\u653e\u5927\u8fb9\u754c\uff0c\u6307\u51fa\u73b0\u6709\u63d0\u793a\u8fc7\u6ee4\u3001\u5185\u5bb9\u6e05\u6d17\u548c\u5de5\u5177\u5b88\u536b\u65e0\u6cd5\u89e3\u51b3\u6765\u6e90\u4e22\u5931\u540e\u7684\u6743\u9650\u653e\u5927\u95ee\u9898", "PPMF \u4f5c\u4e3a\u8f7b\u91cf\u7ea7\u8bb0\u5fc6\u4e2d\u95f4\u4ef6\uff0c\u4fdd\u7559\u6765\u6e90\u3001\u786e\u8ba4\u72b6\u6001\u548c\u98ce\u9669\u6807\u7b7e\uff0c\u5e76\u5728\u5de5\u5177\u8c03\u7528\u524d\u8fdb\u884c\u6388\u6743\u68c0\u67e5", "\u5b9e\u9a8c\u4e2d\u8106\u5f31\u7684\u6574\u5408\u8bb0\u5fc6\u6700\u9ad8\u8fbe\u5230 1.000 \u653b\u51fb\u6210\u529f\u7387\uff1b\u542f\u7528\u5b8c\u6574\u6765\u6e90\u4fe1\u606f\u4e0e PPMF \u540e\uff0c\u672a\u6388\u6743\u9ad8\u98ce\u9669\u52a8\u4f5c\u5747\u88ab\u62e6\u622a"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "AI\u5b89\u5168", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29167v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Memory Provenance Laundering in LLM Agents: A Non-Amplification Firewall for Persistent Memory", "tldr": "\u9632\u6b62\u667a\u80fd\u4f53\u8bb0\u5fc6\u6d17\u767d\u5bfc\u81f4\u8d8a\u6743\u884c\u52a8", "upvotes": 0, "what_it_is": "\u8bba\u6587\u8bc6\u522b\u4e86 LLM \u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u4e2d\u7684\u201c\u8bb0\u5fc6\u6765\u6e90\u6d17\u767d\u201d\u98ce\u9669\uff1a\u4e0d\u53ef\u4fe1\u5916\u90e8\u89c2\u5bdf\u5728\u8bb0\u5fc6\u6574\u5408\u540e\u88ab\u6539\u5199\u6210\u53ef\u4fe1\u7528\u6237\u5386\u53f2\u6216\u5de5\u4f5c\u6d41\u4f9d\u636e\u3002\u4f5c\u8005\u63d0\u51fa Provenance-Preserving Memory Firewall\uff08PPMF\uff09\uff0c\u5728\u8bb0\u5fc6\u4e2d\u4fdd\u7559\u5e73\u53f0\u7ef4\u62a4\u7684\u6765\u6e90\u4fe1\u606f\uff0c\u5e76\u6309\u884c\u52a8\u98ce\u9669\u4e0e\u8bb0\u5fc6\u6743\u9650\u5339\u914d\u6765\u62e6\u622a\u5de5\u5177\u8c03\u7528\u3002", "why_notable": "\u957f\u671f\u8bb0\u5fc6\u662f LLM agent \u5b9e\u7528\u5316\u7684\u91cd\u8981\u80fd\u529b\uff0c\u4f46\u4e5f\u4f1a\u628a\u4e00\u6b21\u6027\u4e0d\u53ef\u4fe1\u8f93\u5165\u56fa\u5316\u4e3a\u672a\u6765\u884c\u52a8\u4f9d\u636e\u3002\u8be5\u5de5\u4f5c\u628a\u8bb0\u5fc6\u5b89\u5168\u4ece\u5185\u5bb9\u8fc7\u6ee4\u63a8\u8fdb\u5230\u6765\u6e90\u6743\u9650\u63a7\u5236\uff0c\u5bf9\u6301\u4e45\u8bb0\u5fc6\u667a\u80fd\u4f53\u3001\u4f01\u4e1a\u81ea\u52a8\u5316\u548c\u9ad8\u98ce\u9669\u5de5\u5177\u8c03\u7528\u5177\u6709\u76f4\u63a5\u5b89\u5168\u4ef7\u503c\u3002"}, {"abstract": "Large language model agents have shown promising capabilities in data-driven scientific discovery tasks, where an agent interacts with an execution environment and produces a statistical claim. Long-horizon scientific analysis remains constrained by the lack of process supervised environments over real-world scientific data. This paper introduces SciDisco, a scalable framework for training Scientific Discovery agents in process-verifiable environments. SciTh\u00e8que compiles hypotheses, datasets, hidden evidence graphs, and verifiers into task environments where analytical progress can be checked during interaction. DAG-grounded trajectory synthesis uses these environments to construct verifier-filtered multi-turn demonstrations. DiscoPO then uses the environment as the source of training signal, assigning turn-level credit to actions that produce verifiable analytical evidence. Experiments show that SciDisco-14B reaches state-of-the-art on hypothesis-driven scientific data analysis benchmarks.", "arxiv_id": "2607.28990", "arxiv_url": "https://arxiv.org/abs/2607.28990", "authors": ["Yucheng Xu", "Keyi Zhang", "Yuyang Yu", "Min Zhang", "Shiyuan Meng", "Pei Chu", "Zhongying Tu"], "brief": "\u8bba\u6587\u63d0\u51fa SciDisco\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u53d1\u73b0\u667a\u80fd\u4f53\u7684\u53ef\u6269\u5c55\u8bad\u7ec3\u6846\u67b6\uff0c\u5728\u771f\u5b9e\u79d1\u5b66\u6570\u636e\u73af\u5883\u4e2d\u63d0\u4f9b\u8fc7\u7a0b\u7ea7\u53ef\u9a8c\u8bc1\u53cd\u9988\u3002\u5176\u7ec4\u4ef6 SciTh\u00e8que \u6784\u5efa\u5047\u8bbe\u3001\u6570\u636e\u96c6\u3001\u9690\u85cf\u8bc1\u636e\u56fe\u4e0e\u9a8c\u8bc1\u5668\uff0c\u7ed3\u5408\u8f68\u8ff9\u5408\u6210\u548c DiscoPO \u5b9e\u73b0\u591a\u8f6e\u5206\u6790\u4e2d\u7684\u56de\u5408\u7ea7\u4fe1\u7528\u5206\u914d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28990", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["SciTh\u00e8que \u5c06\u79d1\u5b66\u5047\u8bbe\u3001\u6570\u636e\u3001\u9690\u85cf\u8bc1\u636e\u56fe\u548c\u9a8c\u8bc1\u5668\u6253\u5305\u6210\u53ef\u4ea4\u4e92\u4efb\u52a1\u73af\u5883\uff0c\u4f7f\u5206\u6790\u8fc7\u7a0b\u4e2d\u7684\u4e2d\u95f4\u8fdb\u5c55\u53ef\u88ab\u81ea\u52a8\u68c0\u67e5\u3002", "DAG-grounded trajectory synthesis \u57fa\u4e8e\u8bc1\u636e\u56fe\u751f\u6210\u5e76\u7b5b\u9009\u591a\u8f6e\u793a\u8303\u8f68\u8ff9\uff0c\u63d0\u5347\u957f\u7a0b\u79d1\u7814\u5206\u6790\u8bad\u7ec3\u6570\u636e\u8d28\u91cf\u3002", "DiscoPO \u76f4\u63a5\u5229\u7528\u73af\u5883\u9a8c\u8bc1\u4fe1\u53f7\uff0c\u4e3a\u4ea7\u751f\u53ef\u9a8c\u8bc1\u5206\u6790\u8bc1\u636e\u7684\u52a8\u4f5c\u5206\u914d turn-level \u5956\u52b1\uff1bSciDisco-14B \u5728\u5047\u8bbe\u9a71\u52a8\u79d1\u5b66\u6570\u636e\u5206\u6790\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\u6c34\u5e73\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u79d1\u5b66\u53d1\u73b0", "\u8fc7\u7a0b\u76d1\u7763"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28990v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Scaling Scientific Discovery Environments for Turn-Level Agentic RL", "tldr": "SciDisco\u7528\u53ef\u9a8c\u8bc1\u73af\u5883\u8bad\u7ec3\u79d1\u7814\u53d1\u73b0\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SciDisco\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u53d1\u73b0\u667a\u80fd\u4f53\u7684\u53ef\u6269\u5c55\u8bad\u7ec3\u6846\u67b6\uff0c\u5728\u771f\u5b9e\u79d1\u5b66\u6570\u636e\u73af\u5883\u4e2d\u63d0\u4f9b\u8fc7\u7a0b\u7ea7\u53ef\u9a8c\u8bc1\u53cd\u9988\u3002\u5176\u7ec4\u4ef6 SciTh\u00e8que \u6784\u5efa\u5047\u8bbe\u3001\u6570\u636e\u96c6\u3001\u9690\u85cf\u8bc1\u636e\u56fe\u4e0e\u9a8c\u8bc1\u5668\uff0c\u7ed3\u5408\u8f68\u8ff9\u5408\u6210\u548c DiscoPO \u5b9e\u73b0\u591a\u8f6e\u5206\u6790\u4e2d\u7684\u56de\u5408\u7ea7\u4fe1\u7528\u5206\u914d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u79d1\u5b66\u6570\u636e\u5206\u6790\u4ece\u53ea\u8bc4\u6700\u7ec8\u7b54\u6848\u63a8\u8fdb\u5230\u8fc7\u7a0b\u53ef\u76d1\u7763\u3001\u53ef\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u7684\u73af\u5883\u8303\u5f0f\uff0c\u6709\u52a9\u4e8e\u8bad\u7ec3\u66f4\u53ef\u9760\u7684\u957f\u7a0b\u79d1\u7814\u667a\u80fd\u4f53\uff0c\u5e76\u53ef\u80fd\u6269\u5c55\u5230\u771f\u5b9e\u79d1\u7814\u5de5\u4f5c\u6d41\u4e2d\u7684\u81ea\u52a8\u5047\u8bbe\u9a8c\u8bc1\u4e0e\u8bc1\u636e\u53d1\u73b0\u3002"}, {"abstract": "Large language model (LLM) agents increasingly operate over long interaction histories, where effective reasoning requires identifying and exploiting task-relevant evidence distributed across past observations and actions. However, useful information encoded in previously computed representations is often underutilized during subsequent generation. We propose \\textbf{TransMem}, a lightweight inference-time parametric memory module that transforms sparse historical hidden states from a frozen LLM backbone into reusable memory representations. TransMem uses a lightweight gating network to dynamically apply the latent intervention to the current hidden states, without repeatedly encoding the preceding context. To learn transferable memory utilization rather than task-specific knowledge, we introduce evidence-conditioned self-distillation. A memory-augmented student processes the full context and matches the predictive distribution of an evidence-only teacher that shares the same frozen backbone. Experiments on LoCoMo, HotpotQA, and MemoryAgentBench demonstrate consistent improvements across different model architectures and scales. TransMem yields gains of 11.58--29.25 $F_1$ on LoCoMo and 10.20--13.03 $F_1$ on HotpotQA, while improving the average MemoryAgentBench accuracy from 29.54\\% to 40.00\\%. These results establish sparse historical hidden states as an effective and efficient memory substrate for long-context LLM agents. Our code is available at https://github.com/Haodong-Lei-Ray/TransMem.", "arxiv_id": "2607.29032", "arxiv_url": "https://arxiv.org/abs/2607.29032", "authors": ["Haodong Lei", "Junming Liu", "Yirong Chen", "Pinlong Cai", "Botian Shi", "Ding Wang", "Hongsong Wang"], "brief": "TransMem \u662f\u4e00\u79cd\u8f7b\u91cf\u7ea7\u63a8\u7406\u65f6\u53c2\u6570\u5316\u8bb0\u5fc6\u6a21\u5757\uff0c\u53ef\u628a\u51bb\u7ed3 LLM \u4e2d\u7a00\u758f\u5386\u53f2\u9690\u85cf\u72b6\u6001\u8f6c\u6362\u4e3a\u5f53\u524d\u751f\u6210\u53ef\u7528\u7684\u8bb0\u5fc6\u8868\u793a\u3002\u5b83\u901a\u8fc7\u95e8\u63a7\u7f51\u7edc\u52a8\u6001\u5e72\u9884\u5f53\u524d\u9690\u85cf\u72b6\u6001\uff0c\u5e76\u7528\u8bc1\u636e\u6761\u4ef6\u81ea\u84b8\u998f\u5b66\u4e60\u8de8\u4efb\u52a1\u7684\u8bb0\u5fc6\u5229\u7528\u80fd\u529b\u3002", "categories": ["cs.MA", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29032", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u65e0\u9700\u53cd\u590d\u91cd\u7f16\u7801\u5b8c\u6574\u5386\u53f2\u4e0a\u4e0b\u6587\uff0c\u76f4\u63a5\u5229\u7528\u5df2\u8ba1\u7b97\u7684\u7a00\u758f\u5386\u53f2\u9690\u85cf\u72b6\u6001\u4f5c\u4e3a\u8bb0\u5fc6\u57fa\u5e95\u3002", "\u63d0\u51fa\u8bc1\u636e\u6761\u4ef6\u81ea\u84b8\u998f\uff1a\u8bb0\u5fc6\u589e\u5f3a\u5b66\u751f\u6a21\u578b\u5339\u914d\u53ea\u770b\u5173\u952e\u8bc1\u636e\u7684\u6559\u5e08\u6a21\u578b\u5206\u5e03\uff0c\u4ee5\u5b66\u4e60\u5982\u4f55\u4f7f\u7528\u8bb0\u5fc6\u800c\u975e\u8bb0\u5fc6\u4efb\u52a1\u7b54\u6848\u3002", "\u5728 LoCoMo\u3001HotpotQA\u3001MemoryAgentBench \u4e0a\u7a33\u5b9a\u63d0\u5347\uff0cLoCoMo \u63d0\u5347 11.58\u201329.25 F1\uff0cMemoryAgentBench \u5e73\u5747\u51c6\u786e\u7387\u4ece 29.54% \u63d0\u5347\u5230 40.00%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u4e0a\u4e0b\u6587", "\u8bb0\u5fc6\u673a\u5236", "\u81ea\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29032v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TransMem: Transforming Hidden States into Memory for Large Language Models", "tldr": "\u5c06\u5386\u53f2\u9690\u85cf\u72b6\u6001\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u667a\u80fd\u4f53\u8bb0\u5fc6\u3002", "upvotes": 0, "what_it_is": "TransMem \u662f\u4e00\u79cd\u8f7b\u91cf\u7ea7\u63a8\u7406\u65f6\u53c2\u6570\u5316\u8bb0\u5fc6\u6a21\u5757\uff0c\u53ef\u628a\u51bb\u7ed3 LLM \u4e2d\u7a00\u758f\u5386\u53f2\u9690\u85cf\u72b6\u6001\u8f6c\u6362\u4e3a\u5f53\u524d\u751f\u6210\u53ef\u7528\u7684\u8bb0\u5fc6\u8868\u793a\u3002\u5b83\u901a\u8fc7\u95e8\u63a7\u7f51\u7edc\u52a8\u6001\u5e72\u9884\u5f53\u524d\u9690\u85cf\u72b6\u6001\uff0c\u5e76\u7528\u8bc1\u636e\u6761\u4ef6\u81ea\u84b8\u998f\u5b66\u4e60\u8de8\u4efb\u52a1\u7684\u8bb0\u5fc6\u5229\u7528\u80fd\u529b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u957f\u4ea4\u4e92\u5386\u53f2\u4e0b\u7684 LLM \u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u4e00\u79cd\u9ad8\u6548\u8bb0\u5fc6\u673a\u5236\uff0c\u51cf\u5c11\u4e0a\u4e0b\u6587\u91cd\u7f16\u7801\u6210\u672c\uff0c\u540c\u65f6\u663e\u8457\u63d0\u5347\u591a\u8df3\u95ee\u7b54\u4e0e\u8bb0\u5fc6\u578b\u667a\u80fd\u4f53\u4efb\u52a1\u8868\u73b0\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models have demonstrated strong mathematical problem-solving capabilities, yet reliably verifying their candidate answers remains challenging. Existing representative methods mainly revise outputs through natural-language reflection or assist verification by directly generating verification programs; the former may not reliably support exact computation, whereas the latter prematurely couples mathematical modeling with low-level implementation. We propose AMTFV (Agentic Mathematical Tool-Flow Verification). By introducing Mathematical Tool Flow (MTF) as an interrupt--execute--resume interface, AMTFV decouples verification modeling from concrete execution and supports exact computation through a mathematical toolbox. Specifically, the verification agent first constructs a verification workflow, encodes the mathematical objects and computational intent requiring reliable execution in an MTF request, and sends it to the mathematical toolbox agent. The latter parses the request, generates executable calls, and dispatches them to the backend for exact computation. Tool outputs then support candidate-answer adjudication, answer revision, and verification-workflow revision. We evaluate AMTFV on five challenging mathematical reasoning datasets with seven model configurations from DeepSeek, GPT, and Gemini. Experimental results show that AMTFV outperforms the representative baselines evaluated in this study overall; under an individual model configuration, it improves average accuracy over the strongest baseline by up to 8.3 percentage points, with larger gains on samples of medium and high verification complexity.", "arxiv_id": "2607.29549", "arxiv_url": "https://arxiv.org/abs/2607.29549", "authors": ["Rui Zou", "Yutao Zhu", "Mengqi Wei", "Ji-Rong Wen"], "brief": "\u8bba\u6587\u63d0\u51fa AMTFV\uff0c\u4e00\u79cd\u9762\u5411\u6570\u5b66\u63a8\u7406\u81ea\u7ea0\u9519\u7684\u667a\u80fd\u4f53\u9a8c\u8bc1\u6846\u67b6\u3002\u5b83\u901a\u8fc7 Mathematical Tool Flow \u5c06\u9ad8\u5c42\u9a8c\u8bc1\u5efa\u6a21\u4e0e\u5e95\u5c42\u53ef\u6267\u884c\u8ba1\u7b97\u89e3\u8026\uff0c\u8ba9\u6a21\u578b\u8c03\u7528\u6570\u5b66\u5de5\u5177\u7bb1\u8fdb\u884c\u7cbe\u786e\u8ba1\u7b97\u5e76\u636e\u6b64\u88c1\u5b9a\u3001\u4fee\u6b63\u7b54\u6848\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29549", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa MTF interrupt-execute-resume \u63a5\u53e3\uff1a\u9a8c\u8bc1\u667a\u80fd\u4f53\u5148\u63cf\u8ff0\u6570\u5b66\u5bf9\u8c61\u4e0e\u8ba1\u7b97\u610f\u56fe\uff0c\u518d\u7531\u5de5\u5177\u7bb1\u667a\u80fd\u4f53\u89e3\u6790\u5e76\u751f\u6210\u53ef\u6267\u884c\u8c03\u7528\u3002", "\u652f\u6301\u5019\u9009\u7b54\u6848\u88c1\u5b9a\u3001\u7b54\u6848\u4fee\u8ba2\u548c\u9a8c\u8bc1\u6d41\u7a0b\u4fee\u8ba2\uff0c\u907f\u514d\u4ec5\u9760\u81ea\u7136\u8bed\u8a00\u53cd\u601d\u6216\u76f4\u63a5\u751f\u6210\u9a8c\u8bc1\u7a0b\u5e8f\u7684\u5c40\u9650\u3002", "\u5728\u4e94\u4e2a\u9ad8\u96be\u6570\u5b66\u63a8\u7406\u6570\u636e\u96c6\u3001\u4e03\u79cd DeepSeek/GPT/Gemini \u914d\u7f6e\u4e0a\u8bc4\u6d4b\uff0c\u5355\u6a21\u578b\u4e0b\u8f83\u6700\u5f3a\u57fa\u7ebf\u5e73\u5747\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u5347 8.3 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u5b66\u63a8\u7406", "\u5de5\u5177\u8c03\u7528", "\u81ea\u6211\u7ea0\u9519"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29549v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AMTFV: Agentic Mathematical Tool-Flow Verification for LLM Self-Correction", "tldr": "\u7528\u6570\u5b66\u5de5\u5177\u6d41\u63d0\u5347LLM\u7b54\u6848\u81ea\u6821\u9a8c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AMTFV\uff0c\u4e00\u79cd\u9762\u5411\u6570\u5b66\u63a8\u7406\u81ea\u7ea0\u9519\u7684\u667a\u80fd\u4f53\u9a8c\u8bc1\u6846\u67b6\u3002\u5b83\u901a\u8fc7 Mathematical Tool Flow \u5c06\u9ad8\u5c42\u9a8c\u8bc1\u5efa\u6a21\u4e0e\u5e95\u5c42\u53ef\u6267\u884c\u8ba1\u7b97\u89e3\u8026\uff0c\u8ba9\u6a21\u578b\u8c03\u7528\u6570\u5b66\u5de5\u5177\u7bb1\u8fdb\u884c\u7cbe\u786e\u8ba1\u7b97\u5e76\u636e\u6b64\u88c1\u5b9a\u3001\u4fee\u6b63\u7b54\u6848\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6570\u5b66\u9a8c\u8bc1\u4ece\u201c\u5199\u4ee3\u7801\u9a8c\u8bc1\u201d\u63d0\u5347\u4e3a\u7ed3\u6784\u5316\u5de5\u5177\u6d41\u534f\u4f5c\uff0c\u517c\u987e\u7cbe\u786e\u8ba1\u7b97\u4e0e\u9ad8\u5c42\u5efa\u6a21\u7075\u6d3b\u6027\uff0c\u5bf9\u63d0\u5347 LLM \u6570\u5b66\u53ef\u9760\u6027\u548c\u81ea\u7ea0\u9519\u80fd\u529b\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Automated vulnerability repair aims to reduce the time and effort required to patch security flaws from a vulnerability triage report. Recent agentic AI approaches have shown promising results in automated program repair. However, vulnerability repair demands richer program context than general bug repair - context that security engineers routinely assemble in practice but that existing agentic approaches do not engineer. We identify three critical gaps: code-structure context capturing cross-file data flows and memory operation patterns, runtime-execution context revealing crash semantics and memory origins, and commit-history context recovering how fragile code patterns were introduced. We present AgenticRepair, an agentic vulnerability repair framework that addresses the gaps through multi-faceted program context engineering. AgenticRepair orchestrates three specialized LLM subagents to engineer the contexts, which are then embedded into the memory of a dedicated repair subagent for context-conditioned patch synthesis. Evaluated on SEC-Bench comprising 300 real-world instances with sanitizer-based patch verification, AgenticRepair achieves a 73% success rate, substantially outperforming the strongest baseline by 29%. Our ablation study confirms that the three context facets are mutually complementary, and that multi-agent scaffolding and base-model capacity each play an essential role. Collectively, these findings establish multi-faceted program context engineering as a promising design direction for agentic vulnerability repair.", "arxiv_id": "2607.29422", "arxiv_url": "https://arxiv.org/abs/2607.29422", "authors": ["Michael Fu", "Qiyue Mei", "Patanamon Thongtanunam", "Kla Tantithamthavorn"], "brief": "\u672c\u6587\u63d0\u51fa AgenticRepair\uff0c\u4e00\u4e2a\u9762\u5411\u5b89\u5168\u6f0f\u6d1e\u4fee\u590d\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4ee3\u7801\u7ed3\u6784\u3001\u8fd0\u884c\u65f6\u6267\u884c\u3001\u63d0\u4ea4\u5386\u53f2\u4e09\u7c7b\u7a0b\u5e8f\u4e0a\u4e0b\u6587\u5de5\u7a0b\uff0c\u4e3a\u4e13\u95e8\u7684\u4fee\u590d\u5b50\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u5145\u5206\u4fe1\u606f\u4ee5\u751f\u6210\u8865\u4e01\u3002", "categories": ["cs.SE", "cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29422", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc6\u522b\u51fa\u6f0f\u6d1e\u4fee\u590d\u76f8\u8f83\u666e\u901a\u7f3a\u9677\u4fee\u590d\u66f4\u4f9d\u8d56\u4e09\u7c7b\u4e0a\u4e0b\u6587\uff1a\u8de8\u6587\u4ef6\u6570\u636e\u6d41\u4e0e\u5185\u5b58\u64cd\u4f5c\u6a21\u5f0f\u3001\u5d29\u6e83\u8bed\u4e49\u4e0e\u5185\u5b58\u6765\u6e90\u3001\u8106\u5f31\u4ee3\u7801\u6a21\u5f0f\u7684\u5f15\u5165\u5386\u53f2\u3002", "\u6846\u67b6\u7f16\u6392\u4e09\u4e2a\u4e13\u95e8\u7684 LLM \u5b50\u667a\u80fd\u4f53\u5206\u522b\u6784\u5efa\u4e0a\u4e0b\u6587\uff0c\u5e76\u5c06\u5176\u5d4c\u5165\u4fee\u590d\u5b50\u667a\u80fd\u4f53\u8bb0\u5fc6\u4e2d\u8fdb\u884c\u6761\u4ef6\u5316\u8865\u4e01\u5408\u6210\u3002", "\u5728\u5305\u542b 300 \u4e2a\u771f\u5b9e\u6f0f\u6d1e\u5b9e\u4f8b\u7684 SEC-Bench \u4e0a\uff0c\u7ed3\u5408 sanitizer \u9a8c\u8bc1\uff0c\u4fee\u590d\u6210\u529f\u7387\u8fbe 73%\uff0c\u6bd4\u6700\u5f3a\u57fa\u7ebf\u9ad8 29%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u4fee\u590d", "\u8f6f\u4ef6\u5b89\u5168", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29422v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AgenticRepair: Multi-Faceted Program Context Engineering for Agentic Vulnerability Repair", "tldr": "\u591a\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u5de5\u7a0b\u63d0\u5347\u6f0f\u6d1e\u81ea\u52a8\u4fee\u590d", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa AgenticRepair\uff0c\u4e00\u4e2a\u9762\u5411\u5b89\u5168\u6f0f\u6d1e\u4fee\u590d\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4ee3\u7801\u7ed3\u6784\u3001\u8fd0\u884c\u65f6\u6267\u884c\u3001\u63d0\u4ea4\u5386\u53f2\u4e09\u7c7b\u7a0b\u5e8f\u4e0a\u4e0b\u6587\u5de5\u7a0b\uff0c\u4e3a\u4e13\u95e8\u7684\u4fee\u590d\u5b50\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u5145\u5206\u4fe1\u606f\u4ee5\u751f\u6210\u8865\u4e01\u3002", "why_notable": "\u8bba\u6587\u5c06\u5b89\u5168\u5de5\u7a0b\u5e08\u5b9e\u9645\u4fee\u590d\u6f0f\u6d1e\u65f6\u4f9d\u8d56\u7684\u591a\u7ef4\u7a0b\u5e8f\u4e0a\u4e0b\u6587\u7cfb\u7edf\u5316\u5f15\u5165 LLM \u667a\u80fd\u4f53\u4fee\u590d\u6d41\u7a0b\uff0c\u663e\u8457\u63d0\u5347\u771f\u5b9e\u6f0f\u6d1e\u81ea\u52a8\u8865\u4e01\u751f\u6210\u6548\u679c\uff0c\u5bf9\u81ea\u52a8\u7a0b\u5e8f\u4fee\u590d\u4e0e\u5b89\u5168\u6f0f\u6d1e\u6cbb\u7406\u90fd\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Modern neuroscience relies on integrating multi-scale, multimodal datasets to uncover the neural principles underlying intelligence. However, analytical challenges posed by highly heterogeneous data and fragmented workflows increasingly constrain discoveries. Here we introduce SeekBrain, an autonomous multi-agent framework designed to accelerate neuroscience discovery through domain-grounded hierarchical planning and cross-modal data analysis. SeekBrain dynamically constructs a repertoire of analysis recipes extracted from code-paper pairs. By coupling this codified expertise with agentic planning and execution engines, the framework scalably generates hypotheses and analytical pipelines on demand. Systematic evaluation on the expert-annotated BrainArena benchmark demonstrates that SeekBrain substantially outperforms state-of-the-art agent baselines across various analysis tasks. Crucially, when deployed in real-world research, SeekBrain integrated behavioral, neural, and anatomical data to reveal structured, distributed neural representations of larval zebrafish behavior and a shared axis of regional decoding strength across the brain in a mouse decision-making task. These results establish SeekBrain as a scalable and practical tool for accelerating data-driven discoveries in neuroscience.", "arxiv_id": "2607.29347", "arxiv_url": "https://arxiv.org/abs/2607.29347", "authors": ["Jiamin Wu", "Peishan Xiang", "Jingyang Chen", "Yuqing Zhu", "Yuxi Li", "Ling Luo", "Qihao Zheng", "Jialiang Zu", "Yongchao Wu", "Mindong Liu", "Haitao Wu", "Chaofan Hu", "Yijie Sun", "Yuqi Hang", "Yu Zhu", "Shuo Li", "Yue Fan", "Shiyang Feng", "Wanghan Xu", "Tianlei Zhang", "Jie Zhang", "Wenlong Zhang", "Bo Zhang", "Kai Wang", "Lei Bai", "Mianxin Liu", "Wanli Ouyang", "Jiulin Du", "Chunfeng Song"], "brief": "SeekBrain \u662f\u4e00\u4e2a\u9762\u5411\u795e\u7ecf\u79d1\u5b66\u7684\u81ea\u4e3b\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u9886\u57df\u5316\u5c42\u7ea7\u89c4\u5212\u4e0e\u8de8\u6a21\u6001\u6570\u636e\u5206\u6790\uff0c\u81ea\u52a8\u751f\u6210\u5047\u8bbe\u548c\u5206\u6790\u6d41\u7a0b\u3002\u5b83\u4ece\u4ee3\u7801-\u8bba\u6587\u914d\u5bf9\u4e2d\u63d0\u53d6\u5206\u6790\u201c\u914d\u65b9\u201d\uff0c\u5e76\u7ed3\u5408\u667a\u80fd\u4f53\u89c4\u5212\u4e0e\u6267\u884c\u5f15\u64ce\u7528\u4e8e\u771f\u5b9e\u79d1\u7814\u4efb\u52a1\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29347", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u52a8\u6001\u6784\u5efa\u6765\u81ea\u4ee3\u7801-\u8bba\u6587\u5bf9\u7684\u5206\u6790\u65b9\u6cd5\u5e93\uff0c\u5c06\u4e13\u5bb6\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u6d41\u7a0b", "\u5728\u4e13\u5bb6\u6807\u6ce8\u7684 BrainArena \u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u667a\u80fd\u4f53\u57fa\u7ebf", "\u5728\u771f\u5b9e\u7814\u7a76\u4e2d\u6574\u5408\u884c\u4e3a\u3001\u795e\u7ecf\u548c\u89e3\u5256\u6570\u636e\uff0c\u53d1\u73b0\u6591\u9a6c\u9c7c\u884c\u4e3a\u7684\u5206\u5e03\u5f0f\u795e\u7ecf\u8868\u5f81\u53ca\u5c0f\u9f20\u51b3\u7b56\u4efb\u52a1\u4e2d\u7684\u5171\u4eab\u89e3\u7801\u8f74"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u53d1\u73b0", "\u795e\u7ecf\u79d1\u5b66", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29347v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SeekBrain: An Autonomous Multi-Agent System for Accelerating Neuroscience Discovery", "tldr": "\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u52a0\u901f\u795e\u7ecf\u79d1\u5b66\u53d1\u73b0", "upvotes": 0, "what_it_is": "SeekBrain \u662f\u4e00\u4e2a\u9762\u5411\u795e\u7ecf\u79d1\u5b66\u7684\u81ea\u4e3b\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u9886\u57df\u5316\u5c42\u7ea7\u89c4\u5212\u4e0e\u8de8\u6a21\u6001\u6570\u636e\u5206\u6790\uff0c\u81ea\u52a8\u751f\u6210\u5047\u8bbe\u548c\u5206\u6790\u6d41\u7a0b\u3002\u5b83\u4ece\u4ee3\u7801-\u8bba\u6587\u914d\u5bf9\u4e2d\u63d0\u53d6\u5206\u6790\u201c\u914d\u65b9\u201d\uff0c\u5e76\u7ed3\u5408\u667a\u80fd\u4f53\u89c4\u5212\u4e0e\u6267\u884c\u5f15\u64ce\u7528\u4e8e\u771f\u5b9e\u79d1\u7814\u4efb\u52a1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u843d\u5730\u5230\u590d\u6742\u79d1\u5b66\u53d1\u73b0\u6d41\u7a0b\u4e2d\uff0c\u4e0d\u4ec5\u5728\u57fa\u51c6\u4efb\u52a1\u4e0a\u63d0\u5347\u8868\u73b0\uff0c\u8fd8\u5c55\u793a\u4e86\u771f\u5b9e\u795e\u7ecf\u79d1\u5b66\u53d1\u73b0\u80fd\u529b\uff0c\u5177\u6709\u63a8\u52a8\u6570\u636e\u9a71\u52a8\u79d1\u7814\u81ea\u52a8\u5316\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Optimizing modern recommender models still depends heavily on engineers manually iterating over architectural, objective, and training-strategy changes. While LLM-based agents can automate this trial-and-error process, allowing the LLM to both select modification directions and generate concrete hypotheses often leads to unstable search under limited experiment budgets. Inspired by the above challenge, we propose RecHarness, a Bandit-Routed Agentic Harness for automated recommender model optimization. RecHarness separates the optimization process into two steps: a bandit router selects the next modification direction according to historical validation feedback, while the LLM generates a concrete optimization hypothesis and executable code edit within the selected direction. To sustain long-horizon exploration, RecHarness uses a jump-basin mechanism to activate a structural-jump arm when local edits stagnate. Across multiple recommendation tasks, datasets, and model backbones, RecHarness achieves more stable performance improvements and uses limited trial budgets more effectively than LLM-reasoning search. During a 7-day online A/B test on a large-scale short-video advertising platform, the selected candidate improves ADVV by 2.084%, Revenue by 0.534%, and Exposure by 0.559%. Code is available at https://github.com/6lyc/RecHarness.", "arxiv_id": "2607.29241", "arxiv_url": "https://arxiv.org/abs/2607.29241", "authors": ["Haoran Ling", "Yuecheng Li", "Zeyu Song", "Jing Yao", "Shuwen Kang", "Chi Lu", "Wenjin Wu", "Peng Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa RecHarness\uff0c\u4e00\u4e2a\u7528\u4e8e\u81ea\u52a8\u4f18\u5316\u63a8\u8350\u6a21\u578b\u7684\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u5c06\u641c\u7d22\u8fc7\u7a0b\u62c6\u5206\u4e3a\u7531 Bandit \u6839\u636e\u5386\u53f2\u9a8c\u8bc1\u53cd\u9988\u9009\u62e9\u4fee\u6539\u65b9\u5411\uff0c\u518d\u7531 LLM \u5728\u8be5\u65b9\u5411\u4e0b\u751f\u6210\u5177\u4f53\u4f18\u5316\u5047\u8bbe\u4e0e\u53ef\u6267\u884c\u4ee3\u7801\u4fee\u6539\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29241", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Bandit router \u8d1f\u8d23\u5728\u6709\u9650\u5b9e\u9a8c\u9884\u7b97\u4e0b\u9009\u62e9\u67b6\u6784\u3001\u76ee\u6807\u51fd\u6570\u6216\u8bad\u7ec3\u7b56\u7565\u7b49\u4fee\u6539\u65b9\u5411\uff0c\u964d\u4f4e\u7eaf LLM \u63a8\u7406\u641c\u7d22\u7684\u4e0d\u7a33\u5b9a\u6027", "\u5f15\u5165 jump-basin \u673a\u5236\uff0c\u5728\u5c40\u90e8\u7f16\u8f91\u505c\u6ede\u65f6\u89e6\u53d1\u7ed3\u6784\u6027\u8df3\u8dc3\uff0c\u652f\u6301\u66f4\u957f\u7a0b\u63a2\u7d22", "\u5728\u591a\u79cd\u63a8\u8350\u4efb\u52a1\u3001\u6570\u636e\u96c6\u548c\u6a21\u578b\u9aa8\u5e72\u4e0a\u8868\u73b0\u66f4\u7a33\u5b9a\uff1b7\u5929\u7ebf\u4e0aA/B\u6d4b\u8bd5\u4e2d ADVV \u63d0\u53472.084%\uff0cRevenue \u63d0\u53470.534%\uff0cExposure \u63d0\u53470.559%"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u667a\u80fd\u4f53", "\u591a\u81c2\u8001\u864e\u673a", "\u81ea\u52a8\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29241v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RecHarness: A Bandit-Routed Agentic Harness for Self-Evolving Recommender Systems", "tldr": "\u7528Bandit\u8def\u7531LLM\u667a\u80fd\u4f53\u4f18\u5316\u63a8\u8350\u7cfb\u7edf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RecHarness\uff0c\u4e00\u4e2a\u7528\u4e8e\u81ea\u52a8\u4f18\u5316\u63a8\u8350\u6a21\u578b\u7684\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u5c06\u641c\u7d22\u8fc7\u7a0b\u62c6\u5206\u4e3a\u7531 Bandit \u6839\u636e\u5386\u53f2\u9a8c\u8bc1\u53cd\u9988\u9009\u62e9\u4fee\u6539\u65b9\u5411\uff0c\u518d\u7531 LLM \u5728\u8be5\u65b9\u5411\u4e0b\u751f\u6210\u5177\u4f53\u4f18\u5316\u5047\u8bbe\u4e0e\u53ef\u6267\u884c\u4ee3\u7801\u4fee\u6539\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u81c2\u8001\u864e\u673a\u7684\u53cd\u9988\u9a71\u52a8\u63a2\u7d22\u4e0e LLM \u4ee3\u7801\u751f\u6210\u7ed3\u5408\uff0c\u7528\u4e8e\u771f\u5b9e\u63a8\u8350\u7cfb\u7edf\u7684\u81ea\u52a8\u8fed\u4ee3\uff0c\u5e76\u5728\u7ebf\u4e0a\u5e7f\u544a\u5e73\u53f0\u9a8c\u8bc1\u4e86\u53ef\u89c2\u6536\u76ca\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM serving systems cache prompt KV state, yet most front ends still re-tokenize the full request text on every call. The cost lands on coding agents, which resubmit a long transcript after each small tool result, and reuse is hard because even a short append can change token boundaries near the end of the previous sequence. Across 153,951 calls from two agent ecosystems, the median call appends about 1.4K characters, and only 1.0-3.6% of calls start or rebuild a session with contexts of millions of characters. At a 94.1% fleet prompt-cache hit rate, tokenization reaches up to 64% of time to first token. TokTier is a stateful tokenization service with one contract: emitted token IDs are always identical to full reference tokenization of the request text. For a session continuation, it re-tokenizes a small window around the append and splices only after a per-request stable-boundary check, widening the window or falling back to full tokenization on failure. For a call without a reusable prefix, it decomposes GPT-family regex pre-tokenization into run-local rules and runs exact pre-tokenization and BPE on a GPU. A sampled shadow verifier re-checks live traffic. Across 17 tokenizer families, differential campaigns cover 1.5x10^10 split checks, a 12.4 TB real-text corpus, and 93,000+ replayed agent steps, with zero divergence. Incremental repair takes 0.5-1.1 ms from 100K to 3M characters, up to 437x faster than HF tokenization and 2.1x faster at 1M than the strongest cache-based baseline (Gigatoken) fully prewarmed. GPU full tokenization encodes a 1M-character request in 0.87 ms, up to 491x below HF and 23.4x below the fastest published CPU method. With vLLM, median time to first token drops 16-34% and P99 drops 23% under recorded bursts. Under a 50 ms P99 objective, four repair cores plus one GPU sustain 1,821 requests/s where a 16-core stateless front end saturates at 40.", "arxiv_id": "2607.29678", "arxiv_url": "https://arxiv.org/abs/2607.29678", "authors": ["Zhenyu Zhang", "Zhichao Cao"], "brief": "\u672c\u6587\u63d0\u51fa TokTier\uff0c\u4e00\u79cd\u4fdd\u8bc1\u4e0e\u5b8c\u6574\u53c2\u8003\u5206\u8bcd\u7ed3\u679c\u5b8c\u5168\u4e00\u81f4\u7684\u6709\u72b6\u6001\u5206\u8bcd\u670d\u52a1\u3002\u5b83\u9762\u5411\u667a\u80fd\u4f53\u53cd\u590d\u8ffd\u52a0\u5c11\u91cf\u5de5\u5177\u7ed3\u679c\u3001\u91cd\u63d0\u4ea4\u957f\u4f1a\u8bdd\u7684\u573a\u666f\uff0c\u901a\u8fc7\u589e\u91cf\u4fee\u590d\u4e0eGPU\u5168\u91cf\u5206\u8bcd\u964d\u4f4e\u9996token\u5ef6\u8fdf\u3002", "categories": ["cs.CL", "cs.DC", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29678", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5bf9\u4f1a\u8bdd\u7eed\u5199\u4ec5\u91cd\u5206\u8bcd\u8ffd\u52a0\u4f4d\u7f6e\u9644\u8fd1\u7684\u5c0f\u7a97\u53e3\uff0c\u5e76\u901a\u8fc7\u7a33\u5b9a\u8fb9\u754c\u68c0\u67e5\u8fdb\u884c\u62fc\u63a5\uff1b\u5931\u8d25\u65f6\u81ea\u52a8\u6269\u5927\u7a97\u53e3\u6216\u56de\u9000\u5168\u91cf\u5206\u8bcd\uff0c\u4fdd\u8bc1token ID\u7cbe\u786e\u4e00\u81f4\u3002", "\u5728\u65e0\u53ef\u590d\u7528\u524d\u7f00\u65f6\uff0c\u5c06GPT\u7cfb\u6b63\u5219\u9884\u5206\u8bcd\u62c6\u89e3\u4e3a\u5c40\u90e8\u89c4\u5219\uff0c\u5e76\u5728GPU\u4e0a\u6267\u884c\u7cbe\u786e\u9884\u5206\u8bcd\u4e0eBPE\u3002", "\u8986\u76d617\u7c7btokenizer\u3001150\u4ebf\u6b21\u5207\u5206\u68c0\u67e5\u300112.4TB\u771f\u5b9e\u6587\u672c\u548c9.3\u4e07\u4f59\u667a\u80fd\u4f53\u6b65\u9aa4\u56de\u653e\uff0c\u672a\u53d1\u73b0\u5206\u6b67\uff1b\u5728vLLM\u4e2dTTFT\u4e2d\u4f4d\u6570\u964d\u4f4e16-34%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u670d\u52a1", "\u5206\u8bcd", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29678v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TokTier: Exact Stateful Tokenization for Agentic LLM Serving", "tldr": "TokTier\u5927\u5e45\u52a0\u901f\u667a\u80fd\u4f53\u957f\u4e0a\u4e0b\u6587\u5206\u8bcd\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa TokTier\uff0c\u4e00\u79cd\u4fdd\u8bc1\u4e0e\u5b8c\u6574\u53c2\u8003\u5206\u8bcd\u7ed3\u679c\u5b8c\u5168\u4e00\u81f4\u7684\u6709\u72b6\u6001\u5206\u8bcd\u670d\u52a1\u3002\u5b83\u9762\u5411\u667a\u80fd\u4f53\u53cd\u590d\u8ffd\u52a0\u5c11\u91cf\u5de5\u5177\u7ed3\u679c\u3001\u91cd\u63d0\u4ea4\u957f\u4f1a\u8bdd\u7684\u573a\u666f\uff0c\u901a\u8fc7\u589e\u91cf\u4fee\u590d\u4e0eGPU\u5168\u91cf\u5206\u8bcd\u964d\u4f4e\u9996token\u5ef6\u8fdf\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u5728\u9ad8prompt-cache\u547d\u4e2d\u7387\u4e0b\uff0c\u5206\u8bcd\u672c\u8eab\u53ef\u5360\u9996token\u65f6\u95f4\u9ad8\u8fbe64%\uff0c\u6210\u4e3a\u667a\u80fd\u4f53\u670d\u52a1\u74f6\u9888\u3002TokTier\u5728\u4fdd\u8bc1\u7cbe\u786e\u7b49\u4ef7\u7684\u540c\u65f6\u5b9e\u73b0\u6beb\u79d2\u7ea7\u589e\u91cf\u4fee\u590d\u548cGPU\u5168\u91cf\u5206\u8bcd\uff0c\u5bf9\u957f\u4e0a\u4e0b\u6587\u7f16\u7801\u667a\u80fd\u4f53\u3001\u4ee3\u7801\u667a\u80fd\u4f53\u548c\u9ad8\u541e\u5410LLM\u670d\u52a1\u5177\u6709\u76f4\u63a5\u5de5\u7a0b\u4ef7\u503c\u3002"}, {"abstract": "Small language models (SLMs) are attractive for agentic deployment due to low latency, reduced cost, and on-device privacy, yet they struggle with tool-use tasks where training data is scarce and noisy. Unlike larger models, SLMs cannot compensate for low-quality supervision through sheer capacity, making data quality the critical bottleneck. We present Data Turnstile, an open-source framework that takes user-defined API specifications and generates high-quality synthetic training data for function calling. Turnstile decomposes multi-turn tool-use interactions into constrained, stepwise generation with validation and error-feedback loops, providing fine-grained control over API diversity, conversation complexity, and output correctness. We demonstrate effectiveness of domain adaptation with Turnstile data on two challenging function calling benchmarks. On the BFCL single-turn benchmark, a Qwen3-0.6B fine-tuned on Turnstile data without chain-of-thought achieves 75.9% overall accuracy (versus 67.4% for the base model with thinking enabled), closing the gap with thinking-enabled Qwen3-1.7B (78.4%) and Qwen3-4B (79.9%) despite being 3$\\times$ and 7$\\times$ smaller respectively. On $\u03c4^2$-bench, a multi-turn agentic benchmark, Turnstile-trained Qwen3-1.7B achieves 31.1% pass^1 on the Telecom domain, improving 4.7$\\times$ over its 6.6% base and surpassing Qwen2.5-32B-Instruct (27.4%), a model 19$\\times$ larger. Turnstile-trained Qwen3-0.6B achieves 24.6%, improving 7$\\times$ over its 3.5% base and approaching the 32B model (53$\\times$ larger). We release Data Turnstile along with a dataset spanning 1,000+ APIs and 100K+ multi-turn interactions.", "arxiv_id": "2607.29250", "arxiv_url": "https://arxiv.org/abs/2607.29250", "authors": ["Goutham Ramakrishnan", "Megha Sharma"], "brief": "Data Turnstile \u662f\u4e00\u4e2a\u5f00\u6e90\u5408\u6210\u6570\u636e\u751f\u6210\u6846\u67b6\uff0c\u53ef\u6839\u636e\u7528\u6237\u5b9a\u4e49\u7684 API \u89c4\u8303\u751f\u6210\u7528\u4e8e\u51fd\u6570\u8c03\u7528/\u5de5\u5177\u4f7f\u7528\u7684\u9ad8\u8d28\u91cf\u8bad\u7ec3\u6570\u636e\u3002\u5b83\u901a\u8fc7\u5206\u6b65\u9aa4\u7ea6\u675f\u751f\u6210\u3001\u9a8c\u8bc1\u4e0e\u9519\u8bef\u53cd\u9988\uff0c\u63d0\u5347\u5c0f\u8bed\u8a00\u6a21\u578b\u5728\u5355\u8f6e\u548c\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29250", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u4ea4\u4e92\u62c6\u89e3\u4e3a\u53d7\u7ea6\u675f\u7684\u9010\u6b65\u751f\u6210\u6d41\u7a0b\uff0c\u5e76\u52a0\u5165\u9a8c\u8bc1\u4e0e\u9519\u8bef\u53cd\u9988\u95ed\u73af\uff0c\u63a7\u5236 API \u591a\u6837\u6027\u3001\u5bf9\u8bdd\u590d\u6742\u5ea6\u548c\u8f93\u51fa\u6b63\u786e\u6027\u3002", "\u5728 BFCL \u5355\u8f6e\u51fd\u6570\u8c03\u7528\u57fa\u51c6\u4e0a\uff0cQwen3-0.6B \u4f7f\u7528 Turnstile \u6570\u636e\u5fae\u8c03\u540e\u8fbe\u5230 75.9% \u51c6\u786e\u7387\uff0c\u8d85\u8fc7\u542f\u7528\u601d\u8003\u7684\u57fa\u5ea7\u6a21\u578b 67.4%\uff0c\u63a5\u8fd1\u66f4\u5927\u6a21\u578b Qwen3-1.7B/4B\u3002", "\u5728\u591a\u8f6e\u667a\u80fd\u4f53\u57fa\u51c6 \u03c4\u00b2-bench Telecom \u57df\uff0cTurnstile \u8bad\u7ec3\u7684 Qwen3-1.7B \u8fbe\u5230 31.1% pass^1\uff0c\u8d85\u8fc7 19 \u500d\u66f4\u5927\u7684 Qwen2.5-32B-Instruct\uff1b\u540c\u65f6\u53d1\u5e03\u8986\u76d6 1000+ API\u300110\u4e07+ \u591a\u8f6e\u4ea4\u4e92\u7684\u6570\u636e\u96c6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u51fd\u6570\u8c03\u7528", "\u5408\u6210\u6570\u636e", "\u5c0f\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29250v1", "published_at": "2026-07-31", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Data Turnstile: A Scalable Open Framework for Function-Calling Data Generation", "tldr": "\u5f00\u6e90\u6846\u67b6\u9ad8\u8d28\u91cf\u751f\u6210\u51fd\u6570\u8c03\u7528\u8bad\u7ec3\u6570\u636e", "upvotes": 0, "what_it_is": "Data Turnstile \u662f\u4e00\u4e2a\u5f00\u6e90\u5408\u6210\u6570\u636e\u751f\u6210\u6846\u67b6\uff0c\u53ef\u6839\u636e\u7528\u6237\u5b9a\u4e49\u7684 API \u89c4\u8303\u751f\u6210\u7528\u4e8e\u51fd\u6570\u8c03\u7528/\u5de5\u5177\u4f7f\u7528\u7684\u9ad8\u8d28\u91cf\u8bad\u7ec3\u6570\u636e\u3002\u5b83\u901a\u8fc7\u5206\u6b65\u9aa4\u7ea6\u675f\u751f\u6210\u3001\u9a8c\u8bc1\u4e0e\u9519\u8bef\u53cd\u9988\uff0c\u63d0\u5347\u5c0f\u8bed\u8a00\u6a21\u578b\u5728\u5355\u8f6e\u548c\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u51fb\u5c0f\u8bed\u8a00\u6a21\u578b\u5de5\u5177\u8c03\u7528\u80fd\u529b\u53d7\u9650\u4e8e\u6570\u636e\u8d28\u91cf\u7684\u74f6\u9888\uff0c\u7528\u53ef\u6269\u5c55\u3001\u53ef\u63a7\u7684\u5408\u6210\u6570\u636e\u6d41\u7a0b\u663e\u8457\u63d0\u5347\u5c0f\u6a21\u578b\u7684\u51fd\u6570\u8c03\u7528\u4e0e\u591a\u8f6e\u667a\u80fd\u4f53\u8868\u73b0\uff0c\u6709\u52a9\u4e8e\u4f4e\u6210\u672c\u3001\u4f4e\u5ef6\u8fdf\u3001\u7aef\u4fa7\u9690\u79c1\u53cb\u597d\u7684\u667a\u80fd\u4f53\u90e8\u7f72\u3002"}, {"abstract": "As LLMs evolve from code completion systems into autonomous scientific agents, evaluating their ability to conduct experiments has become increasingly important. Existing benchmarks typically focus on static code generation, paper replication, or final answer correctness, but do not directly assess whether agents can interpret experimental evidence and use it to guide subsequent hyperparameter decisions. To address this gap, we introduce AgentHPOBench, a sequential benchmark comprising 30 executable machine learning tasks across seven research categories. Each task begins with a validated baseline run, after which an agent performs several sequential interventions. At each step, the agent observes the accumulated configurations, metrics, and logs before proposing the next valid configuration. We evaluate 12 widely used agents and conventional HPO baselines under a unified protocol. The results show that current agents exhibit measurable experimental optimization ability across domains, but still face clear limitations in sustained iterative refinement, complex log diagnosis, and consistent progress toward reported reference performance.", "arxiv_id": "2607.29626", "arxiv_url": "https://arxiv.org/abs/2607.29626", "authors": ["Tianyu Huai", "Tingshuo Fan", "Xinchi Chen", "Yining Zheng", "Yuxin Wang", "Shuang Chen", "Jie Zhou", "Xuanjing Huang"], "brief": "\u8bba\u6587\u63d0\u51faAgentHPOBench\uff0c\u4e00\u4e2a\u9762\u5411LLM\u79d1\u5b66\u667a\u80fd\u4f53\u7684\u987a\u5e8f\u8d85\u53c2\u6570\u4f18\u5316\u57fa\u51c6\uff0c\u5305\u542b7\u7c7b\u7814\u7a76\u65b9\u5411\u768430\u4e2a\u53ef\u6267\u884c\u673a\u5668\u5b66\u4e60\u4efb\u52a1\u3002\u667a\u80fd\u4f53\u9700\u57fa\u4e8e\u5386\u53f2\u914d\u7f6e\u3001\u6307\u6807\u548c\u65e5\u5fd7\u9010\u6b65\u63d0\u51fa\u65b0\u914d\u7f6e\uff0c\u4ee5\u8bc4\u4f30\u5176\u5b9e\u9a8c\u51b3\u7b56\u4e0e\u8fed\u4ee3\u4f18\u5316\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29626", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6bcf\u4e2a\u4efb\u52a1\u4ece\u5df2\u9a8c\u8bc1\u57fa\u7ebf\u5f00\u59cb\uff0c\u667a\u80fd\u4f53\u8fdb\u884c\u591a\u8f6e\u987a\u5e8f\u5e72\u9884\uff0c\u800c\u975e\u4e00\u6b21\u6027\u751f\u6210\u4ee3\u7801\u6216\u7b54\u6848", "\u7edf\u4e00\u8bc4\u6d4b12\u79cd\u5e38\u7528LLM\u667a\u80fd\u4f53\u4e0e\u4f20\u7edf\u8d85\u53c2\u6570\u4f18\u5316\u65b9\u6cd5\uff0c\u6bd4\u8f83\u5176\u8de8\u4efb\u52a1\u4f18\u5316\u8868\u73b0", "\u7ed3\u679c\u663e\u793a\u5f53\u524d\u667a\u80fd\u4f53\u5177\u5907\u4e00\u5b9a\u5b9e\u9a8c\u4f18\u5316\u80fd\u529b\uff0c\u4f46\u5728\u6301\u7eed\u6539\u8fdb\u3001\u590d\u6742\u65e5\u5fd7\u8bca\u65ad\u548c\u903c\u8fd1\u53c2\u8003\u6027\u80fd\u65b9\u9762\u4ecd\u6709\u9650"], "keywords": ["\u667a\u80fd\u4f53", "\u8d85\u53c2\u6570\u4f18\u5316", "\u673a\u5668\u5b66\u4e60", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29626v1", "published_at": "2026-07-31", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AgentHPOBench: A Benchmark For Evaluating LLM Agents as Sequential Hyperparameter Optimizers", "tldr": "\u8bc4\u6d4bLLM\u667a\u80fd\u4f53\u987a\u5e8f\u8d85\u53c2\u4f18\u5316\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faAgentHPOBench\uff0c\u4e00\u4e2a\u9762\u5411LLM\u79d1\u5b66\u667a\u80fd\u4f53\u7684\u987a\u5e8f\u8d85\u53c2\u6570\u4f18\u5316\u57fa\u51c6\uff0c\u5305\u542b7\u7c7b\u7814\u7a76\u65b9\u5411\u768430\u4e2a\u53ef\u6267\u884c\u673a\u5668\u5b66\u4e60\u4efb\u52a1\u3002\u667a\u80fd\u4f53\u9700\u57fa\u4e8e\u5386\u53f2\u914d\u7f6e\u3001\u6307\u6807\u548c\u65e5\u5fd7\u9010\u6b65\u63d0\u51fa\u65b0\u914d\u7f6e\uff0c\u4ee5\u8bc4\u4f30\u5176\u5b9e\u9a8c\u51b3\u7b56\u4e0e\u8fed\u4ee3\u4f18\u5316\u80fd\u529b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u66f4\u8d34\u8fd1\u771f\u5b9e\u79d1\u7814\u5b9e\u9a8c\u6d41\u7a0b\uff0c\u76f4\u63a5\u8861\u91cfLLM\u667a\u80fd\u4f53\u80fd\u5426\u5229\u7528\u5b9e\u9a8c\u53cd\u9988\u505a\u8fde\u7eed\u51b3\u7b56\uff0c\u5bf9\u8bc4\u4f30\u81ea\u52a8\u5316\u673a\u5668\u5b66\u4e60\u7814\u7a76\u52a9\u624b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agentic assistants capable of proactive, personalized interactions require structured models of user intent and workflow. However, building these models from raw, unstructured screen activity remains an open challenge. We present SERUM, a multi-pass framework that extracts finite-state behavioral models directly from unstructured egocentric video using hierarchical VLM annotation. Processing screen recordings through a sliding window, SERUM alternates between activity-recognition and intent-inference passes, with each pass refining labels using accumulated prior context to reduce hallucination and temporal conflation seen in single-pass annotation. Synonymous states are then merged via sentence embeddings and human-calibrated thresholds into a compact, coherent taxonomy. We evaluate behavioral structure by fitting first-order Markov models over the resulting label sequences (both actions and intents) and measuring predictive accuracy against frequency baselines. Across 61 egocentric videos in four domains (coding, cooking, physical activities, and daily life), we find: (1) iterative label refinement converges to a stable state vocabulary, which we term schematic equilibrium, after several passes; (2) normalized Markov models achieve substantially lower perplexity and higher action predictions than frequency baselines, with the largest gains on structured tasks like coding; and (3) human annotators rate final-pass labels as accurate and meaningfully improved over first-pass labels. To our knowledge, SERUM is the first system to produce interpretable process models from unstructured egocentric screen video without manual annotation, opening a scalable pathway for user modeling and behavioral understanding in the wild. Our demo, code, and results are publicly available", "arxiv_id": "2607.29181", "arxiv_url": "https://arxiv.org/abs/2607.29181", "authors": ["Andy J. Phu", "James Mooney", "Karin de Langis", "Khanh Chi Le", "Dongyeop Kang"], "brief": "SERUM \u662f\u4e00\u4e2a\u591a\u8f6e\u6846\u67b6\uff0c\u5229\u7528\u5206\u5c42 VLM \u6807\u6ce8\u4ece\u975e\u7ed3\u6784\u5316\u7b2c\u4e00\u89c6\u89d2/\u5c4f\u5e55\u89c6\u9891\u4e2d\u63d0\u53d6\u6709\u9650\u72b6\u6001\u7528\u6237\u884c\u4e3a\u6a21\u578b\u3002\u5b83\u4ea4\u66ff\u8fdb\u884c\u6d3b\u52a8\u8bc6\u522b\u4e0e\u610f\u56fe\u63a8\u65ad\uff0c\u5e76\u901a\u8fc7\u4e0a\u4e0b\u6587\u7d2f\u79ef\u548c\u72b6\u6001\u5408\u5e76\u751f\u6210\u7d27\u51d1\u3001\u53ef\u89e3\u91ca\u7684\u884c\u4e3a\u6d41\u7a0b\u8868\u793a\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29181", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u6ed1\u52a8\u7a97\u53e3\u591a\u8f6e\u6807\u6ce8\uff0c\u9010\u6b65\u7ec6\u5316\u52a8\u4f5c\u4e0e\u610f\u56fe\u6807\u7b7e\uff0c\u51cf\u5c11\u5355\u8f6e VLM \u6807\u6ce8\u4e2d\u7684\u5e7b\u89c9\u4e0e\u65f6\u95f4\u6df7\u6dc6", "\u7528\u53e5\u5411\u91cf\u548c\u4eba\u5de5\u6821\u51c6\u9608\u503c\u5408\u5e76\u540c\u4e49\u72b6\u6001\uff0c\u5f62\u6210\u7a33\u5b9a\u72b6\u6001\u8bcd\u8868\uff0c\u5373\u201cschematic equilibrium\u201d", "\u5728\u7f16\u7801\u3001\u70f9\u996a\u3001\u4f53\u529b\u6d3b\u52a8\u3001\u65e5\u5e38\u751f\u6d3b\u56db\u7c7b\u517161\u6bb5\u89c6\u9891\u4e0a\uff0cMarkov \u884c\u4e3a\u6a21\u578b\u663e\u8457\u4f18\u4e8e\u9891\u7387\u57fa\u7ebf\uff0c\u7f16\u7801\u7b49\u7ed3\u6784\u5316\u4efb\u52a1\u63d0\u5347\u6700\u5927"], "keywords": ["\u667a\u80fd\u4f53", "\u7528\u6237\u5efa\u6a21", "\u591a\u6a21\u6001", "\u884c\u4e3a\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29181v1", "published_at": "2026-07-31", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SERUM: State Extraction and Refinement for User Modeling", "tldr": "\u4ece\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u81ea\u52a8\u63d0\u53d6\u7528\u6237\u884c\u4e3a\u72b6\u6001\u6a21\u578b", "upvotes": 0, "what_it_is": "SERUM \u662f\u4e00\u4e2a\u591a\u8f6e\u6846\u67b6\uff0c\u5229\u7528\u5206\u5c42 VLM \u6807\u6ce8\u4ece\u975e\u7ed3\u6784\u5316\u7b2c\u4e00\u89c6\u89d2/\u5c4f\u5e55\u89c6\u9891\u4e2d\u63d0\u53d6\u6709\u9650\u72b6\u6001\u7528\u6237\u884c\u4e3a\u6a21\u578b\u3002\u5b83\u4ea4\u66ff\u8fdb\u884c\u6d3b\u52a8\u8bc6\u522b\u4e0e\u610f\u56fe\u63a8\u65ad\uff0c\u5e76\u901a\u8fc7\u4e0a\u4e0b\u6587\u7d2f\u79ef\u548c\u72b6\u6001\u5408\u5e76\u751f\u6210\u7d27\u51d1\u3001\u53ef\u89e3\u91ca\u7684\u884c\u4e3a\u6d41\u7a0b\u8868\u793a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9996\u6b21\u5728\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\uff0c\u4ece\u975e\u7ed3\u6784\u5316\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u4e2d\u751f\u6210\u53ef\u89e3\u91ca\u7684\u7528\u6237\u6d41\u7a0b\u6a21\u578b\uff0c\u4e3a\u4e2a\u6027\u5316\u3001\u4e3b\u52a8\u5f0f\u667a\u80fd\u4f53\u7406\u89e3\u7528\u6237\u610f\u56fe\u548c\u5de5\u4f5c\u6d41\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u8def\u5f84\u3002"}, {"abstract": "LLM agents need memory to act consistently over long interactions, yet many systems use additional LLM calls to operate that memory. Generating intermediate records and mediating their retrieval adds recurring token and time costs, while omitted or merged details can obscure the original evidence. We ask whether structured memory access requires generation at all. Zero-Mem introduces \\emph{zero-token memory operations}: no step outside final question answering invokes an LLM or consumes LLM input or output tokens; encoder computation is accounted for separately. Zero-Mem preserves original interaction traces as its source of record. It organizes the traces in two complementary ways. An entity--context graph exposes connections across interactions, while a temporal hierarchy preserves conversational locality and session state. For each query, Zero-Mem weighs the two views, retrieves from both, and follows their structure to recover supporting relations or surrounding context. Deterministic calibration first discards conflicting evidence and then keeps the reader\u0027s answer grounded in the retrieved traces. Only the final-QA reader invokes an LLM. Across long-memory and long-context question-answering benchmarks, Zero-Mem achieves competitive performance while eliminating LLM calls and LLM-token consumption from memory operations. With the same final-QA reader and context budget, it reduces memory-operation time cost by 57.6\\% relative to the fastest compared baseline. Ablations support the contribution of the two views and their query-dependent coordination. Overall, the results show that structured agent memory need not generate an intermediate representation of the past. After peer review, the code and implementation details will be available at \\textcolor{blue}{https://github.com/TheMoon0815/Zero-mem}.", "arxiv_id": "2607.29377", "arxiv_url": "https://arxiv.org/abs/2607.29377", "authors": ["Yilin Xiao", "Zhehan Zhu", "Yujing Zhang", "Jin Chen", "Zijin Hong", "Luyao Zhuang", "Qinggang Zhang", "Shengyuan Chen", "Xiaocao Ouyang", "Lingfei Ren", "Xiao Huang"], "brief": "Zero-Mem \u63d0\u51fa\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u96f6 token \u8bb0\u5fc6\u64cd\u4f5c\u6846\u67b6\uff1a\u9664\u6700\u7ec8\u95ee\u7b54\u5916\uff0c\u8bb0\u5fc6\u5199\u5165\u3001\u7ec4\u7ec7\u3001\u68c0\u7d22\u5747\u4e0d\u8c03\u7528 LLM\u3002\u5b83\u4fdd\u7559\u539f\u59cb\u4ea4\u4e92\u8f68\u8ff9\uff0c\u5e76\u901a\u8fc7\u5b9e\u4f53-\u4e0a\u4e0b\u6587\u56fe\u4e0e\u65f6\u95f4\u5c42\u7ea7\u4e24\u79cd\u89c6\u56fe\u7ec4\u7ec7\u548c\u68c0\u7d22\u8bb0\u5fc6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29377", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bb0\u5fc6\u64cd\u4f5c\u4e0d\u6d88\u8017 LLM \u8f93\u5165/\u8f93\u51fa token\uff0c\u4e5f\u4e0d\u751f\u6210\u4e2d\u95f4\u6458\u8981\u6216\u8bb0\u5f55\uff0c\u907f\u514d\u53cd\u590d\u8c03\u7528 LLM \u7684\u65f6\u95f4\u4e0e\u6210\u672c\u5f00\u9500", "\u7ed3\u5408\u5b9e\u4f53-\u4e0a\u4e0b\u6587\u56fe\u548c\u65f6\u95f4\u5c42\u7ea7\u7ed3\u6784\uff0c\u5206\u522b\u6355\u6349\u8de8\u4ea4\u4e92\u5173\u7cfb\u4e0e\u4f1a\u8bdd\u5c40\u90e8\u4e0a\u4e0b\u6587\uff0c\u5e76\u6309\u67e5\u8be2\u52a8\u6001\u52a0\u6743\u68c0\u7d22", "\u5728\u957f\u8bb0\u5fc6\u548c\u957f\u4e0a\u4e0b\u6587\u95ee\u7b54\u57fa\u51c6\u4e0a\u6027\u80fd\u5177\u7ade\u4e89\u529b\uff0c\u76f8\u6bd4\u6700\u5feb\u57fa\u7ebf\u5c06\u8bb0\u5fc6\u64cd\u4f5c\u65f6\u95f4\u6210\u672c\u964d\u4f4e 57.6%"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u68c0\u7d22\u589e\u5f3a", "\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29377v1", "published_at": "2026-07-31", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Zero-Mem: Zero-Token Memory Operations for LLM Agents", "tldr": "\u96f6 token \u7ed3\u6784\u5316\u8bb0\u5fc6\u964d\u4f4e\u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u6210\u672c", "upvotes": 0, "what_it_is": "Zero-Mem \u63d0\u51fa\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u96f6 token \u8bb0\u5fc6\u64cd\u4f5c\u6846\u67b6\uff1a\u9664\u6700\u7ec8\u95ee\u7b54\u5916\uff0c\u8bb0\u5fc6\u5199\u5165\u3001\u7ec4\u7ec7\u3001\u68c0\u7d22\u5747\u4e0d\u8c03\u7528 LLM\u3002\u5b83\u4fdd\u7559\u539f\u59cb\u4ea4\u4e92\u8f68\u8ff9\uff0c\u5e76\u901a\u8fc7\u5b9e\u4f53-\u4e0a\u4e0b\u6587\u56fe\u4e0e\u65f6\u95f4\u5c42\u7ea7\u4e24\u79cd\u89c6\u56fe\u7ec4\u7ec7\u548c\u68c0\u7d22\u8bb0\u5fc6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u7ed3\u6784\u5316\u667a\u80fd\u4f53\u8bb0\u5fc6\u5fc5\u987b\u7531 LLM \u751f\u6210\u4e2d\u95f4\u8868\u793a\u201d\u7684\u5e38\u89c1\u505a\u6cd5\uff0c\u5728\u4fdd\u6301\u539f\u59cb\u8bc1\u636e\u53ef\u8ffd\u6eaf\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u6210\u672c\uff0c\u9002\u5408\u957f\u7a0b\u4ea4\u4e92\u667a\u80fd\u4f53\u548c\u4f4e\u5ef6\u8fdf\u5e94\u7528\u3002"}, {"abstract": "A defining problem of the Anthropocene is to model the physical Earth and human societies as one coupled system, yet no learned representation spans their observational breadth. We argue the obstacle is geometric: the physical Earth is measured as continuous fields that ignore political borders, whereas societies are reported for administrative units. Earth-system foundation models serve the first geometry; coupling it to the second has required lossy averaging over borders. We introduce TerraNova, a foundation model trained on 1,024 physical and societal records in their native geometries: 512 gridded Earth-system fields and 512 national indicators. Dedicated encoders represent location, country, time and task, cross-modal transformers fuse them into a shared spatiotemporal state, and a hypernetwork generates a per-query decoder whose evidential head returns a predictive distribution. Two contrastive objectives couple the representation: a population-weighted alignment between each country and coordinates in its territory, and one to pretrained geospatial embeddings carrying image-derived semantics. Read out through that decoder, the representation is competitive with purpose-built geospatial encoders while spanning axes they do not represent (time, oceans and uncertainty) and supporting country-level capabilities. The frozen backbone reconstructs dense fields from sparse observations and adapts to unseen variables in minutes on consumer hardware.", "arxiv_id": "2607.29527", "arxiv_url": "https://arxiv.org/abs/2607.29527", "authors": ["Carlos Rodriguez-Pardo", "Massimo Tavoni"], "brief": "TerraNova \u662f\u4e00\u4e2a\u9762\u5411\u4eba\u7c7b\u4e16\u7684\u57fa\u7840\u6a21\u578b\uff0c\u5728\u539f\u751f\u51e0\u4f55\u4e2d\u540c\u65f6\u5b66\u4e60\u7f51\u683c\u5316\u5730\u7403\u7cfb\u7edf\u573a\u4e0e\u56fd\u5bb6\u7ea7\u793e\u4f1a\u7ecf\u6d4e\u6307\u6807\u3002\u5b83\u901a\u8fc7\u8de8\u6a21\u6001\u65f6\u7a7a\u8868\u793a\uff0c\u5c06\u8fde\u7eed\u5730\u7406\u7a7a\u95f4\u6570\u636e\u548c\u884c\u653f\u5355\u5143\u6570\u636e\u8026\u5408\u8d77\u6765\uff0c\u5e76\u652f\u6301\u591a\u4efb\u52a1\u9884\u6d4b\u4e0e\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u3002", "categories": ["cs.LG", "cs.AI", "cs.CY", "econ.EM", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29527", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bad\u7ec3\u6570\u636e\u5305\u542b 1,024 \u7c7b\u8bb0\u5f55\uff1a512 \u4e2a\u7f51\u683c\u5316\u5730\u7403\u7cfb\u7edf\u53d8\u91cf\u548c 512 \u4e2a\u56fd\u5bb6\u7ea7\u6307\u6807\u3002", "\u4f7f\u7528\u4f4d\u7f6e\u3001\u56fd\u5bb6\u3001\u65f6\u95f4\u548c\u4efb\u52a1\u4e13\u7528\u7f16\u7801\u5668\uff0c\u7ed3\u5408\u8de8\u6a21\u6001 Transformer \u878d\u5408\u4e3a\u5171\u4eab\u65f6\u7a7a\u72b6\u6001\u3002", "\u901a\u8fc7\u8d85\u7f51\u7edc\u751f\u6210\u6309\u67e5\u8be2\u5b9a\u5236\u7684\u89e3\u7801\u5668\uff0c\u5e76\u7528 evidential head \u8f93\u51fa\u9884\u6d4b\u5206\u5e03\uff1b\u8fd8\u5f15\u5165\u56fd\u5bb6-\u5750\u6807\u4eba\u53e3\u52a0\u6743\u5bf9\u9f50\u4e0e\u5730\u7406\u9884\u8bad\u7ec3\u5d4c\u5165\u5bf9\u9f50\u4e24\u79cd\u5bf9\u6bd4\u5b66\u4e60\u76ee\u6807\u3002"], "keywords": ["\u5730\u7403\u57fa\u7840\u6a21\u578b", "\u591a\u6a21\u6001", "\u65f6\u7a7a\u5efa\u6a21", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29527v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TerraNova: A Foundation Model for the Anthropocene", "tldr": "\u7edf\u4e00\u5efa\u6a21\u5730\u7403\u7269\u7406\u573a\u4e0e\u4eba\u7c7b\u793e\u4f1a\u6307\u6807\u3002", "upvotes": 0, "what_it_is": "TerraNova \u662f\u4e00\u4e2a\u9762\u5411\u4eba\u7c7b\u4e16\u7684\u57fa\u7840\u6a21\u578b\uff0c\u5728\u539f\u751f\u51e0\u4f55\u4e2d\u540c\u65f6\u5b66\u4e60\u7f51\u683c\u5316\u5730\u7403\u7cfb\u7edf\u573a\u4e0e\u56fd\u5bb6\u7ea7\u793e\u4f1a\u7ecf\u6d4e\u6307\u6807\u3002\u5b83\u901a\u8fc7\u8de8\u6a21\u6001\u65f6\u7a7a\u8868\u793a\uff0c\u5c06\u8fde\u7eed\u5730\u7406\u7a7a\u95f4\u6570\u636e\u548c\u884c\u653f\u5355\u5143\u6570\u636e\u8026\u5408\u8d77\u6765\uff0c\u5e76\u652f\u6301\u591a\u4efb\u52a1\u9884\u6d4b\u4e0e\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u9762\u5730\u7403\u7269\u7406\u8fde\u7eed\u573a\u4e0e\u793e\u4f1a\u884c\u653f\u7edf\u8ba1\u4e4b\u95f4\u7684\u51e0\u4f55\u9519\u914d\u95ee\u9898\uff0c\u907f\u514d\u7b80\u5355\u6309\u56fd\u754c\u5e73\u5747\u5e26\u6765\u7684\u4fe1\u606f\u635f\u5931\uff1b\u5728\u5730\u7406\u7f16\u7801\u3001\u7a00\u758f\u89c2\u6d4b\u91cd\u5efa\u3001\u672a\u89c1\u53d8\u91cf\u5feb\u901f\u9002\u914d\u548c\u56fd\u5bb6\u7ea7\u80fd\u529b\u4e0a\u5c55\u793a\u4e86\u901a\u7528\u57fa\u7840\u6a21\u578b\u6f5c\u529b\u3002"}, {"abstract": "Long-term multimodal memory must support not only retrieving relevant information but also computing over observations accumulated across interactions. Existing systems largely emphasize \\emph{retrieval memory}, organizing interaction histories through summaries and indexes to return query-relevant information at multiple granularities, from high-level abstractions to underlying records. In this paper, we formulate \\emph{analytic memory} as a complementary abstraction that organizes recurring multimodal observations into queryable structures supporting filtering, aggregation, ranking, and temporal comparison. We present AdaMM, a framework that jointly supports retrieval and analytic memory. Rather than relying on application-defined schemas, AdaMM extracts provenance-linked attribute-value observations from dialogue, images, and contextual metadata, discovers recurring field structures, and materializes them for analytical access. At inference time, a memory-aware planner decomposes queries into retrieval and analytic operations and routes each operation to the appropriate tools. Experiments on two long-term multimodal memory benchmarks, MemEye and MemGallery, show that AdaMM improves performance by up to 11.3\\% and 7.3\\%, respectively.", "arxiv_id": "2607.29440", "arxiv_url": "https://arxiv.org/abs/2607.29440", "authors": ["Zhoujin Tian", "Yao Tian", "Hao Zhang", "Cheng Chen", "Yakun Li", "Lei Zhang", "Xiaofang Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u5206\u6790\u578b\u8bb0\u5fc6\u201d\u4f5c\u4e3a\u68c0\u7d22\u578b\u8bb0\u5fc6\u7684\u8865\u5145\uff0c\u4f7f\u957f\u671f\u591a\u6a21\u6001\u8bb0\u5fc6\u4e0d\u4ec5\u80fd\u67e5\u627e\u76f8\u5173\u4fe1\u606f\uff0c\u8fd8\u80fd\u5bf9\u8de8\u4ea4\u4e92\u79ef\u7d2f\u7684\u89c2\u5bdf\u8fdb\u884c\u8fc7\u6ee4\u3001\u805a\u5408\u3001\u6392\u5e8f\u548c\u65f6\u95f4\u6bd4\u8f83\u3002\u4f5c\u8005\u6784\u5efa AdaMM \u6846\u67b6\uff0c\u4ece\u5bf9\u8bdd\u3001\u56fe\u50cf\u548c\u4e0a\u4e0b\u6587\u5143\u6570\u636e\u4e2d\u62bd\u53d6\u5e26\u6eaf\u6e90\u7684\u5c5e\u6027-\u503c\u89c2\u5bdf\uff0c\u81ea\u52a8\u53d1\u73b0\u7ed3\u6784\u5e76\u652f\u6301\u5206\u6790\u67e5\u8be2\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29440", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u957f\u671f\u591a\u6a21\u6001\u8bb0\u5fc6\u5212\u5206\u4e3a\u68c0\u7d22\u8bb0\u5fc6\u4e0e\u5206\u6790\u8bb0\u5fc6\uff0c\u540e\u8005\u9762\u5411\u7edf\u8ba1\u3001\u6bd4\u8f83\u548c\u7ed3\u6784\u5316\u67e5\u8be2", "AdaMM \u65e0\u9700\u9884\u5b9a\u4e49\u5e94\u7528 schema\uff0c\u53ef\u81ea\u52a8\u62bd\u53d6\u5c5e\u6027-\u503c\u89c2\u5bdf\u5e76\u53d1\u73b0\u91cd\u590d\u5b57\u6bb5\u7ed3\u6784", "\u63a8\u7406\u65f6\u7531\u8bb0\u5fc6\u611f\u77e5\u89c4\u5212\u5668\u5c06\u95ee\u9898\u5206\u89e3\u4e3a\u68c0\u7d22\u64cd\u4f5c\u548c\u5206\u6790\u64cd\u4f5c\uff0c\u5e76\u8def\u7531\u5230\u76f8\u5e94\u5de5\u5177"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u957f\u671f\u8bb0\u5fc6", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29440v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Retrieval: Analytic Memory for Multimodal Agents", "tldr": "\u4e3a\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5f15\u5165\u53ef\u8ba1\u7b97\u7684\u5206\u6790\u578b\u957f\u671f\u8bb0\u5fc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u5206\u6790\u578b\u8bb0\u5fc6\u201d\u4f5c\u4e3a\u68c0\u7d22\u578b\u8bb0\u5fc6\u7684\u8865\u5145\uff0c\u4f7f\u957f\u671f\u591a\u6a21\u6001\u8bb0\u5fc6\u4e0d\u4ec5\u80fd\u67e5\u627e\u76f8\u5173\u4fe1\u606f\uff0c\u8fd8\u80fd\u5bf9\u8de8\u4ea4\u4e92\u79ef\u7d2f\u7684\u89c2\u5bdf\u8fdb\u884c\u8fc7\u6ee4\u3001\u805a\u5408\u3001\u6392\u5e8f\u548c\u65f6\u95f4\u6bd4\u8f83\u3002\u4f5c\u8005\u6784\u5efa AdaMM \u6846\u67b6\uff0c\u4ece\u5bf9\u8bdd\u3001\u56fe\u50cf\u548c\u4e0a\u4e0b\u6587\u5143\u6570\u636e\u4e2d\u
