selines in generative fidelity, downstream utility, and perceptual realism, highlighting its potential for data augmentation in annotation-scarce medical imaging.", "arxiv_id": "2607.29337", "arxiv_url": "https://arxiv.org/abs/2607.29337", "authors": ["Fernando Garc\u00eda-Torres", "Roc\u00edo del Amor", "Sandra Morales", "\u00c1lvaro Barroso", "Peter Heiduschka", "Bj\u00f6rn Kemper", "Valery Naranjo"], "brief": "\u8bba\u6587\u63d0\u51fa DualDiT\uff0c\u4e00\u79cd\u6761\u4ef6\u53cc\u8f93\u51fa\u6269\u6563 Transformer\uff0c\u7528\u4e8e\u8054\u5408\u751f\u6210\u5c0f\u9f20\u773c OCT \u56fe\u50cf\u53ca\u5176\u89c6\u7f51\u819c\u5c42\u5206\u5272\u63a9\u7801\u3002\u76f8\u6bd4 DDPM \u548c LDM \u57fa\u7ebf\uff0cDualDiT \u5728 FID/sFID\u3001\u4e13\u5bb6\u611f\u77e5\u771f\u5b9e\u6027\u4ee5\u53ca\u7528\u4e8e\u4e0b\u6e38 U-Net \u5206\u5272\u7684\u6570\u636e\u589e\u5f3a\u6548\u679c\u4e0a\u5747\u8868\u73b0\u66f4\u597d\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29337", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u533b\u5b66\u5f71\u50cf", "\u56fe\u50cf\u5206\u5272", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29337v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DualDiT: A Conditional Dual-Output Diffusion Transformer for Joint OCT Image and Segmentation Mask Generation", "tldr": "\u8bba\u6587\u63d0\u51fa DualDiT\uff0c\u4e00\u79cd\u6761\u4ef6\u53cc\u8f93\u51fa\u6269\u6563 Transformer\uff0c\u7528\u4e8e\u8054\u5408\u751f\u6210\u5c0f\u9f20\u773c OCT \u56fe\u50cf\u53ca\u5176\u89c6\u7f51\u819c\u5c42\u5206\u5272\u63a9\u7801\u3002\u76f8\u6bd4 DDPM \u548c LDM \u57fa\u7ebf\uff0cDualDiT \u5728 FID/sFID\u3001\u4e13\u5bb6\u611f\u77e5\u771f\u5b9e\u6027\u4ee5\u53ca\u7528\u4e8e\u4e0b\u6e38 U-Net \u5206\u5272\u7684\u6570\u636e\u589e\u5f3a\u6548\u679c\u4e0a\u5747\u8868\u73b0\u66f4\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conversational AI developed by geopolitical rivals reaches citizens worldwide, raising concerns that it could sway public opinion or be rejected as foreign propaganda, with consequences for democratic discourse and information sovereignty. Yet, whether an AI\u0027s perceived national origin shapes its persuasive power is unknown. In a preregistered randomized experiment, 403 adults from a nationally representative United States sample held a three-round debate with a chatbot introduced as either American (\"DiscoveryAI\") or Chinese (\"ZhengheAI\"), discussing a political or non-political topic. In all conditions, participants actually conversed with the same model (GPT-4o), instructed to argue against their initial position. We combined pre- and post-conversation self-reports of attitudes, trust, and collective narcissism with computational analyses of 1,209 participant turns, including LLM-coded stance and argumentative conduct, stance-sensitive embeddings, and keyword-masked emotion and toxicity classifiers. The conversations produced substantial attitude changes in every condition. Critically, the nationality label affected neither self-reported attitude change nor expressed stance, concessions, counterarguing, or affect, and equivalence tests and Bayes factors largely supported these null effects. The label\u0027s only reliable footprint was lower pre-conversation human-like trust in the Chinese model, whereas functionality trust was unaffected. Political topics slowed stance movement toward the AI\u0027s position, and collective narcissism predicted less attitude change regardless of origin, acting as a general barrier rather than an out-group filter. Users thus initially withhold social trust from a rival\u0027s AI yet still assimilate its arguments; origin labeling and transparency requirements alone may offer weak protection against foreign influence operations conducted through conversational AI.", "arxiv_id": "2607.29334", "arxiv_url": "https://arxiv.org/abs/2607.29334", "authors": ["Ningzhi Liu", "Yannic Hinrichs", "Jonas R. Kunst"], "brief": "\u8be5\u7814\u7a76\u901a\u8fc7\u9884\u6ce8\u518c\u968f\u673a\u5b9e\u9a8c\u8ba9\u7f8e\u56fd\u4ee3\u8868\u6027\u6837\u672c\u4e0e\u540c\u4e00 GPT-4o \u804a\u5929\u673a\u5668\u4eba\u8fa9\u8bba\uff0c\u4f46\u5206\u522b\u6807\u6ce8\u4e3a\u7f8e\u56fd\u6216\u4e2d\u56fd\u6765\u6e90\uff0c\u4ee5\u68c0\u9a8c\u611f\u77e5\u56fd\u7c4d\u662f\u5426\u5f71\u54cd\u8bf4\u670d\u529b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5bf9\u8bdd\u5728\u6240\u6709\u6761\u4ef6\u4e0b\u90fd\u663e\u8457\u6539\u53d8\u4e86\u53c2\u4e0e\u8005\u6001\u5ea6\uff0c\u4f46\u56fd\u7c4d\u6807\u7b7e\u51e0\u4e4e\u4e0d\u5f71\u54cd\u6001\u5ea6\u53d8\u5316\u3001\u7acb\u573a\u8868\u8fbe\u6216\u60c5\u7eea\u53cd\u5e94\uff1b\u4ec5\u4e2d\u56fd\u6807\u7b7e\u4f1a\u964d\u4f4e\u521d\u59cb\u201c\u7c7b\u4eba\u4fe1\u4efb\u201d\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29334", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8bf4\u670d\u529b", "\u4eba\u673a\u4ea4\u4e92", "\u653f\u6cbb\u4f20\u64ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29334v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The persuasive power of large language models does not depend on their perceived national origin", "tldr": "\u8be5\u7814\u7a76\u901a\u8fc7\u9884\u6ce8\u518c\u968f\u673a\u5b9e\u9a8c\u8ba9\u7f8e\u56fd\u4ee3\u8868\u6027\u6837\u672c\u4e0e\u540c\u4e00 GPT-4o \u804a\u5929\u673a\u5668\u4eba\u8fa9\u8bba\uff0c\u4f46\u5206\u522b\u6807\u6ce8\u4e3a\u7f8e\u56fd\u6216\u4e2d\u56fd\u6765\u6e90\uff0c\u4ee5\u68c0\u9a8c\u611f\u77e5\u56fd\u7c4d\u662f\u5426\u5f71\u54cd\u8bf4\u670d\u529b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5bf9\u8bdd\u5728\u6240\u6709\u6761\u4ef6\u4e0b\u90fd\u663e\u8457\u6539\u53d8\u4e86\u53c2\u4e0e\u8005\u6001\u5ea6\uff0c\u4f46\u56fd\u7c4d\u6807\u7b7e\u51e0\u4e4e\u4e0d\u5f71\u54cd\u6001\u5ea6\u53d8\u5316\u3001\u7acb\u573a\u8868\u8fbe\u6216\u60c5\u7eea\u53cd\u5e94\uff1b\u4ec5\u4e2d\u56fd\u6807\u7b7e\u4f1a\u964d\u4f4e\u521d\u59cb\u201c\u7c7b\u4eba\u4fe1\u4efb\u201d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-domain machine translation (MDMT) poses a unique challenge due to varying levels of linguistic complexity across domains. Inspired by human translators\u0027 ability to adapt reasoning effort based on difficulty, we propose TwT (Translation with Thought), a resource-rational framework that learns to modulate inference between intuitive and deliberate reasoning. TwT is trained in two stages: (1) supervised fine-tuning on difficulty-aware long chain-of-thought traces distilled from DeepSeek-R1 and rewritten by GPT-4o to reflect human-like reasoning economy, and (2) reinforcement learning with a hybrid reward to optimize translation quality and reasoning efficiency. Evaluated on 15 benchmarks spanning in-domain and out-of-domain settings, as well as 3 seen and 59 unseen languages, with ablations across three backbone models, TwT-7B and TwT-14B outperform much larger SOTA reasoning models in translation quality, while reducing token usage by 32--60\\%. These results confirm that aligning translation behavior with cognitive principles enables robust generalization, high translation quality, and efficient reasoning in MDMT.", "arxiv_id": "2607.29287", "arxiv_url": "https://arxiv.org/abs/2607.29287", "authors": ["Yongshi Ye", "Biao Fu", "Chongxuan Huang", "Yidong Chen", "Xiaodong Shi"], "brief": "\u8bba\u6587\u63d0\u51fa TwT\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u9886\u57df\u673a\u5668\u7ffb\u8bd1\u7684\u96be\u5ea6\u81ea\u9002\u5e94\u63a8\u7406\u6846\u67b6\uff0c\u53ef\u6839\u636e\u6587\u672c\u96be\u5ea6\u5728\u76f4\u89c9\u5f0f\u4e0e\u6df1\u601d\u5f0f\u63a8\u7406\u4e4b\u95f4\u8c03\u8282\u3002\u901a\u8fc7\u96be\u5ea6\u611f\u77e5\u601d\u7ef4\u94fe\u76d1\u7763\u5fae\u8c03\u548c\u7ed3\u5408\u7ffb\u8bd1\u8d28\u91cf\u3001\u63a8\u7406\u6548\u7387\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0cTwT-7B/14B \u5728 15 \u4e2a\u57fa\u51c6\u3001\u591a\u8bed\u8a00\u8bbe\u7f6e\u4e2d\u8d85\u8fc7\u66f4\u5927\u89c4\u6a21\u63a8\u7406\u6a21\u578b\uff0c\u5e76\u51cf\u5c11 32%--60% \u7684 token \u4f7f\u7528\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29287", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u7ffb\u8bd1", "\u5f3a\u5316\u5b66\u4e60", "\u601d\u7ef4\u94fe", "\u63a8\u7406\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29287v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Translation with Thought: Difficulty-Adaptive Reasoning via Reinforcement Learning for Multi-Domain Machine Translation", "tldr": "\u8bba\u6587\u63d0\u51fa TwT\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u9886\u57df\u673a\u5668\u7ffb\u8bd1\u7684\u96be\u5ea6\u81ea\u9002\u5e94\u63a8\u7406\u6846\u67b6\uff0c\u53ef\u6839\u636e\u6587\u672c\u96be\u5ea6\u5728\u76f4\u89c9\u5f0f\u4e0e\u6df1\u601d\u5f0f\u63a8\u7406\u4e4b\u95f4\u8c03\u8282\u3002\u901a\u8fc7\u96be\u5ea6\u611f\u77e5\u601d\u7ef4\u94fe\u76d1\u7763\u5fae\u8c03\u548c\u7ed3\u5408\u7ffb\u8bd1\u8d28\u91cf\u3001\u63a8\u7406\u6548\u7387\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0cTwT-7B/14B \u5728 15 \u4e2a\u57fa\u51c6\u3001\u591a\u8bed\u8a00\u8bbe\u7f6e\u4e2d\u8d85\u8fc7\u66f4\u5927\u89c4\u6a21\u63a8\u7406\u6a21\u578b\uff0c\u5e76\u51cf\u5c11 32%--60% \u7684 token \u4f7f\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial Intelligence (AI) and Deep Learning (DL) have notably advanced medical image analysis, yet many health- care organizations struggle to adopt them due to limited com- putational resources and specialized expertise. To address these barriers, we introduce OsteoCAD, a modular eHealth framework that democratizes access to DL tools in clinical practice. Osteo- CAD delivers end-to-end DL capabilities-from dataset creation and preprocessing to model training and inference-through an integrated and user-friendly interface. To mitigate local hardware constraints, the framework securely connects to remote GPU infrastructures. We validate OsteoCAD\u0027s feasibility through a real-world case study in Mexico focused on large bone tumor segmentation. The results demonstrate the framework\u0027s ability to enable DL-powered eHealth solutions without demanding ad- vanced technical expertise or complex local configurations.", "arxiv_id": "2607.29266", "arxiv_url": "https://arxiv.org/abs/2607.29266", "authors": ["Maximo Rodriguez-Herrero", "Dante D. Sanchez-Gallegos", "Heriberto Aguirre-Meneses", "Marco Antonio N\u00fa\u00f1ez-Gaona", "J. L. Gonzalez-Compean", "Jesus Carretero"], "brief": "\u672c\u6587\u63d0\u51fa OsteoCAD\uff0c\u4e00\u4e2a\u9762\u5411\u9aa8\u80bf\u7624\u5206\u5272\u7684\u4e91-\u8fb9\u534f\u540c\u3001\u4eba\u673a\u534f\u540c eHealth \u6846\u67b6\uff0c\u63d0\u4f9b\u4ece\u6570\u636e\u96c6\u6784\u5efa\u3001\u9884\u5904\u7406\u5230\u6a21\u578b\u8bad\u7ec3\u4e0e\u63a8\u7406\u7684\u4e00\u4f53\u5316\u6df1\u5ea6\u5b66\u4e60\u5de5\u5177\u3002\u901a\u8fc7\u8fde\u63a5\u8fdc\u7a0b GPU \u8d44\u6e90\u5e76\u63d0\u4f9b\u6613\u7528\u754c\u9762\uff0c\u5b83\u964d\u4f4e\u4e86\u533b\u7597\u673a\u6784\u5728\u7b97\u529b\u548c\u4e13\u4e1a\u6280\u672f\u4e0a\u7684\u95e8\u69db\uff0c\u5e76\u5728\u58a8\u897f\u54e5\u771f\u5b9e\u9aa8\u80bf\u7624\u5206\u5272\u6848\u4f8b\u4e2d\u9a8c\u8bc1\u4e86\u53ef\u884c\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29266", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u56fe\u50cf\u5206\u5272", "\u4e91\u8fb9\u534f\u540c", "\u4eba\u673a\u534f\u540c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29266v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OsteoCAD: A Human-in-the-Loop Cloud-Edge Framework for Bone Tumor Segmentation", "tldr": "\u672c\u6587\u63d0\u51fa OsteoCAD\uff0c\u4e00\u4e2a\u9762\u5411\u9aa8\u80bf\u7624\u5206\u5272\u7684\u4e91-\u8fb9\u534f\u540c\u3001\u4eba\u673a\u534f\u540c eHealth \u6846\u67b6\uff0c\u63d0\u4f9b\u4ece\u6570\u636e\u96c6\u6784\u5efa\u3001\u9884\u5904\u7406\u5230\u6a21\u578b\u8bad\u7ec3\u4e0e\u63a8\u7406\u7684\u4e00\u4f53\u5316\u6df1\u5ea6\u5b66\u4e60\u5de5\u5177\u3002\u901a\u8fc7\u8fde\u63a5\u8fdc\u7a0b GPU \u8d44\u6e90\u5e76\u63d0\u4f9b\u6613\u7528\u754c\u9762\uff0c\u5b83\u964d\u4f4e\u4e86\u533b\u7597\u673a\u6784\u5728\u7b97\u529b\u548c\u4e13\u4e1a\u6280\u672f\u4e0a\u7684\u95e8\u69db\uff0c\u5e76\u5728\u58a8\u897f\u54e5\u771f\u5b9e\u9aa8\u80bf\u7624\u5206\u5272\u6848\u4f8b\u4e2d\u9a8c\u8bc1\u4e86\u53ef\u884c\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable evaluation of open-ended LLM outputs requires fine-grained rubrics, yet expert curation is costly and difficult to scale. Existing automated pipelines rely on strict judge unanimity and binary variance filters, which cannot distinguish measurable rubrics from informative ones. We introduce CalibratedRubric, a task-adaptive framework that combines type-specific scoring, Bayesian rubric-measurability filtering, and item response theory (IRT)-based bank assembly. CalibratedRubric estimates each rubric\u0027s measurability with a Beta--Bernoulli agreement posterior and uses a submodular information-coverage objective to construct compact rubric banks over the observed capability range. Across financial, healthcare, general, and legal benchmarks, measurability filtering improves human-gold agreement on JudgmentBench from $\u03ba=0.604$ to $0.743$. IRT-based greedy selection improves cross-fitted rank fidelity over random selection across all six evaluated response blocks and requires only 49 rather than 131 rubrics to reach the target correlation on FinResearchBench decision-support tasks. Task-label perturbations further reduce system separation, confirming the practical relevance of task-adaptive scoring. These results support CalibratedRubric as an efficient, uncertainty-aware approach to open-ended LLM evaluation, with calibration gains depending on sufficient judge redundancy.", "arxiv_id": "2607.29252", "arxiv_url": "https://arxiv.org/abs/2607.29252", "authors": ["Mengting Chen", "Yanshu Sun", "Wanting Liang", "Beidi Luan", "Rui Sun", "Dezhi Chen", "Jing Li", "Zuo Bai"], "brief": "\u672c\u6587\u63d0\u51fa CalibratedRubric\uff0c\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f\u5927\u6a21\u578b\u8f93\u51fa\u8bc4\u6d4b\u7684\u4efb\u52a1\u81ea\u9002\u5e94\u8bc4\u5206\u89c4\u51c6\u5e93\u6784\u5efa\u6846\u67b6\uff0c\u7ed3\u5408\u7c7b\u578b\u5316\u6253\u5206\u3001\u8d1d\u53f6\u65af\u53ef\u6d4b\u6027\u8fc7\u6ee4\u548c\u57fa\u4e8e IRT \u7684\u89c4\u51c6\u9009\u62e9\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u663e\u8457\u63d0\u5347\u4e0e\u4eba\u7c7b\u91d1\u6807\u51c6\u7684\u4e00\u81f4\u6027\uff0c\u5e76\u7528\u66f4\u5c11\u89c4\u51c6\u8fbe\u5230\u76ee\u6807\u6392\u5e8f\u76f8\u5173\u6027\uff0c\u63d0\u9ad8\u8bc4\u6d4b\u6548\u7387\u4e0e\u53ef\u9760\u6027\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29252", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u8bc4\u6d4b", "\u8bc4\u5206\u89c4\u51c6", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u4e0d\u786e\u5b9a\u6027\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29252v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CalibratedRubric: Task-Adaptive Rubric Banks for Open-Ended LLM Evaluation", "tldr": "\u672c\u6587\u63d0\u51fa CalibratedRubric\uff0c\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f\u5927\u6a21\u578b\u8f93\u51fa\u8bc4\u6d4b\u7684\u4efb\u52a1\u81ea\u9002\u5e94\u8bc4\u5206\u89c4\u51c6\u5e93\u6784\u5efa\u6846\u67b6\uff0c\u7ed3\u5408\u7c7b\u578b\u5316\u6253\u5206\u3001\u8d1d\u53f6\u65af\u53ef\u6d4b\u6027\u8fc7\u6ee4\u548c\u57fa\u4e8e IRT \u7684\u89c4\u51c6\u9009\u62e9\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u663e\u8457\u63d0\u5347\u4e0e\u4eba\u7c7b\u91d1\u6807\u51c6\u7684\u4e00\u81f4\u6027\uff0c\u5e76\u7528\u66f4\u5c11\u89c4\u51c6\u8fbe\u5230\u76ee\u6807\u6392\u5e8f\u76f8\u5173\u6027\uff0c\u63d0\u9ad8\u8bc4\u6d4b\u6548\u7387\u4e0e\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern large language models (LLMs) are expected not just to answer correctly, but to adapt their behavior to different human values and use cases. As a result, multi-reward reinforcement learning (RL) has become an increasingly important problem for LLMs, where each reward captures a different aspect of desired behavior. However, optimizing with multiple rewards suffers from a more severe alignment tax issue, where different optimization objectives can trade off or even conflict with each other, leading to unstable and inefficient post-training. In this work, we propose PRISM, a new multi-reward RL framework built upon the idea of policy-space decomposition and composition. Instead of compositing different rewards, PRISM optimizes a set of standalone positive policies and a global negative policy. This alleviates the potential conflict during multi-reward policy optimization, while enabling controllability during inference by flexible policy composition. Experiments on scientific reasoning, tool-use reasoning, and helpfulness-safety alignment show that PRISM consistently outperforms existing multi-reward RL baselines, with extra controllability for inference-time preference control.", "arxiv_id": "2607.29246", "arxiv_url": "https://arxiv.org/abs/2607.29246", "authors": ["Ruiming Liang", "Yi Zhong", "Yizhen Yuan", "Yinan Zheng", "Tianyi Tan", "Tianyue Wang", "Haiyun Guo", "Jinqiao Wang", "Xianyuan Zhan"], "brief": "\u672c\u6587\u63d0\u51fa PRISM \u591a\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4e0d\u518d\u6df7\u5408\u591a\u4e2a\u5956\u52b1\uff0c\u800c\u662f\u5728\u7b56\u7565\u7a7a\u95f4\u4e2d\u5206\u522b\u4f18\u5316\u591a\u4e2a\u6b63\u5411\u7b56\u7565\u548c\u4e00\u4e2a\u5168\u5c40\u8d1f\u5411\u7b56\u7565\uff0c\u518d\u8fdb\u884c\u7ec4\u5408\u3002\u8be5\u65b9\u6cd5\u7f13\u89e3\u4e86\u591a\u76ee\u6807\u51b2\u7a81\u548c\u5bf9\u9f50\u7a0e\u95ee\u9898\uff0c\u5728\u79d1\u5b66\u63a8\u7406\u3001\u5de5\u5177\u4f7f\u7528\u63a8\u7406\u4e0e\u6709\u7528\u6027-\u5b89\u5168\u6027\u5bf9\u9f50\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u73b0\u6709\u591a\u5956\u52b1 RL \u57fa\u7ebf\uff0c\u5e76\u652f\u6301\u63a8\u7406\u65f6\u504f\u597d\u63a7\u5236\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29246", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u76ee\u6807\u4f18\u5316", "\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29246v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Don\u0027t Mix Rewards, Mix Policies: Policy Decomposition and Optimization for Multi-Reward RL", "tldr": "\u672c\u6587\u63d0\u51fa PRISM \u591a\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4e0d\u518d\u6df7\u5408\u591a\u4e2a\u5956\u52b1\uff0c\u800c\u662f\u5728\u7b56\u7565\u7a7a\u95f4\u4e2d\u5206\u522b\u4f18\u5316\u591a\u4e2a\u6b63\u5411\u7b56\u7565\u548c\u4e00\u4e2a\u5168\u5c40\u8d1f\u5411\u7b56\u7565\uff0c\u518d\u8fdb\u884c\u7ec4\u5408\u3002\u8be5\u65b9\u6cd5\u7f13\u89e3\u4e86\u591a\u76ee\u6807\u51b2\u7a81\u548c\u5bf9\u9f50\u7a0e\u95ee\u9898\uff0c\u5728\u79d1\u5b66\u63a8\u7406\u3001\u5de5\u5177\u4f7f\u7528\u63a8\u7406\u4e0e\u6709\u7528\u6027-\u5b89\u5168\u6027\u5bf9\u9f50\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u73b0\u6709\u591a\u5956\u52b1 RL \u57fa\u7ebf\uff0c\u5e76\u652f\u6301\u63a8\u7406\u65f6\u504f\u597d\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Computed tomography angiography (CTA) is crucial for preprocedural TAVI planning, providing the anatomical information required for prosthesis sizing and vascular access assessment. As the volume of TAVI procedure increases, improving efficiency and standardizing annotations is becoming essential in clinical practice. This study presents TAVI-TEC, a fully automated artificial intelligence-based framework integrated into a web based DICOM viewer for routine preoperative TAVI planning. Pre-procedural CTA scans from patients undergoing TAVI with SAPIEN 3 Ultra (S3U) prostheses were processed using a fully automated pipeline. Deep learning-based segmentation of cardiovascular structures, calcification detection, centerline extraction, landmark identification, and annular plane definition was implemented to quantify key annular and aortic root measurements and color-coded maps of lumen reduction and vessel diameter for vascular access. A multilayer perceptron classifier was trained to predict prosthesis size prior to the TAVI procedure. Results revealed that TAVI-TEC enabled pre-procedural measurements in approximately 2-6 min. Strong agreement with clinician-derived measurements was observed for annular area (coefficient of concordance, CCC = 0.934; interclass correlation coefficient, ICC = 0.935; R^2 = 0.881) and perimeter (CCC = 0.909; ICC = 0.909; R^2 = 0.854). The valve-size prediction model achieved 82% overall accuracy, with most misclassifications occurring between adjacent prosthesis sizes. Though further multicenter validation and extension to additional measurements and valve platforms are required, the TAVI-TEC methodology may reduce operator variability in pre-TAVI measurements and streamline the preoperative workflows of the Heart Team for decision-making.", "arxiv_id": "2607.29243", "arxiv_url": "https://arxiv.org/abs/2607.29243", "authors": ["Alessandra Zerillo", "Stefano Cannata", "Diego Bellavia", "Daniele Ciriello", "Simone Manini", "Salvatore Pasta", "Caterina Gandolfo"], "brief": "\u8bba\u6587\u63d0\u51fa TAVI-TEC\uff0c\u4e00\u4e2a\u96c6\u6210\u5728\u7f51\u9875 DICOM \u9605\u7247\u5668\u4e2d\u7684\u5168\u81ea\u52a8 AI \u5de5\u5177\uff0c\u7528\u4e8e\u7ecf\u5bfc\u7ba1\u4e3b\u52a8\u8109\u74e3\u690d\u5165\u672f\u524d CTA \u89c4\u5212\u3002\u7cfb\u7edf\u53ef\u5728\u7ea6 2-6 \u5206\u949f\u5185\u5b8c\u6210\u5206\u5272\u3001\u9499\u5316\u68c0\u6d4b\u3001\u4e2d\u5fc3\u7ebf\u4e0e\u5173\u952e\u6d4b\u91cf\uff0c\u5e76\u4e0e\u4e34\u5e8a\u533b\u751f\u6d4b\u91cf\u9ad8\u5ea6\u4e00\u81f4\uff0c\u74e3\u819c\u5c3a\u5bf8\u9884\u6d4b\u51c6\u786e\u7387\u8fbe 82%\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29243", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u6df1\u5ea6\u5b66\u4e60", "\u56fe\u50cf\u5206\u5272", "\u4e34\u5e8a\u51b3\u7b56"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29243v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TAVI-TEC: An AI-Based Tool for Procedural Planning of Transcatheter Aortic Valve Implantation", "tldr": "\u8bba\u6587\u63d0\u51fa TAVI-TEC\uff0c\u4e00\u4e2a\u96c6\u6210\u5728\u7f51\u9875 DICOM \u9605\u7247\u5668\u4e2d\u7684\u5168\u81ea\u52a8 AI \u5de5\u5177\uff0c\u7528\u4e8e\u7ecf\u5bfc\u7ba1\u4e3b\u52a8\u8109\u74e3\u690d\u5165\u672f\u524d CTA \u89c4\u5212\u3002\u7cfb\u7edf\u53ef\u5728\u7ea6 2-6 \u5206\u949f\u5185\u5b8c\u6210\u5206\u5272\u3001\u9499\u5316\u68c0\u6d4b\u3001\u4e2d\u5fc3\u7ebf\u4e0e\u5173\u952e\u6d4b\u91cf\uff0c\u5e76\u4e0e\u4e34\u5e8a\u533b\u751f\u6d4b\u91cf\u9ad8\u5ea6\u4e00\u81f4\uff0c\u74e3\u819c\u5c3a\u5bf8\u9884\u6d4b\u51c6\u786e\u7387\u8fbe 82%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In vision--language models, commonsense-driven hallucination (CDH) occurs when a model\u0027s commonsense prior overrides clear visual evidence of an atypical state. For example, a model may report that a visibly six-fingered hand has five fingers. We show that these errors are systematically directed: when a model answers a question about a counterfactual (CF) image incorrectly, its answer often coincides with the candidate it prefers without access to the image. Suppressing this prior indiscriminately can repair CF errors, but may also disrupt correct answers on matched commonsense (CS) images, where the same prior is helpful. We therefore propose Selective Prior Calibration (SPC), which subtracts candidate-level prior-preference estimates from image-conditioned scores with an instance-dependent strength and revises the original prediction only when the resulting score pattern strongly supports an alternative. Extensive experiments demonstrate that SPC substantially improves accuracy on CF images while largely preserving accuracy on matched CS images. Furthermore, these gains generalize across CDH categories, candidate-answer permutations, and other conflict benchmarks, while SPC rarely alters predictions on benchmarks without such conflicts.", "arxiv_id": "2607.29240", "arxiv_url": "https://arxiv.org/abs/2607.29240", "authors": ["Kesheng Chen", "Yamin Hu", "Wenjian Luo"], "brief": "\u8bba\u6587\u7814\u7a76\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u201c\u5e38\u8bc6\u5148\u9a8c\u538b\u8fc7\u89c6\u89c9\u8bc1\u636e\u201d\u5bfc\u81f4\u7684\u5e7b\u89c9\u95ee\u9898\uff0c\u4f8b\u5982\u628a\u660e\u663e\u516d\u6307\u7684\u624b\u4ecd\u56de\u7b54\u4e3a\u4e94\u6307\u3002\u4f5c\u8005\u63d0\u51fa\u9009\u62e9\u6027\u5148\u9a8c\u6821\u51c6\uff08SPC\uff09\uff0c\u6309\u5b9e\u4f8b\u5f3a\u5ea6\u6263\u9664\u5019\u9009\u7b54\u6848\u7684\u5148\u9a8c\u504f\u597d\uff0c\u53ea\u5728\u8bc1\u636e\u8db3\u591f\u652f\u6301\u66ff\u4ee3\u7b54\u6848\u65f6\u4fee\u6539\u9884\u6d4b\uff0c\u4ece\u800c\u663e\u8457\u63d0\u5347\u53cd\u5e38\u56fe\u50cf\u51c6\u786e\u7387\u5e76\u57fa\u672c\u4fdd\u6301\u5e38\u8bc6\u56fe\u50cf\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29240", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9", "\u5148\u9a8c\u6821\u51c6", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29240v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Model Priors Conflict with Visual Evidence: Mitigating Commonsense-Driven Hallucinations by Selective Prior Calibration", "tldr": "\u8bba\u6587\u7814\u7a76\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u201c\u5e38\u8bc6\u5148\u9a8c\u538b\u8fc7\u89c6\u89c9\u8bc1\u636e\u201d\u5bfc\u81f4\u7684\u5e7b\u89c9\u95ee\u9898\uff0c\u4f8b\u5982\u628a\u660e\u663e\u516d\u6307\u7684\u624b\u4ecd\u56de\u7b54\u4e3a\u4e94\u6307\u3002\u4f5c\u8005\u63d0\u51fa\u9009\u62e9\u6027\u5148\u9a8c\u6821\u51c6\uff08SPC\uff09\uff0c\u6309\u5b9e\u4f8b\u5f3a\u5ea6\u6263\u9664\u5019\u9009\u7b54\u6848\u7684\u5148\u9a8c\u504f\u597d\uff0c\u53ea\u5728\u8bc1\u636e\u8db3\u591f\u652f\u6301\u66ff\u4ee3\u7b54\u6848\u65f6\u4fee\u6539\u9884\u6d4b\uff0c\u4ece\u800c\u663e\u8457\u63d0\u5347\u53cd\u5e38\u56fe\u50cf\u51c6\u786e\u7387\u5e76\u57fa\u672c\u4fdd\u6301\u5e38\u8bc6\u56fe\u50cf\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "InMyStyle is a privacy first, single user system that adapts small language models to rewrite AI-edited text towards an individual user\u0027s writing style without an instruction prompt at inference. Given a user\u0027s documents, it uses multiple local helper LLMs to construct paired training examples and fine tunes LoRA adapters on base models ranging from 0.5B to 7B parameters. Length aware generation budgets and automatic chunking support inputs of different lengths. On 219 evaluation pairs from a scientific-paper corpus, the automatic composite score plateaus at 0.69 [scale 0-1] across all model sizes under both greedy and sampled decoding. This observed plateau suggests that small models are sufficient for the measured rewriting task, with model size determining trade-offs rather than a stable quality ranking. As a secondary evaluation, 400 ratings from five LLM judges give InMyStyle outputs a mean perceived AI-ness score over 20% lower than their helper-AI generated inputs, while mean perceived AI-ness scores decrease with model size within InMyStyle.", "arxiv_id": "2607.29238", "arxiv_url": "https://arxiv.org/abs/2607.29238", "authors": ["Antorweep Chakravorty"], "brief": "\u8bba\u6587\u63d0\u51fa InMyStyle\uff0c\u4e00\u4e2a\u9690\u79c1\u4f18\u5148\u7684\u5355\u7528\u6237\u6587\u672c\u6539\u5199\u7cfb\u7edf\uff0c\u7528\u672c\u5730\u8f85\u52a9\u5927\u6a21\u578b\u6784\u9020\u914d\u5bf9\u6570\u636e\uff0c\u5e76\u4e3a0.5B\u52307B\u5c0f\u8bed\u8a00\u6a21\u578b\u5fae\u8c03 LoRA \u9002\u914d\u5668\uff0c\u4f7f AI \u7f16\u8f91\u6587\u672c\u66f4\u8d34\u8fd1\u4e2a\u4eba\u5199\u4f5c\u98ce\u683c\u3002\u5b9e\u9a8c\u663e\u793a\u81ea\u52a8\u8bc4\u5206\u5728\u4e0d\u540c\u6a21\u578b\u89c4\u6a21\u4e0a\u7ea6\u4e3a0.69\u5e76\u8d8b\u4e8e\u5e73\u53f0\uff0c\u8868\u660e\u5c0f\u6a21\u578b\u5df2\u8db3\u591f\u5b8c\u6210\u8be5\u7c7b\u98ce\u683c\u6539\u5199\uff1bLLM\u8bc4\u5ba1\u4e2d\u8f93\u51fa\u7684\u201cAI\u611f\u201d\u6bd4\u8f93\u5165\u4f4e20%\u4ee5\u4e0a\u3002", "categories": ["cs.CL", "cs.AI", "cs.CY", "cs.ET", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29238", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5c0f\u8bed\u8a00\u6a21\u578b", "LoRA", "\u6587\u672c\u6539\u5199", "\u5199\u4f5c\u98ce\u683c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29238v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Small Is Enough: Per-User Style Rewriting of AI-Edited Text via LoRA Adapters", "tldr": "\u8bba\u6587\u63d0\u51fa InMyStyle\uff0c\u4e00\u4e2a\u9690\u79c1\u4f18\u5148\u7684\u5355\u7528\u6237\u6587\u672c\u6539\u5199\u7cfb\u7edf\uff0c\u7528\u672c\u5730\u8f85\u52a9\u5927\u6a21\u578b\u6784\u9020\u914d\u5bf9\u6570\u636e\uff0c\u5e76\u4e3a0.5B\u52307B\u5c0f\u8bed\u8a00\u6a21\u578b\u5fae\u8c03 LoRA \u9002\u914d\u5668\uff0c\u4f7f AI \u7f16\u8f91\u6587\u672c\u66f4\u8d34\u8fd1\u4e2a\u4eba\u5199\u4f5c\u98ce\u683c\u3002\u5b9e\u9a8c\u663e\u793a\u81ea\u52a8\u8bc4\u5206\u5728\u4e0d\u540c\u6a21\u578b\u89c4\u6a21\u4e0a\u7ea6\u4e3a0.69\u5e76\u8d8b\u4e8e\u5e73\u53f0\uff0c\u8868\u660e\u5c0f\u6a21\u578b\u5df2\u8db3\u591f\u5b8c\u6210\u8be5\u7c7b\u98ce\u683c\u6539\u5199\uff1bLLM\u8bc4\u5ba1\u4e2d\u8f93\u51fa\u7684\u201cAI\u611f\u201d\u6bd4\u8f93\u5165\u4f4e20%\u4ee5\u4e0a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Although world-action models (WAMs) enhance long-horizon robot control by predicting visual evolution before acting, long-horizon reliability demands repeated re-grounding in real observations--not recursive rollout. Existing WAMs address this by refreshing history or KV cache with ground-truth data between chunks. However, such chunk-wise feedback operates at a coarse temporal granularity and thus fails to correct prediction errors at the individual time-step level. To address this, we propose Feedback Flow Matching (FBFM), a training-free inference mechanism that pushes re-grounding inside the actively generated chunk. During flow matching, FBFM applies a masked pseudoinverse correction to the conditional velocity field: it leverages the preceding action chunk to guide generation of the next action chunk, and uses the image observed after executing that preceding chunk to guide the next frame prediction. This cross-chunk pairing--where feedback from one chunk arrives in time to shape the next--creates an asynchronous loop that corrects errors without waiting for chunk boundaries. Being training-free, the mechanism improves responsiveness to unexpected events and suppresses drift in long-horizon tasks. We evaluate FBFM on both a joint-generation WAM (DreamZero) and a stage-wise WAM (LingBot-VA). On selected LIBERO and RoboTwin2.0 tasks, it improves success rates by over 5% in favorable settings, and real-world robot observation-prediction diagnostics show notably better tracking. We argue that FBFM offers a new paradigm for fine-grained online correction, bridging open-loop flow generation with closed-loop real-world dynamics.", "arxiv_id": "2607.29235", "arxiv_url": "https://arxiv.org/abs/2607.29235", "authors": ["Peize Li", "Ruimeng Zhang", "Ru Zhang", "Cong Huang", "Kai Chen", "Shanghang Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa FBFM\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5f02\u6b65\u53cd\u9988\u673a\u5236\uff0c\u5728\u6d41\u5339\u914d\u751f\u6210\u8fc7\u7a0b\u4e2d\u5229\u7528\u4e0a\u4e00\u52a8\u4f5c\u5757\u6267\u884c\u540e\u7684\u771f\u5b9e\u89c2\u6d4b\u548c\u52a8\u4f5c\u4fe1\u606f\uff0c\u5bf9\u4e0b\u4e00\u6bb5\u52a8\u4f5c\u4e0e\u89c6\u89c9\u9884\u6d4b\u8fdb\u884c\u7ec6\u7c92\u5ea6\u6821\u6b63\u3002\u8be5\u65b9\u6cd5\u53ef\u51cf\u5c11\u957f\u65f6\u7a0b\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u7684\u9884\u6d4b\u6f02\u79fb\uff0c\u5728 LIBERO\u3001RoboTwin2.0 \u53ca\u771f\u5b9e\u673a\u5668\u4eba\u8bca\u65ad\u4e2d\u5e26\u6765\u7ea6 5% \u4ee5\u4e0a\u6210\u529f\u7387\u63d0\u5347\u548c\u66f4\u597d\u7684\u89c2\u6d4b\u8ddf\u8e2a\u3002", "categories": ["cs.RO", "cs.AI", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29235", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u4e16\u754c\u6a21\u578b", "\u6d41\u5339\u914d", "\u5728\u7ebf\u53cd\u9988"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29235v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FBFM: A Training-Free Asynchronous Feedback Mechanism for Flow-Matching in World-Action Models Execution", "tldr": "\u8bba\u6587\u63d0\u51fa FBFM\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5f02\u6b65\u53cd\u9988\u673a\u5236\uff0c\u5728\u6d41\u5339\u914d\u751f\u6210\u8fc7\u7a0b\u4e2d\u5229\u7528\u4e0a\u4e00\u52a8\u4f5c\u5757\u6267\u884c\u540e\u7684\u771f\u5b9e\u89c2\u6d4b\u548c\u52a8\u4f5c\u4fe1\u606f\uff0c\u5bf9\u4e0b\u4e00\u6bb5\u52a8\u4f5c\u4e0e\u89c6\u89c9\u9884\u6d4b\u8fdb\u884c\u7ec6\u7c92\u5ea6\u6821\u6b63\u3002\u8be5\u65b9\u6cd5\u53ef\u51cf\u5c11\u957f\u65f6\u7a0b\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u7684\u9884\u6d4b\u6f02\u79fb\uff0c\u5728 LIBERO\u3001RoboTwin2.0 \u53ca\u771f\u5b9e\u673a\u5668\u4eba\u8bca\u65ad\u4e2d\u5e26\u6765\u7ea6 5% \u4ee5\u4e0a\u6210\u529f\u7387\u63d0\u5347\u548c\u66f4\u597d\u7684\u89c2\u6d4b\u8ddf\u8e2a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Swarm and evolutionary algorithms are usually analyzed as complete procedural systems in which nonlinear selection, replacement, and adaptation obscure simpler structure within candidate generation. This paper introduces an operator--selection factorization that separates objective-independent variation from boundary repair and fitness-dependent selection, and uses it to study the proposal geometry of the Self-Organizing Migrating Algorithm (SOMA) and Differential Evolution (DE). The canonical SOMA proposal is shown to be affine in the search space and exactly linear in an augmented migrant--leader state. In leader-relative coordinates, the resulting operator provides a direct interpretation of interpolation, projection, overshooting, and coordinate masking. Under Bernoulli perturbation masks, we derive closed-form expressions for the proposal mean, covariance, expected squared step length, expected squared distance from the leader, active dimensionality, and coordinate coverage. For canonical DE/rand/1/bin, we derive the finite-population moments of differential mutation and characterize the additional covariance and coordinate dependence induced by forced-coordinate binomial crossover. Exact enumeration and Monte Carlo experiments verify the analytical identities and quantify the effects of mask conditioning, boundary repair, and fitness-based selection. The analysis further motivates geometry-controlled and rotation-aware SOMA variants, together with an adaptive population-reducing extension of iSOMA. Experiments on the complete noiseless BBOB benchmark show that these operator-guided variants substantially improve upon canonical SOMA and are competitive with established DE methods in several dimension--budget regimes. The results demonstrate how proposal-level operator analysis can support both the interpretation and design of population-based optimizers.", "arxiv_id": "2607.29228", "arxiv_url": "https://arxiv.org/abs/2607.29228", "authors": ["Vojt\u011bch Nov\u00e1k", "Ivan Zelinka"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u7b97\u5b50\u2014\u9009\u62e9\u201d\u5206\u89e3\u6846\u67b6\uff0c\u5c06\u7fa4\u4f53/\u8fdb\u5316\u7b97\u6cd5\u4e2d\u7684\u5019\u9009\u751f\u6210\u4e0e\u8fb9\u754c\u4fee\u590d\u3001\u9002\u5e94\u5ea6\u9009\u62e9\u5206\u79bb\uff0c\u5e76\u5bf9 SOMA \u4e0e\u5dee\u5206\u8fdb\u5316\u7684\u641c\u7d22\u51e0\u4f55\u8fdb\u884c\u89e3\u6790\u3002\u4f5c\u8005\u63a8\u5bfc\u4e86\u591a\u79cd\u5747\u503c\u3001\u534f\u65b9\u5dee\u548c\u6b65\u957f\u7b49\u95ed\u5f0f\u6027\u8d28\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba1\u6539\u8fdb\u7248 SOMA\uff0c\u5728 BBOB \u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u7ecf\u5178 SOMA\uff0c\u90e8\u5206\u8bbe\u7f6e\u4e0b\u53ef\u4e0e\u6210\u719f DE \u65b9\u6cd5\u7ade\u4e89\u3002", "categories": ["cs.NE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29228", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fdb\u5316\u7b97\u6cd5", "\u7fa4\u4f53\u4f18\u5316", "\u5dee\u5206\u8fdb\u5316", "\u968f\u673a\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29228v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Linear Proposal Operators and Stochastic Search Geometry in SOMA and Differential Evolution", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u7b97\u5b50\u2014\u9009\u62e9\u201d\u5206\u89e3\u6846\u67b6\uff0c\u5c06\u7fa4\u4f53/\u8fdb\u5316\u7b97\u6cd5\u4e2d\u7684\u5019\u9009\u751f\u6210\u4e0e\u8fb9\u754c\u4fee\u590d\u3001\u9002\u5e94\u5ea6\u9009\u62e9\u5206\u79bb\uff0c\u5e76\u5bf9 SOMA \u4e0e\u5dee\u5206\u8fdb\u5316\u7684\u641c\u7d22\u51e0\u4f55\u8fdb\u884c\u89e3\u6790\u3002\u4f5c\u8005\u63a8\u5bfc\u4e86\u591a\u79cd\u5747\u503c\u3001\u534f\u65b9\u5dee\u548c\u6b65\u957f\u7b49\u95ed\u5f0f\u6027\u8d28\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba1\u6539\u8fdb\u7248 SOMA\uff0c\u5728 BBOB \u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u7ecf\u5178 SOMA\uff0c\u90e8\u5206\u8bbe\u7f6e\u4e0b\u53ef\u4e0e\u6210\u719f DE \u65b9\u6cd5\u7ade\u4e89\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We address the challenge of securely and efficiently outsourcing AI computations from a trusted but computationally weak client to an untrusted but powerful server, in the setting where the client holds both the input and the model, and the server must learn neither. We present MOSAIC, whose core is a novel matrix-multiplication masking protocol that scales to far larger matrices than prior work, enabling the safe outsourcing of modern workloads such as large transformer inference. By introducing small amounts of noise to the multiplication result and thereby relaxing correctness, MOSAIC achieves optimal asymptotic client overhead and concrete runtimes orders of magnitude faster than prior work. Its security reduces to the decisional LWE and LPN assumptions. Because this noise accumulates across the many layers of a transformer, a key technical challenge is bounding error growth; MOSAIC addresses this with an error-scaling mechanism based on random Hadamard rotations. On large 70B transformer models, MOSAIC\u0027s perplexity is comparable to popular quantization approaches and even matches full-precision BF16 inference on HumanEval. Finally, we present an end-to-end implementation showing how ideas like MOSAIC can promise a path towards large-scale confidential AI in modern data centers. Non-confidential inference is already distributed across phase (prefill/decode), layer, and time to maximize utilization of heterogeneous hardware, using RDMA-like networking to move activations, cached KV values, and weights across nodes. MOSAIC enables scaling of confidential compute by keeping the trusted computing base (TCB) small and outsourcing the bulk of the AI computation to untrusted accelerators.", "arxiv_id": "2607.29221", "arxiv_url": "https://arxiv.org/abs/2607.29221", "authors": ["James Hsin-yu Chiang", "Sheila Zingg", "Kari Kostiainen", "Srdjan Capkun"], "brief": "MOSAIC \u63d0\u51fa\u4e00\u79cd\u9762\u5411 AI \u8ba1\u7b97\u5916\u5305\u7684\u5b89\u5168\u63a9\u7801\u534f\u8bae\uff0c\u8ba9\u5f31\u5ba2\u6237\u7aef\u5728\u540c\u65f6\u4fdd\u62a4\u8f93\u5165\u548c\u6a21\u578b\u9690\u79c1\u7684\u60c5\u51b5\u4e0b\uff0c\u628a\u5927\u89c4\u6a21\u77e9\u9635\u4e58\u6cd5\u548c Transformer \u63a8\u7406\u4ea4\u7ed9\u4e0d\u53ef\u4fe1\u670d\u52a1\u5668\u6267\u884c\u3002\u901a\u8fc7\u5141\u8bb8\u5c11\u91cf\u566a\u58f0\u5e76\u7528\u968f\u673a Hadamard \u65cb\u8f6c\u63a7\u5236\u8bef\u5dee\u7d2f\u79ef\uff0c\u5b83\u5728 70B \u6a21\u578b\u4e0a\u8fbe\u5230\u63a5\u8fd1\u91cf\u5316\u751a\u81f3\u90e8\u5206\u4efb\u52a1\u5339\u914d BF16 \u7684\u6548\u679c\uff0c\u8fd0\u884c\u901f\u5ea6\u8f83\u4ee5\u5f80\u65b9\u6848\u63d0\u5347\u6570\u4e2a\u6570\u91cf\u7ea7\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29221", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9690\u79c1\u8ba1\u7b97", "\u5b89\u5168\u5916\u5305", "\u5927\u6a21\u578b\u63a8\u7406", "\u5bc6\u7801\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29221v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MOSAIC: Masked Outsourcing of Secure AI Computations", "tldr": "MOSAIC \u63d0\u51fa\u4e00\u79cd\u9762\u5411 AI \u8ba1\u7b97\u5916\u5305\u7684\u5b89\u5168\u63a9\u7801\u534f\u8bae\uff0c\u8ba9\u5f31\u5ba2\u6237\u7aef\u5728\u540c\u65f6\u4fdd\u62a4\u8f93\u5165\u548c\u6a21\u578b\u9690\u79c1\u7684\u60c5\u51b5\u4e0b\uff0c\u628a\u5927\u89c4\u6a21\u77e9\u9635\u4e58\u6cd5\u548c Transformer \u63a8\u7406\u4ea4\u7ed9\u4e0d\u53ef\u4fe1\u670d\u52a1\u5668\u6267\u884c\u3002\u901a\u8fc7\u5141\u8bb8\u5c11\u91cf\u566a\u58f0\u5e76\u7528\u968f\u673a Hadamard \u65cb\u8f6c\u63a7\u5236\u8bef\u5dee\u7d2f\u79ef\uff0c\u5b83\u5728 70B \u6a21\u578b\u4e0a\u8fbe\u5230\u63a5\u8fd1\u91cf\u5316\u751a\u81f3\u90e8\u5206\u4efb\u52a1\u5339\u914d BF16 \u7684\u6548\u679c\uff0c\u8fd0\u884c\u901f\u5ea6\u8f83\u4ee5\u5f80\u65b9\u6848\u63d0\u5347\u6570\u4e2a\u6570\u91cf\u7ea7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the prosperity of the large language models (LLMs), it has become an interesting topic: how do LLM-based agents work in Minecraft? Unfortunately, most existing benchmarks evaluate them under fixed game mechanics. High performance in these settings does not show whether an agent can continue making progress when familiar recipes, drops, and other rules change. In this paper, we introduce MirrorCraft, a paired benchmark for evaluating agents under hidden rule changes in Minecraft. Each Mirror world is a copy of its paired Vanilla world, with selected server-side rules modified by the corresponding datapack. Terrain, spawn, resource placement, objective, interface, and action budget remain matched within every Vanilla-Mirror pair. MirrorCraft includes five controlled biomes, six rule suites, three progression objectives, two model families, and six agent configurations under a shared Mineflayer interface. We evaluate task progress with deterministic advancement milestones and success rate and use the Rule Intervention Effect (RIE) to measure the performance change between matched Vanilla and Mirror worlds. The experiments show that hidden rule changes have strongly different effects across suites. Among the configurations evaluated without rule descriptions, ReAct achieves the highest pooled Mirror score. Providing the exact rules yields modest gains in average progress and completion across all three objectives. MirrorCraft extends Minecraft evaluation beyond fixed mechanics and provides a controlled setting for studying how agents use gameplay outcomes when the rules of the current world differ from familiar ones.", "arxiv_id": "2607.29218", "arxiv_url": "https://arxiv.org/abs/2607.29218", "authors": ["Jianxin Gao", "Beini Hu", "Runze Li", "Wanli Peng", "Ruohan Lei", "Jinyuan Zhang", "Linna Deng", "Tianyi Yu", "Zining Wang"], "brief": "\u672c\u6587\u63d0\u51fa MirrorCraft\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30 Minecraft \u4e2d\u667a\u80fd\u4f53\u5728\u9690\u85cf\u89c4\u5219\u53d8\u5316\u4e0b\u8868\u73b0\u7684\u6210\u5bf9\u57fa\u51c6\uff0c\u5c06\u666e\u901a\u4e16\u754c\u4e0e\u89c4\u5219\u88ab\u6570\u636e\u5305\u4fee\u6539\u7684\u955c\u50cf\u4e16\u754c\u8fdb\u884c\u4e25\u683c\u5339\u914d\u3002\u5b9e\u9a8c\u53d1\u73b0\u4e0d\u540c\u89c4\u5219\u53d8\u5316\u5bf9\u667a\u80fd\u4f53\u5f71\u54cd\u5dee\u5f02\u663e\u8457\uff0cReAct \u5728\u65e0\u89c4\u5219\u8bf4\u660e\u65f6\u955c\u50cf\u4e16\u754c\u7efc\u5408\u8868\u73b0\u6700\u597d\uff0c\u800c\u63d0\u4f9b\u7cbe\u786e\u89c4\u5219\u53ea\u80fd\u5e26\u6765\u6709\u9650\u63d0\u5347\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29218", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "Minecraft"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29218v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MirrorCraft: Paired Evaluation under Hidden Rule Changes in Minecraft", "tldr": "\u672c\u6587\u63d0\u51fa MirrorCraft\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30 Minecraft \u4e2d\u667a\u80fd\u4f53\u5728\u9690\u85cf\u89c4\u5219\u53d8\u5316\u4e0b\u8868\u73b0\u7684\u6210\u5bf9\u57fa\u51c6\uff0c\u5c06\u666e\u901a\u4e16\u754c\u4e0e\u89c4\u5219\u88ab\u6570\u636e\u5305\u4fee\u6539\u7684\u955c\u50cf\u4e16\u754c\u8fdb\u884c\u4e25\u683c\u5339\u914d\u3002\u5b9e\u9a8c\u53d1\u73b0\u4e0d\u540c\u89c4\u5219\u53d8\u5316\u5bf9\u667a\u80fd\u4f53\u5f71\u54cd\u5dee\u5f02\u663e\u8457\uff0cReAct \u5728\u65e0\u89c4\u5219\u8bf4\u660e\u65f6\u955c\u50cf\u4e16\u754c\u7efc\u5408\u8868\u73b0\u6700\u597d\uff0c\u800c\u63d0\u4f9b\u7cbe\u786e\u89c4\u5219\u53ea\u80fd\u5e26\u6765\u6709\u9650\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) broadcasts a single response-level reward to every token, while on-policy distillation (OPD) scores each token against a stronger teacher for a dense advantage but caps performance at teacher quality and discourages exploration beyond it. Their complementarity makes combining RLVR and OPD promising, but we find that fusing the two advantages with a fixed coefficient triggers entropy collapse from two miscalibrations: a magnitude mismatch, where token-level OPD advantages can spike far beyond the bounded RLVR advantage and erase its signal, and a temporal mismatch, where sustained full-strength OPD keeps pulling the student toward the teacher and limits exploration needed to surpass it. We propose SAF, a Stable Advantage Fusion framework that resolves both issues via a lightweight, four-stage pipeline applied only to the OPD advantage: a sparsify-then-compress mechanism for magnitude control paired with a warm-up-then-anneal mechanism for temporal control, with each stage independently switchable and adding negligible overhead. Instantiating RLVR with GRPO, we evaluate SAF across seven mathematical reasoning and code generation benchmarks with Qwen3-1.7B/4B/8B: SAF avoids entropy collapse and consistently outperforms fixed-coefficient GRPO+OPD fusion, improving the aggregate score by 0.51-2.70% across all six model-domain settings while achieving more stable training.", "arxiv_id": "2607.29209", "arxiv_url": "https://arxiv.org/abs/2607.29209", "authors": ["Yifan Ding", "Xincheng Wei", "Yoshua Y. Li", "Ziheng Li", "Yuquan Lu", "Siyu Zhang", "Dongsheng Ma", "Rongxiang Weng", "Xunliang Cai", "Yun Chen"], "brief": "\u672c\u6587\u9488\u5bf9 RLVR \u4e0e\u5728\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u878d\u5408\u65f6\u7684\u4f18\u52bf\u503c\u5c3a\u5ea6\u4e0d\u5339\u914d\u548c\u65f6\u95f4\u63a7\u5236\u4e0d\u5339\u914d\u95ee\u9898\uff0c\u63d0\u51fa SAF \u7a33\u5b9a\u4f18\u52bf\u878d\u5408\u6846\u67b6\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u5bf9 OPD \u4f18\u52bf\u8fdb\u884c\u7a00\u758f\u538b\u7f29\u4e0e\u9884\u70ed\u9000\u706b\uff0c\u907f\u514d\u71b5\u574d\u584c\uff0c\u5728\u6570\u5b66\u63a8\u7406\u548c\u4ee3\u7801\u751f\u6210\u4efb\u52a1\u4e0a\u8f83\u56fa\u5b9a\u7cfb\u6570\u878d\u5408\u63d0\u5347 0.51%\u20132.70%\uff0c\u8bad\u7ec3\u66f4\u7a33\u5b9a\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29209", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29209v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SAF-OPD: Stable Advantage Fusion for On-Policy Distillation", "tldr": "\u672c\u6587\u9488\u5bf9 RLVR \u4e0e\u5728\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u878d\u5408\u65f6\u7684\u4f18\u52bf\u503c\u5c3a\u5ea6\u4e0d\u5339\u914d\u548c\u65f6\u95f4\u63a7\u5236\u4e0d\u5339\u914d\u95ee\u9898\uff0c\u63d0\u51fa SAF \u7a33\u5b9a\u4f18\u52bf\u878d\u5408\u6846\u67b6\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u5bf9 OPD \u4f18\u52bf\u8fdb\u884c\u7a00\u758f\u538b\u7f29\u4e0e\u9884\u70ed\u9000\u706b\uff0c\u907f\u514d\u71b5\u574d\u584c\uff0c\u5728\u6570\u5b66\u63a8\u7406\u548c\u4ee3\u7801\u751f\u6210\u4efb\u52a1\u4e0a\u8f83\u56fa\u5b9a\u7cfb\u6570\u878d\u5408\u63d0\u5347 0.51%\u20132.70%\uff0c\u8bad\u7ec3\u66f4\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Text-to-motion generation must produce motions that are semantically correct, temporally coherent, and physically plausible. A natural approach is to first project motion data into a structured semantic space and then train a generative model within that space. Such a paradigm has been highly successful in image generation through Representation Autoencoders (RAEs), where a frozen self-supervised encoder provides semantic features for diffusion or flow models to learn from. However, direct transfer of such a paradigm to motion space using Motion-JEPA as the frozen encoder fails dramatically. We diagnose this failure geometrically and identify two motion-specific bottlenecks: (1) the JEPA feature space is spectrally ill-conditioned, making the Gaussian-to-data transport unstable; and (2) even with a well-conditioned spectrum, flow residuals tend to align with decoder-sensitive directions, where small latent errors are amplified into large motion artifacts after decoding. Based on these insights, we propose MoRAE. MoRAE addresses the two bottlenecks separately. A compact bottleneck distills the structured JEPA representation while removing weak and redundant directions, bringing the latent spectrum into a transport-stable regime. Motion-coupled training then aligns the retained latent geometry with the decoder, making characteristic flow errors less costly after decoding. With this flow-friendly latent, a standard non-autoregressive Flow-Matching DiT achieves state-of-the-art performance.", "arxiv_id": "2607.29180", "arxiv_url": "https://arxiv.org/abs/2607.29180", "authors": ["Yifei Zhu", "Mingyi Shi", "Yangyang Cai", "Miao Cheng", "Yoshifumi Kitamura", "Taku Komura"], "brief": "\u8bba\u6587\u5206\u6790\u4e86\u5c06\u56fe\u50cf\u751f\u6210\u4e2d\u7684\u8868\u793a\u81ea\u7f16\u7801\u5668\u8303\u5f0f\u76f4\u63a5\u8fc1\u79fb\u5230\u6587\u672c\u751f\u6210\u52a8\u4f5c\u65f6\u5931\u8d25\u7684\u539f\u56e0\uff0c\u6307\u51fa Motion-JEPA \u6f5c\u7a7a\u95f4\u5b58\u5728\u8c31\u75c5\u6001\u548c\u89e3\u7801\u5668\u654f\u611f\u65b9\u5411\u653e\u5927\u8bef\u5dee\u4e24\u7c7b\u74f6\u9888\u3002\u63d0\u51fa MoRAE\uff0c\u901a\u8fc7\u7d27\u51d1\u74f6\u9888\u548c\u52a8\u4f5c\u8026\u5408\u8bad\u7ec3\u6784\u9020\u66f4\u9002\u5408 Flow Matching \u7684\u6f5c\u8868\u793a\uff0c\u4f7f\u6807\u51c6\u975e\u81ea\u56de\u5f52 Flow-Matching DiT \u8fbe\u5230\u6700\u5148\u8fdb\u6027\u80fd\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29180", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u672c\u751f\u6210\u52a8\u4f5c", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u6d41\u5339\u914d", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29180v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MoRAE: Flow-Friendly Self-Supervised Latents for Text-to-Motion Generation", "tldr": "\u8bba\u6587\u5206\u6790\u4e86\u5c06\u56fe\u50cf\u751f\u6210\u4e2d\u7684\u8868\u793a\u81ea\u7f16\u7801\u5668\u8303\u5f0f\u76f4\u63a5\u8fc1\u79fb\u5230\u6587\u672c\u751f\u6210\u52a8\u4f5c\u65f6\u5931\u8d25\u7684\u539f\u56e0\uff0c\u6307\u51fa Motion-JEPA \u6f5c\u7a7a\u95f4\u5b58\u5728\u8c31\u75c5\u6001\u548c\u89e3\u7801\u5668\u654f\u611f\u65b9\u5411\u653e\u5927\u8bef\u5dee\u4e24\u7c7b\u74f6\u9888\u3002\u63d0\u51fa MoRAE\uff0c\u901a\u8fc7\u7d27\u51d1\u74f6\u9888\u548c\u52a8\u4f5c\u8026\u5408\u8bad\u7ec3\u6784\u9020\u66f4\u9002\u5408 Flow Matching \u7684\u6f5c\u8868\u793a\uff0c\u4f7f\u6807\u51c6\u975e\u81ea\u56de\u5f52 Flow-Matching DiT \u8fbe\u5230\u6700\u5148\u8fdb\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];

  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
