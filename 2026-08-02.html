62bd\u53d6\u5e26\u6eaf\u6e90\u7684\u5c5e\u6027-\u503c\u89c2\u5bdf\uff0c\u81ea\u52a8\u53d1\u73b0\u7ed3\u6784\u5e76\u652f\u6301\u5206\u6790\u67e5\u8be2\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7a81\u7834\u4e86\u73b0\u6709\u667a\u80fd\u4f53\u8bb0\u5fc6\u4e3b\u8981\u4f9d\u8d56\u76f8\u4f3c\u5ea6\u68c0\u7d22\u548c\u6458\u8981\u7684\u8303\u5f0f\uff0c\u8ba9\u591a\u6a21\u6001\u957f\u671f\u8bb0\u5fc6\u5177\u5907\u7c7b\u4f3c\u6570\u636e\u5e93\u5206\u6790\u80fd\u529b\uff0c\u5bf9\u4e2a\u4eba\u52a9\u624b\u3001\u89c6\u89c9\u65e5\u5fd7\u3001\u957f\u671f\u4ea4\u4e92\u667a\u80fd\u4f53\u7b49\u573a\u666f\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\uff1b\u5728 MemEye \u548c MemGallery \u4e0a\u5206\u522b\u5e26\u6765\u6700\u9ad8 11.3% \u548c 7.3% \u6027\u80fd\u63d0\u5347\u3002"}, {"abstract": "AI agents extend large language models (LLMs) with external tools, enabling them to perform complex tasks and translate model outputs into consequential real-world actions. Yet LLMs often become substantially less safe when deployed as agents, and the source of this degradation remains poorly understood. In this paper, we identify schema-formatted tool specifications as a primary source of agent safety degradation and show, through white-box representation analysis, that they weaken the model\u0027s internal refusal signals and contribute to unsafe tool execution. Building on this finding, we propose SafeKeep, an inference-time safeguard that decouples safety judgment from tool execution: it assesses requests using flattened textual tool specifications while retaining the original schema-formatted specifications for execution. Across two representative benchmarks and four LLMs, including both white-box and black-box models, SafeKeep increases the average refusal rate for harmful requests from 23.8% to 70.6% and reduces the average attack success rate under observation-level prompt injection from 25.6% to 2.5%. It also outperforms existing safeguards and preserves task-handling capability. We release the code and data at https://github.com/snowcatsmoking/SafeKeep .", "arxiv_id": "2607.29254", "arxiv_url": "https://arxiv.org/abs/2607.29254", "authors": ["Minghui Pan", "Jiayuxuan Yang", "Yuanyuan Yuan", "Yu Jiang", "Zhenpeng Chen"], "brief": "\u8bba\u6587\u53d1\u73b0\uff0cschema \u683c\u5f0f\u7684\u5de5\u5177\u89c4\u683c\u662f LLM \u667a\u80fd\u4f53\u5b89\u5168\u6027\u4e0b\u964d\u7684\u91cd\u8981\u6765\u6e90\uff0c\u4f1a\u524a\u5f31\u6a21\u578b\u5185\u90e8\u62d2\u7b54\u4fe1\u53f7\u5e76\u8bf1\u53d1\u4e0d\u5b89\u5168\u5de5\u5177\u8c03\u7528\u3002\u4f5c\u8005\u63d0\u51fa\u63a8\u7406\u65f6\u9632\u62a4\u65b9\u6cd5 SafeKeep\uff0c\u5c06\u5b89\u5168\u5224\u65ad\u4e0e\u5de5\u5177\u6267\u884c\u89e3\u8026\uff0c\u7528\u6241\u5e73\u6587\u672c\u5de5\u5177\u8bf4\u660e\u505a\u5b89\u5168\u8bc4\u4f30\u3001\u4fdd\u7559\u539f schema \u7528\u4e8e\u6267\u884c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29254", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u767d\u76d2\u8868\u5f81\u5206\u6790\u8bc1\u660e schema-formatted tool specifications \u4f1a\u524a\u5f31\u6a21\u578b\u5185\u90e8 refusal signals\u3002", "SafeKeep \u5728\u6709\u5bb3\u8bf7\u6c42\u4e0a\u7684\u5e73\u5747\u62d2\u7b54\u7387\u4ece 23.8% \u63d0\u5347\u5230 70.6%\u3002", "\u5728\u89c2\u5bdf\u7ea7\u63d0\u793a\u6ce8\u5165\u4e0b\uff0c\u5e73\u5747\u653b\u51fb\u6210\u529f\u7387\u4ece 25.6% \u964d\u81f3 2.5%\uff0c\u4e14\u57fa\u672c\u4fdd\u6301\u4efb\u52a1\u5904\u7406\u80fd\u529b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5b89\u5168\u5bf9\u9f50", "\u63d0\u793a\u6ce8\u5165"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29254v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Tool Specifications Matter: Uncovering and Mitigating Safety Risks in AI Agents", "tldr": "\u5de5\u5177\u89c4\u683c\u683c\u5f0f\u4f1a\u524a\u5f31\u667a\u80fd\u4f53\u5b89\u5168\u62d2\u7b54", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\uff0cschema \u683c\u5f0f\u7684\u5de5\u5177\u89c4\u683c\u662f LLM \u667a\u80fd\u4f53\u5b89\u5168\u6027\u4e0b\u964d\u7684\u91cd\u8981\u6765\u6e90\uff0c\u4f1a\u524a\u5f31\u6a21\u578b\u5185\u90e8\u62d2\u7b54\u4fe1\u53f7\u5e76\u8bf1\u53d1\u4e0d\u5b89\u5168\u5de5\u5177\u8c03\u7528\u3002\u4f5c\u8005\u63d0\u51fa\u63a8\u7406\u65f6\u9632\u62a4\u65b9\u6cd5 SafeKeep\uff0c\u5c06\u5b89\u5168\u5224\u65ad\u4e0e\u5de5\u5177\u6267\u884c\u89e3\u8026\uff0c\u7528\u6241\u5e73\u6587\u672c\u5de5\u5177\u8bf4\u660e\u505a\u5b89\u5168\u8bc4\u4f30\u3001\u4fdd\u7559\u539f schema \u7528\u4e8e\u6267\u884c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u5b89\u5168\u9000\u5316\u7684\u539f\u56e0\u5b9a\u4f4d\u5230\u5e38\u88ab\u5ffd\u89c6\u7684\u5de5\u5177\u89c4\u683c\u683c\u5f0f\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u91cd\u8bad\u3001\u9002\u7528\u4e8e\u767d\u76d2\u548c\u9ed1\u76d2\u6a21\u578b\u7684\u63a8\u7406\u65f6\u9632\u62a4\u65b9\u6848\uff0c\u5bf9\u5de5\u5177\u8c03\u7528\u578b LLM \u667a\u80fd\u4f53\u7684\u5b89\u5168\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "While robot foundation models are growing increasingly capable, the strongest models are typically trained on proprietary data and remain closed-source, limiting downstream users\u0027 ability to adapt them to new tasks, embodiments, and deployment settings. Following the LLM community, an emerging access paradigm for closed-weight robot foundation models is the managed supervised fine-tuning (SFT) API, where users submit training data and receive a tuned policy without access to model weights, gradients, or training internals. While such APIs let downstream users leverage powerful proprietary foundation models, they restrict policy improvement to pure imitation, ruling out reinforcement learning and other closed-loop methods that rely on internal training signals. This limitation is particularly acute for agile, contact-rich humanoid manipulation, where the gap between policy outputs and deployed behavior is large due to novel states, action tracking dynamics, latency, and controller-specific failure modes. We study how effective this managed-API regime is for humanoid adaptation, and how closed-loop improvement can be realized within it to push policies toward task mastery. We conduct one of the first empirical studies of managed-API adaptation on a real humanoid, instantiated on Gemini Robotics On-Device (GROD). We find that direct SFT through the API substantially outperforms a leading open-weight VLA trained on the same demonstrations, yet still falls short of deployment-level mastery on agile, contact-rich tasks. To close this gap, we introduce CLIFT: Closed-Loop Iterative Fine-Tuning, which turns deployment-time reward feedback into API-compatible supervised data and enables closed-loop policy improvement without accessing weights, gradients, likelihoods, or losses-pushing GROD to near-perfect success after two flywheel cycles, all without \"opening the model box.\"", "arxiv_id": "2607.29172", "arxiv_url": "https://arxiv.org/abs/2607.29172", "authors": ["Yuxin Chen", "Hari Srikanth", "Nathan Jew", "Menglin Wu", "Pengcheng Wang", "Junli Ren", "Masayoshi Tomizuka", "Peng Xu", "Jinyu Xie", "Thomas Tian"], "brief": "\u8bba\u6587\u7814\u7a76\u4e86\u95ed\u6e90\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b\u901a\u8fc7\u6258\u7ba1SFT API\u9002\u914d\u771f\u5b9e\u4eba\u5f62\u673a\u5668\u4eba\u7684\u6548\u679c\uff0c\u5e76\u63d0\u51faCLIFT\u95ed\u73af\u8fed\u4ee3\u5fae\u8c03\u65b9\u6cd5\u3002CLIFT\u5c06\u90e8\u7f72\u65f6\u7684\u5956\u52b1\u53cd\u9988\u8f6c\u5316\u4e3aAPI\u53ef\u63a5\u53d7\u7684\u76d1\u7763\u6570\u636e\uff0c\u5728\u4e0d\u8bbf\u95ee\u6743\u91cd\u3001\u68af\u5ea6\u6216\u635f\u5931\u7684\u60c5\u51b5\u4e0b\u6301\u7eed\u6539\u8fdb\u7b56\u7565\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29172", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u771f\u5b9e\u4eba\u5f62\u673a\u5668\u4eba\u4e0a\u8bc4\u4f30Gemini Robotics On-Device\u7684\u6258\u7ba1API\u9002\u914d\u80fd\u529b\uff0c\u662f\u8f83\u65e9\u7684\u5b9e\u8bc1\u7814\u7a76\u4e4b\u4e00", "\u76f4\u63a5SFT\u663e\u8457\u4f18\u4e8e\u4f7f\u7528\u76f8\u540c\u793a\u6559\u6570\u636e\u8bad\u7ec3\u7684\u5f00\u6e90VLA\u6a21\u578b\uff0c\u4f46\u5728\u654f\u6377\u3001\u63a5\u89e6\u4e30\u5bcc\u4efb\u52a1\u4e0a\u4ecd\u672a\u8fbe\u5230\u90e8\u7f72\u7ea7\u6210\u529f\u7387", "CLIFT\u901a\u8fc7\u4e24\u8f6e\u95ed\u73af\u201c\u98de\u8f6e\u201d\u8fed\u4ee3\u5c06GROD\u63a8\u81f3\u63a5\u8fd1\u5b8c\u7f8e\u6210\u529f\u7387\uff0c\u65e0\u9700\u6253\u5f00\u6a21\u578b\u5185\u90e8"], "keywords": ["\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b", "\u4eba\u5f62\u673a\u5668\u4eba", "\u6a21\u4eff\u5b66\u4e60", "\u95ed\u73af\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29172v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CLIFT: Turning Gemini Robotics On-Device into Humanoid Specialists via Non-Invasive Closed-Loop Iterative Fine-Tuning", "tldr": "CLIFT\u8ba9\u95ed\u6e90GROD\u95ed\u73af\u5fae\u8c03\u7cbe\u901a\u4eba\u5f62\u64cd\u4f5c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u4e86\u95ed\u6e90\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b\u901a\u8fc7\u6258\u7ba1SFT API\u9002\u914d\u771f\u5b9e\u4eba\u5f62\u673a\u5668\u4eba\u7684\u6548\u679c\uff0c\u5e76\u63d0\u51faCLIFT\u95ed\u73af\u8fed\u4ee3\u5fae\u8c03\u65b9\u6cd5\u3002CLIFT\u5c06\u90e8\u7f72\u65f6\u7684\u5956\u52b1\u53cd\u9988\u8f6c\u5316\u4e3aAPI\u53ef\u63a5\u53d7\u7684\u76d1\u7763\u6570\u636e\uff0c\u5728\u4e0d\u8bbf\u95ee\u6743\u91cd\u3001\u68af\u5ea6\u6216\u635f\u5931\u7684\u60c5\u51b5\u4e0b\u6301\u7eed\u6539\u8fdb\u7b56\u7565\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u5728\u95ed\u6e90\u6258\u7ba1\u6a21\u578b\u53d7\u9650\u6761\u4ef6\u4e0b\u5b9e\u73b0\u7c7b\u4f3c\u5f3a\u5316\u5b66\u4e60\u95ed\u73af\u6539\u8fdb\u7684\u53ef\u884c\u8def\u5f84\uff0c\u5bf9\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b\u5546\u4e1aAPI\u7684\u4e0b\u6e38\u9002\u914d\u3001\u4eba\u5f62\u673a\u5668\u4eba\u843d\u5730\u548c\u5b89\u5168\u53ef\u63a7\u5fae\u8c03\u90fd\u6709\u91cd\u8981\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Existing autonomous-driving world models typically perform dense prediction of future videos, occupancy states, BEV representations, or agent motion. We argue that planning need not reconstruct the complete future world, but only focus on scene features that affect future ego action. Based on this perspective, we propose Auto-JEPA, an action-oriented latent world model that learns continuous future driving intent through joint-embedding prediction. Given visual observations, egomotion history, and navigation commands, Auto-JEPA predicts an intent embedding aligned with the latent representation of the future ego trajectory. The predicted intent retrieves executable trajectories from a fixed trajectory memory, which are then ranked by a scene-conditioned candidate selection module. Auto-JEPA keeps the visual encoder frozen, requires no explicit perception annotations, and uses no learned trajectory generator. By optimizing only task-specific modules for trajectory representation, intent prediction, and candidate selection, Auto-JEPA achieves 91.3 PDMS on NAVSIM v1 and 89.1 EPDMS on NAVSIM v2. Semantic occlusion experiments show that masking dynamic-agent regions induces an average intent change 2.97x that of equal-area random masking. Moreover, occluding vehicles that affect future driving substantially changes the predicted intent and selected trajectory, whereas both remain essentially unchanged when non-influential vehicles are occluded. These results show that future-intent prediction encourages the model to focus on planning-relevant visual features and supports high-quality planning without dense future-world modeling.", "arxiv_id": "2607.29031", "arxiv_url": "https://arxiv.org/abs/2607.29031", "authors": ["Jiwei Yang", "Zhengxian Chen", "Chaosheng Huang", "Jun Li"], "brief": "\u8bba\u6587\u63d0\u51fa Auto-JEPA\uff0c\u4e00\u79cd\u9762\u5411\u52a8\u4f5c\u7684\u81ea\u52a8\u9a7e\u9a76\u6f5c\u5728\u4e16\u754c\u6a21\u578b\uff0c\u4e0d\u91cd\u5efa\u5b8c\u6574\u672a\u6765\u573a\u666f\uff0c\u800c\u662f\u9884\u6d4b\u4e0e\u672a\u6765\u81ea\u8f66\u8f68\u8ff9\u5bf9\u9f50\u7684\u8fde\u7eed\u9a7e\u9a76\u610f\u56fe\u5d4c\u5165\u3002\u8be5\u610f\u56fe\u7528\u4e8e\u4ece\u56fa\u5b9a\u8f68\u8ff9\u8bb0\u5fc6\u4e2d\u68c0\u7d22\u53ef\u6267\u884c\u8f68\u8ff9\uff0c\u5e76\u7531\u573a\u666f\u6761\u4ef6\u5019\u9009\u9009\u62e9\u6a21\u5757\u6392\u5e8f\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29031", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 joint-embedding prediction \u5b66\u4e60\u672a\u6765\u9a7e\u9a76\u610f\u56fe\uff0c\u8f93\u5165\u89c6\u89c9\u89c2\u6d4b\u3001\u81ea\u8f66\u8fd0\u52a8\u5386\u53f2\u4e0e\u5bfc\u822a\u6307\u4ee4\uff0c\u8f93\u51fa\u9762\u5411\u89c4\u5212\u7684\u6f5c\u5728\u8868\u793a", "\u51bb\u7ed3\u89c6\u89c9\u7f16\u7801\u5668\uff0c\u65e0\u9700\u663e\u5f0f\u611f\u77e5\u6807\u6ce8\uff0c\u4e5f\u4e0d\u8bad\u7ec3\u8f68\u8ff9\u751f\u6210\u5668\uff0c\u4ec5\u4f18\u5316\u8f68\u8ff9\u8868\u793a\u3001\u610f\u56fe\u9884\u6d4b\u548c\u5019\u9009\u9009\u62e9\u6a21\u5757", "\u5728 NAVSIM v1 \u8fbe\u5230 91.3 PDMS\uff0c\u5728 NAVSIM v2 \u8fbe\u5230 89.1 EPDMS\uff1b\u906e\u6321\u5b9e\u9a8c\u663e\u793a\u6a21\u578b\u66f4\u5173\u6ce8\u5f71\u54cd\u672a\u6765\u9a7e\u9a76\u7684\u52a8\u6001\u8f66\u8f86"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u4e16\u754c\u6a21\u578b", "\u7aef\u5230\u7aef\u89c4\u5212", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29031v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Auto-JEPA: A Latent World Model of Continuous Intent for End-to-End Autonomous Driving", "tldr": "\u7528\u6f5c\u5728\u610f\u56fe\u4e16\u754c\u6a21\u578b\u7aef\u5230\u7aef\u89c4\u5212\u9a7e\u9a76\u8f68\u8ff9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Auto-JEPA\uff0c\u4e00\u79cd\u9762\u5411\u52a8\u4f5c\u7684\u81ea\u52a8\u9a7e\u9a76\u6f5c\u5728\u4e16\u754c\u6a21\u578b\uff0c\u4e0d\u91cd\u5efa\u5b8c\u6574\u672a\u6765\u573a\u666f\uff0c\u800c\u662f\u9884\u6d4b\u4e0e\u672a\u6765\u81ea\u8f66\u8f68\u8ff9\u5bf9\u9f50\u7684\u8fde\u7eed\u9a7e\u9a76\u610f\u56fe\u5d4c\u5165\u3002\u8be5\u610f\u56fe\u7528\u4e8e\u4ece\u56fa\u5b9a\u8f68\u8ff9\u8bb0\u5fc6\u4e2d\u68c0\u7d22\u53ef\u6267\u884c\u8f68\u8ff9\uff0c\u5e76\u7531\u573a\u666f\u6761\u4ef6\u5019\u9009\u9009\u62e9\u6a21\u5757\u6392\u5e8f\u3002", "why_notable": "\u5b83\u6311\u6218\u4e86\u81ea\u52a8\u9a7e\u9a76\u4e16\u754c\u6a21\u578b\u5fc5\u987b\u5bc6\u96c6\u9884\u6d4b\u672a\u6765\u89c6\u9891\u3001\u5360\u7528\u6216 BEV \u7684\u601d\u8def\uff0c\u8bc1\u660e\u53ea\u5efa\u6a21\u4e0e\u81ea\u8f66\u52a8\u4f5c\u76f8\u5173\u7684\u6f5c\u5728\u610f\u56fe\u4e5f\u80fd\u5b9e\u73b0\u9ad8\u8d28\u91cf\u89c4\u5212\uff0c\u5177\u6709\u66f4\u9ad8\u6548\u3001\u66f4\u4efb\u52a1\u5bfc\u5411\u7684\u7aef\u5230\u7aef\u9a7e\u9a76\u6f5c\u529b\u3002"}, {"abstract": "Online shoppers increasingly turn to AI shopping assistants, using images and multi-turn dialogue to express and refine product needs that are difficult to articulate in text alone. However, existing benchmarks largely rely on text-only or synthetic requests, underrepresenting complex real-world shopping requirements jointly expressed through images and language. We introduce MMShopBench, the first real-log benchmark for multimodal, multi-turn shopping agents. Built from carefully cleaned and manually annotated shopping logs, MMShopBench provides ground-truth annotations of each request\u0027s purchase intent and mandatory product requirements. Agents must infer these requirements jointly from user images and multi-turn dialogue, retrieve candidate products through image and text search, and verify that each candidate satisfies all requirements using its product images and structured attributes. We evaluate representative open-source and proprietary models using an evidence-grounded multimodal protocol and construct a companion training set for fine-tuning an open-source model. To ensure reproducible experimentation, we build an offline shopping sandbox, where fine-tuning substantially narrows the performance gap between our open-source model and leading proprietary models, demonstrating the effectiveness of our training data.", "arxiv_id": "2607.29002", "arxiv_url": "https://arxiv.org/abs/2607.29002", "authors": ["Zeying Hao", "Hao Guo", "Mengtao Xu", "Yimin Hu", "Yuheng Song", "Zesheng Zhou", "Jinsong Lan", "Xiaoyong Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa MMShopBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u771f\u5b9e\u8d2d\u7269\u65e5\u5fd7\u6784\u5efa\u7684\u591a\u6a21\u6001\u3001\u591a\u8f6e\u8d2d\u7269\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u8981\u6c42\u667a\u80fd\u4f53\u4ece\u7528\u6237\u56fe\u7247\u4e0e\u591a\u8f6e\u5bf9\u8bdd\u4e2d\u63a8\u65ad\u8d2d\u4e70\u610f\u56fe\u548c\u786c\u6027\u9700\u6c42\uff0c\u5e76\u901a\u8fc7\u56fe\u6587\u68c0\u7d22\u4e0e\u5546\u54c1\u5c5e\u6027\u9a8c\u8bc1\u5b8c\u6210\u63a8\u8350\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29002", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6570\u636e\u6765\u81ea\u6e05\u6d17\u548c\u4eba\u5de5\u6807\u6ce8\u7684\u771f\u5b9e\u8d2d\u7269\u65e5\u5fd7\uff0c\u5305\u542b\u8d2d\u4e70\u610f\u56fe\u4e0e\u5fc5\u987b\u6ee1\u8db3\u7684\u5546\u54c1\u9700\u6c42\u6807\u6ce8\u3002", "\u8bc4\u6d4b\u6d41\u7a0b\u8986\u76d6\u9700\u6c42\u7406\u89e3\u3001\u56fe\u50cf/\u6587\u672c\u5546\u54c1\u68c0\u7d22\u3001\u57fa\u4e8e\u5546\u54c1\u56fe\u50cf\u548c\u7ed3\u6784\u5316\u5c5e\u6027\u7684\u8bc1\u636e\u9a8c\u8bc1\u3002", "\u63d0\u4f9b\u79bb\u7ebf\u8d2d\u7269\u6c99\u76d2\u548c\u914d\u5957\u8bad\u7ec3\u96c6\uff0c\u5fae\u8c03\u5f00\u6e90\u6a21\u578b\u540e\u663e\u8457\u7f29\u5c0f\u4e0e\u95ed\u6e90\u5f3a\u6a21\u578b\u7684\u5dee\u8ddd\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u7535\u5546\u63a8\u8350", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29002v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MMShopBench: A Real-Log Benchmark for Multimodal, Multi-Turn Shopping Agents", "tldr": "\u9996\u4e2a\u771f\u5b9e\u65e5\u5fd7\u591a\u6a21\u6001\u591a\u8f6e\u8d2d\u7269\u667a\u80fd\u4f53\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MMShopBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u771f\u5b9e\u8d2d\u7269\u65e5\u5fd7\u6784\u5efa\u7684\u591a\u6a21\u6001\u3001\u591a\u8f6e\u8d2d\u7269\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u8981\u6c42\u667a\u80fd\u4f53\u4ece\u7528\u6237\u56fe\u7247\u4e0e\u591a\u8f6e\u5bf9\u8bdd\u4e2d\u63a8\u65ad\u8d2d\u4e70\u610f\u56fe\u548c\u786c\u6027\u9700\u6c42\uff0c\u5e76\u901a\u8fc7\u56fe\u6587\u68c0\u7d22\u4e0e\u5546\u54c1\u5c5e\u6027\u9a8c\u8bc1\u5b8c\u6210\u63a8\u8350\u3002", "why_notable": "\u76f8\u6bd4\u6587\u672c\u6216\u5408\u6210\u8d2d\u7269\u4efb\u52a1\uff0c\u8be5\u57fa\u51c6\u66f4\u8d34\u8fd1\u771f\u5b9e\u7535\u5546\u573a\u666f\uff0c\u7a81\u51fa\u56fe\u7247\u4e0e\u591a\u8f6e\u5bf9\u8bdd\u5171\u540c\u8868\u8fbe\u590d\u6742\u9700\u6c42\u7684\u95ee\u9898\uff0c\u5bf9\u8d2d\u7269\u667a\u80fd\u4f53\u548c\u591a\u6a21\u6001\u68c0\u7d22\u8bc4\u6d4b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "High-fidelity radio fields are typically simulated for every scene--transmitter configuration or fitted separately to each scene, failing to exploit propagation structures shared across environments. We present Point2Radio, a foundation model that learns a transferable propagation prior from multiple environments. Given a material-aware point cloud and a transmitter (TX) setting, a common encoder produces a TX-conditioned scene representation that can be queried at arbitrary receiver (RX) locations. Task-specific query decoders map this representation to different radio quantities, e.g., three-dimensional (3D) path-gain (PG) fields and power angular spectra (PAS). At inference for a new scene, the model uses only a material-aware point cloud and transceiver queries, running in milliseconds on a single GPU without meshes or explicit path tracing. We evaluate PG prediction on a scene-disjoint split of a 337-scene corpus containing 86,272 TX-conditioned fields. Point2Radio achieves 0.871 dB mean absolute error (MAE), reducing error by 76.7% relative to a same-split UNet-style baseline. The same encoder also supports PAS prediction via a task-specific decoder. Experiments further show that light target-scene fine-tuning improves adaptation to a specific environment.", "arxiv_id": "2607.28994", "arxiv_url": "https://arxiv.org/abs/2607.28994", "authors": ["Chaozheng Wen", "Chenghong Bian", "Hongze Chen", "Jun Zhang"], "brief": "Point2Radio \u662f\u4e00\u4e2a\u9762\u5411\u65e0\u7ebf\u4f20\u64ad\u5efa\u6a21\u7684\u57fa\u7840\u6a21\u578b\uff0c\u4ece\u591a\u73af\u5883\u6570\u636e\u4e2d\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u4f20\u64ad\u5148\u9a8c\u3002\u5b83\u4ee5\u6750\u8d28\u611f\u77e5\u70b9\u4e91\u548c\u53d1\u5c04\u673a\u8bbe\u7f6e\u4e3a\u8f93\u5165\uff0c\u53ef\u5728\u4efb\u610f\u63a5\u6536\u673a\u4f4d\u7f6e\u67e5\u8be2\u4e09\u7ef4\u8def\u5f84\u589e\u76ca\u3001\u529f\u7387\u89d2\u8c31\u7b49\u65e0\u7ebf\u91cf\u3002", "categories": ["cs.NI", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28994", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u5171\u4eab\u7f16\u7801\u5668\u751f\u6210\u53d1\u5c04\u673a\u6761\u4ef6\u5316\u7684\u573a\u666f\u8868\u793a\uff0c\u5e76\u901a\u8fc7\u4efb\u52a1\u7279\u5b9a\u67e5\u8be2\u89e3\u7801\u5668\u9884\u6d4b\u4e0d\u540c\u65e0\u7ebf\u7535\u573a\u91cf", "\u63a8\u7406\u65f6\u65e0\u9700\u7f51\u683c\u5efa\u6a21\u6216\u663e\u5f0f\u8def\u5f84\u8ffd\u8e2a\uff0c\u4ec5\u9700\u6750\u8d28\u70b9\u4e91\u4e0e\u6536\u53d1\u673a\u67e5\u8be2\uff0c\u5355 GPU \u6beb\u79d2\u7ea7\u8fd0\u884c", "\u5728337\u4e2a\u573a\u666f\u300186272\u4e2a\u53d1\u5c04\u673a\u6761\u4ef6\u573a\u7684\u8de8\u573a\u666f\u6d4b\u8bd5\u4e2d\uff0c\u8def\u5f84\u589e\u76ca\u9884\u6d4b\u8fbe\u52300.871 dB MAE\uff0c\u76f8\u6bd4UNet\u57fa\u7ebf\u8bef\u5dee\u964d\u4f4e76.7%"], "keywords": ["\u65e0\u7ebf\u901a\u4fe1", "\u57fa\u7840\u6a21\u578b", "\u70b9\u4e91", "\u573a\u666f\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28994v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Point2Radio: A Foundation Model for Cross-Scene Radio Fields from Material-Aware Point Clouds", "tldr": "\u7528\u6750\u8d28\u70b9\u4e91\u6beb\u79d2\u7ea7\u9884\u6d4b\u8de8\u573a\u666f\u65e0\u7ebf\u7535\u573a", "upvotes": 0, "what_it_is": "Point2Radio \u662f\u4e00\u4e2a\u9762\u5411\u65e0\u7ebf\u4f20\u64ad\u5efa\u6a21\u7684\u57fa\u7840\u6a21\u578b\uff0c\u4ece\u591a\u73af\u5883\u6570\u636e\u4e2d\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u4f20\u64ad\u5148\u9a8c\u3002\u5b83\u4ee5\u6750\u8d28\u611f\u77e5\u70b9\u4e91\u548c\u53d1\u5c04\u673a\u8bbe\u7f6e\u4e3a\u8f93\u5165\uff0c\u53ef\u5728\u4efb\u610f\u63a5\u6536\u673a\u4f4d\u7f6e\u67e5\u8be2\u4e09\u7ef4\u8def\u5f84\u589e\u76ca\u3001\u529f\u7387\u89d2\u8c31\u7b49\u65e0\u7ebf\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u57fa\u7840\u6a21\u578b\u601d\u60f3\u5f15\u5165\u65e0\u7ebf\u7535\u573a\u9884\u6d4b\uff0c\u663e\u8457\u63d0\u5347\u4e86\u8de8\u573a\u666f\u6cdb\u5316\u80fd\u529b\u548c\u63a8\u7406\u6548\u7387\uff0c\u6709\u671b\u7528\u4e8e6G\u7f51\u7edc\u89c4\u5212\u3001\u6570\u5b57\u5b6a\u751f\u548c\u5feb\u901f\u4fe1\u9053\u5efa\u6a21\u3002"}, {"abstract": "Reinforcement learning (RL) post-training of Vision-Language-Action (VLA) models has shown strong promise for robotic manipulation. Among RL methods, critic-based approaches rely on a value estimator that predominantly operates on single-frame observations or single-frame VLM backbone latents, which is a fundamental mismatch with the partially observable nature of robot control. A naive approach to incorporate observation history into the critic incurs exponential complexity with high-dimensional visual space, and still fails because pure scalar-return regression provides insufficient supervision for learning cross-temporal dynamics. We identify the root cause as a state approximation problem: without an explicit world modeling objective, the critic\u0027s representation cannot capture the temporal structure needed for accurate value estimation. To address this, we propose the World Critic Model (WCM), built on a lightweight LeJEPA architecture; WCM jointly predicts future latent state and estimates values, such that the critic\u0027s representation is explicitly trained to capture temporal dynamics rather than merely regress scalar returns. WCM integrates seamlessly into both on-policy and off-policy training pipelines and is compatible with state-of-the-art VLA backbones including Pi0, Pi0.5, and OpenVLA-OFT. Extensive experiments on 149 tasks across four benchmarks demonstrate that WCM consistently achieves state-of-the-art performance in both in-distribution and out-of-distribution settings, with particularly strong generalization gains. We further validate WCM on seven real-world manipulation tasks using OpenVLA-OFT and Pi0.5 with off-policy RL, confirming stable deployment across diverse settings.", "arxiv_id": "2607.29613", "arxiv_url": "https://arxiv.org/abs/2607.29613", "authors": ["Senyu Fei", "Xiaopeng Yu", "Siyin Wang", "Xianzhong Zhao", "Jingjing Gong", "Xipeng Qiu"], "brief": "\u8bba\u6587\u63d0\u51fa World Critic Model\uff08WCM\uff09\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7684 critic\u3002\u5b83\u5728\u4f30\u8ba1\u4ef7\u503c\u7684\u540c\u65f6\u9884\u6d4b\u672a\u6765\u6f5c\u5728\u72b6\u6001\uff0c\u4f7f critic \u8868\u5f81\u663e\u5f0f\u5b66\u4e60\u8de8\u65f6\u95f4\u52a8\u6001\uff0c\u800c\u975e\u53ea\u62df\u5408\u6807\u91cf\u56de\u62a5\u3002", "categories": ["cs.RO", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29613", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u73b0\u6709\u5355\u5e27 critic \u4e0e\u673a\u5668\u4eba\u63a7\u5236\u7684\u90e8\u5206\u53ef\u89c2\u6d4b\u6027\u4e0d\u5339\u914d\uff0c\u5386\u53f2\u89c2\u6d4b\u7684\u6734\u7d20\u5efa\u6a21\u53c8\u4f1a\u5e26\u6765\u9ad8\u7ef4\u89c6\u89c9\u7a7a\u95f4\u4e0b\u7684\u590d\u6742\u5ea6\u95ee\u9898\u3002", "\u57fa\u4e8e\u8f7b\u91cf\u7ea7 LeJEPA \u67b6\u6784\uff0c\u8054\u5408\u8fdb\u884c\u672a\u6765 latent state \u9884\u6d4b\u4e0e\u4ef7\u503c\u4f30\u8ba1\uff0c\u589e\u5f3a temporal dynamics \u8868\u5f81\u3002", "\u517c\u5bb9 on-policy \u4e0e off-policy RL\uff0c\u5e76\u9002\u914d Pi0\u3001Pi0.5\u3001OpenVLA-OFT\uff1b\u57284\u4e2a\u57fa\u51c6149\u4e2a\u4efb\u52a1\u53ca7\u4e2a\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e0a\u53d6\u5f97\u9886\u5148\u8868\u73b0\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u5f3a\u5316\u5b66\u4e60", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29613v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WCM: A World Critic Model for Vision-Language-Action Reinforcement Learning", "tldr": "\u7528\u4e16\u754c\u6a21\u578b\u5f3a\u5316VLA\u673a\u5668\u4eba\u7684\u4ef7\u503c\u8bc4\u4f30", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa World Critic Model\uff08WCM\uff09\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7684 critic\u3002\u5b83\u5728\u4f30\u8ba1\u4ef7\u503c\u7684\u540c\u65f6\u9884\u6d4b\u672a\u6765\u6f5c\u5728\u72b6\u6001\uff0c\u4f7f critic \u8868\u5f81\u663e\u5f0f\u5b66\u4e60\u8de8\u65f6\u95f4\u52a8\u6001\uff0c\u800c\u975e\u53ea\u62df\u5408\u6807\u91cf\u56de\u62a5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e16\u754c\u6a21\u578b\u76ee\u6807\u5f15\u5165 VLA \u5f3a\u5316\u5b66\u4e60\u7684 critic \u5b66\u4e60\uff0c\u7f13\u89e3\u4e86\u4ef7\u503c\u4f30\u8ba1\u4e2d\u7684\u72b6\u6001\u8fd1\u4f3c\u95ee\u9898\uff0c\u663e\u8457\u63d0\u5347\u4e86\u5206\u5e03\u5185\u5916\u6cdb\u5316\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u90e8\u7f72\u7a33\u5b9a\u6027\uff0c\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u6a21\u578b\u7684RL\u540e\u8bad\u7ec3\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "KV cache compression is essential for efficient long-context inference. Existing eviction methods permanently discard unselected tokens and consequently remove their aggregate contribution to attention. Merging-based alternatives preserve more information but can perturb retained keys and values that should remain exact. We observe that the information omitted by cache eviction can be formulated as residual statistics in both the numerator and denominator of softmax attention. Based on this observation, we propose ResKV, which divides a fixed KV budget into an exact main cache and a compact residual cache that reconstructs the contribution of omitted tokens. ResKV lets main-cache tokens and residual entries participate in the same softmax normalization, so residual entries restore both attention numerator and denominator mass rather than acting as a post-hoc correction. A construction-time validation proxy determines residual allocation for each layer and KV head, while a decode-time dynamic gate adjusts residual contributions for individual queries. Comprehensive evaluations on LongBench and RULER, covering query-aware and query-agnostic settings, multiple backbones, cache budgets, and representative compression baselines, demonstrate broad improvements under the same retained KV budget while preserving the practical efficiency of compressed decoding, including peak memory usage and long-context decode throughput.", "arxiv_id": "2607.29591", "arxiv_url": "https://arxiv.org/abs/2607.29591", "authors": ["Yuhang Zhan", "Lisi Chen", "Shuo Shang"], "brief": "\u8bba\u6587\u63d0\u51fa ResKV\uff0c\u5c06\u56fa\u5b9a KV \u7f13\u5b58\u9884\u7b97\u5212\u5206\u4e3a\u7cbe\u786e\u4fdd\u7559\u7684\u4e3b\u7f13\u5b58\u4e0e\u7d27\u51d1\u6b8b\u5dee\u7f13\u5b58\uff0c\u7528\u4e8e\u91cd\u5efa\u88ab\u6dd8\u6c70 token \u5728 softmax \u6ce8\u610f\u529b\u4e2d\u7684\u8d21\u732e\u3002\u5176\u6838\u5fc3\u662f\u540c\u65f6\u6062\u590d\u6ce8\u610f\u529b\u5206\u5b50\u4e0e\u5206\u6bcd\u7684\u6b8b\u4f59\u7edf\u8ba1\u91cf\uff0c\u800c\u4e0d\u662f\u7b80\u5355\u4e22\u5f03\u6216\u4e8b\u540e\u4fee\u6b63\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29591", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u88ab\u9a71\u9010 token \u7684\u9057\u6f0f\u4fe1\u606f\u8868\u8ff0\u4e3a softmax \u6ce8\u610f\u529b\u5206\u5b50\u548c\u5206\u6bcd\u4e2d\u7684\u6b8b\u5dee\u7edf\u8ba1\u91cf", "\u4e3b\u7f13\u5b58 token \u4e0e\u6b8b\u5dee\u6761\u76ee\u5171\u540c\u53c2\u4e0e\u540c\u4e00\u6b21 softmax \u5f52\u4e00\u5316\uff0c\u5c3d\u91cf\u4fdd\u6301\u6ce8\u610f\u529b\u8d28\u91cf", "\u901a\u8fc7\u6784\u5efa\u9636\u6bb5\u9a8c\u8bc1\u4ee3\u7406\u5206\u914d\u5404\u5c42/\u5404 KV head \u7684\u6b8b\u5dee\u9884\u7b97\uff0c\u5e76\u5728\u89e3\u7801\u9636\u6bb5\u7528\u52a8\u6001\u95e8\u63a7\u8c03\u8282\u6b8b\u5dee\u8d21\u732e"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "KV\u7f13\u5b58\u538b\u7f29", "\u6ce8\u610f\u529b\u673a\u5236", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29591v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ResKV: Reconstructing Omitted Attention Contributions for Fixed-Budget KV Cache Compression", "tldr": "\u7528\u6b8b\u5dee\u7f13\u5b58\u91cd\u5efa\u88ab\u6dd8\u6c70KV\u7684\u6ce8\u610f\u529b\u8d21\u732e", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ResKV\uff0c\u5c06\u56fa\u5b9a KV \u7f13\u5b58\u9884\u7b97\u5212\u5206\u4e3a\u7cbe\u786e\u4fdd\u7559\u7684\u4e3b\u7f13\u5b58\u4e0e\u7d27\u51d1\u6b8b\u5dee\u7f13\u5b58\uff0c\u7528\u4e8e\u91cd\u5efa\u88ab\u6dd8\u6c70 token \u5728 softmax \u6ce8\u610f\u529b\u4e2d\u7684\u8d21\u732e\u3002\u5176\u6838\u5fc3\u662f\u540c\u65f6\u6062\u590d\u6ce8\u610f\u529b\u5206\u5b50\u4e0e\u5206\u6bcd\u7684\u6b8b\u4f59\u7edf\u8ba1\u91cf\uff0c\u800c\u4e0d\u662f\u7b80\u5355\u4e22\u5f03\u6216\u4e8b\u540e\u4fee\u6b63\u3002", "why_notable": "ResKV\u5728\u4e0d\u589e\u52a0\u4fdd\u7559KV\u9884\u7b97\u7684\u524d\u63d0\u4e0b\uff0c\u5f25\u8865\u4e86\u4f20\u7edf\u6dd8\u6c70\u5f0f\u538b\u7f29\u7684\u4fe1\u606f\u635f\u5931\uff0c\u540c\u65f6\u907f\u514d\u5408\u5e76\u5f0f\u65b9\u6cd5\u6270\u52a8\u4fdd\u7559KV\u7684\u95ee\u9898\uff1b\u5728LongBench\u548cRULER\u7b49\u957f\u4e0a\u4e0b\u6587\u8bc4\u6d4b\u4e2d\u663e\u793a\u51fa\u66f4\u597d\u7684\u6027\u80fd\u3001\u663e\u5b58\u5360\u7528\u548c\u89e3\u7801\u541e\u5410\u5e73\u8861\u3002"}, {"abstract": "Reward models (RMs) are central to aligning large language models with human preferences via reinforcement learning. Although traditional scalar RMs enable efficient and probabilistic reward modeling, they rely on superficial cues that fail to generalize to complex or out-of-distribution (OOD) tasks. Conversely, generative RMs leverage extensive reasoning to improve robustness on challenging tasks, but their natural language-based scores lack the numerical flexibility and probabilistic interpretability that scalar RMs offer. While recent approaches combine both paradigms through off-policy multi-task learning, such parallel optimization does not guarantee that generated reasoning traces actively align with or benefit downstream scalar reward prediction. To address this mismatch, we propose LatentRM, a reward modeling framework that learns intermediate reasoning traces as discrete latent variables to explicitly maximize the likelihood of downstream scalar rewards. Through on-policy optimization of the latent reasoning space end-to-end, LatentRM tightly couples deep reasoning-based evaluation with precise scoring. Extensive validations on in-distribution and OOD datasets and RLHF show that LatentRM outperforms scalar, generative, and hybrid RMs on preference modeling and policy alignment across tasks ranging from open-ended conversation to complex reasoning.", "arxiv_id": "2607.29185", "arxiv_url": "https://arxiv.org/abs/2607.29185", "authors": ["Sanwoo Lee", "Clive Bai", "Hsiu-Yuan Huang", "Kun Liang", "Weijie Liu", "Yunfang Wu"], "brief": "\u8bba\u6587\u63d0\u51fa LatentRM\uff0c\u5c06\u4e2d\u95f4\u63a8\u7406\u8f68\u8ff9\u5efa\u6a21\u4e3a\u79bb\u6563\u6f5c\u53d8\u91cf\uff0c\u5e76\u7aef\u5230\u7aef\u4f18\u5316\u5176\u5bf9\u4e0b\u6e38\u6807\u91cf\u5956\u52b1\u9884\u6d4b\u7684\u4f3c\u7136\u3002\u5b83\u8bd5\u56fe\u540c\u65f6\u4fdd\u7559\u751f\u6210\u5f0f\u5956\u52b1\u6a21\u578b\u7684\u6df1\u5ea6\u63a8\u7406\u80fd\u529b\u548c\u6807\u91cf\u5956\u52b1\u6a21\u578b\u7684\u6570\u503c\u5316\u3001\u6982\u7387\u5316\u4f18\u52bf\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29185", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u628a\u5956\u52b1\u8bc4\u4f30\u4e2d\u7684\u63a8\u7406\u8fc7\u7a0b\u4f5c\u4e3a\u79bb\u6563\u6f5c\u53d8\u91cf\uff0c\u800c\u975e\u4ec5\u7528\u663e\u5f0f\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\u6216\u5355\u4e00\u6807\u91cf\u6253\u5206\u3002", "\u901a\u8fc7 on-policy \u65b9\u5f0f\u7aef\u5230\u7aef\u4f18\u5316\u6f5c\u5728\u63a8\u7406\u7a7a\u95f4\uff0c\u4f7f\u63a8\u7406\u8f68\u8ff9\u76f4\u63a5\u670d\u52a1\u4e8e\u6807\u91cf\u5956\u52b1\u9884\u6d4b\u3002", "\u5728\u5206\u5e03\u5185\u3001OOD \u6570\u636e\u96c6\u548c RLHF \u5b9e\u9a8c\u4e2d\uff0c\u4f18\u4e8e\u4f20\u7edf\u6807\u91cf\u3001\u751f\u6210\u5f0f\u53ca\u6df7\u5408\u5956\u52b1\u6a21\u578b\u3002"], "keywords": ["\u5956\u52b1\u6a21\u578b", "RLHF", "\u63a8\u7406", "\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29185v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Learning Latent Reasoning Traces for Scalar Reward Models End-to-End", "tldr": "\u7528\u6f5c\u5728\u63a8\u7406\u8f68\u8ff9\u589e\u5f3a\u6807\u91cf\u5956\u52b1\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LatentRM\uff0c\u5c06\u4e2d\u95f4\u63a8\u7406\u8f68\u8ff9\u5efa\u6a21\u4e3a\u79bb\u6563\u6f5c\u53d8\u91cf\uff0c\u5e76\u7aef\u5230\u7aef\u4f18\u5316\u5176\u5bf9\u4e0b\u6e38\u6807\u91cf\u5956\u52b1\u9884\u6d4b\u7684\u4f3c\u7136\u3002\u5b83\u8bd5\u56fe\u540c\u65f6\u4fdd\u7559\u751f\u6210\u5f0f\u5956\u52b1\u6a21\u578b\u7684\u6df1\u5ea6\u63a8\u7406\u80fd\u529b\u548c\u6807\u91cf\u5956\u52b1\u6a21\u578b\u7684\u6570\u503c\u5316\u3001\u6982\u7387\u5316\u4f18\u52bf\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u73b0\u6709\u5956\u52b1\u6a21\u578b\u5728\u201c\u53ef\u89e3\u91ca\u63a8\u7406\u201d\u548c\u201c\u7cbe\u786e\u6807\u91cf\u8bc4\u5206\u201d\u4e4b\u95f4\u7684\u5272\u88c2\u95ee\u9898\uff0c\u63d0\u51fa\u66f4\u7d27\u8026\u5408\u7684\u8bad\u7ec3\u6846\u67b6\uff0c\u6709\u671b\u63d0\u5347\u590d\u6742\u4efb\u52a1\u548c\u5206\u5e03\u5916\u573a\u666f\u4e0b\u7684\u504f\u597d\u5efa\u6a21\u4e0e\u5bf9\u9f50\u7a33\u5b9a\u6027\u3002"}, {"abstract": "Heterogeneous Large Language Model (LLM) systems increasingly rely on shared contexts, retrieved evidence, and multi-agent dialogue histories, yet their internal key-value (KV) caches remain model-specific and cannot be reused across architectures. Consequently, each model must repeatedly prefill or store caches for the same context, limiting the scalability of multi-model reasoning and long-context generation. We propose Mixture-of-Translators(MoT), a cache translation framework that maps context KV caches from a source LLM into the cache space of a target LLM. Unlike prior approaches that depend on a single projection path or global shared latent space, MoT uses multiple translator modules to capture diverse source--target mappings. To further reduce residual translation error, we introduce a Context Correction Loss that aligns the replayed target trajectory with the native target trajectory. We reveal two competing failure modes in cache translation: propagated translation shift from early injection and last-state shift from late injection. MoT addresses them through translator mixtures and target-side correction. Across homogeneous and heterogeneous translations among Qwen2.5, GPT-2, and OPT models, MoT preserves downstream QA performance, including Qwen2.5-7B-scale translation with 51.0% average closed-set QA accuracy and 0.43 average extractive QA F1. In practical case studies, MoT enables quality-preserving memory reuse for multi-agent reasoning and retains 96.3% of direct-context quality in long-context cache-augmented generation, demonstrating scalable KV cache reuse across heterogeneous LLMs.", "arxiv_id": "2607.28979", "arxiv_url": "https://arxiv.org/abs/2607.28979", "authors": ["Jin-woo Lee", "Minkyung Song", "Junghyun Oh", "Seunghoon Han", "Soyoung Park", "Gwangseon Jang", "Sungsu Lim"], "brief": "\u8bba\u6587\u63d0\u51fa Mixture-of-Translators\uff08MoT\uff09\uff0c\u5c06\u6e90\u5927\u6a21\u578b\u7684\u4e0a\u4e0b\u6587 KV cache \u6620\u5c04\u5230\u76ee\u6807\u5927\u6a21\u578b\u7684\u7f13\u5b58\u7a7a\u95f4\uff0c\u4f7f\u4e0d\u540c\u67b6\u6784\u6a21\u578b\u53ef\u590d\u7528\u540c\u4e00\u4e0a\u4e0b\u6587\u7f13\u5b58\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u4e2a translator \u6a21\u5757\u5efa\u6a21\u591a\u6837\u6620\u5c04\uff0c\u5e76\u7528 Context Correction Loss \u7ea0\u6b63\u76ee\u6807\u4fa7\u751f\u6210\u8f68\u8ff9\u504f\u5dee\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28979", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u9488\u5bf9\u5f02\u6784 LLM \u7684 KV cache \u4e0d\u53ef\u5171\u4eab\u95ee\u9898\uff0c\u652f\u6301 Qwen2.5\u3001GPT-2\u3001OPT \u7b49\u6a21\u578b\u95f4\u7684\u540c\u6784\u4e0e\u5f02\u6784\u7f13\u5b58\u7ffb\u8bd1\u3002", "\u63d0\u51fa translator mixture \u673a\u5236\uff0c\u7f13\u89e3\u5355\u4e00\u8def\u5f84\u6620\u5c04\u4e0d\u8db3\uff1b\u540c\u65f6\u8bc6\u522b\u65e9\u671f\u6ce8\u5165\u5bfc\u81f4\u7684 propagated translation shift \u4e0e\u665a\u671f\u6ce8\u5165\u5bfc\u81f4\u7684 last-state shift \u4e24\u7c7b\u5931\u8d25\u6a21\u5f0f\u3002", "\u5b9e\u9a8c\u663e\u793a\u5728 Qwen2.5-7B \u7ea7\u522b\u7ffb\u8bd1\u4e2d\u4ecd\u4fdd\u6301\u4e0b\u6e38 QA \u80fd\u529b\uff0c\u95ed\u96c6 QA \u5e73\u5747\u51c6\u786e\u7387 51.0%\uff0c\u62bd\u53d6\u5f0f QA \u5e73\u5747 F1 \u4e3a 0.43\uff1b\u957f\u4e0a\u4e0b\u6587\u7f13\u5b58\u589e\u5f3a\u751f\u6210\u4fdd\u7559 96.3% \u76f4\u63a5\u4e0a\u4e0b\u6587\u8d28\u91cf\u3002"], "keywords": ["KV\u7f13\u5b58", "\u5927\u6a21\u578b\u63a8\u7406", "\u591a\u667a\u80fd\u4f53", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28979v1", "published_at": "2026-07-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Mixture-of-Translators: Translating KV Caches Across Heterogeneous Large Language Models", "tldr": "\u5728\u5f02\u6784LLM\u95f4\u7ffb\u8bd1\u5e76\u590d\u7528KV\u7f13\u5b58", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Mixture-of-Translators\uff08MoT\uff09\uff0c\u5c06\u6e90\u5927\u6a21\u578b\u7684\u4e0a\u4e0b\u6587 KV cache \u6620\u5c04\u5230\u76ee\u6807\u5927\u6a21\u578b\u7684\u7f13\u5b58\u7a7a\u95f4\uff0c\u4f7f\u4e0d\u540c\u67b6\u6784\u6a21\u578b\u53ef\u590d\u7528\u540c\u4e00\u4e0a\u4e0b\u6587\u7f13\u5b58\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u4e2a translator \u6a21\u5757\u5efa\u6a21\u591a\u6837\u6620\u5c04\uff0c\u5e76\u7528 Context Correction Loss \u7ea0\u6b63\u76ee\u6807\u4fa7\u751f\u6210\u8f68\u8ff9\u504f\u5dee\u3002", "why_notable": "KV cache \u662f\u957f\u4e0a\u4e0b\u6587\u3001\u591a\u6a21\u578b\u534f\u4f5c\u548c\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u7684\u5173\u952e\u6210\u672c\u74f6\u9888\uff1b\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u8de8\u6a21\u578b\u7f13\u5b58\u590d\u7528\u7684\u53ef\u884c\u8def\u5f84\uff0c\u6709\u671b\u964d\u4f4e\u91cd\u590d prefill \u4e0e\u5b58\u50a8\u5f00\u9500\uff0c\u63d0\u5347\u5f02\u6784 LLM \u7cfb\u7edf\u7684\u53ef\u6269\u5c55\u6027\u3002"}, {"abstract": "Self-play agents can generate training problems without questions from target benchmarks, but their curricula lack persistent state: failures affect gradients yet do not explicitly shape future practice. External skill memories preserve procedural experience but are typically learned from fixed task distributions. We introduce \\textbf{SESA} (Self-Evolving Skill-Augmented Agent), which makes procedural memory an evolving state of tool-augmented search self-play. A challenger poses problems, while a separately parameterized solver alone retrieves skills. Informative failures are distilled into reusable skills and written back to memory. The updated memory changes solver behavior and success, which changes the challenger\u0027s reward and the distribution of future problems; the resulting frontier produces new failures that rewrite memory. This bidirectional loop makes task generation and skill memory co-evolve. Because retrieved skills shape on-policy training trajectories, their benefits can enter the model parameters as well as remain in the external bank, enabling memory-free deployment and optional inference-time retrieval. Across seven open-domain and multi-hop question-answering benchmarks, SESA improves average accuracy over SSP by 1.2--3.2 points across multiple backbones and surpasses the skill-augmented SkillRL baseline by 0.9 points under a unified evaluation protocol. On Qwen3 models, SESA-Off retains 1.8--2.2 points of improvement over SSP, while the final skill bank adds a further 0.5--1.0 points. These results show that evolving skill memory is not merely an inference-time plug-in: it changes policy learning and the future training distribution while retaining value as optional external memory. Our code is available at https://github.com/Zenghuang-Fu/SESA-Self-Evolving-Search-Agents.", "arxiv_id": "2607.29468", "arxiv_url": "https://arxiv.org/abs/2607.29468", "authors": ["Zenghuang Fu", "Zhaoyang Li", "Qiuyuan Ai", "Haoyu Wu", "Minghui Wu", "Chenxu Zhao", "Ante Wang", "Guannan He", "Changwei Wang"], "brief": "\u8bba\u6587\u63d0\u51fa SESA\uff1a\u4e00\u79cd\u6280\u80fd\u589e\u5f3a\u7684\u81ea\u8fdb\u5316\u641c\u7d22\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u8ba9\u51fa\u9898\u8005\u751f\u6210\u95ee\u9898\u3001\u89e3\u9898\u8005\u68c0\u7d22\u6280\u80fd\u89e3\u51b3\u95ee\u9898\uff0c\u5e76\u5c06\u6709\u4ef7\u503c\u5931\u8d25\u84b8\u998f\u4e3a\u53ef\u590d\u7528\u6280\u80fd\u5199\u56de\u8bb0\u5fc6\u3002\u6280\u80fd\u8bb0\u5fc6\u4f1a\u53cd\u8fc7\u6765\u6539\u53d8\u89e3\u9898\u7b56\u7565\u4e0e\u540e\u7eed\u51fa\u9898\u5206\u5e03\uff0c\u5b9e\u73b0\u4efb\u52a1\u751f\u6210\u4e0e\u7a0b\u5e8f\u6027\u8bb0\u5fc6\u7684\u5171\u540c\u8fdb\u5316\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29468", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u6311\u6218\u8005-\u6c42\u89e3\u8005\u5206\u79bb\u8bbe\u8ba1\uff1a\u6311\u6218\u8005\u8d1f\u8d23\u51fa\u9898\uff0c\u6c42\u89e3\u8005\u72ec\u7acb\u68c0\u7d22\u5916\u90e8\u6280\u80fd\u5e76\u8fdb\u884c\u5de5\u5177\u589e\u5f3a\u641c\u7d22\u3002", "\u5c06\u4fe1\u606f\u91cf\u9ad8\u7684\u5931\u8d25\u6848\u4f8b\u84b8\u998f\u4e3a\u6280\u80fd\u5199\u5165\u8bb0\u5fc6\u5e93\uff0c\u66f4\u65b0\u540e\u7684\u8bb0\u5fc6\u5f71\u54cd\u540e\u7eed on-policy \u8bad\u7ec3\u8f68\u8ff9\u3002", "\u57287\u4e2a\u5f00\u653e\u57df\u4e0e\u591a\u8df3\u95ee\u7b54\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4 SSP \u5e73\u5747\u63d0\u53471.2\u20133.2\u70b9\uff0c\u76f8\u6bd4 SkillRL \u63d0\u53470.9\u70b9\uff1b\u65e0\u8bb0\u5fc6\u90e8\u7f72\u4ecd\u4fdd\u75591.8\u20132.2\u70b9\u589e\u76ca\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u535a\u5f08", "\u6280\u80fd\u8bb0\u5fc6", "\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29468v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Self-Play Meets Skill Evolution: Self-Evolving Search Agents that Pose, Solve, and Remember", "tldr": "\u8ba9\u81ea\u535a\u5f08\u641c\u7d22\u667a\u80fd\u4f53\u8fdb\u5316\u5e76\u8bb0\u4f4f\u6280\u80fd", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SESA\uff1a\u4e00\u79cd\u6280\u80fd\u589e\u5f3a\u7684\u81ea\u8fdb\u5316\u641c\u7d22\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u8ba9\u51fa\u9898\u8005\u751f\u6210\u95ee\u9898\u3001\u89e3\u9898\u8005\u68c0\u7d22\u6280\u80fd\u89e3\u51b3\u95ee\u9898\uff0c\u5e76\u5c06\u6709\u4ef7\u503c\u5931\u8d25\u84b8\u998f\u4e3a\u53ef\u590d\u7528\u6280\u80fd\u5199\u56de\u8bb0\u5fc6\u3002\u6280\u80fd\u8bb0\u5fc6\u4f1a\u53cd\u8fc7\u6765\u6539\u53d8\u89e3\u9898\u7b56\u7565\u4e0e\u540e\u7eed\u51fa\u9898\u5206\u5e03\uff0c\u5b9e\u73b0\u4efb\u52a1\u751f\u6210\u4e0e\u7a0b\u5e8f\u6027\u8bb0\u5fc6\u7684\u5171\u540c\u8fdb\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u81ea\u535a\u5f08\u8bfe\u7a0b\u751f\u6210\u4e0e\u5916\u90e8\u6280\u80fd\u8bb0\u5fc6\u7ed3\u5408\u6210\u95ed\u73af\uff0c\u8bf4\u660e\u8bb0\u5fc6\u4e0d\u4ec5\u662f\u63a8\u7406\u65f6\u63d2\u4ef6\uff0c\u8fd8\u80fd\u6539\u53d8\u6a21\u578b\u8bad\u7ec3\u5206\u5e03\u4e0e\u53c2\u6570\u5b66\u4e60\uff0c\u5bf9\u6784\u5efa\u53ef\u6301\u7eed\u5b66\u4e60\u7684\u641c\u7d22/\u95ee\u7b54\u667a\u80fd\u4f53\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Balancing sequence length, representational capacity, and long-horizon stability is a central problem in autoregressive (AR) speech and audio generation. Representations with higher frame rates or greater capacity can preserve more signal detail, but they also make streaming generation more vulnerable to distribution drift and AR error accumulation. Conversely, shorter and more compressed representations simplify AR modeling, but their limited bandwidth may discard important components and constrain the upper bound of reconstruction fidelity and generation quality. We ask whether a low-frame-rate, high-dimensional, high-bandwidth continuous representation can be co-designed with a streaming generation framework to support robust high-fidelity reconstruction, strong single-token predictability, and superior long-horizon stability. We decompose this goal into two coupled problems: what geometric and statistical properties a high-dimensional representation space should have, and how an AR continuous-token generator should be structured to resist error accumulation. Accordingly, we propose Locodec, a locally encoded codec that shapes its representation space to improve the interpolatability of a lower-dimensional core manifold and the identifiability of the native high-dimensional coordinates, thereby improving the predictability of high-dimensional high-bandwidth tokens. We also propose MP-ELD, a single-token AR flow-matching framework that uses multi-path information routing and residual classifier-free guidance to mitigate error accumulation. Experiments with 8-Hz, 768-dimensional tokens show that our design preserves reconstruction quality, improves single-token predictability, achieves competitive WER, and maintains stable long-form synthesis, without using external SSL/ASR models, pretrained text language models, or post-training stages.", "arxiv_id": "2607.29363", "arxiv_url": "https://arxiv.org/abs/2607.29363", "authors": ["Yi Luo", "Rongzhi Gu", "Jixun Yao"], "brief": "\u8bba\u6587\u63d0\u51fa Locodec \u8bed\u97f3\u7f16\u89e3\u7801\u8868\u793a\u4e0e MP-ELD \u81ea\u56de\u5f52\u8fde\u7eedtoken\u751f\u6210\u6846\u67b6\uff0c\u9762\u5411\u4f4e\u5e27\u7387\u3001\u9ad8\u7ef4\u3001\u9ad8\u5e26\u5bbd\u8fde\u7eed\u8868\u793a\u7684\u7a33\u5b9a\u8bed\u97f3\u751f\u6210\u3002\u5176\u6838\u5fc3\u662f\u5728\u4fdd\u6301\u91cd\u5efa\u8d28\u91cf\u7684\u540c\u65f6\uff0c\u63d0\u5347\u5355token\u53ef\u9884\u6d4b\u6027\u5e76\u964d\u4f4e\u957f\u7a0b\u81ea\u56de\u5f52\u8bef\u5dee\u7d2f\u79ef\u3002", "categories": ["eess.AS", "cs.AI", "cs.LG", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29363", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Locodec \u901a\u8fc7\u5c40\u90e8\u7f16\u7801\u5851\u9020\u8868\u793a\u7a7a\u95f4\uff0c\u4f7f\u4f4e\u7ef4\u6838\u5fc3\u6d41\u5f62\u66f4\u6613\u63d2\u503c\u3001\u9ad8\u7ef4\u539f\u751f\u5750\u6807\u66f4\u6613\u8bc6\u522b\uff0c\u4ece\u800c\u63d0\u5347\u9ad8\u7ef4\u8fde\u7eedtoken\u7684\u53ef\u9884\u6d4b\u6027\u3002", "MP-ELD \u91c7\u7528\u5355token\u81ea\u56de\u5f52 flow matching\uff0c\u5e76\u7ed3\u5408\u591a\u8def\u5f84\u4fe1\u606f\u8def\u7531\u4e0e\u6b8b\u5dee classifier-free guidance \u6765\u7f13\u89e3\u957f\u5e8f\u5217\u751f\u6210\u4e2d\u7684\u5206\u5e03\u6f02\u79fb\u3002", "\u5728 8Hz\u3001768\u7ef4\u8fde\u7eedtoken\u8bbe\u7f6e\u4e0b\uff0c\u65e0\u9700\u5916\u90e8 SSL/ASR \u6a21\u578b\u3001\u9884\u8bad\u7ec3\u6587\u672c\u8bed\u8a00\u6a21\u578b\u6216\u540e\u8bad\u7ec3\u9636\u6bb5\uff0c\u5373\u5b9e\u73b0\u9ad8\u8d28\u91cf\u91cd\u5efa\u3001\u7ade\u4e89\u6027 WER \u548c\u7a33\u5b9a\u957f\u8bed\u97f3\u5408\u6210\u3002"], "keywords": ["\u8bed\u97f3\u751f\u6210", "\u81ea\u56de\u5f52\u6a21\u578b", "\u8fde\u7eed\u8868\u793a", "\u6d41\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29363v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Stable Autoregressive Speech Generation with Low-Frame-Rate High-Dimensional Continuous Tokens", "tldr": "\u4f4e\u5e27\u7387\u9ad8\u7ef4\u8fde\u7eed\u8bed\u97f3token\u5b9e\u73b0\u7a33\u5b9a\u81ea\u56de\u5f52\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Locodec \u8bed\u97f3\u7f16\u89e3\u7801\u8868\u793a\u4e0e MP-ELD \u81ea\u56de\u5f52\u8fde\u7eedtoken\u751f\u6210\u6846\u67b6\uff0c\u9762\u5411\u4f4e\u5e27\u7387\u3001\u9ad8\u7ef4\u3001\u9ad8\u5e26\u5bbd\u8fde\u7eed\u8868\u793a\u7684\u7a33\u5b9a\u8bed\u97f3\u751f\u6210\u3002\u5176\u6838\u5fc3\u662f\u5728\u4fdd\u6301\u91cd\u5efa\u8d28\u91cf\u7684\u540c\u65f6\uff0c\u63d0\u5347\u5355token\u53ef\u9884\u6d4b\u6027\u5e76\u964d\u4f4e\u957f\u7a0b\u81ea\u56de\u5f52\u8bef\u5dee\u7d2f\u79ef\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u8bed\u97f3\u751f\u6210\u4e2d\u201c\u4f4e\u5e27\u7387\u538b\u7f29\u8868\u793a\u6613\u4e22\u7ec6\u8282\u3001\u9ad8\u5bb9\u91cf\u8868\u793a\u53c8\u96be\u7a33\u5b9a\u81ea\u56de\u5f52\u201d\u7684\u6743\u8861\uff0c\u4e3a\u9ad8\u4fdd\u771f\u3001\u6d41\u5f0f\u3001\u957f\u65f6\u7a33\u5b9a\u8bed\u97f3\u751f\u6210\u63d0\u4f9b\u4e86\u65b0\u7684\u8fde\u7eedtoken\u8bbe\u8ba1\u4e0e\u751f\u6210\u8303\u5f0f\u3002"}, {"abstract": "Vision-language-action (VLA) policies achieve strong performance in robotic manipulation but remain vulnerable to runtime disturbances that break the temporal alignment among visual observations, robot states, and executed actions. We introduce ActFovea, a plug-and-play safeguarding framework that detects and mitigates such failures without retraining or modifying the underlying VLA policy. ActFovea uses robot kinematics, proprioceptive states, and recent actions to construct action-conditioned foveated regions that retain contact-relevant areas and predicted motion corridors while suppressing task-irrelevant visual content. It detects runtime risks by evaluating whether visual motion and observation freshness remain consistent with geometric, proprioceptive, and action transitions. For recoverable disturbances, ActFovea constructs disturbance-specific candidate observations and accepts a recovery only after verifying the resulting action chunk. When stale or replayed observations make reliable recovery impossible, it invokes a bounded safe-failure procedure. In closed-loop evaluations of $\u03c0_0$ across multiple LIBERO suites, ActFovea increases success under localized visual overlays from 49.3\\% to 90.3\\%, closing 93.7\\% of the gap to clean performance. It further improves success under action drift and visual delay by 7.0 and 9.8 percentage points, respectively, while preserving clean-task performance. Under frozen-observation replay, ActFovea triggers timely safe failure in all trials, with no unprotected failures. These results demonstrate that spatiotemporal visual-action consistency provides an effective basis for runtime safeguarding of VLA policies.", "arxiv_id": "2607.29169", "arxiv_url": "https://arxiv.org/abs/2607.29169", "authors": ["Wenda Yu", "Tianshi Wang", "Fengling Li", "Xin Li", "Jingjing Li", "Lei Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa ActFovea\uff0c\u4e00\u4e2a\u65e0\u9700\u91cd\u8bad\u6216\u4fee\u6539\u5e95\u5c42 VLA \u7b56\u7565\u7684\u5373\u63d2\u5373\u7528\u8fd0\u884c\u65f6\u5b89\u5168\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u52a8\u4f5c\u6761\u4ef6\u5316\u7684\u805a\u7126\u89c6\u89c9\u533a\u57df\u4e0e\u89c6\u89c9-\u52a8\u4f5c\u4e00\u81f4\u6027\u68c0\u6d4b\uff0c\u8bc6\u522b\u5e76\u7f13\u89e3\u906e\u6321\u3001\u5ef6\u8fdf\u3001\u52a8\u4f5c\u6f02\u79fb\u548c\u89c2\u6d4b\u91cd\u653e\u7b49\u6270\u52a8\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29169", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5229\u7528\u673a\u5668\u4eba\u8fd0\u52a8\u5b66\u3001\u672c\u4f53\u72b6\u6001\u548c\u8fd1\u671f\u52a8\u4f5c\u6784\u5efa action-conditioned foveated regions\uff0c\u4fdd\u7559\u63a5\u89e6\u76f8\u5173\u533a\u57df\u4e0e\u9884\u6d4b\u8fd0\u52a8\u8d70\u5eca\uff0c\u6291\u5236\u65e0\u5173\u89c6\u89c9\u5185\u5bb9\u3002", "\u901a\u8fc7\u51e0\u4f55\u3001\u672c\u4f53\u611f\u77e5\u548c\u52a8\u4f5c\u8f6c\u79fb\u4e00\u81f4\u6027\uff0c\u68c0\u6d4b\u89c6\u89c9\u8fd0\u52a8\u4e0e\u89c2\u6d4b\u65b0\u9c9c\u5ea6\u662f\u5426\u5f02\u5e38\uff1b\u53ef\u6062\u590d\u6270\u52a8\u4f1a\u751f\u6210\u5019\u9009\u89c2\u6d4b\u5e76\u9a8c\u8bc1\u540e\u7eed\u52a8\u4f5c\u5757\u3002", "\u5728 LIBERO \u591a\u5957\u4ef6\u95ed\u73af\u8bc4\u6d4b\u4e2d\uff0c\u5c40\u90e8\u89c6\u89c9\u8986\u76d6\u4e0b\u6210\u529f\u7387\u4ece 49.3% \u63d0\u5347\u5230 90.3%\uff0c\u52a8\u4f5c\u6f02\u79fb\u548c\u89c6\u89c9\u5ef6\u8fdf\u4e0b\u5206\u522b\u63d0\u5347 7.0 \u4e0e 9.8 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u8fd0\u884c\u65f6\u5b89\u5168", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29169v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ActFovea: Runtime Safeguarding for VLA Policies via Spatiotemporal Visual-Action Consistency", "tldr": "\u7528\u65f6\u7a7a\u89c6\u52a8\u4e00\u81f4\u6027\u4e3aVLA\u7b56\u7565\u8fd0\u884c\u65f6\u62a4\u822a", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ActFovea\uff0c\u4e00\u4e2a\u65e0\u9700\u91cd\u8bad\u6216\u4fee\u6539\u5e95\u5c42 VLA \u7b56\u7565\u7684\u5373\u63d2\u5373\u7528\u8fd0\u884c\u65f6\u5b89\u5168\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u52a8\u4f5c\u6761\u4ef6\u5316\u7684\u805a\u7126\u89c6\u89c9\u533a\u57df\u4e0e\u89c6\u89c9-\u52a8\u4f5c\u4e00\u81f4\u6027\u68c0\u6d4b\uff0c\u8bc6\u522b\u5e76\u7f13\u89e3\u906e\u6321\u3001\u5ef6\u8fdf\u3001\u52a8\u4f5c\u6f02\u79fb\u548c\u89c2\u6d4b\u91cd\u653e\u7b49\u6270\u52a8\u3002", "why_notable": "VLA \u673a\u5668\u4eba\u7b56\u7565\u5728\u771f\u5b9e\u90e8\u7f72\u4e2d\u5bb9\u6613\u53d7\u89c6\u89c9\u906e\u6321\u3001\u5ef6\u8fdf\u548c\u89c2\u6d4b\u5931\u6548\u5f71\u54cd\uff1bActFovea \u4e0d\u4f9d\u8d56\u91cd\u8bad\u5373\u53ef\u63d0\u5347\u9c81\u68d2\u6027\uff0c\u5e76\u80fd\u5728\u4e0d\u53ef\u6062\u590d\u7684\u89c2\u6d4b\u91cd\u653e\u573a\u666f\u4e2d\u53ca\u65f6\u5b89\u5168\u5931\u8d25\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) generate text by auto-regressively sampling the next token. This inherently leads to a many-to-many mapping between prompts and responses, complicating the task of inferring prompts from observed outputs. Prior work on LLM inversion frames prompt recovery as a semantic reconstruction task. They rely on fine-tuning pretrained sequence-to-sequence models on large external datasets--and requiring access to model weights or logits--to generate semantically plausible prompts. In contrast, we present a functional approach to inverting a given LLM in a black-box setting, without auxiliary aids. We train an explicit inverse language model entirely from scratch on data synthetically generated from the target LLM itself. Analogous to forward next-token prediction, our inverse model is trained using previous-token prediction, establishing a generative link between the forward and inverse processes that enables faithful prompt reconstruction. Moreover, it naturally supports diverse prompt reconstructions through sampling, whereby all such prompts induce similar responses under the forward, target LLM. Our approach generalises across datasets and exhibits transferability in reconstructing prompts from responses generated by different LLMs. Further, across the set of token based evaluation metrics for prompt and response reconstructions, our approach outperforms prior work.", "arxiv_id": "2607.29378", "arxiv_url": "https://arxiv.org/abs/2607.29378", "authors": ["Pirzada Suhail", "Nagasai Saketh Naidu", "Atanu R Sinha", "Amit Sethi"], "brief": "\u672c\u6587\u63d0\u51fa PTP\uff0c\u4e00\u79cd\u57fa\u4e8e\u201c\u524d\u4e00\u8bcd\u9884\u6d4b\u201d\u7684 LLM \u53cd\u6f14\u65b9\u6cd5\uff0c\u5728\u9ed1\u76d2\u6761\u4ef6\u4e0b\u4ec5\u7528\u76ee\u6807 LLM \u5408\u6210\u6570\u636e\u4ece\u96f6\u8bad\u7ec3\u663e\u5f0f\u9006\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u5c06\u6b63\u5411 next-token \u751f\u6210\u4e0e\u53cd\u5411 previous-token \u9884\u6d4b\u5bf9\u5e94\u8d77\u6765\uff0c\u7528\u4e8e\u4ece\u6a21\u578b\u8f93\u51fa\u4e2d\u5fe0\u5b9e\u91cd\u6784\u53ef\u80fd\u7684\u539f\u59cb\u63d0\u793a\u8bcd\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29378", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u8bbf\u95ee\u76ee\u6807\u6a21\u578b\u6743\u91cd\u6216 logits\uff0c\u4e5f\u4e0d\u4f9d\u8d56\u5916\u90e8\u5927\u89c4\u6a21\u6570\u636e\u6216\u9884\u8bad\u7ec3 seq2seq \u5fae\u8c03", "\u901a\u8fc7\u76ee\u6807 LLM \u81ea\u751f\u6210\u6570\u636e\u8bad\u7ec3\u9006\u6a21\u578b\uff0c\u652f\u6301\u91c7\u6837\u5f97\u5230\u591a\u4e2a\u80fd\u8bf1\u5bfc\u76f8\u4f3c\u54cd\u5e94\u7684\u5019\u9009\u63d0\u793a\u8bcd", "\u5728\u63d0\u793a\u8bcd\u4e0e\u54cd\u5e94\u91cd\u6784\u7684\u591a\u79cd token \u7ea7\u6307\u6807\u4e0a\u4f18\u4e8e\u65e2\u6709 LLM inversion \u65b9\u6cd5\uff0c\u5e76\u5177\u5907\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u80fd\u529b"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u53cd\u6f14", "\u9690\u79c1\u5b89\u5168", "\u63d0\u793a\u8bcd\u91cd\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29378v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "PTP: Previous-Token Prediction based LLM Inversion for Near-Exact Prompt Reconstruction", "tldr": "\u9ed1\u76d2\u9006\u5411LLM\u8fd1\u7cbe\u786e\u91cd\u6784\u63d0\u793a\u8bcd", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa PTP\uff0c\u4e00\u79cd\u57fa\u4e8e\u201c\u524d\u4e00\u8bcd\u9884\u6d4b\u201d\u7684 LLM \u53cd\u6f14\u65b9\u6cd5\uff0c\u5728\u9ed1\u76d2\u6761\u4ef6\u4e0b\u4ec5\u7528\u76ee\u6807 LLM \u5408\u6210\u6570\u636e\u4ece\u96f6\u8bad\u7ec3\u663e\u5f0f\u9006\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u5c06\u6b63\u5411 next-token \u751f\u6210\u4e0e\u53cd\u5411 previous-token \u9884\u6d4b\u5bf9\u5e94\u8d77\u6765\uff0c\u7528\u4e8e\u4ece\u6a21\u578b\u8f93\u51fa\u4e2d\u5fe0\u5b9e\u91cd\u6784\u53ef\u80fd\u7684\u539f\u59cb\u63d0\u793a\u8bcd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u63d0\u793a\u8bcd\u6062\u590d\u4ece\u8bed\u4e49\u731c\u6d4b\u63a8\u8fdb\u5230\u66f4\u63a5\u8fd1\u529f\u80fd\u7b49\u4ef7\u7684\u9ed1\u76d2\u53cd\u6f14\uff0c\u51f8\u663e\u4e86 LLM \u8f93\u51fa\u53ef\u80fd\u6cc4\u9732\u539f\u59cb\u63d0\u793a\u7684\u98ce\u9669\uff0c\u4e5f\u4e3a\u6a21\u578b\u9690\u79c1\u3001\u5b89\u5168\u5ba1\u8ba1\u548c\u63d0\u793a\u8bcd\u4fdd\u62a4\u63d0\u4f9b\u4e86\u65b0\u89c6\u89d2\u3002"}, {"abstract": "Large language models generate computationally expensive yet semantically void reasoning on beyond-capability tasks, creating risks where plausible-sounding but incorrect derivations mislead users. We characterize this \\textit{futile reasoning} phenomenon through systematic analysis, revealing universal capability overreach and systematic miscalibration between capability and behavior. The dominant failure mode is specious reasoning, which outputs look superficially valid but contain subtle errors, escalating with task difficulty. To address this, we introduce \\textbf{CaRL} (\\textbf{Ca}pability-\\textbf{a}ligned \\textbf{R}einforcement \\textbf{L}earning), which aligns model behavior with capability boundaries through reward shaping that incentivizes refusal over futile reasoning and hindsight refusal augmentation that converts failures into refusal supervision. Experiments demonstrate a substantial reduction in futile reasoning while preserving performance across task difficulties, effectively achieving capability-aligned behavior without sacrificing utility. \\footnote{https://github.com/icip-cas/Knowing-When-to-Quit}", "arxiv_id": "2607.29211", "arxiv_url": "https://arxiv.org/abs/2607.29211", "authors": ["Xinyan Guan", "Jiali Zeng", "Chunlei Xin", "Yaojie Lu", "Hongyu Lin", "Xianpei Han", "Le Sun", "Fandong Meng"], "brief": "\u8bba\u6587\u7cfb\u7edf\u523b\u753b\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u5728\u8d85\u51fa\u80fd\u529b\u8fb9\u754c\u4efb\u52a1\u4e0a\u7684\u201c\u5f92\u52b3\u63a8\u7406\u201d\u73b0\u8c61\uff0c\u5e76\u6307\u51fa\u5176\u4e3b\u8981\u8868\u73b0\u4e3a\u770b\u4f3c\u5408\u7406\u4f46\u542b\u7ec6\u5fae\u9519\u8bef\u7684\u4f2a\u63a8\u7406\u3002\u4f5c\u8005\u63d0\u51fa CaRL\uff0c\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u5851\u5f62\u4e0e\u4e8b\u540e\u62d2\u7b54\u589e\u5f3a\uff0c\u8ba9\u6a21\u578b\u5b66\u4f1a\u5728\u65e0\u529b\u89e3\u51b3\u65f6\u62d2\u7edd\u800c\u975e\u7f16\u9020\u63a8\u7406\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29211", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0LLM\u666e\u904d\u5b58\u5728\u80fd\u529b\u8d8a\u754c\u4e0e\u884c\u4e3a\u6821\u51c6\u5931\u8861\uff1a\u4efb\u52a1\u8d8a\u96be\uff0c\u8d8a\u5bb9\u6613\u751f\u6210\u8bed\u4e49\u7a7a\u6d1e\u4f46\u8c8c\u4f3c\u53ef\u4fe1\u7684\u63a8\u7406\u94fe\u3002", "CaRL \u5956\u52b1\u62d2\u7edd\u5f92\u52b3\u63a8\u7406\uff0c\u5e76\u5c06\u5931\u8d25\u6837\u672c\u8f6c\u5316\u4e3a\u62d2\u7b54\u76d1\u7763\u4fe1\u53f7\uff0c\u4ee5\u5bf9\u9f50\u6a21\u578b\u884c\u4e3a\u548c\u80fd\u529b\u8fb9\u754c\u3002", "\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u663e\u8457\u51cf\u5c11\u5f92\u52b3\u63a8\u7406\uff0c\u540c\u65f6\u5728\u4e0d\u540c\u96be\u5ea6\u4efb\u52a1\u4e0a\u4fdd\u6301\u539f\u6709\u6709\u6548\u89e3\u9898\u6027\u80fd\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u53ef\u9760\u6027", "\u62d2\u7b54\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29211v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Knowing When to Quit: Diagnosing and Training LLMs to Abort Futile Reasoning", "tldr": "\u8bad\u7ec3LLM\u5728\u8d85\u80fd\u529b\u4efb\u52a1\u4e0a\u53ca\u65f6\u653e\u5f03\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u523b\u753b\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u5728\u8d85\u51fa\u80fd\u529b\u8fb9\u754c\u4efb\u52a1\u4e0a\u7684\u201c\u5f92\u52b3\u63a8\u7406\u201d\u73b0\u8c61\uff0c\u5e76\u6307\u51fa\u5176\u4e3b\u8981\u8868\u73b0\u4e3a\u770b\u4f3c\u5408\u7406\u4f46\u542b\u7ec6\u5fae\u9519\u8bef\u7684\u4f2a\u63a8\u7406\u3002\u4f5c\u8005\u63d0\u51fa CaRL\uff0c\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u5851\u5f62\u4e0e\u4e8b\u540e\u62d2\u7b54\u589e\u5f3a\uff0c\u8ba9\u6a21\u578b\u5b66\u4f1a\u5728\u65e0\u529b\u89e3\u51b3\u65f6\u62d2\u7edd\u800c\u975e\u7f16\u9020\u63a8\u7406\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5173\u6ce8LLM\u53ef\u9760\u6027\u4e2d\u7684\u5173\u952e\u95ee\u9898\uff1a\u6a21\u578b\u4e0d\u4ec5\u8981\u4f1a\u56de\u7b54\uff0c\u4e5f\u8981\u77e5\u9053\u4f55\u65f6\u4e0d\u8be5\u56de\u7b54\u3002\u5176\u65b9\u6cd5\u53ef\u964d\u4f4e\u9519\u8bef\u63a8\u7406\u8bef\u5bfc\u7528\u6237\u7684\u98ce\u9669\uff0c\u5bf9\u9ad8\u98ce\u9669\u63a8\u7406\u573a\u666f\u548c\u5b89\u5168\u5bf9\u9f50\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Full-duplex spoken dialogue systems (FDSDSs) can listen while speaking, enabling natural behaviors such as smooth turn-taking, backchannel handling, and user barge-in handling. However, fair comparisons in multi-turn conversations remain a challenge. In addition, existing benchmarks provide limited coverage of languages and dialogue domains. We propose M3-DuplexBench, a multi-turn, multilingual, multidomain benchmark for FDSDSs. M3-DuplexBench supports English and Japanese and covers both casual conversation and multi-turn question answering. In addition, we evaluate models under multiple dialogue context settings, including single-turn, user-only, and teacher-forced full-context settings, to analyze how dialogue history affects model behavior. Experiments with recent FDSDSs reveal model-specific turn-taking characteristics, clear performance gaps across languages and domains, and mixed effects of dialogue context.", "arxiv_id": "2607.29125", "arxiv_url": "https://arxiv.org/abs/2607.29125", "authors": ["Ryo Fukuda", "Atsushi Ando", "Hiroki Kanagawa", "Takatomo Kano", "Marc Delcroix", "Naohiro Tawara", "Yuya Chiba"], "brief": "\u8bba\u6587\u63d0\u51fa M3-DuplexBench\uff0c\u7528\u4e8e\u516c\u5e73\u8bc4\u6d4b\u5168\u53cc\u5de5\u8bed\u97f3\u5bf9\u8bdd\u7cfb\u7edf\u5728\u591a\u8f6e\u4ea4\u4e92\u4e2d\u7684\u8868\u73b0\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u82f1\u8bed\u548c\u65e5\u8bed\uff0c\u5305\u542b\u95f2\u804a\u4e0e\u591a\u8f6e\u95ee\u7b54\uff0c\u5e76\u6bd4\u8f83\u4e0d\u540c\u5bf9\u8bdd\u4e0a\u4e0b\u6587\u8bbe\u7f6e\u5bf9\u6a21\u578b\u884c\u4e3a\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29125", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u652f\u6301\u5168\u53cc\u5de5\u80fd\u529b\u8bc4\u6d4b\uff0c\u5305\u62ec\u8fb9\u542c\u8fb9\u8bf4\u3001\u8f6e\u6b21\u5207\u6362\u3001\u9644\u548c\u53cd\u9988\u4e0e\u7528\u6237\u6253\u65ad\u5904\u7406\u3002", "\u8986\u76d6\u82f1\u8bed\u548c\u65e5\u8bed\u4e24\u79cd\u8bed\u8a00\uff0c\u4ee5\u53ca\u95f2\u804a\u548c\u591a\u8f6e\u95ee\u7b54\u4e24\u4e2a\u5bf9\u8bdd\u57df\u3002", "\u8bbe\u7f6e\u5355\u8f6e\u3001\u4ec5\u7528\u6237\u5386\u53f2\u3001\u6559\u5e08\u5f3a\u5236\u5168\u4e0a\u4e0b\u6587\u7b49\u6761\u4ef6\uff0c\u5206\u6790\u5bf9\u8bdd\u5386\u53f2\u5bf9\u6a21\u578b\u8868\u73b0\u7684\u5f71\u54cd\u3002"], "keywords": ["\u8bed\u97f3\u5bf9\u8bdd", "\u591a\u8bed\u8a00", "\u57fa\u51c6\u8bc4\u6d4b", "\u5bf9\u8bdd\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29125v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "M3-DuplexBench: A Multi-Turn, Multilingual, Multidomain Benchmark for Full-Duplex Spoken Dialogue Models", "tldr": "\u9762\u5411\u5168\u53cc\u5de5\u8bed\u97f3\u5bf9\u8bdd\u7684\u591a\u8bed\u591a\u57df\u591a\u8f6e\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa M3-DuplexBench\uff0c\u7528\u4e8e\u516c\u5e73\u8bc4\u6d4b\u5168\u53cc\u5de5\u8bed\u97f3\u5bf9\u8bdd\u7cfb\u7edf\u5728\u591a\u8f6e\u4ea4\u4e92\u4e2d\u7684\u8868\u73b0\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u82f1\u8bed\u548c\u65e5\u8bed\uff0c\u5305\u542b\u95f2\u804a\u4e0e\u591a\u8f6e\u95ee\u7b54\uff0c\u5e76\u6bd4\u8f83\u4e0d\u540c\u5bf9\u8bdd\u4e0a\u4e0b\u6587\u8bbe\u7f6e\u5bf9\u6a21\u578b\u884c\u4e3a\u7684\u5f71\u54cd\u3002", "why_notable": "\u73b0\u6709\u5168\u53cc\u5de5\u8bed\u97f3\u5bf9\u8bdd\u8bc4\u6d4b\u5728\u591a\u8f6e\u3001\u516c\u5e73\u6027\u3001\u591a\u8bed\u8a00\u548c\u591a\u9886\u57df\u8986\u76d6\u4e0a\u4e0d\u8db3\uff1b\u8be5\u57fa\u51c6\u6709\u52a9\u4e8e\u7cfb\u7edf\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u7684\u8f6e\u6b21\u63a7\u5236\u7279\u6027\u3001\u8de8\u8bed\u8a00\u80fd\u529b\u548c\u9886\u57df\u9c81\u68d2\u6027\u3002"}, {"abstract": "Retrieval-Augmented Generation (RAG) enhances large language models by incorporating external knowledge, but existing pipelines typically operate on plaintext data, raising significant privacy concerns. Prior work on privacy-preserving retrieval leverages cryptographic techniques such as homomorphic encryption (HE) and private information retrieval (PIR), but often relies on interactive protocols or ranking-based selection mechanisms that incur high latency and potential information leakage. In this paper, we propose a practical non-interactive encrypted retrieval framework for RAG based on threshold selection. Instead of performing expensive top-$k$ ranking under encryption, our approach selects documents whose similarity scores exceed a predefined threshold, reducing computational complexity from quadratic to linear in the corpus size. We implement this design using CKKS-based homomorphic computation, enabling fully encrypted similarity evaluation and document selection without revealing query content, intermediate scores, or selected indices. To bridge the gap between approximate encrypted computation and discrete token reconstruction, we introduce a precision-stable mask polarization method that ensures accurate recovery of selected documents. Experiments on standard retrieval benchmarks demonstrate that our approach achieves competitive retrieval effectiveness while significantly reducing latency compared to ranking-based encrypted methods. These results highlight threshold-based selection as a practical foundation for scalable and secure RAG systems.", "arxiv_id": "2607.29019", "arxiv_url": "https://arxiv.org/abs/2607.29019", "authors": ["Yang Gao", "Gang Quan", "Scott Piersall", "Qian Lou", "Dongdong Wang", "Liqiang Wang"], "brief": "\u8bba\u6587\u63d0\u51fa GoldenRetriever\uff0c\u4e00\u4e2a\u9762\u5411 RAG \u7684\u975e\u4ea4\u4e92\u5f0f\u52a0\u5bc6\u68c0\u7d22\u6846\u67b6\u3002\u5b83\u5728 CKKS \u540c\u6001\u52a0\u5bc6\u4e0b\u5b8c\u6210\u76f8\u4f3c\u5ea6\u8ba1\u7b97\u4e0e\u6587\u6863\u9009\u62e9\uff0c\u907f\u514d\u6cc4\u9732\u67e5\u8be2\u3001\u5206\u6570\u548c\u88ab\u9009\u4e2d\u6587\u6863\u7d22\u5f15\u3002", "categories": ["cs.CR", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29019", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u9608\u503c\u9009\u62e9\u66ff\u4ee3\u52a0\u5bc6\u73af\u5883\u4e0b\u6602\u8d35\u7684 top-k \u6392\u5e8f\uff0c\u5c06\u590d\u6742\u5ea6\u4ece\u968f\u8bed\u6599\u89c4\u6a21\u4e8c\u6b21\u589e\u957f\u964d\u4e3a\u7ebf\u6027\u589e\u957f\u3002", "\u57fa\u4e8e CKKS \u5b9e\u73b0\u5168\u7a0b\u52a0\u5bc6\u7684\u76f8\u4f3c\u5ea6\u8bc4\u4f30\u548c\u6587\u6863\u7b5b\u9009\uff0c\u65e0\u9700\u4ea4\u4e92\u5f0f\u534f\u8bae\u3002", "\u63d0\u51fa precision-stable mask polarization \u65b9\u6cd5\uff0c\u89e3\u51b3\u8fd1\u4f3c\u540c\u6001\u8ba1\u7b97\u4e0e\u79bb\u6563 token \u91cd\u5efa\u4e4b\u95f4\u7684\u7cbe\u5ea6\u4e0d\u7a33\u5b9a\u95ee\u9898\u3002"], "keywords": ["\u9690\u79c1\u8ba1\u7b97", "RAG", "\u540c\u6001\u52a0\u5bc6", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29019v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "GoldenRetriever: Non-Interactive Homomorphic Encrypted Retrieval for Privacy-Preserving RAG", "tldr": "\u7528\u540c\u6001\u52a0\u5bc6\u5b9e\u73b0\u4f4e\u5ef6\u8fdf\u9690\u79c1RAG\u68c0\u7d22", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GoldenRetriever\uff0c\u4e00\u4e2a\u9762\u5411 RAG \u7684\u975e\u4ea4\u4e92\u5f0f\u52a0\u5bc6\u68c0\u7d22\u6846\u67b6\u3002\u5b83\u5728 CKKS \u540c\u6001\u52a0\u5bc6\u4e0b\u5b8c\u6210\u76f8\u4f3c\u5ea6\u8ba1\u7b97\u4e0e\u6587\u6863\u9009\u62e9\uff0c\u907f\u514d\u6cc4\u9732\u67e5\u8be2\u3001\u5206\u6570\u548c\u88ab\u9009\u4e2d\u6587\u6863\u7d22\u5f15\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u9690\u79c1\u4fdd\u62a4 RAG \u7684\u6838\u5fc3\u74f6\u9888\uff0c\u63d0\u4f9b\u4e86\u66f4\u4f4e\u5ef6\u8fdf\u3001\u975e\u4ea4\u4e92\u4e14\u4fe1\u606f\u6cc4\u9732\u66f4\u5c11\u7684\u52a0\u5bc6\u68c0\u7d22\u65b9\u6848\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u5b89\u5168\u53ef\u6269\u5c55\u7684\u4f01\u4e1a\u7ea7\u6216\u654f\u611f\u6570\u636e RAG \u90e8\u7f72\u3002"}, {"abstract": "Convolutional neural networks (CNNs) are widely used for time-series classification, but their deployment in critical domains requires understanding the temporal and spectral patterns that drive their predictions. Concept extraction (CE) methods identify such patterns by analyzing representations within the models\u0027 latent space. However, existing time-series CE methods have three limitations: they operate only in the time domain and overlook frequency features, predefine the number of concepts, and produce localizations misaligned with the regions the model uses. We address these limitations by proposing CENDRe, a concept extraction method for CNNs. It first discovers concepts by clustering per-timestep latent representations in two stages, where silhouette-guided aggregation selects the number of concepts automatically. Then, it localizes each concept through gradients of a presence score that contrasts the latent representations with their prototypes, producing masks that concentrate on the regions driving the concept. These gradients, propagated through a differentiable invertible mapping of the input such as a Fourier transform, yield localizations for the same concepts in the frequency domain. Finally, each concept receives a relevance score that quantifies its contribution to each class. On synthetic benchmarks, CENDRe achieves representation correctness comparable to state-of-the-art CE methods and significantly higher importance correctness. On real bearing-fault data, CENDRe extracts the frequency bands driving the model\u0027s predictions, located in regions commonly inspected for fault diagnosis, producing evidence to assess the model that time-domain CE methods cannot.", "arxiv_id": "2607.29621", "arxiv_url": "https://arxiv.org/abs/2607.29621", "authors": ["Antonia Holzapfel", "Andres Felipe Posada Moreno", "Sebastian Trimpe"], "brief": "\u672c\u6587\u63d0\u51fa CENDRe\uff0c\u4e00\u79cd\u7528\u4e8e\u65f6\u5e8f\u5206\u7c7b CNN \u7684\u6982\u5ff5\u63d0\u53d6\u65b9\u6cd5\uff0c\u53ef\u81ea\u52a8\u53d1\u73b0\u6f5c\u5728\u6982\u5ff5\u5e76\u540c\u65f6\u5728\u65f6\u95f4\u57df\u548c\u9891\u7387\u57df\u5b9a\u4f4d\u5176\u5bf9\u5e94\u6a21\u5f0f\u3002\u5b83\u901a\u8fc7\u805a\u7c7b\u9010\u65f6\u95f4\u6b65\u9690\u8868\u793a\u3001\u68af\u5ea6\u5b9a\u4f4d\u548c\u53ef\u5fae\u53ef\u9006\u53d8\u6362\uff0c\u89e3\u91ca\u6a21\u578b\u9884\u6d4b\u6240\u4f9d\u8d56\u7684\u65f6\u9891\u8bc1\u636e\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29621", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u4e24\u9636\u6bb5\u805a\u7c7b\u9010\u65f6\u95f4\u6b65\u9690\u8868\u793a\uff0c\u5e76\u7528\u8f6e\u5ed3\u7cfb\u6570\u5f15\u5bfc\u805a\u5408\uff0c\u81ea\u52a8\u786e\u5b9a\u6982\u5ff5\u6570\u91cf", "\u901a\u8fc7\u6982\u5ff5\u5b58\u5728\u5206\u6570\u7684\u68af\u5ea6\u751f\u6210\u5b9a\u4f4d\u63a9\u7801\uff0c\u4f7f\u5b9a\u4f4d\u533a\u57df\u66f4\u8d34\u8fd1\u6a21\u578b\u5b9e\u9645\u4f7f\u7528\u7684\u8bc1\u636e", "\u501f\u52a9\u5085\u91cc\u53f6\u53d8\u6362\u7b49\u53ef\u5fae\u53ef\u9006\u6620\u5c04\uff0c\u5c06\u540c\u4e00\u6982\u5ff5\u7684\u5b9a\u4f4d\u6269\u5c55\u5230\u9891\u7387\u57df\uff0c\u5e76\u4e3a\u6982\u5ff5\u5206\u914d\u7c7b\u522b\u76f8\u5173\u6027\u5206\u6570"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u65f6\u95f4\u5e8f\u5217", "\u6982\u5ff5\u63d0\u53d6", "\u9891\u57df\u5206\u6790"], "num_comments": 0, "o
