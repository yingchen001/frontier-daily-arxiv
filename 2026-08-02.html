n_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29621v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CENDRe: Concept Extraction with Natural Domain Representations", "tldr": "\u9762\u5411\u65f6\u5e8fCNN\u7684\u65f6\u9891\u6982\u5ff5\u63d0\u53d6\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa CENDRe\uff0c\u4e00\u79cd\u7528\u4e8e\u65f6\u5e8f\u5206\u7c7b CNN \u7684\u6982\u5ff5\u63d0\u53d6\u65b9\u6cd5\uff0c\u53ef\u81ea\u52a8\u53d1\u73b0\u6f5c\u5728\u6982\u5ff5\u5e76\u540c\u65f6\u5728\u65f6\u95f4\u57df\u548c\u9891\u7387\u57df\u5b9a\u4f4d\u5176\u5bf9\u5e94\u6a21\u5f0f\u3002\u5b83\u901a\u8fc7\u805a\u7c7b\u9010\u65f6\u95f4\u6b65\u9690\u8868\u793a\u3001\u68af\u5ea6\u5b9a\u4f4d\u548c\u53ef\u5fae\u53ef\u9006\u53d8\u6362\uff0c\u89e3\u91ca\u6a21\u578b\u9884\u6d4b\u6240\u4f9d\u8d56\u7684\u65f6\u9891\u8bc1\u636e\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5f25\u8865\u4e86\u73b0\u6709\u65f6\u5e8f\u6982\u5ff5\u63d0\u53d6\u53ea\u5173\u6ce8\u65f6\u95f4\u57df\u3001\u9700\u9884\u8bbe\u6982\u5ff5\u6570\u548c\u5b9a\u4f4d\u4e0d\u51c6\u7684\u4e0d\u8db3\uff1b\u5728\u8f74\u627f\u6545\u969c\u8bca\u65ad\u4e2d\u80fd\u63d0\u53d6\u6a21\u578b\u4f9d\u8d56\u7684\u5173\u952e\u9891\u5e26\uff0c\u63d0\u5347\u4e86\u5173\u952e\u5de5\u4e1a\u573a\u666f\u4e2d CNN \u51b3\u7b56\u89e3\u91ca\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Imitation learning (IL)---training an agent to replicate expert behavior from demonstrations---underpins applications from robotics to language model training. Standard approaches such as Behavior Cloning (BC) are known to suffer from compounding errors and performance plateaus, particularly when the learner cannot perfectly represent the expert\u0027s policy (as is typical, e.g., in distillation). Two interventions are widely understood empirically to improve performance: querying the expert interactively along the learner\u0027s own trajectories, and using value function estimation en route to generating a policy rather than directly fitting the expert\u0027s full action distribution. We investigate the nature of these improvements and their potentially surprising interplay. Our main finding is that expert interaction relaxes the representational demands on the learner: one only needs a model capable of realizing the expert\u0027s value function, bypassing the (often stricter) requirement of realizing the expert\u0027s policy itself. Concretely, we introduce OVI, an interactive on-policy IL algorithm that is statistically efficient whenever the learner can represent the expert\u0027s value function and computationally efficient given access to a linear maximization oracle. We complement this with a negative result showing that interaction is necessary. Namely, without stronger assumptions beyond expert-value realizability alone, any offline IL algorithm must scale with the complexity of the expert policy class. Our findings bear out empirically. OVI outperforms offline policy-based (BC), interactive policy-based (DAgger), and offline value-based IL methods, with the largest gains when the learner network is substantially less expressive than the expert\u0027s.", "arxiv_id": "2607.29617", "arxiv_url": "https://arxiv.org/abs/2607.29617", "authors": ["Luca Viano", "Antoine Moulin", "Audrey Huang", "Volkan Cevher", "Philip Amortila", "Dylan J. Foster"], "brief": "\u8bba\u6587\u7814\u7a76\u4ef7\u503c\u578b\u6a21\u4eff\u5b66\u4e60\u4e2d\uff0c\u4f55\u65f6\u4e0e\u4e13\u5bb6\u8fdb\u884c on-policy \u4ea4\u4e92\u80fd\u5e26\u6765\u6536\u76ca\u3002\u4f5c\u8005\u63d0\u51fa OVI \u7b97\u6cd5\uff0c\u8bc1\u660e\u53ea\u8981\u5b66\u4e60\u5668\u80fd\u8868\u793a\u4e13\u5bb6\u4ef7\u503c\u51fd\u6570\u800c\u975e\u5b8c\u6574\u4e13\u5bb6\u7b56\u7565\uff0c\u5c31\u80fd\u5b9e\u73b0\u7edf\u8ba1\u9ad8\u6548\u7684\u4ea4\u4e92\u5f0f\u6a21\u4eff\u5b66\u4e60\u3002", "categories": ["cs.LG", "cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29617", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6838\u5fc3\u7ed3\u8bba\uff1a\u4e13\u5bb6\u4ea4\u4e92\u5c06\u5b66\u4e60\u5668\u7684\u8868\u793a\u9700\u6c42\u4ece\u201c\u62df\u5408\u4e13\u5bb6\u7b56\u7565\u201d\u653e\u5bbd\u5230\u201c\u5b9e\u73b0\u4e13\u5bb6\u4ef7\u503c\u51fd\u6570\u201d\u3002", "\u63d0\u51fa OVI\uff0c\u4e00\u79cd\u4ea4\u4e92\u5f0f on-policy \u4ef7\u503c\u578b\u6a21\u4eff\u5b66\u4e60\u7b97\u6cd5\uff1b\u5728\u4e13\u5bb6\u4ef7\u503c\u53ef\u8868\u793a\u65f6\u7edf\u8ba1\u9ad8\u6548\uff0c\u5e76\u5728\u6709\u7ebf\u6027\u6700\u5927\u5316 oracle \u65f6\u8ba1\u7b97\u9ad8\u6548\u3002", "\u7ed9\u51fa\u8d1f\u9762\u7ed3\u679c\uff1a\u4ec5\u6709\u4e13\u5bb6\u4ef7\u503c\u53ef\u8868\u793a\u5047\u8bbe\u65f6\uff0c\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60\u4ecd\u5fc5\u987b\u968f\u4e13\u5bb6\u7b56\u7565\u7c7b\u590d\u6742\u5ea6\u6269\u5c55\uff0c\u8bf4\u660e\u4ea4\u4e92\u662f\u5fc5\u8981\u7684\u3002"], "keywords": ["\u6a21\u4eff\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u4ef7\u503c\u51fd\u6570", "\u5728\u7ebf\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29617v1", "published_at": "2026-07-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Does On-Policy Interaction Help? Representational Tradeoffs in Value-Based Imitation Learning", "tldr": "\u5728\u7ebf\u4ea4\u4e92\u53ef\u964d\u4f4e\u6a21\u4eff\u5b66\u4e60\u7684\u8868\u793a\u8981\u6c42", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u4ef7\u503c\u578b\u6a21\u4eff\u5b66\u4e60\u4e2d\uff0c\u4f55\u65f6\u4e0e\u4e13\u5bb6\u8fdb\u884c on-policy \u4ea4\u4e92\u80fd\u5e26\u6765\u6536\u76ca\u3002\u4f5c\u8005\u63d0\u51fa OVI \u7b97\u6cd5\uff0c\u8bc1\u660e\u53ea\u8981\u5b66\u4e60\u5668\u80fd\u8868\u793a\u4e13\u5bb6\u4ef7\u503c\u51fd\u6570\u800c\u975e\u5b8c\u6574\u4e13\u5bb6\u7b56\u7565\uff0c\u5c31\u80fd\u5b9e\u73b0\u7edf\u8ba1\u9ad8\u6548\u7684\u4ea4\u4e92\u5f0f\u6a21\u4eff\u5b66\u4e60\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u7406\u8bba\u4e0a\u89e3\u91ca\u4e86\u4e3a\u4ec0\u4e48 DAgger \u7c7b\u4ea4\u4e92\u548c\u4ef7\u503c\u51fd\u6570\u65b9\u6cd5\u80fd\u6539\u5584\u884c\u4e3a\u514b\u9686\u7684\u8bef\u5dee\u7d2f\u79ef\u95ee\u9898\uff0c\u5e76\u63ed\u793a\u4e8c\u8005\u7684\u8868\u793a\u590d\u6742\u5ea6\u6743\u8861\uff1b\u5bf9\u5c0f\u6a21\u578b\u84b8\u998f\u4e13\u5bb6\u7b56\u7565\u3001\u673a\u5668\u4eba\u6a21\u4eff\u5b66\u4e60\u7b49\u573a\u666f\u5177\u6709\u5b9e\u9645\u610f\u4e49\u3002"}, {"abstract": "Traditional static assessments rely on a subtractive, deficit-based grading model that often penalizes ambition and obscures diagnostic feedback. Conversely, traditional face-to-face oral examinations introduce severe construct-irrelevant variance by exacerbating performative anxiety and the sociological power imbalances inherent to academic hierarchies. This paper presents the theoretical foundation for the \"Socratic Test,\" an automated, computer-mediated conversational assessment. By integrating Dynamic Assessment principles, multimodal workspaces, Bloom\u0027s Taxonomy for real-time proctoring, and the SOLO Taxonomy for structural evaluation, the Socratic Test actively maps a student\u0027s cognitive boundaries. This paper formalizes the use of graduated scaffolding to quantify the Zone of Proximal Development (ZPD) and details a non-compensatory, additive grading architecture that prioritizes mastery over penalty and human-AI alignment to ensure unprecedented measurement reliability.", "arxiv_id": "2607.29624", "arxiv_url": "https://arxiv.org/abs/2607.29624", "authors": ["Ilya Mikhelson"], "brief": "\u8bba\u6587\u4e3a\u201cSocratic Test\u201d\u5efa\u7acb\u7406\u8bba\u57fa\u7840\uff1a\u4e00\u79cd\u81ea\u52a8\u5316\u3001\u8ba1\u7b97\u673a\u5a92\u4ecb\u7684\u5bf9\u8bdd\u5f0f\u8003\u8bd5\u3002\u5b83\u7ed3\u5408\u52a8\u6001\u8bc4\u4f30\u3001\u591a\u6a21\u6001\u5de5\u4f5c\u533a\u3001Bloom \u5206\u7c7b\u4e0e SOLO \u5206\u7c7b\uff0c\u7528\u5206\u7ea7\u652f\u67b6\u5b9e\u65f6\u63a2\u6d4b\u5b66\u751f\u8ba4\u77e5\u8fb9\u754c\u3002", "categories": ["cs.CY", "cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29624", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u7528\u5206\u7ea7\u652f\u67b6\u91cf\u5316\u6700\u8fd1\u53d1\u5c55\u533a\uff08ZPD\uff09\uff0c\u4ece\u201c\u4f1a\u4e0d\u4f1a\u201d\u8f6c\u5411\u8bc4\u4f30\u5728\u63d0\u793a\u4e0b\u80fd\u8fbe\u5230\u7684\u8ba4\u77e5\u6c34\u5e73", "\u5f15\u5165 Bloom \u5206\u7c7b\u7528\u4e8e\u5b9e\u65f6\u76d1\u8003\u4e0e\u63d0\u95ee\u8c03\u8282\uff0cSOLO \u5206\u7c7b\u7528\u4e8e\u7ed3\u6784\u5316\u8bc4\u4ef7\u5b66\u751f\u7406\u89e3\u6df1\u5ea6", "\u63d0\u51fa\u975e\u8865\u507f\u5f0f\u3001\u52a0\u5206\u578b\u8bc4\u5206\u67b6\u6784\uff0c\u5f3a\u8c03\u638c\u63e1\u5ea6\u4e0e\u8bca\u65ad\u53cd\u9988\uff0c\u51cf\u5c11\u4f20\u7edf\u6263\u5206\u5236\u548c\u53e3\u8bd5\u7126\u8651\u5e26\u6765\u7684\u504f\u5dee"], "keywords": ["\u6559\u80b2\u6d4b\u8bc4", "\u591a\u6a21\u6001", "\u4eba\u673a\u4ea4\u4e92", "AI\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29624v1", "published_at": "2026-07-31", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "The Theoretical Foundation of Socratic Tests: Dynamic, Multimodal, Conversational Examinations", "tldr": "\u63d0\u51fa\u52a8\u6001\u591a\u6a21\u6001\u82cf\u683c\u62c9\u5e95\u5f0f\u81ea\u52a8\u6d4b\u8bc4\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4e3a\u201cSocratic Test\u201d\u5efa\u7acb\u7406\u8bba\u57fa\u7840\uff1a\u4e00\u79cd\u81ea\u52a8\u5316\u3001\u8ba1\u7b97\u673a\u5a92\u4ecb\u7684\u5bf9\u8bdd\u5f0f\u8003\u8bd5\u3002\u5b83\u7ed3\u5408\u52a8\u6001\u8bc4\u4f30\u3001\u591a\u6a21\u6001\u5de5\u4f5c\u533a\u3001Bloom \u5206\u7c7b\u4e0e SOLO \u5206\u7c7b\uff0c\u7528\u5206\u7ea7\u652f\u67b6\u5b9e\u65f6\u63a2\u6d4b\u5b66\u751f\u8ba4\u77e5\u8fb9\u754c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bd5\u56fe\u4e3a AI \u53c2\u4e0e\u7684\u52a8\u6001\u53e3\u8bd5\u63d0\u4f9b\u53ef\u89e3\u91ca\u7684\u6559\u80b2\u6d4b\u91cf\u7406\u8bba\u6846\u67b6\uff0c\u6709\u671b\u63d0\u5347\u8003\u8bd5\u7684\u8bca\u65ad\u6027\u3001\u516c\u5e73\u6027\u4e0e\u53ef\u9760\u6027\uff0c\u4f46\u4e3b\u8981\u8d21\u732e\u504f\u7406\u8bba\u5316\u3002"}, {"abstract": "The rapid adoption of deep learning models in high-risk domains has intensified the need for trustworthy Explainable Artificial Intelligence (XAI). However, objectively evaluating explanation fidelity and aligning XAI metrics with human-centered understanding remain critical open challenges. In this work, we propose a model-agnostic metric, the EPC score, which is an extension of the Explainability-Performance Coefficient (EPC), that quantifies explanation quality by explicitly balancing the trade-off between feature selection sparsity and preserved model performance. Through an empirical validation across tabular, text, and image modalities, we show that the EPC score effectively uncovers operational dependencies among network activations, data dimensionality, and explainer performance. Furthermore, we validate the EPC score against independent human-based explanations, proving that higher EPC scores strongly align with human lexical sentiment judgments and spatial visual annotations.", "arxiv_id": "2607.29614", "arxiv_url": "https://arxiv.org/abs/2607.29614", "authors": ["Christian Oliva", "Luis F. Lago-Fern\u00e1ndez"], "brief": "\u672c\u6587\u63d0\u51fa\u6a21\u578b\u65e0\u5173\u7684EPC score\uff0c\u7528\u4e8e\u5728\u7279\u5f81\u9009\u62e9\u7a00\u758f\u6027\u4e0e\u6a21\u578b\u6027\u80fd\u4fdd\u6301\u4e4b\u95f4\u91cf\u5316\u89e3\u91ca\u8d28\u91cf\u3002\u4f5c\u8005\u5728\u8868\u683c\u3001\u6587\u672c\u3001\u56fe\u50cf\u4efb\u52a1\u4e0a\u9a8c\u8bc1\u5176\u6709\u6548\u6027\uff0c\u5e76\u4e0e\u4eba\u7c7b\u89e3\u91ca\u7ed3\u679c\u8fdb\u884c\u5 af\u7b97\u6cd5\u8bc4\u4f30\u63a8\u8fdb\u5230\u4eba\u7c7b\u4e2d\u5fc3\u9a8c\u8bc1\uff0c\u6709\u52a9\u4e8e\u5728\u9ad8\u98ce\u9669\u573a\u666f\u4e2d\u66f4\u5ba2\u89c2\u5730\u6bd4\u8f83\u89e3\u91ca\u65b9\u6cd5\u7684\u53ef\u9760\u6027\u4e0e\u53ef\u7528\u6027\u3002"}, {"abstract": "Reading a social situation often depends on behavior, not words alone. We introduce FriendBench, a benchmark for inferring whether two people are already familiar or are meeting as strangers, from a 20-second clip of a dyadic ice-breaker conversation. Every pair answers the same type of prompt, so only the manner of interaction can reveal the answer. Across text, audio, and video, we compare 26 models from seven companies against matched human panels over 96 balanced dyads. The best model and the human crowd are statistically indistinguishable on accuracy in every modality, but reach it differently: humans stay balanced across the two answers, while the strongest models lean toward \"stranger\"---a difference in effective prior, not discrimination. Richer channels help both unequally, and only humans gain from visible behavior on top of speech. We release the stimuli, human ratings, and model predictions.", "arxiv_id": "2607.29602", "arxiv_url": "https://arxiv.org/abs/2607.29602", "authors": ["Jeffrey M. Girard", "Jason Z. Zheng", "Jacqueline R. Vertino", "Antony D\u0027Avirro", "Benjamin Peloquin"], "brief": "\u8bba\u6587\u63d0\u51fa FriendBench\uff0c\u752820\u79d2\u53cc\u4eba\u7834\u51b0\u5bf9\u8bdd\u7247\u6bb5\u8bc4\u4f30\u4eba\u7c7b\u4e0e\u591a\u6a21\u6001\u5927\u6a21\u578b\u5224\u65ad\u4e24\u4eba\u662f\u719f\u4eba\u8fd8\u662f\u964c\u751f\u4eba\u7684\u80fd\u529b\u3002\u4f5c\u8005\u5728\u6587\u672c\u3001\u97f3\u9891\u3001\u89c6\u9891\u6a21\u6001\u4e0a\u6bd4\u8f83\u4e867\u5bb6\u516c\u53f826\u4e2a\u6a21\u578b\u4e0e\u5339\u914d\u4eba\u7c7b\u8bc4\u5ba1\u572896\u7ec4\u5e73\u8861\u6837\u672c\u4e0a\u7684\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29602", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6240\u6709\u5bf9\u8bdd\u5bf9\u56de\u7b54\u76f8\u540c\u7c7b\u578b\u63d0\u793a\uff0c\u7b54\u6848\u53ea\u80fd\u4ece\u4e92\u52a8\u65b9\u5f0f\u800c\u975e\u8bed\u4e49\u5185\u5bb9\u4e2d\u63a8\u65ad\u3002", "\u6700\u4f73\u6a21\u578b\u4e0e\u4eba\u7c7b\u7fa4\u4f53\u5728\u5404\u6a21\u6001\u51c6\u786e\u7387\u4e0a\u7edf\u8ba1\u4e0a\u4e0d\u53ef\u533a\u5206\uff0c\u4f46\u6a21\u578b\u66f4\u504f\u5411\u9884\u6d4b\u201c\u964c\u751f\u4eba\u201d\u3002", "\u66f4\u4e30\u5bcc\u6a21\u6001\u5bf9\u4eba\u7c7b\u548c\u6a21\u578b\u90fd\u6709\u5e2e\u52a9\uff0c\u4f46\u53ea\u6709\u4eba\u7c7b\u80fd\u4ece\u8bed\u97f3\u4e4b\u5916\u7684\u53ef\u89c1\u884c\u4e3a\u4e2d\u83b7\u5f97\u989d\u5916\u6536\u76ca\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u793e\u4ea4\u667a\u80fd", "\u57fa\u51c6\u8bc4\u6d4b", "\u884c\u4e3a\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29602v1", "published_at": "2026-07-31", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "FriendBench: Benchmarking Dyadic Familiarity Inference in Humans and Multimodal Large Language Models", "tldr": "\u8bc4\u6d4b\u591a\u6a21\u6001\u6a21\u578b\u8bc6\u522b\u4e24\u4eba\u662f\u5426\u719f\u8bc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FriendBench\uff0c\u752820\u79d2\u53cc\u4eba\u7834\u51b0\u5bf9\u8bdd\u7247\u6bb5\u8bc4\u4f30\u4eba\u7c7b\u4e0e\u591a\u6a21\u6001\u5927\u6a21\u578b\u5224\u65ad\u4e24\u4eba\u662f\u719f\u4eba\u8fd8\u662f\u964c\u751f\u4eba\u7684\u80fd\u529b\u3002\u4f5c\u8005\u5728\u6587\u672c\u3001\u97f3\u9891\u3001\u89c6\u9891\u6a21\u6001\u4e0a\u6bd4\u8f83\u4e867\u5bb6\u516c\u53f826\u4e2a\u6a21\u578b\u4e0e\u5339\u914d\u4eba\u7c7b\u8bc4\u5ba1\u572896\u7ec4\u5e73\u8861\u6837\u672c\u4e0a\u7684\u8868\u73b0\u3002", "why_notable": "\u8be5\u57fa\u51c6\u805a\u7126\u7ec6\u7c92\u5ea6\u793e\u4f1a\u5173\u7cfb\u63a8\u65ad\uff0c\u63ed\u793a\u5f53\u524d\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u603b\u4f53\u51c6\u786e\u7387\u63a5\u8fd1\u4eba\u7c7b\u65f6\u4ecd\u5b58\u5728\u5148\u9a8c\u504f\u7f6e\u4e0e\u884c\u4e3a\u7406\u89e3\u5dee\u5f02\uff0c\u5bf9\u793e\u4ea4\u667a\u80fd\u548c\u591a\u6a21\u6001\u8bc4\u6d4b\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Fault detection and diagnosis (FDD) technology is essential for improving HVAC system reliability, energy efficiency, and maintenance effectiveness. However, effective deployment of FDD solutions in buildings requires structured domain knowledge that can bridge heterogeneous data sources, diverse equipment types, and varied diagnostic outputs. Limited data interpretability and interoperability within the FDD domain have led to fragmented information silos, hindering the implementation of FDD and related applications, such as the digital twin-enabled FDD frameworks and artificial intelligence (AI)-driven maintenance decision-making systems. This paper presents an FDD Ontology (FDD-ON), a modular and extensible ontology to formally represent variable air volume (VAV) HVAC system components, fault types, symptom statuses, fault impacts and associated attributes. FDD-ON integrates HVAC system FDD semantics to provide comprehensive representations of fault and symptom attributes, supported by the well-defined controlled vocabulary. Additionally, FDD-ON offers comprehensive fault, symptom, and impact libraries to capture a broad spectrum of operational abnormalities and their consequences in VAV HVAC systems. Through explicit contributing cause-fault-symptom-impact relations, FDD-ON serves as a machine-interpretable basis for querying diagnostic knowledge, mapping heterogeneous FDD outputs, and developing interoperable FDD-related applications. FDD-ON is evaluated using publicly available VAV HVAC system datasets and demonstrated through FDD development applications. Results indicate that FDD-ON provides a foundational semantic framework for advancing scalable, transparent, and interoperable FDD solutions across various applications.", "arxiv_id": "2607.29657", "arxiv_url": "https://arxiv.org/abs/2607.29657", "authors": ["Yimin Chen", "Brian Fricke", "Bo Shen", "Jamie Lian", "Mingkan Zhang", "James Lo", "Yun Zhang", "Shi Ye", "Jiajing Huang", "Han Hu", "Chujie Lu", "Rui Tang", "George Zhuang"], "brief": "\u672c\u6587\u63d0\u51faFDD-ON\uff0c\u4e00\u4e2a\u9762\u5411\u53d8\u98ce\u91cf\uff08VAV\uff09HVAC\u7cfb\u7edf\u6545\u969c\u68c0\u6d4b\u4e0e\u8bca\u65ad\u7684\u6a21\u5757\u5316\u3001\u53ef\u6269\u5c55\u672c\u4f53\u3002\u5b83\u5f62\u5f0f\u5316\u8868\u793a\u8bbe\u5907\u7ec4\u4ef6\u3001\u6545\u969c\u7c7b\u578b\u3001\u75c7\u72b6\u72b6\u6001\u3001\u6545\u969c\u5f71\u54cd\u53ca\u76f8\u5173\u5c5e\u6027\uff0c\u5e76\u63d0\u4f9b\u53ef\u673a\u5668\u89e3\u91ca\u7684\u8bca\u65ad\u77e5\u8bc6\u6846\u67b6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29657", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u6574\u5408VAV HVAC\u6545\u969c\u3001\u75c7\u72b6\u3001\u5f71\u54cd\u7b49\u8bed\u4e49\uff0c\u914d\u5957\u53d7\u63a7\u8bcd\u8868\u4ee5\u63d0\u5347\u6570\u636e\u53ef\u89e3\u91ca\u6027\u4e0e\u4e00\u81f4\u6027", "\u6784\u5efa\u6545\u969c\u5e93\u3001\u75c7\u72b6\u5e93\u548c\u5f71\u54cd\u5e93\uff0c\u8986\u76d6\u591a\u7c7b\u8fd0\u884c\u5f02\u5e38\u53ca\u5176\u540e\u679c", "\u901a\u8fc7\u201c\u6210\u56e0-\u6545\u969c-\u75c7\u72b6-\u5f71\u54cd\u201d\u663e\u5f0f\u5173\u7cfb\uff0c\u652f\u6301\u5f02\u6784FDD\u8f93\u51fa\u6620\u5c04\u3001\u77e5\u8bc6\u67e5\u8be2\u548c\u4e92\u64cd\u4f5c\u5e94\u7528\u5f00\u53d1"], "keywords": ["\u77e5\u8bc6\u8868\u793a", "\u6545\u969c\u8bca\u65ad", "\u672c\u4f53", "\u667a\u80fd\u5efa\u7b51"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29657v1", "published_at": "2026-07-31", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Development of FDD-ON: an Ontology for VAV HVAC System Fault Detection and Diagnostics", "tldr": "\u6784\u5efaVAV\u7a7a\u8c03\u6545\u969c\u8bca\u65ad\u672c\u4f53FDD-ON", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51faFDD-ON\uff0c\u4e00\u4e2a\u9762\u5411\u53d8\u98ce\u91cf\uff08VAV\uff09HVAC\u7cfb\u7edf\u6545\u969c\u68c0\u6d4b\u4e0e\u8bca\u65ad\u7684\u6a21\u5757\u5316\u3001\u53ef\u6269\u5c55\u672c\u4f53\u3002\u5b83\u5f62\u5f0f\u5316\u8868\u793a\u8bbe\u5907\u7ec4\u4ef6\u3001\u6545\u969c\u7c7b\u578b\u3001\u75c7\u72b6\u72b6\u6001\u3001\u6545\u969c\u5f71\u54cd\u53ca\u76f8\u5173\u5c5e\u6027\uff0c\u5e76\u63d0\u4f9b\u53ef\u673a\u5668\u89e3\u91ca\u7684\u8bca\u65ad\u77e5\u8bc6\u6846\u67b6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u5efa\u7b51HVAC\u6545\u969c\u8bca\u65ad\u4e2d\u7684\u6570\u636e\u5b64\u5c9b\u4e0e\u8bed\u4e49\u4e0d\u4e00\u81f4\u95ee\u9898\uff0c\u63d0\u4f9b\u53ef\u590d\u7528\u7684\u672c\u4f53\u57fa\u7840\uff0c\u6709\u52a9\u4e8e\u6570\u5b57\u5b6a\u751fFDD\u3001AI\u7ef4\u62a4\u51b3\u7b56\u548c\u8de8\u7cfb\u7edf\u53ef\u6269\u5c55\u90e8\u7f72\u3002"}, {"abstract": "The Abstraction and Reasoning Corpus (ARC) tests whether a model can infer an unseen transformation from a few input-output examples and apply it to a new grid. Looped visual reasoners refine predictions over multiple iterations, but conventional training constrains only the final output, leaving intermediate refinements unconstrained. We propose that these refinements should instead follow the transformation step by step. We introduce TraceViT, a looped visual reasoner trained with semantically monotonic transformation chains. We obtain these chains by rewriting and verifying programmatic task implementations, decomposing each solution into intermediate grid states. Each iteration is grounded by a task reference derived from the few-shot demonstrations and an object workspace representing the current grid state. Because these chains may differ in length from the loop, soft trace alignment enforces only their ordering, letting the model allocate iterations freely. TraceViT achieves 67.8% pass@2 on ARC-AGI-1 and 24.3% on ARC-AGI-2. Controlled ablations on ARC-AGI-1 show that trace supervision becomes beneficial only when paired with grounding. Code and data will be available at https://github.com/LiuBinnan/TraceViT.", "arxiv_id": "2607.29586", "arxiv_url": "https://arxiv.org/abs/2607.29586", "authors": ["Binnan Liu", "Yechi Ma", "Tian Xie", "Wei Hua"], "brief": "\u672c\u6587\u63d0\u51fa TraceViT\uff0c\u7528\u7a0b\u5e8f\u5316\u4efb\u52a1\u5b9e\u73b0\u751f\u6210\u5e76\u9a8c\u8bc1\u9010\u6b65\u7f51\u683c\u53d8\u6362\u94fe\uff0c\u5bf9\u5faa\u73af\u89c6\u89c9\u63a8\u7406\u6a21\u578b\u7684\u4e2d\u95f4\u8fed\u4ee3\u8fdb\u884c\u6709\u4f9d\u636e\u7684\u8f68\u8ff9\u76d1\u7763\uff0c\u800c\u4e0d\u53ea\u7ea6\u675f\u6700\u7ec8\u7b54\u6848\u3002\u901a\u8fc7\u8f6f\u8f68\u8ff9\u5bf9\u9f50\u548c\u4efb\u52a1/\u5bf9\u8c61\u72b6\u6001 grounding\uff0c\u6a21\u578b\u5728 ARC-AGI-1 \u4e0a\u8fbe\u5230 67.8% pass@2\u3001ARC-AGI-2 \u4e0a\u8fbe\u5230 24.3%\uff0c\u6d88\u878d\u663e\u793a\u8f68\u8ff9\u76d1\u7763\u9700\u4e0e grounding \u7ed3\u5408\u624d\u6709\u6548\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29586", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u63a8\u7406", "\u62bd\u8c61\u63a8\u7406", "\u8f68\u8ff9\u76d1\u7763", "\u89c6\u89c9Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29586v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TraceViT: Grounded Trace Supervision for Visual Abstract Reasoning", "tldr": "\u672c\u6587\u63d0\u51fa TraceViT\uff0c\u7528\u7a0b\u5e8f\u5316\u4efb\u52a1\u5b9e\u73b0\u751f\u6210\u5e76\u9a8c\u8bc1\u9010\u6b65\u7f51\u683c\u53d8\u6362\u94fe\uff0c\u5bf9\u5faa\u73af\u89c6\u89c9\u63a8\u7406\u6a21\u578b\u7684\u4e2d\u95f4\u8fed\u4ee3\u8fdb\u884c\u6709\u4f9d\u636e\u7684\u8f68\u8ff9\u76d1\u7763\uff0c\u800c\u4e0d\u53ea\u7ea6\u675f\u6700\u7ec8\u7b54\u6848\u3002\u901a\u8fc7\u8f6f\u8f68\u8ff9\u5bf9\u9f50\u548c\u4efb\u52a1/\u5bf9\u8c61\u72b6\u6001 grounding\uff0c\u6a21\u578b\u5728 ARC-AGI-1 \u4e0a\u8fbe\u5230 67.8% pass@2\u3001ARC-AGI-2 \u4e0a\u8fbe\u5230 24.3%\uff0c\u6d88\u878d\u663e\u793a\u8f68\u8ff9\u76d1\u7763\u9700\u4e0e grounding \u7ed3\u5408\u624d\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Games and simulators make valuable benchmarks by turning decisions into measurable outcomes, but many current suites under-test rules-rich tactical reasoning: the ability to choose well when geometry, timing, resources, objectives, and rule interactions all matter at once. We introduce DungeonBench, a benchmark for tactical reasoning in Dungeons \u0026 Dragons combat, built to cover the vast majority of combat-relevant 2014 System Reference Document content whose effects can be resolved by the simulator while retaining mechanics that simplified combat simulators often abstract away. At each step, DungeonBench exposes a complete tactical observation, a pending decision, and an indexed list of executable options spanning movement, attacks, spells, reactions, objectives, preparation, and scarce resources. The task is to value legal choices whose consequences depend on action economy, creature traits, battlefield geometry, timing windows, and future encounters. DungeonBench has two tracks: Encounter, which evaluates local tactical play in single fights, and Day, which links encounters through persistent hit points, spell slots, consumables, preparation, and short-rest timing, forcing policies to trade off immediate tactical advantage against future survivability. The same engine-generated decision stream supports heuristic controllers, language-model policies, learned option rankers, and masked-action reinforcement-learning agents. We evaluate frontier language-model policies on this shared decision stream. Results show that full tactical observations do not saturate the benchmark: frontier policies often win direct encounters, but linked encounter days expose failures in resource budgeting, rest timing, and rule-aware tactical discipline.", "arxiv_id": "2607.29577", "arxiv_url": "https://arxiv.org/abs/2607.29577", "authors": ["Ismayil Ismayilov", "Atakan Kara", "Kaan Oktay"], "brief": "\u672c\u6587\u63d0\u51fa DungeonBench\uff0c\u4e00\u4e2a\u9762\u5411\u300a\u9f99\u4e0e\u5730\u4e0b\u57ce\u300b\u6218\u6597\u7684\u89c4\u5219\u5bc6\u96c6\u578b\u6218\u672f\u63a8\u7406\u57fa\u51c6\uff0c\u8986\u76d6\u79fb\u52a8\u3001\u653b\u51fb\u3001\u6cd5\u672f\u3001\u53cd\u5e94\u3001\u8d44\u6e90\u4e0e\u76ee\u6807\u7b49\u53ef\u6267\u884c\u51b3\u7b56\u3002\u8bc4\u6d4b\u663e\u793a\uff0c\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u5728\u5355\u573a\u906d\u9047\u4e2d\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u591a\u906d\u9047\u4e32\u8054\u7684\u201c\u5192\u9669\u65e5\u201d\u4e2d\u4ecd\u66b4\u9732\u51fa\u8d44\u6e90\u89c4\u5212\u3001\u4f11\u606f\u65f6\u673a\u548c\u89c4\u5219\u4e00\u81f4\u6027\u4e0d\u8db3\u7684\u95ee\u9898\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29577", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u6d4b\u8bd5", "\u6218\u672f\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29577v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DungeonBench: A Benchmark for Rules-Rich Tactical Reasoning in Dungeons \u0026 Dragons Combat", "tldr": "\u672c\u6587\u63d0\u51fa DungeonBench\uff0c\u4e00\u4e2a\u9762\u5411\u300a\u9f99\u4e0e\u5730\u4e0b\u57ce\u300b\u6218\u6597\u7684\u89c4\u5219\u5bc6\u96c6\u578b\u6218\u672f\u63a8\u7406\u57fa\u51c6\uff0c\u8986\u76d6\u79fb\u52a8\u3001\u653b\u51fb\u3001\u6cd5\u672f\u3001\u53cd\u5e94\u3001\u8d44\u6e90\u4e0e\u76ee\u6807\u7b49\u53ef\u6267\u884c\u51b3\u7b56\u3002\u8bc4\u6d4b\u663e\u793a\uff0c\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u5728\u5355\u573a\u906d\u9047\u4e2d\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u591a\u906d\u9047\u4e32\u8054\u7684\u201c\u5192\u9669\u65e5\u201d\u4e2d\u4ecd\u66b4\u9732\u51fa\u8d44\u6e90\u89c4\u5212\u3001\u4f11\u606f\u65f6\u673a\u548c\u89c4\u5219\u4e00\u81f4\u6027\u4e0d\u8db3\u7684\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Symbolic Regression (SR) aims to discover analytical equations from observational data and plays a central role in scientific modeling. While recent Large Language Model (LLM) based approaches show promise, they face two limitations. First, they lack data analysis mechanisms for uncovering variable dependencies, which reduces the efficiency of equation discovery. Second, most methods rely on single-objective evaluation focused solely on fitting error. This neglect of structural complexity and generalization often causes models to converge prematurely to local optima, limiting their ability to explore the broader equation space. We propose Multi-Objective Tool-augmented Symbolic Regression (MOT-SR), a unified framework that integrates external analytical tools to extract structural priors and guide equation generation, while jointly optimizing for accuracy, complexity, and generalization via a multi-objective evaluation module that maintains a dynamic Pareto front. MOT-SR employs two collaborative LLM modules: a Meta Strategy Generator, which selects tools and synthesizes structural optimization strategies based on Pareto-optimal equations, and an Equation Generator, which produces new candidate equations accordingly. The system operates in a closed-loop manner, continuously refining both strategies and equation structures. Across 40 standard tasks, MOT-SR outperforms existing SR methods in accuracy, generalization, and efficiency. We further validate MOT-SR on extreme mass-ratio inspiral (EMRI) orbital modeling, an important problem in space-based gravitational-wave astronomy where small local errors can accumulate substantially over long-term evolution. The discovered interpretable correction achieves the lowest trajectory-level integration error on held-out configurations. These results demonstrate the potential of MOT-SR to enable reliable modeling of long-horizon scientific dynamics.", "arxiv_id": "2607.29561", "arxiv_url": "https://arxiv.org/abs/2607.29561", "authors": ["Boxiao Wang", "Runxiang Wang", "Kai Li", "Chongming Li", "Zhiwei Chen", "Yifan Zhang", "Jian Cheng"], "brief": "\u63d0\u51fa MOT-SR\uff0c\u4e00\u4e2a\u5de5\u5177\u589e\u5f3a\u7684\u5927\u8bed\u8a00\u6a21\u578b\u7b26\u53f7\u56de\u5f52\u6846\u67b6\uff0c\u901a\u8fc7\u5916\u90e8\u5206\u6790\u5de5\u5177\u63d0\u53d6\u7ed3\u6784\u5148\u9a8c\uff0c\u5e76\u540c\u65f6\u4f18\u5316\u7cbe\u5ea6\u3001\u590d\u6742\u5ea6\u548c\u6cdb\u5316\u80fd\u529b\u3002\u5176\u572840\u4e2a\u6807\u51c6\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u7b26\u53f7\u56de\u5f52\u65b9\u6cd5\uff0c\u5e76\u5728\u5f15\u529b\u6ce2\u76f8\u5173\u7684 EMRI \u8f68\u9053\u5efa\u6a21\u4e2d\u53d1\u73b0\u53ef\u89e3\u91ca\u4fee\u6b63\uff0c\u53d6\u5f97\u6700\u4f4e\u957f\u671f\u8f68\u8ff9\u79ef\u5206\u8bef\u5dee\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29561", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7b26\u53f7\u56de\u5f52", "\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u591a\u76ee\u6807\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29561v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MOT-SR: Multi-Objective Tool-Augmented Scientific Equation Discovery with Large Language Models", "tldr": "\u63d0\u51fa MOT-SR\uff0c\u4e00\u4e2a\u5de5\u5177\u589e\u5f3a\u7684\u5927\u8bed\u8a00\u6a21\u578b\u7b26\u53f7\u56de\u5f52\u6846\u67b6\uff0c\u901a\u8fc7\u5916\u90e8\u5206\u6790\u5de5\u5177\u63d0\u53d6\u7ed3\u6784\u5148\u9a8c\uff0c\u5e76\u540c\u65f6\u4f18\u5316\u7cbe\u5ea6\u3001\u590d\u6742\u5ea6\u548c\u6cdb\u5316\u80fd\u529b\u3002\u5176\u572840\u4e2a\u6807\u51c6\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u7b26\u53f7\u56de\u5f52\u65b9\u6cd5\uff0c\u5e76\u5728\u5f15\u529b\u6ce2\u76f8\u5173\u7684 EMRI \u8f68\u9053\u5efa\u6a21\u4e2d\u53d1\u73b0\u53ef\u89e3\u91ca\u4fee\u6b63\uff0c\u53d6\u5f97\u6700\u4f4e\u957f\u671f\u8f68\u8ff9\u79ef\u5206\u8bef\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement Learning (RL) systems are typically trained using a single, well-specified scalar reward function. However, real-world decision-making tasks often involve multiple, competing objectives, such as performance versus efficiency, where ground-truth reward functions are difficult to specify or inaccessible. While Multi-Objective RL (MORL) addresses such trade-offs by modeling rewards as vectors, existing approaches typically assume access to a well-specified reward function for each objective, inheriting the same challenges faced by single-objective RL. Meanwhile, Preference-based RL (PbRL) has shown great potential in solving complex tasks without access to a pre-defined reward function through reward learning from human feedback, yet has largely been studied in single-objective settings. In this work, we bridge this gap with LEMUR: Learning to Align with Multi-Objective Reinforcement Learning with Preference feedback, a novel framework where an agent interactively learns from the preferences of multiple humans to learn optimal multi-objective policies. Our approach jointly learns policies and multiple objective-specific reward models from human feedback, enabling agents to effectively balance competing objectives during learning. We evaluate LEMUR on a variety of benchmark multi-objective tasks, and empirical results demonstrate its superior performance over baseline methods. Our method presents a promising direction for solving multi-objective decision-making tasks without pre-defined reward functions.", "arxiv_id": "2607.29559", "arxiv_url": "https://arxiv.org/abs/2607.29559", "authors": ["Manith Adikari", "Bei Peng", "Samuele Vinanzi", "Angelo Cangelosi"], "brief": "\u672c\u6587\u63d0\u51fa LEMUR\uff0c\u5c06\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u4e0e\u57fa\u4e8e\u504f\u597d\u7684\u5956\u52b1\u5b66\u4e60\u7ed3\u5408\uff0c\u8ba9\u667a\u80fd\u4f53\u4ece\u591a\u4e2a\u4eba\u7c7b\u504f\u597d\u53cd\u9988\u4e2d\u540c\u65f6\u5b66\u4e60\u591a\u4e2a\u76ee\u6807\u7684\u5956\u52b1\u6a21\u578b\u548c\u7b56\u7565\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u79cd\u591a\u76ee\u6807\u57fa\u51c6\u4efb\u52a1\u4e0a\u4f18\u4e8e\u57fa\u7ebf\u65b9\u6cd5\uff0c\u80fd\u5728\u65e0\u9884\u5b9a\u4e49\u5956\u52b1\u51fd\u6570\u65f6\u66f4\u597d\u5e73\u8861\u7ade\u4e89\u76ee\u6807\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29559", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u591a\u76ee\u6807\u4f18\u5316", "\u4eba\u7c7b\u53cd\u9988", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29559v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LEMUR: Learning to Align with Multi-Objective Reinforcement Learning from Preference Feedback", "tldr": "\u672c\u6587\u63d0\u51fa LEMUR\uff0c\u5c06\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u4e0e\u57fa\u4e8e\u504f\u597d\u7684\u5956\u52b1\u5b66\u4e60\u7ed3\u5408\uff0c\u8ba9\u667a\u80fd\u4f53\u4ece\u591a\u4e2a\u4eba\u7c7b\u504f\u597d\u53cd\u9988\u4e2d\u540c\u65f6\u5b66\u4e60\u591a\u4e2a\u76ee\u6807\u7684\u5956\u52b1\u6a21\u578b\u548c\u7b56\u7565\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u79cd\u591a\u76ee\u6807\u57fa\u51c6\u4efb\u52a1\u4e0a\u4f18\u4e8e\u57fa\u7ebf\u65b9\u6cd5\uff0c\u80fd\u5728\u65e0\u9884\u5b9a\u4e49\u5956\u52b1\u51fd\u6570\u65f6\u66f4\u597d\u5e73\u8861\u7ade\u4e89\u76ee\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Organizations increasingly define operational metrics in structured, machine-readable formats to monitor systems, processes, and compliance. These metric definitions implicitly encode domain knowledge, such as referencing concepts, properties, and relationships, that often extends what is captured in formal ontologies. Yet the connection between operational metric catalogues and ontological knowledge remains manual, ad-hoc, and labor-intensive. We present COntExt, a framework for context-aware ontology extension that takes structured metric definitions as input and suggests how referenced concepts and properties should be integrated into an existing ontology, utilizing the context of these metrics. The framework defines the extension problem as three sub-tasks: parent class prediction, relation type prediction, and data property assignment. Across four cybersecurity ontologies, we evaluate different algorithms for each task. Our results show that metric-derived context improves the suggestions over ontology-context baselines for relation type prediction and data property assignment. Our work demonstrates that operational metric catalogues are a practical and underexploited source for ontology extension. This work enables organizations to maintain their ontologies at a significantly lower cost than manual engineering.", "arxiv_id": "2607.29553", "arxiv_url": "https://arxiv.org/abs/2607.29553", "authors": ["Hussain Hussain", "Stefan Sch\u00f6berl", "Angelika Schneider", "Verena Geist"], "brief": "\u8bba\u6587\u63d0\u51fa COntExt \u6846\u67b6\uff0c\u4ece\u7ed3\u6784\u5316\u8fd0\u8425\u6307\u6807\u5b9a\u4e49\u4e2d\u6316\u6398\u4e0a\u4e0b\u6587\u4fe1\u606f\uff0c\u81ea\u52a8\u5efa\u8bae\u5982\u4f55\u5c06\u5176\u4e2d\u6d89\u53ca\u7684\u6982\u5ff5\u3001\u5c5e\u6027\u548c\u5173\u7cfb\u6269\u5c55\u5230\u73b0\u6709\u672c\u4f53\u4e2d\u3002\u5b9e\u9a8c\u5728\u56db\u4e2a\u7f51\u7edc\u5b89\u5168\u672c\u4f53\u4e0a\u9a8c\u8bc1\uff0c\u6307\u6807\u4e0a\u4e0b\u6587\u80fd\u63d0\u5347\u5173\u7cfb\u7c7b\u578b\u9884\u6d4b\u548c\u6570\u636e\u5c5e\u6027\u5206\u914d\u6548\u679c\uff0c\u4ece\u800c\u964d\u4f4e\u4eba\u5de5\u672c\u4f53\u7ef4\u62a4\u6210\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29553", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u672c\u4f53\u6269\u5c55", "\u77e5\u8bc6\u5de5\u7a0b", "\u7f51\u7edc\u5b89\u5168", "\u4e0a\u4e0b\u6587\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29553v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "COntExt: Towards Context-Aware Ontology Extension from Operational Metrics", "tldr": "\u8bba\u6587\u63d0\u51fa COntExt \u6846\u67b6\uff0c\u4ece\u7ed3\u6784\u5316\u8fd0\u8425\u6307\u6807\u5b9a\u4e49\u4e2d\u6316\u6398\u4e0a\u4e0b\u6587\u4fe1\u606f\uff0c\u81ea\u52a8\u5efa\u8bae\u5982\u4f55\u5c06\u5176\u4e2d\u6d89\u53ca\u7684\u6982\u5ff5\u3001\u5c5e\u6027\u548c\u5173\u7cfb\u6269\u5c55\u5230\u73b0\u6709\u672c\u4f53\u4e2d\u3002\u5b9e\u9a8c\u5728\u56db\u4e2a\u7f51\u7edc\u5b89\u5168\u672c\u4f53\u4e0a\u9a8c\u8bc1\uff0c\u6307\u6807\u4e0a\u4e0b\u6587\u80fd\u63d0\u5347\u5173\u7cfb\u7c7b\u578b\u9884\u6d4b\u548c\u6570\u636e\u5c5e\u6027\u5206\u914d\u6548\u679c\uff0c\u4ece\u800c\u964d\u4f4e\u4eba\u5de5\u672c\u4f53\u7ef4\u62a4\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Standard AI-text detection benchmarks compare human-written text against text generated directly by large language models (LLMs). While prior work has shown that rewriting and paraphrasing can degrade detector performance, it remains unclear whether performance measured on this conventional benchmark predicts detector behavior when human-authored content is rewritten by an LLM. To address this gap, we introduce Authorship-Rewriting Benchmark (ARB), built from 1,800 human source texts (600 each from XSum, WritingPrompts, and OpenWebText) and four open-weight generators (Llama-3.2-3B, Qwen2.5-7B, Mistral-7B, Gemma-2-9B). Each source item yields four matched variants: human-written (HUMAN), direct LLM generation (Free-LLM), LLM-rewritten human text (H2L), and same-generator LLM-rewritten LLM text (LLM2L). We evaluated five detectors (FastDetectGPT, Binoculars-falcon-7b, RADAR, BERT-Defense, RoBERTa-Defense) at a strict 1%-false-positive operating point (TPR@1%FPR). FastDetectGPT and Binoculars-falcon-7b detected 91.2% and 93.5\\% of direct LLM text, but only 30.8% and 15.1% of human text an LLM had rewritten, a drop of 60-78 percentage points. The same detectors retained 78.3% and 83.0% recall when LLM text was rewritten by the same model, a much smaller decline of 10-13 points. RADAR followed the same pattern (66.8% to 12.2%), while BERT-Defense and RoBERTa-Defense stayed below 3% recall across all regimes. These results show that detector performance measured on the conventional human-vs-LLM benchmark does not transfer to human-authored text revised by an LLM, even though the same detectors remain largely robust to LLM-only rewriting.", "arxiv_id": "2607.29539", "arxiv_url": "https://arxiv.org/abs/2607.29539", "authors": ["Gaetano Perrone", "Simon Pietro Romano"], "brief": "\u8bba\u6587\u63d0\u51fa ARB\uff0c\u4e00\u4e2a\u5339\u914d\u5f0f\u201c\u4f5c\u8005\u8eab\u4efd-\u91cd\u5199\u201d\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 AI \u6587\u672c\u68c0\u6d4b\u5668\u5728 LLM \u6539\u5199\u4eba\u7c7b\u6587\u672c\u573a\u666f\u4e0b\u7684\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u591a\u6570\u68c0\u6d4b\u5668\u80fd\u8f83\u597d\u8bc6\u522b\u76f4\u63a5\u751f\u6210\u7684 LLM \u6587\u672c\uff0c\u4f46\u5bf9 LLM \u6539\u5199\u7684\u4eba\u7c7b\u6587\u672c\u53ec\u56de\u7387\u5927\u5e45\u4e0b\u964d\uff0c\u8bf4\u660e\u4f20\u7edf\u4eba\u7c7b\u6587\u672c vs LLM \u6587\u672c\u57fa\u51c6\u4e0d\u80fd\u9884\u6d4b\u771f\u5b9e\u6539\u5199\u573a\u666f\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29539", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u6587\u672c\u68c0\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u6539\u5199", "\u57fa\u51c6\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29539v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ARB: A Matched Authorship-Rewriting Benchmark Dataset for AI-Text Detector Evaluation", "tldr": "\u8bba\u6587\u63d0\u51fa ARB\uff0c\u4e00\u4e2a\u5339\u914d\u5f0f\u201c\u4f5c\u8005\u8eab\u4efd-\u91cd\u5199\u201d\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 AI \u6587\u672c\u68c0\u6d4b\u5668\u5728 LLM \u6539\u5199\u4eba\u7c7b\u6587\u672c\u573a\u666f\u4e0b\u7684\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u591a\u6570\u68c0\u6d4b\u5668\u80fd\u8f83\u597d\u8bc6\u522b\u76f4\u63a5\u751f\u6210\u7684 LLM \u6587\u672c\uff0c\u4f46\u5bf9 LLM \u6539\u5199\u7684\u4eba\u7c7b\u6587\u672c\u53ec\u56de\u7387\u5927\u5e45\u4e0b\u964d\uff0c\u8bf4\u660e\u4f20\u7edf\u4eba\u7c7b\u6587\u672c vs LLM \u6587\u672c\u57fa\u51c6\u4e0d\u80fd\u9884\u6d4b\u771f\u5b9e\u6539\u5199\u573a\u666f\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI coding agents are generating code at volumes that exceed the capacity of traditional peer review. At the same time, existing AI code review tools over-index on low-value suggestions such as style and best practices while under-indexing on the concerns human reviewers prioritize most: correctness, security, and performance. We present ARCTIC, an AI-powered Code Critique system that reframes code review around three capabilities: intent prediction, which infers why a change was made from conversation logs and metadata; drift detection, which measures divergence between the developer\u0027s intent and the agent\u0027s output via backtranslation; and code spotlight, which ranks the regions of a diff most warranting human scrutiny. We ground these capabilities in a six-theme taxonomy derived from 18,000 code reviews. Offline evaluation shows that intent prediction achieves 0.86 F1, drift detection reaches near-perfect ordinal agreement with human annotators (QWK = 0.907), and spotlight outperforms the baseline AI reviewer by 2.4x on quality estimation at 5x fewer tokens. In the experimental rollout, the drift scores reduces code misalignment by an additional 5.76 points (p = 0.026), intent prediction receives 90.2% approval, and zero defects have been attributed to self-reviewed diffs since launch.", "arxiv_id": "2607.29516", "arxiv_url": "https://arxiv.org/abs/2607.29516", "authors": ["Chandra Maddila", "Mashrur Rashik", "Euna Mehnaz Khan", "Smriti Jha", "James Saindon", "Nachi Nagappan", "Peter C. Rigby"], "brief": "\u672c\u6587\u63d0\u51fa ARCTIC\uff0c\u5c06 AI \u751f\u6210\u4ee3\u7801\u7684\u8bc4\u5ba1\u4ece\u4f20\u7edf\u4ee3\u7801\u5ba1\u67e5\u8f6c\u4e3a\u4ee3\u7801\u6279\u5224\uff0c\u5305\u542b\u610f\u56fe\u9884\u6d4b\u3001\u504f\u79fb\u68c0\u6d4b\u548c\u91cd\u70b9\u4ee3\u7801\u5b9a\u4f4d\u4e09\u9879\u80fd\u529b\u3002\u79bb\u7ebf\u8bc4\u4f30\u4e2d\u610f\u56fe\u9884\u6d4b F1 \u8fbe 0.86\uff0c\u504f\u79fb\u68c0\u6d4b\u4e0e\u4eba\u5de5\u9ad8\u5ea6\u4e00\u81f4\uff0c\u91cd\u70b9\u5b9a\u4f4d\u5728\u66f4\u5c11 token \u4e0b\u6bd4\u57fa\u7ebf AI \u5ba1\u67e5\u5668\u6548\u679c\u63d0\u5347 2.4 \u500d\uff0c\u7ebf\u4e0a\u4e5f\u51cf\u5c11\u4e86\u4ee3\u7801\u610f\u56fe\u4e0d\u4e00\u81f4\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29516", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u5ba1\u67e5", "\u8f6f\u4ef6\u5de5\u7a0b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29516v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Code Review to Code Critique: Intent, Drift, and Spotlight for AI-Generated Diffs at Scale", "tldr": "\u672c\u6587\u63d0\u51fa ARCTIC\uff0c\u5c06 AI \u751f\u6210\u4ee3\u7801\u7684\u8bc4\u5ba1\u4ece\u4f20\u7edf\u4ee3\u7801\u5ba1\u67e5\u8f6c\u4e3a\u4ee3\u7801\u6279\u5224\uff0c\u5305\u542b\u610f\u56fe\u9884\u6d4b\u3001\u504f\u79fb\u68c0\u6d4b\u548c\u91cd\u70b9\u4ee3\u7801\u5b9a\u4f4d\u4e09\u9879\u80fd\u529b\u3002\u79bb\u7ebf\u8bc4\u4f30\u4e2d\u610f\u56fe\u9884\u6d4b F1 \u8fbe 0.86\uff0c\u504f\u79fb\u68c0\u6d4b\u4e0e\u4eba\u5de5\u9ad8\u5ea6\u4e00\u81f4\uff0c\u91cd\u70b9\u5b9a\u4f4d\u5728\u66f4\u5c11 token \u4e0b\u6bd4\u57fa\u7ebf AI \u5ba1\u67e5\u5668\u6548\u679c\u63d0\u5347 2.4 \u500d\uff0c\u7ebf\u4e0a\u4e5f\u51cf\u5c11\u4e86\u4ee3\u7801\u610f\u56fe\u4e0d\u4e00\u81f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement-learning-based quantum architecture search (RL-QAS) repeatedly optimizes a variational quantum eigensolver (VQE) after extending a circuit, although circuit construction and action legality are deterministic and known. We introduce DreamQAS, a model-based RL framework that preserves these exact circuit dynamics and learns only the expensive post-VQE feedback. A recurrent randomized-prior ensemble predicts an oracle-free score relative to an empirical energy frontier and supports multi-step imagined policy learning over explicit legal circuits. Ranking-based activation, uncertainty-aware pessimism and truncation, and selective real-VQE verification form a reliability-controlled learning loop. Under a common 15,000-episode budget and frozen evaluation for the RL methods, DreamQAS has the lowest mean frozen-policy energy error on four of five molecular tasks and the second-lowest on one. At fine-error targets reached by all seeds of both methods, it uses 1.6x to 2.0x fewer real VQE calls on four tasks and 10.6x fewer on BeH2-8q. Counterfactual action-ranking utility increases across all five tasks, with a mean increase of 0.346 and a 95 percent confidence interval of [0.185, 0.507], while direct greedy and beam use of the same model does not recover the gains of imagined policy learning. Ensemble disagreement also improves risk-coverage over random rejection on all three probed tasks. These results establish a world-model design for QAS whose value lies in decision-useful feedback rather than exact energy prediction.", "arxiv_id": "2607.29491", "arxiv_url": "https://arxiv.org/abs/2607.29491", "authors": ["Jiayang Niu", "Yan Wang", "Jie Li", "Ke Deng", "Azadeh Alavi", "Muhammad Usman", "Yongli Ren"], "brief": "DreamQAS \u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u91cf\u5b50\u67b6\u6784\u641c\u7d22\u7684\u57fa\u4e8e\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4fdd\u7559\u786e\u5b9a\u6027\u7684\u91cf\u5b50\u7535\u8def\u52a8\u6001\uff0c\u53ea\u5b66\u4e60\u6602\u8d35\u7684 VQE \u53cd\u9988\uff0c\u5e76\u901a\u8fc7\u96c6\u6210\u4e0d\u786e\u5b9a\u6027\u3001\u60b2\u89c2\u8bc4\u4f30\u548c\u9009\u62e9\u6027\u771f\u5b9e\u9a8c\u8bc1\u63a7\u5236\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u6570\u5206\u5b50\u4efb\u52a1\u4e0a\u53d6\u5f97\u66f4\u4f4e\u7684\u51bb\u7ed3\u7b56\u7565\u80fd\u91cf\u8bef\u5dee\uff0c\u5e76\u5728\u8fbe\u5230\u7cbe\u7ec6\u8bef\u5dee\u76ee\u6807\u65f6\u663e\u8457\u51cf\u5c11\u771f\u5b9e VQE \u8c03\u7528\uff0c\u6700\u9ad8\u53ef\u51cf\u5c11 10.6 \u500d\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29491", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u4e16\u754c\u6a21\u578b", "\u91cf\u5b50\u67b6\u6784\u641c\u7d22", "\u53d8\u5206\u91cf\u5b50\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29491v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DreamQAS: Learning a Decision-Useful World Model for VQE-Efficient Quantum Architecture Search", "tldr": "DreamQAS \u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u91cf\u5b50\u67b6\u6784\u641c\u7d22\u7684\u57fa\u4e8e\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u4fdd\u7559\u786e\u5b9a\u6027\u7684\u91cf\u5b50\u7535\u8def\u52a8\u6001\uff0c\u53ea\u5b66\u4e60\u6602\u8d35\u7684 VQE \u53cd\u9988\uff0c\u5e76\u901a\u8fc7\u96c6\u6210\u4e0d\u786e\u5b9a\u6027\u3001\u60b2\u89c2\u8bc4\u4f30\u548c\u9009\u62e9\u6027\u771f\u5b9e\u9a8c\u8bc1\u63a7\u5236\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u6570\u5206\u5b50\u4efb\u52a1\u4e0a\u53d6\u5f97\u66f4\u4f4e\u7684\u51bb\u7ed3\u7b56\u7565\u80fd\u91cf\u8bef\u5dee\uff0c\u5e76\u5728\u8fbe\u5230\u7cbe\u7ec6\u8bef\u5dee\u76ee\u6807\u65f6\u663e\u8457\u51cf\u5c11\u771f\u5b9e VQE \u8c03\u7528\uff0c\u6700\u9ad8\u53ef\u51cf\u5c11 10.6 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large-scale multivariate time series from heterogeneous IoT sensors demand accurate long-term forecasting for resource scheduling and predictive maintenance. While recent time series foundation models exhibit strong generalization, they rely on static parametric knowledge and lack dynamic access to external historical patterns during inference. Retrieval-Augmented Generation (RAG) offers a potential remedy, yet its application to time series forecasting is challenged by magnitude variations across heterogeneous sources and the mismatch between historical similarity and future consistency. We propose CrossRAG, a retrieval-augmented forecasting framework that integrates Shape-Aware Memory (SAM) with RevIN normalization for magnitude-robust shape-level retrieval, Future-Consistent Contrastive (FCC) learning to distinguish informative references from hard negatives with similar history but divergent futures, and Cross-Attention Temporal Fusion (CATF) to fuse retrieved historical--future reference pairs into the backbone\u0027s representations at the representation level. Experiments on seven public benchmarks show that CrossRAG consistently outperforms both parametric-only baselines and existing retrieval-augmented forecasting methods.", "arxiv_id": "2607.29459", "arxiv_url": "https://arxiv.org/abs/2607.29459", "authors": ["Yu Sun", "Yuan Chang", "Xiaohou Shi", "Yan Sun"], "brief": "\u8bba\u6587\u63d0\u51fa CrossRAG \u68c0\u7d22\u589e\u5f3a\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u6846\u67b6\uff0c\u7528\u5f62\u72b6\u611f\u77e5\u8bb0\u5fc6\u4e0e RevIN \u505a\u5e45\u503c\u9c81\u68d2\u7684\u5386\u53f2\u5f62\u72b6\u68c0\u7d22\uff0c\u5e76\u901a\u8fc7\u672a\u6765\u4e00\u81f4\u6027\u5bf9\u6bd4\u5b66\u4e60\u7b5b\u9009\u771f\u6b63\u6709\u7528\u7684\u53c2\u8003\u5e8f\u5217\u3002\u5176\u8de8\u6ce8\u610f\u529b\u65f6\u5e8f\u878d\u5408\u6a21\u5757\u5c06\u68c0\u7d22\u5230\u7684\u5386\u53f2-\u672a\u6765\u53c2\u8003\u5bf9\u6ce8\u5165\u9884\u6d4b\u6a21\u578b\uff0c\u57287\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u4f18\u4e8e\u7eaf\u53c2\u6570\u6a21\u578b\u548c\u5df2\u6709\u68c0\u7d22\u589e\u5f3a\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29459", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u68c0\u7d22\u589e\u5f3a", "\u5bf9\u6bd4\u5b66\u4e60", "\u7269\u8054\u7f51"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29459v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TFGformer: Multivariate Time Series Forecasting via Time-Frequency Graph Learning and Covariate Fusion", "tldr": "\u8bba\u6587\u63d0\u51fa CrossRAG \u68c0\u7d22\u589e\u5f3a\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u6846\u67b6\uff0c\u7528\u5f62\u72b6\u611f\u77e5\u8bb0\u5fc6\u4e0e RevIN \u505a\u5e45\u503c\u9c81\u68d2\u7684\u5386\u53f2\u5f62\u72b6\u68c0\u7d22\uff0c\u5e76\u901a\u8fc7\u672a\u6765\u4e00\u81f4\u6027\u5bf9\u6bd4\u5b66\u4e60\u7b5b\u9009\u771f\u6b63\u6709\u7528\u7684\u53c2\u8003\u5e8f\u5217\u3002\u5176\u8de8\u6ce8\u610f\u529b\u65f6\u5e8f\u878d\u5408\u6a21\u5757\u5c06\u68c0\u7d22\u5230\u7684\u5386\u53f2-\u672a\u6765\u53c2\u8003\u5bf9\u6ce8\u5165\u9884\u6d4b\u6a21\u578b\uff0c\u57287\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u4f18\u4e8e\u7eaf\u53c2\u6570\u6a21\u578b\u548c\u5df2\u6709\u68c0\u7d22\u589e\u5f3a\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Infrared vision-language models (IR-VLMs) extend thermal perception to open-vocabulary classification, image captioning, and visual question answering. However, their robustness to structured thermal perturbations and the stability of cross-modal semantic alignment remain insufficiently studied. We propose QR-Structured Thermal Triggers (QR-STT), a stealthy, training-free, black-box framework for targeted semantic steering of IR-VLMs. QR-STT preserves the functional regions of a QR pattern while optimizing its internal modules, each of which is assigned a cold, neutral, or hot thermal state. The framework jointly searches module topology and rendering parameters, including position, scale, rotation, intensity, blur, and roundness. A three-stage gradient-free procedure with greedy module-flip refinement efficiently handles the mixed discrete and continuous search space. The objective promotes alignment with an attacker-selected target, suppresses source-class evidence, and regularizes QR structure and visual similarity. Experiments on multiple CLIP-style encoders show that QR-STT consistently redirects image-text alignment toward chosen concepts while maintaining visual stealth. Perturbations optimized for classification also transfer to image captioning and VQA, causing target-consistent semantic drift in generated outputs. These results identify QR-structured thermal patterns as an interpretable attack surface for language-driven infrared perception and highlight the need for robustness evaluation against structured cross-task semantic attacks.", "arxiv_id": "2607.29445", "arxiv_url": "https://arxiv.org/abs/2607.29445", "authors": ["Xiang Chen", "Yingying Zhao", "Chao Li", "Jiaju Han", "Ben Zhang", "Ang Li", "Jiahuan Long", "Yiwei Wei", "Jiujiang Guo", "Chengyin Hu"], "brief": "\u63d0\u51fa QR-Structured Thermal Triggers\uff08QR-STT\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u3001\u9ed1\u76d2\u7684\u7ed3\u6784\u5316\u70ed\u89e6\u53d1\u653b\u51fb\u65b9\u6cd5\uff0c\u901a\u8fc7\u4f18\u5316\u4e8c\u7ef4\u7801\u6837\u5f0f\u70ed\u56fe\u6848\u6765\u5b9a\u5411\u64cd\u63a7\u7ea2\u5916\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u8bed\u4e49\u5bf9\u9f50\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u5728\u4fdd\u6301\u89c6\u89c9\u9690\u853d\u6027\u7684\u540c\u65f6\uff0c\u5c06\u56fe\u6587\u5339\u914d\u5f15\u5411\u653b\u51fb\u8005\u6307\u5b9a\u6982\u5ff5\uff0c\u5e76\u53ef\u4ece\u5206\u7c7b\u8fc1\u79fb\u5230\u56fe\u50cf\u63cf\u8ff0\u548c\u89c6\u89c9\u95ee\u7b54\u4efb\u52a1\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29445", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ea2\u5916\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5bf9\u6297\u653b\u51fb", "\u591a\u6a21\u6001", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29445v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QR-Structured Thermal Triggers for Targeted Semantic Attacks on Infrared Vision-Language Models", "tldr": "\u63d0\u51fa QR-Structured Thermal Triggers\uff08QR-STT\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u3001\u9ed1\u76d2\u7684\u7ed3\u6784\u5316\u70ed\u89e6\u53d1\u653b\u51fb\u65b9\u6cd5\uff0c\u901a\u8fc7\u4f18\u5316\u4e8c\u7ef4\u7801\u6837\u5f0f\u70ed\u56fe\u6848\u6765\u5b9a\u5411\u64cd\u63a7\u7ea2\u5916\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u8bed\u4e49\u5bf9\u9f50\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u5728\u4fdd\u6301\u89c6\u89c9\u9690\u853d\u6027\u7684\u540c\u65f6\uff0c\u5c06\u56fe\u6587\u5339\u914d\u5f15\u5411\u653b\u51fb\u8005\u6307\u5b9a\u6982\u5ff5\uff0c\u5e76\u53ef\u4ece\u5206\u7c7b\u8fc1\u79fb\u5230\u56fe\u50cf\u63cf\u8ff0\u548c\u89c6\u89c9\u95ee\u7b54\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models increasingly generate optimization models from natural language, but existing evaluation often reduces a generated model and its ground truth to a single equivalent/not-equivalent verdict or an execution-success rate--labels that are neither independently checkable nor faithful to the multiple distinct senses in which two formulations can agree. We present ModelEquivBench, a certifying, multi-relational evaluation system that reports a per-pair semantic profile E0--E6: model construction and exact ingestion (E0), verified representation alignment (E1), same-space and projected feasible-set relations (E2, E3), objective-order equivalence (E4), optimal-value equality (E5), and optimizer-set equivalence (E6). Each decided entry carries relation-appropriate, independently re-checkable evidence: replayable traces or explicit maps for E0--E1, exact-rational certificates for positive E2--E6 conclusions, and explicit witnesses for supported negatives. Incomplete mapping search, unsupported structure, and resource limits produce typed UNKNOWN or N/A outcomes rather than guesses, while unmet prerequisites are reported as ABSENT. Using ModelEquivBench to evaluate three model snapshots--GPT-5.4, Claude Sonnet 4.6, and Qwen3.5-397B-A17B--on the same frozen cohort of 173 base problems (346 cells per model) under a no-repair protocol, the resulting profiles expose distinctions that coarse baselines do not represent: 49, 35, and 25 cells contain executable candidates that are nevertheless certified negative on at least one supported relation, and 25, 8, and 18 structural rejections occur on pairs for which E2 certifies mapped feasible-set equality under a verified map. The three model snapshots fail at different stages of the profile and therefore cannot be meaningfully reduced to a single accuracy score.", "arxiv_id": "2607.29431", "arxiv_url": "https://arxiv.org/abs/2607.29431", "authors": ["Penglin Zhu", "Jungang Xu"], "brief": "\u8bba\u6587\u63d0\u51fa ModelEquivBench\uff0c\u7528\u4e8e\u5bf9\u5927\u6a21\u578b\u751f\u6210\u7684\u4f18\u5316\u6a21\u578b\u8fdb\u884c\u53ef\u8ba4\u8bc1\u7684\u591a\u5173\u7cfb\u8bc4\u6d4b\uff0c\u4e0d\u518d\u53ea\u7ed9\u51fa\u7b49\u4ef7/\u4e0d\u7b49\u4ef7\u6216\u80fd\u5426\u6267\u884c\u7684\u7c97\u7c92\u5ea6\u7ed3\u679c\u3002\u5b83\u6309 E0-E6 \u8f93\u51fa\u4ece\u6a21\u578b\u6784\u5efa\u3001\u8868\u793a\u5bf9\u9f50\u3001\u53ef\u884c\u57df\u3001\u76ee\u6807\u5e8f\u3001\u6700\u4f18\u503c\u5230\u6700\u4f18\u89e3\u96c6\u7684\u8bed\u4e49\u753b\u50cf\uff0c\u5e76\u4e3a\u7ed3\u8bba\u63d0\u4f9b\u53ef\u590d\u67e5\u8bc1\u636e\uff1b\u5728\u8bc4\u6d4b GPT\u3001Claude\u3001Qwen \u7b49\u6a21\u578b\u65f6\u63ed\u793a\u4e86\u8bb8\u591a\u6267\u884c\u6210\u529f\u4f46\u8bed\u4e49\u4e0d\u7b49\u4ef7\u7684\u6848\u4f8b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29431", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4f18\u5316\u5efa\u6a21", "\u6a21\u578b\u8bc4\u6d4b", "\u5f62\u5f0f\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29431v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ModelEquivBench: Certifying Multi-Relational Evaluation of LLM-Generated Optimization Models", "tldr": "\u8bba\u6587\u63d0\u51fa ModelEquivBench\uff0c\u7528\u4e8e\u5bf9\u5927\u6a21\u578b\u751f\u6210\u7684\u4f18\u5316\u6a21\u578b\u8fdb\u884c\u53ef\u8ba4\u8bc1\u7684\u591a\u5173\u7cfb\u8bc4\u6d4b\uff0c\u4e0d\u518d\u53ea\u7ed9\u51fa\u7b49\u4ef7/\u4e0d\u7b49\u4ef7\u6216\u80fd\u5426\u6267\u884c\u7684\u7c97\u7c92\u5ea6\u7ed3\u679c\u3002\u5b83\u6309 E0-E6 \u8f93\u51fa\u4ece\u6a21\u578b\u6784\u5efa\u3001\u8868\u793a\u5bf9\u9f50\u3001\u53ef\u884c\u57df\u3001\u76ee\u6807\u5e8f\u3001\u6700\u4f18\u503c\u5230\u6700\u4f18\u89e3\u96c6\u7684\u8bed\u4e49\u753b\u50cf\uff0c\u5e76\u4e3a\u7ed3\u8bba\u63d0\u4f9b\u53ef\u590d\u67e5\u8bc1\u636e\uff1b\u5728\u8bc4\u6d4b GPT\u3001Claude\u3001Qwen \u7b49\u6a21\u578b\u65f6\u63ed\u793a\u4e86\u8bb8\u591a\u6267\u884c\u6210\u529f\u4f46\u8bed\u4e49\u4e0d\u7b49\u4ef7\u7684\u6848\u4f8b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In reinforcement learning, exploration with sparse and delayed rewards presents a significant challenge due to the limited feedback available for guiding the learning process. Addressing this issue requires extensive exploration in the state space to discover valuable reward signals. In this paper, we propose Entropic Information for Exploration (ENTINEX), a novel method that enhances exploration by incentivizing agents to explore beyond the boundaries of the state distribution. ENTINEX achieves this by assigning intrinsic rewards to these boundaries, leveraging entropic information to identify them effectively. Through extensive experimentation, we demonstrate that ENTINEX consistently improves exploration performance in environments characterized by sparse and delayed rewards. Our experimental results show that ENTINEX outperforms existing exploration methods, highlighting its effectiveness in both sparse and delayed reward scenarios.", "arxiv_id": "2607.29419", "arxiv_url": "https://arxiv.org/abs/2607.29419", "authors": ["Bumgeun Park", "Donghwan Lee"], "brief": "\u8bba\u6587\u63d0\u51fa ENTINEX\uff0c\u4e00\u79cd\u9762\u5411\u7a00\u758f\u548c\u5ef6\u8fdf\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u7684\u63a2\u7d22\u65b9\u6cd5\uff0c\u901a\u8fc7\u71b5\u4fe1\u606f\u8bc6\u522b\u72b6\u6001\u5206\u5e03\u8fb9\u754c\uff0c\u5e76\u5728\u8fb9\u754c\u5904\u7ed9\u4e88\u5185\u5728\u5956\u52b1\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u6301\u7eed\u63d0\u5347\u63a2\u7d22\u6548\u7387\uff0c\u5e76\u4f18\u4e8e\u5df2\u6709\u63a2\u7d22\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29419", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u63a2\u7d22", "\u5185\u5728\u5956\u52b1", "\u71b5\u4fe1\u606f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29419v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Explore Beyond the Boundary Using Entropic Information", "tldr": "\u8bba\u6587\u63d0\u51fa ENTINEX\uff0c\u4e00\u79cd\u9762\u5411\u7a00\u758f\u548c\u5ef6\u8fdf\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u7684\u63a2\u7d22\u65b9\u6cd5\uff0c\u901a\u8fc7\u71b5\u4fe1\u606f\u8bc6\u522b\u72b6\u6001\u5206\u5e03\u8fb9\u754c\uff0c\u5e76\u5728\u8fb9\u754c\u5904\u7ed9\u4e88\u5185\u5728\u5956\u52b1\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u6301\u7eed\u63d0\u5347\u63a2\u7d22\u6548\u7387\uff0c\u5e76\u4f18\u4e8e\u5df2\u6709\u63a2\u7d22\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Dynamic contrast-enhanced magnetic resonance imaging (DCE-MRI) is essential for breast cancer management, but reliance on gadolinium-based contrast agents (GBCAs) restricts use in contraindicated populations, prolongs scan protocols, and presents environmental toxicity concerns. Contrast synthesis offers a non-invasive alternative; however, existing approaches struggle to balance spatial realism with temporal continuity, suffer from slow iterative sampling, underutilize structural priors, and lack clinical validation. We propose a novel conditioned latent transport framework that predicts contrast enhancement in a single forward pass. By anchoring the latent trajectory to the pre-contrast anatomy and applying continuous time conditioning, the model synthesizes patient-specific contrast evolution at any acquisition time. The proposed approach outperforms baseline and the state-of-the-art models across spatial, perceptual, temporal, and distributional metrics. Evaluated on an independent external cohort, the method demonstrates robustness to domain shifts induced by scanner noise as well as differing acquisition protocol. Furthermore, our synthetic contrast enhancement significantly improved downstream tumor segmentation performance, yielding a 22.4% relative increase in Dice coefficient (0.60 vs. 0.49 baseline pre-contrast, p \u003c 0.01), reducing boundary segmentation error by over 39%, while outperforming all other generative model baselines. Finally, a reader study involving four breast radiologists evaluated the image quality, kinetic fidelity, and diagnostic viability of our synthesized sequences across 40 randomly selected cases. The results demonstrated that in 70% of cases, synthesized images provided sufficient clinical information to support the same management decisions as real DCE-MRI, suggesting a path toward safer and faster contrast-free or contrast-reduced imaging workflows.", "arxiv_id": "2607.29394", "arxiv_url": "https://arxiv.org/abs/2607.29394", "authors": ["Smriti Joshi", "Apostolia Tsirikoglou", "Daniel M. Lang", "Richard Osuala", "Noah M\u00e1rquez Varaa", "Alejandro Guzman", "Grzegorz Skorupko", "Sebastian Ibarra Arregui", "Lidia Garrucho", "Akane Ohashi", "Dimitra Ntoula", "Eugen Divjak", "O\u011fuz Lafc\u0131", "Jan C. Peeken", "Julia A. Schnabel", "Fredrik Strand", "Oliver Diaz", "Karim Lekadir"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u6761\u4ef6\u5316\u6f5c\u5728\u4f20\u8f93\u6846\u67b6\uff0c\u7528\u5355\u6b21\u524d\u5411\u4f20\u64ad\u4ece\u4e73\u817aMRI\u975e\u589e\u5f3a\u56fe\u50cf\u5408\u6210\u4efb\u610f\u65f6\u95f4\u70b9\u7684\u52a8\u6001\u589e\u5f3a\u5bf9\u6bd4\u5e8f\u5217\uff0c\u517c\u987e\u7a7a\u95f4\u771f\u5b9e\u611f\u4e0e\u65f6\u95f4\u8fde\u7eed\u6027\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u9879\u56fe\u50cf\u8d28\u91cf\u4e0e\u65f6\u5e8f\u6307\u6807\u4e0a\u4f18\u4e8e\u73b0\u6709\u751f\u6210\u6a21\u578b\uff0c\u5e76\u5728\u5916\u90e8\u961f\u5217\u4e2d\u8868\u73b0\u51fa\u8f83\u5f3a\u9c81\u68d2\u6027\uff1b\u5408\u6210\u589e\u5f3a\u56fe\u50cf\u8fd8\u5c06\u80bf\u7624\u5206\u5272Dice\u76f8\u5bf9\u63d0\u534722.4%\uff0c\u653e\u5c04\u79d1\u533b\u751f\u7814\u7a76\u663e\u793a70%\u75c5\u4f8b\u53ef\u652f\u6301\u4e0e\u771f\u5b9eDCE-MRI\u76f8\u540c\u7684\u7ba1\u7406\u51b3\u7b56\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29394", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u751f\u6210\u6a21\u578b", "\u78c1\u5171\u632f\u6210\u50cf", "\u80bf\u7624\u5206\u5272"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29394v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Dense Temporal Contrast Synthesis via Conditioned Latent Transport", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u6761\u4ef6\u5316\u6f5c\u5728\u4f20\u8f93\u6846\u67b6\uff0c\u7528\u5355\u6b21\u524d\u5411\u4f20\u64ad\u4ece\u4e73\u817aMRI\u975e\u589e\u5f3a\u56fe\u50cf\u5408\u6210\u4efb\u610f\u65f6\u95f4\u70b9\u7684\u52a8\u6001\u589e\u5f3a\u5bf9\u6bd4\u5e8f\u5217\uff0c\u517c\u987e\u7a7a\u95f4\u771f\u5b9e\u611f\u4e0e\u65f6\u95f4\u8fde\u7eed\u6027\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u9879\u56fe\u50cf\u8d28\u91cf\u4e0e\u65f6\u5e8f\u6307\u6807\u4e0a\u4f18\u4e8e\u73b0\u6709\u751f\u6210\u6a21\u578b\uff0c\u5e76\u5728\u5916\u90e8\u961f\u5217\u4e2d\u8868\u73b0\u51fa\u8f83\u5f3a\u9c81\u68d2\u6027\uff1b\u5408\u6210\u589e\u5f3a\u56fe\u50cf\u8fd8\u5c06\u80bf\u7624\u5206\u5272Dice\u76f8\u5bf9\u63d0\u534722.4%\uff0c\u653e\u5c04\u79d1\u533b\u751f\u7814\u7a76\u663e\u793a70%\u75c5\u4f8b\u53ef\u652f\u6301\u4e0e\u771f\u5b9eDCE-MRI\u76f8\u540c\u7684\u7ba1\u7406\u51b3\u7b56\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cross-lingual transfer is central to low-resource machine translation, but its behavior within closely related language families remains insufficiently characterized. We study transfer among five Turkic languages; Turkish, Azerbaijani, Uzbek, Kazakh, and Kyrgyz; using pairwise transfer matrices. In this setting, each model is fine-tuned with one transfer source and evaluated on a different transfer target while the translation target remains the same. Across mT5 experiments, we find that transfer is strongest between closely related Turkic pairs, especially Turkish-Azerbaijani and Kazakh-Kyrgyz. We also show that transfer direction matters, and that the same transfer source-transfer target pair can behave differently when the translation target changes. Latinization improves BLEU and chrF in several script-mismatched settings, but its effect is not uniform across metrics. Additional analyses show that transfer sources are mostly stable across different datasets and model settings.", "arxiv_id": "2607.29355", "arxiv_url": "https://arxiv.org/abs/2607.29355", "authors": ["Omer Burak Cinar", "Mehmet Mert Dalkilic", "Cagri Toraman"], "brief": "\u672c\u6587\u7814\u7a76\u4e94\u79cd\u7a81\u53a5\u8bed\u65cf\u8bed\u8a00\u5728\u4f4e\u8d44\u6e90\u673a\u5668\u7ffb\u8bd1\u4e2d\u7684\u8de8\u8bed\u8a00\u8fc1\u79fb\u89c4\u5f8b\uff0c\u4f7f\u7528\u6210\u5bf9\u8fc1\u79fb\u77e9\u9635\u5206\u6790\u4e0d\u540c\u6e90\u8bed\u8a00\u5230\u76ee\u6807\u8bed\u8a00\u7684\u6548\u679c\u3002\u5b9e\u9a8c\u53d1\u73b0\u4eb2\u7f18\u66f4\u8fd1\u7684\u8bed\u8a00\u5bf9\u8fc1\u79fb\u66f4\u5f3a\uff0c\u8fc1\u79fb\u65b9\u5411\u548c\u7ffb\u8bd1\u76ee\u6807\u4f1a\u663e\u8457\u5f71\u54cd\u7ed3\u679c\uff0c\u62c9\u4e01\u5316\u5728\u90e8\u5206\u6587\u5b57\u4e0d\u5339\u914d\u573a\u666f\u4e0b\u63d0\u5347 BLEU \u548c chrF\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29355", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u7ffb\u8bd1", "\u8de8\u8bed\u8a00\u8fc1\u79fb", "\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u591a\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29355v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cross-Lingual Transfer for Machine Translation in Turkic Languages", "tldr": "\u672c\u6587\u7814\u7a76\u4e94\u79cd\u7a81\u53a5\u8bed\u65cf\u8bed\u8a00\u5728\u4f4e\u8d44\u6e90\u673a\u5668\u7ffb\u8bd1\u4e2d\u7684\u8de8\u8bed\u8a00\u8fc1\u79fb\u89c4\u5f8b\uff0c\u4f7f\u7528\u6210\u5bf9\u8fc1\u79fb\u77e9\u9635\u5206\u6790\u4e0d\u540c\u6e90\u8bed\u8a00\u5230\u76ee\u6807\u8bed\u8a00\u7684\u6548\u679c\u3002\u5b9e\u9a8c\u53d1\u73b0\u4eb2\u7f18\u66f4\u8fd1\u7684\u8bed\u8a00\u5bf9\u8fc1\u79fb\u66f4\u5f3a\uff0c\u8fc1\u79fb\u65b9\u5411\u548c\u7ffb\u8bd1\u76ee\u6807\u4f1a\u663e\u8457\u5f71\u54cd\u7ed3\u679c\uff0c\u62c9\u4e01\u5316\u5728\u90e8\u5206\u6587\u5b57\u4e0d\u5339\u914d\u573a\u666f\u4e0b\u63d0\u5347 BLEU \u548c chrF\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the ever-increasing pervasiveness of smart edge devices, the demand is growing for applications that can be tailored to users (e.g., custom keyword spotting) or patients (e.g., adaptive health monitoring). Yet, most edge devices rely on fixed inference algorithms and thus cannot learn on-device to personalize predictions. When they can, devices typically support only a specific learning scenario, such as few-shot learning (FSL): going beyond this requires resorting either to another specialized device or to cloud-based retraining, which implies significant energy and latency overheads, a lack of real-time capabilities, and privacy concerns. In this work, we introduce embedder-centric learning (ECL), a framework that unifies four different online learning scenarios: FSL for on-the-fly customization, continual learning (CL) for knowledge accumulation, zero-shot learning (ZSL) for leveraging semantic data, and in-context learning (ICL) for adapting beyond classification. We demonstrate in silicon that ECL can be deployed on resource-constrained devices across four real-world use cases representative of the aforementioned learning scenarios. Our approach establishes a new state-of-the-art performance for FSL character recognition (Omniglot: 96.8% for 5-way 1-shot, 83.3% for 32-way 1-shot), and the first hardware baseline for CL in keyword spotting (NeuroBench keyword FSCIL: 71.8% for 200-way 5-shot). Moreover, we present the first hardware demonstrations of ZSL with semantic data (60.6% for 5-way spoken sentence classification) and ICL (46.2% at the 500th token of RegBench) operating at micro-to-milliwatt power budgets. Therefore, by unifying multiple learning scenarios, we pave the way for smart and versatile devices that can adapt right at the edge, without reliance on the cloud.", "arxiv_id": "2607.29353", "arxiv_url": "https://arxiv.org/abs/2607.29353", "authors": ["Douwe den Blanken", "Martin Lefebvre", "Charlotte Frenkel"], "brief": "\u8bba\u6587\u63d0\u51fa\u4ee5\u5d4c\u5165\u5668\u4e3a\u4e2d\u5fc3\u7684\u5b66\u4e60\u6846\u67b6 ECL\uff0c\u5c06\u5c11\u6837\u672c\u3001\u96f6\u6837\u672c\u3001\u6301\u7eed\u5b66\u4e60\u548c\u4e0a\u4e0b\u6587\u5b66\u4e60\u7edf\u4e00\u5230\u53ef\u5728\u8fb9\u7f18\u8bbe\u5907\u4e0a\u8fd0\u884c\u7684\u5728\u7ebf\u9002\u5e94\u673a\u5236\u4e2d\u3002\u8be5\u65b9\u6cd5\u5df2\u5728\u7845\u82af\u7247\u4e0a\u9a8c\u8bc1\uff0c\u5728\u5b57\u7b26\u8bc6\u522b\u3001\u5173\u952e\u8bcd\u6301\u7eed\u5b66\u4e60\u3001\u8bed\u4e49\u96f6\u6837\u672c\u5206\u7c7b\u548c\u4e0a\u4e0b\u6587\u5b66\u4e60\u7b49\u4efb\u52a1\u4e2d\u5b9e\u73b0\u5fae\u74e6\u5230\u6beb\u74e6\u7ea7\u529f\u8017\uff0c\u5e76\u5237\u65b0\u6216\u5efa\u7acb\u4e86\u591a\u9879\u786c\u4ef6\u57fa\u7ebf\u3002", "categories": ["cs.LG", "cs.AI", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29353", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fb9\u7f18\u667a\u80fd", "\u5c11\u6837\u672c\u5b66\u4e60", "\u6301\u7eed\u5b66\u4e60", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29353v1", "published_at": "2026-07-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Versatile On-device Adaptation at the Edge by Unifying Few-shot, Zero-shot, Continual, and In-context Learning", "tldr": "\u8bba\u6587\u63d0\u51fa\u4ee5\u5d4c\u5165\u5668\u4e3a\u4e2d\u5fc3\u7684\u5b66\u4e60\u6846\u67b6 ECL\uff0c\u5c06\u5c11\u6837\u672c\u3001\u96f6\u6837\u672c\u3001\u6301\u7eed\u5b66\u4e60\u548c\u4e0a\u4e0b\u6587\u5b66\u4e60\u7edf\u4e00\u5230\u53ef\u5728\u8fb9\u7f18\u8bbe\u5907\u4e0a\u8fd0\u884c\u7684\u5728\u7ebf\u9002\u5e94\u673a\u5236\u4e2d\u3002\u8be5\u65b9\u6cd5\u5df2\u5728\u7845\u82af\u7247\u4e0a\u9a8c\u8bc1\uff0c\u5728\u5b57\u7b26\u8bc6\u522b\u3001\u5173\u952e\u8bcd\u6301\u7eed\u5b66\u4e60\u3001\u8bed\u4e49\u96f6\u6837\u672c\u5206\u7c7b\u548c\u4e0a\u4e0b\u6587\u5b66\u4e60\u7b49\u4efb\u52a1\u4e2d\u5b9e\u73b0\u5fae\u74e6\u5230\u6beb\u74e6\u7ea7\u529f\u8017\uff0c\u5e76\u5237\u65b0\u6216\u5efa\u7acb\u4e86\u591a\u9879\u786c\u4ef6\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Background and Objective: Generating realistic medical images with anatomically accurate segmentation masks helps address the shortage of annotated data in medical imaging, particularly in optical coherence tomography (OCT) of mouse eyes, where manual retinal layer delineation is labour-intensive due to tiny structures and required expertise, resulting in scarce datasets. While diffusion models perform well in medical image synthesis, joint image-mask generation has relied mainly on U-Net-based denoisers, leaving diffusion transformers largely unexplored. Methods: We propose a conditional dual-output Diffusion Transformer (DualDiT) for joint synthesis of OCT B-scans and segmentation masks of the upper retinal cell layers in ex vivo mouse retina. DualDiT encodes both modalities into a shared latent space via a pretrained VAE, concatenates their latent representations, and performs conditional diffusion over the joint tensor. We compared DualDiT against two adapted diffusion baselines: DDPM and LDM. Generative quality was assessed via Fr\u00e9chet Inception Distance (FID) and spatial FID (sFID); practical utility via synthetic data augmentation for downstream U-Net segmentation; and perceptual realism via evaluation by three domain experts. Results: DualDiT achieved the best generative quality (FID 56.14, sFID 114.35), outperforming DDPM and LDM. Expert panels misclassified 46% of synthetic samples as real and 42% of real samples as synthetic. Adding DualDiT-generated images and masks improved Dice and IoU scores on a held-out segmentation test set. Conclusions: DualDiT shows that transformer-based diffusion models can effectively learn the joint distribution of OCT images and segmentation masks, surpassing DDPM- and LDM-based ba
