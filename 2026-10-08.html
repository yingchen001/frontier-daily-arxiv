Qianyun Guo", "Jiaying Wu", "Shuo Ji", "Bryan Hooi"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/liushiliushi/Learn2Play-Bench", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2610.08215", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.08215v2", "published_at": "2026-10-06", "score": 0.49, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (76\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.08215.png", "title": "Learn2Play Bench: How Well Do LLM Agents Learn from Experience in Unfamiliar Environments?", "tldr": null, "upvotes": 76, "what_it_is": null, "why_notable": null}, {"abstract": "Text prompting is an indirect interface for poster generation, requiring users to encode inherently two-dimensional composition intent into a one-dimensional sequence of words. We introduce a Spatial Canvas Interface that enables users to directly compose generation intent in space through four complementary binding types: semantic, identity, text, and pixel, together with Text Specifications for individual elements and global appearance. Based on this interface, we develop Compo, a poster generation model adapted from a pretrained image editing model to understand Spatial Canvas inputs and Text Specifications. Compo supports both direct inference, where users explicitly construct the canvas, and agentic mode, where a high-level request is automatically translated into a planned Spatial Canvas. To train Compo, we develop a scalable pipeline that automatically constructs supervision data for different binding types and their combinations, enabling efficient adaptation without training a specialized poster generator from scratch. We further introduce a benchmark that evaluates adherence to individual binding types and their joint composition. Experiments show that Compo achieves stronger compositional controllability than both general-purpose image generation models and dedicated poster generation systems while maintaining high visual quality. By decoupling intent specification from visual generation, our work shifts poster generation from prompting toward composing.", "arxiv_id": "2610.12230", "arxiv_url": "https://arxiv.org/abs/2610.12230", "authors": ["Yitong Wang", "Fangyun Wei", "Jinjing Zhao", "Sirui Zhang", "Hongyang Zhang", "Dong Chen", "Bo Dai", "Yan Lu"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/snowflakewang/Compo", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.12230", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2610.12230v1", "published_at": "2026-10-08", "score": 0.463, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12230.png", "title": "From Prompting to Composing: A Spatial Canvas Interface for Poster Generation", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) and vision-language models (VLMs) are usually frozen after deployment, so they do not learn from the cases they solve. This is especially concerning in medicine, where new clinical evidence, updated guidelines, and new therapies can change established practice. Fine-tuning can update the model, but it requires access to model weights and additional training. Parameter-free methods avoid training, but they may overfit a fixed validation set, lack reliable domain knowledge, or lose visual details by saving experience only as text. To address these limitations, we present a model-agnostic framework that allows frozen LLMs and VLMs to learn from deployment experience through three forms of external expertise: a Skill that guides reasoning and tool use, a Knowledge Memory that stores reliable facts supported by earlier cases or trusted external evidence, and a Multimodal Knowledge Base that keeps visual examples and guides the model to relate each retrieved case to the current image. Instead of relying on a fixed validation set, a validation strategy keeps an update only if it helps on new cases without degrading performance on earlier ones. Across six benchmarks covering clinical diagnosis, clinical workflows, medical reasoning, and medical and non-medical visual reasoning, and with four open-weight and closed-source base models, our framework improves performance during online deployment by up to 34.2% over the base model on medical tasks, generalizes to unseen cases, transfers to other models without further optimization, and works in non-medical domains.", "arxiv_id": "2610.09146", "arxiv_url": "https://arxiv.org/abs/2610.09146", "authors": ["Yexiao He", "Yucheng Tang", "Pengfei Guo", "Yufan He", "Andriy Myronenko", "Can Zhao", "Ang Li", "Daguang Xu", "Dong Yang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.09146", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2610.09146v1", "published_at": "2026-10-06", "score": 0.408, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.09146.png", "title": "Frozen Models, Evolving Expertise: Model-Agnostic Learning from Deployment Experience for Multimodal Medical AI", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Reconstructing an editable CAD model from a 3D shape remains a challenging engineering task. Existing methods can propose CAD operations, but no single source of proposals works equally well across different part geometries and stages of reconstruction. We introduce CADFather, an autonomous agentic system that coordinates complementary tools to recover parametric CAD programs from 3D meshes. A vision-language assistant inspects renders of the target and intermediate reconstructions, then decides which candidate CAD programs to extend, which tools to invoke, how many proposals to generate, and when to finish. Learned and algorithmic tools propose CAD operations, while numerical optimization refines the parameters of existing programs. Proposed or refined programs are executed and evaluated to provide feedback for subsequent decisions. The agent maintains alternative candidate programs for each target part and preserves the best valid result throughout reconstruction. CADFather uses pretrained generation and assistant models without additional training. We evaluate reconstruction quality and execution validity on the full DeepCAD, Fusion360, and MCB test sets, as well as on CADENA-Bench, CADBench, and BenchCAD. We additionally analyze computational cost and the trade-off between cost and reconstruction quality.", "arxiv_id": "2610.09127", "arxiv_url": "https://arxiv.org/abs/2610.09127", "authors": ["Gennadiy Savrasov", "Maksim Elistratov", "Nikita Gavrilov", "Albert Garifullin", "Oleg Pavlov", "Soslan Kabisov", "Vladimir Frolov", "Anton Konushin", "Andrey Kuznetsov", "Dmitrii Zhemchuzhnikov"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/kulibinai/cadfather", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2610.09127", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.09127v1", "published_at": "2026-10-06", "score": 0.397, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.09127.png", "title": "CADFather: Autonomous CAD Reconstruction through Coordinated Tool Use", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Realistic environment replicas are increasingly valuable for training and evaluating LLM agents, yet the original systems may be inaccessible or impractical to reproduce. We explore agentic language world modeling: rather than rebuilding an executable environment, a world model agent serves as the environment for a task agent and supports faithful and stateful simulation. We instantiate this paradigm with Trace2Env, a learning-free framework for settings where the original system is unavailable but historical interaction traces remain accessible. Trace2Env reconstructs these traces into a reusable environment worldbook containing environment schemas, grounded evidence, and induced behavioral knowledge. At runtime, the world model agent actively consults the worldbook together with persistent episodic state to infer each action\u0027s observation and lasting state effects. Across nine environments, Trace2Env improves both next-observation fidelity and long-horizon interaction consistency over conventional prompt-based LWMs. In multi-turn interaction, task agent actions generated against Trace2Env remain valid more often when replayed in the real environment, indicating that its simulated dynamics better preserve the consequences of earlier actions across successive turns. These results establish agentic language world modeling as an alternative direction for building realistic environment replicas without reconstructing the original executable system.", "arxiv_id": "2610.06100", "arxiv_url": "https://arxiv.org/abs/2610.06100", "authors": ["Quanyu Long", "Xiao Chen", "Jianda Chen", "Haozhen Zhang", "Qisheng Hu", "Jianzhu Bao", "Wenya Wang"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/ruyue0001/trace2env", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2610.06100", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University Singapore", "pdf_url": "https://arxiv.org/pdf/2610.06100v1", "published_at": "2026-10-05", "score": 0.378, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (97\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06100.png", "title": "From Traces to Agentic Worlds: Agentic Language World Models for Interactive Environment Simulation", "tldr": null, "upvotes": 97, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) routing distributes inference work across different models, advancing the cost-quality Pareto frontier of LLM serving. While coarse-grained routing at the session or query level has been widely adopted in production systems, recent algorithmic work shows that fine-grained token-level routing can yield substantial efficiency and quality gains. However, efficiently serving token-level routed inference poses significant challenges to existing systems. Built on single-LLM assumptions, current systems suffer from severe step desynchronization and frequent batch admission delays under token-level routing, and they also impose high implementation complexity on developers. To address these challenges, we design TokenRouter, an efficient and developer-friendly serving system for token-level routed LLM inference. TokenRouter follows the principle of request-centric programming, model-centric execution: developers describe routing logic from the perspective of a single request, while the runtime launches a subserver for each LLM and dispatches requests asynchronously. Each subserver employs a delayed-batching scheduler, whose optimal hyperparameters are derived from a mathematical throughput model of the system. Across diverse routing algorithms, workloads, and model pairs, TokenRouter achieves 2.01-64.15x higher decoding throughput than existing systems, substantially advancing the serving efficiency of token-level LLM routing. Our code is available at https://github.com/thu-nics/TokenRouter.", "arxiv_id": "2610.12242", "arxiv_url": "https://arxiv.org/abs/2610.12242", "authors": ["Tianyu Fu", "Tengxuan Liu", "Ruoxi Wang", "Yixin Dong", "Yi Ge", "Yichen You", "Yu Wang"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/thu-nics/TokenRouter", "github_stars": 20, "hf_url": "https://huggingface.co/papers/2610.12242", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tsinghua-NICS-EFC", "pdf_url": "https://arxiv.org/pdf/2610.12242v1", "published_at": "2026-10-08", "score": 0.364, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (102\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12242.png", "title": "TokenRouter: Efficient Serving System for Token-Level LLM Routing", "tldr": null, "upvotes": 102, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action models benefit from the understanding and reasoning capabilities of pretrained vision-language models, but action-only supervision provides limited grounding in world dynamics. Conversely, world-action models inherit spatiotemporal priors from video generation models, yet remain limited in semantic understanding and reasoning under distribution shifts. We introduce UniWAM, a unified architecture that integrates a physical reasoner, a world generator, and an action predictor to jointly learn semantic understanding of the physical world, visual generation, and action prediction. To ensure the quality of the training data, we developed a rigorous data cleaning and annotation pipeline for both human egocentric data and robot data. To adapt the vision-language component to embodied tasks while preserving its inherited language capabilities, we represent low-level actions in natural language and introduce a pre-training recipe that assigns complementary supervision from visual question answering (VQA) data, human egocentric data, and robot demonstrations to the appropriate model components. During post-training, future visual noise augmentation reduces reliance on precise future predictions, while history-conditioned flow matching uses encoded action history to initialize action generation. Together, these designs significantly reduce denoising steps while maintaining performance. UniWAM achieves state-of-the-art (SOTA) performance across multiple evaluations, including in-distribution performance, robustness, generalization, instruction following, and long-horizon task execution. Furthermore, we uncover a log-linear scaling law of unified human-robot co-training, demonstrating the effectiveness of large-scale pre-training on a mixture of human and robot data.", "arxiv_id": "2610.02054", "arxiv_url": "https://arxiv.org/abs/2610.02054", "authors": ["Wenxuan Song", "Jiayi Chen", "Jingbo Wang", "Shuai Zhou", "Xicheng Gong", "Zehua Fan", "Ziyang Zhou", "Junwu E", "Haodong Yan", "Fuhao Li", "Qize Yu", "Xu Huang", "Pengwei Wang", "Wen Chen", "Shunbo Zhou", "Haoang Li"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/UniWAM/UniWAM", "github_stars": 107, "hf_url": "https://huggingface.co/papers/2610.02054", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "HKUSTGZ", "pdf_url": "https://arxiv.org/pdf/2610.02054v3", "published_at": "2026-10-01", "score": 0.354, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "HF trending (54\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.02054.png", "title": "UniWAM: Unified World-Action Model", "tldr": null, "upvotes": 54, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse attention is a primary approach to reducing the latency of diffusion transformers in long-sequence generation tasks, such as video and high-resolution 3D asset generation. However, existing methods can degrade generation quality and fidelity at high sparsity levels. Through controlled oracle comparisons, we trace this degradation to three sources: constraints imposed by token grouping, inaccurate interaction selection, and the attention contributions lost when tokens are discarded. Guided by this analysis, we propose Meta-Cached Sparse Attention (MC-Sparse), a training-free framework that selects individual key-value (KV) tokens while organizing similar queries into tile-aligned groups for efficient GPU execution. MC-Sparse caches metadata comprising query groups, KV indices selected using exact attention probabilities, and residuals between dense and sparse attention outputs, and reuses them across subsequent denoising steps. Across video and 3D generation models, MC-Sparse achieves higher fidelity to dense-attention outputs and larger denoising speedups than existing sparse-attention baselines, without visible quality degradation. Relative to dense attention, it delivers a $1.80\\times$ denoising speedup on Minimax-H3-Base and a $2.32\\times$ speedup on 3D asset generation, both with negligible quality loss.", "arxiv_id": "2610.06801", "arxiv_url": "https://arxiv.org/abs/2610.06801", "authors": ["Jiarui Chen", "Zeqiang Lai", "Jiangshan Wang", "Ziheng Ouyang", "Ye Huang", "Xiangyu Yue", "Cewu Lu", "Chunchao Guo"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/dodododddo/mcsparse", "github_stars": 28, "hf_url": "https://huggingface.co/papers/2610.06801", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2610.06801v1", "published_at": "2026-10-05", "score": 0.345, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (27\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06801.png", "title": "MC-Sparse: Deconstructing and Closing the Dense-Sparse Attention Gap in Diffusion Transformers", "tldr": null, "upvotes": 27, "what_it_is": null, "why_notable": null}, {"abstract": "We investigate a general-purpose layer for deep learning that, instead of compressing arbitrary-size training data into fixed-size weight matrices, stores a new pair of key-value representations for every data point during training, and retrieves and recombines these representations through an attention mechanism at inference time - resulting in a growing neural net (NN). While Irie et al. (arXiv:2202.05798) have put forward this perspective from the classic duality expressing any linear layer in a deep NN trained by gradient descent as linear attention (LA) over the training data points, replacing LA by more powerful attention functions, as they suggest, turns out to be non-trivial: we show that naively applying learning rules from the LA case to advanced kernels does not lead to principled optimization. Here we fill this gap and develop functional gradient-based learning rules for kernelized attention layers, based on radial basis function (RBF) and softmax-like kernels - establishing the principled \"retrieval-centric deep learning\" (RCDL) paradigm. Empirically, we demonstrate the promising performance and learning-efficiency of RCDL on image classification and synthetic teacher-student learning tasks. Moreover, we show that replacing LA in the dual form of NNs by advanced LA variants, namely MesaNet/DeltaNet, yields a formal connection to recently proposed optimizers for conventional fixed-size NNs, offering a novel perspective on deep learning optimization.", "arxiv_id": "2610.03858", "arxiv_url": "https://arxiv.org/abs/2610.03858", "authors": ["Maximilian Schlegel", "Rajai Nasser", "Seijin Kobayashi", "Yanick Schimpf", "Oliver Sieberling", "Robert Obryk", "Kazuki Irie", "Jo\u00e3o Sacramento", "Johannes von Oswald"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/paradigms-of-intelligence/rcdl", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.03858", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2610.03858v1", "published_at": "2026-10-02", "score": 0.324, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.03858.png", "title": "Retrieval-Centric Deep Learning in Growing Nonparametric Neural Networks", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Geometrically faithful and functional articulated 3D assets are essential for real-to-sim robot manipulation, where policies trained in simulation must transfer to physical objects. Recent mesh-based methods learn to infer articulation from annotated 3D assets, but deployment remains challenging when real-world objects fall outside the training distribution or their meshes are incomplete or corrupted. To address these limitations, we formulate articulated asset reconstruction as programmatic modeling grounded in partial geometric evidence and introduce USDCraft, a framework in which a pretrained LLM writes and revises executable programs for simulation-ready articulated assets without task-specific training. We propose source geometry analysis, which converts the source mesh into a metric textual description that distinguishes observed surface from unknown space, and iterative geometric rechecking, which re-encodes each candidate in the same representation so that discrepancies point to program edits while unobserved regions remain open to completion. Visual feedback and physical authoring guidance complete the modeling process, which produces articulated USD assets with explicit physical properties that load into Isaac Sim without manual adjustment. Experiments demonstrate leading articulation recovery on two benchmarks and validate USDCraft\u0027s effectiveness for real-to-sim-to-real robot manipulation.", "arxiv_id": "2610.11322", "arxiv_url": "https://arxiv.org/abs/2610.11322", "authors": ["Chuanrui Zhang", "Zaijia Yang", "Duomin Wang", "Lu Shi", "Daquan Zhou", "Ruihua Zhang", "Ziwei Wang"], "brief": "", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11322", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2610.11322v1", "published_at": "2026-10-08", "score": 0.298, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.11322.png", "title": "USDCraft: Geometrically Grounded Programmatic Modeling of Articulated 3D Assets for Simulation", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "General-purpose service robots need navigation systems that can handle diverse human requests in unfamiliar environments, combining task generality with scene generality. Some existing methods fine-tune multimodal large language models (MLLMs) to predict navigation actions, making their behavior dependent on the coverage of navigation training data and potentially limiting generalization to new requests and environments. Our key insight is to let the MLLM focus on interpreting requests, understanding scenes, and making decisions while preserving its general-purpose capabilities and delegating motion execution to navigation tools. To realize this idea, we introduce SuperNav, which equips a pretrained MLLM with a specialized agent harness without navigation-specific fine-tuning of the MLLM. Our harness supports these decisions with Navigation Skills, agent-oriented Tools for physical interaction, and task-progress and context management. A unified visual-point interface connects decision-making to motion by allowing the model to specify destinations directly in images and revise its decisions from execution feedback. Together, these components support sustained navigation across different task requirements and environments. SuperNav outperforms four evaluated baselines on instance-level, multi-object, and demand-driven tasks. Category-level evaluation on HM3D and deployment on a real quadruped robot further demonstrate its applicability across environments. Project Page: https://zju3dv.github.io/SuperNav/", "arxiv_id": "2610.12126", "arxiv_url": "https://arxiv.org/abs/2610.12126", "authors": ["Jinkai Zhang", "Jingyi Xu", "Yuanhong Yu", "Jiarui Guo", "Ruizhen Hu", "Hujun Bao", "Xiaowei Zhou", "Sida Peng"], "brief": "", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/zju3dv/SuperNav", "github_stars": 51, "hf_url": "https://huggingface.co/papers/2610.12126", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "zju3dv", "pdf_url": "https://arxiv.org/pdf/2610.12126v1", "published_at": "2026-10-08", "score": 0.297, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (62\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12126.png", "title": "SuperNav: An Agentic Navigation System for Any Task in Any Scene", "tldr": null, "upvotes": 62, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) are rapidly evolving toward continuous audio--visual reasoning, creating an urgent need for evaluations that expose their capability limits. Audio--visual captioning is an ideal diagnostic task, yet current benchmarks face a coupled trade-off: whole-caption scores provide coverage without localization, local probes provide localization without coverage, and unconstrained LLM judges introduce instability. We introduce OmniCapBench (Omni-Video Caption Benchmark), a benchmark that reframes audio--visual caption evaluation as a deep-structured diagnostic framework. OmniCapBench shifts the prediction target from free-form text to sets of atomic, verifiable evaluation units across three tracks: entity references, visual shots, and audio events, enabling reliable scoring with deterministic constraint checks and localized LLM-based semantic comparisons. With 786 densely annotated videos, OmniCapBench effectively distinguishes MLLM perception errors, including temporal grounding failures, identity drift, cross-modal misalignment, and hallucinated descriptions. Evaluating frontier MLLMs reveals strong local perception but weak long-horizon audio--visual reasoning, particularly in identity drift and cross-modal misalignment, providing a fine-grained roadmap for omnimodal development.", "arxiv_id": "2610.12458", "arxiv_url": "https://arxiv.org/abs/2610.12458", "authors": ["Zhongyu Yang", "Jiale Tao", "Ruitao Chen", "Zuhao Yang", "Yingfang Yuan", "Xueliang Zhao", "Auden", "Kai Wang", "Shuai Shao", "Biao Wang", "Steve Yves", "Qinglin Lu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.12458", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2610.12458v1", "published_at": "2026-10-08", "score": 0.294, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12458.png", "title": "OmniCapBench: A Deep-Structured Evaluation Framework for Fine-Grained Audio-Visual Captioning", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Black-box optimization (BBO) arises in many scientific and engineering problems where objective evaluations are expensive and limited. Recent large language model (LLM) agents offer a new way to approach BBO by combining task semantics, computation, optimization tools, and feedback-driven decision making, showing great potential due to the integration with mathematically rigorous tools. However, existing agentic BBO studies use different task domains and system configurations, making their results difficult to compare and the effects of individual design choices hard to isolate. We therefore introduce AgenticBBO-Bench, a cross-domain benchmark for agentic BBO spanning synthetic functions, hyperparameter optimization, database tuning, chip design, and molecular design under a unified finite-budget evaluation protocol. In our experiments, agentic BBO achieves higher family-averaged scores than direct LLM-based methods in all five domains and outperforms the best numerical optimizers in four. We further study three factors shaping agent performance: optimization tools, task information and prior knowledge, and the role of the LLM during search. Our results show that additional numerical tools do not consistently improve performance, task semantics are broadly useful while more specific priors are less reliable, and numerical optimizers can effectively absorb gains from search trajectories established by the agent. Finally, we introduce a five-task frontier challenge within AgenticBBO-Bench and evaluate seven LLMs under the Codex agent harness, where GPT-6 Astra and DeepSeek-V4.1-Flash lie on the Pareto frontier of performance and cost among the evaluated models. Our code is available at https://github.com/lamda-bbo/agentic-bbo.", "arxiv_id": "2610.12183", "arxiv_url": "https://arxiv.org/abs/2610.12183", "authors": ["Ming Chen", "Rong-Xi Tan", "Ke Xue", "Yu-Jie Zhou", "Taiye Lu", "Zhi-Xuan Gao", "Peng Xie", "Zijun Shen", "Chen Lu", "Haopu Shang", "Chao Qian"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.NE"], "github_repo": "https://github.com/lamda-bbo/agentic-bbo", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.12183", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.12183v1", "published_at": "2026-10-08", "score": 0.277, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12183.png", "title": "A Closer Look at Agentic BBO: Benchmarking LLM Agents for Black-Box Optimization", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Large Multi-modality Models (LMMs) have made significant progress in visual understanding and generation, but still face challenges in visual editing, particularly in following complex instructions, preserving appearance consistency, and supporting flexible input formats. To study this gap, we introduce RISEBench, the first benchmark for evaluating Reasoning-Informed viSual Editing (RISE), and extend it to RISEBench++, a more comprehensive and fine-grained benchmark for this emerging task. RISEBench++ extends the taxonomy into a hierarchical scheme spanning six reasoning dimensions: Temporal, Causal, Spatial, Logical, and Counterfactual Reasoning, together with Hybrid Reasoning integrating multiple reasoning types across multi-turn edits. These dimensions are further decomposed into 12 subcategories and 65 fine-grained task types. We expand input formats to include multi-image conditioning and scale the benchmark to 1000 human-annotated test cases, released in English and Chinese. We also improve our evaluation framework, assessing Instruction Reasoning, Appearance Consistency, and Visual Plausibility with human judges and an LMM-as-a-judge approach for more reliable and calibrated judgements. Beyond benchmarking, we introduce RISE-Agent, a training-free agentic framework integrating reasoning-driven planning, tool-augmented execution, and verifier-guided refinement, outperforming most strong existing approaches across diverse RISE tasks. We evaluate 58 visual editing approaches, including 34 open-source models, 19 closed-source models, and 5 agentic methods. The results reveal substantial challenges in reasoning-based visual editing, with even the strongest evaluated approach, GPT-Image-2.5 Sunburst, achieving only 56.6% accuracy. RISEBench++ highlights the limitations of contemporary editing models, provides insights, and indicates future directions for reasoning-aware visual editing.", "arxiv_id": "2610.12343", "arxiv_url": "https://arxiv.org/abs/2610.12343", "authors": ["Xue Yang", "Peiyuan Zhang", "Yilun Zhu", "Qihao Yang", "Mingxin Liu", "Xiangyu Zhao", "Ziqian Fan", "Zhaokai Wang", "Yan Li", "Yifan Yang", "Xu Yang", "Xiaosong Jia", "Yue Zhou", "Zhihang Zhong", "Junchi Yan"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/VisionXLab/RISEBench", "github_stars": 159, "hf_url": "https://huggingface.co/papers/2610.12343", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "SJTU VisionXLab", "pdf_url": "https://arxiv.org/pdf/2610.12343v1", "published_at": "2026-10-08", "score": 0.272, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12343.png", "title": "Reasoning-Informed Visual Editing", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "When retrieved evidence contradicts an agent\u0027s prior beliefs, does it revise its answer, acknowledge uncertainty, or persist with an incorrect conclusion? Existing evaluations of agentic systems focus primarily on task success, offering limited insight into how agents handle such conflicts. We propose to evaluate agents on epistemic humility (EH): the agent\u0027s willingness to recognize, act on, and communicate uncertainty during task execution. We operationalize EH through three trajectory-level behavioral dimensions: Identify, Solve, and Escalate (ISE). Through knowledge conflict, situations where the backbone language model\u0027s parametric knowledge contradicts the evidence it encounters, or where two contextual sources disagree, we evaluate two conflict settings: (1) controlled conflict and (2) naturally occurring conflict during multi-step agentic execution, each paired with matched no-conflict controls. Evaluating four agents, we find that higher task accuracy does not necessarily correspond to greater epistemic humility: some high-accuracy configurations recognize conflicts during execution but do not communicate unresolved uncertainty in their incorrect final answers. Trajectory-level analysis further reveals that agents frequently detect conflicts in early steps of execution but fail to maintain or resolve them in later steps. Finally, we show that model-level interventions can improve EH, but often at the cost of task accuracy, suggesting that epistemic humility emerges from the interaction among the backbone model, agent harness, and evaluation environment.", "arxiv_id": "2610.12360", "arxiv_url": "https://arxiv.org/abs/2610.12360", "authors": ["Kaiser Sun", "Bernal Jimenez Gutierrez", "Hongjun Liu", "Jingyu Zhang", "Jie Gao", "Mark Dredze", "Daniel Khashabi"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/KaiserWhoLearns/EpistemicHumilityLLMAgents", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.12360", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Johns Hopkins University", "pdf_url": "https://arxiv.org/pdf/2610.12360v1", "published_at": "2026-10-08", "score": 0.272, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12360.png", "title": "Accurate but Not Humble: Evaluating Epistemic Humility in LLM Agents under Knowledge Conflict", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Long-context LLM agents accumulate interaction histories that strain KV-cache memory and attention computation. Although sparse attention reduces these costs, heterogeneous cache representations and workflows hinder integration with existing inference engines, while prior sparse-serving abstractions support only specific layouts or workflows. We present SparseEngine, a ground-up, sparse-first inference engine whose shared lifecycle contract lets each method control its KV representation and computation while coordinating state transitions with common serving infrastructure. SparseEngine supports 15 methods across four categories and enables cross-request state management through Chain Cache, which resumes KV-eviction methods from retained history, and controllable Prefix-Cache Pruning, which removes KV from selected history regions while preserving logical-prefix matching. While maintaining method quality, SparseEngine delivers over 10x higher throughput with KV eviction, over 2.5x faster decoding at matched concurrency than vLLM, and over 2x end-to-end speedup on agent benchmarks. The code is available at https://github.com/CURRENTF/SparseEngine.", "arxiv_id": "2609.39068", "arxiv_url": "https://arxiv.org/abs/2609.39068", "authors": ["Jitai Hao", "Quansheng Gu", "Qiang Huang", "Jun Yu"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/CURRENTF/SparseEngine", "github_stars": 81, "hf_url": "https://huggingface.co/papers/2609.39068", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.39068v1", "published_at": "2026-09-30", "score": 0.261, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.39068.png", "title": "SparseEngine: Sparse-First Inference Engine", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Current 3D generation methods lack explicit local control: geometric adherence is often defined by a global control strength, and appearance cannot be specified locally. We present SpaceFlow, a training-free pipeline for locally controllable 3D generation from text descriptions and a collection of geometric primitives. Each primitive serves as a proxy for an object part and is assigned a local control level, enabling users to specify whether regions should strictly follow the input shape or allow generative completion. During structure generation, we enforce these spatial constraints within the generative flow process. For appearance synthesis, the generated structure is segmented and matched to the primitives. Each generated part is conditioned only on its assigned text or image cue, thereby limiting cross-part leakage. Regional geometry metrics demonstrate that SpaceFlow preserves the specified geometry in high-control regions and enables plausible shape variation in low-control areas. A user study further indicates that the resulting balance between geometric fidelity and generative freedom remains competitive in overall quality. When evaluating appearance on fixed geometry, text-conditioned routing achieves state-of-the-art prompt faithfulness and color/material accuracy. Qualitative results additionally show localized routing of image cues. The project page is available at SpaceFlow3D.github.io.", "arxiv_id": "2610.12399", "arxiv_url": "https://arxiv.org/abs/2610.12399", "authors": ["Neil De La Fuente", "Joan Lafuente", "Mukhammadali Sayfiddinov", "Felicia Scharitzer", "Marc Pollefeys", "Ata Celen", "Sayan Deb Sarkar", "Elisabetta Fedele"], "brief": "", "categories": ["cs.CV", "cs.AI", "cs.GR"], "github_repo": "https://github.com/SpaceFlow3D/spaceflow", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2610.12399", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ETH Zurich", "pdf_url": "https://arxiv.org/pdf/2610.12399v1", "published_at": "2026-10-08", "score": 0.261, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ETH", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12399.png", "title": "SpaceFlow: Locally Controllable 3D Generation", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Large Language Models (MLLMs) have demonstrated remarkable potential in video understanding, yet their reliance on retrospective summarization and text-centric priors often limits their ability to bridge unobserved causal transitions when applied to Video Event Prediction (VEP). To address this, we propose VepAgent, an agentic framework that integrates causal-transition reasoning with tool-augmented reinforcement learning (RL) for robust VEP. Unlike prior methods that passively project future trajectories from historical dependencies, our approach explicitly models the logical progression from terminal observed states to future events. Specifically, we first construct futurebench-4K, a high-quality chain-of-thought dataset for supervised fine-tuning (SFT) that effectively bridges the causal-logic gap by structuring the deduction of unobserved intermediate states. Subsequently, we develop a diagnostic tool library integrating state tracking, frame retrieval, and region magnification, enabling the agent to dynamically augment reasoning with external tools to recover missing spatio-temporal evidence and resolve visual ambiguities during inference. Moreover, we propose a composite reward mechanism that jointly optimizes prediction accuracy, causal coherence, and reliable prior, compelling the agent to rely on genuine visual grounding rather than superficial textual similarities. Extensive evaluations on FutureBench and NEPBench datasets demonstrate that our method achieves state-of-the-art performance, significantly outperforming larger MLLMs and validating the empirical effectiveness of our agentic, future-oriented reasoning paradigm.", "arxiv_id": "2610.06293", "arxiv_url": "https://arxiv.org/abs/2610.06293", "authors": ["Qiutong Chen", "Yuchan Guo", "Zhenlong Yuan", "Haobo Yang", "Fangfang Lin", "Xinyi Long", "Yin Wang", "Zijian Song", "Rui Lan", "Shi Qiu", "Boyuan Pan", "Yang Luo", "Yuyin Zhou"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.06293", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "UCSC-VLAA", "pdf_url": "https://arxiv.org/pdf/2610.06293v1", "published_at": "2026-10-05", "score": 0.261, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (54\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06293.png", "title": "VepAgent: Bridging Causal-Transition via Tool-Augmented Reinforcement Learning for Video Event Prediction", "tldr": null, "upvotes": 54, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) is the central training paradigm for advancing large foundation models towards self-improvement. This report introduces the MiMo-V2.6 series, an omni-modal family that pushes the frontier of model intelligence by scaling RL compute. Prior to RL, we conduct mid-training on a broad multimodal corpus to provide ample exploration space, and build a solid infrastructure on the pretrained hybrid-SWA architecture to support subsequent scale-up. We scale RL compute along three dimensions: (1) larger batches and higher throughput, with an asynchronous training that consumes 1,568 samples and 2.7-3.7B tokens per step at context lengths of up to 1M; (2) more diverse and complex environments, spanning code, general, visual, and cyber domains under a mixture of agent harnesses; and (3) more grader compute, via groupwise agentic grading that yields more accurate reward signals for long-horizon tasks and steers the model towards shorter, more token-efficient solutions. To keep training stable at scale, we freeze the MoE router and establish a multi-layer defense against reward hacking. We further build infrastructure for mixed-task agentic RL, including a unified trajectory representation, high-concurrency multi-framework rollout, decoupled control and data planes, and training-inference consistency. We open-source the training dynamics, RL environments, and RL framework to facilitate reproduction and further research on scaled RL and model self-improvement.", "arxiv_id": "2610.11959", "arxiv_url": "https://arxiv.org/abs/2610.11959", "authors": ["Xiaomi LLM-Core Team", ":", "Zongming Qiao", "Ziyue Hua", "Zirui Ou", "Zihao Yue", "Zihan Jiang", "Zhuo Huang", "Zhiyang Chen", "Zhixian Zheng", "Zhipeng Xu", "Zhengrui Ma", "Yuyang Hu", "Yuhang Dong", "Yuechen Zhang", "Yudong Wang", "Yuanxin Liu", "Yixin Yang", "Yishuo Cai", "Yikai Zhao", "Yihan Yan", "Yifan Zhang", "Yifan Song", "Xiyu Wei", "Xing Zhang", "Xin Zhang", "Xiaoqian Liu", "Xiaodong Ji", "Xiangwei Deng", "Xueyu Guo", "Wenhan Ma", "Weimin Xiong", "Weikun Wang", "Weiji Zhuang", "Shuo Liu", "Shuhuai Ren", "Shuhao Gu", "Shimao Chen", "Shijie Cao", "Shihua Yu", "Shicheng Li", "Shengjie Zhou", "Shaolei Zhang", "Rang Li", "Qiying Wang", "Qingkai Fang", "Qianli Chen", "Minzheng Wang", "Liwen Wang", "Linli Yao", "Linghao Zhang", "Liangyu Cheng", "Liang Zhao", "Lei Li", "Jinhao Dong", "Jinyu Xiang", "Jianyu Wei", "Jiangshan Duo", "Huaqiu Liu", "Huanjie Fan", "Hongyi Guan", "Hongshen Xu", "Hao Tian", "Hanyu Li", "Hailin Zhang", "Gang Wang", "Fuli Luo", "Feng Wei", "Dong Zhang", "Dawei Zhu", "Chiheng Lou", "Chenhong He", "Chenhao He", "Chenghua Liu", "Bowen Ye", "Bowen Shen", "Boshen Xu", "Bo Yang", "Bingquan Xia", "Bangjun Xiao", "Baixuan Xu", "Zhouxiang Mao", "Zhiyang Zhang", "Zhixiang Xu", "Zhenru Lin", "Zhengju Tang", "Zhaojun Huang", "Yuzhe Weng", "Yuxing Xiang", "Yuxiao Li", "Yuheng Yang", "Yuhang Wang", "Yuchen Liu", "Yuanyuan Tian", "Yuanliang Dong", "Yu Cheng", "Yongzhe He", "Yongshun Liang", "Yong Wang", "Yiyan Wang", "Yitian Gong", "Yijie Zhang", "Yanshu Xin", "Xun Zhang", "Xingjian Zhao", "Wenyu Yang", "Wenshan Huang", "Wenhao Li", "Tingwei Huang", "Tianyu Yu", "Tianyang Lu", "Taoyu Yang", "Sinan Du", "Shutong Tian", "Shulin Du", "Shengfan Wang", "Shanchuan Fang", "Qihao Zhang", "Qibin Yang", "Qian Yu", "Qian Tu", "Pengrong Xie", "Peipei Wang", "Peidian Li", "Minkun Guo", "Mingchen Shao", "Luohan Gao", "Lijie Wang", "Liang Shi", "Kaiqi Chen", "Kaiming Liu", "Kaifei Wang", "Kai Yang", "Jinlong Xue", "Jiechen Zhang", "Jiaxuan Liu", "Hongxu An", "Hao Peng", "Hanglong L\u00fc", "Guonan Wang", "Feiyu Yang", "Fanyu Cao", "Fangyue Liu", "Fan Cui", "Cong Wang", "Chun Chen", "Chenxu Bai", "Chengxuan Zhu", "Chenghua Wang", "Boyi Zeng"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11959", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Xiaomi MiMo", "pdf_url": "https://arxiv.org/pdf/2610.11959v1", "published_at": "2026-10-08", "score": 0.259, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (55\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.11959.png", "title": "MiMo-V2.6: Scaling Reinforcement Learning Towards Self-Improvement", "tldr": null, "upvotes": 55, "what_it_is": null, "why_notable": null}, {"abstract": "Recent AI systems have made rapid progress in scientific discovery when given well-defined metrics, but whether they can autonomously undertake open-ended scientific discovery remains unclear. We investigate AI\u0027s ability to tackle open-ended tasks in Station, an open-world environment in which multiple agents simulate a scientific ecosystem. To tackle challenges specific to open-ended tasks, we propose augmenting Station with two mechanisms: a Supervisor mechanism and periodic Meta Reflection, which encourage persistent exploration even when intermediate metrics are lacking. We construct open-ended tasks from three recent oral papers presented at ICLR. We give agents the main research question studied in each paper while withholding the paper\u0027s results and disabling web access. We then measure how many of the original findings-partitioned into individual criteria-agents rediscover. We find that Station rediscovers 62.7% of the criteria on average, compared with 15.4% for Codex Multiagent-v2 and 14.4-20.6% for AI Scientist-v2. Ablation and behavioral analyses indicate that adding the two mechanisms together improves research coverage and continuity. We further evaluate Station on two open-ended tasks without oracle papers and find that some of the discoveries made by the agents closely match discoveries reported by researchers after the knowledge cutoff date. Together, these results indicate that a suitable environment can enable agents to autonomously make meaningful progress in open-ended scientific discovery.", "arxiv_id": "2610.08927", "arxiv_url": "https://arxiv.org/abs/2610.08927", "authors": ["Wenyu Du", "Stephen Chung"], "brief": "", "categories": ["cs.AI", "cs.MA"], "github_repo": "https://github.com/dualverse-ai/station-open-reseach", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.08927", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Hong Kong University", "pdf_url": "https://arxiv.org/pdf/2610.08927v1", "published_at": "2026-10-06", "score": 0.252, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.08927.png", "title": "Can AI Agents Make Open-Ended Scientific Discovery? Evidence from Station", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Much knowledge work produces new deliverables from files a workspace already holds, and LLM agents are beginning to take such work over. Through direct corpus interaction, an agent can search and read any of those files from a terminal with no indexing, and producing a deliverable from many of them in this way is what we call direct workspace interaction (DWI). Reaching the files, however, is only half the task: nothing keeps track of what the task asks for, what has been read, and what was listed but never opened, all of which slip through the context window without leaving a trace, so an agent may extract a figure and still deliver a report without it. To address this, we present RunningTab, a framework that equips direct workspace interaction with an environment-side tab: a per-task record of what the task still owes, kept by the environment alongside the agent. Specifically, the agent adds its requirements, while the environment records every file read as an excerpt with its provenance and every listed but unopened file as a candidate; the agent can then see each requirement beside its best-matching excerpts and top unopened candidates, resolve it against matching content or set it aside with a reason, and, should it try to finish with requirements still open, receive them in a finish check. We validate RunningTab on three benchmarks with three LLMs, where it consistently outperforms plain DWI and baselines that keep the record in the model, while its tab usually holds the values a deliverable needs once seen.", "arxiv_id": "2610.10444", "arxiv_url": "https://arxiv.org/abs/2610.10444", "authors": ["Jinheon Baek", "Soyeong Jeong", "Yumin Choi", "Dongsu Han", "Sung Ju Hwang"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10444", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2610.10444v1", "published_at": "2026-10-07", "score": 0.25, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (34\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.10444.png", "title": "RunningTab: Direct Workspace Interaction with Environment-Side Tabs", "tldr": null, "upvotes": 34, "what_it_is": null, "why_notable": null}, {"abstract": "Learning to act in unfamiliar environments requires agents to infer how the world works and revise that understanding as new evidence arrives. Yet limited observations can support multiple world models that explain past interactions but predict different outcomes in unseen states. We introduce Memento 3, building on the Memento series to enable frozen LLM agents to continually learn explicit world models through external memory. The agent maintains a natural-language rulebook as persistent semantic memory, recording revisable hypotheses about environment dynamics while leaving unknown aspects underspecified. It compiles this rulebook into executable code for prediction and planning. Through a continual loop of observation, reflection, rule revision, compilation, and verification, the agent uses prediction errors to refine both the rulebook and its code. Updated code is accepted only when the LLM judges it faithful to the rulebook and cell-exact replay reproduces the observed transitions. We investigate this process as a model-based route to recursive self-improvement (RSI): the agent autonomously explores the environment, revises its world model, and uses verified updates to guide subsequent interaction and learning, while the underlying LLM remains fixed. A population extension maintains multiple world models in parallel, sharing interaction evidence and using their predictions to guide exploration. On ARC-AGI-3, the single-model agent clears every level of all 25 public games, achieves a mean Relative Human Action Efficiency (RHAE) of 100.0, and uses 44% of the human action count. In an Atari Pong case study, a learned feedback controller wins 21:0 in each of three evaluated episodes with different openings, without further LLM calls.", "arxiv_id": "2610.11794", "arxiv_url": "https://arxiv.org/abs/2610.11794", "authors": ["Haoyu Zhao", "Zhengxu Yu", "Zhiyuan He", "Meng Fang", "Rasul Tutunov", "Haitham Bou-Ammar", "Weilin Luo", "Jun Wang"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11794", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "University College London", "pdf_url": "https://arxiv.org/pdf/2610.11794v1", "published_at": "2026-10-08", "score": 0.243, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.11794.png", "title": "Memento 3: Model-Based Recursive Self-Improvement through Reflective Rulebooks", "tldr": null, "upvotes": 24, "what_it_is": null, "why_notable": null}, {"abstract": "Wrapping an image generation model in an agentic harness can effectively boost Text-to-Image task performance: the harness can leverage memory, skills, workflow orchestration, result verification, and iterative refinement to continually construct and revise prompts, thereby eliciting better images. These gains, however, remain external to the diffusion model and are realized only while the full harness runs. We propose Diffusion On-Policy Context Distillation (D-OPCD), which treats the agent-improved prompt as privileged context and distills the knowledge encoded in the agent harness into the weights of the diffusion model, so that the model retains part of the harness\u0027s benefit when conditioned on the original query alone. Using a Text-to-Image agent equipped with our proposed Auto Skill Evolver (ASE), we show that D-OPCD can internalize harness capabilities into the generator\u0027s weights, raising the average direct-generation score from 60.52 to 65.09 across four benchmarks. With this knowledge absorbed into the weights, the harness can shed its saturated skills and resume evolving: a second ASE round on the updated generator improves on a skill-free harness by additional 1.83 points, pointing toward text-to-image systems in which harness and model keep improving each other through continual co-evolution.", "arxiv_id": "2610.07250", "arxiv_url": "https://arxiv.org/abs/2610.07250", "authors": ["Wenxuan Wang", "Zekai Liu", "Weinan Zhang", "Yu Cheng", "Yang Yang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/Yummytanmo/D-OPCD-CoEvolution", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2610.07250", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.07250v1", "published_at": "2026-10-05", "score": 0.239, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07250.png", "title": "Internalizing Agent Experience into Diffusion Model Weights via On-Policy Context Distillation", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly embedded as components in software systems, marketed under labels such as chatbot, copilot, retrieval-augmented generation, workflow, coding agent and AI agent. Whether these labels denote genuine architectural forms or serve as branding has not been assessed systematically. In the sources surveyed, labels do carry architectural content, most clearly in vendor usage: copilot denotes a router-worker architecture operating a host application under step-by-step user confirmation, while the more recent shift to the label agent coincides with AI-planned multi-step execution of which the user sees only the outcome. The coding agents of four major providers share one architecture, a reason-and-act loop delegating to subagents. This survey describes seven recurring forms---LLM chats, custom agents, retrieval-augmented generation (RAG), AI-enhanced workflows, copilots, coding agents, and, in part, agentic RAG---in a common vocabulary of agents and tools. Each is characterized along four structural dimensions (agentic RAG only partially): the architectural pattern, the control of execution and the point of user intervention, the number of agent calls per task, and tool use. An illustrative corpus of 22 systems from research publications and vendor documentation grounds the descriptions and shows where they reach their limit.", "arxiv_id": "2610.11899", "arxiv_url": "https://arxiv.org/abs/2610.11899", "authors": ["Irene Weber"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11899", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.11899v1", "published_at": "2026-10-08", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Forms of LLM-Integrated Applications from LLM-Chats to Autonomous AI Agent System", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Context: Large language model (LLM) agents are increasingly used as software and data-engineering assistants, yet evidence about locally deployable open-weight agents remains limited. Existing evaluations often emphasize textual responses or isolated code generation rather than the validity of complete engineering artifacts. Objectives: We evaluate whether local LLM agents can produce correct and reproducible data-engineering artifacts, quantify the effect of a closed-loop workspace condition, and examine trade-offs in model scale, architecture, quantization, runtime, tool use, and failure. Methods: We introduce a benchmark of fifteen mobility-workflow tasks covering data discovery, connectors, transport-feed processing, semantic enrichment, feature engineering, validation, visualization, and reporting. Deterministic checkers assess generated scripts, tables, structured files, figures, and reports. Ten local configurations are evaluated in one-shot and closed-loop conditions, with five repetitions per model, mode, and task, yielding 1,500 scored attempts on a consumer-grade GPU. Results: Among models larger than two billion parameters, the workspace condition increases pass rates by 26.7-52.0 percentage points over one-shot generation. The strongest configuration reaches 85.3% artifact-level success, and a quantized 9-billion-parameter model reaches 69.3% with an approximately 6.5 GB memory footprint. Gains are largest when intermediate artifacts expose errors the agent can inspect and repair. Conclusion: Local open-weight agents can support a meaningful subset of software-intensive data-engineering work, but reliability depends on model capability, task verifiability, and deterministic validation. The benchmark provides a reproducible method for evaluating complete agent configurations before adoption in engineering workflows.", "arxiv_id": "2610.11482", "arxiv_url": "https://arxiv.org/abs/2610.11482", "authors": ["Jorge Garc\u00eda-Carrasco", "Javier Sanchis", "Alejandro Reina-Reina", "Alejandro Mat\u00e9", "Juan Trujillo"], "brief": "", "categories": ["cs.SE", "cs.AI", "cs.DB", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11482", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.11482v1", "published_at": "2026-10-08", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Evaluating Local Language Model Agents for Reproducible Data Engineering: An Empirical Software Engineering Study of Mobility Workflows", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-augmented generation (RAG) grounds language models in external corpora. Agentic RAG enables iterative search, yet exposes the model to isolated chunks without document structure, making it difficult to distinguish relevant evidence from chunks that merely resemble the query. Structure-aware methods such as PageIndex navigate document structure but cannot scale to the structures of large corpora, which do not fit in the LLM context. Hence, they first commit to a single document using a document retriever and cannot recover from a wrong choice. We propose RIT-RAG (Retrieval-Induced Tree RAG), which combines content retrieval with structural navigation. Offline, RIT-RAG builds a tree for each document from its table of contents or sitemap. At query time, it retrieves a broad set of chunks and uses their positions to induce manageable sub-trees, potentially across multiple documents. An LLM agent navigates these sub-trees, selectively reads promising nodes, and reformulates queries when needed. Thus, retrieval proposes where to look, while the agent decides what to read. Across financial, scientific, and customer-support benchmarks, RIT-RAG achieves the highest answer accuracy among vanilla, graph-based, and agentic baselines. On EntQABench, our new benchmark of 2.84 million technical-documentation webpages, it improves accuracy by 6.8 to 11.4 points over the strongest baseline across three LLMs.", "arxiv_id": "2610.11370", "arxiv_url": "https://arxiv.org/abs/2610.11370", "authors": ["Meghanadh Pulivarthi", "Swaraj Kumar Biswal", "Kushagra Bhushan", "Yatin Nandwani", "Sachindra Joshi", "Dinesh Raghu"], "brief": "", "categories": ["cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11370", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.11370v1", "published_at": "2026-10-08", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "RIT-RAG: Navigating Document Corpora with Retrieval-Induced Trees", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-evolving LLM agents promise to improve autonomously through continual interaction and learning, reducing their dependence on manually curated supervision. Realizing this promise requires not only updating the agent, but also evolving its training experience as its capabilities change. However, most existing pipelines rely on static datasets or separately updated synthesis models, causing previously useful tasks to become trivial while overly difficult tasks remain uninformative. This growing mismatch between agent capability and training experience limits sustained self-improvement. To address this problem, we propose SynCo, an agentic data synthesis co-training framework for self-evolving LLMs based on multi-agent reinforcement learning. SynCo jointly optimizes two independently parameterized agents: a Synthesizer that constructs training tasks from the Reasoner\u0027s evolving capability state, and a Reasoner that learns from the resulting experience. Each synthesized task induces multiple Reasoner rollouts whose outcomes provide complementary rewards to both agents. Correctness feedback improves the Reasoner, while task quality, answer reliability, and outcome-grounded teachability guide the Synthesizer. Their updates are fed back into subsequent synthesis rounds, allowing the task-solving policy and its training distribution to evolve together. Extensive experiments across eight mathematical reasoning benchmarks demonstrate that SynCo substantially outperforms a broad range of existing synthetic-data methods and controlled baselines, achieving the strongest overall performance while deriving most of its gains from previously unsolved problems.", "arxiv_id": "2610.11345", "arxiv_url": "https://arxiv.org/abs/2610.11345", "authors": ["Wei Yang", "Shawn Li", "Yuehan Qin", "Yawei Wang", "Mingxi Wang", "Shixuan Li", "Tiankai Yang", "Jiate Li", "Jesse Thomason", "Xuezhe Ma", "Yue Zhao"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11345", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.11345v1", "published_at": "2026-10-08", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SynCo: Data Synthesis Co-Training for Self-Evolving LLMs via Multi-Agent Reinforcement Learning", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Voice agents are converging on a collaboration pattern: a full-duplex interaction model stays on the live channel as the entry to the conversation, while search, reasoning, and coding are handled through asynchronous delegation. A duplex model supports continuous listening and speaking, but complex reasoning and tool use may exceed its capabilities. A coding agent can plan and execute extended tasks, but its sequential interface is a poor fit for live conversation. Combining them requires a harness that coordinates task acceptance, progress, cancellation, replacement, and result delivery while keeping the conversation responsive. Existing harnesses often rely on coupled heuristics, making them difficult to improve systematically from evidence. We present DuplexAgent, a full-duplex collaboration system whose harness expresses this workflow as six editable modules, and Duplex-Harness-RSI, a closed loop that revises them from interaction traces. A simulator automatically generates timed test conversations, runs the system, and produces failure traces that identify the collaboration modules requiring repair. Reasoning LLMs and coding agents in the delegation pool also serve the improvement loop: the Exam Planner selects the next tests from observed weaknesses and the repair archive, and the Harness Editor proposes targeted module changes. The capabilities that serve the user thus also improve the system\u0027s coordination. Experiments on intelligence, agentic, and duplex benchmarks show that DuplexAgent combines continuous interaction with difficult reasoning and complex task execution, achieving stronger spoken-knowledge and executable-tool scores than the compared delegated systems while maintaining strong interruption response. A harness ablation further shows that this modular, verifiable loop outperforms the initial harness and repeated editing that lacks its diagnosis and repair archive.", "arxiv_id": "2610.11299", "arxiv_url": "https://arxiv.org/abs/2610.11299", "authors": ["Yingda Shen", "Yuxiang Wang", "Kunyu Feng", "Qinke Ni", "Jiaqi Li", "Minghao Hsu", "Junan Zhang", "Dekun Chen", "Yutong Bian", "Zhizheng Wu"], "brief": "", "categories": ["cs.AI", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11299", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.11299v1", "published_at": "2026-10-08", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DuplexAgent-RSI: Recursive Harness Improvement for Full-Duplex Voice Agent Collaboration", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Verifier scores now serve as both benchmark metrics and training rewards for large language model (LLM) agents, and a change in score is routinely read as a change in capability. It may instead reflect a change in the evaluation. We introduce TRACE, a protocol that turns a score change from a verdict into a testable diagnosis: it applies a targeted change to one part of an evaluation, compares paired runs, checks whether the agent\u0027s behavior changed, and rescores unchanged trajectories to test whether the scoring rule is responsible. In a controlled suite of 25 synthetic tasks, renaming tools lowers a scripted agent\u0027s score by 0.250 even though it performs exactly the same operations; restoring the original names at scoring time closes the entire gap, while the same mutation exposes a genuine behavioral failure in a second agent. On public $\u03c4^2$-bench tasks with four LLM agents, an initial 30-task study finds mixed reward changes whose one clear effect does not replicate. In a larger follow-up on 88 new tasks with repeated runs per condition, renaming tools or reformatting tool outputs leaves reward unchanged to within $\\pm$0.10 for seven of eight agent-change pairs, whereas tool names that deliberately mislead lower every agent\u0027s reward by 0.20-0.44, showing that the setup can detect real effects. Identical reruns flip 15-36% of task outcomes, so single-run comparisons cannot separate presentation effects from run-to-run variation. Two frontier LLM judges give consistent verdicts when a fixed trajectory is presented differently, yet disagree with each other on 57% of the same records, largely because one grades procedure rather than outcome. TRACE thus separates what a score change says about the agent from what it says about the measurement.", "arxiv_id": "2610.11678", "arxiv_url": "https://arxiv.org/abs/2610.11678", "authors": ["Radhika Gaonkar"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11678", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.11678v1", "published_at": "2026-10-08", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TRACE: Diagnosing Verifier Brittleness in Agentic Evaluation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Spatial coding agents significantly improve spatial reasoning in Multimodal Large Language Models (MLLMs) by using external tools to generate verified execution traces. However, this paradigm inherently suffers from prohibitive inference-time overhead and external dependencies. In this paper, we explore whether an MLLM can internalize this agentic capability to operate entirely tool-free. We begin with a simple observation: prompting an MLLM with summarized execution traces of a spatial coding agent naturally unlocks the model\u0027s internal spatial Chain-of-Thought (CoT). Motivated by this, we introduce SpatialOPSD, an on-policy self-distillation framework that internalizes spatial reasoning into a standalone MLLM by formulating verified agent traces as privileged information. To mitigate privileged-information leakage during distillation, we introduce Repetition-Aware Distillation, which combines repetition masking with unlikelihood regularization. Experiments across multiple benchmarks demonstrate that self-distilling SpatialOPSD achieves higher average accuracy than SFT and GRPO on both spatial and OOD datasets, exhibiting superior performance and generalization.", "arxiv_id": "2610.11366", "arxiv_url": "https://arxiv.org/abs/2610.11366", "authors": ["Rongxue Li", "Meng Yang", "Yiru Mao", "Yongliang Tao", "Lulu Hu", "Bin Yang", "Zhao Xu", "Weihua Luo", "Bowen Xu"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.11366", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ATH-MaaS", "pdf_url": "https://arxiv.org/pdf/2610.11366v1", "published_at": "2026-10-08", "score": 0.209, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.11366.png", "title": "SpatialOPSD: Self-Distilling Spatial Intelligence from Verified Coding Agent Traces", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "We propose BrickBench, a benchmark for agentic text-conditioned LEGO-set design. Given a prompt, an agent is tasked with producing an assembly that not only satisfies semantic and design criteria, but that can also be physically built. To do so, it must select parts from a discrete library and reason jointly about local and global constraints. We score validity, alignment, and design across three settings that vary in scale and part availability. We provide BrickAgent, an environment for coding agents to construct, inspect, and validate their designs. We find that leading agents largely satisfy verifiable physical and semantic requirements, but fall short of human designs. We release our benchmark and environment at http://www.brickben.ch", "arxiv_id": "2610.12452", "arxiv_url": "https://arxiv.org/abs/2610.12452", "authors": ["Peter Kulits", "Yiqing Xu", "R. Kenny Jones", "Cordelia Schmid", "Jiajun Wu"], "brief": "", "categories": ["cs.AI", "cs.CV", "cs.GR"], "github_repo": "https://github.com/kulits/BrickAgent", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.12452", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.12452v1", "published_at": "2026-10-08", "score": 0.203, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.12452.png", "title": "BrickBench: Evaluating Agentic Brick Design", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-calling agents have become central to enterprise AI, yet training and evaluating them at scale remains severely constrained due to business and legal restrictions on enterprise systems, data, and database schemas. Tabular data synthesis offers a natural alternative, but its effectiveness is fundamentally limited by structural validity and schema availability, while procedure-based approaches yield the opposite weakness, typically lacking distributional fidelity without per-domain authoring. We introduce **Synthesis Through Simulation** (STS), a **schema--free** data synthesis paradigm in which an LLM agent generates data by executing operations against policy-enforcing APIs within simulated enterprise environments. Because data is generated through the same environment that defines what is valid, STS guarantees structural validity by construction while decoupling validity enforcement from distribution modeling, allowing each to be addressed independently. The **Generalist Populator** (GP), STS\u0027s domain-agnostic agent, addresses the remaining challenges of distributional fidelity and synthesis scalability: GP achieves **0.88** average marginal fidelity and **100\\% constraint satisfaction** across all ten environments *without access to DB schemas*, while statistical synthesizers are inapplicable to seven due to necessary seed data requirements, and schema-privileged agents fail 82\\% of trajectories on airline environment\u0027s tightly coupled workflows due to brittle task composition. We open-source the full framework, all ten environments, and generated datasets at https://github.com/SAP/synthesis-through-simulation.", "arxiv_id": "2610.10549", "arxiv_url": "https://arxiv.org/abs/2610.10549", "authors": ["Yipeng Li", "Ashutosh Hathidara", "Jane Lo", "Harshavardhan Abichandani", "Gunraj Singh", "Atin Ghosh"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10549", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "SAP", "pdf_url": "https://arxiv.org/pdf/2610.10549v1", "published_at": "2026-09-24", "score": 0.191, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.10549.png", "title": "Synthesis Through Simulation: Generating Coherent Enterprise Data via Scalable Agent-System Interaction", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Interactive virtual worlds allow agents to learn throug
