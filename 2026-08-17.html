1c\u6f5c\u7a7a\u95f4\u9884\u8bad\u7ec3\u5230\u50cf\u7d20\u7a7a\u95f4\u540e\u8bad\u7ec3\u201d\u7684\u7b56\u7565\uff0c\u5e76\u7ed9\u51fa\u4e00\u5957\u53ef\u5b9e\u8df5\u7684\u8bad\u7ec3\u914d\u65b9\uff0c\u4f7f\u50cf\u7d20\u7a7a\u95f4\u6a21\u578b\u8fbe\u5230\u6216\u8d85\u8fc7\u6f5c\u7a7a\u95f4\u6a21\u578b\u6548\u679c\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3a\u957f\u671f\u7f3a\u4e4f\u660e\u786e\u8bad\u7ec3\u8303\u5f0f\u7684\u50cf\u7d20\u7a7a\u95f4\u6587\u751f\u56fe\u6269\u6563\u6a21\u578b\u63d0\u4f9b\u4e86\u7ecf\u9a8c\u89c4\u5f8b\u548c\u5b9e\u7528\u914d\u65b9\uff0c\u53ef\u80fd\u63a8\u52a8\u66f4\u9ad8\u6548\u3001\u66f4\u7b80\u6d01\u7684\u56fe\u50cf\u751f\u6210\u7cfb\u7edf\u8bbe\u8ba1\u3002"}, {"abstract": "Generating photorealistic novel views from unposed images requires both 3D geometric understanding and the ability to synthesize unseen content. A natural strategy combines feed-forward 3DGS reconstruction with multi-view diffusion. Yet prior pipelines extract at most one signal from the reconstruction, either pixel rendering or learned features, while none exploits per-Gaussian visibility for occlusion-aware reference selection. This *information disconnect* leaves renderable geometry, visibility cues, and learned features unused. SplatGuide closes this disconnect by reusing a single 3DGS scene across three complementary roles. Rendered images provide pixel-aligned geometric conditioning. Per-Gaussian source-view indices are rendered into a target-view voting map for occlusion-aware reference selection. Reconstruction tokens supply feature-level guidance via cross-attention. All three signals derive from the same reconstruction forward pass. Across RealEstate10K, DL3DV, Tanks-and-Temples, and Mip-NeRF 360, SplatGuide achieves state-of-the-art pose-free novel view synthesis. On RealEstate10K, with a moderate number of input views, it surpasses the ground-truth-pose baseline.", "arxiv_id": "2608.16863", "arxiv_url": "https://arxiv.org/abs/2608.16863", "authors": ["Yejun Zhang", "Zihan Wang", "Xu Ji", "Yihao Wang", "Yuxin Hou", "Junyuan Fang", "Juho-Matti Kilpel\u00e4inen", "Arno Solin", "Hamed Rezazadegan Tavakoli", "Esa Rahtu", "Juho Kannala"], "brief": "SplatGuide \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u65e0\u4f4d\u59ff\u56fe\u50cf\u7684\u65b0\u89c6\u89d2\u5408\u6210\u6846\u67b6\uff0c\u5c06\u4e00\u6b21\u524d\u9988 3DGS \u91cd\u5efa\u540c\u65f6\u7528\u4e8e\u50cf\u7d20\u7ea7\u51e0\u4f55\u6761\u4ef6\u3001\u906e\u6321\u611f\u77e5\u53c2\u8003\u89c6\u89d2\u9009\u62e9\u548c\u7279\u5f81\u7ea7\u6269\u6563\u5f15\u5bfc\u3002\u5b83\u628a\u53ef\u6e32\u67d3\u51e0\u4f55\u3001\u53ef\u89c1\u6027\u4fe1\u606f\u4e0e\u5b66\u4e60\u7279\u5f81\u7edf\u4e00\u5230\u540c\u4e00\u91cd\u5efa\u7ed3\u679c\u4e2d\uff0c\u63d0\u5347\u591a\u89c6\u56fe\u6269\u6563\u5408\u6210\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16863", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5229\u7528 3DGS \u6e32\u67d3\u56fe\u50cf\u4f5c\u4e3a\u4e0e\u76ee\u6807\u89c6\u89d2\u50cf\u7d20\u5bf9\u9f50\u7684\u51e0\u4f55\u6761\u4ef6\uff0c\u8f85\u52a9\u751f\u6210\u903c\u771f\u65b0\u89c6\u89d2", "\u6e32\u67d3\u6bcf\u4e2a\u9ad8\u65af\u5bf9\u5e94\u7684\u6e90\u89c6\u89d2\u7d22\u5f15\uff0c\u5f62\u6210\u76ee\u6807\u89c6\u89d2\u6295\u7968\u56fe\uff0c\u5b9e\u73b0\u906e\u6321\u611f\u77e5\u7684\u53c2\u8003\u56fe\u50cf\u9009\u62e9", "\u5c06 3DGS \u91cd\u5efa tokens \u901a\u8fc7\u4ea4\u53c9\u6ce8\u610f\u529b\u6ce8\u5165\u6269\u6563\u6a21\u578b\uff0c\u5728 RealEstate10K\u3001DL3DV\u3001Tanks-and-Temples\u3001Mip-NeRF 360 \u4e0a\u8fbe\u5230 SOTA"], "keywords": ["\u65b0\u89c6\u89d2\u5408\u6210", "3D\u9ad8\u65af", "\u6269\u6563\u6a21\u578b", "\u4e09\u7ef4\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16863v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SplatGuide: Geometric Priors from 3D Gaussians for Pose-Free Novel View Synthesis", "tldr": "\u75283D\u9ad8\u65af\u7edf\u4e00\u5f15\u5bfc\u65e0\u4f4d\u59ff\u65b0\u89c6\u89d2\u5408\u6210", "upvotes": 0, "what_it_is": "SplatGuide \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u65e0\u4f4d\u59ff\u56fe\u50cf\u7684\u65b0\u89c6\u89d2\u5408\u6210\u6846\u67b6\uff0c\u5c06\u4e00\u6b21\u524d\u9988 3DGS \u91cd\u5efa\u540c\u65f6\u7528\u4e8e\u50cf\u7d20\u7ea7\u51e0\u4f55\u6761\u4ef6\u3001\u906e\u6321\u611f\u77e5\u53c2\u8003\u89c6\u89d2\u9009\u62e9\u548c\u7279\u5f81\u7ea7\u6269\u6563\u5f15\u5bfc\u3002\u5b83\u628a\u53ef\u6e32\u67d3\u51e0\u4f55\u3001\u53ef\u89c1\u6027\u4fe1\u606f\u4e0e\u5b66\u4e60\u7279\u5f81\u7edf\u4e00\u5230\u540c\u4e00\u91cd\u5efa\u7ed3\u679c\u4e2d\uff0c\u63d0\u5347\u591a\u89c6\u56fe\u6269\u6563\u5408\u6210\u8d28\u91cf\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5145\u5206\u590d\u7528\u5355\u6b21 3DGS \u91cd\u5efa\u4e2d\u7684\u6e32\u67d3\u3001\u53ef\u89c1\u6027\u548c\u7279\u5f81\u4fe1\u606f\uff0c\u89e3\u51b3\u4e86\u4ee5\u5f80\u7ba1\u7ebf\u51e0\u4f55\u4e0e\u751f\u6210\u6a21\u5757\u4fe1\u606f\u5272\u88c2\u7684\u95ee\u9898\uff1b\u5728\u65e0\u76f8\u673a\u4f4d\u59ff\u8bbe\u5b9a\u4e0b\u663e\u8457\u63d0\u5347\u65b0\u89c6\u89d2\u5408\u6210\u6548\u679c\uff0c\u751a\u81f3\u5728 RealEstate10K \u4e2d\u7b49\u8f93\u5165\u89c6\u89d2\u6570\u91cf\u4e0b\u8d85\u8fc7\u4f7f\u7528\u771f\u5b9e\u4f4d\u59ff\u7684\u57fa\u7ebf\u3002"}, {"abstract": "A benchmark should deliver more than a scalar score: what makes an evaluation trustworthy is the reasoning that justifies the score. This is especially critical for world models, where judging a rollout requires understanding whether physics, causality, and world state evolve correctly. Humans spot such violations naturally, yet no existing benchmark automates this capability: metrics are computed brute-force, leaving no reasoning chain that can be examined or verified. We introduce HarnessEval-W, an agentified evaluation pipeline that brings the harness paradigm from the LLM ecosystem to world model benchmarking. Rather than applying a fixed rubric, HarnessEval-W interprets the context of each evaluation case, decomposes the evaluation question into measurable subproblems, and spawns specialized sub-agents, each equipped with tailored context and diagnostic tools to reason over its own subproblem. The parent agent then validates the gathered evidence and summarizes it into the final verdict. This hierarchical workflow turns every evaluation into a transparent evidence tree whose complete reasoning chain justifies the result. We apply HarnessEval-W to 18 representative world models over 330 evaluation cases. Its judgments closely align with human preferences while providing verifiable, fine-grained diagnoses of every generated rollout. We open-source the full pipeline as a live benchmark and invite the broad community to contribute to grow new skills and evaluation cases as world models evolve.", "arxiv_id": "2608.16859", "arxiv_url": "https://arxiv.org/abs/2608.16859", "authors": ["Weiliang Chen", "Haowen Sun", "Jun Gao", "Jiawei Chi", "Hanyang Wang", "Qiyu Dai", "Yihao Li", "Hao Li", "Jingnan Gao", "Yi-Hsin Hung", "Xingzhuo Guo", "Shangchen Miao", "Zhiyuan Shi", "Xiang Li", "Fengrui Tian", "Weihua Du", "Ziqi Huang", "Shenyuan Gao", "Siqiao Huang", "Mingyu Liu", "Yifei Li", "Shizun Wang", "Xi Wang", "Tianqi Zhang", "Xue Luo", "Xiyin Ren", "Jinshan Ren", "Xiaoyang Shen", "Xiaobo Hu", "Zhiyang Dou", "Mingyu Ding", "Yichao Yan", "Xinchao Wang", "Yizhou Wang", "Shilong Liu", "Wenzhao Zheng", "Yueqi Duan", "Yuan Gong", "Ziwei Liu", "Ming-Yu Liu", "Jialong Wu", "Jiangran Lyu", "Fangfu Liu"], "brief": "HarnessEval-W \u662f\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u4e16\u754c\u6a21\u578b\u7684\u667a\u80fd\u4f53\u5316\u8bc4\u6d4b\u6d41\u6c34\u7ebf\u3002\u5b83\u6839\u636e\u5177\u4f53\u6848\u4f8b\u62c6\u89e3\u8bc4\u6d4b\u95ee\u9898\uff0c\u8c03\u7528\u4e13\u95e8\u5b50\u667a\u80fd\u4f53\u8bca\u65ad\u7269\u7406\u3001\u56e0\u679c\u548c\u72b6\u6001\u6f14\u5316\u7b49\u95ee\u9898\uff0c\u5e76\u5f62\u6210\u900f\u660e\u7684\u8bc1\u636e\u6811\u4e0e\u6700\u7ec8\u5224\u5b9a\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16859", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06 LLM \u8bc4\u6d4b\u4e2d\u7684 harness \u8303\u5f0f\u5f15\u5165\u4e16\u754c\u6a21\u578b\u57fa\u51c6\uff0c\u4e0d\u518d\u53ea\u8f93\u51fa\u5355\u4e00\u5206\u6570\uff0c\u800c\u662f\u8f93\u51fa\u53ef\u68c0\u67e5\u7684\u63a8\u7406\u94fe\u548c\u8bc1\u636e\u6811", "\u7236\u667a\u80fd\u4f53\u8d1f\u8d23\u7406\u89e3\u8bc4\u6d4b\u4e0a\u4e0b\u6587\u5e76\u5206\u89e3\u4efb\u52a1\uff0c\u591a\u4e2a\u5b50\u667a\u80fd\u4f53\u4f7f\u7528\u5b9a\u5236\u4e0a\u4e0b\u6587\u548c\u8bca\u65ad\u5de5\u5177\u5206\u522b\u8bc4\u4f30\u53ef\u6d4b\u5b50\u95ee\u9898", "\u5728 18 \u4e2a\u4ee3\u8868\u6027\u4e16\u754c\u6a21\u578b\u3001330 \u4e2a\u8bc4\u6d4b\u6848\u4f8b\u4e0a\u9a8c\u8bc1\uff0c\u8bc4\u5224\u7ed3\u679c\u4e0e\u4eba\u7c7b\u504f\u597d\u9ad8\u5ea6\u4e00\u81f4\uff0c\u5e76\u63d0\u4f9b\u7ec6\u7c92\u5ea6 rollout \u8bca\u65ad"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16859v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HarnessEval-W: Agentifying the Evaluation of Visual Worlds", "tldr": "\u7528\u591a\u667a\u80fd\u4f53\u4e3a\u4e16\u754c\u6a21\u578b\u8bc4\u6d4b\u751f\u6210\u53ef\u9a8c\u8bc1\u63a8\u7406\u94fe", "upvotes": 0, "what_it_is": "HarnessEval-W \u662f\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u4e16\u754c\u6a21\u578b\u7684\u667a\u80fd\u4f53\u5316\u8bc4\u6d4b\u6d41\u6c34\u7ebf\u3002\u5b83\u6839\u636e\u5177\u4f53\u6848\u4f8b\u62c6\u89e3\u8bc4\u6d4b\u95ee\u9898\uff0c\u8c03\u7528\u4e13\u95e8\u5b50\u667a\u80fd\u4f53\u8bca\u65ad\u7269\u7406\u3001\u56e0\u679c\u548c\u72b6\u6001\u6f14\u5316\u7b49\u95ee\u9898\uff0c\u5e76\u5f62\u6210\u900f\u660e\u7684\u8bc1\u636e\u6811\u4e0e\u6700\u7ec8\u5224\u5b9a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u4e16\u754c\u6a21\u578b\u8bc4\u6d4b\u4e2d\u201c\u5206\u6570\u4e0d\u53ef\u89e3\u91ca\u201d\u7684\u75db\u70b9\uff0c\u63d0\u4f9b\u4e86\u53ef\u8ffd\u6eaf\u3001\u53ef\u9a8c\u8bc1\u7684\u81ea\u52a8\u5316\u8bc4\u6d4b\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u53d1\u73b0\u7269\u7406\u4e00\u81f4\u6027\u3001\u56e0\u679c\u9519\u8bef\u548c\u4e16\u754c\u72b6\u6001\u6f14\u5316\u95ee\u9898\uff0c\u5e76\u4ee5\u5f00\u6e90 live benchmark \u5f62\u5f0f\u652f\u6301\u6301\u7eed\u6269\u5c55\u3002"}, {"abstract": "Existing image editing frameworks predominantly follow the training paradigm of text-to-image diffusion models. However, extending this paradigm to image editing highlights two inherent discrepancies, specifically, the insufficient attention to edit concept granularity and the training inefficiency caused by sparse supervision signals. To address these issues, we establish a comprehensive hierarchical taxonomy featuring over 1,000 fine-grained edit concepts and build ConceptEdit-12M, a massive dataset of 12 million high-quality editing pairs via an improved synthesis framework. This library-driven approach effectively rectifies the distribution collapse of generated data while ensuring high data fidelity. Furthermore, we propose a dense supervision training strategy that synthesizes multiple non-interfering concepts into single image pairs. By providing richer learning signals, this strategy significantly enhances both training efficiency and overall model performance. Training results validate our strategy, significantly outperforming prior works. Finally, we present ConceptEdit-Bench, a granular evaluation suite designed to diagnose model capabilities across a vast array of real-world scenarios.", "arxiv_id": "2608.16812", "arxiv_url": "https://arxiv.org/abs/2608.16812", "authors": ["Long Cui", "Xiaoqian Liu", "Qi Qin", "Yi Xin", "Tao Lin", "Jianguo Li", "Linfeng Zhang"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u5305\u542b1000\u591a\u4e2a\u7ec6\u7c92\u5ea6\u7f16\u8f91\u6982\u5ff5\u7684\u5c42\u7ea7\u5206\u7c7b\u4f53\u7cfb\uff0c\u5e76\u751f\u6210\u4e861200\u4e07\u9ad8\u8d28\u91cf\u7f16\u8f91\u5bf9\u6570\u636e\u96c6 ConceptEdit-12M\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u5bc6\u96c6\u76d1\u7763\u8bad\u7ec3\u7b56\u7565\uff0c\u5c06\u591a\u4e2a\u4e92\u4e0d\u5e72\u6270\u7684\u7f16\u8f91\u6982\u5ff5\u5408\u6210\u5230\u5355\u4e2a\u56fe\u50cf\u5bf9\u4e2d\uff0c\u4ee5\u63d0\u5347\u8bad\u7ec3\u6548\u7387\u548c\u6a21\u578b\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16812", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u7ec6\u7c92\u5ea6\u56fe\u50cf\u7f16\u8f91\u6982\u5ff5\u5e93\uff0c\u8986\u76d61000\u591a\u4e2a\u7f16\u8f91\u6982\u5ff5\uff0c\u7f13\u89e3\u73b0\u6709\u65b9\u6cd5\u5bf9\u7f16\u8f91\u7c92\u5ea6\u5efa\u6a21\u4e0d\u8db3\u7684\u95ee\u9898\u3002", "\u6784\u5efa ConceptEdit-12M\uff1a1200\u4e07\u9ad8\u8d28\u91cf\u7f16\u8f91\u524d\u540e\u56fe\u50cf\u5bf9\uff0c\u901a\u8fc7\u6539\u8fdb\u5408\u6210\u6d41\u7a0b\u51cf\u5c11\u751f\u6210\u6570\u636e\u5206\u5e03\u574d\u7f29\u5e76\u4fdd\u6301\u6570\u636e\u4fdd\u771f\u5ea6\u3002", "\u63d0\u51fa ConceptEdit-Bench \u7ec6\u7c92\u5ea6\u8bc4\u6d4b\u96c6\uff0c\u7528\u4e8e\u8bca\u65ad\u6a21\u578b\u5728\u591a\u79cd\u771f\u5b9e\u7f16\u8f91\u573a\u666f\u4e0b\u7684\u80fd\u529b\u3002"], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u6269\u6563\u6a21\u578b", "\u6570\u636e\u96c6", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16812v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Unlocking the Potential of Image Editing via Concept Scaling and Dense Supervision", "tldr": "\u7528\u6982\u5ff5\u6269\u5c55\u4e0e\u5bc6\u96c6\u76d1\u7763\u63d0\u5347\u56fe\u50cf\u7f16\u8f91\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86\u5305\u542b1000\u591a\u4e2a\u7ec6\u7c92\u5ea6\u7f16\u8f91\u6982\u5ff5\u7684\u5c42\u7ea7\u5206\u7c7b\u4f53\u7cfb\uff0c\u5e76\u751f\u6210\u4e861200\u4e07\u9ad8\u8d28\u91cf\u7f16\u8f91\u5bf9\u6570\u636e\u96c6 ConceptEdit-12M\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u5bc6\u96c6\u76d1\u7763\u8bad\u7ec3\u7b56\u7565\uff0c\u5c06\u591a\u4e2a\u4e92\u4e0d\u5e72\u6270\u7684\u7f16\u8f91\u6982\u5ff5\u5408\u6210\u5230\u5355\u4e2a\u56fe\u50cf\u5bf9\u4e2d\uff0c\u4ee5\u63d0\u5347\u8bad\u7ec3\u6548\u7387\u548c\u6a21\u578b\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u6570\u636e\u3001\u8bad\u7ec3\u76d1\u7763\u548c\u8bc4\u6d4b\u4e09\u65b9\u9762\u7cfb\u7edf\u589e\u5f3a\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\uff0c\u5c24\u5176\u662f\u5927\u89c4\u6a21\u7ec6\u7c92\u5ea6\u7f16\u8f91\u6982\u5ff5\u548c\u5bc6\u96c6\u76d1\u7763\u7b56\u7565\uff0c\u6709\u671b\u663e\u8457\u63d0\u5347\u53ef\u63a7\u56fe\u50cf\u7f16\u8f91\u7684\u6cdb\u5316\u80fd\u529b\u4e0e\u8bad\u7ec3\u6548\u7387\u3002"}, {"abstract": "Unified image restoration (UIR) aims to recover high-quality (HQ) content from low-quality (LQ) images with different degradations using a single model. Most recent methods adapt large pretrained text-to-image (T2I) latent diffusion models for their strong capacity and generative priors. However, the variational autoencoder (VAE) in latent T2I models may discard restoration-sensitive details, while the open-ended synthesis prior can introduce content-inconsistent artifacts. We present PixRestore, a VAE-free pixel-space Diffusion Transformer (DiT) for UIR, where the diffusion backbone is trained entirely from scratch, without relying on T2I pretraining. PixRestore performs flow matching directly on patchified pixels, preserving fine-grained details while keeping the token sequence tractable. To adapt to different degradations, PixRestore learns to predict the reliability of layer features using LQ--HQ DINO feature similarity. Features from more reliable layers are fused as dense conditioning, while less reliable layers receive stronger HQ-feature supervision to encourage degradation removal. We train PixRestore on a large-scale corpus of diverse scenes and degradations, and further finetune it into a one-step generator using DINO-based adversarial objectives for efficient inference. Experiments on public benchmarks and real-world test sets show that, with only about 50M parameters and single-step inference, PixRestore achieves the best overall fidelity, perceptual quality, and robustness to degradations among competing UIR models while being far more efficient. Larger PixRestore variants can further boost performance, demonstrating the scalability of our pixel-space design. Code and the curated benchmark can be found at https://github.com/csslc/PixRestore.", "arxiv_id": "2608.16793", "arxiv_url": "https://arxiv.org/abs/2608.16793", "authors": ["Lingchen Sun", "Rongyuan Wu", "Xiangtao Kong", "Jixin Zhao", "Qiaosi Yi", "Yujing Sun", "Shuaizheng Liu", "Zhengqiang Zhang", "Lei Zhang"], "brief": "PixRestore \u63d0\u51fa\u4e00\u79cd\u65e0\u9700 VAE\u3001\u65e0\u9700\u6587\u672c\u5230\u56fe\u50cf\u9884\u8bad\u7ec3\u7684\u50cf\u7d20\u7a7a\u95f4 Diffusion Transformer\uff0c\u7528\u5355\u4e00\u6a21\u578b\u5904\u7406\u591a\u79cd\u56fe\u50cf\u9000\u5316\u6062\u590d\u4efb\u52a1\u3002\u5b83\u76f4\u63a5\u5728 patch \u5316\u50cf\u7d20\u4e0a\u505a flow matching\uff0c\u5e76\u901a\u8fc7 DINO \u7279\u5f81\u53ef\u9760\u6027\u5f15\u5bfc\u6761\u4ef6\u878d\u5408\u4e0e\u76d1\u7763\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16793", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6452\u5f03\u6f5c\u7a7a\u95f4 T2I \u6269\u6563\u6a21\u578b\u4e2d\u7684 VAE\uff0c\u907f\u514d\u4e22\u5931\u5bf9\u4fee\u590d\u654f\u611f\u7684\u7ec6\u8282\u5e76\u51cf\u5c11\u751f\u6210\u4e0d\u4e00\u81f4\u4f2a\u5f71", "\u5229\u7528 LQ-HQ DINO \u7279\u5f81\u76f8\u4f3c\u5ea6\u9884\u6d4b\u4e0d\u540c\u5c42\u7279\u5f81\u53ef\u9760\u6027\uff0c\u53ef\u9760\u5c42\u7528\u4e8e\u5bc6\u96c6\u6761\u4ef6\u878d\u5408\uff0c\u4e0d\u53ef\u9760\u5c42\u52a0\u5f3a HQ \u7279\u5f81\u76d1\u7763", "\u7ea6 50M \u53c2\u6570\u5373\u53ef\u5355\u6b65\u63a8\u7406\uff0c\u5728\u516c\u5f00\u4e0e\u771f\u5b9e\u4e16\u754c\u6d4b\u8bd5\u96c6\u4e0a\u53d6\u5f97\u6574\u4f53\u4fdd\u771f\u5ea6\u3001\u611f\u77e5\u8d28\u91cf\u548c\u9c81\u68d2\u6027\u4f18\u52bf"], "keywords": ["\u56fe\u50cf\u4fee\u590d", "\u6269\u6563\u6a21\u578b", "\u89c6\u89c9Transformer", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16793v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PixRestore: Unified Image Restoration via Pixel Diffusion Transformer", "tldr": "\u50cf\u7d20\u7a7a\u95f4DiT\u7edf\u4e00\u4fee\u590d\u591a\u7c7b\u56fe\u50cf\u9000\u5316", "upvotes": 0, "what_it_is": "PixRestore \u63d0\u51fa\u4e00\u79cd\u65e0\u9700 VAE\u3001\u65e0\u9700\u6587\u672c\u5230\u56fe\u50cf\u9884\u8bad\u7ec3\u7684\u50cf\u7d20\u7a7a\u95f4 Diffusion Transformer\uff0c\u7528\u5355\u4e00\u6a21\u578b\u5904\u7406\u591a\u79cd\u56fe\u50cf\u9000\u5316\u6062\u590d\u4efb\u52a1\u3002\u5b83\u76f4\u63a5\u5728 patch \u5316\u50cf\u7d20\u4e0a\u505a flow matching\uff0c\u5e76\u901a\u8fc7 DINO \u7279\u5f81\u53ef\u9760\u6027\u5f15\u5bfc\u6761\u4ef6\u878d\u5408\u4e0e\u76d1\u7763\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u4f9d\u8d56\u5927\u89c4\u6a21 T2I \u6f5c\u6269\u6563\u5148\u9a8c\u7684\u4e3b\u6d41\u7edf\u4e00\u56fe\u50cf\u4fee\u590d\u8def\u7ebf\uff0c\u8bc1\u660e\u4ece\u96f6\u8bad\u7ec3\u7684\u50cf\u7d20\u7a7a\u95f4 DiT \u4e5f\u80fd\u517c\u987e\u7ec6\u8282\u4fdd\u771f\u3001\u6548\u7387\u4e0e\u53ef\u6269\u5c55\u6027\uff0c\u5bf9\u5b9e\u7528\u56fe\u50cf\u4fee\u590d\u6a21\u578b\u8bbe\u8ba1\u6709\u8f83\u9ad8\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Despite recent advances in unified multimodal models for multi-reference image generation, existing benchmarks remain organized around predefined task types (e.g., \"subject composition\"), which are ill-suited to this combinatorial setting and lead to fragmented coverage, uncontrolled complexity, and little diagnostic value. Recognizing that diverse multi-reference tasks share a common set of atomic operations, we adopt a capability-oriented perspective and formalize four operators: Anchor ($f$), Disentangle ($g$), Apply ($\\oplus$), and Compose ($C$). Any multi-reference prompt can then be represented as a compositional formula over these operators, whose structural complexity is quantified by the number of operator slots. Building on this formulation, we construct TRACE-Bench, comprising approximately 1,600 evaluation cases across slot counts 1--8, built from 631 formula templates and around 4,000 reference images spanning diverse artistic styles and real-world subjects. The formula structure directly drives an operator-aligned evaluation protocol for per-capability scoring and a diagnostic tree analysis for recursive failure localization. Evaluating 9 leading models reveals insights invisible to holistic scoring: the primary bottleneck lies in disentanglement ($g$) and attribute binding ($\\oplus$) rather than scene-level composition ($C$), with even the best model scoring only 0.74 on attribute fidelity. Project page: https://amuseum-whr.github.io/TraceBench", "arxiv_id": "2608.16765", "arxiv_url": "https://arxiv.org/abs/2608.16765", "authors": ["Haoran Wang", "Chaofan Ma", "Ran Yi", "Lizhuang Ma"], "brief": "\u8bba\u6587\u63d0\u51fa TRACE-Bench\uff0c\u5c06\u591a\u53c2\u8003\u56fe\u50cf\u751f\u6210\u4efb\u52a1\u4ece\u56fa\u5b9a\u4efb\u52a1\u7c7b\u578b\u6539\u4e3a\u80fd\u529b\u5bfc\u5411\u5206\u89e3\uff0c\u7528 Anchor\u3001Disentangle\u3001Apply\u3001Compose \u56db\u7c7b\u539f\u5b50\u7b97\u5b50\u8868\u793a\u4efb\u610f\u63d0\u793a\u3002\u57fa\u4e8e\u8be5\u5f62\u5f0f\u5316\u6784\u5efa\u7ea6 1600 \u4e2a\u8bc4\u6d4b\u6837\u4f8b\uff0c\u5e76\u63d0\u4f9b\u6309\u80fd\u529b\u8bc4\u5206\u4e0e\u9012\u5f52\u5931\u8d25\u5b9a\u4f4d\u5206\u6790\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16765", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u591a\u53c2\u8003\u63d0\u793a\u8868\u793a\u4e3a\u7b97\u5b50\u7ec4\u5408\u516c\u5f0f\uff0c\u5e76\u7528\u7b97\u5b50\u69fd\u4f4d\u6570\u91cf\u91cf\u5316\u7ed3\u6784\u590d\u6742\u5ea6\uff0c\u8986\u76d6 1 \u5230 8 \u4e2a\u69fd\u4f4d\u3002", "\u6570\u636e\u96c6\u5305\u542b 631 \u4e2a\u516c\u5f0f\u6a21\u677f\u3001\u7ea6 4000 \u5f20\u53c2\u8003\u56fe\u50cf\uff0c\u6db5\u76d6\u591a\u79cd\u827a\u672f\u98ce\u683c\u548c\u771f\u5b9e\u4e16\u754c\u4e3b\u4f53\u3002", "\u8bc4\u6d4b 9 \u4e2a\u4e3b\u6d41\u6a21\u578b\u53d1\u73b0\uff0c\u4e3b\u8981\u74f6\u9888\u5728\u89e3\u8026\u4e0e\u5c5e\u6027\u7ed1\u5b9a\uff0c\u800c\u975e\u573a\u666f\u7ea7\u7ec4\u5408\uff1b\u6700\u4f73\u6a21\u578b\u5c5e\u6027\u4fdd\u771f\u5f97\u5206\u4ec5 0.74\u3002"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u591a\u6a21\u6001", "\u8bc4\u6d4b\u57fa\u51c6", "\u53ef\u63a7\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16765v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TRACE-Bench: Decomposing and Diagnosing Multi-Reference Image Generation", "tldr": "\u7528\u7b97\u5b50\u5206\u89e3\u8bca\u65ad\u591a\u53c2\u8003\u56fe\u50cf\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TRACE-Bench\uff0c\u5c06\u591a\u53c2\u8003\u56fe\u50cf\u751f\u6210\u4efb\u52a1\u4ece\u56fa\u5b9a\u4efb\u52a1\u7c7b\u578b\u6539\u4e3a\u80fd\u529b\u5bfc\u5411\u5206\u89e3\uff0c\u7528 Anchor\u3001Disentangle\u3001Apply\u3001Compose \u56db\u7c7b\u539f\u5b50\u7b97\u5b50\u8868\u793a\u4efb\u610f\u63d0\u793a\u3002\u57fa\u4e8e\u8be5\u5f62\u5f0f\u5316\u6784\u5efa\u7ea6 1600 \u4e2a\u8bc4\u6d4b\u6837\u4f8b\uff0c\u5e76\u63d0\u4f9b\u6309\u80fd\u529b\u8bc4\u5206\u4e0e\u9012\u5f52\u5931\u8d25\u5b9a\u4f4d\u5206\u6790\u3002", "why_notable": "TRACE-Bench \u4e0d\u53ea\u662f\u7ed9\u51fa\u6574\u4f53\u5206\u6570\uff0c\u800c\u662f\u80fd\u5b9a\u4f4d\u591a\u53c2\u8003\u56fe\u50cf\u751f\u6210\u5931\u8d25\u53d1\u751f\u5728\u54ea\u7c7b\u80fd\u529b\u4e0a\uff0c\u4e3a\u6a21\u578b\u6539\u8fdb\u548c\u53ef\u63a7\u751f\u6210\u8bc4\u6d4b\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u7684\u8bca\u65ad\u5de5\u5177\u3002"}, {"abstract": "Despite progress in instruction-based video editing, unimodal textual instructions inherently struggle to convey fine-grained textures and complex dynamics. To bridge this perceptual gap, we propose Visual In-context Editing, a new paradigm elevating video editing from textual instructions to multi-modal visual guidance encompassing single image, image pair, and video pair. To facilitate this paradigm, we curate VicEdit-400K, the first large-scale dataset for visual in-context video editing. We develop an automated pipeline to generate 400K high-quality samples across ten task types, ensuring superior visual fidelity and semantic consistency through multi-dimensional filtering. Leveraging this foundation, we introduce VicEdit, a unified framework to bridge visual and textual contexts. To adaptively extract editing semantics from heterogeneous references, we design Modality-Adaptive Semantic Distillation, which produces modality-specific semantic tokens from visual references. These tokens are then synergistically integrated with textual instructions through Dual-Context Injection, enabling the generation process to benefit from both visual and textual signals. Extensive evaluations on VicEditBench demonstrate that VicEdit achieves state-of-the-art performance across both basic instruction editing and visual in-context editing tasks, establishing visual in-context learning as a powerful and controllable paradigm for video editing.", "arxiv_id": "2608.16745", "arxiv_url": "https://arxiv.org/abs/2608.16745", "authors": ["Yuji Wang", "Teng Hu", "Yuheng Chen", "Ran Yi", "Han Feng", "Weijian Cao", "Chengjie Wang", "Lizhuang Ma", "Jiangning Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Visual In-context Editing \u8303\u5f0f\uff0c\u7528\u5355\u56fe\u3001\u56fe\u50cf\u5bf9\u6216\u89c6\u9891\u5bf9\u4f5c\u4e3a\u89c6\u89c9\u53c2\u8003\u6765\u6307\u5bfc\u89c6\u9891\u7f16\u8f91\uff0c\u5f25\u8865\u7eaf\u6587\u672c\u6307\u4ee4\u96be\u4ee5\u8868\u8fbe\u7ec6\u8282\u7eb9\u7406\u548c\u590d\u6742\u52a8\u6001\u7684\u95ee\u9898\u3002\u540c\u65f6\u6784\u5efa VicEdit-400K \u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51fa\u7edf\u4e00\u6a21\u578b VicEdit \u878d\u5408\u89c6\u89c9\u4e0e\u6587\u672c\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16745", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u9996\u4e2a\u5927\u89c4\u6a21\u89c6\u89c9\u4e0a\u4e0b\u6587\u89c6\u9891\u7f16\u8f91\u6570\u636e\u96c6 VicEdit-400K\uff0c\u8986\u76d610\u7c7b\u4efb\u52a1\u300140\u4e07\u9ad8\u8d28\u91cf\u6837\u672c\uff0c\u5e76\u901a\u8fc7\u591a\u7ef4\u8fc7\u6ee4\u4fdd\u8bc1\u89c6\u89c9\u8d28\u91cf\u4e0e\u8bed\u4e49\u4e00\u81f4\u6027\u3002", "\u63d0\u51fa Modality-Adaptive Semantic Distillation\uff0c\u4ece\u5355\u56fe\u3001\u56fe\u50cf\u5bf9\u3001\u89c6\u9891\u5bf9\u7b49\u5f02\u6784\u89c6\u89c9\u53c2\u8003\u4e2d\u81ea\u9002\u5e94\u63d0\u53d6\u7f16\u8f91\u8bed\u4e49 token\u3002", "\u8bbe\u8ba1 Dual-Context Injection\uff0c\u5c06\u89c6\u89c9\u8bed\u4e49 token \u4e0e\u6587\u672c\u6307\u4ee4\u534f\u540c\u6ce8\u5165\u751f\u6210\u8fc7\u7a0b\uff0c\u5728 VicEditBench \u4e0a\u540c\u65f6\u63d0\u5347\u57fa\u7840\u6307\u4ee4\u7f16\u8f91\u548c\u89c6\u89c9\u4e0a\u4e0b\u6587\u7f16\u8f91\u6027\u80fd\u3002"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u591a\u6a21\u6001", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16745v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "VicEdit: Learning to Edit Videos from Visual In-Context Examples", "tldr": "\u7528\u89c6\u89c9\u4e0a\u4e0b\u6587\u6307\u5bfc\u7cbe\u7ec6\u89c6\u9891\u7f16\u8f91", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Visual In-context Editing \u8303\u5f0f\uff0c\u7528\u5355\u56fe\u3001\u56fe\u50cf\u5bf9\u6216\u89c6\u9891\u5bf9\u4f5c\u4e3a\u89c6\u89c9\u53c2\u8003\u6765\u6307\u5bfc\u89c6\u9891\u7f16\u8f91\uff0c\u5f25\u8865\u7eaf\u6587\u672c\u6307\u4ee4\u96be\u4ee5\u8868\u8fbe\u7ec6\u8282\u7eb9\u7406\u548c\u590d\u6742\u52a8\u6001\u7684\u95ee\u9898\u3002\u540c\u65f6\u6784\u5efa VicEdit-400K \u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51fa\u7edf\u4e00\u6a21\u578b VicEdit \u878d\u5408\u89c6\u89c9\u4e0e\u6587\u672c\u4e0a\u4e0b\u6587\u3002", "why_notable": "\u5b83\u5c06\u89c6\u9891\u7f16\u8f91\u4ece\u5355\u7eaf\u6587\u672c\u63a7\u5236\u6269\u5c55\u5230\u53ef\u611f\u77e5\u3001\u53ef\u793a\u8303\u7684\u89c6\u89c9\u4e0a\u4e0b\u6587\u63a7\u5236\uff0c\u66f4\u9002\u5408\u8868\u8fbe\u7eb9\u7406\u3001\u98ce\u683c\u8fc1\u79fb\u548c\u52a8\u6001\u53d8\u5316\u7b49\u590d\u6742\u7f16\u8f91\u610f\u56fe\uff1b\u914d\u5957\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\u548c\u57fa\u51c6\u4e5f\u53ef\u80fd\u63a8\u52a8\u89c6\u9891\u7f16\u8f91\u6a21\u578b\u7684\u65b0\u8bad\u7ec3\u8303\u5f0f\u3002"}, {"abstract": "Corrupted, inconsistent, or anomalous data silently threatens the safety and reliability of medical AI. Despite growing regulatory recognition of dataset quality assurance (QA) for high-risk medical AI, scalable automated detection remains underdeveloped. We employ unsupervised anomaly detection (AD) and out-of-distribution (OOD) detection as an automated dataset QA mechanism for multi-center dynamic contrast-enhanced breast MRI. We build a controlled AD benchmark of 17 realistic QA-relevant anomaly types from six public datasets (protocol violations, processing errors, incorrect anatomical regions) and propose a taxonomy of radiological image anomalies based on human visual perception, enabling fine-grained analysis of AD failure modes. The benchmark includes near-, medium-far-, far-OOD samples, as well as in-distribution and external normal data. Four methods are evaluated: a projection-based method extended with a domain-specific feature extractor and a novel positional encoding, a reconstruction-based approach extended to full 3D volumes with an augmented training objective, and two unmodified hybrid OOD detection methods. Medium-far- and far-OOD samples are detected reliably, whereas near-OOD samples and external normal data from unseen institutions expose method-specific differences. The 3D reconstruction-based approach best balances detection performance (AUROC: 0.936) and generalization to unseen institutions. The projection-based method with positional encoding achieves the highest overall detection performance (AUROC: 0.954). Both hybrid methods exhibit critical failure modes, confirming that methods validated for one modality or anatomy may not generalize without domain-specific adaptation. Implants and mastectomies remain an open challenge for all methods. Our results establish a foundation and practical guidance on scalable unsupervised QA in medical AI pipelines.", "arxiv_id": "2608.16725", "arxiv_url": "https://arxiv.org/abs/2608.16725", "authors": ["Chiara Tappermann", "Steffen Renisch", "Lars Ole Schwen", "Hans Meine", "Horst K. Hahn", "Eike Petersen"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u9762\u5411\u591a\u4e2d\u5fc3\u52a8\u6001\u589e\u5f3a\u4e73\u817aMRI\u7684\u6570\u636e\u8d28\u91cf\u4fdd\u8bc1\u57fa\u51c6\uff0c\u8986\u76d617\u7c7b\u771f\u5b9eQA\u76f8\u5173\u5f02\u5e38\uff0c\u5e76\u8bc4\u4f30\u591a\u79cd\u65e0\u76d1\u7763\u5f02\u5e38/OOD\u68c0\u6d4b\u65b9\u6cd5\u3002\u7814\u7a76\u8fd8\u63d0\u51fa\u57fa\u4e8e\u4eba\u7c7b\u89c6\u89c9\u611f\u77e5\u7684\u653e\u5c04\u5f71\u50cf\u5f02\u5e38\u5206\u7c7b\u6cd5\uff0c\u7528\u4e8e\u5206\u6790\u4e0d\u540c\u65b9\u6cd5\u7684\u5931\u6548\u6a21\u5f0f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16725", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u6765\u81ea6\u4e2a\u516c\u5f00\u6570\u636e\u96c6\uff0c\u5305\u542b\u534f\u8bae\u8fdd\u89c4\u3001\u5904\u7406\u9519\u8bef\u3001\u9519\u8bef\u89e3\u5256\u533a\u57df\u7b4917\u7c7b\u5f02\u5e38\uff0c\u5e76\u533a\u5206\u8fd1\u57df\u3001\u4e2d\u8fdc\u57df\u3001\u8fdc\u57dfOOD\u6837\u672c\u53ca\u5916\u90e8\u6b63\u5e38\u6570\u636e\u3002", "\u8bc4\u4f304\u7c7b\u65b9\u6cd5\uff1a\u6539\u8fdb\u7684\u6295\u5f71\u5f0f\u68c0\u6d4b\u3001\u6269\u5c55\u52303D\u4f53\u6570\u636e\u7684\u91cd\u5efa\u5f0f\u65b9\u6cd5\uff0c\u4ee5\u53ca\u4e24\u79cd\u672a\u6539\u52a8\u7684\u6df7\u5408OOD\u68c0\u6d4b\u65b9\u6cd5\u3002", "\u6295\u5f71\u5f0f\u65b9\u6cd5\u52a0\u5165\u4f4d\u7f6e\u7f16\u7801\u540e\u603b\u4f53AUROC\u6700\u9ad8\u8fbe0.954\uff1b3D\u91cd\u5efa\u5f0f\u65b9\u6cd5\u5728\u68c0\u6d4b\u6027\u80fd\u4e0e\u8de8\u673a\u6784\u6cdb\u5316\u4e4b\u95f4\u6700\u4f73\uff0cAUROC\u4e3a0.936\u3002"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u5f02\u5e38\u68c0\u6d4b", "\u6570\u636e\u8d28\u91cf", "OOD\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16725v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Unsupervised Anomaly Detection for Image Dataset Quality Assurance in Multi-Center Breast MRI", "tldr": "\u7528\u65e0\u76d1\u7763\u5f02\u5e38\u68c0\u6d4b\u4fdd\u969c\u591a\u4e2d\u5fc3\u4e73\u817aMRI\u6570\u636e\u8d28\u91cf", "upvotes": 0, "what_it_is": "\u672c\u6587\u6784\u5efa\u4e86\u9762\u5411\u591a\u4e2d\u5fc3\u52a8\u6001\u589e\u5f3a\u4e73\u817aMRI\u7684\u6570\u636e\u8d28\u91cf\u4fdd\u8bc1\u57fa\u51c6\uff0c\u8986\u76d617\u7c7b\u771f\u5b9eQA\u76f8\u5173\u5f02\u5e38\uff0c\u5e76\u8bc4\u4f30\u591a\u79cd\u65e0\u76d1\u7763\u5f02\u5e38/OOD\u68c0\u6d4b\u65b9\u6cd5\u3002\u7814\u7a76\u8fd8\u63d0\u51fa\u57fa\u4e8e\u4eba\u7c7b\u89c6\u89c9\u611f\u77e5\u7684\u653e\u5c04\u5f71\u50cf\u5f02\u5e38\u5206\u7c7b\u6cd5\uff0c\u7528\u4e8e\u5206\u6790\u4e0d\u540c\u65b9\u6cd5\u7684\u5931\u6548\u6a21\u5f0f\u3002", "why_notable": "\u533b\u7597AI\u9ad8\u5ea6\u4f9d\u8d56\u6570\u636e\u8d28\u91cf\uff0c\u4f46\u591a\u4e2d\u5fc3\u5f71\u50cf\u6570\u636e\u4e2d\u7684\u9690\u6027\u5f02\u5e38\u96be\u4ee5\u4eba\u5de5\u89c4\u6a21\u5316\u6392\u67e5\u3002\u8be5\u7814\u7a76\u63d0\u4f9b\u4e86\u7cfb\u7edf\u57fa\u51c6\u3001\u5f02\u5e38\u5206\u7c7b\u548c\u65b9\u6cd5\u5bf9\u6bd4\uff0c\u6307\u51fa\u901a\u7528OOD\u65b9\u6cd5\u5728\u533b\u5b66\u5f71\u50cf\u4e2d\u5b58\u5728\u5173\u952e\u5931\u6548\u6a21\u5f0f\uff0c\u5bf9\u4e34\u5e8a\u7ea7\u6570\u636eQA\u6d41\u6c34\u7ebf\u5177\u6709\u5b9e\u9645\u6307\u5bfc\u4ef7\u503c\u3002"}, {"abstract": "Identifying cell types directly from routine haematoxylin and eosin (H\u0026E) histology would enable single-cell analysis at scale, but training such models has relied on manual pathologist annotations, which are slow, expensive and unreliable for many cell types. We instead supervise morphology with molecules. Imaging-based spatial transcriptomics profiles individual cells in situ on a section that can afterwards be stained with H\u0026E, so that molecular identity and morphology are observed for the same physical cell. We assembled 81 such paired Xenium sections spanning 16 organs, derived per-cell labels by clustering, marker-gene annotation, organ-wise human review and quality control, and mapped them onto the cell types commonly reported in each organ. This yielded 15.4 million cells, each with a paired H\u0026E image patch and one of 23 cell types, on which we trained CytoFormer, a cell foundation model with a multi-task, per-organ classification head. On spatially held-out tissue CytoFormer reached an accuracy of 0.85 and a macro-F1 of 0.78 across all 16 organs, and its predictions reproduced the tissue architecture of an entire held-out section. The representation also transfers: with the encoder frozen, a linear head on CytoFormer features performed better than six pathology foundation models on four expert-annotated benchmarks, including on organs and cell types that were not part of pretraining. Finally, in an interactive active-learning setting, CytoFormer\u0027s embeddings are markedly more label-efficient than existing pathology foundation models, detecting normal epithelium amid look-alike tumour with an F1 of 0.82 from only a few annotations and leading the strongest baseline by 0.13 in F1. CytoFormer turns paired H\u0026E and spatial transcriptomics into a reusable, label-efficient representation for cell-level analysis of routine histology.", "arxiv_id": "2608.16718", "arxiv_url": "https://arxiv.org/abs/2608.16718", "authors": ["Jialu Yao", "Songhao Li", "Alina Yu", "Zhi Huang"], "brief": "\u8bba\u6587\u63d0\u51fa CytoFormer\uff1a\u5229\u7528\u540c\u4e00\u7ec6\u80de\u7684 H\u0026E \u56fe\u50cf\u4e0e\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u5206\u5b50\u8eab\u4efd\u914d\u5bf9\u6570\u636e\uff0c\u8bad\u7ec3\u9762\u5411\u75c5\u7406\u7ec6\u80de\u5206\u7c7b\u7684\u57fa\u7840\u6a21\u578b\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u8986\u76d616\u4e2a\u5668\u5b98\u30011540\u4e07\u7ec6\u80de\u300123\u7c7b\u7ec6\u80de\u7c7b\u578b\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u9a8c\u8bc1\u5176\u5728\u8de8\u7ec4\u7ec7\u3001\u8fc1\u79fb\u548c\u4e3b\u52a8\u5b66\u4e60\u573a\u666f\u4e2d\u7684\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16718", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc781\u5f20\u914d\u5bf9 Xenium \u7a7a\u95f4\u8f6c\u5f55\u7ec4\u4e0e H\u0026E \u5207\u7247\uff0c\u4e3a\u5355\u7ec6\u80de\u56fe\u50cf\u5757\u751f\u6210\u5206\u5b50\u76d1\u7763\u6807\u7b7e\uff0c\u51cf\u5c11\u5bf9\u75c5\u7406\u4e13\u5bb6\u624b\u5de5\u6807\u6ce8\u7684\u4f9d\u8d56", "CytoFormer \u5728\u7a7a\u95f4\u7559\u51fa\u7ec4\u7ec7\u4e0a\u8fbe\u52300.85\u51c6\u786e\u7387\u548c0.78\u5b8fF1\uff0c\u5e76\u80fd\u91cd\u73b0\u6574\u5f20\u7559\u51fa\u5207\u7247\u7684\u7ec4\u7ec7\u7ed3\u6784", "\u51bb\u7ed3\u7f16\u7801\u5668\u540e\uff0c\u7ebf\u6027\u5206\u7c7b\u5934\u57284\u4e2a\u4e13\u5bb6\u6807\u6ce8\u57fa\u51c6\u4e0a\u4f18\u4e8e6\u4e2a\u75c5\u7406\u57fa\u7840\u6a21\u578b\uff0c\u4e14\u5728\u5c11\u91cf\u6807\u6ce8\u4e3b\u52a8\u5b66\u4e60\u4e2d\u66f4\u5177\u6807\u7b7e\u6548\u7387"], "keywords": ["\u75c5\u7406\u57fa\u7840\u6a21\u578b", "\u7a7a\u95f4\u8f6c\u5f55\u7ec4", "\u7ec6\u80de\u5206\u7c7b", "\u533b\u5b66\u56fe\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16718v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CytoFormer: A Molecularly Supervised Cell Foundation Model for Histopathology Cell Classification", "tldr": "\u7528\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u76d1\u7763H\u0026E\u7ec6\u80de\u57fa\u7840\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CytoFormer\uff1a\u5229\u7528\u540c\u4e00\u7ec6\u80de\u7684 H\u0026E \u56fe\u50cf\u4e0e\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u5206\u5b50\u8eab\u4efd\u914d\u5bf9\u6570\u636e\uff0c\u8bad\u7ec3\u9762\u5411\u75c5\u7406\u7ec6\u80de\u5206\u7c7b\u7684\u57fa\u7840\u6a21\u578b\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u8986\u76d616\u4e2a\u5668\u5b98\u30011540\u4e07\u7ec6\u80de\u300123\u7c7b\u7ec6\u80de\u7c7b\u578b\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u9a8c\u8bc1\u5176\u5728\u8de8\u7ec4\u7ec7\u3001\u8fc1\u79fb\u548c\u4e3b\u52a8\u5b66\u4e60\u573a\u666f\u4e2d\u7684\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u7684\u5206\u5b50\u4fe1\u606f\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u7684\u7ec6\u80de\u7ea7\u75c5\u7406\u8868\u5f81\uff0c\u4e3a\u5e38\u89c4 H\u0026E \u5207\u7247\u7684\u5927\u89c4\u6a21\u5355\u7ec6\u80de\u5206\u6790\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u3001\u4f4e\u6807\u6ce8\u6210\u672c\u7684\u8def\u5f84\uff0c\u5177\u6709\u8f83\u5f3a\u4e34\u5e8a\u75c5\u7406\u548c\u751f\u7269\u533b\u5b66\u7814\u7a76\u4ef7\u503c\u3002"}, {"abstract": "Video generation is rapidly evolving from single-shot clips to multi-shot narratives, where the human character serves as the core narrative anchor. However, existing benchmarks mainly assess character appearance or individual-shot quality, without measuring whether physical and emotional states remain coherent across cuts. They also rarely provide criterion-specific evaluation methods, although physical continuity, facial dynamics, and cinematic relations require different visual, temporal, and relational evidence. To address these limitations, we introduce PersonaShot, the first person-centric benchmark for narrative continuity in multi-shot video generation. PersonaShot contains approximately 1,000 multi-shot segments and 16 metrics spanning physical continuity, affective dynamics, and cinematic grammar. \\textbf{\\textit{1)} Narrative Continuity Benchmark:} We evaluate character coherence across three temporal levels: within-shot states, cross-shot transitions, and sequence-level trajectories. \\textbf{\\textit{2)} Human-Aligned Specialist Evaluators:} We distill reasoning from a large multimodal teacher into lightweight criterion-specific evaluators, each grounded in the visual, temporal, or relational evidence required by its metric, and align them with expert human judgments. \\textbf{\\textit{3)} Systematic Evaluation and Insights:} Our evaluation reveals distinct capability profiles across state-of-the-art models and a clear gap between perceptual quality and cross-shot narrative continuity. Even visually compelling videos frequently exhibit physical-state resets, abrupt affective shifts, and broken cinematic relations across shots. Human studies further demonstrate strong agreement between our evaluators and expert judgments.", "arxiv_id": "2608.16717", "arxiv_url": "https://arxiv.org/abs/2608.16717", "authors": ["Yuji Wang", "Yuheng Chen", "Teng Hu", "Ran Yi", "Yijia Hong", "Han Feng", "Weijian Cao", "Chengjie Wang", "Lizhuang Ma", "Jiangning Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa PersonaShot\uff0c\u7528\u4e8e\u8bc4\u6d4b\u591a\u955c\u5934\u89c6\u9891\u751f\u6210\u4e2d\u4ee5\u4eba\u7269\u4e3a\u6838\u5fc3\u7684\u53d9\u4e8b\u8fde\u7eed\u6027\u3002\u5b83\u8986\u76d6\u7ea61000\u4e2a\u591a\u955c\u5934\u7247\u6bb5\u548c16\u9879\u6307\u6807\uff0c\u8861\u91cf\u4eba\u7269\u7269\u7406\u72b6\u6001\u3001\u60c5\u7eea\u52a8\u6001\u4e0e\u7535\u5f71\u8bed\u6cd5\u5728\u955c\u5934\u5185\u3001\u8de8\u955c\u5934\u548c\u5e8f\u5217\u7ea7\u522b\u7684\u8fde\u8d2f\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16717", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u955c\u5934\u5185\u72b6\u6001\u3001\u8de8\u955c\u5934\u8f6c\u573a\u3001\u5e8f\u5217\u7ea7\u8f68\u8ff9\u4e09\u4e2a\u65f6\u95f4\u5c42\u7ea7\u8bc4\u4f30\u4eba\u7269\u8fde\u7eed\u6027", "\u6784\u5efa\u8f7b\u91cf\u7ea7\u3001\u6307\u6807\u4e13\u7528\u8bc4\u4f30\u5668\uff0c\u7531\u5927\u578b\u591a\u6a21\u6001\u6559\u5e08\u6a21\u578b\u84b8\u998f\u63a8\u7406\u80fd\u529b\uff0c\u5e76\u4e0e\u4e13\u5bb6\u4eba\u5de5\u5224\u65ad\u5bf9\u9f50", "\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u611f\u77e5\u8d28\u91cf\u4e0e\u8de8\u955c\u5934\u53d9\u4e8b\u8fde\u7eed\u6027\u5b58\u5728\u660e\u663e\u843d\u5dee\uff0c\u5e38\u51fa\u73b0\u72b6\u6001\u91cd\u7f6e\u3001\u60c5\u7eea\u7a81\u53d8\u548c\u955c\u5934\u5173\u7cfb\u65ad\u88c2"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001\u8bc4\u6d4b", "\u53d9\u4e8b\u8fde\u7eed\u6027", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16717v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PersonaShot: Benchmarking Person-Centric Narrative Continuity in Multi-Shot Video Generation", "tldr": "\u9996\u4e2a\u591a\u4eba\u955c\u5934\u4eba\u7269\u53d9\u4e8b\u8fde\u7eed\u6027\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PersonaShot\uff0c\u7528\u4e8e\u8bc4\u6d4b\u591a\u955c\u5934\u89c6\u9891\u751f\u6210\u4e2d\u4ee5\u4eba\u7269\u4e3a\u6838\u5fc3\u7684\u53d9\u4e8b\u8fde\u7eed\u6027\u3002\u5b83\u8986\u76d6\u7ea61000\u4e2a\u591a\u955c\u5934\u7247\u6bb5\u548c16\u9879\u6307\u6807\uff0c\u8861\u91cf\u4eba\u7269\u7269\u7406\u72b6\u6001\u3001\u60c5\u7eea\u52a8\u6001\u4e0e\u7535\u5f71\u8bed\u6cd5\u5728\u955c\u5934\u5185\u3001\u8de8\u955c\u5934\u548c\u5e8f\u5217\u7ea7\u522b\u7684\u8fde\u8d2f\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u4e0a\u4e86\u591a\u955c\u5934\u89c6\u9891\u751f\u6210\u8bc4\u6d4b\u4e2d\u201c\u4eba\u7269\u53d9\u4e8b\u8fde\u7eed\u6027\u201d\u7684\u5173\u952e\u7a7a\u767d\uff0c\u4e0d\u53ea\u770b\u5355\u955c\u5934\u753b\u8d28\u6216\u89d2\u8272\u5916\u89c2\u4e00\u81f4\u6027\uff0c\u800c\u662f\u7cfb\u7edf\u8861\u91cf\u6545\u4e8b\u63a8\u8fdb\u4e2d\u7684\u72b6\u6001\u3001\u60c5\u7eea\u548c\u7535\u5f71\u5173\u7cfb\u8fde\u8d2f\u6027\uff0c\u5bf9\u957f\u89c6\u9891\u751f\u6210\u4e0e\u5f71\u89c6\u7ea7\u751f\u6210\u6a21\u578b\u8bc4\u6d4b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Identity-preserving video generation (IPVG) requires synthesizing videos that are faithful to both reference subjects and text prompts. Existing methods are often hindered by high tuning costs or limited input-level enhancements, struggling to maintain rigid identity consistency during complex, long-sequence actions. To address these limitations, we propose KeyID, a training-free IPVG framework that decouples the synthesis of video dynamics from the injection of identity. Specifically, KeyID comprises two components: (1) Reference-Aware Video Generation, which produces an identity-agnostic video draft aligned with multiple references, and (2) Identity-Preserved Keyframe Editing, which integrates the target identity via sparse keyframe correction and subsequent motion interpolation. By shifting from dense frame-level supervision to sparse keyframe-level refinement, KeyID effectively resolves the capacity conflict between prompt adherence and identity fidelity. Crucially, our modular design allows seamless extension to multi-subject references and complex sequential action generation without additional training. KeyID outperforms prior works and is validated by automatic and human evaluations on the official challenge benchmark, ultimately securing the runner-up position in the Track 2 (Sequential Action) of the ACM Multimedia 2026 IPVG Grand Challenge. Source code is available at https://github.com/WISLab-GDUT/KeyID.", "arxiv_id": "2608.16154", "arxiv_url": "https://arxiv.org/abs/2608.16154", "authors": ["Jianjie Luo", "Yiming Zhong", "Haoming Shen", "Yupeng Xiao", "Zhenguo Yang"], "brief": "KeyID \u662f\u4e00\u4e2a\u8bad\u7ec3\u514d\u8d39\u7684\u8eab\u4efd\u4fdd\u6301\u89c6\u9891\u751f\u6210\u6846\u67b6\uff0c\u5c06\u89c6\u9891\u52a8\u6001\u751f\u6210\u4e0e\u8eab\u4efd\u6ce8\u5165\u89e3\u8026\u3002\u5b83\u5148\u751f\u6210\u4e0e\u63d0\u793a\u548c\u53c2\u8003\u5bf9\u9f50\u4f46\u4e0d\u7ed1\u5b9a\u8eab\u4efd\u7684\u89c6\u9891\u8349\u7a3f\uff0c\u518d\u901a\u8fc7\u7a00\u758f\u5173\u952e\u5e27\u7f16\u8f91\u6ce8\u5165\u76ee\u6807\u8eab\u4efd\u5e76\u63d2\u503c\u8865\u5168\u8fd0\u52a8\u3002", "categories": ["cs.CV", "cs.GR", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16154", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u201c\u53c2\u8003\u611f\u77e5\u89c6\u9891\u751f\u6210 + \u8eab\u4efd\u4fdd\u6301\u5173\u952e\u5e27\u7f16\u8f91\u201d\u7684\u4e24\u9636\u6bb5\u6a21\u5757\u5316\u8bbe\u8ba1\uff0c\u7f13\u89e3\u63d0\u793a\u9075\u5faa\u4e0e\u8eab\u4efd\u4fdd\u771f\u4e4b\u95f4\u7684\u80fd\u529b\u51b2\u7a81", "\u4ece\u9010\u5e27\u5bc6\u96c6\u76d1\u7763\u8f6c\u5411\u7a00\u758f\u5173\u952e\u5e27\u4fee\u6b63\uff0c\u964d\u4f4e\u8eab\u4efd\u6ce8\u5165\u6210\u672c\u5e76\u63d0\u5347\u957f\u5e8f\u5217\u590d\u6742\u52a8\u4f5c\u4e2d\u7684\u4e00\u81f4\u6027", "\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u5373\u53ef\u6269\u5c55\u5230\u591a\u4e3b\u4f53\u53c2\u8003\u548c\u590d\u6742\u8fde\u7eed\u52a8\u4f5c\u751f\u6210\uff0c\u5728 ACM Multimedia 2026 IPVG \u6311\u6218\u8d5b Track 2 \u83b7\u5f97\u7b2c\u4e8c\u540d"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u8eab\u4efd\u4fdd\u6301", "\u5173\u952e\u5e27\u7f16\u8f91", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16154v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "KeyID: Decoupled Drafting and Keyframe Editing for Identity-Preserving Video Generation", "tldr": "\u8bad\u7ec3\u514d\u8d39\u6846\u67b6\u63d0\u5347\u89c6\u9891\u751f\u6210\u8eab\u4efd\u4e00\u81f4\u6027", "upvotes": 0, "what_it_is": "KeyID \u662f\u4e00\u4e2a\u8bad\u7ec3\u514d\u8d39\u7684\u8eab\u4efd\u4fdd\u6301\u89c6\u9891\u751f\u6210\u6846\u67b6\uff0c\u5c06\u89c6\u9891\u52a8\u6001\u751f\u6210\u4e0e\u8eab\u4efd\u6ce8\u5165\u89e3\u8026\u3002\u5b83\u5148\u751f\u6210\u4e0e\u63d0\u793a\u548c\u53c2\u8003\u5bf9\u9f50\u4f46\u4e0d\u7ed1\u5b9a\u8eab\u4efd\u7684\u89c6\u9891\u8349\u7a3f\uff0c\u518d\u901a\u8fc7\u7a00\u758f\u5173\u952e\u5e27\u7f16\u8f91\u6ce8\u5165\u76ee\u6807\u8eab\u4efd\u5e76\u63d2\u503c\u8865\u5168\u8fd0\u52a8\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4ee5\u8bad\u7ec3\u514d\u8d39\u3001\u6a21\u5757\u5316\u65b9\u5f0f\u89e3\u51b3\u8eab\u4efd\u4fdd\u6301\u89c6\u9891\u751f\u6210\u4e2d\u7684\u957f\u5e8f\u5217\u8eab\u4efd\u6f02\u79fb\u95ee\u9898\uff0c\u517c\u5177\u5b9e\u7528\u6027\u548c\u53ef\u6269\u5c55\u6027\uff0c\u5bf9\u591a\u4e3b\u4f53\u3001\u590d\u6742\u52a8\u4f5c\u89c6\u9891\u751f\u6210\u5177\u6709\u8f83\u9ad8\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present AnyTalk, a novel method for generating 3D speech animations for arbitrary characters without requiring any animation data. While existing audio-driven 3D speech animation methods rely on character-specific training data or laborious rigging/re-meshing, AnyTalk circumvents these limitations by leveraging recent video diffusion models trained on extensive video datasets. We first adapt a pre-trained video diffusion model to a target character through our Character-specific Fine-tuning (\\textit{CsF}) technique. By fine-tuning on rendered images of the 3D character paired with zeroed-out audio embeddings (representing \"no motion\"), we eliminate the need for animation data while preserving the motion prior of large-scale video diffusion model. We then uplift the resulting talking-head video into a 3D speech animation by estimating blendshape parameters through a proposed optimization process. AnyTalk enables lip-synced animations across diverse face meshes and blendshape configurations, significantly reducing manual effort and data requirements. We further enhance usability by distilling AnyTalk into a streamlined network, $\\text{AnyTalk}_{RT}$, thereby enabling real-time performance. By leveraging talking-head video generation, our method broadens access to audio-driven speech animation technology for arbitrary characters. The code is publicly available at https://serin-yoon.github.io/projects/anytalk/.", "arxiv_id": "2608.16143", "arxiv_url": "https://arxiv.org/abs/2608.16143", "authors": ["Kwan Yun", "Serin Yoon", "Sunjin Jung", "Jung Eun Yoo", "Inyup Lee", "Junyong Noh"], "brief": "AnyTalk \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u89d2\u8272\u52a8\u753b\u6570\u636e\u7684\u97f3\u9891\u9a71\u52a8 3D \u8bed\u97f3\u52a8\u753b\u65b9\u6cd5\u3002\u5b83\u5148\u7528\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u9002\u914d\u76ee\u6807\u89d2\u8272\uff0c\u518d\u5c06\u751f\u6210\u7684\u8bf4\u8bdd\u5934\u89c6\u9891\u63d0\u5347\u4e3a 3D blendshape \u52a8\u753b\uff0c\u5e76\u84b8\u998f\u51fa\u5b9e\u65f6\u7248\u672c AnyTalk_RT\u3002", "categories": ["cs.GR", "cs.CV", "cs.MM", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16143", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7 Character-specific Fine-tuning \u5728\u76ee\u6807\u89d2\u8272\u6e32\u67d3\u56fe\u4e0e\u96f6\u97f3\u9891\u5d4c\u5165\u4e0a\u5fae\u8c03\uff0c\u907f\u514d\u6536\u96c6\u52a8\u753b\u6570\u636e\uff0c\u540c\u65f6\u4fdd\u7559\u5927\u89c4\u6a21\u89c6\u9891\u6a21\u578b\u7684\u8fd0\u52a8\u5148\u9a8c", "\u63d0\u51fa\u4f18\u5316\u6d41\u7a0b\uff0c\u4ece\u751f\u6210\u7684\u5507\u540c\u6b65\u8bf4\u8bdd\u89c6\u9891\u4e2d\u4f30\u8ba1 blendshape \u53c2\u6570\uff0c\u652f\u6301\u4e0d\u540c\u9762\u90e8\u7f51\u683c\u548c blendshape \u914d\u7f6e", "\u5c06\u5b8c\u6574\u6d41\u7a0b\u84b8\u998f\u4e3a\u8f7b\u91cf\u7f51\u7edc AnyTalk_RT\uff0c\u5b9e\u73b0\u66f4\u9ad8\u53ef\u7528\u6027\u7684\u5b9e\u65f6\u8bed\u97f3\u52a8\u753b\u751f\u6210"], "keywords": ["\u52a8\u753b\u751f\u6210", "\u89c6\u9891\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001", "\u5b9e\u65f6\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16143v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AnyTalk: Speech Animation for Arbitrary Characters Leveraging a Video Generation Model", "tldr": "\u7528\u89c6\u9891\u6269\u6563\u6a21\u578b\u4e3a\u4efb\u610f\u89d2\u8272\u751f\u6210\u5b9e\u65f6\u53e3\u578b\u52a8\u753b", "upvotes": 0, "what_it_is": "AnyTalk \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u89d2\u8272\u52a8\u753b\u6570\u636e\u7684\u97f3\u9891\u9a71\u52a8 3D \u8bed\u97f3\u52a8\u753b\u65b9\u6cd5\u3002\u5b83\u5148\u7528\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u9002\u914d\u76ee\u6807\u89d2\u8272\uff0c\u518d\u5c06\u751f\u6210\u7684\u8bf4\u8bdd\u5934\u89c6\u9891\u63d0\u5347\u4e3a 3D blendshape \u52a8\u753b\uff0c\u5e76\u84b8\u998f\u51fa\u5b9e\u65f6\u7248\u672c AnyTalk_RT\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u663e\u8457\u964d\u4f4e\u4e86 3D \u89d2\u8272\u53e3\u578b\u52a8\u753b\u5236\u4f5c\u5bf9\u4e13\u7528\u8bad\u7ec3\u6570\u636e\u3001\u7ed1\u5b9a\u548c\u91cd\u62d3\u6251\u7684\u4f9d\u8d56\uff0c\u4f7f\u4efb\u610f\u89d2\u8272\u7684\u97f3\u9891\u9a71\u52a8\u8868\u60c5\u52a8\u753b\u66f4\u6613\u90e8\u7f72\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u521b\u4f5c\u548c\u6e38\u620f\u5f71\u89c6\u751f\u4ea7\u4ef7\u503c\u3002"}, {"abstract": "Open-vocabulary referring segmentation in 3D Gaussian Splatting (3DGS) requires a neural model to select Gaussian primitives according to free-form language expressions. Existing 3DGS-based methods usually rely on global text-region similarity, which is weak for queries involving attributes, reference objects, spatial relations, and fine-grained parts. This often causes target-reference confusion, granularity mismatch, part-whole leakage, and relation violations. We propose QAGaussian, a query-adaptive neural reasoning framework for language-guided Gaussian primitive selection. QAGaussian first learns query-conditioned multi-scale Gaussian slots as differentiable candidates whose receptive fields are shaped by the input expression. It then builds a relation-aware slot graph with language-conditioned edge weighting to propagate target-reference, attribute, part-whole, and contextual evidence. A granularity-adaptive router softly combines region-level, object-level, part-level, attribute-aware, and relation-aware mask branches, followed by relation-constrained refinement for spatial, part-whole, attribute, and geometric consistency. QAGaussian is pretrained only on Mosaic3D-5.6M for Gaussian-text alignment and evaluated on independent benchmarks without target-dataset fine-tuning. It achieves 47.2 Avg. mIoU and 63.2 Avg. F1, outperforming the strongest 3DGS referring baseline by 2.7 mIoU points and 2.9 F1 points. It also improves Part-mIoU from 38.6 to 43.4, Rel-mIoU from 44.4 to 50.8, and reduces target-reference confusion from 10.8 to 7.4. These results demonstrate that query-conditioned slot learning, relation-aware graph reasoning, and adaptive routing provide an effective neural modeling strategy for open-vocabulary referring segmentation in 3DGS. The code is available at https://github.com/zqeslwyz/QAGaussian.", "arxiv_id": "2608.16103", "arxiv_url": "https://arxiv.org/abs/2608.16103", "authors": ["Yizhao Wang", "Xinfa Wang", "Jingbo Wang", "Jingbo Wang", "Guantao Zhang", "Yafeng Han", "Guohong Gao", "Yuhe Xia"], "brief": "\u8bba\u6587\u63d0\u51fa QAGaussian\uff0c\u4e00\u4e2a\u9762\u5411 3D Gaussian Splatting \u7684\u8bed\u8a00\u5f15\u5bfc\u9ad8\u65af primitive \u9009\u62e9\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u4ec5\u4f9d\u8d56\u6587\u672c-\u533a\u57df\u76f8\u4f3c\u5ea6\uff0c\u800c\u662f\u901a\u8fc7\u67e5\u8be2\u6761\u4ef6\u5316 slot\u3001\u5173\u7cfb\u56fe\u63a8\u7406\u548c\u81ea\u9002\u5e94\u7c92\u5ea6\u8def\u7531\u6765\u5904\u7406\u5c5e\u6027\u3001\u90e8\u4ef6\u3001\u53c2\u7167\u7269\u4e0e\u7a7a\u95f4\u5173\u7cfb\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16103", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5b66\u4e60 query-conditioned \u591a\u5c3a\u5ea6 Gaussian slots\uff0c\u4f5c\u4e3a\u53ef\u5fae\u5019\u9009\u533a\u57df\u5e76\u968f\u8f93\u5165\u8868\u8fbe\u8c03\u6574\u611f\u53d7\u91ce\u3002", "\u6784\u5efa\u8bed\u8a00\u6761\u4ef6\u5316\u7684\u5173\u7cfb\u611f\u77e5 slot \u56fe\uff0c\u4f20\u64ad\u76ee\u6807-\u53c2\u7167\u3001\u5c5e\u6027\u3001\u90e8\u4ef6-\u6574\u4f53\u548c\u4e0a\u4e0b\u6587\u8bc1\u636e\u3002", "\u5728\u65e0\u9700\u76ee\u6807\u6570\u636e\u96c6\u5fae\u8c03\u7684\u8bbe\u7f6e\u4e0b\uff0cAvg. mIoU \u8fbe 47.2\u3001Avg. F1 \u8fbe 63.2\uff0c\u8f83\u6700\u5f3a 3DGS \u6307\u4ee3\u57fa\u7ebf\u63d0\u5347 2.7 mIoU \u548c 2.9 F1\u3002"], "keywords": ["3DGS", "\u6307\u4ee3\u5206\u5272", "\u5f00\u653e\u8bcd\u6c47", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16103v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Similarity Matching: Structured Reasoning for Open-Vocabulary Referring Segmentation in 3DGS", "tldr": "\u7528\u7ed3\u6784\u5316\u63a8\u7406\u63d0\u53473DGS\u5f00\u653e\u8bcd\u6c47\u6307\u4ee3\u5206\u5272\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa QAGaussian\uff0c\u4e00\u4e2a\u9762\u5411 3D Gaussian Splatting \u7684\u8bed\u8a00\u5f15\u5bfc\u9ad8\u65af primitive \u9009\u62e9\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u4ec5\u4f9d\u8d56\u6587\u672c-\u533a\u57df\u76f8\u4f3c\u5ea6\uff0c\u800c\u662f\u901a\u8fc7\u67e5\u8be2\u6761\u4ef6\u5316 slot\u3001\u5173\u7cfb\u56fe\u63a8\u7406\u548c\u81ea\u9002\u5e94\u7c92\u5ea6\u8def\u7531\u6765\u5904\u7406\u5c5e\u6027\u3001\u90e8\u4ef6\u3001\u53c2\u7167\u7269\u4e0e\u7a7a\u95f4\u5173\u7cfb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 3DGS \u5f00\u653e\u8bcd\u6c47\u6307\u4ee3\u5206\u5272\u4e2d\u5e38\u89c1\u7684\u76ee\u6807\u6df7\u6dc6\u3001\u7c92\u5ea6\u4e0d\u5339\u914d\u548c\u5173\u7cfb\u8fdd\u80cc\u95ee\u9898\uff0c\u5f15\u5165\u7ed3\u6784\u5316\u795e\u7ecf\u63a8\u7406\u673a\u5236\uff0c\u5728\u90e8\u4ef6\u4e0e\u5173\u7cfb\u7c7b\u67e5\u8be2\u4e0a\u63d0\u5347\u660e\u663e\uff0c\u589e\u5f3a\u4e86\u8bed\u8a00\u9a71\u52a8 3D \u573a\u666f\u7f16\u8f91\u4e0e\u7406\u89e3\u7684\u5b9e\u7528\u6027\u3002"}, {"abstract": "Artificial intelligence-assisted ultrasound scanning enhances diagnostic reliability and efficiency by providing real-time guidance for standardized image acquisition and reducing operator dependence. However, existing reinforcement learning and learning-assisted ultrasound scanning methods typically rely on carefully designed reward functions or extensive interaction data, which limits their generalization ability and stability across different devices, patient populations, and complex clinical scenarios. To address these challenges, we propose an ultrasound vision-language-action model (US-VLA) for automated ultrasound scanning that explicitly encodes clinical semantic goals and generates sequential probe manipulation actions under real-time ultrasound feedback. In particular, we first design an ultrasound-aware expert fusion module to jointly integrate ultrasound observations with auxiliary contextual information, enabling semantic ultrasound feedback to effectively guide the scanning process. Then, we construct US-VLA-Data, a real-world dataset covering liver and kidney examinations, which includes five clinically defined standard planes and comprises 320 expert scanning trajectories with approximately 80,000 synchronized timesteps. Extensive experiments demonstrate that US-VLA achieves competitive performance in ultrasound probe manipulation tasks, indicating its effectiveness and promising generalization within the evaluated abdominal ultrasound setting. The source code is available at https://github.com/VMVLab/US-VLA.", "arxiv_id": "2608.16074", "arxiv_url": "https://arxiv.org/abs/2608.16074", "authors": ["Cheng Zhang", "Xingzheng Wu", "Guihao Yan", "Xifeng Hu", "Zhi Liu", "Mei Wu", "Qing Cai"], "brief": "\u8bba\u6587\u63d0\u51fa US-VLA\uff0c\u7528\u4e34\u5e8a\u8bed\u4e49\u76ee\u6807\u548c\u5b9e\u65f6\u8d85\u58f0\u53cd\u9988\u751f\u6210\u8fde\u7eed\u63a2\u5934\u64cd\u4f5c\u52a8\u4f5c\uff0c\u5b9e\u73b0\u81ea\u52a8\u5316\u8179\u90e8\u8d85\u58f0\u626b\u63cf\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u5305\u542b\u809d\u80be\u68c0\u67e5\u4e13\u5bb6\u8f68\u8ff9\u7684\u771f\u5b9e\u4e16\u754c\u6570\u636e\u96c6 US-VLA-Data\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16074", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8bbe\u8ba1 ultrasound-aware expert fusion \u6a21\u5757\uff0c\u878d\u5408\u8d85\u58f0\u89c2\u6d4b\u4e0e\u8f85\u52a9\u4e0a\u4e0b\u6587\u4fe1\u606f\uff0c\u8ba9\u8bed\u4e49\u53cd\u9988\u6307\u5bfc\u626b\u63cf\u8fc7\u7a0b", "US-VLA-Data \u8986\u76d6\u809d\u810f\u548c\u80be\u810f\u68c0\u67e5\uff0c\u5305\u542b5\u7c7b\u4e34\u5e8a\u6807\u51c6\u5207\u9762\u3001320\u6761\u4e13\u5bb6\u626b\u63cf\u8f68\u8ff9\u548c\u7ea68\u4e07\u540c\u6b65\u65f6\u95f4\u6b65", "\u5b9e\u9a8c\u663e\u793a US-VLA \u5728\u8d85\u58f0\u63a2\u5934\u64cd\u4f5c\u4efb\u52a1\u4e2d\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u5728\u8bc4\u4f30\u7684\u8179\u90e8\u8d85\u58f0\u573a\u666f\u4e2d\u5177\u5907\u4e00\u5b9a\u6cdb\u5316\u6f5c\u529b"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u533b\u5b66\u5f71\u50cf", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16074v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "US-VLA: An Ultrasound Vision-Language-Action Model for Embodied Abdomina", "tldr": "\u9762\u5411\u8179\u90e8\u8d85\u58f0\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa US-VLA\uff0c\u7528\u4e34\u5e8a\u8bed\u4e49\u76ee\u6807\u548c\u5b9e\u65f6\u8d85\u58f0\u53cd\u9988\u751f\u6210\u8fde\u7eed\u63a2\u5934\u64cd\u4f5c\u52a8\u4f5c\uff0c\u5b9e\u73b0\u81ea\u52a8\u5316\u8179\u90e8\u8d85\u58f0\u626b\u63cf\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u5305\u542b\u809d\u80be\u68c0\u67e5\u4e13\u5bb6\u8f68\u8ff9\u7684\u771f\u5b9e\u4e16\u754c\u6570\u636e\u96c6 US-VLA-Data\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 VLA \u8303\u5f0f\u5f15\u5165\u771f\u5b9e\u8d85\u58f0\u626b\u63cf\u4efb\u52a1\uff0c\u51cf\u5c11\u5bf9\u624b\u5de5\u5956\u52b1\u51fd\u6570\u548c\u5927\u91cf\u4ea4\u4e92\u6570\u636e\u7684\u4f9d\u8d56\uff0c\u6709\u671b\u63d0\u5347\u8d85\u58f0\u91c7\u96c6\u6807\u51c6\u5316\u3001\u81ea\u52a8\u5316\u548c\u8de8\u573a\u666f\u7a33\u5b9a\u6027\u3002"}, {"abstract": "Background Lung cancer remains the deadliest cancer worldwide because it is often diagnosed too late. Effective treatment depends on detection at an early screening stage. However, the growing number of patients and the limited number of radiologists lead to prolonged diagnostic waiting times. In very early stage lung cancer, nodule visibility is further reduced by adjacent blood vessels and airway walls, because nodules are often connected to or supplied by these structures. Task-specific analysis of the bronchovascular bundle is therefore important for efficient nodule detection, and its removal can increase the diagnostic potential of lung cancer screening. Materials and Methods To assess the efficacy of the proposed method, we used series from widely utilized LDCT datasets, including the Duke Lung Cancer Screening (DLCS) dataset and the Pilot Pomeranian Lung Cancer Screening Program. The proposed bronchovascular bundle segmentation pipeline, RONALD, operates on computed tomography images and returns binary masks of vessels and bronchi located in the lung parenchyma. The method includes a preprocessing stage with lung, lobe, and mediastinum segmentation, followed by separate vessel and bronchial tree segmentation. Results The proposed pipeline segmented the bronchovascular bundle in low-dose computed tomography scans while improving nodule retention compared with other segmentation methods: from 93.98% and 90.36% to 100% in DLCS, and from 83.16% and 62.36% to 99.92% in the Pomeranian dataset. Conclusion The resulting segmentations can improve lung nodule detection in the very early stages of lung cancer.", "arxiv_id": "2608.16855", "arxiv_url": "https://arxiv.org/abs/2608.16855", "authors": ["Anna Mrukwa", "Marek Socha", "Aleksandra Suwalska", "Agata Durawa", "Malgorzata Jelitto", "Katarzyna Dziadziuszko", "Edyta Szurowska", "Pawel Bozek", "Michal Marczyk", "Witold Rzyman", "Rafal Dziadziuszko", "Joanna Polanska"], "brief": "\u8bba\u6587\u63d0\u51faRONALD\uff0c\u4e00\u5957\u9762\u5411\u4f4e\u5242\u91cf\u80ba\u90e8CT\u7684\u652f\u6c14\u7ba1\u8840\u7ba1\u675f\u5206\u5272\u6d41\u7a0b\uff0c\u5728\u6807\u6ce8\u7a00\u7f3a\u573a\u666f\u4e0b\u4ee5\u65e0\u76d1\u7763/\u4f20\u7edf\u56fe\u50cf\u5904\u7406\u65b9\u5f0f\u751f\u6210\u80ba\u5b9e\u8d28\u5185\u8840\u7ba1\u4e0e\u652f\u6c14\u7ba1\u4e8c\u503c\u63a9\u819c\u3002\u65b9\u6cd5\u5148\u8fdb\u884c\u80ba\u3001\u80ba\u53f6\u548c\u7eb5\u9694\u9884\u5904\u7406\u5206\u5272\uff0c\u518d\u5206\u522b\u5206\u5272\u8840\u7ba1\u4e0e\u652f\u6c14\u7ba1\u6811\uff0c\u7528\u4e8e\u8f85\u52a9\u65e9\u671f\u80ba\u7ed3\u8282\u68c0\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16855", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728DLCS\u548c\u6ce2\u7f8e\u62c9\u5c3c\u4e9a\u80ba\u764c\u7b5b\u67e5\u6570\u636e\u96c6\u4e0a\u8bc4\u4f30\uff0c\u8986\u76d6\u771f\u5b9e\u4f4e\u5242\u91cfCT\u7b5b\u67e5\u573a\u666f", "\u76f8\u6bd4\u5176\u4ed6\u5206\u5272\u65b9\u6cd5\u663e\u8457\u63d0\u9ad8\u7ed3\u8282\u4fdd\u7559\u7387\uff1aDLCS\u4ece93.98%\u548c90.36%\u63d0\u5347\u81f3100%", "\u5728\u6ce2\u7f8e\u62c9\u5c3c\u4e9a\u6570\u636e\u96c6\u4e0a\u7ed3\u8282\u4fdd\u7559\u7387\u4ece83.16%\u548c62.36%\u63d0\u5347\u81f399.92%\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11\u8bef\u5220\u65e9\u671f\u7ed3\u8282"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u56fe\u50cf\u5206\u5272", "\u80ba\u764c\u7b5b\u67e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16855v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can Unsupervised Methods Outperform Supervised Deep Learning When Ground Truth Is Sparse? A Case Study of Bronchovascular Bundle Segmentation in Low-Dose CT", "tldr": "RONALD\u65e0\u76d1\u7763\u5206\u5272\u4f4e\u5242\u91cfCT\u652f\u6c14\u7ba1\u8840\u7ba1\u675f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faRONALD\uff0c\u4e00\u5957\u9762\u5411\u4f4e\u5242\u91cf\u80ba\u90e8CT\u7684\u652f\u6c14\u7ba1\u8840\u7ba1\u675f\u5206\u5272\u6d41\u7a0b\uff0c\u5728\u6807\u6ce8\u7a00\u7f3a\u573a\u666f\u4e0b\u4ee5\u65e0\u76d1\u7763/\u4f20\u7edf\u56fe\u50cf\u5904\u7406\u65b9\u5f0f\u751f\u6210\u80ba\u5b9e\u8d28\u5185\u8840\u7ba1\u4e0e\u652f\u6c14\u7ba1\u4e8c\u503c\u63a9\u819c\u3002\u65b9\u6cd5\u5148\u8fdb\u884c\u80ba\u3001\u80ba\u53f6\u548c\u7eb5\u9694\u9884\u5904\u7406\u5206\u5272\uff0c\u518d\u5206\u522b\u5206\u5272\u8840\u7ba1\u4e0e\u652f\u6c14\u7ba1\u6811\uff0c\u7528\u4e8e\u8f85\u52a9\u65e9\u671f\u80ba\u7ed3\u8282\u68c0\u6d4b\u3002", "why_notable": "\u8be5\u7814\u7a76\u5f3a\u8c03\u5728\u533b\u5b66\u6807\u6ce8\u7a00\u7f3a\u65f6\uff0c\u4efb\u52a1\u5b9a\u5236\u7684\u65e0\u76d1\u7763\u7ba1\u7ebf\u53ef\u80fd\u6bd4\u76d1\u7763\u6df1\u5ea6\u5b66\u4e60\u66f4\u7a33\u5065\uff0c\u5c24\u5176\u9002\u5408\u9700\u8981\u9ad8\u7ed3\u8282\u4fdd\u7559\u7387\u7684\u80ba\u764c\u65e9\u7b5b\u8f85\u52a9\u6d41\u7a0b\uff0c\u5177\u6709\u8f83\u5f3a\u4e34\u5e8a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Identifying and representing object instances such as cells or nuclei is a common task in microscopy image analysis. Established machine learning workflows typically use supervised detection or segmentation followed by feature extraction or classification, which requires manual annotations and treats instance segmentation and cell representation as separate stages. We describe a new unsupervised method for cell instance segmentation and phenotypic classification from unlabeled microscopy images. Our method is based on reconstructing each image using a coarse-to-fine routing pyramid that associates pixels with spatially sparse latent sources. The resulting pixel-to-latent associations yield instance masks, while the source latents encode cell morphology. We demonstrate competitive performance in instance segmentation across diverse cell morphologies and imaging modalities, as well as generative modeling of cellular phenotypes under perturbations. Source code and checkpoints are available at https://github.com/weigertlab/routing-pyramids.", "arxiv_id": "2608.16810", "arxiv_url": "https://arxiv.org/abs/2608.16810", "authors": ["Ziwen Liu", "Martin Weigert"], "brief": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa Generative Routing Pyramids\uff0c\u4e00\u79cd\u4ece\u672a\u6807\u6ce8\u663e\u5fae\u56fe\u50cf\u4e2d\u540c\u65f6\u5b66\u4e60\u7ec6\u80de\u5b9e\u4f8b\u5206\u5272\u4e0e\u8868\u578b\u8868\u793a\u7684\u65e0\u76d1\u7763\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7c97\u5230\u7ec6\u7684\u751f\u6210\u5f0f\u8def\u7531\u91d1\u5b57\u5854\u91cd\u5efa\u56fe\u50cf\uff0c\u5c06\u50cf\u7d20\u5173\u8054\u5230\u7a00\u758f\u7a7a\u95f4\u6f5c\u53d8\u91cf\uff0c\u4ece\u800c\u5f97\u5230\u5b9e\u4f8b\u63a9\u7801\u548c\u7ec6\u80de\u5f62\u6001\u7f16\u7801\u3002", "categories": ["cs.CV", "cs.LG", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16810", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\uff0c\u5c06\u5b9e\u4f8b\u5206\u5272\u4e0e\u7ec6\u80de\u8868\u578b\u8868\u793a\u5b66\u4e60\u7edf\u4e00\u5728\u540c\u4e00\u751f\u6210\u5f0f\u6846\u67b6\u4e2d", "\u50cf\u7d20\u5230\u6f5c\u5728\u6e90\u7684\u8def\u7531\u5173\u8054\u53ef\u76f4\u63a5\u5f62\u6210\u7ec6\u80de\u6216\u7ec6\u80de\u6838\u5b9e\u4f8b\u63a9\u7801\uff0c\u6e90\u6f5c\u53d8\u91cf\u7f16\u7801\u5f62\u6001\u7279\u5f81", "\u5728\u591a\u79cd\u7ec6\u80de\u5f62\u6001\u548c\u6210\u50cf\u6a21\u6001\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u5b9e\u4f8b\u5206\u5272\u6548\u679c\uff0c\u5e76\u53ef\u751f\u6210\u5efa\u6a21\u6270\u52a8\u4e0b\u7684\u7ec6\u80de\u8868\u578b"], "keywords": ["\u65e0\u76d1\u7763\u5b66\u4e60", "\u751f\u7269\u56fe\u50cf", "\u5b9e\u4f8b\u5206\u5272", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16810v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Unsupervised Learning of Cell Instances with Generative Routing Pyramids", "tldr": "\u65e0\u76d1\u7763\u5206\u5272\u7ec6\u80de\u5e76\u5b66\u4e60\u8868\u578b\u8868\u793a", "upvotes": 0, "what_it_is": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa Generative Routing Pyramids\uff0c\u4e00\u79cd\u4ece\u672a\u6807\u6ce8\u663e\u5fae\u56fe\u50cf\u4e2d\u540c\u65f6\u5b66\u4e60\u7ec6\u80de\u5b9e\u4f8b\u5206\u5272\u4e0e\u8868\u578b\u8868\u793a\u7684\u65e0\u76d1\u7763\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7c97\u5230\u7ec6\u7684\u751f\u6210\u5f0f\u8def\u7531\u91d1\u5b57\u5854\u91cd\u5efa\u56fe\u50cf\uff0c\u5c06\u50cf\u7d20\u5173\u8054\u5230\u7a00\u758f\u7a7a\u95f4\u6f5c\u53d8\u91cf\uff0c\u4ece\u800c\u5f97\u5230\u5b9e\u4f8b\u63a9\u7801\u548c\u7ec6\u80de\u5f62\u6001\u7f16\u7801\u3002", "why_notable": "\u2462\u4e3a\u4f55\u503c\u5f97\u5173\u6ce8\uff1a\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u663e\u5fae\u56fe\u50cf\u5206\u6790\u5bf9\u50cf\u7d20\u7ea7\u6807\u6ce8\u7684\u4f9d\u8d56\uff0c\u5e76\u628a\u5206\u5272\u3001\u8868\u793a\u5b66\u4e60\u548c\u8868\u578b\u751f\u6210\u5efa\u6a21\u7ed3\u5408\u8d77\u6765\uff0c\u5bf9\u9ad8\u901a\u91cf\u7ec6\u80de\u6210\u50cf\u3001\u836f\u7269\u7b5b\u9009\u548c\u65e0\u76d1\u7763\u751f\u7269\u56fe\u50cf\u5206\u6790\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large vision-language models can recognize the objects and attributes in a crowded scene yet assign an attribute to the wrong same-class instance. Generic visual-question-answering accuracy marks the response as wrong, while object-hallucination metrics may regard both the object and attribute as image-supported; neither reveals the transfer. This study formalizes this blind spot as Dense Same-Class Attribute Misbinding (DSCAM) and presents InstaBind-Lite, a controlled benchmark that makes it directly measurable. Its 524 images contain 529 curated groups of 3-6 same-class entities, 1773 boxed instances, ordered neighbors, distinguishable color-like attributes, and four complementary question levels, yielding 9580 deterministically evaluated questions. Unlike existing protocols, source-instance annotations separate unsupported generation and recognition failure from an attribute copied from another visible entity. Binding-specific metrics further quantify transfer frequency, adjacency, ordinal distance, and intervention effects. Across five open-source and two commercial/API models, the open-source systems average 19.84% Misbinding Rate and the API systems 7.55%; these errors are hidden by aggregate accuracy. Among identifiable transfers, 80.70% and 81.51%, respectively, originate from adjacent instances. Localization and instance-first interventions help selected models but are not universal remedies. InstaBind-Lite therefore turns previously undifferentiated wrong answers into source-identifiable failure categories and tests a reliability dimension that conventional benchmarks cannot determine: whether a model knows not only what is visible, but which instance owns each attribute.", "arxiv_id": "2608.16805", "arxiv_url": "https://arxiv.org/abs/2608.16805", "authors": ["Yuanzhi Xu", "Qian Gao", "Jun Fan", "Guohui Ding", "Zhenyu Yang", "Yuteng Xiao", "Sixue Lin"], "brief": "\u8bba\u6587 formalizes \u5927\u578b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u62e5\u6324\u573a\u666f\u4e2d\u628a\u5c5e\u6027\u7ed1\u5b9a\u5230\u9519\u8bef\u540c\u7c7b\u5b9e\u4f8b\u4e0a\u7684\u95ee\u9898\uff0c\u79f0\u4e3a DSCAM\u3002\u4f5c\u8005\u6784\u5efa InstaBind-Lite \u57fa\u51c6\uff0c\u901a\u8fc7\u6e90\u5b9e\u4f8b\u6807\u6ce8\u548c\u591a\u5c42\u95ee\u9898\u76f4\u63a5\u6d4b\u91cf\u5c5e\u6027\u4ece\u54ea\u4e2a\u53ef\u89c1\u5b9e\u4f53\u88ab\u9519\u8bef\u590d\u5236\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16805", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["InstaBind-Lite \u5305\u542b 524 \u5f20\u56fe\u50cf\u3001529 \u7ec4\u540c\u7c7b\u5b9e\u4f53\u30011773 \u4e2a\u6846\u6807\u6ce8\u5b9e\u4f8b\u548c 9580 \u4e2a\u53ef\u786e\u5b9a\u8bc4\u6d4b\u95ee\u9898\u3002", "\u5728 5 \u4e2a\u5f00\u6e90\u6a21\u578b\u548c 2 \u4e2a\u5546\u4e1a/API \u6a21\u578b\u4e0a\uff0c\u5f00\u6e90\u6a21\u578b\u5e73\u5747\u8bef\u7ed1\u5b9a\u7387\u4e3a 19.84%\uff0cAPI \u6a21\u578b\u4e3a 7.55%\uff0c\u4f46\u8fd9\u4e9b\u9519\u8bef\u4f1a\u88ab\u603b\u4f53\u51c6\u786e\u7387\u63a9\u76d6\u3002", "\u53ef\u8bc6\u522b\u7684\u5c5e\u6027\u8f6c\u79fb\u4e2d\uff0c\u7ea6 80% \u4ee5\u4e0a\u6765\u81ea\u76f8\u90bb\u5b9e\u4f8b\uff1b\u5b9a\u4f4d\u548c\u5148\u8bc6\u522b\u5b9e\u4f8b\u7684\u5e72\u9884\u5bf9\u90e8\u5206\u6a21\u578b\u6709\u6548\u4f46\u5e76\u975e\u901a\u7528\u89e3\u6cd5\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16805v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Diagnosing Dense Same-Class Attribute Misbinding in Large Vision-Language Models", "tldr": "\u63ed\u793a\u5e76\u91cf\u5316\u5bc6\u96c6\u540c\u7c7b\u5b9e\u4f8b\u5c5e\u6027\u9519\u7ed1", "upvotes": 0, "what_it_is": "\u8bba\u6587 formalizes \u5927\u578b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u62e5\u6324\u573a\u666f\u4e2d\u628a\u5c5e\u6027\u7ed1\u5b9a\u5230\u9519\u8bef\u540c\u7c7b\u5b9e\u4f8b\u4e0a\u7684\u95ee\u9898\uff0c\u79f0\u4e3a DSCAM\u3002\u4f5c\u8005\u6784\u5efa InstaBind-Lite \u57fa\u51c6\uff0c\u901a\u8fc7\u6e90\u5b9e\u4f8b\u6807\u6ce8\u548c\u591a\u5c42\u95ee\u9898\u76f4\u63a5\u6d4b\u91cf\u5c5e\u6027\u4ece\u54ea\u4e2a\u53ef\u89c1\u5b9e\u4f53\u88ab\u9519\u8bef\u590d\u5236\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u4e86\u73b0\u6709 VQA \u51c6\u786e\u7387\u548c\u5e7b\u89c9\u6307\u6807\u96be\u4ee5\u53d1\u73b0\u7684\u7ec6\u7c92\u5ea6\u53ef\u9760\u6027\u76f2\u70b9\uff0c\u5e76\u63d0\u4f9b\u53ef\u8bca\u65ad\u5c5e\u6027\u5f52\u5c5e\u9519\u8bef\u6765\u6e90\u7684\u57fa\u51c6\uff0c\u6709\u52a9\u4e8e\u8bc4\u4f30\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u662f\u5426\u771f\u6b63\u7406\u89e3\u201c\u54ea\u4e2a\u5b9e\u4f8b\u62e5\u6709\u54ea\u4e9b\u5c5e\u6027\u201d\u3002"}, {"abstract": "Model Inversion Attacks (MIAs) aim to reconstruct representative training samples of target identities from face recognition models, exposing critical security vulnerabilities. Existing methods typically rely on indirect guidance or highly stochastic guidance, making it difficult to stably optimize generation trajectories toward target facial images. In this paper, we propose Steering Flow Model Inversion (SFMI), a novel two-stage white-box model inversion method that reformulates inversion as a trajectory-steering task. Specifically, Step I, Learning a Generic Flow Matching Prior, pre-trains a generic unconditional Flow Matching model to encode the manifold of human faces as a robust prior. Step II, Attacking with Progressive Guidance Scheduler (PGS), injects time-dependent target-specific gradients during sampling. By backpropagating through the target model to obtain gradients from intermediate generated states, PGS progressively injects adaptive guidance signa
