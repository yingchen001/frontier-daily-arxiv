ls into the vector field. This process effectively steers the current generative flow from random noise toward the high-density regions of the target class. Under an identity-disjoint cross-evaluation setting using the CelebA dataset, SFMI achieves an ACC of 0.9248, an FID of 22.61, and an LPIPS of 0.3874 on the ArcFace target. Extensive experiments on multiple target models demonstrate that SFMI achieves competitive state-of-the-art performance in attack success and visual fidelity under the evaluated white-box protocol.", "arxiv_id": "2608.16791", "arxiv_url": "https://arxiv.org/abs/2608.16791", "authors": ["Ye Lu", "Shen Wang", "Zhaoyang Zhang", "Yihan Yan", "Li Liu", "Runze Liu", "Fanghui Sun"], "brief": "\u8bba\u6587\u63d0\u51fa SFMI\uff0c\u4e00\u79cd\u4e24\u9636\u6bb5\u767d\u76d2\u6a21\u578b\u53cd\u6f14\u653b\u51fb\u65b9\u6cd5\uff0c\u5c06\u4eba\u8138\u6a21\u578b\u53cd\u6f14\u91cd\u6784\u4e3a\u751f\u6210\u8f68\u8ff9\u5f15\u5bfc\u95ee\u9898\u3002\u5b83\u5148\u5b66\u4e60\u901a\u7528\u4eba\u8138\u6d41\u5339\u914d\u5148\u9a8c\uff0c\u518d\u5728\u91c7\u6837\u8fc7\u7a0b\u4e2d\u6ce8\u5165\u76ee\u6807\u8eab\u4efd\u68af\u5ea6\u4ee5\u751f\u6210\u76ee\u6807\u7c7b\u4ee3\u8868\u6027\u4eba\u8138\u3002", "categories": ["cs.CV", "cs.AI", "cs.CR", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16791", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7b2c\u4e00\u9636\u6bb5\u9884\u8bad\u7ec3\u65e0\u6761\u4ef6 Flow Matching \u6a21\u578b\uff0c\u4f5c\u4e3a\u4eba\u8138\u6d41\u5f62\u7684\u751f\u6210\u5148\u9a8c\u3002", "\u7b2c\u4e8c\u9636\u6bb5\u63d0\u51fa Progressive Guidance Scheduler\uff0c\u901a\u8fc7\u76ee\u6807\u6a21\u578b\u53cd\u5411\u4f20\u64ad\u83b7\u5f97\u4e2d\u95f4\u751f\u6210\u72b6\u6001\u7684\u68af\u5ea6\uff0c\u5e76\u968f\u65f6\u95f4\u81ea\u9002\u5e94\u6ce8\u5165\u5411\u91cf\u573a\u3002", "\u5728 CelebA \u8eab\u4efd\u4e0d\u91cd\u53e0\u8bc4\u6d4b\u4e2d\uff0c\u9488\u5bf9 ArcFace \u8fbe\u5230 ACC 0.9248\u3001FID 22.61\u3001LPIPS 0.3874\u3002"], "keywords": ["\u6a21\u578b\u53cd\u6f14", "\u4eba\u8138\u8bc6\u522b", "\u751f\u6210\u6a21\u578b", "\u9690\u79c1\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16791v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Steering the Flow: Inverting Face Recognition Models via Gradient-Guided Flow Matching", "tldr": "\u7528\u68af\u5ea6\u5f15\u5bfc\u6d41\u5339\u914d\u53cd\u6f14\u4eba\u8138\u8bc6\u522b\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SFMI\uff0c\u4e00\u79cd\u4e24\u9636\u6bb5\u767d\u76d2\u6a21\u578b\u53cd\u6f14\u653b\u51fb\u65b9\u6cd5\uff0c\u5c06\u4eba\u8138\u6a21\u578b\u53cd\u6f14\u91cd\u6784\u4e3a\u751f\u6210\u8f68\u8ff9\u5f15\u5bfc\u95ee\u9898\u3002\u5b83\u5148\u5b66\u4e60\u901a\u7528\u4eba\u8138\u6d41\u5339\u914d\u5148\u9a8c\uff0c\u518d\u5728\u91c7\u6837\u8fc7\u7a0b\u4e2d\u6ce8\u5165\u76ee\u6807\u8eab\u4efd\u68af\u5ea6\u4ee5\u751f\u6210\u76ee\u6807\u7c7b\u4ee3\u8868\u6027\u4eba\u8138\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u6d41\u5339\u914d\u751f\u6210\u6a21\u578b\u5728\u767d\u76d2\u6a21\u578b\u53cd\u6f14\u4e2d\u7684\u5f3a\u653b\u51fb\u80fd\u529b\uff0c\u63d0\u5347\u4e86\u8eab\u4efd\u91cd\u6784\u7684\u7a33\u5b9a\u6027\u4e0e\u89c6\u89c9\u8d28\u91cf\uff0c\u4e5f\u8fdb\u4e00\u6b65\u51f8\u663e\u4eba\u8138\u8bc6\u522b\u6a21\u578b\u7684\u9690\u79c1\u6cc4\u9732\u98ce\u9669\u3002"}, {"abstract": "This paper proposes a calibration-free framework for reliably and effectively estimating vehicle speeds from monocular videos, without relying on roadway features, camera calibration, or roadway-feature-based reference objects. The proposed framework estimates vehicle speeds using a 36-keypoint vehicle template and a homography matrix updated at each frame. A YOLO-based keypoint detection module is trained on diverse datasets, and two estimation strategies are compared: keypoint-only tracking and warped optical flow with dense spatial aggregation. Speed is estimated by projecting displacements into metric space using the homography, with validation conducted on over 400 video clips from roadside and overhead datasets, covering speeds from 30 to 100 mph. The method achieves reliable speed estimation on the VS13 and BrnoCompSpeed datasets, with the warped optical flow method delivering MAEs of 15.0% and 9.7%, respectively, and 77.9% and 93.1% of estimates falling within +/-20% error. After applying a 10% trim to remove edge-of-frame outliers, performance improves to MAEs of 11.7% and 7.6%, with within-+/-20% accuracy increasing to 85.3% and 95.4%. This work addresses key limitations of existing vision-based approaches and enables low-cost and efficient speed enforcement using portable devices such as dashcams and smartphones, thereby supporting citizen-based enforcement programs for traffic safety.", "arxiv_id": "2608.16785", "arxiv_url": "https://arxiv.org/abs/2608.16785", "authors": ["Gaofeng Su", "Keya Li", "Raja Sengupta", "Kara M. Kockelman"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u9053\u8def\u7279\u5f81\u3001\u76f8\u673a\u6807\u5b9a\u6216\u53c2\u8003\u7269\u7684\u5355\u76ee\u89c6\u9891\u8f66\u8f86\u6d4b\u901f\u6846\u67b6\u3002\u65b9\u6cd5\u5229\u752836\u5173\u952e\u70b9\u8f66\u8f86\u6a21\u677f\u9010\u5e27\u4f30\u8ba1\u5355\u5e94\u77e9\u9635\uff0c\u5e76\u5c06\u8f66\u8f86\u4f4d\u79fb\u6295\u5f71\u5230\u771f\u5b9e\u5c3a\u5ea6\u7a7a\u95f4\u4ee5\u8ba1\u7b97\u901f\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16785", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bad\u7ec3YOLO\u5f0f\u8f66\u8f86\u5173\u952e\u70b9\u68c0\u6d4b\u5668\uff0c\u57fa\u4e8e36\u5173\u952e\u70b9\u6a21\u677f\u5728\u4e0d\u540c\u89c6\u89d2\u548c\u6570\u636e\u96c6\u4e0a\u68c0\u6d4b\u8f66\u8f86\u7ed3\u6784\u3002", "\u6bd4\u8f83\u4e24\u79cd\u6d4b\u901f\u7b56\u7565\uff1a\u4ec5\u5173\u952e\u70b9\u8ddf\u8e2a\uff0c\u4ee5\u53ca\u7ed3\u5408\u900f\u89c6\u6821\u6b63\u5149\u6d41\u4e0e\u5bc6\u96c6\u7a7a\u95f4\u805a\u5408\u7684 warped optical flow\u3002", "\u5728VS13\u4e0eBrnoCompSpeed\u7b49400\u591a\u4e2a\u8def\u4fa7\u548c\u4fef\u89c6\u89c6\u9891\u7247\u6bb5\u4e0a\u9a8c\u8bc1\uff0c\u88c1\u526a\u8fb9\u7f18\u5f02\u5e38\u540eMAE\u5206\u522b\u964d\u81f311.7%\u548c7.6%\u3002"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u4ea4\u901a\u611f\u77e5", "\u5355\u76ee\u51e0\u4f55", "\u76ee\u6807\u8ddf\u8e2a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16785v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Calibration-Free Vehicle Speed Estimation: A Monocular Keypoint-Template Approach", "tldr": "\u65e0\u9700\u6807\u5b9a\u7684\u5355\u76ee\u8f66\u8f86\u6d4b\u901f\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u9053\u8def\u7279\u5f81\u3001\u76f8\u673a\u6807\u5b9a\u6216\u53c2\u8003\u7269\u7684\u5355\u76ee\u89c6\u9891\u8f66\u8f86\u6d4b\u901f\u6846\u67b6\u3002\u65b9\u6cd5\u5229\u752836\u5173\u952e\u70b9\u8f66\u8f86\u6a21\u677f\u9010\u5e27\u4f30\u8ba1\u5355\u5e94\u77e9\u9635\uff0c\u5e76\u5c06\u8f66\u8f86\u4f4d\u79fb\u6295\u5f71\u5230\u771f\u5b9e\u5c3a\u5ea6\u7a7a\u95f4\u4ee5\u8ba1\u7b97\u901f\u5ea6\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7ed5\u5f00\u4e86\u4f20\u7edf\u89c6\u89c9\u6d4b\u901f\u5bf9\u76f8\u673a\u6807\u5b9a\u3001\u8f66\u9053\u7ebf\u6216\u5df2\u77e5\u53c2\u8003\u7269\u7684\u4f9d\u8d56\uff0c\u964d\u4f4e\u90e8\u7f72\u95e8\u69db\uff0c\u6709\u671b\u8ba9\u884c\u8f66\u8bb0\u5f55\u4eea\u3001\u624b\u673a\u7b49\u4f4e\u6210\u672c\u8bbe\u5907\u7528\u4e8e\u4ea4\u901a\u5b89\u5168\u76d1\u6d4b\u4e0e\u6d4b\u901f\u6267\u6cd5\u8f85\u52a9\u3002"}, {"abstract": "RAW video restoration is fundamental to high-quality low-level perception and serves as the basis for a wide range of downstream vision applications. While binary neural networks (BNNs) enable efficient lightweight deployment for image enhancement, their deficiencies in modeling temporal coherence and activation value distributions hinder their effectiveness when applied to video scenarios. In this paper, we propose BinRVR, a binarized RAW video restoration framework that reduces computation and parameters by approximately 96% while incurring only about 4% performance degradation. Specifically, we present a Binarized Information Interaction Module (BIIM) to jointly model spatial and temporal information in an efficient and unified manner. Moreover, we develop a Distribution-Aware Binarized Convolution (DAB-Conv) that leverages the statistics of full-precision activations to mitigate quantization errors. The proposed framework further supports multi-bit quantization, enabling flexible accuracy-efficiency trade-offs across different hardware constraints. Extensive experiments demonstrate that our BinRVR achieves competitive performance compared with state-of-the-art binarized methods on RAW video restoration tasks, including low-light enhancement, denoising, deblurring, and super-resolution. We further explore the potential of our method on downstream video applications, including object detection and monocular depth estimation.", "arxiv_id": "2608.16756", "arxiv_url": "https://arxiv.org/abs/2608.16756", "authors": ["Tianyu Zhu", "Ying Fu", "Hesong Li", "Gengchen Zhang", "Xin Yuan", "Yulun Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa BinRVR\uff0c\u4e00\u4e2a\u9762\u5411 RAW \u89c6\u9891\u4fee\u590d\u7684\u4e8c\u503c\u5316\u795e\u7ecf\u7f51\u7edc\u6846\u67b6\uff0c\u5728\u5927\u5e45\u964d\u4f4e\u8ba1\u7b97\u91cf\u548c\u53c2\u6570\u91cf\u7684\u540c\u65f6\u4fdd\u6301\u63a5\u8fd1\u5168\u7cbe\u5ea6/\u5148\u8fdb\u4e8c\u503c\u5316\u65b9\u6cd5\u7684\u6548\u679c\u3002\u5b83\u8986\u76d6\u4f4e\u5149\u589e\u5f3a\u3001\u53bb\u566a\u3001\u53bb\u6a21\u7cca\u3001\u8d85\u5206\u8fa8\u7387\u7b49\u4efb\u52a1\uff0c\u5e76\u63a2\u7d22\u5bf9\u68c0\u6d4b\u548c\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u7684\u4e0b\u6e38\u6536\u76ca\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16756", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u4e8c\u503c\u5316\u8bbe\u8ba1\u5c06\u8ba1\u7b97\u91cf\u548c\u53c2\u6570\u91cf\u7ea6\u51cf\u5c11 96%\uff0c\u6027\u80fd\u4e0b\u964d\u7ea6 4%\uff0c\u9002\u5408\u8f7b\u91cf\u5316\u90e8\u7f72\u3002", "\u63d0\u51fa Binarized Information Interaction Module\uff08BIIM\uff09\uff0c\u7edf\u4e00\u9ad8\u6548\u5efa\u6a21\u7a7a\u95f4\u4fe1\u606f\u4e0e\u65f6\u95f4\u4e00\u81f4\u6027\u3002", "\u63d0\u51fa Distribution-Aware Binarized Convolution\uff08DAB-Conv\uff09\uff0c\u5229\u7528\u5168\u7cbe\u5ea6\u6fc0\u6d3b\u7edf\u8ba1\u7f13\u89e3\u91cf\u5316\u8bef\u5dee\uff0c\u5e76\u652f\u6301\u591a\u6bd4\u7279\u91cf\u5316\u4ee5\u5e73\u8861\u7cbe\u5ea6\u4e0e\u6548\u7387\u3002"], "keywords": ["\u89c6\u9891\u4fee\u590d", "\u4e8c\u503c\u795e\u7ecf\u7f51\u7edc", "\u4f4e\u5c42\u89c6\u89c9", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16756v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Binarized High-Efficiency RAW Video Restoration and Beyond", "tldr": "\u9ad8\u6548\u4e8c\u503c\u5316\u6846\u67b6\u5b9e\u73b0RAW\u89c6\u9891\u4fee\u590d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BinRVR\uff0c\u4e00\u4e2a\u9762\u5411 RAW \u89c6\u9891\u4fee\u590d\u7684\u4e8c\u503c\u5316\u795e\u7ecf\u7f51\u7edc\u6846\u67b6\uff0c\u5728\u5927\u5e45\u964d\u4f4e\u8ba1\u7b97\u91cf\u548c\u53c2\u6570\u91cf\u7684\u540c\u65f6\u4fdd\u6301\u63a5\u8fd1\u5168\u7cbe\u5ea6/\u5148\u8fdb\u4e8c\u503c\u5316\u65b9\u6cd5\u7684\u6548\u679c\u3002\u5b83\u8986\u76d6\u4f4e\u5149\u589e\u5f3a\u3001\u53bb\u566a\u3001\u53bb\u6a21\u7cca\u3001\u8d85\u5206\u8fa8\u7387\u7b49\u4efb\u52a1\uff0c\u5e76\u63a2\u7d22\u5bf9\u68c0\u6d4b\u548c\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u7684\u4e0b\u6e38\u6536\u76ca\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u4e8c\u503c\u795e\u7ecf\u7f51\u7edc\u4ece\u56fe\u50cf\u589e\u5f3a\u63a8\u8fdb\u5230\u66f4\u5177\u6311\u6218\u7684 RAW \u89c6\u9891\u4fee\u590d\u573a\u666f\uff0c\u91cd\u70b9\u89e3\u51b3\u65f6\u95f4\u5efa\u6a21\u548c\u6fc0\u6d3b\u5206\u5e03\u91cf\u5316\u8bef\u5dee\u95ee\u9898\uff0c\u5bf9\u7aef\u4fa7\u89c6\u9891\u589e\u5f3a\u548c\u79fb\u52a8\u89c6\u89c9\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Surgical segmentation networks can fail silently under acquisition degradation: predicted masks may be wrong even when model confidence remains high. Existing deployment-time monitors rely primarily on uncertainty estimates and can therefore miss confident failures. We present TCSR-Monitor (Temporal Conformal Surgical Risk Monitor), a post-hoc failure-monitoring framework that combines confidence with observable shape, temporal-consistency, and image-quality cues. TCSR-Monitor wraps a frozen segmentation model, requires no model internals, and operates without ground truth at deployment. We also introduce a validation protocol to assess whether alarms remain credible under distribution shift. On EndoVis 2017, leave-one-corruption-out evaluation shows that TCSR-Monitor generalizes to unseen acquisition degradations and substantially outperforms confidence-based baselines. A circularity control confirms that it predicts segmentation failure rather than simply detecting corrupted images. Mondrian conformal calibration balances miss-rates across degradation severities, but a single global threshold still produces false alarms on up to 40% of correctly segmented frames at moderate corruption. Zero-shot transfer to SAM2 demonstrates feature portability, although entropy outperforms the transferred monitor at both evaluated thresholds. Overall, reliable monitoring under acquisition degradation benefits from complementary observable signals beyond confidence alone, but substantial false-alarm and transfer limitations remain.", "arxiv_id": "2608.16748", "arxiv_url": "https://arxiv.org/abs/2608.16748", "authors": ["Hieu D. Pham", "Dang P. M. Cao", "Thanh Trung Huynh"], "brief": "\u8bba\u6587\u63d0\u51fa TCSR-Monitor\uff0c\u4e00\u79cd\u540e\u9a8c\u624b\u672f\u5206\u5272\u5931\u8d25\u76d1\u6d4b\u6846\u67b6\uff0c\u5728\u4e0d\u6539\u52a8\u5206\u5272\u6a21\u578b\u3001\u90e8\u7f72\u65f6\u65e0\u771f\u503c\u7684\u60c5\u51b5\u4e0b\uff0c\u7ed3\u5408\u7f6e\u4fe1\u5ea6\u3001\u5f62\u72b6\u3001\u65f6\u95f4\u4e00\u81f4\u6027\u4e0e\u56fe\u50cf\u8d28\u91cf\u7ebf\u7d22\u53d1\u51fa\u98ce\u9669\u8b66\u62a5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16748", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u91c7\u96c6\u9000\u5316\u4e0b\u201c\u9ad8\u7f6e\u4fe1\u4f46\u9519\u8bef\u201d\u7684\u9759\u9ed8\u5931\u8d25\uff0c\u7a81\u7834\u4ec5\u4f9d\u8d56\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u7684\u76d1\u6d4b\u65b9\u5f0f\u3002", "\u5728 EndoVis 2017 \u7684\u7559\u4e00\u8150\u8680\u8bc4\u4f30\u4e2d\uff0c\u5bf9\u672a\u89c1\u8fc7\u7684\u91c7\u96c6\u9000\u5316\u5177\u5907\u8f83\u597d\u6cdb\u5316\u6027\uff0c\u663e\u8457\u4f18\u4e8e\u7f6e\u4fe1\u5ea6\u57fa\u7ebf\u3002", "Mondrian conformal calibration \u53ef\u5e73\u8861\u4e0d\u540c\u9000\u5316\u5f3a\u5ea6\u4e0b\u7684\u6f0f\u62a5\u7387\uff0c\u4f46\u4e2d\u7b49\u8150\u8680\u65f6\u4ecd\u53ef\u80fd\u5bf9\u6700\u591a 40% \u6b63\u786e\u5206\u5272\u5e27\u8bef\u62a5\u3002"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u8bed\u4e49\u5206\u5272", "\u4e0d\u786e\u5b9a\u6027", "\u5b89\u5168\u76d1\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16748v1", "published_at": "2026-08-17", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Uncertainty: Generalizable Failure Monitoring for Surgical Segmentation under Acquisition Degradation", "tldr": "\u7528\u591a\u4fe1\u53f7\u76d1\u6d4b\u624b\u672f\u5206\u5272\u7684\u9ad8\u7f6e\u4fe1\u5931\u8d25", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TCSR-Monitor\uff0c\u4e00\u79cd\u540e\u9a8c\u624b\u672f\u5206\u5272\u5931\u8d25\u76d1\u6d4b\u6846\u67b6\uff0c\u5728\u4e0d\u6539\u52a8\u5206\u5272\u6a21\u578b\u3001\u90e8\u7f72\u65f6\u65e0\u771f\u503c\u7684\u60c5\u51b5\u4e0b\uff0c\u7ed3\u5408\u7f6e\u4fe1\u5ea6\u3001\u5f62\u72b6\u3001\u65f6\u95f4\u4e00\u81f4\u6027\u4e0e\u56fe\u50cf\u8d28\u91cf\u7ebf\u7d22\u53d1\u51fa\u98ce\u9669\u8b66\u62a5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u771f\u5b9e\u624b\u672f AI \u90e8\u7f72\u4e2d\u7684\u5b89\u5168\u76d1\u63a7\u95ee\u9898\uff0c\u5f3a\u8c03\u5206\u5272\u5931\u8d25\u4e0d\u80fd\u53ea\u770b\u6a21\u578b\u7f6e\u4fe1\u5ea6\uff0c\u5e76\u63d0\u4f9b\u4e86\u5206\u5e03\u504f\u79fb\u4e0b\u9a8c\u8bc1\u8b66\u62a5\u53ef\u4fe1\u5ea6\u7684\u534f\u8bae\uff1b\u540c\u65f6\u4e5f\u63ed\u793a\u4e86\u8bef\u62a5\u7387\u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u4ecd\u662f\u5173\u952e\u74f6\u9888\u3002"}, {"abstract": "Inference-time quality-enhancement methods are an effective and widely adopted means of improving diffusion models without expensive retraining. We study a family of training-free techniques conceptually rooted in Classifier-Free Guidance (CFG), most of which were originally proposed on older U-Net diffusion models and validated using metrics that assess image quality in isolation, without accounting for compositional alignment or semantic correspondence between the generated image and its associated text prompt. We re-evaluate eight such methods on two open-weight rectified-flow transformers under a fixed per-model protocol and three compositional-alignment benchmarks. No method consistently improves on CFG across the measured criteria. APG obtains several nominal best scores, but the corresponding gains often remain within the estimated evaluation uncertainty. Attention-perturbation methods provide isolated gains on SD3.5 Medium and more frequent degradations on FLUX.2 [klein] 4B Base, while CFG remains a competitive lower-cost baseline.", "arxiv_id": "2608.16786", "arxiv_url": "https://arxiv.org/abs/2608.16786", "authors": ["Artem Sergievskii", "Artyom Turevich", "Sergey Kastryulin"], "brief": "\u672c\u6587\u7cfb\u7edf\u91cd\u8bc4\u4e868\u79cd\u65e0\u9700\u8bad\u7ec3\u7684Classifier-Free Guidance\u53d8\u4f53\uff0c\u5728\u4e24\u4e2a\u5f00\u6e90rectified-flow Transformer\u6a21\u578b\u4e0a\uff0c\u7528\u4e09\u4e2a\u7ec4\u5408\u5bf9\u9f50\u57fa\u51c6\u6bd4\u8f83\u5176\u751f\u6210\u8d28\u91cf\u4e0e\u6587\u672c\u8bed\u4e49\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16786", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u591a\u6570\u65b9\u6cd5\u6e90\u81ea\u65e9\u671fU-Net\u6269\u6563\u6a21\u578b\uff0c\u4f46\u8fc7\u53bb\u8bc4\u4f30\u5e38\u53ea\u770b\u56fe\u50cf\u8d28\u91cf\uff0c\u5ffd\u7565\u63d0\u793a\u8bcd\u7ec4\u5408\u5bf9\u9f50\u4e0e\u8bed\u4e49\u5bf9\u5e94\u3002", "\u5b9e\u9a8c\u663e\u793a\u6ca1\u6709\u4efb\u4f55\u65b9\u6cd5\u80fd\u5728\u6240\u6709\u6307\u6807\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u6807\u51c6CFG\uff1bAPG\u867d\u6709\u82e5\u5e72\u6700\u4f73\u5206\u6570\uff0c\u4f46\u589e\u76ca\u591a\u5728\u8bc4\u4f30\u4e0d\u786e\u5b9a\u6027\u8303\u56f4\u5185\u3002", "\u6ce8\u610f\u529b\u6270\u52a8\u7c7b\u65b9\u6cd5\u5728SD3.5 Medium\u4e0a\u6709\u5c40\u90e8\u6536\u76ca\uff0c\u4f46\u5728FLUX.2 4B Base\u4e0a\u66f4\u5e38\u9020\u6210\u9000\u5316\uff0cCFG\u4ecd\u662f\u4f4e\u6210\u672c\u5f3a\u57fa\u7ebf\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u56fe\u50cf\u751f\u6210", "\u6587\u672c\u5bf9\u9f50", "\u63a8\u7406\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16786v1", "published_at": "2026-08-17", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Revisiting Classifier-Free Guidance Methods in Latent Diffusion Models", "tldr": "\u7cfb\u7edf\u590d\u8bc4\u6269\u6563\u6a21\u578bCFG\u6539\u8fdb\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u91cd\u8bc4\u4e868\u79cd\u65e0\u9700\u8bad\u7ec3\u7684Classifier-Free Guidance\u53d8\u4f53\uff0c\u5728\u4e24\u4e2a\u5f00\u6e90rectified-flow Transformer\u6a21\u578b\u4e0a\uff0c\u7528\u4e09\u4e2a\u7ec4\u5408\u5bf9\u9f50\u57fa\u51c6\u6bd4\u8f83\u5176\u751f\u6210\u8d28\u91cf\u4e0e\u6587\u672c\u8bed\u4e49\u4e00\u81f4\u6027\u3002", "why_notable": "\u8bba\u6587\u63d0\u9192\u793e\u533a\u91cd\u65b0\u5ba1\u89c6\u6d41\u884c\u7684\u63a8\u7406\u671f\u6269\u6563\u6a21\u578b\u589e\u5f3a\u6280\u5de7\uff1a\u8bb8\u591aCFG\u6539\u8fdb\u5728\u73b0\u4ee3\u751f\u6210\u67b6\u6784\u548c\u66f4\u4e25\u683c\u6587\u672c\u5bf9\u9f50\u8bc4\u4f30\u4e0b\u5e76\u4e0d\u7a33\u5065\uff0c\u5bf9\u5b9e\u8df5\u9009\u578b\u548c\u540e\u7eed\u65b9\u6cd5\u9a8c\u8bc1\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "A radiologist reading a model\u0027s output faces two problems. The model returns a number and no reason, and any system that turns that number into readable prose can quietly add claims the model never made. MIRROR is a research prototype built to separate those failures. It chains a multi-label classifier, a Grad-CAM localizer that turns each positive finding into a named anatomical region, and a report writer that receives the labels, probabilities, and regions but never the image. Because the language layer cannot see pixels, it cannot assert a finding the classifier did not make. We are precise about what that buys: a MIRROR report\u0027s findings are auditable against the probability vector, while the sentences framing them are ordinary generated text, and we show one stating a cardiothoracic ratio the system never measured. One registry holds the taxonomy, anatomy, and phrasing for chest X-ray, brain MRI, and head CT, so adding a modality is a data change; all three are routed and tested, one is trained. On ChestMNIST that classifier reaches macro AUROC 0.729 and ranks better than chance on all 14 labels, at 1.6 to 6.8 times the precision a random ranker would get. Yet at the default 0.5 threshold it emits no positive prediction at all for 11 of them, and its excellent-looking Brier score of 0.045 sits beside the 0.047 earned by a predictor that ignores the image. The discrimination is real; the decisions are not. Under the class imbalance normal in radiology, aggregate metrics flatter models that do nothing, and should be reported against that floor.", "arxiv_id": "2608.16709", "arxiv_url": "https://arxiv.org/abs/2608.16709", "authors": ["Vignesh Nagarajan", "Sriram Venkatapathy"], "brief": "MIRROR \u5c06\u591a\u6807\u7b7e\u5206\u7c7b\u5668\u3001Grad-CAM \u5b9a\u4f4d\u5668\u548c\u53ea\u63a5\u6536\u6807\u7b7e/\u6982\u7387/\u533a\u57df\u7684\u62a5\u544a\u751f\u6210\u5668\u4e32\u8054\uff0c\u7528\u4e8e\u751f\u6210\u80f8\u7247\u3001\u8111 MRI\u3001\u5934 CT \u7b49\u5f71\u50cf\u62a5\u544a\u3002\u5176\u6838\u5fc3\u8bbe\u8ba1\u662f\u8ba9\u8bed\u8a00\u5c42\u4e0d\u76f4\u63a5\u770b\u56fe\u50cf\uff0c\u4ece\u673a\u5236\u4e0a\u51cf\u5c11\u201c\u51ed\u7a7a\u6dfb\u52a0\u201d\u5206\u7c7b\u5668\u672a\u9884\u6d4b\u53d1\u73b0\u7684\u98ce\u9669\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16709", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u62a5\u544a\u4e2d\u7684\u5f71\u50cf\u53d1\u73b0\u53ef\u8ffd\u6eaf\u5230\u6982\u7387\u5411\u91cf\u548c\u89e3\u5256\u533a\u57df\uff0c\u4f46\u666e\u901a\u53d9\u8ff0\u6027\u53e5\u5b50\u4ecd\u53ef\u80fd\u4ea7\u751f\u672a\u6d4b\u91cf\u4fe1\u606f\u3002", "\u4f7f\u7528\u7edf\u4e00\u6ce8\u518c\u8868\u7ba1\u7406\u75be\u75c5\u5206\u7c7b\u3001\u89e3\u5256\u533a\u57df\u548c\u8868\u8ff0\u6a21\u677f\uff0c\u652f\u6301\u901a\u8fc7\u6570\u636e\u914d\u7f6e\u6269\u5c55\u6a21\u6001\u3002", "ChestMNIST \u4e0a\u5b8f AUROC \u4e3a 0.729\uff0c\u4f46\u9ed8\u8ba4 0.5 \u9608\u503c\u4e0b\u591a\u6570\u6807\u7b7e\u65e0\u9633\u6027\u8f93\u51fa\uff0c\u663e\u793a\u7c7b\u522b\u4e0d\u5747\u8861\u4e0b Brier \u7b49\u805a\u5408\u6307\u6807\u53ef\u80fd\u865a\u9ad8\u3002"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u591a\u6a21\u6001", "\u53ef\u89e3\u91ca\u6027", "\u62a5\u544a\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16709v1", "published_at": "2026-08-17", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "MIRROR: Multimodal Intelligent Radiology Reasoning and Observation Reporter", "tldr": "\u53ef\u5ba1\u8ba1\u7684\u591a\u6a21\u6001\u653e\u5c04\u62a5\u544a\u751f\u6210\u539f\u578b\u3002", "upvotes": 0, "what_it_is": "MIRROR \u5c06\u591a\u6807\u7b7e\u5206\u7c7b\u5668\u3001Grad-CAM \u5b9a\u4f4d\u5668\u548c\u53ea\u63a5\u6536\u6807\u7b7e/\u6982\u7387/\u533a\u57df\u7684\u62a5\u544a\u751f\u6210\u5668\u4e32\u8054\uff0c\u7528\u4e8e\u751f\u6210\u80f8\u7247\u3001\u8111 MRI\u3001\u5934 CT \u7b49\u5f71\u50cf\u62a5\u544a\u3002\u5176\u6838\u5fc3\u8bbe\u8ba1\u662f\u8ba9\u8bed\u8a00\u5c42\u4e0d\u76f4\u63a5\u770b\u56fe\u50cf\uff0c\u4ece\u673a\u5236\u4e0a\u51cf\u5c11\u201c\u51ed\u7a7a\u6dfb\u52a0\u201d\u5206\u7c7b\u5668\u672a\u9884\u6d4b\u53d1\u73b0\u7684\u98ce\u9669\u3002", "why_notable": "\u8bba\u6587\u4e0d\u4ec5\u63d0\u51fa\u4e86\u66f4\u53ef\u5ba1\u8ba1\u7684\u653e\u5c04\u62a5\u544a\u751f\u6210\u67b6\u6784\uff0c\u4e5f\u5f3a\u8c03\u533b\u7597\u5f71\u50cf\u6a21\u578b\u8bc4\u4f30\u4e2d\u201c\u770b\u4f3c\u4f18\u79c0\u4f46\u5b9e\u9645\u4e0d\u51b3\u7b56\u201d\u7684\u95ee\u9898\uff0c\u5bf9\u4e34\u5e8a\u53ef\u89e3\u91ca AI \u548c\u5b89\u5168\u62a5\u544a\u751f\u6210\u6709\u5b9e\u7528\u542f\u53d1\u3002"}, {"abstract": "Multimodal large language models (MLLMs) are widely used for automated annotation, yet their per-class accuracy varies widely (e.g., 12%-98% across the 13 classes of three classroom sub-datasets) and is expensive to measure: evaluating one 27B MLLM on 5,416 validation images takes roughly 14 hours, whereas a frozen-CLIP pass over the same images completes in about 3 minutes. A low-cost signal for ranking classes by expected MLLM annotation difficulty a priori remains underexplored. Building on the AnchorProxy construct (per-class zero-shot CLIP accuracy) introduced in the companion study, this paper systematically evaluates its full-frame formulation, termed AnchorScore here, as an a priori diagnostic that flags the classes MLLMs are least likely to annotate reliably. On classroom behavior data (SCB5, 13 classes, 6 MLLMs), AnchorScore correlates with per-class MLLM accuracy (Spearman rho = 0.769, p = 0.002, n = 13). None of the alternative difficulty predictors (DINOv2, ResNet-50, SigLIP, or MLLM self-verbalized uncertainty) showed a significant class-level correlation at n = 13. A cross-model consensus control suggests AnchorScore primarily captures a shared class-difficulty factor rather than a CLIP-specific signal. An independent replication on Stanford40 Actions yields a nearly identical effect (rho = 0.817, p \u003c 0.001); the association is strongest on activity-recognition data and attenuates on medical and satellite imagery. Three practical applications follow: a deployable hybrid CLIP/MLLM routing strategy (predicted-class routing: up to +23 pp over CLIP-only at roughly 44% MLLM cost savings), prompt disambiguation on hard classes (exploratory), and review-priority prediction for human verification. AnchorScore does not estimate exact MLLM accuracy; it provides a low-cost ranking signal that directs expensive MLLM evaluation to the classes where it is most informative.", "arxiv_id": "2608.16690", "arxiv_url": "https://arxiv.org/abs/2608.16690", "authors": ["Yan Ma", "Lizhuo Zhang"], "brief": "\u672c\u6587\u63d0\u51fa AnchorScore\uff0c\u7528\u51bb\u7ed3 CLIP \u7684\u9010\u7c7b\u96f6\u6837\u672c\u51c6\u786e\u7387\u4f5c\u4e3a\u4f4e\u6210\u672c\u4fe1\u53f7\uff0c\u63d0\u524d\u8bca\u65ad\u54ea\u4e9b\u7c7b\u522b\u5bf9\u591a\u6a21\u6001\u5927\u6a21\u578b\u6807\u6ce8\u66f4\u56f0\u96be\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u4e0e MLLM \u9010\u7c7b\u51c6\u786e\u7387\u663e\u8457\u76f8\u5173\uff0c\u5728\u8bfe\u5802\u884c\u4e3a\u4e0e Stanford40 \u52a8\u4f5c\u8bc6\u522b\u4e0a\u6548\u679c\u7a33\u5b9a\uff0c\u53ef\u7528\u4e8e CLIP/MLLM \u6df7\u5408\u8def\u7531\u3001\u56f0\u96be\u7c7b\u522b\u63d0\u793a\u4f18\u5316\u548c\u4eba\u5de5\u590d\u6838\u4f18\u5148\u7ea7\u6392\u5e8f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16690", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "CLIP", "\u6570\u636e\u6807\u6ce8", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16690v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AnchorScore: A CLIP-Based Diagnostic of MLLM Annotation Difficulty", "tldr": "\u672c\u6587\u63d0\u51fa AnchorScore\uff0c\u7528\u51bb\u7ed3 CLIP \u7684\u9010\u7c7b\u96f6\u6837\u672c\u51c6\u786e\u7387\u4f5c\u4e3a\u4f4e\u6210\u672c\u4fe1\u53f7\uff0c\u63d0\u524d\u8bca\u65ad\u54ea\u4e9b\u7c7b\u522b\u5bf9\u591a\u6a21\u6001\u5927\u6a21\u578b\u6807\u6ce8\u66f4\u56f0\u96be\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u4e0e MLLM \u9010\u7c7b\u51c6\u786e\u7387\u663e\u8457\u76f8\u5173\uff0c\u5728\u8bfe\u5802\u884c\u4e3a\u4e0e Stanford40 \u52a8\u4f5c\u8bc6\u522b\u4e0a\u6548\u679c\u7a33\u5b9a\uff0c\u53ef\u7528\u4e8e CLIP/MLLM \u6df7\u5408\u8def\u7531\u3001\u56f0\u96be\u7c7b\u522b\u63d0\u793a\u4f18\u5316\u548c\u4eba\u5de5\u590d\u6838\u4f18\u5148\u7ea7\u6392\u5e8f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Although semi-supervised semantic segmentation ($\\text{S}^4$) utilizes abundant unlabeled data to reduce manual labeling burdens, independent training of labeled and unlabeled data causes the former to dominate, which severely degrades pseudo-label quality. To address this challenges, we propose a novel remote sensing (RS) $\\text{S}^4$ method via unified flow with feature memory bank (UFFM). Specifically, UFFM comprises two key innovations: unified flow (UF) and feature memory bank (FMB). The UF is a new training flow that generates less biased pseudo-labels by combining an external visual foundation model (VFM) with an RS domain teacher, and jointly optimizes labeled and pseudo-labeled data under a unified training objective. The FMB is a novel memory module for $\\text{S}^4$ that dynamically updates class-specific features during training and reduces the feature discrepancy between labeled and unlabeled data through class-feature alignment. To verify the effectiveness of our model, we conduct extensive experiments on RS datasets. The experimental results show the superiority of our method over SOTA $\\text{S}^4$ methods. Moreover, the results demonstrate the effectiveness of our contributions in bridging the optimization and feature representation gap between labeled and unlabeled data. Our code is released at \\href{https://github.com/wangshanwen001/RS-UFFM}{https://github.com/wangshanwen001/RS-UFFM}.", "arxiv_id": "2608.16681", "arxiv_url": "https://arxiv.org/abs/2608.16681", "authors": ["Shanwen Wang", "Xin Sun", "Danfeng Hong", "Junyu Dong", "Patrick Le Callet"], "brief": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u9065\u611f\u534a\u76d1\u7763\u8bed\u4e49\u5206\u5272\u7684 UFFM \u65b9\u6cd5\uff0c\u901a\u8fc7\u7edf\u4e00\u8bad\u7ec3\u6d41\u7a0b\u7ed3\u5408\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u4e0e\u9065\u611f\u6559\u5e08\u6a21\u578b\uff0c\u751f\u6210\u504f\u5dee\u66f4\u5c0f\u7684\u4f2a\u6807\u7b7e\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u7279\u5f81\u8bb0\u5fc6\u5e93\u8fdb\u884c\u7c7b\u522b\u7ea7\u7279\u5f81\u5bf9\u9f50\uff0c\u5b9e\u9a8c\u663e\u793a\u5728\u591a\u4e2a\u9065\u611f\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u534a\u76d1\u7763\u5206\u5272\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16681", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u534a\u76d1\u7763\u5b66\u4e60", "\u8bed\u4e49\u5206\u5272", "\u9065\u611f", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16681v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bridging the Gap between Labeled and Unlabeled Data via Unified Flow with Feature Memory Bank", "tldr": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u9065\u611f\u534a\u76d1\u7763\u8bed\u4e49\u5206\u5272\u7684 UFFM \u65b9\u6cd5\uff0c\u901a\u8fc7\u7edf\u4e00\u8bad\u7ec3\u6d41\u7a0b\u7ed3\u5408\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u4e0e\u9065\u611f\u6559\u5e08\u6a21\u578b\uff0c\u751f\u6210\u504f\u5dee\u66f4\u5c0f\u7684\u4f2a\u6807\u7b7e\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u7279\u5f81\u8bb0\u5fc6\u5e93\u8fdb\u884c\u7c7b\u522b\u7ea7\u7279\u5f81\u5bf9\u9f50\uff0c\u5b9e\u9a8c\u663e\u793a\u5728\u591a\u4e2a\u9065\u611f\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u534a\u76d1\u7763\u5206\u5272\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Class imbalance in LiDAR point clouds poses challenges for semantic segmentation in autonomous navigation and urban mapping. While 2D vision has numerous mitigation techniques, their effectiveness in 3D remains unclear. We benchmark six reweighting schemes and five imbalance-aware losses across three datasets (DALES, S3DIS, STPLS3D) using two architectures (KPConv, RandLA-Net). Inverse-frequency weighting degrades performance by up to 12% compared to uniform weighting, with catastrophic failures in minority classes. Uniform weighting performs within 2% of complex losses for structured sampling (KPConv) but benefits less for random sampling (RandLA-Net, up to 4.6% gap). Loss landscape analysis reveals a complex interplay: for structured sampling, imbalance ratio determines landscape geometry on real LiDAR data but decouples from it on synthetic data; for random sampling, landscapes show high sensitivity to dataset geometry regardless of imbalance ratio. For the two evaluated point-based architectures, these results suggest that the interaction between sampling strategy (structured vs. random), imbalance severity, and data acquisition characteristics shapes which mitigation approaches are effective.", "arxiv_id": "2608.16673", "arxiv_url": "https://arxiv.org/abs/2608.16673", "authors": ["Antonis Savva", "Christos Kyrkou", "Theocharis Theocharides"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86 LiDAR \u70b9\u4e91\u8bed\u4e49\u5206\u5272\u4e2d\u7684\u7c7b\u522b\u4e0d\u5747\u8861\u7f13\u89e3\u65b9\u6cd5\uff0c\u6bd4\u8f83\u4e86\u591a\u79cd\u91cd\u52a0\u6743\u7b56\u7565\u548c\u4e0d\u5747\u8861\u635f\u5931\u5728 KPConv \u4e0e RandLA-Net \u4e0a\u7684\u8868\u73b0\u3002\u7ed3\u679c\u53d1\u73b0\u9006\u9891\u7387\u52a0\u6743\u53ef\u80fd\u663e\u8457\u964d\u4f4e\u6027\u80fd\uff0c\u91c7\u6837\u7b56\u7565\u3001\u6570\u636e\u51e0\u4f55\u7279\u6027\u4e0e\u4e0d\u5747\u8861\u7a0b\u5ea6\u5171\u540c\u51b3\u5b9a\u54ea\u7c7b\u65b9\u6cd5\u6709\u6548\uff0c\u7ed3\u6784\u5316\u91c7\u6837\u901a\u5e38\u5bf9\u7b80\u5355\u5747\u5300\u6743\u91cd\u66f4\u7a33\u5065\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16673", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u70b9\u4e91\u5206\u5272", "\u7c7b\u522b\u4e0d\u5747\u8861", "\u91c7\u6837\u7b56\u7565", "\u81ea\u52a8\u9a7e\u9a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16673v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Sampling Strategy Affects Imbalance Mitigation in LiDAR Segmentation: A Study of Structured vs. Random Point-Based Architectures", "tldr": "\u672c\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86 LiDAR \u70b9\u4e91\u8bed\u4e49\u5206\u5272\u4e2d\u7684\u7c7b\u522b\u4e0d\u5747\u8861\u7f13\u89e3\u65b9\u6cd5\uff0c\u6bd4\u8f83\u4e86\u591a\u79cd\u91cd\u52a0\u6743\u7b56\u7565\u548c\u4e0d\u5747\u8861\u635f\u5931\u5728 KPConv \u4e0e RandLA-Net \u4e0a\u7684\u8868\u73b0\u3002\u7ed3\u679c\u53d1\u73b0\u9006\u9891\u7387\u52a0\u6743\u53ef\u80fd\u663e\u8457\u964d\u4f4e\u6027\u80fd\uff0c\u91c7\u6837\u7b56\u7565\u3001\u6570\u636e\u51e0\u4f55\u7279\u6027\u4e0e\u4e0d\u5747\u8861\u7a0b\u5ea6\u5171\u540c\u51b3\u5b9a\u54ea\u7c7b\u65b9\u6cd5\u6709\u6548\uff0c\u7ed3\u6784\u5316\u91c7\u6837\u901a\u5e38\u5bf9\u7b80\u5355\u5747\u5300\u6743\u91cd\u66f4\u7a33\u5065\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in pathology foundation models have enabled accurate prediction of spatial transcriptomics (ST) from routine H\u0026E images. However, existing explainability methods for vision transformer (ViT)-based models are largely limited to local heatmaps and do not reveal how morphological concepts contribute to ST predictions. Here, we introduce an explainable framework that combines relevance propagation and concept discovery to link transcriptional programs to tissue morphology. We developed a ViT-based framework for virtual ST from H\u0026E images that combines ViT-aware layer-wise relevance propagation with relaxed archetypal TopK sparse autoencoder-based concept discovery. This approach provides both local explanations and global insights into the morphological patterns associated with transcriptional programs. We applied the framework to colorectal cancer ST data from the HEST-1k cohort and evaluated its generalizability in TCGA COAD. Our architecture accurately predicts clinically relevant ST signatures and accompanying molecular phenotypes. Measured and predicted gene expression profiles reveal substantial spatial heterogeneity of the colorectal cancer subtypes iCMS2 and iCMS3 across a large number of samples. Spatially resolved and aggregated iCMS classification achieve weighted F1 scores of 0.872 and 0.819 (0.770 in TCGA COAD), respectively, and both stratify patient outcome. Beyond prediction, our framework establishes a relevance-based concept atlas linking molecular phenotypes to histopathological representations. Comparison of activation- with relevance-derived concepts demonstrates that relevances provide a more direct link between tissue morphology and downstream predictions. We establish a general strategy for concept-based explanation of spatial prediction, and our framework is readily applicable to a broad range of ViT-based pathology models.", "arxiv_id": "2608.16669", "arxiv_url": "https://arxiv.org/abs/2608.16669", "authors": ["Amos Muench", "Jonathan Thielmann", "Reduan Achtibat", "Maximilian Dreyer", "Philip Bischoff", "Caroline Forsythe", "Hamidreza Parand", "Thomas Walter", "David Horst", "Sebastian Lapuschkin", "Wojciech Samek", "Teresa Gabriela Krieger"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u75c5\u7406 H\u0026E \u56fe\u50cf\u9884\u6d4b\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u7684\u53ef\u89e3\u91ca\u6846\u67b6\uff0c\u5c06 ViT \u76f8\u5173\u6027\u4f20\u64ad\u4e0e\u7a00\u758f\u81ea\u7f16\u7801\u5668\u6982\u5ff5\u53d1\u73b0\u7ed3\u5408\uff0c\u65e2\u7ed9\u51fa\u5c40\u90e8\u70ed\u56fe\uff0c\u4e5f\u6784\u5efa\u5f62\u6001\u5b66\u6982\u5ff5\u4e0e\u8f6c\u5f55\u7a0b\u5e8f\u7684\u5168\u5c40\u5173\u8054\u3002\u8be5\u65b9\u6cd5\u5728\u7ed3\u76f4\u80a0\u764c\u6570\u636e\u4e0a\u80fd\u51c6\u786e\u9884\u6d4b\u4e34\u5e8a\u76f8\u5173\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u7279\u5f81\u4e0e\u5206\u5b50\u4e9a\u578b\uff0ciCMS \u5206\u7c7b\u53d6\u5f97\u8f83\u9ad8 F1\uff0c\u5e76\u53ef\u7528\u4e8e\u60a3\u8005\u9884\u540e\u5206\u5c42\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16669", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u53ef\u89e3\u91ca\u6027", "\u7a7a\u95f4\u8f6c\u5f55\u7ec4", "\u89c6\u89c9Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16669v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Concept-based explanation of gene expression prediction from H\u0026E images", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u75c5\u7406 H\u0026E \u56fe\u50cf\u9884\u6d4b\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u7684\u53ef\u89e3\u91ca\u6846\u67b6\uff0c\u5c06 ViT \u76f8\u5173\u6027\u4f20\u64ad\u4e0e\u7a00\u758f\u81ea\u7f16\u7801\u5668\u6982\u5ff5\u53d1\u73b0\u7ed3\u5408\uff0c\u65e2\u7ed9\u51fa\u5c40\u90e8\u70ed\u56fe\uff0c\u4e5f\u6784\u5efa\u5f62\u6001\u5b66\u6982\u5ff5\u4e0e\u8f6c\u5f55\u7a0b\u5e8f\u7684\u5168\u5c40\u5173\u8054\u3002\u8be5\u65b9\u6cd5\u5728\u7ed3\u76f4\u80a0\u764c\u6570\u636e\u4e0a\u80fd\u51c6\u786e\u9884\u6d4b\u4e34\u5e8a\u76f8\u5173\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u7279\u5f81\u4e0e\u5206\u5b50\u4e9a\u578b\uff0ciCMS \u5206\u7c7b\u53d6\u5f97\u8f83\u9ad8 F1\uff0c\u5e76\u53ef\u7528\u4e8e\u60a3\u8005\u9884\u540e\u5206\u5c42\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hyperspectral reflectance spectroscopy enables non-destructive estimation of plant functional traits, yet current deep learning approaches process spectra as one-dimensional sequences, which limits how they capture long-range inter-band dependencies. We asked whether transforming 1D spectra into 2D image representations improves multi-trait prediction with convolutional neural networks (CNN). We compared nine transformations using EfficientNet-B0 on the GreenHyperSpectra dataset (7,897 labeled spectra, eight traits, 400-2450 nm), benchmarked against published 1D CNN results on the same split. Trained from scratch, the simplest transformation, a direct Reshape of the spectrum into a 2D grid, performed best ($R^2 = 0.684 \\pm 0.001$) and improved on the state-of-the-art 1D baseline ($R^2 = 0.587$, $+0.097$). We then pretrained a 2D masked autoencoder (MAE-2D) on 139,000 unlabeled spectral images. Linear probing, which freezes the encoder and trains only a multilayer perceptron head, reached $R^2 = 0.646$ and exceeded every 1D self-supervised counterpart, including the fine-tuned MAE-1D ($R^2 = 0.641$). Under cross-dataset evaluation all models lost most of their accuracy and none beat the 1D baseline significantly. To identify which wavelengths drive each prediction, we applied Integrated Gradients and Grad-CAM and unfolded band importance back to the spectral axis. Protein ($r = 0.45$) and leaf water ($r = 0.33$) agreed with sensitivities simulated by the PROSAIL radiative-transfer model, while carotenoids ($r = 0.06$) and leaf area index ($r = -0.11$) did not, showing that the model reads established leaf chemistry for traits with sharp absorption features. The representational advantage of 2D spectral images, rather than architectural complexity or ImageNet pretraining, drives the gain over 1D approaches.", "arxiv_id": "2608.16661", "arxiv_url": "https://arxiv.org/abs/2608.16661", "authors": ["Javier Lopatin", "Teja Kattenborn", "Eya Cherif", "Sebasti\u00e1n Moreno"], "brief": "\u8bba\u6587\u5c06\u4e00\u7ef4\u9ad8\u5149\u8c31\u53cd\u5c04\u8c31\u8f6c\u6362\u4e3a\u4e8c\u7ef4\u56fe\u50cf\uff0c\u7528 EfficientNet-B0 \u8fdb\u884c\u690d\u7269\u591a\u6027\u72b6\u9884\u6d4b\uff0c\u6700\u7b80\u5355\u7684\u76f4\u63a5\u91cd\u6392\u65b9\u6cd5\u53d6\u5f97\u6700\u4f73\u6548\u679c\uff0cR\u00b2 \u4ece\u4e00\u7ef4 CNN \u57fa\u7ebf\u7684 0.587 \u63d0\u5347\u5230 0.684\u3002\u8fdb\u4e00\u6b65\u7528\u4e8c\u7ef4\u63a9\u7801\u81ea\u7f16\u7801\u5668\u5728\u65e0\u6807\u6ce8\u5149\u8c31\u56fe\u50cf\u4e0a\u9884\u8bad\u7ec3\uff0c\u7ebf\u6027\u63a2\u6d4b\u4e5f\u4f18\u4e8e\u4e00\u7ef4\u81ea\u76d1\u7763\u65b9\u6cd5\uff0c\u4f46\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u4ecd\u660e\u663e\u4e0b\u964d\u3002\u53ef\u89e3\u91ca\u6027\u5206\u6790\u663e\u793a\u6a21\u578b\u5bf9\u86cb\u767d\u8d28\u548c\u53f6\u6c34\u5206\u7b49\u5177\u6709\u660e\u786e\u5438\u6536\u7279\u5f81\u7684\u6027\u72b6\u66f4\u7b26\u5408\u7269\u7406\u6a21\u578b\u654f\u611f\u6027\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16661", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u5149\u8c31", "\u690d\u7269\u8868\u578b", "\u5377\u79ef\u795e\u7ecf\u7f51\u7edc", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16661v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Turning spectra into images improves plant trait retrieval with 2D-CNNs", "tldr": "\u8bba\u6587\u5c06\u4e00\u7ef4\u9ad8\u5149\u8c31\u53cd\u5c04\u8c31\u8f6c\u6362\u4e3a\u4e8c\u7ef4\u56fe\u50cf\uff0c\u7528 EfficientNet-B0 \u8fdb\u884c\u690d\u7269\u591a\u6027\u72b6\u9884\u6d4b\uff0c\u6700\u7b80\u5355\u7684\u76f4\u63a5\u91cd\u6392\u65b9\u6cd5\u53d6\u5f97\u6700\u4f73\u6548\u679c\uff0cR\u00b2 \u4ece\u4e00\u7ef4 CNN \u57fa\u7ebf\u7684 0.587 \u63d0\u5347\u5230 0.684\u3002\u8fdb\u4e00\u6b65\u7528\u4e8c\u7ef4\u63a9\u7801\u81ea\u7f16\u7801\u5668\u5728\u65e0\u6807\u6ce8\u5149\u8c31\u56fe\u50cf\u4e0a\u9884\u8bad\u7ec3\uff0c\u7ebf\u6027\u63a2\u6d4b\u4e5f\u4f18\u4e8e\u4e00\u7ef4\u81ea\u76d1\u7763\u65b9\u6cd5\uff0c\u4f46\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u4ecd\u660e\u663e\u4e0b\u964d\u3002\u53ef\u89e3\u91ca\u6027\u5206\u6790\u663e\u793a\u6a21\u578b\u5bf9\u86cb\u767d\u8d28\u548c\u53f6\u6c34\u5206\u7b49\u5177\u6709\u660e\u786e\u5438\u6536\u7279\u5f81\u7684\u6027\u72b6\u66f4\u7b26\u5408\u7269\u7406\u6a21\u578b\u654f\u611f\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cross-view Video Geo-localization (CVG) aims to localize ground-view videos by retrieving their corresponding geo-tagged aerial images. However, CVG approaches rely on fixed-length inputs and post-hoc refinement, hindering online-oriented localization under partial or dynamic observations. In this work, we formulate Progressive Cross-view Video Geo-localization (PCVG) as a deployment-oriented extension and evaluation protocol of CVG, enabling localization under varying temporal budgets, prefix-based inference, random-start evaluation, and long-range localization with interruptions. To explore PCVG, we introduce X$^2$Localizer, a cross-grained alignment framework that jointly supervises global prefix-to-aerial retrieval and token-aggregated frame--aerial-tile matching with a budget-dependent asymmetric objective. Furthermore, we introduce a Sliding-Window Re-Localization (SWRL) strategy that dynamically refreshes candidate regions for failure recovery and long-range deployment without full-sequence reprocessing. Extensive experiments show that X$^2$Localizer preserves conventional full-video performance, with marginal gains of +0.1 Recall@1 and +0.3 Recall@10, while substantially improving early localization. In the challenging single-frame setting, X$^2$Localizer improves coarse retrieval by +4.7 Recall@1 and +11.5 Recall@10 over the previous state-of-the-art method. With SWRL, our approach further enables robust progressive localization under random-start and long-distance scenarios, narrowing the gap between benchmark evaluation and real-world deployment.", "arxiv_id": "2608.16658", "arxiv_url": "https://arxiv.org/abs/2608.16658", "authors": ["Zichao Zeng", "Weijia Fan", "Yufan Chen", "June Moh Goo", "Junwei Zheng", "Ruiping Liu", "Kunyu Peng", "Jiaming Zhang", "Rainer Stiefelhagen", "Jan Boehm"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u90e8\u7f72\u7684\u6e10\u8fdb\u5f0f\u8de8\u89c6\u89d2\u89c6\u9891\u5730\u7406\u5b9a\u4f4d\u4efb\u52a1PCVG\uff0c\u652f\u6301\u4ec5\u7528\u89c6\u9891\u524d\u7f00\u3001\u968f\u673a\u8d77\u70b9\u548c\u957f\u8ddd\u79bb\u4e2d\u65ad\u573a\u666f\u8fdb\u884c\u5728\u7ebf\u5b9a\u4f4d\u3002\u65b9\u6cd5X\u00b2Localizer\u901a\u8fc7\u5168\u5c40\u524d\u7f00-\u822a\u62cd\u68c0\u7d22\u4e0e\u5e27-\u822a\u62cd\u5206\u5757\u7ec6\u7c92\u5ea6\u5339\u914d\u7684\u8de8\u7c92\u5ea6\u5bf9\u9f50\u63d0\u5347\u65e9\u671f\u5b9a\u4f4d\u6548\u679c\uff0c\u5e76\u7528\u6ed1\u52a8\u7a97\u53e3\u91cd\u5b9a\u4f4d\u5b9e\u73b0\u5931\u8d25\u6062\u590d\uff1b\u5355\u5e27\u573a\u666f\u4e0b\u76f8\u5bf9\u5df2\u6709\u6700\u4f18\u65b9\u6cd5Recall@1\u63d0\u53474.7\u3001Recall@10\u63d0\u534711.5\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16658", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5730\u7406\u5b9a\u4f4d", "\u8de8\u89c6\u89d2\u68c0\u7d22", "\u89c6\u9891\u7406\u89e3", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16658v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "X$^2$Localizer: Cross-grained Alignment for Progressive Cross-view Video Geo-localization", "tldr": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u90e8\u7f72\u7684\u6e10\u8fdb\u5f0f\u8de8\u89c6\u89d2\u89c6\u9891\u5730\u7406\u5b9a\u4f4d\u4efb\u52a1PCVG\uff0c\u652f\u6301\u4ec5\u7528\u89c6\u9891\u524d\u7f00\u3001\u968f\u673a\u8d77\u70b9\u548c\u957f\u8ddd\u79bb\u4e2d\u65ad\u573a\u666f\u8fdb\u884c\u5728\u7ebf\u5b9a\u4f4d\u3002\u65b9\u6cd5X\u00b2Localizer\u901a\u8fc7\u5168\u5c40\u524d\u7f00-\u822a\u62cd\u68c0\u7d22\u4e0e\u5e27-\u822a\u62cd\u5206\u5757\u7ec6\u7c92\u5ea6\u5339\u914d\u7684\u8de8\u7c92\u5ea6\u5bf9\u9f50\u63d0\u5347\u65e9\u671f\u5b9a\u4f4d\u6548\u679c\uff0c\u5e76\u7528\u6ed1\u52a8\u7a97\u53e3\u91cd\u5b9a\u4f4d\u5b9e\u73b0\u5931\u8d25\u6062\u590d\uff1b\u5355\u5e27\u573a\u666f\u4e0b\u76f8\u5bf9\u5df2\u6709\u6700\u4f18\u65b9\u6cd5Recall@1\u63d0\u53474.7\u3001Recall@10\u63d0\u534711.5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The impressive visual quality and ubiquity of AI-generated images call for reliable and robust detection methods. Reconstruction-based detectors have emerged as a promising direction for transparent and training-free identification of synthetic images. However, due to their fundamentally different mode of operation (compared to standard, classifier-based methods), little is known about their adversarial robustness. In this work, we propose two novel attack methods targeted at detectors that leverage autoencoder reconstruction error. We find that by constructing imperceptible adversarial examples, the distance between original and reconstruction can be artificially increased, causing fake images to be wrongly classified as real. Our evaluation including images from three state-of-the-art generators and three detectors demonstrates that detection performance is significantly decreased, even if attacked images additionally undergo real-world degradations. Critically, our adversarial examples naturally transfer across detectors, as they all share the same principle, pointing towards an inherent vulnerability of reconstruction-based detectors.", "arxiv_id": "2608.16646", "arxiv_url": "https://arxiv.org/abs/2608.16646", "authors": ["Roman Demchenko", "Jonas Ricker", "Asja Fischer"], "brief": "\u672c\u6587\u7814\u7a76\u514d\u8bad\u7ec3\u3001\u57fa\u4e8e\u81ea\u7f16\u7801\u5668\u91cd\u5efa\u8bef\u5dee\u7684 AI \u751f\u6210\u56fe\u50cf\u68c0\u6d4b\u5668\u7684\u5bf9\u6297\u9c81\u68d2\u6027\uff0c\u5e76\u63d0\u51fa\u4e24\u79cd\u9488\u5bf9\u6027\u653b\u51fb\u65b9\u6cd5\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u51e0\u4e4e\u4e0d\u53ef\u89c1\u7684\u6270\u52a8\u53ef\u663e\u8457\u589e\u5927\u539f\u56fe\u4e0e\u91cd\u5efa\u56fe\u7684\u8ddd\u79bb\uff0c\u4f7f\u4f2a\u9020\u56fe\u50cf\u88ab\u8bef\u5224\u4e3a\u771f\u5b9e\uff0c\u4e14\u653b\u51fb\u5728\u4e0d\u540c\u68c0\u6d4b\u5668\u95f4\u81ea\u7136\u8fc1\u79fb\u3001\u7ecf\u8fc7\u73b0\u5b9e\u9000\u5316\u540e\u4ecd\u6709\u6548\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16646", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u751f\u6210\u56fe\u50cf\u68c0\u6d4b", "\u5bf9\u6297\u6837\u672c", "\u9c81\u68d2\u6027", "\u81ea\u7f16\u7801\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16646v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Training-Free Reconstruction-Based AI-Generated Image Detectors Are Inherently Vulnerable to Adversarial Examples", "tldr": "\u672c\u6587\u7814\u7a76\u514d\u8bad\u7ec3\u3001\u57fa\u4e8e\u81ea\u7f16\u7801\u5668\u91cd\u5efa\u8bef\u5dee\u7684 AI \u751f\u6210\u56fe\u50cf\u68c0\u6d4b\u5668\u7684\u5bf9\u6297\u9c81\u68d2\u6027\uff0c\u5e76\u63d0\u51fa\u4e24\u79cd\u9488\u5bf9\u6027\u653b\u51fb\u65b9\u6cd5\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u51e0\u4e4e\u4e0d\u53ef\u89c1\u7684\u6270\u52a8\u53ef\u663e\u8457\u589e\u5927\u539f\u56fe\u4e0e\u91cd\u5efa\u56fe\u7684\u8ddd\u79bb\uff0c\u4f7f\u4f2a\u9020\u56fe\u50cf\u88ab\u8bef\u5224\u4e3a\u771f\u5b9e\uff0c\u4e14\u653b\u51fb\u5728\u4e0d\u540c\u68c0\u6d4b\u5668\u95f4\u81ea\u7136\u8fc1\u79fb\u3001\u7ecf\u8fc7\u73b0\u5b9e\u9000\u5316\u540e\u4ecd\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep learning-based object detectors are fundamental to intelligent transportation systems, enabling traffic monitoring, vehicle analytics, and infrastructure management. However, achieving both fine-grained vehicle recognition and robust cross-city domain generalization remains challenging. We present the Domain-Robust Asymmetric Fusion Ensemble (DRAFE), which combines independently trained LW-DETR and RF-DETR detectors for cross-city fine-grained traffic object detection. DRAFE employs a two-stage training strategy that first pretrains complementary detectors on diverse public traffic datasets using pseudo-label expansion and human-in-the-loop annotation refinement, producing a curated corpus of 6,049 images and 203,619 annotations, before challenge-compliant fine-tuning on the Project Hafnia Track 6 dataset. At inference, DRAFE applies anchor-conditioned class-consistent matching, reliability-weighted coordinate fusion, agreement-aware confidence recalibration, and complementary hypothesis recovery. On AI City Challenge 2026 Track 6, DRAFE achieves 0.4022 mAP, ranks sixth among 25 participating teams, and improves by 0.0553 mAP over a preliminary ensemble evaluated under identical benchmark conditions.", "arxiv_id": "2608.16632", "arxiv_url": "https://arxiv.org/abs/2608.16632", "authors": ["Divine Yao Agbobli", "Geoffery Eyram Agorku", "Israel Afriyie", "Kwadwo Amankwah-Nkyi", "Marvin Osei-Kuffour", "Richmond Owusu Duah", "Bright Seglah", "Kelvin Asamoah Terkper", "Kwabena Amoako Adjei"], "brief": "\u8bba\u6587\u63d0\u51fa DRAFE\uff0c\u4e00\u4e2a\u9762\u5411\u8de8\u57ce\u5e02\u7ec6\u7c92\u5ea6\u4ea4\u901a\u76ee\u6807\u68c0\u6d4b\u7684\u5f02\u6784\u68c0\u6d4b Transformer \u878d\u5408\u96c6\u6210\u65b9\u6cd5\uff0c\u7ed3\u5408 LW-DETR \u4e0e RF-DETR\uff0c\u5e76\u901a\u8fc7\u4f2a\u6807\u7b7e\u6269\u5c55\u548c\u4eba\u5de5\u6807\u6ce8\u4fee\u6b63\u6784\u5efa\u66f4\u4e30\u5bcc\u8bad\u7ec3\u96c6\u3002\u5176\u63a8\u7406\u9636\u6bb5\u91c7\u7528\u7c7b\u522b\u4e00\u81f4\u5339\u914d\u3001\u52a0\u6743\u6846\u878d\u5408\u548c\u7f6e\u4fe1\u5ea6\u91cd\u6821\u51c6\u7b49\u7b56\u7565\uff0c\u5728 AI City Challenge 2026 Track 6 \u53d6\u5f97 0.4022 mAP\uff0c\u6392\u540d\u7b2c\u516d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16632", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u4ea4\u901a\u611f\u77e5", "\u9886\u57df\u6cdb\u5316", "\u6a21\u578b\u96c6\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16632v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DRAFE: Domain-Robust Asymmetric Fusion of Heterogeneous Detection Transformers for Cross-City Fine-Grained Traffic Object Detection", "tldr": "\u8bba\u6587\u63d0\u51fa DRAFE\uff0c\u4e00\u4e2a\u9762\u5411\u8de8\u57ce\u5e02\u7ec6\u7c92\u5ea6\u4ea4\u901a\u76ee\u6807\u68c0\u6d4b\u7684\u5f02\u6784\u68c0\u6d4b Transformer \u878d\u5408\u96c6\u6210\u65b9\u6cd5\uff0c\u7ed3\u5408 LW-DETR \u4e0e RF-DETR\uff0c\u5e76\u901a\u8fc7\u4f2a\u6807\u7b7e\u6269\u5c55\u548c\u4eba\u5de5\u6807\u6ce8\u4fee\u6b63\u6784\u5efa\u66f4\u4e30\u5bcc\u8bad\u7ec3\u96c6\u3002\u5176\u63a8\u7406\u9636\u6bb5\u91c7\u7528\u7c7b\u522b\u4e00\u81f4\u5339\u914d\u3001\u52a0\u6743\u6846\u878d\u5408\u548c\u7f6e\u4fe1\u5ea6\u91cd\u6821\u51c6\u7b49\u7b56\u7565\uff0c\u5728 AI City Challenge 2026 Track 6 \u53d6\u5f97 0.4022 mAP\uff0c\u6392\u540d\u7b2c\u516d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal harmful meme detection is typically formulated as image--text harmfulness classification. A model may correctly predict harmfulness while misidentifying the attacked target or its supporting evidence. We therefore extend harmful meme detection with fine-grained target identification, asking what type of target is attacked, who is targeted, and where the target appears in the meme. The model predicts harmfulness for every meme and, for harmful memes, outputs the target category, target entity, textual mention, and visual region. To support this task, we introduce Meme3W, which unifies multiple public harmful meme datasets and provides human-verified annotations for harmful instances. We further introduce Joint Record Accuracy (JRA), a strict record-level metric requiring the harmfulness label and all target-identification fields to be jointly correct. Experiments with representative multimodal large language models reveal a substantial gap between harmfulness accuracy and JRA. To narrow this gap, we propose HarmTrace, an anchor-calibrated decoupled optimization framework. HarmTrace strengthens target-entity supervision through entity-aware supervised fine-tuning. It then applies Conditional Target-identification Policy Optimization (CTPO) to decouple harmfulness and target-identification advantages, restricting target-identification optimization to label-correct responses for harmful examples. CTPO uses a Virtual Positive Anchor (VPA) as a fully correct reference for target-identification advantage normalization. HarmTrace improves both JRA and harmfulness accuracy across the evaluated backbones, with JRA on the Qwen3-VL-8B backbone increasing from 17.58\\% to 52.51\\%. Our code is publicly available at https://github.com/llly1234/HarmTrace-for-Harmful-Memes.", "arxiv_id": "2608.16622", "arxiv_url": "https://arxiv.org/abs/2608.16622", "authors": ["Yujia Li", "Yiqun Zhang", "Zihan Cheng", "Yijie Huang", "Tenglong Ye", "Zihan Wang", "Xiaocui Yang", "Shi Feng", "Yifei Zhang", "Daling Wang"], "brief": "\u672c\u6587\u5c06\u6709\u5bb3 meme \u68c0\u6d4b\u4ece\u5355\u7eaf\u5224\u522b\u662f\u5426\u6709\u5bb3\uff0c\u6269\u5c55\u5230\u7ec6\u7c92\u5ea6\u8bc6\u522b\u653b\u51fb\u76ee\u6807\uff1a\u76ee\u6807\u7c7b\u522b\u3001\u5b9e\u4f53\u3001\u6587\u672c\u63d0\u53ca\u548c\u89c6\u89c9\u533a\u57df\uff0c\u5e76\u6784\u5efa\u4e86\u5e26\u4eba\u5de5\u9a8c\u8bc1\u6807\u6ce8\u7684 Meme3W \u6570\u636e\u96c6\u4e0e\u4e25\u683c\u6307\u6807 JRA\u3002\u63d0\u51fa HarmTrace\uff0c\u901a\u8fc7\u5b9e\u4f53\u611f\u77e5\u5fae\u8c03\u548c\u89e3\u8026\u7684\u7b56\u7565\u4f18\u5316 CTPO \u6821\u51c6\u76ee\u6807\u8bc6\u522b\uff0c\u5728\u591a\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e0a\u663e\u8457\u63d0\u5347\u6548\u679c\uff0c\u4f8b\u5982 Qwen3-VL-8B \u7684 JRA \u4ece 17.58% \u63d0\u5347\u5230 52.51%\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16622", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u6709\u5bb3\u5185\u5bb9\u68c0\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u76d1\u7763\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16622v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HarmTrace: Anchor-Calibrated Decoupled Optimization for Fine-Grained Target Identification in Harmful Memes", "tldr": "\u672c\u6587\u5c06\u6709\u5bb3 meme \u68c0\u6d4b\u4ece\u5355\u7eaf\u5224\u522b\u662f\u5426\u6709\u5bb3\uff0c\u6269\u5c55\u5230\u7ec6\u7c92\u5ea6\u8bc6\u522b\u653b\u51fb\u76ee\u6807\uff1a\u76ee\u6807\u7c7b\u522b\u3001\u5b9e\u4f53\u3001\u6587\u672c\u63d0\u53ca\u548c\u89c6\u89c9\u533a\u57df\uff0c\u5e76\u6784\u5efa\u4e86\u5e26\u4eba\u5de5\u9a8c\u8bc1\u6807\u6ce8\u7684 Meme3W \u6570\u636e\u96c6\u4e0e\u4e25\u683c\u6307\u6807 JRA\u3002\u63d0\u51fa HarmTrace\uff0c\u901a\u8fc7\u5b9e\u4f53\u611f\u77e5\u5fae\u8c03\u548c\u89e3\u8026\u7684\u7b56\u7565\u4f18\u5316 CTPO \u6821\u51c6\u76ee\u6807\u8bc6\u522b\uff0c\u5728\u591a\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e0a\u663e\u8457\u63d0\u5347\u6548\u679c\uff0c\u4f8b\u5982 Qwen3-VL-8B \u7684 JRA \u4ece 17.58% \u63d0\u5347\u5230 52.51%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Geospatial Foundation Models (GeoFMs) are most commonly ranked and selected by accuracy on standard benchmark conditions via averaged ranks. We show that this protocol is too narrow: the promised deployment in critical EO tasks requires further angles of analysis, mainly calibration, the agreement between a model\u0027s confidence and its correctness. Across 16 frozen encoders, four classification and five segmentation datasets, and two orthogonal stress axes, every encoder degrades as corruption intensifies, and the ranking changes as well. Across the four classification benchmarks, EO-pretrained and ImageNet-pretrained encoders are indistinguishable on clean accuracy and clean calibration, and EO pretraining provides no more stability under shift than ImageNet pretraining. Under shift the GeoFMs drift further into overconfidence than the ImageNet-pretrained encoders, at every grade and in every corruption family. A centered kernel alignment (CKA) analysis ties this to representational rigidity: EO-pretrained embeddings move less under corruption while losing just as much task information and remaining overconfident. We apply three commonly explored uncertainty quantification methods and find that temperature scaling and deep ensembles cannot counteract the degradation, while a Gaussian-process probe roughly halves ECE under severe cloud only by tripling it on clean data. In selective prediction experiments, we find that confidence-based abstention cannot defer around confidently wrong predictions, and advocate that benchmark rankings and evaluations should therefore operate across a multitude of conditions and metrics to more holistically evaluate model development progress and close the gap to real world deployment scenarios.", "arxiv_id": "2608.16614", "arxiv_url": "https://arxiv.org/abs/2608.16614", "authors": ["Nils Lehmann", "Jakob Gawlikowski", "Burak Ekim", "Isaac Corley", "Xiao Xiang Zhu"], "brief": "\u672c\u6587\u8bc4\u4f30\u4e8616\u4e2a\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b\u5728\u591a\u79cd\u5206\u7c7b\u3001\u5206\u5272\u4efb\u52a1\u548c\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u6821\u51c6\u6027\u4e0e\u9c81\u68d2\u6027\uff0c\u53d1\u73b0\u4ec5\u7528\u51c6\u786e\u7387\u6392\u540d\u4f1a\u63a9\u76d6\u6a21\u578b\u5728\u7f6e\u4fe1\u5ea6\u53ef\u9760\u6027\u4e0a\u7684\u4e25\u91cd\u95ee\u9898\u3002\u5b9e\u9a8c\u663e\u793a\uff0cEO\u9884\u8bad\u7ec3\u6a21\u578b\u76f8\u6bd4ImageNet\u9884\u8bad\u7ec3\u5e76\u672a\u5e26\u6765\u66f4\u7a33\u5b9a\u7684\u504f\u79fb\u8868\u73b0\uff0c\u4e14\u5728\u5206\u5e03\u504f\u79fb\u4e0b\u66f4\u5bb9\u6613\u8fc7\u5ea6\u81ea\u4fe1\uff1b\u5e38\u89c1\u4e0d\u786e\u5b9a\u6027\u65b9\u6cd5\u4e5f\u96be\u4ee5\u6709\u6548\u4fee\u6b63\u8fd9\u4e00\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16614", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b", "\u6a21\u578b\u6821\u51c6", "\u5206\u5e03\u504f\u79fb", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16614v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Accuracy: Assessing Calibration of Geospatial Foundation Models and Their Sensitivity to Distribution Shifts", "tldr": "\u672c\u6587\u8bc4\u4f30\u4e8616\u4e2a\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b\u5728\u591a\u79cd\u5206\u7c7b\u3001\u5206\u5272\u4efb\u52a1\u548c\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u6821\u51c6\u6027\u4e0e\u9c81\u68d2\u6027\uff0c\u53d1\u73b0\u4ec5\u7528\u51c6\u786e\u7387\u6392\u540d\u4f1a\u63a9\u76d6\u6a21\u578b\u5728\u7f6e\u4fe1\u5ea6\u53ef\u9760\u6027\u4e0a\u7684\u4e25\u91cd\u95ee\u9898\u3002\u5b9e\u9a8c\u663e\u793a\uff0cEO\u9884\u8bad\u7ec3\u6a21\u578b\u76f8\u6bd4ImageNet\u9884\u8bad\u7ec3\u5e76\u672a\u5e26\u6765\u66f4\u7a33\u5b9a\u7684\u504f\u79fb\u8868\u73b0\uff0c\u4e14\u5728\u5206\u5e03\u504f\u79fb\u4e0b\u66f4\u5bb9\u6613\u8fc7\u5ea6\u81ea\u4fe1\uff1b\u5e38\u89c1\u4e0d\u786e\u5b9a\u6027\u65b9\u6cd5\u4e5f\u96be\u4ee5\u6709\u6548\u4fee\u6b63\u8fd9\u4e00\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Whole-slide image (WSI) analysis remains computationally challenging due to the extremely large spatial resolution of slides and the sparse distribution of tumour regions. We propose an end-to-end reinforcement learning framework for sequential tumour segmentation directly on WSIs. Instead of treating the slide as a predefined collection of candidate patches, we formulate the WSI itself as a hierarchical multi-resolution environment through which an agent navigates using movement, zooming, and tumour selection actions. The agent jointly processes local observations and a global thumbnail representation within an actor-critic architecture trained using proximal policy optimization (PPO). Experiments on pulmonary adenocarcinoma WSIs demonstrate the feasibility of direct sequential tumour segmentation on full slides, achieving comparable coarse segmentation quality relative to patch-based approaches operating at similar magnification levels, while reducing inference time to a few seconds per slide. We further analyse the impact of environment design and action-space granularity. Our results suggest that modelling WSIs as interactive environments provides a promising direction for RL-based computational pathology", "arxiv_id": "2608.16607", "arxiv_url": "https://arxiv.org/abs/2608.16607", "authors": ["Mohamad Mohamad", "Francesco Ponzio", "Maxime Gassier", "Nicolas Pote", "Xavier Descombes"], "brief": "\u672c\u6587\u5c06\u5168\u5207\u7247\u75c5\u7406\u56fe\u50cf\u5efa\u6a21\u4e3a\u5206\u5c42\u591a\u5206\u8fa8\u7387\u4ea4\u4e92\u73af\u5883\uff0c\u8ba9\u5f3a\u5316\u5b66\u4e60\u667a\u80fd\u4f53\u901a\u8fc7\u79fb\u52a8\u3001\u7f29\u653e\u548c\u80bf\u7624\u9009\u62e9\u52a8\u4f5c\u76f4\u63a5\u8fdb\u884c\u5e8f\u5217\u5f0f\u80bf\u7624\u5206\u5272\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u80ba\u817a\u764c WSI \u4e0a\u8fbe\u5230\u4e0e\u540c\u500d\u7387 patch \u65b9\u6cd5\u76f8\u8fd1\u7684\u7c97\u5206\u5272\u8d28\u91cf\uff0c\u540c\u65f6\u5c06\u5355\u5f20\u5207\u7247\u63a8\u7406\u65f6\u95f4\u964d\u81f3\u6570\u79d2\u7ea7\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16607", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u75c5\u7406\u56fe\u50cf", "\u56fe\u50cf\u5206\u5272"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16607v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Interactive Whole Slide Images for RL-based Tumour Segmentation", "tldr": "\u672c\u6587\u5c06\u5168\u5207\u7247\u75c5\u7406\u56fe\u50cf\u5efa\u6a21\u4e3a\u5206\u5c42\u591a\u5206\u8fa8\u7387\u4ea4\u4e92\u73af\u5883\uff0c\u8ba9\u5f3a\u5316\u5b66\u4e60\u667a\u80fd\u4f53\u901a\u8fc7\u79fb\u52a8\u3001\u7f29\u653e\u548c\u80bf\u7624\u9009\u62e9\u52a8\u4f5c\u76f4\u63a5\u8fdb\u884c\u5e8f\u5217\u5f0f\u80bf\u7624\u5206\u5272\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u80ba\u817a\u764c WSI \u4e0a\u8fbe\u5230\u4e0e\u540c\u500d\u7387 patch \u65b9\u6cd5\u76f8\u8fd1\u7684\u7c97\u5206\u5272\u8d28\u91cf\uff0c\u540c\u65f6\u5c06\u5355\u5f20\u5207\u7247\u63a8\u7406\u65f6\u95f4\u964d\u81f3\u6570\u79d2\u7ea7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Aligning intraoperative biplanar digital subtraction angiography (DSA) to pre-procedural computed tomography angiography (CTA) requires rapid and accurate 3D-to-2D registration. Optimization-based methods are sensitive to initialization and may require hundreds of iterations, whereas learning-based approaches commonly rely on patient-specific training. We propose GeoPose, a population-trained framework that estimates the C-arm pose in a learned canonical frame and transfers it to the native frame of an unseen CTA through projection-space calibration and transform composition. A population-trained residual network refines the pose, followed optionally by low-budget image-driven optimization. GeoPose requires neither patient-specific adaptation nor explicit inter-volume preregistration. On 80 DSA observations from 20 held-out patients, optimization-free GeoPose achieved a carotid mean projected centerline distance (mPCD) of 5.8 mm and a clDice of 0.45, compared with 14.5 mm and 0.28 for the best-performing baseline, while requiring only 0.15 s. After 25 optimization iterations, GeoPose reached an mPCD of 4.6 mm and a clDice of 0.58 in approximately two seconds. Under the same budget, native-initialized optimization achieved 14.6 mm and 0.15, respectively. GeoPose thus provides rapid native-frame registration with fixed population-level weights and the geometric correspondence required for downstream biplanar 3D vascular reconstruction.", "arxiv_id": "2608.16600", "arxiv_url": "https://arxiv.org/abs/2608.16600", "authors": ["Rudolf L. M. van Herten", "Robert Graf", "Paula Feldman", "Johannes C. Paetzold"], "brief": "GeoPose \u63d0\u51fa\u4e00\u79cd\u9762\u5411 CTA \u5230\u53cc\u5e73\u9762 DSA \u7684\u60a3\u8005\u65e0\u5173 3D-2D \u914d\u51c6\u6846\u67b6\uff0c\u901a\u8fc7\u6295\u5f71\u7a7a\u95f4\u6821\u51c6\u628a\u7fa4\u4f53\u8bad\u7ec3\u5f97\u5230\u7684 C \u81c2\u4f4d\u59ff\u8fc1\u79fb\u5230\u672a\u89c1\u60a3\u8005\u7684\u539f\u751f CTA \u5750\u6807\u7cfb\u3002\u76f8\u6bd4\u4f20\u7edf\u4f18\u5316\u548c\u57fa\u7ebf\u65b9\u6cd5\uff0c\u5b83\u65e0\u9700\u60a3\u8005\u7279\u5f02\u8bad\u7ec3\uff0c0.15 \u79d2\u5373\u53ef\u663e\u8457\u964d\u4f4e\u914d\u51c6\u8bef\u5dee\uff1b\u5c11\u91cf\u540e\u7eed\u4f18\u5316\u540e\u7ea6 2 \u79d2\u5185\u8fdb\u4e00\u6b65\u63d0\u5347\u7cbe\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16600", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf\u914d\u51c6", "\u51e0\u4f55\u6821\u51c6", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u8840\u7ba1\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16600v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GeoPose: Patient-agnostic CTA-to-DSA registration through projection-space calibration", "tldr": "GeoPose \u63d0\u51fa\u4e00\u79cd\u9762\u5411 CTA \u5230\u53cc\u5e73\u9762 DSA \u7684\u60a3\u8005\u65e0\u5173 3D-2D \u914d\u51c6\u6846\u67b6\uff0c\u901a\u8fc7\u6295\u5f71\u7a7a\u95f4\u6821\u51c6\u628a\u7fa4\u4f53\u8bad\u7ec3\u5f97\u5230\u7684 C \u81c2\u4f4d\u59ff\u8fc1\u79fb\u5230\u672a\u89c1\u60a3\u8005\u7684\u539f\u751f CTA \u5750\u6807\u7cfb\u3002\u76f8\u6bd4\u4f20\u7edf\u4f18\u5316\u548c\u57fa\u7ebf\u65b9\u6cd5\uff0c\u5b83\u65e0\u9700\u60a3\u8005\u7279\u5f02\u8bad\u7ec3\uff0c0.15 \u79d2\u5373\u53ef\u663e\u8457\u964d\u4f4e\u914d\u51c6\u8bef\u5dee\uff1b\u5c11\u91cf\u540e\u7eed\u4f18\u5316\u540e\u7ea6 2 \u79d2\u5185\u8fdb\u4e00\u6b65\u63d0\u5347\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Presentation-Attack Detection (PAD) for national ID cards is limited by the lack of publicly available genuine samples, making it difficult for systems to generalize across countries. This paper introduces two main innovations: (1) a Prototypical Network head using an EfficientNet-V2-b0 backbone that requires only four genuine samples per class to create reliable prototypes; and (2) an episodic training regime that keeps PAD classes fixed while varying the card domain, allowing the network to learn universal attack cues. Evaluated on a large multi-country dataset and the public DLC-2021 benchmark, this method achieves an average Equal Error Rate of around 9\\%, outperforming conventional softmax and CLIP zero-shot baselines even with data from a single source country. This approach provides accurate, privacy-preserving PAD while minimizing data collection, facilitating scalable cross-jurisdictional remote onboarding.", "arxiv_id": "2608.16591", "arxiv_url": "https://arxiv.org/abs/2608.16591", "authors": ["Mario Nieto-Hidalgo", "Juan M. Espin", "Juan E. Tapia"], "brief": "\u672c\u6587\u7814\u7a76\u8eab\u4efd\u8bc1\u4ef6\u5c55\u793a\u653b\u51fb\u68c0\u6d4b\u7684\u96f6\u6837\u672c\u8de8\u57df\u6cdb\u5316\u95ee\u9898\uff0c\u63d0\u51fa\u57fa\u4e8e EfficientNet-V2-b0 \u7684\u539f\u578b\u7f51\u7edc\u5934\uff0c\u5e76\u901a\u8fc7\u5c11\u91cf\u771f\u5b9e\u6837\u672c\u6784\u5efa\u7c7b\u522b\u539f\u578b\u3002\u7ed3\u5408\u6309\u56fd\u5bb6/\u8bc1\u4ef6\u57df\u53d8\u5316\u7684 episodic \u8bad\u7ec3\uff0c\u6a21\u578b\u5b66\u4e60\u66f4\u901a\u7528\u7684\u653b\u51fb\u7ebf\u7d22\uff0c\u5728\u591a\u56fd\u6570\u636e\u548c DLC-2021 \u4e0a\u5e73\u5747\u7b49\u9519\u8bef\u7387\u7ea6 9%\uff0c\u4f18\u4e8e softmax \u548c CLIP \u96f6\u6837\u672c\u57fa\u7ebf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16591", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u57df\u6cdb\u5316", "\u8eab\u4efd\u8ba4\u8bc1", "\u5c0f\u6837\u672c\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16591v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards Zero-Shot Domain Generalization for ID Cards Presentation Attack Detection", "tldr": "\u672c\u6587\u7814\u7a76\u8eab\u4efd\u8bc1\u4ef6\u5c55\u793a\u653b\u51fb\u68c0\u6d4b\u7684\u96f6\u6837\u672c\u8de8\u57df\u6cdb\u5316\u95ee\u9898\uff0c\u63d0\u51fa\u57fa\u4e8e EfficientNet-V2-b0 \u7684\u539f\u578b\u7f51\u7edc\u5934\uff0c\u5e76\u901a\u8fc7\u5c11\u91cf\u771f\u5b9e\u6837\u672c\u6784\u5efa\u7c7b\u522b\u539f\u578b\u3002\u7ed3\u5408\u6309\u56fd\u5bb6/\u8bc1\u4ef6\u57df\u53d8\u5316\u7684 episodic \u8bad\u7ec3\uff0c\u6a21\u578b\u5b66\u4e60\u66f4\u901a\u7528\u7684\u653b\u51fb\u7ebf\u7d22\uff0c\u5728\u591a\u56fd\u6570\u636e\u548c DLC-2021 \u4e0a\u5e73\u5747\u7b49\u9519\u8bef\u7387\u7ea6 9%\uff0c\u4f18\u4e8e softmax \u548c CLIP \u96f6\u6837\u672c\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Unsupervised Domain Adaptation for Adverse Weather Semantic Segmentation (UDA-ASS) aims to transfer semantic knowledge from labeled normal-weather images to unlabeled adverse environments. Existing approaches implicitly assume that restoration and segmentation provide mutually beneficial guidance. However, under severe degradation and without target-domain supervision, the validity of cross-task optimization directions becomes fundamentally unidentifiable, leading to hallucination-driven error propagation. In this work, we propose a novel Unsupervised Restoration-Segmentation Collaborative Learning Framework (Ultra), which reframes cross-task interaction as direction selection under uncertainty and causal effect estimation, enabling reliable collaboration through candidate direction generation and intervention-based filtering. In detail, we propose CTDN and CMIL. The former exploits complementary visual structures and semantic information to generate candidate optimization directions and performs cooperative direction selection between restoration and segmentation. The latter reformulates cross-task information transfer from correlation-based propagation into causal effect assessment, suppressing hallucination propagation. Extensive experiments on three widely used UDA-ASS benchmarks demonstrate state-of-the-art segmentation performance. Beyond segmentation, our framework achieves better unsupervised restoration results than existing UDA-ASS restoration methods and generalizes to unsupervised restoration and object detection collaboration tasks. Code and models will be available at https://github.com/Wang-Shiqin/Ultra.", "arxiv_id": "2608.16589", "arxiv_url": "https://arxiv.org/abs/2608.16589", "authors": ["Shiqin Wang", "Zhiqian Li", "Haoyuan Du", "Junming Chen", "Jiayuan Li", "Tianrun Xu", "Haoyang Chen"], "brief": "\u672c\u6587\u63d0\u51fa Ultra\uff0c\u4e00\u4e2a\u9762\u5411\u6076\u52a3\u5929\u6c14\u65e0\u76d1\u7763\u57df\u9002\u5e94\u8bed\u4e49\u5206\u5272\u7684\u590d\u539f-\u5206\u5272\u534f\u540c\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u8de8\u4efb\u52a1\u534f\u4f5c\u5efa\u6a21\u4e3a\u4e0d\u786e\u5b9a\u6027\u4e0b\u7684\u65b9\u5411\u9009\u62e9\u4e0e\u56e0\u679c\u6548\u5e94\u8bc4\u4f30\u3002\u901a\u8fc7\u5019\u9009\u4f18\u5316\u65b9\u5411\u751f\u6210\u3001\u534f\u540c\u7b5b\u9009\u548c\u5e72\u9884\u5f0f\u8fc7\u6ee4\uff0c\u51cf\u5c11\u590d\u539f\u5e7b\u89c9\u5bfc\u81f4\u7684\u9519\u8bef\u4f20\u64ad\uff0c\u5728\u4e09\u4e2a UDA-ASS \u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u5148\u8fdb\u5206\u5272\u6027\u80fd\uff0c\u5e76\u63d0\u5347\u65e0\u76d1\u7763\u590d\u539f\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16589", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65e0\u76d1\u7763\u57df\u9002\u5e94", "\u8bed\u4e49\u5206\u5272", "\u56fe\u50cf\u590d\u539f", "\u56e0\u679c\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16589v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ultra: Unsupervised Cross-Task Optimization for Reliable Restoration Segmentation Collaboration under Adverse Weather", "tldr": "\u672c\u6587\u63d0\u51fa Ultra\uff0c\u4e00\u4e2a\u9762\u5411\u6076\u52a3\u5929\u6c14\u65e0\u76d1\u7763\u57df\u9002\u5e94\u8bed\u4e49\u5206\u5272\u7684\u590d\u539f-\u5206\u5272\u534f\u540c\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u8de8\u4efb\u52a1\u534f\u4f5c\u5efa\u6a21\u4e3a\u4e0d\u786e\u5b9a\u6027\u4e0b\u7684\u65b9\u5411\u9009\u62e9\u4e0e\u56e0\u679c\u6548\u5e94\u8bc4\u4f30\u3002\u901a\u8fc7\u5019\u9009\u4f18\u5316\u65b9\u5411\u751f\u6210\u3001\u534f\u540c\u7b5b\u9009\u548c\u5e72\u9884\u5f0f\u8fc7\u6ee4\uff0c\u51cf\u5c11\u590d\u539f\u5e7b\u89c9\u5bfc\u81f4\u7684\u9519\u8bef\u4f20\u64ad\uff0c\u5728\u4e09\u4e2a UDA-ASS \u57fa
