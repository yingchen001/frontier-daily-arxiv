\u51c6\u4e0a\u53d6\u5f97\u6700\u5148\u8fdb\u5206\u5272\u6027\u80fd\uff0c\u5e76\u63d0\u5347\u65e0\u76d1\u7763\u590d\u539f\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video Diffusion Transformers (DiTs) spend most of their compute inside the Self-Attention operation, whose cost grows quadratically, $\\mathcal{O}(n^2)$, with the number of latent tokens $n$. For the task of video generation, the token count is large, so this term dominates runtime and memory, and thereby caps the resolution and duration we can generate. Linear $\\mathcal{O}(n)$ and low-rank $\\mathcal{O}(nk)$ surrogates of Self-Attention trade the full softmax $QK^T$ for cheaper kernels, but rarely recover the original\u0027s expressivity, leaving a stubborn quality gap. Motivated by this, we propose SQuad, a Sub-Quadratic Attention Distillation framework that achieves a complexity of $\\mathcal{O}(n\\sqrt{n})$ in the resulting distilled Attention, naturally balancing the efficiency v/s expressivity trade-off. Instead of training our own Video DiT from scratch, which is prohibitively expensive, we fit a pretrained full softmax Self-Attention DiT into our proposed SQuad-Attention one by distilling the former in two stages: Flow-Matching Supervised Fine-Tuning (SFT), followed by improved Distribution Matching Distillation (DMD2) which additionally makes the sampling more efficient. On the Wan~2.2 5B text-to-video model, SQuAD matches the quadratic teacher on VBench ($83.20$ v/s $83.08$) while cutting the per-step per-block attention FLOPs by $\\sim$$67\\times$ and attention latency by $\\sim$$11\\times$, and end-to-end DiT latency by 2$\\times$, all while also generating a video in only $6$ Neural Functional Evaluations (NFEs) instead of the default $100$.", "arxiv_id": "2608.16585", "arxiv_url": "https://arxiv.org/abs/2608.16585", "authors": ["Animesh Karnewar", "Denis Korzhenkov", "Amirhossein Habibian", "Mohsen Ghafoorian"], "brief": "\u8bba\u6587\u63d0\u51fa SQuad\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u9891\u6269\u6563 Transformer \u7684\u6b21\u4e8c\u6b21\u6ce8\u610f\u529b\u84b8\u998f\u6846\u67b6\uff0c\u5c06\u5168\u91cf softmax \u6ce8\u610f\u529b\u66ff\u6362\u4e3a\u590d\u6742\u5ea6 O(n\u221an) \u7684 SQuad-Attention\uff0c\u4ee5\u517c\u987e\u6548\u7387\u548c\u8868\u8fbe\u80fd\u529b\u3002\u901a\u8fc7\u5bf9\u9884\u8bad\u7ec3 Wan 2.2 5B \u6587\u751f\u89c6\u9891\u6a21\u578b\u8fdb\u884c\u4e24\u9636\u6bb5\u84b8\u998f\uff0cVBench \u8d28\u91cf\u57fa\u672c\u6301\u5e73\u6559\u5e08\u6a21\u578b\uff0c\u540c\u65f6\u6ce8\u610f\u529b FLOPs \u964d\u4f4e\u7ea6 67 \u500d\u3001\u6ce8\u610f\u529b\u5ef6\u8fdf\u964d\u4f4e\u7ea6 11 \u500d\uff0c\u5e76\u5c06\u91c7\u6837\u6b65\u6570\u4ece 100 \u964d\u5230 6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16585", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u6ce8\u610f\u529b\u673a\u5236", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16585v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SQuad: Sub-Quadratic Attention Distillation for Efficient Video Generation", "tldr": "\u8bba\u6587\u63d0\u51fa SQuad\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u9891\u6269\u6563 Transformer \u7684\u6b21\u4e8c\u6b21\u6ce8\u610f\u529b\u84b8\u998f\u6846\u67b6\uff0c\u5c06\u5168\u91cf softmax \u6ce8\u610f\u529b\u66ff\u6362\u4e3a\u590d\u6742\u5ea6 O(n\u221an) \u7684 SQuad-Attention\uff0c\u4ee5\u517c\u987e\u6548\u7387\u548c\u8868\u8fbe\u80fd\u529b\u3002\u901a\u8fc7\u5bf9\u9884\u8bad\u7ec3 Wan 2.2 5B \u6587\u751f\u89c6\u9891\u6a21\u578b\u8fdb\u884c\u4e24\u9636\u6bb5\u84b8\u998f\uff0cVBench \u8d28\u91cf\u57fa\u672c\u6301\u5e73\u6559\u5e08\u6a21\u578b\uff0c\u540c\u65f6\u6ce8\u610f\u529b FLOPs \u964d\u4f4e\u7ea6 67 \u500d\u3001\u6ce8\u610f\u529b\u5ef6\u8fdf\u964d\u4f4e\u7ea6 11 \u500d\uff0c\u5e76\u5c06\u91c7\u6837\u6b65\u6570\u4ece 100 \u964d\u5230 6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most super-resolution models learn from paired data by supervising only the final high-resolution output. This provides little control over how the prediction should evolve between the downsampled observation and its fine target. We introduce GalerkinFlow, an equation-agnostic framework that turns each coarse--fine pair into supervision along an entire reconstruction path. At a random sample of intermediate states on the reconstruction path, the model predicts the coarse-to-fine residual velocity and uses coarse-anchor point to define a pseudo-endpoint. We show that the reconstruction loss of this pseudo-endpoint is exactly related to the intermediate velocity loss through a known time-dependent weight. Consequently, every intermediate state contributes supervision toward the same fine target, rather than serving only as an internal step toward an endpoint loss. Because intermediate states already reveal part of the missing fine-scale structure, we additionally supervise the coarse endpoint used during one-step inference. A finite-difference objective further constrains local spatial variation. GalerkinFlow combines convolutional features with scale-conditioned Galerkin operator mixing and requires no governing equation or physical metadata. It achieves the lowest raw-space errors among the evaluated equation-agnostic baselines on Navier--Stokes and Darcy Flow, while remaining competitive on DIV2K.", "arxiv_id": "2608.16546", "arxiv_url": "https://arxiv.org/abs/2608.16546", "authors": ["Zikang Zhan"], "brief": "\u8bba\u6587\u63d0\u51fa GalerkinFlow\uff0c\u5c06\u7c97\u5230\u7ec6\u7684\u6bcf\u4e2a\u6837\u672c\u5bf9\u8f6c\u5316\u4e3a\u6574\u6761\u91cd\u5efa\u8def\u5f84\u4e0a\u7684\u76d1\u7763\uff0c\u5728\u4e2d\u95f4\u72b6\u6001\u9884\u6d4b\u6b8b\u5dee\u901f\u5ea6\uff0c\u5e76\u7528\u4f2a\u7ec8\u70b9\u635f\u5931\u4e0e\u901f\u5ea6\u635f\u5931\u7684\u5173\u7cfb\u63d0\u4f9b\u66f4\u5bc6\u96c6\u7684\u8bad\u7ec3\u4fe1\u53f7\u3002\u8be5\u65b9\u6cd5\u4e0d\u4f9d\u8d56\u5177\u4f53\u65b9\u7a0b\u6216\u7269\u7406\u5143\u6570\u636e\uff0c\u5728 Navier-Stokes \u548c Darcy Flow \u8d85\u5206\u8fa8\u7387\u4e0a\u4f18\u4e8e\u591a\u79cd\u65b9\u7a0b\u65e0\u5173\u57fa\u7ebf\uff0c\u5728 DIV2K \u56fe\u50cf\u8d85\u5206\u8fa8\u7387\u4e0a\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["cs.CV", "cs.CE", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16546", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8d85\u5206\u8fa8\u7387", "\u79d1\u5b66\u8ba1\u7b97", "\u7b97\u5b50\u5b66\u4e60", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16546v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Supervising the Path to Fine Scales: GalerkinFlow for Scientific-Field and Image Super-Resolution", "tldr": "\u8bba\u6587\u63d0\u51fa GalerkinFlow\uff0c\u5c06\u7c97\u5230\u7ec6\u7684\u6bcf\u4e2a\u6837\u672c\u5bf9\u8f6c\u5316\u4e3a\u6574\u6761\u91cd\u5efa\u8def\u5f84\u4e0a\u7684\u76d1\u7763\uff0c\u5728\u4e2d\u95f4\u72b6\u6001\u9884\u6d4b\u6b8b\u5dee\u901f\u5ea6\uff0c\u5e76\u7528\u4f2a\u7ec8\u70b9\u635f\u5931\u4e0e\u901f\u5ea6\u635f\u5931\u7684\u5173\u7cfb\u63d0\u4f9b\u66f4\u5bc6\u96c6\u7684\u8bad\u7ec3\u4fe1\u53f7\u3002\u8be5\u65b9\u6cd5\u4e0d\u4f9d\u8d56\u5177\u4f53\u65b9\u7a0b\u6216\u7269\u7406\u5143\u6570\u636e\uff0c\u5728 Navier-Stokes \u548c Darcy Flow \u8d85\u5206\u8fa8\u7387\u4e0a\u4f18\u4e8e\u591a\u79cd\u65b9\u7a0b\u65e0\u5173\u57fa\u7ebf\uff0c\u5728 DIV2K \u56fe\u50cf\u8d85\u5206\u8fa8\u7387\u4e0a\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Manual cephalometric landmark annotation is important for craniofacial assessment but is labor-intensive and difficult to scale. We introduce CephViT, a Vision Transformer-based model for automated 2D lateral cephalometric landmark localization, and evaluate its use in downstream skeletal malocclusion classification. CephViT was trained and benchmarked on a public lateral cephalogram dataset, achieving a mean radial error of 1.28 +/- 1.42 mm and a successful detection rate of 92.0% at 3.0 mm. Because the private evaluation cohort consisted of 3D CBCT scans, lateral cephalogram-like digitally reconstructed radiographs (DRRs) were generated from each volume and used as 2D inputs to the landmark localization model. Landmark coordinates were normalized into a common coordinate frame, and skeletal malocclusion classification was performed using landmarks shared between the reference and DRR-based pipelines. Classification performance using DRR-localized landmarks was comparable to that obtained using manually annotated reference landmarks, with accuracies of 70.0% and 68.3%, respectively. These results support the feasibility of automated cephalometric analysis on CBCT-derived DRRs for skeletal malocclusion assessment.", "arxiv_id": "2608.16535", "arxiv_url": "https://arxiv.org/abs/2608.16535", "authors": ["Benjamin Hou", "Konstantinia Almpani", "Janice S. Lee", "Zhiyong Lu"], "brief": "\u672c\u6587\u63d0\u51fa\u57fa\u4e8e Vision Transformer \u7684 CephViT\uff0c\u7528\u4e8e\u81ea\u52a8\u5b9a\u4f4d\u4e8c\u7ef4\u5934\u5f71\u6d4b\u91cf\u6807\u5fd7\u70b9\uff0c\u5e76\u5c06\u5176\u5e94\u7528\u4e8e\u9aa8\u6027\u9519\u988c\u5206\u7c7b\u3002\u5728\u516c\u5f00\u6570\u636e\u4e0a\u6807\u5fd7\u70b9\u5b9a\u4f4d\u8fbe\u5230 1.28 mm \u5e73\u5747\u5f84\u5411\u8bef\u5dee\uff0c\u57fa\u4e8e CBCT \u751f\u6210\u7684 DRR \u56fe\u50cf\u8fdb\u884c\u5206\u7c7b\u65f6\u6027\u80fd\u63a5\u8fd1\u4eba\u5de5\u6807\u6ce8\uff0c\u9a8c\u8bc1\u4e86\u81ea\u52a8\u5316 CBCT \u5934\u5f71\u5206\u6790\u7684\u53ef\u884c\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16535", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u89c6\u89c9Transformer", "\u5173\u952e\u70b9\u68c0\u6d4b", "\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16535v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Automatic Cephalometric Landmark Localization on CBCT-Derived Digitally Reconstructed Radiographs for Skeletal Malocclusion Classification", "tldr": "\u672c\u6587\u63d0\u51fa\u57fa\u4e8e Vision Transformer \u7684 CephViT\uff0c\u7528\u4e8e\u81ea\u52a8\u5b9a\u4f4d\u4e8c\u7ef4\u5934\u5f71\u6d4b\u91cf\u6807\u5fd7\u70b9\uff0c\u5e76\u5c06\u5176\u5e94\u7528\u4e8e\u9aa8\u6027\u9519\u988c\u5206\u7c7b\u3002\u5728\u516c\u5f00\u6570\u636e\u4e0a\u6807\u5fd7\u70b9\u5b9a\u4f4d\u8fbe\u5230 1.28 mm \u5e73\u5747\u5f84\u5411\u8bef\u5dee\uff0c\u57fa\u4e8e CBCT \u751f\u6210\u7684 DRR \u56fe\u50cf\u8fdb\u884c\u5206\u7c7b\u65f6\u6027\u80fd\u63a5\u8fd1\u4eba\u5de5\u6807\u6ce8\uff0c\u9a8c\u8bc1\u4e86\u81ea\u52a8\u5316 CBCT \u5934\u5f71\u5206\u6790\u7684\u53ef\u884c\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Event cameras generate asynchronous, high-frequency data streams offering spatially sparse information at lower latency than traditional cameras.In principle, these properties should be ideal for the design of control policies.However, reinforcement learning research in this field remains limited as existing approaches fail to fully exploit the sensor\u0027s properties.CNN-based methods negate the sensors benefits by aggregating events into sparse grids. This couples compute cost to sensor resolution and blurs the temporal information. Meanwhile, existing generative baselines rely on the availability of trajectory data to pretrain the model. We propose FLEET (Feature Learning from Events via Efficient Tokenization), a feature extractor that processes event sequences directly. Leveraging random Fourier features and cross-attention, our architecture compresses variable streams into fixed-size latent representations. This decouples inference cost of the feature extractor\u0027s backbone from the sensor\u0027s resolution, enabling end-to-end learning without auxiliary losses. We validate FLEET on a new, high-throughput benchmark. The results demonstrate that our sequence-based approach surpasses SOTA performance and exhibits superior robustness to variations in observation frequencies.", "arxiv_id": "2608.16523", "arxiv_url": "https://arxiv.org/abs/2608.16523", "authors": ["Tristan Gottwald", "Maximilian Schier", "Melanie Schaller", "Bodo Rosenhahn"], "brief": "\u672c\u6587\u63d0\u51fa FLEET\uff0c\u4e00\u79cd\u9762\u5411\u4e8b\u4ef6\u76f8\u673a\u5f3a\u5316\u5b66\u4e60\u7684\u7279\u5f81\u63d0\u53d6\u5668\uff0c\u76f4\u63a5\u5904\u7406\u5f02\u6b65\u4e8b\u4ef6\u5e8f\u5217\uff0c\u5e76\u7528\u968f\u673a\u5085\u91cc\u53f6\u7279\u5f81\u4e0e\u4ea4\u53c9\u6ce8\u610f\u529b\u538b\u7f29\u4e3a\u56fa\u5b9a\u5927\u5c0f\u8868\u793a\u3002\u76f8\u6bd4\u57fa\u4e8e CNN \u7684\u7f51\u683c\u5316\u65b9\u6cd5\uff0c\u5b83\u5c06\u9aa8\u5e72\u63a8\u7406\u5f00\u9500\u4e0e\u4f20\u611f\u5668\u5206\u8fa8\u7387\u89e3\u8026\uff0c\u65e0\u9700\u989d\u5916\u9884\u8bad\u7ec3\u6216\u8f85\u52a9\u635f\u5931\uff0c\u5728\u65b0\u57fa\u51c6\u4e0a\u8d85\u8fc7\u73b0\u6709\u6700\u4f18\u5e76\u5bf9\u89c2\u6d4b\u9891\u7387\u53d8\u5316\u66f4\u9c81\u68d2\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16523", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u4e8b\u4ef6\u76f8\u673a", "\u7279\u5f81\u63d0\u53d6", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16523v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FLEET: Token-Based Feature Extraction for Event Camera-based Reinforcement Learning", "tldr": "\u672c\u6587\u63d0\u51fa FLEET\uff0c\u4e00\u79cd\u9762\u5411\u4e8b\u4ef6\u76f8\u673a\u5f3a\u5316\u5b66\u4e60\u7684\u7279\u5f81\u63d0\u53d6\u5668\uff0c\u76f4\u63a5\u5904\u7406\u5f02\u6b65\u4e8b\u4ef6\u5e8f\u5217\uff0c\u5e76\u7528\u968f\u673a\u5085\u91cc\u53f6\u7279\u5f81\u4e0e\u4ea4\u53c9\u6ce8\u610f\u529b\u538b\u7f29\u4e3a\u56fa\u5b9a\u5927\u5c0f\u8868\u793a\u3002\u76f8\u6bd4\u57fa\u4e8e CNN \u7684\u7f51\u683c\u5316\u65b9\u6cd5\uff0c\u5b83\u5c06\u9aa8\u5e72\u63a8\u7406\u5f00\u9500\u4e0e\u4f20\u611f\u5668\u5206\u8fa8\u7387\u89e3\u8026\uff0c\u65e0\u9700\u989d\u5916\u9884\u8bad\u7ec3\u6216\u8f85\u52a9\u635f\u5931\uff0c\u5728\u65b0\u57fa\u51c6\u4e0a\u8d85\u8fc7\u73b0\u6709\u6700\u4f18\u5e76\u5bf9\u89c2\u6d4b\u9891\u7387\u53d8\u5316\u66f4\u9c81\u68d2\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Human visual search is serial: the fovea must land on a candidate to confirm it, and those landings form a scanpath. Whether multimodal large language models (MLLMs), given the same foveated input, search as humans do bears on their use as models of human vision and on attention-alignment scores. We compare three general-purpose MLLMs with human eye-movement scanpaths on goal-directed search (COCO-Search18), driving each model fixation by fixation through an identical, human-matched foveated view and assessing it along three axes: the decision of target presence, the efficiency of reaching the target, and the gaze process itself. The axes dissociate. On the decision and on target acquisition the models match or exceed humans, detecting present targets near ceiling and reaching them on the first saccade more often than people do. The gaze process is not human. Under the human-matched condition, all three share one signature: low-entropy, large-amplitude, self-consistent scanpaths that agree with themselves far more closely than two humans agree with each other. That is consistent with a single-pass, non-serial architecture rather than a limit of acuity. Matched retinal input reproduces where humans look but not how the looking unfolds in time, and no degradation regime recovers human-like search at human-like success. The gap sits on a process axis that answer-alignment and saliency metrics do not measure. Because they miss it, such metrics cannot certify human-like vision, and zero-shot models suit outcome and spatial questions but not temporal, process-level ones.", "arxiv_id": "2608.16514", "arxiv_url": "https://arxiv.org/abs/2608.16514", "authors": ["Mohamed Amine Kerkouri", "Marouane Tliba", "Aladine Chetouani", "Ulas Bagci", "Alessandro Bruno"], "brief": "\u672c\u6587\u6bd4\u8f83\u4e86\u4e09\u79cd\u901a\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u4e0e\u4eba\u7c7b\u76f8\u540c\u7684\u4e2d\u592e\u51f9\u89c6\u89c9\u8f93\u5165\u4e0b\u8fdb\u884c\u76ee\u6807\u641c\u7d22\u7684\u884c\u4e3a\u4e0e\u4eba\u7c7b\u773c\u52a8\u8f68\u8ff9\u3002\u6a21\u578b\u5728\u76ee\u6807\u5224\u65ad\u548c\u5230\u8fbe\u76ee\u6807\u6548\u7387\u4e0a\u53ef\u5339\u914d\u751a\u81f3\u8d85\u8fc7\u4eba\u7c7b\uff0c\u4f46\u5176\u51dd\u89c6\u8fc7\u7a0b\u5448\u73b0\u4f4e\u71b5\u3001\u5927\u5e45\u5ea6\u4e14\u9ad8\u5ea6\u81ea\u4e00\u81f4\u7684\u626b\u63cf\u8def\u5f84\uff0c\u5e76\u4e0d\u50cf\u4eba\u7c7b\u7684\u5e8f\u5217\u5316\u89c6\u89c9\u641c\u7d22\u3002\u7ed3\u679c\u8868\u660e\uff0c\u7b54\u6848\u5bf9\u9f50\u6216\u663e\u8457\u6027\u6307\u6807\u4e0d\u8db3\u4ee5\u8bc1\u660e\u6a21\u578b\u5177\u6709\u4eba\u7c7b\u5f0f\u89c6\u89c9\u8fc7\u7a0b\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.HC", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16514", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u89c6\u89c9\u641c\u7d22", "\u773c\u52a8\u8f68\u8ff9", "\u4eba\u7c7b\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16514v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Matched Outcomes, Divergent Gaze: How Foveated MLLMs Search Compared to Humans", "tldr": "\u672c\u6587\u6bd4\u8f83\u4e86\u4e09\u79cd\u901a\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u4e0e\u4eba\u7c7b\u76f8\u540c\u7684\u4e2d\u592e\u51f9\u89c6\u89c9\u8f93\u5165\u4e0b\u8fdb\u884c\u76ee\u6807\u641c\u7d22\u7684\u884c\u4e3a\u4e0e\u4eba\u7c7b\u773c\u52a8\u8f68\u8ff9\u3002\u6a21\u578b\u5728\u76ee\u6807\u5224\u65ad\u548c\u5230\u8fbe\u76ee\u6807\u6548\u7387\u4e0a\u53ef\u5339\u914d\u751a\u81f3\u8d85\u8fc7\u4eba\u7c7b\uff0c\u4f46\u5176\u51dd\u89c6\u8fc7\u7a0b\u5448\u73b0\u4f4e\u71b5\u3001\u5927\u5e45\u5ea6\u4e14\u9ad8\u5ea6\u81ea\u4e00\u81f4\u7684\u626b\u63cf\u8def\u5f84\uff0c\u5e76\u4e0d\u50cf\u4eba\u7c7b\u7684\u5e8f\u5217\u5316\u89c6\u89c9\u641c\u7d22\u3002\u7ed3\u679c\u8868\u660e\uff0c\u7b54\u6848\u5bf9\u9f50\u6216\u663e\u8457\u6027\u6307\u6807\u4e0d\u8db3\u4ee5\u8bc1\u660e\u6a21\u578b\u5177\u6709\u4eba\u7c7b\u5f0f\u89c6\u89c9\u8fc7\u7a0b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in diffusion models and Transformer architectures have led to significant progress in text-to-video generation. However, these models often suffer from semantic errors such as missing objects, incorrect attributes, or mismatched actions. Although some semantic correction methods perform optimization before sampling or refinement after sampling, how to detect and correct semantic deviations during the video generation process remains underexplored. In this paper, we introduce a training-free, interpretable mid-generation correction framework that integrates multimodal large language model (MLLM) feedback directly into the diffusion sampling loop. Our framework achieves diffusion trajectory correction by injecting semantic evaluation signals during video synthesis, enabling the model to optimize the generated content through continuous self-reflection. We propose two key modules: a Semantic Assessment Supervisor that generates intermediate preview frames for semantic evaluations and deviation diagnostics, and a Semantic Modification Assistant that corrects semantic drift during inference via a controllable latent trajectory intervention. Our method improves semantic alignment, visual fidelity, and temporal consistency without modifying model parameters. We validate the effectiveness of our approach through extensive experiments across multiple benchmarks.", "arxiv_id": "2608.16513", "arxiv_url": "https://arxiv.org/abs/2608.16513", "authors": ["Junhao Chen", "Zheqi Lv", "Keting Yin", "Shengyu Zhang", "Zhou Zhao", "Feiyang Chen", "Xinyu Duan", "Baoxing Huai", "Fei Wu"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u6587\u751f\u89c6\u9891\u4e2d\u9014\u8bed\u4e49\u7ea0\u9519\u6846\u67b6\uff0c\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u53cd\u9988\u6ce8\u5165\u6269\u6563\u91c7\u6837\u8fc7\u7a0b\u3002\u901a\u8fc7\u4e2d\u95f4\u5e27\u8bed\u4e49\u8bc4\u4f30\u4e0e\u6f5c\u53d8\u91cf\u8f68\u8ff9\u5e72\u9884\uff0c\u51cf\u5c11\u6f0f\u7269\u4f53\u3001\u5c5e\u6027\u9519\u8bef\u548c\u52a8\u4f5c\u4e0d\u5339\u914d\uff0c\u63d0\u5347\u8bed\u4e49\u5bf9\u9f50\u3001\u89c6\u89c9\u8d28\u91cf\u4e0e\u65f6\u5e8f\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16513", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u751f\u89c6\u9891", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "\u8bed\u4e49\u7ea0\u9519"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16513v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MLLM-Guided Semantic Correction for Text-to-Video Generation", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u6587\u751f\u89c6\u9891\u4e2d\u9014\u8bed\u4e49\u7ea0\u9519\u6846\u67b6\uff0c\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u53cd\u9988\u6ce8\u5165\u6269\u6563\u91c7\u6837\u8fc7\u7a0b\u3002\u901a\u8fc7\u4e2d\u95f4\u5e27\u8bed\u4e49\u8bc4\u4f30\u4e0e\u6f5c\u53d8\u91cf\u8f68\u8ff9\u5e72\u9884\uff0c\u51cf\u5c11\u6f0f\u7269\u4f53\u3001\u5c5e\u6027\u9519\u8bef\u548c\u52a8\u4f5c\u4e0d\u5339\u914d\uff0c\u63d0\u5347\u8bed\u4e49\u5bf9\u9f50\u3001\u89c6\u89c9\u8d28\u91cf\u4e0e\u65f6\u5e8f\u4e00\u81f4\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Active 3D Gaussian reconstruction fundamentally relies on selecting informative next-best views under limited sensing budgets. Existing active 3DGS methods primarily plan viewpoints according to geometric information gain, treating object-induced hidden regions in the same manner as general unexplored space. Under tight frame budgets, such geometry-driven strategies may prioritize global scene coverage while leaving partially observed objects incompletely reconstructed. To address this limitation, we propose OccamView, an object-conditioned view-selection framework for frame-budgeted active 3D Gaussian reconstruction. Rather than predicting unseen object geometry or performing shape completion, OccamView maintains an online object memory from open-vocabulary detections grounded in measured RGB-D observations and represents unresolved local occupancy around detected objects as conservative hidden-region proxies. Candidate viewpoints are then evaluated using an occlusion-aware proxy-coverage score. Furthermore, we introduce a Geo-Floor mechanism that restricts object-conditioned re-ranking to geometrically competitive candidates, allowing object-conditioned cues to guide complementary observations while preserving the geometry-driven exploration behavior of the underlying planner. Experiments on Replica and Matterport3D under a unified frame-budgeted protocol show that OccamView consistently reduces Completion and improves Completion Ratio across five frame budgets, with particularly pronounced gains under limited frame budgets. These results demonstrate that lightweight object-conditioned cues effectively complement geometry-driven active view planning.", "arxiv_id": "2608.16499", "arxiv_url": "https://arxiv.org/abs/2608.16499", "authors": ["Hongbo Gao", "Wei Zhang", "Zeyu Ni", "Dihao Zhu", "Ruifeng Li", "Yunke Wang", "Chang Xu"], "brief": "\u8bba\u6587\u63d0\u51fa OccamView\uff0c\u7528\u5f00\u653e\u8bcd\u6c47\u68c0\u6d4b\u7ef4\u62a4\u5728\u7ebf\u7269\u4f53\u8bb0\u5fc6\uff0c\u5e76\u4ee5\u7269\u4f53\u5468\u56f4\u672a\u89e3\u6790\u906e\u6321\u533a\u57df\u4f5c\u4e3a\u4fdd\u5b88\u4ee3\u7406\uff0c\u6307\u5bfc\u5e27\u9884\u7b97\u53d7\u9650\u4e0b\u7684\u4e3b\u52a8 3D Gaussian \u91cd\u5efa\u89c6\u89d2\u9009\u62e9\u3002\u8be5\u65b9\u6cd5\u5728\u51e0\u4f55\u4fe1\u606f\u589e\u76ca\u57fa\u7840\u4e0a\u52a0\u5165\u7269\u4f53\u6761\u4ef6\u91cd\u6392\u5e8f\uff0c\u5728 Replica \u548c Matterport3D \u4e0a\u964d\u4f4e\u91cd\u5efa\u7f3a\u5931\u3001\u63d0\u5347\u5b8c\u6210\u7387\uff0c\u5c24\u5176\u5728\u4f4e\u5e27\u9884\u7b97\u4e0b\u6536\u76ca\u66f4\u660e\u663e\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16499", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "3D\u9ad8\u65af", "\u4e3b\u52a8\u611f\u77e5", "\u89c6\u89d2\u9009\u62e9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16499v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OccamView: Object-Conditioned View Selection for Frame-Budgeted Active 3D Gaussian Reconstruction", "tldr": "\u8bba\u6587\u63d0\u51fa OccamView\uff0c\u7528\u5f00\u653e\u8bcd\u6c47\u68c0\u6d4b\u7ef4\u62a4\u5728\u7ebf\u7269\u4f53\u8bb0\u5fc6\uff0c\u5e76\u4ee5\u7269\u4f53\u5468\u56f4\u672a\u89e3\u6790\u906e\u6321\u533a\u57df\u4f5c\u4e3a\u4fdd\u5b88\u4ee3\u7406\uff0c\u6307\u5bfc\u5e27\u9884\u7b97\u53d7\u9650\u4e0b\u7684\u4e3b\u52a8 3D Gaussian \u91cd\u5efa\u89c6\u89d2\u9009\u62e9\u3002\u8be5\u65b9\u6cd5\u5728\u51e0\u4f55\u4fe1\u606f\u589e\u76ca\u57fa\u7840\u4e0a\u52a0\u5165\u7269\u4f53\u6761\u4ef6\u91cd\u6392\u5e8f\uff0c\u5728 Replica \u548c Matterport3D \u4e0a\u964d\u4f4e\u91cd\u5efa\u7f3a\u5931\u3001\u63d0\u5347\u5b8c\u6210\u7387\uff0c\u5c24\u5176\u5728\u4f4e\u5e27\u9884\u7b97\u4e0b\u6536\u76ca\u66f4\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LiDAR scene completion is a key component of 3D perception in autonomous driving, where the scene must be completed in real time to be usable in downstream tasks. Existing approaches typically follow an initialize-and-refine paradigm, in which a coarse initialization of the scene is first constructed, then refined into complete 3D geometry. Generative models are slower because they iteratively refine random Gaussian noise into the scene, while non-generative methods perturb the partial scene with a fixed noise scale, which limits coverage of large gaps and occluded regions and requires manual recalibration for each new sensor configuration. We present RapidLiDAR, a LiDAR scene completion method that treats the initialization itself as a learned, data-driven component. We propose an adaptive initialization module that predicts a spatially varying displacement for each partial input point, expanding the partial observations into a coarse scene initialization adapted to the local geometry, without requiring manual noise tuning. To refine this coarse initialization into a complete and coherent scene, we additionally propose a multi-scale reconstruction module that further refines point positions by querying multi-scale 3D voxel and 2D BEV feature maps constructed from the input scan. By replacing point-neighborhood operators such as farthest point sampling and $k$-nearest neighbor search with voxel- and BEV-based feature extraction, our architecture is faster and can handle different input resolutions by design. Experiments on SemanticKITTI and KITTI-360 show that our method achieves completion performance on par with the state of the art while completing a full scene in 0.1 seconds, which is 2.3 times faster than the fastest prior method. This matches the 10 Hz acquisition rate of typical automotive LiDAR sensors, taking a step toward real-time LiDAR scene completion.", "arxiv_id": "2608.16490", "arxiv_url": "https://arxiv.org/abs/2608.16490", "authors": ["Azhar Hussian", "Martin Vossiek", "Vasileios Belagiannis"], "brief": "\u8bba\u6587\u63d0\u51fa RapidLiDAR\uff0c\u5c06 LiDAR \u573a\u666f\u8865\u5168\u4e2d\u7684\u521d\u59cb\u5316\u8fc7\u7a0b\u6539\u4e3a\u53ef\u5b66\u4e60\u7684\u6570\u636e\u9a71\u52a8\u6a21\u5757\uff0c\u81ea\u9002\u5e94\u9884\u6d4b\u70b9\u4f4d\u79fb\u4ee5\u8986\u76d6\u906e\u6321\u548c\u5927\u7a7a\u6d1e\uff0c\u5e76\u7528\u591a\u5c3a\u5ea6\u4f53\u7d20\u4e0e BEV \u7279\u5f81\u8fdb\u4e00\u6b65\u91cd\u5efa\u5b8c\u6574\u573a\u666f\u3002\u8be5\u65b9\u6cd5\u5728 SemanticKITTI \u548c KITTI-360 \u4e0a\u8fbe\u5230\u63a5\u8fd1\u6700\u4f18\u7684\u8865\u5168\u6548\u679c\uff0c\u540c\u65f6\u5355\u5e27\u4ec5\u9700 0.1 \u79d2\uff0c\u6bd4\u6700\u5feb\u5df2\u6709\u65b9\u6cd5\u5feb 2.3 \u500d\uff0c\u63a5\u8fd1\u8f66\u8f7d LiDAR 10Hz \u5b9e\u65f6\u9700\u6c42\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16490", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u70b9\u4e91\u8865\u5168", "\u4e09\u7ef4\u611f\u77e5", "\u5b9e\u65f6\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16490v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards Real-Time and Adaptable LiDAR Scene Completion", "tldr": "\u8bba\u6587\u63d0\u51fa RapidLiDAR\uff0c\u5c06 LiDAR \u573a\u666f\u8865\u5168\u4e2d\u7684\u521d\u59cb\u5316\u8fc7\u7a0b\u6539\u4e3a\u53ef\u5b66\u4e60\u7684\u6570\u636e\u9a71\u52a8\u6a21\u5757\uff0c\u81ea\u9002\u5e94\u9884\u6d4b\u70b9\u4f4d\u79fb\u4ee5\u8986\u76d6\u906e\u6321\u548c\u5927\u7a7a\u6d1e\uff0c\u5e76\u7528\u591a\u5c3a\u5ea6\u4f53\u7d20\u4e0e BEV \u7279\u5f81\u8fdb\u4e00\u6b65\u91cd\u5efa\u5b8c\u6574\u573a\u666f\u3002\u8be5\u65b9\u6cd5\u5728 SemanticKITTI \u548c KITTI-360 \u4e0a\u8fbe\u5230\u63a5\u8fd1\u6700\u4f18\u7684\u8865\u5168\u6548\u679c\uff0c\u540c\u65f6\u5355\u5e27\u4ec5\u9700 0.1 \u79d2\uff0c\u6bd4\u6700\u5feb\u5df2\u6709\u65b9\u6cd5\u5feb 2.3 \u500d\uff0c\u63a5\u8fd1\u8f66\u8f7d LiDAR 10Hz \u5b9e\u65f6\u9700\u6c42\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Boundary representation (B-Rep) generation is a fundamental task in computer-aided design, yet the direct synthesis of high-fidelity and structurally valid B-Reps remains a major challenge. Existing deep generative methods suffer from two forms of brittleness: representation brittleness, caused by padding noise and feature contamination in the latent space, and generation brittleness, stemming from sequential error propagation and a train-inference mismatch due to non-differentiable validity enforcement. We propose HiFi-BRep, a novel framework that addresses these limitations through two synergistic contributions. First, a topology-aware encoder constructs a high-fidelity latent representation by eliminating padding via learnable queries and preventing feature contamination with topology-guided attention. Second, a single-stage decoder jointly predicts geometry and topology in parallel, embedding core manifold constraints as a differentiable learning objective. This design ensures mutual guidance between geometry and topology while avoiding cascaded errors. Extensive experiments show that HiFi-BRep significantly outperforms state-of-the-art methods in both structural validity and geometric fidelity, providing a robust solution for high-quality B-Rep synthesis. Code and models are publicly available at https://github.com/1nnoh/HiFi-BRep.", "arxiv_id": "2608.16485", "arxiv_url": "https://arxiv.org/abs/2608.16485", "authors": ["Junhao Hou", "Chenqi Luo", "Pufan Wang", "Jiaying Lu", "Yusheng Liu", "Feiwei Qin", "Meie Fang", "Kun Zhou"], "brief": "HiFi-BRep\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u9ad8\u8d28\u91cfB-Rep\u751f\u6210\u7684\u6846\u67b6\uff0c\u901a\u8fc7\u62d3\u6251\u611f\u77e5\u7f16\u7801\u5668\u53bb\u9664padding\u566a\u58f0\u5e76\u7528\u62d3\u6251\u5f15\u5bfc\u6ce8\u610f\u529b\u51cf\u5c11\u6f5c\u7a7a\u95f4\u7279\u5f81\u6c61\u67d3\u3002\u5176\u5355\u9636\u6bb5\u89e3\u7801\u5668\u5e76\u884c\u9884\u6d4b\u51e0\u4f55\u4e0e\u62d3\u6251\uff0c\u5e76\u5c06\u6d41\u5f62\u7ea6\u675f\u4f5c\u4e3a\u53ef\u5fae\u76ee\u6807\uff0c\u4ece\u800c\u964d\u4f4e\u7ea7\u8054\u8bef\u5dee\uff0c\u5728\u7ed3\u6784\u6709\u6548\u6027\u548c\u51e0\u4f55\u4fdd\u771f\u5ea6\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16485", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u751f\u6210", "CAD", "\u51e0\u4f55\u5efa\u6a21", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16485v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HiFi-BRep: High-Fidelity Latent Representation for Robust B-Rep Generation", "tldr": "HiFi-BRep\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u9ad8\u8d28\u91cfB-Rep\u751f\u6210\u7684\u6846\u67b6\uff0c\u901a\u8fc7\u62d3\u6251\u611f\u77e5\u7f16\u7801\u5668\u53bb\u9664padding\u566a\u58f0\u5e76\u7528\u62d3\u6251\u5f15\u5bfc\u6ce8\u610f\u529b\u51cf\u5c11\u6f5c\u7a7a\u95f4\u7279\u5f81\u6c61\u67d3\u3002\u5176\u5355\u9636\u6bb5\u89e3\u7801\u5668\u5e76\u884c\u9884\u6d4b\u51e0\u4f55\u4e0e\u62d3\u6251\uff0c\u5e76\u5c06\u6d41\u5f62\u7ea6\u675f\u4f5c\u4e3a\u53ef\u5fae\u76ee\u6807\uff0c\u4ece\u800c\u964d\u4f4e\u7ea7\u8054\u8bef\u5dee\uff0c\u5728\u7ed3\u6784\u6709\u6548\u6027\u548c\u51e0\u4f55\u4fdd\u771f\u5ea6\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Remote-sensing systems usually describe urban content with detection boxes, semantic masks, or vector boundaries. Such outputs locate classes and support image-plane scoring, yet they do not by themselves constitute an executable layout that retains object identities, typed relations, topology, and regeneration rules. Code-as-City instead casts urban-layout extraction from a single top-down image as constrained code generation with a multimodal large language model (MLLM). An image model first produces an aligned five-class semantic layout prior. Three ordered MLLM passes use the image and this prior to recover roads, land-cover regions and relations, and buildings. Deterministic normalization converts the accumulated records into a city graph and a restricted layout program. Executing the program creates a renderable 3D city layout and an orthographic semantic projection over shared geometry. The projection admits pixel-level comparison with remote-sensing masks, while named objects, relations, and editing operations remain available for synchronized regeneration of both views. Evaluated on the 100 scenes of CityLayout-100, the complete framework obtains 41.1% mean intersection-over-union and 48.3% global intersection-over-union. This result provides quantitative evidence that visual observations can be translated into inspectable, editable city code with coupled planar and 3D outputs.", "arxiv_id": "2608.16484", "arxiv_url": "https://arxiv.org/abs/2608.16484", "authors": ["Zigan Zhou", "Kai Li", "Yupeng Deng"], "brief": "\u672c\u6587\u63d0\u51fa Code-as-City\uff0c\u5c06\u5355\u5f20\u9065\u611f\u4fef\u89c6\u56fe\u7684\u57ce\u5e02\u5e03\u5c40\u63d0\u53d6\u8f6c\u5316\u4e3a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u53d7\u7ea6\u675f\u4ee3\u7801\u751f\u6210\u3002\u7cfb\u7edf\u5148\u751f\u6210\u4e94\u7c7b\u8bed\u4e49\u5148\u9a8c\uff0c\u518d\u5206\u9636\u6bb5\u6062\u590d\u9053\u8def\u3001\u5730\u8868\u533a\u57df\u5173\u7cfb\u548c\u5efa\u7b51\uff0c\u5e76\u5f52\u4e00\u5316\u4e3a\u57ce\u5e02\u56fe\u4e0e\u53ef\u6267\u884c\u5e03\u5c40\u7a0b\u5e8f\uff0c\u53ef\u540c\u6b65\u751f\u6210\u53ef\u7f16\u8f91\u76843D\u57ce\u5e02\u5e03\u5c40\u548c\u6b63\u5c04\u8bed\u4e49\u6295\u5f71\uff1b\u5728 CityLayout-100 \u4e0a\u53d6\u5f97 41.1% mIoU \u548c 48.3% gIoU\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16484", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u9065\u611f", "\u57ce\u5e02\u5efa\u6a21", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16484v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Remote-Sensing City Layout Extraction with MLLM", "tldr": "\u672c\u6587\u63d0\u51fa Code-as-City\uff0c\u5c06\u5355\u5f20\u9065\u611f\u4fef\u89c6\u56fe\u7684\u57ce\u5e02\u5e03\u5c40\u63d0\u53d6\u8f6c\u5316\u4e3a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u53d7\u7ea6\u675f\u4ee3\u7801\u751f\u6210\u3002\u7cfb\u7edf\u5148\u751f\u6210\u4e94\u7c7b\u8bed\u4e49\u5148\u9a8c\uff0c\u518d\u5206\u9636\u6bb5\u6062\u590d\u9053\u8def\u3001\u5730\u8868\u533a\u57df\u5173\u7cfb\u548c\u5efa\u7b51\uff0c\u5e76\u5f52\u4e00\u5316\u4e3a\u57ce\u5e02\u56fe\u4e0e\u53ef\u6267\u884c\u5e03\u5c40\u7a0b\u5e8f\uff0c\u53ef\u540c\u6b65\u751f\u6210\u53ef\u7f16\u8f91\u76843D\u57ce\u5e02\u5e03\u5c40\u548c\u6b63\u5c04\u8bed\u4e49\u6295\u5f71\uff1b\u5728 CityLayout-100 \u4e0a\u53d6\u5f97 41.1% mIoU \u548c 48.3% gIoU\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present RISE (Roadside Infrastructure Sequence Understanding and Evaluation), a framework spanning metric 3D tracking and structured vision-language reasoning in roadside sequences. For metric tracking, our image-only method combines SAM3 video identities with calibration-guided mask agreement for multi-view identity association, recovering persistent 3D tracks without LiDAR or task-specific 3D training. Its calibration-conditioned geometry allows the procedure to be instantiated at different calibrated multi-camera intersections without layout-specific retraining. On 20 human-reviewed clips from six intersections, the generated tracks achieve 66.9 MOTA within the defined multi-view evaluation scope. For structured vision-language reasoning, a human-reviewed MLLM pipeline mines high-value clips and uses a constrained full-context Oracle to construct bbox-grounded predictive QA without exposing future evidence to evaluated models. The resulting RISE-VQA dataset contains 33,910 QA pairs from 557 clips across 16 intersections and 61 roadside views. Its intersection-held-out RISE-Bench evaluates semantic choices, coordinates, future boxes, and interaction sets with deterministic task-specific metrics. Experiments show consistent benefits from domain adaptation and generally from temporal context, while revealing persistent challenges in spatial grounding, future localization, and interaction reasoning.", "arxiv_id": "2608.16480", "arxiv_url": "https://arxiv.org/abs/2608.16480", "authors": ["Yanbo Jiang", "Haotian Zheng", "Jiahao Wang", "Hanxiao Ren", "Yitao Xu", "Yining Xing", "Zehong Ke", "Hao Cheng", "Yiqian Tu", "Jinhao Li", "Zhiyuan Xuan", "Fang Zhang", "Jianqiang Wang"], "brief": "RISE \u63d0\u51fa\u9762\u5411\u8def\u4fa7\u591a\u6444\u5e8f\u5217\u7684\u7406\u89e3\u4e0e\u8bc4\u6d4b\u6846\u67b6\uff0c\u5305\u542b\u65e0\u9700 LiDAR \u6216\u4e13\u95e8 3D \u8bad\u7ec3\u7684\u56fe\u50cf\u5f0f\u591a\u89c6\u89d2 3D \u8ddf\u8e2a\u65b9\u6cd5\uff0c\u4ee5\u53ca\u7528\u4e8e\u7ed3\u6784\u5316\u89c6\u89c9\u8bed\u8a00\u63a8\u7406\u7684\u6570\u636e\u6784\u5efa\u6d41\u7a0b\u3002\u5728 6 \u4e2a\u8def\u53e3\u7684\u4eba\u5de5\u5ba1\u6838\u7247\u6bb5\u4e0a\uff0c\u8ddf\u8e2a\u8fbe\u5230 66.9 MOTA\uff1b\u540c\u65f6\u6784\u5efa\u4e86\u542b 33,910 \u4e2a\u95ee\u7b54\u5bf9\u7684 RISE-VQA/RISE-Bench\uff0c\u663e\u793a\u9886\u57df\u9002\u914d\u548c\u65f6\u95f4\u4e0a\u4e0b\u6587\u6709\u5e2e\u52a9\uff0c\u4f46\u7a7a\u95f4\u5b9a\u4f4d\u3001\u672a\u6765\u9884\u6d4b\u548c\u4ea4\u4e92\u63a8\u7406\u4ecd\u5177\u6311\u6218\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16480", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "3D\u8ddf\u8e2a", "\u89c6\u89c9\u8bed\u8a00", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16480v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RISE: Roadside Infrastructure Sequence Understanding across 3D Tracking and Structured Vision-Language Reasoning", "tldr": "RISE \u63d0\u51fa\u9762\u5411\u8def\u4fa7\u591a\u6444\u5e8f\u5217\u7684\u7406\u89e3\u4e0e\u8bc4\u6d4b\u6846\u67b6\uff0c\u5305\u542b\u65e0\u9700 LiDAR \u6216\u4e13\u95e8 3D \u8bad\u7ec3\u7684\u56fe\u50cf\u5f0f\u591a\u89c6\u89d2 3D \u8ddf\u8e2a\u65b9\u6cd5\uff0c\u4ee5\u53ca\u7528\u4e8e\u7ed3\u6784\u5316\u89c6\u89c9\u8bed\u8a00\u63a8\u7406\u7684\u6570\u636e\u6784\u5efa\u6d41\u7a0b\u3002\u5728 6 \u4e2a\u8def\u53e3\u7684\u4eba\u5de5\u5ba1\u6838\u7247\u6bb5\u4e0a\uff0c\u8ddf\u8e2a\u8fbe\u5230 66.9 MOTA\uff1b\u540c\u65f6\u6784\u5efa\u4e86\u542b 33,910 \u4e2a\u95ee\u7b54\u5bf9\u7684 RISE-VQA/RISE-Bench\uff0c\u663e\u793a\u9886\u57df\u9002\u914d\u548c\u65f6\u95f4\u4e0a\u4e0b\u6587\u6709\u5e2e\u52a9\uff0c\u4f46\u7a7a\u95f4\u5b9a\u4f4d\u3001\u672a\u6765\u9884\u6d4b\u548c\u4ea4\u4e92\u63a8\u7406\u4ecd\u5177\u6311\u6218\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scene graph generation from surgical video enables a holistic and structured understanding of surgical scenes by modeling objects and their semantic relationships. Despite recent advances, state-of-the-art approaches rely on large, parameter-heavy deep learning models that are impractical for deployment in the operating room (OR) due to hardware footprint, hygiene constraints, latency, and data privacy concerns. To the best of our knowledge, this is the first scene graph generation method built on NCAs and the first NCA framework capable of learning structured representations. We introduce SG-NCA, a lightweight scene graph generation framework based on Neural Cellular Automata (NCA), designed for inference in fanless devices critical for OR hygiene protocols. SG-NCA is the first scene graph generation combining NCA-based multiclass segmentation for efficient object detection and feature extraction with a lightweight relation predictor. We evaluate SG-NCA on videos of cataract surgery and cholecystectomy, demonstrating performance comparable to established baselines while requiring 55x fewer parameters. We showcase deployment on fanless edge devices better suited for the OR and demonstrate downstream applications such as surgical video captioning, highlighting SG-NCA\u0027s potential for affordable, privacy-preserving, and OR-ready intraoperative scene understanding.", "arxiv_id": "2608.16469", "arxiv_url": "https://arxiv.org/abs/2608.16469", "authors": ["Nick Lemke", "Ssharvien Kumar Sivakumar", "Antoine P. Sanner", "John Kalkhof", "Henry John Krumb", "Ghazal Ghazaei", "Anirban Mukhopadhyay"], "brief": "\u8bba\u6587\u63d0\u51fa SG-NCA\uff0c\u4e00\u4e2a\u57fa\u4e8e\u795e\u7ecf\u7ec6\u80de\u81ea\u52a8\u673a\u7684\u8f7b\u91cf\u7ea7\u624b\u672f\u5ba4\u573a\u666f\u56fe\u751f\u6210\u6846\u67b6\uff0c\u7528\u4e8e\u4ece\u624b\u672f\u89c6\u9891\u4e2d\u68c0\u6d4b\u5bf9\u8c61\u5e76\u9884\u6d4b\u8bed\u4e49\u5173\u7cfb\u3002\u5b83\u5728\u767d\u5185\u969c\u548c\u80c6\u56ca\u5207\u9664\u624b\u672f\u89c6\u9891\u4e0a\u8fbe\u5230\u63a5\u8fd1\u4e3b\u6d41\u57fa\u7ebf\u7684\u6548\u679c\uff0c\u540c\u65f6\u53c2\u6570\u91cf\u51cf\u5c11\u7ea655\u500d\uff0c\u5e76\u53ef\u90e8\u7f72\u5728\u65e0\u98ce\u6247\u8fb9\u7f18\u8bbe\u5907\u4e0a\u4ee5\u6ee1\u8db3\u624b\u672f\u5ba4\u536b\u751f\u3001\u9690\u79c1\u548c\u4f4e\u5ef6\u8fdf\u9700\u6c42\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16469", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u573a\u666f\u56fe\u751f\u6210", "\u533b\u5b66\u5f71\u50cf", "\u8fb9\u7f18\u8ba1\u7b97", "\u795e\u7ecf\u7ec6\u80de\u81ea\u52a8\u673a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16469v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Sterilizable Scene Graph Generation for Operating Rooms", "tldr": "\u8bba\u6587\u63d0\u51fa SG-NCA\uff0c\u4e00\u4e2a\u57fa\u4e8e\u795e\u7ecf\u7ec6\u80de\u81ea\u52a8\u673a\u7684\u8f7b\u91cf\u7ea7\u624b\u672f\u5ba4\u573a\u666f\u56fe\u751f\u6210\u6846\u67b6\uff0c\u7528\u4e8e\u4ece\u624b\u672f\u89c6\u9891\u4e2d\u68c0\u6d4b\u5bf9\u8c61\u5e76\u9884\u6d4b\u8bed\u4e49\u5173\u7cfb\u3002\u5b83\u5728\u767d\u5185\u969c\u548c\u80c6\u56ca\u5207\u9664\u624b\u672f\u89c6\u9891\u4e0a\u8fbe\u5230\u63a5\u8fd1\u4e3b\u6d41\u57fa\u7ebf\u7684\u6548\u679c\uff0c\u540c\u65f6\u53c2\u6570\u91cf\u51cf\u5c11\u7ea655\u500d\uff0c\u5e76\u53ef\u90e8\u7f72\u5728\u65e0\u98ce\u6247\u8fb9\u7f18\u8bbe\u5907\u4e0a\u4ee5\u6ee1\u8db3\u624b\u672f\u5ba4\u536b\u751f\u3001\u9690\u79c1\u548c\u4f4e\u5ef6\u8fdf\u9700\u6c42\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse-view spectral computed tomography (CT) reconstructs energy-resolved attenuation volumes from limited projection views, requiring simultaneous handling of angular undersampling and spectral coupling. We propose a SharedStructure 4D Spectral Gaussian Representation (4D-SG) that learns shared Gaussian geometry from full spectrum structural projections and uses a Gaussian-wise Spectral Density Curve Network (GSC-Net) to predict Gaussian raw density transformations. This factorization separates shared spatial structure from spectral attenuation variation, avoids independent channel geometry optimization, and establishes a continuous 4D-SG representation from discrete spectral measurements for unobserved spectral channel queries. Experiments on six synthesized, simulated projection, and real projection datasets with 50 views demonstrate the best average performance. Compared with the strongest Gaussian baseline, 4D-SG improves PSNR from 35.56 dB to 36.61 dB, increases SSIM from 0.909 to 0.914, and reduces LPIPS from 0.208 to 0.194, demonstrating its effectiveness for sparse-view spectral CT reconstruction.", "arxiv_id": "2608.16463", "arxiv_url": "https://arxiv.org/abs/2608.16463", "authors": ["Jiancheng Fang", "Shaoyu Wang", "Wenjun Xia", "Yang Chen", "Qiegen Liu"], "brief": "\u672c\u6587\u63d0\u51fa\u5171\u4eab\u7ed3\u6784\u76844D\u8c31\u9ad8\u65af\u8868\u793a\uff084D-SG\uff09\uff0c\u7528\u4e8e\u7a00\u758f\u89c6\u89d2\u8c31CT\u91cd\u5efa\uff1a\u7528\u5168\u8c31\u7ed3\u6784\u6295\u5f71\u5b66\u4e60\u5171\u4eab\u9ad8\u65af\u51e0\u4f55\uff0c\u518d\u7528\u8c31\u5bc6\u5ea6\u66f2\u7ebf\u7f51\u7edc\u5efa\u6a21\u4e0d\u540c\u80fd\u8c31\u901a\u9053\u7684\u8870\u51cf\u53d8\u5316\u3002\u8be5\u65b9\u6cd5\u57286\u4e2a\u5408\u6210\u3001\u4eff\u771f\u548c\u771f\u5b9e\u6295\u5f71\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6700\u4f73\u5e73\u5747\u6548\u679c\uff0c\u76f8\u6bd4\u6700\u5f3a\u9ad8\u65af\u57fa\u7ebf\u63d0\u5347PSNR\u3001SSIM\u5e76\u964d\u4f4eLPIPS\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16463", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "CT\u91cd\u5efa", "\u9ad8\u65af\u8868\u793a", "\u7a00\u758f\u89c6\u89d2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16463v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Shared-Structure 4D Spectral Gaussian Representation for Sparse-View Spectral CT Reconstruction", "tldr": "\u672c\u6587\u63d0\u51fa\u5171\u4eab\u7ed3\u6784\u76844D\u8c31\u9ad8\u65af\u8868\u793a\uff084D-SG\uff09\uff0c\u7528\u4e8e\u7a00\u758f\u89c6\u89d2\u8c31CT\u91cd\u5efa\uff1a\u7528\u5168\u8c31\u7ed3\u6784\u6295\u5f71\u5b66\u4e60\u5171\u4eab\u9ad8\u65af\u51e0\u4f55\uff0c\u518d\u7528\u8c31\u5bc6\u5ea6\u66f2\u7ebf\u7f51\u7edc\u5efa\u6a21\u4e0d\u540c\u80fd\u8c31\u901a\u9053\u7684\u8870\u51cf\u53d8\u5316\u3002\u8be5\u65b9\u6cd5\u57286\u4e2a\u5408\u6210\u3001\u4eff\u771f\u548c\u771f\u5b9e\u6295\u5f71\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6700\u4f73\u5e73\u5747\u6548\u679c\uff0c\u76f8\u6bd4\u6700\u5f3a\u9ad8\u65af\u57fa\u7ebf\u63d0\u5347PSNR\u3001SSIM\u5e76\u964d\u4f4eLPIPS\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Procedure planning seeks to estimate a sequence of actions to transition from an observed initial state to a given goal state. Current procedure planning approaches directly predict action sequences from latent representations using feed-forward neural networks or diffusion-based inference. These paradigms treat every action as plausible, lacking the ability to enforce task-specific logical constraints that render certain actions irrelevant or not plausible. We propose CEFITO, a procedure planning approach that learns a predictor to express an action-conditioned representation space. Based on this representation space, we formulate procedure planning as a task-constrained optimization problem. Unlike prior methods, CEFITO explicitly reasons over the action space by omitting irrelevant actions during inference-time planning. This reformulation enables effective procedure planning and achieves state-of-the-art accuracy on two established procedure planning benchmarks.", "arxiv_id": "2608.16457", "arxiv_url": "https://arxiv.org/abs/2608.16457", "authors": ["Mohamed Afham", "Christoph Reich", "Oliver Hahn", "Daniel Cremers", "Stefan Roth"], "brief": "\u8bba\u6587\u63d0\u51fa CEFITO\uff0c\u5c06\u6559\u5b66\u89c6\u9891\u4e2d\u7684\u8fc7\u7a0b\u89c4\u5212\u8868\u8ff0\u4e3a\u63a8\u7406\u65f6\u7684\u4efb\u52a1\u7ea6\u675f\u4f18\u5316\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u80fd\u91cf\u573a\u5b66\u4e60\u52a8\u4f5c\u6761\u4ef6\u8868\u793a\uff0c\u5e76\u5728\u89c4\u5212\u65f6\u663e\u5f0f\u6392\u9664\u4e0d\u76f8\u5173\u52a8\u4f5c\uff0c\u4ece\u800c\u5728\u4e24\u4e2a\u8fc7\u7a0b\u89c4\u5212\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u5148\u8fdb\u51c6\u786e\u7387\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16457", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fc7\u7a0b\u89c4\u5212", "\u89c6\u9891\u7406\u89e3", "\u5bf9\u6bd4\u5b66\u4e60", "\u63a8\u7406\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16457v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Contrastive Energy Fields for Inference-Time Procedure Planning in Instructional Videos", "tldr": "\u8bba\u6587\u63d0\u51fa CEFITO\uff0c\u5c06\u6559\u5b66\u89c6\u9891\u4e2d\u7684\u8fc7\u7a0b\u89c4\u5212\u8868\u8ff0\u4e3a\u63a8\u7406\u65f6\u7684\u4efb\u52a1\u7ea6\u675f\u4f18\u5316\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u80fd\u91cf\u573a\u5b66\u4e60\u52a8\u4f5c\u6761\u4ef6\u8868\u793a\uff0c\u5e76\u5728\u89c4\u5212\u65f6\u663e\u5f0f\u6392\u9664\u4e0d\u76f8\u5173\u52a8\u4f5c\uff0c\u4ece\u800c\u5728\u4e24\u4e2a\u8fc7\u7a0b\u89c4\u5212\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u5148\u8fdb\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generative modeling has shown increasing promise for predicting cellular perturbation effects under chemical compound treatments. Existing approaches either model perturbation as a distribution-to-distribution mapping without explicit concentration handling, or treat concentration as a discrete class label, precluding continuous dose control. We introduce a joint flow matching approach that simultaneously models cell latents and drug concentration via a dual-timestep formulation, enabling dose-conditioned single-cell morphing through the invertibility of flow matching. The joint formulation induces a monotonic dose-response geometry in latent space and additionally supports concentration estimation from cell morphology. As proof of concept, we further demonstrate generalization to an unseen dose held out during training. Empirically, our method achieves competitive or improved per-concentration metrics on two compounds compared with representative baselines, while enabling capabilities structurally unavailable to discrete-class methods.", "arxiv_id": "2608.16424", "arxiv_url": "https://arxiv.org/abs/2608.16424", "authors": ["Lea Bogensperger", "Manuela Merlo", "Martin Baumgartner", "Michael Krauthammer", "Bernard Ciraulo"], "brief": "\u8bba\u6587\u63d0\u51fa\u8054\u5408\u6d41\u5339\u914d\u65b9\u6cd5\uff0c\u5c06\u7ec6\u80de\u6f5c\u53d8\u91cf\u4e0e\u836f\u7269\u6d53\u5ea6\u4e00\u8d77\u5efa\u6a21\uff0c\u901a\u8fc7\u53cc\u65f6\u95f4\u6b65\u8bbe\u8ba1\u5b9e\u73b0\u8fde\u7eed\u5242\u91cf\u6761\u4ef6\u4e0b\u7684\u5355\u7ec6\u80de\u5f62\u6001\u751f\u6210\u3002\u8be5\u65b9\u6cd5\u5728\u4e24\u4e2a\u5316\u5408\u7269\u5b9e\u9a8c\u4e2d\u8fbe\u5230\u4e0e\u57fa\u7ebf\u76f8\u5f53\u6216\u66f4\u597d\u7684\u5206\u5242\u91cf\u6307\u6807\uff0c\u5e76\u80fd\u4f30\u8ba1\u6d53\u5ea6\u3001\u6cdb\u5316\u5230\u672a\u89c1\u5242\u91cf\uff0c\u63d0\u4f9b\u79bb\u6563\u7c7b\u522b\u65b9\u6cd5\u4e0d\u5177\u5907\u7684\u8fde\u7eed\u5242\u91cf\u63a7\u5236\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16424", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u6a21\u578b", "\u6d41\u5339\u914d", "\u5355\u7ec6\u80de", "\u836f\u7269\u5242\u91cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16424v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Joint Flow Matching Enables Continuous Dose-Conditioned Cell Morphing", "tldr": "\u8bba\u6587\u63d0\u51fa\u8054\u5408\u6d41\u5339\u914d\u65b9\u6cd5\uff0c\u5c06\u7ec6\u80de\u6f5c\u53d8\u91cf\u4e0e\u836f\u7269\u6d53\u5ea6\u4e00\u8d77\u5efa\u6a21\uff0c\u901a\u8fc7\u53cc\u65f6\u95f4\u6b65\u8bbe\u8ba1\u5b9e\u73b0\u8fde\u7eed\u5242\u91cf\u6761\u4ef6\u4e0b\u7684\u5355\u7ec6\u80de\u5f62\u6001\u751f\u6210\u3002\u8be5\u65b9\u6cd5\u5728\u4e24\u4e2a\u5316\u5408\u7269\u5b9e\u9a8c\u4e2d\u8fbe\u5230\u4e0e\u57fa\u7ebf\u76f8\u5f53\u6216\u66f4\u597d\u7684\u5206\u5242\u91cf\u6307\u6807\uff0c\u5e76\u80fd\u4f30\u8ba1\u6d53\u5ea6\u3001\u6cdb\u5316\u5230\u672a\u89c1\u5242\u91cf\uff0c\u63d0\u4f9b\u79bb\u6563\u7c7b\u522b\u65b9\u6cd5\u4e0d\u5177\u5907\u7684\u8fde\u7eed\u5242\u91cf\u63a7\u5236\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Universal visual representations require adaptation mechanisms that adapt across heterogeneous domains without fragmenting knowledge into domain-specific modules. Parameter-efficient fine-tuning adapts frozen visual foundation models efficiently, but standard low-rank adapters use a fixed subspace for all inputs, which can be restrictive when domains differ in style, background, and semantic context. MoE-based adapters improve specialization through multiple expert pathways, but often rely on external routers and large expert banks, adding parameters and separating routing from adaptation. We propose \\textbf{Self-Routed Tensor Adapters}, a compact framework for multi-domain visual adaptation. SRTA projects each input into a low-rank space, computes routing weights from this representation using a learnable domain matrix, and uses these weights to blend slices of a shared Tucker core. This produces a sample-specific adaptation matrix without an external gating network, allowing shared visual factors to be reused while supporting domain-aware specialization. To strengthen pathway learning, we introduce a progressive depth-weighted routing objective that supervises routing decisions across adapter layers. Across five heterogeneous multi-domain visual classification benchmarks, SRTA achieves competitive or slightly stronger average accuracy than MoE-style PEFT baselines while using substantially fewer trainable parameters. At rank 64, SRTA uses 2.77M parameters in the 4-domain setting compared with 9.52M for MoLoRA, and 3.00M in the 6-domain setting compared with 14.31M. Overall, SRTA offers an effective accuracy-parameter trade-off for adapting visual foundation models toward universal multi-domain representations. \\href{https://github.com/surajyadav-research/SRTA}{GitHub}", "arxiv_id": "2608.16384", "arxiv_url": "https://arxiv.org/abs/2608.16384", "authors": ["Suraj Yadav"], "brief": "\u8bba\u6587\u63d0\u51fa\u81ea\u8def\u7531\u5f20\u91cf\u9002\u914d\u5668\uff08SRTA\uff09\uff0c\u7528\u4e8e\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u7684\u53c2\u6570\u9ad8\u6548\u591a\u57df\u9002\u914d\uff1a\u5b83\u4ece\u8f93\u5165\u7684\u4f4e\u79e9\u8868\u793a\u4e2d\u76f4\u63a5\u751f\u6210\u8def\u7531\u6743\u91cd\uff0c\u5e76\u6df7\u5408\u5171\u4eab Tucker \u6838\u7684\u5207\u7247\uff0c\u5f97\u5230\u6837\u672c\u81ea\u9002\u5e94\u7684\u9002\u914d\u77e9\u9635\uff0c\u65e0\u9700\u989d\u5916\u95e8\u63a7\u7f51\u7edc\u3002\u5b9e\u9a8c\u5728\u4e94\u4e2a\u591a\u57df\u89c6\u89c9\u5206\u7c7b\u57fa\u51c6\u4e0a\u8fbe\u5230\u4e0e MoE \u5f0f PEFT \u65b9\u6cd5\u76f8\u5f53\u6216\u7565\u4f18\u7684\u7cbe\u5ea6\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u53ef\u8bad\u7ec3\u53c2\u6570\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16384", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u591a\u57df\u9002\u914d", "\u4f4e\u79e9\u9002\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16384v1", "published_at": "2026-08-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Self-Routed Tensor Adapters for Parameter-Efficient Universal Visual Adaptation", "tldr": "\u8bba\u6587\u63d0\u51fa\u81ea\u8def\u7531\u5f20\u91cf\u9002\u914d\u5668\uff08SRTA\uff09\uff0c\u7528\u4e8e\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u7684\u53c2\u6570\u9ad8\u6548\u591a\u57df\u9002\u914d\uff1a\u5b83\u4ece\u8f93\u5165\u7684\u4f4e\u79e9\u8868\u793a\u4e2d\u76f4\u63a5\u751f\u6210\u8def\u7531\u6743\u91cd\uff0c\u5e76\u6df7\u5408\u5171\u4eab Tucker \u6838\u7684\u5207\u7247\uff0c\u5f97\u5230\u6837\u672c\u81ea\u9002\u5e94\u7684\u9002\u914d\u77e9\u9635\uff0c\u65e0\u9700\u989d\u5916\u95e8\u63a7\u7f51\u7edc\u3002\u5b9e\u9a8c\u5728\u4e94\u4e2a\u591a\u57df\u89c6\u89c9\u5206\u7c7b\u57fa\u51c6\u4e0a\u8fbe\u5230\u4e0e MoE \u5f0f PEFT \u65b9\u6cd5\u76f8\u5f53\u6216\u7565\u4f18\u7684\u7cbe\u5ea6\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u53ef\u8bad\u7ec3\u53c2\u6570\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
