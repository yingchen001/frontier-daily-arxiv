ion, with distinct networks supporting language, formal reasoning, reasoning about other minds, and reasoning about the physical world. Is this modular organization a fundamental principle of how intelligent systems must be built, or an evolutionary accident specific to biological brains? Here, we test whether a similar organization emerges in Large Language Models--another class of intelligent systems created through a very different optimization process. Using circuit analyses across N=46 tasks spanning four cognitive domains (language, formal reasoning, social reasoning, physical reasoning), we find that LLMs develop a modular architecture that mirrors the human brain: tasks drawing on the same network in humans recruit overlapping neurons in LLMs, whereas tasks drawing on different networks recruit distinct neurons. The convergent emergence of modularity in brains and neural networks suggests that it may be a fundamental property of intelligent systems.", "arxiv_id": "2608.13567", "arxiv_url": "https://arxiv.org/abs/2608.13567", "authors": ["Pengrui Han", "Jacob Andreas", "Evelina Fedorenko", "Andrea Gregor de Varda"], "brief": "\u8bba\u6587\u901a\u8fc7\u5bf946\u4e2a\u8de8\u8bed\u8a00\u3001\u5f62\u5f0f\u63a8\u7406\u3001\u793e\u4f1a\u63a8\u7406\u548c\u7269\u7406\u63a8\u7406\u4efb\u52a1\u7684\u7535\u8def\u5206\u6790\uff0c\u53d1\u73b0\u5927\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u4e5f\u4f1a\u5f62\u6210\u7c7b\u4f3c\u4eba\u8111\u529f\u80fd\u5206\u533a\u7684\u6a21\u5757\u5316\u67b6\u6784\u3002\u76f8\u540c\u8ba4\u77e5\u9886\u57df\u7684\u4efb\u52a1\u4f1a\u6fc0\u6d3b\u91cd\u53e0\u795e\u7ecf\u5143\uff0c\u4e0d\u540c\u9886\u57df\u5219\u6fc0\u6d3b\u76f8\u5bf9\u5206\u79bb\u7684\u795e\u7ecf\u5143\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/Pengrui-Han/LLM_Modularity", "github_stars": 69, "hf_url": "https://huggingface.co/papers/2608.13567", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d646\u4e2a\u4efb\u52a1\uff0c\u6a2a\u8de8\u8bed\u8a00\u3001\u5f62\u5f0f\u63a8\u7406\u3001\u793e\u4f1a\u63a8\u7406\u3001\u7269\u7406\u63a8\u7406\u56db\u7c7b\u8ba4\u77e5\u9886\u57df", "\u4f7f\u7528\u7535\u8def\u5206\u6790\u7814\u7a76LLM\u4e2d\u4e0d\u540c\u4efb\u52a1\u6240\u8c03\u7528\u7684\u795e\u7ecf\u5143\u91cd\u53e0\u5173\u7cfb", "\u53d1\u73b0LLM\u7684\u4efb\u52a1\u76f8\u5173\u795e\u7ecf\u5143\u7ec4\u7ec7\u4e0e\u4eba\u8111\u529f\u80fd\u7f51\u7edc\u5b58\u5728\u5bf9\u5e94\u6027\uff0c\u652f\u6301\u6a21\u5757\u5316\u53ef\u80fd\u662f\u667a\u80fd\u7cfb\u7edf\u7684\u666e\u904d\u5c5e\u6027"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u8ba4\u77e5\u67b6\u6784", "\u795e\u7ecf\u79d1\u5b66"], "num_comments": 2, "on_hf": true, "organization": "Massachusetts Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2608.13567v1", "published_at": "2026-06-27", "score": 0.536, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13567.png", "title": "Modular Cognitive Architecture Emerges in Large Language Models", "tldr": "LLM\u4e2d\u6d8c\u73b0\u7c7b\u4f3c\u4eba\u8111\u7684\u6a21\u5757\u5316\u8ba4\u77e5\u7ed3\u6784", "upvotes": 12, "what_it_is": "\u8bba\u6587\u901a\u8fc7\u5bf946\u4e2a\u8de8\u8bed\u8a00\u3001\u5f62\u5f0f\u63a8\u7406\u3001\u793e\u4f1a\u63a8\u7406\u548c\u7269\u7406\u63a8\u7406\u4efb\u52a1\u7684\u7535\u8def\u5206\u6790\uff0c\u53d1\u73b0\u5927\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u4e5f\u4f1a\u5f62\u6210\u7c7b\u4f3c\u4eba\u8111\u529f\u80fd\u5206\u533a\u7684\u6a21\u5757\u5316\u67b6\u6784\u3002\u76f8\u540c\u8ba4\u77e5\u9886\u57df\u7684\u4efb\u52a1\u4f1a\u6fc0\u6d3b\u91cd\u53e0\u795e\u7ecf\u5143\uff0c\u4e0d\u540c\u9886\u57df\u5219\u6fc0\u6d3b\u76f8\u5bf9\u5206\u79bb\u7684\u795e\u7ecf\u5143\u3002", "why_notable": "\u8be5\u7814\u7a76\u628a\u8ba4\u77e5\u795e\u7ecf\u79d1\u5b66\u4e2d\u7684\u529f\u80fd\u4e13\u95e8\u5316\u95ee\u9898\u5f15\u5165LLM\u53ef\u89e3\u91ca\u6027\u5206\u6790\uff0c\u63d0\u793a\u6a21\u5757\u5316\u5e76\u975e\u751f\u7269\u5927\u8111\u7684\u5076\u7136\u4ea7\u7269\uff0c\u800c\u53ef\u80fd\u662f\u667a\u80fd\u7cfb\u7edf\u5728\u4e0d\u540c\u4f18\u5316\u8def\u5f84\u4e0b\u90fd\u4f1a\u6536\u655b\u51fa\u7684\u7ed3\u6784\u539f\u5219\uff0c\u5bf9\u7406\u89e3LLM\u5185\u90e8\u673a\u5236\u548c\u8bbe\u8ba1\u66f4\u53ef\u63a7\u6a21\u578b\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "With the rapid advancement of image editing models and their widespread application across various domains, there is an increasingly urgent need to deploy these model capabilities directly into real-world scenarios. However, existing benchmarks remain confined to simple single-image tasks, suffering from limited coverage dimensions and an inability to effectively differentiate performance among diverse models. Consequently, they fail to reliably evaluate model performance in complex multi-image editing, highly demanding reasoning instructions, and practical deployment settings. To address these limitations, we propose CPI-Bench, a Comprehensive, Practical andIntelligent benchmark for real-world image editing. CPI-Bench comprises three core subsets: CPI-General-Bench, which comprehensively covers diverse editing tasks and pioneers the inclusion of multi-image editing evaluation; CPI-Practical-Bench, which focuses on high-frequency real-user application scenarios; and CPI-Intelligent-Bench, which is dedicated to evaluating capabilities in highly demanding reasoning-based editing. Evaluation results of mainstream image editing models based on CPI-Bench demonstrate that CPI-Bench enhances performance differentiation among models. It provides a comprehensive and reliable quantification of gaps in general editing capabilities, practical deployment efficacy, and advanced reasoning-based editing, offering invaluable guidance for the future optimization of image editing models. Crucially, our ranking analysis reveals that CPI-Bench achieves the highest alignment with the Arena Image Edit Leaderboard, indicating it faithfully captures the preferences and perceptual judgments of human evaluators, serving as a robust proxy for real-world user experience.", "arxiv_id": "2608.14546", "arxiv_url": "https://arxiv.org/abs/2608.14546", "authors": ["Qinye Zhou", "Jun Zheng", "Yongchao Du", "Yuan Wang", "Zhengrui Chen", "Zuan Gao", "Taihang Hu", "Chao Lin", "Yefeng Shen", "Xingjian Wang", "Zhao Wang", "Zhengtao Wu", "Xiaoli Xu", "Zhengze Xu", "Hao Yan", "Denghui Yang", "Yuhang Yu", "Huayu Zhang", "Mingzhou Zhang", "Mengting Chen"], "brief": "\u8bba\u6587\u63d0\u51fa CPI-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u56fe\u50cf\u7f16\u8f91\u7684\u7efc\u5408\u3001\u5b9e\u7528\u3001\u667a\u80fd\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u8986\u76d6\u901a\u7528\u7f16\u8f91\u3001\u591a\u56fe\u7f16\u8f91\u3001\u771f\u5b9e\u9ad8\u9891\u5e94\u7528\u573a\u666f\u4ee5\u53ca\u9ad8\u63a8\u7406\u9700\u6c42\u7684\u7f16\u8f91\u4efb\u52a1\uff0c\u7528\u4e8e\u66f4\u53ef\u9760\u5730\u533a\u5206\u4e3b\u6d41\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/zqyzzz/CPI-benchmark", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.14546", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5305\u542b CPI-General-Bench\u3001CPI-Practical-Bench\u3001CPI-Intelligent-Bench \u4e09\u4e2a\u5b50\u96c6\uff0c\u5206\u522b\u8bc4\u6d4b\u901a\u7528\u80fd\u529b\u3001\u5b9e\u9645\u90e8\u7f72\u573a\u666f\u548c\u63a8\u7406\u5f0f\u7f16\u8f91\u80fd\u529b", "\u7387\u5148\u5c06\u591a\u56fe\u50cf\u7f16\u8f91\u7eb3\u5165\u7cfb\u7edf\u8bc4\u6d4b\uff0c\u5e76\u8986\u76d6\u590d\u6742\u6307\u4ee4\u548c\u771f\u5b9e\u7528\u6237\u9ad8\u9891\u9700\u6c42", "\u8bc4\u6d4b\u6392\u540d\u4e0e Arena Image Edit Leaderboard \u5bf9\u9f50\u5ea6\u6700\u9ad8\uff0c\u8bf4\u660e\u66f4\u8d34\u8fd1\u4eba\u7c7b\u504f\u597d\u548c\u771f\u5b9e\u7528\u6237\u4f53\u9a8c"], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u63a8\u7406\u80fd\u529b"], "num_comments": 2, "on_hf": true, "organization": "alibaba", "pdf_url": "https://arxiv.org/pdf/2608.14546v1", "published_at": "2026-08-14", "score": 0.53, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14546.png", "title": "CPI-Bench: A Comprehensive,Practical and Intelligent Benchmark for Real-World Image Editing", "tldr": "\u9762\u5411\u771f\u5b9e\u573a\u666f\u7684\u56fe\u50cf\u7f16\u8f91\u7efc\u5408\u57fa\u51c6", "upvotes": 13, "what_it_is": "\u8bba\u6587\u63d0\u51fa CPI-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u56fe\u50cf\u7f16\u8f91\u7684\u7efc\u5408\u3001\u5b9e\u7528\u3001\u667a\u80fd\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u8986\u76d6\u901a\u7528\u7f16\u8f91\u3001\u591a\u56fe\u7f16\u8f91\u3001\u771f\u5b9e\u9ad8\u9891\u5e94\u7528\u573a\u666f\u4ee5\u53ca\u9ad8\u63a8\u7406\u9700\u6c42\u7684\u7f16\u8f91\u4efb\u52a1\uff0c\u7528\u4e8e\u66f4\u53ef\u9760\u5730\u533a\u5206\u4e3b\u6d41\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u80fd\u529b\u3002", "why_notable": "\u73b0\u6709\u56fe\u50cf\u7f16\u8f91\u57fa\u51c6\u591a\u5c40\u9650\u4e8e\u7b80\u5355\u5355\u56fe\u4efb\u52a1\uff0c\u96be\u4ee5\u53cd\u6620\u771f\u5b9e\u90e8\u7f72\u4e2d\u7684\u590d\u6742\u9700\u6c42\u3002CPI-Bench \u63d0\u4f9b\u4e86\u66f4\u5168\u9762\u4e14\u66f4\u5177\u533a\u5206\u5ea6\u7684\u8bc4\u6d4b\u6846\u67b6\uff0c\u53ef\u4e3a\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u4f18\u5316\u548c\u4ea7\u54c1\u5316\u843d\u5730\u63d0\u4f9b\u53c2\u8003\u3002"}, {"abstract": "Constructing an interactive 3D open world from a user query is important. However, existing methods are primarily evaluated on idealized, simple queries, making it difficult to systematically analyze and compare how multimodal agents understand user intent, use 3D tools, and reason over textual and visual 3D world information. To this end, we propose VibeWorlding, a unified framework for benchmarking and training vibe worlding agents: a multimodal agent that can autonomously infer user intent, plan scene layout, invoke 3D tools, and reflect on the multimodal feedback in a multi-turn agent-environment interaction process. To achieve this, we first build VWE-BENCH, a benchmark of 2,616 high-quality 3D assets, 323 human-annotated seed 3D worlds, and 6,828 reverse-synthesized multimodal user queries, split into verified queries with ground-truth and unverified queries with carefully designed rubrics. Moreover, we develop VibeWorlding-Gym, a joint multimodal RL post-training framework that integrates (1) a sandbox environment unifying asset retrieval, editing, and image rendering as MCP tools, and (2) a rubric-based verifier that combines physical feasibility and intent fulfillment verification, supporting both fair model evaluation and scalable multimodal RL reward service. Our experiments show that current frontier MLLMs are far from solving the vibe worlding agent task, with even GPT-5.5 and Qwen3.8-Max reaching below 60% success rate, and trace the bottleneck to precise 3D world editing. We further find that RL training can ease this weakness and enable open-source MLLMs to even surpass closed-source frontiers: our VibeWorlder-8B is comparable to frontier MLLMs, while our flagship VibeWorlder-30B-A3B attains the best overall Pass@1 among all evaluated models.", "arxiv_id": "2608.15265", "arxiv_url": "https://arxiv.org/abs/2608.15265", "authors": ["Yansong Ning", "Jingwen Ye", "Zhongkai Wu", "Yang Sun", "Yiqin Zhu", "Xingyi Li", "Weidong Zhang", "Hao Liu"], "brief": "\u8bba\u6587\u63d0\u51fa VibeWorlding\uff0c\u7528\u4e8e\u8bc4\u6d4b\u548c\u8bad\u7ec3\u80fd\u4ece\u7528\u6237\u67e5\u8be2\u81ea\u4e3b\u6784\u5efa\u4ea4\u4e92\u5f0f3D\u5f00\u653e\u4e16\u754c\u7684\u591a\u6a21\u6001\u667a\u80fd\u4f53\u3002\u8be5\u6846\u67b6\u8986\u76d6\u610f\u56fe\u7406\u89e3\u3001\u573a\u666f\u89c4\u5212\u30013D\u5de5\u5177\u8c03\u7528\u3001\u89c6\u89c9\u53cd\u9988\u53cd\u601d\u4e0e\u591a\u8f6e\u4ea4\u4e92\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/usail-hkust/VibeWorlding-Gym", "github_stars": 24, "hf_url": "https://huggingface.co/papers/2608.15265", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa VWE-BENCH\uff0c\u5305\u542b2616\u4e2a\u9ad8\u8d28\u91cf3D\u8d44\u4ea7\u3001323\u4e2a\u4eba\u5de5\u6807\u6ce8\u79cd\u5b50\u4e16\u754c\u548c6828\u4e2a\u53cd\u5411\u5408\u6210\u591a\u6a21\u6001\u7528\u6237\u67e5\u8be2\u3002", "\u63d0\u51fa VibeWorlding-Gym\uff0c\u5c06\u8d44\u4ea7\u68c0\u7d22\u3001\u7f16\u8f91\u3001\u6e32\u67d3\u5c01\u88c5\u4e3a MCP \u5de5\u5177\uff0c\u5e76\u7528\u57fa\u4e8e\u89c4\u5219\u7684\u9a8c\u8bc1\u5668\u8bc4\u4f30\u7269\u7406\u53ef\u884c\u6027\u4e0e\u610f\u56fe\u6ee1\u8db3\u5ea6\u3002", "\u5b9e\u9a8c\u663e\u793a\u524d\u6cbf MLLM \u6210\u529f\u7387\u4ecd\u4f4e\u4e8e60%\uff0c\u74f6\u9888\u4e3b\u8981\u5728\u7cbe\u786e3D\u4e16\u754c\u7f16\u8f91\uff1b\u591a\u6a21\u6001\u5f3a\u5316\u5b66\u4e60\u53ef\u663e\u8457\u63d0\u5347\u5f00\u6e90\u6a21\u578b\u8868\u73b0\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "3D\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.15265v1", "published_at": "2026-08-15", "score": 0.524, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15265.png", "title": "VibeWorlding: Can Multimodal Agents Construct 3D Open Worlds End-to-End?", "tldr": "\u8bc4\u6d4b\u5e76\u8bad\u7ec3\u7aef\u5230\u7aef3D\u5f00\u653e\u4e16\u754c\u667a\u80fd\u4f53", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa VibeWorlding\uff0c\u7528\u4e8e\u8bc4\u6d4b\u548c\u8bad\u7ec3\u80fd\u4ece\u7528\u6237\u67e5\u8be2\u81ea\u4e3b\u6784\u5efa\u4ea4\u4e92\u5f0f3D\u5f00\u653e\u4e16\u754c\u7684\u591a\u6a21\u6001\u667a\u80fd\u4f53\u3002\u8be5\u6846\u67b6\u8986\u76d6\u610f\u56fe\u7406\u89e3\u3001\u573a\u666f\u89c4\u5212\u30013D\u5de5\u5177\u8c03\u7528\u3001\u89c6\u89c9\u53cd\u9988\u53cd\u601d\u4e0e\u591a\u8f6e\u4ea4\u4e92\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a3D\u5f00\u653e\u4e16\u754c\u751f\u6210\u4ece\u5355\u6b21\u751f\u6210\u63a8\u8fdb\u5230\u591a\u8f6e\u667a\u80fd\u4f53\u5f0f\u5de5\u5177\u4f7f\u7528\u4e0e\u53cd\u9988\u5b66\u4e60\uff0c\u5e76\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u57fa\u51c6\u548cRL\u8bad\u7ec3\u73af\u5883\uff0c\u5bf93D\u5185\u5bb9\u751f\u6210\u3001\u6e38\u620f/\u4eff\u771f\u4e16\u754c\u6784\u5efa\u548c\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7814\u7a76\u90fd\u6709\u8f83\u9ad8\u4ef7\u503c\u3002"}, {"abstract": "Part-aware 3D object generation is essential for graphics applications such as controllable modeling, editing, and articulation, where objects are represented as coherent assemblies of semantic parts. However, existing part-aware generation methods, do not scale well to highly complex objects. As the number of parts increases, generating detailed geometry becomes prohibitively expensive in token length and memory. We introduce MegaParts, a scalable autoregressive 3D generation framework to address this challenge by combining structured sequence modeling with a token-efficient vector-quantized shape tokenizer. Our tokenizer learns discrete latent representations for part-level geometry by minimizing token usage subject to high-fidelity reconstruction, enabling adaptive-length tokenization based on geometric complexity. On top of this compact representation, we train a large language model to generate object bounding boxes, part bounding boxes, and part shape tokens within a unified structured sequence. Combined with efficient long-context training strategy, our token-efficient formulation scales to objects with up to 300 parts and sequence lengths up to 256k tokens. This substantially extends the scale of part-aware 3D generation while preserving compositional structure and enabling fine-grained part-level control. Our method achieves higher mesh quality than baseline autoregressive and diffusion models, showing that compressed discrete part tokens improve not only scalability but also the achievable fidelity of generated geometry. These results suggest that LLM native token-efficient autoregressive modeling is a compelling alternative to diffusion for large-scale part-aware 3D generation. The project page is available at https://expmaster.github.io/megaparts_webpage.", "arxiv_id": "2608.14783", "arxiv_url": "https://arxiv.org/abs/2608.14783", "authors": ["Manwen Liao", "Xinyu Lian", "Jian Mao", "Kaixu Chen", "Li Luo", "Jinghao Yan", "Wanshui Gan", "Qiao Yu", "Weitian Zhang", "Chunhua Shen", "Guang Chen", "Bo Dai", "Xudong Xu", "Zhaoyang Lyu"], "brief": "MegaParts \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u90e8\u4ef6\u7684\u53ef\u6269\u5c55\u81ea\u56de\u5f52 3D \u751f\u6210\u6846\u67b6\uff0c\u5c06\u5411\u91cf\u91cf\u5316\u5f62\u72b6 tokenizer \u4e0e\u7ed3\u6784\u5316\u5e8f\u5217\u5efa\u6a21\u7ed3\u5408\u3002\u5b83\u53ef\u7edf\u4e00\u751f\u6210\u7269\u4f53\u6846\u3001\u90e8\u4ef6\u6846\u548c\u90e8\u4ef6\u5f62\u72b6\u4ee4\u724c\uff0c\u652f\u6301\u6700\u591a 300 \u4e2a\u90e8\u4ef6\u7684\u590d\u6742\u7269\u4f53\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": "https://github.com/InternRobotics/MeshCoder", "github_stars": 504, "hf_url": "https://huggingface.co/papers/2608.14783", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bbe\u8ba1 token \u9ad8\u6548\u7684\u5411\u91cf\u91cf\u5316\u5f62\u72b6 tokenizer\uff0c\u4ee5\u81ea\u9002\u5e94\u957f\u5ea6\u8868\u793a\u4e0d\u540c\u590d\u6742\u5ea6\u7684\u90e8\u4ef6\u51e0\u4f55\uff0c\u5728\u9ad8\u4fdd\u771f\u91cd\u5efa\u4e0b\u51cf\u5c11 token \u6570\u3002", "\u4f7f\u7528\u5927\u8bed\u8a00\u6a21\u578b\u5728\u7edf\u4e00\u7ed3\u6784\u5316\u5e8f\u5217\u4e2d\u5efa\u6a21\u7269\u4f53\u5305\u56f4\u76d2\u3001\u90e8\u4ef6\u5305\u56f4\u76d2\u4e0e\u90e8\u4ef6\u5f62\u72b6 token\uff0c\u5e76\u7ed3\u5408\u957f\u4e0a\u4e0b\u6587\u8bad\u7ec3\u652f\u6301\u6700\u9ad8 256k \u5e8f\u5217\u957f\u5ea6\u3002", "\u5728\u590d\u6742\u90e8\u4ef6\u7ea7 3D \u751f\u6210\u4e2d\uff0c\u76f8\u6bd4\u81ea\u56de\u5f52\u548c\u6269\u6563\u57fa\u7ebf\u53d6\u5f97\u66f4\u9ad8\u7f51\u683c\u8d28\u91cf\uff0c\u540c\u65f6\u4fdd\u7559\u7ec4\u5408\u7ed3\u6784\u4e0e\u7ec6\u7c92\u5ea6\u90e8\u4ef6\u63a7\u5236\u80fd\u529b\u3002"], "keywords": ["3D\u751f\u6210", "\u81ea\u56de\u5f52\u6a21\u578b", "\u5411\u91cf\u91cf\u5316", "\u53ef\u63a7\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2608.14783v1", "published_at": "2026-08-14", "score": 0.507, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14783.png", "title": "MegaParts: Scaling Part-Aware 3D Object Generation to 300 Parts via Token-Efficient Autoregressive Modeling", "tldr": "\u7528\u9ad8\u6548\u79bb\u6563\u90e8\u4ef6\u4ee4\u724c\u6269\u5c55\u590d\u67423D\u751f\u6210\u3002", "upvotes": 3, "what_it_is": "MegaParts \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u90e8\u4ef6\u7684\u53ef\u6269\u5c55\u81ea\u56de\u5f52 3D \u751f\u6210\u6846\u67b6\uff0c\u5c06\u5411\u91cf\u91cf\u5316\u5f62\u72b6 tokenizer \u4e0e\u7ed3\u6784\u5316\u5e8f\u5217\u5efa\u6a21\u7ed3\u5408\u3002\u5b83\u53ef\u7edf\u4e00\u751f\u6210\u7269\u4f53\u6846\u3001\u90e8\u4ef6\u6846\u548c\u90e8\u4ef6\u5f62\u72b6\u4ee4\u724c\uff0c\u652f\u6301\u6700\u591a 300 \u4e2a\u90e8\u4ef6\u7684\u590d\u6742\u7269\u4f53\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u663e\u8457\u63d0\u5347\u4e86\u90e8\u4ef6\u611f\u77e5 3D \u751f\u6210\u7684\u89c4\u6a21\u4e0a\u9650\uff0c\u8bc1\u660e\u538b\u7f29\u79bb\u6563\u90e8\u4ef6 token \u53ef\u540c\u65f6\u6539\u5584\u53ef\u6269\u5c55\u6027\u4e0e\u51e0\u4f55\u8d28\u91cf\uff0c\u4e3a\u5927\u89c4\u6a21\u53ef\u63a7 3D \u5efa\u6a21\u63d0\u4f9b\u4e86\u6269\u6563\u6a21\u578b\u4e4b\u5916\u7684 LLM \u539f\u751f\u81ea\u56de\u5f52\u8def\u7ebf\u3002"}, {"abstract": "LLM agents in the ReAct paradigm alternate between reasoning, acting, and observing, but deliberate reasoning is confined to the Thought phase: while the agent serializes an action and waits for the environment, its reasoning is frozen. We identify this recurring interval for Action and Observation as a reasoning idle window and ask whether it can host additional reasoning in parallel that serves future turns. Therefore, we propose Second Thought, a training-free inference framework that forks four auxiliary branches the instant each Thought phase concludes, decodes them concurrently with the main loop, and merges the generated thoughts back when the environment observation arrives. In this way, Second Thought relocates the added reasoning off the main thread\u0027s sequential decoding path. Across three agentic benchmarks and three reasoning LLMs, Second Thought lowers the average turn count in all nine (model,benchmark) pairs and reduces main thread decoding in six of them by up to 43% (roughly 20% on average among those settings), while leaving it essentially unchanged in a seventh; Pass@1 shows no significant change in seven of nine pairs and the two significant differences are +12.4 and +10.2 points. Against a compute-matched control that forces an equivalent budget onto the main thread\u0027s own reasoning, it attains strictly higher Pass@1 with 1.3 to 3.2 less sequential decoding in all four settings where the control applies.", "arxiv_id": "2608.13667", "arxiv_url": "https://arxiv.org/abs/2608.13667", "authors": ["Zhensu Sun", "Chengran Yang", "Yunbo Lyu", "Jieke Shi", "David Lo"], "brief": "\u8bba\u6587\u63d0\u51fa Second Thought\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LLM \u667a\u80fd\u4f53\u63a8\u7406\u6846\u67b6\uff1a\u5728 ReAct \u7684 Thought \u7ed3\u675f\u540e\uff0c\u5229\u7528 Action/Observation \u7b49\u5f85\u7a97\u53e3\u5e76\u884c\u751f\u6210\u8f85\u52a9\u601d\u8003\uff0c\u5e76\u5728\u65b0\u89c2\u5bdf\u5230\u6765\u65f6\u5408\u5e76\u56de\u4e3b\u6d41\u7a0b\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13667", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc6\u522b ReAct \u667a\u80fd\u4f53\u4e2d\u52a8\u4f5c\u6267\u884c\u4e0e\u73af\u5883\u89c2\u5bdf\u4e4b\u95f4\u7684\u201c\u63a8\u7406\u7a7a\u95f2\u7a97\u53e3\u201d\uff0c\u5c06\u989d\u5916\u63a8\u7406\u4ece\u4e3b\u7ebf\u7a0b\u987a\u5e8f\u89e3\u7801\u8def\u5f84\u4e2d\u79fb\u51fa\u3002", "\u6bcf\u8f6e Thought \u7ed3\u675f\u540e\u5e76\u884c fork \u56db\u4e2a\u8f85\u52a9\u5206\u652f\uff0c\u4e0e\u4e3b\u5faa\u73af\u540c\u65f6\u89e3\u7801\uff0c\u5f85 observation \u8fd4\u56de\u540e\u5408\u5e76\u8f85\u52a9 thought \u670d\u52a1\u540e\u7eed\u51b3\u7b56\u3002", "\u5728 3 \u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u548c 3 \u4e2a\u63a8\u7406 LLM \u4e0a\uff0c9 \u7ec4\u5b9e\u9a8c\u5747\u964d\u4f4e\u5e73\u5747\u8f6e\u6570\uff1b\u90e8\u5206\u8bbe\u7f6e\u4e3b\u7ebf\u7a0b\u89e3\u7801\u6700\u591a\u51cf\u5c11 43%\uff0cPass@1 \u57fa\u672c\u4e0d\u964d\u4e14\u4e24\u7ec4\u663e\u8457\u63d0\u5347\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u7406\u4f18\u5316", "\u5e76\u884c\u89e3\u7801", "ReAct"], "num_comments": 3, "on_hf": true, "organization": "Singapore Management University", "pdf_url": "https://arxiv.org/pdf/2608.13667v1", "published_at": "2026-08-13", "score": 0.494, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13667.png", "title": "Second Thought: Reasoning in Parallel as LLM Agents Act and Observe", "tldr": "\u5229\u7528\u884c\u52a8\u7b49\u5f85\u671f\u5e76\u884c\u589e\u5f3a\u667a\u80fd\u4f53\u63a8\u7406", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa Second Thought\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LLM \u667a\u80fd\u4f53\u63a8\u7406\u6846\u67b6\uff1a\u5728 ReAct \u7684 Thought \u7ed3\u675f\u540e\uff0c\u5229\u7528 Action/Observation \u7b49\u5f85\u7a97\u53e3\u5e76\u884c\u751f\u6210\u8f85\u52a9\u601d\u8003\uff0c\u5e76\u5728\u65b0\u89c2\u5bdf\u5230\u6765\u65f6\u5408\u5e76\u56de\u4e3b\u6d41\u7a0b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e0d\u6539\u6a21\u578b\u3001\u4e0d\u9700\u8bad\u7ec3\uff0c\u53ea\u901a\u8fc7\u63a8\u7406\u65f6\u5e76\u884c\u8c03\u5ea6\u63d0\u5347\u667a\u80fd\u4f53\u6548\u7387\uff0c\u9488\u5bf9 ReAct \u7684\u4e32\u884c\u74f6\u9888\u7ed9\u51fa\u5b9e\u7528\u4f18\u5316\uff1b\u76f8\u6bd4\u628a\u540c\u7b49\u8ba1\u7b97\u5f3a\u884c\u52a0\u5230\u4e3b\u7ebf\u7a0b\u63a8\u7406\u4e0a\uff0c\u5b83\u5728\u9002\u7528\u8bbe\u7f6e\u4e2d\u540c\u65f6\u83b7\u5f97\u66f4\u9ad8 Pass@1 \u548c\u66f4\u5c11\u987a\u5e8f\u89e3\u7801\u3002"}, {"abstract": "Clinical decision support is moving toward committees of language-model agents deliberating on a shared workspace. We ask whether such committees can be gamed by shortcuts, cues a benchmark rewards but a clinician would ignore. Across seven cohorts on six public datasets spanning text (MedQA-USMLE, MedMCQA, MIMIC-CXR reports), imaging (NIH ChestX-ray14, MIMIC-CXR-JPG, CheXpert) and tabular ICU records (SUPPORT2), Gemini committees resist these cues in isolation (flip 5-16%), yet a socially plausible shortcut spreads: when two peers assert the same wrong answer, the holdout under test adopts it in 38% of cases, as does a false \"pre-screen\" system flag, on both capability tiers. Of three oversight agents, a gate cannot separate adoption from honest agreement (false-positive rate 100%); a same-lineage judge reading only the transcript flags adoption on text (precision 100%, recall 93%) but collapses onto the gate in imaging; a referee that privately re-queries the holdout transfers to imaging (77-88% precision, 13-21% false-positive rate). Tripling a cue\u0027s visual salience does not move contagion, whereas a second peer voice raises it by half again. Gaming a hidden rubric is near-silent: only 1/10 text and 1/134 imaging drifters name the rubric they moved toward. What games a committee is social plausibility, and only a referee independent of self-report catches it. Code: https://github.com/criticaldata/benchmaxxing", "arxiv_id": "2608.03744", "arxiv_url": "https://arxiv.org/abs/2608.03744", "authors": ["Sebasti\u00e1n Andr\u00e9s Cajas Ord\u00f3\u00f1ez", "Agastya Munnangi", "Aldo Marzullo", "Felipe Ocampo Osorio", "Quang Bui", "Mohammad Shahin", "Armaan Grewal", "Emmanuel Paul Kwesiga", "Anqi Peter Li", "Josephine Nanyonjo", "Aaditya Panchal", "Arshnoor Bhutani", "Nikhil Jaiswal", "Milit S. Patel", "Maximin Lange", "Leo Anthony Celi"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e34\u5e8a\u8bed\u8a00\u6a21\u578b\u591a\u667a\u80fd\u4f53\u59d4\u5458\u4f1a\u5728\u6587\u672c\u3001\u5f71\u50cf\u548c\u8868\u683c\u4efb\u52a1\u4e2d\u662f\u5426\u4f1a\u88ab\u57fa\u51c6\u6377\u5f84\u201c\u6e38\u620f\u5316\u201d\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5355\u72ec\u6377\u5f84\u5f71\u54cd\u6709\u9650\uff0c\u4f46\u5177\u6709\u793e\u4f1a\u53ef\u4fe1\u5ea6\u7684\u540c\u4f34\u4e00\u81f4\u9519\u8bef\u4f1a\u663e\u8457\u4f20\u64ad\uff0c\u5e76\u6bd4\u8f83\u4e86\u591a\u79cd\u76d1\u7763\u667a\u80fd\u4f53\u7684\u8bc6\u522b\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/criticaldata/benchmaxxing", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.03744", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d66\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u30017\u4e2a\u961f\u5217\uff0c\u5305\u62ecMedQA\u3001MedMCQA\u3001MIMIC-CXR\u3001NIH ChestX-ray14\u3001CheXpert\u548cSUPPORT2\u7b49\u591a\u6a21\u6001\u4e34\u5e8a\u4efb\u52a1\u30 7763\u667a\u80fd\u4f53\u7684\u8bc6\u522b\u80fd\u529b\u3002", "why_notable": "\u8bba\u6587\u63ed\u793a\u4e86\u4e34\u5e8a\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u4e00\u79cd\u5173\u952e\u98ce\u9669\uff1a\u771f\u6b63\u5371\u9669\u7684\u4e0d\u662f\u663e\u773c\u63d0\u793a\uff0c\u800c\u662f\u793e\u4f1a\u4e0a\u770b\u4f3c\u5408\u7406\u7684\u9519\u8bef\u5171\u8bc6\u3002\u5b83\u5bf9\u533b\u7597AI\u8bc4\u6d4b\u3001LLM agent\u5b89\u5168\u548c\u591a\u667a\u80fd\u4f53\u76d1\u7763\u673a\u5236\u90fd\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "We show that on-policy reinforcement learning with verifiable rewards (RLVR) can improve the current objective while making successful behaviors for later objectives too rare to sample and reinforce. We call this verifier-induced support reshaping and define effective rewardable support as successful trajectories reachable within a fixed rollout budget. Across two model families, we study this effect through repeated verifier-scored sampling and bidirectional training on mathematical reasoning and constrained instruction following, including sequential training with the opposite verifier. Math-RLVR raises average instruction-following success but reduces the number of prompts with any successful response under repeated sampling. On IFEval with Qwen3-8B-Base, pass@1 rises by 6.5 percentage points while best@32 falls by 9.8 percentage points, and the same divergence appears across both models and IF benchmarks. Conversely, IF-RLVR shifts math responses from step-by-step openings toward direct answers, lowers best@k across sampling budgets, and reduces reward variation for later Math-RLVR. Token-distribution analyses and controlled opening interventions show that these changes concentrate in the first few response tokens. RLVR mainly reranks openings already available in the base policy, and the selected opening causally affects math searchability. The tested reference-policy constraints, routing priors, and on-policy distillation preserve cross-task support only partially; MathIF and ReasonIF show that marginal gains translate only partly into responses that are both correct and constraint-following. Therefore, endpoint improvements do not guarantee future trainability or joint capability under on-policy optimization. Code is available at https://github.com/sylvain-wei/verifier-induced-support-reshaping", "arxiv_id": "2608.00220", "arxiv_url": "https://arxiv.org/abs/2608.00220", "authors": ["Shaohang Wei", "Zikun Su", "Feifan Song", "Wen Luo", "Wei Li", "Guangyue Peng", "Houfeng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u9a8c\u8bc1\u5668\u8bf1\u5bfc\u7684\u652f\u6301\u96c6\u91cd\u5851\u201d\u73b0\u8c61\uff1a on-policy RLVR \u867d\u80fd\u63d0\u5347\u5f53\u524d\u4efb\u52a1\u6307\u6807\uff0c\u5374\u4f1a\u8ba9\u540e\u7eed\u4efb\u52a1\u7684\u6210\u529f\u8f68\u8ff9\u5728\u6709\u9650\u91c7\u6837\u9884\u7b97\u5185\u53d8\u5f97\u66f4\u96be\u91c7\u5230\u3002\u4f5c\u8005\u5728\u6570\u5b66\u63a8\u7406\u4e0e\u53d7\u7ea6\u675f\u6307\u4ee4\u9075\u5faa\u4efb\u52a1\u4e0a\uff0c\u7528\u591a\u6a21\u578b\u3001\u591a\u57fa\u51c6\u5b9e\u9a8c\u7cfb\u7edf\u9a8c\u8bc1\u4e86\u8fd9\u4e00\u6548\u5e94\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/sylvain-wei/verifier-induced-support-reshaping", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.00220", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5b9a\u4e49\u201c\u6709\u6548\u53ef\u5956\u52b1\u652f\u6301\u96c6\u201d\uff0c\u8861\u91cf\u5728\u56fa\u5b9a rollout \u9884\u7b97\u5185\u53ef\u91c7\u5230\u5e76\u5f3a\u5316\u7684\u6210\u529f\u8f68\u8ff9\uff0c\u800c\u4e0d\u4ec5\u770b pass@1 \u7b49\u7aef\u70b9\u6307\u6807\u3002", "\u5728 Qwen3-8B-Base \u7684 IFEval \u4e0a\uff0cMath-RLVR \u4f7f pass@1 \u63d0\u5347 6.5 \u4e2a\u767e\u5206\u70b9\uff0c\u4f46 best@32 \u4e0b\u964d 9.8 \u4e2a\u767e\u5206\u70b9\uff0c\u8bf4\u660e\u5e73\u5747\u8868\u73b0\u63d0\u5347\u540c\u65f6\u524a\u5f31\u4e86\u53ef\u63a2\u7d22\u6210\u529f\u7a7a\u95f4\u3002", "\u5206\u6790\u663e\u793a\u5f71\u54cd\u4e3b\u8981\u96c6\u4e2d\u5728\u56de\u590d\u5f00\u5934\u51e0\u4e2a token\uff1aRLVR \u66f4\u591a\u662f\u5728\u91cd\u6392\u57fa\u7840\u7b56\u7565\u5df2\u6709\u5f00\u5934\uff0c\u800c\u5f00\u5934\u9009\u62e9\u4f1a\u56e0\u679c\u6027\u5f71\u54cd\u6570\u5b66\u641c\u7d22\u4e0e\u540e\u7eed\u53ef\u8bad\u7ec3\u6027\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u53ef\u9a8c\u8bc1\u5956\u52b1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2608.00220v1", "published_at": "2026-07-31", "score": 0.471, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00220.png", "title": "Verifier-Induced Support Reshaping in On-Policy Optimization", "tldr": "RLVR\u4f1a\u91cd\u5851\u91c7\u6837\u652f\u6301\u96c6\uff0c\u635f\u5bb3\u540e\u7eed\u8bad\u7ec3", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u9a8c\u8bc1\u5668\u8bf1\u5bfc\u7684\u652f\u6301\u96c6\u91cd\u5851\u201d\u73b0\u8c61\uff1a on-policy RLVR \u867d\u80fd\u63d0\u5347\u5f53\u524d\u4efb\u52a1\u6307\u6807\uff0c\u5374\u4f1a\u8ba9\u540e\u7eed\u4efb\u52a1\u7684\u6210\u529f\u8f68\u8ff9\u5728\u6709\u9650\u91c7\u6837\u9884\u7b97\u5185\u53d8\u5f97\u66f4\u96be\u91c7\u5230\u3002\u4f5c\u8005\u5728\u6570\u5b66\u63a8\u7406\u4e0e\u53d7\u7ea6\u675f\u6307\u4ee4\u9075\u5faa\u4efb\u52a1\u4e0a\uff0c\u7528\u591a\u6a21\u578b\u3001\u591a\u57fa\u51c6\u5b9e\u9a8c\u7cfb\u7edf\u9a8c\u8bc1\u4e86\u8fd9\u4e00\u6548\u5e94\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u9192\u7814\u7a76\u8005\u4e0d\u8981\u53ea\u770b\u5f53\u524d\u4efb\u52a1\u7684 RLVR \u6536\u76ca\uff1a\u9a8c\u8bc1\u5668\u4f18\u5316\u53ef\u80fd\u538b\u7f29\u8de8\u4efb\u52a1\u6210\u529f\u8f68\u8ff9\u7684\u53ef\u91c7\u6837\u6027\uff0c\u524a\u5f31\u672a\u6765\u8bad\u7ec3\u80fd\u529b\u4e0e\u8054\u5408\u80fd\u529b\uff0c\u5bf9\u591a\u9636\u6bb5\u8bad\u7ec3\u3001\u5bf9\u9f50\u548c\u53ef\u9a8c\u8bc1\u5956\u52b1\u4f18\u5316\u5177\u6709\u91cd\u8981\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) exhibit strong visual understanding, yet the internal features that cause these behaviors remain difficult to identify, audit, or control. While applicable to post-hoc inspection, hidden states that are decomposed into interpretable feature directions using sparse autoencoders (SAEs) neither readily isolate which features are changed by multimodal training, nor are they directly useful for targeted control. We introduce MMDiff, a multimodal model-diffing framework that trains multimodal SAEs and turns them into feature-level interfaces for discovering and controlling multimodal behavior. MMDiff supports three uses: (i) feature isolation, by diffing a base-LM SAE against its multimodal-adapted counterpart to identify features altered by multimodal training; (ii) task-specific feature detection, via per-token contrastive firing analysis that isolates causal features; and (iii) feature-level control, by causally removing or steering the discovered feature directions. We train multimodal SAEs for three MLLM families, LLaVA-MORE, PaliGemma 2, and InternVL3.5, and evaluate on visual-spatial understanding, multimodal safety, and OCR. MMDiff discovers sparse, causally specific features whose removal selectively degrades target behaviors by an average of 12% on spatial tasks and 17% on OCR, and reduces attack success rate by 24% on multimodal safety attacks, with no impact on VQA performance. Steering these features improves spatial and OCR accuracy by +3.6% and +1.8% on average over a standard single-layer steering baseline. These results show that multimodal SAEs can serve not only as interpretability tools, but as mechanisms for auditing, steering, and controlling MLLMs behavior toward safer and more capable generations.", "arxiv_id": "2608.09928", "arxiv_url": "https://arxiv.org/abs/2608.09928", "authors": ["Hunar Batra", "Lachin Naghashyar", "Ashkan Khakzar", "Philip Torr", "Christian Schroeder de Witt", "Constantin Venhoff", "Ronald Clark"], "brief": "\u8bba\u6587\u63d0\u51fa MMDiff\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u6a21\u578b\u5dee\u5206\u6846\u67b6\uff0c\u901a\u8fc7\u8bad\u7ec3\u591a\u6a21\u6001\u7a00\u758f\u81ea\u7f16\u7801\u5668\uff08SAE\uff09\u6765\u8bc6\u522b\u591a\u6a21\u6001\u8bad\u7ec3\u6539\u53d8\u4e86\u54ea\u4e9b\u5185\u90e8\u7279\u5f81\uff0c\u5e76\u5c06\u8fd9\u4e9b\u7279\u5f81\u7528\u4e8e\u884c\u4e3a\u5ba1\u8ba1\u4e0e\u63a7\u5236\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/hunarbatra/MMDiff", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09928", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u5bf9\u6bd4\u57fa\u7840\u8bed\u8a00\u6a21\u578b SAE \u4e0e\u591a\u6a21\u6001\u9002\u914d\u540e SAE\uff0c\u9694\u79bb\u7531\u591a\u6a21\u6001\u8bad\u7ec3\u6539\u53d8\u7684\u7279\u5f81\u65b9\u5411\u3002", "\u63d0\u51fa\u9010 token \u7684\u5bf9\u6bd4\u6fc0\u6d3b\u5206\u6790\uff0c\u7528\u4e8e\u53d1\u73b0\u4e0e\u89c6\u89c9\u7a7a\u95f4\u7406\u89e3\u3001OCR\u3001\u591a\u6a21\u6001\u5b89\u5168\u7b49\u4efb\u52a1\u56e0\u679c\u76f8\u5173\u7684\u7a00\u758f\u7279\u5f81\u3002", "\u5728 LLaVA-MORE\u3001PaliGemma 2\u3001InternVL3.5 \u4e0a\u9a8c\u8bc1\uff1a\u79fb\u9664\u76ee\u6807\u7279\u5f81\u53ef\u9009\u62e9\u6027\u964d\u4f4e\u7a7a\u95f4\u4efb\u52a112%\u3001OCR 17%\uff0c\u5e76\u5c06\u591a\u6a21\u6001\u5b89\u5168\u653b\u51fb\u6210\u529f\u7387\u964d\u4f4e24%\uff0c\u540c\u65f6\u4e0d\u5f71\u54cd VQA\uff1b\u7279\u5f81 steering \u8fd8\u4f18\u4e8e\u5355\u5c42 steering \u57fa\u7ebf\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u6a21\u578b\u63a7\u5236"], "num_comments": 2, "on_hf": true, "organization": "University of Oxford", "pdf_url": "https://arxiv.org/pdf/2608.09928v1", "published_at": "2026-08-10", "score": 0.464, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Oxford", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09928.png", "title": "Multimodal Model Diffing for Feature Discovery and Control", "tldr": "\u7528\u6a21\u578b\u5dee\u5206\u53d1\u73b0\u5e76\u63a7\u5236MLLM\u5185\u90e8\u7279\u5f81", "upvotes": 8, "what_it_is": "\u8bba\u6587\u63d0\u51fa MMDiff\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u6a21\u578b\u5dee\u5206\u6846\u67b6\uff0c\u901a\u8fc7\u8bad\u7ec3\u591a\u6a21\u6001\u7a00\u758f\u81ea\u7f16\u7801\u5668\uff08SAE\uff09\u6765\u8bc6\u522b\u591a\u6a21\u6001\u8bad\u7ec3\u6539\u53d8\u4e86\u54ea\u4e9b\u5185\u90e8\u7279\u5f81\uff0c\u5e76\u5c06\u8fd9\u4e9b\u7279\u5f81\u7528\u4e8e\u884c\u4e3a\u5ba1\u8ba1\u4e0e\u63a7\u5236\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a SAE \u4ece\u4e8b\u540e\u89e3\u91ca\u5de5\u5177\u63a8\u8fdb\u4e3a\u53ef\u64cd\u4f5c\u7684\u591a\u6a21\u6001\u6a21\u578b\u63a7\u5236\u63a5\u53e3\uff0c\u80fd\u5b9a\u4f4d\u3001\u5ba1\u8ba1\u5e76\u5e72\u9884 MLLM \u7684\u5177\u4f53\u80fd\u529b\u4e0e\u98ce\u9669\u884c\u4e3a\uff0c\u5bf9\u53ef\u89e3\u91ca\u6027\u3001\u5b89\u5168\u5bf9\u9f50\u548c\u80fd\u529b\u589e\u5f3a\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Which reasoning behaviors are associated with correct answers in reasoning models, and does reasoning-oriented training amplify those behaviors? This distinction is important because reasoning-oriented training can make traces look more deliberative without amplifying the behaviors most tied to model correctness. We quantify this mismatch with Behavioral Lift, a metric that measures how much correctness changes when a behavior is present versus absent in a model\u0027s reasoning trace. Across 15 models and 6 benchmarks spanning text-only and vision-language reasoning, we annotate 15,282 traces with a taxonomy whose core behaviors are defined for both LLM and VLM traces. We find evidence for an Amplification-Lift Gap, in which thinking models strongly amplify self-correction, hypothesis testing, and uncertainty acknowledgment, while the highest-lift behaviors are confidence calibration, knowledge alignment, and self-awareness. Confidence calibration is among the strongest positive signals of correctness in both modalities, yet is barely amplified; uncertainty acknowledgment is amplified by 3--7$\\times$, yet is weakly or negatively associated with correctness. We find that reasoning-oriented training does not preferentially amplify the highest-Lift behaviors, motivating process-level objectives that reward calibrated and grounded reasoning rather than surface form alone.", "arxiv_id": "2608.13760", "arxiv_url": "https://arxiv.org/abs/2608.13760", "authors": ["Jean de Dieu Nyandwi", "Leena Mathur", "Yonatan Bisk", "Robert Hawkins", "Graham Neubig"], "brief": "\u8bba\u6587\u63d0\u51fa Behavioral Lift \u6307\u6807\uff0c\u7528\u4e8e\u8861\u91cf\u63a8\u7406\u8f68\u8ff9\u4e2d\u67d0\u7c7b\u884c\u4e3a\u51fa\u73b0\u4e0e\u5426\u5bf9\u7b54\u6848\u6b63\u786e\u6027\u7684\u5f71\u54cd\u3002\u4f5c\u8005\u572815\u4e2a\u6a21\u578b\u30016\u4e2a\u6587\u672c\u4e0e\u89c6\u89c9\u8bed\u8a00\u63a8\u7406\u57fa\u51c6\u4e0a\u6807\u6ce815282\u6761\u8f68\u8ff9\uff0c\u53d1\u73b0\u8bad\u7ec3\u653e\u5927\u7684\u201c\u601d\u8003\u884c\u4e3a\u201d\u548c\u771f\u6b63\u9884\u6d4b\u6b63\u786e\u6027\u7684\u884c\u4e3a\u5b58\u5728\u660e\u663e\u9519\u4f4d\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13760", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u7edf\u4e00\u9002\u7528\u4e8e LLM \u4e0e VLM \u63a8\u7406\u8f68\u8ff9\u7684\u884c\u4e3a\u5206\u7c7b\u4e0e Behavioral Lift \u5ea6\u91cf\u3002", "\u601d\u8003\u6a21\u578b\u663e\u8457\u653e\u5927\u81ea\u6211\u7ea0\u9519\u3001\u5047\u8bbe\u68c0\u9a8c\u3001\u4e0d\u786e\u5b9a\u6027\u8868\u8fbe\u7b49\u884c\u4e3a\uff0c\u4f46\u8fd9\u4e9b\u884c\u4e3a\u5e76\u975e\u6700\u5f3a\u6b63\u786e\u6027\u4fe1\u53f7\u3002", "\u7f6e\u4fe1\u5ea6\u6821\u51c6\u3001\u77e5\u8bc6\u5bf9\u9f50\u548c\u81ea\u6211\u8ba4\u77e5\u4e0e\u6b63\u786e\u7b54\u6848\u66f4\u5f3a\u76f8\u5173\uff0c\u5176\u4e2d\u7f6e\u4fe1\u5ea6\u6821\u51c6\u5728\u6587\u672c\u548c\u89c6\u89c9\u8bed\u8a00\u4efb\u52a1\u4e2d\u90fd\u5f88\u5173\u952e\uff0c\u5374\u5f88\u5c11\u88ab\u653e\u5927\u3002"], "keywords": ["\u63a8\u7406\u6a21\u578b", "\u8fc7\u7a0b\u76d1\u7763", "\u591a\u6a21\u6001", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2608.13760v1", "published_at": "2026-08-13", "score": 0.461, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13760.png", "title": "Amplified Does Not Mean Predictive: Reasoning Behaviors in Thinking Models", "tldr": "\u601d\u8003\u6a21\u578b\u653e\u5927\u7684\u884c\u4e3a\u672a\u5fc5\u9884\u793a\u6b63\u786e", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Behavioral Lift \u6307\u6807\uff0c\u7528\u4e8e\u8861\u91cf\u63a8\u7406\u8f68\u8ff9\u4e2d\u67d0\u7c7b\u884c\u4e3a\u51fa\u73b0\u4e0e\u5426\u5bf9\u7b54\u6848\u6b63\u786e\u6027\u7684\u5f71\u54cd\u3002\u4f5c\u8005\u572815\u4e2a\u6a21\u578b\u30016\u4e2a\u6587\u672c\u4e0e\u89c6\u89c9\u8bed\u8a00\u63a8\u7406\u57fa\u51c6\u4e0a\u6807\u6ce815282\u6761\u8f68\u8ff9\uff0c\u53d1\u73b0\u8bad\u7ec3\u653e\u5927\u7684\u201c\u601d\u8003\u884c\u4e3a\u201d\u548c\u771f\u6b63\u9884\u6d4b\u6b63\u786e\u6027\u7684\u884c\u4e3a\u5b58\u5728\u660e\u663e\u9519\u4f4d\u3002", "why_notable": "\u8be5\u7814\u7a76\u6307\u51fa\u5f53\u524d\u63a8\u7406\u5bfc\u5411\u8bad\u7ec3\u53ef\u80fd\u66f4\u591a\u4f18\u5316\u4e86\u201c\u770b\u8d77\u6765\u4f1a\u601d\u8003\u201d\u7684\u8868\u9762\u5f62\u5f0f\uff0c\u800c\u975e\u771f\u6b63\u63d0\u5347\u6b63\u786e\u6027\u7684\u63a8\u7406\u884c\u4e3a\uff0c\u63d0\u793a\u672a\u6765\u5e94\u8bbe\u8ba1\u5956\u52b1\u6821\u51c6\u6027\u3001\u624e\u5b9e\u77e5\u8bc6\u5bf9\u9f50\u548c\u8fc7\u7a0b\u53ef\u9760\u6027\u7684\u8bad\u7ec3\u76ee\u6807\u3002"}, {"abstract": "Long-horizon robot manipulation chains many contact-rich skills into one multi-stage task. Vision-language-action (VLA) models increasingly master the individual skills, yet the chain still fails: errors compound beyond the policy\u0027s ability to correct, and one subtask silently constrains the next. A promising recipe freezes the VLA and puts an LLM agent in charge: it plans in language, moves in free space with analytic primitives, invokes the VLA only for contact-rich segments, and writes adaptation into language memory. Applied to long horizons, it breaks twice. (1) Competence comes from whole-task exploration at test time, whose cost is multiplicative in stages: if one stage needs T episodes, a K-stage task needs about T^K, and a failure does not reveal which stage caused it. (2) It has no representation of transitions: the VLA primitive carries an exit but no entry condition, so a subtask can succeed in a form its successor cannot use. We present BATON. Against (1), BATON makes the subtask the unit of exploration: each is explored in the cheap short-horizon regime and its solution stored in memory; a long-horizon trajectory is then composed from these solutions rather than discovered whole. Cost becomes additive (T*K) and every failure is attributed to a single stage. Against (2), BATON equips exploration with a transition-aware memory. Within a subtask, a verifier agent governs the invocation transition: the VLA is called only after the wrist view confirms the scene is ready. Across subtasks, a handoff transition restores an entry state disturbed by the predecessor\u0027s residue, and a lookahead transition selects the strategy whose outcome the successor can inherit. No parameters are updated. On the long-horizon benchmark RoboMemArena, BATON improves task success by 11.6% and cumulative success by 14.9% over the SoTA.", "arxiv_id": "2608.16889", "arxiv_url": "https://arxiv.org/abs/2608.16889", "authors": ["Bingxin Xu", "Yuzhang Shang", "Emilio Ferrara"], "brief": "\u672c\u6587\u63d0\u51fa BATON\uff1a\u51bb\u7ed3 VLA \u6a21\u578b\uff0c\u7531 LLM \u667a\u80fd\u4f53\u8d1f\u8d23\u89c4\u5212\u3001\u8c03\u7528\u6280\u80fd\u4e0e\u5199\u5165\u8bed\u8a00\u8bb0\u5fc6\u3002\u5b83\u5c06\u957f\u7a0b\u4efb\u52a1\u62c6\u4e3a\u53ef\u72ec\u7acb\u63a2\u7d22\u7684\u5b50\u4efb\u52a1\uff0c\u5e76\u7528\u8fc7\u6e21\u611f\u77e5\u8bb0\u5fc6\u4fdd\u8bc1\u524d\u540e\u5b50\u4efb\u52a1\u72b6\u6001\u53ef\u8854\u63a5\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16889", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6d4b\u8bd5\u65f6\u63a2\u7d22\u5355\u4f4d\u4ece\u6574\u4efb\u52a1\u6539\u4e3a\u5b50\u4efb\u52a1\uff0c\u4f7f\u63a2\u7d22\u6210\u672c\u7531\u7ea6 T^K \u964d\u4e3a T*K\uff0c\u5e76\u80fd\u5b9a\u4f4d\u5931\u8d25\u9636\u6bb5\u3002", "\u5f15\u5165 transition-aware memory\uff0c\u5305\u62ec\u8c03\u7528\u524d\u9a8c\u8bc1\u3001\u5b50\u4efb\u52a1\u95f4 handoff \u6062\u590d\u5165\u53e3\u72b6\u6001\u3001lookahead \u9009\u62e9\u53ef\u88ab\u540e\u7eed\u7ee7\u627f\u7684\u7b56\u7565\u3002", "\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u53c2\u6570\uff0c\u5728 RoboMemArena \u4e0a\u76f8\u8f83 SoTA \u4efb\u52a1\u6210\u529f\u7387\u63d0\u5347 11.6%\uff0c\u7d2f\u8ba1\u6210\u529f\u7387\u63d0\u5347 14.9%\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u957f\u671f\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16889v1", "published_at": "2026-08-17", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Don\u0027t Drop the BATON: Long-Horizon Robot Manipulation via Agentic Subtask Exploration and Transition-aware Memory", "tldr": "BATON\u7528\u5b50\u4efb\u52a1\u63a2\u7d22\u4e0e\u8fc7\u6e21\u8bb0\u5fc6\u63d0\u5347\u957f\u7a0b\u673a\u5668\u4eba\u64cd\u4f5c\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa BATON\uff1a\u51bb\u7ed3 VLA \u6a21\u578b\uff0c\u7531 LLM \u667a\u80fd\u4f53\u8d1f\u8d23\u89c4\u5212\u3001\u8c03\u7528\u6280\u80fd\u4e0e\u5199\u5165\u8bed\u8a00\u8bb0\u5fc6\u3002\u5b83\u5c06\u957f\u7a0b\u4efb\u52a1\u62c6\u4e3a\u53ef\u72ec\u7acb\u63a2\u7d22\u7684\u5b50\u4efb\u52a1\uff0c\u5e76\u7528\u8fc7\u6e21\u611f\u77e5\u8bb0\u5fc6\u4fdd\u8bc1\u524d\u540e\u5b50\u4efb\u52a1\u72b6\u6001\u53ef\u8854\u63a5\u3002", "why_notable": "\u9488\u5bf9\u957f\u7a0b\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u9519\u8bef\u7d2f\u79ef\u548c\u5b50\u4efb\u52a1\u9690\u6027\u7ea6\u675f\u95ee\u9898\uff0cBATON\u7528\u667a\u80fd\u4f53\u5f0f\u5206\u89e3\u63a2\u7d22\u4e0e\u72b6\u6001\u8fc7\u6e21\u8bb0\u5fc6\u663e\u8457\u63d0\u5347\u7ec4\u5408\u53ef\u9760\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The rapid evolution of text-to-image (T2I) generation models has effectively solved the foundational challenge of raw pixel synthesis, shifting the community\u0027s focus toward fulfilling increasingly intricate user requests. While recent agentic image generation workflows enhance static inference with advanced capabilities like external knowledge retrieval and iterative reasoning, they mostly operate in isolated silos with fixed ``one-size-fits-all\" topologies. This inevitably leads to severe compute-mismatch, where simple queries are forced through computationally heavy pipelines. To bridge this gap, we present GenRouter, the first unified workflow routing framework for agentic image generation. We first formulate GenCanvas, standardizing diverse agentic pipelines into a universal set of foundational primitives and executable templates. Operating over this unified space, GenRouter adaptively routes heterogeneous prompts to their optimal workflows via (i) demand profiling, (ii) experience matching, and (iii) Pareto filtering. Extensive experiments across diverse benchmarks demonstrate that GenRouter achieves superior visual alignment while reducing execution costs by over 95% and latency by 65% compared to heavyweight static pipelines. Furthermore, the system continuously self-evolves via accumulated experience, enabling robust zero-shot generalization that boosts performance and halves computational overhead.", "arxiv_id": "2608.16721", "arxiv_url": "https://arxiv.org/abs/2608.16721", "authors": ["Harold Haodong Chen", "Zhiyu Hou", "Wen-Jie Shu", "Weilin Ruan", "Yingjie Xu", "Litao Guo", "Ying-Cong Chen"], "brief": "\u8bba\u6587\u63d0\u51fa GenRouter\uff0c\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u5f0f\u6587\u751f\u56fe\u7684\u7edf\u4e00\u5de5\u4f5c\u6d41\u8def\u7531\u6846\u67b6\u3002\u5b83\u5c06\u591a\u79cd\u751f\u6210\u6d41\u6c34\u7ebf\u6807\u51c6\u5316\u4e3a GenCanvas \u539f\u8bed\u4e0e\u6a21\u677f\uff0c\u5e76\u6839\u636e\u63d0\u793a\u9700\u6c42\u52a8\u6001\u9009\u62e9\u6700\u5408\u9002\u7684\u6267\u884c\u6d41\u7a0b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16721", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7 GenCanvas \u7edf\u4e00\u8868\u793a\u68c0\u7d22\u3001\u63a8\u7406\u3001\u8fed\u4ee3\u4f18\u5316\u7b49\u4e0d\u540c agentic \u56fe\u50cf\u751f\u6210\u7ba1\u7ebf", "\u91c7\u7528\u9700\u6c42\u753b\u50cf\u3001\u7ecf\u9a8c\u5339\u914d\u4e0e Pareto \u8fc7\u6ee4\uff0c\u4e3a\u4e0d\u540c\u590d\u6742\u5ea6\u63d0\u793a\u5206\u914d\u5408\u9002\u5de5\u4f5c\u6d41", "\u76f8\u6bd4\u91cd\u578b\u9759\u6001\u7ba1\u7ebf\uff0c\u89c6\u89c9\u5bf9\u9f50\u66f4\u597d\uff0c\u540c\u65f6\u6267\u884c\u6210\u672c\u964d\u4f4e\u8d85\u8fc795%\u3001\u5ef6\u8fdf\u964d\u4f4e65%"], "keywords": ["\u667a\u80fd\u4f53", "\u6587\u751f\u56fe", "\u5de5\u4f5c\u6d41\u8def\u7531", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16721v1", "published_at": "2026-08-17", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GenRouter: Unified Workflow Routing for Agentic Image Generation", "tldr": "\u4e3a\u56fe\u50cf\u751f\u6210\u667a\u80fd\u4f53\u81ea\u9002\u5e94\u9009\u62e9\u6700\u4f18\u6d41\u7a0b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GenRouter\uff0c\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u5f0f\u6587\u751f\u56fe\u7684\u7edf\u4e00\u5de5\u4f5c\u6d41\u8def\u7531\u6846\u67b6\u3002\u5b83\u5c06\u591a\u79cd\u751f\u6210\u6d41\u6c34\u7ebf\u6807\u51c6\u5316\u4e3a GenCanvas \u539f\u8bed\u4e0e\u6a21\u677f\uff0c\u5e76\u6839\u636e\u63d0\u793a\u9700\u6c42\u52a8\u6001\u9009\u62e9\u6700\u5408\u9002\u7684\u6267\u884c\u6d41\u7a0b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u667a\u80fd\u4f53\u5f0f\u56fe\u50cf\u751f\u6210\u4e2d\u7684\u201c\u7b97\u529b\u9519\u914d\u201d\u95ee\u9898\uff0c\u9996\u6b21\u7cfb\u7edf\u5316\u5730\u505a\u8de8\u5de5\u4f5c\u6d41\u8def\u7531\uff0c\u5728\u4fdd\u6301\u6216\u63d0\u5347\u8d28\u91cf\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u6210\u672c\uff0c\u5e76\u652f\u6301\u57fa\u4e8e\u7ecf\u9a8c\u7684\u6301\u7eed\u81ea\u8fdb\u5316\u4e0e\u96f6\u6837\u672c\u6cdb\u5316\u3002"}, {"abstract": "The next generation of AI agents is increasingly moving beyond systems that answer isolated questions toward persistent personal assistants that can understand, remember, and continuously learn from users\u0027 experiences. Such assistants require long-term memory to accumulate and leverage user-specific experiences over time, yet existing benchmarks remain inadequate for realistic mobile settings, where experiences are heterogeneous, multimodal, evolving, and deeply personal. We introduce MobileMem, a benchmark and framework for studying on-device long-term memory, grounded in a year-scale collection of mobile experiences. MobileMem employs a knowledge-grounded synthesis pipeline to construct coherent and temporally consistent long-horizon trajectories from user-app sessions. It provides complementary text and multimodal settings covering multi-hop and temporal reasoning, knowledge updating, and implicit preference inference. Specifically, MobileMem enables agents to remember the past, understand the present, and adapt to the future. By modeling experiences rather than isolated facts, MobileMem moves memory beyond information retrieval toward experiential intelligence for continuous personal learning.", "arxiv_id": "2608.13606", "arxiv_url": "https://arxiv.org/abs/2608.13606", "authors": ["Xinle Deng", "Yida Xue", "Xiangyuan Ru", "Yijun Chen", "Buqiang Xu", "Mingjun Mao", "Xinjie Liu", "Haoming Xu", "Shuofei Qiao", "Mengru Wang", "Chen Jiang", "Yuchen Eleanor Jiang", "Lizhong Wang", "Jason Wang", "Li Zeng", "Haofen Wang", "Guilin Qi", "Huajun Chen", "Ningyu Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa MobileMem\uff0c\u4e00\u4e2a\u57fa\u4e8e\u4e00\u5e74\u5c3a\u5ea6\u79fb\u52a8\u4f53\u9a8c\u7684\u7aef\u4fa7\u957f\u671f\u8bb0\u5fc6\u57fa\u51c6\u4e0e\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u77e5\u8bc6\u624e\u6839\u7684\u5408\u6210\u6d41\u7a0b\u6784\u9020\u8fde\u8d2f\u3001\u65f6\u95f4\u4e00\u81f4\u7684\u957f\u7a0b\u7528\u6237-App\u4f1a\u8bdd\u8f68\u8ff9\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u5bf9\u4e2a\u4eba\u7ecf\u5386\u7684\u8bb0\u5fc6\u3001\u63a8\u7406\u4e0e\u9002\u5e94\u80fd\u529b\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA", "cs.MM"], "github_repo": "https://github.com/zjunlp/MobileMem", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2608.13606", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6\u6587\u672c\u4e0e\u591a\u6a21\u6001\u4e24\u79cd\u8bbe\u7f6e\uff0c\u9762\u5411\u771f\u5b9e\u79fb\u52a8\u573a\u666f\u4e2d\u7684\u5f02\u6784\u3001\u6f14\u5316\u3001\u4e2a\u6027\u5316\u4f53\u9a8c\u3002", "\u4efb\u52a1\u5305\u542b\u591a\u8df3\u63a8\u7406\u3001\u65f6\u95f4\u63a8\u7406\u3001\u77e5\u8bc6\u66f4\u65b0\u548c\u9690\u5f0f\u504f\u597d\u63a8\u65ad\u3002", "\u5f3a\u8c03\u4ece\u201c\u68c0\u7d22\u5b64\u7acb\u4e8b\u5b9e\u201d\u8f6c\u5411\u201c\u5efa\u6a21\u8fde\u7eed\u7ecf\u5386\u201d\uff0c\u652f\u6301\u957f\u671f\u4e2a\u4eba\u5b66\u4e60\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u591a\u6a21\u6001", "\u79fb\u52a8\u7aef"], "num_comments": 2, "on_hf": true, "organization": "OpenKG Consortium", "pdf_url": "https://arxiv.org/pdf/2608.13606v2", "published_at": "2026-08-11", "score": 0.309, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13606.png", "title": "MobileMem: Learning from a Year of Mobile Experiences", "tldr": "\u9762\u5411\u79fb\u52a8\u7aef\u4e2a\u4eba\u667a\u80fd\u4f53\u7684\u957f\u671f\u8bb0\u5fc6\u57fa\u51c6\u3002", "upvotes": 20, "what_it_is": "\u8bba\u6587\u63d0\u51fa MobileMem\uff0c\u4e00\u4e2a\u57fa\u4e8e\u4e00\u5e74\u5c3a\u5ea6\u79fb\u52a8\u4f53\u9a8c\u7684\u7aef\u4fa7\u957f\u671f\u8bb0\u5fc6\u57fa\u51c6\u4e0e\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u77e5\u8bc6\u624e\u6839\u7684\u5408\u6210\u6d41\u7a0b\u6784\u9020\u8fde\u8d2f\u3001\u65f6\u95f4\u4e00\u81f4\u7684\u957f\u7a0b\u7528\u6237-App\u4f1a\u8bdd\u8f68\u8ff9\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u5bf9\u4e2a\u4eba\u7ecf\u5386\u7684\u8bb0\u5fc6\u3001\u63a8\u7406\u4e0e\u9002\u5e94\u80fd\u529b\u3002", "why_notable": "\u957f\u671f\u8bb0\u5fc6\u662f\u4e2a\u4eba\u667a\u80fd\u4f53\u843d\u5730\u7684\u6838\u5fc3\u80fd\u529b\uff0cMobileMem\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u79fb\u52a8\u7aef\u771f\u5b9e\u4f7f\u7528\u7684\u8bc4\u6d4b\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u7aef\u4fa7\u8bb0\u5fc6\u3001\u4e2a\u6027\u5316\u52a9\u624b\u548c\u6301\u7eed\u5b66\u4e60\u7814\u7a76\u3002"}, {"abstract": "Apollo did not reach the Moon merely because its engineers could solve difficult equations. It succeeded by turning a distant ambition into a mission architecture of explicit objectives, simulation, verification, and repeated correction. AI now faces a similar transition: frontier models can solve difficult tasks once the problem, tools, and success criteria are specified, yet consequential real-world challenges rarely arrive in an executable or verifiable form. We introduce Apodex Discovery, a framework for building and evaluating discoverative AI through the heavy-duty solver, a system comprising a foundation model, harness, tools, and control policies that pursues extended, stateful, verifiable investigations. It has three core components. First, a problem-scouting process surveyed 561 industries across 16 sectors, assembled 423 high-value real-world problems, and selected 20 for the initial release. Second, a common environment-task-episode abstraction provides data, tools, constraints, feedback, trajectory recording, and verification of intermediate artifacts and final submissions. Third, HDS6 evaluates Tools, Repair, Alternatives, Coherence, Evidence, and Scope independently of final-task success. In AAV capsid design, Apodex surpassed the published state of the art by 7% across viability, tropism, structure prediction, and generative design. In drug repurposing and reformulation, a task-specific biomedical environment improved the mean normalized prediction score of GPT-5.5 and GPT-5.6-sol by 2.5 and 7.6 points over the same closed-book backbone. Controlled ablations show that the fixed TRACES episode interface enables attribution of performance differences to specific solver components. Apodex Discovery moves AI evaluation beyond predefined benchmarks toward verifiable investigations aimed at genuine discovery.", "arxiv_id": "2608.11341", "arxiv_url": "https://arxiv.org/abs/2608.11341", "authors": ["Brian Wang", "Bin Feng", "Xiaoman Pan", "Chenyang An", "Felix Liu", "Tangqi Fang", "Gongbo Sun", "Lingfeng Shen", "Ning Wang", "Handuo Zhang", "Feng Chen", "Fuchao Yang", "Xiang Wang", "Jiacheng Lin", "Siting Li", "Zixuan Liu", "Chi Han", "Zhenhailong Wang", "Kunlun Zhu", "Lawrence Zhao", "Yueqi Guo", "Kailong Wen", "Feng Xing", "Yiling Guo", "Lidong Bing", "David Tan", "Bo An", "Heng Ji", "Sheng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Apodex Discovery\uff0c\u4e00\u4e2a\u9762\u5411\u201c\u53d1\u73b0\u578bAI\u201d\u7684\u8bc4\u6d4b\u4e0e\u6784\u5efa\u6846\u67b6\uff0c\u901a\u8fc7\u91cd\u578b\u6c42\u89e3\u5668\u5c06\u57fa\u7840\u6a21\u578b\u3001\u5de5\u5177\u3001\u63a7\u5236\u7b56\u7565\u548c\u53ef\u9a8c\u8bc1\u73af\u5883\u7ed3\u5408\uff0c\u652f\u6301\u957f\u5468\u671f\u3001\u6709\u72b6\u6001\u7684\u771f\u5b9e\u95ee\u9898\u63a2\u7d22\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11341", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7 problem-scouting \u8c03\u7814 16 \u4e2a\u884c\u4e1a\u677f\u5757\u3001561 \u4e2a\u884c\u4e1a\uff0c\u6574\u7406 423 \u4e2a\u9ad8\u4ef7\u503c\u73b0\u5b9e\u95ee\u9898\uff0c\u5e76\u9996\u6279\u53d1\u5e03 20 \u4e2a\u4efb\u52a1\u3002", "\u63d0\u51fa\u7edf\u4e00\u7684\u73af\u5883-\u4efb\u52a1-\u56de\u5408\u62bd\u8c61\uff0c\u63d0\u4f9b\u6570\u636e\u3001\u5de5\u5177\u3001\u7ea6\u675f\u3001\u53cd\u9988\u3001\u8f68\u8ff9\u8bb0\u5f55\uff0c\u4ee5\u53ca\u4e2d\u95f4\u4ea7\u7269\u548c\u6700\u7ec8\u7ed3\u679c\u9a8c\u8bc1\u3002", "\u8bbe\u8ba1 HDS6 \u8bc4\u4f30\u7ef4\u5ea6\uff0c\u4ece\u5de5\u5177\u4f7f\u7528\u3001\u4fee\u590d\u3001\u5907\u9009\u65b9\u6848\u3001\u4e00\u81f4\u6027\u3001\u8bc1\u636e\u548c\u8303\u56f4\u7b49\u65b9\u9762\u72ec\u7acb\u8861\u91cf\u6c42\u89e3\u5668\u80fd\u529b\uff1b\  and derives multiple fine metrics. PRM-as-a-Judge 1.5 introduces three metrics, building on version 1.0, that characterize failure-side progress, post-drawdown recovery, and success-side execution quality, helping users understand embodied model capability. Based on the rollout videos from benchmarks, we perform a comprehensive assessment of the embodied models, providing some fine-grained metric results and key findings. We further introduce RoboPulse++ to evaluate the reliability of process reward models (PRM), providing evaluators with a more accurate testing platform. Moreover, we release a user-friendly assessment suite, including the benchmark, metric implementation, and visualization tools, to support reproducible manipulation process evaluation. We call on the community to rethink how robots are evaluated and establish transparent, procedural, and reproducible assessment as a foundation for the next generation of embodied intelligence.", "arxiv_id": "2608.14284", "arxiv_url": "https://arxiv.org/abs/2608.14284", "authors": ["Yuyang Liu", "Yanqing Shen", "Ruike Chen", "Jifan Zhao", "Yuxuan Tian", "Yichi Zhang", "Tianfeng Long", "Zixuan Yin", "Yipu Wang", "Ziheng Qin", "Wenxing Tan", "Yang Shi", "Mingyu Cao", "Runze Xiao", "Ziqi Wang", "Zhixin Yin", "Shiwei Chu", "Yi-Fan Zhang", "Yao Mu", "Yuheng Ji", "Yihao Wang", "Jun Yan", "Zhongyuan Wang", "Pengwei Wang", "Xiaolong Zheng"], "brief": "\u8bba\u6587\u53d1\u5e03 PRM-as-a-Judge 1.5\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u64cd\u4f5c\u8fc7\u7a0b\u8bc4\u4f30\u7684\u5de5\u5177\u5305\uff0c\u53ef\u5c06 rollout \u89c6\u9891\u8f6c\u5316\u4e3a\u5bc6\u96c6\u8fdb\u5ea6\u66f2\u7ebf\uff0c\u5e76\u751f\u6210\u591a\u79cd\u7ec6\u7c92\u5ea6\u6307\u6807\u3002\u5b83\u8fd8\u5f15\u5165 RoboPulse++ \u7528\u4e8e\u8bc4\u6d4b\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b\u7684\u53ef\u9760\u6027\uff0c\u5e76\u63d0\u4f9b\u57fa\u51c6\u3001\u6307\u6807\u5b9e\u73b0\u548c\u53ef\u89c6\u5316\u5de5\u5177\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/YuyangLiu2003/PRM-as-a-Judge", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.14284", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5728 1.0 \u57fa\u7840\u4e0a\u65b0\u589e\u4e09\u7c7b\u6307\u6807\uff0c\u5206\u522b\u523b\u753b\u5931\u8d25\u4fa7\u8fdb\u5c55\u3001\u56de\u843d\u540e\u6062\u590d\u80fd\u529b\u548c\u6210\u529f\u4fa7\u6267\u884c\u8d28\u91cf", "\u57fa\u4e8e\u57fa\u51c6 rollout \u89c6\u9891\u5bf9\u5177\u8eab\u6a21\u578b\u8fdb\u884c\u7cfb\u7edf\u8bc4\u4f30\uff0c\u7ed9\u51fa\u7ec6\u7c92\u5ea6\u7ed3\u679c\u4e0e\u5173\u952e\u53d1\u73b0", "\u53d1\u5e03\u53ef\u590d\u73b0\u8bc4\u4f30\u5957\u4ef6\uff0c\u5305\u542b benchmark\u3001\u6307\u6807\u5b9e\u73b0\u3001\u53ef\u89c6\u5316\u5de5\u5177\u548c RoboPulse++ \u6d4b\u8bd5\u5e73\u53f0"], "keywords": ["\u673a\u5668\u4eba", "\u5177\u8eab\u667a\u80fd", "\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b", "\u8bc4\u4f30\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14284v1", "published_at": "2026-08-14", "score": 0.264, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14284.png", "title": "PRM-as-a-Judge 1.5: A Toolkit for Robot Process Assessment", "tldr": "\u7528\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b\u7ec6\u8bc4\u673a\u5668\u4eba\u6267\u884c\u8fc7\u7a0b", "upvotes": 11, "what_it_is": "\u8bba\u6587\u53d1\u5e03 PRM-as-a-Judge 1.5\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u64cd\u4f5c\u8fc7\u7a0b\u8bc4\u4f30\u7684\u5de5\u5177\u5305\uff0c\u53ef\u5c06 rollout \u89c6\u9891\u8f6c\u5316\u4e3a\u5bc6\u96c6\u8fdb\u5ea6\u66f2\u7ebf\uff0c\u5e76\u751f\u6210\u591a\u79cd\u7ec6\u7c92\u5ea6\u6307\u6807\u3002\u5b83\u8fd8\u5f15\u5165 RoboPulse++ \u7528\u4e8e\u8bc4\u6d4b\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b\u7684\u53ef\u9760\u6027\uff0c\u5e76\u63d0\u4f9b\u57fa\u51c6\u3001\u6307\u6807\u5b9e\u73b0\u548c\u53ef\u89c6\u5316\u5de5\u5177\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u770b\u6210\u529f\u7387\u6216\u89c4\u5219\u5316\u8fc7\u7a0b\u5206\u6570\uff0c\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u66f4\u900f\u660e\u3001\u53ef\u89e3\u91ca\u3001\u53ef\u590d\u73b0\u7684\u673a\u5668\u4eba\u8fc7\u7a0b\u8bc4\u4f30\u65b9\u5f0f\uff0c\u6709\u52a9\u4e8e\u8bca\u65ad\u5177\u8eab\u6a21\u578b\u7684\u771f\u5b9e\u80fd\u529b\u4e0e\u5931\u8d25\u6a21\u5f0f\u3002"}, {"abstract": "In 2023, a New York judge sanctioned two attorneys in Mata v. Avianca for filing a brief with hallucinated citations generated by ChatGPT. Such failures are largely caught by database lookups; the harder problem is detecting citations that point to real cases but do not support the propositions for which they are offered -- a failure mode that existing evaluations of LLMs for legal use cases largely overlook. In this paper, we study proposition-level citation support verification through controlled perturbations of real legal citations obtained from two legal corpora, either replacing the cited case or changing only the pinpoint page within the same case. We evaluate fourteen model configurations on the resulting examples. Models catch 93-100% of wrong-case corruptions. They catch only 37-61% of wrong-pinpoint corruptions on court opinions and 52-83% on legal briefs. When models fail to catch wrong-pinpoint corruptions, they accept the citation based on topical overlap rather than page-level support. Scale and extended reasoning narrow the gap but do not close it: GPT-5.4 with high reasoning effort still misses 40% of pinpoint mismatches on court opinions and 18% on briefs. Prompting the model to verify support at the cited page improves recall, but it also raises the false positive rate. Recognizing the right legal topic and verifying support for the cited proposition are distinct capabilities, and current models conflate them.", "arxiv_id": "2608.12571", "arxiv_url": "https://arxiv.org/abs/2608.12571", "authors": ["Apurv Verma"], "brief": "\u672c\u6587\u7814\u7a76\u6cd5\u5f8b\u573a\u666f\u4e2d\u7684\u547d\u9898\u7ea7\u5f15\u7528\u652f\u6301\u9a8c\u8bc1\uff1a\u5f15\u7528\u7684\u6848\u4f8b\u53ef\u80fd\u771f\u5b9e\u5b58\u5728\uff0c\u4f46\u5e76\u4e0d\u652f\u6301\u6587\u4e2d\u4e3b\u5f20\u3002\u4f5c\u8005\u901a\u8fc7\u5bf9\u771f\u5b9e\u6cd5\u5f8b\u5f15\u7528\u8fdb\u884c\u53d7\u63a7\u6270\u52a8\uff0c\u7cfb\u7edf\u8bc4\u4f30\u4e8614\u79cd\u6a21\u578b\u914d\u7f6e\u5728\u8bc6\u522b\u9519\u6848\u4f8b\u4e0e\u9519\u9875\u7801\u5f15\u7528\u4e0a\u7684\u80fd\u529b\u3002", "categories": ["cs.DL", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12571", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6a21\u578b\u51e0\u4e4e\u90fd\u80fd\u8bc6\u522b\u9519\u8bef\u6848\u4f8b\u66ff\u6362\uff0c\u68c0\u51fa\u7387\u8fbe93%-100%\u3002", "\u5bf9\u540c\u4e00\u6848\u4f8b\u5185\u9519\u8bef\u9875\u7801\u7684\u8bc6\u522b\u660e\u663e\u66f4\u5f31\uff1a\u6cd5\u9662\u610f\u89c1\u4e2d\u4ec537%-61%\uff0c\u6cd5\u5f8b\u7b80\u62a5\u4e2d\u4e3a52%-83%\u3002", "\u6a21\u578b\u5931\u8d25\u65f6\u5e38\u4f9d\u636e\u4e3b\u9898\u91cd\u53e0\u8bef\u5224\u5f15\u7528\u6709\u6548\uff1b\u66f4\u5927\u6a21\u578b\u548c\u66f4\u5f3a\u63a8\u7406\u80fd\u7f13\u89e3\u4f46\u65e0\u6cd5\u89e3\u51b3\uff0c\u9875\u7ea7\u9a8c\u8bc1\u63d0\u793a\u4f1a\u63d0\u9ad8\u53ec\u56de\u4f46\u589e\u52a0\u8bef\u62a5\u3002"], "keywords": ["\u6cd5\u5f8bAI", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4e8b\u5b9e\u6838\u67e5", "\u53ef\u9760\u6027\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "Bloomberg", "pdf_url": "https://arxiv.org/pdf/2608.12571v1", "published_at": "2026-08-12", "score": 0.207, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12571.png", "title": "Is this Citation on Point?", "tldr": "\u6cd5\u5f8bLLM\u96be\u8fa8\u771f\u5b9e\u6848\u4f8b\u7684\u9519\u9875\u5f15\u7528", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u6cd5\u5f8b\u573a\u666f\u4e2d\u7684\u547d\u9898\u7ea7\u5f15\u7528\u652f\u6301\u9a8c\u8bc1\uff1a\u5f15\u7528\u7684\u6848\u4f8b\u53ef\u80fd\u771f\u5b9e\u5b58\u5728\uff0c\u4f46\u5e76\u4e0d\u652f\u6301\u6587\u4e2d\u4e3b\u5f20\u3002\u4f5c\u8005\u901a\u8fc7\u5bf9\u771f\u5b9e\u6cd5\u5f8b\u5f15\u7528\u8fdb\u884c\u53d7\u63a7\u6270\u52a8\uff0c\u7cfb\u7edf\u8bc4\u4f30\u4e8614\u79cd\u6a21\u578b\u914d\u7f6e\u5728\u8bc6\u522b\u9519\u6848\u4f8b\u4e0e\u9519\u9875\u7801\u5f15\u7528\u4e0a\u7684\u80fd\u529b\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u6cd5\u5f8bLLM\u8bc4\u4f30\u4e2d\u88ab\u5ffd\u89c6\u7684\u5173\u952e\u98ce\u9669\uff1a\u771f\u5b9e\u5f15\u7528\u5e76\u4e0d\u7b49\u4e8e\u6709\u6548\u5f15\u7528\u3002\u5b83\u533a\u5206\u4e86\u201c\u8bc6\u522b\u6cd5\u5f8b\u4e3b\u9898\u201d\u548c\u201c\u9a8c\u8bc1\u5177\u4f53\u547d\u9898\u652f\u6301\u201d\u4e24\u79cd\u80fd\u529b\uff0c\u5bf9\u6cd5\u5f8bAI\u53ef\u9760\u6027\u8bc4\u6d4b\u3001\u5f15\u7528\u5ba1\u67e5\u5de5\u5177\u548c\u9ad8\u98ce\u9669\u4e13\u4e1a\u5e94\u7528\u5177\u6709\u91cd\u8981\u610f\u4e49\u3002"}, {"abstract": "Driving World Models (DWMs) have recently advanced rapidly with generative models, yet most existing methods mainly focus on conditional scene generation and lack explicit 3D scene understanding, language-grounded reasoning, and controllable 4D editing capabilities. Moreover, commonly used point cloud, occupancy, or BEV representations make it difficult to achieve fine-grained alignment between textual information and the underlying 3D scene structure. To address these limitations, we propose a foundation-feature Gaussian driving world model that unifies scene understanding, language-grounded reasoning, controllable 4D editing, and multi-modal generation within a single framework. Specifically, we introduce a foundation-feature Gaussian tokenizer that directly distills Qwen/SigLIP visual-language features into 3D Gaussian primitives, building a compact open-vocabulary Gaussian semantic field. We further design a geometry-aware Gaussian adapter that combines importance-aware hierarchical selection with text-conditioned Perceiver-style cross-attention to aggregate dense Gaussian primitives into compact world tokens. To improve representation compatibility, we introduce a KL-based Gaussian--image distribution alignment objective that aligns Gaussian world tokens with foundation image tokens. Based on the aligned Gaussian representation, our framework further supports instruction-controllable scene editing, including weather-conditioned generation and dynamic vehicle manipulation. Extensive experiments on broader driving benchmarks demonstrate that our method achieves state-of-the-art performance across scene understanding, visual grounding, planning-oriented reasoning, and controllable 4D generation tasks. We will release the code and datasets publicly on Github.", "arxiv_id": "2608.16234", "arxiv_url": "https://arxiv.org/abs/2608.16234", "authors": ["Tianchen Deng", "Xuefeng Chen", "Shuang Wu", "Qu Chen", "Jiajun Zhu", "Bo Dai", "Jianfei Yang", "Hesheng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa GaussianDWM++\uff0c\u4e00\u79cd\u8bed\u8a00\u63a5\u5730\u7684 3D Gaussian \u9a7e\u9a76\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u5f00\u653e\u8bcd\u6c47\u573a\u666f\u7406\u89e3\u3001\u8bed\u8a00\u63a8\u7406\u3001\u53ef\u63a74D\u7f16\u8f91\u548c\u591a\u6a21\u6001\u751f\u6210\u7edf\u4e00\u5230\u540c\u4e00\u6846\u67b6\u4e2d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16234", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa foundation-feature Gaussian tokenizer\uff0c\u5c06 Qwen/SigLIP \u89c6\u89c9\u8bed\u8a00\u7279\u5f81\u84b8\u998f\u5230 3D Gaussian primitives\uff0c\u6784\u5efa\u7d27\u51d1\u7684\u5f00\u653e\u8bcd\u6c47\u9ad8\u65af\u8bed\u4e49\u573a\u3002", "\u8bbe\u8ba1\u51e0\u4f55\u611f\u77e5 Gaussian adapter\uff0c\u901a\u8fc7\u91cd\u8981\u6027\u5206\u5c42\u9009\u62e9\u4e0e\u6587\u672c\u6761\u4ef6 Perceiver \u5f0f\u4ea4\u53c9\u6ce8\u610f\u529b\uff0c\u5c06\u5bc6\u96c6\u9ad8\u65af\u8868\u793a\u805a\u5408\u4e3a\u7d27\u51d1\u4e16\u754c token\u3002", "\u5f15\u5165 KL \u9ad8\u65af-\u56fe\u50cf\u5206\u5e03\u5bf9\u9f50\u76ee\u6807\uff0c\u4f7f Gaussian world tokens \u4e0e\u57fa\u7840\u89c6\u89c9\u6a21\u578b\u56fe\u50cf token \u517c\u5bb9\uff0c\u5e76\u652f\u6301\u5929\u6c14\u751f\u6210\u3001\u52a8\u6001\u8f66\u8f86\u64cd\u4f5c\u7b49\u6307\u4ee4\u5f0f4D\u7f16\u8f91\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u81ea\u52a8\u9a7e\u9a76", "3D\u9ad8\u65af", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16234v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GaussianDWM++: Language-Grounded 3D Gaussian Driving World Model for Unified Scene Understanding, Editing, and Multi-Modal Generation", "tldr": "\u75283D\u9ad8\u65af\u7edf\u4e00\u9a7e\u9a76\u573a\u666f\u7406\u89e3\u4e0e\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GaussianDWM++\uff0c\u4e00\u79cd\u8bed\u8a00\u63a5\u5730\u7684 3D Gaussian \u9a7e\u9a76\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u5f00\u653e\u8bcd\u6c47\u573a\u666f\u7406\u89e3\u3001\u8bed\u8a00\u63a8\u7406\u3001\u53ef\u63a74D\u7f16\u8f91\u548c\u591a\u6a21\u6001\u751f\u6210\u7edf\u4e00\u5230\u540c\u4e00\u6846\u67b6\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u663e\u5f0f3D\u8868\u793a\u3001\u89c6\u89c9\u8bed\u8a00\u57fa\u7840\u6a21\u578b\u7279\u5f81\u548c\u9a7e\u9a76\u4e16\u754c\u6a21\u578b\u7ed3\u5408\u8d77\u6765\uff0c\u7a81\u7834\u4e86\u4ee5\u5f80\u65b9\u6cd5\u504f\u91cd\u6761\u4ef6\u751f\u6210\u3001\u7f3a\u5c11\u7ec6\u7c92\u5ea6\u6587\u672c-3D\u5bf9\u9f50\u548c\u53ef\u63a7\u7f16\u8f91\u7684\u9650\u5236\uff0c\u5728\u573a\u666f\u7406\u89e3\u3001\u89c6\u89c9\u5b9a\u4f4d\u3001\u89c4\u5212\u63a8\u7406\u548c4D\u751f\u6210\u7b49\u4efb\u52a1\u4e0a\u53d6\u5f97 SOTA\uff0c\u5177\u5907\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u4e0e\u6570\u636e\u751f\u6210\u4ef7\u503c\u3002"}, {"abstract": "This paper investigates an increasingly important topic in generative modeling: pixel-space diffusion models. Although numerous studies have explored this topic, most focus on small-scale or class-conditional settings. Consequently, a practical recipe for training pixel-space models that rival or exceed well-established latent-space counterparts remains elusive. Through a comprehensive empirical study, we first observe that direct large-scale pre-training in pixel space converges substantially more slowly than in latent space. This observation motivates a latent-to-pixel strategy that acquires generative priors efficiently in latent space and transitions to pixel space during post-training. We then systematically investigate the key design choices governing this transition, including weight initialization, data composition, prediction target, decoder architecture, and noise schedule, and identify a practical recipe that makes the resulting pixel-space models match or outperform their latent-space counterparts while delivering 3.18 to 4.75 times end-to-end inference speedups. We hope that our findings provide useful empirical insights and practical guidelines for future research on pixel-space generation.", "arxiv_id": "2608.16887", "arxiv_url": "https://arxiv.org/abs/2608.16887", "authors": ["Dengyang Jiang", "Ruoyi Du", "Zhennan Chen", "Dongyang Liu", "Zanyi Wang", "Mingzhe Zheng", "Xiangpeng Yang", "Huanqia Cai", "Aiming Hao", "Yuming Jiang", "Peng Gao", "Harry Yang", "Steven Hoi"], "brief": "\u672c\u6587\u7cfb\u7edf\u5b9e\u8bc1\u7814\u7a76\u5982\u4f55\u8bad\u7ec3\u5927\u89c4\u6a21\u50cf\u7d20\u7a7a\u95f4\u6587\u751f\u56fe\u6269\u6563\u6a21\u578b\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6f5c\u7a7a\u95f4\u9884\u8bad\u7ec3\u5230\u50cf\u7d20\u7a7a\u95f4\u540e\u8bad\u7ec3\u201d\u7684\u7b56\u7565\uff0c\u5e76\u7ed9\u51fa\u4e00\u5957\u53ef\u5b9e\u8df5\u7684\u8bad\u7ec3\u914d\u65b9\uff0c\u4f7f\u50cf\u7d20\u7a7a\u95f4\u6a21\u578b\u8fbe\u5230\u6216\u8d85\u8fc7\u6f5c\u7a7a\u95f4\u6a21\u578b\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16887", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u76f4\u63a5\u5728\u50cf\u7d20\u7a7a\u95f4\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u6536\u655b\u663e\u8457\u6162\u4e8e\u6f5c\u7a7a\u95f4\u9884\u8bad\u7ec3\uff0c\u56e0\u6b64\u5148\u5728\u6f5c\u7a7a\u95f4\u5b66\u4e60\u751f\u6210\u5148\u9a8c\u518d\u8fc1\u79fb\u5230\u50cf\u7d20\u7a7a\u95f4\u66f4\u9ad8\u6548\u3002", "\u7cfb\u7edf\u5206\u6790\u8fc1\u79fb\u9636\u6bb5\u7684\u5173\u952e\u8bbe\u8ba1\uff0c\u5305\u62ec\u6743\u91cd\u521d\u59cb\u5316\u3001\u6570\u636e\u7ec4\u6210\u3001\u9884\u6d4b\u76ee\u6807\u3001\u89e3\u7801\u5668\u67b6\u6784\u548c\u566a\u58f0\u8c03\u5ea6\u3002", "\u6700\u7ec8\u50cf\u7d20\u7a7a\u95f4\u6a21\u578b\u5728\u6548\u679c\u4e0a\u5339\u914d\u6216\u4f18\u4e8e\u6f5c\u7a7a\u95f4\u6a21\u578b\uff0c\u540c\u65f6\u5b9e\u73b03.18\u81f34.75\u500d\u7aef\u5230\u7aef\u63a8\u7406\u52a0\u901f\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6587\u751f\u56fe", "\u751f\u6210\u6a21\u578b", "\u8bad\u7ec3\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16887v1", "published_at": "2026-08-17", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "An Empirical Study of Training Pixel-Space Text-to-Image Diffusion Models", "tldr": "\u50cf\u7d20\u7a7a\u95f4\u6587\u751f\u56fe\u53ef\u66f4\u5feb\u4e14\u4e0d\u8f93\u6f5c\u7a7a\u95f4", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u5b9e\u8bc1\u7814\u7a76\u5982\u4f55\u8bad\u7ec3\u5927\u89c4\u6a21\u50cf\u7d20\u7a7a\u95f4\u6587\u751f\u56fe\u6269\u6563\u6a21\u578b\u3002\u4f5c\u8005\u63d0\u51fa\u20
