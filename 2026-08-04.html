 Li", "Samuel Bauer", "Heather McIntyre", "Adam Gleave", "Edward Yee", "Kellin Pelrine"], "brief": "\u8bba\u6587\u63d0\u51fa FAR.AI \u6700\u4f4e\u5b89\u5168\u9632\u62a4\u6807\u51c6\uff0c\u6784\u5efa\u5305\u542b 67 \u7c7b\u9759\u6001\u8d8a\u72f1\u6280\u672f\u7684\u5206\u7c7b\u4f53\u7cfb\u3001\u7ec4\u5408\u653b\u51fb\u65b9\u6cd5\uff0c\u5e76\u7528 CBRNE \u4e0e\u7f51\u7edc\u653b\u51fb\u76ee\u6807\u8bc4\u6d4b\u4e3b\u6d41\u524d\u6cbf\u6a21\u578b\u3002\u7ed3\u679c\u663e\u793a\u4e0d\u540c\u6a21\u578b\u9c81\u68d2\u6027\u5dee\u5f02\u8d85\u8fc7\u767e\u500d\uff1aGrok \u548c Gemini \u88ab\u53d1\u73b0\u5927\u91cf\u901a\u7528\u8d8a\u72f1\uff0c\u800c Claude \u4e0e GPT \u5728\u6d4b\u8bd5\u7b56\u7565\u4e0b\u672a\u88ab\u653b\u7834\uff0c\u8bf4\u660e\u73b0\u6709\u516c\u5f00\u9632\u62a4\u6280\u672f\u5df2\u53ef\u663e\u8457\u7f29\u5c0f\u5b89\u5168\u5dee\u8ddd\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03070", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb", "\u5b89\u5168\u8bc4\u6d4b", "\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03070v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AI Security Leaderboard: Methodology, Results and Minimal Standard", "tldr": "\u8bba\u6587\u63d0\u51fa FAR.AI \u6700\u4f4e\u5b89\u5168\u9632\u62a4\u6807\u51c6\uff0c\u6784\u5efa\u5305\u542b 67 \u7c7b\u9759\u6001\u8d8a\u72f1\u6280\u672f\u7684\u5206\u7c7b\u4f53\u7cfb\u3001\u7ec4\u5408\u653b\u51fb\u65b9\u6cd5\uff0c\u5e76\u7528 CBRNE \u4e0e\u7f51\u7edc\u653b\u51fb\u76ee\u6807\u8bc4\u6d4b\u4e3b\u6d41\u524d\u6cbf\u6a21\u578b\u3002\u7ed3\u679c\u663e\u793a\u4e0d\u540c\u6a21\u578b\u9c81\u68d2\u6027\u5dee\u5f02\u8d85\u8fc7\u767e\u500d\uff1aGrok \u548c Gemini \u88ab\u53d1\u73b0\u5927\u91cf\u901a\u7528\u8d8a\u72f1\uff0c\u800c Claude \u4e0e GPT \u5728\u6d4b\u8bd5\u7b56\u7565\u4e0b\u672a\u88ab\u653b\u7834\uff0c\u8bf4\u660e\u73b0\u6709\u516c\u5f00\u9632\u62a4\u6280\u672f\u5df2\u53ef\u663e\u8457\u7f29\u5c0f\u5b89\u5168\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-context reasoning remains a critical bottleneck for large language models, as recent recurrent-memory approaches face two inherent challenges: sequential chunk-wise updates can overwrite early critical evidence with later irrelevant content, and serial inter-chunk dependencies limit parallelism and cause latency to increase with context length. To address these issues, we propose PI-Mem (Parallel-Iterative Memory), a mechanism that processes all chunks in parallel and iteratively refines a shared memory over a bounded number of turns. In each turn, PI-Mem reads all chunks in parallel conditioned on the current memory, selects new or complementary evidence from each chunk, and merges the selected evidence into a compact shared memory for the next turn. To discourage redundant turns, we optimize the workflow through reinforcement learning with an auxiliary turn-efficiency reward, enabling the model to adaptively exit once sufficient evidence has been accumulated. We evaluate PI-Mem with Qwen3.5-35B-A3B and Qwen2.5-7B on the HotpotQA benchmark across context lengths up to 3.6 million tokens and find that it outperforms the recurrent-memory baseline by +6.25 and +7.81 absolute points while achieving 6.1$\\times$ and 2.1$\\times$ inference speedups, respectively. These results demonstrate that PI-Mem breaks the accuracy--efficiency trade-off in long-context reasoning and provides a scalable approach to complex multi-hop question answering over extremely long documents.", "arxiv_id": "2608.03048", "arxiv_url": "https://arxiv.org/abs/2608.03048", "authors": ["Dawei Liu", "Haixu Song", "Shuang Cheng", "Shijie Wang", "Haozheng Hou", "Kaifeng Liu", "Ermo Hua", "Zhonghang Yuan", "Zhijie Zhong", "Yuchen Fan", "Biqing Qi", "Bowen Zhou"], "brief": "\u672c\u6587\u63d0\u51fa PI-Mem\uff0c\u901a\u8fc7\u5e76\u884c\u8bfb\u53d6\u6240\u6709\u6587\u672c\u5757\u5e76\u8fed\u4ee3\u66f4\u65b0\u5171\u4eab\u8bb0\u5fc6\uff0c\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u8bc1\u636e\u8986\u76d6\u548c\u4e32\u884c\u5ef6\u8fdf\u95ee\u9898\u3002\u5176\u5728\u6700\u957f 360 \u4e07 token \u7684 HotpotQA \u4e0a\u663e\u8457\u4f18\u4e8e\u5faa\u73af\u8bb0\u5fc6\u57fa\u7ebf\uff0c\u5e76\u5e26\u6765\u6700\u9ad8 6.1 \u500d\u63a8\u7406\u52a0\u901f\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03048", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u8bb0\u5fc6\u673a\u5236", "\u5f3a\u5316\u5b66\u4e60", "\u95ee\u7b54\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03048v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PI-Mem: Pushing Long-Context Reasoning to 3.6M Tokens with Parallel-Iterative Memory", "tldr": "\u672c\u6587\u63d0\u51fa PI-Mem\uff0c\u901a\u8fc7\u5e76\u884c\u8bfb\u53d6\u6240\u6709\u6587\u672c\u5757\u5e76\u8fed\u4ee3\u66f4\u65b0\u5171\u4eab\u8bb0\u5fc6\uff0c\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u8bc1\u636e\u8986\u76d6\u548c\u4e32\u884c\u5ef6\u8fdf\u95ee\u9898\u3002\u5176\u5728\u6700\u957f 360 \u4e07 token \u7684 HotpotQA \u4e0a\u663e\u8457\u4f18\u4e8e\u5faa\u73af\u8bb0\u5fc6\u57fa\u7ebf\uff0c\u5e76\u5e26\u6765\u6700\u9ad8 6.1 \u500d\u63a8\u7406\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly used to simulate human opinions, but prior work reports conflicting results: some studies find promising alignment with human survey data, while others find persona collapse and weak demographic sensitivity. We show that much of this conflict stems from conflating two distinct tasks. We call the first task emulation, in which models generate individual responses that aggregate into a population distribution. We call the second task estimation, in which models directly predict the population distribution. Evaluating six matched base and post-trained models on the Pew American Trends Panel, we find that base models are stronger emulators: they produce response distributions closer to human ground truth and better preserve demographic structure. Post-trained models are stronger estimators, producing more accurate distributional predictions when asked directly. We propose that model selection for human simulation should be guided by whether the task requires generating text or predicting distributions.", "arxiv_id": "2608.03044", "arxiv_url": "https://arxiv.org/abs/2608.03044", "authors": ["Seth Grief-Albert", "Jessica Bo", "Difan Jiao", "Ashton Anderson"], "brief": "\u8bba\u6587\u533a\u5206\u4e86\u7528\u8bed\u8a00\u6a21\u578b\u6a21\u62df\u6c11\u610f\u7684\u4e24\u7c7b\u4efb\u52a1\uff1a\u751f\u6210\u4e2a\u4f53\u56de\u7b54\u518d\u6c47\u603b\u7684\u201c\u4eff\u771f\u201d\uff0c\u4ee5\u53ca\u76f4\u63a5\u9884\u6d4b\u603b\u4f53\u5206\u5e03\u7684\u201c\u4f30\u8ba1\u201d\u3002\u5728 Pew \u8c03\u67e5\u6570\u636e\u4e0a\u8bc4\u4f30\u516d\u7ec4\u57fa\u5ea7\u4e0e\u540e\u8bad\u7ec3\u6a21\u578b\u540e\u53d1\u73b0\uff0c\u57fa\u5ea7\u6a21\u578b\u66f4\u64c5\u957f\u4fdd\u7559\u4eba\u7fa4\u5206\u5e03\u548c\u4eba\u53e3\u7edf\u8ba1\u7ed3\u6784\uff0c\u540e\u8bad\u7ec3\u6a21\u578b\u5219\u66f4\u64c5\u957f\u76f4\u63a5\u7ed9\u51fa\u51c6\u786e\u7684\u5206\u5e03\u9884\u6d4b\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03044", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u610f\u89c1\u6a21\u62df", "\u540e\u8bad\u7ec3", "\u793e\u4f1a\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03044v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Emulate or Estimate? The Divergent Strengths of Base and Post-Trained Language Models for Opinion Simulation", "tldr": "\u8bba\u6587\u533a\u5206\u4e86\u7528\u8bed\u8a00\u6a21\u578b\u6a21\u62df\u6c11\u610f\u7684\u4e24\u7c7b\u4efb\u52a1\uff1a\u751f\u6210\u4e2a\u4f53\u56de\u7b54\u518d\u6c47\u603b\u7684\u201c\u4eff\u771f\u201d\uff0c\u4ee5\u53ca\u76f4\u63a5\u9884\u6d4b\u603b\u4f53\u5206\u5e03\u7684\u201c\u4f30\u8ba1\u201d\u3002\u5728 Pew \u8c03\u67e5\u6570\u636e\u4e0a\u8bc4\u4f30\u516d\u7ec4\u57fa\u5ea7\u4e0e\u540e\u8bad\u7ec3\u6a21\u578b\u540e\u53d1\u73b0\uff0c\u57fa\u5ea7\u6a21\u578b\u66f4\u64c5\u957f\u4fdd\u7559\u4eba\u7fa4\u5206\u5e03\u548c\u4eba\u53e3\u7edf\u8ba1\u7ed3\u6784\uff0c\u540e\u8bad\u7ec3\u6a21\u578b\u5219\u66f4\u64c5\u957f\u76f4\u63a5\u7ed9\u51fa\u51c6\u786e\u7684\u5206\u5e03\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Explaining the predictions of neural networks is a central challenge in trustworthy AI. Existing explanation methods, such as those based on feature attribution or minimal sufficient sets, typically treat input features as independent, which can yield misleading explanations when inputs exhibit structured dependencies. We address this by formalizing explanations as Halpern-Pearl (HP) actual causes, modeling input dependencies using Boolean Structural Causal Models (SCMs). We compute HP causes by applying bound propagation and branch-and-bound techniques, while providing formal guarantees of completeness and minimality. Our experiments show that we substantially outperform brute-force and ILP baselines in scalability, and outperform heuristic search as graph size grows, computing all minimal actual causes on instances with search spaces of up to $2.3\\times10^{13}$ candidate (cause, contingency) pairs, on SCMs with up to 28 nodes, within a 180s per-instance budget. In a case study, we further show that ignoring input dependencies inflates the number of reported causes, 14.9% of which are spurious under our SCM.", "arxiv_id": "2608.03772", "arxiv_url": "https://arxiv.org/abs/2608.03772", "authors": ["Jannick Strobel", "Muqsit Azeem", "Stefan Leue"], "brief": "\u8bba\u6587\u5c06\u795e\u7ecf\u7f51\u7edc\u9884\u6d4b\u89e3\u91ca\u5f62\u5f0f\u5316\u4e3a Halpern-Pearl \u5b9e\u9645\u539f\u56e0\uff0c\u5e76\u7528\u5e03\u5c14\u7ed3\u6784\u56e0\u679c\u6a21\u578b\u523b\u753b\u8f93\u5165\u7279\u5f81\u95f4\u7684\u4f9d\u8d56\u5173\u7cfb\u3002\u65b9\u6cd5\u7ed3\u5408\u8fb9\u754c\u4f20\u64ad\u4e0e\u5206\u652f\u5b9a\u754c\uff0c\u80fd\u5b8c\u6574\u4e14\u6700\u5c0f\u5730\u8ba1\u7b97\u6240\u6709\u5b9e\u9645\u539f\u56e0\uff0c\u5728\u5927\u89c4\u6a21\u641c\u7d22\u7a7a\u95f4\u4e0a\u663e\u8457\u4f18\u4e8e\u66b4\u529b\u3001ILP \u548c\u90e8\u5206\u542f\u53d1\u5f0f\u57fa\u7ebf\uff0c\u5e76\u53d1\u73b0\u5ffd\u7565\u4f9d\u8d56\u4f1a\u4ea7\u751f\u4e0d\u5c11\u4f2a\u539f\u56e0\u3002", "categories": ["cs.AI", "cs.LG", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03772", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u56e0\u679c\u63a8\u65ad", "\u795e\u7ecf\u7f51\u7edc", "\u5f62\u5f0f\u5316\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03772v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Computing Actual Causes for Neural Network Predictions under Structured Causal Inputs", "tldr": "\u8bba\u6587\u5c06\u795e\u7ecf\u7f51\u7edc\u9884\u6d4b\u89e3\u91ca\u5f62\u5f0f\u5316\u4e3a Halpern-Pearl \u5b9e\u9645\u539f\u56e0\uff0c\u5e76\u7528\u5e03\u5c14\u7ed3\u6784\u56e0\u679c\u6a21\u578b\u523b\u753b\u8f93\u5165\u7279\u5f81\u95f4\u7684\u4f9d\u8d56\u5173\u7cfb\u3002\u65b9\u6cd5\u7ed3\u5408\u8fb9\u754c\u4f20\u64ad\u4e0e\u5206\u652f\u5b9a\u754c\uff0c\u80fd\u5b8c\u6574\u4e14\u6700\u5c0f\u5730\u8ba1\u7b97\u6240\u6709\u5b9e\u9645\u539f\u56e0\uff0c\u5728\u5927\u89c4\u6a21\u641c\u7d22\u7a7a\u95f4\u4e0a\u663e\u8457\u4f18\u4e8e\u66b4\u529b\u3001ILP \u548c\u90e8\u5206\u542f\u53d1\u5f0f\u57fa\u7ebf\uff0c\u5e76\u53d1\u73b0\u5ffd\u7565\u4f9d\u8d56\u4f1a\u4ea7\u751f\u4e0d\u5c11\u4f2a\u539f\u56e0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Terminal User Interfaces (TUIs) combine the stateful, screen-oriented behaviour of GUIs with terminal deployment and are now common in developer tools. Yet they lack a dedicated testing methodology. We survey 197 real-world TUI applications: only 12% of test code exercises the interface, and 45% of those tests never send input, checking a static frame instead. We turn these applications into a headless benchmark spanning ratatui/Rust, bubbletea/Go, textual/Python, and ink/TypeScript, packaging each as an instrumented Docker image. We record line and widget coverage where reliable, rendered terminal states, and crashes. Under equal wall-clock budgets, we compare four frontier LLMs with random exploration. No model dominates. Random is a strong time-budgeted baseline, but its crash advantage comes from higher throughput: per interaction, LLM guidance is more efficient and uniquely reaches input-gated faults. Automatically deriving launch inputs yields the largest practical gain, enabling applications that otherwise never start. Line coverage poorly predicts crash discovery, weakening it as a proxy for test effectiveness. Automated TUI testing is feasible but far from solved, and honest baselines matter more than model choice. We release the coverage tool tuicov at https://github.com/tui-testing/tuicov and the testing framework tuibot at https://github.com/tui-testing/tuibot.", "arxiv_id": "2608.03743", "arxiv_url": "https://arxiv.org/abs/2608.03743", "authors": ["Chao Peng", "Ruida Hu", "Ajitha Rajan", "Tegawend\u00e9 F Bissyand\u00e9", "Jacques Klein", "Cuiyun Gao"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u771f\u5b9e\u7ec8\u7aef\u7528\u6237\u754c\u9762\uff08TUI\uff09\u81ea\u52a8\u5316\u6d4b\u8bd5\u57fa\u51c6\uff0c\u8986\u76d6 Rust\u3001Go\u3001Python\u3001TypeScript \u7b49\u751f\u6001\uff0c\u5e76\u6bd4\u8f83\u4e86\u56db\u4e2a\u524d\u6cbf\u5927\u6a21\u578b\u4e0e\u968f\u673a\u63a2\u7d22\u7684\u6d4b\u8bd5\u6548\u679c\u3002\u7ed3\u679c\u663e\u793a\u968f\u673a\u57fa\u7ebf\u5728\u65f6\u95f4\u9884\u7b97\u4e0b\u5f88\u5f3a\uff0c\u4f46\u4e3b\u8981\u53d7\u76ca\u4e8e\u66f4\u9ad8\u541e\u5410\uff1b\u6309\u5355\u6b21\u4ea4\u4e92\u770b\uff0cLLM \u5f15\u5bfc\u66f4\u9ad8\u6548\u4e14\u80fd\u53d1\u73b0\u9700\u8981\u8f93\u5165\u89e6\u53d1\u7684\u6545\u969c\uff0c\u540c\u65f6\u81ea\u52a8\u63a8\u5bfc\u542f\u52a8\u8f93\u5165\u5e26\u6765\u6700\u5927\u5b9e\u7528\u6536\u76ca\u3002", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03743", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03743v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Can LLMs Test Terminal User Interfaces?", "tldr": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u771f\u5b9e\u7ec8\u7aef\u7528\u6237\u754c\u9762\uff08TUI\uff09\u81ea\u52a8\u5316\u6d4b\u8bd5\u57fa\u51c6\uff0c\u8986\u76d6 Rust\u3001Go\u3001Python\u3001TypeScript \u7b49\u751f\u6001\uff0c\u5e76\u6bd4\u8f83\u4e86\u56db\u4e2a\u524d\u6cbf\u5927\u6a21\u578b\u4e0e\u968f\u673a\u63a2\u7d22\u7684\u6d4b\u8bd5\u6548\u679c\u3002\u7ed3\u679c\u663e\u793a\u968f\u673a\u57fa\u7ebf\u5728\u65f6\u95f4\u9884\u7b97\u4e0b\u5f88\u5f3a\uff0c\u4f46\u4e3b\u8981\u53d7\u76ca\u4e8e\u66f4\u9ad8\u541e\u5410\uff1b\u6309\u5355\u6b21\u4ea4\u4e92\u770b\uff0cLLM \u5f15\u5bfc\u66f4\u9ad8\u6548\u4e14\u80fd\u53d1\u73b0\u9700\u8981\u8f93\u5165\u89e6\u53d1\u7684\u6545\u969c\uff0c\u540c\u65f6\u81ea\u52a8\u63a8\u5bfc\u542f\u52a8\u8f93\u5165\u5e26\u6765\u6700\u5927\u5b9e\u7528\u6536\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mean-reverting dynamics are pervasive in finance, and the Cox--Ingersoll--Ross (CIR) process is a standard model for the time series they produce, from short rates to credit default swap (CDS) spreads. Yet CIR models capture only \\emph{correlated} co-movement, not \\emph{causal} influence between series, so they cannot answer the system\u0027s response when one series is externally shocked, which observational conditionals confound with historical co-movement. We make two contributions. First, an amortized model for distributional causal effect estimation that frames trajectories as time-stamped observations and predicts the calibrated multi-horizon shock response without retraining per scenario. Second, a causal multivariate CIR data-generating process that supplies the paired observational and interventional ground truth that real markets cannot. We instantiate and calibrate the framework on CDS spreads as a testbed. CIR-ACTIVA\u0027s validity is established on synthetic ground truth, independent of how well the simulator matches reality, while practical grounding is assessed by backtesting the generated traces against real CDS data. Against observational and amortized causal-inference baselines, CIR-ACTIVA leads on both causal selectivity in the joint distribution and horizon-resolved calibration, retaining its selectivity once the interventional law varies over the horizon, with gains concentrating at short horizons. This opens up a class of what-if queries on coupled spread systems, CDS stress testing among them, that observational forecasters cannot answer.", "arxiv_id": "2608.03715", "arxiv_url": "https://arxiv.org/abs/2608.03715", "authors": ["Andreas Sauter", "Sumit Sourabh", "Drona Kandhai", "Erman Acar"], "brief": "\u8bba\u6587\u63d0\u51fa CIR-ACTIVA\uff0c\u7528\u644a\u9500\u5f0f\u6a21\u578b\u4f30\u8ba1\u591a\u53d8\u91cf CIR \u5747\u503c\u56de\u590d\u8fc7\u7a0b\u4e2d\u7684\u5e72\u9884/\u51b2\u51fb\u54cd\u5e94\uff0c\u53ef\u5728\u4e0d\u540c\u60c5\u666f\u4e0b\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u5730\u9884\u6d4b\u591a\u671f\u9650\u5206\u5e03\u6548\u5e94\u3002\u4f5c\u8005\u6784\u5efa\u5e26\u56e0\u679c\u5e72\u9884\u771f\u503c\u7684\u591a\u53d8\u91cf CIR \u6570\u636e\u751f\u6210\u8fc7\u7a0b\uff0c\u5e76\u5728 CDS \u5229\u5dee\u4e0a\u9a8c\u8bc1\uff0c\u76f8\u6bd4\u89c2\u6d4b\u9884\u6d4b\u548c\u56e0\u679c\u63a8\u65ad\u57fa\u7ebf\u5728\u77ed\u671f\u51b2\u51fb\u54cd\u5e94\u6821\u51c6\u4e0e\u56e0\u679c\u9009\u62e9\u6027\u4e0a\u66f4\u597d\u3002", "categories": ["cs.LG", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03715", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u65f6\u95f4\u5e8f\u5217", "\u91d1\u878d\u5efa\u6a21", "\u644a\u9500\u63a8\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03715v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Amortized Interventional Forecasting for Multivariate CIR Processes", "tldr": "\u8bba\u6587\u63d0\u51fa CIR-ACTIVA\uff0c\u7528\u644a\u9500\u5f0f\u6a21\u578b\u4f30\u8ba1\u591a\u53d8\u91cf CIR \u5747\u503c\u56de\u590d\u8fc7\u7a0b\u4e2d\u7684\u5e72\u9884/\u51b2\u51fb\u54cd\u5e94\uff0c\u53ef\u5728\u4e0d\u540c\u60c5\u666f\u4e0b\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u5730\u9884\u6d4b\u591a\u671f\u9650\u5206\u5e03\u6548\u5e94\u3002\u4f5c\u8005\u6784\u5efa\u5e26\u56e0\u679c\u5e72\u9884\u771f\u503c\u7684\u591a\u53d8\u91cf CIR \u6570\u636e\u751f\u6210\u8fc7\u7a0b\uff0c\u5e76\u5728 CDS \u5229\u5dee\u4e0a\u9a8c\u8bc1\uff0c\u76f8\u6bd4\u89c2\u6d4b\u9884\u6d4b\u548c\u56e0\u679c\u63a8\u65ad\u57fa\u7ebf\u5728\u77ed\u671f\u51b2\u51fb\u54cd\u5e94\u6821\u51c6\u4e0e\u56e0\u679c\u9009\u62e9\u6027\u4e0a\u66f4\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In human visual perception, uppercase lettering serves as a natural salience cue that captures attention within lowercase text. In this paper, we present a systematic empirical characterization study revealing that Large Language Models (LLMs) exhibit an analogous property: letter casing modulates internal attention allocation. Through analysis across 13 models, nine LLMs and four Vision-Language Models (VLMs), with diverse tokenization schemes, we show that formatting target information in alternating or uppercase against a lowercase context concentrates attention on those textual spans. In text this effect is universal, holding across every evaluated non-reasoning model. We frame it as a previously under-explored latent property of pretrained transformers rather than a prescriptive method. Our investigation reveals a central attention-performance divergence: while this \"casing effect\" robustly shifts attention, its impact on downstream accuracy is non-trivial, increased concentration does not inherently improve task accuracy and, in high-entropy contexts like alternating case, can degrade it. We further identify a boundary condition: the deliberative \"thinking\" phase in reasoning models acts as a semantic buffer that mitigates typographic sensitivity in text. Extending the study to VLMs, we find the effect transfers partially: the same prompt-side casing reorganizes cross-modal attention along two coupled axes, predominantly a macroscopic disengagement from the image toward the text prompt, and secondarily a concentration of the residual visual attention on the target region. By isolating casing as a zero-shot mechanism for attention steering that requires no model access or fine-tuning, we provide a new foundational understanding of how pretraining internalizes typographic emphasis.", "arxiv_id": "2608.03711", "arxiv_url": "https://arxiv.org/abs/2608.03711", "authors": ["Maximilian Dillitzer", "Tin Stribor Sohn", "Jason J. Corso", "Michael Auerbach"], "brief": "\u8fd9\u7bc7\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5927\u5c0f\u5199\u683c\u5f0f\u5bf9\u5927\u8bed\u8a00\u6a21\u578b\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u6ce8\u610f\u529b\u7684\u5f71\u54cd\uff0c\u53d1\u73b0\u5927\u5199\u6216\u4ea4\u66ff\u5927\u5c0f\u5199\u4f1a\u663e\u8457\u628a\u6ce8\u610f\u529b\u96c6\u4e2d\u5230\u5bf9\u5e94\u6587\u672c\u7247\u6bb5\u4e0a\u3002\u8be5\u6548\u5e94\u4e0d\u4e00\u5b9a\u63d0\u5347\u4e0b\u6e38\u51c6\u786e\u7387\uff0c\u751a\u81f3\u5728\u9ad8\u71b5\u683c\u5f0f\u4e0b\u53ef\u80fd\u635f\u5bb3\u6027\u80fd\uff1b\u63a8\u7406\u6a21\u578b\u7684\u201c\u601d\u8003\u201d\u9636\u6bb5\u80fd\u7f13\u51b2\u8fd9\u79cd\u6392\u7248\u654f\u611f\u6027\uff0cVLM\u4e2d\u5219\u4f1a\u5f15\u5bfc\u6ce8\u610f\u529b\u4ece\u56fe\u50cf\u8f6c\u5411\u6587\u672c\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03711", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6ce8\u610f\u529b\u673a\u5236", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u63d0\u793a\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03711v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Attention is Case-Sensitive", "tldr": "\u8fd9\u7bc7\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5927\u5c0f\u5199\u683c\u5f0f\u5bf9\u5927\u8bed\u8a00\u6a21\u578b\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u6ce8\u610f\u529b\u7684\u5f71\u54cd\uff0c\u53d1\u73b0\u5927\u5199\u6216\u4ea4\u66ff\u5927\u5c0f\u5199\u4f1a\u663e\u8457\u628a\u6ce8\u610f\u529b\u96c6\u4e2d\u5230\u5bf9\u5e94\u6587\u672c\u7247\u6bb5\u4e0a\u3002\u8be5\u6548\u5e94\u4e0d\u4e00\u5b9a\u63d0\u5347\u4e0b\u6e38\u51c6\u786e\u7387\uff0c\u751a\u81f3\u5728\u9ad8\u71b5\u683c\u5f0f\u4e0b\u53ef\u80fd\u635f\u5bb3\u6027\u80fd\uff1b\u63a8\u7406\u6a21\u578b\u7684\u201c\u601d\u8003\u201d\u9636\u6bb5\u80fd\u7f13\u51b2\u8fd9\u79cd\u6392\u7248\u654f\u611f\u6027\uff0cVLM\u4e2d\u5219\u4f1a\u5f15\u5bfc\u6ce8\u610f\u529b\u4ece\u56fe\u50cf\u8f6c\u5411\u6587\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Statistical learning is a fascinating field that has long been the mainstream of machine learning/artificial intelligence. A large number of results have been produced which can be widely applied to real-world problems. It also leads to many research topics and also stimulates new research. This report summarizes some classical statistical learning models and well-known algorithms, especially for amateurs, and provides a category-theoretic perspective on understanding statistical learning models. The aim is to attract researchers from other fields, including basic mathematics, to participate in the research related to statistical learning.", "arxiv_id": "2608.03706", "arxiv_url": "https://arxiv.org/abs/2608.03706", "authors": ["Congwei Song"], "brief": "\u672c\u6587\u7efc\u8ff0\u7ecf\u5178\u7edf\u8ba1\u5b66\u4e60\u6a21\u578b\u4e0e\u5e38\u89c1\u7b97\u6cd5\uff0c\u5e76\u5c1d\u8bd5\u7528\u8303\u7574\u8bba\u8bed\u8a00\u6765\u63cf\u8ff0\u548c\u7406\u89e3\u8fd9\u4e9b\u6a21\u578b\u3002\u4e3b\u8981\u9762\u5411\u5165\u95e8\u8005\u548c\u8de8\u9886\u57df\u7814\u7a76\u8005\uff0c\u8d21\u732e\u504f\u79d1\u666e\u4e0e\u6982\u5ff5\u6846\u67b6\uff0c\u5b9e\u9645\u7b97\u6cd5\u6216\u5b9e\u9a8c\u6548\u679c\u6709\u9650\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03706", "impact_score": 2, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7edf\u8ba1\u5b66\u4e60", "\u8303\u7574\u8bba", "\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03706v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "To Describe or Construct Statistical Learning Models Using the Category-theoretical Language", "tldr": "\u672c\u6587\u7efc\u8ff0\u7ecf\u5178\u7edf\u8ba1\u5b66\u4e60\u6a21\u578b\u4e0e\u5e38\u89c1\u7b97\u6cd5\uff0c\u5e76\u5c1d\u8bd5\u7528\u8303\u7574\u8bba\u8bed\u8a00\u6765\u63cf\u8ff0\u548c\u7406\u89e3\u8fd9\u4e9b\u6a21\u578b\u3002\u4e3b\u8981\u9762\u5411\u5165\u95e8\u8005\u548c\u8de8\u9886\u57df\u7814\u7a76\u8005\uff0c\u8d21\u732e\u504f\u79d1\u666e\u4e0e\u6982\u5ff5\u6846\u67b6\uff0c\u5b9e\u9645\u7b97\u6cd5\u6216\u5b9e\u9a8c\u6548\u679c\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-time bidding (RTB) ad exchanges typically forward nearly all incoming requests to demand-side platforms (DSPs), even though only a small fraction receive bids. This over-distribution weakens auction outcomes: DSPs throttle participation under compute and budget constraints, reducing the effective use of limited bidding capacity. We present a competition-aware request dispatch framework that uses distributional bid prediction and probabilistic forwarding to decide whether each request should be sent to each DSP. The system adapts per-DSP thresholds over time through lightweight policy optimization to track non-stationary market conditions. We evaluate the framework through four sequential online experiments on a production platform serving over 20 billion daily requests. A full multi-DSP deployment reduces DSP request volume under the policy by 34.2% while increasing net revenue by 4.6% (p\u003c0.001) in a recent 14-day window after an initial DSP adaptation period. Further analysis highlights strong heterogeneity across traffic segments and reveals that aggregate metrics can be misleading. Segment-level and per-DSP analyses suggest that the policy surfaces comparative advantages among DSPs, improving monetized outcomes without increasing overall request volume.", "arxiv_id": "2608.03705", "arxiv_url": "https://arxiv.org/abs/2608.03705", "authors": ["Jonaid Shianifar", "Blaz Mramor", "Fangda Zou", "Matthieu C. Martin", "Xingsheng Guo", "Zhihua Zhu", "Rong Zhou", "Bichen Shi"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u5b9e\u65f6\u5e7f\u544a\u4ea4\u6613\u7684\u7ade\u4e89\u611f\u77e5\u8bf7\u6c42\u5206\u53d1\u6846\u67b6\uff0c\u7528\u5206\u5e03\u5f0f\u51fa\u4ef7\u9884\u6d4b\u548c\u6982\u7387\u8f6c\u53d1\u51b3\u5b9a\u662f\u5426\u628a\u6bcf\u4e2a\u8bf7\u6c42\u53d1\u9001\u7ed9\u5404\u4e2aDSP\uff0c\u5e76\u901a\u8fc7\u8f7b\u91cf\u7b56\u7565\u4f18\u5316\u52a8\u6001\u8c03\u6574\u9608\u503c\u3002\u751f\u4ea7\u5e73\u53f0\u7684\u591a\u8f6e\u5728\u7ebf\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u5728\u51cf\u5c1134.2% DSP\u8bf7\u6c42\u91cf\u7684\u540c\u65f6\uff0c\u5c06\u51c0\u6536\u5165\u63d0\u53474.6%\uff0c\u4e14\u63ed\u793a\u4e86\u6d41\u91cf\u5206\u6bb5\u548cDSP\u95f4\u5dee\u5f02\u7684\u91cd\u8981\u6027\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03705", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5e7f\u544a\u7ade\u4ef7", "\u8bf7\u6c42\u5206\u53d1", "\u7b56\u7565\u4f18\u5316", "\u5728\u7ebf\u5b9e\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03705v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Less Traffic, Better Outcomes: Competition-Aware Request Dispatch in Real-Time Ad Exchanges", "tldr": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u5b9e\u65f6\u5e7f\u544a\u4ea4\u6613\u7684\u7ade\u4e89\u611f\u77e5\u8bf7\u6c42\u5206\u53d1\u6846\u67b6\uff0c\u7528\u5206\u5e03\u5f0f\u51fa\u4ef7\u9884\u6d4b\u548c\u6982\u7387\u8f6c\u53d1\u51b3\u5b9a\u662f\u5426\u628a\u6bcf\u4e2a\u8bf7\u6c42\u53d1\u9001\u7ed9\u5404\u4e2aDSP\uff0c\u5e76\u901a\u8fc7\u8f7b\u91cf\u7b56\u7565\u4f18\u5316\u52a8\u6001\u8c03\u6574\u9608\u503c\u3002\u751f\u4ea7\u5e73\u53f0\u7684\u591a\u8f6e\u5728\u7ebf\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u5728\u51cf\u5c1134.2% DSP\u8bf7\u6c42\u91cf\u7684\u540c\u65f6\uff0c\u5c06\u51c0\u6536\u5165\u63d0\u53474.6%\uff0c\u4e14\u63ed\u793a\u4e86\u6d41\u91cf\u5206\u6bb5\u548cDSP\u95f4\u5dee\u5f02\u7684\u91cd\u8981\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This work focuses on the problem of learning on temporal graphs, with particular emphasis on the task of clustering: obtaining coarse-grained representations by aggregating information from nodes, edges, and temporal dynamics - a task related to pooling in machine learning on graphs, or community detection in network science. Although graph neural networks reach state-of-the-art performance across many downstream graph tasks, their advantage over established descriptive and inferential clustering algorithms is far less settled, especially under demands of efficiency and recovery accuracy. We frame this tension through three linked perspectives: principles, connecting graph learning and community detection through shared spectral foundations and detectability thresholds in stochastic block model regimes; primitives, making spectral clustering and multislice modularity optimization tractable through GPU-accelerated temporal backends; and pooling, viewing principled community detection as a theory-grounded coarse-graining operator for temporal graphs. Our results indicate that algorithmic methods remain the appropriate tool where attributes are absent or weak - scalability rather than accuracy being the binding obstacle - while neural models are most compelling when structural, temporal, and attribute signals align. By making temporal clustering scalable, GPU-accelerated primitives suggest a route toward theory-grounded pooling, while raising a central question: when does community-based coarse-graining preserve the dynamics needed for downstream learning tasks?", "arxiv_id": "2608.03696", "arxiv_url": "https://arxiv.org/abs/2608.03696", "authors": ["Nelson Aloysio Reis de Almeida Passos", "Emanuele Carlini", "Salvatore Trani"], "brief": "\u672c\u6587\u4ece\u539f\u5219\u3001\u57fa\u7840\u7b97\u5b50\u548c\u6c60\u5316\u4e09\u4e2a\u89d2\u5ea6\u68b3\u7406\u65f6\u95f4\u56fe\u4e0a\u7684\u5b66\u4e60\u4e0e\u805a\u7c7b\uff0c\u8fde\u63a5\u8c31\u805a\u7c7b\u3001\u968f\u673a\u5757\u6a21\u578b\u53ef\u68c0\u6d4b\u6027\u3001\u591a\u5c42\u6a21\u5757\u5ea6\u4f18\u5316\u4e0e\u56fe\u795e\u7ecf\u7f51\u7edc\u6c60\u5316\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5728\u5c5e\u6027\u7f3a\u5931\u6216\u8f83\u5f31\u65f6\u4f20\u7edf\u805a\u7c7b/\u793e\u533a\u53d1\u73b0\u65b9\u6cd5\u4ecd\u66f4\u5408\u9002\uff0c\u74f6\u9888\u4e3b\u8981\u662f\u53ef\u6269\u5c55\u6027\uff1bGPU \u52a0\u901f\u7684\u65f6\u95f4\u56fe\u805a\u7c7b\u7b97\u5b50\u4e3a\u7406\u8bba\u9a71\u52a8\u7684\u7c97\u7c92\u5316\u6c60\u5316\u63d0\u4f9b\u4e86\u8def\u5f84\u3002", "categories": ["cs.LG", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03696", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u56fe", "\u56fe\u5b66\u4e60", "\u793e\u533a\u53d1\u73b0", "\u8c31\u805a\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03696v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning and Clustering on Temporal Graphs: Principles, Primitives, and Pooling", "tldr": "\u672c\u6587\u4ece\u539f\u5219\u3001\u57fa\u7840\u7b97\u5b50\u548c\u6c60\u5316\u4e09\u4e2a\u89d2\u5ea6\u68b3\u7406\u65f6\u95f4\u56fe\u4e0a\u7684\u5b66\u4e60\u4e0e\u805a\u7c7b\uff0c\u8fde\u63a5\u8c31\u805a\u7c7b\u3001\u968f\u673a\u5757\u6a21\u578b\u53ef\u68c0\u6d4b\u6027\u3001\u591a\u5c42\u6a21\u5757\u5ea6\u4f18\u5316\u4e0e\u56fe\u795e\u7ecf\u7f51\u7edc\u6c60\u5316\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5728\u5c5e\u6027\u7f3a\u5931\u6216\u8f83\u5f31\u65f6\u4f20\u7edf\u805a\u7c7b/\u793e\u533a\u53d1\u73b0\u65b9\u6cd5\u4ecd\u66f4\u5408\u9002\uff0c\u74f6\u9888\u4e3b\u8981\u662f\u53ef\u6269\u5c55\u6027\uff1bGPU \u52a0\u901f\u7684\u65f6\u95f4\u56fe\u805a\u7c7b\u7b97\u5b50\u4e3a\u7406\u8bba\u9a71\u52a8\u7684\u7c97\u7c92\u5316\u6c60\u5316\u63d0\u4f9b\u4e86\u8def\u5f84\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This work addresses community detection in temporal networks through GPU-accelerated extensions of spectral clustering and modularity-based algorithms originally designed for static graphs. Built on the NVIDIA RAPIDS ecosystem, the framework enables the characterization and tracking of communities in snapshot-based dynamic graphs, either by Leiden greedy optimization with multi-GPU support via Dask-based workload distribution, or eigendecomposition of a symmetric Bethe-Hessian operator. Our multislice modularity backend achieves up to roughly three orders of magnitude speedup over the CPU reference under an equal-work budget, depending on graph density and snapshot count, while preserving compatibility with existing graph analytics pipelines. We demonstrate its applicability on real-world and synthetic datasets, facilitating exploratory analysis of structural network properties over time. Such capabilities are relevant across several application domains, such as epidemic spreading, financial systems, cybersecurity, and trajectory and mobility analysis. We release our implementation as free and open-source software, including Python bindings through the NetworkX-Temporal library for ease of use and zero-code acceleration with existing codebases.", "arxiv_id": "2608.03695", "arxiv_url": "https://arxiv.org/abs/2608.03695", "authors": ["Nelson Aloysio Reis de Almeida Passos", "Emanuele Carlini", "Salvatore Trani"], "brief": "\u672c\u6587\u5c06\u8c31\u805a\u7c7b\u548c\u57fa\u4e8e\u6a21\u5757\u5ea6\u7684\u793e\u533a\u53d1\u73b0\u6269\u5c55\u5230\u5feb\u7167\u5f0f\u52a8\u6001\u56fe\uff0c\u5e76\u57fa\u4e8e NVIDIA RAPIDS/cuGraph \u5b9e\u73b0 GPU \u52a0\u901f\u3002\u5176\u591a\u5207\u7247\u6a21\u5757\u5ea6\u540e\u7aef\u5728\u76f8\u540c\u5de5\u4f5c\u91cf\u4e0b\u76f8\u6bd4 CPU \u53c2\u8003\u5b9e\u73b0\u6700\u9ad8\u53ef\u8fbe\u7ea6\u4e09\u6570\u91cf\u7ea7\u52a0\u901f\uff0c\u5e76\u652f\u6301\u591a GPU \u4e0e NetworkX-Temporal/Python \u7ed1\u5b9a\uff0c\u4fbf\u4e8e\u52a8\u6001\u56fe\u793e\u533a\u8ddf\u8e2a\u4e0e\u5206\u6790\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03695", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u8ba1\u7b97", "\u52a8\u6001\u56fe\u805a\u7c7b", "GPU\u52a0\u901f", "\u793e\u533a\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03695v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Accelerating Dynamic Graph Clustering on GPU Architectures with cuGraph", "tldr": "\u672c\u6587\u5c06\u8c31\u805a\u7c7b\u548c\u57fa\u4e8e\u6a21\u5757\u5ea6\u7684\u793e\u533a\u53d1\u73b0\u6269\u5c55\u5230\u5feb\u7167\u5f0f\u52a8\u6001\u56fe\uff0c\u5e76\u57fa\u4e8e NVIDIA RAPIDS/cuGraph \u5b9e\u73b0 GPU \u52a0\u901f\u3002\u5176\u591a\u5207\u7247\u6a21\u5757\u5ea6\u540e\u7aef\u5728\u76f8\u540c\u5de5\u4f5c\u91cf\u4e0b\u76f8\u6bd4 CPU \u53c2\u8003\u5b9e\u73b0\u6700\u9ad8\u53ef\u8fbe\u7ea6\u4e09\u6570\u91cf\u7ea7\u52a0\u901f\uff0c\u5e76\u652f\u6301\u591a GPU \u4e0e NetworkX-Temporal/Python \u7ed1\u5b9a\uff0c\u4fbf\u4e8e\u52a8\u6001\u56fe\u793e\u533a\u8ddf\u8e2a\u4e0e\u5206\u6790\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Point-of-care cardiac devices such as smartwatches and handheld ECG recorders typically capture 1--2 leads, yet existing ECG foundation models are architecturally constrained to fixed 12-lead inputs, degrading or failing under these reduced configurations. We introduce LAEF (Lead-Agnostic ECG Foundation), a 7M-parameter ECG foundation model that can natively process any lead subset without zero-padding or architectural modification. LAEF represents ECGs as variable-size spatiotemporal graphs with physiologically motivated intra- and inter-lead connectivity, processed by a Graph Attention Network that scales naturally with active lead count.Pre-trained on 9.2M 12-lead ECGs via masked node modelling with stochastic lead sampling, LAEF learns representations robust to lead configuration. Across 18 downstream datasets, LAEF is on par with specialized 12-lead baselines over 12$\\times$ larger at full lead availability. Under direct point-of-care-oriented diagnostics (1--2 leads), it outperforms all zero-padded alternatives on 17 out of 18 datasets with with a single randomly sampled lead and on 14 out of 18 with 2 leads, with an average AUROC gain of +3.2 points. Representation analysis links this advantage to architectural lead-agnosticism, and a lead-importance study across 164 cardiovascular conditions shows population-level performance is stable across single standard input leads while still recovering established clinically lead-condition associations.", "arxiv_id": "2608.03690", "arxiv_url": "https://arxiv.org/abs/2608.03690", "authors": ["Edoardo Coppola", "Stefano Fiorini", "Pietro Li\u00f2", "Mattia Savardi", "Alberto Signoroni"], "brief": "\u63d0\u51fa LAEF\uff0c\u4e00\u79cd\u4e0d\u4f9d\u8d56\u56fa\u5b9a\u5bfc\u8054\u6570\u7684 ECG \u57fa\u7840\u6a21\u578b\uff0c\u5c06\u5fc3\u7535\u4fe1\u53f7\u8868\u793a\u4e3a\u53ef\u53d8\u5927\u5c0f\u7684\u65f6\u7a7a\u56fe\uff0c\u5e76\u7528\u56fe\u6ce8\u610f\u529b\u7f51\u7edc\u5904\u7406\u4efb\u610f\u5bfc\u8054\u5b50\u96c6\u3002\u6a21\u578b\u5728 920 \u4e07\u4efd 12 \u5bfc\u8054 ECG \u4e0a\u9884\u8bad\u7ec3\uff0c\u5728 1\u20132 \u5bfc\u8054\u7684\u5e8a\u65c1\u8bca\u65ad\u573a\u666f\u4e2d\u663e\u8457\u4f18\u4e8e\u96f6\u586b\u5145\u65b9\u6848\uff0c\u5e73\u5747 AUROC \u63d0\u5347\u7ea6 3.2 \u4e2a\u70b9\uff0c\u540c\u65f6\u5728\u5b8c\u6574 12 \u5bfc\u8054\u4e0b\u63a5\u8fd1\u66f4\u5927\u4e13\u7528\u6a21\u578b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03690", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5fc3\u7535\u56fe", "\u57fa\u7840\u6a21\u578b", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u533b\u7597\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03690v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LAEF: A Lead-Agnostic ECG Foundation Model Towards Point-of-Care Diagnostics", "tldr": "\u63d0\u51fa LAEF\uff0c\u4e00\u79cd\u4e0d\u4f9d\u8d56\u56fa\u5b9a\u5bfc\u8054\u6570\u7684 ECG \u57fa\u7840\u6a21\u578b\uff0c\u5c06\u5fc3\u7535\u4fe1\u53f7\u8868\u793a\u4e3a\u53ef\u53d8\u5927\u5c0f\u7684\u65f6\u7a7a\u56fe\uff0c\u5e76\u7528\u56fe\u6ce8\u610f\u529b\u7f51\u7edc\u5904\u7406\u4efb\u610f\u5bfc\u8054\u5b50\u96c6\u3002\u6a21\u578b\u5728 920 \u4e07\u4efd 12 \u5bfc\u8054 ECG \u4e0a\u9884\u8bad\u7ec3\uff0c\u5728 1\u20132 \u5bfc\u8054\u7684\u5e8a\u65c1\u8bca\u65ad\u573a\u666f\u4e2d\u663e\u8457\u4f18\u4e8e\u96f6\u586b\u5145\u65b9\u6848\uff0c\u5e73\u5747 AUROC \u63d0\u5347\u7ea6 3.2 \u4e2a\u70b9\uff0c\u540c\u65f6\u5728\u5b8c\u6574 12 \u5bfc\u8054\u4e0b\u63a5\u8fd1\u66f4\u5927\u4e13\u7528\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Causal diagnostic models must explain how conclusions follow from evidence because diagnoses guide repairs and treatments. Yet serious cases are scarce, records rarely contain reasoning paths, and data transfer poorly across configurations, complicating local deployment. We present DiagLoop, a counterfactual data flywheel that converts codified physical relations or clinical guidelines, authored once per mechanism family, into training supervision beyond recorded cases. A training-only teacher proposes counterfactual worlds by varying causes, contexts, and observations, while an independent hybrid checker admits only valid worlds. The student reasons through symptom abstraction, causal-chain construction, and root-cause attribution. Stage-specific criteria identify its earliest failure. For nonterminal failures, a bounded repair probes downstream competence, and the resulting weakness profile guides subsequent data generation. Stage-localized reinforcement learning updates only the model-generated continuation, while replay and preservation reduce forgetting. The same criteria govern admission, attribution, reward, and regeneration through checks separate from the proposer. Using only synthesized scenarios and no case-level expert reasoning annotations, the resulting 8B model improves strict path correctness over the strongest conventional baseline. Gains are 11.6 points across eight industrial systems and 5.5 points across ten disease categories. Gains over a deranged-routing control are 3.9 and 2.3 points, respectively. The model also exceeds the evaluated proprietary references in both domains, even when they receive few-shot examples or the specification in context.", "arxiv_id": "2608.03674", "arxiv_url": "https://arxiv.org/abs/2608.03674", "authors": ["Jian Zhang", "Bingyi Wang", "Yizhi Liu"], "brief": "DiagLoop \u63d0\u51fa\u4e00\u79cd\u53cd\u4e8b\u5b9e\u6570\u636e\u98de\u8f6e\uff0c\u5c06\u7269\u7406\u5173\u7cfb\u6216\u4e34\u5e8a\u6307\u5357\u8f6c\u5316\u4e3a\u8bca\u65ad LLM \u7684\u5408\u6210\u8bad\u7ec3\u76d1\u7763\uff0c\u5e76\u7528\u72ec\u7acb\u68c0\u67e5\u5668\u7b5b\u9009\u6709\u6548\u53cd\u4e8b\u5b9e\u573a\u666f\u3002\u5b83\u901a\u8fc7\u9636\u6bb5\u5b9a\u4f4d\u7684\u5f3a\u5316\u5b66\u4e60\u9488\u5bf9\u75c7\u72b6\u62bd\u8c61\u3001\u56e0\u679c\u94fe\u6784\u5efa\u548c\u6839\u56e0\u5f52\u56e0\u4e2d\u7684\u65e9\u671f\u5931\u8d25\u8fdb\u884c\u66f4\u65b0\uff0c\u5728\u5de5\u4e1a\u7cfb\u7edf\u548c\u75be\u75c5\u8bca\u65ad\u4efb\u52a1\u4e0a\u663e\u8457\u63d0\u5347\u4e25\u683c\u8def\u5f84\u6b63\u786e\u7387\uff0c\u5e76\u8d85\u8fc7\u591a\u79cd\u5e38\u89c4\u4e0e\u4e13\u6709\u6a21\u578b\u57fa\u7ebf\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03674", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u56e0\u679c\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u5408\u6210\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03674v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DiagLoop: A Counterfactual Data Flywheel with Stage-Localized Reinforcement for Diagnostic LLMs", "tldr": "DiagLoop \u63d0\u51fa\u4e00\u79cd\u53cd\u4e8b\u5b9e\u6570\u636e\u98de\u8f6e\uff0c\u5c06\u7269\u7406\u5173\u7cfb\u6216\u4e34\u5e8a\u6307\u5357\u8f6c\u5316\u4e3a\u8bca\u65ad LLM \u7684\u5408\u6210\u8bad\u7ec3\u76d1\u7763\uff0c\u5e76\u7528\u72ec\u7acb\u68c0\u67e5\u5668\u7b5b\u9009\u6709\u6548\u53cd\u4e8b\u5b9e\u573a\u666f\u3002\u5b83\u901a\u8fc7\u9636\u6bb5\u5b9a\u4f4d\u7684\u5f3a\u5316\u5b66\u4e60\u9488\u5bf9\u75c7\u72b6\u62bd\u8c61\u3001\u56e0\u679c\u94fe\u6784\u5efa\u548c\u6839\u56e0\u5f52\u56e0\u4e2d\u7684\u65e9\u671f\u5931\u8d25\u8fdb\u884c\u66f4\u65b0\uff0c\u5728\u5de5\u4e1a\u7cfb\u7edf\u548c\u75be\u75c5\u8bca\u65ad\u4efb\u52a1\u4e0a\u663e\u8457\u63d0\u5347\u4e25\u683c\u8def\u5f84\u6b63\u786e\u7387\uff0c\u5e76\u8d85\u8fc7\u591a\u79cd\u5e38\u89c4\u4e0e\u4e13\u6709\u6a21\u578b\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many critical reasoning tasks, including clinical diagnosis, legal judgment, and industrial fault diagnosis, require step-dependent causal chains in which early errors propagate and correct conclusions can mask invalid reasoning. Although large language models perform well on such tasks, privacy, latency, and controllability motivate distillation into locally deployable models. Standard trajectory imitation does not correct process errors on the student\u0027s own rollout distribution. We propose CausalOPD, a curriculum online process distillation framework. A knowledge-augmented teacher first provides trajectories grounded in domain-specific causal rules, entity relations, and structural constraints. The student then generates on-policy trajectories, and the teacher identifies the first wrong step, defined as the earliest transition that verifiably violates available constraints. Starting from the verified prefix, short-horizon reinforcement learning repairs this localized failure. A causal-stage curriculum advances from evidence-level to mechanism-level and conclusion-level errors, following their propagation order. Across three domains, CausalOPD improves average path correctness by 23.4 percentage points over sequence-level online process distillation and reduces the right-label-wrong-reasoning rate from 15.7% to 4.4%. The domain-specific 8B students also surpass both evaluated proprietary references in path correctness across all domains.", "arxiv_id": "2608.03673", "arxiv_url": "https://arxiv.org/abs/2608.03673", "authors": ["Jian Zhang", "Bingyi Wang", "Yizhi Liu"], "brief": "\u63d0\u51fa CausalOPD\uff0c\u4e00\u79cd\u9762\u5411\u56e0\u679c\u94fe\u63a8\u7406\u7684\u5728\u7ebf\u8fc7\u7a0b\u84b8\u998f\u6846\u67b6\uff1a\u6559\u5e08\u57fa\u4e8e\u9886\u57df\u56e0\u679c\u89c4\u5219\u6807\u6ce8\u5b66\u751f\u8f68\u8ff9\u4e2d\u7684\u201c\u7b2c\u4e00\u4e2a\u9519\u8bef\u6b65\u9aa4\u201d\uff0c\u518d\u7528\u77ed\u7a0b\u5f3a\u5316\u5b66\u4e60\u5c40\u90e8\u4fee\u590d\u3002\u4e09\u5927\u9886\u57df\u5b9e\u9a8c\u4e2d\uff0c\u5e73\u5747\u8def\u5f84\u6b63\u786e\u7387\u8f83\u5e8f\u5217\u7ea7\u5728\u7ebf\u8fc7\u7a0b\u84b8\u998f\u63d0\u5347 23.4 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u201c\u7b54\u6848\u5bf9\u4f46\u63a8\u7406\u9519\u201d\u7684\u6bd4\u4f8b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03673", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56e0\u679c\u63a8\u7406", "\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03673v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CausalOPD: First-Wrong-Step Supervision for Distilling Causal Chain Reasoning", "tldr": "\u63d0\u51fa CausalOPD\uff0c\u4e00\u79cd\u9762\u5411\u56e0\u679c\u94fe\u63a8\u7406\u7684\u5728\u7ebf\u8fc7\u7a0b\u84b8\u998f\u6846\u67b6\uff1a\u6559\u5e08\u57fa\u4e8e\u9886\u57df\u56e0\u679c\u89c4\u5219\u6807\u6ce8\u5b66\u751f\u8f68\u8ff9\u4e2d\u7684\u201c\u7b2c\u4e00\u4e2a\u9519\u8bef\u6b65\u9aa4\u201d\uff0c\u518d\u7528\u77ed\u7a0b\u5f3a\u5316\u5b66\u4e60\u5c40\u90e8\u4fee\u590d\u3002\u4e09\u5927\u9886\u57df\u5b9e\u9a8c\u4e2d\uff0c\u5e73\u5747\u8def\u5f84\u6b63\u786e\u7387\u8f83\u5e8f\u5217\u7ea7\u5728\u7ebf\u8fc7\u7a0b\u84b8\u998f\u63d0\u5347 23.4 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u201c\u7b54\u6848\u5bf9\u4f46\u63a8\u7406\u9519\u201d\u7684\u6bd4\u4f8b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Out-of-distribution (OOD) recommendation is vulnerable to preference shifts induced by a latent environment. Existing methods can infer latent states from logged interactions, yet the statistical meaning of the latent environment and its effect on preference remain underdetermined. We formulate this task as conditionally identifiable risk-aware recommendation (CI-RR) and propose Conditionally Identifiable Latent-Environment Recommendation (CILER). CILER uses a user-conditioned exponential family to model the latent environment and a feature-indexed polynomial to specify how it changes preference. It predicts by marginalizing item probabilities over the inferred environment distribution. Under sufficient variation, correct specification, and decoder regularity, CILER identifies the environment-sensitive representation up to the stated equivalence class. We further bound excess deployment log-risk by environment-inference error. Controlled studies test the observable consequences of sufficient variation and model specification. Experiments on three datasets show that CILER improves all twelve OOD ranking metrics under feature, temporal, and geographical shifts within shared support.", "arxiv_id": "2608.03647", "arxiv_url": "https://arxiv.org/abs/2608.03647", "authors": ["Qianqian Wang", "Wenwu Gong", "Yunshan Li", "Zhenqing Wu", "Ruili Wang", "Lili Yang"], "brief": "\u672c\u6587\u63d0\u51fa CILER\uff0c\u7528\u6761\u4ef6\u53ef\u8bc6\u522b\u7684\u6f5c\u5728\u73af\u5883\u5efa\u6a21\u6765\u5904\u7406\u5206\u5e03\u5916\u63a8\u8350\u4e2d\u7684\u504f\u597d\u6f02\u79fb\u95ee\u9898\uff0c\u663e\u5f0f\u523b\u753b\u6f5c\u5728\u73af\u5883\u53ca\u5176\u5bf9\u7528\u6237\u504f\u597d\u7684\u5f71\u54cd\u3002\u7406\u8bba\u4e0a\u7ed9\u51fa\u53ef\u8bc6\u522b\u6027\u6761\u4ef6\u548c\u90e8\u7f72\u98ce\u9669\u754c\uff0c\u5b9e\u9a8c\u5728\u7279\u5f81\u3001\u65f6\u95f4\u3001\u5730\u7406\u504f\u79fb\u4e0b\u63d0\u5347\u4e86\u4e09\u4e2a\u6570\u636e\u96c6\u7684\u5168\u90e8 12 \u4e2a OOD \u6392\u5e8f\u6307\u6807\u3002", "categories": ["cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03647", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u5206\u5e03\u5916\u6cdb\u5316", "\u6f5c\u53d8\u91cf\u5efa\u6a21", "\u98ce\u9669\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03647v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Conditionally Identifiable Latent-Environment Modeling for Out-of-Distribution Recommendation", "tldr": "\u672c\u6587\u63d0\u51fa CILER\uff0c\u7528\u6761\u4ef6\u53ef\u8bc6\u522b\u7684\u6f5c\u5728\u73af\u5883\u5efa\u6a21\u6765\u5904\u7406\u5206\u5e03\u5916\u63a8\u8350\u4e2d\u7684\u504f\u597d\u6f02\u79fb\u95ee\u9898\uff0c\u663e\u5f0f\u523b\u753b\u6f5c\u5728\u73af\u5883\u53ca\u5176\u5bf9\u7528\u6237\u504f\u597d\u7684\u5f71\u54cd\u3002\u7406\u8bba\u4e0a\u7ed9\u51fa\u53ef\u8bc6\u522b\u6027\u6761\u4ef6\u548c\u90e8\u7f72\u98ce\u9669\u754c\uff0c\u5b9e\u9a8c\u5728\u7279\u5f81\u3001\u65f6\u95f4\u3001\u5730\u7406\u504f\u79fb\u4e0b\u63d0\u5347\u4e86\u4e09\u4e2a\u6570\u636e\u96c6\u7684\u5168\u90e8 12 \u4e2a OOD \u6392\u5e8f\u6307\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep learning has advanced time series forecasting, but periodicity drift, in which cycle timing and phase vary over time, remains a challenging problem. Existing methods predominantly model these sequences on fixed time grids, suffering from a limited ability to accommodate phase-related variation. To address this limitation, we propose \\textbf{POEM}, a phase-aware forecasting framework based on latent feature rotation using the special orthogonal group in two dimensions, denoted by $\\mathrm{SO}(2)$. POEM aims to reduce the phase-related variability by learning a phase-correction coordinate and applying an invertible $\\mathrm{SO}(2)$-based rotation to paired latent features. To extrapolate this correction coordinate, Directional Phase Increment Attention (DPIA) retrieves historical phase increments from similar temporal contexts and integrates them into future phase corrections. Experiments demonstrate that POEM achieves competitive performance, while qualitative visualizations suggest that the learned phase-aware transformation makes latent trajectories more regular.", "arxiv_id": "2608.03630", "arxiv_url": "https://arxiv.org/abs/2608.03630", "authors": ["Jiawen Zhu", "Shuhan Liu", "Shengxuan Li", "Qiming Shi", "Di Weng"], "brief": "\u672c\u6587\u63d0\u51fa POEM\uff0c\u7528\u4e8c\u7ef4\u7279\u6b8a\u6b63\u4ea4\u7fa4 SO(2) \u5bf9\u6210\u5bf9\u6f5c\u5728\u7279\u5f81\u505a\u53ef\u9006\u65cb\u8f6c\uff0c\u4ee5\u5b66\u4e60\u76f8\u4f4d\u6821\u6b63\u5750\u6807\uff0c\u7f13\u89e3\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u4e2d\u7684\u5468\u671f\u6f02\u79fb\u95ee\u9898\u3002\u5176 DPIA \u6a21\u5757\u6839\u636e\u76f8\u4f3c\u5386\u53f2\u4e0a\u4e0b\u6587\u68c0\u7d22\u76f8\u4f4d\u589e\u91cf\u6765\u5916\u63a8\u672a\u6765\u6821\u6b63\uff0c\u5b9e\u9a8c\u8868\u73b0\u5177\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u4f7f\u6f5c\u5728\u8f68\u8ff9\u66f4\u89c4\u6574\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03630", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u5468\u671f\u6f02\u79fb", "\u7279\u5f81\u53d8\u6362", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03630v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "POEM: Phase-Aware $\\mathrm{SO}(2)$ Feature Rotation for Time Series Forecasting Under Periodicity Drift", "tldr": "\u672c\u6587\u63d0\u51fa POEM\uff0c\u7528\u4e8c\u7ef4\u7279\u6b8a\u6b63\u4ea4\u7fa4 SO(2) \u5bf9\u6210\u5bf9\u6f5c\u5728\u7279\u5f81\u505a\u53ef\u9006\u65cb\u8f6c\uff0c\u4ee5\u5b66\u4e60\u76f8\u4f4d\u6821\u6b63\u5750\u6807\uff0c\u7f13\u89e3\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u4e2d\u7684\u5468\u671f\u6f02\u79fb\u95ee\u9898\u3002\u5176 DPIA \u6a21\u5757\u6839\u636e\u76f8\u4f3c\u5386\u53f2\u4e0a\u4e0b\u6587\u68c0\u7d22\u76f8\u4f4d\u589e\u91cf\u6765\u5916\u63a8\u672a\u6765\u6821\u6b63\uff0c\u5b9e\u9a8c\u8868\u73b0\u5177\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u4f7f\u6f5c\u5728\u8f68\u8ff9\u66f4\u89c4\u6574\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A companion paper studies when activation patching and weight-space ablation agree, inside an idealized model where a conditional computation is carried additively through a residual stream. For the one composition in that model where two carriers are architecturally dependent, an attention head and its own layer\u0027s normalization-MLP composition, it derives an exact first-order interaction formula, zero when only the MLP is ablated and second-order bounded when the head is also ablated. That result is confined to a single residual block and checked only on small transformers on a synthetic task. This paper extends the result past both limits. First, the interaction from ablating carriers spanning several layers decomposes exactly into same-block terms, one per touched layer, plus a cross-layer remainder on which the decomposition makes no claim of smallness. Second, we isolate that remainder exactly, for two layers, as a double integral of a mixed second derivative, and name the missing ingredient needed to bound it: a Jacobian bound for the attention sub-block. We derive this bound in closed form and verify it, without a single violation, against Qwen2.5-1.5B-Instruct\u0027s real weights, though we do not yet chain it across layers. We also give, in closed form, the curvature constant the companion paper\u0027s bound leaves unexhibited. Third, on that same model, we search for and find an emergent circuit for indirect object identification, never designed into it, using the original activation-patching method for this task, and test collapse, dissociation, and interaction on it. The result is mixed: a shared carrier emerges across all five tested instances, collapse and dissociation hold on most but not all, and a nonzero interaction is measurable on three of five, at layer pairs outside the same-block case the companion theorem covers.", "arxiv_id": "2608.03629", "arxiv_url": "https://arxiv.org/abs/2608.03629", "authors": ["Abdallah Khemais"], "brief": "\u672c\u6587\u6269\u5c55\u4e86\u6743\u91cd\u7a7a\u95f4\u6d88\u878d\u4e0e\u6fc0\u6d3b\u4fee\u8865\u4e00\u81f4\u6027\u7684\u7406\u8bba\u5206\u6790\uff0c\u5c06\u591a\u5c42\u8f7d\u4f53\u6d88\u878d\u7684\u4ea4\u4e92\u5206\u89e3\u4e3a\u540c\u5c42\u9879\u4e0e\u8de8\u5c42\u4f59\u9879\uff0c\u5e76\u7ed9\u51fa\u4e24\u5c42\u60c5\u5f62\u4e0b\u8de8\u5c42\u4f59\u9879\u7684\u7cbe\u786e\u79ef\u5206\u5f62\u5f0f\u3002\u4f5c\u8005\u63a8\u5bfc\u4e86\u6ce8\u610f\u529b\u5b50\u5757\u96c5\u53ef\u6bd4\u7684\u95ed\u5f0f\u4e0a\u754c\uff0c\u5e76\u5728 Qwen2.5-1.5B-Instruct \u771f\u5b9e\u6743\u91cd\u4e0a\u65e0\u8fdd\u4f8b\u9a8c\u8bc1\uff1b\u540c\u65f6\u5728\u95f4\u63a5\u5bbe\u8bed\u8bc6\u522b\u4efb\u52a1\u4e2d\u53d1\u73b0\u5171\u4eab\u7535\u8def\uff0c\u4f46\u5b9e\u9a8c\u7ed3\u679c\u663e\u793a\u4ea4\u4e92\u6548\u5e94\u5e76\u975e\u603b\u80fd\u88ab\u73b0\u6709\u7406\u8bba\u8986\u76d6\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03629", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u6ce8\u610f\u529b\u673a\u5236", "\u6a21\u578b\u6d88\u878d", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03629v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cross-Layer Interaction under Weight-Space Ablation: A Closed-Form Attention Jacobian Bound and a Test on a Real Pretrained Model", "tldr": "\u672c\u6587\u6269\u5c55\u4e86\u6743\u91cd\u7a7a\u95f4\u6d88\u878d\u4e0e\u6fc0\u6d3b\u4fee\u8865\u4e00\u81f4\u6027\u7684\u7406\u8bba\u5206\u6790\uff0c\u5c06\u591a\u5c42\u8f7d\u4f53\u6d88\u878d\u7684\u4ea4\u4e92\u5206\u89e3\u4e3a\u540c\u5c42\u9879\u4e0e\u8de8\u5c42\u4f59\u9879\uff0c\u5e76\u7ed9\u51fa\u4e24\u5c42\u60c5\u5f62\u4e0b\u8de8\u5c42\u4f59\u9879\u ead out by a linear functional, and prove three exact results. First, deleting a subset of carriers collapses a matched input pair onto the same unconditional output \\emph{if and only if} the removal is symmetric on the pair and leaves no outside contrast; the error is deterministic, and we give its exact form even when the two conditions hold only approximately. Second, patching a carrier moves the readout by its donor-receiver \\emph{contrast}, while ablating it moves the readout by its \\emph{absolute level}; neither bounds the other, and we construct pairs where every single-carrier patch flips the decision while no single-carrier ablation does. Third, for an attention head composed with its own layer\u0027s normalization and MLP, we derive an exact first-order interaction formula with a provably second-order remainder, vanishing identically when only the MLP is ablated but not, in general, when a head is. Small transformers trained on a synthetic conditional task illustrate all three predictions: across thirty-nine ablation configurations the measured interaction is strongly rank-correlated with the idealized model\u0027s predictive accuracy (Spearman $-0.83$), and a second task and architecture reproduces the same pattern, including a further polarity reversal. The single-block interaction result extends past one residual block, and the synthetic validation is tested against a real pretrained model, in a companion paper that takes this theory further along both axes.", "arxiv_id": "2608.03620", "arxiv_url": "https://arxiv.org/abs/2608.03620", "authors": ["Abdallah Khemais"], "brief": "\u672c\u6587\u7814\u7a76\u6fc0\u6d3b\u8865\u4e01\u4e0e\u6743\u91cd\u7a7a\u95f4\u6d88\u878d\u5728\u4f55\u79cd\u6761\u4ef6\u4e0b\u4f1a\u7ed9\u51fa\u4e00\u81f4\u7684\u56e0\u679c\u5224\u65ad\uff0c\u63d0\u51fa\u5355\u6b8b\u5dee\u5757\u7684\u7406\u60f3\u5316\u7406\u8bba\u5e76\u8bc1\u660e\u4e09\u4e2a\u7cbe\u786e\u7ed3\u679c\u3002\u7ed3\u679c\u8868\u660e\u8865\u4e01\u8861\u91cf\u7684\u6 let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
