7f6e\u4e0e\u8d28\u68c0\u8bb0\u5f55\u4ee5\u4fbf\u5ba1\u8ba1"], "keywords": ["\u6570\u636e\u5408\u6210", "\u56fe\u50cf\u751f\u6210", "\u591a\u6a21\u6001", "\u6570\u636e\u96c6"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00440v1", "published_at": "2026-08-01", "score": 0.237, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00440.png", "title": "Poplar: A Scalable Pipeline for Human-Centric Image Dataset Synthesis", "tldr": "\u53ef\u590d\u73b0\u5408\u6210\u4eba\u50cf\u6570\u636e\u96c6\u6d41\u6c34\u7ebf", "upvotes": 10, "what_it_is": "\u8bba\u6587\u63d0\u51fa Poplar\uff0c\u4e00\u4e2a\u9762\u5411\u4eba\u7c7b\u4e2d\u5fc3\u56fe\u50cf\u6570\u636e\u96c6\u5408\u6210\u7684 Specify--Render--Inspect \u6d41\u6c34\u7ebf\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u5316\u5c5e\u6027\u91c7\u6837\u3001\u771f\u5b9e\u611f\u56fe\u50cf\u751f\u6210\u4e0e\u89c6\u89c9\u8bed\u8a00\u8d28\u68c0\uff0c\u6784\u5efa\u4e86 Poplar-9K\uff1a9401 \u7ec4\u7ecf\u7b5b\u9009\u7684\u4eba\u50cf\u56fe\u6587\u5bf9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5173\u6ce8\u4ece\u201c\u751f\u6210\u5355\u5f20\u597d\u56fe\u201d\u5230\u201c\u53ef\u89c4\u6a21\u5316\u6784\u5efa\u53ef\u7528\u6570\u636e\u96c6\u201d\u7684\u5173\u952e\u5dee\u8ddd\uff0c\u5f3a\u8c03\u591a\u6837\u6027\u3001\u5e38\u8bc6\u4e00\u81f4\u6027\u3001\u771f\u5b9e\u6444\u5f71\u98ce\u683c\u548c\u53ef\u5ba1\u8ba1\u8d28\u63a7\uff0c\u5bf9\u5b9a\u5236\u5316\u4eba\u50cf\u6570\u636e\u96c6\u6784\u5efa\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Geospatial foundation models aim to learn representations that transfer across regions and sensors, yet evaluating them on specific tasks requires large, high-quality, multi-modal benchmarks that measure how well such models extract value from data. Concerning flood mapping, existing datasets rarely combine bi-temporal SAR and co-registered optical imagery at scale, leaving the value of foundation models for this downstream task largely untested. We introduce GEOID-Flood, a large-scale multi-modal flood segmentation benchmark, derived from Copernicus Emergency Management Service activations, spanning 219 events across 65 countries over ten years. The dataset provides more than 14,000 tiles with co-registered pre- and post-event Sentinel-1, in GRD and RTC format, pre-event Sentinel-2 composite, and DEM, including manually validated labels that separate background from permanent water and flooded water. Using this benchmark, we evaluate foundation models against conventional encoders across single-image, multi-temporal, and multi-modal protocols. We report three main findings: foundation models offer a consistent but modest advantage; optical-SAR fusion with finetuning best resolves transient flooding; and models trained on GEOID-Flood transfer to unseen events better than those trained on existing datasets. Dataset and code available at https://github.com/links-ads/geoid-flood.", "arxiv_id": "2608.02315", "arxiv_url": "https://arxiv.org/abs/2608.02315", "authors": ["Gaetano Chiriaco", "Luca Barco", "Andrea Bragagnolo", "Claudio Rossi", "Edoardo Arnaudo"], "brief": "\u8bba\u6587\u63d0\u51fa GEOID-Flood\uff0c\u4e00\u4e2a\u9762\u5411\u6d2a\u6c34\u5206\u5272\u7684\u5927\u89c4\u6a21\u591a\u6a21\u6001\u9065\u611f\u57fa\u51c6\u6570\u636e\u96c6\uff0c\u8986\u76d6 65 \u4e2a\u56fd\u5bb6\u3001219 \u6b21\u6d2a\u707e\u4e8b\u4ef6\u3001\u5341\u5e74\u65f6\u95f4\u8de8\u5ea6\u3002\u6570\u636e\u5305\u542b\u707e\u524d/\u707e\u540e Sentinel-1 SAR\u3001\u707e\u524d Sentinel-2 \u5149\u5b66\u5408\u6210\u3001DEM \u53ca\u4eba\u5de5\u9a8c\u8bc1\u7684\u6c38\u4e45\u6c34\u4f53\u4e0e\u6d2a\u6c34\u6807\u7b7e\uff0c\u5e76\u7528\u4e8e\u8bc4\u6d4b\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/links-ads/geoid-flood", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.02315", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5305\u542b\u8d85\u8fc7 14,000 \u4e2a\u914d\u51c6\u5f71\u50cf\u74e6\u7247\uff0c\u878d\u5408\u53cc\u65f6\u76f8 SAR\u3001\u5149\u5b66\u5f71\u50cf\u4e0e\u9ad8\u7a0b\u6570\u636e", "\u7cfb\u7edf\u6bd4\u8f83\u57fa\u7840\u6a21\u578b\u4e0e\u4f20\u7edf\u7f16\u7801\u5668\u5728\u5355\u56fe\u3001\u591a\u65f6\u76f8\u3001\u591a\u6a21\u6001\u8bbe\u7f6e\u4e0b\u7684\u6d2a\u6c34\u5206\u5272\u8868\u73b0", "\u53d1\u73b0\u57fa\u7840\u6a21\u578b\u4f18\u52bf\u7a33\u5b9a\u4f46\u6709\u9650\uff0c\u5149\u5b66-SAR \u878d\u5408\u52a0\u5fae\u8c03\u6700\u80fd\u8bc6\u522b\u4e34\u65f6\u6d2a\u6c34\uff0c\u4e14\u8de8\u4e8b\u4ef6\u6cdb\u5316\u4f18\u4e8e\u73b0\u6709\u6570\u636e\u96c6\u8bad\u7ec3\u6a21\u578b"], "keywords": ["\u9065\u611f", "\u591a\u6a21\u6001", "\u56fe\u50cf\u5206\u5272", "\u57fa\u7840\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "LINKS - AI, Data \u0026 Space", "pdf_url": "https://arxiv.org/pdf/2608.02315v1", "published_at": "2026-08-03", "score": 0.237, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02315.png", "title": "GEOID-Flood: A Large-Scale Multi-Modal Benchmark Dataset for Flood Segmentation", "tldr": "\u5927\u89c4\u6a21\u591a\u6a21\u6001\u6d2a\u6c34\u5206\u5272\u57fa\u51c6\u6570\u636e\u96c6", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa GEOID-Flood\uff0c\u4e00\u4e2a\u9762\u5411\u6d2a\u6c34\u5206\u5272\u7684\u5927\u89c4\u6a21\u591a\u6a21\u6001\u9065\u611f\u57fa\u51c6\u6570\u636e\u96c6\uff0c\u8986\u76d6 65 \u4e2a\u56fd\u5bb6\u3001219 \u6b21\u6d2a\u707e\u4e8b\u4ef6\u3001\u5341\u5e74\u65f6\u95f4\u8de8\u5ea6\u3002\u6570\u636e\u5305\u542b\u707e\u524d/\u707e\u540e Sentinel-1 SAR\u3001\u707e\u524d Sentinel-2 \u5149\u5b66\u5408\u6210\u3001DEM \u53ca\u4eba\u5de5\u9a8c\u8bc1\u7684\u6c38\u4e45\u6c34\u4f53\u4e0e\u6d2a\u6c34\u6807\u7b7e\uff0c\u5e76\u7528\u4e8e\u8bc4\u6d4b\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b\u3002", "why_notable": "\u8be5\u6570\u636e\u96c6\u586b\u8865\u4e86\u5927\u89c4\u6a21\u3001\u591a\u6a21\u6001\u3001\u8de8\u533a\u57df\u6d2a\u6c34\u5206\u5272\u57fa\u51c6\u7684\u7a7a\u7f3a\uff0c\u4e3a\u8bc4\u4f30\u5730\u7406\u7a7a\u95f4\u57fa\u7840\u6a21\u578b\u5728\u771f\u5b9e\u707e\u5bb3\u76d1\u6d4b\u4efb\u52a1\u4e2d\u7684\u4ef7\u503c\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u6807\u51c6\u3002"}, {"abstract": "On-policy distillation, in which a teacher corrects samples that the student itself generates, presupposes that the two models speak the same language: identical VAE latents, matching architectures, and a common timestep grid. We ask what happens when none of this holds, as when the strongest teacher available and the student one wishes to deploy come from different model families, and find that the standard recipes have no answer: teacher latents cannot serve as targets in a foreign coordinate system, per-pixel losses against a teacher that stochastically re-draws local detail degenerate into blur or divergence, and timestep indices lose their meaning across mismatched schedules. We present Any-OPD, to our knowledge the first framework for on-policy distillation between arbitrary pairs of latent flow-matching generators. Any-OPD treats the teacher purely as a black-box sampler and connects the two models at exactly one point: a frozen, model-agnostic vision representation in which their independently decoded outputs are compared, sidestepping every assumption about latents, features, or architecture. Trajectory correspondence is recovered by matching continuous noise levels instead of step indices, and a brief anchoring phase, in which teacher samples are re-encoded through the student\u0027s own VAE, ensures the on-policy gradient measures sample quality rather than domain mismatch. Distilling the 12B FLUX.1-dev into the 2.5B SD3.5-Medium, Any-OPD lifts the student\u0027s PickScore from 0.846 to 0.884 and HPSv3 from 9.12 to 10.97, rivaling the teacher at a fifth of its size, where direct latent regression fails to train at all.", "arxiv_id": "2608.03316", "arxiv_url": "https://arxiv.org/abs/2608.03316", "authors": ["Siming Fu", "Zheming Fu", "Ruizhe He", "Hualiang Wang", "Jie Huang", "Xiaoxiao Ma", "Mingchen Zhong", "Weihu Huang", "Xiaoxuan He", "Haojun Xu"], "brief": "\u672c\u6587\u63d0\u51fa Any-OPD\uff0c\u7528\u4e8e\u5728\u6f5c\u7a7a\u95f4\u3001\u67b6\u6784\u548c\u65f6\u95f4\u6b65\u8c03\u5ea6\u5747\u4e0d\u5339\u914d\u7684\u6d41\u5339\u914d\u751f\u6210\u6a21\u578b\u4e4b\u95f4\u8fdb\u884c\u5728\u7b56\u7565\u84b8\u998f\u3002\u5b83\u5c06\u6559\u5e08\u6a21\u578b\u89c6\u4e3a\u9ed1\u76d2\u91c7\u6837\u5668\uff0c\u4ec5\u901a\u8fc7\u51bb\u7ed3\u7684\u901a\u7528\u89c6\u89c9\u8868\u5f81\u7a7a\u95f4\u5bf9\u9f50\u5e08\u751f\u72ec\u7acb\u89e3\u7801\u540e\u7684\u8f93\u51fa\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03316", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7528\u6a21\u578b\u65e0\u5173\u7684\u89c6\u89c9\u8868\u793a\u7a7a\u95f4\u635f\u5931\u66ff\u4ee3\u6559\u5e08\u6f5c\u53d8\u91cf\u6216\u50cf\u7d20\u7ea7\u76d1\u7763\uff0c\u907f\u514d\u5f02\u6784 VAE/\u67b6\u6784\u5e26\u6765\u7684\u5750\u6807\u4e0d\u4e00\u81f4\u4e0e\u6a21\u7cca\u95ee\u9898", "\u901a\u8fc7\u8fde\u7eed\u566a\u58f0\u6c34\u5e73\u800c\u975e\u79bb\u6563\u65f6\u95f4\u6b65\u7d22\u5f15\u5efa\u7acb\u8f68\u8ff9\u5bf9\u5e94\uff0c\u9002\u914d\u4e0d\u540c\u91c7\u6837\u8c03\u5ea6", "\u5728 FLUX.1-dev 12B \u5230 SD3.5-Medium 2.5B \u7684\u84b8\u998f\u4e2d\uff0cPickScore \u4ece 0.846 \u63d0\u5347\u5230 0.884\uff0cHPSv3 \u4ece 9.12 \u63d0\u5347\u5230 10.97"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u6d41\u5339\u914d", "\u56fe\u50cf\u751f\u6210", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "jingdong", "pdf_url": "https://arxiv.org/pdf/2608.03316v1", "published_at": "2026-08-04", "score": 0.233, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03316.png", "title": "Any-OPD: Heterogeneous On-Policy Distillation for Flow-Matching Models via Representation-Space Bridging", "tldr": "\u4efb\u610f\u5f02\u6784\u6d41\u5339\u914d\u6a21\u578b\u95f4\u7684\u5728\u7b56\u7565\u84b8\u998f\u6846\u67b6", "upvotes": 2, "what_it_is": "\u672c\u6587\u63d0\u51fa Any-OPD\uff0c\u7528\u4e8e\u5728\u6f5c\u7a7a\u95f4\u3001\u67b6\u6784\u548c\u65f6\u95f4\u6b65\u8c03\u5ea6\u5747\u4e0d\u5339\u914d\u7684\u6d41\u5339\u914d\u751f\u6210\u6a21\u578b\u4e4b\u95f4\u8fdb\u884c\u5728\u7b56\u7565\u84b8\u998f\u3002\u5b83\u5c06\u6559\u5e08\u6a21\u578b\u89c6\u4e3a\u9ed1\u76d2\u91c7\u6837\u5668\uff0c\u4ec5\u901a\u8fc7\u51bb\u7ed3\u7684\u901a\u7528\u89c6\u89c9\u8868\u5f81\u7a7a\u95f4\u5bf9\u9f50\u5e08\u751f\u72ec\u7acb\u89e3\u7801\u540e\u7684\u8f93\u51fa\u3002", "why_notable": "\u5b83\u9996\u6b21\u7cfb\u7edf\u89e3\u51b3\u4efb\u610f\u5f02\u6784\u6f5c\u7a7a\u95f4\u6d41\u5339\u914d\u751f\u6210\u5668\u4e4b\u95f4\u7684\u5728\u7b56\u7565\u84b8\u998f\u95ee\u9898\uff0c\u4f7f\u5927\u89c4\u6a21\u5f3a\u6559\u5e08\u80fd\u8fc1\u79fb\u5230\u66f4\u5c0f\u3001\u53ef\u90e8\u7f72\u7684\u5b66\u751f\u6a21\u578b\u4e0a\uff0c\u4e14\u65e0\u9700\u5171\u4eab VAE\u3001\u7f51\u7edc\u7ed3\u6784\u6216\u65f6\u95f4\u6b65\u8bbe\u8ba1\u3002"}, {"abstract": "Long-horizon agents increasingly reuse their KV cache as memory: a serving system keeps a subset of cached entries and drops the rest. Eviction and episodic-memory schemes therefore rest on a premise rarely tested directly, that a retained event is still informative once the observations that produced it are gone. We test it by omitting one earlier observation from what is served, across otherwise identical agent histories. Among items sensitive to that observation, the answer overwhelmingly follows the omitted value, though no served span says which value is correct. We call this semantic materialization: a downstream event\u0027s cached rows act as an independently servable view of computation whose inputs are gone. It can also be written on purpose. A deliberately phrased, answer-free event raises donor-aligned recovery from 6% to 51% on Qwen3-8B without ever naming the value, whereas passively harvesting natural mentions from long-term dialog yields no detected advantage. What such a row carries is specific and bounded. Compact state survives, larger payloads decay toward chance, and whether a construction writes at all turns on phrasing rather than on meaning alone, so two phrasings the model comprehends equally well can diverge sharply. The result is a memory contract for sparse event-KV serving: what to write, where it lands, and what survives once the source is gone. For anyone who evicts the corollary is that dropping a source event and observing no accuracy loss does not show the source was unnecessary.", "arxiv_id": "2607.23693", "arxiv_url": "https://arxiv.org/abs/2607.23693", "authors": ["Zefeng Cai", "Zerui Cai"], "brief": "\u8bba\u6587\u7814\u7a76\u957f\u7a0b\u667a\u80fd\u4f53\u5c06KV\u7f13\u5b58\u5f53\u4f5c\u8bb0\u5fc6\u65f6\uff0c\u88ab\u4fdd\u7559\u7684\u4e0b\u6e38\u4e8b\u4ef6\u662f\u5426\u4ecd\u643a\u5e26\u5df2\u88ab\u4e22\u5f03\u8f93\u5165\u7684\u4fe1\u606f\u3002\u4f5c\u8005\u53d1\u73b0\u67d0\u4e9b\u7f13\u5b58\u884c\u4f1a\u201c\u8bed\u4e49\u7269\u5316\u201d\u65e9\u671f\u89c2\u6d4b\uff0c\u5373\u4f7f\u539f\u59cb\u89c2\u6d4b\u4e0d\u518d\u63d0\u4f9b\uff0c\u540e\u7eed\u56de\u7b54\u4ecd\u4f1a\u504f\u5411\u88ab\u7701\u7565\u7684\u503c\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/oklen/Compute-Globally-Materialize-Locally", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2607.23693", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u901a\u8fc7\u5728\u76f8\u540c\u667a\u80fd\u4f53\u5386\u53f2\u4e2d\u7701\u7565\u67d0\u4e2a\u65e9\u671f\u89c2\u6d4b\uff0c\u76f4\u63a5\u6d4b\u8bd5\u4fdd\u7559\u4e8b\u4ef6KV\u662f\u5426\u4ecd\u5305\u542b\u8be5\u89c2\u6d4b\u7684\u8bed\u4e49\u4fe1\u606f", "\u53d1\u73b0\u4e0b\u6e38\u4e8b\u4ef6\u7684\u7f13\u5b58\u884c\u53ef\u4f5c\u4e3a\u72ec\u7acb\u53ef\u670d\u52a1\u7684\u8ba1\u7b97\u89c6\u56fe\uff1b\u523b\u610f\u8bbe\u8ba1\u7684\u65e0\u7b54\u6848\u8868\u8ff0\u4e8b\u4ef6\u53ef\u5c06Qwen3-8B\u7684\u4f9b\u4f53\u5bf9\u9f50\u6062\u590d\u7387\u4ece6%\u63d0\u5347\u523051%", "\u8be5\u8bb0\u5fc6\u80fd\u529b\u6709\u8fb9\u754c\uff1a\u7d27\u51d1\u72b6\u6001\u66f4\u6613\u4fdd\u7559\uff0c\u5927\u8d1f\u8f7d\u4f1a\u8870\u51cf\u5230\u63a5\u8fd1\u968f\u673a\uff0c\u4e14\u662f\u5426\u5199\u5165\u5f3a\u4f9d\u8d56\u63aa\u8f9e\u800c\u975e\u8bed\u4e49\u7406\u89e3\u672c\u8eab"], "keywords": ["\u667a\u80fd\u4f53", "KV\u7f13\u5b58", "\u957f\u7a0b\u8bb0\u5fc6", "\u6a21\u578b\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.23693v1", "published_at": "2026-07-26", "score": 0.225, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23693.png", "title": "Compute Globally, Materialize Locally: The Memory Contract of Sparse Event-KV", "tldr": "\u63ed\u793a\u7a00\u758fKV\u8bb0\u5fc6\u4e2d\u7684\u8bed\u4e49\u7269\u5316\u73b0\u8c61", "upvotes": 3, "what_it_is": "\u8bba\u6587\u7814\u7a76\u957f\u7a0b\u667a\u80fd\u4f53\u5c06KV\u7f13\u5b58\u5f53\u4f5c\u8bb0\u5fc6\u65f6\uff0c\u88ab\u4fdd\u7559\u7684\u4e0b\u6e38\u4e8b\u4ef6\u662f\u5426\u4ecd\u643a\u5e26\u5df2\u88ab\u4e22\u5f03\u8f93\u5165\u7684\u4fe1\u606f\u3002\u4f5c\u8005\u53d1\u73b0\u67d0\u4e9b\u7f13\u5b58\u884c\u4f1a\u201c\u8bed\u4e49\u7269\u5316\u201d\u65e9\u671f\u89c2\u6d4b\uff0c\u5373\u4f7f\u539f\u59cb\u89c2\u6d4b\u4e0d\u518d\u63d0\u4f9b\uff0c\u540e\u7eed\u56de\u7b54\u4ecd\u4f1a\u504f\u5411\u88ab\u7701\u7565\u7684\u503c\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u6311\u6218\u4e86KV\u7f13\u5b58\u9a71\u9010\u4e2d\u7684\u5e38\u89c1\u5047\u8bbe\uff1a\u5220\u9664\u6e90\u4e8b\u4ef6\u540e\u51c6\u786e\u7387\u4e0d\u964d\uff0c\u5e76\u4e0d\u4ee3\u8868\u6e90\u4e8b\u4ef6\u65e0\u7528\u3002\u5b83\u4e3a\u7a00\u758fEvent-KV\u670d\u52a1\u63d0\u51fa\u4e86\u201c\u8bb0\u5fc6\u5951\u7ea6\u201d\uff0c\u5bf9\u957f\u7a0bLLM\u667a\u80fd\u4f53\u7684\u8bb0\u5fc6\u8bbe\u8ba1\u3001\u7f13\u5b58\u4fdd\u7559\u548c\u5b89\u5168\u8bc4\u4f30\u90fd\u6709\u5b9e\u9645\u610f\u4e49\u3002"}, {"abstract": "Agentic reinforcement learning enables LLM agents to learn through interaction, but sparse trajectory-level rewards reveal success without identifying which intermediate decisions deserve credit. Training-only privileged skills can provide denser supervision by allowing the same frozen policy snapshot to rescore fixed tokens from skill-free trajectories while conditioned on task-matched procedural skills. Existing methods, however, do not jointly calibrate teacher scores across interaction steps, relate teacher confidence to realized returns, and integrate the resulting signal into native reward-to-advantage construction. We introduce Agentic Reinforcement Learning with Self-Distilled Reward Shaping (ADRS), a framework for constructing return-associated token-level credit for multi-turn language agents. ADRS centers and normalizes privileged token scores within each step, modulates them with a return-associated Teacher Value Advantage (TVA) gate based on within-group confidence--return association, and incorporates the gated token signal into native RL credit construction. Together, these components determine what the teacher prefers, when that preference is return-relevant, and how it enters the native reinforcement-learning credit path, while keeping rollouts and inference skill-free. Finally, experiments across three interactive benchmarks show that ADRS consistently improves performance on long-horizon tasks, with gains persisting across RL backbones, reduced-data settings, unseen tasks, and extended training. For anonymous review, our code is available at the following the link: https://github.com/gitrxh/ADRS-arxiv", "arxiv_id": "2608.03223", "arxiv_url": "https://arxiv.org/abs/2608.03223", "authors": ["Ranxu Zhang", "Guinan Chen", "Chenshaodong", "Jinghao Lin", "Xiaozhou Xu", "Sunzhe", "Yanyong Zhang", "Chao Wang"], "brief": "\u8bba\u6587\u63d0\u51fa ADRS\uff0c\u4e00\u79cd\u9762\u5411\u591a\u8f6e LLM \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u81ea\u84b8\u998f\u5956\u52b1\u5851\u5f62\u65b9\u6cd5\uff0c\u7528\u8bad\u7ec3\u65f6\u7684\u7279\u6743\u6280\u80fd\u4e3a\u65e0\u6280\u80fd\u8f68\u8ff9\u4e2d\u7684 token \u7ea7\u51b3\u7b56\u5206\u914d\u66f4\u7ec6\u7c92\u5ea6\u4fe1\u7528\u3002\u65b9\u6cd5\u901a\u8fc7\u6b65\u5185\u5f52\u4e00\u5316\u6559\u5e08\u5206\u6570\u3001\u57fa\u4e8e\u56de\u62a5\u76f8\u5173\u6027\u7684 TVA \u95e8\u63a7\uff0c\u5e76\u63a5\u5165\u539f\u751f\u4f18\u52bf\u6784\u9020\uff0c\u5728\u63a8\u7406\u9636\u6bb5\u4e0d\u4f9d\u8d56\u7279\u6743\u6280\u80fd\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u4e09\u4e2a\u4ea4\u4e92\u5f0f\u957f\u7a0b\u4efb\u52a1\u57fa\u51c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u8868\u73b0\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u4e0d\u540c RL \u9aa8\u5e72\u3001\u4f4e\u6570\u636e\u548c\u672a\u89c1\u4efb\u52a1\u8bbe\u7f6e\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03223", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5956\u52b1\u5851\u5f62"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03223v1", "published_at": "2026-08-04", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Reinforcement Learning with Self-Distilled Reward Shaping", "tldr": "\u8bba\u6587\u63d0\u51fa ADRS\uff0c\u4e00\u79cd\u9762\u5411\u591a\u8f6e LLM \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u81ea\u84b8\u998f\u5956\u52b1\u5851\u5f62\u65b9\u6cd5\uff0c\u7528\u8bad\u7ec3\u65f6\u7684\u7279\u6743\u6280\u80fd\u4e3a\u65e0\u6280\u80fd\u8f68\u8ff9\u4e2d\u7684 token \u7ea7\u51b3\u7b56\u5206\u914d\u66f4\u7ec6\u7c92\u5ea6\u4fe1\u7528\u3002\u65b9\u6cd5\u901a\u8fc7\u6b65\u5185\u5f52\u4e00\u5316\u6559\u5e08\u5206\u6570\u3001\u57fa\u4e8e\u56de\u62a5\u76f8\u5173\u6027\u7684 TVA \u95e8\u63a7\uff0c\u5e76\u63a5\u5165\u539f\u751f\u4f18\u52bf\u6784\u9020\uff0c\u5728\u63a8\u7406\u9636\u6bb5\u4e0d\u4f9d\u8d56\u7279\u6743\u6280\u80fd\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u4e09\u4e2a\u4ea4\u4e92\u5f0f\u957f\u7a0b\u4efb\u52a1\u57fa\u51c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u8868\u73b0\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u4e0d\u540c RL \u9aa8\u5e72\u3001\u4f4e\u6570\u636e\u548c\u672a\u89c1\u4efb\u52a1\u8bbe\u7f6e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) couple action generation with prediction of future states. Their effectiveness depends on whether future dynamics are modeled in a space that is both aligned with action generation and sufficiently geometry-aware to capture where and how actions change the scene. Existing WAMs typically satisfy only part of this requirement, relying on either perceptually heavy observation-space targets or auxiliary latent spaces that are not jointly structured for action relevance and geometry. We propose SG-WAM, a self-guided framework that learns geometry-aware action-conditioned dynamics directly in the policy-derived representation space. SG-WAM introduces learnable dynamics tokens and a Self-Guided World Predictor that forecasts their future latent states conditioned on intervening robot actions. Prediction targets are generated by an exponential moving average copy of the same policy backbone, providing stable supervision within the representation family used by the action expert. Geometric supervision further structures the policy image-token representations, providing spatially grounded context for the dynamics tokens and yielding a future-alignment space that is both action-relevant and geometry-aware. Latent future prediction, geometric grounding, and flow-matching action generation are jointly optimized end-to-end in a unified framework. Built on a 0.9B model without large-scale embodied pretraining, SG-WAM achieves 98.5% average success on LIBERO and 73% on LIBERO-Plus, while outperforming strong baselines in both in-distribution and out-of-distribution real-world evaluations.", "arxiv_id": "2608.01397", "arxiv_url": "https://arxiv.org/abs/2608.01397", "authors": ["Ruiteng Zhao", "Zhengshen Zhang", "Yue Su", "Wenshuo Wang", "Jiahui Li", "Zhiyuan Yang", "Francis E. H. Tay", "Marcelo H. Ang", "Haiyue Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa SG-WAM\uff0c\u5c06\u52a8\u4f5c\u751f\u6210\u4e0e\u672a\u6765\u72b6\u6001\u9884\u6d4b\u7edf\u4e00\u5230\u7b56\u7565\u6d3e\u751f\u7684\u6f5c\u5728\u8868\u5f81\u7a7a\u95f4\u4e2d\u3002\u5b83\u901a\u8fc7\u81ea\u5f15\u5bfc\u9884\u6d4b\u3001\u51e0\u4f55\u76d1\u7763\u4e0e\u6d41\u5339\u914d\u52a8\u4f5c\u751f\u6210\u7aef\u5230\u7aef\u8bad\u7ec3\uff0c\u4f7f\u673a\u5668\u4eba\u7b56\u7565\u540c\u65f6\u5177\u5907\u52a8\u4f5c\u76f8\u5173\u6027\u548c\u7a7a\u95f4\u51e0\u4f55\u611f\u77e5\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01397", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u53ef\u5b66\u4e60\u7684 dynamics tokens\uff0c\u5e76\u7528 Self-Guided World Predictor \u6839\u636e\u673a\u5668\u4eba\u52a8\u4f5c\u9884\u6d4b\u5176\u672a\u6765\u6f5c\u5728\u72b6\u6001", "\u9884\u6d4b\u76ee\u6807\u6765\u81ea\u540c\u4e00\u7b56\u7565\u9aa8\u5e72\u7684\u6307\u6570\u6ed1\u52a8\u5e73\u5747\u526f\u672c\uff0c\u907f\u514d\u4f9d\u8d56\u989d\u5916\u89c2\u6d4b\u7a7a\u95f4\u6216\u4e0d\u4e00\u81f4\u7684\u8f85\u52a9\u6f5c\u7a7a\u95f4", "\u5728 0.9B \u6a21\u578b\u4e14\u65e0\u5927\u89c4\u6a21\u5177\u8eab\u9884\u8bad\u7ec3\u6761\u4ef6\u4e0b\uff0cLIBERO \u5e73\u5747\u6210\u529f\u7387\u8fbe 98.5%\uff0cLIBERO-Plus \u8fbe 73%"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u6a21\u4eff\u5b66\u4e60", "\u51e0\u4f55\u611f\u77e5"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01397v1", "published_at": "2026-08-02", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01397.png", "title": "SG-WAM: Self-Guided World Modeling in Geometry-Aware Policy Space", "tldr": "\u5728\u7b56\u7565\u8868\u5f81\u4e2d\u81ea\u5f15\u5bfc\u5b66\u4e60\u51e0\u4f55\u611f\u77e5\u4e16\u754c\u6a21\u578b", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa SG-WAM\uff0c\u5c06\u52a8\u4f5c\u751f\u6210\u4e0e\u672a\u6765\u72b6\u6001\u9884\u6d4b\u7edf\u4e00\u5230\u7b56\u7565\u6d3e\u751f\u7684\u6f5c\u5728\u8868\u5f81\u7a7a\u95f4\u4e2d\u3002\u5b83\u901a\u8fc7\u81ea\u5f15\u5bfc\u9884\u6d4b\u3001\u51e0\u4f55\u76d1\u7763\u4e0e\u6d41\u5339\u914d\u52a8\u4f5c\u751f\u6210\u7aef\u5230\u7aef\u8bad\u7ec3\uff0c\u4f7f\u673a\u5668\u4eba\u7b56\u7565\u540c\u65f6\u5177\u5907\u52a8\u4f5c\u76f8\u5173\u6027\u548c\u7a7a\u95f4\u51e0\u4f55\u611f\u77e5\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u4e16\u754c\u6a21\u578b\u5b66\u4e60\u76f4\u63a5\u5d4c\u5165\u52a8\u4f5c\u7b56\u7565\u8868\u5f81\uff0c\u5e76\u52a0\u5165\u51e0\u4f55\u7ea6\u675f\uff0c\u517c\u987e\u53ef\u63a7\u6027\u3001\u7a7a\u95f4\u7406\u89e3\u548c\u8bad\u7ec3\u7a33\u5b9a\u6027\uff1b\u5728\u6a21\u62df\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u5206\u5e03\u5185\u5916\u8bc4\u6d4b\u4e2d\u5747\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "A wearable assistant should both answer questions about its visual history and recognize when that history is useful to the present situation. Existing video-memory systems primarily support question-conditioned recall, whereas proactive assistants typically use separate memory and control mechanisms. We introduce GROVE, a training-free framework that supports both behaviors with one memory grown causally from a continuous video stream. GROVE retains fine-grained perceptual evidence and incrementally consolidates it into time-stamped moments, coherent episodes, and recurring cross-day patterns. Each stratum is paired with a scale-native retrieval skill for locating an observation, replaying an activity, or traversing long-range regularities. Reactive QA and proactive assistance share this memory and access interface, differing in whether retrieval is initiated by a user query or the current situation. Across multiple benchmarks including the challenging MM-lifelong and EgoServe, GROVE achieves the best results among the compared methods. Controlled ablations show that the temporal strata and their access skills are complementary, with patterns providing the largest benefit when evidence spans multiple days. Code will be available at https://github.com/SitongGong/GROVE.", "arxiv_id": "2608.02392", "arxiv_url": "https://arxiv.org/abs/2608.02392", "authors": ["Sitong Gong", "Caixin Kang", "Tianyu Yan", "Guo Chen", "Bo Zheng", "Kaipeng Zhang", "Yunzhi Zhuge", "Xiang Ruan", "Huchuan Lu", "Yifei Huang"], "brief": "GROVE \u662f\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6d41\u5f0f\u89c6\u9891\u8bb0\u5fc6\u6846\u67b6\uff0c\u9762\u5411\u53ef\u7a7f\u6234\u89c6\u89c9\u52a9\u624b\uff0c\u5728\u8fde\u7eed\u89c6\u9891\u4e2d\u56e0\u679c\u589e\u957f\u8bb0\u5fc6\u3002\u5b83\u5c06\u7ec6\u7c92\u5ea6\u611f\u77e5\u8bc1\u636e\u9010\u6b65\u6574\u5408\u4e3a\u5e26\u65f6\u95f4\u6233\u7684\u65f6\u523b\u3001\u8fde\u8d2f\u4e8b\u4ef6\u548c\u8de8\u65e5\u91cd\u590d\u6a21\u5f0f\uff0c\u5e76\u7528\u540c\u4e00\u5957\u8bb0\u5fc6\u63a5\u53e3\u652f\u6301\u56de\u6eaf\u95ee\u7b54\u4e0e\u60c5\u5883\u89e6\u53d1\u7684\u4e3b\u52a8\u8f85\u52a9\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/SitongGong/GROVE", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02392", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6784\u5efa\u65f6\u95f4\u5206\u5c42\u8bb0\u5fc6\uff1a\u89c2\u6d4b\u3001\u6d3b\u52a8\u7247\u6bb5\u3001\u8de8\u65e5\u6a21\u5f0f\uff0c\u517c\u987e\u7ec6\u8282\u4fdd\u7559\u4e0e\u957f\u671f\u538b\u7f29\u3002", "\u4e3a\u4e0d\u540c\u65f6\u95f4\u5c3a\u5ea6\u8bbe\u8ba1\u539f\u751f\u68c0\u7d22\u6280\u80fd\uff0c\u53ef\u5b9a\u4f4d\u5177\u4f53\u89c2\u5bdf\u3001\u91cd\u653e\u6d3b\u52a8\u8fc7\u7a0b\u6216\u904d\u5386\u957f\u671f\u89c4\u5f8b\u3002", "\u5728 MM-lifelong\u3001EgoServe \u7b49\u57fa\u51c6\u4e0a\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\uff1b\u6d88\u878d\u663e\u793a\u65f6\u95f4\u5206\u5c42\u4e92\u8865\uff0c\u8de8\u65e5\u6a21\u5f0f\u5728\u957f\u7a0b\u8bc1\u636e\u4efb\u52a1\u4e2d\u8d21\u732e\u6700\u5927\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u957f\u671f\u8bb0\u5fc6", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02392v1", "published_at": "2026-08-03", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02392.png", "title": "GROVE: Growing and Reasoning over Temporally Stratified Memory from Streaming Video Experience", "tldr": "\u5206\u5c42\u89c6\u9891\u8bb0\u5fc6\u652f\u6491\u95ee\u7b54\u4e0e\u4e3b\u52a8\u534f\u52a9", "upvotes": 1, "what_it_is": "GROVE \u662f\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6d41\u5f0f\u89c6\u9891\u8bb0\u5fc6\u6846\u67b6\uff0c\u9762\u5411\u53ef\u7a7f\u6234\u89c6\u89c9\u52a9\u624b\uff0c\u5728\u8fde\u7eed\u89c6\u9891\u4e2d\u56e0\u679c\u589e\u957f\u8bb0\u5fc6\u3002\u5b83\u5c06\u7ec6\u7c92\u5ea6\u611f\u77e5\u8bc1\u636e\u9010\u6b65\u6574\u5408\u4e3a\u5e26\u65f6\u95f4\u6233\u7684\u65f6\u523b\u3001\u8fde\u8d2f\u4e8b\u4ef6\u548c\u8de8\u65e5\u91cd\u590d\u6a21\u5f0f\uff0c\u5e76\u7528\u540c\u4e00\u5957\u8bb0\u5fc6\u63a5\u53e3\u652f\u6301\u56de\u6eaf\u95ee\u7b54\u4e0e\u60c5\u5883\u89e6\u53d1\u7684\u4e3b\u52a8\u8f85\u52a9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u9891\u5386\u53f2\u95ee\u7b54\u548c\u4e3b\u52a8\u573a\u666f\u8f85\u52a9\u7edf\u4e00\u5230\u540c\u4e00\u5957\u53ef\u589e\u957f\u8bb0\u5fc6\u4e2d\uff0c\u907f\u514d\u4e3a\u56de\u5fc6\u4e0e\u63a7\u5236\u5206\u522b\u8bbe\u8ba1\u7cfb\u7edf\uff0c\u5bf9\u957f\u671f\u7b2c\u4e00\u4eba\u79f0\u89c6\u9891\u52a9\u624b\u548c\u5177\u8eab\u667a\u80fd\u4f53\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) achieve strong performance by integrating visual inputs with the rich priors of pretrained language models. However, they often fail on vision-centric tasks, especially when visual evidence conflicts with pretrained knowledge. We explore these failures separately using two diagnostic paradigms: (1) probing whether visual information is available, via image reconstruction, and (2) measuring multimodal context sensitivity, the extent to which the model follows visual context versus the language prior. To support the second, we introduce the WhatIfVis, a benchmark spanning five coarse-grained dimensions (spatial-temporal, color, count, size, and weight) whose questions admit answers from either the image or the prior. Our analysis yields three findings: (i) Coarse-grained visual evidence is preserved, as these attributes can be reconstructed from the final-layer image tokens of frozen MLLMs. Failures on questions about these attributes therefore point to post-perceptual utilization, rather than to degraded visual encoding during perception. (ii) Even when explicitly instructed to use or ignore visual evidence, vanilla models (without supervised fine-tuning on the WhatIfVis) show unstable visual context sensitivity. Supervised fine-tuning (SFT) improves this controllability and generalizes across domains, and activation patching further localizes the vision-versus-prior trade-off at architecture-specific depths across all six models. (iii) The vision-versus-prior trade-off is controllable along a learned vector. Applying this steering vector, even without any intent instruction, improves controllability over the vanilla model. Together, these results relocate the bottleneck, indicating that for the coarse attributes we study, MLLMs encode the visual evidence but cannot reliably control their reliance on it.", "arxiv_id": "2607.26326", "arxiv_url": "https://arxiv.org/abs/2607.26326", "authors": ["Jiaang Li", "Chengzu Li", "Zhaochong An", "Yifei Yuan", "Xi Liu", "Serge Belongie", "V\u00e9steinn Sn\u00e6bjarnarson"], "brief": "\u672c\u6587\u7814\u7a76\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u89c6\u89c9\u8bc1\u636e\u4e0e\u8bed\u8a00\u5148\u9a8c\u51b2\u7a81\u65f6\u7684\u5931\u8d25\u539f\u56e0\uff0c\u533a\u5206\u201c\u89c6\u89c9\u4fe1\u606f\u662f\u5426\u88ab\u7f16\u7801\u201d\u548c\u201c\u6a21\u578b\u662f\u5426\u6309\u89c6\u89c9\u4e0a\u4e0b\u6587\u4f5c\u7b54\u201d\u3002\u4f5c\u8005\u63d0\u51fa WhatIfVis \u57fa\u51c6\uff0c\u5e76\u53d1\u73b0\u7c97\u7c92\u5ea6\u89c6\u89c9\u5c5e\u6027\u53ef\u88ab\u4fdd\u7559\uff0c\u4f46\u6a21\u578b\u5bf9\u56fe\u50cf\u8bc1\u636e\u7684\u4f7f\u7528\u4e0d\u7a33\u5b9a\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26326", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa WhatIfVis\uff0c\u8986\u76d6\u65f6\u7a7a\u3001\u989c\u8272\u3001\u6570\u91cf\u3001\u5927\u5c0f\u3001\u91cd\u91cf\u4e94\u7c7b\u5c5e\u6027\uff0c\u4e13\u95e8\u6d4b\u8bd5\u56fe\u50cf\u8bc1\u636e\u4e0e\u8bed\u8a00\u5148\u9a8c\u51b2\u7a81\u65f6\u7684\u56de\u7b54\u503e\u5411", "\u901a\u8fc7\u56fe\u50cf\u91cd\u5efa\u53d1\u73b0\uff0c\u51bb\u7ed3 MLLM \u7684\u6700\u7ec8\u5c42\u56fe\u50cf token \u4ecd\u4fdd\u7559\u7c97\u7c92\u5ea6\u89c6\u89c9\u4fe1\u606f\uff0c\u8bf4\u660e\u74f6\u9888\u4e3b\u8981\u5728\u540e\u7eed\u5229\u7528\u800c\u975e\u611f\u77e5\u7f16\u7801", "SFT \u53ef\u63d0\u5347\u89c6\u89c9\u4e0a\u4e0b\u6587\u53ef\u63a7\u6027\uff1b\u6fc0\u6d3b patching \u5b9a\u4f4d\u4e0d\u540c\u67b6\u6784\u4e2d\u89c6\u89c9\u4e0e\u5148\u9a8c\u6743\u8861\u7684\u5173\u952e\u5c42\uff0c\u5e76\u53ef\u7528\u5b66\u4e60\u5230\u7684 steering vector \u63a7\u5236\u8be5\u6743\u8861"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u63a8\u7406", "\u6a21\u578b\u53ef\u63a7\u6027", "\u5e7b\u89c9"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26326v1", "published_at": "2026-07-28", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.26326.png", "title": "Seeing or Knowing? Visual Context Sensitivity in Multimodal Large Language Models", "tldr": "MLLM\u770b\u5f97\u89c1\u56fe\u50cf\uff0c\u5374\u96be\u63a7\u5236\u662f\u5426\u76f8\u4fe1\u56fe\u50cf", "upvotes": 2, "what_it_is": "\u672c\u6587\u7814\u7a76\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u89c6\u89c9\u8bc1\u636e\u4e0e\u8bed\u8a00\u5148\u9a8c\u51b2\u7a81\u65f6\u7684\u5931\u8d25\u539f\u56e0\uff0c\u533a\u5206\u201c\u89c6\u89c9\u4fe1\u606f\u662f\u5426\u88ab\u7f16\u7801\u201d\u548c\u201c\u6a21\u578b\u662f\u5426\u6309\u89c6\u89c9\u4e0a\u4e0b\u6587\u4f5c\u7b54\u201d\u3002\u4f5c\u8005\u63d0\u51fa WhatIfVis \u57fa\u51c6\uff0c\u5e76\u53d1\u73b0\u7c97\u7c92\u5ea6\u89c6\u89c9\u5c5e\u6027\u53ef\u88ab\u4fdd\u7559\uff0c\u4f46\u6a21\u578b\u5bf9\u56fe\u50cf\u8bc1\u636e\u7684\u4f7f\u7528\u4e0d\u7a33\u5b9a\u3002", "why_notable": "\u8bba\u6587\u5c06 MLLM \u89c6\u89c9\u5931\u8d25\u4ece\u201c\u770b\u4e0d\u89c1\u201d\u91cd\u65b0\u5b9a\u4f4d\u4e3a\u201c\u4e0d\u4f1a\u7a33\u5b9a\u4f7f\u7528\u6240\u89c1\u4fe1\u606f\u201d\uff0c\u4e3a\u63d0\u5347\u89c6\u89c9\u5fe0\u5b9e\u6027\u3001\u964d\u4f4e\u8bed\u8a00\u5148\u9a8c\u5e7b\u89c9\u63d0\u4f9b\u4e86\u8bca\u65ad\u57fa\u51c6\u548c\u53ef\u63a7\u5e72\u9884\u65b9\u6cd5\u3002"}, {"abstract": "Captions serve as a primary supervision signal for both multimodal understanding and text-to-image generation. However, previous evaluations treat the caption quality as a single scalar objective, which conflates two distinct properties: (1) how much visual information a caption covers and (2) how reliably the image supports its stated claims. To this end, we design a decoupled caption evaluation benchmark, CAPEval (Coverage And Precision Evaluation), with human-written ground-truth captions and human-verified atomic checklist items. Specifically, CAPEval decomposes caption quality into Coverage and Precision. The former quantifies how thoroughly a caption covers ground-truth factual content, while the latter reflects the factual correctness rate of all claims expressed in the caption. We select 10 captioners and further conduct controlled downstream end-to-end experiments with them from four model families, where the caption source is the only variable. Empirically, we find a consistent task-dependent dissociation: Coverage serves as the stronger correlate for understanding performance, whereas Precision acts as the dominant predictor for generation performance. This decoupled evaluation paradigm not only delivers a more fine-grained diagnosis of caption quality, but also offers actionable guidance for selecting and optimizing captioners tailored to different downstream tasks.", "arxiv_id": "2608.02589", "arxiv_url": "https://arxiv.org/abs/2608.02589", "authors": ["Zhipeng Liu", "Haochen Wang", "Zhaoxiang Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa CAPEval\uff0c\u4e00\u4e2a\u89e3\u8026\u5f0f\u56fe\u50cf\u63cf\u8ff0\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7528\u4eba\u5de5\u771f\u503c\u63cf\u8ff0\u548c\u4eba\u5de5\u9a8c\u8bc1\u7684\u539f\u5b50\u68c0\u67e5\u9879\u5206\u522b\u8861\u91cf Coverage \u4e0e Precision\u3002\u7814\u7a76\u53d1\u73b0\uff1a\u8986\u76d6\u5ea6\u66f4\u80fd\u9884\u6d4b\u591a\u6a21\u6001\u7406\u89e3\u8868\u73b0\uff0c\u7cbe\u786e\u5ea6\u66f4\u80fd\u9884\u6d4b\u6587\u751f\u56fe\u751f\u6210\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/liuzhipenggg/CAPEval", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02589", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06 caption \u8d28\u91cf\u4ece\u5355\u4e00\u5206\u6570\u62c6\u89e3\u4e3a Coverage\uff08\u8986\u76d6\u591a\u5c11\u771f\u5b9e\u89c6\u89c9\u4e8b\u5b9e\uff09\u548c Precision\uff08\u63cf\u8ff0\u4e2d\u58f0\u660e\u6709\u591a\u5c11\u88ab\u56fe\u50cf\u652f\u6301\uff09\u3002", "\u6784\u5efa\u542b\u4eba\u5de5\u64b0\u5199\u771f\u503c\u63cf\u8ff0\u4e0e\u4eba\u5de5\u9a8c\u8bc1\u539f\u5b50 checklist \u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5e76\u8bc4\u4f30 10 \u4e2a captioner\u3002", "\u5728\u56db\u7c7b\u6a21\u578b\u5bb6\u65cf\u7684\u4e0b\u6e38\u7aef\u5230\u7aef\u5b9e\u9a8c\u4e2d\u63a7\u5236 caption \u6765\u6e90\uff0c\u53d1\u73b0\u7406\u89e3\u4efb\u52a1\u66f4\u4f9d\u8d56 Coverage\uff0c\u751f\u6210\u4efb\u52a1\u66f4\u4f9d\u8d56 Precision\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u63cf\u8ff0", "\u8bc4\u6d4b\u57fa\u51c6", "\u6587\u751f\u56fe"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02589v1", "published_at": "2026-08-03", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02589.png", "title": "CAPEval: A Decoupled Caption Evaluation across Understanding and Generation", "tldr": "\u5c06\u56fe\u50cf\u63cf\u8ff0\u8d28\u91cf\u62c6\u5206\u4e3a\u8986\u76d6\u5ea6\u4e0e\u7cbe\u786e\u5ea6\u8bc4\u4f30", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa CAPEval\uff0c\u4e00\u4e2a\u89e3\u8026\u5f0f\u56fe\u50cf\u63cf\u8ff0\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7528\u4eba\u5de5\u771f\u503c\u63cf\u8ff0\u548c\u4eba\u5de5\u9a8c\u8bc1\u7684\u539f\u5b50\u68c0\u67e5\u9879\u5206\u522b\u8861\u91cf Coverage \u4e0e Precision\u3002\u7814\u7a76\u53d1\u73b0\uff1a\u8986\u76d6\u5ea6\u66f4\u80fd\u9884\u6d4b\u591a\u6a21\u6001\u7406\u89e3\u8868\u73b0\uff0c\u7cbe\u786e\u5ea6\u66f4\u80fd\u9884\u6d4b\u6587\u751f\u56fe\u751f\u6210\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u7edf\u4e00 caption \u5206\u6570\u4f1a\u6df7\u6dc6\u4fe1\u606f\u5145\u5206\u6027\u4e0e\u4e8b\u5b9e\u53ef\u9760\u6027\uff0c\u4e3a\u591a\u6a21\u6001\u7406\u89e3\u548c\u6587\u751f\u56fe\u8bad\u7ec3\u4e2d\u7684 captioner \u9009\u62e9\u4e0e\u4f18\u5316\u63d0\u4f9b\u4e86\u66f4\u53ef\u64cd\u4f5c\u7684\u8bca\u65ad\u6307\u6807\u3002"}, {"abstract": "Clinical development is sequential decision-making under uncertainty, where a sponsor must plan a portfolio of experiments from heterogeneous evidence. We study this setting by framing oncology clinical development as an offline decision-making problem in which an agent predicts the next six-month trial portfolio of an oncology drug program from information available at the decision date. To support this, we construct a temporal dataset that combines 31.7k heterogeneous public data records, including trial registries, regulatory reviews, sponsor filings, utilization data, and epidemiology, into 881 offline decision episodes across 45 historical programs. We compare four offline objectives: behavioral cloning, reward-weighted behavioral cloning, learned-reward training, and value-based implicit Q-learning against four frontier LLM agents that share a common date-gated retrieval scaffold across held-out drug, sponsor, drug-class, and temporal splits. Models trained offline outperform the non-fine-tuned baselines, particularly in the post-August 2025 contamination-clean holdout. Reward-weighted behavioral cloning performs the best, obtaining 46.2% indication F1 and 14.2% strict F1 against 25.0% and 2.1%, respectively, for the best-performing tool agent on each metric. These results suggest that structured offline learning can teach agents to plan clinical experiments.", "arxiv_id": "2608.03606", "arxiv_url": "https://arxiv.org/abs/2608.03606", "authors": ["William Bolton", "Philip Torr"], "brief": "\u8bba\u6587\u5c06\u80bf\u7624\u836f\u7269\u4e34\u5e8a\u5f00\u53d1\u5efa\u6a21\u4e3a\u79bb\u7ebf\u5e8f\u5217\u51b3\u7b56\u95ee\u9898\uff0c\u6784\u5efa\u4e86\u5305\u542b3.17\u4e07\u6761\u5f02\u6784\u516c\u5f00\u8bb0\u5f55\u3001881\u4e2a\u51b3\u7b56\u7247\u6bb5\u7684\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u9884\u6d4b\u672a\u6765\u516d\u4e2a\u6708\u7684\u4e34\u5e8a\u8bd5\u9a8c\u7ec4\u5408\u3002\u6bd4\u8f83\u591a\u79cd\u79bb\u7ebf\u8bad\u7ec3\u76ee\u6807\u4e0eLLM\u5de5\u5177\u667a\u80fd\u4f53\u540e\u53d1\u73b0\uff0c\u79bb\u7ebf\u8bad\u7ec3\u6a21\u578b\u663e\u8457\u66f4\u4f18\uff0c\u5176\u4e2d\u5956\u52b1\u52a0\u6743\u884c\u4e3a\u514b\u9686\u5728\u9002\u5e94\u75c7F1\u548c\u4e25\u683cF1\u4e0a\u5206\u522b\u8fbe\u523046.2%\u548c14.2%\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03606", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60", "\u4e34\u5e8a\u8bd5\u9a8c", "\u51b3\u7b56\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03606v1", "published_at": "2026-08-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Learning Clinical-Trial Strategy: Offline Policy Training for Decision Agents", "tldr": "\u8bba\u6587\u5c06\u80bf\u7624\u836f\u7269\u4e34\u5e8a\u5f00\u53d1\u5efa\u6a21\u4e3a\u79bb\u7ebf\u5e8f\u5217\u51b3\u7b56\u95ee\u9898\uff0c\u6784\u5efa\u4e86\u5305\u542b3.17\u4e07\u6761\u5f02\u6784\u516c\u5f00\u8bb0\u5f55\u3001881\u4e2a\u51b3\u7b56\u7247\u6bb5\u7684\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u9884\u6d4b\u672a\u6765\u516d\u4e2a\u6708\u7684\u4e34\u5e8a\u8bd5\u9a8c\u7ec4\u5408\u3002\u6bd4\u8f83\u591a\u79cd\u79bb\u7ebf\u8bad\u7ec3\u76ee\u6807\u4e0eLLM\u5de5\u5177\u667a\u80fd\u4f53\u540e\u53d1\u73b0\uff0c\u79bb\u7ebf\u8bad\u7ec3\u6a21\u578b\u663e\u8457\u66f4\u4f18\uff0c\u5176\u4e2d\u5956\u52b1\u52a0\u6743\u884c\u4e3a\u514b\u9686\u5728\u9002\u5e94\u75c7F1\u548c\u4e25\u683cF1\u4e0a\u5206\u522b\u8fbe\u523046.2%\u548c14.2%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) have recently shown strong capabilities in reasoning, planning, and tool-use, enabling new forms of autonomous agents. However, LLM-based agents struggle with long-horizon sequential decision tasks that require precise action optimization and environment interaction. Reinforcement Learning (RL), while effective for sequential control, often lacks the high-level abstraction and task decomposition abilities needed for complex scenarios. This paper introduces an LLM-Augmented Reinforcement Learning Agent that integrates LLM-driven planning with RL-based action optimization. The proposed architecture leverages the LLM to generate subgoals, structured plans, and contextual guidance, while the RL agent refines low-level actions through interaction with the environment. Experiments on sequential decision tasks demonstrate improved sample efficiency, higher success rates, and more coherent action trajectories compared to RL-only and LLM-only baselines. This hybrid paradigm highlights a promising direction for building more capable autonomous systems.", "arxiv_id": "2608.03502", "arxiv_url": "https://arxiv.org/abs/2608.03502", "authors": ["Christophe D. Hounwanou", "John Emeka Eze", "Ya\u00e9 Ulrich Gaba"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u89c4\u5212\u4e0e\u5f3a\u5316\u5b66\u4e60\u52a8\u4f5c\u4f18\u5316\u7ed3\u5408\u7684\u6df7\u5408\u667a\u80fd\u4f53\u67b6\u6784\u3002LLM \u8d1f\u8d23\u751f\u6210\u5b50\u76ee\u6807\u3001\u7ed3\u6784\u5316\u8ba1\u5212\u548c\u4e0a\u4e0b\u6587\u6307\u5bfc\uff0cRL \u8d1f\u8d23\u901a\u8fc7\u73af\u5883\u4ea4\u4e92\u7ec6\u5316\u4f4e\u5c42\u52a8\u4f5c\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u590d\u6742\u5e8f\u5217\u51b3\u7b56\u4efb\u52a1\u4e2d\u6bd4\u5355\u72ec RL \u6216 LLM \u5177\u6709\u66f4\u9ad8\u6837\u672c\u6548\u7387\u3001\u6210\u529f\u7387\u548c\u52a8\u4f5c\u8fde\u8d2f\u6027\u3002", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03502", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5e8f\u5217\u51b3\u7b56"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03502v1", "published_at": "2026-08-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Hybrid LLM-Augmented Reinforcement Learning Agents for Complex Sequential Decision Tasks", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u89c4\u5212\u4e0e\u5f3a\u5316\u5b66\u4e60\u52a8\u4f5c\u4f18\u5316\u7ed3\u5408\u7684\u6df7\u5408\u667a\u80fd\u4f53\u67b6\u6784\u3002LLM \u8d1f\u8d23\u751f\u6210\u5b50\u76ee\u6807\u3001\u7ed3\u6784\u5316\u8ba1\u5212\u548c\u4e0a\u4e0b\u6587\u6307\u5bfc\uff0cRL \u8d1f\u8d23\u901a\u8fc7\u73af\u5883\u4ea4\u4e92\u7ec6\u5316\u4f4e\u5c42\u52a8\u4f5c\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u590d\u6742\u5e8f\u5217\u51b3\u7b56\u4efb\u52a1\u4e2d\u6bd4\u5355\u72ec RL \u6216 LLM \u5177\u6709\u66f4\u9ad8\u6837\u672c\u6548\u7387\u3001\u6210\u529f\u7387\u548c\u52a8\u4f5c\u8fde\u8d2f\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-term memory enables persistent personalization in LLM agents, but repeated memory-conditioned responses can cumulatively reveal protected attributes even when they are never stated explicitly. We formalize this threat as adaptive transcript privacy and introduce DP-MemView, a differentially private interface that privately selects public response-conditioning views and exposes those views---rather than raw memory---to the response LLM. Each private selection is charged to every protected attribute whose memory group intersects the read set. Per-attribute ledgers block any selection that would exceed its cap and return a fixed generic view instead. Under an explicit interface contract, we prove pure B_a-DP for the entire adaptive transcript. We also extend the result to stores that differ across multiple protected groups and bound how much observing the transcript can change an adversary\u0027s prior odds. We evaluate the online and preallocated modes with three response LLMs on a controlled adjacent-store benchmark and a public-corpus transfer track. Both modes keep transcript distinguishability near chance while preserving target-required personalization and overall response quality. Further diagnostics show that removing key safeguards causes mismatched output support, missing ledger charges, revealing side channels, or growing long-horizon leakage.", "arxiv_id": "2608.03130", "arxiv_url": "https://arxiv.org/abs/2608.03130", "authors": ["Jong Wook Kim", "Byoungjae Min", "Kennedy Edemacu", "Yoonhyuk Choi", "Sae-Hong Cho", "Beakcheol Jang"], "brief": "\u672c\u6587\u63d0\u51fa DP-MemView\uff0c\u7528\u5dee\u5206\u9690\u79c1\u7684\u8bb0\u5fc6\u63a5\u53e3\u66ff\u4ee3\u76f4\u63a5\u8bfb\u53d6\u957f\u671f\u8bb0\u5fc6\uff0c\u4ee5\u9632\u6b62 LLM \u667a\u80fd\u4f53\u5728\u591a\u8f6e\u4e2a\u6027\u5316\u56de\u590d\u4e2d\u9010\u6b65\u6cc4\u9732\u53d7\u4fdd\u62a4\u5c5e\u6027\u3002\u65b9\u6cd5\u901a\u8fc7\u6309\u5c5e\u6027\u8bb0\u8d26\u3001\u8d85\u9884\u7b97\u56de\u9000\u901a\u7528\u89c6\u56fe\uff0c\u5e76\u8bc1\u660e\u81ea\u9002\u5e94\u5bf9\u8bdd\u8f6c\u5f55\u6ee1\u8db3\u7eaf\u5dee\u5206\u9690\u79c1\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u5c06\u53ef\u533a\u5206\u6027\u7ef4\u6301\u5728\u63a5\u8fd1\u968f\u673a\u6c34\u5e73\uff0c\u540c\u65f6\u4fdd\u7559\u5fc5\u8981\u4e2a\u6027\u5316\u548c\u56de\u590d\u8d28\u91cf\u3002", "categories": ["cs.CR", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03130", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5dee\u5206\u9690\u79c1", "\u957f\u671f\u8bb0\u5fc6", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03130v1", "published_at": "2026-08-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DP-MemView: A Memory Interface for Attribute-Level Transcript Privacy in Long-Term LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa DP-MemView\uff0c\u7528\u5dee\u5206\u9690\u79c1\u7684\u8bb0\u5fc6\u63a5\u53e3\u66ff\u4ee3\u76f4\u63a5\u8bfb\u53d6\u957f\u671f\u8bb0\u5fc6\uff0c\u4ee5\u9632\u6b62 LLM \u667a\u80fd\u4f53\u5728\u591a\u8f6e\u4e2a\u6027\u5316\u56de\u590d\u4e2d\u9010\u6b65\u6cc4\u9732\u53d7\u4fdd\u62a4\u5c5e\u6027\u3002\u65b9\u6cd5\u901a\u8fc7\u6309\u5c5e\u6027\u8bb0\u8d26\u3001\u8d85\u9884\u7b97\u56de\u9000\u901a\u7528\u89c6\u56fe\uff0c\u5e76\u8bc1\u660e\u81ea\u9002\u5e94\u5bf9\u8bdd\u8f6c\u5f55\u6ee1\u8db3\u7eaf\u5dee\u5206\u9690\u79c1\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u5c06\u53ef\u533a\u5206\u6027\u7ef4\u6301\u5728\u63a5\u8fd1\u968f\u673a\u6c34\u5e73\uff0c\u540c\u65f6\u4fdd\u7559\u5fc5\u8981\u4e2a\u6027\u5316\u548c\u56de\u590d\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multilingual multi-agent systems exhibit substantial degradation beyond English, yet prior work rarely identifies how task-critical information is lost when user requests are converted into executable plans. We study the planner in a multi-agent system as the request-to-action interface and derive an actionable taxonomy of planning-grounding failures from failed real-world task executions. LLM-based analysis shows that these failures constitute an increasing share of unsuccessful executions as language-resource availability declines, with the strongest effects in low-resource languages. To test whether the taxonomy supports mitigation, we introduce TART, Taxonomy-Guided Actionable Representation, that makes the taxonomy\u0027s key aspects explicit to the planner and downstream sub-agents. Across multiple languages, three LLM backbones, two datasets, and two agentic configurations, TART consistently improves performance. On multilingual GAIA, it raises a state-of-the-art system\u0027s accuracy by 5.6 percentage points averaged across eleven languages spanning low- to high-resource settings.", "arxiv_id": "2608.03735", "arxiv_url": "https://arxiv.org/abs/2608.03735", "authors": ["Vikas Pahuja", "Jonathan Brokman", "Omer Hofman", "Tamir Nizri", "Daniel Vishna", "Seraphina Goldfarb-Tarrant", "Kelly Marchisio", "Hisashi Kojima", "Roman Vainshtein"], "brief": "\u672c\u6587\u8bca\u65ad\u591a\u8bed\u8a00\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u4ece\u7528\u6237\u8bf7\u6c42\u5230\u53ef\u6267\u884c\u8ba1\u5212\u7684\u89c4\u5212\u843d\u5730\u5931\u8d25\uff0c\u63d0\u51fa\u4e00\u5957\u53ef\u64cd\u4f5c\u7684\u5931\u8d25\u5206\u7c7b\uff0c\u53d1\u73b0\u4f4e\u8d44\u6e90\u8bed\u8a00\u4e2d\u6b64\u7c7b\u5931\u8d25\u5360\u6bd4\u66f4\u9ad8\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa TART\uff0c\u5c06\u5206\u7c7b\u4e2d\u7684\u5173\u952e\u4fe1\u606f\u663e\u5f0f\u63d0\u4f9b\u7ed9\u89c4\u5212\u5668\u548c\u4e0b\u6e38\u667a\u80fd\u4f53\uff0c\u5728\u591a\u8bed\u8a00\u3001\u591a\u6a21\u578b\u548c\u591a\u6570\u636e\u96c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u5e76\u5728\u591a\u8bed\u8a00 GAIA \u4e0a\u5e73\u5747\u63d0\u5347 5.6 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.MA", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03735", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u8bed\u8a00", "\u89c4\u5212", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03735v1", "published_at": "2026-08-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "An Actionable Diagnosis of Multilingual, Multi-Agent Planning Failures", "tldr": "\u672c\u6587\u8bca\u65ad\u591a\u8bed\u8a00\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u4ece\u7528\u6237\u8bf7\u6c42\u5230\u53ef\u6267\u884c\u8ba1\u5212\u7684\u89c4\u5212\u843d\u5730\u5931\u8d25\uff0c\u63d0\u51fa\u4e00\u5957\u53ef\u64cd\u4f5c\u7684\u5931\u8d25\u5206\u7c7b\uff0c\u53d1\u73b0\u4f4e\u8d44\u6e90\u8bed\u8a00\u4e2d\u6b64\u7c7b\u5931\u8d25\u5360\u6bd4\u66f4\u9ad8\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa TART\uff0c\u5c06\u5206\u7c7b\u4e2d\u7684\u5173\u952e\u4fe1\u606f\u663e\u5f0f\u63d0\u4f9b\u7ed9\u89c4\u5212\u5668\u548c\u4e0b\u6e38\u667a\u80fd\u4f53\uff0c\u5728\u591a\u8bed\u8a00\u3001\u591a\u6a21\u578b\u548c\u591a\u6570\u636e\u96c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u5e76\u5728\u591a\u8bed\u8a00 GAIA \u4e0a\u5e73\u5747\u63d0\u5347 5.6 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) power educational applications from tutoring to essay scoring, but each is a point solution to a single task, and only recently have these point solutions been integrated into agents operating over a learning management system (LMS). Yet tutoring is long-horizon, since a learner improves over days and weeks rather than in a single turn, and no benchmark evaluates an agent tutor across a sustained relationship. We introduce EduClaw-Bench, a benchmark that places an agent tutor in a continuous 30-day relationship with a simulated learner grounded in knowledge tracing (KT), whose knowledge-concept mastery, from a KT model trained on real-student data, drives its answers and is probed for learning gain across 55 scenarios. Each agent is scored on three primary axes (learning gain, responsiveness, and helpfulness) and two curriculum-design axes (Gagn\u00e9 and Rosenshine), with helpfulness and the curriculum axes judged by a cross-family panel of three LLM judges. Evaluating 10 agent adapters over three base-model tiers yields two findings that single-tier, single-session evaluation cannot reach. First, tutoring quality belongs to the base model and the agent harness together rather than either alone. Second, almost no combination sustains good tutoring over the full horizon. A calibration check ($\\text{ECE}=0.049$) and a live-classroom field study confirm that the simulated learner and its measurements track reality. Our work is a step toward trustworthy AI tutors for future education.", "arxiv_id": "2608.03206", "arxiv_url": "https://arxiv.org/abs/2608.03206", "authors": ["Unggi Lee", "Sookbun Lee", "Yeil Jeong", "Eunjoo Lee", "Minchul Shin", "Hoilym Kwon"], "brief": "\u8bba\u6587\u63d0\u51fa EduClaw-Bench\uff0c\u7528\u57fa\u4e8e\u77e5\u8bc6\u8ffd\u8e2a\u548c\u771f\u5b9e\u5b66\u751f\u6570\u636e\u7684\u6a21\u62df\u5b66\u4e60\u8005\uff0c\u8bc4\u6d4b\u6559\u5b66\u578b\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u8fde\u7eed30\u5929\u8f85\u5bfc\u5173\u7cfb\u4e2d\u7684\u957f\u671f\u8868\u73b0\u3002\u5b9e\u9a8c\u8986\u76d655\u4e2a\u573a\u666f\u548c10\u79cd\u667a\u80fd\u4f53\u9002\u914d\u5668\uff0c\u53d1\u73b0\u8f85\u5bfc\u8d28\u91cf\u53d6\u51b3\u4e8e\u57fa\u7840\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u6846\u67b6\u7684\u7ec4\u5408\uff0c\u4e14\u51e0\u4e4e\u6ca1\u6709\u7ec4\u5408\u80fd\u7a33\u5b9a\u7ef4\u6301\u957f\u671f\u9ad8\u8d28\u91cf\u6559\u5b66\uff1b\u6821\u51c6\u4e0e\u771f\u5b9e\u8bfe\u5802\u7814\u7a76\u652f\u6301\u5176\u4eff\u771f\u6709\u6548\u6027\u3002", "categories": ["cs.CY", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03206", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6559\u80b2\u5927\u6a21\u578b", "\u77e5\u8bc6\u8ffd\u8e2a", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03206v1", "published_at": "2026-08-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "EduClaw-Bench: A Long-Horizon Benchmark for Pedagogical LLM Agents with Simulated Learners", "tldr": "\u8bba\u6587\u63d0\u51fa EduClaw-Bench\uff0c\u7528\u57fa\u4e8e\u77e5\u8bc6\u8ffd\u8e2a\u548c\u771f\u5b9e\u5b66\u751f\u6570\u636e\u7684\u6a21\u62df\u5b66\u4e60\u8005\uff0c\u8bc4\u6d4b\u6559\u5b66\u578b\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u8fde\u7eed30\u5929\u8f85\u5bfc\u5173\u7cfb\u4e2d\u7684\u957f\u671f\u8868\u73b0\u3002\u5b9e\u9a8c\u8986\u76d655\u4e2a\u573a\u666f\u548c10\u79cd\u667a\u80fd\u4f53\u9002\u914d\u5668\uff0c\u53d1\u73b0\u8f85\u5bfc\u8d28\u91cf\u53d6\u51b3\u4e8e\u57fa\u7840\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u6846\u67b6\u7684\u7ec4\u5408\uff0c\u4e14\u51e0\u4e4e\u6ca1\u6709\u7ec4\u5408\u80fd\u7a33\u5b9a\u7ef4\u6301\u957f\u671f\u9ad8\u8d28\u91cf\u6559\u5b66\uff1b\u6821\u51c6\u4e0e\u771f\u5b9e\u8bfe\u5802\u7814\u7a76\u652f\u6301\u5176\u4eff\u771f\u6709\u6548\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Biomedical relation extraction (BioRE) extracts structured knowledge from biomedical literature for applications such as knowledge base construction and hypothesis generation. Traditional symbolic systems such as SemRep provide high precision but limited recall, while large language models (LLMs) offer stronger contextual reasoning but remain prone to false-positive predictions. We developed ANCHOR-RE, a framework that integrates ontology-guided reasoning, external knowledge grounding, and data-driven verification rules into LLM inference. We evaluated it on three BioRE benchmarks (SemRepGS, DDI, and ChemProt) using both proprietary and open-weight LLMs. To assess generalizability beyond benchmark datasets while reducing potential evaluation bias from LLM pretraining contamination, we conducted a temporal evaluation using 100 biomedical articles published in 2026. With the proprietary backbone, ANCHOR-RE outperformed direct LLM prompting, improving micro-F1 from 0.654 to 0.676 on SemRepGS, from 0.769 to 0.872 on DDI, and from 0.939 to 0.941 on ChemProt. On DDI and ChemProt, it also outperformed previously reported inference-only methods and approached fine-tuned or instruction-tuned systems without parameter updates. Similar performance gains observed with open-weight LLMs indicate that the benefits were not limited to the proprietary backbone. On the post-cutoff set, manual assessment of 500 randomly sampled predictions yielded a precision of 69%, maintaining consistent precision on previously unseen biomedical literature. Neuro-symbolic reasoning can improve the reliability of LLM-based BioRE without fine-tuning. Results across multiple benchmarks, model families, and post-cutoff literature support ANCHOR-RE as a practical training-free approach to biomedical literature mining.", "arxiv_id": "2608.03154", "arxiv_url": "https://arxiv.org/abs/2608.03154", "authors": ["Shufan Ming", "Yikun Han", "Gibong Hong", "Rui Zhang", "Halil Kilicoglu"], "brief": "ANCHOR-RE \u5c06\u672c\u4f53\u5f15\u5bfc\u63a8\u7406\u3001\u5916\u90e8\u77e5\u8bc6 grounding \u548c\u6570\u636e\u9a71\u52a8\u9a8c\u8bc1\u89c4\u5219\u878d\u5165 LLM \u63a8\u7406\uff0c\u7528\u4e8e\u751f\u7269\u533b\u5b66\u5173\u7cfb\u62bd\u53d6\u3002\u5b83\u5728 SemRepGS\u3001DDI\u3001ChemProt \u53ca 2026 \u5e74\u6587\u732e\u65f6\u95f4\u5916\u8bc4\u6d4b\u4e2d\u6574\u4f53\u63d0\u5347 F1 \u6216\u4fdd\u6301\u7a33\u5b9a\u7cbe\u5ea6\uff0c\u65e0\u9700\u5fae\u8c03\u5373\u53ef\u63a5\u8fd1\u90e8\u5206\u8bad\u7ec3\u5f0f\u7cfb\u7edf\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03154", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u795e\u7ecf\u7b26\u53f7", "\u5173\u7cfb\u62bd\u53d6", "\u751f\u7269\u533b\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03154v1", "published_at": "2026-08-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ANCHOR-RE: An Agentic Neuro-Symbolic Framework for Grounded Biomedical Relation Extraction", "tldr": "ANCHOR-RE \u5c06\u672c\u4f53\u5f15\u5bfc\u63a8\u7406\u3001\u5916\u90e8\u77e5\u8bc6 grounding \u548c\u6570\u636e\u9a71\u52a8\u9a8c\u8bc1\u89c4\u5219\u878d\u5165 LLM \u63a8\u7406\uff0c\u7528\u4e8e\u751f\u7269\u533b\u5b66\u5173\u7cfb\u62bd\u53d6\u3002\u5b83\u5728 SemRepGS\u3001DDI\u3001ChemProt \u53ca 2026 \u5e74\u6587\u732e\u65f6\u95f4\u5916\u8bc4\u6d4b\u4e2d\u6574\u4f53\u63d0\u5347 F1 \u6216\u4fdd\u6301\u7a33\u5b9a\u7cbe\u5ea6\uff0c\u65e0\u9700\u5fae\u8c03\u5373\u53ef\u63a5\u8fd1\u90e8\u5206\u8bad\u7ec3\u5f0f\u7cfb\u7edf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-Integrated Reasoning (TIR) enables LLMs to solve complex tasks through iterative tool interactions. However, existing reinforcement learning methods often rely on trajectory-level supervision, limiting fine-grained credit assignment in long-horizon TIR scenarios. On-policy self-distillation offers denser signals through teacher branches with privileged context, but existing approaches typically derive such context from ground-truth answers or retrieved skills, which may not reflect the states actually visited by the agent. Moreover, token-level supervision fails to capture the turn-level structure of tool interactions. To address this, we propose TurnSight, a turn-level hindsight self-distillation framework that derives supervision directly from execution-conditioned hindsight. It then constructs multiple hindsight views with different lookahead horizons and selects reliable supervision through cross-horizon directional agreement. Finally, the selected hindsight signal is normalized across sibling rollouts and used to adaptively modulate RL advantages while preserving their original optimization direction. Extensive experiments on three benchmarks demonstrate the effectiveness of TurnSight. Our codes are available at https://github.com/quchangle1/TurnSight.", "arxiv_id": "2608.04007", "arxiv_url": "https://arxiv.org/abs/2608.04007", "authors": ["Changle Qu", "Sunhao Dai", "Hengyi Cai", "Yuqi Zhou", "Xinran Chen", "Simon", "Jun Xu"], "brief": "TurnSight \u9488\u5bf9\u5de5\u5177\u96c6\u6210\u63a8\u7406\u4e2d\u7684\u957f\u7a0b\u4ea4\u4e92\uff0c\u63d0\u51fa\u6309\u201c\u8f6e\u6b21\u201d\u8fdb\u884c\u7684\u4e8b\u540e\u81ea\u84b8\u998f\uff0c\u4ece\u5b9e\u9645\u6267\u884c\u8f68\u8ff9\u4e2d\u6784\u9020\u4e0d\u540c\u524d\u77bb\u8303\u56f4\u7684\u76d1\u7763\u4fe1\u53f7\u3002\u5b83\u901a\u8fc7\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u7b5b\u9009\u53ef\u9760\u53cd\u9988\uff0c\u5e76\u8c03\u5236\u5f3a\u5316\u5b66\u4e60\u4f18\u52bf\uff0c\u5728\u4e09\u4e2a\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u5de5\u5177\u8c03\u7528\u63a8\u7406\u6548\u679c\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/quchangle1/TurnSight", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04007", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f"], "num_comments": 1, "on_hf": true, "organization": "Renmin University of China", "pdf_url": "https://arxiv.org/pdf/2608.04007v1", "published_at": "2026-08-04", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04007.png", "title": "TurnSight: Turn-Level Hindsight Self-Distillation for Tool-Integrated Reasoning", "tldr": "TurnSight \u9488\u5bf9\u5de5\u5177\u96c6\u6210\u63a8\u7406\u4e2d\u7684\u957f\u7a0b\u4ea4\u4e92\uff0c\u63d0\u51fa\u6309\u201c\u8f6e\u6b21\u201d\u8fdb\u884c\u7684\u4e8b\u540e\u81ea\u84b8\u998f\uff0c\u4ece\u5b9e\u9645\u6267\u884c\u8f68\u8ff9\u4e2d\u6784\u9020\u4e0d\u540c\u524d\u77bb\u8303\u56f4\u7684\u76d1\u7763\u4fe1\u53f7\u3002\u5b83\u901a\u8fc7\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u7b5b\u9009\u53ef\u9760\u53cd\u9988\uff0c\u5e76\u8c03\u5236\u5f3a\u5316\u5b66\u4e60\u4f18\u52bf\uff0c\u5728\u4e09\u4e2a\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u5de5\u5177\u8c03\u7528\u63a8\u7406\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Benchmark gains are often treated as evidence of greater LLM capability. Yet the same gain can reflect different changes in model behavior. A model may reach new answers, or produce answers that were already within reach. Aggregate scores do not distinguish these changes question by question. We establish a question-level audit under fixed budgets, temperatures, and answer formats. A question is realized when the default deployment procedure produces the correct answer. A question is reachable when a specified probe finds that answer within a fixed budget. We first test whether inference-time layer routing can expand reachability. Under a matched budget, random routes match or exceed structured search in all 43 model and task settings. Answer-blind procedures retain almost none of this gain, which instead requires access to the correct answer. We then ask why reachable answers sometimes fail to appear. Across six cases spanning 0.5B to 31B, silencing one identified MLP block repairs 68 to 92 percent of a predefined failure set. We next test whether training closes the gap by expanding reachability. In five of six matched evaluations, deployed performance rises while the reachable ceiling remains flat or falls. For DAPO, the deployed score rises by 14.7 points while the reachable ceiling falls by 13.3 points. Across the settings we audit, realization and reachability therefore do not always change together. Claims of capability expansion should report both realized performance and reachability under matched evaluation conditions. Code is available at https://github.com/LiZaiyuan0619/reachability-not-realization", "arxiv_id": "2608.03219", "arxiv_url": "https://arxiv.org/abs/2608.03219", "authors": ["Yanchao Li", "Wanhao Liu", "Jiaqing Xie", "Ben Gao", "Yanbo Wang", "Tianfan Fu", "Yuqiang Li"], "brief": "\u672c\u6587\u63d0\u51fa\u533a\u5206\u5927\u6a21\u578b\u57fa\u51c6\u63d0\u5347\u4e2d\u7684\u201c\u53ef\u8fbe\u6027\u201d\u548c\u201c\u5b9e\u73b0\u6027\u201d\uff1a\u7b54\u6848\u53ef\u80fd\u672c\u6765\u53ef\u88ab\u63a2\u6d4b\u5230\uff0c\u4f46\u9ed8\u8ba4\u63a8\u7406\u672a\u80fd\u4ea7\u51fa\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5c42\u8def\u7531\u5e26\u6765\u7684\u53ef\u8fbe\u6027\u589e\u76ca\u591a\u4f9d\u8d56\u6b63\u786e\u7b54\u6848\u4fe1\u606f\uff0c\u8bad\u7ec3\u5e38\u63d0\u5347\u90e8\u7f72\u5f97\u5206\u5374\u4e0d\u6269\u5c55\u53ef\u8fbe\u4e0a\u9650\uff0c\u5e76\u4e14\u5c4f\u853d\u7279\u5b9a MLP \u5757\u53ef\u4fee\u590d\u5927\u91cf\u5931\u8d25\u6837\u672c\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03219", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u53ef\u8fbe\u6027", "\u6a21\u578b\u884c\u4e3a\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03219v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reachability Is Not Realization: Tracing the Sources of LLM Benchmark Gains", "tldr": "\u672c\u6587\u63d0\u51fa\u533a\u5206\u5927\u6a21\u578b\u57fa\u51c6\u63d0\u5347\u4e2d\u7684\u201c\u53ef\u8fbe\u6027\u201d\u548c\u201c\u5b9e\u73b0\u6027\u201d\uff1a\u7b54\u6848\u53ef\u80fd\u672c\u6765\u53ef\u88ab\u63a2\u6d4b\u5230\uff0c\u4f46\u9ed8\u8ba4\u63a8\u7406\u672a\u80fd\u4ea7\u51fa\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5c42\u8def\u7531\u5e26\u6765\u7684\u53ef\u8fbe\u6027\u589e\u76ca\u591a\u4f9d\u8d56\u6b63\u786e\u7b54\u6848\u4fe1\u606f\uff0c\u8bad\u7ec3\u5e38\u63d0\u5347\u90e8\u7f72\u5f97\u5206\u5374\u4e0d\u6269\u5c55\u53ef\u8fbe\u4e0a\u9650\uff0c\u5e76\u4e14\u5c4f\u853d\u7279\u5b9a MLP \u5757\u53ef\u4fee\u590d\u5927\u91cf\u5931\u8d25\u6837\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Foundation models place language throughout embodied agents, but its presence does not show what it contributes or how well that contribution is grounded. This survey separates these two questions. We define five non-exclusive functional roles for language: Specification, Embodied Representation, Action Orchestration, Grounding Regulation, and Execution Coupling. For each role, we trace the path from linguistic content to its embodied consumer and identify the observations or interventions that can test the claimed responsibility. Applying this framework to the reviewed literature reveals a recurring gap between functional use and evidential support. Interpretable or revised linguistic intermediates may be incorrect, go unused, or fail to affect later behavior. Even when actions are directly conditioned on language, system-level success does not by itself isolate language\u0027s contribution. We therefore evaluate grounding claim by claim, asking whether the reported evidence supports the specific responsibility assigned to language. Using role claims rather than architectures as the unit of comparison allows us to compare modular and end-to-end embodied agents without extending conclusions beyond the reported evidence.", "arxiv_id": "2608.03099", "arxiv_url": "https://arxiv.org/abs/2608.03099", "authors": ["Yifan Guo", "Chenghao Li", "Zhu Wang", "Wei Xu", "Yu Li", "Yulong Zhu", "Zhuo Sun", "Bin Guo", "Zhiwen Yu"], "brief": "\u672c\u6587\u7efc\u8ff0\u5177\u8eab\u667a\u80fd\u4f53\u4e2d\u8bed\u8a00\u7684\u529f\u80fd\u4e0e\u8bc1\u636e\u57fa\u7840\uff0c\u63d0\u51fa\u4e94\u7c7b\u8bed\u8a00\u89d2\u8272\uff1a\u4efb\u52a1\u89c4\u683c\u3001\u5177\u8eab\u8868\u5f81\u3001\u52a8\u4f5c\u7f16\u6392\u3001 grounding \u8c03\u8282\u4e0e\u6267\u884c\u8026\u5408\u3002\u4f5c\u8005\u6307\u51fa\u73b0\u6709\u7814\u7a76\u5e38\u628a\u8bed\u8a00\u201c\u88ab\u4f7f\u7528\u201d\u548c\u201c\u786e\u5b9e\u652f\u6491\u884c\u4e3a\u201d\u6df7\u4e3a\u4e00\u8c08\uff0c\u8bb8\u591a\u4e2d\u95f4\u8bed\u8a00\u8868\u793a\u53ef\u80fd\u9519\u8bef\u3001\u672a\u88ab\u4f7f\u7528\u6216\u65e0\u6cd5\u5f71\u54cd\u6700\u7ec8\u884c\u4e3a\uff0c\u56e0\u6b64\u4e3b\u5f20\u6309\u5177\u4f53\u529f\u80fd\u58f0\u660e\u9010\u9879\u8bc4\u4f30 grounding \u8bc1\u636e\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03099", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5177\u8eab\u667a\u80fd", "\u8bed\u8a00 grounding", "\u7efc\u8ff0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03099v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Language Does and What the Evidence Supports: A Functional Role Taxonomy and Evidence Audit of Language Grounding in Embodied Agents", "tldr": "\u672c\u6587\u7efc\u8ff0\u5177\u8eab\u667a\u80fd\u4f53\u4e2d\u8bed\u8a00\u7684\u529f\u80fd\u4e0e\u8bc1\u636e\u57fa\u7840\uff0c\u63d0\u51fa\u4e94\u7c7b\u8bed\u8a00\u89d2\u8272\uff1a\u4efb\u52a1\u89c4\u683c\u3001\u5177\u8eab\u8868\u5f81\u3001\u52a8\u4f5c\u7f16\u6392\u3001 grounding \u8c03\u8282\u4e0e\u6267\u884c\u8026\u5408\u3002\u4f5c\u8005\u6307\u51fa\u73b0\u6709\u7814\u7a76\u5e38\u628a\u8bed\u8a00\u201c\u88ab\u4f7f\u7528\u201d\u548c\u201c\u786e\u5b9e\u652f\u6491\u884c\u4e3a\u201d\u6df7\u4e3a\u4e00\u8c08\uff0c\u8bb8\u591a\u4e2d\u95f4\u8bed\u8a00\u8868\u793a\u53ef\u80fd\u9519\u8bef\u3001\u672a\u88ab\u4f7f\u7528\u6216\u65e0\u6cd5\u5f71\u54cd\u6700\u7ec8\u884c\u4e3a\uff0c\u56e0\u6b64\u4e3b\u5f20\u6309\u5177\u4f53\u529f\u80fd\u58f0\u660e\u9010\u9879\u8bc4\u4f30 grounding \u8bc1\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large-scale pretraining corpora contain substantial duplicate content. Although document-level deduplication is widely used, removing subdocument-level redundancy remains challenging. At corpus scale, suffix-array-based methods are commonly applied independently within shards, leaving cross-shard duplicates undetected and making the resulting retention behavior sensitive to the sharding configuration. Hash-based methods enable global exact duplicate counting, but often rely on fixed copy-retention policies that cannot accommodate heterogeneous repetition patterns. We propose a scalable subdocument deduplication framework that decouples duplicate detection from copy retention. It identifies duplicate groups through natural-boundary segmentation, normalized exact hashing, and distributed aggregation, and then applies an explicit frequency- and length-aware retention policy that allocates an adaptive copy budget to each group, retaining more copies of low-frequency or short repetitions while more aggressively deleting high-frequency or long ones. Experiments on FineWeb-Edu and a code-containing web corpus show that models trained on data processed by our method achieve the best overall performance among the evaluated settings. These results underscore the importance of explicit copy-retention control.", "arxiv_id": "2608.03089", "arxiv_url": "https://arxiv.org/abs/2608.03089", "authors": ["Hai Wang", "Chenhao Wang", "Qifeng Cai", "Yixiu Liu", "Miao Peng", "Nuo Chen", "Yuanlin Tu", "Chengcheng Xu", "Feng Zhang"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u8bed\u6599\u7684\u53ef\u6269\u5c55\u5b50\u6587\u6863\u53bb\u91cd\u6846\u67b6\uff0c\u5c06\u91cd\u590d\u68c0\u6d4b\u4e0e\u526f\u672c\u4fdd\u7559\u7b56\u7565\u89e3\u8026\u3002\u65b9\u6cd5\u901a\u8fc7\u81ea\u7136\u8fb9\u754c\u5207\u5206\u3001\u89c4\u8303\u5316\u7cbe\u786e\u54c8\u5e0c\u548c\u5206\u5e03\u5f0f\u805a\u5408\u53d1\u73b0\u5168\u5c40\u91cd\u590d\uff0c\u5e76\u6309\u9891\u7387\u4e0e\u957f\u5ea6\u81ea\u9002\u5e94\u4fdd\u7559\u526f\u672c\uff0c\u5728 FineWeb-Edu \u548c\u542b\u4ee3\u7801\u7f51\u9875\u8bed\u6599\u4e0a\u5e26\u6765\u66f4\u597d\u7684\u6574\u4f53\u6a21\u578b\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03089", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u636e\u53bb\u91cd", "\u9884\u8bad\u7ec3\u8bed\u6599", "\u6570\u636e\u6e05\u6d17"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03089v1", "published_at": "2026-08-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Scalable Frequency- and Length-Aware Subdocument Deduplication for Large Language Model Pretraining", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u8bed\u6599\u7684\u53ef\u6269\u5c55\u5b50\u6587\u6863\u53bb\u91cd\u6846\u67b6\uff0c\u5c06\u91cd\u590d\u68c0\u6d4b\u4e0e\u526f\u672c\u4fdd\u7559\u7b56\u7565\u89e3\u8026\u3002\u65b9\u6cd5\u901a\u8fc7\u81ea\u7136\u8fb9\u754c\u5207\u5206\u3001\u89c4\u8303\u5316\u7cbe\u786e\u54c8\u5e0c\u548c\u5206\u5e03\u5f0f\u805a\u5408\u53d1\u73b0\u5168\u5c40\u91cd\u590d\uff0c\u5e76\u6309\u9891\u7387\u4e0e\u957f\u5ea6\u81ea\u9002\u5e94\u4fdd\u7559\u526f\u672c\uff0c\u5728 FineWeb-Edu \u548c\u542b\u4ee3\u7801\u7f51\u9875\u8bed\u6599\u4e0a\u5e26\u6765\u66f4\u597d\u7684\u6574\u4f53\u6a21\u578b\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier AI model developers increasingly rely on layered safeguards to prevent catastrophic misuse, but little public evidence exists on how much protection these safeguards provide, or how consistently across developers. We introduce the FAR.AI Minimal Standard for Safeguards, Version 1.0: a taxonomy of 67 readily accessible static jailbreak techniques, a method for composing them into a very large attack space, and a benchmark of flagship models against a sample of it. We evaluate Claude Fable 5, GPT-5.6 Sol, Gemini 3.1 Pro, and Grok 4.5 on two complementary datasets totalling 360 attacker goals spanning chemical, biological, radiological/nuclear and explosive (CBRNE) threats and offensive cyber, using a three-stage funnel to identify universal jailbreaks: single prompt templates that elicit operationally compliant responses on over 75% of a domain\u0027s goals. We also introduce a cost-to-jailbreak metric that models attacker spend directly, with right-censored lower bounds where no universal jailbreak was found. Robustness is highly uneven: the cost to break these models varies over a hundredfold. Random search over our technique pool found 63 universal jailbreaks against Grok 4.5 and 18 against Gemini 3.1 Pro, at an average cost of roughly $58 and $278 per jailbreak found; expert-guided composition raised these to 385 and 231. Neither Claude Fable 5 nor GPT-5.6 Sol yielded any universal jailbreak under either strategy. Because meeting the Minimal Standard requires only defenses already publicly described and deployed in production elsewhere, these gaps appear closable with current techniques. We recommend defense-in-depth combining reasoning, activation, and input/output monitoring. Results are maintained at leaderboard.far.ai.", "arxiv_id": "2608.03070", "arxiv_url": "https://arxiv.org/abs/2608.03070", "authors": ["Jasper Timm", "Lukas Struppek", "Ziwei Xu", "Grace Cheong", "Oscar Mata", "Dan Zhao", "Mick Yang", "Isadora De Andrade", "Xiaojun Jia", "Yiming
