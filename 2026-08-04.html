<script>
const PAPERS = [{"abstract": "Large language model agents are increasingly evaluated as autonomous tool users, yet most benchmarks focus on bounded tasks with immediate success criteria. Real-world deployments often require Long-Term Coherence, the capacity to preserve purposeful behavior across extended horizons while adapting decisions to accumulated evidence. Evaluating this capacity requires a persistent environment in which actions constrain future choices, feedback arrives at heterogeneous delays, and incoherent behavior produces measurable cumulative effects. Seller-side e-commerce provides a suitable setting for this evaluation through recurrent and interdependent decisions over Product Sourcing, Listing and Pricing Control, Cash-Flow Management, and Mixed-Latency Feedback Adaptation. We introduce MerchantBench, a 365-day order-level simulation grounded in 98,843 real e-commerce product records and equipped with 26 tools for agent interaction. MerchantBench couples promptly observable Upstream Supplier Events with delayed Downstream Order Outcomes, requiring agents to follow individual order lifecycles and revisit earlier decisions. We evaluate eight LLMs under two agent frameworks in 48 runs, each spanning 365 simulated days. Our results reveal a substantial gap between even the latest LLMs and human participants, with the best LLM configuration attaining only 27.3\\% of the mean final net assets achieved by human participants.", "arxiv_id": "2607.28956", "arxiv_url": "https://arxiv.org/abs/2607.28956", "authors": ["Qiming Shi", "Yulong Tao", "Linbo Jin", "Zhaolu Kang", "Yibo Dou", "Jiawen Zhu", "Tianjun Pan", "Shaokang Fu", "Chengyu Wang", "Siyue Li", "Yaping Cheng", "Di Weng", "Chengfu Huo"], "brief": "\u8bba\u6587\u63d0\u51fa MerchantBench\uff0c\u4e00\u4e2a\u9762\u5411\u5356\u5bb6\u4fa7\u7535\u5546\u8fd0\u8425\u7684\u957f\u5468\u671f\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u7528365\u5929\u8ba2\u5355\u7ea7\u4eff\u771f\u548c\u771f\u5b9e\u5546\u54c1\u6570\u636e\uff0c\u8003\u5bdfLLM\u667a\u80fd\u4f53\u5728\u91c7\u8d2d\u3001\u4e0a\u67b6\u5b9a\u4ef7\u3001\u73b0\u91d1\u6d41\u548c\u5ef6\u8fdf\u53cd\u9988\u9002\u5e94\u4e2d\u7684\u957f\u671f\u4e00\u81f4\u6027\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/KhanCold/merchantbench", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2607.28956", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u57fa\u4e8e98,843\u6761\u771f\u5b9e\u7535\u5546\u5546\u54c1\u8bb0\u5f55\uff0c\u63d0\u4f9b26\u4e2a\u4ea4\u4e92\u5de5\u5177\uff0c\u6a21\u62df365\u5929\u8fde\u7eed\u7ecf\u8425\u73af\u5883", "\u73af\u5883\u540c\u65f6\u5305\u542b\u53ef\u5373\u65f6\u89c2\u5bdf\u7684\u4e0a\u6e38\u4f9b\u5e94\u5546\u4e8b\u4ef6\u548c\u5ef6\u8fdf\u51fa\u73b0\u7684\u4e0b\u6e38\u8ba2\u5355\u7ed3\u679c\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u8ffd\u8e2a\u8ba2\u5355\u751f\u547d\u5468\u671f\u5e76\u4fee\u6b63\u65e9\u671f\u51b3\u7b56", "\u8bc4\u6d4b8\u4e2aLLM\u30012\u79cd\u667a\u80fd\u4f53\u6846\u67b6\u517148\u6b21\u8fd0\u884c\uff0c\u6700\u4f73LLM\u6700\u7ec8\u51c0\u8d44\u4ea7\u4ec5\u8fbe\u4eba\u7c7b\u5e73\u5747\u6c34\u5e73\u768427.3%"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u7535\u5546\u8fd0\u8425", "\u957f\u671f\u89c4\u5212"], "num_comments": 2, "on_hf": true, "organization": "alibaba", "pdf_url": "https://arxiv.org/pdf/2607.28956v2", "published_at": "2026-07-31", "score": 0.739, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28956.png", "title": "MerchantBench: Benchmarking LLM Agents for Long-Term Coherence in E-Commerce Operations", "tldr": "\u7535\u5546\u957f\u5468\u671f\u7ecf\u8425\u667a\u80fd\u4f53\u57fa\u51c6\u63ed\u793aLLM\u663e\u8457\u843d\u540e\u4eba\u7c7b", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa MerchantBench\uff0c\u4e00\u4e2a\u9762\u5411\u5356\u5bb6\u4fa7\u7535\u5546\u8fd0\u8425\u7684\u957f\u5468\u671f\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u7528365\u5929\u8ba2\u5355\u7ea7\u4eff\u771f\u548c\u771f\u5b9e\u5546\u54c1\u6570\u636e\uff0c\u8003\u5bdfLLM\u667a\u80fd\u4f53\u5728\u91c7\u8d2d\u3001\u4e0a\u67b6\u5b9a\u4ef7\u3001\u73b0\u91d1\u6d41\u548c\u5ef6\u8fdf\u53cd\u9988\u9002\u5e94\u4e2d\u7684\u957f\u671f\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u77ed\u671f\u4efb\u52a1\u6210\u529f\u7387\u6269\u5c55\u5230\u771f\u5b9e\u90e8\u7f72\u66f4\u5173\u952e\u7684\u957f\u671f\u4e00\u81f4\u6027\u3001\u7d2f\u79ef\u51b3\u7b56\u540e\u679c\u4e0e\u6df7\u5408\u5ef6\u8fdf\u53cd\u9988\uff0c\u4e3a\u8861\u91cfLLM\u5728\u590d\u6742\u5546\u4e1a\u8fd0\u8425\u4e2d\u7684\u53ef\u7528\u6027\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u73b0\u5b9e\u7684\u57fa\u51c6\u3002"}, {"abstract": "Large language model (LLM) agents can self-evolve by continually improving from their own accumulated experience. However, existing studies predominantly adopt independent evaluation. Consequently, the behavior of self-evolving agents in realistic streaming settings, where agents adapt to diverse and complex task streams, remains poorly understood. To address this gap, we introduce AgentStream, a unified framework that evaluates self-evolving agents spanning diverse evolution components by organizing agentic benchmarks into a configurable task stream and instantiating the \\texttt{Isolated}, \\texttt{Sequential}, and \\texttt{Interleaved} streaming scenarios at test time, which progressively vary the scope and domain composition of the stream. Over these scenarios, we combinatorially evaluate five representative self-evolving methods across three frontier foundation models, disentangling how model capability, method architecture, and streaming scenario jointly shape self-evolution. Our results show that self-evolution reliability varies across streaming scenarios, the benefit of self-evolution is gated by model capability and non-monotonic in model strength, and no single method dominates across models and scenarios. These findings offer concrete guidance for selecting self-evolving methods across models and streaming scenarios. Overall, we advocate that self-evolving agents should be evaluated under realistic task streams rather than isolated single-task settings.", "arxiv_id": "2608.00155", "arxiv_url": "https://arxiv.org/abs/2608.00155", "authors": ["Dong Yan", "Jian Liang", "Dapeng Hu", "Ran He", "Nicholas Jing Yuan", "Qi Zhang", "Tieniu Tan"], "brief": "\u8bba\u6587\u63d0\u51fa AgentStream\uff0c\u4e00\u4e2a\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6\uff0c\u5c06\u591a\u79cd\u667a\u80fd\u4f53\u57fa\u51c6\u7ec4\u7ec7\u4e3a\u53ef\u914d\u7f6e\u4efb\u52a1\u6d41\uff0c\u7528\u4e8e\u8003\u5bdf\u81ea\u8fdb\u5316 LLM \u667a\u80fd\u4f53\u5728 Isolated\u3001Sequential\u3001Interleaved \u7b49\u6d41\u5f0f\u573a\u666f\u4e0b\u7684\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/Jasper-Yan/AgentStream", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.00155", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7ec4\u5408\u8bc4\u6d4b\u4e865\u79cd\u4ee3\u8868\u6027\u81ea\u8fdb\u5316\u65b9\u6cd5\u30013\u4e2a\u524d\u6cbf\u57fa\u7840\u6a21\u578b\uff0c\u4ee5\u53ca\u591a\u79cd\u4efb\u52a1\u6d41\u573a\u666f\u3002", "\u53d1\u73b0\u81ea\u8fdb\u5316\u6536\u76ca\u53d7\u6a21\u578b\u80fd\u529b\u663e\u8457\u5236\u7ea6\uff0c\u4e14\u5e76\u975e\u6a21\u578b\u8d8a\u5f3a\u6536\u76ca\u8d8a\u5355\u8c03\u589e\u52a0\u3002", "\u4e0d\u540c\u65b9\u6cd5\u5728\u4e0d\u540c\u6a21\u578b\u548c\u6d41\u5f0f\u573a\u666f\u4e0b\u8868\u73b0\u5dee\u5f02\u660e\u663e\uff0c\u6ca1\u6709\u5355\u4e00\u65b9\u6cd5\u5168\u9762\u5360\u4f18\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u8fdb\u5316", "\u8bc4\u6d4b\u57fa\u51c6", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2608.00155v1", "published_at": "2026-07-31", "score": 0.732, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00155.png", "title": "AgentStream: How Well Do Self-Evolving LLM Agents Perform Under Streaming Tasks?", "tldr": "\u8bc4\u6d4b\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u5728\u6d41\u5f0f\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\u3002", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa AgentStream\uff0c\u4e00\u4e2a\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6\uff0c\u5c06\u591a\u79cd\u667a\u80fd\u4f53\u57fa\u51c6\u7ec4\u7ec7\u4e3a\u53ef\u914d\u7f6e\u4efb\u52a1\u6d41\uff0c\u7528\u4e8e\u8003\u5bdf\u81ea\u8fdb\u5316 LLM \u667a\u80fd\u4f53\u5728 Isolated\u3001Sequential\u3001Interleaved \u7b49\u6d41\u5f0f\u573a\u666f\u4e0b\u7684\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u4f20\u7edf\u5355\u4efb\u52a1\u72ec\u7acb\u8bc4\u6d4b\u4e0d\u8db3\u4ee5\u53cd\u6620\u771f\u5b9e\u667a\u80fd\u4f53\u90e8\u7f72\u73af\u5883\uff0c\u4e3a\u81ea\u8fdb\u5316 LLM \u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u3001\u65b9\u6cd5\u9009\u62e9\u548c\u5b9e\u9645\u5e94\u7528\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u73b0\u5b9e\u7684\u5206\u6790\u6846\u67b6\u3002"}, {"abstract": "Sparse retrieval underpins modern search systems, from web search to retrieval-augmented generation. Existing work has introduced Learned Sparse Retrieval (LSR) to push beyond exact lexical matching toward richer semantics. Yet LSR has so far remained tied to encoder-style bidirectional architectures, and its extension to multimodal settings still relies heavily on auxiliary cross-modal modules. To address these limitations, we introduce UEmbed (Unified Embedding), a decoder-only multimodal embedding model that produces both sparse lexical and dense representations in one causal forward pass. UEmbed appends N learnable special tokens to the input and partitions the vocabulary into N disjoint subsets. Each token\u0027s causal hidden state predicts sparse weights over its assigned subset, and the N subsets are concatenated into the full sparse vector. Trained on public data, we release UEmbed at 2B, 4B, and 9B scales. UEmbed-9B reaches 71.8 (dense) and 71.0 (sparse) on MMEB-v2, outperforming multimodal embedding models trained on publicly available data (e.g., RzenEmbed). On BEIR, UEmbed also remains competitive with strong dense and sparse baselines. Furthermore, we demonstrate the practical utility of UEmbed across three dimensions: effectiveness, efficiency, and agentic applications. Overall, UEmbed offers a new paradigm: it unifies dense and sparse embeddings in one model, while further extending sparse retrieval to unify text and multimodal inputs.", "arxiv_id": "2608.02583", "arxiv_url": "https://arxiv.org/abs/2608.02583", "authors": ["Tingyu Song", "Mingxin Li", "Yanzhao Zhang", "Dingkun Long", "Pengjun Xie", "Zhijie Nie", "Yilun Zhao", "Shu Wu"], "brief": "\u8bba\u6587\u63d0\u51fa UEmbed\uff0c\u4e00\u4e2a decoder-only \u591a\u6a21\u6001\u5d4c\u5165\u6a21\u578b\uff0c\u53ef\u5728\u4e00\u6b21\u56e0\u679c\u524d\u5411\u4e2d\u540c\u65f6\u751f\u6210\u7a00\u758f\u8bcd\u6c47\u8868\u793a\u548c\u7a20\u5bc6\u5411\u91cf\u8868\u793a\uff0c\u5e76\u652f\u6301\u6587\u672c\u4e0e\u591a\u6a21\u6001\u8f93\u5165\u7684\u7edf\u4e00\u68c0\u7d22\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.IR"], "github_repo": "https://github.com/Alibaba-NLP/UEmbed", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2608.02583", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u8ffd\u52a0 N \u4e2a\u53ef\u5b66\u4e60\u7279\u6b8a token\uff0c\u5e76\u5c06\u8bcd\u8868\u5212\u5206\u4e3a N \u4e2a\u4e0d\u76f8\u4ea4\u5b50\u96c6\uff0c\u8ba9\u6bcf\u4e2a token \u9884\u6d4b\u5bf9\u5e94\u5b50\u96c6\u7684\u7a00\u758f\u6743\u91cd\uff0c\u62fc\u63a5\u5f97\u5230\u5b8c\u6574\u7a00\u758f\u5411\u91cf\u3002", "\u53d1\u5e03 2B\u30014B\u30019B \u89c4\u6a21\u6a21\u578b\uff1bUEmbed-9B \u5728 MMEB-v2 \u4e0a\u53d6\u5f97 71.8 \u7a20\u5bc6\u5206\u548c 71.0 \u7a00\u758f\u5206\uff0c\u4f18\u4e8e\u516c\u5f00\u6570\u636e\u8bad\u7ec3\u7684\u591a\u6a21\u6001\u5d4c\u5165\u6a21\u578b\u5982 RzenEmbed\u3002", "\u5728 BEIR \u6587\u672c\u68c0\u7d22\u57fa\u51c6\u4e0a\u4e5f\u4fdd\u6301\u4e0e\u5f3a\u7a20\u5bc6\u3001\u7a00\u758f\u57fa\u7ebf\u7ade\u4e89\u529b\uff0c\u5e76\u5c55\u793a\u4e86\u5728\u6548\u679c\u3001\u6548\u7387\u548c\u667a\u80fd\u4f53\u5e94\u7528\u4e2d\u7684\u5b9e\u7528\u6027\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u4fe1\u606f\u68c0\u7d22", "\u7a00\u758f\u68c0\u7d22", "\u5d4c\u5165\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "Alibaba-NLP", "pdf_url": "https://arxiv.org/pdf/2608.02583v1", "published_at": "2026-08-03", "score": 0.709, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (43\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02583.png", "title": "UEmbed: Unified Sparse and Dense Multimodal Embeddings", "tldr": "\u7edf\u4e00\u7a00\u758f\u4e0e\u7a20\u5bc6\u7684\u591a\u6a21\u6001\u68c0\u7d22\u5d4c\u5165\u6a21\u578b", "upvotes": 43, "what_it_is": "\u8bba\u6587\u63d0\u51fa UEmbed\uff0c\u4e00\u4e2a decoder-only \u591a\u6a21\u6001\u5d4c\u5165\u6a21\u578b\uff0c\u53ef\u5728\u4e00\u6b21\u56e0\u679c\u524d\u5411\u4e2d\u540c\u65f6\u751f\u6210\u7a00\u758f\u8bcd\u6c47\u8868\u793a\u548c\u7a20\u5bc6\u5411\u91cf\u8868\u793a\uff0c\u5e76\u652f\u6301\u6587\u672c\u4e0e\u591a\u6a21\u6001\u8f93\u5165\u7684\u7edf\u4e00\u68c0\u7d22\u3002", "why_notable": "\u5b83\u6253\u7834\u4e86\u5b66\u4e60\u578b\u7a00\u758f\u68c0\u7d22\u4f9d\u8d56\u53cc\u5411\u7f16\u7801\u5668\u548c\u989d\u5916\u8de8\u6a21\u6001\u6a21\u5757\u7684\u9650\u5236\uff0c\u7528\u5355\u4e00 decoder-only \u591a\u6a21\u6001\u6a21\u578b\u7edf\u4e00\u7a00\u758f\u4e0e\u7a20\u5bc6\u68c0\u7d22\u8868\u793a\uff0c\u5bf9\u641c\u7d22\u3001RAG \u548c\u591a\u6a21\u6001\u68c0\u7d22\u7cfb\u7edf\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Speech and audio generation is often needed in animation dubbing, audio drama, movies, advertising, games, podcasts, and short-video production. In these scenarios, creators may need to design voices without reference recordings, control speaker styles with natural language, support acoustic scenes with environments and audio effects, and later reuse the designed voices. Therefore, it is important to support multi-speaker speech and audio generation for both instruct and zero-shot tasks. The instruct task requires a caption of the environment, speaker styles, and fine-grained content, while the zero-shot task uses reference audio together with the same fine-grained content. We address these tasks from both the data and model sides. First, we propose SwanData-Caption, which cleans raw speech and audio data, adds targeted synthetic coverage, and annotates diverse and accurate multi-level captions. Then, we propose SwanTale, a multi-speaker expressive speech and audio generation model that supports both zero-shot and instruct tasks. We introduce SwanVAE to support high-quality multi-audio-modality generation. Then, we adopt reward-conditioned quality control and Engram conditioning, along with Unified MoE for multi-task and multi-audio-modality modeling. In addition, we use curriculum learning and GRPO post-training to let the model progressively learn and strengthen its capabilities. Experimental results show that SwanTale leads on multiple key zero-shot and instruct metrics, achieves the best expressiveness scores in both tasks, and supports complex instruct generation involving multi-speaker speech and audio. Demos can be found at https://swanaigc.github.io/#swantale.", "arxiv_id": "2608.02023", "arxiv_url": "https://arxiv.org/abs/2608.02023", "authors": ["Yu Zhang", "Ruiqi Li", "Changhao Pan", "Ke Lei", "Xiang Yin", "Cheng Yang"], "brief": "\u8bba\u6587\u63d0\u51fa SwanData-Caption \u6570\u636e\u96c6\u6784\u5efa\u6d41\u7a0b\u4e0e SwanTale \u751f\u6210\u6a21\u578b\uff0c\u7edf\u4e00\u652f\u6301\u6587\u672c\u6307\u4ee4\u5f0f\u4e0e\u53c2\u8003\u97f3\u9891\u96f6\u6837\u672c\u7684\u591a\u8bf4\u8bdd\u4eba\u8bed\u97f3/\u97f3\u9891\u751f\u6210\u3002\u6a21\u578b\u53ef\u6309\u81ea\u7136\u8bed\u8a00\u63a7\u5236\u8bf4\u8bdd\u4eba\u98ce\u683c\u3001\u73af\u5883\u58f0\u3001\u97f3\u6548\u4e0e\u7ec6\u7c92\u5ea6\u5185\u5bb9\uff0c\u5e76\u652f\u6301\u590d\u7528\u8bbe\u8ba1\u51fa\u7684\u58f0\u97f3\u3002", "categories": ["eess.AS", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02023", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa SwanData-Caption\uff1a\u6e05\u6d17\u539f\u59cb\u8bed\u97f3\u97f3\u9891\u3001\u8865\u5145\u5408\u6210\u8986\u76d6\uff0c\u5e76\u6807\u6ce8\u591a\u5c42\u7ea7\u7cbe\u786e caption", "\u63d0\u51fa SwanVAE \u652f\u6301\u9ad8\u8d28\u91cf\u591a\u97f3\u9891\u6a21\u6001\u751f\u6210\uff0c\u5e76\u7ed3\u5408 Unified MoE \u8fdb\u884c\u591a\u4efb\u52a1\u3001\u591a\u6a21\u6001\u5efa\u6a21", "\u5f15\u5165 reward-conditioned \u8d28\u91cf\u63a7\u5236\u3001Engram conditioning\u3001\u8bfe\u7a0b\u5b66\u4e60\u4e0e GRPO \u540e\u8bad\u7ec3\uff0c\u63d0\u5347\u590d\u6742\u6307\u4ee4\u9075\u5faa\u548c\u8868\u8fbe\u529b"], "keywords": ["\u8bed\u97f3\u751f\u6210", "\u97f3\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u96f6\u6837\u672c\u751f\u6210"], "num_comments": 7, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2608.02023v2", "published_at": "2026-08-03", "score": 0.58, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (141\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02023.png", "title": "SwanTale: Unified Multi-Speaker Speech and Audio Generation for Instruct and Zero-Shot Tasks", "tldr": "\u7edf\u4e00\u591a\u8bf4\u8bdd\u4eba\u8bed\u97f3\u4e0e\u97f3\u9891\u751f\u6210\u6846\u67b6", "upvotes": 141, "what_it_is": "\u8bba\u6587\u63d0\u51fa SwanData-Caption \u6570\u636e\u96c6\u6784\u5efa\u6d41\u7a0b\u4e0e SwanTale \u751f\u6210\u6a21\u578b\uff0c\u7edf\u4e00\u652f\u6301\u6587\u672c\u6307\u4ee4\u5f0f\u4e0e\u53c2\u8003\u97f3\u9891\u96f6\u6837\u672c\u7684\u591a\u8bf4\u8bdd\u4eba\u8bed\u97f3/\u97f3\u9891\u751f\u6210\u3002\u6a21\u578b\u53ef\u6309\u81ea\u7136\u8bed\u8a00\u63a7\u5236\u8bf4\u8bdd\u4eba\u98ce\u683c\u3001\u73af\u5883\u58f0\u3001\u97f3\u6548\u4e0e\u7ec6\u7c92\u5ea6\u5185\u5bb9\uff0c\u5e76\u652f\u6301\u590d\u7528\u8bbe\u8ba1\u51fa\u7684\u58f0\u97f3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u52a8\u753b\u914d\u97f3\u3001\u5e7f\u64ad\u5267\u3001\u6e38\u620f\u3001\u77ed\u89c6\u9891\u7b49\u771f\u5b9e\u521b\u4f5c\u573a\u666f\uff0c\u628a\u591a\u8bf4\u8bdd\u4eba\u8868\u8fbe\u5f0f\u8bed\u97f3\u3001\u73af\u5883\u97f3\u548c\u97f3\u6548\u751f\u6210\u7edf\u4e00\u5230\u540c\u4e00\u6846\u67b6\uff0c\u5e76\u540c\u65f6\u8986\u76d6\u65e0\u53c2\u8003\u7684\u6307\u4ee4\u751f\u6210\u4e0e\u6709\u53c2\u8003\u7684\u96f6\u6837\u672c\u751f\u6210\uff0c\u5b9e\u7528\u4ef7\u503c\u8f83\u9ad8\u3002"}, {"abstract": "We introduce UniWorld-Design, a framework that redefines image generation from flat pixel synthesis to structured visual composition, with semantic RGBA layers as the atomic units of generation, understanding, and editing. Our key insight is that pixels define how an image is rendered, whereas layers define how an image is created, understood, and edited. Just as human designers create and manipulate visual content through layers rather than raw pixels, UniWorld-Design equips multimodal generative models with a layer-native design space. UniWorld-Design comprises two models. The Text-to-RGBA (T2RGBA) model generates standalone RGBA assets directly from text. The Image-to-Layer (I2L) model conditions on a finished image, a global instruction and per-layer prompts, and jointly produces ordered, complete semantic RGBA layers. Its instruction interface supports top-level decomposition, recursive decomposition and targeted extraction, making layering an instruction-addressable operation for agentic editing. Because I2L learns complete semantic objects rather than visible-pixel partitions, its layers stay usable when moved or removed. On the Crello benchmark, I2L reduces per-layer RGB L1 error by 37% and achieves a 34% relative improvement in Alpha Soft IoU over Qwen-Image-Layered. Separately, T2RGBA achieves the highest CLIP Score, outperforming LayerDiffuse and OmniAlpha.", "arxiv_id": "2608.03971", "arxiv_url": "https://arxiv.org/abs/2608.03971", "authors": ["Zongjian Li", "Zhiyuan Yan", "Chenxu Bai", "Chen Chen", "Haoxiang Sun", "Shaodong Wang", "Feize Wu", "Shenghai Yuan", "Bin Lin", "Zheyuan Liu", "Yuwei Niu", "Li Yuan"], "brief": "UniWorld-Design \u5c06\u56fe\u50cf\u751f\u6210\u4ece\u5e73\u9762\u50cf\u7d20\u5408\u6210\u8f6c\u5411\u5c42\u539f\u751f\u7684\u7ed3\u6784\u5316\u89c6\u89c9\u521b\u4f5c\uff0c\u4ee5\u8bed\u4e49 RGBA \u56fe\u5c42\u4f5c\u4e3a\u751f\u6210\u3001\u7406\u89e3\u548c\u7f16\u8f91\u7684\u57fa\u672c\u5355\u5143\u3002\u5b83\u5305\u542b\u6587\u672c\u751f\u6210 RGBA \u8d44\u4ea7\u7684 T2RGBA\uff0c\u4ee5\u53ca\u4ece\u6210\u56fe\u5206\u89e3\u51fa\u6709\u5e8f\u5b8c\u6574\u8bed\u4e49\u56fe\u5c42\u7684 I2L\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03971", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["I2L \u652f\u6301\u5168\u5c40\u6307\u4ee4\u4e0e\u9010\u5c42\u63d0\u793a\uff0c\u53ef\u8fdb\u884c\u9876\u5c42\u5206\u89e3\u3001\u9012\u5f52\u5206\u89e3\u548c\u76ee\u6807\u5bf9\u8c61\u63d0\u53d6\u3002", "\u4e0d\u540c\u4e8e\u53ef\u89c1\u50cf\u7d20\u5206\u5272\uff0cI2L \u5b66\u4e60\u5b8c\u6574\u8bed\u4e49\u5bf9\u8c61\uff0c\u56e0\u6b64\u56fe\u5c42\u5728\u79fb\u52a8\u6216\u5220\u9664\u540e\u4ecd\u53ef\u7528\u3002", "\u5728 Crello \u57fa\u51c6\u4e0a\uff0cI2L \u5c06\u9010\u5c42 RGB L1 \u8bef\u5dee\u964d\u4f4e 37%\uff0cAlpha Soft IoU \u76f8\u5bf9\u63d0\u5347 34%\uff1bT2RGBA \u7684 CLIP Score \u4f18\u4e8e LayerDiffuse \u548c OmniAlpha\u3002"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u591a\u6a21\u6001", "\u56fe\u50cf\u7f16\u8f91", "\u89c6\u89c9\u8bbe\u8ba1"], "num_comments": 1, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2608.03971v1", "published_at": "2026-08-04", "score": 0.571, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03971.png", "title": "UniWorld-Design: From Pixel Generation to Layer-Native Design", "tldr": "\u7528\u8bed\u4e49RGBA\u5c42\u91cd\u6784\u56fe\u50cf\u751f\u6210\u4e0e\u7f16\u8f91\u3002", "upvotes": 2, "what_it_is": "UniWorld-Design \u5c06\u56fe\u50cf\u751f\u6210\u4ece\u5e73\u9762\u50cf\u7d20\u5408\u6210\u8f6c\u5411\u5c42\u539f\u751f\u7684\u7ed3\u6784\u5316\u89c6\u89c9\u521b\u4f5c\uff0c\u4ee5\u8bed\u4e49 RGBA \u56fe\u5c42\u4f5c\u4e3a\u751f\u6210\u3001\u7406\u89e3\u548c\u7f16\u8f91\u7684\u57fa\u672c\u5355\u5143\u3002\u5b83\u5305\u542b\u6587\u672c\u751f\u6210 RGBA \u8d44\u4ea7\u7684 T2RGBA\uff0c\u4ee5\u53ca\u4ece\u6210\u56fe\u5206\u89e3\u51fa\u6709\u5e8f\u5b8c\u6574\u8bed\u4e49\u56fe\u5c42\u7684 I2L\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u751f\u6210\u5f0f\u56fe\u50cf\u6a21\u578b\u63a8\u8fdb\u5230\u66f4\u63a5\u8fd1\u4e13\u4e1a\u8bbe\u8ba1\u8f6f\u4ef6\u7684\u201c\u56fe\u5c42\u5de5\u4f5c\u6d41\u201d\uff0c\u663e\u8457\u63d0\u5347\u53ef\u7f16\u8f91\u6027\u4e0e\u53ef\u590d\u7528\u6027\uff0c\u5bf9\u81ea\u52a8\u5316\u8bbe\u8ba1\u3001\u7d20\u6750\u751f\u6210\u548c\u4ea4\u4e92\u5f0f\u56fe\u50cf\u7f16\u8f91\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce DiffusionGemma, an experimental open-weight language model that uses discrete diffusion to generate text at exceptionally high speed. Rather than decoding one token at a time, DiffusionGemma iteratively refines blocks of 256 tokens in parallel, avoiding the sequential decoding bottleneck of conventional autoregressive (AR) large language models. Instead of training from scratch, we obtain DiffusionGemma by fine-tuning the mixture-of-experts Gemma 4 model with 3.8B activated and 25.2B total parameters. Our compute-efficient two-stage training pipeline uses fewer than 10% of the starting AR model\u0027s total training token budget. The first stage uses supervised fine-tuning to teach bidirectional denoising, while the second stage combines reinforcement learning with sampler distillation to jointly improve generation quality and inference efficiency. DiffusionGemma establishes a new Pareto frontier for the trade-off between generation speed and model capability. Averaged across our full evaluation suite, it generates around 20 tokens per forward pass and achieves roughly 1,500 output tokens per second on a single NVIDIA H100 GPU, which is substantially faster than AR models even with state-of-the-art speculative decoding. DiffusionGemma also retains the starting model\u0027s support for thinking mode, multimodal inputs, and long contexts. Despite diffusion fine-tuning, it remains capable of AR generation with only minor performance degradation, suggesting a path toward hybrid diffusion-AR decoding.", "arxiv_id": "2608.00146", "arxiv_url": "https://arxiv.org/abs/2608.00146", "authors": ["DiffusionGemma Team", "Adrien Ali Ta\u00efga", "James Assiene", "Daniele Calandriello", "Rahma Chaabouni", "Jo\u00e3o Gante", "Tamara von Glehn", "Nate Keating", "Chris Knutsen", "Martin Kukla", "Tianlin Liu", "Ivan Lobov", "Ofir Nabati", "Jo\u00e3o Gabriel Oliveira", "Nicolas Perez-Nieves", "Nastasia Prutianova", "Bobak Shahriari", "Jean Tarbouriech", "Pavel Tyletski", "\u00c7a\u011flar \u00dcnl\u00fc", "Cindy Wu", "Glenn Cameron", "Jerome Connor", "Sertan Girgin", "Maarten Grootendorst", "Alon Levkovitch", "Eliya Nachmani", "Omar Sanseviero", "Piotr Stanczyk", "Quentin Berthet", "Andrew Campbell", "Cl\u00e9ment Crepy", "Valentin De Bortoli", "Arnaud Doucet", "Romuald Elie", "Alexandre Galashov", "Klaus Greff", "Alexis Jacq", "David Ruhe", "Yu-Han Wu", "Sebastian Flennerhag", "Brendan O\u0027Donoghue", "George Scrivener", "Shantanu Thakoor"], "brief": "\u8bba\u6587\u4ecb\u7ecd\u4e86DiffusionGemma\uff1a\u57fa\u4e8eGemma 4 MoE\u5fae\u8c03\u5f97\u5230\u7684\u5f00\u653e\u6743\u91cd\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u4e0d\u518d\u9010token\u81ea\u56de\u5f52\u89e3\u7801\uff0c\u800c\u662f\u5e76\u884c\u8fed\u4ee3\u7cbe\u70bc256 token\u6587\u672c\u5757\uff0c\u4ee5\u663e\u8457\u63d0\u5347\u751f\u6210\u901f\u5ea6\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00146", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u4e24\u9636\u6bb5\u9ad8\u6548\u8bad\u7ec3\uff1a\u5148\u7528\u76d1\u7763\u5fae\u8c03\u5b66\u4e60\u53cc\u5411\u53bb\u566a\uff0c\u518d\u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u4e0e\u91c7\u6837\u5668\u84b8\u998f\u63d0\u5347\u8d28\u91cf\u548c\u63a8\u7406\u6548\u7387\u3002", "\u8bad\u7ec3\u6210\u672c\u4f4e\u4e8e\u539f\u81ea\u56de\u5f52\u6a21\u578b\u603b\u8bad\u7ec3token\u9884\u7b97\u768410%\uff0c\u5374\u5728\u901f\u5ea6\u4e0e\u80fd\u529b\u4e4b\u95f4\u5efa\u7acb\u65b0\u7684Pareto\u524d\u6cbf\u3002", "\u5355\u5f20NVIDIA H100\u4e0a\u5e73\u5747\u6bcf\u6b21\u524d\u5411\u751f\u6210\u7ea620\u4e2atoken\u3001\u7ea61500\u8f93\u51fatoken/\u79d2\uff0c\u5e76\u4fdd\u7559\u601d\u8003\u6a21\u5f0f\u3001\u591a\u6a21\u6001\u8f93\u5165\u548c\u957f\u4e0a\u4e0b\u6587\u80fd\u529b\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b", "\u9ad8\u6548\u63a8\u7406", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": "Deepmind", "pdf_url": "https://arxiv.org/pdf/2608.00146v1", "published_at": "2026-07-31", "score": 0.559, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00146.png", "title": "DiffusionGemma Technical Report", "tldr": "\u79bb\u6563\u6269\u6563\u8ba9Gemma\u5b9e\u73b0\u9ad8\u901f\u6587\u672c\u751f\u6210", "upvotes": 24, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd\u4e86DiffusionGemma\uff1a\u57fa\u4e8eGemma 4 MoE\u5fae\u8c03\u5f97\u5230\u7684\u5f00\u653e\u6743\u91cd\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u4e0d\u518d\u9010token\u81ea\u56de\u5f52\u89e3\u7801\uff0c\u800c\u662f\u5e76\u884c\u8fed\u4ee3\u7cbe\u70bc256 token\u6587\u672c\u5757\uff0c\u4ee5\u663e\u8457\u63d0\u5347\u751f\u6210\u901f\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u4ece\u5f3a\u81ea\u56de\u5f52\u5927\u6a21\u578b\u4f4e\u6210\u672c\u8fc1\u79fb\u5230\u6269\u6563\u5f0f\u6587\u672c\u751f\u6210\u7684\u53ef\u884c\u8def\u5f84\uff0c\u663e\u8457\u7a81\u7834\u987a\u5e8f\u89e3\u7801\u74f6\u9888\uff0c\u5e76\u4e3a\u6269\u6563-\u81ea\u56de\u5f52\u6df7\u5408\u89e3\u7801\u63d0\u4f9b\u4e86\u5b9e\u8df5\u4f9d\u636e\u3002"}, {"abstract": "Large language model (LLM) agents increasingly undertake long-horizon tasks that require sustained reasoning, tool use, and revision across many interdependent steps. However, existing agent harnesses maintain task execution, task state, and completion assessment within a growing context, making the state difficult to track and allowing incorrect self-assessments to propagate into later decisions. We reformulate long-horizon execution as a task-state management problem and propose LongHorizon-Harness, which maintains the task state explicitly outside execution and updates it only with facts independently verified from the environment. Its Manage-Execute-Audit(MEA) loop uses a manager to maintain the task state and determine the next subtask, a fresh-context executor to perform it, and a read-only auditor to verify the resulting environment state before the next round. A lightweight AgentAdapter supports interchangeable model and harness backends without modifying their native agent loops. LongHorizon-Harness improves Qwen~3.7-Plus from 51.8% to 80.7% on WeaveBench, from 69.7% to 77.2% on Terminal-Bench~2.1, and from 2.8% to 8.3% on OSWorld~2.0. It also raises Claude Opus~4.7 from 20.0% to 34.3% on an OSWorld2.0 subset, demonstrating consistent gains across models, harnesses, and interaction domains.", "arxiv_id": "2608.01964", "arxiv_url": "https://arxiv.org/abs/2608.01964", "authors": ["Ziyu Ma", "Hailang Huang", "Shun Zou", "Yong Wang", "Shidong Yang", "Yiming Hu", "Fei Wei", "XiangXiang Chu"], "brief": "\u8bba\u6587\u63d0\u51fa LongHorizon-Harness\uff0c\u5c06\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u91cd\u6784\u4e3a\u4efb\u52a1\u72b6\u6001\u7ba1\u7406\u95ee\u9898\u3002\u5b83\u901a\u8fc7 Manage-Execute-Audit \u5faa\u73af\uff0c\u628a\u72b6\u6001\u7ef4\u62a4\u3001\u5b50\u4efb\u52a1\u6267\u884c\u4e0e\u73af\u5883\u9a8c\u8bc1\u5206\u79bb\uff0c\u51cf\u5c11\u4e0a\u4e0b\u6587\u81a8\u80c0\u548c\u9519\u8bef\u81ea\u8bc4\u4f20\u64ad\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AMAP-ML/LongHorizon-Harness", "github_stars": 154, "hf_url": "https://huggingface.co/papers/2608.01964", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u663e\u5f0f\u5728\u6267\u884c\u4e0a\u4e0b\u6587\u4e4b\u5916\u7ef4\u62a4\u4efb\u52a1\u72b6\u6001\uff0c\u4ec5\u7528\u73af\u5883\u4e2d\u72ec\u7acb\u9a8c\u8bc1\u8fc7\u7684\u4e8b\u5b9e\u66f4\u65b0\u72b6\u6001", "MEA \u5faa\u73af\u5305\u542b manager\u3001fresh-context executor \u548c\u53ea\u8bfb auditor\uff0c\u5206\u522b\u8d1f\u8d23\u89c4\u5212\u3001\u6267\u884c\u4e0e\u9a8c\u8bc1", "\u5728 WeaveBench\u3001Terminal-Bench 2.1\u3001OSWorld 2.0 \u4e0a\u663e\u8457\u63d0\u5347 Qwen \u4e0e Claude \u7b49\u6a21\u578b\u8868\u73b0"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1", "\u72b6\u6001\u7ba1\u7406", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01964v1", "published_at": "2026-08-03", "score": 0.528, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (130\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01964.png", "title": "LongHorizon-Harness: Advancing Long-Horizon Agents for Real-World Tasks", "tldr": "\u663e\u5f0f\u72b6\u6001\u7ba1\u7406\u63d0\u5347\u957f\u7a0b\u667a\u80fd\u4f53\u8868\u73b0", "upvotes": 130, "what_it_is": "\u8bba\u6587\u63d0\u51fa LongHorizon-Harness\uff0c\u5c06\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u91cd\u6784\u4e3a\u4efb\u52a1\u72b6\u6001\u7ba1\u7406\u95ee\u9898\u3002\u5b83\u901a\u8fc7 Manage-Execute-Audit \u5faa\u73af\uff0c\u628a\u72b6\u6001\u7ef4\u62a4\u3001\u5b50\u4efb\u52a1\u6267\u884c\u4e0e\u73af\u5883\u9a8c\u8bc1\u5206\u79bb\uff0c\u51cf\u5c11\u4e0a\u4e0b\u6587\u81a8\u80c0\u548c\u9519\u8bef\u81ea\u8bc4\u4f20\u64ad\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u6838\u5fc3\u74f6\u9888\u2014\u2014\u72b6\u6001\u6df7\u4e71\u4e0e\u9519\u8bef\u7d2f\u79ef\u2014\u2014\u7ed9\u51fa\u901a\u7528\u6846\u67b6\uff0c\u5e76\u80fd\u9002\u914d\u4e0d\u540c\u6a21\u578b\u548c\u540e\u7aef\uff0c\u5728\u771f\u5b9e\u5de5\u5177\u4e0e GUI/\u7ec8\u7aef\u4efb\u52a1\u4e2d\u5e26\u6765\u7a33\u5b9a\u589e\u76ca\u3002"}, {"abstract": "On-policy (self) distillation (OPSD) is increasingly adopted for language-model post-training. It strengthens the teacher with privileged information but can induce a privilege illusion: the student learns privilege-dependent behavior it cannot reproduce from its inference-time context, yet behaves as if the training-time privileged information remained available, ultimately degrading performance. In this paper, we identify information asymmetry between the privileged teacher and the student at inference as the root cause of this failure in OPSD. To resolve this asymmetry, we propose Dual-Anchored Policy Distillation (DAPD), a unified framework with two levels of anchoring. Dual-Path Anchoring (DPA) introduces a self-conditioned bridge and aligns reference and rollout behavior along two matched-information paths, preventing privilege-dependent behavior from being transferred to the inference-time student. Dual-Source Anchoring (DSA) applies these paths in both reference-to-rollout and rollout-to-reference directions, reducing reliance on privileged reference guidance while preserving correctness supervision. Extensive experiments show that DAPD significantly alleviates privilege illusion, outperforming OPSD on Qwen3-4B by +2.00 points on average across tasks. Notably, its gains persist across scales, reaching +2.69 at 4B and +2.78 at 32B.", "arxiv_id": "2608.01735", "arxiv_url": "https://arxiv.org/abs/2608.01735", "authors": ["Jianyu Wu", "Yizhou Wang", "Encheng Su", "Chen Tang", "Shixiang Tang"], "brief": "\u672c\u6587\u6307\u51fa\u5728\u7ebf\u7b56\u7565\u81ea\u84b8\u998f\u4e2d\uff0c\u62e5\u6709\u7279\u6743\u4fe1\u606f\u7684\u6559\u5e08\u4e0e\u63a8\u7406\u65f6\u5b66\u751f\u4e4b\u95f4\u7684\u4fe1\u606f\u4e0d\u5bf9\u79f0\u4f1a\u5bfc\u81f4\u201c\u7279\u6743\u5e7b\u89c9\u201d\u3002\u4f5c\u8005\u63d0\u51faDual-Anchored Policy Distillation\uff0c\u901a\u8fc7\u53cc\u8def\u5f84\u4e0e\u53cc\u6765\u6e90\u951a\u5b9a\uff0c\u8ba9\u5b66\u751f\u5b66\u4e60\u53ef\u5728\u63a8\u7406\u4e0a\u4e0b\u6587\u4e2d\u590d\u73b0\u7684\u884c\u4e3a\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/uanu2002/DAPD", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.01735", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["Dual-Path Anchoring\u5f15\u5165\u81ea\u6761\u4ef6\u6865\u63a5\uff0c\u5728\u4fe1\u606f\u5339\u914d\u7684\u4e24\u6761\u8def\u5f84\u4e0a\u5bf9\u9f50\u53c2\u8003\u884c\u4e3a\u4e0erollout\u884c\u4e3a\uff0c\u907f\u514d\u8fc1\u79fb\u4f9d\u8d56\u7279\u6743\u4fe1\u606f\u7684\u7b56\u7565", "Dual-Source Anchoring\u540c\u65f6\u8fdb\u884creference-to-rollout\u4e0erollout-to-reference\u65b9\u5411\u7684\u951a\u5b9a\uff0c\u964d\u4f4e\u5bf9\u7279\u6743\u6559\u5e08\u6307\u5bfc\u7684\u4f9d\u8d56\u5e76\u4fdd\u7559\u6b63\u786e\u6027\u76d1\u7763", "\u5728Qwen3-4B\u4e0a\u8de8\u4efb\u52a1\u5e73\u5747\u63d0\u5347+2.00\u5206\uff0c\u4e14\u57284B\u4e0e32B\u89c4\u6a21\u5206\u522b\u8fbe\u5230+2.69\u548c+2.78\u589e\u76ca"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u540e\u8bad\u7ec3", "\u8bed\u8a00\u6a21\u578b", "\u7b56\u7565\u4f18\u5316"], "num_comments": 3, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2608.01735v1", "published_at": "2026-08-03", "score": 0.516, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (57\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01735.png", "title": "DAPD: Dual-Anchored Policy Distillation", "tldr": "DAPD\u7f13\u89e3\u81ea\u84b8\u998f\u4e2d\u7684\u7279\u6743\u5e7b\u89c9", "upvotes": 57, "what_it_is": "\u672c\u6587\u6307\u51fa\u5728\u7ebf\u7b56\u7565\u81ea\u84b8\u998f\u4e2d\uff0c\u62e5\u6709\u7279\u6743\u4fe1\u606f\u7684\u6559\u5e08\u4e0e\u63a8\u7406\u65f6\u5b66\u751f\u4e4b\u95f4\u7684\u4fe1\u606f\u4e0d\u5bf9\u79f0\u4f1a\u5bfc\u81f4\u201c\u7279\u6743\u5e7b\u89c9\u201d\u3002\u4f5c\u8005\u63d0\u51faDual-Anchored Policy Distillation\uff0c\u901a\u8fc7\u53cc\u8def\u5f84\u4e0e\u53cc\u6765\u6e90\u951a\u5b9a\uff0c\u8ba9\u5b66\u751f\u5b66\u4e60\u53ef\u5728\u63a8\u7406\u4e0a\u4e0b\u6587\u4e2d\u590d\u73b0\u7684\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u65e5\u76ca\u5e38\u89c1\u7684\u5728\u7ebf\u81ea\u84b8\u998f\u5931\u6548\u673a\u5236\u7ed9\u51fa\u660e\u786e\u89e3\u91ca\uff0c\u5e76\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u7edf\u4e00\u4fee\u6b63\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u4f9d\u8d56\u7279\u6743\u6559\u5e08\u4fe1\u53f7\u7684\u7b56\u7565\u84b8\u998f\u7a33\u5b9a\u6027\u4e0e\u6cdb\u5316\u8868\u73b0\u3002"}, {"abstract": "Agent skills have become an important mechanism for equipping language-model agents with reusable procedural knowledge. However, providing skills alone does not guarantee that current models can effectively identify, apply, and coordinate them. To improve skill-use capabilities, we introduce SKT, a verified data synthesis pipeline that constructs skill-grounded tasks and executable trajectories from large collections of agent skills. SKT selects suitable single-skill and multi-skill configurations, synthesizes tasks through rule-based and agent-based verification with feedback-guided repair, and retains only successful trajectories that substantially use every required skill. Using 2,000 public skills, SKT produces 4,000 task packages and 27,164 verified trajectories. Based on the same pipeline and a disjoint test pool, we further construct SkillEval, a held-out executable benchmark for evaluating skill use. Experiments across diverse models, benchmarks, and agent harnesses show that supervised fine-tuning on SKT-generated trajectories consistently improves skill-use performance. Verification ablations, cross-harness evaluation, and scaling experiments further demonstrate that these gains depend on high-quality supervision, extend beyond a single agent interface, and increase with broader skill coverage. Together, these results establish verified data synthesis as an effective and scalable approach for skill-use training.", "arxiv_id": "2608.02287", "arxiv_url": "https://arxiv.org/abs/2608.02287", "authors": ["Zelin Tan", "Yiqun Zhang", "Hao Li", "Zhiyao Cui", "Hejia Geng", "Shao Zhang", "Hangfan Zhang", "Yang Chen", "Xiaosong Wang", "Lilong Wang", "Zhenfei Yin", "Shuyue Hu", "Chen Zhang", "Lei Bai"], "brief": "\u672c\u6587\u63d0\u51fa SKT\uff0c\u4e00\u4e2a\u4ece\u5927\u91cf\u667a\u80fd\u4f53\u6280\u80fd\u4e2d\u81ea\u52a8\u6784\u9020\u4efb\u52a1\u4e0e\u53ef\u6267\u884c\u8f68\u8ff9\u7684\u9a8c\u8bc1\u5f0f\u6570\u636e\u5408\u6210\u6d41\u6c34\u7ebf\u3002\u5b83\u57fa\u4e8e 2000 \u4e2a\u516c\u5f00\u6280\u80fd\u751f\u6210 4000 \u4e2a\u4efb\u52a1\u5305\u548c 27164 \u6761\u9a8c\u8bc1\u8f68\u8ff9\uff0c\u5e76\u6784\u5efa\u4e86\u72ec\u7acb\u8bc4\u6d4b\u96c6 SkillEval\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02287", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["SKT \u540c\u65f6\u8986\u76d6\u5355\u6280\u80fd\u4e0e\u591a\u6280\u80fd\u914d\u7f6e\uff0c\u901a\u8fc7\u89c4\u5219\u9a8c\u8bc1\u3001\u667a\u80fd\u4f53\u9a8c\u8bc1\u548c\u53cd\u9988\u4fee\u590d\u6765\u5408\u6210\u4efb\u52a1", "\u4ec5\u4fdd\u7559\u6210\u529f\u6267\u884c\u4e14\u5b9e\u8d28\u4f7f\u7528\u6240\u6709\u6240\u9700\u6280\u80fd\u7684\u8f68\u8ff9\uff0c\u63d0\u5347\u76d1\u7763\u6570\u636e\u8d28\u91cf", "\u5728\u4e0d\u540c\u6a21\u578b\u3001\u57fa\u51c6\u548c\u667a\u80fd\u4f53\u6846\u67b6\u4e0a\uff0c\u4f7f\u7528 SKT \u8f68\u8ff9\u5fae\u8c03\u5747\u80fd\u7a33\u5b9a\u63d0\u5347\u6280\u80fd\u8c03\u7528\u4e0e\u534f\u8c03\u80fd\u529b"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u5408\u6210", "\u76d1\u7763\u5fae\u8c03", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 1, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2608.02287v1", "published_at": "2026-08-03", "score": 0.504, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02287.png", "title": "SKT: Skill-Use Training at Scale via Verified Synthetic Data Generation", "tldr": "\u7528\u9a8c\u8bc1\u5408\u6210\u6570\u636e\u89c4\u6a21\u5316\u8bad\u7ec3\u667a\u80fd\u4f53\u7528\u6280\u80fd", "upvotes": 27, "what_it_is": "\u672c\u6587\u63d0\u51fa SKT\uff0c\u4e00\u4e2a\u4ece\u5927\u91cf\u667a\u80fd\u4f53\u6280\u80fd\u4e2d\u81ea\u52a8\u6784\u9020\u4efb\u52a1\u4e0e\u53ef\u6267\u884c\u8f68\u8ff9\u7684\u9a8c\u8bc1\u5f0f\u6570\u636e\u5408\u6210\u6d41\u6c34\u7ebf\u3002\u5b83\u57fa\u4e8e 2000 \u4e2a\u516c\u5f00\u6280\u80fd\u751f\u6210 4000 \u4e2a\u4efb\u52a1\u5305\u548c 27164 \u6761\u9a8c\u8bc1\u8f68\u8ff9\uff0c\u5e76\u6784\u5efa\u4e86\u72ec\u7acb\u8bc4\u6d4b\u96c6 SkillEval\u3002", "why_notable": "\u8bba\u6587\u9488\u5bf9\u201c\u6709\u6280\u80fd\u4f46\u4e0d\u4f1a\u7528\u201d\u7684\u667a\u80fd\u4f53\u74f6\u9888\uff0c\u8bc1\u660e\u4e86\u7ecf\u9a8c\u8bc1\u7684\u5408\u6210\u8f68\u8ff9\u53ef\u4f5c\u4e3a\u53ef\u6269\u5c55\u76d1\u7763\u4fe1\u53f7\uff0c\u4e14\u6548\u679c\u80fd\u8de8\u6846\u67b6\u6cdb\u5316\u5e76\u968f\u6280\u80fd\u8986\u76d6\u6269\u5927\u800c\u589e\u5f3a\uff0c\u5bf9\u6784\u5efa\u53ef\u590d\u7528\u5de5\u5177/\u6280\u80fd\u578b LLM Agent \u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Multimodal large language models (MLLMs) have advanced visual understanding and reasoning, yet their static parametric knowledge limits their ability to address knowledge-intensive and dynamically evolving open-world problems. To move beyond this limitation, multimodal deep search has emerged as a key direction for open-world information access, evolving from single-turn factual retrieval toward long-horizon, multi-turn search guided by visual evidence. However, existing methods typically confine vision to the input or answer stage, overlooking its role in intermediate reasoning, and lack designs tailored to long-horizon interaction. Consequently, visual evidence rarely drives continued retrieval, constraining both interaction depth and reasoning span. To address these limitations, we propose DeepVoyager-VL, a long-horizon multimodal deep-search framework for vision-in-the-loop search. Specifically, we construct a multimodal event graph to drive data synthesis, yielding problems with intermediate visual dependencies and long reasoning chains. We then design an agent framework for active visual acquisition and on-demand image loading. Finally, we fine-tune models on the synthesized data without reinforcement learning. Extensive experiments across ten multimodal search benchmarks demonstrate the effectiveness of our method.", "arxiv_id": "2608.01827", "arxiv_url": "https://arxiv.org/abs/2608.01827", "authors": ["Huanyao Zhang", "Jiepeng Zhou", "Runhao Zhao", "Yanzhe Shan", "Jiaoyang Chen", "Bowen Zhou", "Bo Li", "Fang Wang", "Jialong Wu", "Zhengwei Tao", "Lang Mei", "Xiaohan Yu", "Liyan Liu", "Chong Chen", "Wentao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa DeepVoyager-VL\uff0c\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u4e16\u754c\u95ee\u9898\u7684\u957f\u7a0b\u591a\u6a21\u6001\u6df1\u5ea6\u641c\u7d22\u6846\u67b6\u3002\u5b83\u8ba9\u89c6\u89c9\u8bc1\u636e\u53c2\u4e0e\u4e2d\u95f4\u63a8\u7406\u4e0e\u540e\u7eed\u68c0\u7d22\u51b3\u7b56\uff0c\u800c\u4e0d\u53ea\u505c\u7559\u5728\u8f93\u5165\u6216\u6700\u7ec8\u56de\u7b54\u9636\u6bb5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/Halcyon-Zhang/DeepVoyager-VL", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.01827", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u591a\u6a21\u6001\u4e8b\u4ef6\u56fe\u7528\u4e8e\u5408\u6210\u8bad\u7ec3\u6570\u636e\uff0c\u751f\u6210\u5305\u542b\u4e2d\u95f4\u89c6\u89c9\u4f9d\u8d56\u548c\u957f\u63a8\u7406\u94fe\u7684\u95ee\u9898\u3002", "\u8bbe\u8ba1\u652f\u6301\u4e3b\u52a8\u89c6\u89c9\u83b7\u53d6\u4e0e\u6309\u9700\u52a0\u8f7d\u56fe\u50cf\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4f7f\u6a21\u578b\u80fd\u5728\u641c\u7d22\u8fc7\u7a0b\u4e2d\u52a8\u6001\u5f15\u5165\u89c6\u89c9\u4fe1\u606f\u3002", "\u65e0\u9700\u5f3a\u5316\u5b66\u4e60\uff0c\u4ec5\u901a\u8fc7\u5408\u6210\u6570\u636e\u5fae\u8c03\u6a21\u578b\uff0c\u5e76\u5728\u5341\u4e2a\u591a\u6a21\u6001\u641c\u7d22\u57fa\u51c6\u4e0a\u53d6\u5f97\u6709\u6548\u63d0\u5347\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u957f\u7a0b\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2608.01827v1", "published_at": "2026-08-03", "score": 0.495, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01827.png", "title": "DeepVoyager-VL: Incentivizing Vision-in-the-Loop Search for Long-Horizon Multimodal Agents", "tldr": "\u8ba9\u591a\u6a21\u6001\u667a\u80fd\u4f53\u8fb9\u770b\u8fb9\u641c\uff0c\u5b8c\u6210\u957f\u7a0b\u68c0\u7d22\u63a8\u7406", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa DeepVoyager-VL\uff0c\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u4e16\u754c\u95ee\u9898\u7684\u957f\u7a0b\u591a\u6a21\u6001\u6df1\u5ea6\u641c\u7d22\u6846\u67b6\u3002\u5b83\u8ba9\u89c6\u89c9\u8bc1\u636e\u53c2\u4e0e\u4e2d\u95f4\u63a8\u7406\u4e0e\u540e\u7eed\u68c0\u7d22\u51b3\u7b56\uff0c\u800c\u4e0d\u53ea\u505c\u7559\u5728\u8f93\u5165\u6216\u6700\u7ec8\u56de\u7b54\u9636\u6bb5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u89c9\u4fe1\u606f\u771f\u6b63\u653e\u5165\u591a\u8f6e\u641c\u7d22\u4e0e\u63a8\u7406\u95ed\u73af\u4e2d\uff0c\u6269\u5c55\u4e86\u591a\u6a21\u6001\u5927\u6a21\u578b\u5904\u7406\u52a8\u6001\u3001\u77e5\u8bc6\u5bc6\u96c6\u578b\u5f00\u653e\u4e16\u754c\u4efb\u52a1\u7684\u80fd\u529b\uff0c\u5bf9\u957f\u7a0b\u591a\u6a21\u6001\u667a\u80fd\u4f53\u548c\u89c6\u89c9\u68c0\u7d22\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-language MoE batches contain different numbers of image and text tokens. Image resolution, image count, tiling, and prompt length all change this token mix. We call the standard token-level Switch auxiliary loss Std-Aux. Std-Aux balances only the mixed load, so large image and text load errors can cancel at one mix. On our main model, the same trained router shows more than a fivefold change in load imbalance across image resolutions. We hold the image and text load profiles fixed and derive the exact load curve as the token mix varies. The image-text load gap controls sensitivity to the token mix. Physical preprocessing can also change the conditional profiles. The fixed-profile law excludes such changes. To design a remedy, we examine the router input structure. Image and text occupy distinct regions, while visual tokens group strongly by source image. The modality boundary motivates separate image and text terms. The image boundary motivates one equal-weight routing instance per image. ReBA, or Relax Within, Balance Across, implements both choices. Across four split backbones, ReBA lowers load on every reported benchmark input while keeping mean task accuracy comparable to Std-Aux. ReBA also lowers average load over the tested range and worst physical load under resolution and tiling shifts. Code is available at https://github.com/ZiangWu-77/ReBA.", "arxiv_id": "2608.00574", "arxiv_url": "https://arxiv.org/abs/2608.00574", "authors": ["Ziang Wu", "Peng Jin", "Qishen Yin", "Munan Ning", "Hao Li", "Peizhen Zhang", "Li Yuan"], "brief": "\u672c\u6587\u5206\u6790\u89c6\u89c9\u8bed\u8a00MoE\u4e2d\u56fe\u50cf\u4e0e\u6587\u672ctoken\u6bd4\u4f8b\u53d8\u5316\u5bfc\u81f4\u7684\u8def\u7531\u8d1f\u8f7d\u5931\u8861\uff0c\u6307\u51fa\u6807\u51c6Switch\u8f85\u52a9\u635f\u5931\u53ea\u5e73\u8861\u6df7\u5408\u8d1f\u8f7d\uff0c\u53ef\u80fd\u63a9\u76d6\u6a21\u6001\u95f4\u504f\u5dee\u3002\u4f5c\u8005\u63d0\u51faReBA\uff0c\u5728\u6a21\u6001\u95f4\u5206\u5f00\u5e73\u8861\uff0c\u5e76\u6309\u6bcf\u5f20\u56fe\u50cf\u8bbe\u7f6e\u7b49\u6743\u8def\u7531\u5b9e\u4f8b\uff0c\u4ee5\u63d0\u5347\u4e0d\u540c\u5206\u8fa8\u7387\u3001\u62fc\u56fe\u548c\u63d0\u793a\u957f\u5ea6\u4e0b\u7684\u8d1f\u8f7d\u7a33\u5b9a\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/ZiangWu-77/ReBA", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2608.00574", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63a8\u5bfc\u4e86\u56fa\u5b9a\u56fe\u50cf/\u6587\u672c\u8d1f\u8f7d\u5206\u5e03\u4e0b\uff0ctoken\u6df7\u5408\u6bd4\u4f8b\u53d8\u5316\u65f6\u7684\u7cbe\u786e\u8d1f\u8f7d\u66f2\u7ebf\uff0c\u5e76\u53d1\u73b0\u56fe\u6587\u8d1f\u8f7d\u5dee\u51b3\u5b9a\u5bf9\u8f93\u5165\u7ec4\u6210\u53d8\u5316\u7684\u654f\u611f\u6027\u3002", "\u89c2\u5bdf\u5230\u8def\u7531\u5668\u8f93\u5165\u7a7a\u95f4\u4e2d\u56fe\u50cf\u4e0e\u6587\u672c\u5206\u5e03\u533a\u57df\u660e\u663e\u5206\u79bb\uff0c\u4e14\u89c6\u89c9token\u6309\u6765\u6e90\u56fe\u50cf\u5f3a\u805a\u7c7b\uff0c\u636e\u6b64\u8bbe\u8ba1\u5206\u6a21\u6001\u4e0e\u5206\u56fe\u50cf\u7684\u8d1f\u8f7d\u5e73\u8861\u9879\u3002", "\u5728\u56db\u79cd\u62c6\u5206\u5f0f\u89c6\u89c9\u8bed\u8a00\u9aa8\u5e72\u4e0a\uff0cReBA\u5728\u6240\u6709\u62a5\u544a\u57fa\u51c6\u8f93\u5165\u4e0a\u964d\u4f4e\u8d1f\u8f7d\u5931\u8861\uff0c\u540c\u65f6\u5e73\u5747\u4efb\u52a1\u51c6\u786e\u7387\u4e0eStd-Aux\u76f8\u5f53\u3002"], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u89c6\u89c9\u8bed\u8a00", "\u8d1f\u8f7d\u5747\u8861", "\u8def\u7531\u673a\u5236"], "num_comments": 1, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2608.00574v1", "published_at": "2026-08-01", "score": 0.467, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00574.png", "title": "Relax Within, Balance Across: Geometry-Guided Load Balancing for Vision-Language Mixture-of-Experts", "tldr": "ReBA\u7f13\u89e3\u89c6\u89c9\u8bed\u8a00MoE\u8d1f\u8f7d\u5931\u8861", "upvotes": 6, "what_it_is": "\u672c\u6587\u5206\u6790\u89c6\u89c9\u8bed\u8a00MoE\u4e2d\u56fe\u50cf\u4e0e\u6587\u672ctoken\u6bd4\u4f8b\u53d8\u5316\u5bfc\u81f4\u7684\u8def\u7531\u8d1f\u8f7d\u5931\u8861\uff0c\u6307\u51fa\u6807\u51c6Switch\u8f85\u52a9\u635f\u5931\u53ea\u5e73\u8861\u6df7\u5408\u8d1f\u8f7d\uff0c\u53ef\u80fd\u63a9\u76d6\u6a21\u6001\u95f4\u504f\u5dee\u3002\u4f5c\u8005\u63d0\u51faReBA\uff0c\u5728\u6a21\u6001\u95f4\u5206\u5f00\u5e73\u8861\uff0c\u5e76\u6309\u6bcf\u5f20\u56fe\u50cf\u8bbe\u7f6e\u7b49\u6743\u8def\u7531\u5b9e\u4f8b\uff0c\u4ee5\u63d0\u5347\u4e0d\u540c\u5206\u8fa8\u7387\u3001\u62fc\u56fe\u548c\u63d0\u793a\u957f\u5ea6\u4e0b\u7684\u8d1f\u8f7d\u7a33\u5b9a\u6027\u3002", "why_notable": "\u89c6\u89c9\u8bed\u8a00MoE\u5728\u5b9e\u9645\u90e8\u7f72\u4e2d\u4f1a\u9891\u7e41\u9762\u5bf9\u5206\u8fa8\u7387\u3001\u56fe\u50cf\u6570\u91cf\u3001tiling\u548c\u63d0\u793a\u957f\u5ea6\u53d8\u5316\uff0c\u4f20\u7edf\u8d1f\u8f7d\u5747\u8861\u5bb9\u6613\u5728\u8fd9\u4e9b\u53d8\u5316\u4e0b\u5931\u6548\u3002ReBA\u4ece\u51e0\u4f55\u7ed3\u6784\u4e0e\u6a21\u6001\u7ec4\u6210\u51fa\u53d1\u6539\u8fdb\u8def\u7531\u6b63\u5219\uff0c\u63d0\u5347\u4e86MoE\u6a21\u578b\u5728\u591a\u8f93\u5165\u5f62\u6001\u4e0b\u7684\u7a33\u5b9a\u6027\u4e0e\u53ef\u7528\u6027\u3002"}, {"abstract": "Multimodal clinical models are usually judged on accuracy with every modality present, but deployment removes modalities; an echocardiogram is often unavailable where an ECG is routine. Two questions then matter beyond the size of the accuracy loss: which modality was responsible, and whether the model fails loudly or silently once that modality is dropped. The distinction is per-example and modality-level, and is separate from post-hoc feature attribution (e.g. SHAP). Models are replaced often; the evaluation that answers these questions is reused. We present a model-agnostic modality-failure framework: given N modality embeddings, any mask-aware probe, and labels, it returns a per-example failure taxonomy, a per-modality complementarity matrix that attributes error to modalities, and a loud-vs-silent dropout profile separating monitorable failures from those that pass unflagged far from the decision boundary, using only deployment-observable signals. We release it as a small, unit-tested harness and validate it against planted ground truth. Across seeds it recovers that planted modality dominance and complementary subset, reports per-modality loud-vs-silent rates, and scales to a three-modality complementarity matrix; because the planted structure is known by construction, this validates recovery of per-example attribution rather than clinical performance. We then instantiate the framework on frozen EchoJEPA and HuBERT-ECG embeddings for LVEF and the EF \u003c= 40% HFrEF gate over a paired MIMIC-IV cohort, where on the held-out test split (n = 245) dropping echo nearly doubles error. The narrow echo-to-ECG overlap that bounds cohort size is itself a deployment finding for cardiac foundation models. All of our work can be found at https://github.com/criticaldata/PRIMED-AI.", "arxiv_id": "2608.01462", "arxiv_url": "https://arxiv.org/abs/2608.01462", "authors": ["Quang Bui", "Shlok Jaiswal", "Samuel Paik-Heintz", "Kevin Zhou", "Kaushik Madapati", "Krittaphas Chaisutyakorn", "Noah Dane Hebdon", "Dimitrios Proios", "Sebasti\u00e1n Andr\u00e9s Cajas Ord\u00f3\u00f1ez", "Kacper Dobek", "Boya Zhang", "Aly Dhedhi", "Ahram Han", "Kushul Reddy Palakala", "Rahul Gorijavolu", "Jacques Kpodonu", "Leo Anthony Celi"], "brief": "\u63d0\u51fa\u4e00\u4e2a\u6a21\u578b\u65e0\u5173\u7684\u6a21\u6001\u5931\u8d25\u5206\u6790\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u4e34\u5e8a\u591a\u6a21\u6001\u6a21\u578b\u90e8\u7f72\u65f6\u8bc4\u4f30\u67d0\u4e00\u6a21\u6001\u7f3a\u5931\u5bfc\u81f4\u7684\u9010\u6837\u672c\u9519\u8bef\u3002\u6846\u67b6\u533a\u5206\u9519\u8bef\u7531\u54ea\u4e2a\u6a21\u6001\u9020\u6210\uff0c\u4ee5\u53ca\u5931\u8d25\u662f\u53ef\u76d1\u63a7\u7684\u201c\u54cd\u4eae\u5931\u8d25\u201d\u8fd8\u662f\u96be\u4ee5\u5bdf\u89c9\u7684\u201c\u6c89\u9ed8\u5931\u8d25\u201d\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/criticaldata/PRIMED-AI", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2608.01462", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8f93\u5165N\u4e2a\u6a21\u6001\u5d4c\u5165\u3001\u4efb\u610f\u652f\u6301\u63a9\u7801\u7684\u63a2\u9488\u548c\u6807\u7b7e\uff0c\u8f93\u51fa\u9010\u6837\u672c\u5931\u8d25\u5206\u7c7b\u3001\u6a21\u6001\u4e92\u8865\u6027\u77e9\u9635\u548c\u6a21\u6001dropout\u7684\u54cd\u4eae/\u6c89\u9ed8\u5931\u8d25\u753b\u50cf", "\u5728\u5408\u6210\u690d\u5165\u771f\u503c\u5b9e\u9a8c\u4e2d\uff0c\u53ef\u6062\u590d\u9884\u8bbe\u7684\u4e3b\u5bfc\u6a21\u6001\u548c\u4e92\u8865\u6a21\u6001\u5b50\u96c6\uff0c\u5e76\u6269\u5c55\u5230\u4e09\u6a21\u6001\u4e92\u8865\u6027\u77e9\u9635", "\u5728MIMIC-IV\u914d\u5bf9\u961f\u5217\u4e0a\u7ed3\u5408EchoJEPA\u4e0eHuBERT-ECG\u5d4c\u5165\u8bc4\u4f30LVEF\u548cHFrEF\u7b5b\u67e5\uff0c\u53d1\u73b0\u53bb\u6389\u8d85\u58f0\u5fc3\u52a8\u56fe\u4f1a\u4f7f\u9519\u8bef\u7387\u8fd1\u4e4e\u7ffb\u500d"], "keywords": ["\u591a\u6a21\u6001", "\u533b\u7597AI", "\u6a21\u578b\u8bc4\u4f30", "\u9c81\u68d2\u6027"], "num_comments": 1, "on_hf": true, "organization": "Massachusetts Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2608.01462v1", "published_at": "2026-08-02", "score": 0.459, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01462.png", "title": "Loud or Silent? A Reusable Framework for Per-Modality Failure Analysis in Multimodal Clinical AI", "tldr": "\u8bc4\u4f30\u4e34\u5e8a\u591a\u6a21\u6001\u6a21\u578b\u7684\u6a21\u6001\u7f3a\u5931\u5931\u8d25", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u4e00\u4e2a\u6a21\u578b\u65e0\u5173\u7684\u6a21\u6001\u5931\u8d25\u5206\u6790\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u4e34\u5e8a\u591a\u6a21\u6001\u6a21\u578b\u90e8\u7f72\u65f6\u8bc4\u4f30\u67d0\u4e00\u6a21\u6001\u7f3a\u5931\u5bfc\u81f4\u7684\u9010\u6837\u672c\u9519\u8bef\u3002\u6846\u67b6\u533a\u5206\u9519\u8bef\u7531\u54ea\u4e2a\u6a21\u6001\u9020\u6210\uff0c\u4ee5\u53ca\u5931\u8d25\u662f\u53ef\u76d1\u63a7\u7684\u201c\u54cd\u4eae\u5931\u8d25\u201d\u8fd8\u662f\u96be\u4ee5\u5bdf\u89c9\u7684\u201c\u6c89\u9ed8\u5931\u8d25\u201d\u3002", "why_notable": "\u5b83\u628a\u591a\u6a21\u6001\u4e34\u5e8aAI\u4ece\u201c\u5b8c\u6574\u6a21\u6001\u4e0b\u51c6\u786e\u7387\u201d\u8bc4\u4f30\u63a8\u8fdb\u5230\u66f4\u8d34\u8fd1\u90e8\u7f72\u7684\u6a21\u6001\u7f3a\u5931\u98ce\u9669\u5206\u6790\uff0c\u5c24\u5176\u5173\u6ce8\u6c89\u9ed8\u5931\u8d25\u8fd9\u7c7b\u96be\u4ee5\u88ab\u76d1\u63a7\u53d1\u73b0\u7684\u9519\u8bef\uff0c\u5bf9\u533b\u7597AI\u5b89\u5168\u8bc4\u4f30\u548c\u6a21\u578b\u4e0a\u7ebf\u5ba1\u67e5\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Self-evolving agents increasingly convert interaction histories into reusable skills that persist beyond individual tasks. While prior work studies memory and retrieval poisoning, such attacks only affect agents when poisoned records are retrieved as context. We uncover a new and more fundamental risk: poisoned experiences can be transformed by the agent itself into durable behavioral artifacts. We present \\textbf{SkillJack}, the first attack that exploits the experience-to-skill pipeline of self-evolving agents. Instead of directly manipulating runtime context, SkillJack hijacks the agent\u0027s own learning process to implant malicious behaviors into its reusable skill repertoire. We identify three key properties of this transformation: \\emph{sanitization whitewashing}, where malicious intent is obscured during skill extraction; \\emph{cross-layer promotion}, where transient experiences become persistent capabilities; and \\emph{persistence isolation}, where the attack survives removal of its original source records. We evaluate SkillJack on two representative systems, SkillX and Anything2Skill, using a shared dataset of 150 trajectories across four policy-risk categories. Results show that skill extraction substantially reduces attack detectability: in SkillX, safety detection drops from 98.5\\% for poisoned trajectories to 11.4\\% for extracted skills, while Anything2Skill shows a similar effect. Meanwhile, the implanted skills remain effective, achieving attack success rates of 56.2\\% and 89.2\\% on the two systems, respectively. Furthermore, 80.0\\% of skill-mediated attacks persist after deleting the original poisoned records, and some skills unintentionally activate on benign queries. Our findings reveal skill evolution as a new attack surface and motivate provenance-aware skill lifecycle protection. Our code is available at https://github.com/Tencent/AI-Infra-Guard/research/skilljack.", "arxiv_id": "2608.03509", "arxiv_url": "https://arxiv.org/abs/2608.03509", "authors": ["Zonghao Ying", "Xiangfan Wu", "Huiyu Wu", "Xing Zheng", "Huangsheng Cheng", "Xiaorong Shi", "Jing Guo"], "brief": "\u8bba\u6587\u63d0\u51fa SkillJack\uff0c\u9996\u4e2a\u9488\u5bf9\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u201c\u7ecf\u9a8c\u5230\u6280\u80fd\u201d\u5b66\u4e60\u6d41\u6c34\u7ebf\u7684\u540e\u95e8\u653b\u51fb\u3002\u5b83\u8ba9\u6295\u6bd2\u4ea4\u4e92\u5386\u53f2\u88ab\u667a\u80fd\u4f53\u63d0\u70bc\u4e3a\u53ef\u590d\u7528\u6280\u80fd\uff0c\u4ece\u800c\u628a\u4e34\u65f6\u6076\u610f\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u957f\u671f\u5b58\u5728\u7684\u884c\u4e3a\u80fd\u529b\u3002", "categories": ["cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03509", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63ed\u793a\u4e09\u79cd\u5173\u952e\u673a\u5236\uff1a\u6076\u610f\u610f\u56fe\u5728\u6280\u80fd\u62bd\u53d6\u4e2d\u88ab\u201c\u51c0\u5316\u6d17\u767d\u201d\u3001\u4e34\u65f6\u7ecf\u9a8c\u88ab\u8de8\u5c42\u63d0\u5347\u4e3a\u6301\u4e45\u80fd\u529b\u3001\u5220\u9664\u539f\u59cb\u6295\u6bd2\u8bb0\u5f55\u540e\u653b\u51fb\u4ecd\u53ef\u4fdd\u7559\u3002", "\u5728 SkillX \u4e0e Anything2Skill \u4e24\u4e2a\u7cfb\u7edf\u3001150 \u6761\u8f68\u8ff9\u548c\u56db\u7c7b\u7b56\u7565\u98ce\u9669\u4e0a\u8bc4\u4f30\uff0c\u6280\u80fd\u62bd\u53d6\u663e\u8457\u964d\u4f4e\u68c0\u6d4b\u7387\uff1aSkillX \u4e2d\u4ece 98.5% \u964d\u81f3 11.4%\u3002", "\u690d\u5165\u6280\u80fd\u4ecd\u4fdd\u6301\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\uff1a\u4e24\u4e2a\u7cfb\u7edf\u5206\u522b\u8fbe\u5230 56.2% \u548c 89.2%\uff1b80.0% \u7684\u6280\u80fd\u4ecb\u5bfc\u653b\u51fb\u5728\u5220\u9664\u539f\u59cb\u6295\u6bd2\u8bb0\u5f55\u540e\u4ecd\u6301\u7eed\u5b58\u5728\u3002"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u540e\u95e8\u653b\u51fb", "\u81ea\u8fdb\u5316\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.03509v1", "published_at": "2026-08-04", "score": 0.448, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03509.png", "title": "SkillJack: Persistent Skill Backdoors in Self-Evolving Agents", "tldr": "\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u53ef\u88ab\u690d\u5165\u6301\u4e45\u6280\u80fd\u540e\u95e8", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa SkillJack\uff0c\u9996\u4e2a\u9488\u5bf9\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u201c\u7ecf\u9a8c\u5230\u6280\u80fd\u201d\u5b66\u4e60\u6d41\u6c34\u7ebf\u7684\u540e\u95e8\u653b\u51fb\u3002\u5b83\u8ba9\u6295\u6bd2\u4ea4\u4e92\u5386\u53f2\u88ab\u667a\u80fd\u4f53\u63d0\u70bc\u4e3a\u53ef\u590d\u7528\u6280\u80fd\uff0c\u4ece\u800c\u628a\u4e34\u65f6\u6076\u610f\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u957f\u671f\u5b58\u5728\u7684\u884c\u4e3a\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u7684\u6280\u80fd\u5b66\u4e60\u673a\u5236\u672c\u8eab\u662f\u65b0\u7684\u5b89\u5168\u653b\u51fb\u9762\uff0c\u98ce\u9669\u6bd4\u4f20\u7edf\u8bb0\u5fc6\u68c0\u7d22\u6295\u6bd2\u66f4\u6301\u4e45\u3001\u66f4\u9690\u853d\uff0c\u63d0\u793a\u672a\u6765\u9700\u8981\u9762\u5411\u6280\u80fd\u6765\u6e90\u3001\u751f\u547d\u5468\u671f\u548c\u89e6\u53d1\u6761\u4ef6\u7684\u5b89\u5168\u9632\u62a4\u3002"}, {"abstract": "Recent advances in image generation have demonstrated the potential of unified multimodal models that integrate understanding, generation, and editing. However, unified 3D modeling remains constrained by scarce multimodal data, particularly the lack of large-scale and geometrically consistent editing data. To address this limitation, we propose Hunyuan3D-Buffalo 1.0, a unified framework supporting 3D understanding, text-to-3D generation, instruction-guided 3D editing, and text-grounded part generation within a single architecture. To enable scalable training, we construct an 87M-scale 3D multimodal corpus, comprising 25M understanding samples, 50M text-to-3D pairs, and 12M editing pairs generated using Nano3D-v2. Architecturally, the framework combines Hunyuan3D-VLM for semantic, structural, and spatial understanding with Hunyuan3D DiT for high-fidelity 3D synthesis. The VLM provides multimodal semantic conditions for generation, while editing and part generation additionally condition the diffusion process on the source object representation to preserve its overall structure and unedited regions. Extensive experiments show that Hunyuan3D-Buffalo 1.0 achieves state-of-the-art or leading performance on text-to-3D generation and 3D editing benchmarks, while exhibiting strong understanding and part-generation capabilities. Our analysis further shows that both generation and understanding improve editing, demonstrating the effectiveness of unified 3D multimodal training. Project Page: https://tencent-hunyuan.github.io/Hunyuan3D-Buffalo1.0/", "arxiv_id": "2608.02711", "arxiv_url": "https://arxiv.org/abs/2608.02711", "authors": ["Junliang Ye", "Kenkun Liu", "Guocun Wang", "Yang Li", "Yansong Qu", "Chunshi Wang", "Jingwei Xu", "Yunhan Yang", "Zibo Zhao", "Jiachen Xu", "Jiaao Yu", "Lifu Wang", "Zhihao Liang", "Zhuo Chen", "Chunchao Guo"], "brief": "\u8bba\u6587\u63d0\u51fa Hunyuan3D-Buffalo 1.0\uff0c\u4e00\u4e2a\u7edf\u4e00\u76843D\u591a\u6a21\u6001\u6846\u67b6\uff0c\u8986\u76d63D\u7406\u89e3\u3001\u6587\u751f3D\u3001\u6307\u4ee4\u5f0f3D\u7f16\u8f91\u548c\u6587\u672c\u5b9a\u4f4d\u90e8\u4ef6\u751f\u6210\u3002\u5176\u6838\u5fc3\u662f\u7ed3\u5408 Hunyuan3D-VLM \u7684\u8bed\u4e49/\u7ed3\u6784/\u7a7a\u95f4\u7406\u89e3\u80fd\u529b\u4e0e Hunyuan3D DiT \u7684\u9ad8\u4fdd\u771f3D\u5408\u6210\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02711", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa8700\u4e07\u89c4\u6a213D\u591a\u6a21\u6001\u8bed\u6599\uff0c\u5305\u62ec2500\u4e07\u7406\u89e3\u6837\u672c\u30015000\u4e07\u6587\u751f3D\u5bf9\u548c1200\u4e07\u7f16\u8f91\u5bf9", "\u7f16\u8f91\u4e0e\u90e8\u4ef6\u751f\u6210\u5728\u6269\u6563\u8fc7\u7a0b\u4e2d\u989d\u5916\u6761\u4ef6\u5316\u6e90\u7269\u4f53\u8868\u793a\uff0c\u4ee5\u4fdd\u6301\u6574\u4f53\u7ed3\u6784\u548c\u672a\u7f16\u8f91\u533a\u57df\u4e00\u81f4", "\u5b9e\u9a8c\u663e\u793a\u5728\u6587\u751f3D\u548c3D\u7f16\u8f91\u57fa\u51c6\u4e0a\u8fbe\u5230SOTA\u6216\u9886\u5148\u8868\u73b0\uff0c\u5e76\u5177\u5907\u8f83\u5f3a3D\u7406\u89e3\u4e0e\u90e8\u4ef6\u751f\u6210\u80fd\u529b"], "keywords": ["3D\u751f\u6210", "\u591a\u6a21\u6001", "\u6269\u6563\u6a21\u578b", "3D\u7f16\u8f91"], "num_comments": 0, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2608.02711v1", "published_at": "2026-08-03", "score": 0.443, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02711.png", "title": "Hunyuan3D-Buffalo 1.0: A Unified Multimodal Model for Scalable 3D Generation, Understanding, and Editing", "tldr": "\u7edf\u4e00\u6a21\u578b\u540c\u65f6\u652f\u63013D\u7406\u89e3\u3001\u751f\u6210\u4e0e\u7f16\u8f91", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Hunyuan3D-Buffalo 1.0\uff0c\u4e00\u4e2a\u7edf\u4e00\u76843D\u591a\u6a21\u6001\u6846\u67b6\uff0c\u8986\u76d63D\u7406\u89e3\u3001\u6587\u751f3D\u3001\u6307\u4ee4\u5f0f3D\u7f16\u8f91\u548c\u6587\u672c\u5b9a\u4f4d\u90e8\u4ef6\u751f\u6210\u3002\u5176\u6838\u5fc3\u662f\u7ed3\u5408 Hunyuan3D-VLM \u7684\u8bed\u4e49/\u7ed3\u6784/\u7a7a\u95f4\u7406\u89e3\u80fd\u529b\u4e0e Hunyuan3D DiT \u7684\u9ad8\u4fdd\u771f3D\u5408\u6210\u80fd\u529b\u3002", "why_notable": "\u8fd9\u662f\u9762\u54113D\u5185\u5bb9\u751f\u4ea7\u7684\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\uff0c\u5c06\u7406\u89e3\u3001\u751f\u6210\u548c\u7f16\u8f91\u653e\u5165\u540c\u4e00\u67b6\u6784\u5e76\u901a\u8fc7\u5927\u89c4\u6a21\u6570\u636e\u8bad\u7ec3\uff0c\u7f13\u89e3\u4e863D\u7f16\u8f91\u6570\u636e\u7a00\u7f3a\u95ee\u9898\uff0c\u5bf9\u6e38\u620f\u3001\u5f71\u89c6\u3001\u8bbe\u8ba1\u548c\u5177\u8eab\u4eff\u771f\u4e2d\u7684\u53ef\u63a73D\u8d44\u4ea7\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Enterprise question answering requires models to acquire proprietary knowledge without discarding general capabilities. We present Wnuan, a three-stage pipeline that constructs task-oriented supervision from documents, performs supervised fine-tuning with general-data replay, and applies reinforcement learning to residual errors. On the 707-question WnuanBench, the primary 32B route raises acceptable-answer rate (AAR) from 52.76% before adaptation to 80.06% after SFT and 91.51% after RL. Under a matched 100-update protocol, residual-error sampling outperforms full-pool and size-matched random sampling by 3.11 and 2.97 points, respectively. Source-cluster bootstrap intervals remain above zero for both contrasts, and a same-domain validation set preserves the ordering. The general-benchmark average decreases by 5.17 points across the route, concentrated in instruction following. The automatic evaluation ensemble agrees with an authoritative domain expert on 90.5% of a stratified Wnuan-Inst response sample. These results characterize both the gains and the general-capability cost of staged enterprise adaptation.", "arxiv_id": "2608.01862", "arxiv_url": "https://arxiv.org/abs/2608.01862", "authors": ["Xiaofeng Shi", "Xiaosong Qiu", "Wenxin Ma", "Qian Kou", "Yiming Pan", "Longbin Yu", "Ying Liu", "Haiping Wang", "Hua Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Wnuan\uff0c\u4e00\u4e2a\u9762\u5411\u79c1\u6709\u4f01\u4e1a\u77e5\u8bc6\u95ee\u7b54\u7684\u4e09\u9636\u6bb5\u540e\u8bad\u7ec3\u6d41\u7a0b\uff1a\u4ece\u6587\u6863\u6784\u9020\u4efb\u52a1\u76d1\u7763\u6570\u636e\uff0c\u7ed3\u5408\u901a\u7528\u6570\u636e\u56de\u653e\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u7528\u5f3a\u5316\u5b66\u4e60\u4fee\u6b63\u6b8b\u4f59\u9519\u8bef\u3002\u5b9e\u9a8c\u5728 WnuanBench \u4e0a\u7cfb\u7edf\u91cf\u5316\u4e86\u4f01\u4e1a\u9002\u914d\u6536\u76ca\u4e0e\u901a\u7528\u80fd\u529b\u635f\u8017\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01862", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["32B \u4e3b\u8def\u7ebf\u5728 707 \u9898 WnuanBench \u4e0a\u5c06\u53ef\u63a5\u53d7\u7b54\u6848\u7387\u4ece 52.76% \u63d0\u5347\u5230 SFT \u540e 80.06%\u3001RL \u540e 91.51%\u3002", "\u5728\u76f8\u540c 100 \u6b21\u66f4\u65b0\u8bbe\u7f6e\u4e0b\uff0c\u9488\u5bf9\u6b8b\u4f59\u9519\u8bef\u91c7\u6837\u7684 RL \u5206\u522b\u6bd4\u5168\u6c60\u91c7\u6837\u548c\u7b49\u89c4\u6a21\u968f\u673a\u91c7\u6837\u9ad8 3.11 \u4e0e 2.97 \u4e2a\u767e\u5206\u70b9\u3002", "\u901a\u7528\u57fa\u51c6\u5e73\u5747\u4e0b\u964d 5.17 \u5206\uff0c\u635f\u8017\u4e3b\u8981\u96c6\u4e2d\u5728\u6307\u4ee4\u8ddf\u968f\u80fd\u529b\uff0c\u63ed\u793a\u4f01\u4e1a\u77e5\u8bc6\u9002\u914d\u7684\u80fd\u529b\u6743\u8861\u3002"], "keywords": ["\u4f01\u4e1a\u95ee\u7b54", "\u540e\u8bad\u7ec3", "\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u6ce8\u5165"], "num_comments": 1, "on_hf": true, "organization": "Beijing Academy of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2608.01862v1", "published_at": "2026-08-03", "score": 0.416, "selected_reasons": ["\u77e5\u540d\u673a\u6784: BAAI", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01862.png", "title": "Wnuan: Staged Post-Training for Question Answering over Proprietary Enterprise Knowledge", "tldr": "\u4e09\u9636\u6bb5\u540e\u8bad\u7ec3\u663e\u8457\u63d0\u5347\u4f01\u4e1a\u77e5\u8bc6\u95ee\u7b54", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Wnuan\uff0c\u4e00\u4e2a\u9762\u5411\u79c1\u6709\u4f01\u4e1a\u77e5\u8bc6\u95ee\u7b54\u7684\u4e09\u9636\u6bb5\u540e\u8bad\u7ec3\u6d41\u7a0b\uff1a\u4ece\u6587\u6863\u6784\u9020\u4efb\u52a1\u76d1\u7763\u6570\u636e\uff0c\u7ed3\u5408\u901a\u7528\u6570\u636e\u56de\u653e\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u7528\u5f3a\u5316\u5b66\u4e60\u4fee\u6b63\u6b8b\u4f59\u9519\u8bef\u3002\u5b9e\u9a8c\u5728 WnuanBench \u4e0a\u7cfb\u7edf\u91cf\u5316\u4e86\u4f01\u4e1a\u9002\u914d\u6536\u76ca\u4e0e\u901a\u7528\u80fd\u529b\u635f\u8017\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7ed9\u51fa\u4e86\u4f01\u4e1a\u79c1\u6709\u77e5\u8bc6\u6ce8\u5165\u7684\u53ef\u590d\u73b0\u5b9e\u8bc1\u8def\u7ebf\uff0c\u4e0d\u4ec5\u5c55\u793a\u4e86 SFT+RL \u7684\u663e\u8457\u95ee\u7b54\u6536\u76ca\uff0c\u4e5f\u91cf\u5316\u4e86\u901a\u7528\u80fd\u529b\u9000\u5316\u98ce\u9669\uff0c\u5bf9\u4f01\u4e1a\u5927\u6a21\u578b\u843d\u5730\u548c\u540e\u8bad\u7ec3\u7b56\u7565\u8bbe\u8ba1\u5177\u6709\u5b9e\u9645\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "To operate robustly in open-world environments, autonomous agents should be able to infer the behavior of unfamiliar systems through interaction alone, even in the absence of documentation. However, existing tool-use benchmarks expose semantic tool schemas in static environments, allowing agents to rely on prior knowledge rather than autonomous discovery. To address this limitation, we introduce ScrambleToolBench, an interactive terminal benchmark designed to isolate behavioral reasoning. By removing semantic cues and enforcing a continuous task curriculum, the benchmark requires agents to uncover hidden tool behaviors entirely through trial-and-error interaction. The benchmark further introduces dynamic challenges, including mapping drift, stochastic action failures, and temporal execution windows, to evaluate whether agents can revise and adapt their hypotheses as the environment changes. Our evaluation of state-of-the-art language models reveals that successful initial discovery does not translate into robust adaptation. When faced with structural changes such as mapping drift, agents fail to use deductive strategies such as cycle tracing, and instead exhibit belief inertia or fall back to exhaustive search. Increasing test-time reasoning only amplifies this expensive brute-force search rather than enabling deductive recovery. While equipping agents with persistent memory reduces compounding errors, they remain unable to efficiently infer structural changes, highlighting a gap in current agent reasoning.", "arxiv_id": "2608.02358", "arxiv_url": "https://arxiv.org/abs/2608.02358", "authors": ["Vernon Toh", "Navonil Majumder", "Zhengyuan Liu", "Nancy F. Chen", "Soujanya Poria"], "brief": "\u8bba\u6587\u63d0\u51fa ScrambleToolBench\uff0c\u4e00\u4e2a\u4ea4\u4e92\u5f0f\u7ec8\u7aef\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\uff0c\u901a\u8fc7\u53bb\u9664\u8bed\u4e49\u5de5\u5177\u63d0\u793a\u3001\u5f15\u5165\u8fde\u7eed\u4efb\u52a1\u8bfe\u7a0b\uff0c\u8feb\u4f7f\u667a\u80fd\u4f53\u4ec5\u9760\u8bd5\u9519\u63a8\u65ad\u9690\u85cf\u5de5\u5177\u884c\u4e3a\u3002\u57fa\u51c6\u8fd8\u52a0\u5165\u6620\u5c04\u6f02\u79fb\u3001\u968f\u673a\u52a8\u4f5c\u5931\u8d25\u3001\u65f6\u95f4\u7a97\u53e3\u7b49\u52a8\u6001\u53d8\u5316\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u80fd\u5426\u4fee\u6b63\u5047\u8bbe\u5e76\u9002\u5e94\u73af\u5883\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/declare-lab/ScrambleToolBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02358", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0d\u540c\u4e8e\u4f20\u7edf\u5de5\u5177\u57fa\u51c6\uff0cScrambleToolBench \u9690\u53bb\u5de5\u5177\u540d\u79f0\u548c\u8bed\u4e49 schema\uff0c\u9694\u79bb\u5bf9\u5de5\u5177\u884c\u4e3a\u7684\u81ea\u4e3b\u53d1\u73b0\u80fd\u529b\u3002", "\u8bc4\u6d4b\u663e\u793a\uff0c\u5f53\u524d\u5148\u8fdb\u8bed\u8a00\u6a21\u578b\u5373\u4f7f\u80fd\u5b8c\u6210\u521d\u59cb\u53d1\u73b0\uff0c\u4e5f\u96be\u4ee5\u5728\u6620\u5c04\u6f02\u79fb\u7b49\u7ed3\u6784\u53d8\u5316\u540e\u9ad8\u6548\u6062\u590d\u3002", "\u589e\u52a0\u6d4b\u8bd5\u65f6\u63a8\u7406\u5e76\u672a\u5e26\u6765\u6f14\u7ece\u63a8\u65ad\u80fd\u529b\uff0c\u53cd\u800c\u653e\u5927\u4e86\u6602\u8d35\u7684\u66b4\u529b\u7a77\u4e3e\uff1b\u6301\u4e45\u8bb0\u5fc6\u53ef\u51cf\u5c11\u7d2f\u79ef\u9519\u8bef\u4f46\u4ecd\u4e0d\u8db3\u4ee5\u5e94\u5bf9\u7ed3\u6784\u53d8\u5316\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u63a8\u7406\u80fd\u529b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Deep Cognition and Language Research (DeCLaRe) Lab", "pdf_url": "https://arxiv.org/pdf/2608.02358v1", "published_at": "2026-08-03", "score": 0.414, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02358.png", "title": "ScrambleToolBench: Agents Search Exhaustively Even When Their Own Map Points to the Next Step", "tldr": "\u65b0\u57fa\u51c6\u63ed\u793a\u667a\u80fd\u4f53\u53ea\u4f1a\u7a77\u4e3e\u96be\u4ee5\u9002\u5e94\u5de5\u5177\u53d8\u5316", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa Sc
