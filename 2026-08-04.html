rambleToolBench\uff0c\u4e00\u4e2a\u4ea4\u4e92\u5f0f\u7ec8\u7aef\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\uff0c\u901a\u8fc7\u53bb\u9664\u8bed\u4e49\u5de5\u5177\u63d0\u793a\u3001\u5f15\u5165\u8fde\u7eed\u4efb\u52a1\u8bfe\u7a0b\uff0c\u8feb\u4f7f\u667a\u80fd\u4f53\u4ec5\u9760\u8bd5\u9519\u63a8\u65ad\u9690\u85cf\u5de5\u5177\u884c\u4e3a\u3002\u57fa\u51c6\u8fd8\u52a0\u5165\u6620\u5c04\u6f02\u79fb\u3001\u968f\u673a\u52a8\u4f5c\u5931\u8d25\u3001\u65f6\u95f4\u7a97\u53e3\u7b49\u52a8\u6001\u53d8\u5316\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u80fd\u5426\u4fee\u6b63\u5047\u8bbe\u5e76\u9002\u5e94\u73af\u5883\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f53\u524d LLM \u667a\u80fd\u4f53\u5728\u5f00\u653e\u73af\u5883\u4e2d\u7684\u6838\u5fc3\u77ed\u677f\uff1a\u5b83\u4eec\u5f80\u5f80\u4f9d\u8d56\u8bed\u4e49\u5148\u9a8c\u548c\u641c\u7d22\uff0c\u800c\u975e\u771f\u6b63\u7684\u884c\u4e3a\u5efa\u6a21\u4e0e\u6f14\u7ece\u9002\u5e94\u3002\u5bf9\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u3001\u81ea\u52a8\u5316\u7cfb\u7edf\u4ea4\u4e92\u548c\u5f00\u653e\u4e16\u754c\u9c81\u68d2\u6027\u8bc4\u6d4b\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Existing skill generation methods largely rely on heuristics or pipeline-style consolidation, which must be specially designed for different evidence sources. In contrast, learning-based approaches offer a more unified way to model skill generation across heterogeneous sources. However, learning-based skill generation remains challenging because skills lack a natural supervision signal based on relevance or correctness; their value can largely be determined only by whether they improve the behavior of the agent on downstream tasks. To address this challenge, we propose Skill-$\u03b1$, a reinforcement learning method for progressively generating high-quality agent skills. Specifically, we formulate skill generation as a sequential editing process that decomposes skill construction into individually evaluable edits, and introduce a novel rollback reward that evaluates each edit by comparing downstream execution under the original and edited skills on an anchored query. Extensive experiments show that Skill-$\u03b1$ generates more effective skills than methods based on heuristics or pipelines in both document-to-skill and experience-to-skill settings. Under the main GPT-4o worker, Skill-$\u03b1$ improves average downstream success rates over the strongest skill-generation baseline by 3.3 points on CL-Bench and 6.7 points on tau2-bench. Further ablations validate the importance of rollback reward and progressive generation.", "arxiv_id": "2608.01678", "arxiv_url": "https://arxiv.org/abs/2608.01678", "authors": ["Junhao Shen", "Zhanqiu Zhang", "Yiwen Guo", "Hong Cheng"], "brief": "\u8bba\u6587\u63d0\u51fa Skill-\u03b1\uff0c\u5c06\u667a\u80fd\u4f53\u6280\u80fd\u751f\u6210\u5efa\u6a21\u4e3a\u9010\u6b65\u7f16\u8f91\u8fc7\u7a0b\uff0c\u5e76\u7528\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u6bcf\u4e00\u6b65\u7f16\u8f91\u3002\u5b83\u901a\u8fc7\u201c\u56de\u6eda\u5956\u52b1\u201d\u6bd4\u8f83\u7f16\u8f91\u524d\u540e\u6280\u80fd\u5728\u4e0b\u6e38\u4efb\u52a1\u4e2d\u7684\u6267\u884c\u6548\u679c\uff0c\u4ece\u800c\u83b7\u5f97\u53ef\u5b66\u4e60\u7684\u76d1\u7763\u4fe1\u53f7\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/ejhshen/skill-alpha", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2608.01678", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u628a\u6280\u80fd\u6784\u5efa\u62c6\u89e3\u4e3a\u53ef\u9010\u6b65\u8bc4\u4f30\u7684\u5e8f\u5217\u7f16\u8f91\uff0c\u800c\u975e\u4f9d\u8d56\u624b\u5de5\u542f\u53d1\u5f0f\u6216\u56fa\u5b9a\u6d41\u6c34\u7ebf", "\u63d0\u51fa rollback reward\uff1a\u5728\u951a\u5b9a\u67e5\u8be2\u4e0a\u6bd4\u8f83\u539f\u6280\u80fd\u4e0e\u7f16\u8f91\u540e\u6280\u80fd\u7684\u4e0b\u6e38\u6267\u884c\u8868\u73b0\uff0c\u8bc4\u4f30\u5355\u6b21\u7f16\u8f91\u4ef7\u503c", "\u5728 document-to-skill \u4e0e experience-to-skill \u573a\u666f\u5747\u4f18\u4e8e\u57fa\u7ebf\uff1bGPT-4o worker \u4e0b\u5728 CL-Bench \u63d0\u5347 3.3 \u4e2a\u767e\u5206\u70b9\u3001tau2-bench \u63d0\u5347 6.7 \u4e2a\u767e\u5206\u70b9"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6280\u80fd\u751f\u6210", "LLM"], "num_comments": 1, "on_hf": true, "organization": "The Chinese University of Hong Kong - Database Group", "pdf_url": "https://arxiv.org/pdf/2608.01678v1", "published_at": "2026-08-03", "score": 0.331, "selected_reasons": ["HF trending (50\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01678.png", "title": "Progressive Agent Skill Generation via Reinforcement Learning", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u6e10\u8fdb\u751f\u6210\u9ad8\u8d28\u91cf\u667a\u80fd\u4f53\u6280\u80fd", "upvotes": 50, "what_it_is": "\u8bba\u6587\u63d0\u51fa Skill-\u03b1\uff0c\u5c06\u667a\u80fd\u4f53\u6280\u80fd\u751f\u6210\u5efa\u6a21\u4e3a\u9010\u6b65\u7f16\u8f91\u8fc7\u7a0b\uff0c\u5e76\u7528\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u6bcf\u4e00\u6b65\u7f16\u8f91\u3002\u5b83\u901a\u8fc7\u201c\u56de\u6eda\u5956\u52b1\u201d\u6bd4\u8f83\u7f16\u8f91\u524d\u540e\u6280\u80fd\u5728\u4e0b\u6e38\u4efb\u52a1\u4e2d\u7684\u6267\u884c\u6548\u679c\uff0c\u4ece\u800c\u83b7\u5f97\u53ef\u5b66\u4e60\u7684\u76d1\u7763\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u667a\u80fd\u4f53\u6280\u80fd\u751f\u6210\u63d0\u4f9b\u4e86\u7edf\u4e00\u7684\u5b66\u4e60\u5f0f\u6846\u67b6\uff0c\u7f13\u89e3\u4e86\u6280\u80fd\u7f3a\u4e4f\u663e\u5f0f\u6b63\u786e\u6027\u76d1\u7763\u7684\u95ee\u9898\uff1b\u5176\u5956\u52b1\u8bbe\u8ba1\u76f4\u63a5\u9762\u5411\u4e0b\u6e38\u4efb\u52a1\u6548\u679c\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Single-image feed-forward 3D Gaussian Splatting (3DGS) aims to directly generate a renderable 3D scene representation from one input image, avoiding the cost of multi-view capture and per-scene optimization. However, existing methods are often constrained by a pixel-aligned representation, where Gaussians are predicted from fixed image-grid locations. Such pixel-aligned primitives can produce promising nearby-view renderings, but they remain weakly coupled to underlying scene surfaces and struggle to preserve coherent structures under large viewpoint shifts. We present InfiniSplat, a feed-forward single-image 3DGS framework that moves from a pixel-aligned representation toward a surface-aligned representation. InfiniSplat constructs this representation by first using geometry-guided sampling to place 2D supports according to depth-induced local surface structure, and then applying a query-conditioned implicit decoder to predict Gaussian attributes from the image features queried at these supports. By grounding support locations in geometry while decoupling Gaussian prediction from fixed pixel centers, InfiniSplat produces Gaussian layouts that better follow scene surfaces and reduce scattered primitives caused by grid discretization. Across multiple cross-dataset NVS evaluations, InfiniSplat achieves state-of-the-art performance compared with single-image feed-forward baselines, and demonstrates zero-shot generalization from Hypersim indoor synthetic training to complex open-world scenes. Project page: https://zju3dv.github.io/InfiniSplat.", "arxiv_id": "2608.02437", "arxiv_url": "https://arxiv.org/abs/2608.02437", "authors": ["Jiawei Wang", "Hao Yu", "Yongzhen Hu", "Xinyi Yang", "Tao Ni", "Xin Zhan", "Junbo Chen", "Xiaowei Zhou", "Ruizhen Hu", "Sida Peng"], "brief": "InfiniSplat \u662f\u4e00\u4e2a\u524d\u9988\u5f0f\u5355\u56fe 3D Gaussian Splatting \u6846\u67b6\uff0c\u7528\u4e8e\u4ece\u4e00\u5f20\u56fe\u50cf\u76f4\u63a5\u751f\u6210\u53ef\u6e32\u67d3\u7684\u4e09\u7ef4\u573a\u666f\u8868\u793a\u3002\u5b83\u5c06\u4f20\u7edf\u50cf\u7d20\u5bf9\u9f50\u7684\u9ad8\u65af\u8868\u793a\u6539\u4e3a\u66f4\u8d34\u8fd1\u573a\u666f\u8868\u9762\u7684\u51e0\u4f55\u5bf9\u9f50\u8868\u793a\uff0c\u4ee5\u589e\u5f3a\u5927\u89c6\u89d2\u53d8\u5316\u4e0b\u7684\u7ed3\u6784\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/zju3dv/InfiniSplat", "github_stars": 105, "hf_url": "https://huggingface.co/papers/2608.02437", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u51e0\u4f55\u5f15\u5bfc\u91c7\u6837\uff0c\u6839\u636e\u6df1\u5ea6\u8bf1\u5bfc\u7684\u5c40\u90e8\u8868\u9762\u7ed3\u6784\u653e\u7f6e\u4e8c\u7ef4\u652f\u6301\u70b9\uff0c\u907f\u514d\u56fa\u5b9a\u56fe\u50cf\u7f51\u683c\u4f4d\u7f6e\u5e26\u6765\u7684\u79bb\u6563\u5316\u9650\u5236", "\u91c7\u7528 query-conditioned \u9690\u5f0f\u89e3\u7801\u5668\uff0c\u4ece\u652f\u6301\u70b9\u67e5\u8be2\u5230\u7684\u56fe\u50cf\u7279\u5f81\u4e2d\u9884\u6d4b\u9ad8\u65af\u5c5e\u6027\uff0c\u4f7f\u9ad8\u65af\u5206\u5e03\u66f4\u8d34\u5408\u771f\u5b9e\u8868\u9762", "\u5728\u591a\u4e2a\u8de8\u6570\u636e\u96c6\u65b0\u89c6\u89d2\u5408\u6210\u8bc4\u6d4b\u4e2d\u4f18\u4e8e\u5355\u56fe\u524d\u9988\u57fa\u7ebf\uff0c\u5e76\u5c55\u793a\u4ece Hypersim \u5ba4\u5185\u5408\u6210\u6570\u636e\u5230\u5f00\u653e\u4e16\u754c\u573a\u666f\u7684\u96f6\u6837\u672c\u6cdb\u5316"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "3DGS", "\u65b0\u89c6\u89d2\u5408\u6210", "\u5355\u56fe\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02437v2", "published_at": "2026-08-03", "score": 0.329, "selected_reasons": ["HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02437.png", "title": "InfiniSplat: Implicit Gaussian Decoding for Large-Baseline Monocular View Synthesis", "tldr": "\u5355\u56fe\u8868\u9762\u5bf9\u9f503DGS\u63d0\u5347\u5927\u57fa\u7ebf\u89c6\u89d2\u5408\u6210", "upvotes": 24, "what_it_is": "InfiniSplat \u662f\u4e00\u4e2a\u524d\u9988\u5f0f\u5355\u56fe 3D Gaussian Splatting \u6846\u67b6\uff0c\u7528\u4e8e\u4ece\u4e00\u5f20\u56fe\u50cf\u76f4\u63a5\u751f\u6210\u53ef\u6e32\u67d3\u7684\u4e09\u7ef4\u573a\u666f\u8868\u793a\u3002\u5b83\u5c06\u4f20\u7edf\u50cf\u7d20\u5bf9\u9f50\u7684\u9ad8\u65af\u8868\u793a\u6539\u4e3a\u66f4\u8d34\u8fd1\u573a\u666f\u8868\u9762\u7684\u51e0\u4f55\u5bf9\u9f50\u8868\u793a\uff0c\u4ee5\u589e\u5f3a\u5927\u89c6\u89d2\u53d8\u5316\u4e0b\u7684\u7ed3\u6784\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u5355\u56fe 3DGS \u5728\u5927\u57fa\u7ebf\u89c6\u89d2\u4e0b\u7ed3\u6784\u6563\u4e71\u3001\u8868\u9762\u8026\u5408\u5f31\u7684\u95ee\u9898\u63d0\u51fa\u4e86\u66f4\u5408\u7406\u7684\u8868\u9762\u5bf9\u9f50\u8868\u793a\uff0c\u6709\u671b\u63d0\u5347\u65e0\u9700\u591a\u89c6\u89d2\u91c7\u96c6\u548c\u9010\u573a\u666f\u4f18\u5316\u7684\u5feb\u901f\u4e09\u7ef4\u91cd\u5efa\u4e0e\u65b0\u89c6\u89d2\u5408\u6210\u80fd\u529b\u3002"}, {"abstract": "Controllable video generation models are increasingly being developed as world models. Accordingly, evaluating them in this role extends beyond the apparent appearance of generated videos to the inherent reactivity of the worlds they depict: the ability to infer from the scene state how the world should react and to generate plausible consequences not explicitly described in the input. Yet existing benchmarks mainly assess visual quality or explicit instruction fulfillment by checking whether requested actions and interaction outcomes are realized, leaving inherent reactivity underexamined. We introduce WorldExam, a hierarchical diagnostic benchmark spanning four levels: Visual Quality, Control Adherence, Spatial Consistency, and World Reactivity. It comprises 1,474 cases across eight dedicated tasks and supports unified evaluation of camera-, action-, and language-driven model paradigms. The World Reactivity level evaluates scene-conditioned reactions and goal-directed behaviors beyond what is explicitly specified in the input. Evaluation of 20 representative models reveals a clear capability split. Camera-driven models excel at camera control, but their interfaces do not support dynamic interaction; action-driven models control subjects more precisely but often leave the world unresponsive; and language-driven models perform better on interaction but follow complex controls less faithfully. No model combines broad task coverage with consistently strong performance, showing that high visual quality and explicit instruction fulfillment do not guarantee inherent reactivity.", "arxiv_id": "2608.02603", "arxiv_url": "https://arxiv.org/abs/2608.02603", "authors": ["Yuxue Yang", "Shuyao Shang", "Jiahe Wang", "Zitong Zhou", "Liang Tan", "Junhan Zeng", "Ruizhi Li", "Junyan Li", "Yu Liu", "Xiao Yang", "Yong Li", "Jun Zhu", "Hongsheng Li", "Tieniu Tan", "Lue Fan", "Zhaoxiang Zhang"], "brief": "\u8bba\u6587\u63d0\u51faWorldExam\uff0c\u4e00\u4e2a\u9762\u5411\u53ef\u63a7\u89c6\u9891\u751f\u6210\u4e16\u754c\u6a21\u578b\u7684\u5206\u5c42\u8bca\u65ad\u57fa\u51c6\uff0c\u4ece\u89c6\u89c9\u8d28\u91cf\u3001\u63a7\u5236\u9075\u5faa\u3001\u7a7a\u95f4\u4e00\u81f4\u6027\u5230\u4e16\u754c\u53cd\u5e94\u6027\u8fdb\u884c\u7edf\u4e00\u8bc4\u4f30\u3002\u5176\u5305\u542b8\u7c7b\u4efb\u52a1\u30011474\u4e2a\u6848\u4f8b\uff0c\u8986\u76d6\u76f8\u673a\u9a71\u52a8\u3001\u52a8\u4f5c\u9a71\u52a8\u548c\u8bed\u8a00\u9a71\u52a8\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/YuxueYang1204/worldexam", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2608.02603", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u201c\u4e16\u754c\u53cd\u5e94\u6027\u201d\u8bc4\u6d4b\u5c42\uff0c\u8003\u5bdf\u6a21\u578b\u80fd\u5426\u57fa\u4e8e\u573a\u666f\u72b6\u6001\u751f\u6210\u672a\u88ab\u663e\u5f0f\u6307\u5b9a\u4f46\u5408\u7406\u7684\u540e\u679c\u4e0e\u76ee\u6807\u5bfc\u5411\u884c\u4e3a", "\u57fa\u51c6\u5305\u542b1474\u4e2a\u6848\u4f8b\u548c8\u4e2a\u4e13\u95e8\u4efb\u52a1\uff0c\u652f\u6301\u4e0d\u540c\u63a7\u5236\u8303\u5f0f\u7684\u89c6\u9891\u751f\u6210\u6a21\u578b\u7edf\u4e00\u6bd4\u8f83", "\u8bc4\u6d4b20\u4e2a\u4ee3\u8868\u6027\u6a21\u578b\u53d1\u73b0\uff1a\u76f8\u673a\u9a71\u52a8\u64c5\u957f\u955c\u5934\u63a7\u5236\uff0c\u52a8\u4f5c\u9a71\u52a8\u66f4\u7cbe\u786e\u63a7\u5236\u4e3b\u4f53\uff0c\u8bed\u8a00\u9a71\u52a8\u66f4\u64c5\u957f\u4ea4\u4e92\u4f46\u590d\u6742\u63a7\u5236\u8f83\u5f31"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02603v1", "published_at": "2026-08-03", "score": 0.319, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02603.png", "title": "WorldExam: Benchmarking World Models from Apparent Appearance to Inherent Reactivity", "tldr": "WorldExam\u7cfb\u7edf\u8bc4\u6d4b\u89c6\u9891\u4e16\u754c\u6a21\u578b\u53cd\u5e94\u6027", "upvotes": 30, "what_it_is": "\u8bba\u6587\u63d0\u51faWorldExam\uff0c\u4e00\u4e2a\u9762\u5411\u53ef\u63a7\u89c6\u9891\u751f\u6210\u4e16\u754c\u6a21\u578b\u7684\u5206\u5c42\u8bca\u65ad\u57fa\u51c6\uff0c\u4ece\u89c6\u89c9\u8d28\u91cf\u3001\u63a7\u5236\u9075\u5faa\u3001\u7a7a\u95f4\u4e00\u81f4\u6027\u5230\u4e16\u754c\u53cd\u5e94\u6027\u8fdb\u884c\u7edf\u4e00\u8bc4\u4f30\u3002\u5176\u5305\u542b8\u7c7b\u4efb\u52a1\u30011474\u4e2a\u6848\u4f8b\uff0c\u8986\u76d6\u76f8\u673a\u9a71\u52a8\u3001\u52a8\u4f5c\u9a71\u52a8\u548c\u8bed\u8a00\u9a71\u52a8\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u9ad8\u89c6\u89c9\u8d28\u91cf\u548c\u663e\u5f0f\u6307\u4ee4\u5b8c\u6210\u5e76\u4e0d\u7b49\u4e8e\u771f\u6b63\u5177\u5907\u4e16\u754c\u6a21\u578b\u80fd\u529b\uff0c\u4e3a\u8bc4\u4f30\u53ef\u63a7\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u7269\u7406\u4e0e\u4ea4\u4e92\u53cd\u5e94\u6027\u63d0\u4f9b\u4e86\u66f4\u7cfb\u7edf\u7684\u8bca\u65ad\u5de5\u5177\u3002"}, {"abstract": "Optimization-based latent reasoning improves large language model outputs by optimizing instance-specific continuous states at test time while keeping model parameters frozen. Existing methods, however, typically connect these states to the reasoning trajectory through decoded tokens, making sequence-level credit assignment indirect and obscuring how latent updates shape subsequent reasoning. We introduce GradCuit (gradient through circuit), which inserts optimizable latent states at a selected Transformer layer between the hidden representations of the prompt and the generated continuation. Causal self-attention provides every continuation-token log-probability with a differentiable path to every preceding latent state through the remaining Transformer blocks, enabling reward-weighted gradients from the entire continuation to be assigned directly to the latents. Across five instruction-tuned backbones, three reasoning benchmarks, and two answer formats, GradCuit achieves an average accuracy of 64.5%, outperforming chain-of-thought prompting by 6.6 percentage points and the strongest competing method by 2.4 points. GradCuit also demonstrates greater robustness: across seven learning-rate settings, it consistently outperforms LatentSeek while reducing the standard deviation of accuracy from 1.53 to 0.82, and even its random-walk variant remains competitive with LatentSeek. For interpretability, token-level gradient attribution reveals that latent influence concentrates on reasoning-connector tokens, while layer analysis identifies early-to-middle Transformer layers as the most effective optimization space. By directly optimizing internal reasoning from outcome feedback, GradCuit opens a new axis of robust and interpretable test-time scaling, where LLMs adapt how they reason rather than merely regenerate, sample, or rerank outputs.", "arxiv_id": "2608.02585", "arxiv_url": "https://arxiv.org/abs/2608.02585", "authors": ["Zhaoxin Yu", "Qi Shen", "Hengli Li", "Zhaowei Zhang", "Song-Chun Zhu", "Chi Zhang", "Zilong Zheng"], "brief": "\u672c\u6587\u63d0\u51fa GradCuit\uff0c\u5728 Transformer \u4e2d\u95f4\u5c42\u63d2\u5165\u53ef\u4f18\u5316\u6f5c\u53d8\u91cf\uff0c\u5e76\u5728\u6d4b\u8bd5\u65f6\u51bb\u7ed3\u6a21\u578b\u53c2\u6570\u3001\u4ec5\u4f9d\u636e\u8f93\u51fa\u5956\u52b1\u66f4\u65b0\u8fd9\u4e9b\u6f5c\u53d8\u91cf\u3002\u5b83\u8ba9\u6574\u4e2a\u751f\u6210\u7eed\u5199\u7684 log-probability \u90fd\u80fd\u901a\u8fc7\u81ea\u6ce8\u610f\u529b\u5bf9\u524d\u7f6e\u6f5c\u53d8\u91cf\u5f62\u6210\u53ef\u5fae\u8def\u5f84\uff0c\u4ece\u800c\u5b9e\u73b0\u66f4\u76f4\u63a5\u7684\u5e8f\u5217\u7ea7\u4fe1\u7528\u5206\u914d\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/Yuzhaoxin946/GradCuit", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.02585", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u63d0\u793a\u4e0e\u751f\u6210\u7eed\u5199\u7684\u9690\u85cf\u8868\u793a\u4e4b\u95f4\u63d2\u5165\u53ef\u4f18\u5316 latent states\uff0c\u4f7f\u540e\u7eed token \u7684\u6982\u7387\u53ef\u5bf9\u8fd9\u4e9b\u6f5c\u53d8\u91cf\u53cd\u5411\u4f20\u64ad\u3002", "\u57285\u4e2a\u6307\u4ee4\u5fae\u8c03\u6a21\u578b\u30013\u4e2a\u63a8\u7406\u57fa\u51c6\u30012\u79cd\u7b54\u6848\u683c\u5f0f\u4e0a\u5e73\u5747\u51c6\u786e\u7387\u8fbe64.5%\uff0c\u6bd4 CoT prompting \u9ad86.6\u4e2a\u767e\u5206\u70b9\uff0c\u6bd4\u6700\u5f3a\u7ade\u54c1\u9ad82.4\u4e2a\u767e\u5206\u70b9\u3002", "\u5bf9\u5b66\u4e60\u7387\u66f4\u9c81\u68d2\uff1a7\u79cd\u8bbe\u7f6e\u4e0b\u5747\u4f18\u4e8e LatentSeek\uff0c\u51c6\u786e\u7387\u6807\u51c6\u5dee\u4ece1.53\u964d\u81f30.82\uff1b\u68af\u5ea6\u5f52\u56e0\u663e\u793a\u6f5c\u53d8\u91cf\u4e3b\u8981\u5f71\u54cd\u63a8\u7406\u8fde\u63a5\u8bcd\uff0c\u65e9\u4e2d\u5c42\u4f18\u5316\u6700\u6709\u6548\u3002"], "keywords": ["\u6d4b\u8bd5\u65f6\u4f18\u5316", "\u6f5c\u53d8\u91cf\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02585v1", "published_at": "2026-08-03", "score": 0.304, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02585.png", "title": "GradCuit: Credit-Assigned Gradient Flow Enables Robust and Interpretable Test-Time Latent Reasoning", "tldr": "\u7528\u68af\u5ea6\u76f4\u8fbe\u6f5c\u53d8\u91cf\u63d0\u5347\u6d4b\u8bd5\u65f6\u63a8\u7406", "upvotes": 21, "what_it_is": "\u672c\u6587\u63d0\u51fa GradCuit\uff0c\u5728 Transformer \u4e2d\u95f4\u5c42\u63d2\u5165\u53ef\u4f18\u5316\u6f5c\u53d8\u91cf\uff0c\u5e76\u5728\u6d4b\u8bd5\u65f6\u51bb\u7ed3\u6a21\u578b\u53c2\u6570\u3001\u4ec5\u4f9d\u636e\u8f93\u51fa\u5956\u52b1\u66f4\u65b0\u8fd9\u4e9b\u6f5c\u53d8\u91cf\u3002\u5b83\u8ba9\u6574\u4e2a\u751f\u6210\u7eed\u5199\u7684 log-probability \u90fd\u80fd\u901a\u8fc7\u81ea\u6ce8\u610f\u529b\u5bf9\u524d\u7f6e\u6f5c\u53d8\u91cf\u5f62\u6210\u53ef\u5fae\u8def\u5f84\uff0c\u4ece\u800c\u5b9e\u73b0\u66f4\u76f4\u63a5\u7684\u5e8f\u5217\u7ea7\u4fe1\u7528\u5206\u914d\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u6d4b\u8bd5\u65f6\u63a8\u7406\u4f18\u5316\u4ece\u201c\u91cd\u91c7\u6837/\u91cd\u6392\u5e8f\u8f93\u51fa\u201d\u63a8\u8fdb\u5230\u201c\u76f4\u63a5\u8c03\u6574\u6a21\u578b\u5185\u90e8\u63a8\u7406\u72b6\u6001\u201d\uff0c\u540c\u65f6\u63d0\u5347\u6027\u80fd\u3001\u7a33\u5b9a\u6027\u4e0e\u53ef\u89e3\u91ca\u6027\uff0c\u4e3a LLM \u6d4b\u8bd5\u65f6\u6269\u5c55\u63d0\u4f9b\u4e86\u65b0\u7684\u6280\u672f\u65b9\u5411\u3002"}, {"abstract": "Real-world software development requires coding agents to operate in shared workspaces where users may inspect and modify code during an ongoing task, yet existing repository-level benchmarks typically evaluate agents working alone or restrict user participation to messages. This leads us to ask: how do coding agents understand and respond to code changes in a shared workspace? We introduce SWE-Touch, a framework that stress-tests this setting through validated Counter-Edits: plausible edits to task-relevant code that conflict with task completion. SWE-Touch mines task-critical regions from multiple repair trajectories, uses a separate User Patch Generator to construct the edits, and injects them with contextual user messages when agents reach the relevant code. We evaluate nine coding models on SWE-bench Verified, with additional experiments on longer-horizon tasks from SWE-Bench Pro and DeepSWE. Counter-Edit lowers average resolve rate by 7.7 percentage points on SWE-bench Verified, with degradation also persisting on both longer-horizon benchmarks. Trajectory analysis links these failures to limited awareness of the evolving workspace: agents may retain conflicting code or replace it without sufficiently re-inspecting the repository and validating the revised code with targeted tests. These findings show that strong autonomous performance does not yet ensure the state awareness and adaptive behavior needed for shared-workspace collaboration, and point to detecting workspace changes, reconciling conflicting edits with the task, and verifying the affected behavior as key capabilities for future optimization.", "arxiv_id": "2608.02499", "arxiv_url": "https://arxiv.org/abs/2608.02499", "authors": ["Yuqiao Tan", "Jinxiang Meng", "Fangyu Lei", "Minzheng Wang", "Shizhu He", "Jun Zhao", "Kang Liu"], "brief": "\u8bba\u6587\u63d0\u51fa SWE-Touch\uff0c\u4e00\u4e2a\u9762\u5411\u5171\u4eab\u4ee3\u7801\u5de5\u4f5c\u533a\u7684\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u5411\u4efb\u52a1\u5173\u952e\u4ee3\u7801\u533a\u57df\u6ce8\u5165\u4e0e\u4efb\u52a1\u76ee\u6807\u51b2\u7a81\u4f46\u5408\u7406\u7684\u7528\u6237 Counter-Edits\uff0c\u6d4b\u8bd5\u667a\u80fd\u4f53\u80fd\u5426\u611f\u77e5\u3001\u7406\u89e3\u5e76\u9002\u5e94\u7528\u6237\u5728\u6267\u884c\u8fc7\u7a0b\u4e2d\u4fee\u6539\u4ee3\u7801\u3002", "categories": ["cs.SE", "cs.AI", "cs.CL"], "github_repo": "https://github.com/Trae1ounG/SWE-Touch", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2608.02499", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4ece\u591a\u6761\u4fee\u590d\u8f68\u8ff9\u4e2d\u6316\u6398\u4efb\u52a1\u5173\u952e\u4ee3\u7801\u533a\u57df\uff0c\u5e76\u7531\u72ec\u7acb\u7684 User Patch Generator \u751f\u6210\u5408\u7406\u7684\u51b2\u7a81\u6027\u7528\u6237\u7f16\u8f91\u3002", "\u5728 SWE-bench Verified \u4e0a\u8bc4\u6d4b 9 \u4e2a\u7f16\u7801\u6a21\u578b\uff0cCounter-Edit \u4f7f\u5e73\u5747\u89e3\u51b3\u7387\u4e0b\u964d 7.7 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728 SWE-Bench Pro\u3001DeepSWE \u7b49\u957f\u7a0b\u4efb\u52a1\u4e2d\u6301\u7eed\u9020\u6210\u6027\u80fd\u9000\u5316\u3002", "\u5931\u8d25\u5206\u6790\u663e\u793a\uff0c\u667a\u80fd\u4f53\u5e38\u7f3a\u4e4f\u5bf9\u52a8\u6001\u5de5\u4f5c\u533a\u7684\u72b6\u6001\u611f\u77e5\uff1a\u4f1a\u4fdd\u7559\u51b2\u7a81\u4ee3\u7801\uff0c\u6216\u5728\u672a\u5145\u5206\u91cd\u65b0\u68c0\u67e5\u4ed3\u5e93\u548c\u5b9a\u5411\u6d4b\u8bd5\u7684\u60c5\u51b5\u4e0b\u8986\u76d6\u7528\u6237\u6539\u52a8\u3002"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u6d4b\u8bd5", "\u534f\u4f5c\u5f00\u53d1"], "num_comments": 1, "on_hf": true, "organization": "Chinese Academic of Science Institute of Automation", "pdf_url": "https://arxiv.org/pdf/2608.02499v1", "published_at": "2026-08-03", "score": 0.302, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02499.png", "title": "SWE-Touch: Benchmarking Coding Agents When Users Touch the Code", "tldr": "\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\u5e94\u5bf9\u7528\u6237\u6539\u4ee3\u7801\u7684\u80fd\u529b", "upvotes": 22, "what_it_is": "\u8bba\u6587\u63d0\u51fa SWE-Touch\uff0c\u4e00\u4e2a\u9762\u5411\u5171\u4eab\u4ee3\u7801\u5de5\u4f5c\u533a\u7684\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u5411 oss Same, Near, and Far category gaps. Extensive experiments demonstrate state-of-the-art motion fidelity and target preservation. Project page: https://miniz233.github.io/MotionBeyondMorphology/", "arxiv_id": "2608.01628", "arxiv_url": "https://arxiv.org/abs/2608.01628", "authors": ["Zhixue Fang", "Zhimin Zhang", "Bi\u0027an Du", "Zijie Meng", "Yan Zhou", "Wei Hu", "Guoxin Zhang", "Pengfei Wan", "Kun Gai"], "brief": "\u8bba\u6587\u63d0\u51fa Motion Beyond Morphology\uff0c\u65e8\u5728\u6446\u8131\u56fa\u5b9a\u7ed3\u6784\u5bf9\u5e94\uff0c\u5b9e\u73b0\u4e0d\u540c\u5f62\u6001\u3001\u5173\u8282\u548c\u5f62\u53d8\u673a\u5236\u5bf9\u8c61\u4e4b\u95f4\u7684\u53ef\u8fc1\u79fb\u52a8\u4f5c\u4fdd\u6301\u3002\u5176\u4e24\u9636\u6bb5\u6846\u67b6\u5148\u5b66\u4e60\u591a\u7c92\u5ea6\u62bd\u8c61\u8fd0\u52a8\u8868\u793a\u5e76\u6784\u9020\u8de8\u7c7b\u522b\u89c6\u9891\u76d1\u7763\uff0c\u518d\u5c06\u5176\u5185\u5316\u4e3a\u53c2\u8003\u89c6\u9891\u6761\u4ef6\u751f\u6210\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/miniz233/MBM", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.01628", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Stage I \u5b66\u4e60\u4e92\u8865\u7684\u591a\u7c92\u5ea6\u62bd\u8c61\u8fd0\u52a8\u89c6\u56fe\uff0c\u7528\u4e8e\u5f15\u5bfc\u751f\u6210\u4fdd\u6301\u53ef\u8fc1\u79fb\u52a8\u529b\u5b66\u7684\u8de8\u7c7b\u522b\u89c6\u9891\u5bf9", "Stage II \u5c06\u8de8\u7c7b\u522b\u76d1\u7763\u84b8\u998f\u8fdb\u76f4\u63a5\u53c2\u8003\u89c6\u9891\u6761\u4ef6\u751f\u6210\uff0c\u63a8\u7406\u65f6\u65e0\u9700\u663e\u5f0f\u52a8\u4f5c\u63d0\u53d6", "\u6784\u5efa OpenVMT-Dataset \u4e0e OpenVMT-Bench\uff0c\u8986\u76d6 Same\u3001Near\u3001Far \u7c7b\u522b\u5dee\u8ddd\u4e0b\u7684\u56fe\u50cf\u548c\u6587\u672c\u6761\u4ef6\u52a8\u4f5c\u8fc1\u79fb\u8bc4\u6d4b"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u52a8\u4f5c\u8fc1\u79fb", "\u591a\u6a21\u6001", "\u8868\u793a\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "Kling Team", "pdf_url": "https://arxiv.org/pdf/2608.01628v2", "published_at": "2026-08-03", "score": 0.3, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01628.png", "title": "Motion Beyond Morphology: Bootstrapping Cross-Category Motion Transfer from Abstract Motion Representations", "tldr": "\u8de8\u5f62\u6001\u89c6\u9891\u52a8\u4f5c\u8fc1\u79fb\u65b0\u6846\u67b6", "upvotes": 20, "what_it_is": "\u8bba\u6587\u63d0\u51fa Motion Beyond Morphology\uff0c\u65e8\u5728\u6446\u8131\u56fa\u5b9a\u7ed3\u6784\u5bf9\u5e94\uff0c\u5b9e\u73b0\u4e0d\u540c\u5f62\u6001\u3001\u5173\u8282\u548c\u5f62\u53d8\u673a\u5236\u5bf9\u8c61\u4e4b\u95f4\u7684\u53ef\u8fc1\u79fb\u52a8\u4f5c\u4fdd\u6301\u3002\u5176\u4e24\u9636\u6bb5\u6846\u67b6\u5148\u5b66\u4e60\u591a\u7c92\u5ea6\u62bd\u8c61\u8fd0\u52a8\u8868\u793a\u5e76\u6784\u9020\u8de8\u7c7b\u522b\u89c6\u9891\u76d1\u7763\uff0c\u518d\u5c06\u5176\u5185\u5316\u4e3a\u53c2\u8003\u89c6\u9891\u6761\u4ef6\u751f\u6210\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u89c6\u9891\u52a8\u4f5c\u8fc1\u79fb\u4ece\u201c\u7ed3\u6784\u5bf9\u5e94\u201d\u63a8\u8fdb\u5230\u201c\u62bd\u8c61\u52a8\u529b\u5b66\u8fc1\u79fb\u201d\uff0c\u66f4\u9002\u5408\u5904\u7406\u52a8\u7269\u3001\u7269\u4f53\u3001\u89d2\u8272\u7b49\u5f62\u6001\u5dee\u5f02\u5de8\u5927\u7684\u573a\u666f\uff0c\u5e76\u5728\u52a8\u4f5c\u4fdd\u771f\u4e0e\u76ee\u6807\u4fdd\u6301\u4e0a\u8fbe\u5230\u9886\u5148\u6548\u679c\uff0c\u5177\u6709\u89c6\u9891\u751f\u6210\u548c\u52a8\u753b\u5236\u4f5c\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Long-form and real-time talking-head generation remains challenging due to a latency-quality trade-off: inefficient multi-step diffusion prohibits streaming generation, whereas real-time autoregressive approaches suffer from error accumulation and identity drift. To address this drawback, we propose LeapTalk, a novel framework that achieves stable and real-time talking-head generation with a single forward step, scaling to arbitrarily long videos. At the heart of our approach lies a single-step bridge distillation scheme. On the one hand, departing from the conventional noise-to-data paradigm, we introduce a data-to-data transport formulation based on a Brownian bridge. Anchored by a persistent reference, this strategy effectively mitigates identity drift and enhances long-term temporal stability. On the other hand, to enable smooth knowledge transfer from a pre-trained diffusion teacher to the student bridge model, we explore a heterogeneous distillation framework with an SNR-aligned time transformation $\u03a6(\u03c4)$, which bridges the functional discrepancy between the two models. Moreover, we propose an audio-driven classifier-free guidance mechanism to maintain fine-grained lip synchronization under extreme step reduction. Extensive experiments demonstrate that our method achieves high-fidelity and temporally consistent video generation with only 1 step at up to 200 FPS, significantly outperforming existing approaches in both efficiency and stability. Project Page: https://zhangrongxiang.github.io/leaptalk-page/", "arxiv_id": "2608.00079", "arxiv_url": "https://arxiv.org/abs/2608.00079", "authors": ["Rongxiang Zhang", "Songhua Liu"], "brief": "LeapTalk \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u65f6\u4e0e\u5b9e\u65f6\u8bf4\u8bdd\u4eba\u5934\u90e8\u751f\u6210\u7684\u5355\u6b65\u6846\u67b6\uff0c\u901a\u8fc7\u6865\u84b8\u998f\u5c06\u9884\u8bad\u7ec3\u6269\u6563\u6a21\u578b\u538b\u7f29\u4e3a\u4e00\u6b21\u524d\u5411\u63a8\u7406\u5373\u53ef\u751f\u6210\u89c6\u9891\u3002\u5b83\u53ef\u6269\u5c55\u5230\u4efb\u610f\u957f\u5ea6\u89c6\u9891\uff0c\u5e76\u663e\u8457\u7f13\u89e3\u81ea\u56de\u5f52\u65b9\u6cd5\u4e2d\u7684\u8eab\u4efd\u6f02\u79fb\u4e0e\u8bef\u5dee\u7d2f\u79ef\u3002", "categories": ["cs.CV", "cs.SD"], "github_repo": "https://github.com/zhangrongxiang/LeapTalk", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2608.00079", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u57fa\u4e8e Brownian bridge \u7684 data-to-data transport\uff0c\u800c\u975e\u4f20\u7edf noise-to-data \u751f\u6210\uff0c\u5e76\u7528\u6301\u4e45\u53c2\u8003\u951a\u5b9a\u8eab\u4efd\u4ee5\u63d0\u5347\u957f\u7a0b\u7a33\u5b9a\u6027", "\u8bbe\u8ba1\u5f02\u6784\u84b8\u998f\u6846\u67b6\u548c SNR \u5bf9\u9f50\u7684\u65f6\u95f4\u53d8\u6362 \u03a6(\u03c4)\uff0c\u4f7f\u6269\u6563\u6559\u5e08\u6a21\u578b\u7684\u77e5\u8bc6\u5e73\u6ed1\u8fc1\u79fb\u5230\u5355\u6b65\u6865\u6a21\u578b", "\u5f15\u5165\u97f3\u9891\u9a71\u52a8\u7684 classifier-free guidance\uff0c\u5728\u6781\u5c11\u6b65\u6570\u4e0b\u4ecd\u4fdd\u6301\u7ec6\u7c92\u5ea6\u5507\u5f62\u540c\u6b65\uff1b\u5b9e\u9a8c\u663e\u793a 1 \u6b65\u751f\u6210\u6700\u9ad8\u53ef\u8fbe 200 FPS"], "keywords": ["\u6570\u5b57\u4eba", "\u6269\u6563\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u84b8\u998f"], "num_comments": 1, "on_hf": true, "organization": "Shanghai Jiao Tong University SAI", "pdf_url": "https://arxiv.org/pdf/2608.00079v1", "published_at": "2026-07-29", "score": 0.295, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00079.png", "title": "LeapTalk: Breaking the Latency-Quality Trade-off in Talking Head Generation", "tldr": "\u5355\u6b65\u5b9e\u65f6\u751f\u6210\u7a33\u5b9a\u9ad8\u4fdd\u771f\u8bf4\u8bdd\u4eba\u89c6\u9891", "upvotes": 13, "what_it_is": "LeapTalk \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u65f6\u4e0e\u5b9e\u65f6\u8bf4\u8bdd\u4eba\u5934\u90e8\u751f\u6210\u7684\u5355\u6b65\u6846\u67b6\uff0c\u901a\u8fc7\u6865\u84b8\u998f\u5c06\u9884\u8bad\u7ec3\u6269\u6563\u6a21\u578b\u538b\u7f29\u4e3a\u4e00\u6b21\u524d\u5411\u63a8\u7406\u5373\u53ef\u751f\u6210\u89c6\u9891\u3002\u5b83\u53ef\u6269\u5c55\u5230\u4efb\u610f\u957f\u5ea6\u89c6\u9891\uff0c\u5e76\u663e\u8457\u7f13\u89e3\u81ea\u56de\u5f52\u65b9\u6cd5\u4e2d\u7684\u8eab\u4efd\u6f02\u79fb\u4e0e\u8bef\u5dee\u7d2f\u79ef\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u7a81\u7834\u8bf4\u8bdd\u4eba\u89c6\u9891\u751f\u6210\u4e2d\u5b9e\u65f6\u6027\u4e0e\u8d28\u91cf\u96be\u4ee5\u517c\u5f97\u7684\u95ee\u9898\uff0c\u628a\u6269\u6563\u6a21\u578b\u7ea7\u522b\u7684\u89c6\u89c9\u8d28\u91cf\u538b\u7f29\u5230\u5355\u6b65\u63a8\u7406\uff0c\u5e76\u517c\u987e\u957f\u89c6\u9891\u8eab\u4efd\u4e00\u81f4\u6027\u548c\u5507\u5f62\u540c\u6b65\uff0c\u5177\u5907\u5b9e\u65f6\u6570\u5b57\u4eba\u3001\u76f4\u64ad\u4e92\u52a8\u548c\u89c6\u9891\u901a\u4fe1\u7b49\u5e94\u7528\u6f5c\u529b\u3002"}, {"abstract": "Computer-Aided Design (CAD) underpins modern engineering, yet converting existing shapes into editable models still demands substantial expert effort. Most AI systems emit the entire CAD program in a single pass, never inspecting the intermediate geometry. In contrast, human engineers build a part feature by feature, checking after each operation what remains to be modeled. We introduce CADENA (Spanish for \"chain\"), a model that reconstructs a 3D mesh as a parametric CAD program, growing its sequence of operations one at a time and comparing the target with the currently predicted geometry at every step. We also address the lack of benchmarks for evaluating reverse-engineering methods on mechanical parts, introducing CADENA-Bench, a benchmark that measures performance across categories of mechanical parts. CADENA outperforms prior methods on CADENA-Bench and on the DeepCAD, Fusion 360, and MCB datasets. Code is available at https://github.com/zhemdi/cadena, model weights at https://huggingface.co/kulibinai/cadena, and CADENA-Bench at https://huggingface.co/datasets/kulibinai/cadena-bench.", "arxiv_id": "2608.00799", "arxiv_url": "https://arxiv.org/abs/2608.00799", "authors": ["Soslan Kabisov", "Gennadiy Savrasov", "Maksim Elistratov", "Antonio Rodriguez", "Daniil Ignatiev", "Nikita Gavrilov", "Rustam Uzdenov", "Alexey I. Boyko", "Igor Pasechnik", "Anton Konushin", "Andrey Kuznetsov", "Dmitrii Zhemchuzhnikov"], "brief": "CADENA\u5c063D\u7f51\u683c\u91cd\u5efa\u4e3a\u53ef\u7f16\u8f91\u7684\u53c2\u6570\u5316CAD\u7a0b\u5e8f\uff0c\u6309\u7279\u5f81\u64cd\u4f5c\u9010\u6b65\u751f\u6210\uff0c\u5e76\u5728\u6bcf\u4e00\u6b65\u5c06\u5f53\u524d\u51e0\u4f55\u4e0e\u76ee\u6807\u5f62\u72b6\u5bf9\u6bd4\u3002\u8bba\u6587\u8fd8\u63d0\u51faCADENA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u673a\u68b0\u96f6\u4ef6CAD\u9006\u5411\u5de5\u7a0b\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/zhemdi/cadena", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2608.00799", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u533a\u522b\u4e8e\u4e00\u6b21\u6027\u8f93\u51fa\u5b8c\u6574CAD\u7a0b\u5e8f\u7684\u65b9\u6cd5\uff0cCADENA\u91c7\u7528\u7c7b\u4f3c\u5de5\u7a0b\u5e08\u5efa\u6a21\u7684\u9010\u6b65\u7279\u5f81\u6784\u5efa\u6d41\u7a0b", "\u6bcf\u4e00\u6b65\u663e\u5f0f\u68c0\u67e5\u5df2\u9884\u6d4b\u51e0\u4f55\u4e0e\u76ee\u6807\u7f51\u683c\u7684\u5dee\u5f02\uff0c\u4ee5\u6307\u5bfc\u540e\u7eed\u64cd\u4f5c\u751f\u6210", "\u5728CADENA-Bench\u3001DeepCAD\u3001Fusion 360\u548cMCB\u7b49\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5"], "keywords": ["CAD\u751f\u6210", "\u4e09\u7ef4\u91cd\u5efa", "\u9006\u5411\u5de5\u7a0b", "\u51e0\u4f55\u5efa\u6a21"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00799v1", "published_at": "2026-08-01", "score": 0.292, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00799.png", "title": "CADENA: Stepwise CAD Reverse Engineering", "tldr": "\u9010\u6b65\u751f\u6210\u5e76\u6821\u9a8cCAD\u7a0b\u5e8f\u7684\u9006\u5411\u5de5\u7a0b\u6a21\u578b", "upvotes": 30, "what_it_is": "CADENA\u5c063D\u7f51\u683c\u91cd\u5efa\u4e3a\u53ef\u7f16\u8f91\u7684\u53c2\u6570\u5316CAD\u7a0b\u5e8f\uff0c\u6309\u7279\u5f81\u64cd\u4f5c\u9010\u6b65\u751f\u6210\uff0c\u5e76\u5728\u6bcf\u4e00\u6b65\u5c06\u5f53\u524d\u51e0\u4f55\u4e0e\u76ee\u6807\u5f62\u72b6\u5bf9\u6bd4\u3002\u8bba\u6587\u8fd8\u63d0\u51faCADENA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u673a\u68b0\u96f6\u4ef6CAD\u9006\u5411\u5de5\u7a0b\u6027\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u5347\u4e86\u4ece\u73b0\u67093D\u5f62\u72b6\u5230\u53ef\u7f16\u8f91CAD\u6a21\u578b\u7684\u81ea\u52a8\u5316\u80fd\u529b\uff0c\u5e76\u8865\u5145\u4e86\u673a\u68b0\u96f6\u4ef6\u9006\u5411\u5de5\u7a0b\u7f3a\u4e4f\u7edf\u4e00\u8bc4\u6d4b\u57fa\u51c6\u7684\u95ee\u9898\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models increasingly write and repair production code, yet evidence is mounting that their test-passing patches leave codebases harder to maintain. We identify one concrete source: deletion avoidance, the systematic tendency to retain code that an intended edit requires removing. Across the five leading models on the official SWE-bench Verified leaderboard, deletion recall against the developer patch reaches at most 71.7% even on tasks all five solve, and models reach the right file for over 92% of required deletions but cut the exact line in under 52% of cases. Instead, 29.0% of passing patches wrap the targeted code in a guard or fallback, a pattern we call Guard-and-Go. Such patches pass because the original tests rarely check removal: when we retrofit 34 Verified tasks with tests that fail if the targeted code remains, four frontier models spanning closed and open weights fall from 63.2% to 41.9%. Because real repairs mix removal with addition, we curate CanItDelete, a benchmark of 200 tasks mined from real commits whose entire required edit is deletion. Even with the addition work gone, the best model still fails one task in five, and smaller open models fall to 18.0%. We then ablate GPT-5.6 Sol under four cumulative prompts; success moves little until we supply the exact lines, which nearly eliminate incomplete deletion yet raise success only to 80.5% because the model then deletes beyond the spans or adds code instead. Finally, through a pilot study we show one potential fix: teaching deletion during post-training reduces deletion avoidance and improves broader code-editing performance, suggesting the behavior is undertrained rather than beyond reach.", "arxiv_id": "2607.28887", "arxiv_url": "https://arxiv.org/abs/2607.28887", "authors": ["Amir M. Ebrahimi", "Mohammed Mehedi Hasan", "Aaditya Bhatia", "Gopi Krishnan Rajbahadur", "Ahmed E. Hassan"], "brief": "\u672c\u6587\u7cfb\u7edf\u6d4b\u91cf\u4e86\u4e3b\u6d41\u5927\u6a21\u578b\u5728\u4ee3\u7801\u4fee\u590d\u4e2d\u201c\u4e0d\u613f\u5220\u9664\u5e94\u5220\u4ee3\u7801\u201d\u7684\u73b0\u8c61\uff0c\u5e76\u6784\u5efa\u7eaf\u5220\u9664\u4efb\u52a1\u57fa\u51c6 CanItDelete\u3002\u7814\u7a76\u53d1\u73b0\u6a21\u578b\u5e38\u7528 guard/fallback \u5305\u88f9\u65e7\u4ee3\u7801\u6765\u901a\u8fc7\u6d4b\u8bd5\uff0c\u800c\u975e\u771f\u6b63\u5220\u9664\u76ee\u6807\u4ee3\u7801\u3002", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28887", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728 SWE-bench Verified \u4e0a\uff0c\u4e94\u4e2a\u9886\u5148\u6a21\u578b\u5373\u4f7f\u89e3\u51b3\u4efb\u52a1\uff0c\u5bf9\u5f00\u53d1\u8005\u8865\u4e01\u4e2d\u5220\u9664\u5185\u5bb9\u7684\u53ec\u56de\u7387\u6700\u9ad8\u4e5f\u4ec5 71.7%\uff0c\u4e14\u867d\u80fd\u5b9a\u4f4d\u5230\u6b63\u786e\u6587\u4ef6\u8d85\u8fc7 92%\uff0c\u7cbe\u786e\u5220\u9664\u884c\u5374\u4f4e\u4e8e 52%\u3002", "29.0% \u7684\u901a\u8fc7\u6d4b\u8bd5\u8865\u4e01\u91c7\u7528\u201cGuard-and-Go\u201d\u6a21\u5f0f\uff1a\u4fdd\u7559\u76ee\u6807\u4ee3\u7801\u4f46\u52a0\u4fdd\u62a4\u6761\u4ef6\u6216\u56de\u9000\u903b\u8f91\uff1b\u52a0\u5165\u68c0\u67e5\u6b8b\u7559\u4ee3\u7801\u7684\u6d4b\u8bd5\u540e\uff0c\u56db\u4e2a\u524d\u6cbf\u6a21\u578b\u6210\u529f\u7387\u4ece 63.2% \u964d\u81f3 41.9%\u3002", "\u65b0\u57fa\u51c6 CanItDelete \u5305\u542b 200 \u4e2a\u771f\u5b9e\u63d0\u4ea4\u4e2d\u7684\u7eaf\u5220\u9664\u4efb\u52a1\uff1b\u5373\u4fbf\u65e0\u9700\u65b0\u589e\u4ee3\u7801\uff0c\u6700\u4f73\u6a21\u578b\u4ecd\u5931\u8d25\u7ea6\u4e94\u5206\u4e4b\u4e00\uff0c\u5c0f\u578b\u5f00\u6e90\u6a21\u578b\u6210\u529f\u7387\u4ec5 18.0%\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u4ee3\u7801\u4fee\u590d", "\u8f6f\u4ef6\u5de5\u7a0b", "\u5927\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Centre for Software Excellence", "pdf_url": "https://arxiv.org/pdf/2607.28887v1", "published_at": "2026-07-30", "score": 0.281, "selected_reasons": ["HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28887.png", "title": "To Add Is Machine, To Delete Is Human: Measuring and Mitigating Deletion Avoidance in LLM Code Editing", "tldr": "\u63ed\u793a\u5e76\u7f13\u89e3LLM\u4ee3\u7801\u7f16\u8f91\u4e2d\u7684\u5220\u4ee3\u7801\u56de\u907f", "upvotes": 18, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u6d4b\u91cf\u4e86\u4e3b\u6d41\u5927\u6a21\u578b\u5728\u4ee3\u7801\u4fee\u590d\u4e2d\u201c\u4e0d\u613f\u5220\u9664\u5e94\u5220\u4ee3\u7801\u201d\u7684\u73b0\u8c61\uff0c\u5e76\u6784\u5efa\u7eaf\u5220\u9664\u4efb\u52a1\u57fa\u51c6 CanItDelete\u3002\u7814\u7a76\u53d1\u73b0\u6a21\u578b\u5e38\u7528 guard/fallback \u5305\u88f9\u65e7\u4ee3\u7801\u6765\u901a\u8fc7\u6d4b\u8bd5\uff0c\u800c\u975e\u771f\u6b63\u5220\u9664\u76ee\u6807\u4ee3\u7801\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u4e86LLM\u4ee3\u7801\u4fee\u590d\u53ef\u7ef4\u62a4\u6027\u5dee\u7684\u4e00\u4e2a\u5177\u4f53\u6839\u56e0\uff1a\u6a21\u578b\u504f\u5411\u6dfb\u52a0\u800c\u975e\u5220\u9664\u3002\u5b83\u4e0d\u4ec5\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u6d4b\u91cf\u548c\u65b0\u57fa\u51c6\uff0c\u8fd8\u663e\u793a\u901a\u8fc7\u540e\u8bad\u7ec3\u5f3a\u5316\u5220\u9664\u80fd\u529b\u53ef\u6539\u5584\u8868\u73b0\uff0c\u5bf9\u751f\u4ea7\u7ea7\u4ee3\u7801\u667a\u80fd\u4f53\u548c\u4ee3\u7801\u5ba1\u67e5\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Recent 3D vision-language models (3D VLMs) construct geometry aware tokens by projecting 2D visual features into world coordinates, enabling spatial reasoning for tasks such as 3D question answering. However, this design generates thousands of tokens per scene, resulting in substantial computational and memory overhead. While token compression has been extensively studied in 2D VLMs, existing approaches rely on semantic relevance or attention-based selection that overlook the structured spatial nature of 3D tokens. Moreover, redundancy in 3D representations cannot be resolved by spatial proximity alone, as object-level token imbalance persists even after spatial aggregation. To address this, we propose 3DZip, a three-stage token compression framework that first applies coarse voxelization to remove point-level redundancy, then selects anchor tokens based on feature-space diversity via a Determinantal Point Process, and finally merges remaining tokens under spatial constraints to preserve geometric coherence. Experiments on three 3D question answering benchmarks demonstrate that 3DZip consistently outperforms existing compression methods, retaining 94.7% of the original performance with only 128 tokens, achieving a $1.92\\times$ faster inference speed.", "arxiv_id": "2608.01185", "arxiv_url": "https://arxiv.org/abs/2608.01185", "authors": ["Changwoo Baek", "Kyeongbo Kong"], "brief": "\u8bba\u6587\u63d0\u51fa3DZip\uff0c\u4e00\u4e2a\u9762\u54113D\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u4e09\u9636\u6bb5token\u538b\u7f29\u6846\u67b6\uff0c\u7528\u4e8e\u964d\u4f4e3D\u95ee\u7b54\u4e2d\u6d77\u91cf\u51e0\u4f55token\u5e26\u6765\u7684\u8ba1\u7b97\u4e0e\u663e\u5b58\u5f00\u9500\u3002\u5b83\u7ed3\u5408\u4f53\u7d20\u5316\u53bb\u5197\u4f59\u3001\u7279\u5f81\u591a\u6837\u6027\u951a\u70b9\u9009\u62e9\u548c\u7a7a\u95f4\u7ea6\u675f\u5408\u5e76\uff0c\u5728\u538b\u7f29\u540c\u65f6\u5c3d\u91cf\u4fdd\u7559\u7a7a\u95f4\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/cvsp-lab/3DZip", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2608.01185", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5148\u901a\u8fc7\u7c97\u7c92\u5ea6\u4f53\u7d20\u5316\u6d88\u9664\u70b9\u7ea7\u5197\u4f59\uff0c\u51cf\u5c11\u5bc6\u96c63D token\u6570\u91cf", "\u4f7f\u7528\u786e\u5b9a\u6027\u70b9\u8fc7\u7a0b\uff08DPP\uff09\u57fa\u4e8e\u7279\u5f81\u7a7a\u95f4\u591a\u6837\u6027\u9009\u62e9\u951a\u70b9token\uff0c\u7f13\u89e3\u4ec5\u6309\u7a7a\u95f4\u90bb\u8fd1\u538b\u7f29\u5bfc\u81f4\u7684\u5bf9\u8c61\u7ea7\u4e0d\u5747\u8861", "\u5728\u7a7a\u95f4\u7ea6\u675f\u4e0b\u5408\u5e76\u5269\u4f59token\u4ee5\u4fdd\u6301\u51e0\u4f55\u4e00\u81f4\u6027\uff1b\u5728\u4e09\u4e2a3D\u95ee\u7b54\u57fa\u51c6\u4e0a\u4ec5\u7528128\u4e2atoken\u4fdd\u755994.7%\u539f\u59cb\u6027\u80fd\uff0c\u5e76\u5b9e\u73b01.92\u500d\u63a8\u7406\u52a0\u901f"], "keywords": ["3D\u89c6\u89c9\u8bed\u8a00", "token\u538b\u7f29", "\u7a7a\u95f4\u63a8\u7406", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01185v1", "published_at": "2026-08-02", "score": 0.276, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01185.png", "title": "3DZip: Spatial-Aware Feature Diversity-Guided Token Compression for 3D Question Answering", "tldr": "3D\u95ee\u7b54\u4e2d\u9ad8\u6548\u538b\u7f29\u7a7a\u95f4\u611f\u77e5token", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51fa3DZip\uff0c\u4e00\u4e2a\u9762\u54113D\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u4e09\u9636\u6bb5token\u538b\u7f29\u6846\u67b6\uff0c\u7528\u4e8e\u964d\u4f4e3D\u95ee\u7b54\u4e2d\u6d77\u91cf\u51e0\u4f55token\u5e26\u6765\u7684\u8ba1\u7b97\u4e0e\u663e\u5b58\u5f00\u9500\u3002\u5b83\u7ed3\u5408\u4f53\u7d20\u5316\u53bb\u5197\u4f59\u3001\u7279\u5f81\u591a\u6837\u6027\u951a\u70b9\u9009\u62e9\u548c\u7a7a\u95f4\u7ea6\u675f\u5408\u5e76\uff0c\u5728\u538b\u7f29\u540c\u65f6\u5c3d\u91cf\u4fdd\u7559\u7a7a\u95f4\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "3DZip\u9488\u5bf93D token\u7684\u7ed3\u6784\u5316\u7a7a\u95f4\u7279\u6027\u8bbe\u8ba1\u538b\u7f29\u7b56\u7565\uff0c\u6bd4\u76f4\u63a5\u5957\u75282D VLM\u7684\u8bed\u4e49\u6216\u6ce8\u610f\u529b\u9009\u62e9\u65b9\u6cd5\u66f4\u9002\u54083D\u573a\u666f\uff0c\u6709\u671b\u63d0\u53473D\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u5b9e\u9645\u90e8\u7f72\u4e2d\u7684\u6548\u7387\u3002"}, {"abstract": "Accurate prediction of object trajectories during manipulation is essential for closing the perception-action loop. Progress is limited on two fronts: available datasets lack fine-grained language-to-motion annotations, and existing predictors either rely on privileged inputs such as video, depth, or CAD models, or recover motion from fully generated videos through costly, error-prone perception pipelines. We close the supervision gap with the MOVE dataset, 5,038 object-centric egocentric trajectories, each paired with a fine-grained natural-language instruction rather than a coarse verb-noun label. We further propose DreamTraj, which predicts a 6-DoF object trajectory from a single RGB image and a task instruction, requiring no video, depth, or CAD model at inference: rather than generating a video, it reads motion from the internal representations of a frozen image-to-video diffusion model at an early denoising step. A lightweight flow-matching Reader decodes query-key attention tracks and pooled hidden states into relative 6-DoF poses. To our knowledge, this is the first approach to directly decode object 6-DoF trajectories from intermediate video diffusion representations rather than generated pixels. DreamTraj sets a new state of the art on both translation and rotation against forecasters that consume multi-frame or privileged inputs, and runs 4.6x faster than generate-then-extract pipelines.", "arxiv_id": "2608.00486", "arxiv_url": "https://arxiv.org/abs/2608.00486", "authors": ["Tongsheng Ding", "Zhen Luo", "Yixuan Yang", "Boyu Wang", "Luyang Xie", "Jinyu Yang", "Feng Zheng"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 MOVE \u6570\u636e\u96c6\uff0c\u5305\u542b 5038 \u6761\u4ee5\u7269\u4f53\u4e3a\u4e2d\u5fc3\u7684\u7b2c\u4e00\u89c6\u89d2\u64cd\u4f5c\u8f68\u8ff9\uff0c\u5e76\u914d\u6709\u7ec6\u7c92\u5ea6\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u3002\u63d0\u51fa DreamTraj\uff1a\u4ec5\u7528\u5355\u5f20 RGB \u56fe\u50cf\u548c\u4efb\u52a1\u6307\u4ee4\uff0c\u5728\u4e0d\u751f\u6210\u89c6\u9891\u7684\u60c5\u51b5\u4e0b\uff0c\u4ece\u51bb\u7ed3\u56fe\u751f\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u65e9\u671f\u53bb\u566a\u9690\u8868\u793a\u4e2d\u89e3\u7801\u7269\u4f53\u76f8\u5bf9 6-DoF \u8f68\u8ff9\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00486", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["MOVE \u6570\u636e\u96c6\u63d0\u4f9b\u8bed\u8a00\u5230\u8fd0\u52a8\u7684\u7ec6\u7c92\u5ea6\u76d1\u7763\uff0c\u5f25\u8865\u73b0\u6709\u6570\u636e\u591a\u4e3a\u7c97\u7c92\u5ea6\u52a8\u8bcd-\u540d\u8bcd\u6807\u7b7e\u7684\u95ee\u9898", "DreamTraj \u8bfb\u53d6\u6269\u6563\u6a21\u578b\u5185\u90e8 query-key attention tracks \u4e0e pooled hidden states\uff0c\u5e76\u7528\u8f7b\u91cf\u7ea7 flow-matching Reader \u89e3\u7801\u8f68\u8ff9", "\u63a8\u7406\u65e0\u9700\u89c6\u9891\u3001\u6df1\u5ea6\u6216 CAD \u6a21\u578b\uff0c\u5728\u5e73\u79fb\u548c\u65cb\u8f6c\u9884\u6d4b\u4e0a\u4f18\u4e8e\u4f7f\u7528\u591a\u5e27\u6216\u7279\u6743\u8f93\u5165\u7684\u65b9\u6cd5\uff0c\u5e76\u6bd4\u201c\u751f\u6210\u89c6\u9891\u518d\u63d0\u53d6\u201d\u6d41\u7a0b\u5feb 4.6 \u500d"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u9891\u6269\u6563\u6a21\u578b", "\u8f68\u8ff9\u9884\u6d4b", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "Southern university of science and technology", "pdf_url": "https://arxiv.org/pdf/2608.00486v1", "published_at": "2026-08-01", "score": 0.271, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00486.png", "title": "DreamTraj: Generating 6-DoF Object Trajectories by Reading Unrendered Video Diffusion Latents", "tldr": "\u4ece\u89c6\u9891\u6269\u6563\u9690\u8868\u793a\u76f4\u63a5\u9884\u6d4b\u7269\u4f536DoF\u8f68\u8ff9", "upvotes": 12, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 MOVE \u6570\u636e\u96c6\uff0c\u5305\u542b 5038 \u6761\u4ee5\u7269\u4f53\u4e3a\u4e2d\u5fc3\u7684\u7b2c\u4e00\u89c6\u89d2\u64cd\u4f5c\u8f68\u8ff9\uff0c\u5e76\u914d\u6709\u7ec6\u7c92\u5ea6\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u3002\u63d0\u51fa DreamTraj\uff1a\u4ec5\u7528\u5355\u5f20 RGB \u56fe\u50cf\u548c\u4efb\u52a1\u6307\u4ee4\uff0c\u5728\u4e0d\u751f\u6210\u89c6\u9891\u7684\u60c5\u51b5\u4e0b\uff0c\u4ece\u51bb\u7ed3\u56fe\u751f\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u65e9\u671f\u53bb\u566a\u9690\u8868\u793a\u4e2d\u89e3\u7801\u7269\u4f53\u76f8\u5bf9 6-DoF \u8f68\u8ff9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9996\u6b21\u76f4\u63a5\u4ece\u89c6\u9891\u6269\u6563\u6a21\u578b\u4e2d\u95f4\u8868\u793a\u89e3\u7801\u7269\u4f53 6-DoF \u8f68\u8ff9\uff0c\u907f\u514d\u4e86\u751f\u6210\u50cf\u7d20\u548c\u540e\u5904\u7406\u611f\u77e5\u7ba1\u7ebf\u7684\u9ad8\u6210\u672c\u4e0e\u8bef\u5dee\uff0c\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684\u611f\u77e5-\u52a8\u4f5c\u95ed\u73af\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Real-time video editing requires low-latency causal generation with bounded computational resources while preserving source fidelity and long-term temporal consistency. We present JoyAI-Video-Edit, a 16B-parameter autoregressive diffusion framework for real-time, open-ended video editing without access to future frames or a predefined video duration. Our method combines chunk-wise autoregressive adaptation, Source-Anchored Distribution Matching Distillation (SA-DMD), and Long-Horizon Autoregressive Distillation to reduce train--inference mismatch, preserve source fidelity during two-step generation, and mitigate accumulated temporal drift. Extensive automatic and human evaluations show that JoyAI-Video-Edit substantially outperforms existing streaming editors and remains competitive with strong offline systems on both short and long videos. The complete system achieves end-to-end 720p video editing at approximately 30 FPS on a single Nvidia B200 GPU. Code is available at https://github.com/jd-opensource/JoyAI-Video-Edit.", "arxiv_id": "2608.03974", "arxiv_url": "https://arxiv.org/abs/2608.03974", "authors": ["Yicheng Xiao", "Wenxun Dai", "Xinran Qin", "Lin Song", "Maoquan Zhang", "Hang Xu", "Yukang Chen", "Yitong Li", "Guohui Zhang", "Yuan Zhang", "Xuying Zhang", "Tommy Zhang", "Jianlong Yuan", "Peihao Li", "Shuai Lu", "Siming Fu", "Chuyang Zhao", "Xin Han", "Jie Huang", "Wenbo Li", "Guoqing Ma", "Wei Huang", "Xiaojuan Qi", "Haoyang Huang", "Nan Duan"], "brief": "\u8bba\u6587\u63d0\u51fa JoyAI-Video-Edit\uff0c\u4e00\u4e2a 16B \u53c2\u6570\u81ea\u56de\u5f52\u6269\u6563\u89c6\u9891\u7f16\u8f91\u6846\u67b6\uff0c\u53ef\u5728\u65e0\u672a\u6765\u5e27\u3001\u65e0\u9884\u8bbe\u65f6\u957f\u6761\u4ef6\u4e0b\u8fdb\u884c\u4f4e\u5ef6\u8fdf\u6d41\u5f0f\u89c6\u9891\u7f16\u8f91\u3002\u7cfb\u7edf\u901a\u8fc7\u5206\u5757\u81ea\u56de\u5f52\u751f\u6210\u4e0e\u84b8\u998f\u7b56\u7565\uff0c\u5728\u5b9e\u65f6\u6027\u3001\u6e90\u89c6\u9891\u4fdd\u771f\u548c\u957f\u65f6\u5e8f\u4e00\u81f4\u6027\u4e4b\u95f4\u53d6\u5f97\u5e73\u8861\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/jd-opensource/JoyAI-Video-Edit", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03974", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 chunk-wise \u81ea\u56de\u5f52\u9002\u914d\uff0c\u5b9e\u73b0\u56e0\u679c\u5f0f\u3001\u5f00\u653e\u65f6\u957f\u7684\u89c6\u9891\u7f16\u8f91\u751f\u6210", "\u63d0\u51fa Source-Anchored Distribution Matching Distillation\uff0c\u7f13\u89e3\u4e24\u6b65\u751f\u6210\u4e2d\u7684\u6e90\u5185\u5bb9\u5931\u771f", "\u901a\u8fc7 Long-Horizon Autoregressive Distillation \u51cf\u5c11\u957f\u89c6\u9891\u4e2d\u7684\u8bef\u5dee\u7d2f\u79ef\u4e0e\u65f6\u95f4\u6f02\u79fb\uff0c\u5355\u5f20 Nvidia B200 \u4e0a\u5b9e\u73b0 720p \u7ea6 30 FPS"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u6269\u6563\u6a21\u578b", "\u81ea\u56de\u5f52\u751f\u6210", "\u5b9e\u65f6\u751f\u6210"], "num_comments": 0, "on_hf": true, "organization": "jingdong", "pdf_url": "https://arxiv.org/pdf/2608.03974v1", "published_at": "2026-08-04", "score": 0.269, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03974.png", "title": "JoyAI-Video-Edit: Real-Time Open-Ended Video Editing with Autoregressive Diffusion", "tldr": "\u5b9e\u65f6\u5f00\u653e\u5f0f\u89c6\u9891\u7f16\u8f91\u7684\u81ea\u56de\u5f52\u6269\u6563\u6846\u67b6", "upvotes": 13, "what_it_is": "\u8bba\u6587\u63d0\u51fa JoyAI-Video-Edit\uff0c\u4e00\u4e2a 16B \u53c2\u6570\u81ea\u56de\u5f52\u6269\u6563\u89c6\u9891\u7f16\u8f91\u6846\u67b6\uff0c\u53ef\u5728\u65e0\u672a\u6765\u5e27\u3001\u65e0\u9884\u8bbe\u65f6\u957f\u6761\u4ef6\u4e0b\u8fdb\u884c\u4f4e\u5ef6\u8fdf\u6d41\u5f0f\u89c6\u9891\u7f16\u8f91\u3002\u7cfb\u7edf\u901a\u8fc7\u5206\u5757\u81ea\u56de\u5f52\u751f\u6210\u4e0e\u84b8\u998f\u7b56\u7565\uff0c\u5728\u5b9e\u65f6\u6027\u3001\u6e90\u89c6\u9891\u4fdd\u771f\u548c\u957f\u65f6\u5e8f\u4e00\u81f4\u6027\u4e4b\u95f4\u53d6\u5f97\u5e73\u8861\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u9ad8\u8d28\u91cf\u6269\u6563\u89c6\u9891\u7f16\u8f91\u63a8\u8fdb\u5230\u5b9e\u65f6\u6d41\u5f0f\u573a\u666f\uff0c\u5728\u4e0d\u4f9d\u8d56\u672a\u6765\u5e27\u7684\u6761\u4ef6\u4e0b\u4ecd\u80fd\u4fdd\u6301\u957f\u7a0b\u4e00\u81f4\u6027\uff0c\u5e76\u5728\u81ea\u52a8\u4e0e\u4eba\u5de5\u8bc4\u6d4b\u4e2d\u4f18\u4e8e\u73b0\u6709\u6d41\u5f0f\u7f16\u8f91\u5668\uff0c\u63a5\u8fd1\u5f3a\u79bb\u7ebf\u7cfb\u7edf\u8868\u73b0\u3002"}, {"abstract": "Existing indoor layout generators produce globally plausible layouts yet may retain local violations such as collisions, out-of-bounds placements, obstructed openings, and blocked circulation. Most prior work focuses on full-scene synthesis or scene-level optimization, with limited support for identifying responsible objects and locally repairing affected regions. We present Roomer, a reflective repair framework that casts these violations as sparse, object-grounded repair problems. Roomer encodes layouts as ``RoState\u0027\u0027 and uses ``RoReview\u0027\u0027 to bind measured violations to implicated objects. A geometry-conditioned vision-language model planner proposes a structured local edit, while a deterministic solver validates it and generates a finite set of candidate edits when needed. Each candidate is committed only if full-scene verification confirms that it resolves the target violation without new hard violations or broken protected constraints. We train the planner on Roomer-CC, a controlled-corruption dataset that pairs faulty layouts with object-grounded violation evidence and known-feasible inverse StatePatches. Since existing benchmarks rarely assess whether physically valid layouts are usable, we introduce Roomer-Eval to assess distributional quality, physical validity, and practical usability. Experiments show that Roomer repairs residual violations while preserving valid regions, improves physical validity and usability, and transfers across external generators.", "arxiv_id": "2608.01973", "arxiv_url": "https://arxiv.org/abs/2608.01973", "authors": ["Lingwei Dang", "Ziyan Qiu", "Jiajia Cheng", "Shishuo Shang", "Zhenhao Zhang", "Yufei Zhu", "Qingxin Xiao", "Pan Liu", "Shenghui Huang", "Yun Hao", "Juntong Li", "Qingyao Wu"], "brief": "\u8bba\u6587\u63d0\u51fa Roomer\uff0c\u4e00\u4e2a\u9762\u54113D\u5ba4\u5185\u5e03\u5c40\u751f\u6210\u7ed3\u679c\u7684\u53cd\u601d\u5f0f\u5c40\u90e8\u4fee\u590d\u6846\u67b6\u3002\u5b83\u5c06\u78b0\u649e\u3001\u8d8a\u754c\u3001\u5f00\u53e3\u906e\u6321\u3001\u901a\u884c\u53d7\u963b\u7b49\u95ee\u9898\u5efa\u6a21\u4e3a\u7a00\u758f\u7684\u5bf9\u8c61\u7ea7\u4fee\u590d\u4efb\u52a1\uff0c\u5e76\u5728\u4e0d\u7834\u574f\u5176\u4ed6\u6709\u6548\u533a\u57df\u7684\u524d\u63d0\u4e0b\u63d0\u4ea4\u7f16\u8f91\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01973", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528 RoState \u8868\u793a\u573a\u666f\u5e03\u5c40\uff0c\u7528 RoReview \u5c06\u6d4b\u5f97\u7684\u51e0\u4f55\u8fdd\u89c4\u7ed1\u5b9a\u5230\u5177\u4f53\u8d23\u4efb\u5bf9\u8c61", "\u7ed3\u5408\u51e0\u4f55\u6761\u4ef6\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u89c4\u5212\u5668\u4e0e\u786e\u5b9a\u6027\u6c42\u89e3\u5668\uff0c\u751f\u6210\u3001\u9a8c\u8bc1\u5e76\u7b5b\u9009\u5c40\u90e8 StatePatch \u7f16\u8f91", "\u6784\u5efa Roomer-CC \u53d7\u63a7\u635f\u574f\u8bad\u7ec3\u96c6\u4e0e Roomer-Eval \u8bc4\u6d4b\u96c6\uff0c\u540c\u65f6\u8bc4\u4f30\u5206\u5e03\u8d28\u91cf\u3001\u7269\u7406\u6709\u6548\u6027\u548c\u5b9e\u9645\u53ef\u7528\u6027"], "keywords": ["3D\u573a\u666f\u751f\u6210", "\u5e03\u5c40\u4fee\u590d", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba"], "num_comments": 1, "on_hf": true, "organization": "South China University of Technology", "pdf_url": "https://arxiv.org/pdf/2608.01973v1", "published_at": "2026-08-03", "score": 0.253, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01973.png", "title": "Roomer: Reflective Object-Grounded Model Editing and Repair for 3D Indoor Layout Synthesis", "tldr": "Roomer\u5b9a\u4f4d\u5e76\u4fee\u590d3D\u5ba4\u5185\u5e03\u5c40\u5c40\u90e8\u8fdd\u89c4", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa Roomer\uff0c\u4e00\u4e2a\u9762\u54113D\u5ba4\u5185\u5e03\u5c40\u751f\u6210\u7ed3\u679c\u7684\u53cd\u601d\u5f0f\u5c40\u90e8\u4fee\u590d\u6846\u67b6\u3002\u5b83\u5c06\u78b0\u649e\u3001\u8d8a\u754c\u3001\u5f00\u53e3\u906e\u6321\u3001\u901a\u884c\u53d7\u963b\u7b49\u95ee\u9898\u5efa\u6a21\u4e3a\u7a00\u758f\u7684\u5bf9\u8c61\u7ea7\u4fee\u590d\u4efb\u52a1\uff0c\u5e76\u5728\u4e0d\u7834\u574f\u5176\u4ed6\u6709\u6548\u533a\u57df\u7684\u524d\u63d0\u4e0b\u63d0\u4ea4\u7f16\u8f91\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u505a\u5168\u5c40\u751f\u6210\u6216\u573a\u666f\u7ea7\u4f18\u5316\u7684\u65b9\u6cd5\uff0cRoomer\u80fd\u5b9a\u4f4d\u5177\u4f53\u51fa\u9519\u5bf9\u8c61\u5e76\u8fdb\u884c\u5c40\u90e8\u3001\u53ef\u9a8c\u8bc1\u4fee\u590d\uff0c\u63d0\u5347\u5ba4\u5185\u5e03\u5c40\u7684\u7269\u7406\u6709\u6548\u6027\u548c\u53ef\u7528\u6027\uff0c\u4e14\u53ef\u8fc1\u79fb\u5230\u5916\u90e8\u751f\u6210\u5668\u8f93\u51fa\u4e0a\u3002"}, {"abstract": "Fixed-layout indoor furniture styling requires selecting assets that form a coherent room without changing the prescribed furniture categories, positions, orientations, or scales. Existing approaches typically retrieve each asset independently or rely on static local relations, making them prone to shape, material, and color conflicts after scene composition. We introduce StyleForge, a scene-level structured selection framework built on a dynamic hypergraph style field. A frozen multimodal large language model extracts structured style priors from an open-ended style request and the fixed layout, while StyleForge maintains a learnable candidate distribution for each furniture slot. Conditioned on the target style, the dynamic hypergraph style field adaptively activates and weights layout-induced hyperedges to capture higher-order dependencies among furniture. Counterfactual style preference learning then treats each candidate as a local substitution in the current style field and evaluates its contextual compatibility using Mahalanobis energies. Training alternates between optimizing the style field and the candidate logits. At inference, the model remains frozen and test-time training updates only room-specific candidate logits, progressively correcting cross-slot style conflicts as the global scene context evolves. Experiments on 3D-FRONT demonstrate state-of-the-art furniture retrieval and scene-level style coherence, producing more coherent fixed-layout furniture arrangements than object- and scene-level retrieval baselines.", "arxiv_id": "2608.01954", "arxiv_url": "https://arxiv.org/abs/2608.01954", "authors": ["Lingwei Dang", "Shishuo Shang", "Pan Liu", "Jiajia Cheng", "Ziyan Qiu", "Zhenhao Zhang", "Yufei Zhu", "Shenghui Huang", "Qingxin Xiao", "Yun Hao", "Juntong Li", "Qingyao Wu"], "brief": "StyleForge \u662f\u4e00\u4e2a\u9762\u5411\u56fa\u5b9a\u5ba4\u5185\u5e03\u5c40\u7684\u5bb6\u5177\u8d44\u4ea7\u9009\u62e9\u6846\u67b6\uff0c\u5728\u4e0d\u6539\u53d8\u7c7b\u522b\u3001\u4f4d\u7f6e\u3001\u671d\u5411\u548c\u5c3a\u5ea6\u7684\u524d\u63d0\u4e0b\uff0c\u4e3a\u6bcf\u4e2a\u5bb6\u5177\u69fd\u4f4d\u68c0\u7d22\u66f4\u534f\u8c03\u7684\u8d44\u4ea7\u3002\u5b83\u7ed3\u5408\u591a\u6a21\u6001\u5927\u6a21\u578b\u63d0\u53d6\u98ce\u683c\u5148\u9a8c\u3001\u52a8\u6001\u8d85\u56fe\u98ce\u683c\u573a\u5efa\u6a21\u5bb6\u5177\u95f4\u9ad8\u9636\u4f9d\u8d56\uff0c\u5e76\u901a\u8fc7\u53cd\u4e8b\u5b9e\u504f\u597d\u5b66\u4e60\u4f18\u5316\u573a\u666f\u7ea7\u98ce\u683c\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01954", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u51bb\u7ed3\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4ece\u5f00\u653e\u5f0f\u98ce\u683c\u8bf7\u6c42\u548c\u56fa\u5b9a\u5e03\u5c40\u4e2d\u63d0\u53d6\u7ed3\u6784\u5316\u98ce\u683c\u5148\u9a8c\u3002", "\u52a8\u6001\u8d85\u56fe\u98ce\u683c\u573a\u6839\u636e\u76ee\u6807\u98ce\u683c\u81ea\u9002\u5e94\u6fc0\u6d3b\u548c\u52a0\u6743\u5e03\u5c40\u8bf1\u5bfc\u7684\u8d85\u8fb9\uff0c\u6355\u6349\u591a\u5bb6\u5177\u4e4b\u95f4\u7684\u9ad8\u9636\u5173\u7cfb\u3002", "\u53cd\u4e8b\u5b9e\u98ce\u683c\u504f\u597d\u5b66\u4e60\u5c06\u5019\u9009\u8d44\u4ea7\u89c6\u4e3a\u5c40\u90e8\u66ff\u6362\uff0c\u7528 Mahalanobis \u80fd\u91cf\u8bc4\u4f30\u5176\u5728\u5f53\u524d\u5168\u5c40\u573a\u666f\u4e2d\u7684\u4e0a\u4e0b\u6587\u517c\u5bb9\u6027\uff1b\u63a8\u7406\u65f6\u4ec5\u8fdb\u884c\u623f\u95f4\u7ea7\u5019\u9009 logits \u7684\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u3002"], "keywords": ["\u4e09\u7ef4\u89c6\u89c9", "\u5ba4\u5185\u8bbe\u8ba1", "\u591a\u6a21\u6001", "\u56fe\u795e\u7ecf\u7f51\u7edc"], "num_comments": 1, "on_hf": true, "organization": "South China University of Technology", "pdf_url": "https://arxiv.org/pdf/2608.01954v1", "published_at": "2026-08-03", "score": 0.246, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01954.png", "title": "StyleForge: Indoor Furniture Styling by Counterfactual Reasoning in a Hypergraph Field", "tldr": "\u7528\u52a8\u6001\u8d85\u56fe\u63d0\u5347\u56fa\u5b9a\u5e03\u5c40\u5bb6\u5177\u98ce\u683c\u642d\u914d", "upvotes": 12, "what_it_is": "StyleForge \u662f\u4e00\u4e2a\u9762\u5411\u56fa\u5b9a\u5ba4\u5185\u5e03\u5c40\u7684\u5bb6\u5177\u8d44\u4ea7\u9009\u62e9\u6846\u67b6\uff0c\u5728\u4e0d\u6539\u53d8\u7c7b\u522b\u3001\u4f4d\u7f6e\u3001\u671d\u5411\u548c\u5c3a\u5ea6\u7684\u524d\u63d0\u4e0b\uff0c\u4e3a\u6bcf\u4e2a\u5bb6\u5177\u69fd\u4f4d\u68c0\u7d22\u66f4\u534f\u8c03\u7684\u8d44\u4ea7\u3002\u5b83\u7ed3\u5408\u591a\u6a21\u6001\u5927\u6a21\u578b\u63d0\u53d6\u98ce\u683c\u5148\u9a8c\u3001\u52a8\u6001\u8d85\u56fe\u98ce\u683c\u573a\u5efa\u6a21\u5bb6\u5177\u95f4\u9ad8\u9636\u4f9d\u8d56\uff0c\u5e76\u901a\u8fc7\u53cd\u4e8b\u5b9e\u504f\u597d\u5b66\u4e60\u4f18\u5316\u573a\u666f\u7ea7\u98ce\u683c\u4e00\u81f4\u6027\u3002", "why_notable": "\u76f8\u6bd4\u9010\u7269\u4f53\u68c0\u7d22\u6216\u9759\u6001\u5c40\u90e8\u5173\u7cfb\u5efa\u6a21\uff0c\u8be5\u65b9\u6cd5\u80fd\u5728\u573a\u666f\u7ec4\u5408\u540e\u6301\u7eed\u6821\u6b63\u8de8\u5bb6\u5177\u7684\u5f62\u72b6\u3001\u6750\u8d28\u548c\u989c\u8272\u51b2\u7a81\uff0c\u5728 3D-FRONT \u4e0a\u5b9e\u73b0\u66f4\u597d\u7684\u5bb6\u5177\u68c0\u7d22\u4e0e\u573a\u666f\u7ea7\u98ce\u683c\u4e00\u81f4\u6027\uff0c\u5bf9\u5ba4\u5185\u8bbe\u8ba1\u81ea\u52a8\u5316\u548c3D\u8d44\u4ea7\u63a8\u8350\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Pixel-space diffusion models aim to learn an end-to-end generator directly over raw pixels. This is challenging because a single model must capture both global structure and local texture in the same high-dimensional space. While recent work improves pixel diffusion through alternative prediction targets, training objectives, and architectures, these advances typically require training a new model from scratch. We show there is a cheaper, complementary strategy: \\textbf{a frozen, pretrained pixel diffusion model can guide itself}. Our key observation is that intermediate layers of a pretrained pixel diffusion transformer can be decoded into coarse predictions that capture the main low-frequency structure, while the final layers progressively refine local, high-frequency details. We therefore attach a lightweight prediction head to an intermediate layer, keep the backbone frozen, and use the discrepancy between the intermediate and final predictions as a self-guidance direction during sampling. To train this head, we further find that real images are not necessary. Instead, model-generated samples suffice and even outperform real images for training the head, especially in enhancing the high-frequency components that pixel diffusion tends to underfit. Across multiple pixel diffusion models on ImageNet, our \\textbf{Synthetic Self-Guidance (SSG)} consistently improves generation while adapter training requires less than 1$\\%$ of full-model training compute: it reduces FID by over 50$\\%$ across the evaluated JiT variants without classifier-free guidance (CFG) and further improves strong baselines with CFG, e.g., JiT-H/16 from 1.86 to 1.67 and PixelREPA-H/16 from 1.81 to 1.59. Our code is available at https://github.com/zfu006/SSG.", "arxiv_id": "2607.29122", "arxiv_url": "https://arxiv.org/abs/2607.29122", "authors": ["Zixuan Fu", "Chong Wang", "Lanqing Guo", "Kailai Zhou", "Jiahao Nie", "Bihan Wen"], "brief": "\u8bba\u6587\u63d0\u51fa Synthetic Self-Guidance\uff08SSG\uff09\uff1a\u5728\u51bb\u7ed3\u7684\u9884\u8bad\u7ec3\u50cf\u7d20\u7a7a\u95f4\u6269\u6563 Transformer \u4e2d\u95f4\u5c42\u63a5\u5165\u8f7b\u91cf\u9884\u6d4b\u5934\uff0c\u7528\u4e2d\u95f4\u9884\u6d4b\u4e0e\u6700\u7ec8\u9884\u6d4b\u7684\u5dee\u5f02\u4f5c\u4e3a\u91c7\u6837\u81ea\u5f15\u5bfc\u65b9\u5411\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u91cd\u8bad\u4e3b\u5e72\uff0c\u4e14\u53ef\u4ec5\u7528\u6a21\u578b\u751f\u6210\u6837\u672c\u8bad\u7ec3\u9884\u6d4b\u5934\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/zfu006/SSG", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2607.29122", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u4e2d\u95f4\u5c42\u53ef\u89e3\u7801\u51fa\u4f4e\u9891\u5168\u5c40\u7ed3\u6784\uff0c\u6700\u7ec8\u5c42\u9010\u6b65\u8865\u5145\u9ad8\u9891\u5c40\u90e8\u7ec6\u8282\uff0c\u53ef\u5229\u7528\u4e8c\u8005\u5dee\u5f02\u5f15\u5bfc\u751f\u6210\u3002", "\u9884\u6d4b\u5934\u8bad\u7ec3\u4e0d\u4f9d\u8d56\u771f\u5b9e\u56fe\u50cf\uff0c\u4f7f\u7528\u5408\u6210\u6837\u672c\u53cd\u800c\u66f4\u80fd\u589e\u5f3a\u50cf\u7d20\u6269\u6563\u5bb9\u6613\u6b20\u62df\u5408\u7684\u9ad8\u9891\u6210\u5206\u3002", "\u5728\u591a\u4e2a ImageNet \u50cf\u7d20\u6269\u6563\u6a21\u578b\u4e0a\u7a33\u5b9a\u63d0\u5347\uff0c\u9002\u914d\u5668\u8bad\u7ec3\u8ba1\u7b97\u91cf\u4e0d\u5230\u5b8c\u6574\u8bad\u7ec3\u7684 1%\uff0c\u65e0 CFG \u65f6 JiT \u53d8\u4f53 FID \u964d\u5e45\u8d85 50%\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u56fe\u50cf\u751f\u6210", "\u81ea\u5f15\u5bfc", "\u9ad8\u6548\u5fae\u8c03"], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University Singapore", "pdf_url": "https://arxiv.org/pdf/2607.29122v1", "published_at": "2026-07-31", "score": 0.245, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.29122.png", "title": "A Frozen Pixel-Space Diffusion Model Can Guide Itself with Its Own Samples", "tldr": "\u51bb\u7ed3\u50cf\u7d20\u6269\u6563\u6a21\u578b\u53ef\u7528\u81ea\u8eab\u6837\u672c\u81ea\u5f15\u5bfc", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Synthetic Self-Guidance\uff08SSG\uff09\uff1a\u5728\u51bb\u7ed3\u7684\u9884\u8bad\u7ec3\u50cf\u7d20\u7a7a\u95f4\u6269\u6563 Transformer \u4e2d\u95f4\u5c42\u63a5\u5165\u8f7b\u91cf\u9884\u6d4b\u5934\uff0c\u7528\u4e2d\u95f4\u9884\u6d4b\u4e0e\u6700\u7ec8\u9884\u6d4b\u7684\u5dee\u5f02\u4f5c\u4e3a\u91c7\u6837\u81ea\u5f15\u5bfc\u65b9\u5411\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u91cd\u8bad\u4e3b\u5e72\uff0c\u4e14\u53ef\u4ec5\u7528\u6a21\u578b\u751f\u6210\u6837\u672c\u8bad\u7ec3\u9884\u6d4b\u5934\u3002", "why_notable": "\u5b83\u63d0\u4f9b\u4e86\u4e00\u79cd\u4f4e\u6210\u672c\u3001\u5373\u63d2\u5373\u7528\u7684\u50cf\u7d20\u6269\u6563\u589e\u5f3a\u65b9\u6848\uff0c\u7ed5\u5f00\u4e86\u4ece\u5934\u8bad\u7ec3\u5927\u6a21\u578b\u7684\u9ad8\u6602\u4ee3\u4ef7\uff0c\u5e76\u5c55\u793a\u4e86\u751f\u6210\u6a21\u578b\u53ef\u5229\u7528\u81ea\u8eab\u6837\u672c\u6539\u8fdb\u91c7\u6837\u8d28\u91cf\u7684\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Existing evaluations often reduce agent failures to system-level outcomes, obscuring where the fault originated and which intervention would improve the agent system. This creates a repair-assignment problem: the same visible failure may call for model post-training, harness engineering, environment redesign, or benchmark repair depending on its source. Because agent behavior emerges from interactions among models, harnesses, users, tools, memory, and environments, outcome-level labels are often insufficient for improvement. Most failure taxonomies do little to resolve this problem because they are benchmark-specific and lack a shared structure. We introduce an interaction-centric taxonomy that localizes failures to the interactions in which they originate and identifies the responsible component. It organizes 41 failure modes by assigning each to an edge between two components and a fault side indicating where the repair belongs. This makes the taxonomy actionable: model-side failures identify targets for post-training, harness-side failures point to scaffolding and tool-integration fixes, and environment or grader failures reveal evaluation conditions requiring redesign. The schema applies across agent architectures, from coding assistants to long-horizon personal assistants and multi-agent systems. We ground the taxonomy in worked examples from public benchmarks, model system cards, published reports, and logged agent trajectories, and evaluate its reproducibility using independent reasoning agents as judges. Across four frontier models, the strongest judge reaches Cohen\u0027s $\u03ba=0.76$ against human category labels, suggesting that the categories capture shared structure rather than annotator-specific preferences.", "arxiv_id": "2607.28802", "arxiv_url": "https://arxiv.org/abs/2607.28802", "authors": ["Harsh Raj", "Vipul Gupta", "Anas Mahmoud", "Razvan-Gabriel Dumitru", "Darvin Yi", "Aakash Sabharwal", "Yunzhong He"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u5931\u8d25\u5b9a\u4f4d\u5206\u7c7b\u6cd5\uff0c\u5c06\u5931\u8d25\u5f52\u56e0\u5230\u6a21\u578b\u3001\u6846\u67b6\u300 gent Failures", "tldr": "\u63d0\u51fa\u4ea4\u4e92\u4e2d\u5fc3\u7684\u667a\u80fd\u4f53\u5931\u8d25\u5f52\u56e0\u5206\u7c7b\u6cd5", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u5931\u8d25\u5b9a\u4f4d\u5206\u7c7b\u6cd5\uff0c\u5c06\u5931\u8d25\u5f52\u56e0\u5230\u6a21\u578b\u3001\u6846\u67b6\u3001\u7528\u6237\u3001\u5de5\u5177\u3001\u8bb0\u5fc6\u3001\u73af\u5883\u7b49\u7ec4\u4ef6\u4e4b\u95f4\u7684\u4ea4\u4e92\u8fb9\u4e0a\uff0c\u5e76\u6807\u6ce8\u5e94\u7531\u54ea\u4e00\u4fa7\u8d1f\u8d23\u4fee\u590d\u3002\u8be5\u5206\u7c7b\u8986\u76d641\u79cd\u5931\u8d25\u6a21\u5f0f\uff0c\u9002\u7528\u4e8e\u7f16\u7801\u52a9\u624b\u3001\u957f\u7a0b\u4e2a\u4eba\u52a9\u624b\u548c\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7b49\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u6307\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e2d\u7684\u201c\u4fee\u8c01\u201d\u7684\u6838\u5fc3\u95ee\u9898\uff0c\u4e3a\u590d\u6742LLM agent\u7cfb\u7edf\u63d0\u4f9b\u4e86\u66f4\u53ef\u6267\u884c\u7684\u5931\u8d25\u8bca\u65ad\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u5c06\u8bc4\u6d4b\u7ed3\u679c\u8f6c\u5316\u4e3a\u6a21\u578b\u8bad\u7ec3\u3001\u7cfb\u7edf\u642d\u5efa\u6216\u73af\u5883\u8bbe\u8ba1\u7684\u5177\u4f53\u6539\u8fdb\u3002"}, {"abstract": "Recent image generators can synthesize convincing human-centric images, yet producing a useful collection remains different from producing a single successful image. A human-centric dataset must cover varied people and contexts, avoid implausible attribute combinations, preserve an everyday photographic character, and expose quality-control decisions at scale. We present Poplar, a reproducible Specify--Render--Inspect pipeline for human-centric image dataset synthesis. Specify samples structured attributes under commonsense constraints and verbalizes them as photography-oriented prompts. Render uses a realism-adapted image generator across composition-aware aspect ratios and retries obvious technical failures. Inspect applies a single structured vision--language review to each candidate, preserving the original prompt while rejecting intrinsic image defects or material prompt mismatches. Using Poplar, we construct Poplar-9K: 9,401 curated human-centric image--text pairs retained from 11,765 reviewed candidates (79.9\\% acceptance). We release the dataset together with the pipeline, configurations, immutable generation prompts, and auditable inspection records as a compact resource for building customizable human-centric collections.", "arxiv_id": "2608.00440", "arxiv_url": "https://arxiv.org/abs/2608.00440", "authors": ["Zhishan Zou"], "brief": "\u8bba\u6587\u63d0\u51fa Poplar\uff0c\u4e00\u4e2a\u9762\u5411\u4eba\u7c7b\u4e2d\u5fc3\u56fe\u50cf\u6570\u636e\u96c6\u5408\u6210\u7684 Specify--Render--Inspect \u6d41\u6c34\u7ebf\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u5316\u5c5e\u6027\u91c7\u6837\u3001\u771f\u5b9e\u611f\u56fe\u50cf\u751f\u6210\u4e0e\u89c6\u89c9\u8bed\u8a00\u8d28\u68c0\uff0c\u6784\u5efa\u4e86 Poplar-9K\uff1a9401 \u7ec4\u7ecf\u7b5b\u9009\u7684\u4eba\u50cf\u56fe\u6587\u5bf9\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/choucisan/poplar", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2608.00440", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["Specify \u9636\u6bb5\u5728\u5e38\u8bc6\u7ea6\u675f\u4e0b\u91c7\u6837\u4eba\u7269\u4e0e\u573a\u666f\u5c5e\u6027\uff0c\u5e76\u8f6c\u5199\u4e3a\u504f\u6444\u5f71\u98ce\u683c\u7684\u751f\u6210\u63d0\u793a\u8bcd", "Render \u9636\u6bb5\u4f7f\u7528\u771f\u5b9e\u611f\u9002\u914d\u7684\u56fe\u50cf\u751f\u6210\u5668\uff0c\u652f\u6301\u6784\u56fe\u611f\u77e5\u7684\u591a\u5bbd\u9ad8\u6bd4\uff0c\u5e76\u81ea\u52a8\u91cd\u8bd5\u660e\u663e\u6280\u672f\u5931\u8d25\u6837\u672c", "Inspect \u9636\u6bb5\u7528\u7ed3\u6784\u5316\u89c6\u89c9\u8bed\u8a00\u5ba1\u67e5\u7b5b\u9664\u56fe\u50cf\u7f3a\u9677\u548c\u63d0\u793a\u4e0d\u5339\u914d\uff0c\u540c\u65f6\u4fdd\u7559\u539f\u59cb\u63d0\u793a\u3001\u914d\u
