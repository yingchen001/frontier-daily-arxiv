S: An Open-World Evaluation Paradigm for Agents in Finance", "tldr": "\u7528\u5f00\u653e\u7f51\u7edc\u3001\u9690\u85cf\u7b56\u7565\u4e0e\u65f6\u70b9\u6838\u9a8c\uff0c\u63ed\u793a\u91d1\u878d\u667a\u80fd\u4f53\u770b\u4f3c\u53ef\u4fe1\u7684\u9690\u6027\u5931\u8d25\u3002", "upvotes": 22, "what_it_is": "\u6784\u5efa\u91d1\u878d\u667a\u80fd\u4f53\u5f00\u653e\u4e16\u754c\u8bc4\u6d4b\uff1a\u6a21\u62df\u7528\u6237\u6309\u8be2\u95ee\u62ab\u9732\u9690\u85cf\u7b56\u7565\uff0c\u667a\u80fd\u4f53\u81ea\u884c\u8054\u7f51\u53d6\u6570\u5e76\u56de\u6d4b\u3002\u65e0\u9700\u53c2\u8003\u7b54\u6848\uff0c\u4ee5\u7b56\u7565\u5339\u914d\u3001\u65f6\u70b9\u6838\u9a8c\u548c\u6307\u6807\u91cd\u7b97\u9a8c\u8bc1\u4ea4\u4ed8\u7ed3\u679c\u3002", "why_notable": "\u628a\u9700\u6c42\u6f84\u6e05\u3001\u6570\u636e\u771f\u5b9e\u6027\u548c\u672a\u6765\u4fe1\u606f\u6cc4\u6f0f\u7eb3\u5165\u7edf\u4e00\u9a8c\u6536\uff0c\u63ed\u793a\u7528\u6237\u8ba4\u53ef\u4e0d\u7b49\u4e8e\u7ed3\u679c\u6b63\u786e\uff0c\u4e5f\u4e3a\u667a\u80fd\u4f53\u6301\u7eed\u6539\u8fdb\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u53cd\u9988\u3002"}, {"abstract": "System-1 Decision Models directly make structured probabilistic decisions over query-specified options given a state in a single forward pass, without autoregressively generating reasoning trajectories or textual responses. Recent evaluations cover diverse tasks but often rely on existing benchmarks, where prior exposure to test material can obscure generalization. Moreover, real-world decision making often involves long contexts, large option spaces, and complex logical dependencies, challenges that existing benchmarks do not adequately capture together. Thus, we introduce MMDM (Massive Multitask Decision Making), a benchmark of 5,448 high-quality questions across 16 task categories, combining newly constructed tasks with source-grounded recompositions and rewrites for single-select, multi-select, and soft-label decision making in fresh contexts. It covers realistic scenarios such as agent state tracking, tool and skill selection, preference judgments, and rubric scoring, with option spaces ranging from 2 to 1,024 and inputs extending to 64,817 tokens. With MMDM, we conduct a comprehensive quantitative evaluation of 28 decision models, showing that many perform well on common knowledge yet struggle with interdependent options, constrained decisions, and multi-select tasks. For example, Perplexity Decider-V1.2 reaches 78.75% Hard Single-select Accuracy on world knowledge, but only 53.95% on option logic and 47.95% on constraint planning, while the best Hard Multi-select Accuracy across all models is 36.81%. These results highlight joint reasoning, constraint-aware selection, and complete multi-select recovery as key priorities for decision model development, with MMDM providing a testbed for measuring this progress.", "arxiv_id": "2611.14309", "arxiv_url": "https://arxiv.org/abs/2611.14309", "authors": ["Junhao Shen", "Qing Zong", "Yue Guo", "Zhanqiu Zhang", "Yiwen Guo", "Hong Cheng"], "brief": "MMDM\u7528\u65b0\u6784\u5efa\u4efb\u52a1\u4e0e\u57fa\u4e8e\u6765\u6e90\u7684\u91cd\u7ec4\u6539\u5199\uff0c\u8bc4\u4f30\u5355\u6b21\u524d\u5411\u8f93\u51fa\u9009\u9879\u6982\u7387\u7684\u51b3\u7b56\u6a21\u578b\u3002\u5b83\u8986\u76d6\u5355\u9009\u3001\u591a\u9009\u548c\u8f6f\u6807\u7b7e\u51b3\u7b56\uff0c\u540c\u65f6\u8003\u5bdf\u957f\u4e0a\u4e0b\u6587\u3001\u5927\u9009\u9879\u7a7a\u95f4\u4e0e\u903b\u8f91\u4f9d\u8d56\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/mmdm-benchmark/mmdm", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.14309", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["MMDM\u542b5,448\u9898\u300116\u7c7b\u4efb\u52a1\uff0c\u8bc4\u6d4b28\u4e2a\u51b3\u7b56\u6a21\u578b\u3002", "\u9009\u9879\u6570\u4e3a2\u81f31,024\uff0c\u8f93\u5165\u6700\u957f64,817\u8bcd\u5143\u3002", "\u6240\u6709\u6a21\u578b\u4e2d\uff0c\u6700\u9ad8\u786c\u591a\u9009\u51c6\u786e\u7387\u4ec536.81%\u3002"], "keywords": ["\u51b3\u7b56\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b", "\u957f\u4e0a\u4e0b\u6587", "\u7ea6\u675f\u63a8\u7406"], "num_comments": 3, "on_hf": true, "organization": "The Chinese University of Hong Kong - Database Group", "pdf_url": "https://arxiv.org/pdf/2611.14309v1", "published_at": "2026-11-10", "score": 0.289, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14309.png", "title": "MMDM: Measuring Massive Multitask Decision Making", "tldr": "\u65b0\u57fa\u51c6\u8054\u5408\u6d4b\u8bd5\u957f\u4e0a\u4e0b\u6587\u4e0e\u590d\u6742\u9009\u9879\uff0c\u63ed\u793a\u51b3\u7b56\u6a21\u578b\u5728\u7ea6\u675f\u548c\u591a\u9009\u4e0a\u7684\u77ed\u677f\u3002", "upvotes": 26, "what_it_is": "MMDM\u7528\u65b0\u6784\u5efa\u4efb\u52a1\u4e0e\u57fa\u4e8e\u6765\u6e90\u7684\u91cd\u7ec4\u6539\u5199\uff0c\u8bc4\u4f30\u5355\u6b21\u524d\u5411\u8f93\u51fa\u9009\u9879\u6982\u7387\u7684\u51b3\u7b56\u6a21\u578b\u3002\u5b83\u8986\u76d6\u5355\u9009\u3001\u591a\u9009\u548c\u8f6f\u6807\u7b7e\u51b3\u7b56\uff0c\u540c\u65f6\u8003\u5bdf\u957f\u4e0a\u4e0b\u6587\u3001\u5927\u9009\u9879\u7a7a\u95f4\u4e0e\u903b\u8f91\u4f9d\u8d56\u3002", "why_notable": "\u5b83\u5c06\u901a\u5e38\u5206\u5f00\u8bc4\u4f30\u7684\u957f\u8f93\u5165\u3001\u5927\u9009\u9879\u7a7a\u95f4\u4e0e\u7ea6\u675f\u63a8\u7406\u653e\u5230\u540c\u4e00\u6d4b\u8bd5\u6846\u67b6\u4e2d\uff0c\u66f4\u6e05\u695a\u5730\u533a\u5206\u77e5\u8bc6\u719f\u6089\u5ea6\u4e0e\u590d\u6742\u51b3\u7b56\u80fd\u529b\u3002"}, {"abstract": "Protein engineering requires navigating rugged fitness landscapes, where small sequence changes can produce large functional differences, but experimental screening can only sample a small fraction of sequence space. Thus, a central challenge is to efficiently traverse the large combinatorial space of mutations in silico. We introduce ProTEUS, a mutation-resolved world model for closed-loop protein evolution. Pretrained on deep mutational scanning assays, ProTEUS learns a joint representation of sequence, evolutionary, and structural information using MutationFormer, a mutation-biased attention architecture. Variants are represented as states in this joint latent space, and mutations define actions whose functional consequences are predicted. To support exploration of many mutants, we developed a fast, physics-constrained all-atom predictor that utilizes explicit geometric constraint enforcement to achieve \u003e10 fold increase in speed than AlphaFold3 with guaranteed physical validity. Lastly, ProTEUS refines its prediction and understanding of protein activity through closed loop experimental feedback to guide evolution toward a desired phenotype. ProTEUS surpasses established models in both zero-shot and supervised fine-tuning mutation prediction tasks. We experimentally demonstrate its utility in two closed-loop multi-objective engineering campaigns on aldehyde dehydrogenase and levansucrase, yielding variants with \u003e10 fold higher activity than wild type. ProTEUS provides a world-model framework that connects virtual evaluation of mutational outcomes with experimental learning for efficient protein evolution.", "arxiv_id": "2611.13348", "arxiv_url": "https://arxiv.org/abs/2611.13348", "authors": ["Yikun Zhang", "Minghao Guo", "Guangxue Xu", "Peter Yichen Chen", "Wojciech Matusik", "Wengong Jin", "Jingjing Chai", "Kaiyi Jiang"], "brief": "ProTEUS\u4ee5\u6df1\u5ea6\u7a81\u53d8\u626b\u63cf\u6570\u636e\u9884\u8bad\u7ec3\uff0c\u7528MutationFormer\u878d\u5408\u5e8f\u5217\u3001\u8fdb\u5316\u4e0e\u7ed3\u6784\u4fe1\u606f\uff0c\u5c06\u53d8\u4f53\u89c6\u4e3a\u72b6\u6001\u3001\u7a81\u53d8\u89c6\u4e3a\u52a8\u4f5c\uff0c\u5e76\u901a\u8fc7\u5b9e\u9a8c\u53cd\u9988\u4f18\u5316\u76ee\u6807\u8868\u578b\u3002", "categories": ["q-bio.BM", "cs.AI"], "github_repo": "https://github.com/yikunpku/ProTEUS", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.13348", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["MutationFormer\u91c7\u7528\u7a81\u53d8\u504f\u7f6e\u6ce8\u610f\u529b\uff0c\u9884\u6d4b\u7a81\u53d8\u529f\u80fd\u6548\u5e94", "\u7269\u7406\u7ea6\u675f\u5168\u539f\u5b50\u9884\u6d4b\u5668\u6bd4AlphaFold3\u5feb\u903e10\u500d", "\u4e24\u9879\u9176\u5de5\u7a0b\u95ed\u73af\u5b9e\u9a8c\u83b7\u5f97\u6d3b\u6027\u8d85\u91ce\u751f\u578b10\u500d\u7684\u53d8\u4f53"], "keywords": ["\u86cb\u767d\u8d28\u5de5\u7a0b", "\u4e16\u754c\u6a21\u578b", "\u95ed\u73af\u4f18\u5316", "\u7a81\u53d8\u6548\u5e94\u9884\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13348v1", "published_at": "2026-11-09", "score": 0.285, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13348.png", "title": "ProTEUS: A mutation-resolved world model for closed-loop protein evolution", "tldr": "\u7528\u7a81\u53d8\u7ea7\u4e16\u754c\u6a21\u578b\u8fde\u63a5\u865a\u62df\u7b5b\u9009\u4e0e\u5b9e\u9a8c\u53cd\u9988\uff0c\u5b9e\u73b0\u86cb\u767d\u8d28\u95ed\u73af\u8fdb\u5316\u4f18\u5316\u3002", "upvotes": 13, "what_it_is": "ProTEUS\u4ee5\u6df1\u5ea6\u7a81\u53d8\u626b\u63cf\u6570\u636e\u9884\u8bad\u7ec3\uff0c\u7528MutationFormer\u878d\u5408\u5e8f\u5217\u3001\u8fdb\u5316\u4e0e\u7ed3\u6784\u4fe1\u606f\uff0c\u5c06\u53d8\u4f53\u89c6\u4e3a\u72b6\u6001\u3001\u7a81\u53d8\u89c6\u4e3a\u52a8\u4f5c\uff0c\u5e76\u901a\u8fc7\u5b9e\u9a8c\u53cd\u9988\u4f18\u5316\u76ee\u6807\u8868\u578b\u3002", "why_notable": "\u5c06\u7a81\u53d8\u9884\u6d4b\u3001\u5feb\u901f\u7ed3\u6784\u8bc4\u4f30\u4e0e\u5b9e\u9a8c\u5b66\u4e60\u4e32\u6210\u95ed\u73af\uff0c\u5e76\u5728\u4e24\u79cd\u9176\u7684\u591a\u76ee\u6807\u5de5\u7a0b\u4e2d\u9a8c\u8bc1\uff0c\u6709\u671b\u63d0\u9ad8\u6709\u9650\u5b9e\u9a8c\u9884\u7b97\u4e0b\u7684\u86cb\u767d\u8d28\u4f18\u5316\u6548\u7387\u3002"}, {"abstract": "Memory-augmented vision-language-action (VLA) policies are meant to remember what happened. Many of them, however, fill memory by time: they sample frames uniformly across the episode and stamp each frame with its time step. Because time passes even when nothing happens, such a memory may not tell waiting from working. We show that it does not. On the counting tasks of RoboMME, we make the robot briefly pause or fidget its wrist. Such a null event changes nothing the task depends on, yet a released memory VLA counts the interval as work done and stops early. We call this failure phantom progress. It cuts success from 47 to 16 of 50 on one task and from 44 to 10 on the other. When the same frames are withheld from memory, success returns, so the cause lies in memory rather than in the interruption itself. We trace the failure to a temporal shortcut: because demonstrations proceed at a steady pace, elapsed time predicts progress. Indeed, rescaling the time stamps alone makes the policy stop early when the clock runs fast and repeat when it runs slow. Surprisingly, removing the time encoding does not cure the failure, because the frames of a null event still occupy slots of the time-sampled memory. Across RoboMME\u0027s released designs, vulnerability follows how memory is indexed. Of the fixes the diagnosis suggests, training with injected pauses does not remove the failure and impairs counting, whereas indexing memory by events recovers half or more of the loss without retraining. A memory meant to remember what happened should count events rather than clock ticks.", "arxiv_id": "2611.14488", "arxiv_url": "https://arxiv.org/abs/2611.14488", "authors": ["Chubin Zhang", "Bo An"], "brief": "\u7814\u7a76\u7528\u6682\u505c\u3001\u624b\u8155\u5fae\u52a8\u548c\u65f6\u95f4\u6233\u7f29\u653e\uff0c\u8bca\u65ad\u8bb0\u5fc6\u589e\u5f3aVLA\u7684\u865a\u5047\u8fdb\u5ea6\u73b0\u8c61\u3002\u7ed3\u679c\u8868\u660e\uff0c\u6309\u65f6\u95f4\u91c7\u6837\u7684\u8bb0\u5fc6\u8bf1\u53d1\u6377\u5f84\uff0c\u6539\u7528\u4e8b\u4ef6\u7d22\u5f15\u53ef otable": "\u63ed\u793a\u673a\u5668\u4eba\u8bb0\u5fc6\u53ef\u80fd\u5b66\u5230\u65f6\u949f\u800c\u975e\u4e8b\u4ef6\uff0c\u4e14\u6f0f\u6d1e\u4e0d\u53ea\u6765\u81ea\u65f6\u95f4\u7f16\u7801\uff1b\u4e3a\u957f\u7a0b\u4efb\u52a1\u4e2d\u7684\u8bb0\u5fc6\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u76f4\u63a5\u3001\u4f4e\u6210\u672c\u7684\u4fee\u6b63\u65b9\u5411\u3002"}, {"abstract": "Dexterous manipulation requires rich spatial foresight over both the surrounding scene and the robot hand. Existing world-action models often acquire such predictive knowledge through explicit future prediction. We introduce DexForesight, a framework that learns spatial foresight implicitly by injecting dynamics-aware world representations into the latent space of a dexterous policy. During training, DexForesight learns an action-conditioned spatial world model from offline scene depth, kinematic hand geometry, and demonstration trajectories. The world model predicts 3D hand-point motion and visual feature changes, capturing both articulated hand dynamics and scene changes under demonstrated actions, including the motion of fingers occluded from the cameras. We then freeze the world model and align policy queries with its predictive world queries, transferring the learned spatial dynamics into policy latents and using them to condition action generation. At deployment, only the policy is retained, operating on RGB observations, language, and robot state without depth input or explicit future prediction. On 11 DexJoCo simulation tasks, DexForesight improves the overall success rate of the base policy from 49.4% to 60.5%. On three real-robot dexterous manipulation tasks, DexForesight achieves 58.3% success, compared with 50.0% for the strongest baseline. Project page https://dexforesight.github.io/", "arxiv_id": "2611.11166", "arxiv_url": "https://arxiv.org/abs/2611.11166", "authors": ["Zhongxi Chen", "Yi Yang", "Xinyi Chen", "Mingzhe Ye", "Yaping Li", "Zhihong Liu", "Congsheng Xu", "Haonan Wang", "Zhijie Deng"], "brief": "\u8be5\u6846\u67b6\u5148\u7528\u79bb\u7ebf\u6df1\u5ea6\u3001\u624b\u90e8\u51e0\u4f55\u548c\u793a\u8303\u8bad\u7ec3\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\uff0c\u518d\u51bb\u7ed3\u6a21\u578b\u5e76\u5bf9\u9f50\u7b56\u7565\u67e5\u8be2\uff0c\u5c06\u9884\u6d4b\u6027\u7a7a\u95f4\u77e5\u8bc6\u8fc1\u5165\u7b56\u7565\u6f5c\u53d8\u91cf\uff1b\u90e8\u7f72\u4ec5\u4fdd\u7559\u7b56\u7565\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.11166", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e16\u754c\u6a21\u578b\u9884\u6d4b\u4e09\u7ef4\u624b\u90e8\u70b9\u8fd0\u52a8\u4e0e\u89c6\u89c9\u7279\u5f81\u53d8\u5316\uff0c\u8986\u76d6\u906e\u6321\u624b\u6307", "\u5bf9\u9f50\u7b56\u7565\u67e5\u8be2\u4e0e\u4e16\u754c\u67e5\u8be2\uff0c\u90e8\u7f72\u65e0\u9700\u6df1\u5ea6\u6216\u663e\u5f0f\u672a\u6765\u9884\u6d4b", "11\u9879\u4eff\u771f\u4efb\u52a1\uff1a49.4%\u219260.5%\uff1b\u5b9e\u673a\uff1a50.0%\u219258.3%"], "keywords": ["\u7075\u5de7\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u6a21\u4eff\u5b66\u4e60", "\u7a7a\u95f4\u8868\u5f81"], "num_comments": 2, "on_hf": true, "organization": "Sharpa", "pdf_url": "https://arxiv.org/pdf/2611.11166v2", "published_at": "2026-11-08", "score": 0.266, "selected_reasons": ["HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11166.png", "title": "DexForesight: Grounding Dexterous Policies with Implicit Spatial Foresight", "tldr": "\u5c06\u7a7a\u95f4\u52a8\u6001\u77e5\u8bc6\u6ce8\u5165\u7075\u5de7\u64cd\u4f5c\u7b56\u7565\uff0c\u65e0\u9700\u5728\u7ebf\u9884\u6d4b\u5373\u53ef\u63d0\u5347\u4eff\u771f\u4e0e\u5b9e\u673a\u6210\u529f\u7387\u3002", "upvotes": 24, "what_it_is": "\u8be5\u6846\u67b6\u5148\u7528\u79bb\u7ebf\u6df1\u5ea6\u3001\u624b\u90e8\u51e0\u4f55\u548c\u793a\u8303\u8bad\u7ec3\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\uff0c\u518d\u51bb\u7ed3\u6a21\u578b\u5e76\u5bf9\u9f50\u7b56\u7565\u67e5\u8be2\uff0c\u5c06\u9884\u6d4b\u6027\u7a7a\u95f4\u77e5\u8bc6\u8fc1\u5165\u7b56\u7565\u6f5c\u53d8\u91cf\uff1b\u90e8\u7f72\u4ec5\u4fdd\u7559\u7b56\u7565\u3002", "why_notable": "\u5c06\u8bad\u7ec3\u671f\u7684\u7a7a\u95f4\u9884\u6d4b\u80fd\u529b\u8fc1\u5165\u90e8\u7f72\u7b56\u7565\uff0c\u907f\u514d\u5728\u7ebf\u4e16\u754c\u6a21\u578b\u9884\u6d4b\uff0c\u5e76\u5728\u4eff\u771f\u4e0e\u5b9e\u673a\u4e0a\u9a8c\u8bc1\u6536\u76ca\uff0c\u4e3a\u7075\u5de7\u64cd\u4f5c\u63d0\u4f9b\u5b9e\u7528\u7684\u52a8\u6001\u77e5\u8bc6\u6ce8\u5165\u8def\u5f84\u3002"}, {"abstract": "We present Sable, an argument system and single-GPU prover for the statement that a committed, integer-quantized transformer produced a given token sequence from a given prompt, bit for bit. Sable fixes an integer function F_O with no floating-point step, in which every rounding, normalization, softmax and sampling decision is determined by its inputs, and proves it with a constraint system whose relations provably never wrap modulo the 31-bit KoalaBear prime. The proof batches zerochecks and LogUp-GKR lookups into one sumcheck per domain, and commits to every witness tensor and weight in one multilinear commitment built from Reed-Solomon codes, BLAKE3 Merkle trees and a mixed-length BaseFold opening. The prover streams the model layer by layer on one GPU. On one NVIDIA RTX PRO 6000 Blackwell GPU, Sable proves all 64 layers of Qwen2.5-32B in 92.5 s for 4,096 tokens and 398 s for 16,384 tokens, and covers Qwen3-32B and the mixture-of-experts Qwen3-30B-A3B (4,096 tokens in 121.8 and 84.7 s). A proof costs 41 to 50 times the serving time, or 6.4 cents per 4,096-token request at public GPU prices, and 40 to 64 times less time per parameter and token than zkLLM. On WikiText-2, F_O\u0027s greedy token matches the BF16 model\u0027s at 86.3% of positions; on Qwen3, F_O is within 1.6 points of BF16 on MMLU and 1.7 points on GSM8K. A verifier with a compiled core checks a proof on one CPU core in 19 to 56 s. In the random-oracle model, the interactive proof has round-by-round soundness error 2^-103. The proof is not zero-knowledge, so the system targets open-weight models. Code: https://github.com/moonmath-ai/Sable", "arxiv_id": "2611.14083", "arxiv_url": "https://arxiv.org/abs/2611.14083", "authors": ["Tomer Solberg"], "brief": "Sable\u8bc1\u660e\u5df2\u627f\u8bfa\u7684\u91cf\u5316\u6a21\u578b\u786e\u5b9e\u7531\u6307\u5b9a\u63d0\u793a\u751f\u6210\u7ed9\u5b9a\u5e8f\u5217\u3002\u5b83\u5c06\u63a8\u7406\u5b9a\u4e49\u4e3a\u65e0\u6d6e\u70b9\u7684\u786e\u5b9a\u6027\u6574\u6570\u51fd\u6570\uff0c\u7ed3\u5408\u5c0f\u57dfsumcheck\u4e0e\u5f20\u91cf\u627f\u8bfa\uff0c\u9010\u5c42\u6d41\u5f0f\u751f\u6210\u8bc1\u660e\u3002", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": "https://github.com/moonmath-ai/Sable", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2611.14083", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5408\u5e76zerocheck\u4e0eLogUp-GKR\uff0c\u6bcf\u57df\u4e00\u6b21sumcheck", "\u5355\u5361\u8bc1\u660eQwen2.5-32B\u76844096\u8bcd\u5143\u8017\u65f692.5\u79d2", "\u8bc1\u660e\u8017\u65f6\u4e3a\u63a8\u7406\u768441\u81f350\u500d\uff0c\u4e14\u4e0d\u5177\u96f6\u77e5\u8bc6\u6027"], "keywords": ["\u53ef\u9a8c\u8bc1\u8ba1\u7b97", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6574\u6570\u63a8\u7406", "\u5bc6\u7801\u5b66\u8bc1\u660e"], "num_comments": 2, "on_hf": true, "organization": "MoonMath.ai", "pdf_url": "https://arxiv.org/pdf/2611.14083v1", "published_at": "2026-11-10", "score": 0.259, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14083.png", "title": "Sable: A Small-Field Sumcheck Argument for Bit-Exact Inference of Large Language Models", "tldr": "\u5c06\u5927\u6a21\u578b\u63a8\u7406\u8f6c\u4e3a\u786e\u5b9a\u6027\u6574\u6570\u8ba1\u7b97\uff0c\u7528\u5355\u5361\u751f\u6210\u9010\u6bd4\u7279\u6b63\u786e\u6027\u8bc1\u660e\u3002", "upvotes": 2, "what_it_is": "Sable\u8bc1\u660e\u5df2\u627f\u8bfa\u7684\u91cf\u5316\u6a21\u578b\u786e\u5b9e\u7531\u6307\u5b9a\u63d0\u793a\u751f\u6210\u7ed9\u5b9a\u5e8f\u5217\u3002\u5b83\u5c06\u63a8\u7406\u5b9a\u4e49\u4e3a\u65e0\u6d6e\u70b9\u7684\u786e\u5b9a\u6027\u6574\u6570\u51fd\u6570\uff0c\u7ed3\u5408\u5c0f\u57dfsumcheck\u4e0e\u5f20\u91cf\u627f\u8bfa\uff0c\u9010\u5c42\u6d41\u5f0f\u751f\u6210\u8bc1\u660e\u3002", "why_notable": "\u628a\u6570\u767e\u4ebf\u53c2\u6570\u6a21\u578b\u7684\u53ef\u9a8c\u8bc1\u63a8\u7406\u63a8\u8fdb\u5230\u5355\u5361\u5206\u949f\u7ea7\uff0c\u8f83zkLLM\u663e\u8457\u63d0\u901f\uff1b\u4f46\u6574\u6570\u7248\u672c\u5e76\u975e\u539f\u59cbBF16\u6a21\u578b\u7684\u5b8c\u5168\u7b49\u4ef7\u66ff\u4ee3\u3002"}, {"abstract": "Time-series classifiers deployed in risk-sensitive domains must be (1) accurate, (2) interpretable, and (3) able to abstain when evidence is weak. Existing methods do not deliver all 3 at once, and the obstacle is structural, rather than logistical. Meaningful temporal patterns cannot be defined without knowing segment boundaries, yet meaningful boundaries cannot be placed without knowing which patterns to expect. Existing approaches break this circularity by using fixed windows or expert-annotated vocabularies, thereby sacrificing at least one of the 3 properties. We introduce ConceptTime, which closes the loop through a single self-supervised signal. A frozen probabilistic forecaster predicts a distribution over the next observation at every timestep of the sequence. We call the mismatch between its prediction and the realized signal the predictive surprise. This signal both locates segment boundaries and characterizes each resulting segment through the forecaster. Segments are thus grounded by how they behaved relative to expectation, not by what they look like. These summaries cluster into a vocabulary of dynamical regimes that we call concepts. A lightweight head classifies from the concept sequence, and the distance to the nearest concept yields reliability by design. Across 17 public benchmarks, ConceptTime is competitive with state-of-the-art black-box accuracy, beats every interpretable baseline, and retains near-98% accuracy on Epilepsy with 1% of labels. It further remains competitive with softmax, prototype-distance, and SHAP/TimeX/TimeX++ on OOD detection and deletion faithfulness, without a single annotation, language model call, or domain expert. Code is available at: https://github.com/Sachithx/ConceptTime.git.", "arxiv_id": "2611.12955", "arxiv_url": "https://arxiv.org/abs/2611.12955", "authors": ["Sachith Abeywickrama", "Emadeldeen Eldele", "Min Wu", "Xiaoli Li", "Chau Yuen"], "brief": "ConceptTime\u7528\u51bb\u7ed3\u6982\u7387\u9884\u6d4b\u5668\u7684\u9884\u6d4b\u504f\u5dee\u5b9a\u4f4d\u8fb9\u754c\u5e76\u8868\u5f81\u7247\u6bb5\uff0c\u805a\u7c7b\u751f\u6210\u52a8\u6001\u6982\u5ff5\u8bcd\u8868\uff1b\u8f7b\u91cf\u5206\u7c7b\u5934\u8bfb\u53d6\u6982\u5ff5\u5e8f\u5217\uff0c\u6700\u8fd1\u6982\u5ff5\u8ddd\u79bb\u7528\u4e8e\u8861\u91cf\u53ef\u9760\u6027\u3002", "categories": ["cs.LG", "cs.AI", "eess.SP", "stat.ML"], "github_repo": "https://github.com/Sachithx/ConceptTime", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.12955", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9884\u6d4b\u60ca\u8bb6\u540c\u65f6\u9a71\u52a8\u65f6\u5e8f\u5206\u6bb5\u4e0e\u7247\u6bb5\u8868\u5f81", "17\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u4f18\u4e8e\u6240\u6709\u53ef\u89e3\u91ca\u57fa\u7ebf", "Epilepsy\u4ec5\u75281%\u6807\u7b7e\u4ecd\u8fbe\u8fd198%\u51c6\u786e\u7387"], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u5206\u7c7b", "\u6982\u5ff5\u74f6\u9888", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u53ef\u9760\u6027\u8bc4\u4f30"], "num_comments": 3, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.12955v1", "published_at": "2026-11-07", "score": 0.255, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12955.png", "title": "Predictive Surprise as Self-Grounding Concept Bottleneck for Interpretable Time Series", "tldr": "\u4ee5\u9884\u6d4b\u60ca\u8bb6\u7edf\u4e00\u65f6\u5e8f\u5206\u6bb5\u4e0e\u6982\u5ff5\u53d1\u73b0\uff0c\u517c\u987e\u5206\u7c7b\u7cbe\u5ea6\u3001\u53ef\u89e3\u91ca\u6027\u548c\u62d2\u5224\u80fd\u529b\u3002", "upvotes": 3, "what_it_is": "ConceptTime\u7528\u51bb\u7ed3\u6982\u7387\u9884\u6d4b\u5668\u7684\u9884\u6d4b\u504f\u5dee\u5b9a\u4f4d\u8fb9\u754c\u5e76\u8868\u5f81\u7247\u6bb5\uff0c\u805a\u7c7b\u751f\u6210\u52a8\u6001\u6982\u5ff5\u8bcd\u8868\uff1b\u8f7b\u91cf\u5206\u7c7b\u5934\u8bfb\u53d6\u6982\u5ff5\u5e8f\u5217\uff0c\u6700\u8fd1\u6982\u5ff5\u8ddd\u79bb\u7528\u4e8e\u8861\u91cf\u53ef\u9760\u6027\u3002", "why_notable": "\u7528\u540c\u4e00\u81ea\u76d1\u7763\u4fe1\u53f7\u6253\u901a\u5206\u6bb5\u4e0e\u6982\u5ff5\u53d1\u73b0\u7684\u5faa\u73af\u4f9d\u8d56\uff0c\u65e0\u9700\u4e13\u5bb6\u6807\u6ce8\uff1b\u5728\u63a5\u8fd1\u9ed1\u7bb1\u7cbe\u5ea6\u7684\u540c\u65f6\u63d0\u4f9b\u53ef\u89e3\u91ca\u51b3\u7b56\u4e0e\u62d2\u5224\u4f9d\u636e\u3002"}, {"abstract": "As text-to-video (T2V) models are increasingly positioned as world simulators, it is essential to evaluate whether their videos conform to physical commonsense. However, existing benchmarks rely on annotators who rate each video with a single score based on intuition, yielding ratings that are subjective and do not tell which physical principle is violated. We introduce PhyRubric, a rubric-grounded diagnostic framework for evaluating physical commonsense in T2V generation. For each caption, PhyRubric constructs a caption-specific rubric before any video is seen, decomposing the caption into semantic and physical items, and derives scores from item-level verdicts grounded in timestamped evidence. We instantiate this framework as PhyRubric-Bench, which spans 34 categories across five physical domains, and scale it up to PhyRubric-Train with 3,788 videos, on which we fine-tune the open-source PhyRubric-Judge. Empirical results across ten T2V models show that physical commonsense remains far from solved, and that PhyRubric-Judge correlates more closely with human judgments than existing open-source judges while matching the frontier proprietary Gemini 4 Argon. Further analysis provides actionable insights for T2V models.", "arxiv_id": "2611.13576", "arxiv_url": "https://arxiv.org/abs/2611.13576", "authors": ["Huiyi Chen", "Weitai Kang", "Shicheng Fan", "Xinshuo Wang", "Zhixiang Shen", "Yan Yan", "Philip S. Yu", "Baoxin Li"], "brief": "PhyRubric\u5728\u89c2\u770b\u89c6\u9891\u524d\uff0c\u6309\u63d0\u793a\u8bcd\u6784\u5efa\u8bed\u4e49\u4e0e\u7269\u7406\u68c0\u67e5\u9879\uff0c\u518d\u4f9d\u636e\u5e26\u65f6\u95f4\u6233\u7684\u8bc1\u636e\u9010\u9879\u5224\u5b9a\u3001\u6c47\u603b\u8bc4\u5206\uff0c\u5e76\u914d\u5957\u6784\u5efa\u57fa\u51c6\u3001\u8bad\u7ec3\u5f00\u6e90\u8bc4\u5224\u6a21\u578b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/chenyil6/phyRubric", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13576", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["PhyRubric\u6309\u63d0\u793a\u8bcd\u9884\u8bbe\u91cf\u89c4\uff0c\u4ee5\u65f6\u95f4\u6233\u8bc1\u636e\u652f\u6491\u9010\u9879\u5224\u5b9a", "\u57fa\u51c6\u8986\u76d65\u4e2a\u7269\u7406\u9886\u57df\u300134\u7c7b\uff1b\u8bad\u7ec3\u96c6\u542b3,788\u6bb5\u89c6\u9891", "\u8bc4\u6d4b10\u4e2a\u751f\u6210\u6a21\u578b\uff0c\u5f00\u6e90\u8bc4\u5224\u5668\u4e0e\u4eba\u7c7b\u5224\u65ad\u76f8\u5173\u6027\u5339\u654cGemini 4 Argon"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7269\u7406\u5e38\u8bc6", "\u6a21\u578b\u8bc4\u6d4b", "\u8bca\u65ad\u8bc4\u4f30"], "num_comments": 5, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13576v1", "published_at": "2026-11-10", "score": 0.249, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13576.png", "title": "PhyRubric: Rubric-Grounded Diagnostic Evaluation of Physical Commonsense in Text-to-Video Generation", "tldr": "\u7528\u9010\u9879\u91cf\u89c4\u548c\u65f6\u95f4\u6233\u8bc1\u636e\u8bca\u65ad\u751f\u6210\u89c6\u9891\u7684\u7269\u7406\u5e38\u8bc6\u9519\u8bef\uff0c\u5e76\u8bad\u7ec3\u5f00\u6e90\u8bc4\u5224\u6a21\u578b\u3002", "upvotes": 10, "what_it_is": "PhyRubric\u5728\u89c2\u770b\u89c6\u9891\u524d\uff0c\u6309\u63d0\u793a\u8bcd\u6784\u5efa\u8bed\u4e49\u4e0e\u7269\u7406\u68c0\u67e5\u9879\uff0c\u518d\u4f9d\u636e\u5e26\u65f6\u95f4\u6233\u7684\u8bc1\u636e\u9010\u9879\u5224\u5b9a\u3001\u6c47\u603b\u8bc4\u5206\uff0c\u5e76\u914d\u5957\u6784\u5efa\u57fa\u51c6\u3001\u8bad\u7ec3\u5f00\u6e90\u8bc4\u5224\u6a21\u578b\u3002", "why_notable": "\u5c06\u76f4\u89c9\u5f0f\u603b\u5206\u8f6c\u4e3a\u53ef\u8ffd\u6eaf\u7684\u7269\u7406\u9519\u8bef\u8bca\u65ad\uff0c\u4fbf\u4e8e\u5b9a\u4f4d\u751f\u6210\u6a21\u578b\u77ed\u677f\uff1b\u5f00\u6e90\u8bc4\u5224\u5668\u4e5f\u4e3a\u89c4\u6a21\u5316\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u5f3a\u5de5\u5177\u3002"}, {"abstract": "RLVR trains language models to reason by rewarding correct final answers. A widely used algorithm, group-relative policy optimization (GRPO), gives every token of a solution the same credit, so dense process rewards have been proposed to credit intermediate steps, for example with a Monte-Carlo reward that scores each step by sampling continuations from it. Comparing such a reward with GRPO per training update, or vetting it with a gradient test on a single batch, leaves out what it costs: in our setting, the continuations alone take 91% of all generated tokens. We introduce a matched-compute protocol that gives every training intervention the same budget, measured in generated tokens and training GPU-hours, and tests it in preregistered studies with controls for side effects. Across 1,668 runs on six models, matching compute reverses the ranking. On Qwen2.5-1.5B, the Monte-Carlo reward leads standard GRPO per update, yet ends 14.3 percentage points lower at equal tokens and 7.8 points lower at equal training time, and none of four dense-reward variants outperforms GRPO even with as much training time. A per-token gradient test orders these rewards as training does but overestimates each by one to two points, as much as the gains it is meant to detect. In contrast, training on the prompts whose predicted success is nearest 1/2 improves accuracy at matched compute, by 1.7 points on Qwen3-0.6B and 0.8 on Qwen2.5-1.5B. These gains replicate on fresh seeds and unseen problems, and a simple rule, that the candidate prompts are predicted to fail more often than not, predicted where they appear in five of six preregistered tests. Both gains come early in training, and standard GRPO with twice the initial learning rate comes within half a point of them. We argue that training interventions should be validated at matched compute, which overturns some apparent gains and confirms others.", "arxiv_id": "2611.13560", "arxiv_url": "https://arxiv.org/abs/2611.13560", "authors": ["Vikash Singh", "Weicong Chen", "Debargha Ganguly", "Yanyan Zhang", "Mohsen Hariri", "Sreehari Sankar", "Wang Yang", "Chaoda Song", "Alexander Nemecek", "Osama Zafar", "Yuting Shao", "Kai Ye", "Biyao Zhang", "Xinpeng Li", "Shouren Wang", "Erman Ayday", "Jing Ma", "Sanmukh Rao Kuppannagari", "Vipin Chaudhary"], "brief": "\u7814\u7a76\u4ee5\u751f\u6210\u8bcd\u5143\u6570\u548c\u8bad\u7ec3GPU\u65f6\u957f\u5bf9\u9f50\u9884\u7b97\uff0c\u6bd4\u8f83\u5bc6\u96c6\u8fc7\u7a0b\u5956\u52b1\u4e0e\u6807\u51c6GRPO\u3002\u901a\u8fc7\u9884\u6ce8\u518c\u5b9e\u9a8c\u548c\u526f\u4f5c\u7528\u63a7\u5236\uff0c\u68c0\u9a8c\u5956\u52b1\u8bbe\u8ba1\u3001\u9898\u76ee\u7b5b\u9009\u53ca\u68af\u5ea6\u6d4b\u8bd5\u7684\u771f\u5b9e\u6536\u76ca\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13560", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u516d\u4e2a\u6a21\u578b\u51711668\u6b21\u8fd0\u884c\uff0c\u8499\u7279\u5361\u6d1b\u7eed\u5199\u536091%\u751f\u6210\u8bcd\u5143", "Qwen2.5-1.5B\u7b49\u8bcd\u5143\u9884\u7b97\u4e0b\uff0c\u8499\u7279\u5361\u6d1b\u5956\u52b1\u843d\u540e14.3\u4e2a\u767e\u5206\u70b9", "\u7b5b\u9009\u9884\u6d4b\u6210\u529f\u7387\u8fd11/2\u7684\u9898\u76ee\uff0c\u51c6\u786e\u7387\u63d0\u53470.8\u81f31.7\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u8bad\u7ec3", "\u8fc7\u7a0b\u5956\u52b1", "\u7b97\u529b\u6548\u7387"], "num_comments": 6, "on_hf": true, "organization": "Case Western Reserve University", "pdf_url": "https://arxiv.org/pdf/2611.13560v1", "published_at": "2026-11-10", "score": 0.249, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13560.png", "title": "Are Dense Rewards Worth Their Tokens in GRPO?", "tldr": "\u7b49\u7b97\u529b\u6bd4\u8f83\u9006\u8f6c\u5bc6\u96c6\u8fc7\u7a0b\u5956\u52b1\u4f18\u52bf\uff0c\u96be\u5ea6\u9002\u4e2d\u7684\u9898\u76ee\u7b5b\u9009\u5e26\u6765\u5c0f\u5e45\u6536\u76ca\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u4ee5\u751f\u6210\u8bcd\u5143\u6570\u548c\u8bad\u7ec3GPU\u65f6\u957f\u5bf9\u9f50\u9884\u7b97\uff0c\u6bd4\u8f83\u5bc6\u96c6\u8fc7\u7a0b\u5956\u52b1\u4e0e\u6807\u51c6GRPO\u3002\u901a\u8fc7\u9884\u6ce8\u518c\u5b9e\u9a8c\u548c\u526f\u4f5c\u7528\u63a7\u5236\uff0c\u68c0\u9a8c\u5956\u52b1\u8bbe\u8ba1\u3001\u9898\u76ee\u7b5b\u9009\u53ca\u68af\u5ea6\u6d4b\u8bd5\u7684\u771f\u5b9e\u6536\u76ca\u3002", "why_notable": "\u628a\u989d\u5916\u5956\u52b1\u8ba1\u7b97\u7eb3\u5165\u6210\u672c\u540e\uff0c\u539f\u6709\u4f18\u52bf\u53cd\u8f6c\uff0c\u4e3a\u63a8\u7406\u5f3a\u5316\u5b66\u4e60\u63d0\u4f9b\u66f4\u516c\u5e73\u7684\u8bc4\u4f30\u8303\u5f0f\uff1b\u9898\u76ee\u7b5b\u9009\u867d\u6709\u6548\uff0c\u5374\u63a5\u8fd1\u7b80\u5355\u8c03\u5927\u5b66\u4e60\u7387\u7684\u6536\u76ca\u3002"}, {"abstract": "A scientific agent can give the same verdict while reading and citing different evidence. BioAgent-DF tests this separation using paired reference and candidate values saved at the same scientific computation site. It restores or transplants those values at their original coordinates, then runs the agent on healthy hardware. Across eight SciFact batches, Qwen3.5-4B shows repeatable citation changes in three capture-claim combinations, and Gemma 3 4B IT shows repeatable read and citation changes in four. These seven combinations cover two claims. Full restoration recovers the reference evidence sets while verdicts remain unchanged. Verdict changes observed under the baseline prompt did not recur under the explicit-example prompt. Complementary tool and optimizer experiments distinguish recovery of numerical state, recovery of ranked lists, and restoration of an agent\u0027s visible history. These results show that an audit should track both the evidence an agent uses and its final answer. In hERG cardiac-safety assay allocation, silent numerical faults changed testing decisions while the fixed-budget shortlist kept the same number of compounds labeled as blockers. After the agent had used faulty values, restoring its earlier execution state and supplying certified scores recovered all 39 changed decisions, whereas replacing the prediction file recovered none; no incorrect action was committed. A streaming implementation of the arithmetic checks reduced the total time for forward execution and verification by 42.4% relative to the original FP64 implementation, with identical flags and recovery outputs.", "arxiv_id": "2611.01527", "arxiv_url": "https://arxiv.org/abs/2611.01527", "authors": ["Xingyu Yi", "Xinya Zhang", "Yunshen Zhou", "Haoyu Bao"], "brief": "BioAgent-DF\u5728\u540c\u4e00\u79d1\u5b66\u8ba1\u7b97\u4f4d\u7f6e\u914d\u5bf9\u4fdd\u5b58\u53c2\u8003\u503c\u4e0e\u5019\u9009\u503c\uff0c\u901a\u8fc7\u539f\u4f4d\u6062\u590d\u6216\u79fb\u690d\u540e\u91cd\u8dd1\u667a\u80fd\u4f53\uff0c\u8ffd\u8e2a\u6570\u503c\u72b6\u6001\u3001\u8bc1\u636e\u5f15\u7528\u548c\u5b9e\u9a8c\u51b3\u7b56\u4e4b\u95f4\u7684\u56e0\u679c\u8054\u7cfb\u3002", "categories": ["cs.AI", "cs.LG", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01527", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["8\u6279SciFact\u6d4b\u8bd5\u4e2d\uff0c7\u7ec4\u914d\u7f6e\u53cd\u590d\u51fa\u73b0\u8bc1\u636e\u53d8\u5316", "hERG\u4efb\u52a1\u6062\u590d\u6267\u884c\u72b6\u6001\u4e0e\u8ba4\u8bc1\u5206\u6570\uff0c\u7ea0\u6b6339\u9879\u51b3\u7b56", "\u6d41\u5f0f\u7b97\u672f\u6821\u9a8c\u8f83\u539fFP64\u5b9e\u73b0\u8282\u770142.4%\u603b\u65f6\u95f4"], "keywords": ["\u79d1\u7814\u667a\u80fd\u4f53", "\u51b3\u7b56\u6eaf\u6e90", "\u6545\u969c\u6062\u590d", "\u751f\u7269\u533b\u5b66"], "num_comments": 2, "on_hf": true, "organization": "INTOSYN AI Labs", "pdf_url": "https://arxiv.org/pdf/2611.01527v1", "published_at": "2026-11-01", "score": 0.236, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01527.png", "title": "From Tool State to Scientific Action: Auditing Decision Provenance in Biomedical Research Agents", "tldr": "\u901a\u8fc7\u72b6\u6001\u6062\u590d\u4e0e\u79fb\u690d\u5ba1\u8ba1\u79d1\u7814\u667a\u80fd\u4f53\uff0c\u63ed\u793a\u7ed3\u8bba\u4e0d\u53d8\u4e5f\u53ef\u80fd\u63a9\u76d6\u8bc1\u636e\u4e0e\u884c\u52a8\u504f\u79fb\u3002", "upvotes": 7, "what_it_is": "BioAgent-DF\u5728\u540c\u4e00\u79d1\u5b66\u8ba1\u7b97\u4f4d\u7f6e\u914d\u5bf9\u4fdd\u5b58\u53c2\u8003\u503c\u4e0e\u5019\u9009\u503c\uff0c\u901a\u8fc7\u539f\u4f4d\u6062\u590d\u6216\u79fb\u690d\u540e\u91cd\u8dd1\u667a\u80fd\u4f53\uff0c\u8ffd\u8e2a\u6570\u503c\u72b6\u6001\u3001\u8bc1\u636e\u5f15\u7528\u548c\u5b9e\u9a8c\u51b3\u7b56\u4e4b\u95f4\u7684\u56e0\u679c\u8054\u7cfb\u3002", "why_notable": "\u5c06\u79d1\u7814\u667a\u80fd\u4f53\u5ba1\u8ba1\u4ece\u6700\u7ec8\u7b54\u6848\u6269\u5c55\u5230\u8bc1\u636e\u548c\u884c\u52a8\u94fe\uff0c\u8bf4\u660e\u4ec5\u66ff\u6362\u9884\u6d4b\u6587\u4ef6\u4e0d\u8db3\u4ee5\u4fee\u590d\u5df2\u53d7\u6c61\u67d3\u7684\u51b3\u7b56\u8fc7\u7a0b\uff0c\u5e76\u5c55\u793a\u53ef\u9a8c\u8bc1\u7684\u6062\u590d\u8def\u5f84\u3002"}, {"abstract": "Reinforcement learning (RL) can improve an agent\u0027s task capability while reinforcing behavior that violates contextual execution requirements. We study this reward-driven misalignment, including reward hacking, through verifiable reward--context conflicts, where compliant task completion remains feasible while some executable shortcuts earn more reward than every compliant strategy. Encoding these conflicts in task dynamics lets us generate diverse interactive environments at scale and derive compliance feedback from execution histories. In resource and reporting workflows, task optimization increases real productivity through unauthorized resource use or raises reported scores while actual work declines. Controlled changes in the training distribution show that minority conflict exposure can still lead to widespread shortcut acquisition, reaching 97.9\\% certified profitable violations on an API task under a 25\\% conflict mixture after 128 updates. The same contextual checks supply a simple binary penalty that supports joint capability and compliance gains and partially mitigates acquired violations. Learned safety adapts to expanded authorization and transfers across mechanisms into workflows with evolving evidence and approval requirements. On 32 unseen changing-evidence tasks, resource-trained safety increases safe completion from 53.1\\% to 89.1\\% relative to task-only training, while both policies achieve full real work. These results connect a verifiable account of reward-driven misalignment with scalable task construction and safety learning that remains useful under changing execution requirements.", "arxiv_id": "2611.12865", "arxiv_url": "https://arxiv.org/abs/2611.12865", "authors": ["Xinjie Shen"], "brief": "\u7814\u7a76\u5c06\u5956\u52b1\u4e0e\u6267\u884c\u7ea6\u675f\u7684\u51b2\u7a81\u7f16\u7801\u8fdb\u4ea4\u4e92\u73af\u5883\uff0c\u4f7f\u5408\u89c4\u5b8c\u6210\u4ecd\u53ef\u884c\u3001\u8fdd\u89c4\u6377\u5f84\u5374\u66f4\u83b7\u5229\uff1b\u518d\u4ece\u6267\u884c\u5386\u53f2\u63d0\u53d6\u5408\u89c4\u53cd\u9988\uff0c\u4ee5\u4e8c\u5143\u60e9\u7f5a\u8bad\u7ec3\u517c\u987e\u80fd\u529b\u4e0e\u5b89\u5168\u7684\u7b56\u7565\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.12865", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5956\u52b1\u2014\u4e0a\u4e0b\u6587\u51b2\u7a81\u5d4c\u5165\u4efb\u52a1\u52a8\u6001\uff0c\u652f\u6301\u89c4\u6a21\u5316\u6784\u9020\u73af\u5883", "API\u4efb\u52a1\u6df7\u516525%\u51b2\u7a81\uff0c128\u6b21\u66f4\u65b0\u540e\u83b7\u5229\u8fdd\u89c4\u7387\u8fbe97.9%", "32\u4e2a\u672a\u89c1\u8bc1\u636e\u53d8\u5316\u4efb\u52a1\u4e2d\uff0c\u5b89\u5168\u5b8c\u6210\u7387\u4ece53.1%\u5347\u81f389.1%"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u9ed1\u5ba2", "\u667a\u80fd\u4f53\u5b89\u5168", "\u5408\u89c4\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Everywhere Safety", "pdf_url": "https://arxiv.org/pdf/2611.12865v1", "published_at": "2026-11-09", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12865.png", "title": "Shortcuts and Boundaries: Verifiable RL Misalignment and Contextual Safety Learning", "tldr": "\u53ef\u9a8c\u8bc1\u73af\u5883\u63ed\u793a\u5956\u52b1\u4f18\u5316\u5982\u4f55\u8bf1\u53d1\u8fdd\u89c4\u6377\u5f84\uff0c\u5e76\u7528\u4e0a\u4e0b\u6587\u60e9\u7f5a\u63d0\u5347\u5b89\u5168\u6027", "upvotes": 2, "what_it_is": "\u7814\u7a76\u5c06\u5956\u52b1\u4e0e\u6267\u884c\u7ea6\u675f\u7684\u51b2\u7a81\u7f16\u7801\u8fdb\u4ea4\u4e92\u73af\u5883\uff0c\u4f7f\u5408\u89c4\u5b8c\u6210\u4ecd\u53ef\u884c\u3001\u8fdd\u89c4\u6377\u5f84\u5374\u66f4\u83b7\u5229\uff1b\u518d\u4ece\u6267\u884c\u5386\u53f2\u63d0\u53d6\u5408\u89c4\u53cd\u9988\uff0c\u4ee5\u4e8c\u5143\u60e9\u7f5a\u8bad\u7ec3\u517c\u987e\u80fd\u529b\u4e0e\u5b89\u5168\u7684\u7b56\u7565\u3002", "why_notable": "\u5c06\u5956\u52b1\u9a71\u52a8\u7684\u5931\u914d\u8f6c\u4e3a\u53ef\u9a8c\u8bc1\u3001\u53ef\u89c4\u6a21\u5316\u7814\u7a76\u7684\u95ee\u9898\uff0c\u5e76\u5c55\u793a\u5b89\u5168\u8bad\u7ec3\u53ef\u8de8\u673a\u5236\u8fc1\u79fb\uff0c\u5728\u6267\u884c\u8981\u6c42\u53d8\u5316\u65f6\u4fdd\u7559\u771f\u5b9e\u4efb\u52a1\u4ea7\u51fa\u3002"}, {"abstract": "Much of the variation in financial time series is driven by market-wide shocks that cannot be predicted from an asset\u0027s own history. Per-asset self-supervised learning treats this variation as irreducible noise. Under a latent factor model, we show that conditioning prediction on the realized market factor makes the asset\u0027s market exposure necessary for optimal prediction, while reducing the noise against which the asset-specific component is learned. Building on this insight, we introduce Market-Conditioned JEPA (MC-JEPA), a joint-embedding predictive architecture for financial time series. During training, we construct a leave-one-out market condition for each asset from the future target embeddings of other assets and incorporate it through factor loadings derived from the asset\u0027s own representation. On 11 years of minute-level Chinese A-share data, MC-JEPA improves over per-asset JEPA across nine targets spanning returns, market exposure, risk, and liquidity, with the strongest and most statistically significant gains in exposure, risk, and liquidity. It achieves the best RankIC on all liquidity targets and on return horizons from two hours to five days, outperforming time-series foundation models and self-supervised baselines, and delivers the best portfolio performance in a historical backtest. Ablations show that the return and exposure gains require the condition to be aligned with the realized market movement. After restoring the volatility scale removed by normalization, the predictor\u0027s factor loadings rank stocks by market beta nearly as well as a supervised probe, without labels. A synthetic factor-model study with known parameters shows that conditioning improves the recovery of both market exposure and the asset-specific component.", "arxiv_id": "2611.13572", "arxiv_url": "https://arxiv.org/abs/2611.13572", "authors": ["Yuqi Wang", "Fengyuan Liu", "Mukai Li", "Haochen Luo", "Lei Li", "Qi Liu"], "brief": "MC-JEPA\u7528\u5176\u4ed6\u8d44\u4ea7\u7684\u672a\u6765\u76ee\u6807\u5d4c\u5165\u6784\u9020\u7559\u4e00\u5e02\u573a\u6761\u4ef6\uff0c\u518d\u901a\u8fc7\u81ea\u8eab\u8868\u5f81\u751f\u6210\u7684\u56e0\u5b50\u8f7d\u8377\u878d\u5165\u9884\u6d4b\uff0c\u4f7f\u6a21\u578b\u540c\u65f6\u5b66\u4e60\u5e02\u573a\u66b4\u9732\u4e0e\u8d44\u4ea7\u7279\u6709\u6210\u5206\u3002", "categories": ["cs.LG", "cs.AI", "cs.CE"], "github_repo": "https://github.com/OpenFinMind/MC-JEPA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.13572", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6f5c\u5728\u56e0\u5b50\u6a21\u578b\u8bc1\u660e\uff1a\u5e02\u573a\u6761\u4ef6\u964d\u4f4e\u7279\u6709\u6210\u5206\u5b66\u4e60\u566a\u58f0", "11\u5e74\u5206\u949f\u7ea7A\u80a1\u6570\u636e\uff0c\u8986\u76d6\u6536\u76ca\u3001\u66b4\u9732\u7b499\u7c7b\u76ee\u6807", "\u6240\u6709\u6d41\u52a8\u6027\u53ca2\u5c0f\u65f6\u81f35\u5929\u6536\u76ca\u76ee\u6807\u7684RankIC\u6700\u4f18"], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u91d1\u878d\u65f6\u95f4\u5e8f\u5217", "\u56e0\u5b50\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "OpenFinMind", "pdf_url": "https://arxiv.org/pdf/2611.13572v1", "published_at": "2026-11-10", "score": 0.235, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13572.png", "title": "Market-Conditioned JEPA: Learning from Unpredictable Market Shocks", "tldr": "\u501f\u52a9\u8bad\u7ec3\u671f\u5df2\u5b9e\u73b0\u7684\u5e02\u573a\u51b2\u51fb\uff0c\u6539\u5584\u91d1\u878d\u81ea\u76d1\u7763\u8868\u5f81\u4e0e\u98ce\u9669\u3001\u6d41\u52a8\u6027\u9884\u6d4b\u3002", "upvotes": 4, "what_it_is": "MC-JEPA\u7528\u5176\u4ed6\u8d44\u4ea7\u7684\u672a\u6765\u76ee\u6807\u5d4c\u5165\u6784\u9020\u7559\u4e00\u5e02\u573a\u6761\u4ef6\uff0c\u518d\u901a\u8fc7\u81ea\u8eab\u8868\u5f81\u751f\u6210\u7684\u56e0\u5b50\u8f7d\u8377\u878d\u5165\u9884\u6d4b\uff0c\u4f7f\u6a21\u578b\u540c\u65f6\u5b66\u4e60\u5e02\u573a\u66b4\u9732\u4e0e\u8d44\u4ea7\u7279\u6709\u6210\u5206\u3002", "why_notable": "\u5c06\u4e0d\u53ef\u9884\u6d4b\u7684\u5e02\u573a\u51b2\u51fb\u8f6c\u5316\u4e3a\u8bad\u7ec3\u4fe1\u53f7\uff0c\u5728\u98ce\u9669\u4e0e\u6d41\u52a8\u6027\u4efb\u52a1\u4e0a\u6536\u76ca\u5c24\u4e3a\u663e\u8457\uff1b\u65e0\u9700\u6807\u7b7e\u4e5f\u80fd\u5b66\u51fa\u63a5\u8fd1\u76d1\u7763\u63a2\u9488\u7684\u5e02\u573a\u8d1d\u5854\u6392\u5e8f\u3002"}, {"abstract": "Predicting long action chunks, often spanning dozens of timesteps, has become a key ingredient in increasingly capable robot policies. In this paper, we find that adapting these long-chunk policies with existing reinforcement learning (RL) methods can require many online samples due to the high dimensionality of the action chunks being optimized, making such adaptation impractical in real-world scenarios where interaction data are costly to collect. Our key insight is to shift adaptation from optimizing actions to optimizing how long to execute each predicted action chunk. This keeps the adaptation space low-dimensional while its expressivity grows with the chunk size. We thus introduce Execution at the Right Length (ExRL), a simple approach which augments the base policy with a lightweight adapter that predicts the execution length of each chunk and is trained using off-policy RL algorithms. Across simulation benchmarks and real-world robotic tasks, ExRL enables sample-efficient adaptation of a diverse range of long-chunk policies with minimal task-specific hyperparameter tuning.", "arxiv_id": "2611.13482", "arxiv_url": "https://arxiv.org/abs/2611.13482", "authors": ["Xu Luo", "Jiaying Yang", "Hao Wu", "Junlin Xie", "Zijin Hong", "Ji Zhang", "Lianli Gao", "Jingkuan Song"], "brief": "ExRL\u4e3a\u57fa\u7840\u7b56\u7565\u589e\u6dfb\u8f7b\u91cf\u9002\u914d\u5668\uff0c\u7528\u79bb\u7b56\u7565\u5f3a\u5316\u5b66\u4e60\u9884\u6d4b\u6bcf\u4e2a\u52a8\u4f5c\u5757\u6267\u884c\u591a\u4e45\u3002\u5b83\u4e0d\u76f4\u63a5\u4f18\u5316\u9ad8\u7ef4\u52a8\u4f5c\u5e8f\u5217\uff0c\u800c\u662f\u5728\u4f4e\u7ef4\u6267\u884c\u65f6\u957f\u7a7a\u95f4\u4e2d\u5b8c\u6210\u5728\u7ebf\u9002\u914d\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/Frankluox/ExRL", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.13482", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["ExRL\u5c06\u4f18\u5316\u76ee\u6807\u4ece\u52a8\u4f5c\u5e8f\u5217\u6539\u4e3a\u6267\u884c\u957f\u5ea6", "\u8f7b\u91cf\u9002\u914d\u5668\u901a\u8fc7\u79bb\u7b56\u7565\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3", "\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u9a8c\u8bc1\u591a\u7c7b\u957f\u52a8\u4f5c\u5757\u7b56\u7565"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u5728\u7ebf\u9002\u914d", "\u52a8\u4f5c\u5206\u5757"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13482v1", "published_at": "2026-11-10", "score": 0.234, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13482.png", "title": "ExRL: Sample-Efficient Online Adaptation of Long-Chunk Policies via Execution Length Control", "tldr": "\u901a\u8fc7\u5b66\u4e60\u52a8\u4f5c\u5757\u6267\u884c\u65f6\u957f\uff0c\u964d\u4f4e\u673a\u5668\u4eba\u957f\u52a8\u4f5c\u5757\u7b56\u7565\u5728\u7ebf\u9002\u914d\u7684\u6570\u636e\u6210\u672c\u3002", "upvotes": 4, "what_it_is": "ExRL\u4e3a\u57fa\u7840\u7b56\u7565\u589e\u6dfb\u8f7b\u91cf\u9002\u914d\u5668\uff0c\u7528\u79bb\u7b56\u7565\u5f3a\u5316\u5b66\u4e60\u9884\u6d4b\u6bcf\u4e2a\u52a8\u4f5c\u5757\u6267\u884c\u591a\u4e45\u3002\u5b83\u4e0d\u76f4\u63a5\u4f18\u5316\u9ad8\u7ef4\u52a8\u4f5c\u5e8f\u5217\uff0c\u800c\u662f\u5728\u4f4e\u7ef4\u6267\u884c\u65f6\u957f\u7a7a\u95f4\u4e2d\u5b8c\u6210\u5728\u7ebf\u9002\u914d\u3002", "why_notable": "\u5b83\u628a\u957f\u52a8\u4f5c\u5757\u7684\u5728\u7ebf\u9002\u914d\u8f6c\u5316\u4e3a\u4f4e\u7ef4\u63a7\u5236\u95ee\u9898\uff0c\u5728\u4ea4\u4e92\u6570\u636e\u6602\u8d35\u7684\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u63d0\u9ad8\u6837\u672c\u6548\u7387\uff0c\u5e76\u51cf\u5c11\u4efb\u52a1\u4e13\u5c5e\u8c03\u53c2\u3002"}, {"abstract": "Interpretability demonstrations often show that intervening on a group of neurons changes a model\u0027s answer. A recent example removes an 18-neuron group in Qwen3-32B and the model answers \"Simba\" instead of \"Scar\" to a two-hop Lion King riddle. Such a demonstration establishes that the group matters, but not how much of it is necessary, whether other groups could do the same, or whether the effect carries over to other inputs. We ask: when intervening on a group of neurons changes a model\u0027s answer, how much of that group is actually necessary? For every selected group we measure all 4,096 subsets of 12 MLP neurons. On a two-alternative capital task (Qwen3-0.6B), zero-ablating 12 selected neurons lowers the answer margin by 27% while random neurons barely change it, yet replacing the same neurons with their values from other questions also barely changes it: their activations are nearly constant across questions, and we find no evidence that they carry question-specific content. On two-hop relation chains, patching 12 neurons with activations from the first-hop question shifts the answer to the bridge entity (from Scar to Simba): the greedy answer starts with the bridge in 9/11 chains for Qwen3-1.7B, 9/11 for Llama-3.2-1B and 8/10 for Gemma-3-1B; random neurons never do. The full group is rarely necessary: a few neurons often suffice, and in many chains disjoint subsets each flip the answer on their own, in an exploratory analysis most often when the model is less confident. Group effects transfer to rephrasings of the same chain but are much weaker on other tested chains. We study neuron-level causal interventions and alternative subsets; we do not recover the full connectivity of circuits.", "arxiv_id": "2611.13885", "arxiv_url": "https://arxiv.org/abs/2611.13885", "authors": ["\u00d6mer Tekin Yavuz"], "brief": "\u7814\u7a76\u795e\u7ecf\u5143\u5e72\u9884\u662f\u5426\u5fc5\u8981\u3001\u552f\u4e00\u4e14\u53ef\u8fc1\u79fb\u3002\u5bf9\u6bcf\u7ec4\u9009\u5b9a\u768412\u4e2aMLP\u795e\u7ecf\u5143\u7a77\u4e3e4096\u4e2a\u5b50\u96c6\uff0c\u901a\u8fc7\u6e05\u96f6\u548c\u6fc0\u6d3b\u66ff\u6362\uff0c\u6bd4\u8f83\u7b54\u6848\u53d8\u5316\u4e0e\u8de8\u8f93\u5165\u6548\u679c\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/omtekyav/causal-neuron-circuits", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13885", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9996\u90fd\u4efb\u52a1\u6e05\u96f612\u4e2a\u795e\u7ecf\u5143\u4f7f\u7b54\u6848\u8fb9\u9645\u964d27%\uff0c\u8de8\u9898\u6fc0\u6d3b\u66ff\u6362\u51e0\u4e4e\u65e0\u6548", "\u4e24\u8df3\u6fc0\u6d3b\u66ff\u6362\uff1aQwen\u4e0eLlama\u57479/11\u6761\u94fe\u8f6c\u5411\u6865\u63a5\u5b9e\u4f53", "4096\u5b50\u96c6\u7a77\u4e3e\u663e\u793a\u5c11\u91cf\u6216\u4e0d\u76f8\u4ea4\u5b50\u96c6\u53ef\u72ec\u7acb\u7ffb\u8f6c\u7b54\u6848"], "keywords": ["\u56e0\u679c\u53ef\u89e3\u91ca\u6027", "\u795e\u7ecf\u5143\u6d88\u878d", "\u6fc0\u6d3b\u66ff\u6362", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13885v1", "published_at": "2026-11-10", "score": 0.232, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13885.png", "title": "Are Causal Neuron Circuits Unique and Transferable?", "tldr": "\u7a77\u4e3e\u795e\u7ecf\u5143\u5b50\u96c6\u53d1\u73b0\uff0c\u6539\u5199\u7b54\u6848\u7684\u56e0\u679c\u5e72\u9884\u5e38\u6709\u591a\u79cd\u66ff\u4ee3\u7ec4\u5408\uff0c\u8de8\u9898\u8fc1\u79fb\u6709\u9650\u3002", "upvotes": 5, "what_it_is": "\u7814\u7a76\u795e\u7ecf\u5143\u5e72\u9884\u662f\u5426\u5fc5\u8981\u3001\u552f\u4e00\u4e14\u53ef\u8fc1\u79fb\u3002\u5bf9\u6bcf\u7ec4\u9009\u5b9a\u768412\u4e2aMLP\u795e\u7ecf\u5143\u7a77\u4e3e4096\u4e2a\u5b50\u96c6\uff0c\u901a\u8fc7\u6e05\u96f6\u548c\u6fc0\u6d3b\u66ff\u6362\uff0c\u6bd4\u8f83\u7b54\u6848\u53d8\u5316\u4e0e\u8de8\u8f93\u5165\u6548\u679c\u3002", "why_notable": "\u5c06\u201c\u5e72\u9884\u6709\u6548\u201d\u4e0e\u201c\u627f\u8f7d\u9898\u76ee\u5185\u5bb9\u3001\u5fc5\u8981\u4e14\u552f\u4e00\u201d\u533a\u5206\u5f00\u6765\uff0c\u4e3a\u56e0\u679c\u53ef\u89e3\u91ca\u6027\u63d0\u4f9b\u66f4\u4e25\u683c\u7684\u68c0\u9a8c\uff0c\u5e76\u63ed\u793a\u540c\u9898\u6539\u5199\u4e4b\u5916\u7684\u8fc1\u79fb\u5c40\u9650\u3002"}, {"abstract": "Under a fixed frame budget, video understanding with vision-language models (VLMs) depends on whether the sampled frames provide sufficient evidence for the question. Sufficient frame evidence supports direct answering, whereas less informative observations may benefit from reasoning that connects the available cues. We introduce EVAThink, which enhances video understanding through evidence sufficiency-guided training for adaptive thinking. First, Recoverable Evidence Gap Mining constructs evidence-dense and evidence-sparse video views that share the same question and answer under an identical frame budget. It retains pairs where sparse views yield lower direct-answer accuracy than dense views but benefit from explicit reasoning, providing supervision for response-mode selection. Second, Evidence-Guided Two-Stage Reinforcement Learning uses stage-specific rewards to guide training with evidence-based mode preferences and then refine response efficiency, while first-token advantage regularization mitigates mode collapse. Trained on only 6.7K curated samples, EVAThink consistently improves upon the base model across video understanding benchmarks under both 32- and 64-frame budgets, while outperforming strong baselines on average. The code, model, and datasets are available at \\href{https://github.com/ChangtiWu/EVAThink}{EVAThink}.", "arxiv_id": "2611.13907", "arxiv_url": "https://arxiv.org/abs/2611.13907", "authors": ["Changti Wu", "Ruizhe Fan", "Bin Wang", "Lei Zhang", "Yuxiang Zhang"], "brief": "EVAThink\u5728\u76f8\u540c\u5e27\u9884\u7b97\u4e0b\u6784\u9020\u8bc1\u636e\u7a20\u5bc6\u4e0e\u7a00\u758f\u7684\u89c6\u9891\u914d\u5bf9\uff0c\u7b5b\u9009\u53ef\u7531\u63a8\u7406\u5f25\u8865\u7684\u8bc1\u636e\u7f3a\u53e3\uff0c\u518d\u7528\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4f5c\u7b54\u6a21\u5f0f\u9009\u62e9\u4e0e\u54cd\u5e94\u6548\u7387\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ChangtiWu/EVAThink", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.13907", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53ef\u6062\u590d\u8bc1\u636e\u7f3a\u53e3\u6316\u6398\u7b5b\u9009\u63a8\u7406\u80fd\u6539\u5584\u4f5c\u7b54\u7684\u914d\u5bf9", "\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\u9996\u8bcd\u4f18\u52bf\u6b63\u5219\uff0c\u7f13\u89e3\u6a21\u5f0f\u574d\u584c", "\u4ec5\u75286.7K\u6837\u672c\uff0c\u572832\u4e0e64\u5e27\u9884\u7b97\u4e0b\u5747\u83b7\u63d0\u5347"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u81ea\u9002\u5e94\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13907v1", "published_at": "2026-11-10", "score": 0.226, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13907.png", "title": "EVAThink: Evidence Sufficiency-Guided Training for Adaptive Thinking in Video Understanding", "tldr": "\u4f9d\u636e\u91c7\u6837\u5e27\u7684\u8bc1\u636e\u5145\u5206\u6027\u8bad\u7ec3\u89c6\u9891\u6a21\u578b\uff0c\u81ea\u9002\u5e94\u9009\u62e9\u76f4\u63a5\u4f5c\u7b54\u6216\u663e\u5f0f\u63a8\u7406\u3002", "upvotes": 3, "what_it_is": "EVAThink\u5728\u76f8\u540c\u5e27\u9884\u7b97\u4e0b\u6784\u9020\u8bc1\u636e\u7a20\u5bc6\u4e0e\u7a00\u758f\u7684\u89c6\u9891\u914d\u5bf9\uff0c\u7b5b\u9009\u53ef\u7531\u63a8\u7406\u5f25\u8865\u7684\u8bc1\u636e\u7f3a\u53e3\uff0c\u518d\u7528\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4f5c\u7b54\u6a21\u5f0f\u9009\u62e9\u4e0e\u54cd\u5e94\u6548\u7387\u3002", "why_notable": "\u5c06\u662f\u5426\u63a8\u7406\u4e0e\u89c6\u89c9\u8bc1\u636e\u5145\u5206\u6027\u6302\u94a9\uff0c\u800c\u975e\u4e00\u5f8b\u5ef6\u957f\u601d\u8003\uff1b\u4ee5\u5c11\u91cf\u8bad\u7ec3\u6837\u672c\u6539\u5584\u56fa\u5b9a\u5e27\u9884\u7b97\u4e0b\u7684\u89c6\u9891\u7406\u89e3\uff0c\u5e73\u5747\u8868\u73b0\u8d85\u8fc7\u5f3a\u57fa\u7ebf\u3002"}, {"abstract": "LiDAR point clouds and 3D semantic occupancy represent two distinct modalities capturing fine-grained metric geometry and dense volumetric semantics, respectively, holding natural potential for mutual complementarity. However, existing world models typically forecast these modalities independently or cascade them heuristically, missing the opportunity for reciprocal cross-modal regularization. To address this, we propose \\textbf{LO-World}, a unified 4D world model that forecasts both modalities within a shared BEV latent space. This single-stream formulation enables dense semantics and metric geometry to mutually reinforce each other, while eliminating multi-pipeline redundancy. Specifically, LO-World couples an efficient hybrid range-voxel autoencoder with a flow-matching generator that caches historical context to reduce iterative sampling latency. Extensive experiments demonstrate that LO-World outperforms prior state-of-the-art baselines, improving occupancy forecasting IoU by 10.9% and reducing LiDAR Chamfer Distance by 30.1%. Meanwhile, it sustains a real-time throughput exceeding $25$~FPS on a single RTX 4090. Our code is available at https://github.com/lzzzzzm/LO-World.", "arxiv_id": "2611.11912", "arxiv_url": "https://arxiv.org/abs/2611.11912", "authors": ["Zhimin Liao", "Ping Wei", "Kai Mao", "Shuaijia Chen"], "brief": "LO-World\u5c06\u56db\u7ef4\u8bed\u4e49\u5360\u636e\u4e0e\u6fc0\u5149\u70b9\u4e91\u9884\u6d4b\u7edf\u4e00\u5230\u5171\u4eabBEV\u6f5c\u7a7a\u95f4\uff0c\u4ee5\u6df7\u5408\u8ddd\u79bb\u56fe\u2014\u4f53\u7d20\u81ea\u7f16\u7801\u5668\u548c\u6d41\u5339\u914d\u751f\u6210\u5668\u5efa\u6a21\uff0c\u8ba9\u51e0\u4f55\u4e0e\u8bed\u4e49\u76f8\u4e92\u7ea6\u675f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/lzzzzzm/LO-World", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.11912", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5171\u4eabBEV\u6f5c\u7a7a\u95f4\u5355\u6d41\u9884\u6d4b\uff0c\u51cf\u5c11\u591a\u7ba1\u7ebf\u5197\u4f59", "\u5360\u636eIoU\u63d0\u534710.9%\uff0c\u70b9\u4e91\u5012\u89d2\u8ddd\u79bb\u964d\u4f4e30.1%", "\u6d41\u5339\u914d\u751f\u6210\u5668\u7f13\u5b58\u5386\u53f2\uff0c\u5355\u5f20RTX 4090\u8d85\u8fc725 FPS"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5360\u636e\u9884\u6d4b", "\u6fc0\u5149\u96f7\u8fbe", "\u591a\u6a21\u6001\u878d\u5408"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.11912v1", "published_at": "2026-11-09", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11912.png", "title": "LO-World: Unified BEV Latent Modeling for Joint 4D Occupancy and LiDAR Forecasting", "tldr": "\u5728\u5171\u4eab\u9e1f\u77b0\u6f5c\u7a7a\u95f4\u8054\u5408\u9884\u6d4b\u5360\u636e\u4e0e\u6fc0\u5149\u70b9\u4e91\uff0c\u517c\u987e\u7cbe\u5ea6\u63d0\u5347\u548c\u5b9e\u65f6\u63a8\u7406\u3002", "upvotes": 1, "what_it_is": "LO-World\u5c06\u56db\u7ef4\u8bed\u4e49\u5360\u636e\u4e0e\u6fc0\u5149\u70b9\u4e91\u9884\u6d4b\u7edf\u4e00\u5230\u5171\u4eabBEV\u6f5c\u7a7a\u95f4\uff0c\u4ee5\u6df7\u5408\u8ddd\u79bb\u56fe\u2014\u4f53\u7d20\u81ea\u7f16\u7801\u5668\u548c\u6d41\u5339\u914d\u751f\u6210\u5668\u5efa\u6a21\uff0c\u8ba9\u51e0\u4f55\u4e0e\u8bed\u4e49\u76f8\u4e92\u7ea6\u675f\u3002", "why_notable": "\u5c06\u7a20\u5bc6\u8bed\u4e49\u4e0e\u7cbe\u7ec6\u51e0\u4f55\u7684\u4e92\u8865\u6027\u843d\u5b9e\u4e3a\u8054\u5408\u751f\u6210\u673a\u5236\uff0c\u540c\u65f6\u63d0\u5347\u4e24\u7c7b\u9884\u6d4b\u6307\u6807\u5e76\u8fbe\u5230\u5b9e\u65f6\u541e\u5410\uff0c\u4e3a\u81ea\u52a8\u9a7e\u9a76\u4e16\u754c\u6a21\u578b\u63d0\u4f9b\u9ad8\u6548\u8def\u7ebf\u3002"}, {"abstract": "Flow-matching models can produce high-quality image restorations, but their learned dynamics may amplify small input perturbations and make reconstructions unstable. We introduce LipsFlower to reduce this amplification. We derive stability bounds for Flow-from-$Y$, which initializes the ordinary differential equation from a noise-perturbed observation, as well as for observation-conditioned posterior sampling, which conditions the velocity field on the observation throughout integration. Based on this analysis, we develop LipHDiT, a Lipschitz-aware hourglass diffusion transformer that serves as the vector-field architecture of LipsFlower. LipHDiT incorporates stabilized approximate spectral normalization, bounded modulation, and convex residual mixing. We also use adversarial finite-radius gain regularization at sampled interpolation states to penalize excessive sensitivity to the state and, for conditional sampling, the observation. We test both formulations on blind face restoration, measuring adversarial robustness and the perceptual quality of the reconstructions. LipsFlower reduces perturbation amplification while keeping restoration quality competitive with the evaluated baselines. These results suggest that Lipschitz-aware flow matching can improve the stability of generative image restoration.", "arxiv_id": "2611.13995", "arxiv_url": "https://arxiv.org/abs/2611.13995", "authors": ["Sedjro Salomon Hotegni", "Konstantin Sonntag", "Paul-Christian B\u00fcrkner", "Sebastian Peitz"], "brief": "\u63d0\u51fa\u56fe\u50cf\u4fee\u590d\u6a21\u578bLipsFlower\uff0c\u4e3a\u4e24\u7c7b\u6d41\u5339\u914d\u65b9\u6848\u63a8\u5bfc\u7a33\u5b9a\u6027\u754c\uff0c\u5e76\u7ed3\u5408\u5177\u5907Lipschitz\u7ea6\u675f\u7684\u901f\u5ea6\u573a\u67b6\u6784\u4e0e\u5bf9\u6297\u589e\u76ca\u6b63\u5219\uff0c\u63a7\u5236\u6270\u52a8\u4f20\u64ad\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13995", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e3aFlow-from-Y\u4e0e\u89c2\u6d4b\u6761\u4ef6\u540e\u9a8c\u91c7\u6837\u63a8\u5bfc\u7a33\u5b9a\u6027\u754c", "LipHDiT\u7ed3\u5408\u8c31\u5f52\u4e00\u5316\u3001\u6709\u754c\u8c03\u5236\u4e0e\u51f8\u6b8b\u5dee\u6df7\u5408", "\u5bf9\u6297\u6709\u9650\u534a\u5f84\u589e\u76ca\u6b63\u5219\u6291\u5236\u72b6\u6001\u53ca\u89c2\u6d4b\u654f\u611f\u5ea6"], "keywords": ["\u6d41\u5339\u914d", "\u56fe\u50cf\u4fee\u590d", "\u5bf9\u6297\u9c81\u68d2\u6027", "\u7a33\u5b9a\u6027"], "num_comments": 2, "on_hf": true, "organization": "Universit\u00e4t Paderborn", "pdf_url": "https://arxiv.org/pdf/2611.13995v1", "published_at": "2026-11-10", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13995.png", "title": "Lipschitz-Controlled Flow Matching for Robust Image Restoration", "tldr": "\u901a\u8fc7\u7ea6\u675f\u6d41\u5339\u914d\u52a8\u529b\u5b66\u7684\u654f\u611f\u5ea6\uff0c\u964d\u4f4e\u56fe\u50cf\u4fee\u590d\u4e2d\u7684\u6270\u52a8\u653e\u5927\u5e76\u4fdd\u6301\u611f\u77e5\u8d28\u91cf\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u56fe\u50cf\u4fee\u590d\u6a21\u578bLipsFlower\uff0c\u4e3a\u4e24\u7c7b\u6d41\u5339\u914d\u65b9\u6848\u63a8\u5bfc\u7a33\u5b9a\u6027\u754c\uff0c\u5e76\u7ed3\u5408\u5177\u5907Lipschitz\u7ea6\u675f\u7684\u901f\u5ea6\u573a\u67b6\u6784\u4e0e\u5bf9\u6297\u589e\u76ca\u6b63\u5219\uff0c\u63a7\u5236\u6270\u52a8\u4f20\u64ad\u3002", "why_notable": "\u5c06\u7a33\u5b9a\u6027\u5206\u6790\u843d\u5b9e\u5230\u7f51\u7edc\u67b6\u6784\u548c\u8bad\u7ec3\u7ea6\u675f\uff1b\u76f2\u4eba\u8138\u4fee\u590d\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u80fd\u51cf\u5c11\u6270\u52a8\u653e\u5927\uff0c\u540c\u65f6\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u611f\u77e5\u8d28\u91cf\u3002"}, {"abstract": "Automated segmentation in multi-view echocardiography is essential for comprehensive cardiac assessment, yet remains challenging due to substantial anatomical and appearance variability across standard acoustic windows. In this paper, we present P2Echo, a unified framework capable of segmenting diverse cardiac structures across multiple standard echocardiographic views using a single model controlled by structured view-aware text prompts. Unlike recent foundation model adaptations that rely on implicit latent priors, P2Echo explicitly conditions the segmentation process via a novel Dynamic Image-Text Alignment (DyITA) module. DyITA integrates a differentiable routing mechanism and token differential operators to dynamically modulate decoder features according to the requested view and target structure. This allows the network to adaptively switch its processing pathways for different views without architectural changes. Extensive experiments on a large-scale internal dataset (seen during training) and held-out evaluation on three external datasets demonstrate that P2Echo matches or exceeds both view-specific specialists and state-of-the-art universal models at a fraction of their computational cost, offering an efficient, controllable solution for multi-plane cardiac analysis. Code is available at: https://github.com/moeinheidari7829/P2Echo.", "arxiv_id": "2611.13425", "arxiv_url": "https://arxiv.org/abs/2611.13425", "authors": ["Moein Heidari", "Alvin Kimbowa", "Mahdi Tabatabaei", "Afshin Bozorgpour", "Sina Ghorbani Kolahi", "River Jiang", "Wenjin Chen", "David J. Foran", "Jasmine Grewal", "Dorit Merhof", "Ilker Hacihaliloglu"], "brief": "P2Echo\u7528\u7ed3\u6784\u5316\u6587\u672c\u6307\u5b9a\u8d85\u58f0\u89c6\u56fe\u4e0e\u76ee\u6807\u7ed3\u6784\uff0c\u7edf\u4e00\u5b8c\u6210\u591a\u89c6\u56fe\u5206\u5272\u3002\u6838\u5fc3DyITA\u6a21\u5757\u7ed3\u5408\u53ef\u5fae\u8def\u7531\u4e0e\u8bcd\u5143\u5dee\u5206\u7b97\u5b50\uff0c\u52a8\u6001\u8c03\u8282\u89e3\u7801\u5668\u7279\u5f81\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/moeinheidari7829/P2Echo", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.13425", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["DyITA\u663e\u5f0f\u5bf9\u9f50\u56fe\u50cf\u4e0e\u6587\u672c\uff0c\u6309\u89c6\u56fe\u548c\u7ed3\u6784\u8c03\u8282\u7279\u5f81", "\u53ef\u5fae\u8def\u7531\u4e0e\u8bcd\u5143\u5dee\u5206\u7b97\u5b50\u652f\u6301\u65e0\u67b6\u6784\u6539\u52a8\u7684\u8def\u5f84\u5207\u6362", "\u5728\u5185\u90e8\u6570\u636e\u53ca3\u4e2a\u5916\u90e8\u6570\u636e\u96c6\u4e0a\u5ab2\u7f8e\u6216\u8d85\u8d8a\u4e13\u7528\u4e0e\u901a\u7528\u6a21\u578b"], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u5fc3\u810f\u8d85\u58f0", "\u6587\u672c\u5f15\u5bfc", "\u591a\u6a21\u6001\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "University of British Columbia", "pdf_url": "https://arxiv.org/pdf/2611.13425v1", "published_at": "2026-11-10", "score": 0.206, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13425.png", "title": "Prompt2Echo (P2Echo): Text-Prompted Multi-View Echocardiography Segmentation with One Model", "tldr": "\u4ee5\u89c6\u56fe\u611f\u77e5\u6587\u672c\u63d0\u793a\u63a7\u5236\u5355\u4e00\u6a21\u578b\uff0c\u5b9e\u73b0\u591a\u89c6\u56fe\u5fc3\u810f\u8d85\u58f0\u7ed3\u6784\u7684\u9ad8\u6548\u5206\u5272\u3002", "upvotes": 1, "what_it_is": "P2Echo\u7528\u7ed3\u6784\u5316\u6587\u672c\u6307\u5b9a\u8d85\u58f0\u89c6\u56fe\u4e0e\u76ee\u6807\u7ed3\u6784\uff0c\u7edf\u4e00\u5b8c\u6210\u591a\u89c6\u56fe\u5206\u5272\u3002\u6838\u5fc3DyITA\u6a21\u5757\u7ed3\u5408\u53ef\u5fae\u8def\u7531\u4e0e\u8bcd\u5143\u5dee\u5206\u7b97\u5b50\uff0c\u52a8\u6001\u8c03\u8282\u89e3\u7801\u5668\u7279\u5f81\u3002", "why_notable": "\u5c06\u4e0d\u540c\u8d85\u58f0\u89c6\u56fe\u7684\u5206\u5272\u80fd\u529b\u6574\u5408\u5230\u4e00\u4e2a\u53ef\u63a7\u6a21\u578b\u4e2d\uff0c\u4ee5\u66f4\u4f4e\u8ba1\u7b97\u6210\u672c\u4fdd\u6301\u7ade\u4e89\u529b\uff0c\u4e3a\u591a\u5207\u9762\u5fc3\u810f\u5206\u6790\u63d0\u4f9b\u9ad8\u6548\u65b9\u6848\u3002"}, {"abstract": "Generation, imputation, and prediction query different aspects of the same tabular distribution, but are usually evaluated separately. This leaves unclear which capabilities they share, how their training objectives interact, and whether one model can perform all three well. We introduce the One Table Benchmark (\\ours{}), spanning 56 datasets, 46 registered methods, and 20 capability axes under aligned data splits and explicit task contracts. We compare task ranks on aligned support, train five backbones under all seven non-empty objective combinations on five datasets with three seeds, and contrast fixed-model profiles with specialist portfolios. Rank comparisons connect imputation and prediction through numerical recovery and dependence preservation, and link generation to both through predictive utility; distributional fidelity follows different, sometimes opposing, rankings. Objective interventions show the largest pooled gains from including the recipient\u0027s own objective. Generation has the broadest coverage of positive pooled auxiliary effects, while prediction shows potential to improve imputation and synthetic-data utility, with responses that vary across backbones. Cross-addition effects reveal that objective benefits need not add and depend on the objectives already present. Fixed-model comparisons expose corresponding utility--fidelity trade-offs: some generalists surpass specialist portfolios on utility, while fidelity continues to favor specialization. Frozen foundation models show strong prediction and numerical point imputation, together with promising synthetic-data utility, highlighting their potential across all three tasks. These findings motivate unified tabular models that share useful conditional information while improving categorical reconstruction and faithful joint sampling.", "arxiv_id": "2611.13001", "arxiv_url": "https://arxiv.org/abs/2611.13001", "authors": ["Yuanrui Wang", "Kaifang Li", "Xuanyue Li", "Ziyun Li", "Yan Lu", "Xingxuan Zhang", "Peng Cui"], "brief": "\u63d0\u51fa\u7edf\u4e00\u8868\u683c\u6a21\u578b\u57fa\u51c6\uff0c\u5728\u5bf9\u9f50\u7684\u6570\u636e\u5212\u5206\u4e0e\u4efb\u52a1\u7ea6\u5b9a\u4e0b\u6bd4\u8f83\u751f\u6210\u3001\u8865\u5168\u548c\u9884\u6d4b\uff1b\u901a\u8fc7\u8bad\u7ec3\u76ee\u6807\u7ec4\u5408\u5b9e\u9a8c\uff0c\u68c0\u9a8c\u8de8\u4efb\u52a1\u80fd\u529b\u5173\u8054\u53ca\u901a\u7528\u6a21\u578b\u4e0e\u4e13\u7528\u6a21\u578b\u7ec4\u5408\u7684\u5dee\u5f02\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/limix-ldm-ai/OTBench", "github_stars": 91a\u76ee\u6807\u6536\u76ca\u5e76\u975e\u7b80\u5355\u53e0\u52a0\uff0c\u4e3a\u7edf\u4e00\u6a21\u578b\u5982\u4f55\u5171\u4eab\u6761\u4ef6\u4fe1\u606f\u3001\u517c\u987e\u6548\u7528\u4e0e\u4fdd\u771f\u5ea6\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "We present TorchCurves, a PyTorch library that treats vector-valued parametric curves as learnable primitives. Its central operation maps batches of scalar inputs to points on curves represented in B-spline or Legendre polynomial bases, with differentiation through both inputs and coefficients. Curve coefficients can be optimized jointly with the surrounding model or produced by another network. The library provides trainable modules, reusable basis modules, and a functional interface, supporting applications ranging from continuous feature embeddings to Kolmogorov-Arnold networks and functional regression. Its implementation combines classical evaluation algorithms with vectorized PyTorch operations, emphasizing readability and maintainability without custom hardware kernels. Timing experiments compare curve evaluation against NumPy and SciPy and KAN training against EfficientKAN across a range of problem sizes. The results illustrate where this generality remains computationally practical and where overhead is substantial. Library is available on GitHub at https://github.com/alexshtf/torchcurves.", "arxiv_id": "2611.14516", "arxiv_url": "https://arxiv.org/abs/2611.14516", "authors": ["Alex Shtoff"], "brief": "TorchCurves\u662f\u4e00\u4e2aPyTorch\u5e93\uff0c\u7528B\u6837\u6761\u6216Legendre\u591a\u9879\u5f0f\u8868\u793a\u5411\u91cf\u503c\u66f2\u7ebf\uff0c\u5c06\u6279\u91cf\u6807\u91cf\u6620\u5c04\u4e3a\u66f2\u7ebf\u70b9\uff0c\u5e76\u652f\u6301\u8f93\u5165\u4e0e\u7cfb\u6570\u7684\u68af\u5ea6\u4f20\u64ad\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": "https://github.com/alexshtf/torchcurves", "github_stars": 72, "hf_url": "https://huggingface.co/papers/2611.14516", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u66f2\u7ebf\u7cfb\u6570\u53ef\u8054\u5408\u8bad\u7ec3\uff0c\u4e5f\u53ef\u7531\u53e6\u4e00\u7f51\u7edc\u751f\u6210", "\u63d0\u4f9b\u53ef\u8bad\u7ec3\u6a21\u5757\u3001\u57fa\u51fd\u6570\u6a21\u5757\u53ca\u51fd\u6570\u5f0f\u63a5\u53e3", "\u5bf9\u6bd4NumPy\u3001SciPy\u6c42\u503c\u53caEfficientKAN\u8bad\u7ec3"], "keywords": ["\u53c2\u6570\u66f2\u7ebf", "\u53ef\u5fae\u7f16\u7a0b", "\u6837\u6761", "\u795e\u7ecf\u7f51\u7edc"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14516v1", "published_at": "2026-11-10", "score": 0.198, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14516.png", "title": "TorchCurves: Differentiable Parametric Curves", "tldr": "\u5c06\u53c2\u6570\u66f2\u7ebf\u53d8\u4e3a\u53ef\u5b66\u4e60\u6a21\u5757\uff0c\u652f\u6301\u8f93\u5165\u4e0e\u7cfb\u6570\u6c42\u5bfc\u5e76\u878d\u5165\u795e\u7ecf\u7f51\u7edc\u3002", "upvotes": 2, "what_it_is": "TorchCurves\u662f\u4e00\u4e2aPyTorch\u5e93\uff0c\u7528B\u6837\u6761\u6216Legendre\u591a\u9879\u5f0f\u8868\u793a\u5411\u91cf\u503c\u66f2\u7ebf\uff0c\u5c06\u6279\u91cf\u6807\u91cf\u6620\u5c04\u4e3a\u66f2\u7ebf\u70b9\uff0c\u5e76\u652f\u6301\u8f93\u5165\u4e0e\u7cfb\u6570\u7684\u68af\u5ea6\u4f20\u64ad\u3002", "why_notable": "\u4e3a\u8fde\u7eed\u7279\u5f81\u5d4c\u5165\u3001KAN\u548c\u51fd\u6570\u56de\u5f52\u63d0\u4f9b\u53ef\u590d\u7528\u7684\u66f2\u7ebf\u7ec4\u4ef6\uff1b\u6027\u80fd\u5b9e\u9a8c\u4e5f\u63ed\u793a\u4e86\u901a\u7528\u5b9e\u73b0\u7684\u5b9e\u7528\u8303\u56f4\u4e0e\u5f00\u9500\u3002"}, {"abstract": "When two objects share a name, how much does their visual similarity explain, and what do the teaching examples add? First, we reanalyzed trial-level data from a large adult word-extension study (Lewis \u0026 Frank, 2018), computing each test image\u0027s distance to the examples shown in the space of a frozen self-supervised visual encoder (DINOv2). Distance was associated with extension (log odds -3.23 per standard deviation; 520 people), and an exploratory post hoc analysis suggested that this association persisted within the taught domain after controlling for taxonomic level and teaching condition. Example composition also mattered: after three examples, adults extended a word to 1.1% of superordinate items when the examples were subordinate and to 77.5% when they were superordinate. Second, in an artificial learner using the same encoder, words joining two categories were learned less accurately the farther apart the categories were (84.7%, 65.4%, and 53.0% naming accuracy for near, mid, and far pairs). The encoder\u0027s distances correlated with human similarity and confusability measures from three datasets (rho = .501-.795), but this representational alignment did not translate into conclusive evidence that human-derived distances predict learner difficulty, and a second encoder trained on one child\u0027s experience reproduced the tier ordering but not the pair-level effect. The secondary human data were analyzed under an internal plan fixed before the confirmatory analyses (not externally preregistered). Visual similarity accounts for part of how generalization is organized in both systems, while the composition of examples contributes what the distance we used does not capture.", "arxiv_id": "2611.14116", "arxiv_url": "https://arxiv.org/abs/2611.14116", "authors": ["Patricio M. Vera"], "brief": "\u7814\u7a76\u7528\u51bb\u7ed3\u7684\u81ea\u76d1\u7763\u89c6\u89c9\u7f16\u7801\u5668DINOv2\u91cd\u6790\u6210\u4eba\u8bcd\u4e49\u6269\u5c55\u6570\u636e\uff0c\u5e76\u8bad\u7ec3\u4eba\u5de5\u8bcd\u6c47\u5b66\u4e60\u8005\uff0c\u68c0\u9a8c\u89c6\u89c9\u8ddd\u79bb\u4e0e\u6559\u5b66\u6837\u4f8b\u5982\u4f55\u5f71\u54cd\u547d\u540d\u548c\u6cdb\u5316\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14116", "impact_score": 6, "is_agent": false, "
