hy_notable": null}, {"abstract": "Classical neural scaling laws model excess risk as a separable power law in model capacity $N$ and dataset size $D$. At finite budgets, however, empirical learning curves and compute-optimal allocations depart from this log-linear frontier. This paper analyzes how spectral and domain heterogeneity govern these finite-scale departures. Along the capacity axis, Mellin--Barnes analysis of covariance resolvents yields a three-term expansion where competing spectral and regularization modes produce finite-scale curvature and logarithmic transitions. Because fitting multiple power laws on narrow pilot grids is ill-conditioned, we eliminate the loss floor via first-order Aitken differencing to obtain a well-conditioned closed-form initializer. Along the data axis, KKT duality reduces $K$-domain mixing to scalar water-filling, yielding finite-budget bottleneck bounds, an online sampling curriculum, and a simplex Hessian metric for cross-domain transfer. Along the iso-compute frontier $C=6ND$, we prove that the optimal allocation exponent drifts in proportion to capacity and data exponent variances, while Schur-complement reduction separates intrinsic drift from frozen-hyperparameter bias. Across 45 operator spectra, Pythia (70M--12B), Chinchilla (245 runs), and RegMix (17 domains), our estimators achieve $5.89\\%$ holdout MAPE, cut high-compute allocation regret by up to $76.4\\%$, and reduce cross-scale mixture RMSE by $59.4\\%$ with zero selection regret.", "arxiv_id": "2611.13534", "arxiv_url": "https://arxiv.org/abs/2611.13534", "authors": ["Tianyu Zhao", "Zhixiang Ren"], "brief": "\u5206\u6790\u8c31\u4e0e\u9886\u57df\u5f02\u8d28\u6027\u5982\u4f55\u5bfc\u81f4\u6709\u9650\u9884\u7b97\u4e0b\u795e\u7ecf\u7f29\u653e\u5f8b\u504f\u79bb\u5e42\u5f8b\uff0c\u63d0\u51fa\u62df\u5408\u4e0e\u8d44\u6e90\u5206\u914d\u65b9\u6cd5\uff1b\u5b9e\u8bc1\u9884\u6d4b\u8bef\u5dee\u4e3a5.89%\uff0c\u9ad8\u7b97\u529b\u5206\u914d\u9057\u61be\u6700\u591a\u964d\u4f4e76.4%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13534", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u7f29\u653e\u5f8b", "\u8d44\u6e90\u5206\u914d", "\u6570\u636e\u6df7\u5408", "\u5b66\u4e60\u66f2\u7ebf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13534v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws", "tldr": "\u5206\u6790\u8c31\u4e0e\u9886\u57df\u5f02\u8d28\u6027\u5982\u4f55\u5bfc\u81f4\u6709\u9650\u9884\u7b97\u4e0b\u795e\u7ecf\u7f29\u653e\u5f8b\u504f\u79bb\u5e42\u5f8b\uff0c\u63d0\u51fa\u62df\u5408\u4e0e\u8d44\u6e90\u5206\u914d\u65b9\u6cd5\uff1b\u5b9e\u8bc1\u9884\u6d4b\u8bef\u5dee\u4e3a5.89%\uff0c\u9ad8\u7b97\u529b\u5206\u914d\u9057\u61be\u6700\u591a\u964d\u4f4e76.4%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Research agents achieve increasingly strong benchmark scores, yet these scores do not necessarily translate into reliable delivery in ongoing research projects. Many research-agent benchmarks emphasize standalone tasks and relatively self-contained workflows in clean or curated workspaces. However, researchers ask agents to complete one step within an ongoing project, where requests depend on earlier session decisions and workspaces contain unfinished files, outdated versions, and failed attempts. We introduce ARE-bench to evaluate whether research agents advance ongoing projects while respecting prior decisions and existing workspace state, grounded in real session context and in-progress workspaces. ARE-bench includes 75 tasks built on agent sessions and full workspaces from recruited researchers\u0027 own projects, spanning seven research stages, 33 requirements, and 150 sub-requirements, with 1,173 binary checklist items in total. Each task is anchored at a real user request, preserves its requirements, and summarizes the earlier requests still in effect as background. The complete workspace is replayed to that boundary without cleanup, preserving artifacts from earlier turns. Each checklist is compiled from an intent-aligned rubric and credits any valid solution. Across seven frontier models, the strongest passes every checklist item on only 66.2% of tasks, and Design and Execution rank among the hardest stages for every model. Three models pass about 69% of tasks when only delivery contracts and general norms are checked, but just 28.4% to 40.0% once historical and material or workspace requirements are also checked. Evaluating delivery without these contextual requirements can therefore overestimate research agents and mask differences between them.", "arxiv_id": "2611.14364", "arxiv_url": "https://arxiv.org/abs/2611.14364", "authors": ["Jiahang Lin", "Wanying Ren", "Wanghan Xu", "Huayu Sha", "Yang Shu", "Zhonghang Lu", "Chengjun Pan", "Yi Dong", "Shichun Liu", "Yuyang Hu", "Shihan Dou", "Honglin Guo", "Huijie Lv", "Pujun Zheng", "Zhe Sun", "Yuankai Ying", "Yiding Wang", "Jiahao Chen", "Zhixiong Yang", "Dingbo Yuan", "Yicheng Zou", "Zhecan Wang", "Guoxiu He", "Xiaoyu Xing", "Qi Zhang", "Tao Gui", "Xuanjing Huang"], "brief": "ARE-bench\u752875\u4e2a\u771f\u5b9e\u79d1\u7814\u4efb\u52a1\u53ca\u672a\u6e05\u7406\u5de5\u4f5c\u533a\u8bc4\u4f30\u667a\u80fd\u4f53\uff0c\u6700\u5f3a\u6a21\u578b\u4ec566.2%\u4efb\u52a1\u5b8c\u5168\u8fbe\u6807\uff0c\u5ffd\u7565\u5386\u53f2\u51b3\u7b56\u4e0e\u5de5\u4f5c\u533a\u7ea6\u675f\u4f1a\u9ad8\u4f30\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14364", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u7814\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u4e0a\u4e0b\u6587\u7406\u89e3", "\u5de5\u4f5c\u533a\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14364v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ARE-bench: Benchmarking Agents\u0027 Research Ability in Real-World Researcher Sessions and Workspaces", "tldr": "ARE-bench\u752875\u4e2a\u771f\u5b9e\u79d1\u7814\u4efb\u52a1\u53ca\u672a\u6e05\u7406\u5de5\u4f5c\u533a\u8bc4\u4f30\u667a\u80fd\u4f53\uff0c\u6700\u5f3a\u6a21\u578b\u4ec566.2%\u4efb\u52a1\u5b8c\u5168\u8fbe\u6807\uff0c\u5ffd\u7565\u5386\u53f2\u51b3\u7b56\u4e0e\u5de5\u4f5c\u533a\u7ea6\u675f\u4f1a\u9ad8\u4f30\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Variability in syntactic structure and parsing ambiguity are fundamental aspects of natural language which modern LLMs have to learn to deal with proficiently. Previous \"post-mortem\" studies have shown that fully trained Transformers indeed approximate canonical parsing algorithms such as inside-outside, but little is established theoretically about how this is actually learned. Here, we make a first step towards addressing this by studying the learning dynamics in synthetic context-free grammars with variable parse tree topology. The stagewise learning curves are fully interpretable, in the sense that all of the loss stages a) can be computed analytically, and b) can be clearly associated to the representation of a hidden latent tree variable, which allows to lift ambiguity and utilize information from wider contexts. By probing representations, we visualize the emergence of inside-outside computation across depth and during training: while during early stages local (bigram/trigram) information is used and involves only a few initial layers, gradually the Transformer develops an encoder-decoder structure where the most abstract latent information is encoded in the middle, and the latter half of the network is used to progressively refine the final token prediction. This organization of computation is reminiscent of findings in real-world LLMs, and importantly applies here to a synthetic model which allows full analytical control of the data statistics, thus opening the door to theoretical progress.", "arxiv_id": "2611.14221", "arxiv_url": "https://arxiv.org/abs/2611.14221", "authors": ["Jack T. Parley"], "brief": "\u7814\u7a76\u5408\u6210\u4e0a\u4e0b\u6587\u65e0\u5173\u6587\u6cd5\u4e0bTransformer\u7684\u5b66\u4e60\u52a8\u6001\uff0c\u89e3\u6790\u5404\u9636\u6bb5\u635f\u5931\u4e0e\u6f5c\u5728\u6811\u8868\u793a\uff0c\u53d1\u73b0\u6a21\u578b\u4ece\u5c40\u90e8\u7edf\u8ba1\u9010\u6b65\u6d8c\u73b0\u5185\u5916\u7b97\u6cd5\u53ca\u7f16\u7801\u5668\u2014\u89e3\u7801\u5668\u7ed3\u6784\u3002", "categories": ["cs.CL", "cond-mat.dis-nn"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14221", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u5b66\u4e60\u52a8\u6001", "\u53e5\u6cd5\u5206\u6790", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14221v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Stagewise and interpretable emergence of inside-outside computation in Transformer-based language models", "tldr": "\u7814\u7a76\u5408\u6210\u4e0a\u4e0b\u6587\u65e0\u5173\u6587\u6cd5\u4e0bTransformer\u7684\u5b66\u4e60\u52a8\u6001\uff0c\u89e3\u6790\u5404\u9636\u6bb5\u635f\u5931\u4e0e\u6f5c\u5728\u6811\u8868\u793a\uff0c\u53d1\u73b0\u6a21\u578b\u4ece\u5c40\u90e8\u7edf\u8ba1\u9010\u6b65\u6d8c\u73b0\u5185\u5916\u7b97\u6cd5\u53ca\u7f16\u7801\u5668\u2014\u89e3\u7801\u5668\u7ed3\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present Walrus, a unified 8B speech-and-audio foundation model handling speech recognition (including code-switching and multi-talker speech), speech-to-text and speech-to-speech translation, text-to-speech, emotion recognition, audio captioning, and general audio understanding. Our main contribution is not a new architecture but a data-centric training recipe; we use a standard decoder-only backbone initialized from Gemma 4, so that gains can be traced to the data. For speech generation, Walrus predicts low-bitrate discrete speech tokens, and a lightweight token-to-waveform decoder converts them into high-fidelity audio. The recipe is a three-stage data curriculum that moves from broad multilingual data to multi-talker, code-switching, and domain-specific data. At each stage, task-aware and dataset-aware weighting balances tasks with very different token budgets and protects core skills from forgetting. Trained on over 600M samples covering more than 20 tasks and 100 languages, Walrus leads on most multilingual, multi-talker, and code-switching ASR, speech translation, and audio understanding benchmarks, outperforming both open speech language models of comparable size and dedicated task-specific models. On most benchmarks, it even matches or surpasses the $4\\times$ larger Qwen3-Omni\u0027s performance. Results suggest that data engineering is a primary driver of quality in multi-task speech and audio modeling.", "arxiv_id": "2611.13689", "arxiv_url": "https://arxiv.org/abs/2611.13689", "authors": ["Alkis Koudounas", "Osamu Take", "Hayato Futami", "Quentin Jodelet", "Emiru Tsunoo"], "brief": "Walrus\u4ee5\u4e09\u9636\u6bb5\u6570\u636e\u8bfe\u7a0b\u8bad\u7ec3\u7edf\u4e00\u76848B\u8bed\u97f3\u97f3\u9891\u6a21\u578b\uff0c\u8986\u76d6\u767e\u79cd\u8bed\u8a00\u4e0e\u4e8c\u5341\u4f59\u9879\u4efb\u52a1\uff0c\u591a\u6570\u57fa\u51c6\u9886\u5148\u540c\u89c4\u6a21\u6a21\u578b\uff0c\u5e76\u5339\u654c\u6216\u8d85\u8d8a\u56db\u500d\u5927\u7684Qwen3-Omni\u3002", "categories": ["eess.AS", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13689", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u57fa\u7840\u6a21\u578b", "\u591a\u4efb\u52a1\u5b66\u4e60", "\u6570\u636e\u5de5\u7a0b", "\u591a\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13689v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Walrus Technical Report", "tldr": "Walrus\u4ee5\u4e09\u9636\u6bb5\u6570\u636e\u8bfe\u7a0b\u8bad\u7ec3\u7edf\u4e00\u76848B\u8bed\u97f3\u97f3\u9891\u6a21\u578b\uff0c\u8986\u76d6\u767e\u79cd\u8bed\u8a00\u4e0e\u4e8c\u5341\u4f59\u9879\u4efb\u52a1\uff0c\u591a\u6570\u57fa\u51c6\u9886\u5148\u540c\u89c4\u6a21\u6a21\u578b\uff0c\u5e76\u5339\u654c\u6216\u8d85\u8d8a\u56db\u500d\u5927\u7684Qwen3-Omni\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-augmented generation (RAG) is bottlenecked by the token budget of large language models: feeding long documents into the context window is expensive, while aggressive textual compression discards fine-grained information that is irreversibly lost in a one-dimensional token sequence. We argue that this bottleneck is not fundamental to information density but to the choice of compression \\emph{modality}. Modern visual encoders can pack the contents of a rendered text page into roughly a hundred visual tokens with little semantic loss, opening a new compression-fidelity tradeoff that purely textual methods cannot reach. We present \\textbf{OpticalRAG}, a framework that renders documents as page images, encodes them with a frozen vision encoder, and distills the retrieved visual tokens into as few as $16$ injected tokens before passing them to the LLM. Two ingredients make this work without expensive cross-modal training: (i) \\emph{Encoder-Bridged Retrieval}, which projects text-query states into the visual feature space of the frozen encoder, through a projection shared with the compressor, to retrieve visual tokens from a text query, with no contrastive training; and (ii) \\emph{Query-Driven Distillation}, a lightweight cross-attention compressor that condenses the retrieved visual tokens into a small set of query-conditioned prefix tokens. On LongBench-v2, BAMBOO, and LooGLE-v2, OpticalRAG achieves the best compression-aware accuracy (CAP) on all three benchmarks while injecting only $16$ tokens, and improves the closed-book Qwen2.5-7B-Instruct backbone by $5.17$ points on LongBench-v2.Code is available at https://github.com/brighterr/OpticalRAG.", "arxiv_id": "2611.13675", "arxiv_url": "https://arxiv.org/abs/2611.13675", "authors": ["Senhao Liu", "Yuheng Zhang", "Chunyu Wei", "Yueguo Chen", "Xinran Zhang"], "brief": "OpticalRAG\u5c06\u6587\u6863\u8f6c\u4e3a\u56fe\u50cf\uff0c\u6309\u67e5\u8be2\u538b\u7f29\u4e3a16\u4e2a\u89c6\u89c9\u524d\u7f00\u8bcd\u5143\uff1b\u5728\u4e09\u4e2a\u957f\u6587\u672c\u57fa\u51c6\u4e0a\u538b\u7f29\u611f\u77e5\u51c6\u786e\u7387\u6700\u4f18\uff0c\u8f83\u65e0\u68c0\u7d22\u57fa\u5ea7\u63d0\u53475.17\u5206\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13675", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u591a\u6a21\u6001\u538b\u7f29", "\u957f\u6587\u672c\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13675v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OpticalRAG: Pixel-Space Compression for Token-Efficient Retrieval-Augmented Generation", "tldr": "OpticalRAG\u5c06\u6587\u6863\u8f6c\u4e3a\u56fe\u50cf\uff0c\u6309\u67e5\u8be2\u538b\u7f29\u4e3a16\u4e2a\u89c6\u89c9\u524d\u7f00\u8bcd\u5143\uff1b\u5728\u4e09\u4e2a\u957f\u6587\u672c\u57fa\u51c6\u4e0a\u538b\u7f29\u611f\u77e5\u51c6\u786e\u7387\u6700\u4f18\uff0c\u8f83\u65e0\u68c0\u7d22\u57fa\u5ea7\u63d0\u53475.17\u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) have shown strong capabilities across diverse applications, making both safety and utility essential for reliable deployment. Jailbreak attacks use diverse forms of adversarial prompting to bypass alignment safeguards and induce LLMs to generate harmful responses. Some representation-based defenses regulate internal activations using predefined steering directions or learned safety regions. However, adapting intervention to each input without a predefined representational target while limiting over-refusal remains a challenge. In this paper, we propose Target-free Entropy-guided Residual Modulation (TERM), an inference-time defense that uses prompt-calibrated attention entropy deviations to guide adaptive modulation of the model\u0027s own residual updates. Attention patterns vary across prompts and decoding steps, making raw entropy values difficult to interpret as a consistent signal for intervention. We therefore calibrate attention entropy against each prompt\u0027s own prefill baseline to establish an input-specific reference for reducing unnecessary intervention on benign requests. Adaptive scale normalization and temporal accumulation then account for differences in deviation scale and persistence to determine intervention strength. The resulting signal controls bounded scaling of the model\u0027s own residual updates, without relying on a predefined safety direction. We compare our method with seven defenses on seven jailbreak attacks and two over-refusal benchmarks across Llama, Qwen, and Gemma models, including Qwen3 models from 0.6B to 32B. Results show our method improves jailbreak robustness while maintaining low over-refusal on benign safety-sensitive requests with modest inference overhead.", "arxiv_id": "2611.13578", "arxiv_url": "https://arxiv.org/abs/2611.13578", "authors": ["Haoyi Wu", "Yunkai Dang", "Wanyu Zhang", "Lei Wang", "Wenbin Li"], "brief": "\u63d0\u51faTERM\u63a8\u let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
