is_top": false, "key_points": ["520\u540d\u6210\u4eba\uff1a\u89c6\u89c9\u8ddd\u79bb\u6bcf\u589e\u4e00\u6807\u51c6\u5dee\uff0c\u6269\u5c55\u5bf9\u6570\u80dc\u7b97\u964d3.23", "\u4e09\u4f8b\u6559\u5b66\u540e\uff0c\u4e0a\u4f4d\u9879\u6269\u5c55\u7387\u968f\u6837\u4f8b\u5c42\u7ea7\u4ece1.1%\u5347\u81f377.5%", "\u4eba\u5de5\u5b66\u4e60\u8005\u8fd1\u3001\u4e2d\u3001\u8fdc\u7c7b\u522b\u5bf9\u547d\u540d\u51c6\u786e\u7387\u4e3a84.7%\u300165.4%\u300153.0%"], "keywords": ["\u8bcd\u6c47\u5b66\u4e60", "\u89c6\u89c9\u76f8\u4f3c\u6027", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u8ba4\u77e5\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14116v1", "published_at": "2026-11-10", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14116.png", "title": "Visual Similarity in Adult Word Extension and Artificial Word Learning", "tldr": "\u6210\u4eba\u4e0e\u4eba\u5de5\u5b66\u4e60\u8005\u7684\u8bcd\u4e49\u6cdb\u5316\u5747\u53d7\u89c6\u89c9\u76f8\u4f3c\u6027\u5f71\u54cd\uff0c\u4f46\u6559\u5b66\u6837\u4f8b\u53e6\u6709\u8d21\u732e\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u7528\u51bb\u7ed3\u7684\u81ea\u76d1\u7763\u89c6\u89c9\u7f16\u7801\u5668DINOv2\u91cd\u6790\u6210\u4eba\u8bcd\u4e49\u6269\u5c55\u6570\u636e\uff0c\u5e76\u8bad\u7ec3\u4eba\u5de5\u8bcd\u6c47\u5b66\u4e60\u8005\uff0c\u68c0\u9a8c\u89c6\u89c9\u8ddd\u79bb\u4e0e\u6559\u5b66\u6837\u4f8b\u5982\u4f55\u5f71\u54cd\u547d\u540d\u548c\u6cdb\u5316\u3002", "why_notable": "\u5c06\u89c6\u89c9\u8868\u5f81\u4e0e\u4eba\u7c7b\u8bcd\u4e49\u6cdb\u5316\u8054\u7cfb\u8d77\u6765\uff0c\u540c\u65f6\u63ed\u793a\u8ddd\u79bb\u6307\u6807\u65e0\u6cd5\u66ff\u4ee3\u6837\u4f8b\u6784\u6210\uff1b\u8868\u5f81\u4e0e\u4eba\u7c7b\u76f8\u4f3c\u6027\u5bf9\u9f50\uff0c\u4e5f\u4e0d\u4fdd\u8bc1\u80fd\u9884\u6d4b\u5b66\u4e60\u96be\u5ea6\u3002"}, {"abstract": "We describe our solution for the 2026 BEHAVIOR Challenge: 100 long-horizon household tasks in the OmniGibson simulator. We placed 9th on the final leaderboard, the only independent team in the top 10. The core of the solution is a single vision-language-action (VLA) model, one checkpoint for all 100 tasks, built on our 1st-place 2025 solution, which is based on $\u03c0_{0.5}$. On the 50 tasks shared with 2025, its Q rises from 0.260 to 0.371; across all 100 tasks it scores 0.392. Our main conclusion from 2025 was that the model was undertrained, so most of the 2026 work went into training the model for longer, optimizing some training parameters, making each training step slightly faster and reducing the gradient noise: a migration from 50 to 100 tasks (semantic stages built from the demonstrations\u0027 skill annotations, task and stage embeddings of new tasks warm-started from similar old ones, and a 21-dimensional action space matching the teleoperation controls); variance-reduced multi-sample flow matching with a simple noise-vs-compute model that picks the number of action-expert samples per observation without ablations; and a 200k-step training run, about one pass over the 211M frames of the demonstrations. A cloud evaluation infrastructure keeps a shared record with provenance, episode diagnostics and restorable simulator states, and runs six simulators on one GPU together faster than real time. On top of the learned policy, 14 tasks are routed to a GPT-6 Astra coding agent that controls the robot through observation and motion tools, starting every episode from a frozen copy of its own practice session on training instances. Across these 14 tasks, Astra\u0027s mean Q is 0.639, against 0.108 for the learned policy. The public submission included only part of the Astra results and scored 0.446 Q with 27.3% full-task success.", "arxiv_id": "2611.14432", "arxiv_url": "https://arxiv.org/abs/2611.14432", "authors": ["Ilia Larchenko", "Gleb Zarin", "Atindra Nair", "Keerti Manney", "Vitaly Kleban", "Mirko Kiefer", "Anjana Yodaiken"], "brief": "\u65b9\u6848\u4ee5\u03c0\u2080.\u2085\u4e3a\u57fa\u7840\uff0c\u7528\u5355\u4e00\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\u5904\u7406\u767e\u9879\u5bb6\u52a1\uff0c\u901a\u8fc7\u5ef6\u957f\u8bad\u7ec3\u548c\u964d\u4f4e\u68af\u5ea6\u566a\u58f0\u63d0\u5347\u8868\u73b0\uff1b\u53e6\u5c0614\u9879\u4efb\u52a1\u4ea4\u7ed9\u53ef\u8c03\u7528\u673a\u5668\u4eba\u5de5\u5177\u7684\u7f16\u7801\u667a\u80fd\u4f53\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14432", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u591a\u6837\u672c\u6d41\u5339\u914d\u964d\u4f4e\u65b9\u5dee\uff0c\u8bad\u7ec320\u4e07\u6b65\u8986\u76d62.11\u4ebf\u5e27", "GPT-6 Astra\u572814\u9879\u4efb\u52a1\u4e0a\u5e73\u5747Q\u8fbe0.639", "\u516c\u5f00\u63d0\u4ea4Q\u4e3a0.446\uff0c\u5b8c\u6574\u4efb\u52a1\u6210\u529f\u738727.3%"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14432v1", "published_at": "2026-11-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "One Policy for 100 Household Tasks: Our Solution for the 2026 BEHAVIOR Challenge", "tldr": "\u4ee5\u7edf\u4e00\u673a\u5668\u4eba\u7b56\u7565\u8986\u76d6\u767e\u9879\u5bb6\u52a1\uff0c\u518d\u7528\u7f16\u7801\u667a\u80fd\u4f53\u8865\u5f3a\u90e8\u5206\u957f\u7a0b\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": "\u65b9\u6848\u4ee5\u03c0\u2080.\u2085\u4e3a\u57fa\u7840\uff0c\u7528\u5355\u4e00\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\u5904\u7406\u767e\u9879\u5bb6\u52a1\uff0c\u901a\u8fc7\u5ef6\u957f\u8bad\u7ec3\u548c\u964d\u4f4e\u68af\u5ea6\u566a\u58f0\u63d0\u5347\u8868\u73b0\uff1b\u53e6\u5c0614\u9879\u4efb\u52a1\u4ea4\u7ed9\u53ef\u8c03\u7528\u673a\u5668\u4eba\u5de5\u5177\u7684\u7f16\u7801\u667a\u80fd\u4f53\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u5145\u5206\u8bad\u7ec3\u4ecd\u80fd\u660e\u663e\u6539\u5584\u7edf\u4e00\u7b56\u7565\uff1b\u5de5\u5177\u9a71\u52a8\u667a\u80fd\u4f53\u5728\u90e8\u5206\u957f\u7a0b\u4efb\u52a1\u4e0a\u5927\u5e45\u9886\u5148\uff0c\u4e3a\u6df7\u5408\u673a\u5668\u4eba\u63a7\u5236\u63d0\u4f9b\u4e86\u5b9e\u8bc1\u3002"}, {"abstract": "Understanding the internal representations of neural networks and characterizing their relationship with human conceptual structure are two critical questions for elucidating model mechanisms. The former reveals how learned knowledge is organized in internal representations, whereas the latter provides a basis for interpreting these representations through human conceptual structure. Here, we formally define fundamental representational units (FRUs) and establish two evaluation criteria: fidelity and stability. We further prove that threshold-activated sparse autoencoders (TSAEs) can identify FRUs with high fidelity and stability under appropriate conditions, and validate this result through large-scale experiments. Further analyses reveal that FRUs with higher stability exhibit greater monosemanticity and can be composed across layers to recover semantic organization corresponding to human conceptual structure. These results provide a unified framework for defining, evaluating and identifying FRUs in neural networks, and establish a foundation for characterizing the relationship between neural network representations and human conceptual structure.", "arxiv_id": "2611.14168", "arxiv_url": "https://arxiv.org/abs/2611.14168", "authors": ["Chenhui Hu", "Pengfei Cao", "Kang Liu", "Jun Zhao"], "brief": "\u8bba\u6587\u5b9a\u4e49\u795e\u7ecf\u7f51\u7edc\u7684\u57fa\u672c\u8868\u5f81\u5355\u5143\uff0c\u4ee5\u4fdd\u771f\u5ea6\u548c\u7a33\u5b9a\u6027\u8bc4\u4f30\uff0c\u5e76\u8bc1\u660e\u53ca\u5b9e\u9a8c\u9a8c\u8bc1TSAEs\u53ef\u8bc6\u522b\u8fd9\u4e9b\u5355\u5143\uff1b\u7a33\u5b9a\u5355\u5143\u66f4\u5177\u5355\u4e49\u6027\uff0c\u8de8\u5c42\u7ec4\u5408\u53ef\u8fd8\u539f\u4eba\u7c7b\u6982\u5ff5\u7ed3\u6784\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14168", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u795e\u7ecf\u7f51\u7edc\u8868\u5f81", "\u7a00\u758f\u81ea\u7f16\u7801\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14168v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Representational Atoms in Neural Networks", "tldr": "\u8bba\u6587\u5b9a\u4e49\u795e\u7ecf\u7f51\u7edc\u7684\u57fa\u672c\u8868\u5f81\u5355\u5143\uff0c\u4ee5\u4fdd\u771f\u5ea6\u548c\u7a33\u5b9a\u6027\u8bc4\u4f30\uff0c\u5e76\u8bc1\u660e\u53ca\u5b9e\u9a8c\u9a8c\u8bc1TSAEs\u53ef\u8bc6\u522b\u8fd9\u4e9b\u5355\u5143\uff1b\u7a33\u5b9a\u5355\u5143\u66f4\u5177\u5355\u4e49\u6027\uff0c\u8de8\u5c42\u7ec4\u5408\u53ef\u8fd8\u539f\u4eba\u7c7b\u6982\u5ff5\u7ed3\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reusing key--value (KV) caches across language model updates could avoid repeated computation of shared context, but changes in model weights raise a fundamental question about what these caches preserve. We investigate direct cache reuse across four model updates, with a detailed study of DeepSeek-V4-Flash to Flash-0731. Our central finding is that caches can retain useful task information without faithfully reproducing the updated model\u0027s behavior. Retrieval accuracy varies substantially across updates, ranging from near-native performance to large losses. With source caches already available, reuse achieves median time-to-first-token speedups of $2.10$--$5.08\\times$ on three longer-prefix QA benchmarks. To characterize the behavioral differences behind these outcomes, we introduce Functional Cache Divergence, which compares next-token distributions under reused and native caches. Direct KV cache reuse better preserves native model behavior in natural-text continuation, whereas compatibility degrades with increasing prefix length in single-token retrieval tasks. Answer-margin analyses help explain how correct retrieval decisions survive substantial internal state changes. Yet even agreement on the first generated token does not ensure agreement in answer content or stopping behavior. These findings establish task utility and fidelity to native inference as distinct criteria for evaluating cross-version KV cache reuse.", "arxiv_id": "2611.14051", "arxiv_url": "https://arxiv.org/abs/2611.14051", "authors": ["Zhikun Tao", "Fangyong Jin", "Junping Zhao"], "brief": "\u7814\u7a76\u8de8\u6a21\u578b\u66f4\u65b0\u76f4\u63a5\u590d\u7528KV\u7f13\u5b58\uff0c\u9996\u8bcd\u5ef6\u8fdf\u52a0\u901f\u8fbe2.10\u81f35.08\u500d\uff0c\u4f46\u68c0\u7d22\u7cbe\u5ea6\u6ce2\u52a8\u660e\u663e\uff1b\u8868\u660e\u4fdd\u7559\u4efb\u52a1\u4fe1\u606f\u4e0d\u7b49\u4e8e\u5fe0\u5b9e\u590d\u73b0\u65b0\u7248\u6a21\u578b\u884c\u4e3a\u3002", "categories": ["cs.DC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14051", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f13\u5b58\u590d\u7528", "\u6a21\u578b\u66f4\u65b0", "\u63a8\u7406\u52a0\u901f", "\u884c\u4e3a\u4e00\u81f4\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14051v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Can KV Cache Be Reused Across Model Updates? A DeepSeek-V4-Flash Case Study", "tldr": "\u7814\u7a76\u8de8\u6a21\u578b\u66f4\u65b0\u76f4\u63a5\u590d\u7528KV\u7f13\u5b58\uff0c\u9996\u8bcd\u5ef6\u8fdf\u52a0\u901f\u8fbe2.10\u81f35.08\u500d\uff0c\u4f46\u68c0\u7d22\u7cbe\u5ea6\u6ce2\u52a8\u660e\u663e\uff1b\u8868\u660e\u4fdd\u7559\u4efb\u52a1\u4fe1\u606f\u4e0d\u7b49\u4e8e\u5fe0\u5b9e\u590d\u73b0\u65b0\u7248\u6a21\u578b\u884c\u4e3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon personalized agents maintain an evolving memory by continuously deciding what to add, modify, or discard. However, learning an optimal update policy remains challenging. Conventional training relies solely on terminal question-answering accuracy, yielding a coarse feedback signal that treats all intermediate updates identically. Furthermore, update utility is inherently user-specific, as identical memory actions may yield opposite effects across different user personas. Existing methods fail to address this heterogeneity, relying on globally shared evaluation standards with at most a single scalar intermediate reward. To address these challenges, we propose \\textbf{Personalized Memory Rubrics} (\\textbf{PMR}), a framework that translates terminal feedback into fine-grained, per-step, and per-user credit assignment. PMR decomposes evaluation into a universal layer capturing cross-persona failure patterns and a per-user adaptive layer modeling individual traits as a specialized delta over the universal baseline. Through \\textbf{Rubric-Guided Credit Assignment}, PMR redistributes credit at the token level, selectively amplifying validated decisions on successful trajectories while falling back to standard policy optimization on failed ones to avoid unreliable attribution. The rubric and memory policy \\textbf{co-evolve} in a closed loop with anti-circularity guarantees. Crucially, PMR incurs zero inference overhead, operating without any rubric or external judge during deployment. Extensive experiments across four benchmarks demonstrate consistent gains over strong memory-augmented baselines.", "arxiv_id": "2611.14017", "arxiv_url": "https://arxiv.org/abs/2611.14017", "authors": ["Yupeng Han", "Kai Zhang", "Shuochen Liu", "Ze Liu", "Xianquan Wang", "Zhihong Pan", "Xiangyu Zhao", "Qi Liu", "Enhong Chen"], "brief": "\u63d0\u51fa\u4e2a\u6027\u5316\u8bb0\u5fc6\u8bc4\u4ef7\u6846\u67b6\uff0c\u5c06\u6700\u7ec8\u53cd\u9988\u7ec6\u5316\u4e3a\u9010\u6b65\u3001\u9010\u7528\u6237\u7684\u8bcd\u5143\u7ea7\u4fe1\u7528\u5206\u914d\uff0c\u5b66\u4e60\u667a\u80fd\u4f53\u8bb0\u5fc6\u66f4\u65b0\u7b56\u7565\uff1b\u56db\u9879\u57fa\u51c6\u5747\u6709\u63d0\u5347\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14017", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e2a\u6027\u5316\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7ba1\u7406", "\u4fe1\u7528\u5206\u914d", "\u7b56\u7565\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14017v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Personalized Memory Rubrics: Learning What to Remember per User via Rubric-Guided Credit Assignment", "tldr": "\u63d0\u51fa\u4e2a\u6027\u5316\u8bb0\u5fc6\u8bc4\u4ef7\u6846\u67b6\uff0c\u5c06\u6700\u7ec8\u53cd\u9988\u7ec6\u5316\u4e3a\u9010\u6b65\u3001\u9010\u7528\u6237\u7684\u8bcd\u5143\u7ea7\u4fe1\u7528\u5206\u914d\uff0c\u5b66\u4e60\u667a\u80fd\u4f53\u8bb0\u5fc6\u66f4\u65b0\u7b56\u7565\uff1b\u56db\u9879\u57fa\u51c6\u5747\u6709\u63d0\u5347\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In Mixture-of-Experts (MoE) models, the nature of expert specialization remains controversial. Reports of domain-associated expert preferences contrast with analyses attributing routing primarily to token identity or syntactic patterns. To clarify these differing accounts, we look beyond expert-level routing to investigate the neuron-level organization of domain-specialized computation using Routing-Aware Magnitude Profiling (RAMP), a measure developed for this analysis. Using mixed-domain calibration data, we identify domain-specialized neuron sets with 58-74% overlap across multi-source samples of the same domain, compared with 15-24% across domains. To understand how this organization evolves during training, we trace neuron importance throughout pre-training and post-training across three fully open MoE families. Neuron importance continues to reorganize between pre-training checkpoints despite comparatively stable expert-level importance rankings, while post-training largely preserves neuron rankings. Building on these neuron-level perspectives, we further introduce RAMP-based Pruning (RAMPr) to select neurons across experts for balanced multi-domain capability preservation. At 75% neuron retention, RAMPr preserves average 91-98% of original full performance across six models. At 50% retention, our pruning method can reduce resident GPU memory by 36-43% and improves batched prefill throughput by 17-39% effectively. Our code is available at https://github.com/ydyjya/Neuron-Level-Specialization-in-MoE", "arxiv_id": "2611.13975", "arxiv_url": "https://arxiv.org/abs/2611.13975", "authors": ["Zhenhong Zhou", "Mao Zheng", "Mingyang Song", "Qiankun Li", "Kun Wang", "Junfeng Fang"], "brief": "\u63d0\u51faRAMP\u63ed\u793aMoE\u9886\u57df\u4e13\u5316\u53d1\u751f\u5728\u8de8\u4e13\u5bb6\u7684\u795e\u7ecf\u5143\u5c42\u9762\uff0c\u5e76\u636e\u6b64\u526a\u679d\uff1b\u4fdd\u755975%\u795e\u7ecf\u5143\u65f6\u7ef4\u630191\u201498%\u6027\u80fd\uff0c\u51cf\u534a\u65f6\u663e\u8457\u964d\u4f4e\u663e\u5b58\u5e76\u63d0\u5347\u541e\u5410\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13975", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u795e\u7ecf\u5143\u4e13\u5316", "\u6a21\u578b\u526a\u679d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13975v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Understanding Mixture-of-Experts Language Models Beyond Expert Boundaries", "tldr": "\u63d0\u51faRAMP\u63ed\u793aMoE\u9886\u57df\u4e13\u5316\u53d1\u751f\u5728\u8de8\u4e13\u5bb6\u7684\u795e\u7ecf\u5143\u5c42\u9762\uff0c\u5e76\u636e\u6b64\u526a\u679d\uff1b\u4fdd\u755975%\u795e\u7ecf\u5143\u65f6\u7ef4\u630191\u201498%\u6027\u80fd\uff0c\u51cf\u534a\u65f6\u663e\u8457\u964d\u4f4e\u663e\u5b58\u5e76\u63d0\u5347\u541e\u5410\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chain-of-thought (CoT) monitoring is one of the most valuable tools for monitoring advanced AI systems, but it is under threat. We argue that frontier AI developers should report specific indicators to make these threats trackable and to better facilitate coordination to preserve CoT monitorability. We identify five indicators that are both highly relevant and reasonably feasible to disclose, one for each link in a five-step chain on which CoT monitoring depends. The first, third-party CoT access and base architecture specifications, also underpins external verification of the rest. The others span CoT quality (naturalness and faithfulness) and monitoring effectiveness (detection and uplift). An audit of current disclosures by Anthropic, OpenAI, and Google DeepMind shows that no developer covers the full set, but that every indicator has been reported by at least one frontier developer. Because current disclosures rely largely on developers\u0027 own evaluations, we also recommend that a cross-developer audit be repeated with deeper access than public disclosures allow, either by embedded evaluators working within developers or by an Independent Verification Organization.", "arxiv_id": "2611.13873", "arxiv_url": "https://arxiv.org/abs/2611.13873", "authors": ["Jacob Davies", "Theo Bearman"], "brief": "\u63d0\u51fa\u4e94\u9879\u900f\u660e\u5ea6\u62ab\u9732\u6307\u6807\uff0c\u4ee5\u8ffd\u8e2a\u5e76\u7ef4\u62a4\u601d\u7ef4\u94fe\u7684\u53ef\u76d1\u6d4b\u6027\uff1b\u5ba1\u67e5\u4e09\u5bb6\u524d\u6cbf\u5f00\u53d1\u5546\u53d1\u73b0\uff0c\u65e0\u4e00\u5bb6\u5b8c\u6574\u62ab\u9732\uff0c\u5efa\u8bae\u901a\u8fc7\u66f4\u6df1\u5165\u7684\u8de8\u5f00\u53d1\u5546\u5ba1\u8ba1\u52a0\u5f3a\u9a8c\u8bc1\u3002", "categories": ["cs.CY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13873", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u601d\u7ef4\u94fe", "\u900f\u660e\u5ea6", "\u4eba\u5de5\u667a\u80fd\u5b89\u5168", "\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13873v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Transparency Disclosures for Chain-of-Thought Monitorability", "tldr": "\u63d0\u51fa\u4e94\u9879\u900f\u660e\u5ea6\u62ab\u9732\u6307\u6807\uff0c\u4ee5\u8ffd\u8e2a\u5e76\u7ef4\u62a4\u601d\u7ef4\u94fe\u7684\u53ef\u76d1\u6d4b\u6027\uff1b\u5ba1\u67e5\u4e09\u5bb6\u524d\u6cbf\u5f00\u53d1\u5546\u53d1\u73b0\uff0c\u65e0\u4e00\u5bb6\u5b8c\u6574\u62ab\u9732\uff0c\u5efa\u8bae\u901a\u8fc7\u66f4\u6df1\u5165\u7684\u8de8\u5f00\u53d1\u5546\u5ba1\u8ba1\u52a0\u5f3a\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper, we investigate how human egocentric videos can benefit robot policy learning without action supervision. Building on a pretrained VLM, we propose Shared Prediction on Action and Representation (SPAR), an MoT architecture in which future visual state prediction can provide independent and complementary learning signals alongside action prediction. We find that representations learned from egocentric videos improve downstream performance on out-of-distribution robot tasks, with further gains as video data scales. We also study the effects of objective choices and data curation, providing insights into how to leverage action-free videos for scalable robot learning.", "arxiv_id": "2611.13685", "arxiv_url": "https://arxiv.org/abs/2611.13685", "authors": ["Lin Long", "Tianren Ma", "Zhong Chu", "Di Wu", "Maosong Cao", "Qixiang Ye", "Junbo Zhao", "Shanghang Zhang"], "brief": "\u63d0\u51faSPAR\uff0c\u8054\u5408\u9884\u6d4b\u52a8\u4f5c\u4e0e\u672a\u6765\u89c6\u89c9\u72b6\u6001\uff0c\u5229\u7528\u65e0\u52a8\u4f5c\u6807\u6ce8\u7684\u4eba\u7c7b\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u5b66\u4e60\u673a\u5668\u4eba\u7b56\u7565\uff1b\u63d0\u5347\u5206\u5e03\u5916\u4efb\u52a1\u8868\u73b0\uff0c\u4e14\u968f\u89c6\u9891\u89c4\u6a21\u6269\u5927\u8fdb\u4e00\u6b65\u6539\u5584\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13685", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13685v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ego Guidance: Enhancing Robot Policy Learning with Action-Free Human Egocentric Videos", "tldr": "\u63d0\u51faSPAR\uff0c\u8054\u5408\u9884\u6d4b\u52a8\u4f5c\u4e0e\u672a\u6765\u89c6\u89c9\u72b6\u6001\uff0c\u5229\u7528\u65e0\u52a8\u4f5c\u6807\u6ce8\u7684\u4eba\u7c7b\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u5b66\u4e60\u673a\u5668\u4eba\u7b56\u7565\uff1b\u63d0\u5347\u5206\u5e03\u5916\u4efb\u52a1\u8868\u73b0\uff0c\u4e14\u968f\u89c6\u9891\u89c4\u6a21\u6269\u5927\u8fdb\u4e00\u6b65\u6539\u5584\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) improves language models by distilling teacher predictions on student-generated trajectories, while on-policy self-distillation (OPSD) removes the need for an external teacher by using a reference-conditioned copy of the model as the teacher. Despite its great early improvements, we find that OPSD does not remain consistently effective under continued training and can eventually suffer substantial performance degradation. We study this training behavior and link the degradation to a growing mismatch between the evolving reference-free student and the frozen privileged teacher. In the early stage of OPSD, the privileged teacher remains closely aligned with the student and provides useful guidance for improving the student\u0027s generation trajectories. However, as training progresses, the growing distributional mismatch between the privileged teacher and reference-free student can cause the teacher to provide misleading supervision, ultimately degrading student performance. This phenomenon motivates us to first leverage privileged reference supervision to acquire useful knowledge and then transfer it to a fresh student. We introduce Bootstrapped On-Policy Distillation (BOPD), a two-stage framework that first uses OPSD to internalize task-relevant information from reference-conditioned supervision into an intermediate model, and then distills this reference-free intermediate model into a fresh copy of the initial model. Experiments across models show that BOPD improves mathematical reasoning and code generation beyond both the initial models and the constructed OPSD teachers. These results suggest that privileged reference supervision can be more effectively exploited by first transferring its task-relevant signal into a task-adapted model and then distilling from that model without reference conditioning.", "arxiv_id": "2611.13680", "arxiv_url": "https://arxiv.org/abs/2611.13680", "authors": ["Yue Wu", "Xueyu Zhou", "Yangrong Hu", "Jian Huang"], "brief": "\u63d0\u51fa\u4e24\u9636\u6bb5\u81ea\u4e3e\u5728\u7ebf\u84b8\u998f\uff0c\u5148\u5438\u6536\u53c2\u8003\u7b54\u6848\u77e5\u8bc6\uff0c\u518d\u5411\u65b0\u5b66\u751f\u84b8\u998f\uff0c\u7f13\u89e3\u6301\u7eed\u81ea\u84b8\u998f\u9000\u5316\uff1b\u6570\u5b66\u63a8\u7406\u4e0e\u4ee3\u7801\u751f\u6210\u8868\u73b0\u5747\u8d85\u8d8a\u521d\u59cb\u6a21\u578b\u53ca\u81ea\u84b8\u998f\u6559\u5e08\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13680", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u81ea\u84b8\u998f", "\u6570\u5b66\u63a8\u7406", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13680v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bootstrapped On-Policy Distillation", "tldr": "\u63d0\u51fa\u4e24\u9636\u6bb5\u81ea\u4e3e\u5728\u7ebf\u84b8\u998f\uff0c\u5148\u5438\u6536\u53c2\u8003\u7b54\u6848\u77e5\u8bc6\uff0c\u518d\u5411\u65b0\u5b66\u751f\u84b8\u998f\uff0c\u7f13\u89e3\u6301\u7eed\u81ea\u84b8\u998f\u9000\u5316\uff1b\u6570\u5b66\u63a8\u7406\u4e0e\u4ee3\u7801\u751f\u6210\u8868\u73b0\u5747\u8d85\u8d8a\u521d\u59cb\u6a21\u578b\u53ca\u81ea\u84b8\u998f\u6559\u5e08\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) have achieved remarkable progress on complex reasoning tasks, yet the mechanisms by which they acquire reasoning capabilities and the efficiency of their reasoning remain poorly understood. In this paper, we investigate the path-finding problem over directed graphs, a symbolic abstraction of multi-step reasoning. We first characterize the architectural requirements for this task, proving that one-layer transformers require $\u03a9(N^2)$ size on dense graphs to implement the key DFS child-selection primitive. While a two-layer transformer implements full DFS with $O(N\\log(N))$ size. Thus, a second layer is necessary and sufficient for near-linear DFS reasoning. We then extend this expressivity analysis to deeper models: for every $k\\geq3$, a $k$-layer transformer implements a bounded-reachability DFS policy with look-ahead horizon $1+2^{k-3}$, establishing an exponential increase in reachability horizon with depth. Finally, going beyond expressivity, given appropriately curated training data, we show that two-layer transformers can provably learn to execute DFS via gradient flow and generalize to unseen graphs. Together, our results provide a mechanistic account of how transformers implement graph search, how depth expands bounded look-ahead, and how such reasoning algorithms can emerge through training.", "arxiv_id": "2611.13594", "arxiv_url": "https://arxiv.org/abs/2611.13594", "authors": ["Xutao Ma", "Somayeh Sojoudi"], "brief": "\u7814\u7a76Transformer\u5b9e\u73b0\u4e0e\u5b66\u4e60\u56fe\u641c\u7d22\u7684\u673a\u5236\uff0c\u8bc1\u660e\u4e24\u5c42\u5373\u53ef\u8fd1\u7ebf\u6027\u89c4\u6a21\u6267\u884c\u6df1\u5ea6\u4f18\u5148\u641c\u7d22\uff0c\u589e\u52a0\u6df1\u5ea6\u4f7f\u524d\u77bb\u8303\u56f4\u6307\u6570\u589e\u957f\uff0c\u5e76\u53ef\u5728\u7279\u5b9a\u8bad\u7ec3\u6570\u636e\u4e0b\u5b66\u4f1a\u641c\u7d22\u3001\u6cdb\u5316\u5230\u65b0\u56fe\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13594", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u641c\u7d22", "\u6df1\u5ea6\u4f18\u5148\u641c\u7d22", "\u8bad\u7ec3\u52a8\u529b\u5b66", "\u63a8\u7406\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13594v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Transformers Provably Learn Graph Search: Training Dynamics and the Exponential Power of Depth", "tldr": "\u7814\u7a76Transformer\u5b9e\u73b0\u4e0e\u5b66\u4e60\u56fe\u641c\u7d22\u7684\u673a\u5236\uff0c\u8bc1\u660e\u4e24\u5c42\u5373\u53ef\u8fd1\u7ebf\u6027\u89c4\u6a21\u6267\u884c\u6df1\u5ea6\u4f18\u5148\u641c\u7d22\uff0c\u589e\u52a0\u6df1\u5ea6\u4f7f\u524d\u77bb\u8303\u56f4\u6307\u6570\u589e\u957f\uff0c\u5e76\u53ef\u5728\u7279\u5b9a\u8bad\u7ec3\u6570\u636e\u4e0b\u5b66\u4f1a\u641c\u7d22\u3001\u6cdb\u5316\u5230\u65b0\u56fe\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse autoencoders (SAEs) are commonly evaluated by variance explained and ablation damage. We show how massive activations undermine both evaluations, and propose a correction. Massive activations cause up to 99.9% of activation variance to lie along the first principal component (PC1). Because the PC1 component has no unique sparse decomposition, each SAE run rebuilds it from a different set of features. These features dominate importance rankings: an average of 47 of the 50 most important features are unmatched in a separate run, compared with about 27 of a random 50. A dictionary can also report 99.96% of variance explained while leaving 33% of the variance outside PC1 unexplained. We bypass PC1 by training the SAE on activations with PC1 removed, then adding PC1 to the reconstruction. In affected models, the top-50 feature sharing rate rises from 4-39.5% to 73-99.5%. At the same TopK sparsity, the resulting SAE degrades the model up to 44% less and reduces content reconstruction error by up to 33.9%.", "arxiv_id": "2611.13548", "arxiv_url": "https://arxiv.org/abs/2611.13548", "authors": ["Nathan Delisle", "Chenhao Tan"], "brief": "\u7814\u7a76\u53d1\u73b0\u5de8\u5e45\u6fc0\u6d3b\u4f1a\u626d\u66f2\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7684\u8bc4\u4f30\uff1b\u8bad\u7ec3\u65f6\u79fb\u9664\u7b2c\u4e00\u4e3b\u6210\u5206\u3001\u91cd\u6784\u65f6\u52a0\u56de\uff0c\u53ef\u663e\u8457\u63d0\u5347\u8de8\u6b21\u8bad\u7ec3\u7684\u7279\u5f81\u4e00\u81f4\u6027\uff0c\u5e76\u964d\u4f4e\u6a21\u578b\u635f\u4f24\u4e0e\u91cd\u6784\u8bef\u5dee\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13548", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u53ef\u89e3\u91ca\u6027", "\u4e3b\u6210\u5206\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13548v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Massive Activations Confound Sparse Autoencoders", "tldr": "\u7814\u7a76\u53d1\u73b0\u5de8\u5e45\u6fc0\u6d3b\u4f1a\u626d\u66f2\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7684\u8bc4\u4f30\uff1b\u8bad\u7ec3\u65f6\u79fb\u9664\u7b2c\u4e00\u4e3b\u6210\u5206\u3001\u91cd\u6784\u65f6\u52a0\u56de\uff0c\u53ef\u663e\u8457\u63d0\u5347\u8de8\u6b21\u8bad\u7ec3\u7684\u7279\u5f81\u4e00\u81f4\u6027\uff0c\u5e76\u964d\u4f4e\u6a21\u578b\u635f\u4f24\u4e0e\u91cd\u6784\u8bef\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Data-science and ML-engineering agents are evaluated on benchmarks such as MLE-bench, ALE-Bench, SWE-fficiency and AlgoTune, whose tasks yield a quantity (a Kaggle metric, contest score or speedup). When one stops separating the best models, the usual remedy is a harder version. Re-scoring released runs of eight benchmarks, including SWE-bench Verified and Terminal-Bench for breadth, we find much of this saturation lies in the measurement, not the tasks. Most agent benchmarks reduce a run to one pass/fail bit, which fails in two ways. It is too coarse: neighbouring top-ten agents on SWE-bench Verified differ by less than its tests\u0027 errors, and correcting them reorders neighbours no more than deleting a random sixth of each agent\u0027s passes. It is capped at the reference: ALE-Bench\u0027s top ten, separated by contest score, tie when graded against the median human, although nearly half the runs beat that human. On fixed tasks, a higher bar only moves the problem; graded credit fixes it. We derive a clipped log-ratio score with dated anchors and cost as a separate axis. In a Terminal-Bench re-run, pass/fail-tied models differ over tenfold on the quantity the tests discard.", "arxiv_id": "2611.13541", "arxiv_url": "https://arxiv.org/abs/2611.13541", "authors": ["Zihan Dong", "Qishi Zhan", "Minxuan Hu"], "brief": "\u91cd\u8bc4\u516b\u9879\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u53d1\u73b0\u6392\u540d\u9971\u548c\u5e38\u6e90\u4e8e\u4e8c\u5143\u8bc4\u5206\u800c\u975e\u4efb\u52a1\u8017\u5c3d\uff1b\u63d0\u51fa\u8fde\u7eed\u8bc4\u5206\uff0c\u590d\u6d4b\u663e\u793a\u901a\u8fc7\u7387\u76f8\u540c\u7684\u6a21\u578b\u5b9e\u9645\u8868\u73b0\u53ef\u5dee\u5341\u500d\u4ee5\u4e0a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13541", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u57fa\u51c6\u6d4b\u8bd5", "\u8bc4\u5206\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13541v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Agent Benchmarks Stop Ranking Before They Run Out of Tasks", "tldr": "\u91cd\u8bc4\u516b\u9879\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u53d1\u73b0\u6392\u540d\u9971\u548c\u5e38\u6e90\u4e8e\u4e8c\u5143\u8bc4\u5206\u800c\u975e\u4efb\u52a1\u8017\u5c3d\uff1b\u63d0\u51fa\u8fde\u7eed\u8bc4\u5206\uff0c\u590d\u6d4b\u663e\u793a\u901a\u8fc7\u7387\u76f8\u540c\u7684\u6a21\u578b\u5b9e\u9645\u8868\u73b0\u53ef\u5dee\u5341\u500d\u4ee5\u4e0a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) produces rich training experience, yet outcome rewards reduce each attempt to a single number and leave most of this information unused. Training-time scaffolds, such as strategies or hints added to the prompt during training, offer a natural way to turn this information into guidance, but their design and adaptation are largely left to humans and tailored to specific domains. We introduce AutoScaffold, a unified AI-for-AI framework that turns a student\u0027s training experience into adaptive scaffolds, with minimal domain-specific information and no human intervention during training. A frozen teacher periodically examines this experience, diagnoses bottlenecks, and designs scaffolds in two forms: (i) strategies shared across a class of tasks and (ii) hints for individual hard tasks, adjusting the content and amount of support as the student learns. The scaffolds are removed at evaluation. We apply the same framework to ALFWorld, search-based QA, mathematical reasoning, and GPU kernel generation. When evaluated without scaffolds, students trained with AutoScaffold outperform those trained with the corresponding RL baselines in all four domains, with gains of 7.2 points in ALFWorld success and 4.0 points in average QA exact match. On GPU kernel generation, AutoScaffold increases the fraction of tasks with a correct kernel that runs faster than the PyTorch reference by up to 5.0 points. On math, our student surpasses QuestA\u0027s reported accuracy using approximately one-third as many student training steps. Analyses show that the teacher identifies a different failure in each task class and shifts its scaffolds from step-by-step workflows to targeted fixes as the student improves, and that its revised scaffolds help the student learn more than keeping the previous scaffold or using no scaffold.", "arxiv_id": "2611.14515", "arxiv_url": "https://arxiv.org/abs/2611.14515", "authors": ["Zijian Zhang", "Rizhen Hu", "Jiangweizhi Peng", "Shiyang Li", "Sujay Bhatt", "Sihan Zeng", "Mingyi Hong"], "brief": "AutoScaffold\u8ba9\u51bb\u7ed3\u6559\u5e08\u5206\u6790\u8bad\u7ec3\u7ecf\u9a8c\uff0c\u52a8\u6001\u63d0\u4f9b\u7b56\u7565\u4e0e\u63d0\u793a\u4ee5\u6307\u5bfc\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u3002\u64a4\u53bb\u8f85\u52a9\u540e\uff0c\u5b66\u751f\u5728\u56db\u7c7b\u4efb\u52a1\u4e0a\u5747\u4f18\u4e8e\u57fa\u7ebf\uff0c\u6570\u5b66\u8bad\u7ec3\u6b65\u6570\u7ea6\u4e3a\u5bf9\u6bd4\u65b9\u6cd5\u7684\u4e09\u5206\u4e4b\u4e00\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14515", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u8bed\u8a00\u6a21\u578b", "\u81ea\u9002\u5e94\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14515v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AutoScaffold: AI-Guided Scaffolding for Reinforcement Learning of Language Models", "tldr": "AutoScaffold\u8ba9\u51bb\u7ed3\u6559\u5e08\u5206\u6790\u8bad\u7ec3\u7ecf\u9a8c\uff0c\u52a8\u6001\u63d0\u4f9b\u7b56\u7565\u4e0e\u63d0\u793a\u4ee5\u6307\u5bfc\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u3002\u64a4\u53bb\u8f85\u52a9\u540e\uff0c\u5b66\u751f\u5728\u56db\u7c7b\u4efb\u52a1\u4e0a\u5747\u4f18\u4e8e\u57fa\u7ebf\uff0c\u6570\u5b66\u8bad\u7ec3\u6b65\u6570\u7ea6\u4e3a\u5bf9\u6bd4\u65b9\u6cd5\u7684\u4e09\u5206\u4e4b\u4e00\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent harnesses have emerged as a promising mechanism for continual learning, alongside test-time parametric learning. However, the current benchmarks have several limitations: they generally focus on a single applied domain, serve each instance only once, and assume a single family of learner, so memory-based and weight-based systems are rarely compared on the same scale. We propose Continual-ARC, a lifelong stream built from the three ARC-AGI editions, whose tasks need no domain knowledge. The same tasks return after dormant gaps with fresh instances, while new tasks keep arriving. On each instance, the learner may pay for demonstrations, submit answers, or act inside the harness, with retries permitted on incorrect submissions, which are paid for. Each instance is scored based on the share of this feedback budget consumed. Since a learner may keep anything between instances, memory-based and weight-based systems are scored on the same scale. After the stream, the learner is frozen and tested on fresh instances of the tasks it met, which measures memorization, and on unseen tasks, which measures generalization. We run an agent harness with frozen weights, with and without persistence, on Qwen3.5-9B and GLM-5.3 Flash, comparing them with two prompting floors, a program-induction method and Qwen3.5-9B\u0027s weights trained to imitate GLM-5.3 Flash. Persistence in the harness generally does not improve memorization unless provided with explicit expert guidance. Most harness-based methods still learn less than a floor that simply caches each task\u0027s demonstrations, across all models we tested. No harness-based method gains on unseen tasks, whereas weight-based learning shows substantial gains. This opens the door to future weight-based continual learning that could teach models to drive harnesses in new domains.", "arxiv_id": "2611.14505", "arxiv_url": "https://arxiv.org/abs/2611.14505", "authors": ["Daniel Lenton"], "brief": "\u63d0\u51fa\u6301\u7eed\u5b66\u4e60\u57fa\u51c6Continual-ARC\uff0c\u7edf\u4e00\u8bc4\u4f30\u8bb0\u5fc6\u4e0e\u6743\u91cd\u5b66\u4e60\uff1b\u5b9e\u9a8c\u4e2d\u591a\u6570\u667a\u80fd\u4f53\u6846\u67b6\u4e0d\u53ca\u7b80\u5355\u7f13\u5b58\uff0c\u672a\u63d0\u5347\u6cdb\u5316\uff0c\u800c\u6743\u91cd\u8bad\u7ec3\u663e\u8457\u6539\u5584\u6cdb\u5316\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14505", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14505v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Continual-ARC: Measuring Skill Acquisition over a Working Lifetime", "tldr": "\u63d0\u51fa\u6301\u7eed\u5b66\u4e60\u57fa\u51c6Continual-ARC\uff0c\u7edf\u4e00\u8bc4\u4f30\u8bb0\u5fc6\u4e0e\u6743\u91cd\u5b66\u4e60\uff1b\u5b9e\u9a8c\u4e2d\u591a\u6570\u667a\u80fd\u4f53\u6846\u67b6\u4e0d\u53ca\u7b80\u5355\u7f13\u5b58\uff0c\u672a\u63d0\u5347\u6cdb\u5316\uff0c\u800c\u6743\u91cd\u8bad\u7ec3\u663e\u8457\u6539\u5584\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Foundation models trained on large unlabeled corpora develop emergent capabilities, tasks that go beyond the training objective. We extend this paradigm to multimodal biology with Bonbon, a foundation model for molecular interactions trained on approximately 3.2 trillion tokens of paired protein-ligand sequences. From a single representation space, Bonbon exhibits three zero-shot emergent capabilities at hierarchical levels of resolution: functional (mechanism of action), residue (binding site localization, including orthosteric/allosteric discrimination), and bond (covalent versus non-covalent engagement). All three capabilities generalize to out-of-distribution complexes. Bonbon was trained on protein-ligand sequences alone, without any task-specific supervision and without structural coordinates. We conducted controlled scaling experiments across six model scales from 42M to 1.6B parameters; every capability evaluated shows a sharp jump at the largest scale on continuous metrics, even as pretraining loss decreases smoothly. This demonstrates that loss-based scaling laws alone are insufficient to predict when zero-shot emergent capabilities become available. The capabilities reported here emerge after training at a 1:2,000 parameter-to-token ratio to accommodate the sparsity of paired biological interaction data. The same frozen representations achieve state-of-the-art binding and affinity prediction at five orders of magnitude greater speed than co-folding methods. In prospective wet-lab validation across nine disease targets spanning seven protein families, Bonbon achieves a 61.5% dose-response hit rate on de novo compounds, yielding structurally novel molecules not previously reported to inhibit these proteins, including for out-of-distribution targets.", "arxiv_id": "2611.14504", "arxiv_url": "https://arxiv.org/abs/2611.14504", "authors": ["Adi Mashiach"], "brief": "Bonbon\u4ec5\u7528\u86cb\u767d\u8d28\u2014\u914d\u4f53\u5e8f\u5217\u9884\u8bad\u7ec3\uff0c\u6d8c\u73b0\u4f5c\u7528\u673a\u5236\u3001\u7ed3\u5408\u4f4d\u70b9\u53ca\u6210\u952e\u7c7b\u578b\u8bc6\u522b\u80fd\u529b\uff0c\u5e76\u6cdb\u5316\u81f3\u5206\u5e03\u5916\u590d\u5408\u7269\uff1b\u6e7f\u5b9e\u9a8c\u4e2d\u65b0\u5316\u5408\u7269\u547d\u4e2d\u7387\u8fbe61.5%\u3002", "categories": ["cs.LG", "q-bio.BM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14504", "impact_score": 9, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u7269\u57fa\u7840\u6a21\u578b", "\u5206\u5b50\u76f8\u4e92\u4f5c\u7528", "\u6d8c\u73b0\u80fd\u529b", "\u836f\u7269\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14504v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Emergent Biological Capabilities in a Foundation Model for Molecular Interactions", "tldr": "Bonbon\u4ec5\u7528\u86cb\u767d\u8d28\u2014\u914d\u4f53\u5e8f\u5217\u9884\u8bad\u7ec3\uff0c\u6d8c\u73b0\u4f5c\u7528\u673a\u5236\u3001\u7ed3\u5408\u4f4d\u70b9\u53ca\u6210\u952e\u7c7b\u578b\u8bc6\u522b\u80fd\u529b\uff0c\u5e76\u6cdb\u5316\u81f3\u5206\u5e03\u5916\u590d\u5408\u7269\uff1b\u6e7f\u5b9e\u9a8c\u4e2d\u65b0\u5316\u5408\u7269\u547d\u4e2d\u7387\u8fbe61.5%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Policy optimization is central to language model post-training, yet principled guidance remains limited. We revisit its theoretical foundations to identify algorithms that learn near-optimal policies using total samples and gradient steps governed by the base model\u0027s response coverage, a measure of how readily it generates optimal responses. We call such algorithms coverage-preserving. This guarantee captures the goal of amplifying capabilities accessible through sampling from the base model. (1) Coverage collapse. REINFORCE, the basis for PPO and GRPO, can drive the probability of optimal responses to near zero, even as reward improves. This coverage collapse stalls optimization, and convergence can require exponentially many steps despite good initial coverage. The failure arises even with exact gradients and persists under KL regularization to the base model. (2) Reference resets. We show that repeatedly resetting the KL reference to the most recent policy mitigates coverage collapse. We formalize this intervention in Approximate Policy Mirror Descent (APMD), a meta-algorithm that approximately solves a sequence of KL-regularized RL subproblems. APMD enables stronger regularization, making each subproblem easier to solve, while reference resets allow convergence to global optimality. (3) Coverage-preserving algorithms. For softmax linear policies over pretrained features, we use APMD to establish the first global convergence guarantees showing that widely used families of post-training algorithms are coverage-preserving. These include stylized PPO and GRPO variants with explicit KL regularization and reference resets, and squared-loss algorithms that implement them implicitly, including those used to train the Kimi models. These results clarify how regularization, clipping, and objective choice affect the sampling and optimization costs of post-training.", "arxiv_id": "2611.14467", "arxiv_url": "https://arxiv.org/abs/2611.14467", "authors": ["Audrey Huang", "Nan Jiang", "Sham M. Kakade", "Sadhika Malladi", "Akshay Krishnamurthy", "Dylan J. Foster"], "brief": "\u63ed\u793a\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u5956\u52b1\u63d0\u5347\u4ecd\u53ef\u80fd\u5bfc\u81f4\u6700\u4f18\u56de\u7b54\u8986\u76d6\u5d29\u584c\uff0c\u5e76\u8bc1\u660e\u91cd\u7f6eKL\u53c2\u8003\u7b56\u7565\u53ef\u7f13\u89e3\u8be5\u95ee\u9898\uff0c\u4e3a\u7279\u5b9a\u7b56\u7565\u4e0b\u7684\u7b97\u6cd5\u5efa\u7acb\u5168\u5c40\u6536\u655b\u4fdd\u8bc1\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14467", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3", "\u7b56\u7565\u4f18\u5316", "\u5f3a\u5316\u5b66\u4e60", "\u6536\u655b\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14467v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Theory of Policy Optimization in Post-Training: Coverage Collapse and Reference Resets", "tldr": "\u63ed\u793a\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u5956\u52b1\u63d0\u5347\u4ecd\u53ef\u80fd\u5bfc\u81f4\u6700\u4f18\u56de\u7b54\u8986\u76d6\u5d29\u584c\uff0c\u5e76\u8bc1\u660e\u91cd\u7f6eKL\u53c2\u8003\u7b56\u7565\u53ef\u7f13\u89e3\u8be5\u95ee\u9898\uff0c\u4e3a\u7279\u5b9a\u7b56\u7565\u4e0b\u7684\u7b97\u6cd5\u5efa\u7acb\u5168\u5c40\u6536\u655b\u4fdd\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Understanding 4D scenes is a core challenge in visual intelligence, requiring models to jointly capture scene geometry, appearance, and dynamics from partial observations. However, existing approaches are subdivided into feedforward models for direct geometric prediction, and generative models for visual synthesis. We introduce UGG, a unified framework for 4D scene understanding that jointly models RGB video and geometric representations such as depth and camera pose. By assigning different noise levels across modalities and time, UGG formulates visual generation and geometric prediction as conditional completion within a single generative model. This flexible formulation enables the model to learn from diverse, heterogeneous datasets with different subsets of geometric and visual annotations. Furthermore, our generative formulation enables inference-time search over multiple plausible scene hypotheses, using geometric evidence extracted from observed RGB frames to improve geometric prediction without ground truth geometry. We demonstrate UGG\u0027s effectiveness over non-unified baselines across camera-controlled video generation, depth estimation, and camera pose prediction, including in challenging sparse observation settings. Code and visualizations are available at https://ugg-model.github.io/", "arxiv_id": "2611.14440", "arxiv_url": "https://arxiv.org/abs/2611.14440", "authors": ["Amani Kiruga", "Zhiyi Li", "Ruojin Cai", "Hansen Lillemark", "Xiaoshan Wu", "Ayush Tewari", "Yilun Du"], "brief": "UGG\u5c06\u89c6\u9891\u751f\u6210\u4e0e\u6df1\u5ea6\u3001\u76f8\u673a\u4f4d\u59ff\u9884\u6d4b\u7edf\u4e00\u4e3a\u6761\u4ef6\u8865\u5168\uff0c\u5e76\u4ee5\u63a8\u7406\u65f6\u641c\u7d22\u4f18\u5316\u51e0\u4f55\u4f30\u8ba1\uff1b\u5728\u76f8\u673a\u53ef\u63a7\u89c6\u9891\u751f\u6210\u548c\u7a00\u758f\u89c2\u6d4b\u4e0b\u7684\u51e0\u4f55\u9884\u6d4b\u4e2d\u4f18\u4e8e\u975e\u7edf\u4e00\u57fa\u7ebf\u3002", "categories": ["cs.CV", "cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14440", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u573a\u666f\u7406\u89e3", "\u751f\u6210\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u51e0\u4f55\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14440v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "UGG: Unified Generative Geometry Model", "tldr": "UGG\u5c06\u89c6\u9891\u751f\u6210\u4e0e\u6df1\u5ea6\u3001\u76f8\u673a\u4f4d\u59ff\u9884\u6d4b\u7edf\u4e00\u4e3a\u6761\u4ef6\u8865\u5168\uff0c\u5e76\u4ee5\u63a8\u7406\u65f6\u641c\u7d22\u4f18\u5316\u51e0\u4f55\u4f30\u8ba1\uff1b\u5728\u76f8\u673a\u53ef\u63a7\u89c6\u9891\u751f\u6210\u548c\u7a00\u758f\u89c2\u6d4b\u4e0b\u7684\u51e0\u4f55\u9884\u6d4b\u4e2d\u4f18\u4e8e\u975e\u7edf\u4e00\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding accelerates LLM inference by having a draft model propose multiple tokens for the target model to verify in one pass. The speedup is governed by the expected acceptance length (EAL), yet standard training objectives such as cross-entropy, KL divergence, and total variation focus only on distribution matching or single-step overlap. Recent studies instead propose block-level training objectives, aiming to optimize EAL directly. However, these objectives remain surrogates rather than exact formulations of EAL. For example, some average later acceptance over target-distributed continuations rather than the verification branches selected by accepted tokens, introducing a covariance gap that can reverse the gradient direction. We analyze this gap and derive REAL, a real EAL training loss that uses path weights for unbiased estimation and Rao-Blackwellization for variance reduction. In a controlled loss-level comparison with a Qwen3.6-35B-A3B target and a Domino drafter, REAL outperforms WTV, VSD, DBLast, and the static LK baseline on probabilistic serving acceptance length across 9 task subsets and 5 evaluation seeds. These gains require only a change to the training loss, with no modification to the drafter architecture or inference procedure, demonstrating the practicality of real EAL training. A reference implementation of the REAL loss is available at https://github.com/King-ty/speculators/tree/real-loss.", "arxiv_id": "2611.14399", "arxiv_url": "https://arxiv.org/abs/2611.14399", "authors": ["Yu Tian"], "brief": "\u63d0\u51faREAL\u635f\u5931\uff0c\u4ee5\u65e0\u504f\u4f30\u8ba1\u548c\u964d\u65b9\u5dee\u76f4\u63a5\u4f18\u5316\u63a8\u6d4b\u89e3\u7801\u7684\u771f\u5b9e\u671f\u671b\u63a5\u53d7\u957f\u5ea6\uff1b\u5728\u4e5d\u7c7b\u4efb\u52a1\u4e2d\u4f18\u4e8e\u591a\u79cd\u8bad\u7ec3\u635f\u5931\uff0c\u65e0\u9700\u4fee\u6539\u6a21\u578b\u67b6\u6784\u6216\u63a8\u7406\u6d41\u7a0b\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14399", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u635f\u5931\u51fd\u6570", "\u5927\u6a21\u578b\u63a8\u7406", "\u65b9\u5dee\u964d\u4f4e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14399v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "REAL Loss: Optimizing Real Expected Acceptance Length for Speculative Decoding", "tldr": "\u63d0\u51faREAL\u635f\u5931\uff0c\u4ee5\u65e0\u504f\u4f30\u8ba1\u548c\u964d\u65b9\u5dee\u76f4\u63a5\u4f18\u5316\u63a8\u6d4b\u89e3\u7801\u7684\u771f\u5b9e\u671f\u671b\u63a5\u53d7\u957f\u5ea6\uff1b\u5728\u4e5d\u7c7b\u4efb\u52a1\u4e2d\u4f18\u4e8e\u591a\u79cd\u8bad\u7ec3\u635f\u5931\uff0c\u65e0\u9700\u4fee\u6539\u6a21\u578b\u67b6\u6784\u6216\u63a8\u7406\u6d41\u7a0b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hybrid models combine softmax attention with linear attention, which compresses history into fixed-size recurrent states to balance model quality and inference efficiency. However, linear attention has not pushed this compression to its limit: we find that the queries, keys, and values of linear layers concentrate in a stable, low-dimensional subspace, a phenomenon we call the linear attention sink, so each state is effectively low-rank, with a rank that varies across states. Yet existing serving systems keep these redundant states dense, reading and rewriting them in full at every decoding step, so their memory traffic grows with the batch size and dominates the decoding cost. Thus SinkState stores each recurrent state in an adaptive low-rank form throughout inference with buffered updates and a local SVD restricted to the top subspace. SinkState further consolidates the remaining components asynchronously on the CPU. On four hybrid models with Mamba-2 and Gated DeltaNet (GDN) layers, from 4B to 120B parameters, SinkState reduces the peak memory of recurrent states by up to 2.6x (1.9x on average) and speeds up decoding by up to 1.58x (1.25x on average) over Mamba-SSM and FLA, while maintaining accuracy.", "arxiv_id": "2611.14246", "arxiv_url": "https://arxiv.org/abs/2611.14246", "authors": ["Haolin Jiang", "Weihang Li", "Zhongzhu Zhou", "Jinwen Pan", "Santosh Pandey", "Hang Liu"], "brief": "SinkState\u901a\u8fc7\u5728\u7ebfSVD\u5c06\u6df7\u5408\u5927\u6a21\u578b\u7684\u5faa\u73af\u72b6\u6001\u81ea\u9002\u5e94\u4f4e\u79e9\u5b58\u50a8\uff0c\u5728\u4fdd\u6301\u7cbe\u5ea6\u7684\u540c\u65f6\uff0c\u72b6\u6001\u5cf0\u503c\u5185\u5b58\u5e73\u5747\u964d\u4f4e\u7ea647%\uff0c\u89e3\u7801\u5e73\u5747\u52a0\u901f25%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14246", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "\u7ebf\u6027\u6ce8\u610f\u529b", "\u4f4e\u79e9\u538b\u7f29", "\u5185\u5b58\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14246v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SinkState: On-the-Fly SVD of Recurrent States for Efficient Hybrid LLM Serving", "tldr": "SinkState\u901a\u8fc7\u5728\u7ebfSVD\u5c06\u6df7\u5408\u5927\u6a21\u578b\u7684\u5faa\u73af\u72b6\u6001\u81ea\u9002\u5e94\u4f4e\u79e9\u5b58\u50a8\uff0c\u5728\u4fdd\u6301\u7cbe\u5ea6\u7684\u540c\u65f6\uff0c\u72b6\u6001\u5cf0\u503c\u5185\u5b58\u5e73\u5747\u964d\u4f4e\u7ea647%\uff0c\u89e3\u7801\u5e73\u5747\u52a0\u901f25%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A vision-language model may take left-right direction from the orientation of image content within patches, its vision transformer\u0027s (ViT) position code, or token positions and order in its language model (LLM). Ablations show the ViT code is necessary; we test sufficiency by mirroring only a position code. In Qwen2.5-VL-7B, Qwen3-VL-4B and InternVL3-2B, mirroring ViT width positions reproduces the flipped-image answer on 84.3-93.2% of CV-Bench left-right questions (Qwen2.5-VL-3B: 87.5%, partly a left fallback). With two options, this also counts disruption; a half-grid shift flips most answers too. With the ViT code intact, LLM-side id and token-order mirrors change few left-right answers in all three series (a weak id test in Qwen2.5-VL). In Qwen2.5-VL-7B the effect sits in the global-attention ViT blocks, mostly the last. On What\u0027sUp, flipping content and token order, not the position code, keeps more on/under than left-right answers at the flipped-image answer. Post hoc analyses qualify these results. On CV-Bench items with located objects, random permutations flip 18.9-31.0 points more answers when reversing the objects\u0027 order than when keeping it. On What\u0027sUp, in Qwen2.5-VL and Qwen3-VL, the share of the left-right changes made by random permutations that land on the mirror relation is mostly below chance. Counted as returns to the original answer, the What\u0027sUp contrast of support with left-right relations is clear only in InternVL3-2B. Most remaining errors give the same relation whichever object is asked about, suggesting that repair may target relation binding, object localization or use of the reference object.", "arxiv_id": "2611.14060", "arxiv_url": "https://arxiv.org/abs/2611.14060", "authors": ["Enhao Cui", "Junzhi Yang", "Yaoshun Lin", "Yuhan Feng", "Zijian Chen"], "brief": "\u901a\u8fc7\u4f4d\u7f6e\u7f16\u7801\u53cd\u4e8b\u5b9e\u5e72\u9884\uff0c\u53d1\u73b0\u4e09\u7c7b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e3b\u8981\u4f9d\u8d56\u89c6\u89c9\u4f4d\u7f6e\u7f16\u7801\u5224\u65ad\u5de6\u53f3\uff1b\u4ec5\u955c\u50cf\u7f16\u7801\u5373\u53ef\u9ad8\u6bd4\u4f8b\u590d\u73b0\u7ffb\u56fe\u7b54\u6848\uff0c\u4f46\u90e8\u5206\u53d8\u5316\u6e90\u4e8e\u6270\u52a8\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14060", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4f4d\u7f6e\u7f16\u7801", "\u7a7a\u95f4\u63a8\u7406", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14060v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Where Do Vision-Language Models Get Left and Right? Position-Code Counterfactuals in Qwen2.5-VL, Qwen3-VL and InternVL3", "tldr": "\u901a\u8fc7\u4f4d\u7f6e\u7f16\u7801\u53cd\u4e8b\u5b9e\u5e72\u9884\uff0c\u53d1\u73b0\u4e09\u7c7b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e3b\u8981\u4f9d\u8d56\u89c6\u89c9\u4f4d\u7f6e\u7f16\u7801\u5224\u65ad\u5de6\u53f3\uff1b\u4ec5\u955c\u50cf\u7f16\u7801\u5373\u53ef\u9ad8\u6bd4\u4f8b\u590d\u73b0\u7ffb\u56fe\u7b54\u6848\uff0c\u4f46\u90e8\u5206\u53d8\u5316\u6e90\u4e8e\u6270\u52a8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Coding agents are increasingly proposed as autonomous builders of biomedical models, but existing benchmarks are small, near saturation or open to leaked information. We present BioXArena-Pro, 64 research-level modelling tasks from eight biomedical domains, each rebuilt from a published study; most hold out whole biological units such as species or cohorts. Across 22 agent configurations, the best scores 55.1 of 100, and the scaffold matters almost as much as the model. We re-ran a published method for every task: where the published recipe applies unchanged, the best agent and the methods tie; on rebuilt tasks the methods trail by 8.2 points, suggesting that agents gain by adapting to new data. Pretrained models (including biological foundation models) matter where the strongest agent uses them: forbidding them decreases its score on those tasks by 9 points. Every task was audited in several AI-assisted rounds and a final human review.", "arxiv_id": "2611.13994", "arxiv_url": "https://arxiv.org/abs/2611.13994", "authors": ["Loka Li", "Duzhen Zhang", "Xingbo Du", "Leonard Song", "Kun Zhang", "Le Song"], "brief": "\u63d0\u51fa\u8986\u76d6\u516b\u4e2a\u751f\u7269\u533b\u5b66\u9886\u57df\u768464\u9879\u7814\u7a76\u7ea7\u4efb\u52a1\u57fa\u51c6\uff0c\u8bc4\u6d4b22\u79cd\u667a\u80fd\u4f53\u914d\u7f6e\uff0c\u6700\u9ad8\u4ec555.1\u5206\uff1b\u7ed3\u679c\u663e\u793a\u667a\u80fd\u4f53\u6846\u67b6\u4e0e\u9884\u8bad\u7ec3\u6a21\u578b\u663e\u8457\u5f71\u54cd\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13994", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u751f\u7269\u533b\u5b66", "\u81ea\u4e3b\u667a\u80fd\u4f53", "\u673a\u5668\u5b66\u4e60\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13994v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BioXArena-Pro: a research-grade benchmark for autonomous biomedical machine learning agents", "tldr": "\u63d0\u51fa\u8986\u76d6\u516b\u4e2a\u751f\u7269\u533b\u5b66\u9886\u57df\u768464\u9879\u7814\u7a76\u7ea7\u4efb\u52a1\u57fa\u51c6\uff0c\u8bc4\u6d4b22\u79cd\u667a\u80fd\u4f53\u914d\u7f6e\uff0c\u6700\u9ad8\u4ec555.1\u5206\uff1b\u7ed3\u679c\u663e\u793a\u667a\u80fd\u4f53\u6846\u67b6\u4e0e\u9884\u8bad\u7ec3\u6a21\u578b\u663e\u8457\u5f71\u54cd\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Continual pre-training (CPT) adapts large language models (LLMs) to specialized domains, yet its standard next-token prediction (NTP) objective treats every corpus token as a fixed target, regardless of its utility to the current model. In a controlled study on the same 1B-token mathematical corpus, we observe sharply different outcomes across base models: NTP improves Llama-3.2-3B\u0027s performance on mathematical benchmarks but substantially degrades Qwen3-1.7B-Base\u0027s performance, indicating that, under a fixed training recipe, the same training sequences can have model-dependent effects. To address this problem, we introduce On-Policy Mid-Training Distillation (OPMD), which reformulates mid-training from offline text imitation into active, query-driven knowledge acquisition. At selected anchor positions, OPMD samples trajectories from the evolving student policy and applies dense token-level reverse-KL rewards from a frozen teacher, training the model on states it actually visits rather than only on ground-truth prefixes. This on-policy objective reduces the training-generation mismatch of teacher-forced NTP. On MATH-500 and Minerva, OPMD improves the Qwen student over its base performance and outperforms the evaluated NTP baseline, which degrades on both benchmarks. OPMD integrates into CPT pipelines without added inference-time overhead and offers a model-aware alternative to passive domain adaptation.", "arxiv_id": "2611.13855", "arxiv_url": "https://arxiv.org/abs/2611.13855", "authors": ["Ruize Zheng", "Xuyang Liu", "Siyu Ren", "Xiaobing Tu", "Yinggui Wang", "Jinkui Ren", "Xiantao Zhang", "Linfeng Zhang"], "brief": "\u63d0\u51fa\u5728\u7ebf\u7b56\u7565\u4e2d\u671f\u84b8\u998f\uff0c\u8ba9\u5b66\u751f\u6cbf\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u63a5\u53d7\u6559\u5e08\u53cd\u9988\uff1b\u5728\u6570\u5b66\u4efb\u52a1\u4e0a\u63d0\u5347Qwen\u8868\u73b0\uff0c\u4f18\u4e8e\u5bfc\u81f4\u6027\u80fd\u4e0b\u964d\u7684\u4f20\u7edf\u7eed\u8bad\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13855", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6301\u7eed\u9884\u8bad\u7ec3", "\u9886\u57df\u9002\u5e94", "\u6570\u5b66\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13855v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Passive Imitation: On-Policy Mid-Training Distillation for Language Models", "tldr": "\u63d0\u51fa\u5728\u7ebf\u7b56\u7565\u4e2d\u671f\u84b8\u998f\uff0c\u8ba9\u5b66\u751f\u6cbf\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u63a5\u53d7\u6559\u5e08\u53cd\u9988\uff1b\u5728\u6570\u5b66\u4efb\u52a1\u4e0a\u63d0\u5347Qwen\u8868\u73b0\uff0c\u4f18\u4e8e\u5bfc\u81f4\u6027\u80fd\u4e0b\u964d\u7684\u4f20\u7edf\u7eed\u8bad\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Optimized floating-point inference is not reproducible across environments: the same model on different hardware, compilers or thread counts can produce different bits. We present tritify, an open-source runtime that executes the forward pass of real models -- decoder-only language models, Mixture-of-Experts decoders, and the Segment Anything 2.1 image/video stack -- with the entire run-time path in exact integer arithmetic; floating point is confined to offline quantization and the float reference used for verification. We make three separate claims and verify each. (1) Cross-hardware reproducibility: the integer path produces bit-identical output run to run, across CPU instruction-set architectures, and across CPU/GPU, carried by a reproducing SHA-256 of the output. (2) Decision fidelity: the integer path reproduces the float reference\u0027s decision on the models and inputs tested, with the numeric exceptions measured; per-layer fidelity through sixteen layers of OLMoE-1B-7B and of a 106-billion-parameter MoE shows no fidelity cliff. (3) Location independence: a model\u0027s computation can be split across instruction sets, CPU and GPU, and networked machines with zero effect on the output bits. GLM-4.5-Air (106,852,251,264 parameters, 427 GB of integer codes) generated its answer across three machines, none of which can hold its integer codes in RAM, bit-identically to a single-host reference. The consequence is verifiable distributed inference: an untrusted server or a fleet of devices runs the model while an open scalar oracle re-derives the exact bytes; a guarantee against a dishonest server is future work. We do not claim a per-device speed-up, bit-equality of floating-valued intermediates, or confidentiality. Code: https://github.com/pelloran-inc/tritify", "arxiv_id": "2611.13730", "arxiv_url": "https://arxiv.org/abs/2611.13730", "authors": ["Sayed Amir Karim"], "brief": "\u63d0\u51fa\u7eaf\u6574\u6570\u63a8\u7406\u8fd0\u884c\u65f6 tritify\uff0c\u5728\u591a\u7c7b\u6a21\u578b\u4e0a\u5b9e\u73b0\u8de8\u786c\u4ef6\u9010\u4f4d\u4e00\u81f4\uff0c\u5e76\u57fa\u672c\u4fdd\u7559\u6d6e\u70b9\u51b3\u7b56\uff1b\u5343\u4ebf\u53c2\u6570\u6a21\u578b\u8de8\u4e09\u673a\u63a8\u7406\u4e0e\u5355\u673a\u4e00\u81f4\uff0c\u4e3a\u53ef\u9a8c\u8bc1\u5206\u5e03\u5f0f\u63a8\u7406\u63d0\u4f9b\u57fa\u7840\u3002", "categories": ["cs.LG", "cs.DC", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13730", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6574\u6570\u63a8\u7406", "\u53ef\u590d\u73b0\u6027", "\u5206\u5e03\u5f0f\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13730v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Deterministic, Reproducible Inference in Exact Integer Arithmetic, and Verifiable Distributed Inference as Its Consequence", "tldr": "\u63d0\u51fa\u7eaf\u6574\u6570\u63a8\u7406\u8fd0\u884c\u65f6 tritify\uff0c\u5728\u591a\u7c7b\u6a21\u578b\u4e0a\u5b9e\u73b0\u8de8\u786c\u4ef6\u9010\u4f4d\u4e00\u81f4\uff0c\u5e76\u57fa\u672c\u4fdd\u7559\u6d6e\u70b9\u51b3\u7b56\uff1b\u5343\u4ebf\u53c2\u6570\u6a21\u578b\u8de8\u4e09\u673a\u63a8\u7406\u4e0e\u5355\u673a\u4e00\u81f4\uff0c\u4e3a\u53ef\u9a8c\u8bc1\u5206\u5e03\u5f0f\u63a8\u7406\u63d0\u4f9b\u57fa\u7840\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Byte-level BPE fragments Chinese text (for Qwen3.8 on Chinese Wikipedia, 3.84 bytes per token on average; 64% of tokens are single characters) and hides spelling from the model. We ask whether an already-trained 27B subword model can be converted directly into a pure byte-level model (one byte, one token), without a patching structure or a local encoder, while keeping most of its ability. Starting from Qwen3.8-27B (48 Gated DeltaNet layers + 16 full-attention layers), we shrink the vocabulary from 248,320 to 384 entries (the 256 byte symbols already in the BPE vocabulary plus special ids), leave every other weight untouched, and continue training in a two-stage curriculum (encoding first, then reading) on 4.77 GB of supervised bytes: all dialogue/behavioral supervision is generated on-policy by the original model itself (character dictionary, word dictionary, general dialogue, coding sessions), and knowledge reading uses encyclopedia text (54% of supervised bytes). Training takes 178.6 h on 8xH200. On the same GPU and serving stack, the byte model\u0027s gap to the original falls within the paired bootstrap interval on MATH-500, HumanEval+, MMLU-Pro and non-thinking GSM8K, and it loses 4-6 points on C-Eval, thinking-mode GSM8K and non-thinking IFEval. Without thinking it leads on every character-level task (CUTE 75.2 -\u003e 84.0, EXECUTE-zho 81.6 -\u003e 93.9, our Chinese character suite 54.4 -\u003e 64.0), but lookup knowledge about Chinese characters such as pronunciation and stroke count drops, and thinking does not recover it. The cost is throughput: per-step speed is identical, but each step yields 3-5x less output; Chinese characters per second is about 1/4 of the original, and prefill at 64K bytes is 6.5x slower. We also document four byte-model failure modes (greedy runaway, sampling breaking UTF-8, ineffective penalty terms on a small vocabulary, repetition) and their fixes.", "arxiv_id": "2611.13607", "arxiv_url": "https://arxiv.org/abs/2611.13607", "authors": ["Liwei Zhang", "ZhiMing Tong"], "brief": "\u7528\u539f\u6a21\u578b\u81ea\u751f\u6210\u6570\u636e\uff0c\u5c0627B\u6df7\u5408\u6ce8\u610f\u529b\u6a21\u578b\u76f4\u63a5\u6539\u4e3a\u7eaf\u5b57\u8282\u6a21\u578b\uff0c\u4fdd\u7559\u591a\u6570\u63a8\u7406\u4e0e\u7f16\u7a0b\u80fd\u529b\u5e76\u63d0\u5347\u5b57\u7b26\u4efb\u52a1\u8868\u73b0\uff0c\u4f46\u4e2d\u6587\u8f93\u51fa\u901f\u5ea6\u964d\u81f3\u7ea6\u56db\u5206\u4e4b\u4e00\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13607", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5b57\u8282\u5efa\u6a21", "\u81ea\u751f\u6210\u6570\u636e", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5206\u8bcd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13607v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One Byte, One Token: Byteifying a 27B Hybrid-Attention LLM with Self-Generated Data", "tldr": "\u7528\u539f\u6a21\u578b\u81ea\u751f\u6210\u6570\u636e\uff0c\u5c0627B\u6df7\u5408\u6ce8\u610f\u529b\u6a21\u578b\u76f4\u63a5\u6539\u4e3a\u7eaf\u5b57\u8282\u6a21\u578b\uff0c\u4fdd\u7559\u591a\u6570\u63a8\u7406\u4e0e\u7f16\u7a0b\u80fd\u529b\u5e76\u63d0\u5347\u5b57\u7b26\u4efb\u52a1\u8868\u73b0\uff0c\u4f46\u4e2d\u6587\u8f93\u51fa\u901f\u5ea6\u964d\u81f3\u7ea6\u56db\u5206\u4e4b\u4e00\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Post-training improves language-model reasoning, but how it changes the use of internal information and verbalized chain of thought (CoT) remains unclear. We study successive SFT, DPO, and RLVR checkpoints of Olmo-3-7B-Instruct on multi-digit addition, using carry values as known intermediate state. Probes recover carry information from internal activations with similar accuracy in SFT and RLVR, although manipulating this information does not reliably control model outputs. In contrast, the usefulness of verbalized reasoning differs: CoTs produced by RLVR yield higher accuracy across receiving checkpoints than those produced by SFT or DPO. We also show that carry-related statements receive higher importance scores after RLVR than matched random controls. DPO shows similar sensitivity to carry-related statements but without comparable accuracy gains. These results suggest that post-training changes the usefulness of written reasoning and sensitivity to its content in meaningful ways, although greater sensitivity does not necessarily coincide with better problem performance.", "arxiv_id": "2611.13552", "arxiv_url": "https://arxiv.org/abs/2611.13552", "authors": ["Niall Dalton"], "brief": "\u901a\u8fc7\u591a\u4f4d\u6570\u52a0\u6cd5\u6bd4\u8f83\u4e0d\u540c\u540e\u8bad\u7ec3\u9636\u6bb5\uff0c\u53d1\u73b0RLVR\u672a\u660e\u663e\u63d0\u5347\u5185\u90e8\u8fdb\u4f4d\u4fe1\u606f\u7684\u53ef\u63a2\u6d4b\u6027\uff0c\u5374\u4f7f\u6587\u5b57\u63a8\u7406\u66f4\u6709\u6548\uff1b\u5bf9\u63a8\u7406\u5185\u5bb9\u66f4\u654f\u611f\u5e76\u4e0d\u5fc5\u7136\u63d0\u9ad8\u51c6\u786e\u7387\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13552", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u540e\u8bad\u7ec3", "\u601d\u7ef4\u94fe", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13552v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Post-Training Influences Verbalized Algorithmic Computation in Language Models", "tldr": "\u901a\u8fc7\u591a\u4f4d\u6570\u52a0\u6cd5\u6bd4\u8f83\u4e0d\u540c\u540e\u8bad\u7ec3\u9636\u6bb5\uff0c\u53d1\u73b0RLVR\u672a\u660e\u663e\u63d0\u5347\u5185\u90e8\u8fdb\u4f4d\u4fe1\u606f\u7684\u53ef\u63a2\u6d4b\u6027\uff0c\u5374\u4f7f\u6587\u5b57\u63a8\u7406\u66f4\u6709\u6548\uff1b\u5bf9\u63a8\u7406\u5185\u5bb9\u66f4\u654f\u611f\u5e76\u4e0d\u5fc5\u7136\u63d0\u9ad8\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Catalysis underpins chemical manufacturing, yet knowledge for catalyst design remains dispersed across experimental observations, computational data and catalysis subdisciplines. To overcome this challenge, we present Composable Catalytic Intelligence (CatAI), a physics-grounded modular AI framework that learns 1.8 million structure-property relations and organizes them into 30 physicochemical encoders. This reusable intermediate layer enables task-specific models to guide catalyst discovery for targeted reactions and objectives. Across benchmark tasks, CatAI achieves a 7.8% lower task-averaged prediction error than the next-best models. In experimental validation, CatAI identified a new confined-passable pocket catalyst applicable in industrial homogeneous polymer synthesis with 9 times the activity of the commercial benchmark. In parallel, it guided autonomous closed-loop optimization of a highly active Cu-based geminal-atom photocatalyst for C-O coupling reactions surpassing the traditional Ni-based systems. This approach connects property-level data to catalytic objectives, supporting physicochemical knowledge reuse across mechanistically distinct systems through computational screening and iterative model-experiment feedback.", "arxiv_id": "2611.13536", "arxiv_url": "https://arxiv.org/abs/2611.13536", "authors": ["Wentao Li", "Qilong Cai", "Qi Lei", "Jinxing Chen", "Ruixuan Chen", "Jiangjie Qiu", "Botian Wang", "Kai Zhao", "Honghao Chen", "Leyi Zhao", "Zemeng Wang", "Yijun Li", "Jun Yin", "Fangfang Li", "Hongxuan Liu", "Yingdong Lu", "Yawen Ouyang", "Manu Suvarna", "Wei-Ying Ma", "Ya-Qin Zhang", "Kostya S. Novoselov", "Hao Zhou", "Jiong Lu", "Xiaonan Wang"], "brief": "CatAI\u4ee5\u6a21\u5757\u5316\u7269\u7406\u5316\u5b66\u7f16\u7801\u590d\u7528\u50ac\u5316\u77e5\u8bc6\uff0c\u9884\u6d4b\u8bef\u5dee\u964d\u4f4e7.8%\uff1b\u5b9e\u9a8c\u53d1\u73b0\u6d3b\u6027\u8fbe\u5546\u4e1a\u57fa\u51c69\u500d\u7684\u65b0\u50ac\u5316\u5242\uff0c\u5e76\u652f\u6301\u81ea\u4e3b\u95ed\u73af\u4f18\u5316\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13536", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u50ac\u5316\u5242\u53d1\u73b0", "\u6a21\u5757\u5316\u5b66\u4e60", "\u79d1\u5b66\u667a\u80fd", "\u95ed\u73af\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13536v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Adaptive catalyst discovery emerges from composable scientific intelligence", "tldr": "CatAI\u4ee5\u6a21\u5757\u5316\u7269\u7406\u5316\u5b66\u7f16\u7801\u590d\u7528\u50ac\u5316\u77e5\u8bc6\uff0c\u9884\u6d4b\u8bef\u5dee\u964d\u4f4e7.8%\uff1b\u5b9e\u9a8c\u53d1\u73b0\u6d3b\u6027\u8fbe\u5546\u4e1a\u57fa\u51c69\u500d\u7684\u65b0\u50ac\u5316\u5242\uff0c\u5e76\u652f\u6301\u81ea\u4e3b\u95ed\u73af\u4f18\u5316\u3002", "upvotes": 0, "what_it_is": null, "w
