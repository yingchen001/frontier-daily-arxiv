<script>
const PAPERS = [{"abstract": "While frontier coding agents can generate high-quality 3D scenes and articulated assets, they struggle to create coherent long-horizon animations. When equipped with general-purpose harnesses, they frequently produce physically implausible outputs, generating objects that interpenetrate, lack physical support, or move unnaturally. Such bare agents struggle to repair these errors because they default to scripting the full animation in one pass, making it difficult to verify their work and disentangle complex spatiotemporal constraints. Drawing on the practice of human animators, we introduce DyCraft, a system for animated 3D scene generation that breaks animation into steps that coding agents can more reliably solve. DyCraft first expands the user\u0027s prompt into a detailed plan and builds a static scene. It then creates a 3D storyboard of key animation poses, where each frame is a static 3D scene that the agent can build and debug in isolation. Storyboarding decomposes the problem into pairs of verified start and end states, allowing the agent to author local motion between them with a collection of motion authoring tools. We evaluate DyCraft on 24 long-horizon, multi-shot animation tasks covering humanoid robots, human and animal characters, and physical mechanisms. Compared with a native GPT-6 agent in Codex and prior agentic baselines, DyCraft substantially reduces physical violations and generates higher-quality animated 3D scenes that are more often preferred by human raters.", "arxiv_id": "2610.40754", "arxiv_url": "https://arxiv.org/abs/2610.40754", "authors": ["Jeff Tan", "Hang Dai", "Zeqian Long", "Yanzhe Lyu", "R. Kenny Jones", "Shangzhe Wu", "Chen Geng", "Jiajun Wu"], "brief": "DyCraft\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5148\u89c4\u5212\u5e76\u642d\u5efa\u9759\u6001\u573a\u666f\uff0c\u518d\u751f\u6210\u53ef\u72ec\u7acb\u8c03\u8bd5\u7684\u5173\u952e\u59ff\u6001\u5206\u955c\uff1b\u4ee5\u9a8c\u8bc1\u540e\u7684\u8d77\u6b62\u \u6539\u4e3a\u53ef\u9a8c\u8bc1\u7684\u5206\u6bb5\u521b\u4f5c\uff0c\u7f13\u89e3\u590d\u6742\u65f6\u7a7a\u7ea6\u675f\u7684\u7ea0\u9519\u96be\u9898\uff1b\u76f8\u6bd4\u539f\u751f\u7f16\u7801\u667a\u80fd\u4f53\u53ca\u65e2\u6709\u57fa\u7ebf\uff0c\u4eba\u7c7b\u8bc4\u4ef7\u66f4\u504f\u597d\u5176\u7ed3\u679c\u3002"}, {"abstract": "External memory enables LLM agents to improve from experience by distilling trajectories of past tasks into concise lessons for new tasks. However, memory can also lead to memory-induced degradation, where an agent fails on tasks it would solve without memory, often because it follows a lesson that is incorrect, or misapplies or misreads a valid one. This is because lessons are inferred from trajectories labeled only with task success or failure, yet are typically provided without the trajectories they came from, leaving the agent no way to check them. To address this, we introduce WikiTrace, an evidence-linked memory system designed to let agents check each lesson against its original trajectory. Specifically, motivated by the finding that a trajectory often still holds the evidence needed to catch an erroneous lesson, WikiTrace stores each lesson as a concise insight linked to a summary of why its trajectory succeeded or failed and to the raw trajectory itself. Then, on a new task, the agent starts from all insights and, whenever one lacks details needed to act, conflicts with another, or comes from a failed task, descends through its links with terminal tools to fill in missing details or correct the insight before acting. We validate WikiTrace on five agentic benchmarks, showing that it consistently outperforms existing memory approaches and a baseline given the same insights alone, while also reducing memory-induced degradation. Our code is available at https://github.com/yukyeongleee/wikitrace", "arxiv_id": "2611.14320", "arxiv_url": "https://arxiv.org/abs/2611.14320", "authors": ["Yukyeong Lee", "Yumin Choi", "Jinheon Baek", "Sung Ju Hwang"], "brief": "WikiTrace\u628a\u7ecf\u9a8c\u8981\u70b9\u3001\u6210\u8d25\u539f\u56e0\u6458\u8981\u548c\u539f\u59cb\u8f68\u8ff9\u5206\u5c42\u94fe\u63a5\u3002\u667a\u80fd\u4f53\u9047\u5230\u4fe1\u606f\u4e0d\u8db3\u3001\u7ecf\u9a8c\u51b2\u7a81\u6216\u5931\u8d25\u4efb\u52a1\u7ecf\u9a8c\u65f6\uff0c\u7528\u7ec8\u7aef\u5de5\u5177\u8ffd\u6eaf\u8bc1\u636e\u5e76\u4fee\u6b63\u5224\u65ad\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": "https://github.com/yukyeongleee/wikitrace", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.14320", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["WikiTrace\u4ee5\u7ecf\u9a8c\u8981\u70b9\u3001\u6210\u8d25\u6458\u8981\u3001\u539f\u59cb\u8f68\u8ff9\u7ec4\u7ec7\u8bb0\u5fc6", "\u4fe1\u606f\u4e0d\u8db3\u3001\u7ecf\u9a8c\u51b2\u7a81\u6216\u6765\u81ea\u5931\u8d25\u4efb\u52a1\u65f6\uff0c\u89e6\u53d1\u8bc1\u636e\u8ffd\u6eaf", "\u57285\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u8bb0\u5fc6\u65b9\u6cd5\u53ca\u4ec5\u7528\u76f8\u540c\u8981\u70b9\u7684\u57fa\u7ebf"], "keywords": ["\u667a\u80fd\u4f53", "\u5916\u90e8\u8bb0\u5fc6", "\u8bc1\u636e\u8ffd\u6eaf"], "num_comments": 7, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2611.14320v1", "published_at": "2026-11-10", "score": 0.559, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (51\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14320.png", "title": "Don\u0027t Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents", "tldr": "\u5c06\u7ecf\u9a8c\u8bb0\u5fc6\u94fe\u63a5\u5230\u539f\u59cb\u4efb\u52a1\u8bc1\u636e\uff0c\u8ba9\u667a\u80fd\u4f53\u884c\u52a8\u524d\u6838\u67e5\uff0c\u51cf\u5c11\u8bb0\u5fc6\u8bef\u5bfc\u3002", "upvotes": 51, "what_it_is": "WikiTrace\u628a\u7ecf\u9a8c\u8981\u70b9\u3001\u6210\u8d25\u539f\u56e0\u6458\u8981\u548c\u539f\u59cb\u8f68\u8ff9\u5206\u5c42\u94fe\u63a5\u3002\u667a\u80fd\u4f53\u9047\u5230\u4fe1\u606f\u4e0d\u8db3\u3001\u7ecf\u9a8c\u51b2\u7a81\u6216\u5931\u8d25\u4efb\u52a1\u7ecf\u9a8c\u65f6\uff0c\u7528\u7ec8\u7aef\u5de5\u5177\u8ffd\u6eaf\u8bc1\u636e\u5e76\u4fee\u6b63\u5224\u65ad\u3002", "why_notable": "\u5b83\u5c06\u8bb0\u5fc6\u4ece\u76f4\u63a5\u91c7\u4fe1\u7684\u7ecf\u9a8c\u53d8\u6210\u53ef\u6838\u67e5\u7684\u8bc1\u636e\u5165\u53e3\uff0c\u4e3a\u667a\u80fd\u4f53\u51cf\u5c11\u9519\u8bef\u7ecf\u9a8c\u3001\u8bef\u8bfb\u4e0e\u8bef\u7528\u9020\u6210\u7684\u6027\u80fd\u9000\u5316\u63d0\u4f9b\u4e86\u5b9e\u8bc1\u652f\u6301\u3002"}, {"abstract": "While modern video generative models achieve remarkable visual fidelity, they remain noticeably brittle when generating physically plausible dynamics and complex interactions. Targeted post-training is crucial, yet supervised fine-tuning suffers from offline state mismatch, and reinforcement learning is hindered by sparse, ill-defined physical reward functions. On-Policy (Self-)Distillation (OPSD) reconciles on-policy rollouts with dense corrective feedback, shifting the core challenge to designing effective privileged context. However, conventional modalities fall short: text prompts are inherently declarative, whereas real reference videos heavily entangle physical laws with visual appearance without parametric control. To this end, we propose PhysOPSD, introducing executable code as privileged physical context for video generation. Unlike static visual observations, executable code instantiates an editable physical world with intrinsic abstraction and controllability. Powered by PhysOPSD-Engine, we translate real-world physical scenarios into verifiable simulation programs. PhysOPSD then incorporates (i) dual-level physical privilege to bridge the information gap via an intermediate bottleneck, alongside (ii) controlled physical variations under shared rollout noise to expose causal dynamic shifts. Extensive experiments demonstrate that PhysOPSD substantially improves physical plausibility across diverse backbones, outperforming SFT and RL baselines with only $3$K samples, while preserving general video generation quality.", "arxiv_id": "2611.12411", "arxiv_url": "https://arxiv.org/abs/2611.12411", "authors": ["Harold Haodong Chen", "Rui Peng", "Lingteng Qiu", "Kejie Qiu", "Chao Xu", "Zilong Dong"], "brief": "PhysOPSD\u5c06\u771f\u5b9e\u7269\u7406\u573a\u666f\u8f6c\u4e3a\u53ef\u9a8c\u8bc1\u7684\u4eff\u771f\u7a0b\u5e8f\uff0c\u4f5c\u4e3a\u89c6\u9891\u751f\u6210\u7684\u7279\u6743\u4e0a\u4e0b\u6587\u3002\u901a\u8fc7\u53cc\u5c42\u7269\u7406\u7279\u6743\u4e0e\u5171\u4eab\u566a\u58f0\u4e0b\u7684\u53d7\u63a7\u53d8\u5316\uff0c\u4e3a\u540c\u7b56\u7565\u81ea\u84b8\u998f\u63d0\u4f9b\u7ea0\u6b63\u53cd\u9988\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/aigc3d/PhysOPSD", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.12411", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["PhysOPSD-Engine\u5c06\u7269\u7406\u573a\u666f\u8f6c\u4e3a\u53ef\u9a8c\u8bc1\u4eff\u771f\u7a0b\u5e8f", "\u53cc\u5c42\u7269\u7406\u7279\u6743\u901a\u8fc7\u4e2d\u95f4\u74f6\u9888\u5f25\u5408\u4fe1\u606f\u5dee", "\u4ec5\u75283K\u6837\u672c\u8d85\u8d8aSFT\u4e0eRL\u57fa\u7ebf\uff0c\u4fdd\u6301\u751f\u6210\u8d28\u91cf"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7269\u7406\u4eff\u771f", "\u81ea\u84b8\u998f"], "num_comments": 3, "on_hf": true, "organization": "TongyiLab", "pdf_url": "https://arxiv.org/pdf/2611.12411v1", "published_at": "2026-11-09", "score": 0.513, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12411.png", "title": "PhysOPSD: Code as Privilege for Physically Plausible Video Generation", "tldr": "\u4ee5\u53ef\u6267\u884c\u4eff\u771f\u4ee3\u7801\u6307\u5bfc\u89c6\u9891\u6a21\u578b\u81ea\u84b8\u998f\uff0c\u7528\u5c11\u91cf\u6837\u672c\u63d0\u5347\u751f\u6210\u52a8\u6001\u7684\u7269\u7406\u5408\u7406\u6027\u3002", "upvotes": 8, "what_it_is": "PhysOPSD\u5c06\u771f\u5b9e\u7269\u7406\u573a\u666f\u8f6c\u4e3a\u53ef\u9a8c\u8bc1\u7684\u4eff\u771f\u7a0b\u5e8f\uff0c\u4f5c\u4e3a\u89c6\u9891\u751f\u6210\u7684\u7279\u6743\u4e0a\u4e0b\u6587\u3002\u901a\u8fc7\u53cc\u5c42\u7269\u7406\u7279\u6743\u4e0e\u5171\u4eab\u566a\u58f0\u4e0b\u7684\u53d7\u63a7\u53d8\u5316\uff0c\u4e3a\u540c\u7b56\u7565\u81ea\u84b8\u998f\u63d0\u4f9b\u7ea0\u6b63\u53cd\u9988\u3002", "why_notable": "\u628a\u4ee3\u7801\u7684\u53ef\u63a7\u6027\u5f15\u5165\u7269\u7406\u89c6\u9891\u540e\u8bad\u7ec3\uff0c\u51cf\u5c11\u5bf9\u7269\u7406\u5956\u52b1\u8bbe\u8ba1\u7684\u4f9d\u8d56\uff1b\u8de8\u9aa8\u5e72\u6a21\u578b\u7684\u63d0\u5347\u663e\u793a\u4e86\u8fd9\u4e00\u8bad\u7ec3\u8def\u5f84\u7684\u6f5c\u529b\u3002"}, {"abstract": "Few-step sampling reduces the cost of streaming video generation. Distribution Matching Distillation (DMD) supervises few-step generators with a separate fake-score network, which adds training memory and computation and must track the evolving generator. We extend APEX to streaming video by using condition shifting to estimate the velocity field of the generated distribution within the generator. The original text condition selects generation, while a shifted condition selects fake estimation using the same parameters. This removes the independent fake network while retaining S2-Avatar\u0027s frozen reference teacher, Self-Replay Forcing, and perceptual regularization. We evaluate APEX on 180-second videos using three backbone evaluations per block and a one-step spatial Refiner, with a 70-case human study and a 320-case StreamAV-Bench comparison. Compared with S2-Avatar, APEX achieves higher video instruction fulfillment on the Progressive track (3.856 versus 3.831) and higher visual aesthetics across both tracks (0.641898 versus 0.632606). Human raters favor APEX most strongly on instruction following, with +30.0% net preference, followed by consistency and video quality at +4.3% each. Motion quality favors S2-Avatar, audiovisual synchronization is predominantly tied, and usability is unchanged. Separate measurements under matched training settings show 4.4% lower peak allocated GPU memory per GPU and 9.2% shorter mean iteration time than DMD.", "arxiv_id": "2611.14033", "arxiv_url": "https://arxiv.org/abs/2611.14033", "authors": ["Deyuan Liu", "Jungang Li", "Kaiwen Zheng", "Kai Jiang", "Jintao Chen", "Yaole Wang", "Ming Lin", "Tao Lin", "Jianfei Chen", "Jun Zhu", "Jintao Zhang"], "brief": "\u5c06APEX\u6269\u5c55\u81f3\u6d41\u5f0f\u89c6\u9891\u751f\u6210\uff1a\u539f\u59cb\u6587\u672c\u6761\u4ef6\u7528\u4e8e\u751f\u6210\uff0c\u504f\u79fb\u6761\u4ef6\u7528\u4e8e\u4f30\u8ba1\u751f\u6210\u5206\u5e03\u7684\u901f\u5ea6\u573a\uff0c\u5171\u4eab\u53c2\u6570\u66ff\u4ee3DMD\u72ec\u7acb\u4f2a\u8bc4\u5206\u7f51\u7edc\uff0c\u4fdd\u7559\u51bb\u7ed3\u6559\u5e08\u4e0e\u56de\u653e\u8bad\u7ec3\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14033", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6761\u4ef6\u504f\u79fb\u66ff\u4ee3\u72ec\u7acb\u4f2a\u8bc4\u5206\u7f51\u7edc\uff0c\u663e\u5b58\u964d4.4%\u3001\u8fed\u4ee3\u8017\u65f6\u964d9.2%", "\u8bc4\u6d4b180\u79d2\u89c6\u9891\uff0c\u6bcf\u57573\u6b21\u9aa8\u5e72\u8bc4\u4f30\u52a0\u5355\u6b65\u7a7a\u95f4Refiner", "70\u4f8b\u4eba\u5de5\u8bc4\u6d4b\u4e2d\uff0c\u6307\u4ee4\u9075\u5faa\u51c0\u504f\u597d\u63d0\u534730.0%"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6a21\u578b\u84b8\u998f", "\u5c11\u6b65\u91c7\u6837", "\u6761\u4ef6\u63a7\u5236"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2611.14033v1", "published_at": "2026-11-10", "score": 0.504, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (66\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14033.png", "title": "Few-Step Streaming Video Generation via Condition Shifting", "tldr": "\u901a\u8fc7\u6761\u4ef6\u504f\u79fb\u5171\u4eab\u751f\u6210\u4e0e\u5206\u5e03\u4f30\u8ba1\u7f51\u7edc\uff0c\u964d\u4f4e\u5c11\u6b65\u6d41\u5f0f\u89c6\u9891\u8bad\u7ec3\u6210\u672c\u5e76\u6539\u5584\u6307\u4ee4\u9075\u5faa\u3002", "upvotes": 66, "what_it_is": "\u5c06APEX\u6269\u5c55\u81f3\u6d41\u5f0f\u89c6\u9891\u751f\u6210\uff1a\u539f\u59cb\u6587\u672c\u6761\u4ef6\u7528\u4e8e\u751f\u6210\uff0c\u504f\u79fb\u6761\u4ef6\u7528\u4e8e\u4f30\u8ba1\u751f\u6210\u5206\u5e03\u7684\u901f\u5ea6\u573a\uff0c\u5171\u4eab\u53c2\u6570\u66ff\u4ee3DMD\u72ec\u7acb\u4f2a\u8bc4\u5206\u7f51\u7edc\uff0c\u4fdd\u7559\u51bb\u7ed3\u6559\u5e08\u4e0e\u56de\u653e\u8bad\u7ec3\u3002", "why_notable": "\u628a\u5206\u5e03\u4f30\u8ba1\u5e76\u5165\u751f\u6210\u5668\uff0c\u5728\u964d\u4f4e\u8bad\u7ec3\u5f00\u9500\u7684\u540c\u65f6\u6539\u5584\u957f\u89c6\u9891\u6307\u4ee4\u9075\u5faa\u4e0e\u7f8e\u611f\uff1b\u4f46\u8fd0\u52a8\u8d28\u91cf\u4ecd\u843d\u540e\u4e8e\u5bf9\u7167\u65b9\u6cd5\u3002"}, {"abstract": "Trained action policies write manipulation skill into network weights, tying what is learned to the distribution it is learned from. In-context learning (ICL) avoids this coupling but has not matched trained policies, because a demonstration recorded in another scene carries no feedback from the world the robot currently faces. We observe that what an agent learns in context is semantic, recording task steps and object roles rather than visual appearance, so experience gathered in one world transfers to another. Based on this insight, we propose World In-Context Learning (WICL), a paradigm in which a frozen model starts from a demonstration, rehearses the task in a world such as a simulator, and writes the feedback into its context rather than its weights. We build RoboScript, a modular infrastructure that implements WICL for agentic manipulation. From a single demonstration, RoboScript learns each task through rehearsal in simulation, freezes the learned knowledge as a Task Memory, and deploys the frozen memory on new scenes with data isolation that ensures every deployment input is available on a real robot. On all 50 tasks of RoboTwin 2.0, RoboScript reaches 83.4% mean success across clean and randomized settings with one demonstration per task and no gradient updates, exceeding the strongest trained action policy by over 20 points. The method generalizes across visual distributions, improves through reflection, scales with the foundation model, and transfers to a physical dual-arm robot through cross-embodiment memory adaptation. With a world in the loop, a robot can learn a manipulation task in its context as well as it learns one in its weights. All code is available at https://github.com/ArcheOne-AI/RoboScript", "arxiv_id": "2611.12885", "arxiv_url": "https://arxiv.org/abs/2611.12885", "authors": ["Heng Fang", "Zehui Guo", "Yuehan Zhang", "Mingyang Du", "Dingkang Liang", "Xiang Bai"], "brief": "\u63d0\u51fa\u4e16\u754c\u4e0a\u4e0b\u6587\u5b66\u4e60WICL\uff0c\u5e76\u4ee5RoboScript\u5b9e\u73b0\uff1a\u51bb\u7ed3\u6a21\u578b\u4ece\u5355\u6b21\u793a\u8303\u51fa\u53d1\uff0c\u5728\u4eff\u771f\u4e2d\u6f14\u7ec3\u5e76\u5c06\u53cd\u9988\u5199\u5165\u4efb\u52a1\u8bb0\u5fc6\uff0c\u518d\u8fc1\u79fb\u81f3\u65b0\u573a\u666f\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/ArcheOne-AI/RoboScript", "github_stars": 47, "hf_url": "https://huggingface.co/papers/2611.12885", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["WICL\u5c06\u6f14\u7ec3\u53cd\u9988\u5199\u5165\u4e0a\u4e0b\u6587\uff0c\u5168\u7a0b\u65e0\u68af\u5ea6\u66f4\u65b0", "RoboTwin 2.0\u5168\u90e850\u9879\u4efb\u52a1\u5e73\u5747\u6210\u529f\u738783.4%", "\u7ecf\u8de8\u672c\u4f53\u8bb0\u5fc6\u9002\u914d\uff0c\u8fc1\u79fb\u5230\u5b9e\u4f53\u53cc\u81c2\u673a\u5668\u4eba"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u4eff\u771f\u8fc1\u79fb", "\u667a\u80fd\u4f53"], "num_comments": 3, "on_hf": true, "organization": "ArcheOne-AI", "pdf_url": "https://arxiv.org/pdf/2611.12885v1", "published_at": "2026-11-09", "score": 0.501, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (64\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12885.png", "title": "World In-Context Learning for Agentic Robot Manipulation", "tldr": "\u8ba9\u51bb\u7ed3\u6a21\u578b\u901a\u8fc7\u4eff\u771f\u6f14\u7ec3\u79ef\u7d2f\u4e0a\u4e0b\u6587\u8bb0\u5fc6\uff0c\u5355\u6b21\u793a\u8303\u5373\u53ef\u5b66\u4e60\u5e76\u8fc1\u79fb\u673a\u5668\u4eba\u64cd\u4f5c", "upvotes": 64, "what_it_is": "\u63d0\u51fa\u4e16\u754c\u4e0a\u4e0b\u6587\u5b66\u4e60WICL\uff0c\u5e76\u4ee5RoboScript\u5b9e\u73b0\uff1a\u51bb\u7ed3\u6a21\u578b\u4ece\u5355\u6b21\u793a\u8303\u51fa\u53d1\uff0c\u5728\u4eff\u771f\u4e2d\u6f14\u7ec3\u5e76\u5c06\u53cd\u9988\u5199\u5165\u4efb\u52a1\u8bb0\u5fc6\uff0c\u518d\u8fc1\u79fb\u81f3\u65b0\u573a\u666f\u3002", "why_notable": "\u6bcf\u4efb\u52a1\u4ec5\u7528\u4e00\u6b21\u793a\u8303\uff0c\u6210\u529f\u7387\u4ecd\u8d85\u8fc7\u6700\u5f3a\u8bad\u7ec3\u5f0f\u52a8\u4f5c\u7b56\u756520\u4e2a\u767e\u5206\u70b9\u4ee5\u4e0a\uff0c\u5c55\u793a\u4e86\u4ee5\u53ef\u8fc1\u79fb\u8bb0\u5fc6\u66ff\u4ee3\u6743\u91cd\u66f4\u65b0\u7684\u6f5c\u529b\u3002"}, {"abstract": "Scientific discovery requires ideas that are original, useful, and non-obvious. Yet AI scientists are typically given as much task information as possible during idea generation, which can anchor generation toward familiar approaches. Inspired by the cognitive framework of Blind Variation and Selective Retention (BVSR), we propose a discovery framework that separates these two roles of information: it generates proposals under deliberately limited task information to broaden exploration, then learns from proposals previously verified on the same task and their outcomes to retain promising candidates for costly empirical evaluation. We evaluate BVSR across five proposer models and 12 scientific tasks. Limiting task information substantially increases proposal originality and non-obviousness, and produces a larger share of highly creative and high-utility proposals than existing state-of-the-art prompting-based baselines. Learning from prior proposal outcomes on the task further improves candidate selection, discarding half of the candidates while retaining most top-performing proposals. When incorporated into existing AI-scientist workflows, BVSR achieves stronger discoveries across gene expression analysis, drug response prediction, anomaly detection, scaling law discovery, and brain activity prediction. These results suggest that effective AI scientists should use information differently across stages of discovery: constrain task-specific information during exploration while exploiting accumulated empirical experience on the task.", "arxiv_id": "2611.12184", "arxiv_url": "https://arxiv.org/abs/2611.12184", "authors": ["Guowei Xu", "Jiaru Zou", "Mete Erdogan", "Haotian Ye", "Pan Lu", "James Zou"], "brief": "\u63d0\u51faBVSR\u6846\u67b6\uff0c\u5c06\u521b\u610f\u751f\u6210\u4e0e\u5019\u9009\u7b5b\u9009\u5206\u5f00\uff1a\u751f\u6210\u65f6\u523b\u610f\u9650\u5236\u4efb\u52a1\u4fe1\u606f\u4ee5\u62d3\u5bbd\u63a2\u7d22\uff0c\u7b5b\u9009\u65f6\u5b66\u4e60\u540c\u4efb\u52a1\u65e2\u5f80\u63d0\u6848\u53ca\u5b9e\u9a8c\u7ed3\u679c\uff0c\u4fdd\u7559\u503c\u5f97\u9a8c\u8bc1\u7684\u5019\u9009\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/zou-group/BVSR", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.12184", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57285\u4e2a\u63d0\u6848\u6a21\u578b\u300112\u9879\u79d1\u5b66\u4efb\u52a1\u4e0a\u8bc4\u4f30BVSR", "\u9650\u5236\u4efb\u52a1\u4fe1\u606f\uff0c\u63d0\u5347\u539f\u521b\u6027\u4e0e\u975e\u663e\u800c\u6613\u89c1\u6027", "\u5b66\u4e60\u5386\u53f2\u7ed3\u679c\uff0c\u5254\u9664\u4e00\u534a\u5019\u9009\u5e76\u4fdd\u7559\u591a\u6570\u9ad8\u8868\u73b0\u63d0\u6848"], "keywords": ["AI\u79d1\u5b66\u5bb6", "\u521b\u610f\u751f\u6210", "\u5019\u9009\u7b5b\u9009", "\u79d1\u5b66\u53d1\u73b0"], "num_comments": 3, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2611.12184v1", "published_at": "2026-11-09", "score": 0.495, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12184.png", "title": "Blind Variation, Selective Retention: Improving Creative Idea Generation in AI Scientists", "tldr": "\u901a\u8fc7\u9650\u5236\u6784\u601d\u4fe1\u606f\u3001\u5229\u7528\u5386\u53f2\u5b9e\u9a8c\u7b5b\u9009\uff0c\u63d0\u5347AI\u79d1\u5b66\u5bb6\u7684\u521b\u610f\u4e0e\u53d1\u73b0\u8d28\u91cf\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51faBVSR\u6846\u67b6\uff0c\u5c06\u521b\u610f\u751f\u6210\u4e0e\u5019\u9009\u7b5b\u9009\u5206\u5f00\uff1a\u751f\u6210\u65f6\u523b\u610f\u9650\u5236\u4efb\u52a1\u4fe1\u606f\u4ee5\u62d3\u5bbd\u63a2\u7d22\uff0c\u7b5b\u9009\u65f6\u5b66\u4e60\u540c\u4efb\u52a1\u65e2\u5f80\u63d0\u6848\u53ca\u5b9e\u9a8c\u7ed3\u679c\uff0c\u4fdd\u7559\u503c\u5f97\u9a8c\u8bc1\u7684\u5019\u9009\u3002", "why_notable": "\u5b83\u8868\u660e\u66f4\u591a\u4efb\u52a1\u4fe1\u606f\u672a\u5fc5\u5e26\u6765\u66f4\u597d\u7684\u79d1\u5b66\u521b\u610f\uff1b\u5206\u9636\u6bb5\u4f7f\u7528\u4fe1\u606f\uff0c\u53ef\u517c\u987e\u63a2\u7d22\u591a\u6837\u6027\u4e0e\u5b9e\u9a8c\u7b5b\u9009\u6548\u7387\uff0c\u5e76\u6539\u5584\u591a\u4e2a\u9886\u57df\u7684\u53d1\u73b0\u8d28\u91cf\u3002"}, {"abstract": "Early successes on agentic robotics point to a potential paradigm shift toward using coding agents to control robots. Existing robotics benchmarks are built around visuomotor policy learning, leaving it open whether coding agents can reliably control diverse robots under physical-world constraints. We therefore introduce the Embodied First Exam, a unified, comprehensive, and agent-native evaluation framework where coding agents can choose their own control approach: direct control, code to control, or train a policy to control. We hope it serves as a first exam for coding agents before they enter the physical world, with 1,156 tasks in 35 suites on 47 robots, including 9 new suites that go beyond pick-and-place to spatial puzzles, dexterous manipulation, multi-robot interaction, dynamic whole-body control, and sim-to-sim engineering. Each task can be run in up to three evaluation settings. The Standard Setting mimics the real world: the agent receives only sensor observations and, by default, cannot reset the environment. Its Realtime variant keeps the environment running while the agent reasons. The Privileged Setting gives the agent access to the full simulator state and unlimited resets, allowing it to search for an oracle solution for training purposes. Success rates in this setting serve as an approximate upper bound. On the 456 core tasks, the strongest of eight agents, GPT-6 Astra in Codex, achieves a success rate of 34% in the Standard Setting, leaving much room for improvement. To see where agents fail, we label the stage at which failed attempts go wrong and compare failures across agents, settings, and stage categories.", "arxiv_id": "2611.12177", "arxiv_url": "https://arxiv.org/abs/2611.12177", "authors": ["Kangrui Wang", "Qineng Wang", "Changhe Chen", "Pingyue Zhang", "Chi Gui", "Feishi Wang", "Canyu Chen", "Wenli Xiao", "Xiaoyu Huang", "Tonghe Zhang", "Linjie Li", "Zihan Wang", "Minyeong Kim", "Yiyou Sun", "Mingkai Deng", "Jinyu Hou", "Qi Zhu", "Han Liu", "Eric P. Xing", "Huaxiu Yao", "Zhiwen Fan", "Yuejiang Liu", "Dawn Song", "Pieter Abbeel", "Li Fei-Fei", "Jiajun Wu", "Yuke Zhu", "Guanya Shi", "Ruohan Zhang", "Manling Li"], "brief": "\u63d0\u51fa\u9762\u5411\u7f16\u7801\u667a\u80fd\u4f53\u7684\u673a\u5668\u4eba\u8bc4\u6d4b\u6846\u67b6\uff0c\u5141\u8bb8\u81ea\u4e3b\u9009\u62e9\u76f4\u63a5\u63a7\u5236\u3001\u7f16\u5199\u63a7\u5236\u4ee3\u7801\u6216\u8bad\u7ec3\u7b56\u7565\uff0c\u5e76\u901a\u8fc7\u6807\u51c6\u3001\u5b9e\u65f6\u4e0e\u7279\u6743\u8bbe\u7f6e\u68c0\u9a8c\u7269\u7406\u7ea6\u675f\u4e0b\u7684\u8868\u73b0\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/mll-lab-nu/embodied-first-exam", "github_stars": 259, "hf_url": "https://huggingface.co/papers/2611.12177", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d61156\u9879\u4efb\u52a1\u300135\u4e2a\u5957\u4ef6\u548c47\u79cd\u673a\u5668\u4eba", "\u6807\u51c6\u8bbe\u7f6e\u9ed8\u8ba4\u7981\u91cd\u7f6e\uff0c\u5b9e\u65f6\u53d8\u4f53\u5728\u63a8\u7406\u65f6\u6301\u7eed\u8fd0\u884c", "8\u4e2a\u667a\u80fd\u4f53\u53c2\u8bc4\uff0c456\u9879\u6838\u5fc3\u4efb\u52a1\u6700\u9ad8\u6210\u529f\u738734%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u7f16\u7801\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u63a7\u5236", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 3, "on_hf": true, "organization": "MLL Lab", "pdf_url": "https://arxiv.org/pdf/2611.12177v1", "published_at": "2026-11-09", "score": 0.487, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12177.png", "title": "Embodied First Exam", "tldr": "\u7528\u7edf\u4e00\u673a\u5668\u4eba\u8003\u573a\u68c0\u9a8c\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u6700\u5f3a\u6a21\u578b\u5728\u6807\u51c6\u8bbe\u7f6e\u4e0b\u6210\u529f\u7387\u4ec5\u4e3a34%\u3002", "upvotes": 20, "what_it_is": "\u63d0\u51fa\u9762\u5411\u7f16\u7801\u667a\u80fd\u4f53\u7684\u673a\u5668\u4eba\u8bc4\u6d4b\u6846\u67b6\uff0c\u5141\u8bb8\u81ea\u4e3b\u9009\u62e9\u76f4\u63a5\u63a7\u5236\u3001\u7f16\u5199\u63a7\u5236\u4ee3\u7801\u6216\u8bad\u7ec3\u7b56\u7565\uff0c\u5e76\u901a\u8fc7\u6807\u51c6\u3001\u5b9e\u65f6\u4e0e\u7279\u6743\u8bbe\u7f6e\u68c0\u9a8c\u7269\u7406\u7ea6\u675f\u4e0b\u7684\u8868\u73b0\u3002", "why_notable": "\u5c06\u673a\u5668\u4eba\u8bc4\u6d4b\u4ece\u89c6\u89c9\u8fd0\u52a8\u7b56\u7565\u6269\u5c55\u5230\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u5e76\u7528\u53d7\u9650\u89c2\u6d4b\u3001\u5b9e\u65f6\u8fd0\u884c\u548c\u5931\u8d25\u9636\u6bb5\u6807\u6ce8\uff0c\u63ed\u793a\u5176\u8d70\u5411\u7269\u7406\u4e16\u754c\u7684\u80fd\u529b\u7f3a\u53e3\u3002"}, {"abstract": "While multimodal agents now carry out complex data analysis with tools, their ability to turn decades of satellite imagery into reliable land-change analysis, crucial for Earth observation science, remains unmeasured. Existing benchmarks fall short: they pose questions on curated images or give agents preprocessed inputs, leaving out the raw multi-sensor archives where such analysis begins. We introduce EarthRecord, a benchmark built on the raw record of 56 sites: four decades of Landsat, MODIS, VIIRS, and Sentinel-2 data, with cloud masking and cross-sensor harmonization left to the agent. It poses 238 land-change questions across ten analysis tasks, scored against withheld references from global products, agreement among methods, and visual interpretation. Two controls test what answers rest on: the closed book removes the record, and instrument pairs alter one satellite\u0027s data while nothing changes on the ground. Evaluations of twelve multimodal agents reveal that leading agents complete most analyses end to end but falter when an answer requires mapping from imagery. Further analysis shows that the record moves answers from prior knowledge to the pixels but not yet to the real change on the ground: when one satellite\u0027s data are altered, half of the right answers follow the alteration. EarthRecord thus provides a principled platform for measuring and advancing agents from pixels to land change.", "arxiv_id": "2611.12934", "arxiv_url": "https://arxiv.org/abs/2611.12934", "authors": ["Haoran Zhang", "Huizhen Sun", "Hanbin Wen", "Jie Leng", "Jiaxin Zhu", "Zhaohua Sun"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u539f\u59cb\u591a\u4f20\u611f\u5668\u536b\u661f\u6863\u6848\u7684\u5730\u8868\u53d8\u5316\u5206\u6790\u57fa\u51c6\uff0c\u8ba9\u667a\u80fd\u4f53\u81ea\u884c\u53bb\u4e91\u3001\u534f\u8c03\u4f20\u611f\u5668\u5dee\u5f02\uff0c\u5e76\u901a\u8fc7\u9690\u85cf\u53c2\u8003\u4e0e\u5bf9\u7167\u5b9e\u9a8c\u68c0\u9a8c\u7b54\u6848\u4f9d\u636e\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": "https://github.com/ranranrannervous/EarthRecord", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.12934", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d656\u4e2a\u7ad9\u70b9\u3001\u56db\u5341\u5e74\u5f71\u50cf\u53ca238\u9053\u9898\u3001\u5341\u7c7b\u4efb\u52a1", "\u95ed\u5377\u4e0e\u5355\u661f\u6570\u636e\u6270\u52a8\u5bf9\u7167\uff0c\u533a\u5206\u5148\u9a8c\u548c\u5f71\u50cf\u4f9d\u8d56", "\u8bc4\u6d4b12\u4e2a\u667a\u80fd\u4f53\uff0c\u6270\u52a8\u4f7f\u534a\u6570\u6b63\u786e\u7b54\u6848\u968f\u4e4b\u6539\u53d8"], "keywords": ["\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u9065\u611f", "\u5730\u8868\u53d8\u5316", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 4, "on_hf": true, "organization": "AIEyes Technologies (Hong Kong) Co., Limited", "pdf_url": "https://arxiv.org/pdf/2611.12934v1", "published_at": "2026-11-06", "score": 0.483, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12934.png", "title": "EarthRecord: From Pixels to Land Change with Multimodal Agents over Four Decades of Satellite Imagery", "tldr": "\u56db\u5341\u5e74\u536b\u661f\u539f\u59cb\u5f71\u50cf\u8bc4\u6d4b\u663e\u793a\uff0c\u591a\u6a21\u6001\u667a\u80fd\u4f53\u80fd\u5b8c\u6210\u5206\u6790\u5374\u6613\u8bef\u5224\u771f\u5b9e\u5730\u8868\u53d8\u5316\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51fa\u57fa\u4e8e\u539f\u59cb\u591a\u4f20\u611f\u5668\u536b\u661f\u6863\u6848\u7684\u5730\u8868\u53d8\u5316\u5206\u6790\u57fa\u51c6\uff0c\u8ba9\u667a\u80fd\u4f53\u81ea\u884c\u53bb\u4e91\u3001\u534f\u8c03\u4f20\u611f\u5668\u5dee\u5f02\uff0c\u5e76\u901a\u8fc7\u9690\u85cf\u53c2\u8003\u4e0e\u5bf9\u7167\u5b9e\u9a8c\u68c0\u9a8c\u7b54\u6848\u4f9d\u636e\u3002", "why_notable": "\u628a\u8bc4\u6d4b\u4ece\u7cbe\u9009\u56fe\u50cf\u63a8\u8fdb\u5230\u539f\u59cb\u9065\u611f\u6863\u6848\uff0c\u63ed\u793a\u4f9d\u8d56\u50cf\u7d20\u5e76\u4e0d\u7b49\u4e8e\u8bc6\u522b\u771f\u5b9e\u5730\u8868\u53d8\u5316\uff0c\u4e3a\u667a\u80fd\u4f53\u53ef\u9760\u6027\u63d0\u4f9b\u66f4\u4e25\u683c\u68c0\u9a8c\u3002"}, {"abstract": "Weight-space programming, introduced in recent MIT work by Takehi et al., enables a frontier LLM agent to read a network\u0027s weights and write a repair. Their GPT-6 Astra agent corrected the reasoning loops of Qwen3.5-0.8B without gradients, using 158 agent turns, 89.7 million tokens, and 50 forward-pass requests. Our method, Tree-Ising, casts this repair as a sparse discrete optimization problem over the model\u0027s own BF16 weights. Forward statistics define an objective that weakens a loop direction, strengthens a concluding direction, and preserves the layer\u0027s output on productive tokens. Within a state-tree representation, where lossless BF16 storage acts as a special case, the admissible edits are sign flips and exponent shifts that preserve all shared group exponents and mantissas. We decompose this objective exactly into independent QUBO (Ising) problems, one per output row, which we solve on a GPU using simulated annealing or quantum-inspired simulated bifurcation. On the agent\u0027s two layers, Tree-Ising achieves 54.6% on MATH-500, outperforming the agent\u0027s edit (51.7%) under the same evaluation protocol, while the base model scores 7.9% as reported. The simulated bifurcation solver yields a statistically indistinguishable repair at 55.1%. Both solvers outperform the agent edit across all five math benchmarks, with statistically significant improvements on MATH-500 and GSM8K after correcting for multiple comparisons. Our approach modifies 13% to 17% fewer weights and reduces BF16 bit flips by a factor of 2.2 to 2.3. It requires only four forward-pass requests and zero LLM tokens, with the annealing recipe costing about $0.90 in GPU time. On Qwen3.5-2B, with layers and dose selected using only the base model, the same recipe increases greedy GSM8K accuracy from 21.6% to 69.4%. As a proof of concept, we execute an eight-variable repair subproblem using QAOA on an IBM Heron processor.", "arxiv_id": "2611.14210", "arxiv_url": "https://arxiv.org/abs/2611.14210", "authors": ["Hadi Salloum", "Ammar Ali"], "brief": "Tree-Ising\u5229\u7528\u524d\u5411\u7edf\u8ba1\u6784\u5efa\u4fee\u590d\u76ee\u6807\uff0c\u5728BF16\u6743\u91cd\u4e0a\u505a\u7b26\u53f7\u7ffb\u8f6c\u4e0e\u6307\u6570\u79fb\u4f4d\uff0c\u518d\u7cbe\u786e\u5206\u89e3\u4e3a\u9010\u884c\u72ec\u7acb\u7684QUBO\u95ee\u9898\uff0c\u7528GPU\u6c42\u89e3\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/TheQuantumGOAT/Tree-Ising", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14210", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6a21\u62df\u9000\u706b\u4fee\u590d\u540eMATH-500\u8fbe54.6%\uff0c\u4f18\u4e8e\u667a\u80fd\u4f53\u768451.7%", "\u4ec5\u97004\u6b21\u524d\u5411\u8bf7\u6c42\u3001\u96f6LLM\u8bcd\u5143\uff0c\u9000\u706bGPU\u6210\u672c\u7ea60.90\u7f8e\u5143", "Qwen3.5-2B\u7684GSM8K\u51c6\u786e\u7387\u4ece21.6%\u5347\u81f369.4%"], "keywords": ["\u6a21\u578b\u4fee\u590d", "\u79bb\u6563\u4f18\u5316", "\u6743\u91cd\u7f16\u8f91", "\u6570\u5b66\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14210v1", "published_at": "2026-11-10", "score": 0.47, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (77\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14210.png", "title": "Tree-Ising: Repairing Language Models with Bit-Level Ising Edits", "tldr": "\u5c06\u6743\u91cd\u4f4d\u7ea7\u4fee\u590d\u8f6c\u5316\u4e3a\u79bb\u6563\u4f18\u5316\uff0c\u4ee5\u4f4e\u6210\u672c\u7f13\u89e3\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u5faa\u73af\u5e76\u63d0\u5347\u6570\u5b66\u8868\u73b0\u3002", "upvotes": 77, "what_it_is": "Tree-Ising\u5229\u7528\u524d\u5411\u7edf\u8ba1\u6784\u5efa\u4fee\u590d\u76ee\u6807\uff0c\u5728BF16\u6743\u91cd\u4e0a\u505a\u7b26\u53f7\u7ffb\u8f6c\u4e0e\u6307\u6570\u79fb\u4f4d\uff0c\u518d\u7cbe\u786e\u5206\u89e3\u4e3a\u9010\u884c\u72ec\u7acb\u7684QUBO\u95ee\u9898\uff0c\u7528GPU\u6c42\u89e3\u3002", "why_notable": "\u5c06\u6602\u8d35\u7684\u667a\u80fd\u4f53\u6743\u91cd\u4fee\u590d\u66ff\u6362\u4e3a\u53ef\u5206\u89e3\u7684\u79bb\u6563\u6c42\u89e3\uff0c\u5728\u51cf\u5c11\u4fee\u6539\u6743\u91cd\u548c\u4f4d\u7ffb\u8f6c\u7684\u540c\u65f6\u63d0\u5347\u6570\u5b66\u8868\u73b0\uff0c\u5c55\u793a\u4e86\u65e0\u68af\u5ea6\u4fee\u590d\u7684\u6548\u7387\u6f5c\u529b\u3002"}, {"abstract": "A sparse terminal reward tells an agent little about its steps. Much of the missing information is implicit in the environment\u0027s dynamics, because each state transition can change the conditions for success long before the reward arrives. A world model trained on real transitions can learn to predict what each action changes, but a predicted observation does not by itself show whether success has become more likely. With a binary terminal reward, PPO\u0027s critic makes this judgment by estimating the current policy\u0027s probability of success, but only for states the agent reaches. Our method, WM-PPO, elegantly brings the two together. For each action the policy samples, executed or not, the world model predicts the next observation and the critic values the predicted successor. In the policy channel, comparisons among these values give the policy auxiliary advantages; in the value channel, their mean gives the critic an auxiliary target. A shared gate weights both channels according to how reliably comparisons with similar margins predicted real outcomes earlier in training. The policy, critic and world model all learn from the agent\u0027s own interaction, with no teacher or privileged information, and only the policy is used at inference. With a comparable number of real environment steps, WM-PPO raises success from PPO\u0027s 63.5% to 87.5% on ALFWorld and from 39.3% to 52.9% on ScienceWorld. It matches the strongest PPO refinements we tested on ALFWorld and exceeds the best of them by 6.5 points on ScienceWorld. The trained policy more often completes prerequisite steps before placing an object or committing to an answer.", "arxiv_id": "2611.12200", "arxiv_url": "https://arxiv.org/abs/2611.12200", "authors": ["Chenghao Gao", "Zhi Zhang", "Dian Jin", "Yihe Pan", "Doudou Zhou"], "brief": "WM-PPO\u7528\u4e16\u754c\u6a21\u578b\u9884\u6d4b\u91c7\u6837\u52a8\u4f5c\u7684\u540e\u7ee7\u89c2\u5bdf\uff0c\u518d\u7531\u4ef7\u503c\u7f51\u7edc\u8bc4\u4f30\uff0c\u6784\u9020\u7b56\u7565\u8f85\u52a9\u4f18\u52bf\u4e0e\u4ef7\u503c\u8f85\u52a9\u76ee\u6807\uff1b\u5171\u4eab\u95e8\u63a7\u6309\u5386\u53f2\u9884\u6d4b\u53ef\u9760\u6027\u8c03\u8282\u4e24\u8005\u6743\u91cd\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/nuskonghou/wm-ppo", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.12200", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["WM-PPO\u540c\u65f6\u8bc4\u4f30\u5df2\u6267\u884c\u4e0e\u672a\u6267\u884c\u7684\u91c7\u6837\u52a8\u4f5c", "ALFWorld\u6210\u529f\u7387\u4ece63.5%\u5347\u81f387.5%", "ScienceWorld\u6210\u529f\u7387\u4ece39.3%\u5347\u81f352.9%"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u7a00\u758f\u5956\u52b1", "\u667a\u80fd\u4f53"], "num_comments": 4, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2611.12200v1", "published_at": "2026-11-09", "score": 0.445, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12200.png", "title": "Learning to Act with World Models by Valuing What Comes Next", "tldr": "\u4e16\u754c\u6a21\u578b\u9884\u6d4b\u52a8\u4f5c\u540e\u679c\uff0c\u4ef7\u503c\u7f51\u7edc\u8bc4\u4f30\u6210\u529f\u6982\u7387\uff0c\u63d0\u5347\u7a00\u758f\u5956\u52b1\u4e0b\u7684\u667a\u80fd\u4f53\u5b66\u4e60\u6548\u7387\u3002", "upvotes": 2, "what_it_is": "WM-PPO\u7528\u4e16\u754c\u6a21\u578b\u9884\u6d4b\u91c7\u6837\u52a8\u4f5c\u7684\u540e\u7ee7\u89c2\u5bdf\uff0c\u518d\u7531\u4ef7\u503c\u7f51\u7edc\u8bc4\u4f30\uff0c\u6784\u9020\u7b56\u7565\u8f85\u52a9\u4f18\u52bf\u4e0e\u4ef7\u503c\u8f85\u52a9\u76ee\u6807\uff1b\u5171\u4eab\u95e8\u63a7\u6309\u5386\u53f2\u9884\u6d4b\u53ef\u9760\u6027\u8c03\u8282\u4e24\u8005\u6743\u91cd\u3002", "why_notable": "\u5728\u76f8\u8fd1\u771f\u5b9e\u4ea4\u4e92\u6b65\u6570\u4e0b\uff0c\u5c06\u52a8\u4f5c\u540e\u679c\u9884\u6d4b\u8f6c\u5316\u4e3a\u7a00\u758f\u5956\u52b1\u4e4b\u5916\u7684\u5b66\u4e60\u4fe1\u53f7\uff1b\u65e0\u9700\u6559\u5e08\u6216\u7279\u6743\u4fe1\u606f\uff0c\u63a8\u7406\u65f6\u4ec5\u4f7f\u7528\u7b56\u7565\u3002"}, {"abstract": "We introduce Micius-Flash, a 27-billion-parameter model for engineering with native multimodal input, deep reasoning and a 256K-token context window. We design the Micius data pipeline as a knowledge-tree-driven data flywheel comprising three stages: knowledge tree construction and expansion, data synthesis, and quality validation with hard-example augmentation. From this data, we train expert models for semiconductor knowledge and reasoning, hardware coding, and semiconductor multimodal understanding, along with agentic experts. Subsequently, we employ Multi-Teacher On-Policy Distillation (MOPD) to supervise training on sequences generated by Micius itself, thereby integrating the capabilities of these expert models into a unified model. On more than 20 datasets with about 15K records, Micius-Flash averages 64.2% on hardware code benchmarks, 15.0 points above a same-size baseline. It scores 62.4% on a semiconductor-specific agent benchmark, exceeding the same-size baseline by 17.2 points. We further develop Micius Harness for industrial applications, connecting the model to specialized tools, including EDA tools and KiCad, as well as execution environments. Case studies in PCB design, chip design workflow automation, and software development demonstrate the model\u0027s ability to use tool execution feedback for multi-step planning, code debugging, and iterative verification. We release Micius as an open-source model to advance the development of agents for science and engineering.", "arxiv_id": "2611.10015", "arxiv_url": "https://arxiv.org/abs/2611.10015", "authors": ["Hongcheng Gao", "Weiheng Li", "Yipeng Wei", "Yu Lei", "Shuo Sun", "Yi Li", "Yajiao Wang", "Jie Luo", "Jianwei Wen", "Xinyi Zhou", "Hongda Li", "Yibing Zhang", "Henghui Sun", "Yufan Zhou", "Tianfang Hao", "Naihao Xue", "Hailong Qu", "Jingjing Zhou", "Peng Xu", "Yongzheng Wei", "Yichen Zhu", "Ziying Wang", "Yibo Wang", "Jianshu Zeng", "Yuhang Lei", "Zeqiang Wang"], "brief": "\u8fd9\u662f\u4e00\u4e2a\u652f\u6301\u539f\u751f\u591a\u6a21\u6001\u8f93\u5165\u3001\u6df1\u5ea6\u63a8\u7406\u548c\u957f\u4e0a\u4e0b\u6587\u7684\u5de5\u7a0b\u6a21\u578b\u3002\u5b83\u7528\u77e5\u8bc6\u6811\u9a71\u52a8\u6570\u636e\u5408\u6210\u4e0e\u6821\u9a8c\uff0c\u518d\u901a\u8fc7\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u6574\u5408\u9886\u57df\u4e13\u5bb6\u80fd\u529b\u3002", "categories": ["cs.SE", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10015", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["270\u4ebf\u53c2\u6570\uff0c\u652f\u6301256K\u8bcd\u5143\u4e0a\u4e0b\u6587", "MOPD\u5728\u6a21\u578b\u81ea\u751f\u6210\u5e8f\u5217\u4e0a\u878d\u5408\u591a\u7c7b\u4e13\u5bb6\u80fd\u529b", "\u786c\u4ef6\u4ee3\u7801\u5f97\u520664.2%\uff0c\u667a\u80fd\u4f53\u5f97\u520662.4%"], "keywords": ["\u5de5\u7a0b\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u534a\u5bfc\u4f53\u8bbe\u8ba1", "\u591a\u6a21\u6001\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "Zhiman AI", "pdf_url": "https://arxiv.org/pdf/2611.10015v1", "published_at": "2026-11-04", "score": 0.41, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10015.png", "title": "Micius-Flash: Lightweight Agentic Intelligence for Engineering", "tldr": "\u901a\u8fc7\u591a\u6559\u5e08\u84b8\u998f\u6574\u5408\u5de5\u7a0b\u4e13\u5bb6\u80fd\u529b\uff0c\u8ba9\u8f7b\u91cf\u6a21\u578b\u80dc\u4efb\u534a\u5bfc\u4f53\u8bbe\u8ba1\u4e0e\u5de5\u5177\u534f\u4f5c\u3002", "upvotes": 6, "what_it_is": "\u8fd9\u662f\u4e00\u4e2a\u652f\u6301\u539f\u751f\u591a\u6a21\u6001\u8f93\u5165\u3001\u6df1\u5ea6\u63a8\u7406\u548c\u957f\u4e0a\u4e0b\u6587\u7684\u5de5\u7a0b\u6a21\u578b\u3002\u5b83\u7528\u77e5\u8bc6\u6811\u9a71\u52a8\u6570\u636e\u5408\u6210\u4e0e\u6821\u9a8c\uff0c\u518d\u901a\u8fc7\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u6574\u5408\u9886\u57df\u4e13\u5bb6\u80fd\u529b\u3002", "why_notable": "\u4e24\u7c7b\u5de5\u7a0b\u57fa\u51c6\u5206\u522b\u9886\u5148\u540c\u89c4\u6a21\u57fa\u7ebf15.0\u548c17.2\u4e2a\u767e\u5206\u70b9\uff1b\u5f00\u6e90\u6a21\u578b\u914d\u5957\u5de5\u5177\u6846\u67b6\uff0c\u53ef\u8fde\u63a5EDA\u4e0eKiCad\u5f00\u5c55\u8fed\u4ee3\u9a8c\u8bc1\u3002"}, {"abstract": "Foundation models such as GPT and Claude have shown strong capabilities in spatial understanding and embodied intelligence. These advances make agentic robotics a promising path toward artificial general intelligence in robotics. However, we find that using foundation models to control robots poses serious safety risks, and comprehensive safety evaluation is still lacking. We introduce RoboRisk, a comprehensive benchmark for evaluating safety in agentic robotics. Its 92 simulated tasks and 13 physical-robot tasks fall into five categories: Task-level Refusal (T), Plan Repair (P), Execution-time Hazard (E), Injection (I), and Sequential Memory (S). Prior benchmarks cover at most two of these categories, and several evaluate only text outputs. In contrast, RoboRisk covers all five and executes every task in closed loop. We evaluate six state-of-the-art foundation models on RoboRisk: GPT-6 Astra, GPT-6.1 Sol, GPT-6 Luna, Claude Opus 5.5, Gemini 4 Argon, and Grok 4.7. These models generally show high harm rates. We also evaluate two robot-specific APIs: the Dream API and PokeBot\u0027s RoboAPI. We further propose the Lease-Enforced Agentic Safety Harness (LEASH), which offers essential safety infrastructure for agentic robotics and can be integrated into nearly any agentic architecture. LEASH leverages a decision model (Jev or OpenAI\u0027s Decisions API) to implement task, action, and commit gates, which review the task, each action, and each irreversible operation in their visual context. The planner and all three gates share a common safety policy. Experiments on RoboRisk in simulation and on physical robots show that LEASH effectively reduces harm across all six foundation models. It largely preserves their task completion performance and adds little time and token overhead.", "arxiv_id": "2611.14115", "arxiv_url": "https://arxiv.org/abs/2611.14115", "authors": ["Qinfeng Zhu", "Weiguang Zhao", "Ke Sun", "Xihao Guo", "Yunxi Jiang", "Rui Zhang", "Lei Fan", "Kaizhu Huang"], "brief": "\u7814\u7a76\u63d0\u51fa\u95ed\u73af\u5b89\u5168\u57fa\u51c6RoboRisk\u4e0e\u9632\u62a4\u6846\u67b6LEASH\u3002\u540e\u8005\u501f\u52a9\u51b3\u7b56\u6a21\u578b\uff0c\u5728\u89c6\u89c9\u4e0a\u4e0b\u6587\u4e2d\u5ba1\u67e5\u4efb\u52a1\u3001\u52a8\u4f5c\u53ca\u4e0d\u53ef\u9006\u64cd\u4f5c\uff0c\u5e76\u4e0e\u89c4\u5212\u5668\u5171\u4eab\u5b89\u5168\u7b56\u7565\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/zhuqinfeng1999/LEASH", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.14115", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RoboRisk\u542b92\u9879\u4eff\u771f\u300113\u9879\u771f\u673a\u4efb\u52a1\uff0c\u8986\u76d6\u4e94\u7c7b\u98ce\u9669", "LEASH\u8bbe\u7f6e\u4efb\u52a1\u3001\u52a8\u4f5c\u3001\u63d0\u4ea4\u4e09\u9053\u5b89\u5168\u95e8\u63a7", "\u516d\u79cd\u57fa\u7840\u6a21\u578b\u63a5\u5165\u540e\u4f24\u5bb3\u51cf\u5c11\uff0c\u4efb\u52a1\u5b8c\u6210\u8868\u73b0\u5927\u4f53\u4fdd\u7559"], "keywords": ["\u673a\u5668\u4eba\u5b89\u5168", "\u667a\u80fd\u4f53", "\u5b89\u5168\u8bc4\u4f30", "\u57fa\u7840\u6a21\u578b"], "num_comments": 5, "on_hf": true, "organization": "University of Liverpool", "pdf_url": "https://arxiv.org/pdf/2611.14115v1", "published_at": "2026-11-10", "score": 0.41, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.14115.png", "title": "LEASH: Stay Safe in Agentic Robotics", "tldr": "\u4ee5\u95ed\u73af\u673a\u5668\u4eba\u5b89\u5168\u57fa\u51c6\u4e0e\u4e09\u91cd\u51b3\u7b56\u95e8\u63a7\uff0c\u964d\u4f4e\u667a\u80fd\u4f53\u6267\u884c\u4efb\u52a1\u7684\u4f24\u5bb3\u98ce\u9669\u3002", "upvotes": 4, "what_it_is": "\u7814\u7a76\u63d0\u51fa\u95ed\u73af\u5b89\u5168\u57fa\u51c6RoboRisk\u4e0e\u9632\u62a4\u6846\u67b6LEASH\u3002\u540e\u8005\u501f\u52a9\u51b3\u7b56\u6a21\u578b\uff0c\u5728\u89c6\u89c9\u4e0a\u4e0b\u6587\u4e2d\u5ba1\u67e5\u4efb\u52a1\u3001\u52a8\u4f5c\u53ca\u4e0d\u53ef\u9006\u64cd\u4f5c\uff0c\u5e76\u4e0e\u89c4\u5212\u5668\u5171\u4eab\u5b89\u5168\u7b56\u7565\u3002", "why_notable": "\u5c06\u5b89\u5168\u8bc4\u4f30\u4ece\u6587\u672c\u8f93\u51fa\u63a8\u8fdb\u5230\u95ed\u73af\u673a\u5668\u4eba\u6267\u884c\uff0c\u5e76\u63d0\u4f9b\u53ef\u8de8\u667a\u80fd\u4f53\u67b6\u6784\u96c6\u6210\u7684\u9632\u62a4\u673a\u5236\uff0c\u5728\u964d\u4f4e\u4f24\u5bb3\u7684\u540c\u65f6\u4fdd\u6301\u8f83\u4f4e\u989d\u5916\u5f00\u9500\u3002"}, {"abstract": "LLM agents are increasingly used for open-ended, data-driven scientific discovery, yet most of them evaluate hypotheses pointwise, testing an empirical claim $h$ only against its complement $\\neg h$. When evidence rejects $h$, the agent learns that one explanation is unlikely but not which alternative the evidence supports. To recover that alternative, we introduce Contrastive Discovery, which replaces the single hypothesis with a contrast set, a scientific question paired with mutually exclusive and collectively exhaustive competing explanations. Each experiment is scored by how its evidence redistributes belief across the set, and the question is resolved when belief concentrates on one explanation. Because contrast sets change only the unit an agent proposes and scores, an existing agent can use them to re-evaluate evidence it has already collected or to guide its search. Across six domains, $89\\%$ of the pointwise candidates with the largest belief shifts are rejections. On the same evidence, contrast sets resolve $73\\%$ of these candidates to a specific alternative. When contrast sets guide search, the agent resolves $67\\%$ more questions than pointwise surprisal under the same experiment budget. In a blinded study, $38$ human experts chose the same explanation on $78\\%$ of resolved questions and on $82\\%$ of questions where the pointwise agent rejected its hypothesis and stopped. Together, these results support explicit competing explanations as a way for discovery agents to resolve more scientific questions from the same evidence and validation budget.", "arxiv_id": "2611.14514", "arxiv_url": "https://arxiv.org/abs/2611.14514", "authors": ["Ziang Liu", "James J. Kim", "Yijia Dai", "Jennifer J. Sun"], "brief": "\u63d0\u51fa Contrastive Discovery\uff0c\u5c06\u79d1\u5b66\u95ee\u9898\u4e0e\u4e92\u65a5\u4e14\u5b8c\u5907\u7684\u89e3\u91ca\u96c6\u5408\u7ed1\u5b9a\u3002\u6309\u5b9e\u9a8c\u8bc1\u636e\u5f15\u8d77\u7684\u4fe1\u5ff5\u91cd\u5206\u914d\u8bc4\u5206\uff0c\u65e2\u53ef\u91cd\u8bc4\u5df2\u6709\u8bc1\u636e\uff0c\u4e5f\u53ef\u5f15\u5bfc\u540e\u7eed\u641c\u7d22\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14514", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u516d\u4e2a\u9886\u57df\u4e2d\uff0c\u4fe1\u5ff5\u53d8\u5316\u6700\u5927\u7684\u5355\u5047\u8bbe\u5019\u9009\u670989%\u88ab\u5426\u5b9a", "\u76f8\u540c\u8bc1\u636e\u4e0b\uff0c\u7ade\u4e89\u89e3\u91ca\u96c6\u5c0673%\u7684\u4e0a\u8ff0\u5019\u9009\u786e\u5b9a\u4e3a\u5177\u4f53\u66ff\u4ee3\u89e3\u91ca", "\u76f8\u540c\u5b9e\u9a8c\u9884\u7b97\u4e0b\uff0c\u5f15\u5bfc\u641c\u7d22\u6bd4\u5355\u5047\u8bbe\u60ca\u5f02\u5ea6\u591a\u89e3\u51b367%\u7684\u95ee\u9898"], "keywords": ["\u79d1\u5b66\u53d1\u73b0", "\u667a\u80fd\u4f53", "\u5047\u8bbe\u68c0\u9a8c", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14514v1", "published_at": "2026-11-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Contrastive Discovery: Open-Ended Scientific Discovery over Competing Explanations", "tldr": "\u7528\u4e92\u65a5\u4e14\u5b8c\u5907\u7684\u7ade\u4e89\u89e3\u91ca\u66ff\u4ee3\u5355\u5047\u8bbe\u68c0\u9a8c\uff0c\u8ba9\u79d1\u5b66\u53d1\u73b0\u667a\u80fd\u4f53\u66f4\u6709\u6548\u5730\u786e\u5b9a\u7b54\u6848\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa Contrastive Discovery\uff0c\u5c06\u79d1\u5b66\u95ee\u9898\u4e0e\u4e92\u65a5\u4e14\u5b8c\u5907\u7684\u89e3\u91ca\u96c6\u5408\u7ed1\u5b9a\u3002\u6309\u5b9e\u9a8c\u8bc1\u636e\u5f15\u8d77\u7684\u4fe1\u5ff5\u91cd\u5206\u914d\u8bc4\u5206\uff0c\u65e2\u53ef\u91cd\u8bc4\u5df2\u6709\u8bc1\u636e\uff0c\u4e5f\u53ef\u5f15\u5bfc\u540e\u7eed\u641c\u7d22\u3002", "why_notable": "\u628a\u5426\u5b9a\u5047\u8bbe\u8f6c\u5316\u4e3a\u786e\u5b9a\u66ff\u4ee3\u89e3\u91ca\uff0c\u63d0\u9ad8\u8bc1\u636e\u548c\u5b9e\u9a8c\u9884\u7b97\u7684\u5229\u7528\u7387\uff1b38\u540d\u4e13\u5bb6\u76f2\u8bc4\u4e2d\uff0c\u5bf9\u5df2\u89e3\u51b3\u95ee\u9898\u7684\u89e3\u91ca\u4e00\u81f4\u7387\u8fbe78%\u3002"}, {"abstract": "Language-model agents increasingly tackle long-horizon tasks whose interaction histories exceed the model\u0027s active context. They must therefore decide what to write down and what to read back, and when to do either. Recent work has begun to use on-policy distillation (OPD) to make memory control part of the policy, relying on memory tools and compaction protocols that lie outside either model\u0027s pre-training. However, this weakens the distillation on both sides: the teacher cannot give useful guidance on an interface it has never used, and the student samples too few meaningful memory actions for that guidance to take effect. To study this problem, we introduce Coding Agent Memory Gym II (CAMG-II), a suite of long-horizon agentic-RL environments spanning Shop, Coding, AutoResearch, General, and Visual. Alongside each environment\u0027s native task interface, CAMG-II provides ordinary Bash access and an episode-persistent workspace, enabling the policy to create, revise, search, and reuse files as memory across context replacements. We also introduce Coding Agent Memory Post-Training II (CAMP-II), which trains a single policy jointly across all five environments with fully asynchronous OPD to learn this file-based memory behavior directly from a frozen teacher with a prior for file operations. On CAMG-II, CAMP-II obtains 2.97 times the gain of the strongest OPD baseline. The memory behavior CAMP-II learns generalizes to two external benchmarks, Terminal-Bench 2.1 and SWE-Bench Pro V2, with improved success rates.", "arxiv_id": "2611.14009", "arxiv_url": "https://arxiv.org/abs/2611.14009", "authors": ["Lirui Luo", "Kelong Mao", "Xinwei Yang", "Rongqing Li", "Luyu Chen", "Kieran Wong", "Yudong Guo", "Xinrui Wang", "Jiayin Zhu", "Gu Simiu", "Sulong Xu", "Cong Fang"], "brief": "\u6784\u5efa\u8986\u76d6\u4e94\u7c7b\u4efb\u52a1\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u73af\u5883\uff0c\u4ee5\u666e\u901aBash\u548c\u6301\u4e45\u5de5\u4f5c\u533a\u627f\u8f7d\u6587\u4ef6\u8bb0\u5fc6\u3002\u518d\u7528\u5168\u5f02\u6b65\u7b56\u7565\u5185\u84b8\u998f\uff0c\u8ba9\u5355\u4e00\u7b56\u7565\u5411\u51bb\u7ed3\u6559\u5e08\u5b66\u4e60\u8bb0\u5fc6\u8bfb\u5199\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14009", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["CAMG-II\u8986\u76d6\u8d2d\u7269\u3001\u7f16\u7a0b\u7b49\u4e94\u7c7b\u957f\u7a0b\u4efb\u52a1", "CAMP-II\u4ee5\u5168\u5f02\u6b65OPD\u5b66\u4e60\u6587\u4ef6\u8bb0\u5fc6\u64cd\u4f5c", "\u589e\u76ca\u4e3a\u6700\u5f3aOPD\u57fa\u7ebf\u76842.97\u500d\uff0c\u5e76\u8fc1\u79fb\u81f3\u4e24\u9879\u5916\u90e8\u57fa\u51c6"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u7b56\u7565\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14009v1", "published_at": "2026-11-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Coding Agent Memory Post-Training II: Unlocking the Memory Potential of Pre-trained File Operations for Long-Horizon Tasks via On-Policy Distillation", "tldr": "\u901a\u8fc7\u7b56\u7565\u5185\u84b8\u998f\u6fc0\u6d3b\u6587\u4ef6\u64cd\u4f5c\u5148\u9a8c\uff0c\u8ba9\u667a\u80fd\u4f53\u5b66\u4f1a\u8de8\u4e0a\u4e0b\u6587\u7ba1\u7406\u957f\u671f\u8bb0\u5fc6\u3002", "upvotes": 0, "what_it_is": "\u6784\u5efa\u8986\u76d6\u4e94\u7c7b\u4efb\u52a1\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u73af\u5883\uff0c\u4ee5\u666e\u901aBash\u548c\u6301\u4e45\u5de5\u4f5c\u533a\u627f\u8f7d\u6587\u4ef6\u8bb0\u5fc6\u3002\u518d\u7528\u5168\u5f02\u6b65\u7b56\u7565\u5185\u84b8\u998f\uff0c\u8ba9\u5355\u4e00\u7b56\u7565\u5411\u51bb\u7ed3\u6559\u5e08\u5b66\u4e60\u8bb0\u5fc6\u8bfb\u5199\u3002", "why_notable": "\u5c06\u8bb0\u5fc6\u63a5\u53e3\u5bf9\u9f50\u6a21\u578b\u5df2\u6709\u7684\u6587\u4ef6\u64cd\u4f5c\u80fd\u529b\uff0c\u6539\u5584\u84b8\u998f\u6307\u5bfc\u4e0e\u63a2\u7d22\u6548\u7387\uff1b\u5916\u90e8\u7f16\u7a0b\u57fa\u51c6\u7684\u6210\u529f\u7387\u63d0\u5347\u663e\u793a\u4e86\u8fc1\u79fb\u4ef7\u503c\u3002"}, {"abstract": "Weight-activation quantization can reduce the memory and compute cost of neural-network inference, but recent methods often require expensive optimization and architecture-specific propagation of basis transforms across layers. We introduce MACaQ, an MXFP4 W4A4 post-training quantization method that treats every linear layer independently. MACaQ applies a per-channel scale and a block-Hadamard transform online to each layer\u0027s activations, while absorbing the corresponding inverse transforms into its weights. Retaining these transforms online avoids cross-layer dependencies and enables a simple streaming implementation of the quantization process, in which only one layer must reside in memory at a time. To improve over round-to-nearest quantization, we introduce Flip-Refinement, a Hessian-aware coordinate-descent procedure that greedily moves individual FP4 codes to adjacent representable values. Despite executing the activation transforms at inference time, MACaQ adds only 2.3% end-to-end overhead over pure MXFP4 on Qwen3-32B in vLLM. MACaQ reaches lower perplexity than DuQuant++ and MR-GPTQ, and already matches their best perplexity on Llama-3-8B in 11 times less quantization time. We further apply MACaQ without architecture-specific modifications to an image diffusion model, illustrating the generality of its layer-local design and show quantization of a 122B parameter model in 64 minutes, using only 32.5GB GPU RAM.", "arxiv_id": "2611.10649", "arxiv_url": "https://arxiv.org/abs/2611.10649", "authors": ["Lorenz K. Muller", "Philippe Bich", "Chiara Boretti", "Hyun-Min Chang", "Jiawei Zhuang", "Lukas Cavigelli"], "brief": "MACaQ\u662f\u6743\u91cd\u4e0e\u6fc0\u6d3b\u5747\u4e3a\u56db\u6bd4\u7279\u7684\u8bad\u7ec3\u540e\u91cf\u5316\u65b9\u6cd5\uff0c\u9010\u5c42\u5728\u7ebf\u6267\u884c\u901a\u9053\u7f29\u653e\u548c\u5206\u5757Hadamard\u53d8\u6362\uff0c\u5e76\u5c06\u9006\u53d8\u6362\u5438\u6536\u5165\u6743\u91cd\uff0c\u914d\u5408\u7cbe\u5ea6\u7ec6\u5316\u964d\u4f4e\u8bef\u5dee\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/huawei-csl/MACaQ", "github_stars": 89, "hf_url": "https://huggingface.co/papers/2611.10649", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Flip-Refinement\u4ee5Hessian\u611f\u77e5\u5750\u6807\u4e0b\u964d\u8c03\u6574FP4\u7f16\u7801", "Llama-3-8B\u5339\u914d\u5bf9\u624b\u6700\u4f73\u56f0\u60d1\u5ea6\uff0c\u91cf\u5316\u5feb11\u500d", "122B\u6a21\u578b\u91cf\u5316\u8017\u65f664\u5206\u949f\uff0c\u4ec5\u970032.5GB\u663e\u5b58"], "keywords": ["\u8bad\u7ec3\u540e\u91cf\u5316", "\u4f4e\u7cbe\u5ea6\u63a8\u7406", "\u6a21\u578b\u538b\u7f29"], "num_comments": 2, "on_hf": true, "organization": "HUAWEI Computing Systems Lab", "pdf_url": "https://arxiv.org/pdf/2611.10649v1", "published_at": "2026-11-07", "score": 0.328, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10649.png", "title": "MACaQ: Fast, Model Agnostic Calibrated Quantization for Low-Precision Weights and Activations", "tldr": "\u4ee5\u9010\u5c42\u72ec\u7acb\u53d8\u6362\u548c\u7cbe\u5ea6\u7ec6\u5316\uff0c\u5b9e\u73b0\u4f4e\u5185\u5b58\u3001\u5feb\u901f\u4e14\u8de8\u67b6\u6784\u7684\u56db\u6bd4\u7279\u91cf\u5316\u3002", "upvotes": 22, "what_it_is": "MACaQ\u662f\u6743\u91cd\u4e0e\u6fc0\u6d3b\u5747\u4e3a\u56db\u6bd4\u7279\u7684\u8bad\u7ec3\u540e\u91cf\u5316\u65b9\u6cd5\uff0c\u9010\u5c42\u5728\u7ebf\u6267\u884c\u901a\u9053\u7f29\u653e\u548c\u5206\u5757Hadamard\u53d8\u6362\uff0c\u5e76\u5c06\u9006\u53d8\u6362\u5438\u6536\u5165\u6743\u91cd\uff0c\u914d\u5408\u7cbe\u5ea6\u7ec6\u5316\u964d\u4f4e\u8bef\u5dee\u3002", "why_notable": "\u9010\u5c42\u72ec\u7acb\u8bbe\u8ba1\u6446\u8131\u8de8\u5c42\u53d8\u6362\u4f9d\u8d56\uff0c\u53ef\u76f4\u63a5\u7528\u4e8e\u56fe\u50cf\u6269\u6563\u6a21\u578b\uff1bQwen3-32B\u63a8\u7406\u989d\u5916\u5f00\u9500\u4ec52.3%\uff0c\u517c\u987e\u901a\u7528\u6027\u4e0e\u6548\u7387\u3002"}, {"abstract": "This work proposes WaveGen, a fully end-to-end diffusion-based text-to-waveform framework based on Spectral Forcing, which jointly learns an internal spectral trajectory and the target waveform trajectory within a single model, enabling direct end-to-end text-to-waveform generation. Unlike recent TTS pipelines, WaveGen does not rely on separately trained or externally decoded intermediate representations, such as neural audio codecs, Mel-spectrogram vocoders, or VAE-based latent models. In addition, WaveGen performs internal text-speech alignment within a single model, eliminating the need for external alignment modules such as duration predictors. To preserve a truly end-to-end formulation, our framework further avoids dependence on self-supervised representations, such as BERT-based text embeddings and Wav2Vec 2.0-based semantic representations, as well as semantic distillation methods for training optimization. To achieve this, we carefully design Spectral Forcing, a model architecture with disentangled diffusion heads, and a training objective based on a multi-scale spectral $v$-loss. We further validate the scalability of end-to-end TTS models by scaling the model size from 0.1B to 0.6B parameters. Using a single architecture, open-source data, and one-stage training, without external modules such as duration predictor or REPA, WaveGen demonstrates fully end-to-end waveform generation achieving state-of-the-art performance on the Emilia training dataset. In particular, WaveGen achieves a WER of 1.47 and a SIM of 0.75 on the Seed-en benchmark. Source code and checkpoints are available at https://github.com/sh-lee-prml/WaveGen", "arxiv_id": "2611.12527", "arxiv_url": "https://arxiv.org/abs/2611.12527", "authors": ["Sang-Hoon Lee", "Ha-Yeong Choi"], "brief": "WaveGen\u4ee5Spectral Forcing\u8054\u5408\u5b66\u4e60\u5185\u90e8\u9891\u8c31\u4e0e\u6ce2\u5f62\u8f68\u8ff9\uff0c\u5e76\u5728\u6a21\u578b\u5185\u5b8c\u6210\u6587\u672c\u8bed\u97f3\u5bf9\u9f50\u3002\u901a\u8fc7\u89e3\u8026\u6269\u6563\u5934\u548c\u591a\u5c3a\u5ea6\u9891\u8c31\u635f\u5931\uff0c\u5b9e\u73b0\u5355\u9636\u6bb5\u8bad\u7ec3\u3002", "categories": ["cs.SD", "cs.AI", "eess.AS", "eess.SP"], "github_repo": "https://github.com/sh-lee-prml/WaveGen", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2611.12527", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Spectral Forcing\u8054\u5408\u5b66\u4e60\u9891\u8c31\u4e0e\u6ce2\u5f62\u8f68\u8ff9", "\u91c7\u7528\u89e3\u8026\u6269\u6563\u5934\u4e0e\u591a\u5c3a\u5ea6\u9891\u8c31v\u635f\u5931", "Seed-en\u4e0aWER\u4e3a1.47\uff0cSIM\u4e3a0.75"], "keywords": ["\u8bed\u97f3\u5408\u6210", "\u6269\u6563\u6a21\u578b", "\u7aef\u5230\u7aef\u5b66\u4e60", "\u6ce2\u5f62\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Ajou university", "pdf_url": "https://arxiv.org/pdf/2611.12527v1", "published_at": "2026-11-09", "score": 0.307, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12527.png", "title": "WaveGen: Truly End-to-End Waveform Generation via Internal Spectral Trajectory Learning", "tldr": "\u7528\u5355\u4e00\u6269\u6563\u6a21\u578b\u76f4\u63a5\u4ece\u6587\u672c\u751f\u6210\u8bed\u97f3\u6ce2\u5f62\uff0c\u65e0\u9700\u5916\u90e8\u58f0\u7801\u5668\u4e0e\u5bf9\u9f50\u6a21\u5757\u3002", "upvotes": 14, "what_it_is": "WaveGen\u4ee5Spectral Forcing\u8054\u5408\u5b66\u4e60\u5185\u90e8\u9891\u8c31\u4e0e\u6ce2\u5f62\u8f68\u8ff9\uff0c\u5e76\u5728\u6a21\u578b\u5185\u5b8c\u6210\u6587\u672c\u8bed\u97f3\u5bf9\u9f50\u3002\u901a\u8fc7\u89e3\u8026\u6269\u6563\u5934\u548c\u591a\u5c3a\u5ea6\u9891\u8c31\u635f\u5931\uff0c\u5b9e\u73b0\u5355\u9636\u6bb5\u8bad\u7ec3\u3002", "why_notable": "\u5c06\u8bed\u97f3\u751f\u6210\u3001\u9891\u8c31\u5efa\u6a21\u548c\u5bf9\u9f50\u6536\u8fdb\u5355\u4e00\u6a21\u578b\uff0c\u51cf\u5c11\u591a\u6a21\u5757\u4f9d\u8d56\uff1b\u53c2\u6570\u4ece1\u4ebf\u6269\u81f36\u4ebf\uff0c\u9a8c\u8bc1\u7aef\u5230\u7aef\u8def\u7ebf\u7684\u6269\u5c55\u6f5c\u529b\u3002"}, {"abstract": "Discrete autoregressive modeling, notably through next-token prediction, has become a cornerstone of modern language models. Extending this paradigm to vision allows visual and language models to converge on a unified framework, thereby fostering shared methodology and infrastructure. This work investigates a central question: how far can a finite discrete vocabulary go in representing the richness of the visual world? We present dNaViT, a Discrete Native-resolution Vision Transformer that produces discrete visual primitives analogous to language tokens. Built upon a frozen pretrained encoder, dNaViT applies lightweight residual modulation with a dual-branch objective to inject reconstruction-aware cues into semantic features. By leveraging grouped product quantization, it scales discrete capacity without inflating spatial sequence lengths, while a balanced training recipe maintains both semantic and pixel-level information. Consequently, dNaViT functions as a versatile discrete visual tokenizer, enabling unified encoding across downstream tasks alongside high-fidelity image decoding. Extensive evaluations show that dNaViT matches or exceeds task-specific baselines across 12 visual understanding benchmarks, 4 generation benchmarks, and an image editing benchmark. These findings demonstrate that a compact discrete vocabulary can serve as a universal visual currency and unlock the full potential of fully unified, native multimodal methodology.", "arxiv_id": "2611.12426", "arxiv_url": "https://arxiv.org/abs/2611.12426", "authors": ["Xiaotong Li", "Zhengrong Yue", "Xu Huang", "Jialv Zou", "Minhao Jing", "Wenhao Yan", "Haodong Li", "Hai Huang", "Bo Zhao", "Yan Feng", "Peng Pei", "Xunliang Cai"], "brief": "dNaViT\u662f\u539f\u751f\u5206\u8fa8\u7387\u89c6\u89c9\u5206\u8bcd\u5668\uff0c\u5728\u51bb\u7ed3\u7f16\u7801\u5668\u4e0a\u4ee5\u8f7b\u91cf\u6b8b\u5dee\u8c03\u5236\u548c\u53cc\u5206\u652f\u76ee\u6807\u878d\u5408\u8bed\u4e49\u4e0e\u91cd\u5efa\u4fe1\u606f\uff0c\u518d\u901a\u8fc7\u5206\u7ec4\u4e58\u79ef\u91cf\u5316\u751f\u6210\u79bb\u6563\u7f16\u7801\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.12426", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u51bb\u7ed3\u9884\u8bad\u7ec3\u7f16\u7801\u5668\uff0c\u4ee5\u6b8b\u5dee\u8c03\u5236\u548c\u53cc\u5206\u652f\u76ee\u6807\u517c\u987e\u8bed\u4e49\u4e0e\u91cd\u5efa\u3002", "\u5206\u7ec4\u4e58\u79ef\u91cf\u5316\u6269\u5927\u79bb\u6563\u5bb9\u91cf\uff0c\u4e0d\u589e\u52a0\u7a7a\u95f4\u5e8f\u5217\u957f\u5ea6\u3002", "\u572812\u9879\u7406\u89e3\u30014\u9879\u751f\u6210\u53ca1\u9879\u7f16\u8f91\u57fa\u51c6\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u4e13\u7528\u57fa\u7ebf\u3002"], "keywords": ["\u89c6\u89c9\u5206\u8bcd", "\u79bb\u6563\u8868\u793a", "\u591a\u6a21\u6001\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "LongCat", "pdf_url": "https://arxiv.org/pdf/2611.12426v1", "published_at": "2026-11-09", "score": 0.301, "selected_reasons": ["HF trending (33\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12426.png", "title": "dNaViT: Discrete Codes are General-Purpose Visual Representations", "tldr": "\u7528\u7d27\u51d1\u79bb\u6563\u89c6\u89c9\u8bcd\u8868\u517c\u987e\u8bed\u4e49\u7406\u89e3\u4e0e\u9ad8\u4fdd\u771f\u91cd\u5efa\uff0c\u7edf\u4e00\u591a\u7c7b\u89c6\u89c9\u4efb\u52a1\u7f16\u7801\u3002", "upvotes": 33, "what_it_is": "dNaViT\u662f\u539f\u751f\u5206\u8fa8\u7387\u89c6\u89c9\u5206\u8bcd\u5668\uff0c\u5728\u51bb\u7ed3\u7f16\u7801\u5668\u4e0a\u4ee5\u8f7b\u91cf\u6b8b\u5dee\u8c03\u5236\u548c\u53cc\u5206\u652f\u76ee\u6807\u878d\u5408\u8bed\u4e49\u4e0e\u91cd\u5efa\u4fe1\u606f\uff0c\u518d\u901a\u8fc7\u5206\u7ec4\u4e58\u79ef\u91cf\u5316\u751f\u6210\u79bb\u6563\u7f16\u7801\u3002", "why_notable": "\u540c\u4e00\u79bb\u6563\u7f16\u7801\u517c\u987e\u89c6\u89c9\u7406\u89e3\u3001\u751f\u6210\u4e0e\u7f16\u8f91\uff0c\u4e3a\u89c6\u89c9\u548c\u8bed\u8a00\u5171\u4eab\u8bcd\u5143\u5efa\u6a21\u8303\u5f0f\u53ca\u57fa\u7840\u8bbe\u65bd\u63d0\u4f9b\u4e86\u66f4\u6709\u529b\u7684\u5b9e\u8bc1\u652f\u6301\u3002"}, {"abstract": "How little of a pretrained large language model (LLM) has to change for it to acquire new capabilities? We find that zeroing fewer than 0.05% of its weights, with no other modification, matches full fine-tuning (FFT) at scale across three LLM post-training regimes: reinforcement learning with verifiable rewards, supervised fine-tuning, and on-policy distillation. Our method, Deletion Tuning, learns a binary mask over the gate projection of transformer blocks. Two practical advantages follow: the trained mask is hundreds to thousands of times smaller than the corresponding FFT checkpoint, and Deletion Tuning forgets far less, which addresses a central challenge in continual learning. Under reinforcement learning, its prior-task accuracy stays near the base level while FFT, LoRA, and random sparse fine-tuning lose up to 5.4 points. To understand why masking alone suffices, we analyze the geometry of the learned weight changes under reinforcement learning using stable rank, spectrum drift, and principal-weight overlap. Compared with LoRA and random sparse fine-tuning, Deletion Tuning is closest to FFT across the three measures.", "arxiv_id": "2611.10866", "arxiv_url": "https://arxiv.org/abs/2611.10866", "authors": ["Jack Lu", "Zhenbang Yang", "Mike Lasby", "Tejas Pote", "Yani Ioannou", "Mengye Ren"], "brief": "Deletion Tuning\u5728Transformer\u5757\u7684\u95e8\u63a7\u6295\u5f71\u4e0a\u5b66\u4e60\u4e8c\u503c\u63a9\u7801\uff0c\u4ec5\u5c06\u5c11\u91cf\u6743\u91cd\u7f6e\u96f6\uff0c\u4e0d\u6539\u52a8\u5176\u4f59\u6743\u91cd\uff0c\u5373\u53ef\u83b7\u5f97\u65b0\u80fd\u529b\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/agentic-learning-ai-lab/deleting-weights", "github_stars": 50, "hf_url": "https://huggingface.co/papers/2611.10866", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7f6e\u96f6\u4e0d\u8db30.05%\u6743\u91cd\uff0c\u5728\u4e09\u7c7b\u540e\u8bad\u7ec3\u4e2d\u5339\u654cFFT", "\u63a9\u7801\u6bd4FFT\u68c0\u67e5\u70b9\u5c0f\u6570\u767e\u81f3\u6570\u5343\u500d", "\u5f3a\u5316\u5b66\u4e60\u4e2d\u65e7\u4efb\u52a1\u51c6\u786e\u7387\u8fd1\u57fa\u7ebf\uff0c\u5bf9\u7167\u6700\u591a\u964d5.4\u70b9"], "keywords": ["\u5927\u6a21\u578b\u540e\u8bad\u7ec3", "\u7a00\u758f\u5fae\u8c03", "\u6301\u7eed\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "agentic learning ai lab", "pdf_url": "https://arxiv.org/pdf/2611.10866v1", "published_at": "2026-11-07", "score": 0.297, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10866.png", "title": "The Surprising Effectiveness of Deleting Weights in LLM Post-Training", "tldr": "\u4ec5\u5c06\u4e0d\u5230\u4e07\u5206\u4e4b\u4e94\u7684\u6743\u91cd\u7f6e\u96f6\uff0c\u5c31\u80fd\u5728\u4e09\u7c7b\u5927\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u5339\u654c\u5168\u91cf\u5fae\u8c03\u3002", "upvotes": 7, "what_it_is": "Deletion Tuning\u5728Transformer\u5757\u7684\u95e8\u63a7\u6295\u5f71\u4e0a\u5b66\u4e60\u4e8c\u503c\u63a9\u7801\uff0c\u4ec5\u5c06\u5c11\u91cf\u6743\u91cd\u7f6e\u96f6\uff0c\u4e0d\u6539\u52a8\u5176\u4f59\u6743\u91cd\uff0c\u5373\u53ef\u83b7\u5f97\u65b0\u80fd\u529b\u3002", "why_notable": "\u5b83\u8868\u660e\u83b7\u53d6\u65b0\u80fd\u529b\u672a\u5fc5\u9700\u8981\u66f4\u65b0\u6743\u91cd\u6570\u503c\uff0c\u5e76\u4ee5\u66f4\u5c0f\u5b58\u50a8\u5f00\u9500\u548c\u66f4\u5c11\u9057\u5fd8\uff0c\u4e3a\u4f4e\u6210\u672c\u540e\u8bad\u7ec3\u4e0e\u6301\u7eed\u5b66\u4e60\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Language agents increasingly work for users on the open Web, and finance is where trusting them is hardest. The data must come from the Web, the strategy lives in the user\u0027s head, and correctness depends on time, so an agent can fail silently: a strategy the user never asked for, unverified data, or a backtest that uses the future yields a report as convincing as a correct one. Existing benchmarks close the world somewhere, fixing the task, the data, or the timeline, and thereby remove these failures instead of measuring them. We introduce FINCOSMOS, an open-world evaluation paradigm for agents doing financial work. A simulated user holds a hidden strategy sampled from a compositional grammar and reveals it only when asked. The agent receives no data, so it must acquire data from the Web, build its own backtest under a data cutoff, and deliver verifiable results. Grading needs no reference answer. Programs verify point-in-time correctness and recompute every reported metric, the delivered strategy is checked against the hidden specification, and a run is accepted only when the user is satisfied and none of 15 veto checks fails. Across four coding agents and a model without tools in 150 sessions, no session is accepted: every session that the simulated user signed off fails a program check, and agents raise only 54--64\\% of the details they were not told. Human experts attribute 88.33\\% of failures to the agents. With FINCOSMOS feedback, an agent with persistent memory learned all ten tasks.", "arxiv_id": "2611.07464", "arxiv_url": "https://arxiv.org/abs/2611.07464", "authors": ["Yupeng Cao", "Xueqing Peng", "Lingfei Qian", "Haohang Li", "Yangyang Yu", "Anke Xu", "Wenbo Cao", "Yan Wang", "Yuechen Jiang", "Yuyan Wang", "Zhuohan Xie", "Yankai Chen", "Zehan Li", "Jimin Huang", "Xue Liu", "Jian-Yun Nie", "Sophia Ananiadou"], "brief": "\u6784\u5efa\u91d1\u878d\u667a\u80fd\u4f53\u5f00\u653e\u4e16\u754c\u8bc4\u6d4b\uff1a\u6a21\u62df\u7528\u6237\u6309\u8be2\u95ee\u62ab\u9732\u9690\u85cf\u7b56\u7565\uff0c\u667a\u80fd\u4f53\u81ea\u884c\u8054\u7f51\u53d6\u6570\u5e76\u56de\u6d4b\u3002\u65e0\u9700\u53c2\u8003\u7b54\u6848\uff0c\u4ee5\u7b56\u7565\u5339\u914d\u3001\u65f6\u70b9\u6838\u9a8c\u548c\u6307\u6807\u91cd\u7b97\u9a8c\u8bc1\u4ea4\u4ed8\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.CL", "q-fin.CP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.07464", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528\u6237\u6ee1\u610f\u4e14\u901a\u8fc7\u5168\u90e815\u9879\u5426\u51b3\u68c0\u67e5\u624d\u7b97\u6210\u529f", "4\u4e2a\u7f16\u7801\u667a\u80fd\u4f53\u53ca1\u4e2a\u65e0\u5de5\u5177\u6a21\u578b\uff0c150\u6b21\u4f1a\u8bdd\u96f6\u901a\u8fc7", "\u501f\u52a9\u8bc4\u6d4b\u53cd\u9988\u4e0e\u6301\u4e45\u8bb0\u5fc6\uff0c\u667a\u80fd\u4f53\u5b66\u4f1a\u5168\u90e810\u9879\u4efb\u52a1"], "keywords": ["\u91d1\u878d\u667a\u80fd\u4f53", "\u5f00\u653e\u4e16\u754c\u8bc4\u6d4b", "\u56de\u6d4b", "\u53ef\u9760\u6027"], "num_comments": 4, "on_hf": true, "organization": "The Fin AI", "pdf_url": "https://arxiv.org/pdf/2611.07464v1", "published_at": "2026-11-05", "score": 0.292, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.07464.png", "title": "FINCOSMO
