 where agents are highly susceptible to various errors. To address this critical gap, we introduce a comprehensive methodology and analytical framework designed specifically to diagnose errors in intermediate workflows. Building upon this framework, we establish a structured taxonomy that categorizes these vulnerabilities into two primary dimensions: System-Level Errors and Task-Level Errors. Through a systematic examination of step-by-step execution traces and agent-environment interactions, we reveal how these underlying errors affect overall performance. Finally, through empirical experiments and systematic analysis of the identified error types, we provide actionable design guidelines, aiming to enhance the robustness, reasoning capabilities, and reliability of Deep Search and Deep Research agents.", "arxiv_id": "2610.29346", "arxiv_url": "https://arxiv.org/abs/2610.29346", "authors": ["Zixuan Yu", "Zhenheng Tang", "Xiaowen Chu", "Bo Han"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29346", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29346v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Benchmarking and Error Analysis of Deep Search and Deep Research LLM Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Personalized shopping benchmarks ask which item fits the user; we ask how far an agent may commit on that item, and pose learning the individual\u0027s auto-purchase line as a task. The boundary is evidence-conditioned and three-valued: whether committing is appropriate depends on the sufficiency of product information (warrant), reversibility, price against the user\u0027s norm, and urgency, not only on fit; and the natural output is don\u0027t buy, confirm first, or buy automatically. Across sixteen instruction-tuned models, autonomous commitment is misaligned with a human authorization reference in which fifteen annotators, role-playing the delegating principal from a given profile, choose the furthest action they would allow without confirmation: models commit even when fit is low and when their own evidence flag reports the warrant missing. This is overreach. The line is individual: these raters disagree, yet the disagreement is structured and partly predictable from a person\u0027s own other labels. A shallow learner on a few dozen of a person\u0027s own labels predicts their held-out auto-purchase line at a median of 0.79 by 30-40 labels, outperforming every evaluated prompt$\\times$model configuration, including a per-annotator oracle over 80 configurations; the learned boundary does not transfer across domains. We release the counterfactual benchmark, human authorization reference, and annotation protocol after acceptance.", "arxiv_id": "2610.29216", "arxiv_url": "https://arxiv.org/abs/2610.29216", "authors": ["Ryotaro Shimizu", "Sai HtaungKham", "Mo Fan"], "brief": "", "categories": ["cs.IR", "cs.CL", "cs.HC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29216", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29216v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Preference Is Not Permission: Personalizing the Auto-Purchase Line in Agentic Commerce", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Through a tangle of real-world interactions, from synthetic training pipelines to data shared on the open web, frontier LLMs absorb what their predecessors and competitors create. How well does each model play its role in this ecosystem, as a creator and as a solver? We introduce Environment Duels, a dynamic agentic benchmark that evaluates both capabilities on interactive environments. Each model writes environments, each with a privileged hint, aiming for tasks that capable solvers fail without the hint and pass with it. Across nine frontier LLMs, solving and authoring prove to be distinct skills: the strongest solvers are not the strongest authors, while smaller models learn more from how others played and write the hardest environments and the most useful hints. Beyond the scores, the pairwise interactions form a microcosm of how models affect one another. Head-to-head outcomes are transitive and so yield a stable ranking; independent authors converge on the same designs; and in a reinforcement-learning study with Qwen3.8-27B, the learner\u0027s hint lift on an author\u0027s environments tracks how much training on those environments improves it on held-out reasoning and agentic benchmarks, whether the environments are its own or another model\u0027s. Each of these patterns has a counterpart in how models shape one another outside the duel. By staging these interactions under controlled conditions, Environment Duels offers a window onto how LLMs teach, challenge and learn from one another. Code is available at https://github.com/LLM-Duels/EnvDuels.", "arxiv_id": "2610.30116", "arxiv_url": "https://arxiv.org/abs/2610.30116", "authors": ["Shibo Jin", "Zhiqiu Xu", "Yiling Zou", "Shangyu Gong", "Mayur Naik"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30116", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30116v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Environment Duels: A Microcosm of LLM Co-Evolution", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Quantitative research is an iterative loop: a researcher proposes a market hypothesis, implements it as an executable signal, tests it on historical data, and decides what to keep. Existing benchmarks score formulas, code, or individual trading decisions, leaving open whether large language models (LLMs) can complete this loop and produce strategies that work beyond the research period. We introduce Quant-Arena, a benchmark and public leaderboard for end-to-end quantitative research on real A-share market data. A model constructs features and stock-scoring code, receives feedback only on 2022--2023, and freezes one strategy for assessment on the sealed year 2024. A cash-account evaluator applies trading constraints and costs, including market impact estimated from a simulated order book. Scores are dominated by realized excess return and complemented by signal quality and the diversity of features used by the strategy. We evaluate nine frontier models, among which GPT-6 Astra scores highest; yet no model beats the equal-weight market in 2024. Quant-Arena is open to submissions from any model or agent harness.", "arxiv_id": "2610.30113", "arxiv_url": "https://arxiv.org/abs/2610.30113", "authors": ["Houde Qian", "Zheng Jiang", "Wenyi Li", "Chenxi Xu", "Xinjie Lin", "Yuzhao Peng", "Ruoyu Han", "Youjie Zheng", "Kaisen Yang", "Qinhuai Na", "You Fu", "Calvin Xiao"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30113", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30113v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Quant-Arena: Benchmarking LLM Agents for Quantitative Trading Research", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-term memory for multimodal agents remains challenging, as it must preserve fine-grained visual evidence while tracking entity evolution across sessions. Existing abstraction-based memories compress images into text, often discarding visually discriminative details, whereas pixel-preserving memories retain raw observations but struggle to reliably associate diverse observations with persistent entity identities and track their evolving states. To address these limitations, we propose MHG-Mem, a multimodal hypergraph memory that jointly organizes entity identity, state evolution, and provenance to visual evidence. Specifically, MHG-Mem represents distinct entity mentions and their observed facts as individual nodes, grouping identity-consistent mentions and facts through occurrence hyperedges. It then synthesizes aspect-specific evolution states from these grouped observations and links them to supporting entities, facts, and source evidence through evolutionary and evidential hyperedges. To navigate this structured memory, we introduce hypergraph-based agentic search, which adaptively selects an entry layer, traverses typed hyperedges across memory levels, and inspects source observations when fine-grained verification is required. These designs support both detailed visual verification and reasoning over cross-session state changes. Extensive experiments across three benchmarks demonstrate the effectiveness of MHG-Mem, improving performance by 8.20-9.98% over the strongest baseline.", "arxiv_id": "2610.29995", "arxiv_url": "https://arxiv.org/abs/2610.29995", "authors": ["Jielong Tang", "Ling-An Zeng", "Xujie Yuan", "Xiao Dong", "Zhiqian Xia", "Qingfeng Li", "Shixiong Kai", "Kaichao Liang", "Rong Yao", "Jian Yin"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29995", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29995v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Remembering Through Change: Provenance-Preserving Hypergraph Memory for Multimodal Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly deployed as agents, yet it remains unclear how their foundational capabilities translate into agentic capabilities. End-to-end scores leave unresolved whether low benchmark capability or weak deployment drives a failure, limiting actionable diagnosis. We bridge foundational and agentic capabilities through an operation-level measurement framework. We represent each model with a foundational profile derived from capability benchmarks and an operation profile derived from interaction trajectories, and define capability realization gaps as deviations of observed operation performance from predictions based on foundational capabilities. Experiments on fifteen model services in $\u03c4^2$-Bench show that foundational profiles only partially predict agentic operations. Models with comparable profiles can differ substantially in execution, and these gaps remain consistent across task subsets. Operation profiles add information and substantially improve task-score prediction. The framework locates execution departures at the operation level to inform model development and agent evaluation. We will release our code and analysis artifacts.", "arxiv_id": "2610.29751", "arxiv_url": "https://arxiv.org/abs/2610.29751", "authors": ["Wei Guo", "Yuanjian Xu", "Jianing Hao", "Yongyao Duan", "Ran Chen", "Zhong Li", "Guang Zhang"], "brief": "", "categories": ["cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29751", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29751v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Bridging Foundational and Agentic Capabilities of LLMs", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval Augmented Generation (RAG) grounds large language models in external knowledge. Modern pipelines combine embedding, chunking, retrieval, reranking, query augmentation, context compression, and agentic verification, yet these techniques are typically evaluated one at a time. It remains unclear whether their isolated gains survive composition, whether retrieval quality and answer faithfulness favor the same design choices, and whether conclusions from small corpora hold at large scale. We pre-declare three hypotheses and introduce LASAGNA, an open-source framework for controlled RAG evaluation. We test 450 configurations across eight benchmarks and corpora ranging from 5K to 200K documents. Three findings emerge. First, individually strong techniques from different phases of a RAG pipeline do not necessarily compose: three retrieval techniques predict a +47% combined improvement but deliver only +17% when used together. Second, component gains stack differently for retrieval and faithfulness, and optimizing one can hurt the other. Third, the best composition changes as the corpus grows: the combination that wins on a small corpus may not remain best at large scale. These findings show that gains measured in isolation are not reliable predictors of realistic performance, and that new RAG techniques should be tested with the full surrounding stack. We call on researchers to do so and supply LASAGNA to simplify these experiments.", "arxiv_id": "2610.29722", "arxiv_url": "https://arxiv.org/abs/2610.29722", "authors": ["Ido Levy", "Segev Shlomov", "Leshem Choshen"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29722", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29722v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Retrieval Augmented Generation Compositionality", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-term agent memory is shifting from predefined workflows toward learnable policies for memory construction and retrieval. Existing learning-based methods either optimize construction alone or combine retrieval-side online reinforcement learning (RL) with offline construction supervision, limiting co-adaptation between the two stages. In this paper, we explore end-to-end online RL for a unified memory manager (Uni-Mem) that learns both capabilities under a shared policy. However, joint optimization with existing RL algorithms such as GRPO faces confounded group comparisons and sparse feedback over long memory-management trajectories. To this end, we propose Stage-Decoupled GRPO, which alternates construction and retrieval optimization while controlling variation from the other stage within each rollout group, yielding stage-specific learning signals. We further introduce Event-Wise Credit Assignment (ECA), which localizes feedback to responsible events and propagates event-level advantages to their constituent operations. Experiments on LoCoMo and LongMemEval show that Uni-Mem outperforms the strongest RL-based memory, demonstrating the effectiveness of jointly learning memory construction and retrieval via Stage-Decoupled GRPO and ECA.", "arxiv_id": "2610.29671", "arxiv_url": "https://arxiv.org/abs/2610.29671", "authors": ["Zhiqian Xia", "Jielong Tang", "Ling-An Zeng", "Shixiong Kai", "Rong Yao", "Hao Kong", "Xiao Dong", "Wei Wang", "Mingxuan Yuan", "Siyu Xia", "Haifeng Xia"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29671", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29671v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Uni-Mem: Learning a Long-Horizon Agentic Memory Manager with Unified Online Policy Optimization", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-context continual pre-training (LCCP) is widely used to improve long-context capability, but how its benefits scale with the number of tokens used for LCCP remains unclear. We investigate this question through modeling, monitoring, and validating the benefits of scaling LCCP. First, we establish an empirical additive power law relating long-context performance to model size and the respective token budgets of short-context pre-training and LCCP. Experiments across five model scales and more than one hundred short- and long-context budget configurations show that the fitted law reproduces the observed trends and extrapolates well to held-out model scales. Second, we introduce \\textsc{Constant-Last4}, a training and observation protocol that averages the four most recent consecutive checkpoints from a constant-learning-rate run to enable stable monitoring along a single extensible training trajectory. Under this protocol, the same scaling-law form fits well and accurately predicts the LCCP performance trajectory of a 1.22B-parameter model trained on approximately 100B LCCP tokens. Finally, downstream evaluations along this trajectory show continued improvements in long-context performance, with no clear sign of saturation within the evaluated range. These gains persist after both 128K context extension and supervised fine-tuning, with benefits extending to long-context understanding and agentic tasks. Together, these results argue for continuing to scale LCCP rather than stopping early: its gains are stably observable along an extensible trajectory, quantitatively predictable, and transferable to downstream tasks.", "arxiv_id": "2610.29352", "arxiv_url": "https://arxiv.org/abs/2610.29352", "authors": ["Ziqing Qiao", "Xiaoyue Xu", "Sikui Zhang", "Yinuo Xu", "Bingxiang He", "Chaojun Xiao", "Xu Han"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29352", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29352v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Don\u0027t Stop Long-Context Continual Pre-Training Too Early: An Empirical Scaling Law", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As LLM agents interact in the wild and shape each other\u0027s decisions, understanding how they converge toward agreement becomes important. We study this in multi-turn conversations where two LLMs discuss subjective matters, can agree or disagree, and may change their stances. Using a linear classifier on individual conversation activations, we identify an internal representation of agreement. We find that it varies substantially across turns and conversations and does not reliably track external agreement at the individual conversation level. We therefore move beyond the representation of agreement in individual conversations, by aggregating the agreement representation across conversations. Externally, this aggregate view reveals a simple structure: when pooled across conversations, agreement can be predicted well with a Markov process, with agreement at each turn being a direct function of agreement at the previous turn. Similarly, when internal agreement is aggregated, it couples with the external Markov agreement through a power-law mapping, exposing Markovian dynamics in internal representations. Additionally, we find that after a change of stance, models express agreement externally before their internal representations reflect the same shift. These results reveal a joint structure between internal and external agreement that emerges only when internal features are aggregated across conversations. Code available at https://github.com/technion-cs-nlp/SeeingTheForestForTheTrees.", "arxiv_id": "2610.29328", "arxiv_url": "https://arxiv.org/abs/2610.29328", "authors": ["Adi Simhi", "Yaniv Nikankin", "Jonathan Herzig", "Idan Szpektor", "Yonatan Belinkov", "Shay B. Cohen"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29328", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29328v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Seeing the Forest for the Trees: Emergent Agreement from Individual Conversations", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic search depends on the interface through which a language-model agent accesses and explores a corpus. Existing interface designs are fixed by hand and applied unchanged to every corpus, although effective designs may depend on the corpus. We introduce SearchWeaver, a framework for automatic search interface optimization guided by downstream search performance. A proposer uses execution trajectories and task rewards to jointly revise corpus artifacts, executable tools, and usage instructions. This pro cess optimizes what information is prepared in advance, which operations tools perform, and which decisions remain with the search agent. With GPT-5.4-nano, the optimized interfaces improve answer accuracy from 71.6% to 78.4% on BrowseComp-Plus and average nDCG@10 from 45.7 to 55.0 across four BRIGHT subsets over Direct Corpus Interaction. These findings highlight the value of jointly optimizing corpus artifacts, executable tools, and usage instructions to develop effective search interfaces.", "arxiv_id": "2610.29250", "arxiv_url": "https://arxiv.org/abs/2610.29250", "authors": ["Sangjune An", "Jaeyoon Jung", "Yumin Choi", "Jinheon Baek", "Junmo Cho", "Sung Ju Hwang", "Hae Beom Lee"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29250", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29250v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Let Agents Design How They Search: Automatic Interface Optimization for Agentic Search", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) demonstrate impressive emergent reasoning capabilities, yet they remain constrained by fixed model parameters and finite context windows. Even when augmented with static retrieval, they can produce statements that are unsupported by, or even contradictory to, retrieved evidence. This leads to hallucinations, difficulty incorporating up-to-date information, and failures to correctly interpret or reconcile sources. Recent work addresses these limitations by tightly coupling step-by-step reasoning with interactive search, treating retrieval as an action within an iterative agentic loop rather than a one-shot preprocessing step. This study reviews frameworks that implement such reasoning-search loops by interleaving planning, querying, retrieval, integration, verification, and stopping. We analyze these systems through four architectural axes: retrieval coupling, controller design, knowledge source, and grounding strictness. We separately treat the learning signal as a cross-cutting dimension because prompting, supervision, preference optimization, and reinforcement learning can instantiate the same architecture while producing materially different search, stopping, and grounding behavior. We further distinguish benchmark difficulty from RSA-loop demand and synthesize controlled within-study ablations and quality-cost deltas, avoiding invalid pooling across heterogeneous model backbones, retrievers, corpora, and evaluation protocols. Our goal is to clarify the landscape of reasoning-search-augmented LLMs and outline a unified perspective on the design choices shaping future research.", "arxiv_id": "2610.29189", "arxiv_url": "https://arxiv.org/abs/2610.29189", "authors": ["Biswas Poudel", "Nilson Chapagain", "Amit Kumar", "Xianshun Jiang"], "brief": "", "categories": ["cs.IR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29189", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29189v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Reasoning-Search-Augmented LLMs: An Operational Taxonomy, Benchmark Analysis and Controlled Evidence Synthesis", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cinematic multi-shot video generation requires both narrative planning and iterative refinement. Existing methods either lack narrative reasoning or rely on feed-forward workflows without policy updates. In this paper, we propose CineEvolve, an agentic self-evolution framework for cinematic multi-shot video generation that unifies a Director and a Critic within a single vision-language policy. Emulating real-world filmmaking that couples iterative direction with critical feedback, we train CineEvolve via alternating reinforcement learning, where the Director surfaces flaws to sharpen the Critic, and the updated Critic guides the Director\u0027s targeted revisions. To stabilize co-evolution, we introduce Evolutionary GRPO (E-GRPO), leveraging historical anchoring and revision safeguarding to mitigate advantage inflation. Additionally, we contribute CineTraj, a 40K cinematic trajectory dataset spanning creation, critique, and revision. Extensive experiments demonstrate that CineEvolve outperforms existing approaches. Our code will be available at https://github.com/JingZhe-8/CineEvolve.", "arxiv_id": "2610.29590", "arxiv_url": "https://arxiv.org/abs/2610.29590", "authors": ["Jingzhe Zhang", "Peixuan Zhang", "Genying Li", "Bing Ma", "Shuchen Weng", "Si Li", "Boxin Shi"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29590", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29590v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CineEvolve: An Agentic Self-Evolution Framework for Cinematic Multi-Shot Video Generation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) have made rapid progress in general visual understanding, yet they still struggle with fine-grained instance-level consistency verification, where the goal is to determine whether two images depict the exact same physical object under varying viewpoints, illumination, and backgrounds. This task requires both global semantic perception and precise examination of subtle local evidence, since semantically similar objects may differ only in small suspicious regions. To address this challenge, we propose LocalAgent, a collaborative agentic framework that integrates the complementary strengths of a generalist MLLM and lightweight specialist verifiers. The MLLM first reasons globally to identify suspicious local regions, which are then delegated to a Local Evidence Verifier (LEV) toolkit for fine-grained appearance and geometric matching. LEV comprises Local Appearance Consistency (LAC), which estimates appearance similarity under illumination and color changes, and Local Geometric Correspondence (LGC), which estimates spatial correspondence under viewpoint changes. LEV returns structured scalar evidence that the MLLM integrates for the final decision. We further introduce an auxiliary-capped reinforcement fine-tuning (RFT) strategy, in which answer correctness dominates auxiliary tool-use and format signals, enabling the policy to learn when verification is necessary. Experiments show that LocalAgent improves mean accuracy by 4.9% over the strongest CoT-RFT baseline while invoking a verifier on only 12.13% of samples and preserving the general multimodal capabilities of the underlying MLLM. The open-source repository is available at https://github.com/Firefly-zoo/LocalAgent-main.", "arxiv_id": "2610.29174", "arxiv_url": "https://arxiv.org/abs/2610.29174", "authors": ["Jiachen Guo", "Xinshan Zhu", "Boyun Wang", "Yanyan Liang", "Jun Wan", "Feng Lin", "Ajian Liu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29174", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29174v1", "published_at": "2026-10-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "LocalAgent: Collaborative Agentic Verification for Fine-Grained Instance-Level Consistency", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Moving from controllable videos to genuinely playable worlds requires persistent world state, executable game rules, and low-latency interaction. We outline a roadmap for the next generation of Matrix-Game that separates game execution from visual generation through an executable game harness, and introduce Matrix-Game 4.0 as the first system built on this design. A lightweight game engine maintains world state and executes interaction rules, a multimodal coding agent translates player ideas into game code and dynamic scene captions, and a renderer based on autoregressive video model transforms engine-rendered low-poly proxies into detailed visuals, conditioned on dynamic captions and memory references. This framework provides continuous guidance for visual generation and enables natural-language creation and modification of scenes and gameplay. Our renderer is trained on aligned low-poly and high-fidelity video pairs and distilled into a causal generator that generates in four-frame chunks with one or two denoising steps. Together with targeted inference optimizations, Matrix-Game 4.0 enables 480p, 60 FPS gameplay on a single NVIDIA RTX5090 with a key-press-to-display latency of 112ms. Single-step generation achieves 83FPS steady-state throughput with 18.2GiB of peak GPU memory usage. With fixed prompts, steady-state throughput also reaches 67FPS on an RTX5080 and 58FPS on an RTX5070Ti. We demonstrate customizable shooter and driving games with engine-enforced mechanics, and release code, model weights, and low-poly game assets to support research and creation of playable game worlds.", "arxiv_id": "2610.27999", "arxiv_url": "https://arxiv.org/abs/2610.27999", "authors": ["Jihai Zhang", "Runjia Qian", "Kaiqin Kong", "Biao Jiang", "Puyi Wang", "Siru Chen", "Tianle Li", "Guanjie Chen", "Junyi Wu", "Chubin Chen", "Yuanhang Li", "Kaichen Huang", "Haobo Zhang", "Yangguang Li", "Wei Yu", "Guibin Chen", "Yu Cheng", "Yahui Zhou"], "brief": "", "categories": ["cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27999", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27999v1", "published_at": "2026-10-20", "score": 0.143, "selected_reasons": ["HF trending (182\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.27999.png", "title": "Matrix-Game 4.0: Harnessing Video Models for Real-Time Playable Game Worlds", "tldr": null, "upvotes": 182, "what_it_is": null, "why_notable": null}, {"abstract": "Model--harness co-evolution has emerged as a prominent paradigm for recursive self-improving (RSI) agents, jointly evolving their execution scaffolds and intrinsic capabilities. We study the persistent yet often overlooked brain--body mismatch problem in this paradigm, where an evolving harness (body) demands behaviors its model (brain) has not learned or restricts capabilities it already possesses. We introduce CoEvo-RSI, a RSI framework that advances model--harness co-evolution through agent-driven, bidirectional historical inheritance. Drawing on a shared evolutionary archive and execution feedback, a meta-agent coordinates harness development from historical designs with model checkpoint selection or merging and subsequent adaptation under the selected harness, aligning inherited capabilities with evolving execution requirements to reduce brain--body mismatch. Using only supervised fine-tuning (SFT) on its own rejection-sampled trajectories, CoEvo-RSI makes Qwen3.5-9B competitive with larger models across diverse vertical applications, including multi-agent failure attribution, role-aware text-to-SQL, and smart-home instruction following. It surpasses DeepSeek-V4-Pro on TraceElephant (+14.16 agent accuracy) and GLM-5.3 on HomeBench VM (+4.90 success rate), underscoring the need for brain--body alignment and the potential of bidirectional historical inheritance to advance agent co-evolution.", "arxiv_id": "2610.25078", "arxiv_url": "https://arxiv.org/abs/2610.25078", "authors": ["Jiaqi Su", "Guibin Zhang", "Jie-Jing Shao", "Cong Pang", "Tiankuo Yao", "Ivor Tsang", "Haiyan Yin", "Shuicheng Yan"], "brief": "", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/SuJQ0722/CoEvo-RSI", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.25078", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25078v1", "published_at": "2026-10-18", "score": 0.139, "selected_reasons": ["HF trending (80\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25078.png", "title": "CoEvo-RSI: When Harnesses Evolve, Which Models Should Follow?", "tldr": null, "upvotes": 80, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable multi-view forecasting requires videos from different cameras to describe the same evolving 3D scene. To this end, we introduce Video-Point Model (VPM), a world model that conditions on multi-view video histories and a language instruction to jointly forecast future videos from arbitrary viewpoints and the 3D trajectories of persistent scene points. We extend a pretrained world model with camera-conditioned multi-view processing that integrates complementary observations across cameras, and add a trajectory head that predicts how physical points move through time. Each trajectory tracks a single point across all views, and supervising these trajectories alongside video generation therefore anchors appearance changes in every camera to a shared description of 3D motion. To support training and evaluation, we build VPM-Data, a simulation corpus pairing synchronized multi-view videos with persistent point trajectories, and VP-WorldBench, a forecasting benchmark spanning simulated and real environments. We further extend VPM to robot control by adding robot actions as a token modality in the generator. Action tokens share the point-supervised backbone and are denoised jointly with future videos, thereby grounding the policy in the same 3D-aware representation. On VP-WorldBench and existing 4D generation benchmarks, point supervision improves both video fidelity and 3D motion accuracy over a video-only counterpart, and in simulated and real-robot experiments, it also raises the manipulation success of the action-enabled model.", "arxiv_id": "2610.28594", "arxiv_url": "https://arxiv.org/abs/2610.28594", "authors": ["Byungwoo Jeon", "Sunghwan Hong", "Dohyeon Kim", "Jonghoon Lee", "Jungwoo Park", "Inhee Lee", "Doosan Baek", "Jinil Kim", "Taehyun Lim", "Hanbyul Joo", "Marc Pollefeys", "Saining Xie", "Jinwoo Shin"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/rootyJeon/VPM", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.28594", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28594v1", "published_at": "2026-10-20", "score": 0.13, "selected_reasons": ["HF trending (42\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28594.png", "title": "Learning the 4D World through Point Trajectory Forecasting", "tldr": null, "upvotes": 42, "what_it_is": null, "why_notable": null}, {"abstract": "Omni LLMs can naturally locate key audio and visual evidence and integrate information across modalities for audiovisual reasoning. Existing audio-visual reasoning benchmarks that mainly rely on multiple-choice questions usually score models solely based on answer correctness, making it difficult to assess whether a model truly forms a reasoning chain from evidence to the correct answer. In addition, textual or unimodal shortcuts may allow models to answer correctly without analyzing the necessary audio-visual evidence, further weakening the reliability of evaluation benchmarks. To address these issues, we introduce EvaOmni, an evidence-grounded benchmark containing 392 videos and 1,027 purely human-annotated question-answer pairs, covering 15 capabilities and three levels: retrieval and localization, basic understanding, and complex reasoning. We design a series of rigorous annotation procedures in which experts annotate audio and visual evidence and construct video-based distractors; humans review whether questions meet strict inspection criteria, and finally models filter textual and unimodal shortcuts. Beyond high-quality question-answer pairs, we require models to simultaneously return the answer and supporting evidence intervals in order to evaluate the complete reasoning chain. We propose the Coverage Grounded Score (C.G.) to measure how much annotated evidence a model identifies, and the Bottleneck Grounded Score (B.G.) to penalize poor temporal localization in either modality; both are incorporated into answer correctness. Across 7 open-weight and 17 proprietary Omni LLMs, Gemini3.7-Flash achieved the highest overall accuracy (79.4%), C.G. (70.8%), and B.G. (35.1%). At Level 3, it reached 79.1% accuracy, but its B.G. was only 12.3%. These results show that even the most advanced models still have room for development in grounded audio-visual reasoning.", "arxiv_id": "2610.28444", "arxiv_url": "https://arxiv.org/abs/2610.28444", "authors": ["Xiaoxing Hu", "Wenxi Yao", "Chaoyuan Shi", "Ziqi Ye", "Xiaorong Guo", "Peixuan Li", "Zhuoran Sun", "Ziyang Gong", "Peiyuan Zhang", "Mingxin Liu", "Shuran Ma", "Hongbo Liu", "Xiaomin Yu", "Yu Tian", "Wentao Wang", "Zhenjie Yang", "Jian Hu", "Yunhang Shen", "Haoyu Cao", "Xue Yang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/VisionXLab/EvaOmni", "github_stars": 19, "hf_url": "https://huggingface.co/papers/2610.28444", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "SJTU VisionXLab", "pdf_url": "https://arxiv.org/pdf/2610.28444v2", "published_at": "2026-10-20", "score": 0.11, "selected_reasons": ["HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28444.png", "title": "EvaOmni: An Evidence-Grounded Benchmark for Audio-Visual Reasoning", "tldr": null, "upvotes": 18, "what_it_is": null, "why_notable": null}, {"abstract": "Decision models support routing, guardrails, and output verification in LLM systems. However, item accuracy alone cannot establish whether models make correct decisions across controlled variations or assign reliable confidence to their predictions. We introduce DecisionPivot, a diagnostic benchmark comprising 48 tasks and 40,033 items across seven decision roles. Its core track contains 7,800 items from 13 generated task families, organized into contrast groups with computed answers verified by independently implemented solvers. The complementary reference track contains 32,233 items from 35 public test sets, preserving their original evaluation metrics. We evaluate 40 decision models and 14 general models using documented, model-specific protocols, assessing item and contrast-group accuracy, probability ordering, calibration, and empirical selective coverage. Our results reveal substantial differences obscured by aggregate scores: two 27B models separated by only 2.6 points on the reference track achieve contrast-group accuracies of 70.1% and 44.2%. Across 2,400 binary contrast pairs, Perplexity Decider correctly ranks the positive member above the negative member in 92.3% of pairs but answers both members correctly in only 74.1%, exposing a gap between probability ordering and decision correctness. Models with similar item accuracy also differ in the reliability of their high-confidence predictions. On a separate 1,296-item subset, GLM-5.3 achieves 93.5\\% contrast-group accuracy at a higher reasoning setting, compared with 81.5% at its lowest effort. By linking errors to pivotal details and difficulty levels, DecisionPivot provides fine-grained diagnostics of decision failures that aggregate evaluation alone cannot reveal.", "arxiv_id": "2610.28522", "arxiv_url": "https://arxiv.org/abs/2610.28522", "authors": ["Xialie Zhuang", "Mingcong Lei", "Zunhai Su", "Ri Liu", "Jianjin Li", "Peixian Ma", "Jia Pan", "Ngai Wong", "Guanhua Chen", "Chuan-Wei Kuo"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/StartLuxLabs/DecisionPivot", "github_stars": 23, "hf_url": "https://huggingface.co/papers/2610.28522", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "StartLux", "pdf_url": "https://arxiv.org/pdf/2610.28522v1", "published_at": "2026-10-20", "score": 0.107, "selected_reasons": ["HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28522.png", "title": "DecisionPivot: A Diagnostic Benchmark for Decision Models in LLM Systems", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Digital art generation has undergone a massive paradigm shift, moving from static image synthesis to dynamic video generation that can mimic the human painting process. While existing models can synthesize visually stunning time-lapses of paintings being created or \"unpainted,\" they largely treat the creative process as a black box. Current conditioning mechanisms are either too rigid, relying on static geometric cues like Canny edges or depth maps, or too holistic, utilizing simple scalar progress variables that offer no localized control. Consequently, users lack the agency to steer how a painting evolves over time. In this work, we argue that true control over the video generation of artwork requires a joint understanding of two fundamental dimensions: where an artist acts, and when those actions take place. To achieve this, we introduce the Painting Change Map, a novel spatio-temporal control mechanism that explicitly tracks normalized structural changes across a 1,000-timestep continuum, a resolution sufficient to capture fine-grained stroke-level changes while remaining computationally tractable. By mapping localized visual differences into an encoded RGB space, our representation enables fine-grained guidance for both the forward painting and reverse unpainting processes. Extensive benchmarking demonstrates the efficacy of our approach. We outperform existing control baselines and achieve competitive or superior results compared to state-of-the-art painting methods. Furthermore, under oracle conditions, our method surpasses all baselines by a significant margin. Code is available at https://github.com/Markus-Pobitzer/painting-change-map.", "arxiv_id": "2610.25369", "arxiv_url": "https://arxiv.org/abs/2610.25369", "authors": ["Markus Pobitzer", "Chang Liu", "Niccol\u00f2 Biondi", "Nicu Sebe"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Markus-Pobitzer/painting-change-map", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2610.25369", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Multimedia and Human Understanding Group", "pdf_url": "https://arxiv.org/pdf/2610.25369v2", "published_at": "2026-10-18", "score": 0.105, "selected_reasons": ["HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25369.png", "title": "Painting Change Map as guidance for generating painting processes", "tldr": null, "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "We present \u00c9pi, an autonomous research agent that sustains investigations across model sessions and evolves its methods through accumulated experience. \u00c9pi combines persistent research history, hierarchical memory, branching and independent review to maintain research continuity, learn from experiments, and explore and revisit alternative approaches. Its experiments run across session boundaries, and a fixed verifier evaluates their outputs. \u00c9pi produced 120 record-setting results, comprising 20 numerical bound records across 12 families and 100 construction records across eight families. These include an approximately 84-fold narrower interval for the $n$-queens constant and a more than 3.6-million-fold narrower rigorous interval for the quartic Feigenbaum attractor dimension. Exact dual certificates establish that the Cohn-Elkies linear-programming bound cannot be sharp in dimensions 10 and 11. Beyond numerical improvements, \u00c9pi gives a computer-assisted proof of Tuza\u0027s conjecture for split graphs with an eight-vertex clique part and at most three triangle-active neighborhood types, with arbitrary multiplicities. We extend this research process to algorithmic coding with \u00c9pi-turbo, a lightweight configuration that develops executable solvers for tasks including vehicle routing, scheduling and production planning. On 30 FrontierOR tasks, \u00c9pi-turbo achieves a 5.4% higher total benchmark score than Codex at 64% of its model cost, using the same underlying model and reasoning effort. \u00c9pi is designed to support human understanding by connecting computational results to explicit methods and mathematical arguments that researchers can examine and build upon.", "arxiv_id": "2610.24944", "arxiv_url": "https://arxiv.org/abs/2610.24944", "authors": ["Yue Huang", "Zhangchen Xu", "Xiaonan Luo", "Zheyuan Liu", "Lichi Li", "Yiping Wang", "Peiyang Song", "Eric Gabriel Ramos", "Enze Xie", "Olexandr Isayev", "Paul Liang", "Nouha Dziri", "Huan Sun", "Jianfeng Gao", "Ying Liu", "Misha Sra", "Xiangliang Zhang", "Alex Pentland", "Zichen Chen"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/BakeLab/Epi-results", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2610.24944", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "BakeLab", "pdf_url": "https://arxiv.org/pdf/2610.24944v1", "published_at": "2026-10-18", "score": 0.102, "selected_reasons": ["HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24944.png", "title": "Epi: Towards a Persistent, Self-Improving Agent for Autonomous Research", "tldr": null, "upvotes": 18, "what_it_is": null, "why_notable": null}, {"abstract": "Continuous flow language models offer a path to parallel generation with tools for control and acceleration unavailable to discrete diffusion, yet effective techniques for building them at the billion-parameter scale remain less established. We present Lafa (Large flow language model), a fast, high-performing flow language model scaled to 8B parameters in a data-efficient manner. Lafa is a blockwise flow model with causal attention on the prefix and bidirectional, asynchronous flow within each block. This design enables efficient training by adapting pretrained autoregressive (AR) models and fast inference via prefix caching and blockwise parallel decoding. We train Lafa at 0.5B, 7B, and 8B scales with fewer than 30B tokens, more efficient than previous diffusion models, and evaluate it on instruction following, reasoning, and coding, where the learned flow matches or surpasses the quality of AR and can be distilled into flow maps for one- and few-step generation. Notably, flow training preserves or even improves pretrained AR capabilities via a multi-token prediction effect, which we leverage in a self-speculative decoding scheme that verifies flow-based drafts autoregressively within a single model. This yields 2.54x the throughput of an AR model at comparable quality, outperforming multi-token prediction and discrete diffusion methods. Our findings show that continuous flows can serve as a scalable foundation for language modeling.", "arxiv_id": "2610.28559", "arxiv_url": "https://arxiv.org/abs/2610.28559", "authors": ["Arnav Chavan", "Chanhyuk Lee", "Udbhav Bamba", "Jaehoon Yoo", "Seunghoon Hong", "Aditi Raghunathan", "Jinwoo Kim"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/lafa-gh/large-flow-lms", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2610.28559", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28559v1", "published_at": "2026-10-20", "score": 0.094, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28559.png", "title": "Large Flow Language Models", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Spatio-Temporal Video Grounding (STVG) aims to jointly localize a target in space and time given a natural-language query. Despite continued advances, existing STVG benchmarks remain largely centered on localizing targets through instance-specific descriptions, leaving them largely decoupled from long-form reasoning increasingly emphasized in multimodal large language models (MLLMs). In this paper, we introduce Event-STVG, a task that shifts STVG from locating what is described toward event-level reasoning by unifying long-form context, repeated-event reasoning, event localization, role inference, and multi-target grounding. To facilitate research on Event-STVG, we construct a large-scale benchmark comprising 4,016 annotated event occurrences across soccer and seven additional domains. Experiments with state-of-the-art MLLMs reveal substantial difficulty, with the strongest model achieving only 5.4% m-vIoU at the 10-minute horizon. Across domains, we consistently observe confusion among repeated same-type events, spatial grounding bottlenecks, and rare success in jointly grounding all required roles. Event-STVG establishes a new challenge for visual understanding in MLLMs, calling for future models that can jointly reason about complex events across space and time. Code and annotations are available at https://github.com/THU-KEG/EventSTVG", "arxiv_id": "2610.22444", "arxiv_url": "https://arxiv.org/abs/2610.22444", "authors": ["Yizhe Zhang", "Xujia Wang", "Songqi Tang", "Xujie Tang", "Leo Jiahao Jiang", "Jiacheng Wang", "Bowen Qu", "JinBo Li", "Qin Wang", "Ji Qi", "Lei Hou", "Bin Xu", "Juanzi Li"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/THU-KEG/EventSTVG", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.22444", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22444v1", "published_at": "2026-10-15", "score": 0.091, "selected_reasons": ["HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22444.png", "title": "Event-STVG: Spatio-Temporal Video Grounding for Long-Form Event Reasoning", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Mixture-of-experts (MoE) models often exceed a single accelerator\u0027s memory capacity. Offloading experts to host memory creates a severe PCIe I/O bottleneck because data-dependent routing keeps transfers on the critical path. We present Specter, an inference system that uses quantization to combine speculative decoding with expert offloading. Its lightweight quantized draft model runs efficiently on device while preserving high-fidelity expert activation patterns. This provides accurate multi-step lookahead over future expert usage, allowing the runtime to organize expert movement and execution ahead of verification and improve both communication and execution efficiency. Under single-request inference, Specter achieves an average 1.50x (up to 1.88x) speedup in time per output token (TPOT) over the state-of-the-art system. Specter makes memory-constrained, single-GPU MoE inference more practical on commodity hardware. Our code is available at https://github.com/wwwwwf/specter_asplos.", "arxiv_id": "2511.14102", "arxiv_url": "https://arxiv.org/abs/2511.14102", "authors": ["Wenfeng Wang", "Xiaofeng Hou", "Xinfeng Xia", "Xinkai WAng", "Mingxuan Zhang", "Peng Tang", "Jiacheng Liu", "Chao Li"], "brief": "", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2511.14102", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2511.14102v2", "published_at": "2025-11-18", "score": 0.088, "selected_reasons": ["HF trending (20\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2511.14102.png", "title": "Specter: Fast MoE Inference via Quantization-Enabled Multi-Step Speculative Offloading", "tldr": null, "upvotes": 20, "what_it_is": null, "why_notable": null}, {"abstract": "Humanoid loco-manipulation requires coordinated whole-body interaction with the physical world, yet collecting robot demonstrations at scale remains costly. Human demonstrations offer a scalable alternative, but existing egocentric human supervision often omits locomotion and posture, while embodiment differences and controller dynamics hinder accurate end-effector execution. We introduce HumanVerse, a 500-hour dataset of open-world human loco-manipulation pairing egocentric video with synchronized body and hand motion. Our human-to-humanoid pipeline aligns camera viewpoints and arm appearance, and refines motion references and controller inputs offline to reduce end-effector errors while preserving whole-body coordination. We validate the pipeline through zero-shot transfer to Unitree G1 on representative whole-body manipulation and long-range loco-manipulation tasks, without target-task robot demonstrations. Building on this pipeline, we develop $\u03bb_0$, a humanoid foundation model for whole-body loco-manipulation, with robot-aligned human demonstrations providing supervision for mid-training. Increasing whole-body human data consistently improves downstream task progress. $\u03bb_0$ achieves 90.0% success on SIMPLE and 62.5% across real-world loco-manipulation tasks. We expect this study to guide scalable whole-body human data collection toward humanoid foundation models for richer interaction with the physical world. Homepage: https://lambdahumanoid.github.io/", "arxiv_id": "2610.18950", "arxiv_url": "https://arxiv.org/abs/2610.18950", "authors": ["Lambda-humanoid Team", ":", "Chongyang Xu", "Jin Chen", "Jinhui Ye", "Yilun Chen", "Yiming Jiang", "Zhao Wu", "Hu Wei", "Lin Qu", "Shifeng Zhang", "Yisheng He", "Yuming Jiang", "Zenan Meng", "Zheng Wu", "Mu Xu", "Steven Hoi"], "brief": "", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/LambdaHumanoid/openlambda", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2610.18950", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Lambda Humanoid", "pdf_url": "https://arxiv.org/pdf/2610.18950v2", "published_at": "2026-10-13", "score": 0.086, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18950.png", "title": "$\u03bb_0$: Scaling Open-World Egocentric Human Data for Humanoid Loco-Manipulation", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "MLLM-based detectors formulate vision-language grounding as autoregressive coordinate generation, yet in dense scenes, they often collapse into a box repetition loop, repeatedly emitting identical boxes until the decoding budget is exhausted. We trace this failure to historical-answer attention takeover: Under full-history autoregression, repeated coordinate tokens in the growing answer history attract disproportionate attention, crowding out the attention sinks needed to attend to new visual evidence. % To break this loop, in this paper, we propose \\textbf{Compressed Window Auto-Regression} (WinAR). This new mechanism partitions a long answer sequence into consecutive generation windows and restricts full token-level autoregression to the current window only while compressing each previous window into a fixed set of latent tokens that condition subsequent decoding. This design reduces the repeated exposure to raw historical coordinates that triggers the attention takeover, yet preserves cross-window dependencies essential for coherent multi-object generation. On RSDense, which contains 200-2,000 objects per image, our model WinARDet improves RexOmni F1-score (IoU=0.5) from 32.16 to 39.36 over the baseline, while reducing the redundancy rate from 35.48% to 13.00%. WinARDet also generalizes across decoding strategies and output formats, including parallel box decoding and polygon generation, providing a practical paradigm for long-horizon vision-language grounding across scene densities.", "arxiv_id": "2610.19419", "arxiv_url": "https://arxiv.org/abs/2610.19419", "authors": ["Chenxu Wang", "Hangyi Kuang", "Bo-Wen Yin", "Yuxuan Li", "Quan-Sheng Zeng", "Yang Zhang", "Xu Guo", "Xiang Li", "Qibin Hou"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/facias914/WinARDet", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.19419", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Nankai University", "pdf_url": "https://arxiv.org/pdf/2610.19419v1", "published_at": "2026-10-14", "score": 0.086, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.19419.png", "title": "WinARDet: Compressed Window Auto-Regression for Long-Horizon Vision-Language Grounding", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion Transformers (DiTs) achieve high-fidelity image and video generation, but they suffer from substantial inference costs due to repeated transformer evaluations across many denoising steps. Feature caching reduces this cost by reusing features across denoising steps. Recent forecasting methods extend this idea by extrapolating features to skipped steps instead of reusing them. However, existing forecasting methods extrapolate the features they predict uniformly, even though the spatial-frequency components of these features change most at different stages of denoising. They also overlook that denoising progresses nonuniformly, so equal step intervals can correspond to very different amounts of change. These mismatches amplify forecast errors as more steps are skipped, limiting the achievable acceleration. We propose SpecKCast, a training-free method that forecasts the model output in the frequency domain. SpecKCast applies a 2D discrete cosine transform (DCT) to the output and tracks each coefficient with a lightweight Kalman filter along a band-specific time coordinate derived from the noise schedule. The filter tracks each coefficient\u0027s value and rate of change, and the transformer is evaluated only when the filter\u0027s forecast uncertainty exceeds a threshold. Experiments on FLUX.1-dev, Qwen-Image, Wan2.1-14B, and HunyuanVideo show that SpecKCast achieves a better trade-off between acceleration and fidelity than existing caching and forecasting methods, reaching up to 6x speedup with less than 0.05 GiB of additional memory.", "arxiv_id": "2610.26837", "arxiv_url": "https://arxiv.org/abs/2610.26837", "authors": ["Javad Rajabi", "Hakki Can Karaimer", "David B. Lindell", "Babak Taati", "Michael S. Brown"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.26837", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Samsung Research", "pdf_url": "https://arxiv.org/pdf/2610.26837v1", "published_at": "2026-10-19", "score": 0.086, "selected_reasons": ["HF trending (22\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26837.png", "title": "SpecKCast: Spectral Kalman Forecasting for Diffusion Acceleration", "tldr": null, "upvotes": 22, "what_it_is": null, "why_notable": null}, {"abstract": "Computer-use agents are limited by the interfaces humans give them. An agent may type a spreadsheet cell by cell when a single line of code would do, or print all two thousand lines of a file through a shell to find one function. Both the interfaces and the knowledge of when to use each are built by hand, which cannot keep pace with new applications, workflows, and models. We argue that interface design should itself be an agent capability. We introduce Agent S4, an autonomous computer-use scientist that builds Evolving Agent Interfaces from task experience. A meta-agent examines task agents\u0027 trajectories on synthetic training tasks, without success labels, and constructs and revises interfaces and usage knowledge in a repository. Population-based evolution then selects which repositories to develop further by their performance on validation tasks the meta-agent never sees, favoring changes that generalize beyond the seen tasks. On OSWorld V2, Agent S4, with Qwen3.8-27B and the evolved repository of interfaces, sets a new state of the art in open-source computer-use agents, reaching 21.3% binary score, 3.8 times the same model with fixed interfaces. This is above both GPT-5.5 (13.0%) and Claude Opus 4.8 (20.6%), at about 4.3% and 1.5% of their respective costs. On ScienceBoard, the evolved interfaces improve the success rate from 41.4% to 58.6% with the same model. These results suggest that useful interfaces can be evolved from experience, making autonomous interface design a source of improvement complementary to advances in models and harnesses. We open-source our code at https://github.com/simular-ai/agent-s.", "arxiv_id": "2610.28601", "arxiv_url": "https://arxiv.org/abs/2610.28601", "authors": ["Saaket Agashe", "Yuzhe Yang", "Gonzalo Gonzalez-Pumariega", "Bhuvan Chandra Koduru", "Chih-Lun Li", "Jiachen Yang", "Ang Li", "Xin Eric Wang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28601", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28601v1", "published_at": "2026-10-20", "score": 0.085, "selected_reasons": ["HF trending (19\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28601.png", "title": "Evolving Agent Interfaces", "tldr": null, "upvotes": 19, "what_it_is": null, "why_notable": null}, {"abstract": "Recent video generation models produce visually compelling outputs, yet their physical plausibility remains poorly measured. Physical plausibility asks whether generated objects obey geometry, kinematics, dynamics, and conservation laws. Existing benchmarks rely on coarse visual-language model judgments or target embodied world models rather than video generation itself. We introduce PVBench, a physical video benchmark that quantitatively measures the plausibility of generated videos across 46 dimensions organized into seven domains, spanning: i) instruction and semantic fidelity, ii) behavioral and causal consistency, iii) perceptual and temporal quality, iv) geometric and spatial consistency, v) material properties and field states, vi) kinematic and spatiotemporal persistence, vii) and mechanical plausibility with conservation laws. PVBench comprises 600 carefully crafted prompts, of which 30% involve physical embodied agents such as robot arms, humanoids, quadrupeds, and multi-agent systems. For challenging physically tractable dimensions, it pairs each with specialized vision models that derive verifiable, physically grounded measurements, such as object-level 6D pose, metric scale, surface normals, kinematics, and numerical conservation-law residuals. It thus avoids relying solely on subjective scoring, while supporting both text-to-video and image-to-video generation. Finally, we validate the agreement between automatic metrics and human judgments through human evaluation. Meanwhile, we evaluate mainstream open-source and closed-source models and present several insights. By releasing the benchmark, prompts, and calibration protocol, we aim to foster physically grounded video generation.", "arxiv_id": "2610.26711", "arxiv_url": "https://arxiv.org/abs/2610.26711", "authors": ["Kaiwei Chen", "Moran Li", "Zhenye Gan", "Yabiao Wang", "Chengjie Wang", "Kexin Zhang", "Yong Liu", "Jiangning Zhang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/KSZG-11/PVBench", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2610.26711", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26711v1", "published_at": "2026-10-19", "score": 0.077, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26711.png", "title": "PVBench: Quantifying Physical Plausibility in Video Generation with Object-Level Physical Measurements", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Modern language models are increasingly asked to handle several tasks within a single prompt. Doing so requires solving each task correctly while integrating the resulting answers into a coherent response. In this paper, we identify a fundamental limitation in this process, where models make substantially more errors when tasks are composed, even when they can solve every constituent task reliably in isolation. This degradation cannot be fully explained by the accumulation of independent errors. Across both open-weight models and the frontier model Claude Opus 5, our findings instead point to an implicit thinking budget underlying this effect. In particular, under composition, models use substantially fewer tokens per task than in isolation, even when the full sequence remains well within the context window. Tasks that require longer solution traces in isolation are consequently more $\\textit{fragile}$ under composition, i.e., models make more errors on prompts containing these tasks. In isolation, non-fragile tasks receive more reasoning than they need and waste compute. However, by grouping tasks according to their fragility, the implicit budgeting can be manipulated to reduce token usage by $43$\\% across a range of math and linguistic tasks while also preserving accuracy.", "arxiv_id": "2610.27190", "arxiv_url": "https://arxiv.org/abs/2610.27190", "authors": ["Chenpan Li", "Thies Brockmoeller", "Stefanie Jegelka", "Sharut Gupta", "Nikolaos Karalias"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/chenpanli/fragility", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.27190", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Technical University of Munich", "pdf_url": "https://arxiv.org/pdf/2610.27190v1", "published_at": "2026-10-19", "score": 0.074, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.27190.png", "title": "On the Fragility of Tasks under Composition: Implicit Budgeting in Language Models", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Agent scaffolds increasingly delegate small decisions (whether to stop, verify, or change approach) to cheaper models. We ask whether a typed decision model, Jev 1.13, consulted only at deterministic decision points, makes a Claude Sonnet 5.5 terminal agent cheaper without making it worse. In a pre-specified study on Terminal-Bench 2.1, we hold one agent loop fixed and vary only the controller: none, deterministic rules, a small LLM (Claude Haiku 5.5) answering the same questions, Jev, and a placebo that samples Jev\u0027s development-phase choice frequencies at the same moments. On 21 held-out tasks (315 trials), Jev raised cost per attempt by 19% (geometric-mean ratio 1.19, 95% CI 1.02-1.36) at an identical pass rate (73.0% vs. 73.0%). Jev was cheaper than the small-LLM controller (ratio 0.81) but 22% more expensive than the placebo, and no pass-rate difference between arms was detectable. Offline, Jev ranked finish requests better than the alternatives (AUROC 0.78 vs. 0.62 for rules and 0.60 for the small LLM) but was poorly calibrated: its mean probability that a run was complete was 0.50 when 87% of those runs passed, so it asked the agent to verify work that was already correct. No controller ever chose to abandon a run. Informative decision signals did not become useful interventions; we discuss what that would require.", "arxiv_id": "2610.24649", "arxiv_url": "https://arxiv.org/abs/2610.24649", "authors": ["Naman Vats"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/namanvats/decision-model-controllers", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.24649", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.24649v1", "published_at": "2026-10-17", "score": 0.071, "selected_reasons": ["HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24649.png", "title": "Good Judgment, Bad Advice: Decision-Model Controllers Raise Agent Cost Without Improving Success", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal rerankers are usually dedicated models: a vision-language model (VLM) is trained on retrieval data to score the candidates of a query. Scoring options is not specific to reranking. System One decision models such as Jev map a state and a typed question to one probability per option without generating text, and general models can make such decisions with little or no training. Reranking is one such decision, with the query and its candidates as the state and the candidates as the options. We therefore argue that a general VLM can serve as a multimodal reranker through System One decisions, and that decision tuning can improve its reranking. We ask a VLM one choice question over the top 16 candidates of a first-stage retriever and rank the candidates by the probabilities of their labels, read from one forward pass. On MMEB-V2 image retrieval, this choice scores 5.4 to 7.3 hit@1 above a yes/no question per candidate, and the yes/no question falls below the first stage. With the choice, zero-shot Qwen3.8-27B beats the supervised Qwen3-VL-Reranker-2B on all three benchmarks and comes within 1.6 points of Reranker-8B on each. It matches Reranker-8B on MMEB-V2 visual documents (84.79 vs. 84.78 nDCG@5), at 1.1 to 1.5 times its latency. JEV-27B-VL, the same backbone tuned on text decisions only, improves page reranking by 0.6 to 1.1 points, with gains on most tasks (sign test, p \u003c= 0.017), and leaves natural images unchanged. The zero-shot model is larger than the supervised rerankers and of a newer generation, so these comparisons are confounded; we discuss this and other alternative views, and the experiments that would test the position.", "arxiv_id": "2610.28435", "arxiv_url": "https://arxiv.org/abs/2610.28435", "authors": ["Zhuchenyang Liu", "Yao Zhang", "Yu Xiao"], "brief": "", "categories": ["cs.IR"], "github_repo": "https://github.com/Ryenhails/rerank-as-decision", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.28435", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28435v1", "published_at": "2026-10-20", "score": 0.063, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28435.png", "title": "Multimodal Reranking Is a System One Decision", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Lean verifies that a generated declaration is well typed, but cannot check whether it states what the user intended. We measure how far compilation overstates faithfulness in statement autoformalization without canonical Lean targets. Our criterion requires Lean compilation and agreement of two LLM judges from different model families. On an independent random audit, it agrees with the human majority on 91.5% of cases; it rarely accepts an unfaithful output but rejects some faithful ones. Across eight systems on 227 university-level statements, the gap between compiling and accepted outputs ranges from 1.3 to 29.5 percentage points: our tool-augmented agent compiles 87.2% of the statements, but only 57.7% are accepted. Human review of all the agent\u0027s rejections confirms that 23.8 of its 29.5 points are real translation errors. For the gaps of the seven one-shot systems, a two-stage review by Claude Opus 5.5 with Lean and GPT-6.1 Sol, validated on these human labels, finds that 78-100% are real translation errors for six of them. When GPT-5.2, one of the two judges, grades the translations of two models released after it, GPT-6 Astra and Claude Opus 5.5, it accepts 83% of the statements for each, against 21% for one-shot GPT-5.2. For these two models, the same review classifies only 4 of their 54 rejections (7%) as translation errors, so most of their measured gap is judge errors rather than translation errors. This is consistent with these systems erring less while the judge does not: the fewer errors a system makes, the smaller the share of its rejections that are translation errors. Finally, a 2^3 tool ablation of the agent shows that Lean feedback drives most of its compilation gain, and that nearly half of this gain fails the semantic criterion. Code and data are available at https://github.com/grenadeComing/beyond-compilation.", "arxiv_id": "2606.31002", "arxiv_url": "https://arxiv.org/abs/2606.31002", "authors": ["Ke Zhang", "Patricio Gallardo Candela", "Sudhir Murthy", "Yi Xie", "Zhi Wang", "Maziar Raissi"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LO"], "github_repo": "https://github.com/grenadeComing/beyond-compilation", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2606.31002", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "UC Riverside", "pdf_url": "https://arxiv.org/pdf/2606.31002v4", "published_at": "2026-06-30", "score": 0.061, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2606.31002.png", "title": "Beyond Compilation: Evaluating Faithful Natural-Language-to-Lean Statement Formalization", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Neural simulation of high-fidelity deformable bodies is a foundational challenge in computer graphics and physical AI. Long-horizon prediction for high-resolution 3D volumetric meshes is hard: autoregressive methods are prone to error accumulation, while direct multi-frame prediction at native resolution is computationally prohibitive. This motivates a compact spatiotemporal latent representation, which is largely unexplored for mesh-based volumetric physics. Meanwhile, it remains unclear whether deterministic regression or generative diffusion is the more suitable predictive paradigm. To address these coupled challenges, we introduce PhysLDM, a unified latent-diffusion paradigm for one-shot deformable simulation. Its core is a holistic spatiotemporal VAE that avoids the \"staircase\" artifacts of standard temporal compression (e.g., video VAEs), achieving ~2.48 mm reconstruction precision on meter-scale scenes at up to 78x token compression. Based on this reliable latent space, we systematically compare regression and diffusion methods. Our experiments uncover a key modeling insight: complex deformable dynamics are often chaotic, and in this regime deterministic regression tends to produce non-physical averages, whereas diffusion better models their distribution. Accordingly, we employ a latent diffusion model that effectively learns from chaotic data to generate physically plausible trajectories. Trained purely kinematically on an Objaverse-scale dataset, a single PhysLDM generalizes ze
