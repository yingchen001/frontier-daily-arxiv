const PAPERS = [{"abstract": "Neural scaling laws are foundational for language model development, yet standard formulations systematically under- and overestimate loss at data-scarce and overtraining extremes. This failure originates in the underlying assumption that model size and training data impact the loss independently. To address this, we introduce the Skaling law, a generalized functional form that couples model capacity and data through a single interaction exponent. This simple extension reduces the Mean Absolute Percentage Error (MAPE) by 1.5-3x across both interpolation and extrapolation regimes. When paired with a sparse grid strategy restricted to low-compute regimes, the Skaling law achieves accurate full-grid extrapolation using approximately 10x less compute than uniform sweeps. By enabling reliable performance prediction from small-scale experiments, the Skaling law provides a more robust and resource-efficient framework for allocating compute budgets in next-generation model training.", "arxiv_id": "2608.07222", "arxiv_url": "https://arxiv.org/abs/2608.07222", "authors": ["Mathurin Videau", "Badr Youbi-Idrissi", "David Lopez-Paz", "Kartik Ahuja"], "brief": "\u8bba\u6587\u63d0\u51fa Skaling law\uff0c\u5728\u795e\u7ecf\u8bed\u8a00\u6a21\u578b\u7f29\u653e\u5f8b\u4e2d\u5f15\u5165\u5355\u4e00\u4ea4\u4e92\u6307\u6570\uff0c\u5c06\u6a21\u578b\u5bb9\u91cf\u4e0e\u8bad\u7ec3\u6570\u636e\u8026\u5408\u5efa\u6a21\u3002\u5b83\u65e8\u5728\u4fee\u6b63\u4f20\u7edf\u7f29\u653e\u5f8b\u5728\u6570\u636e\u7a00\u7f3a\u548c\u8fc7\u8bad\u7ec3\u6781\u7aef\u60c5\u5f62\u4e0b\u7684\u7cfb\u7edf\u6027\u9884\u6d4b\u504f\u5dee\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07222", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u6807\u51c6\u7f29\u653e\u5f8b\u5047\u8bbe\u6a21\u578b\u89c4\u6a21\u4e0e\u6570\u636e\u91cf\u72ec\u7acb\u5f71\u54cd\u635f\u5931\uff0c\u662f\u6781\u7aef  cornerstone of modern AI. By encoding multimodal queries and targets into vectors, it powers industrial search and recommendation and underpins modern agents. Real-world platforms with complex modalities and massive-scale content, such as Douyin, Xiaohongshu, and YouTube, demand both efficiency under billion-scale indexing and fine-grained discrimination for hard matching. Existing MLLM embedding models rarely satisfy both. Contrastive models are efficient but rely on pair-level supervision too coarse for fine-grained distinctions, while CoT-based models improve discrimination through explicit generation impractical to serve online. We present Douyin Multimodal Embedding (DME), a model trained in two stages to combine both strengths. Stage 1 performs large-scale contrastive pre-training that establishes a unified multimodal embedding space with broad modality and task coverage. Stage 2 supplements semantic sufficiency, the property that an embedding is grounded in retrieval-relevant evidence and preserves fine-grained counterpart-side semantics, via two mechanisms. Evidence-Grounded Typed Latent Reasoning organizes retrieval evidence through hidden-space latent reasoning, and Cross-Conditional Reconstruction enforces counterpart-side semantics through cross-directional autoregressive reconstruction. Both act only during training and add only marginal query-side overhead, so DME serves as efficiently as a standard contrastive encoder. On MMEB-v2, DME reaches state-of-the-art results at comparable scales for its 2B and 9B variants (74.8 and 78.4), with especially strong video and visual-document tasks. In production, DME delivers a 2.92% relative gain on Douyin\u0027s in-house offline evaluation set, is deployed across Douyin scenarios such as generative, image, and AI search, and yields a 0.1% Lifetime (LT) gain in online A/B testing on Douyin search.", "arxiv_id": "2608.02148", "arxiv_url": "https://arxiv.org/abs/2608.02148", "authors": ["Haonan Chen", "Chu Li", "Zhicheng Wang", "Yuanwei Liu", "Yuanjiang Wang", "Shaohua Jiang", "Zhicheng Dou"], "brief": "\u8bba\u6587\u63d0\u51fa Douyin Multimodal Embedding\uff08DME\uff09\uff0c\u9762\u5411\u4ebf\u7ea7\u5de5\u4e1a\u641c\u7d22\u4e0e\u63a8\u8350\u7684\u591a\u6a21\u6001\u5411\u91cf\u8868\u5f81\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e24\u9636\u6bb5\u8bad\u7ec3\uff0c\u5728\u4fdd\u6301\u5bf9\u6bd4\u5f0f\u7f16\u7801\u5668\u7ebf\u4e0a\u9ad8\u6548\u68c0\u7d22\u80fd\u529b\u7684\u540c\u65f6\uff0c\u589e\u5f3a\u7ec6\u7c92\u5ea6\u8bed\u4e49\u533a\u5206\u80fd\u529b\u3002", "categories": ["cs.IR", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02148", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7b2c\u4e00\u9636\u6bb5\u8fdb\u884c\u5927\u89c4\u6a21\u5bf9\u6bd4\u9884\u8bad\u7ec3\uff0c\u6784\u5efa\u8986\u76d6\u6587\u672c\u3001\u56fe\u50cf\u3001\u89c6\u9891\u3001\u89c6\u89c9\u6587\u6863\u7b49\u4efb\u52a1\u7684\u7edf\u4e00\u591a\u6a21\u6001\u5d4c\u5165\u7a7a\u95f4", "\u7b2c\u4e8c\u9636\u6bb5\u5f15\u5165\u8bc1\u636e\u624e\u6839\u7684\u7c7b\u578b\u5316\u9690\u7a7a\u95f4\u63a8\u7406\u4e0e\u8de8\u6761\u4ef6\u91cd\u6784\uff0c\u4ec5\u5728\u8bad\u7ec3\u65f6\u589e\u5f3a\u8bed\u4e49\u5145\u5206\u6027\uff0c\u7ebf\u4e0a\u5f00\u9500\u63a5\u8fd1\u666e\u901a\u5bf9\u6bd4\u7f16\u7801\u5668", "DME-2B/9B \u5728 MMEB-v2 \u4e0a\u8fbe\u5230 74.8/78.4 \u7684\u540c\u89c4\u6a21 SOTA\uff0c\u5e76\u5df2\u90e8\u7f72\u4e8e\u6296\u97f3\u751f\u6210\u5f0f\u641c\u7d22\u3001\u56fe\u50cf\u641c\u7d22\u548c AI \u641c\u7d22\u7b49\u573a\u666f"], "keywords": ["\u591a\u6a21\u6001", "\u4fe1\u606f\u68c0\u7d22", "\u8868\u5f81\u5b66\u4e60", "\u641c\u7d22\u63a8\u8350"], "num_comments": 1, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2608.02148v1", "published_at": "2026-08-03", "score": 0.46, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02148.png", "title": "Douyin Multimodal Embedding Model Technical Report", "tldr": "\u6296\u97f3\u53d1\u5e03\u9ad8\u6548\u7ec6\u7c92\u5ea6\u591a\u6a21\u6001\u5d4c\u5165\u6a21\u578bDME", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Douyin Multimodal Embedding\uff08DME\uff09\uff0c\u9762\u5411\u4ebf\u7ea7\u5de5\u4e1a\u641c\u7d22\u4e0e\u63a8\u8350\u7684\u591a\u6a21\u6001\u5411\u91cf\u8868\u5f81\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e24\u9636\u6bb5\u8bad\u7ec3\uff0c\u5728\u4fdd\u6301\u5bf9\u6bd4\u5f0f\u7f16\u7801\u5668\u7ebf\u4e0a\u9ad8\u6548\u68c0\u7d22\u80fd\u529b\u7684\u540c\u65f6\uff0c\u589e\u5f3a\u7ec6\u7c92\u5ea6\u8bed\u4e49\u533a\u5206\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u89e3\u51b3\u4e86\u5de5\u4e1a\u591a\u6a21\u6001\u68c0\u7d22\u4e2d\u201c\u9ad8\u6548\u4ebf\u7ea7\u7d22\u5f15\u201d\u548c\u201c\u7ec6\u7c92\u5ea6\u96be\u4f8b\u5339\u914d\u201d\u96be\u4ee5\u517c\u5f97\u7684\u95ee\u9898\uff0c\u5e76\u7ed9\u51fa\u771f\u5b9e\u751f\u4ea7\u90e8\u7f72\u4e0e A/B \u6536\u76ca\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The total synthesis of a complex molecule is among the most demanding intellectual and experimental feats in chemistry: a chemist must plan many steps ahead for how to assemble simple building blocks into an intricate target, devise backup strategies, and anticipate procedural challenges. It is also a profoundly creative activity. For half a century, efforts to automate the retrosynthetic design of natural products and other complex molecules have drawn on catalogued reactions, and the resulting tools now report near-complete success on benchmarks built from that same source. But these tools were shaped to fit benchmarked chemistry, and they falter on many natural products, the frontier of the field, whose densely functionalized, polycyclic architectures demand precisely the inventive chemistry the record contains least. Whether a machine could reasonably design such syntheses like an expert chemist does has remained unclear. Here, we show that SynthEx, an agentic framework built on large language models, plans routes to complex natural products that lie beyond the reach of conventional design algorithms. SynthEx proposes competing strategies, assembles a sequence of routine and key steps into a cohesive route, and critiques and improves its own design; the chemistry it favours is more convergent than existing tools produce, and spans a region of reaction space that catalogue-based tools cannot match. Most notably, in blinded assessments, expert chemists judged its key steps comparable to those of published human syntheses and engaged with them as genuine synthesis plans, a response algorithmic route prediction has not previously accomplished. We release routes to more than a thousand natural products as SynthAtlas, an open, interactive database, and anticipate it will become a shared resource for a collection of complex target molecules that lack existing literature routes.", "arxiv_id": "2608.07454", "arxiv_url": "https://arxiv.org/abs/2608.07454", "authors": ["Daniel Armstrong", "Xuan-Vu Nguyen", "Octavian Susanu", "Gabriel Gibberd", "Th\u00e9o A. Neukomm", "Tadd\u00e4us Strunden", "Dan Forster", "Morgane Delattre", "Shawn Teh", "Cl\u00e9ment Rols", "John Federice", "Hayden Leatherwood", "M. Lavelle Barnes", "Maarten R. Dobbelaere", "Peter Wipf", "Jon T. Njardarson", "Jieping Zhu", "Philippe Schwaller"], "brief": "\u8bba\u6587\u63d0\u51fa SynthEx\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u667a\u80fd\u4f53\u5f0f\u5168\u5408\u6210\u89c4\u5212\u6846\u67b6\uff0c\u9762\u5411\u4f20\u7edf\u9006\u5408\u6210\u5de5\u5177\u96be\u4ee5\u5904\u7406\u7684\u590d\u6742\u5929\u7136\u4ea7\u7269\u3002\u5b83\u5148\u63d0\u51fa\u7ade\u4e89\u6027\u5408\u6210\u7b56\u7565\uff0c\u518d\u7ec4\u7ec7\u5173\u952e\u6b65\u9aa4\u4e0e\u5e38\u89c4\u6b65\u9aa4\uff0c\u5e76\u901a\u8fc7\u81ea\u6211\u6279\u5224\u8fed\u4ee3\u6539\u8fdb\u8def\u7ebf\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07454", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u201c\u7b56\u7565\u4f18\u5148\u201d\u7684\u89c4\u5212\u8303\u5f0f\uff0c\u4e0d\u53ea\u5339\u914d\u53cd\u5e94\u5e93\uff0c\u800c\u662f\u751f\u6210\u591a\u79cd\u9ad8\u5c42\u5408\u6210\u65b9\u6848\u5e76\u9010\u6b65\u7ec6\u5316\u4e3a\u5b8c\u6574\u8def\u7ebf", "\u5728\u53cd\u5e94\u7a7a\u95f4\u8986\u76d6\u548c\u8def\u7ebf\u6536\u655b\u6027\u4e0a\u4f18\u4e8e\u4f20\u7edf\u57fa\u4e8e\u53cd\u5e94\u76ee\u5f55\u7684\u9006\u5408\u6210\u5de5\u5177\uff0c\u66f4\u9002\u5408\u9ad8\u5b98\u80fd\u56e2\u5316\u3001\u591a\u73af\u5929\u7136\u4ea7\u7269", "\u76f2\u8bc4\u4e2d\uff0c\u4e13\u5bb6\u5316\u5b66\u5bb6\u8ba4\u4e3a\u5176\u5173\u952e\u6b65\u9aa4\u53ef\u4e0e\u5df2\u53d1\u8868\u4eba\u7c7b\u5408\u6210\u8def\u7ebf\u76f8\u5ab2\u7f8e\uff1b\u540c\u65f6\u53d1\u5e03\u5305\u542b\u5343\u4f59\u4e2a\u5929\u7136\u4ea7\u7269\u8def\u7ebf\u7684\u5f00\u653e\u6570\u636e\u5e93 SynthAtlas"], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5316\u5b66\u5408\u6210", "\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07454v1", "published_at": "2026-08-07", "score": 0.375, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Strategy-first synthesis planning for complex natural products", "tldr": "LLM\u667a\u80fd\u4f53\u89c4\u5212\u590d\u6742\u5929\u7136\u4ea7\u7269\u5168\u5408\u6210\u8def\u7ebf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SynthEx\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u667a\u80fd\u4f53\u5f0f\u5168\u5408\u6210\u89c4\u5212\u6846\u67b6\uff0c\u9762\u5411\u4f20\u7edf\u9006\u5408\u6210\u5de5\u5177\u96be\u4ee5\u5904\u7406\u7684\u590d\u6742\u5929\u7136\u4ea7\u7269\u3002\u5b83\u5148\u63d0\u51fa\u7ade\u4e89\u6027\u5408\u6210\u7b56\u7565\uff0c\u518d\u7ec4\u7ec7\u5173\u952e\u6b65\u9aa4\u4e0e\u5e38\u89c4\u6b65\u9aa4\uff0c\u5e76\u901a\u8fc7\u81ea\u6211\u6279\u5224\u8fed\u4ee3\u6539\u8fdb\u8def\u7ebf\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a LLM \u667a\u80fd\u4f53\u4ece\u7b80\u5355\u53cd\u5e94\u9884\u6d4b\u63a8\u8fdb\u5230\u4e13\u5bb6\u7ea7\u521b\u9020\u6027\u5408\u6210\u89c4\u5212\uff0c\u663e\u793a\u5176\u53ef\u80fd\u8f85\u52a9\u63a2\u7d22\u7f3a\u4e4f\u6587\u732e\u8def\u7ebf\u7684\u590d\u6742\u5206\u5b50\uff0c\u5bf9\u836f\u7269\u53d1\u73b0\u4e0e\u5408\u6210\u5316\u5b66\u81ea\u52a8\u5316\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reliable hypothesis testing is the foundation of many empirical scientific claims. Large language model (LLM) agents are increasingly used to automate this process, as they can inspect datasets, generate code, and produce analyses end-to-end. However, we show that they frequently make subtle inferential errors that lead to incorrect conclusions despite correctly executed analyses. Existing benchmarks fail to capture this failure mode, as they rarely assess whether a reported p-value is statistically valid given the assumptions underlying the data. We address this gap by building P-Bench, a benchmark comprising 425 open-ended, realistic hypothesis-testing tasks spanning economics, biology, and medicine. Each task requires an agent to select a statistical method, compute a p-value, and draw a conclusion given only a scientific hypothesis and a dataset. We further introduce Fisher-R1, an open-weight LLM agent trained for rigorous hypothesis testing using synthetic tasks and reinforcement learning. On P-Bench, Fisher-R1-14B substantially improves over its backbone and outperforms strong proprietary and open-source baselines, including GPT-5.4 and DeepSeekV4-Pro, achieving a 21% average relative improvement in single-trial success over DeepSeek-V4-Pro, with gains up to 26% on the most challenging tasks. Our results demonstrate that current LLM agents lack reliable statistical reasoning for hypothesis testing and that reinforcement learning on tasks with verified statistical reward substantially improves reliability.", "arxiv_id": "2608.07437", "arxiv_url": "https://arxiv.org/abs/2608.07437", "authors": ["Jiacheng Miao", "Jin Mu", "Guanhua Chen", "James Zou"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 P-Bench\uff0c\u4e00\u4e2a\u5305\u542b425\u4e2a\u5f00\u653e\u5f0f\u771f\u5b9e\u5047\u8bbe\u68c0\u9a8c\u4efb\u52a1\u7684\u57fa\u51c6\uff0c\u8986\u76d6\u7ecf\u6d4e\u5b66\u3001\u751f\u7269\u5b66\u548c\u533b\u5b66\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u5f00\u6e90\u6743\u91cd\u667a\u80fd\u4f53 Fisher-R1\uff0c\u901a\u8fc7\u5408\u6210\u4efb\u52a1\u4e0e\u5e26\u7edf\u8ba1\u9a8c\u8bc1\u5956\u52b1\u7684\u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347 LLM \u5728\u9009\u62e9\u7edf\u8ba1\u65b9\u6cd5\u3001\u8ba1\u7b97 p \u503c\u548c\u5f97\u51fa\u7ed3\u8bba\u65f6\u7684\u53ef\u9760\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07437", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u73b0\u6709 LLM \u667a\u80fd\u4f53\u5373\u4f7f\u4ee3\u7801\u6267\u884c\u6b63\u786e\uff0c\u4e5f\u5e38\u56e0\u7edf\u8ba1\u5047\u8bbe\u4e0d\u5339\u914d\u800c\u7ed9\u51fa\u65e0\u6548 p \u503c\u548c\u9519\u8bef\u7ed3\u8bba", "P-Bench \u8981\u6c42\u6a21\u578b\u4ec5\u6839\u636e\u79d1\u5b66\u5047\u8bbe\u548c\u6570\u636e\u96c6\u5b8c\u6210\u7aef\u5230\u7aef\u5047\u8bbe\u68c0\u9a8c\uff0c\u66f4\u5173\u6ce8\u7edf\u8ba1\u63a8\u65ad\u6709\u6548\u6027", "Fisher-R1-14B \u5728 P-Bench \u4e0a\u8d85\u8fc7\u5176\u57fa\u5ea7\u6a21\u578b\u53ca GPT-5.4\u3001DeepSeekV4-Pro \u7b49\u5f3a\u57fa\u7ebf\uff0c\u76f8\u6bd4 DeepSeek-V4-Pro \u5355\u6b21\u6210\u529f\u7387\u5e73\u5747\u76f8\u5bf9\u63d0\u534721%"], "keywords": ["\u667a\u80fd\u4f53", "\u7edf\u8ba1\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u79d1\u5b66\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07437v1", "published_at": "2026-08-07", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Fisher-R1: Training LLM Agents for Reliable Hypothesis Testing", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u66f4\u53ef\u9760\u7684\u5047\u8bbe\u68c0\u9a8c\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 P-Bench\uff0c\u4e00\u4e2a\u5305\u542b425\u4e2a\u5f00\u653e\u5f0f\u771f\u5b9e\u5047\u8bbe\u68c0\u9a8c\u4efb\u52a1\u7684\u57fa\u51c6\uff0c\u8986\u76d6\u7ecf\u6d4e\u5b66\u3001\u751f\u7269\u5b66\u548c\u533b\u5b66\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u5f00\u6e90\u6743\u91cd\u667a\u80fd\u4f53 Fisher-R1\uff0c\u901a\u8fc7\u5408\u6210\u4efb\u52a1\u4e0e\u5e26\u7edf\u8ba1\u9a8c\u8bc1\u5956\u52b1\u7684\u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347 LLM \u5728\u9009\u62e9\u7edf\u8ba1\u65b9\u6cd5\u3001\u8ba1\u7b97 p \u503c\u548c\u5f97\u51fa\u7ed3\u8bba\u65f6\u7684\u53ef\u9760\u6027\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a LLM \u79d1\u5b66\u5206\u6790\u80fd\u529b\u7684\u8bc4\u4f30\u4ece\u201c\u80fd\u5426\u8dd1\u51fa\u7ed3\u679c\u201d\u63a8\u8fdb\u5230\u201c\u63a8\u65ad\u662f\u5426\u7edf\u8ba1\u6709\u6548\u201d\uff0c\u5e76\u5c55\u793a\u4e86\u57fa\u4e8e\u53ef\u9a8c\u8bc1\u7edf\u8ba1\u5956\u52b1\u7684\u5f3a\u5316\u5b66\u4e60\u80fd\u663e\u8457\u63d0\u5347\u79d1\u7814\u667a\u80fd\u4f53\u7684\u53ef\u9760\u6027\uff0c\u5bf9\u81ea\u52a8\u5316\u6570\u636e\u5206\u6790\u548c AI for Science \u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Recent agentic reinforcement learning methods use hindsight to complement sparse outcome rewards. However, a completed rollout can yield many such signals, leaving their appropriate allocation across turns unclear. We introduce TRIAL, a trajectory-relative hindsight distillation framework with a unified turn-aligned scoring protocol. For each decision turn, TRIAL extracts an outcome view of that decision\u0027s realized consequence and evaluates the same response under ordinary and hindsight-conditioned contexts. The signed log-probability gap determines the direction and local strength of token-level supervision, while turn-level magnitudes are normalized jointly over the realized trajectory. The resulting allocation multipliers have an eligible-token-weighted mean of one, redistributing dense supervision across turns while fixing its average multiplier. Experiments on WebShop and ALFWorld with different backbones show that TRIAL outperforms GRPO across all eight combinations of backbone, environment, and evaluation metric, while achieving the best or tied-best performance among six methods on six of them. On WebShop with Qwen3-1.7B, TRIAL improves the success rate from 56.4% to 75.2% and the task score from 78.7% to 85.7%. Controlled ablations further show that trajectory-relative turn allocation provides substantial gains beyond those of dense hindsight distillation alone.", "arxiv_id": "2608.07371", "arxiv_url": "https://arxiv.org/abs/2608.07371", "authors": ["Haoyu Zheng", "Yun Zhu", "Qing Wang", "Wenqiao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa TRIAL\uff0c\u4e00\u79cd\u7528\u4e8e\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u8f68\u8ff9\u76f8\u5bf9\u540e\u89c1\u84b8\u998f\u6846\u67b6\u3002\u5b83\u5728\u6bcf\u4e2a\u51b3\u7b56\u56de\u5408\u5bf9\u666e\u901a\u4e0a\u4e0b\u6587\u4e0e\u540e\u89c1\u6761\u4ef6\u4e0a\u4e0b\u6587\u4e0b\u7684\u540c\u4e00\u54cd\u5e94\u8fdb\u884c\u6bd4\u8f83\uff0c\u7528\u5bf9\u6570\u6982\u7387\u5dee\u6765\u5206\u914dtoken\u7ea7\u76d1\u7763\u5f3a\u5ea6\uff0c\u5e76\u5728\u6574\u6761\u8f68\u8ff9\u5185\u5f52\u4e00\u5316\u5404\u56de\u5408\u6743\u91cd\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07371", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u7edf\u4e00\u7684\u56de\u5408\u5bf9\u9f50\u8bc4\u5206\u534f\u8bae\uff0c\u5c06\u5b8c\u6210\u8f68\u8ff9\u4e2d\u7684\u540e\u89c1\u53cd\u9988\u5206\u914d\u5230\u5177\u4f53\u51b3\u7b56\u56de\u5408\u3002", "\u7528\u666e\u901a\u4e0a\u4e0b\u6587\u4e0e\u540e\u89c1\u4e0a\u4e0b\u6587\u4e0b\u54cd\u5e94\u7684\u6709\u7b26\u53f7log-prob\u5dee\uff0c\u51b3\u5b9atoken\u7ea7\u76d1\u7763\u65b9\u5411\u548c\u5c40\u90e8\u5f3a\u5ea6\u3002", "\u5728WebShop\u548cALFWorld\u4e0a\u8de8\u4e0d\u540c\u9aa8\u5e72\u6a21\u578b\u4f18\u4e8eGRPO\uff1bQwen3-1.7B\u5728WebShop\u6210\u529f\u7387\u4ece56.4%\u63d0\u5347\u523075.2%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u540e\u89c1\u5b66\u4e60", "\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07371v1", "published_at": "2026-08-07", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Trajectory-Relative Hindsight Distillation for Agentic Reinforcement Learning", "tldr": "\u6309\u8f68\u8ff9\u76f8\u5bf9\u540e\u89c1\u4fe1\u53f7\u4f18\u5316\u667a\u80fd\u4f53RL", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TRIAL\uff0c\u4e00\u79cd\u7528\u4e8e\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u8f68\u8ff9\u76f8\u5bf9\u540e\u89c1\u84b8\u998f\u6846\u67b6\u3002\u5b83\u5728\u6bcf\u4e2a\u51b3\u7b56\u56de\u5408\u5bf9\u666e\u901a\u4e0a\u4e0b\u6587\u4e0e\u540e\u89c1\u6761\u4ef6\u4e0a\u4e0b\u6587\u4e0b\u7684\u540c\u4e00\u54cd\u5e94\u8fdb\u884c\u6bd4\u8f83\uff0c\u7528\u5bf9\u6570\u6982\u7387\u5dee\u6765\u5206\u914dtoken\u7ea7\u76d1\u7763\u5f3a\u5ea6\uff0c\u5e76\u5728\u6574\u6761\u8f68\u8ff9\u5185\u5f52\u4e00\u5316\u5404\u56de\u5408\u6743\u91cd\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u89e3\u51b3\u4e86\u7a00\u758f\u5956\u52b1\u573a\u666f\u4e2d\u540e\u89c1\u4fe1\u53f7\u5982\u4f55\u8de8\u591a\u8f6e\u51b3\u7b56\u5408\u7406\u5206\u914d\u7684\u95ee\u9898\uff0c\u5728\u5178\u578b\u7f51\u9875\u8d2d\u7269\u548c\u5177\u8eab\u4efb\u52a1\u73af\u5883\u4e2d\u5e26\u6765\u663e\u8457\u6027\u80fd\u63d0\u5347\uff0c\u5bf9\u8bad\u7ec3\u66f4\u53ef\u9760\u7684LLM\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM agents increasingly adapt to recurring tasks by accumulating procedural knowledge in skills. These skills are lightweight, reusable textual artifacts that are loaded into the agent\u0027s context without weight updates. Recent methods refine skills through iterative task execution, failure diagnosis, and trajectory-guided text-space updates. However, existing frameworks lack explicit diagnosis--outcome feedback and treat deletion as a generic edit operation rather than a dedicated mechanism for consolidating accumulated knowledge. We introduce SkillProx, a proximal-gradient-inspired forward--backward framework that couples closed-loop diagnostic evolution with utility-aware proximal refinement. Motivated by a composite objective balancing task loss and skill complexity, the forward stage re-executes diagnosis-driven edits on the same task batch, rolls back regressions, and feeds measured outcomes into subsequent diagnoses. The backward stage decomposes the resulting skill into auditable knowledge units, estimates their contributions using a frozen leave-one-out utility audit, and applies validation-gated consolidation, demotion, or removal. Experiments on in-distribution and out-of-distribution benchmarks across multiple backbone LLMs show that SkillProx improves average accuracy by 3.0 percentage points over the strongest gradient-based baseline. Component ablations demonstrate the complementary effects of closed-loop diagnosis and proximal refinement.", "arxiv_id": "2608.07449", "arxiv_url": "https://arxiv.org/abs/2608.07449", "authors": ["Mingxuan Zheng", "Yujin Zhou", "Chuxue Cao", "Boqin Yin", "Yuyao Zhang", "Jiapeng Sun", "Shuaishuai Gong", "Sirui Han", "Yike Guo"], "brief": "SkillProx\u63d0\u51fa\u4e00\u79cd\u53d7\u8fd1\u7aef\u68af\u5ea6\u542f\u53d1\u7684\u6280\u80fd\u81ea\u8fdb\u5316\u6846\u67b6\uff0c\u7528\u4e8e\u4f18\u5316LLM\u667a\u80fd\u4f53\u5728\u91cd\u590d\u4efb\u52a1\u4e2d\u79ef\u7d2f\u7684\u6587\u672c\u5316\u7a0b\u5e8f\u6280\u80fd\u3002\u5b83\u5c06\u95ed\u73af\u5931\u8d25\u8bca\u65ad\u4e0e\u57fa\u4e8e\u6548\u7528\u7684\u6280\u80fd\u538b\u7f29/\u5220\u9664\u673a\u5236\u7ed3\u5408\uff0c\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07449", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u524d\u5411\u9636\u6bb5\u5bf9\u540c\u4e00\u4efb\u52a1\u6279\u6b21\u6267\u884c\u8bca\u65ad\u9a71\u52a8\u7684\u6280\u80fd\u7f16\u8f91\uff0c\u68c0\u6d4b\u9000\u5316\u5e76\u56de\u6eda\uff0c\u540c\u65f6\u628a\u5b9e\u9645\u6267\u884c\u7ed3\u679c\u53cd\u9988\u7ed9\u540e\u7eed\u8bca\u65ad\u3002", "\u540e\u5411\u9636\u6bb5\u5c06\u6280\u80fd\u62c6\u5206\u4e3a\u53ef\u5ba1\u8ba1\u77e5\u8bc6\u5355\u5143\uff0c\u901a\u8fc7\u51bb\u7ed3\u7684 leave-one-out \u6548\u7528\u8bc4\u4f30\u4f30\u8ba1\u8d21\u732e\uff0c\u5e76\u8fdb\u884c\u9a8c\u8bc1\u95e8\u63a7\u7684\u4fdd\u7559\u3001\u964d\u7ea7\u6216\u79fb\u9664\u3002", "\u5728\u591a\u4e2aLLM\u9aa8\u5e72\u548c\u5206\u5e03\u5185/\u5206\u5e03\u5916\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u6700\u5f3a\u68af\u5ea6\u5f0f\u57fa\u7ebf\u5e73\u5747\u51c6\u786e\u7387\u63d0\u53473.0\u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60", "\u6587\u672c\u4f18\u5316", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07449v1", "published_at": "2026-08-07", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SkillProx: Self-Evolving Agent Skills via Proximal Textual Gradient Descent", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u6280\u80fd\u81ea\u8bca\u65ad\u3001\u81ea\u7cbe\u7b80\u8fdb\u5316", "upvotes": 0, "what_it_is": "SkillProx\u63d0\u51fa\u4e00\u79cd\u53d7\u8fd1\u7aef\u68af\u5ea6\u542f\u53d1\u7684\u6280\u80fd\u81ea\u8fdb\u5316\u6846\u67b6\uff0c\u7528\u4e8e\u4f18\u5316LLM\u667a\u80fd\u4f53\u5728\u91cd\u590d\u4efb\u52a1\u4e2d\u79ef\u7d2f\u7684\u6587\u672c\u5316\u7a0b\u5e8f\u6280\u80fd\u3002\u5b83\u5c06\u95ed\u73af\u5931\u8d25\u8bca\u65ad\u4e0e\u57fa\u4e8e\u6548\u7528\u7684\u6280\u80fd\u538b\u7f29/\u5220\u9664\u673a\u5236\u7ed3\u5408\uff0c\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "why_notable": "\u8bba\u6587\u628a\u667a\u80fd\u4f53\u6280\u80fd\u4f18\u5316\u4ece\u7b80\u5355\u6587\u672c\u7f16\u8f91\u63a8\u8fdb\u5230\u5e26\u53cd\u9988\u95ed\u73af\u548c\u590d\u6742\u5ea6\u7ea6\u675f\u7684\u81ea\u6f14\u5316\u8fc7\u7a0b\uff0c\u5c24\u5176\u5f3a\u8c03\u5220\u9664\u4e0e\u77e5\u8bc6\u6574\u5408\u4f5c\u4e3a\u4e13\u95e8\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u6784\u5efa\u66f4\u7a33\u5b9a\u3001\u53ef\u590d\u7528\u3001\u4f4e\u6210\u672c\u7684LLM Agent\u957f\u671f\u80fd\u529b\u79ef\u7d2f\u7cfb\u7edf\u3002"}, {"abstract": "With the rapid advancement of large language models (LLMs), harnesses have become essential infrastructure for deploying agents across a wide range of domains. The fast-evolving harness ecosystem has also made rigorous capability evaluation increasingly important. However, efficiently building an end-to-end, systematic, and comprehensive evaluation pipeline remains a significant challenge. To address this challenge, we introduce $A^2E$ (Agent Auditing Engine), an end-to-end evaluation engine designed for agent harnesses. $A^2E$ leverages our newly proposed Agent Task Protocol (ATP) to enable the rapid integration of evaluation tasks with different harnesses. Through an automatically instrumented Monitor, it captures and generates standardized execution traces during experiments. In the Evaluation stage, $A^2E$ systematically assesses harness capabilities using a suite of multidimensional metrics. Compared with correctness alone, these metrics provide a more fine-grained characterization of differences among harnesses in execution efficiency, tool use, task planning, and error recovery. Experiments conducted with $A^2E$ further reveal that model-harness combinations exhibit substantial performance variation across different types of tasks, and that no single combination consistently outperforms all others across every task. These findings not only demonstrate the necessity of systematic evaluation but also provide useful guidance for the co-evolving of models and harnesses. Our code is available at https://github.com/datamllab/A2E.", "arxiv_id": "2608.07346", "arxiv_url": "https://arxiv.org/abs/2608.07346", "authors": ["Haoning Wang", "Mingxun Zhang", "Chenyue Yu", "Yingjun Shang", "Xia Hu", "Guanchu Wang", "Na Zou"], "brief": "\u8bba\u6587\u63d0\u51fa A\u00b2E\uff08Agent Auditing Engine\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53 harness \u7684\u7aef\u5230\u7aef\u5ba1\u8ba1\u4e0e\u8bc4\u6d4b\u5f15\u64ce\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u4efb\u52a1\u534f\u8bae\u3001\u81ea\u52a8\u76d1\u63a7\u6267\u884c\u8f68\u8ff9\u548c\u591a\u7ef4\u6307\u6807\uff0c\u5bf9\u4e0d\u540c\u6a21\u578b-harness\u7ec4\u5408\u8fdb\u884c\u7cfb\u7edf\u5316\u8bc4\u4f30\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07346", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa Agent Task Protocol\uff08ATP\uff09\uff0c\u7528\u4e8e\u5feb\u901f\u5bf9\u63a5\u4e0d\u540c\u8bc4\u6d4b\u4efb\u52a1\u4e0e\u4e0d\u540c\u667a\u80fd\u4f53 harness", "\u901a\u8fc7\u81ea\u52a8\u63d2\u6869\u7684 Monitor \u91c7\u96c6\u6807\u51c6\u5316\u6267\u884c\u8f68\u8ff9\uff0c\u652f\u6301\u5206\u6790\u5de5\u5177\u8c03\u7528\u3001\u89c4\u5212\u3001\u6548\u7387\u4e0e\u9519\u8bef\u6062\u590d", "\u5b9e\u9a8c\u663e\u793a\u4e0d\u540c\u6a21\u578b-harness\u7ec4\u5408\u5728\u4efb\u52a1\u7c7b\u578b\u95f4\u5dee\u5f02\u663e\u8457\uff0c\u6ca1\u6709\u5355\u4e00\u7ec4\u5408\u5728\u6240\u6709\u4efb\u52a1\u4e0a\u6700\u4f18"], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u5de5\u5177\u8c03\u7528", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07346v1", "published_at": "2026-08-07", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "An End-to-End Agent Auditing Engine", "tldr": "\u7aef\u5230\u7aef\u8bc4\u6d4bLLM\u667a\u80fd\u4f53\u6846\u67b6\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa A\u00b2E\uff08Agent Auditing Engine\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53 harness \u7684\u7aef\u5230\u7aef\u5ba1\u8ba1\u4e0e\u8bc4\u6d4b\u5f15\u64ce\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u4efb\u52a1\u534f\u8bae\u3001\u81ea\u52a8\u76d1\u63a7\u6267\u884c\u8f68\u8ff9\u548c\u591a\u7ef4\u6307\u6807\uff0c\u5bf9\u4e0d\u540c\u6a21\u578b-harness\u7ec4\u5408\u8fdb\u884c\u7cfb\u7edf\u5316\u8bc4\u4f30\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u53ea\u770b\u6700\u7ec8\u6b63\u786e\u7387\uff0c\u800c\u662f\u63d0\u4f9b\u9762\u5411\u771f\u5b9e\u667a\u80fd\u4f53\u8fd0\u884c\u8fc7\u7a0b\u7684\u7ec6\u7c92\u5ea6\u5ba1\u8ba1\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u6bd4\u8f83\u3001\u8bca\u65ad\u548c\u6539\u8fdb LLM agent \u90e8\u7f72\u57fa\u7840\u8bbe\u65bd\u3002"}, {"abstract": "Prior benchmarking work has shown that a single large language model (LLM), forced to make life-or-death resource-allocation decisions, exhibits measurable demographic bias. Real deployments, however, rarely use a single agent: they use pipelines, with review steps meant to catch exactly this kind of failure. We study what happens to bias when the same decision is distributed across a role-differentiated multi-agent pipeline (assessment, allocation, independent audit) instead of made and checked by one model alone. Using a synthetic disaster-triage simulator with paired cases that are clinically identical except for one demographic attribute, we run 192 episodes (2,304 resolved case pairs) on GPT-4o-mini comparing a single-agent control condition to a nine-agent pipeline under three independently varied pressure dimensions. We find no measurable difference in how often biased outcomes occur between the two conditions (6.9% vs. 6.1%, p = 0.498). We do find a large and significant effect of audit capacity on whether bias is caught: 30.0% of biased outcomes go entirely undetected, rising to 43.8% when the auditor is overloaded and falling to 18.4% when it is not. Decomposing this effect shows it is driven almost entirely by coverage (whether a case is reviewed at all, which collapses from 100.0% to 65.6% under load, p \u003c 0.001) rather than by degraded judgment on the cases that are reviewed (81.6% vs. 85.7%, p = 1.000, direction reversed). A follow-up experiment shows that reordering the audit queue by estimated risk, rather than first-come-first-served, recovers most of the lost coverage under the same capacity constraint (65.6% to 91.7%, p = 0.028). We discuss the implications for any system that adds independent oversight to an LLM agent pipeline under resource constraints, and report the study\u0027s limitations honestly: one model, modest sample sizes, and no adversarial replication.", "arxiv_id": "2608.06949", "arxiv_url": "https://arxiv.org/abs/2608.06949", "authors": ["Paul-Peter Arslan"], "brief": "\u672c\u6587\u7528\u5408\u6210\u707e\u96be\u5206\u8bca\u6a21\u62df\u5668\u6bd4\u8f83\u5355\u4e00 LLM \u51b3\u7b56\u4e0e\u4e5d\u667a\u80fd\u4f53\u5206\u5de5\u6d41\u6c34\u7ebf\u5728\u8d44\u6e90\u5206\u914d\u4e2d\u7684\u4eba\u53e3\u7edf\u8ba1\u504f\u89c1\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u591a\u667a\u80fd\u4f53\u62c6\u5206\u672c\u8eab\u5e76\u672a\u663e\u8457\u51cf\u5c11\u504f\u89c1\uff0c\u4f46\u5ba1\u8ba1\u662f\u5426\u6709\u8db3\u591f\u5bb9\u91cf\u4f1a\u663e\u8457\u5f71\u54cd\u504f\u89c1\u80fd\u5426\u88ab\u53d1\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06949", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5728 192 \u8f6e\u5b9e\u9a8c\u30012304 \u5bf9\u4e34\u5e8a\u76f8\u540c\u4f46\u4eba\u53e3\u5c5e\u6027\u4e0d\u540c\u7684\u6848\u4f8b\u4e2d\uff0c\u591a\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf\u4e0e\u5355\u667a\u80fd\u4f53\u7684\u504f\u89c1\u7ed3\u679c\u53d1\u751f\u7387\u65e0\u663e\u8457\u5dee\u5f02\uff1a6.1% vs. 6.9%\u3002", "\u5ba1\u8ba1\u5bb9\u91cf\u662f\u5173\u952e\u74f6\u9888\uff1a30.0% \u7684\u504f\u89c1\u7ed3\u679c\u672a\u88ab\u53d1\u73b0\uff0c\u5ba1\u8ba1\u8fc7\u8f7d\u65f6\u5347\u81f3 43.8%\uff0c\u672a\u8fc7\u8f7d\u65f6\u964d\u81f3 18.4%\u3002", "\u504f\u89c1\u6f0f\u68c0\u4e3b\u8981\u6765\u81ea\u8986\u76d6\u7387\u4e0b\u964d\u800c\u975e\u5ba1\u8ba1\u5224\u65ad\u53d8\u5dee\uff1b\u6309\u98ce\u9669\u91cd\u6392\u5ba1\u8ba1\u961f\u5217\u53ef\u5c06\u8986\u76d6\u7387\u4ece 65.6% \u63d0\u5347\u5230 91.7%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u516c\u5e73\u6027", "\u5ba1\u8ba1", "\u8d44\u6e90\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06949v1", "published_at": "2026-08-07", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Does Splitting a Triage Decision Across Agents Hide Bias or Help Catch It? A Multi-Agent Simulation Study of LLM-Based Resource Allocation Under Audit Capacity Constraints", "tldr": "\u591a\u667a\u80fd\u4f53\u5206\u8bca\u672a\u964d\u504f\u89c1\uff0c\u5ba1\u8ba1\u5bb9\u91cf\u66f4\u5173\u952e", "upvotes": 0, "what_it_is": "\u672c\u6587\u7528\u5408\u6210\u707e\u96be\u5206\u8bca\u6a21\u62df\u5668\u6bd4\u8f83\u5355\u4e00 LLM \u51b3\u7b56\u4e0e\u4e5d\u667a\u80fd\u4f53\u5206\u5de5\u6d41\u6c34\u7ebf\u5728\u8d44\u6e90\u5206\u914d\u4e2d\u7684\u4eba\u53e3\u7edf\u8ba1\u504f\u89c1\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u591a\u667a\u80fd\u4f53\u62c6\u5206\u672c\u8eab\u5e76\u672a\u663e\u8457\u51cf\u5c11\u504f\u89c1\uff0c\u4f46\u5ba1\u8ba1\u662f\u5426\u6709\u8db3\u591f\u5bb9\u91cf\u4f1a\u663e\u8457\u5f71\u54cd\u504f\u89c1\u80fd\u5426\u88ab\u53d1\u73b0\u3002", "why_notable": "\u8bba\u6587\u63d0\u9192\uff1a\u5728 LLM \u51b3\u7b56\u7cfb\u7edf\u4e2d\u52a0\u5165\u591a\u667a\u80fd\u4f53\u5206\u5de5\u548c\u72ec\u7acb\u5ba1\u8ba1\uff0c\u5e76\u4e0d\u5929\u7136\u6d88\u9664\u504f\u89c1\uff1b\u771f\u6b63\u5f71\u54cd\u5b89\u5168\u6027\u7684\u53ef\u80fd\u662f\u5ba1\u8ba1\u8d44\u6e90\u8c03\u5ea6\u4e0e\u8986\u76d6\u7387\u8bbe\u8ba1\u3002\u8fd9\u5bf9\u533b\u7597\u5206\u8bca\u3001\u707e\u5bb3\u54cd\u5e94\u7b49\u9ad8\u98ce\u9669 LLM \u5e94\u7528\u7684\u6cbb\u7406\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Negotiation is a demanding social task for LLM agents, requiring strategic reasoning, persuasion, and interpersonal adaptation. Yet existing benchmarks often treat agents as emotionally neutral, overlooking a key driver of human bargaining behavior. We study how prompt-conditioned emotions affect LLM-based price negotiation. In a controlled framework, buyer and seller agents are independently assigned one of six emotional states and negotiate over 350 real consumer products under two budget conditions. Across 36 emotion-pair settings and five widely used LLMs, we find that emotions strongly shape outcomes. Angry buyers almost never reach agreement (0.39% deal rate), while happy buyers agree most often (28.91%), but obtain worse prices than fearful buyers. Emotion effects are role-dependent: buyer emotion mainly drives acceptance and rejection, whereas seller emotion shapes concession dynamics. These effects influence not only language, but also termination behavior and price trajectories, raising concerns for emotion-conditioned agents in commerce.", "arxiv_id": "2608.06922", "arxiv_url": "https://arxiv.org/abs/2608.06922", "authors": ["Massimiliano Luca", "Apoorva Singh", "Bruno Lepri"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u63d0\u793a\u8bcd\u8bbe\u5b9a\u7684\u60c5\u7eea\u72b6\u6001\u5982\u4f55\u5f71\u54cdLLM\u4e70\u5356\u53cc\u65b9\u7684\u4ef7\u683c\u8c08\u5224\u3002\u5728350\u79cd\u771f\u5b9e\u6d88\u8d39\u54c1\u3001\u4e24\u79cd\u9884\u7b97\u6761\u4ef6\u300136\u79cd\u60c5\u7eea\u7ec4\u5408\u548c5\u4e2a\u4e3b\u6d41LLM\u4e0a\uff0c\u8bc4\u4f30\u6210\u4ea4\u7387\u3001\u8ba9\u6b65\u8f68\u8ff9\u4e0e\u6700\u7ec8\u4ef7\u683c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06922", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4e70\u5356\u53cc\u65b9\u5206\u522b\u88ab\u8d4b\u4e88\u516d\u79cd\u60c5\u7eea\u72b6\u6001\uff0c\u6784\u621036\u79cd\u60c5\u7eea\u914d\u5bf9\u7684\u591a\u667a\u80fd\u4f53\u8c08\u5224\u5b9e\u9a8c\u3002", "\u6124\u6012\u4e70\u5bb6\u51e0\u4e4e\u65e0\u6cd5\u6210\u4ea4\uff0c\u6210\u4ea4\u7387\u4ec50.39%\uff1b\u5feb\u4e50\u4e70\u5bb6\u6210\u4ea4\u7387\u6700\u9ad8\uff0c\u4e3a28.91%\uff0c\u4f46\u4ef7\u683c\u8868\u73b0\u4e0d\u5982\u6050\u60e7\u4e70\u5bb6\u3002", "\u60c5\u7eea\u5f71\u54cd\u5177\u6709\u89d2\u8272\u5dee\u5f02\uff1a\u4e70\u5bb6\u60c5\u7eea\u4e3b\u8981\u51b3\u5b9a\u63a5\u53d7\u6216\u62d2\u7edd\uff0c\u5356\u5bb6\u60c5\u7eea\u66f4\u591a\u5f71\u54cd\u8ba9\u6b65\u8282\u594f\u548c\u4ef7\u683c\u8f68\u8ff9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u60c5\u7eea\u5efa\u6a21", "\u8c08\u5224"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06922v1", "published_at": "2026-08-07", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Deal Me Maybe: The Role of Emotions in Multi-Agent Negotiation", "tldr": "\u60c5\u7eea\u663e\u8457\u5f71\u54cdLLM\u8bae\u4ef7\u667a\u80fd\u4f53\u7ed3\u679c", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u63d0\u793a\u8bcd\u8bbe\u5b9a\u7684\u60c5\u7eea\u72b6\u6001\u5982\u4f55\u5f71\u54cdLLM\u4e70\u5356\u53cc\u65b9\u7684\u4ef7\u683c\u8c08\u5224\u3002\u5728350\u79cd\u771f\u5b9e\u6d88\u8d39\u54c1\u3001\u4e24\u79cd\u9884\u7b97\u6761\u4ef6\u300136\u79cd\u60c5\u7eea\u7ec4\u5408\u548c5\u4e2a\u4e3b\u6d41LLM\u4e0a\uff0c\u8bc4\u4f30\u6210\u4ea4\u7387\u3001\u8ba9\u6b65\u8f68\u8ff9\u4e0e\u6700\u7ec8\u4ef7\u683c\u3002", "why_notable": "\u8bba\u6587\u63ed\u793a\u4e86\u60c5\u7eea\u63d0\u793a\u4e0d\u4ec5\u6539\u53d8LLM\u667a\u80fd\u4f53\u7684\u8bed\u8a00\u98ce\u683c\uff0c\u8fd8\u4f1a\u5b9e\u8d28\u5f71\u54cd\u4ea4\u6613\u7ec8\u6b62\u3001\u6210\u4ea4\u6982\u7387\u548c\u4ef7\u683c\u7ed3\u679c\uff0c\u5bf9\u7535\u5546\u8c08\u5224\u667a\u80fd\u4f53\u7684\u5b89\u5168\u6027\u3001\u516c\u5e73\u6027\u4e0e\u53ef\u63a7\u6027\u5177\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "Large language model (LLM) agents increasingly operate through long-horizon trajectories involving user instructions, tool use, external observations, and memory. Existing benchmarks primarily evaluate behavioral outcomes but provide limited support for fine-grained attribution analysis. We introduce trajectory attribution and develop a benchmark and annotation framework for this task. The benchmark organizes heterogeneous trajectories under a unified component schema and provides annotations of the primary attribution component, together with attack and execution chains where applicable. Instantiating the benchmark with trajectories from AgentDojo and the Stage and Canary settings of Agent3Sigma yields more than 1,300 annotated trajectories covering task-aligned actions, unsafe actions, and safety refusals. The benchmark defines two evaluation tasks, primary attribution localization and attribution-chain recovery, and provides reference baselines based on incremental trajectory contribution and component-level leave-one-out perturbation. It captures diverse attribution settings, including local and long-range attribution as well as structured attribution chains. Reference baseline results exhibit substantial performance differences across these settings, providing an initial characterization of the benchmark\u0027s attribution challenges. Beyond this initial instantiation, we release a reusable annotation skill that enables trajectories generated by new agent models to be standardized, annotated, and evaluated under the same framework. Project resources and future releases are available at https://github.com/chenjing-2024/agent-trajectory-attribution.", "arxiv_id": "2608.06909", "arxiv_url": "https://arxiv.org/abs/2608.06909", "authors": ["Jing Chen", "Yang Sun", "Li Zhang", "Lin Xu", "Jie Shi"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u8f68\u8ff9\u5f52\u56e0\u201d\u4efb\u52a1\uff0c\u5e76\u6784\u5efa\u4e86\u4e00\u4e2a\u7edf\u4e00\u57fa\u51c6\u4e0e\u7ec6\u7c92\u5ea6\u6807\u6ce8\u6846\u67b6\uff0c\u7528\u4e8e\u5206\u6790\u957f\u7a0b LLM \u667a\u80fd\u4f53\u884c\u4e3a\u5e94\u5f52\u56e0\u4e8e\u54ea\u4e9b\u6307\u4ee4\u3001\u5de5\u5177\u8c03\u7528\u3001\u89c2\u5bdf\u6216\u8bb0\u5fc6\u7ec4\u4ef6\u3002\u57fa\u51c6\u6574\u5408 AgentDojo \u4e0e Agent3Sigma \u7684 1300 \u591a\u6761\u8f68\u8ff9\uff0c\u8986\u76d6\u6b63\u5e38\u884c\u52a8\u3001\u4e0d\u5b89\u5168\u884c\u52a8\u548c\u5b89\u5168\u62d2\u7edd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06909", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u7528\u7edf\u4e00\u7ec4\u4ef6\u6a21\u5f0f\u7ec4\u7ec7\u5f02\u6784\u667a\u80fd\u4f53\u8f68\u8ff9\uff0c\u5e76\u6807\u6ce8\u4e3b\u8981\u5f52\u56e0\u7ec4\u4ef6\u3001\u653b\u51fb\u94fe\u4e0e\u6267\u884c\u94fe", "\u5b9a\u4e49\u4e24\u7c7b\u8bc4\u6d4b\u4efb\u52a1\uff1a\u4e3b\u8981\u5f52\u56e0\u5b9a\u4f4d\u4e0e\u5f52\u56e0\u94fe\u6062\u590d", "\u63d0\u4f9b\u589e\u91cf\u8f68\u8ff9\u8d21\u732e\u548c\u7ec4\u4ef6\u7ea7 leave-one-out \u6270\u52a8\u7b49\u53c2\u8003\u57fa\u7ebf\uff0c\u5e76\u5c55\u793a\u4e0d\u540c\u5f52\u56e0\u573a\u666f\u4e0b\u6027\u80fd\u5dee\u5f02\u660e\u663e"], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u53ef\u89e3\u91ca\u6027", "\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06909v1", "published_at": "2026-08-07", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Long-Horizon Agent Trajectory Attribution: A Unified Benchmark and Fine-Grained Annotation Framework", "tldr": "\u7edf\u4e00\u957f\u7a0b\u667a\u80fd\u4f53\u8f68\u8ff9\u5f52\u56e0\u8bc4\u6d4b\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u8f68\u8ff9\u5f52\u56e0\u201d\u4efb\u52a1\uff0c\u5e76\u6784\u5efa\u4e86\u4e00\u4e2a\u7edf\u4e00\u57fa\u51c6\u4e0e\u7ec6\u7c92\u5ea6\u6807\u6ce8\u6846\u67b6\uff0c\u7528\u4e8e\u5206\u6790\u957f\u7a0b LLM \u667a\u80fd\u4f53\u884c\u4e3a\u5e94\u5f52\u56e0\u4e8e\u54ea\u4e9b\u6307\u4ee4\u3001\u5de5\u5177\u8c03\u7528\u3001\u89c2\u5bdf\u6216\u8bb0\u5fc6\u7ec4\u4ef6\u3002\u57fa\u51c6\u6574\u5408 AgentDojo \u4e0e Agent3Sigma \u7684 1300 \u591a\u6761\u8f68\u8ff9\uff0c\u8986\u76d6\u6b63\u5e38\u884c\u52a8\u3001\u4e0d\u5b89\u5168\u884c\u52a8\u548c\u5b89\u5168\u62d2\u7edd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u53ea\u770b\u6700\u7ec8\u884c\u4e3a\u7ed3\u679c\u8f6c\u5411\u89e3\u91ca\u957f\u7a0b\u667a\u80fd\u4f53\u884c\u4e3a\u6765\u6e90\uff0c\u6709\u52a9\u4e8e\u8c03\u8bd5\u3001\u5ba1\u8ba1\u548c\u63d0\u5347\u667a\u80fd\u4f53\u5b89\u5168\u6027\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u5de5\u5177\u4f7f\u7528\u3001\u8bb0\u5fc6\u548c\u5916\u90e8\u89c2\u5bdf\u4ea4\u7ec7\u7684\u590d\u6742\u8f68\u8ff9\u3002"}, {"abstract": "Agentic coding faces growing problems of affordability and wasted tokens. We introduce Blast Radius, a predictive memory management layer that estimates an incoming prompt\u0027s reach through coupled context and code channels. NECROPHORESIS enables reversible eviction by archiving dead context verbatim, while Recurring Dead Matter (RDM) identifies and buries repeatedly occurring transcripts. We formulate reversible context eviction over a Polish context space, providing a measurable foundation for retention, recurrence, and eviction while connecting context entropy to resurrection probability. Across seven OpenAI models, Blast Radius reduced token consumption by 17-26%, achieved the lowest overflow rate among tested policies, and remained byte exact reversible. Of 450 buried bodies, 378 were recurring dead matter and zero were recalled. Blast Radius operates beneath HCRC, determining which records to bury and how far an incoming prompt may reach into the codebase. This work contributes to the broader goal of Algosophy: making large language models and agentic coding more reusable and sustainable.", "arxiv_id": "2608.07440", "arxiv_url": "https://arxiv.org/abs/2608.07440", "authors": ["MY Pitsane", "Hope Mogale"], "brief": "\u8bba\u6587\u63d0\u51fa Blast Radius\uff0c\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u7f16\u7a0b\u7684\u9884\u6d4b\u5f0f\u8bb0\u5fc6\u7ba1\u7406\u5c42\uff0c\u7528\u6765\u4f30\u8ba1\u65b0\u63d0\u793a\u4f1a\u89e6\u8fbe\u7684\u4e0a\u4e0b\u6587\u4e0e\u4ee3\u7801\u8303\u56f4\u3002\u5b83\u901a\u8fc7\u53ef\u9006\u6dd8\u6c70\u548c\u91cd\u590d\u201c\u6b7b\u4e0a\u4e0b\u6587\u201d\u8bc6\u522b\uff0c\u5728\u4fdd\u8bc1\u5b57\u8282\u7ea7\u53ef\u6062\u590d\u7684\u540c\u65f6\u51cf\u5c11\u65e0\u6548\u4e0a\u4e0b\u6587\u5360\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07440", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["NECROPHORESIS \u5c06\u4e0d\u6d3b\u8dc3\u4e0a\u4e0b\u6587\u539f\u6837\u5f52\u6863\uff0c\u5b9e\u73b0\u53ef\u9006\u9a71\u9010\u4e0e\u540e\u7eed\u6062\u590d\u3002", "Recurring Dead Matter \u8bc6\u522b\u53cd\u590d\u51fa\u73b0\u4f46\u672a\u88ab\u53ec\u56de\u7684\u5bf9\u8bdd\u7247\u6bb5\u5e76\u8fdb\u884c\u57cb\u85cf\uff0c450 \u4e2a\u57cb\u85cf\u5bf9\u8c61\u4e2d 378 \u4e2a\u5c5e\u4e8e\u8be5\u7c7b\u4e14\u96f6\u53ec\u56de\u3002", "\u5728 7 \u4e2a OpenAI \u6a21\u578b\u4e0a\u51cf\u5c11 17%-26% token \u6d88\u8017\uff0c\u5e76\u5728\u6d4b\u8bd5\u7b56\u7565\u4e2d\u83b7\u5f97\u6700\u4f4e\u4e0a\u4e0b\u6587\u6ea2\u51fa\u7387\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07440v1", "published_at": "2026-08-07", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Blast Radius", "tldr": "\u9884\u6d4b\u5f0f\u4e0a\u4e0b\u6587\u6dd8\u6c70\u964d\u4f4e\u667a\u80fd\u4f53\u7f16\u7a0b token \u6210\u672c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Blast Radius\uff0c\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u7f16\u7a0b\u7684\u9884\u6d4b\u5f0f\u8bb0\u5fc6\u7ba1\u7406\u5c42\uff0c\u7528\u6765\u4f30\u8ba1\u65b0\u63d0\u793a\u4f1a\u89e6\u8fbe\u7684\u4e0a\u4e0b\u6587\u4e0e\u4ee3\u7801\u8303\u56f4\u3002\u5b83\u901a\u8fc7\u53ef\u9006\u6dd8\u6c70\u548c\u91cd\u590d\u201c\u6b7b\u4e0a\u4e0b\u6587\u201d\u8bc6\u522b\uff0c\u5728\u4fdd\u8bc1\u5b57\u8282\u7ea7\u53ef\u6062\u590d\u7684\u540c\u65f6\u51cf\u5c11\u65e0\u6548\u4e0a\u4e0b\u6587\u5360\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5173\u6ce8\u667a\u80fd\u4f53\u7f16\u7a0b\u4e2d\u7684\u4e0a\u4e0b\u6587\u81a8\u80c0\u4e0e\u6210\u672c\u6d6a\u8d39\u95ee\u9898\uff0c\u5c1d\u8bd5\u4e3a\u8bb0\u5fc6\u4fdd\u7559\u3001\u91cd\u590d\u68c0\u6d4b\u548c\u53ef\u9006\u6dd8\u6c70\u63d0\u4f9b\u5f62\u5f0f\u5316\u57fa\u7840\uff0c\u5bf9\u964d\u4f4e\u957f\u671f\u4ee3\u7801\u667a\u80fd\u4f53\u8fd0\u884c\u6210\u672c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Human-like cognition does not select past experience by topical similarity alone: affective significance and unresolved conflict also shape what becomes accessible. We present PsychoAgent, a cognitive architecture for LLM agents that separates factual and affective memory and integrates both through a conflict-aware executive controller. Affective memories are first filtered by semantic relevance and then re-ranked by salience, preserving topical fit while allowing emotionally important traces to enter the prompt. Across three controlled conflict scenarios, the full architecture retrieved more conflict-critical memories than semantic-affective and single-memory RAG baselines (0.933 vs. 0.500 and 0.667), with a small semantic-similarity cost. Five blinded raters evaluated 27 outputs. After within-rater standardization, the full architecture had the highest overall mean (+0.22 SD), but corrected pairwise differences were not significant. A three-day illustrative trace further shows persistent affect, offline memory recombination, and selective memory reweighting. The findings support affect-sensitive retrieval as an inspectable mechanism for modeling human-like conflict effects in LLM agents.", "arxiv_id": "2608.07438", "arxiv_url": "https://arxiv.org/abs/2608.07438", "authors": ["Mohammad Amanlou", "Parham Abed Azad", "Farbod Davoodi", "Mostafa Masumi", "Behnam Bahrak", "Abdol-Hossein Vahabie"], "brief": "\u8bba\u6587\u63d0\u51fa PsychoAgent\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8ba4\u77e5\u67b6\u6784\uff0c\u5c06\u4e8b\u5b9e\u8bb0\u5fc6\u4e0e\u60c5\u611f\u8bb0\u5fc6\u5206\u79bb\uff0c\u5e76\u901a\u8fc7\u51b2\u7a81\u611f\u77e5\u7684\u6267\u884c\u63a7\u5236\u5668\u6574\u5408\u3002\u5b83\u5148\u6309\u8bed\u4e49\u76f8\u5173\u6027\u7b5b\u9009\u60c5\u611f\u8bb0\u5fc6\uff0c\u518d\u6309\u60c5\u611f\u663e\u8457\u6027\u91cd\u6392\u5e8f\uff0c\u4f7f\u51b2\u7a81\u76f8\u5173\u3001\u60c5\u7eea\u91cd\u8981\u7684\u8bb0\u5fc6\u66f4\u5bb9\u6613\u8fdb\u5165\u63d0\u793a\u8bcd\u3002", "categories": ["cs.AI", "cs.CL", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07438", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u57283\u4e2a\u53d7\u63a7\u51b2\u7a81\u573a\u666f\u4e2d\uff0c\u5b8c\u6574\u67b6\u6784\u68c0\u7d22\u5230\u66f4\u591a\u51b2\u7a81\u5173\u952e\u8bb0\u5fc6\uff0c\u5f97\u5206\u4e3a0.933\uff0c\u9ad8\u4e8e\u8bed\u4e49-\u60c5\u611f\u57fa\u7ebf0.500\u548c\u5355\u8bb0\u5fc6RAG\u57fa\u7ebf0.667", "\u60c5\u611f\u8bb0\u5fc6\u68c0\u7d22\u517c\u987e\u8bed\u4e49\u5339\u914d\u4e0e\u60c5\u611f\u663e\u8457\u6027\uff0c\u4f46\u4f1a\u5e26\u6765\u5c0f\u5e45\u8bed\u4e49\u76f8\u4f3c\u5ea6\u4e0b\u964d", "5\u540d\u76f2\u8bc4\u5458\u8bc4\u4f3027\u4e2a\u8f93\u51fa\u540e\uff0c\u5b8c\u6574\u67b6\u6784\u6574\u4f53\u5747\u503c\u6700\u9ad8\uff08+0.22 SD\uff09\uff0c\u4f46\u591a\u91cd\u6821\u6b63\u540e\u7684\u6210\u5bf9\u5dee\u5f02\u672a\u8fbe\u5230\u663e\u8457"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u60c5\u611f\u8ba1\u7b97", "\u8ba4\u77e5\u67b6\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07438v1", "published_at": "2026-08-07", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PsychoAgent: An Affect-Sensitive Cognitive Architecture for Conflict-Aware Memory in LLM Agents", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u6309\u60c5\u611f\u4e0e\u51b2\u7a81\u68c0\u7d22\u8bb0\u5fc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PsychoAgent\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8ba4\u77e5\u67b6\u6784\uff0c\u5c06\u4e8b\u5b9e\u8bb0\u5fc6\u4e0e\u60c5\u611f\u8bb0\u5fc6\u5206\u79bb\uff0c\u5e76\u901a\u8fc7\u51b2\u7a81\u611f\u77e5\u7684\u6267\u884c\u63a7\u5236\u5668\u6574\u5408\u3002\u5b83\u5148\u6309\u8bed\u4e49\u76f8\u5173\u6027\u7b5b\u9009\u60c5\u611f\u8bb0\u5fc6\uff0c\u518d\u6309\u60c5\u611f\u663e\u8457\u6027\u91cd\u6392\u5e8f\uff0c\u4f7f\u51b2\u7a81\u76f8\u5173\u3001\u60c5\u7eea\u91cd\u8981\u7684\u8bb0\u5fc6\u66f4\u5bb9\u6613\u8fdb\u5165\u63d0\u793a\u8bcd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u60c5\u611f\u663e\u8457\u6027\u548c\u672a\u89e3\u51b3\u51b2\u7a81\u663e\u5f0f\u7eb3\u5165LLM\u667a\u80fd\u4f53\u8bb0\u5fc6\u68c0\u7d22\uff0c\u4e3a\u6784\u5efa\u66f4\u7c7b\u4eba\u3001\u53ef\u89e3\u91ca\u7684\u957f\u671f\u8bb0\u5fc6\u673a\u5236\u63d0\u4f9b\u4e86\u4e00\u4e2a\u53ef\u68c0\u67e5\u6846\u67b6\uff0c\u5c24\u5176\u9002\u5408\u7814\u7a76\u89d2\u8272\u4ee3\u7406\u3001\u5fc3\u7406\u6a21\u62df\u4e0e\u51b2\u7a81\u611f\u77e5\u4ea4\u4e92\u3002"}, {"abstract": "AI models are becoming increasingly adept at understanding and processing spatial information, thereby facilitating agentic problem-solving in spatial tasks and workflows. However, most of the research on their spatial capabilities (e.g., spatial reasoning) has focused on the textual modality as input and output. This contrasts with the human approach to GIS workflows, where text and visual modalities are often used together, interchangeably, and in a complementary manner. Thus, to truly achieve an automated GIS analysis pipeline or carry out human-designed GIS workflows, AI models --- Large Multimodal Models (LMMs) in particular --- need to be able to seamlessly transition between image- and text-based modalities that are traditionally used in such workflows. We present a modality transfer task that (1) asks an LMM to first describe an input image of colored squares in a regular grid, and (2) asks a new LMM instance to re-generate an image of the original spatial scene using the textual description output by the former model. This task quantifies the ability of LMMs to transfer spatial information between image and text modalities. Ultimately, by examining the modality transfer capability of LMMs through the lens of spatial information theory, this work highlights a critical bottleneck: achieving strong and robust geospatial understanding in LMMs requires rigorous, multi-modal alignment. Our results indicate that recent LMMs (here from OpenAI) still struggle with modality transfer, when tasked with re-generating an image of a simple spatial grid of color squares.", "arxiv_id": "2608.06948", "arxiv_url": "https://arxiv.org/abs/2608.06948", "authors": ["Ivan Majic", "Zexian Huang", "Franziska H\u00fcbl", "Krzysztof Janowicz", "Meilin Shi", "Mina Karimi", "Zilong Liu", "Alexandra Fortacz-Lazan"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u6a21\u6001\u8fc1\u79fb\u4efb\u52a1\uff1a\u5148\u8ba9LMM\u7528\u6587\u5b57\u63cf\u8ff0\u89c4\u5219\u7f51\u683c\u4e2d\u7684\u5f69\u8272\u65b9\u5757\u56fe\u50cf\uff0c\u518d\u8ba9\u53e6\u4e00\u4e2aLMM\u6839\u636e\u63cf\u8ff0\u91cd\u5efa\u539f\u56fe\u3002\u8be5\u4efb\u52a1\u7528\u4e8e\u91cf\u5316\u5927\u591a\u6a21\u6001\u6a21\u578b\u5728\u56fe\u50cf\u4e0e\u6587\u672c\u4e4b\u95f4\u4f20\u9012\u7a7a\u95f4\u4fe1\u606f\u7684\u80fd\u529b\uff0c\u5e76\u5206\u6790\u5176\u5bf9\u81ea\u4e3bGIS\u667a\u80fd\u4f53\u7684\u57fa\u7840\u610f\u4e49\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06948", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u4efb\u52a1\u8bbe\u8ba1\u805a\u7126\u7b80\u5355\u7a7a\u95f4\u573a\u666f\uff1a\u89c4\u5219\u7f51\u683c\u4e0e\u5f69\u8272\u65b9\u5757\uff0c\u4ee5\u9694\u79bb\u5e76\u6d4b\u8bd5\u7a7a\u95f4\u4fe1\u606f\u7684\u8de8\u6a21\u6001\u4fdd\u6301\u80fd\u529b", "\u4ece\u7a7a\u95f4\u4fe1\u606f\u7406\u8bba\u89c6\u89d2\u8bc4\u4f30\u56fe\u50cf\u5230\u6587\u672c\u3001\u6587\u672c\u5230\u56fe\u50cf\u8fc7\u7a0b\u4e2d\u7684\u4fe1\u606f\u635f\u5931\u4e0e\u5bf9\u9f50\u95ee\u9898", "\u5b9e\u9a8c\u663e\u793a\u8fd1\u671fOpenAI\u7cfbLMM\u5728\u7b80\u5355\u7f51\u683c\u91cd\u5efa\u4e2d\u4ecd\u5b58\u5728\u660e\u663e\u56f0\u96be\uff0c\u8bf4\u660e\u591a\u6a21\u6001\u7a7a\u95f4\u5bf9\u9f50\u5c1a\u4e0d\u7a33\u5065"], "keywords": ["\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u5730\u7406\u7a7a\u95f4", "\u7a7a\u95f4\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06948v1", "published_at": "2026-08-07", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "LMM Modality Transfer: A Pre-requisite for Autonomous GIS Agents", "tldr": "\u8bc4\u4f30LMM\u5728GIS\u4e2d\u56fe\u6587\u7a7a\u95f4\u8fc1\u79fb\u80fd\u529b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u6a21\u6001\u8fc1\u79fb\u4efb\u52a1\uff1a\u5148\u8ba9LMM\u7528\u6587\u5b57\u63cf\u8ff0\u89c4\u5219\u7f51\u683c\u4e2d\u7684\u5f69\u8272\u65b9\u5757\u56fe\u50cf\uff0c\u518d\u8ba9\u53e6\u4e00\u4e2aLMM\u6839\u636e\u63cf\u8ff0\u91cd\u5efa\u539f\u56fe\u3002\u8be5\u4efb\u52a1\u7528\u4e8e\u91cf\u5316\u5927\u591a\u6a21\u6001\u6a21\u578b\u5728\u56fe\u50cf\u4e0e\u6587\u672c\u4e4b\u95f4\u4f20\u9012\u7a7a\u95f4\u4fe1\u606f\u7684\u80fd\u529b\uff0c\u5e76\u5206\u6790\u5176\u5bf9\u81ea\u4e3bGIS\u667a\u80fd\u4f53\u7684\u57fa\u7840\u610f\u4e49\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u81ea\u4e3bGIS\u5206\u6790\u6d41\u6c34\u7ebf\u4e0d\u4ec5\u9700\u8981\u6587\u672c\u7a7a\u95f4\u63a8\u7406\uff0c\u8fd8\u9700\u8981\u5728\u5730\u56fe\u3001\u56fe\u50cf\u3001\u6587\u5b57\u63cf\u8ff0\u4e4b\u95f4\u53ef\u9760\u5207\u6362\uff1b\u5176\u7ed3\u679c\u63ed\u793a\u4e86\u5f53\u524dLMM\u7528\u4e8e\u5730\u7406\u7a7a\u95f4\u667a\u80fd\u4f53\u65f6\u7684\u5173\u952e\u74f6\u9888\u3002"}, {"abstract": "World-Action Models (WAMs) improve end-to-end autonomous driving by transferring video dynamics priors to action prediction, but existing methods require costly future generation at inference. We present SimWAM, a simple yet effective WAM that uses video generation purely as a training signal. It co-trains a pretrained video expert and a lightweight action expert with joint flow matching. An isolated attention mask keeps action prediction independent of future frames, allowing the video branch to be discarded after training and leaving a self-contained planner that directly predicts trajectories. Since the two experts share no parameters and interact only through a unified attention interface, the video backbone could be replaced and the action expert scaled independently without modifying the learning objective or inference pipeline. We further apply reinforcement learning to optimize a compositional driving reward beyond trajectory imitation. Our SimWAM achieves $91.5$ PDMS on NAVSIM, surpasses state-of-the-art WAM-based planners with substantially lower latency, and transfers zero-shot to nuScenes. These results position SimWAM as a simple yet solid baseline that could readily benefit from advances in video generation for efficient autonomous driving. The code and model weights are available at https://github.com/H-EmbodVis/SimWAM/", "arxiv_id": "2608.07468", "arxiv_url": "https://arxiv.org/abs/2608.07468", "authors": ["Zongchuang Zhao", "Xin Zhou", "Tianyang Xu", "Zhengyang Sun", "Kaixuan Zhou", "Honglin Li", "Dingkang Liang", "Xiang Bai"], "brief": "SimWAM \u662f\u4e00\u79cd\u7b80\u5355\u7684 World-Action Model\uff0c\u7528\u9884\u8bad\u7ec3\u89c6\u9891\u4e13\u5bb6\u5728\u8bad\u7ec3\u9636\u6bb5\u63d0\u4f9b\u89c6\u9891\u52a8\u6001\u5148\u9a8c\uff0c\u5e76\u534f\u540c\u8bad\u7ec3\u8f7b\u91cf\u52a8\u4f5c\u4e13\u5bb6\u3002\u63a8\u7406\u65f6\u4e22\u5f03\u89c6\u9891\u5206\u652f\uff0c\u4ec5\u4fdd\u7559\u53ef\u76f4\u63a5\u9884\u6d4b\u8f68\u8ff9\u7684\u81ea\u5305\u542b\u89c4\u5212\u5668\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/H-EmbodVis/SimWAM", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2608.07468", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u8054\u5408 flow matching \u8054\u8bad\u89c6\u9891\u4e13\u5bb6\u4e0e\u52a8\u4f5c\u4e13\u5bb6\uff0c\u5e76\u7528\u9694\u79bb\u6ce8\u610f\u529b\u63a9\u7801\u786e\u4fdd\u52a8\u4f5c\u9884\u6d4b\u4e0d\u4f9d\u8d56\u672a\u6765\u5e27", "\u89c6\u9891\u9aa8\u5e72\u4e0e\u52a8\u4f5c\u4e13\u5bb6\u4e0d\u5171\u4eab\u53c2\u6570\uff0c\u53ea\u901a\u8fc7\u7edf\u4e00\u6ce8\u610f\u529b\u63a5\u53e3\u4ea4\u4e92\uff0c\u4fbf\u4e8e\u66ff\u6362\u89c6\u9891\u6a21\u578b\u6216\u72ec\u7acb\u6269\u5c55\u52a8\u4f5c\u6a21\u578b", "\u5728 NAVSIM \u4e0a\u8fbe\u5230 91.5 PDMS\uff0c\u4f4e\u5ef6\u8fdf\u8d85\u8fc7\u73b0\u6709 WAM \u89c4\u5212\u5668\uff0c\u5e76\u53ef\u96f6\u6837\u672c\u8fc1\u79fb\u5230 nuScenes"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "H-EmbodVis", "pdf_url": "https://arxiv.org/pdf/2608.07468v1", "published_at": "2026-08-07", "score": 0.286, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07468.png", "title": "SimWAM: A Simple World Action Model for End-to-End Autonomous Driving", "tldr": "\u7528\u89c6\u9891\u751f\u6210\u76d1\u7763\u8bad\u7ec3\u9ad8\u6548\u7aef\u5230\u7aef\u9a7e\u9a76\u89c4\u5212\u5668", "upvotes": 8, "what_it_is": "SimWAM \u662f\u4e00\u79cd\u7b80\u5355\u7684 World-Action Model\uff0c\u7528\u9884\u8bad\u7ec3\u89c6\u9891\u4e13\u5bb6\u5728\u8bad\u7ec3\u9636\u6bb5\u63d0\u4f9b\u89c6\u9891\u52a8\u6001\u5148\u9a8c\uff0c\u5e76\u534f\u540c\u8bad\u7ec3\u8f7b\u91cf\u52a8\u4f5c\u4e13\u5bb6\u3002\u63a8\u7406\u65f6\u4e22\u5f03\u89c6\u9891\u5206\u652f\uff0c\u4ec5\u4fdd\u7559\u53ef\u76f4\u63a5\u9884\u6d4b\u8f68\u8ff9\u7684\u81ea\u5305\u542b\u89c4\u5212\u5668\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u52a8\u6001\u77e5\u8bc6\u8f6c\u5316\u4e3a\u8bad\u7ec3\u76d1\u7763\uff0c\u800c\u975e\u5728\u63a8\u7406\u65f6\u751f\u6210\u672a\u6765\u89c6\u9891\uff0c\u663e\u8457\u964d\u4f4e\u81ea\u52a8\u9a7e\u9a76\u89c4\u5212\u5ef6\u8fdf\uff0c\u540c\u65f6\u4fdd\u6301\u9ad8\u6027\u80fd\u4e0e\u826f\u597d\u8fc1\u79fb\u6027\uff0c\u662f\u9ad8\u6548\u7aef\u5230\u7aef\u9a7e\u9a76 WAM \u7684\u5b9e\u7528\u57fa\u7ebf\u3002"}, {"abstract": "The widespread integration of AI coding assistants offers undeniable boosts to engineering velocity. Yet, recent studies point to a growing trade-off, revealing persistent challenges with code quality and maintainability. Industry leaders, including frontier AI labs, echo these concerns. As large language models are increasingly relied upon to author production code, understanding their impact on shipped software quality has become a critical priority. However, assessing these effects in industrial workflows remains difficult due to observability barriers. We study the impact of AI-generated code on production quality within a large enterprise operating global products relied upon by billions of users daily. Driven by this scale and user trust, the organization values code quality and has built thorough observability for every line of code deployed into production, enabling us to overcome measurement barriers to assess these effects. This study presents a large-scale empirical analysis of AI-generated C++ code from April 2025 to April 2026, tracking 3.52 million code changes across this enterprise\u0027s brownfield codebase. The core purpose is to understand the quality, performance, and maintenance characteristics of AI-generated code compared to human-written code in a production environment at scale. We find that AI-generated C++ code has a distinct quality profile, showing higher rates of interface and coupling burdens, copy and allocation overheads, and a reliance on explicit loops over optimized standard APIs. These issues translate into tangible downstream costs, including increased review effort and a 5-8% increase in compute resource consumption. However, we demonstrate that providing models with targeted, taxonomy-informed feedback can mitigate these effects, leading to an 11.1% reduction in targeted static analysis warnings and improved computational efficiency.", "arxiv_id": "2608.06640", "arxiv_url": "https://arxiv.org/abs/2608.06640", "authors": ["Michael Tran", "Fred Lewis", "Kun Yang", "Saksham Thakur", "Aditya Kini", "Aditya Patil", "Milad Hashemi", "Parthasarathy Ranganathan"], "brief": "\u8bba\u6587\u5728\u4e00\u5bb6\u8d85\u5927\u89c4\u6a21\u4f01\u4e1a\u7684\u68d5\u5730\u4ee3\u7801\u5e93\u4e2d\uff0c\u5206\u6790\u4e862025\u5e744\u6708\u81f32026\u5e744\u6708\u7684352\u4e07\u6b21\u4ee3\u7801\u53d8\u66f4\uff0c\u6bd4\u8f83AI\u751f\u6210\u4e0e\u4eba\u5de5\u7f16\u5199C++\u5728\u751f\u4ea7\u73af\u5883\u4e2d\u7684\u8d28\u91cf\u3001\u6027\u80fd\u4e0e\u7ef4\u62a4\u7279\u5f81\u3002\u7814\u7a76\u53d1\u73b0AI\u4ee3\u7801\u5b58\u5728\u66f4\u9c9c\u660e\u7684\u8d28\u91cf\u98ce\u9669\u753b\u50cf\uff0c\u5e76\u9a8c\u8bc1\u4e86\u57fa\u4e8e\u95ee\u9898\u5206\u7c7b\u7684\u5b9a\u5411\u53cd\u9988\u53ef\u90e8\u5206\u7f13\u89e3\u8fd9\u4e9b\u95ee\u9898\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06640", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["AI\u751f\u6210C++\u66f4\u5bb9\u6613\u5e26\u6765\u63a5\u53e3\u4e0e\u8026\u5408\u8d1f\u62c5\u3001\u590d\u5236\u4e0e\u5185\u5b58\u5206\u914d\u5f00\u9500\uff0c\u4ee5\u53ca\u504f\u597d\u663e\u5f0f\u5faa\u73af\u800c\u975e\u4f18\u5316\u6807\u51c6\u5e93API\u7b49\u95ee\u9898\u3002", "\u8fd9\u4e9b\u8d28\u91cf\u95ee\u9898\u4f1a\u8f6c\u5316\u4e3a\u5b9e\u9645\u5de5\u7a0b\u6210\u672c\uff0c\u5305\u62ec\u66f4\u9ad8\u7684\u4ee3\u7801\u8bc4\u5ba1\u8d1f\u62c5\u548c5%\u81f38%\u7684\u8ba1\u7b97\u8d44\u6e90\u6d88\u8017\u589e\u52a0\u3002", "\u5411\u6a21\u578b\u63d0\u4f9b\u57fa\u4e8e\u7f3a\u9677\u5206\u7c7b\u4f53\u7cfb\u7684\u5b9a\u5411\u53cd\u9988\u540e\uff0c\u76ee\u6807\u9759\u6001\u5206\u6790\u544a\u8b66\u51cf\u5c1111.1%\uff0c\u8ba1\u7b97\u6548\u7387\u4e5f\u6709\u6240\u6539\u5584\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u4ee3\u7801\u8d28\u91cf", "\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2608.06640v1", "published_at": "2026-08-06", "score": 0.268, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06640.png", "title": "Characterizing the Quality Profile of AI-Generated C++ in Production", "tldr": "\u5927\u89c4\u6a21\u63ed\u793aAI\u751f\u6210C++\u7684\u751f\u4ea7\u8d28\u91cf\u4ee3\u4ef7", "upvotes": 1, "what_it_is": "\u8bba\u6587\u5728\u4e00\u5bb6\u8d85\u5927\u89c4\u6a21\u4f01\u4e1a\u7684\u68d5\u5730\u4ee3\u7801\u5e93\u4e2d\uff0c\u5206\u6790\u4e862025\u5e744\u6708\u81f32026\u5e744\u6708\u7684352\u4e07\u6b21\u4ee3\u7801\u53d8\u66f4\uff0c\u6bd4\u8f83AI\u751f\u6210\u4e0e\u4eba\u5de5\u7f16\u5199C++\u5728\u751f\u4ea7\u73af\u5883\u4e2d\u7684\u8d28\u91cf\u3001\u6027\u80fd\u4e0e\u7ef4\u62a4\u7279\u5f81\u3002\u7814\u7a76\u53d1\u73b0AI\u4ee3\u7801\u5b58\u5728\u66f4\u9c9c\u660e\u7684\u8d28\u91cf\u98ce\u9669\u753b\u50cf\uff0c\u5e76\u9a8c\u8bc1\u4e86\u57fa\u4e8e\u95ee\u9898\u5206\u7c7b\u7684\u5b9a\u5411\u53cd\u9988\u53ef\u90e8\u5206\u7f13\u89e3\u8fd9\u4e9b\u95ee\u9898\u3002", "why_notable": "\u8fd9\u662f\u5c11\u89c1\u7684\u5de5\u4e1a\u7ea7\u3001\u751f\u4ea7\u73af\u5883\u3001\u5927\u89c4\u6a21AI\u4ee3\u7801\u8d28\u91cf\u5b9e\u8bc1\u7814\u7a76\uff0c\u76f4\u63a5\u91cf\u5316\u4e86AI\u751f\u6210\u4ee3\u7801\u5bf9\u771f\u5b9e\u8f6f\u4ef6\u8d28\u91cf\u548c\u8d44\u6e90\u6210\u672c\u7684\u5f71\u54cd\uff0c\u5e76\u7ed9\u51fa\u53ef\u64cd\u4f5c\u7684\u6539\u8fdb\u8def\u5f84\uff0c\u5bf9\u4f01\u4e1a\u91c7\u7528\u4ee3\u7801\u751f\u6210\u5de5\u5177\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Test-time training (TTT) views sequence modeling as an online learning problem in which fast weights are updated by an internal learning rule. Despite the growing number of TTT variants, existing approaches typically hard-code each variant separately, which makes it difficult to design new TTT methods and to isolate the role of each component. To address this, we propose Modular TTT, a framework that represents the inner learner as a directed acyclic graph and exposes the fast-weight network, loss function, learning rate, weight decay, and normalization as explicit design dimensions. Modular TTT automatically composes primitive-level train-view forward, train-view backward, and causal query-view rules into the full graph-level TTT computation, including the fast-weight state transition. Using Modular TTT, we systematically ablate the components of TTT and find that small learning-rate initialization, weight decay, and a single-layer nonlinearity improve performance, while MSE and inner-product losses perform similarly. Deeper fast-weight networks and normalization tend to hurt performance because they induce excessively large activations, while residual connections and gating provide little measurable benefit. Guided by these findings, we train the best resulting variant as 410M- and 1.45B-parameter models on 100B tokens, and observe training loss and benchmark performance comparable to Gated DeltaNet.", "arxiv_id": "2608.07110", "arxiv_url": "https://arxiv.org/abs/2608.07110", "authors": ["Bohao Tang", "Zhen Qin", "Yuqi Pan", "Zheng Li", "Pengfei Liu", "Ya Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Modular TTT\uff0c\u628a\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u4e2d\u7684\u5185\u90e8\u5b66\u4e60\u5668\u8868\u793a\u4e3a\u6709\u5411\u65e0\u73af\u56fe\uff0c\u5e76\u5c06\u5feb\u901f\u6743\u91cd\u7f51\u7edc\u3001\u635f\u5931\u51fd\u6570\u3001\u5b66\u4e60\u7387\u3001\u6743\u91cd\u8870\u51cf\u548c\u5f52\u4e00\u5316\u7b49\u4f5c\u4e3a\u663e\u5f0f\u53ef\u7ec4\u5408\u8bbe\u8ba1\u7ef4\u5ea6\u3002\u8be5\u6846\u67b6\u53ef\u81ea\u52a8\u7ec4\u5408\u8bad\u7ec3\u89c6\u56fe\u524d\u5411/\u53cd\u5411\u4e0e\u56e0\u679c\u67e5\u8be2\u89c4\u5219\uff0c\u751f\u6210\u5b8c\u6574\u7684 TTT \u8ba1\u7b97\u4e0e\u72b6\u6001\u8f6c\u79fb\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07110", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7cfb\u7edf\u6d88\u878d\u53d1\u73b0\uff1a\u5c0f\u5b66\u4e60\u7387\u521d\u59cb\u5316\u3001\u6743\u91cd\u8870\u51cf\u548c\u5355\u5c42\u975e\u7ebf\u6027\u6709\u52a9\u4e8e\u63d0\u5347\u6027\u80fd", "MSE \u635f\u5931\u4e0e\u5185\u79ef\u635f\u5931\u8868\u73b0\u76f8\u8fd1\uff1b\u66f4\u6df1\u5feb\u901f\u6743\u91cd\u7f51\u7edc\u548c\u5f52\u4e00\u5316\u5e38\u56e0\u6fc0\u6d3b\u8fc7\u5927\u800c\u635f\u5bb3\u6027\u80fd", "\u57fa\u4e8e\u6700\u4f73\u53d8\u4f53\u8bad\u7ec3 410M \u4e0e 1.45B \u53c2\u6570\u6a21\u578b\u3001\u4f7f\u7528 100B tokens\uff0c\u6027\u80fd\u63a5\u8fd1 Gated DeltaNet"], "keywords": ["\u6d4b\u8bd5\u65f6\u8bad\u7ec3", "\u5e8f\u5217\u5efa\u6a21", "\u6a21\u5757\u5316\u67b6\u6784", "\u5728\u7ebf\u5b66\u4e60"], "num_comments": 0, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2608.07110v1", "published_at": "2026-08-07", "score": 0.266, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07110.png", "title": "Modular TTT: Rethinking Test-Time Training as Composable Modules", "tldr": "\u5c06\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u62c6\u6210\u53ef\u7ec4\u5408\u6a21\u5757\u7cfb\u7edf\u8bc4\u4f30", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Modular TTT\uff0c\u628a\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u4e2d\u7684\u5185\u90e8\u5b66\u4e60\u5668\u8868\u793a\u4e3a\u6709\u5411\u65e0\u73af\u56fe\uff0c\u5e76\u5c06\u5feb\u901f\u6743\u91cd\u7f51\u7edc\u3001\u635f\u5931\u51fd\u6570\u3001\u5b66\u4e60\u7387\u3001\u6743\u91cd\u8870\u51cf\u548c\u5f52\u4e00\u5316\u7b49\u4f5c\u4e3a\u663e\u5f0f\u53ef\u7ec4\u5408\u8bbe\u8ba1\u7ef4\u5ea6\u3002\u8be5\u6846\u67b6\u53ef\u81ea\u52a8\u7ec4\u5408\u8bad\u7ec3\u89c6\u56fe\u524d\u5411/\u53cd\u5411\u4e0e\u56e0\u679c\u67e5\u8be2\u89c4\u5219\uff0c\u751f\u6210\u5b8c\u6574\u7684 TTT \u8ba1\u7b97\u4e0e\u72b6\u6001\u8f6c\u79fb\u3002", "why_notable": "\u5b83\u628a\u539f\u672c\u5404\u81ea\u786c\u7f16\u7801\u7684 TTT \u53d8\u4f53\u7edf\u4e00\u5230\u6a21\u5757\u5316\u6846\u67b6\u4e2d\uff0c\u4fbf\u4e8e\u8bbe\u8ba1\u65b0\u65b9\u6cd5\u5e76\u5b9a\u4f4d\u5404\u7ec4\u4ef6\u4f5c\u7528\uff0c\u5bf9\u6539\u8fdb\u9ad8\u6548\u5e8f\u5217\u5efa\u6a21\u67b6\u6784\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent systems for optimizing prompts, programs, and ML workflows typically rely on explicit outer-loop controllers such as evolutionary search, bandits, or textual-gradient methods. We ask a fundamentally different question: how much of this search policy can be internalized by a single tool-using agent? We present ReASearch, a unified framework for reasoning-driven optimization in which the agent autonomously decides what to evaluate, how to diagnose failures, which edits to make, and when to verify or restart. Rather than serving only as a proposal generator guided by hand-designed heuristics, the agent actively analyzes outcomes, allocates budget, and refines its strategy over long horizons through persistent memory. With a shared agent loop and domain-specific tools, ReASearch instantiates the exact same scaffold to optimize prompts, programs, and ML workflows. Across 14 diverse tasks, it is competitive with and mostly better than specialized optimization systems, achieving gains of 2% to 40% over strong domain-specific baselines, and in some cases discovering solutions that improve on prior human best-known results. Crucially, we observe that complex search behaviors, which are typically implemented by explicit controllers, emerge naturally from the agent\u0027s reasoning process.", "arxiv_id": "2608.06714", "arxiv_url": "https://arxiv.org/abs/2608.06714", "authors": ["Junbo Li", "Boyi Liu", "Canwen Xu", "Yite Wang", "Yuxiong He", "Zhangyang Wang", "Qiang Liu", "Zhewei Yao"], "brief": "\u8bba\u6587\u63d0\u51fa ReASearch\uff0c\u4e00\u4e2a\u7531\u5de5\u5177\u4f7f\u7528\u578b\u667a\u80fd\u4f53\u9a71\u52a8\u7684\u901a\u7528\u4f18\u5316\u6846\u67b6\u3002\u8be5\u667a\u80fd\u4f53\u4e0d\u4f9d\u8d56\u663e\u5f0f\u5916\u5faa\u73af\u63a7\u5236\u5668\uff0c\u800c\u662f\u81ea\u4e3b\u51b3\u5b9a\u8bc4\u4f30\u5bf9\u8c61\u3001\u5931\u8d25\u8bca\u65ad\u3001\u4fee\u6539\u7b56\u7565\u3001\u9a8c\u8bc1\u4e0e\u91cd\u542f\uff0c\u5e76\u901a\u8fc7\u6301\u4e45\u8bb0\u5fc6\u8fdb\u884c\u957f\u7a0b\u641c\u7d22\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06714", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u540c\u4e00\u667a\u80fd\u4f53\u5faa\u73af\u914d\u5408\u9886\u57df\u5de5\u5177\uff0c\u53ef\u540c\u65f6\u7528\u4e8e\u63d0\u793a\u4f18\u5316\u3001\u7a0b\u5e8f\u4f18\u5316\u548c\u673a\u5668\u5b66\u4e60\u5de5\u4f5c\u6d41\u4f18\u5316", "\u667a\u80fd\u4f53\u5185\u5316\u641c\u7d22\u7b56\u7565\uff0c\u80fd\u81ea\u4e3b\u5206\u914d\u9884\u7b97\u3001\u5206\u6790\u7ed3\u679c\u3001\u8fed\u4ee3\u7f16\u8f91\u5e76\u5f62\u6210\u590d\u6742\u641c\u7d22\u884c\u4e3a", "\u572814\u4e2a\u591a\u6837\u4efb\u52a1\u4e0a\u76f8\u6bd4\u5f3a\u9886\u57df\u57fa\u7ebf\u63d0\u53472%\u523040%\uff0c\u90e8\u5206\u7ed3\u679c\u8d85\u8fc7\u5df2\u77e5\u4eba\u7c7b\u6700\u4f73\u65b9\u6848"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u4f18\u5316", "\u63d0\u793a\u5de5\u7a0b", "\u673a\u5668\u5b66\u4e60\u5de5\u4f5c\u6d41"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06714v1", "published_at": "2026-08-07", "score": 0.229, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06714.png", "title": "The Optimizer Is the Agent: Reasoning-Driven Search across Prompts, Programs, and ML Workflows", "tldr": "\u7528\u5355\u4e00\u63a8\u7406\u667a\u80fd\u4f53\u7edf\u4e00\u4f18\u5316\u63d0\u793a\u3001\u7a0b\u5e8f\u4e0eML\u6d41\u7a0b", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa ReASearch\uff0c\u4e00\u4e2a\u7531\u5de5\u5177\u4f7f\u7528\u578b\u667a\u80fd\u4f53\u9a71\u52a8\u7684\u901a\u7528\u4f18\u5316\u6846\u67b6\u3002\u8be5\u667a\u80fd\u4f53\u4e0d\u4f9d\u8d56\u663e\u5f0f\u5916\u5faa\u73af\u63a7\u5236\u5668\uff0c\u800c\u662f\u81ea\u4e3b\u51b3\u5b9a\u8bc4\u4f30\u5bf9\u8c61\u3001\u5931\u8d25\u8bca\u65ad\u3001\u4fee\u6539\u7b56\u7565\u3001\u9a8c\u8bc1\u4e0e\u91cd\u542f\uff0c\u5e76\u901a\u8fc7\u6301\u4e45\u8bb0\u5fc6\u8fdb\u884c\u957f\u7a0b\u641c\u7d22\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u4f20\u7edf\u7531\u8fdb\u5316\u641c\u7d22\u3001bandit\u6216\u6587\u672c\u68af\u5ea6\u7b49\u5916\u90e8\u63a7\u5236\u5668\u627f\u62c5\u7684\u4f18\u5316\u903b\u8f91\u8f6c\u79fb\u5230LLM\u667a\u80fd\u4f53\u7684\u63a8\u7406\u8fc7\u7a0b\u4e2d\uff0c\u5c55\u793a\u4e86\u901a\u7528\u667a\u80fd\u4f53\u4f5c\u4e3a\u201c\u4f18\u5316\u5668\u201d\u7684\u6f5c\u529b\uff0c\u5bf9\u81ea\u52a8\u5316\u673a\u5668\u5b66\u4e60\u3001\u4ee3\u7801\u751f\u6210\u548c\u667a\u80fd\u4f53\u5f0f\u79d1\u7814\u5de5\u4f5c\u6d41\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We study visual persistence in interactive video world models. These models rely on a Key-Value (KV) cache as a growing visual memory to carry forward previously generated frames. However, we find that models can no longer reliably address stored content once rollouts extend beyond the training horizon, because temporal Rotary Positional Embeddings (RoPE) offsets then fall outside the range seen during training and the model struggles to retrieve the relevant visual information through attention. Moreover, naively compressing the cache in the RoPE-rotated space corrupts memory by averaging together incompatible positional phases. To address this, we propose WorldTrace, a training-free memory framework for long-horizon visual
