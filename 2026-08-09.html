 remains unresolved. Existing studies report substantial performance degradation in this domain, yet their evaluations are limited to synthetic broadcast data. To address this gap, we introduce BAMM (Broadcast AI-Music Monitoring), a 40-hour dataset of real-world television recordings containing AI-generated and human-made music. We compare clean-trained and broadcast-trained CNN variants across three progressively more challenging scenarios: Clean Foreground Music (CFM), Synthetic TV Broadcast (STB), and Real TV Broadcast (RTB). Both models achieve near-perfect performance on CFM but degrade substantially under synthetic broadcast conditions. Broadcast-oriented training improves robustness compared with clean training, although performance remains limited. On RTB, evaluated using BAMM, both models degrade further and show substantial score overlap between AI-generated and human-made music. These results expose a critical domain gap and show that current training approaches on CNN-based detectors remain insufficient for reliable AI-generated music detection in broadcast monitoring.", "arxiv_id": "2608.07359", "arxiv_url": "https://arxiv.org/abs/2608.07359", "authors": ["David L\u00f3pez-Ayala", "Fernando Garc\u00eda de la Cruz", "Pablo Zinemanas", "Emilio Molina", "Mart\u00edn Rocamora"], "brief": "\u8bba\u6587\u63d0\u51fa BAMM\uff0c\u4e00\u4e2a\u5305\u542b 40 \u5c0f\u65f6\u771f\u5b9e\u7535\u89c6\u5f55\u5236\u7684\u5e7f\u64ad AI \u97f3\u4e50\u76d1\u6d4b\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8bc4\u4f30 AI \u751f\u6210\u97f3\u4e50\u68c0\u6d4b\u5728\u771f\u5b9e\u64ad\u51fa\u73af\u5883\u4e2d\u7684\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a CNN \u68c0\u6d4b\u5668\u5728\u5e72\u51c0\u97f3\u4e50\u4e0a\u63a5\u8fd1\u5b8c\u7f8e\uff0c\u4f46\u5728\u5408\u6210\u548c\u771f\u5b9e\u7535\u89c6\u5e7f\u64ad\u4e2d\u663e\u8457\u9000\u5316\uff0c\u5e7f\u64ad\u8bad\u7ec3\u867d\u6709\u5e2e\u52a9\u4f46\u4ecd\u4e0d\u8db3\u4ee5\u53ef\u9760\u533a\u5206 AI \u4e0e\u4eba\u7c7b\u97f3\u4e50\u3002", "categories": ["eess.AS", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07359", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u97f3\u4e50\u68c0\u6d4b", "\u97f3\u9891\u8bc6\u522b", "\u6570\u636e\u96c6", "\u57df\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07359v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Assessing AI-generated music detection in real-world broadcast monitoring", "tldr": "\u8bba\u6587\u63d0\u51fa BAMM\uff0c\u4e00\u4e2a\u5305\u542b 40 \u5c0f\u65f6\u771f\u5b9e\u7535\u89c6\u5f55\u5236\u7684\u5e7f\u64ad AI \u97f3\u4e50\u76d1\u6d4b\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8bc4\u4f30 AI \u751f\u6210\u97f3\u4e50\u68c0\u6d4b\u5728\u771f\u5b9e\u64ad\u51fa\u73af\u5883\u4e2d\u7684\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a CNN \u68c0\u6d4b\u5668\u5728\u5e72\u51c0\u97f3\u4e50\u4e0a\u63a5\u8fd1\u5b8c\u7f8e\uff0c\u4f46\u5728\u5408\u6210\u548c\u771f\u5b9e\u7535\u89c6\u5e7f\u64ad\u4e2d\u663e\u8457\u9000\u5316\uff0c\u5e7f\u64ad\u8bad\u7ec3\u867d\u6709\u5e2e\u52a9\u4f46\u4ecd\u4e0d\u8db3\u4ee5\u53ef\u9760\u533a\u5206 AI \u4e0e\u4eba\u7c7b\u97f3\u4e50\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Understanding concepts is fundamental to generalization. Despite their impressive performance on a wide range of tasks, Large Language Models (LLMs) still struggle with genuine concept understanding. Prior work has evaluated conceptual understanding in LLMs using natural-language benchmarks or narrowly scoped synthetic tasks, but these settings often conflate multiple skills or lack precise control over the underlying concepts and their properties. To support controlled probing of concepts in LLMs, we design tests on their core properties: abstraction, compositionality, and groundness. We set up a concept-centric benchmark, targeting spatial concepts such as direction, distance, topology, and their compositions, and use question answering tasks serving as a proxy. We conduct extensive experiments across multiple LLM architectures and training regimes to analyze how model scale and design impact conceptual understanding. The results reveal clear limitations in current LLMs and provide insights into the factors shaping their ability to acquire and compose structured concepts. Our findings shed light on how concept-based LLMs can be redesigned for improved information access and knowledge management. The code will be available at https://github.com/rd20karim/concept-probing.", "arxiv_id": "2608.07353", "arxiv_url": "https://arxiv.org/abs/2608.07353", "authors": ["Karim Radouane", "Jose G Moreno", "Lynda Tamine"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4ee5\u5730\u7406\u7a7a\u95f4\u6982\u5ff5\u4e3a\u6838\u5fc3\u7684\u53d7\u63a7\u63a2\u6d4b\u57fa\u51c6\uff0c\u7528\u95ee\u7b54\u4efb\u52a1\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5bf9\u65b9\u5411\u3001\u8ddd\u79bb\u3001\u62d3\u6251\u53ca\u5176\u7ec4\u5408\u7684\u62bd\u8c61\u6027\u3001\u7ec4\u5408\u6027\u548c\u63a5\u5730\u6027\u7406\u89e3\u3002\u8de8\u591a\u79cd\u67b6\u6784\u548c\u8bad\u7ec3\u8bbe\u7f6e\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u5f53\u524d\u5927\u6a21\u578b\u5728\u7ed3\u6784\u5316\u6982\u5ff5\u83b7\u53d6\u4e0e\u7ec4\u5408\u4e0a\u4ecd\u6709\u660e\u663e\u5c40\u9650\uff0c\u5e76\u5206\u6790\u4e86\u89c4\u6a21\u4e0e\u8bbe\u8ba1\u56e0\u7d20\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07353", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6982\u5ff5\u7406\u89e3", "\u7a7a\u95f4\u63a8\u7406", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07353v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Geo-Spatial Concept Probing of Large Language Models: Abstraction, Compositionality, and Grounding", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4ee5\u5730\u7406\u7a7a\u95f4\u6982\u5ff5\u4e3a\u6838\u5fc3\u7684\u53d7\u63a7\u63a2\u6d4b\u57fa\u51c6\uff0c\u7528\u95ee\u7b54\u4efb\u52a1\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5bf9\u65b9\u5411\u3001\u8ddd\u79bb\u3001\u62d3\u6251\u53ca\u5176\u7ec4\u5408\u7684\u62bd\u8c61\u6027\u3001\u7ec4\u5408\u6027\u548c\u63a5\u5730\u6027\u7406\u89e3\u3002\u8de8\u591a\u79cd\u67b6\u6784\u548c\u8bad\u7ec3\u8bbe\u7f6e\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u5f53\u524d\u5927\u6a21\u578b\u5728\u7ed3\u6784\u5316\u6982\u5ff5\u83b7\u53d6\u4e0e\u7ec4\u5408\u4e0a\u4ecd\u6709\u660e\u663e\u5c40\u9650\uff0c\u5e76\u5206\u6790\u4e86\u89c4\u6a21\u4e0e\u8bbe\u8ba1\u56e0\u7d20\u7684\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test data from public benchmarks inevitably leaks into pretraining corpora, inflating evaluation scores once memorized. \\textbf{Contamination mitigation evaluation} intervenes in the decoding process to suppress memorization and restore a contaminated model\u0027s genuine capability, but its prevailing metric, the \\textbf{G-AP} (\\textbf{G}ap of \\textbf{A}ggregate \\textbf{P}erformance), is flawed. Discrete correct/incorrect readouts cannot characterize per-question performance, averaging before differencing lets over- and under-suppression cancel out, and uniform per-question weighting invites strategies to push solve probabilities onto the clean model\u0027s high-frequency values. We propose \\textbf{SA-PPG} (\\textbf{S}tratified \\textbf{A}ggregate of \\textbf{P}er-question \\textbf{P}robability \\textbf{G}aps): estimate each question\u0027s solve probability by sampling, difference it against the clean model per question, and aggregate within groups defined by the clean model\u0027s solve probability. Existing mitigation strategies first estimate where contamination lies and then operate on the estimate, so they are only as correct as the estimate. \\textbf{RailCap} instead judges contamination during generation: whenever a sample falls back onto the greedy trajectory, the next trajectory token is capped to the runner-up, accumulating suppression until the response distribution becomes sufficiently dispersed. Across multiple contaminated models and benchmarks, SA-PPG reveals that prior strategies\u0027 restoration is substantially overestimated, while RailCap attains the lowest SA-PPG.", "arxiv_id": "2608.07341", "arxiv_url": "https://arxiv.org/abs/2608.07341", "authors": ["Ruijie Hou", "Yueyang Jiao", "Zhao Wang", "Yingming Li"], "brief": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u57fa\u51c6\u6c61\u67d3\u7f13\u89e3\u8bc4\u4f30\u6307\u6807 G-AP \u4f1a\u56e0\u4e8c\u503c\u5224\u5206\u3001\u5148\u5e73\u5747\u540e\u6c42\u5dee\u548c\u5747\u5300\u52a0\u6743\u800c\u9ad8\u4f30\u201c\u6062\u590d\u201d\u6548\u679c\u3002\u4f5c\u8005\u63d0\u51fa SA-PPG\uff0c\u7528\u9010\u9898\u91c7\u6837\u4f30\u8ba1\u89e3\u9898\u6982\u7387\u5e76\u6309\u5e72\u51c0\u6a21\u578b\u6982\u7387\u5206\u5c42\u805a\u5408\uff0c\u540c\u65f6\u63d0\u51fa RailCap \u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u6291\u5236\u7591\u4f3c\u8bb0\u5fc6\u8f68\u8ff9\uff1b\u5b9e\u9a8c\u663e\u793a\u65e2\u6709\u65b9\u6cd5\u6062\u590d\u6548\u679c\u88ab\u660e\u663e\u9ad8\u4f30\uff0cRailCap \u53d6\u5f97\u66f4\u4f4e\u6c61\u67d3\u5dee\u8ddd\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07341", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u57fa\u51c6\u6c61\u67d3", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u4f30", "\u89e3\u7801\u7b56\u7565"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07341v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Zero Gap Is Not Restoration: Stratified Per-Question Probability Evaluation and Step-wise Mitigation of Benchmark Contamination", "tldr": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u57fa\u51c6\u6c61\u67d3\u7f13\u89e3\u8bc4\u4f30\u6307\u6807 G-AP \u4f1a\u56e0\u4e8c\u503c\u5224\u5206\u3001\u5148\u5e73\u5747\u540e\u6c42\u5dee\u548c\u5747\u5300\u52a0\u6743\u800c\u9ad8\u4f30\u201c\u6062\u590d\u201d\u6548\u679c\u3002\u4f5c\u8005\u63d0\u51fa SA-PPG\uff0c\u7528\u9010\u9898\u91c7\u6837\u4f30\u8ba1\u89e3\u9898\u6982\u7387\u5e76\u6309\u5e72\u51c0\u6a21\u578b\u6982\u7387\u5206\u5c42\u805a\u5408\uff0c\u540c\u65f6\u63d0\u51fa RailCap \u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u6291\u5236\u7591\u4f3c\u8bb0\u5fc6\u8f68\u8ff9\uff1b\u5b9e\u9a8c\u663e\u793a\u65e2\u6709\u65b9\u6cd5\u6062\u590d\u6548\u679c\u88ab\u660e\u663e\u9ad8\u4f30\uff0cRailCap \u53d6\u5f97\u66f4\u4f4e\u6c61\u67d3\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Registration-based Few-shot medical image segmentation (RFMIS) aims to generate pseudo-labels for unlabeled images by warping a labeled image through registration. However, existing methods primarily perform pixel-level optimization and inference in Euclidean space, treating anatomical structures as flat and disjoint. This neglect of inherent hierarchies degrades pseudo-label quality and weakens the discrimination of ambiguous regions, limiting the segmentation performance. To overcome this challenge, we propose a Hyperbolic Hierarchy-aware Aggregative Learning framework for RFMIS, termed H2AL, that enhances both deformation plausibility and anatomical discrimination for dual-task learning. Specifically, we introduce a Hyperbolic Hierarchy-aware Infusion (H2I) module, which leverages the hierarchical modeling capability of hyperbolic space to learn precise hierarchy-aware representations via transformation-guided supervised hyperbolic contrastive learning, and injects such hierarchical priors into Euclidean space through a gated infusion block while preserving semantic richness. Furthermore, we propose an end-to-end joint optimization algorithm by gradient aggregation, where the gradients from the registration and segmentation decoders, embedding semantic and hierarchical cues, are aggregated to update the shared encoder to promote collaborative learning across tasks. Extensive experiments on two anatomical regions, with five experimental settings, demonstrate the effectiveness and efficiency of our method in both registration and segmentation. The code is publicly available at https://github.com/JiamingCai469/H2AL.", "arxiv_id": "2608.07340", "arxiv_url": "https://arxiv.org/abs/2608.07340", "authors": ["Jia Wang", "Jiaming Cai", "Zunying Hu", "Zhanjie Wu", "Jinyuan Liu", "Hua Cheng", "Yun Peng"], "brief": "\u672c\u6587\u63d0\u51fa H2AL\uff0c\u7528\u4e8e\u57fa\u4e8e\u914d\u51c6\u7684\u5c11\u6837\u672c\u533b\u5b66\u56fe\u50cf\u5206\u5272\uff0c\u901a\u8fc7\u5728\u53cc\u66f2\u7a7a\u95f4\u5efa\u6a21\u89e3\u5256\u5c42\u7ea7\u5173\u7cfb\u5e76\u5c06\u5c42\u7ea7\u5148\u9a8c\u6ce8\u5165\u6b27\u6c0f\u7279\u5f81\uff0c\u63d0\u5347\u4f2a\u6807\u7b7e\u8d28\u91cf\u548c\u6a21\u7cca\u533a\u57df\u5224\u522b\u80fd\u529b\u3002\u540c\u65f6\u901a\u8fc7\u914d\u51c6\u4e0e\u5206\u5272\u68af\u5ea6\u805a\u5408\u8fdb\u884c\u7aef\u5230\u7aef\u8054\u5408\u4f18\u5316\uff0c\u5728\u4e24\u4e2a\u89e3\u5256\u533a\u57df\u548c\u591a\u79cd\u8bbe\u7f6e\u4e0b\u63d0\u5347\u4e86\u914d\u51c6\u4e0e\u5206\u5272\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07340", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u5c11\u6837\u672c\u5b66\u4e60", "\u53cc\u66f2\u5b66\u4e60", "\u56fe\u50cf\u914d\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07340v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "H2AL: Hyperbolic Hierarchy-aware Aggregative Learning for Registration-based Few-shot Medical Image Segmentation", "tldr": "\u672c\u6587\u63d0\u51fa H2AL\uff0c\u7528\u4e8e\u57fa\u4e8e\u914d\u51c6\u7684\u5c11\u6837\u672c\u533b\u5b66\u56fe\u50cf\u5206\u5272\uff0c\u901a\u8fc7\u5728\u53cc\u66f2\u7a7a\u95f4\u5efa\u6a21\u89e3\u5256\u5c42\u7ea7\u5173\u7cfb\u5e76\u5c06\u5c42\u7ea7\u5148\u9a8c\u6ce8\u5165\u6b27\u6c0f\u7279\u5f81\uff0c\u63d0\u5347\u4f2a\u6807\u7b7e\u8d28\u91cf\u548c\u6a21\u7cca\u533a\u57df\u5224\u522b\u80fd\u529b\u3002\u540c\u65f6\u901a\u8fc7\u914d\u51c6\u4e0e\u5206\u5272\u68af\u5ea6\u805a\u5408\u8fdb\u884c\u7aef\u5230\u7aef\u8054\u5408\u4f18\u5316\uff0c\u5728\u4e24\u4e2a\u89e3\u5256\u533a\u57df\u548c\u591a\u79cd\u8bbe\u7f6e\u4e0b\u63d0\u5347\u4e86\u914d\u51c6\u4e0e\u5206\u5272\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advancements in deep reinforcement learning have increasingly favored simplified, highly parallelized paradigms. Notably, the Parallelized Q-Network (PQN) algorithm achieves stable off-policy learning without relying on computationally expensive replay buffers or target networks. However, the representational capacity and parameter efficiency of visual encoders operating in these buffer-free settings remain underexplored. In this work, we systematically investigate the architectural design space of Convolutional Neural Networks for PQN. We design and rigorously evaluate eight distinct CNN topologies, optimizing for sample efficiency under strict parameter constraints. Furthermore, we study the impact of representation and value estimation enhancements by integrating the Hadamax encoding paradigm and advanced Q-learning extensions, including distributional, ensemble, and dueling heads. Extensive experiments on the Atari-57 benchmark demonstrate that our proposed composite architecture, Aftab, achieves an Interquartile Mean (IQM) Human-Normalized Score of 6.479, establishing a 0.86 Probability of Improvement over the standard PQN baseline. Additionally, structural resilience evaluations on the highly non-stationary Procgen Hard benchmark confirm out-of-distribution generalization, with Aftab yielding an IQM Procgen Normalized Score of 0.418 compared to the baseline\u0027s 0.382. Ultimately, this work establishes an efficient, probabilistically superior structural reference for model-free reinforcement learning, all while preserving the simplicity and memory efficiency of unbuffered, parallelized optimization. The complete Aftab framework, including all model definitions, training configurations, and raw experimental logs, is open-sourced and available on our GitHub repository: https://github.com/tahashieenavaz/aftab", "arxiv_id": "2608.07335", "arxiv_url": "https://arxiv.org/abs/2608.07335", "authors": ["Taha Shieenavaz", "Shabnam Zareshahraki", "Loris Nanni"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86\u65e0\u56de\u653e\u3001\u65e0\u76ee\u6807\u7f51\u7edc\u7684\u5e76\u884c\u5316 Q-Network \u4e2d\u591a\u79cd CNN \u7f16\u7801\u5668\u8bbe\u8ba1\uff0c\u5e76\u7ed3\u5408 Hadamax \u7f16\u7801\u3001\u5206\u5e03\u5f0f/\u96c6\u6210/dueling \u7b49\u4ef7\u503c\u51fd\u6570\u5934\u63d0\u51fa\u590d\u5408\u67b6\u6784 Aftab\u3002\u5728 Atari-57 \u4e0a\u76f8\u5bf9\u6807\u51c6 PQN \u663e\u8457\u63d0\u5347\uff0cIQM \u4eba\u7c7b\u5f52\u4e00\u5316\u5f97\u5206\u8fbe 6.479\uff1b\u5728 Procgen Hard \u4e0a\u4e5f\u8868\u73b0\u51fa\u66f4\u597d\u7684\u5206\u5e03\u5916\u6cdb\u5316\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07335", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "Q\u5b66\u4e60", "\u89c6\u89c9\u7f16\u7801\u5668", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07335v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Aftab: A Comprehensive Benchmark of CNN Encoders and Advanced Value Functions in Parallelized Q-Networks", "tldr": "\u672c\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e86\u65e0\u56de\u653e\u3001\u65e0\u76ee\u6807\u7f51\u7edc\u7684\u5e76\u884c\u5316 Q-Network \u4e2d\u591a\u79cd CNN \u7f16\u7801\u5668\u8bbe\u8ba1\uff0c\u5e76\u7ed3\u5408 Hadamax \u7f16\u7801\u3001\u5206\u5e03\u5f0f/\u96c6\u6210/dueling \u7b49\u4ef7\u503c\u51fd\u6570\u5934\u63d0\u51fa\u590d\u5408\u67b6\u6784 Aftab\u3002\u5728 Atari-57 \u4e0a\u76f8\u5bf9\u6807\u51c6 PQN \u663e\u8457\u63d0\u5347\uff0cIQM \u4eba\u7c7b\u5f52\u4e00\u5316\u5f97\u5206\u8fbe 6.479\uff1b\u5728 Procgen Hard \u4e0a\u4e5f\u8868\u73b0\u51fa\u66f4\u597d\u7684\u5206\u5e03\u5916\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The AI-Native Manifesto envisions large-scale agile software development in which humans increasingly govern intent, risk, and exceptions while agents execute more of the engineering process. Realizing that end-state requires more than better code generation: it requires assurance closure, meaning that the system can establish what must be true, determine and obtain appropriate evidence, judge the credibility of that evidence, preserve its validity through change, and use the resulting uncertainty to bound agent authority. Existing work already provides many of the necessary mechanisms across formal methods, testing, simulation, assurance cases, digital twins, and runtime assurance. We identify six residual gaps in making the surrounding assurance reasoning sufficiently machine-operable, propose a high-level architecture with six corresponding capabilities built on a shared semantic assurance layer, and formulate four research questions to turn that architecture into dependable, human-on-the-loop, AI-native R\u0026D.", "arxiv_id": "2608.07317", "arxiv_url": "https://arxiv.org/abs/2608.07317", "authors": ["Ricardo Britto"], "brief": "\u8bba\u6587\u63d0\u51fa\u5728 AI \u539f\u751f\u7684\u5927\u89c4\u6a21\u654f\u6377\u8f6f\u4ef6\u5f00\u53d1\u4e2d\uff0c\u4ec5\u6709\u4ee3\u7801\u751f\u6210\u4e0d\u591f\uff0c\u8fd8\u9700\u8981\u201c\u4fdd\u8bc1\u95ed\u73af\u201d\u6765\u660e\u786e\u9700\u6c42\u3001\u6536\u96c6\u548c\u8bc4\u4f30\u8bc1\u636e\u3001\u5728\u53d8\u66f4\u4e2d\u4fdd\u6301\u6709\u6548\u6027\uff0c\u5e76\u636e\u6b64\u7ea6\u675f\u667a\u80fd\u4f53\u6743\u9650\u3002\u4f5c\u8005\u603b\u7ed3\u73b0\u6709\u5f62\u5f0f\u5316\u65b9\u6cd5\u3001\u6d4b\u8bd5\u3001\u4eff\u771f\u3001\u4fdd\u8bc1\u6848\u4f8b\u7b49\u57fa\u7840\u4e0a\u7684\u516d\u4e2a\u7f3a\u53e3\uff0c\u63d0\u51fa\u57fa\u4e8e\u5171\u4eab\u8bed\u4e49\u4fdd\u8bc1\u5c42\u7684\u9ad8\u5c42\u67b6\u6784\u548c\u7814\u7a76\u95ee\u9898\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07317", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u53ef\u4fe1AI", "\u5f62\u5f0f\u5316\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07317v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards Assurance Closure in AI-Native Large-Scale Agile Software Development", "tldr": "\u8bba\u6587\u63d0\u51fa\u5728 AI \u539f\u751f\u7684\u5927\u89c4\u6a21\u654f\u6377\u8f6f\u4ef6\u5f00\u53d1\u4e2d\uff0c\u4ec5\u6709\u4ee3\u7801\u751f\u6210\u4e0d\u591f\uff0c\u8fd8\u9700\u8981\u201c\u4fdd\u8bc1\u95ed\u73af\u201d\u6765\u660e\u786e\u9700\u6c42\u3001\u6536\u96c6\u548c\u8bc4\u4f30\u8bc1\u636e\u3001\u5728\u53d8\u66f4\u4e2d\u4fdd\u6301\u6709\u6548\u6027\uff0c\u5e76\u636e\u6b64\u7ea6\u675f\u667a\u80fd\u4f53\u6743\u9650\u3002\u4f5c\u8005\u603b\u7ed3\u73b0\u6709\u5f62\u5f0f\u5316\u65b9\u6cd5\u3001\u6d4b\u8bd5\u3001\u4eff\u771f\u3001\u4fdd\u8bc1\u6848\u4f8b\u7b49\u57fa\u7840\u4e0a\u7684\u516d\u4e2a\u7f3a\u53e3\uff0c\u63d0\u51fa\u57fa\u4e8e\u5171\u4eab\u8bed\u4e49\u4fdd\u8bc1\u5c42\u7684\u9ad8\u5c42\u67b6\u6784\u548c\u7814\u7a76\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Natural Language Processing (NLP) models predicting mental health outcomes rarely specify what they measure: contextual knowledge, emotional content, or syntactic structure. NLP Psychometrics treats psychological prediction from text as a psychometric problem, linking scores to interpretable linguistic evidence and testing beyond the training text format. Nine LLMs, conditioned on controlled personas (cognitive digital shadows), completed psychometric questionnaires with textual explanations per item. We extracted emotional profiles and syntactic-semantic structure via textual forma mentis networks, combined with personality and sociodemographic variables in ablated random forest (RF) regressors, using SHAP to identify which features drove performance and in which direction. Full RF models explained up to 70.8% of variance in life satisfaction (SWLS), 55.7% in depression (PHQ-9), and, for DASS-21, 68.5% depression, 76.0% anxiety, 72.4% stress. Sociodemographics alone explained no meaningful variance in depression, anxiety, or stress, but did so for life satisfaction, where emotion features and income were the strongest predictors; neuroticism and network topology instead dominated depression and anxiety, reversing direction between them. Without retraining, RF models separated diaries from low- and high-score personas ($r$ up to 0.91) and, using only network/emotion features, classified clinical from control participants in real transcripts with up to 68% accuracy. These results show the promise and limits of synthetic data: LLM personas can expose model biases, recover patterns consistent with clinical rumination, and support psychometric prediction from human text without a matched questionnaire, but cannot substitute for human validation. NLP Psychometrics makes these distinctions explicit, measurable, and testable through interpretable AI and network/emotional features.", "arxiv_id": "2608.07316", "arxiv_url": "https://arxiv.org/abs/2608.07316", "authors": ["Edoardo Sebastiano De Duro", "Emma Franchino", "Massimo Stella"], "brief": "\u8bba\u6587\u63d0\u51fa\u201cNLP\u5fc3\u7406\u6d4b\u91cf\u5b66\u201d\uff0c\u628a\u4ece\u6587\u672c\u9884\u6d4b\u5fc3\u7406\u5065\u5eb7\u7ed3\u679c\u89c6\u4e3a\u5fc3\u7406\u6d4b\u91cf\u95ee\u9898\uff0c\u7528\u53ef\u89e3\u91ca\u7684\u60c5\u7eea\u7279\u5f81\u3001\u53e5\u6cd5\u8bed\u4e49\u7f51\u7edc\u3001\u4eba\u683c\u4e0e\u4eba\u53e3\u7edf\u8ba1\u53d8\u91cf\u6765\u89e3\u91ca\u9884\u6d4b\u4f9d\u636e\u3002\u57fa\u4e8e9\u4e2aLLM\u63a7\u5236\u4eba\u683c\u751f\u6210\u7684\u6570\u636e\uff0c\u968f\u673a\u68ee\u6797\u53ef\u89e3\u91ca\u591a\u9879\u5fc3\u7406\u91cf\u8868\u8f83\u9ad8\u65b9\u5dee\uff0c\u5e76\u80fd\u5728\u65e5\u8bb0\u548c\u771f\u5b9e\u8bbf\u8c08\u4e0a\u8fdb\u884c\u4e00\u5b9a\u7a0b\u5ea6\u8fc1\u79fb\uff0c\u4f46\u4f5c\u8005\u5f3a\u8c03\u5408\u6210\u6570\u636e\u53ea\u80fd\u8f85\u52a9\u53d1\u73b0\u504f\u5dee\u4e0e\u6a21\u5f0f\uff0c\u4e0d\u80fd\u66ff\u4ee3\u771f\u4eba\u9a8c\u8bc1\u3002", "categories": ["cs.CL", "cs.AI", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07316", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u7136\u8bed\u8a00\u5904\u7406", "\u5fc3\u7406\u6d4b\u91cf", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91caAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07316v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Natural Language Processing Psychometrics", "tldr": "\u8bba\u6587\u63d0\u51fa\u201cNLP\u5fc3\u7406\u6d4b\u91cf\u5b66\u201d\uff0c\u628a\u4ece\u6587\u672c\u9884\u6d4b\u5fc3\u7406\u5065\u5eb7\u7ed3\u679c\u89c6\u4e3a\u5fc3\u7406\u6d4b\u91cf\u95ee\u9898\uff0c\u7528\u53ef\u89e3\u91ca\u7684\u60c5\u7eea\u7279\u5f81\u3001\u53e5\u6cd5\u8bed\u4e49\u7f51\u7edc\u3001\u4eba\u683c\u4e0e\u4eba\u53e3\u7edf\u8ba1\u53d8\u91cf\u6765\u89e3\u91ca\u9884\u6d4b\u4f9d\u636e\u3002\u57fa\u4e8e9\u4e2aLLM\u63a7\u5236\u4eba\u683c\u751f\u6210\u7684\u6570\u636e\uff0c\u968f\u673a\u68ee\u6797\u53ef\u89e3\u91ca\u591a\u9879\u5fc3\u7406\u91cf\u8868\u8f83\u9ad8\u65b9\u5dee\uff0c\u5e76\u80fd\u5728\u65e5\u8bb0\u548c\u771f\u5b9e\u8bbf\u8c08\u4e0a\u8fdb\u884c\u4e00\u5b9a\u7a0b\u5ea6\u8fc1\u79fb\uff0c\u4f46\u4f5c\u8005\u5f3a\u8c03\u5408\u6210\u6570\u636e\u53ea\u80fd\u8f85\u52a9\u53d1\u73b0\u504f\u5dee\u4e0e\u6a21\u5f0f\uff0c\u4e0d\u80fd\u66ff\u4ee3\u771f\u4eba\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Comparisons between AutoML systems at short time budgets -- tens of seconds rather than hours -- are common in tool READMEs and workshop papers, and they are easy to get wrong. We report a case study in which a simple AutoML engine, Orcetra, appeared to beat FLAML and AutoGluon on 513 OpenML datasets, winning 57.1% of them at a nominal 60-second budget and 78.4% of datasets against FLAML alone at 30 seconds. Both margins came from protocol defects that a results table cannot show. The search loop scored every candidate on the test split and reported the best, making the headline metric a maximum over dozens of noisy estimates while the baselines selected on training data and touched the test set once; and the budget was checked before launching a candidate but never enforced during one, so the system consumed a median of 120 s against a 60-second budget, 2.24x the wall-clock AutoGluon used. Re-running with selection moved to a validation split, the deadline enforced externally and every framework pinned to an equal share of the machine, Orcetra\u0027s win rate on the re-run subset falls from 59.4% to 34.3% and no pairwise difference against either competitor remains significant. Recording both estimands inside a single search lets us attribute the collapse: the selection rule accounts for 4.8 percentage points and unequal compute for most of the rest. The same traces give the selection bias as a function of budget, measured rather than assumed: it grows with $K$ but reaches only 0.27 accuracy points, about five times below the $\u03c3\\sqrt{2\\ln K}$ bound a marginal-standard-error argument predicts, because candidates scored on shared test rows cancel most of the noise. We close with a checklist for short-budget comparisons. Code, per-dataset results and the scripts that regenerate every number and figure in the paper are released with it.", "arxiv_id": "2608.07303", "arxiv_url": "https://arxiv.org/abs/2608.07303", "authors": ["Guilin Zhang", "Kai Zhao"], "brief": "\u8bba\u6587\u590d\u76d8\u4e86\u4e00\u4e2a\u77ed\u65f6\u95f4\u9884\u7b97 AutoML \u5bf9\u6bd4\u6848\u4f8b\uff0c\u53d1\u73b0 Orcetra \u8868\u9762\u4e0a\u4f18\u4e8e FLAML \u548c AutoGluon\uff0c\u4e3b\u8981\u6e90\u4e8e\u6d4b\u8bd5\u96c6\u88ab\u7528\u4e8e\u6a21\u578b\u9009\u62e9\u4ee5\u53ca\u65f6\u95f4\u9884\u7b97\u672a\u88ab\u4e25\u683c\u6267\u884c\u3002\u4fee\u6b63\u4e3a\u9a8c\u8bc1\u96c6\u9009\u62e9\u3001\u5916\u90e8\u5f3a\u5236\u622a\u6b62\u65f6\u95f4\u5e76\u516c\u5e73\u5206\u914d\u7b97\u529b\u540e\uff0cOrcetra \u80dc\u7387\u4ece\u7ea659.4%\u964d\u81f334.3%\uff0c\u4e0e\u7ade\u4e89\u65b9\u6cd5\u4e0d\u518d\u6709\u663e\u8457\u5dee\u5f02\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u91cf\u5316\u4e86\u6d4b\u8bd5\u96c6\u9009\u62e9\u504f\u5dee\u968f\u9884\u7b97\u53d8\u5316\u7684\u5f71\u54cd\uff0c\u5e76\u7ed9\u51fa\u77ed\u9884\u7b97 AutoML \u8bc4\u6d4b\u6e05\u5355\u3002", "categories": ["cs.AI", "cs.LG", "math.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07303", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u673a\u5668\u5b66\u4e60", "\u6a21\u578b\u8bc4\u6d4b", "\u7edf\u8ba1\u504f\u5dee", "\u5b9e\u9a8c\u534f\u8bae"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07303v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Winning by Peeking: Unenforced Budgets and Test-Set Selection Inflate Short-Budget AutoML Comparisons", "tldr": "\u8bba\u6587\u590d\u76d8\u4e86\u4e00\u4e2a\u77ed\u65f6\u95f4\u9884\u7b97 AutoML \u5bf9\u6bd4\u6848\u4f8b\uff0c\u53d1\u73b0 Orcetra \u8868\u9762\u4e0a\u4f18\u4e8e FLAML \u548c AutoGluon\uff0c\u4e3b\u8981\u6e90\u4e8e\u6d4b\u8bd5\u96c6\u88ab\u7528\u4e8e\u6a21\u578b\u9009\u62e9\u4ee5\u53ca\u65f6\u95f4\u9884\u7b97\u672a\u88ab\u4e25\u683c\u6267\u884c\u3002\u4fee\u6b63\u4e3a\u9a8c\u8bc1\u96c6\u9009\u62e9\u3001\u5916\u90e8\u5f3a\u5236\u622a\u6b62\u65f6\u95f4\u5e76\u516c\u5e73\u5206\u914d\u7b97\u529b\u540e\uff0cOrcetra \u80dc\u7387\u4ece\u7ea659.4%\u964d\u81f334.3%\uff0c\u4e0e\u7ade\u4e89\u65b9\u6cd5\u4e0d\u518d\u6709\u663e\u8457\u5dee\u5f02\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u91cf\u5316\u4e86\u6d4b\u8bd5\u96c6\u9009\u62e9\u504f\u5dee\u968f\u9884\u7b97\u53d8\u5316\u7684\u5f71\u54cd\uff0c\u5e76\u7ed9\u51fa\u77ed\u9884\u7b97 AutoML \u8bc4\u6d4b\u6e05\u5355\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Vision-Language Models (LVLMs) often suffer from object hallucination, generating objects that are absent from the image. Prior work largely attributes this to insufficient visual attention. However, we find that both real and hallucinated objects receive equally strong visual attention in the model\u0027s mid-to-late layers, suggesting that the key issue may not be how much the model attends, but what it attends to and why. To this end, we decode the visual features of high-attention regions using Logit Lens, and observe that regions corresponding to real objects can be correctly decoded to the target object tokens, whereas those for hallucinated objects cannot. Building on this, we identify two hallucination mechanisms: (i) visual uncertainty, triggered by semantically similar or confusable regions; masking these regions eliminates the hallucination. (ii) contextual prior, triggered by strong co-occurrence priors; even when the initially attended region is masked, the hallucination persists and attention drifts to other regions. Based on these findings, we propose a simple yet effective training-free Detect-Mitigate framework comprising a Logit-Lens Consistency Check to detect hallucination and targeted remedies: High-Attention Regions Masking (HARM) for visual uncertainty hallucination, and Visual Evidence Enhanced Decoding (VEED) for contextual prior hallucination. Our approach achieves state-of-the-art results on multiple hallucination benchmarks. Code will be available.", "arxiv_id": "2608.07302", "arxiv_url": "https://arxiv.org/abs/2608.07302", "authors": ["Zichuan Wang", "Songlin Yang", "Bo Peng", "Zhenchen Tang", "Yang Li", "Beibei Dong", "Jing Dong"], "brief": "\u8bba\u6587\u53d1\u73b0 LVLM \u7684\u7269\u4f53\u5e7b\u89c9\u5e76\u975e\u7b80\u5355\u6e90\u4e8e\u89c6\u89c9\u6ce8\u610f\u529b\u4e0d\u8db3\uff1a\u771f\u5b9e\u7269\u4f53\u548c\u5e7b\u89c9\u7269\u4f53\u5728\u4e2d\u540e\u5c42\u90fd\u53ef\u80fd\u83b7\u5f97\u9ad8\u6ce8\u610f\u529b\uff0c\u4f46\u7528 Logit Lens \u89e3\u7801\u9ad8\u6ce8\u610f\u529b\u533a\u57df\u65f6\uff0c\u53ea\u6709\u771f\u5b9e\u7269\u4f53\u80fd\u4e0e\u76ee\u6807\u8bcd\u4e00\u81f4\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u68c0\u6d4b-\u7f13\u89e3\u6846\u67b6\uff0c\u901a\u8fc7\u4e00\u81f4\u6027\u68c0\u67e5\u8bc6\u522b\u5e7b\u89c9\uff0c\u5e76\u5206\u522b\u7528\u533a\u57df\u906e\u853d\u548c\u89c6\u89c9\u8bc1\u636e\u589e\u5f3a\u89e3\u7801\u5904\u7406\u89c6\u89c9\u4e0d\u786e\u5b9a\u6027\u4e0e\u4e0a\u4e0b\u6587\u5148\u9a8c\u5bfc\u81f4\u7684\u5e7b\u89c9\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f73\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07302", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9\u68c0\u6d4b", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07302v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Same Attention, Different Truths: Put Logit-Lens over Visual Attention to Detect and Mitigate LVLM Object Hallucination", "tldr": "\u8bba\u6587\u53d1\u73b0 LVLM \u7684\u7269\u4f53\u5e7b\u89c9\u5e76\u975e\u7b80\u5355\u6e90\u4e8e\u89c6\u89c9\u6ce8\u610f\u529b\u4e0d\u8db3\uff1a\u771f\u5b9e\u7269\u4f53\u548c\u5e7b\u89c9\u7269\u4f53\u5728\u4e2d\u540e\u5c42\u90fd\u53ef\u80fd\u83b7\u5f97\u9ad8\u6ce8\u610f\u529b\uff0c\u4f46\u7528 Logit Lens \u89e3\u7801\u9ad8\u6ce8\u610f\u529b\u533a\u57df\u65f6\uff0c\u53ea\u6709\u771f\u5b9e\u7269\u4f53\u80fd\u4e0e\u76ee\u6807\u8bcd\u4e00\u81f4\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u68c0\u6d4b-\u7f13\u89e3\u6846\u67b6\uff0c\u901a\u8fc7\u4e00\u81f4\u6027\u68c0\u67e5\u8bc6\u522b\u5e7b\u89c9\uff0c\u5e76\u5206\u522b\u7528\u533a\u57df\u906e\u853d\u548c\u89c6\u89c9\u8bc1\u636e\u589e\u5f3a\u89e3\u7801\u5904\u7406\u89c6\u89c9\u4e0d\u786e\u5b9a\u6027\u4e0e\u4e0a\u4e0b\u6587\u5148\u9a8c\u5bfc\u81f4\u7684\u5e7b\u89c9\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f73\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Radiology reports describe clinical observations but do not specify executable segmentation targets. They may contain present, negated, prior,uncertain, or irrelevant findings, while multiple valid abnormalities may coexist. Existing segmentation methods largely bypass this ambiguity by receiving a target identity or spatial prompt before inference, which acts as a hidden target oracle. We study report-grounded abnormality segmentation, where a model must determine target eligibility, cardinality, and finding-to-mask correspondence directly from an unfiltered report before delineating the corresponding regions. We propose \\textbf{EliSeg}, an atcor--verify--revise framework that integrates target construction with mask generation. A grammar-constrained Actor proposes target slots and masks, an independent text-only Verifier reconstructs the eligible finding inventory, and Revision selectively re-executes the shared Actor when their target structures disagree. EliSeg requires no predefined target identity, finding prompt, point, or bounding box. Experiments on MIMIC-CXR-ILS show that EliSeg consistently outperforms direct segmentation methods and extract-then-segment cascades across findings, while effectively suppressing masks for ineligible report mentions. Ablation studies confirm the complementary roles of verification and revision, and evaluation on CheXlocalize demonstrates effective transfer of the EliSeg to an external dataset.Code is available at https://github.com/Maybach-dream/EliSeg.", "arxiv_id": "2608.07299", "arxiv_url": "https://arxiv.org/abs/2608.07299", "authors": ["Chengyi Peng", "Haoyu Yang", "Meixing Shi", "Yuxiang Cai", "Yankai Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa\u62a5\u544a\u9a71\u52a8\u7684\u5f02\u5e38\u5206\u5272\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u76f4\u63a5\u4ece\u672a\u8fc7\u6ee4\u7684\u653e\u5c04\u62a5\u544a\u4e2d\u5224\u65ad\u54ea\u4e9b\u53d1\u73b0\u9700\u8981\u5206\u5272\u3001\u6570\u91cf\u662f\u591a\u5c11\uff0c\u5e76\u751f\u6210\u5bf9\u5e94\u63a9\u7801\u3002EliSeg \u91c7\u7528\u201cActor \u751f\u6210\u2014Verifier \u9a8c\u8bc1\u2014Revision \u4fee\u6b63\u201d\u6846\u67b6\uff0c\u65e0\u9700\u9884\u8bbe\u76ee\u6807\u3001\u63d0\u793a\u70b9\u6216\u6846\uff0c\u5728 MIMIC-CXR-ILS \u4e0a\u4f18\u4e8e\u76f4\u63a5\u5206\u5272\u548c\u62bd\u53d6\u540e\u5206\u5272\u65b9\u6cd5\uff0c\u5e76\u80fd\u6291\u5236\u4e0d\u5408\u683c\u62a5\u544a\u63d0\u53ca\u7684\u4f2a\u63a9\u7801\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07299", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u5f02\u5e38\u5206\u5272", "\u89c6\u89c9\u8bed\u8a00", "\u53ef\u9a8c\u8bc1\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07299v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EliSeg: Verified Target Construction for Report-Grounded Abnormality Segmentation", "tldr": "\u8bba\u6587\u63d0\u51fa\u62a5\u544a\u9a71\u52a8\u7684\u5f02\u5e38\u5206\u5272\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u76f4\u63a5\u4ece\u672a\u8fc7\u6ee4\u7684\u653e\u5c04\u62a5\u544a\u4e2d\u5224\u65ad\u54ea\u4e9b\u53d1\u73b0\u9700\u8981\u5206\u5272\u3001\u6570\u91cf\u662f\u591a\u5c11\uff0c\u5e76\u751f\u6210\u5bf9\u5e94\u63a9\u7801\u3002EliSeg \u91c7\u7528\u201cActor \u751f\u6210\u2014Verifier \u9a8c\u8bc1\u2014Revision \u4fee\u6b63\u201d\u6846\u67b6\uff0c\u65e0\u9700\u9884\u8bbe\u76ee\u6807\u3001\u63d0\u793a\u70b9\u6216\u6846\uff0c\u5728 MIMIC-CXR-ILS \u4e0a\u4f18\u4e8e\u76f4\u63a5\u5206\u5272\u548c\u62bd\u53d6\u540e\u5206\u5272\u65b9\u6cd5\uff0c\u5e76\u80fd\u6291\u5236\u4e0d\u5408\u683c\u62a5\u544a\u63d0\u53ca\u7684\u4f2a\u63a9\u7801\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generating mixed-type tabular data requires jointly modeling diverse feature distributions and their complex cross-column dependencies. Variational flow matching handles distinct endpoints via factorized distributions, yet leaves feature-specific processing and cross-column interactions implicit within a shared backbone. We introduce Feature-wise Unified Specialization with cross-column Exchange (FUSE) to explicitly separate these roles. FUSE applies separate adaptive mixture modules to numerical and categorical features, allowing each feature to combine shared specialized subnetworks, while joint attention preserves information exchange across all columns. We also characterize the excess population risk from restricted conditioning contexts and bound the continuous Wasserstein generation error by endpoint-prediction risk. Comprehensive experiments on eight tabular datasets demonstrate that FUSE achieves strong and consistent performance across distributional fidelity and downstream utility metrics.", "arxiv_id": "2608.07294", "arxiv_url": "https://arxiv.org/abs/2608.07294", "authors": ["Suman Cha", "Seongchan Lee", "Dohyun Ko", "Hyunjoong Kim"], "brief": "\u672c\u6587\u63d0\u51fa FUSE\uff0c\u7528\u4e8e\u6df7\u5408\u7c7b\u578b\u8868\u683c\u6570\u636e\u751f\u6210\u7684\u6d41\u5339\u914d\u6a21\u578b\uff0c\u5c06\u6570\u503c\u4e0e\u7c7b\u522b\u7279\u5f81\u7684\u7279\u5b9a\u5904\u7406\u548c\u8de8\u5217\u4f9d\u8d56\u5efa\u6a21\u663e\u5f0f\u89e3\u8026\u3002\u65b9\u6cd5\u901a\u8fc7\u7279\u5f81\u7ea7\u81ea\u9002\u5e94\u6df7\u5408\u6a21\u5757\u5904\u7406\u4e0d\u540c\u5217\uff0c\u5e76\u7528\u8054\u5408\u6ce8\u610f\u529b\u8fdb\u884c\u8de8\u5217\u4fe1\u606f\u4ea4\u6362\uff1b\u5728 8 \u4e2a\u8868\u683c\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u4e86\u7a33\u5b9a\u7684\u5206\u5e03\u4fdd\u771f\u5ea6\u548c\u4e0b\u6e38\u4efb\u52a1\u6548\u679c\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07294", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u683c\u751f\u6210", "\u6d41\u5339\u914d", "\u6ce8\u610f\u529b\u673a\u5236", "\u6df7\u5408\u7c7b\u578b\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07294v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FUSE: Feature-Wise Unified Specialization with Cross-Column Exchange for Mixed-Type Tabular Flow Matching", "tldr": "\u672c\u6587\u63d0\u51fa FUSE\uff0c\u7528\u4e8e\u6df7\u5408\u7c7b\u578b\u8868\u683c\u6570\u636e\u751f\u6210\u7684\u6d41\u5339\u914d\u6a21\u578b\uff0c\u5c06\u6570\u503c\u4e0e\u7c7b\u522b\u7279\u5f81\u7684\u7279\u5b9a\u5904\u7406\u548c\u8de8\u5217\u4f9d\u8d56\u5efa\u6a21\u663e\u5f0f\u89e3\u8026\u3002\u65b9\u6cd5\u901a\u8fc7\u7279\u5f81\u7ea7\u81ea\u9002\u5e94\u6df7\u5408\u6a21\u5757\u5904\u7406\u4e0d\u540c\u5217\uff0c\u5e76\u7528\u8054\u5408\u6ce8\u610f\u529b\u8fdb\u884c\u8de8\u5217\u4fe1\u606f\u4ea4\u6362\uff1b\u5728 8 \u4e2a\u8868\u683c\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u4e86\u7a33\u5b9a\u7684\u5206\u5e03\u4fdd\u771f\u5ea6\u548c\u4e0b\u6e38\u4efb\u52a1\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI-generated music is increasingly used at the stem level, with producers integrating synthetic drums, basslines, or vocals alongside human-performed instruments. However, current AI music detection systems are binary, treating tracks as either fully AI or fully human. In this paper, we reformulate AI music detection as a regression problem on a continuous AI energy ratio, alpha in [0, 1]. We propose a methodology that leverages a multi-track music dataset to assemble mixtures of human-performed and AI-reconstructed stems (obtained using a neural audio codec) with known proportions of each content type. Using this approach, we first show that a CNN-based model trained on fully AI-generated or human-performed tracks, which achieves \u003e99% accuracy as a binary detector, when faced with mixed content, yields an output that rises with the AI stems\u0027 energy contribution, acting as a noisy and miscalibrated estimator. Our analysis of the influence of different stems shows that detection sensitivity depends on the instrument and reflects its frequency content: drums and guitar carry strong codec-artifact signatures, while vocals and bass are less detectable. Based on these insights, we train a similar CNN-based model for regression of alpha, achieving MAE = 0.076 and R^2 = 0.85 on held-out mixtures from the same pipeline. These results suggest that the regression formulation is an initial promising step towards AI-music detection in realistic music production workflows.", "arxiv_id": "2608.07285", "arxiv_url": "https://arxiv.org/abs/2608.07285", "authors": ["Fernando Garcia de la Cruz", "David L\u00f3pez-Ayala", "Pablo Zinemanas", "Emilio Molina", "Mart\u00edn Rocamora"], "brief": "\u672c\u6587\u5c06 AI \u97f3\u4e50\u68c0\u6d4b\u4ece\u4e8c\u5206\u7c7b\u6539\u4e3a\u8fde\u7eed\u6bd4\u4f8b\u56de\u5f52\uff0c\u4f30\u8ba1\u6df7\u5408\u97f3\u4e50\u4e2d AI \u751f\u6210\u97f3\u8f68\u7684\u80fd\u91cf\u5360\u6bd4\u3002\u4f5c\u8005\u7528\u4eba\u7c7b\u6f14\u594f stems \u4e0e\u795e\u7ecf\u97f3\u9891 codec \u91cd\u5efa stems \u6784\u9020\u53ef\u63a7\u6df7\u5408\u6570\u636e\uff0c\u53d1\u73b0\u4f20\u7edf\u4e8c\u5206\u7c7b\u68c0\u6d4b\u5668\u5728\u6df7\u5408\u5185\u5bb9\u4e0a\u53ef\u7c97\u7565\u53cd\u6620 AI \u5360\u6bd4\u4f46\u6821\u51c6\u8f83\u5dee\uff1b\u8bad\u7ec3\u56de\u5f52 CNN \u540e\u8fbe\u5230 MAE 0.076\u3001R\u00b2 0.85\u3002", "categories": ["eess.AS", "cs.AI", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07285", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u9891\u68c0\u6d4b", "\u751f\u6210\u5f0fAI", "\u97f3\u4e50\u5904\u7406", "\u56de\u5f52\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07285v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Much AI Is in This Track? Quantifying the Proportion of AI-Generated Stems in Hybrid Music Mixtures", "tldr": "\u672c\u6587\u5c06 AI \u97f3\u4e50\u68c0\u6d4b\u4ece\u4e8c\u5206\u7c7b\u6539\u4e3a\u8fde\u7eed\u6bd4\u4f8b\u56de\u5f52\uff0c\u4f30\u8ba1\u6df7\u5408\u97f3\u4e50\u4e2d AI \u751f\u6210\u97f3\u8f68\u7684\u80fd\u91cf\u5360\u6bd4\u3002\u4f5c\u8005\u7528\u4eba\u7c7b\u6f14\u594f stems \u4e0e\u795e\u7ecf\u97f3\u9891 codec \u91cd\u5efa stems \u6784\u9020\u53ef\u63a7\u6df7\u5408\u6570\u636e\uff0c\u53d1\u73b0\u4f20\u7edf\u4e8c\u5206\u7c7b\u68c0\u6d4b\u5668\u5728\u6df7\u5408\u5185\u5bb9\u4e0a\u53ef\u7c97\u7565\u53cd\u6620 AI \u5360\u6bd4\u4f46\u6821\u51c6\u8f83\u5dee\uff1b\u8bad\u7ec3\u56de\u5f52 CNN \u540e\u8fbe\u5230 MAE 0.076\u3001R\u00b2 0.85\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A group is an E-group if every element commutes with each of its endomorphic images. Caranti asked whether a finite E-group can have nilpotency class three. We prove that the $3$-group of order $3^{84}$ introduced by Abdollahi, Faghihi, and Mohammadi Hassanabadi, and later shown by Abdollahi, Faghihi, Linton, and O\u0027Brien to have the corresponding automorphism property, is an E-group. Let $P$ denote this group and put $V=P/\u03a6(P)\\cong \\mathbb{F}_3^9$. The nine power relations of $P$ determine a linear map $q:V\\longrightarrow\u039b^2 V$. We prove that $q$ has no nonzero proper subspace $U$ satisfying $q(U)\\subseteq\u039b^2 U$. Since the image induced by any endomorphism of $P$ on $V$ has precisely this closure property, every endomorphism acts on $V$ either invertibly or trivially. The invertible case is the known A-group case. In the trivial case the image first lies in $\u03a6(P)=P\u0027$, and the power relations then force it into $\u03a9_1(P\u0027)=Z(P)$. Thus every element commutes with every endomorphic image. The tensor rigidity is reduced to an exact finite calculation on the $9841$ points of $\\mathrm{PG}(8,3)$.", "arxiv_id": "2608.07275", "arxiv_url": "https://arxiv.org/abs/2608.07275", "authors": ["Xinan Dai", "Wenhao Deng", "Yidong Shi", "Tailin Wu", "Yuchen Yang"], "brief": "\u8bba\u6587\u8bc1\u660e\u4e86\u4e00\u4e2a\u9636\u4e3a 3^84\u3001\u5e42\u96f6\u7c7b\u4e3a\u4e09\u7684\u6709\u9650 3-\u7fa4\u786e\u5b9e\u662f E-\u7fa4\uff0c\u4ece\u800c\u56de\u7b54\u4e86 Caranti \u5173\u4e8e\u6709\u9650 E-\u7fa4\u662f\u5426\u53ef\u6709\u5e42\u96f6\u7c7b\u4e09\u7684\u95ee\u9898\u3002\u6838\u5fc3\u65b9\u6cd5\u662f\u5c06\u7fa4\u7684\u5e42\u5173\u7cfb\u8f6c\u5316\u4e3a\u6709\u9650\u57df\u4e0a\u7ebf\u6027\u6620\u5c04\u7684\u5f20\u91cf\u521a\u6027\u95ee\u9898\uff0c\u5e76\u901a\u8fc7\u5bf9\u5c04\u5f71\u7a7a\u95f4\u4e2d 9841 \u4e2a\u70b9\u7684\u7cbe\u786e\u6709\u9650\u8ba1\u7b97\u5b8c\u6210\u8bc1\u660e\u3002", "categories": ["math.GR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07275", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7fa4\u8bba", "\u6709\u9650\u7fa4", "\u5e42\u96f6\u7fa4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07275v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Finite E-Group of Nilpotency Class Three", "tldr": "\u8bba\u6587\u8bc1\u660e\u4e86\u4e00\u4e2a\u9636\u4e3a 3^84\u3001\u5e42\u96f6\u7c7b\u4e3a\u4e09\u7684\u6709\u9650 3-\u7fa4\u786e\u5b9e\u662f E-\u7fa4\uff0c\u4ece\u800c\u56de\u7b54\u4e86 Caranti \u5173\u4e8e\u6709\u9650 E-\u7fa4\u662f\u5426\u53ef\u6709\u5e42\u96f6\u7c7b\u4e09\u7684\u95ee\u9898\u3002\u6838\u5fc3\u65b9\u6cd5\u662f\u5c06\u7fa4\u7684\u5e42\u5173\u7cfb\u8f6c\u5316\u4e3a\u6709\u9650\u57df\u4e0a\u7ebf\u6027\u6620\u5c04\u7684\u5f20\u91cf\u521a\u6027\u95ee\u9898\uff0c\u5e76\u901a\u8fc7\u5bf9\u5c04\u5f71\u7a7a\u95f4\u4e2d 9841 \u4e2a\u70b9\u7684\u7cbe\u786e\u6709\u9650\u8ba1\u7b97\u5b8c\u6210\u8bc1\u660e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
