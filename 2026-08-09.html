 persistence. WorldTrace keeps compressed memory addressable by assigning each summary slot a distinct, in-distribution virtual position. Within this addressable cache, we study two memory compression approaches: WorldTrace-Field compresses history for temporal coherence, while WorldTrace-Landmark stores verbatim scene traces at detected transitions for episodic recall. We further introduce LoopBench, a benchmark evaluating whether a compressed cache can reconstruct a previously visited scene after a long detour. WorldTrace-Field improves temporal consistency by +15.5%, and WorldTrace-Landmark improves episodic recall by +19.5% on LoopBench, extending visually persistent generation without retraining.", "arxiv_id": "2608.07408", "arxiv_url": "https://arxiv.org/abs/2608.07408", "authors": ["Xindi Wu", "Sven Elflein", "James Lucas", "Olga Russakovsky", "Laura Leal-Taix\u00e9", "Despoina Paschalidou", "Jonathan Lorraine", "Aljo\u0161a O\u0161ep"], "brief": "\u8bba\u6587\u7814\u7a76\u4ea4\u4e92\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4e2d\u7684\u89c6\u89c9\u6301\u4e45\u6027\u95ee\u9898\uff0c\u53d1\u73b0\u957f\u5e8f\u5217\u751f\u6210\u65f6 RoPE \u4f4d\u7f6e\u8d85\u51fa\u8bad\u7ec3\u8303\u56f4\u4f1a\u5bfc\u81f4 KV \u7f13\u5b58\u96be\u4ee5\u88ab\u6b63\u786e\u5bfb\u5740\u3002\u4f5c\u8005\u63d0\u51fa WorldTrace\uff0c\u901a\u8fc7\u7ed9\u538b\u7f29\u8bb0\u5fc6\u5206\u914d\u5206\u5e03\u5185\u865a\u62df\u4f4d\u7f6e\uff0c\u4f7f\u957f\u7a0b\u538b\u7f29\u7f13\u5b58\u4ecd\u53ef\u53ef\u9760\u8bbf\u95ee\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07408", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u76f4\u63a5\u5728 RoPE \u65cb\u8f6c\u540e\u7684\u7a7a\u95f4\u538b\u7f29 KV \u7f13\u5b58\u4f1a\u6df7\u5408\u4e0d\u517c\u5bb9\u7684\u4f4d\u7f6e\u76f8\u4f4d\uff0c\u4ece\u800c\u7834\u574f\u89c6\u89c9\u8bb0\u5fc6\u3002", "\u63d0\u51fa\u4e24\u79cd\u514d\u8bad\u7ec3\u8bb0\u5fc6\u538b\u7f29\u65b9\u5f0f\uff1aWorldTrace-Field \u7528\u4e8e\u4fdd\u6301\u65f6\u95f4\u4e00\u81f4\u6027\uff0cWorldTrace-Landmark \u5728\u573a\u666f\u8f6c\u6298\u5904\u4fdd\u5b58\u539f\u59cb\u8f68\u8ff9\u4ee5\u652f\u6301\u60c5\u8282\u56de\u5fc6\u3002", "\u6784\u5efa LoopBench \u8bc4\u6d4b\u957f\u8ddd\u79bb\u7ed5\u884c\u540e\u80fd\u5426\u91cd\u5efa\u66fe\u8bbf\u95ee\u573a\u666f\uff1bWorldTrace-Field \u65f6\u95f4\u4e00\u81f4\u6027\u63d0\u5347 15.5%\uff0cWorldTrace-Landmark \u60c5\u8282\u56de\u5fc6\u63d0\u5347 19.5%\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u8bb0\u5fc6\u673a\u5236", "\u4f4d\u7f6e\u7f16\u7801"], "num_comments": 0, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2608.07408v1", "published_at": "2026-08-07", "score": 0.225, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07408.png", "title": "Addressable Memory for Video World Models", "tldr": "\u514d\u8bad\u7ec3\u63d0\u5347\u89c6\u9891\u4e16\u754c\u6a21\u578b\u957f\u7a0b\u89c6\u89c9\u8bb0\u5fc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u4ea4\u4e92\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4e2d\u7684\u89c6\u89c9\u6301\u4e45\u6027\u95ee\u9898\uff0c\u53d1\u73b0\u957f\u5e8f\u5217\u751f\u6210\u65f6 RoPE \u4f4d\u7f6e\u8d85\u51fa\u8bad\u7ec3\u8303\u56f4\u4f1a\u5bfc\u81f4 KV \u7f13\u5b58\u96be\u4ee5\u88ab\u6b63\u786e\u5bfb\u5740\u3002\u4f5c\u8005\u63d0\u51fa WorldTrace\uff0c\u901a\u8fc7\u7ed9\u538b\u7f29\u8bb0\u5fc6\u5206\u914d\u5206\u5e03\u5185\u865a\u62df\u4f4d\u7f6e\uff0c\u4f7f\u957f\u7a0b\u538b\u7f29\u7f13\u5b58\u4ecd\u53ef\u53ef\u9760\u8bbf\u95ee\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u89c6\u9891\u4e16\u754c\u6a21\u578b\u957f\u7a0b\u751f\u6210\u4e2d\u7684\u6838\u5fc3\u74f6\u9888\u2014\u2014\u53ef\u5bfb\u5740\u89c6\u89c9\u8bb0\u5fc6\uff0c\u63d0\u51fa\u65e0\u9700\u91cd\u8bad\u7ec3\u5373\u53ef\u6269\u5c55\u751f\u6210\u65f6\u957f\u7684\u65b9\u6cd5\uff0c\u5bf9\u4ea4\u4e92\u5f0f\u4eff\u771f\u3001\u6e38\u620f\u4e16\u754c\u6a21\u578b\u548c\u957f\u671f\u89c6\u9891\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Synthesizing a structured and editable 3D indoor scene from a few uncalibrated RGB views requires more than generating high-quality individual assets: a system must infer the room structure, associate objects across incomplete observations, and recover a globally consistent spatial configuration. Previous methods mainly focus on 3D scene generation with text input or require continuous visual inputs with additional priors, \\ e.g., human-annotated masks or accurate 3D layouts, which makes these methods labor demanding and hard to apply in general cases. We present \\textsc{Scenix}, a sparse-view 3D scene reconstruction framework via executable scene programs, a structured representation that can be directly instantiated into editable 3D scenes. Given sparse views, \\textsc{Scenix} predicts executable scene programs through perception-grounded asset instantiation and closed-loop spatial refinement. % We present \\method, a framework that predicts an executable scene representation from sparse views and realizes it through perception-grounded asset instantiation and closed-loop spatial refinement. To support this task, we construct \\dataset, a dataset of approximately 110,000 synthetic and real indoor scenes with multiview imagery, room structures, object-centric descriptions, and metric spatial annotations. We further introduce observation-consistent supervision that aligns each target scene with the visual evidence available in its input views. Experiments on held-out \\textsc{XScene} scenes, real indoor images, and out-of-distribution SpatialGen cases evaluate structured scene prediction, object grounding, and spatial refinement.", "arxiv_id": "2608.07012", "arxiv_url": "https://arxiv.org/abs/2608.07012", "authors": ["Kai Li", "Lutao Jiang", "Zhenyang Li", "Jiayu Dong", "Jierui Zhang", "Yingda Yin", "Runze Zhang", "Kai Yan", "Xiaoyang Huang", "Keyang Luo", "Xin Wang", "Xiangyu Zhao", "Weikai Chen"], "brief": "Scenix \u662f\u4e00\u4e2a\u4ece\u5c11\u91cf\u672a\u6807\u5b9a RGB \u89c6\u56fe\u91cd\u5efa\u7ed3\u6784\u5316\u3001\u53ef\u7f16\u8f91 3D \u5ba4\u5185\u573a\u666f\u7684\u6846\u67b6\u3002\u5b83\u9884\u6d4b\u53ef\u6267\u884c\u573a\u666f\u7a0b\u5e8f\uff0c\u5e76\u901a\u8fc7\u611f\u77e5\u9a71\u52a8\u7684\u8d44\u4ea7\u5b9e\u4f8b\u5316\u4e0e\u95ed\u73af\u7a7a\u95f4\u4f18\u5316\u751f\u6210\u5168\u5c40\u4e00\u81f4\u7684\u573a\u666f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07012", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u53ef\u6267\u884c\u573a\u666f\u7a0b\u5e8f\u4f5c\u4e3a\u4e2d\u95f4\u8868\u793a\uff0c\u53ef\u76f4\u63a5\u5b9e\u4f8b\u5316\u4e3a\u53ef\u7f16\u8f91\u7684 3D \u573a\u666f\u3002", "\u6784\u5efa\u7ea6 11 \u4e07\u4e2a\u5408\u6210\u4e0e\u771f\u5b9e\u5ba4\u5185\u573a\u666f\u6570\u636e\u96c6\uff0c\u5305\u542b\u591a\u89c6\u56fe\u56fe\u50cf\u3001\u623f\u95f4\u7ed3\u6784\u3001\u5bf9\u8c61\u63cf\u8ff0\u548c\u5ea6\u91cf\u7a7a\u95f4\u6807\u6ce8\u3002", "\u5f15\u5165 observation-consistent supervision\uff0c\u4f7f\u76ee\u6807\u573a\u666f\u4e0e\u8f93\u5165\u7a00\u758f\u89c6\u56fe\u4e2d\u7684\u53ef\u89c1\u8bc1\u636e\u5bf9\u9f50\uff0c\u5e76\u5728\u771f\u5b9e\u4e0e\u5206\u5e03\u5916\u573a\u666f\u4e0a\u9a8c\u8bc1\u3002"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u573a\u666f\u751f\u6210", "\u591a\u89c6\u56fe", "\u53ef\u7f16\u8f91\u8868\u793a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07012v1", "published_at": "2026-08-07", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Scenix: Sparse-View 3D Scene Reconstruction via Executable Scene Programs", "tldr": "\u7528\u53ef\u6267\u884c\u573a\u666f\u7a0b\u5e8f\u91cd\u5efa\u7a00\u758f\u89c6\u89d23D\u5ba4\u5185\u573a\u666f", "upvotes": 0, "what_it_is": "Scenix \u662f\u4e00\u4e2a\u4ece\u5c11\u91cf\u672a\u6807\u5b9a RGB \u89c6\u56fe\u91cd\u5efa\u7ed3\u6784\u5316\u3001\u53ef\u7f16\u8f91 3D \u5ba4\u5185\u573a\u666f\u7684\u6846\u67b6\u3002\u5b83\u9884\u6d4b\u53ef\u6267\u884c\u573a\u666f\u7a0b\u5e8f\uff0c\u5e76\u901a\u8fc7\u611f\u77e5\u9a71\u52a8\u7684\u8d44\u4ea7\u5b9e\u4f8b\u5316\u4e0e\u95ed\u73af\u7a7a\u95f4\u4f18\u5316\u751f\u6210\u5168\u5c40\u4e00\u81f4\u7684\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u66f4\u73b0\u5b9e\u7684\u7a00\u758f\u3001\u672a\u6807\u5b9a\u56fe\u50cf\u8f93\u5165\uff0c\u51cf\u5c11\u5bf9\u4eba\u5de5\u63a9\u7801\u3001\u7cbe\u786e\u5e03\u5c40\u6216\u8fde\u7eed\u89c6\u9891\u7684\u4f9d\u8d56\uff0c\u6709\u671b\u63d0\u5347\u5ba4\u5185 3D \u573a\u666f\u91cd\u5efa\u7684\u53ef\u7f16\u8f91\u6027\u4e0e\u5b9e\u7528\u6027\u3002"}, {"abstract": "Embeddings have emerged as a standard representational interface linking foundation models with downstream systems. Most embedding benchmarks assess representations through discriminative tasks or geometric criteria centered on separability in embedding space. However, strong performance on such evaluations does not establish whether content compressed into an embedding remains accessible to a downstream generator. To address this gap, we introduce the Generative Embedding Benchmark (GEB), in which a decoder answers questions using only a frozen embedding and question text, without access to the original image or intermediate visual features. Answer quality under this readout measures generative information: the answer-relevant content recoverable from an embedding. GEB includes a curated visual-question-answering dataset with a 1,800-item development split and a held-out 900-item test split covering natural images, scene text, and visual documents. Using a common decoder and training recipe, we evaluate seven public embedding models in visual-only and vision-language joint modes. On the test set, visual-only scores range from 28.25 to 33.21; with image-question joint encoding, all five VLM-based embedding models score higher, and the best reaches 65.56. Matched embeddings also outperform text-only inputs, zero embeddings, and shuffled embeddings. Natural-image information is much easier to recover than scene text or visual-document information, while a Qwen3-VL-2B reference with access to the original image reaches 84.30. Together, these results show that generative readout exposes information bottlenecks that separability-based evaluation does not capture.", "arxiv_id": "2608.06972", "arxiv_url": "https://arxiv.org/abs/2608.06972", "authors": ["Yun Li", "Biao Yang", "Peixi Wu", "Yunhao Zhou", "Mingzhou Jiang", "Wei Yuan", "Fan Yang", "Wenwu Ou"], "brief": "\u8bba\u6587\u63d0\u51fa Generative Embedding Benchmark\uff08GEB\uff09\uff0c\u8ba9\u89e3\u7801\u5668\u4ec5\u57fa\u4e8e\u51bb\u7ed3\u5d4c\u5165\u548c\u95ee\u9898\u4f5c\u7b54\uff0c\u4ee5\u8bc4\u4f30\u5d4c\u5165\u4e2d\u53ef\u88ab\u4e0b\u6e38\u751f\u6210\u5668\u6062\u590d\u7684\u5185\u5bb9\u3002\u5176\u6784\u5efa\u4e86\u8986\u76d6\u81ea\u7136\u56fe\u50cf\u3001\u573a\u666f\u6587\u5b57\u548c\u89c6\u89c9\u6587\u6863\u7684\u89c6\u89c9\u95ee\u7b54\u6570\u636e\u96c6\uff0c\u5e76\u7cfb\u7edf\u6bd4\u8f83\u4e867\u4e2a\u516c\u5f00\u5d4c\u5165\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06972", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["GEB \u4e0d\u770b\u4f20\u7edf\u53ef\u5206\u6027\u6216\u51e0\u4f55\u6307\u6807\uff0c\u800c\u7528\u201c\u4ec5\u51ed\u5d4c\u5165\u56de\u7b54\u95ee\u9898\u201d\u7684\u8d28\u91cf\u8861\u91cf\u751f\u6210\u53ef\u8bfb\u51fa\u7684\u4fe1\u606f\u91cf", "\u6570\u636e\u96c6\u5305\u542b1800\u6761\u5f00\u53d1\u96c6\u4e0e900\u6761\u9690\u85cf\u6d4b\u8bd5\u96c6\uff0c\u8986\u76d6\u81ea\u7136\u56fe\u50cf\u3001\u573a\u666f\u6587\u672c\u548c\u89c6\u89c9\u6587\u6863", "\u6d4b\u8bd5\u7ed3\u679c\u663e\u793a\u7eaf\u89c6\u89c9\u5d4c\u5165\u5f97\u5206\u4ec528.25\u523033.21\uff0c\u56fe\u6587\u8054\u5408\u7f16\u7801\u663e\u8457\u66f4\u9ad8\uff0c\u6700\u4f73\u8fbe65.56\uff0c\u4f46\u4ecd\u4f4e\u4e8e\u53ef\u770b\u539f\u56fe\u7684Qwen3-VL-2B\u53c2\u8003\u6a21\u578b84.30"], "keywords": ["\u5d4c\u5165\u6a21\u578b", "\u591a\u6a21\u6001", "\u89c6\u89c9\u95ee\u7b54", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06972v1", "published_at": "2026-08-07", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Generative Embedding Benchmark: How Much Information Survives in a Dense Embedding?", "tldr": "\u65b0\u57fa\u51c6\u8861\u91cf\u56fe\u50cf\u5d4c\u5165\u53ef\u751f\u6210\u4fe1\u606f\u91cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Generative Embedding Benchmark\uff08GEB\uff09\uff0c\u8ba9\u89e3\u7801\u5668\u4ec5\u57fa\u4e8e\u51bb\u7ed3\u5d4c\u5165\u548c\u95ee\u9898\u4f5c\u7b54\uff0c\u4ee5\u8bc4\u4f30\u5d4c\u5165\u4e2d\u53ef\u88ab\u4e0b\u6e38\u751f\u6210\u5668\u6062\u590d\u7684\u5185\u5bb9\u3002\u5176\u6784\u5efa\u4e86\u8986\u76d6\u81ea\u7136\u56fe\u50cf\u3001\u573a\u666f\u6587\u5b57\u548c\u89c6\u89c9\u6587\u6863\u7684\u89c6\u89c9\u95ee\u7b54\u6570\u636e\u96c6\uff0c\u5e76\u7cfb\u7edf\u6bd4\u8f83\u4e867\u4e2a\u516c\u5f00\u5d4c\u5165\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5e38\u89c1\u5d4c\u5165\u8bc4\u6d4b\u53ef\u80fd\u63a9\u76d6\u4fe1\u606f\u74f6\u9888\uff1a\u5d4c\u5165\u5728\u5206\u7c7b\u6216\u68c0\u7d22\u4e0a\u8868\u73b0\u597d\uff0c\u5e76\u4e0d\u4ee3\u8868\u5176\u5185\u5bb9\u8db3\u4ee5\u652f\u6301\u751f\u6210\u5f0f\u4e0b\u6e38\u4efb\u52a1\uff0c\u5bf9\u591a\u6a21\u6001\u5d4c\u5165\u6a21\u578b\u8bc4\u4f30\u548c\u5e94\u7528\u9009\u578b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Object detection is a fundamental task in computer vision and has achieved remarkable progress on standard benchmarks by localizing discrete and well-bounded object instances. However, many visual targets in real-world scenarios are not individual objects, but regions defined by visual states, scene context, object relations, and human activities, such as construction areas, damaged road regions, queues, group conversations, and vendor regions. Existing detection benchmarks are mainly built around object instances, providing limited support for systematically evaluating such region targets. To address this gap, we introduce Region Detection, a task that extends conventional object detection beyond object instances, and construct RegionDet, a benchmark for region target localization. RegionDet contains eight region categories, including Construction, Crossing, Damage, Queuing, Talking, Vendor, Waiting, and Walking, with COCO-style bounding-box annotations and evaluation protocols. We systematically evaluate representative closed-set and zero-shot/open-vocabulary detectors on RegionDet. Results show that closed-set detectors can partially learn region-level patterns under supervision, while zero-shot/open-vocabulary detectors struggle severely, revealing the strong object-centric bias of current vision-language detectors. Further analyses highlight key challenges in Region Detection, including weak boundary cues, strong context dependency, and insufficient relation-level region understanding. The RegionDet will be released.", "arxiv_id": "2608.06850", "arxiv_url": "https://arxiv.org/abs/2608.06850", "authors": ["Liang Wan", "Yuhan Wang", "Yupeng Zhang", "Zhen Xu", "Han Wang", "Fangjie Fu", "Sirui Zhu"], "brief": "\u8bba\u6587\u5b9a\u4e49\u4e86\u201c\u533a\u57df\u68c0\u6d4b\u201d\u4efb\u52a1\uff0c\u5c06\u76ee\u6807\u68c0\u6d4b\u4ece\u79bb\u6563\u7269\u4f53\u5b9e\u4f8b\u6269\u5c55\u5230\u7531\u72b6\u6001\u3001\u573a\u666f\u4e0a\u4e0b\u6587\u3001\u5173\u7cfb\u548c\u6d3b\u52a8\u5b9a\u4e49\u7684\u533a\u57df\u3002\u4f5c\u8005\u6784\u5efa\u4e86 RegionDet \u57fa\u51c6\uff0c\u5305\u542b 8 \u7c7b\u533a\u57df\u76ee\u6807\u53ca COCO \u98ce\u683c\u6846\u6807\u6ce8\u4e0e\u8bc4\u6d4b\u534f\u8bae\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06850", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["RegionDet \u8986\u76d6 Construction\u3001Crossing\u3001Damage\u3001Queuing\u3001Talking\u3001Vendor\u3001Waiting\u3001Walking \u516b\u7c7b\u771f\u5b9e\u573a\u666f\u533a\u57df", "\u7cfb\u7edf\u8bc4\u6d4b\u95ed\u96c6\u68c0\u6d4b\u5668\u4e0e\u96f6\u6837\u672c/\u5f00\u653e\u8bcd\u6c47\u68c0\u6d4b\u5668\uff0c\u53d1\u73b0\u540e\u8005\u5728\u533a\u57df\u76ee\u6807\u4e0a\u8868\u73b0\u5f88\u5dee", "\u63ed\u793a\u5f53\u524d\u89c6\u89c9\u8bed\u8a00\u68c0\u6d4b\u5668\u5b58\u5728\u5f3a\u7269\u4f53\u4e2d\u5fc3\u504f\u7f6e\uff0c\u96be\u4ee5\u5904\u7406\u5f31\u8fb9\u754c\u3001\u5f3a\u4e0a\u4e0b\u6587\u4f9d\u8d56\u548c\u5173\u7cfb\u7ea7\u533a\u57df\u7406\u89e3"], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u89c6\u89c9\u7406\u89e3", "\u5f00\u653e\u8bcd\u6c47\u68c0\u6d4b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06850v1", "published_at": "2026-08-07", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RegionDet: A Benchmark for Region Detection Beyond Object Instances", "tldr": "\u63d0\u51fa\u9762\u5411\u975e\u7269\u4f53\u5b9e\u4f8b\u7684\u533a\u57df\u68c0\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5b9a\u4e49\u4e86\u201c\u533a\u57df\u68c0\u6d4b\u201d\u4efb\u52a1\uff0c\u5c06\u76ee\u6807\u68c0\u6d4b\u4ece\u79bb\u6563\u7269\u4f53\u5b9e\u4f8b\u6269\u5c55\u5230\u7531\u72b6\u6001\u3001\u573a\u666f\u4e0a\u4e0b\u6587\u3001\u5173\u7cfb\u548c\u6d3b\u52a8\u5b9a\u4e49\u7684\u533a\u57df\u3002\u4f5c\u8005\u6784\u5efa\u4e86 RegionDet \u57fa\u51c6\uff0c\u5305\u542b 8 \u7c7b\u533a\u57df\u76ee\u6807\u53ca COCO \u98ce\u683c\u6846\u6807\u6ce8\u4e0e\u8bc4\u6d4b\u534f\u8bae\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u9f50\u4e86\u4f20\u7edf\u76ee\u6807\u68c0\u6d4b\u57fa\u51c6\u96be\u4ee5\u8bc4\u4f30\u201c\u975e\u7269\u4f53\u5b9e\u4f8b\u533a\u57df\u201d\u7684\u7a7a\u767d\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u68c0\u6d4b\u6a21\u578b\u4ece\u7269\u4f53\u5b9a\u4f4d\u8d70\u5411\u573a\u666f\u3001\u6d3b\u52a8\u4e0e\u5173\u7cfb\u9a71\u52a8\u7684\u533a\u57df\u7406\u89e3\uff0c\u5bf9\u81ea\u52a8\u9a7e\u9a76\u3001\u57ce\u5e02\u6cbb\u7406\u548c\u89c6\u9891\u76d1\u63a7\u7b49\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Learning structured and control-relevant latent representations remains a key challenge for world models. Recent JEPA-based world models learn action-conditioned predictive latent dynamics from observation sequences. However, their forward-prediction objectives do not explicitly enforce reliable identifiability of robot-centric physical state from individual latents or state changes from latent pairs, which can limit downstream planning and policy performance. We propose PSG-JEPA, a physically grounded JEPA world model that shapes its latent space with two complementary grounding objectives beyond forward prediction: grounding individual latents in robot proprioceptive state, and grounding latent pairs in multi-horizon joint-angle changes. Both objectives are applied only during training, leaving the inference architecture and computational cost unchanged. To comprehensively evaluate PSG-JEPA, we conduct experiments at three levels: (1) latent identifiability via probing, (2) goal-conditioned planning on frozen latents, and (3) policy learning in simulation and on a real robot. Experiments demonstrate that our PSG-JEPA consistently outperforms state-of-the-art latent world-model baselines at all three levels.", "arxiv_id": "2608.06799", "arxiv_url": "https://arxiv.org/abs/2608.06799", "authors": ["Haodong Yan", "Jiaguan Zhu", "Mingyuan Jia", "Ruiqing Yin", "Junjie He", "Zhide Zhong", "Junfeng Li", "Jinxuan Lu", "Hengtao Li", "Tianran Zhang", "Jiayi Chen", "Wenxuan Song", "Wen Chen", "Yuxiang Gao", "Haoang Li"], "brief": "\u8bba\u6587\u63d0\u51fa PSG-JEPA\uff0c\u5728JEPA\u5f0f\u52a8\u4f5c\u6761\u4ef6\u6f5c\u5728\u52a8\u529b\u5b66\u9884\u6d4b\u4e4b\u5916\uff0c\u5f15\u5165\u673a\u5668\u4eba\u672c\u4f53\u72b6\u6001\u4e0e\u591a\u6b65\u5173\u8282\u89d2\u53d8\u5316\u7684\u7269\u7406 grounding \u76ee\u6807\u3002\u8be5\u65b9\u6cd5\u53ea\u5728\u8bad\u7ec3\u65f6\u5851\u9020\u6f5c\u5728\u7a7a\u95f4\uff0c\u63a8\u7406\u9636\u6bb5\u4e0d\u589e\u52a0\u67b6\u6784\u6216\u8ba1\u7b97\u5f00\u9500\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06799", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5355\u4e2a\u6f5c\u53d8\u91cf\u4e0e\u673a\u5668\u4eba\u672c\u4f53\u611f\u77e5\u72b6\u6001\u5bf9\u9f50\uff0c\u63d0\u5347\u7269\u7406\u72b6\u6001\u53ef\u8fa8\u8bc6\u6027", "\u5c06\u6f5c\u53d8\u91cf\u5bf9\u4e0e\u591a\u65f6\u95f4\u5c3a\u5ea6\u5173\u8282\u89d2\u53d8\u5316\u5bf9\u9f50\uff0c\u4f7f\u72b6\u6001\u53d8\u5316\u66f4\u5177\u63a7\u5236\u76f8\u5173\u6027", "\u5728\u6f5c\u8868\u793a\u63a2\u6d4b\u3001\u51bb\u7ed3\u6f5c\u53d8\u91cf\u76ee\u6807\u89c4\u5212\u3001\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u7b56\u7565\u5b66\u4e60\u4e2d\u5747\u4f18\u4e8e\u73b0\u6709\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u57fa\u7ebf"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06799v1", "published_at": "2026-08-07", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Is Forward Prediction Enough? Physical State Grounding for JEPA World Models", "tldr": "\u7528\u7269\u7406\u72b6\u6001\u76d1\u7763\u589e\u5f3aJEPA\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PSG-JEPA\uff0c\u5728JEPA\u5f0f\u52a8\u4f5c\u6761\u4ef6\u6f5c\u5728\u52a8\u529b\u5b66\u9884\u6d4b\u4e4b\u5916\uff0c\u5f15\u5165\u673a\u5668\u4eba\u672c\u4f53\u72b6\u6001\u4e0e\u591a\u6b65\u5173\u8282\u89d2\u53d8\u5316\u7684\u7269\u7406 grounding \u76ee\u6807\u3002\u8be5\u65b9\u6cd5\u53ea\u5728\u8bad\u7ec3\u65f6\u5851\u9020\u6f5c\u5728\u7a7a\u95f4\uff0c\u63a8\u7406\u9636\u6bb5\u4e0d\u589e\u52a0\u67b6\u6784\u6216\u8ba1\u7b97\u5f00\u9500\u3002", "why_notable": "\u6307\u51fa\u5355\u7eaf\u524d\u5411\u9884\u6d4b\u4e0d\u8db3\u4ee5\u4fdd\u8bc1\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b\u5b66\u5230\u53ef\u63a7\u3001\u53ef\u8bc6\u522b\u7684\u7269\u7406\u72b6\u6001\u8868\u793a\uff0c\u5e76\u7ed9\u51fa\u4e00\u79cd\u8bad\u7ec3\u671f\u8f7b\u91cf\u7ea6\u675f\u6765\u63d0\u5347\u89c4\u5212\u548c\u7b56\u7565\u5b66\u4e60\u6548\u679c\uff0c\u5177\u6709\u8f83\u5f3a\u673a\u5668\u4eba\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Visual object tracking aims to continuously locate specific targets within sequential frames, evolving from single-modal methods to multi-modal ones. However, existing multi-modal trackers are typically designed for fixed modality combinations, requiring separate models for different inputs. This leads to a poor adaptability to missing or imperfect modalities, and limited generalization. To address these issues, we propose a novel unified framework called AnyTrack for object tracking with any modalities. Specifically, we design a Modality-aware Interaction Module (MIM) to facilitate dynamic interaction across diverse modalities. This module bridges modality discrepancies and aggregates temporal cues to maintain spatio-temporal consistency during cross-modal interaction. Furthermore, we introduce a Context Understanding Module (CUM) to establish spatial correspondence between visual features and target locations via global-local prompts. This module employs target-aware context modeling to enhance foreground-background discrimination for precise localization. Finally, to support the training and evaluation under diverse modalities, we extend existing multi-modal object tracking benchmarks by incorporating grayscale images, language descriptions, and audio clips. Extensive experiments with both complete and missing modality settings demonstrate that our AnyTrack achieves state-of-the-art performance, validating its effectiveness and flexibility. The source code is available at https://github.com/IdolLab/AnyTrack.", "arxiv_id": "2608.06773", "arxiv_url": "https://arxiv.org/abs/2608.06773", "authors": ["Hao Li", "Yunzhi Zhuge", "Wenning Hao", "Pingping Zhang", "Xiaoxiong Zhang", "Dong Wang", "Huchuan Lu"], "brief": "\u8bba\u6587\u63d0\u51fa AnyTrack\uff0c\u4e00\u4e2a\u53ef\u5904\u7406\u4efb\u610f\u6a21\u6001\u8f93\u5165\u7684\u7edf\u4e00\u76ee\u6807\u8ddf\u8e2a\u6846\u67b6\uff0c\u907f\u514d\u4e3a\u4e0d\u540c\u6a21\u6001\u7ec4\u5408\u5206\u522b\u8bad\u7ec3\u6a21\u578b\u3002\u5b83\u652f\u6301\u5b8c\u6574\u6216\u7f3a\u5931\u6a21\u6001\u573a\u666f\uff0c\u5e76\u6269\u5c55\u4e86\u591a\u6a21\u6001\u8ddf\u8e2a\u57fa\u51c6\u4ee5\u8986\u76d6\u7070\u5ea6\u3001\u8bed\u8a00\u548c\u97f3\u9891\u4fe1\u606f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06773", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bbe\u8ba1 Modality-aware Interaction Module\uff08MIM\uff09\uff0c\u5728\u4e0d\u540c\u6a21\u6001\u95f4\u8fdb\u884c\u52a8\u6001\u4ea4\u4e92\uff0c\u5f25\u5408\u6a21\u6001\u5dee\u5f02\u5e76\u805a\u5408\u65f6\u5e8f\u7ebf\u7d22\u3002", "\u63d0\u51fa Context Understanding Module\uff08CUM\uff09\uff0c\u5229\u7528\u5168\u5c40-\u5c40\u90e8\u63d0\u793a\u5efa\u7acb\u89c6\u89c9\u7279\u5f81\u4e0e\u76ee\u6807\u4f4d\u7f6e\u7684\u7a7a\u95f4\u5bf9\u5e94\u5173\u7cfb\uff0c\u589e\u5f3a\u524d\u666f/\u80cc\u666f\u533a\u5206\u3002", "\u5728\u5b8c\u6574\u6a21\u6001\u548c\u7f3a\u5931\u6a21\u6001\u8bbe\u7f6e\u4e0b\u5747\u8fbe\u5230\u9886\u5148\u6027\u80fd\uff0c\u5c55\u793a\u4e86\u5bf9\u4e0d\u5b8c\u7f8e\u6216\u7f3a\u5931\u8f93\u5165\u7684\u9002\u5e94\u6027\u3002"], "keywords": ["\u76ee\u6807\u8ddf\u8e2a", "\u591a\u6a21\u6001", "\u89c6\u89c9\u7406\u89e3", "\u9c81\u68d2\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06773v1", "published_at": "2026-08-07", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AnyTrack: Unifying Visual Object Tracking with Any Modalities", "tldr": "\u7edf\u4e00\u4efb\u610f\u6a21\u6001\u7684\u89c6\u89c9\u76ee\u6807\u8ddf\u8e2a\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AnyTrack\uff0c\u4e00\u4e2a\u53ef\u5904\u7406\u4efb\u610f\u6a21\u6001\u8f93\u5165\u7684\u7edf\u4e00\u76ee\u6807\u8ddf\u8e2a\u6846\u67b6\uff0c\u907f\u514d\u4e3a\u4e0d\u540c\u6a21\u6001\u7ec4\u5408\u5206\u522b\u8bad\u7ec3\u6a21\u578b\u3002\u5b83\u652f\u6301\u5b8c\u6574\u6216\u7f3a\u5931\u6a21\u6001\u573a\u666f\uff0c\u5e76\u6269\u5c55\u4e86\u591a\u6a21\u6001\u8ddf\u8e2a\u57fa\u51c6\u4ee5\u8986\u76d6\u7070\u5ea6\u3001\u8bed\u8a00\u548c\u97f3\u9891\u4fe1\u606f\u3002", "why_notable": "\u73b0\u6709\u591a\u6a21\u6001\u8ddf\u8e2a\u5668\u901a\u5e38\u7ed1\u5b9a\u56fa\u5b9a\u6a21\u6001\u7ec4\u5408\uff0c\u6cdb\u5316\u548c\u9c81\u68d2\u6027\u53d7\u9650\uff1bAnyTrack \u5c06\u591a\u79cd\u89c6\u89c9\u3001\u8bed\u8a00\u3001\u97f3\u9891\u7b49\u8f93\u5165\u7edf\u4e00\u5230\u4e00\u4e2a\u6846\u67b6\u4e2d\uff0c\u63d0\u5347\u4e86\u5b9e\u9645\u590d\u6742\u73af\u5883\u4e0b\u76ee\u6807\u8ddf\u8e2a\u7684\u7075\u6d3b\u6027\u548c\u53ef\u7528\u6027\u3002"}, {"abstract": "Under the standard split, Muon gets hidden matrices and AdamW embeddings/output head. Muon groks modular addition faster, but its solutions do not hold. All nine configurations on $(a+b) \\bmod 113$ grok and later lose generalization. Across five seeds the selected AdamW reference falls below threshold on four, reaching 27.59%. Instability persists across two moduli, two widths, two training fractions, subtraction, and depth. The failure arises at the representation-readout interface, identified only jointly up to an invertible map unselected by the loss. After solving the training set, the gradient falls to order $10^{-6}$ and the optimizers respond differently: step-size elasticity is -0.03 for Muon versus +1.5 for AdamW, and the Muon group moves 8.0 times faster per parameter. From bit-identical states, freezing either group prevents failure. Freezing embeddings/readout removes it in five runs over 451,400 post-grokking steps and five paired seeds: unfrozen arms record 137-321 sub-threshold evaluations, frozen arms none. Removing Muon\u0027s normalization and orthogonalization is no substitute: it collapses representation from 326 effective conjugate pairs to 4, shows no recurrent collapse, and fails terminally. Fourier filtering separates circuit failure from masking. Across 43 checkpoints over five seeds and three regimes, the task-aligned family reaches exactly 100% alone. In circuit failure it no longer solves the task; in masking it remains perfect while the full model reaches 45.85%, giving a positive margin on every example, including errors, but being outvoted by a near-equal adversarial remainder. Rescaling it restores 99.9%; grokking is the same condition resolving upward. The task selects the family, swapping $(k,k)$ for $(k,-k)$ under subtraction. Across an abrupt collapse, standard Fourier support is unchanged and the power-distribution cosine remains 0.9899.", "arxiv_id": "2608.07436", "arxiv_url": "https://arxiv.org/abs/2608.07436", "authors": ["Ali Janati", "Kaoutar El Maghraoui", "Andrei Kanavalau", "Anass Belfatmi"], "brief": "\u8bba\u6587\u7814\u7a76\u7528 Muon/AdamW \u5206\u7ec4\u8bad\u7ec3 Transformer \u505a\u6a21\u52a0\u7b49\u7b97\u6cd5\u4efb\u52a1\u65f6\u7684\u201c\u540e\u987f\u609f\u5d29\u6e83\u201d\u73b0\u8c61\uff1a\u6a21\u578b\u5148\u6cdb\u5316\u6210\u529f\uff0c\u968f\u540e\u53c8\u5931\u53bb\u6cdb\u5316\u3002\u4f5c\u8005\u5c06\u95ee\u9898\u5b9a\u4f4d\u5230\u8868\u793a\u5c42\u4e0e\u8bfb\u51fa\u5c42\u63a5\u53e3\u5904\u7684\u672a\u5b9a\u53ef\u9006\u53d8\u6362\uff0c\u4ee5\u53ca Muon \u4e0e AdamW \u5728\u4f4e\u68af\u5ea6\u9636\u6bb5\u7684\u66f4\u65b0\u52a8\u6001\u4e0d\u5339\u914d\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07436", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u6a21113\u52a0\u6cd5\u76849\u79cd\u914d\u7f6e\u30015\u4e2a\u968f\u673a\u79cd\u5b50\u4ee5\u53ca\u4e0d\u540c\u6a21\u6570\u3001\u5bbd\u5ea6\u3001\u8bad\u7ec3\u6bd4\u4f8b\u3001\u51cf\u6cd5\u548c\u6df1\u5ea6\u8bbe\u7f6e\u4e0b\uff0c\u6a21\u578b\u5747\u51fa\u73b0\u987f\u609f\u540e\u6cdb\u5316\u4e0b\u964d\u3002", "\u8bad\u7ec3\u96c6\u88ab\u89e3\u51b3\u540e\u68af\u5ea6\u964d\u81f3\u7ea610^-6\uff0cMuon\u7ec4\u6bcf\u53c2\u6570\u79fb\u52a8\u901f\u5ea6\u7ea6\u4e3aAdamW\u7ec4\u76848\u500d\uff1b\u4ece\u76f8\u540c\u72b6\u6001\u51bb\u7ed3\u4efb\u4e00\u7ec4\u90fd\u53ef\u963b\u6b62\u5d29\u6e83\uff0c\u51bb\u7ed3\u5d4c\u5165/\u8bfb\u51fa\u5c42\u572845\u4e07\u4f59\u6b65\u5185\u65e0\u5931\u8d25\u3002", "\u5085\u91cc\u53f6\u5206\u6790\u533a\u5206\u4e86\u771f\u5b9e\u7535\u8def\u5931\u6548\u4e0e\u88ab\u6b8b\u5dee\u5206\u91cf\u201c\u906e\u853d\u201d\uff1a\u4efb\u52a1\u5bf9\u9f50\u7684\u5085\u91cc\u53f6\u65cf\u53ef\u5355\u72ec\u8fbe\u5230100%\uff0c\u4f46\u5728\u906e\u853d\u65f6\u88ab\u8fd1\u7b49\u5f3a\u5ea6\u7684\u5bf9\u6297\u6b8b\u5dee\u6295\u7968\u538b\u8fc7\uff0c\u91cd\u7f29\u653e\u540e\u53ef\u6062\u590d99.9%\u3002"], "keywords": ["\u4f18\u5316\u5668", "Transformer", "grokking", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07436v1", "published_at": "2026-08-07", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Post-Grokking Collapse at the Representation-Readout Interface in Muon-Trained Transformers", "tldr": "Muon\u8bad\u7ec3Transformer\u4f1a\u987f\u609f\u540e\u5d29\u6e83", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u7528 Muon/AdamW \u5206\u7ec4\u8bad\u7ec3 Transformer \u505a\u6a21\u52a0\u7b49\u7b97\u6cd5\u4efb\u52a1\u65f6\u7684\u201c\u540e\u987f\u609f\u5d29\u6e83\u201d\u73b0\u8c61\uff1a\u6a21\u578b\u5148\u6cdb\u5316\u6210\u529f\uff0c\u968f\u540e\u53c8\u5931\u53bb\u6cdb\u5316\u3002\u4f5c\u8005\u5c06\u95ee\u9898\u5b9a\u4f4d\u5230\u8868\u793a\u5c42\u4e0e\u8bfb\u51fa\u5c42\u63a5\u53e3\u5904\u7684\u672a\u5b9a\u53ef\u9006\u53d8\u6362\uff0c\u4ee5\u53ca Muon \u4e0e AdamW \u5728\u4f4e\u68af\u5ea6\u9636\u6bb5\u7684\u66f4\u65b0\u52a8\u6001\u4e0d\u5339\u914d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86 Muon \u5728\u5c0f\u578b\u7b97\u6cd5\u4efb\u52a1\u4e0a\u867d\u80fd\u52a0\u901f grokking\uff0c\u5374\u53ef\u80fd\u56e0\u4f18\u5316\u5668\u5206\u7ec4\u63a5\u53e3\u4e0d\u7a33\u5b9a\u5bfc\u81f4\u6cdb\u5316\u5d29\u6e83\uff0c\u5bf9\u7406\u89e3 grokking\u3001\u4f18\u5316\u5668\u8bbe\u8ba1\u548c Transformer \u673a\u5236\u53ef\u89e3\u91ca\u6027\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Modern AI is no longer a single model but an ecosystem: classical ML predictors, deep and multimodal models, large language models, and agents, each trained and tuned over different data sources and each producing outputs at scale that become inputs to the others. Operating such an ecosystem is fundamentally a data integration problem - the knowledge it depends on is fragmented across dozens of heterogeneous, independently governed sources that must be reconciled and continually maintained. Yet integration alone is not enough. The predictions these systems make are shaped by many interacting factors, and the events, decisions, and variables that drive an outcome are routinely entangled with the ones that merely accompany it; treated as a basis for action, such correlational signals invite confounded decisions. This becomes acute once agents act autonomously: to be trustworthy and reliable, an agent must anticipate the consequences of its actions, not merely extrapolate from what has co-occurred before. Causal reasoning is what closes this gap, distinguishing the drivers of an outcome from its correlates, and enabling prescriptive and counterfactual analysis over the ecosystem\u0027s data. We therefore argue that the integrated ecosystem needs an explicit causal layer, and we propose to build it as a shared, persistent, queryable Causal World System (CWS).", "arxiv_id": "2608.07214", "arxiv_url": "https://arxiv.org/abs/2608.07214", "authors": ["Dazhuo Qiu", "Yingli Zhou", "Amedeo Pachera", "Angela Bonifati", "Andrea Mauri"], "brief": "\u672c\u6587\u8ba4\u4e3a\u73b0\u4ee3 AI \u751f\u6001\u7684\u6838\u5fc3\u6311\u6218\u4e0d\u4ec5\u662f\u591a\u6e90\u5f02\u6784\u6570\u636e\u96c6\u6210\uff0c\u8fd8\u9700\u8981\u663e\u5f0f\u5efa\u6a21\u56e0\u679c\u5173\u7cfb\uff0c\u4ee5\u907f\u514d\u57fa\u4e8e\u76f8\u5173\u6027\u7684\u6df7\u6dc6\u51b3\u7b56\u3002\u4f5c\u8005\u63d0\u51fa\u6784\u5efa\u5171\u4eab\u3001\u6301\u4e45\u3001\u53ef\u67e5\u8be2\u7684\u201c\u56e0\u679c\u4e16\u754c\u7cfb\u7edf\u201d\uff08CWS\uff09\uff0c\u4e3a\u51b3\u7b56\u548c\u81ea\u4e3b\u667a\u80fd\u4f53\u63d0\u4f9b\u53cd\u4e8b\u5b9e\u4e0e\u5e72\u9884\u5206\u6790\u80fd\u529b\u3002", "categories": ["cs.DB", "cs.AI", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07214", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u56e0\u679c\u63a8\u7406", "\u6570\u636e\u7ba1\u7406", "\u667a\u80fd\u4f53", "\u51b3\u7b56\u652f\u6301"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07214v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Toward a Causal Data Management Ecosystem for Decision Making and Agentic AI", "tldr": "\u672c\u6587\u8ba4\u4e3a\u73b0\u4ee3 AI \u751f\u6001\u7684\u6838\u5fc3\u6311\u6218\u4e0d\u4ec5\u662f\u591a\u6e90\u5f02\u6784\u6570\u636e\u96c6\u6210\uff0c\u8fd8\u9700\u8981\u663e\u5f0f\u5efa\u6a21\u56e0\u679c\u5173\u7cfb\uff0c\u4ee5\u907f\u514d\u57fa\u4e8e\u76f8\u5173\u6027\u7684\u6df7\u6dc6\u51b3\u7b56\u3002\u4f5c\u8005\u63d0\u51fa\u6784\u5efa\u5171\u4eab\u3001\u6301\u4e45\u3001\u53ef\u67e5\u8be2\u7684\u201c\u56e0\u679c\u4e16\u754c\u7cfb\u7edf\u201d\uff08CWS\uff09\uff0c\u4e3a\u51b3\u7b56\u548c\u81ea\u4e3b\u667a\u80fd\u4f53\u63d0\u4f9b\u53cd\u4e8b\u5b9e\u4e0e\u5e72\u9884\u5206\u6790\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Memory systems have shown promise for improving agent performance, but their potential remains largely unexplored for small language models, which struggle to generate sufficient successful trajectories on their own. We propose Agent Memory Distillation (AMD), a training-free framework that transfers structured knowledge from a large teacher agent to a small student agent through hierarchical memory. AMD constructs three complementary memory types from successful teacher trajectories: Workflow memory encodes task-level strategies, Subtask memory provides concrete behavioral examples at an intermediate granularity, and Function memory captures per-function calling conventions and common pitfalls. Workflow and Subtask memories are injected proactively at the start of each task, while Function memory is retrieved reactively upon tool-calling errors. We evaluate AMD on three tool-use benchmarks using four student models (4B-8B parameters) with GPT-5-mini as the teacher, achieving average accuracy gains of 27.2%p, 11.2%p, and 3.4%p on AppWorld, BFCL V3, and ToolSandbox, while consistently outperforming existing memory-based baselines. Further analysis shows that Subtask memory contributes the largest gains, teacher effectiveness depends on both teacher capability and student compatibility, and 4B-sized students benefit most from AMD.", "arxiv_id": "2608.07169", "arxiv_url": "https://arxiv.org/abs/2608.07169", "authors": ["Taeil Kim", "Kangsan Kim", "Sung Ju Hwang"], "brief": "\u8bba\u6587\u63d0\u51fa Agent Memory Distillation\uff08AMD\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u6846\u67b6\uff0c\u901a\u8fc7\u4ece\u5927\u578b\u6559\u5e08\u667a\u80fd\u4f53\u6210\u529f\u8f68\u8ff9\u4e2d\u6784\u5efa\u5c42\u6b21\u5316\u8bb0\u5fc6\uff0c\u5c06\u4efb\u52a1\u7b56\u7565\u3001\u5b50\u4efb\u52a1\u793a\u4f8b\u548c\u51fd\u6570\u8c03\u7528\u7ecf\u9a8c\u8fc1\u79fb\u7ed9\u5c0f\u6a21\u578b\u667a\u80fd\u4f53\u3002\u5728\u4e09\u4e2a\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u4e0a\uff0c4B-8B \u5b66\u751f\u6a21\u578b\u83b7\u5f97\u663e\u8457\u51c6\u786e\u7387\u63d0\u5347\uff0c\u5c24\u5176\u5728 AppWorld \u4e0a\u63d0\u5347 27.2 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u4f18\u4e8e\u73b0\u6709\u8bb0\u5fc6\u65b9\u6cd5\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07169", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bb0\u5fc6\u673a\u5236", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07169v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agent Memory Distillation: Empowering Small LLM Agents with Hierarchical Teacher Memory", "tldr": "\u8bba\u6587\u63d0\u51fa Agent Memory Distillation\uff08AMD\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u6846\u67b6\uff0c\u901a\u8fc7\u4ece\u5927\u578b\u6559\u5e08\u667a\u80fd\u4f53\u6210\u529f\u8f68\u8ff9\u4e2d\u6784\u5efa\u5c42\u6b21\u5316\u8bb0\u5fc6\uff0c\u5c06\u4efb\u52a1\u7b56\u7565\u3001\u5b50\u4efb\u52a1\u793a\u4f8b\u548c\u51fd\u6570\u8c03\u7528\u7ecf\u9a8c\u8fc1\u79fb\u7ed9\u5c0f\u6a21\u578b\u667a\u80fd\u4f53\u3002\u5728\u4e09\u4e2a\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u4e0a\uff0c4B-8B \u5b66\u751f\u6a21\u578b\u83b7\u5f97\u663e\u8457\u51c6\u786e\u7387\u63d0\u5347\uff0c\u5c24\u5176\u5728 AppWorld \u4e0a\u63d0\u5347 27.2 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u4f18\u4e8e\u73b0\u6709\u8bb0\u5fc6\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Giving an AI agent the ability to send emails, query databases, or execute commands is useful--until the agent is tricked into doing something it shouldn\u0027t. Prompt injection, hallucinated reasoning, and unsafe tool calls form the primary attack surface for autonomous LLM agents. Existing defenses rely on software checks like system prompts or policy filters running on the same machine the attacker targets, offering no verifiable proof of execution. We introduce Niyam-AI, a framework that makes safety enforcement provable. At session start, permitted tools and constraints are locked into an Intent Contract committed via SHA-256. Every tool call is intercepted and validated by an isolated Judge model; upon passing, a zk-SNARK proof is generated via EZKL. The tool executes only after proof verification, allowing third parties to confirm enforcement without accessing Judge model weights. Evaluating Niyam-AI on 2,000 real-world scenarios from Agent-SafetyBench against NeMo Guardrails, Meta\u0027s Llama Prompt Guard 2, and OpenAI\u0027s GPT-OSS-Safeguard using 5-fold stratified cross-validation yields an F1 score of 88.5% with a 1.1% false-positive rate (bootstrap 95% CI: [85.19%, 91.88%], N=1000). McNemar\u0027s exact paired test confirms significant improvement: Niyam-AI wins 390 discordant scenarios against NeMo (vs 20 losses), 115 against Prompt Guard 2 (vs 13), and 384 against GPT-OSS-Safeguard (vs 19) with p \u003c 0.0001 in all cases. Proof generation adds 2260.6 +/- 218.4 ms per approved action, while verification takes 53.1 +/- 11.8 ms. Niyam-AI provides a guardrail that is both highly accurate and mathematically verifiable--though this reflects a classifier adapted to Agent-SafetyBench evaluated against zero-shot baselines, a distinction discussed in Section IV.C.", "arxiv_id": "2608.07167", "arxiv_url": "https://arxiv.org/abs/2608.07167", "authors": ["Aditya Katkar", "Om Karkele", "Kartik Mandhane", "Manisha More", "Yash Kashid"], "brief": "Niyam-AI \u4e3a\u5177\u5907\u5de5\u5177\u8c03\u7528\u80fd\u529b\u7684 LLM \u667a\u80fd\u4f53\u5f15\u5165\u201c\u610f\u56fe\u5408\u7ea6\u201d\uff0c\u5c06\u5141\u8bb8\u7684\u5de5\u5177\u4e0e\u7ea6\u675f\u54c8\u5e0c\u627f\u8bfa\uff0c\u5e76\u7528\u9694\u79bb\u7684 Judge \u6a21\u578b\u68c0\u67e5\u6bcf\u6b21\u8c03\u7528\uff0c\u518d\u901a\u8fc7 zk-SNARK \u751f\u6210\u53ef\u9a8c\u8bc1\u8bc1\u660e\u540e\u624d\u6267\u884c\u3002\u5176\u5728 Agent-SafetyBench \u4e0a\u76f8\u6bd4\u591a\u79cd\u62a4\u680f\u57fa\u7ebf\u663e\u8457\u63d0\u5347\uff0cF1 \u8fbe 88.5%\u3001\u8bef\u62a5\u7387 1.1%\uff0c\u4f46\u6bcf\u6b21\u901a\u8fc7\u52a8\u4f5c\u4f1a\u589e\u52a0\u7ea6 2.26 \u79d2\u8bc1\u660e\u751f\u6210\u5f00\u9500\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07167", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u62a4\u680f", "\u96f6\u77e5\u8bc6\u8bc1\u660e", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07167v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "NiyamAI - An Intent-Bound AI Agent with Cryptographically Verifiable Guardrails using Zero-Knowledge Proofs", "tldr": "Niyam-AI \u4e3a\u5177\u5907\u5de5\u5177\u8c03\u7528\u80fd\u529b\u7684 LLM \u667a\u80fd\u4f53\u5f15\u5165\u201c\u610f\u56fe\u5408\u7ea6\u201d\uff0c\u5c06\u5141\u8bb8\u7684\u5de5\u5177\u4e0e\u7ea6\u675f\u54c8\u5e0c\u627f\u8bfa\uff0c\u5e76\u7528\u9694\u79bb\u7684 Judge \u6a21\u578b\u68c0\u67e5\u6bcf\u6b21\u8c03\u7528\uff0c\u518d\u901a\u8fc7 zk-SNARK \u751f\u6210\u53ef\u9a8c\u8bc1\u8bc1\u660e\u540e\u624d\u6267\u884c\u3002\u5176\u5728 Agent-SafetyBench \u4e0a\u76f8\u6bd4\u591a\u79cd\u62a4\u680f\u57fa\u7ebf\u663e\u8457\u63d0\u5347\uff0cF1 \u8fbe 88.5%\u3001\u8bef\u62a5\u7387 1.1%\uff0c\u4f46\u6bcf\u6b21\u901a\u8fc7\u52a8\u4f5c\u4f1a\u589e\u52a0\u7ea6 2.26 \u79d2\u8bc1\u660e\u751f\u6210\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with Verifiable Reward (RLVR) has emerged as a powerful paradigm for training coding agents, where the execution feedback from compilation and tests provides objective verification. However, unlike agent tasks, coding agents face a unique and finer-grained credit assignment challenge: at each step, coding actions simultaneously pack varying changes into different regions of a code version, which makes the contribution of independent change indistinguishable. Existing RLVR methods mostly leverage the outcome reward or step-level reward, which fails to dive into a code diff and makes unique properties of coding actions invisible to training. In this paper, we propose Diff-in-Diff Policy Optimization (DiDPO), a critic-free RL method that constructs fine-grained credit units directly from the structure of code diffs. DiDPO organizes multi-turn coding interactions into multiple thought--action steps and discovers code diffs across sampled trajectories. It then selects anchors by aggregating highly similar sub-diffs split from each whole diff by our ``groupability score\u0027\u0027, which provides the splitting schema that optimally balances the semantic scope of anchors and the group mass they may form. Finally these anchors form advantage groups and project the diff-level advantage back to individual response tokens. Experiments on long-horizon coding and reasoning benchmarks show that DiDPO significantly outperforms strong agentic RL baselines. On Qwen2.5-7B-Coder, DiDPO exceeds comparable methods by over 10\\% and narrows the gap with far larger models, offering a principled framework for fine-grained credit assignment in coding agent training. We also open-source verl-code, an agentic rl codebase that supports various RL methods and coding benchmarks.", "arxiv_id": "2608.07147", "arxiv_url": "https://arxiv.org/abs/2608.07147", "authors": ["Xucong Wang", "Zhe Zhao", "Liheng Yu", "Di Wu", "Xiaofeng Cao", "Pengkun Wang"], "brief": "\u8bba\u6587\u63d0\u51fa DiDPO\uff0c\u4e00\u79cd\u9762\u5411\u7f16\u7a0b\u667a\u80fd\u4f53\u8bad\u7ec3\u7684\u65e0\u8bc4\u8bba\u5bb6\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u76f4\u63a5\u5229\u7528\u4ee3\u7801 diff \u7ed3\u6784\u6784\u9020\u7ec6\u7c92\u5ea6\u4fe1\u7528\u5206\u914d\u5355\u5143\u3002\u5b83\u901a\u8fc7\u5b50 diff \u805a\u5408\u5f62\u6210\u951a\u70b9\u4e0e\u4f18\u52bf\u7ec4\uff0c\u5e76\u5c06 diff \u7ea7\u4f18\u52bf\u6620\u5c04\u56de\u54cd\u5e94 token\uff0c\u5728\u957f\u7a0b\u7f16\u7a0b\u4e0e\u63a8\u7406\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0cQwen2.5-7B-Coder \u4e0a\u63d0\u5347\u8d85\u8fc7 10%\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07147", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4ee3\u7801\u751f\u6210", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07147v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DiDPO: Diff-in-Diff Policy Optimization for Coding Agent Training", "tldr": "\u8bba\u6587\u63d0\u51fa DiDPO\uff0c\u4e00\u79cd\u9762\u5411\u7f16\u7a0b\u667a\u80fd\u4f53\u8bad\u7ec3\u7684\u65e0\u8bc4\u8bba\u5bb6\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u76f4\u63a5\u5229\u7528\u4ee3\u7801 diff \u7ed3\u6784\u6784\u9020\u7ec6\u7c92\u5ea6\u4fe1\u7528\u5206\u914d\u5355\u5143\u3002\u5b83\u901a\u8fc7\u5b50 diff \u805a\u5408\u5f62\u6210\u951a\u70b9\u4e0e\u4f18\u52bf\u7ec4\uff0c\u5e76\u5c06 diff \u7ea7\u4f18\u52bf\u6620\u5c04\u56de\u54cd\u5e94 token\uff0c\u5728\u957f\u7a0b\u7f16\u7a0b\u4e0e\u63a8\u7406\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0cQwen2.5-7B-Coder \u4e0a\u63d0\u5347\u8d85\u8fc7 10%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Organizing thousands of unstandardized, multilingual expertise declarations is a persistent challenge for Human Resources (HR) platforms, directly impacting downstream tasks like accurate talent matching. To address this, we propose a hybrid knowledge graph generation pipeline that grounds a Large Language Model (LLM) in the Wikidata multilingual Knowledge Graph (KG) while employing an agentic reflexion pattern to synthesize emerging concepts and their associated metadata. Unlike rigid top-down methods or fragmented bottom-up approaches, our system anchors recognized concepts to stable Knowledge Graph entities while dynamically creating new nodes and relational metadata for unrecognized skills. Executed across five stages, entity reconciliation, multilingual canonicalization, active curation, deduplication, and the iterative recovery of unmapped concepts, the system autonomously adapts to rapidly evolving, noisy skill mentions across five European languages. Ultimately, this pipeline provides a highly scalable, explicable, and self-healing framework for generating a comprehensive skills knowledge graph, from which a structured taxonomy is derived, using unstructured, noisy text.", "arxiv_id": "2608.07023", "arxiv_url": "https://arxiv.org/abs/2608.07023", "authors": ["Emma Jouffroy", "Warren Jouanneau", "Marc Palyart"], "brief": "\u63d0\u51fa\u4e00\u79cd\u7ed3\u5408\u81ea\u9876\u5411\u4e0b\u4e0e\u81ea\u5e95\u5411\u4e0a\u7684\u77e5\u8bc6\u56fe\u8c31\u751f\u6210\u6d41\u7a0b\uff0c\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u951a\u5b9a\u5230 Wikidata \u591a\u8bed\u8a00\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u7528\u667a\u80fd\u4f53\u5f0f\u53cd\u601d\u673a\u5236\u8865\u5168\u65b0\u5174\u6280\u80fd\u6982\u5ff5\u53ca\u5143\u6570\u636e\u3002\u8be5\u65b9\u6cd5\u53ef\u5728\u4e94\u79cd\u6b27\u6d32\u8bed\u8a00\u7684\u5608\u6742\u6280\u80fd\u6587\u672c\u4e2d\u8fdb\u884c\u5b9e\u4f53\u5bf9\u9f50\u3001\u89c4\u8303\u5316\u3001\u53bb\u91cd\u548c\u672a\u6620\u5c04\u6982\u5ff5\u6062\u590d\uff0c\u751f\u6210\u53ef\u6269\u5c55\u3001\u53ef\u89e3\u91ca\u4e14\u53ef\u81ea\u4fee\u590d\u7684\u4eba\u529b\u8d44\u6e90\u6280\u80fd\u77e5\u8bc6\u56fe\u8c31\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07023", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u591a\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07023v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "An Agentic Hybrid Top-Down and Bottom-Up Approach to Knowledge Graph Generation", "tldr": "\u63d0\u51fa\u4e00\u79cd\u7ed3\u5408\u81ea\u9876\u5411\u4e0b\u4e0e\u81ea\u5e95\u5411\u4e0a\u7684\u77e5\u8bc6\u56fe\u8c31\u751f\u6210\u6d41\u7a0b\uff0c\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u951a\u5b9a\u5230 Wikidata \u591a\u8bed\u8a00\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u7528\u667a\u80fd\u4f53\u5f0f\u53cd\u601d\u673a\u5236\u8865\u5168\u65b0\u5174\u6280\u80fd\u6982\u5ff5\u53ca\u5143\u6570\u636e\u3002\u8be5\u65b9\u6cd5\u53ef\u5728\u4e94\u79cd\u6b27\u6d32\u8bed\u8a00\u7684\u5608\u6742\u6280\u80fd\u6587\u672c\u4e2d\u8fdb\u884c\u5b9e\u4f53\u5bf9\u9f50\u3001\u89c4\u8303\u5316\u3001\u53bb\u91cd\u548c\u672a\u6620\u5c04\u6982\u5ff5\u6062\u590d\uff0c\u751f\u6210\u53ef\u6269\u5c55\u3001\u53ef\u89e3\u91ca\u4e14\u53ef\u81ea\u4fee\u590d\u7684\u4eba\u529b\u8d44\u6e90\u6280\u80fd\u77e5\u8bc6\u56fe\u8c31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Early-stage molecular design is an iterative process, not just a task of generating molecules. Researchers turn broad goals into design strategies, refine candidates, assess many properties, and gather evidence before synthesis and tests. AI methods can generate molecules, optimize several goals, predict properties, dock compounds, and account for synthesis. Yet these functions are spread across specialized tools. Experts must still coordinate each step, judge interim results, and integrate evidence. The central challenge is thus to turn research intent into adaptive, traceable runs grounded in scientific tools. We cast this challenge as intent-to-evidence molecular design workflow execution and present CAi Copilot, an expert-oriented agent with three linked layers. The Research Interface Layer turns intent into an executable plan. The Agent Reasoning Layer uses interim results to guide each run. The Execution Substrate supplies molecular tools, metrics, reusable utilities, and backend services. Across 45 tasks, CAi achieves the strongest overall performance, with an outcome score of 84.59, exceeding the next-best result by 18.07 points. Additional benchmarks test how CAi coordinates generation, screening, and multi-criteria evaluation, while exposing limits in long-horizon execution. These results show that CAi turns broad molecular-design intent into transparent, traceable workflows that connect interim decisions to candidate-level evidence.", "arxiv_id": "2608.06961", "arxiv_url": "https://arxiv.org/abs/2608.06961", "authors": ["Zhu Wang", "Jiangyu Chen", "Yingjun Shang", "Yuhui Yao", "Laiao Lu", "Tianfan Fu", "Na Zou"], "brief": "\u8bba\u6587\u63d0\u51fa CAi Copilot\uff0c\u4e00\u4e2a\u9762\u5411\u65e9\u671f\u5206\u5b50\u8bbe\u8ba1\u7684\u610f\u56fe\u9a71\u52a8\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u5c06\u7814\u7a76\u8005\u7684\u5bbd\u6cdb\u76ee\u6807\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u8ffd\u8e2a\u7684\u5206\u5b50\u751f\u6210\u3001\u7b5b\u9009\u4e0e\u591a\u6307\u6807\u8bc4\u4f30\u6d41\u7a0b\u3002\u7cfb\u7edf\u5728 45 \u4e2a\u4efb\u52a1\u4e0a\u53d6\u5f97\u6700\u9ad8\u7efc\u5408\u8868\u73b0\uff0c\u5f97\u5206 84.59\uff0c\u8f83\u6b21\u4f18\u65b9\u6cd5\u9ad8 18.07 \u5206\uff0c\u4f46\u957f\u7a0b\u6267\u884c\u4ecd\u5b58\u5728\u5c40\u9650\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06961", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5206\u5b50\u8bbe\u8ba1", "\u79d1\u5b66\u5de5\u4f5c\u6d41", "\u591a\u76ee\u6807\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06961v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CAi Copilot: Reducing Operational Workload in Molecular Design through Intent-Driven Agentic Workflows", "tldr": "\u8bba\u6587\u63d0\u51fa CAi Copilot\uff0c\u4e00\u4e2a\u9762\u5411\u65e9\u671f\u5206\u5b50\u8bbe\u8ba1\u7684\u610f\u56fe\u9a71\u52a8\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u5c06\u7814\u7a76\u8005\u7684\u5bbd\u6cdb\u76ee\u6807\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u8ffd\u8e2a\u7684\u5206\u5b50\u751f\u6210\u3001\u7b5b\u9009\u4e0e\u591a\u6307\u6807\u8bc4\u4f30\u6d41\u7a0b\u3002\u7cfb\u7edf\u5728 45 \u4e2a\u4efb\u52a1\u4e0a\u53d6\u5f97\u6700\u9ad8\u7efc\u5408\u8868\u73b0\uff0c\u5f97\u5206 84.59\uff0c\u8f83\u6b21\u4f18\u65b9\u6cd5\u9ad8 18.07 \u5206\uff0c\u4f46\u957f\u7a0b\u6267\u884c\u4ecd\u5b58\u5728\u5c40\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly involved in scientific discovery, yet it remains unclear whether they can support complex real laboratory science. Here we introduce Science Edge Evaluation (SEE), a multimodal benchmark of expert-curated questions grounded in peer-reviewed literature and experimental practice in chemistry, biology, and materials science. Evaluation of 19 multimodal large language models (MLLMs) shows that even the best-performing model reaches only 48.7% accuracy. Moreover, general-purpose models outperform science-specialized models on average. In the visual-agent evaluation, the use of tools increases the best accuracy to 52.7%. Tool use can expand the information available to models, but more information does not necessarily lead to reliable scientific reasoning. The key challenge is whether models can manage tool-derived information within the boundaries of the original experimental evidence. Together, these findings reveal that current MLLMs still cannot reliably make justified and evidence-bounded inferences from experimental results, which is an essential capability in real scientific discovery. Bridging this gap requires MLLMs to transition from explaining established scientific concepts to deriving novel and evidence-based insights from experimental data.", "arxiv_id": "2608.06931", "arxiv_url": "https://arxiv.org/abs/2608.06931", "authors": ["Taolin Han", "Yuchen Zhang", "Jinghang Wang", "Yun Wu", "Wai Yuet Chiu", "Zhaohai Li", "Yifei Zhang", "Jinxin Wang", "Yuhao Zhou", "Chen Zhao", "Jiajia Li", "Jiaxin Li", "Qile Jin", "Kewei Sun", "Shuang Wu", "Weiqi Zhai", "Renquan Lv", "Junchao Li", "Ruodan Chen", "Qingteng Chen", "Zhibo Yang", "Hu Wei", "Lin Qu", "Shuai Bai", "Bing Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa Science Edge Evaluation\uff08SEE\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u5316\u5b66\u3001\u751f\u7269\u548c\u6750\u6599\u79d1\u5b66\u771f\u5b9e\u5b9e\u9a8c\u573a\u666f\u7684\u591a\u6a21\u6001\u79d1\u5b66\u63a8\u7406\u57fa\u51c6\uff0c\u7528\u4e13\u5bb6\u6574\u7406\u7684\u6587\u732e\u4e0e\u5b9e\u9a8c\u95ee\u9898\u8bc4\u4f30\u6a21\u578b\u80fd\u5426\u57fa\u4e8e\u8bc1\u636e\u505a\u79d1\u5b66\u53d1\u73b0\u300219\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u6700\u4f73\u51c6\u786e\u7387\u4ec548.7%\uff0c\u52a0\u5165\u5de5\u5177\u7684\u89c6\u89c9\u667a\u80fd\u4f53\u6700\u9ad8\u4e5f\u53ea\u523052.7%\uff0c\u663e\u793a\u5f53\u524d\u6a21\u578b\u4ecd\u96be\u4ee5\u53ef\u9760\u5904\u7406\u5de5\u5177\u4fe1\u606f\u5e76\u505a\u51fa\u53d7\u5b9e\u9a8c\u8bc1\u636e\u7ea6\u675f\u7684\u63a8\u65ad\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06931", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u79d1\u5b66\u53d1\u73b0", "\u57fa\u51c6\u8bc4\u6d4b", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06931v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Science Edge Evaluation: SEE the Missing Step Toward Real Scientific Discovery", "tldr": "\u8bba\u6587\u63d0\u51fa Science Edge Evaluation\uff08SEE\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u5316\u5b66\u3001\u751f\u7269\u548c\u6750\u6599\u79d1\u5b66\u771f\u5b9e\u5b9e\u9a8c\u573a\u666f\u7684\u591a\u6a21\u6001\u79d1\u5b66\u63a8\u7406\u57fa\u51c6\uff0c\u7528\u4e13\u5bb6\u6574\u7406\u7684\u6587\u732e\u4e0e\u5b9e\u9a8c\u95ee\u9898\u8bc4\u4f30\u6a21\u578b\u80fd\u5426\u57fa\u4e8e\u8bc1\u636e\u505a\u79d1\u5b66\u53d1\u73b0\u300219\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u6700\u4f73\u51c6\u786e\u7387\u4ec548.7%\uff0c\u52a0\u5165\u5de5\u5177\u7684\u89c6\u89c9\u667a\u80fd\u4f53\u6700\u9ad8\u4e5f\u53ea\u523052.7%\uff0c\u663e\u793a\u5f53\u524d\u6a21\u578b\u4ecd\u96be\u4ee5\u53ef\u9760\u5904\u7406\u5de5\u5177\u4fe1\u606f\u5e76\u505a\u51fa\u53d7\u5b9e\u9a8c\u8bc1\u636e\u7ea6\u675f\u7684\u63a8\u65ad\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Designing autonomous agents that effectively assist human teams hinges on understanding team dynamics, often without task specific knowledge. We present TRIBE, a domain independent approach that reveals team behavioral dynamics invisible to traditional performance metrics. We show that communication patterns can categorize teams into performance predictive behavioral tribes, as early as 10% into the task, enabling timely interventions. We test TRIBE on four diverse datasets and demonstrate that communication patterns predict team performance while the prediction strength varies by the degree a task structure allows for behavioral freedom. Our temporal analysis reveals that AI agents significantly alter team behavioral trajectories while human advisors align with natural dynamics, and that teams maintain behavioral flexibility throughout collaboration. Further, we compare TRIBE to Llama and optimize the pipeline, achieving significant speedup with performance improvement.", "arxiv_id": "2608.06926", "arxiv_url": "https://arxiv.org/abs/2608.06926", "authors": ["Ali Jalal-Kamali", "Nikolos Gurney", "David V. Pynadath", "Fred Morstatter"], "brief": "TRIBE \u63d0\u51fa\u4e00\u79cd\u9886\u57df\u65e0\u5173\u65b9\u6cd5\uff0c\u901a\u8fc7\u56e2\u961f\u6c9f\u901a\u6a21\u5f0f\u5728\u4efb\u52a1\u65e9\u671f\u9884\u6d4b\u56e2\u961f\u8868\u73b0\uff0c\u5e76\u5c06\u56e2\u961f\u5212\u5206\u4e3a\u5177\u6709\u9884\u6d4b\u6027\u7684\u884c\u4e3a\u201c\u90e8\u843d\u201d\u3002\u5728\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u6c9f\u901a\u884c\u4e3a\u80fd\u6709\u6548\u9884\u6d4b\u7ee9\u6548\uff0c\u4e14\u53ef\u7528\u4e8e\u5206\u6790 AI \u667a\u80fd\u4f53\u4e0e\u4eba\u7c7b\u987e\u95ee\u5bf9\u56e2\u961f\u52a8\u6001\u7684\u4e0d\u540c\u5f71\u54cd\uff1b\u4f18\u5316\u540e\u76f8\u6bd4 Llama \u7ba1\u7ebf\u66f4\u5feb\u4e14\u6548\u679c\u66f4\u597d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06926", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56e2\u961f\u534f\u4f5c", "\u884c\u4e3a\u5efa\u6a21", "\u667a\u80fd\u4f53", "\u6027\u80fd\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06926v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TRIBE: Predicting Team Performance via Communication Behavior Ensembles", "tldr": "TRIBE \u63d0\u51fa\u4e00\u79cd\u9886\u57df\u65e0\u5173\u65b9\u6cd5\uff0c\u901a\u8fc7\u56e2\u961f\u6c9f\u901a\u6a21\u5f0f\u5728\u4efb\u52a1\u65e9\u671f\u9884\u6d4b\u56e2\u961f\u8868\u73b0\uff0c\u5e76\u5c06\u56e2\u961f\u5212\u5206\u4e3a\u5177\u6709\u9884\u6d4b\u6027\u7684\u884c\u4e3a\u201c\u90e8\u843d\u201d\u3002\u5728\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u6c9f\u901a\u884c\u4e3a\u80fd\u6709\u6548\u9884\u6d4b\u7ee9\u6548\uff0c\u4e14\u53ef\u7528\u4e8e\u5206\u6790 AI \u667a\u80fd\u4f53\u4e0e\u4eba\u7c7b\u987e\u95ee\u5bf9\u56e2\u961f\u52a8\u6001\u7684\u4e0d\u540c\u5f71\u54cd\uff1b\u4f18\u5316\u540e\u76f8\u6bd4 Llama \u7ba1\u7ebf\u66f4\u5feb\u4e14\u6548\u679c\u66f4\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Resolving a real software issue with a large language model (LLM) agent is a long repair episode, often tens to hundreds of steps spanning exploration, hypothesis, implementation, and verification. Success depends on both the base model\u0027s local reasoning and the agent\u0027s ability to maintain an evolving plan and remember observations across phases. Existing repository-level agents typically strengthen planning or memory in isolation, leaving long trajectories vulnerable to stale evidence, repeated failed edits, and verification inferred from the agent\u0027s own claims instead of execution evidence. We present PMCoder, an issue-resolution agent that couples a hierarchical phase planner with episodic memory. The coupling is bidirectional: the current plan phase conditions memory retrieval, while memory-derived trajectory statistics inform stuck detection and replanning. When available, issue-reproduction verdicts ground verification progress in execution evidence rather than self-reported completion. On SWE-bench Verified, PMCoder resolves an average of $25$ more cases ($+5.0$pp) than a harness-matched baseline, with gains persisting even where the reproduction gate never fires. Further Verified-500 evaluations show the same positive direction across Claude Haiku 4.5, DeepSeek-V4-Flash, and an OpenHands port, with at least $14$ additional resolved cases ($+2.8$pp). Separately, evaluation on TerminalWorld\u0027s official sample suggests that the plan-memory substrate transfers beyond issue reports. Ablation and trajectory analyses show where the gains come from: coupling planning and memory outperforms either component alone and reduces repeated failed actions, empty-patch exits, and context-window exhaustion.", "arxiv_id": "2608.06811", "arxiv_url": "https://arxiv.org/abs/2608.06811", "authors": ["Jiahao Zhang", "Yifan Zhang", "Yu Huang"], "brief": "\u8bba\u6587\u63d0\u51fa PMCoder\uff0c\u4e00\u4e2a\u7528\u4e8e\u8f6f\u4ef6\u7f3a\u9677\u4fee\u590d\u7684 LLM \u667a\u80fd\u4f53\uff0c\u5c06\u5206\u5c42\u9636\u6bb5\u89c4\u5212\u4e0e\u60c5\u8282\u8bb0\u5fc6\u53cc\u5411\u8026\u5408\uff1a\u8ba1\u5212\u9636\u6bb5\u5f71\u54cd\u8bb0\u5fc6\u68c0\u7d22\uff0c\u8bb0\u5fc6\u7edf\u8ba1\u53cd\u8fc7\u6765\u89e6\u53d1\u5361\u4f4f\u68c0\u6d4b\u4e0e\u91cd\u89c4\u5212\u3002\u8be5\u65b9\u6cd5\u5728 SWE-bench Verified \u4e0a\u76f8\u6bd4\u5339\u914d\u57fa\u7ebf\u591a\u89e3\u51b3\u7ea6 25 \u4e2a\u95ee\u9898\uff08+5.0pp\uff09\uff0c\u8de8\u591a\u4e2a\u6a21\u578b\u548c OpenHands \u79fb\u690d\u4e5f\u4fdd\u6301\u6536\u76ca\uff0c\u5e76\u51cf\u5c11\u91cd\u590d\u5931\u8d25\u64cd\u4f5c\u3001\u7a7a\u8865\u4e01\u9000\u51fa\u548c\u4e0a\u4e0b\u6587\u8017\u5c3d\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06811", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06811v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Coupling Planning with Episodic Memory in LLM Agents for Software Issue Resolution", "tldr": "\u8bba\u6587\u63d0\u51fa PMCoder\uff0c\u4e00\u4e2a\u7528\u4e8e\u8f6f\u4ef6\u7f3a\u9677\u4fee\u590d\u7684 LLM \u667a\u80fd\u4f53\uff0c\u5c06\u5206\u5c42\u9636\u6bb5\u89c4\u5212\u4e0e\u60c5\u8282\u8bb0\u5fc6\u53cc\u5411\u8026\u5408\uff1a\u8ba1\u5212\u9636\u6bb5\u5f71\u54cd\u8bb0\u5fc6\u68c0\u7d22\uff0c\u8bb0\u5fc6\u7edf\u8ba1\u53cd\u8fc7\u6765\u89e6\u53d1\u5361\u4f4f\u68c0\u6d4b\u4e0e\u91cd\u89c4\u5212\u3002\u8be5\u65b9\u6cd5\u5728 SWE-bench Verified \u4e0a\u76f8\u6bd4\u5339\u914d\u57fa\u7ebf\u591a\u89e3\u51b3\u7ea6 25 \u4e2a\u95ee\u9898\uff08+5.0pp\uff09\uff0c\u8de8\u591a\u4e2a\u6a21\u578b\u548c OpenHands \u79fb\u690d\u4e5f\u4fdd\u6301\u6536\u76ca\uff0c\u5e76\u51cf\u5c11\u91cd\u590d\u5931\u8d25\u64cd\u4f5c\u3001\u7a7a\u8865\u4e01\u9000\u51fa\u548c\u4e0a\u4e0b\u6587\u8017\u5c3d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Application-specific FPGA accelerators offer substantial performance and energy-efficiency gains across many application domains, but developing them is costly, often requiring months of specialized effort. Even with high-level synthesis (HLS), designers still need extensive hardware expertise to build high-performance accelerators. Although large language models (LLMs) have demonstrated strong software-generation capabilities, even frontier models lack the hardware intuition and procedural knowledge needed to reliably translate baseline C/C++ programs into high-performance HLS designs: they struggle to identify effective architectures, follow the optimization processes used by HLS experts, and apply hardware transformations consistently across diverse kernels. We present HLSmith, an expert-guided framework for translating C/C++ programs into optimized HLS accelerators. HLSmith combines three components: an HLS optimization expertise library that encodes guarded transformation recipes, their applicability and prerequisite conditions, and unsafe cases to avoid; a staged, feedback-driven orchestration flow modeled on expert HLS development practice that guides agents through synthesis, bottleneck analysis, and optimization; and a tool-grounded model-adaptation pipeline that converts optimization trajectories from commercial frontier models into training data for fine-tuning open-weight LLMs. We evaluate HLSmith on PolyBench against ChatHLS, a leading prior agent-orchestration framework for HLS accelerator development. HLSmith achieves a geometric mean speedup of 4.24x over ChatHLS while producing functionally correct designs, in both software and RTL simulation, for every benchmark, compared with ChatHLS\u0027s 57% valid-design rate. It further reaches speedups of up to 252x and 138x with commercial frontier models and open-weight models, respectively.", "arxiv_id": "2608.06791", "arxiv_url": "https://arxiv.org/abs/2608.06791", "authors": ["Yuebo Luo", "Ahmad Sedigh Baroughi", "Philip Stachura", "Le Chen", "Venkatram Vishwanath", "Zhenman Fang", "Caiwen Ding"], "brief": "HLSmith \u662f\u4e00\u4e2a\u4e13\u5bb6\u5f15\u5bfc\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u4e8e\u5c06 C/C++ \u7a0b\u5e8f\u81ea\u52a8\u8f6c\u6362\u4e3a\u4f18\u5316\u540e\u7684 HLS FPGA \u52a0\u901f\u5668\uff0c\u7ed3\u5408\u4e86\u4e13\u5bb6\u4f18\u5316\u89c4\u5219\u5e93\u3001\u5206\u9636\u6bb5\u53cd\u9988\u9a71\u52a8\u6d41\u7a0b\u548c\u57fa\u4e8e\u5de5\u5177\u8f68\u8ff9\u7684\u6a21\u578b\u5fae\u8c03\u3002\u76f8\u6bd4\u5df2\u6709 ChatHLS\uff0c\u5b83\u5728 PolyBench \u4e0a\u5b9e\u73b0 4.24 \u500d\u51e0\u4f55\u5e73\u5747\u52a0\u901f\uff0c\u5e76\u5728\u6240\u6709\u57fa\u51c6\u4e0a\u751f\u6210\u8f6f\u786c\u4ef6\u4eff\u771f\u5747\u6b63\u786e\u7684\u8bbe\u8ba1\uff0c\u663e\u8457\u63d0\u5347\u4e86\u6709\u6548\u8bbe\u8ba1\u7387\u4e0e\u6027\u80fd\u3002", "categories": ["cs.AR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06791", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u9ad8\u5c42\u7efc\u5408", "FPGA", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06791v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "HLSmith: An Expert-Guided Agentic Framework for C/C++-to-HLS Translation", "tldr": "HLSmith \u662f\u4e00\u4e2a\u4e13\u5bb6\u5f15\u5bfc\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u4e8e\u5c06 C/C++ \u7a0b\u5e8f\u81ea\u52a8\u8f6c\u6362\u4e3a\u4f18\u5316\u540e\u7684 HLS FPGA \u52a0\u901f\u5668\uff0c\u7ed3\u5408\u4e86\u4e13\u5bb6\u4f18\u5316\u89c4\u5219\u5e93\u3001\u5206\u9636\u6bb5\u53cd\u9988\u9a71\u52a8\u6d41\u7a0b\u548c\u57fa\u4e8e\u5de5\u5177\u8f68\u8ff9\u7684\u6a21\u578b\u5fae\u8c03\u3002\u76f8\u6bd4\u5df2\u6709 ChatHLS\uff0c\u5b83\u5728 PolyBench \u4e0a\u5b9e\u73b0 4.24 \u500d\u51e0\u4f55\u5e73\u5747\u52a0\u901f\uff0c\u5e76\u5728\u6240\u6709\u57fa\u51c6\u4e0a\u751f\u6210\u8f6f\u786c\u4ef6\u4eff\u771f\u5747\u6b63\u786e\u7684\u8bbe\u8ba1\uff0c\u663e\u8457\u63d0\u5347\u4e86\u6709\u6548\u8bbe\u8ba1\u7387\u4e0e\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Rapid adoption of large language models (LLMs) in enterprise settings has introduced operational, security, and governance risks. As generative AI applications move from pilot to production, manual harm identification and mitigation are becoming difficult to scale. Although many tools support model evaluation, adversarial testing, runtime guardrails, and observability, the tooling landscape remains fragmented. Tools are typically designed for specific engineering tasks and described in technical terms that do not align with governance frameworks or risk taxonomies, making it difficult to determine which tools address which risks and where critical gaps remain. This paper proposes a structured protocol to automate AI risk mitigation through a taxonomy-driven analysis of open-source LLM evaluation and security tools. We map the capabilities of 21 prominent open-source tools to the 32 subcategories of the extended MIT AI Risk Mitigation and Response Taxonomy. An LLM-assisted retrieval-augmented generation pipeline analyzes source code and documentation to extract capabilities for each taxonomy category. Reliability assessment yielded moderate agreement (Fleiss\u0027 Kappa = 0.509) among three independent reviewers. The analysis reveals a highly skewed landscape in which tools cluster around technical and operational controls, while governance, legal and regulatory, and financial and market controls remain largely unaddressed. This motivates a layered risk-mitigation architecture combining tool-based controls with organizational and regulatory processes. The mapping protocol achieved an F1 score of 75.5% after majority voting. Overall, the study provides a practical mapping between enterprise AI risk categories and open-source mitigation capabilities, identifies where human oversight remains necessary, and presents a taxonomy-driven framework applicable to open-source and proprietary solutions.", "arxiv_id": "2608.07446", "arxiv_url": "https://arxiv.org/abs/2608.07446", "authors": ["Afreen Alam", "Evgenija Popchanovska", "Ana Gjorgjevikj", "Maryan Rizinski", "Lubomir T. Chitkushev", "Irena Vodenska", "Dimitar Trajanov"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5206\u7c7b\u6cd5\u9a71\u52a8\u7684\u5206\u6790\u534f\u8bae\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30\u5f00\u6e90LLM\u8bc4\u6d4b\u4e0e\u5b89\u5168\u5de5\u5177\u8986\u76d6\u54ea\u4e9b\u4f01\u4e1aAI\u98ce\u9669\u3002\u4f5c\u8005\u5c0621\u4e2a\u4e3b\u6d41\u5f00\u6e90\u5de5\u5177\u6620\u5c04\u5230\u6269\u5c55MIT AI\u98ce\u9669\u7f13\u89e3\u4e0e\u54cd\u5e94\u5206\u7c7b\u6cd5\u768432\u4e2a\u5b50\u7c7b\uff0c\u5e76\u7528LLM\u8f85\u52a9\u7684RAG\u6d41\u7a0b\u5206\u6790\u6e90\u7801\u548c\u6587\u6863\u3002", "categories": ["cs.SE", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07446", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efaLLM\u8f85\u52a9RAG\u7ba1\u7ebf\uff0c\u4ece\u5de5\u5177\u6e90\u7801\u4e0e\u6587\u6863\u4e2d\u62bd\u53d6\u80fd\u529b\uff0c\u5e76\u6309\u98ce\u9669\u5206\u7c7b\u8fdb\u884c\u6620\u5c04", "\u8986\u76d621\u4e2a\u5f00\u6e90LLM\u8bc4\u6d4b\u3001\u5b89\u5168\u3001\u62a4\u680f\u548c\u53ef\u89c2\u6d4b\u6027\u5de5\u5177\uff0c\u5bf9\u5e9432\u4e2a\u98ce\u9669\u7f13\u89e3\u5b50\u7c7b\u522b", "\u53d1\u73b0\u5de5\u5177\u80fd\u529b\u9ad8\u5ea6\u96c6\u4e2d\u5728\u6280\u672f\u4e0e\u8fd0\u8425\u63a7\u5236\uff0c\u6cbb\u7406\u3001\u6cd5\u5f8b\u5408\u89c4\u3001\u91d1\u878d\u4e0e\u5e02\u573a\u98ce\u9669\u63a7\u5236\u660e\u663e\u4e0d\u8db3"], "keywords": ["AI\u6cbb\u7406", "\u98ce\u9669\u8bc4\u4f30", "LLM\u5b89\u5168", "\u5de5\u5177\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07446v1", "published_at": "2026-08-07", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Taxonomy-Driven Analysis of Open-Source AI Risk Mitigation Tools", "tldr": "\u7528\u98ce\u9669\u5206\u7c7b\u6cd5\u6620\u5c04\u5f00\u6e90LLM\u98ce\u63a7\u5de5\u5177", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5206\u7c7b\u6cd5\u9a71\u52a8\u7684\u5206\u6790\u534f\u8bae\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30\u5f00\u6e90LLM\u8bc4\u6d4b\u4e0e\u5b89\u5168\u5de5\u5177\u8986\u76d6\u54ea\u4e9b\u4f01\u4e1aAI\u98ce\u9669\u3002\u4f5c\u8005\u5c0621\u4e2a\u4e3b\u6d41\u5f00\u6e90\u5de5\u5177\u6620\u5c04\u5230\u6269\u5c55MIT AI\u98ce\u9669\u7f13\u89e3\u4e0e\u54cd\u5e94\u5206\u7c7b\u6cd5\u768432\u4e2a\u5b50\u7c7b\uff0c\u5e76\u7528LLM\u8f85\u52a9\u7684RAG\u6d41\u7a0b\u5206\u6790\u6e90\u7801\u548c\u6587\u6863\u3002", "why_notable": "\u8be5\u7814\u7a76\u628a\u788e\u7247\u5316\u7684\u5f00\u6e90AI\u5b89\u5168\u5de5\u5177\u4e0e\u4f01\u4e1a\u6cbb\u7406\u98ce\u9669\u6846\u67b6\u5bf9\u9f50\uff0c\u4e3a\u4f01\u4e1a\u9009\u578b\u3001\u98ce\u9669\u7f3a\u53e3\u8bc6\u522b\u548c\u5206\u5c42\u98ce\u63a7\u67b6\u6784\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u5b9e\u7528\u53c2\u8003\uff1b\u540c\u65f6\u6307\u51fa\u4ec5\u9760\u5de5\u5177\u96be\u4ee5\u8986\u76d6\u6cbb\u7406\u548c\u76d1\u7ba1\u5c42\u9762\u7684\u98ce\u9669\uff0c\u4ecd\u9700\u7ec4\u7ec7\u6d41\u7a0b\u4e0e\u4eba\u5de5\u76d1\u7763\u3002"}, {"abstract": "Recent Multimodal Large Language Models (MLLMs) have achieved remarkable progress across diverse vision-language tasks, creating an urgent need for more challenging benchmarks. Yet existing evaluations still provide limited insight into whether these models can truly reason over structured visual information. Visual Graph Reasoning (VGR) offers a compelling testbed for this challenge, requiring models to integrate perception, structural understanding, and multi-step reasoning over graph-based visual inputs. However, prior VGR benchmarks often reduce the task to visual perception followed by text-based reasoning, restrict evaluation to single-image settings, rely on answer-only metrics, and underrepresent realistic graph-centric scenarios. To bridge the gap, we introduce GraphVerse, a unified benchmark that jointly evaluates perception, visual reasoning, and text-based graph reasoning in MLLMs under both single-image and paired-image settings. At its core is a suite of Graph-centric Image Editing (GIE) strategies that modify graph images while preserving their semantics, turning them into active tests of visual reasoning. We further propose VGR-Score, a process-sensitive metric that evaluates reasoning quality beyond final-answer accuracy. Extensive experiments reveal several key limitations of current MLLMs in VGR, while also validating the effectiveness of GIE strategies and the transferability of GraphVerse to broader multimodal reasoning capabilities. The code is available at https://github.com/sunyuanfu/GraphVerse.", "arxiv_id": "2608.06769", "arxiv_url": "https://arxiv.org/abs/2608.06769", "authors": ["Yuanfu Sun", "Yuanhang Ren", "Kang Li", "Chuanhao Ji", "Jiaxi Li", "Jiajin Liu", "Ninghao Liu", "Qiaoyu Tan"], "brief": "GraphVerse \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u89c6\u89c9\u56fe\u63a8\u7406\u7efc\u5408\u57fa\u51c6\uff0c\u8986\u76d6\u5355\u56fe\u4e0e\u53cc\u56fe\u573a\u666f\uff0c\u5e76\u540c\u65f6\u8bc4\u4f30\u611f\u77e5\u3001\u89c6\u89c9\u63a8\u7406\u548c\u6587\u672c\u56fe\u63a8\u7406\u80fd\u529b\u3002\u8bba\u6587\u5f15\u5165\u56fe\u4e2d\u5fc3\u56fe\u50cf\u7f16\u8f91\u7b56\u7565\u548c\u8fc7\u7a0b\u654f\u611f\u7684 VGR-Score\uff0c\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u6a21\u578b\u5728\u7ed3\u6784\u5316\u89c6\u89c9\u63a8\u7406\u4e0a\u4ecd\u6709\u660e\u663e\u77ed\u677f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06769", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u63a8\u7406", "\u56fe\u63a8\u7406", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06769v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null,
