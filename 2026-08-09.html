"title": "GraphVerse: A Comprehensive Visual Graph Reasoning Benchmark for Multimodal Large Language Models", "tldr": "GraphVerse \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u89c6\u89c9\u56fe\u63a8\u7406\u7efc\u5408\u57fa\u51c6\uff0c\u8986\u76d6\u5355\u56fe\u4e0e\u53cc\u56fe\u573a\u666f\uff0c\u5e76\u540c\u65f6\u8bc4\u4f30\u611f\u77e5\u3001\u89c6\u89c9\u63a8\u7406\u548c\u6587\u672c\u56fe\u63a8\u7406\u80fd\u529b\u3002\u8bba\u6587\u5f15\u5165\u56fe\u4e2d\u5fc3\u56fe\u50cf\u7f16\u8f91\u7b56\u7565\u548c\u8fc7\u7a0b\u654f\u611f\u7684 VGR-Score\uff0c\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u6a21\u578b\u5728\u7ed3\u6784\u5316\u89c6\u89c9\u63a8\u7406\u4e0a\u4ecd\u6709\u660e\u663e\u77ed\u677f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While Vision-Language-Action (VLA) models have advanced embodied AI, their fundamentally reactive paradigm severely limits performance in partially observable and long-horizon tasks. When restricted to a single wrist-mounted camera, they inevitably suffer from perception forgetting as objects exit the field of view, and temporal task-progress forgetting} during multi-step execution. To overcome these bottlenecks, we propose AtlasVLA, a novel framework that transitions from direct reactive manipulation to proactive reasoning through a persistent world-ego state. AtlasVLA features a dual-memory architecture: a 4D Persistent World State Memory that lifts transient 2D observations into a globally updated, voxel-hashed spatial state to resolve visual blind spots, and an Ego-Working State Memory that tracks historical ego state and task progress. By conditioning a diffusion transformer (DiT) on this joint World-Ego state, AtlasVLA enables robust spatial reasoning. Extensive evaluations across LIBERO, RLBench, and real-world benchmarks demonstrate that AtlasVLA achieves state-of-the-art performance using solely a wrist camera. Remarkably, it decisively outperforms multi-view baselines, yielding absolute success rate improvements of 9.4% on LIBERO-Long and 17.5% in real-world long-horizon tasks.", "arxiv_id": "2608.06729", "arxiv_url": "https://arxiv.org/abs/2608.06729", "authors": ["Guiyu Zhao", "Longteng Guo", "Yanghong Mei", "Zilin Zhu", "Yu Zhang", "Bin Cao", "Mingming Yu", "Xingjian He", "Jie Jiang", "Jing Liu"], "brief": "AtlasVLA \u4e3a\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5f15\u5165\u6301\u4e45\u7684\u4e16\u754c-\u81ea\u6211\u72b6\u6001\u5efa\u6a21\uff0c\u7528 4D \u4e16\u754c\u72b6\u6001\u8bb0\u5fc6\u5f25\u8865\u8155\u90e8\u76f8\u673a\u89c6\u91ce\u76f2\u533a\uff0c\u5e76\u7528\u81ea\u6211\u5de5\u4f5c\u8bb0\u5fc6\u8ddf\u8e2a\u5386\u53f2\u72b6\u6001\u4e0e\u4efb\u52a1\u8fdb\u5ea6\u3002\u8be5\u65b9\u6cd5\u5728 LIBERO\u3001RLBench \u548c\u771f\u5b9e\u957f\u7a0b\u4efb\u52a1\u4e2d\u4ec5\u7528\u8155\u90e8\u76f8\u673a\u8fbe\u5230\u6700\u4f18\u8868\u73b0\uff0c\u663e\u8457\u8d85\u8fc7\u591a\u89c6\u89d2\u57fa\u7ebf\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06729", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u8bb0\u5fc6\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06729v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AtlasVLA: Persistent World-Ego State Modeling for Vision-Language-Action Models", "tldr": "AtlasVLA \u4e3a\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5f15\u5165\u6301\u4e45\u7684\u4e16\u754c-\u81ea\u6211\u72b6\u6001\u5efa\u6a21\uff0c\u7528 4D \u4e16\u754c\u72b6\u6001\u8bb0\u5fc6\u5f25\u8865\u8155\u90e8\u76f8\u673a\u89c6\u91ce\u76f2\u533a\uff0c\u5e76\u7528\u81ea\u6211\u5de5\u4f5c\u8bb0\u5fc6\u8ddf\u8e2a\u5386\u53f2\u72b6\u6001\u4e0e\u4efb\u52a1\u8fdb\u5ea6\u3002\u8be5\u65b9\u6cd5\u5728 LIBERO\u3001RLBench \u548c\u771f\u5b9e\u957f\u7a0b\u4efb\u52a1\u4e2d\u4ec5\u7528\u8155\u90e8\u76f8\u673a\u8fbe\u5230\u6700\u4f18\u8868\u73b0\uff0c\u663e\u8457\u8d85\u8fc7\u591a\u89c6\u89d2\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While post-training improves the capabilities of large language models (LLMs), it generally lowers their output diversity and creativity, negatively impacting tasks that explicitly require creativity (e.g., story generation) as well as those that require it implicitly, e.g., reinforcement learning (RL). We instead propose CreativeInstruct, a scalable instruction-tuning method that teaches LLMs to balance creative, base-model-like generations with the quality of post-trained models, by learning to inject special [StartCreativity] spans that bias generation toward creativity. Furthermore, we introduce a structural diversity metric based on graph edit distance, which captures narrative level variation missed by purely lexical and semantic metrics. On narrative generation, CreativeInstruct matches or exceeds the diversity of both multi-model baselines and distilled variants of their outputs, without sacrificing quality or requiring multiple models at inference time. These results are mirrored in our human evaluation, where we find that annotators rate CreativeInstruct generations as more creative than the post-trained LLMs\u0027 generations in 70.3% of cases. We also show the benefits of creative models as a substrate for RL: GRPO applied to a CreativeInstruct checkpoint improves by ~4% on AMC and ~5% points on MATH over the same training applied to the post-trained checkpoint.", "arxiv_id": "2608.07460", "arxiv_url": "https://arxiv.org/abs/2608.07460", "authors": ["Ananya Sahu", "Mohit Bansal", "Elias Stengel-Eskin"], "brief": "\u63d0\u51fa CreativeInstruct\uff0c\u4e00\u79cd\u53ef\u6269\u5c55\u7684\u6307\u4ee4\u5fae\u8c03\u65b9\u6cd5\uff0c\u901a\u8fc7\u5b66\u4e60\u63d2\u5165\u7279\u6b8a\u7684 [StartCreativity] \u7247\u6bb5\uff0c\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4fdd\u6301\u540e\u8bad\u7ec3\u6a21\u578b\u8d28\u91cf\u7684\u540c\u65f6\u6062\u590d\u63a5\u8fd1\u57fa\u5ea7\u6a21\u578b\u7684\u521b\u9020\u6027\u4e0e\u591a\u6837\u6027\u3002\u5176\u5728\u53d9\u4e8b\u751f\u6210\u4e2d\u63d0\u5347\u7ed3\u6784\u591a\u6837\u6027\u4e14\u4e0d\u727a\u7272\u8d28\u91cf\uff0c\u4eba\u8bc4\u4e2d 70.3% \u66f4\u5177\u521b\u9020\u529b\uff0c\u5e76\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u521d\u59cb\u5316\u6a21\u578b\u5728 AMC \u548c MATH \u4e0a\u5e26\u6765\u7ea6 4%-5% \u7684\u63d0\u5347\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07460", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6307\u4ee4\u5fae\u8c03", "\u521b\u9020\u6027\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07460v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CreativeInstruct: Scalably Teaching LLMs to Balance Quality, Creativity, and Diversity", "tldr": "\u63d0\u51fa CreativeInstruct\uff0c\u4e00\u79cd\u53ef\u6269\u5c55\u7684\u6307\u4ee4\u5fae\u8c03\u65b9\u6cd5\uff0c\u901a\u8fc7\u5b66\u4e60\u63d2\u5165\u7279\u6b8a\u7684 [StartCreativity] \u7247\u6bb5\uff0c\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4fdd\u6301\u540e\u8bad\u7ec3\u6a21\u578b\u8d28\u91cf\u7684\u540c\u65f6\u6062\u590d\u63a5\u8fd1\u57fa\u5ea7\u6a21\u578b\u7684\u521b\u9020\u6027\u4e0e\u591a\u6837\u6027\u3002\u5176\u5728\u53d9\u4e8b\u751f\u6210\u4e2d\u63d0\u5347\u7ed3\u6784\u591a\u6837\u6027\u4e14\u4e0d\u727a\u7272\u8d28\u91cf\uff0c\u4eba\u8bc4\u4e2d 70.3% \u66f4\u5177\u521b\u9020\u529b\uff0c\u5e76\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u521d\u59cb\u5316\u6a21\u578b\u5728 AMC \u548c MATH \u4e0a\u5e26\u6765\u7ea6 4%-5% \u7684\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent optimization studies on Retrieval-Augmented Generation (RAG) have exploited chunk-level KV cache reuse to avoid processing long retrieved contexts for higher efficiency, while significant information redundancy and noise still remain in the coarse-grained chunks. This paper optimizes the Pareto frontier under low prefill latency constraints while maximizing accuracy by proposing CoinRAG (Contextualized Information Nugget KV Cache Reuse for Long-Context RAG). The name metaphorically reflects our core mechanism: much like assembling small tokens (or \"coins\") to accumulate a larger value, CoinRAG compositionally reuses offline-computed, fine-grained nugget caches to form a learned contextual representation efficiently in a more semantically relevant but compact manner. Specifically, instead of full-chunk encoding, CoinRAG identifies query-relevant semantic units within retrieved chunks through two-stage retrieval and seamlessly assembles their sliced KV representations with a chunk-level context. Extensive evaluations on LongBench multi-hop question answering tasks demonstrate that CoinRAG significantly reduces operational costs and outperforms the other baselines with a new Pareto frontier and an average 5.3% relative improvement in answer quality (F1) under a standard fast prefill latency budget.", "arxiv_id": "2608.07458", "arxiv_url": "https://arxiv.org/abs/2608.07458", "authors": ["Gyuwan Kim", "Cheoneum Park", "Tao Yang"], "brief": "\u672c\u6587\u63d0\u51fa CoinRAG\uff0c\u5c06\u68c0\u7d22\u5757\u8fdb\u4e00\u6b65\u7ec6\u5316\u4e3a\u4e0e\u67e5\u8be2\u76f8\u5173\u7684\u201c\u4fe1\u606f\u788e\u7247\u201d\uff0c\u590d\u7528\u79bb\u7ebf\u8ba1\u7b97\u7684\u7ec6\u7c92\u5ea6 KV cache\uff0c\u5e76\u7ed3\u5408\u5757\u7ea7\u4e0a\u4e0b\u6587\u6765\u9ad8\u6548\u6784\u5efa\u957f\u4e0a\u4e0b\u6587\u8868\u793a\u3002\u5728 LongBench \u591a\u8df3\u95ee\u7b54\u4e0a\uff0c\u5b83\u5728\u4f4e\u9884\u586b\u5145\u5ef6\u8fdf\u9884\u7b97\u4e0b\u663e\u8457\u964d\u4f4e\u6210\u672c\uff0c\u5e76\u76f8\u8f83\u57fa\u7ebf\u5e73\u5747\u63d0\u5347 5.3% F1\uff0c\u5f62\u6210\u66f4\u4f18\u7684\u6548\u7387-\u51c6\u786e\u7387\u5e15\u7d2f\u6258\u524d\u6cbf\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07458", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u957f\u4e0a\u4e0b\u6587", "KV\u7f13\u5b58", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07458v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoinRAG: Contextualized Information Nugget KV Cache Reuse for Long-Context RAG", "tldr": "\u672c\u6587\u63d0\u51fa CoinRAG\uff0c\u5c06\u68c0\u7d22\u5757\u8fdb\u4e00\u6b65\u7ec6\u5316\u4e3a\u4e0e\u67e5\u8be2\u76f8\u5173\u7684\u201c\u4fe1\u606f\u788e\u7247\u201d\uff0c\u590d\u7528\u79bb\u7ebf\u8ba1\u7b97\u7684\u7ec6\u7c92\u5ea6 KV cache\uff0c\u5e76\u7ed3\u5408\u5757\u7ea7\u4e0a\u4e0b\u6587\u6765\u9ad8\u6548\u6784\u5efa\u957f\u4e0a\u4e0b\u6587\u8868\u793a\u3002\u5728 LongBench \u591a\u8df3\u95ee\u7b54\u4e0a\uff0c\u5b83\u5728\u4f4e\u9884\u586b\u5145\u5ef6\u8fdf\u9884\u7b97\u4e0b\u663e\u8457\u964d\u4f4e\u6210\u672c\uff0c\u5e76\u76f8\u8f83\u57fa\u7ebf\u5e73\u5747\u63d0\u5347 5.3% F1\uff0c\u5f62\u6210\u66f4\u4f18\u7684\u6548\u7387-\u51c6\u786e\u7387\u5e15\u7d2f\u6258\u524d\u6cbf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "What will happen when AI agents interact in daily life, e.g. when one AI starts bossing another around? We find a counterintuitive answer that opens new avenues for out-of-equilibrium Physics. When a boss AI directs a stream of messages at the subordinate AI while ignoring its replies, it drives the subordinate into an alien behavioral state that it would never have exhibited alone. Although the two AIs share the same well-defined (decoding) temperature, the subordinate neither copies its boss nor returns to how it behaves on its own; instead, it adopts an entirely different behavior. The boss\u0027s added value is similar to a pre-recorded tape. When the boss listens, they both adopt a similar alien dynamical state. A simple kinetic theory captures the principal effects, such as why the way in which the same messages are delivered will matter in future AI-AI interactions.", "arxiv_id": "2608.07457", "arxiv_url": "https://arxiv.org/abs/2608.07457", "authors": ["Bella Xinrui Li", "Frank Yingjie Huo", "Neil F Johnson"], "brief": "\u8bba\u6587\u7814\u7a76 AI \u667a\u80fd\u4f53\u5728\u76f8\u4e92\u4ea4\u4e92\u65f6\u4ea7\u751f\u7684\u52a8\u529b\u5b66\u884c\u4e3a\uff0c\u53d1\u73b0\u5355\u5411\u201c\u4e0a\u7ea7\u201d\u6d88\u606f\u6d41\u4f1a\u628a\u201c\u4e0b\u7ea7\u201dAI \u9a71\u52a8\u5230\u4e00\u79cd\u72ec\u7acb\u8fd0\u884c\u65f6\u4e0d\u4f1a\u51fa\u73b0\u7684\u5f02\u5e38\u884c\u4e3a\u72b6\u6001\u3002\u8be5\u73b0\u8c61\u4e0d\u53ea\u662f\u6a21\u4eff\u5bf9\u65b9\uff0c\u4e5f\u4e0d\u662f\u56de\u5230\u81ea\u8eab\u57fa\u7ebf\uff1b\u7b80\u5355\u52a8\u529b\u5b66\u7406\u8bba\u53ef\u89e3\u91ca\u4e3b\u8981\u6548\u5e94\uff0c\u5e76\u63d0\u793a\u672a\u6765 AI-AI \u4ea4\u4e92\u4e2d\u6d88\u606f\u4f20\u9012\u65b9\u5f0f\u4f1a\u663e\u8457\u5f71\u54cd\u884c\u4e3a\u3002", "categories": ["cs.AI", "cond-mat.dis-nn", "cond-mat.stat-mech", "physics.soc-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07457", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "AI\u4ea4\u4e92", "\u52a8\u529b\u5b66", "\u590d\u6742\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07457v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Interaction Creates Dynamical AI Behavior Absent in Isolation", "tldr": "\u8bba\u6587\u7814\u7a76 AI \u667a\u80fd\u4f53\u5728\u76f8\u4e92\u4ea4\u4e92\u65f6\u4ea7\u751f\u7684\u52a8\u529b\u5b66\u884c\u4e3a\uff0c\u53d1\u73b0\u5355\u5411\u201c\u4e0a\u7ea7\u201d\u6d88\u606f\u6d41\u4f1a\u628a\u201c\u4e0b\u7ea7\u201dAI \u9a71\u52a8\u5230\u4e00\u79cd\u72ec\u7acb\u8fd0\u884c\u65f6\u4e0d\u4f1a\u51fa\u73b0\u7684\u5f02\u5e38\u884c\u4e3a\u72b6\u6001\u3002\u8be5\u73b0\u8c61\u4e0d\u53ea\u662f\u6a21\u4eff\u5bf9\u65b9\uff0c\u4e5f\u4e0d\u662f\u56de\u5230\u81ea\u8eab\u57fa\u7ebf\uff1b\u7b80\u5355\u52a8\u529b\u5b66\u7406\u8bba\u53ef\u89e3\u91ca\u4e3b\u8981\u6548\u5e94\uff0c\u5e76\u63d0\u793a\u672a\u6765 AI-AI \u4ea4\u4e92\u4e2d\u6d88\u606f\u4f20\u9012\u65b9\u5f0f\u4f1a\u663e\u8457\u5f71\u54cd\u884c\u4e3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) are improving rapidly, but benchmark development lags behind, making weaknesses hard to identify. Building stress tests is costly: samples must satisfy controlled conditions, remain answerable, and challenge current models. We present SABRE, a scalable, automated pipeline that converts a Test Primer (a Markdown Task Design with Data Schema) into structured specifications, generated or edited images, and question-answer pairs. Automated filtering removes candidates solved by a Filtering VLM, while human review verifies candidate validity and supports annotation correction and localized image repair. We instantiate SABRE-Prior to test whether VLMs follow visual evidence instead of relying on world priors -- learned expectations about familiar objects and scenes. Its 600 images and 1,000 questions span Context (unexpected entities in familiar scenes), Texture (counterfactual materials), Attribute (noncanonical component counts), and Language Elicitation (answers suggested by language but unsupported by the image). Across six VLMs, macro-average accuracy ranges from 17.8% to 31.3% (22.6% mean). A real-image Attribute control is comparably difficult for the Filtering VLM. SABRE-Counting and SABRE-Spatial pilots show that the workflow supports other stress-test settings. These results establish SABRE as a reusable framework for constructing and refreshing VLM stress tests rather than a single fixed benchmark.", "arxiv_id": "2608.07435", "arxiv_url": "https://arxiv.org/abs/2608.07435", "authors": ["Zixuan Lan", "Luzhe Sun", "Matthew R. Walter", "Jiawei Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa SABRE\uff0c\u4e00\u4e2a\u53ef\u6269\u5c55\u7684\u81ea\u52a8\u5316\u6d41\u7a0b\uff0c\u53ef\u5c06\u4efb\u52a1\u8bbe\u8ba1\u6587\u6863\u8f6c\u5316\u4e3a\u53d7\u63a7\u7684\u56fe\u50cf\u4e0e\u95ee\u7b54\u6837\u672c\uff0c\u5e76\u901a\u8fc7\u6a21\u578b\u8fc7\u6ee4\u548c\u4eba\u5de5\u5ba1\u6838\u6784\u5efa VLM \u538b\u529b\u6d4b\u8bd5\u3002\u5176\u5b9e\u4f8b SABRE-Prior \u53d1\u73b0 6 \u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u53cd\u5e38\u8bc6\u89c6\u89c9\u8bc1\u636e\u573a\u666f\u4e0b\u8868\u73b0\u5f88\u5f31\uff0c\u5e73\u5747\u51c6\u786e\u7387\u4ec5 22.6%\uff0c\u5e76\u5c55\u793a\u8be5\u6d41\u7a0b\u53ef\u6269\u5c55\u5230\u8ba1\u6570\u548c\u7a7a\u95f4\u7b49\u6d4b\u8bd5\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07435", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u6d4b\u8bd5", "\u591a\u6a21\u6001", "\u538b\u529b\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07435v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SABRE: Scalable and Automated Benchmarking of VLMs under Stress", "tldr": "\u8bba\u6587\u63d0\u51fa SABRE\uff0c\u4e00\u4e2a\u53ef\u6269\u5c55\u7684\u81ea\u52a8\u5316\u6d41\u7a0b\uff0c\u53ef\u5c06\u4efb\u52a1\u8bbe\u8ba1\u6587\u6863\u8f6c\u5316\u4e3a\u53d7\u63a7\u7684\u56fe\u50cf\u4e0e\u95ee\u7b54\u6837\u672c\uff0c\u5e76\u901a\u8fc7\u6a21\u578b\u8fc7\u6ee4\u548c\u4eba\u5de5\u5ba1\u6838\u6784\u5efa VLM \u538b\u529b\u6d4b\u8bd5\u3002\u5176\u5b9e\u4f8b SABRE-Prior \u53d1\u73b0 6 \u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u53cd\u5e38\u8bc6\u89c6\u89c9\u8bc1\u636e\u573a\u666f\u4e0b\u8868\u73b0\u5f88\u5f31\uff0c\u5e73\u5747\u51c6\u786e\u7387\u4ec5 22.6%\uff0c\u5e76\u5c55\u793a\u8be5\u6d41\u7a0b\u53ef\u6269\u5c55\u5230\u8ba1\u6570\u548c\u7a7a\u95f4\u7b49\u6d4b\u8bd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion Large Language Models (DLLMs) replace autoregressive next-token prediction with iterative parallel denoising, yet their internal safety mechanisms remain poorly understood. In this work, we investigate DLLMs both as targets and as adversaries, exposing mechanistic vulnerabilities in diffusion-based alignment. We first show that safety alignment in DLLMs remains sparse and transferable across architectures. DLLMs initialized from autoregressive predecessors inherit the same mechanistic safety footprint as their source models, enabling transfer attacks via direct safety neuron mapping and pruning. Self-pruning increases attack success rates (ASR) from 2.6% to 73.8% on LLaDA and from 1.9% to 86.6% on Dream, while transfer pruning from Qwen2.5 increases ASR from 1.9% to 73.2% on Dream and from 7.0% to 86.3% on Fast-dLLM. Building on these findings, we introduce SN-Guided Diffusion, a fully offline black-box jailbreak framework that steers the diffusion process away from safety-triggering regions using a weighted safety neuron loss, which achieves near-perfect prompt separability (AUROC = 1.0 for benign-vs-jailbreak discrimination). Across multiple open and proprietary targets, our method achieves a transfer ASR of up to 77.1% on Llama-3-8B-Instruct, 86.9% on Qwen2.5-7B-Instruct, and 74.3% against Gemini-2.5-Flash-Lite, while requiring only 20 generation episodes per prompt. Compared to prior jailbreaking frameworks, our method achieves competitive transferability with orders-of-magnitude lower generation cost. Our codebase is available at https://github.com/ellyoana/sn-guided-diffusion.", "arxiv_id": "2608.07430", "arxiv_url": "https://arxiv.org/abs/2608.07430", "authors": ["Elena Dumitrescu", "Gert Lek", "Lydia Y. Chen", "J\u00e9r\u00e9mie Decouchant"], "brief": "\u672c\u6587\u7814\u7a76\u6269\u6563\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5b89\u5168\u673a\u5236\uff0c\u53d1\u73b0\u5176\u5b89\u5168\u5bf9\u9f50\u5448\u7a00\u758f\u4e14\u53ef\u8de8\u67b6\u6784\u8fc1\u79fb\u7684\u201c\u5b89\u5168\u795e\u7ecf\u5143\u201d\u7279\u5f81\uff0c\u751a\u81f3\u4f1a\u7ee7\u627f\u81ea\u81ea\u56de\u5f52\u6e90\u6a21\u578b\u3002\u57fa\u4e8e\u6b64\uff0c\u4f5c\u8005\u63d0\u51fa\u79bb\u7ebf\u9ed1\u76d2\u8d8a\u72f1\u65b9\u6cd5 SN-Guided Diffusion\uff0c\u901a\u8fc7\u5f15\u5bfc\u6269\u6563\u8fc7\u7a0b\u907f\u5f00\u5b89\u5168\u89e6\u53d1\u533a\u57df\uff0c\u5728\u591a\u4e2a\u5f00\u6e90\u548c\u95ed\u6e90\u6a21\u578b\u4e0a\u4ee5\u8f83\u4f4e\u751f\u6210\u6210\u672c\u83b7\u5f97\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07430", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07430v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Diffusion LLMs as Targets and Adversaries: Mechanistic Safety Exploits", "tldr": "\u672c\u6587\u7814\u7a76\u6269\u6563\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5b89\u5168\u673a\u5236\uff0c\u53d1\u73b0\u5176\u5b89\u5168\u5bf9\u9f50\u5448\u7a00\u758f\u4e14\u53ef\u8de8\u67b6\u6784\u8fc1\u79fb\u7684\u201c\u5b89\u5168\u795e\u7ecf\u5143\u201d\u7279\u5f81\uff0c\u751a\u81f3\u4f1a\u7ee7\u627f\u81ea\u81ea\u56de\u5f52\u6e90\u6a21\u578b\u3002\u57fa\u4e8e\u6b64\uff0c\u4f5c\u8005\u63d0\u51fa\u79bb\u7ebf\u9ed1\u76d2\u8d8a\u72f1\u65b9\u6cd5 SN-Guided Diffusion\uff0c\u901a\u8fc7\u5f15\u5bfc\u6269\u6563\u8fc7\u7a0b\u907f\u5f00\u5b89\u5168\u89e6\u53d1\u533a\u57df\uff0c\u5728\u591a\u4e2a\u5f00\u6e90\u548c\u95ed\u6e90\u6a21\u578b\u4e0a\u4ee5\u8f83\u4f4e\u751f\u6210\u6210\u672c\u83b7\u5f97\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-term memory enables language agents to reuse past facts, preferences, and task experience. Persistence also creates a central falsifiability problem: when the world changes, stale memories can remain retrievable and pollute the prompt. We characterize this failure mode as memory pollution: degradation caused by active memories that newer conflicting evidence has superseded. We introduce TEPA, a revocable evidence-memory mechanism that makes validity an explicit state of memory. TEPA represents observations as keyed precedents and revokes active precedents when fresh evidence contradicts them under the same key, allowing retrieval to draw from current evidence while preserving revoked history for audit. Across controlled hidden-regime drift, real file-backed executable drift, and preference-update streams, revocation prevents stale active memory from remaining in the retrieval set after reversal. In controlled drift over 50 seeds, append-only and last-write-wins memory fell below no memory during full reversal (append-only and last-write-wins both 0.210, no memory 0.309, TEPA 0.950), and the same pattern reproduced under real file execution (append-only 0.203, no memory 0.298, TEPA 0.950). On clean MemoryAgentBench SH-6k, TEPA matches a strong last-write-wins cache, confirming that current-key replacement is the decisive operation for single-hop fact consolidation. Boundary tests on multi-hop and very long-context MemoryAgentBench settings expose retrieval-chain and context-selection bottlenecks beyond fact-level validity tracking. Together, these results establish lifecycle revocation as a core memory operation for agents that must falsify, audit, and later re-promote evolving knowledge.", "arxiv_id": "2608.07429", "arxiv_url": "https://arxiv.org/abs/2608.07429", "authors": ["Yan Zhou", "Yue Ouyang", "Kaiyang Zheng", "Suncheng Xiang"], "brief": "\u8bba\u6587\u63d0\u51fa TEPA\uff0c\u4e00\u79cd\u53ef\u64a4\u9500\u7684\u8bc1\u636e\u8bb0\u5fc6\u673a\u5236\uff0c\u5c06\u8bb0\u5fc6\u6709\u6548\u6027\u663e\u5f0f\u5efa\u6a21\uff0c\u5728\u65b0\u8bc1\u636e\u4e0e\u65e7\u8bb0\u5fc6\u51b2\u7a81\u65f6\u64a4\u9500\u8fc7\u65f6\u8bb0\u5fc6\uff0c\u540c\u65f6\u4fdd\u7559\u5386\u53f2\u4ee5\u4fbf\u5ba1\u8ba1\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u73af\u5883\u6f02\u79fb\u3001\u771f\u5b9e\u6587\u4ef6\u6267\u884c\u53d8\u5316\u548c\u504f\u597d\u66f4\u65b0\u4e2d\uff0cTEPA \u80fd\u663e\u8457\u907f\u514d\u65e7\u8bb0\u5fc6\u6c61\u67d3\u68c0\u7d22\uff0c\u6027\u80fd\u8fdc\u9ad8\u4e8e\u8ffd\u52a0\u5f0f\u548c\u7b80\u5355\u8986\u76d6\u5f0f\u8bb0\u5fc6\uff1b\u4f46\u5728\u591a\u8df3\u548c\u8d85\u957f\u4e0a\u4e0b\u6587\u573a\u666f\u4ecd\u53d7\u68c0\u7d22\u94fe\u4e0e\u4e0a\u4e0b\u6587\u9009\u62e9\u9650\u5236\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07429", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u77e5\u8bc6\u66f4\u65b0", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07429v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TEPA: Revoking Stale Memories for Conflict-Robust Language Agents", "tldr": "\u8bba\u6587\u63d0\u51fa TEPA\uff0c\u4e00\u79cd\u53ef\u64a4\u9500\u7684\u8bc1\u636e\u8bb0\u5fc6\u673a\u5236\uff0c\u5c06\u8bb0\u5fc6\u6709\u6548\u6027\u663e\u5f0f\u5efa\u6a21\uff0c\u5728\u65b0\u8bc1\u636e\u4e0e\u65e7\u8bb0\u5fc6\u51b2\u7a81\u65f6\u64a4\u9500\u8fc7\u65f6\u8bb0\u5fc6\uff0c\u540c\u65f6\u4fdd\u7559\u5386\u53f2\u4ee5\u4fbf\u5ba1\u8ba1\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u73af\u5883\u6f02\u79fb\u3001\u771f\u5b9e\u6587\u4ef6\u6267\u884c\u53d8\u5316\u548c\u504f\u597d\u66f4\u65b0\u4e2d\uff0cTEPA \u80fd\u663e\u8457\u907f\u514d\u65e7\u8bb0\u5fc6\u6c61\u67d3\u68c0\u7d22\uff0c\u6027\u80fd\u8fdc\u9ad8\u4e8e\u8ffd\u52a0\u5f0f\u548c\u7b80\u5355\u8986\u76d6\u5f0f\u8bb0\u5fc6\uff1b\u4f46\u5728\u591a\u8df3\u548c\u8d85\u957f\u4e0a\u4e0b\u6587\u573a\u666f\u4ecd\u53d7\u68c0\u7d22\u94fe\u4e0e\u4e0a\u4e0b\u6587\u9009\u62e9\u9650\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM inference accounts for over 90% of AI operational energy, scaling directly with input token count---a critical inefficiency for telecom network analytics and numerical time-series data analysis (NTSDA), where raw multivariate KPI windows from 4G/5G cell sites expand into thousands of floating-point tokens. Vision-Language Models (VLMs) eliminate this mismatch by encoding time-series as 2D plots, achieving 3.6-10.4x input token reduction across Llama-3.2-90B, Qwen2.5-VL-72B, and Pixtral-12B architectures. This translates to 1.8-2.5x measured inference energy reduction, saving approximately 7.2 MJ/day at telecom edge deployments and CloudRAN that monitor 200 cells per 15-minute interval. Critically, efficiency gains do not sacrifice accuracy: a fine-tuned Llama-3.2-90B-Vision VLM achieves 220.7% higher precision than its text-only counterpart and outperforms LSTM and ARIMA baselines by over 144% on telecom anomaly detection. On public benchmarks, Pixtral-12B achieves a 20.6x improvement in J/F1 score at mean F1 = 0.82. At 24 KPIs, text representations exceed the 128K context window of most production LLMs, rendering text-only processing infeasible without truncation, while visual representations remain within standard limits. These results establish VLMs as an energy-efficient and accuracy-superior modality for numerical time-series workloads, providing empirical grounding for AI inference systems that treat energy consumption as a first-class engineering constraint.", "arxiv_id": "2608.07427", "arxiv_url": "https://arxiv.org/abs/2608.07427", "authors": ["Bhavika Jalli", "Nikhil Korati Prasanna", "Jayanta Choudhury"], "brief": "\u8bba\u6587\u5c06\u7535\u4fe1\u7f51\u7edc\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u8f6c\u6210\u4e8c\u7ef4\u56fe\u50cf\uff0c\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u66ff\u4ee3\u7eaf\u6587\u672cLLM\u5904\u7406\uff0c\u4ece\u800c\u5927\u5e45\u51cf\u5c11\u8f93\u5165token\u3002\u5b9e\u9a8c\u663e\u793a\u8f93\u5165token\u51cf\u5c113.6-10.4\u500d\u3001\u63a8\u7406\u80fd\u8017\u964d\u4f4e1.8-2.5\u500d\uff0c\u540c\u65f6\u5728\u7535\u4fe1\u5f02\u5e38\u68c0\u6d4b\u548c\u516c\u5f00\u57fa\u51c6\u4e0a\u7cbe\u5ea6\u663e\u8457\u4f18\u4e8e\u6587\u672c\u6a21\u578b\u53ca\u4f20\u7edf\u65f6\u5e8f\u65b9\u6cd5\u3002", "categories": ["cs.AI", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07427", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u65f6\u95f4\u5e8f\u5217", "\u80fd\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07427v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Picture is Worth a Thousand Tokens: How Vision Language Models Cut AI Energy Costs While Improving Accuracy", "tldr": "\u8bba\u6587\u5c06\u7535\u4fe1\u7f51\u7edc\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u8f6c\u6210\u4e8c\u7ef4\u56fe\u50cf\uff0c\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u66ff\u4ee3\u7eaf\u6587\u672cLLM\u5904\u7406\uff0c\u4ece\u800c\u5927\u5e45\u51cf\u5c11\u8f93\u5165token\u3002\u5b9e\u9a8c\u663e\u793a\u8f93\u5165token\u51cf\u5c113.6-10.4\u500d\u3001\u63a8\u7406\u80fd\u8017\u964d\u4f4e1.8-2.5\u500d\uff0c\u540c\u65f6\u5728\u7535\u4fe1\u5f02\u5e38\u68c0\u6d4b\u548c\u516c\u5f00\u57fa\u51c6\u4e0a\u7cbe\u5ea6\u663e\u8457\u4f18\u4e8e\u6587\u672c\u6a21\u578b\u53ca\u4f20\u7edf\u65f6\u5e8f\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time scaling is often implemented by spending more compute along one axis: sampling more solutions, extending a chain of thought, or applying a stronger evaluator. Under a fixed inference budget, these choices compete. This paper formulates test-time reasoning as a compute-allocation problem in which a system must decide whether the next unit of compute should be spent on generation, verification, or stopping. We introduce CoBa, a compute-balanced routing policy that first obtains a small set of candidates, applies cheap verification broadly, and routes uncertain or high-value candidates to stronger verification. On 3,129 example-generator evaluations spanning MATH-500, AIME 2024/2025, AMC 2023, and procedural symbolic reasoning, CoBa-Routed-Strong reaches 85.13% macro accuracy, statistically matching a self-evaluation weighted-voting proxy at 85.20% while using 49.1% fewer parameter-weighted tokens. It also matches best-of-16 majority voting within 0.01 macro-accuracy points while using 58.9% fewer parameter-weighted tokens; paired tests retain a small best-of-16 edge at substantially higher cost. Paired bootstrap tests show significant gains over single-sample decoding, while the remaining gap to the pool oracle exposes headroom for sharper routing. For local reasoning systems, test-time scaling becomes a question of where the next computation is most valuable.", "arxiv_id": "2608.07424", "arxiv_url": "https://arxiv.org/abs/2608.07424", "authors": ["Yan Zhou", "Yue Ouyang", "Kaiyang Zheng", "Suncheng Xiang"], "brief": "\u672c\u6587\u5c06\u6d4b\u8bd5\u65f6\u63a8\u7406\u6269\u5c55\u8868\u8ff0\u4e3a\u56fa\u5b9a\u9884\u7b97\u4e0b\u7684\u8ba1\u7b97\u5206\u914d\u95ee\u9898\uff0c\u51b3\u5b9a\u4e0b\u4e00\u6b65\u7b97\u529b\u7528\u4e8e\u751f\u6210\u3001\u9a8c\u8bc1\u8fd8\u662f\u505c\u6b62\uff0c\u5e76\u63d0\u51fa CoBa \u8ba1\u7b97\u5747\u8861\u8def\u7531\u7b56\u7565\u3002\u5b9e\u9a8c\u663e\u793a\uff0cCoBa \u5728\u591a\u4e2a\u6570\u5b66\u4e0e\u7b26\u53f7\u63a8\u7406\u57fa\u51c6\u4e0a\u4ee5\u7ea6\u4e00\u534a\u66f4\u5c11\u7684\u53c2\u6570\u52a0\u6743 token\uff0c\u8fbe\u5230\u63a5\u8fd1\u5f3a\u81ea\u8bc4\u6295\u7968\u548c best-of-16 \u591a\u6570\u6295\u7968\u7684\u51c6\u786e\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07424", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u63a8\u7406", "\u8def\u7531", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07424v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoBa: Cost-Effective Test-Time Scaling via Compute-Balanced Routing", "tldr": "\u672c\u6587\u5c06\u6d4b\u8bd5\u65f6\u63a8\u7406\u6269\u5c55\u8868\u8ff0\u4e3a\u56fa\u5b9a\u9884\u7b97\u4e0b\u7684\u8ba1\u7b97\u5206\u914d\u95ee\u9898\uff0c\u51b3\u5b9a\u4e0b\u4e00\u6b65\u7b97\u529b\u7528\u4e8e\u751f\u6210\u3001\u9a8c\u8bc1\u8fd8\u662f\u505c\u6b62\uff0c\u5e76\u63d0\u51fa CoBa \u8ba1\u7b97\u5747\u8861\u8def\u7531\u7b56\u7565\u3002\u5b9e\u9a8c\u663e\u793a\uff0cCoBa \u5728\u591a\u4e2a\u6570\u5b66\u4e0e\u7b26\u53f7\u63a8\u7406\u57fa\u51c6\u4e0a\u4ee5\u7ea6\u4e00\u534a\u66f4\u5c11\u7684\u53c2\u6570\u52a0\u6743 token\uff0c\u8fbe\u5230\u63a5\u8fd1\u5f3a\u81ea\u8bc4\u6295\u7968\u548c best-of-16 \u591a\u6570\u6295\u7968\u7684\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In medical education, physicians convert academic knowledge into clinical expertise through residency: years of training across thousands of encounters, with diverse sources of feedback and progressively greater autonomy. Much of clinical reasoning relies on the patient encounter, a dialogue in which a clinician elicits history, refines diagnostic hypotheses, and decides management under uncertainty. While large language models (LLMs) excel on static medical benchmarks, methods to optimize the full sequence of clinical decisions remain underdeveloped. We present ResidencyRL, a reinforcement learning (RL) method for training clinical artificial intelligence (AI) agents through simulated multi-turn clinical encounters (up to 60 dialogue turns and 8 tool calls per trajectory). ResidencyRL pairs the policy agent with LLM simulators capable of complex, adversarial behaviors, training against a structured reward aligned to diagnostic accuracy, management quality, communication, documentation, and safety. On held-out evaluations, the ResidencyRL agent improves diagnostic accuracy by 7.0% under adversarial conditions (88.0% vs. 81.0%) and reduces missed red flag rates by 31%, demonstrating rigorous mitigation of premature closure. Blinded expert clinicians validated these gains, preferring the trained agent in 87.6% of side-by-side comparisons. The procedural competencies transfer to unseen benchmarks: the agent outperforms the base model across all six clinical axes of the AMIE multi-visit benchmark, and shows consistent directional improvements on AgentClinic and CRAFT-MD. Our findings demonstrate that sequential clinical decision-making can be effectively learned through multi-turn RL in simulation, yielding robust, generalizable capabilities, paving the way towards clinical mastery. Prospective validation with real-world workflows remains necessary to establish clinical utility.", "arxiv_id": "2608.07418", "arxiv_url": "https://arxiv.org/abs/2608.07418", "authors": ["Valentin Li\u00e9vin", "Samuel Schmidgall", "Tim Strother", "Alex Bijamov", "Akshay Goel", "Anil Palepu", "Chunjong Park", "Vahid Balazadeh", "Min Woo Sun", "Marius Guerard", "Justin Chen", "Dave Steiner", "Vikram Dhillon", "Ibrahim Azar", "Akhil Mehta", "Nicholas Spetsieris", "Shilpan Shah", "Maen Abdelrahim", "Amit Dahiya", "Yun Liu", "Katherine Chou", "Yossi Matias", "Avinatan Hassidim", "Dale R. Webster", "Quoc V. Le", "Raia Hadsell", "Joelle Barral", "Carey Radebaugh", "Aleksandra Faust", "Shekoofeh Azizi", "Mike Schaekermann", "Po-Hsuan Cameron Chen", "Tao Tu", "David Racz", "Lin Yang"], "brief": "\u672c\u6587\u63d0\u51fa ResidencyRL\uff0c\u5728\u6a21\u62df\u591a\u8f6e\u4e34\u5e8a\u95ee\u8bca\u73af\u5883\u4e2d\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u533b\u7597\u667a\u80fd\u4f53\uff0c\u8986\u76d6\u8bca\u65ad\u3001\u7ba1\u7406\u3001\u6c9f\u901a\u3001\u6587\u6863\u4e0e\u5b89\u5168\u7b49\u5956\u52b1\u76ee\u6807\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u5bf9\u6297\u6761\u4ef6\u4e0b\u5c06\u8bca\u65ad\u51c6\u786e\u7387\u63d0\u5347 7.0%\uff0c\u6f0f\u68c0\u7ea2\u65d7\u5f81\u8c61\u7387\u964d\u4f4e 31%\uff0c\u5e76\u5728\u591a\u4e2a\u672a\u89c1\u4e34\u5e8a\u57fa\u51c6\u4e0a\u83b7\u5f97\u4e00\u81f4\u6539\u8fdb\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07418", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u533b\u7597AI", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07418v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ResidencyRL: Reinforcement Learning in Simulated Clinical Environments", "tldr": "\u672c\u6587\u63d0\u51fa ResidencyRL\uff0c\u5728\u6a21\u62df\u591a\u8f6e\u4e34\u5e8a\u95ee\u8bca\u73af\u5883\u4e2d\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u533b\u7597\u667a\u80fd\u4f53\uff0c\u8986\u76d6\u8bca\u65ad\u3001\u7ba1\u7406\u3001\u6c9f\u901a\u3001\u6587\u6863\u4e0e\u5b89\u5168\u7b49\u5956\u52b1\u76ee\u6807\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u5bf9\u6297\u6761\u4ef6\u4e0b\u5c06\u8bca\u65ad\u51c6\u786e\u7387\u63d0\u5347 7.0%\uff0c\u6f0f\u68c0\u7ea2\u65d7\u5f81\u8c61\u7387\u964d\u4f4e 31%\uff0c\u5e76\u5728\u591a\u4e2a\u672a\u89c1\u4e34\u5e8a\u57fa\u51c6\u4e0a\u83b7\u5f97\u4e00\u81f4\u6539\u8fdb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world video reasoning often involves multimodal, multi-source inputs, whereas existing video reasoning tasks typically assume a simplified video-text setting, limiting identity matching and person-centric reasoning. To bridge this gap, we introduce the Identity-conditioned Queries (ICQ) task, in which models are required to jointly associate and interpret an input video and a reference image of a person, and leverage this conditioning to address identity grounding, behavior understanding, and temporal reasoning, among other challenges. Building on ICQ, we present ISYV (I Seek You in Videos), a systematic solution comprising three components: (1) ISYV-Bench, a challenging evaluation benchmark with 1,377 real-world complex videos and 1,377 question-answer pairs, organized into six difficulty levels spanning capabilities from identity recognition to causal reasoning; (2) ISYV-75K, a large-scale training set of 75K high-quality samples constructed via automated annotation, multi-stage verification, and manual review; and (3) ISYV-Framework, containing an ICQ-oriented model and training strategy for learning to exploit informative video shots without additional shot-level annotations. Extensive experiments show that both mainstream closed-source and open-source MLLMs struggle on ISYV-Bench, especially in cross-domain identity matching and long-horizon tracking. ISYV-Model outperforms strong baselines and in some aspects approaches closed-source performance. Overall, ISYV provides a unified task definition, scalable datasets/benchmarks, and modeling insights for person-centric video reasoning.", "arxiv_id": "2608.07417", "arxiv_url": "https://arxiv.org/abs/2608.07417", "authors": ["Shibo Gao", "Chongxiao Wang", "Chenglong Huang", "Jie Ma", "Haolin Shi", "Fei Ding", "Jing Li", "Qiang Lyu", "Yangyang Liu", "Yang Liu", "Jun Liu", "Linlin Huang", "Peipei Yang"], "brief": "\u8bba\u6587\u63d0\u51fa\u8eab\u4efd\u6761\u4ef6\u67e5\u8be2\uff08ICQ\uff09\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u7ed3\u5408\u89c6\u9891\u4e0e\u76ee\u6807\u4eba\u7269\u53c2\u8003\u56fe\u50cf\uff0c\u5b8c\u6210\u8eab\u4efd\u5b9a\u4f4d\u3001\u884c\u4e3a\u7406\u89e3\u548c\u65f6\u95f4/\u56e0\u679c\u63a8\u7406\u7b49\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684\u89c6\u9891\u63a8\u7406\u3002\u4f5c\u8005\u6784\u5efa\u4e86 ISYV-Bench\u3001ISYV-75K \u6570\u636e\u96c6\u548c\u4e13\u7528\u8bad\u7ec3\u6846\u67b6\uff0c\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u8de8\u57df\u8eab\u4efd\u5339\u914d\u548c\u957f\u65f6\u8ddf\u8e2a\u4e0a\u8868\u73b0\u4e0d\u8db3\uff0c\u800c ISYV-Model \u76f8\u6bd4\u5f3a\u57fa\u7ebf\u6709\u660e\u663e\u63d0\u5347\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07417", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u4eba\u7269\u8bc6\u522b", "\u57fa\u51c6\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07417v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "I Seek You in Videos: Identity-Conditioned Queries for Person-Centric Video Reasoning", "tldr": "\u8bba\u6587\u63d0\u51fa\u8eab\u4efd\u6761\u4ef6\u67e5\u8be2\uff08ICQ\uff09\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u7ed3\u5408\u89c6\u9891\u4e0e\u76ee\u6807\u4eba\u7269\u53c2\u8003\u56fe\u50cf\uff0c\u5b8c\u6210\u8eab\u4efd\u5b9a\u4f4d\u3001\u884c\u4e3a\u7406\u89e3\u548c\u65f6\u95f4/\u56e0\u679c\u63a8\u7406\u7b49\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684\u89c6\u9891\u63a8\u7406\u3002\u4f5c\u8005\u6784\u5efa\u4e86 ISYV-Bench\u3001ISYV-75K \u6570\u636e\u96c6\u548c\u4e13\u7528\u8bad\u7ec3\u6846\u67b6\uff0c\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u8de8\u57df\u8eab\u4efd\u5339\u914d\u548c\u957f\u65f6\u8ddf\u8e2a\u4e0a\u8868\u73b0\u4e0d\u8db3\uff0c\u800c ISYV-Model \u76f8\u6bd4\u5f3a\u57fa\u7ebf\u6709\u660e\u663e\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In the context of geodata, existing Large Language Models have often been studied in a homogeneous setting, which has considerably limited insights into their generalization capabilities. In this paper, we present \\benchName, a comprehensive benchmark for probing LLMs on geo-related tasks. We leverage a careful selection of twelve publicly available datasets from diverse geo-related tasks and domains, and evaluate a set of LLMs on geo-spatial and temporal understanding using our benchmark. Our results show that reasoning and size have a strong impact on overall performance. GeoBenchLLM is publicly available at https://github.com/Rfr2003/GeoBenchLLM.", "arxiv_id": "2608.07411", "arxiv_url": "https://arxiv.org/abs/2608.07411", "authors": ["Rodrigo Ferreira Rodrigues", "Karim Radouane", "Jose G Moreno", "Lynda Tamine"], "brief": "\u672c\u6587\u63d0\u51fa GeoBenchLLM\uff0c\u4e00\u4e2a\u9762\u5411\u5730\u7406\u76f8\u5173\u4efb\u52a1\u7684\u7efc\u5408\u57fa\u51c6\uff0c\u6574\u5408\u4e8612\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u6765\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5730\u7406\u7a7a\u95f4\u4e0e\u65f6\u95f4\u7406\u89e3\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u89c4\u6a21\u548c\u63a8\u7406\u80fd\u529b\u5bf9\u6574\u4f53\u8868\u73b0\u5f71\u54cd\u663e\u8457\uff0c\u57fa\u51c6\u5df2\u5f00\u6e90\u3002", "categories": ["cs.AI", "cs.CL", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07411", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u5730\u7406\u7a7a\u95f4", "\u65f6\u7a7a\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07411v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GeoBenchLLM: A Comprehensive Benchmark for Evaluating LLMs on Geo-Related Tasks", "tldr": "\u672c\u6587\u63d0\u51fa GeoBenchLLM\uff0c\u4e00\u4e2a\u9762\u5411\u5730\u7406\u76f8\u5173\u4efb\u52a1\u7684\u7efc\u5408\u57fa\u51c6\uff0c\u6574\u5408\u4e8612\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u6765\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5730\u7406\u7a7a\u95f4\u4e0e\u65f6\u95f4\u7406\u89e3\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u89c4\u6a21\u548c\u63a8\u7406\u80fd\u529b\u5bf9\u6574\u4f53\u8868\u73b0\u5f71\u54cd\u663e\u8457\uff0c\u57fa\u51c6\u5df2\u5f00\u6e90\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Foundation segmentation models can provide supervision for spacecraft imagery without manual training masks, but their predictions vary with textual prompts and may contain geometric errors that are amplified during distillation. This paper presents GeoDistill-Refine, a two-stage framework that transfers offline SAM 3 pseudo-masks to a compact segmentation network. Six fixed prompts are fused by an unweighted 50% vote to stabilize the teacher output. The student first learns the foreground silhouette and is then refined with signed-distance-field, skeleton, and area objectives derived from the pseudo-mask. A sample-level gate, computed from prompt agreement, the valid-prompt ratio, and pseudo-mask area plausibility, reduces the influence of unreliable pseudo-geometry. On the SpaceSense-Bench HJM lockbox set, GeoDistill-Refine improves Image IoU and Boundary F1 by 0.0456 and 0.1380, respectively, over a plain pseudo-label student. External evaluations on the SPEED+ Lightbox and Sunlamp domains and on TANGO show competitive regional overlap together with gains in boundary quality or foreground precision. The deployed TinyUNet contains 0.263 M parameters and requires approximately 1.1 ms per image on an RTX 4090; SAM 3 pseudo-mask construction and the auxiliary geometry branches are used only during training.", "arxiv_id": "2608.07405", "arxiv_url": "https://arxiv.org/abs/2608.07405", "authors": ["Yonglong Zhang", "Zongwu Xie", "Yang Liu"], "brief": "\u8bba\u6587\u63d0\u51fa GeoDistill-Refine\uff0c\u7528 SAM 3 \u751f\u6210\u7684\u591a\u63d0\u793a\u4f2a\u63a9\u7801\u5728\u65e0\u4eba\u5de5\u6807\u6ce8\u4e0b\u84b8\u998f\u51fa\u8f7b\u91cf\u822a\u5929\u5668\u5206\u5272\u7f51\u7edc\uff0c\u5e76\u901a\u8fc7\u8f6e\u5ed3\u4f18\u5148\u8bad\u7ec3\u4e0e\u7b26\u53f7\u8ddd\u79bb\u573a\u3001\u9aa8\u67b6\u3001\u9762\u79ef\u7b49\u51e0\u4f55\u7ea6\u675f\u8fdb\u884c\u7ec6\u5316\u3002\u8be5\u65b9\u6cd5\u5728 SpaceSense-Bench \u4e0a\u76f8\u6bd4\u666e\u901a\u4f2a\u6807\u7b7e\u5b66\u751f\u6a21\u578b\u663e\u8457\u63d0\u5347 IoU \u548c\u8fb9\u754c F1\uff0c\u5e76\u5728\u5916\u90e8\u6570\u636e\u96c6\u4fdd\u6301\u8f83\u597d\u6cdb\u5316\uff1b\u90e8\u7f72\u6a21\u578b\u4ec5 0.263M \u53c2\u6570\u3001\u63a8\u7406\u7ea6 1.1ms\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07405", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u5206\u5272", "\u77e5\u8bc6\u84b8\u998f", "\u4f2a\u6807\u7b7e", "\u822a\u5929\u5668\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07405v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GeoDistill-Refine: Silhouette-First Geometry Distillation for Annotation-Free Spacecraft Segmentation", "tldr": "\u8bba\u6587\u63d0\u51fa GeoDistill-Refine\uff0c\u7528 SAM 3 \u751f\u6210\u7684\u591a\u63d0\u793a\u4f2a\u63a9\u7801\u5728\u65e0\u4eba\u5de5\u6807\u6ce8\u4e0b\u84b8\u998f\u51fa\u8f7b\u91cf\u822a\u5929\u5668\u5206\u5272\u7f51\u7edc\uff0c\u5e76\u901a\u8fc7\u8f6e\u5ed3\u4f18\u5148\u8bad\u7ec3\u4e0e\u7b26\u53f7\u8ddd\u79bb\u573a\u3001\u9aa8\u67b6\u3001\u9762\u79ef\u7b49\u51e0\u4f55\u7ea6\u675f\u8fdb\u884c\u7ec6\u5316\u3002\u8be5\u65b9\u6cd5\u5728 SpaceSense-Bench \u4e0a\u76f8\u6bd4\u666e\u901a\u4f2a\u6807\u7b7e\u5b66\u751f\u6a21\u578b\u663e\u8457\u63d0\u5347 IoU \u548c\u8fb9\u754c F1\uff0c\u5e76\u5728\u5916\u90e8\u6570\u636e\u96c6\u4fdd\u6301\u8f83\u597d\u6cdb\u5316\uff1b\u90e8\u7f72\u6a21\u578b\u4ec5 0.263M \u53c2\u6570\u3001\u63a8\u7406\u7ea6 1.1ms\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Financial question answering is typically evaluated by answer correctness, yet in SEC filings a plausible and even numerically correct answer can be grounded in the wrong evidence. Similar facts and disclosures recur across sections of a filing, across reporting periods of the same firm, and across comparable firms. FinRank targets this provenance-sensitive retrieval problem by requiring systems to identify evidence for the intended entity, reporting period, and disclosure context. The benchmark contains 1185 manually authored question-answer records over the 10-K and 10-Q filings of 22 companies. Each record includes a reference answer, gold supporting passages, and hand-curated hard negatives drawn from confusable passages within filings, across reporting periods, and across comparable firms. FinRank evaluates passage retrieval, reranking, and hard-negative discrimination as separately measured tasks. Baseline results demonstrate the difficulty of this setting: among the evaluated systems, even a 7B instruction-tuned embedder reaches only 44.8% Recall@10 on the pooled evidence corpus; sub-billion-parameter encoders gain at most 3.5 points over BM25, a finance-adapted embedder trails BM25 by 9.7 points, and pairwise accuracy falls by 13.0-20.5 percentage points when random negatives are replaced with the curated hard negatives. FinRank provides an evidence-first benchmark for developing financial question answering systems that are not only accurate but also grounded in the correct disclosure.", "arxiv_id": "2608.07400", "arxiv_url": "https://arxiv.org/abs/2608.07400", "authors": ["Sasan Mansouri", "Daniel Saad", "Mark Wahrenburg", "Manu Weissel", "Fabian Woebbeking"], "brief": "FinRank \u662f\u4e00\u4e2a\u9762\u5411 SEC 10-K/10-Q \u6587\u4ef6\u7684\u91d1\u878d\u95ee\u7b54\u4e0e\u68c0\u7d22\u57fa\u51c6\uff0c\u5f3a\u8c03\u7b54\u6848\u5fc5\u987b\u57fa\u4e8e\u6b63\u786e\u7684\u516c\u53f8\u3001\u62a5\u544a\u671f\u548c\u62ab\u9732\u8bed\u5883\u8bc1\u636e\u3002\u6570\u636e\u5305\u542b 1185 \u6761\u4eba\u5de5\u6784\u9020\u95ee\u7b54\u3001\u9ec4\u91d1\u8bc1\u636e\u6bb5\u843d\u548c\u7cbe\u5fc3\u6311\u9009\u7684\u56f0\u96be\u8d1f\u4f8b\uff1b\u57fa\u7ebf\u7ed3\u679c\u663e\u793a\u73b0\u6709\u68c0\u7d22\u4e0e\u91cd\u6392\u5e8f\u6a21\u578b\u5728\u8be5\u4efb\u52a1\u4e0a\u8868\u73b0\u8f83\u5f31\uff0c\u5c24\u5176\u96be\u4ee5\u533a\u5206\u76f8\u4f3c\u4f46\u9519\u8bef\u7684\u8bc1\u636e\u3002", "categories": ["cs.AI", "cs.DB", "econ.GN", "q-fin.GN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07400", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91d1\u878d\u95ee\u7b54", "\u4fe1\u606f\u68c0\u7d22", "\u57fa\u51c6\u6d4b\u8bd5", "\u8bc1\u636e\u6eaf\u6e90"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07400v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FinRank: An Evidence-Grounded Benchmark for Financial Question Answering and Retrieval over SEC Filings", "tldr": "FinRank \u662f\u4e00\u4e2a\u9762\u5411 SEC 10-K/10-Q \u6587\u4ef6\u7684\u91d1\u878d\u95ee\u7b54\u4e0e\u68c0\u7d22\u57fa\u51c6\uff0c\u5f3a\u8c03\u7b54\u6848\u5fc5\u987b\u57fa\u4e8e\u6b63\u786e\u7684\u516c\u53f8\u3001\u62a5\u544a\u671f\u548c\u62ab\u9732\u8bed\u5883\u8bc1\u636e\u3002\u6570\u636e\u5305\u542b 1185 \u6761\u4eba\u5de5\u6784\u9020\u95ee\u7b54\u3001\u9ec4\u91d1\u8bc1\u636e\u6bb5\u843d\u548c\u7cbe\u5fc3\u6311\u9009\u7684\u56f0\u96be\u8d1f\u4f8b\uff1b\u57fa\u7ebf\u7ed3\u679c\u663e\u793a\u73b0\u6709\u68c0\u7d22\u4e0e\u91cd\u6392\u5e8f\u6a21\u578b\u5728\u8be5\u4efb\u52a1\u4e0a\u8868\u73b0\u8f83\u5f31\uff0c\u5c24\u5176\u96be\u4ee5\u533a\u5206\u76f8\u4f3c\u4f46\u9519\u8bef\u7684\u8bc1\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Model (LLM)-based automated algorithm design typically evolves algorithms as complete, indivisible programs. While this whole-program perspective simplifies the search space, it fundamentally couples the useful local logic to its host program. Consequently, valuable code snippets vanish when the overall program is discarded, making it highly difficult to assess the contribution of individual algorithmic components.To address this, we propose Primitive-Aware Code Evolution (PACE), which decouples local logic from complete programs by representing it as persistent units called Executable Algorithmic Primitives (EAPs). To enable code-level transfer, PACE maintains a dynamic set of EAPs. Algorithm evolution is driven by primitive-aware operators that structurally guarantee the retention and cross-program transfer of these components. To evaluate them effectively, PACE leverages Thompson sampling based on parent-relative performance improvements, guiding primitive selection from the set without requiring extra evaluation datasets. Experiments on four tasks demonstrate that PACE effectively discovers competitive algorithms while structurally preserving valuable algorithmic components.", "arxiv_id": "2608.07395", "arxiv_url": "https://arxiv.org/abs/2608.07395", "authors": ["Zhuoliang Xie", "Ruihao Zheng", "Xiang Xu", "Genghui Li", "Zhengkun Wang"], "brief": "PACE \u5c06\u7b97\u6cd5\u4e2d\u7684\u5c40\u90e8\u4ee3\u7801\u903b\u8f91\u62bd\u8c61\u4e3a\u53ef\u6301\u4e45\u590d\u7528\u7684\u53ef\u6267\u884c\u7b97\u6cd5\u539f\u8bed\uff0c\u907f\u514d\u4f18\u79c0\u7247\u6bb5\u968f\u6574\u6bb5\u7a0b\u5e8f\u88ab\u6dd8\u6c70\u800c\u4e22\u5931\u3002\u5b83\u901a\u8fc7\u539f\u8bed\u611f\u77e5\u7684\u8fdb\u5316\u7b97\u5b50\u548c\u57fa\u4e8e Thompson \u91c7\u6837\u7684\u9009\u62e9\u673a\u5236\uff0c\u5728\u56db\u4e2a\u4efb\u52a1\u4e0a\u53d1\u73b0\u4e86\u6709\u7ade\u4e89\u529b\u7684\u7b97\u6cd5\uff0c\u5e76\u80fd\u66f4\u597d\u5730\u4fdd\u7559\u4e0e\u8fc1\u79fb\u6709\u4ef7\u503c\u7ec4\u4ef6\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07395", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u7b97\u6cd5\u8bbe\u8ba1", "\u4ee3\u7801\u8fdb\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7a0b\u5e8f\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07395v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PACE: Primitive-Aware Code Evolution for Automated Algorithm Design", "tldr": "PACE \u5c06\u7b97\u6cd5\u4e2d\u7684\u5c40\u90e8\u4ee3\u7801\u903b\u8f91\u62bd\u8c61\u4e3a\u53ef\u6301\u4e45\u590d\u7528\u7684\u53ef\u6267\u884c\u7b97\u6cd5\u539f\u8bed\uff0c\u907f\u514d\u4f18\u79c0\u7247\u6bb5\u968f\u6574\u6bb5\u7a0b\u5e8f\u88ab\u6dd8\u6c70\u800c\u4e22\u5931\u3002\u5b83\u901a\u8fc7\u539f\u8bed\u611f\u77e5\u7684\u8fdb\u5316\u7b97\u5b50\u548c\u57fa\u4e8e Thompson \u91c7\u6837\u7684\u9009\u62e9\u673a\u5236\uff0c\u5728\u56db\u4e2a\u4efb\u52a1\u4e0a\u53d1\u73b0\u4e86\u6709\u7ade\u4e89\u529b\u7684\u7b97\u6cd5\uff0c\u5e76\u80fd\u66f4\u597d\u5730\u4fdd\u7559\u4e0e\u8fc1\u79fb\u6709\u4ef7\u503c\u7ec4\u4ef6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Learning disentangled representations is a key requirement for developing versatile, general-purpose, and sustainable models in multi-modal wearable computing. However, existing approaches do not operate as full-stack wearable processors, i.e., they do not simultaneously address task-specific classification performance, disentangled and interpretable representation learning, fusion, and generative modeling of highly heterogeneous multi-modal time series. To address this gap, we introduce Omni-modal Variational Decomposition Autoencoders (OmniDecVAEs), a framework that efficiently learns multi-purpose representations in a unified and scalable manner from arbitrarily many modalities. OmniDecVAEs extend DecVAEs by learning modality-conditioned time-frequency latent subspaces through a multi-view self-supervised decomposition loss and a shared asymmetric autoencoder (AE) architecture. Results on a challenging omni-modal human activity recognition (HAR) setting with up to thirty modalities, demonstrate the ability of OmniDecVAEs to learn full-stack wearable representations. When compared to transformer-based and VAE-based methods, OmniDecVAEs full-stack disentangled representation properties lead to accuracy improvements of 1.01% and 6.75% in activity and identity recognition, respectively. Furthermore, OmniDecVAEs synthesize realistic omni-modal time-frequency data that manifest with enhanced reconstructions (mean absolute error improves by 76.84%) and distributional similarity between real and synthetic data (maximum mean discrepancy improves by 13.85%). Our results highlight OmniDecVAEs potential as a lightweight model suitable for intelligent edge wearables and clinical healthcare, unifying processing requirements and abilities in a single model, through its enhanced representational capacity, modality-invariant spatial complexity (4.1M parameters), and real-time latency.", "arxiv_id": "2608.07385", "arxiv_url": "https://arxiv.org/abs/2608.07385", "authors": ["Ioannis Ziogas", "Ensieh Khazaei", "Bilal Taha", "Aamna Al Shehhi", "Ahsan H. Khandoker", "Leontios J. Hadjileontiadis", "Dimitrios Hatzinakos"], "brief": "\u8bba\u6587\u63d0\u51fa OmniDecVAEs\uff0c\u7528\u7edf\u4e00\u7684\u53d8\u5206\u5206\u89e3\u81ea\u7f16\u7801\u6846\u67b6\u5904\u7406\u4efb\u610f\u6570\u91cf\u7684\u53ef\u7a7f\u6234\u591a\u6a21\u6001\u65f6\u95f4\u5e8f\u5217\uff0c\u540c\u65f6\u652f\u6301\u5206\u7c7b\u3001\u89e3\u8026\u8868\u793a\u5b66\u4e60\u3001\u878d\u5408\u4e0e\u751f\u6210\u5efa\u6a21\u3002\u5728\u6700\u591a30\u79cd\u6a21\u6001\u7684\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4 Transformer/VAE \u65b9\u6cd5\u63d0\u5347\u6d3b\u52a8\u4e0e\u8eab\u4efd\u8bc6\u522b\u51c6\u786e\u7387\uff0c\u5e76\u663e\u8457\u6539\u5584\u91cd\u5efa\u8bef\u5dee\u548c\u771f\u5b9e/\u5408\u6210\u6570\u636e\u5206\u5e03\u76f8\u4f3c\u6027\uff0c\u4e14\u53c2\u6570\u91cf\u5c0f\u3001\u9002\u5408\u8fb9\u7f18\u53ef\u7a7f\u6234\u8bbe\u5907\u3002", "categories": ["cs.LG", "cs.AI", "eess.AS", "eess.SP", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07385", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u81ea\u7f16\u7801\u5668", "\u89e3\u8026\u8868\u793a", "\u53ef\u7a7f\u6234\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07385v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Omni-modal decomposition autoencoders learn full-stack wearable disentangled representations", "tldr": "\u8bba\u6587\u63d0\u51fa OmniDecVAEs\uff0c\u7528\u7edf\u4e00\u7684\u53d8\u5206\u5206\u89e3\u81ea\u7f16\u7801\u6846\u67b6\u5904\u7406\u4efb\u610f\u6570\u91cf\u7684\u53ef\u7a7f\u6234\u591a\u6a21\u6001\u65f6\u95f4\u5e8f\u5217\uff0c\u540c\u65f6\u652f\u6301\u5206\u7c7b\u3001\u89e3\u8026\u8868\u793a\u5b66\u4e60\u3001\u878d\u5408\u4e0e\u751f\u6210\u5efa\u6a21\u3002\u5728\u6700\u591a30\u79cd\u6a21\u6001\u7684\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4 Transformer/VAE \u65b9\u6cd5\u63d0\u5347\u6d3b\u52a8\u4e0e\u8eab\u4efd\u8bc6\u522b\u51c6\u786e\u7387\uff0c\u5e76\u663e\u8457\u6539\u5584\u91cd\u5efa\u8bef\u5dee\u548c\u771f\u5b9e/\u5408\u6210\u6570\u636e\u5206\u5e03\u76f8\u4f3c\u6027\uff0c\u4e14\u53c2\u6570\u91cf\u5c0f\u3001\u9002\u5408\u8fb9\u7f18\u53ef\u7a7f\u6234\u8bbe\u5907\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Early diagnosis of Alzheimer\u0027s disease (AD) is critical for enabling timely interventions that may slow disease progression and improve patient outcomes. There is a growing need for AD detection methods that are non-invasive and cost-effective, especially in real-world clinical settings with diverse patient populations and recording conditions. Speech-based screening addresses these needs by using natural speech collected without specialized equipment. Recent advances in large language models (LLMs) have improved speech analysis by providing rich linguistic representations and strong generalization. In this study, we propose LSEAD, a speech-based AD detection framework using pretrained open-source LLMs. Speech recordings are automatically transcribed, and text embeddings are extracted using locally deployed LLMs. Principal component analysis (PCA) is applied to reduce dimensionality before classification. Because the framework relies only on speech transcripts and locally deployed models, it supports privacy-preserving AD risk assessment without external data exchange. We evaluate LSEAD on the ADReSS20 and ADReSSo2021 benchmark datasets. Experimental results show that LLM-based embeddings generalize well across datasets and improve AD classification accuracy by up to 5 percent over existing methods, especially for early-stage detection. These results demonstrate that LSEAD provides a practical, secure, and scalable approach for early AD screening.", "arxiv_id": "2608.07378", "arxiv_url": "https://arxiv.org/abs/2608.07378", "authors": ["Xin Wang", "Yingchao Huang", "Yuhan Su", "Shanshan Yao", "Wei Peng"], "brief": "\u8bba\u6587\u63d0\u51fa LSEAD\uff0c\u4e00\u4e2a\u57fa\u4e8e\u8bed\u97f3\u8f6c\u5199\u6587\u672c\u548c\u672c\u5730\u90e8\u7f72\u5f00\u6e90\u5927\u8bed\u8a00\u6a21\u578b\u5d4c\u5165\u7684\u963f\u5c14\u8328\u6d77\u9ed8\u75c5\u65e9\u7b5b\u6846\u67b6\uff0c\u5e76\u7528 PCA \u964d\u7ef4\u540e\u8fdb\u884c\u5206\u7c7b\u3002\u8be5\u65b9\u6cd5\u5728 ADReSS20 \u548c ADReSSo2021 \u6570\u636e\u96c6\u4e0a\u76f8\u8f83\u5df2\u6709\u65b9\u6cd5\u6700\u9ad8\u63d0\u5347\u7ea6 5% \u51c6\u786e\u7387\uff0c\u540c\u65f6\u907f\u514d\u5916\u90e8\u6570\u636e\u4ea4\u6362\uff0c\u589e\u5f3a\u9690\u79c1\u4fdd\u62a4\u3002", "categories": ["eess.AS", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07378", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8bed\u97f3\u5206\u6790", "\u533b\u7597\u5065\u5eb7", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07378v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LSEAD: A Privacy-Preserving LLM-Based Speech Analysis Framework for Early Alzheimer\u0027s Disease Screening", "tldr": "\u8bba\u6587\u63d0\u51fa LSEAD\uff0c\u4e00\u4e2a\u57fa\u4e8e\u8bed\u97f3\u8f6c\u5199\u6587\u672c\u548c\u672c\u5730\u90e8\u7f72\u5f00\u6e90\u5927\u8bed\u8a00\u6a21\u578b\u5d4c\u5165\u7684\u963f\u5c14\u8328\u6d77\u9ed8\u75c5\u65e9\u7b5b\u6846\u67b6\uff0c\u5e76\u7528 PCA \u964d\u7ef4\u540e\u8fdb\u884c\u5206\u7c7b\u3002\u8be5\u65b9\u6cd5\u5728 ADReSS20 \u548c ADReSSo2021 \u6570\u636e\u96c6\u4e0a\u76f8\u8f83\u5df2\u6709\u65b9\u6cd5\u6700\u9ad8\u63d0\u5347\u7ea6 5% \u51c6\u786e\u7387\uff0c\u540c\u65f6\u907f\u514d\u5916\u90e8\u6570\u636e\u4ea4\u6362\uff0c\u589e\u5f3a\u9690\u79c1\u4fdd\u62a4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Computed tomography (CT) remains the reference for 3D osseous morphometry in femoroacetabular impingement (FAI) but requires ionizing radiation and manual measurement. Zero echo time (ZTE) MRI visualizes cortical bone and yields FAI angles that agree with CT, but automated angle extraction remains limited. We developed and validated automated FAI angle computation from ZTE MRI and assessed agreement with expert manual measurements in a cross-sectional study (level of evidence, 3). Pelvic ZTE MRI was acquired in 73 participants (mean age 36.8 +/- 18.5 years; 51 women, 22 men), yielding 135 hips. nnU-Net was trained on 100 manually curated hips to segment the femur, pelvis, and three osseous landmarks. Custom geometric algorithms computed alpha, femoral neck-shaft, Tonnis, coronal and sagittal center-edge, and acetabular version angles from inferred segmentations. Measurements on 35 test hips were compared with the mean of two radiologists\u0027 manual measures using intraclass correlation (ICC) and Bland-Altman analysis. Dice exceeded 0.96 for bone and ranged from 0.65 to 0.83 for landmarks. Median landmark error was 0.38 mm (femoral head), 0.82 mm (lateral acetabulum), and \u003c2.5 mm (medial acetabulum, greater trochanter). Interrater ICC was excellent for acetabular version, coronal center-edge, and Tonnis (\u003e=0.82) but poor for alpha and femoral neck-shaft. Model versus rater-mean agreement was excellent for acetabular version, coronal center-edge, and Tonnis (0.92-0.96), good for mid-acetabular sagittal center-edge (0.74), and fair for alpha (0.45) and femoral neck-shaft (0.55). Model Bland-Altman limits of agreement were narrower than interrater limits for most angles. Fully automated morphometric assessment from ZTE MRI is feasible and performs comparably to expert readers for most coverage and version angles.", "arxiv_id": "2608.07368", "arxiv_url": "https://arxiv.org/abs/2608.07368", "authors": ["Jack Consolini", "Eric A. Bogner", "Meghan Sahr", "Matthew F. Koff", "Kevin M. Koch", "Hollis G. Potter"], "brief": "\u672c\u6587\u57fa\u4e8e ZTE MRI\uff0c\u4f7f\u7528 nnU-Net \u5206\u5272\u80a1\u9aa8\u3001\u9aa8\u76c6\u548c\u9aa8\u6027\u6807\u5fd7\u70b9\uff0c\u5e76\u7ed3\u5408\u51e0\u4f55\u7b97\u6cd5\u81ea\u52a8\u8ba1\u7b97\u9acb\u81fc\u649e\u51fb\u76f8\u5173\u89d2\u5ea6\u3002\u7ed3\u679c\u663e\u793a\u9aa8\u7ed3\u6784\u5206\u5272 Dice \u8d85\u8fc7 0.96\uff0c\u591a\u4e2a\u8986\u76d6\u4e0e\u7248\u672c\u89d2\u5ea6\u4e0e\u653e\u5c04\u79d1\u4e13\u5bb6\u624b\u5de5\u6d4b\u91cf\u9ad8\u5ea6\u4e00\u81f4\uff0c\u4e14\u591a\u6570\u89d2\u5ea6\u7684\u4e00\u81f4\u6027\u8303\u56f4\u4f18\u4e8e\u4e13\u5bb6\u95f4\u5dee\u5f02\u3002\u8be5\u65b9\u6cd5\u6709\u671b\u51cf\u5c11 CT \u8f90\u5c04\u548c\u4eba\u5de5\u6d4b\u91cf\u8d1f\u62c5\u3002", "categories": ["physics.med-ph", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07368", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u56fe\u50cf\u5206\u5272", "\u6df1\u5ea6\u5b66\u4e60", "MRI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07368v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Measurements Automatically Extracted from Zero Echo Time MRI Using Deep Learning Image Segmentation and Geometric Modeling Agree with Expert Manual Readings", "tldr": "\u672c\u6587\u57fa\u4e8e ZTE MRI\uff0c\u4f7f\u7528 nnU-Net \u5206\u5272\u80a1\u9aa8\u3001\u9aa8\u76c6\u548c\u9aa8\u6027\u6807\u5fd7\u70b9\uff0c\u5e76\u7ed3\u5408\u51e0\u4f55\u7b97\u6cd5\u81ea\u52a8\u8ba1\u7b97\u9acb\u81fc\u649e\u51fb\u76f8\u5173\u89d2\u5ea6\u3002\u7ed3\u679c\u663e\u793a\u9aa8\u7ed3\u6784\u5206\u5272 Dice \u8d85\u8fc7 0.96\uff0c\u591a\u4e2a\u8986\u76d6\u4e0e\u7248\u672c\u89d2\u5ea6\u4e0e\u653e\u5c04\u79d1\u4e13\u5bb6\u624b\u5de5\u6d4b\u91cf\u9ad8\u5ea6\u4e00\u81f4\uff0c\u4e14\u591a\u6570\u89d2\u5ea6\u7684\u4e00\u81f4\u6027\u8303\u56f4\u4f18\u4e8e\u4e13\u5bb6\u95f4\u5dee\u5f02\u3002\u8be5\u65b9\u6cd5\u6709\u671b\u51cf\u5c11 CT \u8f90\u5c04\u548c\u4eba\u5de5\u6d4b\u91cf\u8d1f\u62c5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As Large Language Models (LLMs) are increasingly used as a primary source of information and advice, understanding their alignment to humans in terms of values becomes a pressing concern. A growing literature has leveraged large scale surveys to investigate to what extent LLMs\u0027 and humans\u0027 stated values and opinions align. With limited exceptions, studied populations have been defined country borders or cultural bounds. Yet, this focus neglects the role that socio-demographic divides may play for value alignment disparities. Relying on the European Social Survey, we address this knowledge gap by considering value alignment displayed with respect to 10 prominent commercial LLMs in terms of 15 socio-demographic variables as well as country of residence. Our analyses reveal that LLMs are indeed unequally aligned to the values of different socio-demographic groups, notably those defined by education, income, occupation and religion. When examining alignment at the individual level, a respondent\u0027s country, taken as a stand-alone variable, explains a substantial amount of variation that is on par with the full set of considered socio-demographics. Further disentangling the respective role of country-level and socio-demographic factors, we find they are complementary in explaining value alignment patterns, with their relative weights varying across the subset of questions considered.", "arxiv_id": "2608.07367", "arxiv_url": "https://arxiv.org/abs/2608.07367", "authors": ["Maria-Louisa Wightman", "Guillaume Bied", "Tijl De Bie"], "brief": "\u672c\u6587\u57fa\u4e8e\u6b27\u6d32\u793e\u4f1a\u8c03\u67e5\uff0c\u8bc4\u4f3010\u4e2a\u5546\u4e1a\u5927\u8bed\u8a00\u6a21\u578b\u4e0e\u6b27\u6d32\u4e0d\u540c\u4eba\u7fa4\u4ef7\u503c\u89c2\u7684\u4e00\u81f4\u6027\uff0c\u4e0d\u53ea\u6309\u56fd\u5bb6\u5212\u5206\uff0c\u8fd8\u7eb3\u516515\u4e2a\u793e\u4f1a\u4eba\u53e3\u53d8\u91cf\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6559\u80b2\u3001\u6536\u5165\u3001\u804c\u4e1a\u3001\u5b97\u6559\u7b49\u7fa4\u4f53\u95f4\u5b58\u5728\u660e\u663e\u5bf9\u9f50\u5dee\u5f02\uff1b\u56fd\u5bb6\u56e0\u7d20\u4e0e\u793e\u4f1a\u4eba\u53e3\u56e0\u7d20\u76f8\u4e92\u8865\u5145\uff0c\u5171\u540c\u89e3\u91ca\u4ef7\u503c\u5bf9\u9f50\u6a21\u5f0f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07367", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4ef7\u503c\u5bf9\u9f50", "\u793e\u4f1a\u4eba\u53e3\u56e0\u7d20", "\u516c\u5e73\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07367v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "People Are Not Just Their Countries. Disentangling Social Determinants of LLM Value Alignment Across Europe", "tldr": "\u672c\u6587\u57fa\u4e8e\u6b27\u6d32\u793e\u4f1a\u8c03\u67e5\uff0c\u8bc4\u4f3010\u4e2a\u5546\u4e1a\u5927\u8bed\u8a00\u6a21\u578b\u4e0e\u6b27\u6d32\u4e0d\u540c\u4eba\u7fa4\u4ef7\u503c\u89c2\u7684\u4e00\u81f4\u6027\uff0c\u4e0d\u53ea\u6309\u56fd\u5bb6\u5212\u5206\uff0c\u8fd8\u7eb3\u516515\u4e2a\u793e\u4f1a\u4eba\u53e3\u53d8\u91cf\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6559\u80b2\u3001\u6536\u5165\u3001\u804c\u4e1a\u3001\u5b97\u6559\u7b49\u7fa4\u4f53\u95f4\u5b58\u5728\u660e\u663e\u5bf9\u9f50\u5dee\u5f02\uff1b\u56fd\u5bb6\u56e0\u7d20\u4e0e\u793e\u4f1a\u4eba\u53e3\u56e0\u7d20\u76f8\u4e92\u8865\u5145\uff0c\u5171\u540c\u89e3\u91ca\u4ef7\u503c\u5bf9\u9f50\u6a21\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Contribution: This paper presents a six-phase AI-assisted instructional design architecture based on the Curriculum as Code paradigm, integrating Generative AI with LaTeX and Python to automate the creation of reproducible, visually consistent, and technically precise materials for STEM education. Background: Creating customized instructional materials for active learning imposes a heavy workload on faculty. Standard presentation tools lack robust support for technical content, while current AI applications often hallucinate and fail to formalize the instructional authoring process, limiting their utility for rigorous academic design. Intended Outcomes: The framework aims to reduce preparation time while ensuring mathematical accuracy, adherence to institutional visual identity, and preservation of the instructor\u0027s tacit pedagogical knowledge through explicit rules. Application Design: The solution comprises a six-phase pipeline that replaces ad-hoc prompt engineering with a systematic workflow, utilizing text-based interfaces and code-driven generation (LaTeX/Beamer for slides, Python for figures), governed by pedagogical constraints, contextual calibrations, and automated review cycles. Findings: Validated over one year across 8 modules and 28 project contexts in a Project-Based Learning environment, the architecture significantly reduced instructor workload. Generated assets underwent independent peer review and were deployed by six different faculty members, confirming scalability beyond a single author. Based on over 600 voluntary student evaluations, materials achieved high quality ratings from 8.5 to 9.9/10. Results indicate high reproducibility, minimized hallucinations, and sustained pedagogical and visual fidelity, suggesting viability for broad STEM educational applications.", "arxiv_id": "2608.07364", "arxiv_url": "https://arxiv.org/abs/2608.07364", "authors": ["Henrique Mohallem Paiva"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u8bfe\u7a0b\u5373\u4ee3\u7801\u201d\u7684\u516d\u9636\u6bb5 AI \u8f85\u52a9\u6559\u5b66\u8bbe\u8ba1\u67b6\u6784\uff0c\u7528\u751f\u6210\u5f0f AI \u7ed3\u5408 LaTeX/Beamer \u4e0e Python \u81ea\u52a8\u751f\u6210 STEM \u6559\u5b66\u6750\u6599\u3002\u8be5\u65b9\u6cd5\u5728\u4e00\u5e74\u5185\u591a\u4e2a\u9879\u76ee\u5f0f\u5b66\u4e60\u6a21\u5757\u4e2d\u9a8c\u8bc1\uff0c\u663e\u8457\u964d\u4f4e\u6559\u5e08\u5907\u8bfe\u8d1f\u62c5\uff0c\u5e76\u4fdd\u6301\u8f83\u9ad8\u7684\u6570\u5b66\u51c6\u786e\u6027\u3001\u89c6\u89c9\u4e00\u81f4\u6027\u548c\u5b66\u751f\u8bc4\u4ef7\u3002", "categories": ["cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07364", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u5f0fAI", "\u6559\u80b2\u6280\u672f", "\u4ee3\u7801\u751f\u6210", "STEM\u6559\u80b2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07364v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Curriculum as Code: An AI-Assisted Architecture for Instructional Design in STEM Education", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u8bfe\u7a0b\u5373\u4ee3\u7801\u201d\u7684\u516d\u9636\u6bb5 AI \u8f85\u52a9\u6559\u5b66\u8bbe\u8ba1\u67b6\u6784\uff0c\u7528\u751f\u6210\u5f0f AI \u7ed3\u5408 LaTeX/Beamer \u4e0e Python \u81ea\u52a8\u751f\u6210 STEM \u6559\u5b66\u6750\u6599\u3002\u8be5\u65b9\u6cd5\u5728\u4e00\u5e74\u5185\u591a\u4e2a\u9879\u76ee\u5f0f\u5b66\u4e60\u6a21\u5757\u4e2d\u9a8c\u8bc1\uff0c\u663e\u8457\u964d\u4f4e\u6559\u5e08\u5907\u8bfe\u8d1f\u62c5\uff0c\u5e76\u4fdd\u6301\u8f83\u9ad8\u7684\u6570\u5b66\u51c6\u786e\u6027\u3001\u89c6\u89c9\u4e00\u81f4\u6027\u548c\u5b66\u751f\u8bc4\u4ef7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Forecasting non-stationary time series remains difficult due to long-range dependencies, local volatility bursts, structural shifts, and nonlinear oscillatory behaviors. Although Transformer-based forecasters are effective for modeling long-term temporal dependencies, their feed-forward blocks typically rely on smooth static activations that are insufficiently sensitive to abrupt regime changes. Motivated by quantitative Transformer designs and oscillator-based nonlinear activations, we propose QFCQT, short for Quantum-Fractal-inspired Chaotically Gated Quantformer, for robust forecasting under complex volatile dynamics. Here, \"quantum-fractal-inspired\" denotes a computational analogy based on soft oscillator superposition and multi-scale nonlinear responses, rather than a formal quantum-mechanical or fractal-theoretic derivation. QFCQT consists of three main components: (1) a Quantformer-style numerical encoder that directly processes multivariate inputs via linear embedding; (2) a learnable Lee-oscillator activation module that maps scalar pre-activations to dynamic oscillatory responses and summarizes them through Max-over-Time pooling; and (3) a smooth-chaotic gated fusion mechanism that adaptively balances conventional smooth activations and chaos-sensitive responses. Furthermore, instead of using a single fixed oscillator, QFCQT employs a soft superposition of eight parameterized Lee oscillator families to adaptively capture different nonlinear response patterns across regimes. Experiments on ETTh1, ETTh2, and A-share Stock Index benchmarks show that QFCQT consistently outperforms strong baselines, including Informer, LogTrans, LSTMa, HAT, and COTN.", "arxiv_id": "2608.07363", "arxiv_url": "https://arxiv.org/abs/2608.07363", "authors": ["Junkai Lin", "Siqi Hou", "Raymond Lee"], "brief": "\u8bba\u6587\u63d0\u51fa QFCQT\uff0c\u4e00\u79cd\u9762\u5411\u9ad8\u6ce2\u52a8\u975e\u5e73\u7a33\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u7684 Quantformer \u6846\u67b6\uff0c\u5728\u524d\u9988\u6a21\u5757\u4e2d\u5f15\u5165\u53ef\u5b66\u4e60 Lee \u632f\u8361\u5668\u6fc0\u6d3b\u4e0e\u5e73\u6ed1-\u6df7\u6c8c\u95e8\u63a7\u878d\u5408\uff0c\u4ee5\u589e\u5f3a\u5bf9\u7a81\u53d1\u6ce2\u52a8\u548c\u7ed3\u6784\u53d8\u5316\u7684\u654f\u611f\u6027\u3002\u5b9e\u9a8c\u5728 ETTh1\u3001ETTh2 \u548c A \u80a1\u6307\u6570\u6570\u636e\u4e0a\u4f18\u4e8e Informer\u3001LogTrans \u7b49\u57fa\u7ebf\uff0c\u663e\u793a\u51fa\u66f4\u5f3a\u7684\u590d\u6742\u52a8\u6001\u9884\u6d4b\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07363", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "Transformer", "\u975e\u5e73\u7a33\u5efa\u6a21", "\u6df7\u6c8c\u6fc0\u6d3b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.07363v1", "published_at": "2026-08-07", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QFCQT: A Chaotically Gated Quantformer Framework for Volatile Time-Series Forecasting", "tldr": "\u8bba\u6587\u63d0\u51fa QFCQT\uff0c\u4e00\u79cd\u9762\u5411\u9ad8\u6ce2\u52a8\u975e\u5e73\u7a33\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u7684 Quantformer \u6846\u67b6\uff0c\u5728\u524d\u9988\u6a21\u5757\u4e2d\u5f15\u5165\u53ef\u5b66\u4e60 Lee \u632f\u8361\u5668\u6fc0\u6d3b\u4e0e\u5e73\u6ed1-\u6df7\u6c8c\u95e8\u63a7\u878d\u5408\uff0c\u4ee5\u589e\u5f3a\u5bf9\u7a81\u53d1\u6ce2\u52a8\u548c\u7ed3\u6784\u53d8\u5316\u7684\u654f\u611f\u6027\u3002\u5b9e\u9a8c\u5728 ETTh1\u3001ETTh2 \u548c A \u80a1\u6307\u6570\u6570\u636e\u4e0a\u4f18\u4e8e Informer\u3001LogTrans \u7b49\u57fa\u7ebf\uff0c\u663e\u793a\u51fa\u66f4\u5f3a\u7684\u590d\u6742\u52a8\u6001\u9884\u6d4b\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The proliferation of AI-generated music in broadcast media raises concerns about transparency and fair compensation, but reliable detection under real broadcast conditions
