ards suffers from sparse supervision, particularly on difficult, long-horizon tasks where successful trajectories are rare and costly to generate. On-Policy Distillation (OPD) offers an attractive alternative by providing dense token-level supervision from a stronger teacher along the student\u0027s own generations. Self-distillation methods further remove the need for a separate teacher model by conditioning the same policy on privileged information to serve as its own teacher. However, privileged conditioning alone does not guarantee that the resulting distillation update improves the student. Indeed, privileged information can lead the teacher to solve tasks through shortcuts unavailable to the student, producing supervision poorly matched to the student\u0027s current behavior. Consequently, even a higher-performing teacher can provide guidance that degrades student performance. To address this, we analyze how the choice of privileged teacher affects the student\u0027s update. We derive a necessary and sufficient condition for the teacher\u0027s local distillation update to be a positive multiple of the student\u0027s reward gradient. Our analysis suggests that the teacher should not only perform well on the task, but also provide guidance suited to the student\u0027s current capabilities. This characterization motivates a practical teacher-training surrogate that combines outcome rewards with token-level Kullback-Leibler (KL) regularization toward the student. Based on this result, we propose Joint On-Policy Learning and Teaching (JOLT), which jointly trains a single policy in two roles: a privileged teacher using a KL-regularized objective, and an unprivileged student using dense on-policy distillation. Across mathematical reasoning, coding, tool use, and terminal use, JOLT improves training efficiency and performance, with further gains from student rewards.", "arxiv_id": "2610.10447", "arxiv_url": "https://arxiv.org/abs/2610.10447", "authors": ["Randy Ardywibowo", "Arnav Dalal", "Jiantao Jiao"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10447", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.10447v1", "published_at": "2026-10-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A Good Self-Teacher Meets the Student Where They Are: Joint On-Policy Learning and Teaching", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As option markets grow and AI advances, agentic systems for option trading are gaining increasing attention. Language-model-based agents can reason over contextual information such as news, but option trading presents a particularly challenging decision problem: a single stock can have thousands of contracts, and the agent must decide both which contracts to trade and how to combine them. Existing approaches often sidestep this complexity by restricting the policy to a fixed strategy structure, such as a straddle, limiting their ability to switch strategies as market conditions change. We present SOTA (Stock Options Trading Agents), an agentic trading framework for structured option-strategy selection. SOTA abstracts the large option universe into strategy-level decisions while deterministic resolvers handle portfolio implementation. We develop SOTA by post-training Qwen3.8-27B with supervised fine-tuning followed by reinforcement learning. SOTA is evaluated on options on nine large-cap U.S. equities and SPY against rule-based and machine-learning strategy selectors in the same trading environment. Over a six-month out-of-sample period, SOTA earns an 18.3% total return with a Sharpe ratio of 1.60 and a maximum drawdown of 8.96%. We also document an asymmetric role of news: news improves frontier-teacher trajectories, but retaining news during reinforcement learning reduces out-of-sample return from 18.3% to -2.7%.", "arxiv_id": "2610.10407", "arxiv_url": "https://arxiv.org/abs/2610.10407", "authors": ["Yizhen Xie", "Mengyang Liu"], "brief": "", "categories": ["cs.AI", "cs.LG", "q-fin.PM", "q-fin.TR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10407", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.10407v1", "published_at": "2026-10-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SOTA: Stock Options Trading Agents Guided by Option-Implied Return Distributions", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Knowledge-intensive tasks require answering many questions by reasoning about a shared corpus of artifacts (e.g., court cases, or scientific literature). As humans interact with these corpora, they naturally accumulate experiential knowledge about artifacts, enabling them to quickly identify the complete set of relevant artifacts for each new task. However, existing AI agents lack appropriate memory solutions to build or reuse such artifact-grounded experience, leading to lower answer quality and higher online cost. Existing memory solutions extract and reuse information from prior task-solving traces, but they primarily focus on user preferences, factual attributes, or abstract reasoning patterns rather than persistent artifact-specific knowledge. We introduce ExperienceIndex, a novel experience layer for AI agents that captures and reuses knowledge about artifacts based on prior reasoning traces. ExperienceIndex stores two complementary forms of experience: (i) single-artifact experiences that summarize an artifact\u0027s contribution to prior tasks and (ii) artifact-pair experiences that encode structural relationships discovered during past reasoning. Integrated as lightweight middleware, ExperienceIndex uses an experience retrieval mechanism to guide agents toward the complete set of relevant artifacts for new tasks, improving both answer quality and efficiency. Across diverse corpora and agentic solutions with different search frameworks, ExperienceIndex delivers consistent gains, raising answer quality by up to 11.0 points and reducing online dollar cost by up to 50.5%. We further demonstrate two benefits: (i) cross-task generalization, where experiences accumulated from text-to-SQL tasks transfer to factoid QA tasks over the same artifact corpus, and (ii) teacher-student learning, where experiences from a stronger model enable a weaker model to reach comparable performance.", "arxiv_id": "2610.10091", "arxiv_url": "https://arxiv.org/abs/2610.10091", "authors": ["Peter Baile Chen", "Geoffrey X. Yu", "Xinming Liu", "Samuel Madden", "Dan Roth", "Jacob Andreas", "Doug Downey", "Michael Cafarella"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10091", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.10091v1", "published_at": "2026-10-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ExperienceIndex: Artifact-Grounded Memory", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many annotation projects begin before experts have a stable guideline or enough labels to train a task-specific model. We present Goldsmith, an agentic pipeline that turns a small gold set---expert-annotated calibration examples representing the intended task boundaries---into a reusable structured annotation definition. Goldsmith treats this definition as a trainable textual object. Candidate definitions are run on the same gold examples and scored with an executable structured loss, while the output schema, formatting, retrieval, repair, judging, and human review remain in an external harness. A large language model (LLM) editor converts the highest-loss failures into textual-gradient revisions, which are accepted only when the measured loss decreases. In prompt-optimization comparisons, Goldsmith improves over direct rewriting, OPRO, APE, and PromptBreeder under matched evaluation protocols. The resulting definition also improves downstream annotation when combined with retrieval, score-based routing, and human review across typed span, pair-level relation, and fixed-trigger event-argument tasks. These results show that scarce expert supervision can support both task-definition learning and scalable annotation.", "arxiv_id": "2610.09489", "arxiv_url": "https://arxiv.org/abs/2610.09489", "authors": ["Yihan Li", "Hanyi Zhang", "Xiaoxi Jiang", "Man Guo"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.09489", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.09489v1", "published_at": "2026-10-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Goldsmith: Gold-Loss-Guided Definition Optimization with an Agentic Annotation Harness", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A simulation of a real robot workspace must preserve task-relevant interactions, while policies developed in it must operate on observations available to the real robot. Yet scene reconstruction and policy development are often treated separately. We present Agentic Real-to-Sim-to-Real (Agentic RSR), a framework that links scene reconstruction, policy development, and real-robot execution through the same manipulation task. Given a workspace video, a task description, and a known robot model, an agent recovers metric scale, iteratively refines the scene using visual feedback, and checks task-relevant interactions in MuJoCo. A coding agent then develops an executable policy, progressing from privileged object poses to visual observations and randomized simulation. The policy can interleave multiple observations and actions within one invocation, while the agent uses execution feedback to continue, retry, or revise its approach. A shared task-level interface carries the policy and accumulated experience to the real robot, where fresh observations and safety checks guide execution. Across 18 reconstructed scenes involving two robots, the mean four-view Depth MAE against reference depth estimates is 0.1057 m, the mean Lab $\u0394E_{76}$ is 11.04, and the mean grayscale SSIM is 0.6990. In real-robot experiments, the aggregate task success rate reaches 80% of the simulation task success rate, indicating substantial retention of simulated performance on hardware. Code and reconstructed scene data will be made publicly available.", "arxiv_id": "2610.10479", "arxiv_url": "https://arxiv.org/abs/2610.10479", "authors": ["Yihan Li", "Yating Feng", "Shengjiu Sun", "Jianing Chen", "Hao Ren", "Bowen Yang", "Weisheng Xu", "Qiwei Wu", "Hui Cheng", "Renjing Xu"], "brief": "", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10479", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.10479v1", "published_at": "2026-10-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic RSR: Real-to-Sim-to-Real through Scene Reconstruction and Execution-Grounded Robot Policies", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long video understanding increasingly relies on external memory to organize massive visual streams into compact representations. However, most memory-based methods dynamically adapt how information is retrieved for different questions, while largely fixing what is remembered. This mismatch makes missing details costly to recover, whereas stored information is valuable only when it can be reliably retrieved. To address this issue, we propose VideoEvolve, a novel self-evolving framework that jointly evolves memory and retrieval for long video understanding. Specifically, starting from a coarse low-frame-rate overview, VideoEvolve couples a Memory Evolver for selective memory augmentation with a Retrieval Evolver for adaptive retrieval over the evolving memory. We then co-evolve the two Evolvers through alternating agentic reinforcement learning (Agentic RL), updating one while freezing the other. To steer this alternating evolution, Bottleneck-Aware Evolution Feedback (BEF) identifies whether the current bottleneck lies in memory or retrieval and directs optimization toward the more limiting side. Furthermore, VideoEvolve introduces Capability-Aware Evolution Feedback (CEF) to alleviate downstream feedback from over-specializing memory to a fixed set of training questions, shifting training toward underdeveloped yet learnable video capabilities. By integrating Agentic RL with BEF and CEF, VideoEvolve transforms downstream reasoning experience into transferable capability updates, providing a concrete path from static long-video systems toward experience-driven, self-improving multimodal intelligence. Extensive experiments on multiple long video understanding benchmarks demonstrate the effectiveness of VideoEvolve.", "arxiv_id": "2610.10183", "arxiv_url": "https://arxiv.org/abs/2610.10183", "authors": ["Yongchao Xu", "Bowen Ye", "Jiefeng Gan", "Junkai Ma", "Wenzhao Li", "Sen Tao", "Yi Wei", "Jiawei Liu"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10183", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.10183v1", "published_at": "2026-10-07", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VideoEvolve: Co-Evolving Memory and Retrieval for Long Video Understanding", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-Policy Distillation (OPD) trains a student on its own generations using teacher feedback. With different tokenizers, comparing teacher and student predictions requires alignment at both sequence and vocabulary levels. In this paper, we examine whether expanding this alignment coverage improves learning. Across three heterogeneous teacher--student pairs on mathematical reasoning and code generation, strict 1:1 groups already cover most student-generated tokens despite substantial vocabulary mismatch. On responses sampled from the students before distillation, the shared vocabulary retains nearly all teacher and student probability mass at strictly aligned positions on average. Restricting reverse KL to a student-selected top-16 subset of the shared vocabulary at each strict position achieves accuracy comparable to full shared-vocabulary OPD, outperforming the evaluated cross-tokenizer baselines. Adding mean squared error supervision on span log-probabilities in mismatch groups gives complete supervision coverage, yet reduces accuracy. At checkpoints from training with only the strict loss, the span gradients show weak or negative directional agreement with the strict gradients and grow in magnitude relative to them. These diagnostics may help explain the accuracy drop from adding span supervision. Our findings motivate a shift from maximizing alignment coverage to prioritizing supervision reliability: compact supervision at strict positions can be more effective than broader coverage that introduces weakly aligned or conflicting training signals.", "arxiv_id": "2610.08448", "arxiv_url": "https://arxiv.org/abs/2610.08448", "authors": ["Bingxi Hou", "Guochao Jiang", "Guofeng Quan", "Weiqing Li", "Wenfeng Feng", "Guohua Liu", "Yuewei Zhang"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.08448", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.08448v1", "published_at": "2026-10-06", "score": 0.139, "selected_reasons": ["HF trending (156\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.08448.png", "title": "Rethinking Cross-Tokenizer On-Policy Distillation: From Alignment Coverage to Supervision Reliability", "tldr": null, "upvotes": 156, "what_it_is": null, "why_notable": null}, {"abstract": "Domain adaptation aims to turn a general-purpose large language model (LLM) into an expert for a target domain. While the dominant SFT+RL pipeline offers a convenient cold start, it may reduce exploration diversity and introduces additional complexity through multi-stage optimization. These limitations motivate RL-only adaptation. However, pure on-policy RL suffers from a cold-start problem, while mixed-policy RL still falls short: informative tokens in teacher outputs are learned too slowly in early training, and stale teacher outputs can hinder later improvement. We identify these two failure modes as Gradient Starvation and Teacher-Distribution Anchoring. To address them, we propose One-stage Policy Optimization (OnePO), which treats teacher outputs as transient guidance for policy improvement. OnePO combines Adaptive Objective Evolution to strengthen learning on informative low-probability teacher tokens and Teacher Retirement to discard teacher outputs once the current policy can surpass them. On medical adaptation, OnePO achieves 67.2 on HealthBench (Total) with only 20K training samples, outperforming SFT+RL and pure RL by 2.7 and 7.4 points, respectively. We further scale OnePO to produce HuatuoGPT-3, an open-source medical LLM series whose 27B variant reaches 70.1 on HealthBench (Total) and 71.4 on HealthBench Professional, surpassing frontier models such as GPT-6 Astra. Models and code are available at https://github.com/FreedomIntelligence/HuatuoGPT-3.", "arxiv_id": "2610.05966", "arxiv_url": "https://arxiv.org/abs/2610.05966", "authors": ["Junying Chen", "Xinyuan Xie", "Ziniu Li", "Wenyuan Gu", "Jianquan Li", "Xiang Wan", "Guangjun Yu", "Ruoyu Sun", "Haizhou Li", "Benyou Wang"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/FreedomIntelligence/HuatuoGPT-3", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.05966", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Chinese University of Hong Kong, Shenzhen", "pdf_url": "https://arxiv.org/pdf/2610.05966v1", "published_at": "2026-10-05", "score": 0.115, "selected_reasons": ["HF trending (23\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05966.png", "title": "HuatuoGPT-3: RL-Only Domain Adaptation from Base Models", "tldr": null, "upvotes": 23, "what_it_is": null, "why_notable": null}, {"abstract": "Assistants from 2011 answered and waited, and agents from 2023 did a task and stopped. In September 2026 Meta\u0027s Muse showed an agent for one person, with accounts, devices, memory and a conversation that lasts, closed, in a vendor\u0027s cloud, in one country. Such an agent is expected to act on a person\u0027s accounts and devices, remember them across weeks, speak first when it is worth it, and answer for what it did. It is a kind of software, not a model, and until now had no open counterpart. This report defines the personal agent in five questions and three horizons. It reads how Muse is built from Meta\u0027s public record and a copy of its production prompt, each statement marked by its source. It then presents nanoMuse, the open-source counterpart under the GPL-3.0, one agent on every device a person owns, with hands on the phone\u0027s screen and the computer\u0027s. They share one conversation over a relay anyone can run; every action goes through a Sentinel, memory is files the person can read, and the model is their choice. Its size and cost are given as estimates. What is open, memory with provenance, an evaluation suite for the hands and an open model for them, is set out as a roadmap.", "arxiv_id": "2610.08699", "arxiv_url": "https://arxiv.org/abs/2610.08699", "authors": ["Guangyi Liu", "Yong Liu", "Jiangning Zhang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/nano-muse/nanoMuse", "github_stars": 229, "hf_url": "https://huggingface.co/papers/2610.08699", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2610.08699v1", "published_at": "2026-10-06", "score": 0.114, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.08699.png", "title": "nanoMuse: An Open-Source Personal Agent for Every Device You Own", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "As agents rapidly evolve, existing benchmarks can become saturated, limiting their ability to distinguish capabilities and reveal remaining failure modes. Particularly in scientific domains, constructing and updating benchmarks requires substantial time, labor, and domain expertise, making it difficult to keep evaluation aligned with advances in agent capabilities. We address this challenge by investigating whether scientific-agent benchmarks can be automatically generated and iteratively adapted as agent capabilities evolve. We introduce AutoSciBench, a framework that represents each task as a high-level concept specifying the scientific domain, data modality, and required reasoning approach, together with a low-level recipe specifying how the question, environment, and ground-truth answer are constructed and verified. Agents attempt to solve each task, producing solver trajectories and corresponding judge feedback which AutoSciBench uses to revise the recipe or concept, closing observed shortcuts and shifting tasks toward raw-data re-examination, interpretation of intermediate results, and evidence integration. Experience distilled from completed refinement trajectories further guides new concept generation, allowing lessons from earlier task refinement to inform subsequent benchmark construction. Starting from existing benchmarks, we evaluate AutoSciBench across computational biology, materials science, and clinical imaging. Generated benchmarks reduce average solver accuracy by 22.4 and 25.5 percentage points relative to the human-curated benchmarks in computational biology and materials science, respectively, while generated tasks receive higher average quality ratings across all three domains, suggesting that scientific-agent evaluation can adapt as agent capabilities advance.", "arxiv_id": "2610.05140", "arxiv_url": "https://arxiv.org/abs/2610.05140", "authors": ["Dongki Kim", "Namkyeong Lee", "Surag Nair", "Carl Edwards", "Xiner Li", "Edward De Brouwer", "Jenna Lynn Collier", "Sung Ju Hwang", "Gabriele Scalia", "Ehsan Hajiramezanali"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05140", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Genentech", "pdf_url": "https://arxiv.org/pdf/2610.05140v1", "published_at": "2026-10-04", "score": 0.094, "selected_reasons": ["HF trending (27\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05140.png", "title": "AutoSciBench: Autonomous Benchmark Generation for Evaluating Scientific Agents", "tldr": null, "upvotes": 27, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) policies often fail when a robot\u0027s executed motion deviates from their commanded action. Such execution errors arise from the robot\u0027s mechanics and operating conditions, such as wear and payload changes. We propose self-compensating VLA, a deployment-time adaptation method that enables a VLA policy to pre-compensate for the robot\u0027s execution errors when generating commands. Without task rewards or labels, it updates the policy online using the residual between the action commanded by a VLA and the motion executed by the robot. To stress-test VLA robustness across execution conditions that are impractical to cover with physical robots alone, we introduce RoboStress, a controlled simulation benchmark. It combines established joint-level models of friction, backlash, compliance, and gravity-compensation error into seven deployment scenarios whose execution errors depend on the robot\u0027s state and motion history. On RoboStress, self-compensating VLA achieves higher average task success than both the base policies and methods that build in robustness during training. On two physical robot arms with different usage histories, it raises the average task success rate by more than 30 percentage points on each arm, and the gains extend to objects not seen in the task demonstrations.", "arxiv_id": "2609.37334", "arxiv_url": "https://arxiv.org/abs/2609.37334", "authors": ["Sohyun Lee", "Yoonjae Baek", "Jaesang Won", "Jinnyeong Kim", "Kang Hyunwoo", "Seung-Hwan Baek", "Ivan Laptev", "Suha Kwak"], "brief": "", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37334", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Pohang University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2609.37334v1", "published_at": "2026-09-29", "score": 0.094, "selected_reasons": ["HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37334.png", "title": "Taming VLAs under Robot Execution Errors: Self-Compensation and Stress Testing", "tldr": null, "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "Low-precision execution can substantially accelerate reinforcement learning (RL) for large language models, but discrepancies between learner and sampler execution can destabilize policy optimization. In this paper, we characterize the interaction between mismatch and the policy-gradient direction, distinguishing locally amplifying from contracting update contributions that mismatch magnitude alone cannot identify. In native NVFP4 runs, we observe an early imbalance between the two amplifying regions, favoring negative-advantage, negative-gap updates. Their tail tokens become concentrated in a small fraction of response segments before mismatch spreads globally. Motivated by these findings, we introduce TRIAGE, a direction-aware stabilization method that uses segment-level diagnosis to selectively rebalance policy-gradient updates and applies bounded repair to residual severe mismatch. TRIAGE modifies the optimization objective while retaining native NVFP4 weight-and activation 4-bit (W4A4) forward execution on both the sampler and learner. Experiments on Qwen3-4B and Qwen3-30B-A3B show stable optimization throughout the evaluated training horizon and achieve full precision level performance across five mathematical reasoning benchmarks, while native NVFP4 with TRIAGE provides up to 2.3x higher rollout throughput than BF16.", "arxiv_id": "2610.07043", "arxiv_url": "https://arxiv.org/abs/2610.07043", "authors": ["Zhen Li", "Shuai Zhang", "Yanggan Gu", "Yiming Zhang", "Yang Yu", "Mingfa Feng", "Congkai Xie", "Shuang Yu", "Junjie Lai", "Hongxia Yang"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/InfiXAI/TRIAGE", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.07043", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "InfiX.ai", "pdf_url": "https://arxiv.org/pdf/2610.07043v1", "published_at": "2026-10-05", "score": 0.088, "selected_reasons": ["HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07043.png", "title": "TRIAGE: Direction-Aware Mismatch Stabilization of Native NVFP4 Reinforcement Learning", "tldr": null, "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "Self-evolving reasoning models learn from their own generated questions, yet repeated self-training can lead to performance collapse. In this paper, we investigate why performance deteriorates over successive rounds and how to sustain self-evolution. Our analysis identifies two recurring quality problems in self-generated questions: invalid questions and repeated variants of the same mathematical questions. First, invalid questions become more prevalent across rounds, and answer-consistency filtering further increases their proportion in training data. Second, existing question diversity controls based on lexical similarity can miss mathematically equivalent questions expressed in different ways, which leads to question diversity collapse in later training rounds. Building on these findings, we introduce R-Quest, which uses question validity and novelty feedback to guide self-evolution. We first train the solver to recognize and reject invalid questions, then use its judgments to guide questioner rewards and filter solver training data. To avoid question repetition, we use a frozen base model to compare sampled question pairs and provide novelty feedback. Empirically, our method consistently achieves the highest average performance on 12 benchmarks in mathematical reasoning, general-domain reasoning, and code generation across two model families. Additionally, R-Quest maintains stable performance gains over ten rounds of self-evolution, peaking in the final round and outperforming R-Zero by 17.32 points.", "arxiv_id": "2610.04299", "arxiv_url": "https://arxiv.org/abs/2610.04299", "authors": ["Jinyuan Li", "Chengsong Huang", "Langlin Huang", "Donghong Cai", "Shiping Gao", "Yuyi Yang", "Jiaxin Huang"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.04299", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Huang\u0027s INTelligence lab", "pdf_url": "https://arxiv.org/pdf/2610.04299v2", "published_at": "2026-10-03", "score": 0.087, "selected_reasons": ["HF trending (23\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04299.png", "title": "Questioning the Questions: Sustaining Self-Evolution in Reasoning Models", "tldr": null, "upvotes": 23, "what_it_is": null, "why_notable": null}, {"abstract": "Asynchronous reinforcement learning (RL) for large language model (LLM) agents trains one policy on trajectories generated by another: rollouts come from stale checkpoints, and the inference engine\u0027s probabilities differ from the trainer\u0027s even at identical parameters. Standard remedies either clip importance ratios, which biases the update, or, as in GRPO, sample a group of responses per prompt, which is costly when episodes are long. We propose KL-Regularized Policy Optimization (KLPO), a framework that anchors the KL regularizer at the sampler. The regularized improvement step then has a closed-form Gibbs solution, and KLPO fits its log-ratio optimality condition by least squares on the sampler\u0027s own trajectories, so the sampler probability enters through a log-ratio and no importance weights are needed. Profiling out the regression intercept replaces the intractable log-partition function with the signal\u0027s sampler mean plus a sampler-to-trainer KL divergence. For token-level policy mirror descent targets, we show that the resulting gradient can be computed from terminal returns without a critic, via sampler-centered scores or a single trajectory residual, even under stochastic tool outputs. We further prove that independent Monte Carlo estimates of the KL term keep these gradients unbiased, derive the exact KL gap of cheaper top-$K$ and binary approximations, and show that SPPO, GPO, REBEL, and BPO arise as special cases of KLPO. The result is a critic-free update that uses one rollout per prompt and requires neither a learned normalizer nor a group of responses.", "arxiv_id": "2610.08963", "arxiv_url": "https://arxiv.org/abs/2610.08963", "authors": ["Yifan Zhang"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/yifanzhang-pro/KLPO", "github_stars": 182, "hf_url": "https://huggingface.co/papers/2610.08963", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "math-ai", "pdf_url": "https://arxiv.org/pdf/2610.08963v1", "published_at": "2026-10-06", "score": 0.086, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.08963.png", "title": "On KL-Regularized Policy Optimization", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy reinforcement learning has become a central paradigm for improving the reasoning abilities of large language models. However, its effectiveness is often limited by reward sparsity: when a model fails to discover correct trajectories for difficult problems, the optimization process receives little useful signal and may stagnate. Existing approaches mitigate this issue by incorporating off-policy demonstrations, expert traces, or model-generated solutions, but they typically require the auxiliary data to match the format of the reinforcement-learning task, often relying on rejection sampling from stronger models to obtain suitable training trajectories. We introduce Rationale-Guided Policy Optimization (RGPO), a framework that adaptively leverages ground-truth rationale information according to the model\u0027s current capability while preserving its freedom to explore. Rather than treating reference solutions as fixed imitation targets, RGPO uses them as temporary scaffolds: rationales help the model generate improved responses, after which only higher-reward, model-generated solutions are transferred back to the original unguided setting. This design allows training to exploit available ground-truth information without requiring off-policy data to follow the same format as the RL task. Across both language-only and vision-language reasoning settings, RGPO consistently improves performance over RLVR baselines, and ablation studies show that adaptive rationale guidance is a key contributor to these gains. These results suggest that RGPO offers a practical and general approach for reducing reward sparsity, stabilizing reinforcement learning, and improving reasoning performance in both text-only and multimodal models.", "arxiv_id": "2610.07342", "arxiv_url": "https://arxiv.org/abs/2610.07342", "authors": ["Hoang Phan", "Minh Pham", "Chau Pham", "Chinmay Hegde", "Trung Le", "Qi Lei"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/VietHoang1512/rgpo", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.07342", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "New York University", "pdf_url": "https://arxiv.org/pdf/2610.07342v1", "published_at": "2026-10-05", "score": 0.078, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07342.png", "title": "Rationale-Guided Policy Optimization: Learning to Reason with Adaptive Rationale Scaffolding", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Mixture-of-experts (MoE) models activate few experts per token, yet batched decoding can access nearly the entire expert pool, making expert-weight traffic a major bottleneck. Expert pruning reduces this traffic, but conventional approaches also prune compute-bound prefill, sacrificing model quality for little throughput benefit. We present SlimWise, a serving framework that tailors the expert pool to each inference phase. SlimWise performs prefill with the full model and decode with a pruned model that directly reuses the prefill-generated KV cache without conversion. Across two MoE backbones and three pruning criteria, this training-free KV cache handoff substantially narrows accuracy gaps relative to the full model in many settings. We also show that benchmark accuracy can conceal substantial pruning-induced changes in generation length. To address these distortions and residual accuracy loss, SlimWise introduces a low-cost distillation stage that trains the decoder to continue from full-model KV caches while updating only a small subset of parameters. Implemented in vLLM, SlimWise supports both prefill-decode (PD) disaggregation and PD-colocated serving. On Qwen3.6-35B-A3B, SlimWise improves decode throughput by up to 1.81x at 50% expert pruning with minimal accuracy loss.", "arxiv_id": "2609.34117", "arxiv_url": "https://arxiv.org/abs/2609.34117", "authors": ["Gunho Park", "Kyoungho Jeun", "Juntaek Oh", "Byeongjun Shin", "Baeseong Park", "Minsoo Rhu"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34117", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34117v1", "published_at": "2026-09-28", "score": 0.077, "selected_reasons": ["HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34117.png", "title": "SlimWise: Decoupling Expert Pruning Across Prefill and Decode for Efficient MoE Serving", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) has emerged as a widely used paradigm for post-training large language models, reducing the train--test mismatch of conventional distillation by supervising the student on its own generated trajectories. However, existing OPD objectives remain largely token-local and outcome-agnostic, optimizing teacher--student agreement at each prefix despite reasoning quality being determined at the trajectory level. Reinforcement learning with verifiable rewards (RLVR), particularly Group Relative Policy Optimization (GRPO), provides complementary outcome-level supervision but suffers from sparse rewards and coarse credit assignment. We show that OPD and RLVR exhibit complementary blind spots: teacher signals provide dense local guidance but are weakly aligned with rollout correctness, whereas group-relative rewards capture task success but provide coarse token-level credit and vanish on all-failure groups. We introduce DiffGate, an outcome-gated objective that combines GRPO with selective, bounded teacher guidance. Teacher supervision is applied only to failed trajectories, scaled by group difficulty, and smoothly bounded to prevent extreme teacher--student discrepancies from dominating optimization. The verifier therefore determines \\emph{which trajectories} receive teacher guidance, while the teacher provides dense token-level update directions within those trajectories. Across Qwen3-0.6B and Qwen3-1.7B students, DiffGate improves code avg@8 over matched GRPO by $+1.7$ and $+1.8$ points and pass@8 by $+1.6$ and $+5.7$ points, respectively. On mathematics, avg@8 remains within $0.5$ points of GRPO while pass@8 improves by $+1.1$ and $+3.9$ points. Overall, DiffGate improves pass@8 across all four model--domain settings, demonstrating improved solution coverage under our evaluation protocol.", "arxiv_id": "2610.04596", "arxiv_url": "https://arxiv.org/abs/2610.04596", "authors": ["Karn Tiwari", "Varnith Chordia", "Prathosh A P"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.04596", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Snapchat Inc.", "pdf_url": "https://arxiv.org/pdf/2610.04596v1", "published_at": "2026-10-03", "score": 0.074, "selected_reasons": ["HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04596.png", "title": "DiffGate: Difficulty-Gated Teacher Guidance for On-Policy Distillation", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) have become increasingly capable problem solvers, but being able to solve a problem is not the same as being able to teach it. Existing approaches to training LLMs as teachers rely on demonstrations, preference data, or predefined pedagogical criteria that specify what good teaching looks like. However, these signals are often not grounded in individual student learning outcomes, where effective teaching strategies can vary substantially across learners. To address this, we introduce Sherpa, a multi-turn reinforcement learning framework that instantiates multiple student archetypes with LLMs conditioned on distinct learning preferences and trains a teacher model to adapt its instruction by directly maximizing their learning outcomes. Teacher LLMs trained with Sherpa improve instructed students\u0027 performance across all archetypes by an average of 20.5 percentage points. Under MathTutorBench\u0027s evaluation, Sherpa raises the overall pedagogy score from 52.5% to 79.2%, indicating better teaching responses. Our human studies show that the trained teacher is preferred over the base model in 79.6% of pairwise comparisons. Together, Sherpa trains LLM teachers to adapt to diverse simulated students and become better aligned with human teachers, paving the road towards AI tutors teaching real students.", "arxiv_id": "2610.08778", "arxiv_url": "https://arxiv.org/abs/2610.08778", "authors": ["Weixian Xu", "Yanzhe Zhang", "Zora Zhiruo Wang", "Changyu Chen", "Diyi Yang"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/SALT-NLP/Sherpa", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.08778", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Social And Language Technology Lab", "pdf_url": "https://arxiv.org/pdf/2610.08778v1", "published_at": "2026-10-06", "score": 0.073, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.08778.png", "title": "Sherpa: Teaching LLMs to Teach Adaptively", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Adaptive LeWorldModel (ALeWM), a world model based on a joint-embedding predictive architecture (JEPA) that learns to concentrate predictive information in compact prefixes of a wide latent representation. To encourage this ordering, ALeWM learns a sequence-conditioned distribution over prefix lengths and trains the predictor to estimate the full next embedding from a sampled input prefix. As standard anti-collapse objectives encourage variation across latent coordinates and do not organize them by predictive importance, we also introduce MixSIGReg. MixSIGReg regularizes the masked embeddings against a prior-weighted mixture with Gaussian active prefixes and zeros in the remaining coordinates. As a result, the ALeWM objective encourages early coordinates to retain information useful for prediction and recursive planning. Our analysis shows that the mixture distribution used by MixSIGReg assigns higher variance to earlier coordinate blocks and lower variance to later ones. In addition, we show that, under specified assumptions, prediction error is minimized by placing the information most useful for prediction in earlier blocks. Empirically, we study the behavior of ALeWM in a controlled dynamical system with known state variables and in goal-conditioned visual control. We show that ALeWM consistently achieves higher mean success rates than tuned fixed-width LeWM, with lower planning capacity on average.", "arxiv_id": "2609.32921", "arxiv_url": "https://arxiv.org/abs/2609.32921", "authors": ["Idan Achituve", "Lior Dikstein", "Idit Diamant", "Arnon Netzer", "Hai Victor Habi"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32921", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Arm", "pdf_url": "https://arxiv.org/pdf/2609.32921v2", "published_at": "2026-09-26", "score": 0.07, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32921.png", "title": "Adaptive Latent Capacity for World Models", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "In cross-lingual zero-shot text-to-speech, the accent of the reference leaks into the target speech. We propose accent analogy guidance (AAG), a training-free sampler term that subtracts an accent direction estimated from the model\u0027s own predictions for one synthetic voice rendered in both languages, so the voice cancels and only the accent remains. By a blind LLM accent judge on real dubbing data, reweighting classifier-free guidance between reference and text, and its variants, stay near one identity-accent trade-off curve; we score a method by its speaker similarity above that curve at equal accent ($\u0394$SIM). Across four open TTS models AAG lies above the curve: on OmniVoice $\u0394$SIM is +0.11 to +0.27 on three test sets (accent 3.51 to 4.28 on a 1-5 scale at speaker similarity 0.29, where reweighting keeps 0.02); MaskGCT and CosyVoice 2 also lie above their curves, and on F5-TTS it is more native than any reweighting setting. An LLM-free language-ID measure and a twelve-listener panel agree. A premise test and the reach of a model\u0027s own curve indicate in advance whether and roughly how much AAG can gain, predicting the one model where it gains nothing (X-Voice).", "arxiv_id": "2609.29123", "arxiv_url": "https://arxiv.org/abs/2609.29123", "authors": ["Yoomee Cho", "Jisun Lee"], "brief": "", "categories": ["cs.SD", "cs.CL", "eess.AS"], "github_repo": "https://github.com/yoomee-cho/accent-analogy-guidance", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.29123", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ESTsoft AI", "pdf_url": "https://arxiv.org/pdf/2609.29123v1", "published_at": "2026-09-24", "score": 0.065, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.29123.png", "title": "Accent Analogy Guidance: More Speaker Similarity at Equal Accent in Cross-Lingual Voice Cloning", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Autoregressive video generation requires denoising the current frames while writing their key-value representations as context for future predictions. However, these two roles typically share parameters, and we find that their gradients exhibit distinct patterns and systematic negative alignment, hindering the joint optimization of visual quality and temporal consistency. We introduce Self Gradient Forcing Plus (SGF+), which assigns separate parameters to context writing and denoising while preserving their interaction through causal attention. Both roles are jointly optimized using the original generation objective without auxiliary losses, with context writing supervised through its contribution to future predictions. This simple change improves visual quality and long-horizon consistency over the evaluated baselines in both framewise and chunkwise generation, without additional video training data or a longer training horizon. Trained on only 5s rollouts, SGF+ supports continuous generation for up to 24 hours without long-video fine-tuning. These results highlight role-specific parameterization as an effective design principle for high-quality autoregressive video generation and native long-horizon extrapolation.", "arxiv_id": "2610.10429", "arxiv_url": "https://arxiv.org/abs/2610.10429", "authors": ["Zihan Su", "Junhao Zhuang", "Yaowei Li", "Siwen Lu", "Haoran Li", "Lingen Li", "Haoyu Wu", "Weiyang Jin", "Songchun Zhang", "Haoyang Huang", "Chun Yuan", "Zeyue Xue", "Nan Duan"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Zihan-Su/Self_Gradient_Forcing_Plus", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10429", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.10429v1", "published_at": "2026-10-07", "score": 0.059, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.10429.png", "title": "SGF+: Decoupling Gradient Flows for Autoregressive Video Generation", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Diffusion Transformers (MM-DiTs) jointly process visual and textual representations throughout generation. These models repeatedly update the text tokens through multimodal attention, forming dynamic contextual tokens whose function is not well understood. In this work, we introduce a framework for reading this contextual space through natural-language interrogation. We train a lightweight bottleneck network that maps intermediate contextual tokens into the input space of a frozen Large Language Model (LLM), allowing the LLM to answer questions about the emerging image directly from these hidden representations. Our reader reveals that contextual tokens encode a rich, global representation of the emerging scene: generation-specific semantics, including attributes left underspecified by the prompt, are accessible surprisingly early in denoising, while increasingly fine-grained details become readable over time. Remarkably, this information remains decodable even when the MM-DiT receives an empty prompt, showing that contextual tokens accumulate substantial image-specific information from the evolving visual representation itself. We further find that generations with more readable contextual representations tend to receive higher human-preference scores. Building on these observations, we introduce Contextual Alignment, a training technique that explicitly reinforces the visual-semantic information encoded in the contextual tokens, improving generation quality and distributional coverage. Together, our results establish contextual tokens as both an interpretable view into the internal dynamics of MM-DiTs and an effective target for improving generative models.", "arxiv_id": "2610.06844", "arxiv_url": "https://arxiv.org/abs/2610.06844", "authors": ["Omer Dahary", "Etai Sella", "Hadar Averbuch-Elor", "Daniel Cohen-Or", "Or Patashnik"], "brief": "", "categories": ["cs.CV", "cs.AI", "cs.GR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.06844", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Tel Aviv University", "pdf_url": "https://arxiv.org/pdf/2610.06844v1", "published_at": "2026-10-05", "score": 0.058, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06844.png", "title": "Learning to Read the Contextual Tokens in Diffusion Transformers", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Recently proposed Drifting Models shift iterative distribution refinement from inference to training, enabling effective one-step generation. However, their performance on complex image datasets depends strongly on the representation used to construct the drifting field: pixel-space drifting performs poorly, whereas pretrained feature spaces substantially improve sample quality for reasons that remain unclear. We trace this gap to the discriminative geometry of the representation, which determines sample weighting in kernel density estimation (KDE) and, consequently drift. We introduce persistent representation learning, which continuously learns a more discriminative representation geometry as the generator evolves across batches. We further establish a current-step gradient equivalence between the KDE ratio loss and drift regression loss under matched conditions, connecting density-ratio-based generator optimization to empirical drifting and motivating direct control of the drifting velocity. Across multiple datasets, our method learns effective discriminative representations directly from pixels and reduces FID by approximately $82-95\\%$ over the original pixel-space Drifting Models, without pretrained encoders. Adapting pretrained representations and applying velocity clipping provide further gains.", "arxiv_id": "2610.04703", "arxiv_url": "https://arxiv.org/abs/2610.04703", "authors": ["Doudou Zhang", "Wenwen Hou", "Yilin Chen", "Qi Chen"], "brief": "", "categories": ["cs.LG", "cs.CV"], "github_repo": "https://github.com/aalto-icl/DiscriminativeGeometryforDrifting", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.04703", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Aalto University", "pdf_url": "https://arxiv.org/pdf/2610.04703v1", "published_at": "2026-10-03", "score": 0.057, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04703.png", "title": "Learning Discriminative Geometry for Drifting Models", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "An agent whose tool keeps returning nothing useful should stop relying on it. In a retrieval environment with controlled source failures, we separate how agents judge results from what they do. We compare stopping at the same step after longer and shorter runs of results the agent judged useless; this contrast is zero for clock- or deadline-driven stopping. Where we record their judgments, the seven agents we test call a failing source\u0027s results useless 97-100% of the time, yet most of them rarely stop on that judgment. Prompt cues change when they stop but not what they stop on. Permission to answer from memory and a reasoning mode can bring early stops regardless of evidence, a stated budget moves the 7-8B models\u0027 stops to the deadline, and a stopping rule or call cost in the prompt is followed at most partly. Stopping follows the evidence only when the harness enforces an integration step that makes the agent answer after five consecutive results it judged useless. This step raises failing-source success for every model, keeps the stopping point fixed when the budget doubles, and needs no extra judgment call when the agent states its judgments. A pre-registered replication on 300 fresh questions confirms the dissociation and the rule\u0027s effect.", "arxiv_id": "2610.06191", "arxiv_url": "https://arxiv.org/abs/2610.06191", "authors": ["Chubin Zhang", "Zhenglin Wan", "Xingrui Yu", "Jingxuan Wu", "Yaxin Zhou", "Ivor Tsang", "Bo An"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/bennidict23/judged-useless-queried-anyway", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.06191", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University Singapore", "pdf_url": "https://arxiv.org/pdf/2610.06191v1", "published_at": "2026-10-05", "score": 0.055, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06191.png", "title": "Judged Useless, Queried Anyway: Tool-Using Agents Rarely Turn Their Own Evidence Judgments into Stopping Decisions", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Image compression, restoration, and generation all require a way to measure how different two images look to a person. Pixel error ignores how people see, while the most accurate perceptual distances are typically fitted to human judgments, tying them to a fixed data and resolution. For example, when image resolution is doubled, the correlation of DISTS with human scores on TID2013 drops from 0.815 to 0.717. We introduce the Jacobian Lens Distance (JLD), which derives its perceptual geometry from a frozen vision encoder rather than from human labels. JLD combines the locality of early patch features with the perceptual sensitivity captured by later encoder representations. Specifically, we use the encoder Jacobian to identify directions in the early feature space that most strongly affect the encoder output, producing a fixed metric tensor, $E[J^\\top J]$, which we call the Jacobian lens. The lens is fitted only once from 100 unlabeled images, taking about 35 seconds. Locally, this construction defines a pullback metric in pixel space, giving JLD a clear geometric interpretation that can be directly analyzed on real images. Across four standard perceptual databases, JLD achieves state-of-the-art performance and consistently outperforms LPIPS, DISTS, PieAPP, and DreamSim. JLD is also robust to changes in image resolution, on TID2013, its lens-term correlation remains nearly unchanged when the resolution is doubled, decreasing only from 0.850 to 0.845. We further introduce JLD-fast, which is $4\\times$ faster than LPIPS-VGG while achieving a mean correlation of 0.911. Finally, JLD naturally extends to video, reaching a correlation of 0.786 on Waterloo IVC 4K compared with 0.611 for VMAF.", "arxiv_id": "2610.05967", "arxiv_url": "https://arxiv.org/abs/2610.05967", "authors": ["Shreshth Saini", "Balu Adsumilli", "Alan C. Bovik"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/shreshthsaini/jld", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.05967", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05967v1", "published_at": "2026-10-05", "score": 0.053, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05967.png", "title": "JLD: Perceptual Distance Through A Jacobian Lens", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "We present DistScene, a framework for single-image compositional 3D scene generation by jointly modeling the environment and individual objects. Unlike existing methods that represent scenes primarily as collections of objects, we model the environment as an explicit scene component to provide geometric context for object placement. Specifically, we introduce Scene-Frame Generation, which jointly generates separate environment and object components in a shared coordinate frame, allowing their geometry and relative placement to be learned together. Then we introduce Object-Centric Refinement to refine each object in a local frame with scene context. Finally, we develop Object-to-Scene Distillation to transfer pretrained object-generation priors to scene generation through automatically composed and rendered synthetic scenes. Evaluations on indoor and outdoor benchmarks demonstrate improved scene-level spatial coherence over the evaluated baselines. Project page: https://coolbeam.github.io/DistScene/", "arxiv_id": "2610.06960", "arxiv_url": "https://arxiv.org/abs/2610.06960", "authors": ["Kunming Luo", "Hongyu Yan", "Ken Deng", "Chengcheng Zhou", "Tianyu Liu", "Haipeng Li", "Haibin Huang", "Xuelong Li", "Ping Tan"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.06960", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.06960v1", "published_at": "2026-10-03", "score": 0.051, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06960.png", "title": "DistScene: Object-to-Scene Distillation for 3D Scene Generation", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "A trainable input embedding table assigns each vocabulary item an independently adjustable vector. We investigate whether this token-specific parameterization is required for substantial language-modeling capability, or whether a shared Transformer can learn from fixed token identities. We compare three decoder-only language models trained from scratch with the same tokenizer, contextual backbone, untied output-head architecture, and training recipe, with a target budget of 100 billion prediction tokens per model. Their input interfaces are a learned table, canonical 16-bit token-ID codes, and one fixed invertible recoding over GF(2). The fixed codes are repeated to model width without an additional trainable input projection. Both fixed-code models acquire substantial capabilities: canonical codes achieve 52.40\\% HellaSwag normalized accuracy, 70.51\\% PIQA accuracy, and 42.75\\% LAMBADA accuracy. The learned-input control performs better on several evaluations, including HellaSwag and LAMBADA, so these results establish viability rather than performance parity. The fixed interfaces remove 100.7 million trainable parameters, yielding 1.711B-parameter models, but parameter reduction is not the central result. These single-run experiments distinguish architectural necessity from empirical utility: independently trainable token-specific input vectors are not required for the observed capabilities. A fixed identity interface also provides a controlled setting for studying representation learning downstream of an immutable input, without establishing where particular capabilities are localized.", "arxiv_id": "2610.04002", "arxiv_url": "https://arxiv.org/abs/2610.04002", "authors": ["A. Bochkov"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.04002", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.04002v1", "published_at": "2026-10-02", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04002.png", "title": "Do Language Models Need a Trainable Input Embedding Table? Fixed Minimal Token Codes at 1.7B-Class Scale", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Recently, approaches that leverage human video datasets for robot policy training have become increasingly prevalent. However, most existing hand trackers regress pose from cropped frames with limited priors on hand motion and object interaction, resulting in inaccurate and physically inconsistent estimates. Moreover, the lack of physical cues, e.g., contact and force, limits the use of human videos for robot policy training. To this end, we propose RLHND, a video foundation model-based hand tracking model that jointly estimates hand pose and realistic tactile information from monocular egocentric videos. RLHND turns the pre-trained Cosmos 3 video diffusion backbone into a deterministic clip-level feature extractor via clean-latent conditioning, carrying its learned priors on hand motion and hand-object interaction into tracking. For pose estimation, RLHND (i) predicts hand poses with anatomically plausible joint angles and (ii) enables optional conditioning on the shape parameter to maintain consistent hand shape within the same video and even across videos recorded by the same actor. For tactile estimation, a separate tactile expert stream, trained with the pose stream frozen, predicts dense contact and force over the hand surface. We further adopt LBS-based feature spreading to enable vertex-wise feature extraction without costly per-vertex attention. RLHND achieves state-of-the-art performance across various benchmark datasets for pose estimation, while also achieving state-of-the-art performance in contact and force estimation. Moreover, we demonstrate the utility of RLHND for robot learning through retargeting results and real-world robot experiments. The code will be publicly available at https://seungjun-moon.github.io/rlhnd/.", "arxiv_id": "2610.09455", "arxiv_url": "https://arxiv.org/abs/2610.09455", "authors": ["Seungjun Moon", "Subin Jeon", "Sangwoo Kim", "Hanbyul Joo", "Jinwoo Shin"], "brief": "", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/seungjun-moon/rlhnd", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.09455", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "RLWRLD", "pdf_url": "https://arxiv.org/pdf/2610.09455v1", "published_at": "2026-10-07", "score": 0.041, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.09455.png", "title": "RLHND: Video Foundation Models as Physically Grounded Hand Trackers for Robot Learning", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "The architectural design of Large Language Models (LLMs) is shifting from traditional full-attention-only models to hybrid models, which combine different attention modules to improve long-context efficiency and performance in length extrapolation and context extension. To explain why hybrid models work and how to design them better, we propose Mechanics of Long-Context Hybrid Models. As Part 1.1 of this series, we begin with hybrids of full attention and either sliding-window attention (SWA) or gated variants of linear attention (LA), represented by GLA and GDN. We first observe a Seesaw Effect in Context Extension: LA hybrids benefit more from long-context continual pretraining, whereas SWA hybrids perform better under length extrapolation. We attribute this behavior to differences in the positional inductive biases induced by these attention mechanisms. We find that SWA hybrids suffer from a Short-Context Learning Trap, Short-Window Weariness, and Long-Window Laziness, and require extended windows to enhance performance in continual long-context pretraining. For LA hybrids, we summarize the Matthew Effect of Hybrid Position Extrapolation and propose Sliding-Window Linear Attention, achieving 16$\\times$ training-free length extrapolation while maintaining 100\\% accuracy on NIAH-SK1 in 64k context length.", "arxiv_id": "2610.10114", "arxiv_url": "https://arxiv.org/abs/2610.10114", "authors": ["Xiaoran Liu", "Ziwei He", "Xipeng Qiu"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/OpenMOSS/Hybrid-Mechanics", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.10114", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "OpenMOSS", "pdf_url": "https://arxiv.org/pdf/2610.10114v1", "published_at": "2026-10-07", "score": 0.032, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.10114.png", "title": "Mechanics of Long-Context Hybrid Models Part 1.1: From Hybrid Attention to Hybrid Position", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in 3D Gaussian Splatting (3DGS) have achieved remarkable performance in novel view synthesis, yet deploying both static and dynamic Gaussian representations on resource-constrained mobile devices remains challenging due to heavy storage, redundant primitives, and costly per-frame computation. We present Mobile-4DGS, a unified lightweight framework for high-fidelity real-time static and dynamic Gaussian rendering on mobile platforms. For compact appearance modeling, we introduce a Monte Carlo Specular Energy Aggregator that compresses high-order radiance residuals into the first-order Spherical Harmonics (SH), together with an Attribute-Conditioned SH Enhancement module whose predicted offsets are pre-baked before inference. We further propose a Multi-View Alpha-Based Densification and Pruning strategy to suppress redundant primitives while maintaining multi-view consistency. For dynamic scenes, we develop a compact explicit 4D representation by constructing second-order Gaussian motion, learnable temporal support, and a binary static-dynamic partition, enabling continuous-time modeling without runtime deformation networks. Based on this partition, a Depth-Order Certificate selectively reuses previously committed depth orders to reduce re-projection, sorting, merging, and index-buffer updates during playback. Extensive experiments on static and dynamic scenes demonstrate that Mobile-4DGS substantially reduces storage and rendering overhead while maintaining competitive visual quality, enabling real-time 3D and 4D Gaussian Splatting on mobile devices. \\textcolor{magenta}{\\href{https://xiaobiaodu.github.io/mobile-4dgs-project/}{Code has been released: https://xiaobiaodu.github.io/mobile-4dgs-project/}}.", "arxiv_id": "2610.05289", "arxiv_url": "https://arxiv.org/abs/2610.05289", "authors": ["Xiaobiao Du", "Beixi Hao", "Zhen Fang", "Tianqing Zhu", "Richard Hartley", "Xin Yu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/xiaobiaodu/mobile-4dgs", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.05289", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "University of Technology Sydney", "pdf_url": "https://arxiv.org/pdf/2610.05289v1", "published_at": "2026-10-04", "score": 0.029, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05289.png", "title": "Mobile-4DGS: Unified Static-Dynamic Real-time Mobile Gaussian Splatting", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "``What are the irreducible conditions that are sufficient to produce an outcome?\u0027\u0027 is one of the most common questions that recur across computation and science. Its answers, the minimal sufficient witnesses, are what we mean by explanations, mechanisms and reasons. These problems usually ask for multiple minimal witnesses, yet standard RL methods may reveal only one solution or redundant ones. We formalize this problem as minimal-witness identification and introduce Minimal-Witness Reinforcement Learning (MWRL). MWRL takes the union of the sets certified by successful proposals sampled from the policy and credits each proposal for the coverage the group union would lose without that proposal. This credit assignment, derived directly from the problem definition, unifies the demands for minimality and recovery of alternatives from a single black-box verifier bit. Under this principle, we derive a value iteration planner that recovers the entire family of witnesses and a policy gradient method that can scale to large language models. Across different experimental settings, MWRL recovers most minimal witnesses, while other methods return redundant supersets or a single witness. By making witness families learnable from verifier feedback, MWRL expands the scope of reinforcement learning beyond single-solution optimization. Our code is available at https://github.com/TSUITUENYUE/MWRL.", "arxiv_id": "2610.07226", "arxiv_url": "https://arxiv.org/abs/2610.07226", "authors": ["T. Y. Tsui", "Zihao Ye", "Pengxiang Cai", "Yanchao Li", "Yuqiang Li", "Zhehong Ai"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.LO"], "github_repo": "https://github.com/TSUITUENYUE/MWRL", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.07226", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "University of Pennsylvania", "pdf_url": "https://arxiv.org/pdf/2610.07226v1", "published_at": "2026-10-05", "score": 0.007, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07226.png", "title": "Minimal Witness Reinforcement Learning", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Prevailing multi-vector visual document retrievers store each page as about a thousand patch vectors, often in vector databases run by a third party. Since no one can read a page from its vectors, this index is easily treated as less sensitive than the page. However, because the index keeps one vector per patch in raster order, and each vector is computed by a vision-language model pre-trained to read documents, we hypothesize that whoever runs or breaches the store can reproduce a page from its index alone. We frame inversion as conditional document image generation and infer from the vectors what the attack needs: the encoder, the page shape and, for shuffled vectors, their order. On the ViDoRe v3 benchmark, pages inverted from raw indices recover 47% of the words and 45% of the sensitive tokens. Used as queries against the stored indices, they rank their source page first 98.4% of the time. We test two cheap protections, token pooling and shuffling, which both cut word recall to about 8%. A model that restores the order of a shuffled index raises the share of source pages ranked first from 3.8% to 93.5%, while inverting a pooled index remains open. To test generalisation, we apply the same attack unchanged to another multi-vector retriever: its inverted pages still rank their source page first 70.2% of the time, though its word recall stays below a nearest-neighbour baseline. Multi-vector visual document retrievers are therefore vulnerable to inversion through their stored index, which should be protected like the documents it encodes.", "arxiv_id": "2610.09920", "arxiv_url": "https://arxiv.org/abs/2610.09920", "authors": ["Zhuchenyang Liu", "Yao Zhang", "Yu Xiao"], "brief": "", "categories": ["cs.IR", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.09920", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.09920v1", "published_at": "2026-10-07", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.09920.png", "title": "Inverting Multi-Vector Visual Document Indices", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Product-centric advertisement video generation aims to create promotional videos that preserve fine-grained product identity while presenting selling points through coherent multi-shot narratives. However, this emerging task remains underexplored due to the lack of large-scale advertisement-specific datasets and comprehensive evaluation frameworks. To address this gap, we introduce \\textbf{AdSpark}, a large-scale dataset and benchmark for product-centric advertisement video generation, based on data from a major e-commerce platform. \\textit{AdSpark-300K} contains approximately 300K reference image--prompt--video triplets, comprising a real-world subset and a synthetic subset. Each sample provides structured advertisement annotations, including product identity annotations, selling-point descriptions, creative plans, and aligned audio scripts, enabling models to learn product preservation and advertisement-oriented visual storytelling. We further propose \\textit{AdSpark-Bench}, a diagnostic benchmark that evaluates generated advertisements across six dimensions, including visual quality, product fidelity, instruction adherence, temporal coherence, audio alignment, and advertisement effectiveness. Based on AdSpark-Bench, we evaluate representative models, revealing key challenges in product preservation, multi-shot storytelling, and selling-point visualization. Experiments with AdSpark-300K-finetuned models further validate the effectiveness of our dataset. AdSpark provides a unified dataset and benchmark for future research, and we will release the dataset upon acceptance.", "arxiv_id": "2610.10047", "arxiv_url": "https://arxiv.org/abs/2610.10047", "authors": ["Zhifei Yang", "Zhao Jiang", "Keyang Lu", "Honghe Zhu", "Zheng Zhang", "Jingjing Lv", "Changping Peng", "Ching Law", "Zhen Xiao"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.10047", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.10047v1", "published_at": "2026-10-07", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.10047.png", "title": "AdSpark: A Large-Scale Dataset and Benchmark for Product-Centric Advertisement Video Generation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A holographic superconductor whose scalar mass depends on the gauge field strength, $M(\\Fsq)$, reproduces a superconducting dome for a suitable $M$, and recovering that $M$ from a given dome has so far taken days for a single training run. We propose a new way of training this model, with which an inversion takes from about ten minutes to an hour. Training needs the gradient of the condition that fixes the critical temperature, which the earlier method obtains by finite differences, repeating the bulk integrations for every training parameter. Here that condition is obtained, without any fit, from two integrations started at the horizon and at the boundary, and its derivative with respect to $
