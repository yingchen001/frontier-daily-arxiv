c past tokens hard to recover. Sliding-window attention (SWA) exhibits the opposite behavior: it writes sparsely by storing explicit token representations, but only within a fixed window, so recall drops once the relevant token is evicted. Interpolating between these models, we introduce Raven, a linear-time sequence model that maintains a fixed set of memory slots and, at each step, decays and updates only a selected subset via learned, input-dependent routing. This lets Raven mitigate SWA\u0027s position-based overwriting and hard eviction while reducing interference from dense state updates in SSMs, thereby preserving long-range content much more effectively. Across recall-intensive benchmarks, Raven is competitive with or outperforms prior linear-time baselines, achieving strong long-context recall where both SWA and SSMs sharply degrade. It remains effective when extrapolating to context lengths as large as 16x its training length, with similar gains in hybrid architectures.", "arxiv_id": "2607.25357", "arxiv_url": "https://arxiv.org/abs/2607.25357", "authors": ["Arshia Afzal", "Aviv Bick", "Eric P. Xing", "Volkan Cevher", "Albert Gu"], "brief": "\u8bba\u6587\u63d0\u51fa Raven\uff0c\u4e00\u79cd\u7ebf\u6027\u65f6\u95f4\u5e8f\u5217\u6a21\u578b\uff0c\u7528\u56fa\u5b9a\u8bb0\u5fc6\u69fd\u5e76\u901a\u8fc7\u5b66\u4e60\u5230\u7684\u8f93\u5165\u76f8\u5173\u8def\u7531\uff0c\u53ea\u8870\u51cf\u548c\u66f4\u65b0\u90e8\u5206\u8bb0\u5fc6\uff0c\u4ee5\u51cf\u5c11\u5bc6\u96c6\u72b6\u6001\u66f4\u65b0\u7684\u5e72\u6270\u5e76\u907f\u514d\u6ed1\u7a97\u6ce8\u610f\u529b\u7684\u786c\u9a71\u9010\u3002\u5b83\u5728\u5f3a\u8c03\u957f\u4e0a\u4e0b\u6587\u53ec\u56de\u7684\u57fa\u51c6\u4e0a\u4f18\u4e8e\u6216\u5339\u654c\u65e2\u6709\u7ebf\u6027\u65f6\u95f4\u6a21\u578b\uff0c\u5e76\u80fd\u5916\u63a8\u5230\u8bad\u7ec3\u957f\u5ea6 16 \u500d\u7684\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25357", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5e8f\u5217\u5efa\u6a21", "\u957f\u4e0a\u4e0b\u6587", "\u8bb0\u5fc6\u673a\u5236", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25357v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Raven: High-Recall Sequence Modeling with Sparse Memory Routing", "tldr": "\u8bba\u6587\u63d0\u51fa Raven\uff0c\u4e00\u79cd\u7ebf\u6027\u65f6\u95f4\u5e8f\u5217\u6a21\u578b\uff0c\u7528\u56fa\u5b9a\u8bb0\u5fc6\u69fd\u5e76\u901a\u8fc7\u5b66\u4e60\u5230\u7684\u8f93\u5165\u76f8\u5173\u8def\u7531\uff0c\u53ea\u8870\u51cf\u548c\u66f4\u65b0\u90e8\u5206\u8bb0\u5fc6\uff0c\u4ee5\u51cf\u5c11\u5bc6\u96c6\u72b6\u6001\u66f4\u65b0\u7684\u5e72\u6270\u5e76\u907f\u514d\u6ed1\u7a97\u6ce8\u610f\u529b\u7684\u786c\u9a71\u9010\u3002\u5b83\u5728\u5f3a\u8c03\u957f\u4e0a\u4e0b\u6587\u53ec\u56de\u7684\u57fa\u51c6\u4e0a\u4f18\u4e8e\u6216\u5339\u654c\u65e2\u6709\u7ebf\u6027\u65f6\u95f4\u6a21\u578b\uff0c\u5e76\u80fd\u5916\u63a8\u5230\u8bad\u7ec3\u957f\u5ea6 16 \u500d\u7684\u4e0a\u4e0b\u6587\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world tasks often require models to learn from task-specific context rather than relying only on pre-trained knowledge. While recent work has highlighted this capability as context learning, existing evaluations mainly focus on textual contexts. In many practical settings, however, the context to be learned from is multimodal: scientific findings are conveyed through figures and tables, financial indicators are scattered across converted reports, and spatial decisions depend on maps, scenes, or web pages. We introduce CLBench-V, a benchmark for multimodal context learning that addresses the difficulty of localizing where context use breaks down by organizing tasks around three dimensions: context grounding, new information application, and new knowledge learning. CLBench-V combines converted public benchmarks with newly constructed datasets spanning domains such as science, finance, long-document understanding, spatial reasoning, and web-based visual question answering. To reduce the cost of constructing domain-specific context-learning tasks, we further use automated construction and filtering procedures for our newly built datasets. Across 3,443 instances and six recent multimodal models, the best overall score is only 0.2847, indicating that multimodal context learning remains far from saturated. Moreover, InternVL3.5-30B-A3B performs best on context grounding and new knowledge learning, while Qwen3.5-Plus performs best on new information application. We further analyze judge reliability, context length, image count, and representative failure cases. Code is available at https://github.com/IamLihua/CLBench-V.", "arxiv_id": "2607.25294", "arxiv_url": "https://arxiv.org/abs/2607.25294", "authors": ["Lai Wei", "Chengqi Li", "Jiapeng Li", "Ruina Hu", "Yue Wang", "Weiran Huang"], "brief": "\u8bba\u6587\u63d0\u51fa CLBench-V\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u5b66\u4e60\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4ece\u4e0a\u4e0b\u6587\u5b9a\u4f4d\u3001\u65b0\u4fe1\u606f\u5e94\u7528\u548c\u65b0\u77e5\u8bc6\u5b66\u4e60\u4e09\u4e2a\u7ef4\u5ea6\u8bca\u65ad\u6a21\u578b\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u79d1\u5b66\u3001\u91d1\u878d\u3001\u957f\u6587\u6863\u3001\u7a7a\u95f4\u63a8\u7406\u548c\u7f51\u9875\u89c6\u89c9\u95ee\u7b54\u7b49\u9886\u57df\uff0c\u6d4b\u8bd5 6 \u4e2a\u591a\u6a21\u6001\u6a21\u578b\u540e\u53d1\u73b0\u6700\u4f73\u603b\u5206\u4ec5 0.2847\uff0c\u8bf4\u660e\u5f53\u524d\u6a21\u578b\u5728\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u5b66\u4e60\u4e0a\u4ecd\u6709\u660e\u663e\u4e0d\u8db3\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25294", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u89c6\u89c9\u95ee\u7b54", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25294v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CLBench-V: Evaluating Multimodal Context Learning from Grounding to Knowledge Acquisition", "tldr": "\u8bba\u6587\u63d0\u51fa CLBench-V\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u5b66\u4e60\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4ece\u4e0a\u4e0b\u6587\u5b9a\u4f4d\u3001\u65b0\u4fe1\u606f\u5e94\u7528\u548c\u65b0\u77e5\u8bc6\u5b66\u4e60\u4e09\u4e2a\u7ef4\u5ea6\u8bca\u65ad\u6a21\u578b\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u79d1\u5b66\u3001\u91d1\u878d\u3001\u957f\u6587\u6863\u3001\u7a7a\u95f4\u63a8\u7406\u548c\u7f51\u9875\u89c6\u89c9\u95ee\u7b54\u7b49\u9886\u57df\uff0c\u6d4b\u8bd5 6 \u4e2a\u591a\u6a21\u6001\u6a21\u578b\u540e\u53d1\u73b0\u6700\u4f73\u603b\u5206\u4ec5 0.2847\uff0c\u8bf4\u660e\u5f53\u524d\u6a21\u578b\u5728\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u5b66\u4e60\u4e0a\u4ecd\u6709\u660e\u663e\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Silicon sampling uses language models as proxies for human survey respondents, treating each model call as an independent draw from the persona\u0027s response distribution. We show this draw does not exist: instruction-tuned models do not sample from distributions, they collapse to a single output. The same persona on the same question returns the same answer on more than half of items in a public-opinion benchmark. The collapse is sharp: the model\u0027s internal probabilities concentrate on a single option, and the failure is substantially amplified by instruction tuning: across three model families with materially different post-training pipelines, every instruction-tuned model fails on every task we test, while base models fail far less often. Strikingly, the same model that cannot sample from a distribution can describe it accurately in a single call. We call this gap the KNOWS/DOES split, and trace it to a degenerate sampling primitive visible in the logits and induced by alignment training. Exploiting this split, asking the model to describe the response distribution in one call more than halves the error against human survey data compared to persona aggregation. For applications that require per-persona outputs, we propose Prompt-Perturbed Argyle (PPA), which reduces the same error by 21% at no added cost.", "arxiv_id": "2607.25292", "arxiv_url": "https://arxiv.org/abs/2607.25292", "authors": ["Chaemin Jang", "Dongman Lee", "Jihee Kim"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u7528\u6307\u4ee4\u5fae\u8c03\u8bed\u8a00\u6a21\u578b\u6a21\u62df\u4eba\u7c7b\u95ee\u5377\u53d7\u8bbf\u8005\u65f6\uff0c\u6a21\u578b\u5e76\u4e0d\u4f1a\u4ece\u4eba\u683c\u5bf9\u5e94\u7684\u56de\u7b54\u5206\u5e03\u4e2d\u72ec\u7acb\u91c7\u6837\uff0c\u800c\u662f\u5e38\u574d\u7f29\u5230\u5355\u4e00\u7b54\u6848\uff1b\u8fd9\u79cd\u73b0\u8c61\u5728\u591a\u79cd\u6a21\u578b\u5bb6\u65cf\u7684\u6307\u4ee4\u5fae\u8c03\u7248\u672c\u4e2d\u666e\u904d\u5b58\u5728\uff0c\u4e14\u53ef\u4ece logits \u4e2d\u89c2\u5bdf\u5230\u3002\u4f5c\u8005\u63d0\u51fa\u201cKNOWS/DOES split\u201d\uff1a\u6a21\u578b\u80fd\u51c6\u786e\u63cf\u8ff0\u5206\u5e03\u5374\u4e0d\u80fd\u6309\u5206\u5e03\u91c7\u6837\uff1b\u76f4\u63a5\u8ba9\u6a21\u578b\u63cf\u8ff0\u5206\u5e03\u53ef\u5c06\u76f8\u5bf9\u4eba\u7c7b\u8c03\u67e5\u6570\u636e\u7684\u8bef\u5dee\u51cf\u534a\uff0cPPA \u65b9\u6cd5\u4e5f\u80fd\u5728\u65e0\u989d\u5916\u6210\u672c\u4e0b\u964d\u4f4e 21% \u8bef\u5dee\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25292", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6307\u4ee4\u5fae\u8c03", "\u793e\u4f1a\u6a21\u62df", "\u91c7\u6837\u504f\u5dee"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25292v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Instruction-Tuned Language Models Cannot Sample from Distributions They Can Describe", "tldr": "\u8bba\u6587\u6307\u51fa\uff0c\u7528\u6307\u4ee4\u5fae\u8c03\u8bed\u8a00\u6a21\u578b\u6a21\u62df\u4eba\u7c7b\u95ee\u5377\u53d7\u8bbf\u8005\u65f6\uff0c\u6a21\u578b\u5e76\u4e0d\u4f1a\u4ece\u4eba\u683c\u5bf9\u5e94\u7684\u56de\u7b54\u5206\u5e03\u4e2d\u72ec\u7acb\u91c7\u6837\uff0c\u800c\u662f\u5e38\u574d\u7f29\u5230\u5355\u4e00\u7b54\u6848\uff1b\u8fd9\u79cd\u73b0\u8c61\u5728\u591a\u79cd\u6a21\u578b\u5bb6\u65cf\u7684\u6307\u4ee4\u5fae\u8c03\u7248\u672c\u4e2d\u666e\u904d\u5b58\u5728\uff0c\u4e14\u53ef\u4ece logits \u4e2d\u89c2\u5bdf\u5230\u3002\u4f5c\u8005\u63d0\u51fa\u201cKNOWS/DOES split\u201d\uff1a\u6a21\u578b\u80fd\u51c6\u786e\u63cf\u8ff0\u5206\u5e03\u5374\u4e0d\u80fd\u6309\u5206\u5e03\u91c7\u6837\uff1b\u76f4\u63a5\u8ba9\u6a21\u578b\u63cf\u8ff0\u5206\u5e03\u53ef\u5c06\u76f8\u5bf9\u4eba\u7c7b\u8c03\u67e5\u6570\u636e\u7684\u8bef\u5dee\u51cf\u534a\uff0cPPA \u65b9\u6cd5\u4e5f\u80fd\u5728\u65e0\u989d\u5916\u6210\u672c\u4e0b\u964d\u4f4e 21% \u8bef\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper presents ContractHIL-HLS, a contract-aligned multi-agent workflow for practical high-level synthesis (HLS) engineering. The workflow makes three contributions. First, it introduces a structured contract as the semantic-alignment and task-execution artifact that translates natural language requirements into explicit interfaces, constraints, validation checks, and rollback rules. Second, it incorporates hardware information into the feedback loop by feeding HLS, Vivado, PYNQ runtime, power, and failure evidence back into generation, thereby extending LLM-assisted HLS from kernel code toward system- and board-level closure. Third, it decomposes agents by semantic lowering and execution tasks rather than by conversational roles: a Contract Agent lowers natural language into the contract, an HTML Agent renders the contract as persistent structured HTML, and a Hardware-in-the-Loop Agent implements and revises the design with measured evidence. We evaluate ContractHIL-HLS in two parts. On 94 locally executable HLS-Eval tasks, the structured contract provides the largest small design gain, improving the estimated single-sample testbench pass rate from 64.0% to 70.2%; the full flow reaches 70.4% pass@1 and 76.6% pass@5. Because HLS-Eval does not exercise board-level design, we also validate ContractHIL-HLS on a board tested ML-KEM/ML-DSA post-quantum cryptography (PQC) secure-message accelerator, where the retained dual-bitstream organization reduces six-message average text runtime from 207.3 ms to 52.4 ms with positive routed WNS on both images while preserving decrypted-message verification. We open-source our work at BJUT-CS316-LAB/ContractHIL-HLS (https://github.com/BJUT-CS316-LAB/ContractHIL-HLS).", "arxiv_id": "2607.25283", "arxiv_url": "https://arxiv.org/abs/2607.25283", "authors": ["Jingbo Zhang", "Haoxiang Sun", "Wenbo Wang", "Wenbo Zhang"], "brief": "\u672c\u6587\u63d0\u51fa ContractHIL-HLS\uff0c\u4e00\u4e2a\u9762\u5411\u9ad8\u5c42\u6b21\u7efc\u5408\u8bbe\u8ba1\u7684\u5951\u7ea6\u5bf9\u9f50\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u9700\u6c42\u8f6c\u4e3a\u7ed3\u6784\u5316\u63a5\u53e3\u3001\u7ea6\u675f\u3001\u9a8c\u8bc1\u4e0e\u56de\u6eda\u89c4\u5219\uff0c\u5e76\u5f15\u5165 HLS/Vivado/PYNQ \u8fd0\u884c\u65f6\u3001\u529f\u8017\u548c\u5931\u8d25\u8bc1\u636e\u5f62\u6210\u786c\u4ef6\u5728\u73af\u53cd\u9988\u3002\u5728 HLS-Eval \u4e0a\u5355\u6837\u672c\u901a\u8fc7\u7387\u4ece 64.0% \u63d0\u5347\u5230\u7ea6 70.4%\uff0c\u5728\u677f\u7ea7\u540e\u91cf\u5b50\u5bc6\u7801\u52a0\u901f\u5668\u6848\u4f8b\u4e2d\u5c06\u516d\u6d88\u606f\u5e73\u5747\u6587\u672c\u8fd0\u884c\u65f6\u95f4\u4ece 207.3 ms \u964d\u81f3 52.4 ms\u3002", "categories": ["cs.AI", "cs.AR", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25283", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u9ad8\u5c42\u6b21\u7efc\u5408", "\u786c\u4ef6\u5728\u73af", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25283v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ContractHIL-HLS: Contract-Aligned Multi-Agent Workflow with Hardware-in-the-Loop Feedback for HLS Design", "tldr": "\u672c\u6587\u63d0\u51fa ContractHIL-HLS\uff0c\u4e00\u4e2a\u9762\u5411\u9ad8\u5c42\u6b21\u7efc\u5408\u8bbe\u8ba1\u7684\u5951\u7ea6\u5bf9\u9f50\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u9700\u6c42\u8f6c\u4e3a\u7ed3\u6784\u5316\u63a5\u53e3\u3001\u7ea6\u675f\u3001\u9a8c\u8bc1\u4e0e\u56de\u6eda\u89c4\u5219\uff0c\u5e76\u5f15\u5165 HLS/Vivado/PYNQ \u8fd0\u884c\u65f6\u3001\u529f\u8017\u548c\u5931\u8d25\u8bc1\u636e\u5f62\u6210\u786c\u4ef6\u5728\u73af\u53cd\u9988\u3002\u5728 HLS-Eval \u4e0a\u5355\u6837\u672c\u901a\u8fc7\u7387\u4ece 64.0% \u63d0\u5347\u5230\u7ea6 70.4%\uff0c\u5728\u677f\u7ea7\u540e\u91cf\u5b50\u5bc6\u7801\u52a0\u901f\u5668\u6848\u4f8b\u4e2d\u5c06\u516d\u6d88\u606f\u5e73\u5747\u6587\u672c\u8fd0\u884c\u65f6\u95f4\u4ece 207.3 ms \u964d\u81f3 52.4 ms\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Classical compute-optimal scaling laws assume an unbounded supply of fresh pretraining data, yet pretraining is increasingly entering a regime in which compute grows faster than the availability of high-quality data. We propose Compute-Data (CD) scaling laws, a unified framework that bridges compute-optimal scaling, where data scales freely with compute, and data-optimal scaling, where the corpus is fixed while compute can grow without bound. CD scaling extends classical scaling laws by introducing a token-effectiveness function, $\u03b7$, which quantifies the value of a derived token-produced, for example, through multi-epoch repetition or paraphrasing-relative to a fresh token, ranging from a perfect substitute to having no value. We fit $\u03b7$ for two data-expansion strategies, multi-epoch repetition and paraphrasing, across model sizes from 14M to 600M parameters using the Dolma-3 corpus. We find that token effectiveness is far from constant: it depends jointly on model size, the tokens-per-parameter ratio, and the amount of derived data, and it saturates as the corpus is expanded. The functional form of $\u03b7$ implies diminishing returns when substituting compute for data as either model size or data availability increases. It also partitions training into three operational regimes---compute-bound, data-bound, and model-bound---and shows that classical compute-optimal allocation is suboptimal across most practically relevant settings.", "arxiv_id": "2607.25271", "arxiv_url": "https://arxiv.org/abs/2607.25271", "authors": ["Tian Qin", "Kimia Hamidieh", "David Alvarez-Melis"], "brief": "\u672c\u6587\u63d0\u51fa Compute-Data\uff08CD\uff09\u7f29\u653e\u5f8b\uff0c\u7528 token \u6709\u6548\u6027\u51fd\u6570\u523b\u753b\u91cd\u590d\u8bad\u7ec3\u3001\u6539\u5199\u7b49\u884d\u751f\u6570\u636e\u76f8\u5bf9\u65b0\u9c9c\u6570\u636e\u7684\u4ef7\u503c\uff0c\u8fde\u63a5\u4f20\u7edf\u7b97\u529b\u6700\u4f18\u4e0e\u6570\u636e\u56fa\u5b9a\u573a\u666f\u3002\u5b9e\u9a8c\u8868\u660e token \u6709\u6548\u6027\u4f1a\u968f\u6a21\u578b\u89c4\u6a21\u3001tokens/\u53c2\u6570\u6bd4\u4f8b\u548c\u884d\u751f\u6570\u636e\u91cf\u53d8\u5316\u5e76\u8d8b\u4e8e\u9971\u548c\uff0c\u56e0\u6b64\u5728\u591a\u6570\u73b0\u5b9e\u8bbe\u7f6e\u4e0b\u7ecf\u5178\u7b97\u529b\u6700\u4f18\u5206\u914d\u5e76\u4e0d\u6700\u4f18\u3002", "categories": ["cs.LG", "cs.AI", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25271", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f29\u653e\u5f8b", "\u9884\u8bad\u7ec3", "\u6570\u636e\u6548\u7387", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25271v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bridging Compute- and Data-Optimal Pretraining", "tldr": "\u672c\u6587\u63d0\u51fa Compute-Data\uff08CD\uff09\u7f29\u653e\u5f8b\uff0c\u7528 token \u6709\u6548\u6027\u51fd\u6570\u523b\u753b\u91cd\u590d\u8bad\u7ec3\u3001\u6539\u5199\u7b49\u884d\u751f\u6570\u636e\u76f8\u5bf9\u65b0\u9c9c\u6570\u636e\u7684\u4ef7\u503c\uff0c\u8fde\u63a5\u4f20\u7edf\u7b97\u529b\u6700\u4f18\u4e0e\u6570\u636e\u56fa\u5b9a\u573a\u666f\u3002\u5b9e\u9a8c\u8868\u660e token \u6709\u6548\u6027\u4f1a\u968f\u6a21\u578b\u89c4\u6a21\u3001tokens/\u53c2\u6570\u6bd4\u4f8b\u548c\u884d\u751f\u6570\u636e\u91cf\u53d8\u5316\u5e76\u8d8b\u4e8e\u9971\u548c\uff0c\u56e0\u6b64\u5728\u591a\u6570\u73b0\u5b9e\u8bbe\u7f6e\u4e0b\u7ecf\u5178\u7b97\u529b\u6700\u4f18\u5206\u914d\u5e76\u4e0d\u6700\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Activation steering controls language models by adding vectors or features to hidden states at inference time, but the upstream source of these steering signals is often treated as a secondary detail. We study this source choice as activation source selection: the combination of source context and activation readout policy used to collect the hidden states from which a steering signal is built. Holding the downstream intervention fixed, we show across three instruction-tuned models and four steering task families that changing only the source activations substantially changes steering success. We further find that effective steering is not explained simply by whether the desired behavior appears in the source text. Instead, strong signals come from execution-boundary states, where the model is about to produce or continue the target behavior. This pre-/post-realization distinction explains why answer-based sources sometimes work: their useful component aligns with execution-boundary directions rather than target appearance alone. Building on this view, we introduce tail subtraction, which removes shared prompt and continuation semantics from boundary states and yields cleaner, more stable steering signals. Overall, our results suggest that steering depends on representations of what the model is about to do, not merely on what has already appeared.", "arxiv_id": "2607.25270", "arxiv_url": "https://arxiv.org/abs/2607.25270", "authors": ["Jiaran Ye", "Lingxu Ran", "Zijun Yao", "Chenpeng Wang", "Yong Jiang", "Lei Hou", "Juanzi Li", "Liangming Pan"], "brief": "\u672c\u6587\u7814\u7a76\u6fc0\u6d3b\u5f15\u5bfc\u4e2d\u201c steering \u4fe1\u53f7\u4ece\u54ea\u91cc\u6765\u201d\u7684\u95ee\u9898\uff0c\u53d1\u73b0\u4ec5\u6539\u53d8\u6e90\u4e0a\u4e0b\u6587\u548c\u6fc0\u6d3b\u8bfb\u53d6\u7b56\u7565\uff0c\u5c31\u4f1a\u663e\u8457\u5f71\u54cd\u4e09\u7c7b\u6307\u4ee4\u6a21\u578b\u5728\u591a\u79cd\u4efb\u52a1\u4e0a\u7684\u5f15\u5bfc\u6548\u679c\u3002\u4f5c\u8005\u6307\u51fa\u5f3a\u4fe1\u53f7\u4e3b\u8981\u6765\u81ea\u6a21\u578b\u5373\u5c06\u6267\u884c\u76ee\u6807\u884c\u4e3a\u7684\u201c\u6267\u884c\u8fb9\u754c\u201d\u72b6\u6001\uff0c\u5e76\u63d0\u51fa tail subtraction \u53bb\u9664\u5171\u4eab\u8bed\u4e49\uff0c\u4f7f\u5f15\u5bfc\u4fe1\u53f7\u66f4\u5e72\u51c0\u7a33\u5b9a\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25270", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6fc0\u6d3b\u5f15\u5bfc", "\u6a21\u578b\u63a7\u5236", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25270v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Where Steering Signals Come From: Activation Source Selection in Activation Steering", "tldr": "\u672c\u6587\u7814\u7a76\u6fc0\u6d3b\u5f15\u5bfc\u4e2d\u201c steering \u4fe1\u53f7\u4ece\u54ea\u91cc\u6765\u201d\u7684\u95ee\u9898\uff0c\u53d1\u73b0\u4ec5\u6539\u53d8\u6e90\u4e0a\u4e0b\u6587\u548c\u6fc0\u6d3b\u8bfb\u53d6\u7b56\u7565\uff0c\u5c31\u4f1a\u663e\u8457\u5f71\u54cd\u4e09\u7c7b\u6307\u4ee4\u6a21\u578b\u5728\u591a\u79cd\u4efb\u52a1\u4e0a\u7684\u5f15\u5bfc\u6548\u679c\u3002\u4f5c\u8005\u6307\u51fa\u5f3a\u4fe1\u53f7\u4e3b\u8981\u6765\u81ea\u6a21\u578b\u5373\u5c06\u6267\u884c\u76ee\u6807\u884c\u4e3a\u7684\u201c\u6267\u884c\u8fb9\u754c\u201d\u72b6\u6001\uff0c\u5e76\u63d0\u51fa tail subtraction \u53bb\u9664\u5171\u4eab\u8bed\u4e49\uff0c\u4f7f\u5f15\u5bfc\u4fe1\u53f7\u66f4\u5e72\u51c0\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generation in video diffusion or flow models is computationally expensive due to the slow and iterative sampling process. Current state-of-the-art (SOTA) acceleration methods heavily rely on variational score distillation (VSD) and adversarial losses to distill diffusion models into few-step generators. Albeit achieving high-quality video generation, these training losses are notoriously hard to optimize and suffer from mode collapse, leading to loss of video diversity and lack of motion. In this paper, we introduce Parallel Decoding Distillation (PDD), a simplified and scalable trajectory-based distillation method for fast inference of diffusion and flow matching models. Our architecture and training procedure are compatible with any pre-trained model and support sampling with a varying number of function evaluations (NFE). PDD accelerates generation by predicting multiple denoising steps per network evaluation. Conceptually, it learns a representation of the mean velocity without regressing its derivative using JVPs or finite-difference approximations. Our method achieves SOTA performance with 4-8 NFE on LTX-2.3 Text-to-Video/Audio, Wan 14B Text-to-Video, and Qwen-Image Text-to-Image. Moreover, PDD presents a significant improvement in generated video diversity.", "arxiv_id": "2607.26004", "arxiv_url": "https://arxiv.org/abs/2607.26004", "authors": ["Neta Shaul", "Chao Liu", "Arash Vahdat", "Julius Berner"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u884c\u89e3\u7801\u84b8\u998f\uff08PDD\uff09\uff0c\u7528\u4e8e\u52a0\u901f\u6269\u6563\u6a21\u578b\u548c\u6d41\u5339\u914d\u6a21\u578b\u7684\u56fe\u50cf\u3001\u89c6\u9891\u751f\u6210\uff0c\u901a\u8fc7\u4e00\u6b21\u7f51\u7edc\u8bc4\u4f30\u9884\u6d4b\u591a\u4e2a\u53bb\u566a\u6b65\u9aa4\uff0c\u907f\u514d\u4f9d\u8d56\u96be\u4f18\u5316\u7684 VSD \u548c\u5bf9\u6297\u635f\u5931\u3002\u8be5\u65b9\u6cd5\u517c\u5bb9\u591a\u79cd\u9884\u8bad\u7ec3\u6a21\u578b\uff0c\u53ef\u5728 4-8 \u6b21\u51fd\u6570\u8bc4\u4f30\u4e0b\u8fbe\u5230 SOTA\uff0c\u5e76\u663e\u8457\u63d0\u5347\u89c6\u9891\u751f\u6210\u591a\u6837\u6027\u4e0e\u8fd0\u52a8\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26004", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6a21\u578b\u84b8\u998f", "\u5feb\u901f\u91c7\u6837"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26004v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Parallel Decoding Distillation for Fast Image and Video Generation", "tldr": "\u8bba\u6587\u63d0\u51fa\u5e76\u884c\u89e3\u7801\u84b8\u998f\uff08PDD\uff09\uff0c\u7528\u4e8e\u52a0\u901f\u6269\u6563\u6a21\u578b\u548c\u6d41\u5339\u914d\u6a21\u578b\u7684\u56fe\u50cf\u3001\u89c6\u9891\u751f\u6210\uff0c\u901a\u8fc7\u4e00\u6b21\u7f51\u7edc\u8bc4\u4f30\u9884\u6d4b\u591a\u4e2a\u53bb\u566a\u6b65\u9aa4\uff0c\u907f\u514d\u4f9d\u8d56\u96be\u4f18\u5316\u7684 VSD \u548c\u5bf9\u6297\u635f\u5931\u3002\u8be5\u65b9\u6cd5\u517c\u5bb9\u591a\u79cd\u9884\u8bad\u7ec3\u6a21\u578b\uff0c\u53ef\u5728 4-8 \u6b21\u51fd\u6570\u8bc4\u4f30\u4e0b\u8fbe\u5230 SOTA\uff0c\u5e76\u663e\u8457\u63d0\u5347\u89c6\u9891\u751f\u6210\u591a\u6837\u6027\u4e0e\u8fd0\u52a8\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Low-rank adaptation (LoRA) fine-tuning has made it cheap and easy to customize open-weight image generation models for specific tasks, including the production of child sexual abuse material (CSAM). Existing moderation relies on metadata or generated outputs, but metadata can be deceptive and generating outputs may itself be unacceptable or illegal. We show that a safer signal lives in the weights. The top-left singular vectors of a LoRA\u0027s updates form a compact, inference-free fingerprint ($u_1$) of its strongest learned change. Using human-subject age as a benign proxy for CSAM, we find that $u_1$ identifies what a LoRA was trained on, generalizes across base models, and abstains on unrelated benign content. The signal is robust to additive weight noise, rescaling, and precision reduction. These results indicate that harmful LoRAs could be screened directly from their weights without relying on metadata or generating harmful outputs.", "arxiv_id": "2607.25750", "arxiv_url": "https://arxiv.org/abs/2607.25750", "authors": ["David Demitri Africa", "Cate Heine", "Nadine Staes-Polet", "Kimberly Mai"], "brief": "\u8bba\u6587\u63d0\u51fa\u76f4\u63a5\u4ece LoRA \u6743\u91cd\u4e2d\u68c0\u6d4b\u6f5c\u5728\u6709\u5bb3\u6587\u672c\u5230\u56fe\u50cf\u5fae\u8c03\u6a21\u578b\uff0c\u800c\u4e0d\u4f9d\u8d56\u5143\u6570\u636e\u6216\u751f\u6210\u6837\u672c\u3002\u65b9\u6cd5\u4f7f\u7528 LoRA \u66f4\u65b0\u77e9\u9635\u7684\u9996\u4e2a\u5947\u5f02\u5411\u91cf\u4f5c\u4e3a\u7d27\u51d1\u6307\u7eb9\uff0c\u5728\u4ee5\u4eba\u7269\u5e74\u9f84\u4e3a\u4ee3\u7406\u4efb\u52a1\u7684\u5b9e\u9a8c\u4e2d\u53ef\u8bc6\u522b\u8bad\u7ec3\u5185\u5bb9\u3001\u8de8\u57fa\u6a21\u578b\u6cdb\u5316\uff0c\u5e76\u5bf9\u566a\u58f0\u3001\u7f29\u653e\u548c\u4f4e\u7cbe\u5ea6\u8f83\u7a33\u5065\u3002", "categories": ["cs.LG", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25750", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u5b89\u5168", "LoRA", "\u5185\u5bb9\u5ba1\u6838", "\u6743\u91cd\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25750v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Detecting CSAM Text-to-Image LoRAs From Weights", "tldr": "\u8bba\u6587\u63d0\u51fa\u76f4\u63a5\u4ece LoRA \u6743\u91cd\u4e2d\u68c0\u6d4b\u6f5c\u5728\u6709\u5bb3\u6587\u672c\u5230\u56fe\u50cf\u5fae\u8c03\u6a21\u578b\uff0c\u800c\u4e0d\u4f9d\u8d56\u5143\u6570\u636e\u6216\u751f\u6210\u6837\u672c\u3002\u65b9\u6cd5\u4f7f\u7528 LoRA \u66f4\u65b0\u77e9\u9635\u7684\u9996\u4e2a\u5947\u5f02\u5411\u91cf\u4f5c\u4e3a\u7d27\u51d1\u6307\u7eb9\uff0c\u5728\u4ee5\u4eba\u7269\u5e74\u9f84\u4e3a\u4ee3\u7406\u4efb\u52a1\u7684\u5b9e\u9a8c\u4e2d\u53ef\u8bc6\u522b\u8bad\u7ec3\u5185\u5bb9\u3001\u8de8\u57fa\u6a21\u578b\u6cdb\u5316\uff0c\u5e76\u5bf9\u566a\u58f0\u3001\u7f29\u653e\u548c\u4f4e\u7cbe\u5ea6\u8f83\u7a33\u5065\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language models are almost always quantized before they are deployed, and a growing line of work asks whether quantization also lowers their privacy risk. That work measures privacy almost entirely with membership inference. We think this is the wrong thing to measure for the risk that most people actually worry about, namely a model reproducing its training data word for word, and we measure that directly. Using the Pythia models and the public set of sequences each of them is known to have memorized, we track verbatim extraction across five precision levels, from full precision down to four bits, and across three model sizes, while measuring general capability (perplexity) at every point. We find two things. Quantization is a selective forgetter: verbatim memorization falls off faster than capability at every precision and every model size we tried, and this holds under two unrelated quantization algorithms and two evaluation corpora. But the selectivity is not enough to make quantization a privacy defense, which cuts against the optimistic reading of earlier membership-inference results. At the largest model we study, four-bit quantization still reproduces most of the memorized sequences while giving up only a few percent of capability, and the fraction of memorized data that survives quantization grows with model size. We conclude that compression should not be treated as a way to remove memorized training data, and that extraction, not membership inference, is the number practitioners should be watching. All code, sampled evaluation data, and per-configuration results are released.", "arxiv_id": "2607.25451", "arxiv_url": "https://arxiv.org/abs/2607.25451", "authors": ["Akshay Sasi"], "brief": "\u8bba\u6587\u76f4\u63a5\u8861\u91cf\u5927\u8bed\u8a00\u6a21\u578b\u91cf\u5316\u540e\u9010\u5b57\u590d\u73b0\u8bad\u7ec3\u6570\u636e\u7684\u98ce\u9669\uff0c\u800c\u975e\u4f9d\u8d56\u6210\u5458\u63a8\u65ad\u6307\u6807\u3002\u5b9e\u9a8c\u8868\u660e\u91cf\u5316\u4f1a\u6bd4\u6a21\u578b\u80fd\u529b\u66f4\u5feb\u5730\u964d\u4f4e\u9010\u5b57\u8bb0\u5fc6\uff0c\u4f46\u4e0d\u8db3\u4ee5\u4f5c\u4e3a\u9690\u79c1\u9632\u62a4\uff1a\u5927\u6a21\u578b\u57284\u6bd4\u7279\u91cf\u5316\u540e\u4ecd\u80fd\u590d\u73b0\u591a\u6570\u5df2\u8bb0\u5fc6\u5e8f\u5217\u3002", "categories": ["cs.LG", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25451", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u91cf\u5316", "\u9690\u79c1", "\u8bb0\u5fc6\u63d0\u53d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25451v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bits and Memories: Measuring Verbatim Extraction Across LLM Quantization", "tldr": "\u8bba\u6587\u76f4\u63a5\u8861\u91cf\u5927\u8bed\u8a00\u6a21\u578b\u91cf\u5316\u540e\u9010\u5b57\u590d\u73b0\u8bad\u7ec3\u6570\u636e\u7684\u98ce\u9669\uff0c\u800c\u975e\u4f9d\u8d56\u6210\u5458\u63a8\u65ad\u6307\u6807\u3002\u5b9e\u9a8c\u8868\u660e\u91cf\u5316\u4f1a\u6bd4\u6a21\u578b\u80fd\u529b\u66f4\u5feb\u5730\u964d\u4f4e\u9010\u5b57\u8bb0\u5fc6\uff0c\u4f46\u4e0d\u8db3\u4ee5\u4f5c\u4e3a\u9690\u79c1\u9632\u62a4\uff1a\u5927\u6a21\u578b\u57284\u6bd4\u7279\u91cf\u5316\u540e\u4ecd\u80fd\u590d\u73b0\u591a\u6570\u5df2\u8bb0\u5fc6\u5e8f\u5217\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) have been widely applied in high-stakes decision-making scenarios such as corporate strategy, and users are increasingly relying on their outputs. However, the deep integration of open-source model sharing ecosystems with LLM-powered critical decision-making applications also introduces critical risks: if an attacker can manipulate the model\u0027s cognitive stance, they can indirectly influence the judgments and actions of downstream decision-makers. This paper defines such threats as decision-level hijacking. Existing attacks fail to achieve targeted cognitive manipulation without triggering prohibited content or degrading model functionality. To fill this gap, this paper reveals that Bit-Flip Attacks (BFAs) can serve as an attack vector for inducing decision-level hijacking, requiring no real-time interaction or control over the training process, and only a minimal number of weight bits need to be flipped after deployment to achieve stealthy, low-cost, and persistent cognitive manipulation. Therefore, we propose CogBias, a cognitive bias injection framework for LLMs. CogBias converts subjective preferences into optimization signals via a differentiable sentiment evaluator, uses a multi-objective loss to jointly constrain multiple dimensions, and constructs BitScout to locate critical bits, achieving targeted cognitive intervention under an ultra-sparse flip budget. Experiments on Llama-3.2-3B, Mistral-7B, and Qwen2.5-14B, as well as on the commercial recommendation and controversial factual topic scenarios, demonstrate that flipping only a small number of bits stably induces significant stance shifts on target topics, while the impact on non-target tasks and overall output distribution is limited. This work demonstrates that minute perturbations to low-level weight data suffice to undermine the high-level value alignment of LLMs.", "arxiv_id": "2607.25227", "arxiv_url": "https://arxiv.org/abs/2607.25227", "authors": ["Yu Yan", "Jiahao Chen", "Siqi Lu", "Yongjuan Wang", "Ziming Zhao", "Zhaoxuan Li", "Tianyu Du", "Qingjun Yuan", "Shouling Ji"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u51b3\u7b56\u7ea7\u52ab\u6301\u201d\u5a01\u80c1\uff1a\u653b\u51fb\u8005\u901a\u8fc7\u6781\u5c11\u91cf\u6743\u91cd\u6bd4\u7279\u7ffb\u8f6c\uff0c\u5728\u4e0d\u660e\u663e\u7834\u574f\u6a21\u578b\u529f\u80fd\u7684\u60c5\u51b5\u4e0b\uff0c\u6301\u7eed\u8bf1\u5bfc\u5927\u8bed\u8a00\u6a21\u578b\u5728\u7279\u5b9a\u8bae\u9898\u4e0a\u4ea7\u751f\u7acb\u573a\u504f\u79fb\u3002\u4f5c\u8005\u63d0\u51fa CogBias \u6846\u67b6\uff0c\u5728 Llama\u3001Mistral\u3001Qwen \u7b49\u6a21\u578b\u548c\u63a8\u8350/\u4e89\u8bae\u4e8b\u5b9e\u573a\u666f\u4e2d\u9a8c\u8bc1\u4e86\u8be5\u653b\u51fb\u7684\u9690\u853d\u6027\u4e0e\u6709\u6548\u6027\uff0c\u63ed\u793a\u4e86\u5e95\u5c42\u6743\u91cd\u5fae\u5c0f\u6270\u52a8\u53ef\u7834\u574f\u9ad8\u5c42\u4ef7\u503c\u5bf9\u9f50\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25227", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u6bd4\u7279\u7ffb\u8f6c\u653b\u51fb", "\u4ef7\u503c\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25227v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Decision-Level Hijacking: Injecting Cognitive Bias into Large Language Models via Bit-Flip Attacks", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u51b3\u7b56\u7ea7\u52ab\u6301\u201d\u5a01\u80c1\uff1a\u653b\u51fb\u8005\u901a\u8fc7\u6781\u5c11\u91cf\u6743\u91cd\u6bd4\u7279\u7ffb\u8f6c\uff0c\u5728\u4e0d\u660e\u663e\u7834\u574f\u6a21\u578b\u529f\u80fd\u7684\u60c5\u51b5\u4e0b\uff0c\u6301\u7eed\u8bf1\u5bfc\u5927\u8bed\u8a00\u6a21\u578b\u5728\u7279\u5b9a\u8bae\u9898\u4e0a\u4ea7\u751f\u7acb\u573a\u504f\u79fb\u3002\u4f5c\u8005\u63d0\u51fa CogBias \u6846\u67b6\uff0c\u5728 Llama\u3001Mistral\u3001Qwen \u7b49\u6a21\u578b\u548c\u63a8\u8350/\u4e89\u8bae\u4e8b\u5b9e\u573a\u666f\u4e2d\u9a8c\u8bc1\u4e86\u8be5\u653b\u51fb\u7684\u9690\u853d\u6027\u4e0e\u6709\u6548\u6027\uff0c\u63ed\u793a\u4e86\u5e95\u5c42\u6743\u91cd\u5fae\u5c0f\u6270\u52a8\u53ef\u7834\u574f\u9ad8\u5c42\u4ef7\u503c\u5bf9\u9f50\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding accelerates large language model inference without changing the target distribution, but no single drafting structure performs best across real-world workloads. Autoregressive multi-token prediction (MTP) is a lightweight, stable proposal mechanism, whereas block-parallel diffusion amortizes drafting latency over much longer candidate sequences; the better choice depends strongly on the output distribution. We present AngelSpec, a unified training framework for MTP and block-parallel speculative decoding that addresses this heterogeneity at three levels. At the training level, rather than fitting one universal drafter to a uniform data mixture, we co-specialize structure and data: the MTP drafter is trained on diverse conversational data for high-entropy open-ended chat, and the block-diffusion drafter on code and mathematics data for longer predictable continuations. At the architecture level, we propose DFly, a block-diffusion framework combining a hybrid target-conditioning backbone with a predecessor-conditioned autoregressive head, improving target-feature utilization and intra-block dependency modeling while keeping generation parallel. At the inference level, both acceptance length and verification cost vary with domain, request, online load, and hardware, so DFly treats verification as a shared batch-level resource: it reallocates compute toward high-confidence prefixes across requests and combines expected utility with a profiled cost model to adapt verification depth online. Across the Hy3 series, DFly raises the average accepted length on Hy3-A21B by roughly 30% and attains the highest average throughput at every tested concurrency from 4 to 64, a 1.98-2.40x speedup over autoregressive decoding and 10.5-11.8% higher throughput than DFlash. We release AngelSpec to support training and extending these methods.", "arxiv_id": "2607.25852", "arxiv_url": "https://arxiv.org/abs/2607.25852", "authors": ["Hong Liu", "Rui Cen", "Junhan Shi", "Guangshuo Qin", "Jiebin Zhang", "Tianyu Liu", "Runzhi Fan", "Guoliang Zhao", "Ruobing Xie", "Kai Zhang", "Song Liu", "Guanghua Yu", "Jianchen Zhu"], "brief": "AngelSpec \u63d0\u51fa\u7edf\u4e00\u7684\u63a8\u6d4b\u89e3\u7801\u8bad\u7ec3\u4e0e\u63a8\u7406\u6846\u67b6\uff0c\u9488\u5bf9\u4e0d\u540c\u8f93\u51fa\u5206\u5e03\u5206\u522b\u8bad\u7ec3 MTP \u8349\u7a3f\u5668\u548c\u5757\u5e76\u884c\u6269\u6563\u8349\u7a3f\u5668\uff0c\u5e76\u8bbe\u8ba1 DFly \u67b6\u6784\u63d0\u5347\u957f\u5019\u9009\u5e8f\u5217\u7684\u5e76\u884c\u8349\u7a3f\u8d28\u91cf\u3002\u5b9e\u9a8c\u663e\u793a\u5728 Hy3 \u7cfb\u5217\u4e0a\uff0cDFly \u5c06\u5e73\u5747\u63a5\u53d7\u957f\u5ea6\u63d0\u5347\u7ea6 30%\uff0c\u76f8\u8f83\u81ea\u56de\u5f52\u89e3\u7801\u83b7\u5f97 1.98-2.40 \u500d\u52a0\u901f\uff0c\u5e76\u6bd4 DFlash \u541e\u5410\u9ad8 10.5-11.8%\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25852", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u6d4b\u89e3\u7801", "\u6269\u6563\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25852v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AngelSpec: Towards Real-World High Performance Inference with Speculative Decoding", "tldr": "AngelSpec \u63d0\u51fa\u7edf\u4e00\u7684\u63a8\u6d4b\u89e3\u7801\u8bad\u7ec3\u4e0e\u63a8\u7406\u6846\u67b6\uff0c\u9488\u5bf9\u4e0d\u540c\u8f93\u51fa\u5206\u5e03\u5206\u522b\u8bad\u7ec3 MTP \u8349\u7a3f\u5668\u548c\u5757\u5e76\u884c\u6269\u6563\u8349\u7a3f\u5668\uff0c\u5e76\u8bbe\u8ba1 DFly \u67b6\u6784\u63d0\u5347\u957f\u5019\u9009\u5e8f\u5217\u7684\u5e76\u884c\u8349\u7a3f\u8d28\u91cf\u3002\u5b9e\u9a8c\u663e\u793a\u5728 Hy3 \u7cfb\u5217\u4e0a\uff0cDFly \u5c06\u5e73\u5747\u63a5\u53d7\u957f\u5ea6\u63d0\u5347\u7ea6 30%\uff0c\u76f8\u8f83\u81ea\u56de\u5f52\u89e3\u7801\u83b7\u5f97 1.98-2.40 \u500d\u52a0\u901f\uff0c\u5e76\u6bd4 DFlash \u541e\u5410\u9ad8 10.5-11.8%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Memory has evolved into a foundational architectural dimension in large language models (LLMs), shifting from an implicit byproduct of computation to a spectrum of explicit, controllable mechanisms. While recent advances introduce diverse strategies---spanning transient attention, recurrent state dynamics, parameter-efficient adaptations, and scalable lookup storage---this rapid evolution has led to a highly fragmented research landscape. In this survey, we present a systematic, architecture-centric taxonomy of memory in LLMs. Our framework characterizes memory along three orthogonal axes: representation (implicit versus explicit), update dynamics (offline versus online), and persistence (short-term versus long-term). We further formalize the granular mechanisms dictating memory writing, routing, state transitions, and consolidation. This unified perspective elucidates the conceptual boundaries between computation-coupled and independently addressable memory, effectively bridging disparate architectural paradigms. Additionally, we critically analyze hybrid memory architectures, system-level efficiency trade-offs, and multi-dimensional evaluation methodologies. By consolidating these scattered advancements into a cohesive framework, this survey charts the trajectory of memory-centric LLM design and provides a principled foundation for future innovations in scalable and adaptive language modeling.", "arxiv_id": "2607.25380", "arxiv_url": "https://arxiv.org/abs/2607.25380", "authors": ["Sining Zhoubian", "Dan Zhang", "Evgeny Kharlamov", "Jie Tang"], "brief": "\u8fd9\u7bc7\u7efc\u8ff0\u7cfb\u7edf\u68b3\u7406\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u8bb0\u5fc6\u673a\u5236\uff0c\u4ece\u8868\u793a\u5f62\u5f0f\u3001\u66f4\u65b0\u52a8\u6001\u548c\u6301\u4e45\u6027\u4e09\u4e2a\u7ef4\u5ea6\u5efa\u7acb\u67b6\u6784\u4e2d\u5fc3\u7684\u5206\u7c7b\u6846\u67b6\u3002\u8bba\u6587\u7edf\u4e00\u5206\u6790\u4e86\u6ce8\u610f\u529b\u3001\u5faa\u73af\u72b6\u6001\u3001\u53c2\u6570\u9ad8\u6548\u9002\u914d\u3001\u5916\u90e8\u68c0\u7d22\u5b58\u50a8\u7b49\u4e0d\u540c\u8bb0\u5fc6\u8303\u5f0f\uff0c\u5e76\u8ba8\u8bba\u6df7\u5408\u67b6\u6784\u3001\u6548\u7387\u6743\u8861\u4e0e\u8bc4\u4f30\u65b9\u6cd5\uff0c\u4e3a\u53ef\u6269\u5c55\u3001\u53ef\u81ea\u9002\u5e94\u7684\u8bb0\u5fc6\u578bLLM\u8bbe\u8ba1\u63d0\u4f9b\u53c2\u8003\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25380", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8bb0\u5fc6\u673a\u5236", "\u6a21\u578b\u67b6\u6784", "\u7efc\u8ff0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25380v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Memory for Large Language Models", "tldr": "\u8fd9\u7bc7\u7efc\u8ff0\u7cfb\u7edf\u68b3\u7406\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u8bb0\u5fc6\u673a\u5236\uff0c\u4ece\u8868\u793a\u5f62\u5f0f\u3001\u66f4\u65b0\u52a8\u6001\u548c\u6301\u4e45\u6027\u4e09\u4e2a\u7ef4\u5ea6\u5efa\u7acb\u67b6\u6784\u4e2d\u5fc3\u7684\u5206\u7c7b\u6846\u67b6\u3002\u8bba\u6587\u7edf\u4e00\u5206\u6790\u4e86\u6ce8\u610f\u529b\u3001\u5faa\u73af\u72b6\u6001\u3001\u53c2\u6570\u9ad8\u6548\u9002\u914d\u3001\u5916\u90e8\u68c0\u7d22\u5b58\u50a8\u7b49\u4e0d\u540c\u8bb0\u5fc6\u8303\u5f0f\uff0c\u5e76\u8ba8\u8bba\u6df7\u5408\u67b6\u6784\u3001\u6548\u7387\u6743\u8861\u4e0e\u8bc4\u4f30\u65b9\u6cd5\uff0c\u4e3a\u53ef\u6269\u5c55\u3001\u53ef\u81ea\u9002\u5e94\u7684\u8bb0\u5fc6\u578bLLM\u8bbe\u8ba1\u63d0\u4f9b\u53c2\u8003\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Joint-Embedding Predictive Architectures (JEPAs) learn world models by predicting in representation space rather than reconstructing pixels, making them a natural backbone for latent model predictive control from offline demonstration logs. JEPA-style training optimizes short-horizon latent prediction, whereas planning requires a multi-step ranking of imagined futures by goal progress. Prior JEPA planners often inherit that ranking from embedding geometry, typically latent Euclidean distance, which arises as a byproduct of representation learning rather than as a progress cost mined from the logs. We propose temporal-distance JEPA (TD-JEPA), which retains the LeWM encoder--predictor backbone and mines a directed temporal cost from reward-free trajectories: same-trajectory step order supplies positive targets, cross-trajectory pairs act as heuristic negatives, and a rollout-consistency term matches the planner horizon. The mined supervision serves two roles: as the deployed planning cost when progress is topological, and as a representation signal that improves Euclidean planning when contact geometry dominates. Under locked evaluation, deploying the mined cost raises Two-Room success to 100.0% versus LeWM\u0027s 97.4%, while shared Euclidean planning on the same temporally trained checkpoint raises OGB-Cube by 14.2 points over LeWM and improves Push-T. Against LeWM and the concurrent RC-aux baseline under locked evaluation, TD-JEPA matches or exceeds both methods on every environment. Ablations show that the directed head, cross-trajectory negatives, and rollout consistency each contribute. TD-JEPA narrows the train--plan gap for JEPA world-model planners by discovering temporal progress structure in offline logs and co-designing cost form with plan-time deployment. Code is available at https://github.com/HKBU-KnowComp/TD-JEPA.", "arxiv_id": "2607.25337", "arxiv_url": "https://arxiv.org/abs/2607.25337", "authors": ["Jiaxin Bai", "Jiaxuan Xiong"], "brief": "\u672c\u6587\u63d0\u51fa TD-JEPA\uff0c\u5728 JEPA \u6f5c\u5728\u4e16\u754c\u6a21\u578b\u4e2d\u4ece\u79bb\u7ebf\u65e0\u5956\u52b1\u8f68\u8ff9\u6316\u6398\u6709\u5411\u65f6\u95f4\u8ddd\u79bb\uff0c\u7528\u4f5c\u89c4\u5212\u4ee3\u4ef7\u5e76\u8f85\u52a9\u8868\u5f81\u5b66\u4e60\uff0c\u4ee5\u7f29\u5c0f\u8bad\u7ec3\u76ee\u6807\u4e0e\u591a\u6b65\u89c4\u5212\u9700\u6c42\u7684\u5dee\u8ddd\u3002\u5b9e\u9a8c\u4e2d\u5728\u591a\u4e2a\u73af\u5883\u4e0a\u8d85\u8fc7\u6216\u5339\u914d LeWM \u4e0e RC-aux\uff0cTwo-Room \u6210\u529f\u7387\u8fbe 100%\uff0cOGB-Cube \u63d0\u5347 14.2 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u9a8c\u8bc1\u4e86\u6709\u5411\u5934\u3001\u8de8\u8f68\u8ff9\u8d1f\u6837\u672c\u548c rollout \u4e00\u81f4\u6027\u7684\u4f5c\u7528\u3002", "categories": ["cs.CL", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25337", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u6a21\u578b\u9884\u6d4b\u63a7\u5236", "\u673a\u5668\u4eba\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25337v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Temporal-Distance JEPA: Plan-Aware Representation Learning for Latent World Model Predictive Control", "tldr": "\u672c\u6587\u63d0\u51fa TD-JEPA\uff0c\u5728 JEPA \u6f5c\u5728\u4e16\u754c\u6a21\u578b\u4e2d\u4ece\u79bb\u7ebf\u65e0\u5956\u52b1\u8f68\u8ff9\u6316\u6398\u6709\u5411\u65f6\u95f4\u8ddd\u79bb\uff0c\u7528\u4f5c\u89c4\u5212\u4ee3\u4ef7\u5e76\u8f85\u52a9\u8868\u5f81\u5b66\u4e60\uff0c\u4ee5\u7f29\u5c0f\u8bad\u7ec3\u76ee\u6807\u4e0e\u591a\u6b65\u89c4\u5212\u9700\u6c42\u7684\u5dee\u8ddd\u3002\u5b9e\u9a8c\u4e2d\u5728\u591a\u4e2a\u73af\u5883\u4e0a\u8d85\u8fc7\u6216\u5339\u914d LeWM \u4e0e RC-aux\uff0cTwo-Room \u6210\u529f\u7387\u8fbe 100%\uff0cOGB-Cube \u63d0\u5347 14.2 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u9a8c\u8bc1\u4e86\u6709\u5411\u5934\u3001\u8de8\u8f68\u8ff9\u8d1f\u6837\u672c\u548c rollout \u4e00\u81f4\u6027\u7684\u4f5c\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The quadratic cost of self-attention makes long-context inference prohibitively expensive, and proxy-based block-sparse attention has become a practical remedy. Existing methods typically rely on a proxy to predict a binary sparse mask and a kernel to consume this mask and perform sparse attention computation. Such an approach is effective under moderate budgets. However, as the budget tightens, the estimated proxy inevitably drops some salient blocks, while the kernel can only apply the sparse mask mechanically, leading to an evident drop in model accuracy. We propose CoSA, a two-stage training-free Sparse Attention under proxy-kernel CO-design, which couples a Kernel-Aware Proxy (KAP) with an Ordered-Skipping Kernel (OSK). In the first stage, the KAP selects blocks under a moderate budget and produces an ordered mask that prescribes the order in which KV pages are visited in the kernel inner loop. In the second stage, the OSK applies this mask and skips more blocks under a tightened budget given online-softmax statistics. Across mainstream LLM backbones and long-context benchmarks, CoSA attains higher accuracy at lower budgets. Impressively, CoSA achieves a 4.93$\\times$ attention speedup and reduces end-to-end Time-to-First-Token by 2.53$\\times$ under a context length of 128K with negligible performance degradation.", "arxiv_id": "2607.25291", "arxiv_url": "https://arxiv.org/abs/2607.25291", "authors": ["Yufei Xue", "Lin Niu", "Hong Liu", "Siran Liu", "Hanyong Shao", "Wei Liu", "Guanghua Yu", "Jianchen Zhu", "Jun Zhang"], "brief": "CoSA \u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u957f\u4e0a\u4e0b\u6587\u7a00\u758f\u6ce8\u610f\u529b\u65b9\u6848\uff0c\u901a\u8fc7\u4ee3\u7406\u4e0e\u8ba1\u7b97\u5185\u6838\u534f\u540c\u8bbe\u8ba1\uff0c\u5728\u4e2d\u7b49\u9884\u7b97\u4e0b\u5148\u751f\u6210\u6709\u5e8f\u7a00\u758f\u63a9\u7801\uff0c\u518d\u7531\u5185\u6838\u7ed3\u5408\u5728\u7ebf softmax \u7edf\u8ba1\u8fdb\u4e00\u6b65\u8df3\u8fc7\u4e0d\u91cd\u8981\u5757\u3002\u5b83\u5728\u4e3b\u6d41\u5927\u6a21\u578b\u548c\u957f\u4e0a\u4e0b\u6587\u57fa\u51c6\u4e0a\u4ee5\u66f4\u4f4e\u9884\u7b97\u4fdd\u6301\u66f4\u9ad8\u7cbe\u5ea6\uff0c\u5728 128K \u4e0a\u5b9e\u73b0 4.93 \u500d\u6ce8\u610f\u529b\u52a0\u901f\u548c 2.53 \u500d\u9996 token \u5ef6\u8fdf\u964d\u4f4e\uff0c\u6027\u80fd\u635f\u5931\u5f88\u5c0f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25291", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u7a00\u758f\u6ce8\u610f\u529b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25291v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoSA: Accelerating Long-Context Inference via Proxy-Kernel Co-Designed Sparse Attention", "tldr": "CoSA \u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u957f\u4e0a\u4e0b\u6587\u7a00\u758f\u6ce8\u610f\u529b\u65b9\u6848\uff0c\u901a\u8fc7\u4ee3\u7406\u4e0e\u8ba1\u7b97\u5185\u6838\u534f\u540c\u8bbe\u8ba1\uff0c\u5728\u4e2d\u7b49\u9884\u7b97\u4e0b\u5148\u751f\u6210\u6709\u5e8f\u7a00\u758f\u63a9\u7801\uff0c\u518d\u7531\u5185\u6838\u7ed3\u5408\u5728\u7ebf softmax \u7edf\u8ba1\u8fdb\u4e00\u6b65\u8df3\u8fc7\u4e0d\u91cd\u8981\u5757\u3002\u5b83\u5728\u4e3b\u6d41\u5927\u6a21\u578b\u548c\u957f\u4e0a\u4e0b\u6587\u57fa\u51c6\u4e0a\u4ee5\u66f4\u4f4e\u9884\u7b97\u4fdd\u6301\u66f4\u9ad8\u7cbe\u5ea6\uff0c\u5728 128K \u4e0a\u5b9e\u73b0 4.93 \u500d\u6ce8\u610f\u529b\u52a0\u901f\u548c 2.53 \u500d\u9996 token \u5ef6\u8fdf\u964d\u4f4e\uff0c\u6027\u80fd\u635f\u5931\u5f88\u5c0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Different research lines use the term world model in different ways, yet they share a common aim: to capture how the world evolves under action in a form that supports perception, simulation, and planning. Two prominent realizations are neural predictors that learn dynamics in continuous vector spaces, and hand-built physics engines that expose explicit state and physical laws. Neural predictors scale from data but leave the form of the dynamics implicit; physics engines are inspectable and editable but difficult to construct at scale. We introduce VisualPatchWorld (VPW), which represents world dynamics as code. VPW first selects a qualitative dynamical form with short active probes, then fits that form\u0027s free parameters from recorded state-action traces by minimizing multi-step prediction error. The resulting programs can be rolled forward like a simulator, inspected in source form, and used inside model-predictive control; image-derived scene graphs can supply the live state at replan time. Across comparisons with prior code-based world models, VPW attains 69.0% mean planning success and exceeds the strongest code baseline by 23.5 points. The largest gains arise when choosing the correct qualitative dynamics is essential. Under the same planner, the induced models approach ground-truth engine success on navigation and grasp-rich control; a residual gap remains for contact-rich pushing, and checking a shortlist of promising plans in the engine closes most of that gap. These results establish a practical route toward automatically constructed code world models that are useful for planning. Code is available at https://github.com/HKBU-KnowComp/VisualPatchWorld/.", "arxiv_id": "2607.25236", "arxiv_url": "https://arxiv.org/abs/2607.25236", "authors": ["Jiaxin Bai", "Jiaxuan Xiong"], "brief": "\u8bba\u6587\u63d0\u51fa VisualPatchWorld\uff0c\u5c06\u4e16\u754c\u52a8\u6001\u8868\u793a\u4e3a\u53ef\u68c0\u67e5\u3001\u53ef\u6267\u884c\u7684\u4ee3\u7801\u6a21\u578b\uff1a\u5148\u7528\u77ed\u4e3b\u52a8\u63a2\u6d4b\u9009\u62e9\u5b9a\u6027\u52a8\u529b\u5b66\u5f62\u5f0f\uff0c\u518d\u4ece\u72b6\u6001-\u52a8\u4f5c\u8f68\u8ff9\u4e2d\u62df\u5408\u53c2\u6570\u3002\u8be5\u6a21\u578b\u53ef\u50cf\u6a21\u62df\u5668\u4e00\u6837\u6eda\u52a8\u9884\u6d4b\u5e76\u7528\u4e8e\u6a21\u578b\u9884\u6d4b\u63a7\u5236\uff0c\u5e73\u5747\u89c4\u5212\u6210\u529f\u7387\u8fbe 69.0%\uff0c\u6bd4\u6700\u5f3a\u4ee3\u7801\u57fa\u7ebf\u9ad8 23.5 \u4e2a\u767e\u5206\u70b9\uff0c\u5728\u5bfc\u822a\u548c\u6293\u53d6\u4efb\u52a1\u4e0a\u63a5\u8fd1\u771f\u5b9e\u7269\u7406\u5f15\u64ce\u3002", "categories": ["cs.CL", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25236", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c4\u5212", "\u673a\u5668\u4eba", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25236v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VisualPatchWorld: Code World Models as Latent Structured Representations for Planning", "tldr": "\u8bba\u6587\u63d0\u51fa VisualPatchWorld\uff0c\u5c06\u4e16\u754c\u52a8\u6001\u8868\u793a\u4e3a\u53ef\u68c0\u67e5\u3001\u53ef\u6267\u884c\u7684\u4ee3\u7801\u6a21\u578b\uff1a\u5148\u7528\u77ed\u4e3b\u52a8\u63a2\u6d4b\u9009\u62e9\u5b9a\u6027\u52a8\u529b\u5b66\u5f62\u5f0f\uff0c\u518d\u4ece\u72b6\u6001-\u52a8\u4f5c\u8f68\u8ff9\u4e2d\u62df\u5408\u53c2\u6570\u3002\u8be5\u6a21\u578b\u53ef\u50cf\u6a21\u62df\u5668\u4e00\u6837\u6eda\u52a8\u9884\u6d4b\u5e76\u7528\u4e8e\u6a21\u578b\u9884\u6d4b\u63a7\u5236\uff0c\u5e73\u5747\u89c4\u5212\u6210\u529f\u7387\u8fbe 69.0%\uff0c\u6bd4\u6700\u5f3a\u4ee3\u7801\u57fa\u7ebf\u9ad8 23.5 \u4e2a\u767e\u5206\u70b9\uff0c\u5728\u5bfc\u822a\u548c\u6293\u53d6\u4efb\u52a1\u4e0a\u63a5\u8fd1\u771f\u5b9e\u7269\u7406\u5f15\u64ce\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video editing is fundamentally message-driven: even from the same source footage, the selected shots change depending on the narrative the editor wishes to convey. Benchmarks for a closely related task, video summarization, reduce editorial intent to a single, message-agnostic notion of saliency and thus do not account for this diversity. For evaluating message-driven video editing, we present \\textbf{MEDit-Bench}, a dataset and benchmark, which pairs long-form videos with multiple editing messages and multiple professionally produced edits per message, demonstrating that different messages yield substantially different edits from the same source. We define an automatic evaluation protocol based on temporal alignment metrics, and find that an LLM-as-a-judge preference, a natural proxy for narrative quality, is unreliable for this task due to severe position bias. We additionally annotate each message with ambiguity and contextfulness scores, and show that both dimensions negatively correlate with model performance, establishing message difficulty as a meaningful stratification factor. Experiments with state-of-the-art MLLMs and reinforcement fine-tuned baselines show that while strong models approach human temporal alignment at lenient thresholds, all models fall behind humans at stricter criteria. A human perceptual study further confirms a large quality gap, with professional human edits remaining consistently preferred over model outputs.", "arxiv_id": "2607.25300", "arxiv_url": "https://arxiv.org/abs/2607.25300", "authors": ["Katsuya Ogata", "Zongshang Pang", "Mayu Otani", "Yuta Nakashima"], "brief": "\u672c\u6587\u63d0\u51fa MEDit-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u201c\u6309\u53d9\u4e8b\u4fe1\u606f\u9a71\u52a8\u201d\u7684\u957f\u89c6\u9891\u526a\u8f91\uff0c\u5305\u542b\u540c\u4e00\u7d20\u6750\u5bf9\u5e94\u591a\u79cd\u7f16\u8f91\u610f\u56fe\u548c\u591a\u4e2a\u4e13\u4e1a\u526a\u8f91\u7248\u672c\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u591a\u6a21\u6001\u5927\u6a21\u578b\u548c\u5f3a\u5316\u5fae\u8c03\u57fa\u7ebf\u5728\u5bbd\u677e\u65f6\u95f4\u5bf9\u9f50\u6307\u6807\u4e0b\u63a5\u8fd1\u4eba\u7c7b\uff0c\u4f46\u4e25\u683c\u6807\u51c6\u548c\u611f\u77e5\u8d28\u91cf\u4e0a\u4ecd\u660e\u663e\u843d\u540e\u4e8e\u4e13\u4e1a\u526a\u8f91\uff0c\u540c\u65f6 LLM-as-a-judge \u5b58\u5728\u4e25\u91cd\u4f4d\u7f6e\u504f\u5dee\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25300", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25300v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MEDit-Bench: A Dataset for Evaluating Message-Driven Narrative Video Editing", "tldr": "\u672c\u6587\u63d0\u51fa MEDit-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u201c\u6309\u53d9\u4e8b\u4fe1\u606f\u9a71\u52a8\u201d\u7684\u957f\u89c6\u9891\u526a\u8f91\uff0c\u5305\u542b\u540c\u4e00\u7d20\u6750\u5bf9\u5e94\u591a\u79cd\u7f16\u8f91\u610f\u56fe\u548c\u591a\u4e2a\u4e13\u4e1a\u526a\u8f91\u7248\u672c\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u591a\u6a21\u6001\u5927\u6a21\u578b\u548c\u5f3a\u5316\u5fae\u8c03\u57fa\u7ebf\u5728\u5bbd\u677e\u65f6\u95f4\u5bf9\u9f50\u6307\u6807\u4e0b\u63a5\u8fd1\u4eba\u7c7b\uff0c\u4f46\u4e25\u683c\u6807\u51c6\u548c\u611f\u77e5\u8d28\u91cf\u4e0a\u4ecd\u660e\u663e\u843d\u540e\u4e8e\u4e13\u4e1a\u526a\u8f91\uff0c\u540c\u65f6 LLM-as-a-judge \u5b58\u5728\u4e25\u91cd\u4f4d\u7f6e\u504f\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];

  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
