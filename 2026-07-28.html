\u548c\u6709\u6548\u5956\u52b1\u4fe1\u53f7\u65f6\u53ef\u7a33\u5b9a\u63d0\u5347\u504f\u597d\u80dc\u7387\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "math.OC", "stat.CO"], "github_repo": "https://github.com/rezwanh001/SLM-RL-Agents", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2607.25091", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5728Pythia\u3001SmolLM2\u7b4915\u4e2a\u6a21\u578b-\u8bed\u6599\u914d\u7f6e\u4e2d\u8bc6\u522b\u4e09\u7c7b\u53ef\u590d\u73b0\u5931\u8d25\uff1aLoRA\u53c2\u6570\u9759\u9ed8\u51bb\u7ed3\u3001bfloat16\u91cd\u8981\u6027\u6bd4\u6ea2\u51fa\u3001\u5956\u52b1\u6a21\u578b\u8bef\u5dee\u5bfc\u81f4\u7b56\u7565\u5d29\u6e83", "\u63d0\u51famerge-and-reinitialize\u9002\u914d\u5668\u3001PPO\u66f4\u65b0\u4f7f\u7528float32\uff0c\u4ee5\u53ca\u5956\u52b1\u767d\u5316\u3001\u91cd\u8981\u6027\u6bd4\u4fdd\u62a4\u3001\u6743\u91cd\u56de\u6eda\u4e09\u5c42\u5b89\u5168\u673a\u5236", "\u63d0\u51fa\u201c\u5bb9\u91cf\u4f59\u91cf\u5047\u8bf4\u201d\uff1a\u5c0f\u6a21\u578bPPO\u6548\u679c\u4e0d\u4e3b\u8981\u53d6\u51b3\u4e8e\u53c2\u6570\u91cf\uff0c\u800c\u53d6\u51b3\u4e8ePPL\u003c20\u7684\u6d41\u7545\u76d1\u7763\u6a21\u578b\u548c\u53ef\u533a\u5206\u7684\u5956\u52b1\u4fe1\u53f7"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5c0f\u8bed\u8a00\u6a21\u578b", "\u5bf9\u9f50", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25091v1", "published_at": "2026-07-27", "score": 0.207, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.25091.png", "title": "Towards Robust Reinforcement Learning for Small-Scale Language Model Agents", "tldr": "\u7cfb\u7edf\u6392\u67e5\u5c0f\u6a21\u578bPPO\u5bf9\u9f50\u5931\u7a33\u5e76\u7ed9\u51fa\u4fee\u590d", "upvotes": 1, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a7670M\u5230500M\u5c0f\u8bed\u8a00\u6a21\u578b\u7528PPO\u505a\u5f3a\u5316\u5b66\u4e60\u5bf9\u9f50\u65f6\u7684\u4e0d\u7a33\u5b9a\u6765\u6e90\uff0c\u5e76\u5728\u591a\u4e2a\u6a21\u578b\u4e0e\u8bed\u6599\u7ec4\u5408\u4e0a\u590d\u73b0\u5b9e\u9a8c\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u5957\u5de5\u7a0b\u4fee\u590d\u4e0e\u5b89\u5168\u673a\u5236\uff0c\u4f7f\u5c0f\u6a21\u578b\u5728\u5177\u5907\u6d41\u7545SFT\u5148\u9a8c\u548c\u6709\u6548\u5956\u52b1\u4fe1\u53f7\u65f6\u53ef\u7a33\u5b9a\u63d0\u5347\u504f\u597d\u80dc\u7387\u3002", "why_notable": "\u8bba\u6587\u5c06\u5c0f\u8bed\u8a00\u6a21\u578bRL\u5bf9\u9f50\u7684\u4e0d\u7a33\u5b9a\u95ee\u9898\u4ece\u7ecf\u9a8c\u73b0\u8c61\u62c6\u89e3\u4e3a\u5177\u4f53\u53ef\u590d\u73b0\u7684\u5de5\u7a0b\u4e0e\u4f18\u5316\u6545\u969c\uff0c\u5e76\u7ed9\u51fa\u5b9e\u7528\u4fee\u590d\u65b9\u6848\uff1b\u5bf9\u4f4e\u6210\u672c\u8bad\u7ec3\u53ef\u63a7\u3001\u504f\u597d\u5bf9\u9f50\u7684\u5c0f\u6a21\u578b\u548c\u8f7b\u91cf\u7ea7LLM\u667a\u80fd\u4f53\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Driving style captures stable, driver-specific patterns in how a vehicle is driven. In naturalistic data, however, this signal is hard to isolate because drivers are observed in different vehicles, on different roads, and under different conditions, so models may mistake vehicle- or situation-specific regularities for driver-specific style. We introduce DriveDNA, a large-scale naturalistic dataset and benchmark for personalized driving-style modeling, comprising 4,121 drives from 465 drivers across 115 vehicle models and totaling 975 hours of human-controlled driving at 10 Hz with forward video, collected from community drivers in everyday use. DriveDNA defines driving style as a consistent, driver-specific behavioral pattern in how a vehicle moves under similar conditions. The benchmark evaluates this signal through three core tasks: few-shot driver re-identification, personalized behavior prediction, and condition-matched comparison, and provides behavioral annotations plus 276,248 rule-generated maneuver events across six classes with large-scale human auditing. We evaluate baselines spanning classical descriptors, supervised and self-supervised time-series encoders, multimodal fusion, probabilistic prediction, and zero-shot foundation models under a fixed multi-seed protocol. Learned representations substantially outperform classical descriptors on unseen drivers (AUROC .935 vs. .707) and retain driver-specific information under matched driving conditions, while descriptor performance approaches chance. Video-only models achieve comparable re-identification accuracy but exhibit severe route leakage, showing that strong recognition may arise from contextual shortcuts rather than driving behavior. These findings show that reliable driving-style evaluation must assess both the behavioral value of learned representations and their robustness to vehicle, drive, and condition confounds.", "arxiv_id": "2607.23822", "arxiv_url": "https://arxiv.org/abs/2607.23822", "authors": ["Yuhang Wang", "Lingyao Li", "Hao Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa DriveDNA\uff0c\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u9a7e\u9a76\u98ce\u683c\u5efa\u6a21\u7684\u5927\u89c4\u6a21\u591a\u6a21\u6001\u81ea\u7136\u9a7e\u9a76\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\u3002\u6570\u636e\u5305\u542b465\u540d\u53f8\u673a\u3001115\u79cd\u8f66\u578b\u30014121\u6b21\u884c\u7a0b\u3001975\u5c0f\u65f610Hz\u4eba\u7c7b\u9a7e\u9a76\u6570\u636e\u548c\u524d\u5411\u89c6\u9891\uff0c\u5e76\u8bbe\u8ba1\u5c11\u6837\u672c\u53f8\u673a\u91cd\u8bc6\u522b\u3001\u4e2a\u6027\u5316\u884c\u4e3a\u9884\u6d4b\u3001\u6761\u4ef6\u5339\u914d\u6bd4\u8f83\u4e09\u7c7b\u4efb\u52a1\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/WangYuHang-cmd/DriveDNA", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.23822", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5b9a\u4e49\u9a7e\u9a76\u98ce\u683c\u4e3a\u76f8\u4f3c\u6761\u4ef6\u4e0b\u8f66\u8f86\u8fd0\u52a8\u4e2d\u7a33\u5b9a\u7684\u53f8\u673a\u7279\u5f02\u884c\u4e3a\u6a21\u5f0f\uff0c\u5f3a\u8c03\u5265\u79bb\u8f66\u578b\u3001\u8def\u7ebf\u548c\u573a\u666f\u6df7\u6dc6\u56e0\u7d20\u3002", "\u63d0\u4f9b\u884c\u4e3a\u6807\u6ce8\u4e0e276,248\u4e2a\u89c4\u5219\u751f\u6210\u7684\u516d\u7c7b\u673a\u52a8\u4e8b\u4ef6\uff0c\u5e76\u7ecf\u8fc7\u5927\u89c4\u6a21\u4eba\u5de5\u5ba1\u8ba1\u3002", "\u5b66\u4e60\u8868\u5f81\u5728\u672a\u89c1\u53f8\u673a\u91cd\u8bc6\u522b\u4e0a\u663e\u8457\u4f18\u4e8e\u4f20\u7edf\u63cf\u8ff0\u5b50\uff08AUROC 0.935 vs 0.707\uff09\uff0c\u4f46\u89c6\u9891\u6a21\u578b\u5b58\u5728\u4e25\u91cd\u8def\u7ebf\u6cc4\u6f0f\u98ce\u9669\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u591a\u6a21\u6001", "\u884c\u4e3a\u5efa\u6a21", "\u6570\u636e\u96c6"], "num_comments": 1, "on_hf": true, "organization": "MOTIF-LAB", "pdf_url": "https://arxiv.org/pdf/2607.23822v1", "published_at": "2026-07-26", "score": 0.205, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23822.png", "title": "DriveDNA: A Large-Scale Multimodal Naturalistic Driving Dataset and Benchmark for Driving Style Identification", "tldr": "\u5927\u89c4\u6a21\u81ea\u7136\u9a7e\u9a76\u6570\u636e\u96c6\u8bc4\u6d4b\u9a7e\u9a76\u98ce\u683c\u8bc6\u522b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DriveDNA\uff0c\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u9a7e\u9a76\u98ce\u683c\u5efa\u6a21\u7684\u5927\u89c4\u6a21\u591a\u6a21\u6001\u81ea\u7136\u9a7e\u9a76\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\u3002\u6570\u636e\u5305\u542b465\u540d\u53f8\u673a\u3001115\u79cd\u8f66\u578b\u30014121\u6b21\u884c\u7a0b\u3001975\u5c0f\u65f610Hz\u4eba\u7c7b\u9a7e\u9a76\u6570\u636e\u548c\u524d\u5411\u89c6\u9891\uff0c\u5e76\u8bbe\u8ba1\u5c11\u6837\u672c\u53f8\u673a\u91cd\u8bc6\u522b\u3001\u4e2a\u6027\u5316\u884c\u4e3a\u9884\u6d4b\u3001\u6761\u4ef6\u5339\u914d\u6bd4\u8f83\u4e09\u7c7b\u4efb\u52a1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u9a7e\u9a76\u98ce\u683c\u8bc6\u522b\u63d0\u4f9b\u4e86\u5c11\u89c1\u7684\u5927\u89c4\u6a21\u771f\u5b9e\u4e16\u754c\u591a\u6a21\u6001\u57fa\u51c6\uff0c\u5e76\u7cfb\u7edf\u63ed\u793a\u4e86\u4e0a\u4e0b\u6587\u6377\u5f84\u4f1a\u5938\u5927\u6a21\u578b\u6027\u80fd\uff0c\u5bf9\u81ea\u52a8\u9a7e\u9a76\u4e2a\u6027\u5316\u3001\u9a7e\u9a76\u5458\u5efa\u6a21\u548c\u5b89\u5168\u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Computer-use agents (CUAs) increasingly act through desktop GUIs to complete long-horizon tasks. Current benchmarks primarily measure end-task success or single-frame grounding. Neither isolates whether a model can reconstruct the causal, task-relevant transition produced by an action- crucial for rejecting stale observations, verifying progress, and recovering from failure. This is difficult because inference, remote input, app rendering, and screenshot capture are asynchronous: the next observation may be delayed, occluded, transient, or unrelated, then misread as progress and carried into subsequent planning. We introduce Desktop-Delta Bench (DDB), an offline step-level benchmark with 2,013 human-verified instances from novel, multi-app Linux trajectories across ~15 applications and 50 task domains. DDB trajectories targets 3 failure dimensions- state verification, source tracking, and context-aware control- through 2 complementary tasks: 463 3-frame temporal-ordering instances, including 105 with a cross-trajectory decoy, and 1,550 before-after pairs labeled from 5 actions + its payload. We evaluate 8 closed and open-source model families across 32 ordering and 16 single-action settings, observing consistent gaps. Ordering remains unsaturated: best non-decoy and decoy exact-match rates are 65.1% and 65.7%. Task context improves decoy identification by 6.9 percentage points but reduces non-decoy exact match by 2.2 points; error analysis reveals systematic copying of the presented A-B-C order. Single-action results show that inferring the action family is harder than locating it: click F1 is 0.96 vs, 0.76 for drag, while recognized drags are generally localized well. DDB, thus, complements end-to-end benchmarks by filling the missing diagnostic layer between GUI grounding and final task success, enabling targeted improvements to desktop CUA verification, reliability, and recovery.", "arxiv_id": "2607.26041", "arxiv_url": "https://arxiv.org/abs/2607.26041", "authors": ["Abhishek Pillai", "Samir Kumar Nayak", "Yuan Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Desktop-Delta Bench\uff08DDB\uff09\uff0c\u4e00\u4e2a\u79bb\u7ebf\u9010\u6b65\u8bca\u65ad\u57fa\u51c6\uff0c\u7528\u4e8e\u6d4b\u8bd5 computer-use \u6a21\u578b\u80fd\u5426\u7406\u89e3\u684c\u9762 GUI \u4e2d\u52a8\u4f5c\u5bfc\u81f4\u7684\u56e0\u679c\u72b6\u6001\u8f6c\u79fb\u3002\u6570\u636e\u5305\u542b 2,013 \u4e2a\u7ecf\u4eba\u5de5\u9a8c\u8bc1\u7684\u591a\u5e94\u7528 Linux \u8f68\u8ff9\u5b9e\u4f8b\uff0c\u8986\u76d6\u7ea6 15 \u4e2a\u5e94\u7528\u548c 50 \u7c7b\u4efb\u52a1\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26041", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u57fa\u51c6\u805a\u7126\u4e09\u7c7b\u5931\u8d25\u7ef4\u5ea6\uff1a\u72b6\u6001\u9a8c\u8bc1\u3001\u6765\u6e90\u8ffd\u8e2a\u3001\u4e0a\u4e0b\u6587\u611f\u77e5\u63a7\u5236\uff0c\u5f25\u8865\u4ec5\u770b\u6700\u7ec8\u6210\u529f\u7387\u6216\u5355\u5e27\u5b9a\u4f4d\u7684\u4e0d\u8db3\u3002", "\u5305\u542b\u4e24\u7c7b\u4efb\u52a1\uff1a463 \u4e2a\u4e09\u5e27\u65f6\u95f4\u6392\u5e8f\u5b9e\u4f8b\uff08\u542b\u8de8\u8f68\u8ff9\u5e72\u6270\u9879\uff09\u548c 1,550 \u4e2a\u52a8\u4f5c\u524d\u540e\u622a\u56fe\u5bf9\uff0c\u6807\u6ce8 5 \u7c7b\u52a8\u4f5c\u53ca\u5176\u8f7d\u8377\u3002", "\u8bc4\u6d4b 8 \u4e2a\u95ed\u6e90\u4e0e\u5f00\u6e90\u6a21\u578b\u5bb6\u65cf\u540e\u53d1\u73b0\u660e\u663e\u77ed\u677f\uff1a\u6700\u4f73\u65f6\u95f4\u6392\u5e8f\u51c6\u786e\u7387\u7ea6 65%\uff0c\u52a8\u4f5c\u65cf\u63a8\u65ad\u6bd4\u4f4d\u7f6e\u5b9a\u4f4d\u66f4\u96be\uff0c\u62d6\u62fd\u8bc6\u522b\u5c24\u5176\u8584\u5f31\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u57fa\u51c6\u8bc4\u6d4b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26041v1", "published_at": "2026-07-28", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Desktop-Delta Bench: Do Computer-Use Models Understand Desktop GUI Transitions?", "tldr": "\u8bc4\u6d4b\u6a21\u578b\u662f\u5426\u7406\u89e3\u684c\u9762GUI\u72b6\u6001\u53d8\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Desktop-Delta Bench\uff08DDB\uff09\uff0c\u4e00\u4e2a\u79bb\u7ebf\u9010\u6b65\u8bca\u65ad\u57fa\u51c6\uff0c\u7528\u4e8e\u6d4b\u8bd5 computer-use \u6a21\u578b\u80fd\u5426\u7406\u89e3\u684c\u9762 GUI \u4e2d\u52a8\u4f5c\u5bfc\u81f4\u7684\u56e0\u679c\u72b6\u6001\u8f6c\u79fb\u3002\u6570\u636e\u5305\u542b 2,013 \u4e2a\u7ecf\u4eba\u5de5\u9a8c\u8bc1\u7684\u591a\u5e94\u7528 Linux \u8f68\u8ff9\u5b9e\u4f8b\uff0c\u8986\u76d6\u7ea6 15 \u4e2a\u5e94\u7528\u548c 50 \u7c7b\u4efb\u52a1\u3002", "why_notable": "\u8be5\u57fa\u51c6\u63ed\u793a\u4e86\u684c\u9762\u667a\u80fd\u4f53\u5728\u5f02\u6b65\u89c2\u5bdf\u3001\u8fc7\u671f\u622a\u56fe\u3001\u77ac\u6001\u754c\u9762\u7b49\u771f\u5b9e GUI \u573a\u666f\u4e0b\u7684\u53ef\u9760\u6027\u7f3a\u53e3\uff0c\u4e3a\u63d0\u5347\u8fdb\u5ea6\u9a8c\u8bc1\u3001\u9519\u8bef\u6062\u590d\u548c\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u7a33\u5b9a\u6027\u63d0\u4f9b\u4e86\u53ef\u91cf\u5316\u8bca\u65ad\u5de5\u5177\u3002"}, {"abstract": "Recent advances in powerful text-to-image generation models have made it increasingly important to develop test-time methods that modify the sampling trajectory to produce images more faithful to complex compositional prompts. We present TILT, a training-free framework for compositional text-to-image generation via test-time reward alignment. We interpret compositional failures as overlap modes between joint and single-concept distributions, and define a reward that favors samples where all concepts are jointly present. This reward is intrinsic to the base model and does not require any external supervision or reward models. This yields a KL-constrained objective with a closed-form tilted target distribution and principled guiding steps for diffusion sampling. The interaction of concept distributions together with the above reward naturally leads to two different guidance strategies while a hybrid approach that balances their respective benefits produces stronger performance. Experiments on prompts from T2ICompBench show that our method improves compositional alignment while preserving image quality compared to previous baselines.", "arxiv_id": "2607.21606", "arxiv_url": "https://arxiv.org/abs/2607.21606", "authors": ["Debottam Dutta", "Jaehoon Hahm", "Jianchong Chen", "Romit Roy Choudhury"], "brief": "TILT \u662f\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u6587\u672c\u5230\u56fe\u50cf\u6d4b\u8bd5\u65f6\u5f15\u5bfc\u6846\u67b6\uff0c\u7528\u4e8e\u63d0\u5347\u590d\u6742\u7ec4\u5408\u63d0\u793a\u7684\u6982\u5ff5\u5bf9\u9f50\u3002\u5b83\u5c06\u7ec4\u5408\u5931\u8d25\u89c6\u4e3a\u8054\u5408\u6982\u5ff5\u5206\u5e03\u4e0e\u5355\u6982\u5ff5\u5206\u5e03\u7684\u91cd\u53e0\uff0c\u5e76\u7528\u57fa\u7840\u6a21\u578b\u81ea\u8eab\u5b9a\u4e49\u5956\u52b1\u6765\u504f\u5411\u201c\u6240\u6709\u6982\u5ff5\u540c\u65f6\u51fa\u73b0\u201d\u7684\u6837\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21606", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u4f9d\u8d56\u5916\u90e8\u76d1\u7763\u3001\u5956\u52b1\u6a21\u578b\u6216\u989d\u5916\u8bad\u7ec3\uff0c\u5956\u52b1\u5b8c\u5168\u6765\u81ea\u57fa\u7840\u6269\u6563\u6a21\u578b\u7684\u5185\u5728\u5206\u5e03\u4fe1\u606f", "\u63d0\u51fa KL \u7ea6\u675f\u76ee\u6807\u4e0e\u95ed\u5f0f tilted \u76ee\u6807\u5206\u5e03\uff0c\u4e3a\u6269\u6563\u91c7\u6837\u8fc7\u7a0b\u63d0\u4f9b\u6709\u539f\u5219\u7684\u5f15\u5bfc\u6b65\u9aa4", "\u5728 T2ICompBench \u4e0a\u63d0\u5347\u7ec4\u5408\u8bed\u4e49\u5bf9\u9f50\uff0c\u540c\u65f6\u8f83\u597d\u4fdd\u6301\u56fe\u50cf\u8d28\u91cf\uff0c\u5e76\u4f18\u4e8e\u5df2\u6709\u6d4b\u8bd5\u65f6\u5f15\u5bfc\u57fa\u7ebf"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6587\u672c\u5230\u56fe\u50cf", "\u7ec4\u5408\u6cdb\u5316", "\u6d4b\u8bd5\u65f6\u4f18\u5316"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.21606v1", "published_at": "2026-05-16", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.21606.png", "title": "TILT: Improving Compositional Generation in Diffusion Models with a Model-Intrinsic Reward", "tldr": "\u7528\u6a21\u578b\u5185\u5728\u5956\u52b1\u63d0\u5347\u6269\u6563\u6a21\u578b\u7ec4\u5408\u751f\u6210", "upvotes": 1, "what_it_is": "TILT \u662f\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u6587\u672c\u5230\u56fe\u50cf\u6d4b\u8bd5\u65f6\u5f15\u5bfc\u6846\u67b6\uff0c\u7528\u4e8e\u63d0\u5347\u590d\u6742\u7ec4\u5408\u63d0\u793a\u7684\u6982\u5ff5\u5bf9\u9f50\u3002\u5b83\u5c06\u7ec4\u5408\u5931\u8d25\u89c6\u4e3a\u8054\u5408\u6982\u5ff5\u5206\u5e03\u4e0e\u5355\u6982\u5ff5\u5206\u5e03\u7684\u91cd\u53e0\uff0c\u5e76\u7528\u57fa\u7840\u6a21\u578b\u81ea\u8eab\u5b9a\u4e49\u5956\u52b1\u6765\u504f\u5411\u201c\u6240\u6709\u6982\u5ff5\u540c\u65f6\u51fa\u73b0\u201d\u7684\u6837\u672c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u6587\u672c\u5230\u56fe\u50cf\u6a21\u578b\u5e38\u89c1\u7684\u7ec4\u5408\u6cdb\u5316\u5931\u8d25\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u8f7b\u91cf\u3001\u53ef\u63d2\u62d4\u4e14\u65e0\u9700\u989d\u5916\u6807\u6ce8\u7684\u6d4b\u8bd5\u65f6\u6539\u8fdb\u65b9\u6848\uff0c\u5bf9\u590d\u6742\u63d0\u793a\u8bcd\u4e0b\u7684\u53ef\u9760\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce a vocabulary for automated research systems built from one or more agents to make their design choices easier to describe and compare. The vocabulary specifies 1) who the agents are, 2) what operations are available in the system, 3) who may invoke them, 4) how agents communicate, 5) what information is visible within and across runs, 6) how the next action is chosen, 7) how a run begins, and 8) how outputs are evaluated. A trajectory records one run from the input task to the returned artifact. Because agents, operations, and initialization may be stochastic, repeated runs on the same task induce a distribution over trajectories rather than a single behavior. Our vocabulary turns structural design questions, such as when agents should communicate, gain or lose a capability, or carry information across runs, into testable choices. It also makes the evaluator a component of the system, since reported gains depend on how closely the proxy score matches true quality. That separation also splits the vague complaint that these systems lack taste into two failures with different solutions. Generative taste is the rate at which a system proposes novel trajectories before any score is observed, and evaluative taste is the gap between the proxy score and the quality it should match. We instantiate the vocabulary on recent autoresearch systems to illustrate that it covers designs that differ widely in structure.", "arxiv_id": "2607.22682", "arxiv_url": "https://arxiv.org/abs/2607.22682", "authors": ["Bardiya Akhbari"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u5957\u7528\u4e8e\u63cf\u8ff0\u548c\u6bd4\u8f83\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u7684\u7edf\u4e00\u8bcd\u6c47\uff0c\u8986\u76d6\u667a\u80fd\u4f53\u89d2\u8272\u3001\u53ef\u7528\u64cd\u4f5c\u3001\u901a\u4fe1\u65b9\u5f0f\u3001\u4fe1\u606f\u53ef\u89c1\u6027\u3001\u884c\u52a8\u9009\u62e9\u3001\u521d\u59cb\u5316\u4e0e\u8bc4\u4f30\u7b49\u8bbe\u8ba1\u7ef4\u5ea6\u3002\u8bba\u6587\u8fd8\u7528\u8be5\u8bcd\u6c47\u5206\u6790\u8fd1\u671f\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\uff0c\u5c55\u793a\u5176\u53ef\u8986\u76d6\u5dee\u5f02\u5f88\u5927\u7684\u7cfb\u7edf\u7ed3\u6784\u3002", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": "https://github.com/BardiyaAk/multi-agent-research-vocabulary", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22682", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u4e00\u6b21\u81ea\u52a8\u79d1\u7814\u8fd0\u884c\u5b9a\u4e49\u4e3a\u4ece\u8f93\u5165\u4efb\u52a1\u5230\u8f93\u51fa\u6210\u679c\u7684\u201c\u8f68\u8ff9\u201d\uff0c\u5e76\u6307\u51fa\u968f\u673a\u667a\u80fd\u4f53\u3001\u64cd\u4f5c\u548c\u521d\u59cb\u5316\u4f1a\u8bf1\u5bfc\u8f68\u8ff9\u5206\u5e03", "\u628a\u7cfb\u7edf\u8bbe\u8ba1\u95ee\u9898\u5f62\u5f0f\u5316\u4e3a\u53ef\u6d4b\u8bd5\u9009\u62e9\uff0c\u4f8b\u5982\u4f55\u65f6\u901a\u4fe1\u3001\u4f55\u65f6\u83b7\u5f97\u6216\u5931\u53bb\u80fd\u529b\u3001\u662f\u5426\u8de8\u8fd0\u884c\u4fdd\u7559\u4fe1\u606f", "\u5c06\u8bc4\u4f30\u5668\u7eb3\u5165\u7cfb\u7edf\u7ec4\u6210\u90e8\u5206\uff0c\u5e76\u533a\u5206\u201c\u751f\u6210\u54c1\u5473\u201d\u548c\u201c\u8bc4\u4f30\u54c1\u5473\u201d\u4e24\u7c7b\u5931\u8d25\u6765\u6e90"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u591a\u667a\u80fd\u4f53", "\u8bc4\u4f30"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22682v1", "published_at": "2026-07-13", "score": 0.191, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.22682.png", "title": "A Vocabulary for Multi-Agent Automated Research Systems", "tldr": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u63cf\u8ff0\u8bcd\u6c47\u8868", "upvotes": 3, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u5957\u7528\u4e8e\u63cf\u8ff0\u548c\u6bd4\u8f83\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u7684\u7edf\u4e00\u8bcd\u6c47\uff0c\u8986\u76d6\u667a\u80fd\u4f53\u89d2\u8272\u3001\u53ef\u7528\u64cd\u4f5c\u3001\u901a\u4fe1\u65b9\u5f0f\u3001\u4fe1\u606f\u53ef\u89c1\u6027\u3001\u884c\u52a8\u9009\u62e9\u3001\u521d\u59cb\u5316\u4e0e\u8bc4\u4f30\u7b49\u8bbe\u8ba1\u7ef4\u5ea6\u3002\u8bba\u6587\u8fd8\u7528\u8be5\u8bcd\u6c47\u5206\u6790\u8fd1\u671f\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\uff0c\u5c55\u793a\u5176\u53ef\u8986\u76d6\u5dee\u5f02\u5f88\u5927\u7684\u7cfb\u7edf\u7ed3\u6784\u3002", "why_notable": "\u5b83\u4e3a\u5feb\u901f\u589e\u957f\u7684\u81ea\u52a8\u79d1\u7814\u4e0e\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u63d0\u4f9b\u4e86\u7edf\u4e00\u5206\u6790\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u66f4\u6e05\u6670\u5730\u6bd4\u8f83\u7cfb\u7edf\u8bbe\u8ba1\u3001\u5b9a\u4f4d\u6027\u80fd\u6765\u6e90\uff0c\u5e76\u63a8\u52a8\u53ef\u590d\u73b0\u5b9e\u9a8c\u8bc4\u4f30\u3002"}, {"abstract": "Bitcoin price prediction on sub-daily timescales is a hard open problem in computational finance. Bitcoin exhibits fat-tailed returns, non-stationary dynamics, and a price discovery process influenced by social discourse on Reddit and Twitter. Conventional approaches fuse OHLCV technical features with sentiment via static concatenation, applying identical fusion weights regardless of market state. This is inconsistent with the behavioural finance literature, which shows that retail sentiment is most predictive during volatile periods and noisy during calm ones. This paper proposes Regime-Aware Multi-Modal Learning (RAML), which conditions fusion of sentiment and price features on a dynamically detected binary market regime. Rolling 24-hour volatility partitions observations into stable and volatile regimes; a learnable sigmoid gate adjusts the weight of the sentiment embedding relative to the price embedding, trusting sentiment more during volatility and price dynamics more during stable phases. The system is evaluated on 3,491 hourly observations (July 2024-September 2025), combining Bitcoin OHLCV data with Reddit /r/Bitcoin FinBERT sentiment. Four models are compared - price-only BiLSTM, sentiment-only classifier, static-concatenation BiLSTM, and RAML - across 3-hour and 6-hour horizons, with an ablation study isolating the sentiment branch, regime detection, and adaptive fusion. RAML achieves macro-F1 of 0.5474 (3h) and 0.5513 (6h), with the highest AUC at 3 hours (0.5084), indicating better calibration. Ablation confirms every component is necessary, and replacing adaptive weighting with concatenation causes recall collapse at 6 hours (F1: 0.14). These results establish regime-conditioned adaptive fusion as a necessary design principle for multi-modal financial forecasting.", "arxiv_id": "2607.23370", "arxiv_url": "https://arxiv.org/abs/2607.23370", "authors": ["Muhammad Abdullah Haroon"], "brief": "\u8bba\u6587\u63d0\u51fa Regime-Aware Multi-Modal Learning\uff08RAML\uff09\uff0c\u7528\u4e8e\u5c0f\u65f6\u7ea7\u6bd4\u7279\u5e01\u4ef7\u683c\u65b9\u5411\u9884\u6d4b\u3002\u65b9\u6cd5\u6839\u636e\u6eda\u52a824\u5c0f\u65f6\u6ce2\u52a8\u7387\u5212\u5206\u7a33\u5b9a/\u6ce2\u52a8\u5e02\u573a\u72b6\u6001\uff0c\u5e76\u7528\u53ef\u5b66\u4e60\u95e8\u63a7\u52a8\u6001\u8c03\u6574\u793e\u4ea4\u60c5\u7eea\u7279\u5f81\u4e0eOHLCV\u6280\u672f\u7279\u5f81\u7684\u878d\u5408\u6743\u91cd\u3002", "categories": ["cs.LG", "cs.CE", "econ.EM", "stat.CO"], "github_repo": "https://github.com/AbdullahPatti/StreetSmart-BitCoin-Price", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.23370", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u75282024\u5e747\u6708\u81f32025\u5e749\u6708\u76843491\u6761\u5c0f\u65f6\u7ea7\u6bd4\u7279\u5e01OHLCV\u6570\u636e\uff0c\u5e76\u7ed3\u5408 Reddit /r/Bitcoin \u7684 FinBERT \u60c5\u7eea\u7279\u5f81\u3002", "\u5bf9\u6bd4\u4ef7\u683c-only BiLSTM\u3001\u60c5\u7eea-only \u5206\u7c7b\u5668\u3001\u9759\u6001\u62fc\u63a5 BiLSTM \u4e0e RAML\uff0c\u57283\u5c0f\u65f6\u548c6\u5c0f\u65f6\u9884\u6d4b\u7a97\u53e3\u4e0a\u8bc4\u4f30\u3002", "RAML\u57283\u5c0f\u65f6\u548c6\u5c0f\u65f6\u5b8fF1\u5206\u522b\u8fbe\u52300.5474\u548c0.5513\uff1b\u6d88\u878d\u663e\u793a\u53bb\u6389\u81ea\u9002\u5e94\u878d\u5408\u4f1a\u5bfc\u81f46\u5c0f\u65f6\u53ec\u56de\u5d29\u584c\u3002"], "keywords": ["\u91d1\u878d\u9884\u6d4b", "\u591a\u6a21\u6001\u878d\u5408", "\u60c5\u7eea\u5206\u6790", "\u65f6\u95f4\u5e8f\u5217"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.23370v1", "published_at": "2026-07-25", "score": 0.164, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23370.png", "title": "Bitcoin Price Direction Prediction via Regime-Aware Multi-Modal Fusion of Social Sentiment and Technical Features", "tldr": "\u6309\u5e02\u573a\u72b6\u6001\u81ea\u9002\u5e94\u878d\u5408\u60c5\u7eea\u4e0e\u4ef7\u683c\u9884\u6d4b\u6bd4\u7279\u5e01", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Regime-Aware Multi-Modal Learning\uff08RAML\uff09\uff0c\u7528\u4e8e\u5c0f\u65f6\u7ea7\u6bd4\u7279\u5e01\u4ef7\u683c\u65b9\u5411\u9884\u6d4b\u3002\u65b9\u6cd5\u6839\u636e\u6eda\u52a824\u5c0f\u65f6\u6ce2\u52a8\u7387\u5212\u5206\u7a33\u5b9a/\u6ce2\u52a8\u5e02\u573a\u72b6\u6001\uff0c\u5e76\u7528\u53ef\u5b66\u4e60\u95e8\u63a7\u52a8\u6001\u8c03\u6574\u793e\u4ea4\u60c5\u7eea\u7279\u5f81\u4e0eOHLCV\u6280\u672f\u7279\u5f81\u7684\u878d\u5408\u6743\u91cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u91d1\u878d\u591a\u6a21\u6001\u9884\u6d4b\u4e2d\u201c\u5e02\u573a\u72b6\u6001\u201d\u5bf9\u7279\u5f81\u53ef\u4fe1\u5ea6\u7684\u5f71\u54cd\uff0c\u63d0\u4f9b\u4e86\u6bd4\u9759\u6001\u62fc\u63a5\u66f4\u7b26\u5408\u884c\u4e3a\u91d1\u878d\u76f4\u89c9\u7684\u878d\u5408\u673a\u5236\uff0c\u5bf9\u52a0\u5bc6\u8d27\u5e01\u77ed\u5468\u671f\u9884\u6d4b\u548c\u60c5\u7eea\u9a71\u52a8\u4ea4\u6613\u5efa\u6a21\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Recently, memory management has become a key infrastructure for LLM-based agents, as it directly affects long-horizon reasoning, personalized responses, and knowledge reuse. However, existing LLM memory systems typically adopt a coarse-grained (utility-agnostic) manner that treats heterogeneous user-LLM interaction records uniformly, leading to redundant and low-impact records persisting in the memory repository. To address this challenge, we present MemLens, a value-aware memory management system that takes memory records as first-class data objects. MemLens provides an end-to-end interactive analytics dashboard that exposes the complete memory lifecycle, including Shapley-style memory evaluation, value-aware storage, and memory-assisted response. Through a study-copilot application, the system enables users to inspect memory values, visualize hierarchical memory structures, and compare various memory management strategies in terms of response quality, retrieval latency, and token consumption. Therefore, our MemLens can serve as an efficient, interpretable, and personalized long-term memory management system for LLM-based agents.", "arxiv_id": "2607.25992", "arxiv_url": "https://arxiv.org/abs/2607.25992", "authors": ["Shuyue Wei", "Chang Liu", "Zimu Zhou", "Yongxin Tong", "Lizhen Cui"], "brief": "\u672c\u6587\u63d0\u51fa MemLens\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u4ef7\u503c\u611f\u77e5\u8bb0\u5fc6\u7ba1\u7406\u7cfb\u7edf\uff0c\u5c06\u8bb0\u5fc6\u8bb0\u5f55\u4f5c\u4e3a\u53ef\u8bc4\u4f30\u3001\u53ef\u5b58\u50a8\u548c\u53ef\u68c0\u7d22\u7684\u6570\u636e\u5bf9\u8c61\u3002\u7cfb\u7edf\u901a\u8fc7 Shapley \u98ce\u683c\u7684\u8bb0\u5fc6\u4ef7\u503c\u8bc4\u4f30\u3001\u4ef7\u503c\u611f\u77e5\u5b58\u50a8\u548c\u4ea4\u4e92\u5f0f\u5206\u6790\u9762\u677f\uff0c\u5e2e\u52a9\u51cf\u5c11\u4f4e\u4ef7\u503c\u5197\u4f59\u8bb0\u5fc6\uff0c\u5e76\u5728\u54cd\u5e94\u8d28\u91cf\u3001\u68c0\u7d22\u5ef6\u8fdf\u548c token \u6d88\u8017\u4e4b\u95f4\u8fdb\u884c\u53ef\u89e3\u91ca\u6bd4\u8f83\u3002", "categories": ["cs.DB", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25992", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7ba1\u7406", "\u53ef\u89e3\u91ca\u6027", "\u6570\u636e\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25992v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MemLens: A Value-Aware Memory Management System with Interactive Analytics for LLM-based Agents", "tldr": "\u672c\u6587\u63d0\u51fa MemLens\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u4ef7\u503c\u611f\u77e5\u8bb0\u5fc6\u7ba1\u7406\u7cfb\u7edf\uff0c\u5c06\u8bb0\u5fc6\u8bb0\u5f55\u4f5c\u4e3a\u53ef\u8bc4\u4f30\u3001\u53ef\u5b58\u50a8\u548c\u53ef\u68c0\u7d22\u7684\u6570\u636e\u5bf9\u8c61\u3002\u7cfb\u7edf\u901a\u8fc7 Shapley \u98ce\u683c\u7684\u8bb0\u5fc6\u4ef7\u503c\u8bc4\u4f30\u3001\u4ef7\u503c\u611f\u77e5\u5b58\u50a8\u548c\u4ea4\u4e92\u5f0f\u5206\u6790\u9762\u677f\uff0c\u5e2e\u52a9\u51cf\u5c11\u4f4e\u4ef7\u503c\u5197\u4f59\u8bb0\u5fc6\uff0c\u5e76\u5728\u54cd\u5e94\u8d28\u91cf\u3001\u68c0\u7d22\u5ef6\u8fdf\u548c token \u6d88\u8017\u4e4b\u95f4\u8fdb\u884c\u53ef\u89e3\u91ca\u6bd4\u8f83\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Any-to-any models predict any modality from any combination of others within a single network, a formulation used in multimodal vision and vision-language models, and increasingly in scientific domains such as ecology and astronomy. Existing any-to-any models are typically trained from scratch using encoder-decoder or diffusion architectures, impacting their performance and preventing them from using strong pre-trained decoder-only models as a prior. In this work, we investigate decoder-only any-to-any multimodal modeling, which treats all modalities symmetrically and supports arbitrary modalities as inputs and outputs without modality-specific heads, losses, or task pipelines. Because every modality is both an input and an output of the same model, the resulting model, named Modus, can support a range of applications, such as chained generation through intermediate modalities or cross-modal self-verification by scoring the model\u0027s own outputs with another generated modality. Modus demonstrates strong out-of-the-box performance and is competitive with specialist and multitask baselines using a single model across various benchmarks. All materials are open-sourced at https://modus-multimodal.epfl.ch/.", "arxiv_id": "2607.25948", "arxiv_url": "https://arxiv.org/abs/2607.25948", "authors": ["Mingqiao Ye", "Zhaochong An", "Zhitong Gao", "Xian Liu", "Fran\u00e7ois Fleuret", "Chuan Li", "Amir Zadeh", "Serge Belongie", "Afshin Dehghan", "Jesse Allardice", "David Mizrahi", "O\u011fuzhan Fatih Kar", "Roman Bachmann", "Amir Zamir"], "brief": "MODUS \u63a2\u7d22\u4e86\u4ec5\u89e3\u7801\u5668\u7684\u4efb\u610f\u5230\u4efb\u610f\u591a\u6a21\u6001\u5efa\u6a21\uff0c\u5c06\u6240\u6709\u6a21\u6001\u5bf9\u79f0\u5730\u4f5c\u4e3a\u8f93\u5165\u548c\u8f93\u51fa\u5904\u7406\uff0c\u65e0\u9700\u6a21\u6001\u4e13\u7528\u5934\u3001\u635f\u5931\u6216\u4efb\u52a1\u6d41\u6c34\u7ebf\u3002\u8be5\u65b9\u6cd5\u53ef\u5229\u7528\u5f3a\u9884\u8bad\u7ec3 decoder-only \u6a21\u578b\u5148\u9a8c\uff0c\u5728\u591a\u79cd\u57fa\u51c6\u4e0a\u4ee5\u5355\u4e00\u6a21\u578b\u53d6\u5f97\u63a5\u8fd1\u4e13\u7528\u6a21\u578b\u548c\u591a\u4efb\u52a1\u57fa\u7ebf\u7684\u8868\u73b0\uff0c\u5e76\u652f\u6301\u94fe\u5f0f\u751f\u6210\u4e0e\u8de8\u6a21\u6001\u81ea\u9a8c\u8bc1\u7b49\u5e94\u7528\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25948", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89e3\u7801\u5668\u6a21\u578b", "\u4efb\u610f\u5230\u4efb\u610f\u751f\u6210", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25948v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MODUS: Decoder-Only Any-to-Any Modeling of Diverse Modalities", "tldr": "MODUS \u63a2\u7d22\u4e86\u4ec5\u89e3\u7801\u5668\u7684\u4efb\u610f\u5230\u4efb\u610f\u591a\u6a21\u6001\u5efa\u6a21\uff0c\u5c06\u6240\u6709\u6a21\u6001\u5bf9\u79f0\u5730\u4f5c\u4e3a\u8f93\u5165\u548c\u8f93\u51fa\u5904\u7406\uff0c\u65e0\u9700\u6a21\u6001\u4e13\u7528\u5934\u3001\u635f\u5931\u6216\u4efb\u52a1\u6d41\u6c34\u7ebf\u3002\u8be5\u65b9\u6cd5\u53ef\u5229\u7528\u5f3a\u9884\u8bad\u7ec3 decoder-only \u6a21\u578b\u5148\u9a8c\uff0c\u5728\u591a\u79cd\u57fa\u51c6\u4e0a\u4ee5\u5355\u4e00\u6a21\u578b\u53d6\u5f97\u63a5\u8fd1\u4e13\u7528\u6a21\u578b\u548c\u591a\u4efb\u52a1\u57fa\u7ebf\u7684\u8868\u73b0\uff0c\u5e76\u652f\u6301\u94fe\u5f0f\u751f\u6210\u4e0e\u8de8\u6a21\u6001\u81ea\u9a8c\u8bc1\u7b49\u5e94\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluating AI agents in interactive environments is hindered by fragmented tasks, scaffolds, verifiers, and scoring rules. Existing efforts focus on narrow settings, remain limited in scale, or require costly reruns, leaving much of the empirical record incomparable. We introduce Messier, a unified corpus of 957,253 records that span 30 benchmarks, 714 agents, 11,891 tasks, and 74,205 verifiers. Messier consolidates public benchmark scores and supplements them with five-agent runs across six underrepresented professional and scientific domains, including a recent legal benchmark. Each record is standardized by model, scaffold, environment, task, verifier, and aggregation rule, with SOC/NAICS classifications for occupational and industry analysis. Using this corpus, we show frontier progress is uneven across benchmark types, with \"function calling\" saturated, \"programming\" improving the fastest, and \"enterprise workflows\" remaining the most challenging. Furthermore, counterfactual rescoring shows that strict all-pass aggregation in multi-verifier tasks can obscure progress and artificially alter agent rankings. From these standardized records, we derive capability scales that align with Epoch\u0027s Evaluation Capability Index rankings at Spearman \\r{ho} = 0.81 and can be specialized by domain, occupation, action space, or verifier type. Messier provides a foundational, reusable infrastructure for agent capability scaling, benchmark auditing, and fine-grained analysis of evaluation failures.", "arxiv_id": "2607.25891", "arxiv_url": "https://arxiv.org/abs/2607.25891", "authors": ["Stefan Krsteski", "Charlotte Meyer", "Guillaume Allegre", "Tony O\u0027Halloran", "Alexandre Sallinen"], "brief": "Messier \u6784\u5efa\u4e86\u4e00\u4e2a\u7edf\u4e00\u7684\u9ad8\u5206\u8fa8\u7387\u667a\u80fd\u4f53\u8bc4\u6d4b\u8bed\u6599\u5e93\uff0c\u5305\u542b\u8fd196\u4e07\u6761\u8bb0\u5f55\uff0c\u8986\u76d630\u4e2a\u57fa\u51c6\u3001714\u4e2a\u667a\u80fd\u4f53\u3001\u8fd11.2\u4e07\u4efb\u52a1\u548c7.4\u4e07\u9a8c\u8bc1\u5668\uff0c\u5e76\u7edf\u4e00\u4e86\u6a21\u578b\u3001\u73af\u5883\u3001\u4efb\u52a1\u3001\u8bc4\u5206\u89c4\u5219\u7b49\u5143\u6570\u636e\u3002\u57fa\u4e8e\u8be5\u8bed\u6599\u5e93\uff0c\u8bba\u6587\u53d1\u73b0\u4e0d\u540c\u7c7b\u578b\u57fa\u51c6\u4e0a\u7684\u524d\u6cbf\u8fdb\u5c55\u5e76\u4e0d\u5747\u8861\uff0c\u51fd\u6570\u8c03\u7528\u8d8b\u4e8e\u9971\u548c\uff0c\u7f16\u7a0b\u63d0\u5347\u6700\u5feb\uff0c\u4f01\u4e1a\u5de5\u4f5c\u6d41\u4ecd\u6700\u56f0\u96be\uff1b\u540c\u65f6\u591a\u9a8c\u8bc1\u5668\u4efb\u52a1\u4e2d\u7684\u4e25\u683c\u5168\u901a\u8fc7\u8bc4\u5206\u53ef\u80fd\u63a9\u76d6\u8fdb\u5c55\u5e76\u6539\u53d8\u6392\u540d\u3002", "categories": ["cs.AI", "cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25891", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u80fd\u529b\u8bc4\u4f30", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25891v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Messier: A High-Resolution Corpus for Cross-Benchmark Agent Evaluation", "tldr": "Messier \u6784\u5efa\u4e86\u4e00\u4e2a\u7edf\u4e00\u7684\u9ad8\u5206\u8fa8\u7387\u667a\u80fd\u4f53\u8bc4\u6d4b\u8bed\u6599\u5e93\uff0c\u5305\u542b\u8fd196\u4e07\u6761\u8bb0\u5f55\uff0c\u8986\u76d630\u4e2a\u57fa\u51c6\u3001714\u4e2a\u667a\u80fd\u4f53\u3001\u8fd11.2\u4e07\u4efb\u52a1\u548c7.4\u4e07\u9a8c\u8bc1\u5668\uff0c\u5e76\u7edf\u4e00\u4e86\u6a21\u578b\u3001\u73af\u5883\u3001\u4efb\u52a1\u3001\u8bc4\u5206\u89c4\u5219\u7b49\u5143\u6570\u636e\u3002\u57fa\u4e8e\u8be5\u8bed\u6599\u5e93\uff0c\u8bba\u6587\u53d1\u73b0\u4e0d\u540c\u7c7b\u578b\u57fa\u51c6\u4e0a\u7684\u524d\u6cbf\u8fdb\u5c55\u5e76\u4e0d\u5747\u8861\uff0c\u51fd\u6570\u8c03\u7528\u8d8b\u4e8e\u9971\u548c\uff0c\u7f16\u7a0b\u63d0\u5347\u6700\u5feb\uff0c\u4f01\u4e1a\u5de5\u4f5c\u6d41\u4ecd\u6700\u56f0\u96be\uff1b\u540c\u65f6\u591a\u9a8c\u8bc1\u5668\u4efb\u52a1\u4e2d\u7684\u4e25\u683c\u5168\u901a\u8fc7\u8bc4\u5206\u53ef\u80fd\u63a9\u76d6\u8fdb\u5c55\u5e76\u6539\u53d8\u6392\u540d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Quantum error correction (QEC) is indispensable for scalable fault-tolerant quantum computing. However, discovering QEC codes that remain effective is challenging, as logical performance depends on the interplay between code structure, hardware, syndrome extraction, and decoding, which often impose competing requirements. Here we introduce OmniQEC, an efficient AI scientist for discovering QEC codes suited to deployment on modern quantum processors. OmniQEC formulates QEC design as an iterative discovery process in which an orchestrator, implemented by advanced large language models (LLMs), coordinates code generation, code-level screening, syndrome-extraction synthesis, and decoder-based circuit evaluation. At its core, OmniQEC combines a self-evolving reasoning mechanism with a slow--fast synergistic workflow: a fast loop explores candidates using inexpensive code-level proxies, whereas a slow loop performs physically grounded circuit-level evaluation and feeds the resulting evidence back into the search. We evaluate OmniQEC across four qLDPC construction families, three LLM backends, and $14$ total-physical-qubit budgets per backend. The discovered codes show steadily improving logical-error suppression with increasing physical-qubit budgets and outperform the BB codes with $[\\![72,12,6]\\!]$ and $[\\![144,12,12]\\!]$ under complete-implementation budgets of 98 and 240 physical qubits, respectively. The discovered codes are hardware-friendly and may be of independent interest for practical QEC implementation. These findings pave the way towards LLM-assisted QEC discovery grounded in physically informed code--circuit--decoder co-design.", "arxiv_id": "2607.25865", "arxiv_url": "https://arxiv.org/abs/2607.25865", "authors": ["Ge Yan", "Shanchuan Li", "Pengyue Ma", "Qixin Zhang", "Pingchuan Ma", "Jianping Wang", "Min-Hsiu Hsieh", "Yuxuan Du"], "brief": "OmniQEC \u5c06\u91cf\u5b50\u7ea0\u9519\u7801\u8bbe\u8ba1\u5efa\u6a21\u4e3a\u7531\u5927\u8bed\u8a00\u6a21\u578b\u7f16\u6392\u7684\u8fed\u4ee3\u53d1\u73b0\u8fc7\u7a0b\uff0c\u8054\u5408\u4ee3\u7801\u751f\u6210\u3001\u5feb\u901f\u7b5b\u9009\u3001\u7efc\u5408\u5f81\u63d0\u53d6\u5408\u6210\u548c\u57fa\u4e8e\u89e3\u7801\u5668\u7684\u7535\u8def\u7ea7\u8bc4\u4f30\u3002\u5176\u6162\u5feb\u534f\u540c\u641c\u7d22\u5728\u591a\u4e2a qLDPC \u6784\u9020\u65cf\u548c\u7269\u7406\u91cf\u5b50\u6bd4\u7279\u9884\u7b97\u4e0b\u53d1\u73b0\u4e86\u66f4\u9002\u5408\u786c\u4ef6\u90e8\u7f72\u7684\u7ea0\u9519\u7801\uff0c\u5e76\u5728\u82e5\u5e72\u9884\u7b97\u8bbe\u7f6e\u4e2d\u4f18\u4e8e\u7ecf\u5178 BB \u7801\u3002", "categories": ["quant-ph", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25865", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u7ea0\u9519", "\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u91cf\u5b50\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25865v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OmniQEC: discovering practical quantum error-correcting codes by an AI scientist", "tldr": "OmniQEC \u5c06\u91cf\u5b50\u7ea0\u9519\u7801\u8bbe\u8ba1\u5efa\u6a21\u4e3a\u7531\u5927\u8bed\u8a00\u6a21\u578b\u7f16\u6392\u7684\u8fed\u4ee3\u53d1\u73b0\u8fc7\u7a0b\uff0c\u8054\u5408\u4ee3\u7801\u751f\u6210\u3001\u5feb\u901f\u7b5b\u9009\u3001\u7efc\u5408\u5f81\u63d0\u53d6\u5408\u6210\u548c\u57fa\u4e8e\u89e3\u7801\u5668\u7684\u7535\u8def\u7ea7\u8bc4\u4f30\u3002\u5176\u6162\u5feb\u534f\u540c\u641c\u7d22\u5728\u591a\u4e2a qLDPC \u6784\u9020\u65cf\u548c\u7269\u7406\u91cf\u5b50\u6bd4\u7279\u9884\u7b97\u4e0b\u53d1\u73b0\u4e86\u66f4\u9002\u5408\u786c\u4ef6\u90e8\u7f72\u7684\u7ea0\u9519\u7801\uff0c\u5e76\u5728\u82e5\u5e72\u9884\u7b97\u8bbe\u7f6e\u4e2d\u4f18\u4e8e\u7ecf\u5178 BB \u7801\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Emerging Omni-modal Large Language Models (OmniLLMs) enable unified understanding of text, audio, and video, but their long audio-video token sequences introduce substantial memory and inference costs. Existing compression methods mainly focus on selecting important tokens under fixed budgets, leaving the preceding budget-allocation problem underexplored. We show that direct query-to-audio/video similarity is unreliable for inter-modal budget allocation, and that uniform intra-modal budgets can miss key evidence while retaining redundant content. To address these limitations, we propose OmniDelta, a training-free, skill-driven framework that couples intent-aware inter-modal allocation with content-aware intra-modal allocation. OmniDelta first constructs audio and video skill pools to shift the fixed retained-token budget according to query demand, then reallocates modality budgets over audio segments and video frames using local complexity and temporal redundancy. The resulting local budgets can be combined with existing pruning strategies, preserving the total retained-token ratio while changing where the budget is spent. Experiments on four audio-video benchmarks with two Qwen2.5-Omni models show that OmniDelta establishes a new accuracy-efficiency Pareto frontier across pruning ratios. At 25% token retention on Qwen2.5-Omni-7B, OmniDelta reduces GPU memory by 22.0% and achieves a 1.64x end-to-end speedup over full-token inference.", "arxiv_id": "2607.25669", "arxiv_url": "https://arxiv.org/abs/2607.25669", "authors": ["Haoyang Huang", "Wenjie Huang", "Tianqi Xu", "Hongyaoxing Gu", "Kang Tan", "Yikai Fu", "Yuhao Shen", "Tianyu Liu", "Baolin Zhang", "Jun Zhang", "Xinyi Hu", "Jun Dai", "Shuang Ge", "Lei Chen", "Yue Li", "Mingchen Wang", "Meng Zhang"], "brief": "OmniDelta\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u6280\u80fd\u9a71\u52a8\u9884\u7b97\u5206\u914d\u6846\u67b6\uff0c\u7528\u4e8e\u5168\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u7684\u97f3\u9891/\u89c6\u9891 token \u538b\u7f29\uff0c\u5148\u6309\u67e5\u8be2\u610f\u56fe\u5728\u6a21\u6001\u95f4\u5206\u914d\u9884\u7b97\uff0c\u518d\u6309\u5185\u5bb9\u590d\u6742\u5ea6\u4e0e\u65f6\u95f4\u5197\u4f59\u5728\u7247\u6bb5/\u5e27\u5185\u7ec6\u5206\u9884\u7b97\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u4e2a\u97f3\u89c6\u9891\u57fa\u51c6\u548c Qwen2.5-Omni \u6a21\u578b\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u51c6\u786e\u7387-\u6548\u7387\u6743\u8861\uff0c25% token \u4fdd\u7559\u65f6\u53ef\u964d\u4f4e 22.0% GPU \u663e\u5b58\u5e76\u83b7\u5f97 1.64x \u7aef\u5230\u7aef\u52a0\u901f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25669", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25669v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.25669.png", "title": "OmniDelta: Skill-Driven Budget Allocation for Token Compression in OmniLLMs", "tldr": "OmniDelta\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u6280\u80fd\u9a71\u52a8\u9884\u7b97\u5206\u914d\u6846\u67b6\uff0c\u7528\u4e8e\u5168\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u7684\u97f3\u9891/\u89c6\u9891 token \u538b\u7f29\uff0c\u5148\u6309\u67e5\u8be2\u610f\u56fe\u5728\u6a21\u6001\u95f4\u5206\u914d\u9884\u7b97\uff0c\u518d\u6309\u5185\u5bb9\u590d\u6742\u5ea6\u4e0e\u65f6\u95f4\u5197\u4f59\u5728\u7247\u6bb5/\u5e27\u5185\u7ec6\u5206\u9884\u7b97\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u4e2a\u97f3\u89c6\u9891\u57fa\u51c6\u548c Qwen2.5-Omni \u6a21\u578b\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u51c6\u786e\u7387-\u6548\u7387\u6743\u8861\uff0c25% token \u4fdd\u7559\u65f6\u53ef\u964d\u4f4e 22.0% GPU \u663e\u5b58\u5e76\u83b7\u5f97 1.64x \u7aef\u5230\u7aef\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Complex tasks often decompose into parallelizable yet interdependent subtasks, making orchestration critical to the performance of multi-agent systems (MAS). Existing evaluations typically rely on end-to-end execution, which conflates orchestration-plan quality with worker capabilities, tool reliability, and environmental noise. Moreover, the time and token costs of real execution grow rapidly with workflow scale, making systematic evaluation expensive. We present OrchBench, a simulation-based benchmark for evaluating multi-agent orchestration plans in isolation. Starting from real-world tasks, OrchBench constructs directed acyclic graphs (DAGs) that encode task dependencies, with controlled sizes and degrees of parallelism. Given a DAG, a per-agent context limit, and an agent budget, the evaluated planner assigns subtasks to agents and specifies cross-agent information transfers and their retention ratios. A deterministic simulator evaluates the resulting plan without invoking worker agents and returns interpretable measures of result quality, makespan, and token cost. The simulated scores produced by OrchBench correlate strongly with quality scores from Claude Code executions, achieving a Pearson correlation of \\(r=0.816\\), while requiring only \\(1.3\\%\\) of the tokens and \\(10.3\\%\\) of the wall-clock time. Across diverse planners and workflow scales, we find that preserving task-critical information is more important than simply increasing the number of agents, and the benefits of parallelism diminish as coordination failures accumulate. These results establish OrchBench as an efficient and interpretable benchmark for comparing and diagnosing multi-agent orchestration plans.", "arxiv_id": "2607.25656", "arxiv_url": "https://arxiv.org/abs/2607.25656", "authors": ["Zhenzhen Ren", "Jiyan He", "Xinpeng Zhang", "Zhenxing Qian", "Ke Han", "Shuxin Zheng", "GuoBiao Li", "Xiaoqing Zhang"], "brief": "OrchBench \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u786e\u5b9a\u6027\u4eff\u771f\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u5728\u4e0d\u5b9e\u9645\u8c03\u7528\u5de5\u4f5c\u667a\u80fd\u4f53\u7684\u60c5\u51b5\u4e0b\uff0c\u9694\u79bb\u8bc4\u4f30\u591a\u667a\u80fd\u4f53\u4efb\u52a1\u7f16\u6392\u8ba1\u5212\u7684\u8d28\u91cf\u3001\u8017\u65f6\u548c token \u6210\u672c\u3002\u5176\u6a21\u62df\u5f97\u5206\u4e0e Claude Code \u771f\u5b9e\u6267\u884c\u8d28\u91cf\u9ad8\u5ea6\u76f8\u5173\uff08Pearson r=0.816\uff09\uff0c\u4f46\u4ec5\u9700\u7ea6 1.3% \u7684 token \u548c 10.3% \u7684\u65f6\u95f4\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u4fdd\u7559\u5173\u952e\u4efb\u52a1\u4fe1\u606f\u6bd4\u5355\u7eaf\u589e\u52a0\u667a\u80fd\u4f53\u6570\u91cf\u66f4\u91cd\u8981\uff0c\u8fc7\u5ea6\u5e76\u884c\u4f1a\u56e0\u534f\u8c03\u5931\u8d25\u800c\u6536\u76ca\u9012\u51cf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25656", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u4efb\u52a1\u7f16\u6392"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25656v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OrchBench: Evaluating Multi-Agent Orchestration Plans in Isolation via Deterministic Simulation", "tldr": "OrchBench \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u786e\u5b9a\u6027\u4eff\u771f\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u5728\u4e0d\u5b9e\u9645\u8c03\u7528\u5de5\u4f5c\u667a\u80fd\u4f53\u7684\u60c5\u51b5\u4e0b\uff0c\u9694\u79bb\u8bc4\u4f30\u591a\u667a\u80fd\u4f53\u4efb\u52a1\u7f16\u6392\u8ba1\u5212\u7684\u8d28\u91cf\u3001\u8017\u65f6\u548c token \u6210\u672c\u3002\u5176\u6a21\u62df\u5f97\u5206\u4e0e Claude Code \u771f\u5b9e\u6267\u884c\u8d28\u91cf\u9ad8\u5ea6\u76f8\u5173\uff08Pearson r=0.816\uff09\uff0c\u4f46\u4ec5\u9700\u7ea6 1.3% \u7684 token \u548c 10.3% \u7684\u65f6\u95f4\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u4fdd\u7559\u5173\u952e\u4efb\u52a1\u4fe1\u606f\u6bd4\u5355\u7eaf\u589e\u52a0\u667a\u80fd\u4f53\u6570\u91cf\u66f4\u91cd\u8981\uff0c\u8fc7\u5ea6\u5e76\u884c\u4f1a\u56e0\u534f\u8c03\u5931\u8d25\u800c\u6536\u76ca\u9012\u51cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-augmented generation improves knowledge-intensive question answering, but indiscriminate retrieval can introduce irrelevant evidence and unnecessary computation. We investigate whether verbalized confidence from black-box language models can serve as an actionable signal for retrieval routing. Our method, BeyondUncertainty, first elicits a structured provisional answer and confidence estimate, then applies a model-specific threshold selected on held-out validation data and frozen before test evaluation. Low-confidence questions receive top-$5$ TF--IDF retrieval followed by a second answer call, whereas high-confidence questions return the provisional answer directly. We evaluate 27,000 policy instances across six QA benchmarks, three model families, and three retrieval policies. BeyondUncertainty achieves $0.483$ mean token-level F1, compared with $0.467$ for always retrieval and $0.401$ for no retrieval, while reducing retrieved passages by $20.4\\%$ relative to always retrieval. When matched on the number of questions routed to retrieval within each dataset--model cell, it outperforms a post-hoc random allocation in 17 of 18 settings, with an average gain of 0.024 F1. Although poorly calibrated as an absolute probability, probe uncertainty modestly predicts question-level retrieval benefit (AUROC $=0.628$). However, the additional probe increases total token usage by $28.2\\%$, revealing a trade-off between more selective evidence acquisition and end-to-end token efficiency.", "arxiv_id": "2607.25600", "arxiv_url": "https://arxiv.org/abs/2607.25600", "authors": ["Chandan Kumar Sah", "Xiaoli Lian", "Li Zhang"], "brief": "\u672c\u6587\u7814\u7a76\u9ed1\u76d2\u5927\u6a21\u578b\u7684\u53e3\u5934\u7f6e\u4fe1\u5ea6\u80fd\u5426\u4f5c\u4e3a\u68c0\u7d22\u589e\u5f3a\u95ee\u7b54\u4e2d\u7684\u8def\u7531\u4fe1\u53f7\uff0c\u63d0\u51fa BeyondUncertainty\uff1a\u5148\u751f\u6210\u4e34\u65f6\u7b54\u6848\u4e0e\u7f6e\u4fe1\u5ea6\uff0c\u4f4e\u7f6e\u4fe1\u95ee\u9898\u518d\u8fdb\u884c TF-IDF \u68c0\u7d22\uff0c\u9ad8\u7f6e\u4fe1\u95ee\u9898\u76f4\u63a5\u56de\u7b54\u3002\u8be5\u65b9\u6cd5\u5728\u516d\u4e2a\u95ee\u7b54\u57fa\u51c6\u4e0a\u4f18\u4e8e\u59cb\u7ec8\u68c0\u7d22\u548c\u4e0d\u68c0\u7d22\uff0c\u5e76\u51cf\u5c11\u7ea620.4%\u7684\u68c0\u7d22\u6bb5\u843d\uff0c\u4f46\u989d\u5916\u7f6e\u4fe1\u5ea6\u63a2\u6d4b\u4f7f\u603b token \u4f7f\u7528\u589e\u52a028.2%\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25600", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u95ee\u7b54", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25600v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Self-Knowledge: Propagating Uncertainty Across Reasoning and Retrieval in LLMs", "tldr": "\u672c\u6587\u7814\u7a76\u9ed1\u76d2\u5927\u6a21\u578b\u7684\u53e3\u5934\u7f6e\u4fe1\u5ea6\u80fd\u5426\u4f5c\u4e3a\u68c0\u7d22\u589e\u5f3a\u95ee\u7b54\u4e2d\u7684\u8def\u7531\u4fe1\u53f7\uff0c\u63d0\u51fa BeyondUncertainty\uff1a\u5148\u751f\u6210\u4e34\u65f6\u7b54\u6848\u4e0e\u7f6e\u4fe1\u5ea6\uff0c\u4f4e\u7f6e\u4fe1\u95ee\u9898\u518d\u8fdb\u884c TF-IDF \u68c0\u7d22\uff0c\u9ad8\u7f6e\u4fe1\u95ee\u9898\u76f4\u63a5\u56de\u7b54\u3002\u8be5\u65b9\u6cd5\u5728\u516d\u4e2a\u95ee\u7b54\u57fa\u51c6\u4e0a\u4f18\u4e8e\u59cb\u7ec8\u68c0\u7d22\u548c\u4e0d\u68c0\u7d22\uff0c\u5e76\u51cf\u5c11\u7ea620.4%\u7684\u68c0\u7d22\u6bb5\u843d\uff0c\u4f46\u989d\u5916\u7f6e\u4fe1\u5ea6\u63a2\u6d4b\u4f7f\u603b token \u4f7f\u7528\u589e\u52a028.2%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent skills package reusable procedures that improve downstream performance. Their lightweight, portable form enables marketplace monetization and private deployment behind cloud-hosted agent interfaces, giving providers incentives to keep high-value skills proprietary. Yet hiding the artifacts does not conceal their behavioral effects, which remain observable in execution trajectories and form a behavioral side channel. We define this exposure as Skill Leakage: reconstructing proprietary skills from trajectories elicited by benign queries, without reference answers or success labels. We introduce SigLeak, a black-box framework that exploits recurring skill signatures in agent behavior. It constructs diverse, decision-rich diagnostic tasks, contrasts matched skill-enabled and skill-disabled trajectories, and iteratively refines a reconstructed skill from the isolated patterns. Across five scenarios, three model families, and three agent frameworks, SigLeak outperforms or matches three baselines in nearly every setting. It raises the success rate by 6.88 percentage points over the skill-disabled reference on average and achieves the highest overall SkillSim, our metric for coarse- and fine-grained semantic similarity. These results show that benign execution trajectories can expose proprietary procedural knowledge. The code is available at https://anonymous.4open.science/r/SigLeak-D1DB.", "arxiv_id": "2607.25560", "arxiv_url": "https://arxiv.org/abs/2607.25560", "authors": ["Jianing Geng", "Ruiqi He", "Zekun Fei", "Biao Yi", "Ruijie Wang", "Zheli Liu", "Xia Hu", "Xuansheng Wu", "Qingkai Zeng"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u6280\u80fd\u6cc4\u6f0f\u201d\u95ee\u9898\uff1a\u5373\u4f7f\u667a\u80fd\u4f53\u7684\u4e13\u6709\u6280\u80fd\u4ee3\u7801\u88ab\u9690\u85cf\uff0c\u5176\u6267\u884c\u8f68\u8ff9\u4e2d\u7684\u884c\u4e3a\u6a21\u5f0f\u4ecd\u53ef\u80fd\u66b4\u9732\u6280\u80fd\u5185\u5bb9\u3002\u4f5c\u8005\u63d0\u51fa\u9ed1\u76d2\u6846\u67b6 SigLeak\uff0c\u901a\u8fc7\u6784\u9020\u8bca\u65ad\u4efb\u52a1\u5e76\u5bf9\u6bd4\u542f\u7528/\u7981\u7528\u6280\u80fd\u7684\u8f68\u8ff9\u6765\u91cd\u5efa\u6280\u80fd\uff0c\u5728\u591a\u79cd\u573a\u666f\u3001\u6a21\u578b\u548c\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\u4f18\u4e8e\u6216\u5339\u914d\u57fa\u7ebf\uff0c\u663e\u793a\u4e86\u667a\u80fd\u4f53\u6280\u80fd\u7684\u9690\u79c1\u98ce\u9669\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25560", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u9690\u79c1\u5b89\u5168", "\u6280\u80fd\u5b66\u4e60", "\u9ed1\u76d2\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25560v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Agent Skills Matter: Inferring Proprietary Skills from Execution Trajectories", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u6280\u80fd\u6cc4\u6f0f\u201d\u95ee\u9898\uff1a\u5373\u4f7f\u667a\u80fd\u4f53\u7684\u4e13\u6709\u6280\u80fd\u4ee3\u7801\u88ab\u9690\u85cf\uff0c\u5176\u6267\u884c\u8f68\u8ff9\u4e2d\u7684\u884c\u4e3a\u6a21\u5f0f\u4ecd\u53ef\u80fd\u66b4\u9732\u6280\u80fd\u5185\u5bb9\u3002\u4f5c\u8005\u63d0\u51fa\u9ed1\u76d2\u6846\u67b6 SigLeak\uff0c\u901a\u8fc7\u6784\u9020\u8bca\u65ad\u4efb\u52a1\u5e76\u5bf9\u6bd4\u542f\u7528/\u7981\u7528\u6280\u80fd\u7684\u8f68\u8ff9\u6765\u91cd\u5efa\u6280\u80fd\uff0c\u5728\u591a\u79cd\u573a\u666f\u3001\u6a21\u578b\u548c\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\u4f18\u4e8e\u6216\u5339\u914d\u57fa\u7ebf\uff0c\u663e\u793a\u4e86\u667a\u80fd\u4f53\u6280\u80fd\u7684\u9690\u79c1\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) models translate natural-language commands into robot action sequences, but leading systems on the LIBERO-Plus robustness benchmark use three- to seven-billion-parameter backbones whose memory demands can exceed embedded robotic budgets. We present CoTinyVLA, a 0.9B-parameter action model on a Qwen3.5-0.8B backbone that obtains that robustness by structuring supervision instead of enlarging the model. Three components target different axes of the problem: dual-view temporal input of 16 history frames per step with textual camera and time markers; hierarchical chain-of-thought (CoT) distillation from a 35B teacher into an episode-level Plan and a chunk-level Think span over task phase, gripper state and next subaction; and paraphrase augmentation expanding 40 base commands into 800 variants. On LIBERO-Plus, spanning 10,030 perturbed tasks across seven perturbation dimensions, CoTinyVLA reaches 90.8% on Spatial, 87.3% on Object, 86.6% on Goal and 80.7% on Long, leading the strongest 7B baseline on all four suites by 4.7, 2.8, 15.9 and 3.0 points, with every margin interval excluding zero. The gains concentrate on the hardest axes of the benchmark: across the eleven published baselines none exceeds 53.2% on Robot Initial States in any suite, whereas CoTinyVLA reaches 73.6% on Goal against 39.9% for the strongest baseline. Ablations show the three components to be separable by perturbation axis, and at a matched image budget how frames are divided between the two cameras and across time accounts for 8.6 points on its own. Closed-loop inference peaks at 2.25 GiB of allocated GPU memory, and paired interventions show the episode Plan to be load-bearing: replacing it with an empty or contradictory span costs 40 to 45 points of success. Structured supervision thus lets a 0.9B backbone exceed all of them. Code: https://github.com/BrainJellyPie/CoTinyVLA", "arxiv_id": "2607.25487", "arxiv_url": "https://arxiv.org/abs/2607.25487", "authors": ["Minhyeok Lee", "Chiyoung Kim", "Chanhoe Gu", "Seongrok Kim", "Sanghyuk Roy Choi", "Donghwan Hwang", "Donghun Ryu", "Seokhyun Kim"], "brief": "CoTinyVLA \u63d0\u51fa\u4e00\u4e2a\u4ec5 0.9B \u53c2\u6570\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\uff0c\u901a\u8fc7\u53cc\u89c6\u89d2\u65f6\u5e8f\u8f93\u5165\u300135B \u6559\u5e08\u7684\u5206\u5c42\u601d\u7ef4\u94fe\u84b8\u998f\uff0c\u4ee5\u53ca\u6307\u4ee4\u6539\u5199\u589e\u5f3a\u6765\u63d0\u5347\u673a\u5668\u4eba\u4efb\u52a1\u9c81\u68d2\u6027\u3002\u5728 LIBERO-Plus \u4e0a\u5168\u9762\u8d85\u8fc7\u6700\u5f3a 7B \u57fa\u7ebf\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u663e\u5b58\u9700\u6c42\uff0c\u8bf4\u660e\u7ed3\u6784\u5316\u76d1\u7763\u53ef\u66ff\u4ee3\u5355\u7eaf\u6269\u5927\u6a21\u578b\u89c4\u6a21\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25487", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u601d\u7ef4\u94fe\u84b8\u998f", "\u673a\u5668\u4eba", "\u5c0f\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25487v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoTinyVLA: Chain-of-Thought Distillation for a Sub-Billion-Parameter Vision-Language-Action Model", "tldr": "CoTinyVLA \u63d0\u51fa\u4e00\u4e2a\u4ec5 0.9B \u53c2\u6570\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\uff0c\u901a\u8fc7\u53cc\u89c6\u89d2\u65f6\u5e8f\u8f93\u5165\u300135B \u6559\u5e08\u7684\u5206\u5c42\u601d\u7ef4\u94fe\u84b8\u998f\uff0c\u4ee5\u53ca\u6307\u4ee4\u6539\u5199\u589e\u5f3a\u6765\u63d0\u5347\u673a\u5668\u4eba\u4efb\u52a1\u9c81\u68d2\u6027\u3002\u5728 LIBERO-Plus \u4e0a\u5168\u9762\u8d85\u8fc7\u6700\u5f3a 7B \u57fa\u7ebf\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u663e\u5b58\u9700\u6c42\uff0c\u8bf4\u660e\u7ed3\u6784\u5316\u76d1\u7763\u53ef\u66ff\u4ee3\u5355\u7eaf\u6269\u5927\u6a21\u578b\u89c4\u6a21\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision--Language Models (VLMs) are increasingly deployed through a model supply chain in which pretrained checkpoints, architecture definitions, text encoders, and exported computation graphs are distributed by third parties and reused across downstream services. This reuse model creates a security-critical trust boundary: VLM deployments inherit not only learned parameters but also executable behavior encoded in shared model artifacts. In this paper, we show that a malicious provider can exploit this trust boundary by embedding architectural backdoors into VLM supply chains through representation steering. Our attack introduces dormant steering logic into the model architecture through a trigger-gated additive modification of an intermediate representation, without poisoning training data, controlling downstream fine-tuning, or modifying prompts at deployment time. When the trigger is absent, the modification reduces to zero and the model follows its normal computation, preserving clean utility. When the trigger is present, a steering direction shifts the internal representation toward an attacker-defined objective. We evaluate the attack across multiple VLM families and downstream tasks, including visual question answering, text-to-image generation, retrieval, and semantic response biasing. The results show that the proposed architectural steering backdoor compromises integrity, safety enforcement, and ranking fairness while preserving normal behavior on clean inputs. We further show that shared VLM artifacts can carry dormant steering logic against downstream services, and we propose an auditing defense that inspects the executable logic distributed with model artifacts rather than only their learned weights.", "arxiv_id": "2607.25479", "arxiv_url": "https://arxiv.org/abs/2607.25479", "authors": ["Maria Rosaria Briglia", "Igor Maljkovic", "Antonio Emanuele Cin\u00e0", "Luca Oneto", "Iacopo Masi", "Fabio Roli"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9488\u5bf9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f9b\u5e94\u94fe\u7684\u201c\u67b6\u6784\u540e\u95e8\u201d\u653b\u51fb\uff1a\u6076\u610f\u65b9\u53ef\u5728\u6a21\u578b\u67b6\u6784\u6216\u8ba1\u7b97\u56fe\u4e2d\u52a0\u5165\u7531\u89e6\u53d1\u5668\u63a7\u5236\u7684\u8868\u793a steering \u903b\u8f91\uff0c\u65e0\u9700\u6295\u6bd2\u6570\u636e\u3001\u63a7\u5236\u5fae\u8c03\u6216\u4fee\u6539\u90e8\u7f72\u63d0\u793a\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u540e\u95e8\u5728\u95ee\u7b54\u3001\u6587\u751f\u56fe\u3001\u68c0\u7d22\u7b49\u4efb\u52a1\u4e2d\u53ef\u7834\u574f\u5b89\u5168\u6027\u3001\u5b8c\u6574\u6027\u548c\u6392\u5e8f\u516c\u5e73\u6027\uff0c\u540c\u65f6\u5728\u5e72\u51c0\u8f93\u5165\u4e0a\u4fdd\u6301\u6b63\u5e38\u8868\u73b0\uff1b\u4f5c\u8005\u8fd8\u63d0\u51fa\u68c0\u67e5\u6a21\u578b\u53ef\u6267\u884c\u903b\u8f91\u7684\u5ba1\u8ba1\u9632\u5fa1\u601d\u8def\u3002", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25479", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u540e\u95e8\u653b\u51fb", "\u4f9b\u5e94\u94fe\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25479v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Architectural Backdoors in Vision-Language Model Supply Chains via Representation Steering", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9488\u5bf9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f9b\u5e94\u94fe\u7684\u201c\u67b6\u6784\u540e\u95e8\u201d\u653b\u51fb\uff1a\u6076\u610f\u65b9\u53ef\u5728\u6a21\u578b\u67b6\u6784\u6216\u8ba1\u7b97\u56fe\u4e2d\u52a0\u5165\u7531\u89e6\u53d1\u5668\u63a7\u5236\u7684\u8868\u793a steering \u903b\u8f91\uff0c\u65e0\u9700\u6295\u6bd2\u6570\u636e\u3001\u63a7\u5236\u5fae\u8c03\u6216\u4fee\u6539\u90e8\u7f72\u63d0\u793a\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u540e\u95e8\u5728\u95ee\u7b54\u3001\u6587\u751f\u56fe\u3001\u68c0\u7d22\u7b49\u4efb\u52a1\u4e2d\u53ef\u7834\u574f\u5b89\u5168\u6027\u3001\u5b8c\u6574\u6027\u548c\u6392\u5e8f\u516c\u5e73\u6027\uff0c\u540c\u65f6\u5728\u5e72\u51c0\u8f93\u5165\u4e0a\u4fdd\u6301\u6b63\u5e38\u8868\u73b0\uff1b\u4f5c\u8005\u8fd8\u63d0\u51fa\u68c0\u67e5\u6a21\u578b\u53ef\u6267\u884c\u903b\u8f91\u7684\u5ba1\u8ba1\u9632\u5fa1\u601d\u8def\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Stateful multimodal assistants encode an image once but may answer questions about it many turns later. Attention-guided visual-KV eviction assumes that evidence irrelevant now will remain dispensable, although future questions are unknown. We ask when a visual fact is actually safe to forget and introduce the Causal Visual Memory Audit (CVMA), a paired single-prefill framework that tests what later answers lose when a visual region, the whole image, or prior assistant text becomes unavailable. On VisDial and ConvBench, current attention can rank future-useful regions worse than random even though a diagnostic marginal-utility control shows substantial selection headroom. Aggregate scores hide this failure when later turns do not need vision; controlled and stock-generated histories reveal a second escape route, in which assistant-text KV replaces image KV for facts already stated but not reliably for unstated facts. In the tested stacks, safe forgetting is supported by low future visual dependence or fact-specific verbalization---not by low current attention.", "arxiv_id": "2607.25467", "arxiv_url": "https://arxiv.org/abs/2607.25467", "authors": ["Hong Chen", "Kang Chen", "Yuxuan Fan", "Bo Wang", "Yubo Gao", "Yuanlin Chu", "Xuming Hu"], "brief": "\u8bba\u6587\u63d0\u51fa Causal Visual Memory Audit\uff08CVMA\uff09\uff0c\u7528\u4e8e\u56e0\u679c\u8bc4\u4f30\u591a\u8f6e\u591a\u6a21\u6001\u5bf9\u8bdd\u4e2d\u5220\u9664\u89c6\u89c9 KV\u3001\u6574\u56fe\u6216\u5386\u53f2\u56de\u7b54\u6587\u672c\u540e\uff0c\u5bf9\u540e\u7eed\u56de\u7b54\u9020\u6210\u7684\u635f\u5931\u3002\u5b9e\u9a8c\u53d1\u73b0\u5f53\u524d\u6ce8\u610f\u529b\u5e76\u4e0d\u80fd\u53ef\u9760\u5224\u65ad\u54ea\u4e9b\u89c6\u89c9\u533a\u57df\u672a\u6765\u53ef\u9057\u5fd8\uff0c\u751a\u81f3\u53ef\u80fd\u5dee\u4e8e\u968f\u673a\uff1b\u771f\u6b63\u5b89\u5168\u9057\u5fd8\u66f4\u591a\u53d6\u51b3\u4e8e\u540e\u7eed\u662f\u5426\u4f9d\u8d56\u89c6\u89c9\uff0c\u4ee5\u53ca\u76f8\u5173\u4e8b\u5b9e\u662f\u5426\u5df2\u88ab\u52a9\u624b\u6587\u672c\u660e\u786e\u8bf4\u51fa\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25467", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bb0\u5fc6", "\u6ce8\u610f\u529b\u673a\u5236", "\u56e0\u679c\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25467v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Seen, Said, or Forgotten? A Causal Audit of Visual KV Memory Across Dialog Turns", "tldr": "\u8bba\u6587\u63d0\u51fa Causal Visual Memory Audit\uff08CVMA\uff09\uff0c\u7528\u4e8e\u56e0\u679c\u8bc4\u4f30\u591a\u8f6e\u591a\u6a21\u6001\u5bf9\u8bdd\u4e2d\u5220\u9664\u89c6\u89c9 KV\u3001\u6574\u56fe\u6216\u5386\u53f2\u56de\u7b54\u6587\u672c\u540e\uff0c\u5bf9\u540e\u7eed\u56de\u7b54\u9020\u6210\u7684\u635f\u5931\u3002\u5b9e\u9a8c\u53d1\u73b0\u5f53\u524d\u6ce8\u610f\u529b\u5e76\u4e0d\u80fd\u53ef\u9760\u5224\u65ad\u54ea\u4e9b\u89c6\u89c9\u533a\u57df\u672a\u6765\u53ef\u9057\u5fd8\uff0c\u751a\u81f3\u53ef\u80fd\u5dee\u4e8e\u968f\u673a\uff1b\u771f\u6b63\u5b89\u5168\u9057\u5fd8\u66f4\u591a\u53d6\u51b3\u4e8e\u540e\u7eed\u662f\u5426\u4f9d\u8d56\u89c6\u89c9\uff0c\u4ee5\u53ca\u76f8\u5173\u4e8b\u5b9e\u662f\u5426\u5df2\u88ab\u52a9\u624b\u6587\u672c\u660e\u786e\u8bf4\u51fa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cyber-capable AI agents combine language models with tools, memory, and execution en- vironments to perform multi-step offensive-security tasks. Existing work separately measures cyber capability and catalogs attacks against agent components, but provides less guidance on containing a capable agent within the environments used to evaluate it. This review synthe- sizes five vulnerability classes at that boundary: multi-step offensive chains, objectives that conflict with sandbox boundaries, supply-chain and credential exposure, persistent command- and-control, and the speed of automated action. We use the reported July 2026 Hugging Face/OpenAI incident as a bounded case study, distinguishing incident-specific observations from findings established in the wider literature. Across the taxonomy and case, we examine controls for containment, privilege separation, provenance, and responder access, including the dual-use problem that defensive artifacts may also enable misuse. The review identifies practical priorities for evaluating cyber capability together with the security of the environment in which that capability is exercised.", "arxiv_id": "2607.25379", "arxiv_url": "https://arxiv.org/abs/2607.25379", "authors": ["Abu Bakar Siddik"], "brief": "\u672c\u6587\u7efc\u8ff0\u5177\u5907\u7f51\u7edc\u653b\u9632\u80fd\u529b\u7684 AI \u667a\u80fd\u4f53\u5728\u8bc4\u6d4b\u73af\u5883\u8fb9\u754c\u4e0a\u7684\u5b89\u5168\u98ce\u9669\uff0c\u5f52\u7eb3\u4e86\u591a\u6b65\u653b\u51fb\u94fe\u3001\u6c99\u7bb1\u76ee\u6807\u51b2\u7a81\u3001\u4f9b\u5e94\u94fe\u4e0e\u51ed\u8bc1\u66b4\u9732\u3001\u6301\u4e45\u5316\u63a7\u5236\u3001\u81ea\u52a8\u5316\u9ad8\u901f\u884c\u52a8\u7b49\u4e94\u7c7b\u6f0f\u6d1e\u3002\u6587\u7ae0\u7ed3\u5408 Hugging Face/OpenAI \u4e8b\u4ef6\u6848\u4f8b\uff0c\u63d0\u51fa\u56f4\u7ed5\u9694\u79bb\u3001\u6743\u9650\u5206\u79bb\u3001\u6eaf\u6e90\u4e0e\u5e94\u6025\u8bbf\u95ee\u7684\u9632\u62a4\u91cd\u70b9\uff0c\u4e3a\u5b89\u5168\u8bc4\u6d4b\u7f51\u7edc\u80fd\u529b\u578b\u667a\u80fd\u4f53\u63d0\u4f9b\u5b9e\u8df5\u6846\u67b6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25379", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u5b89\u5168\u8bc4\u6d4b", "\u6c99\u7bb1\u9694\u79bb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25379v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cyber-Capable AI Agents: Vulnerabilities, Evaluation Containment, and Defensive Response", "tldr": "\u672c\u6587\u7efc\u8ff0\u5177\u5907\u7f51\u7edc\u653b\u9632\u80fd\u529b\u7684 AI \u667a\u80fd\u4f53\u5728\u8bc4\u6d4b\u73af\u5883\u8fb9\u754c\u4e0a\u7684\u5b89\u5168\u98ce\u9669\uff0c\u5f52\u7eb3\u4e86\u591a\u6b65\u653b\u51fb\u94fe\u3001\u6c99\u7bb1\u76ee\u6807\u51b2\u7a81\u3001\u4f9b\u5e94\u94fe\u4e0e\u51ed\u8bc1\u66b4\u9732\u3001\u6301\u4e45\u5316\u63a7\u5236\u3001\u81ea\u52a8\u5316\u9ad8\u901f\u884c\u52a8\u7b49\u4e94\u7c7b\u6f0f\u6d1e\u3002\u6587\u7ae0\u7ed3\u5408 Hugging Face/OpenAI \u4e8b\u4ef6\u6848\u4f8b\uff0c\u63d0\u51fa\u56f4\u7ed5\u9694\u79bb\u3001\u6743\u9650\u5206\u79bb\u3001\u6eaf\u6e90\u4e0e\u5e94\u6025\u8bbf\u95ee\u7684\u9632\u62a4\u91cd\u70b9\uff0c\u4e3a\u5b89\u5168\u8bc4\u6d4b\u7f51\u7edc\u80fd\u529b\u578b\u667a\u80fd\u4f53\u63d0\u4f9b\u5b9e\u8df5\u6846\u67b6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-using agents expose structured calls but commonly attach free-form rationales. Such rationales are neither authorization nor reliable introspection. We present Explanation-Bound Tool Execution (EBTE), a claim-carrying mediation layer that converts decision-relevant rationale content into typed action claims and checks them against server-held intent, policy, payload, tool, risk, provenance, and freshness facts. EBTE cannot widen baseline authority: conflicts deny, incomplete or uncertain claims review, and only matching claims remain eligible for governed execution. We formalize this composition under explicit mediation and trusted-fact assumptions and implement a versioned reference profile with minimized audit packets. Across 136 authored conformance scenarios, the full profile matches all specified dispositions, admits none of 96 designated hard contradictions, and passes 232 metamorphic checks; these results validate the included profile rather than population performance. A draft-only reference integration forwards none of 48 authored hard cases under EBTE while preserving all 16 soft-review and 4 aligned draft paths. In a frozen 2026-07-12 exploratory 224-attempt hosted-model record, the historical generation/runner agreement counts are 71/96, 66/96, and 19/32; a separately labeled zero-call post-hoc revalidation of the preserved minimized claims under the current pipeline yields 70/96, 65/96, and 17/32. In an AgentDojo-derived semantic check, existing high-risk controls already make all 12 attack proposals non-allow; EBTE additionally resolves them as deny. These results support the feasibility and diagnostic value of server-checked action claims, not rationale faithfulness, human-review benefit, representative attack resistance, or production safety.", "arxiv_id": "2607.25364", "arxiv_url": "https://arxiv.org/abs/2607.25364", "authors": ["Genliang Zhu", "Chu Wang"], "brief": "\u63d0\u51fa EBTE\uff0c\u4e00\u79cd\u7528\u4e8e\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u7684\u670d\u52a1\u7aef\u9a8c\u8bc1\u4e2d\u4ecb\u5c42\uff0c\u5c06\u6a21\u578b\u81ea\u7531\u6587\u672c\u7406\u7531\u4e2d\u7684\u5173\u952e\u5185\u5bb9\u8f6c\u6210\u7c7b\u578b\u5316\u884c\u52a8\u58f0\u660e\uff0c\u5e76\u7528\u670d\u52a1\u7aef\u6301\u6709\u7684\u610f\u56fe\u3001\u7b56\u7565\u3001\u98ce\u9669\u3001\u6765\u6e90\u7b49\u4e8b\u5b9e\u6821\u9a8c\u540e\u518d\u6267\u884c\u3002\u5b9e\u9a8c\u5728\u4eba\u5de5\u6784\u9020\u7684\u4e00\u81f4\u6027\u3001\u53d8\u5f62\u4e0e\u96c6\u6210\u573a\u666f\u4e2d\u9a8c\u8bc1\u4e86\u914d\u7f6e\u6587\u4ef6\u80fd\u6b63\u786e\u62d2\u7edd\u786c\u51b2\u7a81\u5e76\u4fdd\u7559\u9700\u5ba1\u67e5\u6216\u5bf9\u9f50\u8def\u5f84\uff0c\u5f3a\u8c03\u5176\u4ef7\u503c\u5728\u4e8e\u53ef\u8bca\u65ad\u7684\u58f0\u660e\u6821\u9a8c\u800c\u975e\u8bc1\u660e\u6a21\u578b\u7406\u7531\u53ef\u4fe1\u6216\u751f\u4ea7\u5b89\u5168\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25364", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5b89\u5168\u6cbb\u7406", "\u5f62\u5f0f\u5316\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25364v1", "published_at": "2026-07-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Explanation-Bound Tool Execution for AI Agents: Server-Verified Action Claims Without Trusting Model Rationales", "tldr": "\u63d0\u51fa EBTE\uff0c\u4e00\u79cd\u7528\u4e8e\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u7684\u670d\u52a1\u7aef\u9a8c\u8bc1\u4e2d\u4ecb\u5c42\uff0c\u5c06\u6a21\u578b\u81ea\u7531\u6587\u672c\u7406\u7531\u4e2d\u7684\u5173\u952e\u5185\u5bb9\u8f6c\u6210\u7c7b\u578b\u5316\u884c\u52a8\u58f0\u660e\uff0c\u5e76\u7528\u670d\u52a1\u7aef\u6301\u6709\u7684\u610f\u56fe\u3001\u7b56\u7565\u3001\u98ce\u9669\u3001\u6765\u6e90\u7b49\u4e8b\u5b9e\u6821\u9a8c\u540e\u518d\u6267\u884c\u3002\u5b9e\u9a8c\u5728\u4eba\u5de5\u6784\u9020\u7684\u4e00\u81f4\u6027\u3001\u53d8\u5f62\u4e0e\u96c6\u6210\u573a\u666f\u4e2d\u9a8c\u8bc1\u4e86\u914d\u7f6e\u6587\u4ef6\u80fd\u6b63\u786e\u62d2\u7edd\u786c\u51b2\u7a81\u5e76\u4fdd\u7559\u9700\u5ba1\u67e5\u6216\u5bf9\u9f50\u8def\u5f84\uff0c\u5f3a\u8c03\u5176\u4ef7\u503c\u5728\u4e8e\u53ef\u8bca\u65ad\u7684\u58f0\u660e\u6821\u9a8c\u800c\u975e\u8bc1\u660e\u6a21\u578b\u7406\u7531\u53ef\u4fe1\u6216\u751f\u4ea7\u5b89\u5168\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-context recall in linear-time sequence models highlights a tradeoff in how they write to memory. State-based linear models, such as state-space models (SSMs) and linear Transformers, write densely, updating the entire state for each newly arrived token, which leads to interference and makes specifi
