by complex questions. Direct Corpus Interaction (DCI) enables such fine-grained operations through grep-style exploration, but its relevance-agnostic search can expose useful clues late and delay convergence. Recent advances use relevance to narrow the corpus into a working space for interaction. Once interaction begins, however, relevance still does not directly guide which documents grep searches first or distinguish informative excerpts from a broad set of matches to let LLMs see them first. We introduce the Relevance-Aware RipGrep Search Agent (RARG), which turns relevance into an execution prior for corpus interaction. RARG provides coarse-to-fine relevance guidance: it orders documents for sequential \u0027ripgrep\u0027 traversal to expose globally relevant clues earlier, initializes promising entry points with query-relevant paragraphs, and reranks grep matches to surface informative excerpts that document-level ranking may otherwise obscure. Across challenging browse question answering and reasoning-intensive retrieval, RARG improves the accuracy--efficiency frontier over retrieval-based and direct-interaction agents. These results demonstrate that relevance-aware interaction enables faster and more reliable search convergence.", "arxiv_id": "2607.24223", "arxiv_url": "https://arxiv.org/abs/2607.24223", "authors": ["Jiangnan Li", "Yuqing Li", "Mo Yu", "Jinchao Zhang", "Jie Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Relevance-Aware RipGrep Search Agent\uff08RARG\uff09\uff0c\u5c06\u67e5\u8be2\u76f8\u5173\u6027\u4ece\u7b80\u5355\u7684 top-k \u68c0\u7d22\u4fe1\u53f7\u8f6c\u5316\u4e3a\u8bed\u6599\u4ea4\u4e92\u8fc7\u7a0b\u4e2d\u7684\u6267\u884c\u5148\u9a8c\u3002\u5b83\u5728\u6587\u6863\u904d\u5386\u3001\u5165\u53e3\u6bb5\u843d\u521d\u59cb\u5316\u548c grep \u5339\u914d\u91cd\u6392\u4e09\u4e2a\u5c42\u9762\u5f15\u5bfc\u641c\u7d22\uff0c\u4f7f\u667a\u80fd\u4f53\u66f4\u5feb\u53d1\u73b0\u6709\u6548\u8bc1\u636e\u3002", "categories": ["cs.CL"], "github_repo": "https://gith e2a\u5c42\u9762\u5f15\u5bfc\u641c\u7d22\uff0c\u4f7f\u667a\u80fd\u4f53\u66f4\u5feb\u53d1\u73b0\u6709\u6548\u8bc1\u636e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u76f8\u5173\u6027\u201d\u4ece\u68c0\u7d22\u9636\u6bb5\u6269\u5c55\u5230\u667a\u80fd\u4f53\u6267\u884c\u9636\u6bb5\uff0c\u5f25\u8865\u4e86\u76f4\u63a5\u8bed\u6599\u4ea4\u4e92\u4e2d\u76f2\u76ee grep \u641c\u7d22\u6536\u655b\u6162\u7684\u95ee\u9898\uff0c\u5bf9\u6784\u5efa\u9ad8\u6548\u53ef\u9760\u7684\u68c0\u7d22\u589e\u5f3a\u667a\u80fd\u4f53\u548c\u590d\u6742\u95ee\u7b54\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Parametric models of the human head are essential tools traditionally used in computer vision and graphics for animation, rendering, and reconstruction. More recently, they serve as crucial conditioning signals within generative large vision models, allowing for tight spatial control of generated imagery. However, existing publicly available models are typically limited in anatomical scope, modeling only outer geometry while ignoring intra-oral and ocular structures, and frequently suffer from reduced geometric quality stemming from low-fidelity input datasets. In this report we introduce a new parametric model dubbed Generative aNthropometric Model (GNM), named as a homophone of the human genome. GNM encompasses the head, face, neck, eyeballs, teeth, and tongue, and it is built on an extensive database of high-resolution 3D scans combined with high-quality anatomy specific artist-made samples. This report details the data provenance, the model architecture including the specialized sub-models for the ocular and intra-oral structures, and shows its SotA performance on fitting target 3D face scans. To foster community innovation, the complete GNM framework is made publicly available.", "arxiv_id": "2607.23687", "arxiv_url": "https://arxiv.org/abs/2607.23687", "authors": ["Stylianos Ploumpis", "Jan Bednarik", "Gaspard Zoss", "Ruslan Guseinov", "Luca Prasso", "Prashanth Chandran", "Oliver Boyne", "Vasileios Choutas", "Timo Bolkart", "Daoye Wang", "Menglei Chai", "Di Qiu", "Sebastian Winberg", "Gilles Rainer", "Lewis Bridgeman", "Delio Vicini", "J\u00e9r\u00e9my Riviere", "Yannick Boetzel", "Alexander Koumis", "Jay Busch", "Cynthia Herrera", "Jacob Still", "Scott Ysebert", "Peter Lincoln", "Sergio Orts Escolano", "Christoph Rhemann", "Erroll Wood", "Thabo Beeler", "Stefanos Zafeiriou"], "brief": "\u8bba\u6587\u63d0\u51faGNM Head\uff0c\u4e00\u4e2a\u8986\u76d6\u5934\u90e8\u3001\u9762\u90e8\u3001\u9888\u90e8\u3001\u773c\u7403\u3001\u7259\u9f7f\u548c\u820c\u5934\u7684\u9ad8\u4fdd\u771f\u4eba\u5934\u53c2\u6570\u5316\u6a21\u578b\u3002\u5b83\u57fa\u4e8e\u9ad8\u5206\u8fa8\u73873D\u626b\u63cf\u4e0e\u827a\u672f\u5bb6\u5236\u4f5c\u7684\u89e3\u5256\u7ed3\u6784\u6837\u672c\u6784\u5efa\uff0c\u5e76\u516c\u5f00\u5b8c\u6574\u6846\u67b6\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": "https://github.com/google/GNM", "github_stars": 1247, "hf_url": "https://huggingface.co/papers/2607.23687", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u76f8\u6bd4\u5e38\u89c1\u4eba\u5934\u6a21\u578b\u53ea\u5efa\u6a21\u5916\u90e8\u51e0\u4f55\uff0cGNM\u7eb3\u5165\u53e3\u8154\u4e0e\u773c\u90e8\u7b49\u5185\u90e8/\u9644\u5c5e\u89e3\u5256\u7ed3\u6784", "\u7ed3\u5408\u5927\u89c4\u6a21\u9ad8\u5206\u8fa8\u73873D\u626b\u63cf\u548c\u9ad8\u8d28\u91cf\u89e3\u5256\u4e13\u7528\u6837\u672c\uff0c\u63d0\u5347\u51e0\u4f55\u8d28\u91cf\u4e0e\u8986\u76d6\u8303\u56f4", "\u5305\u542b\u773c\u90e8\u548c\u53e3\u8154\u7ed3\u6784\u7684\u4e13\u95e8\u5b50\u6a21\u578b\uff0c\u5728\u76ee\u68073D\u4eba\u8138\u626b\u63cf\u62df\u5408\u4e0a\u8fbe\u5230SotA\u8868\u73b0"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u53c2\u6570\u5316\u6a21\u578b", "\u4eba\u8138\u5efa\u6a21", "\u8ba1\u7b97\u673a\u56fe\u5f62\u5b66"], "num_comments": 0, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2607.23687v1", "published_at": "2026-07-26", "score": 0.523, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23687.png", "title": "GNM Head: A Generative aNthropometric Model of the human head", "tldr": "\u5f00\u6e90\u9ad8\u4fdd\u771f\u4eba\u5934\u53c2\u6570\u5316\u751f\u6210\u6a21\u578bGNM", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51faGNM Head\uff0c\u4e00\u4e2a\u8986\u76d6\u5934\u90e8\u3001\u9762\u90e8\u3001\u9888\u90e8\u3001\u773c\u7403\u3001\u7259\u9f7f\u548c\u820c\u5934\u7684\u9ad8\u4fdd\u771f\u4eba\u5934\u53c2\u6570\u5316\u6a21\u578b\u3002\u5b83\u57fa\u4e8e\u9ad8\u5206\u8fa8\u73873D\u626b\u63cf\u4e0e\u827a\u672f\u5bb6\u5236\u4f5c\u7684\u89e3\u5256\u7ed3\u6784\u6837\u672c\u6784\u5efa\uff0c\u5e76\u516c\u5f00\u5b8c\u6574\u6846\u67b6\u3002", "why_notable": "\u9ad8\u8d28\u91cf\u3001\u89e3\u5256\u8303\u56f4\u5b8c\u6574\u4e14\u5f00\u6e90\u7684\u4eba\u5934\u53c2\u6570\u5316\u6a21\u578b\u53ef\u76f4\u63a5\u63a8\u52a8\u4eba\u8138\u91cd\u5efa\u3001\u52a8\u753b\u3001\u6e32\u67d3\u4ee5\u53ca\u53ef\u63a7\u56fe\u50cf\u751f\u6210\u7b49\u5e94\u7528\uff0c\u5c24\u5176\u9002\u5408\u4f5c\u4e3a\u751f\u6210\u5f0f\u89c6\u89c9\u6a21\u578b\u7684\u7a7a\u95f4\u6761\u4ef6\u4fe1\u53f7\u3002"}, {"abstract": "Multimodal foundation models learned to see and to speak by consuming the whole internet. Embodied agents admit no such shortcut, since they require data that couple observations with physical states and actions. These signals can be provided, to varying degrees, by multiple data sources. In this work, we organize the embodied data ecosystem as a \"pyramid\" spanning five complementary sources: real-robot data, UMI-style data, egocentric and exocentric data, simulation data, and general vision-language data. We organize the pyramid around the tension between scalability and robot alignment, and further characterize each source in terms of data quality, diversity, reusability, and physical fidelity. We then analyze recent embodied foundation models through the lens of their data recipes, examining how different sources are selected, aligned, and mixed during pretraining. For embodied brain models, vision-language-action models, and world-action models alike, we relate data composition to capabilities in perception, reasoning, planning, action generation, and world prediction. We close by discussing six open challenges: building large-scale tactile datasets, collecting failure and recovery data, developing scalable data-collection pipelines, aligning actions across embodiments, leveraging egocentric data for dexterous manipulation, and designing principled data recipes for robot learning. We hope this work paves the foundation for the design of next-generation embodied systems.", "arxiv_id": "2607.24744", "arxiv_url": "https://arxiv.org/abs/2607.24744", "authors": ["Yifan Ye", "Yankai Fu", "Yaoxu Lv", "Bohan Hou", "Jun Cen", "Lingdong Kong", "Duo Zheng", "Tianxing Chen", "Jiaming Liu", "Ziang Cao", "Yunfan Lou", "Wei Chow", "Xian Sun", "Yingshuo Wang", "Kuangzhi Ge", "Xiaowei Chi", "Xidong Zhang", "Zhibo Pang", "Yiwu Zhong", "Sirui Han", "Zhihe Lu", "Weihao Yuan", "Qifeng Chen", "Michael Yu Wang", "Yao Mu", "Ziwei Liu", "Jianfei Yang", "Ping Luo", "Shanghang Zhang"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u9762\u5411\u5177\u8eab\u64cd\u4f5c\u7684\u7efc\u8ff0/\u6846\u67b6\u8bba\u6587\uff0c\u63d0\u51fa\u201c\u6570\u636e\u91d1\u5b57\u5854\u201d\u6765\u7ec4\u7ec7\u771f\u5b9e\u673a\u5668\u4eba\u3001UMI\u3001\u7b2c\u4e00/\u7b2c\u4e09\u4eba\u79f0\u89c6\u9891\u3001\u4eff\u771f\u548c\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6570\u636e\u3002\u8bba\u6587\u4ece\u89c4\u6a21\u5316\u4e0e\u673a\u5668\u4eba\u5bf9\u9f50\u7684\u5f20\u529b\u51fa\u53d1\uff0c\u5206\u6790\u4e0d\u540c\u6570\u636e\u6e90\u5982\u4f55\u652f\u6491\u5177\u8eab\u57fa\u7840\u6a21\u578b\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/worldbench/awesome-embodied-data-pyramid", "github_stars": 67, "hf_url": "https://huggingface.co/papers/2607.24744", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u5177\u8eab\u6570\u636e\u5212\u5206\u4e3a\u4e94\u7c7b\u6765\u6e90\uff0c\u5e76\u4ece\u6570\u636e\u8d28\u91cf\u3001\u591a\u6837\u6027\u3001\u53ef\u590d\u7528\u6027\u548c\u7269\u7406\u4fdd\u771f\u5ea6\u7b49\u7ef4\u5ea6\u8fdb\u884c\u6bd4\u8f83", "\u5206\u6790\u5177\u8eab\u5927\u8111\u6a21\u578b\u3001\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u548c\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u7684\u6570\u636e\u914d\u65b9\u53ca\u5176\u5bf9\u611f\u77e5\u3001\u63a8\u7406\u3001\u89c4\u5212\u3001\u52a8\u4f5c\u751f\u6210\u548c\u4e16\u754c\u9884\u6d4b\u80fd\u529b\u7684\u5f71\u54cd", "\u603b\u7ed3\u516d\u4e2a\u5f00\u653e\u6311\u6218\uff0c\u5305\u62ec\u89e6\u89c9\u6570\u636e\u3001\u5931\u8d25\u4e0e\u6062\u590d\u6570\u636e\u3001\u53ef\u6269\u5c55\u91c7\u96c6\u6d41\u6c34\u7ebf\u3001\u8de8\u672c\u4f53\u52a8\u4f5c\u5bf9\u9f50\u548c\u7075\u5de7\u64cd\u4f5c\u4e2d\u7684\u81ea\u6211\u4e2d\u5fc3\u6570\u636e\u5229\u7528"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u6570\u636e\u96c6", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2607.24744v1", "published_at": "2026-07-27", "score": 0.52, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (32\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24744.png", "title": "Data Pyramid for Embodied Manipulation", "tldr": "\u7528\u6570\u636e\u91d1\u5b57\u5854\u68b3\u7406\u5177\u8eab\u64cd\u4f5c\u6570\u636e\u751f\u6001", "upvotes": 32, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u9762\u5411\u5177\u8eab\u64cd\u4f5c\u7684\u7efc\u8ff0/\u6846\u67b6\u8bba\u6587\uff0c\u63d0\u51fa\u201c\u6570\u636e\u91d1\u5b57\u5854\u201d\u6765\u7ec4\u7ec7\u771f\u5b9e\u673a\u5668\u4eba\u3001UMI\u3001\u7b2c\u4e00/\u7b2c\u4e09\u4eba\u79f0\u89c6\u9891\u3001\u4eff\u771f\u548c\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6570\u636e\u3002\u8bba\u6587\u4ece\u89c4\u6a21\u5316\u4e0e\u673a\u5668\u4eba\u5bf9\u9f50\u7684\u5f20\u529b\u51fa\u53d1\uff0c\u5206\u6790\u4e0d\u540c\u6570\u636e\u6e90\u5982\u4f55\u652f\u6491\u5177\u8eab\u57fa\u7840\u6a21\u578b\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u8bba\u6587\u6ca1\u6709\u63d0\u51fa\u5355\u4e00\u65b0\u6a21\u578b\uff0c\u800c\u662f\u7cfb\u7edf\u5316\u68b3\u7406\u4e86\u5177\u8eab\u667a\u80fd\u6570\u636e\u751f\u6001\uff0c\u4e3a\u5982\u4f55\u6df7\u5408\u4e0d\u540c\u6765\u6e90\u6570\u636e\u8bad\u7ec3\u4e0b\u4e00\u4ee3\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b\u63d0\u4f9b\u4e86\u6e05\u6670\u6846\u67b6\u548c\u7814\u7a76\u8def\u7ebf\u56fe\u3002"}, {"abstract": "Creative AI is moving from single-step asset generation toward long-horizon multimodal production. Although recent generative models can synthesize high-quality images, videos, audio clips, UI elements, storyboards, slides, and other creative assets, real-world creative work requires more than isolated prompt-output interactions. It involves references, drafts, alternatives, edits, failed attempts, version relations, tool actions, evaluation signals, and human feedback, which together form an evolving project state. Existing prompt-based, chat-based, and node-based generation systems only partially support this state, as they often discard intermediate context, rely on linear conversations, or require manually specified workflows. Recent commercial systems indicate a shift toward agent-assisted creative production, but their closed architectures make it difficult to study how agents represent context, choose tools, revise artifacts, recover from failures, and maintain consistency over time. To address this gap, we introduce JarvisHub, a canvas-native creative agent harness for long-horizon multimodal creation. JarvisHub treats an editable canvas as the user workspace, the agent\u0027s external memory, action space, and shared project state, representing multimodal artifacts, dependencies, versions, and feedback as typed canvas nodes and links. Through a three-layer architecture of canvas state, protocol bridge, and agent runtime, JarvisHub enables agents to act within an inspectable and editable creative state. This design moves creative agents beyond isolated tool use toward sustained, human-steerable creative automation, where agents can progressively plan, generate, revise, and organize multimodal projects while users remain able to inspect, guide, and intervene throughout the process.", "arxiv_id": "2607.23588", "arxiv_url": "https://arxiv.org/abs/2607.23588", "authors": ["Yunlong Lin", "Zixu Lin", "Zhaohu Xing", "Biqiang Li", "Chenxin Li", "Haonan Wang", "Haitao Wu", "Hengyu Liu", "Jianghai Chen", "Kaituo Feng", "Kaixin Li", "Shawn Chen", "Shijue Huang", "Sixiang Chen", "Tsung-Yi Ho", "Wenxuan Huang", "Xiangyan Liu", "Xiaomeng Hu", "Xuanhua He", "Yan Sun", "Yunqing Zhao", "Zhiqin Yang", "Zehan Wang", "Zhengyang Tang", "Tianyu Pang", "Xiangyu Yue"], "brief": "\u8bba\u6587\u63d0\u51fa JarvisHub\uff0c\u4e00\u4e2a\u753b\u5e03\u539f\u751f\u7684\u591a\u6a21\u6001\u521b\u4f5c\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u3002\u5b83\u5c06\u53ef\u7f16\u8f91\u753b\u5e03\u4f5c\u4e3a\u7528\u6237\u5de5\u4f5c\u533a\u3001\u667a\u80fd\u4f53\u5916\u90e8\u8bb0\u5fc6\u3001\u52a8\u4f5c\u7a7a\u95f4\u4e0e\u5171\u4eab\u9879\u76ee\u72b6\u6001\uff0c\u7528\u4e8e\u652f\u6301\u957f\u6d41\u7a0b\u521b\u610f\u751f\u4ea7\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/LYL1015/JarvisHub", "github_stars": 85, "hf_url": "https://huggingface.co/papers/2607.23588", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u7528\u7c7b\u578b\u5316\u753b\u5e03\u8282\u70b9\u548c\u94fe\u63a5\u8868\u793a\u591a\u6a21\u6001\u7d20\u6750\u3001\u4f9d\u8d56\u5173\u7cfb\u3001\u7248\u672c\u3001\u53cd\u9988\u4e0e\u5de5\u5177\u52a8\u4f5c", "\u91c7\u7528\u753b\u5e03\u72b6\u6001\u3001\u534f\u8bae\u6865\u3001\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u4e09\u5c42\u67b6\u6784\uff0c\u8ba9\u667a\u80fd\u4f53\u5728\u53ef\u68c0\u67e5\u3001\u53ef\u7f16\u8f91\u7684\u9879\u76ee\u72b6\u6001\u4e2d\u884c\u52a8", "\u652f\u6301\u667a\u80fd\u4f53\u6301\u7eed\u89c4\u5212\u3001\u751f\u6210\u3001\u4fee\u6539\u3001\u7ec4\u7ec7\u521b\u610f\u9879\u76ee\uff0c\u540c\u65f6\u4fdd\u7559\u4eba\u7c7b\u68c0\u67e5\u3001\u5f15\u5bfc\u548c\u5e72\u9884\u80fd\u529b"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u521b\u610f\u751f\u6210", "\u4eba\u673a\u534f\u4f5c"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.23588v1", "published_at": "2026-07-26", "score": 0.49, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (108\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23588.png", "title": "JarvisHub: An Open Harness for Canvas-Native Multimodal Creative Agents", "tldr": "\u9762\u5411\u591a\u6a21\u6001\u521b\u4f5c\u667a\u80fd\u4f53\u7684\u5f00\u6e90\u753b\u5e03\u6846\u67b6", "upvotes": 108, "what_it_is": "\u8bba\u6587\u63d0\u51fa JarvisHub\uff0c\u4e00\u4e2a\u753b\u5e03\u539f\u751f\u7684\u591a\u6a21\u6001\u521b\u4f5c\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u3002\u5b83\u5c06\u53ef\u7f16\u8f91\u753b\u5e03\u4f5c\u4e3a\u7528\u6237\u5de5\u4f5c\u533a\u3001\u667a\u80fd\u4f53\u5916\u90e8\u8bb0\u5fc6\u3001\u52a8\u4f5c\u7a7a\u95f4\u4e0e\u5171\u4eab\u9879\u76ee\u72b6\u6001\uff0c\u7528\u4e8e\u652f\u6301\u957f\u6d41\u7a0b\u521b\u610f\u751f\u4ea7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u5355\u6b21\u63d0\u793a\u751f\u6210\u8f6c\u5411\u957f\u5468\u671f\u3001\u53ef\u8ffd\u8e2a\u3001\u53ef\u5e72\u9884\u7684\u521b\u610f\u81ea\u52a8\u5316\uff0c\u4e3a\u7814\u7a76\u521b\u4f5c\u667a\u80fd\u4f53\u5982\u4f55\u7ba1\u7406\u4e0a\u4e0b\u6587\u3001\u8c03\u7528\u5de5\u5177\u3001\u4fee\u590d\u5931\u8d25\u548c\u4fdd\u6301\u4e00\u81f4\u6027\u63d0\u4f9b\u4e86\u5f00\u653e\u5b9e\u9a8c\u5e73\u53f0\u3002"}, {"abstract": "Agentic search enables large language models to solve knowledge-intensive tasks by interleaving multi-step reasoning with retrieval, yet optimizing this with outcome-based reinforcement learning (RL) provides only sparse supervision. Knowledge distillation can supply denser guidance, and advanced proprietary models with their strong reasoning capabilities are promising teachers. While distilling from proprietary models can densify this supervisory signal, conventional logit-matching is precluded by hidden logits and mismatched tokenizers, whereas raw natural language trajectory imitation transfers superficial stylistic artifacts rather than core reasoning competence. To address the heterogeneous distillation problem and bridge the distribution gap, we propose Multi-Agent Protocol Distillation (MAPD), a joint distillation and RL framework uses a structured, style-normalized protocol as an intermediate representation. An offline multi-agent system (MAS) decomposes each query, retrieves supporting evidence, repairs failed searches, and converts the resulting exploration trace into a JSON protocol containing the task type, reasoning plan, and extractive grounding facts. During training, the protocol is provided only to a privileged branch of the student policy, whose token distributions furnish a dense distillation signal alongside the sparse RL objective. Extensive evaluations across seven QA benchmarks demonstrate that MAPD consistently outperforms competitive distillation and RL, achieving average success rates of 39.4\\% on Qwen3-1.7B and 44.4\\% on Qwen3-4B. Crucially, the framework generalizes robustly across diverse proprietary teachers while effectively mitigating the student policy from style drift and verbosity degeneration.", "arxiv_id": "2607.24280", "arxiv_url": "https://arxiv.org/abs/2607.24280", "authors": ["Junlin Liu", "Jiangwang Chen", "Zixin Song", "Shuaiyu Zhou", "Chunji Lv", "Hank Wu", "Kailin Jiang", "Jinyang Wu", "Bohan Yu", "Chenxi Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Multi-Agent Protocol Distillation\uff08MAPD\uff09\uff0c\u5c06\u4e13\u6709\u6a21\u578b\u7684\u591a\u6b65\u641c\u7d22\u63a2\u7d22\u8f68\u8ff9\u8f6c\u6210\u98ce\u683c\u5f52\u4e00\u7684 JSON \u534f\u8bae\uff0c\u518d\u7528\u4e8e\u8bad\u7ec3\u5f00\u6e90\u5b66\u751f\u6a21\u578b\u3002\u8be5\u6846\u67b6\u628a\u5bc6\u96c6\u534f\u8bae\u84b8\u998f\u4fe1\u53f7\u4e0e\u7a00\u758f\u7ed3\u679c\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\uff0c\u63d0\u5347\u77e5\u8bc6\u5bc6\u96c6\u578b\u95ee\u7b54\u4e2d\u7684 agentic search \u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24280", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528\u79bb\u7ebf\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u5206\u89e3\u67e5\u8be2\u3001\u68c0\u7d22\u8bc1\u636e\u3001\u4fee\u590d\u5931\u8d25\u641c\u7d22\uff0c\u5e76\u751f\u6210\u5305\u542b\u4efb\u52a1\u7c7b\u578b\u3001\u63a8\u7406\u8ba1\u5212\u548c grounding facts \u7684\u7ed3\u6784\u5316\u534f\u8bae", "\u534f\u8bae\u53ea\u63d0\u4f9b\u7ed9\u5b66\u751f\u7b56\u7565\u7684\u7279\u6743\u5206\u652f\uff0c\u7531\u5176 token \u5206\u5e03\u5411\u4e3b\u7b56\u7565\u63d0\u4f9b\u5bc6\u96c6\u84b8\u998f\u76d1\u7763\uff0c\u907f\u514d\u4f9d\u8d56\u4e13\u6709\u6a21\u578b logits \u6216 tokenizer \u5bf9\u9f50", "\u5728 7 \u4e2a QA \u57fa\u51c6\u4e0a\u4f18\u4e8e\u5e38\u89c4\u84b8\u998f\u548c\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0cQwen3-1.7B \u4e0e Qwen3-4B \u5e73\u5747\u6210\u529f\u7387\u5206\u522b\u8fbe 39.4% \u548c 44.4%"], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24280v1", "published_at": "2026-07-27", "score": 0.466, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (71\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24280.png", "title": "From Proprietary to Open-Source: Bridging the Distribution Gap via Multi-Agent Protocol Distillation in Agentic Search", "tldr": "\u7528\u7ed3\u6784\u5316\u534f\u8bae\u84b8\u998f\u63d0\u5347\u5f00\u6e90\u667a\u80fd\u4f53\u641c\u7d22", "upvotes": 71, "what_it_is": "\u8bba\u6587\u63d0\u51fa Multi-Agent Protocol Distillation\uff08MAPD\uff09\uff0c\u5c06\u4e13\u6709\u6a21\u578b\u7684\u591a\u6b65\u641c\u7d22\u63a2\u7d22\u8f68\u8ff9\u8f6c\u6210\u98ce\u683c\u5f52\u4e00\u7684 JSON \u534f\u8bae\uff0c\u518d\u7528\u4e8e\u8bad\u7ec3\u5f00\u6e90\u5b66\u751f\u6a21\u578b\u3002\u8be5\u6846\u67b6\u628a\u5bc6\u96c6\u534f\u8bae\u84b8\u998f\u4fe1\u53f7\u4e0e\u7a00\u758f\u7ed3\u679c\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\uff0c\u63d0\u5347\u77e5\u8bc6\u5bc6\u96c6\u578b\u95ee\u7b54\u4e2d\u7684 agentic search \u80fd\u529b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u4e13\u6709\u6559\u5e08\u5230\u5f00\u6e90\u5b66\u751f\u7684\u5f02\u6784\u84b8\u998f\u96be\u9898\uff0c\u7528\u7ed3\u6784\u5316\u4e2d\u95f4\u8868\u793a\u63d0\u53d6\u6838\u5fc3\u63a8\u7406\u4e0e\u8bc1\u636e\uff0c\u800c\u975e\u6a21\u4eff\u8868\u9762\u8bed\u8a00\u98ce\u683c\uff0c\u6709\u52a9\u4e8e\u7f13\u89e3\u98ce\u683c\u6f02\u79fb\u548c\u5197\u957f\u9000\u5316\uff0c\u5bf9\u4f4e\u6210\u672c\u8bad\u7ec3\u641c\u7d22\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "In the age of foundation models, a model is only as good as its prompt. For this reason, prompt engineering has become an essential technique for improving language model performance. Since video models are currently becoming foundation models for visual tasks (e.g., visual reasoning), we here ask whether they similarly benefit from visual prompt engineering: automatically modifying the task image to improve model performance. For example, for a visual physics reasoning task (\"Where does the ball land, after passing a set of obstacles?\"), an abstract sketch-like scene can be turned into a photorealistic version with a simple call to an image editing model. We find that visual prompt engineering, or VIPE for short, improves video reasoning performance across tasks. In fact, for video models, visual prompt engineering can be even more effective than classic text-based prompt engineering or test-time scaling. Ultimately, just as text-based prompt engineering systematically improves language model performance, visual prompt engineering can serve as a simple, compute-efficient approach to elicit better visual reasoning performance from video models. Example videos on our project page at https://visual-prompt-engineering.github.io/.", "arxiv_id": "2607.25537", "arxiv_url": "https://arxiv.org/abs/2607.25537", "authors": ["Robert Geirhos", "Yuxuan Li", "Thadd\u00e4us Wiedemer", "Neha Kalibhat", "Zi Wang", "Mani Malek", "Oyvind Tafjord", "Kevin Swersky", "Been Kim", "Priyank Jaini"], "brief": "\u8bba\u6587\u63d0\u51fa Visual Prompt Engineering\uff08VIPE\uff09\uff1a\u5728\u6d4b\u8bd5\u65f6\u81ea\u52a8\u4fee\u6539\u4efb\u52a1\u56fe\u50cf/\u89c6\u9891\u7684\u89c6\u89c9\u5448\u73b0\u5f62\u5f0f\uff0c\u4ee5\u63d0\u5347\u89c6\u9891\u57fa\u7840\u6a21\u578b\u5728\u89c6\u89c9\u63a8\u7406\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5c06\u62bd\u8c61\u573a\u666f\u8f6c\u6210\u66f4\u9002\u5408\u6a21\u578b\u7406\u89e3\u7684\u89c6\u89c9\u5f62\u5f0f\uff08\u5982\u5199\u5b9e\u5316\uff09\u80fd\u663e\u8457\u6539\u5584\u89c6\u9891\u63a8\u7406\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25537", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["VIPE \u901a\u8fc7\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u5bf9\u8f93\u5165\u89c6\u89c9\u5185\u5bb9\u8fdb\u884c\u81ea\u52a8\u6539\u5199\uff0c\u800c\u4e0d\u662f\u53ea\u4f18\u5316\u6587\u672c\u63d0\u793a\u3002", "\u5728\u89c6\u89c9\u7269\u7406\u63a8\u7406\u7b49\u591a\u7c7b\u4efb\u52a1\u4e2d\uff0c\u89c6\u89c9\u63d0\u793a\u5de5\u7a0b\u80fd\u7a33\u5b9a\u63d0\u5347\u89c6\u9891\u6a21\u578b\u8868\u73b0\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u5bf9\u89c6\u9891\u6a21\u578b\u800c\u8a00\uff0cVIPE \u6709\u65f6\u6bd4\u4f20\u7edf\u6587\u672c\u63d0\u793a\u5de5\u7a0b\u6216\u6d4b\u8bd5\u65f6\u6269\u5c55\u66f4\u6709\u6548\u4e14\u66f4\u7701\u8ba1\u7b97\u3002"], "keywords": ["\u89c6\u9891\u6a21\u578b", "\u89c6\u89c9\u63a8\u7406", "\u63d0\u793a\u5de5\u7a0b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": "GoogleDeepMind", "pdf_url": "https://arxiv.org/pdf/2607.25537v1", "published_at": "2026-07-28", "score": 0.443, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.25537.png", "title": "Visual prompt engineering for video models", "tldr": "\u7528\u89c6\u89c9\u6539\u56fe\u63d0\u793a\u63d0\u5347\u89c6\u9891\u6a21\u578b\u63a8\u7406", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Visual Prompt Engineering\uff08VIPE\uff09\uff1a\u5728\u6d4b\u8bd5\u65f6\u81ea\u52a8\u4fee\u6539\u4efb\u52a1\u56fe\u50cf/\u89c6\u9891\u7684\u89c6\u89c9\u5448\u73b0\u5f62\u5f0f\uff0c\u4ee5\u63d0\u5347\u89c6\u9891\u57fa\u7840\u6a21\u578b\u5728\u89c6\u89c9\u63a8\u7406\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5c06\u62bd\u8c61\u573a\u666f\u8f6c\u6210\u66f4\u9002\u5408\u6a21\u578b\u7406\u89e3\u7684\u89c6\u89c9\u5f62\u5f0f\uff08\u5982\u5199\u5b9e\u5316\uff09\u80fd\u663e\u8457\u6539\u5584\u89c6\u9891\u63a8\u7406\u6548\u679c\u3002", "why_notable": "\u5b83\u628a\u201c\u63d0\u793a\u5de5\u7a0b\u201d\u4ece\u6587\u672c\u6269\u5c55\u5230\u89c6\u89c9\u8f93\u5165\u672c\u8eab\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u7b80\u5355\u3001\u4f4e\u6210\u672c\u7684\u65b9\u5f0f\u6765\u6fc0\u53d1\u89c6\u9891\u57fa\u7840\u6a21\u578b\u7684\u89c6\u89c9\u63a8\u7406\u80fd\u529b\uff0c\u5bf9\u591a\u6a21\u6001\u6a21\u578b\u5e94\u7528\u548c\u8bc4\u6d4b\u90fd\u6709\u542f\u53d1\u3002"}, {"abstract": "The rapid development of large language model (LLM) agents has enabled their broad adoption across diverse real-world tasks. To standardize interactions between LLM agents and external environments, Model Context Protocol (MCP) tools have emerged as a de facto standard and have been widely integrated into these systems. However, the use of MCP tools also introduces new safety risks, as LLM agents can be induced to perform malicious or unauthorized actions. Although prior work has proposed defenses for securing tool use in LLM agents, most methods rely on static analysis, i.e., inspecting prompts and generated outputs, which limits the defense effectiveness and robustness. To address these limitations, we propose MTGuard, a hybrid analysis-based defense framework designed to safeguard the use of MCP tools in LLM agents by leveraging lifecycle-aware static-dynamic co-analysis. Extensive evaluation demonstrates that MTGuard effectively mitigates multiple categories of harmful tool use across different LLM agents while maintaining performance on benign user tasks.", "arxiv_id": "2607.25297", "arxiv_url": "https://arxiv.org/abs/2607.25297", "authors": ["Ping He", "Yuexiang Xie", "Yaliang Li", "Shouling Ji"], "brief": "\u672c\u6587\u63d0\u51fa MTGuard\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53 MCP \u5de5\u5177\u8c03\u7528\u7684\u5b89\u5168\u9632\u5fa1\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u751f\u547d\u5468\u671f\u611f\u77e5\u7684\u9759\u6001-\u52a8\u6001\u8054\u5408\u5206\u6790\uff0c\u8bc6\u522b\u5e76\u963b\u6b62\u6076\u610f\u6216\u672a\u6388\u6743\u7684\u5de5\u5177\u4f7f\u7528\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25297", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9 MCP \u5de5\u5177\u6210\u4e3a\u667a\u80fd\u4f53\u5916\u90e8\u4ea4\u4e92\u4e8b\u5b9e\u6807\u51c6\u540e\u5e26\u6765\u7684\u65b0\u578b\u5b89\u5168\u98ce\u9669", "\u7a81\u7834\u4ec5\u68c0\u67e5\u63d0\u793a\u8bcd\u548c\u751f\u6210\u8f93\u51fa\u7684\u9759\u6001\u9632\u5fa1\u5c40\u9650\uff0c\u5f15\u5165\u8fd0\u884c\u671f\u52a8\u6001\u5206\u6790", "\u5b9e\u9a8c\u663e\u793a\u53ef\u7f13\u89e3\u591a\u7c7b\u6709\u5bb3\u5de5\u5177\u8c03\u7528\uff0c\u540c\u65f6\u4fdd\u6301\u826f\u6027\u4efb\u52a1\u6027\u80fd"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5b89\u5168\u9632\u62a4", "MCP"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25297v1", "published_at": "2026-07-28", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Hybrid Analysis for Secure MCP Tool Use in LLM Agents", "tldr": "MTGuard\u7528\u6df7\u5408\u5206\u6790\u4fdd\u969cLLM\u667a\u80fd\u4f53MCP\u5de5\u5177\u5b89\u5168", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa MTGuard\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53 MCP \u5de5\u5177\u8c03\u7528\u7684\u5b89\u5168\u9632\u5fa1\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u751f\u547d\u5468\u671f\u611f\u77e5\u7684\u9759\u6001-\u52a8\u6001\u8054\u5408\u5206\u6790\uff0c\u8bc6\u522b\u5e76\u963b\u6b62\u6076\u610f\u6216\u672a\u6388\u6743\u7684\u5de5\u5177\u4f7f\u7528\u3002", "why_notable": "MCP \u6b63\u5feb\u901f\u6210\u4e3a LLM \u667a\u80fd\u4f53\u8fde\u63a5\u5916\u90e8\u73af\u5883\u7684\u5173\u952e\u534f\u8bae\uff0c\u5176\u5b89\u5168\u6027\u76f4\u63a5\u5f71\u54cd\u771f\u5b9e\u90e8\u7f72\u53ef\u9760\u6027\uff1b\u8be5\u5de5\u4f5c\u4ee5\u9759\u6001-\u52a8\u6001\u6df7\u5408\u5206\u6790\u63d0\u5347\u5de5\u5177\u8c03\u7528\u9632\u62a4\u9c81\u68d2\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Long-term memory systems store what a user says in an external store and retrieve it when a related query arrives. This interface rests on an assumption so natural that it is rarely stated: a memory that is needed will resemble the query that needs it. World knowledge breaks the assumption. A tree-nut allergy should change the answer to a macaron request through their almond-flour ingredient, yet the two texts share no cue a retriever can see. We call this failure mode the implicit-association blind spot and introduce InMind, a 125-task, expert-verified benchmark spanning ten life domains, with 113 tasks grounded in citable public sources. Its paired controls separate three explanations that existing evaluations conflate: the fact was never stored, the model lacks the bridging knowledge, or the fact was stored and never surfaced. The verdict is clean. With the decisive memory placed in context, the backbone answers 84.0 percent of indirect queries; when the same memory must be retrieved, six vector, graph, and agentic memory systems reach at most 14.4 percent, even though they recall the same facts on demand at up to 100 percent. An embedding with eight times the dimensionality raises answer-blind target recall for every system yet leaves the gap essentially intact. A minimal diagnostic probe that keeps memory visible before the query arrives recovers most of the gap, locating the failure in the query-conditioned interface itself and pointing to routing, deciding which facts must stay visible, as the open problem InMind is built to score.", "arxiv_id": "2607.24368", "arxiv_url": "https://arxiv.org/abs/2607.24368", "authors": ["Ruizhe Li", "Mingxuan Du", "Benfeng Xu", "Zhendong Mao"], "brief": "\u8bba\u6587\u63d0\u51fa InMind\uff0c\u4e00\u4e2a\u5305\u542b125\u4e2a\u4e13\u5bb6\u9a8c\u8bc1\u4efb\u52a1\u7684\u957f\u671f\u8bb0\u5fc6\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u6d4b\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u80fd\u5426\u5728\u67e5\u8be2\u4e0e\u6240\u9700\u8bb0\u5fc6\u6ca1\u6709\u8868\u9762\u76f8\u4f3c\u6027\u65f6\u6b63\u786e\u8c03\u7528\u76f8\u5173\ driven benchmarks only cover narrow, fragmented domains shaped by heuristic designs. To address these limitations, PerceptionBench adopts a bottom-up approach: by diagnosing the earliest failure points in the responses of frontier MLLMs across 42 existing benchmarks, we construct an error taxonomy whose perception branch defines ten atomic perceptual capabilities. Guided by this taxonomy, we construct 3,000 verified questions with short, unambiguous answers, each isolating a single capability, with difficulty stemming from perception rather than reasoning or knowledge. Benchmark results across sixteen frontier MLLMs reveal that atomic perception remains largely unsolved---no model reaches 60\\% accuracy, perception-related hallucination is the weakest capability on average, and similar overall scores conceal sharply divergent capability profiles. PerceptionBench thus provides a capability-level standard for measuring and diagnosing the visual perception boundaries of MLLMs.", "arxiv_id": "2607.24957", "arxiv_url": "https://arxiv.org/abs/2607.24957", "authors": ["Zichao Lin", "Yifeng Xie", "Bowen Qu", "Haiming Wang", "Jia Li", "Haoning Wu", "Yuhao Dong", "Zuhao Yang", "Jinguo Zhu", "Haoyu Lu", "Zijia Zhao", "Tongtian Yue", "Zhangyang Qi", "Junwei Yang", "Mengfan Dong", "Peizhou Cao", "Chenzhuang Du", "Zaida Zhou", "Haotian Yao", "Hao Yang", "Hongcheng Gao", "Lin Sui", "Weihong Li", "Xinxing Zu", "Jia Chen", "Yao Wang", "Xiaoxue Wu", "Yalin Wang", "Y. Charles", "Yiping Bao", "Yangyang Liu", "Zhiqi Huang", "Xinyu Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa PerceptionBench\uff0c\u7528\u4e8e\u4e13\u95e8\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u539f\u5b50\u7ea7\u89c6\u89c9\u611f\u77e5\u80fd\u529b\u3002\u5b83\u4ece\u73b0\u670942\u4e2a\u57fa\u51c6\u4e2d\u8bca\u65ad\u524d\u6cbf\u6a21\u578b\u7684\u65e9\u671f\u5931\u8d25\u70b9\uff0c\u6784\u5efa\u611f\u77e5\u9519\u8bef\u5206\u7c7b\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba110\u7c7b\u539f\u5b50\u611f\u77e5\u80fd 684\u65e9\u671f\u5931\u8d25\u70b9\uff0c\u6784\u5efa\u611f\u77e5\u9519\u8bef\u5206\u7c7b\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba110\u7c7b\u539f\u5b50\u611f\u77e5\u80fd\u529b\u4e0e3000\u9053\u9a8c\u8bc1\u9898\u3002", "why_notable": "\u73b0\u6709\u591a\u6a21\u6001\u8bc4\u6d4b\u5e38\u628a\u611f\u77e5\u3001\u63a8\u7406\u548c\u77e5\u8bc6\u6df7\u5728\u4e00\u8d77\uff0c\u96be\u4ee5\u5b9a\u4f4d\u6a21\u578b\u77ed\u677f\u3002PerceptionBench\u63d0\u4f9b\u4e86\u80fd\u529b\u7c92\u5ea6\u7684\u8bca\u65ad\u6807\u51c6\uff0c\u6709\u52a9\u4e8e\u66f4\u7cbe\u786e\u8861\u91cfMLLM\u89c6\u89c9\u611f\u77e5\u8fb9\u754c\uff0c\u5e76\u6307\u5bfc\u540e\u7eed\u6a21\u578b\u6539\u8fdb\u3002"}, {"abstract": "Graphical user interface task evaluation aims to determine whether a GUI agent has successfully completed a user instruction. Automated GUI task evaluation has received increasing attention because the evaluation results can serve as reward signals for both test-time scaling and post-training. However, reliable GUI task evaluation remains challenging because the judgments often require access to environment states, such as system configurations, file data, and application settings, beyond the screenshots of execution trajectories. In this paper, we propose an interactive reward agent (IRA) based on a propose-then-verify framework to acquire and verify evidence from the post-execution environment. Given a task instruction and a GUI environment after the GUI agent execution, IRA first proposes the task completion conditions and then verifies them by invoking system tools, application tools, and GUI tools. This design combines evidence from both visible interfaces and the environment state in an interactive process. We further introduce GUI-RewardBench, a benchmark of 321 GUI task trajectories spanning 10 Ubuntu desktop application categories. Experiments show that IRA achieves 86.9% accuracy on GUI-RewardBench, outperforming existing evaluator baselines. We further apply IRA to reinforcement learning of GUI agents, achieving a 34.0% OSWorld success rate, which demonstrates that IRA can provide effective reward signals for training GUI agents.", "arxiv_id": "2607.25904", "arxiv_url": "https://arxiv.org/abs/2607.25904", "authors": ["Chenrui Shi", "Yuwei Wu", "Yang Liu", "Ruining Feng", "Zirui Shang", "Zhi Gao", "Lifeng Fan", "Che Sun"], "brief": "\u8bba\u6587\u63d0\u51fa Interactive Reward Agent\uff08IRA\uff09\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30 GUI \u667a\u80fd\u4f53\u662f\u5426\u5b8c\u6210\u7528\u6237\u6307\u4ee4\u3002\u5b83\u91c7\u7528\u201c\u5148\u63d0\u51fa\u5b8c\u6210\u6761\u4ef6\u3001\u518d\u8c03\u7528\u5de5\u5177\u9a8c\u8bc1\u201d\u7684\u6846\u67b6\uff0c\u4ece\u622a\u56fe\u4e4b\u5916\u7684\u7cfb\u7edf\u914d\u7f6e\u3001\u6587\u4ef6\u6570\u636e\u3001\u5e94\u7528\u8bbe\u7f6e\u7b49\u73af\u5883\u72b6\u6001\u4e2d\u83b7\u53d6\u8bc1\u636e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25904", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["IRA \u4f1a\u6839\u636e\u4efb\u52a1\u6307\u4ee4\u751f\u6210\u53ef\u9a8c\u8bc1\u7684\u5b8c\u6210\u6761\u4ef6\uff0c\u5e76\u5728\u6267\u884c\u540e\u7684 GUI \u73af\u5883\u4e2d\u4ea4\u4e92\u5f0f\u6838\u67e5", "\u9a8c\u8bc1\u8fc7\u7a0b\u53ef\u8c03\u7528\u7cfb\u7edf\u5de5\u5177\u3001\u5e94\u7528\u5de5\u5177\u548c GUI \u5de5\u5177\uff0c\u7ed3\u5408\u53ef\u89c1\u754c\u9762\u4e0e\u5e95\u5c42\u73af\u5883\u72b6\u6001", "\u63d0\u51fa GUI-RewardBench\uff0c\u5305\u542b 321 \u6761 Ubuntu \u684c\u9762 GUI \u4efb\u52a1\u8f68\u8ff9\uff0c\u8986\u76d6 10 \u7c7b\u5e94\u7528\uff1bIRA \u51c6\u786e\u7387\u8fbe 86.9%", "\u5c06 IRA \u7528\u4f5c\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u4fe1\u53f7\u540e\uff0cGUI \u667a\u80fd\u4f53\u5728 OSWorld \u4e0a\u8fbe\u5230 34.0% \u6210\u529f\u7387"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u5956\u52b1\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25904v1", "published_at": "2026-07-28", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Interactive Reward Agent: GUI Task Evaluation via Environment-State Verification", "tldr": "\u7528\u73af\u5883\u72b6\u6001\u9a8c\u8bc1GUI\u4efb\u52a1\u5b8c\u6210\u60c5\u51b5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Interactive Reward Agent\uff08IRA\uff09\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30 GUI \u667a\u80fd\u4f53\u662f\u5426\u5b8c\u6210\u7528\u6237\u6307\u4ee4\u3002\u5b83\u91c7\u7528\u201c\u5148\u63d0\u51fa\u5b8c\u6210\u6761\u4ef6\u3001\u518d\u8c03\u7528\u5de5\u5177\u9a8c\u8bc1\u201d\u7684\u6846\u67b6\uff0c\u4ece\u622a\u56fe\u4e4b\u5916\u7684\u7cfb\u7edf\u914d\u7f6e\u3001\u6587\u4ef6\u6570\u636e\u3001\u5e94\u7528\u8bbe\u7f6e\u7b49\u73af\u5883\u72b6\u6001\u4e2d\u83b7\u53d6\u8bc1\u636e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u89e3\u51b3\u4e86 GUI \u4efb\u52a1\u8bc4\u4f30\u4e2d\u8fc7\u5ea6\u4f9d\u8d56\u622a\u56fe\u3001\u96be\u4ee5\u5224\u65ad\u9690\u85cf\u72b6\u6001\u7684\u95ee\u9898\uff0c\u5e76\u5c55\u793a\u4e86\u8bc4\u4f30\u5668\u53ef\u76f4\u63a5\u4f5c\u4e3a\u5956\u52b1\u6a21\u578b\u652f\u6301 GUI \u667a\u80fd\u4f53\u8bad\u7ec3\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model agents often spend substantial wall-clock time waiting for tool call results. Tool-call speculation can hide this latency by predicting and pre-executing an agent\u0027s next tool call if the prediction matches the agent\u0027s eventual tool call, but existing speculators are typically separate draft models or cached traces that are poorly aligned with the deployed agent\u0027s own behavior. We identify this speculator-agent gap and show that the target agent itself is a strong next-call speculator. This points to a simpler design: unifying the agent and speculator within the same model. In this paper, we introduce the self-speculating agent, a single model that both solves tasks in agent mode and predicts its next tool call from partial trajectories in speculator mode, fully reusing prefix KV cache. To enable this dual-mode agent without degrading performance, we propose a joint agent-speculator reinforcement learning method, which derives speculation targets from the agent\u0027s own rollouts and alternates agent and speculator updates. Across agentic search QA and conversational tool-use agentic tasks, our method improves average next tool-call Hit@1 from 44.1 to 61.2 for Qwen3-4B and from 48.9 to 66.3 for Qwen3.5-4B, while preserving agent task success.", "arxiv_id": "2607.25816", "arxiv_url": "https://arxiv.org/abs/2607.25816", "authors": ["Jiabao Ji", "Yujian Liu", "Li An", "Rohit Jain", "Gungor Polatkan", "Siyu Zhu", "Shiyu Chang"], "brief": "\u8bba\u6587\u63d0\u51fa\u81ea\u6211\u63a8\u6d4b\u667a\u80fd\u4f53\uff1a\u540c\u4e00\u4e2a\u5927\u6a21\u578b\u65e2\u6267\u884c\u4efb\u52a1\uff0c\u4e5f\u5728\u63a8\u6d4b\u6a21\u5f0f\u4e0b\u57fa\u4e8e\u90e8\u5206\u8f68\u8ff9\u9884\u6d4b\u4e0b\u4e00\u6b21\u5de5\u5177\u8c03\u7528\u3002\u4e3a\u8bad\u7ec3\u8fd9\u79cd\u53cc\u6a21\u5f0f\u80fd\u529b\uff0c\u4f5c\u8005\u8bbe\u8ba1\u4e86\u8054\u5408\u667a\u80fd\u4f53-\u63a8\u6d4b\u5668\u5f3a\u5316\u5b66\u4e60\uff0c\u7528\u667a\u80fd\u4f53\u81ea\u8eab rollout \u751f\u6210\u63a8\u6d4b\u76ee\u6807\u5e76\u4ea4\u66ff\u4f18\u5316\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25816", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u73b0\u6709\u72ec\u7acb\u63a8\u6d4b\u6a21\u578b\u6216\u7f13\u5b58\u8f68\u8ff9\u4e0e\u771f\u5b9e\u90e8\u7f72\u667a\u80fd\u4f53\u884c\u4e3a\u4e0d\u4e00\u81f4\uff0c\u5b58\u5728\u201c\u63a8\u6d4b\u5668-\u667a\u80fd\u4f53\u9e3f\u6c9f\u201d\u3002", "\u7edf\u4e00 agent \u4e0e speculator \u4e8e\u5355\u4e00\u6a21\u578b\uff0c\u5e76\u590d\u7528\u524d\u7f00 KV cache\uff0c\u4ee5\u51cf\u5c11\u7b49\u5f85\u5de5\u5177\u8fd4\u56de\u7684\u5899\u949f\u65f6\u95f4\u3002", "\u5728\u641c\u7d22\u95ee\u7b54\u548c\u5bf9\u8bdd\u5f0f\u5de5\u5177\u4f7f\u7528\u4efb\u52a1\u4e2d\uff0cQwen3-4B \u7684\u4e0b\u4e00\u5de5\u5177\u8c03\u7528 Hit@1 \u4ece 44.1 \u63d0\u5347\u5230 61.2\uff0cQwen3.5-4B \u4ece 48.9 \u63d0\u5347\u5230 66.3\uff0c\u4e14\u4fdd\u6301\u4efb\u52a1\u6210\u529f\u7387\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u6d4b\u6267\u884c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25816v1", "published_at": "2026-07-28", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Speculate While You Reason: Teaching Agents to Predict Their Next Tool Call via Joint Agent-Speculator RL", "tldr": "\u8ba9\u667a\u80fd\u4f53\u8fb9\u63a8\u7406\u8fb9\u9884\u6d4b\u4e0b\u4e00\u6b21\u5de5\u5177\u8c03\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u81ea\u6211\u63a8\u6d4b\u667a\u80fd\u4f53\uff1a\u540c\u4e00\u4e2a\u5927\u6a21\u578b\u65e2\u6267\u884c\u4efb\u52a1\uff0c\u4e5f\u5728\u63a8\u6d4b\u6a21\u5f0f\u4e0b\u57fa\u4e8e\u90e8\u5206\u8f68\u8ff9\u9884\u6d4b\u4e0b\u4e00\u6b21\u5de5\u5177\u8c03\u7528\u3002\u4e3a\u8bad\u7ec3\u8fd9\u79cd\u53cc\u6a21\u5f0f\u80fd\u529b\uff0c\u4f5c\u8005\u8bbe\u8ba1\u4e86\u8054\u5408\u667a\u80fd\u4f53-\u63a8\u6d4b\u5668\u5f3a\u5316\u5b66\u4e60\uff0c\u7528\u667a\u80fd\u4f53\u81ea\u8eab rollout \u751f\u6210\u63a8\u6d4b\u76ee\u6807\u5e76\u4ea4\u66ff\u4f18\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5de5\u5177\u8c03\u7528\u5ef6\u8fdf\u4f18\u5316\u4ece\u5916\u7f6e\u8349\u7a3f\u6a21\u578b\u8f6c\u5411\u667a\u80fd\u4f53\u81ea\u6211\u63a8\u6d4b\uff0c\u7ed3\u6784\u66f4\u7b80\u5355\u4e14\u66f4\u8d34\u5408\u5b9e\u9645\u884c\u4e3a\uff1b\u82e5\u53ef\u6269\u5c55\u5230\u771f\u5b9e\u5de5\u5177\u94fe\uff0c\u53ef\u663e\u8457\u63d0\u5347 LLM agent \u7684\u4ea4\u4e92\u6548\u7387\u4e0e\u90e8\u7f72\u4f53\u9a8c\u3002"}, {"abstract": "Large language model (LLM) agents increasingly rely on invoking external tools to complete real-world tasks. Tool retrieval, which selects a small task-relevant subset from a library of thousands of tools before the agent acts, has therefore become a critical component of LLM agent pipelines. However, existing retrievers either score each tool in isolation or assemble the tool set sequentially, so the joint utility of a candidate set is never evaluated as a whole. In this paper, we propose HYSET, short for HYperedge-based SEt-level Tool retrieval. Our contributions are threefold: (i) we formulate tool retrieval as query-conditioned hyperedge prediction on a tool co-invocation hypergraph, under which the tool set itself becomes the unit of scoring and most existing retrieval paradigms reduce to restricted instances; (ii) we capture size-dependent tool compatibility through cardinality-specific interactions; and (iii) we design HYSET as a pre-selection module requiring no modification to the downstream agent. Experiments on ToolBench demonstrate that HYSET consistently outperforms state-of-the-art baselines in both tool retrieval performance and end-to-end task success. Beyond the in-domain setting, HYSET further supports zero-shot/few-shot transfer, generalizing to held-out tools/categories and unseen domains with minimal supervision.", "arxiv_id": "2607.25718", "arxiv_url": "https://arxiv.org/abs/2607.25718", "authors": ["Xinyi Hong", "Pinjun Dong", "Xinyang Yu", "Binyan Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa HYSET\uff0c\u5c06 LLM \u667a\u80fd\u4f53\u7684\u5de5\u5177\u68c0\u7d22\u5efa\u6a21\u4e3a\u67e5\u8be2\u6761\u4ef6\u4e0b\u7684\u5de5\u5177\u5171\u8c03\u7528\u8d85\u56fe\u8d85\u8fb9\u9884\u6d4b\uff0c\u76f4\u63a5\u5bf9\u5019\u9009\u5de5\u5177\u96c6\u5408\u6574\u4f53\u6253\u5206\uff0c\u800c\u975e\u9010\u4e2a\u5de5\u5177\u6216\u987a\u5e8f\u62fc\u88c5\u3002\u8be5\u65b9\u6cd5\u4f5c\u4e3a\u9884\u9009\u62e9\u6a21\u5757\u63a5\u5165\u73b0\u6709\u667a\u80fd\u4f53\uff0c\u65e0\u9700\u4fee\u6539\u4e0b\u6e38\u6267\u884c\u6d41\u7a0b\u3002", "categories": ["cs.LG", "cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25718", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u628a\u5de5\u5177\u96c6\u5408\u89c6\u4e3a\u8bc4\u5206\u5355\u5143\uff0c\u7edf\u4e00\u5e76\u63a8\u5e7f\u4e86\u72ec\u7acb\u6253\u5206\u3001\u987a\u5e8f\u9009\u62e9\u7b49\u73b0\u6709\u5de5\u5177\u68c0\u7d22\u8303\u5f0f\u3002", "\u5f15\u5165\u4e0e\u96c6\u5408\u5927\u5c0f\u76f8\u5173\u7684\u5de5\u5177\u517c\u5bb9\u6027\u4ea4\u4e92\u5efa\u6a21\uff0c\u66f4\u597d\u6355\u6349\u4e0d\u540c\u6570\u91cf\u5de5\u5177\u4e4b\u95f4\u7684\u534f\u540c\u5173\u7cfb\u3002", "\u5728 ToolBench \u4e0a\u63d0\u5347\u5de5\u5177\u68c0\u7d22\u6027\u80fd\u548c\u7aef\u5230\u7aef\u4efb\u52a1\u6210\u529f\u7387\uff0c\u5e76\u652f\u6301\u5bf9\u672a\u89c1\u5de5\u5177\u3001\u7c7b\u522b\u548c\u9886\u57df\u7684\u96f6\u6837\u672c/\u5c11\u6837\u672c\u8fc1\u79fb\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u4fe1\u606f\u68c0\u7d22", "\u56fe\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25718v1", "published_at": "2026-07-28", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Tools Are Not Islands: Set-Level Tool Retrieval for LLM Agents via Query-Conditioned Hyperedge Prediction", "tldr": "\u7528\u8d85\u8fb9\u9884\u6d4b\u6574\u4f53\u68c0\u7d22\u5de5\u5177\u96c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HYSET\uff0c\u5c06 LLM \u667a\u80fd\u4f53\u7684\u5de5\u5177\u68c0\u7d22\u5efa\u6a21\u4e3a\u67e5\u8be2\u6761\u4ef6\u4e0b\u7684\u5de5\u5177\u5171\u8c03\u7528\u8d85\u56fe\u8d85\u8fb9\u9884\u6d4b\uff0c\u76f4\u63a5\u5bf9\u5019\u9009\u5de5\u5177\u96c6\u5408\u6574\u4f53\u6253\u5206\uff0c\u800c\u975e\u9010\u4e2a\u5de5\u5177\u6216\u987a\u5e8f\u62fc\u88c5\u3002\u8be5\u65b9\u6cd5\u4f5c\u4e3a\u9884\u9009\u62e9\u6a21\u5757\u63a5\u5165\u73b0\u6709\u667a\u80fd\u4f53\uff0c\u65e0\u9700\u4fee\u6539\u4e0b\u6e38\u6267\u884c\u6d41\u7a0b\u3002", "why_notable": "\u5de5\u5177\u68c0\u7d22\u662f\u5927\u89c4\u6a21 LLM \u667a\u80fd\u4f53\u843d\u5730\u7684\u5173\u952e\u74f6\u9888\u3002HYSET \u4ece\u201c\u5355\u5de5\u5177\u76f8\u5173\u6027\u201d\u8f6c\u5411\u201c\u5de5\u5177\u96c6\u8054\u5408\u6548\u7528\u201d\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u4efb\u52a1\u4e2d\u5de5\u5177\u534f\u540c\u8c03\u7528\u9700\u6c42\uff0c\u4e14\u53ef\u65e0\u4fb5\u5165\u96c6\u6210\u5230\u73b0\u6709\u667a\u80fd\u4f53\u7ba1\u7ebf\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Language-model agents are increasingly deployed under standing instructions: a system prompt, a policy file, or a skills document is placed in context, and the agent is trusted to let it govern every action that follows. Existing benchmarks rarely test this deployment pattern directly; they measure whether an agent can complete a task, not whether a long, binding policy document actually constrains its behavior over an extended tool-use horizon. We present HANDBOOK.md, a benchmark of 65 agentic tasks modeled on how enterprise employees follow company handbooks. Each task places an agent in a self-contained company environment, a file workspace together with mock email, chat, calendar, issue-tracking, and commerce services exposed over the Model Context Protocol, and instructs it to carry out routine professional work governed by an expert-written standard operating procedure of 20 to 124 pages. Tasks span five domains (finance, medical billing, insurance, logistics, and HR) and ten fictional companies. To resist memorization, every task modifies one of ten base handbooks, altering the specific rules and thresholds on which grading turns, so no two tasks share a policy. Grading is fully deterministic: each task carries a rubric of programmatic criteria (824 in total) that check both that required actions occurred and that prohibited actions did not. Under strict grading, where a trial passes only if every criterion is satisfied, the best of thirty evaluated model configurations passes 36.2% of trials, and most frontier configurations remain below 25%. Failures follow consistent patterns: agents let a plausible in-environment request override the standing policy, perform a required check and then act against its result, lose rule details over long horizons, and report compliance they did not achieve. We release all tasks, environments, and the evaluation harness.", "arxiv_id": "2607.25398", "arxiv_url": "https://arxiv.org/abs/2607.25398", "authors": ["Liudas Panavas", "Sebastian Minus", "Bradley Monton", "Derek Ray", "Suhaas Garre", "Sushant Mehta", "Edwin Chen"], "brief": "\u8bba\u6587\u63d0\u51fa HANDBOOK.md\uff0c\u4e00\u4e2a\u8bc4\u6d4b\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u80fd\u5426\u5728\u957f\u7bc7\u4f01\u4e1a\u653f\u7b56/\u64cd\u4f5c\u624b\u518c\u7ea6\u675f\u4e0b\u6301\u7eed\u6267\u884c\u5de5\u5177\u4efb\u52a1\u7684\u57fa\u51c6\u3002\u5b83\u5305\u542b65\u4e2a\u4efb\u52a1\u30015\u4e2a\u4e1a\u52a1\u9886\u57df\u548c\u5b8c\u6574\u6a21\u62df\u4f01\u4e1a\u73af\u5883\uff0c\u5e76\u7528\u7a0b\u5e8f\u5316\u89c4\u5219\u786e\u5b9a\u6027\u8bc4\u5206\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25398", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6bcf\u4e2a\u4efb\u52a1\u63d0\u4f9b20\u5230124\u9875\u4e13\u5bb6\u7f16\u5199\u7684\u6807\u51c6\u64cd\u4f5c\u6d41\u7a0b\uff0c\u8986\u76d6\u8d22\u52a1\u3001\u533b\u7597\u8d26\u5355\u3001\u4fdd\u9669\u3001\u7269\u6d41\u548c\u4eba\u529b\u8d44\u6e90\u7b49\u573a\u666f\u3002", "\u73af\u5883\u5305\u542b\u6587\u4ef6\u5de5\u4f5c\u533a\u4ee5\u53ca\u90ae\u4ef6\u3001\u804a\u5929\u3001\u65e5\u5386\u3001\u5de5\u5355\u3001\u5546\u52a1\u670d\u52a1\u7b49\u5de5\u5177\u63a5\u53e3\uff0c\u6a21\u62df\u771f\u5b9e\u4f01\u4e1a\u5de5\u4f5c\u6d41\u3002", "\u5171824\u6761\u7a0b\u5e8f\u5316\u8bc4\u5206\u6807\u51c6\uff0c\u540c\u65f6\u68c0\u67e5\u5fc5\u987b\u6267\u884c\u7684\u52a8\u4f5c\u548c\u7981\u6b62\u6267\u884c\u7684\u52a8\u4f5c\uff1b\u6700\u4f73\u6a21\u578b\u4e25\u683c\u901a\u8fc7\u7387\u4ec536.2%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u4e0a\u4e0b\u6587", "\u6307\u4ee4\u9075\u5faa", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25398v1", "published_at": "2026-07-28", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HANDBOOK.md: A Benchmark for Long-Context Agentic Instruction Following", "tldr": "\u957f\u4e0a\u4e0b\u6587\u4f01\u4e1a\u624b\u518c\u7ea6\u675f\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HANDBOOK.md\uff0c\u4e00\u4e2a\u8bc4\u6d4b\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u80fd\u5426\u5728\u957f\u7bc7\u4f01\u4e1a\u653f\u7b56/\u64cd\u4f5c\u624b\u518c\u7ea6\u675f\u4e0b\u6301\u7eed\u6267\u884c\u5de5\u5177\u4efb\u52a1\u7684\u57fa\u51c6\u3002\u5b83\u5305\u542b65\u4e2a\u4efb\u52a1\u30015\u4e2a\u4e1a\u52a1\u9886\u57df\u548c\u5b8c\u6574\u6a21\u62df\u4f01\u4e1a\u73af\u5883\uff0c\u5e76\u7528\u7a0b\u5e8f\u5316\u89c4\u5219\u786e\u5b9a\u6027\u8bc4\u5206\u3002", "why_notable": "\u8be5\u57fa\u51c6\u76f4\u63a5\u6d4b\u8bd5\u201c\u957f\u671f\u5e38\u9a7b\u6307\u4ee4\u662f\u5426\u771f\u6b63\u7ea6\u675f\u667a\u80fd\u4f53\u884c\u4e3a\u201d\u8fd9\u4e00\u5b9e\u9645\u90e8\u7f72\u75db\u70b9\uff0c\u63ed\u793a\u524d\u6cbf\u6a21\u578b\u5728\u957f\u4e0a\u4e0b\u6587\u89c4\u5219\u4fdd\u6301\u3001\u51b2\u7a81\u6307\u4ee4\u62b5\u6297\u548c\u5408\u89c4\u6267\u884c\u4e0a\u7684\u660e\u663e\u4e0d\u8db3\uff0c\u5bf9\u4f01\u4e1a\u7ea7\u667a\u80fd\u4f53\u5b89\u5168\u8bc4\u6d4b\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "Robotic learning takes place in dynamic environments with large behavior spaces. A terminal success signal only tells the robot whether the task is completed. It does not explain whether the current behavior is making progress, remaining unchanged, or undoing earlier progress. For this reason, recent studies have increasingly explored progress rewards that provide feedback during task execution. However, the current literature lacks a shared framework. Existing methods use different observations, goal specifications, output signals, supervision sources, and evaluation protocols. This makes it difficult to compare them and understand what their results actually validate. In this survey, we provide a unified view of progress reward modeling for robotic learning. We organize the field in three connected steps. We first study the interface of a progress model. This defines the problem from the outside by asking what information the model receives and what form of progress signal it produces. We then move inside the model and study the methods used to construct this signal. This reveals the different assumptions and mechanisms behind progress estimation and reward generation. Finally, we examine the data and benchmarks that support these methods. This shows how progress supervision is obtained and what different evaluations actually measure. Together, these three perspectives connect what a progress model is, how it is built, and how its quality is validated. We further summarize the main limitations of current approaches and discuss future research directions.", "arxiv_id": "2607.21655", "arxiv_url": "https://arxiv.org/abs/2607.21655", "authors": ["Jianshu Zhang", "Keliang Wu", "Haoran Lu", "Anbang Liu", "Ce Zhang", "Weijie Yin", "Chengxuan Qian", "Xiyuan Yang", "Zhenyu Pan", "Guo Ye", "Han Liu"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e\u673a\u5668\u4eba\u5b66\u4e60\u4e2d\u8fdb\u5c55\u5956\u52b1\u5efa\u6a21\u7684\u7efc\u8ff0\uff0c\u65e8\u5728\u7edf\u4e00\u7406\u89e3\u201c\u4efb\u52a1\u6267\u884c\u8fc7\u7a0b\u4e2d\u662f\u5426\u5728\u53d6\u5f97\u8fdb\u5c55\u201d\u7684\u4e2d\u95f4\u53cd\u9988\u4fe1\u53f7\u3002\u8bba\u6587\u4ece\u6a21\u578b\u63a5\u53e3\u3001\u4fe1\u53f7\u6784\u5efa\u65b9\u6cd5\u3001\u6570\u636e\u4e0e\u8bc4\u6d4b\u57fa\u51c6\u4e09\u65b9\u9762\u6574\u7406\u73b0\u6709\u7814\u7a76\u3002", "categories": ["cs.RO", "cs.CL"], "github_repo": "https://github.com/sterzhang/Awesome-Progress-Models", "github_stars": 46, "hf_url": "https://huggingface.co/papers/2607.21655", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u8fdb\u5c55\u5956\u52b1\u6a21\u578b\u62c6\u89e3\u4e3a\u4e09\u4e2a\u5c42\u9762\uff1a\u8f93\u5165/\u8f93\u51fa\u63a5\u53e3\u3001\u5185\u90e8\u5efa\u6a21\u65b9\u6cd5\u3001\u76d1\u7763\u6570\u636e\u4e0e\u8bc4\u6d4b\u534f\u8bae", "\u6bd4\u8f83\u4e0d\u540c\u65b9\u6cd5\u4f7f\u7528\u7684\u89c2\u6d4b\u4fe1\u606f\u3001\u76ee\u6807\u8868\u793a\u3001\u8fdb\u5c55\u4fe1\u53f7\u5f62\u5f0f\u548c\u76d1\u7763\u6765\u6e90\uff0c\u6307\u51fa\u5f53\u524d\u9886\u57df\u7f3a\u4e4f\u7edf\u4e00\u6846\u67b6", "\u603b\u7ed3\u73b0\u6709\u8fdb\u5c55\u5956\u52b1\u5728\u53ef\u6bd4\u6027\u3001\u6cdb\u5316\u6027\u3001\u6807\u6ce8\u83b7\u53d6\u548c\u8bc4\u6d4b\u6709\u6548\u6027\u65b9\u9762\u7684\u5c40\u9650\uff0c\u5e76\u8ba8\u8bba\u672a\u6765\u65b9\u5411"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u5956\u52b1\u5efa\u6a21", "\u5f3a\u5316\u5b66\u4e60", "\u7efc\u8ff0"], "num_comments": 3, "on_hf": true, "organization": "Northwestern University", "pdf_url": "https://arxiv.org/pdf/2607.21655v1", "published_at": "2026-07-22", "score": 0.332, "selected_reasons": ["HF trending (82\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.21655.png", "title": "Progress Reward Modeling for Robotic Learning: A Comprehensive Survey", "tldr": "\u7cfb\u7edf\u68b3\u7406\u673a\u5668\u4eba\u5b66\u4e60\u4e2d\u7684\u8fdb\u5c55\u5956\u52b1\u5efa\u6a21", "upvotes": 82, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e\u673a\u5668\u4eba\u5b66\u4e60\u4e2d\u8fdb\u5c55\u5956\u52b1\u5efa\u6a21\u7684\u7efc\u8ff0\uff0c\u65e8\u5728\u7edf\u4e00\u7406\u89e3\u201c\u4efb\u52a1\u6267\u884c\u8fc7\u7a0b\u4e2d\u662f\u5426\u5728\u53d6\u5f97\u8fdb\u5c55\u201d\u7684\u4e2d\u95f4\u53cd\u9988\u4fe1\u53f7\u3002\u8bba\u6587\u4ece\u6a21\u578b\u63a5\u53e3\u3001\u4fe1\u53f7\u6784\u5efa\u65b9\u6cd5\u3001\u6570\u636e\u4e0e\u8bc4\u6d4b\u57fa\u51c6\u4e09\u65b9\u9762\u6574\u7406\u73b0\u6709\u7814\u7a76\u3002", "why_notable": "\u673a\u5668\u4eba\u4efb\u52a1\u901a\u5e38\u53ea\u6709\u7a00\u758f\u7684\u7ec8\u6b62\u6210\u529f\u4fe1\u53f7\uff0c\u96be\u4ee5\u6307\u5bfc\u590d\u6742\u957f\u7a0b\u884c\u4e3a\u5b66\u4e60\uff1b\u8fdb\u5c55\u5956\u52b1\u53ef\u63d0\u4f9b\u66f4\u5bc6\u96c6\u3001\u66f4\u53ef\u89e3\u91ca\u7684\u8bad\u7ec3\u53cd\u9988\u3002\u8be5\u7efc\u8ff0\u4e3a\u5206\u6563\u7684\u7814\u7a76\u5efa\u7acb\u7edf\u4e00\u5206\u7c7b\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u540e\u7eed\u65b9\u6cd5\u8bbe\u8ba1\u4e0e\u57fa\u51c6\u8bc4\u6d4b\u6807\u51c6\u5316\u3002"}, {"abstract": "Memory is essential for LLM agents to accumulate task experience and reuse task-specific execution strategies. However, real-world deployment over boundary-agnostic and evolving task streams exposes a fundamental stability-plasticity dilemma. External retrieval-based memory can rapidly absorb new evidence, but it often fails to internalize recurring execution patterns and incurs inference-time retrieval overhead. Parametric memory enables stable and efficient execution once learned, but typically relies on explicit task boundaries and fixed parameter budgets. Inspired by the human brain, which balances plasticity and stability through complementary episodic storage and gradual consolidation, we propose UniMem, a self-routing framework for autonomous memory management. UniMem uses learnable routing tokens as memory controllers, enabling adaptive coordination between complementary memory pathways: novel or sparse tasks are retained in an episodic buffer for retrieval-augmented execution, while recurring and reliable patterns are consolidated into expandable parametric memory. By decoupling task identification from task execution with routing tokens and parametric memory blocks, UniMem expands memory on demand without task labels during deployment or uncontrolled parameter growth. Experiments on long-horizon streaming task sequences show that UniMem consistently outperforms baselines while maintaining execution fidelity, achieving an average gain of 4.0 EM points across three backbone models.", "arxiv_id": "2607.26017", "arxiv_url": "https://arxiv.org/abs/2607.26017", "authors": ["Siyu Xia", "Chenheng Zhang", "Yanting Wu", "Haoxuan Li", "Jiajun Chai", "Xiaohan Wang", "Guojun Yin", "Wei Lin", "Zhouchen Lin", "Haifeng Zhang", "Jun Wang"], "brief": "\u8bba\u6587\u63d0\u51fa UniMem\uff0c\u4e00\u79cd\u9762\u5411\u65e0\u663e\u5f0f\u8fb9\u754c\u3001\u6301\u7eed\u6f14\u5316\u4efb\u52a1\u6d41\u7684\u81ea\u4e3b\u8bb0\u5fc6\u7ba1\u7406\u6846\u67b6\u3002\u5b83\u7528\u53ef\u5b66\u4e60\u8def\u7531 token \u534f\u8c03\u60c5\u666f\u8bb0\u5fc6\u4e0e\u53ef\u6269\u5c55\u53c2\u6570\u8bb0\u5fc6\uff1a\u65b0\u9896\u6216\u7a00\u758f\u4efb\u52a1\u8d70\u68c0\u7d22\u589e\u5f3a\uff0c\u53cd\u590d\u51fa\u73b0\u7684\u53ef\u9760\u6a21\u5f0f\u9010\u6b65\u56fa\u5316\u5230\u53c2\u6570\u4e2d\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26017", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u8def\u7531 token \u5c06\u4efb\u52a1\u8bc6\u522b\u4e0e\u4efb\u52a1\u6267\u884c\u89e3\u8026\uff0c\u65e0\u9700\u90e8\u7f72\u65f6\u4efb\u52a1\u6807\u7b7e\u5373\u53ef\u51b3\u5b9a\u4f7f\u7528\u60c5\u666f\u7f13\u51b2\u533a\u6216\u53c2\u6570\u8bb0\u5fc6\u5757\u3002", "\u60c5\u666f\u8bb0\u5fc6\u5feb\u901f\u5438\u6536\u65b0\u8bc1\u636e\uff0c\u53c2\u6570\u8bb0\u5fc6\u6309\u9700\u6269\u5c55\u5e76\u5de9\u56fa\u9ad8\u9891\u6267\u884c\u7b56\u7565\uff0c\u7f13\u89e3\u7a33\u5b9a\u6027-\u53ef\u5851\u6027\u77db\u76fe\u3002", "\u5728\u957f\u7a0b\u6d41\u5f0f\u4efb\u52a1\u5e8f\u5217\u4e0a\uff0cUniMem \u8de8\u4e09\u4e2a\u9aa8\u5e72\u6a21\u578b\u5e73\u5747\u63d0\u5347 4.0 \u4e2a EM \u70b9\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u6267\u884c\u4fdd\u771f\u5ea6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u6301\u7eed\u5b66\u4e60", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26017v1", "published_at": "2026-07-28", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "UniMem: Complementary Episodic-to-Parametric Memory for Boundary-Agnostic Task Streams", "tldr": "\u81ea\u8def\u7531\u4e92\u8865\u8bb0\u5fc6\u63d0\u5347\u6d41\u5f0f\u4efb\u52a1\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa UniMem\uff0c\u4e00\u79cd\u9762\u5411\u65e0\u663e\u5f0f\u8fb9\u754c\u3001\u6301\u7eed\u6f14\u5316\u4efb\u52a1\u6d41\u7684\u81ea\u4e3b\u8bb0\u5fc6\u7ba1\u7406\u6846\u67b6\u3002\u5b83\u7528\u53ef\u5b66\u4e60\u8def\u7531 token \u534f\u8c03\u60c5\u666f\u8bb0\u5fc6\u4e0e\u53ef\u6269\u5c55\u53c2\u6570\u8bb0\u5fc6\uff1a\u65b0\u9896\u6216\u7a00\u758f\u4efb\u52a1\u8d70\u68c0\u7d22\u589e\u5f3a\uff0c\u53cd\u590d\u51fa\u73b0\u7684\u53ef\u9760\u6a21\u5f0f\u9010\u6b65\u56fa\u5316\u5230\u53c2\u6570\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 LLM \u667a\u80fd\u4f53\u957f\u671f\u90e8\u7f72\u4e2d\u7684\u6838\u5fc3\u96be\u9898\uff1a\u5982\u4f55\u5728\u672a\u77e5\u4efb\u52a1\u8fb9\u754c\u4e0b\u6301\u7eed\u5b66\u4e60\u3001\u590d\u7528\u7ecf\u9a8c\u4e14\u4e0d\u9020\u6210\u68c0\u7d22\u5f00\u9500\u6216\u53c2\u6570\u65e0\u63a7\u589e\u957f\u3002\u5176\u4e92\u8865\u8bb0\u5fc6\u4e0e\u81ea\u8def\u7531\u8bbe\u8ba1\u5177\u5907\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\uff0c\u53ef\u7528\u4e8e\u66f4\u7a33\u5b9a\u7684\u957f\u671f\u4efb\u52a1\u6267\u884c\u667a\u80fd\u4f53\u3002"}, {"abstract": "Computer-use agents are usually improved by strengthening perception: better models for reading a screenshot and choosing where to click. Yet a screenshot is only a lossy rendering of the underlying program state, e.g., the files, application backends, and DOM that hold the task data. Different states can produce the same pixels, while code can inspect and modify that state directly. StateAct is a code-first, multi-agent harness built around this distinction. Its main agent works directly with program state by using code, while a dedicated GUI subagent handles screenshot-and-click interaction on the few subgoals that need it, just 28 of 108 tasks and 1.1% of main-agent steps. The same direct access to program state also supports verification: an independent finish gate double-checks the saved result for structural failures, e.g., output that is missing, unsaved, or written to the wrong path. To stay on track over hundreds of steps, the main agent hands subgoals to fresh subagents, keeping its own context focused. On OSWorld 2.0, StateAct lifts Claude Opus 4.8 from 20.6% to 26.9% on binary success, and from 54.8% to 61.6% on partial success, at ~ 9x lower cost per task than the same model driven by screenshots alone; a code-only variant with no GUI subagent reaches only 45.9% partial, below that screenshot-based baseline\u0027s 54.8%. In general, grounding action, verification, and memory in state, what we call state-grounding, shifts the main bottleneck from perception toward reasoning: failures depend more on what the agent thinks than on what it sees.", "arxiv_id": "2607.22798", "arxiv_url": "https://arxiv.org/abs/2607.22798", "authors": ["Yan Yang", "Xiangru Jian", "Ziyang Luo", "Zirui Zhao", "Yutong Dai", "Ziji Shi", "Hanshu Yan", "Jun Hao Liew", "Silvio Savarese", "Junnan Li"], "brief": "\u8bba\u6587\u63d0\u51fa StateAct\uff0c\u4e00\u4e2a\u4ee3\u7801\u4f18\u5148\u7684\u591a\u667a\u80fd\u4f53\u7535\u8111\u4f7f\u7528\u6846\u67b6\uff1a\u4e3b\u667a\u80fd\u4f53\u76f4\u63a5\u8bfb\u5199\u7a0b\u5e8f\u72b6\u6001\uff0c\u53ea\u6709\u5fc5\u8981\u5b50\u4efb\u52a1\u4ea4\u7ed9 GUI \u5b50\u667a\u80fd\u4f53\u70b9\u51fb\u64cd\u4f5c\u3002\u540c\u65f6\u5f15\u5165\u72ec\u7acb\u5b8c\u6210\u95e8\u68c0\u67e5\u8f93\u51fa\u8def\u5f84\u3001\u4fdd\u5b58\u72b6\u6001\u7b49\u7ed3\u6784\u6027\u9519\u8bef\u3002", "categories": ["cs.SE", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22798", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5f3a\u8c03\u622a\u56fe\u662f\u7a0b\u5e8f\u72b6\u6001\u7684\u6709\u635f\u6e32\u67d3\uff0c\u4e3b\u667a\u80fd\u4f53\u4f18\u5148\u901a\u8fc7\u4ee3\u7801\u8bbf\u95ee\u6587\u4ef6\u3001\u540e\u7aef\u3001DOM \u7b49\u771f\u5b9e\u72b6\u6001\uff0c\u800c\u975e\u4ec5\u4f9d\u8d56\u50cf\u7d20\u611f\u77e5\u3002", "\u91c7\u7528\u4e3b\u667a\u80fd\u4f53\u5206\u6d3e\u5b50\u76ee\u6807\u7ed9\u65b0\u5b50\u667a\u80fd\u4f53\u7684\u65b9\u5f0f\uff0c\u964d\u4f4e\u957f\u7a0b\u4efb\u52a1\u4e2d\u7684\u4e0a\u4e0b\u6587\u6c61\u67d3\uff1bGUI \u5b50\u667a\u80fd\u4f53\u4ec5\u7528\u4e8e 108 \u4e2a\u4efb\u52a1\u4e2d\u7684 28 \u4e2a\uff0c\u7ea6\u5360\u4e3b\u667a\u80fd\u4f53\u6b65\u9aa4\u7684 1.1%\u3002", "\u5728 OSWorld 2.0 \u4e0a\uff0cStateAct \u5c06 Claude Opus 4.8 \u7684\u4e8c\u5143\u6210\u529f\u7387\u4ece 20.6% \u63d0\u5347\u5230 26.9%\uff0c\u90e8\u5206\u6210\u529f\u7387\u4ece 54.8% \u63d0\u5347\u5230 61.6%\uff0c\u4e14\u6210\u672c\u7ea6\u964d\u4f4e 9 \u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7535\u8111\u4f7f\u7528", "\u7a0b\u5e8f\u72b6\u6001", "\u591a\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": "Salesforce AI Research", "pdf_url": "https://arxiv.org/pdf/2607.22798v1", "published_at": "2026-07-24", "score": 0.308, "selected_reasons": ["HF trending (53\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.22798.png", "title": "StateAct: Program State, before Pixels, for Long-Horizon Computer-Use Agents", "tldr": "\u7528\u7a0b\u5e8f\u72b6\u6001\u63d0\u5347\u957f\u7a0b\u7535\u8111\u64cd\u4f5c\u667a\u80fd\u4f53", "upvotes": 53, "what_it_is": "\u8bba\u6587\u63d0\u51fa StateAct\uff0c\u4e00\u4e2a\u4ee3\u7801\u4f18\u5148\u7684\u591a\u667a\u80fd\u4f53\u7535\u8111\u4f7f\u7528\u6846\u67b6\uff1a\u4e3b\u667a\u80fd\u4f53\u76f4\u63a5\u8bfb\u5199\u7a0b\u5e8f\u72b6\u6001\uff0c\u53ea\u6709\u5fc5\u8981\u5b50\u4efb\u52a1\u4ea4\u7ed9 GUI \u5b50\u667a\u80fd\u4f53\u70b9\u51fb\u64cd\u4f5c\u3002\u540c\u65f6\u5f15\u5165\u72ec\u7acb\u5b8c\u6210\u95e8\u68c0\u67e5\u8f93\u51fa\u8def\u5f84\u3001\u4fdd\u5b58\u72b6\u6001\u7b49\u7ed3\u6784\u6027\u9519\u8bef\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u6838\u5fc3\u74f6\u9888\u4ece\u201c\u770b\u6e05\u5c4f\u5e55\u201d\u8f6c\u5411\u201c\u7406\u89e3\u548c\u64cd\u4f5c\u7a0b\u5e8f\u72b6\u6001\u201d\uff0c\u4e3a\u957f\u7a0b GUI/\u684c\u9762\u4efb\u52a1\u63d0\u4f9b\u4e86\u66f4\u4f4e\u6210\u672c\u3001\u66f4\u53ef\u9a8c\u8bc1\u7684\u67b6\u6784\u65b9\u5411\uff0c\u4e5f\u8bf4\u660e\u7eaf\u4ee3\u7801\u6216\u7eaf\u622a\u56fe\u8def\u7ebf\u90fd\u4e0d\u5982\u72b6\u6001\u4e0e GUI \u534f\u540c\u3002"}, {"abstract": "Recent generative models are moving beyond silent video or standalone audio synthesis toward the joint generation of synchronized audio and video. Despite this progress, jointly generating audio and video with fine-grained cross-modal correspondence remains challenging due to their fundamental structural differences. Most existing methods use audio and video VAEs trained separately. As a result, the two latent spaces lack cross-modal alignment, leaving the downstream generative model to learn cross-modal synchronization from scratch. We present OmniVAE, a jointly trained audio-video VAE that learns fine-grained semantic alignment between audio and video latent representations. Beyond reconstruction, OmniVAE uses a segment-level audio-video contrastive objective to capture temporal-semantic correspondence and align the two latent spaces. In parallel, it distills features from pretrained modality-specific semantic encoders into each modality, improving the downstream learnability of both latent spaces. Extensive experiments show that both objectives consistently improve the learnability of the latent spaces, translating into higher generation quality and more accurate cross-modal synchronization in downstream text-to-audio-video generation. These findings underscore the importance of learning unified representations as a foundation for omnimodal modeling.1", "arxiv_id": "2607.23855", "arxiv_url": "https://arxiv.org/abs/2607.23855", "authors": ["Jun Zhan", "Chen Yang", "Yitian Gong", "Donghua Yu", "Kuangwei Chen", "Wenbo Zhang", "Kexin Huang", "Qi Luo", "Zhe Xu", "Ying Zhu", "Jin Wang", "Tengyue Zhang", "Qi Chen", "Cheng Chang", "Songlin Wang", "Junqi Dai", "Jiasheng Ye", "Xiaogui Yang", "Tianyi Liang", "Xiangyu Peng", "Zhaoye Fei", "Shimin Li", "Qinyuan Cheng", "Xie Chen", "Xinchi Chen", "Xipeng Qiu"], "brief": "OmniVAE \u662f\u4e00\u4e2a\u8054\u5408\u8bad\u7ec3\u7684\u97f3\u9891-\u89c6\u9891 VAE\uff0c\u65e8\u5728\u5b66\u4e60\u97f3\u9891\u4e0e\u89c6\u9891\u6f5c\u8868\u793a\u4e4b\u95f4\u7684\u7ec6\u7c92\u5ea6\u8bed\u4e49\u5bf9\u9f50\u3002\u5b83\u4e0d\u4ec5\u505a\u91cd\u5efa\uff0c\u8fd8\u901a\u8fc7\u8de8\u6a21\u6001\u5bf9\u6bd4\u5b66\u4e60\u548c\u8bed\u4e49\u7279\u5f81\u84b8\u998f\uff0c\u8ba9\u4e0b\u6e38\u6587\u672c\u5230\u97f3\u89c6\u9891\u751f\u6210\u66f4\u5bb9\u6613\u5b66\u5230\u540c\u6b65\u5173\u7cfb\u3002", "categories": ["cs.SD", "cs.CV"], "github_repo": "https://github.com/OpenMOSS/OmniVAE", "github_stars": 55, "hf_url": "https://huggingface.co/papers/2607.23855", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5f15\u5165\u7247\u6bb5\u7ea7\u97f3
