u8bc1\u660e\u5bf9\u9f50\u7684\u8054\u5408 VAE \u53ef\u4f5c\u4e3a\u5168\u6a21\u6001\u751f\u6210\u6a21\u578b\u7684\u91cd\u8981\u57fa\u7840\u7ec4\u4ef6\uff0c\u5bf9\u6587\u672c\u5230\u97f3\u89c6\u9891\u3001\u5f71\u89c6\u751f\u6210\u548c\u591a\u6a21\u6001\u5185\u5bb9\u521b\u4f5c\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Diffusion transformers are essential for high-fidelity video generation, but long token sequences make attention a dominant inference bottleneck. Training-free dynamic sparse attention alleviates this bottleneck by computing only selected key-value blocks, yet existing methods struggle to sparsify attention both efficiently and accurately for two reasons: (1) Rigid, unpredictable, and costly routing: selecting a fixed fraction of top-ranked blocks by proxy score imposes fixed budgets, whereas retaining blocks to reach a target cumulative proxy probability mass yields dynamic but potentially imbalanced budgets; both incur non-negligible overhead from computing and materializing proxy scores. (2) Lossy keep-or-drop sparsification: unselected blocks are discarded entirely, degrading accuracy under aggressive sparsity. These limitations motivate cheaper dynamic-budget routing while limiting accuracy degradation. In this paper, we introduce training-free Sol-Attn (Sparsifying online attention), which unifies dynamic routing, sparse computation, and approximation correction in a single online-softmax pass, achieving a better accuracy-efficiency trade-off in sparse attention. The core of Sol-Attn is on-the-fly block thresholding with proxy-score reuse, which selects critical blocks by comparing block proxy scores against a threshold during online softmax. This design enables dynamic yet controllable block budgets without materializing the proxy map, while directly reusing the proxy scores of unselected blocks to approximate their contribution. Experiments across image and video generation tasks show that Sol-Attn advances the quality-efficiency frontier of training-free sparse attention, delivering 2.1 times and 2.3 times end-to-end speedups for video generation and editing, respectively, while preserving visual quality.", "arxiv_id": "2607.24027", "arxiv_url": "https://arxiv.org/abs/2607.24027", "authors": ["Haopeng Li", "Yitong Li", "Junsong Chen", "Tian Ye", "Haozhe Liu", "Jincheng Yu", "Duomin Wang", "Ruihua Zhang", "Zeke Xie", "Enze Xie", "Song Han"], "brief": "\u672c\u6587\u63d0\u51fa\u514d\u8bad\u7ec3\u7684 Sol-Attn\uff0c\u7528\u4e8e\u6269\u6563 Transformer \u89c6\u9891\u751f\u6210\u4e2d\u7684\u52a8\u6001\u7a00\u758f\u6ce8\u610f\u529b\u63a8\u7406\u52a0\u901f\u3002\u5b83\u5c06\u52a8\u6001\u8def\u7531\u3001\u7a00\u758f\u8ba1\u7b97\u548c\u8fd1\u4f3c\u6821\u6b63\u5728\u4e00\u6b21 online softmax \u4e2d\u7edf\u4e00\u5b8c\u6210\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24027", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u5728\u7ebf\u5757\u9608\u503c\u5224\u65ad\u548c\u4ee3\u7406\u5206\u6570\u590d\u7528\uff0c\u907f\u514d\u663e\u5f0f\u7269\u5316\u5b8c\u6574\u4ee3\u7406\u5206\u6570\u56fe\uff0c\u964d\u4f4e\u8def\u7531\u5f00\u9500\u3002", "\u91c7\u7528\u52a8\u6001\u4f46\u53ef\u63a7\u7684\u6ce8\u610f\u529b\u5757\u9884\u7b97\uff0c\u76f8\u6bd4\u56fa\u5b9a top-k \u6216\u7d2f\u8ba1\u6982\u7387\u8d28\u91cf\u7b56\u7565\u66f4\u7075\u6d3b\u9ad8\u6548\u3002", "\u5bf9\u672a\u9009\u4e2d\u5757\u4e0d\u76f4\u63a5\u4e22\u5f03\uff0c\u800c\u662f\u590d\u7528\u5176\u4ee3\u7406\u5206\u6570\u8fd1\u4f3c\u8d21\u732e\uff0c\u51cf\u8f7b\u9ad8\u7a00\u758f\u7387\u4e0b\u7684\u8d28\u91cf\u635f\u5931\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7a00\u758f\u6ce8\u610f\u529b", "\u6269\u6563\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24027v1", "published_at": "2026-07-27", "score": 0.292, "selected_reasons": ["HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24027.png", "title": "Sol-Attn: Accelerating Video Generation Inference via On-the-Fly Attention Sparsification", "tldr": "\u5728\u7ebf\u7a00\u758f\u6ce8\u610f\u529b\u52a0\u901f\u89c6\u9891\u751f\u6210\u63a8\u7406", "upvotes": 25, "what_it_is": "\u672c\u6587\u63d0\u51fa\u514d\u8bad\u7ec3\u7684 Sol-Attn\uff0c\u7528\u4e8e\u6269\u6563 Transformer \u89c6\u9891\u751f\u6210\u4e2d\u7684\u52a8\u6001\u7a00\u758f\u6ce8\u610f\u529b\u63a8\u7406\u52a0\u901f\u3002\u5b83\u5c06\u52a8\u6001\u8def\u7531\u3001\u7a00\u758f\u8ba1\u7b97\u548c\u8fd1\u4f3c\u6821\u6b63\u5728\u4e00\u6b21 online softmax \u4e2d\u7edf\u4e00\u5b8c\u6210\u3002", "why_notable": "Sol-Attn \u9488\u5bf9\u89c6\u9891\u751f\u6210\u4e2d\u6ce8\u610f\u529b\u8ba1\u7b97\u74f6\u9888\u63d0\u51fa\u8bad\u7ec3-free\u52a0\u901f\u65b9\u6848\uff0c\u5728\u4fdd\u6301\u89c6\u89c9\u8d28\u91cf\u7684\u540c\u65f6\u5b9e\u73b0\u89c6\u9891\u751f\u6210 2.1 \u500d\u3001\u89c6\u9891\u7f16\u8f91 2.3 \u500d\u7aef\u5230\u7aef\u52a0\u901f\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present Oxygen-TryOn, a unified foundation model for any-item virtual try-on. Rather than repurposing a general-purpose image editor, Oxygen-TryOn is fashion-native, built for try-on through a dedicated data engine and try-on-specific training. Given one or more reference items (clean product shots or in-the-wild worn-on photos) and a single target subject image, it synthesizes a photorealistic image of the subject wearing the items across virtually any fashion category. Prior systems handle a single garment category in a studio setting, and recent multi-reference methods remain garment-centric; in contrast, Oxygen-TryOn supports diverse items and scenarios, including full- and half-body views, a variable number of references, and free multi-item composition, while faithfully preserving both subject identity and item appearance. Instead of mask-based inpainting, we reformulate try-on as a multi-reference, understanding-driven generation task. We build a data engine that collects, manufactures, annotates, and filters high-quality try-on data at scale, and design a three-stage recipe of continued pre-training (CPT), supervised fine-tuning (SFT), and reinforcement learning (RL). The RL stage uses a hybrid reward combining an in-house try-on reward model with a proprietary, rubric-guided general-purpose model, jointly supervising fine-grained consistency and instruction-level quality. It also follows general editing instructions (e.g., pose changes) in the same pass. Across public benchmarks and our in-house Oxygen-TryOn Bench, it achieves state-of-the-art consistency and realism on single-item try-on and leads on multi-item try-on, matching or surpassing both leading proprietary systems (Nano Banana Pro, GPT-Image-2, Seedream5 Lite) and open-source models (FLUX.2).", "arxiv_id": "2607.21694", "arxiv_url": "https://arxiv.org/abs/2607.21694", "authors": ["Yong Liu", "Xiaolong Fu", "Zihang Xu", "Wen Xue", "Xueheng Li", "Lin Song", "Yuan Zhang", "Chuyang Zhao", "Haoyang Huang", "Nan Duan", "Yipeng Sun", "Yan Li", "Simiu Gu"], "brief": "\u8bba\u6587\u63d0\u51fa Oxygen-TryOn\uff0c\u4e00\u4e2a\u4e3a\u865a\u62df\u8bd5\u7a7f\u4e13\u95e8\u6784\u5efa\u7684\u65f6\u5c1a\u539f\u751f\u57fa\u7840\u6a21\u578b\u3002\u5b83\u53ef\u6839\u636e\u76ee\u6807\u4eba\u7269\u56fe\u548c\u4e00\u4e2a\u6216\u591a\u4e2a\u5546\u54c1/\u7a7f\u7740\u53c2\u8003\u56fe\uff0c\u751f\u6210\u4e3b\u4f53\u7a7f\u6234\u4efb\u610f\u7c7b\u522b\u3001\u591a\u4ef6\u65f6\u5c1a\u5355\u54c1\u7684\u903c\u771f\u56fe\u50cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21694", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u8bd5\u7a7f\u4ece\u4f20\u7edf\u906e\u7f69\u4fee\u590d\u6539\u5199\u4e3a\u591a\u53c2\u8003\u3001\u7406\u89e3 c3\u7684\u65b9\u6cd5\uff0cOxygen-TryOn \u9762\u5411\u771f\u5b9e\u591a\u573a\u666f\u548c\u4efb\u610f\u65f6\u5c1a\u5355\u54c1\uff0c\u5728\u516c\u5f00\u4e0e\u5185\u90e8\u57fa\u51c6\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u591a\u6b3e\u95ed\u6e90\u548c\u5f00\u6e90\u9886\u5148\u7cfb\u7edf\uff0c\u5177\u5907\u5f88\u5f3a\u7684\u7535\u5546\u3001\u5185\u5bb9\u521b\u4f5c\u548c\u4e2a\u6027\u5316\u8bd5\u8863\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM-as-a-judge has become the standard for automated evaluation, but it suffers from high cost, significant latency, and opaque decisions -- limitations that undermine its scalability and reliability. We address these with a simple, efficient alternative: program distillation. Instead of prompting an LLM at the evaluation time, we distill its decision logic into a committee of programs that score candidates directly. These programmatic judges offer transparency, are easily inspected or edited, and eliminate per-sample API costs. Building on this notion, we introduce PAJAMA, a system that synthesizes programs as judges, aggregates their decisions into a joint verdict, and incorporates a fallback mechanism to selectively escalate low-confidence cases to an LLM. Across five datasets and four model families, we show that programmatic judges can match the performance of a 13B-size LLM judge. When using program outputs as routing signals, PAJAMA improves both accuracy and throughput and advances the Pareto frontier. Beyond evaluation, programmatic judges produce cheap and effective reward signals: on RewardBench, a reward model distilled from programs\u0027 verdicts outperforms one trained on a proprietary LLM\u0027s labels at two orders of magnitude lower API cost.", "arxiv_id": "2607.22561", "arxiv_url": "https://arxiv.org/abs/2607.22561", "authors": ["Tzu-Heng Huang", "Shengqi Qiu", "Frederic Sala"], "brief": "\u8bba\u6587\u63d0\u51fa PAJAMA\uff0c\u5c06 LLM-as-a-judge \u7684\u8bc4\u5224\u903b\u8f91\u84b8\u998f\u6210\u4e00\u7ec4\u53ef\u6267\u884c\u7a0b\u5e8f\uff0c\u7531\u7a0b\u5e8f\u59d4\u5458\u4f1a\u76f4\u63a5\u7ed9\u5019\u9009\u7ed3\u679c\u6253\u5206\uff0c\u5e76\u5728\u4f4e\u7f6e\u4fe1\u6837\u672c\u4e0a\u56de\u9000\u8c03\u7528 LLM\u3002\u8be5\u65b9\u6cd5\u65e8\u5728\u964d\u4f4e\u8bc4\u6d4b\u6210\u672c\u4e0e\u5ef6\u8fdf\uff0c\u540c\u65f6\u63d0\u5347\u53ef\u89e3\u91ca\u6027\u548c\u53ef\u7ef4\u62a4\u6027\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/SprocketLab/PAJAMA", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2607.22561", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7a0b\u5e8f\u5316\u8bc4\u5ba1\u5668\u53ef\u88ab\u68c0\u67e5\u3001\u7f16\u8f91\u548c\u7ec4\u5408\uff0c\u907f\u514d\u6bcf\u4e2a\u6837\u672c\u90fd\u8c03\u7528 LLM API\uff0c\u663e\u8457\u964d\u4f4e\u63a8\u7406\u6210\u672c\u4e0e\u5ef6\u8fdf", "\u57285\u4e2a\u6570\u636e\u96c6\u30014\u7c7b\u6a21\u578b\u5bb6\u65cf\u4e0a\uff0c\u7a0b\u5e8f\u8bc4\u5ba1\u5668\u6027\u80fd\u53ef\u5339\u914d\u7ea613B\u89c4\u6a21\u7684 LLM judge", "PAJAMA \u5c06\u7a0b\u5e8f\u8f93\u51fa\u4f5c\u4e3a\u8def\u7531\u4fe1\u53f7\uff0c\u5728\u51c6\u786e\u7387\u4e0e\u541e\u5410\u91cf\u4e4b\u95f4\u53d6\u5f97\u66f4\u4f18\u5e15\u7d2f\u6258\u524d\u6cbf\uff1b\u5176\u751f\u6210\u7684\u5956\u52b1\u4fe1\u53f7\u5728 RewardBench \u4e0a\u4e5f\u5177\u5907\u9ad8\u6027\u4ef7\u6bd4"], "keywords": ["\u81ea\u52a8\u8bc4\u6d4b", "\u7a0b\u5e8f\u5408\u6210", "\u6a21\u578b\u84b8\u998f", "\u5956\u52b1\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "sprocket-lab", "pdf_url": "https://arxiv.org/pdf/2607.22561v1", "published_at": "2026-05-29", "score": 0.279, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.22561.png", "title": "Codifying the Judge: Scalable Evaluation via Program Distillation", "tldr": "\u7528\u7a0b\u5e8f\u84b8\u998f\u66ff\u4ee3\u6602\u8d35\u7684LLM\u8bc4\u5ba1", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa PAJAMA\uff0c\u5c06 LLM-as-a-judge \u7684\u8bc4\u5224\u903b\u8f91\u84b8\u998f\u6210\u4e00\u7ec4\u53ef\u6267\u884c\u7a0b\u5e8f\uff0c\u7531\u7a0b\u5e8f\u59d4\u5458\u4f1a\u76f4\u63a5\u7ed9\u5019\u9009\u7ed3\u679c\u6253\u5206\uff0c\u5e76\u5728\u4f4e\u7f6e\u4fe1\u6837\u672c\u4e0a\u56de\u9000\u8c03\u7528 LLM\u3002\u8be5\u65b9\u6cd5\u65e8\u5728\u964d\u4f4e\u8bc4\u6d4b\u6210\u672c\u4e0e\u5ef6\u8fdf\uff0c\u540c\u65f6\u63d0\u5347\u53ef\u89e3\u91ca\u6027\u548c\u53ef\u7ef4\u62a4\u6027\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u9ed1\u76d2\u3001\u6602\u8d35\u7684 LLM \u8bc4\u5ba1\u8f6c\u5316\u4e3a\u900f\u660e\u3001\u4f4e\u6210\u672c\u7684\u7a0b\u5e8f\u96c6\u5408\uff0c\u4e3a\u5927\u89c4\u6a21\u81ea\u52a8\u8bc4\u6d4b\u548c\u5956\u52b1\u6a21\u578b\u8bad\u7ec3\u63d0\u4f9b\u4e86\u66f4\u53ef\u6269\u5c55\u7684\u66ff\u4ee3\u65b9\u6848\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Learning deployable manipulation policies is bottlenecked by the scarcity of data that is both high-fidelity and scalable. Real-robot teleoperation is accurate but costly to scale; robot-free UMI capture scales readily, and current practice uses the resulting data mainly for pre-training, adding a small real-robot \"anchor\" at post-training. We ask whether raising the fidelity of robot-free UMI data, rather than shrinking the real-robot fraction, can remove that anchor. We present HiFi-UMI, a portable UMI data-production system co-designed for trajectory accuracy, inter-gripper relative pose, synchronization, and field of view: head-mounted offline stereo-inertial SLAM, native rather than reconstructed relative pose, a shared microsecond GPIO trigger, and two wide-angle cameras per hand covering ~200 degrees. It reaches 3 mm workspace-local end-effector accuracy without external tracking infrastructure. Using this corpus, we demonstrate zero-robot post-training: a policy post-trained solely on HiFi-UMI demonstrations deploys directly on a real robot and matches in-domain teleoperation across three backbones spanning the vision-language-action and world-action-model families, with success-rate differences of -2.5, +3.1, and -0.6 percentage points on StarVLA-QwenPI, OpenPI-pi_0.5, and LingBot-VA; the strongest policy reaches 85% on a precision insertion task, even though the teleoperation baseline is collected in the evaluation scene and no HiFi-UMI trajectory is. Pre-training on 4,000 hours from the same corpus lowers action error on ten unseen tasks by 41% and, on StarVLA-QwenPI, raises real-robot success by a further 18.1 percentage points. We open-source HiFi-UMI-2K, 2,000 hours of microsecond-synchronized, ultra-wide-FoV demonstrations, each automatically reconstructed and validated through simulation replay, as a large-scale, high-fidelity resource for the robot-learning community.", "arxiv_id": "2607.25895", "arxiv_url": "https://arxiv.org/abs/2607.25895", "authors": ["Simple AI", ":", "Yuteng Wei", "Jinming Ma", "Jiawei Wang", "Weitao Zhou", "Yushen Zuo", "Ke Rui", "Minglei Li", "Jinhao Zhang", "Zhikang Pan", "Xiang Wang", "Haoran Jia", "Huan Du", "Zicheng Zeng", "Jun Ma", "Guiyu Qin", "Di Zhang", "Xiaofei Li"], "brief": "\u8bba\u6587\u63d0\u51fa HiFi-UMI\uff0c\u4e00\u5957\u4fbf\u643a\u5f0f\u65e0\u673a\u5668\u4eba\u793a\u6559\u6570\u636e\u91c7\u96c6\u7cfb\u7edf\uff0c\u663e\u8457\u63d0\u5347\u8f68\u8ff9\u7cbe\u5ea6\u3001\u53cc\u5939\u722a\u76f8\u5bf9\u4f4d\u59ff\u3001\u540c\u6b65\u548c\u89c6\u91ce\u8986\u76d6\u3002\u4ec5\u7528 HiFi-UMI \u793a\u6559\u8fdb\u884c\u540e\u8bad\u7ec3\u7684\u7b56\u7565\u65e0\u9700\u771f\u5b9e\u673a\u5668\u4eba\u951a\u5b9a\u6570\u636e\uff0c\u5c31\u80fd\u76f4\u63a5\u90e8\u7f72\u5230\u771f\u5b9e\u673a\u5668\u4eba\u5e76\u8fbe\u5230\u9065\u64cd\u4f5c\u57fa\u7ebf\u6c34\u5e73\u3002", "categories": ["cs.RO", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25895", "impact_score": 8, "is_agent": fal 6587\u63d0\u51fa HiFi-UMI\uff0c\u4e00\u5957\u4fbf\u643a\u5f0f\u65e0\u673a\u5668\u4eba\u793a\u6559\u6570\u636e\u91c7\u96c6\u7cfb\u7edf\uff0c\u663e\u8457\u63d0\u5347\u8f68\u8ff9\u7cbe\u5ea6\u3001\u53cc\u5939\u722a\u76f8\u5bf9\u4f4d\u59ff\u3001\u540c\u6b65\u548c\u89c6\u91ce\u8986\u76d6\u3002\u4ec5\u7528 HiFi-UMI \u793a\u6559\u8fdb\u884c\u540e\u8bad\u7ec3\u7684\u7b56\u7565\u65e0\u9700\u771f\u5b9e\u673a\u5668\u4eba\u951a\u5b9a\u6570\u636e\uff0c\u5c31\u80fd\u76f4\u63a5\u90e8\u7f72\u5230\u771f\u5b9e\u673a\u5668\u4eba\u5e76\u8fbe\u5230\u9065\u64cd\u4f5c\u57fa\u7ebf\u6c34\u5e73\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u673a\u5668\u4eba\u5b66\u4e60\u4e2d\u5fc5\u987b\u4f9d\u8d56\u5c11\u91cf\u771f\u5b9e\u673a\u5668\u4eba\u540e\u8bad\u7ec3\u6570\u636e\u7684\u5e38\u89c4\u505a\u6cd5\uff0c\u8868\u660e\u53ea\u8981\u65e0\u673a\u5668\u4eba\u793a\u6559\u6570\u636e\u8db3\u591f\u9ad8\u4fdd\u771f\uff0c\u5c31\u53ef\u80fd\u89c4\u6a21\u5316\u8bad\u7ec3\u53ef\u76f4\u63a5\u90e8\u7f72\u7684\u64cd\u4f5c\u7b56\u7565\u3002\u5176\u5f00\u6e90\u5927\u89c4\u6a21\u6570\u636e\u96c6\u548c\u91c7\u96c6\u7cfb\u7edf\u5bf9\u673a\u5668\u4eba\u6a21\u4eff\u5b66\u4e60\u3001VLA \u6a21\u578b\u548c\u901a\u7528\u64cd\u4f5c\u7b56\u7565\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The rapid evolution of generative models has unlocked new potentials in protein binder design, a pivotal task in structural biology, by facilitating end-to-end generation via joint sequence-structure modeling or hallucination. However, existing approaches are predominantly implemented under a single-target, single-state assumption, limiting their ability to model multi-target or multi-state interactions required for advanced function-oriented protein design. Here, we introduce Chamaileon, which unifies multi-target and multi-state binder design by formulating the problem as cross-context binding landscape modeling. The framework is underpinned by a training paradigm termed In-Context Complex Co-Design (I3CD) for context-aware sequence-structure co-modeling. During inference, we employ Mixture-of-Paths Sampling (MoPS), a scalable strategy that optimizes a single sequence across contexts while alleviating the scarcity of high-quality multi-conformational paired data. Extensive evaluation on our newly constructed benchmark, CROSS, demonstrates that Chamaileon effectively generates sequences adaptable to diverse conformational landscapes and multi-target requirements. The code is available on https://github.com/caohengyuan/Chamaileon.", "arxiv_id": "2607.23518", "arxiv_url": "https://arxiv.org/abs/2607.23518", "authors": ["Hengyuan Cao", "Shizhuo Cheng", "Mingxuan Liu", "Weicheng Huang", "Yunhong Lu", "Chenxi Cai", "Yan Zhang", "Min Zhang"], "brief": "Chamaileon \u5c06\u591a\u9776\u70b9\u4e0e\u591a\u6784\u8c61\u72b6\u6001\u4e0b\u7684\u86cb\u767d binder \u8bbe\u8ba1\u7edf\u4e00\u4e3a\u8de8\u4e0a\u4e0b\u6587\u7ed3\u5408\u666f\u89c2\u5efa\u6a21\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u4e0a\u4e0b\u6587\u611f\u77e5\u7684\u5e8f\u5217-\u7ed3\u6784\u534f\u540c\u5efa\u6a21\u4e0e\u6df7\u5408\u91c7\u6837\uff0c\u5728\u591a\u4e2a\u76ee\u6807\u6216\u72b6\u6001\u95f4\u4f18\u5316\u540c\u4e00\u6761\u7ed3\u5408\u5e8f\u5217\u3002", "categories": ["cs.LG", "q-bio.BM"], "github_repo": "https://github.com/caohengyuan/Chamaileon", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2607.23518", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa In-Context Complex Co-Design\uff08I3CD\uff09\u8bad\u7ec3\u8303\u5f0f\uff0c\u7528\u4e8e\u4e0a\u4e0b\u6587\u611f\u77e5\u7684\u86cb\u767d\u590d\u5408\u7269\u5e8f\u5217-\u7ed3\u6784\u8054\u5408\u5efa\u6a21", "\u63d0\u51fa Mixture-of-Paths Sampling\uff08MoPS\uff09\u63a8\u7406\u7b56\u7565\uff0c\u5728\u591a\u4e0a\u4e0b\u6587\u4e2d\u4f18\u5316\u5355\u4e00\u5e8f\u5217\u5e76\u7f13\u89e3\u591a\u6784\u8c61\u914d\u5bf9\u6570\u636e\u7a00\u7f3a\u95ee\u9898", "\u6784\u5efa\u65b0\u57fa\u51c6 CROSS\uff0c\u8bc4\u4f30\u6a21\u578b\u5728\u591a\u9776\u70b9\u3001\u591a\u72b6\u6001\u7ed3\u5408\u4f53\u8bbe\u8ba1\u4e2d\u7684\u9002\u5e94\u6027\u4e0e\u751f\u6210\u8d28\u91cf"], "keywords": ["\u86cb\u767d\u8bbe\u8ba1", "\u751f\u6210\u6a21\u578b", "\u7ed3\u6784\u751f\u7269\u5b66", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2607.23518v1", "published_at": "2026-07-26", "score": 0.255, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23518.png", "title": "Chamaileon: Cross-Context Binder Design with Contextualized Modeling and Mixed Sampling", "tldr": "\u7edf\u4e00\u591a\u9776\u70b9/\u591a\u72b6\u6001\u86cb\u767d\u7ed3\u5408\u4f53\u8bbe\u8ba1", "upvotes": 6, "what_it_is": "Chamaileon \u5c06\u591a\u9776\u70b9\u4e0e\u591a\u6784\u8c61\u72b6\u6001\u4e0b\u7684\u86cb\u767d binder \u8bbe\u8ba1\u7edf\u4e00\u4e3a\u8de8\u4e0a\u4e0b\u6587\u7ed3\u5408\u666f\u89c2\u5efa\u6a21\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u4e0a\u4e0b\u6587\u611f\u77e5\u7684\u5e8f\u5217-\u7ed3\u6784\u534f\u540c\u5efa\u6a21\u4e0e\u6df7\u5408\u91c7\u6837\uff0c\u5728\u591a\u4e2a\u76ee\u6807\u6216\u72b6\u6001\u95f4\u4f18\u5316\u540c\u4e00\u6761\u7ed3\u5408\u5e8f\u5217\u3002", "why_notable": "\u73b0\u6709\u86cb\u767d binder \u751f\u6210\u65b9\u6cd5\u591a\u5047\u8bbe\u5355\u9776\u70b9\u3001\u5355\u72b6\u6001\uff0c\u800c Chamaileon \u9762\u5411\u66f4\u63a5\u8fd1\u771f\u5b9e\u529f\u80fd\u9700\u6c42\u7684\u591a\u9776\u70b9/\u591a\u6784\u8c61\u8bbe\u8ba1\u573a\u666f\uff0c\u5177\u6709\u63a8\u52a8\u529f\u80fd\u5bfc\u5411\u86cb\u767d\u8bbe\u8ba1\u7684\u6f5c\u5728\u4ef7\u503c\u3002"}, {"abstract": "Progress in video generation keeps narrowing the visual gap between AI-generated and professionally produced footage, yet most benchmarks still draw prompts from web sources or LLM templates and score them with untrained, generic multimodal models. More fundamentally, their evaluation taxonomies remain rudimentary (overall visual quality, coarse text alignment and temporal smoothness) rather than the professional Cinematic Language criteria by which films are actually made and judged, so they assess basic video plausibility rather than film-grade craft. We introduce FilmBench, a text-to-video (T2V) and reference-to-video (R2V) benchmark grounded in the professional Cinematic Language of the film- academy tradition and co-developed with directors and faculty from the Beijing Film Academy and the Hujing Digital Media \u0026 Entertainment Group film studio. It rests on three choices. First, prompts are reverse-engineered from clips of award-winning films spanning 20 cinematic genres and chosen by professional directors, so every prompt is anchored to a verified live-action reference; the prompts follow real shot lists, and most script multiple shots (1,056 of the 1,169 prompts are multi-shot), unlike prior single-clip benchmarks. Second, evaluation follows a three-level Cinematic taxonomy of 3 axes, 12 components and 35 (T2V) +3 (R2V-only) sub-metrics. Third, we develop an in-house expert-grade automatic evaluation agent and open-source its core suite of Cinematic Language operators (FilmOps). Benchmarking leading video generation models (9 for T2V, 7 for R2V), the evaluator reproduces the human model ranking at model-level Spearman \\r{ho} = 0.95 (T2V) and 0.96 (R2V). Scores fall well below prior web-style benchmarks, with two consistent gaps in dynamic aesthetics and a marked single- to multi-shot performance drop that widens for weaker models.", "arxiv_id": "2607.24241", "arxiv_url": "https://arxiv.org/abs/2607.24241", "authors": ["Shengyi Wang", "Niantong Li", "Guangzheng Hu", "Hong Qi", "Fei Ding", "Weixu Qiao", "Jinlin Wang", "Xiaotong Lv", "Peng Han", "Zimeng Li", "Fanshu Ding", "Yushu Wang", "Han Wu", "Jingjing Chen", "Chongxiao Wang", "Yanhao Wu", "Chenglong Huang", "Xiaoqian Zhu", "Jie Tian", "Hua Li", "Jingjing Fan", "Mingshuang Tang", "Zhong Li", "Hengxia Qiang", "Weibin Chen", "Jinyang Zhen", "Bing Zhao", "Lin Qu", "Jing Li", "Hu Wei"], "brief": "\u8bba\u6587\u63d0\u51fa FilmBench\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u751f\u89c6\u9891\u4e0e\u53c2\u8003\u751f\u89c6\u9891\u7684\u7535\u5f71\u7ea7\u8bc4\u6d4b\u57fa\u51c6\u3002\u5176\u63d0\u793a\u8bcd\u6765\u81ea\u83b7\u5956\u7535\u5f71\u7247\u6bb5\u5e76\u7531\u4e13\u4e1a\u5bfc\u6f14\u53c2\u4e0e\u8bbe\u8ba1\uff0c\u8bc4\u6d4b\u4f53\u7cfb\u57fa\u4e8e\u7535\u5f71\u5b66\u9662\u4f20\u7edf\u7684 Cinematic Language\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/Neo-yk/FilmOps", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2607.24241", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5305\u542b1169\u4e2a\u63d0\u793a\u8bcd\uff0c\u8986\u76d620\u79cd\u7535\u5f71\u7c7b\u578b\uff0c\u5176\u4e2d1056\u4e2a\u4e3a\u591a\u955c\u5934\u811a\u672c\uff0c\u5e76\u5747\u951a\u5b9a\u771f\u5b9e\u7535\u5f71\u53c2\u8003\u7247\u6bb5\u3002", "\u6784\u5efa3\u5927\u8f74\u300112\u4e2a\u7ec4\u4ef6\u300135\u4e2aT2V\u5b50\u6307\u6807\u53ca3\u4e2aR2V\u4e13\u5c5e\u5b50\u6307\u6807\u7684\u7535\u5f71\u8bed\u8a00\u8bc4\u6d4b\u4f53\u7cfb\u3002", "\u5f00\u53d1\u4e13\u5bb6\u7ea7\u81ea\u52a8\u8bc4\u6d4b\u5668\u5e76\u5f00\u6e90\u6838\u5fc3 FilmOps\uff0c\u5728\u6a21\u578b\u7ea7\u6392\u540d\u4e0a\u4e0e\u4eba\u7c7b\u8bc4\u4ef7\u9ad8\u5ea6\u4e00\u81f4\uff0cSpearman \u03c1 \u8fbe0.95/0.96\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001\u8bc4\u6d4b", "\u7535\u5f71\u8bed\u8a00", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24241v1", "published_at": "2026-07-27", "score": 0.254, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24241.png", "title": "FilmBench: A Film-Grade Benchmark for Cinematic Video Generation", "tldr": "\u9762\u5411\u7535\u5f71\u7ea7\u89c6\u9891\u751f\u6210\u7684\u4e13\u4e1a\u57fa\u51c6", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa FilmBench\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u751f\u89c6\u9891\u4e0e\u53c2\u8003\u751f\u89c6\u9891\u7684\u7535\u5f71\u7ea7\u8bc4\u6d4b\u57fa\u51c6\u3002\u5176\u63d0\u793a\u8bcd\u6765\u81ea\u83b7\u5956\u7535\u5f71\u7247\u6bb5\u5e76\u7531\u4e13\u4e1a\u5bfc\u6f14\u53c2\u4e0e\u8bbe\u8ba1\uff0c\u8bc4\u6d4b\u4f53\u7cfb\u57fa\u4e8e\u7535\u5f71\u5b66\u9662\u4f20\u7edf\u7684 Cinematic Language\u3002", "why_notable": "\u76f8\u6bd4\u4f9d\u8d56\u7f51\u9875\u63d0\u793a\u548c\u7c97\u7c92\u5ea6\u6307\u6807\u7684\u65e7\u57fa\u51c6\uff0cFilmBench\u66f4\u8d34\u8fd1\u771f\u5b9e\u7535\u5f71\u5236\u4f5c\u6807\u51c6\uff0c\u63ed\u793a\u73b0\u6709\u89c6\u9891\u751f\u6210\u6a21\u578b\u5728\u52a8\u6001\u7f8e\u5b66\u548c\u591a\u955c\u5934\u751f\u6210\u4e0a\u7684\u660e\u663e\u77ed\u677f\uff0c\u5bf9\u8bc4\u4f30\u7535\u5f71\u7ea7\u89c6\u9891\u751f\u6210\u80fd\u529b\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "While data curation for Vision Language Models (VLMs) is increasingly active, public practice for constructing pretraining mixtures remains largely heuristic: practitioners stack datasets that pass quality filters, set cross-domain ratios by intuition, and lack a principled, attributable criterion for admitting new data, while frontier recipes remain undisclosed. We formulate data construction as a systematic mixture-optimization problem and turn it into a reproducible engineering discipline by decoupling the mixture into two orthogonal sub-problems: inter-class ratios across capabilities and intra-class ratios within a category. For inter-class allocation, we use a single-variable iterative search; for intra-class composition, we apply a multidimensional, dataset-level assessment scoring Quality and Difficulty, and formulate selection as a constrained convex optimization with a diversity objective. The DecoupleMix framework delivers two critical capabilities: guiding what data to collect next and rendering dataset validation a controlled, attributable experiment. Experiments show our approach consistently surpasses heuristic baselines. Moreover, optimal ratios discovered on small-scale proxies transfer seamlessly to larger scales without retuning. Using 80B additional multimodal continue-pretraining tokens, our VLM is competitive with strong open-source models trained with substantially larger multimodal budgets.", "arxiv_id": "2607.24516", "arxiv_url": "https://arxiv.org/abs/2607.24516", "authors": ["Jiahao Xie", "Zhongbin Guo", "Qianle Wang", "Ruiqi Lu", "Dongling Xiao", "Wanxuan Sun", "Cheng Yang"], "brief": "\u8bba\u6587\u63d0\u51fa DecoupleMix\uff0c\u5c06VLM\u9884\u8bad\u7ec3\u6570\u636e\u6784\u5efa\u62c6\u89e3\u4e3a\u8de8\u80fd\u529b\u7c7b\u522b\u6bd4\u4f8b\u641c\u7d22\u4e0e\u7c7b\u522b\u5185\u6570\u636e\u96c6\u5206\u914d\u4e24\u4e2a\u95ee\u9898\u3002\u524d\u8005\u7528\u5355\u53d8\u91cf\u8fed\u4ee3\u641c\u7d22\uff0c\u540e\u8005\u57fa\u4e8e\u8d28\u91cf\u3001\u96be\u5ea6\u8bc4\u5206\u4e0e\u591a\u6837\u6027\u7ea6\u675f\u505a\u51f8\u4f18\u5316\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24516", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u6570\u636e\u6df7\u5408\u914d\u65b9\u4ece\u7ecf\u9a8c\u5f0f\u5806\u53e0\u8f6c\u5316\u4e3a\u53ef\u590d\u73b0\u3001\u53ef\u5f52\u56e0\u7684\u4f18\u5316\u6d41\u7a0b", "\u7c7b\u522b\u5185\u9009\u62e9\u7efc\u5408\u6570\u636e\u8d28\u91cf\u3001\u96be\u5ea6\u4e0e\u591a\u6837\u6027\uff0c\u5efa\u6a21\u4e3a\u53d7\u7ea6\u675f\u51f8\u4f18\u5316\u95ee\u9898", "\u5c0f\u89c4\u6a21\u4ee3\u7406\u5b9e\u9a8c\u5f97\u5230\u7684\u6700\u4f18\u6bd4\u4f8b\u53ef\u8fc1\u79fb\u5230\u5927\u89c4\u6a21\u8bad\u7ec3\uff0c80B\u989d\u5916\u591a\u6a21\u6001token\u5373\u53ef\u8fbe\u5230\u5f3a\u5f00\u6e90VLM\u7ade\u4e89\u6c34\u5e73"], "keywords": ["\u591a\u6a21\u6001", "\u6570\u636e\u914d\u65b9", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4f18\u5316"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24516v1", "published_at": "2026-07-27", "score": 0.251, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24516.png", "title": "DecoupleMix: Decoupled Ratio Search and Convex Allocation for Scalable VLM Data Recipes", "tldr": "\u7cfb\u7edf\u4f18\u5316VLM\u9884\u8bad\u7ec3\u6570\u636e\u6df7\u5408\u914d\u65b9", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa DecoupleMix\uff0c\u5c06VLM\u9884\u8bad\u7ec3\u6570\u636e\u6784\u5efa\u62c6\u89e3\u4e3a\u8de8\u80fd\u529b\u7c7b\u522b\u6bd4\u4f8b\u641c\u7d22\u4e0e\u7c7b\u522b\u5185\u6570\u636e\u96c6\u5206\u914d\u4e24\u4e2a\u95ee\u9898\u3002\u524d\u8005\u7528\u5355\u53d8\u91cf\u8fed\u4ee3\u641c\u7d22\uff0c\u540e\u8005\u57fa\u4e8e\u8d28\u91cf\u3001\u96be\u5ea6\u8bc4\u5206\u4e0e\u591a\u6837\u6027\u7ea6\u675f\u505a\u51f8\u4f18\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aVLM\u6570\u636e\u914d\u65b9\u63d0\u4f9b\u4e86\u516c\u5f00\u3001\u7cfb\u7edf\u7684\u5de5\u7a0b\u65b9\u6cd5\uff0c\u80fd\u6307\u5bfc\u540e\u7eed\u6570\u636e\u91c7\u96c6\u4e0e\u6570\u636e\u96c6\u51c6\u5165\u9a8c\u8bc1\uff0c\u5e76\u964d\u4f4e\u5927\u89c4\u6a21\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u7684\u8bd5\u9519\u6210\u672c\u3002"}, {"abstract": "We present Wonder, a general-purpose video world model for real-time, camera-controllable world exploration. Given an image or a conditional video, Wonder constructs a playable world where users can navigate interactively by moving the camera, discovering unseen regions, and revisiting previously observed areas in real time and over a long-term horizon. Achieving this capability requires a system-level co-design of control method, memory mechanism, and training strategy. We introduce a novel camera conditioning with a dense coordinate field whose renderings provide spatially aligned motion and orientation cues, allowing the model to interpret camera motion directly as visual evidence. To support fast and precise memory retrieval over a growing generation context, we propose an efficient sparse attention-based memory mechanism, enabling the model to selectively attend to a small set of relevant context tokens at inference time, regardless of actual context length. We further develop several techniques to rectify the self-forcing-style distillation pipeline, improving the student model\u0027s ability to respect control signals, as well as maintaining diverse generation modes and long-term memory from the teacher. Together, these components enable Wonder to synthesize diverse, minute-scale videos at 16 FPS while preserving coherent geometry, appearance, and dynamics across long rollouts. Beyond image-to-video generation, Wonder naturally supports video-conditioned generation, allowing existing dynamic scenes to be re-shot in real time.", "arxiv_id": "2607.26037", "arxiv_url": "https://arxiv.org/abs/2607.26037", "authors": ["Jiacong Xu", "Hanwen Jiang", "Zhixin Shu", "Kalyan Sunkavalli", "Vishal M. Patel", "Yiqun Mei"], "brief": "Wonder \u662f\u4e00\u4e2a\u901a\u7528\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u4ece\u56fe\u50cf\u6216\u6761\u4ef6\u89c6\u9891\u6784\u5efa\u53ef\u4ea4\u4e92\u63a2\u7d22\u7684\u201c\u53ef\u73a9\u4e16\u754c\u201d\u3002\u7528\u6237\u80fd\u901a\u8fc7\u63a7\u5236\u76f8\u673a\u5b9e\u65f6\u5bfc\u822a\u3001\u53d1\u73b0\u672a\u89c1\u533a\u57df\uff0c\u5e76\u5728\u957f\u65f6\u95f4\u751f\u6210\u4e2d\u4fdd\u6301\u573a\u666f\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26037", "impact_score": 9, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u57fa\u4e8e\u5bc6\u96c6\u5750\u6807\u573a\u7684\u76f8\u673a\u6761\u4ef6\u63a7\u5236\uff0c\u4f7f\u6a21\u578b\u80fd\u5c06\u76f8\u673a\u8fd0\u52a8\u76f4\u63a5\u7406\u89e3\u4e3a\u89c6\u89c9\u5bf9\u9f50\u7684\u8fd0\u52a8\u4e0e\u671d\u5411\u7ebf\u7d22", "\u8bbe\u8ba1\u7a00\u758f\u6ce8\u610f\u529b\u8bb0\u5fc6\u673a\u5236\uff0c\u5728\u4e0a\u4e0b\u6587\u6301\u7eed\u589e\u957f\u65f6\u4ecd\u80fd\u9ad8\u6548\u68c0\u7d22\u76f8\u5173\u5386\u53f2 token\uff0c\u652f\u6301\u957f\u7a0b\u4e00\u81f4\u751f\u6210", "\u6539\u8fdb self-forcing \u5f0f\u84b8\u998f\u6d41\u7a0b\uff0c\u589e\u5f3a\u5b66\u751f\u6a21\u578b\u5bf9\u63a7\u5236\u4fe1\u53f7\u7684\u9075\u5faa\u80fd\u529b\uff0c\u540c\u65f6\u4fdd\u7559\u591a\u6837\u6027\u4e0e\u957f\u671f\u8bb0\u5fc6"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u5b9e\u65f6\u4ea4\u4e92"], "num_comments": 0, "on_hf": true, "organization": "Adobe", "pdf_url": "https://arxiv.org/pdf/2607.26037v1", "published_at": "2026-07-28", "score": 0.243, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.26037.png", "title": "Wonder: Video World Model Done Better", "tldr": "\u5b9e\u65f6\u53ef\u63a7\u7684\u957f\u7a0b\u89c6\u9891\u4e16\u754c\u6a21\u578b", "upvotes": 1, "what_it_is": "Wonder \u662f\u4e00\u4e2a\u901a\u7528\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u4ece\u56fe\u50cf\u6216\u6761\u4ef6\u89c6\u9891\u6784\u5efa\u53ef\u4ea4\u4e92\u63a2\u7d22\u7684\u201c\u53ef\u73a9\u4e16\u754c\u201d\u3002\u7528\u6237\u80fd\u901a\u8fc7\u63a7\u5236\u76f8\u673a\u5b9e\u65f6\u5bfc\u822a\u3001\u53d1\u73b0\u672a\u89c1\u533a\u57df\uff0c\u5e76\u5728\u957f\u65f6\u95f4\u751f\u6210\u4e2d\u4fdd\u6301\u573a\u666f\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u89c6\u9891\u751f\u6210\u63a8\u8fdb\u5230\u5b9e\u65f6\u3001\u53ef\u63a7\u3001\u957f\u65f6\u7a0b\u7684\u4e16\u754c\u63a2\u7d22\u5f62\u6001\uff0c\u80fd\u4ee5 16 FPS \u751f\u6210\u5206\u949f\u7ea7\u89c6\u9891\uff0c\u5e76\u4fdd\u6301\u51e0\u4f55\u3001\u5916\u89c2\u548c\u52a8\u6001\u4e00\u81f4\u6027\uff0c\u5bf9\u4ea4\u4e92\u5f0f\u4eff\u771f\u3001\u6e38\u620f\u5185\u5bb9\u751f\u6210\u548c\u5177\u8eab\u667a\u80fd\u73af\u5883\u5efa\u6a21\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Vision-Language Models (LVLMs) remain bottlenecked by massive computational footprints, precluding their deployment on resource-constrained edge devices. While efforts to compress LVLMs focus heavily on vision token reduction or smaller language models, the vision encoder is largely overlooked, typically deployed as a monolithic, computationally heavy feature extractor. Moreover, there is no previous effort that designs a vision encoder for LVLMs directly optimized for on-device latency. In this paper, we present UltraViT, a vision encoder for LVLMs, explicitly designed and optimized for on-device performance. Specifically, by taking into account real on-device latencies, we systematically design a pyramidal architecture that strategically integrates and adapts heterogeneous spatial mixers at the macro-block level. Furthermore, to pre-train UltraViT, we propose a novel two-stage generative pre-training strategy: cultivating rich spatial features via dense distillation, followed by direct generative supervision from a capacity-mixed frozen LLM. Compared to standard contrastive and SSL, we show that our pre-training is much more effective for achieving high-level semantic grounding for UltraViT needed for the subsequent generative multimodal alignment of LVLM training. Extensive experiments demonstrate that our on-device latency-informed design combined with our tailored training strategy establishes a new state-of-the-art for efficient LVLM encoding, significantly outperforming existing encoder-centric baselines while operating on-device at nearly 1.7xthe speed.", "arxiv_id": "2607.23373", "arxiv_url": "https://arxiv.org/abs/2607.23373", "authors": ["Ioannis Maniadis Metaxas", "Adrian Bulat", "Alberto Baldrati", "Anestis Zaganidis", "Yassine Ouali", "Hyeonuk Kim", "Georgios Tzimiropoulos"], "brief": "\u8bba\u6587\u63d0\u51fa UltraViT\uff0c\u4e00\u79cd\u4e13\u4e3a\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7aef\u4fa7\u90e8\u7f72\u8bbe\u8ba1\u7684\u89c6\u89c9\u7f16\u7801\u5668\u3002\u5b83\u57fa\u4e8e\u771f\u5b9e\u8bbe\u5907\u5ef6\u8fdf\u4f18\u5316\u91d1\u5b57\u5854\u5f0f\u67b6\u6784\uff0c\u5e76\u914d\u5957\u4e24\u9636\u6bb5\u751f\u6210\u5f0f\u9884\u8bad\u7ec3\uff0c\u4ee5\u63d0\u5347\u4f4e\u7b97\u529b\u573a\u666f\u4e0b\u7684\u591a\u6a21\u6001\u8bed\u4e49\u5bf9\u9f50\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.23373", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u771f\u5b9e\u7aef\u4fa7\u5ef6\u8fdf\u51fa\u53d1\u8bbe\u8ba1\u67b6\u6784\uff0c\u5728\u5b8f\u5757\u5c42\u9762\u878d\u5408\u5e76\u9002\u914d\u5f02\u6784\u7a7a\u95f4\u6df7\u5408\u5668\uff0c\u964d\u4f4e\u89c6\u89c9\u7f16\u7801\u5f00\u9500", "\u63d0\u51fa\u4e24\u9636\u6bb5\u751f\u6210\u5f0f\u9884\u8bad\u7ec3\uff1a\u5148\u7528\u5bc6\u96c6\u84b8\u998f\u5b66\u4e60\u7a7a\u95f4\u7279\u5f81\uff0c\u518d\u7531\u51bb\u7ed3\u7684\u6df7\u5408\u5bb9\u91cfLLM\u63d0\u4f9b\u751f\u6210\u5f0f\u76d1\u7763", "\u76f8\u6bd4\u5bf9\u6bd4\u5b66\u4e60\u548c\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\u65b9\u6cd5\uff0cUltraViT \u66f4\u9002\u5408\u540e\u7eedLVLM\u751f\u6210\u5f0f\u591a\u6a21\u6001\u5bf9\u9f50\uff0c\u7aef\u4fa7\u901f\u5ea6\u7ea6\u63d0\u53471.7\u500d"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7aef\u4fa7\u90e8\u7f72", "\u6a21\u578b\u538b\u7f29", "\u89c6\u89c9\u7f16\u7801\u5668"], "num_comments": 1, "on_hf": true, "organization": "Samsung Research", "pdf_url": "https://arxiv.org/pdf/2607.23373v1", "published_at": "2026-07-25", "score": 0.233, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23373.png", "title": "UltraViT: Latency-Optimized On-device Vision Encoder for Large Vision-Language Models", "tldr": "\u9762\u5411\u7aef\u4fa7LVLM\u7684\u4f4e\u5ef6\u8fdf\u89c6\u89c9\u7f16\u7801\u5668", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa UltraViT\uff0c\u4e00\u79cd\u4e13\u4e3a\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7aef\u4fa7\u90e8\u7f72\u8bbe\u8ba1\u7684\u89c6\u89c9\u7f16\u7801\u5668\u3002\u5b83\u57fa\u4e8e\u771f\u5b9e\u8bbe\u5907\u5ef6\u8fdf\u4f18\u5316\u91d1\u5b57\u5854\u5f0f\u67b6\u6784\uff0c\u5e76\u914d\u5957\u4e24\u9636\u6bb5\u751f\u6210\u5f0f\u9884\u8bad\u7ec3\uff0c\u4ee5\u63d0\u5347\u4f4e\u7b97\u529b\u573a\u666f\u4e0b\u7684\u591a\u6a21\u6001\u8bed\u4e49\u5bf9\u9f50\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06LVLM\u6548\u7387\u4f18\u5316\u7684\u7126\u70b9\u4ece\u5e38\u89c1\u7684\u89c6\u89c9token\u538b\u7f29\u548c\u5c0f\u8bed\u8a00\u6a21\u578b\u8f6c\u5411\u88ab\u5ffd\u89c6\u7684\u89c6\u89c9\u7f16\u7801\u5668\uff0c\u5e76\u9996\u6b21\u663e\u5f0f\u9488\u5bf9\u7aef\u4fa7\u5ef6\u8fdf\u8fdb\u884c\u8bbe\u8ba1\uff0c\u5bf9\u79fb\u52a8\u7aef\u548c\u8fb9\u7f18\u8bbe\u5907\u90e8\u7f72LVLM\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Improving a language model today means retraining it: enormous compute, a new opaque model each cycle, non-deterministic output. We take the opposite path: the model stays frozen, and a persistent memory of verified solutions grows beside it. Once a problem family is solved and has passed an independent verification step that never consults the answer key, every new instance of that family is answered at zero generation tokens, bit-exact, deterministically. Across 180 fresh instances spanning nine problem families, four architectures from four vendors - dense and mixture-of-experts - each score 180/180 at zero generation tokens per answer: execution-bound capability decoupled from parameter scaling. A negative control attributes the capability fully to the memory: emptied, it solves nothing. The same verify-before-store contract holds for open-ended reasoning: 88/88 consistency-gated acceptances across all four models, machine-checked formal proof, and reasoning-method transfer at 77/80. Memory selection takes 1.4 microseconds; a full reuse completes in 6-23 ms at 36 mWh. Approximate similarity retrieval selects the wrong item 94.3% of the time on a 4,500-item verified store where exact addressing makes zero errors. The store also serves as working context at a scale no shipped engine matches: a 6,000,000-token movable window on a single 46 GB GPU at flat memory, where vLLM stops at 30,399 tokens and SGLang silently truncates past 32,000. On published benchmarks, frontier models remain far ahead of any 12B at raw from-scratch reasoning; on everything this system has solved and verified, the comparison inverts: a frontier API call pays a fresh generation pass on every query, forever, while verified reuse costs zero tokens and returns the identical bits every time. A public testbench with free, rate-limited access accompanies this report: https://corbenic-galahad-bench.hf.space", "arxiv_id": "2607.23806", "arxiv_url": "https://arxiv.org/abs/2607.23806", "authors": ["Sietse Schelpe"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u8ba9\u8bed\u8a00\u6a21\u578b\u4fdd\u6301\u51bb\u7ed3\u3001\u65c1\u8def\u7ef4\u62a4\u201c\u5df2\u9a8c\u8bc1\u89e3\u7b54\u8bb0\u5fc6\u5e93\u201d\u7684\u65b9\u6cd5\u3002\u5bf9\u5df2\u88ab\u72ec\u7acb\u9a8c\u8bc1\u7684\u95ee\u9898\u65cf\uff0c\u65b0\u5b9e\u4f8b\u53ef\u901a\u8fc7\u7cbe\u786e\u5bfb\u5740\u76f4\u63a5\u590d\u7528\u7b54\u6848\uff0c\u5b9e\u73b0\u96f6\u751f\u6210token\u3001\u786e\u5b9a\u6027\u4e14bit\u7ea7\u4e00\u81f4\u7684\u8f93\u51fa\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR", "cs.LG", "cs.PF"], "github_repo": "https://github.com/corbenicai/galahad-bench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.23806", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57289\u7c7b\u95ee\u9898\u3001180\u4e2a\u65b0\u5b9e\u4f8b\u4e0a\uff0c\u6765\u81ea4\u5bb6\u5382\u5546\u76844\u79cd12B\u67b6\u6784\u5747\u8fbe\u5230180/180\uff0c\u4e14\u6bcf\u4e2a\u7b54\u6848\u96f6\u751f\u6210token\u3002", "\u8d1f\u5bf9\u7167\u663e\u793a\u80fd\u529b\u5b8c\u5168\u6765\u81ea\u9a8c\u8bc1\u8bb0\u5fc6\u5e93\uff1a\u6e05\u7a7a\u8bb0\u5fc6\u540e\u65e0\u6cd5\u6c42\u89e3\uff1b\u5f00\u653e\u5f0f\u63a8\u7406\u4e2d\u62a5\u544a88/88\u4e00\u81f4\u6027\u95e8\u63a7\u901a\u8fc7\uff0c\u5e76\u652f\u6301\u5f62\u5f0f\u5316\u673a\u5668\u68c0\u67e5\u8bc1\u660e\u3002", "\u7cbe\u786e\u5bfb\u5740\u57284500\u9879\u9a8c\u8bc1\u5e93\u4e2d\u96f6\u9519\u8bef\uff0c\u800c\u8fd1\u4f3c\u76f8\u4f3c\u68c0\u7d22\u9519\u8bef\u7387\u8fbe94.3%\uff1b\u590d\u7528\u5ef6\u8fdf6-23\u6beb\u79d2\uff0c\u80fd\u8017\u7ea636 mWh\u3002"], "keywords": ["\u8bb0\u5fc6\u589e\u5f3a", "\u68c0\u7d22\u589e\u5f3a", "\u53ef\u9a8c\u8bc1\u63a8\u7406", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "Corbenic", "pdf_url": "https://arxiv.org/pdf/2607.23806v1", "published_at": "2026-07-26", "score": 0.232, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23806.png", "title": "A Frozen 12B Beats Frontier Models on Verified Work: 100% Accuracy, 0 Tokens, Bit-Exact, Forever", "tldr": "\u51bb\u7ed3\u6a21\u578b\u501f\u9a8c\u8bc1\u8bb0\u5fc6\u5b9e\u73b0\u96f6token\u7cbe\u786e\u590d\u7528", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u8ba9\u8bed\u8a00\u6a21\u578b\u4fdd\u6301\u51bb\u7ed3\u3001\u65c1\u8def\u7ef4\u62a4\u201c\u5df2\u9a8c\u8bc1\u89e3\u7b54\u8bb0\u5fc6\u5e93\u201d\u7684\u65b9\u6cd5\u3002\u5bf9\u5df2\u88ab\u72ec\u7acb\u9a8c\u8bc1\u7684\u95ee\u9898\u65cf\uff0c\u65b0\u5b9e\u4f8b\u53ef\u901a\u8fc7\u7cbe\u786e\u5bfb\u5740\u76f4\u63a5\u590d\u7528\u7b54\u6848\uff0c\u5b9e\u73b0\u96f6\u751f\u6210token\u3001\u786e\u5b9a\u6027\u4e14bit\u7ea7\u4e00\u81f4\u7684\u8f93\u51fa\u3002", "why_notable": "\u5b83\u628a\u201c\u80fd\u529b\u63d0\u5347\u201d\u4ece\u53c2\u6570\u6269\u5c55\u548c\u91cd\u65b0\u8bad\u7ec3\u8f6c\u5411\u53ef\u9a8c\u8bc1\u8bb0\u5fc6\u590d\u7528\uff0c\u5f3a\u8c03\u786e\u5b9a\u6027\u3001\u4f4e\u6210\u672c\u548c\u957f\u671f\u590d\u73b0\u6027\uff1b\u82e5\u7ed3\u679c\u53ef\u9760\uff0c\u53ef\u80fd\u5f71\u54cdLLM\u5728\u53ef\u9a8c\u8bc1\u4efb\u52a1\u3001\u4f01\u4e1a\u77e5\u8bc6\u5e93\u548c\u9ad8\u53ef\u9760\u63a8\u7406\u7cfb\u7edf\u4e2d\u7684\u90e8\u7f72\u65b9\u5f0f\u3002"}, {"abstract": "AI coding agents are being adopted at historic speed, yet security and risk concerns remain the primary barrier to scaling agentic AI across organizations. Existing security controls for coding agents are not systematically distributed to engineering teams, and vendor-native solutions introduce ecosystem dependencies that may not suit every deployment context. This paper investigates whether off-the-shelf security controls can be implemented on commercial AI coding agents and scaled to a distributed user base via a custom agent harness. A phased testing methodology was applied across four agent configurations --- two commercial agents with and without controls, a baseline harness, and a security-hardened harness --- using a 23-test suite derived from the OWASP Top 10 for Agentic Applications. SHarD (Secure Harness Distribution), a distributable harness built on the Pi agent harness, demonstrated that three categories of security controls --- OS sandboxing, skill scanning, and tool restriction --- can be embedded and distributed via a single install command while retaining equivalent efficacy to direct installation on commercial agents. SHarD achieved an adjusted score of 100\\%, matching the best securely configured commercial agent, with no regression across any test category. Notable observations include evidence that model non-determinism produces inconsistent security outcomes and that autonomous agent behavior can cross system boundaries in ways that OS sandboxing directly mitigates. Initial characteristics toward a control harness fitness framework are proposed, and a third research question is identified for future investigation.", "arxiv_id": "2607.25890", "arxiv_url": "https://arxiv.org/abs/2607.25890", "authors": ["William Robert Gore"], "brief": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u901a\u8fc7\u81ea\u5b9a\u4e49\u667a\u80fd\u4f53 harness \u5c06\u73b0\u6210\u5b89\u5168\u63a7\u5236\u5206\u53d1\u5230\u5546\u4e1a AI \u7f16\u7a0b\u667a\u80fd\u4f53\u4e2d\uff0c\u907f\u514d\u4f9d\u8d56\u5382\u5546\u539f\u751f\u65b9\u6848\u3002\u63d0\u51fa\u7684 SHarD \u96c6\u6210\u4e86\u64cd\u4f5c\u7cfb\u7edf\u6c99\u7bb1\u3001\u6280\u80fd\u626b\u63cf\u548c\u5de5\u5177\u9650\u5236\uff0c\u5728\u57fa\u4e8e OWASP Agentic Applications Top 10 \u7684 23 \u9879\u6d4b\u8bd5\u4e2d\u8fbe\u5230 100% \u8c03\u6574\u5f97\u5206\uff0c\u4e0e\u6700\u4f73\u5b89\u5168\u914d\u7f6e\u5546\u4e1a\u667a\u80fd\u4f53\u6301\u5e73\u4e14\u65e0\u56de\u5f52\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25890", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u5b89\u5168", "\u6c99\u7bb1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.25890v1", "published_at": "2026-07-28", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Distributing Security Controls Through Harness Engineering", "tldr": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u901a\u8fc7\u81ea\u5b9a\u4e49\u667a\u80fd\u4f53 harness \u5c06\u73b0\u6210\u5b89\u5168\u63a7\u5236\u5206\u53d1\u5230\u5546\u4e1a AI \u7f16\u7a0b\u667a\u80fd\u4f53\u4e2d\uff0c\u907f\u514d\u4f9d\u8d56\u5382\u5546\u539f\u751f\u65b9\u6848\u3002\u63d0\u51fa\u7684 SHarD \u96c6\u6210\u4e86\u64cd\u4f5c\u7cfb\u7edf\u6c99\u7bb1\u3001\u6280\u80fd\u626b\u63cf\u548c\u5de5\u5177\u9650\u5236\uff0c\u5728\u57fa\u4e8e OWASP Agentic Applications Top 10 \u7684 23 \u9879\u6d4b\u8bd5\u4e2d\u8fbe\u5230 100% \u8c03\u6574\u5f97\u5206\uff0c\u4e0e\u6700\u4f73\u5b89\u5168\u914d\u7f6e\u5546\u4e1a\u667a\u80fd\u4f53\u6301\u5e73\u4e14\u65e0\u56de\u5f52\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many recent robot policies pursue stronger control by using large pretrained vision-language models (VLMs) as the action backbone. We introduce WorldDiT, a unified diffusion transformer architecture that couples action generation with visual world modeling and achieves strong performance without a large pretrained VLM action backbone. During training, a single diffusion transformer generates continuous action chunks and predicts normalized RGB patch targets from future camera frames. Across four LIBERO simulation suites, WorldDiT lies on the reported Pareto frontier for total model parameters and mean success among methods reporting all four suites. These results provide a strong sub-billion-parameter baseline for future scaling studies.", "arxiv_id": "2607.23909", "arxiv_url": "https://arxiv.org/abs/2607.23909", "authors": ["Sen Wang", "R. Gnana Praveen", "Bidhan Roy", "Marcos Villagra"], "brief": "\u8bba\u6587\u63d0\u51fa WorldDiT\uff0c\u4e00\u79cd\u7edf\u4e00\u6269\u6563 Transformer \u67b6\u6784\uff0c\u540c\u65f6\u751f\u6210\u8fde\u7eed\u673a\u5668\u4eba\u52a8\u4f5c\u7247\u6bb5\u5e76\u9884\u6d4b\u672a\u6765\u76f8\u673a\u5e27\u7684 RGB patch\u3002\u5b83\u5728\u4e0d\u4f9d\u8d56\u5927\u578b\u9884\u8bad\u7ec3 VLM \u4f5c\u4e3a\u52a8\u4f5c\u9aa8\u5e72\u7684\u60c5\u51b5\u4e0b\uff0c\u5728 LIBERO \u591a\u4e2a\u4eff\u771f\u4efb\u52a1\u4e0a\u53d6\u5f97\u5f3a\u6027\u80fd\u3002", "categories": ["cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.23909", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5355\u4e2a\u6269\u6563 Transformer \u540c\u65f6\u627f\u62c5\u52a8\u4f5c\u751f\u6210\u4e0e\u89c6\u89c9\u4e16\u754c\u5efa\u6a21\uff0c\u5b9e\u73b0\u52a8\u4f5c\u7b56\u7565\u548c\u672a\u6765\u89c2\u6d4b\u9884\u6d4b\u7684\u8026\u5408\u8bad\u7ec3", "\u8bad\u7ec3\u76ee\u6807\u5305\u62ec\u8fde\u7eed action chunks \u751f\u6210\uff0c\u4ee5\u53ca\u6765\u81ea\u672a\u6765\u76f8\u673a\u5e27\u7684\u5f52\u4e00\u5316 RGB patch \u9884\u6d4b", "\u5728\u56db\u4e2a LIBERO \u4eff\u771f\u5957\u4ef6\u4e0a\uff0cWorldDiT \u5728\u6a21\u578b\u53c2\u6570\u91cf\u4e0e\u5e73\u5747\u6210\u529f\u7387\u4e4b\u95f4\u8fbe\u5230\u5df2\u62a5\u544a\u65b9\u6cd5\u7684 Pareto \u524d\u6cbf"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6269\u6563\u6a21\u578b", "\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Bagel Labs", "pdf_url": "https://arxiv.org/pdf/2607.23909v1", "published_at": "2026-07-27", "score": 0.221, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23909.png", "title": "WorldDiT: A Unified Diffusion Architecture for World and Action Modeling", "tldr": "\u7edf\u4e00\u6269\u6563Transformer\u5efa\u6a21\u673a\u5668\u4eba\u52a8\u4f5c\u4e0e\u89c6\u89c9\u4e16\u754c", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldDiT\uff0c\u4e00\u79cd\u7edf\u4e00\u6269\u6563 Transformer \u67b6\u6784\uff0c\u540c\u65f6\u751f\u6210\u8fde\u7eed\u673a\u5668\u4eba\u52a8\u4f5c\u7247\u6bb5\u5e76\u9884\u6d4b\u672a\u6765\u76f8\u673a\u5e27\u7684 RGB patch\u3002\u5b83\u5728\u4e0d\u4f9d\u8d56\u5927\u578b\u9884\u8bad\u7ec3 VLM \u4f5c\u4e3a\u52a8\u4f5c\u9aa8\u5e72\u7684\u60c5\u51b5\u4e0b\uff0c\u5728 LIBERO \u591a\u4e2a\u4eff\u771f\u4efb\u52a1\u4e0a\u53d6\u5f97\u5f3a\u6027\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u4e0d\u4f9d\u8d56\u5927\u89c4\u6a21 VLM \u52a8\u4f5c\u9aa8\u5e72\u4e5f\u80fd\u83b7\u5f97\u5f3a\u673a\u5668\u4eba\u63a7\u5236\u6027\u80fd\uff0c\u4e3a\u4e9a\u5341\u4ebf\u53c2\u6570\u7ea7\u673a\u5668\u4eba\u7b56\u7565\u548c\u540e\u7eed\u6269\u5c55\u7814\u7a76\u63d0\u4f9b\u4e86\u6709\u7ade\u4e89\u529b\u7684\u57fa\u7ebf\u3002"}, {"abstract": "We introduce Shieldstral, a 3B-parameter policy-adaptive multimodal safety classifier that matches or outperforms models nearly 7$\\times$ its size on text safety benchmarks and sets a new state of the art on multimodal safety classification. Shieldstral formulates content moderation as a binary question-answering task. This simple formulation unifies diverse moderation tasks into a single yes/no problem, enabling heterogeneous safety datasets with divergent taxonomies to be consolidated under one training framework. We present the data construction recipe, covering curation and generation of approximately 54.1M samples and a fine-grained evaluation set to evaluate policy adaptability. Together, these enable a small adaptive model to match or outperform much larger models.", "arxiv_id": "2607.25857", "arxiv_url": "https://arxiv.org/abs/2607.25857", "authors": ["Antonia Calvi", "Avinash Sooriyarachchi", "Giada Pistilli", "Guillaume Lample", "Maarten Buyl", "Maximilian Augustin", "Maximilian M\u00fcller", "Pierre Stock", "Tom Bewley", "Wassim Bouaziz", "Yimu Pan"], "brief": "\u672c\u6587\u63d0\u51fa Shieldstral\uff0c\u4e00\u4e2a 3B \u53c2\u6570\u7684\u7b56\u7565\u81ea\u9002\u5e94\u591a\u6a21\u6001\u5b89\u5168\u5206\u7c7b\u5668\u3002\u5b83\u5c06\u5185\u5bb9\u5ba1\u6838\u7edf\u4e00\u8868\u8ff0\u4e3a\u4e8c\u5143\u95ee\u7b54\u4efb\u52a1\uff0c\u4ece\u800c\u628a\u4e0d\u540c\u5b89\u5168\u5206\u7c7b\u4f53\u7cfb\u7684\u6570\u636e\u6574\u5408\u5230\u540c\u4e00\u8bad\u7ec3\u6846\u67b6\u4e2d\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.25857", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u628a\u6587\u672c\u4e0e\u591a\u6a21\u6001\u5185\u5bb9\u5ba1\u6838\u7edf\u4e00\u4e3a\u201c\u662f/\u5426\u201d\u95ee\u7b54\uff0c\u964d\u4f4e\u4e0d\u540c\u5b89\u5168\u653f\u7b56\u4e0e\u6807\u7b7e\u4f53\u7cfb\u4e4b\u95f4\u7684\u9002\u914d\u6210\u672c", "\u6784\u5efa\u7ea6 5410 \u4e07\u6761\u8bad\u7ec3\u6837\u672c\uff0c\u6db5\u76d6\u4eba\u5de5\u6574\u7406\u4e0e\u751f\u6210\u6570\u636e\uff0c\u5e76\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u8bc4\u6d4b\u96c6\u8861\u91cf\u7b56\u7565\u9002\u5e94\u6027", "\u5728\u6587\u672c\u5b89\u5168\u57fa\u51c6\u4e0a\u5339\u914d\u6216\u8d85\u8fc7\u63a5\u8fd1 7 \u500d\u89c4\u6a21\u7684\u6a21\u578b\uff0c\u5e76\u5728\u591a\u6a21\u6001\u5b89\u5168\u5206\u7c7b\u4e0a\u8fbe\u5230\u65b0 SOTA"], "keywords": ["\u591a\u6a21\u6001", "\u5185\u5bb9\u5b89\u5168", "\u5206\u7c7b\u6a21\u578b", "\u6570\u636e\u6784\u5efa"], "num_comments": 0, "on_hf": true, "organization": "Mistral AI_", "pdf_url": "https://arxiv.org/pdf/2607.25857v1", "published_at": "2026-07-28", "score": 0.218, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.25857.png", "title": "Shieldstral", "tldr": "3B\u591a\u6a21\u6001\u5b89\u5168\u5206\u7c7b\u5668\u4ee5\u5c0f\u80dc\u5927", "upvotes": 1, "what_it_is": "\u672c\u6587\u63d0\u51fa Shieldstral\uff0c\u4e00\u4e2a 3B \u53c2\u6570\u7684\u7b56\u7565\u81ea\u9002\u5e94\u591a\u6a21\u6001\u5b89\u5168\u5206\u7c7b\u5668\u3002\u5b83\u5c06\u5185\u5bb9\u5ba1\u6838\u7edf\u4e00\u8868\u8ff0\u4e3a\u4e8c\u5143\u95ee\u7b54\u4efb\u52a1\uff0c\u4ece\u800c\u628a\u4e0d\u540c\u5b89\u5168\u5206\u7c7b\u4f53\u7cfb\u7684\u6570\u636e\u6574\u5408\u5230\u540c\u4e00\u8bad\u7ec3\u6846\u67b6\u4e2d\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u5c0f\u89c4\u6a21\u6a21\u578b\u901a\u8fc7\u4efb\u52a1\u91cd\u6784\u3001\u6570\u636e\u6574\u5408\u548c\u7b56\u7565\u81ea\u9002\u5e94\u8bad\u7ec3\uff0c\u4e5f\u80fd\u5728\u5b89\u5168\u5ba1\u6838\u573a\u666f\u4e2d\u8fbe\u5230\u5f3a\u6027\u80fd\uff0c\u5bf9\u4f4e\u6210\u672c\u90e8\u7f72\u591a\u6a21\u6001\u5185\u5bb9\u5b89\u5168\u7cfb\u7edf\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Parametric retrieval enables LLMs to retrieve tools implicitly by assigning each API a unique virtual token and training the model to generate it via constrained beam search. Toolsense shows that this regime has two critical drawbacks: it destroys parametric tool knowledge during training, and its beam-search decoding is too slow for real-time deployment. We introduce TRACE (Tool Retrieval via Augmented Chain-of-thought and Enterprise rules), a two-stage curriculum that resolves this dissociation. Stage 1 reuses the multi-format memorization SFT from ToolSense to seed tool knowledge with LoRA. Stage 2 is our core contribution: the model is trained to emit a thinking trace before producing a JSON list of tool tokens, using two data sources -- RRB pairs from ToolSense and queries synthesized to target business rules curated by domain experts -- both augmented with reasoning traces. This training objective preserves Stage 1 MCQ and QA probing accuracy while enabling single-beam greedy decoding at production latency. Evaluated on a combined enterprise catalog of 8,300+ tools across two enterprise product lines, TRACE training for Stage 2 not only preserves but improves tool understanding: MCQ accuracy gains +3.2 pp and QA probing gains +9 pp over Stage 1. On retrieval, TRACE achieves ~86% recall on Domain A and ~60% on Domain B -- compared to embedding baseline performance of ~27% \u0026 ~52% -- both with single-beam greedy decoding, making it directly deployable at production latency.", "arxiv_id": "2607.22639", "arxiv_url": "https://arxiv.org/abs/2607.22639", "authors": ["Sai Shruthi Sistla", "Ashutosh Hathidara", "Christopher Toukmaji", "Mayank Shrivastava", "Karthikeyan Asokkumar"], "brief": "TRACE \u662f\u4e00\u79cd\u9762\u5411\u4f01\u4e1a LLM \u7684\u4e24\u9636\u6bb5\u5de5\u5177\u68c0\u7d22\u8bad\u7ec3\u8bfe\u7a0b\uff1a\u5148\u7528\u591a\u683c\u5f0f\u8bb0\u5fc6\u5f0f SFT \u6ce8\u5165\u5de5\u5177\u77e5\u8bc6\uff0c\u518d\u8bad\u7ec3\u6a21\u578b\u751f\u6210\u63a8\u7406\u8f68\u8ff9\u5e76\u8f93\u51fa\u5de5\u5177 token \u7684 JSON \u5217\u8868\u3002\u5b83\u7ed3\u5408 ToolSense \u7684 RRB \u6570\u636e\u4e0e\u4e13\u5bb6\u4e1a\u52a1\u89c4\u5219\u5408\u6210\u67e5\u8be2\uff0c\u5728\u4fdd\u7559\u53c2\u6570\u5316\u5de5\u5177\u77e5\u8bc6\u7684\u540c\u65f6\u652f\u6301\u8d2a\u5fc3\u89e3\u7801\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22639", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u9488\u5bf9\u53c2\u6570\u5316\u5de5\u5177\u68c0\u7d22\u4e2d\u5de5\u5177\u77e5\u8bc6\u88ab\u8bad\u7ec3\u7834\u574f\u3001beam search \u5ef6\u8fdf\u8fc7\u9ad8\u7684\u95ee\u9898\uff0c\u6539\u7528\u5e26 reasoning trace \u7684\u8bad\u7ec3\u76ee\u6807\u548c\u5355 beam \u8d2a\u5fc3\u89e3\u7801\u3002", "\u5728 8300+ \u4f01\u4e1a\u5de5\u5177\u76ee\u5f55\u4e0a\u8bc4\u6d4b\uff0cStage 2 \u540e MCQ \u51c6\u786e\u7387\u8f83 Stage 1 \u63d0\u5347 3.2 \u4e2a\u767e\u5206\u70b9\uff0cQA probing \u63d0\u5347 9 \u4e2a\u767e\u5206\u70b9\u3002", "\u68c0\u7d22\u53ec\u56de\u7387\u5728 Domain A \u8fbe\u7ea6 86%\u3001Domain B \u8fbe\u7ea6 60%\uff0c\u4f18\u4e8e embedding baseline \u7684\u7ea6 27% \u548c 52%\uff0c\u4e14\u5177\u5907\u751f\u4ea7\u5ef6\u8fdf\u53ef\u90e8\u7f72\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u4f01\u4e1aLLM", "\u53c2\u6570\u5316\u68c0\u7d22"], "num_comments": 1, "on_hf": true, "organization": "SAP", "pdf_url": "https://arxiv.org/pdf/2607.22639v1", "published_at": "2026-06-22", "score": 0.216, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.22639.png", "title": "TRACE: Business Rule-Grounded Reasoning Curriculum for Knowledge-Preserving Parametric Tool Retrieval in Enterprise LLMs", "tldr": "\u7528\u89c4\u5219\u63a8\u7406\u8bfe\u7a0b\u63d0\u5347\u4f01\u4e1aLLM\u5de5\u5177\u68c0\u7d22", "upvotes": 3, "what_it_is": "TRACE \u662f\u4e00\u79cd\u9762\u5411\u4f01\u4e1a LLM \u7684\u4e24\u9636\u6bb5\u5de5\u5177\u68c0\u7d22\u8bad\u7ec3\u8bfe\u7a0b\uff1a\u5148\u7528\u591a\u683c\u5f0f\u8bb0\u5fc6\u5f0f SFT \u6ce8\u5165\u5de5\u5177\u77e5\u8bc6\uff0c\u518d\u8bad\u7ec3\u6a21\u578b\u751f\u6210\u63a8\u7406\u8f68\u8ff9\u5e76\u8f93\u51fa\u5de5\u5177 token \u7684 JSON \u5217\u8868\u3002\u5b83\u7ed3\u5408 ToolSense \u7684 RRB \u6570\u636e\u4e0e\u4e13\u5bb6\u4e1a\u52a1\u89c4\u5219\u5408\u6210\u67e5\u8be2\uff0c\u5728\u4fdd\u7559\u53c2\u6570\u5316\u5de5\u5177\u77e5\u8bc6\u7684\u540c\u65f6\u652f\u6301\u8d2a\u5fc3\u89e3\u7801\u3002", "why_notable": "\u8bba\u6587\u628a\u4f01\u4e1a\u4e1a\u52a1\u89c4\u5219\u663e\u5f0f\u878d\u5165\u5de5\u5177\u68c0\u7d22\u8bad\u7ec3\uff0c\u5e76\u8bc1\u660e\u63a8\u7406\u8f68\u8ff9\u4e0d\u4ec5\u53ef\u63d0\u5347\u53ec\u56de\uff0c\u8fd8\u80fd\u4fdd\u7559\u751a\u81f3\u589e\u5f3a\u6a21\u578b\u7684\u53c2\u6570\u5316\u5de5\u5177\u77e5\u8bc6\uff1b\u5bf9\u5927\u89c4\u6a21\u4f01\u4e1a\u667a\u80fd\u4f53\u7684\u4f4e\u5ef6\u8fdf\u5de5\u5177\u8c03\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Language Models (LLMs) have transformed conversational AI, yet high-quality multilingual code-mixed dialogue resources remain scarce, particularly for Indic languages where speakers naturally alternate between English and their native language in both native-script and Romanized forms. We present IndicTalk, one of the largest multilingual Indic code-mixed conversational corpora, comprising over 13,28,604 event-grounded multi-turn conversations across 18 language varieties covering 9 Indic languages. The corpus is generated through a fully automated pipeline that combines real-world news grounding, persona-conditioned dialogue generation using multilingual LLMs, and automatic quality validation. Extensive linguistic, automatic, and human evaluations demonstrate that IndicTalk produces fluent, coherent, and naturally code-mixed conversations across both script variants. We will release IndicTalk to support the development and evaluation of multilingual conversational AI for underrepresented Indic languages. The dataset is available at: https://huggingface.co/datasets/LingoIITGN/IndicTalk .", "arxiv_id": "2607.23242", "arxiv_url": "https://arxiv.org/abs/2607.23242", "authors": ["Sahil Deepak Gawande", "Mayank Singh"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 IndicTalk\uff0c\u4e00\u4e2a\u8986\u76d69\u79cd\u5370\u5ea6\u8bed\u8a00\u300118\u79cd\u8bed\u8a00\u53d8\u4f53\u7684\u5927\u89c4\u6a21\u591a\u8bed\u6df7\u7801\u591a\u8f6e\u5bf9\u8bdd\u8bed\u6599\u3002\u6570\u636e\u901a\u8fc7\u65b0\u95fb\u4e8b\u4ef6 grounding\u3001\u4eba\u683c\u6761\u4ef6\u5bf9\u8bdd\u751f\u6210\u4e0e\u81ea\u52a8\u8d28\u91cf\u9a8c\u8bc1\u6d41\u6c34\u7ebf\u751f\u6210\uff0c\u5305\u542b\u8d85\u8fc7132\u4e07\u6bb5\u5bf9\u8bdd\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.23242", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d6\u82f1\u8bed\u4e0e\u5370\u5ea6\u672c\u571f\u8bed\u8a00\u81ea\u7136\u6df7\u7801\u573a\u666f\uff0c\u540c\u65f6\u5305\u542b\u672c\u571f\u6587\u5b57\u548c\u7f57\u9a6c\u5316\u4e66\u5199\u5f62\u5f0f", "\u91c7\u7528\u591a\u8bedLLM\u57fa\u4e8e\u771f\u5b9e\u65b0\u95fb\u4e8b\u4ef6\u548c persona \u81ea\u52a8\u751f\u6210\u591a\u8f6e\u5bf9\u8bdd\uff0c\u5e76\u8fdb\u884c\u81ea\u52a8\u8d28\u91cf\u7b5b\u9009", "\u901a\u8fc7\u8bed\u8a00\u5b66\u5206\u6790\u3001\u81ea\u52a8\u6307\u6807\u548c\u4eba\u5de5\u8bc4\u4f30\u9a8c\u8bc1\u8bed\u6599\u5728\u6d41\u7545\u6027\u3001\u8fde\u8d2f\u6027\u548c\u6df7\u7801\u81ea\u7136\u5ea6\u4e0a\u7684\u8d28\u91cf"], "keywords": ["\u591a\u8bed\u79cd", "\u5bf9\u8bdd\u6570\u636e", "\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u6570\u636e\u96c6"], "num_comments": 1, "on_hf": true, "organization": "Lingo Research Group", "pdf_url": "https://arxiv.org/pdf/2607.23242v1", "published_at": "2026-07-25", "score": 0.208, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23242.png", "title": "IndicTalk: A Large-Scale Persona-Based Multilingual Conversational Corpus for Indic Languages", "tldr": "\u9762\u5411\u5370\u5ea6\u8bed\u8a00\u7684\u5927\u89c4\u6a21\u4eba\u683c\u5316\u6df7\u7801\u5bf9\u8bdd\u8bed\u6599\u3002", "upvotes": 2, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 IndicTalk\uff0c\u4e00\u4e2a\u8986\u76d69\u79cd\u5370\u5ea6\u8bed\u8a00\u300118\u79cd\u8bed\u8a00\u53d8\u4f53\u7684\u5927\u89c4\u6a21\u591a\u8bed\u6df7\u7801\u591a\u8f6e\u5bf9\u8bdd\u8bed\u6599\u3002\u6570\u636e\u901a\u8fc7\u65b0\u95fb\u4e8b\u4ef6 grounding\u3001\u4eba\u683c\u6761\u4ef6\u5bf9\u8bdd\u751f\u6210\u4e0e\u81ea\u52a8\u8d28\u91cf\u9a8c\u8bc1\u6d41\u6c34\u7ebf\u751f\u6210\uff0c\u5305\u542b\u8d85\u8fc7132\u4e07\u6bb5\u5bf9\u8bdd\u3002", "why_notable": "IndicTalk \u8865\u8db3\u4e86\u5370\u5ea6\u4f4e\u8d44\u6e90\u8bed\u8a00\u4e2d\u9ad8\u8d28\u91cf\u6df7\u7801\u5bf9\u8bdd\u6570\u636e\u7684\u7a7a\u7f3a\uff0c\u53ef\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u4f30\u66f4\u8d34\u8fd1\u771f\u5b9e\u4f7f\u7528\u573a\u666f\u7684\u591a\u8bed\u79cd\u5bf9\u8bdd\u6a21\u578b\u3002"}, {"abstract": "Since Volta introduced Independent Thread Scheduling (ITS), NVIDIA GPUs have been widely assumed to handle warp divergence in a fixed manner. We test this assumption across Ampere, Hopper, and datacenter and consumer Blackwell GPUs, using pre-ITS Pascal as a baseline. Combining cycle-accurate microbenchmarks, hardware counters, and static analysis of compiler-generated SASS, we separate stable behavior from architectural change. Across all tested generations, divergent paths serialize linearly with the number of paths $k$, following $T(k) \\approx sk$ with no super-linear reconvergence penalty. Warp execution efficiency falls as $32/k$, the penalty is independent of occupancy, and predication removes the serialization cost. The same behavior appears on Pascal, showing that this programmer-visible cost model predates ITS. The compiler-emitted reconvergence machinery, however, has changed substantially. Pascal uses a per-warp SSY/SYNC instruction stack, whereas later generations use barrier-register instructions. Deferred reconvergence beyond the immediate post-dominator falls from 29 cases on Ampere to 2 on Blackwell. Blackwell also introduces a two-tier convergence-barrier classification, uniform-branch instructions, and explicit partial-mask warp synchronization, none of which appear on Ampere or Hopper. Controlled bit-flip experiments indicate that the new barrier class is a static compiler classification with no observable runtime effect in our tests. Thus, divergence retains a stable and predictable performance cost even as NVIDIA\u0027s control-flow ISA and reconvergence mechanisms continue to evolve.", "arxiv_id": "2607.23402", "arxiv_url": "https://arxiv.org/abs/2607.23402", "authors": ["Alpin Dale"], "brief": "\u672c\u6587\u7cfb\u7edf\u6d4b\u8bd5Pascal\u5230Blackwell\u591a\u4ee3NVIDIA GPU\u7684warp\u5206\u652f\u53d1\u6563\u884c\u4e3a\uff0c\u7ed3\u5408\u5fae\u57fa\u51c6\u3001\u786c\u4ef6\u8ba1\u6570\u5668\u548cSASS\u9759\u6001\u5206\u6790\u523b\u753b\u6027\u80fd\u6a21\u578b\u4e0eISA\u53d8\u5316\u3002\u7814\u7a76\u53d1\u73b0\u53d1\u6563\u8def\u5f84\u5f00\u9500\u59cb\u7ec8\u968f\u8def\u5f84\u6570\u7ebf\u6027\u589e\u957f\uff0c\u5c3d\u7ba1\u91cd\u6c47\u805a\u673a\u5236\u548c\u63a7\u5236\u6d41\u6307\u4ee4\u5728\u65b0\u67b6\u6784\u4e2d\u663e\u8457\u6f14\u5316\u3002", "categories": ["cs.AR", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.23402", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u591a\u4ee3GPU\u4e0a\u53d1\u6563\u8def\u5f84\u6267\u884c\u65f6\u95f4\u8fd1\u4f3c\u6ee1\u8db3T(k)\u2248sk\uff0c\u65e0\u8d85\u7ebf\u6027\u91cd\u6c47\u805a\u60e9\u7f5a\uff0cwarp\u6267\u884c\u6548\u7387\u7ea6\u630932/k\u4e0b\u964d", "\u53d1\u6563\u60e9\u7f5a\u4e0eoccupancy\u65e0\u5173\uff0c\u4f7f\u7528predication\u53ef\u6d88\u9664\u5e8f\u5217\u5316\u6210\u672c\uff1b\u8be5\u53ef\u89c1\u6210\u672c\u6a21\u578b\u5728Pascal\u65f6\u4ee3\u5df2\u5b58\u5728\uff0c\u5e76\u975eVolta ITS\u4e4b\u540e\u624d\u51fa\u73b0", "\u63a7\u5236\u6d41\u5b9e\u73b0\u4ecePascal\u7684SSY/SYNC\u6808\u6f14\u8fdb\u5230\u540e\u7eed\u67b6\u6784\u7684barrier-register\u673a\u5236\uff0cBlackwell\u65b0\u589e\u4e24\u7ea7\u6536\u655b\u5c4f\u969c\u3001uniform-branch\u6307\u4ee4\u548c\u663e\u5f0fpartial-mask warp\u540c\u6b65"], "keywords": ["GPU\u67b6\u6784", "\u6027\u80fd\u5206\u6790", "\u5e76\u884c\u8ba1\u7b97", "\u7f16\u8bd1\u5668"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.23402v1", "published_at": "2026-07-26", "score": 0.208, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23402.png", "title": "Characterizing Warp Divergence from Pascal to Blackwell", "tldr": "NVIDIA\u5206\u652f\u53d1\u6563\u4ee3\u4ef7\u957f\u671f\u7ebf\u6027\u7a33\u5b9a", "upvotes": 2, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u6d4b\u8bd5Pascal\u5230Blackwell\u591a\u4ee3NVIDIA GPU\u7684warp\u5206\u652f\u53d1\u6563\u884c\u4e3a\uff0c\u7ed3\u5408\u5fae\u57fa\u51c6\u3001\u786c\u4ef6\u8ba1\u6570\u5668\u548cSASS\u9759\u6001\u5206\u6790\u523b\u753b\u6027\u80fd\u6a21\u578b\u4e0eISA\u53d8\u5316\u3002\u7814\u7a76\u53d1\u73b0\u53d1\u6563\u8def\u5f84\u5f00\u9500\u59cb\u7ec8\u968f\u8def\u5f84\u6570\u7ebf\u6027\u589e\u957f\uff0c\u5c3d\u7ba1\u91cd\u6c47\u805a\u673a\u5236\u548c\u63a7\u5236\u6d41\u6307\u4ee4\u5728\u65b0\u67b6\u6784\u4e2d\u663e\u8457\u6f14\u5316\u3002", "why_notable": "\u8bba\u6587\u6f84\u6e05\u4e86NVIDIA GPU\u5206\u652f\u53d1\u6563\u7684\u957f\u671f\u8bef\u89e3\uff0c\u4e3aGPU\u6027\u80fd\u5efa\u6a21\u3001\u7f16\u8bd1\u5668\u4f18\u5316\u548c\u9ad8\u6027\u80fdCUDA\u4ee3\u7801\u8c03\u4f18\u63d0\u4f9b\u4e86\u8de8\u67b6\u6784\u7684\u5b9e\u8bc1\u4f9d\u636e\uff0c\u5c24\u5176\u6709\u52a9\u4e8e\u7406\u89e3Blackwell\u63a7\u5236\u6d41ISA\u7684\u65b0\u53d8\u5316\u3002"}, {"abstract": "Reliable visual document understanding requires a model to attribute each answer to the evidence regions that support it. Recent benchmarks and systems express this step through a coordinate interface: the model outputs the coordinates of bounding boxes that mark the evidence regions in the document. Under this interface, vision-language models often fail to identify the right regions even when the answer is correct, a failure known as Attribution Hallucination. We present a study that investigates whether this failure is partially limited by what the model can express through coordinates. On a verified bilingual CiteVQA subset, we compare the coordinate interface with a language interface in which the model outputs only text, quoting its evidence verbatim, and a multimodal retriever returns the location of each quote as a page region proposed by a layout parser (tables and figures are quoted through their captions or notes); the comparison is repeated over six open vision-language models. Compared with the coordinate interface, evidence recall rises from at most 8 points to between 26 and 47 and the hallucination rate roughly halves, with little change in answer quality. Building on this comparison, we use the same quote-and-retrieve pipeline as a training scaffold: because region-level evidence labels are expensive to collect for long documents, we introduce a GRPO recipe whose reward is a judge\u0027s reading of the gold answer and crops of the retrieved regions, training the model to quote better evidence without any region labels and raising an 8B backbone\u0027s strict attributed accuracy from 22.4 to 33.8. These findings indicate a practical path to improve attribution\"without a coordinate interface and without costly region-level supervision.", "arxiv_id": "2607.24651", "arxiv_url": "https://arxiv.org/abs/2607.24651", "authors": ["Zhuchenyang Liu", "Yao Zhang", "Yu Xiao"], "brief": "\u8bba\u6587\u7814\u7a76\u89c6\u89c9\u6587\u6863\u7406\u89e3\u4e2d\u7684\u8bc1\u636e\u5f52\u56e0\u95ee\u9898\uff0c\u63d0\u51fa\u8ba9\u6a21\u578b\u9010\u5b57\u5f15\u7528\u8bc1\u636e\u6587\u672c\uff0c\u518d\u7531\u591a\u6a21\u6001\u68c0\u7d22\u5668\u5b9a\u4f4d\u9875\u9762\u533a\u57df\uff0c\u800c\u975e\u76f4\u63a5\u8f93\u51fa\u5750\u6807\u6846\u3002\u8fdb\u4e00\u6b65\u7528\u8be5\u201c\u5f15\u7528-\u68c0\u7d22\u201d\u6d41\u7a0b\u4f5c\u4e3a\u8bad\u7ec3\u811a\u624b\u67b6\uff0c\u5728\u65e0\u533a\u57df\u6807\u7b7e\u4e0b\u901a\u8fc7 GRPO \u63d0\u5347\u8bc1\u636e\u5f15\u7528\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.CL", "cs.IR"], "github_repo": "https://github.com/Ryenhails/quote-and-retrieve", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24651", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u7ecf\u9a8c\u8bc1\u7684\u53cc\u8bed CiteVQA \u5b50\u96c6\u4e0a\uff0c\u5bf9\u6bd4\u5750\u6807\u63a5\u53e3\u4e0e\u8bed\u8a00\u5f15\u7528\u63a5\u53e3\uff0c\u5e76\u8986\u76d6\u516d\u4e2a\u5f00\u6e90\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u3002", "\u76f8\u6bd4\u76f4\u63a5\u8f93\u51fa\u5750\u6807\uff0c\u8bc1\u636e\u53ec\u56de\u4ece\u6700\u9ad8\u7ea6 8 \u5206\u63d0\u5347\u5230 26-47 \u5206\uff0c\u5f52\u56e0\u5e7b\u89c9\u7387\u7ea6\u51cf\u534a\uff0c\u7b54\u6848\u8d28\u91cf\u57fa\u672c\u4e0d\u53d8\u3002", "\u63d0\u51fa\u65e0\u9700\u533a\u57df\u7ea7\u8bc1\u636e\u6807\u6ce8\u7684 GRPO \u8bad\u7ec3\u65b9\u6848\uff0c\u4ee5\u88c1\u526a\u533a\u57df\u548c\u6807\u51c6\u7b54\u6848\u7684\u8bc4\u5ba1\u5956\u52b1\u4f18\u5316\u5f15\u7528\u8d28\u91cf\uff0c\u4f7f 8B \u6a21\u578b\u4e25\u683c\u5f52\u56e0\u51c6\u786e\u7387\u4ece 22.4 \u63d0\u5347\u5230 33.8\u3002"], "keywords": ["\u89c6\u89c9\u6587\u6863\u7406\u89e3", "\u591a\u6a21\u6001", "\u8bc1\u636e\u5f52\u56e0", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24651v1", "published_at": "2026-07-27", "score": 0.208, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24651.png", "title": "Evidence Attribution in Visual Document Understanding without Coordinates or Region Labels", "tldr": "\u7528\u6587\u672c\u5f15\u7528\u66ff\u4ee3\u5750\u6807\uff0c\u63d0\u5347\u6587\u6863\u8bc1\u636e\u5f52\u56e0", "upvotes": 2, "what_it_is": "\u8bba\u6587\u7814\u7a76\u89c6\u89c9\u6587\u6863\u7406\u89e3\u4e2d\u7684\u8bc1\u636e\u5f52\u56e0\u95ee\u9898\uff0c\u63d0\u51fa\u8ba9\u6a21\u578b\u9010\u5b57\u5f15\u7528\u8bc1\u636e\u6587\u672c\uff0c\u518d\u7531\u591a\u6a21\u6001\u68c0\u7d22\u5668\u5b9a\u4f4d\u9875\u9762\u533a\u57df\uff0c\u800c\u975e\u76f4\u63a5\u8f93\u51fa\u5750\u6807\u6846\u3002\u8fdb\u4e00\u6b65\u7528\u8be5\u201c\u5f15\u7528-\u68c0\u7d22\u201d\u6d41\u7a0b\u4f5c\u4e3a\u8bad\u7ec3\u811a\u624b\u67b6\uff0c\u5728\u65e0\u533a\u57df\u6807\u7b7e\u4e0b\u901a\u8fc7 GRPO \u63d0\u5347\u8bc1\u636e\u5f15\u7528\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u89c6\u89c9\u6587\u6863\u5f52\u56e0\u5931\u8d25\u4e0d\u4e00\u5b9a\u6e90\u4e8e\u6a21\u578b\u4e0d\u7406\u89e3\uff0c\u800c\u53ef\u80fd\u53d7\u9650\u4e8e\u5750\u6807\u8868\u8fbe\u63a5\u53e3\uff1b\u901a\u8fc7\u6587\u672c\u5f15\u7528\u52a0\u68c0\u7d22\u5b9a\u4f4d\uff0c\u663e\u8457\u964d\u4f4e\u5f52\u56e0\u5e7b\u89c9\uff0c\u5e76\u51cf\u5c11\u6602\u8d35\u7684\u533a\u57df\u7ea7\u76d1\u7763\u9700\u6c42\uff0c\u5bf9\u957f\u6587\u6863 VQA\u3001\u5ba1\u8ba1\u578b\u6587\u6863\u7406\u89e3\u548c\u53ef\u89e3\u91ca\u591a\u6a21\u6001\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The alignment of Small Language Models (SLMs) in the 70--500M parameter range using reinforcement learning is often considered unstable, though the underlying failure mechanisms have not been systematically investigated. In the State-of-the-Art (SOTA) research, fifteen (model, corpus) configurations were trained using Proximal Policy Optimization (PPO). The experiments included Pythia-70M, 160M, 410M and SmolLM2-135M, 360M on the TinyStories, CNN/DailyMail, and Wikitext-103 corpora. Three reproducible failure modes were identified in small-scale language models: silent LoRA parameter freezing in standard PEFT/TRL pipelines, numerical overflow in importance ratios when using bfloat16, and catastrophic policy collapse due to reward-model error. These issues were addressed using a merge-and-reinitialize adapter technique, float32 precision during PPO updates, and a three-layer safety mechanism comprising reward whitening, importance-ratio guarding, and weight rollback. In this paper, a capacity-headroom hypothesis is proposed, which states that PPO performance at the SLM scale depends on both a fluent supervised model ($\\text{PPL}\u003c20$) and a discriminative reward signal, rather than on the number of model parameters. The proposed system converged stably in all experiments and improved preference win rate over the SFT baseline in configurations with a fluent prior and an informative reward signal. Furthermore, it outperformed instruction-tuned baselines while requiring significantly less training data. All checkpoints, preference datasets, and training scripts are publicly released$^\u00a7$.", "arxiv_id": "2607.25091", "arxiv_url": "https://arxiv.org/abs/2607.25091", "authors": ["Md Rezwanul Haque", "Md. Milon Islam", "Fakhri Karray"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a7670M\u5230500M\u5c0f\u8bed\u8a00\u6a21\u578b\u7528PPO\u505a\u5f3a\u5316\u5b66\u4e60\u5bf9\u9f50\u65f6\u7684\u4e0d\u7a33\u5b9a\u6765\u6e90\uff0c\u5e76\u5728\u591a\u4e2a\u6a21\u578b\u4e0e\u8bed\u6599\u7ec4\u5408\u4e0a\u590d\u73b0\u5b9e\u9a8c\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u5957\u5de5\u7a0b\u4fee\u590d\u4e0e\u5b89\u5168\u673a\u5236\uff0c\u4f7f\u5c0f\u6a21\u578b\u5728\u5177\u5907\u6d41\u7545SFT\u5148\u9a8c
