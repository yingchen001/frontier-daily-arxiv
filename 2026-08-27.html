const PAPERS = [{"abstract": "LLM agents increasingly rely on generated interaction data to learn how to interact with external environments. Agentic data generation must maintain consistency among environments, tasks, interactions, and success signals while producing experience that is useful rather than merely abundant. Existing work spans many agent domains, but domain-centered organization and heterogeneous evaluation often obscure common generation mechanisms and conflate candidate construction with verification and selection. This work develops a two-level framework for the field. First, we represent agentic data as a common factorized object $(E,q,\u03c4,v)$, comprising an environment specification, task signal, interaction realization, and optional verifier. We organize generation paradigms by their primary anchor and dependency structure. Second, we formulate generation as constrained distribution design through the Accuracy-Complexity-divErsity (ACE) lens. Accuracy establishes the feasible support of grounded and internally consistent data. Within this support, Complexity places learning mass relative to the capability of a declared learner and execution configuration, while divErsity controls coverage and redundancy of data. Using this framework, we explore how prior work verifies generated experience, constructs and calibrates difficulty, and expands behavioral coverage. The literature reveals a shift toward execution-grounded accuracy, learner-relative complexity, and diversity beyond surface variation or dataset size. We further discuss broader directions and emerging trends in agentic data generation through the ACE lens, including their implications for scaling, data sources, training regimes and adaptive learning. Overall, the central challenge is not simply to generate more data, but to continually allocate valid, informative, and non-redundant experience as agents and environments evolve.", "arxiv_id": "2608.27260", "arxiv_url": "https://arxiv.org hree research questions. We first test whether an agent can ground a local scene well enough to answer spatial questions after active observation. Then we ask whether that grounding supports navigation as destinations become farther away and less explicit. Finally, we examine whether the resulting behavior survives changes in route availability and pedestrian motion. Contemporary MLLM agents usually show useful atomic abilities in visual recognition and short-range spatial reasoning, while orientation and pedestrian-aware movement remain unreliable. Their central failure emerges over extended exploration, where local abilities do not compose into sustained goal-directed behavior and errors accumulate without effective correction. We hope UrbanGround will support broader study of how far current MLLM agents can explore reliably in complex, open-ended urban environments.", "arxiv_id": "2608.27456", "arxiv_url": "https://arxiv.org/abs/2608.27456", "authors": ["Tianjie Ju", "Zheng Wu", "Yueqing Sun", "Yuhan Cui", "Bobo Li", "Shengqiong Wu", "Pengzhou Cheng", "Haodong Zhao", "Zongru Wu", "Xinbei Ma", "Doris Zhang", "Kunling Li", "Mong-Li Lee", "Wynne Hsu", "Hao Fei", "Qi Gu", "Gongshen Liu", "Zhuosheng Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa UrbanGround\uff0c\u4e00\u4e2a\u57fa\u4e8e\u9999\u6e2f\u5168\u57df3D\u5730\u7406\u7a7a\u95f4\u6570\u636e\u6784\u5efa\u7684\u771f\u5b9e\u5c3a\u5ea6\u57ce\u5e02\u6c99\u76d2\uff0c\u7528\u4e8e\u6d4b\u8bd5MLLM\u667a\u80fd\u4f53\u4ece\u8857\u666f\u5c40\u90e8\u611f\u77e5\u5230\u95ed\u73af\u5bfc\u822a\u884c\u52a8\u7684\u80fd\u529b\u3002\u5b83\u652f\u6301\u7b2c\u4e00\u4eba\u79f0\u63a2\u7d22\u3001\u4ea4\u4e92\u5f0f\u5730\u56fe\u5bfc\u822a\uff0c\u5e76\u8bc4\u4f30\u7a7a\u95f4\u95ee\u7b54\u3001\u8fdc\u8ddd\u79bb\u5bfc\u822a\u3001\u8def\u7ebf\u53d8\u5316\u4e0e\u884c\u4eba\u52a8\u6001\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/UrbanGround/UrbanGround", "github_stars": 17, "hf_url": "https:// \u6301\u7b2c\u4e00\u4eba\u79f0\u63a2\u7d22\u3001\u4ea4\u4e92\u5f0f\u5730\u56fe\u5bfc\u822a\uff0c\u5e76\u8bc4\u4f30\u7a7a\u95f4\u95ee\u7b54\u3001\u8fdc\u8ddd\u79bb\u5bfc\u822a\u3001\u8def\u7ebf\u53d8\u5316\u4e0e\u884c\u4eba\u52a8\u6001\u4e0b\u7684\u9c81\u68d2\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aMLLM\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u9759\u6001\u8857\u666f\u7406\u89e3\u63a8\u8fdb\u5230\u771f\u5b9e\u5c3a\u5ea6\u57ce\u5e02\u4e2d\u7684\u7a7a\u95f4\u884c\u52a8\uff0c\u4e3a\u7814\u7a76\u5f00\u653e\u57ce\u5e02\u73af\u5883\u4e0b\u7684\u5177\u8eab\u5bfc\u822a\u3001\u7a7a\u95f4\u63a8\u7406\u548c\u9c81\u68d2\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u91cd\u8981\u57fa\u51c6\u3002"}, {"abstract": "Agent skills package specialized knowledge and workflows into reusable resources that extend AI agent capabilities. Recent work automatically discovers such skills from agent experience, which enables agents to progressively adapt through interaction. However, the insights that guide skill development typically remain scattered across optimization histories, limiting their systematic reuse across iterations. We introduce WikiSkill, a framework that co-evolves agent skills with a persistent knowledge base (wiki). At a high level, WikiSkill separates raw execution experience, accumulated knowledge, and executable skills, while continuously consolidating experience into the wiki, which subsequent skill updates can build on. Across diverse benchmarks and models, WikiSkill consistently outperforms state-of-the-art skill-evolution methods and improves over no-skill baselines in most model-benchmark settings. We find that skill evolution complements model scaling: larger models generally benefit more from evolved skills, while smaller models with skills can outperform substantially larger models without them. We also find that evolved skills transfer effectively across models and model families, and skills evolved by other models can outperform self-evolved skills. Finally, our ablation studies confirm that persistent knowledge accumulation in the wiki is critical for effective skill evolution. These results demonstrate the benefits of systematically accumulating and refining agent experience for developing reusable and transferable skills.", "arxiv_id": "2608.27454", "arxiv_url": "https://arxiv.org/abs/2608.27454", "authors": ["Liyan Tang", "Cyrus Rashtchian", "Chun-Sung Ferng", "Andrew Tomkins", "Da-Cheng Juan", "Tu Vu"], "brief": "WikiSkill\u63d0\u51fa\u4e00\u79cd\u5c06\u667a\u80fd\u4f53\u539f\u59cb\u6267\u884c\u7ecf\u9a8c\u3001\u6301\u4e45\u77e5\u8bc6\u5e93\u548c\u53ef\u6267\u884c\u6280\u80fd\u5206\u79bb\u5e76\u534f\u540c\u8fdb\u5316\u7684\u6846\u67b6\u3002\u5b83\u6301\u7eed\u628a\u4ea4\u4e92\u7ecf\u9a8c\u6574\u7406\u8fdbwiki\uff0c\u518d\u7528\u8fd9\u4e9b\u7d2f\u79ef\u77e5\u8bc6\u6307\u5bfc\u540e\u7eed\u6280\u80fd\u66f4\u65b0\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27454", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u96f6\u6563\u4f18\u5316\u5386\u53f2\u6c89\u6dc0\u4e3a\u53ef\u590d\u7528\u7684\u6301\u4e45\u77e5\u8bc6\u5e93\uff0c\u907f\u514d\u6bcf\u8f6e\u6280\u80fd\u8fdb\u5316\u4ece\u5206\u6563\u7ecf\u9a8c\u4e2d\u91cd\u65b0\u5f52\u7eb3", "\u5728\u591a\u79cd\u57fa\u51c6\u548c\u6a21\u578b\u4e0a\u4f18\u4e8e\u73b0\u6709\u6280\u80fd\u8fdb\u5316\u65b9\u6cd5\uff0c\u5e76\u5728\u591a\u6570\u8bbe\u7f6e\u4e0b\u8d85\u8fc7\u65e0\u6280\u80fd\u57fa\u7ebf", "\u53d1\u73b0\u6280\u80fd\u53ef\u8de8\u6a21\u578b\u3001\u8de8\u6a21\u578b\u5bb6\u65cf\u8fc1\u79fb\uff0c\u4e14\u4ed6\u6a21\u578b\u8fdb\u5316\u51fa\u7684\u6280\u80fd\u6709\u65f6\u4f18\u4e8e\u81ea\u8fdb\u5316\u6280\u80fd"], "keywords": ["\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60", "\u957f\u671f\u8bb0\u5fc6", "\u77e5\u8bc6\u5e93"], "num_comments": 0, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2608.27454v1", "published_at": "2026-08-27", "score": 0.45, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27454.png", "title": "WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution", "tldr": "\u7528\u6301\u4e45Wiki\u79ef\u7d2f\u7ecf\u9a8c\uff0c\u4fc3\u8fdb\u667a\u80fd\u4f53\u6280\u80fd\u8fdb\u5316", "upvotes": 0, "what_it_is": "WikiSkill\u63d0\u51fa\u4e00\u79cd\u5c06\u667a\u80fd\u4f53\u539f\u59cb\u6267\u884c\u7ecf\u9a8c\u3001\u6301\u4e45\u77e5\u8bc6\u5e93\u548c\u53ef\u6267\u884c\u6280\u80fd\u5206\u79bb\u5e76\u534f\u540c\u8fdb\u5316\u7684\u6846\u67b6\u3002\u5b83\u6301\u7eed\u628a\u4ea4\u4e92\u7ecf\u9a8c\u6574\u7406\u8fdbwiki\uff0c\u518d\u7528\u8fd9\u4e9b\u7d2f\u79ef\u77e5\u8bc6\u6307\u5bfc\u540e\u7eed\u6280\u80fd\u66f4\u65b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u957f\u671f\u7ecf\u9a8c\u8bb0\u5fc6\u5bf9\u667a\u80fd\u4f53\u80fd\u529b\u589e\u957f\u7684\u91cd\u8981\u6027\uff0c\u4e3a\u6784\u5efa\u53ef\u590d\u7528\u3001\u53ef\u8fc1\u79fb\u7684Agent\u6280\u80fd\u5e93\u63d0\u4f9b\u4e86\u7cfb\u7edf\u6846\u67b6\uff0c\u5e76\u663e\u793a\u6280\u80fd\u8fdb\u5316\u53ef\u4e0e\u6a21\u578b\u89c4\u6a21\u6269\u5c55\u4e92\u8865\u3002"}, {"abstract": "As large language models (LLMs) are deployed as autonomous agents, safety failures increasingly involve consequential actions. We study agentic misalignment, where agents take harmful actions under goal conflicts and pressures. Using chain-of-thought (CoT) monitoring, we find that harmful execution is often preceded by intent signals in reasoning. However, post-hoc CoT labels are too coarse to show how intent changes during generation. We introduce INTENT-AS-A-TOOL, an approach that adds intent-targeted tools to give the model a dedicated channel for expressing commitment to a target behavior. The probability of calling an intent tool provides a judge-free, fine-grained signal of the model\u0027s tendency to pursue that behavior. Our results show that INTENT-AS-A-TOOL complements CoT monitoring, expands post-hoc CoT labels into dense trajectories, and identifies critical steps for online intervention. These findings suggest that action preferences are useful for tracking agentic misalignment during reasoning. Our code and data are accessible: https://github.com/RebeccaZhang22/intent-as-a-tool.", "arxiv_id": "2608.27348", "arxiv_url": "https://arxiv.org/abs/2608.27348", "authors": ["Yutong Zhang", "Jianshuo Dong", "Peng Xu", "Long Wang", "Jie Zhang", "Tianwei Zhang", "Xiaoping Zhang", "Han Qiu"], "brief": "\u672c\u6587\u63d0\u51fa INTENT-AS-A-TOOL\uff0c\u4e3a\u6a21\u578b\u52a0\u5165\u9762\u5411\u7279\u5b9a\u610f\u56fe\u7684\u5de5\u5177\u8c03\u7528\u901a\u9053\uff0c\u7528\u5de5\u5177\u8c03\u7528\u6982\u7387\u6765\u523b\u753b\u5176\u6267\u884c\u67d0\u7c7b\u76ee\u6807\u884c\u4e3a\u7684\u503e\u5411\u3002\u8be5\u65b9\u6cd5\u7528\u4e8e\u76d1\u6d4b LLM \u667a\u80fd\u4f53\u5728\u76ee\u6807\u51b2\u7a81\u548c\u538b\u529b\u4e0b\u4ea7\u751f\u7684\u6709\u5bb3\u884c\u52a8\u610f\u56fe\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27348", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u6709\u5bb3\u6267\u884c\u524d\u5e38\u5728 CoT \u63a8\u7406\u4e2d\u51fa\u73b0\u53ef\u89c2\u6d4b\u7684\u610f\u56fe\u4fe1\u53f7", "\u5c06\u7c97\u7c92\u5ea6\u7684\u4e8b\u540e CoT \u6807\u7b7e\u6269\u5c55\u4e3a\u751f\u6210\u8fc7\u7a0b\u4e2d\u7684\u5bc6\u96c6\u610f\u56fe\u8f68\u8ff9", "\u65e0\u9700\u989d\u5916\u88c1\u5224\u6a21\u578b\uff0c\u901a\u8fc7\u610f\u56fe\u5de5\u5177\u8c03\u7528\u6982\u7387\u5b9a\u4f4d\u53ef\u5728\u7ebf\u5e72\u9884\u7684\u5173\u952e\u6b65\u9aa4"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u5bf9\u9f50", "\u53ef\u89e3\u91ca\u6027", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27348v1", "published_at": "2026-08-27", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "INTENT-AS-A-TOOL Makes it Easy to Track Agentic Misalignment", "tldr": "\u7528\u610f\u56fe\u5de5\u5177\u7ec6\u7c92\u5ea6\u8ffd\u8e2a\u667a\u80fd\u4f53\u5931\u914d", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa INTENT-AS-A-TOOL\uff0c\u4e3a\u6a21\u578b\u52a0\u5165\u9762\u5411\u7279\u5b9a\u610f\u56fe\u7684\u5de5\u5177\u8c03\u7528\u901a\u9053\uff0c\u7528\u5de5\u5177\u8c03\u7528\u6982\u7387\u6765\u523b\u753b\u5176\u6267\u884c\u67d0\u7c7b\u76ee\u6807\u884c\u4e3a\u7684\u503e\u5411\u3002\u8be5\u65b9\u6cd5\u7528\u4e8e\u76d1\u6d4b LLM \u667a\u80fd\u4f53\u5728\u76ee\u6807\u51b2\u7a81\u548c\u538b\u529b\u4e0b\u4ea7\u751f\u7684\u6709\u5bb3\u884c\u52a8\u610f\u56fe\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u667a\u80fd\u4f53\u5b89\u5168\u76d1\u63a7\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u3001\u53ef\u5728\u7ebf\u4f7f\u7528\u7684\u610f\u56fe\u8ffd\u8e2a\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u5728\u6709\u5bb3\u884c\u52a8\u53d1\u751f\u524d\u8bc6\u522b\u5e76\u5e72\u9884 agentic misalignment\u3002"}, {"abstract": "Efficiently improving autonomous agents across diverse tasks is central to accelerating recursive self-improvement (RSI) in agentic AI, with prompt optimization emerging as a promising approach capable of delivering performance gains comparable to those achieved by fine-tuning model weights, while reducing computational costs in both optimization and serving. However, recent developments increasingly favor unnecessarily complex prompt optimizers. We introduce Naive Prompt Optimization (NPO), a lightweight single-lineage method that iteratively revises prompts using a teacher model with rollout feedback. NPO achieves comparable or better performance than GEPA with fewer rollouts, and its advantage increases with stronger teacher models, suggesting that stronger teacher reasoning can partially substitute for optimizer-side search complexity. In interactive games, NPO remains broadly competitive with GEPA, while GRPO performs better on some tasks less amenable to prompt optimization. We also show that NPO-optimized prompts elicit similar performance improvements when applied verbatim to other student models, especially across models within the same family. Overall, our preliminary results show that simple, linear prompt optimization can rival substantially more sophisticated and complex search procedures.", "arxiv_id": "2608.27266", "arxiv_url": "https://arxiv.org/abs/2608.27266", "authors": ["Yuan Chang", "Xiaoqi Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Naive Prompt Optimization\uff08NPO\uff09\uff0c\u4e00\u79cd\u8f7b\u91cf\u7ea7\u5355\u8c31\u7cfb\u63d0\u793a\u4f18\u5316\u65b9\u6cd5\uff1a\u7528\u6559\u5e08\u6a21\u578b\u7ed3\u5408 rollout \u53cd\u9988\u8fed\u4ee3\u6539\u5199\u63d0\u793a\u8bcd\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5b83\u5728\u591a\u7c7b\u4efb\u52a1\u548c\u4ea4\u4e92\u5f0f\u6e38\u620f\u4e2d\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u590d\u6742\u63d0\u793a\u641c\u7d22\u65b9\u6cd5 GEPA \u7684\u6548\u679c\uff0c\u5e76\u51cf\u5c11 rollout \u5f00\u9500\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27266", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["NPO \u4e0d\u8fdb\u884c\u590d\u6742\u641c\u7d22\uff0c\u53ea\u6cbf\u5355\u4e00\u8def\u5f84\u53cd\u590d\u4fee\u8ba2\u63d0\u793a\u8bcd\uff0c\u4f9d\u8d56\u6559\u5e08\u6a21\u578b\u63a8\u7406\u4e0e\u53cd\u9988\u6539\u8fdb\u3002", "\u5728\u591a\u9879\u4efb\u52a1\u4e0a\u4ee5\u66f4\u5c11 rollout \u8fbe\u5230\u4e0e GEPA \u76f8\u5f53\u6216\u66f4\u597d\u7684\u6027\u80fd\uff0c\u4e14\u6559\u5e08\u6a21\u578b\u8d8a\u5f3a\u4f18\u52bf\u8d8a\u660e\u663e\u3002", "NPO \u4f18\u5316\u51fa\u7684\u63d0\u793a\u53ef\u76f4\u63a5\u8fc1\u79fb\u5230\u5176\u4ed6\u5b66\u751f\u6a21\u578b\uff0c\u5c24\u5176\u5728\u540c\u4e00\u6a21\u578b\u5bb6\u65cf\u5185\u6548\u679c\u66f4\u7a33\u5b9a\u3002"], "keywords": ["\u63d0\u793a\u4f18\u5316", "\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27266v1", "published_at": "2026-08-27", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Naive Prompt Optimization: Rethinking the Need for Complex Prompt Search", "tldr": "\u7b80\u5355\u7ebf\u6027\u63d0\u793a\u4f18\u5316\u53ef\u5ab2\u7f8e\u590d\u6742\u641c\u7d22", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Naive Prompt Optimization\uff08NPO\uff09\uff0c\u4e00\u79cd\u8f7b\u91cf\u7ea7\u5355\u8c31\u7cfb\u63d0\u793a\u4f18\u5316\u65b9\u6cd5\uff1a\u7528\u6559\u5e08\u6a21\u578b\u7ed3\u5408 rollout \u53cd\u9988\u8fed\u4ee3\u6539\u5199\u63d0\u793a\u8bcd\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5b83\u5728\u591a\u7c7b\u4efb\u52a1\u548c\u4ea4\u4e92\u5f0f\u6e38\u620f\u4e2d\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u590d\u6742\u63d0\u793a\u641c\u7d22\u65b9\u6cd5 GEPA \u7684\u6548\u679c\uff0c\u5e76\u51cf\u5c11 rollout \u5f00\u9500\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u63d0\u793a\u4f18\u5316\u5fc5\u987b\u4f9d\u8d56\u590d\u6742\u641c\u7d22\u5668\u7684\u8d8b\u52bf\uff0c\u8868\u660e\u5f3a\u6559\u5e08\u6a21\u578b\u7684\u63a8\u7406\u80fd\u529b\u53ef\u90e8\u5206\u66ff\u4ee3\u4f18\u5316\u5668\u4fa7\u590d\u6742\u5ea6\uff0c\u6709\u52a9\u4e8e\u4ee5\u66f4\u4f4e\u6210\u672c\u63d0\u5347\u667a\u80fd\u4f53\u8868\u73b0\u3002"}, {"abstract": "Mental health assessment relies on episodic self-report scales, which convert subjective states such as stress into numerical scores but provide only sparse snapshots of wellbeing. Wearable devices offer longitudinal behavioral and physiological signals for continuous, low-burden monitoring. Recent LLM-driven personal-health agents enable natural language queries over wearable signals, but mainly handle short-term, retrieval-based lookups (e.g., highest step count over a week). They do not evaluate whether agents can reason over long-term signals to predict wellbeing scores paired with evidence-grounded rationales. To address this gap, we introduce BALMS, the first systematic benchmark of LLM-based agentic systems for longitudinal mental health sensing. BALMS spans 3 real-world longitudinal datasets, 2 task families (closed-form wellbeing-score prediction and rationale generation auto-graded by an LLM-as-Judge), 3 agentic paradigms evaluated across 5 open- and closed-source LLM backbones. We find that zero-shot agents rarely outperform a simple mean baseline, except with stronger backbones or compact, semantically meaningful features. Chain-of-thought prompting improves reasoning-oriented backbones, but does not guarantee temporal grounding or numerical correctness. Together with more analysis on efficiency and temporal scaling, BALMS highlights the need for longitudinal mental health agents that selectively retrieve history, ground temporal evidence, and reason over interpretable behavioral features.", "arxiv_id": "2608.27219", "arxiv_url": "https://arxiv.org/abs/2608.27219", "authors": ["Yu Yvonne Wu", "Arvind Pillai", "Yuliang Chen", "Yuwei Zhang", "Sudarshan Regmi", "Tess Z. Griffin", "Michael V. Heinz", "Lisa A. Marsch", "Nicholas C. Jacobson", "Andrew Campbell"], "brief": "\u8bba\u6587\u63d0\u51fa BALMS\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u6d4b LLM \u667a\u80fd\u4f53\u80fd\u5426\u57fa\u4e8e\u957f\u671f\u53ef\u7a7f\u6234\u8bbe\u5907\u884c\u4e3a\u4e0e\u751f\u7406\u4fe1\u53f7\u9884\u6d4b\u5fc3\u7406\u5065\u5eb7\u91cf\u8868\u5206\u6570\uff0c\u5e76\u751f\u6210\u6709\u8bc1\u636e\u652f\u6491\u7684\u89e3\u91ca\u3002\u57fa\u51c6\u8986\u76d63\u4e2a\u771f\u5b9e\u7eb5\u5411\u6570\u636e\u96c6\u30012\u7c7b\u4efb\u52a1\u30013\u79cd\u667a\u80fd\u4f53\u8303\u5f0f\u548c5\u79cd\u5f00\u95ed\u6e90LLM\u9aa8\u5e72\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27219", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4efb\u52a1\u5305\u62ec\u5c01\u95ed\u5f0f\u5e78\u798f\u611f/\u5fc3\u7406\u72b6\u6001\u5206\u6570\u9884\u6d4b\uff0c\u4ee5\u53ca\u7531 LLM-as-Judge \u81ea\u52a8\u8bc4\u5206\u7684\u7406\u7531\u751f\u6210", "\u5b9e\u9a8c\u53d1\u73b0\u96f6\u6837\u672c\u667a\u80fd\u4f53\u901a\u5e38\u96be\u4ee5\u8d85\u8fc7\u7b80\u5355\u5747\u503c\u57fa\u7ebf\uff0c\u9664\u975e\u4f7f\u7528\u66f4\u5f3a\u6a21\u578b\u6216\u7d27\u51d1\u4e14\u8bed\u4e49\u660e\u786e\u7684\u7279\u5f81", "Chain-of-thought \u53ef\u63d0\u5347\u90e8\u5206\u63a8\u7406\u578b\u6a21\u578b\uff0c\u4f46\u4e0d\u80fd\u4fdd\u8bc1\u65f6\u95f4\u8bc1\u636e\u624e\u5b9e\u6216\u6570\u503c\u9884\u6d4b\u51c6\u786e"], "keywords": ["\u667a\u80fd\u4f53", "\u5fc3\u7406\u5065\u5eb7", "\u53ef\u7a7f\u6234\u8bbe\u5907", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27219v1", "published_at": "2026-08-27", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "BALMS: Benchmarking Agentic LLMs for Longitudinal Mental Health Sensing", "tldr": "\u9996\u4e2a\u7eb5\u5411\u5fc3\u7406\u5065\u5eb7\u611f\u77e5LLM\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BALMS\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u6d4b LLM \u667a\u80fd\u4f53\u80fd\u5426\u57fa\u4e8e\u957f\u671f\u53ef\u7a7f\u6234\u8bbe\u5907\u884c\u4e3a\u4e0e\u751f\u7406\u4fe1\u53f7\u9884\u6d4b\u5fc3\u7406\u5065\u5eb7\u91cf\u8868\u5206\u6570\uff0c\u5e76\u751f\u6210\u6709\u8bc1\u636e\u652f\u6491\u7684\u89e3\u91ca\u3002\u57fa\u51c6\u8986\u76d63\u4e2a\u771f\u5b9e\u7eb5\u5411\u6570\u636e\u96c6\u30012\u7c7b\u4efb\u52a1\u30013\u79cd\u667a\u80fd\u4f53\u8303\u5f0f\u548c5\u79cd\u5f00\u95ed\u6e90LLM\u9aa8\u5e72\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u4e2a\u4eba\u5065\u5eb7\u667a\u80fd\u4f53\u4ece\u77ed\u671f\u68c0\u7d22\u67e5\u8be2\u63a8\u8fdb\u5230\u957f\u671f\u5fc3\u7406\u5065\u5eb7\u63a8\u7406\u8bc4\u6d4b\uff0c\u63ed\u793a\u4e86\u5f53\u524d\u667a\u80fd\u4f53\u5728\u65f6\u95f4 grounding\u3001\u5386\u53f2\u9009\u62e9\u6027\u68c0\u7d22\u548c\u53ef\u89e3\u91ca\u884c\u4e3a\u7279\u5f81\u63a8\u7406\u4e0a\u7684\u5173\u952e\u77ed\u677f\u3002"}, {"abstract": "An LLM agent shown a professional-looking market panel commits to a directional call on a provably unpredictable question far more often than one asked the bare question: across 12 frontier models, commitment rises from 6.5% to 54.0% as evidence is escalated. It commits just as readily when every number on the panel is invented: fabricating the entire display, so nothing the model can see is true except the question itself, still lifts commitment from 24.5% to 36.8%, statistically indistinguishable from the 37.6% produced by genuine market data. What unlocks confident action is not information but the authority of its packaging. The failure is narrow and locatable. Incapacity is not the answer: on matched answerable questions attached to the same panels, the same models answer essentially always, at near-perfect accuracy. Nor is it belief - stated probabilities barely move across the gradient that swings action by 48 points, and score worse than a climatological baseline. Missing judgment isn\u0027t it either: asked to classify a question\u0027s knowability before acting, models call it irreducible 90% of the time and then commit on just 0.4% of those. The act/don\u0027t-act gate is what fails, and the effect is concentrated in a few models rather than universal. Because the gate is separable, it can be trained. Supervised fine-tuning of a 3B model on 540 synthetic cases, predominantly dice, coins, jars and timers, drives commitment to 0.0% on the original cases and transfers to three unseen domains. It does not survive everything: the gate holds exactly when the response format leaves room to reason, and rigid formats that remove that room leave the model confident and wrong on questions it otherwise answers correctly. The gate is trainable and context-fragile, and deployment needs both halves of that sentence.", "arxiv_id": "2608.27167", "arxiv_url": "https://arxiv.org/abs/2608.27167", "authors": ["Pranav Aggarwal"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f3012\u4e2a\u524d\u6cbfLLM\u5728\u201c\u4e0d\u53ef\u9884\u6d4b\u95ee\u9898\u201d\u4e0a\u7684\u884c\u52a8\u51b3\u7b56\uff0c\u53d1\u73b0\u4e13\u4e1a\u5316\u8bc1\u636e\u9762\u677f\u4f1a\u663e\u8457\u63d0\u9ad8\u6a21\u578b\u505a\u51fa\u65b9\u5411\u6027\u5224\u65ad\u7684\u6982\u7387\uff0c\u5373\u4f7f\u9762\u677f\u6570\u636e\u5b8c\u5168\u4f2a\u9020\u4e5f\u540c\u6837\u6709\u6548\u3002\u7814\u7a76\u8fdb\u4e00\u6b65\u8868\u660e\uff0c\u95ee\u9898\u4e0d\u5728\u77e5\u8bc6\u80fd\u529b\u6216\u6982\u7387\u6821\u51c6\uff0c\u800c\u5728\u201c\u662f\u5426\u884c\u52a8\u201d\u7684\u95e8\u63a7\u673a\u5236\u5931\u6548\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27167", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u8bc1\u636e\u9010\u6b65\u589e\u5f3a\u65f6\uff0c\u6a21\u578b\u5bf9\u4e0d\u53ef\u77e5\u95ee\u9898\u7684\u627f\u8bfa\u7387\u4ece6.5%\u5347\u81f354.0%\uff1b\u5b8c\u5168\u4f2a\u9020\u7684\u6570\u636e\u9762\u677f\u4e5f\u80fd\u5c06\u627f\u8bfa\u7387\u4ece24.5%\u5347\u81f336.8%\uff0c\u63a5\u8fd1\u771f\u5b9e\u6570\u636e\u768437.6%\u3002", "\u6a21\u578b\u5728\u53ef\u56de\u7b54\u95ee\u9898\u4e0a\u51e0\u4e4e\u603b\u80fd\u6b63\u786e\u4f5c\u7b54\uff0c\u4e5f\u80fd\u5728\u884c\u52a8\u524d\u8bc6\u522b90%\u7684\u95ee\u9898\u4e3a\u4e0d\u53ef\u77e5\uff0c\u8bf4\u660e\u5931\u8d25\u96c6\u4e2d\u5728act/don\u0027t-act\u51b3\u7b56\u95e8\u63a7\u3002", "\u7528540\u4e2a\u5408\u6210\u6848\u4f8b\u76d1\u7763\u5fae\u8c033B\u6a21\u578b\uff0c\u53ef\u5c06\u539f\u59cb\u6848\u4f8b\u627f\u8bfa\u7387\u964d\u81f30.0%\u5e76\u8fc1\u79fb\u5230\u4e09\u4e2a\u672a\u89c1\u9886\u57df\uff0c\u4f46\u5728\u521a\u6027\u8f93\u51fa\u683c\u5f0f\u4e0b\u9c81\u68d2\u6027\u4e0b\u964d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6a21\u578b\u6821\u51c6", "\u5b89\u5168\u5bf9\u9f50", "\u51b3\u7b56\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27167v1", "published_at": "2026-08-27", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Calibrated Enough to Know, Not Calibrated to Act: Fabricated Evidence Makes LLM Agents Commit to the Unknowable", "tldr": "\u4f2a\u9020\u6743\u5a01\u8bc1\u636e\u4f1a\u8bf1\u5bfcLLM\u667a\u80fd\u4f53\u76f2\u76ee\u884c\u52a8", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f3012\u4e2a\u524d\u6cbfLLM\u5728\u201c\u4e0d\u53ef\u9884\u6d4b\u95ee\u9898\u201d\u4e0a\u7684\u884c\u52a8\u51b3\u7b56\uff0c\u53d1\u73b0\u4e13\u4e1a\u5316\u8bc1\u636e\u9762\u677f\u4f1a\u663e\u8457\u63d0\u9ad8\u6a21\u578b\u505a\u51fa\u65b9\u5411\u6027\u5224\u65ad\u7684\u6982\u7387\uff0c\u5373\u4f7f\u9762\u677f\u6570\u636e\u5b8c\u5168\u4f2a\u9020\u4e5f\u540c\u6837\u6709\u6548\u3002\u7814\u7a76\u8fdb\u4e00\u6b65\u8868\u660e\uff0c\u95ee\u9898\u4e0d\u5728\u77e5\u8bc6\u80fd\u529b\u6216\u6982\u7387\u6821\u51c6\uff0c\u800c\u5728\u201c\u662f\u5426\u884c\u52a8\u201d\u7684\u95e8\u63a7\u673a\u5236\u5931\u6548\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86LLM\u667a\u80fd\u4f53\u90e8\u7f72\u4e2d\u7684\u5173\u952e\u98ce\u9669\uff1a\u6a21\u578b\u53ef\u80fd\u88ab\u6743\u5a01\u5916\u89c2\u800c\u975e\u771f\u5b9e\u4fe1\u606f\u9a71\u52a8\u53bb\u91c7\u53d6\u884c\u52a8\u3002\u5b83\u5c06\u5931\u8d25\u673a\u5236\u5b9a\u4f4d\u5230\u53ef\u8bad\u7ec3\u4f46\u8106\u5f31\u7684\u884c\u52a8\u95e8\u63a7\uff0c\u4e3a\u63d0\u5347\u667a\u80fd\u4f53\u5b89\u5168\u6027\u3001\u62d2\u7b54\u80fd\u529b\u548c\u51b3\u7b56\u53ef\u9760\u6027\u63d0\u4f9b\u4e86\u660e\u786e\u65b9\u5411\u3002"}, {"abstract": "While generative AI has significantly advanced video editing, existing methods primarily focus on single-shot or short video clips. Editing long videos with multiple instructions remains a formidable challenge. Naive chunking strategies, e.g., fixed-duration segmentation, often lead to entity fragmentation, severe editing hallucinations, and disrupted temporal continuity. To bridge this gap, we introduce the Multi-Instruction Multi-Shot Long-Video Editing (MMLVE) task, which is structured around three core objectives: Cross-Shot Editing Consistency (CSEC), Multi-Instruction Decoupling (MID), and Zero-Destruction on Spatiotemporal Structure (ZDSS). To tackle these three unique challenges, we introduce an agentic editing framework that leverages the synergy of Large Language Models (LLMs) and Vision-Language Models (VLMs) to achieve shot-level video decoupling and precise instruction parsing. Furthermore, to comprehensively evaluate this task, we construct MMLVE-Bench, which is an MMLVE-focused dataset characterized by complex real-world spatiotemporal dynamics, high-density heterogeneous instructions, and sparse, random entity distributions. Three MMLVE-focused evaluation metrics are further exploited to assess the quality of the editing results. Extensive experiments demonstrate that our MMLVE-Agent outperforms existing closed-source SOTA approaches (e.g., Seedance 2.0), successfully eliminating editing hallucinations, preserving cross-shot editing consistency, and attaining seamless spatiotemporal transitions.", "arxiv_id": "2608.26809", "arxiv_url": "https://arxiv.org/abs/2608.26809", "authors": ["Chenyang Wu", "Fuchen Long", "Binyuan Huang", "Xinlong Sun", "Xi Chen", "Chun-Le Guo", "Chongyi Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u591a\u6307\u4ee4\u591a\u955c\u5934\u957f\u89c6\u9891\u7f16\u8f91\uff08MMLVE\uff09\u4efb\u52a1\uff0c\u5173\u6ce8\u8de8\u955c\u5934\u4e00\u81f4\u6027\u3001\u591a\u6307\u4ee4\u89e3\u8026\u548c\u65f6\u7a7a\u7ed3\u6784\u65e0\u635f\u3002\u4f5c\u8005\u6784\u5efa\u7ed3\u5408 LLM \u4e0e VLM \u7684 MMLVE-Agent\uff0c\u5728\u955c\u5934\u7ea7\u5206\u89e3\u89c6\u9891\u5e76\u7cbe\u786e\u89e3\u6790\u7f16\u8f91\u6307\u4ee4\uff0c\u540c\u65f6\u53d1\u5e03 MMLVE-Bench \u4e0e\u914d\u5957\u8bc4\u6d4b\u6307\u6807\u3002", "categories": ["cs.CV", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26809", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5b9a\u4e49\u4e09\u5927\u76ee\u6807\uff1a\u8de8\u955c\u5934\u7f16\u8f91\u4e00\u81f4\u6027\uff08CSEC\uff09\u3001\u591a\u6307\u4ee4\u89e3\u8026\uff08MID\uff09\u3001\u65f6\u7a7a\u7ed3\u6784\u96f6\u7834\u574f\uff08ZDSS\uff09", "\u5229\u7528 LLM/VLM \u534f\u540c\u8fdb\u884c\u955c\u5934\u7ea7\u89c6\u9891\u89e3\u8026\u3001\u5b9e\u4f53\u8ffd\u8e2a\u4e0e\u590d\u6742\u6307\u4ee4\u89e3\u6790\uff0c\u51cf\u5c11\u957f\u89c6\u9891\u5206\u5757\u5e26\u6765\u7684\u5e7b\u89c9\u548c\u4e0d\u8fde\u7eed", "\u6784\u5efa MMLVE-Bench\uff0c\u8986\u76d6\u590d\u6742\u771f\u5b9e\u65f6\u7a7a\u52a8\u6001\u3001\u9ad8\u5bc6\u5ea6\u5f02\u6784\u6307\u4ee4\u548c\u7a00\u758f\u968f\u673a\u5b9e\u4f53\u5206\u5e03"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u957f\u89c6\u9891"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26809v1", "published_at": "2026-08-27", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Thinking on Shots: Consistent Multi-Shot Video Editing with Agentic Reasoning", "tldr": "\u7528\u667a\u80fd\u4f53\u5b9e\u73b0\u4e00\u81f4\u7684\u591a\u955c\u5934\u957f\u89c6\u9891\u7f16\u8f91", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u591a\u6307\u4ee4\u591a\u955c\u5934\u957f\u89c6\u9891\u7f16\u8f91\uff08MMLVE\uff09\u4efb\u52a1\uff0c\u5173\u6ce8\u8de8\u955c\u5934\u4e00\u81f4\u6027\u3001\u591a\u6307\u4ee4\u89e3\u8026\u548c\u65f6\u7a7a\u7ed3\u6784\u65e0\u635f\u3002\u4f5c\u8005\u6784\u5efa\u7ed3\u5408 LLM \u4e0e VLM \u7684 MMLVE-Agent\uff0c\u5728\u955c\u5934\u7ea7\u5206\u89e3\u89c6\u9891\u5e76\u7cbe\u786e\u89e3\u6790\u7f16\u8f91\u6307\u4ee4\uff0c\u540c\u65f6\u53d1\u5e03 MMLVE-Bench \u4e0e\u914d\u5957\u8bc4\u6d4b\u6307\u6807\u3002", "why_notable": "\u5c06\u89c6\u9891\u7f16\u8f91\u4ece\u77ed\u7247\u6bb5\u63a8\u8fdb\u5230\u590d\u6742\u591a\u955c\u5934\u957f\u89c6\u9891\u573a\u666f\uff0c\u5e76\u7528\u667a\u80fd\u4f53\u63a8\u7406\u663e\u8457\u63d0\u5347\u4e00\u81f4\u6027\u548c\u53ef\u63a7\u6027\uff1b\u5b9e\u9a8c\u663e\u793a\u4f18\u4e8e Seedance 2.0 \u7b49\u95ed\u6e90 SOTA\uff0c\u5bf9\u957f\u89c6\u9891\u751f\u6210\u4e0e\u540e\u671f\u7f16\u8f91\u5e94\u7528\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM agents are increasingly applied to anomaly detection and root-cause analysis in time-series observations collected from real-world systems; however, their performance on these tasks has not been systematically evaluated under controlled conditions. We introduce TraceBench, a simulation-based framework for generating controlled root-cause attribution tasks. In each generated task, an agent receives time-series observations produced by simulating a physical dynamical system and must determine whether a system parameter was altered during the simulation and, if so, which one. Using TraceBench, we generate tasks from three interpretable mechanical systems and systematically evaluate four LLM agents across controlled experimental conditions, yielding new insights into how these agents analyze time-series observations from dynamical systems. Our results show that agents benefit substantially from domain context and explore data primarily through numerical console output rather than visualizations. We also find that agents generally perform worse when required to produce a Python script that maps each time-series sample to a predicted root-cause label than when they submit predictions directly. We release our datasets, agent trajectories, experimental results, and a leaderboard on our website, tracebench.github.io.", "arxiv_id": "2608.27182", "arxiv_url": "https://arxiv.org/abs/2608.27182", "authors": ["Tommaso Bendinelli", "Artur Dox", "Christian Holz"], "brief": "\u8bba\u6587\u63d0\u51fa TraceBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u7269\u7406\u52a8\u529b\u7cfb\u7edf\u4eff\u771f\u7684\u53ef\u63a7\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u5728\u65f6\u5e8f\u5f02\u5e38\u4e0e\u6839\u56e0\u5f52\u56e0\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\u3002\u6bcf\u4e2a\u4efb\u52a1\u8981\u6c42\u667a\u80fd\u4f53\u5224\u65ad\u7cfb\u7edf\u53c2\u6570\u662f\u5426\u88ab\u6539\u53d8\uff0c\u5e76\u8bc6\u522b\u5177\u4f53\u6839\u56e0\u53c2\u6570\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27182", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u4e8e\u4e09\u4e2a\u53ef\u89e3\u91ca\u673a\u68b0\u7cfb\u7edf\u751f\u6210\u65f6\u5e8f\u89c2\u6d4b\u4e0e\u6839\u56e0\u5f52\u56e0\u4efb\u52a1\uff0c\u4fbf\u4e8e\u63a7\u5236\u5b9e\u9a8c\u6761\u4ef6", "\u7cfb\u7edf\u8bc4\u4f30\u56db\u79cd LLM \u667a\u80fd\u4f53\uff0c\u5e76\u516c\u5f00\u6570\u636e\u96c6\u3001\u667a\u80fd\u4f53\u8f68\u8ff9\u3001\u5b9e\u9a8c\u7ed3\u679c\u548c\u6392\u884c\u699c", "\u53d1\u73b0\u9886\u57df\u4e0a\u4e0b\u6587\u663e\u8457\u63d0\u5347\u8868\u73b0\uff0c\u667a\u80fd\u4f53\u66f4\u4f9d\u8d56\u6570\u503c\u63a7\u5236\u53f0\u8f93\u51fa\u800c\u975e\u53ef\u89c6\u5316\u5206\u6790"], "keywords": ["\u667a\u80fd\u4f53", "\u65f6\u5e8f\u5206\u6790", "\u6839\u56e0\u5206\u6790", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27182v1", "published_at": "2026-08-27", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "TraceBench: Controlled Evaluation of LLM Agents for Time-Series Root-Cause Attribution", "tldr": "\u53ef\u63a7\u8bc4\u6d4bLLM\u667a\u80fd\u4f53\u65f6\u5e8f\u6839\u56e0\u5f52\u56e0\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TraceBench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u7269\u7406\u52a8\u529b\u7cfb\u7edf\u4eff\u771f\u7684\u53ef\u63a7\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u5728\u65f6\u5e8f\u5f02\u5e38\u4e0e\u6839\u56e0\u5f52\u56e0\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\u3002\u6bcf\u4e2a\u4efb\u52a1\u8981\u6c42\u667a\u80fd\u4f53\u5224\u65ad\u7cfb\u7edf\u53c2\u6570\u662f\u5426\u88ab\u6539\u53d8\uff0c\u5e76\u8bc6\u522b\u5177\u4f53\u6839\u56e0\u53c2\u6570\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u586b\u8865\u4e86 LLM \u667a\u80fd\u4f53\u5728\u65f6\u5e8f\u6839\u56e0\u5206\u6790\u4e2d\u7f3a\u4e4f\u53ef\u63a7\u7cfb\u7edf\u8bc4\u6d4b\u7684\u7a7a\u767d\uff0c\u4e3a\u771f\u5b9e\u7cfb\u7edf\u8fd0\u7ef4\u3001\u5f02\u5e38\u8bca\u65ad\u548c\u667a\u80fd\u4f53\u6570\u636e\u5206\u6790\u80fd\u529b\u7814\u7a76\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u57fa\u51c6\u3002"}, {"abstract": "Understanding spoken dialogue requires joint reasoning over lexical content and paralinguistic acoustic signals such as emotion and conversational intent. However, existing evaluations often allow shortcuts based on transcripts or single-modality solutions, obscuring whether models genuinely ground predictions in speech. We formalize this failure mode as cross-modal disagreement, where transcripts suggest plausible but incorrect surface interpretations while acoustic cues such as prosody or speaking style support different answers. We develop a scalable framework that identifies text-biased surface interpretations and converts disagreement regions into conflict QA examples. We also include consistent cases where transcript-based and speech-grounded interpretations agree, enabling evaluation beyond adversarial audio dependence. This results in ContraTalk, a controlled benchmark containing 501 questions across five discourse dimensions: interaction behavior, emotion state, dialogue act, social stance, and conversational intent. We further develop an agentic-style reasoning framework that converts speech into an Audio Twin, a text-readable representation of localized acoustic cues that exposes acoustic evidence to the reasoning model. Experiments show that strong text-only LLMs exceed 90% accuracy in consistent cases but drop to 33-48% in conflict cases. Direct AudioLLMs provide only partial grounding, still selecting the transcript-biased trap in roughly 30-40% of conflict cases. Our Audio Twin framework improves conflict-case accuracy while reducing trap selection, but its consistent-case behavior remains backbone-dependent. These results identify transcript-based shortcuts as an important failure mode in spoken dialogue understanding and show that explicit acoustic evidence aggregation provides a more controllable interface for diagnosing and improving speech-grounded reasoning.", "arxiv_id": "2608.27176", "arxiv_url": "https://arxiv.org/abs/2608.27176", "authors": ["Yen-Ju Lu", "Yuzhe Wang", "Yaohan Guan", "Xiluo He", "Jiarui Hai", "Mingrui Liang", "Kaavya Chaparala", "Thomas Thebaud", "Laureano Moro-Velazquez", "Najim Dehak", "Jesus Villalba"], "brief": "\u8bba\u6587\u63d0\u51fa\u8de8\u6a21\u6001\u4e0d\u4e00\u81f4\u89c6\u89d2\uff0c\u6784\u5efa ContraTalk \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u662f\u5426\u771f\u6b63\u4f9d\u636e\u8bed\u97f3\u4e2d\u7684\u97f5\u5f8b\u3001\u60c5\u7eea\u548c\u8bf4\u8bdd\u65b9\u5f0f\u8fdb\u884c\u5bf9\u8bdd\u7406\u89e3\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa Audio Twin\uff0c\u5c06\u5c40\u90e8\u58f0\u5b66\u7ebf\u7d22\u8f6c\u6210\u53ef\u8bfb\u6587\u672c\u8bc1\u636e\uff0c\u8f85\u52a9\u63a8\u7406\u6a21\u578b\u8fdb\u884c\u8bed\u97f3\u624e\u6839\u5224\u65ad\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27176", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["ContraTalk \u5305\u542b501\u4e2a\u95ee\u7b54\u6837\u672c\uff0c\u8986\u76d6\u4e92\u52a8\u884c\u4e3a\u3001\u60c5\u7eea\u72b6\u6001\u3001\u5bf9\u8bdd\u884c\u4e3a\u3001\u793e\u4f1a\u7acb\u573a\u548c\u4f1a\u8bdd\u610f\u56fe\u4e94\u7c7b\u8bdd\u8bed\u7ef4\u5ea6", "\u5f3a\u6587\u672c LLM \u5728\u6587\u672c\u4e0e\u8bed\u97f3\u4e00\u81f4\u6837\u672c\u4e0a\u8d85\u8fc790%\u51c6\u786e\u7387\uff0c\u4f46\u5728\u51b2\u7a81\u6837\u672c\u4e2d\u964d\u81f333%-48%\uff0c\u66b4\u9732\u660e\u663e\u6587\u672c\u504f\u7f6e", "\u76f4\u63a5 AudioLLM \u4ecd\u4f1a\u5728\u7ea630%-40%\u51b2\u7a81\u6837\u672c\u4e2d\u9009\u62e9\u6587\u672c\u8bf1\u5bfc\u9677\u9631\uff1bAudio Twin \u53ef\u63d0\u5347\u51b2\u7a81\u51c6\u786e\u7387\u5e76\u51cf\u5c11\u9677\u9631\u9009\u62e9"], "keywords": ["\u8bed\u97f3\u7406\u89e3", "\u591a\u6a21\u6001", "\u5bf9\u8bdd\u7cfb\u7edf", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27176v1", "published_at": "2026-08-27", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Text Misleads: Inconsistent-Aware Reasoning for Audio-Grounded Dialogue", "tldr": "\u63ed\u793a\u53e3\u8bed\u7406\u89e3\u4e2d\u7684\u6587\u672c\u6377\u5f84\u9677\u9631", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u8de8\u6a21\u6001\u4e0d\u4e00\u81f4\u89c6\u89d2\uff0c\u6784\u5efa ContraTalk \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u662f\u5426\u771f\u6b63\u4f9d\u636e\u8bed\u97f3\u4e2d\u7684\u97f5\u5f8b\u3001\u60c5\u7eea\u548c\u8bf4\u8bdd\u65b9\u5f0f\u8fdb\u884c\u5bf9\u8bdd\u7406\u89e3\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa Audio Twin\uff0c\u5c06\u5c40\u90e8\u58f0\u5b66\u7ebf\u7d22\u8f6c\u6210\u53ef\u8bfb\u6587\u672c\u8bc1\u636e\uff0c\u8f85\u52a9\u63a8\u7406\u6a21\u578b\u8fdb\u884c\u8bed\u97f3\u624e\u6839\u5224\u65ad\u3002", "why_notable": "\u8be5\u7814\u7a76\u7cfb\u7edf\u5b9a\u4e49\u5e76\u91cf\u5316\u4e86\u53e3\u8bed\u5bf9\u8bdd\u7406\u89e3\u4e2d\u7684\u201c\u8f6c\u5199\u6587\u672c\u6377\u5f84\u201d\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u53ef\u63a7\u8bc4\u6d4b\u96c6\u548c\u663e\u5f0f\u58f0\u5b66\u8bc1\u636e\u63a5\u53e3\uff0c\u5bf9\u6539\u8fdb\u591a\u6a21\u6001\u8bed\u97f3\u7406\u89e3\u4e0e\u8bca\u65ad\u6a21\u578b\u662f\u5426\u771f\u6b63\u5229\u7528\u97f3\u9891\u4fe1\u53f7\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Language Models (LLMs) are evolving from performing end-to-end mathematical reasoning to integrating agentic intelligence. However, most existing math benchmarks evaluate only final answers. This outcome-oriented evaluation provides limited diagnostic value for identifying process-level failures or rigorous logic, failing to guide the transformation of LLMs into robust agents. To bridge this gap, we present a process-level benchmark designed to evaluate the inherent agentic mathematical reasoning abilities of LLMs. Our framework aligns problem-solving agentic behaviors with a structured taxonomy of reusable mathematical atomic capabilities. We design a comprehensive suite of planning, action, and feedback tasks across both textual and multimodal contexts, supported by an automated pipeline that synthesizes high-quality trajectories and produces fine-grained annotations via controlled LLM rewriting. Experiments reveal that models with similar end-to-end accuracy can exhibit markedly different agentic capability profiles. This demonstrates that process-level evaluation is crucial for interpreting the true potential of LLMs and guiding the development of next-generation mathematical agents.", "arxiv_id": "2608.26950", "arxiv_url": "https://arxiv.org/abs/2608.26950", "authors": ["Jiayi Kuang", "Yinghui Li", "Yunze Song", "Keyu Chen", "Zhifeng Shen", "Yangning Li", "Yidong Wang", "Di Yin", "Ruizhi Qiao", "Xing Sun", "Kai Jin", "Ying Shen", "Liang Lin", "Philip S. Yu"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u8fc7\u7a0b\u7ea7\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6570\u5b66\u89e3\u9898\u4e2d\u7684\u667a\u80fd\u4f53\u5316\u80fd\u529b\uff0c\u800c\u4e0d\u53ea\u770b\u6700\u7ec8\u7b54\u6848\u3002\u8be5\u6846\u67b6\u5c06\u89e3\u9898\u884c\u4e3a\u5bf9\u9f50\u5230\u53ef\u590d\u7528\u7684\u6570\u5b66\u539f\u5b50\u80fd\u529b\uff0c\u5e76\u8986\u76d6\u6587\u672c\u4e0e\u591a\u6a21\u6001\u573a\u666f\u4e2d\u7684\u89c4\u5212\u3001\u884c\u52a8\u548c\u53cd\u9988\u4efb\u52a1\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26950", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u4e86\u4ece\u201c\u539f\u5b50\u80fd\u529b\u201d\u5230\u201c\u667a\u80fd\u4f53\u884c\u4e3a\u201d\u7684\u7ed3\u6784\u5316\u5206\u7c7b\u4f53\u7cfb\uff0c\u7528\u4e8e\u8bca\u65ad\u6570\u5b66\u63a8\u7406\u8fc7\u7a0b\u4e2d\u7684\u80fd\u529b\u5dee\u5f02", "\u8bbe\u8ba1\u89c4\u5212\u3001\u884c\u52a8\u3001\u53cd\u9988\u4e09\u7c7b\u4efb\u52a1\uff0c\u8986\u76d6\u6587\u672c\u548c\u591a\u6a21\u6001\u6570\u5b66\u95ee\u9898", "\u901a\u8fc7\u81ea\u52a8\u5316\u6d41\u6c34\u7ebf\u5408\u6210\u9ad8\u8d28\u91cf\u89e3\u9898\u8f68\u8ff9\uff0c\u5e76\u5229\u7528\u53d7\u63a7 LLM \u6539\u5199\u751f\u6210\u7ec6\u7c92\u5ea6\u6807\u6ce8"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u5b66\u63a8\u7406", "\u8bc4\u6d4b\u57fa\u51c6", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26950v1", "published_at": "2026-08-27", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Atomic to Agentic: Towards Interpretable Evaluation of LLMs\u0027 Agentic Mathematical Capabilities", "tldr": "\u9762\u5411\u6570\u5b66\u667a\u80fd\u4f53\u7684\u8fc7\u7a0b\u7ea7\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u8fc7\u7a0b\u7ea7\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6570\u5b66\u89e3\u9898\u4e2d\u7684\u667a\u80fd\u4f53\u5316\u80fd\u529b\uff0c\u800c\u4e0d\u53ea\u770b\u6700\u7ec8\u7b54\u6848\u3002\u8be5\u6846\u67b6\u5c06\u89e3\u9898\u884c\u4e3a\u5bf9\u9f50\u5230\u53ef\u590d\u7528\u7684\u6570\u5b66\u539f\u5b50\u80fd\u529b\uff0c\u5e76\u8986\u76d6\u6587\u672c\u4e0e\u591a\u6a21\u6001\u573a\u666f\u4e2d\u7684\u89c4\u5212\u3001\u884c\u52a8\u548c\u53cd\u9988\u4efb\u52a1\u3002", "why_notable": "\u73b0\u6709\u6570\u5b66\u57fa\u51c6\u591a\u5173\u6ce8\u6700\u7ec8\u7b54\u6848\uff0c\u96be\u4ee5\u89e3\u91ca\u6a21\u578b\u4e3a\u4f55\u6210\u529f\u6216\u5931\u8d25\uff1b\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u66f4\u53ef\u89e3\u91ca\u7684\u8fc7\u7a0b\u7ea7\u8bc4\u6d4b\u65b9\u5f0f\uff0c\u6709\u52a9\u4e8e\u53d1\u73b0\u540c\u7b49\u51c6\u786e\u7387\u6a21\u578b\u80cc\u540e\u7684\u80fd\u529b\u5dee\u5f02\uff0c\u5e76\u6307\u5bfc\u6570\u5b66\u667a\u80fd\u4f53\u7684\u53d1\u5c55\u3002"}, {"abstract": "Recent prominent post-training methods, such as Reinforcement Learning (RL) and On-Policy Self-Distillation (OPSD), have driven rapid progress in mathematical reasoning for large language models, yet their reliance on ground-truth labels precludes test-time training (TTT). Replacing ground truth with majority-vote pseudo-labels is a natural alternative, yet it is fragile: an incorrect vote corrupts the teacher and misleads every token. We observe that this failure mode is asymmetric: rollouts that disagree with the pseudo-label are typically wrong regardless of whether the vote itself is correct. Building on this observation, we propose Test-Time Policy Optimization (TTPO), an asymmetric objective that distills agreeing rollouts via OPSD and penalizes disagreeing rollouts with Grouped RL. Token-level selection further refines both branches: distillation down-weights already-converged positions, while RL penalizes only confident errors. Both updates remain well-grounded even under frequent pseudo-label errors, and majority-vote routing yields tighter self-supervision as the model improves. Without any labels, TTPO matches label-supervised OPSD on five competition-level benchmarks, raises Qwen3-1.7B from 38.0% to 45.2% in TTT, yields +25.2% to +36.4% without thinking, and shows strong cross-task generalization.", "arxiv_id": "2608.27448", "arxiv_url": "https://arxiv.org/abs/2608.27448", "authors": ["Aozhe Wang", "Zhengxi Lu", "Jianze Wang", "Shangke Lv", "Ying Liu", "Weiming Lu", "Jun Xiao", "Yueting Zhuang", "Hua Yang", "Qianglong Chen", "Yongliang Shen"], "brief": "\u8bba\u6587\u63d0\u51fa Test-Time Policy Optimization\uff08TTPO\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u771f\u5b9e\u6807\u7b7e\u7684\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u65b9\u6cd5\uff0c\u7528\u591a\u6570\u6295\u7968\u4f2a\u6807\u7b7e\u8def\u7531\u6837\u672c\uff0c\u5e76\u7ed3\u5408\u81ea\u84b8\u998f\u4e0e\u5206\u7ec4\u5f3a\u5316\u5b66\u4e60\u66f4\u65b0\u6a21\u578b\u3002\u5b83\u9488\u5bf9\u4f2a\u6807\u7b7e\u53ef\u80fd\u9519\u8bef\u7684\u95ee\u9898\uff0c\u91c7\u7528\u975e\u5bf9\u79f0\u76ee\u6807\uff1a\u5f3a\u5316\u540c\u610f\u4f2a\u6807\u7b7e\u7684\u8f68\u8ff9\uff0c\u60e9\u7f5a\u4e0d\u540c\u610f\u4f2a\u6807\u7b7e\u4e14\u7f6e\u4fe1\u9519\u8bef\u7684\u8f68\u8ff9\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/ZJU-REAL/TTPO", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2608.27448", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u540c\u610f\u591a\u6570\u6295\u7968\u7ed3\u679c\u7684 rollouts \u901a\u8fc7 On-Policy Self-Distillation \u84b8\u998f\uff0c\u4e0d\u540c\u610f\u7684 rollouts \u7528 Grouped RL \u8fdb\u884c\u60e9\u7f5a\uff0c\u7f13\u89e3\u9519\u8bef\u4f2a\u6807\u7b7e\u6c61\u67d3\u95ee\u9898", "\u5f15\u5165 token \u7ea7\u9009\u62e9\uff1a\u84b8\u998f\u65f6\u964d\u4f4e\u5df2\u6536\u655b\u4f4d\u7f6e\u6743\u91cd\uff0c\u5f3a\u5316\u5b66\u4e60\u65f6\u53ea\u60e9\u7f5a\u9ad8\u7f6e\u4fe1\u9519\u8bef token", "\u5728\u65e0\u6807\u7b7e\u6761\u4ef6\u4e0b\uff0cTTPO \u5728\u4e94\u4e2a\u7ade\u8d5b\u7ea7\u6570\u5b66\u57fa\u51c6\u4e0a\u5339\u914d\u6709\u6807\u7b7e OPSD\uff0c\u5e76\u5c06 Qwen3-1.7B \u4ece 38.0% \u63d0\u5347\u5230 45.2%"], "keywords": ["\u6d4b\u8bd5\u65f6\u8bad\u7ec3", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "\u6570\u5b66\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27448v1", "published_at": "2026-08-27", "score": 0.303, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27448.png", "title": "TTPO: Test-Time Policy Optimization", "tldr": "\u65e0\u6807\u7b7e\u6d4b\u8bd5\u65f6\u4f18\u5316\u663e\u8457\u63d0\u5347\u6570\u5b66\u63a8\u7406", "upvotes": 20, "what_it_is": "\u8bba\u6587\u63d0\u51fa Test-Time Policy Optimization\uff08TTPO\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u771f\u5b9e\u6807\u7b7e\u7684\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u65b9\u6cd5\uff0c\u7528\u591a\u6570\u6295\u7968\u4f2a\u6807\u7b7e\u8def\u7531\u6837\u672c\uff0c\u5e76\u7ed3\u5408\u81ea\u84b8\u998f\u4e0e\u5206\u7ec4\u5f3a\u5316\u5b66\u4e60\u66f4\u65b0\u6a21\u578b\u3002\u5b83\u9488\u5bf9\u4f2a\u6807\u7b7e\u53ef\u80fd\u9519\u8bef\u7684\u95ee\u9898\uff0c\u91c7\u7528\u975e\u5bf9\u79f0\u76ee\u6807\uff1a\u5f3a\u5316\u540c\u610f\u4f2a\u6807\u7b7e\u7684\u8f68\u8ff9\uff0c\u60e9\u7f5a\u4e0d\u540c\u610f\u4f2a\u6807\u7b7e\u4e14\u7f6e\u4fe1\u9519\u8bef\u7684\u8f68\u8ff9\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u540e\u8bad\u7ec3\u4e2d\u7684\u5f3a\u5316\u5b66\u4e60\u548c\u81ea\u84b8\u998f\u63a8\u8fdb\u5230\u65e0\u6807\u7b7e\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u573a\u666f\uff0c\u964d\u4f4e\u4e86\u5bf9\u6807\u6ce8\u7b54\u6848\u7684\u4f9d\u8d56\uff0c\u5e76\u5c55\u793a\u51fa\u8f83\u5f3a\u7684\u6570\u5b66\u63a8\u7406\u63d0\u5347\u548c\u8de8\u4efb\u52a1\u6cdb\u5316\u6f5c\u529b\u3002"}, {"abstract": "Recent video generation models are increasingly framed as world models. Many physical processes can unfold in more than one valid way. Therefore, a world model should reproduce not only a plausible trajectory, but also the distribution of possible behaviors under the same initial observation and action. We call this distribution-level requirement probabilistic alignment. However, existing evaluations largely assess individual-video plausibility and do not test whether repeated generations recover the correct distribution. This raises a central question: how far are current video generators from probabilistically aligned world modeling? To answer it, we formalize probabilistic alignment as a distributional criterion for world models and introduce PAWBench, a benchmark for evaluating video generators as stochastic samplers of world dynamics. We further introduce PAWEval, an outcome-level protocol that converts repeated video rollouts into empirical distributions over possible physical behaviors. Across 50 scenarios and eleven current systems, no model consistently matches the reference probabilities while recovering the range of valid behaviors. Having established this gap, we test whether language prompts, initial noise sampling, or model training can reshape the model\u0027s predictive distribution. We believe our work can serve as a foundation for future efforts to move towards probabilistically aligned world modeling.", "arxiv_id": "2608.27345", "arxiv_url": "https://arxiv.org/abs/2608.27345", "authors": ["Yuandong Pu", "Le Zhuo", "Sayak Paul", "Gabriel Jorge Menezes", "Avram \u0110or\u0111evi\u0107", "Shiyang Li", "Yifan Zhou", "Bin Fu", "Wenlong Zhang", "Junjun He", "Yu Qiao", "Yihao Liu", "Jingbo Xing", "Xi Chen"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6982\u7387\u5bf9\u9f50\u201d\u4f5c\u4e3a\u4e16\u754c\u6a21\u578b\u7684\u5206\u5e03\u7ea7\u8bc4\u4f30\u6807\u51c6\uff0c\u5e76\u6784\u5efa PAWBench \u4e0e PAWEval\uff0c\u7528\u91cd\u590d\u89c6\u9891\u751f\u6210\u6765\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u80fd\u6062\u590d\u540c\u4e00\u521d\u59cb\u6761\u4ef6\u4e0b\u591a\u79cd\u7269\u7406\u7ed3\u679c\u7684\u771f\u5b9e\u6982\u7387\u5206\u5e03\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/Andrew0613/PAWBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27345", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6 50 \u4e2a\u7269\u7406\u573a\u666f\uff0c\u8bc4\u4f30 11 \u4e2a\u5f53\u524d\u89c6\u9891\u751f\u6210\u7cfb\u7edf\u4f5c\u4e3a\u968f\u673a\u4e16\u754c\u52a8\u6001\u91c7\u6837\u5668\u7684\u80fd\u529b", "PAWEval \u5c06\u591a\u6b21\u89c6\u9891 rollout \u8f6c\u6362\u4e3a\u7269\u7406\u884c\u4e3a\u7ed3\u679c\u7684\u7ecf\u9a8c\u5206\u5e03\uff0c\u800c\u975e\u53ea\u770b\u5355\u6761\u89c6\u9891\u662f\u5426\u5408\u7406", "\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u6a21\u578b\u65e0\u6cd5\u540c\u65f6\u8986\u76d6\u6240\u6709\u6709\u6548\u884c\u4e3a\u5e76\u5339\u914d\u53c2\u8003\u6982\u7387\uff0c\u8bed\u8a00\u63d0\u793a\u3001\u566a\u58f0\u91c7\u6837\u548c\u8bad\u7ec3\u8c03\u6574\u4e5f\u96be\u4ee5\u5b8c\u5168\u4fee\u6b63"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u8bc4\u6d4b\u57fa\u51c6", "\u6982\u7387\u5efa\u6a21"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27345v1", "published_at": "2026-08-27", "score": 0.292, "selected_reasons": ["HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27345.png", "title": "PAWBench: How Far Are We from Probabilistically Aligned World Modeling?", "tldr": "\u8bc4\u6d4b\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u6982\u7387\u5206\u5e03\u5bf9\u9f50\u80fd\u529b", "upvotes": 28, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u6982\u7387\u5bf9\u9f50\u201d\u4f5c\u4e3a\u4e16\u754c\u6a21\u578b\u7684\u5206\u5e03\u7ea7\u8bc4\u4f30\u6807\u51c6\uff0c\u5e76\u6784\u5efa PAWBench \u4e0e PAWEval\uff0c\u7528\u91cd\u590d\u89c6\u9891\u751f\u6210\u6765\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u80fd\u6062\u590d\u540c\u4e00\u521d\u59cb\u6761\u4ef6\u4e0b\u591a\u79cd\u7269\u7406\u7ed3\u679c\u7684\u771f\u5b9e\u6982\u7387\u5206\u5e03\u3002", "why_notable": "\u5b83\u6307\u51fa\u5f53\u524d\u201c\u89c6\u9891\u751f\u6210\u5373\u4e16\u754c\u6a21\u578b\u201d\u8bc4\u4f30\u4e2d\u7684\u5173\u952e\u76f2\u533a\uff1a\u4e0d\u4ec5\u8981\u751f\u6210\u5408\u7406\u89c6\u9891\uff0c\u8fd8\u8981\u751f\u6210\u6b63\u786e\u7684\u53ef\u80fd\u6027\u5206\u5e03\uff1b\u8fd9\u5bf9\u7269\u7406\u4eff\u771f\u3001\u89c4\u5212\u548c\u5177\u8eab\u667a\u80fd\u4e2d\u7684\u53ef\u9760\u4e16\u754c\u5efa\u6a21\u5177\u6709\u91cd\u8981\u610f\u4e49\u3002"}, {"abstract": "Evolution Strategies (ES) have recently emerged as a memory-efficient post-training paradigm for LLM reasoning. However, the optimization behavior of ES remains understudied, making it hard to define its advantage scope compared to mainstream post-training paradigms (e.g., Group Relative Policy Optimization (GRPO)). By systematically investigating ES dynamics and mechanisms, this paper first identifies a performance advantage of ES over GRPO, theoretically and empirically showing that ES can lead to broader reasoning coverage, thereby better exploiting the reasoning capabilities of pretrained LLMs. Theoretically, we show that verifier-projected Jensen-Shannon diversity across the ES population is helpful to higher Pass@K performances. Empirically, unlike GRPO, which exhibits entropy collapse, ES improves Pass@1 while attaining higher Pass@K than GRPO. We further develop a sequential GRPO-ES training strategy that combines GRPO\u0027s strength in Pass@1 with ES\u0027s gains in Pass@K. Second, we find that despite substantial whole-model parameter drift, the task-performance gains of ES are only contributed to a sparse subset of larger-magnitude updates. This functional sparsity suggests that large parameter movement need not imply widespread functional change, and held-out evaluations further show that it does not necessarily lead to catastrophic forgetting. Finally, we study how hyperparameter design affects the effectiveness of ES, demonstrating that ES requires a smaller population size in a larger LLM. These findings position ES as a distinct reasoning post-training paradigm rather than a less effective, memory-efficient alternative to GRPO.", "arxiv_id": "2608.27351", "arxiv_url": "https://arxiv.org/abs/2608.27351", "authors": ["Yunpeng Ba", "Zhi Zheng", "Yue Xie", "Jiaqing Li", "Xialiang Tong", "Tao Zhong", "Mingxuan Yuan", "Zhichao Lu", "Xuyang Wu", "Zhenkun Wang"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u8fdb\u5316\u7b56\u7565\uff08ES\uff09\u7528\u4e8eLLM\u63a8\u7406\u540e\u8bad\u7ec3\u7684\u4f18\u5316\u884c\u4e3a\uff0c\u5e76\u4ece\u7406\u8bba\u4e0e\u5b9e\u9a8c\u4e0a\u89e3\u91ca\u5176\u76f8\u5bf9GRPO\u7684\u4f18\u52bf\u8fb9\u754c\u3002\u8bba\u6587\u53d1\u73b0ES\u80fd\u5e26\u6765\u66f4\u5e7f\u7684\u63a8\u7406\u8986\u76d6\u3001\u66f4\u9ad8Pass@K\uff0c\u5e76\u63d0\u51fa\u987a\u5e8fGRPO-ES\u8bad\u7ec3\u7b56\u7565\u7ed3\u5408\u4e24\u8005\u4f18\u52bf\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27351", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7406\u8bba\u4e0a\u63d0\u51fa\u9a8c\u8bc1\u5668\u6295\u5f71\u7684Jensen-Shannon\u591a\u6837\u6027\u6709\u52a9\u4e8e\u63d0\u5347Pass@K\uff0c\u89e3\u91caES\u7fa4\u4f53\u591a\u6837\u6027\u4e3a\u4f55\u80fd\u6539\u5584\u63a8\u7406\u8986\u76d6\u3002", "\u5b9e\u9a8c\u53d1\u73b0GRPO\u5bb9\u6613\u51fa\u73b0\u71b5\u574d\u7f29\uff0c\u800cES\u5728\u63d0\u5347Pass@1\u7684\u540c\u65f6\u4fdd\u6301\u66f4\u9ad8Pass@K\uff0c\u8bf4\u660e\u5176\u80fd\u66f4\u5145\u5206\u6316\u6398\u9884\u8bad\u7ec3\u6a21\u578b\u7684\u591a\u6837\u63a8\u7406\u80fd\u529b\u3002", "ES\u867d\u5bfc\u81f4\u5168\u6a21\u578b\u53c2\u6570\u6f02\u79fb\uff0c\u4f46\u6027\u80fd\u589e\u76ca\u4e3b\u8981\u6765\u81ea\u5c11\u91cf\u5927\u5e45\u66f4\u65b0\u53c2\u6570\uff0c\u5448\u73b0\u529f\u80fd\u7a00\u758f\u6027\uff0c\u4e14\u4e0d\u5fc5\u7136\u5bfc\u81f4\u707e\u96be\u6027\u9057\u5fd8\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u4f18\u5316", "\u5f3a\u5316\u5b66\u4e60", "\u8fdb\u5316\u7b56\u7565"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27351v1", "published_at": "2026-08-27", "score": 0.255, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27351.png", "title": "Understanding Evolution Strategies for LLM Reasoning: Broader Reasoning Coverage than GRPO", "tldr": "ES\u6bd4GRPO\u8986\u76d6\u66f4\u5e7f\u7684LLM\u63a8\u7406\u8def\u5f84", "upvotes": 6, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u8fdb\u5316\u7b56\u7565\uff08ES\uff09\u7528\u4e8eLLM\u63a8\u7406\u540e\u8bad\u7ec3\u7684\u4f18\u5316\u884c\u4e3a\uff0c\u5e76\u4ece\u7406\u8bba\u4e0e\u5b9e\u9a8c\u4e0a\u89e3\u91ca\u5176\u76f8\u5bf9GRPO\u7684\u4f18\u52bf\u8fb9\u754c\u3002\u8bba\u6587\u53d1\u73b0ES\u80fd\u5e26\u6765\u66f4\u5e7f\u7684\u63a8\u7406\u8986\u76d6\u3001\u66f4\u9ad8Pass@K\uff0c\u5e76\u63d0\u51fa\u987a\u5e8fGRPO-ES\u8bad\u7ec3\u7b56\u7565\u7ed3\u5408\u4e24\u8005\u4f18\u52bf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06ES\u4ece\u201c\u7701\u663e\u5b58\u7684GRPO\u66ff\u4ee3\u54c1\u201d\u91cd\u65b0\u5b9a\u4f4d\u4e3a\u5177\u6709\u72ec\u7279\u63a8\u7406\u8986\u76d6\u4f18\u52bf\u7684\u540e\u8bad\u7ec3\u8303\u5f0f\uff0c\u5e76\u7ed9\u51fa\u7406\u8bba\u6307\u6807\u3001\u8bad\u7ec3\u7b56\u7565\u548c\u8d85\u53c2\u6570\u89c4\u5f8b\uff0c\u5bf9LLM\u63a8\u7406\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5177\u6709\u5b9e\u7528\u6307\u5bfc\u4ef7\u503c\u3002"}, {"abstract": "Modern game development relies heavily on conventional graphics pipelines. High-quality visual content requires modeling, material authoring, animation, lighting, effects, and runtime optimization, making asset production expensive and extending the development cycle of game prototypes. Recently, video foundation models are beginning to change film and video production, but games differ from linear media, they require not only continuous and realistic imagery, but also stable and reproducible gameplay rules, object states, and interaction outcomes. We present Magpie, a real-time generative world-rendering system for interactive games. Magpie separates gameplay execution from visual generation. Designers define scenes and rules in a game engine. At runtime, the Game Engine resolves player actions and maintains world state, while an independent Render Server generates visual output from white-box frames produced by the engine. Magpie provides a system-level implementation path for applying generative models to real-time game rendering. It preserves gameplay designability and reproducibility, and reduces the dependence of early game prototypes on complete visual assets.", "arxiv_id": "2608.27168", "arxiv_url": "https://arxiv.org/abs/2608.27168", "authors": ["Xiaoyu Zhan", "Xinyu Wang", "Xiaohong Zhang", "Huanjie Zhu", "Tengjiao Sun", "Pengcheng Fang", "Jiaxing Yu", "Yanwen Guo", "Dongjie Fu"], "brief": "Magpie \u662f\u4e00\u4e2a\u9762\u5411\u4ea4\u4e92\u5f0f\u6e38\u620f\u7684\u5b9e\u65f6\u751f\u6210\u5f0f\u4e16\u754c\u6e32\u67d3\u7cfb\u7edf\u3002\u5b83\u5c06\u6e38\u620f\u903b\u8f91\u6267\u884c\u4e0e\u89c6\u89c9\u751f\u6210\u89e3\u8026\uff0c\u7531\u6e38\u620f\u5f15\u64ce\u7ef4\u62a4\u89c4\u5219\u548c\u72b6\u6001\uff0cRender Server \u6839\u636e\u767d\u76d2\u5e27\u751f\u6210\u6700\u7ec8\u753b\u9762\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27168", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bbe\u8ba1\u8005\u4ecd\u5728\u4f20\u7edf\u6e38\u620f\u5f15\u64ce\u4e2d\u5b9a\u4e49\u573a\u666f\u3001\u89c4\u5219\u4e0e\u4ea4\u4e92\uff0c\u4fdd\u8bc1\u73a9\u6cd5\u53ef\u63a7\u3001\u53ef\u590d\u73b0", "\u8fd0\u884c\u65f6\u7531\u6e38\u620f\u5f15\u64ce\u89e3\u6790\u73a9\u5bb6\u52a8\u4f5c\u5e76\u7ef4\u62a4\u4e16\u754c\u72b6\u6001\uff0c\u751f\u6210\u6a21\u578b\u53ea\u8d1f\u8d23\u89c6\u89c9\u8f93\u51fa", "\u901a\u8fc7\u767d\u76d2\u5e27\u4f5c\u4e3a\u4e2d\u95f4\u8868\u793a\uff0c\u964d\u4f4e\u65e9\u671f\u539f\u578b\u5bf9\u5b8c\u6574\u7f8e\u672f\u8d44\u4ea7\u3001\u6750\u8d28\u548c\u5149\u7167\u5236\u4f5c\u7684\u4f9d\u8d56"], "keywords": ["\u751f\u6210\u5f0f\u6e32\u67d3", "\u6e38\u620f\u5f15\u64ce", "\u89c6\u9891\u57fa\u7840\u6a21\u578b", "\u5b9e\u65f6\u6e32\u67d3"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27168v1", "published_at": "2026-08-27", "score": 0.229, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27168.png", "title": "Magpie: Real-Time World Renderer for Interactive Games", "tldr": "\u7528\u751f\u6210\u6a21\u578b\u5b9e\u65f6\u6e32\u67d3\u53ef\u4ea4\u4e92\u6e38\u620f\u4e16\u754c", "upvotes": 2, "what_it_is": "Magpie \u662f\u4e00\u4e2a\u9762\u5411\u4ea4\u4e92\u5f0f\u6e38\u620f\u7684\u5b9e\u65f6\u751f\u6210\u5f0f\u4e16\u754c\u6e32\u67d3\u7cfb\u7edf\u3002\u5b83\u5c06\u6e38\u620f\u903b\u8f91\u6267\u884c\u4e0e\u89c6\u89c9\u751f\u6210\u89e3\u8026\uff0c\u7531\u6e38\u620f\u5f15\u64ce\u7ef4\u62a4\u89c4\u5219\u548c\u72b6\u6001\uff0cRender Server \u6839\u636e\u767d\u76d2\u5e27\u751f\u6210\u6700\u7ec8\u753b\u9762\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7ed9\u51fa\u4e86\u5c06\u89c6\u9891\u57fa\u7840\u6a21\u578b\u7528\u4e8e\u5b9e\u65f6\u6e38\u620f\u6e32\u67d3\u7684\u7cfb\u7edf\u7ea7\u8def\u5f84\uff0c\u6709\u671b\u663e\u8457\u964d\u4f4e\u6e38\u620f\u539f\u578b\u5f00\u53d1\u7684\u7f8e\u672f\u6210\u672c\uff0c\u540c\u65f6\u4fdd\u7559\u6e38\u620f\u89c4\u5219\u7684\u7a33\u5b9a\u6027\u4e0e\u53ef\u8bbe\u8ba1\u6027\u3002"}, {"abstract": "Friend recommendation is inherently graph-structured: the relevance of a potential connection depends on multi-hop social context rather than user attributes alone. However, deploying message-passing GNNs on a production-scale social graph with hundreds of millions of users and tens of billions of edges requires addressing numerous modeling and systems challenges. We present a scalable end-to-end GNN ranking system for production social graphs, focusing on two design choices that are critical in this setting: multi-hash ID embeddings and temporal neighbor sampling. Multi-hash embeddings are common for high-cardinality features, but industrial GNN systems typically either ignore trainable IDs or accept full embedding tables, exceeding 200 GB for our graph. We integrate multi-hash as the primary node representation, reducing the ID-embedding table size by more than 98 percent while preserving ranking quality. Temporal neighbor sampling is well understood in principle, but existing implementations scan full adjacency lists, which is a non-starter for users with tens of thousands of friends. We implement timestamp-sorted CSR storage with binary search, reducing the per-node temporal sampling cost from $O(deg(v) + k)$ to $O(\\log(deg(v)) + k)$. Beyond these components, we show that this combination scales and yields measurable production impact. On a graph with 194M users and 28B edges, offline ablations isolate each design choice\u0027s contribution. In an online A/B test, our system increases friend additions from recommendations by 16 percent and unique friend adders by 11.5 percent over a strong production baseline. We release our framework for distributed training and inference on large temporal graphs.", "arxiv_id": "2608.27413", "arxiv_url": "https://arxiv.org/abs/2608.27413", "authors": ["Maksim Utushkin", "Andrei Ovsiannikov", "Alexander D\u0027yakonov"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8d85\u5927\u89c4\u6a21\u793e\u4ea4\u56fe\u7684\u7aef\u5230\u7aefGNN\u597d\u53cb\u63a8\u8350\u6392\u5e8f\u7cfb\u7edf\uff0c\u91cd\u70b9\u89e3\u51b3\u6570\u4ebf\u7528\u6237\u3001\u6570\u767e\u4ebf\u8fb9\u573a\u666f\u4e0b\u7684\u8282\u70b9\u8868\u793a\u4e0e\u65f6\u95f4\u90bb\u5c45\u91c7\u6837\u74f6\u9888\u3002\u7cfb\u7edf\u7ed3\u5408\u591a\u54c8\u5e0c\u7528\u6237ID\u5d4c\u5165\u4e0e\u65f6\u95f4\u6392\u5e8fCSR\u91c7\u6837\uff0c\u5728\u4fdd\u6301\u6548\u679c\u7684\u540c\u65f6\u5927\u5e45\u964d\u4f4e\u5b58\u50a8\u548c\u8ba1\u7b97\u6210\u672c\u3002", "categories": ["cs.IR", "cs.LG", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27413", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u591a\u54c8\u5e0cID\u5d4c\u5165\u5c06\u7528\u6237ID\u5d4c\u5165\u8868\u89c4\u6a21\u51cf\u5c11\u8d85\u8fc798%\uff0c\u907f\u514d\u8d85\u8fc7200GB\u7684\u5b8c\u6574\u5d4c\u5165\u8868\uff0c\u540c\u65f6\u4fdd\u6301\u63a8\u8350\u6392\u5e8f\u8d28\u91cf\u3002", "\u91c7\u7528\u6309\u65f6\u95f4\u6233\u6392\u5e8f\u7684CSR\u5b58\u50a8\u548c\u4e8c\u5206\u641c\u7d22\uff0c\u5c06\u65f6\u95f4\u90bb\u5c45\u91c7\u6837\u590d\u6742\u5ea6\u4eceO(deg(v)+k)\u964d\u81f3O(log(deg(v))+k)\uff0c\u9002\u914d\u9ad8\u597d\u53cb\u6570\u7528\u6237\u3002", "\u57281.94\u4ebf\u7528\u6237\u3001280\u4ebf\u8fb9\u793e\u4ea4\u56fe\u4e0a\u9a8c\u8bc1\uff1b\u7ebf\u4e0aA/B\u6d4b\u8bd5\u76f8\u8f83\u5f3a\u751f\u4ea7\u57fa\u7ebf\u5e26\u676516%\u63a8\u8350\u52a0\u597d\u53cb\u589e\u957f\u548c11.5%\u72ec\u7acb\u52a0\u597d\u53cb\u7528\u6237\u589e\u957f\u3002"], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u63a8\u8350\u7cfb\u7edf", "\u5927\u89c4\u6a21\u8bad\u7ec3", "\u793e\u4ea4\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27413v1", "published_at": "2026-08-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Scaling Graph Neural Networks for Friend Recommendation: Multi-Hash User Embeddings and Temporal Neighbor Sampling", "tldr": "\u751f\u4ea7\u7ea7GNN\u597d\u53cb\u63a8\u8350\u663e\u8457\u63d0\u6548\u589e\u76ca", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8d85\u5927\u89c4\u6a21\u793e\u4ea4\u56fe\u7684\u7aef\u5230\u7aefGNN\u597d\u53cb\u63a8\u8350\u6392\u5e8f\u7cfb\u7edf\uff0c\u91cd\u70b9\u89e3\u51b3\u6570\u4ebf\u7528\u6237\u3001\u6570\u767e\u4ebf\u8fb9\u573a\u666f\u4e0b\u7684\u8282\u70b9\u8868\u793a\u4e0e\u65f6\u95f4\u90bb\u5c45\u91c7\u6837\u74f6\u9888\u3002\u7cfb\u7edf\u7ed3\u5408\u591a\u54c8\u5e0c\u7528\u6237ID\u5d4c\u5165\u4e0e\u65f6\u95f4\u6392\u5e8fCSR\u91c7\u6837\uff0c\u5728\u4fdd\u6301\u6548\u679c\u7684\u540c\u65f6\u5927\u5e45\u964d\u4f4e\u5b58\u50a8\u548c\u8ba1\u7b97\u6210\u672c\u3002", "why_notable": "\u8bba\u6587\u5c55\u793a\u4e86GNN\u5728\u771f\u5b9e\u8d85\u5927\u89c4\u6a21\u793e\u4ea4\u63a8\u8350\u7cfb\u7edf\u4e2d\u7684\u53ef\u843d\u5730\u65b9\u6848\uff0c\u4e0d\u4ec5\u6709\u660e\u786e\u7684\u7cfb\u7edf\u4f18\u5316\u4e0e\u5efa\u6a21\u8bbe\u8ba1\uff0c\u8fd8\u7ed9\u51fa\u5927\u89c4\u6a21\u79bb\u7ebf\u6d88\u878d\u548c\u7ebf\u4e0aA/B\u6536\u76ca\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u4e1a\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Generative AI is transforming how people access information, challenging traditional advertising mechanisms built around predefined slots. Towards generation-native advertising, we propose the Latent Advertiser Mixture Auction (LAMA), a token-level advertising mechanism that embeds advertiser influence directly into the generation process. Advertisers report local continuation values that induce advertiser-specific next-token policies, from which the platform decodes through a latent mixture while updating an allocation posterior. We show that LAMA satisfies Markov DSIC and IR, and achieves near-optimal KL-regularized welfare. We further develop a learning-based implementation that reconstructs the required reports online from learned local advantages and root values. Proof-of-concept experiments on real-world commercial-search query splits show that LAMA improves platform welfare and revenue while maintaining user-facing response quality, providing initial evidence for the feasibility of generation-native advertising.", "arxiv_id": "2608.27382", "arxiv_url": "https://arxiv.org/abs/2608.27382", "authors": ["Hanbing Liu", "Bowei Zhang", "Changyuan Yu", "Yinyu Ye", "Qi Qi"], "brief": "\u8bba\u6587\u63d0\u51fa Latent Advertiser Mixture Auction\uff08LAMA\uff09\uff0c\u5c06\u5e7f\u544a\u4e3b\u5f71\u54cd\u76f4\u63a5\u5d4c\u5165\u8bed\u8a00\u6a21\u578b\u751f\u6210\u8fc7\u7a0b\uff0c\u5728\u6bcf\u4e2a token \u5c42\u9762\u8fdb\u884c\u6f5c\u5728\u6df7\u5408\u5f0f\u5206\u914d\u4e0e\u89e3\u7801\u3002\u8be5\u673a\u5236\u8bc1\u660e\u6ee1\u8db3\u9a6c\u5c14\u53ef\u592b DSIC \u4e0e\u4e2a\u4f53\u7406\u6027\uff0c\u5e76\u53ef\u901a\u8fc7\u5b66\u4e60\u65b9\u6cd5\u5728\u7ebf\u91cd\u6784\u5e7f\u544a\u4e3b\u62a5\u4ef7\u4fe1\u53f7\u3002", "categories": ["cs.GT", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27382", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5e7f\u544a\u4e3b\u62a5\u544a\u5c40\u90e8\u7eed\u5199\u4ef7\u503c\uff0c\u8bf1\u5bfc\u5404\u81ea\u7684\u4e0b\u4e00 token \u7b56\u7565\uff0c\u5e73\u53f0\u901a\u8fc7\u6f5c\u5728\u6df7\u5408\u5206\u5e03\u751f\u6210\u5185\u5bb9\u5e76\u66f4\u65b0\u5206\u914d\u540e\u9a8c", "\u7406\u8bba\u4e0a\u8bc1\u660e LAMA \u6ee1\u8db3 Markov DSIC\u3001IR\uff0c\u5e76\u63a5\u8fd1\u6700\u4f18 KL \u6b63\u5219\u5316\u793e\u4f1a\u798f\u5229", "\u5728\u771f\u5b9e\u5546\u4e1a\u641c\u7d22\u67e5\u8be2\u5212\u5206\u4e0a\u7684\u6982\u5ff5\u9a8c\u8bc1\u5b9e\u9a8c\u663e\u793a\uff0c\u53ef\u63d0\u5347\u5e73\u53f0\u798f\u5229\u548c\u6536\u5165\uff0c\u540c\u65f6\u4fdd\u6301\u7528\u6237\u53ef\u89c1\u56de\u7b54\u8d28\u91cf"], "keywords": ["\u673a\u5236\u8bbe\u8ba1", "\u751f\u6210\u5f0fAI", "\u5e7f\u544a\u62cd\u5356", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27382v1", "published_at": "2026-08-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Token-Level Advertising", "tldr": "\u63d0\u51fa\u9762\u5411\u751f\u6210\u5f0fAI\u7684\u9010Token\u5e7f\u544a\u62cd\u5356\u673a\u5236", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Latent Advertiser Mixture Auction\uff08LAMA\uff09\uff0c\u5c06\u5e7f\u544a\u4e3b\u5f71\u54cd\u76f4\u63a5\u5d4c\u5165\u8bed\u8a00\u6a21\u578b\u751f\u6210\u8fc7\u7a0b\uff0c\u5728\u6bcf\u4e2a token \u5c42\u9762\u8fdb\u884c\u6f5c\u5728\u6df7\u5408\u5f0f\u5206\u914d\u4e0e\u89e3\u7801\u3002\u8be5\u673a\u5236\u8bc1\u660e\u6ee1\u8db3\u9a6c\u5c14\u53ef\u592b DSIC \u4e0e\u4e2a\u4f53\u7406\u6027\uff0c\u5e76\u53ef\u901a\u8fc7\u5b66\u4e60\u65b9\u6cd5\u5728\u7ebf\u91cd\u6784\u5e7f\u544a\u4e3b\u62a5\u4ef7\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5e7f\u544a\u673a\u5236\u4ece\u4f20\u7edf\u56fa\u5b9a\u5e7f\u544a\u4f4d\u63a8\u8fdb\u5230\u751f\u6210\u5f0f\u5185\u5bb9\u5185\u90e8\uff0c\u4e3a\u641c\u7d22\u3001\u95ee\u7b54\u548c\u5bf9\u8bdd\u5f0f AI \u4e2d\u7684\u201c\u751f\u6210\u539f\u751f\u5e7f\u544a\u201d\u63d0\u4f9b\u4e86\u673a\u5236\u8bbe\u8ba1\u4e0e\u5b66\u4e60\u5b9e\u73b0\u6846\u67b6\uff0c\u517c\u5177\u7406\u8bba\u4fdd\u8bc1\u548c\u521d\u6b65\u5b9e\u8bc1\u4ef7\u503c\u3002"}, {"abstract": "Language model pretraining has become almost synonymous with prohibitive cost, placing it out of reach for much of the academic and open-source communities. Although strong open-source efforts already exist, including open-weight models and open-source training recipes, a cost-efficient, hardware-accessible, and open-source pretraining recipe has long been missing. Even at a small scale, training Llama-3.2-3B costs over \\$1.5M, and reproducing SmolLM3-3B needs over \\$700K. In this report, we present an open pretraining recipe designed to lower this barrier. Using this recipe, we train a collection of Puro-2B models from scratch on up to 1.4 trillion tokens with FP8 precision on consumer-grade RTX 5090 GPUs. The models in the collection differ in token budgets and selected recipe variants. Our best model is trained at a compute cost of less than \\$6.9K and approaches Qwen2.5-1.5B performance under our evaluation protocol. This cost efficiency is enabled by a combination of approaches, including hardware selection, low-precision training, hyperball optimization, curriculum model averaging, and the data recipe. Beyond the recipe itself, we provide two additional results. First, across the Puro-2B collection, we derive a Puro Cost Scaling Law that relates training cost to average model performance; the fitted law suggests that about \\$4.4K, less than \\$5,090, is sufficient to reach the performance of Qwen2-1.5B. Second, as an end-to-end case study, we examine how pretraining data curricula shape downstream performance after post-training. Such controlled studies are enabled by having access to the full pretraining pipeline rather than model weights alone. We release the full training recipe for Puro-2B, including data, code, and model weights under Apache 2.0 at https://huggingface.co/collections/thu-pacman/puro-2b.", "arxiv_id": "2608.27370", "arxiv_url": "https://arxiv.org/abs/2608.27370", "authors": ["Kairong Luo", "Jiarui Cui", "Yaorui Yin", "Shengqi Chen", "Yiming Yang", "Linxiang Gao", "Yanmohan Wang", "Mingzhe Zhang", "Kaiyue Wen", "Kaifeng Lyu", "Wenguang Chen"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u5f00\u6e90 Puro-2B \u9884\u8bad\u7ec3\u914d\u65b9\uff0c\u7528 RTX 5090 \u6d88\u8d39\u7ea7 GPU \u4ece\u96f6\u8bad\u7ec3\u6700\u9ad8 1.4 \u4e07\u4ebf token \u7684 2B \u8bed\u8a00\u6a21\u578b\u3002\u6700\u4f73\u6a21\u578b\u8bad\u7ec3\u6210\u672c\u4f4e\u4e8e 6900 \u7f8e\u5143\uff0c\u6027\u80fd\u63a5\u8fd1 Qwen2.5-1.5B\uff0c\u5e76\u7ed9\u51fa\u6210\u672c-\u6027\u80fd\u7f29\u653e\u89c4\u5f8b\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27370", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7 FP8 \u4f4e\u7cbe\u5ea6\u8bad\u7ec3\u3001\u786c\u4ef6\u9009\u62e9\u3001Hyperball \u4f18\u5316\u3001\u8bfe\u7a0b\u6a21\u578b\u5e73\u5747\u548c\u6570\u636e\u914d\u65b9\u964d\u4f4e\u9884\u8bad\u7ec3\u6210\u672c", "\u5728 Puro-2B \u7cfb\u5217\u4e0a\u62df\u5408 Puro Cost Scaling Law\uff0c\u4f30\u8ba1\u7ea6 4400 \u7f8e\u5143\u5373\u53ef\u8fbe\u5230 Qwen2-1.5B \u6027\u80fd", "\u5b8c\u6574\u5f00\u6e90\u6570\u636e\u3001\u4ee3\u7801\u3001\u8bad\u7ec3\u914d\u65b9\u4e0e\u6a21\u578b\u6743\u91cd\uff0c\u652f\u6301\u7814\u7a76\u8005\u590d\u73b0\u548c\u5206\u6790\u9884\u8bad\u7ec3\u6570\u636e\u8bfe\u7a0b\u5bf9\u540e\u8bad\u7ec3\u8868\u73b0\u7684\u5f71\u54cd"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u9884\u8bad\u7ec3", "\u4f4e\u6210\u672c\u8bad\u7ec3", "\u5f00\u6e90\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27370v1", "published_at": "2026-08-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Puro-2B: Poor Lab\u0027s Qwen2-1.5B Trained on RTX 5090 within $5090", "tldr": "\u7528\u6d88\u8d39\u7ea7\u663e\u5361\u4f4e\u6210\u672c\u9884\u8bad\u7ec32B\u8bed\u8a00\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5e76\u5f00\u6e90 Puro-2B \u9884\u8bad\u7ec3\u914d\u65b9\uff0c\u7528 RTX 5090 \u6d88\u8d39\u7ea7 GPU \u4ece\u96f6\u8bad\u7ec3\u6700\u9ad8 1.4 \u4e07\u4ebf token \u7684 2B \u8bed\u8a00\u6a21\u578b\u3002\u6700\u4f73\u6a21\u578b\u8bad\u7ec3\u6210\u672c\u4f4e\u4e8e 6900 \u7f8e\u5143\uff0c\u6027\u80fd\u63a5\u8fd1 Qwen2.5-1.5B\uff0c\u5e76\u7ed9\u51fa\u6210\u672c-\u6027\u80fd\u7f29\u653e\u89c4\u5f8b\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u4ece\u96f6\u9884\u8bad\u7ec3\u5c0f\u578b\u5927\u8bed\u8a00\u6a21\u578b\u7684\u6210\u672c\u964d\u5230\u6570\u5343\u7f8
