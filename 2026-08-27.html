\u5d29\u6e83\uff0c\u6307\u51fa\u4e86\u8be5\u65b9\u5411\u7684\u5173\u952e\u74f6\u9888\u3002"}, {"abstract": "Explicit visual intermediates can help multimodal large language models (MLLMs) externalize spatial evidence and updated visual states, but their utility depends on whether an image editor can faithfully realize the required transformation. We introduce \\textbf{Aphanta}, an automated task-discovery and closed-loop diagnostic framework for the MLLM -\u003e image editor -\u003e MLLM pipeline. Aphanta evaluates three conditions---direct reasoning, reasoning with an editor-generated intermediate, and reasoning with an idealized reference intermediate---to separate potential visual headroom from the practical utility of current editors. Across 20 candidate tasks and multiple editor--MLLM combinations, we find that utility is strongly task-conditioned. Gains concentrate in visual cue injection, grounding, and counterfactual state realization, whereas intermediates requiring symbol-sensitive construction or structural extrapolation are substantially less reliable. On the selected positive-task subset, our consolidated Qwen pipeline improves the mean task score from 0.343 to 0.445 ($+10.2$ points; $+29.7\\%$ relative), while the full study also retains filtered and unsuccessful tasks to expose the boundary. These results position image editing as a specialized visual workspace rather than a universal reasoning mechanism, and establish Aphanta as a reusable protocol for measuring task--representation alignment, editor realization, and downstream pipeline utility.", "arxiv_id": "2608.26993", "arxiv_url": "https://arxiv.org/abs/2608.26993", "authors": ["Hengyuan Xu", "Wei Cheng", "Yumeng Ji", "Xuanyang Zhang", "Xianfang Zeng", "Gang Yu", "Xingjun Ma"], "brief": "\u8bba\u6587\u63d0\u51fa Aphanta\uff0c\u4e00\u4e2a\u81ea\u52a8\u4efb\u52a1\u53d1\u73b0\u4e0e\u95ed\u73af\u8bca\u65ad\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30 MLLM\u2192\u56fe\u50cf\u7f16\u8f91\u5668\u2192MLLM \u6d41\u7a0b\u4e2d\u7684\u663e\u5f0f\u89c6\u89c9\u4e2d\u95f4\u6001\u662f\u5426\u771f\u6b63\u5e2e\u52a9\u63a8\u7406\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u76f4\u63a5\u63a8\u7406\u3001\u7f16\u8f91\u5668\u751f\u6210\u4e2d\u95f4\u6001\u63a8\u7406\u548c\u7406\u60f3\u53c2\u8003\u4e2d\u95f4\u6001\u63a8\u7406\uff0c\u533a\u5206\u6f5c\u5728\u6536\u76ca\u4e0e\u5f53\u524d\u7f16\u8f91\u5668\u7684\u5b9e\u9645\u53ef\u7528\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26993", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u572820\u7c7b\u5019\u9009\u4efb\u52a1\u548c\u591a\u79cd\u56fe\u50cf\u7f16\u8f91\u5668\u2014MLLM\u7ec4\u5408\u4e0a\u8bc4\u6d4b\uff0c\u53d1\u73b0\u89c6\u89c9\u4e2d\u95f4\u6001\u7684\u6536\u76ca\u9ad8\u5ea6\u4f9d\u8d56\u4efb\u52a1\u7c7b\u578b", "\u6536\u76ca\u4e3b\u8981\u96c6\u4e2d\u5728\u89c6\u89c9\u7ebf\u7d22\u6ce8\u5165\u3001\u89c6\u89c9 grounding \u548c\u53cd\u4e8b\u5b9e\u72b6\u6001\u5b9e\u73b0\u7b49\u4efb\u52a1", "\u5bf9\u7b26\u53f7\u654f\u611f\u6784\u9020\u6216\u7ed3\u6784\u5916\u63a8\u7c7b\u4e2d\u95f4\u6001\uff0c\u5f53\u524d\u56fe\u50cf\u7f16\u8f91\u5668\u53ef\u9760\u6027\u660e\u663e\u4e0d\u8db3\uff1b\u6b63\u5411\u4efb\u52a1\u5b50\u96c6\u4e0a Qwen \u7ba1\u7ebf\u5e73\u5747\u5206\u4ece0.343\u63d0\u5347\u52300.445"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u7f16\u8f91", "\u89c6\u89c9\u63a8\u7406", "\u8bc4\u6d4b\u6846\u67b6"], "num_comments": 1, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2608.26993v1", "published_at": "2026-08-27", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26993.png", "title": "Aphanta: Diagnosing Task-Aligned Image-Edited Intermediates for Multimodal Reasoning", "tldr": "\u8bca\u65ad\u56fe\u50cf\u7f16\u8f91\u4e2d\u95f4\u6001\u5bf9\u591a\u6a21\u6001\u63a8\u7406\u7684\u771f\u5b9e\u4ef7\u503c", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Aphanta\uff0c\u4e00\u4e2a\u81ea\u52a8\u4efb\u52a1\u53d1\u73b0\u4e0e\u95ed\u73af\u8bca\u65ad\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30 MLLM\u2192\u56fe\u50cf\u7f16\u8f91\u5668\u2192MLLM \u6d41\u7a0b\u4e2d\u7684\u663e\u5f0f\u89c6\u89c9\u4e2d\u95f4\u6001\u662f\u5426\u771f\u6b63\u5e2e\u52a9\u63a8\u7406\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u76f4\u63a5\u63a8\u7406\u3001\u7f16\u8f91\u5668\u751f\u6210\u4e2d\u95f4\u6001\u63a8\u7406\u548c\u7406\u60f3\u53c2\u8003\u4e2d\u95f4\u6001\u63a8\u7406\uff0c\u533a\u5206\u6f5c\u5728\u6536\u76ca\u4e0e\u5f53\u524d\u7f16\u8f91\u5668\u7684\u5b9e\u9645\u53ef\u7528\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7cfb\u7edf\u6027\u63ed\u793a\u4e86\u56fe\u50cf\u7f16\u8f91\u5e76\u975e\u901a\u7528\u591a\u6a21\u6001\u63a8\u7406\u673a\u5236\uff0c\u800c\u66f4\u50cf\u7279\u5b9a\u4efb\u52a1\u4e0b\u7684\u89c6\u89c9\u5de5\u4f5c\u533a\uff1bAphanta \u63d0\u4f9b\u4e86\u53ef\u590d\u7528\u534f\u8bae\uff0c\u7528\u4e8e\u8bc4\u4f30\u4efb\u52a1\u3001\u89c6\u89c9\u8868\u793a\u3001\u7f16\u8f91\u5668\u5b9e\u73b0\u80fd\u529b\u4e0e\u4e0b\u6e38\u63a8\u7406\u6536\u76ca\u4e4b\u95f4\u7684\u5339\u914d\u5173\u7cfb\u3002"}, {"abstract": "Currently used sepsis severity indices rely on fixed variables and weights established decades ago, which are coarsely discretized and calibrated to a cohort that no longer reflects contemporary critical care. No alternative learned directly from patient trajectories is in routine use. We conducted a retrospective two-cohort study on a total of 29,116 and 7,691 adult patients meeting Sepsis-3 criteria from two hospital systems in Massachusetts and Georgie, respectively. We developed a sepsis index using 43 routinely charted variables over a 72-hour treatment window. Unlike previous studies, we use mortality as a treatment-level ranking signal rather than a per-state target, allowing credit to be redistributed non-uniformly across timesteps. Evaluation was done on a permanent 20% test holdout, using clinical vignettes and Spearman correlation. Uncertainty intervals were obtained by bootstrap resampling of whole patients. Under this ranking scheme, non-survivors scored 1.19-1.64 points higher than survivors on a 0-10 scale within all strata of baseline SOFA-2, with similar results stratifying within lactate, mean arterial pressure (MAP), and creatinine. Within-patient change in the index correlated with change in lactate (Spearman rho = 0.39; n = 1,854). Similar, weaker correlations were found for MAP and creatinine. On a cohort level, cross-institutional agreement measured by Spearman correlation between models trained on different sites, were 70-77% of same-site correlation. External within-patient correlations were 0.54 and 0.59 against ceilings of 0.92 and 0.90. Our index also correlated with established indices, while null controls stayed near zero. Our index demonstrated hourly prognostic information that meaningfully separates patient outcomes and is consistent with clinical expectation, indicating potential as a decision support tool complementing clinical judgement.", "arxiv_id": "2608.27421", "arxiv_url": "https://arxiv.org/abs/2608.27421", "authors": ["Kevin Zhu", "Ryan Zhang", "Baraa Abed", "Tilendra Choudhary", "Malvern Madondo", "Mehak Arora", "Yixuan Yang", "Alasdair Gent", "Aditya Nagori", "Omer T. Inan", "Krista L. Haines", "Patrick Georgoff", "Suresh M. Agarwal", "Vijay Krishnamoorthy", "Tetsu Ohnuma", "Mihai V. Podgoreanu", "Michael R. Pinsky", "Gilles Clermont", "Craig M. Coopersmith", "Craig S. Jabaley", "Rishikesan Kamaleswaran"], "brief": "\u672c\u6587\u57fa\u4e8e\u4e24\u5bb6\u533b\u9662\u7684\u56de\u987e\u6027\u8113\u6bd2\u75c7\u961f\u5217\uff0c\u5229\u752872\u5c0f\u65f6\u6cbb\u7597\u7a97\u53e3\u518543\u4e2a\u5e38\u89c4\u4e34\u5e8a\u53d8\u91cf\uff0c\u5b66\u4e60\u4e00\u4e2a0-10\u5206\u7684\u8fde\u7eed\u8113\u6bd2\u75c7\u4e25\u91cd\u5ea6\u6307\u6570\u3002\u65b9\u6cd5\u4e0d\u628a\u6b7b\u4ea1\u7387\u5f53\u4f5c\u6bcf\u4e2a\u65f6\u523b\u7684\u76f4\u63a5\u6807\u7b7e\uff0c\u800c\u662f\u4f5c\u4e3a\u6cbb\u7597\u8f68\u8ff9\u7ea7\u6392\u5e8f\u4fe1\u53f7\uff0c\u5c06\u9884\u540e\u4fe1\u606f\u975e\u5747\u5300\u5206\u914d\u5230\u4e0d\u540c\u65f6\u95f4\u70b9\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27421", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7814\u7a76\u7eb3\u5165\u4e24\u7ad9\u70b9\u517129,116\u540d\u548c7,691\u540d\u7b26\u5408Sepsis-3\u6807\u51c6\u7684\u6210\u4eba\u60a3\u8005\uff0c\u5e76\u4f7f\u7528\u56fa\u5b9a20%\u6d4b\u8bd5\u96c6\u8bc4\u4f30\u3002", "\u5728\u76f8\u540c\u57fa\u7ebfSOFA-2\u3001\u4e73\u9178\u3001\u5e73\u5747\u52a8\u8109\u538b\u548c\u808c\u9150\u5206\u5c42\u5185\uff0c\u6b7b\u4ea1\u60a3\u8005\u8bc4\u5206\u6bd4\u5b58\u6d3b\u60a3\u8005\u9ad81.19-1.64\u5206\u3002", "\u8bc4\u5206\u53d8\u5316\u4e0e\u4e73\u9178\u53d8\u5316\u76f8\u5173\u6027\u8f83\u5f3a\uff08Spearman \u03c1=0.39\uff09\uff0c\u8de8\u673a\u6784\u6a21\u578b\u4e00\u81f4\u6027\u8fbe\u5230\u540c\u7ad9\u70b9\u76f8\u5173\u6027\u768470%-77%\u3002"], "keywords": ["\u533b\u7597AI", "\u65f6\u95f4\u5e8f\u5217", "\u98ce\u9669\u8bc4\u5206", "\u4e34\u5e8a\u51b3\u7b56\u652f\u6301"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27421v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Learning a Continuous Sepsis Severity Score Without Hour-by-Hour Supervision: A Two-Site Retrospective Study", "tldr": "\u65e0\u9700\u9010\u5c0f\u65f6\u6807\u6ce8\u5b66\u4e60\u8fde\u7eed\u8113\u6bd2\u75c7\u4e25\u91cd\u5ea6\u8bc4\u5206", "upvotes": 0, "what_it_is": "\u672c\u6587\u57fa\u4e8e\u4e24\u5bb6\u533b\u9662\u7684\u56de\u987e\u6027\u8113\u6bd2\u75c7\u961f\u5217\uff0c\u5229\u752872\u5c0f\u65f6\u6cbb\u7597\u7a97\u53e3\u518543\u4e2a\u5e38\u89c4\u4e34\u5e8a\u53d8\u91cf\uff0c\u5b66\u4e60\u4e00\u4e2a0-10\u5206\u7684\u8fde\u7eed\u8113\u6bd2\u75c7\u4e25\u91cd\u5ea6\u6307\u6570\u3002\u65b9\u6cd5\u4e0d\u628a\u6b7b\u4ea1\u7387\u5f53\u4f5c\u6bcf\u4e2a\u65f6\u523b\u7684\u76f4\u63a5\u6807\u7b7e\uff0c\u800c\u662f\u4f5c\u4e3a\u6cbb\u7597\u8f68\u8ff9\u7ea7\u6392\u5e8f\u4fe1\u53f7\uff0c\u5c06\u9884\u540e\u4fe1\u606f\u975e\u5747\u5300\u5206\u914d\u5230\u4e0d\u540c\u65f6\u95f4\u70b9\u3002", "why_notable": "\u4f20\u7edf\u8113\u6bd2\u75c7\u8bc4\u5206\u4f9d\u8d56\u56fa\u5b9a\u53d8\u91cf\u548c\u51e0\u5341\u5e74\u524d\u8bbe\u5b9a\u7684\u6743\u91cd\uff0c\u800c\u8be5\u7814\u7a76\u5c55\u793a\u4e86\u53ef\u4ece\u771f\u5b9e\u60a3\u8005\u8f68\u8ff9\u4e2d\u5b66\u4e60\u52a8\u6001\u3001\u8fde\u7eed\u3001\u5c0f\u65f6\u7ea7\u9884\u540e\u8bc4\u5206\u7684\u53ef\u884c\u6027\uff0c\u6709\u671b\u4f5c\u4e3a\u4e34\u5e8a\u51b3\u7b56\u652f\u6301\u5de5\u5177\u8865\u5145\u533b\u751f\u5224\u65ad\u3002"}, {"abstract": "LLMs are increasingly able to answer complex questions about enterprise-scale document collections. But evaluation is hard: companies don\u0027t want to share internal communications, and synthetic datasets have been overly simple. We present CorporateBench (CB), a human-validated multi-task Q\u0026A benchmark whose scale approaches the conditions LLMs encounter in corporate communication networks, with evaluation corpora surpassing 230,000 documents. CB evaluates LLMs across two dimensions (information extraction and knowledge base querying) through four synthetically generated firms ranging from 12 to 10,000 employees. Each corpus is sampled from a temporally evolving knowledge base describing a consistent world, guaranteeing cross-document logical consistency even across hundreds of thousands of documents. We evaluate five LLMs on CB, revealing increasingly poor performance as input size approaches realistic scales. CB provides LLM developers a metric for corporate communication reasoning, filling a crucial gap in the benchmarking ecosystem.", "arxiv_id": "2608.27391", "arxiv_url": "https://arxiv.org/abs/2608.27391", "authors": ["Sil Hamilton", "Albert Yu Sun", "Oscar J. Romero", "Carl-Leander Henneking", "David Mimno", "Bishan Yang", "Igor Labutov"], "brief": "\u8bba\u6587\u63d0\u51fa CorporateBench\uff0c\u4e00\u4e2a\u4eba\u5de5\u9a8c\u8bc1\u7684\u591a\u4efb\u52a1\u95ee\u7b54\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4f01\u4e1a\u7ea7\u6587\u6863\u96c6\u5408\u4e0a\u7684\u4fe1\u606f\u62bd\u53d6\u4e0e\u77e5\u8bc6\u5e93\u67e5\u8be2\u80fd\u529b\u3002\u5176\u8bed\u6599\u6765\u81ea\u968f\u65f6\u95f4\u6f14\u5316\u7684\u5408\u6210\u4f01\u4e1a\u77e5\u8bc6\u5e93\uff0c\u89c4\u6a21\u6700\u9ad8\u8d85\u8fc723\u4e07\u4efd\u6587\u6863\u3002", "categories": ["cs.AI", "cs.CL", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27391", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa4\u4e2a\u5408\u6210\u516c\u53f8\u573a\u666f\uff0c\u5458\u5de5\u89c4\u6a21\u4ece12\u4eba\u52301\u4e07\u4eba\uff0c\u6a21\u62df\u771f\u5b9e\u4f01\u4e1a\u901a\u4fe1\u7f51\u7edc", "\u57fa\u4e8e\u65f6\u95f4\u6f14\u5316\u77e5\u8bc6\u5e93\u751f\u6210\u6587\u6863\uff0c\u4fdd\u8bc1\u8de8\u6587\u6863\u3001\u8de8\u65f6\u95f4\u7684\u903b\u8f91\u4e00\u81f4\u6027", "\u8bc4\u6d4b5\u4e2a\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u53d1\u73b0\u968f\u7740\u8f93\u5165\u89c4\u6a21\u63a5\u8fd1\u771f\u5b9e\u4f01\u4e1a\u573a\u666f\uff0c\u6a21\u578b\u6027\u80fd\u663e\u8457\u4e0b\u964d"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u95ee\u7b54\u57fa\u51c6", "\u77e5\u8bc6\u5e93", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27391v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CorporateBench: Large-Scale Q\u0026A Benchmarking with Temporal Knowledge Bases", "tldr": "\u9762\u5411\u4f01\u4e1a\u901a\u4fe1\u63a8\u7406\u7684\u5927\u89c4\u6a21\u95ee\u7b54\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CorporateBench\uff0c\u4e00\u4e2a\u4eba\u5de5\u9a8c\u8bc1\u7684\u591a\u4efb\u52a1\u95ee\u7b54\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u4f01\u4e1a\u7ea7\u6587\u6863\u96c6\u5408\u4e0a\u7684\u4fe1\u606f\u62bd\u53d6\u4e0e\u77e5\u8bc6\u5e93\u67e5\u8be2\u80fd\u529b\u3002\u5176\u8bed\u6599\u6765\u81ea\u968f\u65f6\u95f4\u6f14\u5316\u7684\u5408\u6210\u4f01\u4e1a\u77e5\u8bc6\u5e93\uff0c\u89c4\u6a21\u6700\u9ad8\u8d85\u8fc723\u4e07\u4efd\u6587\u6863\u3002", "why_notable": "\u5b83\u586b\u8865\u4e86\u4f01\u4e1a\u5185\u90e8\u901a\u4fe1\u4e0e\u5927\u89c4\u6a21\u6587\u6863\u63a8\u7406\u8bc4\u6d4b\u7684\u7a7a\u767d\uff0c\u5728\u4e0d\u6cc4\u9732\u771f\u5b9e\u4f01\u4e1a\u6570\u636e\u7684\u524d\u63d0\u4e0b\u63d0\u4f9b\u66f4\u63a5\u8fd1\u5b9e\u9645\u90e8\u7f72\u96be\u5ea6\u7684\u57fa\u51c6\u3002"}, {"abstract": "We establish a sharp phase transition for fitting random vectors by an ellipsoid. The random vectors have independent subgaussian coordinates with mean zero, variance one, and a common fourth moment, and the number of vectors is proportional to the square of the dimension. We identify an explicit satisfiability threshold such that, with high probability, a positive definite ellipsoid passes through every data point below the threshold, whereas no positive semidefinite fit exists above it. We also determine the optimal squared fitting error throughout the unsatisfiable regime. In particular, the threshold depends on the coordinate distributions only through their common fourth moment, revealing a fourth moment universality phenomenon. For standard Gaussian data the threshold is $1/4$, resolving the ellipsoid fitting conjecture.", "arxiv_id": "2608.27372", "arxiv_url": "https://arxiv.org/abs/2608.27372", "authors": ["Frederic Koehler", "Youngtak Sohn"], "brief": "\u8bba\u6587\u8bc1\u660e\u4e86\u9ad8\u7ef4\u968f\u673a\u5411\u91cf\u692d\u7403\u62df\u5408\u95ee\u9898\u7684\u5c16\u9510\u76f8\u53d8\uff1a\u5f53\u6837\u672c\u6570\u4e0e\u7ef4\u5ea6\u5e73\u65b9\u6210\u6bd4\u4f8b\u65f6\uff0c\u5b58\u5728\u663e\u5f0f\u53ef\u6ee1\u8db3\u6027\u9608\u503c\u3002\u4f4e\u4e8e\u9608\u503c\u65f6\u9ad8\u6982\u7387\u5b58\u5728\u6b63\u5b9a\u692d\u7403\u7a7f\u8fc7\u6240\u6709\u70b9\uff0c\u9ad8\u4e8e\u9608\u503c\u65f6\u8fde\u534a\u6b63\u5b9a\u62df\u5408\u4e5f\u4e0d\u5b58\u5728\uff0c\u5e76\u7ed9\u51fa\u4e0d\u53ef\u6ee1\u8db3\u533a\u95f4\u7684\u6700\u4f18\u5e73\u65b9\u62df\u5408\u8bef\u5dee\u3002", "categories": ["math.PR", "cond-mat.dis-nn", "cs.DS", "cs.LG", "math.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27372", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7814\u7a76\u5bf9\u8c61\u4e3a\u5750\u6807\u72ec\u7acb\u3001\u96f6\u5747\u503c\u3001\u5355\u4f4d\u65b9\u5dee\u3001\u5171\u540c\u56db\u9636\u77e9\u7684\u6b21\u9ad8\u65af\u968f\u673a\u5411\u91cf", "\u9608\u503c\u4ec5\u4f9d\u8d56\u5750\u6807\u5206\u5e03\u7684\u5171\u540c\u56db\u9636\u77e9\uff0c\u63ed\u793a\u692d\u7403\u62df\u5408\u4e2d\u7684\u56db\u9636\u77e9\u666e\u9002\u6027", "\u5bf9\u6807\u51c6\u9ad8\u65af\u6570\u636e\u8bc1\u660e\u9608\u503c\u4e3a 1/4\uff0c\u89e3\u51b3\u4e86\u692d\u7403\u62df\u5408\u731c\u60f3"], "keywords": ["\u968f\u673a\u77e9\u9635", "\u9ad8\u7ef4\u7edf\u8ba1", "\u76f8\u53d8", "\u666e\u9002\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27372v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Universality and sharp thresholds for ellipsoid fitting", "tldr": "\u968f\u673a\u6570\u636e\u692d\u7403\u62df\u5408\u5b58\u5728\u56db\u9636\u77e9\u666e\u9002\u9608\u503c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u8bc1\u660e\u4e86\u9ad8\u7ef4\u968f\u673a\u5411\u91cf\u692d\u7403\u62df\u5408\u95ee\u9898\u7684\u5c16\u9510\u76f8\u53d8\uff1a\u5f53\u6837\u672c\u6570\u4e0e\u7ef4\u5ea6\u5e73\u65b9\u6210\u6bd4\u4f8b\u65f6\uff0c\u5b58\u5728\u663e\u5f0f\u53ef\u6ee1\u8db3\u6027\u9608\u503c\u3002\u4f4e\u4e8e\u9608\u503c\u65f6\u9ad8\u6982\u7387\u5b58\u5728\u6b63\u5b9a\u692d\u7403\u7a7f\u8fc7\u6240\u6709\u70b9\uff0c\u9ad8\u4e8e\u9608\u503c\u65f6\u8fde\u534a\u6b63\u5b9a\u62df\u5408\u4e5f\u4e0d\u5b58\u5728\uff0c\u5e76\u7ed9\u51fa\u4e0d\u53ef\u6ee1\u8db3\u533a\u95f4\u7684\u6700\u4f18\u5e73\u65b9\u62df\u5408\u8bef\u5dee\u3002", "why_notable": "\u8be5\u7ed3\u679c\u7ed9\u51fa\u4e86\u968f\u673a\u51e0\u4f55/\u9ad8\u7ef4\u7edf\u8ba1\u4e2d\u692d\u7403\u63d2\u503c\u95ee\u9898\u7684\u5b8c\u6574\u76f8\u53d8\u56fe\u666f\uff0c\u5e76\u5c06\u9608\u503c\u4ece\u9ad8\u65af\u60c5\u5f62\u63a8\u5e7f\u5230\u5e7f\u6cdb\u7684\u6b21\u9ad8\u65af\u5206\u5e03\uff0c\u5177\u6709\u660e\u786e\u7684\u7406\u8bba\u7a81\u7834\u610f\u4e49\u3002"}, {"abstract": "Block drafters propose several tokens in one forward pass, before earlier target tokens are realised. Their rejection mixes two losses: missing within-block path information and imperfect modelling of observable information. Accepted length cannot distinguish them. We separate the two with an information floor, the minimum expected rejection at a specified conditioning order; rejection above this floor is the model gap. Estimating both from target rollouts across four domains, four open-weight targets, and a frontier API target yields three findings. First, the all-parallel floor reaches $0.286$ at the final slot on Qwen3-4B, limiting even the best proposal to $71\\%$ per-slot acceptance. Second, one realised token removes $86$--$100\\%$ of this floor, a locality also recovered by an independent mutual-information analysis. Third, current drafters remain far above their floors: the final-slot model gap accounts for $43$--$64\\%$ of DFlash rejection and $85$--$92\\%$ of DSpark\u0027s oracle-conditioned rejection. These findings separate the value of short-range conditioning from proposal quality.", "arxiv_id": "2608.27339", "arxiv_url": "https://arxiv.org/abs/2608.27339", "authors": ["Xinwei Qiang", "Xiang Fang", "Chang Chen", "Yue Guan", "Yufei Ding"], "brief": "\u672c\u6587\u7814\u7a76\u5757\u8349\u7a3f\u5668\u4e00\u6b21\u524d\u5411\u751f\u6210\u591a\u4e2a token \u65f6\u7684\u62d2\u7edd\u6765\u6e90\uff0c\u63d0\u51fa\u201c\u4fe1\u606f\u4e0b\u9650\u201d\u6765\u533a\u5206\u5757\u5185\u8def\u5f84\u4fe1\u606f\u7f3a\u5931\u5e26\u6765\u7684\u4e0d\u53ef\u907f\u514d\u62d2\u7edd\u4e0e\u6a21\u578b\u5efa\u6a21\u4e0d\u8db3\u9020\u6210\u7684\u989d\u5916\u5dee\u8ddd\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u9886\u57df\u3001\u5f00\u6e90\u6a21\u578b\u548c\u524d\u6cbf API \u76ee\u6807\u6a21\u578b\u4e0a\u4f30\u8ba1\u4e24\u8005\uff0c\u5e76\u5206\u6790\u77ed\u7a0b\u6761\u4ef6\u4fe1\u606f\u5bf9\u63a5\u53d7\u7387\u7684\u5f71\u54cd\u3002", "categories": ["cs.LG", "cs.CL", "cs.IT"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27339", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u4fe1\u606f\u4e0b\u9650\uff1a\u5728\u7ed9\u5b9a\u6761\u4ef6\u987a\u5e8f\u4e0b\uff0c\u7406\u8bba\u4e0a\u6700\u5c0f\u7684\u671f\u671b\u62d2\u7edd\u7387\uff1b\u8d85\u8fc7\u8be5\u4e0b\u9650\u7684\u90e8\u5206\u5b9a\u4e49\u4e3a\u6a21\u578b\u5dee\u8ddd\u3002", "\u5b9e\u9a8c\u663e\u793a\u5168\u5e76\u884c\u8bbe\u7f6e\u4e0b\uff0cQwen3-4B \u6700\u540e\u4f4d\u7f6e\u7684\u4fe1\u606f\u4e0b\u9650\u8fbe 0.286\uff0c\u5373\u4f7f\u6700\u4f18\u63d0\u8bae\u5668\u5355\u4f4d\u7f6e\u63a5\u53d7\u7387\u4e5f\u6700\u591a\u7ea6 71%\u3002", "\u53ea\u5b9e\u73b0\u4e00\u4e2a\u524d\u5e8f token \u5c31\u80fd\u6d88\u9664 86%\u2013100% \u7684\u4fe1\u606f\u4e0b\u9650\uff0c\u8bf4\u660e\u5757\u5185\u4f9d\u8d56\u9ad8\u5ea6\u5c40\u90e8\uff1b\u4f46\u73b0\u6709 DFlash\u3001DSpark \u4ecd\u663e\u8457\u9ad8\u4e8e\u5404\u81ea\u4e0b\u9650\u3002"], "keywords": ["\u63a8\u7406\u52a0\u901f", "\u6295\u673a\u89e3\u7801", "\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27339v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Parallel Blindness: Information Floors and Model Gaps in Block Drafting", "tldr": "\u91cf\u5316\u5757\u8349\u7a3f\u89e3\u7801\u4e2d\u7684\u4fe1\u606f\u7f3a\u5931\u4e0e\u6a21\u578b\u5dee\u8ddd", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5757\u8349\u7a3f\u5668\u4e00\u6b21\u524d\u5411\u751f\u6210\u591a\u4e2a token \u65f6\u7684\u62d2\u7edd\u6765\u6e90\uff0c\u63d0\u51fa\u201c\u4fe1\u606f\u4e0b\u9650\u201d\u6765\u533a\u5206\u5757\u5185\u8def\u5f84\u4fe1\u606f\u7f3a\u5931\u5e26\u6765\u7684\u4e0d\u53ef\u907f\u514d\u62d2\u7edd\u4e0e\u6a21\u578b\u5efa\u6a21\u4e0d\u8db3\u9020\u6210\u7684\u989d\u5916\u5dee\u8ddd\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u9886\u57df\u3001\u5f00\u6e90\u6a21\u578b\u548c\u524d\u6cbf API \u76ee\u6807\u6a21\u578b\u4e0a\u4f30\u8ba1\u4e24\u8005\uff0c\u5e76\u5206\u6790\u77ed\u7a0b\u6761\u4ef6\u4fe1\u606f\u5bf9\u63a5\u53d7\u7387\u7684\u5f71\u54cd\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u4e3a\u6295\u673a\u89e3\u7801/\u5757\u5e76\u884c\u8349\u7a3f\u7684\u74f6\u9888\u63d0\u4f9b\u4e86\u53ef\u5206\u89e3\u7684\u8bc4\u4f30\u6846\u67b6\uff0c\u8bf4\u660e\u63d0\u5347\u63a5\u53d7\u7387\u4e0d\u80fd\u53ea\u770b\u5e73\u5747\u63a5\u53d7\u957f\u5ea6\uff0c\u8fd8\u8981\u533a\u5206\u4fe1\u606f\u7ed3\u6784\u9650\u5236\u4e0e\u63d0\u8bae\u6a21\u578b\u8d28\u91cf\uff0c\u6709\u52a9\u4e8e\u8bbe\u8ba1\u66f4\u9ad8\u6548\u7684\u77ed\u7a0b\u6761\u4ef6\u8349\u7a3f\u5668\u3002"}, {"abstract": "Inferring molecular structures from multimodal spectroscopic measurements requires integrating complementary yet highly heterogeneous signals. However, the common paradigm of directly concatenating multispectral sequences can exhibit anomalous performance degradation, primarily due to pronounced heterogeneity and the resulting multimodal imbalance across modalities. As a remedy, we propose MM-Spectrum, a sparse Mixture-of-Experts framework tailored for multimodal multispectral spectra-to-structure elucidation. To better match the information characteristics under multispectral imbalance, MM-Spectrum introduces an explicit modality-aware routing mechanism that exposes spectral identity to the router in addition to token content representations. Moreover, it incorporates shared and interaction experts, together with heterogeneous expert capacities, to extract multispectral modality-unique and cross-modal synergistic information while suppressing noise-induced interference. Across full-modality, bimodal, and missing-modality settings on molecular structural elucidation, MM-Spectrum achieves consistent and substantial improvements, supported by ablation studies and interpretability analyses.", "arxiv_id": "2608.27286", "arxiv_url": "https://arxiv.org/abs/2608.27286", "authors": ["Hai-tao Yu", "Nan Min", "Zheng Fang", "Hongyu Zhan", "Yusen Tan", "Yuhan Wang", "Jun Xia"], "brief": "\u8bba\u6587\u63d0\u51fa MM-Spectrum\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u591a\u5149\u8c31\u201c\u8c31\u56fe\u5230\u5206\u5b50\u7ed3\u6784\u89e3\u6790\u201d\u7684\u7a00\u758f Mixture-of-Experts \u6846\u67b6\u3002\u5b83\u9488\u5bf9\u76f4\u63a5\u62fc\u63a5\u5f02\u6784\u5149\u8c31\u5bfc\u81f4\u7684\u6a21\u6001\u4e0d\u5e73\u8861\u548c\u6027\u80fd\u4e0b\u964d\u95ee\u9898\uff0c\u8bbe\u8ba1\u66f4\u7a33\u5b9a\u7684\u8de8\u6a21\u6001\u878d\u5408\u673a\u5236\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27286", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u663e\u5f0f\u6a21\u6001\u611f\u77e5\u8def\u7531\uff0c\u5c06\u5149\u8c31\u6a21\u6001\u8eab\u4efd\u4e0e token \u5185\u5bb9\u8868\u793a\u5171\u540c\u63d0\u4f9b\u7ed9\u8def\u7531\u5668\uff0c\u7f13\u89e3\u591a\u5149\u8c31\u5f02\u6784\u5e26\u6765\u7684\u4e13\u5bb6\u5206\u914d\u5931\u8861\u3002", "\u7ed3\u5408\u5171\u4eab\u4e13\u5bb6\u4e0e\u4ea4\u4e92\u4e13\u5bb6\uff0c\u5206\u522b\u6355\u83b7\u6a21\u6001\u901a\u7528\u4fe1\u606f\u3001\u6a21\u6001\u7279\u6709\u4fe1\u606f\u548c\u8de8\u6a21\u6001\u534f\u540c\u4fe1\u606f\u3002", "\u91c7\u7528\u5f02\u6784\u4e13\u5bb6\u5bb9\u91cf\u4ee5\u9002\u914d\u4e0d\u540c\u5149\u8c31\u6a21\u6001\u7684\u4fe1\u606f\u91cf\u5dee\u5f02\uff0c\u5e76\u5728\u5168\u6a21\u6001\u3001\u53cc\u6a21\u6001\u3001\u7f3a\u5931\u6a21\u6001\u573a\u666f\u4e0b\u5747\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5206\u5b50\u5efa\u6a21", "\u6df7\u5408\u4e13\u5bb6", "\u8c31\u56fe\u89e3\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27286v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MM-Spectrum: Multimodal Multi-spectral Molecular Structural Elucidation with a Stable MoE Framework", "tldr": "\u7528\u7a33\u5b9aMoE\u878d\u5408\u591a\u5149\u8c31\u63a8\u65ad\u5206\u5b50\u7ed3\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MM-Spectrum\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u591a\u5149\u8c31\u201c\u8c31\u56fe\u5230\u5206\u5b50\u7ed3\u6784\u89e3\u6790\u201d\u7684\u7a00\u758f Mixture-of-Experts \u6846\u67b6\u3002\u5b83\u9488\u5bf9\u76f4\u63a5\u62fc\u63a5\u5f02\u6784\u5149\u8c31\u5bfc\u81f4\u7684\u6a21\u6001\u4e0d\u5e73\u8861\u548c\u6027\u80fd\u4e0b\u964d\u95ee\u9898\uff0c\u8bbe\u8ba1\u66f4\u7a33\u5b9a\u7684\u8de8\u6a21\u6001\u878d\u5408\u673a\u5236\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u89e3\u51b3\u4e86\u591a\u5149\u8c31\u5206\u5b50\u7ed3\u6784\u89e3\u6790\u4e2d\u5e38\u89c1\u7684\u201c\u7b80\u5355\u62fc\u63a5\u53cd\u800c\u9000\u5316\u201d\u95ee\u9898\uff0c\u4e3a\u5316\u5b66\u8c31\u56fe\u591a\u6a21\u6001\u878d\u5408\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u3001\u53ef\u89e3\u91ca\u7684 MoE \u65b9\u6848\uff0c\u5177\u6709\u5b9e\u9645\u79d1\u7814\u548c\u836f\u7269\u53d1\u73b0\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "World Action Models (WAMs) augment robot policies by predicting how task-relevant scene states may evolve under interaction. Recent WAMs increasingly perform such prediction in latent representation spaces, avoiding full appearance-level generation while preserving control-relevant information. Yet latent transitions are commonly realized with Transformer-based predictors whose inductive structure is centered on token interaction rather than temporal evolution. We study transition realization as an architectural choice distinct from predictive representation and prediction-policy coupling. We introduce the Latent Evolution Operator Network (LEON), which models latent evolution in a learned observable space through context-modulated operator-based propagation and additive forcing. Grounded in the controlled Koopman generator view of evolution, LEON organizes context-dependent transition variation around a shared evolution-operator structure while retaining a complementary path for additive change. Controlled dynamical systems verify the resulting evolution-specific inductive bias and the complementary roles of operator propagation and forcing. Across two WAM formulations that integrate latent prediction into the policy differently, LEON improves closed-loop performance and robustness while remaining effective under full transition replacement. These results establish transition realization as a consequential architectural choice in latent WAMs.", "arxiv_id": "2608.27259", "arxiv_url": "https://arxiv.org/abs/2608.27259", "authors": ["Xiaoxiao Lu", "Yunlong Dong", "Jiahao Shi", "Ye Yuan"], "brief": "\u8bba\u6587\u63d0\u51fa Latent Evolution Operator Network\uff08LEON\uff09\uff0c\u7528\u4e8e\u5728\u6f5c\u8868\u793a\u7a7a\u95f4\u4e2d\u5efa\u6a21\u673a\u5668\u4eba\u4ea4\u4e92\u4e0b\u7684\u573a\u666f\u72b6\u6001\u6f14\u5316\u3002\u5b83\u5c06\u6f5c\u53d8\u91cf\u8f6c\u79fb\u4ece\u5e38\u89c1 Transformer \u9884\u6d4b\u5668\u6539\u4e3a\u57fa\u4e8e\u53d7\u63a7 Koopman \u751f\u6210\u5143\u601d\u60f3\u7684\u7b97\u5b50\u4f20\u64ad\u4e0e\u52a0\u6027 forcing \u7ec4\u5408\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27259", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u201c\u8f6c\u79fb\u5b9e\u73b0\u65b9\u5f0f\u201d\u4ece\u8868\u793a\u5b66\u4e60\u548c\u7b56\u7565\u8026\u5408\u4e2d\u72ec\u7acb\u51fa\u6765\u7814\u7a76\uff0c\u5f3a\u8c03\u5176\u672c\u8eab\u662f\u5f71\u54cd WAM \u6027\u80fd\u7684\u5173\u952e\u67b6\u6784\u9009\u62e9", "LEON \u5728\u5b66\u4e60\u5230\u7684\u53ef\u89c2\u6d4b\u7a7a\u95f4\u4e2d\u4f7f\u7528\u4e0a\u4e0b\u6587\u8c03\u5236\u7684\u5171\u4eab\u6f14\u5316\u7b97\u5b50\uff0c\u5e76\u4fdd\u7559\u52a0\u6027\u53d8\u5316\u901a\u8def\u4ee5\u5904\u7406\u5916\u90e8\u9a71\u52a8\u6216\u7a81\u53d8", "\u5728\u53d7\u63a7\u52a8\u529b\u7cfb\u7edf\u548c\u4e24\u7c7b latent WAM \u7b56\u7565\u96c6\u6210\u65b9\u5f0f\u4e2d\uff0cLEON \u63d0\u5347\u95ed\u73af\u63a7\u5236\u6027\u80fd\u4e0e\u9c81\u68d2\u6027\uff0c\u5e76\u53ef\u5b8c\u5168\u66ff\u6362\u539f\u6709\u8f6c\u79fb\u6a21\u5757"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba", "\u6f5c\u8868\u793a", "\u52a8\u529b\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27259v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Making Latent Evolution Explicit: Operator-Structured Transitions for World Action Models", "tldr": "\u7528\u7b97\u5b50\u7ed3\u6784\u6539\u8fdb\u673a\u5668\u4eba\u6f5c\u7a7a\u95f4\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Latent Evolution Operator Network\uff08LEON\uff09\uff0c\u7528\u4e8e\u5728\u6f5c\u8868\u793a\u7a7a\u95f4\u4e2d\u5efa\u6a21\u673a\u5668\u4eba\u4ea4\u4e92\u4e0b\u7684\u573a\u666f\u72b6\u6001\u6f14\u5316\u3002\u5b83\u5c06\u6f5c\u53d8\u91cf\u8f6c\u79fb\u4ece\u5e38\u89c1 Transformer \u9884\u6d4b\u5668\u6539\u4e3a\u57fa\u4e8e\u53d7\u63a7 Koopman \u751f\u6210\u5143\u601d\u60f3\u7684\u7b97\u5b50\u4f20\u64ad\u4e0e\u52a0\u6027 forcing \u7ec4\u5408\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a latent world action model \u5f15\u5165\u66f4\u7b26\u5408\u65f6\u95f4\u6f14\u5316\u7ed3\u6784\u7684\u5f52\u7eb3\u504f\u7f6e\uff0c\u6311\u6218\u4e86\u4ec5\u7528 Transformer \u505a\u6f5c\u7a7a\u95f4\u8f6c\u79fb\u7684\u9ed8\u8ba4\u9009\u62e9\uff0c\u5bf9\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b\u548c\u95ed\u73af\u63a7\u5236\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Peer effects are difficult to estimate when interaction graphs evolve because pre-assignment network history, dynamic peer exposure, and post-assignment network change have distinct causal roles. We introduce a controlled contrast framework that indexes potential outcomes by own treatment, temporally aggregated peer exposure, and a post-assignment evolution summary. Differences between the resulting means define own-treatment, peer-exposure, controlled network-evolution, and joint controlled contrasts rather than a mediation decomposition. We develop the Dynamic Network Doubly Robust estimator, DynaNet-DR, which combines a temporally factorized propensity with normalized augmentation. Under consistency, summary sufficiency, sequential exchangeability, positivity, nuisance convergence, and weak dependence, its canonical estimator is consistent when either the outcome regression or the propensity estimator is consistent. The reported implementation adds representative-score prediction, fixed clipping, and finite-sample stabilization. Semi-synthetic benchmarks on fixed real temporal graph sequences show favorable estimation accuracy among methods targeting the full profile. These benchmarks assess summary-indexed contrasts rather than counterfactual edge generation, and the MathOverflow study is an observational illustration under the stated assumptions.", "arxiv_id": "2608.27187", "arxiv_url": "https://arxiv.org/abs/2608.27187", "authors": ["Xiaojing Du"], "brief": "\u8bba\u6587\u63d0\u51fa\u53d7\u63a7\u5bf9\u6bd4\u6846\u67b6\uff0c\u5c06\u6f5c\u5728\u7ed3\u679c\u6309\u4e2a\u4f53\u5904\u7406\u3001\u65f6\u95f4\u805a\u5408\u7684\u540c\u4f34\u66b4\u9732\u548c\u5904\u7406\u540e\u7684\u7f51\u7edc\u6f14\u5316\u6458\u8981\u8fdb\u884c\u7d22\u5f15\uff0c\u7528\u4e8e\u523b\u753b\u52a8\u6001\u5e72\u6270\u56fe\u4e2d\u7684\u56e0\u679c\u6548\u5e94\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa DynaNet-DR \u53cc\u91cd\u7a33\u5065\u4f30\u8ba1\u5668\uff0c\u5728\u7ed3\u679c\u56de\u5f52\u6216\u503e\u5411\u6a21\u578b\u4e4b\u4e00\u6b63\u786e\u65f6\u4fdd\u6301\u4e00\u81f4\u6027\u3002", "categories": ["cs.LG", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27187", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u533a\u5206\u5904\u7406\u524d\u7f51\u7edc\u5386\u53f2\u3001\u52a8\u6001\u540c\u4f34\u66b4\u9732\u4e0e\u5904\u7406\u540e\u7f51\u7edc\u53d8\u5316\u7684\u4e0d\u540c\u56e0\u679c\u89d2\u8272\uff0c\u5b9a\u4e49\u4e2a\u4f53\u5904\u7406\u3001\u540c\u4f34\u66b4\u9732\u3001\u53d7\u63a7\u7f51\u7edc\u6f14\u5316\u53ca\u8054\u5408\u53d7\u63a7\u5bf9\u6bd4", "DynaNet-DR \u7ed3\u5408\u65f6\u95f4\u5206\u89e3\u503e\u5411\u5f97\u5206\u4e0e\u5f52\u4e00\u5316\u589e\u5e7f\u9879\uff0c\u5728\u4e00\u81f4\u6027\u3001\u5e8f\u8d2f\u53ef\u4ea4\u6362\u6027\u3001\u6b63\u6027\u3001\u5f31\u4f9d\u8d56\u7b49\u6761\u4ef6\u4e0b\u5177\u5907\u53cc\u91cd\u7a33\u5065\u6027", "\u5728\u771f\u5b9e\u65f6\u95f4\u56fe\u5e8f\u5217\u6784\u9020\u7684\u534a\u5408\u6210\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u9762\u5411\u5b8c\u6574\u6548\u5e94\u5256\u9762\u7684\u5176\u4ed6\u65b9\u6cd5\u53d6\u5f97\u66f4\u597d\u4f30\u8ba1\u7cbe\u5ea6"], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u56fe\u5b66\u4e60", "\u793e\u4ea4\u7f51\u7edc", "\u53cc\u91cd\u7a33\u5065\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27187v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Interference Graphs Evolve: Doubly Robust Estimation of Dynamic Peer Effects", "tldr": "\u52a8\u6001\u7f51\u7edc\u4e2d\u7a33\u5065\u4f30\u8ba1\u540c\u4f34\u6548\u5e94", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u53d7\u63a7\u5bf9\u6bd4\u6846\u67b6\uff0c\u5c06\u6f5c\u5728\u7ed3\u679c\u6309\u4e2a\u4f53\u5904\u7406\u3001\u65f6\u95f4\u805a\u5408\u7684\u540c\u4f34\u66b4\u9732\u548c\u5904\u7406\u540e\u7684\u7f51\u7edc\u6f14\u5316\u6458\u8981\u8fdb\u884c\u7d22\u5f15\uff0c\u7528\u4e8e\u523b\u753b\u52a8\u6001\u5e72\u6270\u56fe\u4e2d\u7684\u56e0\u679c\u6548\u5e94\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa DynaNet-DR \u53cc\u91cd\u7a33\u5065\u4f30\u8ba1\u5668\uff0c\u5728\u7ed3\u679c\u56de\u5f52\u6216\u503e\u5411\u6a21\u578b\u4e4b\u4e00\u6b63\u786e\u65f6\u4fdd\u6301\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u4f1a\u968f\u65f6\u95f4\u53d8\u5316\u7684\u771f\u5b9e\u793e\u4ea4/\u4ea4\u4e92\u7f51\u7edc\uff0c\u63d0\u4f9b\u4e86\u6bd4\u9759\u6001\u5e72\u6270\u5047\u8bbe\u66f4\u8d34\u8fd1\u73b0\u5b9e\u7684\u56e0\u679c\u4f30\u8ba1\u6846\u67b6\uff0c\u5bf9\u793e\u4ea4\u7f51\u7edc\u5b9e\u9a8c\u3001\u5e73\u53f0\u5e72\u9884\u548c\u52a8\u6001\u7cfb\u7edf\u4e2d\u7684\u540c\u4f34\u6548\u5e94\u5206\u6790\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Battery lifetime is central to sustainable electrification, yet the particle cracking that drives lithium-ion cathode aging is hard to measure: quantitative microscopy of this degradation is bottlenecked by annotation, because each destructive electron-microscopy cross-section spans hundreds of megapixels and pixel-level expert labelling requires hours per image. We show that a frozen self-supervised vision-transformer encoder, combined with a lightweight trainable decoder and iterative model-assisted annotation, turns this sparse labelling budget into population-scale degradation measurements. Applied to three 120-megapixel NMC cathode cross-sections representing initial, cycled-aged and calendar-aged states, the framework distinguishes intragranular cracks from early- and late-stage intergranular cracks and yields per-particle distributions of crack width, tortuosity and area fraction. Late intergranular crack coverage reaches 4.6% in the cycled sample versus 0.5% in the initial and calendar-aged samples, forming more tortuous, higher-coverage networks, consistent with degradation from repeated electrochemical cycling rather than elevated-temperature storage alone. A single destructive image yields the population-level statistics needed for lifetime-extending design, aging assessment and second-life decisions.", "arxiv_id": "2608.27162", "arxiv_url": "https://arxiv.org/abs/2608.27162", "authors": ["Thorsten Tegetmeyer-Kleine", "Thomas Schmitt", "Phillip Aquino", "Christiane Rahe", "Dirk Uwe Sauer", "Weihan Li"], "brief": "\u672c\u6587\u5c06\u51bb\u7ed3\u7684\u81ea\u76d1\u7763 Vision Transformer \u7f16\u7801\u5668\u4e0e\u8f7b\u91cf\u89e3\u7801\u5668\u7ed3\u5408\uff0c\u5e76\u901a\u8fc7\u8fed\u4ee3\u5f0f\u6a21\u578b\u8f85\u52a9\u6807\u6ce8\uff0c\u5728\u6781\u5c11\u50cf\u7d20\u7ea7\u6807\u6ce8\u4e0b\u5b8c\u6210\u9502\u79bb\u5b50\u7535\u6c60\u6b63\u6781\u663e\u5fae\u56fe\u50cf\u88c2\u7eb9\u5206\u5272\u4e0e\u5b9a\u91cf\u5206\u6790\u3002\u65b9\u6cd5\u5e94\u7528\u4e8e\u4e09\u5f20 120MP NMC \u6b63\u6781\u622a\u9762\u56fe\uff0c\u533a\u5206\u9897\u7c92\u5185\u88c2\u7eb9\u3001\u65e9\u671f/\u665a\u671f\u9897\u7c92\u95f4\u88c2\u7eb9\uff0c\u5e76\u8f93\u51fa\u9897\u7c92\u7ea7\u88c2\u7eb9\u5bbd\u5ea6\u3001\u66f2\u6298\u5ea6\u548c\u9762\u79ef\u5360\u6bd4\u7edf\u8ba1\u3002", "categories": ["cond-mat.mtrl-sci", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27162", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5229\u7528\u51bb\u7ed3\u81ea\u76d1\u7763 ViT \u57fa\u7840\u6a21\u578b\u8fc1\u79fb\uff0c\u663e\u8457\u964d\u4f4e\u9ad8\u5206\u8fa8\u7387\u7535\u5b50\u663e\u5fae\u56fe\u50cf\u7684\u4e13\u5bb6\u6807\u6ce8\u9700\u6c42", "\u5728\u521d\u59cb\u3001\u5faa\u73af\u8001\u5316\u3001\u65e5\u5386\u8001\u5316\u4e09\u7c7b NMC \u6b63\u6781\u6837\u672c\u4e0a\u5b9e\u73b0\u9897\u7c92\u7ea7\u88c2\u7eb9\u7c7b\u578b\u4e0e\u5f62\u8c8c\u7edf\u8ba1", "\u53d1\u73b0\u5faa\u73af\u8001\u5316\u6837\u672c\u665a\u671f\u9897\u7c92\u95f4\u88c2\u7eb9\u8986\u76d6\u7387\u8fbe 4.6%\uff0c\u8fdc\u9ad8\u4e8e\u521d\u59cb\u548c\u65e5\u5386\u8001\u5316\u6837\u672c\u7684 0.5%"], "keywords": ["\u57fa\u7840\u6a21\u578b", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u6750\u6599\u8868\u5f81", "\u7535\u6c60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27162v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Data-efficient crack quantification in lithium-ion cathodes using foundation model transfer", "tldr": "\u7528\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u9ad8\u6548\u91cf\u5316\u7535\u6c60\u6b63\u6781\u88c2\u7eb9", "upvotes": 0, "what_it_is": "\u672c\u6587\u5c06\u51bb\u7ed3\u7684\u81ea\u76d1\u7763 Vision Transformer \u7f16\u7801\u5668\u4e0e\u8f7b\u91cf\u89e3\u7801\u5668\u7ed3\u5408\uff0c\u5e76\u901a\u8fc7\u8fed\u4ee3\u5f0f\u6a21\u578b\u8f85\u52a9\u6807\u6ce8\uff0c\u5728\u6781\u5c11\u50cf\u7d20\u7ea7\u6807\u6ce8\u4e0b\u5b8c\u6210\u9502\u79bb\u5b50\u7535\u6c60\u6b63\u6781\u663e\u5fae\u56fe\u50cf\u88c2\u7eb9\u5206\u5272\u4e0e\u5b9a\u91cf\u5206\u6790\u3002\u65b9\u6cd5\u5e94\u7528\u4e8e\u4e09\u5f20 120MP NMC \u6b63\u6781\u622a\u9762\u56fe\uff0c\u533a\u5206\u9897\u7c92\u5185\u88c2\u7eb9\u3001\u65e9\u671f/\u665a\u671f\u9897\u7c92\u95f4\u88c2\u7eb9\uff0c\u5e76\u8f93\u51fa\u9897\u7c92\u7ea7\u88c2\u7eb9\u5bbd\u5ea6\u3001\u66f2\u6298\u5ea6\u548c\u9762\u79ef\u5360\u6bd4\u7edf\u8ba1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u57fa\u7840\u89c6\u89c9\u6a21\u578b\u5728\u6750\u6599\u663e\u5fae\u8868\u5f81\u4e2d\u7684\u6570\u636e\u9ad8\u6548\u8fc1\u79fb\u80fd\u529b\uff0c\u53ef\u5c06\u5355\u5f20\u7834\u574f\u6027\u622a\u9762\u56fe\u8f6c\u5316\u4e3a\u7fa4\u4f53\u7ea7\u9000\u5316\u7edf\u8ba1\uff0c\u4e3a\u7535\u6c60\u5bff\u547d\u8bbe\u8ba1\u3001\u8001\u5316\u8bc4\u4f30\u548c\u68af\u6b21\u5229\u7528\u51b3\u7b56\u63d0\u4f9b\u5b9e\u7528\u5de5\u5177\u3002"}, {"abstract": "Robot crowd navigation requires safe and efficient decision-making under dense, dynamic, and multimodal human--robot interactions. Existing reinforcement-learning methods typically output a single reactive action at each timestep, which limits their ability to represent diverse short-term avoidance strategies. We propose Planning Diffusion Policy Optimization (PDPO), an offline-to-online reinforcement-learning framework that uses a diffusion policy to generate short-horizon action chunks for crowd navigation. PDPO is first pretrained on collision-avoidance demonstrations and then fine-tuned online with PPO by treating the denoising process as an internal decision process. During execution, the policy generates a five-step action chunk and applies it in a receding-horizon manner. Furthermore, we observe an evaluation artifact in common crowd-navigation benchmarks: without explicit boundary constraints, learned agents may leave the valid domain and bypass dense crowds. To address this, we introduce a setting in which boundary violations are treated as collisions. Experiments show that PDPO obtains an improved success rate over strong baselines, and ablations demonstrate that action chunks are especially important for the modified bounded benchmark.", "arxiv_id": "2608.27158", "arxiv_url": "https://arxiv.org/abs/2608.27158", "authors": ["Wendong Li", "Jochen Garcke"], "brief": "\u8bba\u6587\u63d0\u51fa Planning Diffusion Policy Optimization\uff08PDPO\uff09\uff0c\u4e00\u4e2a\u79bb\u7ebf\u5230\u5728\u7ebf\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u6269\u6563\u7b56\u7565\u751f\u6210\u77ed\u65f6\u57df\u52a8\u4f5c\u7247\u6bb5\u4ee5\u63d0\u5347\u673a\u5668\u4eba\u5728\u4eba\u7fa4\u4e2d\u7684\u5bfc\u822a\u80fd\u529b\u3002\u65b9\u6cd5\u5148\u7528\u907f\u969c\u793a\u8303\u9884\u8bad\u7ec3\uff0c\u518d\u5c06\u53bb\u566a\u8fc7\u7a0b\u89c6\u4e3a\u5185\u90e8\u51b3\u7b56\u8fc7\u7a0b\u5e76\u7528 PPO \u5728\u7ebf\u5fae\u8c03\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27158", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6269\u6563\u7b56\u7565\u4e00\u6b21\u751f\u6210\u4e94\u6b65\u52a8\u4f5c\u5757\uff0c\u5e76\u4ee5\u6eda\u52a8\u65f6\u57df\u65b9\u5f0f\u6267\u884c\uff0c\u80fd\u8868\u8fbe\u591a\u6837\u5316\u77ed\u671f\u907f\u969c\u7b56\u7565", "\u91c7\u7528\u79bb\u7ebf\u793a\u8303\u9884\u8bad\u7ec3\u52a0\u5728\u7ebf PPO \u5fae\u8c03\uff0c\u7ed3\u5408\u6a21\u4eff\u5b66\u4e60\u7a33\u5b9a\u6027\u4e0e\u5f3a\u5316\u5b66\u4e60\u9002\u5e94\u6027", "\u6307\u51fa\u5e38\u89c1\u4eba\u7fa4\u5bfc\u822a\u57fa\u51c6\u5b58\u5728\u8fb9\u754c\u6f0f\u6d1e\uff0c\u5e76\u5f15\u5165\u8d8a\u754c\u89c6\u4e3a\u78b0\u649e\u7684\u66f4\u4e25\u683c\u8bc4\u6d4b\u8bbe\u7f6e"], "keywords": ["\u673a\u5668\u4eba\u5bfc\u822a", "\u6269\u6563\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u8fd0\u52a8\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27158v1", "published_at": "2026-08-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Diffusion Policies for Short-Horizon Planning in Robot Crowd Navigation", "tldr": "\u7528\u6269\u6563\u7b56\u7565\u505a\u673a\u5668\u4eba\u77ed\u7a0b\u4eba\u7fa4\u907f\u969c\u89c4\u5212", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Planning Diffusion Policy Optimization\uff08PDPO\uff09\uff0c\u4e00\u4e2a\u79bb\u7ebf\u5230\u5728\u7ebf\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u6269\u6563\u7b56\u7565\u751f\u6210\u77ed\u65f6\u57df\u52a8\u4f5c\u7247\u6bb5\u4ee5\u63d0\u5347\u673a\u5668\u4eba\u5728\u4eba\u7fa4\u4e2d\u7684\u5bfc\u822a\u80fd\u529b\u3002\u65b9\u6cd5\u5148\u7528\u907f\u969c\u793a\u8303\u9884\u8bad\u7ec3\uff0c\u518d\u5c06\u53bb\u566a\u8fc7\u7a0b\u89c6\u4e3a\u5185\u90e8\u51b3\u7b56\u8fc7\u7a0b\u5e76\u7528 PPO \u5728\u7ebf\u5fae\u8c03\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6269\u6563\u7b56\u7565\u4ece\u5355\u6b65\u53cd\u5e94\u6269\u5c55\u5230\u77ed\u7a0b\u89c4\u5212\uff0c\u5728\u5bc6\u96c6\u52a8\u6001\u4eba\u7fa4\u5bfc\u822a\u4e2d\u53d6\u5f97\u66f4\u9ad8\u6210\u529f\u7387\uff0c\u5e76\u63ed\u793a\u4e86\u57fa\u51c6\u8bc4\u6d4b\u4e2d\u7684\u91cd\u8981\u7f3a\u9677\uff0c\u5bf9\u673a\u5668\u4eba\u5b89\u5168\u5bfc\u822a\u8bc4\u6d4b\u548c\u7b97\u6cd5\u8bbe\u8ba1\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "How do large language models (LLMs) organize moral knowledge? Models detect moral content broadly, but detection is a low bar. We ask whether they go further, distinguishing moral foundations from one another and organizing the relationships between them geometrically. We train six independent linear probes on open-weight language models, one per Moral Foundations Theory (MFT) category (care/harm, fair/cheat, lib/oppress, loy/betray, auth/subv, sanc/degrade), and examine how the resulting directions relate to each other in representation space. We find the directions neither collapse into a single moral detector nor isolate from one another. Rather, they span a near-maximal number of independent dimensions while sharing a positive common component. The shared component is the signature of integration, and it is moral-specific relative to a matched non-moral concept battery built identically (mean pairwise cosine 0.26 vs. 0.013). The geometry is consistent across architectures and scale and reaches its integration regime early in pre-training, well before probe accuracy saturates. The structure the model discovers shows no evidence of the individualizing/binding distinction predicted by Moral Foundations Theory (an underpowered test: only 20 candidate partitions exist) but rather reflects corpus statistics. Extending to moral dilemmas, each dilemma direction partially composes from its component foundations, at 2.7x a mismatched-pair baseline, while the majority of its variance encodes conflict-specific structure. The model represents moral tension itself, not a pre-resolved judgment.", "arxiv_id": "2608.27402", "arxiv_url": "https://arxiv.org/abs/2608.27402", "authors": ["Orion Reblitz-Richardson"], "brief": "\u8bba\u6587\u7528\u7ebf\u6027\u63a2\u9488\u5206\u6790\u5f00\u6e90\u8bed\u8a00\u6a21\u578b\u4e2d\u516d\u7c7b\u9053\u5fb7\u57fa\u7840\u7684\u8868\u5f81\u65b9\u5411\uff0c\u7814\u7a76LLM\u662f\u5426\u4ec5\u68c0\u6d4b\u201c\u9053\u5fb7\u6027\u201d\u6216\u80fd\u533a\u5206\u4e0d\u540c\u9053\u5fb7\u7ef4\u5ea6\u3002\u7ed3\u679c\u53d1\u73b0\u8fd9\u4e9b\u65b9\u5411\u65e2\u4e0d\u574d\u7f29\u4e3a\u5355\u4e00\u63a2\u6d4b\u5668\uff0c\u4e5f\u975e\u5f7c\u6b64\u72ec\u7acb\uff0c\u800c\u662f\u5728\u591a\u7ef4\u7a7a\u95f4\u4e2d\u5171\u4eab\u4e00\u4e2a\u9053\u5fb7\u7279\u5f02\u7684\u516c\u5171\u6210\u5206\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27402", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u516d\u4e2aMoral Foundations Theory\u7c7b\u522b\u7684\u63a2\u9488\u65b9\u5411\u5448\u8fd1\u6700\u5927\u72ec\u7acb\u7ef4\u5ea6\uff0c\u540c\u65f6\u5177\u6709\u6b63\u5411\u5171\u4eab\u6210\u5206\uff0c\u975e\u9053\u5fb7\u6982\u5ff5\u5bf9\u7167\u4e2d\u51e0\u4e4e\u4e0d\u5b58\u5728\u8fd9\u79cd\u5171\u4eab\u7ed3\u6784", "\u8be5\u51e0\u4f55\u7ed3\u6784\u8de8\u6a21\u578b\u67b6\u6784\u4e0e\u89c4\u6a21\u7a33\u5b9a\uff0c\u5e76\u5728\u9884\u8bad\u7ec3\u65e9\u671f\u5373\u5f62\u6210\uff0c\u65e9\u4e8e\u63a2\u9488\u51c6\u786e\u7387\u9971\u548c", "\u6a21\u578b\u8868\u5f81\u66f4\u7b26\u5408\u8bed\u6599\u7edf\u8ba1\u800c\u975eMFT\u4e2d\u7684individualizing/binding\u5212\u5206\uff1b\u9053\u5fb7\u56f0\u5883\u8868\u5f81\u53ef\u90e8\u5206\u7531\u57fa\u7840\u9053\u5fb7\u7ef4\u5ea6\u7ec4\u5408\uff0c\u4f46\u5927\u90e8\u5206\u65b9\u5dee\u7f16\u7801\u51b2\u7a81\u7279\u5f02\u7ed3\u6784"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u9053\u5fb7\u63a8\u7406", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27402v1", "published_at": "2026-08-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "How Language Models Organize and Structure Moral Knowledge", "tldr": "LLM\u9053\u5fb7\u77e5\u8bc6\u5448\u5171\u4eab\u4e14\u591a\u7ef4\u7684\u51e0\u4f55\u7ed3\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7528\u7ebf\u6027\u63a2\u9488\u5206\u6790\u5f00\u6e90\u8bed\u8a00\u6a21\u578b\u4e2d\u516d\u7c7b\u9053\u5fb7\u57fa\u7840\u7684\u8868\u5f81\u65b9\u5411\uff0c\u7814\u7a76LLM\u662f\u5426\u4ec5\u68c0\u6d4b\u201c\u9053\u5fb7\u6027\u201d\u6216\u80fd\u533a\u5206\u4e0d\u540c\u9053\u5fb7\u7ef4\u5ea6\u3002\u7ed3\u679c\u53d1\u73b0\u8fd9\u4e9b\u65b9\u5411\u65e2\u4e0d\u574d\u7f29\u4e3a\u5355\u4e00\u63a2\u6d4b\u5668\uff0c\u4e5f\u975e\u5f7c\u6b64\u72ec\u7acb\uff0c\u800c\u662f\u5728\u591a\u7ef4\u7a7a\u95f4\u4e2d\u5171\u4eab\u4e00\u4e2a\u9053\u5fb7\u7279\u5f02\u7684\u516c\u5171\u6210\u5206\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u4ece\u8868\u793a\u51e0\u4f55\u89d2\u5ea6\u63ed\u793aLLM\u5185\u90e8\u5982\u4f55\u7ec4\u7ec7\u9053\u5fb7\u6982\u5ff5\uff0c\u8d85\u8d8a\u4e86\u7b80\u5355\u7684\u9053\u5fb7\u5185\u5bb9\u68c0\u6d4b\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u6a21\u578b\u4ef7\u503c\u89c2\u3001\u4f26\u7406\u63a8\u7406\u4e0e\u5bf9\u9f50\u673a\u5236\u7684\u5185\u90e8\u57fa\u7840\u3002"}, {"abstract": "We establish a global finite-sample guarantee for synchronous quantile temporal-difference learning (QTD) in tabular distributional reinforcement learning. The proof separates two stability mechanisms. A global comparison argument, based on the order monotonicity of reward cumulative distribution functions and the $W_\\infty$ contraction of the distributional Bellman operator, brings an arbitrarily initialized iterate into a local neighborhood. Inside that neighborhood, we linearize the QTD mean field. Its Jacobian is a nonsingular $M$-matrix, and the associated positive semigroup permits a variance-sensitive martingale analysis. For stepsizes $\u03b1_t=c(t+1)^{-a}$ with $a\\in(1/2,1)$, the leading last-iterate fluctuation is of order $\\widetilde O\\bigl(T^{-a/2}/\\sqrt{1-\u03b3}\\bigr)$ and has no polynomial dependence on the number of quantiles. The deterministic transient and the required burn-in can still depend on the smallest Bellman-target density, which is of order $m^{-1}$ in the worst case. The result therefore distinguishes sharply between the local stochastic fluctuation and the global sample complexity.", "arxiv_id": "2608.27313", "arxiv_url": "https://arxiv.org/abs/2608.27313", "authors": ["Zijie Cheng", "Xiang Li", "Yang Peng", "Zhihua Zhang"], "brief": "\u672c\u6587\u5206\u6790\u8868\u683c\u5206\u5e03\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u540c\u6b65\u5206\u4f4d\u6570\u65f6\u5e8f\u5dee\u5206\u5b66\u4e60\uff08QTD\uff09\uff0c\u5efa\u7acb\u4e86\u4ece\u4efb\u610f\u521d\u59cb\u5316\u51fa\u53d1\u7684\u5168\u5c40\u6709\u9650\u6837\u672c\u6536\u655b\u4fdd\u8bc1\u3002\u8bc1\u660e\u5c06\u5168\u5c40\u7a33\u5b9a\u6027\u4e0e\u5c40\u90e8\u968f\u673a\u6ce2\u52a8\u5206\u79bb\uff0c\u523b\u753b\u4e86\u6b65\u957f\u4e0b\u6700\u540e\u8fed\u4ee3\u8bef\u5dee\u7684\u4e3b\u5bfc\u9636\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27313", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5229\u7528\u5956\u52b1\u5206\u5e03\u51fd\u6570\u7684\u5e8f\u5355\u8c03\u6027\u548c\u5206\u5e03\u5f0fBellman\u7b97\u5b50\u7684W\u221e\u6536\u7f29\u6027\uff0c\u5c06\u4efb\u610f\u521d\u59cb\u5316\u8fed\u4ee3\u5e26\u5165\u5c40\u90e8\u90bb\u57df", "\u5728\u5c40\u90e8\u90bb\u57df\u7ebf\u6027\u5316QTD\u5e73\u5747\u573a\uff0c\u8bc1\u660e\u5176Jacobian\u4e3a\u975e\u5947\u5f02M\u77e9\u9635\uff0c\u5e76\u501f\u52a9\u6b63\u534a\u7fa4\u8fdb\u884c\u65b9\u5dee\u654f\u611f\u9785\u5206\u6790", "\u5bf9\u6b65\u957f\u03b1_t=c(t+1)^(-a)\uff0ca\u2208(1/2,1)\uff0c\u6700\u540e\u8fed\u4ee3\u968f\u673a\u6ce2\u52a8\u4e3a\u7ea6O(T^(-a/2)/\u221a(1-\u03b3))\uff0c\u4e14\u4e0d\u968f\u5206\u4f4d\u6570\u6570\u91cf\u5448\u591a\u9879\u5f0f\u589e\u957f"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5206\u5e03\u5f0f\u5f3a\u5316\u5b66\u4e60", "\u6709\u9650\u6837\u672c\u5206\u6790", "\u65f6\u5e8f\u5dee\u5206\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27313v1", "published_at": "2026-08-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "A Finite Sample Analysis for Quantile Temporal Difference Learning in Distributional Reinforcement Learning", "tldr": "\u7ed9\u51faQTD\u5b66\u4e60\u5168\u5c40\u6709\u9650\u6837\u672c\u4fdd\u8bc1", "upvotes": 0, "what_it_is": "\u672c\u6587\u5206\u6790\u8868\u683c\u5206\u5e03\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u540c\u6b65\u5206\u4f4d\u6570\u65f6\u5e8f\u5dee\u5206\u5b66\u4e60\uff08QTD\uff09\uff0c\u5efa\u7acb\u4e86\u4ece\u4efb\u610f\u521d\u59cb\u5316\u51fa\u53d1\u7684\u5168\u5c40\u6709\u9650\u6837\u672c\u6536\u655b\u4fdd\u8bc1\u3002\u8bc1\u660e\u5c06\u5168\u5c40\u7a33\u5b9a\u6027\u4e0e\u5c40\u90e8\u968f\u673a\u6ce2\u52a8\u5206\u79bb\uff0c\u523b\u753b\u4e86\u6b65\u957f\u4e0b\u6700\u540e\u8fed\u4ee3\u8bef\u5dee\u7684\u4e3b\u5bfc\u9636\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u5206\u5e03\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e2d\u5e38\u7528\u7684\u5206\u4f4d\u6570TD\u65b9\u6cd5\u63d0\u4f9b\u4e86\u4e25\u683c\u6709\u9650\u6837\u672c\u7406\u8bba\uff0c\u6e05\u6670\u533a\u5206\u4e86\u5c40\u90e8\u968f\u673a\u8bef\u5dee\u4e0e\u5168\u5c40\u6837\u672c\u590d\u6742\u5ea6\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u5206\u4f4d\u6570\u6570\u91cf\u3001\u6298\u6263\u56e0\u5b50\u548c\u76ee\u6807\u5bc6\u5ea6\u5bf9\u5b66\u4e60\u7a33\u5b9a\u6027\u7684\u5f71\u54cd\u3002"}, {"abstract": "Accurate identification of the correct view or angle in cardiac ultrasound (echocardiogram) is a critical component of cardiologic imaging. This step is essential for precise anatomical interpretation, reliable measurement, and the reduction of clinical errors. Although computer vision has advanced significantly, most state-of-the-art models perform well on standard benchmarks but often yield suboptimal results in specialized medical imaging tasks due to the high level of noise present in the data. QuantumBoostNet, a hybrid classical-quantum architecture, is introduced to address these challenges. This model integrates a classical backbone with two heads: one classical and one quantum, with the quantum head implemented as a parametrized 10-qubit quantum circuit. Training occurs in two stages, with an adaptive transition between heads governed by a mixing parameter that monitors loss dynamics. Extensive experiments indicate that, despite the limited number of qubits that can be simulated, QuantumBoostNet consistently outperforms state-of-the-art classical and hybrid classical-quantum models in cardiac ultrasound view identification, achieving a relative improvement over the best competitor. QuantumBoostNet also demonstrates superior performance on established image classification benchmarks and exhibits robustness to noise. These findings support the continued development of hybrid classical-quantum models for specialized medical imaging applications.", "arxiv_id": "2608.27302", "arxiv_url": "https://arxiv.org/abs/2608.27302", "authors": ["Mihai Udrescu-Milosav", "Stefan-Alexandru Jura", "Mihai Udrescu", "Gerhard-Paul Diller"], "brief": "\u8bba\u6587\u63d0\u51fa QuantumBoostNet\uff0c\u4e00\u79cd\u7528\u4e8e\u5fc3\u810f\u8d85\u58f0\u89c6\u56fe\u8bc6\u522b\u7684\u6df7\u5408\u7ecf\u5178-\u91cf\u5b50\u67b6\u6784\u3002\u6a21\u578b\u5728\u7ecf\u5178\u89c6\u89c9\u9aa8\u5e72\u4e0a\u63a5\u5165\u7ecf\u5178\u5934\u4e0e10\u91cf\u5b50\u6bd4\u7279\u53c2\u6570\u5316\u91cf\u5b50\u5934\uff0c\u5e76\u901a\u8fc7\u4e24\u9636\u6bb5\u8bad\u7ec3\u548c\u81ea\u9002\u5e94\u6df7\u5408\u673a\u5236\u63d0\u5347\u5206\u7c7b\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27302", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u53cc\u5934\u7ed3\u6784\uff1a\u7ecf\u5178\u5206\u7c7b\u5934\u4e0e\u53c2\u6570\u531610\u91cf\u5b50\u6bd4\u7279\u91cf\u5b50\u7535\u8def\u5934\u534f\u540c\u5de5\u4f5c", "\u8bad\u7ec3\u8fc7\u7a0b\u5206\u4e24\u9636\u6bb5\uff0c\u5e76\u7528\u57fa\u4e8e\u635f\u5931\u52a8\u6001\u7684\u6df7\u5408\u53c2\u6570\u81ea\u9002\u5e94\u5207\u6362/\u878d\u5408\u4e24\u7c7b\u9884\u6d4b\u5934", "\u5728\u5fc3\u810f\u8d85\u58f0\u89c6\u56fe\u8bc6\u522b\u3001\u901a\u7528\u56fe\u50cf\u5206\u7c7b\u57fa\u51c6\u548c\u566a\u58f0\u9c81\u68d2\u6027\u5b9e\u9a8c\u4e2d\u5747\u4f18\u4e8e\u591a\u79cd\u7ecf\u5178\u53ca\u6df7\u5408\u91cf\u5b50\u6a21\u578b"], "keywords": ["\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u533b\u5b66\u5f71\u50cf", "\u56fe\u50cf\u5206\u7c7b", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27302v1", "published_at": "2026-08-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "QuantumBoostNet: A Hybrid Classical-Quantum Architecture for Enhanced Accuracy in Cardiac Ultrasound View Identification", "tldr": "\u6df7\u5408\u91cf\u5b50\u6a21\u578b\u63d0\u5347\u5fc3\u8d85\u89c6\u56fe\u8bc6\u522b\u7cbe\u5ea6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa QuantumBoostNet\uff0c\u4e00\u79cd\u7528\u4e8e\u5fc3\u810f\u8d85\u58f0\u89c6\u56fe\u8bc6\u522b\u7684\u6df7\u5408\u7ecf\u5178-\u91cf\u5b50\u67b6\u6784\u3002\u6a21\u578b\u5728\u7ecf\u5178\u89c6\u89c9\u9aa8\u5e72\u4e0a\u63a5\u5165\u7ecf\u5178\u5934\u4e0e10\u91cf\u5b50\u6bd4\u7279\u53c2\u6570\u5316\u91cf\u5b50\u5934\uff0c\u5e76\u901a\u8fc7\u4e24\u9636\u6bb5\u8bad\u7ec3\u548c\u81ea\u9002\u5e94\u6df7\u5408\u673a\u5236\u63d0\u5347\u5206\u7c7b\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u6df7\u5408\u7ecf\u5178-\u91cf\u5b50\u6a21\u578b\u5728\u9ad8\u566a\u58f0\u3001\u4e13\u4e1a\u533b\u5b66\u5f71\u50cf\u4efb\u52a1\u4e2d\u7684\u6f5c\u5728\u4f18\u52bf\uff0c\u4e3a\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u5728\u5b9e\u9645\u4e34\u5e8a\u8f85\u52a9\u8bca\u65ad\u573a\u666f\u4e2d\u7684\u5e94\u7528\u63d0\u4f9b\u4e86\u65b0\u7684\u5b9e\u9a8c\u8bc1\u636e\u3002"}, {"abstract": "Music recommendation relies primarily on two signals: user-item interactions, which fail in the cold-start regime, and intrinsic musical content, available for any recording. We argue that a third, largely untapped signal is both richer and more principled: critical adjacency, the pairwise relation established when an expert critic explicitly links two artists in long-form prose. It encodes deliberate judgments about which artists belong together. Prior work established its internal validity, showing it recovers coherent, interpretable communities and can match collaborative filtering in user-satisfaction simulations, with no user data. What has been missing is external validation: whether this critic-sourced relation is grounded in the music itself versus sociological context. We test it against acoustic content, reframing the question as one of construct validity. Representing artists as empirical distributions over 80 low-level Essentia acoustic descriptors and modeling pairwise proximity via marginal optimal-transport (Wasserstein) distances, we evaluate how far critical adjacency is sonically recoverable under a cold-start, artist-disjoint split. Our ensemble recovers these edges at out-of-sample AUC of 0.767 (95% CI 0.761-0.775). Recoverability rises monotonically with critical consensus, reaching 0.865 on multi-source attested edges. Stratified evaluations align with sociological models of genre: tightly bounded, scene-based genres show higher recoverability than broad industry umbrella terms. Critical discourse is thus a rich source of information for recommendation, decomposing into a reproducible \"sonic core\" and a \"sociological remainder\" driven by narrative positioning, subcultural context, and canonical placement. The work offers both a scalable cold-start discovery mechanism and a sociologically grounded approach to MIR and MRS research.", "arxiv_id": "2608.27291", "arxiv_url": "https://arxiv.org/abs/2608.27291", "authors": ["Elena Badillo-Goicoechea", "Fengfeng He"], "brief": "\u8bba\u6587\u5c06\u4e13\u5bb6\u4e50\u8bc4\u4e2d\u663e\u5f0f\u5173\u8054\u7684\u827a\u672f\u5bb6\u5173\u7cfb\u89c6\u4e3a\u63a8\u8350\u4fe1\u53f7\uff0c\u5e76\u7528\u827a\u672f\u5bb6\u7684\u58f0\u5b66\u7279\u5f81\u5206\u5e03\u68c0\u9a8c\u5176\u5916\u90e8\u6784\u5ff5\u6548\u5ea6\u3002\u901a\u8fc7\u6700\u4f18\u4f20\u8f93\u8ddd\u79bb\u5efa\u6a21\u827a\u672f\u5bb6\u95f4\u58f0\u5b66\u63a5\u8fd1\u6027\uff0c\u8bc4\u4f30\u8fd9\u4e9b\u4e50\u8bc4\u90bb\u63a5\u5173\u7cfb\u5728\u51b7\u542f\u52a8\u573a\u666f\u4e0b\u80fd\u5426\u88ab\u97f3\u4e50\u5185\u5bb9\u6062\u590d\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27291", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u752880\u7ef4 Essentia \u4f4e\u5c42\u58f0\u5b66\u63cf\u8ff0\u7b26\u5c06\u827a\u672f\u5bb6\u8868\u793a\u4e3a\u7ecf\u9a8c\u5206\u5e03\uff0c\u5e76\u4ee5 Wasserstein \u8ddd\u79bb\u523b\u753b\u4e24\u4e24\u63a5\u8fd1\u5ea6", "\u5728\u827a\u672f\u5bb6\u4e0d\u91cd\u53e0\u7684\u51b7\u542f\u52a8\u5212\u5206\u4e0b\uff0c\u96c6\u6210\u6a21\u578b\u6062\u590d\u4e50\u8bc4\u90bb\u63a5\u8fb9\u7684\u6837\u672c\u5916 AUC \u8fbe0.767\uff0c95%\u7f6e\u4fe1\u533a\u95f4\u4e3a0.761-0.775", "\u6062\u590d\u80fd\u529b\u968f\u8bc4\u8bba\u5171\u8bc6\u5355\u8c03\u63d0\u5347\uff0c\u591a\u6765\u6e90\u5171\u540c\u786e\u8ba4\u7684\u8fb9 AUC \u8fbe0.865\uff1b\u573a\u666f\u5316\u3001\u8fb9\u754c\u6e05\u6670\u7684\u6d41\u6d3e\u6bd4\u5bbd\u6cdb\u4ea7\u4e1a\u6807\u7b7e\u66f4\u6613\u6062\u590d"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u97f3\u4e50\u4fe1\u606f\u68c0\u7d22", "\u6700\u4f18\u4f20\u8f93", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27291v1", "published_at": "2026-08-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Recovering Expert Critic-Sourced Network Adjacency between Musical Artists from Acoustic Distributions: A Construct-Validity Approach", "tldr": "\u7528\u58f0\u5b66\u5206\u5e03\u9a8c\u8bc1\u4e50\u8bc4\u5173\u7cfb\u53ef\u6062\u590d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u4e13\u5bb6\u4e50\u8bc4\u4e2d\u663e\u5f0f\u5173\u8054\u7684\u827a\u672f\u5bb6\u5173\u7cfb\u89c6\u4e3a\u63a8\u8350\u4fe1\u53f7\uff0c\u5e76\u7528\u827a\u672f\u5bb6\u7684\u58f0\u5b66\u7279\u5f81\u5206\u5e03\u68c0\u9a8c\u5176\u5916\u90e8\u6784\u5ff5\u6548\u5ea6\u3002\u901a\u8fc7\u6700\u4f18\u4f20\u8f93\u8ddd\u79bb\u5efa\u6a21\u827a\u672f\u5bb6\u95f4\u58f0\u5b66\u63a5\u8fd1\u6027\uff0c\u8bc4\u4f30\u8fd9\u4e9b\u4e50\u8bc4\u90bb\u63a5\u5173\u7cfb\u5728\u51b7\u542f\u52a8\u573a\u666f\u4e0b\u80fd\u5426\u88ab\u97f3\u4e50\u5185\u5bb9\u6062\u590d\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3a\u201c\u4e13\u5bb6\u4e50\u8bc4\u5173\u7cfb\u201d\u4f5c\u4e3a\u97f3\u4e50\u63a8\u8350\u4fe1\u53f7\u63d0\u4f9b\u4e86\u58f0\u5b66\u5c42\u9762\u7684\u5916\u90e8\u9a8c\u8bc1\uff0c\u8bf4\u660e\u5176\u65e2\u5305\u542b\u53ef\u7531\u97f3\u9891\u5185\u5bb9\u590d\u73b0\u7684\u201c\u58f0\u5b66\u6838\u5fc3\u201d\uff0c\u4e5f\u5305\u542b\u793e\u4f1a\u53d9\u4e8b\u548c\u6587\u5316\u5b9a\u4f4d\u7b49\u4fe1\u606f\uff1b\u5bf9\u51b7\u542f\u52a8\u97f3\u4e50\u63a8\u8350\u548c\u97f3\u4e50\u4fe1\u606f\u68c0\u7d22\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Nitrogen rates for winter wheat are set before the season, under unknown prices and weather. The standard UK advice does not respond to prices, yet recent price swings moved the most profitable rate by tens of kilograms per hectare. Machine learning is often proposed as the fix. However, it is usually judged on prediction accuracy, and accurate prediction does not by itself make the recommended rate more profitable. Our insight is to score nitrogen advice directly by the profit it forgoes on measured yield response curves. We build a test bench on 892 such curves from two long running UK experiments, and sweep the nitrogen to grain price ratio to cover all price scenarios. On this bench, machine learning fails as a predictor. No model recovers the best rate within farm tolerance, and the benchmark noise shows none can. At normal prices, every model also loses to the standard advice on profit. The gain sits elsewhere. A simple correction step applied after the model cuts profit losses by a quarter, while better models and extra features give no gain. The same frozen correction cuts losses by 43% at the second site without any retraining. A hybrid of standard advice plus a damped correction removes bias and trims rare large losses. The same price sweep also prices emission cuts, at a cost comparable to current carbon prices. Machine learning therefore pays as a profit scored correction to standard advice, not as its replacement.", "arxiv_id": "2608.27205", "arxiv_url": "https://arxiv.org/abs/2608.27205", "authors": ["Xulong Wang", "Po Yang"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u57fa\u4e8e\u5229\u6da6\u800c\u975e\u9884\u6d4b\u7cbe\u5ea6\u7684\u51ac\u5c0f\u9ea6\u65bd\u6c2e\u63a8\u8350\u8bc4\u4f30\u6846\u67b6\uff0c\u4f7f\u7528\u82f1\u56fd\u4e24\u4e2a\u957f\u671f\u8bd5\u9a8c\u4e2d\u7684892\u6 0\u5b9c\u4fee\u6b63\u5c0f\u9ea6\u65bd\u6c2e\u5efa\u8bae\u800c\u975e\u66ff\u4ee3\u6807\u51c6\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u57fa\u4e8e\u5229\u6da6\u800c\u975e\u9884\u6d4b\u7cbe\u5ea6\u7684\u51ac\u5c0f\u9ea6\u65bd\u6c2e\u63a8\u8350\u8bc4\u4f30\u6846\u67b6\uff0c\u4f7f\u7528\u82f1\u56fd\u4e24\u4e2a\u957f\u671f\u8bd5\u9a8c\u4e2d\u7684892\u6761\u5b9e\u6d4b\u4ea7\u91cf\u54cd\u5e94\u66f2\u7ebf\uff0c\u5e76\u626b\u63cf\u6c2e\u80a5/\u7cae\u98df\u4ef7\u683c\u6bd4\u6765\u8986\u76d6\u4e0d\u540c\u4ef7\u683c\u60c5\u666f\u3002\u7814\u7a76\u53d1\u73b0\u673a\u5668\u5b66\u4e60\u6a21\u578b\u4f5c\u4e3a\u76f4\u63a5\u9884\u6d4b\u5668\u8868\u73b0\u4e0d\u4f73\uff0c\u4f46\u4f5c\u4e3a\u6807\u51c6\u5efa\u8bae\u540e\u7684\u6821\u6b63\u6b65\u9aa4\u53ef\u663e\u8457\u51cf\u5c11\u5229\u6da6\u635f\u5931\u3002", "why_notable": "\u8bba\u6587\u63d0\u9192\u519c\u4e1a\u673a\u5668\u5b66\u4e60\u4e0d\u80fd\u53ea\u8ffd\u6c42\u9884\u6d4b\u7cbe\u5ea6\uff0c\u800c\u5e94\u6309\u771f\u5b9e\u7ecf\u6d4e\u76ee\u6807\u8bc4\u4f30\uff1b\u5176\u7ed3\u8bba\u5bf9\u7cbe\u51c6\u519c\u4e1a\u3001\u80a5\u6599\u7ba1\u7406\u548c\u4f4e\u78b3\u519c\u4e1a\u653f\u7b56\u90fd\u6709\u5b9e\u9645\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "A known necessary condition for Fisher consistency of the structured support vector machine requires the task loss to be a metric for which every output triple has a common geodesic point. We show that this condition is not sufficient for the canonical coordinate-wise argmax decoder. A four-output unit star admits an exactly optimal score vector whose maximizers are all strictly non-Bayes, and four outputs are minimal among metrics satisfying the condition. We then completely classify positively weighted tree metrics whose vertex set is the output space: argmax consistency holds if and only if the tree is a path. The failure on branching trees is confined to boundary distributions; every tree retains the argmax property at every full-support distribution. Among metrics satisfying the common-geodesic condition, five outputs are necessary and sufficient for a full-support counterexample; $K_{2,3}$ is the smallest member of an infinite $K_{m,n}$ family. We additionally give a full-support counterexample for the three-dimensional Hamming cube. All optimality claims have exact primal-dual certificates. The counterexamples expose a concrete decoder gap: in this polyhedral setting, an embedding can guarantee the existence of a calibrated link without validating a prescribed argmax link on every surrogate-risk minimizer.", "arxiv_id": "2608.27203", "arxiv_url": "https://arxiv.org/abs/2608.27203", "authors": ["Jintao Fei", "Jiangying Luo"], "brief": "\u672c\u6587\u7814\u7a76\u7ed3\u6784\u5316SVM\u5728\u5e38\u7528\u5750\u6807\u9010\u7ef4argmax\u89e3\u7801\u4e0b\u7684Fisher\u4e00\u81f4\u6027\uff0c\u8bc1\u660e\u201c\u516c\u5171\u6d4b\u5730\u7ebf\u201d\u8fd9\u4e00\u5df2\u77e5\u5fc5\u8981\u6761\u4ef6\u5e76\u4e0d\u5145\u5206\u3002\u8bba\u6587\u7ed9\u51fa\u6700\u5c0f\u53cd\u4f8b\uff0c\u5e76\u5b8c\u6574\u523b\u753b\u4e86\u52a0\u6743\u6811\u5ea6\u91cf\u4e2d\u4f55\u65f6\u4fdd\u6301argmax\u4e00\u81f4\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27203", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6784\u9020\u56db\u8f93\u51fa\u5355\u4f4d\u661f\u5f62\u5ea6\u91cf\u53cd\u4f8b\uff1a\u5b58\u5728\u7cbe\u786e\u6700\u4f18\u8bc4\u5206\u5411\u91cf\uff0c\u5176\u6240\u6709\u6700\u5927\u5316\u8f93\u51fa\u90fd\u4e25\u683c\u975eBayes\u6700\u4f18\uff0c\u4e14\u56db\u8f93\u51fa\u662f\u6ee1\u8db3\u516c\u5171\u6d4b\u5730\u7ebf\u6761\u4ef6\u4e0b\u7684\u6700\u5c0f\u89c4\u6a21\u53cd\u4f8b\u3002", "\u5b8c\u6574\u5206\u7c7b\u4ee5\u8f93\u51fa\u7a7a\u95f4\u4e3a\u9876\u70b9\u7684\u6b63\u52a0\u6743\u6811\u5ea6\u91cf\uff1a\u5f53\u4e14\u4ec5\u5f53\u6811\u662f\u4e00\u6761\u8def\u5f84\u65f6\uff0c\u7ed3\u6784\u5316SVM\u7684argmax\u4e00\u81f4\u6027\u6210\u7acb\uff1b\u5206\u53c9\u6811\u7684\u5931\u8d25\u4ec5\u51fa\u73b0\u5728\u8fb9\u754c\u5206\u5e03\u4e0a\u3002", "\u8fdb\u4e00\u6b65\u8bc1\u660e\u5728\u516c\u5171\u6d4b\u5730\u7ebf\u6761\u4ef6\u4e0b\uff0c\u4e94\u4e2a\u8f93\u51fa\u662f\u5168\u652f\u6301\u5206\u5e03\u53cd\u4f8b\u7684\u5fc5\u8981\u4e14\u5145\u5206\u89c4\u6a21\uff0c\u5e76\u7ed9\u51faK_{2,3}\u5bb6\u65cf\u53ca\u4e09\u7ef4Hamming\u7acb\u65b9\u4f53\u7684\u5168\u652f\u6301\u53cd\u4f8b\u3002"], "keywords": ["\u7ed3\u6784\u5316\u9884\u6d4b", "\u652f\u6301\u5411\u91cf\u673a", "Fisher\u4e00\u81f4\u6027", "\u5ea6\u91cf\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27203v1", "published_at": "2026-08-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Common Geodesics Do Not Guarantee Fisher Consistency of the Structured SVM: Minimal Counterexamples and a Tree-Metric Classification", "tldr": "\u53cd\u4f8b\u63ed\u793a\u7ed3\u6784\u5316SVM\u89e3\u7801\u4e00\u81f4\u6027\u7f3a\u53e3", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u7ed3\u6784\u5316SVM\u5728\u5e38\u7528\u5750\u6807\u9010\u7ef4argmax\u89e3\u7801\u4e0b\u7684Fisher\u4e00\u81f4\u6027\uff0c\u8bc1\u660e\u201c\u516c\u5171\u6d4b\u5730\u7ebf\u201d\u8fd9\u4e00\u5df2\u77e5\u5fc5\u8981\u6761\u4ef6\u5e76\u4e0d\u5145\u5206\u3002\u8bba\u6587\u7ed9\u51fa\u6700\u5c0f\u53cd\u4f8b\uff0c\u5e76\u5b8c\u6574\u523b\u753b\u4e86\u52a0\u6743\u6811\u5ea6\u91cf\u4e2d\u4f55\u65f6\u4fdd\u6301argmax\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6f84\u6e05\u4e86\u7ed3\u6784\u5316SVM\u6821\u51c6\u7406\u8bba\u4e2d\u7684\u4e00\u4e2a\u5173\u952e\u8bef\u533a\uff1a\u5373\u4f7f\u5d4c\u5165\u4fdd\u8bc1\u5b58\u5728\u67d0\u79cd\u6821\u51c6\u94fe\u63a5\uff0c\u4e5f\u4e0d\u610f\u5473\u7740\u9884\u8bbe\u7684argmax\u89e3\u7801\u5668\u5bf9\u6240\u6709\u66ff\u4ee3\u98ce\u9669\u6700\u5c0f\u89e3\u90fd\u4e00\u81f4\u3002\u8fd9\u5bf9\u7ed3\u6784\u5316\u9884\u6d4b\u635f\u5931\u8bbe\u8ba1\u548c\u89e3\u7801\u5668\u9009\u62e9\u5177\u6709\u91cd\u8981\u7406\u8bba\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Computationally demanding and opaque deep learning models can be better understood and optimized by analyzing how they transform data. While deep transformers have been widely studied in computer vision and natural language processing, their application in tabular data remains relatively underexplored. This paper presents one of the first applications of an importance-scoring metric to interpret multi-head transformer models in learning from tabular data. Experiments conducted on 40 diverse tabular datasets demonstrate robustness to head drops based on the proposed head importance score. In 72.5\\% of experimental examples, the model remains most resilient to performance drops when heads with the lowest importance scores are gradually removed. In contrast, removing the most important attention head first results in the greatest reduction in classification performance. A closer look at individual head importance scores across six attention layers reveals that important heads are scattered across layers, with no consistent layer-specific trends. In contrast to the image and language domains, the importance of individual attention heads varies considerably across tabular datasets with different schemas and feature spaces. The proposed importance score can improve efficiency and redundancy within transformer architectures. We make the source code for measuring the importance of individual attention heads publicly available.", "arxiv_id": "2608.27241", "arxiv_url": "https://arxiv.org/abs/2608.27241", "authors": ["Ahmad Jad Allah", "Kazi F. Akhter", "Md. Kamrozzaman Bhuiyan", "Manar D. Samad"], "brief": "\u8bba\u6587\u5c06\u6ce8\u610f\u529b\u5934\u91cd\u8981\u6027\u8bc4\u5206\u7528\u4e8e\u8868\u683c\u6570\u636e\u4e0a\u7684\u591a\u5934Transformer\u89e3\u91ca\u4e0e\u4f18\u5316\uff0c\u5e76\u572840\u4e2a\u8868\u683c\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6309\u4f4e\u91cd\u8981\u6027\u5934\u9010\u6b65\u5220\u9664\u901a\u5e38\u5bf9\u6027\u80fd\u5f71\u54cd\u6700\u5c0f\uff0c\u800c\u5148\u5220\u9664\u9ad8\u91cd\u8981\u6027\u5934\u4f1a\u663e\u8457\u964d\u4f4e\u5206\u7c7b\u6027\u80fd\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27241", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u572840\u4e2a\u4e0d\u540c\u8868\u683c\u6570\u636e\u96c6\u4e0a\u8bc4\u4f30\u6ce8\u610f\u529b\u5934\u91cd\u8981\u6027\u4e0e\u5220\u5934\u9c81\u68d2\u6027\uff0c72.5%\u7684\u5b9e\u9a8c\u4e2d\u5220\u9664\u4f4e\u5206\u5934\u6700\u4e0d\u4f24\u6027\u80fd", "\u91cd\u8981\u6ce8\u610f\u529b\u5934\u5206\u5e03\u5728\u4e0d\u540c\u5c42\u4e2d\uff0c\u6ca1\u6709\u7a33\u5b9a\u7684\u5c42\u7ea7\u89c4\u5f8b", "\u4e0e\u89c6\u89c9\u548c\u8bed\u8a00\u4efb\u52a1\u4e0d\u540c\uff0c\u8868\u683c\u6570\u636e\u4e2d\u6ce8\u610f\u529b\u5934\u91cd\u8981\u6027\u5f3a\u70c8\u4f9d\u8d56\u6570\u636e\u96c6\u7ed3\u6784\u3001\u7279\u5f81\u7a7a\u95f4\u4e0eschema"], "keywords": ["\u8868\u683c\u5b66\u4e60", "Transformer", "\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27241v1", "published_at": "2026-08-27", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Importance Scoring of Transformer Attention Heads in Learning Tabular Data", "tldr": "\u7528\u91cd\u8981\u6027\u8bc4\u5206\u89e3\u91ca\u5e76\u88c1\u526a\u8868\u683cTransformer\u6ce8\u610f\u529b\u5934", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u6ce8\u610f\u529b\u5934\u91cd\u8981\u6027\u8bc4\u5206\u7528\u4e8e\u8868\u683c\u6570\u636e\u4e0a\u7684\u591a\u5934Transformer\u89e3\u91ca\u4e0e\u4f18\u5316\uff0c\u5e76\u572840\u4e2a\u8868\u683c\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6309\u4f4e\u91cd\u8981\u6027\u5934\u9010\u6b65\u5220\u9664\u901a\u5e38\u5bf9\u6027\u80fd\u5f71\u54cd\u6700\u5c0f\uff0c\u800c\u5148\u5220\u9664\u9ad8\u91cd\u8981\u6027\u5934\u4f1a\u663e\u8457\u964d\u4f4e\u5206\u7c7b\u6027\u80fd\u3002", "why_notable": "\u8be5\u7814\u7a76\u8865\u8db3\u4e86\u8868\u683cTransformer\u53ef\u89e3\u91ca\u6027\u4e0e\u5197\u4f59\u5206\u6790\u7684\u7a7a\u767d\uff0c\u53ef\u7528\u4e8e\u8bc6\u522b\u65e0\u6548\u6ce8\u610f\u529b\u5934\u3001\u63d0\u5347\u6a21\u578b\u6548\u7387\uff0c\u5e76\u4e3a\u8868\u683c\u6df1\u5ea6\u5b66\u4e60\u6a21\u578b\u538b\u7f29\u63d0\u4f9b\u5b9e\u8bc1\u4f9d\u636e\u3002"}, {"abstract": "Adverse drug reactions (ADRs) are a major, largely preventable source of patient harm. In high-income settings, electronic health records store a patient\u0027s allergy history and warn prescribers when a contraindicated drug is ordered; in rural Bangladeshi public hospitals no such record exists for outgoing patients, a single physician may see on the order of one patient per minute, and a patient\u0027s history of severe reactions does not survive between visits. This paper proposes and outlines the evaluation of a lightweight, smartphone-based safety-check system for this setting. At registration a soft identifier (a phone number) is recorded; after the physician writes a prescription, its image is captured, the brand names are resolved to active ingredients using national drug references, and the ingredients are matched against the patient\u0027s recorded severe reaction history. The system is retrieval-based rather than predictive, and is silent by default, raising a flag only for high-risk matches a design grounded in the alert-fatigue literature. We frame the work as a feasibility study: we describe the proposed framework and an evaluation plan measuring workflow fit under high volume, usability, identity-resolution reliability, and retrospective detection of known reaction cases. We explicitly do not claim a clinical-outcome effect, which the low base rate of severe events places beyond a single-site feasibility study.", "arxiv_id": "260
