8.27239", "arxiv_url": "https://arxiv.org/abs/2608.27239", "authors": ["Shahir Abdullah"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u8f7b\u91cf\u7ea7\u667a\u80fd\u624b\u673a\u5904\u65b9\u5b89\u5168\u68c0\u67e5\u7cfb\u7edf\uff0c\u7528\u4e8e\u5728\u5b5f\u52a0\u62c9\u4e61\u6751\u516c\u7acb\u533b\u9662\u8bc6\u522b\u60a3\u8005\u65e2\u5f80\u4e25\u91cd\u836f\u7269\u4e0d\u826f\u53cd\u5e94\u4e0e\u65b0\u5904\u65b9\u6210\u5206\u7684\u51b2\u7a81\u3002\u7cfb\u7edf\u4ee5\u53ef\u884c\u6027\u7814\u7a76\u5b9a\u4f4d\uff0c\u91cd\u70b9\u8bc4\u4f30\u5de5\u4f5c\u6d41\u9002\u914d\u3001\u53ef\u7528\u6027\u3001\u8eab\u4efd\u5339\u914d\u53ef\u9760\u6027\u4e0e\u5386\u53f2\u75c5\u4f8b\u56de\u6eaf\u68c0\u6d4b\u80fd\u529b\u3002", "categories": ["cs.HC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27239", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u6ce8\u518c\u65f6\u7528\u7535\u8bdd\u53f7\u7801\u7b49\u8f6f\u6807\u8bc6\u8bb0\u5f55\u60a3\u8005\uff0c\u5e76\u7ef4\u62a4\u4e25\u91cd\u836f\u7269\u53cd\u5e94\u53f2\uff0c\u5f25\u8865\u7f3a\u4e4f\u7535\u5b50\u75c5\u5386\u7684\u95ee\u9898\u3002", "\u533b\u751f\u5f00\u65b9\u540e\u62cd\u6444\u5904\u65b9\u56fe\u50cf\uff0c\u5c06\u54c1\u724c\u836f\u540d\u6620\u5c04\u5230\u6d3b\u6027\u6210\u5206\uff0c\u518d\u4e0e\u60a3\u8005\u4e0d\u826f\u53cd\u5e94\u8bb0\u5f55\u8fdb\u884c\u68c0\u7d22\u5339\u914d\u3002", "\u7cfb\u7edf\u4e0d\u505a\u98ce\u9669\u9884\u6d4b\uff0c\u9ed8\u8ba4\u9759\u9ed8\uff0c\u4ec5\u5728\u9ad8\u98ce\u9669\u5339\u914d\u65f6\u62a5\u8b66\uff0c\u4ee5\u964d\u4f4e\u4e34\u5e8a\u8b66\u62a5\u75b2\u52b3\u3002"], "keywords": ["\u533b\u7597\u5065\u5eb7", "\u4eba\u673a\u4ea4\u4e92", "\u5b89\u5168\u68c0\u67e5", "\u4f4e\u8d44\u6e90\u533b\u7597"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27239v1", "published_at": "2026-08-27", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "A Point-of-Prescription Safety-Check System for Adverse Drug Reactions in Rural Bangladeshi Hospitals: A Feasibility Study", "tldr": "\u9762\u5411\u5b5f\u52a0\u62c9\u4e61\u6751\u533b\u9662\u7684\u5904\u65b9ADR\u5b89\u5168\u68c0\u67e5\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u8f7b\u91cf\u7ea7\u667a\u80fd\u624b\u673a\u5904\u65b9\u5b89\u5168\u68c0\u67e5\u7cfb\u7edf\uff0c\u7528\u4e8e\u5728\u5b5f\u52a0\u62c9\u4e61\u6751\u516c\u7acb\u533b\u9662\u8bc6\u522b\u60a3\u8005\u65e2\u5f80\u4e25\u91cd\u836f\u7269\u4e0d\u826f\u53cd\u5e94\u4e0e\u65b0\u5904\u65b9\u6210\u5206\u7684\u51b2\u7a81\u3002\u7cfb\u7edf\u4ee5\u53ef\u884c\u6027\u7814\u7a76\u5b9a\u4f4d\uff0c\u91cd\u70b9\u8bc4\u4f30\u5de5\u4f5c\u6d41\u9002\u914d\u3001\u53ef\u7528\u6027\u3001\u8eab\u4efd\u5339\u914d\u53ef\u9760\u6027\u4e0e\u5386\u53f2\u75c5\u4f8b\u56de\u6eaf\u68c0\u6d4b\u80fd\u529b\u3002", "why_notable": "\u8be5\u7814\u7a76\u9488\u5bf9\u4f4e\u8d44\u6e90\u3001\u9ad8\u5c31\u8bca\u91cf\u533b\u7597\u573a\u666f\u4e2d\u7684\u53ef\u9884\u9632\u7528\u836f\u4f24\u5bb3\uff0c\u63d0\u51fa\u6210\u672c\u4f4e\u3001\u5de5\u4f5c\u6d41\u4fb5\u5165\u5c0f\u7684\u6570\u5b57\u5316\u5b89\u5168\u673a\u5236\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u516c\u5171\u536b\u751f\u548c\u4eba\u673a\u4ea4\u4e92\u5b9e\u8df5\u4ef7\u503c\u3002"}, {"abstract": "Correlation Clustering (CC) is a natural formulation of clustering in combinatorial optimization, which uses a graph representation of the input and does not require a pre-specified number of clusters. Given $n$ objects and a pairwise similarity function, the goal is to cluster the objects so that similar objects are put in the same cluster and dissimilar objects are put in different clusters. Despite its versatility, existing CC algorithms suffer from significant scalability issues and are inherently transductive: i.e., the algorithm must be executed from scratch for any new problem instance. In this work, we bridge this gap by leveraging Graph Neural Networks (GNNs) to solve Inductive Correlation Clustering, a novel generalization of the CC problem designed to handle unseen graph instances. By learning to exploit common structural patterns and node features during training, our framework generalizes to new graphs drawn from the same distribution with minimal computational overhead with respect to standard algorithms. We demonstrate the effectiveness and scalability of our approach through extensive experiments. Our framework not only excels in the inductive setting, e.g., lowering the inference time up to $5$ order of magnitude, while maintaining an approximation ratio within $~10\\%$ of the best baseline solution, but also achieves competitive results on standard (transductive) CC benchmarks. Finally, we showcase a practical application of our framework as a learnable pooling mechanism for graph classification. Our results indicate that our method serves as an efficient pooling layer, enhancing the ability of GNNs to capture hierarchical structural information in networks.", "arxiv_id": "2608.27153", "arxiv_url": "https://arxiv.org/abs/2608.27153", "authors": ["Francesco Paolo Nerini", "Francesco Bonchi", "Arijit Khan", "Andr\u00e9 Panisson"], "brief": "\u672c\u6587\u63d0\u51fa\u7528\u56fe\u795e\u7ecf\u7f51\u7edc\u6c42\u89e3\u5f52\u7eb3\u5f0f\u76f8\u5173\u805a\u7c7b\uff0c\u4f7f\u6a21\u578b\u5728\u8bad\u7ec3\u540e\u80fd\u76f4\u63a5\u6cdb\u5316\u5230\u672a\u89c1\u8fc7\u7684\u56fe\u5b9e\u4f8b\uff0c\u800c\u65e0\u9700\u6bcf\u6b21\u4ece\u5934\u8fd0\u884c\u4f20\u7edf\u7ec4\u5408\u4f18\u5316\u7b97\u6cd5\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u63a8\u7406\u901f\u5ea6\u6700\u9ad8\u63d0\u53475\u4e2a\u6570\u91cf\u7ea7\uff0c\u540c\u65f6\u8fd1\u4f3c\u8d28\u91cf\u4fdd\u6301\u5728\u6700\u4f73\u57fa\u7ebf\u7ea610%\u4ee5\u5185\uff0c\u5e76\u53ef\u4f5c\u4e3a\u56fe\u5206\u7c7b\u4e2d\u7684\u53ef\u5b66\u4e60\u6c60\u5316\u5c42\u63d0\u5347\u5c42\u6b21\u7ed3\u6784\u5efa\u6a21\u80fd\u529b\u3002", "categories": ["cs.LG", "cs.DS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27153", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u805a\u7c7b", "\u7ec4\u5408\u4f18\u5316", "\u56fe\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27153v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Inductive Correlation Clustering with Graph Neural Networks", "tldr": "\u672c\u6587\u63d0\u51fa\u7528\u56fe\u795e\u7ecf\u7f51\u7edc\u6c42\u89e3\u5f52\u7eb3\u5f0f\u76f8\u5173\u805a\u7c7b\uff0c\u4f7f\u6a21\u578b\u5728\u8bad\u7ec3\u540e\u80fd\u76f4\u63a5\u6cdb\u5316\u5230\u672a\u89c1\u8fc7\u7684\u56fe\u5b9e\u4f8b\uff0c\u800c\u65e0\u9700\u6bcf\u6b21\u4ece\u5934\u8fd0\u884c\u4f20\u7edf\u7ec4\u5408\u4f18\u5316\u7b97\u6cd5\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u63a8\u7406\u901f\u5ea6\u6700\u9ad8\u63d0\u53475\u4e2a\u6570\u91cf\u7ea7\uff0c\u540c\u65f6\u8fd1\u4f3c\u8d28\u91cf\u4fdd\u6301\u5728\u6700\u4f73\u57fa\u7ebf\u7ea610%\u4ee5\u5185\uff0c\u5e76\u53ef\u4f5c\u4e3a\u56fe\u5206\u7c7b\u4e2d\u7684\u53ef\u5b66\u4e60\u6c60\u5316\u5c42\u63d0\u5347\u5c42\u6b21\u7ed3\u6784\u5efa\u6a21\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Applications in fields such as movement ecology, Internet of Things or robotics share the need for systems that localize devices that are too small and power constrained to implement GNSS (Global Navigation Satellite Systems). Alternative low-power localization methods often rely on only measurements of RSS (Received Signal Strength) to infer the AoA (Angle of Arrival) of a transmitted radio frequency signal, but are limited by range and the power demand of the large number of RSS measurements required to infer an accurate AoA. In this paper we address these issues with a novel RSS-based method for tracking ultra lightweight and low-power moving receivers across a complex landscape, achieved by using a minimal number of RSS measurements from simple rotating high-gain transmitters with a range of 300m, and applying probabilistic modelling to infer their AoA. The receiver\u0027s movement path is then modelled using a Gaussian process and reconstructed using doubly stochastic variational inference, resulting in approximately 15m accuracy tracking of receivers weighing 38mg (including power source) over a scalable landscape range while consuming less than 180uW, increased to approximately 10m accuracy at less than 600uW by taking more RSS measurements. We anticipate that this method will support fields such as the behavioural study of flying insect species, which we demonstrate by applying the system to track Bombus terrestris nest return flights.", "arxiv_id": "2608.27152", "arxiv_url": "https://arxiv.org/abs/2608.27152", "authors": ["Christopher J. Noroozi", "Joseph L. Woodgate", "Michael Mangan", "Michael T. Smith"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u8d85\u4f4e\u529f\u8017\u3001\u8f7b\u91cf\u7ea7\u7684\u57fa\u4e8e RSS \u7684\u8def\u5f84\u91cd\u5efa\u7cfb\u7edf\uff0c\u7528\u5c11\u91cf\u6765\u81ea\u65cb\u8f6c\u9ad8\u589e\u76ca\u53d1\u5c04\u5668\u7684\u4fe1\u53f7\u5f3a\u5ea6\u6d4b\u91cf\uff0c\u901a\u8fc7\u6982\u7387\u5efa\u6a21\u4f30\u8ba1\u5230\u8fbe\u89d2\uff0c\u5e76\u7528\u9ad8\u65af\u8fc7\u7a0b\u4e0e\u53cc\u968f\u673a\u53d8\u5206\u63a8\u65ad\u91cd\u5efa\u79fb\u52a8\u8f68\u8ff9\u3002\u7cfb\u7edf\u53ef\u5728\u7ea6300\u7c73\u8303\u56f4\u5185\u8ffd\u8e2a\u4ec538mg\u3001\u529f\u8017\u4f4e\u4e8e180uW\u7684\u63a5\u6536\u5668\uff0c\u7cbe\u5ea6\u7ea615\u7c73\uff1b\u589e\u52a0\u6d4b\u91cf\u540e\u529f\u8017\u4f4e\u4e8e600uW\u3001\u7cbe\u5ea6\u7ea610\u7c73\uff0c\u5e76\u7528\u4e8e\u8ffd\u8e2a\u718a\u8702\u8fd4\u5de2\u98de\u884c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27152", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f4e\u529f\u8017\u5b9a\u4f4d", "\u6982\u7387\u5efa\u6a21", "\u9ad8\u65af\u8fc7\u7a0b", "\u7269\u8054\u7f51"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27152v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ultra Low-Power, Lightweight, Probabilistic RSS-Based Path Reconstruction: A System for Landscape-Scale Bee Tracking", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u8d85\u4f4e\u529f\u8017\u3001\u8f7b\u91cf\u7ea7\u7684\u57fa\u4e8e RSS \u7684\u8def\u5f84\u91cd\u5efa\u7cfb\u7edf\uff0c\u7528\u5c11\u91cf\u6765\u81ea\u65cb\u8f6c\u9ad8\u589e\u76ca\u53d1\u5c04\u5668\u7684\u4fe1\u53f7\u5f3a\u5ea6\u6d4b\u91cf\uff0c\u901a\u8fc7\u6982\u7387\u5efa\u6a21\u4f30\u8ba1\u5230\u8fbe\u89d2\uff0c\u5e76\u7528\u9ad8\u65af\u8fc7\u7a0b\u4e0e\u53cc\u968f\u673a\u53d8\u5206\u63a8\u65ad\u91cd\u5efa\u79fb\u52a8\u8f68\u8ff9\u3002\u7cfb\u7edf\u53ef\u5728\u7ea6300\u7c73\u8303\u56f4\u5185\u8ffd\u8e2a\u4ec538mg\u3001\u529f\u8017\u4f4e\u4e8e180uW\u7684\u63a5\u6536\u5668\uff0c\u7cbe\u5ea6\u7ea615\u7c73\uff1b\u589e\u52a0\u6d4b\u91cf\u540e\u529f\u8017\u4f4e\u4e8e600uW\u3001\u7cbe\u5ea6\u7ea610\u7c73\uff0c\u5e76\u7528\u4e8e\u8ffd\u8e2a\u718a\u8702\u8fd4\u5de2\u98de\u884c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The recently envisioned goal-oriented communications paradigm requires machine learning inference to be performed directly on wirelessly transferred data. This paper presents an eXtremely Large (XL) Multiple-Input Multiple-Output (MIMO) system that operates as an Extreme Learning Machine (ELM) to execute Over-The-Air (OTA) binary classification. To reduce hardware complexity, the receiver is equipped with cascaded metasurfaces terminating in a single radio-frequency chain. A front metasurface layer applies a fixed nonlinear response to the incoming signal, acting as the ELM\u0027s activation function. Subsequent tunable linear metasurface layers physically approximate the trained network weights directly in the wave domain. Numerical evaluations across diverse datasets showcase that our XL MIMO architecture achieves classification accuracy comparable to idealized digital models, thereby proving the viability of low-complexity, wave-domain OTA learning.", "arxiv_id": "2608.27137", "arxiv_url": "https://arxiv.org/abs/2608.27137", "authors": ["Kyriakos Stylianopoulos", "Mattia Fabiani", "Giulia Torcolacci", "Davide Dardari", "George C. Alexandropoulos"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u8d85\u5927\u89c4\u6a21 MIMO \u7a7a\u4e2d\u8ba1\u7b97\u67b6\u6784\uff0c\u7528\u7ea7\u8054\u667a\u80fd\u8d85\u8868\u9762\u5b9e\u73b0\u6781\u9650\u5b66\u4e60\u673a\uff0c\u5728\u65e0\u7ebf\u4f20\u64ad\u8fc7\u7a0b\u4e2d\u76f4\u63a5\u5b8c\u6210\u4e8c\u5206\u7c7b\u63a8\u7406\u3002\u524d\u5c42\u8d85\u8868\u9762\u63d0\u4f9b\u56fa\u5b9a\u975e\u7ebf\u6027\u6fc0\u6d3b\uff0c\u540e\u7eed\u53ef\u8c03\u7ebf\u6027\u8d85\u8868\u9762\u5728\u6ce2\u57df\u8fd1\u4f3c\u8bad\u7ec3\u6743\u91cd\uff0c\u4eff\u771f\u663e\u793a\u5176\u5206\u7c7b\u7cbe\u5ea6\u63a5\u8fd1\u7406\u60f3\u6570\u5b57\u6a21\u578b\uff0c\u540c\u65f6\u964d\u4f4e\u786c\u4ef6\u590d\u6742\u5ea6\u3002", "categories": ["eess.SP", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27137", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a7a\u4e2d\u8ba1\u7b97", "\u667a\u80fd\u8d85\u8868\u9762", "\u6781\u9650\u5b66\u4e60\u673a", "MIMO"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27137v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Over-The-Air Extreme Learning Machines with Nonlinear Stacked Intelligent Metasurfaces", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u8d85\u5927\u89c4\u6a21 MIMO \u7a7a\u4e2d\u8ba1\u7b97\u67b6\u6784\uff0c\u7528\u7ea7\u8054\u667a\u80fd\u8d85\u8868\u9762\u5b9e\u73b0\u6781\u9650\u5b66\u4e60\u673a\uff0c\u5728\u65e0\u7ebf\u4f20\u64ad\u8fc7\u7a0b\u4e2d\u76f4\u63a5\u5b8c\u6210\u4e8c\u5206\u7c7b\u63a8\u7406\u3002\u524d\u5c42\u8d85\u8868\u9762\u63d0\u4f9b\u56fa\u5b9a\u975e\u7ebf\u6027\u6fc0\u6d3b\uff0c\u540e\u7eed\u53ef\u8c03\u7ebf\u6027\u8d85\u8868\u9762\u5728\u6ce2\u57df\u8fd1\u4f3c\u8bad\u7ec3\u6743\u91cd\uff0c\u4eff\u771f\u663e\u793a\u5176\u5206\u7c7b\u7cbe\u5ea6\u63a5\u8fd1\u7406\u60f3\u6570\u5b57\u6a21\u578b\uff0c\u540c\u65f6\u964d\u4f4e\u786c\u4ef6\u590d\u6742\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable prediction of time-varying channel state information (CSI) is essential for efficient wireless communication. Each CSI frame is a matrix-valued representation of the wireless channel response, and a sequence of CSI frames forms a temporal channel trajectory. Modern deep learning-based CSI predictors, however, often provide only point predictions and lack calibrated uncertainty estimates. This limitation is particularly problematic in multi-step CSI prediction, where the target is a sequence of future CSI matrices, and downstream decisions such as beamforming or scheduling may fail if any part of the predicted trajectory is unreliable. We propose trajectory-adaptive calibration and error profiling with conformal risk control (TRACE-CRC), a method for trajectory-aware uncertainty quantification in multi-step CSI prediction. TRACE-CRC constructs Frobenius-norm uncertainty balls around predicted CSI matrices and controls the risk that at least one future frame is uncovered. Instead of calibrating each future step independently, TRACE-CRC combines future-step-dependent error profiling, trajectory difficulty stratification, and learn-then-test (LTT) risk control. Empirically, TRACE-CRC achieves reliable trajectory-level coverage with substantially smaller uncertainty balls than conservative multi-step corrections, while avoiding the trajectory undercoverage of compact stepwise and adaptive conformal baselines.", "arxiv_id": "2608.27124", "arxiv_url": "https://arxiv.org/abs/2608.27124", "authors": ["Kiarash Rezaei", "Mehdi Sattari", "Javad Aliakbari", "Tommy Svensson", "Paolo Monti", "Carlos Natalino"], "brief": "\u672c\u6587\u63d0\u51fa TRACE-CRC\uff0c\u7528\u4e8e\u591a\u6b65\u65e0\u7ebf\u4fe1\u9053\u72b6\u6001\u4fe1\u606f\uff08CSI\uff09\u9884\u6d4b\u7684\u8f68\u8ff9\u7ea7\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\u3002\u65b9\u6cd5\u901a\u8fc7\u5171\u5f62\u98ce\u9669\u63a7\u5236\u6784\u9020\u9884\u6d4b CSI \u77e9\u9635\u7684 Frobenius \u8303\u6570\u4e0d\u786e\u5b9a\u7403\uff0c\u5e76\u7ed3\u5408\u672a\u6765\u6b65\u8bef\u5dee\u523b\u753b\u3001\u8f68\u8ff9\u96be\u5ea6\u5206\u5c42\u548c learn-then-test \u63a7\u5236\uff0c\u5b9e\u73b0\u53ef\u9760\u8986\u76d6\u4e14\u6bd4\u4fdd\u5b88\u6821\u6b63\u65b9\u6cd5\u66f4\u7d27\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27124", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e0d\u786e\u5b9a\u6027\u91cf\u5316", "\u5171\u5f62\u9884\u6d4b", "\u65e0\u7ebf\u901a\u4fe1", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27124v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TRACE-CRC: Trajectory-Adaptive Conformal Risk Control for Multi-Step Channel State Information Prediction", "tldr": "\u672c\u6587\u63d0\u51fa TRACE-CRC\uff0c\u7528\u4e8e\u591a\u6b65\u65e0\u7ebf\u4fe1\u9053\u72b6\u6001\u4fe1\u606f\uff08CSI\uff09\u9884\u6d4b\u7684\u8f68\u8ff9\u7ea7\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\u3002\u65b9\u6cd5\u901a\u8fc7\u5171\u5f62\u98ce\u9669\u63a7\u5236\u6784\u9020\u9884\u6d4b CSI \u77e9\u9635\u7684 Frobenius \u8303\u6570\u4e0d\u786e\u5b9a\u7403\uff0c\u5e76\u7ed3\u5408\u672a\u6765\u6b65\u8bef\u5dee\u523b\u753b\u3001\u8f68\u8ff9\u96be\u5ea6\u5206\u5c42\u548c learn-then-test \u63a7\u5236\uff0c\u5b9e\u73b0\u53ef\u9760\u8986\u76d6\u4e14\u6bd4\u4fdd\u5b88\u6821\u6b63\u65b9\u6cd5\u66f4\u7d27\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Directed graph learning naturally leads to trainable nonsymmetric propagation operators with distinct right and left spectral structures. Building on the two-sided cone Rayleigh framework for generalized pencils \\[ B_\u03b8-\u03bbG, \\] we develop a learning-oriented methodology for spectral certification, sensitivity analysis, and control without requiring symmetry, nonnegativity, or cone preservation. In the positive-orthant setting, computable lower and upper cone bounds provide an a posteriori enclosure of a distinguished cone level, while smooth soft-min/max surrogates preserve rigorous one-sided bounds with explicit approximation errors and remain differentiable with respect to the trainable parameters. For a simple interior level, the right and left modes satisfy \\[ D\u03bb_C(B)[H]=v_C^T H u_C, \\] yielding first-order optimal graph-supported interventions under prescribed perturbation budgets and motivating adaptive spectral control. Numerical experiments demonstrate the applicability of the approach beyond cone-preserving operators and in directed learning settings. Signed nonsymmetric perturbations reveal a transition from interior eigenpairs to boundary complementary quasi-pairs, including non-spectral cone levels, while controlled experiments show that symmetrization can remove predictive information carried solely by edge direction. On the directed Cora citation network, adaptive recomputation of the right--left sensitivity reduces the distinguished spectral level by approximately $21.5\\%$ under a cumulative edge-weight reduction budget of $0.5\\%$, with no observed change in test accuracy for the trained model and data split considered.", "arxiv_id": "2608.27122", "arxiv_url": "https://arxiv.org/abs/2608.27122", "authors": ["Yavdat Sh. Il\u0027yasov", "Nur F. Valeev"], "brief": "\u672c\u6587\u9762\u5411\u6709\u5411\u56fe\u5b66\u4e60\u4e2d\u7684\u975e\u5bf9\u79f0\u4f20\u64ad\u7b97\u5b50\uff0c\u63d0\u51fa\u57fa\u4e8e\u53cc\u4fa7\u9525 Rayleigh \u5546\u7684\u8c31\u8ba4\u8bc1\u3001\u654f\u611f\u6027\u5206\u6790\u4e0e\u81ea\u9002\u5e94\u63a7\u5236\u65b9\u6cd5\uff0c\u4e0d\u8981\u6c42\u7b97\u5b50\u5bf9\u79f0\u3001\u975e\u8d1f\u6216\u4fdd\u6301\u9525\u7ed3\u6784\u3002\u65b9\u6cd5\u7ed9\u51fa\u53ef\u8ba1\u7b97\u7684\u4e0a\u4e0b\u754c\u548c\u53ef\u5fae\u8f6f\u8fd1\u4f3c\uff0c\u5e76\u7528\u5de6\u53f3\u7279\u5f81\u6a21\u6001\u63a8\u5bfc\u4e00\u9636\u5e72\u9884\u7b56\u7565\uff1b\u5728\u6709\u5411 Cora \u4e0a\u4ec5\u7528 0.5% \u7d2f\u8ba1\u8fb9\u6743\u524a\u51cf\u9884\u7b97\u4f7f\u76ee\u6807\u8c31\u6c34\u5e73\u4e0b\u964d\u7ea6 21.5%\uff0c\u4e14\u6d4b\u8bd5\u7cbe\u5ea6\u672a\u53d8\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27122", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6709\u5411\u56fe\u5b66\u4e60", "\u8c31\u65b9\u6cd5", "\u654f\u611f\u6027\u5206\u6790", "\u81ea\u9002\u5e94\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27122v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cone Extended Rayleigh Quotients for Directed Graph Learning: Minimax Spectral Certificates, Sensitivity, and Adaptive Control", "tldr": "\u672c\u6587\u9762\u5411\u6709\u5411\u56fe\u5b66\u4e60\u4e2d\u7684\u975e\u5bf9\u79f0\u4f20\u64ad\u7b97\u5b50\uff0c\u63d0\u51fa\u57fa\u4e8e\u53cc\u4fa7\u9525 Rayleigh \u5546\u7684\u8c31\u8ba4\u8bc1\u3001\u654f\u611f\u6027\u5206\u6790\u4e0e\u81ea\u9002\u5e94\u63a7\u5236\u65b9\u6cd5\uff0c\u4e0d\u8981\u6c42\u7b97\u5b50\u5bf9\u79f0\u3001\u975e\u8d1f\u6216\u4fdd\u6301\u9525\u7ed3\u6784\u3002\u65b9\u6cd5\u7ed9\u51fa\u53ef\u8ba1\u7b97\u7684\u4e0a\u4e0b\u754c\u548c\u53ef\u5fae\u8f6f\u8fd1\u4f3c\uff0c\u5e76\u7528\u5de6\u53f3\u7279\u5f81\u6a21\u6001\u63a8\u5bfc\u4e00\u9636\u5e72\u9884\u7b56\u7565\uff1b\u5728\u6709\u5411 Cora \u4e0a\u4ec5\u7528 0.5% \u7d2f\u8ba1\u8fb9\u6743\u524a\u51cf\u9884\u7b97\u4f7f\u76ee\u6807\u8c31\u6c34\u5e73\u4e0b\u964d\u7ea6 21.5%\uff0c\u4e14\u6d4b\u8bd5\u7cbe\u5ea6\u672a\u53d8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Aesthetics are an important part of the symbolism of artistic works. Although subjective, humans categorize art based on the emotion evoked regardless of modality. What remains under-explored is how AI models form their own aesthetic categorization of human-produced media without explicit labels or cross-modal supervision. We present a self-supervised framework that projects four modalities (text, audio, image and video) into a shared 256-dimensional embedding space and applies iterative clustering to discover aesthetic structure. We discuss the divergence between AI-generated cluster assignments and human affective register labels on a weakly supervised multimodal dataset. This work has applications in understanding how AI structures cross-modal similarity, organizing heterogeneous media collections for Retrieval-Augmented Generation (RAG), and automated data labeling.", "arxiv_id": "2608.27121", "arxiv_url": "https://arxiv.org/abs/2608.27121", "authors": ["Corey D. C. Heath"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u81ea\u76d1\u7763\u591a\u6a21\u6001\u6846\u67b6\uff0c\u5c06\u6587\u672c\u3001\u97f3\u9891\u3001\u56fe\u50cf\u548c\u89c6\u9891\u6295\u5f71\u5230\u5171\u4eab\u5d4c\u5165\u7a7a\u95f4\uff0c\u5e76\u901a\u8fc7\u8fed\u4ee3\u805a\u7c7b\u53d1\u73b0\u827a\u672f\u4f5c\u54c1\u4e2d\u7684\u5ba1\u7f8e\u7ed3\u6784\u3002\u7814\u7a76\u6bd4\u8f83\u4e86 AI \u81ea\u53d1\u5f62\u6210\u7684\u805a\u7c7b\u4e0e\u4eba\u7c7b\u60c5\u611f\u6807\u7b7e\u7684\u5dee\u5f02\uff0c\u53ef\u7528\u4e8e\u8de8\u6a21\u6001\u76f8\u4f3c\u6027\u7406\u89e3\u3001RAG \u5a92\u4f53\u7ec4\u7ec7\u548c\u81ea\u52a8\u6807\u6ce8\u3002", "categories": ["cs.MM", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27121", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u8868\u5f81\u5b66\u4e60", "\u805a\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27121v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How AI Experiences Art: Emergent Aesthetic Structure in a Self-Supervised Multimodal Embedding Space", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u81ea\u76d1\u7763\u591a\u6a21\u6001\u6846\u67b6\uff0c\u5c06\u6587\u672c\u3001\u97f3\u9891\u3001\u56fe\u50cf\u548c\u89c6\u9891\u6295\u5f71\u5230\u5171\u4eab\u5d4c\u5165\u7a7a\u95f4\uff0c\u5e76\u901a\u8fc7\u8fed\u4ee3\u805a\u7c7b\u53d1\u73b0\u827a\u672f\u4f5c\u54c1\u4e2d\u7684\u5ba1\u7f8e\u7ed3\u6784\u3002\u7814\u7a76\u6bd4\u8f83\u4e86 AI \u81ea\u53d1\u5f62\u6210\u7684\u805a\u7c7b\u4e0e\u4eba\u7c7b\u60c5\u611f\u6807\u7b7e\u7684\u5dee\u5f02\uff0c\u53ef\u7528\u4e8e\u8de8\u6a21\u6001\u76f8\u4f3c\u6027\u7406\u89e3\u3001RAG \u5a92\u4f53\u7ec4\u7ec7\u548c\u81ea\u52a8\u6807\u6ce8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Motivated by theoretical problems in deep learning, we conjecture that post-composing a fixed number of pairwise distinct nonconstant polynomials with a generic polynomial of sufficiently large degree yields linearly independent polynomials. This generalizes Newman--Slater\u0027s theorem on powers of polynomials. We establish several cases of this conjecture and its origin-passing variant: We prove the result for two polynomials, and for an arbitrary number of polynomials when their degrees are bounded. Furthermore, we show how the conjecture implies a complete understanding of the identifiability (i.e., parameter symmetries) of deep fully connected neural network architectures with generic polynomial activation functions. In particular, for network architectures with layer-specific activations of increasing degree, our established versions of the conjecture fully characterize the set of parameters yielding the same end-to-end network function. As a special case, we fully resolve the identifiability of shallow polynomial networks.", "arxiv_id": "2608.27113", "arxiv_url": "https://arxiv.org/abs/2608.27113", "authors": ["Kathl\u00e9n Kohn", "Giovanni Luca Marchetti", "Alex Massarenti", "Massimiliano Mella"], "brief": "\u672c\u6587\u7814\u7a76\u591a\u9879\u5f0f\u590d\u5408\u540e\u7684\u7ebf\u6027\u65e0\u5173\u6027\u731c\u60f3\uff0c\u8bc1\u660e\u4e86\u4e24\u4e2a\u591a\u9879\u5f0f\u3001\u4ee5\u53ca\u4efb\u610f\u4e2a\u4f46\u6b21\u6570\u6709\u754c\u591a\u9879\u5f0f\u7b49\u82e5\u5e72\u60c5\u5f62\u3002\u8fdb\u4e00\u6b65\u5c06\u8be5\u7ed3\u679c\u7528\u4e8e\u523b\u753b\u5e26\u6cdb\u578b\u591a\u9879\u5f0f\u6fc0\u6d3b\u7684\u5168\u8fde\u63a5\u6df1\u5ea6\u7f51\u7edc\u7684\u53ef\u8fa8\u8bc6\u6027\uff0c\u5b8c\u6574\u63cf\u8ff0\u4ea7\u751f\u76f8\u540c\u7f51\u7edc\u51fd\u6570\u7684\u53c2\u6570\u5bf9\u79f0\u6027\uff0c\u5e76\u89e3\u51b3\u4e86\u6d45\u5c42\u591a\u9879\u5f0f\u7f51\u7edc\u7684\u53ef\u8fa8\u8bc6\u6027\u95ee\u9898\u3002", "categories": ["math.AC", "cs.LG", "math.AG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27113", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df1\u5ea6\u5b66\u4e60\u7406\u8bba", "\u591a\u9879\u5f0f", "\u53ef\u8fa8\u8bc6\u6027", "\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27113v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Linear Independence of Polynomial Compositions and Identifiability of Deep Neural Networks", "tldr": "\u672c\u6587\u7814\u7a76\u591a\u9879\u5f0f\u590d\u5408\u540e\u7684\u7ebf\u6027\u65e0\u5173\u6027\u731c\u60f3\uff0c\u8bc1\u660e\u4e86\u4e24\u4e2a\u591a\u9879\u5f0f\u3001\u4ee5\u53ca\u4efb\u610f\u4e2a\u4f46\u6b21\u6570\u6709\u754c\u591a\u9879\u5f0f\u7b49\u82e5\u5e72\u60c5\u5f62\u3002\u8fdb\u4e00\u6b65\u5c06\u8be5\u7ed3\u679c\u7528\u4e8e\u523b\u753b\u5e26\u6cdb\u578b\u591a\u9879\u5f0f\u6fc0\u6d3b\u7684\u5168\u8fde\u63a5\u6df1\u5ea6\u7f51\u7edc\u7684\u53ef\u8fa8\u8bc6\u6027\uff0c\u5b8c\u6574\u63cf\u8ff0\u4ea7\u751f\u76f8\u540c\u7f51\u7edc\u51fd\u6570\u7684\u53c2\u6570\u5bf9\u79f0\u6027\uff0c\u5e76\u89e3\u51b3\u4e86\u6d45\u5c42\u591a\u9879\u5f0f\u7f51\u7edc\u7684\u53ef\u8fa8\u8bc6\u6027\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Federated Learning (FL) enables privacy-aware distributed training, yet gradient updates remain exploitable: Man-in-the-Middle (MitM) interception exposes updates in transit, while model poisoning corrupts global convergence. We first introduce GASHE (Gradient-Aware Selective Homomorphic Encryption), a novel selective encryption strategy that dynamically identifies and encrypts only the gradient components exceeding a DP-calibrated sensitivity threshold, rather than encrypting all parameters uniformly as in static layer-based or full-parameter CKKS schemes. Building on GASHE, we introduce SecureDrive-FL, a federated driver monitoring framework that couples DP-SGD with GASHE to create the first closed-loop DP+HE privacy pipeline: DP-SGD calibration parameters directly derive the GASHE encryption mask, unifying training-time privacy and communication-time confidentiality. Evaluated on a ten-class distracted driver classification task under non-IID federated splits, SecureDrive-FL matches DP-SGD alone\u0027s poisoning resistance (73.6% vs. 74.0% accuracy, 3.9% Attack Success Rate for both) while additionally withstanding MitM interception, where DP-SGD alone collapses to near-random accuracy (78.2% vs. 10.4%), all under only approx. 8--10% additional runtime overhead relative to DP-SGD alone---under DP-SGD noise injection with per-round privacy parameter epsilon_0=4.", "arxiv_id": "2608.27108", "arxiv_url": "https://arxiv.org/abs/2608.27108", "authors": ["Baran Can G\u00fcl", "Hanuma Siddhartha Tunuguntla", "Anjana Arvind Naik", "Abhishek Vijay Potekar", "Nasser Jazdi", "Michael Weyrich"], "brief": "\u8bba\u6587\u63d0\u51fa SecureDrive-FL\uff0c\u5c06 DP-SGD \u4e0e\u68af\u5ea6\u611f\u77e5\u9009\u62e9\u6027\u540c\u6001\u52a0\u5bc6 GASHE \u7ed3\u5408\uff0c\u7528\u5dee\u5206\u9690\u79c1\u6821\u51c6\u51fa\u7684\u654f\u611f\u5ea6\u9608\u503c\u52a8\u6001\u9009\u62e9\u9700\u8981\u52a0\u5bc6\u7684\u68af\u5ea6\u5206\u91cf\u3002\u8be5\u65b9\u6cd5\u5728\u8054\u90a6\u9a7e\u9a76\u5458\u5206\u5fc3\u8bc6\u522b\u4efb\u52a1\u4e2d\u4fdd\u6301\u4e0e DP-SGD \u76f8\u8fd1\u7684\u6297\u6295\u6bd2\u80fd\u529b\uff0c\u540c\u65f6\u80fd\u62b5\u5fa1\u4e2d\u95f4\u4eba\u622a\u83b7\uff0c\u989d\u5916\u8fd0\u884c\u5f00\u9500\u7ea6 8%\u201310%\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27108", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u5dee\u5206\u9690\u79c1", "\u540c\u6001\u52a0\u5bc6", "\u5b89\u5168\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27108v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SecureDrive-FL: Joint Differential Privacy and Gradient-Aware Selective Homomorphic Encryption for Federated Driver Monitoring", "tldr": "\u8bba\u6587\u63d0\u51fa SecureDrive-FL\uff0c\u5c06 DP-SGD \u4e0e\u68af\u5ea6\u611f\u77e5\u9009\u62e9\u6027\u540c\u6001\u52a0\u5bc6 GASHE \u7ed3\u5408\uff0c\u7528\u5dee\u5206\u9690\u79c1\u6821\u51c6\u51fa\u7684\u654f\u611f\u5ea6\u9608\u503c\u52a8\u6001\u9009\u62e9\u9700\u8981\u52a0\u5bc6\u7684\u68af\u5ea6\u5206\u91cf\u3002\u8be5\u65b9\u6cd5\u5728\u8054\u90a6\u9a7e\u9a76\u5458\u5206\u5fc3\u8bc6\u522b\u4efb\u52a1\u4e2d\u4fdd\u6301\u4e0e DP-SGD \u76f8\u8fd1\u7684\u6297\u6295\u6bd2\u80fd\u529b\uff0c\u540c\u65f6\u80fd\u62b5\u5fa1\u4e2d\u95f4\u4eba\u622a\u83b7\uff0c\u989d\u5916\u8fd0\u884c\u5f00\u9500\u7ea6 8%\u201310%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many scientific and engineering applications require estimating unknown parameters from experimentally observable data -- an inverse problem that is inherently challenging due to nonlinearity, noise, and ill-posedness. In this paper, we propose an active diffusion-based inverse problem solver. A DM is trained to learn the mapping between the parameter space and the observable space. By iteratively detecting and correcting model misspecification through posterior uncertainty, the method discovers and learns the correct region of parameter space, even when initial training bounds exclude the true parameters. This provides a principled, Bayesian justification for adaptive domain augmentation and ensures robust inference for inverse problems under incomplete prior knowledge. We demonstrate the effectiveness of our inverse solver for a toy inverse problem with infinite solutions, and for the parameterization of the quantum correlation functions to event observables in a Quantum Chromodynamics analysis of nucleon structure.", "arxiv_id": "2608.27080", "arxiv_url": "https://arxiv.org/abs/2608.27080", "authors": ["Jitao Xu", "Nobuo Sato", "Yaohang Li"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e3b\u52a8\u6269\u6563\u6a21\u578b\u53cd\u95ee\u9898\u6c42\u89e3\u5668\uff0c\u7528\u6269\u6563\u6a21\u578b\u5b66\u4e60\u53c2\u6570\u7a7a\u95f4\u5230\u89c2\u6d4b\u7a7a\u95f4\u7684\u6620\u5c04\uff0c\u5e76\u5229\u7528\u540e\u9a8c\u4e0d\u786e\u5b9a\u6027\u8fed\u4ee3\u53d1\u73b0\u548c\u4fee\u6b63\u6a21\u578b\u8bbe\u5b9a\u9519\u8bef\u3002\u5373\u4f7f\u521d\u59cb\u5148\u9a8c\u8303\u56f4\u4e0d\u5305\u542b\u771f\u5b9e\u53c2\u6570\uff0c\u65b9\u6cd5\u4e5f\u80fd\u81ea\u9002\u5e94\u6269\u5c55\u53c2\u6570\u57df\uff0c\u5728\u73a9\u5177\u95ee\u9898\u548c\u91cf\u5b50\u8272\u52a8\u529b\u5b66\u6838\u5b50\u7ed3\u6784\u5206\u6790\u4e2d\u5b9e\u73b0\u66f4\u7a33\u5065\u7684\u63a8\u65ad\u3002", "categories": ["stat.ML", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27080", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u53cd\u95ee\u9898", "\u8d1d\u53f6\u65af\u63a8\u65ad", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27080v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Active Diffusion-Based Inference for Ill-Posed Inverse Problems under Incomplete Priors", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e3b\u52a8\u6269\u6563\u6a21\u578b\u53cd\u95ee\u9898\u6c42\u89e3\u5668\uff0c\u7528\u6269\u6563\u6a21\u578b\u5b66\u4e60\u53c2\u6570\u7a7a\u95f4\u5230\u89c2\u6d4b\u7a7a\u95f4\u7684\u6620\u5c04\uff0c\u5e76\u5229\u7528\u540e\u9a8c\u4e0d\u786e\u5b9a\u6027\u8fed\u4ee3\u53d1\u73b0\u548c\u4fee\u6b63\u6a21\u578b\u8bbe\u5b9a\u9519\u8bef\u3002\u5373\u4f7f\u521d\u59cb\u5148\u9a8c\u8303\u56f4\u4e0d\u5305\u542b\u771f\u5b9e\u53c2\u6570\uff0c\u65b9\u6cd5\u4e5f\u80fd\u81ea\u9002\u5e94\u6269\u5c55\u53c2\u6570\u57df\uff0c\u5728\u73a9\u5177\u95ee\u9898\u548c\u91cf\u5b50\u8272\u52a8\u529b\u5b66\u6838\u5b50\u7ed3\u6784\u5206\u6790\u4e2d\u5b9e\u73b0\u66f4\u7a33\u5065\u7684\u63a8\u65ad\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Algorithmic trading now represents a market exceeding $20 billion, where even marginal gains in signal robustness can translate into economically significant returns. Existing evaluations of equity prediction models do not explicitly target regime robustness during hyperparameter selection. Five model classes are trained on daily observations from approximately 300 large-cap US equities over eleven years, with Bayesian optimisation configured to target trading performance across three statistically different market regimes. Regime-robust hyperparameter selection is associated with out-of-sample generalisation, as signal precision remains above the random baseline across all four quarters of the test period, and portfolio performance slowly degrades under simulated input noise before collapsing beyond a defined threshold. No individual tabular deep learning architecture outperforms gradient-boosted trees, but combining XGBoost and TabNet using rank aggregation produces a Hybrid ensemble with an annualised return of 51.26%, a Sharpe ratio of 2.44, and a statistically significant CAPM alpha of 0.423 (p = 0.011). A near-zero beta indicates this outperformance is driven by stock selection, not market exposure. Alternative data plays a secondary role once technical and fundamental features are accounted for, as well as contributing more strongly on the short side than the long, and varies by model class. An interactive application makes these results explorable in real time, with live data integration the remaining step toward practical deployment.", "arxiv_id": "2608.27076", "arxiv_url": "https://arxiv.org/abs/2608.27076", "authors": ["Joshua Le Grice"], "brief": "\u672c\u6587\u7814\u7a76\u80a1\u7968\u7b97\u6cd5\u4ea4\u6613\u4e2d\u7684\u8868\u683c\u6df1\u5ea6\u5b66\u4e60\uff0c\u4f7f\u7528\u8de8\u4e09\u79cd\u5e02\u573a\u72b6\u6001\u7684\u8d1d\u53f6\u65af\u4f18\u5316\u6765\u9009\u62e9\u66f4\u5177\u7a33\u5065\u6027\u7684\u8d85\u53c2\u6570\uff0c\u5e76\u5728\u7ea6300\u53ea\u7f8e\u80a111\u5e74\u65e5\u9891\u6570\u636e\u4e0a\u8bc4\u4f30\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5355\u4e00\u8868\u683c\u6df1\u5ea6\u6a21\u578b\u672a\u8d85\u8fc7XGBoost\uff0c\u4f46XGBoost\u4e0eTabNet\u7684\u6392\u5e8f\u96c6\u6210\u53d6\u5f9751.26%\u5e74\u5316\u6536\u76ca\u30012.44\u590f\u666e\u7387\u548c\u663e\u8457CAPM alpha\uff0c\u8868\u73b0\u4e3b\u8981\u6765\u81ea\u9009\u80a1\u800c\u975e\u5e02\u573a\u66b4\u9732\u3002", "categories": ["cs.LG", "q-fin.CP", "q-fin.TR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27076", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5316\u4ea4\u6613", "\u8868\u683c\u6df1\u5ea6\u5b66\u4e60", "\u8d1d\u53f6\u65af\u4f18\u5316", "\u96c6\u6210\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27076v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tabular Deep Learning for Algorithmic Trading: Cross-Regime Bayesian Optimisation for Equity Signal Generation", "tldr": "\u672c\u6587\u7814\u7a76\u80a1\u7968\u7b97\u6cd5\u4ea4\u6613\u4e2d\u7684\u8868\u683c\u6df1\u5ea6\u5b66\u4e60\uff0c\u4f7f\u7528\u8de8\u4e09\u79cd\u5e02\u573a\u72b6\u6001\u7684\u8d1d\u53f6\u65af\u4f18\u5316\u6765\u9009\u62e9\u66f4\u5177\u7a33\u5065\u6027\u7684\u8d85\u53c2\u6570\uff0c\u5e76\u5728\u7ea6300\u53ea\u7f8e\u80a111\u5e74\u65e5\u9891\u6570\u636e\u4e0a\u8bc4\u4f30\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5355\u4e00\u8868\u683c\u6df1\u5ea6\u6a21\u578b\u672a\u8d85\u8fc7XGBoost\uff0c\u4f46XGBoost\u4e0eTabNet\u7684\u6392\u5e8f\u96c6\u6210\u53d6\u5f9751.26%\u5e74\u5316\u6536\u76ca\u30012.44\u590f\u666e\u7387\u548c\u663e\u8457CAPM alpha\uff0c\u8868\u73b0\u4e3b\u8981\u6765\u81ea\u9009\u80a1\u800c\u975e\u5e02\u573a\u66b4\u9732\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A core question in decision-making for agents is whether the relative priorities of competing lower-level objectives can be determined by emotional preferences autonomously generated by higher-level goals, rather than being externally prespecified. Under changing external environments and evolving internal states, emotions play an important functional role in regulating the relative priorities of competing goals. Inspired by the goal-directed theory of emotion, this paper studies how such preference regulation can be computationally realized through reinforcement learning. We first propose a conception of emergent emotional preference: a high-level goal autonomously induces state-dependent preferences over competing lower-level objectives. This conception is built upon a framework consisting of a multi-objective reinforcement learning inner controller and an outer preference generator. The inner controller provides a repertoire of preference-conditioned goal-directed behaviors, while the outer preference generator learns a mapping from the current state to objective preferences through reinforcement learning on a high-level goal. We operationalize emotional preference as a state-dependent regulation of relative goal priorities that emerges through optimization. Furthermore, we characterize the policy space induced by preference regulation and derive an upper bound on the optimality gap in terms of the representation error of the inner behavioral repertoire. We show that the gap vanishes when the optimal policy can be represented by the available preference-conditioned policies. Experiments in self-constructed multi-objective exploration environments show that the learned preference function exhibits contextual priority switching, graded trade-offs, and temporal persistence, and outperforms the evaluated fixed-preference and handcrafted-preference strategies.", "arxiv_id": "2608.27072", "arxiv_url": "https://arxiv.org/abs/2608.27072", "authors": ["Shiqi Liu", "Yihua Tan", "Hu Fu", "Guanyu Qi"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6d8c\u73b0\u60c5\u611f\u504f\u597d\u201d\u6846\u67b6\uff1a\u7531\u9ad8\u5c42\u76ee\u6807\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u81ea\u4e3b\u751f\u6210\u968f\u72b6\u6001\u53d8\u5316\u7684\u504f\u597d\uff0c\u7528\u6765\u8c03\u8282\u591a\u4e2a\u4f4e\u5c42\u76ee\u6807\u7684\u4f18\u5148\u7ea7\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u5185\u63a7\u5236\u5668\u4e0e\u5916\u5c42\u504f\u597d\u751f\u6210\u5668\uff0c\u5e76\u7ed9\u51fa\u6700\u4f18\u6027\u5dee\u8ddd\u4e0a\u754c\uff1b\u5b9e\u9a8c\u4e2d\u8868\u73b0\u51fa\u60c5\u5883\u5316\u4f18\u5148\u7ea7\u5207\u6362\u3001\u6743\u8861\u4e0e\u65f6\u95f4\u6301\u7eed\u6027\uff0c\u4f18\u4e8e\u56fa\u5b9a\u6216\u624b\u5de5\u504f\u597d\u7b56\u7565\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27072", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u591a\u76ee\u6807\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u60c5\u611f\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27072v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Emotional Preferences as Goal-Priority Regulation", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u6d8c\u73b0\u60c5\u611f\u504f\u597d\u201d\u6846\u67b6\uff1a\u7531\u9ad8\u5c42\u76ee\u6807\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u81ea\u4e3b\u751f\u6210\u968f\u72b6\u6001\u53d8\u5316\u7684\u504f\u597d\uff0c\u7528\u6765\u8c03\u8282\u591a\u4e2a\u4f4e\u5c42\u76ee\u6807\u7684\u4f18\u5148\u7ea7\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u5185\u63a7\u5236\u5668\u4e0e\u5916\u5c42\u504f\u597d\u751f\u6210\u5668\uff0c\u5e76\u7ed9\u51fa\u6700\u4f18\u6027\u5dee\u8ddd\u4e0a\u754c\uff1b\u5b9e\u9a8c\u4e2d\u8868\u73b0\u51fa\u60c5\u5883\u5316\u4f18\u5148\u7ea7\u5207\u6362\u3001\u6743\u8861\u4e0e\u65f6\u95f4\u6301\u7eed\u6027\uff0c\u4f18\u4e8e\u56fa\u5b9a\u6216\u624b\u5de5\u504f\u597d\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "To mitigate catastrophic forgetting in downstream continual learning (CL) for large language models (LLMs), existing methods typically constrain parameter updates or introduce task-specific adaptation modules. However, these methods often rely on explicit task boundaries during training, limiting their applicability to realistic task-free scenarios. In this paper, we propose a \\textbf{Fi}sher-guided \\textbf{uni}fied (\\textbf{FiUni}) framework for batch-level task detection and parameter-efficient continual adaptation. FiUni is motivated by a key observation about the Fisher information matrix (FIM) of pre-trained models: the orthogonality among the principal subspaces of its Kronecker-Factored Approximate Curvature (K-FAC) approximation, estimated from a small number of downstream task samples, can reflect the similarity between different tasks. Based on this observation, FiUni constructs FIM-derived frozen subspaces to guide low-rank adaptation (LoRA), while matching the Fisher principal subspace of each incoming batch window with historical subspaces. This enables FiUni to adaptively determine whether to reuse existing knowledge, expand a related subspace, or create a new subspace, dynamically balancing knowledge sharing and task isolation. Experiments show that FiUni can effectively infer latent batch-level task affiliations and achieve competitive performance against advanced task-aware CL methods with fewer trainable parameters.", "arxiv_id": "2608.27070", "arxiv_url": "https://arxiv.org/abs/2608.27070", "authors": ["Dezheng Han", "Anbang Zhang", "Zhihao Zhu", "Shuaishuai Guo"], "brief": "\u672c\u6587\u63d0\u51fa FiUni\uff0c\u7528 Fisher \u4fe1\u606f\u77e9\u9635\u7684 K-FAC \u4e3b\u5b50\u7a7a\u95f4\u76f8\u4f3c\u6027\uff0c\u5728\u65e0\u4efb\u52a1\u8fb9\u754c\u7684\u6301\u7eed\u5b66\u4e60\u4e2d\u8fdb\u884c\u6279\u7ea7\u4efb\u52a1\u68c0\u6d4b\uff0c\u5e76\u6307\u5bfc LoRA \u7684\u53c2\u6570\u9ad8\u6548\u9002\u914d\u3002\u5b83\u80fd\u81ea\u52a8\u5224\u65ad\u590d\u7528\u65e7\u77e5\u8bc6\u3001\u6269\u5c55\u76f8\u5173\u5b50\u7a7a\u95f4\u6216\u521b\u5efa\u65b0\u5b50\u7a7a\u95f4\uff0c\u5728\u66f4\u5c11\u53ef\u8bad\u7ec3\u53c2\u6570\u4e0b\u8fbe\u5230\u63a5\u8fd1\u4efb\u52a1\u611f\u77e5\u6301\u7eed\u5b66\u4e60\u65b9\u6cd5\u7684\u6027\u80fd\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27070", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u4efb\u52a1\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27070v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unifying Detection and Adaptation in Task-Free Continual Learning", "tldr": "\u672c\u6587\u63d0\u51fa FiUni\uff0c\u7528 Fisher \u4fe1\u606f\u77e9\u9635\u7684 K-FAC \u4e3b\u5b50\u7a7a\u95f4\u76f8\u4f3c\u6027\uff0c\u5728\u65e0\u4efb\u52a1\u8fb9\u754c\u7684\u6301\u7eed\u5b66\u4e60\u4e2d\u8fdb\u884c\u6279\u7ea7\u4efb\u52a1\u68c0\u6d4b\uff0c\u5e76\u6307\u5bfc LoRA \u7684\u53c2\u6570\u9ad8\u6548\u9002\u914d\u3002\u5b83\u80fd\u81ea\u52a8\u5224\u65ad\u590d\u7528\u65e7\u77e5\u8bc6\u3001\u6269\u5c55\u76f8\u5173\u5b50\u7a7a\u95f4\u6216\u521b\u5efa\u65b0\u5b50\u7a7a\u95f4\uff0c\u5728\u66f4\u5c11\u53ef\u8bad\u7ec3\u53c2\u6570\u4e0b\u8fbe\u5230\u63a5\u8fd1\u4efb\u52a1\u611f\u77e5\u6301\u7eed\u5b66\u4e60\u65b9\u6cd5\u7684\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Privacy-Enhancing Technologies (PETs) in computer vision often rely on noise or image perturbations to protect visual data while securely processing it, creating a trade-off between task performance and protection. This trade-off is commonly evaluated using image classification, which primarily captures semantic separability and remains robust despite significant geometric, spatial layout or local boundary alterations. As a result, it is too simplistic as a proxy for generic vision tasks. Exhaustive downstream-task evaluation, however, is computationally expensive because models must often be trained for each PET transformation and parameter setting. We therefore propose a compute-aware multi-task protocol for evaluating PETs in model training. It combines lightweight proxy tasks that target complementary aspects of visual structure while remaining simple and fast to compute. Across irreversible privacy transformations, key-based block primitives, and learnable image encryption schemes, we demonstrate that PETs with similar classification accuracy can differ substantially on other tasks. The outcomes highlight the need for PET evaluation protocols that move beyond classification-only reporting.", "arxiv_id": "2608.27066", "arxiv_url": "https://arxiv.org/abs/2608.27066", "authors": ["Leon Ranke", "Wolfgang H\u00fcbner", "Ronny Hug", "Michael Arens", "J\u00fcrgen Beyerer"], "brief": "\u672c\u6587\u6307\u51fa\u4ec5\u7528\u56fe\u50cf\u5206\u7c7b\u8bc4\u4f30\u9690\u79c1\u589e\u5f3a\u56fe\u50cf\u53d8\u6362\u8fc7\u4e8e\u7247\u9762\uff0c\u56e0\u4e3a\u5206\u7c7b\u4e3b\u8981\u53cd\u6620\u8bed\u4e49\u53ef\u5206\u6027\uff0c\u96be\u4ee5\u63ed\u793a\u51e0\u4f55\u3001\u7a7a\u95f4\u5e03\u5c40\u548c\u5c40\u90e8\u8fb9\u754c\u7b49\u89c6\u89c9\u7ed3\u6784\u53d7\u635f\u60c5\u51b5\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u8ba1\u7b97\u53cb\u597d\u7684\u591a\u4efb\u52a1\u8bc4\u4f30\u534f\u8bae\uff0c\u7528\u8f7b\u91cf\u4ee3\u7406\u4efb\u52a1\u6bd4\u8f83\u4e0d\u540c\u9690\u79c1\u53d8\u6362\uff0c\u53d1\u73b0\u5206\u7c7b\u51c6\u786e\u7387\u76f8\u8fd1\u7684 PET \u5728\u5176\u4ed6\u89c6\u89c9\u4efb\u52a1\u4e0a\u53ef\u80fd\u5dee\u5f02\u663e\u8457\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27066", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9690\u79c1\u4fdd\u62a4", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u56fe\u50cf\u53d8\u6362", "\u591a\u4efb\u52a1\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27066v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Classification: Task-Dependent Learnability under Privacy-Motivated Image Transformations", "tldr": "\u672c\u6587\u6307\u51fa\u4ec5\u7528\u56fe\u50cf\u5206\u7c7b\u8bc4\u4f30\u9690\u79c1\u589e\u5f3a\u56fe\u50cf\u53d8\u6362\u8fc7\u4e8e\u7247\u9762\uff0c\u56e0\u4e3a\u5206\u7c7b\u4e3b\u8981\u53cd\u6620\u8bed\u4e49\u53ef\u5206\u6027\uff0c\u96be\u4ee5\u63ed\u793a\u51e0\u4f55\u3001\u7a7a\u95f4\u5e03\u5c40\u548c\u5c40\u90e8\u8fb9\u754c\u7b49\u89c6\u89c9\u7ed3\u6784\u53d7\u635f\u60c5\u51b5\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u8ba1\u7b97\u53cb\u597d\u7684\u591a\u4efb\u52a1\u8bc4\u4f30\u534f\u8bae\uff0c\u7528\u8f7b\u91cf\u4ee3\u7406\u4efb\u52a1\u6bd4\u8f83\u4e0d\u540c\u9690\u79c1\u53d8\u6362\uff0c\u53d1\u73b0\u5206\u7c7b\u51c6\u786e\u7387\u76f8\u8fd1\u7684 PET \u5728\u5176\u4ed6\u89c6\u89c9\u4efb\u52a1\u4e0a\u53ef\u80fd\u5dee\u5f02\u663e\u8457\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Silent speech recognition (SSR) provides an alternative communication pathway in the absence of audible speech. However, conventional approaches are limited by the need for constant facial attachment, privacy concerns, and unstable signal acquisition. Here, we propose a soft, active electromyography (EMG) interface that enables word-level SSR using machine learning. Worn on the hand, the device uses a fingertip electrode that can be positioned near the lips to acquire EMG signals only when needed. The interface integrates liquid metal (LM) interconnects, transparent flexible printed circuit (FPC) electrodes, and elastomer encapsulation to ensure high mechanical stability during finger motion. A deep neural network trained on these stable signals achieved a mean accuracy of 97.2 $\\pm$ 1.3% across three subjects in classifying a 30-word vocabulary, demonstrating robust linguistic discrimination. Furthermore, real-time drone control validates the practicality of this approach in noisy and privacy-sensitive environments where conventional voice recognition fails. This study highlights the potential of soft, wearable EMG systems as secure and intuitive human-machine interfaces.", "arxiv_id": "2608.27048", "arxiv_url": "https://arxiv.org/abs/2608.27048", "authors": ["Yuta Kurotaki", "Shusuke Yamakoshi", "Reitaro Yoshida", "Yutaka Isoda", "Tamami Takano", "Yuji Isano", "Yusuke Miyake", "Kentaro Kuribayashi", "Hiroki Ota"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4f69\u6234\u5728\u624b\u4e0a\u7684\u67d4\u6027\u4e3b\u52a8\u808c\u7535\u63a5\u53e3\uff0c\u53ef\u5728\u9700\u8981\u65f6\u5c06\u6307\u5c16\u7535\u6781\u9760\u8fd1\u5634\u5507\u91c7\u96c6\u808c\u7535\u4fe1\u53f7\uff0c\u7528\u4e8e\u673a\u5668\u5b66\u4e60\u9a71\u52a8\u7684\u65e0\u58f0\u8bed\u97f3\u8bc6\u522b\u3002\u57fa\u4e8e\u7a33\u5b9a\u4fe1\u53f7\u8bad\u7ec3\u7684\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u57283\u540d\u53d7\u8bd5\u8005\u300130\u8bcd\u8bcd\u6c47\u5206\u7c7b\u4e2d\u8fbe\u523097.2\u00b11.3%\u5e73\u5747\u51c6\u786e\u7387\uff0c\u5e76\u901a\u8fc7\u5b9e\u65f6\u65e0\u4eba\u673a\u63a7\u5236\u5c55\u793a\u4e86\u5728\u5608\u6742\u548c\u9690\u79c1\u654f\u611f\u573a\u666f\u4e2d\u7684\u5b9e\u7528\u6027\u3002", "categories": ["cs.LG", "cs.HC", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27048", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u673a\u4ea4\u4e92", "\u808c\u7535\u8bc6\u522b", "\u53ef\u7a7f\u6234\u8bbe\u5907", "\u8bed\u97f3\u8bc6\u522b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27048v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Soft Active Electromyography Interface for Machine Learning-Enabled Silent Speech Recognition", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4f69\u6234\u5728\u624b\u4e0a\u7684\u67d4\u6027\u4e3b\u52a8\u808c\u7535\u63a5\u53e3\uff0c\u53ef\u5728\u9700\u8981\u65f6\u5c06\u6307\u5c16\u7535\u6781\u9760\u8fd1\u5634\u5507\u91c7\u96c6\u808c\u7535\u4fe1\u53f7\uff0c\u7528\u4e8e\u673a\u5668\u5b66\u4e60\u9a71\u52a8\u7684\u65e0\u58f0\u8bed\u97f3\u8bc6\u522b\u3002\u57fa\u4e8e\u7a33\u5b9a\u4fe1\u53f7\u8bad\u7ec3\u7684\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u57283\u540d\u53d7\u8bd5\u8005\u300130\u8bcd\u8bcd\u6c47\u5206\u7c7b\u4e2d\u8fbe\u523097.2\u00b11.3%\u5e73\u5747\u51c6\u786e\u7387\uff0c\u5e76\u901a\u8fc7\u5b9e\u65f6\u65e0\u4eba\u673a\u63a7\u5236\u5c55\u793a\u4e86\u5728\u5608\u6742\u548c\u9690\u79c1\u654f\u611f\u573a\u666f\u4e2d\u7684\u5b9e\u7528\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) and other RL-style post-training paradigms have been used for aligning large language models (LLMs) with reasoning standards. The resulting recent Reasoning Language Models (RLMs) such as DeepSeek-R1, o3, and Kimi k1.5 show that such RL-style post-training (\"RL-for-LLMs\") can substantially improve chain-of-thought reasoning, long-horizon planning, and self-correction. However, the computational footprint of these systems is massive: state-of-the-art RLM training requires millions of GPU-hours and tightly coupled multi-model pipelines that stress modern hardware far beyond classical supervised LLM training. This makes RLM training as much a parallel and distributed systems problem as an algorithmic one. In this work, to facilitate developing RLMs that are simultaneously high-performance, scalable, and cost-effective, we first systematize the RL-for-LLM paradigm and provide a compute-centric analysis of prominent post-training algorithmic frameworks: Proximal Policy Optimization (PPO), Group Relative Policy Optimization (GRPO), as well as their variants. Second, we develop a taxonomy of intra- and inter-model parallelism strategies for RL-for-LLMs, covering both traditional techniques (data, tensor, pipeline, sequence, context, and expert parallelism) as well as novel forms of parallelism and optimization techniques for multi-model RLM training, for example disaggregated placement, stage fusion, hybrid parallelism, and asynchronous execution. We harness the work-depth model of parallel computing to make our taxonomy and its insights rigorous and portable. Finally, we analyze existing RLM frameworks and we distill practical guidelines and outline open research directions for building scalable, fast, and cost-effective RLMs.", "arxiv_id": "2608.27046", "arxiv_url": "https://arxiv.org/abs/2608.27046", "authors": ["Maciej Besta", "Leonard Schmidt", "Lara Nonino", "Robert Gerstenberger", "Pierre Pang", "Patrik Okanovic", "Ales Kubicek", "Tiancheng Chen", "Baraq Lipshitz", "Torsten Hoefler"], "brief": "\u672c\u6587\u7cfb\u7edf\u68b3\u7406\u4e86\u9762\u5411\u63a8\u7406\u8bed\u8a00\u6a21\u578b\u7684 RL \u540e\u8bad\u7ec3\u8303\u5f0f\uff0c\u4ece\u8ba1\u7b97\u5f00\u9500\u89d2\u5ea6\u5206\u6790 PPO\u3001GRPO \u7b49\u4e3b\u6d41\u65b9\u6cd5\u3002\u8bba\u6587\u8fdb\u4e00\u6b65\u603b\u7ed3\u4e86\u591a\u79cd\u6a21\u578b\u5185\u4e0e\u6a21\u578b\u95f4\u5e76\u884c\u7b56\u7565\uff0c\u5e76\u57fa\u4e8e work-depth \u6a21\u578b\u7ed9\u51fa\u53ef\u8fc1\u79fb\u7684\u6027\u80fd\u5206\u6790\u3001\u5b9e\u8df5\u5efa\u8bae\u548c\u672a\u6765\u7814\u7a76\u65b9\u5411\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u5927\u89c4\u6a21 RLM \u8bad\u7ec3\u6210\u672c\u5e76\u63d0\u5347\u53ef\u6269\u5c55\u6027\u3002", "categories": ["cs.LG", "cs.AI", "cs.DC", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27046", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u7406\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u5e76\u884c\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27046v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Performance Foundations of Parallel \u0026 Distributed Reasoning Language Models", "tldr": "\u672c\u6587\u7cfb\u7edf\u68b3\u7406\u4e86\u9762\u5411\u63a8\u7406\u8bed\u8a00\u6a21\u578b\u7684 RL \u540e\u8bad\u7ec3\u8303\u5f0f\uff0c\u4ece\u8ba1\u7b97\u5f00\u9500\u89d2\u5ea6\u5206\u6790 PPO\u3001GRPO \u7b49\u4e3b\u6d41\u65b9\u6cd5\u3002\u8bba\u6587\u8fdb\u4e00\u6b65\u603b\u7ed3\u4e86\u591a\u79cd\u6a21\u578b\u5185\u4e0e\u6a21\u578b\u95f4\u5e76\u884c\u7b56\u7565\uff0c\u5e76\u57fa\u4e8e work-depth \u6a21\u578b\u7ed9\u51fa\u53ef\u8fc1\u79fb\u7684\u6027\u80fd\u5206\u6790\u3001\u5b9e\u8df5\u5efa\u8bae\u548c\u672a\u6765\u7814\u7a76\u65b9\u5411\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u5927\u89c4\u6a21 RLM \u8bad\u7ec3\u6210\u672c\u5e76\u63d0\u5347\u53ef\u6269\u5c55\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Direct Preference Optimization (DPO) is a widely used objective for aligning language models from preference data, with the coefficient $\u03b2$ commonly interpreted as controlling the KL constraint to a reference policy. We show that $\u03b2$ entangles two distinct roles: it governs the effective inverse preference-noise scale and simultaneously rescales the optimization dynamics, coupling this scale with the effective step size. As a consequence, at a fixed learning rate the achieved policy deviation is non-monotone in $\u03b2$: it vanishes in a dead zone at small $\u03b2$, reaches a peak at an intermediate value, and decreases again for larger $\u03b2$. Moreover, standard DPO loss values are not comparable across $\u03b2$: runs with nearly identical loss curves can differ several-fold in KL divergence from the reference model. This entanglement obscures the role of $\u03b2$, increases sensitivity to hyperparameter choices, and complicates learning-rate scheduling. We propose a centered-softplus reformulation that is argmin-equivalent to DPO for $\u03b2\u003e0$, while making the inverse preference-noise-scale and learning-rate effects explicit and independently tunable. The normalized centered-softplus objective also admits a continuous $\u03b2\\to0$ endpoint that reduces to a linear preference-margin objective.", "arxiv_id": "2608.27032", "arxiv_url": "https://arxiv.org/abs/2608.27032", "authors": ["Ivan Kruzhilov"], "brief": "\u672c\u6587\u6307\u51fa DPO \u4e2d\u7684 \u03b2 \u540c\u65f6\u63a7\u5236\u504f\u597d\u566a\u58f0\u5c3a\u5ea6\u548c\u4f18\u5316\u52a8\u6001\u7f29\u653e\uff0c\u5bfc\u81f4\u5728\u56fa\u5b9a\u5b66\u4e60\u7387\u4e0b\u7b56\u7565\u504f\u79bb\u968f \u03b2 \u5448\u975e\u5355\u8c03\u53d8\u5316\uff0c\u4e14\u4e0d\u540c \u03b2 \u4e0b\u7684\u635f\u5931\u66f2\u7ebf\u4e0d\u53ef\u76f4\u63a5\u6bd4\u8f83\u3002\u4f5c\u8005\u63d0\u51fa centered-softplus \u91cd\u6784\uff0c\u5728\u4fdd\u6301\u4e0e DPO \u7b49\u4ef7\u6700\u4f18\u89e3\u7684\u540c\u65f6\uff0c\u5c06\u504f\u597d\u5c3a\u5ea6\u4e0e\u5b66\u4e60\u7387\u6548\u5e94\u89e3\u8026\uff0c\u5e76\u7ed9\u51fa \u03b2\u21920 \u65f6\u7684\u7ebf\u6027\u504f\u597d\u95f4\u9694\u5f62\u5f0f\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27032", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u504f\u597d\u4f18\u5316", "\u5bf9\u9f50", "\u4f18\u5316\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27032v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Disentangling Optimization Scale from Preference Scale in DPO", "tldr": "\u672c\u6587\u6307\u51fa DPO \u4e2d\u7684 \u03b2 \u540c\u65f6\u63a7\u5236\u504f\u597d\u566a\u58f0\u5c3a\u5ea6\u548c\u4f18\u5316\u52a8\u6001\u7f29\u653e\uff0c\u5bfc\u81f4\u5728\u56fa\u5b9a\u5b66\u4e60\u7387\u4e0b\u7b56\u7565\u504f\u79bb\u968f \u03b2 \u5448\u975e\u5355\u8c03\u53d8\u5316\uff0c\u4e14\u4e0d\u540c \u03b2 \u4e0b\u7684\u635f\u5931\u66f2\u7ebf\u4e0d\u53ef\u76f4\u63a5\u6bd4\u8f83\u3002\u4f5c\u8005\u63d0\u51fa centered-softplus \u91cd\u6784\uff0c\u5728\u4fdd\u6301\u4e0e DPO \u7b49\u4ef7\u6700\u4f18\u89e3\u7684\u540c\u65f6\uff0c\u5c06\u504f\u597d\u5c3a\u5ea6\u4e0e\u5b66\u4e60\u7387\u6548\u5e94\u89e3\u8026\uff0c\u5e76\u7ed9\u51fa \u03b2\u21920 \u65f6\u7684\u7ebf\u6027\u504f\u597d\u95f4\u9694\u5f62\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Training molecular machine-learning models on ephemeral or memory-constrained accelerator instances can require repeatedly retrieving preprocessed molecular graphs from remote storage. FoldPipe is a lightweight Python orchestration layer for already-sharded PyTorch and PyTorch Geometric data. It retrieves one shard ahead in a background thread while the consumer trains on the current shard, keeping the number of live shard payloads bounded with respect to total dataset size. Asynchronous prefetch and bounded buffering are established systems techniques rather than novel scheduling algorithms. FoldPipe\u0027s contribution is a small integration targeted at native .pt molecular shards together with a source-pinned empirical characterization of its operating regime. We evaluate a SchNet energy-and-force workload on MD17 aspirin using 20 paired, order-alternating benchmark passes on a Tesla T4. Each pass processes five pinned shards containing 25,000 structures. FoldPipe records 16.33 s mean I/O-compute overlap, compared with zero by construction for the sequential bounded baseline. Mean pass time is 76.78 s for FoldPipe and 83.37 s for the baseline. However, the geometric mean paired speedup is $1.059\\times$ with a 95% bootstrap interval from $0.878\\times$ to $1.288\\times$. The experiment therefore verifies the overlap mechanism but is inconclusive about a reliable wall-clock speed advantage under the observed public-network variability.", "arxiv_id": "2608.27029", "arxiv_url": "https://arxiv.org/abs/2608.27029", "authors": ["Dhiren Mukesh Khatri"], "brief": "FoldPipe \u662f\u4e00\u4e2a\u9762\u5411\u5df2\u5206\u7247 PyTorch/PyG \u5206\u5b50\u56fe\u6570\u636e\u7684\u8f7b\u91cf\u7ea7\u8fdc\u7a0b\u6d41\u5f0f\u52a0\u8f7d\u5de5\u5177\uff0c\u901a\u8fc7\u540e\u53f0\u7ebf\u7a0b\u5f02\u6b65\u9884\u53d6\u4e0b\u4e00\u5206\u7247\uff0c\u5e76\u4fdd\u6301\u5185\u5b58\u4e2d\u5206\u7247\u6570\u91cf\u6709\u754c\u3002\u5b9e\u9a8c\u5728 SchNet/MD17 aspirin \u4e0a\u9a8c\u8bc1\u4e86 I/O \u4e0e\u8ba1\u7b97\u91cd\u53e0\u673a\u5236\uff0c\u5e73\u5747\u8017\u65f6\u4ece 83.37 \u79d2\u964d\u81f3 76.78 \u79d2\uff0c\u4f46\u914d\u5bf9\u52a0\u901f\u7f6e\u4fe1\u533a\u95f4\u8f83\u5bbd\uff0c\u5c1a\u4e0d\u80fd\u8bc1\u660e\u7a33\u5b9a\u7684\u7aef\u5230\u7aef\u52a0\u901f\u3002", "categories": ["cs.PF", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27029", "impact_score": 3, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u5b50\u673a\u5668\u5b66\u4e60", "\u6570\u636e\u52a0\u8f7d", "\u5f02\u6b65\u9884\u53d6", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27029v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FoldPipe: Bounded Remote Streaming of Native Molecular Shards with Asynchronous Prefetch", "tldr": "FoldPipe \u662f\u4e00\u4e2a\u9762\u5411\u5df2\u5206\u7247 PyTorch/PyG \u5206\u5b50\u56fe\u6570\u636e\u7684\u8f7b\u91cf\u7ea7\u8fdc\u7a0b\u6d41\u5f0f\u52a0\u8f7d\u5de5\u5177\uff0c\u901a\u8fc7\u540e\u53f0\u7ebf\u7a0b\u5f02\u6b65\u9884\u53d6\u4e0b\u4e00\u5206\u7247\uff0c\u5e76\u4fdd\u6301\u5185\u5b58\u4e2d\u5206\u7247\u6570\u91cf\u6709\u754c\u3002\u5b9e\u9a8c\u5728 SchNet/MD17 aspirin \u4e0a\u9a8c\u8bc1\u4e86 I/O \u4e0e\u8ba1\u7b97\u91cd\u53e0\u673a\u5236\uff0c\u5e73\u5747\u8017\u65f6\u4ece 83.37 \u79d2\u964d\u81f3 76.78 \u79d2\uff0c\u4f46\u914d\u5bf9\u52a0\u901f\u7f6e\u4fe1\u533a\u95f4\u8f83\u5bbd\uff0c\u5c1a\u4e0d\u80fd\u8bc1\u660e\u7a33\u5b9a\u7684\u7aef\u5230\u7aef\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hidden coordinates are not uniquely determined by a language model\u0027s input--output function, so representation-derived measurements should be invariant to function-preserving changes of basis. This study shows that column-permutation parallel analysis violates function-preserving reparameterization invariance because its reference distribution and selected component count can change while the model function and observed covariance spectrum remain fixed. More generally, a data-internal reference procedure cannot simultaneously preserve every coordinate marginal, remain orthogonally equivariant, and remove cross-coordinate covariance. Empirically, across five models, three retrieval domains, and 75 transformations, median component-count disagreement is 0.79 and median fixed-threshold decision disagreement is 0.26. A centering-only control isolates the reference-driven effect, with 1,141 of 1,200 component counts changing despite an unchanged observed spectrum, whereas independent parallel analysis seeds change none of the corresponding decisions. By contrast, orthogonally invariant comparator scores remain numerically stable with similar held-out discrimination. Together, these results show that parallel analysis-derived component counts and decisions can reflect hidden-coordinate choice rather than a well-defined property of the model.", "arxiv_id": "2608.27020", "arxiv_url": "https://arxiv.org/abs/2608.27020", "authors": ["Abdullah Karasan"], "brief": "\u672c\u6587\u6307\u51fa\uff0c\u7528\u4e8e\u5206\u6790\u8bed\u8a00\u6a21\u578b\u9690\u85cf\u8868\u793a\u7684\u5217\u7f6e\u6362\u5e76\u884c\u5206\u6790\u4e0d\u6ee1\u8db3\u51fd\u6570\u4fdd\u6301\u91cd\u53c2\u6570\u5316\u4e0d\u53d8\u6027\uff1a\u5373\u4f7f\u6a21\u578b\u8f93\u5165\u8f93\u51fa\u51fd\u6570\u548c\u89c2\u6d4b\u534f\u65b9\u5dee\u8c31\u4e0d\u53d8\uff0c\u53c2\u8003\u5206\u5e03\u548c\u9009\u51fa\u7684\u6210\u5206\u6570\u4e5f\u4f1a\u6539\u53d8\u3002\u5b9e\u9a8c\u663e\u793a\u8fd9\u79cd\u65b9\u6cd5\u5728\u591a\u6a21\u578b\u3001\u591a\u68c0\u7d22\u4efb\u52a1\u548c\u591a\u79cd\u53d8\u6362\u4e0b\u4ea7\u751f\u5927\u91cf\u4e0d\u4e00\u81f4\u51b3\u7b56\uff0c\u800c\u6b63\u4ea4\u4e0d\u53d8\u7684\u6bd4\u8f83\u6307\u6807\u66f4\u7a33\u5b9a\u4e14\u5224\u522b\u80fd\u529b\u76f8\u8fd1\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27020", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u793a\u5b66\u4e60", "\u8bed\u8a00\u6a21\u578b", "\u7edf\u8ba1\u68c0\u9a8c", "\u4e0d\u53d8\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27020v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Representation Measurements Under Function-Preserving Reparameterizations", "tldr": "\u672c\u6587\u6307\u51fa\uff0c\u7528\u4e8e\u5206\u6790\u8bed\u8a00\u6a21\u578b\u9690\u85cf\u8868\u793a\u7684\u5217\u7f6e\u6362\u5e76\u884c\u5206\u6790\u4e0d\u6ee1\u8db3\u51fd\u6570\u4fdd\u6301\u91cd\u53c2\u6570\u5316\u4e0d\u53d8\u6027\uff1a\u5373\u4f7f\u6a21\u578b\u8f93\u5165\u8f93\u51fa\u51fd\u6570\u548c\u89c2\u6d4b\u534f\u65b9\u5dee\u8c31\u4e0d\u53d8\uff0c\u53c2\u8003\u5206\u5e03\u548c\u9009\u51fa\u7684\u6210\u5206\u6570\u4e5f\u4f1a\u6539\u53d8\u3002\u5b9e\u9a8c\u663e\u793a\u8fd9\u79cd\u65b9\u6cd5\u5728\u591a\u6a21\u578b\u3001\u591a\u68c0\u7d22\u4efb\u52a1\u548c\u591a\u79cd\u53d8\u6362\u4e0b\u4ea7\u751f\u5927\u91cf\u4e0d\u4e00\u81f4\u51b3\u7b56\uff0c\u800c\u6b63\u4ea4\u4e0d\u53d8\u7684\u6bd4\u8f83\u6307\u6807\u66f4\u7a33\u5b9a\u4e14\u5224\u522b\u80fd\u529b\u76f8\u8fd1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Representation learning has attracted great atten- tion and managed to reach good performances as a pretraining method for downstream tasks or as a first step towards unsu- pervised speech modeling. Yet, little is known about how such methods deal with out-of-domain speech and how could they be adapted in a few shot to new domains. This is important especially for accented speech where one observes a long tail of accents that diverge from the standard ones. We introduce ABX- Accent, a benchmark based on the AESRC dataset that features 10 different accents of English. It includes a small (\u003c 10 hours) unlabelled training set in each of the accents and adaptations of the Zero Resources Challenge ABX evaluation metrics to each of the accents. We illustrate this benchmark with a baseline model that uses adaptive domain normalization to fine tune a pretrained Contrastive Predictive Coding model on the accents. This method is first developed on LibriSpeech using a male/female split. When applied to the new benchmark, the proposed method yields a relative improvement of 23.6% on across-speaker ABX scores on average compared to non adapted models. The data and metrics will be open sourced upon paper acceptance", "arxiv_id": "2608.26992", "arxiv_url": "https://arxiv.org/abs/2608.26992", "authors": ["Robin San Roman", "Manel Khentout", "Tu Anh Nguyen", "Paul Michel", "Yossi Adi", "Emmanuel Dupoux"], "brief": "\u8bba\u6587\u63d0\u51fa ABX-Accent \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u65e0\u76d1\u7763\u8bed\u97f3\u8868\u793a\u5728\u4e0d\u540c\u82f1\u8bed\u53e3\u97f3\u4e0a\u7684\u5feb\u901f\u9886\u57df\u9002\u5e94\u80fd\u529b\uff0c\u5305\u542b10\u79cd\u53e3\u97f3\u548c\u5c11\u91cf\u65e0\u6807\u6ce8\u8bad\u7ec3\u6570\u636e\u3002\u4f5c\u8005\u7528\u81ea\u9002\u5e94\u9886\u57df\u5f52\u4e00\u5316\u5fae\u8c03\u9884\u8bad\u7ec3 CPC \u6a21\u578b\u4f5c\u4e3a\u57fa\u7ebf\uff0c\u5728\u8de8\u8bf4\u8bdd\u4eba ABX \u6307\u6807\u4e0a\u76f8\u6bd4\u672a\u9002\u5e94\u6a21\u578b\u5e73\u5747\u76f8\u5bf9\u63d0\u534723.6%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26992", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u8868\u793a\u5b66\u4e60", "\u9886\u57df\u9002\u5e94", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u53e3\u97f3\u8bc6\u522b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26992v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Benchmarking_Fast_Domain_Adaptation_for_Unsupervised_Speech_Units", "tldr": "\u8bba\u6587\u63d0\u51fa ABX-Accent \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u65e0\u76d1\u7763\u8bed\u97f3\u8868\u793a\u5728\u4e0d\u540c\u82f1\u8bed\u53e3\u97f3\u4e0a\u7684\u5feb\u901f\u9886\u57df\u9002\u5e94\u80fd\u529b\uff0c\u5305\u542b10\u79cd\u53e3\u97f3\u548c\u5c11\u91cf\u65e0\u6807\u6ce8\u8bad\u7ec3\u6570\u636e\u3002\u4f5c\u8005\u7528\u81ea\u9002\u5e94\u9886\u57df\u5f52\u4e00\u5316\u5fae\u8c03\u9884\u8bad\u7ec3 CPC \u6a21\u578b\u4f5c\u4e3a\u57fa\u7ebf\uff0c\u5728\u8de8\u8bf4\u8bdd\u4eba ABX \u6307\u6807\u4e0a\u76f8\u6bd4\u672a\u9002\u5e94\u6a21\u578b\u5e73\u5747\u76f8\u5bf9\u63d0\u534723.6%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper investigates decentralized multitask learning over networks when the underlying task relationships are unknown. While existing graph-regularized multitask frameworks typically assume a known structure, practical settings often require learning inter-task dependencies directly from distributed data. We propose a decentralized two-phase strategy that first estimates a generalized graph Laplacian from noisy non-cooperative stochastic gradient iterates, and subsequently exploits the learned graph to enable cooperative multitask diffusion learning. This framework is motivated by a Gaussian Markov random field prior, which gives rise to a decentralized maximum likelihood estimator for the graph Laplacian. The analysis quantifies the Laplacian estimation error and its propagation to the steady-state performance of the multitask diffusion recursion, and introduces a topology sensitivity index to capture the effect of network heterogeneity. Simulation results corroborate the theoretical findings and demonstrate that cooperation enabled by the learned task graph significantly improves performance over non-cooperative learning, while approaching the true-graph baseline when the estimation stepsize is sufficiently small.", "arxiv_id": "2608.26989", "arxiv_url": "https://arxiv.org/abs/2608.26989", "authors": ["Zirui Wan", "Stefan Vlaski"], "brief": "\u672c\u6587\u7814\u7a76\u4efb\u52a1\u5173\u7cfb\u672a\u77e5\u65f6\u7684\u53bb\u4e2d\u5fc3\u5316\u591a\u4efb\u52a1\u5b66\u4e60\uff0c\u63d0\u51fa\u5148\u4ece\u5206\u5e03\u5f0f\u968f\u673a\u68af\u5ea6\u8fed\u4ee3\u4e2d\u4f30\u8ba1\u5e7f\u4e49\u56fe\u62c9\u666e\u62c9\u65af\uff0c\u518d\u5229\u7528\u5b66\u5230\u7684\u4efb\u52a1\u56fe\u8fdb\u884c\u534f\u4f5c\u6269\u6563\u5b66\u4e60\u3002\u7406\u8bba\u5206\u6790\u7ed9\u51fa\u56fe\u4f30\u8ba1\u8bef\u5dee\u53ca\u5176\u5bf9\u7a33\u6001\u6027\u80fd\u7684\u5f71\u54cd\uff0c\u4eff\u771f\u663e\u793a\u5b66\u4e60\u5230\u7684\u4efb\u52a1\u56fe\u80fd\u663e\u8457\u4f18\u4e8e\u975e\u534f\u4f5c\u5b66\u4e60\uff0c\u5e76\u5728\u5c0f\u6b65\u957f\u4e0b\u63a5\u8fd1\u771f\u5b9e\u56fe\u6027\u80fd\u3002", "categories": ["cs.LG", "eess.SP", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26989", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u4efb\u52a1\u5b66\u4e60", "\u53bb\u4e2d\u5fc3\u5316\u5b66\u4e60", "\u56fe\u5b66\u4e60", "\u6269\u6563\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26989v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Decentralized Multitask Learning over Learned Task Graphs", "tldr": "\u672c\u6587\u7814\u7a76\u4efb\u52a1\u5173\u7cfb\u672a\u77e5\u65f6\u7684\u53bb\u4e2d\u5fc3\u5316\u591a\u4efb\u52a1\u5b66\u4e60\uff0c\u63d0\u51fa\u5148\u4ece\u5206\u5e03\u5f0f\u968f\u673a\u68af\u5ea6\u8fed\u4ee3\u4e2d\u4f30\u8ba1\u5e7f\u4e49\u56fe\u62c9\u666e\u62c9\u65af\uff0c\u518d\u5229\u7528\u5b66\u5230\u7684\u4efb\u52a1\u56fe\u8fdb\u884c\u534f\u4f5c\u6269\u6563\u5b66\u4e60\u3002\u7406\u8bba\u5206\u6790\u7ed9\u51fa\u56fe\u4f30\u8ba1\u8bef\u5dee\u53ca\u5176\u5bf9\u7a33\u6001\u6027\u80fd\u7684\u5f71\u54cd\uff0c\u4eff\u771f\u663e\u793a\u5b66\u4e60\u5230\u7684\u4efb\u52a1\u56fe\u80fd\u663e\u8457\u4f18\u4e8e\u975e\u534f\u4f5c\u5b66\u4e60\uff0c\u5e76\u5728\u5c0f\u6b65\u957f\u4e0b\u63a5\u8fd1\u771f\u5b9e\u56fe\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Landscapes are named, but whether names retain measurable environmental information beyond broad geographic structure is rarely tested. We analysed 3,757 Welsh settlements using a frozen, source-audited 24-element lexical framework, preregistered outcome-specific models and geographically structured validation. The central comparison contrasted 101 settlements carrying high-terrain elements (\\textit{bryn} or \\textit{mynydd}) with 139 carrying low-terrain elements (\\textit{cwm} or \\textit{pant}). High-terrain names occupied locations 24.4 m higher relative to their 2-km surroundings (95\\% CI, 10.8--38.1 m; Holm-adjusted $p$ = 0.00137). The association remained positive across prespecified 1-, 2- and 5-km neighbourhood definitions and was reproduced using an independently produced elevation source (24.1 m; 95\\% CI, 10.6--37.6 m). Adding terrain-name polarity to a non-lexical spatial and settlement baseline reduced geographically held-out mean squared error by 4.63\\%, 6.22\\% and 7.30\\% under 10-, 25- and 50-km spatial blocking, respectively, although improvement varied among held-out regions. River-related names provided weaker, directionally consistent evidence, while the preregistered woodland model was non-estimable. Residual spatial structure, unresolved name language and the absence of independent external replication limit interpretation. Selected Welsh settlement-name categories therefore retain measurable information about present-day terrain within Wales, without establishing individual etymology, causal naming, historical environmental memory or transferability to other naming systems.", "arxiv_id": "2608.26978", "arxiv_url": "https://arxiv.org/abs/2608.26978", "authors": ["Oktay Karaku\u015f", "Can Eyupoglu"], "brief": "\u7814\u7a76\u5206\u6790\u4e863757\u4e2a\u5a01\u5c14\u58eb\u805a\u843d\u540d\u79f0\uff0c\u68c0\u9a8c\u5730\u540d\u4e2d\u7684\u9ad8\u5730\u3001\u4f4e\u5730\u7b49\u8bcd\u7d20\u662f\u5426\u4ecd\u5305\u542b\u53ef\u6d4b\u91cf\u7684\u73af\u5883\u4fe1\u606f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u542b\u9ad8\u5730\u8bcd\u7d20\u7684\u5730\u540d\u76f8\u5bf9\u5468\u8fb9\u5730\u5f62\u663e\u8457\u66f4\u9ad8\uff0c\u5e76\u80fd\u5728\u5730\u7406\u5206\u5757\u9a8c\u8bc1\u4e2d\u5c0f\u5e45\u964d\u4f4e\u6d77\u62d4\u9884\u6d4b\u8bef\u5dee\uff0c\u4f46\u7ed3\u8bba\u53d7\u6b8b\u4f59\u7a7a\u95f4\u7ed3\u6784\u3001\u8bed\u8a00\u6765\u6e90\u4e0d\u660e\u548c\u7f3a\u4e4f\u5916\u90e8\u590d\u73b0\u9650\u5236\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26978", "impact_score": 3, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u7136\u8bed\u8a00\u5904\u7406", "\u5730\u7406\u7a7a\u95f4\u5206\u6790", "\u5730\u540d\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26978v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Terrain signatures in Welsh settlement names", "tldr": "\u7814\u7a76\u5206\u6790\u4e863757\u4e2a\u5a01\u5c14\u58eb\u805a\u843d\u540d\u79f0\uff0c\u68c0\u9a8c\u5730\u540d\u4e2d\u7684\u9ad8\u5730\u3001\u4f4e\u5730\u7b49\u8bcd\u7d20\u662f\u54
