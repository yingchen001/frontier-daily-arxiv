26\u4ecd\u5305\u542b\u53ef\u6d4b\u91cf\u7684\u73af\u5883\u4fe1\u606f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u542b\u9ad8\u5730\u8bcd\u7d20\u7684\u5730\u540d\u76f8\u5bf9\u5468\u8fb9\u5730\u5f62\u663e\u8457\u66f4\u9ad8\uff0c\u5e76\u80fd\u5728\u5730\u7406\u5206\u5757\u9a8c\u8bc1\u4e2d\u5c0f\u5e45\u964d\u4f4e\u6d77\u62d4\u9884\u6d4b\u8bef\u5dee\uff0c\u4f46\u7ed3\u8bba\u53d7\u6b8b\u4f59\u7a7a\u95f4\u7ed3\u6784\u3001\u8bed\u8a00\u6765\u6e90\u4e0d\u660e\u548c\u7f3a\u4e4f\u5916\u90e8\u590d\u73b0\u9650\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Kernels measure similarity or correlation in tasks such as regression and classification. The Gaussian kernel, other names of which include squared exponential and radial basis function kernel, is one of the most popular in Gaussian process regression. We argue that the Gaussian kernel is best avoided and should never be used as a default. The argument rests on two results demonstrating that the Gaussian kernel is extremely brittle. First, the Gaussian kernel gives rise to a conditional variance that is unrealistically small. If the variance is used to quantify predictive uncertainty, catastrophic overconfidence is almost inevitable. Second, a small variance goes hand in hand with numerical ill-conditioning, so that to use the Gaussian kernel in practice requires tricks such as nugget terms that effectively modify the underlying regression or classification model. These problems are caused by the unnatural smoothness of the Gaussian kernel, a fact we are far from the first to take notice of. The problem is not the Gaussian form itself but the analyticity of the kernel: Our argument is more broadly that analytic kernels are best avoided. For stationary kernels analyticity is essentially equivalent to an exponential decay of the spectral density.", "arxiv_id": "2608.26974", "arxiv_url": "https://arxiv.org/abs/2608.26974", "authors": ["Toni Karvonen", "Chris J. Oates"], "brief": "\u672c\u6587\u4ece\u7406\u8bba\u4e0a\u8bba\u8bc1\u9ad8\u65af\u6838\u4e0d\u5e94\u4f5c\u4e3a\u9ad8\u65af\u8fc7\u7a0b\u56de\u5f52\u7b49\u4efb\u52a1\u7684\u9ed8\u8ba4\u9009\u62e9\u3002\u4f5c\u8005\u6307\u51fa\u5176\u89e3\u6790\u6027\u4f1a\u5bfc\u81f4\u6761\u4ef6\u65b9\u5dee\u5f02\u5e38\u504f\u5c0f\u3001\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027\u4e25\u91cd\u8fc7\u5ea6\u81ea\u4fe1\uff0c\u5e76\u4f34\u968f\u6570\u503c\u75c5\u6001\uff0c\u5b9e\u9645\u4e2d\u5e38\u9700\u901a\u8fc7 nugget \u7b49\u6280\u5de7\u53d8\u76f8\u4fee\u6539\u6a21\u578b\u3002", "categories": ["stat.ML", "cs.LG", "math.NA", "math.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26974", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6838\u65b9\u6cd5", "\u9ad8\u65af\u8fc7\u7a0b", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u6570\u503c\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26974v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Why not to use the Gaussian kernel", "tldr": "\u672c\u6587\u4ece\u7406\u8bba\u4e0a\u8bba\u8bc1\u9ad8\u65af\u6838\u4e0d\u5e94\u4f5c\u4e3a\u9ad8\u65af\u8fc7\u7a0b\u56de\u5f52\u7b49\u4efb\u52a1\u7684\u9ed8\u8ba4\u9009\u62e9\u3002\u4f5c\u8005\u6307\u51fa\u5176\u89e3\u6790\u6027\u4f1a\u5bfc\u81f4\u6761\u4ef6\u65b9\u5dee\u5f02\u5e38\u504f\u5c0f\u3001\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027\u4e25\u91cd\u8fc7\u5ea6\u81ea\u4fe1\uff0c\u5e76\u4f34\u968f\u6570\u503c\u75c5\u6001\uff0c\u5b9e\u9645\u4e2d\u5e38\u9700\u901a\u8fc7 nugget \u7b49\u6280\u5de7\u53d8\u76f8\u4fee\u6539\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pre-training under limited data requires a different view of scaling than web-scale language modeling. With a fixed data budget but relatively abundant compute, increasing parameter count helps only up to an optimal scale; beyond that point, models overfit and generalization worsens. We study this behavior across 10M-100M word pre-training budgets, two corpora, and multiple downstream evaluations, and find that optimal size depends strongly on both the data budget and the downstream target. We argue that standard Transformers scale down poorly to this setting, because embeddings consume a large fraction of the parameter budget and per-token computation is tied to representational capacity. To address this coupling, we study recursive Transformers, reusing a shared block across depth to scale compute, together with factorized embeddings to reduce vocabulary-map parameters. We train three recursive models and find that they outperform standard Transformers at 10M and 100M words, while remaining competitive with BabyLM Challenge 2025 winners.", "arxiv_id": "2608.26973", "arxiv_url": "https://arxiv.org/abs/2608.26973", "authors": ["Serdar G\u00fclbahar", "Lukas Edman", "Alexander Fraser"], "brief": "\u672c\u6587\u7814\u7a76\u6709\u9650\u9884\u8bad\u7ec3\u6570\u636e\u4e0b\u7684\u8bed\u8a00\u6a21\u578b\u7f29\u653e\u89c4\u5f8b\uff0c\u53d1\u73b0\u53c2\u6570\u89c4\u6a21\u5b58\u5728\u6700\u4f18\u70b9\uff0c\u8fc7\u5927\u6a21\u578b\u4f1a\u8fc7\u62df\u5408\u4e14\u4e0b\u6e38\u8868\u73b0\u4e0b\u964d\u3002\u4f5c\u8005\u63d0\u51fa\u4f7f\u7528\u9012\u5f52 Transformer \u5171\u4eab\u6df1\u5c42\u6a21\u5757\u5e76\u7ed3\u5408\u56e0\u5b50\u5316\u5d4c\u5165\uff0c\u5728 1000\u4e07\u52301\u4ebf\u8bcd\u6570\u636e\u89c4\u6a21\u4e0a\u4f18\u4e8e\u6807\u51c6 Transformer\uff0c\u5e76\u63a5\u8fd1 BabyLM 2025 \u4f18\u80dc\u6a21\u578b\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26973", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "Transformer", "\u6570\u636e\u6548\u7387", "\u6a21\u578b\u7f29\u653e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26973v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Squeezing More from Limited Data with Recursive Transformers", "tldr": "\u672c\u6587\u7814\u7a76\u6709\u9650\u9884\u8bad\u7ec3\u6570\u636e\u4e0b\u7684\u8bed\u8a00\u6a21\u578b\u7f29\u653e\u89c4\u5f8b\uff0c\u53d1\u73b0\u53c2\u6570\u89c4\u6a21\u5b58\u5728\u6700\u4f18\u70b9\uff0c\u8fc7\u5927\u6a21\u578b\u4f1a\u8fc7\u62df\u5408\u4e14\u4e0b\u6e38\u8868\u73b0\u4e0b\u964d\u3002\u4f5c\u8005\u63d0\u51fa\u4f7f\u7528\u9012\u5f52 Transformer \u5171\u4eab\u6df1\u5c42\u6a21\u5757\u5e76\u7ed3\u5408\u56e0\u5b50\u5316\u5d4c\u5165\uff0c\u5728 1000\u4e07\u52301\u4ebf\u8bcd\u6570\u636e\u89c4\u6a21\u4e0a\u4f18\u4e8e\u6807\u51c6 Transformer\uff0c\u5e76\u63a5\u8fd1 BabyLM 2025 \u4f18\u80dc\u6a21\u578b\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Place names provide persistent records of how landscapes have been described and organised, but their quantitative reuse requires explicit separation between mapped places, lexical annotations and environmental measurements. TEMPLAR Wales is a georeferenced environmental-toponymy dataset comprising 3,757 settlement records across Wales. The resource links a reproducible settlement frame to deterministic lexical screening and settlement-level environmental attributes through stable identifiers. It contains 1,350 lexical detections across 1,294 settlements, generated from a frozen registry of 24 Welsh place-name elements, while retaining exact- and prefix-token matches and their provenance separately. Environmental attributes describe river and coastal proximity, elevation and local terrain context at multiple spatial scales, land cover and neighbourhood woody cover, with parallel terrain measurements derived from independent elevation products. The dataset is distributed as four relational tables accompanied by a field-level data dictionary, source-provenance register and licensing metadata. Technical validation confirms relational integrity, deterministic lexical reconstruction, documented environmental coverage, strong agreement between independent terrain sources and reproducible reconstruction of the frozen release. TEMPLAR Wales provides a reusable foundation for research in toponymy, linguistic geography, historical and environmental landscape studies, GIS and spatial data analysis without treating computational lexical detections as verified etymologies or contemporary environmental measurements as historical landscape reconstructions.", "arxiv_id": "2608.26970", "arxiv_url": "https://arxiv.org/abs/2608.26970", "authors": ["Oktay Karaku\u015f", "Can Eyupoglu"], "brief": "TEMPLAR Wales \u6784\u5efa\u4e86\u4e00\u4e2a\u8986\u76d6\u5a01\u5c14\u58eb 3,757 \u4e2a\u805a\u843d\u7684\u5730\u7406\u53c2\u7167\u73af\u5883\u4e0e\u5730\u540d\u6570\u636e\u96c6\uff0c\u5c06\u805a\u843d\u4f4d\u7f6e\u3001\u5730\u540d\u8bcd\u6c47\u7b5b\u67e5\u7ed3\u679c\u548c\u591a\u5c3a\u5ea6\u73af\u5883\u5c5e\u6027\u901a\u8fc7\u7a33\u5b9a\u6807\u8bc6\u7b26\u5173\u8054\u3002\u6570\u636e\u5305\u542b 24 \u4e2a\u5a01\u5c14\u58eb\u5730\u540d\u5143\u7d20\u7684\u786e\u5b9a\u6027\u68c0\u6d4b\u3001\u6cb3\u6d41/\u6d77\u5cb8\u8ddd\u79bb\u3001\u6d77\u62d4\u3001\u5730\u5f62\u3001\u571f\u5730\u8986\u76d6\u7b49\u4fe1\u606f\uff0c\u5e76\u63d0\u4f9b\u5173\u7cfb\u8868\u3001\u6570\u636e\u5b57\u5178\u548c\u6eaf\u6e90\u5143\u6570\u636e\uff0c\u9a8c\u8bc1\u663e\u793a\u53ef\u590d\u73b0\u6027\u548c\u6570\u636e\u4e00\u81f4\u6027\u826f\u597d\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26970", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5730\u7406\u6570\u636e\u96c6", "\u5730\u540d\u5b66", "\u7a7a\u95f4\u6570\u636e\u5206\u6790", "\u8bed\u8a00\u5730\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26970v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TEMPLAR Wales: A georeferenced environmental and toponymic dataset of Welsh settlements", "tldr": "TEMPLAR Wales \u6784\u5efa\u4e86\u4e00\u4e2a\u8986\u76d6\u5a01\u5c14\u58eb 3,757 \u4e2a\u805a\u843d\u7684\u5730\u7406\u53c2\u7167\u73af\u5883\u4e0e\u5730\u540d\u6570\u636e\u96c6\uff0c\u5c06\u805a\u843d\u4f4d\u7f6e\u3001\u5730\u540d\u8bcd\u6c47\u7b5b\u67e5\u7ed3\u679c\u548c\u591a\u5c3a\u5ea6\u73af\u5883\u5c5e\u6027\u901a\u8fc7\u7a33\u5b9a\u6807\u8bc6\u7b26\u5173\u8054\u3002\u6570\u636e\u5305\u542b 24 \u4e2a\u5a01\u5c14\u58eb\u5730\u540d\u5143\u7d20\u7684\u786e\u5b9a\u6027\u68c0\u6d4b\u3001\u6cb3\u6d41/\u6d77\u5cb8\u8ddd\u79bb\u3001\u6d77\u62d4\u3001\u5730\u5f62\u3001\u571f\u5730\u8986\u76d6\u7b49\u4fe1\u606f\uff0c\u5e76\u63d0\u4f9b\u5173\u7cfb\u8868\u3001\u6570\u636e\u5b57\u5178\u548c\u6eaf\u6e90\u5143\u6570\u636e\uff0c\u9a8c\u8bc1\u663e\u793a\u53ef\u590d\u73b0\u6027\u548c\u6570\u636e\u4e00\u81f4\u6027\u826f\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper introduces ClusterAttention, a general training-free speedup of bidirectional attention layers. Existing sparse attention methods either rely on structure in the input, such as order in language or spatial proximity in images, or use slow clustering processes amortized over several forward passes. ClusterAttention instead uses a fast recursive clustering method that adapts to the geometry of the keys and queries in each attention head to produce useful clusters. This method allows setting the size of the clusters arbitrarily. We utilize this by setting all clusters to be a fixed size that is a power of two, allowing the block-sparse attention to run at the same latency per query-key interaction as dense attention on GPUs. We also derive an expression for the output error in sparse attention, that explains the counterintuitive experimental finding that tight clusters can lead to larger errors than random clusters. We then derive the error when excluded clusters are compensated through their centroids, and show that this error shrinks with tighter clusters. We integrate this compensation into the method. On large-scale tabular data ClusterAttention speeds up TabPFN-3 arXiv:2605.13986 by two to six times, while retaining at least 99% of the dense accuracy. To our knowledge, it is the first training-free method that can be successfully applied in the setting of unstructured input and a single forward pass. For video generation with Wan 2.1-14B T2V arXiv:2503.20314 , ClusterAttention achieves output closer to dense attention and a larger speedup (1.8x versus 1.4x) compared to SVOO arXiv:2603.18636 , a leading method developed specifically for this domain, both run without offline calibration.", "arxiv_id": "2608.26965", "arxiv_url": "https://arxiv.org/abs/2608.26965", "authors": ["Kasper Nordenram", "Amelie Dittmann"], "brief": "\u8bba\u6587\u63d0\u51fa ClusterAttention\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u53cc\u5411\u6ce8\u610f\u529b\u52a0\u901f\u65b9\u6cd5\uff0c\u901a\u8fc7\u5feb\u901f\u9012\u5f52\u805a\u7c7b\u4e3a\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u81ea\u9002\u5e94\u751f\u6210\u56fa\u5b9a\u5927\u5c0f\u7c07\uff0c\u5e76\u7ed3\u5408\u8d28\u5fc3\u8865\u507f\u964d\u4f4e\u7a00\u758f\u6ce8\u610f\u529b\u8bef\u5dee\u3002\u5b83\u5728\u975e\u7ed3\u6784\u5316\u8f93\u5165\u548c\u5355\u6b21\u524d\u5411\u573a\u666f\u4e2d\u6709\u6548\uff1aTabPFN-3 \u52a0\u901f 2-6 \u500d\u4e14\u4fdd\u6301\u81f3\u5c11 99% \u7cbe\u5ea6\uff0c\u89c6\u9891\u751f\u6210\u4e2d\u76f8\u6bd4\u4e13\u7528\u65b9\u6cd5\u83b7\u5f97\u66f4\u63a5\u8fd1\u7a20\u5bc6\u6ce8\u610f\u529b\u7684\u8f93\u51fa\u548c\u66f4\u9ad8\u52a0\u901f\u6bd4\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26965", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u7a00\u758f\u6ce8\u610f\u529b", "\u6a21\u578b\u52a0\u901f", "\u805a\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26965v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ClusterAttention: A training-free speedup of bidirectional attention", "tldr": "\u8bba\u6587\u63d0\u51fa ClusterAttention\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u53cc\u5411\u6ce8\u610f\u529b\u52a0\u901f\u65b9\u6cd5\uff0c\u901a\u8fc7\u5feb\u901f\u9012\u5f52\u805a\u7c7b\u4e3a\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u81ea\u9002\u5e94\u751f\u6210\u56fa\u5b9a\u5927\u5c0f\u7c07\uff0c\u5e76\u7ed3\u5408\u8d28\u5fc3\u8865\u507f\u964d\u4f4e\u7a00\u758f\u6ce8\u610f\u529b\u8bef\u5dee\u3002\u5b83\u5728\u975e\u7ed3\u6784\u5316\u8f93\u5165\u548c\u5355\u6b21\u524d\u5411\u573a\u666f\u4e2d\u6709\u6548\uff1aTabPFN-3 \u52a0\u901f 2-6 \u500d\u4e14\u4fdd\u6301\u81f3\u5c11 99% \u7cbe\u5ea6\uff0c\u89c6\u9891\u751f\u6210\u4e2d\u76f8\u6bd4\u4e13\u7528\u65b9\u6cd5\u83b7\u5f97\u66f4\u63a5\u8fd1\u7a20\u5bc6\u6ce8\u610f\u529b\u7684\u8f93\u51fa\u548c\u66f4\u9ad8\u52a0\u901f\u6bd4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "12-lead electrocardiogram (ECG) is a standard, non-invasive examination widely used for diagnosing coronary artery disease, where clinical interpretation relies on comparing waveform patterns across multiple leads. However, most existing ECG analysis methods focus on single-lead signals or treat each lead independently, and typically process ECG signals as one-dimensional time-series data using CNNs or RNNs. While effective in modeling local waveform changes, such approaches have difficulty capturing inter-lead dependency and global waveform patterns essential for clinical diagnosis. To address this limitation, we propose a graph-based pseudo-multimodal contrastive learning framework called Graph-CMMC. ECG waveforms are transformed into Gramian Angular Difference Field (GADF) images to construct complementary representations of the same cardiac activity, enabling a pseudo-multimodal learning setting. Using all 12 leads, Graph-CMMC aligns waveform and GADF representations in a self-supervised manner, while a graph-based relational module is employed to model inter-lead dependency and enforce structural consistency across leads during contrastive learning. Experimental results on a multi-label coronary artery occlusion classification task demonstrate that the proposed framework achieves competitive performance compared to supervised learning methods. These results further suggest the effectiveness of using GADF as a complementary representation and incorporating explicit graph-based modeling of inter-lead dependency for learning robust 12-lead ECG representations.", "arxiv_id": "2608.26964", "arxiv_url": "https://arxiv.org/abs/2608.26964", "authors": ["Mengyu Wang", "Kozo Okada", "Takafumi Goto", "Natsuko Jinba", "Hiroki Yamaya", "Kiyoshi Hibi", "Tomoki Hamagami"], "brief": "\u672c\u6587\u63d0\u51fa Graph-CMMC\uff0c\u5c0612\u5bfc\u8054\u5fc3\u7535\u4fe1\u53f7\u8f6c\u6362\u4e3aGADF\u56fe\u50cf\uff0c\u6784\u9020\u6ce2\u5f62\u4e0e\u56fe\u50cf\u7684\u4f2a\u591a\u6a21\u6001\u81ea\u76d1\u7763\u5bf9\u6bd4\u5b66\u4e60\u6846\u67b6\u3002\u65b9\u6cd5\u901a\u8fc7\u56fe\u5173\u7cfb\u6a21\u5757\u663e\u5f0f\u5efa\u6a21\u5bfc\u8054\u95f4\u4f9d\u8d56\uff0c\u5728\u51a0\u72b6\u52a8\u8109\u95ed\u585e\u591a\u6807\u7b7e\u5206\u7c7b\u4efb\u52a1\u4e0a\u8fbe\u5230\u63a5\u8fd1\u76d1\u7763\u5b66\u4e60\u7684\u7ade\u4e89\u6027\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26964", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u5bf9\u6bd4\u5b66\u4e60", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u5fc3\u7535\u4fe1\u53f7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26964v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Graph-Based Pseudo-multimodal Contrastive Learning for 12-Lead ECG Representations", "tldr": "\u672c\u6587\u63d0\u51fa Graph-CMMC\uff0c\u5c0612\u5bfc\u8054\u5fc3\u7535\u4fe1\u53f7\u8f6c\u6362\u4e3aGADF\u56fe\u50cf\uff0c\u6784\u9020\u6ce2\u5f62\u4e0e\u56fe\u50cf\u7684\u4f2a\u591a\u6a21\u6001\u81ea\u76d1\u7763\u5bf9\u6bd4\u5b66\u4e60\u6846\u67b6\u3002\u65b9\u6cd5\u901a\u8fc7\u56fe\u5173\u7cfb\u6a21\u5757\u663e\u5f0f\u5efa\u6a21\u5bfc\u8054\u95f4\u4f9d\u8d56\uff0c\u5728\u51a0\u72b6\u52a8\u8109\u95ed\u585e\u591a\u6807\u7b7e\u5206\u7c7b\u4efb\u52a1\u4e0a\u8fbe\u5230\u63a5\u8fd1\u76d1\u7763\u5b66\u4e60\u7684\u7ade\u4e89\u6027\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This work concerns adversarial training against the small-norm adversarial examples that arise from the inherent input instability of a trained deep neural network. Examples in this class are small as measured in the relative $\\ell^2$-norm, and therefore lie in the neighborhood of the input on which the model acts approximately linearly, the regime in which the perturbation remains imperceptible. We first show that such examples can be computed directly from the trained network parameters, without input gradient iterations, by means of a linearization called the low-rank Householder expansion (LRHE). The expansion describes the composed affine map rather than any individual layer, and the directions it identifies are read from the activation pattern already available in the forward pass. We then propose a simple adversarial training scheme built on this construction. No differentiation with respect to the input is performed at any point: training requires only additional forward evaluations, with weight parameters updated by the standard backward pass, and the inner maximization of the usual min-max formulation is eliminated entirely. That such a regularizer exists is our main finding: the methods that dispense with the inner search all obtain their local geometry by differentiating with respect to the input, and we show this is not necessary. The regularizer costs the equivalent of $2.8$ PGD steps per epoch, an $8.7\\times$ reduction relative to 40-step adversarial training on MNIST and below the cost of 3-step training. The resulting models match three-step PGD adversarial training for relative $\\ell^2$ budgets $\\varepsilon \\le 0.02$ and 40-step training for $\\varepsilon \\le 0.012$, falling away beyond, consistent with the locality of the expansion.", "arxiv_id": "2608.26963", "arxiv_url": "https://arxiv.org/abs/2608.26963", "authors": ["Tiana C. Johnson", "Donsub Rim"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u4f4e\u79e9 Householder \u5c55\u5f00\uff08LRHE\uff09\u4ece\u524d\u5411\u4f20\u64ad\u7684\u6fc0\u6d3b\u6a21\u5f0f\u4e2d\u76f4\u63a5\u5f97\u5230\u5c40\u90e8\u5bf9\u6297\u65b9\u5411\uff0c\u65e0\u9700\u5bf9\u8f93\u5165\u6c42\u68af\u5ea6\u6216\u8fdb\u884c PGD \u5185\u5c42\u641c\u7d22\u3002\u57fa\u4e8e\u6b64\u7684\u5bf9\u6297\u8bad\u7ec3\u53ea\u9700\u989d\u5916\u524d\u5411\u8ba1\u7b97\u548c\u6807\u51c6\u53cd\u5411\u4f20\u64ad\uff0c\u5728 MNIST \u4e0a\u6210\u672c\u7ea6\u4e3a\u6bcf\u8f6e 2.8 \u4e2a PGD \u6b65\uff0c\u663e\u8457\u4f4e\u4e8e 40 \u6b65\u8bad\u7ec3\uff0c\u5e76\u5728\u5c0f\u76f8\u5bf9 L2 \u6270\u52a8\u8303\u56f4\u5185\u8fbe\u5230\u63a5\u8fd1 3 \u6b65\u6216 40 \u6b65 PGD \u5bf9\u6297\u8bad\u7ec3\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26963", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5bf9\u6297\u8bad\u7ec3", "\u9c81\u68d2\u6027", "\u4f4e\u79e9\u5206\u89e3", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26963v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Adversarial Training Without Input Gradients via Low-Rank Householder Expansions", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u4f4e\u79e9 Householder \u5c55\u5f00\uff08LRHE\uff09\u4ece\u524d\u5411\u4f20\u64ad\u7684\u6fc0\u6d3b\u6a21\u5f0f\u4e2d\u76f4\u63a5\u5f97\u5230\u5c40\u90e8\u5bf9\u6297\u65b9\u5411\uff0c\u65e0\u9700\u5bf9\u8f93\u5165\u6c42\u68af\u5ea6\u6216\u8fdb\u884c PGD \u5185\u5c42\u641c\u7d22\u3002\u57fa\u4e8e\u6b64\u7684\u5bf9\u6297\u8bad\u7ec3\u53ea\u9700\u989d\u5916\u524d\u5411\u8ba1\u7b97\u548c\u6807\u51c6\u53cd\u5411\u4f20\u64ad\uff0c\u5728 MNIST \u4e0a\u6210\u672c\u7ea6\u4e3a\u6bcf\u8f6e 2.8 \u4e2a PGD \u6b65\uff0c\u663e\u8457\u4f4e\u4e8e 40 \u6b65\u8bad\u7ec3\uff0c\u5e76\u5728\u5c0f\u76f8\u5bf9 L2 \u6270\u52a8\u8303\u56f4\u5185\u8fbe\u5230\u63a5\u8fd1 3 \u6b65\u6216 40 \u6b65 PGD \u5bf9\u6297\u8bad\u7ec3\u7684\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Molecular crystal structure prediction (CSP) is important in pharmaceuticals, agrochemicals, and organic electronics, where subtle differences in molecular conformation and packing can strongly affect material properties. We present Packora, a flow-based generative model for molecular CSP that jointly predicts atomic coordinates and the lattice from molecular graphs. Packora supports multi-component and organometallic crystals and can condition on any subset of molecular conformers, stereochemical labels, and space-group information within a single model. Inspired by the CCDC CSP blind test, we evaluate generation and ranking separately, using generation to isolate generator quality and ranking to measure end-to-end performance under a common relaxation and ranking pipeline. We also systematically study architecture, training, conditioning, inference, and scaling, identifying an effective design based on cacheable pairwise reasoning, training objective and numerical solver choices, conditioning dropout, and balanced scaling of pairwise and single representations. Packora outperforms the baselines on both structure generation and ranking benchmarks, achieving the best matched-budget coverage across all six generation benchmarks, as well as higher experimental-form recovery, lower experimental-form ranks, and faster convergence in ranking.", "arxiv_id": "2608.26962", "arxiv_url": "https://arxiv.org/abs/2608.26962", "authors": ["Nayoung Kim", "Kiyoung Seong", "Sungsoo Ahn"], "brief": "Packora \u662f\u4e00\u79cd\u57fa\u4e8e\u6d41\u7684\u751f\u6210\u6a21\u578b\uff0c\u7528\u4e8e\u4ece\u5206\u5b50\u56fe\u8054\u5408\u9884\u6d4b\u5206\u5b50\u6676\u4f53\u7684\u539f\u5b50\u5750\u6807\u4e0e\u6676\u683c\uff0c\u5e76\u652f\u6301\u591a\u7ec4\u5206\u3001\u6709\u673a\u91d1\u5c5e\u6676\u4f53\u4ee5\u53ca\u6784\u8c61\u3001\u624b\u6027\u3001\u7a7a\u95f4\u7fa4\u7b49\u7075\u6d3b\u6761\u4ef6\u8f93\u5165\u3002\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u6a21\u578b\u67b6\u6784\u3001\u8bad\u7ec3\u3001\u6761\u4ef6\u5316\u3001\u63a8\u7406\u4e0e\u89c4\u6a21\u5316\u8bbe\u8ba1\uff0c\u5728\u7ed3\u6784\u751f\u6210\u548c\u6392\u5e8f\u57fa\u51c6\u4e0a\u5747\u4f18\u4e8e\u73b0\u6709\u57fa\u7ebf\uff0c\u8986\u76d6\u7387\u66f4\u9ad8\u3001\u5b9e\u9a8c\u7ed3\u6784\u6062\u590d\u66f4\u597d\u4e14\u6392\u5e8f\u6536\u655b\u66f4\u5feb\u3002", "categories": ["cs.LG", "cond-mat.mtrl-sci"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26962", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u6a21\u578b", "\u5206\u5b50\u6676\u4f53\u9884\u6d4b", "\u6750\u6599\u79d1\u5b66", "\u6d41\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26962v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Packora: Systematic Design for Generative Molecular Crystal Structure Prediction", "tldr": "Packora \u662f\u4e00\u79cd\u57fa\u4e8e\u6d41\u7684\u751f\u6210\u6a21\u578 cture-aware couplings substantially improve sample quality at small integration budgets, while our scaled-up molecular models remain competitive under conventional many-step sampling.", "arxiv_id": "2608.26961", "arxiv_url": "https://arxiv.org/abs/2608.26961", "authors": ["Moritz Piening", "Christian Wald"], "brief": "\u672c\u6587\u5c06\u6d41\u5339\u914d\u4e2d\u7684\u56fe\u751f\u6210\u653e\u5230\u8282\u70b9\u7f6e\u6362\u4e0d\u53d8\u7684\u5546\u7a7a\u95f4\u51e0\u4f55\u4e0b\uff0c\u4f7f\u7528 Gromov-Monge \u8ddd\u79bb\u6765\u6784\u9020\u66f4\u7b26\u5408\u56fe\u540c\u6784\u7ed3\u6784\u7684\u6e90-\u76ee\u6807\u8026\u5408\uff0c\u5e76\u8bc1\u660e\u5176\u53ef\u63d0\u5347\u4e3a\u5bf9\u9f50\u8868\u793a\u4e14\u53ef\u5f97\u5230\u7b49\u53d8\u6700\u4f18\u89e3\u3002\u5b9e\u8df5\u4e2d\u901a\u8fc7 Gromov-Wasserstein \u677e\u5f1b\u7b49\u9ad8\u6548\u8fd1\u4f3c\u6784\u9020\u5c0f\u6279\u91cf\u8026\u5408\uff0c\u4ec5\u6539\u53d8\u8bad\u7ec3\u8026\u5408\u5373\u53ef\u517c\u5bb9\u6807\u51c6\u7f6e\u6362\u7b49\u53d8\u67b6\u6784\uff0c\u5728\u5c11\u6b65\u91c7\u6837\u4e0b\u663e\u8457\u63d0\u5347\u56fe\u548c\u5206\u5b50\u751f\u6210\u8d28\u91cf\uff0c\u591a\u6b65\u91c7\u6837\u65f6\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["cs.LG", "math.OC", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26961", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u751f\u6210", "\u6d41\u5339\u914d", "\u7b49\u53d8\u5b66\u4e60", "\u6700\u4f18\u4f20\u8f93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26961v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Gromov-Monge Flow Matching for Equivariant Graph Generation", "tldr": "\u672c\u6587\u5c06\u6d41\u5339\u914d\u4e2d\u7684\u56fe\u751f\u6210\u653e\u5230\u8282\u70b9\u7f6e\u6362\u4e0d\u53d8\u7684\u5546\u7a7a\u95f4\u51e0\u4f55\u4e0b\uff0c\u4f7f\u7528 Gromov-Monge \u8ddd\u79bb\u6765\u6784\u9020\u66f4\u7b26\u5408\u56fe\u540c\u6784\u7ed3\u6784\u7684\u6e90-\u76ee\u6807\u8026\u5408\uff0c\u5e76\u8bc1\u660e\u5176\u53ef\u63d0\u5347\u4e3a\u5bf9\u9f50\u8868\u793a\u4e14\u53ef\u5f97\u5230\u7b49\u53d8\u6700\u4f18\u89e3\u3002\u5b9e\u8df5\u4e2d\u901a\u8fc7 Gromov-Wasserstein \u677e\u5f1b\u7b49\u9ad8\u6548\u8fd1\u4f3c\u6784\u9020\u5c0f\u6279\u91cf\u8026\u5408\uff0c\u4ec5\u6539\u53d8\u8bad\u7ec3\u8026\u5408\u5373\u53ef\u517c\u5bb9\u6807\u51c6\u7f6e\u6362\u7b49\u53d8\u67b6\u6784\uff0c\u5728\u5c11\u6b65\u91c7\u6837\u4e0b\u663e\u8457\u63d0\u5347\u56fe\u548c\u5206\u5b50\u751f\u6210\u8d28\u91cf\uff0c\u591a\u6b65\u91c7\u6837\u65f6\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scaling model-generated data is usually viewed as improving distillation: more examples should increase coverage, reduce noise, and produce stronger students. We show a second effect: larger datasets can make subtle teacher-specific signals easier to detect in the trained student, even when examples are off-task and never mention the trait. In a controlled setup inspired by subliminal learning, a teacher induced to express a target trait generates restricted off-task data, such as number-only completions. Students trained on different amounts of independent off-task data are evaluated in a separate domain, with matched no-trait controls isolating target-specific transfer. Our main finding is that larger independent datasets make the teacher\u0027s induced trait stand out more clearly in the student\u0027s later behavior. Other plausible traits may also strengthen with scale, but the target usually grows more. When the small-scale student already favors the target, scaling mainly amplifies that behavior; when it favors a related or salient alternative, more data can shift behavior toward the intended trait. Analyses of learned LoRA updates show a parallel trend. These effects appear across model families, trait types, multi-trait settings, and cross-model transfer. Our results suggest that scaling generated distillation data should be paired with trait-aware curation and evaluation, even when the data appears off-task or benign.", "arxiv_id": "2608.26958", "arxiv_url": "https://arxiv.org/abs/2608.26958", "authors": ["Zhichen Dong", "Zhixuan Liu", "Yuyu Fan", "Xiangtian Li", "Shuyang Zhang", "Chao Yang"], "brief": "\u8bba\u6587\u7814\u7a76\u6a21\u578b\u751f\u6210\u6570\u636e\u7528\u4e8e\u84b8\u998f\u65f6\u7684\u9690\u6027\u98ce\u9669\uff1a\u5373\u4f7f\u6570\u636e\u662f\u79bb\u4efb\u52a1\u7684\u3001\u770b\u4f3c\u65e0\u5bb3\u7684\u5185\u5bb9\uff0c\u6269\u5927\u6570\u636e\u89c4\u6a21\u4e5f\u4f1a\u8ba9\u6559\u5e08\u6a21\u578b\u4e2d\u88ab\u8bf1\u5bfc\u51fa\u7684\u7279\u5b9a\u201c\u7279\u8d28\u201d\u66f4\u5bb9\u6613\u8fc1\u79fb\u5e76\u4f53\u73b0\u5728\u5b66\u751f\u6a21\u578b\u884c\u4e3a\u4e2d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u8fd9\u4e00\u73b0\u8c61\u8de8\u6a21\u578b\u5bb6\u65cf\u3001\u7279\u8d28\u7c7b\u578b\u3001\u591a\u7279\u8d28\u8bbe\u7f6e\u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u5747\u5b58\u5728\uff0c\u63d0\u793a\u5927\u89c4\u6a21\u84b8\u998f\u6570\u636e\u9700\u8981\u8fdb\u884c\u7279\u8d28\u611f\u77e5\u7684\u7b5b\u9009\u4e0e\u8bc4\u4f30\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26958", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6a21\u578b\u751f\u6210\u6570\u636e", "\u6a21\u578b\u5b89\u5168", "\u8868\u5f81\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26958v1", "published_at": "2026-08-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Scaling Model-Generated Distillation Data Can Make Latent Teacher Traits More Recoverable", "tldr": "\u8bba\u6587\u7814\u7a76\u6a21\u578b\u751f\u6210\u6570\u636e\u7528\u4e8e\u84b8\u998f\u65f6\u7684\u969 let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
