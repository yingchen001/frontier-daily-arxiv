u8fc7\u76d1\u7763\u5fae\u8c03\u3001\u6559\u5e08-\u5b66\u751f\u84b8\u998f\u3001\u504f\u597d\u4e0e\u5956\u52b1\u4f18\u5316\u8bad\u7ec3\u51fa\u53ef\u672c\u5730\u90e8\u7f72\u76848B\u53cd\u601d\u6a21\u578b\u3002", "why_notable": "\u8bba\u6587\u628a\u6602\u8d35\u7684\u5f00\u653e\u5f0f\u591a\u6a21\u6001\u53cd\u601d\u8f6c\u4e3a\u7ed3\u6784\u5316\u3001\u53ef\u8bad\u7ec3\u3001\u53ef\u672c\u5730\u90e8\u7f72\u7684\u8f6c\u79fb\u5224\u65ad\u4efb\u52a1\uff0c\u4e3a\u957f\u7a0b\u79fb\u52a8GUI\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u66f4\u4f4e\u6210\u672c\u4e14\u63a5\u8fd1\u524d\u6cbf\u6a21\u578b\u6548\u679c\u7684\u53cd\u601d\u6a21\u5757\u3002"}, {"abstract": "Deciding which of two agents is stronger means playing games until skill outweighs luck, and every game costs money, model inference, or expert time. Since the number of games needed is unknown, fixed-budget evaluations either keep paying after the result is settled or stop before the agents can be told apart, while naive optional stopping with an ordinary confidence interval invalidates the stated level. We make such an evaluation stop as soon as its evidence suffices, with the guarantee intact. The Action-Informed Value Assessment Tool (AIVAT) reduces variance in imperfect-information games through conditional mean-zero corrections, by a median $54\\times$ across 15 LLM agent configurations spanning 71,439 paired Heads-Up No-Limit Hold\u0027em (HUNL) hands, but does not say when to stop. We combine AIVAT with continuously monitored Confidence Sequences (CSs) into anytime-valid AIVAT (AV-AIVAT), whose online value model learns only from past games so that no game scores its own correction. At the nominal 95\\% level and a target precision of $\\pm1$ Big Blind, raw outcomes need a median $74\\times$ as many hands as AIVAT-corrected outcomes to stop under the Asymptotic CS (AsympCS). Exact finite-sample certification uses the Empirical-Bernstein CS (EB-CS), which needs an independently justified bound on corrected payoffs. We establish such a bound structurally for Leduc hold\u0027em and characterize a width floor set by the CS\u0027s bet cap and that bound, which governs how much of a variance gain becomes earlier stopping; the descriptive HUNL EB-CS runs show a median $1.37\\times$ stopping-time ratio. AV-AIVAT turns variance reduction into efficient, auditable early stopping while separating asymptotic screening from exact certification, so an evaluation can stop the moment its evidence suffices and hand a third party everything needed to recheck the verdict at that very stopping time.", "arxiv_id": "2608.06362", "arxiv_url": "https://arxiv.org/abs/2608.06362", "authors": ["Boning Li", "Yu Chen", "Longbo Huang"], "brief": "\u672c\u6587\u63d0\u51fa AV-AIVAT\uff0c\u5c06\u4e0d\u5b8c\u7f8e\u4fe1\u606f\u535a\u5f08\u4e2d\u7684 AIVAT \u65b9\u5dee\u964d\u4f4e\u65b9\u6cd5\u4e0e anytime-valid \u7f6e\u4fe1\u5e8f\u5217\u7ed3\u5408\uff0c\u7528\u4e8e\u5728\u8bc1\u636e\u8db3\u591f\u65f6\u81ea\u52a8\u505c\u6b62\u4e24\u667a\u80fd\u4f53\u5f3a\u5f31\u8bc4\u6d4b\u3002\u5176\u5728\u7ebf\u4ef7\u503c\u6a21\u578b\u53ea\u4f7f\u7528\u5386\u53f2\u5bf9\u5c40\u5b66\u4e60\uff0c\u907f\u514d\u5f53\u524d\u6837\u672c\u53c2\u4e0e\u81ea\u8eab\u6821\u6b63\uff0c\u4ece\u800c\u4fdd\u6301\u7edf\u8ba1\u6709\u6548\u6027\u3002", "categories": ["cs.GT", "cs.AI", "cs.CL", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06362", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u572815\u4e2a LLM \u667a\u80fd\u4f53\u914d\u7f6e\u300171439\u5c40 HUNL \u6251\u514b\u914d\u5bf9\u5b9e\u9a8c\u4e2d\uff0cAIVAT \u5bf9\u6536\u76ca\u65b9\u5dee\u7684\u4e2d\u4f4d\u964d\u4f4e\u8fbe\u523054\u500d\u3002", "\u572895%\u7f6e\u4fe1\u6c34\u5e73\u3001\u76ee\u6807\u7cbe\u5ea6\u00b11 Big Blind \u4e0b\uff0c\u4f7f\u7528 AsympCS \u65f6\u539f\u59cb\u7ed3\u679c\u6240\u9700\u624b\u6570\u4e2d\u4f4d\u6570\u662f AIVAT \u6821\u6b63\u7ed3\u679c\u768474\u500d\u3002", "\u7528 Empirical-Bernstein CS \u63d0\u4f9b\u6709\u9650\u6837\u672c\u7cbe\u786e\u8ba4\u8bc1\uff0c\u5e76\u5728 Leduc hold\u0027em \u4e2d\u7ed3\u6784\u6027\u8bc1\u660e\u6821\u6b63\u6536\u76ca\u6709\u754c\uff0c\u540c\u65f6\u5206\u6790\u7f6e\u4fe1\u5e8f\u5217\u4e0b\u6ce8\u4e0a\u9650\u5e26\u6765\u7684\u5bbd\u5ea6\u4e0b\u9650\u3002"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u4e0d\u5b8c\u7f8e\u4fe1\u606f\u535a\u5f08", "\u7edf\u8ba1\u68c0\u9a8c", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06362v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AV-AIVAT: 74x Cheaper Agent Evaluation with Certified Anytime-Valid Stopping in Imperfect-Information Games", "tldr": "\u8ba9\u535a\u5f08\u667a\u80fd\u4f53\u8bc4\u6d4b\u63d0\u524d\u53ef\u4fe1\u505c\u6b62\uff0c\u6700\u9ad8\u770174\u500d\u5bf9\u5c40\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa AV-AIVAT\uff0c\u5c06\u4e0d\u5b8c\u7f8e\u4fe1\u606f\u535a\u5f08\u4e2d\u7684 AIVAT \u65b9\u5dee\u964d\u4f4e\u65b9\u6cd5\u4e0e anytime-valid \u7f6e\u4fe1\u5e8f\u5217\u7ed3\u5408\uff0c\u7528\u4e8e\u5728\u8bc1\u636e\u8db3\u591f\u65f6\u81ea\u52a8\u505c\u6b62\u4e24\u667a\u80fd\u4f53\u5f3a\u5f31\u8bc4\u6d4b\u3002\u5176\u5728\u7ebf\u4ef7\u503c\u6a21\u578b\u53ea\u4f7f\u7528\u5386\u53f2\u5bf9\u5c40\u5b66\u4e60\uff0c\u907f\u514d\u5f53\u524d\u6837\u672c\u53c2\u4e0e\u81ea\u8eab\u6821\u6b63\uff0c\u4ece\u800c\u4fdd\u6301\u7edf\u8ba1\u6709\u6548\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u65b9\u5dee\u964d\u4f4e\u771f\u6b63\u8f6c\u5316\u4e3a\u53ef\u5ba1\u8ba1\u7684\u63d0\u524d\u505c\u6b62\u673a\u5236\uff0c\u89e3\u51b3\u56fa\u5b9a\u9884\u7b97\u6d6a\u8d39\u548c\u666e\u901a\u7f6e\u4fe1\u533a\u95f4\u53ef\u9009\u505c\u6b62\u5931\u6548\u7684\u95ee\u9898\uff0c\u5bf9\u6602\u8d35\u7684 LLM \u667a\u80fd\u4f53\u3001\u535a\u5f08\u667a\u80fd\u4f53\u548c\u4eba\u7c7b\u4e13\u5bb6\u8bc4\u6d4b\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Tool use transforms LLMs into agents that act beyond their training data, and for code-capable models, programmatic tool calling extends this further by replacing rigid JSON calls with scripts that chain and parallelize naturally. However, a systematic evaluation of tools as code on an established benchmark across current and prior model generations under real-world task conditions has not been conducted. In this work, we empirically compare programmatic tool calling (PTC) to native JSON tool calling across 14 language models on BFCL v4. In the programmatic tool calling paradigm, tools are exposed as typed Python stubs that the model invokes through code, with execution and results handled in a single agent turn. Programmatic tool calling matches or exceeds native JSON tool calling in 11 of 14 models on BFCL v4, with the GPT-5.6 family achieving a 10.6% improvement over the JSON tool calling baseline. Further, it matches or outperforms baseline in 13 of 14 models under parallel fan-out, and holds stable under context rot conditions where baseline degrades 2.3% on average. Our results demonstrate that programmatic tool calling is a viable and robust alternative to JSON tool calling, with performance tracking model capability across release generations.", "arxiv_id": "2608.06370", "arxiv_url": "https://arxiv.org/abs/2608.06370", "authors": ["Ishan Patel", "Sahil Sen", "Elias Lumer", "Vamse Kumar Subbiah"], "brief": "\u8bba\u6587\u5728 BFCL v4 \u4e0a\u7cfb\u7edf\u6bd4\u8f83\u4e86\u7a0b\u5e8f\u5316\u5de5\u5177\u8c03\u7528\uff08PTC\uff09\u4e0e\u539f\u751f JSON \u5de5\u5177\u8c03\u7528\u3002PTC \u5c06\u5de5\u5177\u66b4\u9732\u4e3a\u5e26\u7c7b\u578b\u7684 Python stub\uff0c\u8ba9\u6a21\u578b\u901a\u8fc7\u4ee3\u7801\u5b8c\u6210\u94fe\u5f0f\u3001\u5e76\u884c\u8c03\u7528\uff0c\u5e76\u5728\u5355\u8f6e\u667a\u80fd\u4f53\u4ea4\u4e92\u4e2d\u6267\u884c\u4e0e\u8fd4\u56de\u7ed3\u679c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06370", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d614\u4e2a\u8bed\u8a00\u6a21\u578b\uff0cPTC\u572811\u4e2a\u6a21\u578b\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7JSON\u5de5\u5177\u8c03\u7528\u8868\u73b0", "GPT-5.6\u7cfb\u5217\u76f8\u8f83JSON\u57fa\u7ebf\u63d0\u534710.6%", "\u5728\u5e76\u884cfan-out\u573a\u666f\u4e2d13/14\u4e2a\u6a21\u578b\u4e0d\u4f4e\u4e8e\u57fa\u7ebf\uff0c\u4e14\u5728\u4e0a\u4e0b\u6587\u52a3\u5316\u6761\u4ef6\u4e0b\u66f4\u7a33\u5b9a"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u4ee3\u7801\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06370v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The Bitter Lesson of Tool Calling", "tldr": "\u4ee3\u7801\u5f0f\u5de5\u5177\u8c03\u7528\u4f18\u4e8e\u4f20\u7edfJSON\u8c03\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5728 BFCL v4 \u4e0a\u7cfb\u7edf\u6bd4\u8f83\u4e86\u7a0b\u5e8f\u5316\u5de5\u5177\u8c03\u7528\uff08PTC\uff09\u4e0e\u539f\u751f JSON \u5de5\u5177\u8c03\u7528\u3002PTC \u5c06\u5de5\u5177\u66b4\u9732\u4e3a\u5e26\u7c7b\u578b\u7684 Python stub\uff0c\u8ba9\u6a21\u578b\u901a\u8fc7\u4ee3\u7801\u5b8c\u6210\u94fe\u5f0f\u3001\u5e76\u884c\u8c03\u7528\uff0c\u5e76\u5728\u5355\u8f6e\u667a\u80fd\u4f53\u4ea4\u4e92\u4e2d\u6267\u884c\u4e0e\u8fd4\u56de\u7ed3\u679c\u3002", "why_notable": "\u8be5\u7814\u7a76\u8868\u660e\uff0c\u5bf9\u5177\u5907\u4ee3\u7801\u80fd\u529b\u7684LLM\u800c\u8a00\uff0c\u7528\u7a0b\u5e8f\u811a\u672c\u8868\u8fbe\u5de5\u5177\u8c03\u7528\u53ef\u80fd\u6bd4\u56fa\u5b9aJSON\u63a5\u53e3\u66f4\u81ea\u7136\u3001\u66f4\u9c81\u68d2\uff0c\u5c24\u5176\u9002\u5408\u590d\u6742\u94fe\u5f0f\u4e0e\u5e76\u884c\u4efb\u52a1\uff0c\u5bf9\u667a\u80fd\u4f53\u5de5\u5177\u4f7f\u7528\u8303\u5f0f\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "GUI agents are commonly trained offline from successful interaction trajectories. Standard training decomposes each trajectory into prefix-action pairs: the agent predicts an action from the current screen and interaction history, while the subsequent observation is discarded. This removes the rationale of why an action is correct: the evidence often appears only on the subsequent screen. For example, to enable Soft Wrap, the agent should click Edit or View, but nothing reveals this until the menu opens. Without such evidence, standard imitation gives the model little chance of ever sampling and thus learning the correct reasoning. To address this issue, we propose Gated Hindsight Distillation (GHD), which uses the next screenshot as privileged information during training. A student predicts from the observable trajectory prefix, while a parameter-sharing teacher additionally observes the next screenshot and re-scores the student\u0027s on-policy responses. We apply distillation only when the student fails and the hindsight-conditioned teacher recovers the demonstrated action. GHD improves task success over GRPO on AndroidWorld and AndroidLab across two vision-language models. The code and checkpoints will be made available.", "arxiv_id": "2608.06065", "arxiv_url": "https://arxiv.org/abs/2608.06065", "authors": ["Weiwei Li", "Junzhuo Liu", "Tong Chu", "Hengfu Yu", "Wen Li"], "brief": "\u8bba\u6587\u63d0\u51fa Gated Hindsight Distillation\uff08GHD\uff09\uff0c\u5728\u8bad\u7ec3\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u65f6\u628a\u201c\u4e0b\u4e00\u5f20\u622a\u56fe\u201d\u4f5c\u4e3a\u7279\u6743\u4fe1\u606f\u3002\u5b66\u751f\u6a21\u578b\u53ea\u770b\u5f53\u524d\u53ef\u89c2\u6d4b\u8f68\u8ff9\uff0c\u6559\u5e08\u6a21\u578b\u989d\u5916\u770b\u4e0b\u4e00\u5c4f\uff0c\u5e76\u5728\u7279\u5b9a\u5931\u8d25\u573a\u666f\u4e2d\u84b8\u998f\u6b63\u786e\u52a8\u4f5c\u4fe1\u53f7\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06065", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u6807\u51c6\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60\u4e22\u5f03\u540e\u7eed\u89c2\u5bdf\u7684\u95ee\u9898\uff1a\u5f88\u591a\u52a8\u4f5c\u7684\u6b63\u786e\u4f9d\u636e\u53ea\u4f1a\u5728\u70b9\u51fb\u540e\u7684\u4e0b\u4e00\u5c4f\u51fa\u73b0\u3002", "\u91c7\u7528\u53c2\u6570\u5171\u4eab\u7684\u6559\u5e08-\u5b66\u751f\u673a\u5236\uff1a\u6559\u5e08\u5229\u7528\u4e0b\u4e00\u622a\u56fe\u91cd\u65b0\u8bc4\u5206\u5b66\u751f\u7684 on-policy \u54cd\u5e94\u3002", "\u4ec5\u5f53\u5b66\u751f\u5931\u8d25\u4e14 hindsight \u6559\u5e08\u80fd\u6062\u590d\u6f14\u793a\u52a8\u4f5c\u65f6\u624d\u8fdb\u884c\u84b8\u998f\uff0c\u907f\u514d\u5f15\u5165\u65e0\u6548\u6216\u566a\u58f0\u76d1\u7763\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u6a21\u4eff\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06065v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The Next Screenshot Knows: Gated Hindsight Distillation for Mobile GUI Agents", "tldr": "\u7528\u4e0b\u4e00\u5c4f\u622a\u56fe\u63d0\u5347\u79fb\u52a8GUI\u667a\u80fd\u4f53\u8bad\u7ec3", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Gated Hindsight Distillation\uff08GHD\uff09\uff0c\u5728\u8bad\u7ec3\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u65f6\u628a\u201c\u4e0b\u4e00\u5f20\u622a\u56fe\u201d\u4f5c\u4e3a\u7279\u6743\u4fe1\u606f\u3002\u5b66\u751f\u6a21\u578b\u53ea\u770b\u5f53\u524d\u53ef\u89c2\u6d4b\u8f68\u8ff9\uff0c\u6559\u5e08\u6a21\u578b\u989d\u5916\u770b\u4e0b\u4e00\u5c4f\uff0c\u5e76\u5728\u7279\u5b9a\u5931\u8d25\u573a\u666f\u4e2d\u84b8\u998f\u6b63\u786e\u52a8\u4f5c\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a GUI \u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u4e00\u79cd\u5229\u7528\u8f68\u8ff9\u540e\u9a8c\u4fe1\u606f\u5b66\u4e60\u52a8\u4f5c rationale \u7684\u6709\u6548\u65b9\u5f0f\uff0c\u5728 AndroidWorld \u548c AndroidLab \u4e0a\u4f18\u4e8e GRPO\uff0c\u5177\u5907\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Whole-slide image (WSI) reasoning requires an agent to sequentially acquire visual evidence before answering a diagnostic question. Existing training-free agentic frameworks formulate this process as iterative patch retrieval based on semantic relevance to the question. However, semantic relevance does not necessarily imply diagnostic informativeness in computational pathology, where competing diagnoses often exhibit similar and overlapping morphological patterns, making many patches semantically relevant yet diagnostically non-discriminative. Consequently, relevance-based retrieval may acquire redundant observations and leave diagnostic uncertainty unresolved. We propose BEACON, a plug-and-play agentic framework that reformulates WSI reasoning as a Bayesian evidence acquisition problem. BEACON maintains a probabilistic belief over competing diagnostic hypotheses and sequentially acquires patches by maximizing expected information gain (EIG) to reduce diagnostic uncertainty. An evidence controller then determines whether to answer, acquire additional evidence, or perform higher-resolution inspection. Built entirely from off-the-shelf foundation models, BEACON requires no additional training or fine-tuning. Extensive zero-shot experiments across five WSI-VQA benchmarks demonstrate that BEACON achieves the strongest overall performance among training-free agentic frameworks while substantially improving evidence acquisition efficiency, establishing Bayesian evidence acquisition as a principled paradigm for uncertainty-aware agentic WSI reasoning. The code is available at https://github.com/bryanwong17/BEACON", "arxiv_id": "2608.05757", "arxiv_url": "https://arxiv.org/abs/2608.05757", "authors": ["Bryan Wong", "Xun Xu", "Huazhu Fu", "Nancy F. Chen", "Mun Yong Yi"], "brief": "\u8bba\u6587\u63d0\u51fa BEACON\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u5168\u5207\u7247\u56fe\u50cf\uff08WSI\uff09\u63a8\u7406\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u9010\u6b65\u68c0\u7d22\u56fe\u50cf\u5757\u4ece\u201c\u8bed\u4e49\u76f8\u5173\u6027\u201d\u6539\u4e3a\u201c\u8d1d\u53f6\u65af\u8bc1\u636e\u83b7\u53d6\u201d\u3002\u5b83\u7ef4\u62a4\u8bca\u65ad\u5047\u8bbe\u7684\u6982\u7387\u4fe1\u5ff5\uff0c\u5e76\u9009\u62e9\u6700\u5927\u5316\u671f\u671b\u4fe1\u606f\u589e\u76ca\u7684patch\u6765\u964d\u4f4e\u4e0d\u786e\u5b9a\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05757", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4ee5\u671f\u671b\u4fe1\u606f\u589e\u76ca\uff08EIG\uff09\u9009\u62e9\u6700\u80fd\u533a\u5206\u7ade\u4e89\u8bca\u65ad\u5047\u8bbe\u7684\u56fe\u50cf\u5757\uff0c\u907f\u514d\u4ec5\u68c0\u7d22\u8bed\u4e49\u76f8\u5173\u4f46\u8bca\u65ad\u5197\u4f59\u7684\u533a\u57df", "\u5f15\u5165\u8bc1\u636e\u63a7\u5236\u5668\uff0c\u52a8\u6001\u51b3\u5b9a\u56de\u7b54\u3001\u7ee7\u7eed\u83b7\u53d6\u8bc1\u636e\u6216\u8fdb\u884c\u66f4\u9ad8\u5206\u8fa8\u7387\u68c0\u67e5", "\u5b8c\u5168\u57fa\u4e8e\u73b0\u6210\u57fa\u7840\u6a21\u578b\uff0c\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u6216\u5fae\u8c03\uff1b\u57285\u4e2aWSI-VQA\u57fa\u51c6\u7684\u96f6\u6837\u672c\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u5176\u4ed6\u514d\u8bad\u7ec3\u667a\u80fd\u4f53\u6846\u67b6"], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u5b66\u5f71\u50cf", "\u8d1d\u53f6\u65af\u63a8\u7406", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05757v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Relevance: Bayesian Evidence Acquisition for Agentic Whole-Slide Image Reasoning", "tldr": "\u7528\u8d1d\u53f6\u65af\u4fe1\u606f\u589e\u76ca\u9a71\u52a8WSI\u8bca\u65ad\u53d6\u8bc1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BEACON\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u5168\u5207\u7247\u56fe\u50cf\uff08WSI\uff09\u63a8\u7406\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u9010\u6b65\u68c0\u7d22\u56fe\u50cf\u5757\u4ece\u201c\u8bed\u4e49\u76f8\u5173\u6027\u201d\u6539\u4e3a\u201c\u8d1d\u53f6\u65af\u8bc1\u636e\u83b7\u53d6\u201d\u3002\u5b83\u7ef4\u62a4\u8bca\u65ad\u5047\u8bbe\u7684\u6982\u7387\u4fe1\u5ff5\uff0c\u5e76\u9009\u62e9\u6700\u5927\u5316\u671f\u671b\u4fe1\u606f\u589e\u76ca\u7684patch\u6765\u964d\u4f4e\u4e0d\u786e\u5b9a\u6027\u3002", "why_notable": "\u5b83\u4e3a\u75c5\u7406\u5168\u5207\u7247\u63a8\u7406\u63d0\u4f9b\u4e86\u4e00\u4e2a\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u7684\u667a\u80fd\u4f53\u8303\u5f0f\uff0c\u628a\u8bc1\u636e\u83b7\u53d6\u4ece\u542f\u53d1\u5f0f\u76f8\u5173\u6027\u68c0\u7d22\u63a8\u8fdb\u5230\u539f\u5219\u5316\u7684\u8d1d\u53f6\u65af\u51b3\u7b56\uff0c\u6709\u671b\u63d0\u5347\u533b\u7597\u89c6\u89c9\u95ee\u7b54\u7684\u6548\u7387\u4e0e\u53ef\u9760\u6027\u3002"}, {"abstract": "Deploying autonomous multimodal agents in continuous, real-world environments requires them to ingest unbounded audio-visual streams and maintain hour-scale memory. However, current evaluations predominantly rely on brief clips and multiple-choice formats. This design allows minimal baselines that process only the last four frames to match or surpass complex streaming models, while answer options also expose language shortcuts. We introduce StreamArena, a benchmark for hour-scale, interactive streaming video understanding. StreamArena contains 243 full-length videos averaging 88.8 minutes and 3,646 rigorously annotated, open-ended question-answer pairs that evaluate real-time perception, historical retrospection, proactive interaction, and multimodal tool utilization. Evaluation across diverse systems exposes a tension between continuous interaction and long-horizon multimodal comprehension. Methods that retain only recent frames cannot recover distant events, methods that convert past observations into text lose visual evidence, and methods that repeatedly compress visual memory struggle to preserve fine-grained details over time. We address this tension with StreamMind, a two-tier architecture that assigns latency-critical interaction and proactive monitoring to independently scheduled frontend workers, while backend workers asynchronously construct persistent multimodal memory and perform historical recall and external search. StreamMind outperforms existing streaming baselines across all four capabilities and reduces query-to-answer latency by reusing persistent state.", "arxiv_id": "2608.05703", "arxiv_url": "https://arxiv.org/abs/2608.05703", "authors": ["Xichen Zhang", "Guankai Li", "Yinghao Zhu", "Shijian Wang", "Sitong Wu", "Shaozuo Yu", "Meng Chu", "Yuan Lu", "Jiaya Jia"], "brief": "\u8bba\u6587\u63d0\u51fa StreamArena\uff0c\u4e00\u4e2a\u9762\u5411\u8fde\u7eed\u3001\u4ea4\u4e92\u5f0f\u3001\u957f\u65f6\u7a0b\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u7684\u5f00\u653e\u95ee\u7b54\u57fa\u51c6\uff0c\u5305\u542b 243 \u90e8\u5e73\u5747 88.8 \u5206\u949f\u7684\u89c6\u9891\u548c 3646 \u4e2a\u6807\u6ce8\u95ee\u7b54\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa StreamMind \u53cc\u5c42\u67b6\u6784\uff0c\u5c06\u5b9e\u65f6\u4ea4\u4e92\u4e0e\u540e\u53f0\u6301\u4e45\u591a\u6a21\u6001\u8bb0\u5fc6\u6784\u5efa\u89e3\u8026\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05703", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["StreamArena \u8bc4\u4f30\u5b9e\u65f6\u611f\u77e5\u3001\u5386\u53f2\u56de\u6eaf\u3001\u4e3b\u52a8\u4ea4\u4e92\u548c\u591a\u6a21\u6001\u5de5\u5177\u4f7f\u7528\u56db\u7c7b\u80fd\u529b\uff0c\u907f\u514d\u77ed\u89c6\u9891\u4e0e\u9009\u62e9\u9898\u5e26\u6765\u7684\u6377\u5f84\u3002", "\u5b9e\u9a8c\u63ed\u793a\u73b0\u6709\u65b9\u6cd5\u7684\u6838\u5fc3\u77db\u76fe\uff1a\u53ea\u4fdd\u7559\u8fd1\u5e27\u4f1a\u9057\u5fd8\u8fdc\u671f\u4e8b\u4ef6\uff0c\u8f6c\u6587\u672c\u4f1a\u4e22\u5931\u89c6\u89c9\u8bc1\u636e\uff0c\u53cd\u590d\u538b\u7f29\u89c6\u89c9\u8bb0\u5fc6\u4f1a\u635f\u5931\u7ec6\u8282\u3002", "StreamMind \u901a\u8fc7\u524d\u7aef worker \u5904\u7406\u4f4e\u5ef6\u8fdf\u4ea4\u4e92\u4e0e\u76d1\u63a7\uff0c\u540e\u7aef worker \u5f02\u6b65\u7ef4\u62a4\u6301\u4e45\u591a\u6a21\u6001\u8bb0\u5fc6\u3001\u5386\u53f2\u68c0\u7d22\u4e0e\u5916\u90e8\u641c\u7d22\uff0c\u5e76\u964d\u4f4e\u56de\u7b54\u5ef6\u8fdf\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u957f\u65f6\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05703v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "StreamArena: Toward Continuous, Interactive, and Long-Horizon Agentic Streaming Video Understanding", "tldr": "\u9762\u5411\u5c0f\u65f6\u7ea7\u89c6\u9891\u6d41\u7406\u89e3\u7684\u667a\u80fd\u4f53\u57fa\u51c6\u4e0e\u67b6\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa StreamArena\uff0c\u4e00\u4e2a\u9762\u5411\u8fde\u7eed\u3001\u4ea4\u4e92\u5f0f\u3001\u957f\u65f6\u7a0b\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u7684\u5f00\u653e\u95ee\u7b54\u57fa\u51c6\uff0c\u5305\u542b 243 \u90e8\u5e73\u5747 88.8 \u5206\u949f\u7684\u89c6\u9891\u548c 3646 \u4e2a\u6807\u6ce8\u95ee\u7b54\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa StreamMind \u53cc\u5c42\u67b6\u6784\uff0c\u5c06\u5b9e\u65f6\u4ea4\u4e92\u4e0e\u540e\u53f0\u6301\u4e45\u591a\u6a21\u6001\u8bb0\u5fc6\u6784\u5efa\u89e3\u8026\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u9891\u7406\u89e3\u8bc4\u6d4b\u4ece\u77ed\u7247\u6bb5\u79bb\u7ebf\u95ee\u7b54\u63a8\u8fdb\u5230\u5c0f\u65f6\u7ea7\u3001\u8fde\u7eed\u4ea4\u4e92\u573a\u666f\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u591a\u6a21\u6001\u667a\u80fd\u4f53\u90e8\u7f72\u9700\u6c42\uff1b\u540c\u65f6\u7ed9\u51fa\u53ef\u590d\u7528\u7684\u957f\u65f6\u8bb0\u5fc6\u7cfb\u7edf\u8bbe\u8ba1\uff0c\u5bf9\u89c6\u9891\u667a\u80fd\u4f53\u548c\u5177\u8eab/\u76d1\u63a7\u7c7b\u5e94\u7528\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Recent vision-language models (VLMs) can generate executable CAD programs from images, but existing methods mainly target coarse, general-purpose 3D objects and rarely address the fine-grained geometry and millimeter-level tolerances required in industrial mechanical design. We introduce OmniMech, the first million-scale benchmark for evaluating VLMs on executable CAD generation from industrial manufacturing data. OmniMech contains more than 251,000 fully dimensioned and toleranced 2D orthographic drawings, paired with native CAD models, multi-view renderings, mesh, STEP and B-rep representations, and rich semantic annotations. The benchmark includes four tasks: (1) parametric CAD program synthesis from engineering drawings; (2) diagram-to-3D reasoning for geometrically and structurally consistent reconstruction; (3) annotation-grounded reasoning over dimensions, symbols, feature callouts, and manufacturing constraints; and (4) tool-augmented agentic reasoning using visualization, measurement, CAD execution, and verification tools. Experiments show that current VLMs and CAD-specialized models still struggle with executable program synthesis, fine-grained 3D reconstruction, and reliable enforcement of dimensions and tolerances. We will release the benchmark data, evaluation code, and tool interfaces to support future research.", "arxiv_id": "2608.05539", "arxiv_url": "https://arxiv.org/abs/2608.05539", "authors": ["Taiting Lu", "Runze Liu", "Ziwei Dong", "Sisong Bei", "Jingying Zeng", "Mingjia Wang", "Zhenghao Li", "Kaiyuan Lin", "Yi-Shan Wu", "Yangshoudu Zheng", "Hongxing Pan", "Kai Zhang", "Guoliang Shi", "Ling Ma", "Yifan Yang", "Jiaying Lu", "Qi He", "Sung-Liang Chen", "Yi-Chao Chen", "Yincheng Jin", "Mahanth Gowda"], "brief": "OmniMech \u662f\u9996\u4e2a\u9762\u5411\u5de5\u4e1a\u5236\u9020\u6570\u636e\u7684\u767e\u4e07\u7ea7\u53ef\u6267\u884c CAD \u751f\u6210\u4e0e3D\u91cd\u5efa\u57fa\u51c6\u3002\u5b83\u5c06\u5168\u5c3a\u5bf8\u516c\u5dee2D\u5de5\u7a0b\u56fe\u4e0e\u539f\u751fCAD\u3001\u591a\u89c6\u89d2\u6e32\u67d3\u3001\u7f51\u683c\u3001STEP\u3001B-rep\u548c\u8bed\u4e49\u6807\u6ce8\u914d\u5bf9\uff0c\u7528\u4e8e\u8bc4\u4f30VLM\u5728\u673a\u68b0\u8bbe\u8ba1\u4e2d\u7684\u7cbe\u7ec6\u51e0\u4f55\u7406\u89e3\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05539", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5305\u542b\u8d85\u8fc725.1\u4e07\u5f20\u5e26\u5b8c\u6574\u5c3a\u5bf8\u548c\u516c\u5dee\u76842D\u6b63\u6295\u5f71\u5de5\u7a0b\u56fe\uff0c\u5e76\u914d\u5957\u591a\u79cd3D\u8868\u793a\u4e0e\u8bed\u4e49\u6807\u6ce8", "\u8986\u76d6\u53c2\u6570\u5316CAD\u7a0b\u5e8f\u5408\u6210\u3001\u56fe\u7eb8\u52303D\u63a8\u7406\u3001\u57fa\u4e8e\u5c3a\u5bf8/\u7b26\u53f7/\u5de5\u827a\u7ea6\u675f\u7684\u6807\u6ce8\u63a8\u7406\u3001\u5de5\u5177\u589e\u5f3a\u667a\u80fd\u4f53\u63a8\u7406\u56db\u7c7b\u4efb\u52a1", "\u5b9e\u9a8c\u8868\u660e\u73b0\u6709VLM\u548cCAD\u4e13\u7528\u6a21\u578b\u5728\u53ef\u6267\u884c\u7a0b\u5e8f\u751f\u6210\u3001\u6beb\u7c73\u7ea7\u91cd\u5efa\u548c\u5c3a\u5bf8\u516c\u5dee\u7ea6\u675f\u9075\u5faa\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3"], "keywords": ["\u591a\u6a21\u6001", "3D\u91cd\u5efa", "CAD\u751f\u6210", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05539v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "OmniMech: All-in-one Multimodal Mechanical Benchmark for 3D Reconstruction", "tldr": "\u767e\u4e07\u7ea7\u5de5\u4e1aCAD\u91cd\u5efa\u591a\u6a21\u6001\u57fa\u51c6", "upvotes": 0, "what_it_is": "OmniMech \u662f\u9996\u4e2a\u9762\u5411\u5de5\u4e1a\u5236\u9020\u6570\u636e\u7684\u767e\u4e07\u7ea7\u53ef\u6267\u884c CAD \u751f\u6210\u4e0e3D\u91cd\u5efa\u57fa\u51c6\u3002\u5b83\u5c06\u5168\u5c3a\u5bf8\u516c\u5dee2D\u5de5\u7a0b\u56fe\u4e0e\u539f\u751fCAD\u3001\u591a\u89c6\u89d2\u6e32\u67d3\u3001\u7f51\u683c\u3001STEP\u3001B-rep\u548c\u8bed\u4e49\u6807\u6ce8\u914d\u5bf9\uff0c\u7528\u4e8e\u8bc4\u4f30VLM\u5728\u673a\u68b0\u8bbe\u8ba1\u4e2d\u7684\u7cbe\u7ec6\u51e0\u4f55\u7406\u89e3\u80fd\u529b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06CAD\u751f\u6210\u8bc4\u6d4b\u4ece\u901a\u7528\u7c97\u7c92\u5ea6\u7269\u4f53\u63a8\u8fdb\u5230\u5de5\u4e1a\u673a\u68b0\u573a\u666f\uff0c\u5f3a\u8c03\u5c3a\u5bf8\u3001\u516c\u5dee\u548c\u5236\u9020\u7ea6\u675f\uff0c\u5bf9\u9ad8\u7cbe\u5ea6\u5de5\u7a0b\u8bbe\u8ba1\u81ea\u52a8\u5316\u3001CAD\u667a\u80fd\u4f53\u548c\u591a\u6a21\u6001\u7a7a\u95f4\u63a8\u7406\u7814\u7a76\u5177\u6709\u91cd\u8981\u63a8\u52a8\u4f5c\u7528\u3002"}, {"abstract": "Synthetic 3D scene generation is increasingly used as a data source for computer vision and embodied AI, but existing generators often optimize perceptual realism without reliably satisfying task-critical functional constraints. This mismatch limits the usefulness of synthetic data for downstream training, where accessibility, traversability, and spatial rule compliance are often essential. We present iARCS, an iterative agentic reinforcement learning framework that adapts a pretrained scene generator to natural-language task requirements. iARCS uses a two-stage strategy: universal-reward pretraining to improve physical plausibility and layout quality, followed by task-specific fine-tuning with LLM-generated reward programs that are iteratively refined from training feedback. Experiments show improved constraint fidelity on walkability, reachability, and clearance-focused tasks, effective task-specific constraint optimization, and competitive scene diversity. We further show that data generated by iARCS improves a base generator, supporting its value as a practical synthetic data generation tool rather than only a controllable scene editing method.", "arxiv_id": "2608.06161", "arxiv_url": "https://arxiv.org/abs/2608.06161", "authors": ["Saugat Adhikari", "Ashok Prasad Neupane", "Pramish Paudel", "Ajad Chhatkuli", "Danda Pani Paudel"], "brief": "\u8bba\u6587\u63d0\u51fa iARCS\uff0c\u4e00\u4e2a\u8fed\u4ee3\u5f0f\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u5c06\u9884\u8bad\u7ec33D\u573a\u666f\u751f\u6210\u5668\u9002\u914d\u5230\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u7684\u529f\u80fd\u7ea6\u675f\u3002\u5b83\u5148\u8fdb\u884c\u901a\u7528\u5956\u52b1\u9884\u8bad\u7ec3\u63d0\u5347\u7269\u7406\u5408\u7406\u6027\u4e0e\u5e03\u5c40\u8d28\u91cf\uff0c\u518d\u7528LLM\u751f\u6210\u5e76\u8fed\u4ee3\u4f18\u5316\u7684\u5956\u52b1\u7a0b\u5e8f\u8fdb\u884c\u4efb\u52a1\u5fae\u8c03\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06161", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u9488\u5bf9\u5408\u62103D\u573a\u666f\u5e38\u89c1\u7684\u201c\u89c6\u89c9\u771f\u5b9e\u4f46\u4e0d\u6ee1\u8db3\u529f\u80fd\u7ea6\u675f\u201d\u95ee\u9898\uff0c\u91cd\u70b9\u4f18\u5316\u53ef\u884c\u8d70\u6027\u3001\u53ef\u8fbe\u6027\u3001\u95f4\u9699\u7b49\u4efb\u52a1\u5173\u952e\u5c5e\u6027", "\u91c7\u7528\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u901a\u7528\u5956\u52b1\u9884\u8bad\u7ec3\u63d0\u5347\u57fa\u7840\u573a\u666f\u8d28\u91cf\uff0c\u4efb\u52a1\u7279\u5b9a\u5fae\u8c03\u5f3a\u5316\u81ea\u7136\u8bed\u8a00\u7ea6\u675f\u6ee1\u8db3\u5ea6", "LLM\u751f\u6210\u5956\u52b1\u7a0b\u5e8f\uff0c\u5e76\u6839\u636e\u8bad\u7ec3\u53cd\u9988\u8fed\u4ee3\u4fee\u6b63\uff0c\u63d0\u9ad8\u7ea6\u675f\u4f18\u5316\u6548\u679c\u4e14\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u573a\u666f\u591a\u6837\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "3D\u751f\u6210", "\u5408\u6210\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06161v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "iARCS: Iterative Agentic RL for Controllable 3D Scene Generation", "tldr": "\u7528\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u53ef\u63a7\u751f\u62103D\u573a\u666f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa iARCS\uff0c\u4e00\u4e2a\u8fed\u4ee3\u5f0f\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u5c06\u9884\u8bad\u7ec33D\u573a\u666f\u751f\u6210\u5668\u9002\u914d\u5230\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u7684\u529f\u80fd\u7ea6\u675f\u3002\u5b83\u5148\u8fdb\u884c\u901a\u7528\u5956\u52b1\u9884\u8bad\u7ec3\u63d0\u5347\u7269\u7406\u5408\u7406\u6027\u4e0e\u5e03\u5c40\u8d28\u91cf\uff0c\u518d\u7528LLM\u751f\u6210\u5e76\u8fed\u4ee3\u4f18\u5316\u7684\u5956\u52b1\u7a0b\u5e8f\u8fdb\u884c\u4efb\u52a1\u5fae\u8c03\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u53ef\u63a73D\u573a\u666f\u751f\u6210\u4ece\u5355\u7eaf\u8ffd\u6c42\u611f\u77e5\u771f\u5b9e\u63a8\u8fdb\u5230\u6ee1\u8db3\u4e0b\u6e38\u5177\u8eab\u667a\u80fd\u548c\u89c6\u89c9\u8bad\u7ec3\u6240\u9700\u7684\u529f\u80fd\u7ea6\u675f\uff0c\u53ef\u4f5c\u4e3a\u5b9e\u7528\u7684\u5408\u6210\u6570\u636e\u751f\u6210\u5de5\u5177\u63d0\u5347\u57fa\u7840\u751f\u6210\u5668\u6027\u80fd\u3002"}, {"abstract": "This paper presents ECHO (Enhanced Care \\\u0026 Health Observer), a locally-deployable conversational health assistant for long-term chronic care management. ECHO integrates three complementary software modules developed under shared supervision as a unified system. The core module is an agentic chatbot built on a ReAct loop orchestrated via LangGraph, equipped with 17 clinical tools and a temporal knowledge graph for persistent cross-session memory; it achieves a 94.9\\% tool-execution pass rate across a 59-scenario benchmark with GPT-5 Mini. A two-stage hybrid safety layer intercepts all incoming queries: a rule-based layer handles explicit crisis signals and jailbreak attempts in under 1ms, while a signed graph neural network (GNN) with APPNP-style propagation classifies boundary cases by clinical intent, achieving 88.8\\% accuracy and 90.6\\% unsafe recall on a 2,537-query annotated Turkish health dataset while outperforming zero-shot LLM baselines including Llama 3.3 70B. A multimodal speech assessment module combining Whisper acoustic encoding and BERT text encoding with cross-attention fusion estimates emotion, depression, and pain, reaching a mean macro F1 of 0.652. The full system is implemented as a web application that can run entirely on consumer hardware, with no patient data transmitted to external services, supporting compliance with GDPR and KVKK.", "arxiv_id": "2608.06110", "arxiv_url": "https://arxiv.org/abs/2608.06110", "authors": ["Abdulkadir K\u00fcl\u00e7e", "Alihan Esen", "Ca\u011fla Fikir", "Berke Kurt", "Kuzey Arar", "G\u00f6khan Ercan", "Faik Boray Tek"], "brief": "ECHO \u662f\u4e00\u4e2a\u9762\u5411\u957f\u671f\u6162\u75c5\u7ba1\u7406\u7684\u672c\u5730\u53ef\u90e8\u7f72\u5bf9\u8bdd\u5f0f\u5065\u5eb7\u52a9\u624b\uff0c\u6574\u5408\u4e86 ReAct \u667a\u80fd\u4f53\u3001\u8de8\u4f1a\u8bdd\u65f6\u95f4\u8bb0\u5fc6\u3001\u5b89\u5168\u9632\u62a4\u548c\u8bed\u97f3\u8bc4\u4f30\u6a21\u5757\u3002\u7cfb\u7edf\u53ef\u5728\u6d88\u8d39\u7ea7\u786c\u4ef6\u4e0a\u8fd0\u884c\uff0c\u5f3a\u8c03\u9690\u79c1\u4fdd\u62a4\u4e0e\u4e34\u5e8a\u4f7f\u7528\u8fb9\u754c\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06110", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6838\u5fc3\u804a\u5929\u6a21\u5757\u57fa\u4e8e LangGraph \u7f16\u6392\u7684 ReAct \u5faa\u73af\uff0c\u63a5\u5165 17 \u4e2a\u4e34\u5e8a\u5de5\u5177\u548c\u65f6\u95f4\u77e5\u8bc6\u56fe\u8c31\uff0c\u5728 59 \u4e2a\u573a\u666f\u57fa\u51c6\u4e0a\u5de5\u5177\u6267\u884c\u901a\u8fc7\u7387\u8fbe 94.9%\u3002", "\u4e24\u9636\u6bb5\u5b89\u5168\u5c42\u7ed3\u5408\u6beb\u79d2\u7ea7\u89c4\u5219\u62e6\u622a\u4e0e\u5e26\u7b26\u53f7 GNN \u5206\u7c7b\uff0c\u5728 2537 \u6761\u571f\u8033\u5176\u8bed\u5065\u5eb7\u67e5\u8be2\u6570\u636e\u4e0a\u8fbe\u5230 88.8% \u51c6\u786e\u7387\u548c 90.6% \u4e0d\u5b89\u5168\u53ec\u56de\u7387\u3002", "\u591a\u6a21\u6001\u8bed\u97f3\u8bc4\u4f30\u6a21\u5757\u878d\u5408 Whisper \u58f0\u5b66\u7f16\u7801\u4e0e BERT \u6587\u672c\u7f16\u7801\uff0c\u53ef\u4f30\u8ba1\u60c5\u7eea\u3001\u6291\u90c1\u548c\u75bc\u75db\uff0c\u5e73\u5747 macro F1 \u4e3a 0.652\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597AI", "\u5b89\u5168\u5bf9\u9f50", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06110v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ECHO: A Locally-Deployable Agentic Health Assistant with Temporal Memory, Safety Guardrails, and Speech Assessment", "tldr": "\u672c\u5730\u90e8\u7f72\u7684\u6162\u75c5\u62a4\u7406\u667a\u80fd\u5065\u5eb7\u52a9\u624b", "upvotes": 0, "what_it_is": "ECHO \u662f\u4e00\u4e2a\u9762\u5411\u957f\u671f\u6162\u75c5\u7ba1\u7406\u7684\u672c\u5730\u53ef\u90e8\u7f72\u5bf9\u8bdd\u5f0f\u5065\u5eb7\u52a9\u624b\uff0c\u6574\u5408\u4e86 ReAct \u667a\u80fd\u4f53\u3001\u8de8\u4f1a\u8bdd\u65f6\u95f4\u8bb0\u5fc6\u3001\u5b89\u5168\u9632\u62a4\u548c\u8bed\u97f3\u8bc4\u4f30\u6a21\u5757\u3002\u7cfb\u7edf\u53ef\u5728\u6d88\u8d39\u7ea7\u786c\u4ef6\u4e0a\u8fd0\u884c\uff0c\u5f3a\u8c03\u9690\u79c1\u4fdd\u62a4\u4e0e\u4e34\u5e8a\u4f7f\u7528\u8fb9\u754c\u3002", "why_notable": "\u8bba\u6587\u5c06\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u3001\u957f\u671f\u8bb0\u5fc6\u3001\u5b89\u5168\u62a4\u680f\u548c\u8bed\u97f3\u5065\u5eb7\u8bc4\u4f30\u6574\u5408\u5230\u53ef\u672c\u5730\u8fd0\u884c\u7684\u533b\u7597\u52a9\u624b\u4e2d\uff0c\u517c\u987e\u6162\u75c5\u7ba1\u7406\u7684\u8fde\u7eed\u6027\u3001\u9690\u79c1\u5408\u89c4\u4e0e\u9ad8\u98ce\u9669\u573a\u666f\u5b89\u5168\u63a7\u5236\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Economic World Models (EWMs) are generative economic models that simulate how economies evolve from within by modeling heterogeneous agents, their beliefs and actions, and the market and institutional mechanisms through which their interactions produce aggregate outcomes. This paper develops an implementation roadmap for building economic world models as generative engines in which heterogeneous agents act, interact, adapt, and co-evolve with markets and institutions, thereby producing economic dynamics from the inside. We organize EWM systems into a six-level capability ladder, from fixed rule-based agent worlds to adaptive and LLM-based agent worlds, self-evolving agents, evolving institutional worlds, and sim-to-real economic twins aligned with real observations. A systematic literature survey across these levels reveals that existing work remains concentrated in lower-level agent and simulation environments, while systems with self-evolving agents, endogenous institutions, persistent empirical alignment, and validated economic mechanisms remain rare. By translating the EWM agenda into an implementation blueprint, this paper aims to accelerate the development of the next generation of economic simulation environments that can serve as high-fidelity sandboxes for human decision-makers and as training, planning, evaluation, and safety substrates for AI agents. We release a curated paper list and related resources to support future research.", "arxiv_id": "2608.06020", "arxiv_url": "https://arxiv.org/abs/2608.06020", "authors": ["Jiale Han", "Xiang Li", "Jing Qian", "Wenyuan Gu", "Pin Gao", "Ye Luo", "Hongyuan Zha", "Dacheng Tao", "Benyou Wang", "Lin William Cong"], "brief": "\u8bba\u6587\u5b9a\u4e49\u5e76\u68b3\u7406\u7ecf\u6d4e\u4e16\u754c\u6a21\u578b\uff08EWM\uff09\uff1a\u7528\u5f02\u8d28\u667a\u80fd\u4f53\u3001\u5e02\u573a\u4e0e\u5236\u5ea6\u673a\u5236\u751f\u6210\u5f0f\u6a21\u62df\u7ecf\u6d4e\u6f14\u5316\u3002\u4f5c\u8005\u63d0\u51fa\u516d\u7ea7\u80fd\u529b\u9636\u68af\u4e0e\u5b9e\u73b0\u8def\u7ebf\u56fe\uff0c\u5e76\u7cfb\u7edf\u7efc\u8ff0\u73b0\u6709\u7814\u7a76\u5206\u5e03\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06020", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5c06EWM\u5212\u5206\u4e3a\u4ece\u56fa\u5b9a\u89c4\u5219\u667a\u80fd\u4f53\u4e16\u754c\uff0c\u5230LLM\u667a\u80fd\u4f53\u3001\u81ea\u6f14\u5316\u667a\u80fd\u4f53\u3001\u5185\u751f\u5236\u5ea6\u4e16\u754c\u3001\u518d\u5230\u4e0e\u73b0\u5b9e\u89c2\u6d4b\u5bf9\u9f50\u7684\u7ecf\u6d4e\u6570\u5b57\u5b6a\u751f\u516d\u4e2a\u5c42\u7ea7", "\u7efc\u8ff0\u53d1\u73b0\u73b0\u6709\u5de5\u4f5c\u4e3b\u8981\u96c6\u4e2d\u5728\u4f4e\u5c42\u7ea7\u7684\u667a\u80fd\u4f53\u4eff\u771f\u73af\u5883\uff0c\u9ad8\u5c42\u7ea7\u80fd\u529b\u5982\u81ea\u6f14\u5316\u3001\u5236\u5ea6\u5185\u751f\u5316\u3001\u6301\u7eed\u5b9e\u8bc1\u5bf9\u9f50\u4ecd\u8f83\u5c11", "\u5f3a\u8c03EWM\u53ef\u4f5c\u4e3a\u4eba\u7c7b\u51b3\u7b56\u6c99\u76d2\uff0c\u4ee5\u53caAI\u667a\u80fd\u4f53\u8bad\u7ec3\u3001\u89c4\u5212\u3001\u8bc4\u4f30\u4e0e\u5b89\u5168\u6d4b\u8bd5\u7684\u57fa\u7840\u8bbe\u65bd"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u7ecf\u6d4e\u4eff\u771f", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06020v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Economic Agents to Agentic Economies: A Systems Blueprint for Economic World Models", "tldr": "\u63d0\u51fa\u7ecf\u6d4e\u4e16\u754c\u6a21\u578b\u7684\u7cfb\u7edf\u84dd\u56fe\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5b9a\u4e49\u5e76\u68b3\u7406\u7ecf\u6d4e\u4e16\u754c\u6a21\u578b\uff08EWM\uff09\uff1a\u7528\u5f02\u8d28\u667a\u80fd\u4f53\u3001\u5e02\u573a\u4e0e\u5236\u5ea6\u673a\u5236\u751f\u6210\u5f0f\u6a21\u62df\u7ecf\u6d4e\u6f14\u5316\u3002\u4f5c\u8005\u63d0\u51fa\u516d\u7ea7\u80fd\u529b\u9636\u68af\u4e0e\u5b9e\u73b0\u8def\u7ebf\u56fe\uff0c\u5e76\u7cfb\u7edf\u7efc\u8ff0\u73b0\u6709\u7814\u7a76\u5206\u5e03\u3002", "why_notable": "\u8be5\u6587\u628a\u7ecf\u6d4e\u4eff\u771f\u3001LLM\u667a\u80fd\u4f53\u4e0e\u4e16\u754c\u6a21\u578b\u7edf\u4e00\u5230\u4e00\u4e2a\u7cfb\u7edf\u5de5\u7a0b\u6846\u67b6\u4e2d\uff0c\u4e3a\u6784\u5efa\u9ad8\u4fdd\u771f\u7ecf\u6d4e\u6c99\u76d2\u548c\u9762\u5411AI\u667a\u80fd\u4f53\u7684\u7ecf\u6d4e\u73af\u5883\u63d0\u4f9b\u4e86\u6e05\u6670\u7814\u7a76\u8def\u7ebf\u3002"}, {"abstract": "With increasingly diverse and heterogeneous information sources, effectively leveraging multimodal data is becoming pivotal for high-quality financial trading. Although recent advancements in Large Language Model (LLM)-based agents have enabled the ingestion of multimodal inputs, existing methods fail to capture nuanced cross-modal dependencies and remain vulnerable to market noise, due to limited multimodal modeling, ineffective fusion mechanisms, and inadequate robustness. To address these challenges, we propose F$^2$Agent, a novel multimodal agentic paradigm driven by the Financial Fusion of Agentic Intelligence. F$^2$Agent first deploys a hierarchy of specialized agents to comprehensively extract modality-specific signals. It further introduces a modality-aware adaptive fusion mechanism coupled with noise-robust consistency regularization to dynamically capture fine-grained inter-modality dependencies and generate noise-resilient trading signals. Extensive experiments on six stocks and cryptocurrency assets demonstrate that F$^2$Agent consistently outperforms 16 competitive baselines across multiple trading metrics, with over 20% relative improvement in annualized return on average. Notably, F$^2$Agent delivers returns of 120.48% on GOOG and 148.41% on TSLA, demonstrating its efficacy and robustness in varying market dynamics.", "arxiv_id": "2608.05668", "arxiv_url": "https://arxiv.org/abs/2608.05668", "authors": ["Changshuo Liu", "Yanzheng Jin", "Shangfeng Cai", "Peng Fang", "Xiaokui Xiao", "Beng Chin Ooi"], "brief": "\u8bba\u6587\u63d0\u51fa F\u00b2Agent\uff0c\u4e00\u4e2a\u9762\u5411\u91d1\u878d\u4ea4\u6613\u7684\u591a\u6a21\u6001 LLM \u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u5206\u5c42\u4e13\u7528\u667a\u80fd\u4f53\u63d0\u53d6\u4e0d\u540c\u6a21\u6001\u4fe1\u53f7\uff0c\u5e76\u7528\u81ea\u9002\u5e94\u878d\u5408\u4e0e\u6297\u566a\u6b63\u5219\u751f\u6210\u66f4\u7a33\u5065\u7684\u4ea4\u6613\u51b3\u7b56\u3002", "categories": ["cs.MA", "cs.AI", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05668", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u5206\u5c42\u4e13\u7528\u667a\u80fd\u4f53\u5206\u522b\u5efa\u6a21\u91d1\u878d\u5e02\u573a\u4e2d\u7684\u591a\u6e90\u5f02\u6784\u4fe1\u606f\uff0c\u63d0\u53d6\u6a21\u6001\u7279\u5b9a\u4ea4\u6613\u4fe1\u53f7", "\u63d0\u51fa\u6a21\u6001\u611f\u77e5\u7684\u81ea\u9002\u5e94\u878d\u5408\u673a\u5236\uff0c\u52a8\u6001\u6355\u6349\u7ec6\u7c92\u5ea6\u8de8\u6a21\u6001\u4f9d\u8d56", "\u5f15\u5165\u566a\u58f0\u9c81\u68d2\u7684\u4e00\u81f4\u6027\u6b63\u5219\uff0c\u57286\u4e2a\u80a1\u7968\u548c\u52a0\u5bc6\u8d44\u4ea7\u4e0a\u8f8316\u4e2a\u57fa\u7ebf\u5e73\u5747\u5e74\u5316\u6536\u76ca\u76f8\u5bf9\u63d0\u5347\u8d8520%"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u91d1\u878d\u4ea4\u6613", "\u9c81\u68d2\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05668v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "F$^2$Agent: Financial Fusion of Agentic Intelligence for Multimodal Trading", "tldr": "\u591a\u667a\u80fd\u4f53\u878d\u5408\u591a\u6a21\u6001\u4fe1\u53f7\u63d0\u5347\u91cf\u5316\u4ea4\u6613", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa F\u00b2Agent\uff0c\u4e00\u4e2a\u9762\u5411\u91d1\u878d\u4ea4\u6613\u7684\u591a\u6a21\u6001 LLM \u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u5206\u5c42\u4e13\u7528\u667a\u80fd\u4f53\u63d0\u53d6\u4e0d\u540c\u6a21\u6001\u4fe1\u53f7\uff0c\u5e76\u7528\u81ea\u9002\u5e94\u878d\u5408\u4e0e\u6297\u566a\u6b63\u5219\u751f\u6210\u66f4\u7a33\u5065\u7684\u4ea4\u6613\u51b3\u7b56\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u667a\u80fd\u4f53\u3001\u8de8\u6a21\u6001\u878d\u5408\u548c\u6297\u566a\u5efa\u6a21\u7ed3\u5408\u5230\u771f\u5b9e\u91d1\u878d\u4ea4\u6613\u573a\u666f\uff0c\u9488\u5bf9\u5e02\u573a\u566a\u58f0\u548c\u6a21\u6001\u4f9d\u8d56\u5efa\u6a21\u4e0d\u8db3\u7684\u95ee\u9898\u7ed9\u51fa\u7cfb\u7edf\u65b9\u6848\uff0c\u5e76\u5c55\u793a\u4e86\u663e\u8457\u6536\u76ca\u63d0\u5347\uff0c\u5177\u6709\u8f83\u5f3a\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Tabular data are ubiquitous in real-world applications and are crucial for data-driven prediction and decision-making across science, industry, finance, healthcare, and public services. Tabular foundation models (TFMs) have emerged as a promising paradigm for general-purpose tabular learning, offering reusable predictors across diverse datasets and substantially reducing the need for task-specific training, tuning, and model development. However, their practical deployment remains constrained by distribution shifts, heterogeneous feature semantics, and task-specific patterns that are difficult to capture without costly fine-tuning or additional labeled data. To this end, we propose SkillTFM, a training-free system that shifts TFM adaptation from parameter updates to the gated evolution of agentic skills. The core of SkillTFM is a verifiable and extensible skill bank that couples boundary evidence identification with gated skill evolution: the former characterizes task structure and base-model failure patterns, whereas the latter retrieves and extends reusable skills subject to explicit validation. Across simulated boundary settings and real-world electricity-price forecasting, SkillTFM improves AUC by 0.128--0.142, raises nonlinear-boundary AUC from 0.699 to 0.898. Furthermore, experiments across TFM backbones demonstrate the effectiveness and generality of SkillTFM.", "arxiv_id": "2608.06137", "arxiv_url": "https://arxiv.org/abs/2608.06137", "authors": ["Yi He", "Zhengkang Guan", "Anpeng Wu", "Peng Cui", "Fei Wu", "Kun Kuang"], "brief": "\u8bba\u6587\u63d0\u51fa SkillTFM\uff0c\u5c06\u8868\u683c\u57fa\u7840\u6a21\u578b\u7684\u4efb\u52a1\u9002\u914d\u4ece\u53c2\u6570\u5fae\u8c03\u8f6c\u4e3a\u201c\u6280\u80fd\u5e93\u201d\u7684\u95e8\u63a7\u6f14\u5316\u3002\u7cfb\u7edf\u901a\u8fc7\u8bc6\u522b\u4efb\u52a1\u8fb9\u754c\u8bc1\u636e\u548c\u57fa\u6a21\u578b\u5931\u6548\u6a21\u5f0f\uff0c\u68c0\u7d22\u5e76\u6269\u5c55\u53ef\u9a8c\u8bc1\u6280\u80fd\uff0c\u4ece\u800c\u5728\u65e0\u9700\u8bad\u7ec3\u548c\u989d\u5916\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u9884\u6d4b\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06137", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u53ef\u9a8c\u8bc1\u3001\u53ef\u6269\u5c55\u7684\u6280\u80fd\u5e93\uff0c\u7ed3\u5408\u8fb9\u754c\u8bc1\u636e\u8bc6\u522b\u4e0e\u95e8\u63a7\u6280\u80fd\u6f14\u5316\uff0c\u5b9e\u73b0\u8bad\u7ec3-free \u9002\u914d", "\u663e\u5f0f\u523b\u753b\u4efb\u52a1\u7ed3\u6784\u3001\u5206\u5e03\u504f\u79fb\u548c\u57fa\u7840\u6a21\u578b\u5931\u8d25\u6a21\u5f0f\uff0c\u518d\u9009\u62e9\u6216\u751f\u6210\u53ef\u590d\u7528\u6280\u80fd", "\u5728\u6a21\u62df\u8fb9\u754c\u548c\u771f\u5b9e\u7535\u4ef7\u9884\u6d4b\u4e2d\u63d0\u5347 AUC 0.128--0.142\uff0c\u975e\u7ebf\u6027\u8fb9\u754c AUC \u4ece 0.699 \u63d0\u5347\u5230 0.898"], "keywords": ["\u8868\u683c\u5b66\u4e60", "\u57fa\u7840\u6a21\u578b", "\u514d\u8bad\u7ec3\u9002\u914d", "\u6280\u80fd\u5e93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06137v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SkillTFM: Gated Skill Evolution for Training-Free Adaptation of Tabular Foundation Models", "tldr": "SkillTFM\u7528\u6280\u80fd\u6f14\u5316\u514d\u8bad\u7ec3\u9002\u914d\u8868\u683c\u57fa\u7840\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SkillTFM\uff0c\u5c06\u8868\u683c\u57fa\u7840\u6a21\u578b\u7684\u4efb\u52a1\u9002\u914d\u4ece\u53c2\u6570\u5fae\u8c03\u8f6c\u4e3a\u201c\u6280\u80fd\u5e93\u201d\u7684\u95e8\u63a7\u6f14\u5316\u3002\u7cfb\u7edf\u901a\u8fc7\u8bc6\u522b\u4efb\u52a1\u8fb9\u754c\u8bc1\u636e\u548c\u57fa\u6a21\u578b\u5931\u6548\u6a21\u5f0f\uff0c\u68c0\u7d22\u5e76\u6269\u5c55\u53ef\u9a8c\u8bc1\u6280\u80fd\uff0c\u4ece\u800c\u5728\u65e0\u9700\u8bad\u7ec3\u548c\u989d\u5916\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u9884\u6d4b\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u8868\u683c\u57fa\u7840\u6a21\u578b\u843d\u5730\u4e2d\u7684\u5206\u5e03\u504f\u79fb\u548c\u7279\u5f81\u8bed\u4e49\u5f02\u8d28\u6027\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u65e0\u9700\u5fae\u8c03\u7684\u9002\u914d\u8def\u5f84\uff0c\u53ef\u80fd\u964d\u4f4e\u8868\u683c\u6a21\u578b\u5728\u5de5\u4e1a\u3001\u91d1\u878d\u3001\u533b\u7597\u7b49\u573a\u666f\u4e2d\u7684\u90e8\u7f72\u6210\u672c\u3002"}, {"abstract": "Task difficulty dictates an agent\u0027s likelihood of success, and estimating it without rollouts means forecasting this directly from a task description before executing costly simulations in stateful environments. Reliable estimates would therefore allow environment designers to calibrate evaluation benchmarks and construct progressive training curricula. This becomes increasingly important as agents move into long-horizon domains, where empirical trial-and-error is a severe computational bottleneck. Prior work on early prediction is limited to static tasks or isolated coding environments, often relying on narrow features and inaccurate evaluation metrics. We study \\textit{ex ante} difficulty prediction across 17 agentic benchmarks spanning coding, mathematics, machine learning, web navigation, function calling, and other domains. We show that AUC can mask poor difficulty estimates, identify token-level entropy as a useful predictive signal, and show how residuals between expected and observed difficulty can expose hidden environment flaws such as contamination and infeasibility.", "arxiv_id": "2608.05797", "arxiv_url": "https://arxiv.org/abs/2608.05797", "authors": ["Stefan Krsteski", "Charlotte Meyer"], "brief": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u4ec5\u6839\u636e\u4efb\u52a1\u63cf\u8ff0\uff0c\u5728\u4e0d\u6267\u884c\u6602\u8d35\u73af\u5883\u4ea4\u4e92\u7684\u60c5\u51b5\u4e0b\u9884\u6d4b\u667a\u80fd\u4f53\u4efb\u52a1\u96be\u5ea6\u3002\u4f5c\u8005\u8986\u76d617\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5206\u6790\u4e0d\u540c\u9886\u57df\u4e2d\u4e8b\u524d\u96be\u5ea6\u4f30\u8ba1\u7684\u53ef\u9760\u4fe1\u53f7\u4e0e\u8bc4\u4f30\u9677\u9631\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05797", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8bc4\u4f30\u6db5\u76d6\u4ee3\u7801\u3001\u6570\u5b66\u3001\u673a\u5668\u5b66\u4e60\u3001\u7f51\u9875\u5bfc\u822a\u3001\u51fd\u6570\u8c03\u7528\u7b4917\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u9762\u5411\u957f\u7a0b\u6709\u72b6\u6001\u4efb\u52a1\u573a\u666f", "\u6307\u51faAUC\u53ef\u80fd\u63a9\u76d6\u96be\u5ea6\u4f30\u8ba1\u8d28\u91cf\u5dee\u7684\u95ee\u9898\uff0c\u5f3a\u8c03\u9700\u8981\u66f4\u8d34\u8fd1\u6821\u51c6\u8bef\u5dee\u7684\u8bc4\u4f30\u65b9\u5f0f", "\u53d1\u73b0token\u7ea7\u71b5\u662f\u6709\u6548\u9884\u6d4b\u4fe1\u53f7\uff0c\u5e76\u53ef\u901a\u8fc7\u9884\u6d4b\u6b8b\u5dee\u53d1\u73b0\u6570\u636e\u6c61\u67d3\u3001\u4efb\u52a1\u4e0d\u53ef\u884c\u7b49\u9690\u85cf\u73af\u5883\u7f3a\u9677"], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u4efb\u52a1\u96be\u5ea6\u9884\u6d4b", "\u8bfe\u7a0b\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05797v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Predicting Task Difficulty Without Rollouts", "tldr": "\u65e0\u9700\u8bd5\u8dd1\u5373\u53ef\u9884\u6d4b\u667a\u80fd\u4f53\u4efb\u52a1\u96be\u5ea6", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u4ec5\u6839\u636e\u4efb\u52a1\u63cf\u8ff0\uff0c\u5728\u4e0d\u6267\u884c\u6602\u8d35\u73af\u5883\u4ea4\u4e92\u7684\u60c5\u51b5\u4e0b\u9884\u6d4b\u667a\u80fd\u4f53\u4efb\u52a1\u96be\u5ea6\u3002\u4f5c\u8005\u8986\u76d617\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5206\u6790\u4e0d\u540c\u9886\u57df\u4e2d\u4e8b\u524d\u96be\u5ea6\u4f30\u8ba1\u7684\u53ef\u9760\u4fe1\u53f7\u4e0e\u8bc4\u4f30\u9677\u9631\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u4efb\u52a1\u96be\u5ea6\u9884\u6d4b\u4ece\u9759\u6001\u6216\u5355\u4e00\u4ee3\u7801\u4efb\u52a1\u6269\u5c55\u5230\u591a\u9886\u57df\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u6709\u52a9\u4e8e\u4f4e\u6210\u672c\u6784\u5efa\u8bc4\u6d4b\u96c6\u3001\u8bbe\u8ba1\u8bfe\u7a0b\u5b66\u4e60\uff0c\u5e76\u63d0\u524d\u8bca\u65ad\u73af\u5883\u8d28\u91cf\u95ee\u9898\u3002"}, {"abstract": "Retrieval-augmented generation over long documents is dominated by one design: chunk the text, embed the chunks, and surface the top-k nearest neighbours of the query. We argue that for an important class of documents -- financial statements, audit reports, regulatory returns -- this design is structurally unsound, and we make the argument measurable. On a 780-page government financial report, 86.8% of content lines are table rows, thousands of near-identical figures compete in one embedding space, and a figure inherits its unit from a header a median of 13 lines above it -- so a chunk boundary routinely separates a number from whether it is in lakh or crore, an error of two orders of magnitude. A table-aware chunker built as a steelman fixes the unit problem but leaves 27-30% of numeric chunks with no fiscal-year header at every chunk size we tried. We propose READ (Reliable Embedding-free Agentic Document-search), in which an agent reads the raw document through three deterministic operations -- normalized lexical search, structural navigation, and bounded span reads -- exposed over the Model Context Protocol, so a trajectory is a replayable audit trail, not an opaque similarity score. On 51 verified questions READ answers 58.8% against dense retrieval\u0027s 15.7% (p_Holm = 2 x 10^-5) -- or 35.3% tuned, which READ still leads by 23.5 points (p_Holm = 0.017). An agent given the same loop but a top-k tool reaches only 27.5%, locating the gain in the interface rather than in iteration. We also report what the evidence does not support: BM25 is statistically indistinguishable from READ, so our result separates embedding-based from embedding-free retrieval, not agentic from lexical search.", "arxiv_id": "2608.06305", "arxiv_url": "https://arxiv.org/abs/2608.06305", "authors": ["Sagar Tamang", "Ayush Vyas", "Tabarakul Hazarika"], "brief": "\u8bba\u6587\u63d0\u51fa READ\uff0c\u4e00\u79cd\u9762\u5411\u957f\u7bc7\u7ed3\u6784\u5316\u6587\u6863\u7684\u65e0\u5d4c\u5165\u667a\u80fd\u4f53\u68c0\u7d22\u6846\u67b6\uff0c\u901a\u8fc7\u89c4\u8303\u5316\u8bcd\u6cd5\u641c\u7d22\u3001\u7ed3\u6784\u5bfc\u822a\u548c\u6709\u754c\u7247\u6bb5\u8bfb\u53d6\u4e09\u7c7b\u786e\u5b9a\u6027\u64cd\u4f5c\uff0c\u8ba9\u68c0\u7d22\u8fc7\u7a0b\u53ef\u56de\u653e\u3001\u53ef\u5ba1\u8ba1\u3002\u4f5c\u8005\u5728\u653f\u5e9c\u8d22\u52a1\u62a5\u544a\u95ee\u7b54\u4e2d\u9a8c\u8bc1\uff0c\u4f20\u7edfTop-K dense retrieval\u5728\u8868\u683c\u3001\u5355\u4f4d\u548c\u5e74\u5ea6\u4e0a\u4e0b\u6587\u4e0a\u5b58\u5728\u7ed3\u6784\u6027\u7f3a\u9677\u3002", "categories": ["cs.AI", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06305", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5728780\u9875\u653f\u5e9c\u8d22\u52a1\u62a5\u544a\u4e2d\uff0c86.8%\u7684\u5185\u5bb9\u884c\u662f\u8868\u683c\u884c\uff0c\u6570\u503c\u5355\u4f4d\u5e38\u7531\u4e0a\u65b9\u8868\u5934\u7ee7\u627f\uff0cchunk\u8fb9\u754c\u5bb9\u6613\u9020\u6210\u5355\u4f4d\u9519\u8bef", "READ\u572851\u4e2a\u9a8c\u8bc1\u95ee\u9898\u4e0a\u8fbe\u523058.8%\u51c6\u786e\u7387\uff0c\u663e\u8457\u9ad8\u4e8edense retrieval\u768415.7%\uff0c\u4e5f\u9ad8\u4e8e\u8c03\u53c2\u540e\u768435.3%", "\u540c\u6837\u667a\u80fd\u4f53\u5faa\u73af\u82e5\u53ea\u914dTop-K\u5de5\u5177\u4ec5\u8fbe27.5%\uff0c\u8bf4\u660e\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u68c0\u7d22\u63a5\u53e3\uff1b\u4f46BM25\u4e0eREAD\u7edf\u8ba1\u4e0a\u65e0\u663e\u8457\u5dee\u5f02"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06305v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Top-K: Replacing Black-Box Retrieval with Interpretable Agentic Operations", "tldr": "\u7528\u53ef\u5ba1\u8ba1\u667a\u80fd\u4f53\u68c0\u7d22\u66ff\u4ee3\u9ed1\u7bb1Top-K\u5d4c\u5165\u68c0\u7d22", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa READ\uff0c\u4e00\u79cd\u9762\u5411\u957f\u7bc7\u7ed3\u6784\u5316\u6587\u6863\u7684\u65e0\u5d4c\u5165\u667a\u80fd\u4f53\u68c0\u7d22\u6846\u67b6\uff0c\u901a\u8fc7\u89c4\u8303\u5316\u8bcd\u6cd5\u641c\u7d22\u3001\u7ed3\u6784\u5bfc\u822a\u548c\u6709\u754c\u7247\u6bb5\u8bfb\u53d6\u4e09\u7c7b\u786e\u5b9a\u6027\u64cd\u4f5c\uff0c\u8ba9\u68c0\u7d22\u8fc7\u7a0b\u53ef\u56de\u653e\u3001\u53ef\u5ba1\u8ba1\u3002\u4f5c\u8005\u5728\u653f\u5e9c\u8d22\u52a1\u62a5\u544a\u95ee\u7b54\u4e2d\u9a8c\u8bc1\uff0c\u4f20\u7edfTop-K dense retrieval\u5728\u8868\u683c\u3001\u5355\u4f4d\u548c\u5e74\u5ea6\u4e0a\u4e0b\u6587\u4e0a\u5b58\u5728\u7ed3\u6784\u6027\u7f3a\u9677\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u957f\u6587\u6863RAG\u4e2d\u9ed8\u8ba4\u7684\u201c\u5207\u5757+\u5d4c\u5165+Top-K\u201d\u8303\u5f0f\uff0c\u5f3a\u8c03\u5728\u8d22\u52a1\u3001\u5ba1\u8ba1\u3001\u76d1\u7ba1\u7b49\u9ad8\u98ce\u9669\u6587\u6863\u4e2d\uff0c\u53ef\u89e3\u91ca\u3001\u53ef\u5ba1\u8ba1\u7684\u786e\u5b9a\u6027\u68c0\u7d22\u63a5\u53e3\u53ef\u80fd\u6bd4\u9ed1\u7bb1\u76f8\u4f3c\u5ea6\u68c0\u7d22\u66f4\u53ef\u9760\u3002"}, {"abstract": "Web agents observe a browser through text, pixels, or both, and the choice is usually fixed once for all tasks. We measure six observation modes across eight site-model combinations (cells) on VisualWebArena and WebArena and ask what choosing per task would buy. The modes are complementary: each solves tasks the others miss, they fail in structurally different ways, and the best choice reverses between task sets. The obvious prize, an oracle that picks a winning mode for every task, looks large but is inflated by run-to-run noise: rerunning the same mode on the same tasks changes 12-14% of outcomes, so a second run of a mode already in hand gains about as much as adding a new one. What survives is a cost bound: sending only the tasks no mode solves to the cheapest mode cuts cost by 9.5-30.6% in 8 of 8 cells at unchanged success. We then test five routing policies (picking the mode, deciding when to spend on the strong mode, a zero-cost rule read off the task text, a confidence cascade, and pooled cost tiers), and none robustly beats simply fixing one well-chosen mode; the one exception is a fragile result in our sparsest cell. The central obstruction is that routing supervision is produced at the agent\u0027s success rate: the weaker the agent, the fewer labels a router gets, exactly where routing would be most valuable. This limit belongs to today\u0027s agents rather than to routing itself. Label supply and routing opportunity rise together (correlation 0.95 across cells), so a stronger agent can overturn the result, and we report the rerun noise bands and the full measurement protocol.", "arxiv_id": "2608.06171", "arxiv_url": "https://arxiv.org/abs/2608.06171", "authors": ["Jiaming Wei", "Zekun Wu", "Adriano Koshiyama", "Maria Perez-Ortiz"], "brief": "\u672c\u6587\u5728 VisualWebArena \u4e0e WebArena \u4e0a\u8bc4\u4f30\u6587\u672c\u3001\u50cf\u7d20\u53ca\u6df7\u5408\u7b49\u516d\u79cd\u6d4f\u89c8\u5668\u89c2\u6d4b\u6a21\u5f0f\uff0c\u7814\u7a76\u6309\u4efb\u52a1\u9009\u62e9\u89c2\u6d4b\u6a21\u5f0f\u80fd\u5e26\u6765\u591a\u5c11\u6536\u76ca\u3002\u7ed3\u679c\u663e\u793a\u4e0d\u540c\u6a21\u5f0f\u4e92\u8865\uff0c\u4f46\u53ef\u5b66\u4e60\u8def\u7531\u5668\u5f88\u96be\u7a33\u5b9a\u8d85\u8fc7\u56fa\u5b9a\u9009\u62e9\u4e00\u4e2a\u5f3a\u6a21\u5f0f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06171", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u516d\u79cd\u89c2\u6d4b\u6a21\u5f0f\u5728\u516b\u4e2a\u7ad9\u70b9-\u6a21\u578b\u7ec4\u5408\u4e2d\u8868\u73b0\u4e92\u8865\uff1a\u5404\u81ea\u80fd\u89e3\u51b3\u5176\u4ed6\u6a21\u5f0f\u5931\u8d25\u7684\u4efb\u52a1\uff0c\u4e14\u5931\u8d25\u7ed3\u6784\u4e0d\u540c\u3002", "\u6309\u4efb\u52a1\u9009\u62e9\u201c\u6700\u4f18\u6a21\u5f0f\u201d\u7684 oracle \u6536\u76ca\u88ab\u8fd0\u884c\u968f\u673a\u6027\u9ad8\u4f30\uff1a\u540c\u4e00\u6a21\u5f0f\u91cd\u8dd1\u4f1a\u6539\u53d8 12-14% \u7684\u4efb\u52a1\u7ed3\u679c\uff0c\u91cd\u8dd1\u5df2\u6709\u6a21\u5f0f\u7684\u6536\u76ca\u63a5\u8fd1\u65b0\u589e\u6a21\u5f0f\u3002", "\u5b9e\u9645\u53ef\u4fdd\u7559\u7684\u6536\u76ca\u4e3b\u8981\u662f\u6210\u672c\u4f18\u5316\uff1a\u5c06\u65e0\u6a21\u5f0f\u53ef\u89e3\u7684\u4efb\u52a1\u53d1\u9001\u5230\u6700\u4fbf\u5b9c\u6a21\u5f0f\uff0c\u53ef\u5728\u6210\u529f\u7387\u4e0d\u53d8\u4e0b\u4e3a 8/8 \u4e2a\u7ec4\u5408\u8282\u7701 9.5-30.6% \u6210\u672c\u3002"], "keywords": ["\u667a\u80fd\u4f53", "Web\u81ea\u52a8\u5316", "\u591a\u6a21\u6001", "\u8def\u7531\u7b56\u7565"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06171v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Routing Is Least Learnable Where It Is Most Valuable: Bounds on Representation Routing for Web Agents", "tldr": "Web\u667a\u80fd\u4f53\u8868\u5f81\u8def\u7531\u6700\u6709\u4ef7\u503c\u5904\u6700\u96be\u5b66", "upvotes": 0, "what_it_is": "\u672c\u6587\u5728 VisualWebArena \u4e0e WebArena \u4e0a\u8bc4\u4f30\u6587\u672c\u3001\u50cf\u7d20\u53ca\u6df7\u5408\u7b49\u516d\u79cd\u6d4f\u89c8\u5668\u89c2\u6d4b\u6a21\u5f0f\uff0c\u7814\u7a76\u6309\u4efb\u52a1\u9009\u62e9\u89c2\u6d4b\u6a21\u5f0f\u80fd\u5e26\u6765\u591a\u5c11\u6536\u76ca\u3002\u7ed3\u679c\u663e\u793a\u4e0d\u540c\u6a21\u5f0f\u4e92\u8865\uff0c\u4f46\u53ef\u5b66\u4e60\u8def\u7531\u5668\u5f88\u96be\u7a33\u5b9a\u8d85\u8fc7\u56fa\u5b9a\u9009\u62e9\u4e00\u4e2a\u5f3a\u6a21\u5f0f\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u5f53\u524d Web \u667a\u80fd\u4f53\u4e2d\u201c\u8868\u5f81\u8def\u7531\u201d\u7684\u6838\u5fc3\u74f6\u9888\u4e0d\u662f\u8def\u7531\u601d\u60f3\u672c\u8eab\uff0c\u800c\u662f\u76d1\u7763\u4fe1\u53f7\u53d7\u9650\u4e8e\u667a\u80fd\u4f53\u6210\u529f\u7387\uff1a\u8d8a\u9700\u8981\u8def\u7531\u7684\u5f31\u667a\u80fd\u4f53\uff0c\u8d8a\u7f3a\u5c11\u53ef\u8bad\u7ec3\u8def\u7531\u5668\u7684\u6807\u7b7e\u3002\u8fd9\u4e3a\u591a\u6a21\u6001 Web agent \u7684\u8bc4\u6d4b\u3001\u6210\u672c\u63a7\u5236\u4e0e\u8def\u7531\u7b56\u7565\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u91cd\u8981\u8fb9\u754c\u3002"}, {"abstract": "Existing guidance identifies excessive agency, excessive permission, weak task-bound authorization, and inadequate agent controls as important risks. Control frameworks also describe capabilities for constraining, authorizing, observing, validating, and responding to agent activity. Yet security programs still need a way to manage persistent deployed instances that span components and outlive any one event. We propose the agentic posture vulnerability (APV) as a task-conditioned vulnerability-management abstraction: a durable record for a composed agent-control exposure. One posture may produce different runtime manifestations across tasks; APV links those manifestations to the invariant posture and remains open until authority is narrowed, a missing control is added, risk is accepted, or closure is verified. APV is not proposed as a new root-cause class of risk; it operationalizes existing excessive-agency, authorization, and control-composition weaknesses. We distinguish APVs from CVE-addressable product defects, OWASP Excessive Agency, Agent Baseline control outcomes, and the runtime authorization-execution gap. We then provide a field vignette, a thresholded definition, six recurring APV patterns, a vulnerability lifecycle, a minimum record, a control-and-closure matrix, tooling implications, and a testable research agenda.", "arxiv_id": "2608.05884", "arxiv_url": "https://arxiv.org/abs/2608.05884", "authors": ["Shayell Aharon Salomon Amir Shaked Matan Noga"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u667a\u80fd\u4f53\u59ff\u6001\u6f0f\u6d1e\u201d\uff08APV\uff09\u4f5c\u4e3a\u4e00\u79cd\u9762\u5411\u4efb\u52a1\u6761\u4ef6\u7684\u6f0f\u6d1e\u7ba1\u7406\u62bd\u8c61\uff0c\u7528\u4e8e\u8bb0\u5f55\u548c\u8ddf\u8e2aAI\u7f16\u7801\u667a\u80fd\u4f53\u4e2d\u7531\u6743\u9650\u3001\u6388\u6743\u4e0e\u63a7\u5236\u7ec4\u5408\u4e0d\u5f53\u5f62\u6210\u7684\u6301\u4e45\u66b4\u9732\u9762\u3002\u5b83\u5f3a\u8c03\u8fd9\u7c7b\u98ce\u9669\u4e0d\u4e00\u5b9a\u662f\u53ef\u5206\u914dCVE\u7684\u4ea7\u54c1\u7f3a\u9677\uff0c\u800c\u662f\u90e8\u7f72\u540e\u8de8\u7ec4\u4ef6\u3001\u8de8\u4efb\u52a1\u6301\u7eed\u5b58\u5728\u7684\u5b89\u5168\u59ff\u6001\u95ee\u9898\u3002", "categories": ["cs.CR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05884", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["APV\u5c06\u4e0d\u540c\u4efb\u52a1\u4e2d\u7684\u8fd0\u884c\u65f6\u98ce\u9669\u8868\u73b0\u5173\u8054\u5230\u540c\u4e00\u4e2a\u4e0d\u53d8\u7684\u667a\u80fd\u4f53\u63a7\u5236\u59ff\u6001\uff0c\u76f4\u5230\u6743\u9650\u6536\u7a84\u3001\u8865\u5145\u63a7\u5236\u3001\u63a5\u53d7\u98ce\u9669\u6216\u9a8c\u8bc1\u5173\u95ed\u4e3a\u6b62", "\u533a\u5206APV\u4e0eCVE\u4ea7\u54c1\u6f0f\u6d1e\u3001OWASP Excessive Agency\u3001Agent Baseline\u63a7\u5236\u7ed3\u679c\u4ee5\u53ca\u8fd0\u884c\u65f6\u6388\u6743-\u6267\u884c\u5dee\u8ddd", "\u7ed9\u51fa\u516d\u7c7b\u5e38\u89c1APV\u6a21\u5f0f\u3001\u6f0f\u6d1e\u751f\u547d\u5468\u671f\u3001\u6700\u5c0f\u8bb0\u5f55\u5b57\u6bb5\u3001\u63a7\u5236\u4e0e\u5173\u95ed\u77e9\u9635\u3001\u5de5\u5177\u5316\u5f71\u54cd\u548c\u53ef\u68c0\u9a8c\u7814\u7a76\u8bae\u7a0b"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u4ee3\u7801\u667a\u80fd\u4f53", "\u6f0f\u6d1e\u7ba1\u7406", "\u6743\u9650\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05884v1", "published_at": "2026-08-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "The Vulnerability With No CVE: Managing Persistent Gaps Between Mandate and Authority in AI Coding Agents", "tldr": "\u63d0\u51faAI\u7f16\u7801\u667a\u80fd\u4f53\u7684APV\u6f0f\u6d1e\u7ba1\u7406\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u667a\u80fd\u4f53\u59ff\u6001\u6f0f\u6d1e\u201d\uff08APV\uff09\u4f5c\u4e3a\u4e00\u79cd\u9762\u5411\u4efb\u52a1\u6761\u4ef6\u7684\u6f0f\u6d1e\u7ba1\u7406\u62bd\u8c61\uff0c\u7528\u4e8e\u8bb0\u5f55\u548c\u8ddf\u8e2aAI\u7f16\u7801\u667a\u80fd\u4f53\u4e2d\u7531\u6743\u9650\u3001\u6388\u6743\u4e0e\u63a7\u5236\u7ec4\u5408\u4e0d\u5f53\u5f62\u6210\u7684\u6301\u4e45\u66b4\u9732\u9762\u3002\u5b83\u5f3a\u8c03\u8fd9\u7c7b\u98ce\u9669\u4e0d\u4e00\u5b9a\u662f\u53ef\u5206\u914dCVE\u7684\u4ea7\u54c1\u7f3a\u9677\uff0c\u800c\u662f\u90e8\u7f72\u540e\u8de8\u7ec4\u4ef6\u3001\u8de8\u4efb\u52a1\u6301\u7eed\u5b58\u5728\u7684\u5b89\u5168\u59ff\u6001\u95ee\u9898\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u4e3aAI\u7f16\u7801\u667a\u80fd\u4f53\u5b89\u5168\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u5b9e\u9645\u8fd0\u7ef4\u7684\u6f0f\u6d1e\u7ba1\u7406\u5355\u4f4d\uff0c\u5e2e\u52a9\u5b89\u5168\u56e2\u961f\u5904\u7406\u90a3\u4e9b\u65e0\u6cd5\u7b80\u5355\u5f52\u5165CVE\u3001\u5374\u4f1a\u957f\u671f\u5b58\u5728\u4e8e\u6743\u9650\u548c\u63a7\u5236\u914d\u7f6e\u4e2d\u7684\u98ce\u9669\u3002"}, {"abstract": "Agent self-evolution updates an agent\u0027s persistent state from prior experience and reuses it to solve related tasks more effectively. Evaluating self-evolution is difficult: existing benchmarks provide limited coverage of economically valuable task domains, do not always design training and test tasks such that test-time gains can be attributed to training experience, and remain vulnerable to data contamination. We present GDPevo, an evolution-native benchmark grounded in GDP-related enterprise workflows, together with the fully automated data pipeline that generates it. Its core mechanism, rule hybridization, decomposes each enterprise workflow into atomic business rules, distributes subsets of these rules across training tasks, and recombines them in held-out test tasks so that test-time gains are attributable. GDPevo spans CRM, ERP, finance, healthcare, legal, and data-centric workflows. Its V1 release contains 120 tasks in 12 groups, with five training and five held-out test tasks per group. Full automation enables the pipeline to expand the suite to 240 tasks in 24 groups (V2) within two days, providing a practical response to contamination. Using GDPevo, we evaluate four agents, each comprising a harness and a model, under four supervision types. Self-evolution consistently improves held-out accuracy by up to 16.44 percentage points. But the best evolved agents remain far below the fully informed oracle ceiling of 91.6%, indicating that the self-evolution ability of current agents remains far from fully realized. We publicly release the pipeline, benchmark, and full evaluation results at https://github.com/Prism-Shadow/GDPevo.", "arxiv_id": "2608.03764", "arxiv_url": "https://arxiv.org/abs/2608.03764", "authors": ["Leijun Zhou", "Zhihao Liu", "Xiang Qu", "Chenxu Liu", "Yifei Liu", "Yanke Yu", "Jingzhe Xu", "Xuejun Wu", "Buyue Qian", "Xi Chen", "Yaowei Zheng", "Junhao Hu"], "brief": "\u8bba\u6587\u63d0\u51fa GDPevo\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e GDP \u76f8\u5173\u4f01\u4e1a\u5de5\u4f5c\u6d41\u7684\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u57fa\u51c6\uff0c\u5e76\u914d\u5957\u5168\u81ea\u52a8\u6570\u636e\u751f\u6210\u6d41\u6c34\u7ebf\u3002\u5b83\u901a\u8fc7\u8bad\u7ec3\u4efb\u52a1\u4e0e\u7559\u51fa\u6d4b\u8bd5\u4efb\u52a1\u7684\u89c4\u5219\u91cd\u7ec4\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u80fd\u5426\u4ece\u7ecf\u9a8c\u4e2d\u66f4\u65b0\u6301\u4e45\u72b6\u6001\u5e76\u8fc1\u79fb\u5230\u76f8\u5173\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Prism-Shadow/GDPevo", "github_stars": 48, "hf_url": "https://huggingface.co/papers/2608.03764", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6838\u5fc3\u673a\u5236\u662f\u201c\u89c4\u5219\u6df7\u5408\u201d\uff1a\u5c06\u4f01\u4e1a\u5de5\u4f5c\u6d41\u62c6\u6210\u539f\u5b50\u4e1a\u52a1\u89c4\u5219\uff0c\u8bad\u7ec3\u96c6\u8986\u76d6\u90e8\u5206\u89c4\u5219\uff0c\u6d4b\u8bd5\u96c6\u91cd\u7ec4\u7559\u51fa\u89c4\u5219\uff0c\u4f7f\u6d4b\u8bd5\u63d0\u5347\u53ef\u5f52\u56e0\u4e8e\u8bad\u7ec3\u7ecf\u9a8c\u3002", "\u8986\u76d6 CRM\u3001ERP\u3001\u91d1\u878d\u3001\u533b\u7597\u3001\u6cd5\u5f8b\u548c\u6570\u636e\u4e2d\u5fc3\u5de5\u4f5c\u6d41\uff1bV1 \u542b 12 \u7ec4\u5171 120 \u4e2a\u4efb\u52a1\uff0c\u6bcf\u7ec4 5 \u4e2a\u8bad\u7ec3\u4efb\u52a1\u548c 5 \u4e2a\u6d4b\u8bd5\u4efb\u52a1\u3002", "\u81ea\u52a8\u5316\u6d41\u6c34\u7ebf\u53ef\u5728\u4e24\u5929\u5185\u6269\u5c55\u5230 V2 \u7684 24 \u7ec4 240 \u4e2a\u4efb\u52a1\uff0c\u4ee5\u7f13\u89e3\u57fa\u51c6\u6570\u636e\u6c61\u67d3\u95ee\u9898\uff1b\u5b9e\u9a8c\u4e2d\u81ea\u8fdb\u5316\u6700\u9ad8\u5e26\u6765 16.44 \u4e2a\u767e\u5206\u70b9\u7684\u7559\u51fa\u51c6\u786e\u7387\u63d0\u5347\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u8fdb\u5316", "\u57fa\u51c6\u8bc4\u6d4b", "\u4f01\u4e1a\u4efb\u52a1"], "num_comments": 2, "on_hf": true, "organization": "Prism Shadow", "pdf_url": "https://arxiv.org/pdf/2608.03764v1", "published_at": "2026-08-04", "score": 0.321, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03764.png", "title": "GDPevo: Evaluating Agent Self-Evolution on Real Business Tasks", "tldr": "\u9762\u5411\u4f01\u4e1a\u4efb\u52a1\u8bc4\u6d4b\u667a\u80fd\u4f53\u81ea\u8fdb\u5316", "upvotes": 21, "what_it_is": "\u8bba\u6587\u63d0\u51fa GDPevo\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e GDP \u76f8\u5173\u4f01\u4e1a\u5de5\u4f5c\u6d41\u7684\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u57fa\u51c6\uff0c\u5e76\u914d\u5957\u5168\u81ea\u52a8\u6570\u636e\u751f\u6210\u6d41\u6c34\u7ebf\u3002\u5b83\u901a\u8fc7\u8bad\u7ec3\u4efb\u52a1\u4e0e\u7559\u51fa\u6d4b\u8bd5\u4efb\u52a1\u7684\u89c4\u5219\u91cd\u7ec4\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u80fd\u5426\u4ece\u7ecf\u9a8c\u4e2d\u66f4\u65b0\u6301\u4e45\u72b6\u6001\u5e76\u8fc1\u79fb\u5230\u76f8\u5173\u4efb\u52a1\u3002", "why_notable": "GDPevo \u5c06\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u8bc4\u6d4b\u4ece\u73a9\u5177\u4efb\u52a1\u63a8\u8fdb\u5230\u9ad8\u7ecf\u6d4e\u4ef7\u503c\u4f01\u4e1a\u573a\u666f\uff0c\u5e76\u901a\u8fc7\u53ef\u6269\u5c55\u751f\u6210\u673a\u5236\u548c\u89c4\u5219\u53ef\u5f52\u56e0\u8bbe\u8ba1\u63d0\u5347\u4e86\u8bc4\u6d4b\u53ef\u4fe1\u5ea6\uff1b\u540c\u65f6\u7ed3\u679c\u663e\u793a\u5f53\u524d\u667a\u80fd\u4f53\u8ddd\u79bb 91.6% \u7684 oracle \u4e0a\u9650\u4ecd\u6709\u663e\u8457\u5dee\u8ddd\u3002"}, {"abstract": "Long-horizon search agents must make multiple sequential actions (steps) to search, retrieve, verify, and integrate evidence to reach a final answer. However, existing methods for training these agents typically treat all steps within a trajectory uniformly during both supervised fine-tuning (SFT) and reinforcement learning (RL), failing to distinguish useful actions from erroneous or redundant ones. In this paper, we propose Answer-Backtracked Credit Assignment (ABC), a fine-grained credit assignment framework for training long-horizon search agents by converting sparse trajectory-level outcomes into dense step-level supervision that rewards useful actions (even in failed trajectories) while suppressing erroneous or redundant actions. Specifically, given a potentially obscure query and its corresponding ground-truth answer, ABC first performs Answer-Backtracked Clue Recovery, which traces back from the answer to recover intermediate clues required to solve the question. It then applies Clue-Anchored Step Scoring to evaluate each search step against these clues, converting sparse binary outcome supervision into dense step-level rewards. Based on these rewards, we develop ABC-SFT, which reweights the loss of each turn, and ABC-GRPO, which uses the step-level scores as rewards in GRPO. Building on this framework, we train ABSeeker based on Qwen3.5-4B with only 8.5k examples. ABSeeker achieves 37.3% on BrowseComp and 39.1% on BrowseComp-ZH. With context management, the scores further improve to 55.3% and 52.9%, respectively, significantly outperforming same-scale (4B) agents and even matching the performance of larger ones (approximately 30B). These results demonstrate the effectiveness of answer-backtracked step-level credit assignment for training long-horizon search agents.", "arxiv_id": "2608.05102", "arxiv_url": "https://arxiv.org/abs/2608.05102", "authors": ["Yijun Lu", "Rui Ye", "Jiajun Wang", "Yuwen Du", "Tian Jin", "Songhua Liu", "Siheng Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Answer-Backtracked Credit Assignment\uff08ABC\uff09\uff0c\u5c06\u641c\u7d22\u8f68\u8ff9\u7684\u7a00\u758f\u6210\u8d25\u4fe1\u53f7\u8f6c\u5316\u4e3a\u7ec6\u7c92\u5ea6\u7684\u6b65\u9aa4\u7ea7\u76d1\u7763\u3002\u57fa\u4e8e\u8be5\u6846\u67b6\u8bad\u7ec3\u7684 ABSeeker \u4ec5\u7528 8.5k \u6837\u672c\u5c31\u5728 BrowseComp/\u4e2d\u6587\u7248\u4e0a\u663e\u8457\u63d0\u5347\u957f\u7a0b\u68c0\u7d22\u95ee\u7b54\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05102", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["ABC \u5148\u4ece\u6807\u51c6\u7b54\u6848\u53cd\u5411\u6062\u590d\u89e3\u9898\u6240\u9700\u7684\u4e2d\u95f4\u7ebf\u7d22\uff0c\u518d\u7528\u8fd9\u4e9b\u7ebf\u7d22\u5bf9\u6bcf\u4e2a\u641c\u7d22\u6b65\u9aa4\u8fdb\u884c\u6253\u5206\u3002", "\u63d0\u51fa ABC-SFT \u4e0e ABC-GRPO\uff1a\u524d\u8005\u6309\u6b65\u9aa4\u5206\u6570\u91cd\u52a0\u6743\u76d1\u7763\u5fae\u8c03\u635f\u5931\uff0c\u540e\u8005\u5c06\u6b65\u9aa4\u5206\u6570\u4f5c\u4e3a GRPO \u5956\u52b1\u3002", "\u57fa\u4e8e Qwen3.5-4B \u8bad\u7ec3\u7684 ABSeek
