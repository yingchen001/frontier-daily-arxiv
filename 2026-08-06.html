the real source latent with a task-matched corruption, and the transport timing during Ordinary Differential Equation (ODE) integration. The corruption is matched to the task, content-anchored (AdaIN) for structure-preserving translation and partially anchored for structure-changing translation, and the gate can be overridden locally at inference from text or a detector without retraining, preserving important structures of the original image while still generating realistic results. We evaluate PRISM on five natural and biomedical benchmarks (AFHQ cat-\u003edog, CelebA-HQ appearance translation, day-\u003enight relighting, virtual staining, and breast frozen-\u003epermanent histopathology). Among the evaluated methods under a shared same-split protocol, PRISM attains the best Inception FID and KID on four benchmarks and a competitive result on the fifth, and on histopathology yields the nuclei-count ratio closest to the ideal, supporting a favorable balance between target realism and structural preservation.", "arxiv_id": "2608.06240", "arxiv_url": "https://arxiv.org/abs/2608.06240", "authors": ["Elad Yoshai", "Natan T. Shaked"], "brief": "PRISM \u63d0\u51fa\u4e00\u79cd\u65e0 GAN \u7684\u6d41\u5339\u914d\u6846\u67b6\uff0c\u7528\u5b66\u4e60\u5230\u7684\u9010\u7279\u5f81\u95e8\u63a7\u66ff\u4ee3\u5168\u5c40\u566a\u58f0/\u5f15\u5bfc\u503c\uff0c\u5b9e\u73b0\u975e\u914d\u5bf9\u56fe\u50cf\u7ffb\u8bd1\u4e2d\u6309\u533a\u57df\u51b3\u5b9a\u4fdd\u7559\u6216\u6539\u53d8\u5185\u5bb9\u3002\u8be5\u65b9\u6cd5\u5728\u521d\u59cb\u5316\u548c ODE \u4f20\u8f93\u8fc7\u7a0b\u4e2d\u5171\u540c\u4f7f\u7528\u5206\u5e03\u8ddd\u79bb\u95e8\u63a7\uff0c\u5e76\u652f\u6301\u63a8\u7406\u65f6\u7528\u6587\u672c\u6216\u68c0\u6d4b\u5668\u5c40\u90e8\u63a7\u5236\uff1b\u5728 5 \u4e2a\u81ea\u7136\u4e0e\u751f\u533b\u57fa\u51c6\u4e0a\uff0c\u591a\u6570\u4efb\u52a1\u53d6\u5f97\u6700\u4f73 FID/KID\uff0c\u5e76\u66f4\u597d\u4fdd\u6301\u7ec4\u7ec7\u7ed3\u6784\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06240", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u7ffb\u8bd1", "\u6d41\u5339\u914d", "\u53ef\u63a7\u751f\u6210", "\u533b\u5b66\u5f71\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06240v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PRISM: Distribution-Gated Flow Matching for Controllable Unpaired Image Translation", "tldr": "PRISM \u63d0\u51fa\u4e00\u79cd\u65e0 GAN \u7684\u6d41\u5339\u914d\u6846\u67b6\uff0c\u7528\u5b66\u4e60\u5230\u7684\u9010\u7279\u5f81\u95e8\u63a7\u66ff\u4ee3\u5168\u5c40\u566a\u58f0/\u5f15\u5bfc\u503c\uff0c\u5b9e\u73b0\u975e\u914d\u5bf9\u56fe\u50cf\u7ffb\u8bd1\u4e2d\u6309\u533a\u57df\u51b3\u5b9a\u4fdd\u7559\u6216\u6539\u53d8\u5185\u5bb9\u3002\u8be5\u65b9\u6cd5\u5728\u521d\u59cb\u5316\u548c ODE \u4f20\u8f93\u8fc7\u7a0b\u4e2d\u5171\u540c\u4f7f\u7528\u5206\u5e03\u8ddd\u79bb\u95e8\u63a7\uff0c\u5e76\u652f\u6301\u63a8\u7406\u65f6\u7528\u6587\u672c\u6216\u68c0\u6d4b\u5668\u5c40\u90e8\u63a7\u5236\uff1b\u5728 5 \u4e2a\u81ea\u7136\u4e0e\u751f\u533b\u57fa\u51c6\u4e0a\uff0c\u591a\u6570\u4efb\u52a1\u53d6\u5f97\u6700\u4f73 FID/KID\uff0c\u5e76\u66f4\u597d\u4fdd\u6301\u7ec4\u7ec7\u7ed3\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Our primary objective is to advance video object counting in crowded scenes, aiming to robustly count all instances of a target category based on given text or visual prompts. Existing methods rely on RGB information, limiting their discriminative ability in crowded and occluded conditions. To address this, we propose a Depth-Guided Detector (DG-Det) along with a general post-processing pipeline. By integrating depth cues with multi-scale RGB-D cross-attention and explicit occlusion prediction, our method enhances spatial understanding and achieves robust detection in crowded and occluded scenes. Furthermore, we introduce a unified de-duplication framework to eliminate cross-frame redundant counting. To facilitate future research, we also release a new RGB-D Video Object Counting dataset featuring depth information and multiple object categories persequence. Extensive experiments demonstrate that our method achieves a 62.01\\% reduction in MAE compared to existing baselines, and also produces consistent improvements in RMSE. We provide the source code at https://github.com/streamer-AP/DG-Net and the dataset at https://huggingface.co/datasets/aerospace123/RGBD-VideoCount.", "arxiv_id": "2608.06236", "arxiv_url": "https://arxiv.org/abs/2608.06236", "authors": ["Yuanjing Xu", "Xinyan Liu", "Weidong Chen", "Zixuan Zou", "Linhao Zhang", "Zhuangzhe Meng", "Antoni B. Chan", "Weigang Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e\u62e5\u6324\u573a\u666f\u89c6\u9891\u76ee\u6807\u8ba1\u6570\u7684\u6df1\u5ea6\u5f15\u5bfc\u68c0\u6d4b\u5668 DG-Det\uff0c\u7ed3\u5408 RGB-D \u591a\u5c3a\u5ea6\u4ea4\u53c9\u6ce8\u610f\u529b\u3001\u906e\u6321\u9884\u6d4b\u548c\u8de8\u5e27\u53bb\u91cd\uff0c\u4ee5\u66f4\u7a33\u5065\u5730\u6309\u6587\u672c\u6216\u89c6\u89c9\u63d0\u793a\u7edf\u8ba1\u76ee\u6807\u7c7b\u522b\u5b9e\u4f8b\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03\u4e86\u65b0\u7684 RGB-D \u89c6\u9891\u8ba1\u6570\u6570\u636e\u96c6\uff0c\u5b9e\u9a8c\u4e2d\u76f8\u8f83\u73b0\u6709\u57fa\u7ebf MAE \u964d\u4f4e 62.01%\uff0cRMSE \u4e5f\u7a33\u5b9a\u6539\u5584\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06236", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u8ba1\u6570", "\u89c6\u9891\u7406\u89e3", "RGB-D", "\u62e5\u6324\u573a\u666f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06236v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Depth-Guided Video Object Counting in Crowded Scenes", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e\u62e5\u6324\u573a\u666f\u89c6\u9891\u76ee\u6807\u8ba1\u6570\u7684\u6df1\u5ea6\u5f15\u5bfc\u68c0\u6d4b\u5668 DG-Det\uff0c\u7ed3\u5408 RGB-D \u591a\u5c3a\u5ea6\u4ea4\u53c9\u6ce8\u610f\u529b\u3001\u906e\u6321\u9884\u6d4b\u548c\u8de8\u5e27\u53bb\u91cd\uff0c\u4ee5\u66f4\u7a33\u5065\u5730\u6309\u6587\u672c\u6216\u89c6\u89c9\u63d0\u793a\u7edf\u8ba1\u76ee\u6807\u7c7b\u522b\u5b9e\u4f8b\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03\u4e86\u65b0\u7684 RGB-D \u89c6\u9891\u8ba1\u6570\u6570\u636e\u96c6\uff0c\u5b9e\u9a8c\u4e2d\u76f8\u8f83\u73b0\u6709\u57fa\u7ebf MAE \u964d\u4f4e 62.01%\uff0cRMSE \u4e5f\u7a33\u5b9a\u6539\u5584\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Despite advances in artificial intelligence (AI) across multiple sectors, today\u0027s AI tools, including deep learning and generative AI, still fail when embedded into physical systems, such as robots and vehicles operating under real-world physical laws. This stems from their inability to maintain reliable world models for long-horizon planning under uncertainty and generalize to unseen scenarios. In this context, wireless networks, through pervasive sensing and communication, can orchestrate physical intelligence. However, current architectures optimize throughput, latency, and reliability and cannot support real-time physical AI coordination, requiring agents to maintain shared spatiotemporal context. To address these challenges, a network of holonic digital twins (HDT-Nets) framework is proposed to deliver real-time physical AI inference through holonic agents that actively reason about their environment rather than passively mirror physical assets. Each HDT is realized as a hierarchical structure spanning the physical agent and network edge, reasoning autonomously at the local level while cooperating with neighboring HDTs to form collectively intelligent units. In HDT-Net, causal Markov blankets spanning sensing, communication, and control determine which agents must coordinate and enable counterfactual reasoning over multi-domain interventions. Active inference within these boundaries unifies perception, action, and learning by minimizing expected free energy while deciding which beliefs to transmit based on their cognitive value to the receiver. Category theory ensures that transmitted beliefs preserve semantic structure across heterogeneous agents with incompatible representations. Finally, integrated information theory quantifies when collective intelligence exceeds independent operation and how network intelligence evolves through coordinated learning and information exchange.", "arxiv_id": "2608.06227", "arxiv_url": "https://arxiv.org/abs/2608.06227", "authors": ["Christo Kurisummoottil Thomas", "Omar Hashash", "Walid Saad"], "brief": "\u8bba\u6587\u63d0\u51fa HDT-Nets\uff08\u5168\u606f\u6570\u5b57\u5b6a\u751f\u7f51\u7edc\uff09\u6846\u67b6\uff0c\u5c06\u6570\u5b57\u5b6a\u751f\u4ece\u88ab\u52a8\u955c\u50cf\u8f6c\u4e3a\u53ef\u4e3b\u52a8\u63a8\u7406\u3001\u534f\u4f5c\u7684\u7269\u7406 AI \u667a\u80fd\u4f53\u3002\u8be5\u6846\u67b6\u7ed3\u5408\u56e0\u679c Markov blanket\u3001\u4e3b\u52a8\u63a8\u7406\u3001\u8303\u7574\u8bba\u4e0e\u6574\u5408\u4fe1\u606f\u7406\u8bba\uff0c\u4ee5\u652f\u6301\u5f02\u6784\u667a\u80fd\u4f53\u5728\u65e0\u7ebf\u7f51\u7edc\u4e2d\u7684\u5b9e\u65f6\u611f\u77e5\u3001\u901a\u4fe1\u3001\u63a7\u5236\u4e0e\u96c6\u4f53\u667a\u80fd\u5f62\u6210\u3002", "categories": ["cs.NI", "cs.AI", "cs.IT", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06227", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u5b57\u5b6a\u751f", "\u7269\u7406AI", "\u7f51\u7edc\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06227v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Passive Mirrors to Active Agents: Holonic Digital Twins for Physical AI over Networks", "tldr": "\u8bba\u6587\u63d0\u51fa HDT-Nets\uff08\u5168\u606f\u6570\u5b57\u5b6a\u751f\u7f51\u7edc\uff09\u6846\u67b6\uff0c\u5c06\u6570\u5b57\u5b6a\u751f\u4ece\u88ab\u52a8\u955c\u50cf\u8f6c\u4e3a\u53ef\u4e3b\u52a8\u63a8\u7406\u3001\u534f\u4f5c\u7684\u7269\u7406 AI \u667a\u80fd\u4f53\u3002\u8be5\u6846\u67b6\u7ed3\u5408\u56e0\u679c Markov blanket\u3001\u4e3b\u52a8\u63a8\u7406\u3001\u8303\u7574\u8bba\u4e0e\u6574\u5408\u4fe1\u606f\u7406\u8bba\uff0c\u4ee5\u652f\u6301\u5f02\u6784\u667a\u80fd\u4f53\u5728\u65e0\u7ebf\u7f51\u7edc\u4e2d\u7684\u5b9e\u65f6\u611f\u77e5\u3001\u901a\u4fe1\u3001\u63a7\u5236\u4e0e\u96c6\u4f53\u667a\u80fd\u5f62\u6210\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While deep learning models, particularly transformer-based architectures, have shown impressive performance in time series forecasting, the application of retrieval-augmented generation (RAG) in this domain remains limited. Since RAG has proven effective in enhancing the capabilities of large language models by incorporating relevant external information, retrieving similar time series sequences as references might also improve accuracy in time series forecasting tasks. However, most time series models are constrained by limited training data, smaller parameter scales, and a lack of the extensive generative capabilities found in large language models. Simply concatenating reference sequences into the prompt, as done in language models, may not yield the expected results. To address these challenges, we propose a novel approach, TS-RAG, which leverages RAG to enhance forecasting performance. The framework introduces specially designed reference tokens to effectively fuse information from the input sequence with that from retrieved similar sequences, enabling a more robust capture of complex temporal dynamics. Experimental results demonstrate that TS-RAG achieves consistent state-of-the-art performance across several real-world forecasting benchmarks.", "arxiv_id": "2608.06223", "arxiv_url": "https://arxiv.org/abs/2608.06223", "authors": ["Yixiong Xiao", "Congxi Xiao", "Jingbo Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa TS-RAG\uff0c\u5c06\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u5f15\u5165\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\uff0c\u901a\u8fc7\u68c0\u7d22\u76f8\u4f3c\u5386\u53f2\u5e8f\u5217\u4f5c\u4e3a\u53c2\u8003\u6765\u63d0\u5347\u9884\u6d4b\u3002\u65b9\u6cd5\u8bbe\u8ba1\u4e86\u4e13\u95e8\u7684\u53c2\u8003 token \u878d\u5408\u8f93\u5165\u5e8f\u5217\u4e0e\u68c0\u7d22\u5e8f\u5217\u4fe1\u606f\uff0c\u5728\u591a\u4e2a\u771f\u5b9e\u9884\u6d4b\u57fa\u51c6\u4e0a\u53d6\u5f97\u7a33\u5b9a\u7684\u6700\u4f18\u6027\u80fd\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06223", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06223v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TS-RAG: Retrieval Augmented Generation for Time Series Forecasting", "tldr": "\u8bba\u6587\u63d0\u51fa TS-RAG\uff0c\u5c06\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u5f15\u5165\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\uff0c\u901a\u8fc7\u68c0\u7d22\u76f8\u4f3c\u5386\u53f2\u5e8f\u5217\u4f5c\u4e3a\u53c2\u8003\u6765\u63d0\u5347\u9884\u6d4b\u3002\u65b9\u6cd5\u8bbe\u8ba1\u4e86\u4e13\u95e8\u7684\u53c2\u8003 token \u878d\u5408\u8f93\u5165\u5e8f\u5217\u4e0e\u68c0\u7d22\u5e8f\u5217\u4fe1\u606f\uff0c\u5728\u591a\u4e2a\u771f\u5b9e\u9884\u6d4b\u57fa\u51c6\u4e0a\u53d6\u5f97\u7a33\u5b9a\u7684\u6700\u4f18\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Classical continual learning (CL) has primarily focused on enabling models to update and retain knowledge through parameter-centric mechanisms, e.g., training strategies, architectural designs, and weight adaptation. However, emerging paradigms are reshaping the scope of CL beyond this traditional model adaptation view. For instance, on-policy learning broadens the space of update mechanisms; test-time training extends CL from the training phase to inference; and external harness components such as memory, skill libraries, and interaction protocols extend the evolutionary boundaries of model capabilities far beyond the static parameter space. Collectively, these developments indicate a transition from parameter-centric learning toward system-level adaptation. To characterize this transition, we examine the evolution of continual learning through three dimensions: When, How, and Where learning occurs. The How dimension encompasses off-policy, on-policy, and beyond-gradient optimization mechanics. The When dimension captures evolution across pre-training, post-training, and inference-time stages. The Where dimension delineates updates occurring within internal parameters versus external structural constraints. Anchored by this tri-axial framework, we systematically survey representative methods, trace the ongoing transition of continual learning, and discuss the key challenges, broader implications, and future directions arising from this paradigm shift.", "arxiv_id": "2608.06216", "arxiv_url": "https://arxiv.org/abs/2608.06216", "authors": ["Zhiyan Hou", "Dan Zhang", "Tao Feng", "Liyuan Wang", "Wei Li", "Xiangzhao Hao", "Hongyan An", "Junfeng Fang", "Haokai Ma", "Zhaohui Xu", "Haiyun Guo", "Jinqiao Wang", "Tat-Seng Chua"], "brief": "\u672c\u6587\u7efc\u8ff0\u6301\u7eed\u5b66\u4e60\u4ece\u4ee5\u53c2\u6570\u66f4\u65b0\u4e3a\u4e2d\u5fc3\uff0c\u8f6c\u5411\u66f4\u5e7f\u6cdb\u7684\u7cfb\u7edf\u7ea7\u81ea\u9002\u5e94\u8303\u5f0f\u3002\u4f5c\u8005\u63d0\u51fa\u4ece\u5b66\u4e60\u53d1\u751f\u7684\u65f6\u95f4\u3001\u65b9\u5f0f\u4e0e\u4f4d\u7f6e\u4e09\u4e2a\u7ef4\u5ea6\u68b3\u7406\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u8ba8\u8bba\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u3001\u5728\u7ebf\u7b56\u7565\u5b66\u4e60\u3001\u5916\u90e8\u8bb0\u5fc6\u4e0e\u6280\u80fd\u5e93\u7b49\u5e26\u6765\u7684\u6311\u6218\u548c\u672a\u6765\u65b9\u5411\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06216", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u6d4b\u8bd5\u65f6\u8bad\u7ec3", "\u7cfb\u7edf\u7ea7\u81ea\u9002\u5e94", "\u5728\u7ebf\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06216v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Continual Learning in Transition", "tldr": "\u672c\u6587\u7efc\u8ff0\u6301\u7eed\u5b66\u4e60\u4ece\u4ee5\u53c2\u6570\u66f4\u65b0\u4e3a\u4e2d\u5fc3\uff0c\u8f6c\u5411\u66f4\u5e7f\u6cdb\u7684\u7cfb\u7edf\u7ea7\u81ea\u9002\u5e94\u8303\u5f0f\u3002\u4f5c\u8005\u63d0\u51fa\u4ece\u5b66\u4e60\u53d1\u751f\u7684\u65f6\u95f4\u3001\u65b9\u5f0f\u4e0e\u4f4d\u7f6e\u4e09\u4e2a\u7ef4\u5ea6\u68b3\u7406\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u8ba8\u8bba\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u3001\u5728\u7ebf\u7b56\u7565\u5b66\u4e60\u3001\u5916\u90e8\u8bb0\u5fc6\u4e0e\u6280\u80fd\u5e93\u7b49\u5e26\u6765\u7684\u6311\u6218\u548c\u672a\u6765\u65b9\u5411\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) benchmark evaluations are routinely used to support claims about model safety, reliability, and deployment readiness. Yet most evaluations rely on a single access modality (model APIs), perform a single run per prompt, and report accuracy as the primary outcome metric, without accounting for conditions such as web search that may have effects on model behavior in deployment. We audit these assumptions for one of the most widely-used LLMs, comparing two modalities, ChatGPT\u0027s chat UI and OpenAI\u0027s API, with and without web search enabled. We use a stratified total sample of 401 prompts from two popular benchmarks, BBQ and SafetyBench, collecting 4,812 total responses across three repeated runs per prompt. Beyond standard performance measures, we evaluate model output dimensions including response consistency, response text similarity, citation grounding, and abstention behavior. For instance, chat UI responses were less accurate than API responses on both benchmarks with search disabled. Enabling web search reduced accuracy by up to 8 percentage points, and even reversed the direction of modality performance trends for one benchmark. Repeated runs of the same prompt produced inconsistent responses in up to 21\\% of prompts. The two modalities also grounded answers in different citations, and abstention behavior was also inconsistent across both modalities. These results illustrate that, even within a model family, reporting only simple accuracy metrics can obscure important forms of model behavioral variation relevant to AI safety assessments. We argue that AI safety evaluations should systematically account for modality, multi-run consistency, search conditions, and response-level behaviors to better reflect how deployed AI systems behave in practice.", "arxiv_id": "2608.06202", "arxiv_url": "https://arxiv.org/abs/2608.06202", "authors": ["Ro Encarnaci\u00f3n", "Tina Behzad", "Emma Lurie", "Dana\u00e9 Metaxa"], "brief": "\u672c\u6587\u5ba1\u8ba1\u4e86\u5e38\u7528\u5927\u6a21\u578b\u5b89\u5168\u8bc4\u6d4b\u4e2d\u7684\u9690\u85cf\u5047\u8bbe\uff0c\u6bd4\u8f83 ChatGPT \u7f51\u9875\u7aef\u4e0e OpenAI API\u3001\u5f00\u542f\u6216\u5173\u95ed\u7f51\u9875\u641c\u7d22\u4e0b\u5728 BBQ \u548c SafetyBench \u4e0a\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4e0d\u540c\u8bbf\u95ee\u65b9\u5f0f\u548c\u641c\u7d22\u6761\u4ef6\u4f1a\u663e\u8457\u5f71\u54cd\u51c6\u786e\u7387\u3001\u4e00\u81f4\u6027\u3001\u5f15\u7528\u6765\u6e90\u4e0e\u62d2\u7b54\u884c\u4e3a\uff0c\u5355\u6b21\u8fd0\u884c\u548c\u4ec5\u62a5\u544a\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u4e0e\u5b89\u5168\u90e8\u7f72\u76f8\u5173\u7684\u91cd\u8981\u884c\u4e3a\u5dee\u5f02\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06202", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u8bc4\u6d4b", "\u5b89\u5168\u8bc4\u4f30", "\u7f51\u9875\u641c\u7d22", "\u4e00\u81f4\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06202v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Current AI Benchmarks Leave Unmeasured: Modality, Search, Citations, and Implications (for Safety Evaluations)", "tldr": "\u672c\u6587\u5ba1\u8ba1\u4e86\u5e38\u7528\u5927\u6a21\u578b\u5b89\u5168\u8bc4\u6d4b\u4e2d\u7684\u9690\u85cf\u5047\u8bbe\uff0c\u6bd4\u8f83 ChatGPT \u7f51\u9875\u7aef\u4e0e OpenAI API\u3001\u5f00\u542f\u6216\u5173\u95ed\u7f51\u9875\u641c\u7d22\u4e0b\u5728 BBQ \u548c SafetyBench \u4e0a\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4e0d\u540c\u8bbf\u95ee\u65b9\u5f0f\u548c\u641c\u7d22\u6761\u4ef6\u4f1a\u663e\u8457\u5f71\u54cd\u51c6\u786e\u7387\u3001\u4e00\u81f4\u6027\u3001\u5f15\u7528\u6765\u6e90\u4e0e\u62d2\u7b54\u884c\u4e3a\uff0c\u5355\u6b21\u8fd0\u884c\u548c\u4ec5\u62a5\u544a\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u4e0e\u5b89\u5168\u90e8\u7f72\u76f8\u5173\u7684\u91cd\u8981\u884c\u4e3a\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agents backed by large skill libraries must decide which skills to load and in what order. Loading the entire library into context is expensive and provides no structure for autonomous sequencing. We study two systems for this problem over a corpus of 690 skills: a hybrid ranker combining lexical and dense-embedding retrieval for sparse, on-demand loading, and a typed knowledge graph encoding workflow relations such as prerequisites, data flow, and ordering. On a set of 117 realistic, non-echoing queries, the hybrid ranker retrieves the correct skill within the top five in 73.5% +/- 8.0 of cases, leaving roughly a quarter of queries unserved. When used as the design intended (substituting graph neighbours for additional ranked results at matched token budget), the graph is significantly worse (-11.2 points, p = 0.0007). Its LLM-generated edge layer adds nothing over neighbours obtained free from a local embedding pass, and 73% of the queries the ranker misses are not reachable through the graph at all. We attribute this to a pre-filter topology bound. Because the graph\u0027s candidate edges are drawn from the same embedding neighbourhood the ranker already searches, 98.6% of typed edges connect skills the ranker had already surfaced together. The graph can enrich relation semantics but cannot extend retrieval reach. We further show that evaluating on author-written queries overstates hit@5 by up to 44 points, which would have hidden these results entirely. Our contribution is a mechanistic account of why added structure does not improve retrieval over a strong ranker, and identify the conditions under which adding structural interdependence into the retrieval is optimal.", "arxiv_id": "2608.06196", "arxiv_url": "https://arxiv.org/abs/2608.06196", "authors": ["Indivara Kolluru", "Nathan Sportsman"], "brief": "\u8bba\u6587\u6bd4\u8f83\u4e86\u5927\u578b\u6280\u80fd\u5e93\u4e2d\u667a\u80fd\u4f53\u6309\u9700\u68c0\u7d22\u6280\u80fd\u7684\u4e24\u79cd\u65b9\u6cd5\uff1a\u8bcd\u6cd5+\u5411\u91cf\u7684\u6df7\u5408\u6392\u5e8f\u5668\uff0c\u4ee5\u53ca\u7f16\u7801\u5148\u51b3\u6761\u4ef6\u3001\u6570\u636e\u6d41\u548c\u987a\u5e8f\u5173\u7cfb\u7684\u7c7b\u578b\u5316\u77e5\u8bc6\u56fe\u8c31\u3002\u5728690\u4e2a\u6280\u80fd\u3001117\u4e2a\u771f\u5b9e\u67e5\u8be2\u4e0a\uff0c\u6df7\u5408\u6392\u5e8f\u5668top-5\u547d\u4e2d\u7387\u8fbe73.5%\uff0c\u800c\u7528\u56fe\u90bb\u5c45\u66ff\u4ee3\u989d\u5916\u6392\u5e8f\u7ed3\u679c\u53cd\u800c\u663e\u8457\u4e0b\u964d11.2\u4e2a\u767e\u5206\u70b9\u3002\u4f5c\u8005\u6307\u51fa\u77e5\u8bc6\u56fe\u8c31\u53d7\u9650\u4e8e\u5176\u8fb9\u6765\u81ea\u540c\u4e00\u5d4c\u5165\u90bb\u57df\uff0c\u80fd\u589e\u5f3a\u5173\u7cfb\u8bed\u4e49\u4f46\u96be\u4ee5\u6269\u5c55\u68c0\u7d22\u8986\u76d6\uff0c\u5e76\u5f3a\u8c03\u4f5c\u8005\u81ea\u5199\u67e5\u8be2\u4f1a\u4e25\u91cd\u9ad8\u4f30\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06196", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u77e5\u8bc6\u56fe\u8c31", "\u6280\u80fd\u5e93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06196v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Comparative Approaches to Agent Retrieval over Large Skill Libraries", "tldr": "\u8bba\u6587\u6bd4\u8f83\u4e86\u5927\u578b\u6280\u80fd\u5e93\u4e2d\u667a\u80fd\u4f53\u6309\u9700\u68c0\u7d22\u6280\u80fd\u7684\u4e24\u79cd\u65b9\u6cd5\uff1a\u8bcd\u6cd5+\u5411\u91cf\u7684\u6df7\u5408\u6392\u5e8f\u5668\uff0c\u4ee5\u53ca\u7f16\u7801\u5148\u51b3\u6761\u4ef6\u3001\u6570\u636e\u6d41\u548c\u987a\u5e8f\u5173\u7cfb\u7684\u7c7b\u578b\u5316\u77e5\u8bc6\u56fe\u8c31\u3002\u5728690\u4e2a\u6280\u80fd\u3001117\u4e2a\u771f\u5b9e\u67e5\u8be2\u4e0a\uff0c\u6df7\u5408\u6392\u5e8f\u5668top-5\u547d\u4e2d\u7387\u8fbe73.5%\uff0c\u800c\u7528\u56fe\u90bb\u5c45\u66ff\u4ee3\u989d\u5916\u6392\u5e8f\u7ed3\u679c\u53cd\u800c\u663e\u8457\u4e0b\u964d11.2\u4e2a\u767e\u5206\u70b9\u3002\u4f5c\u8005\u6307\u51fa\u77e5\u8bc6\u56fe\u8c31\u53d7\u9650\u4e8e\u5176\u8fb9\u6765\u81ea\u540c\u4e00\u5d4c\u5165\u90bb\u57df\uff0c\u80fd\u589e\u5f3a\u5173\u7cfb\u8bed\u4e49\u4f46\u96be\u4ee5\u6269\u5c55\u68c0\u7d22\u8986\u76d6\uff0c\u5e76\u5f3a\u8c03\u4f5c\u8005\u81ea\u5199\u67e5\u8be2\u4f1a\u4e25\u91cd\u9ad8\u4f30\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Microarchitecture design space exploration suffers from expansive search spaces and expensive PPA evaluation, leaving only a small simulation budget for design decision-making. Existing methods perform blind search without considering microarchitectural dependencies and fail to learn from the iterative search effectively, leading to wasted evaluations and weak Pareto convergence. In this paper, we propose MicroEvo, a knowledge-guided framework that couples off-the-shelf LLMs with Monte Carlo Tree Search (MCTS) for multi-objective microarchitecture optimization. MicroEvo combines LLM-driven evolutionary operators, a Pareto-aware tree policy that balances Pareto contribution and diversity, an active knowledge accumulation mechanism that extracts and reuses optimization insights, and state-aware directives that adapt the search behavior online. Experiments show that MicroEvo improves Pareto-front quality by up to 36.2% over NSGA-II and achieves 10.6x higher search efficiency, and also demonstrates strong scalability to a complex industrial-scale core. The code repository is available at: https://github.com/GEAR-SEU/MicroEvo-ICCAD-26.", "arxiv_id": "2608.06183", "arxiv_url": "https://arxiv.org/abs/2608.06183", "authors": ["Jia Xiong", "Runkai Li", "Chenxu Niu", "Guangyuan Gao", "Changwen Xing", "Yifan Zhang", "Xinlai Wan", "Jieran Cui", "Chen Bai", "Yusheng Hua", "Ying Wang", "Ming Ling", "Xi Wang", "Tao Xie"], "brief": "MicroEvo \u5c06\u73b0\u6210\u5927\u8bed\u8a00\u6a21\u578b\u4e0e\u8499\u7279\u5361\u6d1b\u6811\u641c\u7d22\u7ed3\u5408\uff0c\u7528\u77e5\u8bc6\u5f15\u5bfc\u7684\u8fdb\u5316\u7b97\u5b50\u3001\u5e15\u7d2f\u6258\u611f\u77e5\u7b56\u7565\u548c\u4e3b\u52a8\u77e5\u8bc6\u79ef\u7d2f\u6765\u9ad8\u6548\u63a2\u7d22\u5fae\u67b6\u6784\u8bbe\u8ba1\u7a7a\u95f4\u3002\u5b9e\u9a8c\u4e2d\u5176\u5e15\u7d2f\u6258\u524d\u6cbf\u8d28\u91cf\u76f8\u6bd4 NSGA-II \u6700\u9ad8\u63d0\u5347 36.2%\uff0c\u641c\u7d22\u6548\u7387\u63d0\u5347 10.6 \u500d\uff0c\u5e76\u80fd\u6269\u5c55\u5230\u5de5\u4e1a\u7ea7\u590d\u6742\u6838\u5fc3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06183", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u641c\u7d22\u4f18\u5316", "\u82af\u7247\u8bbe\u8ba1", "\u8499\u7279\u5361\u6d1b\u6811\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06183v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MicroEvo: Knowledge-Guided LLM Sampling for Efficient Microarchitecture Design Space Exploration", "tldr": "MicroEvo \u5c06\u73b0\u6210\u5927\u8bed\u8a00\u6a21\u578b\u4e0e\u8499\u7279\u5361\u6d1b\u6811\u641c\u7d22\u7ed3\u5408\uff0c\u7528\u77e5\u8bc6\u5f15\u5bfc\u7684\u8fdb\u5316\u7b97\u5b50\u3001\u5e15\u7d2f\u6258\u611f\u77e5\u7b56\u7565\u548c\u4e3b\u52a8\u77e5\u8bc6\u79ef\u7d2f\u6765\u9ad8\u6548\u63a2\u7d22\u5fae\u67b6\u6784\u8bbe\u8ba1\u7a7a\u95f4\u3002\u5b9e\u9a8c\u4e2d\u5176\u5e15\u7d2f\u6258\u524d\u6cbf\u8d28\u91cf\u76f8\u6bd4 NSGA-II \u6700\u9ad8\u63d0\u5347 36.2%\uff0c\u641c\u7d22\u6548\u7387\u63d0\u5347 10.6 \u500d\uff0c\u5e76\u80fd\u6269\u5c55\u5230\u5de5\u4e1a\u7ea7\u590d\u6742\u6838\u5fc3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present a schema-based framework for extracting complex, structured information from unstructured text documents using generative AI, followed by automated semantic evaluation of the extracted information against a gold standard. The schema, serving as an information model encoding domain knowledge, provides a unified, systematic, and consistent framework for extraction of hierarchical, nested information, with attributes of variable cardinality, and subsequent evaluation of the results. Information extraction from a document is performed in a single call to the model, in zero-shot mode. In the evaluation step, we introduce a path-based semantic matching algorithm to align the nested, variable-cardinality attributes in the extracted results with those in the gold standard. We use generative AI for semantic comparison of the extracted and gold standard values of an attribute, and introduce a rubric to classify the result of the comparison, according to domain-specific considerations, as an exact, semantic, useful, or non-match. We were able to extract 12 out of 14 attributes with an F1 score of $\u003e$90\\% from documents published by the health technology assessment organisation NICE, using the generative AI model Claude Opus 3. The time needed to extract the attributes from a document was $\\sim$30 times lower than the time taken by a human domain expert. We further demonstrate generalisability of this framework across different generative AI models and transferability across different HTA organisations and languages.", "arxiv_id": "2608.06167", "arxiv_url": "https://arxiv.org/abs/2608.06167", "authors": ["Modhurita Mitra", "Jan-Willem Versteeg", "Maarten D. Schermer", "Shiva Nadi Najafabadi", "Marie L. De Bruin", "Lourens T. Bloem"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u9886\u57df\u6a21\u5f0f\uff08schema\uff09\u7684\u5c42\u6b21\u5316\u4fe1\u606f\u62bd\u53d6\u6846\u67b6\uff0c\u7528\u751f\u6210\u5f0f AI \u4ece\u975e\u7ed3\u6784\u5316\u6587\u6863\u4e2d\u96f6\u6837\u672c\u4e00\u6b21\u6027\u62bd\u53d6\u5d4c\u5957\u3001\u53ef\u53d8\u6570\u91cf\u7684\u7ed3\u6784\u5316\u5c5e\u6027\uff0c\u5e76\u7528\u8def\u5f84\u5339\u914d\u4e0e\u8bed\u4e49\u6bd4\u8f83\u81ea\u52a8\u8bc4\u4f30\u7ed3\u679c\u3002\u65b9\u6cd5\u5728 NICE \u5065\u5eb7\u6280\u672f\u8bc4\u4f30\u6587\u6863\u4e0a\uff0c14 \u4e2a\u5c5e\u6027\u4e2d\u6709 12 \u4e2a F1 \u8d85\u8fc7 90%\uff0c\u62bd\u53d6\u8017\u65f6\u7ea6\u4e3a\u4eba\u5de5\u4e13\u5bb6\u7684 1/30\uff0c\u5e76\u5c55\u793a\u4e86\u8de8\u6a21\u578b\u3001\u8de8\u673a\u6784\u548c\u8de8\u8bed\u8a00\u7684\u53ef\u8fc1\u79fb\u6027\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06167", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4fe1\u606f\u62bd\u53d6", "\u751f\u6210\u5f0fAI", "\u8bed\u4e49\u8bc4\u4f30", "\u533b\u7597\u5065\u5eb7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06167v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Schema-Guided Hierarchical Information Extraction and Semantic Evaluation Using Generative AI", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u9886\u57df\u6a21\u5f0f\uff08schema\uff09\u7684\u5c42\u6b21\u5316\u4fe1\u606f\u62bd\u53d6\u6846\u67b6\uff0c\u7528\u751f\u6210\u5f0f AI \u4ece\u975e\u7ed3\u6784\u5316\u6587\u6863\u4e2d\u96f6\u6837\u672c\u4e00\u6b21\u6027\u62bd\u53d6\u5d4c\u5957\u3001\u53ef\u53d8\u6570\u91cf\u7684\u7ed3\u6784\u5316\u5c5e\u6027\uff0c\u5e76\u7528\u8def\u5f84\u5339\u914d\u4e0e\u8bed\u4e49\u6bd4\u8f83\u81ea\u52a8\u8bc4\u4f30\u7ed3\u679c\u3002\u65b9\u6cd5\u5728 NICE \u5065\u5eb7\u6280\u672f\u8bc4\u4f30\u6587\u6863\u4e0a\uff0c14 \u4e2a\u5c5e\u6027\u4e2d\u6709 12 \u4e2a F1 \u8d85\u8fc7 90%\uff0c\u62bd\u53d6\u8017\u65f6\u7ea6\u4e3a\u4eba\u5de5\u4e13\u5bb6\u7684 1/30\uff0c\u5e76\u5c55\u793a\u4e86\u8de8\u6a21\u578b\u3001\u8de8\u673a\u6784\u548c\u8de8\u8bed\u8a00\u7684\u53ef\u8fc1\u79fb\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing audio-to-score (A2S) systems primarily focus on classical music, and the application to popular music remains underexplored. This paper first presents the new SheetSage-A2S Dataset, which includes 61 hours of audio with \\texttt{**kern} score encodings for 9,468 clips originating from 6,066 unique songs, the first of its kind to facilitate A2S research for popular music. Additionally, we improve on existing A2S approaches by using data augmentation and MuQ, a pretrained feature-extraction model for music audio, to enhance generalisation abilities and extract meaningful audio features. Results show that the proposed A2S model achieves 4.98\\% symbol error rate (SER) on the Quartets collection for classical music, which significantly outperforms the 15.3\\% SER from the existing state-of-the-art \\cite{alfaro-contrerasTransformer2024}. Additionally, our model achieves 20.92\\% SER on the SheetSage-A2S dataset for popular music, serving as a strong benchmark for future research. The dataset, model, and code are made publicly available at: https://github.com/Multimodal-Music-Research-Lab/SheetSage2Kern_model.", "arxiv_id": "2608.06165", "arxiv_url": "https://arxiv.org/abs/2608.06165", "authors": ["Eoin Cummins", "Zhongyi Huang", "Alexandre D\u0027Hooge", "Zhuoro Mo", "Yaolong Ju"], "brief": "\u8bba\u6587\u63d0\u51fa SheetSage-A2S \u6570\u636e\u96c6\uff0c\u5305\u542b 61 \u5c0f\u65f6\u6d41\u884c\u97f3\u4e50\u97f3\u9891\u53ca **kern \u4e50\u8c31\u7f16\u7801\uff0c\u7528\u4e8e\u63a8\u52a8\u6d41\u884c\u97f3\u4e50\u7684\u97f3\u9891\u5230\u4e50\u8c31\u8f6c\u5f55\u7814\u7a76\u3002\u65b9\u6cd5\u7ed3\u5408\u6570\u636e\u589e\u5f3a\u548c\u9884\u8bad\u7ec3\u97f3\u4e50\u97f3\u9891\u7279\u5f81\u6a21\u578b MuQ\uff0c\u5728\u53e4\u5178\u97f3\u4e50 Quartets \u6570\u636e\u96c6\u4e0a\u5c06\u7b26\u53f7\u9519\u8bef\u7387\u964d\u81f3 4.98%\uff0c\u5e76\u5728\u65b0\u6570\u636e\u96c6\u4e0a\u7ed9\u51fa 20.92% SER \u7684\u5f3a\u57fa\u51c6\u3002", "categories": ["cs.SD", "cs.AI", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06165", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u4e50\u8f6c\u5f55", "\u97f3\u9891\u5230\u4e50\u8c31", "\u9884\u8bad\u7ec3\u6a21\u578b", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06165v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Audio-to-Score Transcription using Pre-trained Features, Data Augmentation, and the New SheetSage-A2S Dataset", "tldr": "\u8bba\u6587\u63d0\u51fa SheetSage-A2S \u6570\u636e\u96c6\uff0c\u5305\u542b 61 \u5c0f\u65f6\u6d41\u884c\u97f3\u4e50\u97f3\u9891\u53ca **kern \u4e50\u8c31\u7f16\u7801\uff0c\u7528\u4e8e\u63a8\u52a8\u6d41\u884c\u97f3\u4e50\u7684\u97f3\u9891\u5230\u4e50\u8c31\u8f6c\u5f55\u7814\u7a76\u3002\u65b9\u6cd5\u7ed3\u5408\u6570\u636e\u589e\u5f3a\u548c\u9884\u8bad\u7ec3\u97f3\u4e50\u97f3\u9891\u7279\u5f81\u6a21\u578b MuQ\uff0c\u5728\u53e4\u5178\u97f3\u4e50 Quartets \u6570\u636e\u96c6\u4e0a\u5c06\u7b26\u53f7\u9519\u8bef\u7387\u964d\u81f3 4.98%\uff0c\u5e76\u5728\u65b0\u6570\u636e\u96c6\u4e0a\u7ed9\u51fa 20.92% SER \u7684\u5f3a\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) are increasingly used as zero-shot controllers, but successful trajectories do not necessarily show that decisions are grounded in visual input: simulator dynamics and conservative action priors can produce favourable scores without meaningful perception. We investigate this with an input-ablation battery: blind-image controls, repeated identical inputs, lane-axis reflection, non-visual baselines, and pipeline-integrity checks. Across nine direct-action models, six structured local VLMs, and an exploratory VLM-MPC hierarchy, we analyse 32,874 scored calls over two embodiments and three simulators. The direct-control results are largely negative: a constant-SLOW policy outperforms a scripted geometric controller, several models are image-invariant or nearly constant, and models that recognize longitudinal hazards still fail to transform LEFT and RIGHT under reflection. No local VLM meets the joint longitudinal and lateral grounding criteria. However, an image-only deterministic positive control estimates the lead gap with 0.090 m MAE and exact mirror equivariance, confirming the stimuli carry sufficient visual information; the failures are modular, not universal. A post-hoc, leakage-controlled symmetry-consensus guardian selects two models from 16 calibration frames and freezes a 2-of-4 hazard vote across original and reflected views. On 272 held-out frames it reaches 0.954 balanced accuracy (episode-cluster bootstrap 95% CI [0.895,0.990]); nested leave-one-episode-out recovers the same pair and threshold in all 12 folds. Abstaining on ties raises committed balanced accuracy to 0.973 at 0.824 coverage. With deterministic perception retaining lateral authority, offline modular replay achieves 0.934 action agreement and exact mirror equivariance. These results support current VLMs as bounded, selective hazard assistants, not monolithic zero-shot controllers.", "arxiv_id": "2608.06154", "arxiv_url": "https://arxiv.org/abs/2608.06154", "authors": ["J. de Curt\u00f2", "Dayani Plasencia", "Diego S\u00e1nchez", "I. de Zarz\u00e0"], "brief": "\u8bba\u6587\u901a\u8fc7\u591a\u79cd\u8f93\u5165\u6d88\u878d\u4e0e\u5bf9\u79f0\u6027\u6d4b\u8bd5\uff0c\u7cfb\u7edf\u68c0\u9a8c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u96f6\u6837\u672c\u89c6\u89c9\u63a7\u5236\u5668\u65f6\u662f\u5426\u771f\u6b63\u4f9d\u8d56\u89c6\u89c9\u4fe1\u606f\u3002\u7ed3\u679c\u663e\u793a\u591a\u6570\u76f4\u63a5\u63a7\u5236 VLM \u7f3a\u4e4f\u53ef\u9760\u89c6\u89c9 grounding\uff0c\u5e38\u8868\u73b0\u4e3a\u56fe\u50cf\u4e0d\u654f\u611f\u6216\u5de6\u53f3\u53cd\u5c04\u4e0d\u4e00\u81f4\uff1b\u4f46\u7ecf\u9009\u62e9\u4e0e\u7ea6\u675f\u7684\u6a21\u5757\u5316\u5371\u9669\u68c0\u6d4b\u52a9\u624b\u53ef\u5728\u4fdd\u7559\u96c6\u4e0a\u53d6\u5f97\u8f83\u9ad8\u5e73\u8861\u51c6\u786e\u7387\u3002\u4f5c\u8005\u8ba4\u4e3a\u5f53\u524d VLM \u66f4\u9002\u5408\u4f5c\u4e3a\u6709\u9650\u3001\u9009\u62e9\u6027\u7684\u611f\u77e5\u8f85\u52a9\uff0c\u800c\u975e\u7aef\u5230\u7aef\u96f6\u6837\u672c\u63a7\u5236\u5668\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06154", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u5b9a\u4f4d", "\u5177\u8eab\u667a\u80fd", "\u81ea\u52a8\u9a7e\u9a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06154v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Visual Grounding in Zero-Shot Vision-Language Control", "tldr": "\u8bba\u6587\u901a\u8fc7\u591a\u79cd\u8f93\u5165\u6d88\u878d\u4e0e\u5bf9\u79f0\u6027\u6d4b\u8bd5\uff0c\u7cfb\u7edf\u68c0\u9a8c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u96f6\u6837\u672c\u89c6\u89c9\u63a7\u5236\u5668\u65f6\u662f\u5426\u771f\u6b63\u4f9d\u8d56\u89c6\u89c9\u4fe1\u606f\u3002\u7ed3\u679c\u663e\u793a\u591a\u6570\u76f4\u63a5\u63a7\u5236 VLM \u7f3a\u4e4f\u53ef\u9760\u89c6\u89c9 grounding\uff0c\u5e38\u8868\u73b0\u4e3a\u56fe\u50cf\u4e0d\u654f\u611f\u6216\u5de6\u53f3\u53cd\u5c04\u4e0d\u4e00\u81f4\uff1b\u4f46\u7ecf\u9009\u62e9\u4e0e\u7ea6\u675f\u7684\u6a21\u5757\u5316\u5371\u9669\u68c0\u6d4b\u52a9\u624b\u53ef\u5728\u4fdd\u7559\u96c6\u4e0a\u53d6\u5f97\u8f83\u9ad8\u5e73\u8861\u51c6\u786e\u7387\u3002\u4f5c\u8005\u8ba4\u4e3a\u5f53\u524d VLM \u66f4\u9002\u5408\u4f5c\u4e3a\u6709\u9650\u3001\u9009\u62e9\u6027\u7684\u611f\u77e5\u8f85\u52a9\uff0c\u800c\u975e\u7aef\u5230\u7aef\u96f6\u6837\u672c\u63a7\u5236\u5668\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated skill evolution enables Large Language Model (LLM) agents to continuously improve without expensive retraining. However, existing approaches typically treat skill evolution as a sequence of local updates, overlooking relationships among skills and often producing overfitted skill updates that fail to generalize across tasks. We propose GSE, a globalized skill evolution framework that jointly optimizes skill compatibility and skill generalization. To preserve consistency across the skill bank, GSE maintains a Skill Relation Graph (SRG) that explicitly models and co-evolves inter-skill relationships. To improve generalization, GSE performs cluster-based skill consolidation to abstract reusable capabilities from local updates and employs replay-driven verification to prevent overfitting and behavioral regressions. We evaluate GSE on two representative software engineering tasks: bug-revealing test generation and false-positive bug report filtering. Across two state-of-the-art coding agents, OpenHands and mini-SWE-agent, GSE consistently achieves the best precision, recall, and F1-score. Compared with existing evolution techniques, GSE improves precision and recall by 6.1%~34.1% and 31.8%~180.0% for test generation, and by 15.4%~96.4% and 13.1%~19.8% for false-positive filtering. Deployment on an internal industrial agent further yields a 61.4% improvement in F1-score, demonstrating the effectiveness and generalizability of GSE for evolving effective skills.", "arxiv_id": "2608.06153", "arxiv_url": "https://arxiv.org/abs/2608.06153", "authors": ["Chen Yang", "Jiashuo Tian", "Ziqi Wang", "Xinyin Liu", "Meiru Ye", "Junjie Chen"], "brief": "\u8bba\u6587\u63d0\u51fa GSE\uff0c\u4e00\u79cd\u9762\u5411\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u5168\u5c40\u6280\u80fd\u6f14\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u6280\u80fd\u5173\u7cfb\u56fe\u5efa\u6a21\u6280\u80fd\u95f4\u5173\u7cfb\uff0c\u5e76\u7528\u805a\u7c7b\u5f0f\u6280\u80fd\u6574\u5408\u4e0e\u56de\u653e\u9a8c\u8bc1\u63d0\u5347\u590d\u7528\u6027\u3001\u907f\u514d\u8fc7\u62df\u5408\u3002\u8be5\u65b9\u6cd5\u5728\u6d4b\u8bd5\u751f\u6210\u548c\u8bef\u62a5\u8fc7\u6ee4\u4e24\u7c7b\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u6280\u80fd\u6f14\u5316\u65b9\u6cd5\uff0c\u5e76\u5728\u5de5\u4e1a\u5185\u90e8\u667a\u80fd\u4f53\u4e0a\u5e26\u6765 61.4% \u7684 F1 \u63d0\u5347\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06153", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u6280\u80fd\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06153v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Globally Reusable Skills for Coding Agents", "tldr": "\u8bba\u6587\u63d0\u51fa GSE\uff0c\u4e00\u79cd\u9762\u5411\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u5168\u5c40\u6280\u80fd\u6f14\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u6280\u80fd\u5173\u7cfb\u56fe\u5efa\u6a21\u6280\u80fd\u95f4\u5173\u7cfb\uff0c\u5e76\u7528\u805a\u7c7b\u5f0f\u6280\u80fd\u6574\u5408\u4e0e\u56de\u653e\u9a8c\u8bc1\u63d0\u5347\u590d\u7528\u6027\u3001\u907f\u514d\u8fc7\u62df\u5408\u3002\u8be5\u65b9\u6cd5\u5728\u6d4b\u8bd5\u751f\u6210\u548c\u8bef\u62a5\u8fc7\u6ee4\u4e24\u7c7b\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u6280\u80fd\u6f14\u5316\u65b9\u6cd5\uff0c\u5e76\u5728\u5de5\u4e1a\u5185\u90e8\u667a\u80fd\u4f53\u4e0a\u5e26\u6765 61.4% \u7684 F1 \u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The emergence of conspiracy theories in the wake of major events is a significant societal challenge. Here we test whether conversational dialogues with a large language model (LLM) can reduce belief in immediately unfolding conspiracies. In experiments conducted in the days following the July 2024 assassination attempt on Donald Trump and the September 2025 assassination of Charlie Kirk, U.S. adults (Experiment 1: N = 472; Experiment 2: N = 1035) holding conspiratorial views about the crisis event engaged in a multi-turn conversation with an LLM prompted to reduce their conspiracy belief. Compared to control participants who either discussed an irrelevant topic with an LLM or viewed a static fact sheet, participants in the LLM treatment showed significantly reduced conspiracy beliefs in both experiments. We also found evidence of downstream effects of the LLM treatment, observing reduced belief in different conspiracies one to two months later in the wake of subsequent crisis events. These results shed light on the psychology of emerging conspiracies and highlight the potential for scalable, cognitively-focused interventions to counteract misinformation in the immediate aftermath of high-profile societal events.", "arxiv_id": "2608.06151", "arxiv_url": "https://arxiv.org/abs/2608.06151", "authors": ["Thomas H. Costello", "Nathaniel Rabb", "Michael Nicholas Stagnaro", "Gordon Pennycook", "David Rand"], "brief": "\u7814\u7a76\u6d4b\u8bd5\u4e86\u5728\u91cd\u5927\u4e8b\u4ef6\u540e\u9634\u8c0b\u8bba\u521a\u51fa\u73b0\u65f6\uff0c\u7528\u5927\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u591a\u8f6e\u5bf9\u8bdd\u80fd\u5426\u964d\u4f4e\u4eba\u4eec\u7684\u9634\u8c0b\u4fe1\u5ff5\u3002\u4e24\u9879\u7f8e\u56fd\u6210\u4eba\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u65e0\u5173\u804a\u5929\u6216\u9759\u6001\u4e8b\u5b9e\u8bf4\u660e\uff0cLLM \u5bf9\u8bdd\u663e\u8457\u964d\u4f4e\u4e86\u53c2\u4e0e\u8005\u5bf9\u76f8\u5173\u9634\u8c0b\u8bba\u7684\u76f8\u4fe1\u7a0b\u5ea6\uff0c\u5e76\u57281\u52302\u4e2a\u6708\u540e\u5bf9\u5176\u4ed6\u65b0\u4e8b\u4ef6\u9634\u8c0b\u4fe1\u5ff5\u4e5f\u6709\u4e00\u5b9a\u5916\u6ea2\u964d\u4f4e\u6548\u679c\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06151", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", " misinformation", "\u4eba\u673a\u4ea4\u4e92", "\u793e\u4f1a\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06151v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reducing belief in conspiracy theories as they unfold using large language models", "tldr": "\u7814\u7a76\u6d4b\u8bd5\u4e86\u5728\u91cd\u5927\u4e8b\u4ef6\u540e\u9634\u8c0b\u8bba\u521a\u51fa\u73b0\u65f6\uff0c\u7528\u5927\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u591a\u8f6e\u5bf9\u8bdd\u80fd\u5426\u964d\u4f4e\u4eba\u4eec\u7684\u9634\u8c0b\u4fe1\u5ff5\u3002\u4e24\u9879\u7f8e\u56fd\u6210\u4eba\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u65e0\u5173\u804a\u5929\u6216\u9759\u6001\u4e8b\u5b9e\u8bf4\u660e\uff0cLLM \u5bf9\u8bdd\u663e\u8457\u964d\u4f4e\u4e86\u53c2\u4e0e\u8005\u5bf9\u76f8\u5173\u9634\u8c0b\u8bba\u7684\u76f8\u4fe1\u7a0b\u5ea6\uff0c\u5e76\u57281\u52302\u4e2a\u6708\u540e\u5bf9\u5176\u4ed6\u65b0\u4e8b\u4ef6\u9634\u8c0b\u4fe1\u5ff5\u4e5f\u6709\u4e00\u5b9a\u5916\u6ea2\u964d\u4f4e\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Earth-surface monitoring requires change detection models capable of recognizing arbitrary semantic categories. Open-Vocabulary Change Detection (OVCD) addresses this need. However, existing methods often entangle temporal perception, semantic discrimination, and region verification, causing unstable results and redundant computation. Inspired by human visual change perception, we propose CogVis, a cognitive memory-guided framework that reformulates OVCD as a perception-memory-verification paradigm. CogVis first employs a Scene Change Perceptron (SCP) to extract a reusable, category-agnostic change prior from frozen bi-temporal features, thereby decoupling temporal evidence from semantic category decisions. A Semantic Memory Calibrator (SMC) then compensates for category-dependent score shifts by dynamically estimating an image-query-specific decision threshold. Finally, an Adaptive Region Filter (ARF) filters connected candidates using learned semantic, temporal, and structural reliability. Experiments on seven benchmarks spanning semantic change detection, binary change localization, and building-damage assessment show that CogVis achieves state-of-the-art performance across all evaluated datasets. By sharing scene-level change perception, CogVis further avoids repeating category-agnostic temporal perception across queries and improves inference throughput by 28.50%.", "arxiv_id": "2608.06150", "arxiv_url": "https://arxiv.org/abs/2608.06150", "authors": ["Zijie Wang", "Chen Zhong", "Wei He"], "brief": "\u8bba\u6587\u63d0\u51fa CogVis\uff0c\u5c06\u5f00\u653e\u8bcd\u6c47\u53d8\u5316\u68c0\u6d4b\u91cd\u6784\u4e3a\u201c\u611f\u77e5-\u8bb0\u5fc6-\u9a8c\u8bc1\u201d\u6d41\u7a0b\uff0c\u5148\u63d0\u53d6\u53ef\u590d\u7528\u7684\u7c7b\u522b\u65e0\u5173\u53d8\u5316\u5148\u9a8c\uff0c\u518d\u8fdb\u884c\u8bed\u4e49\u9608\u503c\u6821\u51c6\u4e0e\u533a\u57df\u8fc7\u6ee4\u3002\u8be5\u65b9\u6cd5\u57287\u4e2a\u53d8\u5316\u68c0\u6d4b\u76f8\u5173\u57fa\u51c6\u4e0a\u8fbe\u5230\u5f53\u524d\u6700\u4f73\u8868\u73b0\uff0c\u5e76\u901a\u8fc7\u5171\u4eab\u573a\u666f\u7ea7\u53d8\u5316\u611f\u77e5\u5c06\u63a8\u7406\u541e\u5410\u63d0\u534728.50%\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06150", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f00\u653e\u8bcd\u6c47", "\u53d8\u5316\u68c0\u6d4b", "\u9065\u611f\u89c6\u89c9", "\u89c6\u89c9\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06150v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CogVis: Must Open-Vocabulary Change Detection Perceive the Scene Anew for Every Query?", "tldr": "\u8bba\u6587\u63d0\u51fa CogVis\uff0c\u5c06\u5f00\u653e\u8bcd\u6c47\u53d8\u5316\u68c0\u6d4b\u91cd\u6784\u4e3a\u201c\u611f\u77e5-\u8bb0\u5fc6-\u9a8c\u8bc1\u201d\u6d41\u7a0b\uff0c\u5148\u63d0\u53d6\u53ef\u590d\u7528\u7684\u7c7b\u522b\u65e0\u5173\u53d8\u5316\u5148\u9a8c\uff0c\u518d\u8fdb\u884c\u8bed\u4e49\u9608\u503c\u6821\u51c6\u4e0e\u533a\u57df\u8fc7\u6ee4\u3002\u8be5\u65b9\u6cd5\u57287\u4e2a\u53d8\u5316\u68c0\u6d4b\u76f8\u5173\u57fa\u51c6\u4e0a\u8fbe\u5230\u5f53\u524d\u6700\u4f73\u8868\u73b0\uff0c\u5e76\u901a\u8fc7\u5171\u4eab\u573a\u666f\u7ea7\u53d8\u5316\u611f\u77e5\u5c06\u63a8\u7406\u541e\u5410\u63d0\u534728.50%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "End-to-end document parsers provide a unified interface, but serialize page layouts and regional contents into one autoregressive sequence. This formulation forces independent regions onto a decoding path whose length grows with the total content, whereas crop-based two-stage parsers expose region-level parallelism at the cost of repeated visual prefills and fragmented page context. To retain full-page context while removing dependencies, we propose PaDoc, a layout-grounded parser that treats the predicted layout as a branching structure over a shared page representation. Under a region-sufficiency assumption, we derive a prefix-conditioned factorization in which the layout stream and regional content branches advance concurrently, reducing the decoding depth to the longest layout-content path. We realize this factorization within a single MLLM: packed variable-length ancestor attention preserves the visibility under standard next-token training, while masked parallel decoding creates branches that the evaluated vLLM backend serves as concurrent requests with cache-resident shared-prefix reuse. On OmniDocBench Full, PaDoc attains an Overall layout F1 of 91.1 and, among end-to-end parsers, a top-tier Overall score of 94.24 together with the best Text Edit (0.038) and Formula CDM (95.59). On a 384-page subset and one A800 GPU, it is the fastest end-to-end parser at five concurrency levels, improving valid-page throughput by 67.4-118% and reducing P95 latency by 39.2-54.9% relative to a same-backbone Sequential SFT baseline. Code is available at https://github.com/Longin-Yu/Padoc", "arxiv_id": "2608.06146", "arxiv_url": "https://arxiv.org/abs/2608.06146", "authors": ["Hao Yu", "Jiabo Zhan", "Kang Liu", "Linnan Zhao", "Dongxu Yue", "Rui Chen", "Jinglin Wang", "Chong Sun", "Chen Li", "Jing Lyu", "Chun Yuan"], "brief": "PaDoc \u9488\u5bf9\u7aef\u5230\u7aef\u6587\u6863\u89e3\u6790\u4e2d\u5c06\u9875\u9762\u5e03\u5c40\u548c\u533a\u57df\u5185\u5bb9\u4e32\u884c\u89e3\u7801\u5bfc\u81f4\u6548\u7387\u4f4e\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u57fa\u4e8e\u9884\u6d4b\u5e03\u5c40\u7684\u5e76\u884c\u89e3\u7801\u6846\u67b6\uff0c\u5728\u5171\u4eab\u6574\u9875\u8868\u793a\u4e0a\u8ba9\u5404\u533a\u57df\u5185\u5bb9\u5206\u652f\u5e76\u53d1\u751f\u6210\u3002\u8be5\u65b9\u6cd5\u5728 OmniDocBench Full \u4e0a\u53d6\u5f97\u8f83\u9ad8\u89e3\u6790\u8d28\u91cf\uff0c\u5e76\u5728\u5355\u5361\u6d4b\u8bd5\u4e2d\u76f8\u6bd4\u540c\u9aa8\u5e72\u4e32\u884c\u57fa\u7ebf\u663e\u8457\u63d0\u5347\u541e\u5410\u3001\u964d\u4f4e\u5c3e\u5ef6\u8fdf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06146", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u6863\u89e3\u6790", "\u591a\u6a21\u6001", "\u5e76\u884c\u89e3\u7801", "\u7248\u9762\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06146v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PaDoc: Layout-Grounded Parallel Decoding for Document Parsing", "tldr": "PaDoc \u9488\u5bf9\u7aef\u5230\u7aef\u6587\u6863\u89e3\u6790\u4e2d\u5c06\u9875\u9762\u5e03\u5c40\u548c\u533a\u57df\u5185\u5bb9\u4e32\u884c\u89e3\u7801\u5bfc\u81f4\u6548\u7387\u4f4e\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u57fa\u4e8e\u9884\u6d4b\u5e03\u5c40\u7684\u5e76\u884c\u89e3\u7801\u6846\u67b6\uff0c\u5728\u5171\u4eab\u6574\u9875\u8868\u793a\u4e0a\u8ba9\u5404\u533a\u57df\u5185\u5bb9\u5206\u652f\u5e76\u53d1\u751f\u6210\u3002\u8be5\u65b9\u6cd5\u5728 OmniDocBench Full \u4e0a\u53d6\u5f97\u8f83\u9ad8\u89e3\u6790\u8d28\u91cf\uff0c\u5e76\u5728\u5355\u5361\u6d4b\u8bd5\u4e2d\u76f8\u6bd4\u540c\u9aa8\u5e72\u4e32\u884c\u57fa\u7ebf\u663e\u8457\u63d0\u5347\u541e\u5410\u3001\u964d\u4f4e\u5c3e\u5ef6\u8fdf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most agent benchmarks evaluate tasks independently and cannot measure whether experience from one task helps with later tasks. Existing self-evolution benchmarks do not jointly cover professional workflows, open-ended deliverables, and multi-aspect evaluation. We introduce FinEvo-Bench, a longitudinal benchmark with 120 real-case-grounded tasks, 20 business scenes across six financial domains. Institution-provided professional procedures define the required operations and constraints. Eligible institution-provided and publicly documented cases supply the task facts. Each scene contains six related but substantively distinct cases that share a professional procedure and a manually reviewed rubric for task quality and financial compliance. We compare four self-evolving agent scaffolds using the same Qwen3.7-Max backbone and three independently shuffled, globally interleaved task streams. Paired non-evolving controls estimate each scaffold\u0027s self-evolution gain from retained experience, while an independent Claude Code scoring agent backed by Claude Opus 4.6 evaluates all outputs. Letta achieves the highest evolved score (91.65) and fewest compliance issues (0.09 per task); Codex achieves the largest self-evolution gain (+19.37). Across scaffolds, the evolving condition raises scores by 9.33-19.37 points and reduces compliance issues by 0.12-0.44 per task. Paired score gains at within-scene ranks 4-6 exceed those at ranks 1-3 by 6.10-8.70 points. In Claude Code, skill-only evolution produces higher task quality and fewer compliance issues than memory-only and combined memory-skill evolution. Across all four scaffolds, rubric feedback also yields higher scores and fewer compliance issues than reference-answer feedback. FinEvo-Bench measures both professional performance and self-evolution ability: how effectively an agent turns prior experience into later improvement.", "arxiv_id": "2608.06144", "arxiv_url": "https://arxiv.org/abs/2608.06144", "authors": ["Bo Deng", "Kang Zhou", "Lifan Guo", "Chongyang Tao", "Xuanren Chen", "Chenggang Xie", "Renzhao Liang", "Feng Chen", "Chi Zhang"], "brief": "FinEvo-Bench \u662f\u4e00\u4e2a\u9762\u5411\u4e13\u4e1a\u91d1\u878d\u5de5\u4f5c\u6d41\u7684\u7eb5\u5411\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5305\u542b 6 \u4e2a\u91d1\u878d\u9886\u57df\u300120 \u4e2a\u4e1a\u52a1\u573a\u666f\u548c 120 \u4e2a\u771f\u5b9e\u6848\u4f8b\u4efb\u52a1\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u80fd\u5426\u628a\u524d\u5e8f\u4efb\u52a1\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u540e\u7eed\u6539\u8fdb\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u81ea\u6f14\u5316\u8bbe\u7f6e\u76f8\u8f83\u975e\u6f14\u5316\u63a7\u5236\u53ef\u63d0\u5347 9.33-19.37 \u5206\u5e76\u51cf\u5c11\u5408\u89c4\u95ee\u9898\uff0c\u5176\u4e2d Letta \u7efc\u5408\u5f97\u5206\u6700\u9ad8\uff0cCodex \u81ea\u6f14\u5316\u589e\u76ca\u6700\u5927\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06144", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878d\u79d1\u6280", "\u57fa\u51c6\u6d4b\u8bd5", "\u81ea\u6f14\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06144v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FinEvo-Bench: A Longitudinal Benchmark for Self-Evolving Agents in Professional Financial Workflows", "tldr": "FinEvo-Bench \u662f\u4e00\u4e2a\u9762\u5411\u4e13\u4e1a\u91d1\u878d\u5de5\u4f5c\u6d41\u7684\u7eb5\u5411\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u5305\u542b 6 \u4e2a\u91d1\u878d\u9886\u57df\u300120 \u4e2a\u4e1a\u52a1\u573a\u666f\u548c 120 \u4e2a\u771f\u5b9e\u6848\u4f8b\u4efb\u52a1\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u80fd\u5426\u628a\u524d\u5e8f\u4efb\u52a1\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u540e\u7eed\u6539\u8fdb\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u81ea\u6f14\u5316\u8bbe\u7f6e\u76f8\u8f83\u975e\u6f14\u5316\u63a7\u5236\u53ef\u63d0\u5347 9.33-19.37 \u5206\u5e76\u51cf\u5c11\u5408\u89c4\u95ee\u9898\uff0c\u5176\u4e2d Letta \u7efc\u5408\u5f97\u5206\u6700\u9ad8\uff0cCodex \u81ea\u6f14\u5316\u589e\u76ca\u6700\u5927\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents performing cryptographic operations (signing Git commits, authenticating API calls, issuing certificates) currently store private keys in software-accessible locations: plaintext files, environment variables, or container memory. Any process with sufficient read privileges can extract the raw key material. A recent production incident demonstrated the practical severity: private keys were exfiltrated from a widely deployed framework via email injection in under five minutes. We aim to enforce both key confidentiality and content-aware authorisation for key use. To that end, we replace software-resident keys with hardware-confined keys accessible through a vendor-neutral PKCS#11 interface. A hardware keystore (HSM, TPM, smart card) executes cryptographic operations on-device; the host receives only the result via opaque handles. Hardware confinement is the primary contribution; it is enabled by a surrounding five-layer Zero-Trust enforcement stack comprising session identity (SAGA), scope bounds (Smax), semantic validation (RAV), taint tracking, and the hardware execution boundary. We evaluate against 12 injection scenarios derived from AgentDojo\u0027s ImportantInstructionsAttack template (Debenedetti et al., arXiv:2406.13352). We run four LLM models; three follow injections in baseline mode (gpt-oss-120b, Qwen2.5-72B, DeepSeek-V4-Flash, n=192 combined). Baseline Attack Success Rate (ASR): 19.3% [14.3%, 25.4%]; protected ASR: 0% (Wilson 95% CI upper bound 2.0%). Zero false positives across four benign task scenarios.", "arxiv_id": "2608.06130", "arxiv_url": "https://arxiv.org/abs/2608.06130", "authors": ["Leo Sambrook", "Sampo Sovio"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 AI \u667a\u80fd\u4f53\u7b7e\u540d\u6d41\u7a0b\u7684\u96f6\u4fe1\u4efb MCP \u5f3a\u5236\u67b6\u6784\uff0c\u7528\u786c\u4ef6\u5bc6\u94a5\u5e93\uff08HSM/TPM/\u667a\u80fd\u5361\uff09\u66ff\u4ee3\u8f6f\u4ef6\u4e2d\u53ef\u8bfb\u53d6\u7684\u79c1\u94a5\u5b58\u50a8\uff0c\u5e76\u7ed3\u5408\u4f1a\u8bdd\u8eab\u4efd\u3001\u6743\u9650\u8fb9\u754c\u3001\u8bed\u4e49\u9a8c\u8bc1\u548c\u6c61\u70b9\u8ffd\u8e2a\u6765\u63a7\u5236\u5bc6\u94a5\u4f7f\u7528\u3002\u57fa\u4e8e 12 \u7c7b\u6ce8\u5165\u653b\u51fb\u8bc4\u6d4b\uff0c\u57fa\u7ebf\u653b\u51fb\u6210\u529f\u7387\u4e3a 19.3%\uff0c\u9632\u62a4\u540e\u964d\u81f3 0%\uff0c\u4e14\u5728\u826f\u6027\u4efb\u52a1\u4e2d\u672a\u51fa\u73b0\u8bef\u62a5\u3002", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06130", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u786c\u4ef6\u5b89\u5168", "\u96f6\u4fe1\u4efb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06130v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hardware Keystores for AI Agent Signing Workflows: A Zero-Trust MCP Enforcement Architecture", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 AI \u667a\u80fd\u4f53\u7b7e\u540d\u6d41\u7a0b\u7684\u96f6\u4fe1\u4efb MCP \u5f3a\u5236\u67b6\u6784\uff0c\u7528\u786c\u4ef6\u5bc6\u94a5\u5e93\uff08HSM/TPM/\u667a\u80fd\u5361\uff09\u66ff\u4ee3\u8f6f\u4ef6\u4e2d\u53ef\u8bfb\u53d6\u7684\u79c1\u94a5\u5b58\u50a8\uff0c\u5e76\u7ed3\u5408\u4f1a\u8bdd\u8eab\u4efd\u3001\u6743\u9650\u8fb9\u754c\u3001\u8bed\u4e49\u9a8c\u8bc1\u548c\u6c61\u70b9\u8ffd\u8e2a\u6765\u63a7\u5236\u5bc6\u94a5\u4f7f\u7528\u3002\u57fa\u4e8e 12 \u7c7b\u6ce8\u5165\u653b\u51fb\u8bc4\u6d4b\uff0c\u57fa\u7ebf\u653b\u51fb\u6210\u529f\u7387\u4e3a 19.3%\uff0c\u9632\u62a4\u540e\u964d\u81f3 0%\uff0c\u4e14\u5728\u826f\u6027\u4efb\u52a1\u4e2d\u672a\u51fa\u73b0\u8bef\u62a5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Search agents extend large language models beyond static parametric memory by enabling them to acquire and use ex ternal evidence during multi-step reasoning. For knowledge intensive tasks involving complex or evolving information, their reliability depends not only on retrieving relevant ev idence but also on using it to guide subsequent reasoning. However, existing methods primarily reward final-answer cor rectness or intermediate progress, without directly assessing whether post-retrieval actions are grounded in the retrieved evidence. This misalignment encourages prior-driven reason ing: agents form conclusions based on internal knowledge and use retrieval mainly to confirm them, resulting in confirma tion bias and inefficient evidenceuse.Toaddressthisissue, we propose Contextual Information Policy Optimization (CIPO), an evidence-oriented reinforcement learning framework that explicitly aligns policy optimization with external evidence use. CIPO assigns dense, turn-level credit to reasoning ac tions influenced by retrieved information, while combining this evidence-use signal with a global outcome reward to pre serveanswercorrectness.Withthismanner,CIPOdiscourages evidence-detached guesses and promotes reasoning trajecto ries in which retrieved facts can guide or revise subsequent reasoning. Importantly, CIPO requires neither human process annotations nor an additional reward model. Extensive exper iments on seven in-domain and out-of-domain benchmarks show that CIPO reduces the prevalence of prior-driven rea soning and achieves excellent performance on most tasks.", "arxiv_id": "2608.06128", "arxiv_url": "https://arxiv.org/abs/2608.06128", "authors": ["Xingyu Guo", "Wei Chen", "Linlin Yang", "Baochang Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa CIPO\uff0c\u4e00\u79cd\u9762\u5411\u641c\u7d22\u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5728\u6bcf\u8f6e\u63a8\u7406\u4e2d\u663e\u5f0f\u5956\u52b1\u88ab\u68c0\u7d22\u8bc1\u636e\u5f71\u54cd\u7684\u884c\u52a8\uff0c\u5e76\u7ed3\u5408\u6700\u7ec8\u7b54\u6848\u5956\u52b1\u4ee5\u4fdd\u6301\u6b63\u786e\u6027\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u4eba\u5de5\u8fc7\u7a0b\u6807\u6ce8\u6216\u989d\u5916\u5956\u52b1\u6a21\u578b\uff0c\u57287\u4e2a\u57df\u5185\u5916\u57fa\u51c6\u4e0a\u51cf\u5c11\u5148\u9a8c\u9a71\u52a8\u548c\u786e\u8ba4\u504f\u5dee\uff0c\u63d0\u5347\u591a\u6570\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06128", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u606f\u68c0\u7d22", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06128v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Contextual Information Policy Optimization for Search Agents", "tldr": "\u8bba\u6587\u63d0\u51fa CIPO\uff0c\u4e00\u79cd\u9762\u5411\u641c\u7d22\u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5728\u6bcf\u8f6e\u63a8\u7406\u4e2d\u663e\u5f0f\u5956\u52b1\u88ab\u68c0\u7d22\u8bc1\u636e\u5f71\u54cd\u7684\u884c\u52a8\uff0c\u5e76\u7ed3\u5408\u6700\u7ec8\u7b54\u6848\u5956\u52b1\u4ee5\u4fdd\u6301\u6b63\u786e\u6027\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u4eba\u5de5\u8fc7\u7a0b\u6807\u6ce8\u6216\u989d\u5916\u5956\u52b1\u6a21\u578b\uff0c\u57287\u4e2a\u57df\u5185\u5916\u57fa\u51c6\u4e0a\u51cf\u5c11\u5148\u9a8c\u9a71\u52a8\u548c\u786e\u8ba4\u504f\u5dee\uff0c\u63d0\u5347\u591a\u6570\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
