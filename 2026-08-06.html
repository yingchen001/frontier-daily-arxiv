er \u5728 BrowseComp \u8fbe 37.3%\u3001BrowseComp-ZH \u8fbe 39.1%\uff1b\u52a0\u5165\u4e0a\u4e0b\u6587\u7ba1\u7406\u540e\u63d0\u5347\u81f3 55.3% \u548c 52.9%\uff0c\u53ef\u5339\u914d\u7ea6 30B \u7ea7\u6a21\u578b\u8868\u73b0\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u95ee\u7b54", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2608.05102v1", "published_at": "2026-08-05", "score": 0.312, "selected_reasons": ["HF trending (55\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05102.png", "title": "ABSeeker: Training Long-Horizon Search Agents via Answer-Backtracked Credit Assignment", "tldr": "\u7528\u7b54\u6848\u56de\u6eaf\u4e3a\u957f\u7a0b\u641c\u7d22\u667a\u80fd\u4f53\u5206\u6b65\u5206\u914d\u4fe1\u7528", "upvotes": 55, "what_it_is": "\u8bba\u6587\u63d0\u51fa Answer-Backtracked Credit Assignment\uff08ABC\uff09\uff0c\u5c06\u641c\u7d22\u8f68\u8ff9\u7684\u7a00\u758f\u6210\u8d25\u4fe1\u53f7\u8f6c\u5316\u4e3a\u7ec6\u7c92\u5ea6\u7684\u6b65\u9aa4\u7ea7\u76d1\u7763\u3002\u57fa\u4e8e\u8be5\u6846\u67b6\u8bad\u7ec3\u7684 ABSeeker \u4ec5\u7528 8.5k \u6837\u672c\u5c31\u5728 BrowseComp/\u4e2d\u6587\u7248\u4e0a\u663e\u8457\u63d0\u5347\u957f\u7a0b\u68c0\u7d22\u95ee\u7b54\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u957f\u7a0b\u641c\u7d22\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u7684\u5173\u952e\u75db\u70b9\uff1a\u4f20\u7edf\u65b9\u6cd5\u65e0\u6cd5\u533a\u5206\u8f68\u8ff9\u4e2d\u6709\u7528\u3001\u9519\u8bef\u6216\u5197\u4f59\u6b65\u9aa4\u3002ABC \u63d0\u4f9b\u4e86\u53ef\u7528\u4e8e SFT \u548c RL \u7684\u6b65\u9aa4\u7ea7\u4fe1\u7528\u5206\u914d\u673a\u5236\uff0c\u4f7f\u5c0f\u89c4\u6a21\u6a21\u578b\u4ee5\u8f83\u5c11\u6570\u636e\u83b7\u5f97\u5f3a\u641c\u7d22\u63a8\u7406\u80fd\u529b\uff0c\u5177\u6709\u660e\u663e\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Hospitals are rapidly adopting artificial intelligence for triage, imaging, scheduling etc., yet most deployments remain isolated point solutions locked inside departmental silos, resulting in duplicated effort, hidden risks, and unrealized enterprise value. Despite explosive growth of AI in healthcare market and accelerating investment, an estimated 70-80% of healthcare AI pilots fail to scale, largely due to governance gaps, fragmented data, and missing integration blueprints. This research proposes a hospital-specific, compliance-first, Agentic AI architecture with multiple interoperable layers, extending existing hospital AI platform models with: (i) an Agent Orchestration Layer for multi-agent workflows across clinical, operational, and financial domains, (ii) a Compliance and Policy Layer that centralizes policy-as-code for HIPAA, GDPR, the EU AI Act, DISHA Act, India\u0027s DPDP Act, and ISO/IEC security and safety standards, and (iii) a Privacy-Preserving Data Fabric that plugs federated learning, differential privacy, and secure enclaves into real-world Hospital Information Management System (HIMS) flows. Using a synthetic but structurally realistic hospital dataset and an open, ready-to-deploy prototype implementation, this study demonstrates the end-to-end orchestration of triage risk prediction, workflow optimization, and compliance logging, achieving substantial simulated reductions in task turnaround times and manual documentation effort while maintaining policy-guarded data access. The resulting architecture offers hospital leaders a pragmatic blueprint to move from ad hoc tools to a governed, globally compliant, ROI-focused AI platform that can be tailored to on-premise, hybrid and cloud-native deployments.", "arxiv_id": "2608.06112", "arxiv_url": "https://arxiv.org/abs/2608.06112", "authors": ["Manideep Dhar", "Ritwik Singh", "Sharat Chandra Kumar Manikonda"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u533b\u9662\u4e13\u7528\u7684\u591a\u5c42 Agentic AI \u67b6\u6784\uff0c\u65e8\u5728\u628a\u5206\u6563\u7684\u533b\u7597AI\u70b9\u5de5\u5177\u6574\u5408\u4e3a\u53ef\u6cbb\u7406\u3001\u53ef\u5408\u89c4\u3001\u53ef\u90e8\u7f72\u7684\u5e73\u53f0\u3002\u5176\u539f\u578b\u8986\u76d6\u5206\u8bca\u98ce\u9669\u9884\u6d4b\u3001\u6d41\u7a0b\u4f18\u5316\u4e0e\u5408\u89c4\u65e5\u5fd7\u7b49\u7aef\u5230\u7aef\u573a\u666f\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06112", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u5f15\u5165\u667a\u80fd\u4f53\u7f16\u6392\u5c42\uff0c\u652f\u6301\u4e34\u5e8a\u3001\u8fd0\u8425\u3001\u8d22\u52a1\u7b49\u8de8\u90e8\u95e8\u591a\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u534f\u540c\u3002", "\u8bbe\u8ba1\u5408\u89c4\u4e0e\u653f\u7b56\u5c42\uff0c\u4ee5 policy-as-code \u96c6\u4e2d\u7ba1\u7406 HIPAA\u3001GDPR\u3001EU AI Act\u3001DPDP \u7b49\u6cd5\u89c4\u4e0e\u5b89\u5168\u6807\u51c6\u3002", "\u6784\u5efa\u9690\u79c1\u4fdd\u62a4\u6570\u636e\u7ec7\u7269\uff0c\u5c06\u8054\u90a6\u5b66\u4e60\u3001\u5dee\u5206\u9690\u79c1\u3001\u5b89\u5168 enclave \u63a5\u5165\u533b\u9662\u4fe1\u606f\u7ba1\u7406\u7cfb\u7edf\u6d41\u7a0b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597AI", "\u9690\u79c1\u8ba1\u7b97", "\u5408\u89c4\u6cbb\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06112v1", "published_at": "2026-08-06", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From Siloed Algorithms to Compliance-First Agentic Platforms: A Multi-Layered Architecture for Hospital AI Systems", "tldr": "\u9762\u5411\u533b\u9662\u7684\u5408\u89c4\u4f18\u5148\u591a\u667a\u80fd\u4f53AI\u5e73\u53f0\u67b6\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u533b\u9662\u4e13\u7528\u7684\u591a\u5c42 Agentic AI \u67b6\u6784\uff0c\u65e8\u5728\u628a\u5206\u6563\u7684\u533b\u7597AI\u70b9\u5de5\u5177\u6574\u5408\u4e3a\u53ef\u6cbb\u7406\u3001\u53ef\u5408\u89c4\u3001\u53ef\u90e8\u7f72\u7684\u5e73\u53f0\u3002\u5176\u539f\u578b\u8986\u76d6\u5206\u8bca\u98ce\u9669\u9884\u6d4b\u3001\u6d41\u7a0b\u4f18\u5316\u4e0e\u5408\u89c4\u65e5\u5fd7\u7b49\u7aef\u5230\u7aef\u573a\u666f\u3002", "why_notable": "\u5173\u6ce8\u533b\u7597AI\u96be\u4ee5\u89c4\u6a21\u5316\u843d\u5730\u7684\u6838\u5fc3\u75db\u70b9\uff1a\u6570\u636e\u5272\u88c2\u3001\u6cbb\u7406\u7f3a\u5931\u4e0e\u5408\u89c4\u98ce\u9669\uff1b\u7ed9\u51fa\u53ef\u90e8\u7f72\u539f\u578b\u548c\u67b6\u6784\u84dd\u56fe\uff0c\u5bf9\u533b\u9662\u4ece\u8bd5\u70b9\u5de5\u5177\u8d70\u5411\u4f01\u4e1a\u7ea7AI\u5e73\u53f0\u5177\u6709\u5b9e\u7528\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "LLM agents that repair failures often discard successful corrections, forcing later episodes to rediscover similar solutions. We study whether finalized repair outcomes can improve subsequent Text-to-SQL episodes without parameter updates. We introduce MERIT, a training-free agent that maintains an online dual-polarity memory of oracle-verified corrections and observed unsuccessful directions. Under oracle-assisted benchmark feedback, only memories from earlier finalized episodes are eligible for retrieval. A deterministic classifier assigns a coarse failure type, which conditions a hybrid lexical-dense retriever before the frozen model generates each revision. Using Qwen2.5-7B-Instruct with identical initial predictions and repair budgets, MERIT improves execution accuracy over stateless iterative repair from \\(66.34\\%\\) to \\(69.79\\%\\) on Spider and from \\(47.35\\%\\) to \\(48.44\\%\\) on BIRD. Paired analyses provide clear evidence for the Spider gain but weaker evidence on BIRD. MERIT is not reliably separated from untyped dynamic retrieval on either benchmark, while Reflexion-style memory reaches \\(51.24\\%\\) on BIRD at substantially higher inference cost. Ablations show that negative memory contributes modestly, the value of type conditioning and lexical--dense ranking is dataset dependent, and schema-local experience provides the most consistent benefit. These results clarify when causal cross-query memory improves repair and when broader memory representations remain preferable.", "arxiv_id": "2608.05906", "arxiv_url": "https://arxiv.org/abs/2608.05906", "authors": ["Khang Nhat Hoang Vo", "Tam Minh Chu", "Anh Trac Duc Dinh", "Thuyen Vinh Ha Bui", "Tho Quan"], "brief": "\u8bba\u6587\u63d0\u51fa MERIT\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u53cd\u9988\u9a71\u52a8 LLM \u667a\u80fd\u4f53\u4fee\u590d\u65b9\u6cd5\uff0c\u5c06\u5df2\u9a8c\u8bc1\u6210\u529f\u7684\u4fee\u6b63\u4e0e\u5931\u8d25\u65b9\u5411\u5728\u7ebf\u5b58\u5165\u53cc\u6781\u6027\u8bb0\u5fc6\uff0c\u5e76\u5728\u540e\u7eed Text-to-SQL \u4fee\u590d\u4e2d\u68c0\u7d22\u5229\u7528\u3002\u5b83\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u7814\u7a76\u8de8\u67e5\u8be2\u7ecf\u9a8c\u8bb0\u5fc6\u4f55\u65f6\u80fd\u6539\u5584\u8fed\u4ee3\u4fee\u590d\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05906", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528 oracle \u9a8c\u8bc1\u540e\u7684\u5386\u53f2\u6700\u7ec8\u4fee\u590d\u7ed3\u679c\u4f5c\u4e3a\u53ef\u68c0\u7d22\u8bb0\u5fc6\uff0c\u907f\u514d\u4f7f\u7528\u672a\u6765\u4fe1\u606f\uff0c\u5e76\u540c\u65f6\u7ef4\u62a4\u6b63\u5411\u6210\u529f\u8bb0\u5fc6\u4e0e\u8d1f\u5411\u5931\u8d25\u8bb0\u5fc6", "\u901a\u8fc7\u786e\u5b9a\u6027\u5206\u7c7b\u5668\u5212\u5206\u7c97\u7c92\u5ea6\u5931\u8d25\u7c7b\u578b\uff0c\u518d\u7ed3\u5408\u8bcd\u6cd5\u4e0e\u7a20\u5bc6\u68c0\u7d22\uff0c\u4e3a\u51bb\u7ed3\u7684 Qwen2.5-7B-Instruct \u751f\u6210\u4fee\u8ba2\u63d0\u793a", "\u5728\u76f8\u540c\u521d\u59cb\u9884\u6d4b\u4e0e\u4fee\u590d\u9884\u7b97\u4e0b\uff0cSpider \u6267\u884c\u51c6\u786e\u7387\u4ece 66.34% \u63d0\u5347\u5230 69.79%\uff0cBIRD \u4ece 47.35% \u63d0\u5347\u5230 48.44%\uff0c\u4f46 BIRD \u8bc1\u636e\u8f83\u5f31"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "Text-to-SQL", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05906v1", "published_at": "2026-08-06", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Causal Episodic Memory for Feedback-Driven Agent Repair", "tldr": "\u7528\u56e0\u679c\u8bb0\u5fc6\u63d0\u5347Text-to-SQL\u4fee\u590d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MERIT\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u53cd\u9988\u9a71\u52a8 LLM \u667a\u80fd\u4f53\u4fee\u590d\u65b9\u6cd5\uff0c\u5c06\u5df2\u9a8c\u8bc1\u6210\u529f\u7684\u4fee\u6b63\u4e0e\u5931\u8d25\u65b9\u5411\u5728\u7ebf\u5b58\u5165\u53cc\u6781\u6027\u8bb0\u5fc6\uff0c\u5e76\u5728\u540e\u7eed Text-to-SQL \u4fee\u590d\u4e2d\u68c0\u7d22\u5229\u7528\u3002\u5b83\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u7814\u7a76\u8de8\u67e5\u8be2\u7ecf\u9a8c\u8bb0\u5fc6\u4f55\u65f6\u80fd\u6539\u5584\u8fed\u4ee3\u4fee\u590d\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u7cfb\u7edf\u8bc4\u4f30\u4e86\u201c\u8de8\u8f6e\u6b21\u56e0\u679c\u8bb0\u5fc6\u201d\u5bf9 LLM \u667a\u80fd\u4f53\u4fee\u590d\u7684\u5b9e\u9645\u4ef7\u503c\uff0c\u6307\u51fa schema-local \u7ecf\u9a8c\u6700\u7a33\u5b9a\u6709\u6548\uff0c\u540c\u65f6\u4e5f\u63ed\u793a\u7c7b\u578b\u6761\u4ef6\u68c0\u7d22\u3001\u8d1f\u5411\u8bb0\u5fc6\u548c\u66f4\u590d\u6742\u8bb0\u5fc6\u673a\u5236\u7684\u6536\u76ca\u5177\u6709\u6570\u636e\u96c6\u4f9d\u8d56\u6027\uff0c\u5bf9\u6784\u5efa\u4f4e\u6210\u672c\u3001\u514d\u8bad\u7ec3\u7684\u81ea\u6539\u8fdb\u4ee3\u7406\u6709\u53c2\u8003\u610f\u4e49\u3002"}, {"abstract": "While instruction-based video editing has advanced rapidly, real-world videos contain tightly coupled audio and visual signals, and editing one modality often requires coordinated changes in the other. Existing benchmarks primarily evaluate visual transformations on silent clips or isolated audio editing, leaving complex audio-visual editing and cross-modal consistency underexplored. We introduce AVE-Compass, a comprehensive benchmark with 145 curated source videos, 196 audio-visually coupled editing instructions, and 2,688 fine-grained checklist items. It evaluates Instruction Following, Fidelity Preserving, Realism, and Editing Intent through checklist-based MLLM judging and a dedicated realism rubric, complemented by automated cross-modal, video, and audio metrics. Extensive evaluation shows that state-of-the-art models still struggle to execute cross-modal instructions while preserving non-target content. We further propose AVE-Agent, a modular agent framework that decomposes complex instructions into dependent subtasks and iteratively improves editing results through self-reflection and evaluator feedback. AVE-Agent improves instruction execution, Fidelity Preserving, and audio-visual alignment in joint editing while maintaining competitive perceptual quality.", "arxiv_id": "2607.24821", "arxiv_url": "https://arxiv.org/abs/2607.24821", "authors": ["Yuqing Wen", "Yukai Huang", "Qianqian Xie", "Jiangtao Wu", "Yibin Lin", "Yikai Gu", "Jialu Chen", "Yuanxing Zhang", "Jiaheng Liu"], "brief": "\u8bba\u6587\u63d0\u51fa AVE-Compass\uff0c\u4e00\u4e2a\u9762\u5411\u97f3\u89c6\u9891\u8026\u5408\u7f16\u8f91\u80fd\u529b\u7684\u7efc\u5408\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6145\u4e2a\u89c6\u9891\u3001196\u6761\u8054\u5408\u7f16\u8f91\u6307\u4ee4\u548c2688\u4e2a\u7ec6\u7c92\u5ea6\u68c0\u67e5\u9879\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa AVE-Agent\uff0c\u901a\u8fc7\u4efb\u52a1\u5206\u89e3\u3001\u81ea\u53cd\u601d\u548c\u8bc4\u4f30\u53cd\u9988\u8fed\u4ee3\u6539\u8fdb\u97f3\u89c6\u9891\u7f16\u8f91\u7ed3\u679c\u3002", "categories": ["cs.MM", "cs.CV", "cs.SD"], "github_repo": "https://github.com/NJU-LINK/AVE-Compass", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2607.24821", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8bc4\u6d4b\u7ef4\u5ea6\u5305\u62ec\u6307\u4ee4\u9075\u5faa\u3001\u4fdd\u771f\u4fdd\u6301\u3001\u771f\u5b9e\u611f\u548c\u7f16\u8f91\u610f\u56fe\uff0c\u5e76\u7ed3\u5408 MLLM \u68c0\u67e5\u8868\u8bc4\u5ba1\u3001\u771f\u5b9e\u611f\u89c4\u5219\u548c\u81ea\u52a8\u5316\u8de8\u6a21\u6001\u6307\u6807\u3002", "\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u6700\u5148\u8fdb\u6a21\u578b\u5728\u6267\u884c\u8de8\u6a21\u6001\u7f16\u8f91\u6307\u4ee4\u3001\u540c\u65f6\u4fdd\u6301\u975e\u76ee\u6807\u5185\u5bb9\u65b9\u9762\u4ecd\u660e\u663e\u4e0d\u8db3\u3002", "AVE-Agent \u5c06\u590d\u6742\u6307\u4ee4\u62c6\u89e3\u4e3a\u4f9d\u8d56\u5b50\u4efb\u52a1\uff0c\u5e76\u5229\u7528\u81ea\u53cd\u601d\u4e0e\u8bc4\u4f30\u5668\u53cd\u9988\u63d0\u5347\u6307\u4ee4\u6267\u884c\u3001\u4fdd\u771f\u5ea6\u548c\u97f3\u89c6\u9891\u5bf9\u9f50\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7f16\u8f91", "\u97f3\u9891\u751f\u6210", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "NJU-LINK Lab", "pdf_url": "https://arxiv.org/pdf/2607.24821v1", "published_at": "2026-07-17", "score": 0.295, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24821.png", "title": "AVE-Compass: Towards Holistic Evaluation for Audio-Video Editing Abilities", "tldr": "\u97f3\u89c6\u9891\u8054\u5408\u7f16\u8f91\u57fa\u51c6\u4e0e\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa AVE-Compass\uff0c\u4e00\u4e2a\u9762\u5411\u97f3\u89c6\u9891\u8026\u5408\u7f16\u8f91\u80fd\u529b\u7684\u7efc\u5408\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6145\u4e2a\u89c6\u9891\u3001196\u6761\u8054\u5408\u7f16\u8f91\u6307\u4ee4\u548c2688\u4e2a\u7ec6\u7c92\u5ea6\u68c0\u67e5\u9879\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa AVE-Agent\uff0c\u901a\u8fc7\u4efb\u52a1\u5206\u89e3\u3001\u81ea\u53cd\u601d\u548c\u8bc4\u4f30\u53cd\u9988\u8fed\u4ee3\u6539\u8fdb\u97f3\u89c6\u9891\u7f16\u8f91\u7ed3\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u9f50\u4e86\u97f3\u89c6\u9891\u8054\u5408\u7f16\u8f91\u8bc4\u6d4b\u7684\u7a7a\u767d\uff0c\u5f3a\u8c03\u771f\u5b9e\u89c6\u9891\u4e2d\u97f3\u9891\u4e0e\u89c6\u89c9\u7684\u8026\u5408\u4e00\u81f4\u6027\uff1b\u540c\u65f6\u7ed9\u51fa\u53ef\u63d0\u5347\u73b0\u6709\u6a21\u578b\u8868\u73b0\u7684\u667a\u80fd\u4f53\u5f0f\u7f16\u8f91\u6846\u67b6\uff0c\u5bf9\u591a\u6a21\u6001\u751f\u6210\u4e0e\u7f16\u8f91\u7cfb\u7edf\u843d\u5730\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Learning generalizable robot manipulation policies requires large-scale and diverse demonstration data. Egocentric human manipulation videos offer rich scene and task diversity, and prior work has shown that retargeting and rendering such videos into robot-format data can yield effective per-task policies at small scale. However, whether this approach can provide pretraining benefits for vision-language-action models at scale remains unexplored. We present \\textbf{Ego2Robot}, a scalable pipeline that converts egocentric human manipulation videos into robot training data through action retargeting, robot-arm visual synthesis, and multi-level quality curation. Ego2Robot supports both curated datasets and in-the-wild videos, producing 18,561 hours of robot training data spanning 15 robot morphologies, making it the largest ego-to-robot dataset to date. To evaluate generalization, we extend RoboTwin2.0 with disentangled perturbation axes covering visual appearance, scene layout, embodiment morphology, and task semantics. Experiments show that joint pretraining on Ego2Robot-synthesized and robot data consistently improves out-of-distribution generalization across multiple perturbation types, with benefits validated on real-robot deployment. Project page: https://www-ye.github.io/ego2robot_blog/", "arxiv_id": "2608.02580", "arxiv_url": "https://arxiv.org/abs/2608.02580", "authors": ["Ye Wang", "Pei Lin", "Xiong-Hui Chen", "Haoqi Yuan", "Zhixuan Liang", "Yiyang Huang", "Anzhe Chen", "Zixing Lei", "Jie Zhang", "Tao Zhang", "Haoyang Li", "Tong Zhang", "Chenxi Xiao", "Ziyuan Jiao", "Qin Jin"], "brief": "\u8bba\u6587\u63d0\u51fa Ego2Robot\uff0c\u4e00\u6761\u53ef\u6269\u5c55\u6d41\u6c34\u7ebf\uff0c\u5c06\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u64cd\u4f5c\u89c6\u9891\u901a\u8fc7\u52a8\u4f5c\u91cd\u5b9a\u5411\u3001\u673a\u5668\u4eba\u624b\u81c2\u89c6\u89c9\u5408\u6210\u548c\u591a\u7ea7\u8d28\u91cf\u7b5b\u9009\uff0c\u8f6c\u6362\u4e3a\u673a\u5668\u4eba\u8bad\u7ec3\u6570\u636e\u3002\u5b83\u751f\u6210\u4e86\u8986\u76d615\u79cd\u673a\u5668\u4eba\u5f62\u6001\u768418561\u5c0f\u65f6\u8bad\u7ec3\u6570\u636e\uff0c\u5e76\u7528\u4e8e\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u9884\u8bad\u7ec3\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.02580", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u652f\u6301\u7cbe\u9009\u6570\u636e\u96c6\u4e0e\u91ce\u5916\u89c6\u9891\uff0c\u6784\u5efa\u76ee\u524d\u6700\u5927\u89c4\u6a21\u7684 ego-to-robot \u6570\u636e\u96c6", "\u901a\u8fc7\u52a8\u4f5c\u91cd\u5b9a\u5411\u548c\u673a\u5668\u4eba\u5916\u89c2\u5408\u6210\uff0c\u628a\u4eba\u7c7b\u64cd\u4f5c\u8f68\u8ff9\u8f6c\u4e3a\u591a\u5f62\u6001\u673a\u5668\u4eba\u53ef\u7528\u6570\u636e", "\u6269\u5c55 RoboTwin2.0\uff0c\u5f15\u5165\u89c6\u89c9\u5916\u89c2\u3001\u573a\u666f\u5e03\u5c40\u3001\u673a\u5668\u4eba\u5f62\u6001\u548c\u4efb\u52a1\u8bed\u4e49\u7b49\u89e3\u8026\u6270\u52a8\u8bc4\u6d4b"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6570\u636e\u5408\u6210", "\u6a21\u4eff\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02580v1", "published_at": "2026-08-03", "score": 0.288, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02580.png", "title": "Ego2Robot: Scalable Robot Data Synthesis from Egocentric Human Data", "tldr": "\u5c06\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u89c6\u9891\u5927\u89c4\u6a21\u8f6c\u6210\u673a\u5668\u4eba\u6570\u636e", "upvotes": 21, "what_it_is": "\u8bba\u6587\u63d0\u51fa Ego2Robot\uff0c\u4e00\u6761\u53ef\u6269\u5c55\u6d41\u6c34\u7ebf\uff0c\u5c06\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u64cd\u4f5c\u89c6\u9891\u901a\u8fc7\u52a8\u4f5c\u91cd\u5b9a\u5411\u3001\u673a\u5668\u4eba\u624b\u81c2\u89c6\u89c9\u5408\u6210\u548c\u591a\u7ea7\u8d28\u91cf\u7b5b\u9009\uff0c\u8f6c\u6362\u4e3a\u673a\u5668\u4eba\u8bad\u7ec3\u6570\u636e\u3002\u5b83\u751f\u6210\u4e86\u8986\u76d615\u79cd\u673a\u5668\u4eba\u5f62\u6001\u768418561\u5c0f\u65f6\u8bad\u7ec3\u6570\u636e\uff0c\u5e76\u7528\u4e8e\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u9884\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9a8c\u8bc1\u4e86\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u89c6\u9891\u53ef\u4f5c\u4e3a\u5927\u89c4\u6a21\u673a\u5668\u4eba\u9884\u8bad\u7ec3\u6570\u636e\u6765\u6e90\uff0c\u5e76\u663e\u793a\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u6570\u636e\u8054\u5408\u9884\u8bad\u7ec3\u80fd\u63d0\u5347\u591a\u79cd\u5206\u5e03\u5916\u6cdb\u5316\u80fd\u529b\uff0c\u4e14\u5728\u771f\u5b9e\u673a\u5668\u4eba\u90e8\u7f72\u4e2d\u5f97\u5230\u9a8c\u8bc1\u3002"}, {"abstract": "Unified multimodal retrieval aims to identify candidates that satisfy complex user intent expressed through heterogeneous inputs. Although Large Vision-Language Model (LVLM)-based retrievers are efficient and scalable, directly encoding raw multimodal inputs often misses fine-grained discriminative cues, leading to confusion among semantically similar candidates. Recent methods mitigate this limitation by generating Chain-of-Thought (CoT) rationales to enrich the query representation. However, such reasoning is typically derived from the query alone: it explains what the query describes, but not what the retriever misunderstands. We argue that effective retrieval reasoning should instead be conditioned on retrieval feedback. Based on this insight, we introduce UniME-R1, an embedder-adviser framework that learns to reason over initially retrieved candidates and generate Retrieval-Centric Chain-of-Thought (RC-CoT). The adviser analyzes candidates individually to identify the discriminative cues confused by the embedder. If the target appears in the initial top-k set, UniME-R1 directly reranks the candidates; otherwise, it generates RC-CoT to refine the retrieval direction and performs full-corpus re-retrieval with a dual-mode embedder. To train the framework, we mine hard negatives to simulate realistic retrieval failures, jointly optimize direct retrieval and RC-CoT-augmented retrieval, and align the adviser with retrieval outcomes through supervised learning and retrieval-oriented reinforcement learning. Extensive experiments on MMEB-V2 and a diverse set of general multimodal retrieval benchmarks demonstrate that UniME-R1 consistently improves retrieval performance over strong baselines.", "arxiv_id": "2608.06060", "arxiv_url": "https://arxiv.org/abs/2608.06060", "authors": ["Zelong Sun", "Jun Wang", "Kaicheng Yang", "Tiancheng Gu", "Ziyong Feng", "Zhiwu Lu"], "brief": "\u8bba\u6587\u63d0\u51fa UniME-R1\uff0c\u4e00\u4e2a embedder-adviser \u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u57fa\u4e8e\u521d\u6b21\u68c0\u7d22\u7ed3\u679c\u4e2d\u7684\u6df7\u6dc6\u5019\u9009\u751f\u6210 Retrieval-Centric CoT\uff0c\u800c\u4e0d\u662f\u53ea\u56f4\u7ed5\u67e5\u8be2\u672c\u8eab\u63a8\u7406\u3002\u5b83\u53ef\u5728\u76ee\u6807\u5df2\u8fdb\u5165 top-k \u65f6\u76f4\u63a5\u91cd\u6392\uff0c\u5426\u5219\u7528 RC-CoT \u6539\u5199\u68c0\u7d22\u65b9\u5411\u5e76\u8fdb\u884c\u5168\u5e93\u518d\u68c0\u7d22\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/deepglint/UniME-R1", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.06060", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["adviser \u9010\u4e2a\u5206\u6790\u521d\u68c0\u5019\u9009\uff0c\u5b9a\u4f4d embedder \u6df7\u6dc6\u7684\u7ec6\u7c92\u5ea6\u533a\u5206\u7ebf\u7d22\uff0c\u751f\u6210\u9762\u5411\u68c0\u7d22\u5931\u8d25\u7684 RC-CoT", "\u901a\u8fc7\u6316\u6398 hard negatives \u6a21\u62df\u771f\u5b9e\u68c0\u7d22\u5931\u8d25\uff0c\u8054\u5408\u4f18\u5316\u76f4\u63a5\u68c0\u7d22\u4e0e RC-CoT \u589e\u5f3a\u68c0\u7d22", "\u7ed3\u5408\u76d1\u7763\u5b66\u4e60\u4e0e\u9762\u5411\u68c0\u7d22\u7ed3\u679c\u7684\u5f3a\u5316\u5b66\u4e60\u5bf9\u9f50 adviser\uff0c\u5728 MMEB-V2 \u548c\u591a\u7c7b\u591a\u6a21\u6001\u68c0\u7d22\u57fa\u51c6\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u5f3a\u57fa\u7ebf"], "keywords": ["\u591a\u6a21\u6001\u68c0\u7d22", "\u94fe\u5f0f\u601d\u7ef4", "\u5f3a\u5316\u5b66\u4e60", "\u96be\u8d1f\u6837\u672c"], "num_comments": 1, "on_hf": true, "organization": "DeepGlint", "pdf_url": "https://arxiv.org/pdf/2608.06060v1", "published_at": "2026-08-06", "score": 0.272, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06060.png", "title": "Learning from Failures: Retrieval-Centric CoT via Hard Negatives for Unified Multimodal Retrieval", "tldr": "\u7528\u68c0\u7d22\u5931\u8d25\u53cd\u9988\u751f\u6210\u591a\u6a21\u6001\u68c0\u7d22\u63a8\u7406", "upvotes": 21, "what_it_is": "\u8bba\u6587\u63d0\u51fa UniME-R1\uff0c\u4e00\u4e2a embedder-adviser \u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u57fa\u4e8e\u521d\u6b21\u68c0\u7d22\u7ed3\u679c\u4e2d\u7684\u6df7\u6dc6\u5019\u9009\u751f\u6210 Retrieval-Centric CoT\uff0c\u800c\u4e0d\u662f\u53ea\u56f4\u7ed5\u67e5\u8be2\u672c\u8eab\u63a8\u7406\u3002\u5b83\u53ef\u5728\u76ee\u6807\u5df2\u8fdb\u5165 top-k \u65f6\u76f4\u63a5\u91cd\u6392\uff0c\u5426\u5219\u7528 RC-CoT \u6539\u5199\u68c0\u7d22\u65b9\u5411\u5e76\u8fdb\u884c\u5168\u5e93\u518d\u68c0\u7d22\u3002", "why_notable": "\u5b83\u628a CoT \u4ece\u201c\u89e3\u91ca\u67e5\u8be2\u201d\u8f6c\u5411\u201c\u89e3\u91ca\u68c0\u7d22\u5668\u9519\u5728\u54ea\u91cc\u201d\uff0c\u66f4\u8d34\u8fd1\u68c0\u7d22\u7cfb\u7edf\u7684\u771f\u5b9e\u8bef\u5dee\u6765\u6e90\uff0c\u6709\u671b\u63d0\u5347\u590d\u6742\u610f\u56fe\u3001\u591a\u6a21\u6001\u8f93\u5165\u548c\u76f8\u4f3c\u5019\u9009\u573a\u666f\u4e0b\u7684\u7ec6\u7c92\u5ea6\u68c0\u7d22\u6548\u679c\u3002"}, {"abstract": "Multimodal large language models excel at passive perception but struggle with complex visual cognitive tasks requiring multi-step temporal reasoning. This degradation largely stems from the inherent ambiguity of language-based reasoning, which often fails to accurately articulate continuous visual transformations. To address this, we propose ChronoVision, a multimodal framework designed to align visual logic with latent imagery. During supervised fine-tuning, a Reconstructive Visual Head predicts the latent representation of the final transformed state, while an ROI Attention Locating module focuses the model on key visual evidence via semantic span queries. In post-training, we apply reinforcement learning with an implicit process grounding mechanism, guided by a composite reward function that evaluates outcome correctness, latent process alignment, and unsupervised visual focus. Furthermore, we introduce Vbvr-VQA, a novel dataset that evaluates temporal tracking by reformulating video reasoning into a strict image-ordering task. Experiments demonstrate that ChronoVision achieves state-of-the-art performance on Vbvr-VQA with 74.8% in-domain and 71.6% out-of-domain accuracy, alongside a strong 55.0% accuracy on IntPhys2, a highly challenging cross-domain benchmark.", "arxiv_id": "2608.05631", "arxiv_url": "https://arxiv.org/abs/2608.05631", "authors": ["Yifan Shen", "Jian Xu", "Boyi Li", "Yuner Zhang", "Tianjiao Yu", "Bingxuan Li", "Houze Yang", "Rushi Wang", "Xu Cao"], "brief": "ChronoVision \u662f\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u65f6\u95f4\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u9884\u6d4b\u89c6\u89c9\u53d8\u6362\u540e\u7684\u6f5c\u5728\u6700\u7ec8\u72b6\u6001\uff0c\u8ba9\u6a21\u578b\u4e0d\u53ea\u7528\u8bed\u8a00\u94fe\u5f0f\u63a8\u7406\uff0c\u800c\u662f\u5bf9\u9f50\u8fde\u7eed\u89c6\u89c9\u53d8\u5316\u8fc7\u7a0b\u3002\u8bba\u6587\u8fd8\u63d0\u51fa Vbvr-VQA \u6570\u636e\u96c6\uff0c\u5c06\u89c6\u9891\u65f6\u95f4\u8ffd\u8e2a\u91cd\u6784\u4e3a\u4e25\u683c\u7684\u56fe\u50cf\u6392\u5e8f\u4efb\u52a1\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05631", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Reconstructive Visual Head\uff0c\u5728\u76d1\u7763\u5fae\u8c03\u9636\u6bb5\u9884\u6d4b\u6700\u7ec8\u53d8\u6362\u72b6\u6001\u7684\u6f5c\u5728\u8868\u793a\uff0c\u7f13\u89e3\u8bed\u8a00\u63cf\u8ff0\u8fde\u7eed\u89c6\u89c9\u53d8\u5316\u7684\u6b67\u4e49\u3002", "\u8bbe\u8ba1 ROI Attention Locating \u6a21\u5757\uff0c\u901a\u8fc7\u8bed\u4e49 span \u67e5\u8be2\u5b9a\u4f4d\u5173\u952e\u89c6\u89c9\u8bc1\u636e\uff0c\u63d0\u5347\u6a21\u578b\u5bf9\u65f6\u95f4\u63a8\u7406\u4e2d\u5173\u952e\u533a\u57df\u7684\u5173\u6ce8\u3002", "\u540e\u8bad\u7ec3\u9636\u6bb5\u91c7\u7528\u5f3a\u5316\u5b66\u4e60\u4e0e\u9690\u5f0f\u8fc7\u7a0b grounding\uff0c\u5956\u52b1\u540c\u65f6\u8003\u8651\u7ed3\u679c\u6b63\u786e\u6027\u3001\u6f5c\u5728\u8fc7\u7a0b\u5bf9\u9f50\u548c\u65e0\u76d1\u7763\u89c6\u89c9\u805a\u7126\uff1b\u5728 Vbvr-VQA \u4e0a\u8fbe\u5230 74.8% \u57df\u5185\u300171.6% \u57df\u5916\u51c6\u786e\u7387\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u65f6\u95f4\u63a8\u7406", "\u89c6\u89c9\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "PediaMed AI", "pdf_url": "https://arxiv.org/pdf/2608.05631v1", "published_at": "2026-08-06", "score": 0.261, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05631.png", "title": "ChronoVision: Temporal Reasoning via Latent State Reconstruction", "tldr": "\u7528\u6f5c\u5728\u72b6\u6001\u91cd\u5efa\u63d0\u5347\u89c6\u89c9\u65f6\u95f4\u63a8\u7406\u3002", "upvotes": 22, "what_it_is": "ChronoVision \u662f\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u65f6\u95f4\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u9884\u6d4b\u89c6\u89c9\u53d8\u6362\u540e\u7684\u6f5c\u5728\u6700\u7ec8\u72b6\u6001\uff0c\u8ba9\u6a21\u578b\u4e0d\u53ea\u7528\u8bed\u8a00\u94fe\u5f0f\u63a8\u7406\uff0c\u800c\u662f\u5bf9\u9f50\u8fde\u7eed\u89c6\u89c9\u53d8\u5316\u8fc7\u7a0b\u3002\u8bba\u6587\u8fd8\u63d0\u51fa Vbvr-VQA \u6570\u636e\u96c6\uff0c\u5c06\u89c6\u9891\u65f6\u95f4\u8ffd\u8e2a\u91cd\u6784\u4e3a\u4e25\u683c\u7684\u56fe\u50cf\u6392\u5e8f\u4efb\u52a1\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u65f6\u95f4\u63a8\u7406\u4ece\u7eaf\u8bed\u8a00\u63a8\u7406\u8f6c\u5411\u6f5c\u5728\u89c6\u89c9\u72b6\u6001\u91cd\u5efa\uff0c\u4e3a\u591a\u6a21\u6001\u6a21\u578b\u5904\u7406\u8fde\u7eed\u89c6\u89c9\u53d8\u5316\u3001\u7269\u7406\u8fc7\u7a0b\u548c\u89c6\u9891\u7406\u89e3\u63d0\u4f9b\u4e86\u66f4\u53ef\u9a8c\u8bc1\u7684\u8bad\u7ec3\u4fe1\u53f7\u4e0e\u8bc4\u6d4b\u65b9\u5f0f\u3002"}, {"abstract": "On-Policy Distillation (OPD) is emerging as a promising alternative to reinforcement learning for LLM post-training, yet its effectiveness in multilingual settings remains underexplored. We study OPD and its advanced variant, On-Policy Delta Distillation (OPD$^2$), for mathematical reasoning in English, Korean, and Japanese. OPD$^2$ improves OPD by using the probability gap between a post-trained teacher and its base model as the learning signal. Experiments with Qwen3 show that OPD$^2$ consistently outperforms the original OPD, with particularly strong improvements in Korean and Japanese, and generally narrows the English-Korean performance gap. We further find that English-only OPD can also increase performance for Korean and Japanese, but often shifts the responses toward English, highlighting the importance of multilingual data to preserving target-language responses.", "arxiv_id": "2608.05802", "arxiv_url": "https://arxiv.org/abs/2608.05802", "authors": ["Byeongho Heo", "Jaehui Hwang", "Sangdoo Yun", "Dongyoon Han"], "brief": "\u672c\u6587\u7814\u7a76\u5c06\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u53ca\u5176\u6539\u8fdb\u7248 OPD\u00b2 \u7528\u4e8e\u82f1\u8bed\u3001\u97e9\u8bed\u3001\u65e5\u8bed\u7684\u6570\u5b66\u63a8\u7406\u540e\u8bad\u7ec3\u3002\u5b9e\u9a8c\u663e\u793a OPD\u00b2 \u76f8\u6bd4\u539f\u59cb OPD \u7a33\u5b9a\u63d0\u5347\uff0c\u5c24\u5176\u5728\u97e9\u8bed\u548c\u65e5\u8bed\u4e0a\u6548\u679c\u66f4\u660e\u663e\uff0c\u5e76\u80fd\u7f29\u5c0f\u82f1\u97e9\u6027\u80fd\u5dee\u8ddd\uff1b\u4f46\u4ec5\u7528\u82f1\u6587\u6570\u636e\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u8f93\u51fa\u504f\u5411\u82f1\u6587\uff0c\u8bf4\u660e\u591a\u8bed\u6570\u636e\u5f88\u91cd\u8981\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05802", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u591a\u8bed\u8a00", "\u6570\u5b66\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "NAVER AI Lab", "pdf_url": "https://arxiv.org/pdf/2608.05802v1", "published_at": "2026-08-06", "score": 0.078, "selected_reasons": ["HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05802.png", "title": "On-Policy Delta Distillation for Multilingual Math Reasoning", "tldr": "\u672c\u6587\u7814\u7a76\u5c06\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u53ca\u5176\u6539\u8fdb\u7248 OPD\u00b2 \u7528\u4e8e\u82f1\u8bed\u3001\u97e9\u8bed\u3001\u65e5\u8bed\u7684\u6570\u5b66\u63a8\u7406\u540e\u8bad\u7ec3\u3002\u5b9e\u9a8c\u663e\u793a OPD\u00b2 \u76f8\u6bd4\u539f\u59cb OPD \u7a33\u5b9a\u63d0\u5347\uff0c\u5c24\u5176\u5728\u97e9\u8bed\u548c\u65e5\u8bed\u4e0a\u6548\u679c\u66f4\u660e\u663e\uff0c\u5e76\u80fd\u7f29\u5c0f\u82f1\u97e9\u6027\u80fd\u5dee\u8ddd\uff1b\u4f46\u4ec5\u7528\u82f1\u6587\u6570\u636e\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u8f93\u51fa\u504f\u5411\u82f1\u6587\uff0c\u8bf4\u660e\u591a\u8bed\u6570\u636e\u5f88\u91cd\u8981\u3002", "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "Training terminal agents requires executable and verifiable tasks that are not merely solvable, but appropriately challenging for learning. Executable validation establishes feasibility, yet does not reveal how a task behaves relative to a given solver setting. In this paper, we present CalibForge, an autonomous terminal-task synthesis system that uses verified solver behavior to revise candidate tasks through adversarial solver calibration. Multi-solver calibration targets disagreement within a heterogeneous solver pool, whereas contrastive solver calibration targets a designated strong-pass/weak-fail relation; both operationalize a solver-relative learnable zone anchored in demonstrated solvability. Using CalibForge, we construct 5,431 calibrated terminal tasks. Our ablations show that both strategies yield more effective supervision than authoring and validation alone or ordinary single-solver feedback. Models trained on the full collection achieve 32.58% and 47.57% on Terminal-Bench 2.0. The largest improvements over the corresponding base model reach 24.71 percentage points on Terminal-Bench 2.0, 27.68 points on SWE-bench Pro, and 30.04 points on Doc2Repo. Together, these results support solver-relative learnability as a practical target for constructing effective and transferable agent training data.", "arxiv_id": "2608.06352", "arxiv_url": "https://arxiv.org/abs/2608.06352", "authors": ["Fanzhe Meng", "Guoxin Chen", "Jiale Zhao", "Shuang Sun", "Zhiyu Lin", "Wayne Xin Zhao", "Ruihua Song", "Ji-Rong Wen", "Kai Jia"], "brief": "\u63d0\u51fa CalibForge\uff0c\u4e00\u4e2a\u81ea\u52a8\u5408\u6210\u7ec8\u7aef\u4efb\u52a1\u7684\u7cfb\u7edf\uff0c\u901a\u8fc7\u5df2\u9a8c\u8bc1\u7684\u6c42\u89e3\u5668\u884c\u4e3a\u8fdb\u884c\u5bf9\u6297\u5f0f\u6821\u51c6\uff0c\u8ba9\u4efb\u52a1\u5904\u4e8e\u201c\u53ef\u89e3\u4f46\u6709\u5b66\u4e60\u4ef7\u503c\u201d\u7684\u96be\u5ea6\u533a\u95f4\u3002\u57fa\u4e8e 5431 \u4e2a\u6821\u51c6\u4efb\u52a1\u8bad\u7ec3\u540e\uff0c\u6a21\u578b\u5728 Terminal-Bench 2.0\u3001SWE-bench Pro \u548c Doc2Repo \u4e0a\u76f8\u5bf9\u57fa\u5ea7\u6a21\u578b\u83b7\u5f97\u6700\u9ad8\u7ea6 24.71\u300127.68\u300130.04 \u4e2a\u767e\u5206\u70b9\u63d0\u5347\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u7684\u53ef\u8fc1\u79fb\u667a\u80fd\u4f53\u8bad\u7ec3\u6548\u679c\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/AweAI-Team/CalibForge", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.06352", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4efb\u52a1\u5408\u6210", "\u6570\u636e\u6784\u9020", "\u4ee3\u7801\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "AweAI Team", "pdf_url": "https://arxiv.org/pdf/2608.06352v1", "published_at": "2026-08-06", "score": 0.073, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06352.png", "title": "CalibForge: Adversarial Solver Calibration for Scaling Learnable Terminal Tasks", "tldr": "\u63d0\u51fa CalibForge\uff0c\u4e00\u4e2a\u81ea\u52a8\u5408\u6210\u7ec8\u7aef\u4efb\u52a1\u7684\u7cfb\u7edf\uff0c\u901a\u8fc7\u5df2\u9a8c\u8bc1\u7684\u6c42\u89e3\u5668\u884c\u4e3a\u8fdb\u884c\u5bf9\u6297\u5f0f\u6821\u51c6\uff0c\u8ba9\u4efb\u52a1\u5904\u4e8e\u201c\u53ef\u89e3\u4f46\u6709\u5b66\u4e60\u4ef7\u503c\u201d\u7684\u96be\u5ea6\u533a\u95f4\u3002\u57fa\u4e8e 5431 \u4e2a\u6821\u51c6\u4efb\u52a1\u8bad\u7ec3\u540e\uff0c\u6a21\u578b\u5728 Terminal-Bench 2.0\u3001SWE-bench Pro \u548c Doc2Repo \u4e0a\u76f8\u5bf9\u57fa\u5ea7\u6a21\u578b\u83b7\u5f97\u6700\u9ad8\u7ea6 24.71\u300127.68\u300130.04 \u4e2a\u767e\u5206\u70b9\u63d0\u5347\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u7684\u53ef\u8fc1\u79fb\u667a\u80fd\u4f53\u8bad\u7ec3\u6548\u679c\u3002", "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) models have become a powerful paradigm for robot manipulation, but training a single generalist policy for heterogeneous robot embodiments remains an open problem. Existing methods have two main limitations. First, they underuse dynamics priors shared across diverse visual and interaction data, limiting cross-embodiment transfer. Second, they require extensive manual preprocessing to convert embodiment-specific actions into a common format. To overcome these limitations, we propose DyPES-VLA, a cross-embodiment VLA that learns shared Dynamics Priors and Embodiment-Specific control. First, we learn shared dynamics priors by training the vision-language model (VLM) with a future-prediction objective on cross-embodiment data, driving the shared query representation to capture object motion, contact, and interaction-induced scene changes. Second, an embodiment-specific Mixture-of-Experts (MoE) action head translates these shared dynamics priors into executable controls directly in each embodiment\u0027s native action space, without manually pre-aligning heterogeneous actions into a common format. This head shares attention layers to capture common temporal action structures, while its embodiment-specific feed-forward experts resolve the unique kinematic constraints and control semantics of distinct embodiments. As a generalist policy, our \\ourmethod achieves state-of-the-art performance across simulation and real-world evaluations, reaching 98.0% success on LIBERO, 59.25% on RoboCasa-GR1, and 89.02% on RoboTwin~2.0.", "arxiv_id": "2608.06374", "arxiv_url": "https://arxiv.org/abs/2608.06374", "authors": ["Junfeng Li", "Junjie He", "Zhide Zhong", "Yangyang Zheng", "Pingyue Sheng", "Jiayu Dong", "Ruixin Li", "Haodong Yan", "Jiaguan Zhu", "Tianran Zhang", "Runze Yu", "Wen Chen", "Liuqing Yang", "Yuxiang Gao", "Haoang Li"], "brief": "\u672c\u6587\u63d0\u51fa DyPES-VLA\uff0c\u7528\u672a\u6765\u9884\u6d4b\u76ee\u6807\u4ece\u8de8\u672c\u4f53\u6570\u636e\u4e2d\u5b66\u4e60\u5171\u4eab\u52a8\u529b\u5b66\u5148\u9a8c\uff0c\u5e76\u901a\u8fc7\u672c\u4f53\u7279\u5b9a\u7684 MoE \u52a8\u4f5c\u5934\u76f4\u63a5\u8f93\u51fa\u5404\u673a\u5668\u4eba\u539f\u751f\u52a8\u4f5c\u7a7a\u95f4\u7684\u63a7\u5236\u3002\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u624b\u5de5\u52a8\u4f5c\u5bf9\u9f50\u9700\u6c42\uff0c\u5728 LIBERO\u3001RoboCasa-GR1 \u548c RoboTwin 2.0 \u7b49\u4eff\u771f\u4e0e\u771f\u5b9e\u8bc4\u6d4b\u4e2d\u53d6\u5f97\u9886\u5148\u6210\u529f\u7387\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06374", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u8de8\u672c\u4f53\u5b66\u4e60", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06374v1", "published_at": "2026-08-06", "score": 0.07, "selected_reasons": ["HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06374.png", "title": "DyPES-VLA: Learning Shared Dynamics Priors and Embodiment-Specific Control for Cross-Embodiment Manipulation", "tldr": "\u672c\u6587\u63d0\u51fa DyPES-VLA\uff0c\u7528\u672a\u6765\u9884\u6d4b\u76ee\u6807\u4ece\u8de8\u672c\u4f53\u6570\u636e\u4e2d\u5b66\u4e60\u5171\u4eab\u52a8\u529b\u5b66\u5148\u9a8c\uff0c\u5e76\u901a\u8fc7\u672c\u4f53\u7279\u5b9a\u7684 MoE \u52a8\u4f5c\u5934\u76f4\u63a5\u8f93\u51fa\u5404\u673a\u5668\u4eba\u539f\u751f\u52a8\u4f5c\u7a7a\u95f4\u7684\u63a7\u5236\u3002\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u624b\u5de5\u52a8\u4f5c\u5bf9\u9f50\u9700\u6c42\uff0c\u5728 LIBERO\u3001RoboCasa-GR1 \u548c RoboTwin 2.0 \u7b49\u4eff\u771f\u4e0e\u771f\u5b9e\u8bc4\u6d4b\u4e2d\u53d6\u5f97\u9886\u5148\u6210\u529f\u7387\u3002", "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Model checkpoints are growing in both number and size, which makes archival, transfer, and deployment increasingly costly. General-purpose compressors can reduce storage requirements but ignore tensor structure, whereas existing tensor-specific compressors rely on fixed and format-specific pipelines. We present Brevis, which formulates lossless tensor compression as program synthesis. We design a typed domain-specific language (DSL) that captures recurring tensor structures, such as repeated regions and floating-point fields, through a set of reversible operators. Given a tensor, Brevis synthesizes a self-contained DSL program that reconstructs it bit-exactly. A checkpoint-specific production prior, learned from a small representative sample of tensors, guides a bounded A* search to synthesize compact programs, which can later be executed directly for bit-exact decompression. On 10 public checkpoints spanning language, audio, and image generation models, Brevis reduces 2.13 TB of checkpoint data to 1.41 TB, a 33.93% storage reduction. It produces archives up to 30.87% smaller than those of four general-purpose compressors, including zstd and gzip, and smaller archives than the tensor-specific compressors ZipNN and DFloat11. Under a practical concurrency configuration, Brevis achieves 3.60 GB/s compression and 6.61 GB/s decompression while preserving every source byte.", "arxiv_id": "2608.02162", "arxiv_url": "https://arxiv.org/abs/2608.02162", "authors": ["Jieke Shi", "Junda He", "Wenjia Jiang", "Weifeng Sun", "Shidong Pan", "Zhensu Sun", "Chengran Yang", "Peixin Zhang", "Yifan Jia", "Zhou Yang", "Thong Hoang", "Xiwei Xu", "Zhenchang Xing", "David Lo"], "brief": "\u8bba\u6587\u63d0\u51fa Brevis\uff0c\u5c06\u65e0\u635f\u5f20\u91cf\u538b\u7f29\u5efa\u6a21\u4e3a\u7a0b\u5e8f\u5408\u6210\uff1a\u7528\u5e26\u7c7b\u578b\u7684 DSL \u548c\u53ef\u9006\u7b97\u5b50\u63cf\u8ff0\u5f20\u91cf\u4e2d\u7684\u91cd\u590d\u533a\u57df\u3001\u6d6e\u70b9\u5b57\u6bb5\u7b49\u7ed3\u6784\uff0c\u5e76\u5408\u6210\u53ef\u7cbe\u786e\u91cd\u6784\u7684\u81ea\u5305\u542b\u7a0b\u5e8f\u3002\u5728 10 \u4e2a\u516c\u5f00\u6a21\u578b checkpoint \u4e0a\uff0c\u5c06 2.13TB \u538b\u7f29\u5230 1.41TB\uff0c\u8f83\u901a\u7528\u538b\u7f29\u5668\u548c\u90e8\u5206\u5f20\u91cf\u4e13\u7528\u538b\u7f29\u5668\u66f4\u5c0f\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u538b\u7f29/\u89e3\u538b\u541e\u5410\u3002", "categories": ["cs.SE", "cs.AI", "cs.PL"], "github_repo": "https://github.com/jiekeshi/Brevis", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.02162", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u7a0b\u5e8f\u5408\u6210", "\u5f20\u91cf\u538b\u7f29", "\u68c0\u67e5\u70b9"], "num_comments": 2, "on_hf": true, "organization": "Singapore Management University", "pdf_url": "https://arxiv.org/pdf/2608.02162v1", "published_at": "2026-08-03", "score": 0.07, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02162.png", "title": "Lossless Tensor Compression as Program Synthesis", "tldr": "\u8bba\u6587\u63d0\u51fa Brevis\uff0c\u5c06\u65e0\u635f\u5f20\u91cf\u538b\u7f29\u5efa\u6a21\u4e3a\u7a0b\u5e8f\u5408\u6210\uff1a\u7528\u5e26\u7c7b\u578b\u7684 DSL \u548c\u53ef\u9006\u7b97\u5b50\u63cf\u8ff0\u5f20\u91cf\u4e2d\u7684\u91cd\u590d\u533a\u57df\u3001\u6d6e\u70b9\u5b57\u6bb5\u7b49\u7ed3\u6784\uff0c\u5e76\u5408\u6210\u53ef\u7cbe\u786e\u91cd\u6784\u7684\u81ea\u5305\u542b\u7a0b\u5e8f\u3002\u5728 10 \u4e2a\u516c\u5f00\u6a21\u578b checkpoint \u4e0a\uff0c\u5c06 2.13TB \u538b\u7f29\u5230 1.41TB\uff0c\u8f83\u901a\u7528\u538b\u7f29\u5668\u548c\u90e8\u5206\u5f20\u91cf\u4e13\u7528\u538b\u7f29\u5668\u66f4\u5c0f\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u538b\u7f29/\u89e3\u538b\u541e\u5410\u3002", "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) models often treat main-view and wrist-view observations as parallel visual inputs, overlooking their distinct roles in robot manipulation. Fine-grained manipulation, however, benefits from anticipating how wrist-local interactions may evolve under the global task context. To address this limitation, we present World-to-Wrist VLA (W2-VLA), a VLA model for fine-grained robot manipulation with task-conditioned future wrist modeling. Given current multi-view observations and a task instruction, W2-VLA contextualizes a set of latent modeling tokens as a compact interface between the vision-language model and the wrist predictor. Conditioned on this interface and the observed wrist history, the predictor forecasts future wrist latents, which are transformed into future-aware context for action prediction. In addition, we introduce W2-CoT, a synthesis pipeline that produces structured annotations describing manipulation progress, physical transition cues, and wrist-local evidence. These annotations provide auxiliary supervision that shapes the task-conditioned latent interface. Experiments on LIBERO, RoboTwin 2.0, and real-world manipulation tasks demonstrate improved fine-grained and contact-sensitive manipulation across both single-arm and bimanual settings, while maintaining action-generation rates above 80 Hz.", "arxiv_id": "2608.05369", "arxiv_url": "https://arxiv.org/abs/2608.05369", "authors": ["Yuhao Pan", "Haosong Peng", "Zhengshen Zhang", "Zhengyang Yan", "Yalun Dai", "Fushuo Huo", "Chujie Wang", "Tianyu Qi", "Xiucheng Wang", "Nan Cheng", "Wenchao Xu"], "brief": "\u63d0\u51fa World-to-Wrist VLA\uff0c\u901a\u8fc7\u4efb\u52a1\u6761\u4ef6\u5316\u7684\u672a\u6765\u8155\u90e8\u89c6\u89d2\u5efa\u6a21\uff0c\u5c06\u5168\u5c40\u4efb\u52a1\u8bed\u5883\u4e0e\u5c40\u90e8\u8155\u90e8\u4ea4\u4e92\u9884\u6d4b\u7ed3\u5408\uff0c\u7528\u4e8e\u66f4\u7cbe\u7ec6\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u3002\u5176 W2-CoT \u5408\u6210\u6807\u6ce8\u8fdb\u4e00\u6b65\u76d1\u7763\u6f5c\u5728\u63a5\u53e3\uff0c\u5728 LIBERO\u3001RoboTwin 2.0 \u548c\u771f\u5b9e\u4efb\u52a1\u4e2d\u63d0\u5347\u63a5\u89e6\u654f\u611f\u4e0e\u53cc\u81c2/\u5355\u81c2\u64cd\u4f5c\u8868\u73b0\uff0c\u5e76\u4fdd\u6301 80Hz \u4ee5\u4e0a\u52a8\u4f5c\u751f\u6210\u901f\u5ea6\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/yyyyu120/W2-VLA", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05369", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u591a\u89c6\u89d2\u611f\u77e5", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05369v1", "published_at": "2026-08-05", "score": 0.064, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05369.png", "title": "World-to-Wrist: Task-Conditioned Future Wrist Modeling for Fine-Grained Robot Manipulation", "tldr": "\u63d0\u51fa World-to-Wrist VLA\uff0c\u901a\u8fc7\u4efb\u52a1\u6761\u4ef6\u5316\u7684\u672a\u6765\u8155\u90e8\u89c6\u89d2\u5efa\u6a21\uff0c\u5c06\u5168\u5c40\u4efb\u52a1\u8bed\u5883\u4e0e\u5c40\u90e8\u8155\u90e8\u4ea4\u4e92\u9884\u6d4b\u7ed3\u5408\uff0c\u7528\u4e8e\u66f4\u7cbe\u7ec6\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u3002\u5176 W2-CoT \u5408\u6210\u6807\u6ce8\u8fdb\u4e00\u6b65\u76d1\u7763\u6f5c\u5728\u63a5\u53e3\uff0c\u5728 LIBERO\u3001RoboTwin 2.0 \u548c\u771f\u5b9e\u4efb\u52a1\u4e2d\u63d0\u5347\u63a5\u89e6\u654f\u611f\u4e0e\u53cc\u81c2/\u5355\u81c2\u64cd\u4f5c\u8868\u73b0\uff0c\u5e76\u4fdd\u6301 80Hz \u4ee5\u4e0a\u52a8\u4f5c\u751f\u6210\u901f\u5ea6\u3002", "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) make grounded predictions in real-world scenes by combining visual and textual cues, yet existing benchmarks rarely reveal how they arbitrate between these evidence sources when they conflict. We introduce SIGNPOST-Bench, a controlled counterfactual benchmark for evaluating text-vision conflict resolution. Each source image is transformed into a counterfactual quintuplet of Original, Blank, Similar, Random, and Adversarial variants. Synthetic, localized scene-text interventions are designed to preserve non-textual content, enabling paired measurements of changes in localization performance and directed shifts toward geographic targets introduced by conflicting text. SIGNPOST-Bench contains 5,111 counterfactual groups and 25,555 image variants from four datasets. We evaluate 20 MLLMs from seven providers. Compared with Original images, Adversarial variants raise median localization error from 282 km to 1,347 km, a 4.8-fold increase. Among geocodable adversarial samples, 6.5-20.1% of predictions lie less than 50 km from the injected target across models, and every evaluated model exhibits a positive mean paired reduction in target distance from Blank to Adversarial. Compatible, unrelated, and conflicting text replacements produce distinct effects on model predictions, while clean-input localization performance does not fully predict robustness to conflicting text. These results establish visual geolocation as a continuous diagnostic of scene-text arbitration and provide a controlled framework for evaluating how MLLMs resolve conflicting multimodal evidence.", "arxiv_id": "2608.04244", "arxiv_url": "https://arxiv.org/abs/2608.04244", "authors": ["Sirun Li", "Minghao Liu", "Ling Dai", "Yong Li", "Haoxin Lyu", "Junting Zhou", "Fan Zhang"], "brief": "\u672c\u6587\u63d0\u51fa SIGNPOST-Bench\uff0c\u7528\u53d7\u63a7\u53cd\u4e8b\u5b9e\u56fe\u50cf\u8bc4\u6d4b\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u89c6\u89c9\u4fe1\u606f\u4e0e\u573a\u666f\u6587\u5b57\u51b2\u7a81\u65f6\u5982\u4f55\u53d6\u820d\uff0c\u5305\u542b 5111 \u7ec4\u53cd\u4e8b\u5b9e\u6837\u672c\u548c 25555 \u4e2a\u56fe\u50cf\u53d8\u4f53\u3002\u5bf9 20 \u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u5bf9\u6297\u6587\u5b57\u4f1a\u4f7f\u5730\u7406\u5b9a\u4f4d\u8bef\u5dee\u4e2d\u4f4d\u6570\u4ece 282 km \u589e\u81f3 1347 km\uff0c\u4e14\u6240\u6709\u6a21\u578b\u90fd\u4f1a\u4e0d\u540c\u7a0b\u5ea6\u88ab\u6ce8\u5165\u6587\u672c\u76ee\u6807\u7275\u5f15\uff0c\u8bf4\u660e\u73b0\u6709\u6a21\u578b\u5bf9\u6587\u672c-\u89c6\u89c9\u51b2\u7a81\u4ecd\u4e0d\u9c81\u68d2\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/inorganicwriter/SIGNPOST-Bench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04244", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u57fa\u51c6\u6d4b\u8bd5", "\u9c81\u68d2\u6027", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04244v1", "published_at": "2026-08-04", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04244.png", "title": "SIGNPOST-Bench: Benchmarking Text-Vision Conflict Resolution in Multimodal Large Language Models", "tldr": "\u672c\u6587\u63d0\u51fa SIGNPOST-Bench\uff0c\u7528\u53d7\u63a7\u53cd\u4e8b\u5b9e\u56fe\u50cf\u8bc4\u6d4b\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u89c6\u89c9\u4fe1\u606f\u4e0e\u573a\u666f\u6587\u5b57\u51b2\u7a81\u65f6\u5982\u4f55\u53d6\u820d\uff0c\u5305\u542b 5111 \u7ec4\u53cd\u4e8b\u5b9e\u6837\u672c\u548c 25555 \u4e2a\u56fe\u50cf\u53d8\u4f53\u3002\u5bf9 20 \u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u5bf9\u6297\u6587\u5b57\u4f1a\u4f7f\u5730\u7406\u5b9a\u4f4d\u8bef\u5dee\u4e2d\u4f4d\u6570\u4ece 282 km \u589e\u81f3 1347 km\uff0c\u4e14\u6240\u6709\u6a21\u578b\u90fd\u4f1a\u4e0d\u540c\u7a0b\u5ea6\u88ab\u6ce8\u5165\u6587\u672c\u76ee\u6807\u7275\u5f15\uff0c\u8bf4\u660e\u73b0\u6709\u6a21\u578b\u5bf9\u6587\u672c-\u89c6\u89c9\u51b2\u7a81\u4ecd\u4e0d\u9c81\u68d2\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Red-team evaluations of AI models support some claims and not others, and the boundary between the two is calculable rather than merely a matter of judgment. We define the evidential ceiling of an evaluation as the largest factor by which one result can move belief under a fixed testing budget, derive it in closed form for the benchmark null result, and use it to locate that boundary exactly. We find that above a calculable harm rate, a benchmark of modest size certifies a category to a stated evidentiary standard, and a clean sheet is then the stronger of the two possible observations, outweighing a single reproduced failure. Below that rate, no passive benchmark of feasible size provides the specified evidence of safety under the fixed scoring rule and approximately independent trial structure. The crossing between the two regimes has a closed form. The bound is not specific to benchmarks: written in terms of a procedure\u0027s hypothesis conditioned elicitation rates, it covers adaptive and automated red teaming as well, and shows that discrimination between the hypotheses rather than attack success is what determines evidential worth. Auditing eight evaluation suites against the boundary, we find that current benchmarks are adequate for high-frequency harm categories and several orders of magnitude short for rare, catastrophic ones. Safety benchmarks are not uninformative. They are informative about a specific and computable set of propositions, and the discipline they need is to state which.", "arxiv_id": "2607.21735", "arxiv_url": "https://arxiv.org/abs/2607.21735", "authors": ["Bandana Kaur"], "brief": "\u672c\u6587\u4ece\u7edf\u8ba1\u8bc1\u636e\u89d2\u5ea6\u523b\u753b AI \u7ea2\u961f\u8bc4\u6d4b\u80fd\u8bc1\u660e\u4ec0\u4e48\uff0c\u63d0\u51fa\u201c\u8bc1\u636e\u4e0a\u9650\u201d\u5e76\u7ed9\u51fa\u95ed\u5f0f\u89e3\uff0c\u7528\u4e8e\u5224\u65ad\u5728\u56fa\u5b9a\u6d4b\u8bd5\u9884\u7b97\u4e0b\u8bc4\u6d4b\u7ed3\u679c\u6700\u591a\u80fd\u591a\u5927\u7a0b\u5ea6\u6539\u53d8\u5b89\u5168\u6027\u4fe1\u5ff5\u3002\u5206\u6790\u8868\u660e\uff0c\u73b0\u6709\u57fa\u51c6\u5bf9\u9ad8\u9891\u5371\u5bb3\u7c7b\u522b\u6709\u4fe1\u606f\u91cf\uff0c\u4f46\u5bf9\u7f55\u89c1\u707e\u96be\u6027\u98ce\u9669\u901a\u5e38\u5dee\u6570\u4e2a\u6570\u91cf\u7ea7\uff1b\u5173\u952e\u4e0d\u5728\u653b\u51fb\u6210\u529f\u7387\u672c\u8eab\uff0c\u800c\u5728\u533a\u5206\u4e0d\u540c\u5047\u8bbe\u7684\u80fd\u529b\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": "https://github.com/hackwither/ai-redteam-evidential-limits", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.21735", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ea2\u961f\u8bc4\u6d4b", "AI\u5b89\u5168", "\u98ce\u9669\u8bc4\u4f30", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 2, "on_hf": true, "organization": "apisec", "pdf_url": "https://arxiv.org/pdf/2607.21735v2", "published_at": "2026-07-23", "score": 0.031, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.21735.png", "title": "What AI Red-Team Evaluations Can and Cannot Prove", "tldr": "\u672c\u6587\u4ece\u7edf\u8ba1\u8bc1\u636e\u89d2\u5ea6\u523b\u753b AI \u7ea2\u961f\u8bc4\u6d4b\u80fd\u8bc1\u660e\u4ec0\u4e48\uff0c\u63d0\u51fa\u201c\u8bc1\u636e\u4e0a\u9650\u201d\u5e76\u7ed9\u51fa\u95ed\u5f0f\u89e3\uff0c\u7528\u4e8e\u5224\u65ad\u5728\u56fa\u5b9a\u6d4b\u8bd5\u9884\u7b97\u4e0b\u8bc4\u6d4b\u7ed3\u679c\u6700\u591a\u80fd\u591a\u5927\u7a0b\u5ea6\u6539\u53d8\u5b89\u5168\u6027\u4fe1\u5ff5\u3002\u5206\u6790\u8868\u660e\uff0c\u73b0\u6709\u57fa\u51c6\u5bf9\u9ad8\u9891\u5371\u5bb3\u7c7b\u522b\u6709\u4fe1\u606f\u91cf\uff0c\u4f46\u5bf9\u7f55\u89c1\u707e\u96be\u6027\u98ce\u9669\u901a\u5e38\u5dee\u6570\u4e2a\u6570\u91cf\u7ea7\uff1b\u5173\u952e\u4e0d\u5728\u653b\u51fb\u6210\u529f\u7387\u672c\u8eab\uff0c\u800c\u5728\u533a\u5206\u4e0d\u540c\u5047\u8bbe\u7684\u80fd\u529b\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "A framework that persists execution state so a run can be interrupted, survive a crash, and continue must decide what a resume means for effects that already fired. Five widely deployed agent workflow frameworks answer differently, none exposes a machine-checkable contract, and behavior violates even the fragments they state. The RESUME CONTRACT states six properties over the persistence API (prefix continuation, effect exactly-once, fork determinism, checkpoint validity, consume-once, recovery determinism), plus fork-intent and liveness obligations. A TLA+ model checks a reference semantics exhaustively, unchanged at scaled bounds (7.4 million states); a 39-cell fault matrix and two companion modules yield the separating models independence requires, and consume-once splits, its consumption clause independent of all six others. A deterministic, LLM-free harness measures them at pinned releases. LangGraph 1.2.9 durably records a second resume value and never consults it, persists schema-invalid state silently, and re-executes durably recorded work after a real SIGKILL: exactly-once across interrupts, at-least-once across crashes, on one API. CrewAI 1.15.2 re-executes completed effect-bearing methods against its written claim; pydantic-graph 1.x cannot resume after a mid-node crash; no two probed frameworks share a conformance profile. Consume-once holds sequentially and fails under concurrent delivery: k processes resuming one parked interrupt fire the gated effect k times, saturation 1.0 in 36 of 40 cells, and the failure crosses hosts. REMIT, a reference sequencer whose Verus-verified recovery core is line-identical to the shipped executable, repairs the fork and validity cells. The cross-process cell is repaired at the read path, and that repair ships: an opt-in gate claims consumption in the shared store, serving one racer and refusing the rest before any node executes.", "arxiv_id": "2608.03836", "arxiv_url": "https://arxiv.org/abs/2608.03836", "authors": ["Sajjad Khan"], "brief": "\u8bba\u6587\u63d0\u51fa RESUME CONTRACT\uff0c\u7528\u673a\u5668\u53ef\u68c0\u9a8c\u7684\u65b9\u5f0f\u89c4\u8303\u5de5\u4f5c\u6d41\u6301\u4e45\u5316\u5c42\u5728\u4e2d\u65ad\u3001\u5d29\u6e83\u4e0e\u6062\u590d\u65f6\u7684\u8bed\u4e49\uff0c\u5305\u62ec\u524d\u7f00\u5ef6\u7eed\u3001\u6548\u679c exactly-once\u3001\u6062\u590d\u786e\u5b9a\u6027\u7b49\u6027\u8d28\u3002\u4f5c\u8005\u7528 TLA+\u3001\u6545\u969c\u77e9\u9635\u548c\u786e\u5b9a\u6027\u6d4b\u8bd5\u6846\u67b6\u9a8c\u8bc1\u591a\u4e2a\u4e3b\u6d41\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u6846\u67b6\uff0c\u53d1\u73b0\u5b83\u4eec\u5728\u6062\u590d\u8bed\u4e49\u4e0a\u884c\u4e3a\u4e0d\u4e00\u81f4\u4e14\u5b58\u5728\u91cd\u590d\u6267\u884c\u3001\u65e0\u6548\u72b6\u6001\u6301\u4e45\u5316\u3001\u5e76\u53d1\u6d88\u8d39\u5931\u8d25\u7b49\u95ee\u9898\uff0c\u5e76\u7ed9\u51fa\u7ecf\u9a8c\u8bc1\u7684\u53c2\u8003\u4fee\u590d\u65b9\u6848 REMIT\u3002", "categories": ["cs.LG", "cs.DC", "cs.LO", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03836", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u4f5c\u6d41", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u6301\u4e45\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03836v2", "published_at": "2026-08-04", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03836.png", "title": "Resume Means Resume: A Machine-Checked Conformance Contract for Checkpoint, Interrupt, and Resume Semantics in Workflow Persistence Layers", "tldr": "\u8bba\u6587\u63d0\u51fa RESUME CONTRACT\uff0c\u7528\u673a\u5668\u53ef\u68c0\u9a8c\u7684\u65b9\u5f0f\u89c4\u8303\u5de5\u4f5c\u6d41\u6301\u4e45\u5316\u5c42\u5728\u4e2d\u65ad\u3001\u5d29\u6e83\u4e0e\u6062\u590d\u65f6\u7684\u8bed\u4e49\uff0c\u5305\u62ec\u524d\u7f00\u5ef6\u7eed\u3001\u6548\u679c exactly-once\u3001\u6062\u590d\u786e\u5b9a\u6027\u7b49\u6027\u8d28\u3002\u4f5c\u8005\u7528 TLA+\u3001\u6545\u969c\u77e9\u9635\u548c\u786e\u5b9a\u6027\u6d4b\u8bd5\u6846\u67b6\u9a8c\u8bc1\u591a\u4e2a\u4e3b\u6d41\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u6846\u67b6\uff0c\u53d1\u73b0\u5b83\u4eec\u5728\u6062\u590d\u8bed\u4e49\u4e0a\u884c\u4e3a\u4e0d\u4e00\u81f4\u4e14\u5b58\u5728\u91cd\u590d\u6267\u884c\u3001\u65e0\u6548\u72b6\u6001\u6301\u4e45\u5316\u3001\u5e76\u53d1\u6d88\u8d39\u5931\u8d25\u7b49\u95ee\u9898\uff0c\u5e76\u7ed9\u51fa\u7ecf\u9a8c\u8bc1\u7684\u53c2\u8003\u4fee\u590d\u65b9\u6848 REMIT\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "The \"thinking-with-images\" paradigm equips multimodal LLMs with active visual operations such as crop-and-zoom. However, models using these operations often achieve only marginal or negative gains over direct inference at substantially higher token cost. They may also repeatedly crop irrelevant regions and fail on questions that direct inference answers correctly. We ask whether the returned visual evidence causally affects the answer. To answer this question, we formulate visual tool-use as a causal graph that separates observation-mediated paths from action-induced shortcuts. We then audit it through interventions at the three levels: policy (comparing tool-use with direct inference), trajectory (corrupting all observations during rollout), and step (counterfactually replacing one individual observation under a fixed prefix). Our step-level estimand, Visual Evidence Gain, isolates the contribution of each returned observation. Across six representative models and five fine-grained perception benchmarks, we uncover policy miscalibration with two failure modes. In Calling Without Looking, returned observations have no causal effect on the answer. In Looking Without Planning, observations are informative but the call schedule is incoherent. A trajectory-level diagnostic decomposes the policy-level accuracy gain and shows that the gain is concentrated in a Calibrated minority. We term this discrepancy the illusion of visual tool-use: despite aggregate accuracy gains, visual tool-use is not causally effective across a broad range of rollouts. The code is available at https://github.com/OpenCausaLab/CauAudit.", "arxiv_id": "2608.06270", "arxiv_url": "https://arxiv.org/abs/2608.06270", "authors": ["Zhiheng Wang", "Bo Peng", "Lai Wei", "Chaochao Lu"], "brief": "\u8bba\u6587\u5bf9\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u201c\u56fe\u50cf\u601d\u8003\u201d\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u8fdb\u884c\u56e0\u679c\u5ba1\u8ba1\uff0c\u68c0\u9a8c\u88c1\u526a\u3001\u7f29\u653e\u7b49\u64cd\u4f5c\u8fd4\u56de\u7684\u89c6\u89c9\u8bc1\u636e\u662f\u5426\u771f\u6b63\u5f71\u54cd\u7b54\u6848\u3002\u7ed3\u679c\u53d1\u73b0\u8bb8\u591a\u6a21\u578b\u867d\u6709\u8868\u9762\u51c6\u786e\u7387\u6536\u76ca\uff0c\u4f46\u5927\u91cf\u8c03\u7528\u5b58\u5728\u201c\u8c03\u7528\u4f46\u4e0d\u770b\u201d\u6216\u201c\u770b\u4e86\u4f46\u65e0\u89c4\u5212\u201d\u7684\u5931\u6548\u6a21\u5f0f\uff0c\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u7684\u56e0\u679c\u6709\u6548\u6027\u88ab\u9ad8\u4f30\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06270", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5de5\u5177\u4f7f\u7528", "\u56e0\u679c\u5206\u6790", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06270v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Illusion of Visual Tool-Use: A Causal Audit of Thinking with Images", "tldr": "\u8bba\u6587\u5bf9\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u201c\u56fe\u50cf\u601d\u8003\u201d\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u8fdb\u884c\u56e0\u679c\u5ba1\u8ba1\uff0c\u68c0\u9a8c\u88c1\u526a\u3001\u7f29\u653e\u7b49\u64cd\u4f5c\u8fd4\u56de\u7684\u89c6\u89c9\u8bc1\u636e\u662f\u5426\u771f\u6b63\u5f71\u54cd\u7b54\u6848\u3002\u7ed3\u679c\u53d1\u73b0\u8bb8\u591a\u6a21\u578b\u867d\u6709\u8868\u9762\u51c6\u786e\u7387\u6536\u76ca\uff0c\u4f46\u5927\u91cf\u8c03\u7528\u5b58\u5728\u201c\u8c03\u7528\u4f46\u4e0d\u770b\u201d\u6216\u201c\u770b\u4e86\u4f46\u65e0\u89c4\u5212\u201d\u7684\u5931\u6548\u6a21\u5f0f\uff0c\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u7684\u56e0\u679c\u6709\u6548\u6027\u88ab\u9ad8\u4f30\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Synthetic clinical benchmarks for enterprise AI agents can pass existing utility checks and still remain structurally unrealistic, especially in privacy-sensitive healthcare settings where operational data are hard to access. We study how to improve such benchmarks without breaking the downstream utility checks already used in practice. We formulate benchmark revision as utility-constrained realism improvement: dataset changes should increase realism while staying above an operational utility floor. We instantiate this idea on a care-gap benchmark derived from Synthea-generated patients exercised through demonstration electronic health record workflows and then processed by the same downstream pipeline as operational data. Realism is measured through missingness structure, simplicity, structural plausibility, and population alignment. The baseline benchmark is extremely thin: sampled-pair missingness is 79.44%, only 12.75% of rows are actionable, 38.94% of patients have zero actionable measures, and top-three token concentration reaches 100.0%. Two deterministic revisions improve these panels while remaining above the current utility floor, whereas a naive densification control preserves unrealistic templating. We further show that internal benchmark realism and source fidelity to an aggregate operational reference are related but distinct objectives. These results suggest that synthetic benchmark quality should be optimized explicitly, with utility treated as one constraint rather than as sufficient evidence of realism.", "arxiv_id": "2608.06265", "arxiv_url": "https://arxiv.org/abs/2608.06265", "authors": ["Omid Bazgir", "Md Nasir", "Jacob Hoffman", "Yang Yang", "Manu Agrawal", "Anusua Trivedi", "Vinay Rao Dandin", "Chris Gibbons", "Christine Swisher"], "brief": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u5728\u4e0d\u7834\u574f\u73b0\u6709\u4e0b\u6e38\u6548\u7528\u68c0\u67e5\u7684\u524d\u63d0\u4e0b\uff0c\u63d0\u5347\u5408\u6210\u4e34\u5e8a\u57fa\u51c6\u7684\u7ed3\u6784\u771f\u5b9e\u6027\u3002\u4f5c\u8005\u5728\u57fa\u4e8e Synthea \u548c\u7535\u5b50\u5065\u5eb7\u8bb0\u5f55\u5de5\u4f5c\u6d41\u7684 care-gap \u57fa\u51c6\u4e0a\u53d1\u73b0\uff0c\u539f\u59cb\u6570\u636e\u867d\u80fd\u901a\u8fc7\u6548\u7528\u68c0\u67e5\u4f46\u975e\u5e38\u7a00\u758f\u4e14\u6a21\u677f\u5316\uff1b\u4e24\u79cd\u786e\u5b9a\u6027\u4fee\u8ba2\u80fd\u63d0\u5347\u7f3a\u5931\u7ed3\u6784\u3001\u53ef\u64cd\u4f5c\u6027\u548c\u4eba\u7fa4\u5bf9\u9f50\u7b49\u771f\u5b9e\u6027\u6307\u6807\uff0c\u540c\u65f6\u4fdd\u6301\u6548\u7528\u8fbe\u6807\u3002", "categories": ["cs.AI", "cs.DB", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06265", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597\u6570\u636e", "\u5408\u6210\u6570\u636e", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06265v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Improving the Realism of Synthetic Clinical Benchmarks Under Utility Constraints", "tldr": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u5728\u4e0d\u7834\u574f\u73b0\u6709\u4e0b\u6e38\u6548\u7528\u68c0\u67e5\u7684\u524d\u63d0\u4e0b\uff0c\u63d0\u5347\u5408\u6210\u4e34\u5e8a\u57fa\u51c6\u7684\u7ed3\u6784\u771f\u5b9e\u6027\u3002\u4f5c\u8005\u5728\u57fa\u4e8e Synthea \u548c\u7535\u5b50\u5065\u5eb7\u8bb0\u5f55\u5de5\u4f5c\u6d41\u7684 care-gap \u57fa\u51c6\u4e0a\u53d1\u73b0\uff0c\u539f\u59cb\u6570\u636e\u867d\u80fd\u901a\u8fc7\u6548\u7528\u68c0\u67e5\u4f46\u975e\u5e38\u7a00\u758f\u4e14\u6a21\u677f\u5316\uff1b\u4e24\u79cd\u786e\u5b9a\u6027\u4fee\u8ba2\u80fd\u63d0\u5347\u7f3a\u5931\u7ed3\u6784\u3001\u53ef\u64cd\u4f5c\u6027\u548c\u4eba\u7fa4\u5bf9\u9f50\u7b49\u771f\u5b9e\u6027\u6307\u6807\uff0c\u540c\u65f6\u4fdd\u6301\u6548\u7528\u8fbe\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deaf and hard-of-hearing people in Bangladesh communicate mainly through Bangla Sign Language (BdSL). Automatic BdSL recognition on personal devices could widen access to education and services. Existing systems use controlled-setting datasets without expert verification and heavyweight pretrained backbones unsuited to on-device use. We introduce RSBdSL38, 10,874 expert-validated images spanning all 38 BdSL hand signs, representing the 51 letters of the Bangla alphabet, recorded from real signers at three special-needs schools across Bangladesh. We propose a lightweight attention based convolutional network of 298,470 parameters, built from grouped bottleneck residual blocks, channel and spatial attention, a multi-scale depthwise hand-feature block, dual pooling, and Swish activations. Trained from scratch, it attains 96.37% accuracy (95.72% +- 0.54% over five seeds), within 1.08 percentage points of the best of nine ImageNet-pretrained efficient architectures under an identical protocol, using 8.5 to 68x fewer parameters and 1.3 to 21.7x fewer MACs. Retrained, it reaches 92.95 to 98.33% on six public BdSL benchmarks, 97.04% on a merged corpus, and 76.25% zero-shot on BdSL-38. Removing any architectural stage costs 7.61 to 89.30 points, against at most 3.17 for the training recipe. Grad-CAM with deletion-insertion and weight-randomization checks confirms that predictions follow the signing hand. A signer-independent split holding out 6 of 36 signers yields 85.18%. Quantized to 0.48 MB, it runs at 3.98 ms per image within a 15.5 MB footprint on a commodity smartphone. Together, RSBdSL38 and our from-scratch model turn benchmark accuracy into deployable accessibility at a fraction of pretrained-backbone cost; dataset, code, and models are released.", "arxiv_id": "2608.06252", "arxiv_url": "https://arxiv.org/abs/2608.06252", "authors": ["Saad Ahmed", "Md Khalid Syfullaha"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e13\u5bb6\u9a8c\u8bc1\u7684\u5b5f\u52a0\u62c9\u624b\u8bed\u6570\u636e\u96c6 RSBdSL38\uff0c\u5305\u542b38\u7c7b\u624b\u52bf\u300110874\u5f20\u771f\u5b9e\u5b66\u6821\u573a\u666f\u56fe\u50cf\uff0c\u5e76\u53d1\u5e03\u6570\u636e\u4e0e\u4ee3\u7801\u3002\u4f5c\u8005\u8bbe\u8ba1\u4e86\u4e00\u4e2a\u7ea629.8\u4e07\u53c2\u6570\u7684\u8f7b\u91cf\u6ce8\u610f\u529b\u5377\u79ef\u7f51\u7edc\uff0c\u4ece\u96f6\u8bad\u7ec3\u8fbe\u523096.37%\u51c6\u786e\u7387\uff0c\u63a5\u8fd1\u9884\u8bad\u7ec3\u9ad8\u6548\u6a21\u578b\u4f46\u53c2\u6570\u548c\u8ba1\u7b97\u91cf\u5927\u5e45\u964d\u4f4e\uff0c\u91cf\u5316\u540e\u53ef\u5728\u624b\u673a\u4e0a\u4f4e\u5ef6\u8fdf\u8fd0\u884c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06252", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u624b\u8bed\u8bc6\u522b", "\u8f7b\u91cf\u6a21\u578b", "\u6ce8\u610f\u529b\u673a\u5236", "\u8fb9\u7f18\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06252v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Toward Deployable Bangla Sign Language Recognition with Expert-Validated Data and a Lightweight Attention-Based Model", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e13\u5bb6\u9a8c\u8bc1\u7684\u5b5f\u52a0\u62c9\u624b\u8bed\u6570\u636e\u96c6 RSBdSL38\uff0c\u5305\u542b38\u7c7b\u624b\u52bf\u300110874\u5f20\u771f\u5b9e\u5b66\u6821\u573a\u666f\u56fe\u50cf\uff0c\u5e76\u53d1\u5e03\u6570\u636e\u4e0e\u4ee3\u7801\u3002\u4f5c\u8005\u8bbe\u8ba1\u4e86\u4e00\u4e2a\u7ea629.8\u4e07\u53c2\u6570\u7684\u8f7b\u91cf\u6ce8\u610f\u529b\u5377\u79ef\u7f51\u7edc\uff0c\u4ece\u96f6\u8bad\u7ec3\u8fbe\u523096.37%\u51c6\u786e\u7387\uff0c\u63a5\u8fd1\u9884\u8bad\u7ec3\u9ad8\u6548\u6a21\u578b\u4f46\u53c2\u6570\u548c\u8ba1\u7b97\u91cf\u5927\u5e45\u964d\u4f4e\uff0c\u91cf\u5316\u540e\u53ef\u5728\u624b\u673a\u4e0a\u4f4e\u5ef6\u8fdf\u8fd0\u884c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) improves the reasoning capabilities of large language models using automatically verifiable outcome signals, but these signals are typically sparse and at the sequence-level. On-policy self-distillation (OPSD) mitigates this sparsity by querying a privileged teacher at student-visited prefixes and providing dense token-level distributional supervision. Although this dense supervision alleviates signal sparsity, we find that standard OPSD still underexploits the temporal structure of the rollout. It assigns every local divergence the same coefficient, regardless of its position or the divergence sequence in which it occurs. In on-policy autoregressive generation, the same divergence magnitude can follow different discrepancy histories, reflecting different evolutions of the mismatch between the teacher and student. Since the local scalar alone cannot distinguish these temporal contexts, standard OPSD cannot adapt its token-level weights to the realized discrepancy sequence. To address this limitation, we propose Divergence-Adaptive Supervision Horizons (DASH). DASH maps the gap between each local distillation signal and the sequence-level mean to an adaptive propagation gate and then uses these gates to control backward multi-step aggregation. By doing so, DASH adjusts token-level supervision weights according to how local divergences evolve during generation. Experiments on three mathematical reasoning benchmarks across three model scales show that DASH improves over our matched vanilla OPSD reruns on every benchmark at all three scales. DASH reuses the teacher and student distributions that OPSD already computes, so the gains require no additional teacher or student forward pass. Code: https://github.com/DBtxy/DASH-OPSD", "arxiv_id": "2608.06243", "arxiv_url": "https://arxiv.org/abs/2608.06243", "authors": ["ZhiYan Hou", "Xinyu Tang", "Hongyan An", "Jianjin Zhang", "Weizhen Wang", "Yunyun Han", "Gengsheng Li", "Xiangzhao Hao", "Haiyun Guo", "Wenbin Hu", "Jinqiao Wang", "Yafeng Deng"], "brief": "\u672c\u6587\u9488\u5bf9\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684 on-policy \u81ea\u84b8\u998f\uff0c\u6307\u51fa\u6807\u51c6 OPSD \u5bf9\u4e0d\u540c\u65f6\u95f4\u4f4d\u7f6e\u7684\u5c40\u90e8\u6563\u5ea6\u4e00\u89c6\u540c\u4ec1\uff0c\u672a\u5145\u5206\u5229\u7528\u751f\u6210\u8fc7\u7a0b\u4e2d\u7684\u65f6\u5e8f\u5dee\u5f02\u3002\u63d0\u51fa DASH\uff0c\u7528\u5c40\u90e8\u84b8\u998f\u4fe1\u53f7\u4e0e\u5e8f\u5217\u5747\u503c\u7684\u504f\u5dee\u81ea\u9002\u5e94\u63a7\u5236\u591a\u6b65\u53cd\u5411\u805a\u5408\uff0c\u4ece\u800c\u52a8\u6001\u8c03\u6574 token \u7ea7\u76d1\u7763\u6743\u91cd\uff1b\u5728\u4e09\u4e2a\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u548c\u4e09\u79cd\u6a21\u578b\u89c4\u6a21\u4e0a\u5747\u4f18\u4e8e vanilla OPSD\uff0c\u4e14\u65e0\u9700\u989d\u5916\u524d\u5411\u8ba1\u7b97\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06243", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u6570\u5b66\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06243v1", "published_at": "2026-08-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DASH: Divergence-Adaptive Supervision Horizons for On-Policy Self-Distillation of Reasoning Models", "tldr": "\u672c\u6587\u9488\u5bf9\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684 on-policy \u81ea\u84b8\u998f\uff0c\u6307\u51fa\u6807\u51c6 OPSD \u5bf9\u4e0d\u540c\u65f6\u95f4\u4f4d\u7f6e\u7684\u5c40\u90e8\u6563\u5ea6\u4e00\u89c6\u540c\u4ec1\uff0c\u672a\u5145\u5206\u5229\u7528\u751f\u6210\u8fc7\u7a0b\u4e2d\u7684\u65f6\u5e8f\u5dee\u5f02\u3002\u63d0\u51fa DASH\uff0c\u7528\u5c40\u90e8\u84b8\u998f\u4fe1\u53f7\u4e0e\u5e8f\u5217\u5747\u503c\u7684\u504f\u5dee\u81ea\u9002\u5e94\u63a7\u5236\u591a\u6b65\u53cd\u5411\u805a\u5408\uff0c\u4ece\u800c\u52a8\u6001\u8c03\u6574 token \u7ea7\u76d1\u7763\u6743\u91cd\uff1b\u5728\u4e09\u4e2a\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u548c\u4e09\u79cd\u6a21\u578b\u89c4\u6a21\u4e0a\u5747\u4f18\u4e8e vanilla OPSD\uff0c\u4e14\u65e0\u9700\u989d\u5916\u524d\u5411\u8ba1\u7b97\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Unpaired image-to-image translation must decide, per image, what to change and what to preserve without paired supervision. Many diffusion-based unpaired translators control preservation through a single global noise or guidance value applied across the image, which cannot separate content to keep from appearance to change. We present PRISM, a GAN-free flow-matching framework that replaces this global control with a learned per-feature gate. The gate\u0027s spatial prior is derived from each source feature\u0027s standardized distance to the target feature distribution, so features far from the target are freed while target-consistent features are preserved. The same gate controls both the initialization, which mixes
