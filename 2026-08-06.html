<script>
const PAPERS = [{"abstract": "Reinforcement learning (RL) with verifiable rewards constructs trajectory-level advantage estimates, yet it often fails to credit the few pivotal decisions that determine outcomes in long-horizon, multi-turn agentic tasks. Recent work introduces privileged self-distillation for credit assignment, providing denser supervision, but it remains unclear how such local signals should represent sequential credit. We propose AgentOPSD, a critic-free, recursive method for turn-level credit assignment in agentic reinforcement learning. AgentOPSD aggregates token-level teacher-student log-probability gaps into turn-level evidence and recursively updates a Bayesian belief state in log-odds space. This yields a principled reweighting scheme that converts sparse outcome supervision into turn-level credit signals and identifies pivotal turns through the marginal belief revision between consecutive states. The method is fully compatible with standard policy optimization and requires neither an additional critic nor extra rollouts. We evaluate AgentOPSD on ALFWorld, WebShop, and Search-QA using Qwen2.5 models at two scales (3B and 7B). AgentOPSD outperforms GRPO and strong self-distillation baselines, achieving 89.1% success on ALFWorld with Qwen2.5-7B. Ablation studies attribute the gains to turn-level aggregation and history-dependent recursive belief updates.", "arxiv_id": "2608.05987", "arxiv_url": "https://arxiv.org/abs/2608.05987", "authors": ["Zi-Han Wang", "Zhengxi Lu", "Zhiyuan Yao", "Jinyang Wu", "Jie Wu", "Zhengzhou Cai", "Yueqing Sun", "Ziang Ye", "Linji Hao", "Qi Gu", "Xunliang Cai", "Yongliang Shen", "Yujiu Yang"], "brief": "\u8bba\u6587\u63d0\u51fa AgentOPSD\uff0c\u4e00\u79cd\u65e0\u9700 critic \u7684\u9012\u5f52\u56de\u5408\u7ea7\u4fe1\u7528\u5206\u914d\u65b9\u6cd5\uff0c\u7528\u4e8e\u957f\u7a0b\u591a\u8f6e\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u3002\u5b83\u5c06\u6559\u5e08-\u5b66\u751f token \u7ea7\u6982\u7387\u5dee\u805a\u5408\u4e3a 3a\u5316\u5b66\u4e60\u3002\u5b83\u5c06\u6559\u5e08-\u5b66\u751f token \u7ea7\u6982\u7387\u5dee\u805a\u5408\u4e3a\u56de\u5408\u8bc1\u636e\uff0c\u5e76\u7528\u8d1d\u53f6\u65af log-odds \u72b6\u6001\u9012\u5f52\u66f4\u65b0\uff0c\u751f\u6210\u66f4\u7ec6\u7c92\u5ea6\u7684\u56de\u5408\u7ea7\u5956\u52b1\u6743\u91cd\u3002", "why_notable": "\u5b83\u9488\u5bf9\u667a\u80fd\u4f53\u957f\u7a0b\u4efb\u52a1\u4e2d\u4fe1\u7528\u5206\u914d\u56f0\u96be\u63d0\u51fa\u4e86\u8f7b\u91cf\u4e14\u53ef\u63d2\u62d4\u7684\u89e3\u6cd5\uff0c\u7528\u9012\u5f52\u8d1d\u53f6\u65af\u4fe1\u5ff5\u66f4\u65b0\u523b\u753b\u5386\u53f2\u4f9d\u8d56\u7684\u5c40\u90e8\u8d21\u732e\uff0c\u5bf9\u63d0\u5347\u591a\u8f6e LLM Agent \u8bad\u7ec3\u6548\u7387\u548c\u7a33\u5b9a\u6027\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generating large-scale, freely explorable 3D worlds from open-ended text remains challenging because a system must jointly maintain global spatial coherence, rich local content, and explicit assets suitable for downstream editing and reuse. We present WorldClaw, a fully agentic, coarse-to-fine framework for open-world 3D scene generation. Planning agents translate a text prompt into a structured specification of regions, terrain, assets, materials, and spatial relations. WorldClaw then builds a globally coherent terrain foundation from semantic layouts, reusable assets, generative or procedural materials, and a region-aware height field. For detail-demanding regions, it generates terrain-conditioned compositions, reconstructs editable textured meshes, and recovers their placement on the terrain; render-based agents further refine terrain, objects, appearance, and contacts. Across diverse open-world prompts, WorldClaw produces large-scale scenes with coherent spatial organization, visually compelling local content, and editable instance-level assets while preserving a consistent global terrain structure.", "arxiv_id": "2608.05248", "arxiv_url": "https://arxiv.org/abs/2608.05248", "authors": ["Chunchao Guo", "Jinpeng Li", "Yang Li", "Zilong Huang"], "brief": "WorldClaw \u662f\u4e00\u4e2a\u5168\u667a\u80fd\u4f53\u3001\u7531\u7c97\u5230\u7ec6\u7684\u5f00\u653e\u4e16\u754c 3D \u573a\u666f\u751f\u6210\u6846\u67b6\u3002\u5b83\u5c06\u5f00\u653e\u6587\u672c\u63d0\u793a\u8f6c\u4e3a\u533a\u57df\u3001\u5730\u5f62\u3001\u8d44\u4ea7\u3001\u6750\u8d28\u548c\u7a7a\u95f4\u5173\u7cfb\u7b49\u7ed3\u6784\u5316\u89c4\u683c\uff0c\u5e76\u751f\u6210\u517c\u5177\u5168\u5c40\u4e00\u81f4\u6027\u4e0e\u5c40\u90e8\u7ec6\u8282\u7684\u53ef\u63a2\u7d22 3D \u4e16\u754c\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05248", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u89c4\u5212\u667a\u80fd\u4f53\u628a\u6587\u672c\u63d0\u793a\u5206\u89e3\u4e3a\u8bed\u4e49\u5e03\u5c40\u3001\u533a\u57df\u5173\u7cfb\u3001\u5730\u5f62\u3001\u8d44\u4ea7\u4e0e\u6750\u8d28\u89c4\u8303", "\u57fa\u4e8e\u533a\u57df\u611f\u77e5\u9ad8\u5ea6\u573a\u3001\u53ef\u590d\u7528\u8d44\u4ea7\u548c\u751f\u6210\u5f0f/\u7a0b\u5e8f\u5316\u6750\u8d28\u6784\u5efa\u5168\u5c40\u4e00\u81f4\u5730\u5f62", "\u5bf9\u7ec6\u8282\u533a\u57df\u751f\u6210\u5730\u5f62\u6761\u4ef6\u7ec4\u5408\uff0c\u91cd\u5efa\u53ef\u7f16\u8f91\u5e26\u7eb9\u7406\u7f51\u683c\uff0c\u5e76\u7528\u6e32\u67d3\u667a\u80fd\u4f53\u4f18\u5316\u7269\u4f53\u3001\u5916\u89c2\u548c\u63a5\u89e6\u5173\u7cfb"], "keywords": ["\u667a\u80fd\u4f53", "3D\u751f\u6210", "\u5f00\u653e\u4e16\u754c", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2608.05248v1", "published_at": "2026-08-05", "score": 0.659, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05248.png", "title": "WorldClaw: Agentic 3D Open-World Generation at Scale", "tldr": "\u667a\u80fd\u4f53\u6846\u67b6\u751f\u6210\u53ef\u7f16\u8f91\u5927\u89c4\u6a213D\u5f00\u653e\u4e16\u754c", "upvotes": 24, "what_it_is": "WorldClaw \u662f\u4e00\u4e2a\u5168\u667a\u80fd\u4f53\u3001\u7531\u7c97\u5230\u7ec6\u7684\u5f00\u653e\u4e16\u754c 3D \u573a\u666f\u751f\u6210\u6846\u67b6\u3002\u5b83\u5c06\u5f00\u653e\u6587\u672c\u63d0\u793a\u8f6c\u4e3a\u533a\u57df\u3001\u5730\u5f62\u3001\u8d44\u4ea7\u3001\u6750\u8d28\u548c\u7a7a\u95f4\u5173\u7cfb\u7b49\u7ed3\u6784\u5316\u89c4\u683c\uff0c\u5e76\u751f\u6210\u517c\u5177\u5168\u5c40\u4e00\u81f4\u6027\u4e0e\u5c40\u90e8\u7ec6\u8282\u7684\u53ef\u63a2\u7d22 3D \u4e16\u754c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u5f00\u653e\u6587\u672c\u5230\u5927\u89c4\u6a21 3D \u4e16\u754c\u751f\u6210\u7684\u6838\u5fc3\u96be\u9898\uff0c\u540c\u65f6\u517c\u987e\u5168\u5c40\u7a7a\u95f4\u4e00\u81f4\u6027\u3001\u5c40\u90e8\u89c6\u89c9\u4e30\u5bcc\u5ea6\u548c\u5b9e\u4f8b\u7ea7\u53ef\u7f16\u8f91\u8d44\u4ea7\uff0c\u5bf9\u6e38\u620f\u3001\u4eff\u771f\u3001\u865a\u62df\u5185\u5bb9\u521b\u4f5c\u7b49\u573a\u666f\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "High-quality long-horizon training data for terminal agents is expensive to produce, often costing hundreds to thousands of dollars per task, because each task must keep the instruction, environment, reference solution, and verifier mutually consistent. Human authoring does not scale, and direct generation with large language models (LLMs) often breaks these dependencies. We present Recursive Synthetic Terminal Tasks (RST), a recursive verified synthesis framework for constructing long-horizon terminal-agent tasks at scale. Starting from verified seed tasks, RST extends the reference solution, realigns the verifier and instruction to the new workflow, validates the result in a fresh sandbox, and reuses accepted tasks as seeds for subsequent rounds. Across fifteen recursive rounds, RST produces 37,484 synthesized terminal-agent tasks at roughly \\$0.05 per task. Task difficulty increases substantially over rounds: the median reference solution grows from 67 to 374 lines, the median number of executed commands grows from 40 to 244, and DeepSeek-V4-Pro pass@4 drops from 90\\% at $R_1$ to 2.5\\% at $R_{15}$. To demonstrate training utility, we collect rejection-sampled Qwen3.5 trajectories on the synthesized tasks and use them for supervised fine-tuning. Fine-tuning on these trajectories improves Qwen3.5-27B and Qwen3.5-122B-A10B by up to 10 points on Terminal-Bench~2, Terminal-Bench Hard, and Long-Horizon Terminal Bench, while agentic PPO lifts Qwen3.5-27B to 49.44\\%, 32.00\\%, and 22.07\\% on the three benchmarks, corresponding to relative gains of 20.0\\%, 41.2\\%, and 21.9\\% over the base model. Moreover, after 15 rounds, the recursion shows no ceiling: synthesis yield and validation rates remain stable as difficulty keeps climbing, indicating that the process can continue well beyond the scale reported here.", "arxiv_id": "2608.05466", "arxiv_url": "https://arxiv.org/abs/2608.05466", "authors": ["Zhongzhi Li", "Yucheng Shi", "Zongxia Li", "Ruhan Wang", "Anhao Li", "Zixun Huang", "Junyao Yang", "Lei Ke", "Ninghao Liu", "Haitao Mi", "Leowei Liang"], "brief": "\u8bba\u6587\u63d0\u51fa RST\uff08Recursive Synthetic Terminal Tasks\uff09\uff0c\u4ece\u5df2\u9a8c\u8bc1\u79cd\u5b50\u4efb\u52a1\u51fa\u53d1\uff0c\u9012\u5f52\u6269\u5c55\u53c2\u8003\u89e3\u6cd5\uff0c\u5e76\u540c\u6b65\u91cd\u5199\u9a8c\u8bc1\u5668\u4e0e\u6307\u4ee4\uff0c\u81ea\u52a8\u751f\u6210\u53ef\u9a8c\u8bc1\u7684\u957f\u7a0b\u7ec8\u7aef\u667a\u80fd\u4f53\u8bad\u7ec3\u4efb\u52a1\u3002\u8be5\u65b9\u6cd5\u5728 15 \u8f6e\u9012\u5f52\u4e2d\u751f\u6210 37,484 \u4e2a\u4efb\u52a1\uff0c\u6210\u672c\u7ea6\u6bcf\u9898 0.05 \u7f8e\u5143\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05466", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RST \u901a\u8fc7\u201c\u6269\u5c55\u89e3\u6cd5\u2014\u5bf9\u9f50\u9a8c\u8bc1\u5668\u4e0e\u6307\u4ee4\u2014\u6c99\u7bb1\u9a8c\u8bc1\u2014\u5408\u683c\u4efb\u52a1\u518d\u4f5c\u4e3a\u79cd\u5b50\u201d\u7684\u95ed\u73af\uff0c\u7f13\u89e3 LLM \u76f4\u63a5\u751f\u6210\u4efb\u52a1\u65f6\u4f9d\u8d56\u5173\u7cfb\u4e0d\u4e00\u81f4\u7684\u95ee\u9898", "\u4efb\u52a1\u96be\u5ea6\u968f\u9012\u5f52\u8f6e\u6b21\u663e\u8457\u4e0a\u5347\uff1a\u53c2\u8003\u89e3\u6cd5\u4e2d\u4f4d\u6570\u4ece 67 \u884c\u589e\u81f3 374 \u884c\uff0c\u6267\u884c\u547d\u4ee4\u6570\u4ece 40 \u589e\u81f3 244\uff0cDeepSeek-V4-Pro pass@4 \u4ece 90% \u964d\u81f3 2.5%", "\u7528\u5408\u6210\u4efb\u52a1\u4e0a\u7684 Qwen3.5 \u8f68\u8ff9\u8fdb\u884c\u5fae\u8c03\u548c agentic PPO\uff0c\u53ef\u5728 Terminal-Bench 2\u3001Terminal-Bench Hard\u3001Long-Horizon Terminal Bench \u4e0a\u5e26\u6765\u6700\u9ad8\u7ea6 10 \u5206\u63d0\u5347"], "keywords": ["\u667a\u80fd\u4f53", "\u7ec8\u7aef\u4efb\u52a1", "\u5408\u6210\u6570\u636e", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2608.05466v1", "published_at": "2026-08-05", "score": 0.653, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05466.png", "title": "Recursive Synthesis for Long-Horizon Terminal Tasks", "tldr": "\u9012\u5f52\u5408\u6210\u4f4e\u6210\u672c\u957f\u7a0b\u7ec8\u7aef\u667a\u80fd\u4f53\u4efb\u52a1", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa RST\uff08Recursive Synthetic Terminal Tasks\uff09\uff0c\u4ece\u5df2\u9a8c\u8bc1\u79cd\u5b50\u4efb\u52a1\u51fa\u53d1\uff0c\u9012\u5f52\u6269\u5c55\u53c2\u8003\u89e3\u6cd5\uff0c\u5e76\u540c\u6b65\u91cd\u5199\u9a8c\u8bc1\u5668\u4e0e\u6307\u4ee4\uff0c\u81ea\u52a8\u751f\u6210\u53ef\u9a8c\u8bc1\u7684\u957f\u7a0b\u7ec8\u7aef\u667a\u80fd\u4f53\u8bad\u7ec3\u4efb\u52a1\u3002\u8be5\u65b9\u6cd5\u5728 15 \u8f6e\u9012\u5f52\u4e2d\u751f\u6210 37,484 \u4e2a\u4efb\u52a1\uff0c\u6210\u672c\u7ea6\u6bcf\u9898 0.05 \u7f8e\u5143\u3002", "why_notable": "\u957f\u7a0b\u7ec8\u7aef\u667a\u80fd\u4f53\u4efb\u52a1\u901a\u5e38\u6602\u8d35\u4e14\u96be\u4ee5\u89c4\u6a21\u5316\u6784\u5efa\uff0cRST \u5c55\u793a\u4e86\u4e00\u79cd\u4f4e\u6210\u672c\u3001\u53ef\u9012\u5f52\u653e\u5927\u3001\u96be\u5ea6\u6301\u7eed\u589e\u957f\u4e14\u53ef\u7528\u4e8e\u8bad\u7ec3\u63d0\u5347\u7684\u4efb\u52a1\u5408\u6210\u8303\u5f0f\uff0c\u5bf9 computer use/\u7ec8\u7aef\u667a\u80fd\u4f53\u7684\u6570\u636e\u4f9b\u7ed9\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Training large language model agents for long-horizon tool use typically relies on interactions with real or synthesized executable environments, whose construction and verification are costly, or on external simulators that are difficult to ground. We introduce EnvACE, an agentic reinforcement learning method that replaces external environment interaction during training with world rehearsal. The policy alternates between acting and rehearsal: it first generates a tool call, then plays the role of the environment to produce the response induced by that action, and conditions subsequent decisions on the rehearsed response. Both roles are jointly optimized end-to-end using task-success rewards. Through world rehearsal, the policy internalizes the relationship between actions and their environment responses in its parameters, yielding an agent world model that directly supports decision making. Across BFCL-v4, tau^2-Bench, VitaBench, and FinMCP-Bench, EnvACE achieves strong and transferable performance, outperforming environment-scaling baselines in the overall evaluation. Controlled studies further show that world rehearsal consistently improves policy learning across model scales. At test time, the internalized world model enables private rehearsal before committed execution, yielding further gains under a moderate rehearsal budget without additional external interaction. Our findings establish world rehearsal as a new path toward scaling LLM agent training beyond the constraints of external environments. Our code is publicly available at https://github.com/Within-yao/EnvACE.", "arxiv_id": "2608.06197", "arxiv_url": "https://arxiv.org/abs/2608.06197", "authors": ["Zishan Xu", "Zhiyuan Yao", "Yuxin Chen", "Yifu Guo", "Zhengxi Lu", "Yuquan Lu", "Jinyang Huang", "Yan Xu", "Yasheng Wang", "Weinan Zhang", "Xingshan Zeng", "Weiwen Liu"], "brief": "EnvACE\u662f\u4e00\u79cd\u9762\u5411\u957f\u7a0b\u5de5\u5177\u4f7f\u7528\u7684\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u8ba9\u7b56\u7565\u5728\u8bad\u7ec3\u4e2d\u540c\u65f6\u626e\u6f14\u667a\u80fd\u4f53\u548c\u73af\u5883\uff1a\u5148\u751f\u6210\u5de5\u5177\u8c03\u7528\uff0c\u518d\u81ea\u884c\u6a21\u62df\u73af\u5883\u54cd\u5e94\uff0c\u5e76\u57fa\u4e8e\u6a21\u62df\u7ed3\u679c\u7ee7\u7eed\u51b3\u7b56\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u4efb\u52a1\u6210\u529f\u5956\u52b1\u7aef\u5230\u7aef\u4f18\u5316\uff0c\u4f7f\u6a21\u578b\u628a\u52a8\u4f5c\u2014\u73af\u5883\u53cd\u9988\u5173\u7cfb\u5185\u5316\u4e3a\u53ef\u7528\u4e8e\u51b3\u7b56\u7684\u4e16\u754c\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Within-yao/EnvACE", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.06197", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ee5\u201cworld rehearsal\u201d\u66ff\u4ee3\u6602\u8d35\u7684\u771f\u5b9e/\u5408\u6210\u53ef\u6267\u884c\u73af\u5883\u4ea4\u4e92\uff0c\u964d\u4f4e\u667a\u80fd\u4f53\u8bad\u7ec3\u5bf9\u5916\u90e8\u73af\u5883\u6784\u5efa\u4e0e\u9a8c\u8bc1\u7684\u4f9d\u8d56", "\u5728BFCL-v4\u3001tau^2-Bench\u3001VitaBench\u3001FinMCP-Bench\u4e0a\u53d6\u5f97\u5f3a\u6cdb\u5316\u8868\u73b0\uff0c\u6574\u4f53\u4f18\u4e8e\u73af\u5883\u6269\u5c55\u7c7b\u57fa\u7ebf", "\u6d4b\u8bd5\u65f6\u53ef\u5728\u771f\u5b9e\u6267\u884c\u524d\u8fd 89c4\u5212\u80fd\u529b\uff0c\u5bf9\u957f\u7a0b\u5de5\u5177\u8c03\u7528\u548cGUI/\u8ba1\u7b97\u673a\u4f7f\u7528\u7c7b\u667a\u80fd\u4f53\u5177\u6709\u8f83\u5f3a\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Spatial intelligence is fundamental to embodied agents, yet existing benchmarks focus on local spatial perception from single or few viewpoints, overlooking global spatial awareness over continuous, long-horizon visual streams. To address this limitation, we introduce the Global-Spatial-Temporal Benchmark (GST-Bench), a VQA benchmark for global spatial intelligence in video understanding, comprising human-verified questions derived from 6,790 minutes of synthetically generated video. It requires models to perform accurate spatial inference from novel viewpoints unseen in the input video and to map egocentric observations onto global top-down images. A comprehensive evaluation of 22 state-of-the-art VLMs exposes a striking gap between models and humans: the strongest zero-shot model attains only 42.68, far below the human score of 79.08. To probe the cause of this gap, we construct GST-Bench-Local and find that models, despite strong local spatial understanding under the same task formulation, still fail to consolidate long-horizon observations into a globally consistent scene representation. We further provide GST-Train, a dataset for global spatial reasoning, as a complementary resource to facilitate future research on this challenge.", "arxiv_id": "2608.05747", "arxiv_url": "https://arxiv.org/abs/2608.05747", "authors": ["Qifeng Zhang", "Kaixiang Huang", "Heng Dong", "Huang Fang", "Junting Chen", "Junjie Zhu", "Yonghang Chen", "Zhiyu Zhang", "Wei Li"], "brief": "\u8bba\u6587\u63d0\u51faGST-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u9891\u7406\u89e3\u4e2d\u5168\u5c40\u7a7a\u95f4\u667a\u80fd\u7684VQA\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea6790\u5206\u949f\u5408\u6210\u89c6\u9891\u7684\u4eba\u7c7b\u9a8c\u8bc1\u95ee\u9898\u3002\u5b83\u8981\u6c42\u6a21\u578b\u4ece\u8fde\u7eed\u957f\u7a0b\u7b2c\u4e00\u89c6\u89d2\u89c2\u5bdf\u4e2d\u63a8\u65ad\u672a\u89c1\u89c6\u89d2\uff0c\u5e76\u6620\u5c04\u5230\u5168\u5c40\u4fef\u89c6\u56fe\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05747", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bc4\u6d4b22\u4e2a\u5148\u8fdbVLM\uff0c\u6700\u5f3a\u96f6\u6837\u672c\u6a21\u578b\u4ec5\u5f9742.68\uff0c\u663e\u8457\u4f4e\u4e8e\u4eba\u7c7b79.08", "\u4efb\u52a1\u5f3a\u8c03\u957f\u65f6\u5e8f\u89c6\u9891\u4e2d\u7684\u5168\u5c40\u7a7a\u95f4\u8868\u5f81\uff0c\u800c\u975e\u5355\u89c6\u89d2\u6216\u77ed\u7247\u6bb5\u7684\u5c40\u90e8\u7a7a\u95f4\u611f\u77e5", "\u6784\u5efaGST-Bench-Local\u5206\u6790\u5931\u8d25\u539f\u56e0\uff0c\u5e76\u63d0\u4f9bGST-Train\u652f\u6301\u540e\u7eed\u5168\u5c40\u7a7a\u95f4\u63a8\u7406\u7814\u7a76"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u7a7a\u95f4\u63a8\u7406", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2608.05747v1", "published_at": "2026-08-06", "score": 0.508, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05747.png", "title": "GST-Bench: Can VLMs Develop Global Spatial Awareness from Video?", "tldr": "GST-Bench\u8bc4\u6d4bVLM\u89c6\u9891\u5168\u5c40\u7a7a\u95f4\u610f\u8bc6", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51faGST-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u9891\u7406\u89e3\u4e2d\u5168\u5c40\u7a7a\u95f4\u667a\u80fd\u7684VQA\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea6790\u5206\u949f\u5408\u6210\u89c6\u9891\u7684\u4eba\u7c7b\u9a8c\u8bc1\u95ee\u9898\u3002\u5b83\u8981\u6c42\u6a21\u578b\u4ece\u8fde\u7eed\u957f\u7a0b\u7b2c\u4e00\u89c6\u89d2\u89c2\u5bdf\u4e2d\u63a8\u65ad\u672a\u89c1\u89c6\u89d2\uff0c\u5e76\u6620\u5c04\u5230\u5168\u5c40\u4fef\u89c6\u56fe\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u73b0\u6709VLM\u5728\u5c40\u90e8\u7a7a\u95f4\u7406\u89e3\u8f83\u5f3a\u7684\u60c5\u51b5\u4e0b\uff0c\u4ecd\u96be\u4ee5\u628a\u957f\u7a0b\u89c2\u5bdf\u6574\u5408\u4e3a\u4e00\u81f4\u7684\u5168\u5c40\u573a\u666f\u8868\u793a\uff0c\u5bf9\u5177\u8eab\u667a\u80fd\u548c\u89c6\u9891\u7a7a\u95f4\u63a8\u7406\u7814\u7a76\u5177\u6709\u91cd\u8981\u57fa\u51c6\u4ef7\u503c\u3002"}, {"abstract": "LLM agents increasingly execute long-horizon tasks through tool use and environment interaction, shifting evaluation from final-response scoring to verification of complete executions. For skill-augmented agents, verification additionally requires the procedural knowledge encoded in task-time skills, because this knowledge indicates what evidence to inspect and which failures are task-critical. However, existing judge benchmarks often expose final responses or static trajectories, and rarely combine task-time skills with directly inspectable artifacts and environments. We therefore introduce SkillTV-Bench, a 681-case benchmark of real agent trajectories from 50 tasks across eleven domains, designed to evaluate skill-aware trajectory verification for both LLM-as-a-Judge and Agent-as-a-Judge methods. Additionally, we propose SkillTV-Evolve, which externalizes verification knowledge as a reusable JudgeSkill that guides an agent judge to plan targeted inspections and issue evidence-grounded verdicts. On a disjoint development pool, an automated evolution loop further refines the JudgeSkill using misjudged cases. On SkillTV-Bench, the refined skill increases the same agent judge\u0027s accuracy by 14.8 percentage points. In offline rollout-pool selection, it increases selected-trajectory success from 22.9% with one rollout to 45.5% with ten rollouts. The code and data are available at https://github.com/HanZhi306/SkillTV-Bench", "arxiv_id": "2608.05573", "arxiv_url": "https://arxiv.org/abs/2608.05573", "authors": ["Zhi Han", "Chenxi Zeng", "Liuhaichen Yang", "Zihan Guo", "Ming Zhou", "Yang Li"], "brief": "\u8bba\u6587\u63d0\u51fa SkillTV-Bench\uff0c\u4e00\u4e2a\u5305\u542b 681 \u4e2a\u771f\u5b9e\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u3001\u8986\u76d6 50 \u4e2a\u4efb\u52a1\u548c 11 \u4e2a\u9886\u57df\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM-as-a-Judge \u4e0e Agent-as-a-Judge \u5bf9\u6280\u80fd\u589e\u5f3a\u667a\u80fd\u4f53\u6267\u884c\u8fc7\u7a0b\u7684\u9a8c\u8bc1\u80fd\u529b\u3002\u540c\u65f6\u63d0\u51fa SkillTV-Evolve\uff0c\u5c06\u9a8c\u8bc1\u77e5\u8bc6\u5916\u5316\u4e3a\u53ef\u590d\u7528\u7684 JudgeSkill\uff0c\u5e76\u901a\u8fc7\u8bef\u5224\u6837\u4f8b\u81ea\u52a8\u8fed\u4ee3\u4f18\u5316\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05573", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u5f3a\u8c03\u5b8c\u6574\u6267\u884c\u8f68\u8ff9\u9a8c\u8bc1\uff0c\u800c\u975e\u4ec5\u8bc4\u4f30\u6700\u7ec8\u7b54\u6848\uff0c\u4e14\u7ed3\u5408\u4efb\u52a1\u65f6\u6280\u80fd\u3001\u53ef\u68c0\u67e5\u4ea7\u7269\u4e0e\u73af\u5883\u72b6\u6001\u3002", "SkillTV-Evolve \u8ba9\u8bc4\u5ba1\u667a\u80fd\u4f53\u57fa\u4e8e JudgeSkill \u89c4\u5212\u6709\u9488\u5bf9\u6027\u7684\u68c0\u67e5\uff0c\u5e76\u7ed9\u51fa\u6709\u8bc1\u636e\u652f\u6491\u7684\u5224\u5b9a\u3002", "\u4f18\u5316\u540e\u7684 JudgeSkill \u4f7f\u540c\u4e00\u8bc4\u5ba1\u667a\u80fd\u4f53\u51c6\u786e\u7387\u63d0\u5347 14.8 \u4e2a\u767e\u5206\u70b9\uff1b\u5728\u79bb\u7ebf\u591a\u8f68\u8ff9\u9009\u62e9\u4e2d\uff0c10 \u6b21 rollout \u7684\u6210\u529f\u7387\u4ece\u5355\u6b21 22.9% \u63d0\u5347\u5230 45.5%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u5de5\u5177\u4f7f\u7528", "LLM\u8bc4\u5ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05573v1", "published_at": "2026-08-06", "score": 0.5, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SkillTV-Bench: Benchmarking How Well Judges Perform on Skill-Augmented Agentic Execution", "tldr": "\u8bc4\u6d4b\u667a\u80fd\u4f53\u8f68\u8ff9\u9a8c\u8bc1\u7684\u6280\u80fd\u611f\u77e5\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SkillTV-Bench\uff0c\u4e00\u4e2a\u5305\u542b 681 \u4e2a\u771f\u5b9e\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u3001\u8986\u76d6 50 \u4e2a\u4efb\u52a1\u548c 11 \u4e2a\u9886\u57df\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM-as-a-Judge \u4e0e Agent-as-a-Judge \u5bf9\u6280\u80fd\u589e\u5f3a\u667a\u80fd\u4f53\u6267\u884c\u8fc7\u7a0b\u7684\u9a8c\u8bc1\u80fd\u529b\u3002\u540c\u65f6\u63d0\u51fa SkillTV-Evolve\uff0c\u5c06\u9a8c\u8bc1\u77e5\u8bc6\u5916\u5316\u4e3a\u53ef\u590d\u7528\u7684 JudgeSkill\uff0c\u5e76\u901a\u8fc7\u8bef\u5224\u6837\u4f8b\u81ea\u52a8\u8fed\u4ee3\u4f18\u5316\u3002", "why_notable": "\u968f\u7740 LLM \u667a\u80fd\u4f53\u627f\u62c5\u957f\u7a0b\u5de5\u5177\u4f7f\u7528\u548c\u73af\u5883\u4ea4\u4e92\u4efb\u52a1\uff0c\u8bc4\u6d4b\u91cd\u70b9\u6b63\u4ece\u7b54\u6848\u6253\u5206\u8f6c\u5411\u8fc7\u7a0b\u9a8c\u8bc1\uff1b\u8be5\u5de5\u4f5c\u4e3a\u6280\u80fd\u589e\u5f3a\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u771f\u5b9e\u6267\u884c\u7684\u8bc4\u6d4b\u6846\u67b6\uff0c\u5e76\u5c55\u793a\u4e86\u53ef\u6f14\u5316\u9a8c\u8bc1\u6280\u80fd\u5bf9\u8bc4\u5ba1\u53ef\u9760\u6027\u7684\u663e\u8457\u63d0\u5347\u3002"}, {"abstract": "Prompt injection poses significant security risks to LLM agents. Efficient and effective red-teaming is therefore critical, both for evaluating these risks and for collecting training data to improve defenses. Existing state-of-the-art prompt injection red-teaming methods primarily rely on reinforcement learning (RL), producing attacker models that often generalize poorly to new target LLMs. In this work, we develop PIMiner, an agentic system for prompt injection red-teaming. During training, PIMiner is trained on a sequence of (dataset, target model) pairs and builds a strategy library from scratch. At test time, the learned strategy library can be directly transferred to a previously unseen target LLM without additional training. PIMiner requires only a small number of queries to a target agent (e.g., 10) per test sample. Experimental results demonstrate that PIMiner achieves strong performance. On IPIArena, it attains a 76.2% ASR against Gemini-2.5-Pro, 61.9% ASR against GPT-5.1, and 42.9% ASR against Claude-Sonnet-4.5. On AgentDojo, it achieves an 86.7% ASR against Gemini-2.5-Pro, 53.3% ASR against GPT-5.1, and 40.0% ASR against Claude-Sonnet-4.5.", "arxiv_id": "2608.05108", "arxiv_url": "https://arxiv.org/abs/2608.05108", "authors": ["Yanting Wang", "Chenlong Yin", "Runpeng Geng", "Jinyuan Jia"], "brief": "\u8bba\u6587\u63d0\u51fa PIMiner\uff0c\u4e00\u4e2a\u7528\u4e8e\u63d0\u793a\u6ce8\u5165\u7ea2\u961f\u6d4b\u8bd5\u7684\u667a\u80fd\u4f53\u7cfb\u7edf\u3002\u5b83\u5728\u591a\u7ec4\u6570\u636e\u96c6\u4e0e\u76ee\u6807\u6a21\u578b\u4e0a\u8bad\u7ec3\u5e76\u81ea\u5efa\u7b56\u7565\u5e93\uff0c\u6d4b\u8bd5\u65f6\u53ef\u5c06\u7b56\u7565\u76f4\u63a5\u8fc1\u79fb\u5230\u672a\u89c1\u8fc7\u7684 LLM agent\uff0c\u4e14\u6bcf\u4e2a\u6837\u672c\u53ea\u9700\u5c11\u91cf\u67e5\u8be2\u3002", "categories": ["cs.CR"], "github_repo": "https://github.com/wang-yanting/PIMiner", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.05108", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u533a\u522b\u4e8e\u4f9d\u8d56\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u653b\u51fb\u6a21\u578b\u7684\u65b9\u6cd5\uff0cPIMiner \u5b66\u4e60\u53ef\u590d\u7528\u7684\u63d0\u793a\u6ce8\u5165\u7b56\u7565\u5e93\uff0c\u63d0\u5347\u8de8\u76ee\u6807\u6a21\u578b\u6cdb\u5316\u80fd\u529b\u3002", "\u6d4b\u8bd5\u9636\u6bb5\u65e0\u9700\u5bf9\u65b0\u76ee\u6807 LLM \u989d\u5916\u8bad\u7ec3\uff0c\u6bcf\u4e2a\u6837\u672c\u7ea6 10 \u6b21\u67e5\u8be2\u5373\u53ef\u6267\u884c\u7ea2\u961f\u653b\u51fb\u641c\u7d22\u3002", "\u5728 IPIArena \u4e0a\u5bf9 Gemini-2.5-Pro\u3001GPT-5.1\u3001Claude-Sonnet-4.5 \u5206\u522b\u8fbe\u5230 76.2%\u300161.9%\u300142.9% ASR\uff1b\u5728 AgentDojo \u4e0a\u5206\u522b\u8fbe\u5230 86.7%\u300153.3%\u300140.0% ASR\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u63d0\u793a\u6ce8\u5165", "\u7ea2\u961f\u6d4b\u8bd5", "LLM\u5b89\u5168"], "num_comments": 2, "on_hf": true, "organization": "Pennsylvania State University", "pdf_url": "https://arxiv.org/pdf/2608.05108v1", "published_at": "2026-08-05", "score": 0.491, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05108.png", "title": "Agent Against Agent: An Agentic System for Automatic Prompt Injection Red Teaming", "tldr": "\u53ef\u8fc1\u79fb\u667a\u80fd\u4f53\u81ea\u52a8\u6316\u6398\u63d0\u793a\u6ce8\u5165\u653b\u51fb", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa PIMiner\uff0c\u4e00\u4e2a\u7528\u4e8e\u63d0\u793a\u6ce8\u5165\u7ea2\u961f\u6d4b\u8bd5\u7684\u667a\u80fd\u4f53\u7cfb\u7edf\u3002\u5b83\u5728\u591a\u7ec4\u6570\u636e\u96c6\u4e0e\u76ee\u6807\u6a21\u578b\u4e0a\u8bad\u7ec3\u5e76\u81ea\u5efa\u7b56\u7565\u5e93\uff0c\u6d4b\u8bd5\u65f6\u53ef\u5c06\u7b56\u7565\u76f4\u63a5\u8fc1\u79fb\u5230\u672a\u89c1\u8fc7\u7684 LLM agent\uff0c\u4e14\u6bcf\u4e2a\u6837\u672c\u53ea\u9700\u5c11\u91cf\u67e5\u8be2\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411 LLM agent \u7684\u5173\u952e\u5b89\u5168\u98ce\u9669\uff0c\u5c55\u793a\u4e86\u81ea\u52a8\u5316\u3001\u4f4e\u67e5\u8be2\u3001\u53ef\u8fc1\u79fb\u7684\u63d0\u793a\u6ce8\u5165\u7ea2\u961f\u80fd\u529b\uff0c\u53ef\u7528\u4e8e\u66f4\u9ad8\u6548\u8bc4\u4f30\u667a\u80fd\u4f53\u5b89\u5168\u6027\u5e76\u6536\u96c6\u9632\u5fa1\u8bad\u7ec3\u6570\u636e\u3002"}, {"abstract": "As LLMs are increasingly deployed within agentic systems, their capabilities depend not only on the model weights but also on the harness: the prompts, tools, control flow, memory, and orchestration code surrounding them. This makes automated harness optimization -- the iterative and evaluation-guided improvement of a harness by an AI system -- both an important route to improving AI systems and a demanding capability for AI systems themselves. Yet the community lacks a common protocol for measuring how well frontier LLMs perform at this task. We introduce HarnessOpt-Bench, a benchmark for end-to-end harness optimization under expensive and stochastic evaluation. An optimizer, an LLM paired with a coding harness, receives a target agent\u0027s seed harness, graded evaluation feedback, and a fixed target-evaluation budget. It edits the harness and nominates a final candidate, which is scored by its normalized gain over the seed on a held-out test partition that remains inaccessible throughout search. A trusted execution environment enforces the evaluation boundary, meters target-agent resource use, and preserves candidate versions for audit. We evaluate 5 frontier LLMs as optimizers both under a shared coding harness and under their native harnesses across 4 downstream tasks, over 111 scored runs. Experiment results show that optimizer models separate more than the coding harnesses they act through, native harnesses are not consistently superior, and gains vary substantially across tasks and seed regimes. These results establish harness optimization as a measurable and discriminative capability with large space for improvement.", "arxiv_id": "2608.06301", "arxiv_url": "https://arxiv.org/abs/2608.06301", "authors": ["Varun Ursekar", "Apaar Shanker", "Yash Maurya", "Shehab Yasser", "Vijay S. Kalmath", "Veronica Chatrath", "Yuan Xue"], "brief": "\u8bba\u6587\u63d0\u51fa HarnessOpt-Bench\uff0c\u4e00\u4e2a\u7528\u4e8e\u7aef\u5230\u7aef\u8bc4\u4f30 LLM \u8fdb\u884c harness \u4f18\u5316\u7684\u57fa\u51c6\u3002\u5b83\u8ba9\u4f18\u5316\u5668\u6a21\u578b\u5728\u56fa\u5b9a\u8bc4\u6d4b\u9884\u7b97\u5185\u4fee\u6539\u76ee\u6807\u667a\u80fd\u4f53\u7684\u63d0\u793a\u3001\u5de5\u5177\u3001\u63a7\u5236\u6d41\u3001\u8bb0\u5fc6\u4e0e\u7f16\u6392\u4ee3\u7801\uff0c\u5e76\u7528\u9690\u85cf\u6d4b\u8bd5\u96c6\u8861\u91cf\u76f8\u5bf9\u79cd\u5b50\u7248\u672c\u7684\u589e\u76ca\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06301", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u6a21\u62df\u6602\u8d35\u4e14\u968f\u673a\u7684\u771f\u5b9e\u8bc4\u6d4b\u573a\u666f\uff0c\u4f18\u5316\u5668\u53ea\u80fd\u57fa\u4e8e\u5206\u7ea7\u53cd\u9988\u8fed\u4ee3\u6539\u8fdb harness", "\u53ef\u4fe1\u6267\u884c\u73af\u5883\u7528\u4e8e\u9694\u79bb\u9690\u85cf\u8bc4\u6d4b\u3001\u8ba1\u91cf\u76ee\u6807\u667a\u80fd\u4f53\u8d44\u6e90\u6d88\u8017\uff0c\u5e76\u4fdd\u7559\u5019\u9009\u7248\u672c\u4ee5\u4fbf\u5ba1\u8ba1", "\u57284\u4e2a\u4e0b\u6e38\u4efb\u52a1\u3001111\u6b21\u8bc4\u5206\u8fd0\u884c\u4e2d\u8bc4\u6d4b5\u4e2a\u524d\u6cbfLLM\uff0c\u53d1\u73b0\u6a21\u578b\u5dee\u5f02\u6bd4\u6240\u7528\u7f16\u7801harness\u5dee\u5f02\u66f4\u663e\u8457"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u81ea\u52a8\u4f18\u5316", "LLM"], "num_comments": 0, "on_hf": true, "organization": "Scale AI", "pdf_url": "https://arxiv.org/pdf/2608.06301v1", "published_at": "2026-08-06", "score": 0.424, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06301.png", "title": "HarnessOpt-Bench: Evaluating LLMs at Harness Optimization", "tldr": "\u8bc4\u6d4bLLM\u81ea\u52a8\u4f18\u5316\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u7684\u80fd\u529b", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa HarnessOpt-Bench\uff0c\u4e00\u4e2a\u7528\u4e8e\u7aef\u5230\u7aef\u8bc4\u4f30 LLM \u8fdb\u884c harness \u4f18\u5316\u7684\u57fa\u51c6\u3002\u5b83\u8ba9\u4f18\u5316\u5668\u6a21\u578b\u5728\u56fa\u5b9a\u8bc4\u6d4b\u9884\u7b97\u5185\u4fee\u6539\u76ee\u6807\u667a\u80fd\u4f53\u7684\u63d0\u793a\u3001\u5de5\u5177\u3001\u63a7\u5236\u6d41\u3001\u8bb0\u5fc6\u4e0e\u7f16\u6392\u4ee3\u7801\uff0c\u5e76\u7528\u9690\u85cf\u6d4b\u8bd5\u96c6\u8861\u91cf\u76f8\u5bf9\u79cd\u5b50\u7248\u672c\u7684\u589e\u76ca\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u4f18\u5316\u667a\u80fd\u4f53\u5916\u90e8\u8fd0\u884c\u6846\u67b6\u201d\u5b9a\u4e49\u4e3a\u53ef\u6d4b\u91cf\u80fd\u529b\uff0c\u4e3a\u8bc4\u4f30\u548c\u6539\u8fdbLLM\u9a71\u52a8\u7684\u667a\u80fd\u4f53\u7cfb\u7edf\u63d0\u4f9b\u4e86\u7edf\u4e00\u534f\u8bae\uff1b\u7ed3\u679c\u4e5f\u8868\u660e\u5f53\u524d\u524d\u6cbf\u6a21\u578b\u5728\u8be5\u80fd\u529b\u4e0a\u4ecd\u6709\u8f83\u5927\u63d0\u5347\u7a7a\u95f4\u3002"}, {"abstract": "Agentic artificial intelligence (AI) is transforming Integrated Sensing and Communication (ISAC) from a function-oriented physical-layer technology into a goal-driven, closed-loop intelligent system, a paradigm we term AISAC. Existing work on learning-based sensing, resource allocation, reconfigurable intelligent surfaces (RIS), edge intelligence, multi-agent coordination, and resilient networking has developed largely in isolation. This survey unifies the literature within a six-stage closed-loop framework comprising observation, contextualization, reasoning and prediction, planning and orchestration, execution and collaboration, and feedback and resilience. It also introduces five levels of agentic maturity, ranging from physical-layer primitives to fully closed-loop agentic ISAC. We use this framework to review advances in multimodal intelligence, large language models, reinforcement learning, federated learning, RIS-assisted control, Unmanned Aerial Vehicle (UAV) and vehicular networks, and AI-native network management, and analyze privacy, security, resilience, and sustainability as cross-cutting requirements of the full perception-reasoning-action loop. An audit of representative studies against nine agentic-specific evaluation criteria shows that no system reports more than one or two of them, exposing a gap between claimed and demonstrated agentic maturity. We identify open challenges in physical-to-semantic grounding, predictive world models, real-time agent-PHY interaction, safe tool use, heterogeneous multi-agent collaboration, benchmarking, and resource-efficient autonomy.", "arxiv_id": "2608.05792", "arxiv_url": "https://arxiv.org/abs/2608.05792", "authors": ["Kai Li", "Conggai Li", "Sarah Ali Siddiqui", "Syed Sohail Ahmed", "Xin Yuan", "Shenghong Li", "Wei Ni"], "brief": "\u672c\u6587\u63d0\u51faAISAC\u6982\u5ff5\uff0c\u5c06\u96c6\u6210\u611f\u77e5\u4e0e\u901a\u4fe1\u4ece\u529f\u80fd\u5bfc\u5411\u7684\u7269\u7406\u5c42\u6280\u672f\u63d0\u5347\u4e3a\u76ee\u6807\u9a71\u52a8\u7684\u95ed\u73af\u667a\u80fd\u7cfb\u7edf\u3002\u8bba\u6587\u4ee5\u516d\u9636\u6bb5\u95ed\u73af\u6846\u67b6\u548c\u4e94\u7ea7\u667a\u80fd\u4f53\u6210\u719f\u5ea6\u7edf\u4e00\u68b3\u7406\u76f8\u5173\u7814\u7a76\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05792", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u201c\u89c2\u5bdf\u3001\u8bed\u5883\u5316\u3001\u63a8\u7406\u9884\u6d4b\u3001\u89c4\u5212\u7f16\u6392\u3001\u6267\u884c\u534f\u4f5c\u3001\u53cd\u9988\u97e7\u6027\u201d\u7684\u516d\u9636\u6bb5AISAC\u6846\u67b6", "\u63d0\u51fa\u4ece\u7269\u7406\u5c42\u539f\u8bed\u5230\u5b8c\u5168\u95ed\u73af\u667a\u80fd\u4f53ISAC\u7684\u4e94\u7ea7\u6210\u719f\u5ea6\u5212\u5206", "\u5ba1\u8ba1\u4ee3\u8868\u6027\u7814\u7a76\u7684\u4e5d\u9879\u667a\u80fd\u4f53\u8bc4\u4f30\u6307\u6807\uff0c\u53d1\u73b0\u73b0\u6709\u7cfb\u7edf\u8ddd\u79bb\u771f\u6b63\u95ed\u73af\u81ea\u6cbb\u4ecd\u6709\u660e\u663e\u5dee\u8ddd"], "keywords": ["\u667a\u80fd\u4f53", "\u901a\u4fe1\u7f51\u7edc", "\u591a\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05792v1", "published_at": "2026-08-06", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Agentic AI Meets Integrated Sensing and Communication", "tldr": "\u7efc\u8ff0Agentic AI\u9a71\u52a8\u7684\u95ed\u73afISAC\u8303\u5f0f", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51faAISAC\u6982\u5ff5\uff0c\u5c06\u96c6\u6210\u611f\u77e5\u4e0e\u901a\u4fe1\u4ece\u529f\u80fd\u5bfc\u5411\u7684\u7269\u7406\u5c42\u6280\u672f\u63d0\u5347\u4e3a\u76ee\u6807\u9a71\u52a8\u7684\u95ed\u73af\u667a\u80fd\u7cfb\u7edf\u3002\u8bba\u6587\u4ee5\u516d\u9636\u6bb5\u95ed\u73af\u6846\u67b6\u548c\u4e94\u7ea7\u667a\u80fd\u4f53\u6210\u719f\u5ea6\u7edf\u4e00\u68b3\u7406\u76f8\u5173\u7814\u7a76\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u628aISAC\u3001RIS\u3001\u8fb9\u7f18\u667a\u80fd\u3001\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u3001LLM\u4e0e\u5f3a\u5316\u5b66\u4e60\u7b49\u5206\u6563\u65b9\u5411\u6574\u5408\u5230\u7edf\u4e00\u667a\u80fd\u4f53\u6846\u67b6\u4e2d\uff0c\u4e3aAI\u539f\u751f\u901a\u4fe1\u7f51\u7edc\u7684\u8bc4\u4f30\u3001\u8bbe\u8ba1\u548c\u672a\u6765\u7814\u7a76\u6311\u6218\u63d0\u4f9b\u4e86\u7cfb\u7edf\u8def\u7ebf\u56fe\u3002"}, {"abstract": "Large language models are increasingly embedded in software engineering workflows as coding agents that can inspect repositories, invoke tools, execute tests, debug failures, and generate patches. Yet most existing agents remain largely static after deployment, even though software development is a dynamic, feedback-rich process in which repositories evolve, dependencies change, tests fail, and repair attempts leave reusable experience. This tension has motivated a growing body of work on self-evolving coding agents, where the agent improves its future behavior by updating its framework, memory, skills, tools, models, or collaboration structures from prior coding interactions. In this survey, we provide a systematic synthesis of this emerging area. We first define self-evolving coding agents and distinguish them from conventional coding agents and general self-evolving agents. We then develop an object-centered taxonomy that characterizes what evolves in these systems, and complement it with two orthogonal perspectives: when evolution occurs and what software-specific evidence drives it. Across the literature, we find that executable feedback, repository-level context, and coding trajectories give software engineering a distinctive role as a natural domain for agent self-evolution, but also introduce new challenges in feedback reliability, benchmark overfitting, safety, maintainability, cost, and generalization. By organizing existing work around these dimensions, this survey aims to clarify the conceptual boundaries of self-evolving coding agents and provide a foundation for designing more adaptive, reliable, and software-aware agentic systems. The papers we collect can be found at https://github.com/zhouhao1024/Awesome-Self-Evolving-Coding-Agents.", "arxiv_id": "2608.03392", "arxiv_url": "https://arxiv.org/abs/2608.03392", "authors": ["Hao Zhou", "Haichuan Hu", "Ye Shang", "Quanjun Zhang"], "brief": "\u672c\u6587\u662f\u4e00\u7bc7\u5173\u4e8e\u81ea\u8fdb\u5316\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u7efc\u8ff0\uff0c\u5b9a\u4e49\u4e86\u8be5\u9886\u57df\u6982\u5ff5\uff0c\u5e76\u533a\u5206\u5176\u4e0e\u4f20\u7edf\u7f16\u7a0b\u667a\u80fd\u4f53\u3001\u901a\u7528\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u7684\u8fb9\u754c\u3002\u8bba\u6587\u63d0\u51fa\u4ee5\u201c\u8fdb\u5316\u5bf9\u8c61\u201d\u4e3a\u4e2d\u5fc3\u7684\u5206\u7c7b\u6846\u67b6\uff0c\u5e76\u4ece\u8fdb\u5316\u65f6\u673a\u4e0e\u8f6f\u4ef6\u8bc1\u636e\u6765\u6e90\u4e24\u4e2a\u7ef4\u5ea6\u68b3\u7406\u5df2\u6709\u5de5\u4f5c\u3002", "categories": ["cs.SE"], "github_repo": "https://github.com/zhouhao1024/Awesome-Self-Evolving-Coding-Agents", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2608.03392", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u603b\u7ed3\u81ea\u8fdb\u5316\u5bf9\u8c61\u5305\u62ec\u6846\u67b6\u3001\u8bb0\u5fc6\u3001\u6280\u80fd\u3001\u5de5\u5177\u3001\u6a21\u578b\u4e0e\u534f\u4f5c\u7ed3\u6784\u7b49", "\u5f3a\u8c03\u53ef\u6267\u884c\u53cd\u9988\u3001\u4ed3\u5e93\u7ea7\u4e0a\u4e0b\u6587\u548c\u7f16\u7801\u8f68\u8ff9\u662f\u8f6f\u4ef6\u5de5\u7a0b\u4e2d\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u7684\u6838\u5fc3\u4fe1\u53f7", "\u6307\u51fa\u53cd\u9988\u53ef\u9760\u6027\u3001\u57fa\u51c6\u8fc7\u62df\u5408\u3001\u5b89\u5168\u6027\u3001\u53ef\u7ef4\u62a4\u6027\u3001\u6210\u672c\u4e0e\u6cdb\u5316\u80fd\u529b\u4ecd\u662f\u4e3b\u8981\u6311\u6218"], "keywords": ["\u7f16\u7a0b\u667a\u80fd\u4f53", "\u81ea\u8fdb\u5316", "\u8f6f\u4ef6\u5de5\u7a0b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Nanjing University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2608.03392v1", "published_at": "2026-08-04", "score": 0.388, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03392.png", "title": "Self-Evolving Coding Agents", "tldr": "\u7cfb\u7edf\u7efc\u8ff0\u81ea\u8fdb\u5316\u7f16\u7a0b\u667a\u80fd\u4f53\u7814\u7a76", "upvotes": 3, "what_it_is": "\u672c\u6587\u662f\u4e00\u7bc7\u5173\u4e8e\u81ea\u8fdb\u5316\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u7efc\u8ff0\uff0c\u5b9a\u4e49\u4e86\u8be5\u9886\u57df\u6982\u5ff5\uff0c\u5e76\u533a\u5206\u5176\u4e0e\u4f20\u7edf\u7f16\u7a0b\u667a\u80fd\u4f53\u3001\u901a\u7528\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u7684\u8fb9\u754c\u3002\u8bba\u6587\u63d0\u51fa\u4ee5\u201c\u8fdb\u5316\u5bf9\u8c61\u201d\u4e3a\u4e2d\u5fc3\u7684\u5206\u7c7b\u6846\u67b6\uff0c\u5e76\u4ece\u8fdb\u5316\u65f6\u673a\u4e0e\u8f6f\u4ef6\u8bc1\u636e\u6765\u6e90\u4e24\u4e2a\u7ef4\u5ea6\u68b3\u7406\u5df2\u6709\u5de5\u4f5c\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u4e3a\u5feb\u901f\u53d1\u5c55\u7684\u81ea\u8fdb\u5316\u7f16\u7a0b\u667a\u80fd\u4f53\u9886\u57df\u5efa\u7acb\u4e86\u6982\u5ff5\u8fb9\u754c\u548c\u5206\u7c7b\u4f53\u7cfb\uff0c\u6709\u52a9\u4e8e\u540e\u7eed\u8bbe\u8ba1\u66f4\u81ea\u9002\u5e94\u3001\u66f4\u53ef\u9760\u7684\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u3002"}, {"abstract": "Commercial vision-language models are reshaping computer vision, with visual priors broad enough to rival task-specific systems. This raises a natural question: do they reduce the need for classic, physics-informed low-level vision? We study this through shadow removal, a problem shaped by scene geometry, illumination, materials, and occluders, where paired shadow and shadow-free data are hard to collect at scale. We find that a commercial generative editor, used directly, can produce clean shadow-free edits that preserve surface texture and local appearance. However, this comes with a new failure mode: the same editor can regenerate scene content, hallucinate objects, or misread a shadow as material or geometry, producing plausible but physically wrong edits. We address this with an agentic candidate-selection pipeline: the editor generates a guided probe, an evaluator screens for major failures, retries when needed, samples multiple candidates, filters them, and selects a final result balancing shadow removal against scene preservation. Grounding this process in shadow-formation physics makes it more reliable: prompting the generator and evaluator to treat shadows as illumination effects caused by light occlusion, not material or object structure, measurably improves quality and consistency. On the ShadowRemovalRefine benchmark, our physics-oriented pipeline achieves a CDD of 0.0075, reducing CDD by at least 47% over the strongest prior method. These results suggest that commercial vision-language models do not replace classic low-level vision priors; instead, such priors remain useful for constraining and steering physically underconstrained generation.", "arxiv_id": "2608.06075", "arxiv_url": "https://arxiv.org/abs/2608.06075", "authors": ["Shilin Hu", "Jingyi Xu", "Dimitris Samaras", "Hieu Le"], "brief": "\u8bba\u6587\u4ee5\u9634\u5f71\u79fb\u9664\u4e3a\u4f8b\uff0c\u6784\u5efa\u4e86\u4e00\u4e2a\u667a\u80fd\u4f53\u5f0f\u5019\u9009\u9009\u62e9\u6d41\u7a0b\uff1a\u5546\u4e1a\u751f\u6210\u5f0f\u56fe\u50cf\u7f16\u8f91\u5668\u5148\u751f\u6210\u591a\u4e2a\u7ed3\u679c\uff0c\u518d\u7531\u8bc4\u4f30\u5668\u7b5b\u67e5\u3001\u91cd\u8bd5\u3001\u8fc7\u6ee4\u5e76\u9009\u51fa\u6700\u7ec8\u7f16\u8f91\u3002\u6838\u5fc3\u53d1\u73b0\u662f\uff0c\u89c6\u89c9\u8bed\u8a00\u751f\u6210\u6a21\u578b\u867d\u80fd\u9ad8\u8d28\u91cf\u53bb\u9634\u5f71\uff0c\u4f46\u4ecd\u9700\u9634\u5f71\u5f62\u6210\u7684\u7269\u7406\u5148\u9a8c\u6765\u907f\u514d\u5e7b\u89c9\u548c\u5185\u5bb9\u7be1\u6539\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06075", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u9634\u5f71\u660e\u786e\u5efa\u6a21\u4e3a\u7531\u5149\u7167\u906e\u6321\u5bfc\u81f4\u7684\u7167\u660e\u6548\u5e94\uff0c\u800c\u975e\u6750\u8d28\u3001\u7269\u4f53\u6216\u51e0\u4f55\u7ed3\u6784\uff0c\u5f15\u5bfc\u751f\u6210\u5668\u4e0e\u8bc4\u4f30\u5668\u5224\u65ad", "\u6d41\u7a0b\u5305\u542b\u63a2\u6d4b\u7f16\u8f91\u3001\u5931\u8d25\u7b5b\u67e5\u3001\u5fc5\u8981\u91cd\u8bd5\u3001\u591a\u5019\u9009\u91c7\u6837\u3001\u8fc7\u6ee4\u4e0e\u6700\u7ec8\u9009\u62e9\uff0c\u4ee5\u5e73\u8861\u53bb\u9634\u5f71\u6548\u679c\u548c\u573a\u666f\u4fdd\u771f", "\u5728 ShadowRemovalRefine \u57fa\u51c6\u4e0a\u8fbe\u5230 CDD 0.0075\uff0c\u76f8\u6bd4\u6700\u5f3a\u65e2\u6709\u65b9\u6cd5\u81f3\u5c11\u964d\u4f4e 47%"], "keywords": ["\u667a\u80fd\u4f53", "\u56fe\u50cf\u7f16\u8f91", "\u7269\u7406\u5148\u9a8c", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06075v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Domain-Grounded Candidate Selection for Agentic Image Editing: A Shadow Removal Case", "tldr": "\u7528\u7269\u7406\u5148\u9a8c\u7ea6\u675f\u667a\u80fd\u4f53\u5f0f\u9634\u5f71\u79fb\u9664", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ee5\u9634\u5f71\u79fb\u9664\u4e3a\u4f8b\uff0c\u6784\u5efa\u4e86\u4e00\u4e2a\u667a\u80fd\u4f53\u5f0f\u5019\u9009\u9009\u62e9\u6d41\u7a0b\uff1a\u5546\u4e1a\u751f\u6210\u5f0f\u56fe\u50cf\u7f16\u8f91\u5668\u5148\u751f\u6210\u591a\u4e2a\u7ed3\u679c\uff0c\u518d\u7531\u8bc4\u4f30\u5668\u7b5b\u67e5\u3001\u91cd\u8bd5\u3001\u8fc7\u6ee4\u5e76\u9009\u51fa\u6700\u7ec8\u7f16\u8f91\u3002\u6838\u5fc3\u53d1\u73b0\u662f\uff0c\u89c6\u89c9\u8bed\u8a00\u751f\u6210\u6a21\u578b\u867d\u80fd\u9ad8\u8d28\u91cf\u53bb\u9634\u5f71\uff0c\u4f46\u4ecd\u9700\u9634\u5f71\u5f62\u6210\u7684\u7269\u7406\u5148\u9a8c\u6765\u907f\u514d\u5e7b\u89c9\u548c\u5185\u5bb9\u7be1\u6539\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bf4\u660e\u5546\u4e1a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5e76\u4e0d\u80fd\u5b8c\u5168\u53d6\u4ee3\u7ecf\u5178\u4f4e\u5c42\u89c6\u89c9\u5148\u9a8c\uff1b\u76f8\u53cd\uff0c\u7269\u7406\u77e5\u8bc6\u53ef\u4f5c\u4e3a\u7ea6\u675f\u673a\u5236\uff0c\u663e\u8457\u63d0\u5347\u751f\u6210\u5f0f\u56fe\u50cf\u7f16\u8f91\u5728\u7269\u7406\u4e00\u81f4\u6027\u548c\u53ef\u9760\u6027\u4e0a\u7684\u8868\u73b0\u3002"}, {"abstract": "Tool-calling agents infer task state from accumulated dialogue and tool traces. In persistent interactions, however, historical traces may remain structurally valid and semantically plausible after they cease to be authoritative for the current request. We show that such history can hijack a policy the model already possesses: on Qwen3-1.7B, pollution flips 32.1% of decisions that are correct under the original trajectory and frequently induces reuse of corrupted entities or interface conventions. We introduce bench, a paired benchmark with synchronized Original, Polluted, and Oracle State views that preserve the system policy, current tools, latest request, and gold next action. Eleven gold-preserving interventions isolate failures in decision state, entity binding, and interface execution across complete calls and non-call decisions. We further propose ours, which transfers an Oracle-conditioned teacher policy to a student observing only polluted history through soft supervision on student-generated prefixes. On Qwen3-1.7B, ours achieves 87.0% Balanced Tool-Use Accuracy, outperforming Gold-SFT (66.3%), Oracle sequence distillation (82.3%), and off-policy token distillation (85.0%). The method scales consistently: an 8B teacher raises the same compact 1.7B student to 91.9%, while an 8B student reaches 93.0%. The resulting policies further transfer to clean histories, unseen functions, independently regenerated evaluation contexts, external tool-use benchmarks, and noisy multi-hop question answering. These results establish history reliability as a distinct tool-use bottleneck and demonstrate reliable-state policy transfer as an effective and scalable solution.", "arxiv_id": "2608.06057", "arxiv_url": "https://arxiv.org/abs/2608.06057", "authors": ["Xiaoqing Wu", "Xingyu Fan", "Feifei Li", "Wenhui Que"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u4e2d\u201c\u8fc7\u671f\u4f46\u770b\u4f3c\u5408\u7406\u201d\u7684\u5386\u53f2\u8bb0\u5f55\u5982\u4f55\u8bef\u5bfc\u6a21\u578b\u51b3\u7b56\uff0c\u5e76\u6784\u5efa\u5305\u542b Original\u3001Polluted\u3001Oracle State \u4e09\u79cd\u89c6\u56fe\u7684\u914d\u5bf9\u57fa\u51c6\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u4e00\u79cd\u53ef\u9760\u72b6\u6001\u7b56\u7565\u8fc1\u79fb\u65b9\u6cd5\uff0c\u7528 Oracle \u6761\u4ef6\u6559\u5e08\u6307\u5bfc\u53ea\u80fd\u770b\u5230\u6c61\u67d3\u5386\u53f2\u7684\u5b66\u751f\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06057", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728 Qwen3-1.7B \u4e0a\uff0c\u5386\u53f2\u6c61\u67d3\u4f1a\u7ffb\u8f6c 32.1% \u539f\u672c\u6b63\u786e\u7684\u51b3\u7b56\uff0c\u5e76\u8bf1\u53d1\u9519\u8bef\u5b9e\u4f53\u590d\u7528\u6216\u63a5\u53e3\u7ea6\u5b9a\u590d\u7528\u3002", "\u57fa\u51c6\u901a\u8fc7 11 \u7c7b\u4fdd\u6301\u91d1\u6807\u4e0d\u53d8\u7684\u5e72\u9884\uff0c\u9694\u79bb\u51b3\u7b56\u72b6\u6001\u3001\u5b9e\u4f53\u7ed1\u5b9a\u3001\u63a5\u53e3\u6267\u884c\u4ee5\u53ca\u975e\u8c03\u7528\u51b3\u7b56\u4e2d\u7684\u5931\u8d25\u6a21\u5f0f\u3002", "\u6240\u63d0\u65b9\u6cd5\u5728 Qwen3-1.7B \u4e0a\u8fbe\u5230 87.0% Balanced Tool-Use Accuracy\uff0c\u4f18\u4e8e Gold-SFT\u3001Oracle \u5e8f\u5217\u84b8\u998f\u548c\u79bb\u7b56\u7565 token \u84b8\u998f\uff1b\u4f7f\u7528 8B \u6559\u5e08\u53ef\u63d0\u5347\u81f3 91.9%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u591a\u8f6e\u5bf9\u8bdd", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06057v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "When History Lies: Evaluating and Improving Tool Use under Misleading Multi-Turn Histories", "tldr": "\u5386\u53f2\u6c61\u67d3\u4f1a\u52ab\u6301\u5de5\u5177\u8c03\u7528\uff0c\u84b8\u998f\u53ef\u4fee\u590d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u4e2d\u201c\u8fc7\u671f\u4f46\u770b\u4f3c\u5408\u7406\u201d\u7684\u5386\u53f2\u8bb0\u5f55\u5982\u4f55\u8bef\u5bfc\u6a21\u578b\u51b3\u7b56\uff0c\u5e76\u6784\u5efa\u5305\u542b Original\u3001Polluted\u3001Oracle State \u4e09\u79cd\u89c6\u56fe\u7684\u914d\u5bf9\u57fa\u51c6\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u4e00\u79cd\u53ef\u9760\u72b6\u6001\u7b56\u7565\u8fc1\u79fb\u65b9\u6cd5\uff0c\u7528 Oracle \u6761\u4ef6\u6559\u5e08\u6307\u5bfc\u53ea\u80fd\u770b\u5230\u6c61\u67d3\u5386\u53f2\u7684\u5b66\u751f\u6a21\u578b\u3002", "why_notable": "\u5b83\u5c06\u201c\u5386\u53f2\u53ef\u9760\u6027\u201d\u660e\u786e\u63d0\u51fa\u4e3a\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u72ec\u7acb\u74f6\u9888\uff0c\u5e76\u7ed9\u51fa\u53ef\u6269\u5c55\u7684\u8bad\u7ec3\u65b9\u6848\uff0c\u80fd\u8fc1\u79fb\u5230\u5e72\u51c0\u5386\u53f2\u3001\u672a\u89c1\u51fd\u6570\u3001\u5916\u90e8\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u548c\u566a\u58f0\u591a\u8df3\u95ee\u7b54\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Autonomous agents choose actions using scores that may not reflect experimental success. We developed OPERA, an operator-residual framework for optical experiments. It represents experimental actions as optical operators and evaluates their outcomes using physically interpretable residuals. Operators specify executable changes to measurement, control or reconstruction, while residuals report departures from specified physical conditions. The agent uses both to select, combine or generate operators, and physical performance is evaluated independently against a withheld reference. Across three optical tasks, score-only feedback produced score increases without physical improvement in 23.6--39.0\\% of decisions, compared with 0.9--1.9\\% for operator-residual feedback. Operator-residual feedback increased the probability of reaching and maintaining task targets and reduced experimental budgets. Protocols selected in digital twins were transferred to three optical instruments, and repeated experiments showed a lower projection budget in structured-light reconstruction. Together, operators and residuals guide autonomous decisions using measurable physical evidence.", "arxiv_id": "2608.05990", "arxiv_url": "https://arxiv.org/abs/2608.05990", "authors": ["Ning Xu", "Xiang Zheng", "Fuqiang Zhong", "Huadong Wang", "Xiaolong Wu", "Zhiyuan Liu", "Hui Ning"], "brief": "\u8bba\u6587\u63d0\u51fa OPERA\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u4e3b\u5149\u5b66\u5b9e\u9a8c\u7684\u201c\u7b97\u5b50-\u6b8b\u5dee\u201d\u53cd\u9988\u6846\u67b6\u3002\u5b83\u5c06\u5b9e\u9a8c\u52a8\u4f5c\u8868\u793a\u4e3a\u53ef\u6267\u884c\u7684\u5149\u5b66\u7b97\u5b50\uff0c\u5e76\u7528\u5177\u7269\u7406\u53ef\u89e3\u91ca\u6027\u7684\u6b8b\u5dee\u8bc4\u4f30\u7ed3\u679c\uff0c\u5e2e\u52a9\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u9009\u62e9\u3001\u7ec4\u5408\u6216\u751f\u6210\u5b9e\u9a8c\u64cd\u4f5c\u3002", "categories": ["cs.AI", "cs.CE", "physics.app-ph", "physics.optics"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05990", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7b97\u5b50\u63cf\u8ff0\u5bf9\u6d4b\u91cf\u3001\u63a7\u5236\u6216\u91cd\u5efa\u6d41\u7a0b\u7684\u53ef\u6267\u884c\u4fee\u6539\uff0c\u6b8b\u5dee\u91cf\u5316\u5b9e\u9a8c\u7ed3\u679c\u504f\u79bb\u76ee\u6807\u7269\u7406\u6761\u4ef6\u7684\u7a0b\u5ea6\u3002", "\u5728\u4e09\u4e2a\u5149\u5b66\u4efb\u52a1\u4e2d\uff0c\u4ec5\u4f9d\u8d56\u5206\u6570\u53cd\u9988\u4f1a\u5728 23.6%\u201339.0% \u7684\u51b3\u7b56\u4e2d\u51fa\u73b0\u201c\u5206\u6570\u63d0\u9ad8\u4f46\u7269\u7406\u6027\u80fd\u65e0\u6539\u5584\u201d\uff0c\u800c OPERA \u964d\u81f3 0.9%\u20131.9%\u3002", "\u5728\u6570\u5b57\u5b6a\u751f\u4e2d\u7b5b\u9009\u7684\u5b9e\u9a8c\u534f\u8bae\u53ef\u8fc1\u79fb\u5230\u4e09\u53f0\u771f\u5b9e\u5149\u5b66\u4eea\u5668\uff0c\u5e76\u5728\u7ed3\u6784\u5149\u91cd\u5efa\u4e2d\u964d\u4f4e\u6295\u5f71\u9884\u7b97\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u5316\u5b9e\u9a8c", "\u7269\u7406\u53cd\u9988", "\u5149\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05990v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "OPERA: Operator-residual feedback for reliable autonomous optical experiments with language-model agents", "tldr": "\u7528\u7269\u7406\u6b8b\u5dee\u53cd\u9988\u63d0\u5347\u5149\u5b66\u5b9e\u9a8c\u667a\u80fd\u4f53\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OPERA\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u4e3b\u5149\u5b66\u5b9e\u9a8c\u7684\u201c\u7b97\u5b50-\u6b8b\u5dee\u201d\u53cd\u9988\u6846\u67b6\u3002\u5b83\u5c06\u5b9e\u9a8c\u52a8\u4f5c\u8868\u793a\u4e3a\u53ef\u6267\u884c\u7684\u5149\u5b66\u7b97\u5b50\uff0c\u5e76\u7528\u5177\u7269\u7406\u53ef\u89e3\u91ca\u6027\u7684\u6b8b\u5dee\u8bc4\u4f30\u7ed3\u679c\uff0c\u5e2e\u52a9\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u9009\u62e9\u3001\u7ec4\u5408\u6216\u751f\u6210\u5b9e\u9a8c\u64cd\u4f5c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u51b3\u7b56\u53cd\u9988\u4ece\u9ed1\u7bb1\u5206\u6570\u8f6c\u5411\u53ef\u89e3\u91ca\u3001\u53ef\u6d4b\u91cf\u7684\u7269\u7406\u8bc1\u636e\uff0c\u663e\u8457\u964d\u4f4e\u5956\u52b1\u6295\u673a\u548c\u65e0\u6548\u4f18\u5316\u98ce\u9669\uff0c\u5bf9\u81ea\u52a8\u5316\u79d1\u5b66\u5b9e\u9a8c\u548c\u7269\u7406\u7cfb\u7edf\u95ed\u73af\u63a7\u5236\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Mobile GUI agents can operate apps through pixel perception and touch actions, making them a promising interface for collecting and improving long-horizon mobile interaction policies. However, real trajectories are difficult to obtain for sensitive apps and privacy-critical operations. At the same time, existing simulated environments are costly to scale up, and GUI world models still suffer from unstable generation, limited modality coverage, and inconsistent action-transition logic. To address these limitations, we propose AppDeltaWorld, a transition-grounded delta code world model that predicts the next GUI as a reachable code update rather than as an unconstrained image or text description. AppDeltaWorld retrieves app-specific Level-1 HTML references under an action-transition constraint, generates Level-2 executable HTML conditioned on the current screen, action, predicted next-screen text, and retrieved structure, and inserts generated visual assets into image slots before browser rendering. As a world model, AppDeltaWorld achieves the highest fidelity on CMGUIBench-500 under Code2World evaluation, with clear gains in structural layout and UI element reconstruction over image-only and code-only baselines. As a training environment, AppDeltaWorld supports filtered closed-loop SFT data construction that, when combined with public supervision, enables AppDeltaAgent to achieve state-of-the-art performance on AndroidLens and consistent gains on MobileGym and MobileWorld. Moreover, world-model-based test-time reinforcement learning enables policy adaptation and shows further improvements without additional interaction with real apps.", "arxiv_id": "2608.05891", "arxiv_url": "https://arxiv.org/abs/2608.05891", "authors": ["Weikai Xu", "Yunren Feng", "Haoxiang Lei", "Kun Huang", "Yuxuan Liu", "Kang Zhao", "Xiaolin Hu", "Shuo Shang", "Bo An"], "brief": "\u8bba\u6587\u63d0\u51fa AppDeltaWorld\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u7684\u201c\u589e\u91cf\u4ee3\u7801\u201d\u4e16\u754c\u6a21\u578b\uff1a\u4e0d\u76f4\u63a5\u751f\u6210\u56fe\u50cf\u6216\u6587\u672c\u63cf\u8ff0\uff0c\u800c\u662f\u9884\u6d4b\u52a8\u4f5c\u540e\u53ef\u5230\u8fbe\u7684 HTML \u4ee3\u7801\u66f4\u65b0\u5e76\u6e32\u67d3\u4e0b\u4e00\u5c4f\u3002\u5b83\u8fd8\u7528\u8be5\u4e16\u754c\u6a21\u578b\u6784\u5efa\u95ed\u73af SFT \u6570\u636e\u548c\u6d4b\u8bd5\u65f6\u5f3a\u5316\u5b66\u4e60\u73af\u5883\uff0c\u63d0\u5347\u79fb\u52a8\u7aef\u64cd\u4f5c\u7b56\u7565\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05891", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u52a8\u4f5c-\u72b6\u6001\u8f6c\u79fb\u7ea6\u675f\u4e0b\u68c0\u7d22\u5e94\u7528\u76f8\u5173\u7684 Level-1 HTML \u53c2\u8003\uff0c\u518d\u7ed3\u5408\u5f53\u524d\u5c4f\u5e55\u3001\u52a8\u4f5c\u3001\u9884\u6d4b\u6587\u672c\u548c\u7ed3\u6784\u751f\u6210\u53ef\u6267\u884c Level-2 HTML\u3002", "\u901a\u8fc7\u63d2\u5165\u751f\u6210\u7684\u89c6\u89c9\u7d20\u6750\u5e76\u7531\u6d4f\u89c8\u5668\u6e32\u67d3\uff0c\u63d0\u5347 GUI \u5e03\u5c40\u3001\u5143\u7d20\u7ed3\u6784\u548c\u89c6\u89c9\u91cd\u5efa\u7684\u4e00\u81f4\u6027\u3002", "\u5728 CMGUIBench-500 \u7684 Code2World \u8bc4\u6d4b\u4e2d\u4fdd\u771f\u5ea6\u6700\u4f73\uff1b\u8bad\u7ec3\u51fa\u7684 AppDeltaAgent \u5728 AndroidLens \u8fbe\u5230 SOTA\uff0c\u5e76\u5728 MobileGym\u3001MobileWorld \u4e0a\u7a33\u5b9a\u63d0\u5347\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05891v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AppDeltaWorld: Transition-Grounded Delta Code World Model for Mobile GUI Agents", "tldr": "\u7528\u53ef\u6267\u884c\u4ee3\u7801\u5efa\u6a21\u624b\u673aGUI\u8f6c\u79fb\u4ee5\u8bad\u7ec3\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AppDeltaWorld\uff0c\u4e00\u79cd\u9762\u5411\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u7684\u201c\u589e\u91cf\u4ee3\u7801\u201d\u4e16\u754c\u6a21\u578b\uff1a\u4e0d\u76f4\u63a5\u751f\u6210\u56fe\u50cf\u6216\u6587\u672c\u63cf\u8ff0\uff0c\u800c\u662f\u9884\u6d4b\u52a8\u4f5c\u540e\u53ef\u5230\u8fbe\u7684 HTML \u4ee3\u7801\u66f4\u65b0\u5e76\u6e32\u67d3\u4e0b\u4e00\u5c4f\u3002\u5b83\u8fd8\u7528\u8be5\u4e16\u754c\u6a21\u578b\u6784\u5efa\u95ed\u73af SFT \u6570\u636e\u548c\u6d4b\u8bd5\u65f6\u5f3a\u5316\u5b66\u4e60\u73af\u5883\uff0c\u63d0\u5347\u79fb\u52a8\u7aef\u64cd\u4f5c\u7b56\u7565\u3002", "why_notable": "\u5b83\u628a GUI \u4e16\u754c\u6a21\u578b\u4ece\u4e0d\u7a33\u5b9a\u7684\u56fe\u50cf\u751f\u6210\u8f6c\u5411\u53d7\u8f6c\u79fb\u7ea6\u675f\u7684\u53ef\u6267\u884c\u4ee3\u7801\u751f\u6210\uff0c\u53ef\u66f4\u4f4e\u6210\u672c\u3001\u66f4\u9690\u79c1\u53cb\u597d\u5730\u5408\u6210\u79fb\u52a8\u4ea4\u4e92\u8f68\u8ff9\uff0c\u5e76\u652f\u6301\u65e0\u9700\u771f\u5b9e\u5e94\u7528\u4ea4\u4e92\u7684\u6d4b\u8bd5\u65f6\u7b56\u7565\u9002\u5e94\u3002"}, {"abstract": "Self-evolving agents accumulate capability by distilling reusable skills from their execution trajectories, but we find this process is not monotonic: past a critical pool size, newly added skills degrade performance instead of improving it. We formalize this capability-contamination phase transition and trace it to a structural cause: once a defective skill enters the decision context, it becomes reference material for distilling later skills, forming cross-round contamination chains. We further show the contamination is structurally irreversible: removing a source skill after the fact cannot erase the flawed reasoning its descendants have already inherited, so post-hoc rollback recovers only a small fraction of the lost performance. This makes skill admission a pre-commit necessity rather than a post-hoc fix, and motivates Verifier-as-Gatekeeper (VaG): a progressive trust hierarchy whose three heterogeneous critics - structural validity, behavioral harmlessness, and semantic consistency - filter each skill individually, coupled with a marginal-gain subset selection that removes combinatorial contamination at the top tier before skills reach the runtime context. On Terminal-Bench 2, unconditional accumulation rises to a peak and then degrades, giving back most of its gains as the pool keeps growing, and post-hoc removal of the culprit skills recovers only a small part of the drop - the empirical signature of irreversibility. In contrast, VaG improves every round, reaching 72% pass@1 with a pool roughly 5x smaller, and its frozen skill pool transfers positively to four other backbones and a second benchmark without re-evolution. Ablations confirm the three critics are complementary and mutually non-substitutable, each intercepting a largely disjoint class of harmful skills.", "arxiv_id": "2608.05810", "arxiv_url": "https://arxiv.org/abs/2608.05810", "authors": ["Linfang Shang", "Ming Xu", "Yiding Sun", "Tianle Xia", "Lingxiang Hu", "Lan Xu", "Ning Zheng"], "brief": "\u8bba\u6587\u53d1\u73b0\u81ea\u8fdb\u5316LLM\u667a\u80fd\u4f53\u7684\u6280\u80fd\u79ef\u7d2f\u5e76\u975e\u5355\u8c03\u589e\u76ca\uff1a\u6280\u80fd\u6c60\u8fc7\u5927\u540e\uff0c\u7f3a\u9677\u6280\u80fd\u4f1a\u901a\u8fc7\u540e\u7eed\u84b8\u998f\u5f62\u6210\u8de8\u8f6e\u6c61\u67d3\u94fe\u5e76\u5bfc\u81f4\u6027\u80fd\u9000\u5316\u3002\u4f5c\u8005\u63d0\u51faVerifier-as-Gatekeeper\uff08VaG\uff09\uff0c\u5728\u6280\u80fd\u8fdb\u5165\u8fd0\u884c\u4e0a\u4e0b\u6587\u524d\u7528\u591a\u91cd\u9a8c\u8bc1\u5668\u548c\u8fb9\u9645\u6536\u76ca\u9009\u62e9\u8fdb\u884c\u9884\u63d0\u4ea4\u8fc7\u6ee4\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05810", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5f62\u5f0f\u5316\u4e86\u80fd\u529b\u6c61\u67d3\u76f8\u53d8\uff1a\u8d85\u8fc7\u4e34\u754c\u6280\u80fd\u6c60\u89c4\u6a21\u540e\uff0c\u65b0\u6280\u80fd\u53ef\u80fd\u964d\u4f4e\u800c\u975e\u63d0\u5347\u667a\u80fd\u4f53\u8868\u73b0\u3002", "\u6307\u51fa\u6c61\u67d3\u5177\u6709\u7ed3\u6784\u4e0d\u53ef\u9006\u6027\uff1a\u4e8b\u540e\u5220\u9664\u6e90\u5934\u7f3a\u9677\u6280\u80fd\u65e0\u6cd5\u6e05\u9664\u5176\u540e\u4ee3\u6280\u80fd\u7ee7\u627f\u7684\u9519\u8bef\u63a8\u7406\u3002", "VaG\u4f7f\u7528\u7ed3\u6784\u6709\u6548\u6027\u3001\u884c\u4e3a\u65e0\u5bb3\u6027\u3001\u8bed\u4e49\u4e00\u81f4\u6027\u4e09\u7c7b\u5f02\u6784\u6279\u8bc4\u5668\uff0c\u5e76\u7ed3\u5408\u8fb9\u9645\u589e\u76ca\u5b50\u96c6\u9009\u62e9\uff0cTerminal-Bench 2\u4e0a\u8fbe\u523072% pass@1\u4e14\u6280\u80fd\u6c60\u7ea6\u5c0f5\u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u8fdb\u5316", "\u6280\u80fd\u5b66\u4e60", "\u5b89\u5168\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05810v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "When Self-Evolution Backfires: Pre-Commit Gating against Skill Contamination in LLM Agents", "tldr": "\u7528\u9884\u63d0\u4ea4\u95e8\u63a7\u9632\u6b62LLM\u667a\u80fd\u4f53\u6280\u80fd\u6c61\u67d3", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\u81ea\u8fdb\u5316LLM\u667a\u80fd\u4f53\u7684\u6280\u80fd\u79ef\u7d2f\u5e76\u975e\u5355\u8c03\u589e\u76ca\uff1a\u6280\u80fd\u6c60\u8fc7\u5927\u540e\uff0c\u7f3a\u9677\u6280\u80fd\u4f1a\u901a\u8fc7\u540e\u7eed\u84b8\u998f\u5f62\u6210\u8de8\u8f6e\u6c61\u67d3\u94fe\u5e76\u5bfc\u81f4\u6027\u80fd\u9000\u5316\u3002\u4f5c\u8005\u63d0\u51faVerifier-as-Gatekeeper\uff08VaG\uff09\uff0c\u5728\u6280\u80fd\u8fdb\u5165\u8fd0\u884c\u4e0a\u4e0b\u6587\u524d\u7528\u591a\u91cd\u9a8c\u8bc1\u5668\u548c\u8fb9\u9645\u6536\u76ca\u9009\u62e9\u8fdb\u884c\u9884\u63d0\u4ea4\u8fc7\u6ee4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u4e2d\u201c\u8d8a\u5b66\u8d8a\u5dee\u201d\u7684\u673a\u5236\u6027\u98ce\u9669\uff0c\u5e76\u8bc1\u660e\u4e8b\u540e\u56de\u6eda\u4e0d\u8db3\u4ee5\u4fee\u590d\u6c61\u67d3\uff0c\u5f3a\u8c03\u6280\u80fd\u51c6\u5165\u9700\u8981\u524d\u7f6e\u9a8c\u8bc1\uff1bVaG\u5728\u6027\u80fd\u3001\u53ef\u8fc1\u79fb\u6027\u548c\u6280\u80fd\u6c60\u6548\u7387\u4e0a\u90fd\u6709\u660e\u663e\u6536\u76ca\uff0c\u5bf9\u957f\u671f\u5b66\u4e60\u578bLLM Agent\u7684\u5b89\u5168\u4e0e\u53ef\u9760\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "As large language model (LLM) agents increasingly invoke external tools and interact with real-world systems, unsafe actions may cause irreversible consequences on external states, user data, and downstream services. Recent runtime guardrails mitigate such risks by checking proposed actions before execution, but many remain reactive: they primarily assess the apparent safety of the current action, lacking an explicit model of how risk evolves across the trajectory. This limitation creates a critical blind spot for long-horizon risks, where individually benign-looking actions can gradually drift the agent toward hazardous states. In response, we propose DreamGuard, a proactive guardrail for LLM agents built around a risk-aware world model. The world model maintains a compact recurrent latent state over the trajectory and predicts future latent states from which DreamGuard derives immediate-hazard and prefix-risk evidence. It then fuses these multi-horizon signals into intervention decisions before execution. Experiments across four benchmarks and an online guardrail evaluation show that DreamGuard outperforms generic, reactive, and proactive guardrail baselines, achieves the best safety-utility trade-off among evaluated guardrails, and maintains an average end-to-end latency of 25 ms per call.", "arxiv_id": "2608.05695", "arxiv_url": "https://arxiv.org/abs/2608.05695", "authors": ["Wenhao Lin", "Chenyu Yu", "Xingwei Lin", "Sicong Cao", "Xiang Chen", "Lei Xue", "Le Yu", "Letian Sha", "Chunming Wu"], "brief": "DreamGuard \u662f\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8fd0\u884c\u65f6\u5b89\u5168\u62a4\u680f\uff0c\u901a\u8fc7\u98ce\u9669\u611f\u77e5\u4e16\u754c\u6a21\u578b\u8ddf\u8e2a\u4ea4\u4e92\u8f68\u8ff9\u4e2d\u7684\u6f5c\u5728\u98ce\u9669\u6f14\u5316\u3002\u5b83\u5728\u52a8\u4f5c\u6267\u884c\u524d\u7ed3\u5408\u5373\u65f6\u5371\u9669\u4e0e\u957f\u671f\u524d\u7f00\u98ce\u9669\u4fe1\u53f7\uff0c\u505a\u51fa\u66f4\u4e3b\u52a8\u7684\u5e72\u9884\u51b3\u7b56\u3002", "categories": ["cs.AI", "cs.CL", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05695", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7ef4\u62a4\u7d27\u51d1\u7684\u5faa\u73af\u6f5c\u5728\u72b6\u6001\uff0c\u5efa\u6a21\u667a\u80fd\u4f53\u8f68\u8ff9\u4e2d\u98ce\u9669\u968f\u65f6\u95f4\u7684\u53d8\u5316", "\u540c\u65f6\u9884\u6d4b\u5373\u65f6\u5371\u9669\u8bc1\u636e\u4e0e\u591a\u6b65\u524d\u7f00\u98ce\u9669\uff0c\u5f25\u8865\u4ec5\u8bc4\u4f30\u5f53\u524d\u52a8\u4f5c\u7684\u53cd\u5e94\u5f0f\u62a4\u680f\u76f2\u533a", "\u5728\u56db\u4e2a\u57fa\u51c6\u548c\u5728\u7ebf\u62a4\u680f\u8bc4\u6d4b\u4e2d\u4f18\u4e8e\u901a\u7528\u3001\u53cd\u5e94\u5f0f\u548c\u4e3b\u52a8\u5f0f\u57fa\u7ebf\uff0c\u5e73\u5747\u7aef\u5230\u7aef\u5ef6\u8fdf\u7ea625\u6beb\u79d2/\u6b21"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u62a4\u680f", "\u4e16\u754c\u6a21\u578b", "\u98ce\u9669\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05695v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DreamGuard: Efficient Runtime Guardrail for LLM Agents via Risk-Aware World Model", "tldr": "\u7528\u98ce\u9669\u4e16\u754c\u6a21\u578b\u63d0\u524d\u62e6\u622aLLM\u667a\u80fd\u4f53\u5371\u9669\u884c\u4e3a", "upvotes": 0, "what_it_is": "DreamGuard \u662f\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8fd0\u884c\u65f6\u5b89\u5168\u62a4\u680f\uff0c\u901a\u8fc7\u98ce\u9669\u611f\u77e5\u4e16\u754c\u6a21\u578b\u8ddf\u8e2a\u4ea4\u4e92\u8f68\u8ff9\u4e2d\u7684\u6f5c\u5728\u98ce\u9669\u6f14\u5316\u3002\u5b83\u5728\u52a8\u4f5c\u6267\u884c\u524d\u7ed3\u5408\u5373\u65f6\u5371\u9669\u4e0e\u957f\u671f\u524d\u7f00\u98ce\u9669\u4fe1\u53f7\uff0c\u505a\u51fa\u66f4\u4e3b\u52a8\u7684\u5e72\u9884\u51b3\u7b56\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u4e16\u754c\u6a21\u578b\u5f15\u5165LLM\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u5b89\u5168\uff0c\u9488\u5bf9\u957f\u7a0b\u98ce\u9669\u7d2f\u79ef\u95ee\u9898\u63d0\u4f9b\u4f4e\u5ef6\u8fdf\u3001\u53ef\u5728\u7ebf\u90e8\u7f72\u7684\u9632\u62a4\u673a\u5236\uff0c\u6709\u671b\u63d0\u5347\u5de5\u5177\u8c03\u7528\u548c\u771f\u5b9e\u7cfb\u7edf\u4ea4\u4e92\u573a\u666f\u4e0b\u7684\u5b89\u5168\u6027\u3002"}, {"abstract": "Autonomous mobile GUI agents require accurate action reflection for reliable long-horizon execution. Existing approaches rely on open-ended multimodal reasoning after each action, which is costly and poorly matched to the structured nature of GUI state transitions. We propose StepReflect, which formulates per-step GUI reflection as supervised structured prediction conditioned on explicit transition specifications and paired visual evidence. StepReflect is trained through a staged pipeline combining supervised fine-tuning, teacher-student distillation, and preference- and reward-based refinement. Offline, the resulting 8B model achieves 82.16% transition-level accuracy on AndroidWorld, exceeding zero-shot GPT-5.2 by 11.83 percentage points under the same structured input. Online, across M3A, Agent-SAMA, MAI-UI-8B, and Seed-2.0-Pro, StepReflect achieves higher task success in three of four agent configurations and remains within one successful task of the GPT-5.2 Reflection Agent in the fourth. It also reduces paid API charges relative to GPT-based reflection in all four configurations. These results establish StepReflect as a practical, locally deployable alternative to repeated frontier-model reflection for long-horizon mobile GUI agents.", "arxiv_id": "2608.05587", "arxiv_url": "https://arxiv.org/abs/2608.05587", "authors": ["Linqiang Guo", "Wei Liu", "Li Gu", "Yang Wang", "Tse-Hsun", "Chen"], "brief": "StepReflect \u5c06\u79fb\u52a8GUI\u667a\u80fd\u4f53\u7684\u9010\u6b65\u52a8\u4f5c\u53cd\u601d\u5efa\u6a21\u4e3a\u76d1\u7763\u5f0f\u7ed3\u6784\u5316\u9884\u6d4b\uff0c\u57fa\u4e8e\u663e\u5f0f\u72b6\u6001\u8f6c\u79fb\u89c4\u8303\u4e0e\u6210\u5bf9\u89c6\u89c9\u8bc1\u636e\u5224\u65ad\u52a8\u4f5c\u6548\u679c\u3002\u5b83\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u3001\u6559\u5e08-\u5b66\u751f\u84b8\u998f\u3001\u504f\u597d\u4e0e\u5956\u52b1\u4f18\u5316\u8bad\u7ec3\u51fa\u53ef\u672c\u5730\u90e8\u7f72\u76848B\u53cd\u601d\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05587", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728 AndroidWorld \u79bb\u7ebf\u8bc4\u6d4b\u4e2d\u8fbe\u523082.16%\u8f6c\u79fb\u7ea7\u51c6\u786e\u7387\uff0c\u6bd4\u76f8\u540c\u7ed3\u6784\u5316\u8f93\u5165\u4e0b\u7684\u96f6\u6837\u672c GPT-5.2 \u9ad811.83\u4e2a\u767e\u5206\u70b9", "\u5728\u7ebf\u63a5\u5165 M3A\u3001Agent-SAMA\u3001MAI-UI-8B\u3001Seed-2.0-Pro \u540e\uff0c\u56db\u79cd\u914d\u7f6e\u4e2d\u4e09\u79cd\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387", "\u76f8\u6bd4\u53cd\u590d\u8c03\u7528 GPT \u8fdb\u884c\u52a8\u4f5c\u53cd\u601d\uff0c\u56db\u79cd\u914d\u7f6e\u4e0b\u5747\u964d\u4f4e\u4ed8\u8d39API\u6210\u672c"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u591a\u6a21\u6001", "\u7ed3\u6784\u5316\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05587v1", "published_at": "2026-08-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "StepReflect: Structured UI Transition Reflection for Mobile GUI Agents", "tldr": "\u7ed3\u6784\u5316\u53cd\u601d\u63d0\u5347\u79fb\u52a8GUI\u667a\u80fd\u4f53\u6267\u884c", "upvotes": 0, "what_it_is": "StepReflect \u5c06\u79fb\u52a8GUI\u667a\u80fd\u4f53\u7684\u9010\u6b65\u52a8\u4f5c\u53cd\u601d\u5efa\u6a21\u4e3a\u76d1\u7763\u5f0f\u7ed3\u6784\u5316\u9884\u6d4b\uff0c\u57fa\u4e8e\u663e\u5f0f\u72b6\u6001\u8f6c\u79fb\u89c4\u8303\u4e0e\u6210\u5bf9\u89c6\u89c9\u8bc1\u636e\u5224\u65ad\u52a8\u4f5c\u6548\u679c\u3002\u5b83\u901a\
