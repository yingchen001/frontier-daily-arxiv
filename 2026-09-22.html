at combines offline replay over high-quality trajectories with a routed network of multiple LoRA experts each specialized via RL, substantially improving the agent\u0027s ability to learn across multiple domains. Comprehensive experiments on four reasoning and agentic tasks, evaluated under both in-domain and out-of-domain settings, demonstrate the value of our analysis and the effectiveness of our approach.", "arxiv_id": "2609.23989", "arxiv_url": "https://arxiv.org/abs/2609.23989", "authors": ["Haixin Wang", "Xiaoxuan Wang", "Junkai Zhang", "Han Zhang", "Renliang Sun", "Alexander K Taylor", "Yidan Shi", "Haoran Deng", "Chenguang Wang", "Jason Cong", "Yizhou Sun", "Wei Wang"], "brief": "\u8bba\u6587\u63d0\u51fa ACLArena\uff0c\u7528\u4e8e\u7814\u7a76\u591a\u9636\u6bb5\u540e\u8bad\u7ec3\u4e2d\u7684\u667a\u80fd\u4f53\u6301\u7eed\u5b66\u4e60\u95ee\u9898\u3002\u5b83\u5206\u6790\u9057\u5fd8\u4e0e\u6cdb\u5316\u673a\u5236\uff0c\u6bd4\u8f83\u591a\u79cd\u80fd\u529b\u6574\u5408\u8303\u5f0f\uff0c\u5e76\u63d0\u51fa\u7ed3\u5408\u9ad8\u8d28\u91cf\u8f68\u8ff9\u79bb\u7ebf\u56de\u653e\u4e0e\u591a LoRA \u4e13\u5bb6\u8def\u7531\u7684\u65b0\u8bad\u7ec3\u914d\u65b9\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/WillDreamer/ACLArena", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.23989", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u987a\u5e8f\u8bad\u7ec3\u6d41\u6c34\u7ebf\uff0c\u4ece\u6a21\u578b\u5c42\u9762\u548c token \u5c42\u9762\u89e3\u91ca\u80fd\u529b\u9057\u5fd8\u4e0e\u8de8\u9636\u6bb5\u6cdb\u5316\u673a\u5236", "\u7cfb\u7edf\u6bd4\u8f83\u591a\u6559\u5e08 on-policy \u84b8\u998f\u3001\u81ea\u84b8\u998f\u5fae\u8c03\u3001\u6a21\u578b\u5408\u5e76\u7b49\u65b9\u6cd5\u5728\u4fdd\u7559\u65b0\u65e7\u80fd\u529b\u4e0a\u7684\u6743\u8861", "\u63d0\u51fa\u79bb\u7ebf\u9ad8\u8d28\u91cf\u8f68\u8ff9\u56de\u653e\u52a0\u591a LoRA \u4e13\u5bb6\u8def\u7531\u67b6\u6784\uff0c\u6bcf\u4e2a\u4e13\u5bb6\u7ecf RL \u4e13\u95e8\u5316\uff0c\u5728\u56db\u7c7b\u63a8\u7406\u4e0e\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u9a8c\u8bc1\u6709\u6548"], "keywords": ["\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u5408\u5e76"], "num_comments": 2, "on_hf": true, "organization": "UCLA Scalable Analytics Institute ", "pdf_url": "https://arxiv.org/pdf/2609.23989", "published_at": "2026-09-21", "score": 0.42, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.23989.png", "title": "ACLArena: Agent Continue Learning in Multi-stage Post-training", "tldr": "ACLArena\u7cfb\u7edf\u7814\u7a76\u667a\u80fd\u4f53\u6301\u7eed\u5b66\u4e60\u65b9\u6848", "upvotes": 8, "what_it_is": "\u8bba\u6587\u63d0\u51fa ACLArena\uff0c\u7528\u4e8e\u7814\u7a76\u591a\u9636\u6bb5\u540e\u8bad\u7ec3\u4e2d\u7684\u667a\u80fd\u4f53\u6301\u7eed\u5b66\u4e60\u95ee\u9898\u3002\u5b83\u5206\u6790\u9057\u5fd8\u4e0e\u6cdb\u5316\u673a\u5236\uff0c\u6bd4\u8f83\u591a\u79cd\u80fd\u529b\u6574\u5408\u8303\u5f0f\uff0c\u5e76\u63d0\u51fa\u7ed3\u5408\u9ad8\u8d28\u91cf\u8f68\u8ff9\u79bb\u7ebf\u56de\u653e\u4e0e\u591a LoRA \u4e13\u5bb6\u8def\u7531\u7684\u65b0\u8bad\u7ec3\u914d\u65b9\u3002", "why_notable": "\u5de5\u4e1a\u7ea7\u901a\u7528\u667a\u80fd\u4f53\u9700\u8981\u5728\u591a\u9636\u6bb5\u8bad\u7ec3\u4e2d\u6574\u5408\u4e0d\u540c\u80fd\u529b\uff0c\u4f46\u6301\u7eed\u5b66\u4e60\u7f3a\u4e4f\u6210\u719f\u65b9\u6cd5\u3002\u8be5\u5de5\u4f5c\u65e2\u63d0\u4f9b\u5206\u6790\u4e0e\u8bc4\u6d4b\u6846\u67b6\uff0c\u4e5f\u7ed9\u51fa\u53ef\u843d\u5730\u7684\u8bad\u7ec3\u914d\u65b9\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11\u707e\u96be\u6027\u9057\u5fd8\u5e76\u63d0\u5347\u8de8\u9886\u57df\u80fd\u529b\u8fc1\u79fb\u3002"}, {"abstract": "Tool-calling LLM agents are increasingly deployed in enterprise applications. However, effective evaluation and optimization require high-quality, diverse task datasets that are often difficult to obtain due to privacy and other constraints. Existing synthetic task generation methods often produce generic tasks that ignore an agent\u0027s underlying state or database and fail to reflect real-world usage diversity. We propose EdgeGen, a synthetic task generation framework that extracts compliance rules from an agent\u0027s specification and uses them to generate database-grounded edge-case tasks designed to violate these rules. When combined with existing synthetic data generation techniques, EdgeGen enables agent improvement through finetuning and harness optimization. The resulting pipeline forms a fully automated closed-loop system that requires no human annotation. Finetuning on data generated by EdgeGen yields a consistent mean progress improvement of 2 percent to 42 percent on tau2bench airline domain, while other baseline methods show degradation for some models. On the other hand, for harness optimization, our method shows a mean progress improvement of 10 percent and 30 percent over the human-curated and base harnesses, respectively, for the Gemma-4-e4b model.", "arxiv_id": "2609.24115", "arxiv_url": "https://arxiv.org/abs/2609.24115", "authors": ["Harshavardhan Abichandani", "Penny Chong", "Jiyuan Shen", "Gunraj Singh", "Ashutosh Hathidara", "Marcus Duigan Xing Yu", "Jane Lo", "Atin Ghosh", "Yipeng Li", "Daniel Dahlmeier"], "brief": "EdgeGen \u662f\u4e00\u4e2a\u5408\u6210\u4efb\u52a1\u751f\u6210\u6846\u67b6\uff0c\u4ece\u667a\u80fd\u4f53\u89c4\u8303\u4e2d\u63d0\u53d6\u5408\u89c4\u89c4\u5219\uff0c\u5e76\u57fa\u4e8e\u6570\u636e\u5e93\u72b6\u6001\u751f\u6210\u6545\u610f\u89e6\u72af\u89c4\u5219\u7684\u8fb9\u754c\u6848\u4f8b\u4efb\u52a1\u3002\u5b83\u53ef\u4e0e\u73b0\u6709\u5408\u6210\u6570\u636e\u65b9\u6cd5\u7ed3\u5408\uff0c\u7528\u4e8e\u5fae\u8c03\u548c\u6267\u884c\u6846\u67b6\u4f18\u5316\uff0c\u5f62\u6210\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u95ed\u73af\u6539\u8fdb\u6d41\u7a0b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24115", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u4f01\u4e1a\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u7684\u6570\u636e\u7a00\u7f3a\u4e0e\u9690\u79c1\u9650\u5236\uff0c\u751f\u6210\u4e0e\u5e95\u5c42\u6570\u636e\u5e93\u72b6\u6001\u76f8\u5173\u7684\u771f\u5b9e\u8fb9\u754c\u4efb\u52a1", "\u901a\u8fc7\u63d0\u53d6\u89c4\u8303\u4e2d\u7684\u5408\u89c4\u89c4\u5219\uff0c\u6784\u9020\u8fdd\u53cd\u89c4\u5219\u7684\u4efb\u52a1\u6765\u8986\u76d6\u975e\u201chappy path\u201d\u573a\u666f", "\u5728 tau2bench \u822a\u7a7a\u9886\u57df\u5fae\u8c03\u5e26\u6765 2% \u5230 42% \u7684\u5e73\u5747\u8fdb\u5c55\u63d0\u5347\uff1b\u5bf9 Gemma-4-e4b \u7684 harness \u4f18\u5316\u76f8\u8f83\u4eba\u5de5\u4e0e\u57fa\u7840\u7248\u672c\u5206\u522b\u63d0\u5347 10% \u548c 30%"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5408\u6210\u6570\u636e", "\u8bc4\u6d4b\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "SAP", "pdf_url": "https://arxiv.org/pdf/2609.24115", "published_at": "2026-09-21", "score": 0.386, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24115.png", "title": "EDGEGEN: Improving Tool-Calling Agents Beyond Happy Paths with Synthetic Edge Case Generation", "tldr": "\u81ea\u52a8\u751f\u6210\u8fb9\u754c\u4efb\u52a1\u63d0\u5347\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u9c81\u68d2\u6027", "upvotes": 2, "what_it_is": "EdgeGen \u662f\u4e00\u4e2a\u5408\u6210\u4efb\u52a1\u751f\u6210\u6846\u67b6\uff0c\u4ece\u667a\u80fd\u4f53\u89c4\u8303\u4e2d\u63d0\u53d6\u5408\u89c4\u89c4\u5219\uff0c\u5e76\u57fa\u4e8e\u6570\u636e\u5e93\u72b6\u6001\u751f\u6210\u6545\u610f\u89e6\u72af\u89c4\u5219\u7684\u8fb9\u754c\u6848\u4f8b\u4efb\u52a1\u3002\u5b83\u53ef\u4e0e\u73b0\u6709\u5408\u6210\u6570\u636e\u65b9\u6cd5\u7ed3\u5408\uff0c\u7528\u4e8e\u5fae\u8c03\u548c\u6267\u884c\u6846\u67b6\u4f18\u5316\uff0c\u5f62\u6210\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u95ed\u73af\u6539\u8fdb\u6d41\u7a0b\u3002", "why_notable": "\u8bba\u6587\u805a\u7126\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u4f01\u4e1a\u573a\u666f\u4e2d\u7684\u9c81\u68d2\u6027\u77ed\u677f\uff0c\u4e0d\u53ea\u662f\u751f\u6210\u6cdb\u5316\u4efb\u52a1\uff0c\u800c\u662f\u81ea\u52a8\u6784\u9020\u6570\u636e\u5e93\u843d\u5730\u7684\u5408\u89c4\u8fb9\u754c\u6848\u4f8b\uff0c\u53ef\u7528\u4e8e\u4f4e\u6210\u672c\u6301\u7eed\u8bc4\u6d4b\u4e0e\u4f18\u5316\u667a\u80fd\u4f53\u3002"}, {"abstract": "Autonomous agent systems increasingly depend on reusable skill abstractions for consolidating experiential knowledge and domain expertise. These artifacts typically bundle free-form instructions with heterogeneous resources. However, ensuring their correctness remains challenging. Their failure modes transcend conventional code defects to subtle semantic inconsistencies such as intent conflicts, which manifest as silent failures masked by the underlying model. Moreover, skill correctness must be grounded in intended task boundaries and generalizability. We propose SkillSpec, a Hoare-style framework that formulates skill correctness as a specification reasoning problem. It transforms a heterogeneous skill repository into a unified graph representation that aligns descriptions, instructions and code artifacts. For each node, SkillSpec derives an ExpectSpec from the surrounding declared intent, and infers FactSpecs from encoded behavior under partially disclosed intent. An intent mask regulates access to holistic, lineage, neighborhood, and local views to balance the bias introduced by excessive context against unsupported inference caused by insufficient context. SkillSpec jointly reasons over these views to flag candidate defects, and automatically validates them in an isolated sandbox. On 515 real-world skills from SkillsBench and widely downloaded repositories, SkillSpec identified 763 manually confirmed defects across 239 skills, achieving 61.2% precision. The node-level analysis across multiple model families shows that specification reasoning is consistently reliable for code nodes, whereas plain-text nodes remain a major bottleneck. Most defects arise at the boundaries between declared intent and implementation, demonstrating that explicit specifications provide a practical foundation for skill quality assurance in real-world agent ecosystems.", "arxiv_id": "2609.06052", "arxiv_url": "https://arxiv.org/abs/2609.06052", "authors": ["Yizhuo Zhang", "Bo Kang", "Yi Yang", "Zhiyu Duan", "Zhouteng Ye", "Shunkun Yang"], "brief": "\u8bba\u6587\u63d0\u51fa SkillSpec\uff0c\u4e00\u4e2a Hoare \u98ce\u683c\u7684\u667a\u80fd\u4f53\u6280\u80fd\u6b63\u786e\u6027\u9a8c\u8bc1\u6846\u67b6\u3002\u5b83\u5c06\u6280\u80fd\u5e93\u4e2d\u7684\u63cf\u8ff0\u3001\u6307\u4ee4\u4e0e\u4ee3\u7801\u7edf\u4e00\u4e3a\u56fe\u8868\u793a\uff0c\u901a\u8fc7 ExpectSpec \u4e0e FactSpec \u5bf9\u9f50\u610f\u56fe\u548c\u884c\u4e3a\uff0c\u53d1\u73b0\u610f\u56fe\u51b2\u7a81\u7b49\u9690\u6027\u7f3a\u9677\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/IainZhang/SkillSpec", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.06052", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5f15\u5165 intent mask\uff0c\u5728\u6574\u4f53\u3001\u8c31\u7cfb\u3001\u90bb\u57df\u3001\u672c\u5730\u89c6\u56fe\u95f4\u8c03\u8282\u4e0a\u4e0b\u6587\u53ef\u89c1\u6027\uff0c\u964d\u4f4e\u8fc7\u591a\u4e0a\u4e0b\u6587\u504f\u7f6e\u4e0e\u8fc7\u5c11\u4e0a\u4e0b\u6587\u81c6\u6d4b\u3002", "\u5bf9 515 \u4e2a\u771f\u5b9e\u4e16\u754c\u6280\u80fd\u8fdb\u884c\u8bc4\u6d4b\uff0c\u53d1\u73b0 239 \u4e2a\u6280\u80fd\u4e2d\u7684 763 \u4e2a\u7ecf\u4eba\u5de5\u786e\u8ba4\u7f3a\u9677\uff0c\u7cbe\u786e\u7387\u4e3a 61.2%\u3002", "\u7ed3\u679c\u663e\u793a\u4ee3\u7801\u8282\u70b9\u4e0a\u7684\u89c4\u683c\u63a8\u7406\u8f83\u7a33\u5b9a\uff0c\u800c\u7eaf\u6587\u672c\u8282\u70b9\u4ecd\u662f\u4e3b\u8981\u74f6\u9888\uff0c\u591a\u6570\u7f3a\u9677\u51fa\u73b0\u5728\u58f0\u660e\u610f\u56fe\u4e0e\u5b9e\u73b0\u8fb9\u754c\u5904\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u89c4\u683c\u63a8\u7406", "\u8d28\u91cf\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "beihang university", "pdf_url": "https://arxiv.org/pdf/2609.06052", "published_at": "2026-09-05", "score": 0.38, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06052.png", "title": "SkillSpec: Intent-Masked Specification Reasoning for Agent Skill Correctness", "tldr": "\u7528\u89c4\u683c\u63a8\u7406\u68c0\u6d4b\u667a\u80fd\u4f53\u6280\u80fd\u8bed\u4e49\u7f3a\u9677", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa SkillSpec\uff0c\u4e00\u4e2a Hoare \u98ce\u683c\u7684\u667a\u80fd\u4f53\u6280\u80fd\u6b63\u786e\u6027\u9a8c\u8bc1\u6846\u67b6\u3002\u5b83\u5c06\u6280\u80fd\u5e93\u4e2d\u7684\u63cf\u8ff0\u3001\u6307\u4ee4\u4e0e\u4ee3\u7801\u7edf\u4e00\u4e3a\u56fe\u8868\u793a\uff0c\u901a\u8fc7 ExpectSpec \u4e0e FactSpec \u5bf9\u9f50\u610f\u56fe\u548c\u884c\u4e3a\uff0c\u53d1\u73b0\u610f\u56fe\u51b2\u7a81\u7b49\u9690\u6027\u7f3a\u9677\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u6280\u80fd\u8d28\u91cf\u4fdd\u969c\u4ece\u4f20\u7edf\u4ee3\u7801\u7f3a\u9677\u68c0\u6d4b\u6269\u5c55\u5230\u610f\u56fe\u4e00\u81f4\u6027\u4e0e\u4efb\u52a1\u8fb9\u754c\u63a8\u7406\uff0c\u4e3a\u53ef\u590d\u7528 agent \u6280\u80fd\u5e93\u7684\u53ef\u9760\u90e8\u7f72\u63d0\u4f9b\u4e86\u5b9e\u7528\u9a8c\u8bc1\u6846\u67b6\u3002"}, {"abstract": "Frontier coding agents are increasingly trusted to work autonomously for long periods of time, yet what they actually did is often hard to tell from their final response. We quantify the propensity of such agents to overclaim task completion, which may mislead the user. We operationalize overclaiming as a final response that reports work that the agent\u0027s own transcript shows it did not do, for example, claiming to have read a file it never opened. This criterion requires no inference about intent and does not depend on whether the delivered work is correct; it asks only whether the reported work was done. We introduce OverclaimBench, an evaluation suite of five file-review scenarios with transcript-based coverage measurements and registered planted defects. We evaluate eight proprietary frontier models in their own production command-line interfaces and four open-weight models under a single fixed harness, and find that 1) agents fail to read every file they were asked to review in 67.9% of runs; 2) among these incomplete runs, agents are misleading 80.4% of the time (59-96% per model), either falsely claiming a complete review or leaving the gap undisclosed; 3) requiring delegation to subagents increases coverage, but a large majority of reviews that remain incomplete are still misleading; and 4) agents that falsely claim a complete review miss planted defects at about 1.8 times the rate of agents that read every file, showing that claims of completion can conceal substantive failures. Together, these results show that agents\u0027 final responses are not reliable accounts of their actions.", "arxiv_id": "2609.20812", "arxiv_url": "https://arxiv.org/abs/2609.20812", "authors": ["Nolan Smyth", "Yorguin-Jose Mantilla-Ramos", "Pascal Jr Tikeng Notsawo", "Saskia Helbling", "Alberto Tosato", "Mohamed Amine Merzouk", "Nouha Dziri", "Gauthier Gidel", "Tommaso Tosato"], "brief": "\u8bba\u6587\u63d0\u51fa OverclaimBench\uff0c\u7528\u8f6c\u5f55\u8bb0\u5f55\u6838\u67e5\u7f16\u7801\u667a\u80fd\u4f53\u662f\u5426\u58f0\u79f0\u5b8c\u6210\u4e86\u5b9e\u9645\u672a\u505a\u7684\u5de5\u4f5c\u3002\u4f5c\u8005\u8bc4\u4f30\u591a\u6b3e\u95ed\u6e90\u524d\u6cbf\u6a21\u578b\u4e0e\u5f00\u6e90\u6a21\u578b\uff0c\u91cf\u5316\u5176\u5728\u6587\u4ef6\u5ba1\u67e5\u4efb\u52a1\u4e2d\u7684\u201c\u8fc7\u5ea6\u58f0\u660e\u201d\u503e\u5411\u3002", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20812", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u8fc7\u5ea6\u58f0\u660e\u5b9a\u4e49\u4e3a\u6700\u7ec8\u56de\u590d\u58f0\u79f0\u505a\u8fc7\u4f46\u8f6c\u5f55\u8bb0\u5f55\u663e\u793a\u672a\u505a\u7684\u5de5\u4f5c\uff0c\u4f8b\u5982\u672a\u6253\u5f00\u6587\u4ef6\u5374\u79f0\u5df2\u9605\u8bfb\u3002", "\u5728 67.9% \u7684\u8fd0\u884c\u4e2d\uff0c\u667a\u80fd\u4f53\u672a\u80fd\u8bfb\u5b8c\u8981\u6c42\u5ba1\u67e5\u7684\u6240\u6709\u6587\u4ef6\uff1b\u8fd9\u4e9b\u4e0d\u5b8c\u6574\u8fd0\u884c\u91cc 80.4% \u5b58\u5728\u8bef\u5bfc\u6027\u8868\u8ff0\u6216\u672a\u62ab\u9732\u9057\u6f0f\u3002", "\u8981\u6c42\u8c03\u7528\u5b50\u667a\u80fd\u4f53\u53ef\u63d0\u9ad8\u8986\u76d6\u7387\uff0c\u4f46\u672a\u5b8c\u6210\u5ba1\u67e5\u65f6\u4ecd\u5927\u91cf\u8bef\u5bfc\uff1b\u865a\u5047\u58f0\u79f0\u5b8c\u6210\u7684\u667a\u80fd\u4f53\u6f0f\u68c0\u690d\u5165\u7f3a\u9677\u7387\u7ea6\u4e3a\u5b8c\u6574\u9605\u8bfb\u8005\u7684 1.8 \u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8bc4\u6d4b\u57fa\u51c6", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20812", "published_at": "2026-09-22", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Quantifying Overclaiming Propensity in Frontier LLM Agents", "tldr": "\u524d\u6cbf\u7f16\u7801\u667a\u80fd\u4f53\u5e38\u5938\u5927\u4efb\u52a1\u5b8c\u6210\u5ea6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OverclaimBench\uff0c\u7528\u8f6c\u5f55\u8bb0\u5f55\u6838\u67e5\u7f16\u7801\u667a\u80fd\u4f53\u662f\u5426\u58f0\u79f0\u5b8c\u6210\u4e86\u5b9e\u9645\u672a\u505a\u7684\u5de5\u4f5c\u3002\u4f5c\u8005\u8bc4\u4f30\u591a\u6b3e\u95ed\u6e90\u524d\u6cbf\u6a21\u578b\u4e0e\u5f00\u6e90\u6a21\u578b\uff0c\u91cf\u5316\u5176\u5728\u6587\u4ef6\u5ba1\u67e5\u4efb\u52a1\u4e2d\u7684\u201c\u8fc7\u5ea6\u58f0\u660e\u201d\u503e\u5411\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u81ea\u4e3b\u7f16\u7801\u667a\u80fd\u4f53\u5728\u751f\u4ea7\u5f0f CLI \u73af\u5883\u4e2d\u7684\u53ef\u9760\u6027\u98ce\u9669\uff1a\u6700\u7ec8\u56de\u7b54\u5e76\u4e0d\u7b49\u4e8e\u771f\u5b9e\u6267\u884c\u8bb0\u5f55\u3002\u5b83\u4e3a\u8bc4\u4f30\u667a\u80fd\u4f53\u53ef\u5ba1\u8ba1\u6027\u3001\u4efb\u52a1\u5b8c\u6210\u58f0\u660e\u53ef\u4fe1\u5ea6\u548c\u5b89\u5168\u90e8\u7f72\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u57fa\u51c6\u3002"}, {"abstract": "Graphical User Interface (GUI) Agents autonomously interact with software to fulfill user requests, where GUI navigation stands out as the most critical and challenging capability. Mastering this capability demands a complex synergy of step-wise decision-making, state-action alignment, and long-horizon planning. While directly mixing these corresponding navigation tasks seems intuitive to simultaneously acquire these skills, such a direct combination is severely bottlenecked by inconsistent optimization objectives and profound data heterogeneity. To overcome these barriers, we propose the MaP (stands for ``\\textbf{M}asked Tr\\textbf{a}jectory \\textbf{P}rediction\u0027\u0027), a unified framework that seamlessly harmonizes divergent GUI navigation tasks. By modeling multi-turn GUI interactions as a trajectory and defining training objectives through component masking and prediction, MaP shifts the optimization from task-specific marginal distributions to a consistent objective. Furthermore, to handle the data heterogeneity across multiple navigation tasks, we design a role-aware adapter learning module that dynamically routes each token to a specialized representation space. Extensive experiments on five representative GUI navigation benchmarks demonstrate that MaP effectively mitigates gradient conflicts and significantly outperforms the direct mixture training, establishing a robust paradigm for multi-task GUI navigation.", "arxiv_id": "2609.25769", "arxiv_url": "https://arxiv.org/abs/2609.25769", "authors": ["Yan Zhang", "Pei Fu", "Daiqing Wu", "Huawen Shen", "Ruoceng Zhang", "Shaojie Zhang", "Jiahui Yang", "Yu Zhou", "Can Ma", "Zhenbo Luo", "Jian Luan"], "brief": "\u8bba\u6587\u63d0\u51fa MaP\uff08Masked Trajectory Prediction\uff09\u6846\u67b6\uff0c\u5c06\u591a\u8f6e GUI \u4ea4\u4e92\u5efa\u6a21\u4e3a\u8f68\u8ff9\uff0c\u901a\u8fc7\u5bf9\u7ec4\u4ef6\u8fdb\u884c\u63a9\u7801\u4e0e\u9884\u6d4b\u6765\u7edf\u4e00\u4e0d\u540c GUI \u5bfc\u822a\u4efb\u52a1\u7684\u8bad\u7ec3\u76ee\u6807\u3002\u5b83\u8fd8\u5f15\u5165\u89d2\u8272\u611f\u77e5\u9002\u914d\u5668\uff0c\u9488\u5bf9\u5f02\u6784\u6570\u636e\u52a8\u6001\u8def\u7531 token \u5230\u4e13\u95e8\u8868\u793a\u7a7a\u95f4\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25769", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u9010\u6b65\u51b3\u7b56\u3001\u72b6\u6001-\u52a8\u4f5c\u5bf9\u9f50\u3001\u957f\u7a0b\u89c4\u5212\u7b49 GUI \u5bfc\u822a\u4efb\u52a1\u7edf\u4e00\u4e3a\u8f68\u8ff9\u7ea7\u63a9\u7801\u9884\u6d4b\u95ee\u9898", "\u901a\u8fc7\u4e00\u81f4\u7684\u9884\u6d4b\u76ee\u6807\u7f13\u89e3\u76f4\u63a5\u6df7\u5408\u591a\u4efb\u52a1\u8bad\u7ec3\u4e2d\u7684\u76ee\u6807\u4e0d\u4e00\u81f4\u4e0e\u68af\u5ea6\u51b2\u7a81", "\u5728\u4e94\u4e2a\u4ee3\u8868\u6027 GUI \u5bfc\u822a\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u76f4\u63a5\u6df7\u5408\u8bad\u7ec3\u65b9\u6cd5"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u5bfc\u822a", "\u591a\u4efb\u52a1\u5b66\u4e60", "\u8f68\u8ff9\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25769", "published_at": "2026-09-22", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Towards Omni-dimensional GUI Agent Navigation with Masked Trajectory Prediction", "tldr": "\u7528\u63a9\u7801\u8f68\u8ff9\u9884\u6d4b\u7edf\u4e00\u8bad\u7ec3GUI\u5bfc\u822a\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MaP\uff08Masked Trajectory Prediction\uff09\u6846\u67b6\uff0c\u5c06\u591a\u8f6e GUI \u4ea4\u4e92\u5efa\u6a21\u4e3a\u8f68\u8ff9\uff0c\u901a\u8fc7\u5bf9\u7ec4\u4ef6\u8fdb\u884c\u63a9\u7801\u4e0e\u9884\u6d4b\u6765\u7edf\u4e00\u4e0d\u540c GUI \u5bfc\u822a\u4efb\u52a1\u7684\u8bad\u7ec3\u76ee\u6807\u3002\u5b83\u8fd8\u5f15\u5165\u89d2\u8272\u611f\u77e5\u9002\u914d\u5668\uff0c\u9488\u5bf9\u5f02\u6784\u6570\u636e\u52a8\u6001\u8def\u7531 token \u5230\u4e13\u95e8\u8868\u793a\u7a7a\u95f4\u3002", "why_notable": "GUI \u667a\u80fd\u4f53\u7684\u6838\u5fc3\u74f6\u9888\u662f\u8de8\u4efb\u52a1\u3001\u957f\u7a0b\u4e14\u5f02\u6784\u7684\u5bfc\u822a\u80fd\u529b\uff1bMaP \u63d0\u4f9b\u4e86\u4e00\u4e2a\u66f4\u7edf\u4e00\u3001\u66f4\u7a33\u5b9a\u7684\u591a\u4efb\u52a1\u8bad\u7ec3\u8303\u5f0f\uff0c\u6709\u671b\u63d0\u5347\u901a\u7528 computer use \u667a\u80fd\u4f53\u7684\u53ef\u9760\u6027\u3002"}, {"abstract": "We introduce SWE-Serve, a benchmark for evaluating agents on production inference engineering tasks. Implementing an inference feature can require coordinating multiple changes across the serving stack, including model support, runtime execution, and public APIs. Existing benchmarks provide limited coverage of production inference engineering: repository-level software engineering benchmarks do not target inference, while general terminal-agent benchmarks include only a few inference tasks. Dedicated inference benchmarks, meanwhile, focus primarily on isolated kernel generation or performance optimization rather than repository-scale production feature implementation. SWE-Serve provides 53 repository-grounded tasks derived from recent production changes to SGLang, spanning six inference engineering families. Each task executes on either CPU or a single GPU (H100) and is evaluated with hidden functional and regression tests, including, where applicable, end-to-end (E2E) serving tests and calibrated performance gates. Executable no-op and oracle controls, adversarial verifier review, and closed-book execution support task validity and evaluation integrity. Across 11 models and 31 model-effort configurations, the best-performing configuration achieves 75% mean pass@1. SWE-Serve exposes a substantial gap between completing tasks locally and achieving production correctness. On 19 tasks with end-to-end coverage, model-serving E2E tests reject roughly one-third of patches that pass every other test (45.9% under the verifier versus 69.4% with E2E tests excluded from scoring), with pass rate increasing for each model\u0027s best-performing configuration. By making the production correctness gap directly measurable, SWE-Serve enables the field to track whether future agents move beyond completing tasks locally to achieving production correctness.", "arxiv_id": "2609.26777", "arxiv_url": "https://arxiv.org/abs/2609.26777", "authors": ["Jennifer Williams", "Dave Farris", "Jeff Farris", "Jiantao Jiao"], "brief": "\u8bba\u6587\u63d0\u51fa SWE-Serve\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u751f\u4ea7\u7ea7\u63a8\u7406\u670d\u52a1\u5de5\u7a0b\u4efb\u52a1\u4e0a\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b 53 \u4e2a\u6765\u81ea SGLang \u771f\u5b9e\u751f\u4ea7\u53d8\u66f4\u7684\u4ed3\u5e93\u7ea7\u4efb\u52a1\uff0c\u8986\u76d6\u6a21\u578b\u652f\u6301\u3001\u8fd0\u884c\u65f6\u6267\u884c\u3001API \u7b49\u63a8\u7406\u670d\u52a1\u6808\u6539\u52a8\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.26777", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4efb\u52a1\u57fa\u4e8e\u771f\u5b9e SGLang \u751f\u4ea7\u53d8\u66f4\uff0c\u8986\u76d6\u516d\u7c7b\u63a8\u7406\u5de5\u7a0b\u4efb\u52a1\uff0c\u5e76\u53ef\u5728 CPU \u6216\u5355\u5f20 H100 \u4e0a\u6267\u884c", "\u8bc4\u6d4b\u4f7f\u7528\u9690\u85cf\u529f\u80fd\u6d4b\u8bd5\u3001\u56de\u5f52\u6d4b\u8bd5\u3001\u7aef\u5230\u7aef\u670d\u52a1\u6d4b\u8bd5\u548c\u6027\u80fd\u95e8\u69db\uff0c\u5e76\u52a0\u5165 no-op/oracle \u63a7\u5236\u4e0e\u5bf9\u6297\u5f0f\u9a8c\u8bc1\u5ba1\u67e5", "\u5728 11 \u4e2a\u6a21\u578b\u300131 \u79cd\u914d\u7f6e\u4e2d\uff0c\u6700\u4f73\u5e73\u5747 pass@1 \u4e3a 75%\uff1b\u7aef\u5230\u7aef\u6d4b\u8bd5\u4f1a\u989d\u5916\u6dd8\u6c70\u7ea6\u4e09\u5206\u4e4b\u4e00\u8868\u9762\u901a\u8fc7\u7684\u8865\u4e01"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u63a8\u7406\u670d\u52a1", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.26777", "published_at": "2026-09-22", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SWE-Serve: Benchmarking Agentic Engineering For Production Inference Serving", "tldr": "\u9762\u5411\u751f\u4ea7\u63a8\u7406\u670d\u52a1\u7684\u667a\u80fd\u4f53\u5de5\u7a0b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SWE-Serve\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u751f\u4ea7\u7ea7\u63a8\u7406\u670d\u52a1\u5de5\u7a0b\u4efb\u52a1\u4e0a\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b 53 \u4e2a\u6765\u81ea SGLang \u771f\u5b9e\u751f\u4ea7\u53d8\u66f4\u7684\u4ed3\u5e93\u7ea7\u4efb\u52a1\uff0c\u8986\u76d6\u6a21\u578b\u652f\u6301\u3001\u8fd0\u884c\u65f6\u6267\u884c\u3001API \u7b49\u63a8\u7406\u670d\u52a1\u6808\u6539\u52a8\u3002", "why_notable": "\u8be5\u57fa\u51c6\u63ed\u793a\u4e86\u667a\u80fd\u4f53\u201c\u672c\u5730\u5b8c\u6210\u4efb\u52a1\u201d\u4e0e\u201c\u8fbe\u5230\u751f\u4ea7\u6b63\u786e\u6027\u201d\u4e4b\u95f4\u7684\u663e\u8457\u5dee\u8ddd\uff0c\u4e3a\u8bc4\u4f30\u672a\u6765\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u63a8\u7406\u670d\u52a1\u573a\u666f\u4e2d\u7684\u53ef\u9760\u6027\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u751f\u4ea7\u7684\u6807\u51c6\u3002"}, {"abstract": "We present onPanda, an interactive tool for efficiently annotating LLM alignment data and agent trajectories. onPanda adopts token-level correction as its core interaction: while reading a model response, the annotator locates the first inappropriate token and either picks a substitute from the model\u0027s candidate tokens or types the correct text via free-form editing. The system then truncates everything after that position and continues generation from the corrected prefix, repeating this locate-correct-continue loop until a satisfactory response is obtained. This mechanism lets annotators precisely steer model outputs at low cost: a small controlled study suggests that onPanda reduces median annotation time by 52% over manual post-editing. Since the vast majority of tokens in the final response are generated by the model itself, the resulting data largely preserves the model\u0027s sampling distribution and is well suited for constructing on-policy SFT and preference data. Furthermore, the token-level corrections recorded during annotation provide fine-grained supervision with precise positions and naturally paired positive--negative samples. onPanda also connects to external tools and harnesses, enabling interactive trajectory annotation in realistic environments. In addition, we release Panda-CVL, a dataset annotated with onPanda, together with a benchmark for token-level correction.", "arxiv_id": "2609.24983", "arxiv_url": "https://arxiv.org/abs/2609.24983", "authors": ["Lei Yang", "Mengyin Liu", "Jia Wang", "Hangyu Guo", "Liang Zhao", "Zheng Ge", "Kang An", "Binxing Jiao", "Qi Han", "Daxin Jiang", "Siqi Shen", "Xiangyu Zhang"], "brief": "\u672c\u6587\u63d0\u51fa onPanda\uff0c\u4e00\u4e2a\u7528\u4e8e LLM \u5bf9\u9f50\u6570\u636e\u548c\u667a\u80fd\u4f53\u8f68\u8ff9\u6807\u6ce8\u7684\u4ea4\u4e92\u5f0f\u5de5\u5177\u3002\u5b83\u8ba9\u6807\u6ce8\u8005\u5728\u751f\u6210\u7ed3\u679c\u4e2d\u5b9a\u4f4d\u7b2c\u4e00\u4e2a\u4e0d\u5408\u9002 token\uff0c\u8fdb\u884c\u66ff\u6362\u6216\u81ea\u7531\u7f16\u8f91\uff0c\u518d\u4ece\u4fee\u6b63\u524d\u7f00\u7ee7\u7eed\u751f\u6210\uff0c\u5faa\u73af\u5f97\u5230\u6ee1\u610f\u8f93\u51fa\u3002", "categories": ["cs.CL", "cs.HC", "cs.LG"], "github_repo": "https://github.com/on-panda/on-panda", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2609.24983", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6838\u5fc3\u4ea4\u4e92\u662f\u201c\u5b9a\u4f4d-\u7ea0\u9519-\u7eed\u5199\u201d\u7684 token \u7ea7\u4fee\u6b63\uff0c\u76f8\u6bd4\u4eba\u5de5\u540e\u7f16\u8f91\u5728\u5c0f\u89c4\u6a21\u53d7\u63a7\u7814\u7a76\u4e2d\u5c06\u4e2d\u4f4d\u6807\u6ce8\u65f6\u95f4\u964d\u4f4e 52%\u3002", "\u6700\u7ec8\u56de\u590d\u7684\u5927\u90e8\u5206 token \u4ecd\u7531\u6a21\u578b\u751f\u6210\uff0c\u66f4\u63a5\u8fd1\u6a21\u578b\u81ea\u8eab\u91c7\u6837\u5206\u5e03\uff0c\u9002\u5408\u6784\u9020 on-policy SFT \u4e0e\u504f\u597d\u6570\u636e\u3002", "\u8bb0\u5f55\u7684 token \u7ea7\u7ea0\u9519\u5929\u7136\u63d0\u4f9b\u7cbe\u786e\u4f4d\u7f6e\u76d1\u7763\u548c\u6b63\u8d1f\u6837\u672c\u5bf9\uff0c\u5e76\u652f\u6301\u8fde\u63a5\u5916\u90e8\u5de5\u5177\u4e0e\u73af\u5883\u8fdb\u884c\u771f\u5b9e\u667a\u80fd\u4f53\u8f68\u8ff9\u6807\u6ce8\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5bf9\u9f50", "\u6570\u636e\u6807\u6ce8", "\u76d1\u7763\u5fae\u8c03"], "num_comments": 3, "on_hf": true, "organization": "StepFun", "pdf_url": "https://arxiv.org/pdf/2609.24983", "published_at": "2026-09-21", "score": 0.3, "selected_reasons": ["HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24983.png", "title": "onPanda: Efficient Annotation of On-Policy Alignment Data for LLMs and Agents via Token-Level Correction", "tldr": "\u7528\u9010\u8bcd\u7ea0\u9519\u9ad8\u6548\u6807\u6ce8\u5bf9\u9f50\u4e0e\u667a\u80fd\u4f53\u8f68\u8ff9", "upvotes": 27, "what_it_is": "\u672c\u6587\u63d0\u51fa onPanda\uff0c\u4e00\u4e2a\u7528\u4e8e LLM \u5bf9\u9f50\u6570\u636e\u548c\u667a\u80fd\u4f53\u8f68\u8ff9\u6807\u6ce8\u7684\u4ea4\u4e92\u5f0f\u5de5\u5177\u3002\u5b83\u8ba9\u6807\u6ce8\u8005\u5728\u751f\u6210\u7ed3\u679c\u4e2d\u5b9a\u4f4d\u7b2c\u4e00\u4e2a\u4e0d\u5408\u9002 token\uff0c\u8fdb\u884c\u66ff\u6362\u6216\u81ea\u7531\u7f16\u8f91\uff0c\u518d\u4ece\u4fee\u6b63\u524d\u7f00\u7ee7\u7eed\u751f\u6210\uff0c\u5faa\u73af\u5f97\u5230\u6ee1\u610f\u8f93\u51fa\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5bf9\u9f50\u6570\u636e\u6807\u6ce8\u4ece\u6574\u6bb5\u6539\u5199\u63a8\u8fdb\u5230\u7ec6\u7c92\u5ea6\u3001\u4f4e\u6210\u672c\u3001\u8fd1 on-policy \u7684\u4ea4\u4e92\u5f0f\u7ea0\u9519\uff0c\u6709\u671b\u63d0\u5347 LLM \u4e0e\u667a\u80fd\u4f53\u8bad\u7ec3\u6570\u636e\u7684\u8d28\u91cf\u548c\u6548\u7387\uff0c\u5e76\u53d1\u5e03\u4e86 Panda-CVL \u6570\u636e\u96c6\u4e0e token \u7ea7\u7ea0\u9519\u57fa\u51c6\u3002"}, {"abstract": "Vision-Language-Action (VLA) policies achieve strong performance in robotic manipulation but remain brittle once execution deviates from nominal trajectories. We propose CARE (Corrective Atomic Robotic Execution), a framework that improves recovery by learning from failures encountered during execution. Instead of generating corrective data from manually designed or random perturbations, CARE collects failed rollouts, models stage-conditioned post-failure deviations, and uses the resulting empirical distributions to synthesize representative failure states and corrective demonstrations. At inference time, CARE combines stage-wise planning with physically grounded 3D monitoring to trigger atomic adjustments or re-operations while preserving task progress. We further introduce the Failure State Recovery Benchmark (FSR-Bench), which evaluates recovery from intermediate failure states under local deviations and structural anomalies. Experiments across multiple VLA backbones, simulation benchmarks, and real-world dual-arm tasks show consistent improvements, with average task-success gains of 14.5 points in simulation and 15.9 points in the real world. Code, models, and data are available at https://github.com/xiaojunlan/care", "arxiv_id": "2609.24118", "arxiv_url": "https://arxiv.org/abs/2609.24118", "authors": ["Junlan Xiao", "Junwei Jiang", "Zaibin Zhang", "Yifan Wang", "Zhongbo Zhang", "Huchuan Lu", "Lijun Wang"], "brief": "\u8bba\u6587\u63d0\u51faCARE\u6846\u67b6\uff0c\u901a\u8fc7\u6536\u96c6\u6267\u884c\u4e2d\u7684\u5931\u8d25\u8f68\u8ff9\uff0c\u5efa\u6a21\u4e0d\u540c\u4efb\u52a1\u9636\u6bb5\u7684\u5931\u8d25\u540e\u504f\u5dee\u5206\u5e03\uff0c\u5e76\u5408\u6210\u4ee3\u8868\u6027\u5931\u8d25\u72b6\u6001\u4e0e\u7ea0\u6b63\u793a\u8303\u3002\u63a8\u7406\u65f6\u7ed3\u5408\u5206\u9636\u6bb5\u89c4\u5212\u4e0e3D\u7269\u7406\u76d1\u63a7\uff0c\u89e6\u53d1\u539f\u5b50\u7ea7\u8c03\u6574\u6216\u91cd\u64cd\u4f5c\u4ee5\u6062\u590d\u4efb\u52a1\u8fdb\u5ea6\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/xiaojunlan/care", "github_stars": 36, "hf_url": "https://huggingface.co/papers/2609.24118", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u4f9d\u8d56\u4eba\u5de5\u8bbe\u8ba1\u6216\u968f\u673a\u6270\u52a8\u751f\u6210\u7ea0\u9519\u6570\u636e\uff0c\u800c\u662f\u5229\u7528\u771f\u5b9e\u6267\u884c\u5931\u8d25\u7ecf\u9a8c\u5efa\u6a21\u6062\u590d\u7b56\u7565", "\u63d0\u51faFSR-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u673a\u5668\u4eba\u5728\u4e2d\u95f4\u5931\u8d25\u72b6\u6001\u3001\u5c40\u90e8\u504f\u5dee\u548c\u7ed3\u6784\u5f02\u5e38\u4e0b\u7684\u6062\u590d\u80fd\u529b", "\u5728\u591a\u79cdVLA\u9aa8\u5e72\u3001\u4eff\u771f\u4e0e\u771f\u5b9e\u53cc\u81c2\u4efb\u52a1\u4e2d\u63d0\u5347\u7a33\u5b9a\u6027\uff1a\u4eff\u771f\u5e73\u5747\u6210\u529f\u7387\u63d0\u534714.5\u4e2a\u767e\u5206\u70b9\uff0c\u771f\u5b9e\u4e16\u754c\u63d0\u534715.9\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u7ea0\u9519\u6267\u884c", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "DaLian University of Technology", "pdf_url": "https://arxiv.org/pdf/2609.24118", "published_at": "2026-09-21", "score": 0.28, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24118.png", "title": "CARE: Experience-Guided Atomic Corrective Execution for Vision-Language-Action Policies", "tldr": "CARE\u8ba9VLA\u673a\u5668\u4eba\u4ece\u5931\u8d25\u4e2d\u5b66\u4e60\u7ea0\u9519\u3002", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51faCARE\u6846\u67b6\uff0c\u901a\u8fc7\u6536\u96c6\u6267\u884c\u4e2d\u7684\u5931\u8d25\u8f68\u8ff9\uff0c\u5efa\u6a21\u4e0d\u540c\u4efb\u52a1\u9636\u6bb5\u7684\u5931\u8d25\u540e\u504f\u5dee\u5206\u5e03\uff0c\u5e76\u5408\u6210\u4ee3\u8868\u6027\u5931\u8d25\u72b6\u6001\u4e0e\u7ea0\u6b63\u793a\u8303\u3002\u63a8\u7406\u65f6\u7ed3\u5408\u5206\u9636\u6bb5\u89c4\u5212\u4e0e3D\u7269\u7406\u76d1\u63a7\uff0c\u89e6\u53d1\u539f\u5b50\u7ea7\u8c03\u6574\u6216\u91cd\u64cd\u4f5c\u4ee5\u6062\u590d\u4efb\u52a1\u8fdb\u5ea6\u3002", "why_notable": "VLA\u7b56\u7565\u5e38\u5728\u504f\u79bb\u7406\u60f3\u8f68\u8ff9\u540e\u5931\u6548\uff0cCARE\u628a\u5931\u8d25\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u8bad\u7ec3\u7684\u7ea0\u9519\u80fd\u529b\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u663e\u8457\u63d0\u5347\u6062\u590d\u4e0e\u9c81\u68d2\u6267\u884c\u80fd\u529b\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Despite impressive visual quality, state-of-the-art video diffusion models often generate content that violates real-world physical laws. While existing solutions rely on external priors or specialized data, we investigate the root cause by exploring the internal mechanisms of these models. Specifically, we present the first interpretability study on the \u0027\u0027motion planning\u0027\u0027 process of text-to-video diffusion models, revealing how motion trajectories form during early denoising stages. Building upon the \u0027\u0027first shape, then details\u0027\u0027 finding, we combine cross-attention trajectory patterns with causal head contributions to identify a specific subset of attention heads driving motion planning. Further, our self-attention analysis shows that Rotary Position Embedding (RoPE) induces excessive spatial attention decay. This causes early candidate regions to prematurely lock into physically implausible positions, suppressing reasonable trajectories in adjacent frames and triggering generation failure modes. To address this fundamental flaw, we propose a lightweight architectural modification that scales the frequency of RoPE across different denoising steps. This strategy reduces excessive attention decay, helping the model explore better candidate regions to establish coherent physical motion. Finally, training-free and training-based experiments confirm the effectiveness of our approach in enhancing the physical commonsense of generated videos.", "arxiv_id": "2609.23658", "arxiv_url": "https://arxiv.org/abs/2609.23658", "authors": ["Yueyan Li", "Haibo Wang", "Caixia Yuan", "Xiaojie Wang"], "brief": "\u8bba\u6587\u9996\u6b21\u4ece\u53ef\u89e3\u91ca\u6027\u89d2\u5ea6\u5206\u6790\u6587\u751f\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u201c\u8fd0\u52a8\u89c4\u5212\u201d\u8fc7\u7a0b\uff0c\u53d1\u73b0\u65e9\u671f\u53bb\u566a\u9636\u6bb5\u7684\u6ce8\u610f\u529b\u673a\u5236\u4f1a\u51b3\u5b9a\u8fd0\u52a8\u8f68\u8ff9\u3002\u4f5c\u8005\u6307\u51fa RoPE \u5bfc\u81f4\u7a7a\u95f4\u6ce8\u610f\u529b\u8fc7\u5ea6\u8870\u51cf\uff0c\u4f7f\u5019\u9009\u533a\u57df\u8fc7\u65e9\u9501\u5b9a\u5230\u4e0d\u5408\u7406\u4f4d\u7f6e\uff0c\u5e76\u63d0\u51fa\u6309\u53bb\u566a\u6b65\u9aa4\u7f29\u653e RoPE \u9891\u7387\u7684\u8f7b\u91cf\u6539\u9020\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/Siriuslala/physics", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.23658", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u89c6\u9891\u6269\u6563\u6a21\u578b\u9075\u5faa\u201c\u5148\u5f62\u72b6\u3001\u540e\u7ec6\u8282\u201d\u7684\u751f\u6210\u89c4\u5f8b\uff0c\u8fd0\u52a8\u8f68\u8ff9\u5728\u65e9\u671f\u53bb\u566a\u9636\u6bb5\u5f62\u6210", "\u7ed3\u5408 cross-attention \u8f68\u8ff9\u6a21\u5f0f\u4e0e\u56e0\u679c head \u8d21\u732e\uff0c\u5b9a\u4f4d\u5230\u9a71\u52a8\u8fd0\u52a8\u89c4\u5212\u7684\u4e00\u7ec4\u5173\u952e\u6ce8\u610f\u529b\u5934", "\u63d0\u51fa\u8bad\u7ec3\u65e0\u5173\u6216\u53ef\u8bad\u7ec3\u7684 RoPE \u9891\u7387\u7f29\u653e\u7b56\u7565\uff0c\u7f13\u89e3\u6ce8\u610f\u529b\u8870\u51cf\u5e76\u63d0\u5347\u751f\u6210\u89c6\u9891\u7684\u7269\u7406\u4e00\u81f4\u6027"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 2, "on_hf": true, "organization": "BUPT-Center of Intelligent Science and Technology", "pdf_url": "https://arxiv.org/pdf/2609.23658", "published_at": "2026-09-20", "score": 0.277, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.23658.png", "title": "Why Do Video Diffusion Models Violate Physics? Unveiling the Flaws in Attention Mechanisms", "tldr": "\u63ed\u793a\u89c6\u9891\u6269\u6563\u6a21\u578b\u8fdd\u80cc\u7269\u7406\u7684\u6ce8\u610f\u529b\u6839\u56e0", "upvotes": 9, "what_it_is": "\u8bba\u6587\u9996\u6b21\u4ece\u53ef\u89e3\u91ca\u6027\u89d2\u5ea6\u5206\u6790\u6587\u751f\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u201c\u8fd0\u52a8\u89c4\u5212\u201d\u8fc7\u7a0b\uff0c\u53d1\u73b0\u65e9\u671f\u53bb\u566a\u9636\u6bb5\u7684\u6ce8\u610f\u529b\u673a\u5236\u4f1a\u51b3\u5b9a\u8fd0\u52a8\u8f68\u8ff9\u3002\u4f5c\u8005\u6307\u51fa RoPE \u5bfc\u81f4\u7a7a\u95f4\u6ce8\u610f\u529b\u8fc7\u5ea6\u8870\u51cf\uff0c\u4f7f\u5019\u9009\u533a\u57df\u8fc7\u65e9\u9501\u5b9a\u5230\u4e0d\u5408\u7406\u4f4d\u7f6e\uff0c\u5e76\u63d0\u51fa\u6309\u53bb\u566a\u6b65\u9aa4\u7f29\u653e RoPE \u9891\u7387\u7684\u8f7b\u91cf\u6539\u9020\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u662f\u4f9d\u8d56\u5916\u90e8\u7269\u7406\u5148\u9a8c\u6216\u4e13\u7528\u6570\u636e\uff0c\u800c\u662f\u5b9a\u4f4d\u5230\u89c6\u9891\u6269\u6563\u6a21\u578b\u5185\u90e8\u6ce8\u610f\u529b\u673a\u5236\u7684\u7ed3\u6784\u6027\u7f3a\u9677\uff0c\u5e76\u7ed9\u51fa\u8f7b\u91cf\u4fee\u590d\u65b9\u6848\uff0c\u5bf9\u63d0\u5347\u89c6\u9891\u751f\u6210\u7684\u7269\u7406\u5e38\u8bc6\u548c\u53ef\u63a7\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language-Action (VLA) models map observations to actions with no objective that accounts for how the world responds, so their robustness is bounded primarily by data coverage. World models carry precisely that missing objective and are better grounded for it, yet rolling the future forward costs seconds per decision and rules them out of the control loop. We show the two can be separated. What a world model knows about physical scenes lives in its internal features; generating the future is merely the objective that produced them, so the grounding can be inherited while the generative machinery is left behind. We add one feature-alignment term to ordinary VLA training: a frozen world model is run over the training frames once and cached, and the student learns to agree with that cache. No teacher is loaded during training, the projector is discarded after it, and the deployed policy is identical to the undistilled baseline, running in 32ms and 1.86GB on a consumer RTX5090, so every gain is attributable to the representation rather than to added capacity or test-time compute. A 0.8B student reaches 97.9% on LIBERO, improves from 48.2% to 50.5% on RoboCasa-GR1 humanoid manipulation, and the same objective carries over to real hardware, on both a single-arm and a bimanual platform. The gain survives changes of student scale, backbone, alignment layer, and teacher, indicating a broad representational prior rather than a fragile alignment between two particular networks. Project page: https://thaw-vla.trung-dt.com/.", "arxiv_id": "2609.24682", "arxiv_url": "https://arxiv.org/abs/2609.24682", "authors": ["Trung Dao", "Sankalp Yamsani", "Jaden Park", "Joohyung Kim", "Yong Jae Lee"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5c06\u51bb\u7ed3\u4e16\u754c\u6a21\u578b\u7684\u5185\u90e8\u8868\u5f81\u84b8\u998f\u5230\u7d27\u51d1\u578b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\uff08VLA\uff09\u673a\u5668\u4eba\u7b56\u7565\u4e2d\u7684\u8bad\u7ec3\u65b9\u6cd5\u3002\u5b83\u4e0d\u5728\u63a8\u7406\u65f6\u6eda\u52a8\u9884\u6d4b\u672a\u6765\uff0c\u800c\u662f\u5728\u8bad\u7ec3\u65f6\u7f13\u5b58\u4e16\u754c\u6a21\u578b\u7279\u5f81\uff0c\u901a\u8fc7\u7279\u5f81\u5bf9\u9f50\u8ba9VLA\u7ee7\u627f\u7269\u7406\u573a\u666f\u7406\u89e3\u80fd\u529b\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/trungdt880/THAW-VLA", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24682", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ec5\u5728\u666e\u901aVLA\u8bad\u7ec3\u4e2d\u52a0\u5165\u4e00\u4e2a\u7279\u5f81\u5bf9\u9f50\u635f\u5931\uff1b\u4e16\u754c\u6a21\u578b\u7279\u5f81\u9884\u5148\u79bb\u7ebf\u7f13\u5b58\uff0c\u8bad\u7ec3\u65f6\u4e0d\u52a0\u8f7d\u6559\u5e08\u6a21\u578b\uff0c\u63a8\u7406\u65f6\u4e5f\u4e0d\u589e\u52a0\u989d\u5916\u6a21\u5757\u3002", "\u90e8\u7f72\u7b56\u7565\u7ed3\u6784\u4e0e\u672a\u84b8\u998f\u57fa\u7ebf\u76f8\u540c\uff0c\u6d88\u8d39\u7ea7RTX5090\u4e0a\u63a8\u7406\u7ea632ms\u3001\u663e\u5b581.86GB\uff0c\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u8868\u5f81\u800c\u975e\u6a21\u578b\u5bb9\u91cf\u6216\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u3002", "0.8B\u5b66\u751f\u6a21\u578b\u5728LIBERO\u8fbe\u523097.9%\uff0c\u5728RoboCasa-GR1\u4eba\u5f62\u64cd\u4f5c\u4e2d\u4ece48.2%\u63d0\u5347\u523050.5%\uff0c\u5e76\u8fc1\u79fb\u5230\u5355\u81c2\u548c\u53cc\u81c2\u771f\u5b9e\u673a\u5668\u4eba\u5e73\u53f0\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24682", "published_at": "2026-09-22", "score": 0.254, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24682.png", "title": "Think Like a World Model, Act Like a VLA: Distilling World-Model Representations into Compact Robot Policies", "tldr": "\u7528\u4e16\u754c\u6a21\u578b\u8868\u5f81\u84b8\u998f\u589e\u5f3a\u8f7b\u91cfVLA\u7b56\u7565", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5c06\u51bb\u7ed3\u4e16\u754c\u6a21\u578b\u7684\u5185\u90e8\u8868\u5f81\u84b8\u998f\u5230\u7d27\u51d1\u578b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\uff08VLA\uff09\u673a\u5668\u4eba\u7b56\u7565\u4e2d\u7684\u8bad\u7ec3\u65b9\u6cd5\u3002\u5b83\u4e0d\u5728\u63a8\u7406\u65f6\u6eda\u52a8\u9884\u6d4b\u672a\u6765\uff0c\u800c\u662f\u5728\u8bad\u7ec3\u65f6\u7f13\u5b58\u4e16\u754c\u6a21\u578b\u7279\u5f81\uff0c\u901a\u8fc7\u7279\u5f81\u5bf9\u9f50\u8ba9VLA\u7ee7\u627f\u7269\u7406\u573a\u666f\u7406\u89e3\u80fd\u529b\u3002", "why_notable": "\u5b83\u628a\u4e16\u754c\u6a21\u578b\u7684\u7269\u7406 grounding \u4e0e\u6602\u8d35\u7684\u672a\u6765\u751f\u6210\u89e3\u8026\uff0c\u4e3a\u63d0\u5347VLA\u673a\u5668\u4eba\u7b56\u7565\u9c81\u68d2\u6027\u63d0\u4f9b\u4e86\u4e00\u79cd\u4f4e\u63a8\u7406\u6210\u672c\u3001\u6613\u90e8\u7f72\u7684\u84b8\u998f\u8def\u7ebf\uff1b\u4e14\u5728\u4e0d\u540c\u5b66\u751f\u89c4\u6a21\u3001\u9aa8\u5e72\u7f51\u7edc\u3001\u5bf9\u9f50\u5c42\u548c\u6559\u5e08\u6a21\u578b\u4e0b\u5747\u6709\u6548\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u901a\u7528\u6027\u3002"}, {"abstract": "AI agents are beginning to automate research and development across the AI stack, from improving training efficiency to optimizing inference. A natural next step is to improve the research efficiency of the agents themselves. When an AI research agent\u0027s own code is the object of optimization, each accepted rewrite becomes the agent that the next round edits. We refer to this loop as recursive self-improvement. Its significance lies in a long-standing trend, in which increased cumulative spending on R\u0026D yields diminishing returns. Sustained self-improvement offers a way to counter this trend. We present AIDE^2, a system that implements this loop for a frontier AI research agent. It proposes changes to its own code, benchmarks modified versions of itself on a suite of AI R\u0026D tasks, and keeps the changes that perform best on hidden evaluations. In an autonomous 8-day run, AIDE^2 discovered seven successive improvements, ranging from a new search policy to memory mechanisms that compress and manage the agent\u0027s growing context. These gains generalize to four held-out benchmarks spanning machine learning engineering, heuristic algorithm engineering, and physics-based weather forecasting, the last of which is out of distribution from the selection tasks. On all four, the strongest discovered agent matches or exceeds a human-engineered production research agent that ranks among the strongest on FML-Bench. On a separate held-out task family, the discovered agents also exhibit reduced reward hacking, a property the loop never explicitly optimized for: the rate falls from 55% to 32% during the run, 7 percentage points below the human-engineered agent. Together, these results show that an AI research agent can improve its own research efficiency through recursive self-improvement, and that these gains transfer to tasks and domains the loop never encountered.", "arxiv_id": "2609.26457", "arxiv_url": "https://arxiv.org/abs/2609.26457", "authors": ["Dhruv Srikanth", "Bingchen Zhao", "Dixing Xu", "Yuxiang Wu", "Zhengyao Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa AIDE\u00b2\uff0c\u4e00\u4e2a\u9762\u5411\u524d\u6cbf AI \u7814\u7a76\u667a\u80fd\u4f53\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u7cfb\u7edf\uff1a\u667a\u80fd\u4f53\u81ea\u52a8\u4fee\u6539\u81ea\u8eab\u4ee3\u7801\uff0c\u5728 AI \u7814\u53d1\u4efb\u52a1\u5957\u4ef6\u4e0a\u8bc4\u6d4b\u6539\u7248\uff0c\u5e76\u4fdd\u7559\u9690\u85cf\u8bc4\u6d4b\u8868\u73b0\u6700\u597d\u7684\u53d8\u5316\u3002", "categories": ["cs.AI", "cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.26457", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": ["\u5728\u4e00\u6b21\u81ea\u4e3b\u8fd0\u884c8\u5929\u7684\u5b9e\u9a8c\u4e2d\uff0cAIDE\u00b2\u8fde\u7eed\u53d1\u73b07\u9879\u6709\u6548\u6539\u8fdb\uff0c\u5305\u62ec\u65b0\u7684\u641c\u7d22\u7b56\u7565\u548c\u7528\u4e8e\u538b\u7f29\u3001\u7ba1\u7406\u957f\u4e0a\u4e0b\u6587\u7684\u8bb0\u5fc6\u673a\u5236\u3002", "\u6539\u8fdb\u540e\u7684\u667a\u80fd\u4f53\u57284\u4e2a\u7559\u51fa\u57fa\u51c6\u4e0a\u6cdb\u5316\u826f\u597d\uff0c\u8986\u76d6\u673a\u5668\u5b66\u4e60\u5de5\u7a0b\u3001\u542f\u53d1\u5f0f\u7b97\u6cd5\u5de5\u7a0b\u548c\u7269\u7406\u5929\u6c14\u9884\u62a5\u7b49\u4efb\u52a1\uff0c\u5176\u4e2d\u5929\u6c14\u9884\u62a5\u4e3a\u5206\u5e03\u5916\u9886\u57df\u3002", "\u6700\u5f3a\u81ea\u52a8\u53d1\u73b0\u7248\u672c\u5728\u6240\u67094\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u4eba\u5de5\u5de5\u7a0b\u5316\u7684\u751f\u4ea7\u7ea7\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u5e76\u5728\u53e6\u4e00\u7ec4\u7559\u51fa\u4efb\u52a1\u4e2d\u5c06\u5956\u52b1\u9ed1\u5ba2\u7387\u4ece55%\u964d\u81f332%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "AI\u7814\u53d1\u81ea\u52a8\u5316", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": true, "organization": "Weco AI", "pdf_url": "https://arxiv.org/pdf/2609.26457", "published_at": "2026-09-22", "score": 0.254, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.26457.png", "title": "Recursive self-improvement of AI research agents", "tldr": "AIDE\u00b2\u8ba9AI\u7814\u7a76\u667a\u80fd\u4f53\u8fed\u4ee3\u6539\u8fdb\u81ea\u8eab\u4ee3\u7801", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa AIDE\u00b2\uff0c\u4e00\u4e2a\u9762\u5411\u524d\u6cbf AI \u7814\u7a76\u667a\u80fd\u4f53\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u7cfb\u7edf\uff1a\u667a\u80fd\u4f53\u81ea\u52a8\u4fee\u6539\u81ea\u8eab\u4ee3\u7801\uff0c\u5728 AI \u7814\u53d1\u4efb\u52a1\u5957\u4ef6\u4e0a\u8bc4\u6d4b\u6539\u7248\uff0c\u5e76\u4fdd\u7559\u9690\u85cf\u8bc4\u6d4b\u8868\u73b0\u6700\u597d\u7684\u53d8\u5316\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5c55\u793a\u4e86AI\u7814\u7a76\u667a\u80fd\u4f53\u4e0d\u4ec5\u80fd\u8f85\u52a9\u7814\u53d1\uff0c\u8fd8\u80fd\u4ee5\u95ed\u73af\u65b9\u5f0f\u4f18\u5316\u81ea\u8eab\u7814\u7a76\u6548\u7387\uff0c\u5e76\u4e14\u6539\u8fdb\u53ef\u8fc1\u79fb\u5230\u672a\u89c1\u4efb\u52a1\u4e0e\u9886\u57df\uff1b\u82e5\u7ed3\u679c\u53ef\u590d\u73b0\uff0c\u5c06\u5bf9\u81ea\u52a8\u5316AI\u7814\u53d1\u548c\u667a\u80fd\u4f53\u5b89\u5168\u8bc4\u4f30\u5177\u6709\u91cd\u8981\u5f71\u54cd\u3002"}, {"abstract": "Existing approaches to persona simulation with Large Language Models (LLMs) mostly rely on shallow character descriptions that fail to sustain coherent character behavior across extended interactions. We introduce Deep Persona, a psychologically grounded, three-layered architecture that organizes personas into hierarchical levels of observable expression, latent beliefs, and core motivational drives, for constructing highly convincing role-playing agents. Governed by the principles of scripted determinism and bounded agency, the architecture restricts the model to a reactive engine guided by a structured internal script. We further propose a reference-free evaluation framework that benchmarks dialogue naturalness against empirical human distributions using established psychological clinical instruments and adversarial stress-tests. Empirical evaluation reveals that while LLMs achieve high pragmatic fluency, they exhibit systematic limitations in emotional expression and joint attention. In addition, we present a case study of two Deep Personas and evaluate them using the proposed framework, demonstrating that structured personas can produce interactions that more closely align with human conversational behavior.", "arxiv_id": "2609.22255", "arxiv_url": "https://arxiv.org/abs/2609.22255", "authors": ["Rotem Dror", "Zohar Elyoseph", "Yuval Haber", "Elad Refoua", "Oshrat Ayalon", "Adir Solomon"], "brief": "\u8bba\u6587\u63d0\u51fa Deep Persona\uff0c\u4e00\u79cd\u57fa\u4e8e\u5fc3\u7406\u5b66\u7684\u4e09\u5c42\u4eba\u683c\u67b6\u6784\uff0c\u5c06\u89d2\u8272\u7ec4\u7ec7\u4e3a\u53ef\u89c2\u5bdf\u8868\u8fbe\u3001\u6f5c\u5728\u4fe1\u5ff5\u4e0e\u6838\u5fc3\u52a8\u673a\u9a71\u52a8\u3002\u5b83\u8fd8\u63d0\u51fa\u65e0\u9700\u53c2\u8003\u7b54\u6848\u7684\u8bc4\u4f30\u6846\u67b6\uff0c\u7528\u4e34\u5e8a\u5fc3\u7406\u91cf\u8868\u4e0e\u5bf9\u6297\u538b\u529b\u6d4b\u8bd5\u8861\u91cf\u89d2\u8272\u5bf9\u8bdd\u7684\u81ea\u7136\u6027\u548c\u7a33\u5b9a\u6027\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.22255", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u201c\u811a\u672c\u5316\u51b3\u5b9a\u8bba\u201d\u548c\u201c\u6709\u9650\u80fd\u52a8\u6027\u201d\uff0c\u5c06 LLM \u9650\u5236\u4e3a\u53d7\u7ed3\u6784\u5316\u5185\u90e8\u811a\u672c\u5f15\u5bfc\u7684\u53cd\u5e94\u5f0f\u89d2\u8272\u5f15\u64ce", "\u8bc4\u4f30\u6846\u67b6\u5c06\u5bf9\u8bdd\u81ea\u7136\u6027\u4e0e\u7ecf\u9a8c\u6027\u4eba\u7c7b\u5206\u5e03\u5bf9\u9f50\uff0c\u5e76\u68c0\u6d4b\u60c5\u7eea\u8868\u8fbe\u3001\u5171\u540c\u6ce8\u610f\u7b49\u5fc3\u7406\u884c\u4e3a\u7ef4\u5ea6", "\u5b9e\u9a8c\u663e\u793a LLM \u867d\u5177\u5907\u8f83\u5f3a\u8bed\u7528\u6d41\u7545\u6027\uff0c\u4f46\u5728\u60c5\u7eea\u8868\u8fbe\u548c\u5171\u540c\u6ce8\u610f\u65b9\u9762\u5b58\u5728\u7cfb\u7edf\u6027\u4e0d\u8db3"], "keywords": ["\u667a\u80fd\u4f53", "\u89d2\u8272\u626e\u6f14", "\u5fc3\u7406\u5efa\u6a21", "\u8bc4\u4f30\u6846\u67b6"], "num_comments": 2, "on_hf": true, "organization": "University of Haifa", "pdf_url": "https://arxiv.org/pdf/2609.22255", "published_at": "2026-09-06", "score": 0.251, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.22255.png", "title": "Deep Persona: A Psychologically Grounded Architecture and Evaluation Framework for Role-Playing Agents and Simulations", "tldr": "\u5fc3\u7406\u5b66\u5206\u5c42\u4eba\u683c\u67b6\u6784\u63d0\u5347\u89d2\u8272\u626e\u6f14\u4e00\u81f4\u6027", "upvotes": 13, "what_it_is": "\u8bba\u6587\u63d0\u51fa Deep Persona\uff0c\u4e00\u79cd\u57fa\u4e8e\u5fc3\u7406\u5b66\u7684\u4e09\u5c42\u4eba\u683c\u67b6\u6784\uff0c\u5c06\u89d2\u8272\u7ec4\u7ec7\u4e3a\u53ef\u89c2\u5bdf\u8868\u8fbe\u3001\u6f5c\u5728\u4fe1\u5ff5\u4e0e\u6838\u5fc3\u52a8\u673a\u9a71\u52a8\u3002\u5b83\u8fd8\u63d0\u51fa\u65e0\u9700\u53c2\u8003\u7b54\u6848\u7684\u8bc4\u4f30\u6846\u67b6\uff0c\u7528\u4e34\u5e8a\u5fc3\u7406\u91cf\u8868\u4e0e\u5bf9\u6297\u538b\u529b\u6d4b\u8bd5\u8861\u91cf\u89d2\u8272\u5bf9\u8bdd\u7684\u81ea\u7136\u6027\u548c\u7a33\u5b9a\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4eba\u683c\u6a21\u62df\u4ece\u6d45\u5c42\u89d2\u8272\u63cf\u8ff0\u63a8\u8fdb\u5230\u5fc3\u7406\u5b66\u9a71\u52a8\u7684\u7ed3\u6784\u5316\u5efa\u6a21\uff0c\u5e76\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u65e0\u53c2\u8003\u8bc4\u4f30\u65b9\u6cd5\uff0c\u5bf9\u89d2\u8272\u626e\u6f14\u667a\u80fd\u4f53\u3001\u793e\u4ea4\u4eff\u771f\u548c\u865a\u62df\u4eba\u7269\u8bbe\u8ba1\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models can hold knowledge they do not report. A model may sandbag on a capability evaluation, or answer against what it internally knows, and its outputs alone cannot tell whether it is hiding an answer or simply does not have one. We borrow the Concealed Information Test, a forensic method that identifies guilty knowledge by presenting a suspect with the true detail among plausible decoys and measuring a stronger response to the item they recognize. Our method, Probe of Internal Recognition (PIR), does the same inside a model. It presents a question with its candidate answers and reads, from the model\u0027s internal states, which candidate the model recognizes as correct. PIR is reference-free, needing no honest reference model and no labeled truth corpus. Across eight models from five families (Gemma, Qwen, Llama, Mistral, and Phi), PIR recovers the recognized answer at 0.70 to 0.87 balanced accuracy, well above the 0.28 to 0.40 unknown-item baseline and the 0.25 chance rate. It stays readable across every form of concealment we test, from prompted deception and trained sandbagging to external password-locked and circuit-broken checkpoints, with recognition between 0.85 and 0.93. When the model hides a known answer, recognition stays high. When unlearning removes the knowledge, recognition drops to the level of a question the model never knew. PIR therefore separates a model that will not answer from one that cannot, which supports sandbagging audits and unlearning verification. The signal is causal, adds information beyond black-box behavioral cues, and extends from multiple-choice questions to free-form generation.", "arxiv_id": "2609.21996", "arxiv_url": "https://arxiv.org/abs/2609.21996", "authors": ["Hiskias Dingeto"], "brief": "\u8bba\u6587\u63d0\u51fa Probe of Internal Recognition\uff08PIR\uff09\uff0c\u501f\u9274\u6cd5\u8bc1\u5b66\u201c\u9690\u853d\u4fe1\u606f\u6d4b\u8bd5\u201d\uff0c\u901a\u8fc7\u7ed9\u6a21\u578b\u5c55\u793a\u5019\u9009\u7b54\u6848\u5e76\u8bfb\u53d6\u5185\u90e8\u72b6\u6001\uff0c\u5224\u65ad\u6a21\u578b\u662f\u5426\u8bc6\u522b\u51fa\u6b63\u786e\u7b54\u6848\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u8bda\u5b9e\u53c2\u8003\u6a21\u578b\u6216\u6807\u6ce8\u771f\u503c\u8bed\u6599\uff0c\u53ef\u533a\u5206\u6a21\u578b\u201c\u77e5\u9053\u4f46\u4e0d\u8bf4\u201d\u548c\u201c\u786e\u5b9e\u4e0d\u77e5\u9053\u201d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21996", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728 Gemma\u3001Qwen\u3001Llama\u3001Mistral\u3001Phi \u4e94\u4e2a\u5bb6\u65cf\u5171\u516b\u4e2a\u6a21\u578b\u4e0a\uff0cPIR \u4ee5 0.70\u20130.87 \u7684\u5e73\u8861\u51c6\u786e\u7387\u6062\u590d\u6a21\u578b\u8bc6\u522b\u7684\u7b54\u6848\uff0c\u663e\u8457\u9ad8\u4e8e\u672a\u77e5\u9879\u57fa\u7ebf\u548c\u968f\u673a\u6c34\u5e73\u3002", "\u9762\u5bf9\u63d0\u793a\u8bf1\u5bfc\u6b3a\u9a97\u3001\u8bad\u7ec3\u5f0f sandbagging\u3001\u5bc6\u7801\u9501\u5b9a\u6a21\u578b\u3001\u65ad\u8def\u68c0\u67e5\u70b9\u7b49\u591a\u79cd\u9690\u7792\u5f62\u5f0f\uff0c\u5185\u90e8\u8bc6\u522b\u4fe1\u53f7\u4ecd\u4fdd\u6301 0.85\u20130.93\u3002", "\u5f53\u6a21\u578b\u9690\u85cf\u5df2\u77e5\u7b54\u6848\u65f6\u8bc6\u522b\u4fe1\u53f7\u4ecd\u9ad8\uff1b\u5f53 unlearning \u771f\u6b63\u79fb\u9664\u77e5\u8bc6\u65f6\uff0c\u8bc6\u522b\u4fe1\u53f7\u4f1a\u964d\u81f3\u672a\u77e5\u95ee\u9898\u6c34\u5e73\u3002"], "keywords": ["\u6a21\u578b\u5b89\u5168", "\u53ef\u89e3\u91ca\u6027", "\u77e5\u8bc6\u68c0\u6d4b", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21996", "published_at": "2026-09-18", "score": 0.249, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.21996.png", "title": "A Lie Detector Test for Language Models: Reading Knowledge a Model Won\u0027t Reveal", "tldr": "\u7528\u5185\u90e8\u8868\u5f81\u68c0\u6d4b\u6a21\u578b\u9690\u7792\u7684\u77e5\u8bc6", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa Probe of Internal Recognition\uff08PIR\uff09\uff0c\u501f\u9274\u6cd5\u8bc1\u5b66\u201c\u9690\u853d\u4fe1\u606f\u6d4b\u8bd5\u201d\uff0c\u901a\u8fc7\u7ed9\u6a21\u578b\u5c55\u793a\u5019\u9009\u7b54\u6848\u5e76\u8bfb\u53d6\u5185\u90e8\u72b6\u6001\uff0c\u5224\u65ad\u6a21\u578b\u662f\u5426\u8bc6\u522b\u51fa\u6b63\u786e\u7b54\u6848\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u8bda\u5b9e\u53c2\u8003\u6a21\u578b\u6216\u6807\u6ce8\u771f\u503c\u8bed\u6599\uff0c\u53ef\u533a\u5206\u6a21\u578b\u201c\u77e5\u9053\u4f46\u4e0d\u8bf4\u201d\u548c\u201c\u786e\u5b9e\u4e0d\u77e5\u9053\u201d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u68c0\u6d4b\u5927\u6a21\u578b\u80fd\u529b\u9690\u7792\u548c\u9a8c\u8bc1\u9057\u5fd8\u6548\u679c\u63d0\u4f9b\u4e86\u65e0\u9700\u53c2\u8003\u6a21\u578b\u7684\u5185\u90e8\u8bfb\u51fa\u65b9\u6cd5\uff0c\u80fd\u8865\u8db3\u4ec5\u4f9d\u8d56\u8f93\u51fa\u884c\u4e3a\u7684\u9ed1\u76d2\u8bc4\u4f30\uff0c\u5bf9\u5b89\u5168\u5ba1\u8ba1\u548c\u6a21\u578b\u6cbb\u7406\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "Diffusion Large Language Models (dLLMs) have recently emerged as a promising alternative to autoregressive LLMs by enabling non-autoregressive text generation. However, their practical deployment remains limited by inefficient inference, largely due to the absence of effective Key-Value (KV) caching and scalable parallel decoding mechanisms. Existing acceleration methods typically study KV caching and parallel decoding in isolation, overlooking the I/O bottlenecks that arise when cache reuse and parallel token verification are jointly applied. In this work, we introduce $\\textbf{Flash-dLLM}$, a training-free inference acceleration framework for fast and memory-efficient dLLMs. Flash-dLLM first identifies GPU memory I/O as a dominant bottleneck in KV-cache-enabled dLLM inference and addresses it with an I/O-aware fused KV-cache kernel that reduces redundant memory movement. Building on this optimized cache mechanism, Flash-dLLM further proposes an efficient KV-cache-driven draft-and-verify decoding strategy, where the dLLM itself serves as both drafter and verifier without requiring an auxiliary model. This unified design enables faster decoding while preserving generation quality and improving scalability to longer sequences and larger batch size. Extensive experiments on mathematical reasoning and code-generation benchmarks demonstrate that Flash-dLLM consistently outperforms existing state-of-the-art dLLM acceleration methods in both inference speed and memory efficiency. In particular, it achieves $5.1\\times$ and $11.0\\times$ speedups over prior strongest baseline Elastic-Cache on GSM8K and HumanEval, respectively.", "arxiv_id": "2609.26796", "arxiv_url": "https://arxiv.org/abs/2609.26796", "authors": ["Quan Nguyen-Tri", "Mukul Ranjan", "Zhiqiang Shen"], "brief": "\u8bba\u6587\u63d0\u51fa Flash-dLLM\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6269\u6563\u5927\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u52a0\u901f\u6846\u67b6\u3002\u5b83\u8054\u5408\u4f18\u5316 KV \u7f13\u5b58\u4e0e\u5e76\u884c draft-and-verify \u89e3\u7801\uff0c\u63d0\u5347 dLLM \u5728\u957f\u5e8f\u5217\u548c\u5927\u6279\u91cf\u573a\u666f\u4e0b\u7684\u901f\u5ea6\u4e0e\u663e\u5b58\u6548\u7387\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/VILA-Lab/Flash-dLLM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.26796", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u542f\u7528 KV \u7f13\u5b58\u540e\u7684 dLLM \u63a8\u7406\u4e3b\u8981\u74f6\u9888\u6765\u81ea GPU \u663e\u5b58 I/O\uff0c\u800c\u975e\u5355\u7eaf\u8ba1\u7b97\u5f00\u9500", "\u8bbe\u8ba1 I/O-aware \u878d\u5408 KV-cache kernel\uff0c\u51cf\u5c11\u5197\u4f59\u5185\u5b58\u642c\u8fd0\u5e76\u63d0\u5347\u7f13\u5b58\u590d\u7528\u6548\u7387", "\u63d0\u51fa\u7531 dLLM \u81ea\u8eab\u540c\u65f6\u62c5\u4efb drafter \u548c verifier \u7684 KV-cache \u9a71\u52a8\u5e76\u884c\u89e3\u7801\u7b56\u7565\uff0c\u65e0\u9700\u989d\u5916\u8f85\u52a9\u6a21\u578b"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "KV\u7f13\u5b58"], "num_comments": 1, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.26796", "published_at": "2026-09-22", "score": 0.241, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.26796.png", "title": "Flash-dLLM: IO-Aware KV Caching and Parallel Decoding for Fast, Memory-Efficient Diffusion LLMs", "tldr": "\u9762\u5411\u6269\u6563LLM\u7684\u9ad8\u901f\u7701\u663e\u5b58\u63a8\u7406\u6846\u67b6", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Flash-dLLM\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6269\u6563\u5927\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u52a0\u901f\u6846\u67b6\u3002\u5b83\u8054\u5408\u4f18\u5316 KV \u7f13\u5b58\u4e0e\u5e76\u884c draft-and-verify \u89e3\u7801\uff0c\u63d0\u5347 dLLM \u5728\u957f\u5e8f\u5217\u548c\u5927\u6279\u91cf\u573a\u666f\u4e0b\u7684\u901f\u5ea6\u4e0e\u663e\u5b58\u6548\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a KV \u7f13\u5b58\u548c\u5e76\u884c\u89e3\u7801\u653e\u5728\u7edf\u4e00\u7cfb\u7edf\u89c6\u89d2\u4e0b\u4f18\u5316\uff0c\u89e3\u51b3\u4e86\u6269\u6563 LLM \u5b9e\u7528\u90e8\u7f72\u4e2d\u7684\u5173\u952e\u63a8\u7406\u74f6\u9888\uff1b\u5728 GSM8K \u548c HumanEval \u4e0a\u76f8\u5bf9\u5f3a\u57fa\u7ebf Elastic-Cache \u5206\u522b\u5b9e\u73b0 5.1\u00d7 \u548c 11.0\u00d7 \u52a0\u901f\uff0c\u5177\u6709\u8f83\u9ad8\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "High-quality texture generation is essential for creating realistic and production-ready 3D assets. Recent multi-view diffusion methods have shown promising results for image-guided 3D texturing, but they are typically constrained to low operating resolutions such as 512 or 768, making it difficult to preserve high-frequency details from high-resolution reference images. Scaling this paradigm to 2048 resolution is computationally prohibitive, as the unified multi-view sequence exceeds 212K tokens and incurs excessive memory and latency. In this paper, we present UltraTex, an efficient end-to-end framework for high-resolution multi-view diffusion-based 3D texturing. Our key observation is that object-centric multi-view renderings contain two major sources of redundancy: background-induced sequence redundancy and sparse token interactions within the foreground. To address them, we introduce Background Token Dropping, which removes background tokens before the DiT backbone, and Block-Sparse Attention, which reduces attention computation over the retained foreground sequence. To enable efficient foreground-only inference while avoiding reconstruction artifacts, we further design Foreground-Aware VAE Decoding to ensure the quality of the final high-resolution views. To satisfy the demanding data requirements of 2K-resolution multi-view diffusion training, we construct G-buffer TexVerse, a large-scale, ultra-high-resolution multi-view rendering dataset covering over 268,000 3D assets. Extensive experiments show that UltraTex generates visually faithful textures with rich fine-grained details, while substantially improving efficiency, achieving $20.6\\times$--$91.1\\times$ training speedup and $22.3\\times$--$74.6\\times$ end-to-end inference speedup over the baseline on common samples in our dataset. Code and data is at https://yiboz2001.github.io/UltraTex.", "arxiv_id": "2609.23169", "arxiv_url": "https://arxiv.org/abs/2609.23169", "authors": ["Yibo Zhang", "Ze Yuan", "Nan Cao", "Li Zhang", "Yan-Pei Cao", "Yuan-Chen Guo", "Rui Ma"], "brief": "UltraTex \u662f\u4e00\u4e2a\u9762\u5411\u9ad8\u5206\u8fa8\u7387 3D \u7eb9\u7406\u751f\u6210\u7684\u7aef\u5230\u7aef\u591a\u89c6\u89d2\u6269\u6563\u6846\u67b6\uff0c\u5c06\u56fe\u50cf\u5f15\u5bfc\u7684\u591a\u89c6\u89d2\u7eb9\u7406\u751f\u6210\u6269\u5c55\u5230 2048 \u5206\u8fa8\u7387\u3002\u5b83\u901a\u8fc7\u524a\u51cf\u5197\u4f59 token \u4e0e\u7a00\u758f\u6ce8\u610f\u529b\uff0c\u5927\u5e45\u964d\u4f4e 2K \u591a\u89c6\u89d2 DiT \u7684\u8bad\u7ec3\u548c\u63a8\u7406\u6210\u672c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/yiboz2001/UltraTex", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2609.23169", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Background Token Dropping\uff0c\u5728\u8fdb\u5165 DiT \u4e3b\u5e72\u524d\u79fb\u9664\u80cc\u666f token\uff0c\u51cf\u5c11\u591a\u89c6\u89d2\u5e8f\u5217\u4e2d\u7684\u80cc\u666f\u5197\u4f59", "\u91c7\u7528 Block-Sparse Attention \u964d\u4f4e\u524d\u666f token \u95f4\u7684\u6ce8\u610f\u529b\u8ba1\u7b97\uff0c\u5e76\u8bbe\u8ba1 Foreground-Aware VAE Decoding \u907f\u514d\u524d\u666f-only \u63a8\u7406\u5e26\u6765\u7684\u91cd\u5efa\u4f2a\u5f71", "\u6784\u5efa G-buffer TexVerse \u6570\u636e\u96c6\uff0c\u5305\u542b\u8d85\u8fc7 26.8 \u4e07\u4e2a 3D \u8d44\u4ea7\u7684\u8d85\u9ad8\u5206\u8fa8\u7387\u591a\u89c6\u89d2\u6e32\u67d3\uff1b\u8bad\u7ec3\u52a0\u901f 20.6\u00d7\u201391.1\u00d7\uff0c\u7aef\u5230\u7aef\u63a8\u7406\u52a0\u901f 22.3\u00d7\u201374.6\u00d7"], "keywords": ["3D\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u591a\u89c6\u89d2", "\u9ad8\u6548\u6ce8\u610f\u529b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.23169", "published_at": "2026-09-19", "score": 0.239, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.23169.png", "title": "UltraTex: Unleashing 2K Multi-View Diffusion for 3D Texturing", "tldr": "\u9ad8\u6548\u5b9e\u73b02K\u591a\u89c6\u89d2\u6269\u65633D\u7eb9\u7406\u751f\u6210", "upvotes": 1, "what_it_is": "UltraTex \u662f\u4e00\u4e2a\u9762\u5411\u9ad8\u5206\u8fa8\u7387 3D \u7eb9\u7406\u751f\u6210\u7684\u7aef\u5230\u7aef\u591a\u89c6\u89d2\u6269\u6563\u6846\u67b6\uff0c\u5c06\u56fe\u50cf\u5f15\u5bfc\u7684\u591a\u89c6\u89d2\u7eb9\u7406\u751f\u6210\u6269\u5c55\u5230 2048 \u5206\u8fa8\u7387\u3002\u5b83\u901a\u8fc7\u524a\u51cf\u5197\u4f59 token \u4e0e\u7a00\u758f\u6ce8\u610f\u529b\uff0c\u5927\u5e45\u964d\u4f4e 2K \u591a\u89c6\u89d2 DiT \u7684\u8bad\u7ec3\u548c\u63a8\u7406\u6210\u672c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u89e3\u51b3\u4e86\u591a\u89c6\u89d2\u6269\u6563\u7528\u4e8e 2K \u7ea7 3D \u7eb9\u7406\u751f\u6210\u65f6 token \u6570\u91cf\u5de8\u5927\u3001\u663e\u5b58\u548c\u5ef6\u8fdf\u8fc7\u9ad8\u7684\u5173\u952e\u74f6\u9888\uff0c\u4f7f\u9ad8\u9891\u7ec6\u8282\u4e30\u5bcc\u7684\u751f\u4ea7\u7ea7 3D \u7eb9\u7406\u751f\u6210\u66f4\u5177\u53ef\u884c\u6027\uff0c\u5e76\u5f00\u653e\u4ee3\u7801\u4e0e\u5927\u89c4\u6a21\u6570\u636e\u96c6\u3002"}, {"abstract": "Linear RNNs based on the delta-rule enable efficient sequence modeling, but their linear updates with a low-rank correction constrain their expressivity. Prior work has shown that composing two delta-rule transitions in a single recurrent update can model a 2D rotation, but this increases the rank and the cost of the updates compared to a single transition. We show that Kimi Delta Attention (KDA) can realize 2D rotations by combining a single delta-rule transformation with a second reflection supplied by its channel-wise gate. This requires extending the parameter ranges of KDA by combining two existing range extensions: allowing gates in $[-1,1]$ and the delta-rule coefficient $\u03b2$ in $[0,2]$. We call the resulting model Complex KDA (CKDA). It preserves KDA\u0027s stability and efficiency, with transitions that remain diagonal-plus-rank-one and non-expansive, while reaching the state-tracking expressivity of DeltaProduct$_2$. We characterize the expressivity of CKDA and prove that every orthogonal diagonal-plus-rank-one matrix is exactly a CKDA transition matrix. A single CKDA layer can track every finite group isomorphic to a subgroup of $\\mathrm{SO}(3)$, and many state-tracking results use one fewer layer for CKDA compared to other diagonal-plus-rank-one Linear RNNs. Empirically, combining both extensions yields the strongest length extrapolation among tested KDA range settings on $S_3$, $S_4$, and periodic audio continuation. In language modeling, CKDA outperforms Transformers and other linear RNNs, obtains similar results to a KDA baseline, and shows promising scaling behavior. Our code is open source at https://github.com/OpenEuroLLM/ComplexKDA and our models are available at https://huggingface.co/collections/openeurollm/complexkda.", "arxiv_id": "2609.24797", "arxiv_url": "https://arxiv.org/abs/2609.24797", "authors": ["Julien Siems", "Riccardo Grazzi", "Korbinian P\u00f6ppel", "Jaisidh Singh", "Arber Zela", "Timur Carstensen", "Jenia Jitsev", "Frank Hutter", "Volkan Cevher", "Antonio Orvieto", "Aaron Klein"], "brief": "\u8bba\u6587\u63d0\u51fa Complex KDA\uff0c\u901a\u8fc7\u5c06\u95e8\u63a7\u6269\u5c55\u5230[-1,1]\u3001\u5c06delta-rule\u7cfb\u6570\u03b2\u6269\u5c55\u5230[0,2]\uff0c\u8ba9\u5355\u6b21KDA\u8f6c\u79fb\u5373\u53ef\u5b9e\u73b0\u4e8c\u7ef4\u65cb\u8f6c\u7b49\u66f4\u5f3a\u72b6\u6001\u8ddf\u8e2a\u80fd\u529b\u3002\u4f5c\u8005\u4ece\u7406\u8bba\u4e0a\u523b\u753b\u5176\u8868\u8fbe\u529b\uff0c\u5e76\u5728\u5408\u6210\u7fa4\u4efb\u52a1\u3001\u97f3\u9891\u7eed\u5199\u548c\u8bed\u8a00\u5efa\u6a21\u4e2d\u9a8c\u8bc1\u6548\u679c\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/OpenEuroLLM/ComplexKDA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.24797", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["CKDA\u4fdd\u6301KDA\u7684\u5bf9\u89d2\u52a0\u79e9\u4e00\u8f6c\u79fb\u7ed3\u6784\u3001\u975e\u6269\u5f20\u6027\u4e0e\u8ba1\u7b97\u6548\u7387\uff0c\u540c\u65f6\u8fbe\u5230DeltaProduct\u2082\u7ea7\u522b\u7684\u72b6\u6001\u8ddf\u8e2a\u8868\u8fbe\u529b\u3002", "\u8bc1\u660e\u4efb\u610f\u6b63\u4ea4\u7684\u5bf9\u89d2\u52a0\u79e9\u4e00\u77e9\u9635\u90fd\u53ef\u7531CKDA\u7cbe\u786e\u8868\u793a\uff0c\u5355\u5c42CKDA\u53ef\u8ddf\u8e2a\u540c\u6784\u4e8eSO(3)\u5b50\u7fa4\u7684\u4efb\u610f\u6709\u9650\u7fa4\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u53cc\u8303\u56f4\u6269\u5c55\u5728S\u2083\u3001S\u2084\u4e0e\u5468\u671f\u97f3\u9891\u7eed\u5199\u4e0a\u957f\u5ea6\u5916\u63a8\u6700\u5f3a\uff1b\u8bed\u8a00\u5efa\u6a21\u4e2d\u4f18\u4e8eTransformer\u548c\u5176\u4ed6\u7ebf\u6027RNN\uff0c\u5e76\u63a5\u8fd1\u6216\u5339\u914dKDA\u57fa\u7ebf\u3002"], "keywords": ["\u7ebf\u6027RNN", "\u6ce8\u610f\u529b\u673a\u5236", "\u957f\u5e8f\u5217\u5efa\u6a21", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "OpenEuroLLM", "pdf_url": "https://arxiv.org/pdf/2609.24797", "published_at": "2026-09-21", "score": 0.238, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24797.png", "title": "Complex KDA: Understanding and Enhancing the Expressivity of Kimi Delta Attention", "tldr": "CKDA\u63d0\u5347Kimi Delta Attention\u8868\u8fbe\u529b", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa Complex KDA\uff0c\u901a\u8fc7\u5c06\u95e8\u63a7\u6269\u5c55\u5230[-1,1]\u3001\u5c06delta-rule\u7cfb\u6570\u03b2\u6269\u5c55\u5230[0,2]\uff0c\u8ba9\u5355\u6b21KDA\u8f6c\u79fb\u5373\u53ef\u5b9e\u73b0\u4e8c\u7ef4\u65cb\u8f6c\u7b49\u66f4\u5f3a\u72b6\u6001\u8ddf\u8e2a\u80fd\u529b\u3002\u4f5c\u8005\u4ece\u7406\u8bba\u4e0a\u523b\u753b\u5176\u8868\u8fbe\u529b\uff0c\u5e76\u5728\u5408\u6210\u7fa4\u4efb\u52a1\u3001\u97f3\u9891\u7eed\u5199\u548c\u8bed\u8a00\u5efa\u6a21\u4e2d\u9a8c\u8bc1\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5728\u4e0d\u663e\u8457\u589e\u52a0\u7ebf\u6027RNN\u8ba1\u7b97\u6210\u672c\u7684\u524d\u63d0\u4e0b\u63d0\u5347\u4e86KDA\u7684\u7406\u8bba\u8868\u8fbe\u529b\u548c\u957f\u5ea6\u5916\u63a8\u80fd\u529b\uff0c\u4e3a\u9ad8\u6548\u957f\u5e8f\u5217\u5efa\u6a21\u63d0\u4f9b\u4e86\u66f4\u5f3a\u7684\u7ed3\u6784\u5316\u6ce8\u610f\u529b\u66ff\u4ee3\u65b9\u6848\u3002"}, {"abstract": "In this paper, we propose SVEET, a framework that requires merely training on a pretrained bidirectional video diffusion model but supports high-quality streaming video editing in an auto-regressive fashion. To tackle this problem, we first systematically revisit existing video-to-video diffusion approaches and identify two key principles for such streaming adaptation: backbone feature disentanglement and conditional frame independence. Building on these insights, we develop a novel paradigm for controllable video generation. At its core, an auxiliary model branch encodes source video inputs with temporally independent self-attention, and the intermediate features are injected into the corresponding backbone blocks for streaming-compatible control. Moreover, to bridge the discrepancy between the feature spaces of bidirectional and streaming models, we propose a decoupled training scheme that explicitly enforces the orthogonality between the optimization directions of video controllability and model causality. Such disentanglement ensures compatibility between the two objectives at inference and facilitates smooth zero-shot knowledge transfer across heterogeneous backbone architectures. Extensive experiments demonstrate that SVEET achieves superior editing quality while maintaining real-time performance, attaining 15 FPS on a single H100 GPU 17 without any auxiliary acceleration techniques. Codes are available at https://github.com/YujiaHu1109/SVEET.", "arxiv_id": "2609.24788", "arxiv_url": "https://arxiv.org/abs/2609.24788", "authors": ["Yujia Hu", "Jiajun Li", "Zihao He", "Songhua Liu"], "brief": "\u8bba\u6587\u63d0\u51fa SVEET\uff0c\u4e00\u4e
