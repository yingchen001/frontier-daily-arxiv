const PAPERS = [{"abstract": "An LLM agent\u0027s capability is largely magnified by its harness, namely the prompts, control flow, tooling, memory, and context management surrounding the frozen backbone model. Recent methods increasingly automate this process by iteratively proposing and selecting component-wise edits of an agent harness, practically establishing a form of recursive self-improvement (RSI) at the agent-system level. However, such recursive evolution may overfit by memorizing the training tasks, showing large in-distribution gains that shrink or even vanish on out-of-distribution benchmarks. We introduce Regularized Recursive Self-Improvement of Agent Harnesses (RRSI), which incorporates the principles of regularizations into harness self-improvement by constraining the evolution candidate proposal and selection. The proposer operates with a temporally annealed budget, limiting how many edits a candidate can bundle, and it encourages unexplored trajectories based on evolution history. The selector is equipped with a critic and a pruner: the critic screens benchmark-specific proposals, while the pruner, removes changes that are too small, too expensive, or no longer useful. Together these constraints favor reusable agent mechanisms over benchmark-specific ones or even noises. Across eight benchmarks spanning coding, agentic workspace and engineering design tasks, RRSI gains up to 14.1 points on the split it evolves against and up to 4.7 points on the five out-of-distribution benchmarks, while producing a harness that runs on 30% fewer policy tokens than the unregularized evolution. Code is available at https://github.com/google-research/rrsi and project page is https://regularized-rsi.com/.", "arxiv_id": "2609.24972", "arxiv_url": "https://arxiv.org/abs/2609.24972", "authors": ["Peng Xia", "Rujun Han", "Zifeng Wang", "Yanfei Chen", "Yufan Zhang", "Yoonho Lee", "Chengsong Huang", "Han Yu", "Zhongying CuiZhu", "Yifei Ming", "Huaxiu Yao", "Burak Gokturk" mputer use / agent \u76f8\u5173", "HF trending (158\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24972.png", "title": "RRSI: Regularized Recursive Self-Improvement of Agent Harnesses", "tldr": "\u6b63\u5219\u5316\u667a\u80fd\u4f53\u6846\u67b6\u81ea\u6211\u6539\u8fdb\uff0c\u63d0\u5347\u6cdb\u5316\u4e0e\u6548\u7387", "upvotes": 158, "what_it_is": "\u8bba\u6587\u63d0\u51fa RRSI\uff0c\u7528\u6b63\u5219\u5316\u7ea6\u675f LLM \u667a\u80fd\u4f53 harness\uff08\u63d0\u793a\u3001\u63a7\u5236\u6d41\u3001\u5de5\u5177\u3001\u8bb0\u5fc6\u4e0e\u4e0a\u4e0b\u6587\u7ba1\u7406\uff09\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u8fc7\u7a0b\u3002\u5b83\u901a\u8fc7\u9650\u5236\u5019\u9009\u4fee\u6539\u3001\u9f13\u52b1\u63a2\u7d22\u3001\u7b5b\u9664\u8fc7\u62df\u5408\u6216\u4f4e\u4ef7\u503c\u6539\u52a8\uff0c\u8ba9\u8fdb\u5316\u51fa\u7684\u667a\u80fd\u4f53\u673a\u5236\u66f4\u53ef\u590d\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u667a\u80fd\u4f53\u7cfb\u7edf\u7ea7\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u4e2d\u7684\u8fc7\u62df\u5408\u95ee\u9898\u7ed9\u51fa\u7cfb\u7edf\u6027\u6b63\u5219\u5316\u65b9\u6848\uff0c\u4e0d\u53ea\u8ffd\u6c42\u8bad\u7ec3\u4efb\u52a1\u6027\u80fd\uff0c\u8fd8\u663e\u8457\u6539\u5584\u5206\u5e03\u5916\u6cdb\u5316\u4e0e\u8fd0\u884c\u6210\u672c\uff0c\u5bf9\u81ea\u52a8\u5316\u6784\u5efa\u9ad8\u6548\u53ef\u9760\u7684 LLM agent harness \u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent advances in video generative models have enabled high-fidelity, temporally coherent video generation. However, these models often struggle to satisfy prompts requiring specialized knowledge, specific identities, physical consistency, or ordered events. In this paper, we present VideoGen-Agent, a multimodal agent trained through multitask agentic reinforcement learning to use external tools for video generation. The agent coordinates augmentation, generation, and verification tools through multi-turn interactions, using the prompt and intermediate observations to guide its decisions. We train a shared policy on a category-balanced dataset spanning six tasks. Supervised fine-tuning on teacher-generated trajectories establishes tool-use behavior, which is then refined through reinforcement learning. A category-aware hybrid reward evaluates tool-call validity, task-appropriate tool use, and generated video quality. We further introduce VABench, a held-out benchmark of 600 prompts covering procedural knowledge, single- and multi-entity identity preservation, physical consistency, scene composition, and multi-shot temporal structure. On VABench, VideoGen-Agent improves over its base text-to-video generator by 19.1 points, from 56.5 to 75.6. Upgrading the generation tools further raises the score to 86.1 without additional agent training. Human raters prefer the upgraded configuration over the strongest standalone baseline in 84.3% of comparisons. These results support learning tool use across video-generation tasks and show that the trained agent can benefit from subsequent advances in generation tools.", "arxiv_id": "2609.24997", "arxiv_url": "https://arxiv.org/abs/2609.24997", "authors": ["Binxu Li", "Haoyi Duan", "Yuhui Zhang", "Yaohui Zhang", "Zihao Lin", "Kaituo Feng", "Suozhi Huang", "Xiangyi Li", "Yu Li", "Chunyuan Li", "Shilong Liu", "Mengdi Wang"], "brief": "\u8bba\u6587\u63d0\u51fa VideoGen-Agent\uff0c\u4e00\u4e2a\u591a\u6a21\u6001\u89c6\u9891\u751f\u6210\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u591a\u4efb\u52a1\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u5b66\u4f1a\u8c03\u7528\u589e\u5f3a\u3001\u751f\u6210\u4e0e\u9a8c\u8bc1\u5de5\u5177\u3002\u5b83\u80fd\u9488\u5bf9\u8eab\u4efd\u4fdd\u6301\u3001\u7269\u7406\u4e00\u81f4\u6027\u3001\u4e8b\u4ef6\u987a\u5e8f\u7b49\u590d\u6742\u63d0\u793a\u8fdb\u884c\u591a\u8f6e\u89c4\u5212\u4e0e\u6821\u9a8c\uff0c\u63d0\u5347\u89c6\u9891\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24997", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u5171\u4eab\u7b56\u7565\uff0c\u5148\u7528\u6559\u5e08\u8f68\u8ff9\u76d1\u7763\u5fae\u8c03\u5efa\u7acb\u5de5\u5177\u4f7f\u7528\u80fd\u529b\uff0c\u518d\u7528\u5f3a\u5316\u5b66\u4e60\u8fdb\u4e00\u6b65\u4f18\u5316\u51b3\u7b56\u3002", "\u8bbe\u8ba1\u7c7b\u522b\u611f\u77e5\u6df7\u5408\u5956\u52b1\uff0c\u7efc\u5408\u8bc4\u4f30\u5de5\u5177\u8c03\u7528\u5408\u6cd5\u6027\u3001\u4efb\u52a1\u5339\u914d\u5ea6\u548c\u751f\u6210\u89c6\u9891\u8d28\u91cf\u3002", "\u63d0\u51fa VABench\uff0c\u5305\u542b600\u4e2a\u590d\u6742\u63d0\u793a\uff0c\u8986\u76d6\u8fc7\u7a0b\u77e5\u8bc6\u3001\u8eab\u4efd\u4fdd\u6301\u3001\u7269\u7406\u4e00\u81f4\u6027\u3001\u573a\u666f\u6784\u56fe\u548c\u591a\u955c\u5934\u65f6\u5e8f\u7ed3\u6784\uff1b\u5728\u8be5\u57fa\u51c6\u4e0a\u76f8\u5bf9\u57fa\u7840\u6587\u751f\u89c6\u9891\u6a21\u578b\u63d0\u534719.1\u5206\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 3, "on_hf": true, "organization": "Princeton University", "pdf_url": "https://arxiv.org/pdf/2609.24997", "published_at": "2026-09-21", "score": 0.728, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Princeton", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (36\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24997.png", "title": "VideoGen-Agent: Reinforcing Video Generation Agents", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4f1a\u7528\u5de5\u5177\u7684\u89c6\u9891\u751f\u6210\u667a\u80fd\u4f53", "upvotes": 36, "what_it_is": "\u8bba\u6587\u63d0\u51fa VideoGen-Agent\uff0c\u4e00\u4e2a\u591a\u6a21\u6001\u89c6\u9891\u751f\u6210\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u591a\u4efb\u52a1\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u5b66\u4f1a\u8c03\u7528\u589e\u5f3a\u3001\u751f\u6210\u4e0e\u9a8c\u8bc1\u5de5\u5177\u3002\u5b83\u80fd\u9488\u5bf9\u8eab\u4efd\u4fdd\u6301\u3001\u7269\u7406\u4e00\u81f4\u6027\u3001\u4e8b\u4ef6\u987a\u5e8f\u7b49\u590d\u6742\u63d0\u793a\u8fdb\u884c\u591a\u8f6e\u89c4\u5212\u4e0e\u6821\u9a8c\uff0c\u63d0\u5347\u89c6\u9891\u751f\u6210\u8d28\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u667a\u80fd\u4f53\u5f0f\u5de5\u5177\u4f7f\u7528\u201d\u7cfb\u7edf\u5f15\u5165\u89c6\u9891\u751f\u6210\u6d41\u7a0b\uff0c\u663e\u793a\u8bad\u7ec3\u51fa\u7684\u4ee3\u7406\u4e0d\u4ec5\u80fd\u663e\u8457\u63d0\u5347\u590d\u6742\u63d0\u793a\u9075\u5faa\u80fd\u529b\uff0c\u8fd8\u80fd\u5728\u4e0d\u91cd\u65b0\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\u53d7\u76ca\u4e8e\u540e\u7eed\u66f4\u5f3a\u7684\u89c6\u9891\u751f\u6210\u5de5\u5177\uff0c\u5177\u6709\u8f83\u5f3a\u6269\u5c55\u6027\u548c\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce Qwen3.8-Omni-Flash, a natively multimodal agentic model for real-world multimodal productivity. Compared with previous omni models, which primarily emphasized perception and interaction, Qwen3.8-Omni-Flash substantially improves multimodal understanding and reasoning, as well as performance on long-horizon agentic tasks. These capabilities are supported by a native multimodal co-training strategy that preserves strong text-domain capabilities while facilitating the transfer of agentic capabilities from text to audio and video tasks. The model inherits the sparse mixture-of-experts (MoE) architecture of Qwen3.8-Next and extends the context window to one million tokens, supporting long-context multimodal reasoning and long-horizon planning. These advances enable integration into production workflows as a primary agent or a specialized sub-agent, supporting video editing, long-form audio and video translation, music-conditioned music video or movie generation, and video-based note or omni-skill creation. To address the lack of native audio and video support in existing agent harnesses, we release Qwen-MM-Plugins, a lightweight open-source plugin framework for multimodal productivity. We further frame real-time multimodal interaction as a system-level challenge requiring orchestration of context and memory management, tool use, and sub-agent delegation. Accordingly, we release Qwen-Live-Harness, an open-source framework for building responsive, real-time multimodal agents based on Qwen3.8-Omni-Flash. Extensive evaluations demonstrate that Qwen3.8-Omni-Flash achieves strong performance across multimodal understanding, reasoning, long-horizon agentic execution, and video productivity tasks. These results and the accompanying open-source tools support Qwen3.8-Omni-Flash as a practical foundation for deploying natively multimodal agents in research and production.", "arxiv_id": "2609.25611", "arxiv_url": "https://arxiv.org/abs/2609.25611", "authors": ["Qwen Team"], "brief": "\u8bba\u6587\u4ecb\u7ecd Qwen3.8-Omni-Flash\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u591a\u6a21\u6001\u751f\u4ea7\u529b\u573a\u666f\u7684\u539f\u751f\u591a\u6a21\u6001\u667a\u80fd\u4f53\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u539f\u751f\u591a\u6a21\u6001\u8054\u5408\u8bad\u7ec3\u3001\u767e\u4e07\u7ea7\u4e0a\u4e0b\u6587\u4e0e\u5de5\u5177/\u63d2\u4ef6\u6846\u67b6\uff0c\u63d0\u5347\u97f3\u9891\u3001\u89c6\u9891\u3001\u6587\u672c\u4e0a\u7684\u7406\u89e3\u3001\u63a8\u7406\u548c\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.CV", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25611", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u7ee7\u627f Qwen3.8-Next \u7684\u7a00\u758f MoE \u67b6\u6784\uff0c\u5e76\u5c06\u4e0a\u4e0b\u6587\u7a97\u53e3\u6269\u5c55\u5230 100 \u4e07 token\uff0c\u652f\u6301\u957f\u4e0a\u4e0b\u6587\u591a\u6a21\u6001\u63a8\u7406\u4e0e\u957f\u7a0b\u89c4\u5212\u3002", "\u63d0\u51fa\u539f\u751f\u591a\u6a21\u6001\u8054\u5408\u8bad\u7ec3\u7b56\u7565\uff0c\u5728\u4fdd\u6301\u5f3a\u6587\u672c\u80fd\u5 ftware engineering (SWE) comprises heterogeneous task categories, whose progress under pooled agentic reinforcement learning can be uneven: gains in some categories coincide with regressions in others, while aggregate resolution obscures these changes. Motivated by this category see-saw, we develop a category-aware expert-training and policy-integration framework. Executable task construction and SWE Labeler, an evidence-grounded multi-axis labeling system, organize the training pools. Initial category-specific RL improves average training success while leaving uneven instance-level progress, motivating explicit consolidation of successful behavior and policy-adaptive task selection. Same-origin category experts alternate long-horizon Agentic-miniRL with Refresh-Repair-Expand (RRE): the updated policy refreshes instance mastery, reuses its own verified successful trajectories for Repair SFT, and reselects tasks for further RL. Label-routed multi-teacher on-policy distillation (MOPD) consolidates the experts into one deployable student, with ReLU-gated reward extrapolation keeping only each teacher\u0027s improving direction over the reference. Expert training and policy integration require no external model to provide solution trajectories or action targets. We evaluate Pooled RL and Balanced RL, expert development, and single-model integration through aggregate and per-category resolution, the minimum category lift over each joint-RL baseline, and expert-gain recovery. The final MOPD policy achieves mean resolution of 58.04% on Pro-618 and 59.00% on SWE-bench Multilingual, improving over the base model by 5.39 and 2.78 percentage points, respectively.", "arxiv_id": "2609.23377", "arxiv_url": "https://arxiv.org/abs/2609.23377", "authors": ["Jie Zhao", "Ziyu Jiang", "Suhang Zheng", "Minghui Shan", "Xiaoxiao Xu", "Lin Qu"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u4ed3\u5e93\u7ea7\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u7684\u7c7b\u522b\u611f\u77e5\u4e13\u5bb6\u8b .co/social-thumbnails/papers/2609.23377.png", "title": "One to More, More to One: Category-Aware Iterative Expert Training for Software Engineering Agents", "tldr": "\u7c7b\u522b\u611f\u77e5\u8bad\u7ec3\u63d0\u5347\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53", "upvotes": 23, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u4ed3\u5e93\u7ea7\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u7684\u7c7b\u522b\u611f\u77e5\u4e13\u5bb6\u8bad\u7ec3\u4e0e\u7b56\u7565\u6574\u5408\u6846\u67b6\uff0c\u7f13\u89e3\u6df7\u5408\u4efb\u52a1\u5f3a\u5316\u5b66\u4e60\u4e2d\u4e0d\u540c\u7c7b\u522b\u6b64\u6d88\u5f7c\u957f\u7684\u95ee\u9898\u3002\u65b9\u6cd5\u5148\u8bad\u7ec3\u7c7b\u522b\u4e13\u5bb6\uff0c\u518d\u901a\u8fc7\u6807\u7b7e\u8def\u7531\u7684\u591a\u6559\u5e08\u5728\u7ebf\u84b8\u998f\u5408\u5e76\u4e3a\u5355\u4e00\u53ef\u90e8\u7f72\u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u9762\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u5728\u591a\u7c7b\u522b\u4efb\u52a1\u4e0a\u5e73\u5747\u6307\u6807\u63a9\u76d6\u9000\u5316\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u65e0\u9700\u5916\u90e8\u6a21\u578b\u8f68\u8ff9\u76d1\u7763\u7684\u4e13\u5bb6\u8bad\u7ec3\u4e0e\u6574\u5408\u65b9\u6848\uff1b\u5728 Pro-618 \u548c SWE-bench Multilingual \u4e0a\u5206\u522b\u8fbe\u5230 58.04% \u4e0e 59.00% \u5e73\u5747\u89e3\u51b3\u7387\uff0c\u8f83\u57fa\u5ea7\u6a21\u578b\u6709\u7a33\u5b9a\u63d0\u5347\u3002"}, {"abstract": "Agent harnesses, the external systems that mediate model-environment interaction, can substantially improve agent performance, but their gains remain tied to the harness at deployment. Because the best harness varies across domains, instances, and models, a general-purpose agent must either settle for a suboptimal shared harness or route among an ever-growing set of specialized ones. We therefore study agent harness distillation: using a domain- or instance-optimized harness as training-time guidance and transferring the behaviors it induces into model weights, so that its gains survive under a single fixed target harness. The challenge is that the two harnesses differ in action space and available information, so guidance from the optimized harness cannot serve directly as supervision for the target one. We introduce Harness-Zero, which enables harness distillation through agent-as-harness. Guided by the optimized harness, a harnessing agent corrects student responses before execution in the target harness\u0027s action space, turning harness guidance into training demonstrations. Fine-tuning on the resulting trajectories internalizes harness-induced behavior into the model, so the specialized harness can be removed at deployment. Our experiments spanning knowledge work, tool use, and science domains show that: (1) For frontier LLMs using the same evolved harness, agent-as-harness outperforms code-as-harness. (2) With the specialized harness removed at deployment, Harness-Zero improves the base model\u0027s macro-average task success from 23.3% to 44.3%, even exceeding the 41.7% it reaches with that harness still attached. (3) Harness-Zero recovers harness-induced behaviors absent from the base model, with 82.3% average recovery across 28 patterns in the three domains.", "arxiv_id": "2609.24974", "arxiv_url": "https://arxiv.org/abs/2609.24974", "authors": ["Haoran Ye", "Yuxing Lu", "Haonan Dong", "Zhaochen Su", "Guojie Song"], "brief": "\u8bba\u6587\u7814\u7a76\u201c\u667a\u80fd\u4f53\u5916\u58f3\u84b8\u998f\u201d\uff1a\u7528\u9886\u57df\u6216\u5b9e\u4f8b\u4f18\u5316\u7684 harness \u5728\u8bad\u7ec3\u65f6\u63d0\u4f9b\u6307\u5bfc\uff0c\u5e76\u5c06\u5176\u8bf1\u5bfc\u51fa\u7684\u884c\u4e3a\u8fc1\u79fb\u5230\u6a21\u578b\u53c2\u6570\u4e2d\u3002\u63d0\u51fa Harness-Zero\uff0c\u901a\u8fc7 agent-as-harness \u5c06\u4e13\u7528 harness \u7684\u6307\u5bfc\u8f6c\u5316\u4e3a\u76ee\u6807 harness \u52a8\u4f5c\u7a7a\u95f4\u4e0b\u7684\u8bad\u7ec3\u8f68\u8ff9\uff0c\u4f7f\u90e8\u7f72\u65f6\u65e0\u9700\u4fdd\u7559\u4e13\u7528 harness\u3002", "categories": ["cs.AI", "cs.CL", "cs.NE"], "github_repo": "https://github.com/metaevo-ai/harness-zero", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2609.24974", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6838\u5fc3\u96be\u70b9\u662f\u4f18\u5316 harness \u4e0e\u76ee\u6807 harness \u7684\u52a8\u4f5c\u7a7a\u95f4\u548c\u53ef\u7528\u4fe1\u606f\u4e0d\u540c\uff0c\u65e0\u6cd5\u76f4\u63a5\u628a\u524d\u8005\u8f93\u51fa\u4f5c\u4e3a\u76d1\u7763\u4fe1\u53f7\u3002", "Harness-Zero \u8ba9\u4e00\u4e2a\u201charnessing agent\u201d\u5728\u6267\u884c\u524d\u4fee\u6b63\u5b66\u751f\u6a21\u578b\u54cd\u5e94\uff0c\u751f\u6210\u53ef\u7528\u4e8e\u5fae\u8c03\u7684\u76ee\u6807 harness \u8f68\u8ff9\u3002", "\u5728\u77e5\u8bc6\u5de5\u4f5c\u3001\u5de5\u5177\u4f7f\u7528\u548c\u79d1\u5b66\u4efb\u52a1\u4e0a\uff0c\u79fb\u9664\u4e13\u7528 harness \u540e\u4efb\u52a1\u6210\u529f\u7387\u4ece 23.3% \u63d0\u5347\u5230 44.3%\uff0c\u8fd8\u8d85\u8fc7\u4fdd\u7559\u8be5 harness \u65f6\u7684 41.7%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u84b8\u998f", "\u5de5\u5177\u4f7f\u7528", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2609.24974", "published_at": "2026-09-21", "score": 0.656, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24974.png", "title": "Harness-Zero: Harness Distillation via Agent-as-Harness", "tldr": "\u628a\u4e13\u7528\u667a\u80fd\u4f53\u5916\u58f3\u84b8\u998f\u8fdb\u6a21\u578b\u6743\u91cd", "upvotes": 13, "what_it_is": "\u8bba\u6587\u7814\u7a76\u201c\u667a\u80fd\u4f53\u5916\u58f3\u84b8\u998f\u201d\uff1a\u7528\u9886\u57df\u6216\u5b9e\u4f8b\u4f18\u5316\u7684 harness \u5728\u8bad\u7ec3\u65f6\u63d0\u4f9b\u6307\u5bfc\uff0c\u5e76\u5c06\u5176\u8bf1\u5bfc\u51fa\u7684\u884c\u4e3a\u8fc1\u79fb\u5230\u6a21\u578b\u53c2\u6570\u4e2d\u3002\u63d0\u51fa Harness-Zero\uff0c\u901a\u8fc7 agent-as-harness \u5c06\u4e13\u7528 harness \u7684\u6307\u5bfc\u8f6c\u5316\u4e3a\u76ee\u6807 harness \u52a8\u4f5c\u7a7a\u95f4\u4e0b\u7684\u8bad\u7ec3\u8f68\u8ff9\uff0c\u4f7f\u90e8\u7f72\u65f6\u65e0\u9700\u4fdd\u7559\u4e13\u7528 harness\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4ee5\u5f80\u4f9d\u8d56\u5916\u90e8\u7cfb\u7edf\u8bbe\u8ba1\u7684\u667a\u80fd\u4f53\u6027\u80fd\u589e\u76ca\u5185\u5316\u5230\u6a21\u578b\u672c\u8eab\uff0c\u7f13\u89e3\u591a\u9886\u57df\u90e8\u7f72\u4e2d\u9700\u8981\u7ef4\u62a4\u548c\u8def\u7531\u5927\u91cf\u4e13\u7528 harness \u7684\u95ee\u9898\uff0c\u5bf9\u901a\u7528 LLM agent \u7684\u53ef\u8fc1\u79fb\u6027\u548c\u90e8\u7f72\u7b80\u5316\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) has become a key technique for improving the reasoning and agentic abilities of large language models (LLMs). Although FP8 quantization can accelerate RL training, maintaining stability throughout an FP8 RL pipeline remains challenging. While previous works have focused on resolving train-inference mismatches using correction techniques like TIS, we reveal that full-pipeline FP8 RL still suffers from severe training instability, manifesting as anomalous mid-training entropy surges and garbled outputs. We trace this instability to a previously overlooked cause: compounded FP8 quantization noise distorts the importance ratio, disproportionately pushing negative-advantage tokens outside the trust region and erroneously zeroing out their gradients. As a result, pathological outputs are not properly penalized and accumulate over the course of training. To address this, we propose Calibrated Clipping, a dynamic method that aligns the FP8 clipping bounds with high-precision BF16 distributions by matching the lower-bound clipping quantile and rebalancing the upper bound accordingly. Extensive experiments across GRPO and DAPO algorithms, model scales from 8B to 32B, and multiple FP8 scaling granularities demonstrate that our approach successfully eliminates entropy surges and restores performance comparable to the BF16 baseline.", "arxiv_id": "2609.22870", "arxiv_url": "https://arxiv.org/abs/2609.22870", "authors": ["Fanchao Chen", "Ziheng Jiang", "Ziyun Wei", "Zheng Zhong", "Du Li", "Chi Zhang", "Haibin Lin", "Shivaram Venkataraman"], "brief": "\u8bba\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4e2d\u7684\u5168\u6d41\u7a0bFP8\u91cf\u5316\u7a33\u5b9a\u6027\u95ee\u9898\uff0c\u53d1\u73b0\u7d2f\u79ef\u91cf\u5316\u566a\u58f0\u4f1a\u626d\u66f2\u91cd\u8981\u6027\u6bd4\u7387\u5e76\u5bfc\u81f4\u71b5\u5f02\u5e38\u98d9\u5347\u3001\u8f93\u51fa\u4e71\u7801\u3002\u4f5c\u8005\u63d0\u51faCalibrated Clipping\uff0c\u901a\u8fc7\u5bf9\u9f50FP8\u88c1\u526a\u8fb9\u754c\u4e0eBF16\u5206\u5e03\uff0c\u6062\u590d\u63a5\u8fd1BF16\u57fa\u7ebf\u7684\u8bad\u7ec3\u8868\u73b0\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.22870", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63ed\u793a\u5168\u6d41\u7a0bFP8 RL\u4e0d\u7a33\u5b9a\u7684\u65b0\u539f\u56e0\uff1a\u91cf\u5316\u566a\u58f0\u626d\u66f2importance ratio\uff0c\u4f7f\u8d1f\u4f18\u52bftoken\u88ab\u9519\u8bef\u63a8\u51fa\u4fe1\u4efb\u57df\u5e76\u68af\u5ea6\u5f52\u96f6\u3002", "\u63d0\u51fa\u52a8\u6001Calibrated Clipping\uff0c\u5339\u914dBF16\u5206\u5e03\u7684\u4e0b\u754c\u88c1\u526a\u5206\u4f4d\u6570\uff0c\u5e76\u76f8\u5e94\u91cd\u5e73\u8861\u4e0a\u754c\u3002", "\u5728GRPO\u3001DAPO\uff0c8B\u523032B\u6a21\u578b\u53ca\u591a\u79cdFP8\u7f29\u653e\u7c92\u5ea6\u4e0a\u9a8c\u8bc1\uff0c\u53ef\u6d88\u9664\u71b5\u98d9\u5347\u5e76\u6062\u590d\u6027\u80fd\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u91cf\u5316", "\u8bad\u7ec3\u7a33\u5b9a\u6027"], "num_comments": 2, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2609.22870", "published_at": "2026-09-19", "score": 0.616, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.22870.png", "title": "Towards Full Pipeline FP8 Reinforcement Learning for LLMs", "tldr": "\u7528\u6821\u51c6\u88c1\u526a\u7a33\u5b9a\u5168\u6d41\u7a0bFP8\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3", "upvotes": 5, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4e2d\u7684\u5168\u6d41\u7a0bFP8\u91cf\u5316\u7a33\u5b9a\u6027\u95ee\u9898\uff0c\u53d1\u73b0\u7d2f\u79ef\u91cf\u5316\u566a\u58f0\u4f1a\u626d\u66f2\u91cd\u8981\u6027\u6bd4\u7387\u5e76\u5bfc\u81f4\u71b5\u5f02\u5e38\u98d9\u5347\u3001\u8f93\u51fa\u4e71\u7801\u3002\u4f5c\u8005\u63d0\u51faCalibrated Clipping\uff0c\u901a\u8fc7\u5bf9\u9f50FP8\u88c1\u526a\u8fb9\u754c\u4e0eBF16\u5206\u5e03\uff0c\u6062\u590d\u63a5\u8fd1BF16\u57fa\u7ebf\u7684\u8bad\u7ec3\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u6307LLM\u5f3a\u5316\u5b66\u4e60\u4f4e\u7cbe\u5ea6\u8bad\u7ec3\u7684\u5173\u952e\u74f6\u9888\uff0c\u4e3a\u66f4\u9ad8\u6548\u3001\u66f4\u4f4e\u6210\u672c\u5730\u8bad\u7ec3\u63a8\u7406\u578b\u548c\u5bf9\u9f50\u578b\u6a21\u578b\u63d0\u4f9b\u4e86\u5b9e\u7528\u7a33\u5b9a\u65b9\u6848\u3002"}, {"abstract": "Video world models enable interactive exploration of dynamic environments, yet struggle to respect prior observations over long horizons and across viewpoints. We present WorldCrafter, a video world model that learns a camera-queryable implicit 3D-aware memory for this purpose. The key insight is to let the requested viewpoint shape how multi-view evidence is compressed into the video generator\u0027s limited token budget. Trained jointly with the video generator, a memory encoder and pose-conditioned readout module integrate historical observations into a fixed set of target view-specific tokens before denoising, without explicit depth-based correspondences. By combining this memory with recent temporal context and few-step distillation, WorldCrafter enables streaming scene exploration from a single input image or text prompt. Experiments across static and dynamic scenes show substantial gains in long-horizon consistency and camera-control accuracy while preserving visual quality during minute-scale exploration.", "arxiv_id": "2609.24984", "arxiv_url": "https://arxiv.org/abs/2609.24984", "authors": ["Wangbo Yu", "Kunhao Liu", "Wenbo Hu", "Shenghai Yuan", "Chaoran Feng", "Haiyang Zhou", "Yukun Huang", "Yiran Wang", "Wang Zhao", "Yingmin Luo", "Ying Shan"], "brief": "WorldCrafter \u63d0\u51fa\u4e00\u79cd\u53ef\u7531\u76f8\u673a\u89c6\u89d2\u67e5\u8be2\u7684\u9690\u5f0f 3D \u611f\u77e5\u8bb0\u5fc6\uff0c\u5e76\u4e0e\u89c6\u9891\u751f\u6210\u5668\u8054\u5408\u8bad\u7ec3\u3002\u5b83\u80fd\u4ece\u5355\u5f20\u56fe\u50cf\u6216\u6587\u672c\u63d0\u793a\u51fa\u53d1\uff0c\u652f\u6301\u6d41\u5f0f\u573a\u666f\u63a2\u7d22\uff0c\u5e76\u5728\u957f\u65f6\u95f4\u3001\u591a\u89c6\u89d2\u751f\u6210\u4e2d\u4fdd\u6301\u66f4\u597d\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV", "cs.AI", "cs.GR"], "github_repo": "https://github.com/TencentARC/WorldCrafter", "github_stars": 237, "hf_url": "https://huggingface.co/papers/2609.24984", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528\u76ee\u6807\u89c6\u89d2\u5f15\u5bfc\u591a\u89c6\u89d2\u5386\u53f2\u89c2\u6d4b\u538b\u7f29\uff0c\u5c06\u8bc1\u636e\u7f16\u7801\u6210\u56fa\u5b9a\u6570\u91cf\u7684\u89c6\u89d2\u7279\u5b9a token\uff0c\u9002\u914d\u89c6\u9891\u751f\u6210\u5668\u6709\u9650 token \u9884\u7b97", "\u8bb0\u5fc6\u7f16\u7801\u5668\u4e0e\u59ff\u6001\u6761\u4ef6\u8bfb\u51fa\u6a21\u5757\u8054\u5408\u8bad\u7ec3\uff0c\u65e0\u9700\u663e\u5f0f\u6df1\u5ea6\u6216\u51e0\u4f55\u5bf9\u5e94\u5373\u53ef\u6574\u5408\u5386\u53f2\u89c2\u6d4b", "\u7ed3\u5408\u8fd1\u671f\u65f6\u5e8f\u4e0a\u4e0b\u6587\u4e0e\u5c11\u6b65\u84b8\u998f\uff0c\u5728\u9759\u6001\u548c\u52a8\u6001\u573a\u666f\u4e2d\u63d0\u5347\u5206\u949f\u7ea7\u63a2\u7d22\u7684\u4e00\u81f4\u6027\u4e0e\u76f8\u673a\u63a7\u5236\u7cbe\u5ea6"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u4e09\u7ef4\u611f\u77e5", "\u591a\u6a21\u6001"], "num_comments": 4, "on_hf": true, "organization": "ARC Lab, Tencent", "pdf_url": "https://arxiv.org/pdf/2609.24984", "published_at": "2026-09-21", "score": 0.606, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (114\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24984.png", "title": "WorldCrafter: Consistent Video World Model with Implicit 3D-aware Memory", "tldr": "\u5e263D\u8bb0\u5fc6\u7684\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u63d0\u5347\u957f\u7a0b\u4e00\u81f4\u6027", "upvotes": 114, "what_it_is": "WorldCrafter \u63d0\u51fa\u4e00\u79cd\u53ef\u7531\u76f8\u673a\u89c6\u89d2\u67e5\u8be2\u7684\u9690\u5f0f 3D \u611f\u77e5\u8bb0\u5fc6\uff0c\u5e76\u4e0e\u89c6\u9891\u751f\u6210\u5668\u8054\u5408\u8bad\u7ec3\u3002\u5b83\u80fd\u4ece\u5355\u5f20\u56fe\u50cf\u6216\u6587\u672c\u63d0\u793a\u51fa\u53d1\uff0c\u652f\u6301\u6d41\u5f0f\u573a\u666f\u63a2\u7d22\uff0c\u5e76\u5728\u957f\u65f6\u95f4\u3001\u591a\u89c6\u89d2\u751f\u6210\u4e2d\u4fdd\u6301\u66f4\u597d\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u9762\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5728\u957f\u7a0b\u4ea4\u4e92\u63a2\u7d22\u4e2d\u5bb9\u6613\u9057\u5fd8\u5148\u524d\u89c2\u6d4b\u3001\u8de8\u89c6\u89d2\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\uff0c\u4ee5\u9690\u5f0f 3D \u8bb0\u5fc6\u589e\u5f3a\u751f\u6210\u6a21\u578b\uff0c\u517c\u987e\u53ef\u63a7\u6027\u3001\u89c6\u89c9\u8d28\u91cf\u548c\u6d41\u5f0f\u6548\u7387\uff0c\u5bf9\u865a\u62df\u73af\u5883\u751f\u6210\u3001\u4eff\u771f\u548c\u4ea4\u4e92\u5f0f\u5185\u5bb9\u521b\u4f5c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Modern video games provide a measurable testbed for AI models, combining abilities of visual understanding, instruction decomposition, goal planning, and precise action control over multiple temporal horizons. Existing datasets and benchmarks, however, either cover a narrow range of games, lack language instructions, or rely on high-variance online rollouts. To address these challenges, we introduce GameHorizon, a unified data and evaluation suite that measures gameplay capabilities at different horizons for diverse model families. GameHorizon Suite consists of three components. First, GameHorizon-Annotator is a scalable and automated annotation pipeline for multi-horizon instructions. Second, utilizing the pipeline, we construct GameHorizon-Data, the first large-scale AAA gameplay dataset with temporally aligned videos, player actions, and multi-horizon instructions. It comprises 5,000 hours of recordings from 21 games, collected by 100 human expert players. Third, we build GameHorizon-Bench with reproducible offline and stepwise online testing. The offline track enables reproducible evaluation using thousands of standardized questions organized into three primary tasks and a series of diagnostic variants, while the online track tests whether offline scores reflect actual gameplay capabilities and localizes failures to specific steps within long-horizon gameplay. Based on our GameHorizon Suite, we evaluate 47 models through more than one million model invocations, revealing a meaningful hierarchy of task difficulty and pronounced differences in model capabilities. Our work can provide a standardized yardstick for evaluating gameplay capabilities across horizons and model families. We will release our dataset, annotator, and benchmark to facilitate future research.", "arxiv_id": "2609.25001", "arxiv_url": "https://arxiv.org/abs/2609.25001", "authors": ["Yiran Wang", "Xingyilang Yin", "Junfu Pu", "Guangzhi Wang", "Kaifeng Li", "Mingyu Ouyang", "Huiqiang Sun", "Lingen Li", "Cheng Cheng", "Wangbo Yu", "Honghao Chen", "Xiaodong Cun", "Chi-Man Pun", "Zhiguo Cao", "Ying Shan"], "brief": "\u8bba\u6587\u63d0\u51fa GameHorizon Suite\uff0c\u7528\u4e8e\u7edf\u4e00\u8bc4\u4f30 AI \u6a21\u578b\u5728\u73b0\u4ee3\u89c6\u9891\u6e38\u620f\u4e2d\u7684\u89c6\u89c9\u7406\u89e3\u3001\u6307\u4ee4\u5206\u89e3\u3001\u76ee\u6807\u89c4\u5212\u4e0e\u52a8\u4f5c\u63a7\u5236\u80fd\u529b\u3002\u5b83\u5305\u542b\u81ea\u52a8\u6807\u6ce8\u7ba1\u7ebf\u3001\u5927\u89c4\u6a21 AAA \u6e38\u620f\u6570\u636e\u96c6\uff0c\u4ee5\u53ca\u53ef\u590d\u73b0\u7684\u79bb\u7ebf\u4e0e\u5728\u7ebf\u8bc4\u6d4b\u57fa\u51c6\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/TencentARC/GameHorizon", "github_stars": 126, "hf_url": "https://huggingface.co/papers/2609.25001", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["GameHorizon-Data \u6536\u96c6\u4e86 21 \u6b3e AAA \u6e38\u620f\u3001100 \u540d\u4eba\u7c7b\u4e13\u5bb6\u73a9\u5bb6\u3001\u5171 5000 \u5c0f\u65f6\u7684\u6e38\u620f\u89c6\u9891\u3001\u52a8\u4f5c\u4e0e\u591a\u65f6\u57df\u8bed\u8a00\u6307\u4ee4\u5bf9\u9f50\u6570\u636e", "GameHorizon-Annotator \u63d0\u4f9b\u53ef\u6269\u5c55\u7684\u81ea\u52a8\u5316\u591a\u65f6\u57df\u6307\u4ee4\u6807\u6ce8\u6d41\u7a0b\uff0c\u8986\u76d6\u77ed\u671f\u3001\u4e2d\u671f\u4e0e\u957f\u671f\u6e38\u620f\u76ee\u6807", "GameHorizon-Bench \u7ed3\u5408\u79bb\u7ebf\u6807\u51c6\u5316\u95ee\u7b54\u4e0e\u5206\u6b65\u5728\u7ebf\u6d4b\u8bd5\uff0c\u53ef\u8bc4\u4f30\u771f\u5b9e gameplay \u80fd\u529b\u5e76\u5b9a\u4f4d\u957f\u7a0b\u4efb\u52a1\u5931\u8d25\u6b65\u9aa4"], "keywords": ["\u667a\u80fd\u4f53", "\u6e38\u620fAI", "\u591a\u6a21\u6001", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 3, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2609.25001", "published_at": "2026-09-21", "score": 0.599, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (111\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.25001.png", "title": "GameHorizon Suite: Multi-Horizon Data and Evaluation in Gameplay", "tldr": "\u9762\u5411\u591a\u65f6\u57df\u6e38\u620f\u80fd\u529b\u7684\u5927\u89c4\u6a21\u6570\u636e\u4e0e\u8bc4\u6d4b\u5957\u4ef6", "upvotes": 111, "what_it_is": "\u8bba\u6587\u63d0\u51fa GameHorizon Suite\uff0c\u7528\u4e8e\u7edf\u4e00\u8bc4\u4f30 AI \u6a21\u578b\u5728\u73b0\u4ee3\u89c6\u9891\u6e38\u620f\u4e2d\u7684\u89c6\u89c9\u7406\u89e3\u3001\u6307\u4ee4\u5206\u89e3\u3001\u76ee\u6807\u89c4\u5212\u4e0e\u52a8\u4f5c\u63a7\u5236\u80fd\u529b\u3002\u5b83\u5305\u542b\u81ea\u52a8\u6807\u6ce8\u7ba1\u7ebf\u3001\u5927\u89c4\u6a21 AAA \u6e38\u620f\u6570\u636e\u96c6\uff0c\u4ee5\u53ca\u53ef\u590d\u73b0\u7684\u79bb\u7ebf\u4e0e\u5728\u7ebf\u8bc4\u6d4b\u57fa\u51c6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u9f50\u4e86\u6e38\u620f\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e2d\u6570\u636e\u89c4\u6a21\u5c0f\u3001\u7f3a\u5c11\u8bed\u8a00\u6307\u4ee4\u3001\u5728\u7ebf\u8bc4\u6d4b\u65b9\u5dee\u9ad8\u7b49\u95ee\u9898\uff0c\u4e3a\u8de8\u6a21\u578b\u3001\u8de8\u65f6\u57df\u7684\u6e38\u620f\u80fd\u529b\u8bc4\u4f30\u63d0\u4f9b\u6807\u51c6\u5316\u6807\u5c3a\uff0c\u5e76\u901a\u8fc7 47 \u4e2a\u6a21\u578b\u3001\u8d85\u767e\u4e07\u6b21\u8c03\u7528\u63ed\u793a\u4e86\u4e0d\u540c\u6a21\u578b\u80fd\u529b\u5dee\u5f02\u3002"}, {"abstract": "Educational foundation models must solve problems, understand curriculum structure, diagnose learner difficulties, and provide appropriate instructional support. Existing educational language models often focus on either problem solving or tutoring, with training mixtures organized by source or task rather than capability. We present OmniEdu, an open family of foundation models for K-12 learning and teaching. Its instruction-tuning corpus combines over 100 educational resources and general instruction sources, organized around four capabilities: subject competence, curriculum grounding, diagnostic reasoning, and pedagogical action and scaffolding. Our pipeline integrates deterministic cleaning, semantic auditing and rewriting, task-specific quality scoring, token-budgeted diversity selection, and pedagogical instruction assignment. It yields 69,999 examples and 15.96M supervised response tokens, including 60,951 education-specific examples. We fine-tune 4B, 9B, and 27B models and evaluate curriculum grounding, K-12 problem solving, and pedagogical tutoring, alongside general capability. Education-oriented tuning consistently improves all three educational benchmark groups across model scales. OmniEdu-27B achieves 63.12% EM and 76.69% F1 on K12-Bench, 85.89% on MathFish, 86.95% on EDUMATH, and 78.74% in MathTutorBench\u0027s Scaffold setting. It also achieves the highest Teaching average on LongTutor among the evaluated models, at 3.02. These results demonstrate the value of curated, capability-balanced supervision for adapting general language models to educational tasks spanning problem solving, curriculum understanding, and instructional support.", "arxiv_id": "2609.23088", "arxiv_url": "https://arxiv.org/abs/2609.23088", "authors": ["Hao Liang", "Qihan Lin", "Meiyi Qiang", "Linzhuang Sun", "Hengyi Feng", "Mingrui Chen", "Sizhe Qiu", "Wentao Zhang"], "brief": "OmniEdu \u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411K-12\u5b66\u4e60\u4e0e\u6559\u5b66\u7684\u5f00\u653e\u6559\u80b2\u57fa\u7840\u6a21\u578b\u5bb6\u65cf\uff0c\u5e76\u56f4\u7ed5\u5b66\u79d1\u80fd\u529b\u3001\u8bfe\u7a0b\u5bf9\u9f50\u3001\u8bca\u65ad\u63a8\u7406\u548c\u6559\u5b66\u652f\u67b6\u56db\u7c7b\u80fd\u529b\u7ec4\u7ec7\u6307\u4ee4\u5fae\u8c03\u6570\u636e\u3002\u8bba\u6587\u5c55\u793a\u4e864B\u30019B\u300127B\u6a21\u578b\u5728\u89e3\u9898\u3001\u8bfe\u7a0b\u7406\u89e3\u548c\u8f85\u5bfc\u6559\u5b66\u7b49\u6559\u80b2\u4efb\u52a1\u4e0a\u7684\u7cfb\u7edf\u63d0\u5347\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/haolpku/Omni-Edu", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2609.23088", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6307\u4ee4\u5fae\u8c03\u8bed\u6599\u6574\u5408100\u591a\u4e2a\u6559\u80b2\u4e0e\u901a\u7528\u6307\u4ee4\u8d44\u6e90\uff0c\u5f97\u523069,999\u6761\u6837\u672c\u300115.96M\u76d1\u7763\u54cd\u5e94token\uff0c\u5176\u4e2d60,951\u6761\u4e3a\u6559\u80b2\u4e13\u7528\u6837\u672c", "\u6570\u636e\u7ba1\u7ebf\u5305\u62ec\u786e\u5b9a\u6027\u6e05\u6d17\u3001\u8bed\u4e49\u5ba1\u8ba1\u4e0e\u91cd\u5199\u3001\u4efb\u52a1\u8d28\u91cf\u6253\u5206\u3001token\u9884\u7b97\u4e0b\u591a\u6837\u6027\u9009\u62e9\uff0c\u4ee5\u53ca\u6559\u5b66\u6307\u4ee4\u5206\u914d", "OmniEdu-27B\u5728K12-Bench\u3001MathFish\u3001EDUMATH\u3001MathTutorBench\u548cLongTutor\u7b49\u57fa\u51c6\u4e0a\u53d6\u5f97\u8f83\u5f3a\u6559\u80b2\u4efb\u52a1\u8868\u73b0"], "keywords": ["\u6559\u80b2\u5927\u6a21\u578b", "\u6307\u4ee4\u5fae\u8c03", "\u6559\u5b66\u8f85\u5bfc", "\u6570\u636e\u6784\u5efa"], "num_comments": 3, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2609.23088", "published_at": "2026-09-19", "score": 0.533, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (89\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.23088.png", "title": "OmniEdu: Open Foundation Models for Learning and Teaching", "tldr": "\u9762\u5411K-12\u6559\u80b2\u7684\u5f00\u653e\u57fa\u7840\u6a21\u578b\u5bb6\u65cf", "upvotes": 89, "what_it_is": "OmniEdu \u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411K-12\u5b66\u4e60\u4e0e\u6559\u5b66\u7684\u5f00\u653e\u6559\u80b2\u57fa\u7840\u6a21\u578b\u5bb6\u65cf\uff0c\u5e76\u56f4\u7ed5\u5b66\u79d1\u80fd\u529b\u3001\u8bfe\u7a0b\u5bf9\u9f50\u3001\u8bca\u65ad\u63a8\u7406\u548c\u6559\u5b66\u652f\u67b6\u56db\u7c7b\u80fd\u529b\u7ec4\u7ec7\u6307\u4ee4\u5fae\u8c03\u6570\u636e\u3002\u8bba\u6587\u5c55\u793a\u4e864B\u30019B\u300127B\u6a21\u578b\u5728\u89e3\u9898\u3001\u8bfe\u7a0b\u7406\u89e3\u548c\u8f85\u5bfc\u6559\u5b66\u7b49\u6559\u80b2\u4efb\u52a1\u4e0a\u7684\u7cfb\u7edf\u63d0\u5347\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u662f\u4ec5\u4f18\u5316\u89e3\u9898\u6216\u5355\u4e00\u8f85\u5bfc\u80fd\u529b\uff0c\u800c\u662f\u7528\u80fd\u529b\u5747\u8861\u7684\u6570\u636e\u7b56\u5212\u65b9\u5f0f\u7cfb\u7edf\u9002\u914d\u6559\u80b2\u573a\u666f\uff0c\u5bf9\u5f00\u653e\u6559\u80b2\u5927\u6a21\u578b\u3001\u4e2a\u6027\u5316\u8f85\u5bfc\u548c\u8bfe\u7a0b\u5bf9\u9f50\u5e94\u7528\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Manipulation policies must know which objects matter and where they are, yet the pretrained backbones that current robot foundation models build on, from language in vision-language-action models (VLAs) to video generation in world-action models (WAMs), do not directly require this metric grounding, leaving it to be learned implicitly from robot demonstrations. We propose Grounded Action Models (GAMs), a new paradigm of robot foundation models built with 3D grounding. GAM can be conditioned using language, points, or box prompts, which are first transformed into a shared object-centric representation of the selected objects. This representation captures target-focused visual features and metric object geometry, which is mixed with robot state history through a multi-stream transformer to predict action chunks. Although GAMs can be run autonomously, they can also serve as a low-level controller that a high-level planner controls using its various input modalities, allowing for long-horizon and memory-dependent manipulation. On RoboTwin 2.0, GAM achieves an average success rate of 55.3% across 50 tasks (vs. 52.0% for Spatial Forcing), including 47.6% under scene randomization (vs. 30.4% for Abot-M0), with its action policy trained only on clean-scene demonstrations. On LIBERO-PRO, it achieves a state-of-the-art average success rate of 61% (vs. 53% for $\u03c0_{0.5}$) across 16 perturbation settings, with the largest gains when targets are relocated or newly designated. On two real robots, GAM retains 17/20 successes under visual shift on a bimanual YAM versus 4/20 for $\u03c0_{0.5}$, while its composition with a Molmo2 planner on a Franka achieves 64.7% ID and 49.8% OOD step completion on long-horizon and memory-dependent tasks.", "arxiv_id": "2609.23863", "arxiv_url": "https://arxiv.org/abs/2609.23863", "authors": ["Gehao Zhang", "Weikai Huang", "Shailesh Shailesh", "Yiyan Peng", "Jiafei Duan", "Ranjay Krishna"], "brief": "\u8bba\u6587\u63d0\u51fa Grounded Action Models\uff08GAM\uff09\uff0c\u5c06\u8bed\u8a00\u3001\u70b9\u3001\u6846\u7b49\u63d0\u793a\u7edf\u4e00\u8f6c\u4e3a\u4ee5\u76ee\u6807\u7269\u4f53\u4e3a\u4e2d\u5fc3\u76843D grounding \u8868\u793a\u3002\u8be5\u8868\u793a\u7ed3\u5408\u89c6\u89c9\u7279\u5f81\u3001\u5ea6\u91cf\u51e0\u4f55\u4e0e\u673a\u5668\u4eba\u72b6\u6001\u5386\u53f2\uff0c\u901a\u8fc7\u591a\u6d41 Transformer \u9884\u6d4b\u52a8\u4f5c\u7247\u6bb5\uff0c\u7528\u4e8e\u81ea\u4e3b\u64cd\u4f5c\u6216\u4f5c\u4e3a\u9ad8\u5c42\u89c4\u5212\u5668\u7684\u4f4e\u5c42\u63a7\u5236\u5668\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/GehaoZhang6/Grounded-Action-Model", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2609.23863", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6838\u5fc3\u662f\u663e\u5f0f\u5efa\u6a21\u76ee\u6807\u7269\u4f53\u76843D\u4f4d\u7f6e\u4e0e\u51e0\u4f55\uff0c\u800c\u4e0d\u662f\u4ec5\u4ece\u673a\u5668\u4eba\u793a\u6559\u4e2d\u9690\u5f0f\u5b66\u4e60\u7a7a\u95f4 grounding\u3002", "\u652f\u6301\u8bed\u8a00\u3001\u70b9\u3001\u6846\u591a\u79cd\u6761\u4ef6\u8f93\u5165\uff0c\u7edf\u4e00\u5230\u5171\u4eab\u7684\u7269\u4f53\u4e2d\u5fc3\u8868\u793a\uff0c\u4fbf\u4e8e\u4e0e\u9ad8\u5c42\u89c4\u5212\u5668\u7ec4\u5408\u6267\u884c\u957f\u7a0b\u4efb\u52a1\u3002", "\u5728 RoboTwin 2.0\u3001LIBERO-PRO \u548c\u771f\u5b9e\u53cc\u81c2/Franka \u673a\u5668\u4eba\u4e0a\u5747\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5c24\u5176\u5728\u76ee\u6807\u91cd\u5b9a\u4f4d\u3001\u89c6\u89c9\u6270\u52a8\u548cOOD\u573a\u666f\u4e0b\u63d0\u5347\u660e\u663e\u3002"], "keywords": ["\u673a\u5668\u4eba", "3D\u611f\u77e5", "\u57fa\u7840\u6a21\u578b", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2609.23863", "published_at": "2026-09-20", "score": 0.516, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (32\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.23863.png", "title": "Grounded Action Model: 3D Grounding as a Foundation for Robotics", "tldr": "\u75283D\u5b9a\u4f4d\u592f\u5b9e\u673a\u5668\u4eba\u57fa\u7840\u52a8\u4f5c\u6a21\u578b", "upvotes": 32, "what_it_is": "\u8bba\u6587\u63d0\u51fa Grounded Action Models\uff08GAM\uff09\uff0c\u5c06\u8bed\u8a00\u3001\u70b9\u3001\u6846\u7b49\u63d0\u793a\u7edf\u4e00\u8f6c\u4e3a\u4ee5\u76ee\u6807\u7269\u4f53\u4e3a\u4e2d\u5fc3\u76843D grounding \u8868\u793a\u3002\u8be5\u8868\u793a\u7ed3\u5408\u89c6\u89c9\u7279\u5f81\u3001\u5ea6\u91cf\u51e0\u4f55\u4e0e\u673a\u5668\u4eba\u72b6\u6001\u5386\u53f2\uff0c\u901a\u8fc7\u591a\u6d41 Transformer \u9884\u6d4b\u52a8\u4f5c\u7247\u6bb5\uff0c\u7528\u4e8e\u81ea\u4e3b\u64cd\u4f5c\u6216\u4f5c\u4e3a\u9ad8\u5c42\u89c4\u5212\u5668\u7684\u4f4e\u5c42\u63a7\u5236\u5668\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b\u7f3a\u4e4f\u663e\u5f0f\u5ea6\u91cf\u7a7a\u95f4 grounding \u7684\u5173\u952e\u77ed\u677f\uff0c\u5e76\u5c55\u793a3D grounding \u53ef\u663e\u8457\u63d0\u5347\u6cdb\u5316\u3001\u6297\u6270\u52a8\u548c\u957f\u7a0b\u64cd\u4f5c\u80fd\u529b\uff0c\u5bf9\u6784\u5efa\u66f4\u53ef\u9760\u7684\u673a\u5668\u4eba\u901a\u7528\u52a8\u4f5c\u6a21\u578b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language-Action (VLA) models demonstrate strong generalization in robotic manipulation and navigation, but existing fine-tuning methods provide limited safety guarantees. Current approaches primarily rely on Lagrangian optimization that enforces safety through soft penalties on expected cumulative cost, often resulting in residual constraint violations or overly conservative behavior. Moreover, learning safety in visual domains is challenging due to the absence of dense per-step safety annotations. We propose ShieldVLA, a safety-aligned fine-tuning framework for VLA models based on Hamilton-Jacobi (HJ) reachability. ShieldVLA learns a model-free approximation of the HJ reachability value function directly from visual observations to estimate the safe operating region. The learned safety critic gates policy optimization by separating reward maximization within feasible regions from recovery near unsafe states, avoiding persistent reward-cost trade-offs. To enable scalable supervision in visual environments, we introduce rubric-based VLM safety scores that convert semantic safety feedback into structured critic targets without requiring manual cost labels. Across five navigation and manipulation benchmarks spanning multiple VLA backbones, ShieldVLA reduces cumulative safety cost by 57% on average and improves task success rate by +0.13 over SafeVLA.", "arxiv_id": "2609.13231", "arxiv_url": "https://arxiv.org/abs/2609.13231", "authors": ["Manan Tayal", "Akshay Nambi"], "brief": "\u8bba\u6587\u63d0\u51fa ShieldVLA\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u5b89\u5168\u5fae\u8c03\u6846\u67b6\u3002\u5b83\u4ece\u89c6\u89c9\u89c2\u6d4b\u4e2d\u5b66\u4e60 Hamilton-Jacobi \u53ef\u8fbe\u6027\u5b89\u5168\u4ef7\u503c\u51fd\u6570\uff0c\u7528\u5b89\u5168 critic \u533a\u5206\u53ef\u884c\u533a\u57df\u5185\u7684\u5956\u52b1\u4f18\u5316\u4e0e\u5371\u9669\u9644\u8fd1\u7684\u6062\u590d\u7b56\u7565\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13231", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ee5\u6a21\u578b\u65e0\u5173\u65b9\u5f0f\u8fd1\u4f3c HJ \u53ef\u8fbe\u6027\u4ef7\u503c\u51fd\u6570\uff0c\u4f30\u8ba1\u673a\u5668\u4eba\u5728\u89c6\u89c9\u73af\u5883\u4e2d\u7684\u5b89\u5168\u64cd\u4f5c\u533a\u57df", "\u7528\u5b89\u5168 critic \u95e8\u63a7\u7b56\u7565\u4f18\u5316\uff0c\u907f\u514d\u4f20\u7edf\u62c9\u683c\u6717\u65e5\u8f6f\u7ea6\u675f\u5e26\u6765\u7684\u6b8b\u4f59\u8fdd\u89c4\u6216\u8fc7\u5ea6\u4fdd\u5b88", "\u5f15\u5165\u57fa\u4e8e rubric \u7684 VLM \u5b89\u5168\u8bc4\u5206\uff0c\u5c06\u8bed\u4e49\u5b89\u5168\u53cd\u9988\u8f6c\u4e3a\u7ed3\u6784\u5316 critic \u76d1\u7763\uff0c\u65e0\u9700\u4eba\u5de5\u9010\u6b65\u6210\u672c\u6807\u7b7e"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u5b89\u5168\u5bf9\u9f50", "\u53ef\u8fbe\u6027\u5206\u6790", "\u673a\u5668\u4eba"], "num_comments": 2, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2609.13231", "published_at": "2026-09-02", "score": 0.487, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13231.png", "title": "ShieldVLA: Feasibility-Aware Safety Alignment for Vision-Language-Action Models", "tldr": "\u7528HJ\u53ef\u8fbe\u6027\u4e3aVLA\u63d0\u4f9b\u53ef\u884c\u6027\u611f\u77e5\u5b89\u5168\u5bf9\u9f50", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa ShieldVLA\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u5b89\u5168\u5fae\u8c03\u6846\u67b6\u3002\u5b83\u4ece\u89c6\u89c9\u89c2\u6d4b\u4e2d\u5b66\u4e60 Hamilton-Jacobi \u53ef\u8fbe\u6027\u5b89\u5168\u4ef7\u503c\u51fd\u6570\uff0c\u7528\u5b89\u5168 critic \u533a\u5206\u53ef\u884c\u533a\u57df\u5185\u7684\u5956\u52b1\u4f18\u5316\u4e0e\u5371\u9669\u9644\u8fd1\u7684\u6062\u590d\u7b56\u7565\u3002", "why_notable": "\u76f8\u6bd4\u4f9d\u8d56\u7d2f\u8ba1\u6210\u672c\u60e9\u7f5a\u7684\u5b89\u5168\u5fae\u8c03\uff0cShieldVLA\u5c06\u53ef\u884c\u6027\u8fb9\u754c\u663e\u5f0f\u7eb3\u5165VLA\u4f18\u5316\uff0c\u5728\u4e94\u4e2a\u5bfc\u822a\u4e0e\u64cd\u4f5c\u57fa\u51c6\u3001\u591a\u79cdVLA\u9aa8\u5e72\u4e0a\u5e73\u5747\u964d\u4f4e57%\u5b89\u5168\u6210\u672c\uff0c\u5e76\u8f83SafeVLA\u63d0\u53470.13\u4efb\u52a1\u6210\u529f\u7387\uff0c\u517c\u5177\u5b89\u5168\u6027\u4e0e\u5b9e\u7528\u6027\u3002"}, {"abstract": "Humans can seamlessly adapt to both physical and digital worlds, suggesting that while a digital-to-real gap exists in embodiment, environment and task, human intelligence itself may transfer across this gap. This naturally raises a fundamental question: can the intelligence of vision-language models (VLMs) similarly generalize from the digital world to the physical world for robotic control? We investigate this question through RoboDawn, a human-intuitive interface that exposes robotic control to an agentic VLM through a compact set of discrete translation, rotation, and gripper commands. Using this interface, the VLM controls a robot in a closed loop: it observes the current visual state, reasons about the next action, executes it, and adapts subsequent decisions to the resulting state. Furthermore, we introduce an in-context learning (ICL) scheme that uses a few demonstrations to ground the VLM in both interface usage and task-solving strategies. Experiments on RoboTwin 2.0 C2R and RoboDojo demonstrate that RoboDawn achieves strong performance without task-specific robot training. In the zero-shot setting, RoboDawn outperforms several strong policies trained on benchmarkspecific robot data, while a single in-context demonstration further yields substantial performance gains and establishes state-of-the-art (SOTA) results. On RoboTwin 2.0 C2R, the success rate increases from 53.2% zero-shot to 73.6% one-shot, exceeding the solid baseline \u03c00.5 (46.0%). Similar gains are observed on RoboDojo, where success rate improves from 35.67% zero-shot to 47.17% one-shot. The same framework also transfers to real-world robots, performing block-in-basket and block stacking on Franka.", "arxiv_id": "2609.22966", "arxiv_url": "https://arxiv.org/abs/2609.22966", "authors": ["Meng-Hao Guo", "Zhe-Han Mo", "Jia-Jun Wang", "Yi Zhang", "Kejin Wang", "Yi-Xuan Deng", "Jia-Peng Zhang", "Yongming Rao", "Shi-Min Hu"], "brief": "\u8bba\u6587\u63d0\u51fa RoboDawn\uff0c\u5c06\u673a\u5668\u4eba\u63a7\u5236\u5c01\u88c5\u4e3a\u5c11\u91cf\u79bb\u6563\u5e73\u79fb\u3001\u65cb\u8f6c\u548c\u5939\u722a\u6307\u4ee4\uff0c\u8ba9\u5177\u5907\u63a8\u7406\u80fd\u529b\u7684 VLM \u901a\u8fc7\u89c6\u89c9\u89c2\u5bdf\u2014\u884c\u52a8\u51b3\u7b56\u2014\u6267\u884c\u53cd\u9988\u95ed\u73af\u63a7\u5236\u673a\u5668\u4eba\u3002\u5e76\u8bbe\u8ba1\u5c11\u6837\u672c\u4e0a\u4e0b\u6587\u5b66\u4e60\u673a\u5236\uff0c\u7528\u5c11\u91cf\u793a\u8303\u8ba9 VLM \u5b66\u4f1a\u63a5\u53e3\u4f7f\u7528\u4e0e\u4efb\u52a1\u7b56\u7565\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.22966", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u65e0\u9700\u4efb\u52a1\u7279\u5b9a\u673a\u5668\u4eba\u8bad\u7ec3\uff0cVLM \u53ef\u901a\u8fc7\u79bb\u6563\u63a7\u5236\u63a5\u53e3\u76f4\u63a5\u8fdb\u884c\u96f6\u6837\u672c\u673a\u5668\u4eba\u64cd\u4f5c\u3002", "\u5f15\u5165 in-context learning\uff1a\u5355\u4e2a\u793a\u8303\u5373\u53ef\u663e\u8457\u63d0\u5347\u7b56\u7565 grounding \u4e0e\u4efb\u52a1\u6210\u529f\u7387\u3002", "\u5728 RoboTwin 2.0 C2R \u4e0a\u6210\u529f\u7387\u4ece\u96f6\u6837\u672c 53.2% \u63d0\u5347\u5230\u4e00\u793a\u8303 73.6%\uff0c\u8d85\u8fc7 \u03c00.5 \u7684 46.0%\uff1b\u5728 RoboDojo \u4e0a\u4ece 35.67% \u63d0\u5347\u5230 47.17%\u3002", "\u6846\u67b6\u53ef\u8fc1\u79fb\u5230\u771f\u5b9e Franka \u673a\u5668\u4eba\uff0c\u5b8c\u6210\u65b9\u5757\u5165\u7bee\u548c\u65b9\u5757\u5806\u53e0\u4efb\u52a1\u3002"], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.22966", "published_at": "2026-09-19", "score": 0.479, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (101\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.22966.png", "title": "Transferring the Intelligence of VLMs to Robotic Control", "tldr": "\u7528VLM\u96f6\u8bad\u7ec3\u95ed\u73af\u63a7\u5236\u673a\u5668\u4eba", "upvotes": 101, "what_it_is": "\u8bba\u6587\u63d0\u51fa RoboDawn\uff0c\u5c06\u673a\u5668\u4eba\u63a7\u5236\u5c01\u88c5\u4e3a\u5c11\u91cf\u79bb\u6563\u5e73\u79fb\u3001\u65cb\u8f6c\u548c\u5939\u722a\u6307\u4ee4\uff0c\u8ba9\u5177\u5907\u63a8\u7406\u80fd\u529b\u7684 VLM \u901a\u8fc7\u89c6\u89c9\u89c2\u5bdf\u2014\u884c\u52a8\u51b3\u7b56\u2014\u6267\u884c\u53cd\u9988\u95ed\u73af\u63a7\u5236\u673a\u5668\u4eba\u3002\u5e76\u8bbe\u8ba1\u5c11\u6837\u672c\u4e0a\u4e0b\u6587\u5b66\u4e60\u673a\u5236\uff0c\u7528\u5c11\u91cf\u793a\u8303\u8ba9 VLM \u5b66\u4f1a\u63a5\u53e3\u4f7f\u7528\u4e0e\u4efb\u52a1\u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86 VLM \u7684\u6570\u5b57\u4e16\u754c\u63a8\u7406\u80fd\u529b\u53ef\u901a\u8fc7\u7b80\u5355\u79bb\u6563\u63a5\u53e3\u8fc1\u79fb\u5230\u7269\u7406\u673a\u5668\u4eba\u63a7\u5236\uff0c\u5e76\u5728\u65e0\u9700\u4e13\u95e8\u673a\u5668\u4eba\u6570\u636e\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\u8d85\u8fc7\u90e8\u5206\u8bad\u7ec3\u578b\u7b56\u7565\uff0c\u63d0\u793a\u901a\u7528 VLM \u53ef\u80fd\u6210\u4e3a\u4f4e\u6210\u672c\u673a\u5668\u4eba\u667a\u80fd\u4f53\u7684\u6838\u5fc3\u7ec4\u4ef6\u3002"}, {"abstract": "Single-image 3D object generation can now produce high-fidelity assets, yet accurately placing them into a coherent scene layout remains an open challenge. A central difficulty lies in how object layout is represented. Holistic methods absorb placement into a scene-level generation process, sacrificing object-level detail. Compositional methods preserve object fidelity by decoupling geometry from layout, but typically parameterize layout as sparse, unbounded pose variables that are difficult to learn and generalize poorly under scarce scene-level supervision. We present Mira-Scene, a compositional 3D scene reconstruction framework that replaces sparse pose regression with dense, bounded correspondence recovery. At its core is the Canonical Coordinate Map (CCM), a pixel-aligned field that maps each visible object pixel to a surface coordinate in the object\u0027s bounded canonical space. When paired with a scene-space Point Cloud Map (PCM) from monocular geometry estimation, CCM induces dense canonical-to-scene correspondences from which object transformations are recovered through robust geometric alignment. Because CCM operates in bounded canonical space, it provides a stable prediction target that can be trained from scalable object-level 3D data without requiring scene-level layout annotations. Mira-Scene further introduces a multimodal diffusion transformer that jointly generates object geometry and CCMs, using modality-specific expert streams with shared attention and positional encoding to promote geometry-layout consistency. Experiments on indoor, outdoor, synthetic, and in-the-wild scenes show that Mira-Scene substantially outperforms strong baselines in layout accuracy, achieving relative gains of 39.8% in 3D-IoU and 16.5% in 2D-IoU over SAM3D, using limited open-source training data.", "arxiv_id": "2609.23796", "arxiv_url": "https://arxiv.org/abs/2609.23796", "authors": ["Yang-Tian Sun", "Tianjia Liu", "Zehuan Huang", "Yi-Hua Huang", "Xiaoyang Lyu", "Ziyi Yang", "Zi-Xin Zou", "Yuan-Chen Guo", "Yan-Pei Cao", "Xiaojuan Qi"], "brief": "Mira-Scene \u662f\u4e00\u4e2a\u7ec4\u5408\u5f0f\u5355\u56fe3D\u573a\u666f\u91cd\u5efa\u6846\u67b6\uff0c\u5c06\u7269\u4f53\u5e03\u5c40\u9884\u6d4b\ gingface.co/social-thumbnails/papers/2609.23796.png", "title": "Mira-Scene: Pixel-Aligned Layouts for Generative 3D Scene Reconstruction", "tldr": "\u7528\u50cf\u7d20\u5bf9\u9f50\u5bf9\u5e94\u5173\u7cfb\u63d0\u5347\u5355\u56fe3D\u573a\u666f\u5e03\u5c40\u91cd\u5efa", "upvotes": 3, "what_it_is": "Mira-Scene \u662f\u4e00\u4e2a\u7ec4\u5408\u5f0f\u5355\u56fe3D\u573a\u666f\u91cd\u5efa\u6846\u67b6\uff0c\u5c06\u7269\u4f53\u5e03\u5c40\u9884\u6d4b\u4ece\u7a00\u758f\u59ff\u6001\u56de\u5f52\u6539\u4e3a\u5bc6\u96c6\u3001\u6709\u754c\u7684\u5bf9\u5e94\u5173\u7cfb\u6062\u590d\u3002\u5b83\u901a\u8fc7 Canonical Coordinate Map \u5c06\u53ef\u89c1\u7269\u4f53\u50cf\u7d20\u6620\u5c04\u5230\u7269\u4f53\u89c4\u8303\u7a7a\u95f4\uff0c\u518d\u4e0e\u5355\u76ee\u51e0\u4f55\u4f30\u8ba1\u5f97\u5230\u7684\u573a\u666f\u70b9\u4e91\u5bf9\u9f50\u4ee5\u6062\u590d\u7269\u4f53\u53d8\u6362\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7ed5\u5f00\u4e86\u4f20\u7edf\u7a00\u758f\u59ff\u6001\u53d8\u91cf\u96be\u5b66\u3001\u6cdb\u5316\u5dee\u7684\u95ee\u9898\uff0c\u628a\u5e03\u5c40\u5b66\u4e60\u8f6c\u5316\u4e3a\u50cf\u7d20\u7ea7\u6709\u754c\u5bf9\u5e94\u9884\u6d4b\uff0c\u5728\u4fdd\u6301\u7269\u4f53\u7ea7\u751f\u6210\u8d28\u91cf\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u573a\u666f\u5e03\u5c40\u7cbe\u5ea6\uff0c\u5bf9\u5355\u56fe3D\u573a\u666f\u751f\u6210\u4e0e\u91cd\u5efa\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agentic memory is becoming essential for long-horizon AI agents, yet many existing systems rely on autoregressive LLMs to control how memories are organized, retrieved, and used, placing expensive generation on the critical path of memory operations. We introduce \\textbf{\\method}, a new agentic memory architecture inspired by System-One/System-Two cognition. System One captures fast, lightweight decision-making, whereas System Two performs slower, deliberative reasoning. Jev-Mem brings this division of labor to agentic memory through a dedicated System-One control plane, a structured multi-relational memory plane, and a System-Two reasoning plane. The System-One controller governs memory typing and relational organization during construction, and dynamically performs query routing, retrieval-budget allocation, graph traversal, candidate scoring, and adaptive stopping during retrieval. System Two is invoked only for complex reasoning and answer synthesis. This design improves both memory effectiveness and system efficiency: on LoCoMo Jev-Mem achieves an overall LLM-as-a-Judge score of 0.777, an 11.0\\% relative improvement over the strongest baseline, while reducing memory construction time to 158\\,s, a 6.6$\\times$ speedup over the fastest competing memory system, and lowering average query latency to 0.93\\,s, a 36.7\\% reduction.", "arxiv_id": "2609.23986", "arxiv_url": "https://arxiv.org/abs/2609.23986", "authors": ["Dongming Jiang", "Yi Li", "Bingzhe Li"], "brief": "\u8bba\u6587\u63d0\u51fa Jev-Mem\uff0c\u4e00\u79cd\u53d7 System-One/System-Two \u8ba4\u77e5\u5206\u5de5\u542f\u53d1\u7684\u667a\u80fd\u4f53\u8bb0\u5fc6\u67b6\u6784\u3002\u5b83\u7528\u8f7b\u91cf\u7ea7 System-One \u63a7\u5236\u5668\u7ba1\u7406\u8bb0\u5fc6\u6784\u5efa\u3001\u68c0\u7d22\u8def\u7531\u4e0e\u9884\u7b97\u5206\u914d\uff0c\u4ec5\u5728\u590d\u6742\u63a8\u7406\u548c\u7b54\u6848\u5408\u6210\u65f6\u8c03\u7528\u8f83\u6162\u7684 System-Two LLM\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/libingzheren/Jev-Mem", "github_stars": 25, "hf_url": "https://huggingface.co/papers/2609.23986", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b\u4e09\u5c42\u7ed3\u6784\uff1aSystem-One \u63a7\u5236\u5e73\u9762\u3001\u591a\u5173\u7cfb\u7ed3\u6784\u5316\u8bb0\u5fc6\u5e73\u9762\u3001System-Two \u63a8\u7406\u5e73\u9762", "System-One \u8d1f\u8d23\u8bb0\u5fc6\u7c7b\u578b\u5224\u5b9a\u3001\u5173\u7cfb\u7ec4\u7ec7\u3001\u67e5\u8be2\u8def\u7531\u3001\u56fe\u904d\u5386\u3001\u5019\u9009\u8bc4\u5206\u548c\u81ea\u9002\u5e94\u505c\u6b62", "\u5728 LoCoMo \u4e0a LLM-as-a-Judge \u603b\u5206\u8fbe 0.777\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 11.0%\uff0c\u6784\u5efa\u901f\u5ea6\u63d0\u5347 6.6 \u500d\uff0c\u5e73\u5747\u67e5\u8be2\u5ef6\u8fdf\u964d\u81f3 0.93 \u79d2"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u68c0\u7d22\u589e\u5f3a", "\u957f\u7a0b\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.23986", "published_at": "2026-09-21", "score": 0.456, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.23986.png", "title": "Jev-Mem: System-One-Controlled Agentic Memory for Efficient AI Agents", "tldr": "\u7528System-One\u63a7\u5236\u5e73\u9762\u52a0\u901f\u667a\u80fd\u4f53\u8bb0\u5fc6", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51fa Jev-Mem\uff0c\u4e00\u79cd\u53d7 System-One/System-Two \u8ba4\u77e5\u5206\u5de5\u542f\u53d1\u7684\u667a\u80fd\u4f53\u8bb0\u5fc6\u67b6\u6784\u3002\u5b83\u7528\u8f7b\u91cf\u7ea7 System-One \u63a7\u5236\u5668\u7ba1\u7406\u8bb0\u5fc6\u6784\u5efa\u3001\u68c0\u7d22\u8def\u7531\u4e0e\u9884\u7b97\u5206\u914d\uff0c\u4ec5\u5728\u590d\u6742\u63a8\u7406\u548c\u7b54\u6848\u5408\u6210\u65f6\u8c03\u7528\u8f83\u6162\u7684 System-Two LLM\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u6602\u8d35\u7684\u81ea\u56de\u5f52 LLM \u4ece\u8bb0\u5fc6\u64cd\u4f5c\u5173\u952e\u8def\u5f84\u4e2d\u79fb\u51fa\uff0c\u5728\u957f\u7a0b\u667a\u80fd\u4f53\u8bb0\u5fc6\u4e2d\u540c\u65f6\u63d0\u5347\u6548\u679c\u4e0e\u6548\u7387\uff0c\u5bf9\u6784\u5efa\u4f4e\u5ef6\u8fdf\u3001\u53ef\u6269\u5c55\u7684 AI Agent \u5f88\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Benchmarks for LLM-generated GPU kernels decide correctness with a few random inputs and a loose floating-point tolerance, and their verdicts now feed leaderboards and reinforcement-learning rewards. Recent work agrees these checkers are weak and patches them by hand---extra input distributions, fuzzing recipes, tighter tolerances---with no way to \\emph{measure} whether any patch suffices. We introduce mutation analysis as an adequacy metric for kernel-benchmark oracles: deterministic rules inject 10{,}303 compilable faults into verified CUDA implementations of 188 KernelBench problems, 7{,}384 of them with an independent kill witness; any test protocol is scored by the fraction it detects. The official check misses \\textbf{one in six} witnessed faults (16.9%), deterministically, and the misses are skewed by family: 8.7% of arithmetic faults escape, but 78.6% of precision faults do. The metric explains why (a tolerance blind band growing with reduction size; a measured ceiling on input aggressiveness set by legitimate floating-point variance), audits the strongest existing patch (KernelBench-Verified\u0027s gain splits into $+4.0$ points from hidden inputs and $+4.5$ from tighter tolerance, a split its authors could not compute), and exposes a published fuzzing recipe that rejects \\emph{correct} kernels 107 times. Optimizing suites over the kill matrix reaches 98.0% detection with two inputs per problem (94.8% held-out), and the measurement\u0027s fault taxonomy teaches a test generator more than the raw faults themselves. Across 48 whole architectures, the blindness grows with scale, concentrating in deep homogeneous pipelines, and two problems prove unrefereeable: their official references violate the benchmark\u0027s own tolerance against fp64. We release everything as \\href{https://huggingface.co/datasets/Elfsong/KernelBench-M}{KernelBench-M}.", "arxiv_id": "2609.22220", "arxiv_url": "https://arxiv.org/abs/2609.22220", "authors": ["Mingzhe Du", "Anh Tuan Luu", "Dong Huang", "See-Kiong Ng"], "brief": "\u8bba\u6587\u63d0\u51fa\u5c06\u53d8\u5f02\u5206\u6790\u4f5c\u4e3a GPU kernel \u57fa\u51c6\u6d4b\u8bd5 oracle \u7684\u5145\u5206\u6027\u6307\u6807\uff0c\u5728 188 \u4e2a KernelBench \u95ee\u9898\u7684\u5df2\u9a8c\u8bc1 CUDA \u5b9e\u73b0\u4e2d\u6ce8\u5165 10303 \u4e2a\u53ef\u7f16\u8bd1\u6545\u969c\uff0c\u5e76\u7528\u53ef\u72ec\u7acb\u9a8c\u8bc1\u7684 kill witness \u8861\u91cf\u6d4b\u8bd5\u534f\u8bae\u80fd\u53d1\u73b0\u591a\u5c11\u9519\u8bef\u3002", "categories": ["cs.LG", "cs.PL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.22220", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5b98\u65b9 KernelBench \u68c0\u67e5\u5668\u6f0f\u68c0 16.9% \u7684\u6709\u89c1\u8bc1\u6545\u969c\uff0c\u4e14\u7cbe\u5ea6\u7c7b\u6545\u969c\u6f0f\u68c0\u7387\u9ad8\u8fbe 78.6%\u3002", "\u5206\u6790\u53d1\u73b0\u6f0f\u68c0\u6e90\u4e8e\u968f\u89c4\u7ea6\u89c4\u6a21\u589e\u957f\u7684\u6d6e\u70b9\u5bb9\u5dee\u76f2\u533a\uff0c\u4ee5\u53ca\u5408\u6cd5\u6d6e\u70b9\u65b9\u5dee\u9650\u5236\u4e86\u8f93\u5165\u653b\u51fb\u6027\u7684\u4e0a\u9650\u3002", "\u4f18\u5316\u540e\u7684\u6d4b\u8bd5\u5957\u4ef6\u6bcf\u9898\u4ec5\u9700\u4e24\u4e2a\u8f93\u5165\u5373\u53ef\u8fbe\u5230 98.0% \u68c0\u51fa\u7387\uff0c\u5e76\u53d1\u5e03 KernelBench-M \u6570\u636e\u96c6\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "GPU\u5185\u6838", "\u57fa\u51c6\u8bc4\u6d4b", "\u7a0b\u5e8f\u5206\u6790"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2609.22220", "published_at": "2026-09-02", "score": 0.443, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.22220.png", "title": "Measuring the Checker: Mutation Analysis for GPU-Kernel Benchmark Oracles", "tldr": "\u7528\u53d8\u5f02\u5206\u6790\u91cf\u5316GPU\u5185\u6838\u8bc4\u6d4b\u5224\u9898\u5668\u76f2\u533a", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5c06\u53d8\u5f02\u5206\u6790\u4f5c\u4e3a GPU kernel \u57fa\u51c6\u6d4b\u8bd5 oracle \u7684\u5145\u5206\u6027\u6307\u6807\uff0c\u5728 188 \u4e2a KernelBench \u95ee\u9898\u7684\u5df2\u9a8c\u8bc1 CUDA \u5b9e\u73b0\u4e2d\u6ce8\u5165 10303 \u4e2a\u53ef\u7f16\u8bd1\u6545\u969c\uff0c\u5e76\u7528\u53ef\u72ec\u7acb\u9a8c\u8bc1\u7684 kill witness \u8861\u91cf\u6d4b\u8bd5\u534f\u8bae\u80fd\u53d1\u73b0\u591a\u5c11\u9519\u8bef\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u4e3a LLM \u751f\u6210 GPU \u5185\u6838\u7684\u6b63\u786e\u6027\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u53ef\u91cf\u5316\u3001\u53ef\u590d\u73b0\u7684 oracle \u8d28\u91cf\u5ea6\u91cf\uff0c\u80fd\u5ba1\u8ba1\u6392\u884c\u699c\u548c\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u4fe1\u53f7\u7684\u53ef\u9760\u6027\uff0c\u5e76\u63ed\u793a\u73b0\u6709\u624b\u5de5\u8865\u4e01\u548c fuzzing \u65b9\u6848\u7684\u8bef\u5224\u98ce\u9669\u3002"}, {"abstract": "Retrieval-Augmented Generation (RAG) systems over enterprise knowledge bases must ingest heterogeneous document formats -- PDFs, Word documents, presentations, and scans -- whose content is locked inside complex visual layouts, multi-column pages, and dense tables. Rule-based extraction and OCR destroy reading order, flatten tables, and lose heading hierarchy, while fully agentic chunking over extracted text incurs high token costs and hallucination risk. We present Document Retrieval-Aware Chunking (D-RAC), an extension of our Web Retrieval-Aware Chunking (W-RAC) framework to arbitrary document formats. D-RAC first normalizes any input document into PDF, exploiting the fact that virtually every format has a faithful, deterministic PDF rendering. A single multimodal LLM pass then converts rendered pages into retrieval-optimized Markdown -- rewriting tables as self-contained prose statements and preserving heading hierarchy -- after which chunking proceeds exactly as in W-RAC: deterministic parsing into ID-addressable units followed by lightweight LLM-based chunk planning over identifiers rather than text. Source text is never regenerated during chunking, preserving W-RAC\u0027s cost, determinism, and observability benefits while unlocking every renderable format as a first-class input. On the 236-document, 795-page PDF subset of the RAG-Multi-Corpus benchmark spanning five enterprise domains, D-RAC converts and chunks the entire corpus in 72 minutes with zero errors, producing 1,748 retrieval-ready chunks. Compared to agentic chunking with frontier LLMs, D-RAC reduces chunking-stage output tokens by 95.7%, cutting chunking cost by 77.8% (GPT-4.1 pricing) to 85.6% (Gemini 2.5 Pro pricing) and chunking time by 75%. D-RAC scales linearly to documents of 500+ pages.", "arxiv_id": "2609.24220", "arxiv_url": "https://arxiv.org/abs/2609.24220", "authors": ["Uday Allu", "Abhivanth Sivaprakash", "Pratik Singh", "Aman Manocha"], "brief": "D-RAC \u5c06\u4efb\u610f\u53ef\u6e32\u67d3\u4f01\u4e1a\u6587\u6863\u5148\u89c4\u8303\u5316\u4e3a PDF\uff0c\u518d\u7528\u4e00\u6b21\u591a\u6a21\u6001 LLM \u8f6c\u4e3a\u68c0\u7d22\u4f18\u5316\u7684 Markdown\uff0c\u6700\u540e\u6309 W-RAC \u6d41\u7a0b\u8fdb\u884c\u786e\u5b9a\u6027\u89e3\u6790\u4e0e\u8f7b\u91cf\u5207\u5206\u89c4\u5212\u3002\u5b83\u91cd\u70b9\u89e3\u51b3\u590d\u6742\u7248\u5f0f\u3001\u8868\u683c\u3001\u5c42\u7ea7\u6807\u9898\u5728 RAG \u5165\u5e93\u4e2d\u7684\u4fdd\u771f\u4e0e\u4f4e\u6210\u672c\u5207\u5206\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24220", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5229\u7528\u201c\u51e0\u4e4e\u6240\u6709\u683c\u5f0f\u90fd\u80fd\u786e\u5b9a\u6027\u6e32\u67d3\u4e3a PDF\u201d\u7684\u7279\u70b9\uff0c\u7edf\u4e00\u5904\u7406 PDF\u3001Word\u3001PPT\u3001\u626b\u63cf\u4ef6\u7b49\u5f02\u6784\u6587\u6863", "\u591a\u6a21\u6001 LLM \u5c06\u9875\u9762\u8f6c\u6362\u4e3a Markdown\uff0c\u5e76\u628a\u8868\u683c\u6539\u5199\u4e3a\u81ea\u5305\u542b\u7684\u81ea\u7136\u8bed\u8a00\u9648\u8ff0\uff0c\u540c\u65f6\u4fdd\u7559\u6807\u9898\u5c42\u7ea7", "\u5728 RAG-Multi-Corpus \u7684 236 \u7bc7\u3001795 \u9875 PDF \u5b50\u96c6\u4e0a 72 \u5206\u949f\u96f6\u9519\u8bef\u5b8c\u6210\u8f6c\u6362\u4e0e\u5207\u5206\uff0c\u751f\u6210 1,748 \u4e2a\u68c0\u7d22\u5757\uff1b\u76f8\u6bd4 agentic chunking \u8f93\u51fa token \u51cf\u5c11 95.7%\uff0c\u6210\u672c\u964d\u4f4e 77.8%\u201385.6%"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u6587\u6863\u7406\u89e3", "\u591a\u6a21\u6001", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 4, "on_hf": true, "organization": "Yellow.ai", "pdf_url": "https://arxiv.org/pdf/2609.24220", "published_at": "2026-09-21", "score": 0.438, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (50\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24220.png", "title": "Document Retrieval-Aware Chunking (D-RAC): Universal Retrieval-Aware Ingestion of Enterprise Documents via PDF Normalization and Multimodal Markdown Conversion", "tldr": "\u9762\u5411\u4f01\u4e1a\u6587\u6863\u7684\u68c0\u7d22\u611f\u77e5\u5207\u5206\u6846\u67b6", "upvotes": 50, "what_it_is": "D-RAC \u5c06\u4efb\u610f\u53ef\u6e32\u67d3\u4f01\u4e1a\u6587\u6863\u5148\u89c4\u8303\u5316\u4e3a PDF\uff0c\u518d\u7528\u4e00\u6b21\u591a\u6a21\u6001 LLM \u8f6c\u4e3a\u68c0\u7d22\u4f18\u5316\u7684 Markdown\uff0c\u6700\u540e\u6309 W-RAC \u6d41\u7a0b\u8fdb\u884c\u786e\u5b9a\u6027\u89e3\u6790\u4e0e\u8f7b\u91cf\u5207\u5206\u89c4\u5212\u3002\u5b83\u91cd\u70b9\u89e3\u51b3\u590d\u6742\u7248\u5f0f\u3001\u8868\u683c\u3001\u5c42\u7ea7\u6807\u9898\u5728 RAG \u5165\u5e93\u4e2d\u7684\u4fdd\u771f\u4e0e\u4f4e\u6210\u672c\u5207\u5206\u95ee\u9898\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u590d\u6742\u4f01\u4e1a\u6587\u6863\u5165\u5e93\u6d41\u7a0b\u6807\u51c6\u5316\u4e3a\u201cPDF \u5f52\u4e00\u5316 + \u591a\u6a21\u6001 Markdown \u8f6c\u6362 + \u786e\u5b9a\u6027\u5207\u5206\u201d\uff0c\u517c\u987e\u7248\u5f0f\u7406\u89e3\u3001\u53ef\u89c2\u6d4b\u6027\u3001\u4f4e\u6210\u672c\u548c\u53ef\u6269\u5c55\u6027\uff0c\u5bf9\u4f01\u4e1a\u7ea7 RAG \u77e5\u8bc6\u5e93\u6784\u5efa\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Standard subword tokenizers either treat every orthographic variation of a word (such as hello, Hello, HELLO, and H\u00e9llo) as unrelated vocabulary entries, which fragments the embedding space, or discard this variation through lossy normalization. We present the Functionalizer, a lossless pre-tokenizer framework that factors orthographic and structural variations into a compositional opcode/operand prefix stream before tokenization: a canonical base token (operand) prefixed by parametric transformation operators (opcodes) encoded in the Unicode Private Use Area. We introduce operators covering casing (CAPITALIZE), diacritics (13 dedicated opcodes), and character repetition (REPEAT, MULTIREPEAT), which are fully reversible. Across natural language and code corpora, the Functionalizer enables complete corpus coverage with significantly smaller vocabularies under unconstrained exhaustion conditions, reducing actual vocabulary slot requirements by up to 19.7%. Downstream evaluations on 98M-parameter GPT-2 models show that the Functionalizer improves Python code syntax validity (9.12% vs. 7.70%) while reducing duplicate n-gram repetition in natural language prose. These findings demonstrate that functional decomposition can be an effective mechanism for vocabulary-efficient, structurally aware language modeling, and motivate further validation at production scale.", "arxiv_id": "2609.15991", "arxiv_url": "https://arxiv.org/abs/2609.15991", "authors": ["Connor Makowski", "Willem Guter"], "brief": "\u8bba\u6587\u63d0\u51fa Functionalizer\uff0c\u4e00\u79cd\u65e0\u635f\u9884\u5206\u8bcd\u6846\u67b6\uff0c\u5c06\u5927\u5c0f\u5199\u3001\u53d8\u97f3\u7b26\u53f7\u3001\u5b57\u7b26\u91cd\u590d\u7b49\u6b63\u5b57\u6cd5\u53d8\u5316\u5206\u89e3\u4e3a\u201c\u64cd\u4f5c\u7801+\u57fa\u7840\u8bcd\u5143\u201d\u7684\u53ef\u7ec4\u5408\u524d\u7f00\u6d41\uff0c\u518d\u4ea4\u7ed9\u5b50\u8bcd tokenizer \u5904\u7406\u3002\u5b83\u7528 Unicode \u79c1\u7528\u533a\u7f16\u7801\u64cd\u4f5c\u7b26\uff0c\u4fdd\u8bc1\u53ef\u5b8c\u5168\u8fd8\u539f\u539f\u6587\u672c\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/connor-makowski/functionalizer", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15991", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u652f\u6301 CAPITALIZE\u300113\u7c7b\u53d8\u97f3\u7b26\u53f7\u64cd\u4f5c\u7b26\u3001REPEAT/MULTIREPEAT \u7b49\u53ef\u9006\u53d8\u6362\uff0c\u907f\u514d\u628a hello/Hello/H\u00e9llo \u7b49\u89c6\u4e3a\u4e92\u4e0d\u76f8\u5173\u8bcd\u9879", "\u5728\u81ea\u7136\u8bed\u8a00\u4e0e\u4ee3\u7801\u8bed\u6599\u4e0a\uff0c\u5728\u65e0\u7ea6\u675f\u7a77\u5c3d\u8bcd\u8868\u6761\u4ef6\u4e0b\u5b9e\u73b0\u5b8c\u6574\u8986\u76d6\uff0c\u5e76\u6700\u591a\u51cf\u5c11 19.7% \u5b9e\u9645\u8bcd\u8868\u69fd\u4f4d\u9700\u6c42", "\u5728 98M \u53c2\u6570 GPT-2 \u4e0b\u6e38\u5b9e\u9a8c\u4e2d\uff0c\u63d0\u9ad8 Python \u4ee3\u7801\u8bed\u6cd5\u6709\u6548\u7387\uff089.12% vs. 7.70%\uff09\uff0c\u5e76\u964d\u4f4e\u81ea\u7136\u8bed\u8a00\u751f\u6210\u4e2d\u7684\u91cd\u590d n-gram"], "keywords": ["\u5206\u8bcd", "\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u8868\u793a", "\u4ee3\u7801\u751f\u6210"], "num_comments": 3, "on_hf": true, "organization": "MIT CAVE Lab", "pdf_url": "https://arxiv.org/pdf/2609.15991", "published_at": "2026-09-18", "score": 0.431, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15991.png", "title": "The Functionalizer: Lossless Functional Decomposition for Subword Tokenization", "tldr": "\u65e0\u635f\u62c6\u89e3\u5b57\u5f62\u53d8\u5316\uff0c\u538b\u7f29\u5b50\u8bcd\u8bcd\u8868", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa Functionalizer\uff0c\u4e00\u79cd\u65e0\u635f\u9884\u5206\u8bcd\u6846\u67b6\uff0c\u5c06\u5927\u5c0f\u5199\u3001\u53d8\u97f3\u7b26\u53f7\u3001\u5b57\u7b26\u91cd\u590d\u7b49\u6b63\u5b57\u6cd5\u53d8\u5316\u5206\u89e3\u4e3a\u201c\u64cd\u4f5c\u7801+\u57fa\u7840\u8bcd\u5143\u201d\u7684\u53ef\u7ec4\u5408\u524d\u7f00\u6d41\uff0c\u518d\u4ea4\u7ed9\u5b50\u8bcd tokenizer \u5904\u7406\u3002\u5b83\u7528 Unicode \u79c1\u7528\u533a\u7f16\u7801\u64cd\u4f5c\u7b26\uff0c\u4fdd\u8bc1\u53ef\u5b8c\u5168\u8fd8\u539f\u539f\u6587\u672c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u4e0d\u727a\u7272\u6587\u672c\u53ef\u9006\u6027\u7684\u524d\u63d0\u4e0b\u51cf\u5c11\u8bcd\u8868\u788e\u7247\u5316\uff0c\u4e3a\u66f4\u9ad8\u6548\u3001\u66f4\u7ed3\u6784\u611f\u77e5\u7684\u8bed\u8a00\u6a21\u578b\u5206\u8bcd\u63d0\u4f9b\u4e86\u5b9e\u7528\u65b9\u5411\uff0c\u5c24\u5176\u5bf9\u591a\u8bed\u79cd\u3001\u4ee3\u7801\u548c\u542b\u5927\u91cf\u6b63\u5b57\u6cd5\u53d8\u4f53\u7684\u6570\u636e\u6709\u6f5c\u5728\u4ef7\u503c\u3002"}, {"abstract": "Building general-purpose agents for industrial deployment requires integrating multiple capabilities, each typically acquired at a distinct stage of training. Yet there is currently no well-established recipe for Agent Continual Learning (ACL), with little understanding of the trade-offs among existing integration paradigms. To address this gap, we introduce ACLArena, a framework for comprehensively studying, analyzing, and evaluating ACL. We first build a sequential training pipeline and conduct an in-depth analysis that explains the mechanisms of forgetting and generalization from two complementary perspectives, the model level and the token level. Guided by these analyses, we systematically compare multi-teacher on-policy distillation, self-distilled fine-tuning, and model merging to assess their ability to recover previously learned capabilities while preserving newly acquired ones. Through extensive experiments, we develop a detailed understanding of how capabilities transfer across stages. Finally, we propose a new ACL recipe th
