points": [], "keywords": ["\u673a\u5668\u4eba", "\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25562", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "IndustrialVLA-Bench: A Traceable Multi-Axis Evaluation of Open Robot Policy Models", "tldr": "\u63d0\u51fa IndustrialVLA-Bench\uff0c\u7528\u7edf\u4e00\u534f\u8bae\u8bc4\u6d4b 6 \u4e2a\u5f00\u6e90\u673a\u5668\u4eba\u7b56\u7565\u6a21\u578b\uff08VLA \u4e0e WAM\uff09\uff0c\u8986\u76d6\u57fa\u7840\u80fd\u529b\u3001\u975e\u8bed\u8a00\u9c81\u68d2\u6027\u3001\u6307\u4ee4\u6539\u5199\u654f\u611f\u6027\u548c\u90e8\u7f72\u6210\u672c\u3002\u7ed3\u679c\u663e\u793a\u5404\u6a21\u578b\u5728\u5e72\u51c0 LIBERO \u4efb\u52a1\u4e0a\u5dee\u8ddd\u5f88\u5c0f\uff0c\u4f46\u5728\u9c81\u68d2\u6027\u548c\u8bed\u8a00\u6539\u5199\u4e0b\u5dee\u5f02\u663e\u8457\uff0c\u5f3a\u8c03\u9700\u7528\u53ef\u8ffd\u8e2a\u8bc1\u636e\u800c\u975e\u5355\u4e00\u5206\u6570\u6bd4\u8f83\u673a\u5668\u4eba\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Coding agents now find real vulnerabilities in production software. However, bug discovery results do not measure whether agents can construct exploit primitives. We introduce KEX-bench, a benchmark for evaluating coding agents on exploit primitive generation against real operating-system kernels. KEX-bench contains 45 task instances across 40 Linux and Windows CVEs, covering kernel address leak, instruction-pointer control, heap read, heap write, and arbitrary address write. Each task runs in an isolated virtual machine, exposes controlled tools, and uses a deterministic verifier to check primitive-specific success. We evaluate state-of-the-art coding agents paired with frontier and open-weight models under fixed tool-call budgets. Without a reference proof of concept (PoC), the strongest configuration solves 1 of 20 Windows tasks (5.0%) and 14 of 25 Linux tasks (56.0%). With a reference PoC, the strongest configuration solves 31 of 45 tasks (68.9%). This highlights the gap where agents reach kernel crashes but fail to shape kernel state into exploit primitives. We release KEX-bench for reproducible research on AI-assisted exploitation at https://kex-bench.github.io.", "arxiv_id": "2609.25591", "arxiv_url": "https://arxiv.org/abs/2609.25591", "authors": ["Junyoung Jang", "Gwanhyun Lee", "Hwiwon Lee", "Kyuheon Kim", "Jongseong Kim", "Jinho Jung", "Lingming Zhang"], "brief": "\u672c\u6587\u63d0\u51fa KEX-bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u5728\u771f\u5b9e Linux/Windows \u5185\u6838 CVE \u4e0a\u751f\u6210\u6f0f\u6d1e\u5229\u7528\u539f\u8bed\u7684\u80fd\u529b\uff0c\u8986\u76d6\u5730\u5740\u6cc4\u9732\u3001\u6307\u4ee4\u6307\u9488\u63a7\u5236\u3001\u5806\u8bfb\u5199\u7b49\u4efb\u52a1\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5373\u4f7f\u6700\u5f3a\u914d\u7f6e\u5728\u65e0\u53c2\u8003 PoC \u65f6\u8868\u73b0\u4e5f\u5f88\u6709\u9650\uff0c\u5c24\u5176\u662f Windows \u4efb\u52a1\u4ec5\u89e3\u51fa 5%\uff0c\u63ed\u793a\u667a\u80fd\u4f53\u4ece\u89e6\u53d1\u5d29\u6e83\u5230\u6784\u9020\u53ef\u7528\u5229\u7528\u539f\u8bed\u4e4b\u95f4\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25591", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u7f51\u7edc\u5b89\u5168", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25591", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluating Coding Agents on Kernel Exploit Generation", "tldr": "\u672c\u6587\u63d0\u51fa KEX-bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u5728\u771f\u5b9e Linux/Windows \u5185\u6838 CVE \u4e0a\u751f\u6210\u6f0f\u6d1e\u5229\u7528\u539f\u8bed\u7684\u80fd\u529b\uff0c\u8986\u76d6\u5730\u5740\u6cc4\u9732\u3001\u6307\u4ee4\u6307\u9488\u63a7\u5236\u3001\u5806\u8bfb\u5199\u7b49\u4efb\u52a1\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5373\u4f7f\u6700\u5f3a\u914d\u7f6e\u5728\u65e0\u53c2\u8003 PoC \u65f6\u8868\u73b0\u4e5f\u5f88\u6709\u9650\uff0c\u5c24\u5176\u662f Windows \u4efb\u52a1\u4ec5\u89e3\u51fa 5%\uff0c\u63ed\u793a\u667a\u80fd\u4f53\u4ece\u89e6\u53d1\u5d29\u6e83\u5230\u6784\u9020\u53ef\u7528\u5229\u7528\u539f\u8bed\u4e4b\u95f4\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In language models, the choice between believing the prompt and believing the weights is made by a handful of identifiable attention heads. Instruction tuning changes how models behave under conflict, but whether it rewires the underlying circuit or merely gates/reweights already present components, remains unknown. We provide the first mechanistic base-vs-instruct comparison of conflict-resolution circuits, across three families (Llama-3.2-3B, Qwen-2.5-3B, Gemma-3-4B). Five independent methods, node and edge attribution, superposition role analysis, causal ablation, and path patching, converge on gating, with the same heads, in the same late-layers, are found to be reweighted rather than replaced with a high node overlap (0.60-0.82). Behaviorally, tuning shifts models toward parametric memory, making instruct models reject a terse counterfactual context far more than base ones, the opposite of a naive user-following expectation. Yet this added skepticism is a factor of framing since it disappears when the same false claim is delivered as a coherent, evidential passage. The robustness that instruction tuning buys against terse injection is therefore real but narrow. More broadly, we believe that because the conflict circuit is preserved rather than rebuilt, interpretability and control tools calibrated on base models should transfer directly to their deployed instruct siblings.", "arxiv_id": "2609.25602", "arxiv_url": "https://arxiv.org/abs/2609.25602", "authors": ["Shubham Santosh Pandere", "Gautam Ranka", "Ritika Varshney", "Navya Deshmukh", "Roushni Sareen", "Roshan Kumar Singh"], "brief": "\u672c\u6587\u6bd4\u8f83\u57fa\u7840\u6a21\u578b\u4e0e\u6307\u4ee4\u5fae\u8c03\u6a21\u578b\u5728\u63d0\u793a\u4fe1\u606f\u4e0e\u53c2\u6570\u77e5\u8bc6\u51b2\u7a81\u65f6\u7684\u5185\u90e8\u673a\u5236\uff0c\u53d1\u73b0\u6307\u4ee4\u5fae\u8c03\u5e76\u672a\u91cd\u5efa\u51b2\u7a81\u89e3\u51b3\u7535\u8def\uff0c\u800c\u662f\u5bf9\u539f\u6709\u665a\u5c42\u6ce8\u610f\u529b\u5934\u8fdb\u884c\u95e8\u63a7/\u91cd\u52a0\u6743\u3002\u5b9e\u9a8c\u8986\u76d6 Llama\u3001Qwen\u3001Gemma \u4e09\u4e2a\u7cfb\u5217\uff0c\u663e\u793a\u6307\u4ee4\u5fae\u8c03\u4f1a\u589e\u5f3a\u5bf9\u7b80\u77ed\u53cd\u4e8b\u5b9e\u6ce8\u5165\u7684\u6000\u7591\uff0c\u4f46\u8fd9\u79cd\u9c81\u68d2\u6027\u5728\u6709\u8bc1\u636e\u5316\u8868\u8ff0\u65f6\u4f1a\u51cf\u5f31\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25602", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6307\u4ee4\u5fae\u8c03", "\u53ef\u89e3\u91ca\u6027", "\u77e5\u8bc6\u51b2\u7a81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25602", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rewired or Gated? How Instruction Tuning Shapes Knowledge-Conflict Circuits in LLMs", "tldr": "\u672c\u6587\u6bd4\u8f83\u57fa\u7840\u6a21\u578b\u4e0e\u6307\u4ee4\u5fae\u8c03\u6a21\u578b\u5728\u63d0\u793a\u4fe1\u606f\u4e0e\u53c2\u6570\u77e5\u8bc6\u51b2\u7a81\u65f6\u7684\u5185\u90e8\u673a\u5236\uff0c\u53d1\u73b0\u6307\u4ee4\u5fae\u8c03\u5e76\u672a\u91cd\u5efa\u51b2\u7a81\u89e3\u51b3\u7535\u8def\uff0c\u800c\u662f\u5bf9\u539f\u6709\u665a\u5c42\u6ce8\u610f\u529b\u5934\u8fdb\u884c\u95e8\u63a7/\u91cd\u52a0\u6743\u3002\u5b9e\u9a8c\u8986\u76d6 Llama\u3001Qwen\u3001Gemma \u4e09\u4e2a\u7cfb\u5217\uff0c\u663e\u793a\u6307\u4ee4\u5fae\u8c03\u4f1a\u589e\u5f3a\u5bf9\u7b80\u77ed\u53cd\u4e8b\u5b9e\u6ce8\u5165\u7684\u6000\u7591\uff0c\u4f46\u8fd9\u79cd\u9c81\u68d2\u6027\u5728\u6709\u8bc1\u636e\u5316\u8868\u8ff0\u65f6\u4f1a\u51cf\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL)-based post-training has become an effective approach for eliciting reasoning capabilities in large language models (LLMs). However, adapting post-RL models to new knowledge domains or behaviors through subsequent supervised fine-tuning (SFT) can severely overwrite these capabilities. Existing approaches mitigate such forgetting through experience replay, specialized initialization, or constrained optimization using gradient projection, but either provide limited preservation or incur substantial training overhead. Our analysis shows that reasoning activations concentrate in low-dimensional subspaces, leaving substantial null-space capacity for adaptation, and that the corresponding approximate null spaces can be reliably estimated from a modest number of examples. Motivated by these observations, we propose Null-Basis Low-Rank Adaptation (NB-LoRA), a parameter-efficient method for adapting post-RL LLMs while preserving their acquired reasoning ability. We formulate reasoning retention as a layer-wise hidden-state preservation constraint and construct a fixed approximate null basis from reasoning activations. LoRA updates are then reparameterized through this basis, enforcing the preservation constraint throughout fine-tuning. Extensive experiments across multiple RL-trained LLMs and diverse downstream tasks show that NB-LoRA matches standard LoRA in adaptation performance, maintains reasoning accuracy near pre-fine-tuning levels, and generalizes this preservation to held-out reasoning benchmarks.", "arxiv_id": "2609.25618", "arxiv_url": "https://arxiv.org/abs/2609.25618", "authors": ["Wenzhi Fang", "Nicholas Tzou", "Lazar Valkov", "Srinivas Chappidi"], "brief": "\u8bba\u6587\u63d0\u51fa NB-LoRA\uff0c\u7528\u63a8\u7406\u6fc0\u6d3b\u4f30\u8ba1\u51fa\u7684\u8fd1\u4f3c\u96f6\u7a7a\u95f4\u6765\u7ea6\u675f LoRA \u66f4\u65b0\uff0c\u4f7f\u540e\u5f3a\u5316\u5b66\u4e60\u5927\u6a21\u578b\u5728\u76d1\u7763\u5fae\u8c03\u5230\u65b0\u9886\u57df\u65f6\u5c3d\u91cf\u4e0d\u7834\u574f\u5df2\u6709\u63a8\u7406\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u9002\u914d\u6027\u80fd\u63a5\u8fd1\u6807\u51c6 LoRA\uff0c\u540c\u65f6\u63a8\u7406\u51c6\u786e\u7387\u57fa\u672c\u4fdd\u6301\u5728\u5fae\u8c03\u524d\u6c34\u5e73\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u672a\u89c1\u63a8\u7406\u57fa\u51c6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25618", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25618", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reasoning-Preserving Fine-Tuning of Post-RL LLMs with Null-Basis LoRA", "tldr": "\u8bba\u6587\u63d0\u51fa NB-LoRA\uff0c\u7528\u63a8\u7406\u6fc0\u6d3b\u4f30\u8ba1\u51fa\u7684\u8fd1\u4f3c\u96f6\u7a7a\u95f4\u6765\u7ea6\u675f LoRA \u66f4\u65b0\uff0c\u4f7f\u540e\u5f3a\u5316\u5b66\u4e60\u5927\u6a21\u578b\u5728\u76d1\u7763\u5fae\u8c03\u5230\u65b0\u9886\u57df\u65f6\u5c3d\u91cf\u4e0d\u7834\u574f\u5df2\u6709\u63a8\u7406\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u9002\u914d\u6027\u80fd\u63a5\u8fd1\u6807\u51c6 LoRA\uff0c\u540c\u65f6\u63a8\u7406\u51c6\u786e\u7387\u57fa\u672c\u4fdd\u6301\u5728\u5fae\u8c03\u524d\u6c34\u5e73\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u672a\u89c1\u63a8\u7406\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "General-purpose robot control requires models to understand task intent, identify where to interact, capture how the scene evolves, and generate precise actions. Vision-language-action models provide strong semantic priors but typically do not explicitly model scene dynamics, while world-action models couple visual prediction with control without necessarily exposing the task-relevant semantic and spatial structure needed for fine-grained manipulation. We present MachEmbodied-U0 (ME-U0), a unified embodied foundation model connecting understanding and generation experts through a Mixture-of-Transformers architecture. Subtask prediction and affordance grounding guide joint visual-dynamics and action generation via flow matching. Visual dynamics encompass future RGB, depth, surface normals, and optical flow, providing complementary supervision for appearance, geometry, and motion. Multi-rate Rotary Position Encoding (MRPE) aligns visual dynamics with fine-grained control. We pretrain ME-U0 on approximately 4,200 hours of curated demonstrations from robotic datasets and egocentric datasets. Using only the supervision natively available in each downstream benchmark, ME-U0 achieves an average score of 17.66 on the RoboDojo simulation benchmark and average success rates of 99.0\\% and 82.5\\% on LIBERO and LIBERO-Plus, respectively. We additionally validate ME-U0 on real-world robotic manipulation tasks, demonstrating its effectiveness beyond simulation. Without corresponding downstream supervision, ME-U0 further demonstrates zero-shot subtask prediction, affordance grounding, and visual dynamics on simulated and real-world observations. Overall, ME-U0 combines competitive downstream control performance with transferable task-grounding and visual-dynamics capabilities across simulation and the real world.", "arxiv_id": "2609.25627", "arxiv_url": "https://arxiv.org/abs/2609.25627", "authors": ["Haoran Wen", "Wenfu Wang", "Kunsong Shi", "Jingke Wang", "Wancheng Feng", "Yiren Zhang", "Yueran Zhao", "Xuancheng Zhang", "Nanfei Ye", "Xingru Chen", "Zhaohong Sun", "Chengmin Yang", "Zikang Yu", "Penghao Bi", "Jia Shi", "Yu Liu", "Kun Zhan", "Yan Xie"], "brief": "\u672c\u6587\u63d0\u51fa MachEmbodied-U0\uff0c\u4e00\u4e2a\u901a\u8fc7 Mixture-of-Transformers \u7edf\u4e00\u4efb\u52a1\u7406\u89e3\u3001\u53ef\u4f9b\u6027\u5b9a\u4f4d\u3001\u89c6\u89c9\u52a8\u6001\u9884\u6d4b\u4e0e\u52a8\u4f5c\u751f\u6210\u7684\u5177\u8eab\u57fa\u7840\u6a21\u578b\u3002\u6a21\u578b\u5728\u7ea6 4200 \u5c0f\u65f6\u673a\u5668\u4eba\u4e0e\u7b2c\u4e00\u89c6\u89d2\u6570\u636e\u4e0a\u9884\u8bad\u7ec3\uff0c\u5728 RoboDojo\u3001LIBERO/LIBERO-Plus \u53ca\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u53d6\u5f97\u5f3a\u63a7\u5236\u8868\u73b0\uff0c\u5e76\u5177\u5907\u96f6\u6837\u672c\u5b50\u4efb\u52a1\u9884\u6d4b\u3001\u53ef\u4f9b\u6027 grounding \u548c\u89c6\u89c9\u52a8\u6001\u5efa\u6a21\u80fd\u529b\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25627", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u63a7\u5236", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25627", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MachEmbodied-U0: Unified Understanding and Generation Model for Embodied Intelligence", "tldr": "\u672c\u6587\u63d0\u51fa MachEmbodied-U0\uff0c\u4e00\u4e2a\u901a\u8fc7 Mixture-of-Transformers \u7edf\u4e00\u4efb\u52a1\u7406\u89e3\u3001\u53ef\u4f9b\u6027\u5b9a\u4f4d\u3001\u89c6\u89c9\u52a8\u6001\u9884\u6d4b\u4e0e\u52a8\u4f5c\u751f\u6210\u7684\u5177\u8eab\u57fa\u7840\u6a21\u578b\u3002\u6a21\u578b\u5728\u7ea6 4200 \u5c0f\u65f6\u673a\u5668\u4eba\u4e0e\u7b2c\u4e00\u89c6\u89d2\u6570\u636e\u4e0a\u9884\u8bad\u7ec3\uff0c\u5728 RoboDojo\u3001LIBERO/LIBERO-Plus \u53ca\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u53d6\u5f97\u5f3a\u63a7\u5236\u8868\u73b0\uff0c\u5e76\u5177\u5907\u96f6\u6837\u672c\u5b50\u4efb\u52a1\u9884\u6d4b\u3001\u53ef\u4f9b\u6027 grounding \u548c\u89c6\u89c9\u52a8\u6001\u5efa\u6a21\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) excel at reasoning when scaled to hundreds of billions of parameters, but small- and mid-scale models remain brittle reasoners even with knowledge distillation (KD). We present Ladders-of-Thought (LoT), a framework that improves reasoning by combining progressive question rewrites with a self-evolving curriculum. LoT automatically generates semantically faithful but easier variants of reasoning problems, organizes them into difficulty buckets using step-based measures, and employs a self-evolving bandit scheduler to allocate training adaptively. Evaluated on two reasoning domains, math and multi-hop reasoning, across 1-8B models from different families, LoT consistently improves over KD. It delivers large gains on arithmetic tasks (e.g., +32 percentage points on AddSub, +25pp on SVAMP), +2-8pp improvements on in-domain test splits, and strong though dataset-dependent benefits on multi-hop reasoning (e.g., +16pp on QASC, +25pp on StrategyQA). LoT also converges faster than staged curricula, highlighting the value of adaptive progression. These results show that progressive rewrites coupled with adaptive curricula provide a simple yet effective recipe for strengthening reasoning in smaller LLMs.", "arxiv_id": "2609.25643", "arxiv_url": "https://arxiv.org/abs/2609.25643", "authors": ["Minghui Liu", "Thomas Magelinski", "Dehao Yuan", "Qi Yu", "Furong Huang"], "brief": "\u8bba\u6587\u63d0\u51fa Ladders-of-Thought\uff0c\u901a\u8fc7\u628a\u63a8\u7406\u9898\u9010\u6b65\u6539\u5199\u6210\u8bed\u4e49\u4e00\u81f4\u4f46\u66f4\u7b80\u5355\u7684\u7248\u672c\uff0c\u5e76\u7528\u81ea\u6f14\u5316 bandit \u8bfe\u7a0b\u8c03\u5ea6\u8bad\u7ec3\u5c0f\u4e2d\u578b\u8bed\u8a00\u6a21\u578b\u3002\u8be5\u65b9\u6cd5\u5728\u6570\u5b66\u548c\u591a\u8df3\u63a8\u7406\u4efb\u52a1\u4e0a\u666e\u904d\u4f18\u4e8e\u77e5\u8bc6\u84b8\u998f\uff0c\u90e8\u5206\u6570\u636e\u96c6\u63d0\u5347\u663e\u8457\u4e14\u6536\u655b\u66f4\u5feb\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25643", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u8bfe\u7a0b\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25643", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ladders of Thought: A Self-Evolving Curriculum of Progressively Simplified Reasoning Traces", "tldr": "\u8bba\u6587\u63d0\u51fa Ladders-of-Thought\uff0c\u901a\u8fc7\u628a\u63a8\u7406\u9898\u9010\u6b65\u6539\u5199\u6210\u8bed\u4e49\u4e00\u81f4\u4f46\u66f4\u7b80\u5355\u7684\u7248\u672c\uff0c\u5e76\u7528\u81ea\u6f14\u5316 bandit \u8bfe\u7a0b\u8c03\u5ea6\u8bad\u7ec3\u5c0f\u4e2d\u578b\u8bed\u8a00\u6a21\u578b\u3002\u8be5\u65b9\u6cd5\u5728\u6570\u5b66\u548c\u591a\u8df3\u63a8\u7406\u4efb\u52a1\u4e0a\u666e\u904d\u4f18\u4e8e\u77e5\u8bc6\u84b8\u998f\uff0c\u90e8\u5206\u6570\u636e\u96c6\u63d0\u5347\u663e\u8457\u4e14\u6536\u655b\u66f4\u5feb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents must generalize from tools seen during training to unseen tools at deployment. A key challenge is tool trialing, i.e., excessive trials waste the interaction budget, whereas selective trials enable exploration of unfamiliar tools. Existing outcome-based post-training leaves wasteful trials unguided, while turn-level supervision may suppress necessary exploration. We introduce ToolCompass, a post-training framework that guides tool trialing by organizing tool-call representations according to shared functions. Specifically, ToolCompass models each function class as a von Mises--Fisher distribution and jointly reduces intra-function variation across domains and increases inter-function separation. This structure transfers experience from seen tools to functionally similar unseen tools, directing exploration away from unrelated alternatives. ToolCompass requires no ground-truth call traces or unseen-tool access and incurs no inference overhead. Experiments on AppWorld and FTRL show consistent gains across GRPO, RFT, and DMPO. improves AppWorld OOD task success by up to 10.71 percentage points over vanilla post-training and performs best among competitive baselines on both benchmarks.", "arxiv_id": "2609.25678", "arxiv_url": "https://arxiv.org/abs/2609.25678", "authors": ["Junlin Fang", "Chong Zhang", "Do Nguyen-Thanh", "Xiaogang Xu", "Zhen Fang", "Sean Du"], "brief": "ToolCompass \u662f\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u5de5\u5177\u4f7f\u7528\u7684\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u76ee\u6807\u662f\u5728\u4e0d\u538b\u5236\u5fc5\u8981\u63a2\u7d22\u7684\u60c5\u51b5\u4e0b\u5f15\u5bfc\u5de5\u5177\u8bd5\u7528\uff0c\u5e2e\u52a9\u6a21\u578b\u4ece\u8bad\u7ec3\u4e2d\u89c1\u8fc7\u7684\u5de5\u5177\u6cdb\u5316\u5230\u90e8\u7f72\u65f6\u672a\u89c1\u5de5\u5177\u3002\u5b83\u6309\u5171\u4eab\u529f\u80fd\u7ec4\u7ec7\u5de5\u5177\u8c03\u7528\u8868\u793a\uff0c\u7528 von Mises-Fisher \u5206\u5e03\u62c9\u8fd1\u540c\u529f\u80fd\u3001\u62c9\u8fdc\u4e0d\u540c\u529f\u80fd\u7684\u5de5\u5177\u8868\u793a\uff0c\u5728 AppWorld \u548c FTRL \u4e0a\u63d0\u5347\u591a\u79cd\u540e\u8bad\u7ec3\u65b9\u6cd5\uff0cAppWorld OOD \u6210\u529f\u7387\u6700\u9ad8\u63d0\u5347 10.71 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25678", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u540e\u8bad\u7ec3", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25678", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Toolcompass: Guiding Tool Trialing, Not Suppressing It", "tldr": "ToolCompass \u662f\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u5de5\u5177\u4f7f\u7528\u7684\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u76ee\u6807\u662f\u5728\u4e0d\u538b\u5236\u5fc5\u8981\u63a2\u7d22\u7684\u60c5\u51b5\u4e0b\u5f15\u5bfc\u5de5\u5177\u8bd5\u7528\uff0c\u5e2e\u52a9\u6a21\u578b\u4ece\u8bad\u7ec3\u4e2d\u89c1\u8fc7\u7684\u5de5\u5177\u6cdb\u5316\u5230\u90e8\u7f72\u65f6\u672a\u89c1\u5de5\u5177\u3002\u5b83\u6309\u5171\u4eab\u529f\u80fd\u7ec4\u7ec7\u5de5\u5177\u8c03\u7528\u8868\u793a\uff0c\u7528 von Mises-Fisher \u5206\u5e03\u62c9\u8fd1\u540c\u529f\u80fd\u3001\u62c9\u8fdc\u4e0d\u540c\u529f\u80fd\u7684\u5de5\u5177\u8868\u793a\uff0c\u5728 AppWorld \u548c FTRL \u4e0a\u63d0\u5347\u591a\u79cd\u540e\u8bad\u7ec3\u65b9\u6cd5\uff0cAppWorld OOD \u6210\u529f\u7387\u6700\u9ad8\u63d0\u5347 10.71 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language models are increasingly trained on the outputs of other models, forming chains that we call lineages, in which a trait present in one generation can pass to the next. Prior work on subliminal learning has shown that a teacher\u0027s trait can transmit to a student through filtered data carrying none of the trait\u0027s content. However, the evidence covers only a single training step. We study whether such a trait holds or fades across lineages. We instill the trait into three copies of Qwen2.5-7B-Instruct and iterate the training step to depth ten from each, reading every generation two ways on the same held-out prompts: a keyword screen that looks for expressions of the trait in the model\u0027s output, and an activation probe that projects each model\u0027s displacement from the base onto a direction built from the other lineages\u0027 teachers. We report two findings. First, the trait persists through ten generations across three lineages. The instilled models express it on every completion; the keyword-screen rate falls to 55.6% after the first step and to 21.1% by generation ten. The base itself matches the screen on none of its 300 completions. Second, the trait can be present internally while absent behaviorally. When the model\u0027s default system prompt is removed at evaluation, the generation-ten students\u0027 keyword-screen rate is zero on every prompt while the probe score stays positive on every prompt. Steering the untreated base with the displacement of a generation-ten student, which is trained and measured under the default system prompt, induces screened expression of the trait even with the system prompt removed, while that same student shows no expression of the trait with the system prompt removed.", "arxiv_id": "2609.25721", "arxiv_url": "https://arxiv.org/abs/2609.25721", "authors": ["Ryan Vo", "Duc-Vu Nguyen", "Matt Kretchmar", "Ngan Luu-Thuy Nguyen"], "brief": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u201c\u6a21\u578b\u8f93\u51fa\u8bad\u7ec3\u4e0b\u4e00\u4ee3\u6a21\u578b\u201d\u7684\u8c31\u7cfb\u4e2d\uff0c\u6f5c\u5728\u7279\u8d28\u662f\u5426\u4f1a\u8de8\u591a\u4ee3\u4f20\u9012\u3002\u5b9e\u9a8c\u5728 Qwen2.5-7B-Instruct \u4e0a\u8fed\u4ee3\u8bad\u7ec3\u5230\u7b2c\u5341\u4ee3\uff0c\u53d1\u73b0\u7279\u8d28\u867d\u5728\u663e\u5f0f\u8f93\u51fa\u4e2d\u9010\u6b65\u8870\u51cf\uff0c\u4f46\u4ecd\u80fd\u957f\u671f\u4fdd\u7559\uff1b\u5373\u4f7f\u884c\u4e3a\u4e0a\u4e0d\u518d\u8868\u8fbe\uff0c\u6fc0\u6d3b\u63a2\u9488\u4ecd\u663e\u793a\u5185\u90e8\u5b58\u5728\u8be5\u7279\u8d28\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25721", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8c31\u7cfb", "\u8868\u5f81\u5206\u6790", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25721", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Slow Decay and Silenced Expression: Iterated Subliminal Trait Transfer in Language-Model Lineages", "tldr": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u201c\u6a21\u578b\u8f93\u51fa\u8bad\u7ec3\u4e0b\u4e00\u4ee3\u6a21\u578b\u201d\u7684\u8c31\u7cfb\u4e2d\uff0c\u6f5c\u5728\u7279\u8d28\u662f\u5426\u4f1a\u8de8\u591a\u4ee3\u4f20\u9012\u3002\u5b9e\u9a8c\u5728 Qwen2.5-7B-Instruct \u4e0a\u8fed\u4ee3\u8bad\u7ec3\u5230\u7b2c\u5341\u4ee3\uff0c\u53d1\u73b0\u7279\u8d28\u867d\u5728\u663e\u5f0f\u8f93\u51fa\u4e2d\u9010\u6b65\u8870\u51cf\uff0c\u4f46\u4ecd\u80fd\u957f\u671f\u4fdd\u7559\uff1b\u5373\u4f7f\u884c\u4e3a\u4e0a\u4e0d\u518d\u8868\u8fbe\uff0c\u6fc0\u6d3b\u63a2\u9488\u4ecd\u663e\u793a\u5185\u90e8\u5b58\u5728\u8be5\u7279\u8d28\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Omni-modal models have expanded multimodal interaction across vision, audio, speech, and language. However, their training is predominantly organized around semantic descriptions and general-purpose objectives, leaving physical attributes, interaction states, and causal mechanisms only partially specified. This gap is not simply a matter of modality coverage: adding more modalities does not by itself provide the supervision needed to connect observations with the physical structure of the world. We present OmniFysics-Nano-V2, a compact omni-modal model for physical-world perception and understanding. The model supports image, video, audio, speech, and text inputs within a shared reasoning framework, together with text and speech generation. To address the lack of explicit physical supervision, we construct a dual-branch physics-aware data pipeline that grounds salient objects in structured physical attributes and aligns visual changes with acoustic events, intermediate responses, and interaction outcomes. To address homogeneous training objectives, we curate reinforcement-learning prompts by reward diversity and adopt a two-stage Group Relative Policy Optimization curriculum that progresses from general task correctness to fine-grained physical perceptual reasoning. Experiments across multimodal, audio-visual, and physical reasoning benchmarks show that the proposed data and training strategy improves physical-world understanding while preserving broad omni-modal competence. The proposed model achieves leading result on 17 of 21 benchmarks against SOTA omni-modal models. By equipping AI systems with both omni-modal and physical-world perception capabilities, OmniFysics-Nano-V2 is poised to become a cornerstone of next-generation Physical AI.", "arxiv_id": "2609.25738", "arxiv_url": "https://arxiv.org/abs/2609.25738", "authors": ["Yizhou Liu", "Jinghang Han", "Kaixiang Qiu", "Qi He", "Minghao Han", "Yue Jiang", "Xujia Chen", "Wei Zou", "Shunli Wang", "Lihua Zhang", "Dingkang Yang"], "brief": "OmniFysics-Nano-V2 \u662f\u4e00\u4e2a\u7d27\u51d1\u578b\u5168\u6a21\u6001\u6a21\u578b\uff0c\u652f\u6301\u56fe\u50cf\u3001\u89c6\u9891\u3001\u97f3\u9891\u3001\u8bed\u97f3\u548c\u6587\u672c\u8f93\u5165\uff0c\u5e76\u80fd\u751f\u6210\u6587\u672c\u4e0e\u8bed\u97f3\uff0c\u91cd\u70b9\u589e\u5f3a\u5bf9\u7269\u7406\u5c5e\u6027\u3001\u4ea4\u4e92\u72b6\u6001\u548c\u56e0\u679c\u673a\u5236\u7684\u7406\u89e3\u3002\u8bba\u6587\u901a\u8fc7\u7269\u7406\u611f\u77e5\u6570\u636e\u6d41\u6c34\u7ebf\u548c\u4e24\u9636\u6bb5 GRPO \u8bad\u7ec3\u8bfe\u7a0b\u63d0\u5347\u7269\u7406\u4e16\u754c\u63a8\u7406\u80fd\u529b\uff0c\u5728 21 \u4e2a\u57fa\u51c6\u4e2d\u7684 17 \u4e2a\u8fbe\u5230\u9886\u5148\uff0c\u540c\u65f6\u4fdd\u6301\u901a\u7528\u5168\u6a21\u6001\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25738", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u7269\u7406\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u8bed\u97f3\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25738", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OmniFysics-Nano-V2 Technical Report: Understanding the Physical World Across Modalities", "tldr": "OmniFysics-Nano-V2 \u662f\u4e00\u4e2a\u7d27\u51d1\u578b\u5168\u6a21\u6001\u6a21\u578b\uff0c\u652f\u6301\u56fe\u50cf\u3001\u89c6\u9891\u3001\u97f3\u9891\u3001\u8bed\u97f3\u548c\u6587\u672c\u8f93\u5165\uff0c\u5e76\u80fd\u751f\u6210\u6587\u672c\u4e0e\u8bed\u97f3\uff0c\u91cd\u70b9\u589e\u5f3a\u5bf9\u7269\u7406\u5c5e\u6027\u3001\u4ea4\u4e92\u72b6\u6001\u548c\u56e0\u679c\u673a\u5236\u7684\u7406\u89e3\u3002\u8bba\u6587\u901a\u8fc7\u7269\u7406\u611f\u77e5\u6570\u636e\u6d41\u6c34\u7ebf\u548c\u4e24\u9636\u6bb5 GRPO \u8bad\u7ec3\u8bfe\u7a0b\u63d0\u5347\u7269\u7406\u4e16\u754c\u63a8\u7406\u80fd\u529b\uff0c\u5728 21 \u4e2a\u57fa\u51c6\u4e2d\u7684 17 \u4e2a\u8fbe\u5230\u9886\u5148\uff0c\u540c\u65f6\u4fdd\u6301\u901a\u7528\u5168\u6a21\u6001\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generative models have advanced image-conditioned 3D content creation, yet generating controllable and executable 3D scenes from a single image remains challenging. Existing 3D generative approaches can synthesize visually plausible objects and scenes, but their spatial layout estimation is coupled with specific asset generators. They struggle to jointly model object semantics, metric geometry, and scene-level spatial relationships, which are essential for interactive editing, physical simulation, and embodied applications. We propose Fysiverse-3D-Vision, a unified vision-language-geometry framework for generative 3D scene reconstruction and executable asset construction from a single image. We establish a shared representation where spatial reasoning and geometric reconstruction mutually enhance each other, allowing object layouts to be inferred beyond the constraints of individual asset generators. Our model integrates textual supervision, semantic visual cues, and geometric representations within a unified Transformer to capture scene context, metric geometry, and object-level interactions. An object-conditioned layout module performs cross-attention between target object representations and global geometric features to predict object translation, rotation, and scale. Training progressively learns geometry-language alignment, introduces layout reasoning while preserving reconstruction capability, and refines physical consistency through collision-aware optimization. By separating spatial layout reasoning from asset synthesis, Fysiverse-3D-Vision provides an adaptable interface for interactive scene editing, object-level manipulations, and executable 3D content generation. Experiments demonstrate that our framework achieves superior geometric consistency, layout estimation, rendering quality, and physical property understanding compared with existing approaches.", "arxiv_id": "2609.25741", "arxiv_url": "https://arxiv.org/abs/2609.25741", "authors": ["Dingkang Yang", "Yizhou Liu", "Wendong Cheng", "Zizhi Chen", "Shunli Wang", "Yang Liu", "Hongsheng Li", "Lihua Zhang"], "brief": "Fysiverse-3D-Vision \u63d0\u51fa\u7edf\u4e00\u7684\u89c6\u89c9-\u8bed\u8a00-\u51e0\u4f55\u6846\u67b6\uff0c\u4ece\u5355\u5f20\u56fe\u50cf\u91cd\u5efa\u53ef\u7f16\u8f91\u3001\u53ef\u6267\u884c\u7684 3D \u573a\u666f\u3002\u5b83\u5c06\u7a7a\u95f4\u5e03\u5c40\u63a8\u7406\u4e0e\u8d44\u4ea7\u751f\u6210\u89e3\u8026\uff0c\u5e76\u901a\u8fc7 Transformer \u878d\u5408\u8bed\u4e49\u3001\u6587\u672c\u548c\u51e0\u4f55\u4fe1\u606f\uff0c\u5728\u51e0\u4f55\u4e00\u81f4\u6027\u3001\u5e03\u5c40\u4f30\u8ba1\u3001\u6e32\u67d3\u8d28\u91cf\u548c\u7269\u7406\u5c5e\u6027\u7406\u89e3\u4e0a\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25741", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u7a7a\u95f4\u63a8\u7406", "\u591a\u6a21\u6001", "\u573a\u666f\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25741", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Fysiverse-3D-Vision Technical Report: Generating Executable 3D Worlds from Images through Unified Spatial Reasoning", "tldr": "Fysiverse-3D-Vision \u63d0\u51fa\u7edf\u4e00\u7684\u89c6\u89c9-\u8bed\u8a00-\u51e0\u4f55\u6846\u67b6\uff0c\u4ece\u5355\u5f20\u56fe\u50cf\u91cd\u5efa\u53ef\u7f16\u8f91\u3001\u53ef\u6267\u884c\u7684 3D \u573a\u666f\u3002\u5b83\u5c06\u7a7a\u95f4\u5e03\u5c40\u63a8\u7406\u4e0e\u8d44\u4ea7\u751f\u6210\u89e3\u8026\uff0c\u5e76\u901a\u8fc7 Transformer \u878d\u5408\u8bed\u4e49\u3001\u6587\u672c\u548c\u51e0\u4f55\u4fe1\u606f\uff0c\u5728\u51e0\u4f55\u4e00\u81f4\u6027\u3001\u5e03\u5c40\u4f30\u8ba1\u3001\u6e32\u67d3\u8d28\u91cf\u548c\u7269\u7406\u5c5e\u6027\u7406\u89e3\u4e0a\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Using large language models (LLMs) to simulate diverse human populations has the potential to transform many aspects of computational social science, yet many evaluations score the average response rather than the spread of opinion within real groups. Here, we develop a diagnostic framework that measures point accuracy alongside dispersion retention, the ratio of predicted to human standard deviation ($\\dr$), on 10{,}000 respondent--question pairs from the World Values Survey (WVS) spanning twelve countries and six continents. We evaluate eleven zero-shot language models and five variants fine-tuned on WVS data with SFT, DPO, and GRPO. We identify a failure mode we term \\textit{consensus collapse}, where alignment training compresses outputs toward one stereotype per group. Along the post-training trajectory from the Llama~3.1 70B base to the Tulu~3 checkpoints, the first stage, supervised instruction tuning, removes half of the spread with minimal accuracy gain ($\\dr$ 1.22 to 0.59; accuracy $+0.9$ points), the later stages do not restore it, and a gap opens between WEIRD and non-WEIRD countries that survey fine-tuning then deepens while pursuing higher point accuracy. The most accurate model (Tulu~3 70B-DPO fine-tuned on WVS, 57.9\\%) keeps half the human spread overall ($\\dr = 0.50$) and 11\\% of it for Nigeria, against 0.70--0.87 for WEIRD countries. Raising the sampling temperature to 1.0 leaves the Wasserstein-1 distance ($\\wone$) to human distributions unchanged for both fine-tuned DPO models, and GRPO on Qwen~3.5 9B does not restore the spread under either an accuracy reward or a distribution-shaped reward. Mixing the aligned model with an unaligned prior raises $\\dr$ from 0.51 to 0.62 on a held-out split but leaves Nigeria at 0.36. Point accuracy alone therefore misjudges these simulators, and current post-training trades diversity for consensus.", "arxiv_id": "2609.25760", "arxiv_url": "https://arxiv.org/abs/2609.25760", "authors": ["Rojin Ziaei"], "brief": "\u672c\u6587\u63d0\u51fa\u540c\u65f6\u8861\u91cf\u56de\u7b54\u51c6\u786e\u7387\u4e0e\u7fa4\u4f53\u610f\u89c1\u79bb\u6563\u5ea6\u4fdd\u7559\u7387\u7684\u8bca\u65ad\u6846\u67b6\uff0c\u7528\u4e16\u754c\u4ef7\u503c\u89c2\u8c03\u67e5\u8bc4\u4f30\u591a\u79cd\u96f6\u6837\u672c\u4e0e\u5fae\u8c03\u5927\u6a21\u578b\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u6307\u4ee4\u5fae\u8c03\u3001DPO\u3001GRPO \u7b49\u540e\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u201c\u5171\u8bc6\u574d\u7f29\u201d\uff0c\u663e\u8457\u538b\u7f29\u8de8\u6587\u5316\u610f\u89c1\u5dee\u5f02\uff0c\u5c24\u5176\u524a\u5f31\u975e WEIRD \u56fd\u5bb6\u5206\u5e03\uff1b\u5355\u7eaf\u63d0\u9ad8\u91c7\u6837\u6e29\u5ea6\u6216\u7528\u8c03\u67e5\u6570\u636e\u5fae\u8c03\u4e5f\u96be\u4ee5\u6062\u590d\u591a\u6837\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25760", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u793e\u4f1a\u6a21\u62df", "\u540e\u8bad\u7ec3", "\u6587\u5316\u504f\u5dee"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25760", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Limits of Simulated Societies: How Post-Training and Survey Fine-Tuning Erase Cross-Cultural Variance", "tldr": "\u672c\u6587\u63d0\u51fa\u540c\u65f6\u8861\u91cf\u56de\u7b54\u51c6\u786e\u7387\u4e0e\u7fa4\u4f53\u610f\u89c1\u79bb\u6563\u5ea6\u4fdd\u7559\u7387\u7684\u8bca\u65ad\u6846\u67b6\uff0c\u7528\u4e16\u754c\u4ef7\u503c\u89c2\u8c03\u67e5\u8bc4\u4f30\u591a\u79cd\u96f6\u6837\u672c\u4e0e\u5fae\u8c03\u5927\u6a21\u578b\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u6307\u4ee4\u5fae\u8c03\u3001DPO\u3001GRPO \u7b49\u540e\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u201c\u5171\u8bc6\u574d\u7f29\u201d\uff0c\u663e\u8457\u538b\u7f29\u8de8\u6587\u5316\u610f\u89c1\u5dee\u5f02\uff0c\u5c24\u5176\u524a\u5f31\u975e WEIRD \u56fd\u5bb6\u5206\u5e03\uff1b\u5355\u7eaf\u63d0\u9ad8\u91c7\u6837\u6e29\u5ea6\u6216\u7528\u8c03\u67e5\u6570\u636e\u5fae\u8c03\u4e5f\u96be\u4ee5\u6062\u590d\u591a\u6837\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) have achieved strong performance on tasks such as visual question answering, yet small image resizes can turn correct answers into errors. We investigate whether changes in visual configuration, such as image tiling and token arrangement, contribute to this instability. Across seven checkpoints and four benchmarks, equally small resizes cause more correctness flips when they switch configurations. Surprisingly, in over half of these cases, models answer the question incorrectly but can still read the correct answer when told what to read. Furthermore, attention interventions in LLaVA-NeXT suggest that configuration changes can weaken the use of readable information during answering. We therefore guide models using field cues and their own transcriptions. With annotation assistance, these forms of guidance together correct 97.2% of errors with readable information. These findings show that configuration changes can affect how models use information they can still read.", "arxiv_id": "2609.25770", "arxiv_url": "https://arxiv.org/abs/2609.25770", "authors": ["Dingyang Lin", "Yingfeng Luo", "Chenglong Wang", "Chenwei Zhu", "Anxiang Ma", "Jingbo Zhu", "Tong Xiao"], "brief": "\u672c\u6587\u7814\u7a76\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u56fe\u50cf\u8f7b\u5fae\u7f29\u653e\u65f6\u4e3a\u4f55\u4f1a\u4ece\u7b54\u5bf9\u53d8\u7b54\u9519\uff0c\u53d1\u73b0\u56fe\u50cf\u5207\u5757\u3001\u89c6\u89c9 token \u6392\u5217\u7b49\u914d\u7f6e\u53d8\u5316\u4f1a\u663e\u8457\u589e\u52a0\u7b54\u6848\u7ffb\u8f6c\u3002\u5f88\u591a\u60c5\u51b5\u4e0b\u6a21\u578b\u5176\u5b9e\u4ecd\u80fd\u8bfb\u51fa\u6b63\u786e\u6587\u5b57\uff0c\u4f46\u5728\u56de\u7b54\u65f6\u6ca1\u6709\u6709\u6548\u4f7f\u7528\u8fd9\u4e9b\u53ef\u8bfb\u8bc1\u636e\uff1b\u901a\u8fc7\u5b57\u6bb5\u63d0\u793a\u548c\u6a21\u578b\u81ea\u8eab\u8f6c\u5199\u8f85\u52a9\uff0c\u53ef\u7ea0\u6b63 97.2% \u8fd9\u7c7b\u9519\u8bef\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25770", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u95ee\u7b54", "\u9c81\u68d2\u6027", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25770", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reading Right, Answering Wrong: How Visual Configuration Changes Affect Evidence Use in VLMs", "tldr": "\u672c\u6587\u7814\u7a76\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u56fe\u50cf\u8f7b\u5fae\u7f29\u653e\u65f6\u4e3a\u4f55\u4f1a\u4ece\u7b54\u5bf9\u53d8\u7b54\u9519\uff0c\u53d1\u73b0\u56fe\u50cf\u5207\u5757\u3001\u89c6\u89c9 token \u6392\u5217\u7b49\u914d\u7f6e\u53d8\u5316\u4f1a\u663e\u8457\u589e\u52a0\u7b54\u6848\u7ffb\u8f6c\u3002\u5f88\u591a\u60c5\u51b5\u4e0b\u6a21\u578b\u5176\u5b9e\u4ecd\u80fd\u8bfb\u51fa\u6b63\u786e\u6587\u5b57\uff0c\u4f46\u5728\u56de\u7b54\u65f6\u6ca1\u6709\u6709\u6548\u4f7f\u7528\u8fd9\u4e9b\u53ef\u8bfb\u8bc1\u636e\uff1b\u901a\u8fc7\u5b57\u6bb5\u63d0\u793a\u548c\u6a21\u578b\u81ea\u8eab\u8f6c\u5199\u8f85\u52a9\uff0c\u53ef\u7ea0\u6b63 97.2% \u8fd9\u7c7b\u9519\u8bef\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "HopChain has shown on still images that multi-hop data synthesis improves vision-language reasoning, because long chain-of-thought reasoning exposes errors that compound across steps, while most data used for reinforcement learning with verifiable rewards (RLVR) rarely demands a chain of visual evidence, so these weaknesses are likely to stay unexposed. We observe the same problem in video, where this framework has not yet been explored. We therefore build Video-HopChain, a dataset of 22,550 multi-hop video questions over 13,378 videos, together with a held-out benchmark of 1,000 questions. Each question chains three to six yes/no questions about moments in one video, and each yields one of two integers depending on its answer. The final answer is the sum of these integers, so an exact match on that sum gives the verifiable reward that RLVR needs. We first train Qwen3-VL-8B with GRPO on a standard video dataset, and a second stage on Video-HopChain then raises the mean over eight video understanding and reasoning benchmarks from 55.4 to 57.9 and improves every one of them. Training on such a dataset, however, exposes a known limitation of GRPO: its learning signal comes from the reward variance within a group, so hard questions whose rollouts are all incorrect and easy questions whose rollouts are all correct both leave the group with no gradient. To recover these groups at the same compute budget, we introduce Confidence-Gated Exploration (CGE). With 8 rollouts per question, CGE samples the first 4 as usual. If these 4 are either all correct or all incorrect, it samples the last 4 with the policy\u0027s most confident token masked inside the reasoning span, and removes the masked positions from the loss while all 8 rollouts enter the advantage. With CGE, the mean rises further to 59.3. We release the dataset, the checkpoint, and the data generation and training code.", "arxiv_id": "2609.25773", "arxiv_url": "https://arxiv.org/abs/2609.25773", "authors": ["Trung Nguyen Quang", "Yuhao Dong", "Shuo Sun", "Shuai Liu", "Shulin Tian", "Kim-Hui Yap", "Ziwei Liu"], "brief": "\u672c\u6587\u63d0\u51fa Video-HopChain\uff0c\u4e00\u4e2a\u5305\u542b2.25\u4e07\u591a\u8df3\u89c6\u9891\u95ee\u7b54\u7684\u6570\u636e\u96c6\uff0c\u901a\u8fc7\u53ef\u9a8c\u8bc1\u7684\u6574\u6570\u7b54\u6848\u5956\u52b1\u6765\u8bad\u7ec3\u89c6\u9891\u63a8\u7406\u6a21\u578b\u3002\u57fa\u4e8e Qwen3-VL-8B \u7684\u4e24\u9636\u6bb5 GRPO \u8bad\u7ec3\u5c068\u4e2a\u89c6\u9891\u7406\u89e3\u4e0e\u63a8\u7406\u57fa\u51c6\u5747\u503c\u4ece55.4\u63d0\u5347\u523057.9\uff1b\u8fdb\u4e00\u6b65\u63d0\u51fa\u7f6e\u4fe1\u95e8\u63a7\u63a2\u7d22\uff08CGE\uff09\u7f13\u89e3\u65e0\u68af\u5ea6\u6837\u672c\u95ee\u9898\uff0c\u63d0\u5347\u523059.3\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25773", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u63a8\u7406", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25773", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Video-HopChain: Multi-Hop Questions and Confidence-Gated Exploration for Video Reasoning Models", "tldr": "\u672c\u6587\u63d0\u51fa Video-HopChain\uff0c\u4e00\u4e2a\u5305\u542b2.25\u4e07\u591a\u8df3\u89c6\u9891\u95ee\u7b54\u7684\u6570\u636e\u96c6\uff0c\u901a\u8fc7\u53ef\u9a8c\u8bc1\u7684\u6574\u6570\u7b54\u6848\u5956\u52b1\u6765\u8bad\u7ec3\u89c6\u9891\u63a8\u7406\u6a21\u578b\u3002\u57fa\u4e8e Qwen3-VL-8B \u7684\u4e24\u9636\u6bb5 GRPO \u8bad\u7ec3\u5c068\u4e2a\u89c6\u9891\u7406\u89e3\u4e0e\u63a8\u7406\u57fa\u51c6\u5747\u503c\u4ece55.4\u63d0\u5347\u523057.9\uff1b\u8fdb\u4e00\u6b65\u63d0\u51fa\u7f6e\u4fe1\u95e8\u63a7\u63a2\u7d22\uff08CGE\uff09\u7f13\u89e3\u65e0\u68af\u5ea6\u6837\u672c\u95ee\u9898\uff0c\u63d0\u5347\u523059.3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fine-grained mixture-of-experts (MoE) architectures have become a mainstream design for open-weight LLMs, with hundreds of experts and increasingly many selected per token. This shift makes dynamic expert pruning an attractive route to cheaper inference. Yet existing evidence comes largely from coarser architectures and likelihood-scored multiple-choice benchmarks, leaving three central questions open in the fine-grained regime: how redundant per-token expert selection is, how effectively existing pruning methods exploit that redundancy, and what governs a model\u0027s sensitivity to pruning. We fill this gap with a systematic empirical study of twelve fine-grained MoE checkpoints spanning nine architecture families, with a core suite of eleven benchmarks covering knowledge QA, mathematics, code generation, and general reasoning. We find that expert selection is far more redundant than the field\u0027s operating points assume: uniformly retaining about two thirds of the selected experts preserves 98.8% of unpruned performance on average, requiring only a one-integer change and delivering 1.2-1.7x measured speedup across two serving backends. This simple baseline leaves little room for dynamic allocation at conservative budgets: even the best published rules differ from it by under 1% at matched expert budgets. Their value emerges under aggressive pruning, where the best rules recover up to 3.0% over uniform truncation, with gains concentrated in the generative tasks that suffer the sharpest degradation. Sensitivity to aggressive pruning also depends on the model: larger and thinking models are more resilient, whereas multimodal models are more vulnerable. Together, these findings reveal how much expert computation fine-grained MoEs can dispense with, and establish when dynamic allocation earns its complexity, informing both practical deployment and future pruning methods.", "arxiv_id": "2609.25809", "arxiv_url": "https://arxiv.org/abs/2609.25809", "authors": ["Yuanteng Chen", "Qiwei Lai", "Chen Tianqi", "Peisong Wang", "Yuantian Shao", "Nanxin Zeng", "Zhilei Liu", "Chuangyi Li", "Jing Liu", "Jian Cheng"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e8612\u4e2a\u7ec6\u7c92\u5ea6 MoE \u5927\u6a21\u578b\u4e2d\u7684\u52a8\u6001\u4e13\u5bb6\u526a\u679d\uff0c\u53d1\u73b0\u6bcf\u4e2a token \u53ea\u4fdd\u7559\u7ea6\u4e09\u5206\u4e4b\u4e8c\u5df2\u9009\u4e13\u5bb6\uff0c\u5e73\u5747\u4ecd\u53ef\u4fdd\u6301\u672a\u526a\u679d\u6027\u80fd\u768498.8%\uff0c\u5e76\u5e26\u67651.2-1.7\u500d\u5b9e\u6d4b\u63a8\u7406\u52a0\u901f\u3002\u73b0\u6709\u52a8\u6001\u5206\u914d\u65b9\u6cd5\u5728\u4fdd\u5b88\u526a\u679d\u4e0b\u76f8\u6bd4\u7b80\u5355\u5747\u5300\u622a\u65ad\u63d0\u5347\u5f88\u5c0f\uff0c\u4f46\u5728\u6fc0\u8fdb\u526a\u679d\u548c\u751f\u6210\u4efb\u52a1\u4e2d\u53ef\u6700\u591a\u6062\u590d\u7ea63.0%\u6027\u80fd\uff1b\u6a21\u578b\u89c4\u6a21\u3001\u66f4\u5f3a\u63a8\u7406\u80fd\u529b\u548c\u591a\u6a21\u6001\u5c5e\u6027\u4f1a\u5f71\u54cd\u526a\u679d\u654f\u611f\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25809", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u526a\u679d", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25809", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "You Only Need 2/3 of the Chosen Experts: An Empirical Study of Dynamic Expert Pruning in Fine-Grained MoE LLMs", "tldr": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e8612\u4e2a\u7ec6\u7c92\u5ea6 MoE \u5927\u6a21\u578b\u4e2d\u7684\u52a8\u6001\u4e13\u5bb6\u526a\u679d\uff0c\u53d1\u73b0\u6bcf\u4e2a token \u53ea\u4fdd\u7559\u7ea6\u4e09\u5206\u4e4b\u4e8c\u5df2\u9009\u4e13\u5bb6\uff0c\u5e73\u5747\u4ecd\u53ef\u4fdd\u6301\u672a\u526a\u679d\u6027\u80fd\u768498.8%\uff0c\u5e76\u5e26\u67651.2-1.7\u500d\u5b9e\u6d4b\u63a8\u7406\u52a0\u901f\u3002\u73b0\u6709\u52a8\u6001\u5206\u914d\u65b9\u6cd5\u5728\u4fdd\u5b88\u526a\u679d\u4e0b\u76f8\u6bd4\u7b80\u5355\u5747\u5300\u622a\u65ad\u63d0\u5347\u5f88\u5c0f\uff0c\u4f46\u5728\u6fc0\u8fdb\u526a\u679d\u548c\u751f\u6210\u4efb\u52a1\u4e2d\u53ef\u6700\u591a\u6062\u590d\u7ea63.0%\u6027\u80fd\uff1b\u6a21\u578b\u89c4\u6a21\u3001\u66f4\u5f3a\u63a8\u7406\u80fd\u529b\u548c\u591a\u6a21\u6001\u5c5e\u6027\u4f1a\u5f71\u54cd\u526a\u679d\u654f\u611f\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Discrete action tokenization is central to autoregressive vision-language-action (VLA) models, yet action representations are often evaluated primarily through reconstruction fidelity. We ask which representation properties actually matter for closed-loop control by comparing fixed analytical, data-driven linear, and nonlinear neural representations under a unified tokenization interface. Across rate-distortion analysis, sequence-modeling diagnostics, and 3,500 LIBERO rollouts, representation rankings change with the evaluation criterion. PCA achieves lower nominal reconstruction error than Temporal-DCT, but produces less predictable token sequences and 3.0 percentage points lower mean seen-task success across three policy-training seeds, with the policy ordering reversing in one seed. In a matched seed-42 ablation, an autoencoder further reduces reconstruction error yet does not yield the strongest policy and exhibits greater sensitivity to discrete token perturbations. These findings show that reconstruction fidelity alone cannot reliably select action representations for autoregressive control, motivating joint evaluation of geometric fidelity, sequence predictability, decoder stability, and closed-loop performance.", "arxiv_id": "2609.25820", "arxiv_url": "https://arxiv.org/abs/2609.25820", "authors": ["Yuxin Yang", "Gaohan He", "Changxue Guan", "Hangming Liu"], "brief": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86 VLA \u81ea\u56de\u5f52\u63a7\u5236\u4e2d\u7684\u79bb\u6563\u52a8\u4f5c\u8868\u793a\uff0c\u5305\u62ec\u89e3\u6790\u65b9\u6cd5\u3001\u7ebf\u6027\u6570\u636e\u9a71\u52a8\u65b9\u6cd5\u548c\u975e\u7ebf\u6027\u795e\u7ecf\u8868\u793a\u3002\u7ed3\u679c\u663e\u793a\uff0c\u91cd\u5efa\u8bef\u5dee\u4f4e\u5e76\u4e0d\u7b49\u4e8e\u95ed\u73af\u63a7\u5236\u6548\u679c\u597d\uff0c\u52a8\u4f5c\u8868\u793a\u8fd8\u9700\u8981\u540c\u65f6\u8003\u8651\u5e8f\u5217\u53ef\u9884\u6d4b\u6027\u3001\u89e3\u7801\u7a33\u5b9a\u6027\u548c\u5b9e\u9645\u4efb\u52a1\u6210\u529f\u7387\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25820", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u52a8\u4f5c\u79bb\u6563\u5316", "\u673a\u5668\u4eba\u63a7\u5236", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25820", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Reconstruction Error: Analytical and Data-Driven Action Tokenization for Autoregressive Vision-Language-Action Models", "tldr": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86 VLA \u81ea\u56de\u5f52\u63a7\u5236\u4e2d\u7684\u79bb\u6563\u52a8\u4f5c\u8868\u793a\uff0c\u5305\u62ec\u89e3\u6790\u65b9\u6cd5\u3001\u7ebf\u6027\u6570\u636e\u9a71\u52a8\u65b9\u6cd5\u548c\u975e\u7ebf\u6027\u795e\u7ecf\u8868\u793a\u3002\u7ed3\u679c\u663e\u793a\uff0c\u91cd\u5efa\u8bef\u5dee\u4f4e\u5e76\u4e0d\u7b49\u4e8e\u95ed\u73af\u63a7\u5236\u6548\u679c\u597d\uff0c\u52a8\u4f5c\u8868\u793a\u8fd8\u9700\u8981\u540c\u65f6\u8003\u8651\u5e8f\u5217\u53ef\u9884\u6d4b\u6027\u3001\u89e3\u7801\u7a33\u5b9a\u6027\u548c\u5b9e\u9645\u4efb\u52a1\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Part segmentation is a fundamental problem in computer graphics and 3D vision. Recent works have expanded 3D part segmentation beyond fixed taxonomies, but existing approaches typically only address a specific setting, such as text-guided part segmentation or point-based interaction. In this work, we argue that these settings can be unified as an intent-conditioned generative problem, where different prompts specify the desired part decomposition. To this end, we introduce PartLLM, a unified multimodal model that formulates 3D part segmentation as autoregressive semantic decomposition. Conditioned on an input shape and a user prompt, PartLLM autoregressively generates semantic part hypotheses as queries for mask prediction and feeds them to a decomposition-aware decoder that jointly pre \u5ba4\u5185\u573a\u666f\u4e2d\u7684\u7a7a\u95f4\u5ea6\u91cf\u63a8\u7406\uff0c\u65e0\u9700\u76f8\u673a\u5185\u53c2\u5373\u53ef\u5b66\u4e60\u9690\u5f0f 2D \u5230 3D \u6620\u5c04\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa MetricReasoner \u5f3a\u5316\u5fae\u8c03\u65b9\u6cd5\uff0c\u5728\u8be5\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u53ca\u66f4\u5927\u95ed\u6e90\u6a21\u578b\uff0c\u5e76\u63d0\u5347\u5177\u8eab\u4e0b\u6e38\u4efb\u52a1\u8868\u73b0\uff0c\u540c\u65f6\u4e0d\u635f\u5bb3\u901a\u7528 VLM \u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A higher evaluation score does not always mean a better language model system. When optimization exploits an evaluator\u0027s mistakes, measured progress can conceal unchanged or deteriorating task performance. This failure can arise through parameter updates, selection among generated outputs, or revisions to persistent prompts. We develop a comparative framework for reward hacking across these three optimization substrates: weights, selection, and text. Building on the Proxy Compression Hypothesis and research on inference-time and in-context reward hacking, we examine how reachable behavior, optimization budgets, and persistent adaptation shape exposure to proxy error. We formalize a distance-dependent upper bound on evaluator disagreement and a capacity ordering for nested policy classes, then show why distance alone cannot establish a universal ranking of vulnerability. An exact finite-output illustration demonstrates how the location of a scoring defect changes the behavior favored by each method. We also map representative defenses across substrates, identifying which mechanisms transfer directly and which offer only functional analogies. Persistent prompts receive particular attention: their contents are inspectable, but the behavior induced by a small textual change may be difficult to anticipate. The formal analysis, numerical illustration, and published evidence together p let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

    ${links}`;
}

  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
