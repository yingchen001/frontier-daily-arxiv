2a\u57fa\u4e8e\u9884\u8bad\u7ec3\u53cc\u5411\u89c6\u9891\u6269\u6563\u6a21\u578b\u8f7b\u91cf\u9002\u914d\u7684\u6d41\u5f0f\u89c6\u9891\u7f16\u8f91\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u81ea\u56de\u5f52\u65b9\u5f0f\u751f\u6210\u5e76\u7f16\u8f91\u89c6\u9891\uff0c\u5728\u4fdd\u6301\u7f16\u8f91\u8d28\u91cf\u7684\u540c\u65f6\u652f\u6301\u5b9e\u65f6\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/YujiaHu1109/SVEET", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2609.24788", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u603b\u7ed3\u51fa\u6d41\u5f0f\u9002\u914d\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u4e24\u6761\u539f\u5219\uff1a\u9aa8\u5e72\u7279\u5f81\u89e3\u8026\u4e0e\u6761\u4ef6\u5e27\u72ec\u7acb\u6027", "\u5f15\u5165\u8f85\u52a9\u5206\u652f\uff0c\u7528\u65f6\u95f4\u72ec\u7acb\u7684\u81ea\u6ce8\u610f\u529b\u7f16\u7801\u6e90\u89c6\u9891\uff0c\u5e76\u5c06\u4e2d\u95f4\u7279\u5f81\u6ce8\u5165\u9aa8\u5e72\u7f51\u7edc\u4ee5\u5b9e\u73b0\u53ef\u63a7\u7f16\u8f91", "\u63d0\u51fa\u89e3\u8026\u8bad\u7ec3\u7b56\u7565\uff0c\u7ea6\u675f\u53ef\u63a7\u6027\u4e0e\u56e0\u679c\u6027\u4f18\u5316\u65b9\u5411\u6b63\u4ea4\uff0c\u652f\u6301\u8de8\u5f02\u6784\u9aa8\u5e72\u7684\u96f6\u6837\u672c\u77e5\u8bc6\u8fc1\u79fb"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u6269\u6563\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u5b9e\u65f6\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2609.24788", "published_at": "2026-09-21", "score": 0.234, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24788.png", "title": "Streaming Video Editing with Easy Adaptation", "tldr": "SVEET\u5b9e\u73b0\u9ad8\u8d28\u91cf\u5b9e\u65f6\u6d41\u5f0f\u89c6\u9891\u7f16\u8f91", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa SVEET\uff0c\u4e00\u4e2a\u57fa\u4e8e\u9884\u8bad\u7ec3\u53cc\u5411\u89c6\u9891\u6269\u6563\u6a21\u578b\u8f7b\u91cf\u9002\u914d\u7684\u6d41\u5f0f\u89c6\u9891\u7f16\u8f91\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u81ea\u56de\u5f52\u65b9\u5f0f\u751f\u6210\u5e76\u7f16\u8f91\u89c6\u9891\uff0c\u5728\u4fdd\u6301\u7f16\u8f91\u8d28\u91cf\u7684\u540c\u65f6\u652f\u6301\u5b9e\u65f6\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u9ad8\u8d28\u91cf\u89c6\u9891\u6269\u6563\u7f16\u8f91\u63a8\u8fdb\u5230\u6d41\u5f0f\u3001\u5b9e\u65f6\u573a\u666f\uff0c\u5728\u5355\u5f20 H100 \u4e0a\u8fbe\u5230 15 FPS\uff0c\u5177\u6709\u9762\u5411\u4ea4\u4e92\u5f0f\u89c6\u9891\u7f16\u8f91\u548c\u5728\u7ebf\u5185\u5bb9\u751f\u6210\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generating Scalable Vector Graphics (SVG) code from natural-language instructions is an open-ended task without absolute visual ground truth, leaving both evaluation and policy optimization without a faithful signal. Scalar metrics (CLIP, Aesthetic) calibrated on natural images transfer poorly to stylized vector content, and reusing them as RL rewards triggers reward hacking. We address both limitations with rubric-based scoring. We first establish empirically that prompting a vision-language judge with a multi-axis rubric correlates with human judgments far better than scalar metrics, both across samples and within instructions. Building on this finding, we introduce RULER (Instance-aware Rubric Rewards for Reinforcement Learning), which converts each instruction into an instance-aware rubric of six items spanning semantic, visual, and stylistic axes; a judge VLM scores rendered rollouts item-by-item, and the weighted satisfactions form a fine-grained reward optimized via Group Relative Policy Optimization. Because the rubric is derived from text alone, RULER requires neither paired SVG ground truth nor human preference labels. On MMSVG-Illustration and MMSVG-Icon, RULER lifts the rubric score from 0.432/0.395 to 0.693/0.683, surpassing dedicated SVG specialists and matching the substantially larger DeepSeek-V3, with ablations identifying rubric design as the active lever for RL on open-ended SVG generation. The project page is available at https://hangyuran.github.io/RULER/.", "arxiv_id": "2609.25270", "arxiv_url": "https://arxiv.org/abs/2609.25270", "authors": ["Hangyu Ran", "Yuhao Zheng", "Yingying Zhang", "Kevin Qinghong Lin", "Han Peng"], "brief": "\u672c\u6587\u63d0\u51fa RULER\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u81ea\u52a8\u8f6c\u6362\u4e3a\u5305\u542b\u8bed\u4e49\u3001\u89c6\u89c9\u3001\u98ce\u683c\u7b49\u516d\u9879\u7ef4\u5ea6\u7684\u5b9e\u4f8b\u611f\u77e5\u8bc4\u5206\u89c4\u7ea6\uff0c\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9010\u9879\u6253\u5206\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u6765\u4f18\u5316 SVG \u4ee3\u7801\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25270", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u660e\u591a\u7ef4 rubric \u63d0\u793a\u7684\u89c6\u89c9\u8bed\u8a00\u8bc4\u5224\u5668\u6bd4 CLIP\u3001\u7f8e\u5b66\u5206\u7b49\u6807\u91cf\u6307\u6807\u66f4\u7b26\u5408\u4eba\u7c7b\u5224\u65ad\uff0c\u5c24\u5176\u9002\u5408\u5f00\u653e\u5f0f\u77e2\u91cf\u56fe\u751f\u6210\u3002", "RULER \u4e0d\u4f9d\u8d56\u6210\u5bf9 SVG \u771f\u503c\u6216\u4eba\u5de5\u504f\u597d\u6807\u7b7e\uff0c\u4ec5\u4ece\u6587\u672c\u6307\u4ee4\u751f\u6210\u8bc4\u5206\u89c4\u7ea6\uff0c\u5e76\u7528\u6e32\u67d3\u7ed3\u679c\u9010\u9879\u6253\u5206\u5f62\u6210\u7ec6\u7c92\u5ea6\u5956\u52b1\u3002", "\u5728 MMSVG-Illustration \u548c MMSVG-Icon \u4e0a\uff0crubric \u5206\u6570\u4ece 0.432/0.395 \u63d0\u5347\u5230 0.693/0.683\uff0c\u8d85\u8fc7\u4e13\u7528 SVG \u6a21\u578b\u5e76\u63a5\u8fd1\u66f4\u5927\u7684 DeepSeek-V3\u3002"], "keywords": ["SVG\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8bc4\u4f30\u6307\u6807"], "num_comments": 1, "on_hf": true, "organization": "inclusionAI", "pdf_url": "https://arxiv.org/pdf/2609.25270", "published_at": "2026-09-21", "score": 0.23, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.25270.png", "title": "RULER: Instance-aware Rubric Rewards for SVG Generation", "tldr": "\u7528\u5b9e\u4f8b\u5316\u8bc4\u5206\u89c4\u7ea6\u5f3a\u5316SVG\u751f\u6210", "upvotes": 6, "what_it_is": "\u672c\u6587\u63d0\u51fa RULER\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u81ea\u52a8\u8f6c\u6362\u4e3a\u5305\u542b\u8bed\u4e49\u3001\u89c6\u89c9\u3001\u98ce\u683c\u7b49\u516d\u9879\u7ef4\u5ea6\u7684\u5b9e\u4f8b\u611f\u77e5\u8bc4\u5206\u89c4\u7ea6\uff0c\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9010\u9879\u6253\u5206\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u6765\u4f18\u5316 SVG \u4ee3\u7801\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u65e0\u660e\u786e\u89c6\u89c9\u771f\u503c\u7684 SVG \u751f\u6210\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u8bc4\u4f30\u4e0e\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u4fe1\u53f7\uff0c\u7f13\u89e3\u81ea\u7136\u56fe\u50cf\u6307\u6807\u8fc1\u79fb\u5dee\u548c\u5956\u52b1\u9ed1\u5ba2\u95ee\u9898\uff0c\u5bf9\u5f00\u653e\u5f0f\u89c6\u89c9\u4ee3\u7801\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Evaluating an AI system requires disaggregated assessment, as performance varies across domains such as benchmark task types or conversation types in deployed agents. Exhaustive testing is expensive, so evaluation rests on a sample of labeled units. We treat the evaluation set as a finite population and seek accurate point and interval estimates of each domain mean. Direct estimators, including prediction-powered inference (PPI), use only a domain\u0027s own labels and are imprecise where labels are few. Small area estimation addresses this problem, and we build on it to develop an integrated workflow for estimation and validation. For estimation, we propose prediction-powered smoothing (PP-S), a Bayesian model fit to each domain\u0027s prediction-powered estimate, with an extension that borrows strength across a reporting taxonomy (PP-TS). For validation, we derive a new, approximately unbiased design-based cross-validation score for choosing among direct and smoothed estimators. We study a curated benchmark with verifiable grading and deployed agent traffic graded by humans, each with every outcome observed. In both, the proposed estimators improve on the direct estimators in point and interval estimation, with near-nominal coverage. At the same sampling budget, our score selects as well as an independent validation sample does and estimates the selected estimator\u0027s error far more accurately.", "arxiv_id": "2609.20758", "arxiv_url": "https://arxiv.org/abs/2609.20758", "authors": ["Sho Kawano", "Zehang Richard Li", "Paul A. Parker"], "brief": "\u8bba\u6587\u5c06AI\u7cfb\u7edf\u5206\u57df\u8bc4\u4f30\u89c6\u4e3a\u6709\u9650\u603b\u4f53\u4f30\u8ba1\u95ee\u9898\uff0c\u9488\u5bf9\u5404\u4efb\u52a1\u7c7b\u578b\u6216\u5bf9\u8bdd\u7c7b\u578b\u6837\u672c\u6807\u7b7e\u4e0d\u8db3\u5bfc\u81f4\u4f30\u8ba1\u4e0d\u7a33\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u9884\u6d4b\u589e\u5f3a\u5e73\u6ed1\u65b9\u6cd5PP-S\u53ca\u5229\u7528\u5206\u7c7b\u5c42\u7ea7\u501f\u529b\u7684PP-TS\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u8fd1\u4f3c\u65e0\u504f\u7684\u8bbe\u8ba1\u578b\u4ea4\u53c9\u9a8c\u8bc1\u5206\u6570\uff0c\u7528\u4e8e\u5728\u76f4\u63a5\u4f30\u8ba1\u548c\u5e73\u6ed1\u4f30\u8ba1\u4e4b\u95f4\u9009\u62e9\u5e76\u9a8c\u8bc1\u8bef\u5dee\u3002", "categories": ["stat.ML", "cs.AI", "cs.LG", "stat.AP", "stat.ME"], "github_repo": "https://github.com/sho-kawano/disagg-ai-eval", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20758", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["PP-S\u5728\u6bcf\u4e2a\u9886\u57df\u7684prediction-powered estimate\u57fa\u7840\u4e0a\u62df\u5408\u8d1d\u53f6\u65af\u5e73\u6ed1\u6a21\u578b\uff0c\u4ee5\u7f13\u89e3\u5c0f\u6837\u672c\u9886\u57df\u4f30\u8ba1\u65b9\u5dee\u8fc7\u5927\u7684\u95ee\u9898", "PP-TS\u8fdb\u4e00\u6b65\u5229\u7528\u62a5\u544a taxonomy \u7684\u5c42\u7ea7\u7ed3\u6784\uff0c\u5728\u76f8\u5173\u9886\u57df\u4e4b\u95f4\u5171\u4eab\u7edf\u8ba1\u5f3a\u5ea6", "\u5728\u53ef\u9a8c\u8bc1\u8bc4\u5206\u57fa\u51c6\u548c\u4eba\u5de5\u8bc4\u5206\u7684\u7ebf\u4e0a\u667a\u80fd\u4f53\u6d41\u91cf\u6570\u636e\u4e0a\uff0c\u65b9\u6cd5\u5728\u70b9\u4f30\u8ba1\u548c\u533a\u95f4\u4f30\u8ba1\u4e0a\u4f18\u4e8e\u76f4\u63a5\u4f30\u8ba1\uff0c\u5e76\u4fdd\u6301\u63a5\u8fd1\u6807\u79f0\u8986\u76d6\u7387"], "keywords": ["AI\u8bc4\u4f30", "\u7edf\u8ba1\u63a8\u65ad", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u5c0f\u6837\u672c\u4f30\u8ba1"], "num_comments": 2, "on_hf": true, "organization": "University of California at Santa Cruz", "pdf_url": "https://arxiv.org/pdf/2609.20758", "published_at": "2026-09-17", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.20758.png", "title": "Prediction-Powered Smoothing and Validation for Disaggregated AI Evaluation", "tldr": "\u7528\u9884\u6d4b\u589e\u5f3a\u5e73\u6ed1\u63d0\u5347\u5206\u57dfAI\u8bc4\u4f30", "upvotes": 3, "what_it_is": "\u8bba\u6587\u5c06AI\u7cfb\u7edf\u5206\u57df\u8bc4\u4f30\u89c6\u4e3a\u6709\u9650\u603b\u4f53\u4f30\u8ba1\u95ee\u9898\uff0c\u9488\u5bf9\u5404\u4efb\u52a1\u7c7b\u578b\u6216\u5bf9\u8bdd\u7c7b\u578b\u6837\u672c\u6807\u7b7e\u4e0d\u8db3\u5bfc\u81f4\u4f30\u8ba1\u4e0d\u7a33\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u9884\u6d4b\u589e\u5f3a\u5e73\u6ed1\u65b9\u6cd5PP-S\u53ca\u5229\u7528\u5206\u7c7b\u5c42\u7ea7\u501f\u529b\u7684PP-TS\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u8fd1\u4f3c\u65e0\u504f\u7684\u8bbe\u8ba1\u578b\u4ea4\u53c9\u9a8c\u8bc1\u5206\u6570\uff0c\u7528\u4e8e\u5728\u76f4\u63a5\u4f30\u8ba1\u548c\u5e73\u6ed1\u4f30\u8ba1\u4e4b\u95f4\u9009\u62e9\u5e76\u9a8c\u8bc1\u8bef\u5dee\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5c0f\u533a\u57df\u4f30\u8ba1\u3001\u9884\u6d4b\u589e\u5f3a\u63a8\u65ad\u4e0eAI\u8bc4\u4f30\u5b9e\u8df5\u7ed3\u5408\u8d77\u6765\uff0c\u4e3a\u4f4e\u6807\u6ce8\u9884\u7b97\u4e0b\u7684\u7ec6\u7c92\u5ea6\u6a21\u578b\u8bc4\u4f30\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u70b9\u4f30\u8ba1\u3001\u7f6e\u4fe1\u533a\u95f4\u548c\u6a21\u578b\u9009\u62e9\u9a8c\u8bc1\u6d41\u7a0b\uff0c\u9002\u5408\u7528\u4e8e\u5927\u89c4\u6a21\u57fa\u51c6\u548c\u7ebf\u4e0a\u7cfb\u7edf\u76d1\u63a7\u3002"}, {"abstract": "The rising global prevalence of mental health conditions, together with longstanding barriers in traditional healthcare, such as limited resources, high cost, stigma, and privacy concerns, has created an urgent need for accessible and scalable support. Large Language Models (LLMs) have emerged as a transformative technology with strong potential to democratize mental health support through advanced natural language understanding and generation. However, the rapidly expanding, fragmented body of work in this area lacks a coherent evolutionary narrative, making it difficult to contextualize current progress and identify future directions. This survey addresses this gap by organizing and analyzing the literature around a central thesis: the role of LLMs in mental health is evolving through three distinct, increasingly sophisticated phases. We trace this trajectory from Phase I, in which LLMs act primarily as passive Information Tools and Pattern Recognizers for assessment; through Phase II, where they function as Empathetic Conversationalists for in-the-moment, stateless interactions; to the current frontier, Phase III, which seeks Longitudinal, Personalized Companions implemented as stateful cognitive agents. To support this framework, we systematically review core technologies, agent architectures (Profile, Memory, Reasoning, and Planning), and the critical infrastructure of datasets and benchmarks, highlighting how their evolution underpins this developmental path. Viewing the field through this developmental lens, we provide a comprehensive synthesis of existing work, an insightful narrative of its trajectory, and a clear roadmap for future innovation in responsible, effective, and human-centered AI for mental healthcare. A curated collection of the resources reviewed in this survey is available at our project repository: https://github.com/Emo-gml/Awesome-Mental-Health-LLMs.", "arxiv_id": "2609.25186", "arxiv_url": "https://arxiv.org/abs/2609.25186", "authors": ["He Hu", "Yucheng Zhou", "Qianning Wang", "Yingjian Zou", "Chiyuan Ma", "Juzheng Si", "Jianzhuang Liu", "Zitong Yu", "Laizhong Cui", "Fei Ma", "Qi Tian"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u5728\u5fc3\u7406\u5065\u5eb7\u9886\u57df\u5e94\u7528\u7684\u7efc\u8ff0\uff0c\u63d0\u51fa\u4ece\u4fe1\u606f\u5de5\u5177/\u6a21\u5f0f\u8bc6\u522b\u5668\u3001\u5171\u60c5\u5bf9\u8bdd\u8005\u5230\u957f\u671f\u4e2a\u6027\u5316\u966a\u4f34\u667a\u80fd\u4f53\u7684\u4e09\u9636\u6bb5\u6f14\u8fdb\u6846\u67b6\u3002\u8bba\u6587\u7cfb\u7edf\u68b3\u7406\u76f8\u5173\u6838\u5fc3\u6280\u672f\u3001\u667a\u80fd\u4f53\u67b6\u6784\u3001\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u5e76\u7ed9\u51fa\u9762\u5411\u8d1f\u8d23\u4efb\u5fc3\u7406\u5065\u5eb7AI\u7684\u672a\u6765\u8def\u7ebf\u56fe\u3002", "categories": ["cs.CY", "cs.AI", "cs.CL"], "github_repo": "https://github.com/Emo-gml/Awesome-Mental-Health-LLMs", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25186", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5c06LLM\u5fc3\u7406\u5065\u5eb7\u5e94\u7528\u5212\u5206\u4e3a\u4e09\u9636\u6bb5\uff1a\u8bc4\u4f30\u4e0e\u8bc6\u522b\u3001\u5373\u65f6\u5171\u60c5\u5bf9\u8bdd\u3001\u5177\u5907\u72b6\u6001\u7684\u957f\u671f\u4e2a\u6027\u5316\u966a\u4f34", "\u91cd\u70b9\u5206\u6790Profile\u3001Memory\u3001Reasoning\u3001Planning\u7b49\u667a\u80fd\u4f53\u7ec4\u4ef6\u5982\u4f55\u652f\u6491\u957f\u671f\u5fc3\u7406\u5065\u5eb7\u652f\u6301", "\u6574\u7406\u5fc3\u7406\u5065\u5eb7LLM\u76f8\u5173\u6570\u636e\u96c6\u3001\u8bc4\u6d4b\u57fa\u51c6\u4e0e\u5f00\u6e90\u8d44\u6e90\u5e93\uff0c\u5f3a\u8c03\u5b89\u5168\u6027\u3001\u9690\u79c1\u4e0e\u4e34\u5e8a\u6709\u6548\u6027\u6311\u6218"], "keywords": ["\u5fc3\u7406\u5065\u5eb7", "\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u4e2a\u6027\u5316"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25186", "published_at": "2026-09-21", "score": 0.208, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.25186.png", "title": "From Pattern Recognizers to Personalized Companions: A Survey of Large Language Models in Mental Health", "tldr": "\u7efc\u8ff0LLM\u5fc3\u7406\u5065\u5eb7\u5e94\u7528\u5411\u4e2a\u6027\u5316\u966a\u4f34\u6f14\u8fdb", "upvotes": 2, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u5728\u5fc3\u7406\u5065\u5eb7\u9886\u57df\u5e94\u7528\u7684\u7efc\u8ff0\uff0c\u63d0\u51fa\u4ece\u4fe1\u606f\u5de5\u5177/\u6a21\u5f0f\u8bc6\u522b\u5668\u3001\u5171\u60c5\u5bf9\u8bdd\u8005\u5230\u957f\u671f\u4e2a\u6027\u5316\u966a\u4f34\u667a\u80fd\u4f53\u7684\u4e09\u9636\u6bb5\u6f14\u8fdb\u6846\u67b6\u3002\u8bba\u6587\u7cfb\u7edf\u68b3\u7406\u76f8\u5173\u6838\u5fc3\u6280\u672f\u3001\u667a\u80fd\u4f53\u67b6\u6784\u3001\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u5e76\u7ed9\u51fa\u9762\u5411\u8d1f\u8d23\u4efb\u5fc3\u7406\u5065\u5eb7AI\u7684\u672a\u6765\u8def\u7ebf\u56fe\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u4e3a\u5feb\u901f\u6269\u5f20\u4f46\u8f83\u788e\u7247\u5316\u7684\u5fc3\u7406\u5065\u5eb7LLM\u7814\u7a76\u63d0\u4f9b\u4e86\u6e05\u6670\u6f14\u8fdb\u53d9\u4e8b\uff0c\u5c24\u5176\u628a\u672a\u6765\u65b9\u5411\u5b9a\u4f4d\u4e3a\u5177\u5907\u8bb0\u5fc6\u548c\u89c4\u5212\u80fd\u529b\u7684\u4e2a\u6027\u5316\u966a\u4f34\u667a\u80fd\u4f53\uff0c\u5bf9\u7814\u7a76\u8def\u7ebf\u3001\u7cfb\u7edf\u8bbe\u8ba1\u548c\u5b89\u5168\u6cbb\u7406\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "We present TAPe+ML v3, a compact computer vision system based on TAPe (Theory of Active Perception), a structured representation that encodes relations among perceptual elements before recognition. Instead of operating directly on pixel tensors, the system uses a shared TAPe representation and a modular recognition architecture for image classification, object detection, and instance segmentation. TAPe+ML v3 combines background and contour processing, local object localization, prototype-based classification, and a coordinator for specialized submodels. Across the reported experiments, it uses fewer than 100,000 parameters. On COCO object detection, it obtains 84.7 mAP50 and 65.3 mAP50-95. On COCO instance segmentation, it obtains 80.7 mask mAP50 and 58.4 mask mAP50-95. In classification experiments, it reaches 92 percent validation accuracy on Imagenette under an identical-training comparison with a raw-pixel baseline, and 89.9 percent Top-1 accuracy on ImageNet-Real. We also evaluate compactness in video scene detection and adaptation under distribution shift in an industrial pilot. The results suggest that shifting part of the modeling burden from network parameters to a structured input representation can support compact multi-task vision systems with reduced data, memory, and compute requirements.", "arxiv_id": "2609.20869", "arxiv_url": "https://arxiv.org/abs/2609.20869", "authors": ["Sergey Kurinov", "Alexey Upatov"], "brief": "\u8bba\u6587\u63d0\u51fa TAPe+ML v3\uff0c\u4e00\u79cd\u57fa\u4e8e\u4e3b\u52a8\u611f\u77e5\u7406\u8bba TAPe \u7684\u7d27\u51d1\u8ba1\u7b97\u673a\u89c6\u89c9\u7cfb\u7edf\u3002\u5b83\u5148\u5c06\u56fe\u50cf\u8f6c\u4e3a\u5305\u542b\u611f\u77e5\u5143\u7d20\u5173\u7cfb\u7684\u7ed3\u6784\u5316\u8868\u793a\uff0c\u518d\u901a\u8fc7\u6a21\u5757\u5316\u67b6\u6784\u5b8c\u6210\u5206\u7c7b\u3001\u68c0\u6d4b\u548c\u5b9e\u4f8b\u5206\u5272\u7b49\u4efb\u52a1\u3002", "categories": ["cs.CV", "eess.IV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20869", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u76f4\u63a5\u4f9d\u8d56\u50cf\u7d20\u5f20\u91cf\u5efa\u6a21\uff0c\u800c\u662f\u4f7f\u7528\u5171\u4eab TAPe \u7ed3\u6784\u5316\u8868\u793a\uff0c\u5c06\u90e8\u5206\u5efa\u6a21\u8d1f\u62c5\u4ece\u7f51\u7edc\u53c2\u6570\u8f6c\u79fb\u5230\u8f93\u5165\u8868\u793a", "\u7cfb\u7edf\u7ed3\u5408\u80cc\u666f\u4e0e\u8f6e\u5ed3\u5904\u7406\u3001\u5c40\u90e8\u76ee\u6807\u5b9a\u4f4d\u3001\u539f\u578b\u5206\u7c7b\uff0c\u4ee5\u53ca\u9762\u5411\u4e13\u95e8\u5b50\u6a21\u578b\u7684\u534f\u8c03\u5668", "\u53c2\u6570\u91cf\u5c11\u4e8e 10 \u4e07\uff1b\u5728 COCO \u68c0\u6d4b\u4e0a\u62a5\u544a 84.7 mAP50\u300165.3 mAP50-95\uff0c\u5728 COCO \u5b9e\u4f8b\u5206\u5272\u4e0a\u62a5\u544a 80.7 mask mAP50\u300158.4 mask mAP50-95"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u7ed3\u6784\u5316\u8868\u793a", "\u591a\u4efb\u52a1\u5b66\u4e60", "\u9ad8\u6548\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Comexp Research Lab", "pdf_url": "https://arxiv.org/pdf/2609.20869", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.20869.png", "title": "TAPe+ML: A Compact Structured Representation for Multi-Task Computer Vision", "tldr": "\u7528\u7ed3\u6784\u5316\u611f\u77e5\u8868\u793a\u5b9e\u73b0\u7d27\u51d1\u591a\u4efb\u52a1\u89c6\u89c9", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa TAPe+ML v3\uff0c\u4e00\u79cd\u57fa\u4e8e\u4e3b\u52a8\u611f\u77e5\u7406\u8bba TAPe \u7684\u7d27\u51d1\u8ba1\u7b97\u673a\u89c6\u89c9\u7cfb\u7edf\u3002\u5b83\u5148\u5c06\u56fe\u50cf\u8f6c\u4e3a\u5305\u542b\u611f\u77e5\u5143\u7d20\u5173\u7cfb\u7684\u7ed3\u6784\u5316\u8868\u793a\uff0c\u518d\u901a\u8fc7\u6a21\u5757\u5316\u67b6\u6784\u5b8c\u6210\u5206\u7c7b\u3001\u68c0\u6d4b\u548c\u5b9e\u4f8b\u5206\u5272\u7b49\u4efb\u52a1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c1d\u8bd5\u4ee5\u7ed3\u6784\u5316\u8868\u793a\u66ff\u4ee3\u5927\u89c4\u6a21\u53c2\u6570\u5806\u53e0\uff0c\u5728\u6781\u5c0f\u53c2\u6570\u91cf\u4e0b\u8986\u76d6\u5206\u7c7b\u3001\u76ee\u6807\u68c0\u6d4b\u3001\u5b9e\u4f8b\u5206\u5272\u7b49\u591a\u4efb\u52a1\uff0c\u82e5\u7ed3\u679c\u53ef\u590d\u73b0\uff0c\u5c06\u5bf9\u4f4e\u7b97\u529b\u3001\u4f4e\u5185\u5b58\u548c\u5c11\u6570\u636e\u573a\u666f\u4e2d\u7684\u89c6\u89c9\u7cfb\u7edf\u8bbe\u8ba1\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "While Multimodal Large Language Models (MLLMs) show remarkable advancements, their cross-modal capabilities introduce complex vulnerabilities that easily bypass unimodal filters. Existing benchmarks lack fine-grained intent-related annotations and rely on unidimensional metrics, hindering comprehensive robustness evaluation. To address this, we propose MME-Safety, a rigorously verified benchmark featuring a unique four-dimensional annotation schema that categorizes risk scenarios, harm severity, and modality-specific stealth levels. Furthermore, we introduce a hierarchical evaluation framework to assess fundamental response reliability, actual risk exposure, and the structural integrity of defensive behaviors. Extensive zero-shot evaluations across 17 state-of-the-art MLLMs provide a comprehensive safety profile of current multimodal systems. Our analysis systematically investigates cross-modal input configurations and uncovers safety implications associated with Chain-of-Thought (CoT) reasoning. These multifaceted findings underscore the urgent need for robust, reasoning-aware safety alignment in the multimodal landscape.", "arxiv_id": "2609.20850", "arxiv_url": "https://arxiv.org/abs/2609.20850", "authors": ["Yilian Shi", "Yueming Lyu", "Haoxiang Tan", "Linzhuang Zou", "Qihao Wang", "Guihua Yu", "Chenyang Si", "Caifeng Shan"], "brief": "\u672c\u6587\u63d0\u51fa MME-Safety\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5b89\u5168\u6027\u7684\u7ec6\u7c92\u5ea6\u57fa\u51c6\uff0c\u8986\u76d6\u98ce\u9669\u573a\u666f\u3001\u4f24\u5bb3\u4e25\u91cd\u5ea6\u548c\u8de8\u6a21\u6001\u9690\u853d\u6027\u7b49\u7ef4\u5ea6\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u5206\u5c42\u8bc4\u4f30\u6846\u67b6\uff0c\u5e76\u5bf9 17 \u4e2a\u4e3b\u6d41 MLLM \u8fdb\u884c\u4e86\u96f6\u6837\u672c\u5b89\u5168\u753b\u50cf\u5206\u6790\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20850", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u56db\u7ef4\u6807\u6ce8\u4f53\u7cfb\uff0c\u7ec6\u5206\u98ce\u9669\u573a\u666f\u3001\u5371\u5bb3\u7a0b\u5ea6\u4ee5\u53ca\u6587\u672c/\u56fe\u50cf\u6a21\u6001\u4e2d\u7684\u9690\u853d\u653b\u51fb\u6c34\u5e73", "\u8bc4\u4f30\u6846\u67b6\u4e0d\u4ec5\u770b\u56de\u7b54\u662f\u5426\u53ef\u9760\uff0c\u8fd8\u8861\u91cf\u5b9e\u9645\u98ce\u9669\u66b4\u9732\u548c\u9632\u5fa1\u884c\u4e3a\u7684\u7ed3\u6784\u5b8c\u6574\u6027", "\u7cfb\u7edf\u5206\u6790\u8de8\u6a21\u6001\u8f93\u5165\u7ec4\u5408\u4e0e Chain-of-Thought \u63a8\u7406\u5bf9\u5b89\u5168\u6027\u7684\u5f71\u54cd\uff0c\u63ed\u793a CoT \u53ef\u80fd\u5e26\u6765\u65b0\u7684\u5b89\u5168\u9690\u60a3"], "keywords": ["\u591a\u6a21\u6001", "\u5b89\u5168\u8bc4\u6d4b", "\u57fa\u51c6\u6d4b\u8bd5", "\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20850", "published_at": "2026-09-22", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MME-Safety: A Fine-grained Benchmark for Safety Evaluation of MLLMs", "tldr": "\u7ec6\u7c92\u5ea6\u8bc4\u6d4b\u591a\u6a21\u6001\u5927\u6a21\u578b\u5b89\u5168\u98ce\u9669", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa MME-Safety\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5b89\u5168\u6027\u7684\u7ec6\u7c92\u5ea6\u57fa\u51c6\uff0c\u8986\u76d6\u98ce\u9669\u573a\u666f\u3001\u4f24\u5bb3\u4e25\u91cd\u5ea6\u548c\u8de8\u6a21\u6001\u9690\u853d\u6027\u7b49\u7ef4\u5ea6\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u5206\u5c42\u8bc4\u4f30\u6846\u67b6\uff0c\u5e76\u5bf9 17 \u4e2a\u4e3b\u6d41 MLLM \u8fdb\u884c\u4e86\u96f6\u6837\u672c\u5b89\u5168\u753b\u50cf\u5206\u6790\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5f25\u8865\u4e86\u73b0\u6709\u591a\u6a21\u6001\u5b89\u5168\u8bc4\u6d4b\u7f3a\u4e4f\u7ec6\u7c92\u5ea6\u610f\u56fe\u6807\u6ce8\u548c\u591a\u7ef4\u6307\u6807\u7684\u95ee\u9898\uff0c\u6709\u52a9\u4e8e\u66f4\u51c6\u786e\u53d1\u73b0 MLLM \u5728\u8de8\u6a21\u6001\u573a\u666f\u4e0b\u7ed5\u8fc7\u5b89\u5168\u9632\u7ebf\u7684\u8106\u5f31\u6027\uff0c\u5bf9\u591a\u6a21\u6001\u5b89\u5168\u5bf9\u9f50\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Computer-use agents (CUAs) have made rapid progress in completing complex tasks through graphical user interfaces, yet post-training centered on task success alone does not induce reliable safety behavior. A reliable CUA must condition its execution on risk: it should complete ordinary benign tasks, avoid environmental hazards and continue when a safe completion path remains, and refuse when the goal is harmful or no safe path exists. To learn this conditional policy, we develop Safety and Capability Optimization for Policy Execution (SCOPE), which jointly post-trains a CUA for task-execution capability and safety-aware decision making. To provide aligned training data for this joint objective, we further introduce SCOPE-Gen, an automated pipeline that synthesizes verifiable capability tasks and converts them into paired environment-risk variants while preserving their original goals. Using the resulting tasks, we construct SATraj-OS, a trajectory dataset comprising capability demonstrations, safe continuations, and explicit refusals. SCOPE first learns from all three trajectory types through supervised fine-tuning and then further improves task completion through online reinforcement learning. Starting from Qwen3.5-9B, SCOPE-RL achieves a 54.17% task success rate on OSWorld and a 64.30% attack-avoidance rate on OS-BLIND, yielding the best aggregate capability--safety score of 58.80% among the evaluated agents. Ablations reveal asymmetric but complementary roles for the two forms of safety supervision: refusal trajectories account for most of the attack-avoidance gain, whereas risk-handling trajectories preserve greater task utility at comparable attack-avoidance levels.", "arxiv_id": "2609.22178", "arxiv_url": "https://arxiv.org/abs/2609.22178", "authors": ["Zeyu Kang", "Zhenyun Yin", "Yang Zhang", "Shan He", "Shanzhe Lei", "Yanjiu Zhong", "Xinquan Chen", "Xuhong Wang"], "brief": "\u8bba\u6587\u63d0\u51fa SCOPE\uff0c\u7528\u4e8e\u5bf9 computer-use agents \u8fdb\u884c\u517c\u987e\u4efb\u52a1\u6267\u884c\u80fd\u529b\u4e0e\u98ce\u9669\u611f\u77e5\u5b89\u5168\u6027\u7684\u8054\u5408\u540e\u8bad\u7ec3\u3002\u4f5c\u8005\u8fd8\u6784\u5efa SCOPE-Gen \u81ea\u52a8\u751f\u6210\u5e26\u98ce\u9669\u53d8\u4f53\u7684\u8bad\u7ec3\u4efb\u52a1\uff0c\u5e76\u4ea7\u51fa SATraj-OS \u8f68\u8ff9\u6570\u636e\u96c6\uff0c\u5305\u542b\u80fd\u529b\u6f14\u793a\u3001\u5b89\u5168\u7eed\u884c\u4e0e\u660e\u786e\u62d2\u7edd\u4e09\u7c7b\u8f68\u8ff9\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.22178", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["SCOPE \u5c06\u76d1\u7763\u5fae\u8c03\u4e0e\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\uff1a\u5148\u5b66\u4e60\u80fd\u529b\u3001\u5b89\u5168\u7eed\u884c\u3001\u62d2\u7edd\u4e09\u7c7b\u8f68\u8ff9\uff0c\u518d\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u4efb\u52a1\u5b8c\u6210\u7387\u3002", "SCOPE-Gen \u53ef\u5c06\u53ef\u9a8c\u8bc1\u7684\u666e\u901a GUI \u4efb\u52a1\u8f6c\u6362\u4e3a\u4fdd\u7559\u539f\u76ee\u6807\u7684\u73af\u5883\u98ce\u9669\u53d8\u4f53\uff0c\u7528\u4e8e\u8bad\u7ec3\u667a\u80fd\u4f53\u5728\u5b89\u5168\u8def\u5f84\u53ef\u884c\u65f6\u7ee7\u7eed\u3001\u76ee\u6807\u6709\u5bb3\u6216\u65e0\u5b89\u5168\u8def\u5f84\u65f6\u62d2\u7edd\u3002", "\u4ece Qwen3.5-9B \u51fa\u53d1\uff0cSCOPE-RL \u5728 OSWorld \u8fbe\u5230 54.17% \u4efb\u52a1\u6210\u529f\u7387\uff0c\u5728 OS-BLIND \u8fbe\u5230 64.30% \u653b\u51fb\u89c4\u907f\u7387\uff0c\u7efc\u5408\u80fd\u529b-\u5b89\u5168\u5206\u6570\u4e3a 58.80%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u5b89\u5168\u5bf9\u9f50", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.22178", "published_at": "2026-09-22", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Task Completion: Training Capable and Safe Computer-Use Agents", "tldr": "\u8054\u5408\u63d0\u5347\u7535\u8111\u667a\u80fd\u4f53\u80fd\u529b\u4e0e\u5b89\u5168\u51b3\u7b56", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SCOPE\uff0c\u7528\u4e8e\u5bf9 computer-use agents \u8fdb\u884c\u517c\u987e\u4efb\u52a1\u6267\u884c\u80fd\u529b\u4e0e\u98ce\u9669\u611f\u77e5\u5b89\u5168\u6027\u7684\u8054\u5408\u540e\u8bad\u7ec3\u3002\u4f5c\u8005\u8fd8\u6784\u5efa SCOPE-Gen \u81ea\u52a8\u751f\u6210\u5e26\u98ce\u9669\u53d8\u4f53\u7684\u8bad\u7ec3\u4efb\u52a1\uff0c\u5e76\u4ea7\u51fa SATraj-OS \u8f68\u8ff9\u6570\u636e\u96c6\uff0c\u5305\u542b\u80fd\u529b\u6f14\u793a\u3001\u5b89\u5168\u7eed\u884c\u4e0e\u660e\u786e\u62d2\u7edd\u4e09\u7c7b\u8f68\u8ff9\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u6307\u51fa\u4ec5\u4f18\u5316\u4efb\u52a1\u6210\u529f\u7387\u4e0d\u8db3\u4ee5\u5f97\u5230\u53ef\u9760\u7684\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\uff0c\u5e76\u7ed9\u51fa\u4e86\u4e00\u5957\u53ef\u6269\u5c55\u7684\u6570\u636e\u751f\u6210\u4e0e\u8054\u5408\u8bad\u7ec3\u65b9\u6848\uff0c\u8ba9\u667a\u80fd\u4f53\u80fd\u6839\u636e\u98ce\u9669\u6761\u4ef6\u9009\u62e9\u6267\u884c\u3001\u7ed5\u5f00\u5371\u9669\u6216\u62d2\u7edd\uff0c\u5bf9 GUI \u667a\u80fd\u4f53\u7684\u5b89\u5168\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Generalizable robot manipulation requires predicting how a scene will evolve, identifying where interactions are feasible, and determining how to act. Action-labeled robot videos directly supervise control but are costly and limited in diversity, whereas egocentric human videos capture diverse interactions but lack robot actions and differ in embodiment and appearance. We introduce AffordanceWAM, an affordance-aware generative World Action Model that represents object-centric spatiotemporal affordance through Scalar Affordance and Affordance Heatmap, within the generated future World. This representation grounds visual prediction in task-relevant objects and interaction regions for action generation, and provides shared interaction targets across human and robot videos. Built on a pretrained video diffusion Transformer, AffordanceWAM uses separately parameterized World and Action Experts, coupled through Masked Joint Self-Attention, to jointly predict future RGB observations, Scalar Affordance fields, Affordance Heatmaps, and continuous robot actions under a unified flow-matching objective. Human videos supervise all three future-World streams, whereas robot trajectories additionally provide action supervision, enabling transfer without human action labels or retargeting. Experiments on RoboCasa, CALVIN ABC$\\rightarrow$D, and real-world manipulation demonstrate consistent gains over RGB-only and robot-data-only baselines. Under fixed robot supervision, RoboCasa performance improves monotonically as affordance-annotated human video scales. These results support affordance as an effective interface for both vision-language-action learning and human-to-robot transfer.", "arxiv_id": "2609.22332", "arxiv_url": "https://arxiv.org/abs/2609.22332", "authors": ["Jiadi You", "Qize Yu", "Yue Chen", "Minghong Cai", "Zhide Zhong", "Yuran Wang", "Bowen Ping", "Jiaqi Liang", "Zhenhao Shen", "Haodong Yan", "Yinchuan Li", "Ruihai Wu", "Xiaojuan Qi", "Yingcong Chen"], "brief": "AffordanceWAM \u63d0\u51fa\u4e00\u79cd\u53ef\u4f9b\u6027\u611f\u77e5\u7684\u8054\u5408\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u5728\u751f\u6210\u672a\u6765\u573a\u666f\u7684\u540c\u65f6\u9884\u6d4b\u7269\u4f53\u4ea4\u4e92\u53ef\u884c\u6027\u3001\u4ea4\u4e92\u70ed\u56fe\u548c\u8fde\u7eed\u673a\u5668\u4eba\u52a8\u4f5c\u3002\u5b83\u5229\u7528\u4eba\u7c7b\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u76d1\u7763\u672a\u6765\u4e16\u754c\u8868\u5f81\uff0c\u5e76\u7528\u673a\u5668\u4eba\u8f68\u8ff9\u76d1\u7763\u52a8\u4f5c\uff0c\u5728 RoboCasa\u3001CALVIN \u548c\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e0a\u4f18\u4e8e\u4ec5\u7528 RGB \u6216\u4ec5\u7528\u673a\u5668\u4eba\u6570\u636e\u7684\u57fa\u7ebf\uff0c\u4e14\u4eba\u7c7b\u89c6\u9891\u89c4\u6a21\u8d8a\u5927\u6027\u80fd\u8d8a\u597d\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.22332", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u53ef\u4f9b\u6027", "\u89c6\u9891\u6269\u6563\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.22332", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AffordanceWAM: Affordance-Aware Joint World-Action Modeling for Robot Manipulation", "tldr": "AffordanceWAM \u63d0\u51fa\u4e00\u79cd\u53ef\u4f9b\u6027\u611f\u77e5\u7684\u8054\u5408\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u5728\u751f\u6210\u672a\u6765\u573a\u666f\u7684\u540c\u65f6\u9884\u6d4b\u7269\u4f53\u4ea4\u4e92\u53ef\u884c\u6027\u3001\u4ea4\u4e92\u70ed\u56fe\u548c\u8fde\u7eed\u673a\u5668\u4eba\u52a8\u4f5c\u3002\u5b83\u5229\u7528\u4eba\u7c7b\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u76d1\u7763\u672a\u6765\u4e16\u754c\u8868\u5f81\uff0c\u5e76\u7528\u673a\u5668\u4eba\u8f68\u8ff9\u76d1\u7763\u52a8\u4f5c\uff0c\u5728 RoboCasa\u3001CALVIN \u548c\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e0a\u4f18\u4e8e\u4ec5\u7528 RGB \u6216\u4ec5\u7528\u673a\u5668\u4eba\u6570\u636e\u7684\u57fa\u7ebf\uff0c\u4e14\u4eba\u7c7b\u89c6\u9891\u89c4\u6a21\u8d8a\u5927\u6027\u80fd\u8d8a\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Embodied world models learn to predict future physical dynamics from visual observations and control signals, where physical knowledge is implicitly entangled within latent representations. We introduce CausalWM, a 16B embodied world model that performs explicit causal chain-of-thought reasoning before future video prediction. CausalWM organizes useful variables into a reasoning trajectory, allowing the model to progressively capture causal dependencies underlying physical evolution. To train CausalWM, we collect 31K hours embodied data and develop a three-stage paradigm consisting of large-scale video pre-training, causal CoT mid-training, and multi-objective RL post-training. Despite using only a limited set of supervised CoT variables, CausalWM exhibits emergent in-context learning capabilities, enabling contextual visual feature guidance and efficient few-step generation. CausalWM achieves state-of-the-art performance across language-conditioned, action-conditioned, single-view and multi-view benchmarks, including Top-1 performance on TriWorldBench leaderboard.", "arxiv_id": "2609.23184", "arxiv_url": "https://arxiv.org/abs/2609.23184", "authors": ["Ziming Xu", "Shuang Liang", "Ruobing Han", "Ziqiao Xi", "Mingxing Rao", "Kun Zhou", "Zijun Zhang", "Yuchen Yan", "Yufan Wei", "Junbo Huang", "Yifei Shao", "Fang Nan", "Biwei Huang"], "brief": "\u63d0\u51fa CausalWM\uff0c\u4e00\u4e2a 16B \u5177\u8eab\u4e16\u754c\u6a21\u578b\uff0c\u5728\u672a\u6765\u89c6\u9891\u9884\u6d4b\u524d\u663e\u5f0f\u8fdb\u884c\u56e0\u679c\u94fe\u5f0f\u601d\u7ef4\u63a8\u7406\uff0c\u4ee5\u9010\u6b65\u5efa\u6a21\u7269\u7406\u6f14\u5316\u4e2d\u7684\u56e0\u679c\u4f9d\u8d56\u3002\u901a\u8fc7\u5927\u89c4\u6a21\u89c6\u9891\u9884\u8bad\u7ec3\u3001\u56e0\u679c CoT \u4e2d\u8bad\u7ec3\u548c\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\uff0c\u5728\u591a\u7c7b\u8bed\u8a00/\u52a8\u4f5c\u6761\u4ef6\u4e0e\u591a\u89c6\u89d2\u57fa\u51c6\u4e0a\u8fbe\u5230\u9886\u5148\u6548\u679c\uff0c\u5e76\u767b\u9876 TriWorldBench\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.23184", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u56e0\u679c\u63a8\u7406", "\u94fe\u5f0f\u601d\u7ef4", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.23184", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CausalWM: Causal Chain-of-Thought Reasoning for Embodied World Model", "tldr": "\u63d0\u51fa CausalWM\uff0c\u4e00\u4e2a 16B \u5177\u8eab\u4e16\u754c\u6a21\u578b\uff0c\u5728\u672a\u6765\u89c6\u9891\u9884\u6d4b\u524d\u663e\u5f0f\u8fdb\u884c\u56e0\u679c\u94fe\u5f0f\u601d\u7ef4\u63a8\u7406\uff0c\u4ee5\u9010\u6b65\u5efa\u6a21\u7269\u7406\u6f14\u5316\u4e2d\u7684\u56e0\u679c\u4f9d\u8d56\u3002\u901a\u8fc7\u5927\u89c4\u6a21\u89c6\u9891\u9884\u8bad\u7ec3\u3001\u56e0\u679c CoT \u4e2d\u8bad\u7ec3\u548c\u591a\u76ee\u6807\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\uff0c\u5728\u591a\u7c7b\u8bed\u8a00/\u52a8\u4f5c\u6761\u4ef6\u4e0e\u591a\u89c6\u89d2\u57fa\u51c6\u4e0a\u8fbe\u5230\u9886\u5148\u6548\u679c\uff0c\u5e76\u767b\u9876 TriWorldBench\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific agents support a range of literature-based research tasks, such as retrieval, question answering, evidence-grounded generation, and claim assessment. Most existing systems, however, are organized around individual tasks: the same papers are repeatedly retrieved, segmented, and interpreted, and the understanding built in one task is difficult to reuse in the next. We present ScholarStack, a layered research asset framework that compiles a paper collection into reusable, versioned, and provenance-preserving assets at three complementary levels: source-grounded paper-level statements, domain-level organization, and evidence-grounded cross-paper syntheses. A common access interface returns task-specific views at the evidence granularity each task requires, preserving study conditions, source traceability, and verification status. We instantiate the framework on four task families spanning ten task settings, comparing agents that use the compiled assets with task-specific baselines under matched base models. Quality gains concentrate on tasks that require cross-paper evidence, such as multi-paper question answering and literature review generation, and query-time token cost falls on every task where it is measured, with assets compiled once and reused across tasks. These results suggest that layered research assets can serve as shared infrastructure for scientific agents, shifting literature-based assistance from isolated document processing toward cumulative, evidence-grounded workflows.", "arxiv_id": "2609.23735", "arxiv_url": "https://arxiv.org/abs/2609.23735", "authors": ["ScholarSeed AI Team", "Caoqinwei Gong", "Xue Jiang", "Wei Luo", "Xiaoyu Qiu", "Jiayi Sheng", "Yi Wang", "Zheng Yu", "Ao Zhang", "Haifan Zhang", "Hanwei Zhang", "Jihai Zhang", "Yuan Cao", "Wei Chen", "Liyun Dai", "Wenkai Fang", "Guanglei Wang", "Kai Ying", "Tingyu Zhu", "Wotao Yin"], "brief": "ScholarStack \u63d0\u51fa\u4e00\u79cd\u5206\u5c42\u79d1\u7814\u8d44\u4ea7\u6846\u67b6\uff0c\u5c06\u8bba\u6587\u96c6\u5408\u9884\u7f16\u8bd1\u4e3a\u53ef\u590d\u7528\u3001\u53ef\u7248\u672c\u5316\u4e14\u4fdd\u7559\u6eaf\u6e90\u7684\u8bba\u6587\u7ea7\u9648\u8ff0\u3001\u9886\u57df\u7ec4\u7ec7\u548c\u8de8\u8bba\u6587\u7efc\u5408\u8d44\u4ea7\u3002\u5b9e\u9a8c\u8986\u76d6\u56db\u7c7b\u5341\u79cd\u4efb\u52a1\uff0c\u76f8\u6bd4\u4efb\u52a1\u4e13\u7528\u57fa\u7ebf\u5728\u591a\u8bba\u6587\u95ee\u7b54\u3001\u7efc\u8ff0\u751f\u6210\u7b49\u4f9d\u8d56\u8de8\u8bba\u6587\u8bc1\u636e\u7684\u4efb\u52a1\u4e0a\u8d28\u91cf\u63d0\u5347\uff0c\u5e76\u964d\u4f4e\u67e5\u8be2\u65f6 token \u6210\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.23735", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u7814\u7a76", "\u4fe1\u606f\u68c0\u7d22", "\u77e5\u8bc6\u590d\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.23735", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ScholarStack: Layered Research Asset Orchestration and Cross-Task Reuse for Scientific Agents", "tldr": "ScholarStack \u63d0\u51fa\u4e00\u79cd\u5206\u5c42\u79d1\u7814\u8d44\u4ea7\u6846\u67b6\uff0c\u5c06\u8bba\u6587\u96c6\u5408\u9884\u7f16\u8bd1\u4e3a\u53ef\u590d\u7528\u3001\u53ef\u7248\u672c\u5316\u4e14\u4fdd\u7559\u6eaf\u6e90\u7684\u8bba\u6587\u7ea7\u9648\u8ff0\u3001\u9886\u57df\u7ec4\u7ec7\u548c\u8de8\u8bba\u6587\u7efc\u5408\u8d44\u4ea7\u3002\u5b9e\u9a8c\u8986\u76d6\u56db\u7c7b\u5341\u79cd\u4efb\u52a1\uff0c\u76f8\u6bd4\u4efb\u52a1\u4e13\u7528\u57fa\u7ebf\u5728\u591a\u8bba\u6587\u95ee\u7b54\u3001\u7efc\u8ff0\u751f\u6210\u7b49\u4f9d\u8d56\u8de8\u8bba\u6587\u8bc1\u636e\u7684\u4efb\u52a1\u4e0a\u8d28\u91cf\u63d0\u5347\uff0c\u5e76\u964d\u4f4e\u67e5\u8be2\u65f6 token \u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Physical AI requires models to ground visual and linguistic understanding in real-world environments while accounting for environmental constraints and execution feedback. We introduce MachEmbodied-VLM (ME-VLM), a unified vision-language model with two variants, 4B and 35B-A3B, that brings together embodied cognition and multimodal agent capabilities. Our work emphasizes physical perception and spatiotemporal reasoning, together with planning, interaction, and outcome assessment in both digital and physical environments. We construct training data spanning embodied and multimodal agent tasks, including execution observations and feedback to support outcome assessment and decision refinement. The training pipeline comprises embodied capability injection, separate reinforcement learning of embodied and multimodal-agent experts, and multi-teacher on-policy distillation that consolidates their complementary capabilities into a single model. Experiments show competitive performance on both embodied and agent benchmarks, as well as on autonomous-driving and embodied-navigation tasks. For edge deployment, visual token compression, W4A8 quantization, and hardware-software co-optimization enable on-device inference of the 4B variant on the M100, reducing prefill latency from 400 ms to 188 ms. Project Page: https://machembodied.com/ME-Brain/ME-VLM.html Code Repository: https://github.com/MachEmbodied/ME-VLM", "arxiv_id": "2609.24526", "arxiv_url": "https://arxiv.org/abs/2609.24526", "authors": ["Foundation Model", "Li Auto Inc"], "brief": "ME-VLM \u662f\u4e00\u4e2a\u7edf\u4e00\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u9762\u5411\u5177\u8eab\u8ba4\u77e5\u4e0e\u591a\u6a21\u6001\u667a\u80fd\u4f53\u534f\u4f5c\uff0c\u5f3a\u5316\u7269\u7406\u611f\u77e5\u3001\u65f6\u7a7a\u63a8\u7406\u3001\u89c4\u5212\u4ea4\u4e92\u548c\u7ed3\u679c\u8bc4\u4f30\u80fd\u529b\u3002\u5176\u901a\u8fc7\u5177\u8eab/\u667a\u80fd\u4f53\u6570\u636e\u6784\u5efa\u3001\u4e13\u5bb6\u5f3a\u5316\u5b66\u4e60\u4e0e\u591a\u6559\u5e08\u5728\u7ebf\u84b8\u998f\u6574\u5408\u80fd\u529b\uff0c\u5728\u5177\u8eab\u3001\u667a\u80fd\u4f53\u3001\u81ea\u52a8\u9a7e\u9a76\u548c\u5bfc\u822a\u57fa\u51c6\u4e0a\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u652f\u6301\u7aef\u4fa7\u9ad8\u6548\u90e8\u7f72\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24526", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u667a\u80fd\u4f53", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24526", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ME-VLM: A Unified VLM for Embodied Cognition and Agent Coordination", "tldr": "ME-VLM \u662f\u4e00\u4e2a\u7edf\u4e00\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u9762\u5411\u5177\u8eab\u8ba4\u77e5\u4e0e\u591a\u6a21\u6001\u667a\u80fd\u4f53\u534f\u4f5c\uff0c\u5f3a\u5316\u7269\u7406\u611f\u77e5\u3001\u65f6\u7a7a\u63a8\u7406\u3001\u89c4\u5212\u4ea4\u4e92\u548c\u7ed3\u679c\u8bc4\u4f30\u80fd\u529b\u3002\u5176\u901a\u8fc7\u5177\u8eab/\u667a\u80fd\u4f53\u6570\u636e\u6784\u5efa\u3001\u4e13\u5bb6\u5f3a\u5316\u5b66\u4e60\u4e0e\u591a\u6559\u5e08\u5728\u7ebf\u84b8\u998f\u6574\u5408\u80fd\u529b\uff0c\u5728\u5177\u8eab\u3001\u667a\u80fd\u4f53\u3001\u81ea\u52a8\u9a7e\u9a76\u548c\u5bfc\u822a\u57fa\u51c6\u4e0a\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u652f\u6301\u7aef\u4fa7\u9ad8\u6548\u90e8\u7f72\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Human demonstrations offer a scalable way to collect manipulation data, but their contacts may be unstable or infeasible when transferred to a robot hand. Collecting demonstrations directly on the target robot avoids this mismatch but substantially increases the cost of data collection. To address this trade-off, we present Touch2Robot, a framework that lets humans collect demonstrations while seeing how the target robot hand would contact the object. We capture human hand motion, tactile-glove measurements, and object motion during human manipulation. These recordings guide object-specific RL policies to reproduce the demonstrated object motion while favoring contacts consistent with the recorded human touch. We distill the learned behaviors into a unified real-time retargeter that maps incoming human observations and object geometry to robot hand configurations. During collection, the predicted robot configuration is synchronized with the tracked object pose in simulation to reconstruct robot-object contacts, which are visualized to help the demonstrator adapt subsequent interactions to the target hand. Across four real-world tasks, Touch2Robot improves average real-robot replay completion from 37.9% to 72.1% over visual-only feedback, while reducing the collection time per replay-successful demonstration from 58.6s to 18.2s. Reconstructed target-hand contacts achieve 44.2% F1 against real-robot tactile measurements, and policies trained on Touch2Robot demonstrations improve downstream Diffusion Policy performance by 29.1 percentage points over visual-only feedback. These results show that bringing robot touch into the human demonstration loop improves both the quality and efficiency of scalable dexterous data collection. Project webpage: https://Touch2Robot.github.io/.", "arxiv_id": "2609.24660", "arxiv_url": "https://arxiv.org/abs/2609.24660", "authors": ["Shengcheng Luo", "Xiaoyang Cheng", "Hong Ying", "Xiaoying Zhou", "Jiaming Jiang", "Haoran Guo", "Wanlin Li", "Ziyuan Jiao", "Chenxi Xiao"], "brief": "Touch2Robot \u8ba9\u4eba\u7c7b\u793a\u6559\u65f6\u5b9e\u65f6\u770b\u5230\u76ee\u6807\u673a\u5668\u4eba\u624b\u4e0e\u7269\u4f53\u7684\u63a5\u89e6\u60c5\u51b5\uff0c\u901a\u8fc7\u4eba\u624b\u8fd0\u52a8\u3001\u89e6\u89c9\u624b\u5957\u548c\u7269\u4f53\u8fd0\u52a8\u6570\u636e\uff0c\u5f15\u5bfc\u5f3a\u5316\u5b66\u4e60\u7b56\u7565\u5b66\u4e60\u66f4\u9002\u5408\u673a\u5668\u4eba\u590d\u73b0\u7684\u63a5\u89e6\u4e0e\u52a8\u4f5c\u3002\u771f\u5b9e\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4\u4ec5\u89c6\u89c9\u53cd\u9988\uff0c\u673a\u5668\u4eba\u56de\u653e\u6210\u529f\u7387\u4ece 37.9% \u63d0\u5347\u5230 72.1%\uff0c\u6210\u529f\u793a\u6559\u91c7\u96c6\u65f6\u95f4\u663e\u8457\u964d\u4f4e\uff0c\u5e76\u63d0\u5347\u4e0b\u6e38\u6269\u6563\u7b56\u7565\u6027\u80fd\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24660", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89e6\u89c9", "\u6a21\u4eff\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24660", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Touch2Robot: Robot Touch in the Human Demonstration Loop", "tldr": "Touch2Robot \u8ba9\u4eba\u7c7b\u793a\u6559\u65f6\u5b9e\u65f6\u770b\u5230\u76ee\u6807\u673a\u5668\u4eba\u624b\u4e0e\u7269\u4f53\u7684\u63a5\u89e6\u60c5\u51b5\uff0c\u901a\u8fc7\u4eba\u624b\u8fd0\u52a8\u3001\u89e6\u89c9\u624b\u5957\u548c\u7269\u4f53\u8fd0\u52a8\u6570\u636e\uff0c\u5f15\u5bfc\u5f3a\u5316\u5b66\u4e60\u7b56\u7565\u5b66\u4e60\u66f4\u9002\u5408\u673a\u5668\u4eba\u590d\u73b0\u7684\u63a5\u89e6\u4e0e\u52a8\u4f5c\u3002\u771f\u5b9e\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4\u4ec5\u89c6\u89c9\u53cd\u9988\uff0c\u673a\u5668\u4eba\u56de\u653e\u6210\u529f\u7387\u4ece 37.9% \u63d0\u5347\u5230 72.1%\uff0c\u6210\u529f\u793a\u6559\u91c7\u96c6\u65f6\u95f4\u663e\u8457\u964d\u4f4e\uff0c\u5e76\u63d0\u5347\u4e0b\u6e38\u6269\u6563\u7b56\u7565\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scalable simulation is essential for robot data generation, policy training, evaluation, and safe iteration, yet real-world interaction is costly and conventional simulators require labor-intensive construction. We present Uranus, a data-driven robot simulator built around a joint-trajectory-conditioned autoregressive diffusion model. Uranus offers three key capabilities: (1) streaming, open-ended rollout, which receives future joint-position trajectories online and autoregressively generates one latent frame per step, corresponding to four RGB frames, without a fixed horizon; (2) low-latency generation, achieving 24 FPS after inference optimization; and (3) scalable, extensible robot control, providing a unified interface for synchronized multi-view generation across diverse robot embodiments and camera configurations. We conduct comprehensive quantitative and qualitative evaluations on both in-distribution and out-of-distribution data, providing an objective assessment of Uranus and clearly identifying its current limitations. We release the code and model weights to empower the community with practical tools and insights.", "arxiv_id": "2609.24815", "arxiv_url": "https://arxiv.org/abs/2609.24815", "authors": ["Wenkang Qin", "Yukun Zhou", "Noah Shen", "Jisong Cai", "Dongxiao Mao", "Baicheng Li", "Yue Zhang", "Wei Sui"], "brief": "Uranus \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab AI \u7684\u6570\u636e\u9a71\u52a8\u673a\u5668\u4eba\u6a21\u62df\u5668\uff0c\u57fa\u4e8e\u5173\u8282\u8f68\u8ff9\u6761\u4ef6\u7684\u81ea\u56de\u5f52\u6269\u6563\u6a21\u578b\uff0c\u53ef\u5728\u7ebf\u63a5\u6536\u672a\u6765\u5173\u8282\u4f4d\u7f6e\u5e76\u6301\u7eed\u751f\u6210\u591a\u89c6\u89d2 RGB \u5e27\u3002\u5b83\u652f\u6301\u5f00\u653e\u5f0f\u6d41\u5f0f rollout\u3001\u4f18\u5316\u540e 24 FPS \u4f4e\u5ef6\u8fdf\u751f\u6210\uff0c\u4ee5\u53ca\u8de8\u673a\u5668\u4eba\u5f62\u6001\u548c\u76f8\u673a\u914d\u7f6e\u7684\u7edf\u4e00\u63a7\u5236\u63a5\u53e3\uff0c\u5e76\u901a\u8fc7\u5f00\u6e90\u4ee3\u7801\u4e0e\u6743\u91cd\u63a8\u52a8\u793e\u533a\u590d\u73b0\u548c\u6269\u5c55\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24815", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u4eff\u771f", "\u6269\u6563\u6a21\u578b", "\u6570\u636e\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24815", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Uranus: Building the Next-Generation Simulation Infrastructure for Embodied AI", "tldr": "Uranus \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab AI \u7684\u6570\u636e\u9a71\u52a8\u673a\u5668\u4eba\u6a21\u62df\u5668\uff0c\u57fa\u4e8e\u5173\u8282\u8f68\u8ff9\u6761\u4ef6\u7684\u81ea\u56de\u5f52\u6269\u6563\u6a21\u578b\uff0c\u53ef\u5728\u7ebf\u63a5\u6536\u672a\u6765\u5173\u8282\u4f4d\u7f6e\u5e76\u6301\u7eed\u751f\u6210\u591a\u89c6\u89d2 RGB \u5e27\u3002\u5b83\u652f\u6301\u5f00\u653e\u5f0f\u6d41\u5f0f rollout\u3001\u4f18\u5316\u540e 24 FPS \u4f4e\u5ef6\u8fdf\u751f\u6210\uff0c\u4ee5\u53ca\u8de8\u673a\u5668\u4eba\u5f62\u6001\u548c\u76f8\u673a\u914d\u7f6e\u7684\u7edf\u4e00\u63a7\u5236\u63a5\u53e3\uff0c\u5e76\u901a\u8fc7\u5f00\u6e90\u4ee3\u7801\u4e0e\u6743\u91cd\u63a8\u52a8\u793e\u533a\u590d\u73b0\u548c\u6269\u5c55\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In high-stakes decision-making applications of large language models (LLMs), practitioners require not only accurate LLMs but also uncertainty estimates for their predictions. Existing approaches to uncertainty estimation for LLMs require access to log-probabilities output by the model or require fine-tuning access. However, many industrial LLM products use closed-source API models, and many such API models like GPT do not return log-probabilities and may not allow fine-tuning. We introduce Pinocchio, an external calibrator that estimates the correctness of responses from black-box API models. Trained jointly on responses from seven LLMs, it achieves 0.862 AUROC predicting the correctness of held-out responses from those same models, and shows zero-shot transfer to thirteen unseen models across eight organizations. Our model needs only a single forward pass to generate an uncertainty estimate and requires no access to the target model\u0027s logits, weights, or internal states. A lightweight text only 0.8B checkpoint matches our largest model\u0027s AUROC. We release code for adding uncertainty estimation to existing repos in only two additional lines of code.", "arxiv_id": "2609.24881", "arxiv_url": "https://arxiv.org/abs/2609.24881", "authors": ["Kevin David Hayes", "Arka Pal", "Haosong Zhang", "Tom Goldstein", "Micah Goldblum"], "brief": "\u672c\u6587\u63d0\u51fa Pinocchio\uff0c\u4e00\u4e2a\u7528\u4e8e\u9ed1\u76d2\u8bed\u8a00\u6a21\u578b\u7684\u5916\u90e8\u6821\u51c6\u5668\uff0c\u53ef\u5728\u65e0\u6cd5\u8bbf\u95ee logits\u3001\u6743\u91cd\u6216\u5fae\u8c03\u63a5\u53e3\u7684\u60c5\u51b5\u4e0b\u4f30\u8ba1\u56de\u7b54\u6b63\u786e\u6027\u3002\u5b83\u5728\u591a\u4e2a\u5df2\u89c1\u6a21\u578b\u4e0a\u8fbe\u5230 0.862 AUROC\uff0c\u5e76\u80fd\u96f6\u6837\u672c\u8fc1\u79fb\u5230\u6765\u81ea 8 \u4e2a\u673a\u6784\u7684 13 \u4e2a\u672a\u89c1\u6a21\u578b\uff1b\u8f7b\u91cf 0.8B \u6587\u672c\u6a21\u578b\u5373\u53ef\u63a5\u8fd1\u6700\u5927\u6a21\u578b\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24881", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u9ed1\u76d2\u6a21\u578b", "\u6a21\u578b\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24881", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Pinocchio: Fast Uncertainty Estimates for Black-Box Language Models", "tldr": "\u672c\u6587\u63d0\u51fa Pinocchio\uff0c\u4e00\u4e2a\u7528\u4e8e\u9ed1\u76d2\u8bed\u8a00\u6a21\u578b\u7684\u5916\u90e8\u6821\u51c6\u5668\uff0c\u53ef\u5728\u65e0\u6cd5\u8bbf\u95ee logits\u3001\u6743\u91cd\u6216\u5fae\u8c03\u63a5\u53e3\u7684\u60c5\u51b5\u4e0b\u4f30\u8ba1\u56de\u7b54\u6b63\u786e\u6027\u3002\u5b83\u5728\u591a\u4e2a\u5df2\u89c1\u6a21\u578b\u4e0a\u8fbe\u5230 0.862 AUROC\uff0c\u5e76\u80fd\u96f6\u6837\u672c\u8fc1\u79fb\u5230\u6765\u81ea 8 \u4e2a\u673a\u6784\u7684 13 \u4e2a\u672a\u89c1\u6a21\u578b\uff1b\u8f7b\u91cf 0.8B \u6587\u672c\u6a21\u578b\u5373\u53ef\u63a5\u8fd1\u6700\u5927\u6a21\u578b\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agents today often take real-world actions that depend on long-term memory and context recall over time. However, most current memory benchmarks are built for a conversational question-answer format, where the question itself signals that some fact must be retrieved, and often which one. Moreover, benchmarks rarely require anything beyond accuracy from submissions, allowing memory systems to make unreasonable cost/time tradeoffs to achieve higher scores. We present DolphinBench, a benchmark that evaluates memory directly through an agent\u0027s task completion. DolphinBench includes three knowledge-work personas with roughly 500k tokens of user messages per persona and evaluates agents on tasks that depend on information from that history. We verify all 200 tasks per persona by running an agent with and without the relevant history, requiring success with it and failure without it. Finally, we require all evaluations to report total cost and latency alongside accuracy, which enables us to evaluate agent memory systems holistically. No existing memory benchmark combines all three. The dataset and evaluation code are available at https://dolphinbench.ai.", "arxiv_id": "2609.24971", "arxiv_url": "https://arxiv.org/abs/2609.24971", "authors": ["Soumil Rathi", "Deshraj Yadav", "Taranjeet Singh"], "brief": "DolphinBench \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u4efb\u52a1\u5b8c\u6210\u7684\u957f\u671f\u8bb0\u5fc6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u800c\u4e0d\u662f\u4f20\u7edf\u5bf9\u8bdd\u95ee\u7b54\u5f0f\u8bb0\u5fc6\u6d4b\u8bd5\u3002\u5b83\u5305\u542b\u4e09\u4e2a\u77e5\u8bc6\u5de5\u4f5c\u89d2\u8272\u3001\u6bcf\u4e2a\u7ea650\u4e07token\u5386\u53f2\u6d88\u606f\u548c\u6bcf\u4e2a\u89d2\u8272200\u4e2a\u7ecf\u9a8c\u8bc1\u4efb\u52a1\uff0c\u5e76\u540c\u65f6\u62a5\u544a\u51c6\u786e\u7387\u3001\u6210\u672c\u4e0e\u5ef6\u8fdf\uff0c\u7528\u4e8e\u523b\u753b\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u7684\u5e15\u7d2f\u6258\u524d\u6cbf\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24971", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u57fa\u51c6\u8bc4\u6d4b", "\u6210\u672c\u5ef6\u8fdf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24971", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DolphinBench: Mapping the Pareto Frontier of Agent Memory", "tldr": "DolphinBench \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u4efb\u52a1\u5b8c\u6210\u7684\u957f\u671f\u8bb0\u5fc6\u8bc4\u6d4b\u57fa\u51c6\uff0c\u800c\u4e0d\u662f\u4f20\u7edf\u5bf9\u8bdd\u95ee\u7b54\u5f0f\u8bb0\u5fc6\u6d4b\u8bd5\u3002\u5b83\u5305\u542b\u4e09\u4e2a\u77e5\u8bc6\u5de5\u4f5c\u89d2\u8272\u3001\u6bcf\u4e2a\u7ea650\u4e07token\u5386\u53f2\u6d88\u606f\u548c\u6bcf\u4e2a\u89d2\u8272200\u4e2a\u7ecf\u9a8c\u8bc1\u4efb\u52a1\uff0c\u5e76\u540c\u65f6\u62a5\u544a\u51c6\u786e\u7387\u3001\u6210\u672c\u4e0e\u5ef6\u8fdf\uff0c\u7528\u4e8e\u523b\u753b\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u7684\u5e15\u7d2f\u6258\u524d\u6cbf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) can improve solutions to verifiable scientific and algorithmic problems by spending additional computation at test time. Recent systems achieve strong results with increasingly elaborate evolutionary search harnesses or by updating model parameters during test-time training. We ask how much of this machinery is necessary. We introduce Hill Sampling, a simple procedure that repeatedly samples candidate program edits from a frozen LLM, retains the best program found so far, and conditions all subsequent samples on that program. We evaluate the method on circle packing, sums/differences of sets, and Erdos\u0027 minimum-overlap problem using three open-weight models. Hill Sampling sets a new state of the art on circle packing among published methods, improves over the AlphaEvolve reference on Erdos\u0027 minimum-overlap problem, and achieves strong results on sums and differences of finite sets. The circle-packing and Erdos results require only hours of wall-clock time on eight NVIDIA H100 GPUs. To our knowledge, we also conduct, the largest study, by parameter count, of evolution strategies (ES) applied directly to LLM weights at test time. Surprisingly, learning the weights is worse than setting the ES learning rate to zero: at zero learning rate, the method is still searching in weight space through fixed random perturbations. Those perturbations can help exploration, but randomness from token sampling is stronger still, and repeated sampling remains substantially weaker than Hill Sampling. These results suggest a simple test-time compute allocation strategy: repeatedly sample edits to the best verified solution found so far, before introducing additional complexity such as adding archives, diversity mechanisms, evolutionary scaffolds, or test-time parameter learning.", "arxiv_id": "2609.25510", "arxiv_url": "https://arxiv.org/abs/2609.25510", "authors": ["Jacob Beck", "Philip V. Ogren", "Ari Kobren"], "brief": "\u8bba\u6587\u63d0\u51fa Hill Sampling\uff1a\u7528\u51bb\u7ed3\u5927\u8bed\u8a00\u6a21\u578b\u53cd\u590d\u5bf9\u5f53\u524d\u6700\u4f18\u7a0b\u5e8f\u91c7\u6837\u4fee\u6539\uff0c\u5e76\u4fdd\u7559\u9a8c\u8bc1\u5f97\u5206\u6700\u9ad8\u7684\u7248\u672c\uff0c\u4f5c\u4e3a\u6d4b\u8bd5\u65f6\u6269\u5c55\u7684\u7b80\u5355\u7b56\u7565\u3002\u8be5\u65b9\u6cd5\u5728\u5706\u5806\u79ef\u7b49\u4efb\u52a1\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u5df2\u6709\u65b9\u6cd5\uff0c\u5e76\u53d1\u73b0\u6d4b\u8bd5\u65f6\u76f4\u63a5\u8bad\u7ec3\u6a21\u578b\u6743\u91cd\u4e0d\u5982\u56fa\u5b9a\u6743\u91cd\u91c7\u6837\u6709\u6548\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25510", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u7a0b\u5e8f\u641c\u7d22", "\u91c7\u6837\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25510", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hill Sampling for Test-Time Scaling: A Simple and Better Alternative to Repeated Sampling, Evolution, and Training", "tldr": "\u8bba\u6587\u63d0\u51fa Hill Sampling\uff1a\u7528\u51bb\u7ed3\u5927\u8bed\u8a00\u6a21\u578b\u53cd\u590d\u5bf9\u5f53\u524d\u6700\u4f18\u7a0b\u5e8f\u91c7\u6837\u4fee\u6539\uff0c\u5e76\u4fdd\u7559\u9a8c\u8bc1\u5f97\u5206\u6700\u9ad8\u7684\u7248\u672c\uff0c\u4f5c\u4e3a\u6d4b\u8bd5\u65f6\u6269\u5c55\u7684\u7b80\u5355\u7b56\u7565\u3002\u8be5\u65b9\u6cd5\u5728\u5706\u5806\u79ef\u7b49\u4efb\u52a1\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u5df2\u6709\u65b9\u6cd5\uff0c\u5e76\u53d1\u73b0\u6d4b\u8bd5\u65f6\u76f4\u63a5\u8bad\u7ec3\u6a21\u578b\u6743\u91cd\u4e0d\u5982\u56fa\u5b9a\u6743\u91cd\u91c7\u6837\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Attributing language model outputs to their internal computations is an open problem in interpretability. Existing methods, which use causal interventions, gradients, or learnable masks, either are infeasibly expensive or struggle to identify actual causally-important internal computations. We propose framing attribution as the problem of identifying nested subsets of internal components which minimise a downstream loss. To learn this task, we introduce Matryoshka Attribution (MAttr), a mask learning method that parametrises the mask with a simple differentiable sigmoid top-$k$ operator. We supervise training over all sparsities simultaneously by randomising $k$ over training, resulting in a learned ordering of components by attribution score. MAttr achieves number 1 on the official leaderboard of the Mechanistic Interpretability Benchmark (Mueller et al., 2025); our method identifies sparse and task-transferrable circuits across varying circuit bases. As a practical application, we show that MAttr can be trained with reinforcement learning to identify weight changes responsible for downstream behaviours in LLM finetuning. We train MAttr on refusal judge scores and find that restoring $1\\%$ of Llama 3.1 8B Instruct\u0027s weights to their base model state is sufficient to remove refusals while maintaining capabilities. We view MAttr as a successful formulation of interpretability into a learnable objective that we can tackle with gradient descent, and encourage future work along these lines.", "arxiv_id": "2609.25518", "arxiv_url": "https://arxiv.org/abs/2609.25518", "authors": ["Aryaman Arora", "Kirill Acharya", "Nathan Hu", "Yanzhe Zhang", "Noah Goodman", "Dan Jurafsky", "Christopher Potts"], "brief": "\u8bba\u6587\u63d0\u51fa Matryoshka Attribution\uff08MAttr\uff09\uff0c\u628a\u8bed\u8a00\u6a21\u578b\u8f93\u51fa\u5f52\u56e0\u8868\u8ff0\u4e3a\u5bfb\u627e\u80fd\u6700\u5c0f\u5316\u4e0b\u6e38\u635f\u5931\u7684\u5d4c\u5957\u5185\u90e8\u7ec4\u4ef6\u5b50\u96c6\uff0c\u5e76\u7528\u53ef\u5fae sigmoid top-k \u63a9\u7801\u5728\u591a\u7a00\u758f\u5ea6\u4e0b\u8054\u5408\u8bad\u7ec3\u3002\u65b9\u6cd5\u5728\u673a\u5236\u53ef\u89e3\u91ca\u6027\u57fa\u51c6\u699c\u5355\u6392\u540d\u7b2c\u4e00\uff0c\u53ef\u53d1\u73b0\u7a00\u758f\u4e14\u53ef\u8fc1\u79fb\u7684\u7535\u8def\uff1b\u8fd8\u53ef\u7528\u5f3a\u5316\u5b66\u4e60\u5b9a\u4f4d\u5fae\u8c03\u4e2d\u5bfc\u81f4\u62d2\u7b54\u884c\u4e3a\u7684\u6743\u91cd\u53d8\u5316\uff0c\u4ec5\u6062\u590d Llama 3.1 8B Instruct \u7ea6 1% \u6743\u91cd\u5373\u53ef\u51cf\u5c11\u62d2\u7b54\u5e76\u4fdd\u6301\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25518", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5f52\u56e0", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25518", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Matryoshka attribution: Learning to attribute language model outputs to representations and weights", "tldr": "\u8bba\u6587\u63d0\u51fa Matryoshka Attribution\uff08MAttr\uff09\uff0c\u628a\u8bed\u8a00\u6a21\u578b\u8f93\u51fa\u5f52\u56e0\u8868\u8ff0\u4e3a\u5bfb\u627e\u80fd\u6700\u5c0f\u5316\u4e0b\u6e38\u635f\u5931\u7684\u5d4c\u5957\u5185\u90e8\u7ec4\u4ef6\u5b50\u96c6\uff0c\u5e76\u7528\u53ef\u5fae sigmoid top-k \u63a9\u7801\u5728\u591a\u7a00\u758f\u5ea6\u4e0b\u8054\u5408\u8bad\u7ec3\u3002\u65b9\u6cd5\u5728\u673a\u5236\u53ef\u89e3\u91ca\u6027\u57fa\u51c6\u699c\u5355\u6392\u540d\u7b2c\u4e00\uff0c\u53ef\u53d1\u73b0\u7a00\u758f\u4e14\u53ef\u8fc1\u79fb\u7684\u7535\u8def\uff1b\u8fd8\u53ef\u7528\u5f3a\u5316\u5b66\u4e60\u5b9a\u4f4d\u5fae\u8c03\u4e2d\u5bfc\u81f4\u62d2\u7b54\u884c\u4e3a\u7684\u6743\u91cd\u53d8\u5316\uff0c\u4ec5\u6062\u590d Llama 3.1 8B Instruct \u7ea6 1% \u6743\u91cd\u5373\u53ef\u51cf\u5c11\u62d2\u7b54\u5e76\u4fdd\u6301\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) inference is constrained by the quadratic scaling of self-attention and the linear scaling of the KV cache, increasing latency, energy consumption, and GPU memory demand as context length scales. Existing soft-compression methods either lack query-guided memory selection at inference time, train without answer-targeted supervision, or couple compression tightly to a specific decoder architecture. We propose a Context-to-Answer-Aligned Memory Compression (CMC) framework, which compresses long input contexts into compact Context Memory Embeddings (CMEs) aligned to any frozen decoder\u0027s embedding space, reducing inference costs without modifying decoder weights. CMC introduces a two-tier KV cache that combines question-guided CME selection with a local context window, and trains the compressor with answer-targeted distillation from a frozen LLM. Experiments across nine encoder-decoder combinations and four QA benchmarks show that CMC consistently outperforms the baseline, achieving up to 7.3 EM and 4.0 F1 point gains on SQuAD, while reducing inference time and energy consumption by up to 20% and peak reserved GPU memory by up to 50% at 3,000 generation tokens. Ablation studies confirm that each architectural component and training objective contributes to the performance.", "arxiv_id": "2609.25537", "arxiv_url": "https://arxiv.org/abs/2609.25537", "authors": ["Md Mostafizer Rahman", "Md Faizul Ibne Amin", "Md Shahajada Mia", "Yutaka Watanobe", "Fang Liu"], "brief": "\u672c\u6587\u63d0\u51fa CMC \u6846\u67b6\uff0c\u5c06\u957f\u4e0a\u4e0b\u6587\u538b\u7f29\u4e3a\u4e0e\u7b54\u6848\u5bf9\u9f50\u7684\u8bb0\u5fc6\u5d4c\u5165\uff0c\u5e76\u53ef\u63a5\u5165\u51bb\u7ed3\u7684\u89e3\u7801\u5668\u800c\u65e0\u9700\u4fee\u6539\u6743\u91cd\u3002\u901a\u8fc7\u95ee\u9898\u5f15\u5bfc\u7684\u8bb0\u5fc6\u9009\u62e9\u3001\u5c40\u90e8\u4e0a\u4e0b\u6587\u7a97\u53e3\u548c\u7b54\u6848\u84b8\u998f\u8bad\u7ec3\uff0cCMC \u5728\u591a\u4e2a\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u51c6\u786e\u7387\uff0c\u540c\u65f6\u6700\u591a\u51cf\u5c11\u7ea620%\u63a8\u7406\u65f6\u95f4\u4e0e50%\u5cf0\u503cGPU\u663e\u5b58\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25537", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u6a21\u578b\u538b\u7f29", "\u5927\u8bed\u8a00\u6a21\u578b", "\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25537", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Compressing Long Context into Answer-Aligned Memory Embeddings for LLM Inference", "tldr": "\u672c\u6587\u63d0\u51fa CMC \u6846\u67b6\uff0c\u5c06\u957f\u4e0a\u4e0b\u6587\u538b\u7f29\u4e3a\u4e0e\u7b54\u6848\u5bf9\u9f50\u7684\u8bb0\u5fc6\u5d4c\u5165\uff0c\u5e76\u53ef\u63a5\u5165\u51bb\u7ed3\u7684\u89e3\u7801\u5668\u800c\u65e0\u9700\u4fee\u6539\u6743\u91cd\u3002\u901a\u8fc7\u95ee\u9898\u5f15\u5bfc\u7684\u8bb0\u5fc6\u9009\u62e9\u3001\u5c40\u90e8\u4e0a\u4e0b\u6587\u7a97\u53e3\u548c\u7b54\u6848\u84b8\u998f\u8bad\u7ec3\uff0cCMC \u5728\u591a\u4e2a\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u51c6\u786e\u7387\uff0c\u540c\u65f6\u6700\u591a\u51cf\u5c11\u7ea620%\u63a8\u7406\u65f6\u95f4\u4e0e50%\u5cf0\u503cGPU\u663e\u5b58\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action policies benefit from geometric supervision, but current-frame geometry alone does not explicitly describe the changes associated with manipulation. This design is motivated by the goal of learning an embodiment-agnostic visual interface that can be pretrained across robot and egocentric video before robot-specific action alignment. We introduce Geometry-Change VLA (GC-VLA), which learns to predict multiview future-current geometry-change tokens from current observations. Offline frame pairs define a nominal 0.5-second prediction horizon; future observations are used only to construct training targets. Stage 1 trains a geometry-change vision-language model (GC-VLM). Stage 2 introduces a continuous ActionExpert and aligns it with robot actions while stopping action-flow gradients at the VLM interface. Stage 3 enables these gradients to update the trainable VLM components jointly with the ActionExpert. Stage 4 freezes GC-VLA and applies Geometry-Conditioned Residual Flow (GCRF), using a binary intervention router and a single bounded residual velocity policy learned from closed-loop feedback. GC-VLA achieves 95.20% success on LIBERO, and GC-VLA with GCRF achieves 99.55%. Inference uses current observations and the learned GC representation without executing the offline target encoders.", "arxiv_id": "2609.25558", "arxiv_url": "https://arxiv.org/abs/2609.25558", "authors": ["Jinu Pahk", "Jesoon Kang", "Taegeon Park", "Jisu An", "Soo Min Kimm", "Jaejoon Kim", "Byoung-Tak Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa GC-VLA\uff0c\u8ba9\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u7b56\u7565\u9884\u6d4b\u672a\u6765-\u5f53\u524d\u7684\u591a\u89c6\u89d2\u51e0\u4f55\u53d8\u5316\u8868\u5f81\uff0c\u7528\u4e8e\u5b66\u4e60\u66f4\u5177\u8de8 embodiment \u6cdb\u5316\u6027\u7684\u89c6\u89c9\u63a5\u53e3\uff0c\u5e76\u5206\u9636\u6bb5\u5bf9\u9f50\u673a\u5668\u4eba\u52a8\u4f5c\u3002\u968f\u540e\u5f15\u5165\u51e0\u4f55\u6761\u4ef6\u6b8b\u5dee\u6d41 GCRF\uff0c\u901a\u8fc7\u95ed\u73af\u53cd\u9988\u5b66\u4e60\u6b8b\u5dee\u901f\u5ea6\u7b56\u7565\u8fdb\u4e00\u6b65\u4fee\u6b63\u52a8\u4f5c\uff0c\u5728 LIBERO \u4e0a\u6210\u529f\u7387\u4ece 95.20% \u63d0\u5347\u5230 99.55%\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25558", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba\u5b66\u4e60", "\u51e0\u4f55\u76d1\u7763", "\u6b8b\u5dee\u7b56\u7565"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.25558", "published_at": "2026-09-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HABILIS Brain 0: Geometry-Change Supervision for Vision-Language-Action and Residual Flow Recovery", "tldr": "\u8bba\u6587\u63d0\u51fa GC-VLA\uff0c\u8ba9\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u7b56\u7565\u9884\u6d4b\u672a\u6765-\u5f53\u524d\u7684\u591a\u89c6\u89d2\u51e0\u4f55\u53d8\u5316\u8868\u5f81\uff0c\u7528\u4e8e\u5b66\u4e60\u66f4\u5177\u8de8 embodiment \u6cdb\u5316\u6027\u7684\u89c6\u89c9\u63a5\u53e3\uff0c\u5e76\u5206\u9636\u6bb5\u5bf9\u9f50\u673a\u5668\u4eba\u52a8\u4f5c\u3002\u968f\u540e\u5f15\u5165\u51e0\u4f55\u6761\u4ef6\u6b8b\u5dee\u6d41 GCRF\uff0c\u901a\u8fc7\u95ed\u73af\u53cd\u9988\u5b66\u4e60\u6b8b\u5dee\u901f\u5ea6\u7b56\u7565\u8fdb\u4e00\u6b65\u4fee\u6b63\u52a8\u4f5c\uff0c\u5728 LIBERO \u4e0a\u6210\u529f\u7387\u4ece 95.20% \u63d0\u5347\u5230 99.55%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Open robot policies increasingly follow two paradigms: vision-language-action models (VLAs) directly map observations and instructions to actions, whereas world-action models (WAMs) incorporate learned video or world dynamics into policy learning or action generation. Although both target the same manipulation tasks and represent alternative design choices, they are commonly reported under different evaluation protocols, leaving their capability, robustness, language sensitivity, and deployment-cost trade-offs unclear. We present IndustrialVLA-Bench, an evidence-aware evaluation of six released VLA and WAM systems under a unified reporting schema. It separately evaluates clean capability on LIBERO, non-language robustness on LIBERO-Plus, instruction sensitivity on LIBERO-Para, and observed execution cost. Reported task scores aggregate three complete evaluations with distinct random seeds under a fixed checkpoint and inference configuration. Across all six systems, clean LIBERO averages differ by only 1.58 points, whereas robustness and paraphrase summaries span 14.62 and 31.08 points. Restricting every comparison to the three protocol-faithful systems preserves the effect (1.36, 14.62 and 23.10 points), so the diagnostic separation reported here does not depend on the weaker evidence tiers. We additionally report observed inference latency, peak memory, runtime mode, and an evidence status for every system. Protocol-faithful, near-reproduction, and pending-verification entries remain visibly separated; only protocol-faithful entries support strict comparisons. Rather than claiming universal superiority of either paradigm, IndustrialVLA-Bench provides traceable evidence for comparing released robot policies on shared practical criteria. Code and evaluation records are available at https://github.com/xiaoqi-7/IndustrialVLA-Bench.", "arxiv_id": "2609.25562", "arxiv_url": "https://arxiv.org/abs/2609.25562", "authors": ["Yiqi Wang", "Zhifeng Rao", "Jiaqi Zhang", "Xiaoyang Li", "Zhangkai Wu", "Yiqun Duan", "Mingkai Zheng", "Fei Wang", "Shan You", "Taotao Cai"], "brief": "\u63d0\u51fa IndustrialVLA-Bench\uff0c\u7528\u7edf\u4e00\u534f\u8bae\u8bc4\u6d4b 6 \u4e2a\u5f00\u6e90\u673a\u5668\u4eba\u7b56\u7565\u6a21\u578b\uff08VLA \u4e0e WAM\uff09\uff0c\u8986\u76d6\u57fa\u7840\u80fd\u529b\u3001\u975e\u8bed\u8a00\u9c81\u68d2\u6027\u3001\u6307\u4ee4\u6539\u5199\u654f\u611f\u6027\u548c\u90e8\u7f72\u6210\u672c\u3002\u7ed3\u679c\u663e\u793a\u5404\u6a21\u578b\u5728\u5e72\u51c0 LIBERO \u4efb\u52a1\u4e0a\u5dee\u8ddd\u5f88\u5c0f\uff0c\u4f46\u5728\u9c81\u68d2\u6027\u548c\u8bed\u8a00\u6539\u5199\u4e0b\u5dee\u5f02\u663e\u8457\uff0c\u5f3a\u8c03\u9700\u7528\u53ef\u8ffd\u8e2a\u8bc1\u636e\u800c\u975e\u5355\u4e00\u5206\u6570\u6bd4\u8f83\u673a\u5668\u4eba\u7b56\u7565\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.25562", "impact_score": 7, "is_agent": true, "is_top": false, "key_
