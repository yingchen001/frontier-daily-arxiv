87\u751f\u56fe\u6a21\u578b\u80fd\u529b\u63d0\u4f9b\u4e86\u7ecf\u9a8c\u89c4\u5f8b\u4e0e\u5b9e\u7528\u65b9\u6cd5\u3002"}, {"abstract": "System prompts are instructions configured by developers to govern the behaviors of foundation models in AI applications. They are used throughout commercial AI products, but are rarely disclosed to the public or regulators, creating a serious trust and accountability gap in the wide deployment of AI systems. In this paper, we introduce Artificial Intelligence System Prompt Assurance (AISPA), a user-centric framework for systematically auditing system prompts in AI systems. AISPA examines specific parts of a system prompt and evaluates them along eight dimensions that matter to users. We then use this framework to review 3,249 instructions from system prompts in 88 commercial AI products, classifying each instruction as either protective (of users) or problematic. Our audit surfaces four core findings. First, system prompt design varies substantially across products and developers, with some organizations averaging over 60 protective instructions per product while others average fewer than 5. Second, protective instructions are widely adopted but shallow in scope: 98.9% of products contain at least one, yet only 24% cover all eight dimensions of the AISPA taxonomy. Third, system prompts have grown steadily longer and more protective of users, suggesting that user protection is becoming a more visible concern in commercial prompt design. Fourth, despite this progress, problematic instructions remain pervasive: roughly 40% of products contain at least one instruction that works against user interests, and protective and problematic instructions frequently coexist within the same prompt. Our findings highlight the need for greater transparency, standardization, and independent oversight for system prompts in commercial AI products.", "arxiv_id": "2607.28617", "arxiv_url": "https://arxiv.org/abs/2607.28617", "authors": ["Xiangning Lin", "Shenzhe Zhu", "Shu Yang", "Zhenyu Zhang", "Haoqian Zhang", "Yipeng Zhao", "Chengxuan Qian", "Tianwei Wang", "Ziheng Zhang", "Zhenlong Yuan", "Dingcheng Wang", "Juncheng Wu", "Yuan Si", "Jiaxin Liu", "Baolong Bi", "Robert Mahari", "Tobin South", "Dazza Greenwood", "Zexue He", "Rishi Bommasani", "Sophia Kazinnik", "Andreas Haupt", "Samuele Marro", "Erik Brynjolfsson", "Alex Pentland", "Jiaxin Pei"], "brief": "\u8bba\u6587\u63d0\u51fa AISPA\uff0c\u4e00\u4e2a\u9762\u5411\u7528\u6237\u7684 AI \u5e94\u7528\u7cfb\u7edf\u63d0\u793a\u8bcd\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u516b\u4e2a\u7528\u6237\u5173\u5207\u7ef4\u5ea6\u8bc4\u4f30\u63d0\u793a\u8bcd\u4e2d\u7684\u5177\u4f53\u6307\u4ee4\u3002\u4f5c\u8005\u7528\u8be5\u6846\u67b6\u5ba1\u8ba1\u4e86 88 \u4e2a\u5546\u4e1a AI \u4ea7\u54c1\u7684 3249 \u6761\u7cfb\u7edf\u63d0\u793a\u6307\u4ee4\uff0c\u5e76\u533a\u5206\u5176\u5bf9\u7528\u6237\u662f\u4fdd\u62a4\u6027\u8fd8\u662f\u95ee\u9898\u6027\u3002", "categories": ["cs.AI", "cs.CL", "cs.CY", "cs.HC"], "github_repo": "https://github.com/SystemPromptIndex/SystemPromptIndex", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2607.28617", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["AISPA \u5c06\u7cfb\u7edf\u63d0\u793a\u8bcd\u62c6\u89e3\u4e3a\u5177\u4f53\u6307\u4ee4\uff0c\u5e76\u56f4\u7ed5\u516b\u4e2a\u7528\u6237\u76f8\u5173\u7ef4\u5ea6\u8fdb\u884c\u7cfb\u7edf\u5316\u8bc4\u4f30\u3002", "\u5bf9 88 \u4e2a\u5546\u4e1a AI \u4ea7\u54c1\u7684 3249 \u6761\u6307\u4ee4\u5ba1\u8ba1\u53d1\u73b0\uff0c98.9% \u4ea7\u54c1\u542b\u81f3\u5c11\u4e00\u6761\u4fdd\u62a4\u6027\u6307\u4ee4\uff0c\u4f46\u53ea\u6709 24% \u8986\u76d6\u5168\u90e8\u516b\u4e2a\u7ef4\u5ea6\u3002", "\u7ea6 40% \u4ea7\u54c1\u5b58\u5728\u81f3\u5c11\u4e00\u6761\u8fdd\u80cc\u7528\u6237\u5229\u76ca\u7684\u95ee\u9898\u6027\u6307\u4ee4\uff0c\u4e14\u4fdd\u62a4\u6027\u4e0e\u95ee\u9898\u6027\u6307\u4ee4\u5e38\u5728\u540c\u4e00\u63d0\u793a\u8bcd\u4e2d\u5171\u5b58\u3002"], "keywords": ["\u63d0\u793a\u8bcd\u5de5\u7a0b", "AI\u6cbb\u7406", "\u5b89\u5168\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2607.28617v1", "published_at": "2026-07-30", "score": 0.537, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (32\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28617.png", "title": "AISPA: User-Centric System Prompt Auditing for Large Language Model Applications", "tldr": "\u63d0\u51fa\u9762\u5411\u7528\u6237\u7684\u7cfb\u7edf\u63d0\u793a\u8bcd\u5ba1\u8ba1\u6846\u67b6", "upvotes": 32, "what_it_is": "\u8bba\u6587\u63d0\u51fa AISPA\uff0c\u4e00\u4e2a\u9762\u5411\u7528\u6237\u7684 AI \u5e94\u7528\u7cfb\u7edf\u63d0\u793a\u8bcd\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u516b\u4e2a\u7528\u6237\u5173\u5207\u7ef4\u5ea6\u8bc4\u4f30\u63d0\u793a\u8bcd\u4e2d\u7684\u5177\u4f53\u6307\u4ee4\u3002\u4f5c\u8005\u7528\u8be5\u6846\u67b6\u5ba1\u8ba1\u4e86 88 \u4e2a\u5546\u4e1a AI \u4ea7\u54c1\u7684 3249 \u6761\u7cfb\u7edf\u63d0\u793a\u6307\u4ee4\uff0c\u5e76\u533a\u5206\u5176\u5bf9\u7528\u6237\u662f\u4fdd\u62a4\u6027\u8fd8\u662f\u95ee\u9898\u6027\u3002", "why_notable": "\u7cfb\u7edf\u63d0\u793a\u8bcd\u662f\u5546\u4e1a AI \u4ea7\u54c1\u884c\u4e3a\u6cbb\u7406\u7684\u5173\u952e\u4f46\u901a\u5e38\u4e0d\u900f\u660e\u3002\u8be5\u7814\u7a76\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u7684\u5ba1\u8ba1\u6846\u67b6\u548c\u5927\u89c4\u6a21\u5b9e\u8bc1\u8bc1\u636e\uff0c\u51f8\u663e\u63d0\u793a\u8bcd\u900f\u660e\u5316\u3001\u6807\u51c6\u5316\u548c\u72ec\u7acb\u76d1\u7ba1\u7684\u5fc5\u8981\u6027\u3002"}, {"abstract": "Despite the impressive visuomotor capabilities enabled by Vision-Language-Action (VLA) models, their performance often degrades on challenging and out-of-domain tasks. Recent test-time steering and scaling methods improve performance without extensive data collection and retraining, but action samples often remain concentrated around similar behaviors and therefore inherit correlated failure modes. Moreover, existing methods apply the same intervention strategy at every timestep, regardless of whether the base policy is already likely to succeed. To address these limitations, we introduce $RL^2$, an adaptive inference-time steering framework that leverages Reinforcement Learning on VLA Latents. First, we train a lightweight offline RL policy conditioned on expressive latents extracted from the VLA action expert and compose its flow velocity with that of the frozen VLA during inference. This compositional steering strategy combines the behavioral priors of large-scale imitation learning with the action diversity induced by offline RL beyond dominant demonstration modes. We further discover that inference-time steering follows fundamentally different scaling laws under success and failure states, revealing that action diversity is most beneficial when the base VLA is likely to fail, but can unnecessarily perturb already-accurate actions when success is likely. Building on this insight, $RL^2$ activates compositional steering only when failure is predicted. Across the SIMPLER and PolaRiS benchmarks, $RL^2$ improves success rates by up to +17.3% in out-of-domain settings, while ablations and scaling studies demonstrate the importance of latent representations and RL training. Finally, real-world experiments demonstrate that these gains transfer beyond simulation, establishing $RL^2$ as a practical and modular steering framework for VLA deployment.", "arxiv_id": "2607.26991", "arxiv_url": "https://arxiv.org/abs/2607.26991", "authors": ["Derek Ming Siang Tan", "Shailesh Shailesh", "Srikrishna Iyer", "William Wei Jie Teo", "Yuanliang Ju", "Qiao Gu", "Guillaume Sartoretti"], "brief": "\u8bba\u6587\u63d0\u51faRL^2\uff0c\u4e00\u79cd\u9488\u5bf9\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u63a8\u7406\u65f6\u81ea\u9002\u5e94\u8f6c\u5411\u6846\u67b6\u3002\u5b83\u5728\u51bb\u7ed3VLA\u7684\u6f5c\u8868\u793a\u4e0a\u8bad\u7ec3\u8f7b\u91cf\u79bb\u7ebfRL\u7b56\u7565\uff0c\u5e76\u4ec5\u5728\u9884\u6d4b\u57fa\u7840\u7b56\u7565\u53ef\u80fd\u5931\u8d25\u65f6\u7ec4\u5408\u5f15\u5bfc\u52a8\u4f5c\u751f\u6210\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/marmotlab/RL2-VLA", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2607.26991", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06VLA\u52a8\u4f5c\u4e13\u5bb6\u63d0\u53d6\u7684\u8868\u8fbe\u6027latent\u4f5c\u4e3a\u6761\u4ef6\uff0c\u8bad\u7ec3\u79bb\u7ebfRL\u7b56\u7565\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u4e0e\u51bb\u7ed3VLA\u7684\u6d41\u901f\u5ea6\u8fdb\u884c\u7ec4\u5408\u3002", "\u53d1\u73b0\u6210\u529f\u6001\u4e0e\u5931\u8d25\u6001\u4e0b\u63a8\u7406\u65f6\u8f6c\u5411\u5177\u6709\u4e0d\u540c\u7f29\u653e\u89c4\u5f8b\uff1a\u5931\u8d25\u65f6\u52a8\u4f5c\u591a\u6837\u6027\u6709\u76ca\uff0c\u6210\u529f\u65f6\u53ef\u80fd\u6270\u52a8\u6b63\u786e\u52a8\u4f5c\u3002", "\u5728SIMPLER\u548cPolaRiS\u57fa\u51c6\u7684\u5206\u5e03\u5916\u4efb\u52a1\u4e0a\u6210\u529f\u7387\u6700\u9ad8\u63d0\u534717.3%\uff0c\u5e76\u901a\u8fc7\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u9a8c\u8bc1\u53ef\u8fc1\u79fb\u6027\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u6d4b\u8bd5\u65f6\u7f29\u653e"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2607.26991v2", "published_at": "2026-07-29", "score": 0.468, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.26991.png", "title": "RL$^2$-VLA: Adaptive RL Latent Compositional Steering with Test-Time Scaling for Vision-Language-Action Models", "tldr": "\u7528\u79bb\u7ebfRL\u5728\u63a8\u7406\u65f6\u81ea\u9002\u5e94\u5f15\u5bfcVLA", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51faRL^2\uff0c\u4e00\u79cd\u9488\u5bf9\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u63a8\u7406\u65f6\u81ea\u9002\u5e94\u8f6c\u5411\u6846\u67b6\u3002\u5b83\u5728\u51bb\u7ed3VLA\u7684\u6f5c\u8868\u793a\u4e0a\u8bad\u7ec3\u8f7b\u91cf\u79bb\u7ebfRL\u7b56\u7565\uff0c\u5e76\u4ec5\u5728\u9884\u6d4b\u57fa\u7840\u7b56\u7565\u53ef\u80fd\u5931\u8d25\u65f6\u7ec4\u5408\u5f15\u5bfc\u52a8\u4f5c\u751f\u6210\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u5927\u89c4\u6a21\u91cd\u65b0\u91c7\u96c6\u6570\u636e\u6216\u91cd\u8badVLA\uff0c\u901a\u8fc7\u6a21\u5757\u5316\u63a8\u7406\u65f6\u63a7\u5236\u63d0\u5347\u5206\u5e03\u5916\u9c81\u68d2\u6027\uff0c\u5c24\u5176\u9002\u5408\u73b0\u5b9e\u673a\u5668\u4eba\u90e8\u7f72\u4e2d\u7684\u96be\u4efb\u52a1\u4e0e\u957f\u5c3e\u573a\u666f\u3002"}, {"abstract": "Existing search-augmented LLM agents are trained using Reinforcement Learning to boost its reasoning capabilities. However, these approaches primarily rely on outcome-level rewards, which provide little supervision over search behavior and overlook agent\u0027s ability to decompose complex queries properly. To mitigate this issue, we propose PROGRESS which utilizes teacher-guided coverage reward to explicitly shape decomposed query generation of the policy model. During training, frozen teacher models are used to decompose complex queries into essential search queries. These essential search queries are utilized to guide the search behavior of the policy model. Integrated into an R1-style training framework, our approach provides lightweight guidance over query decomposition decisions without dense process-level supervision. Experiments show that coverage-guided RL improves overall task performance, highlighting the importance of explicitly supervising search strategies in agentic LLMs.", "arxiv_id": "2608.00969", "arxiv_url": "https://arxiv.org/abs/2608.00969", "authors": ["Sudipta Paul", "Vijay Srinivasan", "Vivek Kulkarni", "Aounon Kumar", "Yashas Malur Saidutta", "Wenbo Li", "Srinivas Chappidi"], "brief": "\u8bba\u6587\u63d0\u51fa PROGRESS\uff0c\u4e00\u79cd\u9762\u5411\u641c\u7d22\u589e\u5f3a LLM \u667a\u80fd\u4f53\u7684\u8986\u76d6\u5f15\u5bfc\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u7528\u51bb\u7ed3\u6559\u5e08\u6a21\u578b\u5206\u89e3\u590d\u6742\u95ee\u9898\u751f\u6210\u5173\u952e\u641c\u7d22\u67e5\u8be2\uff0c\u5e76\u5c06\u8fd9\u4e9b\u67e5\u8be2\u4f5c\u4e3a\u8986\u76d6\u5956\u52b1\u6765\u5851\u9020\u7b56\u7565\u6a21\u578b\u7684\u641c\u7d22\u4e0e\u5206\u89e3\u884c\u4e3a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00969", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u4ec5\u4f9d\u8d56\u7ed3\u679c\u7ea7\u5956\u52b1\u7684\u95ee\u9898\uff0c\u663e\u5f0f\u76d1\u7763\u667a\u80fd\u4f53\u662f\u5426\u80fd\u628a\u590d\u6742\u67e5\u8be2\u5206\u89e3\u4e3a\u5fc5\u8981\u641c\u7d22\u5b50\u95ee\u9898", "\u4f7f\u7528\u51bb\u7ed3\u6559\u5e08\u6a21\u578b\u751f\u6210 essential search queries\uff0c\u8bad\u7ec3\u65f6\u4ee5\u8986\u76d6\u7a0b\u5ea6\u4f5c\u4e3a\u8f7b\u91cf\u5956\u52b1\u4fe1\u53f7", "\u96c6\u6210\u5230 R1-style \u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u4e2d\uff0c\u65e0\u9700\u5bc6\u96c6\u8fc7\u7a0b\u7ea7\u6807\u6ce8\u5373\u53ef\u63d0\u5347\u4efb\u52a1\u8868\u73b0"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u606f\u68c0\u7d22", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00969v1", "published_at": "2026-08-02", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "PROGRESS: Coverage-guided RL to Train Search-augmented LLM Agent", "tldr": "\u7528\u8986\u76d6\u5956\u52b1\u8bad\u7ec3\u66f4\u4f1a\u641c\u7d22\u7684LLM\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PROGRESS\uff0c\u4e00\u79cd\u9762\u5411\u641c\u7d22\u589e\u5f3a LLM \u667a\u80fd\u4f53\u7684\u8986\u76d6\u5f15\u5bfc\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u7528\u51bb\u7ed3\u6559\u5e08\u6a21\u578b\u5206\u89e3\u590d\u6742\u95ee\u9898\u751f\u6210\u5173\u952e\u641c\u7d22\u67e5\u8be2\uff0c\u5e76\u5c06\u8fd9\u4e9b\u67e5\u8be2\u4f5c\u4e3a\u8986\u76d6\u5956\u52b1\u6765\u5851\u9020\u7b56\u7565\u6a21\u578b\u7684\u641c\u7d22\u4e0e\u5206\u89e3\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u641c\u7d22\u589e\u5f3a\u667a\u80fd\u4f53\u7684\u6027\u80fd\u74f6\u9888\u4e0d\u53ea\u5728\u6700\u7ec8\u7b54\u6848\uff0c\u8fd8\u5728\u641c\u7d22\u7b56\u7565\u4e0e\u95ee\u9898\u5206\u89e3\u8d28\u91cf\uff1b\u8986\u76d6\u5f15\u5bfc\u5956\u52b1\u4e3a\u8bad\u7ec3\u53ef\u641c\u7d22\u3001\u53ef\u5206\u89e3\u7684 LLM Agent \u63d0\u4f9b\u4e86\u5b9e\u7528\u4e14\u6210\u672c\u8f83\u4f4e\u7684\u65b9\u6848\u3002"}, {"abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) has driven recent progress in reasoning-oriented large language models (LLMs) by enabling large-scale optimization. However, its applicability remains largely limited to domains such as mathematics and coding, where correctness can be deterministically verifiable. Open-ended tasks instead often rely on human preferences, reward models, or LLM-based judges, introducing evaluation bias, judge capability bottlenecks, and additional inference costs. Drawing on the principle of self-supervised learning, which constructs pretext tasks to derive supervision from the data itself, we propose Reinforcement Learning with Self-Verifiable Rewards (RLSVR), a task-transformation-based training paradigm for extending RLVR to open-ended tasks. RLSVR transforms open-ended tasks into verifiable proxy environments whose internal rules and interaction outcomes automatically generate reward signals. We instantiate RLSVR with SpyRL, a Self-PlaY Reinforcement Learning method inspired by social deduction game Who Is the Spy?. Agents receive asymmetric information, complete the same target task, and vote to identify a designated spy. Because the spy identity is predetermined, voting outcomes provide fully verifiable rewards, while successful identification remains closely related to output quality. Experiments on text summarization, creative writing, and mathematical reasoning show that SpyRL outperforms existing self-improvement methods on non-verifiable tasks and yields consistent gains on verifiable reasoning tasks. These results demonstrate that task transformation can extend scalable RLVR-based self-improvement beyond inherently verifiable domains. Models and code have been released at https://github.com/wangqinsi1/RLSVR/tree/SpyRL.", "arxiv_id": "2607.23802", "arxiv_url": "https://arxiv.org/abs/2607.23802", "authors": ["Qinsi Wang", "Jing Shi", "Huazheng Wang", "Kun Wan", "Yiran Wu", "Bo Liu", "Qingyun Wu", "Hai Helen Li", "Yiran Chen", "Handong Zhao", "Wentian Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa RLSVR\uff1a\u901a\u8fc7\u4efb\u52a1\u8f6c\u6362\u4e3a\u5f00\u653e\u5f0f\u4efb\u52a1\u6784\u9020\u53ef\u81ea\u9a8c\u8bc1\u7684\u4ee3\u7406\u73af\u5883\uff0c\u4ece\u800c\u5c06 RLVR \u6269\u5c55\u5230\u6458\u8981\u3001\u521b\u4f5c\u7b49\u96be\u4ee5\u76f4\u63a5\u5224\u5206\u7684\u573a\u666f\u3002\u5176\u5177\u4f53\u65b9\u6cd5 SpyRL \u501f\u9274\u201c\u8c01\u662f\u5367\u5e95\u201d\u5f0f\u81ea\u535a\u5f08\uff0c\u8ba9\u6a21\u578b\u5728\u975e\u5bf9\u79f0\u4fe1\u606f\u4e0b\u5b8c\u6210\u4efb\u52a1\u5e76\u6295\u7968\u8bc6\u522b\u5367\u5e95\uff0c\u7528\u9884\u8bbe\u8eab\u4efd\u548c\u6295\u7968\u7ed3\u679c\u751f\u6210\u53ef\u9a8c\u8bc1\u5956\u52b1\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/wangqinsi1/RLSVR", "github_stars": 143, "hf_url": "https://huggingface.co/papers/2607.23802", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u5f00\u653e\u5f0f\u4efb\u52a1\u8f6c\u6362\u4e3a\u5e26\u5185\u90e8\u89c4\u5219\u548c\u4ea4\u4e92\u7ed3\u679c\u7684\u53ef\u9a8c\u8bc1\u4ee3\u7406\u73af\u5883\uff0c\u907f\u514d\u4f9d\u8d56\u4eba\u5de5\u504f\u597d\u3001\u5956\u52b1\u6a21\u578b\u6216 LLM \u88c1\u5224", "SpyRL \u901a\u8fc7\u81ea\u535a\u5f08\u3001\u975e\u5bf9\u79f0\u4fe1\u606f\u548c\u6295\u7968\u673a\u5236\uff0c\u628a\u8f93\u51fa\u8d28\u91cf\u4e0e\u201c\u80fd\u5426\u8bc6\u522b\u5367\u5e95\u201d\u5173\u8054\u8d77\u6765\uff0c\u5f62\u6210\u81ea\u52a8\u5956\u52b1\u4fe1\u53f7", "\u5728\u6587\u672c\u6458\u8981\u3001\u521b\u610f\u5199\u4f5c\u548c\u6570\u5b66\u63a8\u7406\u4e0a\u5747\u4f18\u4e8e\u73b0\u6709\u81ea\u6211\u6539\u8fdb\u65b9\u6cd5\uff0c\u5e76\u5728\u53ef\u9a8c\u8bc1\u63a8\u7406\u4efb\u52a1\u4e0a\u4e5f\u5e26\u6765\u7a33\u5b9a\u63d0\u5347"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u81ea\u6211\u6539\u8fdb", "\u667a\u80fd\u4f53", "\u53ef\u9a8c\u8bc1\u5956\u52b1"], "num_comments": 5, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.23802v2", "published_at": "2026-07-26", "score": 0.367, "selected_reasons": ["HF trending (74\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23802.png", "title": "From RLVR to RLSVR: Task Transformation Induces Self-Verifiable Rewards for Open-Ended LLM Self-Improvement", "tldr": "\u628a\u5f00\u653e\u4efb\u52a1\u8f6c\u6210\u53ef\u9a8c\u8bc1\u81ea\u535a\u5f08\u5956\u52b1", "upvotes": 74, "what_it_is": "\u8bba\u6587\u63d0\u51fa RLSVR\uff1a\u901a\u8fc7\u4efb\u52a1\u8f6c\u6362\u4e3a\u5f00\u653e\u5f0f\u4efb\u52a1\u6784\u9020\u53ef\u81ea\u9a8c\u8bc1\u7684\u4ee3\u7406\u73af\u5883\uff0c\u4ece\u800c\u5c06 RLVR \u6269\u5c55\u5230\u6458\u8981\u3001\u521b\u4f5c\u7b49\u96be\u4ee5\u76f4\u63a5\u5224\u5206\u7684\u573a\u666f\u3002\u5176\u5177\u4f53\u65b9\u6cd5 SpyRL \u501f\u9274\u201c\u8c01\u662f\u5367\u5e95\u201d\u5f0f\u81ea\u535a\u5f08\uff0c\u8ba9\u6a21\u578b\u5728\u975e\u5bf9\u79f0\u4fe1\u606f\u4e0b\u5b8c\u6210\u4efb\u52a1\u5e76\u6295\u7968\u8bc6\u522b\u5367\u5e95\uff0c\u7528\u9884\u8bbe\u8eab\u4efd\u548c\u6295\u7968\u7ed3\u679c\u751f\u6210\u53ef\u9a8c\u8bc1\u5956\u52b1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u5f00\u653e\u5f0f LLM \u81ea\u6211\u6539\u8fdb\u63d0\u4f9b\u4e86\u4e00\u6761\u53ef\u6269\u5c55\u8def\u5f84\uff1a\u4e0d\u518d\u53d7\u9650\u4e8e\u6570\u5b66\u3001\u4ee3\u7801\u7b49\u5929\u7136\u53ef\u9a8c\u8bc1\u9886\u57df\uff0c\u4e5f\u51cf\u5c11\u4e86 LLM-as-judge \u7684\u504f\u5dee\u4e0e\u63a8\u7406\u6210\u672c\uff0c\u5bf9\u540e\u8bad\u7ec3\u8303\u5f0f\u548c\u591a\u667a\u80fd\u4f53\u81ea\u535a\u5f08\u8bad\u7ec3\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "We present $N_0$-VTLA, a vision-tactile-language-action (VTLA) foundation model capable of (1) fine-grained contact-rich manipulation with tactile perception and tactile-feedback control, and (2) offline policy improvement from stored deployment data. Building on current vision-based backbones, we propose a training recipe for tactile integration consisting of visuo-tactile pre-training, staged tactile-pathway integration, and advantage-conditioned offline policy improvement. During pre-training, the policy learns broad contact priors from NeoData, our large-scale visuo-tactile robot dataset; to our knowledge, $N_0$-VTLA is the first VTLA model pretrained on tactile data at scale. During post-training, we augment the policy with a predictive tactile pathway that distills the contact patterns learned at scale into the fine motion adjustments required by downstream tactile-centric manipulation. For offline policy improvement, we introduce ALTER, an advantage-conditioned offline reinforcement learning method that converts relative progress and trajectory-event comparisons into binary advantage labels for policy training on a fixed deployment corpus, further improving task-specific learning on contact-rich skills such as deformable object manipulation. Across contact-rich benchmarks, $N_0$-VTLA outperforms strong baselines by wide margins: it wins all nine real-robot NeoReal tasks and reaches 63.8% mean success on a twenty-task simulation suite, against 44.0% for the strongest baseline. $N_0$-VTLA policies trained with ALTER reach 75-95% success on three long-horizon real-robot tasks. These results lay a foundation for versatile tactile-driven manipulation policies.", "arxiv_id": "2607.23782", "arxiv_url": "https://arxiv.org/abs/2607.23782", "authors": ["NeoteAI Team", "Fudan TEAI Team"], "brief": "\u8bba\u6587\u63d0\u51fa N0-VTLA\uff0c\u4e00\u4e2a\u89c6\u89c9-\u89e6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u57fa\u7840\u6a21\u578b\uff0c\u7528\u4e8e\u63a5\u89e6\u4e30\u5bcc\u7684\u673a\u5668\u4eba\u7cbe\u7ec6\u64cd\u4f5c\u4e0e\u89e6\u89c9\u53cd\u9988\u63a7\u5236\u3002\u5b83\u7ed3\u5408\u5927\u89c4\u6a21\u89c6\u89c9\u89e6\u89c9\u9884\u8bad\u7ec3\u3001\u5206\u9636\u6bb5\u89e6\u89c9\u901a\u8def\u96c6\u6210\uff0c\u4ee5\u53ca\u4f18\u52bf\u6761\u4ef6\u79bb\u7ebf\u7b56\u7565\u6539\u8fdb\u65b9\u6cd5 ALTER\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/neoteai/N0-VTLA", "github_stars": 41, "hf_url": "https://huggingface.co/papers/2607.23782", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u5e76\u5229\u7528 NeoData \u5927\u89c4\u6a21\u89c6\u89c9\u89e6\u89c9\u673a\u5668\u4eba\u6570\u636e\u96c6\u8fdb\u884c\u9884\u8bad\u7ec3\uff0c\u5b66\u4e60\u901a\u7528\u63a5\u89e6\u5148\u9a8c\u3002", "\u8bbe\u8ba1\u9884\u6d4b\u5f0f\u89e6\u89c9\u901a\u8def\uff0c\u5c06\u5927\u89c4\u6a21\u5b66\u5230\u7684\u63a5\u89e6\u6a21\u5f0f\u84b8\u998f\u5230\u4e0b\u6e38\u4efb\u52a1\u6240\u9700\u7684\u7cbe\u7ec6\u8fd0\u52a8\u8c03\u6574\u4e2d\u3002", "\u63d0\u51fa ALTER \u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u5c06\u76f8\u5bf9\u8fdb\u5c55\u548c\u8f68\u8ff9\u4e8b\u4ef6\u6bd4\u8f83\u8f6c\u5316\u4e3a\u4e8c\u5143\u4f18\u52bf\u6807\u7b7e\uff0c\u5728\u56fa\u5b9a\u90e8\u7f72\u6570\u636e\u4e0a\u6539\u8fdb\u7b56\u7565\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89e6\u89c9\u611f\u77e5", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "NeoteAI", "pdf_url": "https://arxiv.org/pdf/2607.23782v1", "published_at": "2026-07-26", "score": 0.339, "selected_reasons": ["HF trending (50\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23782.png", "title": "$N_0$-VTLA: Scaling Vision-Tactile-Language-Action Model with Latent Tactile Tokens", "tldr": "\u5927\u89c4\u6a21\u89e6\u89c9\u9884\u8bad\u7ec3\u63d0\u5347\u673a\u5668\u4eba\u7cbe\u7ec6\u64cd\u4f5c\u3002", "upvotes": 50, "what_it_is": "\u8bba\u6587\u63d0\u51fa N0-VTLA\uff0c\u4e00\u4e2a\u89c6\u89c9-\u89e6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u57fa\u7840\u6a21\u578b\uff0c\u7528\u4e8e\u63a5\u89e6\u4e30\u5bcc\u7684\u673a\u5668\u4eba\u7cbe\u7ec6\u64cd\u4f5c\u4e0e\u89e6\u89c9\u53cd\u9988\u63a7\u5236\u3002\u5b83\u7ed3\u5408\u5927\u89c4\u6a21\u89c6\u89c9\u89e6\u89c9\u9884\u8bad\u7ec3\u3001\u5206\u9636\u6bb5\u89e6\u89c9\u901a\u8def\u96c6\u6210\uff0c\u4ee5\u53ca\u4f18\u52bf\u6761\u4ef6\u79bb\u7ebf\u7b56\u7565\u6539\u8fdb\u65b9\u6cd5 ALTER\u3002", "why_notable": "\u8fd9\u662f\u5c11\u89c1\u7684\u5c06\u89e6\u89c9\u6570\u636e\u89c4\u6a21\u5316\u9884\u8bad\u7ec3\u7528\u4e8e\u673a\u5668\u4eba\u57fa\u7840\u7b56\u7565\u7684\u5de5\u4f5c\uff0c\u5728\u771f\u5b9e\u673a\u5668\u4eba\u63a5\u89e6\u64cd\u4f5c\u4efb\u52a1\u4e0a\u663e\u8457\u8d85\u8fc7\u5f3a\u57fa\u7ebf\uff0c\u5e76\u5c55\u793a\u4e86\u79bb\u7ebf\u90e8\u7f72\u6570\u636e\u6301\u7eed\u6539\u8fdb\u7b56\u7565\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "We present $N_0$-TWAM, a tactile-native world-action model for contact-rich manipulation that predicts both future vision and future contact. To our knowledge, it is the first tactile world-action model trained at large scale, and it shows strong capability on contact-rich tasks. We pre-train $N_0$-TWAM at large scale with visuo-tactile joint training over tactile-rich demonstrations spanning six embodiments and 450 tasks. We use NeoForce, a unified force-based tactile representation, to form a physically grounded contact signal that conditions action generation. To improve long-horizon and multi-stage manipulation, we introduce tactile contact events for task staging and advance through them during execution. For real-time efficiency, we adopt an asymmetric Mixture-of-Transformers architecture that pairs a full-width expert for video prediction with slim experts for downstream action and tactile prediction. Evaluations on both real and simulated benchmarks justify the capabilities of $N_0$-TWAM across a range of contact-rich tasks, and demonstrate the benefit of data scaling for precise tactile and action prediction. In summary, $N_0$-TWAM endows a world-action model with predictive capabilities to foresee vision, touch and action, building a solid foundation for fine-grained manipulation on open contact-rich tasks. The codebase and model checkpoints will be made publicly available to foster further research and development in tactile-enabled robotic manipulation.", "arxiv_id": "2607.23783", "arxiv_url": "https://arxiv.org/abs/2607.23783", "authors": ["NeoteAI Team", "Fudan TEAI Team"], "brief": "\u8bba\u6587\u63d0\u51fa N0-TWAM\uff0c\u4e00\u4e2a\u9762\u5411\u63a5\u89e6\u4e30\u5bcc\u64cd\u4f5c\u7684\u89e6\u89c9\u539f\u751f\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u53ef\u540c\u65f6\u9884\u6d4b\u672a\u6765\u89c6\u89c9\u3001\u63a5\u89e6\u72b6\u6001\u4e0e\u52a8\u4f5c\u3002\u6a21\u578b\u5728\u8de86\u79cd\u673a\u5668\u4eba\u5f62\u6001\u3001450\u4e2a\u4efb\u52a1\u7684\u89c6\u89e6\u89c9\u793a\u8303\u4e0a\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\uff0c\u5e76\u7528\u4e8e\u771f\u5b9e\u4e0e\u4eff\u771f\u64cd\u4f5c\u8bc4\u6d4b\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/neoteai/N0-TWAM", "github_stars": 48, "hf_url": "https://huggingface.co/papers/2607.23783", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 NeoForce \u7edf\u4e00\u529b\u89c9\u89e6\u89c9\u8868\u793a\uff0c\u5c06\u7269\u7406\u63a5\u89e6\u4fe1\u53f7\u4f5c\u4e3a\u52a8\u4f5c\u751f\u6210\u6761\u4ef6", "\u5f15\u5165\u89e6\u89c9\u63a5\u89e6\u4e8b\u4ef6\u8fdb\u884c\u4efb\u52a1\u5206\u6bb5\uff0c\u6539\u5584\u957f\u65f6\u7a0b\u3001\u591a\u9636\u6bb5\u63a5\u89e6\u64cd\u4f5c", "\u4f7f\u7528\u975e\u5bf9\u79f0 Mixture-of-Transformers\uff1a\u5bbd\u4e13\u5bb6\u8d1f\u8d23\u89c6\u9891\u9884\u6d4b\uff0c\u8f7b\u91cf\u4e13\u5bb6\u8d1f\u8d23\u52a8\u4f5c\u4e0e\u89e6\u89c9\u9884\u6d4b\u4ee5\u652f\u6301\u5b9e\u65f6\u6027"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89e6\u89c9\u611f\u77e5", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "NeoteAI", "pdf_url": "https://arxiv.org/pdf/2607.23783v1", "published_at": "2026-07-26", "score": 0.326, "selected_reasons": ["HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23783.png", "title": "$N_0$-TWAM: Scaling Tactile-Native World-Action Model for Contact-Rich Manipulation", "tldr": "\u5927\u89c4\u6a21\u89e6\u89c9\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u63d0\u5347\u7cbe\u7ec6\u64cd\u4f5c", "upvotes": 28, "what_it_is": "\u8bba\u6587\u63d0\u51fa N0-TWAM\uff0c\u4e00\u4e2a\u9762\u5411\u63a5\u89e6\u4e30\u5bcc\u64cd\u4f5c\u7684\u89e6\u89c9\u539f\u751f\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u53ef\u540c\u65f6\u9884\u6d4b\u672a\u6765\u89c6\u89c9\u3001\u63a5\u89e6\u72b6\u6001\u4e0e\u52a8\u4f5c\u3002\u6a21\u578b\u5728\u8de86\u79cd\u673a\u5668\u4eba\u5f62\u6001\u3001450\u4e2a\u4efb\u52a1\u7684\u89c6\u89e6\u89c9\u793a\u8303\u4e0a\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\uff0c\u5e76\u7528\u4e8e\u771f\u5b9e\u4e0e\u4eff\u771f\u64cd\u4f5c\u8bc4\u6d4b\u3002", "why_notable": "\u8fd9\u662f\u9996\u4e2a\u5927\u89c4\u6a21\u8bad\u7ec3\u7684\u89e6\u89c9\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u4e4b\u4e00\uff0c\u8bc1\u660e\u89e6\u89c9\u6570\u636e\u89c4\u6a21\u5316\u53ef\u663e\u8457\u63d0\u5347\u7cbe\u7ec6\u63a5\u89e6\u9884\u6d4b\u4e0e\u64cd\u4f5c\u80fd\u529b\uff0c\u4e3a\u5f00\u653e\u5f0f\u63a5\u89e6\u4e30\u5bcc\u673a\u5668\u4eba\u64cd\u63a7\u63d0\u4f9b\u57fa\u7840\u6a21\u578b\u65b9\u5411\u3002"}, {"abstract": "Production LLM agents that select from large skill libraries face a limitation that semantic relevance alone cannot resolve: a skill may match a user\u0027s topic yet be impossible to execute in the current account state. We present a deployed three-stage selection pipeline for Helpmate, Wix\u0027s customer-care assistant. First, a recall-oriented semantic matcher identifies messages related to a ten-skill domain family without consulting account state. Second, a deterministic executability gate removes candidates whose internal hard-stop conditions hold. Because the gate and the skill evaluate the same exit predicates, every blocked candidate would be unable to complete under the same account state, provided predicate parity is preserved and both checks observe fresh authoritative state. Finally, the LLM decides whether to invoke one of the remaining candidates. In a post-launch production analysis of 756.6K user messages across 267.6K conversations, semantic matching retained 174,927 messages (23.1%). Within this matched stream, the gate removed 1,039,462 of 1,749,270 skill-message pairs (59.4%), saving 228.8 million skill-description tokens -- 59.1% of the post-semantic skill-description footprint. Together, semantic matching and executability gating reduced skill-description context by 90.5% relative to exposing all ten skills to every message. To test whether this pruning affects model behavior rather than context size alone, we replayed a risk-enriched cohort of 1,000 conversations with all ten skills exposed. The model selected a production-blocked skill in 78 conversations (7.8%). This counterfactual result shows that deterministic gating prevents non-executable candidates from influencing model selection, while not claiming downstream tool execution or customer-outcome effects.", "arxiv_id": "2608.01050", "arxiv_url": "https://arxiv.org/abs/2608.01050", "authors": ["Ortal Ashkenazi", "Vitalii Kloz", "Mykhailo Ulianchenko"], "brief": "\u672c\u6587\u63d0\u51fa\u5e76\u90e8\u7f72\u4e86 Wix Helpmate \u5ba2\u670d\u667a\u80fd\u4f53\u7684\u4e09\u9636\u6bb5\u6280\u80fd\u9009\u62e9\u6d41\u6c34\u7ebf\uff1a\u5148\u8bed\u4e49\u53ec\u56de\u76f8\u5173\u6280\u80fd\uff0c\u518d\u7528\u786e\u5b9a\u6027\u53ef\u6267\u884c\u6027\u95e8\u63a7\u8fc7\u6ee4\u5f53\u524d\u8d26\u53f7\u72b6\u6001\u4e0b\u65e0\u6cd5\u5b8c\u6210\u7684\u6280\u80fd\uff0c\u6700\u540e\u7531 LLM \u5728\u5269\u4f59\u5019\u9009\u4e2d\u9009\u62e9\u8c03\u7528\u3002", "categories": ["cs.AI", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01050", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u95e8\u63a7\u4e0e\u6280\u80fd\u672c\u8eab\u4f7f\u7528\u76f8\u540c\u7684\u786c\u505c\u6b62\u8c13\u8bcd\uff0c\u786e\u4fdd\u88ab\u62e6\u622a\u5019\u9009\u5728\u5f53\u524d\u6743\u5a01\u72b6\u6001\u4e0b\u786e\u5b9e\u4e0d\u53ef\u6267\u884c", "\u751f\u4ea7\u5206\u6790\u8986\u76d6 75.66 \u4e07\u6761\u7528\u6237\u6d88\u606f\u300126.76 \u4e07\u4e2a\u4f1a\u8bdd\uff0c\u95e8\u63a7\u79fb\u9664\u4e86 59.4% \u7684\u6280\u80fd-\u6d88\u606f\u5019\u9009\u5bf9", "\u8bed\u4e49\u5339\u914d\u52a0\u53ef\u6267\u884c\u6027\u95e8\u63a7\u76f8\u8f83\u4e8e\u6bcf\u6761\u6d88\u606f\u66b4\u9732\u5168\u90e8\u5341\u4e2a\u6280\u80fd\uff0c\u51cf\u5c11\u4e86 90.5% \u7684\u6280\u80fd\u63cf\u8ff0\u4e0a\u4e0b\u6587"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "LLM\u5e94\u7528", "\u751f\u4ea7\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01050v1", "published_at": "2026-08-02", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Don\u0027t Offer What Can\u0027t Be Done: Deterministic Executability Gating for LLM Skill Selection at Scale", "tldr": "\u7528\u786e\u5b9a\u6027\u95e8\u63a7\u907f\u514dLLM\u9009\u62e9\u4e0d\u53ef\u6267\u884c\u6280\u80fd", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u5e76\u90e8\u7f72\u4e86 Wix Helpmate \u5ba2\u670d\u667a\u80fd\u4f53\u7684\u4e09\u9636\u6bb5\u6280\u80fd\u9009\u62e9\u6d41\u6c34\u7ebf\uff1a\u5148\u8bed\u4e49\u53ec\u56de\u76f8\u5173\u6280\u80fd\uff0c\u518d\u7528\u786e\u5b9a\u6027\u53ef\u6267\u884c\u6027\u95e8\u63a7\u8fc7\u6ee4\u5f53\u524d\u8d26\u53f7\u72b6\u6001\u4e0b\u65e0\u6cd5\u5b8c\u6210\u7684\u6280\u80fd\uff0c\u6700\u540e\u7531 LLM \u5728\u5269\u4f59\u5019\u9009\u4e2d\u9009\u62e9\u8c03\u7528\u3002", "why_notable": "\u8bba\u6587\u5173\u6ce8\u751f\u4ea7\u7ea7 LLM \u667a\u80fd\u4f53\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u201c\u8bed\u4e49\u76f8\u5173\u4f46\u72b6\u6001\u4e0d\u53ef\u6267\u884c\u201d\u95ee\u9898\uff0c\u7528\u786e\u5b9a\u6027\u89c4\u5219\u964d\u4f4e\u65e0\u6548\u5de5\u5177\u9009\u62e9\u98ce\u9669\u4e0e\u4e0a\u4e0b\u6587\u6210\u672c\uff0c\u5e76\u901a\u8fc7\u5927\u89c4\u6a21\u7ebf\u4e0a\u6570\u636e\u548c\u53cd\u4e8b\u5b9e\u56de\u653e\u9a8c\u8bc1\u5176\u5bf9\u6a21\u578b\u9009\u62e9\u884c\u4e3a\u7684\u5f71\u54cd\u3002"}, {"abstract": "The emergence of Agentic AI systems, characterized by autonomous reasoning, multi-agent collaboration, tool orchestration, adaptive decision-making, and persistent memory, represents a fundamental shift from traditional AI pipelines to dynamic software ecosystems. While AI Technical Debt (AITD) has been widely studied in machine learning and software engineering, existing models assume static, component-level architectures and fail to capture the dynamic and emergent behaviors of agentic environments. To address this gap, this paper introduces Agentic Technical Debt (AgTD), defined as technical debt that emerges, accumulates, propagates, and amplifies due to the autonomous and collaborative nature of Agentic AI systems. Building on our prior systematic scoping review of 31 AITDs across seven root-cause categories, we employ a theory-informed transformation methodology to reinterpret these debts in Agentic AI through direct transformation, contextual transformation, and manifestation expansion. We present the first systematic mapping of established AITDs to their agentic manifestations, showing how conventional debts evolve into system-level liabilities, including memory inconsistencies, orchestration fragility, cascading failures, and unsafe autonomous decision-making. Our findings show that technical debt extends beyond software artifacts to encompass agent behaviors, coordination mechanisms, and interactions among agents, tools, and execution environments. We further examine its implications for AI Trust, Risk, and Security Management (AI TRiSM), highlighting impacts on trustworthiness, governance, security, operational resilience, and Sustainability Technical Debt. Overall, this work establishes AgTD as a foundational software engineering construct and provides a transformation framework, taxonomy, and research agenda for managing technical debt in autonomous multi-agent AI systems.", "arxiv_id": "2608.01001", "arxiv_url": "https://arxiv.org/abs/2608.01001", "authors": ["Muhammad Tukur", "Hayatullahi B. Adeyemo", "Tao Chen", "Nour Ali", "Anis Zarrad", "Marco Agus", "Rick Kazman", "Rami Bahsoon"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u667a\u80fd\u4f53\u6280\u672f\u503a\u201d\uff08AgTD\uff09\u6982\u5ff5\uff0c\u5c06\u4f20\u7edf AI \u6280\u672f\u503a\u91cd\u65b0\u6620\u5c04\u5230\u5177\u5907\u81ea\u4e3b\u63a8\u7406\u3001\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u5de5\u5177\u7f16\u6392\u548c\u6301\u4e45\u8bb0\u5fc6\u7684 Agentic AI \u7cfb\u7edf\u4e2d\u3002\u4f5c\u8005\u7ed9\u51fa\u8f6c\u5316\u65b9\u6cd5\u3001\u5206\u7c7b\u4f53\u7cfb\u548c\u7814\u7a76\u8bae\u7a0b\uff0c\u89e3\u91ca\u6280\u672f\u503a\u5982\u4f55\u5728\u52a8\u6001\u667a\u80fd\u4f53\u751f\u6001\u4e2d\u4f20\u64ad\u4e0e\u653e\u5927\u3002", "categories": ["cs.AI", "cs.CR", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01001", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u4e8e\u65e2\u6709 31 \u7c7b AI \u6280\u672f\u503a\u548c 7 \u7c7b\u6839\u56e0\uff0c\u91c7\u7528\u76f4\u63a5\u8f6c\u5316\u3001\u4e0a\u4e0b\u6587\u8f6c\u5316\u3001\u8868\u73b0\u6269\u5c55\u7684\u65b9\u6cd5\u6784\u5efa AgTD \u6620\u5c04", "\u6307\u51fa\u4f20\u7edf\u7ec4\u4ef6\u7ea7\u6280\u672f\u503a\u4f1a\u6f14\u5316\u4e3a\u7cfb\u7edf\u7ea7\u98ce\u9669\uff0c\u5982\u8bb0\u5fc6\u4e0d\u4e00\u81f4\u3001\u7f16\u6392\u8106\u5f31\u3001\u7ea7\u8054\u6545\u969c\u548c\u4e0d\u5b89\u5168\u81ea\u4e3b\u51b3\u7b56", "\u5c06\u6280\u672f\u503a\u8303\u56f4\u4ece\u8f6f\u4ef6\u5de5\u4ef6\u6269\u5c55\u5230\u667a\u80fd\u4f53\u884c\u4e3a\u3001\u534f\u4f5c\u673a\u5236\uff0c\u4ee5\u53ca\u667a\u80fd\u4f53\u3001\u5de5\u5177\u548c\u6267\u884c\u73af\u5883\u4e4b\u95f4\u7684\u4ea4\u4e92"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "AI\u6cbb\u7406", "\u591a\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01001v1", "published_at": "2026-08-02", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From AI Technical Debt to Agentic Technical Debt: A Systematic Mapping of Root Causes and Manifestations in Agentic AI Systems", "tldr": "\u63d0\u51fa\u667a\u80fd\u4f53\u6280\u672f\u503a\u7684\u7cfb\u7edf\u5206\u7c7b\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u667a\u80fd\u4f53\u6280\u672f\u503a\u201d\uff08AgTD\uff09\u6982\u5ff5\uff0c\u5c06\u4f20\u7edf AI \u6280\u672f\u503a\u91cd\u65b0\u6620\u5c04\u5230\u5177\u5907\u81ea\u4e3b\u63a8\u7406\u3001\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u5de5\u5177\u7f16\u6392\u548c\u6301\u4e45\u8bb0\u5fc6\u7684 Agentic AI \u7cfb\u7edf\u4e2d\u3002\u4f5c\u8005\u7ed9\u51fa\u8f6c\u5316\u65b9\u6cd5\u3001\u5206\u7c7b\u4f53\u7cfb\u548c\u7814\u7a76\u8bae\u7a0b\uff0c\u89e3\u91ca\u6280\u672f\u503a\u5982\u4f55\u5728\u52a8\u6001\u667a\u80fd\u4f53\u751f\u6001\u4e2d\u4f20\u64ad\u4e0e\u653e\u5927\u3002", "why_notable": "\u8fd9\u662f\u9762\u5411\u81ea\u4e3b\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u6280\u672f\u503a\u7cfb\u7edf\u5316\u5efa\u6a21\u5de5\u4f5c\uff0c\u6709\u52a9\u4e8e\u8f6f\u4ef6\u5de5\u7a0b\u3001\u6cbb\u7406\u4e0e AI TRiSM \u4f53\u7cfb\u7406\u89e3\u548c\u7ba1\u7406\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u7684\u53ef\u4fe1\u6027\u3001\u5b89\u5168\u6027\u3001\u97e7\u6027\u4e0e\u53ef\u6301\u7eed\u6027\u98ce\u9669\u3002"}, {"abstract": "When a self-improving AI-for-science system claims a new capability, the evidence is usually a benchmark delta, a description-length gate, or a p-value. None separates a real gain from extra search, from a changed verifier, or from adaptation to a fallible oracle. We build a two-sided audit whose negative side is a formal fact: a pseudoknot-free oracle provably cannot represent a crossing base pair, so the prior verifier\u0027s range is bounded exactly, offline, before any run. \"New\" is relative to the agent\u0027s prior self, never to the base model. First, how far a single fallible oracle can inflate a capability claim. An invented, solver-free operator solves 43/60 crossing RNA targets under the predictor it optimizes, above a context-free floor of 0/60; under three predictors, 1/60 survives. Paired on the same 43 targets, a predictor the operator never saw confirms 2 of its designs against 26 for a minimum-free-energy solver (p = 8e-7). No statistic computed from the system and its own oracle sees that gap. Second, agent-written procedures can beat a human-written one under a judge no objective can flatter, at a fraction of the compute. Of six frontier models, the two whose operators ran without timeouts carry over at 0.293 against our 0.095 (n = 951 paired units, target-clustered [+0.108, +0.297], p = 5e-5) while spending 4.6-10x fewer oracle calls. Three rungs: difference under an outside adjudicator (reached), not bought with compute (reached, both directions), mechanism identified and transferable (not reached; seven candidates tested, none moves the statistic). The ceiling is the panel itself: its three predictors share nearest-neighbour thermodynamic parameters, two agreeing at kappa = 0.673. The audit is as unsparing about our own system: matched undirected search is an exact zero, and a search-free probe puts 84% of our headline effect on targets a random sequence already solves.", "arxiv_id": "2608.00981", "arxiv_url": "https://arxiv.org/abs/2608.00981", "authors": ["Wenhui Chen", "Jianlin Chen", "Ziyao Lin", "Chi Man Vong"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u81ea\u6539\u8fdb AI-for-science \u7cfb\u7edf\u7684\u53d1\u73b0\u58f0\u660e\u5ba1\u8ba1\u6846\u67b6\uff1a\u65e2\u68c0\u9a8c\u5916\u90e8\u88c1\u5224\u4e0b\u7684\u771f\u5b9e\u589e\u76ca\uff0c\u4e5f\u5f62\u5f0f\u5316\u754c\u5b9a\u5148\u9a8c\u9a8c\u8bc1\u5668\u4e0d\u53ef\u80fd\u8986\u76d6\u7684\u80fd\u529b\u8fb9\u754c\u3002\u4f5c\u8005\u4ee5 RNA \u7ed3\u6784\u8bbe\u8ba1\u4e3a\u6848\u4f8b\uff0c\u533a\u5206\u771f\u5b9e\u80fd\u529b\u63d0\u5347\u3001\u989d\u5916\u641c\u7d22\u3001\u9a8c\u8bc1\u5668\u53d8\u5316\u548c\u5bf9\u6709\u7f3a\u9677 oracle \u7684\u9002\u914d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00981", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8d1f\u5411\u5ba1\u8ba1\u53ef\u5224\u5b9a\uff1a\u8bc1\u660e\u65e0\u4f2a\u7ed3 oracle \u65e0\u6cd5\u8868\u793a\u4ea4\u53c9\u78b1\u57fa\u5bf9\uff0c\u4ece\u800c\u53ef\u5728\u8fd0\u884c\u524d\u79bb\u7ebf\u9650\u5b9a\u65e7\u9a8c\u8bc1\u5668\u80fd\u529b\u8303\u56f4\u3002", "\u5355\u4e00\u6709\u7f3a\u9677 oracle \u4f1a\u663e\u8457\u5938\u5927\u53d1\u73b0\uff1a\u67d0\u4f18\u5316\u5668\u5728\u81ea\u8eab\u9884\u6d4b\u5668\u4e0b\u89e3\u51fa 43/60 \u4e2a\u4ea4\u53c9 RNA \u76ee\u6807\uff0c\u4f46\u7ecf\u4e09\u4e2a\u9884\u6d4b\u5668\u590d\u6838\u4ec5 1/60 \u4fdd\u7559\u3002", "\u5916\u90e8\u88c1\u5224\u4e0b\uff0c\u90e8\u5206\u524d\u6cbf\u6a21\u578b\u751f\u6210\u7684\u7a0b\u5e8f\u8d85\u8fc7\u4eba\u5de5\u7a0b\u5e8f\uff0c\u4e14 oracle \u8c03\u7528\u5c11 4.6-10 \u500d\uff1b\u4f46\u673a\u5236\u8fc1\u79fb\u5c1a\u672a\u88ab\u8bc6\u522b\u3002", "\u4f5c\u8005\u4e5f\u5ba1\u8ba1\u81ea\u8eab\u7cfb\u7edf\uff1a\u5339\u914d\u65e0\u5411\u641c\u7d22\u6548\u679c\u4e3a\u96f6\uff0c\u4e14 84% \u5934\u90e8\u6548\u679c\u6765\u81ea\u968f\u673a\u5e8f\u5217\u672c\u5df2\u53ef\u89e3\u7684\u76ee\u6807\u3002"], "keywords": ["\u667a\u80fd\u4f53", "AI\u79d1\u5b66", "\u8bc4\u4f30\u5ba1\u8ba1", "\u9a8c\u8bc1\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00981v1", "published_at": "2026-08-02", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Auditing Discovery Claims: A Two-Sided Criterion for Agentic Science, with the Negative Side Decidable", "tldr": "\u63d0\u51fa\u667a\u80fd\u4f53\u79d1\u5b66\u53d1\u73b0\u7684\u53cc\u8fb9\u5ba1\u8ba1\u51c6\u5219", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u81ea\u6539\u8fdb AI-for-science \u7cfb\u7edf\u7684\u53d1\u73b0\u58f0\u660e\u5ba1\u8ba1\u6846\u67b6\uff1a\u65e2\u68c0\u9a8c\u5916\u90e8\u88c1\u5224\u4e0b\u7684\u771f\u5b9e\u589e\u76ca\uff0c\u4e5f\u5f62\u5f0f\u5316\u754c\u5b9a\u5148\u9a8c\u9a8c\u8bc1\u5668\u4e0d\u53ef\u80fd\u8986\u76d6\u7684\u80fd\u529b\u8fb9\u754c\u3002\u4f5c\u8005\u4ee5 RNA \u7ed3\u6784\u8bbe\u8ba1\u4e3a\u6848\u4f8b\uff0c\u533a\u5206\u771f\u5b9e\u80fd\u529b\u63d0\u5347\u3001\u989d\u5916\u641c\u7d22\u3001\u9a8c\u8bc1\u5668\u53d8\u5316\u548c\u5bf9\u6709\u7f3a\u9677 oracle \u7684\u9002\u914d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u201c\u667a\u80fd\u4f53\u58f0\u79f0\u53d1\u73b0\u65b0\u80fd\u529b\u201d\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u8bc4\u4f30\u8303\u5f0f\uff0c\u5f3a\u8c03\u65b0\u9896\u6027\u5e94\u76f8\u5bf9\u4e8e\u667a\u80fd\u4f53\u5148\u524d\u81ea\u8eab\u800c\u975e\u57fa\u5ea7\u6a21\u578b\uff0c\u5e76\u63ed\u793a\u4ec5\u51ed benchmark\u3001p \u503c\u6216\u81ea\u6709 oracle \u5bb9\u6613\u4ea7\u751f\u865a\u5047\u79d1\u5b66\u53d1\u73b0\u3002"}, {"abstract": "Polygonal meshes are the standard surface representation of modern 3D pipelines, and generating high-quality meshes with artist-style topology is essential for film, gaming, and interactive 3D applications. Mainstream approaches serialize a mesh into a token sequence and decode it autoregressively, which is slow at inference and sensitive to error accumulation, making them impractical for interactive asset creation. We present Meshy T2, a fast native mesh generation framework built on flow matching. At its core is a vertex-set mesh VAE that encodes a mesh into one continuous latent token per vertex and decodes vertices, edge connectivity, and face winding order in a single pass, preserving high-precision geometry and artist-authored topology without vertex quantization or welding. Generation proceeds as a coarse-to-fine cascade of two flow-matching models: an image-conditioned voxel flow first sketches the overall shape as a coarse occupancy scaffold, and a mesh flow then populates the scaffold with per-vertex latent tokens, conditioned on the image, the scaffold, and a requested vertex budget. This design delivers three practical capabilities: interactive generation speed through parallel flow-based synthesis; effective face-count control through the requested vertex budget; and native support for multi-part assets, whose components emerge directly from the generated connectivity. In our experiments, Meshy T2 achieves state-of-the-art geometric fidelity and completes end-to-end image-to-mesh generation within a median of 6 seconds, over an order of magnitude faster than autoregressive baselines. Code and weights will be available at https://github.com/meshy-dev/meshy-t2.", "arxiv_id": "2607.28675", "arxiv_url": "https://arxiv.org/abs/2607.28675", "authors": ["Jiale Xu", "Rendong Liang", "Yuhao Long", "Siyuan Shen", "Zangyueyang Xian", "Zeyi Xu", "Yuanming Hu"], "brief": "Meshy T2 \u662f\u4e00\u4e2a\u9762\u5411\u56fe\u50cf\u5230\u7f51\u683c\u7684\u5feb\u901f\u539f\u751f\u7f51\u683c\u751f\u6210\u6846\u67b6\uff0c\u4f7f\u7528\u6d41\u5339\u914d\u66ff\u4ee3\u81ea\u56de\u5f52\u7f51\u683c\u5e8f\u5217\u751f\u6210\u3002\u5b83\u901a\u8fc7\u9876\u70b9\u96c6 Mesh VAE \u4e0e\u7c97\u5230\u7ec6\u4e24\u9636\u6bb5\u6d41\u6a21\u578b\uff0c\u4e00\u6b21\u6027\u751f\u6210\u9ad8\u7cbe\u5ea6\u51e0\u4f55\u3001\u8fb9\u8fde\u63a5\u548c\u9762\u671d\u5411\u3002", "categories": ["cs.GR", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28675", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u9876\u70b9\u96c6 Mesh VAE\uff1a\u6bcf\u4e2a\u9876\u70b9\u5bf9\u5e94\u4e00\u4e2a\u8fde\u7eed\u6f5c\u53d8\u91cf\uff0c\u907f\u514d\u9876\u70b9\u91cf\u5316\u548c\u710a\u63a5\uff0c\u4fdd\u7559\u827a\u672f\u5bb6\u98ce\u683c\u62d3\u6251\u3002", "\u91c7\u7528\u4e24\u9636\u6bb5\u7c97\u5230\u7ec6\u6d41\u5339\u914d\uff1a\u5148\u751f\u6210\u4f53\u7d20\u5360\u636e\u811a\u624b\u67b6\uff0c\u518d\u751f\u6210\u6761\u4ef6\u4e8e\u56fe\u50cf\u3001\u811a\u624b\u67b6\u548c\u9876\u70b9\u9884\u7b97\u7684\u6bcf\u9876\u70b9\u6f5c\u53d8\u91cf\u3002", "\u7aef\u5230\u7aef\u56fe\u50cf\u5230\u7f51\u683c\u751f\u6210\u4e2d\u4f4d\u8017\u65f6\u7ea66\u79d2\uff0c\u6bd4\u81ea\u56de\u5f52\u57fa\u7ebf\u5feb\u4e00\u4e2a\u6570\u91cf\u7ea7\uff0c\u5e76\u652f\u6301\u9762\u6570\u63a7\u5236\u4e0e\u591a\u90e8\u4ef6\u8d44\u4ea7\u751f\u6210\u3002"], "keywords": ["3D\u751f\u6210", "\u7f51\u683c\u751f\u6210", "\u6d41\u5339\u914d", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": "Meshy", "pdf_url": "https://arxiv.org/pdf/2607.28675v1", "published_at": "2026-07-28", "score": 0.297, "selected_reasons": ["HF trending (41\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28675.png", "title": "Meshy T2: Fast Native Mesh Generation with Flow Matching", "tldr": "\u7528\u6d41\u5339\u914d\u5b9e\u73b06\u79d2\u7ea7\u9ad8\u8d28\u91cf\u539f\u751f\u7f51\u683c\u751f\u6210", "upvotes": 41, "what_it_is": "Meshy T2 \u662f\u4e00\u4e2a\u9762\u5411\u56fe\u50cf\u5230\u7f51\u683c\u7684\u5feb\u901f\u539f\u751f\u7f51\u683c\u751f\u6210\u6846\u67b6\uff0c\u4f7f\u7528\u6d41\u5339\u914d\u66ff\u4ee3\u81ea\u56de\u5f52\u7f51\u683c\u5e8f\u5217\u751f\u6210\u3002\u5b83\u901a\u8fc7\u9876\u70b9\u96c6 Mesh VAE \u4e0e\u7c97\u5230\u7ec6\u4e24\u9636\u6bb5\u6d41\u6a21\u578b\uff0c\u4e00\u6b21\u6027\u751f\u6210\u9ad8\u7cbe\u5ea6\u51e0\u4f55\u3001\u8fb9\u8fde\u63a5\u548c\u9762\u671d\u5411\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u76f4\u63a5\u9762\u5411\u5de5\u4e1a3D\u7ba1\u7ebf\u5e38\u7528\u7684\u591a\u8fb9\u5f62\u7f51\u683c\u8868\u793a\uff0c\u5728\u901f\u5ea6\u3001\u62d3\u6251\u8d28\u91cf\u548c\u53ef\u63a7\u6027\u4e0a\u540c\u65f6\u6539\u8fdb\uff0c\u5177\u6709\u4ea4\u4e92\u5f0f\u6e38\u620f\u3001\u5f71\u89c6\u548c3D\u8d44\u4ea7\u521b\u4f5c\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "While recent image editing models have made rapid progress, multi-reference editing remains challenging, particularly in maintaining visual consistency across references and ensuring overall visual harmony. Reinforcement learning has proven highly effective for text-to-image generation and single-image editing, but its extension to multi-reference editing is hindered by the absence of suitable reward models that capture multi-image relational constraints. Moreover, naively using multimodal large language models(MLLMs) as zero-shot evaluators faces a key tension between hallucination-prone long-form reasoning and the limited deductive power of short-form judgments. We address these issues with a Multi-dimensional Evaluation-Verification Reward(EVR). EVR decomposes evaluation into distinct visual criteria; for each criterion, an MLLM Evaluator generates multiple candidate hypotheses, and a Verifier grounds each claim in concrete visual evidence to accept or reject it, producing reliable and fine-grained reward signals. Together with a scalable data pipeline, our method enables RL fine-tuning of off-the-shelf editors without architectural changes. Extensive experiments show substantial gains over the base Qwen-Image-Edit, improving consistency and harmony to match or surpass NanoBanana.", "arxiv_id": "2607.29025", "arxiv_url": "https://arxiv.org/abs/2607.29025", "authors": ["Yingmao Miao", "Pengfei Zhang", "Xiaochen Lv", "Meng Yu", "Lei Sun", "Xiangxiang Chu", "Chao Shen", "Chenhao Lin"], "brief": "\u8bba\u6587\u63d0\u51fa\u591a\u7ef4 Evaluation-Verification Reward\uff08EVR\uff09\uff0c\u7528\u4e8e\u591a\u53c2\u8003\u56fe\u50cf\u7f16\u8f91\u7684\u5f3a\u5316\u5b66\u4e60\u5fae\u8c03\u3002\u5b83\u5c06\u89c6\u89c9\u4e00\u81f4\u6027\u3001\u6574\u4f53\u534f\u8c03\u7b49\u8981\u6c42\u62c6\u6210\u591a\u9879\u6807\u51c6\uff0c\u7531 MLLM \u751f\u6210\u5019\u9009\u5224\u65ad\uff0c\u518d\u7531\u9a8c\u8bc1\u5668\u57fa\u4e8e\u5177\u4f53\u89c6\u89c9\u8bc1\u636e\u9010\u6761\u786e\u8ba4\uff0c\u5f62\u6210\u66f4\u53ef\u9760\u7684\u7ec6\u7c92\u5ea6\u5956\u52b1\u4fe1\u53f7\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.29025", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u591a\u53c2\u8003\u56fe\u50cf\u7f16\u8f91\u7f3a\u4e4f\u80fd\u523b\u753b\u591a\u56fe\u5173\u7cfb\u7ea6\u675f\u7684\u5956\u52b1\u6a21\u578b\u95ee\u9898\uff0c\u8bbe\u8ba1\u4e86\u591a\u7ef4\u8bc4\u4f30-\u9a8c\u8bc1\u6846\u67b6\u3002", "\u901a\u8fc7\u201cEvaluator \u751f\u6210\u5047\u8bbe + Verifier \u8bc1\u636e\u9a8c\u8bc1\u201d\u7f13\u89e3 MLLM \u957f\u63a8\u7406\u6613\u5e7b\u89c9\u3001\u77ed\u5224\u65ad\u63a8\u7406\u4e0d\u8db3\u7684\u77db\u76fe\u3002", "\u65e0\u9700\u4fee\u6539\u7f16\u8f91\u5668\u67b6\u6784\u5373\u53ef\u5bf9\u73b0\u6210\u6a21\u578b\u8fdb\u884c RL \u5fae\u8c03\uff0c\u5e76\u5728 Qwen-Image-Edit \u4e0a\u663e\u8457\u63d0\u5347\u4e00\u81f4\u6027\u4e0e\u89c6\u89c9\u548c\u8c10\u5ea6\uff0c\u8fbe\u5230\u6216\u8d85\u8fc7 NanoBanana\u3002"], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001", "\u5956\u52b1\u6a21\u578b"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29025v1", "published_at": "2026-07-31", "score": 0.265, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.29025.png", "title": "Evaluation-Verification Reward for Consistent Multi-Reference Image Editing", "tldr": "\u7528\u8bc4\u4f30-\u9a8c\u8bc1\u5956\u52b1\u63d0\u5347\u591a\u53c2\u8003\u56fe\u50cf\u7f16\u8f91\u4e00\u81f4\u6027", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u591a\u7ef4 Evaluation-Verification Reward\uff08EVR\uff09\uff0c\u7528\u4e8e\u591a\u53c2\u8003\u56fe\u50cf\u7f16\u8f91\u7684\u5f3a\u5316\u5b66\u4e60\u5fae\u8c03\u3002\u5b83\u5c06\u89c6\u89c9\u4e00\u81f4\u6027\u3001\u6574\u4f53\u534f\u8c03\u7b49\u8981\u6c42\u62c6\u6210\u591a\u9879\u6807\u51c6\uff0c\u7531 MLLM \u751f\u6210\u5019\u9009\u5224\u65ad\uff0c\u518d\u7531\u9a8c\u8bc1\u5668\u57fa\u4e8e\u5177\u4f53\u89c6\u89c9\u8bc1\u636e\u9010\u6761\u786e\u8ba4\uff0c\u5f62\u6210\u66f4\u53ef\u9760\u7684\u7ec6\u7c92\u5ea6\u5956\u52b1\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5f3a\u5316\u5b66\u4e60\u6709\u6548\u6269\u5c55\u5230\u66f4\u590d\u6742\u7684\u591a\u53c2\u8003\u56fe\u50cf\u7f16\u8f91\u573a\u666f\uff0c\u6838\u5fc3\u8d21\u732e\u5728\u4e8e\u6784\u5efa\u4e86\u53ef\u9a8c\u8bc1\u3001\u7ec6\u7c92\u5ea6\u7684\u89c6\u89c9\u5956\u52b1\u673a\u5236\uff0c\u5bf9\u63d0\u5347\u751f\u6210\u5f0f\u56fe\u50cf\u7f16\u8f91\u7684\u53ef\u63a7\u6027\u548c\u5b9e\u7528\u8d28\u91cf\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Rubric-based RL has recently shown promise in improving LLMs on open-ended tasks. A widely recognized limitation of rubric-based RL is limited exploration: criteria that no rollout manages to satisfy (Unexplored Criteria, UC) receive no optimization signal. Recent methods address this by incorporating rubric information as external guidance during rollout, yet they introduce a train-inference mismatch: the policy is optimized on rollouts produced under external guidance while this guidance is absent at inference time, causing error accumulation through autoregressive decoding. Moreover, these exploration-focused approaches overlook a fundamentally different failure mode that we term Suppressed Criteria (SC) -- criteria that are satisfied by some rollouts yet whose learning signals are lost during optimization because scalar reward aggregation assigns them non-positive aggregate advantages. Our analysis reveals that SC are remarkably prevalent: over 57% of samples exhibit this failure mode throughout training, with an average of 1.8 SC per sample. To simultaneously address both UC and SC without introducing training-inference mismatch, we propose Criterion-Distilled Policy Optimization (CriPO), which enhances rubric-based RL via on-policy self-distillation. For UC, CriPO constructs a criterion-injection self-teacher and computes a localized forward-KL loss to inject missing behaviors into the policy. For SC, CriPO employs a counterfactual self-teacher to locate criterion-relevant tokens in negative-advantage rollouts and flips their token-level advantages to positive values, preserving useful patterns that would otherwise be suppressed. Experiments on medicine and science benchmarks demonstrate that CriPO consistently outperforms rubric-based RL, achieving stronger final performance with approximately $2\\times$ fewer optimization steps.", "arxiv_id": "2607.18082", "arxiv_url": "https://arxiv.org/abs/2607.18082", "authors": ["Mingxuan Xia", "Yuhang Yang", "Chao Ye", "Shuai Zhu", "Shenzhi Yang", "Guangcheng Zhu", "Yuhang Zhang", "Cheng Peng", "Haobo Wang", "Siqing Wang"], "brief": "\u8bba\u6587\u6307\u51faRubric-based RL\u9664\u201c\u672a\u63a2\u7d22\u51c6\u5219\u201d\u5916\uff0c\u8fd8\u5b58\u5728\u5927\u91cf\u201c\u88ab\u6291\u5236\u51c6\u5219\u201d\uff1a\u67d0\u4e9b\u51c6\u5219\u867d\u88ab\u90e8\u5206\u91c7\u6837\u6ee1\u8db3\uff0c\u5374\u56e0\u6807\u91cf\u5956\u52b1\u805a\u5408\u5f97\u5230\u975e\u6b63\u4f18\u52bf\u800c\u65e0\u6cd5\u5b66\u4e60\u3002\u4f5c\u8005\u63d0\u51faCriPO\uff0c\u901a\u8fc7on-policy\u81ea\u84b8\u998f\u540c\u65f6\u8865\u8db3\u672a\u63a2\u7d22\u884c\u4e3a\u5e76\u4fdd\u7559\u88ab\u6291\u5236\u7684\u6709\u7528\u6a21\u5f0f\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.18082", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0Suppressed Criteria\u666e\u904d\u5b58\u5728\uff1a\u8bad\u7ec3\u4e2d\u8d85\u8fc757%\u7684\u6837\u672c\u51fa\u73b0\u8be5\u95ee\u9898\uff0c\u5e73\u5747\u6bcf\u4e2a\u6837\u672c\u67091.8\u4e2a\u88ab\u6291\u5236\u51c6\u5219\u3002", "\u9488\u5bf9\u672a\u63a2\u7d22\u51c6\u5219\uff0c\u6784\u9020criterion-injection\u81ea\u6559\u5e08\uff0c\u5e76\u7528\u5c40\u90e8forward-KL\u635f\u5931\u5c06\u7f3a\u5931\u884c\u4e3a\u6ce8\u5165\u7b56\u7565\u3002", "\u9488\u5bf9\u88ab\u6291\u5236\u51c6\u5219\uff0c\u4f7f\u7528\u53cd\u4e8b\u5b9e\u81ea\u6559\u5e08\u5b9a\u4f4d\u8d1f\u4f18\u52bf\u8f68\u8ff9\u4e2d\u7684\u51c6\u5219\u76f8\u5173token\uff0c\u5e76\u5c06\u5176token\u7ea7\u4f18\u52bf\u7ffb\u8f6c\u4e3a\u6b63\uff0c\u4ee5\u907f\u514d\u6709\u7528\u6a21\u5f0f\u88ab\u4f18\u5316\u62b9\u9664\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5bf9\u9f50"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.18082v3", "published_at": "2026-07-20", "score": 0.252, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.18082.png", "title": "CriPO: Enhancing Rubric-based RL via Self-Distillation", "tldr": "CriPO\u7528\u81ea\u84b8\u998f\u6539\u8fdbRubric\u5f3a\u5316\u5b66\u4e60\u63a2\u7d22\u4e0e\u4fe1\u53f7\u4fdd\u7559", "upvotes": 15, "what_it_is": "\u8bba\u6587\u6307\u51faRubric-based RL\u9664\u201c\u672a\u63a2\u7d22\u51c6\u5219\u201d\u5916\uff0c\u8fd8\u5b58\u5728\u5927\u91cf\u201c\u88ab\u6291\u5236\u51c6\u5219\u201d\uff1a\u67d0\u4e9b\u51c6\u5219\u867d\u88ab\u90e8\u5206\u91c7\u6837\u6ee1\u8db3\uff0c\u5374\u56e0\u6807\u91cf\u5956\u52b1\u805a\u5408\u5f97\u5230\u975e\u6b63\u4f18\u52bf\u800c\u65e0\u6cd5\u5b66\u4e60\u3002\u4f5c\u8005\u63d0\u51faCriPO\uff0c\u901a\u8fc7on-policy\u81ea\u84b8\u998f\u540c\u65f6\u8865\u8db3\u672a\u63a2\u7d22\u884c\u4e3a\u5e76\u4fdd\u7559\u88ab\u6291\u5236\u7684\u6709\u7528\u6a21\u5f0f\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u5728rollout\u9636\u6bb5\u5f15\u5165\u5916\u90e8\u6307\u5bfc\uff0c\u907f\u514d\u8bad\u7ec3-\u63a8\u7406\u4e0d\u5339\u914d\uff0c\u540c\u65f6\u89e3\u51b3\u63a2\u7d22\u4e0d\u8db3\u548c\u5956\u52b1\u805a\u5408\u5bfc\u81f4\u7684\u5b66\u4e60\u4fe1\u53f7\u4e22\u5931\uff1b\u5728\u533b\u5b66\u4e0e\u79d1\u5b66\u57fa\u51c6\u4e0a\u4ee5\u7ea62\u500d\u66f4\u5c11\u4f18\u5316\u6b65\u6570\u53d6\u5f97\u66f4\u5f3a\u6027\u80fd\uff0c\u5177\u6709\u63d0\u5347\u5f00\u653e\u5f0f\u4efb\u52a1LLM\u5bf9\u9f50\u6548\u7387\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Latent world models enable efficient planning by predicting future states in a compact representation space, but their performance depends critically on the quality of the learned latent distribution. LeWorldModel (LeWM) regularizes its latents toward an isotropic Gaussian using the Epps-Pulley (EP) objective. We show that the corrective gradients of EP rapidly vanish for isolated tail samples, leaving heavy-tailed deviations insufficiently controlled. To address this limitation, we propose QQWorld, which replaces EP with a quantile-quantile matching objective that directly aligns projected latent samples with rank-matched Gaussian quantiles, thereby maintaining effective corrective gradients in the tails. We further develop cross-batch QQ, which enlarges the effective ranking pool using detached samples from previous batches, and characterize its bias-variance trade-off. Across four control environments, QQWorld effectively improves the average planning success rate of LeWM, while consistently yielding better Gaussian alignment and thinner latent tails.", "arxiv_id": "2607.28415", "arxiv_url": "https://arxiv.org/abs/2607.28415", "authors": ["Zhoushun Yu", "Xiaoyu Hu", "Xiangyu Xu"], "brief": "\u8bba\u6587\u63d0\u51fa QQWorld\uff0c\u7528\u5206\u4f4d\u6570-\u5206\u4f4d\u6570\u5339\u914d\u76ee\u6807\u66ff\u4ee3 LeWorldModel \u4e2d\u7684 Epps-Pulley \u9ad8\u65af\u6b63\u5219\uff0c\u4f7f\u6f5c\u53d8\u91cf\u5206\u5e03\u66f4\u76f4\u63a5\u5bf9\u9f50\u5404\u5411\u540c\u6027\u9ad8\u65af\u3002\u65b9\u6cd5\u91cd\u70b9\u89e3\u51b3 EP \u76ee\u6807\u5bf9\u5c3e\u90e8\u79bb\u7fa4\u6837\u672c\u68af\u5ea6\u5feb\u901f\u6d88\u5931\u3001\u91cd\u5c3e\u504f\u5dee\u96be\u4ee5\u63a7\u5236\u7684\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV", "cs.MM", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28415", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["QQ \u5339\u914d\u5c06\u6295\u5f71\u540e\u7684\u6f5c\u53d8\u91cf\u6837\u672c\u4e0e\u6309\u79e9\u5339\u914d\u7684\u9ad8\u65af\u5206\u4f4d\u6570\u5bf9\u9f50\uff0c\u4ece\u800c\u5728\u5206\u5e03\u5c3e\u90e8\u4fdd\u6301\u6709\u6548\u6821\u6b63\u68af\u5ea6\u3002", "\u63d0\u51fa cross-batch QQ\uff0c\u5229\u7528\u524d\u5e8f batch \u7684\u505c\u6b62\u68af\u5ea6\u6837\u672c\u6269\u5927\u6392\u5e8f\u6c60\uff0c\u5e76\u5206\u6790\u5176\u504f\u5dee-\u65b9\u5dee\u6743\u8861\u3002", "\u5728\u56db\u4e2a\u63a7\u5236\u73af\u5883\u4e2d\u63d0\u5347 LeWM \u7684\u5e73\u5747\u89c4\u5212\u6210\u529f\u7387\uff0c\u540c\u65f6\u83b7\u5f97\u66f4\u597d\u7684\u9ad8\u65af\u5bf9\u9f50\u548c\u66f4\u8584\u7684\u6f5c\u53d8\u91cf\u5c3e\u90e8\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60", "\u89c4\u5212"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28415v1", "published_at": "2026-07-30", "score": 0.238, "selected_reasons": ["HF trending (24\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28415.png", "title": "QQWorld: Quantile-Quantile Matching for World Model Regularization", "tldr": "\u7528QQ\u5339\u914d\u6539\u5584\u4e16\u754c\u6a21\u578b\u6f5c\u53d8\u91cf\u6b63\u5219\u3002", "upvotes": 24, "what_it_is": "\u8bba\u6587\u63d0\u51fa QQWorld\uff0c\u7528\u5206\u4f4d\u6570-\u5206\u4f4d\u6570\u5339\u914d\u76ee\u6807\u66ff\u4ee3 LeWorldModel \u4e2d\u7684 Epps-Pulley \u9ad8\u65af\u6b63\u5219\uff0c\u4f7f\u6f5c\u53d8\u91cf\u5206\u5e03\u66f4\u76f4\u63a5\u5bf9\u9f50\u5404\u5411\u540c\u6027\u9ad8\u65af\u3002\u65b9\u6cd5\u91cd\u70b9\u89e3\u51b3 EP \u76ee\u6807\u5bf9\u5c3e\u90e8\u79bb\u7fa4\u6837\u672c\u68af\u5ea6\u5feb\u901f\u6d88\u5931\u3001\u91cd\u5c3e\u504f\u5dee\u96be\u4ee5\u63a7\u5236\u7684\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u6f5c\u7a7a\u95f4\u4e16\u754c\u6a21\u578b\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u5c3e\u90e8\u5206\u5e03\u5931\u914d\u95ee\u9898\u7ed9\u51fa\u7b80\u6d01\u6709\u6548\u7684\u6b63\u5219\u5316\u66ff\u4ee3\u65b9\u6848\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u57fa\u4e8e\u6f5c\u53d8\u91cf\u9884\u6d4b\u7684\u89c4\u5212\u7a33\u5b9a\u6027\u4e0e\u63a7\u5236\u6027\u80fd\u3002"}, {"abstract": "Robust low-light imaging remains challenging for the community. Recent studies have explored fusing Near-Infrared (NIR) with noisy RGB to achieve improved enhancement, yet most methods depend on carefully curated training data pairs, with limited robustness under different scenarios. This paper offers a new perspective for RGB-NIR low-light imaging by incorporating 3D-aware neural modeling. Without using clean RGB supervision, a powerful model can be optimized to implicitly fuse extremely noisy RGB observations with NIR cues in 3D space, effectively recovering clean RGB images. The proposed model obviates the requirement for clean RGB data collection, generalizes across different noise levels. Extensive evaluations on synthetic and real data demonstrate its superiority. Codes available: https://github.com/MyNiuuu/3DarkFusion", "arxiv_id": "2607.29684", "arxiv_url": "https://arxiv.org/abs/2607.29684", "authors": ["Muyao Niu", "Mingze Ma", "Yifan Zhan", "Qingtian Zhu", "Zhihang Zhong", "Wei Guo", "Chang Wen Chen", "Yinqiang Zheng"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6697\u5149RGB-NIR\u878d\u5408\u6210\u50cf\u76843D\u611f\u77e5\u795e\u7ecf\u5efa\u6a21\u65b9\u6cd5\u3002\u5728\u65e0\u9700\u5e72\u51c0RGB\u76d1\u7763\u7684\u60c5\u51b5\u4e0b\uff0c\u5c06\u6781\u566a\u58f0RGB\u89c2\u6d4b\u4e0eNIR\u7ebf\u7d22\u5728\u4e09\u7ef4\u7a7a\u95f4\u4e2d\u9690\u5f0f\u878d\u5408\uff0c\u6062\u590d\u66f4\u5e72\u51c0\u7684\u5f69\u8272\u56fe\u50cf\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/MyNiuuu/3DarkFusion", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.29684", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4e0d\u4f9d\u8d56\u6210\u5bf9\u5e72\u51c0RGB\u8bad\u7ec3\u6570\u636e\uff0c\u964d\u4f4e\u4f4e\u5149\u6570\u636e\u91c7\u96c6\u4e0e\u6807\u6ce8\u6210\u672c", "\u901a\u8fc73D-aware\u795e\u7ecf\u8868\u793a\u5728\u7a7a\u95f4\u4e2d\u878d\u5408RGB\u566a\u58f0\u89c2\u6d4b\u548cNIR\u4fe1\u606f\uff0c\u589e\u5f3a\u7ed3\u6784\u4e00\u81f4\u6027\u4e0e\u9c81\u68d2\u6027", "\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u6570\u636e\u4e0a\u9a8c\u8bc1\uff0c\u5bf9\u4e0d\u540c\u566a\u58f0\u6c34\u5e73\u5177\u6709\u66f4\u597d\u7684\u6cdb\u5316\u80fd\u529b"], "keywords": ["\u4f4e\u5149\u6210\u50cf", "\u591a\u6a21\u6001", "\u4e09\u7ef4\u91cd\u5efa", "\u795e\u7ecf\u8868\u793a"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.29684v1", "published_at": "2026-07-31", "score": 0.219, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.29684.png", "title": "Toward Robust and 3D-Aware RGB-NIR Imaging in the Dark", "tldr": "\u75283D\u795e\u7ecf\u5efa\u6a21\u63d0\u5347\u6697\u5149RGB-NIR\u6210\u50cf", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6697\u5149RGB-NIR\u878d\u5408\u6210\u50cf\u76843D\u611f\u77e5\u795e\u7ecf\u5efa\u6a21\u65b9\u6cd5\u3002\u5728\u65e0\u9700\u5e72\u51c0RGB\u76d1\u7763\u7684\u60c5\u51b5\u4e0b\uff0c\u5c06\u6781\u566a\u58f0RGB\u89c2\u6d4b\u4e0eNIR\u7ebf\u7d22\u5728\u4e09\u7ef4\u7a7a\u95f4\u4e2d\u9690\u5f0f\u878d\u5408\uff0c\u6062\u590d\u66f4\u5e72\u51c0\u7684\u5f69\u8272\u56fe\u50cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a3D\u795e\u7ecf\u5efa\u6a21\u5f15\u5165RGB-NIR\u6697\u5149\u589e\u5f3a\uff0c\u7f13\u89e3\u4e86\u4f20\u7edf\u65b9\u6cd5\u5bf9\u7cbe\u5fc3\u914d\u5bf9\u8bad\u7ec3\u6570\u636e\u7684\u4f9d\u8d56\uff0c\u5bf9\u591c\u95f4\u6210\u50cf\u3001\u5b89\u9632\u76d1\u63a7\u548c\u4f4e\u7167\u5ea6\u89c6\u89c9\u611f\u77e5\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "RGB imagery offers a practical, low-cost option for Unmanned Aerial/Ground Vehicle (UAV/UGV) survey support in surface-landmine detection, but object detectors remain underexplored in this safety-critical domain. Limited cross-architecture benchmarking and insufficient out-of-distribution (OOD) analysis obscure whether detectors generalize across deployment conditions. This challenge is amplified by the scarcity of public RGB landmine datasets, making SULAND a key benchmark for PFM-1 and PMA-2 detection. However, inspection reveals missing/false annotations, localization errors, inconsistent visibility criteria, visual artifacts, temporal labeling inconsistencies, and an inverted OOD class-ID convention in SULAND. We present SULAND_v2, a refined RGB surface-landmine dataset and benchmark. Preserving original images and splits, we manually revise annotations to ensure completeness, precise localization, label validity, and class consistency. SULAND_v2 contains 33,771 images and 12,433 bounding boxes. We benchmark 35 detector configurations across nine families. Annotation refinement improves YOLOv8 in-distribution (IID) test mAP@50 by 14.6-19.6 percentage points, while fixing the OOD class-ID convention increases mean YOLOv8 OOD mAP@50 by ~25 percentage points. On SULAND_v2, YOLOv12-Small achieves the highest IID mAP@50 (0.908), while RF-DETR-Large yields the strongest OOD performance (0.799 mAP@50, 0.675 recall). Our results demonstrate that high IID accuracy does not guarantee operational readiness. SULAND_v2 provides a reliable benchmark for evaluating domain-shift robustness in RGB-based mine-action survey support.", "arxiv_id": "2607.28996", "arxiv_url": "https://arxiv.org/abs/2607.28996", "authors": ["Sagar Lekhak", "Prasanna Reddy Pulakurthi", "Lalit Joshi", "Ramesh Bhatta", "Emmett J. Ientilucci"], "brief": "\u8bba\u6587\u53d1\u5e03\u4e86 SULAND_v2\uff0c\u4e00\u4e2a\u9762\u5411 UAV/UGV \u8868\u9762\u5730\u96f7\u68c0\u6d4b\u7684\u4fee\u8ba2\u7248 RGB \u6570\u636e\u96c6\u4e0e\u57fa\u51c6\u3002\u4f5c\u8005\u4fdd\u7559\u539f\u59cb\u56fe\u50cf\u548c\u5212\u5206\uff0c\u4eba\u5de5\u4fee\u6b63\u6f0f\u6807\u3001\u8bef\u6807\u3001\u5b9a\u4f4d\u9519\u8bef\u3001\u7c7b\u522b\u4e0d\u4e00\u81f4\u548c OOD \u7c7b\u522b\u7f16\u53f7\u95ee\u9898\uff0c\u5e76\u8bc4\u6d4b\u4e86 9 \u4e2a\u7cfb\u5217\u5171 35 \u79cd\u76ee\u6807\u68c0\u6d4b\u5668\u914d\u7f6e\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/PrasannaPulakurthi/SULAND_v2", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2607.28996", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["SULAND_v2 \u5305\u542b 33,771 \u5f20\u56fe\u50cf\u548c 12,433 \u4e2a\u8fb9\u754c\u6846\uff0c\u8986\u76d6 PFM-1 \u4e0e PMA-2 \u8868\u9762\u5730\u96f7\u68c0\u6d4b\u573a\u666f\u3002", "\u6807\u6ce8\u4fee\u8ba2\u4f7f YOLOv8 \u7684 IID \u6d4b\u8bd5 mAP@50 \u63d0\u5347 14.6-19.6 \u4e2a\u767e\u5206\u70b9\uff1b\u4fee\u590d OOD \u7c7b\u522b\u7f16\u53f7\u4f7f\u5e73\u5747 OOD mAP@50 \u63d0\u5347\u7ea6 25 \u4e2a\u767e\u5206\u70b9\u3002", "YOLOv12-Small \u5728 IID \u4e0a\u6700\u4f73\uff0cmAP@50 \u8fbe 0.908\uff1bRF-DETR-Large \u5728 OOD \u4e0a\u6700\u5f3a\uff0cmAP@50 \u4e3a 0.799\u3001\u53ec\u56de\u7387\u4e3a 0.675\u3002"], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u6570\u636e\u96c6", "\u57df\u6cdb\u5316", "\u65e0\u4eba\u7cfb\u7edf"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28996v1", "published_at": "2026-07-31", "score": 0.218, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28996.png", "title": "SULAND v2: A Refined RGB Dataset and Deep Learning Object Detection Benchmark for UAV/UGV-Based SUrface LANDmine Detection Under Domain Shift", "tldr": "\u4fee\u8ba2RGB\u5730\u96f7\u6570\u636e\u96c6\u5e76\u7cfb\u7edf\u8bc4\u6d4b\u68c0\u6d4b\u5668", "upvotes": 2, "what_it_is": "\u8bba\u6587\u53d1\u5e03\u4e86 SULAND_v2\uff0c\u4e00\u4e2a\u9762\u5411 UAV/UGV \u8868\u9762\u5730\u96f7\u68c0\u6d4b\u7684\u4fee\u8ba2\u7248 RGB \u6570\u636e\u96c6\u4e0e\u57fa\u51c6\u3002\u4f5c\u8005\u4fdd\u7559\u539f\u59cb\u56fe\u50cf\u548c\u5212\u5206\uff0c\u4eba\u5de5\u4fee\u6b63\u6f0f\u6807\u3001\u8bef\u6807\u3001\u5b9a\u4f4d\u9519\u8bef\u3001\u7c7b\u522b\u4e0d\u4e00\u81f4\u548c OOD \u7c7b\u522b\u7f16\u53f7\u95ee\u9898\uff0c\u5e76\u8bc4\u6d4b\u4e86 9 \u4e2a\u7cfb\u5217\u5171 35 \u79cd\u76ee\u6807\u68c0\u6d4b\u5668\u914d\u7f6e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u5347\u4e86\u5b89\u5168\u5173\u952e\u5730\u96f7\u68c0\u6d4b\u57fa\u51c6\u7684\u6807\u6ce8\u53ef\u9760\u6027\uff0c\u5e76\u63ed\u793a\u4e86 IID \u9ad8\u7cbe\u5ea6\u5e76\u4e0d\u7b49\u4e8e\u57df\u5916\u90e8\u7f72\u53ef\u9760\u6027\uff0c\u5bf9\u65e0\u4eba\u673a/\u65e0\u4eba\u8f66\u8f85\u52a9\u6392\u96f7\u4e2d\u7684\u9c81\u68d2\u76ee\u6807\u68c0\u6d4b\u8bc4\u4f30\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Can every robot in a swarm predict the same future collective state from only local observations and bandwidth-limited messages? We formulate this as decentralized shared-state prediction and introduce Collective-State JEPA (CS-JEPA), a recurrent joint-embedding predictive architecture whose output at every robot represents one common future token field. At deployment, each robot uses a 16-frame local history and one 64-float recurrent message per directed edge; there is no global pooling, target encoder, episode clock, or recorded future action. After pretraining without downstream collective labels, frozen representations are evaluated with ridge probes fitted on 6, 12, or 24 globally labeled episodes. Against raw-future reconstruction with the same receiver anchor and deployment capacity but 9,607 additional training-only parameters, a prospectively registered five-seed follow-up improves prediction-error and inter-robot-agreement label-budget AUC on in-distribution, ring, mutual-kNN, and unseen-size families up to 108 robots. Every effect favors CS-JEPA in 5/5 outer seeds. A sealed eight-seed action-conditioned follow-up reduces branch-value MSE by 45.5% and improves within-context candidate-score correlation by 0.1291. In a separate 16-seed fully decentralized closed-loop study, receiver-local CS-JEPA planning improves utility over nominal control ($\u0394= +0.01053$, $p = 0.00070$) and first plan-coefficient agreement over matched reconstruction ($\u0394= +0.14472$, $p = 0.000061$). These results support common-future JEPA targets as a label-efficient primitive for decentralized swarm prediction under topology and size shift, with additional evidence of planning-relevant value estimation and closed-loop decision consistency.", "arxiv_id": "2607.28443", "arxiv_url": "https://arxiv.org/abs/2607.28443", "authors": ["Alan-Barsag Gazzaev", "Alexey Gavrilov", "Sergey Muravyov"], "brief": "\u8bba\u6587\u63d0\u51fa Collective-State JEPA\uff08CS-JEPA\uff09\uff0c\u4e00\u79cd\u53bb\u4e2d\u5fc3\u5316\u5faa\u73af\u8054\u5408\u5d4c\u5165\u9884\u6d4b\u67b6\u6784\uff0c\u4f7f\u6bcf\u4e2a\u673a\u5668\u4eba\u4ec5\u51ed\u672c\u5730\u5386\u53f2\u548c\u4f4e\u5e26\u5bbd\u90bb\u5c45\u6d88\u606f\u9884\u6d4b\u540c\u4e00\u4e2a\u672a\u6765\u7fa4\u4f53\u72b6\u6001\u3002\u6a21\u578b\u5728\u65e0\u4e0b\u6e38\u7fa4\u4f53\u6807\u7b7e\u9884\u8bad\u7ec3\u540e\uff0c\u7528\u5c11\u91cf\u5168\u5c40\u6807\u6ce8 episode \u8fdb\u884c\u7ebf\u6027\u63a2\u6d4b\u8bc4\u4f30\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28443", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u90e8\u7f72\u65f6\u6bcf\u4e2a\u673a\u5668\u4eba\u53ea\u4f7f\u752816\u5e27\u672c\u5730\u5386\u53f2\u548c\u6bcf\u6761\u6709\u5411\u8fb964\u4e2a\u6d6e\u70b9\u6d88\u606f\uff0c\u65e0\u5168\u5c40\u6c60\u5316\u3001\u76ee\u6807\u7f16\u7801\u5668\u3001episode \u65f6\u949f\u6216\u672a\u6765\u52a8\u4f5c\u8bb0\u5f55", "\u5728\u5206\u5e03\u5185\u3001\u73af\u5f62\u3001mutual-kNN\u3001\u672a\u89c1\u89c4\u6a21\u7b49\u62d3\u6251\u4e0e\u89c4\u6a21\u8fc1\u79fb\u573a\u666f\u4e2d\uff0c\u76f8\u6bd4\u539f\u59cb\u672a\u6765\u91cd\u5efa\u57fa\u7ebf\uff0c\u5728\u9884\u6d4b\u8bef\u5dee\u548c\u673a\u5668\u4eba\u95f4\u4e00\u81f4\u6027\u4e0a\u5747\u66f4\u4f18\uff0c\u8986\u76d6\u6700\u9ad8108\u4e2a\u673a\u5668\u4eba", "\u52a8\u4f5c\u6761\u4ef6\u5b9e\u9a8c\u4e2d\u5206\u652f\u4ef7\u503c MSE \u964d\u4f4e45.5%\uff0c\u95ed\u73af\u53bb\u4e2d\u5fc3\u5316\u89c4\u5212\u5b9e\u9a8c\u663e\u8457\u63d0\u5347\u6548\u7528\u548c\u8ba1\u5212\u7cfb\u6570\u4e00\u81f4\u6027"], "keywords": ["\u7fa4\u4f53\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u53bb\u4e2d\u5fc3\u5316\u63a7\u5236"], "num_comments": 1, "on_hf": true, "organization": "ITMO University", "pdf_url": "https://arxiv.org/pdf/2607.28443v2", "published_at": "2026-07-30", "score": 0.216, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28443.png", "title": "One Future, Every Robot: Label-Efficient Collective-State Prediction with Decentralized JEPA", "tldr": "CS-JEPA\u8ba9\u7fa4\u4f53\u673a\u5668\u4eba\u9ad8\u6548\u9884\u6d4b\u5171\u540c\u672a\u6765\u72b6\u6001", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Collective-State JEPA\uff08CS-JEPA\uff09\uff0c\u4e00\u79cd\u53bb\u4e2d\u5fc3\u5316\u5faa\u73af\u8054\u5408\u5d4c\u5165\u9884\u6d4b\u67b6\u6784\uff0c\u4f7f\u6bcf\u4e2a\u673a\u5668\u4eba\u4ec5\u51ed\u672c\u5730\u5386\u53f2\u548c\u4f4e\u5e26\u5bbd\u90bb\u5c45\u6d88\u606f\u9884\u6d4b\u540c\u4e00\u4e2a\u672a\u6765\u7fa4\u4f53\u72b6\u6001\u3002\u6a21\u578b\u5728\u65e0\u4e0b\u6e38\u7fa4\u4f53\u6807\u7b7e\u9884\u8bad\u7ec3\u540e\uff0c\u7528\u5c11\u91cf\u5168\u5c40\u6807\u6ce8 episode \u8fdb\u884c\u7ebf\u6027\u63a2\u6d4b\u8bc4\u4f30\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a JEPA \u5f0f\u5171\u540c\u672a\u6765\u8868\u5f81\u5f15\u5165\u53bb\u4e2d\u5fc3\u5316\u7fa4\u4f53\u673a\u5668\u4eba\u9884\u6d4b\uff0c\u5728\u6781\u5c11\u6807\u7b7e\u548c\u53d7\u9650\u901a\u4fe1\u4e0b\u63d0\u5347\u8de8\u62d3\u6251\u3001\u8de8\u89c4\u6a21\u6cdb\u5316\uff0c\u5e76\u5c55\u793a\u4e86\u5bf9\u89c4\u5212\u4e0e\u95ed\u73af\u51b3\u7b56\u7684\u4e00\u81f4\u6027\u4ef7\u503c\u3002"}, {"abstract": "Multimodal on-policy distillation (OPD) transfers fine-grained visual knowledge by super
