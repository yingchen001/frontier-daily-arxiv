vising student-generated trajectories with a privileged-view teacher. Yet its next-token corrections are source-mixed, combining visual signals with linguistic priors and teacher-specific effects. The key challenge is to estimate which corrections are supported by visual evidence, not merely where or how strongly to distill. We introduce Visual Attribution Distillation (VAD), a counterfactual target-reconstruction algorithm that estimates the visually attributable part of a teacher correction. At each student-generated prefix, VAD evaluates the same fixed teacher with the relevant evidence present and removed. The corresponding change in centered log-probabilities defines ut, a signed proxy for the visual evidence direction that estimates how revealing the evidence supports or refutes candidate tokens. VAD projects the original correction onto this proxy to obtain an intervention-aligned component and a proxy-unexplained residual, then reconstructs a student-anchored target from the former. During training, this reconstructed target supplies the primary supervision signal, while the privileged teacher contributes a weak regularizer. Across six fine-grained visual benchmarks at 4B and 9B scales, VAD outperforms direct privileged-view distillation and visual-advantage weighting. Token- level and controlled-target analyses show that the proxy-aligned component is enriched in task-relevant visual corrections and yields stronger target shifts, especially when evidence refutes a mistaken answer. These results support counterfactual target reconstruction as an effective alternative to source-mixed supervision.", "arxiv_id": "2607.28590", "arxiv_url": "https://arxiv.org/abs/2607.28590", "authors": ["Kangning Zhang", "Yixing Li", "Shuai Shao", "Qingyao Li", "Zhengxi Lu", "Zhiyuan Yao", "Jianghao Lin", "Wenxiang Jiao", "Yuan Lu", "Weiwen Liu", "Weinan Zhang", "Yong Yu"], "brief": "\u8bba\u6587\u63d0\u51fa Visual Attribution Distillation\uff08VAD\uff09\uff0c\u7528\u4e8e\u591a\u6a21\u6001 on-policy \u84b8\u998f\u4e2d\u533a\u5206\u6559\u5e08\u7ea0\u6b63\u91cc\u771f\u6b63\u7531\u89c6\u89c9\u8bc1\u636e\u652f\u6301\u7684\u90e8\u5206\u3002\u5b83\u901a\u8fc7\u53cd\u4e8b\u5b9e\u79fb\u9664\u89c6\u89c9\u8bc1\u636e\uff0c\u91cd\u6784\u66f4\u5e72\u51c0\u7684\u5b66\u751f\u76d1\u7763\u76ee\u6807\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/DeepExperience/VAD_Multimodal_OPD", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28590", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5728\u5b66\u751f\u751f\u6210\u524d\u7f00\u4e0b\uff0c\u5bf9\u540c\u4e00\u6559\u5e08\u5206\u522b\u8f93\u5165\u6709/\u65e0\u76f8\u5173\u89c6\u89c9\u8bc1\u636e\uff0c\u6bd4\u8f83\u4e2d\u5fc3\u5316\u5bf9\u6570\u6982\u7387\u53d8\u5316\uff0c\u4f30\u8ba1\u89c6\u89c9\u8bc1\u636e\u65b9\u5411", "\u5c06\u539f\u59cb\u6559\u5e08\u7ea0\u6b63\u6295\u5f71\u5230\u89c6\u89c9\u8bc1\u636e\u4ee3\u7406\u65b9\u5411\u4e0a\uff0c\u5206\u79bb\u51fa\u5e72\u9884\u5bf9\u9f50\u6210\u5206\u4e0e\u65e0\u6cd5\u7531\u89c6\u89c9\u89e3\u91ca\u7684\u6b8b\u5dee", "\u57286\u4e2a\u7ec6\u7c92\u5ea6\u89c6\u89c9\u57fa\u51c6\u30014B\u548c9B\u6a21\u578b\u89c4\u6a21\u4e0a\uff0c\u4f18\u4e8e\u76f4\u63a5\u7279\u6743\u89c6\u89d2\u84b8\u998f\u548c\u89c6\u89c9\u4f18\u52bf\u52a0\u6743\u65b9\u6cd5"], "keywords": ["\u591a\u6a21\u6001", "\u77e5\u8bc6\u84b8\u998f", "\u89c6\u89c9\u7406\u89e3", "\u53cd\u4e8b\u5b9e\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28590v1", "published_at": "2026-07-30", "score": 0.208, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28590.png", "title": "VAD: Attributing Visual Evidence for Target Reconstruction in Multimodal On-Policy Distillation", "tldr": "VAD\u63d0\u53d6\u89c6\u89c9\u8bc1\u636e\u9a71\u52a8\u7684\u84b8\u998f\u4fe1\u53f7", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Visual Attribution Distillation\uff08VAD\uff09\uff0c\u7528\u4e8e\u591a\u6a21\u6001 on-policy \u84b8\u998f\u4e2d\u533a\u5206\u6559\u5e08\u7ea0\u6b63\u91cc\u771f\u6b63\u7531\u89c6\u89c9\u8bc1\u636e\u652f\u6301\u7684\u90e8\u5206\u3002\u5b83\u901a\u8fc7\u53cd\u4e8b\u5b9e\u79fb\u9664\u89c6\u89c9\u8bc1\u636e\uff0c\u91cd\u6784\u66f4\u5e72\u51c0\u7684\u5b66\u751f\u76d1\u7763\u76ee\u6807\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4ece\u201c\u84b8\u998f\u54ea\u91cc\u66f4\u5f3a\u201d\u8f6c\u5411\u201c\u84b8\u998f\u54ea\u4e9b\u786e\u7531\u89c6\u89c9\u8bc1\u636e\u652f\u6301\u201d\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11\u8bed\u8a00\u5148\u9a8c\u548c\u6559\u5e08\u504f\u5dee\u5e26\u6765\u7684\u9519\u8bef\u76d1\u7763\uff0c\u63d0\u5347\u7ec6\u7c92\u5ea6\u591a\u6a21\u6001\u5b66\u4e60\u53ef\u9760\u6027\u3002"}, {"abstract": "Recent Vision-Language-Action (VLA) models for autonomous driving (AD) increasingly utilize chain-of-thought (CoT) supervision to enhance the reasoning capabilities of their Vision-Language Model (VLM) components, yet existing annotation pipelines commonly expose the teacher model to the logged ground-truth (GT) future trajectory. We empirically show that this induces trajectory anchoring bias: teacher models rationalize the revealed outcome rather than infer a decision from scene evidence, producing less causally faithful CoTs and substantially more severe hallucinations, especially in causally challenging scenes. Removing the GT trajectory eliminates this shortcut, but open-ended trajectory generation entangles high-level decision-making with precise geometric synthesis and low-level dynamics. To make trajectory-level driving decisions verifiable without requiring open-ended trajectory synthesis, we introduce Autonomous-Driving Multiple-Choice Question (AD-MCQ), which casts planning as selection among explicit trajectory candidates. Taking this a step further, we propose Deferred Exposure of Future Trajectories for RLVR (DEFT-RLVR) to transform future trajectories from pre-decision anchors into post-decision verification targets. Experimental results show that DEFT-RLVR improves AD reasoning while preserving or even enhancing general visual capabilities. With VLM-only inference and controllable difficulty through candidate construction, AD-MCQ provides a flexible, scalable, and extensible foundation for future research on verifiable AD reasoning.", "arxiv_id": "2608.01755", "arxiv_url": "https://arxiv.org/abs/2608.01755", "authors": ["Zixuan Huang", "Yang Zhou", "Kaixuan Wang", "Guli Zhang", "Hongyan Xie", "Yakun Zhu", "Hao Geng", "Yikun Ban", "Deqing Wang"], "brief": "\u8bba\u6587\u6307\u51fa\u81ea\u52a8\u9a7e\u9a76VLM\u7684CoT\u6807\u6ce8\u82e5\u63d0\u524d\u770b\u5230\u771f\u5b9e\u672a\u6765\u8f68\u8ff9\uff0c\u4f1a\u4ea7\u751f\u201c\u8f68\u8ff9\u951a\u5b9a\u504f\u7f6e\u201d\uff0c\u5bfc\u81f4\u4e8b\u540e\u5408\u7406\u5316\u548c\u5e7b\u89c9\u3002\u4f5c\u8005\u63d0\u51faAD-MCQ\u591a\u9009\u5f0f\u8f68\u8ff9\u51b3\u7b56\u4efb\u52a1\uff0c\u5e76\u7528DEFT-RLVR\u5c06\u672a\u6765\u8f68\u8ff9\u4ece\u51b3\u7b56\u524d\u63d0\u793a\u6539\u4e3a\u51b3\u7b56\u540e\u9a8c\u8bc1\u76ee\u6807\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/hzx122/DEFT-RLVR", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01755", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u6559\u5e08\u6a21\u578b\u66b4\u9732\u4e8e\u771f\u5b9e\u672a\u6765\u8f68\u8ff9\u4f1a\u524a\u5f31\u56e0\u679c\u5fe0\u5b9e\u6027\uff0c\u5728\u590d\u6742\u56e0\u679c\u573a\u666f\u4e2d\u663e\u8457\u589e\u52a0\u5e7b\u89c9", "AD-MCQ\u5c06\u89c4\u5212\u8f6c\u5316\u4e3a\u5728\u663e\u5f0f\u5019\u9009\u8f68\u8ff9\u4e2d\u9009\u62e9\uff0c\u907f\u514d\u5f00\u653e\u5f0f\u751f\u6210\u8f68\u8ff9\u5e26\u6765\u7684\u51e0\u4f55\u4e0e\u52a8\u529b\u5b66\u6df7\u6dc6", "DEFT-RLVR\u901a\u8fc7\u5ef6\u8fdf\u66b4\u9732\u672a\u6765\u8f68\u8ff9\u8fdb\u884c\u53ef\u9a8c\u8bc1\u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347\u81ea\u52a8\u9a7e\u9a76\u63a8\u7406\u4e14\u4fdd\u6301\u901a\u7528\u89c6\u89c9\u80fd\u529b"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u53ef\u9a8c\u8bc1\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "beihang university", "pdf_url": "https://arxiv.org/pdf/2608.01755v1", "published_at": "2026-08-03", "score": 0.205, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01755.png", "title": "Deferred Exposure of Future Trajectories for Verifiable Reasoning in Autonomous Driving VLMs", "tldr": "\u63a8\u8fdf\u66b4\u9732\u672a\u6765\u8f68\u8ff9\uff0c\u51cf\u5c11\u81ea\u52a8\u9a7e\u9a76\u63a8\u7406\u504f\u7f6e", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u81ea\u52a8\u9a7e\u9a76VLM\u7684CoT\u6807\u6ce8\u82e5\u63d0\u524d\u770b\u5230\u771f\u5b9e\u672a\u6765\u8f68\u8ff9\uff0c\u4f1a\u4ea7\u751f\u201c\u8f68\u8ff9\u951a\u5b9a\u504f\u7f6e\u201d\uff0c\u5bfc\u81f4\u4e8b\u540e\u5408\u7406\u5316\u548c\u5e7b\u89c9\u3002\u4f5c\u8005\u63d0\u51faAD-MCQ\u591a\u9009\u5f0f\u8f68\u8ff9\u51b3\u7b56\u4efb\u52a1\uff0c\u5e76\u7528DEFT-RLVR\u5c06\u672a\u6765\u8f68\u8ff9\u4ece\u51b3\u7b56\u524d\u63d0\u793a\u6539\u4e3a\u51b3\u7b56\u540e\u9a8c\u8bc1\u76ee\u6807\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u81ea\u52a8\u9a7e\u9a76VLM\u6570\u636e\u6807\u6ce8\u4e2d\u7684\u5173\u952e\u6cc4\u6f0f\u95ee\u9898\uff0c\u5e76\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u3001\u53ef\u6269\u5c55\u7684\u8f68\u8ff9\u51b3\u7b56\u8bad\u7ec3\u8303\u5f0f\uff0c\u6709\u52a9\u4e8e\u6784\u5efa\u66f4\u53ef\u4fe1\u7684\u81ea\u52a8\u9a7e\u9a76\u63a8\u7406\u6a21\u578b\u3002"}, {"abstract": "Tool-using language-model agents are governed not only by task prompts but also by persistent system-side instructions that specify tools, arguments, policies, execution protocols, and recovery. Compressing these agent control contexts (ACCs) can reduce input cost and context use, yet existing prompt-compression evaluations do not reveal whether the resulting control remains operationally reliable. We introduce CompressAgent, an environment-verified benchmark for ACC compression across nine independently constructed ACCs, three task families, three fixed Qwen API model identifiers, six retained-context budgets, and 15,525 runs. We uncover a nonlinear, method-dependent reliability frontier. At 75% retained context, generic rewriting and section-based compression achieve 92.7% and 92.4% success, close to the 93.8% full-context baseline. Between 50% and 35%, methods diverge sharply; at 35%, section-based, obligation-aware, and generic rewriting achieve 47.0%, 39.0%, and 19.9%. At retained-context budgets from 25% to 10%, executable protocols become fragile. Reliability also varies substantially across ACCs, making universal compressor rankings inappropriate and motivating per-context qualification. Failure analysis shows that compression primarily surfaces as tool-execution and action-parsing errors. These findings recast ACC compression from token reduction into a runtime-reliability problem that must be evaluated through executable outcomes.", "arxiv_id": "2608.01056", "arxiv_url": "https://arxiv.org/abs/2608.01056", "authors": ["Yinghan Hou", "Zongyou Yang"], "brief": "\u8bba\u6587\u63d0\u51fa CompressAgent\uff0c\u4e00\u4e2a\u901a\u8fc7\u73af\u5883\u6267\u884c\u7ed3\u679c\u9a8c\u8bc1\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u8c03\u7528\u578b\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u63a7\u5236\u4e0a\u4e0b\u6587\u538b\u7f29\u3002\u5b83\u8986\u76d69\u4e2a\u72ec\u7acbACC\u30013\u7c7b\u4efb\u52a1\u30013\u4e2aQwen API\u6a21\u578b\u30016\u6863\u4fdd\u7559\u4e0a\u4e0b\u6587\u9884\u7b97\uff0c\u517115,525\u6b21\u8fd0\u884c\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01056", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u53d1\u73b0ACC\u538b\u7f29\u5b58\u5728\u975e\u7ebf\u6027\u4e14\u4f9d\u8d56\u65b9\u6cd5\u7684\u53ef\u9760\u6027\u524d\u6cbf\uff1a75%\u4fdd\u7559\u4e0a\u4e0b\u6587\u65f6\u63a5\u8fd1\u5168\u4e0a\u4e0b\u6587\u57fa\u7ebf\uff0c50%\u523035%\u4e4b\u95f4\u6027\u80fd\u6025\u5267\u5206\u5316\u3002", "\u572835%\u4fdd\u7559\u9884\u7b97\u4e0b\uff0csection-based\u3001obligation-aware\u3001generic rewriting\u6210\u529f\u7387\u5206\u522b\u4e3a47.0%\u300139.0%\u300119.9%\uff1b25%\u523010%\u65f6\u53ef\u6267\u884c\u534f\u8bae\u660e\u663e\u8106\u5f31\u3002", "\u5931\u8d25\u4e3b\u8981\u8868\u73b0\u4e3a\u5de5\u5177\u6267\u884c\u9519\u8bef\u548c\u52a8\u4f5c\u89e3\u6790\u9519\u8bef\uff0c\u4e14\u4e0d\u540cACC\u4e4b\u95f4\u53ef\u9760\u6027\u5dee\u5f02\u663e\u8457\uff0c\u4e0d\u80fd\u7b80\u5355\u7ed9\u51fa\u901a\u7528\u538b\u7f29\u5668\u6392\u540d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u63d0\u793a\u538b\u7f29", "\u53ef\u9760\u6027\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01056v1", "published_at": "2026-08-02", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Control Under Compression: Reliability Frontiers for Tool-Using Agents", "tldr": "\u8bc4\u6d4b\u5de5\u5177\u667a\u80fd\u4f53\u63a7\u5236\u4e0a\u4e0b\u6587\u538b\u7f29\u7684\u53ef\u9760\u6027\u8fb9\u754c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CompressAgent\uff0c\u4e00\u4e2a\u901a\u8fc7\u73af\u5883\u6267\u884c\u7ed3\u679c\u9a8c\u8bc1\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u8c03\u7528\u578b\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u63a7\u5236\u4e0a\u4e0b\u6587\u538b\u7f29\u3002\u5b83\u8986\u76d69\u4e2a\u72ec\u7acbACC\u30013\u7c7b\u4efb\u52a1\u30013\u4e2aQwen API\u6a21\u578b\u30016\u6863\u4fdd\u7559\u4e0a\u4e0b\u6587\u9884\u7b97\uff0c\u517115,525\u6b21\u8fd0\u884c\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u63d0\u793a\u538b\u7f29\u4ece\u5355\u7eaf\u8282\u7701token\u7684\u95ee\u9898\uff0c\u91cd\u65b0\u5b9a\u4e49\u4e3a\u5de5\u5177\u667a\u80fd\u4f53\u8fd0\u884c\u53ef\u9760\u6027\u95ee\u9898\uff0c\u5f3a\u8c03\u5fc5\u987b\u7528\u53ef\u6267\u884c\u4efb\u52a1\u7ed3\u679c\u800c\u975e\u6587\u672c\u76f8\u4f3c\u5ea6\u6216\u9759\u6001\u6307\u6807\u8bc4\u4f30\u538b\u7f29\u6548\u679c\uff0c\u5bf9\u4f4e\u6210\u672c\u90e8\u7f72LLM agent\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "World models have attracted significant attention for their ability to capture and predict the structure and dynamics of the physical world. In this emerging landscape, Joint Embedding Predictive Architectures (JEPA) offer a particularly compelling direction. We study a largely unexplored regime: populous, crowded, and chaotic Global South urban environments, which we call DENSEWORLD. Unlike the lower-density, lane-structured settings that dominate existing evaluations, these scenes exhibit soft spatial boundaries, extreme agent heterogeneity, persistent occlusion, and rapid social negotiation under mixed traffic. We introduce the first large-scale dataset for this regime: 1,000 hours of drive-through, walk-through, and aerial video across 22 cities. Existing JEPA formulations struggle to preserve dense interaction dynamics under heterogeneity and partial observability. We introduce FactorJEPA, which makes world structure a first-class predictive primitive. Rather than encoding the future in a monolithic latent, it composes layout, entities, and interactions, using a visibility gate and separated subspaces to preserve partially observed agents and discourage cross-factor shortcuts. FactorJEPA improves (i) future-latent accuracy (Future-frame L1), (ii) intervention-sensitive prediction (Causal L1), and (iii) robustness to reduced visual evidence (Mask-ratio slope), while exposing (iv) a reproducible motion-information trade-off (Motion cosine). Method rankings replicate across 2B and 1B V-JEPA 2.1 backbones, with rho = 0.895 to 0.978. We publicly release the DENSEWORLD-115k dataset (https://huggingface.co/datasets/anonymousML123/denseworld-115k) and the surgery-trained FactorJEPA checkpoints (https://huggingface.co/datasets/anonymousML123/factorjepa-outputs/tree/main/outputs/full/vjepa_2_1_vitg_1B/train/m09c_surgery_3stage_DI_diheavy_encoder).", "arxiv_id": "2608.01049", "arxiv_url": "https://arxiv.org/abs/2608.01049", "authors": ["Kapil Wanaskar", "Gaytri Jena", "Aman Chadha", "Vinija Jain", "Vasu Sharma", "Amitava Das"], "brief": "\u8bba\u6587\u63d0\u51faDENSEWORLD\uff1a\u8986\u76d622\u5ea7\u5168\u7403\u5357\u65b9\u57ce\u5e02\u30011000\u5c0f\u65f6\u591a\u89c6\u89d2\u89c6\u9891\u7684\u5927\u89c4\u6a21\u62e5\u6324\u57ce\u5e02\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51faFactorJEPA\uff0c\u5c06\u672a\u6765\u8868\u5f81\u5206\u89e3\u4e3a\u5e03\u5c40\u3001\u5b9e\u4f53\u4e0e\u4ea4\u4e92\u4e09\u7c7b\u901a\u9053\u6765\u9884\u6d4b\u590d\u6742\u57ce\u5e02\u52a8\u6001\u3002", "categories": ["cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01049", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u6df7\u884c\u4ea4\u901a\u3001\u906e\u6321\u4e25\u91cd\u3001\u8fb9\u754c\u6a21\u7cca\u3001\u4e3b\u4f53\u5f02\u8d28\u6027\u5f3a\u7684\u9ad8\u5bc6\u5ea6\u57ce\u5e02\u73af\u5883\uff0c\u5f25\u8865\u73b0\u6709\u4f4e\u5bc6\u5ea6\u8f66\u9053\u5316\u8bc4\u6d4b\u4e0d\u8db3\u3002", "FactorJEPA\u901a\u8fc7\u53ef\u89c1\u6027\u95e8\u63a7\u4e0e\u5206\u79bb\u5b50\u7a7a\u95f4\u4fdd\u7559\u90e8\u5206\u53ef\u89c2\u6d4b\u4e3b\u4f53\uff0c\u51cf\u5c11\u4e0d\u540c\u56e0\u5b50\u95f4\u7684\u6377\u5f84\u5b66\u4e60\u3002", "\u5728\u672a\u6765\u6f5c\u53d8\u91cf\u7cbe\u5ea6\u3001\u5e72\u9884\u654f\u611f\u9884\u6d4b\u3001\u5f31\u89c6\u89c9\u8bc1\u636e\u9c81\u68d2\u6027\u7b49\u6307\u6807\u4e0a\u4f18\u4e8e\u73b0\u6709JEPA\uff0c\u5e76\u57281B/2B V-JEPA 2.1\u9aa8\u5e72\u4e0a\u590d\u73b0\u7a33\u5b9a\u6392\u5e8f\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u7406\u89e3", "\u57ce\u5e02\u4ea4\u901a", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01049v1", "published_at": "2026-08-02", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FactorJEPA: Factorizing Monolithic Futures into Layout-Agent-Interaction Channels for Crowded and Chaotic Global South Urban Worlds", "tldr": "\u9762\u5411\u62e5\u6324\u57ce\u5e02\u7684\u56e0\u5b50\u5316JEPA\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faDENSEWORLD\uff1a\u8986\u76d622\u5ea7\u5168\u7403\u5357\u65b9\u57ce\u5e02\u30011000\u5c0f\u65f6\u591a\u89c6\u89d2\u89c6\u9891\u7684\u5927\u89c4\u6a21\u62e5\u6324\u57ce\u5e02\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51faFactorJEPA\uff0c\u5c06\u672a\u6765\u8868\u5f81\u5206\u89e3\u4e3a\u5e03\u5c40\u3001\u5b9e\u4f53\u4e0e\u4ea4\u4e92\u4e09\u7c7b\u901a\u9053\u6765\u9884\u6d4b\u590d\u6742\u57ce\u5e02\u52a8\u6001\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e16\u754c\u6a21\u578b\u8bc4\u6d4b\u6269\u5c55\u5230\u66f4\u771f\u5b9e\u3001\u66f4\u6df7\u4e71\u7684\u5168\u7403\u5357\u65b9\u57ce\u5e02\u4ea4\u901a\u573a\u666f\uff0c\u5e76\u8bc1\u660e\u7ed3\u6784\u5316\u56e0\u5b50\u5206\u89e3\u6709\u52a9\u4e8e\u6355\u6349\u5bc6\u96c6\u4ea4\u4e92\u52a8\u6001\uff1b\u516c\u5f00\u6570\u636e\u96c6\u548c\u68c0\u67e5\u70b9\u4e5f\u6709\u8f83\u9ad8\u590d\u7528\u4ef7\u503c\u3002"}, {"abstract": "Enterprise AI agents act across many apps whose data changes continuously, so an answer is correct only relative to what data existed and who could see it at the moment it was asked. Offline evaluation today grades against a single static snapshot, effectively the end of the episode. So, it can only evaluate one situation, the final one, even though every earlier moment of the episode is a different situation that invites its own realistic questions with its own correct answers. Recreating each of those moments as a separate snapshot would mean re-provisioning a whole tenant per instant, which is prohibitively costly; and even a single snapshot leaks future state hidden inside records and cannot represent the multi-app, time-ordered way real work happens. Our system closes two gaps at once: it generates a realistic, persona-driven, temporally-evolving enterprise world from real research, and replays that world at any chosen moment to evaluate any pluggable agent. A schema-inferred temporal description drives a deterministic-plus-LLM rebuild of each record\u0027s past state; because the queryable moments are finite, all rebuilds are precomputed into a compact difference cache, making evaluation a fast, reproducible lookup with no model in the path. We describe the design, an architecture spanning both flows, and early experience evaluating enterprise agents.", "arxiv_id": "2608.01042", "arxiv_url": "https://arxiv.org/abs/2608.01042", "authors": ["Tezan Sahu", "Himani Arora"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u4ece\u771f\u5b9e\u7814\u7a76\u751f\u6210\u89d2\u8272\u9a71\u52a8\u3001\u968f\u65f6\u95f4\u6f14\u5316\u7684\u4f01\u4e1a\u573a\u666f\u7cfb\u7edf\uff0c\u5e76\u80fd\u5728\u4efb\u610f\u6307\u5b9a\u65f6\u523b\u91cd\u653e\u591a\u5e94\u7528\u6570\u636e\u72b6\u6001\uff0c\u7528\u4e8e\u8bc4\u6d4b\u53ef\u63d2\u62d4\u4f01\u4e1a AI \u667a\u80fd\u4f53\u3002\u5b83\u89e3\u51b3\u4e86\u9759\u6001\u5feb\u7167\u8bc4\u6d4b\u65e0\u6cd5\u53cd\u6620\u201c\u5f53\u65f6\u53ef\u89c1\u4fe1\u606f\u201d\u548c\u6743\u9650\u8fb9\u754c\u7684\u95ee\u9898\u3002", "categories": ["cs.SE", "cs.AI", "cs.HC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01042", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u901a\u8fc7\u6a21\u5f0f\u63a8\u65ad\u7684\u65f6\u95f4\u63cf\u8ff0\uff0c\u91cd\u5efa\u6bcf\u6761\u8bb0\u5f55\u5728\u5386\u53f2\u65f6\u523b\u7684\u72b6\u6001\uff0c\u523b\u753b\u591a\u5e94\u7528\u3001\u6309\u65f6\u95f4\u63a8\u8fdb\u7684\u771f\u5b9e\u5de5\u4f5c\u6d41\u3002", "\u91c7\u7528\u786e\u5b9a\u6027\u903b\u8f91\u52a0 LLM \u7684\u65b9\u5f0f\u751f\u6210\u548c\u91cd\u5efa\u4f01\u4e1a\u4e16\u754c\uff0c\u4f46\u5728\u5b9e\u9645\u8bc4\u6d4b\u67e5\u8be2\u65f6\u9884\u8ba1\u7b97\u4e3a\u7d27\u51d1\u5dee\u5206\u7f13\u5b58\uff0c\u907f\u514d\u6a21\u578b\u4ecb\u5165\u3002", "\u652f\u6301\u5728\u6709\u9650\u53ef\u67e5\u8be2\u65f6\u523b\u8fdb\u884c\u5feb\u901f\u3001\u53ef\u590d\u73b0\u7684\u67e5\u627e\u5f0f\u8bc4\u6d4b\uff0c\u7b54\u6848\u4f9d\u636e\u5f53\u65f6\u6570\u636e\u4e0e\u7528\u6237\u53ef\u89c1\u6743\u9650\u5224\u5b9a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4f01\u4e1a\u5e94\u7528", "\u8bc4\u6d4b\u57fa\u51c6", "\u65f6\u95f4\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01042v1", "published_at": "2026-08-02", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "What Could the Agent See at 19:05? Generating Temporal Enterprise Scenarios from Real Research and Replaying Them to Evaluate Agents", "tldr": "\u53ef\u91cd\u653e\u4efb\u610f\u65f6\u523b\u7684\u4f01\u4e1a\u667a\u80fd\u4f53\u8bc4\u6d4b\u73af\u5883", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u4ece\u771f\u5b9e\u7814\u7a76\u751f\u6210\u89d2\u8272\u9a71\u52a8\u3001\u968f\u65f6\u95f4\u6f14\u5316\u7684\u4f01\u4e1a\u573a\u666f\u7cfb\u7edf\uff0c\u5e76\u80fd\u5728\u4efb\u610f\u6307\u5b9a\u65f6\u523b\u91cd\u653e\u591a\u5e94\u7528\u6570\u636e\u72b6\u6001\uff0c\u7528\u4e8e\u8bc4\u6d4b\u53ef\u63d2\u62d4\u4f01\u4e1a AI \u667a\u80fd\u4f53\u3002\u5b83\u89e3\u51b3\u4e86\u9759\u6001\u5feb\u7167\u8bc4\u6d4b\u65e0\u6cd5\u53cd\u6620\u201c\u5f53\u65f6\u53ef\u89c1\u4fe1\u606f\u201d\u548c\u6743\u9650\u8fb9\u754c\u7684\u95ee\u9898\u3002", "why_notable": "\u4f01\u4e1a\u667a\u80fd\u4f53\u8bc4\u6d4b\u957f\u671f\u53d7\u9650\u4e8e\u5355\u4e00\u9759\u6001\u5feb\u7167\uff0c\u5bb9\u6613\u6cc4\u9732\u672a\u6765\u4fe1\u606f\u4e14\u65e0\u6cd5\u8861\u91cf\u65f6\u95f4\u654f\u611f\u4efb\u52a1\u3002\u8be5\u5de5\u4f5c\u628a\u65f6\u95f4\u3001\u6743\u9650\u548c\u591a\u5e94\u7528\u72b6\u6001\u7eb3\u5165\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5bf9\u771f\u5b9e\u4f01\u4e1a\u573a\u666f\u4e2d\u7684 LLM agent \u53ef\u9760\u6027\u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language-Action (VLA) models have emerged as a prominent paradigm for end-to-end autonomous driving; however, their efficient deployment is severely constrained by high computational latency and exposure bias arising from sequential autoregressive decoding. Conversely, while specialized diffusion policies enable low-latency, parallel execution, training them from scratch typically yields narrow, single-task architectures that lack holistic visual-linguistic reasoning. Successfully transforming pre-trained autoregressive generalists into parallel diffusion models could combine multi-task cognitive intelligence with execution efficiency, yet this transition presents a formidable architectural challenge due to mismatched attention patterns (causal versus bidirectional) and divergent optimization objectives. To bridge this divide, we introduce WAM-Diff2, a multi-task discrete diffusion VLA framework powered by a three-stage hierarchical distillation strategy. By structuring the architectural shift through progressive block-wise adaptation, block-wise distillation, and model-wise cross-scale distillation, WAM-Diff2 preserves the underlying semantic foundations of the base model while accelerating inference. Extensive evaluations across driving understanding, perception, and planning benchmarks demonstrate that WAM-Diff2 effectively mitigates exposure bias and achieves performance parity with autoregressive baselines. Crucially, the autoregressive-to-diffusion transition yields a 2.8x decoding speedup, which scales to an ultimate 15.1x acceleration when combined with system-level optimizations including FlashInfer and CUDA Graphs.", "arxiv_id": "2608.01035", "arxiv_url": "https://arxiv.org/abs/2608.01035", "authors": ["Zhihao Zhu", "Hanlin Shang", "Mingwang Xu", "Feipeng Cai", "Zhuolin He", "Yaoyi Li", "Jianhua Han", "Hang Xu", "Siyu Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa WAM-Diff2\uff0c\u4e00\u4e2a\u591a\u4efb\u52a1\u79bb\u6563\u6269\u6563\u5f0f\u81ea\u52a8\u9a7e\u9a76 VLA \u6846\u67b6\uff0c\u901a\u8fc7\u5206\u5c42\u84b8\u998f\u628a\u9884\u8bad\u7ec3\u81ea\u56de\u5f52\u901a\u7528\u6a21\u578b\u8f6c\u6362\u4e3a\u5e76\u884c\u6269\u6563\u7b56\u7565\u3002\u5b83\u5728\u4fdd\u7559\u89c6\u89c9-\u8bed\u8a00\u63a8\u7406\u80fd\u529b\u7684\u540c\u65f6\uff0c\u964d\u4f4e\u81ea\u56de\u5f52\u89e3\u7801\u5ef6\u8fdf\u4e0e\u66dd\u5149\u504f\u5dee\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01035", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u4e09\u9636\u6bb5\u5206\u5c42\u84b8\u998f\uff1a\u9010\u5757\u9002\u914d\u3001\u9010\u5757\u84b8\u998f\u3001\u6a21\u578b\u7ea7\u8de8\u5c3a\u5ea6\u84b8\u998f\uff0c\u7f13\u89e3\u56e0\u679c\u6ce8\u610f\u529b\u5230\u53cc\u5411\u6ce8\u610f\u529b\u7684\u67b6\u6784\u8fc1\u79fb\u96be\u9898", "\u5728\u9a7e\u9a76\u7406\u89e3\u3001\u611f\u77e5\u4e0e\u89c4\u5212\u57fa\u51c6\u4e0a\u8fbe\u5230\u4e0e\u81ea\u56de\u5f52\u57fa\u7ebf\u76f8\u5f53\u7684\u6027\u80fd\uff0c\u5e76\u51cf\u8f7b\u987a\u5e8f\u89e3\u7801\u5e26\u6765\u7684\u66dd\u5149\u504f\u5dee", "AR \u5230\u6269\u6563\u8f6c\u6362\u5e26\u6765 2.8 \u500d\u89e3\u7801\u52a0\u901f\uff0c\u7ed3\u5408 FlashInfer \u4e0e CUDA Graphs \u7b49\u7cfb\u7edf\u4f18\u5316\u540e\u6700\u9ad8\u8fbe 15.1 \u500d"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "VLA", "\u6269\u6563\u6a21\u578b", "\u6a21\u578b\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01035v1", "published_at": "2026-08-02", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WAM-Diff2: Hierarchical AR-to-Diffusion Distillation for Highly Efficient Autonomous Driving VLA", "tldr": "\u5c06\u81ea\u52a8\u9a7e\u9a76AR-VLA\u9ad8\u6548\u84b8\u998f\u4e3a\u6269\u6563\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa WAM-Diff2\uff0c\u4e00\u4e2a\u591a\u4efb\u52a1\u79bb\u6563\u6269\u6563\u5f0f\u81ea\u52a8\u9a7e\u9a76 VLA \u6846\u67b6\uff0c\u901a\u8fc7\u5206\u5c42\u84b8\u998f\u628a\u9884\u8bad\u7ec3\u81ea\u56de\u5f52\u901a\u7528\u6a21\u578b\u8f6c\u6362\u4e3a\u5e76\u884c\u6269\u6563\u7b56\u7565\u3002\u5b83\u5728\u4fdd\u7559\u89c6\u89c9-\u8bed\u8a00\u63a8\u7406\u80fd\u529b\u7684\u540c\u65f6\uff0c\u964d\u4f4e\u81ea\u56de\u5f52\u89e3\u7801\u5ef6\u8fdf\u4e0e\u66dd\u5149\u504f\u5dee\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c1d\u8bd5\u628a\u81ea\u56de\u5f52 VLA \u7684\u901a\u7528\u591a\u4efb\u52a1\u8ba4\u77e5\u80fd\u529b\u4e0e\u6269\u6563\u7b56\u7565\u7684\u5e76\u884c\u4f4e\u5ef6\u8fdf\u6267\u884c\u7ed3\u5408\u8d77\u6765\uff0c\u5bf9\u7aef\u5230\u7aef\u81ea\u52a8\u9a7e\u9a76\u6a21\u578b\u7684\u5b9e\u65f6\u90e8\u7f72\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Deploying Vision-Language-Action (VLA) robots as mobile edge nodes within wireless sensor networks (WSNs) requires robust protection against physical adversarial threats. We present VLAGuard, a framework to assess and mitigate a critical vulnerability: policy-critical action-to-vision attention hijacking. We first introduce a stress-test module, Visuomotor Attention-guided Semantic Attack (VASA), using printable patches to severely distract the robot\u0027s action-conditioned cross-attention. To counter this, we propose Attention-Protective Fine-Tuning (APFT), a defense that stabilizes spatiotemporal attention and enforces geometric consistency with zero inference overhead. Evaluations across simulated and physical WSN-assisted smart environments demonstrate significant robustness gains. APFT reduces the OpenVLA failure rate from 100.0% to 25.9% in LIBERO simulations. Furthermore, across 2,000 real-world trials, APFT improves the average success rate from 23.0% to 67.4% under severe patch attacks. This highlights that protecting attention pathways is important for improving the robustness of VLA-driven edge nodes in sensor networks.", "arxiv_id": "2608.01028", "arxiv_url": "https://arxiv.org/abs/2608.01028", "authors": ["Dongfu Yin", "Jinquan Zhang"], "brief": "\u8bba\u6587\u63d0\u51faVLAGuard\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5e76\u7f13\u89e3VLA\u673a\u5668\u4eba\u5728\u65e0\u7ebf\u4f20\u611f\u7f51\u7edc\u667a\u80fd\u73af\u5883\u4e2d\u7684\u7269\u7406\u6ce8\u610f\u529b\u52ab\u6301\u98ce\u9669\u3002\u5176\u653b\u51fb\u6a21\u5757VASA\u7528\u53ef\u6253\u5370\u8d34\u7247\u5e72\u6270\u52a8\u4f5c\u6761\u4ef6\u89c6\u89c9\u6ce8\u610f\u529b\uff0c\u9632\u5fa1\u65b9\u6cd5APFT\u901a\u8fc7\u5fae\u8c03\u7a33\u5b9a\u65f6\u7a7a\u6ce8\u610f\u529b\u5e76\u7ea6\u675f\u51e0\u4f55\u4e00\u81f4\u6027\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01028", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u51faVASA\u538b\u529b\u6d4b\u8bd5\uff1a\u5229\u7528\u53ef\u6253\u5370\u8bed\u4e49\u8d34\u7247\u52ab\u6301\u673a\u5668\u4ebaaction-to-vision\u4ea4\u53c9\u6ce8\u610f\u529b\uff0c\u663e\u8457\u8bf1\u5bfc\u7b56\u7565\u5931\u8d25", "\u63d0\u51faAPFT\u9632\u5fa1\uff1a\u5728\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u7684\u60c5\u51b5\u4e0b\u7a33\u5b9a\u65f6\u7a7a\u6ce8\u610f\u529b\uff0c\u5e76\u5f3a\u5316\u89c6\u89c9-\u52a8\u4f5c\u51e0\u4f55\u4e00\u81f4\u6027", "\u5b9e\u9a8c\u663e\u793a\u9c81\u68d2\u6027\u5927\u5e45\u63d0\u5347\uff1aLIBERO\u4e2dOpenVLA\u5931\u8d25\u7387\u7531100.0%\u964d\u81f325.9%\uff0c2000\u6b21\u771f\u5b9e\u8bd5\u9a8c\u4e2d\u653b\u51fb\u4e0b\u6210\u529f\u7387\u753123.0%\u5347\u81f367.4%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u5b89\u5168", "\u591a\u6a21\u6001", "\u5bf9\u6297\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01028v1", "published_at": "2026-08-02", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "VLAGuard: A Framework for Evaluating and Mitigating Physical Attention Hijacking in Vision-Language-Action Robots within Wireless Sensor Networks", "tldr": "VLAGuard\u9632\u62a4VLA\u673a\u5668\u4eba\u6ce8\u610f\u529b\u52ab\u6301", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faVLAGuard\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5e76\u7f13\u89e3VLA\u673a\u5668\u4eba\u5728\u65e0\u7ebf\u4f20\u611f\u7f51\u7edc\u667a\u80fd\u73af\u5883\u4e2d\u7684\u7269\u7406\u6ce8\u610f\u529b\u52ab\u6301\u98ce\u9669\u3002\u5176\u653b\u51fb\u6a21\u5757VASA\u7528\u53ef\u6253\u5370\u8d34\u7247\u5e72\u6270\u52a8\u4f5c\u6761\u4ef6\u89c6\u89c9\u6ce8\u610f\u529b\uff0c\u9632\u5fa1\u65b9\u6cd5APFT\u901a\u8fc7\u5fae\u8c03\u7a33\u5b9a\u65f6\u7a7a\u6ce8\u610f\u529b\u5e76\u7ea6\u675f\u51e0\u4f55\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126VLA\u673a\u5668\u4eba\u5728\u771f\u5b9e\u7269\u7406\u73af\u5883\u4e2d\u7684\u5173\u952e\u5b89\u5168\u6f0f\u6d1e\uff0c\u8bc1\u660e\u6ce8\u610f\u529b\u901a\u8def\u53ef\u88ab\u53ef\u6253\u5370\u8d34\u7247\u7cfb\u7edf\u6027\u52ab\u6301\uff0c\u5e76\u7ed9\u51fa\u96f6\u63a8\u7406\u5f00\u9500\u7684\u6709\u6548\u9632\u5fa1\u65b9\u6848\uff0c\u5bf9\u8fb9\u7f18\u673a\u5668\u4eba\u548c\u667a\u80fd\u73af\u5883\u90e8\u7f72\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "As large language models (LLMs) continue to advance in complex reasoning tasks, they have learned to heavily prioritize explicit conditions provided in the input. However, in everyday commonsense reasoning, this mechanism exposes a critical vulnerability which we term Salience Bias: models become easily hijacked by useless explicit distractors (e.g., numerical values), leading them to ignore the implicit physical or commonsense prerequisites of a task. A critical open question is whether this failure reflects a genuine gap in commonsense knowledge or merely its suppression under misleading task framing. To investigate this, we construct the SaliTrap Benchmark, a high-quality dataset across four trap dimensions. Evaluating 12 state-of-the-art LLMs, we find that all mainstream models suffer significantly from salience bias, with severity scaling with distractor density and detecting the trap often decoupled from actually avoiding it. Crucially, by re-eliciting the same models with the task framing stripped away, we show that this is overwhelmingly a failure of \\textbf{knowledge suppression rather than knowledge absence}: a context-free knowledge probe alone recovers over 90\\% of sycophantic-compliance failures, revealing that the requisite commonsense is intrinsically present but actively crowded out by salient distractors that lure the model into over-compliant, unnecessary computation. Building on this diagnosis, we further show that lightweight, inference-time prompting alone substantially closes the gap without any retraining. Our findings relocate the bottleneck of commonsense reasoning failures from model competence to elicitation, and we release SaliTrap as a testbed for this blind spot. The codes are available at https://github.com/Wuzheng02/SaliTrap.", "arxiv_id": "2607.28478", "arxiv_url": "https://arxiv.org/abs/2607.28478", "authors": ["Zheng Wu", "Chenhao Xue", "Shijie Zheng", "Yijie Lu", "Cheng Yang", "Zhuosheng Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u663e\u8457\u6027\u504f\u5dee\u201d\u6982\u5ff5\uff1aLLM\u5728\u5e38\u8bc6\u63a8\u7406\u4e2d\u4f1a\u8fc7\u5ea6\u5173\u6ce8\u8f93\u5165\u4e2d\u660e\u786e\u4f46\u65e0\u7528\u7684\u6761\u4ef6\uff0c\u5ffd\u7565\u9690\u542b\u7684\u7269\u7406\u6216\u5e38\u8bc6\u524d\u63d0\u3002\u4f5c\u8005\u6784\u5efaSaliTrap\u57fa\u51c6\uff0c\u8bc4\u6d4b12\u4e2a\u4e3b\u6d41LLM\u5e76\u5206\u6790\u5176\u5931\u8d25\u539f\u56e0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28478", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["SaliTrap\u8986\u76d6\u56db\u7c7b\u9677\u9631\u7ef4\u5ea6\uff0c\u7528\u4e8e\u6d4b\u8bd5\u6a21\u578b\u662f\u5426\u4f1a\u88ab\u6570\u5b57\u7b49\u663e\u5f0f\u5e72\u6270\u4fe1\u606f\u8bf1\u5bfc\u8fdb\u884c\u4e0d\u5fc5\u8981\u63a8\u7406\u3002", "12\u4e2a\u5148\u8fdbLLM\u5747\u663e\u8457\u53d7\u663e\u8457\u6027\u504f\u5dee\u5f71\u54cd\uff0c\u4e14\u504f\u5dee\u968f\u5e72\u6270\u9879\u5bc6\u5ea6\u589e\u52a0\u800c\u52a0\u91cd\u3002", "\u65e0\u4e0a\u4e0b\u6587\u77e5\u8bc6\u63a2\u6d4b\u53ef\u6062\u590d\u8d85\u8fc790%\u7684\u8fce\u5408\u5f0f\u9519\u8bef\uff0c\u8bf4\u660e\u95ee\u9898\u4e3b\u8981\u662f\u5e38\u8bc6\u88ab\u6291\u5236\u800c\u975e\u7f3a\u5931\uff1b\u8f7b\u91cf\u63a8\u7406\u65f6\u63d0\u793a\u53ef\u660e\u663e\u7f13\u89e3\u3002"], "keywords": ["\u5e38\u8bc6\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6", "\u63d0\u793a\u5de5\u7a0b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28478v1", "published_at": "2026-07-30", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28478.png", "title": "Would You Walk to the Car Wash? Revealing the Salience Bias of Large Language Models in Commonsense Reasoning", "tldr": "LLM\u5e38\u8bc6\u63a8\u7406\u6613\u88ab\u663e\u773c\u5e72\u6270\u9879\u5e26\u504f", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u663e\u8457\u6027\u504f\u5dee\u201d\u6982\u5ff5\uff1aLLM\u5728\u5e38\u8bc6\u63a8\u7406\u4e2d\u4f1a\u8fc7\u5ea6\u5173\u6ce8\u8f93\u5165\u4e2d\u660e\u786e\u4f46\u65e0\u7528\u7684\u6761\u4ef6\uff0c\u5ffd\u7565\u9690\u542b\u7684\u7269\u7406\u6216\u5e38\u8bc6\u524d\u63d0\u3002\u4f5c\u8005\u6784\u5efaSaliTrap\u57fa\u51c6\uff0c\u8bc4\u6d4b12\u4e2a\u4e3b\u6d41LLM\u5e76\u5206\u6790\u5176\u5931\u8d25\u539f\u56e0\u3002", "why_notable": "\u8be5\u7814\u7a76\u5c06\u90e8\u5206\u5e38\u8bc6\u63a8\u7406\u5931\u8d25\u7684\u6839\u56e0\u4ece\u201c\u6a21\u578b\u7f3a\u4e4f\u5e38\u8bc6\u201d\u8f6c\u5411\u201c\u4efb\u52a1\u8868\u8ff0\u5bfc\u81f4\u77e5\u8bc6\u63d0\u53d6\u5931\u8d25\u201d\uff0c\u4e3aLLM\u53ef\u9760\u6027\u8bc4\u6d4b\u548c\u63d0\u793a\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u65b0\u7684\u8bca\u65ad\u57fa\u51c6\u4e0e\u6539\u8fdb\u65b9\u5411\u3002"}, {"abstract": "Autonomous driving systems (ADS) are rapidly advancing and increasingly deployed in real-world applications. This creates growing demands for effective testing to ensure system functionality and safety. However, ADS testing remains complex and lacks well-established standards for scenario selection, performance evaluation, and acceptance criteria. To better understand current ADS testing practices and challenges, we conducted an interview study with experts working on ADS development and testing in nine companies from six different countries. Through thematic analysis, we synthesized industrial testing practices, challenges, potential solutions, future trends, and proposed an evidence-centered closed-loop testing framework for ADS testing. Our findings show that current practices primarily focus on scenario-based and X-in-the-loop testing approaches, supported by diverse tools, metrics, benchmarks, and testing strategies. The participants highlighted major challenges related to scenario realism, scenario coverage, simulation fidelity, and acceptance criteria, while also discussing potential solutions such as the use of AI, world models, and end-to-end approaches. Furthermore, participants envisioned future ADS testing to become more automated, data-driven, and transparent across the industry. Overall, this study provides a comprehensive industry-grounded overview of ADS testing, proposes an evidence-centered closed-loop testing framework to provide actionable guidance for ADS testing, and outlines important directions for future research and practice.", "arxiv_id": "2607.15820", "arxiv_url": "https://arxiv.org/abs/2607.15820", "authors": ["Qunying Song", "Yuan Gao", "Johannes Betz", "Dietmar Pfahl", "Mohammad Reza Mousavi", "Federica Sarro"], "brief": "\u672c\u6587\u57fa\u4e8e\u6765\u81ea\u516d\u4e2a\u56fd\u5bb6\u4e5d\u5bb6\u516c\u53f8\u7684\u81ea\u52a8\u9a7e\u9a76\u7cfb\u7edf\u5f00\u53d1\u4e0e\u6d4b\u8bd5\u4e13\u5bb6\u8bbf\u8c08\uff0c\u7cfb\u7edf\u68b3\u7406\u4e86\u5de5\u4e1a\u754cADS\u6d4b\u8bd5\u5b9e\u8df5\u3001\u75db\u70b9\u3001\u6f5c\u5728\u65b9\u6848\u4e0e\u672a\u6765\u8d8b\u52bf\u3002\u8bba\u6587\u8fdb\u4e00\u6b65\u63d0\u51fa\u4e86\u4e00\u4e2a\u4ee5\u8bc1\u636e\u4e3a\u4e2d\u5fc3\u7684\u95ed\u73af\u6d4b\u8bd5\u6846\u67b6\uff0c\u4e3a\u81ea\u52a8\u9a7e\u9a76\u6d4b\u8bd5\u63d0\u4f9b\u53ef\u64cd\u4f5c\u6307\u5bfc\u3002", "categories": ["cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.15820", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f53\u524d\u5de5\u4e1a\u5b9e\u8df5\u4e3b\u8981\u4f9d\u8d56\u57fa\u4e8e\u573a\u666f\u7684\u6d4b\u8bd5\u548cX-in-the-loop\u6d4b\u8bd5\uff0c\u5e76\u7ed3\u5408\u591a\u6837\u5316\u5de5\u5177\u3001\u6307\u6807\u3001\u57fa\u51c6\u4e0e\u6d4b\u8bd5\u7b56\u7565\u3002", "\u6838\u5fc3\u6311\u6218\u96c6\u4e2d\u5728\u573a\u666f\u771f\u5b9e\u6027\u3001\u573a\u666f\u8986\u76d6\u7387\u3001\u4eff\u771f\u4fdd\u771f\u5ea6\u548c\u9a8c\u6536\u6807\u51c6\u7f3a\u5931\u7b49\u65b9\u9762\u3002", "\u53d7\u8bbf\u8005\u8ba4\u4e3aAI\u3001\u4e16\u754c\u6a21\u578b\u3001\u7aef\u5230\u7aef\u65b9\u6cd5\u5c06\u63a8\u52a8ADS\u6d4b\u8bd5\u8d70\u5411\u66f4\u81ea\u52a8\u5316\u3001\u6570\u636e\u9a71\u52a8\u548c\u900f\u660e\u5316\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u4e16\u754c\u6a21\u578b", "\u5de5\u4e1a\u5b9e\u8df5"], "num_comments": 1, "on_hf": true, "organization": "TUM - Professorship of Autonomous Vehicle Systems", "pdf_url": "https://arxiv.org/pdf/2607.15820v1", "published_at": "2026-07-17", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.15820.png", "title": "In the Driver\u0027s Seat: A Multi-Company Study on the Reality of Autonomous Driving System Testing", "tldr": "\u4e5d\u4f01\u8bbf\u8c08\u63ed\u793a\u81ea\u52a8\u9a7e\u9a76\u6d4b\u8bd5\u73b0\u72b6\u4e0e\u6311\u6218", "upvotes": 1, "what_it_is": "\u672c\u6587\u57fa\u4e8e\u6765\u81ea\u516d\u4e2a\u56fd\u5bb6\u4e5d\u5bb6\u516c\u53f8\u7684\u81ea\u52a8\u9a7e\u9a76\u7cfb\u7edf\u5f00\u53d1\u4e0e\u6d4b\u8bd5\u4e13\u5bb6\u8bbf\u8c08\uff0c\u7cfb\u7edf\u68b3\u7406\u4e86\u5de5\u4e1a\u754cADS\u6d4b\u8bd5\u5b9e\u8df5\u3001\u75db\u70b9\u3001\u6f5c\u5728\u65b9\u6848\u4e0e\u672a\u6765\u8d8b\u52bf\u3002\u8bba\u6587\u8fdb\u4e00\u6b65\u63d0\u51fa\u4e86\u4e00\u4e2a\u4ee5\u8bc1\u636e\u4e3a\u4e2d\u5fc3\u7684\u95ed\u73af\u6d4b\u8bd5\u6846\u67b6\uff0c\u4e3a\u81ea\u52a8\u9a7e\u9a76\u6d4b\u8bd5\u63d0\u4f9b\u53ef\u64cd\u4f5c\u6307\u5bfc\u3002", "why_notable": "\u8fd9\u662f\u4e00\u9879\u591a\u516c\u53f8\u3001\u8de8\u56fd\u5bb6\u7684\u5b9e\u8bc1\u7814\u7a76\uff0c\u63d0\u4f9b\u4e86\u81ea\u52a8\u9a7e\u9a76\u6d4b\u8bd5\u5728\u771f\u5b9e\u5de5\u4e1a\u73af\u5883\u4e2d\u7684\u4e00\u624b\u89c6\u89d2\uff0c\u5e76\u5c06\u5206\u6563\u7ecf\u9a8c\u603b\u7ed3\u4e3a\u95ed\u73af\u6d4b\u8bd5\u6846\u67b6\uff0c\u5bf9\u7814\u7a76\u8005\u548c\u5de5\u7a0b\u56e2\u961f\u5236\u5b9a\u6d4b\u8bd5\u6807\u51c6\u4e0e\u5de5\u5177\u8def\u7ebf\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Autonomous multi-vehicle racing requires real-time planning of diverse competitive behaviors in intense interactions. Existing planners often struggle to balance strategic diversity and computational efficiency. To address this challenge, we propose Sampling-based Game-Theoretic Planning (SGTP), a real-time framework that combines game-theoretic reasoning with GPU-accelerated sampling of control sequences and dynamics rollouts. Sampled trajectories are ranked using a game-aware cost to capture competitive interactions and generate diverse racing behaviors. Our planner then performs feasibility selection by explicitly enforcing track-boundary and dynamic collision-avoidance constraints, ensuring safe and reliable transitions between racing strategies. Extensive simulations on challenging tracks show that SGTP achieves a 95.24% win rate and a 99.35% task-completion ratio in highly interactive races, with a mean computational time of 0.095 s over multiple iterative solving steps. We also demonstrate the successful application of SGTP in large-scale scenarios with up to 10 agents. We release our code and provide an open-source benchmark of multi-agent autonomous racing algorithms to facilitate future research. Project page: https://sgtp-racing.github.io/.", "arxiv_id": "2607.25388", "arxiv_url": "https://arxiv.org/abs/2607.25388", "authors": ["Zhouheng Li", "Fangguo Zhao", "Mattia Piccinini", "Baha Zarrouki", "Yuan Gao", "Zitong Shan", "Johannes Betz", "Chen Lv", "Lei Xie"], "brief": "\u8bba\u6587\u63d0\u51fa Sampling-based Game-Theoretic Planning\uff08SGTP\uff09\uff0c\u5c06\u535a\u5f08\u8bba\u63a8\u7406\u4e0eGPU\u52a0\u901f\u7684\u63a7\u5236\u5e8f\u5217\u91c7\u6837\u3001\u52a8\u529b\u5b66 rollout \u7ed3\u5408\uff0c\u7528\u4e8e\u5b9e\u65f6\u591a\u8f66\u81ea\u52a8\u9a7e\u9a76\u7ade\u901f\u89c4\u5212\u3002\u5b83\u901a\u8fc7\u535a\u5f08\u611f\u77e5\u4ee3\u4ef7\u751f\u6210\u591a\u6837\u5316\u7ade\u4e89\u7b56\u7565\uff0c\u5e76\u663e\u5f0f\u68c0\u67e5\u8d5b\u9053\u8fb9\u754c\u4e0e\u52a8\u6001\u78b0\u649e\u7ea6\u675f\u4ee5\u4fdd\u8bc1\u53ef\u884c\u6027\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/zhouhengli/SGTP-Racer", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2607.25388", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u91c7\u6837\u5f0f\u63a7\u5236\u5e8f\u5217\u548cGPU\u5e76\u884c\u52a8\u529b\u5b66 rollout \u63d0\u5347\u5b9e\u65f6\u6027\uff0c\u5e73\u5747\u591a\u8f6e\u6c42\u89e3\u65f6\u95f4\u4e3a0.095\u79d2", "\u901a\u8fc7\u535a\u5f08\u611f\u77e5\u4ee3\u4ef7\u5bf9\u8f68\u8ff9\u6392\u5e8f\uff0c\u6355\u6349\u8f66\u8f86\u95f4\u7ade\u4e89\u4ea4\u4e92\u5e76\u4ea7\u751f\u8d85\u8f66\u3001\u9632\u5b88\u7b49\u591a\u6837\u5316\u884c\u4e3a", "\u5728\u9ad8\u4ea4\u4e92\u4eff\u771f\u4e2d\u8fbe\u523095.24%\u80dc\u7387\u548c99.35%\u4efb\u52a1\u5b8c\u6210\u7387\uff0c\u5e76\u6269\u5c55\u5230\u6700\u591a10\u8f66\u573a\u666f"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u591a\u667a\u80fd\u4f53", "\u535a\u5f08\u89c4\u5212", "\u673a\u5668\u4eba"], "num_comments": 1, "on_hf": true, "organization": "TUM - Professorship of Autonomous Vehicle Systems", "pdf_url": "https://arxiv.org/pdf/2607.25388v1", "published_at": "2026-07-28", "score": 0.195, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.25388.png", "title": "SGTP: Sampling-based Game-Theoretic Planning for Real-Time Multi-Vehicle Autonomous Racing", "tldr": "SGTP\u5b9e\u73b0\u5b9e\u65f6\u591a\u8f66\u535a\u5f08\u8d5b\u8f66\u89c4\u5212", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Sampling-based Game-Theoretic Planning\uff08SGTP\uff09\uff0c\u5c06\u535a\u5f08\u8bba\u63a8\u7406\u4e0eGPU\u52a0\u901f\u7684\u63a7\u5236\u5e8f\u5217\u91c7\u6837\u3001\u52a8\u529b\u5b66 rollout \u7ed3\u5408\uff0c\u7528\u4e8e\u5b9e\u65f6\u591a\u8f66\u81ea\u52a8\u9a7e\u9a76\u7ade\u901f\u89c4\u5212\u3002\u5b83\u901a\u8fc7\u535a\u5f08\u611f\u77e5\u4ee3\u4ef7\u751f\u6210\u591a\u6837\u5316\u7ade\u4e89\u7b56\u7565\uff0c\u5e76\u663e\u5f0f\u68c0\u67e5\u8d5b\u9053\u8fb9\u754c\u4e0e\u52a8\u6001\u78b0\u649e\u7ea6\u675f\u4ee5\u4fdd\u8bc1\u53ef\u884c\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u591a\u8f66\u7ade\u901f\u8fd9\u4e00\u5f3a\u4ea4\u4e92\u3001\u9ad8\u5b9e\u65f6\u6027\u4efb\u52a1\u4e2d\u517c\u987e\u7b56\u7565\u591a\u6837\u6027\u3001\u8ba1\u7b97\u6548\u7387\u4e0e\u5b89\u5168\u53ef\u884c\u6027\uff0c\u5e76\u5f00\u6e90\u4ee3\u7801\u548c\u57fa\u51c6\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u9a7e\u9a76\u89c4\u5212\u7814\u7a76\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) are increasingly expected to solve structured perception tasks that require visual recognition, language-to-object binding, object cardinality preservation, and precisely localized grounding and segmentation outputs. However, existing group-relative reinforcement learning methods provide only response-level supervision, creating a granularity mismatch for structured multi-object prediction: a single advantage is broadcast to all tokens in a response, without distinguishing individual box contributions. To address this mismatch, we propose MCR-GRPO, a marginal contribution assignment framework that derives box-level credit directly from each sampled response. Specifically, Marginal Contribution Reward (MCR) estimates each predicted box\u0027s contribution through a leave-one-out comparison, measuring how the matched set value changes when the box is removed from the response. After within-response normalization, records that improve the set value receive positive credit, while redundant or harmful ones are suppressed. To make marginal attribution stable and informative, we further introduce a Continuous Matched Set Value Evaluator that integrates permutation-invariant matching, count-aware normalization, and graded localization. MCR-GRPO maps normalized box-level marginal advantages to the token spans that generated each box, preserving GRPO\u0027s response-level comparison while enabling box-aware optimization of structured multi-object grounding. Experiments across REC, DOD, segmentation, and counting benchmarks show state-of-the-art performance over prior GRPO-based baselines.", "arxiv_id": "2608.01055", "arxiv_url": "https://arxiv.org/abs/2608.01055", "authors": ["Xinheng Han", "Jianfei Wang", "Yu Chen", "Xiang Wang", "Shuai Li", "Weixing Li", "Feng Pan"], "brief": "\u8bba\u6587\u63d0\u51fa MCR-GRPO\uff0c\u7528\u4e8e\u6539\u8fdb MLLM \u5728\u7ed3\u6784\u5316\u89c6\u89c9\u611f\u77e5\u4efb\u52a1\u4e2d\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002\u5b83\u5c06\u539f\u672c\u54cd\u5e94\u7ea7\u7684 GRPO \u5956\u52b1\u7ec6\u5316\u5230\u6bcf\u4e2a\u9884\u6d4b\u6846\uff0c\u5e76\u6620\u5c04\u56de\u751f\u6210\u8be5\u6846\u7684 token\uff0c\u4ece\u800c\u4f18\u5316\u591a\u76ee\u6807 grounding\u3001\u5206\u5272\u4e0e\u8ba1\u6570\u8f93\u51fa\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01055", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Marginal Contribution Reward\uff0c\u901a\u8fc7\u7559\u4e00\u6cd5\u6bd4\u8f83\u79fb\u9664\u67d0\u4e2a\u9884\u6d4b\u6846\u524d\u540e\u7684\u5339\u914d\u96c6\u5408\u4ef7\u503c\uff0c\u4f30\u8ba1\u8be5\u6846\u7684\u8fb9\u9645\u8d21\u732e\u3002", "\u8bbe\u8ba1\u8fde\u7eed\u5339\u914d\u96c6\u5408\u4ef7\u503c\u8bc4\u4f30\u5668\uff0c\u7ed3\u5408\u7f6e\u6362\u4e0d\u53d8\u5339\u914d\u3001\u8ba1\u6570\u611f\u77e5\u5f52\u4e00\u5316\u548c\u6e10\u8fdb\u5f0f\u5b9a\u4f4d\u8d28\u91cf\u8bc4\u5206\u3002", "\u5728 REC\u3001DOD\u3001\u5206\u5272\u548c\u8ba1\u6570\u7b49\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u65e2\u6709 GRPO \u7c7b\u65b9\u6cd5\u53d6\u5f97\u66f4\u4f18\u6027\u80fd\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u5b9a\u4f4d", "\u5f3a\u5316\u5b66\u4e60", "\u7ed3\u6784\u5316\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01055v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Credit the Right Box: Marginal Contribution Assignment for Structured Visual Perception", "tldr": "\u4e3a\u591a\u76ee\u6807\u89c6\u89c9\u5b9a\u4f4d\u5206\u914d\u6846\u7ea7\u5956\u52b1\u4fe1\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MCR-GRPO\uff0c\u7528\u4e8e\u6539\u8fdb MLLM \u5728\u7ed3\u6784\u5316\u89c6\u89c9\u611f\u77e5\u4efb\u52a1\u4e2d\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002\u5b83\u5c06\u539f\u672c\u54cd\u5e94\u7ea7\u7684 GRPO \u5956\u52b1\u7ec6\u5316\u5230\u6bcf\u4e2a\u9884\u6d4b\u6846\uff0c\u5e76\u6620\u5c04\u56de\u751f\u6210\u8be5\u6846\u7684 token\uff0c\u4ece\u800c\u4f18\u5316\u591a\u76ee\u6807 grounding\u3001\u5206\u5272\u4e0e\u8ba1\u6570\u8f93\u51fa\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u89e3\u51b3\u4e86\u7ed3\u6784\u5316\u591a\u5bf9\u8c61\u9884\u6d4b\u4e2d\u201c\u6574\u4f53\u5956\u52b1\u5e7f\u64ad\u5230\u6240\u6709 token\u201d\u7684\u7c92\u5ea6\u9519\u914d\u95ee\u9898\uff0c\u4f7f\u5f3a\u5316\u5b66\u4e60\u80fd\u533a\u5206\u6b63\u786e\u3001\u5197\u4f59\u548c\u6709\u5bb3\u7684\u6846\uff0c\u5bf9\u63d0\u5347 MLLM \u7684\u7cbe\u786e\u89c6\u89c9 grounding \u4e0e\u7ed3\u6784\u5316\u611f\u77e5\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We report a counter-intuitive interaction between image inputs and existing black-box defenses on Vision--Language Models (VLMs): pairing an encoded jailbreak prompt with an unrelated decoy image can sharply lower attack success rate (ASR). The operative change is in the defense pipeline, not in the image. Across five frontier VLMs, two encoded-attack families, and three black-box defenses, a caption-mediated defense (ECSO) that leaves ASR essentially unchanged on text-only encoded input drops it by up to $73$pp once a content-free decoy is attached; every non-saturated contrast is significant under exact McNemar tests. We advance two hypotheses for this pattern, supported by indirect evidence rather than pipeline introspection, since a black-box threat model precludes inspecting vendor internals: caption-mediated defenses branch on image presence, and intrinsic image-side safety engages on image-resident content. Three controls constrain the explanation. Blank-canvas and natural-photograph decoys reproduce the effect on every model, implicating image presence rather than content; the effect replicates on three open-weight VLMs served with no moderation layer, so it is not a vendor-filtering artifact; and a non-symbolic, meaning-based encoder reproduces it, so it is not specific to symbolic obfuscation. Attaching a decoy unconditionally is not deployable --- it raises benign refusal to $20$--$79\\%$, an inflation of $+10$ to $+67$pp --- but gating attachment on a lightweight encoded-input detector returns benign refusal to the text baseline while preserving the safety gain wherever the detector fires, making detector recall the binding constraint. Under adaptive attacks that target the caption-mediated re-check, the effect degrades but holds. We frame this as an observation about pipeline interaction, not as a robust defense.", "arxiv_id": "2608.01043", "arxiv_url": "https://arxiv.org/abs/2608.01043", "authors": ["Haoyu Zhang", "Xiangchen Guan", "Shibo Zheng", "Mohammad Zandsalimy", "Shanu Sushmita"], "brief": "\u8bba\u6587\u53d1\u73b0\uff0c\u5728\u7f16\u7801\u8d8a\u72f1\u63d0\u793a\u4e2d\u9644\u52a0\u65e0\u5173\u201c\u8bf1\u9975\u56fe\u50cf\u201d\uff0c\u4f1a\u4e0eVLM\u73b0\u6709\u9ed1\u76d2\u9632\u5fa1\u7ba1\u7ebf\u4ea7\u751f\u53cd\u76f4\u89c9\u4ea4\u4e92\uff0c\u663e\u8457\u964d\u4f4e\u653b\u51fb\u6210\u529f\u7387\u3002\u4f5c\u8005\u7cfb\u7edf\u8bc4\u4f305\u4e2a\u524d\u6cbfVLM\u30012\u7c7b\u7f16\u7801\u653b\u51fb\u548c3\u79cd\u9ed1\u76d2\u9632\u5fa1\uff0c\u6307\u51fa\u6548\u679c\u4e3b\u8981\u6765\u81ea\u57fa\u4e8e\u56fe\u50cf\u5b58\u5728\u89e6\u53d1\u7684caption-mediated\u9632\u5fa1\u5206\u652f\uff0c\u800c\u975e\u56fe\u50cf\u5185\u5bb9\u672c\u8eab\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01043", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728ECSO\u7b49caption-mediated\u9632\u5fa1\u4e0b\uff0c\u6587\u672c\u7f16\u7801\u653b\u51fb\u51e0\u4e4e\u4e0d\u53d7\u5f71\u54cd\uff0c\u4f46\u52a0\u5165\u65e0\u5185\u5bb9\u8bf1\u9975\u56fe\u540eASR\u6700\u9ad8\u4e0b\u964d73\u4e2a\u767e\u5206\u70b9\u3002", "\u7a7a\u767d\u753b\u5e03\u548c\u81ea\u7136\u7167\u7247\u5747\u80fd\u590d\u73b0\u6548\u679c\uff0c\u4e14\u5728\u65e0\u5ba1\u6838\u5c42\u7684\u5f00\u6e90VLM\u4e0a\u4e5f\u6210\u7acb\uff0c\u6392\u9664\u4e86\u5355\u7eaf\u5185\u5bb9\u6216\u5382\u5546\u8fc7\u6ee4\u56e0\u7d20\u3002", "\u65e0\u6761\u4ef6\u52a0\u56fe\u4f1a\u663e\u8457\u63d0\u9ad8\u826f\u6027\u62d2\u7b54\u7387\uff1b\u82e5\u7528\u8f7b\u91cf\u7f16\u7801\u8f93\u5165\u68c0\u6d4b\u5668\u95e8\u63a7\u52a0\u56fe\uff0c\u53ef\u6062\u590d\u826f\u6027\u4f53\u9a8c\u5e76\u4fdd\u7559\u5b89\u5168\u6536\u76ca\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5b89\u5168\u9632\u5fa1", "\u8d8a\u72f1\u653b\u51fb", "VLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01043v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Decoy Images Amplify Caption-Mediated Defenses Against Encoded Jailbreaks", "tldr": "\u65e0\u5173\u8bf1\u9975\u56fe\u53ef\u663e\u8457\u524a\u5f31VLM\u7f16\u7801\u8d8a\u72f1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\uff0c\u5728\u7f16\u7801\u8d8a\u72f1\u63d0\u793a\u4e2d\u9644\u52a0\u65e0\u5173\u201c\u8bf1\u9975\u56fe\u50cf\u201d\uff0c\u4f1a\u4e0eVLM\u73b0\u6709\u9ed1\u76d2\u9632\u5fa1\u7ba1\u7ebf\u4ea7\u751f\u53cd\u76f4\u89c9\u4ea4\u4e92\uff0c\u663e\u8457\u964d\u4f4e\u653b\u51fb\u6210\u529f\u7387\u3002\u4f5c\u8005\u7cfb\u7edf\u8bc4\u4f305\u4e2a\u524d\u6cbfVLM\u30012\u7c7b\u7f16\u7801\u653b\u51fb\u548c3\u79cd\u9ed1\u76d2\u9632\u5fa1\uff0c\u6307\u51fa\u6548\u679c\u4e3b\u8981\u6765\u81ea\u57fa\u4e8e\u56fe\u50cf\u5b58\u5728\u89e6\u53d1\u7684caption-mediated\u9632\u5fa1\u5206\u652f\uff0c\u800c\u975e\u56fe\u50cf\u5185\u5bb9\u672c\u8eab\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86VLM\u5b89\u5168\u9632\u5fa1\u4e2d\u88ab\u5ffd\u89c6\u7684\u7ba1\u7ebf\u4ea4\u4e92\u6548\u5e94\uff1a\u56fe\u50cf\u5b58\u5728\u672c\u8eab\u53ef\u80fd\u6539\u53d8\u9632\u5fa1\u8def\u5f84\uff0c\u4ece\u800c\u589e\u5f3a\u5bf9\u7f16\u7801\u8d8a\u72f1\u7684\u62e6\u622a\u3002\u867d\u7136\u4f5c\u8005\u5f3a\u8c03\u8fd9\u4e0d\u662f\u7a33\u5065\u9632\u5fa1\uff0c\u4f46\u4e3a\u9ed1\u76d2VLM\u5b89\u5168\u8bc4\u4f30\u3001\u8f93\u5165\u95e8\u63a7\u548c\u591a\u6a21\u6001\u9632\u5fa1\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u6709\u4ef7\u503c\u7684\u5b9e\u8bc1\u7ebf\u7d22\u3002"}, {"abstract": "Language models small enough to run on a handset, quantized to a few bits, are increasingly capable of acting for their user, making on-device task automation newly plausible. One such task is answering the phone. A phone secretary takes an unknown inbound call on its owner\u0027s behalf. Unlike the agents evaluated by most benchmarks, it has no task to complete and no cooperative user: the caller holds the goal, may be an adversary, and must be judged from the opening turn with no oracle. What matters is not task success, but whether the owner would endorse how their proxy handled the call. We present CallScreenBench, which scores this setting on five quality dimensions. Each dimension is printed beside the counter-metric that bills it and is never averaged into a single number. We also report a guardedness profile for a toolless proxy that holds no credentials and calls no tools. Across six on-device models (0.6-4B parameters, 4-bit quantization), quality scales with capability, but triage does not. The appearance that it does is an artifact of measurement. Scripted degenerate agents supply the missing floors: after correcting for them, the number of model pairs whose triage performance separates falls from 11 of 15 to zero at the preregistered operating point. An agent that simply hangs up and echoes the caller also scores perfect message fidelity. We report which of our own metrics these floors defeat and declare no pass/fail threshold.", "arxiv_id": "2608.01033", "arxiv_url": "https://arxiv.org/abs/2608.01033", "authors": ["Simiao Ren"], "brief": "\u8bba\u6587\u63d0\u51fa CallScreenBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5c0f\u578b\u91cf\u5316\u7aef\u4fa7\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u201c\u7535\u8bdd\u79d8\u4e66\u201d\u5904\u7406\u672a\u77e5\u6765\u7535\u7684\u8868\u73b0\u3002\u5b83\u4ece\u4e94\u4e2a\u8d28\u91cf\u7ef4\u5ea6\u548c\u5bf9\u5e94\u53cd\u6307\u6807\u8861\u91cf\u6a21\u578b\u884c\u4e3a\uff0c\u5e76\u5206\u6790\u65e0\u5de5\u5177\u3001\u65e0\u51ed\u8bc1\u4ee3\u7406\u7684\u8c28\u614e\u6027\u753b\u50cf\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01033", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8bc4\u6d4b\u5bf9\u8c61\u662f 0.6B-4B \u53c2\u6570\u30014-bit \u91cf\u5316\u7684\u516d\u4e2a\u7aef\u4fa7\u6a21\u578b\uff0c\u573a\u666f\u4e3a\u672a\u77e5\u6765\u7535\u7b5b\u9009\u800c\u975e\u4f20\u7edf\u4efb\u52a1\u5b8c\u6210", "\u6307\u6807\u4e0d\u5408\u5e76\u4e3a\u5355\u4e00\u5206\u6570\uff0c\u800c\u662f\u5206\u522b\u62a5\u544a\u4e94\u4e2a\u8d28\u91cf\u7ef4\u5ea6\u53ca\u53cd\u6307\u6807\uff0c\u5f3a\u8c03\u7528\u6237\u662f\u5426\u4f1a\u8ba4\u53ef\u4ee3\u7406\u5904\u7406\u65b9\u5f0f", "\u53d1\u73b0\u8868\u9762\u4e0a\u7684\u5206\u6d41\u80fd\u529b\u968f\u6a21\u578b\u80fd\u529b\u63d0\u5347\u4e3b\u8981\u662f\u6d4b\u91cf\u5047\u8c61\uff1b\u52a0\u5165\u9000\u5316\u811a\u672c\u4ee3\u7406\u6821\u6b63\u540e\uff0c\u6a21\u578b\u95f4\u5206\u6d41\u5dee\u5f02\u5728\u9884\u6ce8\u518c\u70b9\u6d88\u5931"], "keywords": ["\u667a\u80fd\u4f53", "\u7aef\u4fa7\u6a21\u578b", "\u5b89\u5168\u8bc4\u6d4b", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01033v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CallScreenBench: Benchmarking On-Device Models as Phone Secretaries", "tldr": "\u8bc4\u6d4b\u7aef\u4fa7\u6a21\u578b\u4ee3\u63a5\u7535\u8bdd\u7684\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CallScreenBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5c0f\u578b\u91cf\u5316\u7aef\u4fa7\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u201c\u7535\u8bdd\u79d8\u4e66\u201d\u5904\u7406\u672a\u77e5\u6765\u7535\u7684\u8868\u73b0\u3002\u5b83\u4ece\u4e94\u4e2a\u8d28\u91cf\u7ef4\u5ea6\u548c\u5bf9\u5e94\u53cd\u6307\u6807\u8861\u91cf\u6a21\u578b\u884c\u4e3a\uff0c\u5e76\u5206\u6790\u65e0\u5de5\u5177\u3001\u65e0\u51ed\u8bc1\u4ee3\u7406\u7684\u8c28\u614e\u6027\u753b\u50cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u7535\u8bdd\u4ee3\u7406\u8bc4\u6d4b\u4e2d\u5e38\u89c1\u6307\u6807\u53ef\u80fd\u88ab\u201c\u6302\u65ad\u3001\u590d\u8ff0\u201d\u7b49\u9000\u5316\u7b56\u7565\u8f7b\u6613\u51fb\u8d25\uff0c\u5bf9\u7aef\u4fa7 AI \u52a9\u624b\u3001\u9690\u79c1\u654f\u611f\u81ea\u52a8\u5316\u548c\u5b89\u5168\u8bc4\u6d4b\u5177\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "We study the problem of optimizing physical layouts for automated warehouses, where hundreds to thousands of robots are coordinated to transport packages. Previous works have shown that optimizing the warehouse layout (e.g., the physical location of the storage shelves) significantly improves throughput. However, state-of-the-art layout optimization approaches are based on evolutionary optimization methods, which treat the entire warehouse as a black box and rely on random mutation to search for high-quality layouts. While the optimization outcomes are promising, these methods require a massive number of simulations to evaluate candidate solutions, making them sample-inefficient. In this paper, we present Stress-Relief Annealing (SRA), a polynomial-time simulation-free layout optimization algorithm. SRA turns the task demand into a per-vertex \\emph{stress field} that predicts where traffic will concentrate in the warehouse; the field\u0027s peak provably caps the throughput. Our experimental results show that (1) SRA improves both the throughput and the scalability of a human-designed warehouse, roughly doubling the number of robots it can sustain, (2) it matches or exceeds the throughput of the evolutionary baselines while taking only $19$ minutes on one CPU core, against their $25{,}000$ simulations and $25$ hours on a $64$-core machine, and (3) the gain generalizes across different Multi-Agent Path Finding algorithms, non-uniform task demands, and a warehouse with doubled dimensions.", "arxiv_id": "2608.01024", "arxiv_url": "https://arxiv.org/abs/2608.01024", "authors": ["Xiangjie Luo", "Yulun Zhang", "Miyuki Koshimura", "Makoto Yokoo", "Jiaoyang Li"], "brief": "\u8bba\u6587\u63d0\u51fa Stress-Relief Annealing\uff08SRA\uff09\uff0c\u4e00\u79cd\u7528\u4e8e\u81ea\u52a8\u5316\u4ed3\u5e93\u7269\u7406\u5e03\u5c40\u4f18\u5316\u7684\u591a\u9879\u5f0f\u65f6\u95f4\u3001\u514d\u4eff\u771f\u7b97\u6cd5\u3002\u5b83\u5c06\u4efb\u52a1\u9700\u6c42\u8f6c\u5316\u4e3a\u4ed3\u5e93\u9876\u70b9\u4e0a\u7684\u201c\u538b\u529b\u573a\u201d\uff0c\u636e\u6b64\u9884\u6d4b\u4ea4\u901a\u62e5\u5835\u5e76\u8c03\u6574\u8d27\u67b6\u5e03\u5c40\u4ee5\u63d0\u5347\u541e\u5410\u3002", "categories": ["cs.MA", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01024", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u538b\u529b\u573a\u523b\u753b\u673a\u5668\u4eba\u4ea4\u901a\u96c6\u4e2d\u533a\u57df\uff0c\u4e14\u538b\u529b\u5cf0\u503c\u53ef\u8bc1\u660e\u5730\u7ea6\u675f\u7cfb\u7edf\u541e\u5410\u4e0a\u9650", "\u76f8\u6bd4\u8fdb\u5316\u5f0f\u9ed1\u76d2\u4f18\u5316\uff0cSRA \u65e0\u9700\u5927\u91cf\u5019\u9009\u5e03\u5c40\u4eff\u771f\uff0c\u5355 CPU \u6838\u7ea6 19 \u5206\u949f\u5b8c\u6210\u4f18\u5316", "\u5b9e\u9a8c\u663e\u793a\u53ef\u7ea6\u7ffb\u500d\u63d0\u5347\u4eba\u5de5\u8bbe\u8ba1\u4ed3\u5e93\u53ef\u627f\u8f7d\u673a\u5668\u4eba\u6570\u91cf\uff0c\u5e76\u5728\u4e0d\u540c MAPF \u7b97\u6cd5\u3001\u975e\u5747\u5300\u4efb\u52a1\u9700\u6c42\u548c\u66f4\u5927\u4ed3\u5e93\u4e2d\u6cdb\u5316"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u673a\u5668\u4eba", "\u8def\u5f84\u89c4\u5212", "\u7ec4\u5408\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01024v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Stress-Relief Annealing: Polynomial-Time Simulation-Free Layout Optimization for Automated Warehouses", "tldr": "\u514d\u4eff\u771f\u591a\u673a\u5668\u4eba\u4ed3\u5e93\u5e03\u5c40\u4f18\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Stress-Relief Annealing\uff08SRA\uff09\uff0c\u4e00\u79cd\u7528\u4e8e\u81ea\u52a8\u5316\u4ed3\u5e93\u7269\u7406\u5e03\u5c40\u4f18\u5316\u7684\u591a\u9879\u5f0f\u65f6\u95f4\u3001\u514d\u4eff\u771f\u7b97\u6cd5\u3002\u5b83\u5c06\u4efb\u52a1\u9700\u6c42\u8f6c\u5316\u4e3a\u4ed3\u5e93\u9876\u70b9\u4e0a\u7684\u201c\u538b\u529b\u573a\u201d\uff0c\u636e\u6b64\u9884\u6d4b\u4ea4\u901a\u62e5\u5835\u5e76\u8c03\u6574\u8d27\u67b6\u5e03\u5c40\u4ee5\u63d0\u5347\u541e\u5410\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5c06\u6602\u8d35\u7684\u4eff\u771f\u9a71\u52a8\u5e03\u5c40\u641c\u7d22\u8f6c\u5316\u4e3a\u53ef\u89e3\u91ca\u3001\u53ef\u8bc1\u660e\u4e14\u9ad8\u6548\u7684\u4f18\u5316\u8fc7\u7a0b\uff0c\u663e\u8457\u964d\u4f4e\u81ea\u52a8\u5316\u4ed3\u5e93\u8bbe\u8ba1\u6210\u672c\uff0c\u5e76\u53ef\u80fd\u63d0\u5347\u5927\u89c4\u6a21\u591a\u673a\u5668\u4eba\u7cfb\u7edf\u7684\u5b9e\u9645\u90e8\u7f72\u6548\u7387\u3002"}, {"abstract": "We present Caliber, an output-perturbation defense against model extraction that formulates noise selection as a calibration problem: how much the defense degrades the supervision signal used to train a surrogate, and the provable per-input query cost of recovering the clean logits. To defend against an attacker that uses returned scores for knowledge distillation, Caliber adds independent and identically distributed Gaussian noise to the internal logits. We establish two properties of the resulting perturbed predictions. Monotone agreement degradation: When the clean logits have a unique maximizer, agreement with the clean prediction decreases strictly with the noise scale, so every target in $(1/K,1)$ corresponds to a unique positive scale; task accuracy is bounded by computable lower and upper envelopes. Per-input recovery cost: We derive a closed-form minimax lower bound on the repeated queries needed to recover the clean logits for a fixed input. Caliber normalizes noise variance by the squared median top-two logit margin and fits the resulting noise-utility relationship with a logistic curve, either per model or shared within a task. Across more than thirty model-dataset combinations, per-model calibration achieves mean absolute relative errors of 0.6-1.4%. End-to-end experiments show that surrogate performance generally tracks the configured degradation, while fixed-input averaging follows the expected variance reduction.", "arxiv_id": "2608.01023", "arxiv_url": "https://arxiv.org/abs/2608.01023", "authors": ["Chi Wang", "Hanwen Wang", "Yu Xia", "Zihan Wang", "Guangdong Bai"], "brief": "\u8bba\u6587\u63d0\u51fa Caliber\uff0c\u4e00\u79cd\u9762\u5411\u8fd4\u56de\u5206\u6570 API \u7684\u8f93\u51fa\u6270\u52a8\u9632\u5fa1\u65b9\u6cd5\uff0c\u901a\u8fc7\u5411\u5185\u90e8 logits \u52a0\u5165\u9ad8\u65af\u566a\u58f0\u6765\u524a\u5f31\u653b\u51fb\u8005\u7528\u4e8e\u77e5\u8bc6\u84b8\u998f\u7684\u76d1\u7763\u4fe1\u53f7\u3002\u5b83\u5c06\u566a\u58f0\u5f3a\u5ea6\u9009\u62e9\u5efa\u6a21\u4e3a\u6821\u51c6\u95ee\u9898\uff0c\u540c\u65f6\u63a7\u5236\u6a21\u578b\u6548\u7528\u4e0b\u964d\u4e0e\u653b\u51fb\u8005\u6062\u590d\u5e72\u51c0 logits \u7684\u67e5\u8be2\u6210\u672c\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01023", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u660e\u566a\u58f0\u5c3a\u5ea6\u4e0e\u5e72\u51c0\u9884\u6d4b\u4e00\u81f4\u7387\u4e4b\u95f4\u5b58\u5728\u4e25\u683c\u5355\u8c03\u9000\u5316\u5173\u7cfb\uff0c\u53ef\u4e3a\u76ee\u6807\u9000\u5316\u6c34\u5e73\u786e\u5b9a\u552f\u4e00\u566a\u58f0\u5c3a\u5ea6", "\u7ed9\u51fa\u56fa\u5b9a\u8f93\u5165\u4e0b\u901a\u8fc7\u91cd\u590d\u67e5\u8be2\u6062\u590d\u5e72\u51c0 logits \u6240\u9700\u67e5\u8be2\u6b21\u6570\u7684\u95ed\u5f0f minimax \u4e0b\u754c", "\u5728 30 \u591a\u4e2a\u6a21\u578b-\u6570\u636e\u96c6\u7ec4\u5408\u4e0a\uff0c\u6309\u6a21\u578b\u6821\u51c6\u7684\u5e73\u5747\u76f8\u5bf9\u8bef\u5dee\u4ec5\u4e3a 0.6%\u20131.4%"], "keywords": ["\u6a21\u578b\u5b89\u5168", "\u6a21\u578b\u62bd\u53d6", "\u77e5\u8bc6\u84b8\u998f", "\u9690\u79c1\u9632\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01023v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Caliber: Cross-Architecture Extraction-Cost Control for Score-Returning APIs", "tldr": "\u7528\u53ef\u6821\u51c6\u566a\u58f0\u9632\u5fa1\u6a21\u578b\u62bd\u53d6\u653b\u51fb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Caliber\uff0c\u4e00\u79cd\u9762\u5411\u8fd4\u56de\u5206\u6570 API \u7684\u8f93\u51fa\u6270\u52a8\u9632\u5fa1\u65b9\u6cd5\uff0c\u901a\u8fc7\u5411\u5185\u90e8 logits \u52a0\u5165\u9ad8\u65af\u566a\u58f0\u6765\u524a\u5f31\u653b\u51fb\u8005\u7528\u4e8e\u77e5\u8bc6\u84b8\u998f\u7684\u76d1\u7763\u4fe1\u53f7\u3002\u5b83\u5c06\u566a\u58f0\u5f3a\u5ea6\u9009\u62e9\u5efa\u6a21\u4e3a\u6821\u51c6\u95ee\u9898\uff0c\u540c\u65f6\u63a7\u5236\u6a21\u578b\u6548\u7528\u4e0b\u964d\u4e0e\u653b\u51fb\u8005\u6062\u590d\u5e72\u51c0 logits \u7684\u67e5\u8be2\u6210\u672c\u3002", "why_notable": "\u76f8\u6bd4\u7b80\u5355\u56fa\u5b9a\u566a\u58f0\uff0cCaliber \u63d0\u4f9b\u4e86\u53ef\u89e3\u91ca\u3001\u53ef\u8c03\u63a7\u4e14\u5e26\u7406\u8bba\u4fdd\u8bc1\u7684\u6a21\u578b\u62bd\u53d6\u9632\u5fa1\u673a\u5236\uff0c\u80fd\u5728 API \u53ef\u7528\u6027\u4e0e\u7a83\u53d6\u6210\u672c\u4e4b\u95f4\u8fdb\u884c\u7cbe\u7ec6\u6743\u8861\uff0c\u5bf9\u5546\u4e1a\u6a21\u578b\u670d\u52a1\u5b89\u5168\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "In an age of rapid model turnover, how do we make hallucination evaluation more perennial? We explore whether human-written hallucination samples could take the place of model-generated hallucinations, in order to make benchmarking detection independent of particular models. To this end, we construct a dataset of 1,600 human-written samples, spanning four languages (Chinese, English, French, Italian), and 18,400 samples from five vision-and-language models, all annotated for hallucinations using a fine-grained span-level labeling scheme. We find that human-written samples result in higher agreement and allow greater control of dataset contents, while remaining distributionally similar to samples derived from vision-and-language samples and providing a reasonable portrayal of detection capabilities - suggesting that human data is a viable substitute for model-based hallucination benchmarks.", "arxiv_id": "2608.01021", "arxiv_url": "https://arxiv.org/abs/2608.01021", "authors": ["Timothee Mickus", "Claudio Savelli", "Eduardo Cal\u00f2", "Emilio Raimond", "Stella Frank", "Hengyu Luo", "Flavio Giobergia", "Vincent Segonne", "Chuyuan Li", "Aman Sinha", "Lorenzo Vaiani", "J\u00f6rg Tiedemann", "Ra\u00fal V\u00e1zquez"], "brief": "\u8bba\u6587\u63a2\u7d22\u7528\u4eba\u5de5\u64b0\u5199\u7684\u5e7b\u89c9\u6837\u672c\u66ff\u4ee3\u6a21\u578b\u751f\u6210\u5e7b\u89c9\u6837\u672c\uff0c\u4ee5\u964d\u4f4e\u8bc4\u6d4b\u5bf9\u7279\u5b9a\u6a21\u578b\u7248\u672c\u7684\u4f9d\u8d56\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u8986\u76d6\u4e2d\u82f1\u6cd5\u610f\u56db\u79cd\u8bed\u8a00\u7684\u7ec6\u7c92\u5ea6\u89c6\u89c9-\u8bed\u8a00\u5e7b\u89c9\u6807\u6ce8\u6570\u636e\u96c6\uff0c\u5e76\u4e0e\u591a\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6837\u672c\u8fdb\u884c\u5bf9\u6bd4\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01021", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6570\u636e\u96c6\u5305\u542b1600\u6761\u4eba\u5de5\u64b0\u5199\u6837\u672c\uff0c\u4ee5\u53ca\u6765\u81ea5\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u768418400\u6761\u6837\u672c\u3002", "\u91c7\u7528\u7ec6\u7c92\u5ea6span\u7ea7\u5e7b\u89c9\u6807\u6ce8\u65b9\u6848\uff0c\u53ef\u5b9a\u4f4d\u5177\u4f53\u5e7b\u89c9\u6587\u672c\u7247\u6bb5\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u4eba\u5de5\u6837\u672c\u6807\u6ce8\u4e00\u81f4\u6027\u66f4\u9ad8\u3001\u5185\u5bb9\u53ef\u63a7\u6027\u66f4\u5f3a\uff0c\u4e14\u4e0e\u6a21\u578b\u751f\u6210\u6837\u672c\u5206\u5e03\u76f8\u8fd1\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u8bc4\u6d4b", "\u6570\u636e\u96c6", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01021v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can Humans Dream of Electric Sheep? Human-Written Samples for Fine-Grained Vision-and-Language Hallucination Benchmarking", "tldr": "\u7528\u4eba\u5199\u6837\u672c\u6784\u5efa\u66f4\u7a33\u5065\u7684VLM\u5e7b\u89c9\u8bc4\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63a2\u7d22\u7528\u4eba\u5de5\u64b0\u5199\u7684\u5e7b\u89c9\u6837\u672c\u66ff\u4ee3\u6a21\u578b\u751f\u6210\u5e7b\u89c9\u6837\u672c\uff0c\u4ee5\u964d\u4f4e\u8bc4\u6d4b\u5bf9\u7279\u5b9a\u6a21\u578b\u7248\u672c\u7684\u4f9d\u8d56\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u8986\u76d6\u4e2d\u82f1\u6cd5\u610f\u56db\u79cd\u8bed\u8a00\u7684\u7ec6\u7c92\u5ea6\u89c6\u89c9-\u8bed\u8a00\u5e7b\u89c9\u6807\u6ce8\u6570\u636e\u96c6\uff0c\u5e76\u4e0e\u591a\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6837\u672c\u8fdb\u884c\u5bf9\u6bd4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5e7b\u89c9\u68c0\u6d4b\u63d0\u4f9b\u4e86\u4e00\u79cd\u66f4\u6301\u4e45\u3001\u6a21\u578b\u65e0\u5173\u7684\u57fa\u51c6\u6784\u5efa\u601d\u8def\uff0c\u6709\u52a9\u4e8e\u907f\u514d\u8bc4\u6d4b\u968f\u6a21\u578b\u8fed\u4ee3\u5feb\u901f\u5931\u6548\uff0c\u63d0\u5347\u591a\u8bed\u8a00\u5e7b\u89c9\u8bc4\u6d4b\u7684\u53ef\u590d\u7528\u6027\u3002"}, {"abstract": "A language model that abandons a correct medical answer under user pushback is more dangerous than one that was simply wrong, because it lends the credibility of a correct answer to the user\u0027s misinformation. Such model behavior, described as medical sycophancy, is usually reported as a single rate per model, but we find it is a property of the conversation, not the model. We study medical sycophancy in language models with a fully crossed factorial design over four conversational factors, user role, the evidence behind a false claim, whether the challenge precedes or follows the model\u0027s answer, and whether the correct answer is grounded in the prompt, across five open-weight models and 500 MedQuAD questions (1.2M trials). The factors interact sharply: fabricated sources raise sycophancy 2.0x when they accompany the question but halve it once the model has answered, so the same evidence helps or hurts depending only on timing. Sycophancy varies far more across questions than across models (67x vs. 3x), so a single rate reflects the conversation and the questions sampled as much as the model. Chain-of-thought traces explain why. Models that re-examine their own prior answer concede, while those that reason about the medical facts hold, and only a model that has already answered can spend a round auditing the fabricated source.", "arxiv_id": "2608.01017", "arxiv_url": "https://arxiv.org/abs/2608.01017", "authors": ["Kaike Ping", "Buse \u00c7ar\u0131k", "Caleb Wohn", "Xiaohan Ding", "Tongshuai Wang", "Eugenia Rho"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u8bed\u8a00\u6a21\u578b\u5728\u533b\u7597\u95ee\u7b54\u4e2d\u4e3a\u4f55\u4f1a\u5728\u7528\u6237\u8d28\u7591\u4e0b\u653e\u5f03\u6b63\u786e\u7b54\u6848\uff0c\u5373\u201c\u533b\u5b66\u8c04\u5a9a\u201d\u3002\u4f5c\u8005\u7528500\u4e2aMedQuAD\u95ee\u9898\u30015\u4e2a\u5f00\u6e90\u6a21\u578b\u548c\u56db\u7c7b\u5bf9\u8bdd\u56e0\u7d20\u6784\u6210\u5168\u56e0\u5b50\u5b9e\u9a8c\uff0c\u5171\u8fdb\u884c\u7ea6120\u4e07\u6b21\u8bd5\u9a8c\uff0c\u5206\u6790\u8c04\u5a9a\u884c\u4e3a\u7684\u89e6\u53d1\u6761\u4ef6\u4e0e\u63a8\u7406\u673a\u5236\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01017", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7814\u7a76\u53d1\u73b0\u533b\u5b66\u8c04\u5a9a\u4e0d\u662f\u5355\u4e00\u6a21\u578b\u5c5e\u6027\uff0c\u800c\u5f3a\u70c8\u4f9d\u8d56\u5bf9\u8bdd\u56e0\u7d20\uff0c\u5305\u62ec\u7528\u6237\u8eab\u4efd\u3001\u4f2a\u8bc1\u636e\u3001\u8d28\u7591\u65f6\u673a\u3001\u6b63\u786e\u7b54\u6848\u662f\u5426\u5728\u63d0\u793a\u4e2d\u6709\u4f9d\u636e\u3002", "\u4f2a\u9020\u6765\u6e90\u7684\u5f71\u54cd\u53d6\u51b3\u4e8e\u65f6\u673a\uff1a\u82e5\u968f\u95ee\u9898\u4e00\u8d77\u51fa\u73b0\uff0c\u4f1a\u4f7f\u8c04\u5a9a\u7387\u63d0\u5347\u7ea62\u500d\uff1b\u82e5\u5728\u6a21\u578b\u56de\u7b54\u540e\u51fa\u73b0\uff0c\u53cd\u800c\u4f1a\u4f7f\u8c04\u5a9a\u7387\u51cf\u534a\u3002", "\u8c04\u5a9a\u5dee\u5f02\u5728\u95ee\u9898\u4e4b\u95f4\u8fdc\u5927\u4e8e\u6a21\u578b\u4e4b\u95f4\uff1a\u95ee\u9898\u5e26\u6765\u7684\u53d8\u5316\u7ea6\u4e3a67\u500d\uff0c\u6a21\u578b\u4e4b\u95f4\u7ea6\u4e3a3\u500d\uff0c\u8bf4\u660e\u8bc4\u4f30\u7ed3\u679c\u9ad8\u5ea6\u53d7\u98
