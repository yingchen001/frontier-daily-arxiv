0\u51faGraRe\uff0c\u5728\u4e0d\u4fee\u6539\u51bb\u7ed3\u68c0\u6d4b\u5668\u548c\u5019\u9009\u96c6\u5408\u7684\u60c5\u51b5\u4e0b\uff0c\u5229\u7528\u5019\u9009\u5c5e\u6027\u3001\u5c40\u90e8\u51e0\u4f55\u4e0e\u7269\u4f53\u4e0a\u4e0b\u6587\u91cd\u6392\u5e8f\u6293\u53d6\u5019\u9009\uff0c\u5728GraspNet-1Billion\u4e0a\u6700\u9ad8\u63d0\u534713.60\u70b9Average AP\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u6742\u4e71\u573a\u666f\u4e2d\u8868\u73b0\u7a33\u5065\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Increasing the temperature of an ordinary many-state system increases access to a wider range of states and hence increases its entropy. We find the opposite in ChatGPT-like AIs, even though raising the decoder temperature likewise increases access to a wider range of states (next-token choices). Across 12,000 continuations from 11 AIs, autoregressive feedback drives the long-time output population through an entropy maximum and into population inversion. The transition features frozen states, cycles, intermittency and noise-induced ordering. We present evidence of a hidden coordinate that acts as the state variable of an effective nonlinear map. Its trajectory average strongly predicts output repetition in separate test trajectories. ChatGPT-like AIs therefore behave not as `stochastic parrots\u0027, but as a new class of controllable nonlinear physical systems whose internal dynamics can be measured and perturbed.", "arxiv_id": "2608.00939", "arxiv_url": "https://arxiv.org/abs/2608.00939", "authors": ["Neil F. Johnson", "Frank Yingjie Huo", "Bella Xinrui Li"], "brief": "\u672c\u6587\u7814\u7a76 11 \u4e2a\u7c7b ChatGPT \u6a21\u578b\u5728\u4e0d\u540c\u89e3\u7801\u6e29\u5ea6\u4e0b\u7684 12000 \u6b21\u7eed\u5199\uff0c\u53d1\u73b0\u5347\u9ad8\u6e29\u5ea6\u5e76\u4e0d\u603b\u662f\u589e\u52a0\u8f93\u51fa\u71b5\uff0c\u957f\u671f\u751f\u6210\u4f1a\u7ecf\u8fc7\u71b5\u5cf0\u503c\u5e76\u8fdb\u5165\u201c\u79cd\u7fa4\u53cd\u8f6c\u201d\u3002\u7814\u7a76\u8fd8\u89c2\u5bdf\u5230\u51bb\u7ed3\u6001\u3001\u5faa\u73af\u3001\u95f4\u6b47\u6027\u548c\u566a\u58f0\u8bf1\u5bfc\u6709\u5e8f\u7b49\u975e\u7ebf\u6027\u52a8\u529b\u5b66\u73b0\u8c61\uff0c\u5e76\u63d0\u51fa\u9690\u85cf\u72b6\u6001\u53d8\u91cf\u53ef\u9884\u6d4b\u91cd\u590d\u8f93\u51fa\u3002", "categories": ["physics.soc-ph", "cond-mat.dis-nn", "cs.AI", "nlin.AO", "physics.app-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00939", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u975e\u7ebf\u6027\u52a8\u529b\u5b66", "\u89e3\u7801\u6e29\u5ea6", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00939v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Temperature-driven inversion and nonlinear dynamics in ChatGPT-like AIs", "tldr": "\u672c\u6587\u7814\u7a76 11 \u4e2a\u7c7b ChatGPT \u6a21\u578b\u5728\u4e0d\u540c\u89e3\u7801\u6e29\u5ea6\u4e0b\u7684 12000 \u6b21\u7eed\u5199\uff0c\u53d1\u73b0\u5347\u9ad8\u6e29\u5ea6\u5e76\u4e0d\u603b\u662f\u589e\u52a0\u8f93\u51fa\u71b5\uff0c\u957f\u671f\u751f\u6210\u4f1a\u7ecf\u8fc7\u71b5\u5cf0\u503c\u5e76\u8fdb\u5165\u201c\u79cd\u7fa4\u53cd\u8f6c\u201d\u3002\u7814\u7a76\u8fd8\u89c2\u5bdf\u5230\u51bb\u7ed3\u6001\u3001\u5faa\u73af\u3001\u95f4\u6b47\u6027\u548c\u566a\u58f0\u8bf1\u5bfc\u6709\u5e8f\u7b49\u975e\u7ebf\u6027\u52a8\u529b\u5b66\u73b0\u8c61\uff0c\u5e76\u63d0\u51fa\u9690\u85cf\u72b6\u6001\u53d8\u91cf\u53ef\u9884\u6d4b\u91cd\u590d\u8f93\u51fa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Opt.Gear, a foundation model designed for efficient on-device deployment, real-tim inference, and strong task capability. It includes a dense model (1M, 270M, and 1B) with a context length of 64K. We designed a new hybrid architecture that combines a convolutional key-value gated mixer with local-global attention to reduce the KV-cache memory that tends to increase exponentially with long context. This architecture delivers up to X4.9 faster prefill and decoding speeds on the NPUs compared to models of a similar scale models. From a 2T tokens candidate corpus, Opt.Gear is trained on a curated 0.5T tokens subset without knowledge distillation. This is the most data-efficient of the existing foundation models. All models are released with open weights and deployment binaries for ONNX, Qualcomm NPU, and Apple ANE making Opt.Gear a practical base for edge applications that need fast, memory-efficient inference and strong task capabilities. Furthermore, to expand the ecosystem of on-device generative language models, we are introducing the Opt.Gear-1M that can be deployed on Micro-Controller Units (MCUs), a Tiny Language Model (TLM). Opt.Gear-1M is the first generative language model to achieve 20 TPS with W4A32 quantization on the ARM Cortex-M7 CPU of the STM32H747I-DISCO.", "arxiv_id": "2608.01034", "arxiv_url": "https://arxiv.org/abs/2608.01034", "authors": ["Juneyoung Park", "Youngwook Kwon"], "brief": "Opt.Gear \u63d0\u51fa\u9762\u5411\u7aef\u4fa7\u90e8\u7f72\u7684\u57fa\u7840\u8bed\u8a00\u6a21\u578b\u7cfb\u5217\uff081M/270M/1B\uff09\uff0c\u91c7\u7528\u5377\u79ef KV \u95e8\u63a7\u6df7\u5408\u5668\u4e0e\u5c40\u90e8-\u5168\u5c40\u6ce8\u610f\u529b\u7684\u6df7\u5408\u67b6\u6784\uff0c\u4ee5\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u4e0b\u7684 KV-cache \u5f00\u9500\u3002\u6a21\u578b\u5728 0.5T \u7cbe\u9009\u6570\u636e\u4e0a\u8bad\u7ec3\u4e14\u4e0d\u5f00\u84b8\u998f\uff0c\u5728 NPU \u4e0a\u76f8\u6bd4\u540c\u89c4\u6a21\u6a21\u578b\u6700\u9ad8\u5b9e\u73b0 4.9 \u500d\u9884\u586b\u5145\u4e0e\u89e3\u7801\u52a0\u901f\uff0c\u5e76\u5f00\u653e\u6743\u91cd\u53ca\u591a\u5e73\u53f0\u90e8\u7f72\u4e8c\u8fdb\u5236\uff1b\u5176\u4e2d 1M \u6a21\u578b\u53ef\u5728 MCU \u4e0a\u751f\u6210\u5f0f\u8fd0\u884c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01034", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u7aef\u4fa7\u90e8\u7f72", "\u9ad8\u6548\u63a8\u7406", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01034v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Opt.Gear Technical Report", "tldr": "Opt.Gear \u63d0\u51fa\u9762\u5411\u7aef\u4fa7\u90e8\u7f72\u7684\u57fa\u7840\u8bed\u8a00\u6a21\u578b\u7cfb\u5217\uff081M/270M/1B\uff09\uff0c\u91c7\u7528\u5377\u79ef KV \u95e8\u63a7\u6df7\u5408\u5668\u4e0e\u5c40\u90e8-\u5168\u5c40\u6ce8\u610f\u529b\u7684\u6df7\u5408\u67b6\u6784\uff0c\u4ee5\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u4e0b\u7684 KV-cache \u5f00\u9500\u3002\u6a21\u578b\u5728 0.5T \u7cbe\u9009\u6570\u636e\u4e0a\u8bad\u7ec3\u4e14\u4e0d\u5f00\u84b8\u998f\uff0c\u5728 NPU \u4e0a\u76f8\u6bd4\u540c\u89c4\u6a21\u6a21\u578b\u6700\u9ad8\u5b9e\u73b0 4.9 \u500d\u9884\u586b\u5145\u4e0e\u89e3\u7801\u52a0\u901f\uff0c\u5e76\u5f00\u653e\u6743\u91cd\u53ca\u591a\u5e73\u53f0\u90e8\u7f72\u4e8c\u8fdb\u5236\uff1b\u5176\u4e2d 1M \u6a21\u578b\u53ef\u5728 MCU \u4e0a\u751f\u6210\u5f0f\u8fd0\u884c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Zero-shot image captioning aims to generate image descriptions without annotated image-text pairs. Recent approaches exploit text-to-image models to synthesize training data from text-only corpora, but most focus on improving overall data quality. In contrast, we observe that synthetic image-text misalignment is often structured and fine-grained: pairs may remain globally plausible while containing missing entities or misgrounded attributes, thereby degrading supervision fidelity. As a result, methods based on global similarity for image rematching or regeneration may improve apparent plausibility, but cannot systematically repair entity-level misalignment. To address this issue, we propose ReCap, a plug-and-play framework that shifts synthetic data refinement from implicit global matching to explicit fine-grained realignment. Specifically, ReCap enforces entity-level correspondence by using detected image-supported entities to guide caption rewriting, yielding more faithful synthetic supervision. In addition, we introduce an adaptive dynamic weighted learning strategy to downweight unreliable synthetic pairs during training. As a general framework, ReCap can be integrated into existing synthetic-data pipelines. Extensive experiments show that ReCap consistently improves image-text consistency and achieves state-of-the-art performance on both in-domain and cross-domain zero-shot image captioning benchmarks.", "arxiv_id": "2608.00994", "arxiv_url": "https://arxiv.org/abs/2608.00994", "authors": ["Zhiyue Liu", "Wenkai Zhou", "Jian Qin", "Qipeng Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa ReCap\uff0c\u7528\u4e8e\u4fee\u590d\u96f6\u6837\u672c\u56fe\u50cf\u63cf\u8ff0\u4e2d\u7531\u6587\u672c\u751f\u6210\u56fe\u50cf\u5408\u6210\u6570\u636e\u5e26\u6765\u7684\u7ec6\u7c92\u5ea6\u56fe\u6587\u9519\u914d\u3002\u5b83\u901a\u8fc7\u68c0\u6d4b\u56fe\u50cf\u4e2d\u771f\u5b9e\u652f\u6301\u7684\u5b9e\u4f53\u6765\u91cd\u5199\u63cf\u8ff0\uff0c\u5e76\u7528\u52a8\u6001\u52a0\u6743\u964d\u4f4e\u4e0d\u53ef\u9760\u6837\u672c\u5f71\u54cd\uff0c\u5728\u57df\u5185\u548c\u8de8\u57df\u57fa\u51c6\u4e0a\u63d0\u5347\u56fe\u6587\u4e00\u81f4\u6027\u5e76\u8fbe\u5230\u6700\u4f18\u6027\u80fd\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00994", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u63cf\u8ff0", "\u96f6\u6837\u672c\u5b66\u4e60", "\u5408\u6210\u6570\u636e", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00994v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Entity-Faithful Repair of Synthetic Supervision for Zero-Shot Image Captioning", "tldr": "\u8bba\u6587\u63d0\u51fa ReCap\uff0c\u7528\u4e8e\u4fee\u590d\u96f6\u6837\u672c\u56fe\u50cf\u63cf\u8ff0\u4e2d\u7531\u6587\u672c\u751f\u6210\u56fe\u50cf\u5408\u6210\u6570\u636e\u5e26\u6765\u7684\u7ec6\u7c92\u5ea6\u56fe\u6587\u9519\u914d\u3002\u5b83\u901a\u8fc7\u68c0\u6d4b\u56fe\u50cf\u4e2d\u771f\u5b9e\u652f\u6301\u7684\u5b9e\u4f53\u6765\u91cd\u5199\u63cf\u8ff0\uff0c\u5e76\u7528\u52a8\u6001\u52a0\u6743\u964d\u4f4e\u4e0d\u53ef\u9760\u6837\u672c\u5f71\u54cd\uff0c\u5728\u57df\u5185\u548c\u8de8\u57df\u57fa\u51c6\u4e0a\u63d0\u5347\u56fe\u6587\u4e00\u81f4\u6027\u5e76\u8fbe\u5230\u6700\u4f18\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper explores the challenges and the methodologies associated with learning quality representations in scenarios with unlabelled small or limited datasets for downstream information extraction task (Multidomain Named Entity Recognition (NER). The study adopts a Transfer Learning on small datasets. Traditional NER systems often rely on large, labelled data, which is impractical for many domains. This study, therefore, applies an unsupervised pre-training approach to precondition and identify entities without annotated datasets, then applies transfer learning models to different simulated limited datasets for a named entity recognition task. Entity Recognition (NER) is essential in natural language processing (NLP), it identifies and classifies related entities within the text. This study addresses the complexities of domain variability, data sparsity, and overfitting and investigates innovative approaches such as data augmentation, few-shot learning, and domain adversarial training. Integrating these techniques promises to enhance the performance and generalizability of NER systems across diverse and resource-constrained domains, paving the way for more efficient and adaptable NLP applications.", "arxiv_id": "2608.00984", "arxiv_url": "https://arxiv.org/abs/2608.00984", "authors": ["Israel Fianyi", "James Montgomery", "Soonja Yeom"], "brief": "\u672c\u6587\u7814\u7a76\u5728\u5c0f\u89c4\u6a21\u3001\u65e0\u6807\u6ce8\u6216\u4f4e\u8d44\u6e90\u6570\u636e\u573a\u666f\u4e0b\u7684\u591a\u9886\u57df\u547d\u540d\u5b9e\u4f53\u8bc6\u522b\uff0c\u91c7\u7528\u65e0\u76d1\u7763\u9884\u8bad\u7ec3\u7ed3\u5408\u8fc1\u79fb\u5b66\u4e60\u6765\u7f13\u89e3\u5bf9\u5927\u89c4\u6a21\u6807\u6ce8\u6570\u636e\u7684\u4f9d\u8d56\u3002\u6458\u8981\u8fd8\u8ba8\u8bba\u4e86\u6570\u636e\u589e\u5f3a\u3001\u5c11\u6837\u672c\u5b66\u4e60\u548c\u9886\u57df\u5bf9\u6297\u8bad\u7ec3\u7b49\u65b9\u6cd5\uff0c\u4ee5\u63d0\u5347\u8de8\u9886\u57dfNER\u7684\u6cdb\u5316\u80fd\u529b\u4e0e\u9c81\u68d2\u6027\uff0c\u4f46\u672a\u7ed9\u51fa\u660e\u786e\u5b9e\u9a8c\u6548\u679c\u3002", "categories": ["cs.CL", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00984", "impact_score": 3, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u547d\u540d\u5b9e\u4f53\u8bc6\u522b", "\u8fc1\u79fb\u5b66\u4e60", "\u5c11\u6837\u672c\u5b66\u4e60", "\u65e0\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00984v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unsupervised Multidomain Approaches to Named Entity Recognition with Small Datasets", "tldr": "\u672c\u6587\u7814\u7a76\u5728\u5c0f\u89c4\u6a21\u3001\u65e0\u6807\u6ce8\u6216\u4f4e\u8d44\u6e90\u6570\u636e\u573a\u666f\u4e0b\u7684\u591a\u9886\u57df\u547d\u540d\u5b9e\u4f53\u8bc6\u522b\uff0c\u91c7\u7528\u65e0\u76d1\u7763\u9884\u8bad\u7ec3\u7ed3\u5408\u8fc1\u79fb\u5b66\u4e60\u6765\u7f13\u89e3\u5bf9\u5927\u89c4\u6a21\u6807\u6ce8\u6570\u636e\u7684\u4f9d\u8d56\u3002\u6458\u8981\u8fd8\u8ba8\u8bba\u4e86\u6570\u636e\u589e\u5f3a\u3001\u5c11\u6837\u672c\u5b66\u4e60\u548c\u9886\u57df\u5bf9\u6297\u8bad\u7ec3\u7b49\u65b9\u6cd5\uff0c\u4ee5\u63d0\u5347\u8de8\u9886\u57dfNER\u7684\u6cdb\u5316\u80fd\u529b\u4e0e\u9c81\u68d2\u6027\uff0c\u4f46\u672a\u7ed9\u51fa\u660e\u786e\u5b9e\u9a8c\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Text-to-image (T2I) systems typically have prompt-level safety filters before the generator to block unsafe requests, yet such systems remain vulnerable to malicious jailbreak prompts. Transfer-based attacks construct adversarial prompts offline without querying the target, but they tend to overfit to a single surrogate. Moreover, they explore a large search space in which semantic or perceptual similarity alone cannot guarantee both filter evasion and preservation of the unsafe generation intent, wasting effort on low-potential candidates. We observe that the filter and the generator process the same prompt under different objectives and representations, and term this gap the Filter-Generator Discrepancy (FGD), which allows a perturbation to reduce a prompt\u0027s perceived risk to the filter while preserving the visual concept needed by the generator. Building on FGD, we propose a zero-query jailbreak framework that screens perturbations into a high-potential candidate set via observable discrepancy rules at the tokenization and semantic stages, and then performs a surrogate-ensemble evolutionary search that requires no access to the target. Experiments on six black-box pipelines and a commercial online service show that our method consistently outperforms representative baselines, raising the average attack success rate to 29.2\\% (MHSC) and 33.3\\% (Q16) across the six pipelines and improving over the strongest baseline by about 8 and 12 percentage points, respectively.", "arxiv_id": "2608.00973", "arxiv_url": "https://arxiv.org/abs/2608.00973", "authors": ["Wanguang Li", "Zhaoxin Wang", "Handing Wang"], "brief": "\u8bba\u6587\u6307\u51fa\u6587\u751f\u56fe\u7cfb\u7edf\u7684\u5b89\u5168\u8fc7\u6ee4\u5668\u4e0e\u751f\u6210\u5668\u4e4b\u95f4\u5b58\u5728\u201c\u8fc7\u6ee4\u5668-\u751f\u6210\u5668\u5dee\u5f02\u201d\uff0c\u53ef\u8ba9\u6270\u52a8\u964d\u4f4e\u8fc7\u6ee4\u5668\u611f\u77e5\u98ce\u9669\u4f46\u4fdd\u7559\u751f\u6210\u610f\u56fe\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u96f6\u67e5\u8be2\u8d8a\u72f1\u6846\u67b6\uff0c\u901a\u8fc7\u5019\u9009\u7b5b\u9009\u548c\u4ee3\u7406\u6a21\u578b\u96c6\u6210\u8fdb\u5316\u641c\u7d22\uff0c\u5728\u591a\u4e2a\u9ed1\u76d2\u6587\u751f\u56fe\u7ba1\u7ebf\u548c\u5546\u4e1a\u670d\u52a1\u4e0a\u663e\u8457\u63d0\u5347\u653b\u51fb\u6210\u529f\u7387\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00973", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u751f\u56fe", "\u5b89\u5168\u8d8a\u72f1", "\u5bf9\u6297\u653b\u51fb", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00973v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Mind the Gap: Zero-Query Jailbreaks via Filter-Generator Discrepancy in Text-to-Image Systems", "tldr": "\u8bba\u6587\u6307\u51fa\u6587\u751f\u56fe\u7cfb\u7edf\u7684\u5b89\u5168\u8fc7\u6ee4\u5668\u4e0e\u751f\u6210\u5668\u4e4b\u95f4\u5b58\u5728\u201c\u8fc7\u6ee4\u5668-\u751f\u6210\u5668\u5dee\u5f02\u201d\uff0c\u53ef\u8ba9\u6270\u52a8\u964d\u4f4e\u8fc7\u6ee4\u5668\u611f\u77e5\u98ce\u9669\u4f46\u4fdd\u7559\u751f\u6210\u610f\u56fe\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u96f6\u67e5\u8be2\u8d8a\u72f1\u6846\u67b6\uff0c\u901a\u8fc7\u5019\u9009\u7b5b\u9009\u548c\u4ee3\u7406\u6a21\u578b\u96c6\u6210\u8fdb\u5316\u641c\u7d22\uff0c\u5728\u591a\u4e2a\u9ed1\u76d2\u6587\u751f\u56fe\u7ba1\u7ebf\u548c\u5546\u4e1a\u670d\u52a1\u4e0a\u663e\u8457\u63d0\u5347\u653b\u51fb\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tabular data is used extensively in many real-world use cases. Deep learning models have been developed to deal with tabular data, but generally perform poorly when the test data distribution differs from that of the training data. Researchers have proposed test-time adaptation approaches to deal with this problem. The fully test-time adaptation (FTTA) setting involves adapting deployed classifiers to shifted target distributions using only unlabeled test data. Leading FTTA methods inherit a batch-dependent approach from computer vision literature. This paper demonstrates for the first time that such approaches degrade sharply in strict streaming regimes where examples arrive and must be classified one at a time. This occurs because at a batch size of one, batch-level statistics become unavailable or poorly estimated. We argue that singleton tabular FTTA is not merely a small-batch variant of ordinary FTTA, but a distinct identifiability problem where only the location of the model\u0027s score stream remains directly observable. To address this, we propose Prequential Logit-Origin Centering (PLOC), a lightweight approach that keeps the source model frozen and shifts the logit space at each step. PLOC stores only a single running number (the mean of past logits), requires no labels, estimates no priors, and bypasses weight updates entirely. A deferred variant applies a static shift that preserves the source ranking, and thus the AUROC, exactly. Evaluated across five tabular benchmarks, three architectures (MLP, FT-Transformer, and TabTransformer), and five independent source checkpoints, PLOC significantly outperforms strong tabular and entropy-based baselines.", "arxiv_id": "2608.01074", "arxiv_url": "https://arxiv.org/abs/2608.01074", "authors": ["Mayank Sharma", "Rohit Kumar Mourya", "Pratik Mazumder"], "brief": "\u672c\u6587\u7814\u7a76\u8868\u683c\u6570\u636e\u5728\u4e25\u683c\u6d41\u5f0f\u3001\u5355\u6837\u672c\u5230\u8fbe\u573a\u666f\u4e0b\u7684\u5b8c\u5168\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\uff0c\u6307\u51fa\u73b0\u6709\u4f9d\u8d56\u6279\u7edf\u8ba1\u7684\u65b9\u6cd5\u5728 batch size \u4e3a 1 \u65f6\u4f1a\u660e\u663e\u9000\u5316\u3002\u4f5c\u8005\u63d0\u51fa PLOC\uff0c\u901a\u8fc7\u51bb\u7ed3\u6e90\u6a21\u578b\u5e76\u5bf9 logit \u7a7a\u95f4\u505a\u5728\u7ebf\u4e2d\u5fc3\u5316\uff0c\u4ec5\u9700\u7ef4\u62a4\u8fc7\u53bb logits \u7684\u5747\u503c\u3001\u65e0\u9700\u6807\u7b7e\u6216\u6743\u91cd\u66f4\u65b0\uff0c\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u548c\u6a21\u578b\u67b6\u6784\u4e0a\u663e\u8457\u4f18\u4e8e\u5f3a\u57fa\u7ebf\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01074", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94", "\u8868\u683c\u6570\u636e", "\u5206\u5e03\u504f\u79fb", "\u6d41\u5f0f\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01074v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Logit-Origin Centering for Singleton Test-Time Adaptation", "tldr": "\u672c\u6587\u7814\u7a76\u8868\u683c\u6570\u636e\u5728\u4e25\u683c\u6d41\u5f0f\u3001\u5355\u6837\u672c\u5230\u8fbe\u573a\u666f\u4e0b\u7684\u5b8c\u5168\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\uff0c\u6307\u51fa\u73b0\u6709\u4f9d\u8d56\u6279\u7edf\u8ba1\u7684\u65b9\u6cd5\u5728 batch size \u4e3a 1 \u65f6\u4f1a\u660e\u663e\u9000\u5316\u3002\u4f5c\u8005\u63d0\u51fa PLOC\uff0c\u901a\u8fc7\u51bb\u7ed3\u6e90\u6a21\u578b\u5e76\u5bf9 logit \u7a7a\u95f4\u505a\u5728\u7ebf\u4e2d\u5fc3\u5316\uff0c\u4ec5\u9700\u7ef4\u62a4\u8fc7\u53bb logits \u7684\u5747\u503c\u3001\u65e0\u9700\u6807\u7b7e\u6216\u6743\u91cd\u66f4\u65b0\uff0c\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u548c\u6a21\u578b\u67b6\u6784\u4e0a\u663e\u8457\u4f18\u4e8e\u5f3a\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autoregressive rigging models such as UniRig and SkinTokens perform well on articulated characters, but their ability to generalize to plant structures remains largely unexplored, since plant topologies exhibit highly variable, non-canonical branching patterns that challenge learned skeletal priors. We evaluate these models for plant skeletal reconstruction using synthetic L-system-generated trees and real scanned data spanning monopodial, sympodial, whorled, and vine-like archetypes. Preliminary testing showed UniRig collapsing complex branching into near-linear chains, while SkinTokens preserved topology better but over-segmented branches and produced an unstable output space, so we focused on UniRig for its greater stability. Diagnosis traced the collapse to sampling-level suppression of branch tokens, and further analysis showed the frozen mesh encoder had limited sensitivity to structural variation, pointing to a geometric bottleneck in the tokenization pipeline rather than a purely learned bias. Building on these findings, we applied multi-round fine-tuning over multiple procedurally generated synthetic datasets. Across rounds, the model progressively recovered accurate branching topology and generalized beyond branch-only structures to plants with foliage, a harder case given the zero-thickness, mesh-normal-dependent geometry of leaves. The resulting model generalized well across diverse plant forms without leaf-specific architectural changes, indicating that targeted fine-tuning can substantially close the domain gap between character-rigging priors and plant skeletal structure. As such, our work points toward a viable path for automated plant rigging across both branch topology and foliage type, even those not considered in our findings.", "arxiv_id": "2608.01072", "arxiv_url": "https://arxiv.org/abs/2608.01072", "authors": ["Nathan Hu", "Yang Yang", "Fumio Okura"], "brief": "\u672c\u6587\u8bc4\u4f30\u5e76\u6539\u9020\u81ea\u56de\u5f52\u89d2\u8272\u7ed1\u5b9a\u6a21\u578b\u7528\u4e8e\u690d\u7269\u9aa8\u67b6\u91cd\u5efa\uff0c\u53d1\u73b0 UniRig \u5728\u690d\u7269\u5206\u652f\u4e0a\u4f1a\u9000\u5316\u4e3a\u8fd1\u7ebf\u6027\u94fe\uff0c\u4e3b\u8981\u6e90\u4e8e\u91c7\u6837\u9636\u6bb5\u6291\u5236\u5206\u652f token \u4ee5\u53ca\u7f51\u683c\u7f16\u7801\u5668\u7684\u51e0\u4f55\u8868\u5f81\u74f6\u9888\u3002\u901a\u8fc7\u591a\u8f6e\u57fa\u4e8e\u7a0b\u5e8f\u751f\u6210\u5408\u6210\u690d\u7269\u6570\u636e\u7684\u5fae\u8c03\uff0c\u6a21\u578b\u9010\u6b65\u6062\u590d\u51c6\u786e\u5206\u652f\u62d3\u6251\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u5e26\u53f6\u7247\u7684\u771f\u5b9e\u548c\u591a\u6837\u690d\u7269\u5f62\u6001\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01072", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u4e09\u7ef4\u91cd\u5efa", "\u9aa8\u67b6\u7ed1\u5b9a", "\u690d\u7269\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01072v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PlantRig - From Bones to Branches: Adaptation of Autoregressive Rigging Models for Plant Skeletal Reconstruction", "tldr": "\u672c\u6587\u8bc4\u4f30\u5e76\u6539\u9020\u81ea\u56de\u5f52\u89d2\u8272\u7ed1\u5b9a\u6a21\u578b\u7528\u4e8e\u690d\u7269\u9aa8\u67b6\u91cd\u5efa\uff0c\u53d1\u73b0 UniRig \u5728\u690d\u7269\u5206\u652f\u4e0a\u4f1a\u9000\u5316\u4e3a\u8fd1\u7ebf\u6027\u94fe\uff0c\u4e3b\u8981\u6e90\u4e8e\u91c7\u6837\u9636\u6bb5\u6291\u5236\u5206\u652f token \u4ee5\u53ca\u7f51\u683c\u7f16\u7801\u5668\u7684\u51e0\u4f55\u8868\u5f81\u74f6\u9888\u3002\u901a\u8fc7\u591a\u8f6e\u57fa\u4e8e\u7a0b\u5e8f\u751f\u6210\u5408\u6210\u690d\u7269\u6570\u636e\u7684\u5fae\u8c03\uff0c\u6a21\u578b\u9010\u6b65\u6062\u590d\u51c6\u786e\u5206\u652f\u62d3\u6251\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u5e26\u53f6\u7247\u7684\u771f\u5b9e\u548c\u591a\u6837\u690d\u7269\u5f62\u6001\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Training-free test-time defenses offer a practical way to improve the adversarial robustness of CLIP-style vision--language models without modifying the pretrained model. However, their correction strength is typically fixed for a narrow range of attack budgets, even though the attack budget is unknown at inference and the required correction varies across samples. We show that this mismatch causes existing defenses to degrade sharply as attacks strengthen. We introduce ReACT-CLIP, a response-conditioned test-time defense that separately determines how strongly each input should be corrected and whether defensive intervention is necessary. Our key observation is that the relative increase in CLIP visual-feature drift between low- and high-noise probes provides a graded, sample-specific proxy for correction demand. ReACT-CLIP maps this relative cross-noise drift to the Gaussian noise scale used to construct a stable, noise-averaged feature anchor, enabling the corrective reach to adapt to each input. To determine whether intervention is necessary, we further observe that clean inputs retain stable class-probability distributions under weak spatial augmentations, whereas adversarial inputs exhibit greater variation. ReACT-CLIP quantifies this variation using a prediction-instability score computed by Jensen--Shannon divergence and combines it with relative cross-noise drift to form the defensive intervention score. ReACT-CLIP requires no model or prompt training, and its correction-strength mapping is calibrated once and fixed across datasets and attack budgets. Across 12 downstream datasets, as well as ImageNet and its distribution-shifted variants, ReACT-CLIP delivers substantial robustness gains across diverse attack types and strengths while largely preserving clean accuracy.", "arxiv_id": "2608.01067", "arxiv_url": "https://arxiv.org/abs/2608.01067", "authors": ["Hashmat Shadab Malik", "Toluwani Aremu", "Samuele Poppi", "Muzammal Naseer", "Salman Khan"], "brief": "ReACT-CLIP \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u6d4b\u8bd5\u65f6\u9632\u5fa1\u65b9\u6cd5\uff0c\u6839\u636e\u8f93\u5165\u5728\u4e0d\u540c\u566a\u58f0\u63a2\u6d4b\u4e0b\u7684\u89c6\u89c9\u7279\u5f81\u6f02\u79fb\uff0c\u81ea\u9002\u5e94\u51b3\u5b9a CLIP \u9700\u8981\u591a\u5f3a\u7684\u7ea0\u6b63\uff1b\u540c\u65f6\u7528\u5f31\u7a7a\u95f4\u589e\u5f3a\u4e0b\u7684\u9884\u6d4b\u4e0d\u7a33\u5b9a\u6027\u5224\u65ad\u662f\u5426\u9700\u8981\u5e72\u9884\u3002\u8be5\u65b9\u6cd5\u5728 12 \u4e2a\u4e0b\u6e38\u6570\u636e\u96c6\u3001ImageNet \u53ca\u5206\u5e03\u504f\u79fb\u53d8\u4f53\u4e0a\uff0c\u5bf9\u591a\u79cd\u653b\u51fb\u5f3a\u5ea6\u548c\u7c7b\u578b\u5e26\u6765\u663e\u8457\u9c81\u68d2\u6027\u63d0\u5347\uff0c\u5e76\u57fa\u672c\u4fdd\u6301\u5e72\u51c0\u6837\u672c\u51c6\u786e\u7387\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01067", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5bf9\u6297\u9c81\u68d2\u6027", "\u6d4b\u8bd5\u65f6\u9632\u5fa1", "CLIP"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01067v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReACT-CLIP: Response-Aware Test-Time Defense for Vision--Language Models", "tldr": "ReACT-CLIP \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u6d4b\u8bd5\u65f6\u9632\u5fa1\u65b9\u6cd5\uff0c\u6839\u636e\u8f93\u5165\u5728\u4e0d\u540c\u566a\u58f0\u63a2\u6d4b\u4e0b\u7684\u89c6\u89c9\u7279\u5f81\u6f02\u79fb\uff0c\u81ea\u9002\u5e94\u51b3\u5b9a CLIP \u9700\u8981\u591a\u5f3a\u7684\u7ea0\u6b63\uff1b\u540c\u65f6\u7528\u5f31\u7a7a\u95f4\u589e\u5f3a\u4e0b\u7684\u9884\u6d4b\u4e0d\u7a33\u5b9a\u6027\u5224\u65ad\u662f\u5426\u9700\u8981\u5e72\u9884\u3002\u8be5\u65b9\u6cd5\u5728 12 \u4e2a\u4e0b\u6e38\u6570\u636e\u96c6\u3001ImageNet \u53ca\u5206\u5e03\u504f\u79fb\u53d8\u4f53\u4e0a\uff0c\u5bf9\u591a\u79cd\u653b\u51fb\u5f3a\u5ea6\u548c\u7c7b\u578b\u5e26\u6765\u663e\u8457\u9c81\u68d2\u6027\u63d0\u5347\uff0c\u5e76\u57fa\u672c\u4fdd\u6301\u5e72\u51c0\u6837\u672c\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cross-view geo-localization (CVGL) retrieves geo-tagged satellite imagery for a ground-view query. Most systems exhaustively search a flat, fixed-resolution gallery, incurring high cost over large areas and adapting poorly to satellite resolution changes. Autoregressive coarse-to-fine alternatives reduce comparisons but bind later predictions to earlier decisions and a predefined hierarchy. We introduce GeoMoE, a sparse mixture-of-experts dual encoder that decouples global multi-scale representation learning from local hierarchical search. Global multi-scale supervision and content-adaptive routing map ground and satellite images across resolutions into a globally comparable embedding space. At inference, each image is encoded once, and probabilistic beam search follows parent--child links to score a small candidate subset. Later levels reuse these descriptors rather than features generated by preceding levels, limiting feature-level error propagation and hierarchy coupling. We further introduce VIGOR-M, a four-city benchmark with an explicit parent--child satellite hierarchy and held-out half-step galleries for single-resolution, cross-resolution, and hierarchical evaluation. GeoMoE achieves 95.78% R@40m on Just Zoom In, 2.77 percentage points above the previous best, and 62.39% R@1 on VIGOR-M. The latter requires 0.885 MMAC/query for descriptor matching, 5.27% of an exhaustive L3 scan, while exceeding the strongest exhaustive baseline by 3.12 percentage points in R@1. One model trained on L1, L2, and L3 also outperforms a matched dense control across all six galleries and transfers to three withheld resolutions. By decoupling globally trained embeddings from local hierarchical search, GeoMoE jointly improves localization accuracy, search efficiency, and cross-resolution transfer.", "arxiv_id": "2608.01060", "arxiv_url": "https://arxiv.org/abs/2608.01060", "authors": ["Ruijie Fan", "Junyan Ye", "Qi Zhu", "Weijia Li"], "brief": "\u8bba\u6587\u63d0\u51fa GeoMoE\uff0c\u4e00\u79cd\u7a00\u758f\u6df7\u5408\u4e13\u5bb6\u53cc\u7f16\u7801\u5668\uff0c\u7528\u4e8e\u8de8\u89c6\u89d2\u5730\u7406\u5b9a\u4f4d\u4e2d\u7684\u591a\u5c3a\u5ea6\u8868\u793a\u5b66\u4e60\u4e0e\u9ad8\u6548\u5c42\u7ea7\u68c0\u7d22\u3002\u5b83\u901a\u8fc7\u5168\u5c40\u591a\u5c3a\u5ea6\u76d1\u7763\u548c\u5185\u5bb9\u81ea\u9002\u5e94\u8def\u7531\u63d0\u5347\u8de8\u5206\u8fa8\u7387\u6cdb\u5316\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u7528\u6982\u7387\u675f\u641c\u7d22\u53ea\u5339\u914d\u5c11\u91cf\u5019\u9009\uff0c\u663e\u8457\u964d\u4f4e\u8ba1\u7b97\u91cf\u3002\u5b9e\u9a8c\u5728 Just Zoom In \u548c\u65b0\u57fa\u51c6 VIGOR-M \u4e0a\u53d6\u5f97\u66f4\u9ad8\u53ec\u56de\u7387\uff0c\u540c\u65f6\u5339\u914d\u6210\u672c\u4ec5\u4e3a\u7a77\u4e3e\u626b\u63cf\u7684\u4e00\u5c0f\u90e8\u5206\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01060", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8de8\u89c6\u89d2\u5730\u7406\u5b9a\u4f4d", "\u6df7\u5408\u4e13\u5bb6", "\u591a\u5c3a\u5ea6", "\u56fe\u50cf\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01060v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One Query, Many Scales: Sparse Mixture-of-Experts for Efficient Hierarchical Cross-View Geo-Localization", "tldr": "\u8bba\u6587\u63d0\u51fa GeoMoE\uff0c\u4e00\u79cd\u7a00\u758f\u6df7\u5408\u4e13\u5bb6\u53cc\u7f16\u7801\u5668\uff0c\u7528\u4e8e\u8de8\u89c6\u89d2\u5730\u7406\u5b9a\u4f4d\u4e2d\u7684\u591a\u5c3a\u5ea6\u8868\u793a\u5b66\u4e60\u4e0e\u9ad8\u6548\u5c42\u7ea7\u68c0\u7d22\u3002\u5b83\u901a\u8fc7\u5168\u5c40\u591a\u5c3a\u5ea6\u76d1\u7763\u548c\u5185\u5bb9\u81ea\u9002\u5e94\u8def\u7531\u63d0\u5347\u8de8\u5206\u8fa8\u7387\u6cdb\u5316\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u7528\u6982\u7387\u675f\u641c\u7d22\u53ea\u5339\u914d\u5c11\u91cf\u5019\u9009\uff0c\u663e\u8457\u964d\u4f4e\u8ba1\u7b97\u91cf\u3002\u5b9e\u9a8c\u5728 Just Zoom In \u548c\u65b0\u57fa\u51c6 VIGOR-M \u4e0a\u53d6\u5f97\u66f4\u9ad8\u53ec\u56de\u7387\uff0c\u540c\u65f6\u5339\u914d\u6210\u672c\u4ec5\u4e3a\u7a77\u4e3e\u626b\u63cf\u7684\u4e00\u5c0f\u90e8\u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial Intelligence is increasingly applied to surgical video analysis for phase segmentation, skill assessment, and workflow optimization. A key challenge is the length of surgical recordings, often one to several hours, creating substantial computational burden. We previously developed Kinematics-Adaptive Frame Recognition (KAFR) for robotic surgery, showing that tracking tool motion effectively identifies informative frames while filtering redundant content. However, laparoscopic surgery introduces additional challenges: manual camera control causes frequent motion artifacts, and image quality is generally lower than robotic systems. This study evaluates whether KAFR generalizes to laparoscopic surgery using the Cholec80 benchmark, comprising 80 laparoscopic cholecystectomy procedures annotated for seven surgical phases. KAFR operates in three stages: a fine-tuned YOLO model detects and segments surgical tools; frames are adaptively selected based on tool displacement or velocity variation; and an X3D model classifies selected frames into surgical phases. KAFR achieved a 91.0\\% F1 score using only 0.58\\% of frames for phase classification, representing an approximately seven-fold reduction compared to typical 4\\% frame sampling, while maintaining performance comparable to LoViT (90.2\\%) and Trans-SVNet (89.7\\%). These results demonstrate that kinematics-based frame selection transfers effectively to the challenging laparoscopic environment.", "arxiv_id": "2608.01058", "arxiv_url": "https://arxiv.org/abs/2608.01058", "authors": ["Huu Phong Nguyen", "Shekhar Madhav Khairnar", "Ganesh Sankaranarayanan"], "brief": "\u8bba\u6587\u5c06 KAFR \u6269\u5c55\u5230\u8179\u8154\u955c\u624b\u672f\u89c6\u9891\u5206\u6790\uff0c\u901a\u8fc7 YOLO \u68c0\u6d4b/\u5206\u5272\u5668\u68b0\uff0c\u5e76\u4f9d\u636e\u5668\u68b0\u4f4d\u79fb\u6216\u901f\u5ea6\u53d8\u5316\u81ea\u9002\u5e94\u9009\u62e9\u5173\u952e\u5e27\uff0c\u518d\u7528 X3D \u8fdb\u884c\u624b\u672f\u9636\u6bb5\u5206\u7c7b\u3002\u5728 Cholec80 \u4e0a\u4ec5\u4f7f\u7528 0.58% \u5e27\u5373\u8fbe\u5230 91.0% F1\uff0c\u6027\u80fd\u63a5\u8fd1\u6216\u8d85\u8fc7 LoViT\u3001Trans-SVNet\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u8ba1\u7b97\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01058", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u624b\u672f\u89c6\u9891", "\u89c6\u9891\u7406\u89e3", "\u76ee\u6807\u68c0\u6d4b", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01058v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Extended KAFR: A kinematic-adaptive paradigm for the efficient analysis of surgical video", "tldr": "\u8bba\u6587\u5c06 KAFR \u6269\u5c55\u5230\u8179\u8154\u955c\u624b\u672f\u89c6\u9891\u5206\u6790\uff0c\u901a\u8fc7 YOLO \u68c0\u6d4b/\u5206\u5272\u5668\u68b0\uff0c\u5e76\u4f9d\u636e\u5668\u68b0\u4f4d\u79fb\u6216\u901f\u5ea6\u53d8\u5316\u81ea\u9002\u5e94\u9009\u62e9\u5173\u952e\u5e27\uff0c\u518d\u7528 X3D \u8fdb\u884c\u624b\u672f\u9636\u6bb5\u5206\u7c7b\u3002\u5728 Cholec80 \u4e0a\u4ec5\u4f7f\u7528 0.58% \u5e27\u5373\u8fbe\u5230 91.0% F1\uff0c\u6027\u80fd\u63a5\u8fd1\u6216\u8d85\u8fc7 LoViT\u3001Trans-SVNet\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u8ba1\u7b97\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Constructing photorealistic Free-Viewpoint Videos (FVVs) of dynamic scenes from a set of posed 2D images has been an intriguing yet challenging task in computer vision. Methods based on neural rendering achieve high-fidelity image quality in FVV construction. However, most of these methods are unable to achieve real-time rendering and often require complete video sequences to train. Despite the existence of some online training methods capable of rendering FVVs in real time, they struggle to meet the requirements for storage and training time for downstream applications. To overcome this problem, we propose Struct-GStream, which can achieve efficient FVV streaming using structured 3D Gaussians (3DGs). Specifically, we introduce dynamic anchor points to generate structured 3DGs to construct basic scenes and model approximate scene movements based on the assumption of local rigidity in object motion. Besides, we introduce a global free 3DGs patching strategy involving free 3DGs\u0027 generation, pruning, and optimization to patch and model deficient areas and emerging objects. Our method achieves fast training at low bitrates while maintaining high rendering quality. Extensive experiments demonstrate that Struct-GStream significantly outperforms existing online training methods for FVV construction in terms of training time, storage, and rendering quality while maintaining competitive rendering speed.", "arxiv_id": "2608.01053", "arxiv_url": "https://arxiv.org/abs/2608.01053", "authors": ["Han Jiao", "Jiakai Sun", "Lei Zhao", "Wei Xing", "Huaizhong Lin", "Zhanjie Zhang", "Ao Ma"], "brief": "\u8bba\u6587\u63d0\u51fa Struct-GStream\uff0c\u7528\u7ed3\u6784\u5316 3D Gaussian \u5b9e\u73b0\u4f4e\u7801\u7387\u4e0b\u7684\u9ad8\u6548\u81ea\u7531\u89c6\u70b9\u89c6\u9891\u6d41\u5f0f\u6784\u5efa\u3002\u65b9\u6cd5\u901a\u8fc7\u52a8\u6001\u951a\u70b9\u5efa\u6a21\u5c40\u90e8\u521a\u6027\u8fd0\u52a8\uff0c\u5e76\u7528\u81ea\u7531 3D Gaussian \u8865\u4e01\u4fee\u590d\u7f3a\u5931\u533a\u57df\u548c\u65b0\u51fa\u73b0\u7269\u4f53\uff0c\u5728\u8bad\u7ec3\u65f6\u95f4\u3001\u5b58\u50a8\u5360\u7528\u548c\u6e32\u67d3\u8d28\u91cf\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u5728\u7ebf\u8bad\u7ec3\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01053", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u7531\u89c6\u70b9\u89c6\u9891", "3D\u9ad8\u65af", "\u795e\u7ecf\u6e32\u67d3", "\u89c6\u9891\u6d41"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01053v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Struct-GStream: Towards Efficient Free-Viewpoint Video Streaming at Low-Bitrates with Structured 3D Gaussians", "tldr": "\u8bba\u6587\u63d0\u51fa Struct-GStream\uff0c\u7528\u7ed3\u6784\u5316 3D Gaussian \u5b9e\u73b0\u4f4e\u7801\u7387\u4e0b\u7684\u9ad8\u6548\u81ea\u7531\u89c6\u70b9\u89c6\u9891\u6d41\u5f0f\u6784\u5efa\u3002\u65b9\u6cd5\u901a\u8fc7\u52a8\u6001\u951a\u70b9\u5efa\u6a21\u5c40\u90e8\u521a\u6027\u8fd0\u52a8\uff0c\u5e76\u7528\u81ea\u7531 3D Gaussian \u8865\u4e01\u4fee\u590d\u7f3a\u5931\u533a\u57df\u548c\u65b0\u51fa\u73b0\u7269\u4f53\uff0c\u5728\u8bad\u7ec3\u65f6\u95f4\u3001\u5b58\u50a8\u5360\u7528\u548c\u6e32\u67d3\u8d28\u91cf\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u5728\u7ebf\u8bad\u7ec3\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Current advancements in Multimodal Anomaly Detection (MAD) are largely driven by enhancing multimodal fusion, particularly through the integration of RGB and Depth data for richer anomaly representation. However, less attention was devoted to analyzing the role of cross-modal fusion bias, a well-known challenge in multimodal learning, in MAD. This gap motivates a key question: can we overcome this bias to break the performance bottleneck of current work? In this paper, we first analyze the impact of cross-modal fusion bias in MAD via the Fisher Information Matrix. Then, grounded in these findings, we propose UCFB, a simple yet effective plug-and-play framework designed to mitigate cross-modal fusion bias in MAD. It achieves this by jointly employing Fisher-information-guided dynamic calibration to adjust modality-specific regularization weights and canonical similarity analysis to improve inter-modal interactions. Extensive experiments on the MVTec 3D-AD and Eyecandies datasets demonstrate that UCFB achieves consistent improvements in single-class, multi-class, and few-shot settings.", "arxiv_id": "2608.00986", "arxiv_url": "https://arxiv.org/abs/2608.00986", "authors": ["Kaifang Long", "Lianbo Ma", "Liming Liu", "Guoyang Xie"], "brief": "\u8bba\u6587\u4ece Fisher \u4fe1\u606f\u77e9\u9635\u89d2\u5ea6\u5206\u6790\u591a\u6a21\u6001\u5f02\u5e38\u68c0\u6d4b\u4e2d\u7684\u8de8\u6a21\u6001\u878d\u5408\u504f\u7f6e\uff0c\u6307\u51fa\u5176\u4f1a\u9650\u5236 RGB-Depth \u878d\u5408\u5e26\u6765\u7684\u6027\u80fd\u63d0\u5347\u3002\u4f5c\u8005\u63d0\u51fa\u5373\u63d2\u5373\u7528\u6846\u67b6 UCFB\uff0c\u901a\u8fc7 Fisher \u4fe1\u606f\u5f15\u5bfc\u7684\u52a8\u6001\u6821\u51c6\u548c\u5178\u578b\u76f8\u4f3c\u6027\u5206\u6790\u7f13\u89e3\u504f\u7f6e\uff0c\u5728 MVTec 3D-AD \u4e0e Eyecandies \u4e0a\u7684\u5355\u7c7b\u3001\u591a\u7c7b\u3001\u5c11\u6837\u672c\u8bbe\u7f6e\u5747\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00986", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5f02\u5e38\u68c0\u6d4b", "\u8de8\u6a21\u6001\u878d\u5408", "Fisher\u4fe1\u606f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00986v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Understanding and Overcoming Cross-modal Fusion Bias in Multimodal Anomaly Detection From A Fisher Information Perspective", "tldr": "\u8bba\u6587\u4ece Fisher \u4fe1\u606f\u77e9\u9635\u89d2\u5ea6\u5206\u6790\u591a\u6a21\u6001\u5f02\u5e38\u68c0\u6d4b\u4e2d\u7684\u8de8\u6a21\u6001\u878d\u5408\u504f\u7f6e\uff0c\u6307\u51fa\u5176\u4f1a\u9650\u5236 RGB-Depth \u878d\u5408\u5e26\u6765\u7684\u6027\u80fd\u63d0\u5347\u3002\u4f5c\u8005\u63d0\u51fa\u5373\u63d2\u5373\u7528\u6846\u67b6 UCFB\uff0c\u901a\u8fc7 Fisher \u4fe1\u606f\u5f15\u5bfc\u7684\u52a8\u6001\u6821\u51c6\u548c\u5178\u578b\u76f8\u4f3c\u6027\u5206\u6790\u7f13\u89e3\u504f\u7f6e\uff0c\u5728 MVTec 3D-AD \u4e0e Eyecandies \u4e0a\u7684\u5355\u7c7b\u3001\u591a\u7c7b\u3001\u5c11\u6837\u672c\u8bbe\u7f6e\u5747\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fine-grained visual representations are essential for medical image analysis, particularly when diagnostically relevant evidence is subtle and spatially localized. Modern transformer-based medical vision encoders must therefore learn patch-level representations that are both clinically meaningful and spatially consistent. Without these properties, large vision-language models (LVLMs) operate on an ambiguous visual foundation, limiting their ability to generate clinically reliable and spatially grounded responses. However, existing training strategies for medical vision encoders rarely achieve both objectives. Image-text alignment provides clinically meaningful supervision primarily at the image level, leaving the spatial localization of diagnostic evidence weakly constrained. In contrast, self-supervised learning promotes spatial consistency but lacks the semantic supervision needed to distinguish visually similar yet clinically distinct regions. To address this gap, we present LoFi, a medical vision foundation model built on location-aware fine-grained representation learning. LoFi trains a vision encoder with a lightweight large language model under grounding and grounded captioning objectives. Because these objectives require predicting location from clinical text and vice versa, spatial consistency emerges without any explicit patch-level regularization. To enable training at scale, we construct MedG, a large-scale medical grounding dataset of 4.48M image-text-box triplets curated from 84 datasets spanning 7 modalities. Across phrase grounding, visual question answering, and region-based organ classification under perturbations, LoFi consistently outperforms general-purpose and medical vision foundation models as well as state-of-the-art LVLMs. Code is available at https://github.com/myeongkyunkang/lofi-medg.", "arxiv_id": "2608.00976", "arxiv_url": "https://arxiv.org/abs/2608.00976", "authors": ["Myeongkyun Kang", "Yanting Yang", "Xiaoxiao Li"], "brief": "\u8bba\u6587\u63d0\u51fa LoFi\uff0c\u4e00\u79cd\u9762\u5411\u533b\u5b66\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u7684\u4f4d\u7f6e\u611f\u77e5\u7ec6\u7c92\u5ea6\u8868\u793a\u5b66\u4e60\u65b9\u6cd5\uff0c\u901a\u8fc7 grounding \u4e0e grounded captioning \u4efb\u52a1\u8054\u5408\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u548c\u8f7b\u91cf\u8bed\u8a00\u6a21\u578b\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 448 \u4e07\u56fe\u6587\u6846\u4e09\u5143\u7ec4\u7684 MedG \u6570\u636e\u96c6\uff0c\u8986\u76d6 7 \u79cd\u533b\u5b66\u6a21\u6001\uff1b\u5b9e\u9a8c\u663e\u793a LoFi \u5728\u77ed\u8bed\u5b9a\u4f4d\u3001\u89c6\u89c9\u95ee\u7b54\u548c\u6270\u52a8\u4e0b\u533a\u57df\u5668\u5b98\u5206\u7c7b\u7b49\u4efb\u52a1\u4e0a\u4f18\u4e8e\u901a\u7528\u53ca\u533b\u5b66\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u548c\u73b0\u6709 LVLM\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00976", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00976v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Location-Aware Fine-Grained Representation Learning for Medical Vision Foundation Models", "tldr": "\u8bba\u6587\u63d0\u51fa LoFi\uff0c\u4e00\u79cd\u9762\u5411\u533b\u5b66\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u7684\u4f4d\u7f6e\u611f\u77e5\u7ec6\u7c92\u5ea6\u8868\u793a\u5b66\u4e60\u65b9\u6cd5\uff0c\u901a\u8fc7 grounding \u4e0e grounded captioning \u4efb\u52a1\u8054\u5408\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u548c\u8f7b\u91cf\u8bed\u8a00\u6a21\u578b\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 448 \u4e07\u56fe\u6587\u6846\u4e09\u5143\u7ec4\u7684 MedG \u6570\u636e\u96c6\uff0c\u8986\u76d6 7 \u79cd\u533b\u5b66\u6a21\u6001\uff1b\u5b9e\u9a8c\u663e\u793a LoFi \u5728\u77ed\u8bed\u5b9a\u4f4d\u3001\u89c6\u89c9\u95ee\u7b54\u548c\u6270\u52a8\u4e0b\u533a\u57df\u5668\u5b98\u5206\u7c7b\u7b49\u4efb\u52a1\u4e0a\u4f18\u4e8e\u901a\u7528\u53ca\u533b\u5b66\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u548c\u73b0\u6709 LVLM\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large vision--language models (VLMs) can reason step by step about complex visual scenes, but this open-ended, autoregressive chain-of-thought (CoT) approach is poorly suited to safety-critical, rule-governed settings such as industrial surveillance, where decisions must be bounded, deterministic, and low-latency. Because CoT inference cost scales jointly with reasoning length and the number of concurrent streams, it creates a throughput bottleneck that precludes the real-time, multistream monitoring required for industrial accountability. Here we present MonitorVLM-v2, a deployment-oriented framework that recasts VLM-based safety assessment as probabilistic inference over a finite regulatory decision space, compressing multimodal reasoning into single-step rule-ID predictions and reducing decoding from a variable-length sequence to a single token. We introduce symbolic policy optimization (SymPO), a novel contrastive policy optimization algorithm that sharpens decision boundaries within this finite symbolic space, together with an entropy-driven triage mechanism that routes uncertain predictions to human reviewers for expert confirmation. In a four-month prospective deployment across 10 concurrent camera feeds in an operational underground mining facility, MonitorVLM-v2 achieved a 19.45-fold increase in inference speed and identified 2.78 times as many confirmed violations as the site\u0027s routine manual inspection workflow, demonstrating the practical value of compressed symbolic decision-making for real-time, auditable industrial monitoring.", "arxiv_id": "2608.00975", "arxiv_url": "https://arxiv.org/abs/2608.00975", "authors": ["Jiang Wu", "Sichao Wu", "Yinsong Ma", "Lifang Zheng", "Jingliang Duan"], "brief": "MonitorVLM-v2 \u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u5b89\u5168\u8fdd\u89c4\u68c0\u6d4b\u4ece\u5f00\u653e\u5f0f\u601d\u7ef4\u94fe\u63a8\u7406\u6539\u4e3a\u6709\u9650\u89c4\u5219\u7a7a\u95f4\u4e2d\u7684\u5355\u6b65\u89c4\u5219ID\u9884\u6d4b\uff0c\u663e\u8457\u964d\u4f4e\u591a\u8def\u5b9e\u65f6\u76d1\u63a7\u7684\u63a8\u7406\u5f00\u9500\u3002\u5176\u5f15\u5165\u7b26\u53f7\u7b56\u7565\u4f18\u5316\u548c\u4e0d\u786e\u5b9a\u6837\u672c\u4eba\u5de5\u590d\u6838\u673a\u5236\uff0c\u5728\u77ff\u5c7110\u8def\u6444\u50cf\u5934\u56db\u4e2a\u6708\u90e8\u7f72\u4e2d\u5b9e\u73b019.45\u500d\u63a8\u7406\u52a0\u901f\uff0c\u5e76\u53d1\u73b02.78\u500d\u4e8e\u4eba\u5de5\u5de1\u68c0\u7684\u786e\u8ba4\u8fdd\u89c4\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00975", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u68c0\u6d4b", "\u5b9e\u65f6\u76d1\u63a7", "\u4eba\u673a\u534f\u540c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00975v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MonitorVLM-v2: A Deployed Vision-Language Framework for Real-Time Safety Violation Detection", "tldr": "MonitorVLM-v2 \u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u5b89\u5168\u8fdd\u89c4\u68c0\u6d4b\u4ece\u5f00\u653e\u5f0f\u601d\u7ef4\u94fe\u63a8\u7406\u6539\u4e3a\u6709\u9650\u89c4\u5219\u7a7a\u95f4\u4e2d\u7684\u5355\u6b65\u89c4\u5219ID\u9884\u6d4b\uff0c\u663e\u8457\u964d\u4f4e\u591a\u8def\u5b9e\u65f6\u76d1\u63a7\u7684\u63a8\u7406\u5f00\u9500\u3002\u5176\u5f15\u5165\u7b26\u53f7\u7b56\u7565\u4f18\u5316\u548c\u4e0d\u786e\u5b9a\u6837\u672c\u4eba\u5de5\u590d\u6838\u673a\u5236\uff0c\u5728\u77ff\u5c7110\u8def\u6444\u50cf\u5934\u56db\u4e2a\u6708\u90e8\u7f72\u4e2d\u5b9e\u73b019.45\u500d\u63a8\u7406\u52a0\u901f\uff0c\u5e76\u53d1\u73b02.78\u500d\u4e8e\u4eba\u5de5\u5de1\u68c0\u7684\u786e\u8ba4\u8fdd\u89c4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We propose Swimm3R, a unified framework that combines medium-aware structure-from-motion (SfM) with Underwater Beta Splatting to address scattering- and attenuation-induced failures in underwater 3D reconstruction. Swimm3R distills in-air geometric priors into a feed-forward backbone and uses a physics head to regress underwater image-formation parameters, camera poses, and restored point clouds. Additionally, we introduce Underwater Beta Splatting, which extends Gaussian splatting with Beta primitives and scattering-aware geometric gradients for stable underwater geometry representation. We further establish the Barbados underwater video dataset to demonstrate the effectiveness of our method in challenging underwater environments. On this dataset, Swimm3R robustly recovers underwater scene structure under challenging scattering conditions, yielding coherent seafloor geometry. Using these predicted point clouds, the proposed Underwater Beta Splatting improves average PSNR by $1.47$ dB over WaterSplatting while increasing downstream localization performance by $2.0$ and $2.4$ percentage points in RRA@15 and RTA@15, respectively.", "arxiv_id": "2608.00950", "arxiv_url": "https://arxiv.org/abs/2608.00950", "authors": ["Minseong Kweon", "Junaed Sattar"], "brief": "\u63d0\u51fa Swimm3R\uff0c\u5c06\u4ecb\u8d28\u611f\u77e5 SfM \u4e0e\u6c34\u4e0b Beta Splatting \u7ed3\u5408\uff0c\u7528\u7269\u7406\u6210\u50cf\u53c2\u6570\u4f30\u8ba1\u3001\u76f8\u673a\u4f4d\u59ff\u548c\u70b9\u4e91\u6062\u590d\u6765\u63d0\u5347\u6c34\u4e0b\u4e09\u7ef4\u91cd\u5efa\u7684\u7a33\u5b9a\u6027\u3002\u65b9\u6cd5\u5728\u65b0\u5efa Barbados \u6c34\u4e0b\u89c6\u9891\u6570\u636e\u96c6\u4e0a\u80fd\u5728\u5f3a\u6563\u5c04\u6761\u4ef6\u4e0b\u6062\u590d\u8fde\u8d2f\u6d77\u5e95\u51e0\u4f55\uff0c\u8f83 WaterSplatting \u5e73\u5747 PSNR \u63d0\u5347 1.47 dB\uff0c\u5e76\u63d0\u5347\u4e0b\u6e38\u5b9a\u4f4d\u6027\u80fd\u3002", "categories": ["cs.CV", "cs.RO", "eess.IV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00950", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u6c34\u4e0b\u89c6\u89c9", "\u9ad8\u65af\u6cfc\u6e85", "\u7ed3\u6784\u5149\u675f\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00950v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Swimm3R: Splatting with Medium-aware SfM for Underwater 3D Reconstruction", "tldr": "\u63d0\u51fa Swimm3R\uff0c\u5c06\u4ecb\u8d28\u611f\u77e5 SfM \u4e0e\u6c34\u4e0b Beta Splatting \u7ed3\u5408\uff0c\u7528\u7269\u7406\u6210\u50cf\u53c2\u6570\u4f30\u8ba1\u3001\u76f8\u673a\u4f4d\u59ff\u548c\u70b9\u4e91\u6062\u590d\u6765\u63d0\u5347\u6c34\u4e0b\u4e09\u7ef4\u91cd\u5efa\u7684\u7a33\u5b9a\u6027\u3002\u65b9\u6cd5\u5728\u65b0\u5efa Barbados \u6c34\u4e0b\u89c6\u9891\u6570\u636e\u96c6\u4e0a\u80fd\u5728\u5f3a\u6563\u5c04\u6761\u4ef6\u4e0b\u6062\u590d\u8fde\u8d2f\u6d77\u5e95\u51e0\u4f55\uff0c\u8f83 WaterSplatting \u5e73\u5747 PSNR \u63d0\u5347 1.47 dB\uff0c\u5e76\u63d0\u5347\u4e0b\u6e38\u5b9a\u4f4d\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
