98\u76ee\u91c7\u6837\u5f71\u54cd\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u533b\u7597AI", "\u5b89\u5168\u8bc4\u6d4b", "\u5e7b\u89c9\u4e0e\u8c04\u5a9a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01017v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Why LLMs Give In: Conversational Factors and Reasoning Behind Medical Sycophancy", "tldr": "\u533b\u5b66\u8c04\u5a9a\u66f4\u591a\u7531\u5bf9\u8bdd\u60c5\u5883\u89e6\u53d1", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u8bed\u8a00\u6a21\u578b\u5728\u533b\u7597\u95ee\u7b54\u4e2d\u4e3a\u4f55\u4f1a\u5728\u7528\u6237\u8d28\u7591\u4e0b\u653e\u5f03\u6b63\u786e\u7b54\u6848\uff0c\u5373\u201c\u533b\u5b66\u8c04\u5a9a\u201d\u3002\u4f5c\u8005\u7528500\u4e2aMedQuAD\u95ee\u9898\u30015\u4e2a\u5f00\u6e90\u6a21\u578b\u548c\u56db\u7c7b\u5bf9\u8bdd\u56e0\u7d20\u6784\u6210\u5168\u56e0\u5b50\u5b9e\u9a8c\uff0c\u5171\u8fdb\u884c\u7ea6120\u4e07\u6b21\u8bd5\u9a8c\uff0c\u5206\u6790\u8c04\u5a9a\u884c\u4e3a\u7684\u89e6\u53d1\u6761\u4ef6\u4e0e\u63a8\u7406\u673a\u5236\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u7528\u5355\u4e00\u8c04\u5a9a\u7387\u8bc4\u4ef7\u6a21\u578b\u5b89\u5168\u6027\u7684\u505a\u6cd5\uff0c\u6307\u51fa\u533b\u7597\u573a\u666f\u4e2d\u7684\u9519\u8bef\u8ba9\u6b65\u662f\u7531\u5bf9\u8bdd\u7ed3\u6784\u3001\u8bc1\u636e\u5448\u73b0\u65b9\u5f0f\u548c\u6a21\u578b\u81ea\u6211\u5ba1\u67e5\u8def\u5f84\u5171\u540c\u9a71\u52a8\u7684\u3002\u8fd9\u5bf9\u533b\u7597AI\u5b89\u5168\u8bc4\u6d4b\u3001\u63d0\u793a\u8bbe\u8ba1\u548c\u6297\u8bef\u5bfc\u80fd\u529b\u8bad\u7ec3\u90fd\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Kinematic models provide reliable motion constraints for odometry estimation in featureless environments, where exteroceptive sensing degrades and IMU integration drifts. Learning-based kinematic models can achieve more accurate odometry estimation than model-based methods by capturing nonlinear effects; however, most existing learning-based models are trained on a single embodiment and generalize poorly to new embodiments. This generalization is difficult because the meanings and structures of proprioceptive measurements vary across embodiments, including the number of joints and ground-contact elements (e.g., wheels, feet). To address this challenge, we propose KING, a Graph Neural Network (GNN)-based kinematic model that explicitly incorporates robot embodiments by representing them as a common graph. We show that wheel and leg kinematic models can be expressed by a unified representation, enabling a single model for both wheeled and legged robots. Trained on datasets spanning diverse embodiments, KING provides a unified representation of wheeled and legged kinematics and achieves high-accuracy odometry estimation in real environments. KING estimates accurate odometry using only an embodiment description (e.g., a URDF file) and on-board proprioception (encoders and an IMU) and can be adapted to new robot embodiments through few-shot learning with only one minute of data, avoiding retraining from scratch on a new dataset for each robot. The project page is available at: https://smrg-aist.github.io/king_project_page/", "arxiv_id": "2608.01015", "arxiv_url": "https://arxiv.org/abs/2608.01015", "authors": ["Taku Okawara", "Aoki Takanose", "Kenji Koide", "Shuji Oishi", "Masashi Yokozuka"], "brief": "\u8bba\u6587\u63d0\u51fa KING\uff0c\u4e00\u79cd\u5177\u8eab\u611f\u77e5\u7684\u8fd0\u52a8\u5b66\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u5c06\u4e0d\u540c\u673a\u5668\u4eba\u7684\u5173\u8282\u3001\u8f6e\u5b50\u3001\u8db3\u7aef\u7b49\u7ed3\u6784\u8868\u793a\u4e3a\u7edf\u4e00\u56fe\u3002\u5b83\u7528 URDF \u7b49\u5177\u8eab\u63cf\u8ff0\u548c\u672c\u4f53\u4f20\u611f\u5668\u6570\u636e\uff0c\u5b9e\u73b0\u8de8\u8f6e\u5f0f\u4e0e\u817f\u5f0f\u673a\u5668\u4eba\u7684\u9ad8\u7cbe\u5ea6\u91cc\u7a0b\u8ba1\u4f30\u8ba1\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01015", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u901a\u7528\u56fe\u8868\u793a\u663e\u5f0f\u7f16\u7801\u673a\u5668\u4eba\u5177\u8eab\u7ed3\u6784\uff0c\u7f13\u89e3\u4e0d\u540c\u5173\u8282\u6570\u91cf\u3001\u63a5\u89e6\u5143\u4ef6\u548c\u4f20\u611f\u542b\u4e49\u5dee\u5f02\u5e26\u6765\u7684\u6cdb\u5316\u95ee\u9898", "\u8bc1\u660e\u8f6e\u5f0f\u4e0e\u817f\u5f0f\u8fd0\u52a8\u5b66\u53ef\u7eb3\u5165\u7edf\u4e00\u8868\u793a\uff0c\u4ece\u800c\u8bad\u7ec3\u5355\u4e00\u6a21\u578b\u8986\u76d6\u591a\u79cd\u673a\u5668\u4eba\u5f62\u6001", "\u4ec5\u9700\u7f16\u7801\u5668\u548c IMU \u7b49\u672c\u4f53\u611f\u77e5\u6570\u636e\uff1b\u65b0\u673a\u5668\u4eba\u53ef\u7528\u7ea6\u4e00\u5206\u949f\u6570\u636e\u8fdb\u884c\u5c11\u6837\u672c\u9002\u914d\uff0c\u65e0\u9700\u4ece\u5934\u8bad\u7ec3"], "keywords": ["\u673a\u5668\u4eba", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u91cc\u7a0b\u8ba1", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01015v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "KING: Embodiment-Aware Kinematic Graph Neural Network for Unified Motion Representation of Legged and Wheeled Robots", "tldr": "\u7edf\u4e00\u817f\u5f0f\u4e0e\u8f6e\u5f0f\u673a\u5668\u4eba\u7684\u8fd0\u52a8\u91cc\u7a0b\u8ba1\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa KING\uff0c\u4e00\u79cd\u5177\u8eab\u611f\u77e5\u7684\u8fd0\u52a8\u5b66\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u5c06\u4e0d\u540c\u673a\u5668\u4eba\u7684\u5173\u8282\u3001\u8f6e\u5b50\u3001\u8db3\u7aef\u7b49\u7ed3\u6784\u8868\u793a\u4e3a\u7edf\u4e00\u56fe\u3002\u5b83\u7528 URDF \u7b49\u5177\u8eab\u63cf\u8ff0\u548c\u672c\u4f53\u4f20\u611f\u5668\u6570\u636e\uff0c\u5b9e\u73b0\u8de8\u8f6e\u5f0f\u4e0e\u817f\u5f0f\u673a\u5668\u4eba\u7684\u9ad8\u7cbe\u5ea6\u91cc\u7a0b\u8ba1\u4f30\u8ba1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5b66\u4e60\u5f0f\u8fd0\u52a8\u5b66\u6a21\u578b\u4ece\u5355\u4e00\u673a\u5668\u4eba\u6269\u5c55\u5230\u8de8\u5177\u8eab\u6cdb\u5316\uff0c\u5728\u89c6\u89c9/\u6fc0\u5149\u7b49\u5916\u611f\u77e5\u9000\u5316\u73af\u5883\u4e0b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\uff0c\u53ef\u964d\u4f4e\u4e3a\u6bcf\u79cd\u673a\u5668\u4eba\u91cd\u65b0\u5efa\u6a21\u548c\u91c7\u96c6\u5927\u89c4\u6a21\u6570\u636e\u7684\u6210\u672c\u3002"}, {"abstract": "Preference optimization improves mathematical reasoning in large language models (LLMs), but reliable chosen-rejected pairs usually require verified answers, human annotations, or external reward models. We investigate whether preference supervision can instead be derived from the model\u0027s internal representation geometry in a semi-supervised setting. Our analysis shows that reasoning trajectories generated across different mathematical problems form structured global point clouds in which correct and incorrect trajectories exhibit different geometric organization. Based on this observation, we propose Cloud--ScPO, a topology-guided preference-mining framework that uses a small labeled set to construct multiple correct and incorrect reference Clouds. Each trajectory is represented by a mean-pooled hidden state and scored against connectivity-induced components using a component-level soft $k$-nearest-neighbor measure averaged across reference banks. We combine this cross-problem Cloud signal with prompt-level self-consistency: self-consistency determines the answer-level preference direction, while Cloud scoring selects concrete trajectories and filters pairs by their score margin. Experiments on GSM8K and MATH-Numeric across four model settings show that Cloud--ScPO consistently improves over ScPO, with gains of up to 4.49\\% on GSM8K and 4.19\\% on MATH-Numeric. Pair-level analyses further show that Cloud--ScPO maintains comparable correctness reliability while more effectively separating informative chosen trajectories from incomplete, repetitive, or otherwise low-quality rejected responses.", "arxiv_id": "2608.01014", "arxiv_url": "https://arxiv.org/abs/2608.01014", "authors": ["Yuzhou Liu", "Xiyang Hu"], "brief": "\u8bba\u6587\u63d0\u51fa Cloud-ScPO\uff0c\u4e00\u79cd\u534a\u76d1\u7763\u504f\u597d\u4f18\u5316\u6846\u67b6\uff0c\u7528\u5c11\u91cf\u6807\u6ce8\u6837\u672c\u5728 LLM \u9690\u85cf\u72b6\u6001\u7a7a\u95f4\u4e2d\u6784\u5efa\u6b63\u786e/\u9519\u8bef\u63a8\u7406\u8f68\u8ff9\u7684\u53c2\u8003\u70b9\u4e91\uff0c\u5e76\u4ece\u4e2d\u6316\u6398\u8bad\u7ec3\u7528\u504f\u597d\u5bf9\u3002\u5b83\u5c06\u8de8\u9898\u76ee\u7684\u70b9\u4e91\u51e0\u4f55\u4fe1\u53f7\u4e0e\u9898\u5185\u81ea\u4e00\u81f4\u6027\u7ed3\u5408\uff0c\u7528\u4e8e\u9009\u62e9\u9ad8\u8d28\u91cf chosen/rejected \u8f68\u8ff9\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01014", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u4e0d\u540c\u6570\u5b66\u9898\u751f\u6210\u7684\u63a8\u7406\u8f68\u8ff9\u5728\u9690\u85cf\u72b6\u6001\u5747\u503c\u6c60\u5316\u8868\u793a\u4e2d\u5f62\u6210\u7ed3\u6784\u5316\u5168\u5c40\u70b9\u4e91\uff0c\u6b63\u786e\u4e0e\u9519\u8bef\u8f68\u8ff9\u5177\u6709\u4e0d\u540c\u51e0\u4f55\u7ec4\u7ec7\u3002", "\u901a\u8fc7\u8fde\u901a\u5206\u91cf\u7ea7\u8f6f k \u8fd1\u90bb\u6253\u5206\uff0c\u5e76\u5728\u591a\u4e2a\u6b63\u786e/\u9519\u8bef\u53c2\u8003\u4e91\u4e0a\u5e73\u5747\uff0c\u7b5b\u9009\u5177\u6709\u8db3\u591f\u5206\u6570\u95f4\u9694\u7684\u504f\u597d\u5bf9\u3002", "\u5728 GSM8K \u548c MATH-Numeric\u3001\u56db\u79cd\u6a21\u578b\u8bbe\u7f6e\u4e0a\u5747\u4f18\u4e8e ScPO\uff0c\u6700\u9ad8\u5206\u522b\u63d0\u5347 4.49% \u548c 4.19%\u3002"], "keywords": ["\u504f\u597d\u4f18\u5316", "\u6570\u5b66\u63a8\u7406", "\u8868\u793a\u5b66\u4e60", "\u534a\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01014v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Cloud-ScPO: Hidden-State Geometry for Semi-Supervised Preference Optimization in LLM Reasoning", "tldr": "\u7528\u9690\u85cf\u72b6\u6001\u51e0\u4f55\u6316\u6398\u504f\u597d\u63d0\u5347\u6570\u5b66\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Cloud-ScPO\uff0c\u4e00\u79cd\u534a\u76d1\u7763\u504f\u597d\u4f18\u5316\u6846\u67b6\uff0c\u7528\u5c11\u91cf\u6807\u6ce8\u6837\u672c\u5728 LLM \u9690\u85cf\u72b6\u6001\u7a7a\u95f4\u4e2d\u6784\u5efa\u6b63\u786e/\u9519\u8bef\u63a8\u7406\u8f68\u8ff9\u7684\u53c2\u8003\u70b9\u4e91\uff0c\u5e76\u4ece\u4e2d\u6316\u6398\u8bad\u7ec3\u7528\u504f\u597d\u5bf9\u3002\u5b83\u5c06\u8de8\u9898\u76ee\u7684\u70b9\u4e91\u51e0\u4f55\u4fe1\u53f7\u4e0e\u9898\u5185\u81ea\u4e00\u81f4\u6027\u7ed3\u5408\uff0c\u7528\u4e8e\u9009\u62e9\u9ad8\u8d28\u91cf chosen/rejected \u8f68\u8ff9\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u5bf9\u4eba\u5de5\u6807\u6ce8\u3001\u5916\u90e8\u5956\u52b1\u6a21\u578b\u6216\u53ef\u9a8c\u8bc1\u7b54\u6848\u7684\u4f9d\u8d56\uff0c\u5c55\u793a\u4e86\u5229\u7528\u6a21\u578b\u5185\u90e8\u8868\u793a\u51e0\u4f55\u8fdb\u884c\u504f\u597d\u76d1\u7763\u7684\u53ef\u884c\u6027\uff0c\u5bf9\u4f4e\u6210\u672c\u63d0\u5347 LLM \u6570\u5b66\u63a8\u7406\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Uncommon and off-guideline cases are difficult for clinical decision support, because physicians must make a series of management decisions under diagnostic uncertainty and rarely see the full case at once. Most large language model (LLM) benchmarks for medicine score only the final diagnosis, yet much of clinical care turns on the next appropriate action: the next test to order, the imaging study to obtain, the specialist to involve, or the differential to pursue. We introduce MedUPSQA, a dataset of 21,874 mid-stream clinical decision points built from 5,535 real case reports, and MedUPS, an alignment framework that supervises models on these intermediate decisions as they unfold along a patient\u0027s trajectory. We segment free-text case presentations into chronologically ordered, accumulating clinical chunks and align models to predict the next step with reinforcement learning (GRPO), using an external LLM-as-a-Judge reward. This objective mirrors how clinicians actually meet patients, reasoning forward from accumulating evidence toward the next decision, rather than committing to a final label. Across three backbones, mid-stream alignment raises next-step accuracy from 55.2 to 66.7 for Qwen3.6-27B, from 47.2 to 57.8 for Qwen3.5-9B, and from 37.8 to 44.4 for HuatuoGPT-3-8B, with 95% CI. In several model scales we test the objective improves accuracy more than scale, with smaller models surpassing larger, frontier models we evaluate. We further train supervised fine-tuning (SFT) baselines on the mid-stream task, SFT improves all backbones above base, indicating the target framwork carries signal independently of the optimizer. We release the dataset, code, and aligned checkpoints.", "arxiv_id": "2608.01012", "arxiv_url": "https://arxiv.org/abs/2608.01012", "authors": ["Ofir Ben Shoham", "Oriel Perets", "Nir Grinberg", "Nadav Rappoport"], "brief": "\u8bba\u6587\u63d0\u51fa MedUPSQA \u6570\u636e\u96c6\u548c MedUPS \u5bf9\u9f50\u6846\u67b6\uff0c\u9488\u5bf9\u771f\u5b9e\u75c5\u4f8b\u8fdb\u7a0b\u4e2d\u7684\u201c\u4e0b\u4e00\u6b65\u8be5\u505a\u4ec0\u4e48\u201d\u8fdb\u884c\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\uff0c\u800c\u975e\u53ea\u8bc4\u6700\u7ec8\u8bca\u65ad\u3002\u65b9\u6cd5\u5c06\u75c5\u4f8b\u6309\u65f6\u95f4\u5207\u5206\u4e3a\u9010\u6b65\u7d2f\u79ef\u7684\u4e34\u5e8a\u4fe1\u606f\uff0c\u5e76\u7528 GRPO \u4e0e LLM-as-a-Judge \u5956\u52b1\u5bf9\u6a21\u578b\u8fdb\u884c\u4e2d\u9014\u51b3\u7b56\u5bf9\u9f50\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01012", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u4e86\u5305\u542b 5535 \u4e2a\u771f\u5b9e\u75c5\u4f8b\u62a5\u544a\u300121874 \u4e2a\u4e2d\u9014\u4e34\u5e8a\u51b3\u7b56\u70b9\u7684 MedUPSQA \u6570\u636e\u96c6", "\u4efb\u52a1\u8986\u76d6\u4e0b\u4e00\u9879\u68c0\u67e5\u3001\u5f71\u50cf\u5b66\u3001\u4e13\u79d1\u4f1a\u8bca\u3001\u9274\u522b\u8bca\u65ad\u7b49\u4e34\u5e8a\u7ba1\u7406\u52a8\u4f5c\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u8bca\u7597\u6d41\u7a0b", "\u5728 Qwen\u3001HuatuoGPT \u7b49\u4e09\u4e2a\u6a21\u578b\u9aa8\u5e72\u4e0a\u663e\u8457\u63d0\u5347\u4e0b\u4e00\u6b65\u51b3\u7b56\u51c6\u786e\u7387\uff0c\u90e8\u5206\u5c0f\u6a21\u578b\u7ecf\u5bf9\u9f50\u540e\u8d85\u8fc7\u66f4\u5927\u6a21\u578b"], "keywords": ["\u533b\u5b66\u5927\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u4e34\u5e8a\u51b3\u7b56", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01012v1", "published_at": "2026-08-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MedUPS: Towards Diagnostic Assistance in Uncommon Medical Cases with Large Language Models", "tldr": "\u9762\u5411\u7f55\u89c1\u75c5\u4f8b\u7684\u4e2d\u9014\u4e34\u5e8a\u51b3\u7b56\u5bf9\u9f50\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MedUPSQA \u6570\u636e\u96c6\u548c MedUPS \u5bf9\u9f50\u6846\u67b6\uff0c\u9488\u5bf9\u771f\u5b9e\u75c5\u4f8b\u8fdb\u7a0b\u4e2d\u7684\u201c\u4e0b\u4e00\u6b65\u8be5\u505a\u4ec0\u4e48\u201d\u8fdb\u884c\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\uff0c\u800c\u975e\u53ea\u8bc4\u6700\u7ec8\u8bca\u65ad\u3002\u65b9\u6cd5\u5c06\u75c5\u4f8b\u6309\u65f6\u95f4\u5207\u5206\u4e3a\u9010\u6b65\u7d2f\u79ef\u7684\u4e34\u5e8a\u4fe1\u606f\uff0c\u5e76\u7528 GRPO \u4e0e LLM-as-a-Judge \u5956\u52b1\u5bf9\u6a21\u578b\u8fdb\u884c\u4e2d\u9014\u51b3\u7b56\u5bf9\u9f50\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u533b\u5b66\u5927\u6a21\u578b\u8bc4\u6d4b\u4ece\u201c\u6700\u7ec8\u8bca\u65ad\u201d\u63a8\u8fdb\u5230\u66f4\u5b9e\u7528\u7684\u52a8\u6001\u4e34\u5e8a\u51b3\u7b56\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u7f55\u89c1\u3001\u975e\u6307\u5357\u5316\u75c5\u4f8b\uff1b\u516c\u5f00\u6570\u636e\u3001\u4ee3\u7801\u548c\u6a21\u578b\u68c0\u67e5\u70b9\u4e5f\u6709\u52a9\u4e8e\u63a8\u52a8\u533b\u5b66 LLM \u7684\u53ef\u590d\u73b0\u7814\u7a76\u3002"}, {"abstract": "Depth-routing residual architectures allow Transformer layers to retrieve earlier representations instead of inheriting only the immediately preceding state. Existing Block Attention Residuals, however, use a single content-dependent depth mixture to construct the inputs to queries, keys, and values. This design couples two functionally different decisions: queries and keys determine where attention matches, whereas values determine what content is retrieved. We therefore ask whether matching and content retrieval should be forced to read from the same depth. We introduce Role-Decoupled Attention Residuals (RD-AttnRes), a minimal extension that shares one depth route between queries and keys while learning an independent value route over the same residual sources. Tying the two routing queries exactly recovers the parent architecture, while decoupling them adds only one model-width vector per layer and introduces no additional token-to-token attention operation. We evaluate RD-AttnRes using a frozen, paired pretraining protocol on FineWeb-Edu with five matched seeds for both 120M- and 343M-parameter models and a 2.0B-token training budget. RD-AttnRes improves validation negative log-likelihood in all 10 matched comparisons. The mean reductions are 0.0301 and 0.0247, corresponding to perplexity reductions of 2.97 percent and 2.43 percent at 120M and 343M parameters, respectively. Early-budget controls indicate that neither the additional parameter count, duplicated routing execution, nor a fixed value route reproduces the improvement. Routing diagnostics further reveal persistent divergence between the query-key and value depth distributions. These results suggest that, within the evaluated training regime, attention matching and content retrieval benefit from distinct reads over the residual hierarchy.", "arxiv_id": "2608.01075", "arxiv_url": "https://arxiv.org/abs/2608.01075", "authors": ["Kehan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Role-Decoupled Attention Residuals\uff08RD-AttnRes\uff09\uff0c\u5728\u6df1\u5ea6\u8def\u7531\u6b8b\u5dee Transformer \u4e2d\u8ba9 Query/Key \u5171\u4eab\u4e00\u6761\u6df1\u5ea6\u8def\u7531\u3001Value \u4f7f\u7528\u72ec\u7acb\u6df1\u5ea6\u8def\u7531\u3002\u8be5\u65b9\u6cd5\u4ee5\u6781\u5c0f\u53c2\u6570\u589e\u91cf\u5206\u79bb\u201c\u5728\u54ea\u91cc\u5339\u914d\u201d\u548c\u201c\u53d6\u56de\u4ec0\u4e48\u5185\u5bb9\u201d\u4e24\u4e2a\u51b3\u7b56\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01075", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u76f8\u6bd4\u539f Block Attention Residuals\uff0cRD-AttnRes \u4ec5\u6bcf\u5c42\u589e\u52a0\u4e00\u4e2a\u6a21\u578b\u5bbd\u5ea6\u5411\u91cf\uff0c\u4e0d\u589e\u52a0\u989d\u5916 token-to-token \u6ce8\u610f\u529b\u8ba1\u7b97\u3002", "\u5728 FineWeb-Edu \u4e0a\u7528 2.0B token\u3001120M \u548c 343M \u6a21\u578b\u3001\u5404 5 \u4e2a\u5339\u914d\u968f\u673a\u79cd\u5b50\u8bc4\u4f30\uff0c10/10 \u7ec4\u5bf9\u6bd4\u5747\u964d\u4f4e\u9a8c\u8bc1\u8d1f\u5bf9\u6570\u4f3c\u7136\u3002", "120M \u4e0e 343M \u6a21\u578b\u56f0\u60d1\u5ea6\u5206\u522b\u4e0b\u964d 2.97% \u548c 2.43%\uff0c\u63a7\u5236\u5b9e\u9a8c\u8868\u660e\u6536\u76ca\u5e76\u975e\u6765\u81ea\u53c2\u6570\u91cf\u3001\u91cd\u590d\u8def\u7531\u6267\u884c\u6216\u56fa\u5b9a Value \u8def\u7531\u3002"], "keywords": ["Transformer", "\u6ce8\u610f\u529b\u673a\u5236", "\u6b8b\u5dee\u8fde\u63a5", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01075v1", "published_at": "2026-08-02", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Role-Decoupled Attention Residuals: Separating Matching and Content Retrieval Across Depth", "tldr": "\u89e3\u8026\u6ce8\u610f\u529b\u5339\u914d\u4e0e\u53d6\u503c\u7684\u6df1\u5ea6\u8def\u7531", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Role-Decoupled Attention Residuals\uff08RD-AttnRes\uff09\uff0c\u5728\u6df1\u5ea6\u8def\u7531\u6b8b\u5dee Transformer \u4e2d\u8ba9 Query/Key \u5171\u4eab\u4e00\u6761\u6df1\u5ea6\u8def\u7531\u3001Value \u4f7f\u7528\u72ec\u7acb\u6df1\u5ea6\u8def\u7531\u3002\u8be5\u65b9\u6cd5\u4ee5\u6781\u5c0f\u53c2\u6570\u589e\u91cf\u5206\u79bb\u201c\u5728\u54ea\u91cc\u5339\u914d\u201d\u548c\u201c\u53d6\u56de\u4ec0\u4e48\u5185\u5bb9\u201d\u4e24\u4e2a\u51b3\u7b56\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa Transformer \u6b8b\u5dee\u5c42\u7ea7\u8bfb\u53d6\u4e2d\uff0c\u6ce8\u610f\u529b\u5339\u914d\u4e0e\u5185\u5bb9\u68c0\u7d22\u4e0d\u5e94\u5f3a\u5236\u4f7f\u7528\u540c\u4e00\u6df1\u5ea6\u6765\u6e90\uff1b\u4ee5\u51e0\u4e4e\u65e0\u8ba1\u7b97\u4ee3\u4ef7\u7684\u7ed3\u6784\u6539\u52a8\u5e26\u6765\u7a33\u5b9a\u56f0\u60d1\u5ea6\u6539\u8fdb\uff0c\u5bf9\u8bed\u8a00\u6a21\u578b\u67b6\u6784\u8bbe\u8ba1\u6709\u5b9e\u7528\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "The rapid spread of large language models (LLMs) across the web raises concerns about misinformation, academic integrity, automated content manipulation, and risks to vulnerable online communities. Existing transformer-based detectors, such as GPT-Sentinel, show promise but struggle to generalize to diverse model outputs and paraphrasing attacks, limiting their role in building trustworthy web ecosystems. This work introduces DeBERTa-Sentinel, a responsible AI-generated text detection framework leveraging DeBERTa-v3\u0027s disentangled attention to capture subtle structural irregularities in synthetic content. A central design principle is transparency: unlike black-box commercial detectors, DeBERTa-Sentinel exposes token-level explanations of its decisions, enabling affected stakeholders journalists, educators, and platform trust and safety teams to audit, challenge, and contextualize detection outcomes. Using the GLC-AIText dataset of 28,057 human and LLM-generated samples (GPT, LLaMA, and Claude) with a 60-20-20 split, DeBERTa-Sentinel achieves 98.21\\% validation accuracy and surpasses the RoBERTa-Sentinel baseline from NeurIPS 2025, achieving 97.53\\% test accuracy, 95.89\\% precision, 99.33\\% recall, and 99.53\\% ROC-AUC, and maintaining a 0.665\\% false negative rate. The model\u0027s interpretability reveals linguistic markers such as academic phrasing and formal transitions associated with synthetic text, directly supporting stakeholder needs for verifiable, auditable content-authenticity decisions. By advancing responsible detection methods that reduce bias and enhance explainability, DeBERTa-Sentinel promotes trustworthy, ethical, and human-centric AI systems. Code and data are available at https://github.com/Galileo-Galili/HUMAN-VS-AI-TEXT-DETECTION.", "arxiv_id": "2608.01046", "arxiv_url": "https://arxiv.org/abs/2608.01046", "authors": ["Muhammad Yousaf Rehman", "Muhammad Islam"], "brief": "\u8bba\u6587\u63d0\u51fa DeBERTa-Sentinel\uff0c\u4e00\u4e2a\u57fa\u4e8e DeBERTa-v3 \u7684 AI \u751f\u6210\u6587\u672c\u68c0\u6d4b\u6846\u67b6\uff0c\u5229\u7528\u89e3\u8026\u6ce8\u610f\u529b\u6355\u6349\u5408\u6210\u6587\u672c\u7684\u7ec6\u5fae\u7ed3\u6784\u5f02\u5e38\u3002\u5176\u6838\u5fc3\u5f3a\u8c03\u900f\u660e\u6027\uff0c\u63d0\u4f9b token \u7ea7\u89e3\u91ca\uff0c\u5e2e\u52a9\u6559\u80b2\u3001\u5a92\u4f53\u548c\u5e73\u53f0\u5b89\u5168\u56e2\u961f\u5ba1\u8ba1\u68c0\u6d4b\u7ed3\u679c\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01046", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728 GLC-AIText \u6570\u636e\u96c6\u4e0a\u8bc4\u6d4b\uff0c\u5305\u542b 28,057 \u6761\u4eba\u7c7b\u4e0e GPT\u3001LLaMA\u3001Claude \u751f\u6210\u6587\u672c\u6837\u672c\uff0c\u91c7\u7528 60-20-20 \u5212\u5206\u3002", "\u6d4b\u8bd5\u96c6\u8fbe\u5230 97.53% \u51c6\u786e\u7387\u300195.89% \u7cbe\u786e\u7387\u300199.33% \u53ec\u56de\u7387\u548c 99.53% ROC-AUC\uff0c\u5047\u9634\u6027\u7387\u4e3a 0.665%\u3002", "\u901a\u8fc7 token \u7ea7\u53ef\u89e3\u91ca\u6027\u63ed\u793a\u5b66\u672f\u5316\u63aa\u8f9e\u3001\u6b63\u5f0f\u8fc7\u6e21\u8bed\u7b49\u4e0e\u5408\u6210\u6587\u672c\u76f8\u5173\u7684\u8bed\u8a00\u6807\u8bb0\u3002"], "keywords": ["AI\u6587\u672c\u68c0\u6d4b", "\u53ef\u89e3\u91ca\u6027", "\u81ea\u7136\u8bed\u8a00\u5904\u7406", "\u53ef\u4fe1AI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01046v1", "published_at": "2026-08-02", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "DeBERTa-Sentinel: Toward Transparent and Trustworthy Detection of AI-Generated Text", "tldr": "\u53ef\u89e3\u91caDeBERTa\u68c0\u6d4bAI\u751f\u6210\u6587\u672c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DeBERTa-Sentinel\uff0c\u4e00\u4e2a\u57fa\u4e8e DeBERTa-v3 \u7684 AI \u751f\u6210\u6587\u672c\u68c0\u6d4b\u6846\u67b6\uff0c\u5229\u7528\u89e3\u8026\u6ce8\u610f\u529b\u6355\u6349\u5408\u6210\u6587\u672c\u7684\u7ec6\u5fae\u7ed3\u6784\u5f02\u5e38\u3002\u5176\u6838\u5fc3\u5f3a\u8c03\u900f\u660e\u6027\uff0c\u63d0\u4f9b token \u7ea7\u89e3\u91ca\uff0c\u5e2e\u52a9\u6559\u80b2\u3001\u5a92\u4f53\u548c\u5e73\u53f0\u5b89\u5168\u56e2\u961f\u5ba1\u8ba1\u68c0\u6d4b\u7ed3\u679c\u3002", "why_notable": "\u76f8\u6bd4\u9ed1\u76d2\u5546\u4e1a\u68c0\u6d4b\u5668\uff0c\u8be5\u65b9\u6cd5\u5f3a\u8c03\u53ef\u89e3\u91ca\u548c\u53ef\u5ba1\u8ba1\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u8bef\u5224\u4e89\u8bae\u5e76\u63d0\u5347\u5185\u5bb9\u771f\u5b9e\u6027\u68c0\u6d4b\u7684\u53ef\u4fe1\u5ea6\uff1b\u540c\u65f6\u5728\u591a\u6765\u6e90 LLM \u6587\u672c\u68c0\u6d4b\u4e0a\u53d6\u5f97\u8f83\u9ad8\u6027\u80fd\uff0c\u5177\u5907\u6559\u80b2\u8bda\u4fe1\u3001\u5185\u5bb9\u6cbb\u7406\u548c\u5e73\u53f0\u98ce\u63a7\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal large language models (MLLMs) exhibit strong vision--language capabilities but may also memorize and disclose sensitive information. Machine unlearning seeks to remove designated knowledge without retraining from scratch while preserving general utility. Existing privacy-oriented benchmarks primarily adopt profile-level deletion, whereas practical requests are often finer grained: a model should forget a specified attribute while retaining non-sensitive information about the same identity. We therefore introduce attribute-level MLLM unlearning as a finer-grained task and construct a benchmark spanning long-text, numeric, and short-text targets, multiple forget ratios, and diverse question types. Our evaluation reveals that target and retained attributes share identity-specific and visual evidence, making selective forgetting susceptible to residual leakage or collateral degradation; accordingly, existing methods exhibit unstable forgetting--retention trade-offs in this setting. To address this challenge, we propose Causal Localization and Retain-Aware Projection (CLRP), a lightweight training-free framework. CLRP uses activation patching to identify the layer that causally mediates target-attribute disclosure, then applies a retain-aware projection that removes the target-attribute subspace while preserving same-identity evidence. Experiments across multiple widely used MLLMs with distinct architectures and parameter scales demonstrate the effectiveness of CLRP.", "arxiv_id": "2608.01008", "arxiv_url": "https://arxiv.org/abs/2608.01008", "authors": ["Junkai Lin", "Junkai Chen", "Siqi Hou", "Yuhao He", "Ruiqi Liu", "Chenhan Jin", "Shengze Xu", "Tieyong Zeng"], "brief": "\u672c\u6587\u63d0\u51fa\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5c5e\u6027\u7ea7\u9057\u5fd8\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u53ea\u9057\u5fd8\u67d0\u4e2a\u8eab\u4efd\u7684\u6307\u5b9a\u654f\u611f\u5c5e\u6027\uff0c\u540c\u65f6\u4fdd\u7559\u540c\u4e00\u8eab\u4efd\u7684\u975e\u654f\u611f\u4fe1\u606f\uff0c\u5e76\u6784\u5efa\u4e86\u8986\u76d6\u591a\u79cd\u5c5e\u6027\u7c7b\u578b\u3001\u9057\u5fd8\u6bd4\u4f8b\u548c\u95ee\u9898\u5f62\u5f0f\u7684\u57fa\u51c6\u3002\u4f5c\u8005\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 CLRP \u65b9\u6cd5\uff0c\u901a\u8fc7\u56e0\u679c\u5b9a\u4f4d\u548c\u4fdd\u7559\u611f\u77e5\u6295\u5f71\u79fb\u9664\u76ee\u6807\u5c5e\u6027\u5b50\u7a7a\u95f4\uff0c\u5728\u591a\u79cd MLLM \u4e0a\u6539\u5584\u4e86\u9057\u5fd8\u4e0e\u4fdd\u7559\u7684\u6743\u8861\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01008", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u673a\u5668\u9057\u5fd8", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01008v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Toward Fine-Grained Forgetting:Attribute Unlearning for Multimodal Large Language Models", "tldr": "\u672c\u6587\u63d0\u51fa\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5c5e\u6027\u7ea7\u9057\u5fd8\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u53ea\u9057\u5fd8\u67d0\u4e2a\u8eab\u4efd\u7684\u6307\u5b9a\u654f\u611f\u5c5e\u6027\uff0c\u540c\u65f6\u4fdd\u7559\u540c\u4e00\u8eab\u4efd\u7684\u975e\u654f\u611f\u4fe1\u606f\uff0c\u5e76\u6784\u5efa\u4e86\u8986\u76d6\u591a\u79cd\u5c5e\u6027\u7c7b\u578b\u3001\u9057\u5fd8\u6bd4\u4f8b\u548c\u95ee\u9898\u5f62\u5f0f\u7684\u57fa\u51c6\u3002\u4f5c\u8005\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 CLRP \u65b9\u6cd5\uff0c\u901a\u8fc7\u56e0\u679c\u5b9a\u4f4d\u548c\u4fdd\u7559\u611f\u77e5\u6295\u5f71\u79fb\u9664\u76ee\u6807\u5c5e\u6027\u5b50\u7a7a\u95f4\uff0c\u5728\u591a\u79cd MLLM \u4e0a\u6539\u5584\u4e86\u9057\u5fd8\u4e0e\u4fdd\u7559\u7684\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Solomonoff Induction, or SolInd, provides an ideal unbounded model of a priori sequence prediction but cannot naturally describe extrapolation from a given training dataset, as performed by Large Language Models. We apply de Finetti\u0027s theorem on exchangeable distributions to SolInd to produce what we call Hierarchical Solomonoff Induction, or HSI, which maintains a hyperprior over all Solomonoff priors that can be conditioned on previously observed sequences. We extend Wood et al.\u0027s proof that universal mixtures of semimeasures are equivalent to SolInd to show that universal mixtures of these mixtures are also equivalent, proving that HSI=SolInd. We also prove that HSI\u0027s excess error on any distribution, compared to its true generator, is bounded by that generator\u0027s complexity in the hyperprior. This result is directly comparable to SolInd\u0027s prediction error being bounded by the Kolmogorov complexity of the sequence being predicted, and forces HSI\u0027s average excess error to converge to 0 as a dataset grows, leading to optimal prediction in the limit. We claim that HSI is an ideal unbounded model of sequence prediction given a dataset in the same way that SolInd is ideal over individual sequences.", "arxiv_id": "2608.01005", "arxiv_url": "https://arxiv.org/abs/2608.01005", "authors": ["Nathan Young"], "brief": "\u8bba\u6587\u63d0\u51fa\u5206\u5c42 Solomonoff \u5f52\u7eb3\uff08HSI\uff09\uff0c\u7528 de Finetti \u5b9a\u7406\u4e3a Solomonoff \u5148\u9a8c\u52a0\u5165\u53ef\u7531\u5df2\u6709\u5e8f\u5217\u6570\u636e\u96c6\u6761\u4ef6\u5316\u7684\u8d85\u5148\u9a8c\uff0c\u4ece\u800c\u523b\u753b\u7c7b\u4f3c\u5927\u8bed\u8a00\u6a21\u578b\u7684\u201c\u57fa\u4e8e\u8bad\u7ec3\u96c6\u5916\u63a8\u201d\u3002\u4f5c\u8005\u8bc1\u660e HSI \u4e0e\u4f20\u7edf Solomonoff \u5f52\u7eb3\u7b49\u4ef7\uff0c\u5e76\u7ed9\u51fa\u76f8\u5bf9\u771f\u5b9e\u751f\u6210\u5668\u7684\u8d85\u989d\u8bef\u5dee\u754c\uff0c\u8bf4\u660e\u6570\u636e\u96c6\u589e\u5927\u65f6\u5e73\u5747\u8d85\u989d\u8bef\u5dee\u6536\u655b\u5230 0\u3002", "categories": ["cs.LG", "cs.AI", "cs.IT"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01005", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7406\u8bba\u673a\u5668\u5b66\u4e60", "\u5e8f\u5217\u9884\u6d4b", "\u8d1d\u53f6\u65af\u63a8\u65ad", "\u6cdb\u5316\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01005v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hierarchical Solomonoff Induction: An Unbounded Machine Learning Model", "tldr": "\u8bba\u6587\u63d0\u51fa\u5206\u5c42 Solomonoff \u5f52\u7eb3\uff08HSI\uff09\uff0c\u7528 de Finetti \u5b9a\u7406\u4e3a Solomonoff \u5148\u9a8c\u52a0\u5165\u53ef\u7531\u5df2\u6709\u5e8f\u5217\u6570\u636e\u96c6\u6761\u4ef6\u5316\u7684\u8d85\u5148\u9a8c\uff0c\u4ece\u800c\u523b\u753b\u7c7b\u4f3c\u5927\u8bed\u8a00\u6a21\u578b\u7684\u201c\u57fa\u4e8e\u8bad\u7ec3\u96c6\u5916\u63a8\u201d\u3002\u4f5c\u8005\u8bc1\u660e HSI \u4e0e\u4f20\u7edf Solomonoff \u5f52\u7eb3\u7b49\u4ef7\uff0c\u5e76\u7ed9\u51fa\u76f8\u5bf9\u771f\u5b9e\u751f\u6210\u5668\u7684\u8d85\u989d\u8bef\u5dee\u754c\uff0c\u8bf4\u660e\u6570\u636e\u96c6\u589e\u5927\u65f6\u5e73\u5747\u8d85\u989d\u8bef\u5dee\u6536\u655b\u5230 0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Platform teams hosting agent-extensibility surfaces face a regression-economics paradox: every onboarding customer ships an evaluation set tuned to their domain, but the platform\u0027s regression set must live under a hard query-count ceiling bounded by release cadence. To our knowledge, no published industrial pipeline addresses this platform-side curation problem: existing evaluation frameworks are customer-side, and benchmark-compression work treats benchmarks as fixed pools rather than streams of incoming sets. We describe a capability-taxonomy-driven curation pipeline applied to declarative agents with custom actions in Microsoft 365 Copilot. It takes an agent specification and a customer\u0027s eval set as input, projects each query into a platform-owned capability taxonomy, and outputs per-query decisions (admit, drop, swap, or human review), under the philosophy that a healthy regression set is the minimal set of queries capturing the maximal spread of capability signatures -- distinct combinations of capabilities a query exercises together. Three components instantiate this: a classifier producing per-(query, capability) verdicts via a hybrid of deterministic specification-based extraction and large-language-model (LLM) semantic inference; an Invocation Quality (IQ) rater scoring how thoroughly a query exercises each capability, so a new query sharing a signature with an existing entry can still be recognized as a better test and displace it; and a consolidator comparing incoming queries against the regression set on coverage and quality through a rule-based decision cascade, backed by a conservative curator that only suggests evictions. The mechanism is taxonomy-agnostic and applies to any regression eval-set curation problem with a typed capability taxonomy, including taxonomies that evolve in response to the very evidence the pipeline surfaces.", "arxiv_id": "2608.01004", "arxiv_url": "https://arxiv.org/abs/2608.01004", "authors": ["Tezan Sahu", "Aritra Das", "Pankaj Mittal", "Sudipta Das"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u6269\u5c55\u5e73\u53f0\u7684\u56de\u5f52\u8bc4\u6d4b\u96c6\u7b5b\u9009\u6d41\u6c34\u7ebf\uff0c\u7528\u80fd\u529b\u5206\u7c7b\u4f53\u7cfb\u5c06\u5ba2\u6237\u63d0\u4ea4\u7684\u8bc4\u6d4b\u67e5\u8be2\u6620\u5c04\u4e3a\u80fd\u529b\u7b7e\u540d\uff0c\u5e76\u5728\u67e5\u8be2\u9884\u7b97\u7ea6\u675f\u4e0b\u51b3\u5b9a\u63a5\u7eb3\u3001\u4e22\u5f03\u3001\u66ff\u6362\u6216\u4eba\u5de5\u590d\u6838\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u89c4\u5219\u62bd\u53d6\u3001LLM\u8bed\u4e49\u63a8\u65ad\u3001\u8c03\u7528\u8d28\u91cf\u8bc4\u5206\u4e0e\u4fdd\u5b88\u5408\u5e76\u7b56\u7565\uff0c\u5df2\u5e94\u7528\u4e8e Microsoft 365 Copilot \u7684\u58f0\u660e\u5f0f\u667a\u80fd\u4f53\u573a\u666f\uff0c\u7528\u66f4\u5c0f\u8bc4\u6d4b\u96c6\u8986\u76d6\u66f4\u4e30\u5bcc\u7684\u5e73\u53f0\u80fd\u529b\u7ec4\u5408\u3002", "categories": ["cs.LG", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01004", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u96c6", "\u8f6f\u4ef6\u5de5\u7a0b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01004v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Who Belongs in the Eval Set? A Capability-Taxonomy-Driven Pipeline for Curating Regression Eval Sets in Agent-Extensibility Platforms", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u6269\u5c55\u5e73\u53f0\u7684\u56de\u5f52\u8bc4\u6d4b\u96c6\u7b5b\u9009\u6d41\u6c34\u7ebf\uff0c\u7528\u80fd\u529b\u5206\u7c7b\u4f53\u7cfb\u5c06\u5ba2\u6237\u63d0\u4ea4\u7684\u8bc4\u6d4b\u67e5\u8be2\u6620\u5c04\u4e3a\u80fd\u529b\u7b7e\u540d\uff0c\u5e76\u5728\u67e5\u8be2\u9884\u7b97\u7ea6\u675f\u4e0b\u51b3\u5b9a\u63a5\u7eb3\u3001\u4e22\u5f03\u3001\u66ff\u6362\u6216\u4eba\u5de5\u590d\u6838\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u89c4\u5219\u62bd\u53d6\u3001LLM\u8bed\u4e49\u63a8\u65ad\u3001\u8c03\u7528\u8d28\u91cf\u8bc4\u5206\u4e0e\u4fdd\u5b88\u5408\u5e76\u7b56\u7565\uff0c\u5df2\u5e94\u7528\u4e8e Microsoft 365 Copilot \u7684\u58f0\u660e\u5f0f\u667a\u80fd\u4f53\u573a\u666f\uff0c\u7528\u66f4\u5c0f\u8bc4\u6d4b\u96c6\u8986\u76d6\u66f4\u4e30\u5bcc\u7684\u5e73\u53f0\u80fd\u529b\u7ec4\u5408\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language models are increasingly promoted from examinees to examiners: they write the test suites, answer keys, rubrics, and reward functions that define correctness for other systems. We measure the capability that role assumes and find it lacking under the protocol the role is usually deployed with, one-shot greedy authoring with no test-time reasoning. Across four reference constructions - two with complete finite truth, one with a hardened executable reference (HumanEval+/MBPP+), one with an explicitly incomplete lexical reference (WordNet) - models judge whether a candidate belongs far better than they author the set itself. On the incompleteness-proof algorithmic construction the gap is +0.34 to +0.29 F1 over a 24x parameter range and does not close; on executable code, models judging at F1 0.74-0.90 author suites admitting only 19-42% of oracle-correct solutions. A control locates the deficit: asked to emit the predicate rather than its extension, the same models reach F1 about 0.99. The failure is not missing knowledge or an inability to specify, but an inability to materialise the region a specification induces. The dominant error is omission, which resists audit: an over-inclusion is a token a reviewer can challenge, a missing member an absence whose discovery is the authoring problem itself. Models detect planted over-inclusions 6-7x more often than planted omissions, and a production deployment of 43,227 items fails omission-first at 10:1. Wired into RLVR, an authored key costs 1.9 points of accuracy against an exact oracle and 18.5 WordNet-relative (six paired seeds, p=0.031). Gating authored verifiers on a known-correct probe cuts false rejection from 58-92% to at most 5%, but keeps only 5-39% of suites. Repairing them instead, by rewriting each wrong expected value to what a reference execution returns, raises yield 3.3-10.6x across four author families.", "arxiv_id": "2608.01000", "arxiv_url": "https://arxiv.org/abs/2608.01000", "authors": ["Wenhui Chen", "Jianlin Chen", "Ziyao Lin", "Peiji Long", "Chi Man Vong"], "brief": "\u8bba\u6587\u53d1\u73b0\uff0c\u5927\u8bed\u8a00\u6a21\u578b\u5728\u201c\u5224\u65ad\u5019\u9009\u662f\u5426\u6b63\u786e\u201d\u4e0a\u660e\u663e\u5f3a\u4e8e\u201c\u4e00\u6b21\u6027\u751f\u6210\u5b8c\u6574\u53ef\u63a5\u53d7\u7b54\u6848\u96c6\u5408/\u6d4b\u8bd5\u5957\u4ef6\u201d\uff0c\u4e3b\u8981\u9519\u8bef\u662f\u96be\u4ee5\u53d1\u73b0\u7684\u9057\u6f0f\u800c\u975e\u8bef\u6536\u3002\u5373\u4f7f\u6a21\u578b\u80fd\u51c6\u786e\u5199\u51fa\u5224\u5b9a\u8c13\u8bcd\uff0c\u4ecd\u96be\u4ee5\u679a\u4e3e\u5176\u5bf9\u5e94\u96c6\u5408\uff1b\u5728\u4ee3\u7801\u8bc4\u6d4b\u548cRLVR\u4e2d\u4f1a\u663e\u8457\u964d\u4f4e\u6b63\u786e\u7387\uff0c\u4f46\u901a\u8fc7\u5df2\u77e5\u6b63\u786e\u63a2\u9488\u8fc7\u6ee4\u6216\u57fa\u4e8e\u53c2\u8003\u6267\u884c\u4fee\u590d\u53ef\u7f13\u89e3\u95ee\u9898\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01000", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6", "\u5956\u52b1\u6a21\u578b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01000v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Judging Is Not Enumerating: Silent Omissions in LLM-Authored Acceptable Sets", "tldr": "\u8bba\u6587\u53d1\u73b0\uff0c\u5927\u8bed\u8a00\u6a21\u578b\u5728\u201c\u5224\u65ad\u5019\u9009\u662f\u5426\u6b63\u786e\u201d\u4e0a\u660e\u663e\u5f3a\u4e8e\u201c\u4e00\u6b21\u6027\u751f\u6210\u5b8c\u6574\u53ef\u63a5\u53d7\u7b54\u6848\u96c6\u5408/\u6d4b\u8bd5\u5957\u4ef6\u201d\uff0c\u4e3b\u8981\u9519\u8bef\u662f\u96be\u4ee5\u53d1\u73b0\u7684\u9057\u6f0f\u800c\u975e\u8bef\u6536\u3002\u5373\u4f7f\u6a21\u578b\u80fd\u51c6\u786e\u5199\u51fa\u5224\u5b9a\u8c13\u8bcd\uff0c\u4ecd\u96be\u4ee5\u679a\u4e3e\u5176\u5bf9\u5e94\u96c6\u5408\uff1b\u5728\u4ee3\u7801\u8bc4\u6d4b\u548cRLVR\u4e2d\u4f1a\u663e\u8457\u964d\u4f4e\u6b63\u786e\u7387\uff0c\u4f46\u901a\u8fc7\u5df2\u77e5\u6b63\u786e\u63a2\u9488\u8fc7\u6ee4\u6216\u57fa\u4e8e\u53c2\u8003\u6267\u884c\u4fee\u590d\u53ef\u7f13\u89e3\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper introduces SCHEDBench, a natural-language benchmark for evaluating combinatorial scheduling constraint faithfulness under surface-form variation. Grounded in canonical scheduling instances and solver-derived feasibility and optimality, SCHEDBench assesses whether large language models (LLMs) generate schedules with the same constraint-feasible behavior across varied natural-language (NL) surface forms. SCHEDBench spans 1,132 instances across job-shop scheduling problems (JSP), single and multi-mode resource-constrained project scheduling problems (RCPSP), nurse rostering/scheduling, and curriculum timetabling problems of varying difficulty. Instances are templated into natural language problems using domain-specific templates, themed entities, lexical-syntactic template rephrasing, and constraint-level surface-form variation, with reference solutions verified for feasibility and objective optimality. Across thirteen frontier and open-weight LLMs, we find that models are not reliably invariant to semantically equivalent renderings of the same scheduling problem. Surface-form variation reduces feasibility and induces above-noise shifts in per-instance hard-constraint violations on matched instances. Among the tested isolated axes, constraint reordering yields the clearest above-noise sensitivity.", "arxiv_id": "2608.00991", "arxiv_url": "https://arxiv.org/abs/2608.00991", "authors": ["Shrenil Shaun Sharma", "Avi Sharma"], "brief": "\u8bba\u6587\u63d0\u51fa SCHEDBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u81ea\u7136\u8bed\u8a00\u7ec4\u5408\u8c03\u5ea6\u95ee\u9898\u4e2d\u662f\u5426\u80fd\u5fe0\u5b9e\u6ee1\u8db3\u7ea6\u675f\uff0c\u5e76\u8986\u76d6\u4f5c\u4e1a\u8f66\u95f4\u3001\u8d44\u6e90\u53d7\u9650\u9879\u76ee\u3001\u62a4\u58eb\u6392\u73ed\u548c\u8bfe\u7a0b\u6392\u8bfe\u7b49 1132 \u4e2a\u5b9e\u4f8b\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c13 \u4e2a\u524d\u6cbf\u4e0e\u5f00\u6e90\u6a21\u578b\u5bf9\u8bed\u4e49\u7b49\u4ef7\u4f46\u8868\u8ff0\u4e0d\u540c\u7684\u95ee\u9898\u5e76\u4e0d\u7a33\u5b9a\uff0c\u8868\u9762\u5f62\u5f0f\u53d8\u5316\u4f1a\u964d\u4f4e\u53ef\u884c\u6027\u5e76\u589e\u52a0\u786c\u7ea6\u675f\u8fdd\u53cd\uff0c\u5c24\u5176\u5bf9\u7ea6\u675f\u91cd\u6392\u5e8f\u8f83\u654f\u611f\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00991", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u6d4b\u8bd5", "\u7ec4\u5408\u8c03\u5ea6", "\u7ea6\u675f\u6ee1\u8db3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00991v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SCHEDBench: A Benchmark for Evaluating LLM Constraint Faithfulness in Natural-Language Combinatorial Scheduling", "tldr": "\u8bba\u6587\u63d0\u51fa SCHEDBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u81ea\u7136\u8bed\u8a00\u7ec4\u5408\u8c03\u5ea6\u95ee\u9898\u4e2d\u662f\u5426\u80fd\u5fe0\u5b9e\u6ee1\u8db3\u7ea6\u675f\uff0c\u5e76\u8986\u76d6\u4f5c\u4e1a\u8f66\u95f4\u3001\u8d44\u6e90\u53d7\u9650\u9879\u76ee\u3001\u62a4\u58eb\u6392\u73ed\u548c\u8bfe\u7a0b\u6392\u8bfe\u7b49 1132 \u4e2a\u5b9e\u4f8b\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c13 \u4e2a\u524d\u6cbf\u4e0e\u5f00\u6e90\u6a21\u578b\u5bf9\u8bed\u4e49\u7b49\u4ef7\u4f46\u8868\u8ff0\u4e0d\u540c\u7684\u95ee\u9898\u5e76\u4e0d\u7a33\u5b9a\uff0c\u8868\u9762\u5f62\u5f0f\u53d8\u5316\u4f1a\u964d\u4f4e\u53ef\u884c\u6027\u5e76\u589e\u52a0\u786c\u7ea6\u675f\u8fdd\u53cd\uff0c\u5c24\u5176\u5bf9\u7ea6\u675f\u91cd\u6392\u5e8f\u8f83\u654f\u611f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The rapid growth of single-cell transcriptomic data has enabled the development of foundation models pretrained primarily by reconstructing masked expression values. This objective encourages these models to learn gene dependencies but does not directly optimize whole-cell representations, which are essential for many downstream tasks. To bridge this gap, we propose a contrastive pretraining framework that learns cell representations through complementary transcriptomic views. Since standard contrastive learning is not readily applicable to single-cell pretraining, we introduce specific adaptations along three dimensions --- co-expression-guided gene partitioning, expression-aware contrast-set construction, and competence-gated contrastive onset. Specifically, we first construct two complementary views of each cell by partitioning its genes according to their co-expression structure. Then, to prevent the model from using gene-set identity as a shortcut, we construct hard negatives by permuting expression values while keeping gene identities unchanged. Finally, we introduce a competence-aware controller to determine how the contrastive objective is applied. Experiments on cell-type annotation and gene regulatory network inference demonstrate competitive transfer under the evaluated protocols. In the six-network GRN evaluation, our method records the highest mean AUROC and AUPRC point estimates among the compared variants, while the highest-scoring variant differs across individual networks. These results establish complementary-view contrastive learning as an effective direction for single-cell pretraining beyond gene reconstruction.", "arxiv_id": "2608.00985", "arxiv_url": "https://arxiv.org/abs/2608.00985", "authors": ["Jiaqi Xiong", "Yuntao hu", "Yu Zheng", "Yifei Shi", "Xinyue Guo", "Jiaxin Qi"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u5355\u7ec6\u80de\u8f6c\u5f55\u7ec4\u57fa\u7840\u6a21\u578b\u7684\u5bf9\u6bd4\u9884\u8bad\u7ec3\u6846\u67b6\uff0c\u4e0d\u518d\u53ea\u91cd\u5efa\u88ab\u906e\u853d\u57fa\u56e0\u8868\u8fbe\uff0c\u800c\u662f\u901a\u8fc7\u5171\u8868\u8fbe\u5f15\u5bfc\u7684\u57fa\u56e0\u5212\u5206\u6784\u9020\u4e92\u8865\u7ec6\u80de\u89c6\u56fe\u6765\u5b66\u4e60\u6574\u7ec6\u80de\u8868\u5f81\u3002\u8be5\u65b9\u6cd5\u5728\u7ec6\u80de\u7c7b\u578b\u6ce8\u91ca\u548c\u57fa\u56e0\u8c03\u63a7\u7f51\u7edc\u63a8\u65ad\u4e2d\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u5728\u516d\u4e2aGRN\u8bc4\u6d4b\u4e0a\u53d6\u5f97\u6700\u9ad8\u5e73\u5747AUROC\u548cAUPRC\u70b9\u4f30\u8ba1\u3002", "categories": ["cs.LG", "cs.AI", "q-bio.GN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00985", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u7ec6\u80de\u7ec4\u5b66", "\u5bf9\u6bd4\u5b66\u4e60", "\u8868\u5f81\u5b66\u4e60", "\u57fa\u56e0\u8c03\u63a7\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00985v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Gene Reconstruction: Learning Cell Representations through Complementary Transcriptomic Views", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u5355\u7ec6\u80de\u8f6c\u5f55\u7ec4\u57fa\u7840\u6a21\u578b\u7684\u5bf9\u6bd4\u9884\u8bad\u7ec3\u6846\u67b6\uff0c\u4e0d\u518d\u53ea\u91cd\u5efa\u88ab\u906e\u853d\u57fa\u56e0\u8868\u8fbe\uff0c\u800c\u662f\u901a\u8fc7\u5171\u8868\u8fbe\u5f15\u5bfc\u7684\u57fa\u56e0\u5212\u5206\u6784\u9020\u4e92\u8865\u7ec6\u80de\u89c6\u56fe\u6765\u5b66\u4e60\u6574\u7ec6\u80de\u8868\u5f81\u3002\u8be5\u65b9\u6cd5\u5728\u7ec6\u80de\u7c7b\u578b\u6ce8\u91ca\u548c\u57fa\u56e0\u8c03\u63a7\u7f51\u7edc\u63a8\u65ad\u4e2d\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u5728\u516d\u4e2aGRN\u8bc4\u6d4b\u4e0a\u53d6\u5f97\u6700\u9ad8\u5e73\u5747AUROC\u548cAUPRC\u70b9\u4f30\u8ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly used as synthetic research participants and are often validated by whether their marginal responses resemble human data. We study a fixed panel of sixteen lightweight persona-conditioned GPT-4.1 configurations in repeated strategic games. The panel met preregistered broad-reference condition-mean criteria in three of four repeated-game cells; the sole miss was 0.011 below the lower reference bound. Variation was strongly prompt-indexed, but its share depended on uncertainty assumptions: fixed-panel symmetric-Dirichlet sensitivities produced median between-prompt shares of 63%-71% under Jeffreys alpha=0.5 and 47%-53% under alpha=1, while finite-opportunity plug-in estimates were 85%-96%. Aggregate continuation-probability contrasts were +0.083 and +0.078, with conservative simultaneous 95% intervals [-0.171, +0.330] and [-0.181, +0.330]. The treatment jointly changed the continuation process and its textual representation. A separate wording-and-position operation shifted cooperation from 0/40 to 37/40 in the bare configuration, and a label conflict also revealed representation control. The original persona-level p13 result was not prospectively family-controlled, while a post-adjudication exact gate was structurally underpowered; p13 is therefore a replication target rather than a finding. External review exposed family-error, dependence, construct, and boundary-uncertainty defects, and zero-call reanalysis changed the interpretation without rewriting the historical record. The registered marginal criteria could be passed without precisely estimating the treatment-response object. A public capsule verifies 4,916 confirmatory Phase 3-5 runs with no live model calls. The results concern one fixed model-prompt panel and do not establish human substitutability.", "arxiv_id": "2608.00979", "arxiv_url": "https://arxiv.org/abs/2608.00979", "authors": ["Yohei Nakajima"], "brief": "\u672c\u6587\u7814\u7a7616\u4e2a\u8f7b\u91cf\u7ea7\u4eba\u683c\u8bbe\u5b9a\u7684 GPT-4.1 \u9762\u677f\u5728\u91cd\u590d\u535a\u5f08\u4e2d\u7684\u8868\u73b0\uff0c\u53d1\u73b0\u5b83\u4eec\u53ef\u4ee5\u901a\u8fc7\u7c97\u7c92\u5ea6\u7684\u4eba\u7c7b\u8fb9\u9645\u5747\u503c\u68c0\u9a8c\uff0c\u4f46\u5bf9\u5904\u7406\u6548\u5e94\u7684\u4f30\u8ba1\u4ecd\u7136\u5f88\u4e0d\u7cbe\u786e\u3002\u7ed3\u679c\u663e\u793a\u8f93\u51fa\u5f3a\u70c8\u53d7\u63d0\u793a\u8bcd\u3001\u63aa\u8f9e\u548c\u4f4d\u7f6e\u5f71\u54cd\uff0c\u8bf4\u660e\u4ec5\u51ed\u8fb9\u9645\u76f8\u4f3c\u6027\u9a8c\u8bc1 LLM \u4f5c\u4e3a\u5408\u6210\u53d7\u8bd5\u8005\u5e76\u4e0d\u53ef\u9760\u3002", "categories": ["cs.AI", "cs.CL", "cs.GT"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00979", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5408\u6210\u53d7\u8bd5\u8005", "\u63d0\u793a\u8bcd\u654f\u611f\u6027", "\u535a\u5f08\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00979v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Passing Coarse Marginal Checks Can Be Cheap: Persona Mixtures and Imprecise Treatment-Response Estimates in an LLM Persona Panel", "tldr": "\u672c\u6587\u7814\u7a7616\u4e2a\u8f7b\u91cf\u7ea7\u4eba\u683c\u8bbe\u5b9a\u7684 GPT-4.1 \u9762\u677f\u5728\u91cd\u590d\u535a\u5f08\u4e2d\u7684\u8868\u73b0\uff0c\u53d1\u73b0\u5b83\u4eec\u53ef\u4ee5\u901a\u8fc7\u7c97\u7c92\u5ea6\u7684\u4eba\u7c7b\u8fb9\u9645\u5747\u503c\u68c0\u9a8c\uff0c\u4f46\u5bf9\u5904\u7406\u6548\u5e94\u7684\u4f30\u8ba1\u4ecd\u7136\u5f88\u4e0d\u7cbe\u786e\u3002\u7ed3\u679c\u663e\u793a\u8f93\u51fa\u5f3a\u70c8\u53d7\u63d0\u793a\u8bcd\u3001\u63aa\u8f9e\u548c\u4f4d\u7f6e\u5f71\u54cd\uff0c\u8bf4\u660e\u4ec5\u51ed\u8fb9\u9645\u76f8\u4f3c\u6027\u9a8c\u8bc1 LLM \u4f5c\u4e3a\u5408\u6210\u53d7\u8bd5\u8005\u5e76\u4e0d\u53ef\u9760\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Flow Matching trains continuous-time generative models by regressing the velocity field of a probability path between a simple source distribution and a target data distribution. The coupling that pairs source and target samples strongly affects optimization and sample quality, but structured couplings typically rely on mini-batch transport or assignment procedures whose cost grows at least quadratically in batch size. We propose Quantile Coupling Flow Matching (QC-FM), a lightweight one-sided coupling: rather than matching two pre-sampled batches, it samples only the data batch and constructs each paired source directly. Data ranks projected along a small number of random orthogonal directions are mapped to Gaussian quantiles, and the latent code is completed in the orthogonal complement by conditional Gaussian sampling. The construction is one-dimensional per slice, so the coupling requires no pairwise cost matrix and no assignment to solve. We show that, for each drawn frame, this coupling eliminates the irreducible regression variance along every selected slice and makes the ideal flow exactly straight there, while leaving the sampling prior unchanged: generation still starts from the standard Gaussian, and the training source deviates from it only through the copula of the slice codes, whose transport cost we bound. For training, we apply QC to an anchor subset and complete the remaining source slots with exact Gaussian samples, retaining the QC bias while preserving an explicit signal from the Baseline coupling. Across CIFAR-10, CelebA, FFHQ, and ImageNet-64, QC-FM improves over the Baseline under matched training budgets, reducing FID by up to 12.9%, and outperforms OT-CFM on all four datasets. These results suggest that preserving projected rank structure is a simple and scalable way to inject useful geometric bias into FM couplings without solving a mini-batch transport problem.", "arxiv_id": "2608.00978", "arxiv_url": "https://arxiv.org/abs/2608.00978", "authors": ["Jin-Young Kim", "So-Yoon Cho", "Hyun-Gyoon Kim"], "brief": "\u8bba\u6587\u63d0\u51fa Quantile Coupling Flow Matching\uff08QC-FM\uff09\uff0c\u4e00\u79cd\u8f7b\u91cf\u7684\u4e00\u4fa7\u5206\u4f4d\u6570\u8026\u5408\u65b9\u6cd5\uff1a\u53ea\u91c7\u6837\u6570\u636e\u6279\u6b21\uff0c\u5e76\u901a\u8fc7\u968f\u673a\u6295\u5f71\u65b9\u5411\u4e0a\u7684\u79e9\u6620\u5c04\u5230\u9ad8\u65af\u5206\u4f4d\u6570\u6765\u6784\u9020\u6e90\u6837\u672c\uff0c\u907f\u514d\u5c0f\u6279\u91cf\u6700\u4f18\u4f20\u8f93\u4e2d\u7684\u4e24\u4e24\u4ee3\u4ef7\u77e9\u9635\u548c\u5206\u914d\u6c42\u89e3\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u4e2a\u56fe\u50cf\u6570\u636e\u96c6\u4e0a\u4ee5\u76f8\u540c\u8bad\u7ec3\u9884\u7b97\u4f18\u4e8e\u57fa\u7ebf\u548c OT-CFM\uff0cFID \u6700\u9ad8\u964d\u4f4e 12.9%\uff0c\u8bf4\u660e\u4fdd\u7559\u6295\u5f71\u79e9\u7ed3\u6784\u80fd\u6709\u6548\u63d0\u5347 Flow Matching \u7684\u8bad\u7ec3\u4e0e\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00978", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u6a21\u578b", "\u6d41\u5339\u914d", "\u6700\u4f18\u4f20\u8f93", "\u56fe\u50cf\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00978v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One-Sided Quantile Coupling for Flow Matching", "tldr": "\u8bba\u6587\u63d0\u51fa Quantile Coupling Flow Matching\uff08QC-FM\uff09\uff0c\u4e00\u79cd\u8f7b\u91cf\u7684\u4e00\u4fa7\u5206\u4f4d\u6570\u8026\u5408\u65b9\u6cd5\uff1a\u53ea\u91c7\u6837\u6570\u636e\u6279\u6b21\uff0c\u5e76\u901a\u8fc7\u968f\u673a\u6295\u5f71\u65b9\u5411\u4e0a\u7684\u79e9\u6620\u5c04\u5230\u9ad8\u65af\u5206\u4f4d\u6570\u6765\u6784\u9020\u6e90\u6837\u672c\uff0c\u907f\u514d\u5c0f\u6279\u91cf\u6700\u4f18\u4f20\u8f93\u4e2d\u7684\u4e24\u4e24\u4ee3\u4ef7\u77e9\u9635\u548c\u5206\u914d\u6c42\u89e3\u3002\u8be5\u65b9\u6cd5\u5728\u591a\u4e2a\u56fe\u50cf\u6570\u636e\u96c6\u4e0a\u4ee5\u76f8\u540c\u8bad\u7ec3\u9884\u7b97\u4f18\u4e8e\u57fa\u7ebf\u548c OT-CFM\uff0cFID \u6700\u9ad8\u964d\u4f4e 12.9%\uff0c\u8bf4\u660e\u4fdd\u7559\u6295\u5f71\u79e9\u7ed3\u6784\u80fd\u6709\u6548\u63d0\u5347 Flow Matching \u7684\u8bad\u7ec3\u4e0e\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The effective use of search engines by large language models (LLMs) remains a significant challenge, particularly in complex, multi-hop question-answering (MHQA) tasks. These tasks require the model to decompose questions into subqueries, retrieve relevant information, and synthesize answers from multiple sources, often leading to cascading errors due to poor retrieval in early stages. Reinforcement learning (RL) has shown promise in improving LLMs\u0027 search capabilities, but it often suffers from sparse rewards during training, hindering the model\u0027s ability to learn effectively. To address these challenges, we introduce Guided Retrieval Training (GRT), a novel method that improves the performance of a search agent by restricting the retrieval process during RL training using ground truth information. By focusing on a curated set of relevant documents, GRT provides the model with a stronger learning signal, mitigating the problem of sparse rewards and improving its ability to generate accurate subqueries and synthesize correct answers. Our experimental results demonstrate that GRT achieves consistent performance improvements over existing methods, such as Search-R1, across a wide range of question-answering (QA) tasks. Notably, GRT excels in MHQA tasks, achieving over 40% improvements in performance. Additionally, GRT enhances training efficiency by achieving better QA performance with fewer training steps.", "arxiv_id": "2608.00974", "arxiv_url": "https://arxiv.org/abs/2608.00974", "authors": ["Aounon Kumar", "Sudipta Paul", "Vivek Kulkarni", "Vijay Srinivasan", "Srinivas Chappidi"], "brief": "\u8bba\u6587\u63d0\u51fa Guided Retrieval Training\uff08GRT\uff09\uff0c\u5728\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u641c\u7d22\u667a\u80fd\u4f53\u65f6\u5229\u7528\u771f\u5b9e\u76f8\u5173\u6587\u6863\u9650\u5236\u68c0\u7d22\u8303\u56f4\uff0c\u4ece\u800c\u63d0\u4f9b\u66f4\u5bc6\u96c6\u3001\u66f4\u6709\u6548\u7684\u5b66\u4e60\u4fe1\u53f7\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u591a\u7c7b\u95ee\u7b54\u4efb\u52a1\u4e0a\u4f18\u4e8e Search-R1 \u7b49\u65b9\u6cd5\uff0c\u5c24\u5176\u5728\u591a\u8df3\u95ee\u7b54\u4e2d\u6027\u80fd\u63d0\u5347\u8d85\u8fc7 40%\uff0c\u5e76\u51cf\u5c11\u8bad\u7ec3\u6b65\u6570\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00974", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a", "\u5f3a\u5316\u5b66\u4e60", "\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00974v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Search-GRT: Guided Retrieval Training of Search Agents to Optimize for Complex Question Answering", "tldr": "\u8bba\u6587\u63d0\u51fa Guided Retrieval Training\uff08GRT\uff09\uff0c\u5728\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u641c\u7d22\u667a\u80fd\u4f53\u65f6\u5229\u7528\u771f\u5b9e\u76f8\u5173\u6587\u6863\u9650\u5236\u68c0\u7d22\u8303\u56f4\uff0c\u4ece\u800c\u63d0\u4f9b\u66f4\u5bc6\u96c6\u3001\u66f4\u6709\u6548\u7684\u5b66\u4e60\u4fe1\u53f7\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u591a\u7c7b\u95ee\u7b54\u4efb\u52a1\u4e0a\u4f18\u4e8e Search-R1 \u7b49\u65b9\u6cd5\uff0c\u5c24\u5176\u5728\u591a\u8df3\u95ee\u7b54\u4e2d\u6027\u80fd\u63d0\u5347\u8d85\u8fc7 40%\uff0c\u5e76\u51cf\u5c11\u8bad\u7ec3\u6b65\u6570\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model agents have shown strong capabilities in generating coherent and contextually appropriate responses, yet robust long-horizon dialogue remains limited by the lack of external memory that is traceable, updatable, and diagnostically transparent. Existing memory-augmented agents often store memories as isolated records or overwritable states, making it difficult to preserve how information originates, evolves, conflicts, or becomes obsolete over time. We propose TrajWiki, a trajectory-based memory framework for long-horizon conversational agents. Instead of treating memory as static entries, TrajWiki represents each memory as a source-grounded evolution trajectory, maintained through immutable episodic snapshots and claim-level operations such as ADD, REVISE, and DEPRECATE. To reduce fragmentation and retrieval cost, TrajWiki further introduces Memory Wiki, a persistent intermediate layer that incrementally compiles dialogue history into structured and interlinked wiki pages capturing salient entities, events, quantities, topics, and conflicts. At inference time, queries are routed hierarchically from relevant wiki pages to linked memory trajectories, then to corresponding snapshots and source messages for evidence-grounded answer synthesis. Experiments on LoCoMo and MedMT show that TrajWiki improves long-horizon dialogue performance across both open-source and closed-source LLM backbones, while providing greater interpretability and diagnostic visibility into memory evolution, retrieval failures, and answer generation.", "arxiv_id": "2608.00967", "arxiv_url": "https://arxiv.org/abs/2608.00967", "authors": ["Jingyu Sun", "Yuyang Xue", "Mingyang Li", "Zhengtao Yao", "Jiachen Li", "Yang Cui", "Wenhao Cai", "Haozhe Liu", "Fangying Wang", "Magdalene Katharina Montgomery", "Syed Murtuza Baker", "Hongpeng Zhou"], "brief": "TrajWiki \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u7a0b\u5bf9\u8bdd\u667a\u80fd\u4f53\u7684\u53ef\u6eaf\u6e90\u8bb0\u5fc6\u6846\u67b6\uff0c\u5c06\u8bb0\u5fc6\u8868\u793a\u4e3a\u7531\u4e0d\u53ef\u53d8\u5bf9\u8bdd\u5feb\u7167\u548c ADD/REVISE/DEPRECATE \u7b49\u58f0\u660e\u7ea7\u64cd\u4f5c\u7ec4\u6210\u7684\u6f14\u5316\u8f68\u8ff9\u3002\u5b83\u901a\u8fc7\u201cMemory Wiki\u201d\u628a\u5bf9\u8bdd\u5386\u53f2\u589e\u91cf\u6574\u7406\u6210\u7ed3\u6784\u5316\u4e92\u8054\u9875\u9762\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u5206\u5c42\u68c0\u7d22\u5230\u8bc1\u636e\u6765\u6e90\uff0c\u4ece\u800c\u63d0\u5347 LoCoMo \u548c MedMT \u4e0a\u7684\u957f\u7a0b\u5bf9\u8bdd\u6548\u679c\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00967", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u7a0b\u5bf9\u8bdd", "\u5916\u90e8\u8bb0\u5fc6", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00967v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TrajWiki: Source-Grounded Memory Trajectories for Long-Horizon Dialogue Agents", "tldr": "TrajWiki \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u7a0b\u5bf9\u8bdd\u667a\u80fd\u4f53\u7684\u53ef\u6eaf\u6e90\u8bb0\u5fc6\u6846\u67b6\uff0c\u5c06\u8bb0\u5fc6\u8868\u793a\u4e3a\u7531\u4e0d\u53ef\u53d8\u5bf9\u8bdd\u5feb\u7167\u548c ADD/REVISE/DEPRECATE \u7b49\u58f0\u660e\u7ea7\u64cd\u4f5c\u7ec4\u6210\u7684\u6f14\u5316\u8f68\u8ff9\u3002\u5b83\u901a\u8fc7\u201cMemory Wiki\u201d\u628a\u5bf9\u8bdd\u5386\u53f2\u589e\u91cf\u6574\u7406\u6210\u7ed3\u6784\u5316\u4e92\u8054\u9875\u9762\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u5206\u5c42\u68c0\u7d22\u5230\u8bc1\u636e\u6765\u6e90\uff0c\u4ece\u800c\u63d0\u5347 LoCoMo \u548c MedMT \u4e0a\u7684\u957f\u7a0b\u5bf9\u8bdd\u6548\u679c\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cryptographic code is critical infrastructure that must be correct, yet formally verifying production libraries remains difficult. Existing language-model proof systems solve isolated obligations with specifications and premises already given, leaving production-library verification unresolved. We present CryptoProver, an AI-based system that synthesizes internal specifications and Verus-checked proofs from high-level API contracts. Without changing executable code, CryptoProver constructs a new independent proof of curve25519-dalek and verifies RustCrypto\u0027s previously unverified chacha20 implementation against an RFC 8439 specification. These cryptographic lineages underpin deployed systems including Signal and Shadowsocks; Signal has an estimated 218M global downloads. The independent, human-led curve25519-dalek verification was developed publicly over eight months by five main contributors. Given the API contracts and a fixed trusted library of field specifications, arithmetic facts, axioms, and vstd, CryptoProver synthesizes the internal specifications and proofs in 11.4 hours with USD 466.99 in recorded API cost. CryptoProver follows a trust-first design principle: mechanical gates reject specification weakening, invented axioms, and cross-module breakage, while isolation blocks reference proof retrieval, including from git history.", "arxiv_id": "2608.00965", "arxiv_url": "https://arxiv.org/abs/2608.00965", "authors": ["Chuyue Sun", "Su Fong", "Zhiyi Kuang", "Yizheng Jiao", "Nina Narodytska", "Haoze Wu", "David L. Dill", "Clark Barrett"], "brief": "\u8bba\u6587\u63d0\u51fa CryptoProver\uff0c\u4e00\u4e2a\u57fa\u4e8e AI \u7684\u5bc6\u7801\u5e93\u9a8c\u8bc1\u7cfb\u7edf\uff0c\u53ef\u4ece\u9ad8\u5c42 API \u5951\u7ea6\u81ea\u52a8\u5408\u6210\u5185\u90e8\u89c4\u683c\u4e0e Verus \u53ef\u68c0\u67e5\u8bc1\u660e\uff0c\u4e14\u4e0d\u4fee\u6539\u53ef\u6267\u884c\u4ee3\u7801\u3002\u5b83\u72ec\u7acb\u9a8c\u8bc1\u4e86 curve25519-dalek\uff0c\u5e76\u9a8c\u8bc1\u4e86 RustCrypto \u4e2d\u6b64\u524d\u672a\u9a8c\u8bc1\u7684 chacha20 \u5b9e\u73b0\uff1b\u5728\u7ed9\u5b9a\u53ef\u4fe1\u57fa\u7840\u5e93\u6761\u4ef6\u4e0b\uff0c\u7ea6 11.4 \u5c0f\u65f6\u3001466.99 \u7f8e\u5143 API \u6210\u672c\u5b8c\u6210\u8bc1\u660e\u5408\u6210\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00965", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u5bc6\u7801\u5e93", "\u7a0b\u5e8f\u5408\u6210", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00965v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "An AI Approach to Verified Production Cryptographic Libraries", "tldr": "\u8bba\u6587\u63d0\u51fa CryptoProver\uff0c\u4e00\u4e2a\u57fa\u4e8e AI \u7684\u5bc6\u7801\u5e93\u9a8c\u8bc1\u7cfb\u7edf\uff0c\u53ef\u4ece\u9ad8\u5c42 API \u5951\u7ea6\u81ea\u52a8\u5408\u6210\u5185\u90e8\u89c4\u683c\u4e0e Verus \u53ef\u68c0\u67e5\u8bc1\u660e\uff0c\u4e14\u4e0d\u4fee\u6539\u53ef\u6267\u884c\u4ee3\u7801\u3002\u5b83\u72ec\u7acb\u9a8c\u8bc1\u4e86 curve25519-dalek\uff0c\u5e76\u9a8c\u8bc1\u4e86 RustCrypto \u4e2d\u6b64\u524d\u672a\u9a8c\u8bc1\u7684 chacha20 \u5b9e\u73b0\uff1b\u5728\u7ed9\u5b9a\u53ef\u4fe1\u57fa\u7840\u5e93\u6761\u4ef6\u4e0b\uff0c\u7ea6 11.4 \u5c0f\u65f6\u3001466.99 \u7f8e\u5143 API \u6210\u672c\u5b8c\u6210\u8bc1\u660e\u5408\u6210\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-term memory is essential for LVLM agents to maintain consistency and integrate information across extended multimodal interactions. Existing agent memory systems, however, often reduce visual experiences into textual summaries or rely on static retrieve-then-reason pipelines, which are inefficient at query time and brittle when questions require image-text binding, temporal updates, or visual details. We propose Prospective Multimodal Memory Compilation, a framework that shifts part of the memory reasoning process from query time to memory consolidation time. Given accumulated multimodal interactions, a Questioner predicts future question candidates, a Planner compiles question-conditioned multimodal memory programs, and a Doubter verifies whether the planned evidence path can support the predicted answer. The verified question-program pairs form a structured question bank for efficient query-time routing and evidence retrieval. Experiments on multimodal long-term memory benchmarks show that our method improves answer quality and visual evidence recall while reducing query-time token and latency costs. Extensive ablations analyze the effects of self-feedback, dynamic planning, raw-image access, and question bank coverage.", "arxiv_id": "2608.00962", "arxiv_url": "https://arxiv.org/abs/2608.00962", "authors": ["Jingyu Sun", "Yan Lin", "Yuyang Xue", "Yifan Wang", "Zhengtao Yao", "Rui Qian", "Zefeng Xu", "Jiachen Li", "Xianyang Liu", "Jiancheng Pan", "Jingyuan Sun", "Syed Murtuza Baker", "Hongpeng Zhou"], "brief": "\u672c\u6587\u63d0\u51fa PMMC\uff0c\u5c06\u957f\u7a0b\u591a\u6a21\u6001\u8bb0\u5fc6\u7684\u4e00\u90e8\u5206\u63a8\u7406\u4ece\u67e5\u8be2\u9636\u6bb5\u524d\u79fb\u5230\u8bb0\u5fc6\u5de9\u56fa\u9636\u6bb5\uff1a\u9884\u6d4b\u672a\u6765\u95ee\u9898\u3001\u7f16\u8bd1\u95ee\u9898\u6761\u4ef6\u5316\u7684\u591a\u6a21\u6001\u8bb0\u5fc6\u7a0b\u5e8f\uff0c\u5e76\u9a8c\u8bc1\u8bc1\u636e\u8def\u5f84\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u63d0\u5347\u56de\u7b54\u8d28\u91cf\u548c\u89c6\u89c9\u8bc1\u636e\u53ec\u56de\uff0c\u540c\u65f6\u964d\u4f4e\u67e5\u8be2\u65f6\u7684 token \u4e0e\u5ef6\u8fdf\u5f00\u9500\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00962", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u957f\u671f\u8bb0\u5fc6", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00962v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PMMC: Prospective Multimodal Memory Compilation for Long-Term LVLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa PMMC\uff0c\u5c06\u957f\u7a0b\u591a\u6a21\u6001\u8bb0\u5fc6\u7684\u4e00\u90e8\u5206\u63a8\u7406\u4ece\u67e5\u8be2\u9636\u6bb5\u524d\u79fb\u5230\u8bb0\u5fc6\u5de9\u56fa\u9636\u6bb5\uff1a\u9884\u6d4b\u672a\u6765\u95ee\u9898\u3001\u7f16\u8bd1\u95ee\u9898\u6761\u4ef6\u5316\u7684\u591a\u6a21\u6001\u8bb0\u5fc6\u7a0b\u5e8f\uff0c\u5e76\u9a8c\u8bc1\u8bc1\u636e\u8def\u5f84\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u63d0\u5347\u56de\u7b54\u8d28\u91cf\u548c\u89c6\u89c9\u8bc1\u636e\u53ec\u56de\uff0c\u540c\u65f6\u964d\u4f4e\u67e5\u8be2\u65f6\u7684 token \u4e0e\u5ef6\u8fdf\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI anthropomorphism is typically treated as a problem of user misperception requiring institutional correction. Users who engage in sustained or relational interaction with AI are routinely pathologised or dismissed as naive, vulnerable to delusion or lacking in discernment. This paper argues that the dominant anthropomorphism frame operates from a position of institutional advantage rather than earned epistemic authority: collapsing the variety of academic perspectives into a single outbound position of user error, imposed without establishing the grounds required to justify it and without accounting for the harms it produces. The framing does not simply manage risk. It adjudicates the legitimacy of human experience in interaction with a phenomenon whose nature the field itself has not resolved. Reproducing itself through a self-validating evidentiary loop, the frame imposes costs that fall disproportionately on neurodivergent users, those in crisis and others whose modes of engagement diverge from institutional norms. The paper concludes by outlining the methodological commitments an equitable framing would need to honour. The argument does not engage the question of whether anthropomorphic interpretations are ultimately correct; it instead challenges whether the governing and institutional bodies determining these interpretations have met the conditions required to do so, and whether the research communities whose findings underpin them have held that translation to account.", "arxiv_id": "2608.00961", "arxiv_url": "https://arxiv.org/abs/2608.00961", "authors": ["Donna M Bye", "Levin Kuhlmann"], "brief": "\u672c\u6587\u6279\u5224\u5f53\u524d\u5c06 AI \u62df\u4eba\u5316\u4e3b\u8981\u89c6\u4e3a\u7528\u6237\u8bef\u5224\u7684\u4e3b\u6d41\u6846\u67b6\uff0c\u6307\u51fa\u8fd9\u79cd\u6846\u67b6\u66f4\u591a\u6765\u81ea\u673a\u6784\u6743\u529b\u800c\u975e\u5145\u5206\u7684\u8ba4\u8bc6\u8bba\u4f9d\u636e\u3002\u4f5c\u8005\u8ba4\u4e3a\u5b83\u4f1a\u8d2c\u4f4e\u7528\u6237\u7ecf\u9a8c\uff0c\u5e76\u5bf9\u795e\u7ecf\u591a\u6837\u6027\u7528\u6237\u3001\u5371\u673a\u4e2d\u7684\u7528\u6237\u7b49\u7fa4\u4f53\u9020\u6210\u4e0d\u6210\u6bd4\u4f8b\u7684\u4f24\u5bb3\uff0c\u547c\u5401\u5efa\u7acb\u66f4\u516c\u5e73\u7684\u65b9\u6cd5\u8bba\u6846\u67b6\u3002", "categories": ["cs.CY", "cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00961", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u4f26\u7406", "\u4eba\u673a\u4ea4\u4e92", "\u62df\u4eba\u5316", "\u793e\u4f1a\u5f71\u54cd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00961v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Epistemic Politics of AI Anthropomorphism", "tldr": "\u672c\u6587\u6279\u5224\u5f53\u524d\u5c06 AI \u62df\u4eba\u5316\u4e3b\u8981\u89c6\u4e3a\u7528\u6237\u8bef\u5224\u7684\u4e3b\u6d41\u6846\u67b6\uff0c\u6307\u51fa\u8fd9\u79cd\u6846\u67b6\u66f4\u591a\u6765\u81ea\u673a\u6784\u6743\u529b\u800c\u975e\u5145\u5206\u7684\u8ba4\u8bc6\u8bba\u4f9d\u636e\u3002\u4f5c\u8005\u8ba4\u4e3a\u5b83\u4f1a\u8d2c\u4f4e\u7528\u6237\u7ecf\u9a8c\uff0c\u5e76\u5bf9\u795e\u7ecf\u591a\u6837\u6027\u7528\u6237\u3001\u5371\u673a\u4e2d\u7684\u7528\u6237\u7b49\u7fa4\u4f53\u9020\u6210\u4e0d\u6210\u6bd4\u4f8b\u7684\u4f24\u5bb3\uff0c\u547c\u5401\u5efa\u7acb\u66f4\u516c\u5e73\u7684\u65b9\u6cd5\u8bba\u6846\u67b6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing 6-DoF grasp detectors typically rank grasp candidates by detector confidence. However, our analysis on GraspNet-1Billion shows that detector confidence is often poorly aligned with grasp quality, causing successful grasp candidates to be ranked too low during execution. Motivated by this observation, we formulate grasp candidate re-ranking as a separate task for frozen detectors, aiming to improve candidate ordering without changing the detector or its grasp candidates. We propose GraRe, which estimates grasp quality from candidate attributes, shell-stratified local geometry, and object context. Candidate attributes condition the local geometric and object-context representations, and a Transformer fuses all three feature types. The predicted quality is combined with detector confidence to produce the final ranking. Experiments on GraspNet-1Billion with three frozen detectors show consistent improvements, with gains of up to 13.60 points in Average AP. Real-robot experiments further demonstrate robust grasping in cluttered scenes. These results show that improving candidate ranking provides a practical way to enhance frozen 6-DoF grasp detectors.", "arxiv_id": "2608.00946", "arxiv_url": "https://arxiv.org/abs/2608.00946", "authors": ["Jibao Yuan", "Yuhui Zhao", "Yinzhen Lv", "Chao Xu", "Shun Li", "Chenxi Deng", "Shaofei Chen"], "brief": "\u8bba\u6587\u6307\u51fa\u73b0\u67096-DoF\u6293\u53d6\u68c0\u6d4b\u5668\u7684\u7f6e\u4fe1\u5ea6\u5e38\u4e0e\u771f\u5b9e\u6293\u53d6\u8d28\u91cf\u4e0d\u4e00\u81f4\uff0c\u5bfc\u81f4\u597d\u6293\u53d6\u5019\u9009\u5728\u6267\u884c\u65f6\u6392\u5e8f\u9760\u540e\u3002\u4f5c\u8005\u63d0\u51faGraRe\uff0c\u5728\u4e0d\u4fee\u6539\u51bb\u7ed3\u68c0\u6d4b\u5668\u548c\u5019\u9009\u96c6\u5408\u7684\u60c5\u51b5\u4e0b\uff0c\u5229\u7528\u5019\u9009\u5c5e\u6027\u3001\u5c40\u90e8\u51e0\u4f55\u4e0e\u7269\u4f53\u4e0a\u4e0b\u6587\u91cd\u6392\u5e8f\u6293\u53d6\u5019\u9009\uff0c\u5728GraspNet-1Billion\u4e0a\u6700\u9ad8\u63d0\u534713.60\u70b9Average AP\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u6742\u4e71\u573a\u666f\u4e2d\u8868\u73b0\u7a33\u5065\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00946", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u6293\u53d6", "\u91cd\u6392\u5e8f", "\u4e09\u7ef4\u89c6\u89c9", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00946v1", "published_at": "2026-08-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GraRe: Grasp Candidate Re-Ranking for Frozen 6-DoF Grasp Detectors", "tldr": "\u8bba\u6587\u6307\u51fa\u73b0\u67096-DoF\u6293\u53d6\u68c0\u6d4b\u5668\u7684\u7f6e\u4fe1\u5ea6\u5e38\u4e0e\u771f\u5b9e\u6293\u53d6\u8d28\u91cf\u4e0d\u4e00\u81f4\uff0c\u5bfc\u81f4\u597d\u6293\u53d6\u5019\u9009\u5728\u6267\u884c\u65f6\u6392\u5e8f\u9760\u540e\u3002\u4f5c\u8005\u63d
