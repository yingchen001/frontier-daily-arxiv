\u63a8\u7406\u7684\u8bad\u7ec3\u514d\u8d39\u81ea\u63a8\u6d4b\u89e3\u7801\u6846\u67b6\u3002\u5b83\u76f4\u63a5\u7528\u76ee\u6807\u6a21\u578b\u57fa\u4e8e\u52a8\u6001\u7a00\u758f\u4e14\u53ef\u53ec\u56de\u7684 KV cache \u751f\u6210\u8f7b\u91cf\u8349\u7a3f\uff0c\u5e76\u4fdd\u6301\u76ee\u6807\u6a21\u578b\u8f93\u51fa\u5206\u5e03\u4e0d\u53d8\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27735", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7ed9\u51fa\u7edf\u4e00\u6548\u7387\u5206\u6790\uff0c\u6307\u51fa\u5f53\u8fb9\u9645\u63a5\u53d7\u6982\u7387\u4f4e\u4e8e\u76f8\u5bf9\u8349\u7a3f\u6210\u672c\u65f6\uff0c\u5ef6\u957f\u63a8\u6d4b\u957f\u5ea6\u53cd\u800c\u4f1a\u964d\u4f4e\u52a0\u901f\u6548\u679c", "\u5229\u7528\u5b8c\u6574\u4e0a\u4e0b\u6587\u9a8c\u8bc1\u9636\u6bb5\u4ea7\u751f\u7684\u9010\u5934\u6ce8\u610f\u529b\u7edf\u8ba1\u4f5c\u4e3a\u65e0\u9700\u989d\u5916\u524d\u5411\u7684 token \u91cd\u8981\u6027\u4fe1\u53f7\uff0c\u53ec\u56de\u5173\u952e\u5386\u53f2 token", "\u8bbe\u8ba1\u5728\u7ebf\u71b5\u63a7\u5236\u5668\uff0c\u6839\u636e\u9884\u671f\u9010\u6b65\u6548\u7387\u81ea\u9002\u5e94\u9009\u62e9\u63a8\u6d4b\u957f\u5ea6\uff0c\u5728\u591a\u79cd\u957f\u4e0a\u4e0b\u6587\u4efb\u52a1\u548c\u6a21\u578b\u89c4\u6a21\u4e0a\u5b9e\u73b0\u7a33\u5b9a\u7aef\u5230\u7aef\u52a0\u901f"], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u52a0\u901f", "KV\u7f13\u5b58"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27735v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Sparse Glimpse of the Whole: Train-Free Self-Speculative Decoding", "tldr": "\u8bad\u7ec3\u514d\u8d39\u81ea\u63a8\u6d4b\u89e3\u7801\u52a0\u901f\u957f\u4e0a\u4e0b\u6587\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SparseSpec-L\uff0c\u4e00\u79cd\u9762\u5411\u957f\u4e0a\u4e0b\u6587\u5927\u6a21\u578b\u63a8\u7406\u7684\u8bad\u7ec3\u514d\u8d39\u81ea\u63a8\u6d4b\u89e3\u7801\u6846\u67b6\u3002\u5b83\u76f4\u63a5\u7528\u76ee\u6807\u6a21\u578b\u57fa\u4e8e\u52a8\u6001\u7a00\u758f\u4e14\u53ef\u53ec\u56de\u7684 KV cache \u751f\u6210\u8f7b\u91cf\u8349\u7a3f\uff0c\u5e76\u4fdd\u6301\u76ee\u6807\u6a21\u578b\u8f93\u51fa\u5206\u5e03\u4e0d\u53d8\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u989d\u5916\u8349\u7a3f\u6a21\u578b\uff0c\u4e5f\u4e0d\u6c38\u4e45\u4e22\u5f03\u5bc6\u96c6 KV cache\uff0c\u964d\u4f4e\u4e86\u90e8\u7f72\u590d\u6742\u5ea6\uff1b\u540c\u65f6\u9488\u5bf9\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u7684\u5185\u5b58\u5e26\u5bbd\u74f6\u9888\u63d0\u4f9b\u4e86\u5b9e\u7528\u52a0\u901f\u8def\u5f84\u3002"}, {"abstract": "Recent advances in preference alignment for diffusion-based video generation, particularly via Direct Preference Optimization (DPO), have significantly improved visual quality. However, temporally sparse artifacts such as motion collapse, object flickering, and color oversaturation remain a major barrier to perceptual realism. Existing methods struggle with these issues due to two key limitations: (1) the preference attribution bottleneck, where offline human annotations are costly and fail to accurately capture learning dynamics, while online reward signals are rollout-aware but often unstable and biased; and (2) temporal credit misallocation, where uniformly applied supervision cannot effectively target the brief segments in which artifacts occur. To address these challenges, we propose concentrated Implicit Preference Optimization (cIPO), a post-training framework for video diffusion models. cIPO derives implicit preference signals directly from the denoising process: given a real video, the model adds forward noise and reconstructs it via iterative denoising, treating the original as the preferred sample and the reconstruction as the dispreferred one. This formulation captures inference-time errors without requiring human annotations or external reward models. Moreover, frame-level discrepancies between original and reconstructed videos reveal when failures occur. cIPO leverages this by computing temporal reconstruction errors and concentrating optimization on high-error segments, enabling more precise correction of failure-prone regions. Extensive experiments demonstrate that cIPO consistently enhances video authenticity and temporal coherence across multiple datasets, highlighting the effectiveness and efficiency of implicit preference with temporally concentrated optimization.", "arxiv_id": "2607.28058", "arxiv_url": "https://arxiv.org/abs/2607.28058", "authors": ["Henglin Liu", "Fangyuan Kong", "Jing Wang", "Yizhou Lin", "Nisha Huang", "Chang Liu", "Xintao Wang", "Pengfei Wan", "Kun Gai", "Xiu Li"], "brief": "\u8bba\u6587\u63d0\u51fa concentrated Implicit Preference Optimization\uff08cIPO\uff09\uff0c\u7528\u4e8e\u6587\u672c\u5230\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u540e\u8bad\u7ec3\u5bf9\u9f50\u3002\u5b83\u4ece\u53bb\u566a\u91cd\u5efa\u8fc7\u7a0b\u81ea\u52a8\u6784\u9020\u504f\u597d\u5bf9\uff0c\u5e76\u5c06\u4f18\u5316\u96c6\u4e2d\u5230\u9ad8\u91cd\u5efa\u8bef\u5dee\u7684\u65f6\u95f4\u7247\u6bb5\uff0c\u4ee5\u4fee\u590d\u95ea\u70c1\u3001\u8fd0\u52a8\u5d29\u584c\u7b49\u7a00\u758f\u65f6\u5e8f\u4f2a\u5f71\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28058", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u4eba\u5de5\u504f\u597d\u6807\u6ce8\u6216\u5916\u90e8\u5956\u52b1\u6a21\u578b\uff1a\u771f\u5b9e\u89c6\u9891\u4f5c\u4e3a\u504f\u597d\u6837\u672c\uff0c\u6a21\u578b\u53bb\u566a\u91cd\u5efa\u7ed3\u679c\u4f5c\u4e3a\u975e\u504f\u597d\u6837\u672c\uff0c\u9690\u5f0f\u83b7\u5f97\u504f\u597d\u4fe1\u53f7\u3002", "\u5229\u7528\u9010\u5e27\u539f\u59cb-\u91cd\u5efa\u5dee\u5f02\u8bc6\u522b\u9519\u8bef\u53d1\u751f\u65f6\u523b\uff0c\u7f13\u89e3\u4f20\u7edf\u5747\u5300\u76d1\u7763\u5bfc\u81f4\u7684\u65f6\u5e8f\u4fe1\u7528\u5206\u914d\u4e0d\u51c6\u95ee\u9898\u3002", "\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u63d0\u5347\u89c6\u9891\u771f\u5b9e\u6027\u4e0e\u65f6\u5e8f\u4e00\u81f4\u6027\uff0c\u5c24\u5176\u9488\u5bf9\u8fd0\u52a8\u5d29\u584c\u3001\u7269\u4f53\u95ea\u70c1\u3001\u989c\u8272\u8fc7\u9971\u548c\u7b49\u77ed\u6682\u4f2a\u5f71\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u504f\u597d\u4f18\u5316", "\u65f6\u5e8f\u4e00\u81f4\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28058v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Temporal Concentration from Rollout Errors: Implicit Preference Optimization for Text-to-Video Diffusion", "tldr": "\u7528\u91cd\u5efa\u8bef\u5dee\u5b9a\u4f4d\u5e76\u4f18\u5316\u89c6\u9891\u6269\u6563\u65f6\u5e8f\u7455\u75b5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa concentrated Implicit Preference Optimization\uff08cIPO\uff09\uff0c\u7528\u4e8e\u6587\u672c\u5230\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u540e\u8bad\u7ec3\u5bf9\u9f50\u3002\u5b83\u4ece\u53bb\u566a\u91cd\u5efa\u8fc7\u7a0b\u81ea\u52a8\u6784\u9020\u504f\u597d\u5bf9\uff0c\u5e76\u5c06\u4f18\u5316\u96c6\u4e2d\u5230\u9ad8\u91cd\u5efa\u8bef\u5dee\u7684\u65f6\u95f4\u7247\u6bb5\uff0c\u4ee5\u4fee\u590d\u95ea\u70c1\u3001\u8fd0\u52a8\u5d29\u584c\u7b49\u7a00\u758f\u65f6\u5e8f\u4f2a\u5f71\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u6269\u6563\u6a21\u578b\u63a8\u7406\u8fc7\u7a0b\u4e2d\u7684 rollout/reconstruction error \u8f6c\u5316\u4e3a\u53ef\u7528\u504f\u597d\u4fe1\u53f7\uff0c\u964d\u4f4e\u89c6\u9891\u504f\u597d\u5bf9\u9f50\u6210\u672c\uff0c\u5e76\u66f4\u7cbe\u51c6\u5730\u4f18\u5316\u65f6\u5e8f\u6545\u969c\u533a\u57df\uff0c\u5bf9\u63d0\u5347\u6587\u672c\u5230\u89c6\u9891\u751f\u6210\u7684\u611f\u77e5\u771f\u5b9e\u611f\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Jigsaw puzzle solving requires jointly reasoning about visual content and geometric constraints, yet existing benchmarks use rectangular cuts that create ambiguous ground truth in texture-repeated regions. We introduce \\textit{\\ours{}}, a benchmark with tab-and-blank interlocking pieces where geometric constraints provide strong local compatibility requirements that, combined with visual content, yield unambiguous ground truth. Across 95K instances at four grid densities (4$\\times$4 to 16$\\times$16), we find that \\textbf{zero-shot VLMs largely lack geometric reasoning}: only one of five frontier models (GPT-5.5) exceeds random baseline on 4$\\times$4 puzzles, while all others perform at chance level. While supervised fine-tuning achieves $\u003e$97\\% on 4$\\times$4, \\textbf{all models collapse on larger grids}: GPT-5.5 drops from 70\\% to near-random on 8$\\times$8, and even fine-tuned models fall below 5\\% on 12$\\times$12. This ``scaling cliff\u0027\u0027 suggests current architectures cannot maintain consistent constraint satisfaction as the number of pieces increases. \\ours{} establishes scalable geometric reasoning as an open challenge for vision-language models.", "arxiv_id": "2607.27670", "arxiv_url": "https://arxiv.org/abs/2607.27670", "authors": ["Shawn Li", "Wei Yang", "Jike Zhong", "Jiate Li", "Jiawei Yang", "You Qin", "Ryan Rossi", "Franck Dernoncourt", "Roger Zimmermann", "Yue Wang", "Zhengzhong Tu", "Vicente Ordonez", "Mohit Bansal", "Yue Zhao"], "brief": "\u8bba\u6587\u63d0\u51faJigShape\u57fa\u51c6\uff0c\u7528\u5e26\u51f8\u51f9\u4e92\u9501\u7ed3\u6784\u7684\u62fc\u56fe\u8bc4\u4f30\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u89c6\u89c9-\u51e0\u4f55\u8054\u5408\u63a8\u7406\u80fd\u529b\u3002\u8be5\u8bbe\u8ba1\u51cf\u5c11\u4f20\u7edf\u77e9\u5f62\u5207\u5272\u5728\u91cd\u590d\u7eb9\u7406\u533a\u57df\u4e2d\u7684\u6807\u6ce8\u6b67\u4e49\uff0c\u63d0\u4f9b\u66f4\u660e\u786e\u7684\u51e0\u4f55\u7ea6\u675f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27670", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa95K\u4e2a\u62fc\u56fe\u5b9e\u4f8b\uff0c\u8986\u76d64\u00d74\u523016\u00d716\u56db\u79cd\u7f51\u683c\u5bc6\u5ea6\uff0c\u8981\u6c42\u6a21\u578b\u540c\u65f6\u5229\u7528\u89c6\u89c9\u5185\u5bb9\u4e0e\u5c40\u90e8\u51e0\u4f55\u517c\u5bb9\u6027", "\u96f6\u6837\u672cVLM\u8868\u73b0\u666e\u904d\u63a5\u8fd1\u968f\u673a\uff0c\u4e94\u4e2a\u524d\u6cbf\u6a21\u578b\u4e2d\u4ec5GPT-5.5\u57284\u00d74\u4efb\u52a1\u4e0a\u8d85\u8fc7\u968f\u673a\u57fa\u7ebf", "\u6a21\u578b\u5728\u89c4\u6a21\u6269\u5927\u65f6\u51fa\u73b0\u201c\u65ad\u5d16\u5f0f\u201d\u9000\u5316\uff1aGPT-5.5\u4ece4\u00d74\u768470%\u964d\u81f38\u00d78\u8fd1\u968f\u673a\uff0c\u5fae\u8c03\u6a21\u578b\u572812\u00d712\u4e5f\u4f4e\u4e8e5%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u51e0\u4f55\u63a8\u7406", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27670v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "JigShape: Evaluating Visual-Geometric Reasoning in VLMs through Jigsaw Puzzles", "tldr": "JigShape\u63ed\u793aVLM\u62fc\u56fe\u51e0\u4f55\u63a8\u7406\u65ad\u5d16", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faJigShape\u57fa\u51c6\uff0c\u7528\u5e26\u51f8\u51f9\u4e92\u9501\u7ed3\u6784\u7684\u62fc\u56fe\u8bc4\u4f30\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u89c6\u89c9-\u51e0\u4f55\u8054\u5408\u63a8\u7406\u80fd\u529b\u3002\u8be5\u8bbe\u8ba1\u51cf\u5c11\u4f20\u7edf\u77e9\u5f62\u5207\u5272\u5728\u91cd\u590d\u7eb9\u7406\u533a\u57df\u4e2d\u7684\u6807\u6ce8\u6b67\u4e49\uff0c\u63d0\u4f9b\u66f4\u660e\u786e\u7684\u51e0\u4f55\u7ea6\u675f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f53\u524dVLM\u867d\u5177\u5907\u4e00\u5b9a\u89c6\u89c9\u8bc6\u522b\u80fd\u529b\uff0c\u4f46\u96be\u4ee5\u7ef4\u6301\u968f\u89c4\u6a21\u589e\u957f\u7684\u4e00\u81f4\u51e0\u4f55\u7ea6\u675f\u6ee1\u8db3\u80fd\u529b\uff0c\u4e3a\u53ef\u6269\u5c55\u89c6\u89c9-\u51e0\u4f55\u63a8\u7406\u63d0\u4f9b\u4e86\u6e05\u6670\u4e14\u53ef\u91cf\u5316\u7684\u65b0\u6311\u6218\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) have achieved strong performance on a wide range of vision-language tasks, but often fail under imperfect or shifted contexts. A reliable MLLM should refuse truly out-of-context (OOC) questions with subject-level context shifts while still answering shifted in-context (Shifted IC) questions with non-subject context shifts. Existing benchmarks mainly target OOC or visually unanswerable questions, but overlook answerable Shifted IC cases and cover limited OOC shifts. To fill this gap, we present MMOOC, a large-scale benchmark for evaluating refusal and robust answering abilities of MLLMs. MMOOC contains over 41K image-question pairs, including answerable Shifted IC cases and unanswerable OOC cases, spanning three question formats, eight shift types and six visual scenarios, with data quality ensured through MLLM-based filtering and human verification. We evaluate model responses using Accuracy and Refusal Rate, and further introduce an LLM-as-a-Judge metric to assess the correctness of model reasoning. Experiments on diverse MLLMs show that current models still struggle to balance answer-ability and refusal under shifted contexts. We further analyze key failure patterns and show that post-training can improve robustness. MMOOC will be made publicly available.", "arxiv_id": "2607.27637", "arxiv_url": "https://arxiv.org/abs/2607.27637", "authors": ["Wenjie Zhu", "Yabin Zhang", "Wenjun Zeng", "Lei Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa MMOOC\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u4e0a\u4e0b\u6587\u5916\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7528\u4e8e\u540c\u65f6\u8003\u5bdf\u6a21\u578b\u5bf9\u771f\u6b63 OOC \u95ee\u9898\u7684\u62d2\u7b54\u80fd\u529b\uff0c\u4ee5\u53ca\u5bf9\u4ecd\u53ef\u56de\u7b54\u7684 Shifted IC \u95ee\u9898\u7684\u9c81\u68d2\u56de\u7b54\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b\u8d85\u8fc7 4.1 \u4e07\u4e2a\u56fe\u50cf-\u95ee\u9898\u5bf9\uff0c\u8986\u76d6\u591a\u79cd\u95ee\u9898\u5f62\u5f0f\u3001\u504f\u79fb\u7c7b\u578b\u4e0e\u89c6\u89c9\u573a\u666f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27637", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u533a\u5206\u4e3b\u4f53\u7ea7\u4e0a\u4e0b\u6587\u504f\u79fb\u5bfc\u81f4\u7684\u4e0d\u53ef\u56de\u7b54 OOC\uff0c\u4e0e\u975e\u4e3b\u4f53\u4e0a\u4e0b\u6587\u504f\u79fb\u4f46\u4ecd\u53ef\u56de\u7b54\u7684 Shifted IC\uff0c\u5f25\u8865\u73b0\u6709\u57fa\u51c6\u53ea\u5173\u6ce8\u4e0d\u53ef\u56de\u7b54\u95ee\u9898\u7684\u4e0d\u8db3", "\u6570\u636e\u8986\u76d6\u4e09\u79cd\u95ee\u9898\u683c\u5f0f\u3001\u516b\u7c7b\u504f\u79fb\u7c7b\u578b\u548c\u516d\u7c7b\u89c6\u89c9\u573a\u666f\uff0c\u5e76\u7ed3\u5408 MLLM \u8fc7\u6ee4\u4e0e\u4eba\u5de5\u9a8c\u8bc1\u4fdd\u8bc1\u8d28\u91cf", "\u4f7f\u7528 Accuracy\u3001Refusal Rate \u4ee5\u53ca LLM-as-a-Judge \u63a8\u7406\u6b63\u786e\u6027\u6307\u6807\u8bc4\u4f30\u591a\u79cd MLLM\uff0c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u96be\u4ee5\u5e73\u8861\u6b63\u786e\u56de\u7b54\u4e0e\u5408\u7406\u62d2\u7b54"], "keywords": ["\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u9c81\u68d2\u6027", "\u62d2\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27637v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MMOOC: A Comprehensive Benchmark for Out-of-Context Evaluation in Multimodal Large Language Models", "tldr": "\u8bc4\u6d4bMLLM\u4e0a\u4e0b\u6587\u504f\u79fb\u4e0b\u8be5\u7b54\u4e0e\u8be5\u62d2\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MMOOC\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u4e0a\u4e0b\u6587\u5916\u8bc4\u6d4b\u57fa\u51c6\uff0c\u7528\u4e8e\u540c\u65f6\u8003\u5bdf\u6a21\u578b\u5bf9\u771f\u6b63 OOC \u95ee\u9898\u7684\u62d2\u7b54\u80fd\u529b\uff0c\u4ee5\u53ca\u5bf9\u4ecd\u53ef\u56de\u7b54\u7684 Shifted IC \u95ee\u9898\u7684\u9c81\u68d2\u56de\u7b54\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b\u8d85\u8fc7 4.1 \u4e07\u4e2a\u56fe\u50cf-\u95ee\u9898\u5bf9\uff0c\u8986\u76d6\u591a\u79cd\u95ee\u9898\u5f62\u5f0f\u3001\u504f\u79fb\u7c7b\u578b\u4e0e\u89c6\u89c9\u573a\u666f\u3002", "why_notable": "MMOOC \u5c06\u201c\u8be5\u62d2\u7b54\u65f6\u62d2\u7b54\u201d\u548c\u201c\u4e0a\u4e0b\u6587\u6709\u504f\u79fb\u4f46\u4ecd\u5e94\u56de\u7b54\u201d\u7edf\u4e00\u7eb3\u5165\u8bc4\u6d4b\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u89c6\u89c9\u8bed\u8a00\u5e94\u7528\u4e2d\u7684\u4e0d\u5b8c\u7f8e\u4e0a\u4e0b\u6587\u573a\u666f\uff1b\u7ed3\u679c\u63ed\u793a\u4e86\u5f53\u524d MLLM \u9c81\u68d2\u6027\u4e0e\u62d2\u7b54\u7b56\u7565\u7684\u7cfb\u7edf\u6027\u77ed\u677f\uff0c\u5e76\u663e\u793a\u540e\u8bad\u7ec3\u6709\u671b\u6539\u8fdb\u3002"}, {"abstract": "Evaluating the quality and relevance of textual outputs from Large Language Models (LLMs) remains challenging and resource-intensive. Existing automated metrics often fail to capture the complexity and variability inherent in LLM-generated outputs. Moreover, these metrics typically rely on explicit reference standards, limiting their use mostly to domains with objective benchmarks. This work introduces a novel evaluation framework designed to approximate expert-level assessments of LLM-generated content. The proposed method employs pairwise comparisons of outputs by multiple LLMs, reducing biases from individual models. An Elo rating system is used to generate stable and interpretable rankings. Adjustable agreement thresholds, from full unanimity to majority voting, allow flexible control over evaluation confidence and coverage. The method\u0027s effectiveness is demonstrated through evaluating competency profiles extracted from scientific abstracts. Preliminary results show that automatically derived rankings correlate well with expert judgments, significantly reducing the need for extensive human intervention. By offering a scalable, consistent, and domain-agnostic evaluation layer, the framework supports more efficient and reliable quality assessments of LLM outputs across diverse applications.", "arxiv_id": "2607.28282", "arxiv_url": "https://arxiv.org/abs/2607.28282", "authors": ["Bertil Braun", "Martin Forell"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411LLM\u751f\u6210\u6587\u672c\u7684\u81ea\u52a8\u8bc4\u4f30\u6846\u67b6\uff1a\u7531\u591a\u4e2aLLM\u8fdb\u884c\u6210\u5bf9\u6bd4\u8f83\uff0c\u518d\u7528Elo\u8bc4\u5206\u751f\u6210\u7a33\u5b9a\u3001\u53ef\u89e3\u91ca\u7684\u8f93\u51fa\u6392\u540d\u3002\u6846\u67b6\u652f\u6301\u4ece\u5168\u4f53\u4e00\u81f4\u5230\u591a\u6570\u6295\u7968\u7684\u53ef\u8c03\u4e00\u81f4\u6027\u9608\u503c\uff0c\u4ee5\u5e73\u8861\u8bc4\u4f30\u7f6e\u4fe1\u5ea6\u4e0e\u8986\u76d6\u7387\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28282", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u4f9d\u8d56\u663e\u5f0f\u53c2\u8003\u7b54\u6848\uff0c\u9002\u7528\u4e8e\u7f3a\u5c11\u5ba2\u89c2\u6807\u51c6\u7684\u5f00\u653e\u5f0f\u6587\u672c\u751f\u6210\u573a\u666f", "\u901a\u8fc7\u591a\u4e2aLLM\u53c2\u4e0e\u6210\u5bf9\u6bd4\u8f83\uff0c\u964d\u4f4e\u5355\u4e00\u6a21\u578b\u504f\u5dee\uff0c\u5e76\u7528Elo\u7cfb\u7edf\u6c47\u603b\u6392\u540d", "\u5728\u79d1\u5b66\u6458\u8981\u4e2d\u62bd\u53d6\u80fd\u529b\u753b\u50cf\u7684\u4efb\u52a1\u4e0a\uff0c\u81ea\u52a8\u6392\u540d\u4e0e\u4e13\u5bb6\u5224\u65ad\u5448\u73b0\u8f83\u597d\u76f8\u5173\u6027"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u52a8\u8bc4\u4f30", "\u6392\u5e8f\u5b66\u4e60", "\u6587\u672c\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28282v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "(Towards) Scalable Reliable Automated Evaluation with Large Language Models", "tldr": "\u7528\u591aLLM\u6210\u5bf9\u6bd4\u8f83\u5b9e\u73b0\u53ef\u6269\u5c55\u81ea\u52a8\u8bc4\u4f30", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411LLM\u751f\u6210\u6587\u672c\u7684\u81ea\u52a8\u8bc4\u4f30\u6846\u67b6\uff1a\u7531\u591a\u4e2aLLM\u8fdb\u884c\u6210\u5bf9\u6bd4\u8f83\uff0c\u518d\u7528Elo\u8bc4\u5206\u751f\u6210\u7a33\u5b9a\u3001\u53ef\u89e3\u91ca\u7684\u8f93\u51fa\u6392\u540d\u3002\u6846\u67b6\u652f\u6301\u4ece\u5168\u4f53\u4e00\u81f4\u5230\u591a\u6570\u6295\u7968\u7684\u53ef\u8c03\u4e00\u81f4\u6027\u9608\u503c\uff0c\u4ee5\u5e73\u8861\u8bc4\u4f30\u7f6e\u4fe1\u5ea6\u4e0e\u8986\u76d6\u7387\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3aLLM\u8f93\u51fa\u8d28\u91cf\u8bc4\u4f30\u63d0\u4f9b\u4e86\u66f4\u901a\u7528\u3001\u53ef\u6269\u5c55\u4e14\u4f4e\u4eba\u5de5\u6210\u672c\u7684\u65b9\u6848\uff0c\u6709\u671b\u6210\u4e3a\u5f00\u653e\u9886\u57df\u751f\u6210\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u81ea\u52a8\u8bc4\u4f30\u5c42\u3002"}, {"abstract": "The web is increasingly accessed by AI agents rather than humans. Every agent needs knowledge, especially in the life-sciences, where agentic pipelines are growing fast. Access to the literature is a crucial part of that need, and resources such as Europe PMC, with over 40M indexed records, are widely used to meet it. Yet these resources were not built for AI agents: they take keywords and complex syntax and return whole papers, so every agent must learn the syntax, issue several searches, and read full papers to find the evidence it needs. We introduce EMBL AI Librarian, a knowledge layer that upgrades the Europe PMC interface for AI agents: an agent asks in natural language and receives evidence that answers it. A single LLM orchestrates the whole knowledge retrieval process: it plans complementary subqueries executed by the live Europe PMC search engine, then reads the selected papers and locates the relevant evidence. We evaluate Librarian across four benchmarks: literature synthesis, claim verification, open-domain question answering, and downstream biology tasks such as protocol questions and sequence manipulation. On ScholarQABench, Librarian improves Citation F1 by more than $16$ points over strong recently published baselines. Used as the retrieval layer of an existing claim-verification pipeline, it increases agreement with expert consensus; and on the open-form LitQA2 benchmark, a GPT-5.4 agent scores about $8$ points higher when grounded in Librarian than with web search. Overall, our results show that equipping life-science agents with the Librarian knowledge layer improves performance across a range of tasks. We release our code publicly at https://github.com/petroni-lab/librarian", "arxiv_id": "2607.28229", "arxiv_url": "https://arxiv.org/abs/2607.28229", "authors": ["Luigi Sigillo", "Matteo Silvestri", "Francesco Tabaro", "Rajat Bhatnagar", "Syed Irtaza Mubashar", "Matt Jeffryes", "Daljit Nijjer", "Vittorio Perera", "Ola Spjuth", "Julio Saez-Rodriguez", "Melissa Harrison", "Fabio Petroni"], "brief": "EMBL AI Librarian \u4e3a\u751f\u547d\u79d1\u5b66\u667a\u80fd\u4f53\u63d0\u4f9b\u9762\u5411\u81ea\u7136\u8bed\u8a00\u7684\u6587\u732e\u77e5\u8bc6\u5c42\uff0c\u57fa\u4e8e Europe PMC \u68c0\u7d22\u5e76\u7531\u5355\u4e00 LLM \u89c4\u5212\u5b50\u67e5\u8be2\u3001\u9605\u8bfb\u8bba\u6587\u548c\u5b9a\u4f4d\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u5728\u6587\u732e\u7efc\u5408\u3001\u4e8b\u5b9e\u6838\u9a8c\u3001\u5f00\u653e\u95ee\u7b54\u548c\u751f\u7269\u4efb\u52a1\u4e2d\u63d0\u5347\u6548\u679c\uff0c\u4f8b\u5982 ScholarQABench \u7684 Citation F1 \u63d0\u5347\u8d85\u8fc7 16 \u5206\uff0c\u5e76\u589e\u5f3a\u4e0b\u6e38\u667a\u80fd\u4f53\u7684\u6709\u636e\u56de\u7b54\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28229", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u751f\u547d\u79d1\u5b66", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28229v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "EMBL AI Librarian: Life-Sciences Knowledge Layer for AI Agents", "tldr": "EMBL AI Librarian \u4e3a\u751f\u547d\u79d1\u5b66\u667a\u80fd\u4f53\u63d0\u4f9b\u9762\u5411\u81ea\u7136\u8bed\u8a00\u7684\u6587\u732e\u77e5\u8bc6\u5c42\uff0c\u57fa\u4e8e Europe PMC \u68c0\u7d22\u5e76\u7531\u5355\u4e00 LLM \u89c4\u5212\u5b50\u67e5\u8be2\u3001\u9605\u8bfb\u8bba\u6587\u548c\u5b9a\u4f4d\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u5728\u6587\u732e\u7efc\u5408\u3001\u4e8b\u5b9e\u6838\u9a8c\u3001\u5f00\u653e\u95ee\u7b54\u548c\u751f\u7269\u4efb\u52a1\u4e2d\u63d0\u5347\u6548\u679c\uff0c\u4f8b\u5982 ScholarQABench \u7684 Citation F1 \u63d0\u5347\u8d85\u8fc7 16 \u5206\uff0c\u5e76\u589e\u5f3a\u4e0b\u6e38\u667a\u80fd\u4f53\u7684\u6709\u636e\u56de\u7b54\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automatic speech recognition (ASR) has achieved substantial gains in transcription accuracy, yet verbatim transcription does not necessarily produce readily usable text. It retains fillers, repetitions, false starts, and self-corrections that increase reading effort, obscure the speaker\u0027s final intent, and propagate unresolved or abandoned content to downstream tasks. Existing spoken-to-written methods process completed audio or transcripts but cannot revise emitted text when later speech changes how preceding content should be interpreted. We therefore formulate Agentic Speech Recognition (AgenticSR), an audio-to-clean-text task that removes disfluencies, resolves self-corrections, and normalizes written form while preserving the speaker\u0027s final intent. AgenticASR implements this task through an ASR--Refiner architecture that repeatedly transforms a bounded active context and replaces its corresponding output span as audio arrives. This enables continual emission and revision over streams of arbitrary duration. We also introduce AASR-Bench, a bilingual benchmark with fine-grained atomic rubrics. Across multiple ASR front ends, AgenticASR attains the highest AASR-Bench scores among evaluated systems. A human--AI agreement study shows that rubric-based judgments align with independent expert assessments. Ablations characterize Refiner capacity, context length, and the quality--latency trade-off between online and offline inference. Together, these results establish AgenticASR as a practical framework for intent-preserving clean transcription during ongoing speech. Code, AASR-Bench, and a demo will be released at https://github.com/AnXMuy/AgenticASR.", "arxiv_id": "2607.28175", "arxiv_url": "https://arxiv.org/abs/2607.28175", "authors": ["Zixuan Jiang", "Binghao Qiang", "Jiaying Chi", "Yanqiao Zhu", "Kai Yu", "Xie Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Agentic Speech Recognition\uff0c\u5c06\u6d41\u5f0f\u8bed\u97f3\u76f4\u63a5\u8f6c\u6362\u4e3a\u66f4\u6613\u8bfb\u7684\u201c\u5e72\u51c0\u6587\u672c\u201d\uff0c\u53ef\u53bb\u9664\u53e3\u5934\u7985\u3001\u91cd\u590d\u3001\u81ea\u6211\u4fee\u6b63\u5e76\u4fdd\u7559\u8bf4\u8bdd\u8005\u6700\u7ec8\u610f\u56fe\u3002\u5176 AgenticASR \u901a\u8fc7 ASR-Refiner \u67b6\u6784\u5728\u97f3\u9891\u5230\u6765\u65f6\u6301\u7eed\u4fee\u8ba2\u5df2\u8f93\u51fa\u6587\u672c\uff0c\u5e76\u5728\u65b0\u53cc\u8bed\u57fa\u51c6 AASR-Bench \u4e0a\u53d6\u5f97\u6700\u4f73\u8868\u73b0\uff0c\u540c\u65f6\u5206\u6790\u4e86\u8d28\u91cf\u4e0e\u5ef6\u8fdf\u6743\u8861\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28175", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u667a\u80fd\u4f53", "\u6d41\u5f0f\u63a8\u7406", "\u6587\u672c\u89c4\u8303\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28175v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AgenticASR: Refining Speech Recognition in Real-World Scenarios via an Agentic Approach", "tldr": "\u8bba\u6587\u63d0\u51fa Agentic Speech Recognition\uff0c\u5c06\u6d41\u5f0f\u8bed\u97f3\u76f4\u63a5\u8f6c\u6362\u4e3a\u66f4\u6613\u8bfb\u7684\u201c\u5e72\u51c0\u6587\u672c\u201d\uff0c\u53ef\u53bb\u9664\u53e3\u5934\u7985\u3001\u91cd\u590d\u3001\u81ea\u6211\u4fee\u6b63\u5e76\u4fdd\u7559\u8bf4\u8bdd\u8005\u6700\u7ec8\u610f\u56fe\u3002\u5176 AgenticASR \u901a\u8fc7 ASR-Refiner \u67b6\u6784\u5728\u97f3\u9891\u5230\u6765\u65f6\u6301\u7eed\u4fee\u8ba2\u5df2\u8f93\u51fa\u6587\u672c\uff0c\u5e76\u5728\u65b0\u53cc\u8bed\u57fa\u51c6 AASR-Bench \u4e0a\u53d6\u5f97\u6700\u4f73\u8868\u73b0\uff0c\u540c\u65f6\u5206\u6790\u4e86\u8d28\u91cf\u4e0e\u5ef6\u8fdf\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Memory-augmented LLM-based agents are vulnerable to memory injection attacks: Agents may retrieve poisoned memory from attackers, which diverts their behavior from initial user intent and finally causes task failure. However, existing defense mechanisms either incur high computational cost or suffer from information redundancy in multi-turn contexts. To address these challenges, we propose Memory Intent-Aware Neural Denoising(MIND), a lightweight defense framework for memory injection attack. Our preliminary analysis reveals that benign and poisoned trajectories exhibit distinguishable relationships between the initial user intent and subsequent behavior. Building on this observation, MIND employs an intent-aware Information Bottleneck(IB) to extract compact intent--behavior representations from the initial intent and turn-level behavior. The IB preserves intent-relevant cross-turn attack signals while filtering task-irrelevant and repetitive information, and a lightweight detector identifies malicious memories from the resulting representations. As such, MIND mitigates information redundancy in multi-turn contexts while avoiding the overhead of repeated LLM auditing. Extensive experiments show that MIND reduces attack success rates while preserving task accuracy and inference efficiency. Notably, on ReAct-StrategyQA, MIND reduces mean ASR-r and ASR-a by 55.4% and 55.3%, respectively, while matching the undefended agent in average accuracy and latency.", "arxiv_id": "2607.28103", "arxiv_url": "https://arxiv.org/abs/2607.28103", "authors": ["Dongyi Liu", "Haixing He", "Xiaobao Wu", "Jia Li"], "brief": "\u8bba\u6587\u63d0\u51fa MIND\uff0c\u4e00\u79cd\u9762\u5411\u8bb0\u5fc6\u589e\u5f3a LLM \u667a\u80fd\u4f53\u7684\u8f7b\u91cf\u7ea7\u8bb0\u5fc6\u6ce8\u5165\u9632\u5fa1\u6846\u67b6\u3002\u5b83\u5229\u7528\u610f\u56fe\u611f\u77e5\u4fe1\u606f\u74f6\u9888\u63d0\u53d6\u7528\u6237\u521d\u59cb\u610f\u56fe\u4e0e\u591a\u8f6e\u884c\u4e3a\u4e4b\u95f4\u7684\u7d27\u51d1\u8868\u793a\uff0c\u8fc7\u6ee4\u5197\u4f59\u4fe1\u606f\u5e76\u68c0\u6d4b\u6076\u610f\u8bb0\u5fc6\uff1b\u5b9e\u9a8c\u663e\u793a\u5728\u4fdd\u6301\u51c6\u786e\u7387\u548c\u5ef6\u8fdf\u57fa\u672c\u4e0d\u53d8\u7684\u540c\u65f6\uff0c\u663e\u8457\u964d\u4f4e\u653b\u51fb\u6210\u529f\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28103", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u8bb0\u5fc6\u6ce8\u5165", "\u4fe1\u606f\u74f6\u9888"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28103v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MIND: Lightweight and Effective Memory Injection Defense for LLM Agents via Intent-Aware Information Bottleneck", "tldr": "\u8bba\u6587\u63d0\u51fa MIND\uff0c\u4e00\u79cd\u9762\u5411\u8bb0\u5fc6\u589e\u5f3a LLM \u667a\u80fd\u4f53\u7684\u8f7b\u91cf\u7ea7\u8bb0\u5fc6\u6ce8\u5165\u9632\u5fa1\u6846\u67b6\u3002\u5b83\u5229\u7528\u610f\u56fe\u611f\u77e5\u4fe1\u606f\u74f6\u9888\u63d0\u53d6\u7528\u6237\u521d\u59cb\u610f\u56fe\u4e0e\u591a\u8f6e\u884c\u4e3a\u4e4b\u95f4\u7684\u7d27\u51d1\u8868\u793a\uff0c\u8fc7\u6ee4\u5197\u4f59\u4fe1\u606f\u5e76\u68c0\u6d4b\u6076\u610f\u8bb0\u5fc6\uff1b\u5b9e\u9a8c\u663e\u793a\u5728\u4fdd\u6301\u51c6\u786e\u7387\u548c\u5ef6\u8fdf\u57fa\u672c\u4e0d\u53d8\u7684\u540c\u65f6\uff0c\u663e\u8457\u964d\u4f4e\u653b\u51fb\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) is effective for training large language model agents. However, terminal rewards provide only coarse trajectory-level supervision, leaving successful behaviors, recurring mistakes, and incidental choices entangled in the same outcome signal. Existing agentic self-distillation methods enrich sparse supervision with natural-language skills, but skills retrieved externally or extracted from a single trajectory by stronger models may mismatch current experience, exceed the policy\u0027s capability, or remain path-specific. We propose Group-Reflective Self-Distillation (GRSD), which derives capability-aligned and outcome-discriminative guidance from the policy\u0027s own verified rollouts. For each prompt, the policy reflects on each verified trajectory in an on-policy group, and a stop-gradient snapshot contrasts the resulting reflections from successful and failed rollouts to construct group-level privileged guidance. Conditioned on this guidance, a self-teacher refines turn-level credit assignment by modulating outcome-based advantages while preserving the verifier-determined learning direction. Experiments across multiple agentic environments and model scales demonstrate that GRSD consistently outperforms competitive baselines and generalizes more effectively to unseen tasks.", "arxiv_id": "2607.28076", "arxiv_url": "https://arxiv.org/abs/2607.28076", "authors": ["Binbin Zheng", "Zijun Xie", "Guanqun Zhao", "Enlei Gong", "Xing Ma", "Xiaoliang Fu", "Zeyu Chen"], "brief": "\u672c\u6587\u63d0\u51fa\u7ec4\u53cd\u601d\u81ea\u84b8\u998f\uff08GRSD\uff09\uff0c\u5229\u7528\u7b56\u7565\u81ea\u8eab\u7684\u5df2\u9a8c\u8bc1 rollout\uff0c\u5bf9\u6210\u529f\u4e0e\u5931\u8d25\u8f68\u8ff9\u7684\u53cd\u601d\u8fdb\u884c\u5bf9\u6bd4\uff0c\u751f\u6210\u4e0e\u5f53\u524d\u80fd\u529b\u5339\u914d\u7684\u7fa4\u4f53\u7ea7\u6307\u5bfc\u4fe1\u53f7\u3002\u8be5\u65b9\u6cd5\u5728\u4fdd\u6301\u9a8c\u8bc1\u5668\u5956\u52b1\u65b9\u5411\u7684\u540c\u65f6\u7ec6\u5316\u56de\u5408\u7ea7\u4fe1\u7528\u5206\u914d\uff0c\u5728\u591a\u4e2a\u667a\u80fd\u4f53\u73af\u5883\u548c\u6a21\u578b\u89c4\u6a21\u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u63d0\u5347\u672a\u89c1\u4efb\u52a1\u6cdb\u5316\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28076", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28076v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Group-Reflective Self-Distillation for Agentic Reinforcement Learning", "tldr": "\u672c\u6587\u63d0\u51fa\u7ec4\u53cd\u601d\u81ea\u84b8\u998f\uff08GRSD\uff09\uff0c\u5229\u7528\u7b56\u7565\u81ea\u8eab\u7684\u5df2\u9a8c\u8bc1 rollout\uff0c\u5bf9\u6210\u529f\u4e0e\u5931\u8d25\u8f68\u8ff9\u7684\u53cd\u601d\u8fdb\u884c\u5bf9\u6bd4\uff0c\u751f\u6210\u4e0e\u5f53\u524d\u80fd\u529b\u5339\u914d\u7684\u7fa4\u4f53\u7ea7\u6307\u5bfc\u4fe1\u53f7\u3002\u8be5\u65b9\u6cd5\u5728\u4fdd\u6301\u9a8c\u8bc1\u5668\u5956\u52b1\u65b9\u5411\u7684\u540c\u65f6\u7ec6\u5316\u56de\u5408\u7ea7\u4fe1\u7528\u5206\u914d\uff0c\u5728\u591a\u4e2a\u667a\u80fd\u4f53\u73af\u5883\u548c\u6a21\u578b\u89c4\u6a21\u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u63d0\u5347\u672a\u89c1\u4efb\u52a1\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-context retrieval and agentic workloads repeatedly reuse the same documents under changing instructions, histories, and document orders. Prefix caching cannot exploit this reuse, while position-independent caching (PIC) remains unreliable because independently compiled KV states lack the future context in which they will be consumed. Our diagnostics show that a learned boundary-conditioned baseline sharply reduces attention deviation near reusable-block boundaries but leaves interior and task-level residuals, motivating adaptation of the document representation itself. We present \\emph{SemPIC}, which trains a LoRA-enabled Writer to compile native per-layer document KVs through behavioral distillation while retaining the pretrained decoder as an unchanged Reader. Adaptation is confined to offline cache construction, preserving the standard KV interface and cache-hit decoding path. We further introduce KV Gradient Checkpointing, which reduces peak training memory without severing gradients through cached KVs. Across three models and four tasks, SemPIC raises mean micro-F1 over KV Packet from 0.53 to 0.60, approaching Full Recompute at 0.62.", "arxiv_id": "2607.28069", "arxiv_url": "https://arxiv.org/abs/2607.28069", "authors": ["Hui Xie", "Peng Xiao", "Yutong Deng\\textsuperscript", "Shuoran Dou", "Jian Yang", "Jinyang Guo"], "brief": "SemPIC \u5b66\u4e60\u8bed\u4e49\u5316\u3001\u4f4d\u7f6e\u65e0\u5173\u7684 KV \u7f13\u5b58\uff0c\u7528 LoRA Writer \u79bb\u7ebf\u7f16\u8bd1\u6587\u6863\u7ea7 KV\uff0c\u5e76\u4fdd\u6301\u539f\u59cb\u89e3\u7801\u5668\u4f5c\u4e3a Reader \u4e0d\u53d8\u3002\u5b83\u5728\u4e0d\u6539\u53d8\u6807\u51c6 KV \u63a5\u53e3\u548c\u7f13\u5b58\u547d\u4e2d\u89e3\u7801\u8def\u5f84\u7684\u60c5\u51b5\u4e0b\uff0c\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u590d\u7528\u6548\u679c\uff0c\u5e73\u5747 micro-F1 \u4ece KV Packet \u7684 0.53 \u63d0\u9ad8\u5230 0.60\uff0c\u63a5\u8fd1 Full Recompute \u7684 0.62\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28069", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "KV\u7f13\u5b58", "\u77e5\u8bc6\u84b8\u998f", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28069v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SemPIC: Learning Semantic Position-Independent KV Caches", "tldr": "SemPIC \u5b66\u4e60\u8bed\u4e49\u5316\u3001\u4f4d\u7f6e\u65e0\u5173\u7684 KV \u7f13\u5b58\uff0c\u7528 LoRA Writer \u79bb\u7ebf\u7f16\u8bd1\u6587\u6863\u7ea7 KV\uff0c\u5e76\u4fdd\u6301\u539f\u59cb\u89e3\u7801\u5668\u4f5c\u4e3a Reader \u4e0d\u53d8\u3002\u5b83\u5728\u4e0d\u6539\u53d8\u6807\u51c6 KV \u63a5\u53e3\u548c\u7f13\u5b58\u547d\u4e2d\u89e3\u7801\u8def\u5f84\u7684\u60c5\u51b5\u4e0b\uff0c\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u590d\u7528\u6548\u679c\uff0c\u5e73\u5747 micro-F1 \u4ece KV Packet \u7684 0.53 \u63d0\u9ad8\u5230 0.60\uff0c\u63a5\u8fd1 Full Recompute \u7684 0.62\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Skill-based prompting has become a practical mechanism for improving large language model (LLM) agents, yet existing skill acquisition methods often treat skills as experience summaries, memory entries, or direct summaries of successful demonstrations. This creates a mismatch for weaker student agents: when a student fails because it lacks task knowledge or operational strategy, its failed trajectory may not contain enough evidence to infer the missing behavior, while the teacher trajectory may be too implicit to be internalized as reusable guidance. We propose SKILL-KD, a contrastive skill distillation framework that treats skills as an explicit distillation medium between agents of different capabilities. Given a student failure and the teacher trajectory on the same task, SKILL-KD distills their actionable discrepancy into a textual skill patch, evaluates the patch by re-running the student, and iteratively refines the patch when the student still fails. To prevent repeated local updates from causing skill drift, SKILL-KD further maintains trace-linked edit histories and performs Drift-Aware Skill Consolidation, deciding whether each patch should add a new rule, delete or modify an existing rule, or be skipped. Across five agent benchmarks and two student settings, SKILL-KD consistently improves frozen student agents over fixed-model adaptation baselines.", "arxiv_id": "2607.28048", "arxiv_url": "https://arxiv.org/abs/2607.28048", "authors": ["Qiming Shi", "Yibo Dou", "Jiawen Zhu", "Yulong Tao", "Linbo Jin", "Zhaolu Kang", "Yunfan Zhou", "Di Weng"], "brief": "\u672c\u6587\u63d0\u51fa SKILL-KD\uff0c\u5c06\u5f3a\u6559\u5e08\u667a\u80fd\u4f53\u4e0e\u5f31\u5b66\u751f\u667a\u80fd\u4f53\u5728\u540c\u4e00\u4efb\u52a1\u4e0a\u7684\u8f68\u8ff9\u5dee\u5f02\u84b8\u998f\u6210\u53ef\u6267\u884c\u7684\u6587\u672c\u6280\u80fd\u8865\u4e01\uff0c\u5e76\u901a\u8fc7\u91cd\u8dd1\u5b66\u751f\u667a\u80fd\u4f53\u8fed\u4ee3\u9a8c\u8bc1\u548c\u6539\u8fdb\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u5e26\u8f68\u8ff9\u8ffd\u8e2a\u7684\u7f16\u8f91\u5386\u53f2\u4e0e\u6f02\u79fb\u611f\u77e5\u6280\u80fd\u5408\u5e76\uff0c\u907f\u514d\u6280\u80fd\u89c4\u5219\u7d2f\u79ef\u5bfc\u81f4\u504f\u79fb\uff1b\u5728\u4e94\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u548c\u4e24\u79cd\u5b66\u751f\u8bbe\u7f6e\u4e0a\uff0c\u7a33\u5b9a\u63d0\u5347\u51bb\u7ed3\u5b66\u751f\u667a\u80fd\u4f53\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28048", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u63d0\u793a\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28048v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SKILL-KD: Contrastive Skill Distillation for LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa SKILL-KD\uff0c\u5c06\u5f3a\u6559\u5e08\u667a\u80fd\u4f53\u4e0e\u5f31\u5b66\u751f\u667a\u80fd\u4f53\u5728\u540c\u4e00\u4efb\u52a1\u4e0a\u7684\u8f68\u8ff9\u5dee\u5f02\u84b8\u998f\u6210\u53ef\u6267\u884c\u7684\u6587\u672c\u6280\u80fd\u8865\u4e01\uff0c\u5e76\u901a\u8fc7\u91cd\u8dd1\u5b66\u751f\u667a\u80fd\u4f53\u8fed\u4ee3\u9a8c\u8bc1\u548c\u6539\u8fdb\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u5e26\u8f68\u8ff9\u8ffd\u8e2a\u7684\u7f16\u8f91\u5386\u53f2\u4e0e\u6f02\u79fb\u611f\u77e5\u6280\u80fd\u5408\u5e76\uff0c\u907f\u514d\u6280\u80fd\u89c4\u5219\u7d2f\u79ef\u5bfc\u81f4\u504f\u79fb\uff1b\u5728\u4e94\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u548c\u4e24\u79cd\u5b66\u751f\u8bbe\u7f6e\u4e0a\uff0c\u7a33\u5b9a\u63d0\u5347\u51bb\u7ed3\u5b66\u751f\u667a\u80fd\u4f53\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) and LLM-based agents are increasingly being deployed to automate complex workflows, promising to revolutionize data management and processing. However, existing benchmarks predominantly focus on simplified Text-to-SQL translation or data analysis, leaving the critical and complex domain of end-to-end data engineering largely unexplored. To bridge this gap, we introduce DataClawEval, the first comprehensive benchmark designed specifically to evaluate the end-to-end task completion capabilities of autonomous agents in real-world data engineering scenarios. Built upon production-grade code authored by professional enterprise data engineers, it comprises 100 rigorous, end-to-end tasks spanning five execution engines: PySpark, MySQL, HiveSQL, PrestoSQL/Trino, and FlinkSQL. Rather than non-deterministic LLM-as-a-judge scoring, each task is executed within a case-specific, isolated sandbox and graded by deterministic, rule-based scripts. Evaluating 16 frontier agents exposes critical limitations: The strongest model attains only 74.9 overall, and no single model dominates, as each excels on a different engine, revealing strict domain specialization rather than omnipotent proficiency. Thus, autonomous data engineering remains a formidable, unresolved challenge. We release our dataset, containerized environments, and deterministic evaluation scripts at https://github.com/Dicemy/DataClawEval/tree/master", "arxiv_id": "2607.28033", "arxiv_url": "https://arxiv.org/abs/2607.28033", "authors": ["Debin Meng", "Jiaming Yang", "Zefang Zong", "Tengyue Xu", "Haining Xie", "Yang Li", "Peng Chen"], "brief": "\u672c\u6587\u63d0\u51fa DataClawEval\uff0c\u9996\u4e2a\u9762\u5411\u771f\u5b9e\u5de5\u4e1a\u6570\u636e\u5de5\u7a0b\u573a\u666f\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6 PySpark\u3001MySQL\u3001HiveSQL\u3001PrestoSQL/Trino \u548c FlinkSQL \u7b49 5 \u7c7b\u6267\u884c\u5f15\u64ce\u3002\u8bc4\u6d4b 16 \u4e2a\u524d\u6cbf\u667a\u80fd\u4f53\u53d1\u73b0\uff0c\u6700\u5f3a\u6a21\u578b\u603b\u4f53\u4ec5\u8fbe 74.9 \u5206\uff0c\u4e14\u4e0d\u540c\u6a21\u578b\u5728\u4e0d\u540c\u5f15\u64ce\u4e0a\u5404\u6709\u4f18\u52bf\uff0c\u8bf4\u660e\u81ea\u4e3b\u6570\u636e\u5de5\u7a0b\u4ecd\u662f\u5c1a\u672a\u89e3\u51b3\u7684\u96be\u9898\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28033", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28033v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DataClawEval: A Benchmark for Data Engineering Agents in Real Industrial Harness", "tldr": "\u672c\u6587\u63d0\u51fa DataClawEval\uff0c\u9996\u4e2a\u9762\u5411\u771f\u5b9e\u5de5\u4e1a\u6570\u636e\u5de5\u7a0b\u573a\u666f\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6 PySpark\u3001MySQL\u3001HiveSQL\u3001PrestoSQL/Trino \u548c FlinkSQL \u7b49 5 \u7c7b\u6267\u884c\u5f15\u64ce\u3002\u8bc4\u6d4b 16 \u4e2a\u524d\u6cbf\u667a\u80fd\u4f53\u53d1\u73b0\uff0c\u6700\u5f3a\u6a21\u578b\u603b\u4f53\u4ec5\u8fbe 74.9 \u5206\uff0c\u4e14\u4e0d\u540c\u6a21\u578b\u5728\u4e0d\u540c\u5f15\u64ce\u4e0a\u5404\u6709\u4f18\u52bf\uff0c\u8bf4\u660e\u81ea\u4e3b\u6570\u636e\u5de5\u7a0b\u4ecd\u662f\u5c1a\u672a\u89e3\u51b3\u7684\u96be\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic systems have widened the gap between producing candidate outputs and reviewing them. This paper asks a practical architectural question: should domain specialization be built into an evaluator\u0027s weights, or into the rule that decides when its judgment can be trusted? We study 99,952 public, rubric-conditioned examples. Supplying the correct rubric improves locked-test accuracy by 2.11 points over a response-only control; replacing it with an unrelated rubric costs 2.66 points. Dividing the same training corpus among eight criterion-family LoRA judges, however, loses 10.05 points and cuts audited coverage at a 5% risk target from 24.44% to 5.43%. Matching the bank\u0027s stored capacity with one rank-64 adapter does not reproduce this loss. Nor is the result explained by learning rate or optimizer steps. Initializing the family adapters from a shared, trained judge recovers test accuracy to 76.85%, 19.94 points above scratch training at the same learning rate (95% interval 18.88-21.02). The result changes when specialization governs deferral rather than judgment. On RewardBench 2, learned correctness heads route examples through a 0.6B-4B-8B cascade without changing any reward score. Across 20 locked repartitions, the cascade attains 89.40% accuracy, compared with 84.75% for 8B alone, at 0.415 normalized parameter compute. Every run passes an exact one-sided 95% risk audit; margin-based rules remain near 84.8% accuracy while using at least 0.94 compute. These results suggest a qualified design rule: share the learning of judgment until there is enough data to justify a split, and place domain-specific adaptation in an audited release boundary.", "arxiv_id": "2607.27984", "arxiv_url": "https://arxiv.org/abs/2607.27984", "authors": ["Weining Zhang"], "brief": "\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u8bc4\u6d4b\u5668\u4e2d\u201c\u4e13\u4e1a\u5316\u201d\u5e94\u653e\u5728\u8bc4\u5224\u6a21\u578b\u6743\u91cd\u91cc\uff0c\u8fd8\u662f\u653e\u5728\u51b3\u5b9a\u4f55\u65f6\u4fe1\u4efb/\u8f6c\u4ea4\u7684\u89c4\u5219\u91cc\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u628a\u6570\u636e\u62c6\u7ed9\u591a\u4e2a\u9886\u57df LoRA \u8bc4\u5224\u5668\u4f1a\u663e\u8457\u964d\u51c6\u786e\u7387\u548c\u8986\u76d6\u7387\uff0c\u800c\u5171\u4eab\u8bc4\u5224\u6a21\u578b\u3001\u7528\u5b66\u4e60\u5230\u7684\u6b63\u786e\u6027\u5934\u505a\u5206\u6d41/\u5ef6\u8fdf\u51b3\u7b56\uff0c\u53ef\u5728\u66f4\u4f4e\u8ba1\u7b97\u4e0b\u8d85\u8fc7\u5355\u72ec 8B \u8bc4\u6d4b\u5668\u5e76\u901a\u8fc7\u98ce\u9669\u5ba1\u8ba1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27984", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u8bc4\u6d4b", "\u6a21\u578b\u8def\u7531", "\u9886\u57df\u9002\u914d", "\u98ce\u9669\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27984v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Share the Judge, Learn the Deferral: Where Specialization Helps LLM Evaluation", "tldr": "\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u8bc4\u6d4b\u5668\u4e2d\u201c\u4e13\u4e1a\u5316\u201d\u5e94\u653e\u5728\u8bc4\u5224\u6a21\u578b\u6743\u91cd\u91cc\uff0c\u8fd8\u662f\u653e\u5728\u51b3\u5b9a\u4f55\u65f6\u4fe1\u4efb/\u8f6c\u4ea4\u7684\u89c4\u5219\u91cc\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u628a\u6570\u636e\u62c6\u7ed9\u591a\u4e2a\u9886\u57df LoRA \u8bc4\u5224\u5668\u4f1a\u663e\u8457\u964d\u51c6\u786e\u7387\u548c\u8986\u76d6\u7387\uff0c\u800c\u5171\u4eab\u8bc4\u5224\u6a21\u578b\u3001\u7528\u5b66\u4e60\u5230\u7684\u6b63\u786e\u6027\u5934\u505a\u5206\u6d41/\u5ef6\u8fdf\u51b3\u7b56\uff0c\u53ef\u5728\u66f4\u4f4e\u8ba1\u7b97\u4e0b\u8d85\u8fc7\u5355\u72ec 8B \u8bc4\u6d4b\u5668\u5e76\u901a\u8fc7\u98ce\u9669\u5ba1\u8ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recently, Reinforcement Learning (RL) has emerged as a crucial paradigm for the post-training of Large Language Model (LLM) agents. However, existing methods predominantly rely on sparse task rewards for policy optimization, failing to fully exploit another class of inherently dense supervisory signals naturally present during online interaction: environmental feedback following action execution. Recent theoretical studies suggest that generalization in multi-step, goal-oriented tasks hinges on predictive knowledge of environmental consequences. Inspired by this, we propose TAPO: Transition-Aware Policy Optimization for LLM Agents, a unified training framework that alternates between policy optimization and transition supervision. Beyond standard RL updates, TAPO repurposes rollout data to apply action-conditioned next-observation prediction supervision on a shared backbone model. This approach enhances the model\u0027s sensitivity to environmental transition dynamics and action consequences while concurrently optimizing the policy. It serves as a computationally lightweight, plug-and-play enhancement module for existing agent RL algorithms, requiring no additional expert data, extra sampling costs, or inference-time overhead. We conduct systematic experiments on WebShop and ALFWorld, integrating foundation models of various scales with different policy optimization algorithms. Empirical results demonstrate that TAPO consistently improves task performance over pure policy optimization baselines.", "arxiv_id": "2607.27973", "arxiv_url": "https://arxiv.org/abs/2607.27973", "authors": ["Cong Li", "Peixi Peng", "Yisen Zhao", "Xinyu Hu", "Shudong Liu", "Zhan Su", "Zhuojian Li"], "brief": "TAPO \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u8f6c\u79fb\u611f\u77e5\u7b56\u7565\u4f18\u5316\u6846\u67b6\uff0c\u5728\u5e38\u89c4\u5f3a\u5316\u5b66\u4e60\u66f4\u65b0\u4e4b\u5916\uff0c\u5229\u7528\u4ea4\u4e92\u8f68\u8ff9\u505a\u52a8\u4f5c\u6761\u4ef6\u7684\u4e0b\u4e00\u89c2\u6d4b\u9884\u6d4b\u76d1\u7763\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916\u4e13\u5bb6\u6570\u636e\u3001\u91c7\u6837\u6210\u672c\u6216\u63a8\u7406\u5f00\u9500\uff0c\u5728 WebShop \u548c ALFWorld \u4e0a\u76f8\u5bf9\u7eaf\u7b56\u7565\u4f18\u5316\u57fa\u7ebf\u7a33\u5b9a\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27973", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u73af\u5883\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27973v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TAPO: Transition-Aware Policy Optimization for LLM Agents", "tldr": "TAPO \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u8f6c\u79fb\u611f\u77e5\u7b56\u7565\u4f18\u5316\u6846\u67b6\uff0c\u5728\u5e38\u89c4\u5f3a\u5316\u5b66\u4e60\u66f4\u65b0\u4e4b\u5916\uff0c\u5229\u7528\u4ea4\u4e92\u8f68\u8ff9\u505a\u52a8\u4f5c\u6761\u4ef6\u7684\u4e0b\u4e00\u89c2\u6d4b\u9884\u6d4b\u76d1\u7763\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916\u4e13\u5bb6\u6570\u636e\u3001\u91c7\u6837\u6210\u672c\u6216\u63a8\u7406\u5f00\u9500\uff0c\u5728 WebShop \u548c ALFWorld \u4e0a\u76f8\u5bf9\u7eaf\u7b56\u7565\u4f18\u5316\u57fa\u7ebf\u7a33\u5b9a\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Memory is central to long-horizon LLM agents, yet existing memory systems primarily preserve interaction content rather than modeling which agents can be trusted and under what conditions. This limitation is particularly important in multi-agent systems, where a central model may be unable to directly verify plausible or correlated peer responses. We introduce $\u03a3$-Mem, an online reliability memory that records historical competence evidence for individual peers and peer relationship evidence across the peer set. Both forms of evidence are maintained as real symmetric states and updated from post-decision correctness feedback. By Weyl\u0027s inequality, the spectral change caused by each event-level update is bounded, enabling stable online adaptation without retraining the underlying models. $\u03a3$-Mem provides a general write-and-read interface: the same memory can be used for residual steering of a central model, response-free peer routing, or reliability-weighted voting. Across five Qwen-family models, $\u03a3$-Mem adapts to counterfactual reliability shifts and generalizes to unseen peers and task domains. Direct memory readouts also outperform majority voting and the best fixed peer over the full OOD evaluation set. Moreover, performance improves consistently as more correctness feedback becomes available, indicating that $\u03a3$-Mem progressively accumulates actionable reliability information. These results establish reliability memory as a reusable foundation for adaptive coordination in LLM-based multi-agent systems.", "arxiv_id": "2607.27958", "arxiv_url": "https://arxiv.org/abs/2607.27958", "authors": ["Peilin Feng", "Suorong Yang", "Soujanya Poria"], "brief": "\u8bba\u6587\u63d0\u51fa \u03a3-Mem\uff0c\u4e00\u79cd\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u5728\u7ebf\u53ef\u9760\u6027\u8bb0\u5fc6\uff0c\u7528\u5386\u53f2\u6b63\u786e\u6027\u53cd\u9988\u8bb0\u5f55\u5355\u4e2a\u540c\u4f34\u80fd\u529b\u4e0e\u540c\u4f34\u95f4\u5173\u7cfb\uff0c\u800c\u4e0d\u53ea\u662f\u4fdd\u5b58\u4ea4\u4e92\u5185\u5bb9\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u91cd\u8bad\u7ec3\u5373\u53ef\u7a33\u5b9a\u66f4\u65b0\uff0c\u53ef\u7528\u4e8e\u6a21\u578b\u5f15\u5bfc\u3001\u540c\u4f34\u8def\u7531\u548c\u52a0\u6743\u6295\u7968\uff0c\u5728\u591a\u79cd Qwen \u6a21\u578b\u4e0a\u4f18\u4e8e\u591a\u6570\u6295\u7968\u548c\u56fa\u5b9a\u6700\u4f73\u540c\u4f34\uff0c\u5e76\u80fd\u9002\u5e94\u53ef\u9760\u6027\u53d8\u5316\u4e0e\u672a\u89c1\u4efb\u52a1/\u540c\u4f34\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27958", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27958v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "$\u03a3$-Mem: An Online Reliability Memory for LLM-based Multi-Agent Systems", "tldr": "\u8bba\u6587\u63d0\u51fa \u03a3-Mem\uff0c\u4e00\u79cd\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u5728\u7ebf\u53ef\u9760\u6027\u8bb0\u5fc6\uff0c\u7528\u5386\u53f2\u6b63\u786e\u6027\u53cd\u9988\u8bb0\u5f55\u5355\u4e2a\u540c\u4f34\u80fd\u529b\u4e0e\u540c\u4f34\u95f4\u5173\u7cfb\uff0c\u800c\u4e0d\u53ea\u662f\u4fdd\u5b58\u4ea4\u4e92\u5185\u5bb9\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u91cd\u8bad\u7ec3\u5373\u53ef\u7a33\u5b9a\u66f4\u65b0\uff0c\u53ef\u7528\u4e8e\u6a21\u578b\u5f15\u5bfc\u3001\u540c\u4f34\u8def\u7531\u548c\u52a0\u6743\u6295\u7968\uff0c\u5728\u591a\u79cd Qwen \u6a21\u578b\u4e0a\u4f18\u4e8e\u591a\u6570\u6295\u7968\u548c\u56fa\u5b9a\u6700\u4f73\u540c\u4f34\uff0c\u5e76\u80fd\u9002\u5e94\u53ef\u9760\u6027\u53d8\u5316\u4e0e\u672a\u89c1\u4efb\u52a1/\u540c\u4f34\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent work on LLM agents is shifting from external capability elicitation to capability internalization, enabling agents to retain useful skills without retrieval at inference time. On-policy self-distillation (OPSD) offers a promising direction, but many existing methods typically supervise students by scoring actions along student-generated trajectories. Such supervision has two limitations: teacher preferences are not validated by environment outcomes, and action-level scores underuse information from student rollouts, teacher rollouts, and their behavioral relationship. We therefore advocate outcome-verified teacher supervision and comparative learning over teacher-student trajectories. Based on this view, we propose Outcome-Verified Comparative Self-Distillation (OVCSD). OVCSD organizes failed student rollouts into a prefix tree, adaptively invokes a skill-conditioned teacher from student-reached states, and retains only outcome-verified successful continuations. It then applies localized comparative learning at the first state-aligned divergence and distills the post-divergence teacher suffix to transfer completion behavior. Experiments on ALFWorld and WebShop across three model scales show that OVCSD consistently outperforms skill-free RL and existing self-distillation baselines, achieving up to 29.7 and 5.4 absolute success-rate gains over the strongest baselines on ALFWorld and WebShop, respectively, while adding less than 3% privileged interaction during training.", "arxiv_id": "2607.27937", "arxiv_url": "https://arxiv.org/abs/2607.27937", "authors": ["Xu Xia", "Jinghua Piao", "Min Yang", "Xiaochong Lan", "Jiaju Chen", "Yong Li"], "brief": "\u672c\u6587\u63d0\u51fa OVCSD\uff0c\u7528\u4e8e\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u628a\u5916\u90e8\u6559\u5e08\u80fd\u529b\u5185\u5316\u5230\u81ea\u8eab\u7b56\u7565\u4e2d\u3002\u65b9\u6cd5\u901a\u8fc7\u73af\u5883\u7ed3\u679c\u9a8c\u8bc1\u6559\u5e08\u7eed\u5199\u8f68\u8ff9\uff0c\u5e76\u5728\u5b66\u751f\u4e0e\u6559\u5e08\u8f68\u8ff9\u9996\u6b21\u5206\u6b67\u5904\u8fdb\u884c\u5bf9\u6bd4\u84b8\u998f\uff0c\u4ece\u800c\u66f4\u6709\u6548\u5b66\u4e60\u6210\u529f\u5b8c\u6210\u4efb\u52a1\u7684\u884c\u4e3a\u3002\u5728 ALFWorld \u548c WebShop \u4e0a\u76f8\u8f83\u73b0\u6709\u5f3a\u5316\u5b66\u4e60\u4e0e\u81ea\u84b8\u998f\u57fa\u7ebf\u7a33\u5b9a\u63d0\u5347\uff0c\u6700\u9ad8\u5e26\u6765 29.7 \u548c 5.4 \u4e2a\u767e\u5206\u70b9\u6210\u529f\u7387\u589e\u76ca\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27937", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27937v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From Scoring to Acting: Outcome-Verified Comparative Self-Distillation for LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa OVCSD\uff0c\u7528\u4e8e\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u628a\u5916\u90e8\u6559\u5e08\u80fd\u529b\u5185\u5316\u5230\u81ea\u8eab\u7b56\u7565\u4e2d\u3002\u65b9\u6cd5\u901a\u8fc7\u73af\u5883\u7ed3\u679c\u9a8c\u8bc1\u6559\u5e08\u7eed\u5199\u8f68\u8ff9\uff0c\u5e76\u5728\u5b66\u751f\u4e0e\u6559\u5e08\u8f68\u8ff9\u9996\u6b21\u5206\u6b67\u5904\u8fdb\u884c\u5bf9\u6bd4\u84b8\u998f\uff0c\u4ece\u800c\u66f4\u6709\u6548\u5b66\u4e60\u6210\u529f\u5b8c\u6210\u4efb\u52a1\u7684\u884c\u4e3a\u3002\u5728 ALFWorld \u548c WebShop \u4e0a\u76f8\u8f83\u73b0\u6709\u5f3a\u5316\u5b66\u4e60\u4e0e\u81ea\u84b8\u998f\u57fa\u7ebf\u7a33\u5b9a\u63d0\u5347\uff0c\u6700\u9ad8\u5e26\u6765 29.7 \u548c 5.4 \u4e2a\u767e\u5206\u70b9\u6210\u529f\u7387\u589e\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents optimize the power, performance, and area (PPA) of register-transfer-level (RTL) designs by iterating over edits, synthesis, and PPA analysis, paying a dollar cost for every LLM call. Prior agents report the quality reached without its normalized cost, attribute that quality to an engineered cross-design memory, and hold the reasoning effort of every call fixed. We propose Ares with three corresponding innovations. (1) We introduce a normalized dollar cost per LLM call reported alongside the figure of merit (FoM), enabling fair comparison across effort levels and optimizers. (2) Using this accounting, we find the construction of the long-term memory matters little. An engineered memory brings no dependable gain over a plain concatenation of the same experience. (3) We instead adapt the per-call reasoning effort by escalating to deeper reasoning only once progress at a lower effort stalls, via a patience counter fit on 21 training designs, allocating reasoning where it pays rather than uniformly across all iterations. On three test designs unseen during training, the effort policy lowers the FoM by 23-27% where the best fixed effort reaches 16-23%, at equal normalized cost. Ares closes up to 83% of the gap from an LLM-drafted multiply-accumulate unit to its highly hand-optimized counterpart, and reaches a 25% deeper FoM than state-of-the-art Dr. RTL at 12% of its tokens.", "arxiv_id": "2607.27879", "arxiv_url": "https://arxiv.org/abs/2607.27879", "authors": ["Stef Cuyckens", "Mihaela Jivanescu", "Jun Yin", "Chao Fang", "Marian Verhelst"], "brief": "ARES \u9762\u5411 RTL \u8bbe\u8ba1\u7684\u529f\u8017\u3001\u6027\u80fd\u3001\u9762\u79ef\u4f18\u5316\uff0c\u5f15\u5165\u6309 LLM \u8c03\u7528\u5f52\u4e00\u5316\u7684\u6210\u672c\u5ea6\u91cf\uff0c\u5e76\u53d1\u73b0\u590d\u6742\u8de8\u8bbe\u8ba1\u957f\u671f\u8bb0\u5fc6\u76f8\u6bd4\u7b80\u5355\u7ecf\u9a8c\u62fc\u63a5\u6536\u76ca\u6709\u9650\u3002\u5176\u6838\u5fc3\u662f\u6839\u636e\u4f18\u5316\u505c\u6ede\u60c5\u51b5\u81ea\u9002\u5e94\u63d0\u5347\u5355\u6b21\u8c03\u7528\u7684\u63a8\u7406\u5f3a\u5ea6\uff0c\u5728\u76f8\u540c\u6210\u672c\u4e0b\u6bd4\u56fa\u5b9a\u63a8\u7406\u5f3a\u5ea6\u83b7\u5f97\u66f4\u4f4e FoM\uff0c\u5e76\u4ee5\u66f4\u5c11 token \u8d85\u8fc7\u73b0\u6709 Dr. RTL\u3002", "categories": ["cs.AR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27879", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u82af\u7247\u8bbe\u8ba1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6210\u672c\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27879v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ARES: Adaptive Reasoning-Effort Steering for PPA- and Cost-Aware RTL Optimization with LLM Agents", "tldr": "ARES \u9762\u5411 RTL \u8bbe\u8ba1\u7684\u529f\u8017\u3001\u6027\u80fd\u3001\u9762\u79ef\u4f18\u5316\uff0c\u5f15\u5165\u6309 LLM \u8c03\u7528\u5f52\u4e00\u5316\u7684\u6210\u672c\u5ea6\u91cf\uff0c\u5e76\u53d1\u73b0\u590d\u6742\u8de8\u8bbe\u8ba1\u957f\u671f\u8bb0\u5fc6\u76f8\u6bd4\u7b80\u5355\u7ecf\u9a8c\u62fc\u63a5\u6536\u76ca\u6709\u9650\u3002\u5176\u6838\u5fc3\u662f\u6839\u636e\u4f18\u5316\u505c\u6ede\u60c5\u51b5\u81ea\u9002\u5e94\u63d0\u5347\u5355\u6b21\u8c03\u7528\u7684\u63a8\u7406\u5f3a\u5ea6\uff0c\u5728\u76f8\u540c\u6210\u672c\u4e0b\u6bd4\u56fa\u5b9a\u63a8\u7406\u5f3a\u5ea6\u83b7\u5f97\u66f4\u4f4e FoM\uff0c\u5e76\u4ee5\u66f4\u5c11 token \u8d85\u8fc7\u73b0\u6709 Dr. RTL\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As LLM-based agents are deployed in complex, multi-step workflows, a critical evaluation gap has emerged: most existing benchmarks judge only final outcomes, unable to distinguish reliable reasoning from lucky success or attribute failures to specific process deficiencies, hindering attribution in long-horizon tasks. In this work, we present ClawTrack, a dual-assessment benchmark that simultaneously measures what an agent achieves (Task Score) and how it achieves it (Process Score). ClawTrack comprises 320 tasks across 8 domains with 25+ deterministic mock services. A Process Grader scores each reasoning turn along four dimensions (goal alignment, efficiency, information utilization, and result verification), anchored by 12,541 task-specific rubric items. Evaluating 21 models over 16,000+ trials, we find that: (1) process scores effectively attribute success and failure to specific reasoning dimensions, filtering lucky passes invisible to outcome-only evaluation; (2) the four dimensions are complementary, with result verification as the systematic bottleneck; (3) the framework is robust to evaluator choice across different judge LLMs; and (4) process-based trajectory filtering yields consistent post-training improvements across model scales.", "arxiv_id": "2607.28037", "arxiv_url": "https://arxiv.org/abs/2607.28037", "authors": ["Xingjian Wu", "Xuhang Zhu", "Xingchen Liu", "Junlin Liu", "Jianing Wang", "Linsen Guo", "Xiaoyu Li", "Xuezhi Cao", "Xunliang Cai"], "brief": "ClawTrack\u63d0\u51fa\u4e86\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u591a\u6b65\u81ea\u4e3b\u667a\u80fd\u4f53\u7684\u8f68\u8ff9\u7ea7\u8bc4\u6d4b\u57fa\u51c6\uff0c\u540c\u65f6\u8bc4\u4f30\u6700\u7ec8\u4efb\u52a1\u8868\u73b0\u548c\u4e2d\u95f4\u63a8\u7406\u8fc7\u7a0b\u3002\u5b83\u8986\u76d68\u4e2a\u9886\u57df\u3001320\u4e2a\u4efb\u52a1\u548c\u5927\u91cf\u89c4\u5219\u9879\uff0c\u80fd\u5b9a\u4f4d\u5931\u8d25\u539f\u56e0\u3001\u8bc6\u522b\u201c\u4fa5\u5e78\u6210\u529f\u201d\uff0c\u5e76\u901a\u8fc7\u8fc7\u7a0b\u8f68\u8ff9\u7b5b\u9009\u5e26\u6765\u7a33\u5b9a\u7684\u540e\u8bad\u7ec3\u63d0\u5347\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28037", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6", "\u8fc7\u7a0b\u76d1\u7763"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28037v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ClawTrack: Towards Trace-Level Evaluation and Improvement of Real-World Autonomous Agents", "tldr": "ClawTrack\u63d0\u51fa\u4e86\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u591a\u6b65\u81ea\u4e3b\u667a\u80fd\u4f53\u7684\u8f68\u8ff9\u7ea7\u8bc4\u6d4b\u57fa\u51c6\uff0c\u540c\u65f6\u8bc4\u4f30\u6700\u7ec8\u4efb\u52a1\u8868\u73b0\u548c\u4e2d\u95f4\u63a8\u7406\u8fc7\u7a0b\u3002\u5b83\u8986\u76d68\u4e2a\u9886\u57df\u3001320\u4e2a\u4efb\u52a1\u548c\u5927\u91cf\u89c4\u5219\u9879\uff0c\u80fd\u5b9a\u4f4d\u5931\u8d25\u539f\u56e0\u3001\u8bc6\u522b\u201c\u4fa5\u5e78\u6210\u529f\u201d\uff0c\u5e76\u901a\u8fc7\u8fc7\u7a0b\u8f68\u8ff9\u7b5b\u9009\u5e26\u6765\u7a33\u5b9a\u7684\u540e\u8bad\u7ec3\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in post-training Large Language Models (LLMs) increasingly rely on Reinforcement Learning with Verifiable Rewards (RLVR) or On-Policy Self-Distillation (OPSD). While OPSD provides dense, logit-level supervision, it inherently suffers from exposure bias due to the privileged information of the self-teacher. In multi-turn agentic settings, this leads to reasoning route convergence and the loss of clear optimization directions. To tackle these challenges, we introduce Contrastive Reinforced Policy Optimization (CRPO), which reformulates agentic OPSD from a contrastive learning perspective. By leveraging predictive entropy to distinguish between positive positions (reflective exploration) and negative positions (exposure bias), CRPO conducts group-wise contrast to preserve reliable, fine-grained optimization signals. Extensive evaluations across 13 challenging reasoning and deep-search benchmarks demonstrate that CRPO consistently outperforms existing reinforcement learning and self-distillation baselines, significantly enhancing training stability and generalization in long-horizon interactions.", "arxiv_id": "2607.28026", "arxiv_url": "https://arxiv.org/abs/2607.28026", "authors": ["Xingjian Wu", "Junlin Liu", "Xingchen Liu", "Xuhang Zhu", "Jianing Wang", "Linsen Guo", "Xiaoyu Li", "Xuezhi Cao", "Xunliang Cai"], "brief": "\u672c\u6587\u63d0\u51fa\u5bf9\u6bd4\u5f3a\u5316\u7b56\u7565\u4f18\u5316\uff08CRPO\uff09\uff0c\u5c06\u591a\u8f6e\u667a\u80fd\u4f53\u573a\u666f\u4e2d\u7684\u5728\u7ebf\u81ea\u84b8\u998f\u4ece\u5bf9\u6bd4\u5b66\u4e60\u89d2\u5ea6\u91cd\u6784\uff0c\u7528\u9884\u6d4b\u71b5\u533a\u5206\u6709\u76ca\u7684\u53cd\u601d\u63a2\u7d22\u4f4d\u7f6e\u4e0e\u53d7\u66dd\u5149\u504f\u5dee\u5f71\u54cd\u7684\u4f4d\u7f6e\u3002\u8be5\u65b9\u6cd5\u572813\u4e2a\u63a8\u7406\u4e0e\u6df1\u5ea6\u641c\u7d22\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u5f3a\u5316\u5b66\u4e60\u548c\u81ea\u84b8\u998f\u65b9\u6cd5\uff0c\u63d0\u5347\u4e86\u957f\u7a0b\u4ea4\u4e92\u8bad\u7ec3\u7684\u7a33\u5b9a\u6027\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28026", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "\u5bf9\u6bd4\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28026v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Contrastive Reinforced Policy Optimization via Privileged Self-Distillation", "tldr": "\u672c\u6587\u63d0\u51fa\u5bf9\u6bd4\u5f3a\u5316\u7b56\u7565\u4f18\u5316\uff08CRPO\uff09\uff0c\u5c06\u591a\u8f6e\u667a\u80fd\u4f53\u573a\u666f\u4e2d\u7684\u5728\u7ebf\u81ea\u84b8\u998f\u4ece\u5bf9\u6bd4\u5b66\u4e60\u89d2\u5ea6\u91cd\u6784\uff0c\u7528\u9884\u6d4b\u71b5\u533a\u5206\u6709\u76ca\u7684\u53cd\u601d\u63a2\u7d22\u4f4d\u7f6e\u4e0e\u53d7\u66dd\u5149\u504f\u5dee\u5f71\u54cd\u7684\u4f4d\u7f6e\u3002\u8be5\u65b9\u6cd5\u572813\u4e2a\u63a8\u7406\u4e0e\u6df1\u5ea6\u641c\u7d22\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u5f3a\u5316\u5b66\u4e60\u548c\u81ea\u84b8\u998f\u65b9\u6cd5\uff0c\u63d0\u5347\u4e86\u957f\u7a0b\u4ea4\u4e92\u8bad\u7ec3\u7684\u7a33\u5b9a\u6027\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An open-weight LLM can write composition setpoints every five minutes. What a plant still needs is a hard check: named constraints, logged margins, and an admit/block decision before the regulatory layer moves. This paper puts that check in a rule-based forked-twin counterfactual gate (nine pinned constraints) and leaves the regulatory layer unchanged. On Skogestad\u0027s Column A the ladder is PID-only (C0), linear MPC (C1), ungated agent (C2), and gated agent (C3) under one contract: identical level closure (M_D, M_B), scenarios, and seeds; C2/C3 share the linear-MPC backend. The split is not subtle. Off-nominal target acquisition: the agent beats Pareto-tuned linear MPC in the strong band (C2/C1 IAE ratio 0.361 at the upper CI). Disturbance rejection on the same 16-point grid inverts by 16.03 at the upper CI (10.18 at the point estimate), where an ungated LLM supervisor does not belong. The gate compresses a specification-abandonment attractor into a bounded offset (d approx. -1.4; P95 cell IAE 11.5 to 0.77). A one-line prompt fix removes the attractor at source (6/10 to 0/10; sensitivity only, not a new headline). In a 250-cell statistical pass, 534 of 590 gate interventions are spec-on-bound geometry: the operating specification sits on a safety limit, so a well-behaved OP becomes inoperable while misbehaving ones are only contained; 318 blocks still correct actively harmful proposals. Headlines are single-column and model-conditional on DeepSeek-V4-Flash. A second-family sweep (NVIDIA Nemotron-3-Super) keeps the disturbance-rejection fails band and plant-side failure geography; magnitudes and protocol operability stay model-conditional, and Super target-acquisition strong cells are survivors only (not confirmation). Transfer means twin, constraint envelope, and setpoint interface, not a second plant class measured here.", "arxiv_id": "2607.27849", "arxiv_url": "https://arxiv.org/abs/2607.27849", "authors": ["Christian Rosenthal"], "brief": "\u672c\u6587\u5728\u8026\u5408\u7cbe\u998f\u5854\u57fa\u51c6\u4e0a\u8bc4\u4f30LLM\u4e0a\u5c42\u76d1\u7763\u63a7\u5236\uff0c\u5e76\u52a0\u5165\u57fa\u4e8e\u89c4\u5219\u7684\u201c\u5206\u53c9\u5b6a\u751f\u201d\u5b89\u5168\u95e8\uff0c\u5728\u8bbe\u5b9a\u503c\u4e0b\u53d1\u524d\u68c0\u67e59\u7c7b\u7ea6\u675f\u5e76\u8bb0\u5f55\u901a\u8fc7/\u963b\u65ad\u51b3\u7b56\u3002\u7ed3\u679c\u663e\u793a\uff0c\u672a\u52a0\u95e8\u63a7\u7684\u667a\u80fd\u4f53\u5728\u76ee\u6807\u8ddf\u8e2a\u4e0a\u53ef\u4f18\u4e8e\u7ebf\u6027MPC\uff0c\u4f46\u5728\u6270\u52a8\u6291\u5236\u4e2d\u4f1a\u4e25\u91cd\u5931\u6548\uff1b\u5b89\u5168\u95e8\u80fd\u5c06\u5371\u9669\u63d0\u6848\u548c\u89c4\u683c\u653e\u5f03\u884c\u4e3a\u538b\u7f29\u4e3a\u6709\u754c\u504f\u5dee\uff0c\u4f46\u53ef\u64cd\u4f5c\u6027\u4ecd\u5f3a\u4f9d\u8d56\u6a21\u578b\u4e0e\u7ea6\u675f\u8bbe\u8ba1\u3002", "categories": ["eess.SY", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27849", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u63a7\u5236", "\u8fc7\u7a0b\u63a7\u5236", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27849v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Safety-Gated Agentic Supervisory Control on a Coupled Distillation Benchmark: Regime Map, Auditable Gate, and Co-Design Findings", "tldr": "\u672c\u6587\u5728\u8026\u5408\u7cbe\u998f\u5854\u57fa\u51c6\u4e0a\u8bc4\u4f30LLM\u4e0a\u5c42\u76d1\u7763\u63a7\u5236\uff0c\u5e76\u52a0\u5165\u57fa\u4e8e\u89c4\u5219\u7684\u201c\u5206\u53c9\u5b6a\u751f\u201d\u5b89\u5168\u95e8\uff0c\u5728\u8bbe\u5b9a\u503c\u4e0b\u53d1\u524d\u68c0\u67e59\u7c7b\u7ea6\u675f\u5e76\u8bb0\u5f55\u901a\u8fc7/\u963b\u65ad\u51b3\u7b56\u3002\u7ed3\u679c\u663e\u793a\uff0c\u672a\u52a0\u95e8\u63a7\u7684\u667a\u80fd\u4f53\u5728\u76ee\u6807\u8ddf\u8e2a\u4e0a\u53ef\u4f18\u4e8e\u7ebf\u6027MPC\uff0c\u4f46\u5728\u6270\u52a8\u6291\u5236\u4e2d\u4f1a\u4e25\u91cd\u5931\u6548\uff1b\u5b89\u5168\u95e8\u80fd\u5c06\u5371\u9669\u63d0\u6848\u548c\u89c4\u683c\u653e\u5f03\u884c\u4e3a\u538b\u7f29\u4e3a\u6709\u754c\u504f\u5dee\uff0c\u4f46\u53ef\u64cd\u4f5c\u6027\u4ecd\u5f3a\u4f9d\u8d56\u6a21\u578b\u4e0e\u7ea6\u675f\u8bbe\u8ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep research over data lakes requires an LLM agent to investigate evidence across thousands of heterogeneous tables and passages to synthesize a report. Existing methods perform iterative retrieval and generation, letting accumulated context determine what to investigate next, which can overexploit locally promising evidence and fail to cover distinct semantic regions under a fixed budget. To address this, we cast deep research over data lakes as a budgeted search problem and present Baikal - a framework that clusters heterogeneous evidence into semantic regions, then searches over them adaptively to balance exploration and exploitation. Within each selected region, Baikal generates and investigates region-grounded subquestions, using finding quality as rewards to update region-level value estimates and guide search under policies ranging from random and LLM-guided selection to Bayesian $\u03b5$-greedy and UCB. We evaluate Baikal on 15 queries each over HybridQA and TAT-QA data lakes containing 10,993 and 2,757 tables, respectively, together with 227K Wikipedia passages and 13K financial report passages. We assess research quality with a new rubric covering groundedness, relevance, diversity, and utility, and use GPT-5-mini to score Baikal and strong baselines, including DeepSearcher and an OpenCode research agent with retrieval and clustering variants. Across both data lakes, Baikal performs strongly under several region-selection policies; its best configuration improves report scores over the strongest baselines by 28% on HybridQA and 36% on TAT-QA.
