b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Low-Rank Adaptation (LoRA) has become the standard mechanism for fine-tuning large pretrained models, yet its statistical properties remain only partially understood. Existing generalization results provide upper bounds of the form O~(sqrt(rd/n)) or O~(rd/n), but a matching lower bound is missing, and the question of how to choose the LoRA rank r has no formal answer. Both gaps are closed here. A local Rademacher argument establishes an upper bound of O~(rd/n) on the excess risk of the empirical risk minimizer over rank-r LoRA, whenever the target adaptation has rank at most r. A matching minimax lower bound of Omega(rd/n) is then proved via a Fano-type packing of the rank-r subspace of R^{d x d}; the bound applies to any estimator whose output lies in the rank-r LoRA class. Combining the two yields a rank-selection dichotomy. For the constrained empirical risk minimizer, the optimal rank equals the intrinsic rank r*, and over-ranking strictly hurts. For adaptive estimators of the nuclear-norm-then-truncate type, over-ranking is harmless and the rate saturates at Theta~(r* d / n) regardless of r. Taken together, the three results characterize the statistical complexity of LoRA fine-tuning within the well-specified locally quadratic regime, and identify the empirically observed over-parameterization penalty as a property of unregularized empirical risk minimization rather than of the LoRA class itself. Predictions of the theory are verified on a synthetic trace-regression benchmark and on real LoRA fine-tuning across three (model, task) configurations covering DistilBERT and RoBERTa on SST-2 and MRPC. All configurations exhibit the predicted U-shape in validation loss, with two showing statistically significant loss inflation at large ranks (paired permutation p = 0.016).", "arxiv_id": "2607.27680", "arxiv_url": "https://arxiv.org/abs/2607.27680", "authors": ["Arunan J"], "brief": "\u8bba\u6587\u4ece\u7edf\u8ba1\u5b66\u4e60\u89d2\u5ea6\u523b\u753b LoRA \u5fae\u8c03\u7684\u6cdb\u5316\u590d\u6742\u5ea6\uff0c\u8bc1\u660e rank-r LoRA \u5728\u826f\u8bbe\u5c40\u90e8\u4e8c\u6b21\u60c5\u5f62\u4e0b\u7684\u8d85\u989d\u98ce\u9669\u7d27\u754c\u4e3a \u00d5(rd/n)\u3002\u540c\u65f6\u7ed9\u51fa\u4e0d\u540c\u4f30\u8ba1\u5668\u4e0b\u7684\u79e9\u9009\u62e9\u7ed3\u8bba\uff0c\u89e3\u91ca\u4e86\u8fc7\u9ad8 LoRA rank \u4f55\u65f6\u4f1a\u5e26\u6765\u6027\u80fd\u4e0b\u964d\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27680", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528\u5c40\u90e8 Rademacher \u590d\u6742\u5ea6\u8bc1\u660e\u7ea6\u675f\u7ecf\u9a8c\u98ce\u9669\u6700\u5c0f\u5316\u5728\u76ee\u6807\u79e9\u4e0d\u8d85\u8fc7 r \u65f6\u8fbe\u5230 \u00d5(rd/n) \u4e0a\u754c\u3002", "\u901a\u8fc7 Fano \u578b packing \u6784\u9020 rank-r \u5b50\u7a7a\u95f4\u7684 minimax \u4e0b\u754c \u03a9(rd/n)\uff0c\u4e0e\u4e0a\u754c\u5339\u914d\u3002", "\u79e9\u9009\u62e9\u5448\u73b0\u4e8c\u5206\uff1a\u65e0\u6b63\u5219 ERM \u7684\u6700\u4f18 rank \u7b49\u4e8e\u5185\u5728\u79e9 r*\uff0c\u8fc7\u5927 rank \u4f1a\u4f24\u5bb3\u6cdb\u5316\uff1b\u6838\u8303\u6570\u540e\u622a\u65ad\u7684\u81ea\u9002\u5e94\u4f30\u8ba1\u5668\u5219\u5bf9\u8fc7\u5927 rank \u66f4\u9c81\u68d2\uff0c\u901f\u7387\u9971\u548c\u5728 \u00d5(r*d/n)\u3002"], "keywords": ["LoRA", "\u6cdb\u5316\u7406\u8bba", "\u6837\u672c\u590d\u6742\u5ea6", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27680v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Tight Sample Complexity for Low-Rank Adaptation: Matching Bounds and Rank Selection", "tldr": "\u7ed9\u51faLoRA\u6837\u672c\u590d\u6742\u5ea6\u7d27\u754c\u4e0e\u9009\u79e9\u539f\u5219", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ece\u7edf\u8ba1\u5b66\u4e60\u89d2\u5ea6\u523b\u753b LoRA \u5fae\u8c03\u7684\u6cdb\u5316\u590d\u6742\u5ea6\uff0c\u8bc1\u660e rank-r LoRA \u5728\u826f\u8bbe\u5c40\u90e8\u4e8c\u6b21\u60c5\u5f62\u4e0b\u7684\u8d85\u989d\u98ce\u9669\u7d27\u754c\u4e3a \u00d5(rd/n)\u3002\u540c\u65f6\u7ed9\u51fa\u4e0d\u540c\u4f30\u8ba1\u5668\u4e0b\u7684\u79e9\u9009\u62e9\u7ed3\u8bba\uff0c\u89e3\u91ca\u4e86\u8fc7\u9ad8 LoRA rank \u4f55\u65f6\u4f1a\u5e26\u6765\u6027\u80fd\u4e0b\u964d\u3002", "why_notable": "\u8fd9\u662f\u5bf9 LoRA \u5fae\u8c03\u7edf\u8ba1\u590d\u6742\u5ea6\u7684\u8f83\u5b8c\u6574\u7406\u8bba\u523b\u753b\uff0c\u8865\u9f50\u4e86\u5339\u914d\u4e0b\u754c\u548c\u5f62\u5f0f\u5316\u9009\u79e9\u539f\u5219\uff0c\u5e76\u5c06\u5b9e\u8df5\u4e2d\u89c2\u5bdf\u5230\u7684\u9ad8\u79e9\u6027\u80fd\u4e0b\u964d\u5f52\u56e0\u4e8e\u65e0\u6b63\u5219 ERM \u800c\u975e LoRA \u7c7b\u672c\u8eab\uff1b\u7406\u8bba\u8fd8\u5728\u5408\u6210 trace regression \u4e0e DistilBERT/RoBERTa \u5b9e\u9a8c\u4e2d\u5f97\u5230\u9a8c\u8bc1\u3002"}, {"abstract": "Key-value (KV) cache management through compression and eviction strategies has emerged as an important research direction in recent years. Computational demands of large language models (LLMs) and their multi-modal variants during output generation can be partially alleviated by caching previous key and value calculations needed by subsequent scaled dot-product attention operations. However, this leads to another problem: the size of the resulting KV cache grows linearly with context length and quickly consumes all available GPU memory when either the prompt or the generated output are long. KV cache management periodically prunes entries from the cache thereby reducing its memory footprint while attempting to retain sufficient information for accurate generation. A by-product is faster inference speed. We propose a simple yet effective KV eviction scheme motivated by the insight that past tokens which can be well-predicted from more recent tokens are redundant and their associated keys and values can be removed from the cache. To score entries for eviction we run the model on the tokens in their original order, reusing the key and value representations already stored in the KV cache, and applying a counter-causal attention mask so that each position attends only to its future context. This is in-distribution, tied directly to the actual cache contents, and requires no additional training. To further reduce cost, we additionally propose a fast single-layer approximation that restricts the counter-causal pass to the last transformer layer, achieving a significant speedup per refresh cycle at marginal accuracy cost. We evaluate our strategy on various open-source LLMs and benchmark datasets showing competitive or improved performance over other state-of-the-art methods. Reference code is available at https://github.com/metacognitionai/counter_causal.", "arxiv_id": "2607.27600", "arxiv_url": "https://arxiv.org/abs/2607.27600", "authors": ["Stephen Gould", "Anton van den Hengel"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684KV cache\u6dd8\u6c70\u7b56\u7565\uff1a\u82e5\u8fc7\u53bbtoken\u80fd\u88ab\u5176\u540e\u7eed\u4e0a\u4e0b\u6587\u5f88\u597d\u9884\u6d4b\uff0c\u5219\u8ba4\u4e3a\u5176\u7f13\u5b58\u952e\u503c\u5197\u4f59\u5e76\u53ef\u5220\u9664\u3002\u65b9\u6cd5\u901a\u8fc7\u53cd\u56e0\u679c\u6ce8\u610f\u529b\u63a9\u7801\u5728\u539f\u6a21\u578b\u4e0a\u6253\u5206\uff0c\u5e76\u63d0\u4f9b\u4ec5\u7528\u6700\u540e\u4e00\u5c42\u7684\u5feb\u901f\u8fd1\u4f3c\u4ee5\u964d\u4f4e\u5237\u65b0\u5f00\u9500\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27600", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6838\u5fc3\u6253\u5206\u673a\u5236\u662f\u8ba9\u6bcf\u4e2a\u4f4d\u7f6e\u53ea\u5173\u6ce8\u672a\u6765token\uff0c\u7528\u53cd\u56e0\u679c\u6ce8\u610f\u529b\u4f30\u8ba1\u8fc7\u53bbtoken\u7684\u201c\u5197\u4f59\u60ca\u8bb6\u5ea6\u201d\u3002", "\u76f4\u63a5\u590d\u7528\u5df2\u6709KV\u7f13\u5b58\u4e2d\u7684\u952e\u503c\u8868\u793a\uff0c\u4e0d\u9700\u8981\u989d\u5916\u8bad\u7ec3\uff0c\u4e14\u4e0e\u5b9e\u9645\u63a8\u7406\u7f13\u5b58\u5185\u5bb9\u7d27\u5bc6\u5339\u914d\u3002", "\u63d0\u51fa\u5355\u5c42\u8fd1\u4f3c\u7248\u672c\uff0c\u4ec5\u5728\u6700\u540e\u4e00\u4e2aTransformer\u5c42\u6267\u884c\u53cd\u56e0\u679cpass\uff0c\u5728\u8f7b\u5fae\u7cbe\u5ea6\u635f\u5931\u4e0b\u663e\u8457\u52a0\u901f\u7f13\u5b58\u5237\u65b0\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "KV\u7f13\u5b58", "\u63a8\u7406\u52a0\u901f", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27600v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Back from the Future: Key-Value Cache Management by Counter-Causal Surprise", "tldr": "\u7528\u201c\u672a\u6765\u53ef\u9884\u6d4b\u6027\u201d\u9ad8\u6548\u6dd8\u6c70\u5197\u4f59KV\u7f13\u5b58", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684KV cache\u6dd8\u6c70\u7b56\u7565\uff1a\u82e5\u8fc7\u53bbtoken\u80fd\u88ab\u5176\u540e\u7eed\u4e0a\u4e0b\u6587\u5f88\u597d\u9884\u6d4b\uff0c\u5219\u8ba4\u4e3a\u5176\u7f13\u5b58\u952e\u503c\u5197\u4f59\u5e76\u53ef\u5220\u9664\u3002\u65b9\u6cd5\u901a\u8fc7\u53cd\u56e0\u679c\u6ce8\u610f\u529b\u63a9\u7801\u5728\u539f\u6a21\u578b\u4e0a\u6253\u5206\uff0c\u5e76\u63d0\u4f9b\u4ec5\u7528\u6700\u540e\u4e00\u5c42\u7684\u5feb\u901f\u8fd1\u4f3c\u4ee5\u964d\u4f4e\u5237\u65b0\u5f00\u9500\u3002", "why_notable": "KV\u7f13\u5b58\u662f\u957f\u4e0a\u4e0b\u6587LLM\u63a8\u7406\u7684\u4e3b\u8981\u663e\u5b58\u74f6\u9888\u4e4b\u4e00\uff1b\u8be5\u65b9\u6cd5\u4ee5\u7b80\u5355\u3001\u8bad\u7ec3\u65e0\u5173\u7684\u65b9\u5f0f\u6539\u8fdb\u7f13\u5b58\u538b\u7f29/\u6dd8\u6c70\uff0c\u5728\u591a\u4e2a\u5f00\u6e90\u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u8fbe\u5230\u6216\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5177\u5907\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Transformer depth is not used uniformly: lower and middle layers build semantic representations, while upper layers increasingly specialize them for prediction. We turn this division of labor into CoMem (Comprehension Memory), which writes each context chunk only through an intermediate layer, retrieves a fixed number of cached residual states, and recomputes the query-conditioned upper layers over the resulting pack. For a fixed retrieval budget, model-side read compute and memory are independent of stored-context length. We evaluate a continued-trained Qwen3-8B base LM under a unified chat-template-free protocol. The backbone is frozen; the flagship trains only a rank-32 self-distillation LoRA on plain PG19, and we report an adapter-free arm separately. CoMem reaches 97.05 on RULER and 38.27 on LoCoMo versus 34.59 for full-context KV-Direct; the dialogue-memory advantage survives conversation-cluster resampling and an independent judge. Results on additional long-context and long-document tasks expose both the benefits of bounded retrieval and its in-window compression tax. Controlled depth sweeps show that deeper caching lowers per-query recomputation but incurs a fidelity loss that self-distillation substantially repairs. In a separate adapter-free efficiency control on an NVIDIA H20 at 128k, CoMem uses 18.26 GB rather than 89.36 GB and achieves a 7.83x prefill speedup. These results show that long-context memory can be organized along the layer axis, not only the token axis.", "arxiv_id": "2607.28263", "arxiv_url": "https://arxiv.org/abs/2607.28263", "authors": ["Hanzuo Liu", "Xuan Qi", "Chunyu Liu", "Haotian Zhong", "Yulong Wang", "Rayying", "Key", "Alex Lamb", "Mingyu Gao"], "brief": "\u8bba\u6587\u53d1\u73b0\u5927\u8bed\u8a00\u6a21\u578b\u7684\u6df1\u5ea6\u5b58\u5728\u5206\u5de5\uff1a\u4e2d\u4f4e\u5c42\u4e3b\u8981\u5f62\u6210\u8bed\u4e49\u7406\u89e3\uff0c\u9ad8\u5c42\u66f4\u504f\u5411\u9884\u6d4b\u7279\u5316\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa CoMem\uff0c\u5c06\u4e0a\u4e0b\u6587\u5757\u5199\u5165\u4e2d\u95f4\u5c42\u7f13\u5b58\uff0c\u68c0\u7d22\u56fa\u5b9a\u6570\u91cf\u6b8b\u5dee\u72b6\u6001\uff0c\u518d\u5bf9\u67e5\u8be2\u6761\u4ef6\u4e0b\u7684\u9ad8\u5c42\u91cd\u65b0\u8ba1\u7b97\uff0c\u5b9e\u73b0\u5b58\u50a8\u4e0a\u4e0b\u6587\u957f\u5ea6\u65e0\u5173\u7684\u8bfb\u8ba1\u7b97\u4e0e\u663e\u5b58\u5f00\u9500\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28263", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["CoMem\u6309\u6a21\u578b\u5c42\u6df1\u800c\u975e\u4ec5\u6309 token \u8f74\u7ec4\u7ec7\u957f\u4e0a\u4e0b\u6587\u8bb0\u5fc6\uff0c\u7f13\u5b58\u4e2d\u95f4\u5c42\u6b8b\u5dee\u72b6\u6001\u5e76\u8fdb\u884c\u6709\u754c\u68c0\u7d22\u3002", "\u5728\u51bb\u7ed3 Qwen3-8B \u4e3b\u5e72\u3001\u4ec5\u7528 rank-32 \u81ea\u84b8\u998f LoRA \u7ee7\u7eed\u8bad\u7ec3\u7684\u8bbe\u7f6e\u4e0b\uff0cRULER \u8fbe 97.05\u3001LoCoMo \u8fbe 38.27\uff0c\u663e\u8457\u4f18\u4e8e full-context KV-Direct \u7684 34.59\u3002", "128k \u4e0a\u4e0b\u6587\u6548\u7387\u63a7\u5236\u4e2d\uff0cCoMem \u5728 NVIDIA H20 \u4e0a\u663e\u5b58\u4ece 89.36 GB \u964d\u81f3 18.26 GB\uff0cprefill \u52a0\u901f 7.83 \u500d\u3002"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u8bb0\u5fc6\u673a\u5236", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28263v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Understanding Is Done Early: A Depth Division of Labor in Large Language Models and Its Use for Unbounded-Context Memory", "tldr": "CoMem\u6cbf\u5c42\u8f74\u91cd\u7ec4\u957f\u4e0a\u4e0b\u6587\u8bb0\u5fc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\u5927\u8bed\u8a00\u6a21\u578b\u7684\u6df1\u5ea6\u5b58\u5728\u5206\u5de5\uff1a\u4e2d\u4f4e\u5c42\u4e3b\u8981\u5f62\u6210\u8bed\u4e49\u7406\u89e3\uff0c\u9ad8\u5c42\u66f4\u504f\u5411\u9884\u6d4b\u7279\u5316\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa CoMem\uff0c\u5c06\u4e0a\u4e0b\u6587\u5757\u5199\u5165\u4e2d\u95f4\u5c42\u7f13\u5b58\uff0c\u68c0\u7d22\u56fa\u5b9a\u6570\u91cf\u6b8b\u5dee\u72b6\u6001\uff0c\u518d\u5bf9\u67e5\u8be2\u6761\u4ef6\u4e0b\u7684\u9ad8\u5c42\u91cd\u65b0\u8ba1\u7b97\uff0c\u5b9e\u73b0\u5b58\u50a8\u4e0a\u4e0b\u6587\u957f\u5ea6\u65e0\u5173\u7684\u8bfb\u8ba1\u7b97\u4e0e\u663e\u5b58\u5f00\u9500\u3002", "why_notable": "\u5b83\u628a\u957f\u4e0a\u4e0b\u6587\u8bb0\u5fc6\u4ece\u4f20\u7edf\u7684 token \u7ef4\u5ea6\u6269\u5c55\u5230\u5c42\u6df1\u7ef4\u5ea6\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u663e\u5b58\u548c\u8ba1\u7b97\u968f\u5b58\u50a8\u4e0a\u4e0b\u6587\u957f\u5ea6\u89e3\u8026\u7684\u65b0\u65b9\u6848\uff1b\u540c\u65f6\u7528\u5b9e\u9a8c\u8bc1\u660e\u4e2d\u95f4\u5c42\u7f13\u5b58\u867d\u6709\u538b\u7f29\u635f\u5931\uff0c\u4f46\u53ef\u901a\u8fc7\u81ea\u84b8\u998f\u663e\u8457\u4fee\u590d\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u957f\u6587\u6863\u4e0e\u5bf9\u8bdd\u8bb0\u5fc6\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Existing multimodal long-term memory agents use external memory to overcome the limited context available for long videos. However, most methods emphasize what to store rather than how stored memory should be retrieved. When retrieval becomes inaccurate or repeatedly fails to obtain useful evidence, existing agents lack mechanisms to diagnose failures from previous task trajectories and adapt future search strategies.We introduce Reflective Retrieval Memory (RRM), a reflective memory framework for long-horizon multimodal reasoning. RRM augments an entity-centric multimodal memory graph with reflective experience memory, which distills transferable procedural retrieval knowledge from historical task trajectories. Unlike episodic and semantic memories that preserve factual evidence from the current video, reflective experience memory captures reusable search strategies across tasks. RRM converts retrieved experiences into query-level guidance, while answer generation remains conditioned only on factual evidence newly retrieved from the current video. A lifecycle management mechanism further regulates experience memory through usage frequency, reuse feedback, and temporal decay, thereby reducing redundancy and noise. RRM consistently outperforms previous state-of-the-art approaches on M3-Bench-Robot, M3-Bench-Web, and Video-MME-Long, demonstrating the effectiveness of reflective retrieval memory for long-horizon multimodal reasoning.", "arxiv_id": "2607.28156", "arxiv_url": "https://arxiv.org/abs/2607.28156", "authors": ["Jingxiang Fan", "Junbao Zhuo", "Bochao Zou"], "brief": "\u8bba\u6587\u63d0\u51fa Reflective Retrieval Memory\uff08RRM\uff09\uff0c\u5728\u5b9e\u4f53\u4e2d\u5fc3\u591a\u6a21\u6001\u8bb0\u5fc6\u56fe\u4e4b\u5916\u52a0\u5165\u201c\u53cd\u601d\u7ecf\u9a8c\u8bb0\u5fc6\u201d\uff0c\u4ece\u5386\u53f2\u4efb\u52a1\u8f68\u8ff9\u4e2d\u63d0\u70bc\u53ef\u590d\u7528\u7684\u68c0\u7d22\u7b56\u7565\u3002\u5b83\u5c06\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u67e5\u8be2\u7ea7\u68c0\u7d22\u6307\u5bfc\uff0c\u4f46\u6700\u7ec8\u56de\u7b54\u53ea\u4f9d\u8d56\u5f53\u524d\u89c6\u9891\u4e2d\u65b0\u68c0\u7d22\u5230\u7684\u4e8b\u5b9e\u8bc1\u636e\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28156", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5173\u6ce8\u957f\u7a0b\u591a\u6a21\u6001\u63a8\u7406\u4e2d\u201c\u5982\u4f55\u68c0\u7d22\u8bb0\u5fc6\u201d\u800c\u975e\u4ec5\u201c\u5b58\u4ec0\u4e48\u8bb0\u5fc6\u201d\uff0c\u7528\u4e8e\u7f13\u89e3\u957f\u89c6\u9891\u4e0a\u4e0b\u6587\u53d7\u9650\u4e0e\u68c0\u7d22\u5931\u8d25\u95ee\u9898", "\u53cd\u601d\u7ecf\u9a8c\u8bb0\u5fc6\u8bb0\u5f55\u8de8\u4efb\u52a1\u53ef\u8fc1\u79fb\u7684\u7a0b\u5e8f\u6027\u641c\u7d22\u7b56\u7565\uff0c\u5e76\u901a\u8fc7\u4f7f\u7528\u9891\u7387\u3001\u590d\u7528\u53cd\u9988\u548c\u65f6\u95f4\u8870\u51cf\u8fdb\u884c\u751f\u547d\u5468\u671f\u7ba1\u7406", "\u5728 M3-Bench-Robot\u3001M3-Bench-Web \u548c Video-MME-Long \u4e0a\u6301\u7eed\u8d85\u8fc7\u5df2\u6709\u6700\u4f18\u65b9\u6cd5"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u957f\u671f\u8bb0\u5fc6", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28156v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RRM: Experience-Driven Reflective Retrieval Memory for Long-Horizon Multimodal Reasoning", "tldr": "\u7528\u53cd\u601d\u7ecf\u9a8c\u8bb0\u5fc6\u6539\u8fdb\u957f\u89c6\u9891\u68c0\u7d22\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Reflective Retrieval Memory\uff08RRM\uff09\uff0c\u5728\u5b9e\u4f53\u4e2d\u5fc3\u591a\u6a21\u6001\u8bb0\u5fc6\u56fe\u4e4b\u5916\u52a0\u5165\u201c\u53cd\u601d\u7ecf\u9a8c\u8bb0\u5fc6\u201d\uff0c\u4ece\u5386\u53f2\u4efb\u52a1\u8f68\u8ff9\u4e2d\u63d0\u70bc\u53ef\u590d\u7528\u7684\u68c0\u7d22\u7b56\u7565\u3002\u5b83\u5c06\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u67e5\u8be2\u7ea7\u68c0\u7d22\u6307\u5bfc\uff0c\u4f46\u6700\u7ec8\u56de\u7b54\u53ea\u4f9d\u8d56\u5f53\u524d\u89c6\u9891\u4e2d\u65b0\u68c0\u7d22\u5230\u7684\u4e8b\u5b9e\u8bc1\u636e\u3002", "why_notable": "RRM \u5c06\u5931\u8d25\u8f68\u8ff9\u53cd\u601d\u5f15\u5165\u591a\u6a21\u6001\u957f\u671f\u8bb0\u5fc6\u68c0\u7d22\uff0c\u4f7f\u667a\u80fd\u4f53\u80fd\u6839\u636e\u5386\u53f2\u7ecf\u9a8c\u8c03\u6574\u672a\u6765\u641c\u7d22\u7b56\u7565\uff0c\u63d0\u5347\u957f\u65f6\u5e8f\u89c6\u9891\u3001\u673a\u5668\u4eba\u548c\u7f51\u9875\u573a\u666f\u4e2d\u7684\u590d\u6742\u63a8\u7406\u53ef\u9760\u6027\u3002"}, {"abstract": "Decoder-only language models entangle long-term memory and reasoning in a single parameter set, making it difficult to scale memory capacity independently. Memory Decoder introduces a parametric long-term memory module but only studies it at a relatively small scale. In this work, we present Memory Decoder at Scale, scaling memory models up to 6.9B parameters and pretraining them on 300B tokens. At this data scale, the combined cost of indexing and search makes a standard Faiss pipeline infeasible. We address this bottleneck with a distributed pipeline for Faiss indexing and retrieval, together with sparse, batch-wise loading of kNN distributions. Across model scales, we find that allocating more parameters to memory yields a better parameter-performance tradeoff than scaling the base model alone. On 17 benchmarks, pairing a 6.9B general memory with Pythia-410M raises its average score from 29.86 to 37.34, surpassing Pythia-12B (37.24) with 39% fewer total parameters. For Qwen3 Base models ranging from 0.6B to 14B, 1.7B domain memories improve the average score across the three domains by more than 9 points at every scale. Overall, our results demonstrate that independently scaling pretrained memory offers a more parameter efficient path to improving language model performance.", "arxiv_id": "2607.27919", "arxiv_url": "https://arxiv.org/abs/2607.27919", "authors": ["Rubin Wei", "Jiaqi Cao", "Jiarui Wang", "Junming Zhang", "Qipeng Guo", "Bowen Zhou", "Zhouhan Lin"], "brief": "\u8bba\u6587\u5c06 Memory Decoder \u6269\u5c55\u5230\u6700\u9ad8 6.9B \u53c2\u6570\u3001300B tokens \u9884\u8bad\u7ec3\uff0c\u4f5c\u4e3a\u53ef\u72ec\u7acb\u6269\u5c55\u7684\u53c2\u6570\u5316\u957f\u671f\u8bb0\u5fc6\u6a21\u5757\u3002\u5b83\u901a\u8fc7\u5206\u5e03\u5f0f Faiss \u7d22\u5f15/\u68c0\u7d22\u4e0e\u7a00\u758f\u6279\u91cf\u52a0\u8f7d kNN \u5206\u5e03\uff0c\u89e3\u51b3\u5927\u89c4\u6a21\u8bb0\u5fc6\u68c0\u7d22\u7684\u5de5\u7a0b\u74f6\u9888\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27919", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728 17 \u4e2a\u57fa\u51c6\u4e0a\uff0c6.9B \u901a\u7528\u8bb0\u5fc6\u642d\u914d Pythia-410M \u5c06\u5e73\u5747\u5206\u4ece 29.86 \u63d0\u5347\u5230 37.34\uff0c\u8d85\u8fc7 Pythia-12B \u7684 37.24\uff0c\u4e14\u603b\u53c2\u6570\u5c11 39%\u3002", "\u5bf9 0.6B \u5230 14B \u7684 Qwen3 Base\uff0c1.7B \u9886\u57df\u8bb0\u5fc6\u5728\u4e09\u4e2a\u9886\u57df\u5e73\u5747\u63d0\u5347\u5747\u8d85\u8fc7 9 \u5206\u3002", "\u5b9e\u9a8c\u8868\u660e\uff0c\u628a\u66f4\u591a\u53c2\u6570\u5206\u914d\u7ed9\u957f\u671f\u8bb0\u5fc6\uff0c\u6bd4\u5355\u7eaf\u6269\u5927\u57fa\u7840\u6a21\u578b\u5177\u6709\u66f4\u597d\u7684\u53c2\u6570-\u6027\u80fd\u6743\u8861\u3002"], "keywords": ["\u957f\u671f\u8bb0\u5fc6", "\u8bed\u8a00\u6a21\u578b", "\u68c0\u7d22\u589e\u5f3a", "\u6a21\u578b\u6269\u5c55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27919v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Memory Decoder at Scale: A Pretrained, Parametric Long-Term Memory", "tldr": "\u9884\u8bad\u7ec3\u53c2\u6570\u5316\u8bb0\u5fc6\u53ef\u9ad8\u6548\u63d0\u5347\u8bed\u8a00\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06 Memory Decoder \u6269\u5c55\u5230\u6700\u9ad8 6.9B \u53c2\u6570\u3001300B tokens \u9884\u8bad\u7ec3\uff0c\u4f5c\u4e3a\u53ef\u72ec\u7acb\u6269\u5c55\u7684\u53c2\u6570\u5316\u957f\u671f\u8bb0\u5fc6\u6a21\u5757\u3002\u5b83\u901a\u8fc7\u5206\u5e03\u5f0f Faiss \u7d22\u5f15/\u68c0\u7d22\u4e0e\u7a00\u758f\u6279\u91cf\u52a0\u8f7d kNN \u5206\u5e03\uff0c\u89e3\u51b3\u5927\u89c4\u6a21\u8bb0\u5fc6\u68c0\u7d22\u7684\u5de5\u7a0b\u74f6\u9888\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u8bed\u8a00\u6a21\u578b\u6269\u5c55\u63d0\u4f9b\u4e86\u4e0d\u540c\u4e8e\u201c\u66f4\u5927\u6a21\u578b\u201d\u7684\u8def\u5f84\uff1a\u5c06\u77e5\u8bc6\u8bb0\u5fc6\u4e0e\u63a8\u7406\u53c2\u6570\u89e3\u8026\uff0c\u5e76\u8bc1\u660e\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u8bb0\u5fc6\u6a21\u5757\u80fd\u4ee5\u66f4\u5c11\u53c2\u6570\u5e26\u6765\u7ade\u4e89\u6027\u6027\u80fd\uff0c\u5177\u6709\u91cd\u8981\u7684\u67b6\u6784\u548c\u7cfb\u7edf\u5b9e\u8df5\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) search agents commonly model retrieval as free-form natural-language query generation and optimize multi-turn interactions using final-answer rewards. Current studies mainly improve training with denser or more structured credit signals, but rarely examine whether retrieval is properly formulated at the policy-environment interface. We observe pronounced retrieval aliasing during Search-R1 training: rollouts for the same question continue to generate distinct query strings, yet their accumulated evidence sets increasingly overlap. We call this phenomenon retrieval-equivalence collapse; in this regime, trajectories approach utility equivalence with respect to retrieval decisions, leaving within-group returns with little effective retrieval contrast. To address this problem, we propose Harness-G, a graph-structured retrieval framework that redesigns this interface. It reformulates free-form query generation as finite action selection: the policy selects an evidence sentence or entity, or chooses to answer, while the environment constructs the menu, tracks retrieval state, and validates and executes each choice. This interface reduces linguistic aliasing and makes same-state alternatives directly comparable. Building on this interface, we introduce Structured Non-myopic Credit (SNC), which uses a frozen answer scorer to compare the selected action with its alternatives and assigns downstream gains to the earlier actions that enabled them. Across six QA benchmarks, Harness-G achieves the highest average F1 at both evaluated model scales, outperforming the strongest baseline, Graph-R1, by 10.74 points at 1.5B and 3.98 points at 3B.", "arxiv_id": "2607.27652", "arxiv_url": "https://arxiv.org/abs/2607.27652", "authors": ["Yanning Hou", "Haoyuan Chen", "Sihang Zhou", "Xiaoshu Chen", "Xirui Liu", "Duanyang Yuan", "Lingyuan Meng", "Quan Liu", "Jian Huang"], "brief": "\u8bba\u6587\u63d0\u51fa Harness-G\uff0c\u5c06\u641c\u7d22\u667a\u80fd\u4f53\u7684\u81ea\u7531\u6587\u672c\u67e5\u8be2\u751f\u6210\u6539\u4e3a\u56fe\u7ed3\u6784\u4e2d\u7684\u6709\u9650\u52a8\u4f5c\u9009\u62e9\uff1a\u9009\u62e9\u8bc1\u636e\u53e5\u3001\u5b9e\u4f53\u6216\u76f4\u63a5\u56de\u7b54\u3002\u5e76\u63d0\u51fa Structured Non-myopic Credit\uff08SNC\uff09\uff0c\u7528\u51bb\u7ed3\u7b54\u6848\u8bc4\u5206\u5668\u5bf9\u52a8\u4f5c\u53ca\u5176\u66ff\u4ee3\u9879\u8fdb\u884c\u6bd4\u8f83\uff0c\u4e3a\u65e9\u671f\u68c0\u7d22\u52a8\u4f5c\u5206\u914d\u66f4\u6709\u6548\u7684\u957f\u671f\u4fe1\u7528\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27652", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u53d1\u73b0 Search-R1 \u8bad\u7ec3\u4e2d\u5b58\u5728\u201c\u68c0\u7d22\u7b49\u4ef7\u574d\u7f29\u201d\uff1a\u540c\u4e00\u95ee\u9898\u751f\u6210\u4e0d\u540c\u67e5\u8be2\uff0c\u4f46\u6700\u7ec8\u8bc1\u636e\u96c6\u5408\u9ad8\u5ea6\u91cd\u53e0\uff0c\u524a\u5f31\u4e86\u8f68\u8ff9\u95f4\u7684\u6709\u6548\u56de\u62a5\u5dee\u5f02\u3002", "Harness-G \u7531\u73af\u5883\u6784\u5efa\u5019\u9009\u83dc\u5355\u3001\u8ddf\u8e2a\u68c0\u7d22\u72b6\u6001\u5e76\u9a8c\u8bc1\u52a8\u4f5c\uff0c\u5c06\u68c0\u7d22\u51b3\u7b56\u4ece\u8bed\u8a00\u8868\u8ff0\u95ee\u9898\u8f6c\u4e3a\u53ef\u6bd4\u8f83\u7684\u79bb\u6563\u52a8\u4f5c\u9009\u62e9\u3002", "\u5728\u516d\u4e2a\u95ee\u7b54\u57fa\u51c6\u4e0a\uff0cHarness-G \u57281.5B\u548c3B\u6a21\u578b\u89c4\u6a21\u5747\u53d6\u5f97\u6700\u9ad8\u5e73\u5747F1\uff0c\u5206\u522b\u6bd4 Graph-R1 \u9ad810.74\u548c3.98\u5206\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u606f\u68c0\u7d22", "\u95ee\u7b54\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27652v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Harness-G: A Graph-Structured Harness for Search Agents", "tldr": "\u56fe\u7ed3\u6784\u68c0\u7d22\u63a5\u53e3\u663e\u8457\u63d0\u5347RL\u641c\u7d22\u667a\u80fd\u4f53\u95ee\u7b54\u8868\u73b0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Harness-G\uff0c\u5c06\u641c\u7d22\u667a\u80fd\u4f53\u7684\u81ea\u7531\u6587\u672c\u67e5\u8be2\u751f\u6210\u6539\u4e3a\u56fe\u7ed3\u6784\u4e2d\u7684\u6709\u9650\u52a8\u4f5c\u9009\u62e9\uff1a\u9009\u62e9\u8bc1\u636e\u53e5\u3001\u5b9e\u4f53\u6216\u76f4\u63a5\u56de\u7b54\u3002\u5e76\u63d0\u51fa Structured Non-myopic Credit\uff08SNC\uff09\uff0c\u7528\u51bb\u7ed3\u7b54\u6848\u8bc4\u5206\u5668\u5bf9\u52a8\u4f5c\u53ca\u5176\u66ff\u4ee3\u9879\u8fdb\u884c\u6bd4\u8f83\uff0c\u4e3a\u65e9\u671f\u68c0\u7d22\u52a8\u4f5c\u5206\u914d\u66f4\u6709\u6548\u7684\u957f\u671f\u4fe1\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6ca1\u6709\u53ea\u6539\u8fdb\u5956\u52b1\u4fe1\u53f7\uff0c\u800c\u662f\u91cd\u65b0\u8bbe\u8ba1\u641c\u7d22\u667a\u80fd\u4f53\u7684\u7b56\u7565-\u73af\u5883\u63a5\u53e3\uff0c\u76f4\u63a5\u7f13\u89e3\u81ea\u7531\u6587\u672c\u67e5\u8be2\u5e26\u6765\u7684\u522b\u540d\u95ee\u9898\uff1b\u5bf9\u63d0\u5347\u53ef\u8bad\u7ec3\u3001\u53ef\u6bd4\u8f83\u3001\u53ef\u63a7\u7684\u68c0\u7d22\u589e\u5f3a\u667a\u80fd\u4f53\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language Models (VLMs) such as CLIP are now foundational to multimodal systems, yet their robustness to spurious correlations remains poorly understood at scale. We present the first large-scale empirical study of 194 publicly available VLMs, including 16 model families, covering a wide range of model sizes, 24 training datasets, and three evaluation benchmarks, namely ImageNet (overall performance), CelebA (typical single-attribute bias), and UrbanCars (complex multi-attribute biases). Across these settings, the Spearman correlation between model scale and performance weakens as evaluation shifts from ImageNet ($\u03c1{=}0.68$) to single-attribute ($\u03c1{=}0.48$) and further to multi-attribute ($\u03c1{=}0.05$) bias benchmarks. In contrast, properties of the training data (size and quality) show more consistent relationships with worst-group accuracy across both bias benchmarks. Notably, curated datasets yield improvements of up to 25% over uncurated alternatives at a comparable scale. Finally, the effect of architectural choices (e.g., patch size, image resolution) is highly context-dependent, varying with the nature of the benchmark, including the type of bias and its spatial distribution within images.", "arxiv_id": "2607.28211", "arxiv_url": "https://arxiv.org/abs/2607.28211", "authors": ["Ioannis Sarridis", "Ioannis Kompatsiaris", "Symeon Papadopoulos"], "brief": "\u672c\u6587\u5bf9194\u4e2a\u516c\u5f00\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u5927\u89c4\u6a21\u5b9e\u8bc1\u7814\u7a76\uff0c\u5206\u6790\u6a21\u578b\u89c4\u6a21\u3001\u8bad\u7ec3\u6570\u636e\u548c\u67b6\u6784\u9009\u62e9\u5bf9\u865a\u5047\u76f8\u5173\u4e0e\u7fa4\u4f53\u504f\u89c1\u9c81\u68d2\u6027\u7684\u5f71\u54cd\u3002\u7ed3\u679c\u663e\u793a\uff0c\u89c4\u6a21\u4e0e\u504f\u89c1\u57fa\u51c6\u8868\u73b0\u7684\u76f8\u5173\u6027\u663e\u8457\u5f31\u4e8e\u5e38\u89c4ImageNet\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28211", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d616\u4e2a\u6a21\u578b\u5bb6\u65cf\u300124\u4e2a\u8bad\u7ec3\u6570\u636e\u96c6\u548c3\u7c7b\u8bc4\u6d4b\u57fa\u51c6\uff1aImageNet\u3001CelebA\u4e0eUrbanCars", "\u6a21\u578b\u89c4\u6a21\u4e0e\u6027\u80fd\u76f8\u5173\u6027\u4eceImageNet\u7684\u03c1=0.68\u964d\u81f3\u5355\u5c5e\u6027\u504f\u89c1\u7684\u03c1=0.48\uff0c\u5728\u591a\u5c5e\u6027\u504f\u89c1\u4e0a\u4ec5\u03c1=0.05", "\u8bad\u7ec3\u6570\u636e\u7684\u89c4\u6a21\u4e0e\u8d28\u91cf\u66f4\u7a33\u5b9a\u5730\u5173\u8054\u6700\u5dee\u7fa4\u4f53\u51c6\u786e\u7387\uff0c\u7cbe\u9009\u6570\u636e\u96c6\u5728\u76f8\u8fd1\u89c4\u6a21\u4e0b\u6700\u591a\u63d0\u534725%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u504f\u89c1", "\u9c81\u68d2\u6027", "\u6570\u636e\u8d28\u91cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28211v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Scaling Vision-Language Models Is Not Enough to Mitigate Bias", "tldr": "\u6269\u5927VLM\u89c4\u6a21\u5e76\u4e0d\u80fd\u6709\u6548\u7f13\u89e3\u504f\u89c1", "upvotes": 0, "what_it_is": "\u672c\u6587\u5bf9194\u4e2a\u516c\u5f00\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u5927\u89c4\u6a21\u5b9e\u8bc1\u7814\u7a76\uff0c\u5206\u6790\u6a21\u578b\u89c4\u6a21\u3001\u8bad\u7ec3\u6570\u636e\u548c\u67b6\u6784\u9009\u62e9\u5bf9\u865a\u5047\u76f8\u5173\u4e0e\u7fa4\u4f53\u504f\u89c1\u9c81\u68d2\u6027\u7684\u5f71\u54cd\u3002\u7ed3\u679c\u663e\u793a\uff0c\u89c4\u6a21\u4e0e\u504f\u89c1\u57fa\u51c6\u8868\u73b0\u7684\u76f8\u5173\u6027\u663e\u8457\u5f31\u4e8e\u5e38\u89c4ImageNet\u6027\u80fd\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u201c\u66f4\u5927\u6a21\u578b\u81ea\u7136\u66f4\u516c\u5e73/\u66f4\u9c81\u68d2\u201d\u7684\u5047\u8bbe\uff0c\u5f3a\u8c03\u6570\u636e\u8d28\u91cf\u4e0e\u504f\u89c1\u8bc4\u6d4b\u7684\u91cd\u8981\u6027\uff0c\u5bf9\u6784\u5efa\u53ef\u9760\u591a\u6a21\u6001\u7cfb\u7edf\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Many dexterous manipulation tasks require the object to remain securely held throughout the interaction. From the perspective of hand-object relational motion, such manipulation comprises four canonical skills: grasping, relocation, in-hand rotation, and in-hand translation. Human hands flexibly compose these skills to accomplish complex tasks. Existing approaches, however, model these skills separately with skill-specific action constraints, objectives, or even dedicated hand morphologies, which breaks the compatibility and continuity required for long-horizon composition. In this work, we present a unified framework that models all four skills in a single formulation that shares the same state and action spaces and a common objective structure. This formulation enables straightforward distillation of a single cross-skill policy that performs strongly on every skill, generalizes to unseen objects, stays robust to disturbances, and chains skills seamlessly into long-horizon manipulation. The framework also transfers effectively across different hand morphologies. Overall, our results suggest that different dexterous manipulation skills can be viewed as instantiations of a shared task formulation, revealing the intrinsic consistency across different behaviors.", "arxiv_id": "2607.28198", "arxiv_url": "https://arxiv.org/abs/2607.28198", "authors": ["Hui Zhang", "Julian Ferchow", "Jie Song", "Mirko Meboldt"], "brief": "UniCross \u63d0\u51fa\u4e00\u4e2a\u7edf\u4e00\u6846\u67b6\uff0c\u5c06\u6293\u53d6\u3001\u642c\u79fb\u3001\u624b\u5185\u65cb\u8f6c\u548c\u624b\u5185\u5e73\u79fb\u56db\u7c7b\u7075\u5de7\u64cd\u4f5c\u6280\u80fd\u7eb3\u5165\u540c\u4e00\u72b6\u6001\u7a7a\u95f4\u3001\u52a8\u4f5c\u7a7a\u95f4\u4e0e\u76ee\u6807\u7ed3\u6784\u3002\u57fa\u4e8e\u8be5 formulation\uff0c\u53ef\u84b8\u998f\u51fa\u5355\u4e00\u8de8\u6280\u80fd\u7b56\u7565\uff0c\u5b9e\u73b0\u591a\u6280\u80fd\u6267\u884c\u3001\u6cdb\u5316\u4e0e\u957f\u65f6\u5e8f\u7ec4\u5408\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28198", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7528\u7edf\u4e00\u4efb\u52a1\u8868\u8ff0\u66ff\u4ee3\u4ee5\u5f80\u6309\u6280\u80fd\u5206\u522b\u8bbe\u8ba1\u7ea6\u675f\u3001\u76ee\u6807\u6216\u624b\u5f62\u7ed3\u6784\u7684\u65b9\u6cd5", "\u5355\u4e00\u8de8\u6280\u80fd\u7b56\u7565\u53ef\u5728\u672a\u89c1\u7269\u4f53\u4e0a\u6cdb\u5316\uff0c\u5e76\u5bf9\u5916\u754c\u6270\u52a8\u4fdd\u6301\u9c81\u68d2", "\u652f\u6301\u6280\u80fd\u65e0\u7f1d\u4e32\u8054\u6210\u957f\u65f6\u5e8f\u7075\u5de7\u64cd\u4f5c\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u4e0d\u540c\u673a\u68b0\u624b\u5f62\u6001"], "keywords": ["\u7075\u5de7\u64cd\u4f5c", "\u673a\u5668\u4eba\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60", "\u6280\u80fd\u7ec4\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28198v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "UniCross: Unified Cross-Skill Dexterous Manipulation Synthesis", "tldr": "\u7edf\u4e00\u5efa\u6a21\u56db\u7c7b\u7075\u5de7\u624b\u64cd\u4f5c\u6280\u80fd", "upvotes": 0, "what_it_is": "UniCross \u63d0\u51fa\u4e00\u4e2a\u7edf\u4e00\u6846\u67b6\uff0c\u5c06\u6293\u53d6\u3001\u642c\u79fb\u3001\u624b\u5185\u65cb\u8f6c\u548c\u624b\u5185\u5e73\u79fb\u56db\u7c7b\u7075\u5de7\u64cd\u4f5c\u6280\u80fd\u7eb3\u5165\u540c\u4e00\u72b6\u6001\u7a7a\u95f4\u3001\u52a8\u4f5c\u7a7a\u95f4\u4e0e\u76ee\u6807\u7ed3\u6784\u3002\u57fa\u4e8e\u8be5 formulation\uff0c\u53ef\u84b8\u998f\u51fa\u5355\u4e00\u8de8\u6280\u80fd\u7b56\u7565\uff0c\u5b9e\u73b0\u591a\u6280\u80fd\u6267\u884c\u3001\u6cdb\u5316\u4e0e\u957f\u65f6\u5e8f\u7ec4\u5408\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u591a\u79cd\u7075\u5de7\u64cd\u4f5c\u884c\u4e3a\u4e4b\u95f4\u7684\u5185\u5728\u4e00\u81f4\u6027\uff0c\u6709\u671b\u964d\u4f4e\u590d\u6742\u624b\u90e8\u64cd\u4f5c\u7b56\u7565\u8bbe\u8ba1\u96be\u5ea6\uff0c\u5e76\u63d0\u5347\u957f\u65f6\u7a0b\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u53ef\u7ec4\u5408\u6027\u4e0e\u53ef\u8fc1\u79fb\u6027\u3002"}, {"abstract": "Large vision-language models (LVLMs) often hallucinate objects that are absent from an image. Despite recent progress, existing mitigation methods still lack reliable object-level grounding diagnostics and therefore tend to apply coarse-grained interventions, which can impair visual understanding, shorten responses, and reduce coverage of genuinely grounded objects. The key challenge is thus to detect, during generation, whether each emerging object mention is supported by reliable visual evidence, so that hallucination can be mitigated selectively. Yet output confidence reflects next-token plausibility rather than visual support, allowing language priors to make absent objects appear certain. We show that the missing diagnostic evidence is encoded in an Intrinsic Grounding Signature (IGS), a distributed signed attention pattern that remains informative for such confident hallucinations. Based on IGS, we propose Verifier-Guided Decoding (VGD), a decoding framework in which a lightweight verifier examines each emerging object mention, rolls back the KV cache when the mention is identified as high risk, suppresses the object and its synonyms, and regenerates the affected continuation. Because VGD intervenes only on object mentions identified as high risk, it reduces object hallucination while preserving the model\u0027s original visual understanding and grounded object coverage. Experiments on CHAIR and AMBER-G show that VGD achieves state-of-the-art object hallucination reduction: at @rec90, it cuts AMBER-G CHAIR by 43.6\\% while retaining 99.6\\% of grounded-object coverage, and reduces CHAIR-MSCOCO CHAIR$_i$/CHAIR$_s$ by 37.0\\%/30.4\\% without shortening captions.", "arxiv_id": "2607.27823", "arxiv_url": "https://arxiv.org/abs/2607.27823", "authors": ["Lei Yang", "Xinze Liu", "Dayan Wu", "Ding Wang", "Hengjie Zhu", "Zihao Zhang", "Tianzhu Hu", "Hanqi Wu", "Peng Fu", "Zheng Lin"], "brief": "\u672c\u6587\u53d1\u73b0\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u751f\u6210\u7269\u4f53\u540d\u8bcd\u65f6\uff0c\u5176\u6ce8\u610f\u529b\u4e2d\u5b58\u5728\u53ef\u8bca\u65ad\u89c6\u89c9\u652f\u6491\u7684\u201c\u5185\u5728\u63a5\u5730\u7b7e\u540d\u201d\uff08IGS\uff09\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa Verifier-Guided Decoding\uff0c\u5728\u89e3\u7801\u65f6\u8bc6\u522b\u9ad8\u98ce\u9669\u7269\u4f53\u63d0\u53ca\u5e76\u56de\u6eda\u91cd\u751f\u6210\uff0c\u4ece\u800c\u9009\u62e9\u6027\u6291\u5236\u5e7b\u89c9\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27823", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["IGS \u662f\u4e00\u79cd\u5206\u5e03\u5f0f\u6709\u7b26\u53f7\u6ce8\u610f\u529b\u6a21\u5f0f\uff0c\u5373\u4f7f\u6a21\u578b\u5bf9\u5e7b\u89c9\u7269\u4f53\u5f88\u81ea\u4fe1\uff0c\u4e5f\u80fd\u63d0\u4f9b\u7269\u4f53\u7ea7\u63a5\u5730\u8bca\u65ad\u4fe1\u53f7\u3002", "VGD \u4f7f\u7528\u8f7b\u91cf verifier \u68c0\u67e5\u6b63\u5728\u751f\u6210\u7684\u7269\u4f53\u63d0\u53ca\uff1b\u82e5\u5224\u5b9a\u9ad8\u98ce\u9669\uff0c\u5219\u56de\u6eda KV cache\u3001\u6291\u5236\u8be5\u7269\u4f53\u53ca\u540c\u4e49\u8bcd\u5e76\u91cd\u65b0\u751f\u6210\u540e\u7eed\u5185\u5bb9\u3002", "\u5728 CHAIR \u548c AMBER-G \u4e0a\u8fbe\u5230\u5f53\u524d\u6700\u4f73\u5e7b\u89c9\u6291\u5236\u6548\u679c\uff1a@rec90 \u4e0b AMBER-G CHAIR \u964d\u4f4e 43.6%\uff0c\u540c\u65f6\u4fdd\u7559 99.6% \u771f\u5b9e\u63a5\u5730\u7269\u4f53\u8986\u76d6\u7387\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9\u68c0\u6d4b", "\u89e3\u7801\u7b56\u7565", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27823v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Hallucinations Leave a Grounding Signature:Verifier-Guided Decoding for Selective Object Correction", "tldr": "\u7528\u5185\u5728\u63a5\u5730\u4fe1\u53f7\u9009\u62e9\u6027\u7ea0\u6b63\u5e7b\u89c9\u7269\u4f53", "upvotes": 0, "what_it_is": "\u672c\u6587\u53d1\u73b0\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u751f\u6210\u7269\u4f53\u540d\u8bcd\u65f6\uff0c\u5176\u6ce8\u610f\u529b\u4e2d\u5b58\u5728\u53ef\u8bca\u65ad\u89c6\u89c9\u652f\u6491\u7684\u201c\u5185\u5728\u63a5\u5730\u7b7e\u540d\u201d\uff08IGS\uff09\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa Verifier-Guided Decoding\uff0c\u5728\u89e3\u7801\u65f6\u8bc6\u522b\u9ad8\u98ce\u9669\u7269\u4f53\u63d0\u53ca\u5e76\u56de\u6eda\u91cd\u751f\u6210\uff0c\u4ece\u800c\u9009\u62e9\u6027\u6291\u5236\u5e7b\u89c9\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5c06\u5e7b\u89c9\u5e72\u9884\u4ece\u7c97\u7c92\u5ea6\u6574\u4f53\u7ea6\u675f\u63a8\u8fdb\u5230\u7269\u4f53\u7ea7\u9009\u62e9\u6027\u7ea0\u9519\uff0c\u65e2\u964d\u4f4e\u4e0d\u5b58\u5728\u7269\u4f53\u7684\u751f\u6210\uff0c\u53c8\u5c3d\u91cf\u4e0d\u727a\u7272\u63cf\u8ff0\u957f\u5ea6\u3001\u89c6\u89c9\u7406\u89e3\u548c\u771f\u5b9e\u7269\u4f53\u8986\u76d6\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Vision-Language Models (VLMs) suffer from prohibitive inference overhead due to long sequences of visual tokens. However, existing visual token reduction methods mainly improve efficiency by pruning or compressing redundant tokens without examining whether the resulting representation remains semantically consistent with the original representation. Mapping the original N-token visual sequence to K tokens may discard, dilute, or misassign critical visual cues, triggering severe semantic drift that deviates the VLM\u0027s understanding. In this paper, we first introduce the principle of \u0027Calibrate Before Reason\u0027 to visual token reduction and propose CaRe, a training-free robust framework that calibrates compact visual representations before reasoning to preserve semantic fidelity in VLMs. CaRe consists of two mutually complementary modules: 1) Perturbation-Robust Calibration Anchoring, which identifies calibration anchors with stable model-side influence under multi-directional perturbations; 2) Confidence-Gated Token Calibration, which extracts reliable calibration signals from unselected tokens and injects them into anchors. Extensive evaluations across diverse VLM architectures and benchmarks verify that CaRe outperforms state-of-the-art token reduction baselines. While pruning 94.4% of visual tokens, our method retains 96.4% of the original full-token performance, delivering up to 2.30 times faster end-to-end inference speed relative to unpruned vanilla models.", "arxiv_id": "2607.27700", "arxiv_url": "https://arxiv.org/abs/2607.27700", "authors": ["Jiasheng Li", "Zhong Ji", "Yan Zhang", "Huihui Li"], "brief": "\u8bba\u6587\u63d0\u51fa CaRe\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u89c6\u89c9 token \u7f29\u51cf\u6846\u67b6\uff0c\u5728VLM\u63a8\u7406\u524d\u6821\u51c6\u538b\u7f29\u540e\u7684\u89c6\u89c9\u8868\u793a\uff0c\u4ee5\u964d\u4f4e\u8bed\u4e49\u6f02\u79fb\u3002\u5b83\u901a\u8fc7\u9009\u62e9\u7a33\u5b9a\u6821\u51c6\u951a\u70b9\u5e76\u4ece\u672a\u9009 token \u4e2d\u6ce8\u5165\u53ef\u9760\u8bed\u4e49\u4fe1\u53f7\uff0c\u5728\u5927\u5e45\u526a\u679d\u4e0b\u4fdd\u6301\u539f\u6a21\u578b\u7406\u89e3\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27700", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u201cCalibrate Before Reason\u201d\u539f\u5219\uff0c\u5f3a\u8c03\u89c6\u89c9 token \u7f29\u51cf\u4e0d\u4ec5\u8981\u9ad8\u6548\uff0c\u8fd8\u8981\u4fdd\u6301\u4e0e\u539f\u59cb\u8868\u793a\u7684\u8bed\u4e49\u4e00\u81f4\u6027", "\u5305\u542b\u6270\u52a8\u9c81\u68d2\u6821\u51c6\u951a\u5b9a\u4e0e\u7f6e\u4fe1\u95e8\u63a7 token \u6821\u51c6\u4e24\u4e2a\u6a21\u5757\uff0c\u5206\u522b\u8d1f\u8d23\u627e\u7a33\u5b9a\u951a\u70b9\u548c\u8865\u507f\u88ab\u526a token \u7684\u6709\u6548\u4fe1\u606f", "\u5728\u526a\u966494.4%\u89c6\u89c9token\u65f6\u4fdd\u755996.4%\u5168token\u6027\u80fd\uff0c\u7aef\u5230\u7aef\u63a8\u7406\u6700\u9ad8\u52a0\u901f2.30\u500d"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27700v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Calibrate Before Reason: Robust Visual Token Reduction against Semantic Drift in VLMs", "tldr": "\u5148\u6821\u51c6\u518d\u63a8\u7406\uff0c\u7a33\u5065\u538b\u7f29VLM\u89c6\u89c9token", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CaRe\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u89c6\u89c9 token \u7f29\u51cf\u6846\u67b6\uff0c\u5728VLM\u63a8\u7406\u524d\u6821\u51c6\u538b\u7f29\u540e\u7684\u89c6\u89c9\u8868\u793a\uff0c\u4ee5\u964d\u4f4e\u8bed\u4e49\u6f02\u79fb\u3002\u5b83\u901a\u8fc7\u9009\u62e9\u7a33\u5b9a\u6821\u51c6\u951a\u70b9\u5e76\u4ece\u672a\u9009 token \u4e2d\u6ce8\u5165\u53ef\u9760\u8bed\u4e49\u4fe1\u53f7\uff0c\u5728\u5927\u5e45\u526a\u679d\u4e0b\u4fdd\u6301\u539f\u6a21\u578b\u7406\u89e3\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9VLM\u89c6\u89c9token\u538b\u7f29\u4e2d\u7684\u8bed\u4e49\u6f02\u79fb\u95ee\u9898\u7ed9\u51fa\u514d\u8bad\u7ec3\u89e3\u51b3\u65b9\u6848\uff0c\u517c\u987e\u6548\u7387\u4e0e\u8bed\u4e49\u4fdd\u771f\uff0c\u5bf9\u90e8\u7f72\u9ad8\u5206\u8fa8\u7387\u3001\u591a\u56fe\u50cf\u6216\u957f\u4e0a\u4e0b\u6587VLM\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Generating high-quality 360-degree dynamic human assets from text prompts is challenging. Existing methods usually synthesize monocular or multi-view videos first and then fit a 4D representation, which is expensive and often causes incomplete geometry or view-inconsistent renderings. We present 4DHumanDiff, a diffusion framework that directly generates dynamic humans represented by 4D Gaussian Splatting (4DGS) from text prompts. By modeling the structured 4D representation space end-to-end, 4DHumanDiff avoids video pre-generation and per-scene reconstruction, making it better suited for view-consistent and temporally coherent asset generation. The model uses a 3D U-Net backbone with temporal attention for motion-aware generation. We further construct a large-scale text-to-4DGS dataset with 60,000 high-quality pairs, and introduce 2D regularization and training-free 4D interpolation to improve rendering quality and motion smoothness. Experiments show that 4DHumanDiff generates consistent 360-degree dynamic humans within one minute, achieves better temporal and multi-view consistency, and reduces inference time by more than 10x.", "arxiv_id": "2607.27634", "arxiv_url": "https://arxiv.org/abs/2607.27634", "authors": ["Renlong Wu", "Haoran Chen", "Yuxiang Wei", "Xiaowei Jin", "Wangmeng Zuo", "Hui Li"], "brief": "4DHumanDiff \u662f\u4e00\u4e2a\u4ece\u6587\u672c\u63d0\u793a\u76f4\u63a5\u751f\u6210 4D Gaussian Splatting \u52a8\u6001\u4eba\u7c7b\u7684\u6269\u6563\u6846\u67b6\u3002\u5b83\u7ed5\u8fc7\u5148\u751f\u6210\u89c6\u9891\u518d\u91cd\u5efa\u7684\u6d41\u7a0b\uff0c\u5b9e\u73b0\u66f4\u5feb\u3001\u66f4\u4e00\u81f4\u7684 360 \u5ea6\u52a8\u6001\u4eba\u4f53\u8d44\u4ea7\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27634", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 3D U-Net \u9aa8\u5e72\u7f51\u7edc\u4e0e\u65f6\u5e8f\u6ce8\u610f\u529b\uff0c\u5728\u7ed3\u6784\u5316 4DGS \u8868\u793a\u7a7a\u95f4\u4e2d\u7aef\u5230\u7aef\u5efa\u6a21\u4eba\u4f53\u5916\u89c2\u4e0e\u8fd0\u52a8", "\u6784\u5efa\u4e86\u5305\u542b 6 \u4e07\u4e2a\u9ad8\u8d28\u91cf\u6587\u672c-4DGS \u914d\u5bf9\u6837\u672c\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6", "\u5f15\u5165 2D \u6b63\u5219\u5316\u548c\u514d\u8bad\u7ec3 4D \u63d2\u503c\uff0c\u63d0\u5347\u6e32\u67d3\u8d28\u91cf\u3001\u8fd0\u52a8\u5e73\u6ed1\u6027\u548c\u591a\u89c6\u89d2\u4e00\u81f4\u6027"], "keywords": ["4D\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u9ad8\u65af\u6cfc\u6e85", "\u6570\u5b57\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27634v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "4DHumanDiff: Direct Text-to-4DGS Generation for Consistent 360-Degree Dynamic Humans", "tldr": "\u6587\u672c\u76f4\u63a5\u751f\u6210\u4e00\u81f4\u76844D\u52a8\u6001\u4eba\u7c7b\u8d44\u4ea7", "upvotes": 0, "what_it_is": "4DHumanDiff \u662f\u4e00\u4e2a\u4ece\u6587\u672c\u63d0\u793a\u76f4\u63a5\u751f\u6210 4D Gaussian Splatting \u52a8\u6001\u4eba\u7c7b\u7684\u6269\u6563\u6846\u67b6\u3002\u5b83\u7ed5\u8fc7\u5148\u751f\u6210\u89c6\u9891\u518d\u91cd\u5efa\u7684\u6d41\u7a0b\uff0c\u5b9e\u73b0\u66f4\u5feb\u3001\u66f4\u4e00\u81f4\u7684 360 \u5ea6\u52a8\u6001\u4eba\u4f53\u8d44\u4ea7\u751f\u6210\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5c06\u6587\u672c\u5230\u52a8\u6001\u4eba\u7c7b\u8d44\u4ea7\u751f\u6210\u4ece\u201c\u89c6\u9891\u5408\u6210+\u91cd\u5efa\u201d\u63a8\u8fdb\u5230\u76f4\u63a5\u751f\u6210 4D \u8868\u793a\uff0c\u663e\u8457\u964d\u4f4e\u63a8\u7406\u6210\u672c\uff0c\u5e76\u5728\u4e00\u5206\u949f\u5185\u751f\u6210\u89c6\u89d2\u4e00\u81f4\u3001\u65f6\u95f4\u8fde\u8d2f\u7684 360 \u5ea6\u52a8\u6001\u4eba\u4f53\uff0c\u5bf9\u6e38\u620f\u3001\u5f71\u89c6\u548c\u865a\u62df\u4eba\u5185\u5bb9\u751f\u4ea7\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Instruction-following ability is critical for deploying large language models in real-world applications, where downstream components depend on the output satisfying specific constraints. Modern deployments increasingly handle the full task in a single LLM call, with one prompt specifying a layered output whose overall artifact, structural sections, and nested fields must each satisfy concrete constraints. Existing instruction-following benchmarks treat the constraint set as a flat list applied uniformly to the response, so they cannot scope a check to a particular section of the output. We introduce IFHierBench, a hierarchical instruction-following benchmark of 600 prompts stratified across four constraint-tree depths and 35 distinct constraints, each prompt paired with a deterministic checker that verifies satisfaction at every scope. Evaluating seven leading proprietary and open-weight models, we find that even the strongest model only marginally exceeds 50% prompt-level accuracy and that accuracy degrades sharply as constraint depth grows. Reliably following nested constraints remains a substantial gap for current LLMs, motivating future training methods that consider constraint adherence at finer granularity to achieve better instruction-following ability.", "arxiv_id": "2607.27912", "arxiv_url": "https://arxiv.org/abs/2607.27912", "authors": ["Yuetian Mao", "Chunyang Chen"], "brief": "\u8bba\u6587\u63d0\u51fa IFHierBench\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u5c42\u7ea7\u6307\u4ee4\u9075\u5faa\u80fd\u529b\u7684\u57fa\u51c6\uff0c\u5305\u542b600\u4e2a\u63d0\u793a\u30014\u79cd\u7ea6\u675f\u6811\u6df1\u5ea6\u548c35\u7c7b\u7ea6\u675f\u3002\u6bcf\u4e2a\u6837\u672c\u914d\u6709\u786e\u5b9a\u6027\u68c0\u67e5\u5668\uff0c\u53ef\u5728\u6574\u4f53\u3001\u7ae0\u8282\u548c\u5d4c\u5957\u5b57\u6bb5\u7b49\u4e0d\u540c\u4f5c\u7528\u57df\u9a8c\u8bc1\u7ea6\u675f\u662f\u5426\u6ee1\u8db3\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27912", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u533a\u522b\u4e8e\u5c06\u6240\u6709\u7ea6\u675f\u6241\u5e73\u5316\u8bc4\u6d4b\u7684\u73b0\u6709\u57fa\u51c6\uff0cIFHierBench \u80fd\u68c0\u67e5\u7279\u5b9a\u8f93\u51fa\u533a\u57df\u5185\u7684\u5c40\u90e8\u7ea6\u675f\u9075\u5faa\u60c5\u51b5", "\u8bc4\u6d4b7\u4e2a\u4e3b\u6d41\u95ed\u6e90\u4e0e\u5f00\u6e90\u6a21\u578b\uff0c\u6700\u5f3a\u6a21\u578b\u7684\u63d0\u793a\u7ea7\u51c6\u786e\u7387\u4e5f\u4ec5\u7565\u9ad8\u4e8e50%", "\u968f\u7740\u7ea6\u675f\u5c42\u7ea7\u52a0\u6df1\uff0c\u6a21\u578b\u51c6\u786e\u7387\u663e\u8457\u4e0b\u964d\uff0c\u66b4\u9732\u51fa\u5d4c\u5957\u7ea6\u675f\u5904\u7406\u80fd\u529b\u4e0d\u8db3"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6307\u4ee4\u9075\u5faa", "\u6a21\u578b\u8bc4\u6d4b", "\u7ed3\u6784\u5316\u8f93\u51fa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27912v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "IFHierBench: Hierarchical Instruction Following for Large Language Models", "tldr": "\u5c42\u7ea7\u6307\u4ee4\u9075\u5faa\u4ecd\u662f\u5927\u6a21\u578b\u77ed\u677f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa IFHierBench\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u5c42\u7ea7\u6307\u4ee4\u9075\u5faa\u80fd\u529b\u7684\u57fa\u51c6\uff0c\u5305\u542b600\u4e2a\u63d0\u793a\u30014\u79cd\u7ea6\u675f\u6811\u6df1\u5ea6\u548c35\u7c7b\u7ea6\u675f\u3002\u6bcf\u4e2a\u6837\u672c\u914d\u6709\u786e\u5b9a\u6027\u68c0\u67e5\u5668\uff0c\u53ef\u5728\u6574\u4f53\u3001\u7ae0\u8282\u548c\u5d4c\u5957\u5b57\u6bb5\u7b49\u4e0d\u540c\u4f5c\u7528\u57df\u9a8c\u8bc1\u7ea6\u675f\u662f\u5426\u6ee1\u8db3\u3002", "why_notable": "\u8be5\u57fa\u51c6\u66f4\u8d34\u8fd1\u771f\u5b9e\u5e94\u7528\u4e2d\u4e00\u6b21\u8c03\u7528\u751f\u6210\u590d\u6742\u7ed3\u6784\u5316\u4ea7\u7269\u7684\u573a\u666f\uff0c\u63ed\u793a\u5f53\u524d\u5927\u6a21\u578b\u5728\u7ec6\u7c92\u5ea6\u3001\u5206\u5c42\u7ea6\u675f\u9075\u5faa\u4e0a\u7684\u7cfb\u7edf\u6027\u7f3a\u9677\uff0c\u53ef\u63a8\u52a8\u66f4\u7cbe\u7ec6\u7684\u6307\u4ee4\u9075\u5faa\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u65b9\u6cd5\u3002"}, {"abstract": "Many algorithms spend an internal resource before returning a decision and are evaluated only by the quality of that terminal output. We formalize such procedures as terminal computation-allocation problems: costly computations produce observations, update beliefs about a latent environment, and matter only through terminal decision loss. Bellman equations characterize optimal allocation under fixed budgets, priced computation, and exact certification. We then relate value of computation (VOC) to information. Mutual information equals myopic VOC under log loss, whereas under simple regret VOC is a knowledge-gradient quantity; moreover, information gain can rank computations arbitrarily poorly, although it gives a one-sided upper bound on VOC. Bandit pulls, tree simulations, and node expansions illustrate the same model under different computation topologies. Finally, under an explicit frontier-resolution and heuristic-error model, maximizing approximate VOC recovers weighted A*, with A* and greedy best-first search as limiting cases. The theory identifies a shared decision problem without asserting that one acquisition rule is universally optimal.", "arxiv_id": "2607.27871", "arxiv_url": "https://arxiv.org/abs/2607.27871", "authors": ["Alexander Tuisov"], "brief": "\u8bba\u6587\u5c06\u641c\u7d22\u3001\u4eff\u771f\u3001\u8282\u70b9\u6269\u5c55\u7b49\u8fc7\u7a0b\u5f62\u5f0f\u5316\u4e3a\u201c\u7ec8\u7aef\u8ba1\u7b97\u5206\u914d\u201d\u95ee\u9898\uff1a\u8ba1\u7b97\u6709\u6210\u672c\u3001\u4ea7\u751f\u89c2\u6d4b\u5e76\u66f4\u65b0\u4fe1\u5ff5\uff0c\u6700\u7ec8\u53ea\u901a\u8fc7\u51b3\u7b56\u635f\u5931\u6765\u8bc4\u4ef7\u3002\u4f5c\u8005\u7528 Bellman \u65b9\u7a0b\u523b\u753b\u4e0d\u540c\u9884\u7b97\u4e0e\u8ba1\u7b97\u5b9a\u4ef7\u4e0b\u7684\u6700\u4f18\u5206\u914d\uff0c\u5e76\u5206\u6790\u8ba1\u7b97\u4ef7\u503c\u4e0e\u4fe1\u606f\u589e\u76ca\u7684\u5173\u7cfb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27871", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u7ec8\u7aef\u8ba1\u7b97\u5206\u914d\u6846\u67b6\uff0c\u7edf\u4e00\u63cf\u8ff0\u56fa\u5b9a\u9884\u7b97\u3001\u4ed8\u8d39\u8ba1\u7b97\u4e0e\u7cbe\u786e\u8ba4\u8bc1\u7b49\u8bbe\u7f6e\u4e0b\u7684\u641c\u7d22\u51b3\u7b56", "\u8bc1\u660e\u5728 log loss \u4e0b\u4e92\u4fe1\u606f\u7b49\u4e8e\u77ed\u89c6\u8ba1\u7b97\u4ef7\u503c\uff1b\u5728 simple regret \u4e0b\u8ba1\u7b97\u4ef7\u503c\u5bf9\u5e94 knowledge-gradient", "\u6307\u51fa\u4fe1\u606f\u589e\u76ca\u53ef\u80fd\u4efb\u610f\u9519\u8bef\u5730\u6392\u5e8f\u8ba1\u7b97\u9009\u62e9\uff0c\u4f46\u53ef\u4f5c\u4e3a\u8ba1\u7b97\u4ef7\u503c\u7684\u5355\u4fa7\u4e0a\u754c", "\u5728\u524d\u6cbf\u5206\u8fa8\u7387\u4e0e\u542f\u53d1\u5f0f\u8bef\u5dee\u6a21\u578b\u4e0b\uff0c\u8fd1\u4f3c\u6700\u5927\u5316 VOC \u53ef\u63a8\u51fa weighted A*\uff0cA* \u4e0e\u8d2a\u5fc3\u6700\u4f73\u4f18\u5148\u641c\u7d22\u662f\u6781\u9650\u60c5\u5f62"], "keywords": ["\u641c\u7d22\u7b97\u6cd5", "\u51b3\u7b56\u7406\u8bba", "\u4fe1\u606f\u8bba", "\u542f\u53d1\u5f0f\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27871v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Search as Computation Allocation", "tldr": "\u628a\u641c\u7d22\u7edf\u4e00\u4e3a\u7ec8\u7aef\u8ba1\u7b97\u8d44\u6e90\u5206\u914d\u95ee\u9898", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u641c\u7d22\u3001\u4eff\u771f\u3001\u8282\u70b9\u6269\u5c55\u7b49\u8fc7\u7a0b\u5f62\u5f0f\u5316\u4e3a\u201c\u7ec8\u7aef\u8ba1\u7b97\u5206\u914d\u201d\u95ee\u9898\uff1a\u8ba1\u7b97\u6709\u6210\u672c\u3001\u4ea7\u751f\u89c2\u6d4b\u5e76\u66f4\u65b0\u4fe1\u5ff5\uff0c\u6700\u7ec8\u53ea\u901a\u8fc7\u51b3\u7b56\u635f\u5931\u6765\u8bc4\u4ef7\u3002\u4f5c\u8005\u7528 Bellman \u65b9\u7a0b\u523b\u753b\u4e0d\u540c\u9884\u7b97\u4e0e\u8ba1\u7b97\u5b9a\u4ef7\u4e0b\u7684\u6700\u4f18\u5206\u914d\uff0c\u5e76\u5206\u6790\u8ba1\u7b97\u4ef7\u503c\u4e0e\u4fe1\u606f\u589e\u76ca\u7684\u5173\u7cfb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u641c\u7d22\u7b97\u6cd5\u63d0\u4f9b\u4e86\u7edf\u4e00\u7684\u51b3\u7b56\u8bba\u89e3\u91ca\uff0c\u6f84\u6e05\u4e86\u4fe1\u606f\u589e\u76ca\u4e0e\u5b9e\u9645\u51b3\u7b56\u6536\u76ca\u4e4b\u95f4\u7684\u5dee\u5f02\uff0c\u5e76\u628a\u7ecf\u5178\u542f\u53d1\u5f0f\u641c\u7d22\u7b97\u6cd5\u7eb3\u5165\u8ba1\u7b97\u4ef7\u503c\u6700\u5927\u5316\u89c6\u89d2\uff0c\u5bf9\u7b97\u6cd5\u8bbe\u8ba1\u4e0e\u7406\u8bba\u5206\u6790\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "A single reinforcement-learning run can produce a strong reasoner yet an incomplete teacher: it often amplifies only a subset of the valid solution modes. We argue that reinforcement learning (RL)-trained policies should therefore be viewed as local probes of a multi-basin reasoning solution manifold, rather than as globally reliable supervisors. Based on this view, we propose an expand-then-compress framework that couples teacher construction with multi-teacher policy distillation. In the expansion stage, Residual Group Relative Policy Optimization (RGRPO) trains a sequence of teachers from a common initialization and redirects each later round toward examples not yet covered by the accumulated teacher union. In the compression stage, reliability-gated Teacher-Union On-policy Distillation (TU-OPD) lets the student learn from its own response prefixes. For each example, only reliable teachers contribute, and their sampled-token OPD losses are weighted by their per-example quality. We further introduce Consensus-Residual Decomposition, which preserves a winner teacher\u0027s excess token preferences over its reliable peers, preventing specialist behavior from being suppressed during teacher aggregation. Experiments on mathematical reasoning, code generation, and instruction following show that the resulting Qwen3-1.7B student consistently outperforms the strongest individual teacher across all three domains, yielding relative improvements of 2.0%, 8.3%, and 6.9%, respectively, while retaining single-model inference. These results establish a simple but powerful principle: stronger students can be obtained not by selecting a single better teacher, but by deliberately constructing and compressing a complementary teacher union.", "arxiv_id": "2607.27770", "arxiv_url": "https://arxiv.org/abs/2607.27770", "authors": ["Songshuo Lu", "Zhi Chen", "Yaohua Tang"], "brief": "\u8bba\u6587\u5c06RL\u8bad\u7ec3\u51fa\u7684\u63a8\u7406\u7b56\u7565\u89c6\u4e3a\u8986\u76d6\u591a\u5cf0\u89e3\u7a7a\u95f4\u7684\u5c40\u90e8\u63a2\u9488\uff0c\u800c\u975e\u5168\u5c40\u6700\u4f18\u6559\u5e08\u3002\u63d0\u51fa\u201c\u6269\u5c55-\u538b\u7f29\u201d\u6846\u67b6\uff1a\u5148\u6784\u5efa\u4e92\u8865\u6559\u5e08\u96c6\u5408\uff0c\u518d\u5c06\u5176\u53ef\u9760\u77e5\u8bc6\u84b8\u998f\u5230\u5355\u4e2a\u5b66\u751f\u6a21\u578b\u4e2d\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27770", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6269\u5c55\u9636\u6bb5\u4f7f\u7528RGRPO\u4ece\u540c\u4e00\u521d\u59cb\u5316\u8bad\u7ec3\u591a\u8f6e\u6559\u5e08\uff0c\u5e76\u5f15\u5bfc\u540e\u7eed\u6559\u5e08\u8986\u76d6\u6b64\u524d\u6559\u5e08\u672a\u89e3\u51b3\u7684\u6837\u672c\u3002", "\u538b\u7f29\u9636\u6bb5\u63d0\u51faTU-OPD\uff0c\u8ba9\u5b66\u751f\u57fa\u4e8e\u81ea\u8eab\u751f\u6210\u524d\u7f00\u8fdb\u884c\u5728\u7b56\u7565\u84b8\u998f\uff0c\u5e76\u6309\u6559\u5e08\u5728\u5355\u6837\u672c\u4e0a\u7684\u53ef\u9760\u6027\u548c\u8d28\u91cf\u52a0\u6743\u5b66\u4e60\u3002", "\u5f15\u5165Consensus-Residual Decomposition\uff0c\u4fdd\u7559\u4e13\u5bb6\u6559\u5e08\u76f8\u5bf9\u5176\u4ed6\u53ef\u9760\u6559\u5e08\u7684\u989d\u5916token\u504f\u597d\uff0c\u907f\u514d\u805a\u5408\u65f6\u62b9\u5e73\u7279\u5316\u80fd\u529b\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u63a8\u7406\u6a21\u578b", "\u591a\u6559\u5e08\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27770v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond the Best Teacher: Expanding and Compressing the Reasoning Solution Manifold", "tldr": "\u591a\u6559\u5e08\u6269\u5c55\u518d\u84b8\u998f\uff0c\u5b66\u751f\u8d85\u8d8a\u6700\u5f3a\u6559\u5e08", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06RL\u8bad\u7ec3\u51fa\u7684\u63a8\u7406\u7b56\u7565\u89c6\u4e3a\u8986\u76d6\u591a\u5cf0\u89e3\u7a7a\u95f4\u7684\u5c40\u90e8\u63a2\u9488\uff0c\u800c\u975e\u5168\u5c40\u6700\u4f18\u6559\u5e08\u3002\u63d0\u51fa\u201c\u6269\u5c55-\u538b\u7f29\u201d\u6846\u67b6\uff1a\u5148\u6784\u5efa\u4e92\u8865\u6559\u5e08\u96c6\u5408\uff0c\u518d\u5c06\u5176\u53ef\u9760\u77e5\u8bc6\u84b8\u998f\u5230\u5355\u4e2a\u5b66\u751f\u6a21\u578b\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u201c\u9009\u62e9\u6700\u5f3a\u6559\u5e08\u5373\u53ef\u201d\u7684\u84b8\u998f\u8303\u5f0f\uff0c\u8bc1\u660e\u6709\u610f\u6784\u5efa\u4e92\u8865\u6559\u5e08\u8054\u76df\u5e76\u538b\u7f29\u5230\u5355\u6a21\u578b\u4e2d\uff0c\u53ef\u5728\u6570\u5b66\u63a8\u7406\u3001\u4ee3\u7801\u751f\u6210\u548c\u6307\u4ee4\u8ddf\u968f\u4e0a\u7a33\u5b9a\u8d85\u8d8a\u6700\u5f3a\u5355\u6559\u5e08\uff0c\u540c\u65f6\u4fdd\u6301\u5355\u6a21\u578b\u63a8\u7406\u6210\u672c\u3002"}, {"abstract": "Modern deep learning typically keeps the batch size static throughout training, thus overlooking the joint effect of learning rate and batch size on the training dynamics. In this paper, we study the deep learning dynamics through the lens of convex optimization and derive a joint characterization of loss in terms of both schedules, applicable to general optimizers and model architectures. This characterization yields a closed-form optimal batch size schedule for any prescribed learning rate schedule, and further leads to joint scaling laws that consistently outperform static batch size baselines, highlighting the significance of dynamic batch size schedule in large language model training.", "arxiv_id": "2607.27731", "arxiv_url": "https://arxiv.org/abs/2607.27731", "authors": ["Jiaxiang Li", "Zhiqi Bu", "Shiyun Xu"], "brief": "\u8bba\u6587\u4ece\u51f8\u4f18\u5316\u89c6\u89d2\u523b\u753b\u6df1\u5ea6\u5b66\u4e60\u8bad\u7ec3\u52a8\u6001\uff0c\u7ed9\u51fa\u635f\u5931\u5173\u4e8e\u5b66\u4e60\u7387\u8ba1\u5212\u548c\u6279\u5927\u5c0f\u8ba1\u5212\u7684\u8054\u5408\u8868\u8fbe\u3002\u57fa\u4e8e\u8be5\u8868\u8fbe\uff0c\u63a8\u5bfc\u51fa\u4efb\u610f\u7ed9\u5b9a\u5b66\u4e60\u7387\u8ba1\u5212\u4e0b\u7684\u95ed\u5f0f\u6700\u4f18\u6279\u5927\u5c0f\u8c03\u5ea6\uff0c\u5e76\u5f62\u6210\u8054\u5408\u7f29\u653e\u89c4\u5f8b\u3002", "categories": ["cs.LG", "cs.AI", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27731", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u518d\u5047\u8bbe\u8bad\u7ec3\u5168\u7a0b\u9759\u6001\u6279\u5927\u5c0f\uff0c\u800c\u662f\u663e\u5f0f\u5efa\u6a21\u5b66\u4e60\u7387\u4e0e\u6279\u5927\u5c0f\u5bf9\u8bad\u7ec3\u635f\u5931\u7684\u5171\u540c\u5f71\u54cd", "\u7406\u8bba\u6846\u67b6\u9002\u7528\u4e8e\u4e00\u822c\u4f18\u5316\u5668\u548c\u6a21\u578b\u67b6\u6784\uff0c\u5e76\u7ed9\u51fa\u95ed\u5f0f\u6700\u4f18\u6279\u5927\u5c0f schedule", "\u5b9e\u9a8c\u8868\u660e\u52a8\u6001\u6279\u5927\u5c0f\u8c03\u5ea6\u5728\u5927\u8bed\u8a00\u6a21\u578b\u8bad\u7ec3\u4e2d\u7a33\u5b9a\u4f18\u4e8e\u9759\u6001\u6279\u5927\u5c0f\u57fa\u7ebf"], "keywords": ["\u7f29\u653e\u89c4\u5f8b", "\u4f18\u5316\u7406\u8bba", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bad\u7ec3\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27731v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Towards joint scaling laws with optimal batch size schedules", "tldr": "\u63d0\u51fa\u5b66\u4e60\u7387\u4e0e\u6279\u5927\u5c0f\u8054\u5408\u7f29\u653e\u89c4\u5f8b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ece\u51f8\u4f18\u5316\u89c6\u89d2\u523b\u753b\u6df1\u5ea6\u5b66\u4e60\u8bad\u7ec3\u52a8\u6001\uff0c\u7ed9\u51fa\u635f\u5931\u5173\u4e8e\u5b66\u4e60\u7387\u8ba1\u5212\u548c\u6279\u5927\u5c0f\u8ba1\u5212\u7684\u8054\u5408\u8868\u8fbe\u3002\u57fa\u4e8e\u8be5\u8868\u8fbe\uff0c\u63a8\u5bfc\u51fa\u4efb\u610f\u7ed9\u5b9a\u5b66\u4e60\u7387\u8ba1\u5212\u4e0b\u7684\u95ed\u5f0f\u6700\u4f18\u6279\u5927\u5c0f\u8c03\u5ea6\uff0c\u5e76\u5f62\u6210\u8054\u5408\u7f29\u653e\u89c4\u5f8b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u6279\u5927\u5c0f\u4ece\u56fa\u5b9a\u8d85\u53c2\u6570\u63d0\u5347\u4e3a\u53ef\u4f18\u5316\u7684\u8bad\u7ec3\u8c03\u5ea6\u53d8\u91cf\uff0c\u4e3a\u5927\u6a21\u578b\u8bad\u7ec3\u7684\u7b97\u529b\u6548\u7387\u548c\u7f29\u653e\u89c4\u5f8b\u7814\u7a76\u63d0\u4f9b\u4e86\u65b0\u7684\u7406\u8bba\u4e0e\u5b9e\u8df5\u4f9d\u636e\u3002"}, {"abstract": "Top-$K$ sparse attention reduces the cost of Softmax and value aggregation by attending to only a small subset of key--value (KV) entries. However, identifying this subset still requires scoring the current query against the full KV cache and performing global Top-$K$ selection, leaving selector cost linear in context length and limiting the practical efficiency of sparse attention for long-context decoding. In this paper, we introduce ReTopK, a training-free method that accelerates dynamic Top-$K$ attention by reusing historical retrieval decisions. ReTopK builds on the observation that similar queries often attend to overlapping supports and that partially overlapping supports can still preserve most of the Exact Top-$K$ attention mass. For each attention head, it maintains a bounded cache of historical query--support pairs, retrieves the most similar cached queries for each new query, unions their stored supports with a recent window, and reranks only the resulting compact candidate set using exact current-query scores. A similarity-based fallback invokes full-history Exact Top-$K$ when reuse is unreliable, while periodic exact refreshes limit cache drift. ReTopK retains the complete KV cache and reuses only selected indices, rather than historical scores, attention weights, or outputs. Across 16K--128K contexts, ReTopK achieves the lowest PG19 perplexity and the highest NIAH and LongBench scores among the evaluated approximate methods. At 128K with $K=512$, ReTopK incurs only a 0.50\\% perplexity increase over Exact Top-$K$ while accelerating attention computation by $3.07\\times$.", "arxiv_id": "2607.27692", "arxiv_url": "https://arxiv.org/abs/2607.27692", "authors": ["Wenshuai Yao", "Wenyong Zhou", "Hanyong Shao", "Yizhe Chen", "Zhiyuan Ning", "Yuannuo Feng", "Ru Huang", "Kechao Tang"], "brief": "\u8bba\u6587\u63d0\u51fa ReTopK\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u52a8\u6001 Top-K \u7a00\u758f\u6ce8\u610f\u529b\u52a0\u901f\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u68c0\u7d22\u76f8\u4f3c\u5386\u53f2 query \u7684\u6ce8\u610f\u529b\u652f\u6301\u96c6\u5408\uff0c\u5408\u5e76\u8fd1\u671f\u7a97\u53e3\u540e\u53ea\u5728\u5c0f\u5019\u9009\u96c6\u4e0a\u7cbe\u786e\u91cd\u6392\uff0c\u4ece\u800c\u907f\u514d\u6bcf\u6b65\u626b\u63cf\u5b8c\u6574 KV \u7f13\u5b58\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27692", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u7ef4\u62a4\u6709\u754c\u7684\u5386\u53f2 query-support \u7f13\u5b58\uff0c\u5229\u7528\u76f8\u4f3c query \u5f80\u5f80\u5173\u6ce8\u91cd\u53e0 KV \u4f4d\u7f6e\u7684\u73b0\u8c61\u590d\u7528\u5386\u53f2\u68c0\u7d22\u7ed3\u679c", "\u5019\u9009\u96c6\u5408\u7531\u76f8\u4f3c\u5386\u53f2\u652f\u6301\u96c6\u5408\u4e0e\u6700\u8fd1\u7a97\u53e3\u5e76\u96c6\u7ec4\u6210\uff0c\u4ec5\u5bf9\u8be5\u7d27\u51d1\u96c6\u5408\u8ba1\u7b97\u5f53\u524d query \u7684\u7cbe\u786e\u5206\u6570\u5e76\u91cd\u6392", "\u5f15\u5165\u76f8\u4f3c\u5ea6\u56de\u9000\u4e0e\u5468\u671f\u6027\u7cbe\u786e\u5237\u65b0\u673a\u5236\uff0c\u5728\u590d\u7528\u4e0d\u53ef\u9760\u65f6\u6267\u884c\u5b8c\u6574 Exact Top-K\uff0c\u51cf\u5c11\u7f13\u5b58\u6f02\u79fb"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u7a00\u758f\u6ce8\u610f\u529b", "\u63a8\u7406\u52a0\u901f", "KV\u7f13\u5b58"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27692v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Recall Before You Rank: Similarity-Guided Top-$K$ Reuse for Efficient Long-Context Attention", "tldr": "\u590d\u7528\u5386\u53f2Top-K\u7d22\u5f15\u52a0\u901f\u957f\u4e0a\u4e0b\u6587\u6ce8\u610f\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ReTopK\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u52a8\u6001 Top-K \u7a00\u758f\u6ce8\u610f\u529b\u52a0\u901f\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u68c0\u7d22\u76f8\u4f3c\u5386\u53f2 query \u7684\u6ce8\u610f\u529b\u652f\u6301\u96c6\u5408\uff0c\u5408\u5e76\u8fd1\u671f\u7a97\u53e3\u540e\u53ea\u5728\u5c0f\u5019\u9009\u96c6\u4e0a\u7cbe\u786e\u91cd\u6392\uff0c\u4ece\u800c\u907f\u514d\u6bcf\u6b65\u626b\u63cf\u5b8c\u6574 KV \u7f13\u5b58\u3002", "why_notable": "ReTopK \u4fdd\u7559\u5b8c\u6574 KV \u7f13\u5b58\u4f46\u590d\u7528\u7d22\u5f15\u51b3\u7b56\uff0c\u5728\u957f\u4e0a\u4e0b\u6587\u89e3\u7801\u4e2d\u663e\u8457\u964d\u4f4e Top-K \u9009\u62e9\u6210\u672c\uff1b\u5728 16K\u2013128K \u4e0a\u4f18\u4e8e\u5176\u4ed6\u8fd1\u4f3c\u65b9\u6cd5\uff0c128K\u3001K=512 \u65f6\u56f0\u60d1\u5ea6\u4ec5\u6bd4 Exact Top-K \u9ad8 0.50%\uff0c\u6ce8\u610f\u529b\u8ba1\u7b97\u52a0\u901f 3.07 \u500d\u3002"}, {"abstract": "Looped Transformers create a useful train- and test-time compute axis by reusing the same Transformer block over recurrent depth, increasing effective depth at a fixed parameter count. However, that shared block must then govern an entire trajectory of varying hidden states over trained and extrapolated depths. Furthermore, in additive-injection looped Transformers, an input-conditioned signal is reintroduced at every recurrent step, so applying the shared transition at an input-conditioned reference can still move the hidden state. In this paper, we propose Source-Centered State Evolution (SCSE), which is designed to reconcile input conditioning with reference-preserving shared recurrence. Specifically, SCSE retains input dependence through its learned anchor and initial deviation, allows nonzero deviations to drive recurrent computation while mapping zero deviation to zero, and guarantees exact anchor invariance through its zero-deviation mask. The designated anchor is thereby a one-step fixed point by construction. The zero-deviation forcing bias is the next deviation produced from the anchor itself and vanishes in SCSE, while nonzero deviations remain active and support state-dependent recurrent computation. Our theory shows that the zero-deviation forcing bias is a design degree of freedom whose task effect can be harmful, neutral, or beneficial; SCSE resolves this choice in favor of exact anchor invariance by setting the bias to zero. Across WikiText-2, WikiText-103, direct web-corpus pretraining, held-out web-text transfer, and LAMBADA completion, SCSE improves the controlled recurrent quality frontier. Ablation studies identify the learned anchor and the anchor-coordinate deviation recurrence as the primary contributors to the gain, and a trained-model case study grounds the anchor-response diagnostic in observed recurrent motion.", "arxiv_id": "2607.27656", "arxiv_url": "https://arxiv.org/abs/2607.27656", "authors": ["Bum Jun Kim", "Kohei Hayashi", "Shunsuke Kamiya", "Masanori Koyama", "Yusuke Iwasawa", "Yutaka Matsuo"], "brief": "\u672c\u6587\u63d0\u51fa Source-Centered State Evolution\uff08SCSE\uff09\uff0c\u7528\u4e8e\u5faa\u73af Transformer \u4e2d\u5171\u4eab\u6a21\u5757\u7684\u9012\u5f52\u72b6\u6001\u66f4\u65b0\u3002\u5b83\u901a\u8fc7\u5b66\u4e60\u951a\u70b9\u4e0e\u504f\u5dee\u5750\u6807\u9012\u5f52\uff0c\u5728\u4fdd\u7559\u8f93\u5165\u6761\u4ef6\u4fe1\u606f\u7684\u540c\u65f6\u4fdd\u8bc1\u951a\u70b9\u4e25\u683c\u4e0d\u53d8\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27656", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["SCSE \u5c06\u9690\u85cf\u72b6\u6001\u8868\u793a\u4e3a\u76f8\u5bf9\u8f93\u5165\u4f9d\u8d56\u951a\u70b9\u7684\u504f\u5dee\uff0c\u5e76\u5f3a\u5236\u96f6\u504f\u5dee\u6620\u5c04\u4e3a\u96f6\uff0c\u4ece\u800c\u8ba9\u951a\u70b9\u6210\u4e3a\u4e00\u9636\u56fa\u5b9a\u70b9", "\u7406\u8bba\u5206\u6790\u6307\u51fa\u96f6\u504f\u5dee forcing bias \u662f\u4e00\u4e2a\u8bbe\u8ba1\u81ea\u7531\u5ea6\uff0c\u53ef\u80fd\u6709\u5bb3\u3001\u4e2d\u6027\u6216\u6709\u76ca\uff1bSCSE \u9009\u62e9\u5c06\u5176\u7f6e\u96f6\u4ee5\u83b7\u5f97\u7cbe\u786e\u951a\u70b9\u4e0d\u53d8\u6027", "\u5728 WikiText-2\u3001WikiText-103\u3001\u7f51\u9875\u8bed\u6599\u9884\u8bad\u7ec3\u3001\u8de8\u7f51\u9875\u6587\u672c\u8fc1\u79fb\u548c LAMBADA \u5b8c\u5f62\u4efb\u52a1\u4e0a\u63d0\u5347\u5faa\u73af\u8ba1\u7b97\u8d28\u91cf\u524d\u6cbf"], "keywords": ["\u5faa\u73afTransformer", "\u8bed\u8a00\u6a21\u578b", "\u72b6\u6001\u7a7a\u95f4", "\u63a8\u7406\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27656v1", "published_at": "2026-07-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Looped Transformers with Source-Centered State Evolution", "tldr": "SCSE\u6539\u8fdb\u5faa\u73afTransformer\u7684\u72b6\u6001\u6f14\u5316", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Source-Centered State Evolution\uff08SCSE\uff09\uff0c\u7528\u4e8e\u5faa\u73af Transformer \u4e2d\u5171\u4eab\u6a21\u5757\u7684\u9012\u5f52\u72b6\u6001\u66f4\u65b0\u3002\u5b83\u901a\u8fc7\u5b66\u4e60\u951a\u70b9\u4e0e\u504f\u5dee\u5750\u6807\u9012\u5f52\uff0c\u5728\u4fdd\u7559\u8f93\u5165\u6761\u4ef6\u4fe1\u606f\u7684\u540c\u65f6\u4fdd\u8bc1\u951a\u70b9\u4e25\u683c\u4e0d\u53d8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u5faa\u73af Transformer \u5728\u8bad\u7ec3/\u63a8\u7406\u6df1\u5ea6\u5916\u63a8\u65f6\u72b6\u6001\u8f68\u8ff9\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u4e86\u7ed3\u6784\u6027\u7ea6\u675f\u800c\u975e\u5355\u7eaf\u6269\u53c2\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u56fa\u5b9a\u53c2\u6570\u91cf\u4e0b\u7684\u53ef\u6269\u5c55\u8ba1\u7b97\u80fd\u529b\u3002"}, {"abstract": "Speculative decoding alleviates the memory-bandwidth bottleneck in large language model inference, but its acceleration is jointly constrained by drafting overhead, token acceptance, and speculation length. We present a unified efficiency analysis showing that extending the speculation horizon can reduce rather than improve speedup when the marginal acceptance probability falls below the relative drafting cost. Guided by this analysis, we introduce SparseSpec-L, a training-free self-speculative decoding framework for long-context inference. SparseSpec-L generates lightweight drafts directly from the target model using a dynamically sparsified and recallable KV cache. It recycles per-head attention statistics produced during full-context verification as a no-extra-forward importance signal, allowing critical historical tokens to be recalled without permanently discarding the dense KV cache. An online entropy-based controller further selects the speculation length according to expected step-wise efficiency. Experiments across multiple long-context tasks and model scales show consistent end-to-end acceleration, with up to speedup over autoregressive decoding while preserving the target model\u0027s output distribution.", "arxiv_id": "2607.27735", "arxiv_url": "https://arxiv.org/abs/2607.27735", "authors": ["Yuesong Liu", "Yuan Zeng", "Min Lyu", "Ruilin Liu", "Yu Guo", "Yinlong Xu"], "brief": "\u8bba\u6587\u63d0\u51fa SparseSpec-L\uff0c\u4e00\u79cd\u9762\u5411\u957f\u4e0a\u4e0b\u6587\u5927\u6a21\u578b
