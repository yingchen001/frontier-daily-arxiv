 Our analyses attribute these gains to organizing and exploring semantic evidence regions, which improves groundedness and diversity and yields more useful findings under the same subquestion budget. These results demonstrate the value of structured semantic exploration for systematic research and discovery over heterogeneous data lakes.", "arxiv_id": "2607.27726", "arxiv_url": "https://arxiv.org/abs/2607.27726", "authors": ["Dhruv Agarwal", "Rishitha Guttapalle Mohan", "Aarti Kumari", "Ashi Sinha", "Athulya Anil", "Kavitha Srinivas", "Horst Samulowitz", "Andrew McCallum"], "brief": "Baikal \u5c06\u6570\u636e\u6e56\u4e0a\u7684\u6df1\u5ea6\u7814\u7a76\u5efa\u6a21\u4e3a\u9884\u7b97\u53d7\u9650\u641c\u7d22\uff1a\u5148\u628a\u5f02\u6784\u8868\u683c\u548c\u6587\u672c\u8bc1\u636e\u805a\u6210\u8bed\u4e49\u533a\u57df\uff0c\u518d\u5728\u533a\u57df\u95f4\u81ea\u9002\u5e94\u5e73\u8861\u63a2\u7d22\u4e0e\u5229\u7528\uff0c\u5e76\u751f\u6210\u533a\u57df\u76f8\u5173\u5b50\u95ee\u9898\u8fdb\u884c\u8c03\u67e5\u3002\u76f8\u6bd4 DeepSearcher \u7b49\u5f3a\u57fa\u7ebf\uff0c\u5728 HybridQA \u548c TAT-QA \u6570\u636e\u6e56\u4e0a\u62a5\u544a\u8bc4\u5206\u5206\u522b\u63d0\u5347 28% \u548c 36%\uff0c\u4e3b\u8981\u6539\u5584\u4e86\u8bc1\u636e\u624e\u6839\u6027\u3001\u591a\u6837\u6027\u548c\u5b9e\u7528\u6027\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27726", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u6570\u636e\u6e56", "\u8bed\u4e49\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27726v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Baikal: Structured Search for Deep Research over Data Lakes", "tldr": "Baikal \u5c06\u6570\u636e\u6e56\u4e0a\u7684\u6df1\u5ea6\u7814\u7a76\u5efa\u6a21\u4e3a\u9884\u7b97\u53d7\u9650\u641c\u7d22\uff1a\u5148\u628a\u5f02\u6784\u8868\u683c\u548c\u6587\u672c\u8bc1\u636e\u805a\u6210\u8bed\u4e49\u533a\u57df\uff0c\u518d\u5728\u533a\u57df\u95f4\u81ea\u9002\u5e94\u5e73\u8861\u63a2\u7d22\u4e0e\u5229\u7528\uff0c\u5e76\u751f\u6210\u533a\u57df\u76f8\u5173\u5b50\u95ee\u9898\u8fdb\u884c\u8c03\u67e5\u3002\u76f8\u6bd4 DeepSearcher \u7b49\u5f3a\u57fa\u7ebf\uff0c\u5728 HybridQA \u548c TAT-QA \u6570\u636e\u6e56\u4e0a\u62a5\u544a\u8bc4\u5206\u5206\u522b\u63d0\u5347 28% \u548c 36%\uff0c\u4e3b\u8981\u6539\u5584\u4e86\u8bc1\u636e\u624e\u6839\u6027\u3001\u591a\u6837\u6027\u548c\u5b9e\u7528\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models can contribute useful ideas to mathematical research, yet long-horizon proof attempts remain difficult to coordinate, evaluate, and reproduce. We present Albilich, an open-source agentic harness for autoresearch in mathematics that combines long-horizon reasoning, computer algebra systems (CAS), literature retrieval, and persistent SQLite-based context management. We evaluate Albilich on the RealMath benchmark (Zhang et al. 2025) and on open problems in group theory from the Kourovka Notebook (Khukhro and Mazurov 2026). It solved 10/10 problems on RealMath with CAS and 9/10 with no CAS. On the Kourovka problems, Albilich produced a counterexample to Problem 21.142 and a proof of a strengthening of Problem20.2. Anablation on Problem 17.91 demonstrates 32.0% token reduction when CAS is enabled. An ablation on Problem 21.142 demonstrates higher verifier-rejection rate and failure to synthesize proof routes in the absence of the advisor agent. These results support Albilich as a human-steerable, CAS-boosted environment for scalable AI-assisted mathematical research.", "arxiv_id": "2607.27705", "arxiv_url": "https://arxiv.org/abs/2607.27705", "authors": ["Ting Gong", "Michael Ruofan Zeng", "Yong Yang"], "brief": "Albilich \u662f 316\u547d\u9898\u8bc1\u660e\uff1b\u6d88\u878d\u663e\u793a CAS \u53ef\u51cf\u5c11 32% token\uff0c\u987e\u95ee\u667a\u80fd\u4f53\u6709\u52a9\u4e8e\u751f\u6210\u53ef\u884c\u8bc1\u660e\u8def\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Practitioners accept a compressed language model once it clears a stack of data-cheap quality guards: perplexity within a small factor of the original, downstream accuracy (for example MMLU) inside a confidence interval, and data-free output-fidelity signals that compare the compressed and original network\u0027s internal representations under random probe inputs. This stack has a blind spot. Across three model families, gently-compressed models clear every guard and then invent procedure steps that were never in the instructions when they run a standard operating procedure (SOP) as an agent. The effect is operator-specific: coherent low-rank (SVD) truncation induces it, and magnitude pruning matched to the same perplexity does not. One dissociation isolates the cause. The same compressed weights that CI-win a paired output-fidelity test CI-fail the invented-step canary. The governing axis is the coherence of the compression error times its rate; the magnitude of the damage does not predict it. The data-free fidelity probe is a fidelity oracle by construction, so it cannot see this axis. We characterize the blindspot and dissociation with paired confidence intervals on a pre-registered, powered canary across three architectures. Operator-specificity replicates on all three, and the perplexity-guard evasion appears where the model admits in-guard low-rank headroom. We then give a data-free screen: a two-axis statistic of the compression error (coherent-fraction and error-rate) that flags the failing builds with fixed thresholds across architectures and matches the coherence-times-rate mechanism. Perplexity, MMLU, and fidelity acceptance do not certify agent safety. Screen gently-compressed low-rank builds before agentic deployment", "arxiv_id": "2607.28196", "arxiv_url": "https://arxiv.org/abs/2607.28196", "authors": ["I. Kennedy", "T. Kennedy"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u8f7b\u5ea6\u538b\u7f29\u540e\u7684 LLM \u5373\u4f7f\u901a\u8fc7\u56f0\u60d1\u5ea6\u3001MMLU \u548c\u65e0\u6570\u636e\u8f93\u51fa\u4fdd\u771f\u5ea6\u7b49\u5e38\u89c1\u8d28\u91cf\u68c0\u6d4b\uff0c\u4ecd\u53ef\u80fd\u5728\u4f5c\u4e3a\u667a\u80fd\u4f53\u6267\u884c\u6807\u51c6\u64cd\u4f5c\u6d41\u7a0b\u65f6\u51ed\u7a7a\u7f16\u9020\u6b65\u9aa4\u3002\u4f5c\u8005\u53d1\u73b0\u8be5\u95ee\u9898\u4e3b\u8981\u7531\u4f4e\u79e9 SVD \u622a\u65ad\u7684\u76f8\u5e72\u538b\u7f29\u8bef\u5dee\u5f15\u53d1\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u8bef\u5dee\u76f8\u5e72\u6bd4\u4f8b\u4e0e\u8bef\u5dee\u7387\u7684\u65e0\u6570\u636e\u7b5b\u67e5\u6307\u6807\uff0c\u53ef\u8de8\u67b6\u6784\u6807\u8bb0\u98ce\u9669\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28196", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28196v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Fidelity Is Not Safety: Gently-Compressed LLMs Pass Every Data-Free Quality Guard Yet Invent Procedure Steps in Agentic Execution", "tldr": "\u8bba\u6587\u6307\u51fa\uff0c\u8f7b\u5ea6\u538b\u7f29\u540e\u7684 LLM \u5373\u4f7f\u901a\u8fc7\u56f0\u60d1\u5ea6\u3001MMLU \u548c\u65e0\u6570\u636e\u8f93\u51fa\u4fdd\u771f\u5ea6\u7b49\u5e38\u89c1\u8d28\u91cf\u68c0\u6d4b\uff0c\u4ecd\u53ef\u80fd\u5728\u4f5c\u4e3a\u667a\u80fd\u4f53\u6267\u884c\u6807\u51c6\u64cd\u4f5c\u6d41\u7a0b\u65f6\u51ed\u7a7a\u7f16\u9020\u6b65\u9aa4\u3002\u4f5c\u8005\u53d1\u73b0\u8be5\u95ee\u9898\u4e3b\u8981\u7531\u4f4e\u79e9 SVD \u622a\u65ad\u7684\u76f8\u5e72\u538b\u7f29\u8bef\u5dee\u5f15\u53d1\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u8bef\u5dee\u76f8\u5e72\u6bd4\u4f8b\u4e0e\u8bef\u5dee\u7387\u7684\u65e0\u6570\u636e\u7b5b\u67e5\u6307\u6807\uff0c\u53ef\u8de8\u67b6\u6784\u6807\u8bb0\u98ce\u9669\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Computational approaches to intertextuality have advanced from string matching to neural retrieval, yet their outputs, similarity scores and parallel-passage lists, identify where texts reuse one another without characterizing how or why. We recast fine-grained intertextuality extraction as an agentic task in which a large language model (LLM) reads two text units in full and, through a constrained tool interface, must ground each proposed reuse in exact character spans on both sides and label it under a five-dimension typology of reuse (form, aspect, source-marking, function, stance). We validate the approach on an exhaustive comparison of the Analects with the Book of Han, where three domain experts adjudicate a pooled multi-model candidate set into a benchmark of 2,533 intertextual pairs. Against this standard we study twelve LLMs, reporting precision (56%-93%), a 51$\\times$ cost spread at comparable quality, and how well their confidence is calibrated. Expert agreement traces a reliability gradient: dimensions legible on the textual surface are annotated consistently, while those requiring inference of intent are contested, delimiting the claims such annotation supports. Scaling the validated extractor to the full Twenty-Four Histories (65,380 comparisons, 5,766 pairs) recovers corpus-level structure a similarity score cannot express. The interpretive composition of citation shows no systematic change across eighteen centuries, yet the same passage is quoted less and less literally. Stability in the aggregate with drift in the individual case is what a cultural-attraction account expects. We release the extraction protocol and the expert-adjudicated benchmark.", "arxiv_id": "2607.27595", "arxiv_url": "https://arxiv.org/abs/2607.27595", "authors": ["Zhaoji Wang", "Wanyu Si", "Jun Wang"], "brief": "\u672c\u6587\u5c06\u53e4\u6c49\u8bed\u53f2\u4e66\u4e92\u6587\u62bd\u53d6\u4ece\u76f8\u4f3c\u5ea6\u68c0\u7d22\u6539\u9020\u4e3a\u5e26\u5de5\u5177\u7ea6\u675f\u7684LLM\u667a\u80fd\u4f53\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u5b9a\u4f4d\u53cc\u65b9\u7cbe\u786e\u5b57span\u5e76\u6309\u4e94\u7ef4\u590d\u7528\u7c7b\u578b\u6807\u6ce8\u3002\u4f5c\u8005\u7528\u300a\u8bba\u8bed\u300b\u4e0e\u300a\u6c49\u4e66\u300b\u7684\u4e13\u5bb6\u88c1\u51b3\u57fa\u51c6\u8bc4\u6d4b12\u4e2aLLM\uff0c\u5e76\u6269\u5c55\u5230\u4e8c\u5341\u56db\u53f2\uff0c\u53d1\u73b0\u53ef\u63ed\u793a\u76f8\u4f3c\u5ea6\u65e0\u6cd5\u8868\u8fbe\u7684\u5f15\u7528\u7ed3\u6784\u4e0e\u957f\u671f\u6f14\u5316\u89c4\u5f8b\u3002\u65b9\u6cd5\u7cbe\u5ea6\u8de8\u5ea6\u8f83\u5927\u4e14\u6210\u672c\u5dee\u5f02\u663e\u8457\uff0c\u4e13\u5bb6\u4e00\u81f4\u6027\u4e5f\u663e\u793a\u8868\u5c42\u7279\u5f81\u53ef\u9760\u3001\u610f\u56fe\u63a8\u65ad\u66f4\u5177\u4e89\u8bae\u3002", "categories": ["cs.CL", "cs.AI", "cs.DL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27595", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u62bd\u53d6", "\u6570\u5b57\u4eba\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27595v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Similarity: Grounded Agentic Extraction and Expert-Adjudicated Evaluation of Intertextuality in Classical Chinese Histories", "tldr": "\u672c\u6587\u5c06\u53e4\u6c49\u8bed\u53f2\u4e66\u4e92\u6587\u62bd\u53d6\u4ece\u76f8\u4f3c\u5ea6\u68c0\u7d22\u6539\u9020\u4e3a\u5e26\u5de5\u5177\u7ea6\u675f\u7684LLM\u667a\u80fd\u4f53\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u5b9a\u4f4d\u53cc\u65b9\u7cbe\u786e\u5b57span\u5e76\u6309\u4e94\u7ef4\u590d\u7528\u7c7b\u578b\u6807\u6ce8\u3002\u4f5c\u8005\u7528\u300a\u8bba\u8bed\u300b\u4e0e\u300a\u6c49\u4e66\u300b\u7684\u4e13\u5bb6\u88c1\u51b3\u57fa\u51c6\u8bc4\u6d4b12\u4e2aLLM\uff0c\u5e76\u6269\u5c55\u5230\u4e8c\u5341\u56db\u53f2\uff0c\u53d1\u73b0\u53ef\u63ed\u793a\u76f8\u4f3c\u5ea6\u65e0\u6cd5\u8868\u8fbe\u7684\u5f15\u7528\u7ed3\u6784\u4e0e\u957f\u671f\u6f14\u5316\u89c4\u5f8b\u3002\u65b9\u6cd5\u7cbe\u5ea6\u8de8\u5ea6\u8f83\u5927\u4e14\u6210\u672c\u5dee\u5f02\u663e\u8457\uff0c\u4e13\u5bb6\u4e00\u81f4\u6027\u4e5f\u663e\u793a\u8868\u5c42\u7279\u5f81\u53ef\u9760\u3001\u610f\u56fe\u63a8\u65ad\u66f4\u5177\u4e89\u8bae\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We propose RefineSVG, a single-step closed-loop visual feedback framework that enables multimodal large language models (MLLMs) to perform high-fidelity image-to-SVG generation through self-correction. Existing MLLM-based approaches rely on single-pass open-loop inference, where the model receives visual input only once and must generate thousands of SVG code tokens without intermediate verification. This paradigm inevitably leads to geometric drift, error accumulation, and visual hallucination on complex images. RefineSVG overcomes this limitation by invoking an external rendering engine after an initial SVG generation pass to compare the rendered output against the target image. The comparison yields a multi-dimensional visual residual map (Diff-Map) that is fed back to the model as a ReAct-style correction signal, driving a targeted correction step. To support this render-observe-correct interaction, we further introduce an SVG-oriented semantic vocabulary that compresses token sequences by over 52%. A progressive training pipeline spanning supervised fine-tuning, rejection-sampling cold-start data construction, and end-to-end agentic reinforcement learning aligns the model with closed-loop visual correction. Extensive experiments show that RefineSVG consistently outperforms existing baselines in reconstruction fidelity, structural accuracy, and code efficiency.Code is available at https://github.com/liuxiaobo66/RefineSVG.", "arxiv_id": "2607.27699", "arxiv_url": "https://arxiv.org/abs/2607.27699", "authors": ["Shaobo Liu", "Feiqiao Mao", "Shuaishuai Zhou", "Yan Zhan", "Weiqi Tan", "Zhiqiong Lu", "Zhengping Liang"], "brief": "RefineSVG \u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u89c6\u89c9\u53cd\u9988\u7684\u95ed\u73af\u56fe\u50cf\u5230 SVG \u751f\u6210\u6846\u67b6\uff1a\u5148\u751f\u6210 SVG\uff0c\u518d\u6e32\u67d3\u5e76\u4e0e\u76ee\u6807\u56fe\u50cf\u6bd4\u8f83\u5f97\u5230 Diff-Map\uff0c\u53cd\u9988\u7ed9\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fdb\u884c\u9488\u5bf9\u6027\u81ea\u7ea0\u9519\u3002\u7ed3\u5408 SVG \u8bed\u4e49\u8bcd\u8868\u538b\u7f29\u4ee3\u7801 token \u4ee5\u53ca\u76d1\u7763\u5fae\u8c03\u3001\u62d2\u7edd\u91c7\u6837\u548c\u667a\u80fd\u4f53\u5f0f\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u540e\uff0c\u5728\u91cd\u5efa\u4fdd\u771f\u5ea6\u3001\u7ed3\u6784\u51c6\u786e\u6027\u548c\u4ee3\u7801\u6548\u7387\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27699", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "SVG\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27699v1", "published_at": "2026-07-30", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "RefineSVG: Visual Feedback-Driven Reinforcement Learning for Image-to-SVG Generation", "tldr": "RefineSVG \u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u89c6\u89c9\u53cd\u9988\u7684\u95ed\u73af\u56fe\u50cf\u5230 SVG \u751f\u6210\u6846\u67b6\uff1a\u5148\u751f\u6210 SVG\uff0c\u518d\u6e32\u67d3\u5e76\u4e0e\u76ee\u6807\u56fe\u50cf\u6bd4\u8f83\u5f97\u5230 Diff-Map\uff0c\u53cd\u9988\u7ed9\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fdb\u884c\u9488\u5bf9\u6027\u81ea\u7ea0\u9519\u3002\u7ed3\u5408 SVG \u8bed\u4e49\u8bcd\u8868\u538b\u7f29\u4ee3\u7801 token \u4ee5\u53ca\u76d1\u7763\u5fae\u8c03\u3001\u62d2\u7edd\u91c7\u6837\u548c\u667a\u80fd\u4f53\u5f0f\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u540e\uff0c\u5728\u91cd\u5efa\u4fdd\u771f\u5ea6\u3001\u7ed3\u6784\u51c6\u786e\u6027\u548c\u4ee3\u7801\u6548\u7387\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation provides dense supervision for multimodal reasoners, but its trajectory-level reward cannot determine whether a failed answer arose from perception or subsequent reasoning. Perception Success Rate (PSR), estimated from multiple reasonings sharing one perception, remains ambiguous because low success conflates perceptual insufficiency with reasoning difficulty. We introduce \\textbf{Perception-Correction Distillation (PCD)}, a label-free method that identifies correctable perception failures using downstream failure and teacher--student disagreement as complementary witnesses. Their product, , forms a soft AND gate that strengthens distillation only when both witnesses are present. We motivate this rule through Bayesian evidence combination and show that multiplication is the unique normalized bilinear gate that vanishes when either witness is absent. PCD uses separated perception--reasoning rollouts and mean-preserving weights, leaving the reasoning objective unchanged. Across eight benchmarks, PCD improves the 8B 2B macro average from 44.50 with OPD to 47.28 and the 32B 8B result from 56.94 to 61.22. In matched 2B ablations, removing PCD and separated rollout reduces held-out average by 2.22 and 0.88 points, respectively. Effective multimodal distillation therefore depends not only on what the teacher predicts, but also on identifying when perception is the appropriate target of correction.", "arxiv_id": "2607.28336", "arxiv_url": "https://arxiv.org/abs/2607.28336", "authors": ["Feng Xiong", "Leyan Xue", "Hongyu Lin"], "brief": "\u8bba\u6587\u63d0\u51fa\u611f\u77e5\u7ea0\u6b63\u84b8\u998f\uff08PCD\uff09\uff0c\u7528\u4e8e\u591a\u6a21\u6001\u63a8\u7406\u6a21\u578b\u7684\u5728\u7b56\u7565\u84b8\u998f\u4e2d\u533a\u5206\u5931\u8d25\u7a76\u7adf\u6765\u81ea\u611f\u77e5\u8fd8\u662f\u540e\u7eed\u63a8\u7406\u3002\u65b9\u6cd5\u5229\u7528\u4e0b\u6e38\u5931\u8d25\u4e0e\u5e08\u751f\u5206\u6b67\u4f5c\u4e3a\u4e92\u8865\u4fe1\u53f7\uff0c\u4ee5\u8f6f AND \u95e8\u589e\u5f3a\u771f\u6b63\u53ef\u7ea0\u6b63\u7684\u611f\u77e5\u5931\u8d25\u6837\u672c\u84b8\u998f\uff1b\u57288\u4e2a\u57fa\u51c6\u4e0a\u76f8\u6bd4 OPD \u660e\u663e\u63d0\u5347\uff0c\u591a\u79cd\u6a21\u578b\u89c4\u6a21\u5747\u6709\u6536\u76ca\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28336", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u77e5\u8bc6\u84b8\u998f", "\u611f\u77e5", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28336v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Correcting What You Cannot See: Credit Assignment for Perception Distillation in Multimodal Reasoners", "tldr": "\u8bba\u6587\u63d0\u51fa\u611f\u77e5\u7ea0\u6b63\u84b8\u998f\uff08PCD\uff09\uff0c\u7528\u4e8e\u591a\u6a21\u6001\u63a8\u7406\u6a21\u578b\u7684\u5728\u7b56\u7565\u84b8\u998f\u4e2d\u533a\u5206\u5931\u8d25\u7a76\u7adf\u6765\u81ea\u611f\u77e5\u8fd8\u662f\u540e\u7eed\u63a8\u7406\u3002\u65b9\u6cd5\u5229\u7528\u4e0b\u6e38\u5931\u8d25\u4e0e\u5e08\u751f\u5206\u6b67\u4f5c\u4e3a\u4e92\u8865\u4fe1\u53f7\uff0c\u4ee5\u8f6f AND \u95e8\u589e\u5f3a\u771f\u6b63\u53ef\u7ea0\u6b63\u7684\u611f\u77e5\u5931\u8d25\u6837\u672c\u84b8\u998f\uff1b\u57288\u4e2a\u57fa\u51c6\u4e0a\u76f8\u6bd4 OPD \u660e\u663e\u63d0\u5347\uff0c\u591a\u79cd\u6a21\u578b\u89c4\u6a21\u5747\u6709\u6536\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) are increasingly used to analyze pathology images. However, dominant multimodal benchmarks in pathology mainly score final diagnostic answers, captions, or reports. These evaluations provide limited insight into whether a model understands the multiscale visual content needed for pathology reasoning and decision-making. We introduce PathVU, a vision-anchored benchmark for fine-grained and multiscale visual understanding in computational pathology. Built from 23 public pathology imaging datasets with human-supervised labels and spatial annotations, PathVU evaluates MLLM understanding in two fields of view: Region FOV for high-resolution local regions and Slide FOV for macro whole-slide views. By converting raw annotations into deterministic task targets, PathVU enables programmatic scoring of region localization, visual recognition, quantity estimation, spatial reasoning, and insufficient-context judgment. The benchmark contains 14 VQA-style tasks, 61,673 images, and 308,070 samples across 28 organs and 7,253,526 annotations. Evaluating 18 representative general-purpose, medical-domain, and pathology-oriented MLLMs, we observe substantial limitations even in advanced models on fine-grained visual tasks across multiscale pathology images. PathVU provides a reproducible basis for developing and evaluating pathology MLLMs with explicit multiscale visual understanding.", "arxiv_id": "2607.28318", "arxiv_url": "https://arxiv.org/abs/2607.28318", "authors": ["Zongyi Chen", "Yu Liang", "Jie Lin", "Liansheng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa PathVU/PathView-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u75c5\u7406\u56fe\u50cf\u7684\u7ec6\u7c92\u5ea6\u3001\u591a\u5c3a\u5ea6\u89c6\u89c9\u7406\u89e3\u57fa\u51c6\uff0c\u8986\u76d6\u5c40\u90e8\u9ad8\u5206\u8fa8\u7387\u533a\u57df\u548c\u6574\u5f20\u5207\u7247\u89c6\u91ce\u3002\u8be5\u57fa\u51c6\u5305\u542b14\u7c7bVQA\u4efb\u52a1\u30016\u4e07\u4f59\u5f20\u56fe\u50cf\u548c30\u4e07\u4f59\u6837\u672c\uff0c\u7528\u4e8e\u8bc4\u4f30\u5b9a\u4f4d\u3001\u8bc6\u522b\u3001\u8ba1\u6570\u3001\u7a7a\u95f4\u63a8\u7406\u7b49\u80fd\u529b\uff1b\u5bf918\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u73b0\u6709\u6a21\u578b\u5728\u591a\u5c3a\u5ea6\u75c5\u7406\u7ec6\u7c92\u5ea6\u7406\u89e3\u4e0a\u4ecd\u6709\u660e\u663e\u4e0d\u8db3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28318", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u75c5\u7406\u56fe\u50cf", "\u89c6\u89c9\u95ee\u7b54", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28318v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PathView-Bench: Can Multimodal Large Language Models Achieve Fine-grained Multiscale Understanding of Pathology Images?", "tldr": "\u8bba\u6587\u63d0\u51fa PathVU/PathView-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u75c5\u7406\u56fe\u50cf\u7684\u7ec6\u7c92\u5ea6\u3001\u591a\u5c3a\u5ea6\u89c6\u89c9\u7406\u89e3\u57fa\u51c6\uff0c\u8986\u76d6\u5c40\u90e8\u9ad8\u5206\u8fa8\u7387\u533a\u57df\u548c\u6574\u5f20\u5207\u7247\u89c6\u91ce\u3002\u8be5\u57fa\u51c6\u5305\u542b14\u7c7bVQA\u4efb\u52a1\u30016\u4e07\u4f59\u5f20\u56fe\u50cf\u548c30\u4e07\u4f59\u6837\u672c\uff0c\u7528\u4e8e\u8bc4\u4f30\u5b9a\u4f4d\u3001\u8bc6\u522b\u3001\u8ba1\u6570\u3001\u7a7a\u95f4\u63a8\u7406\u7b49\u80fd\u529b\uff1b\u5bf918\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u73b0\u6709\u6a21\u578b\u5728\u591a\u5c3a\u5ea6\u75c5\u7406\u7ec6\u7c92\u5ea6\u7406\u89e3\u4e0a\u4ecd\u6709\u660e\u663e\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming video understanding requires models to continuously retain useful visual evidence before future questions are known. Existing approaches primarily manage the growing visual context according to token importance, temporal redundancy, or segment-level relevance, but rarely organize evidence around objects that persist and evolve over time. Thus, in this paper, we introduce ObjectStream, a training-free framework that treats latent objects as memory anchors for streaming video understanding. ObjectStream induces spatially coherent latent objects directly from frozen Video-LLM representations, links them across frames into persistent anchors, and maintains their histories under a bounded memory budget, without requiring external object detectors or segmentation models. Built on these anchors, ObjectStream preserves three complementary forms of evidence: persistent object histories, transient object changes, and recent visual context. This design enables existing Video Large Language Models (Video-LLMs) to reason over object identities, interactions, and state changes while leaving the underlying model unchanged. Extensive experiments on online streaming and offline long-video benchmarks demonstrate both effectiveness and efficiency. In online streaming evaluation, ObjectStream improves Qwen2.5-VL-7B by 10.0 points on OVO-Bench Real-Time Visual Perception, while reducing peak GPU mem-ory and TTFT by approximately 50%. On offline long-video benchmarks, it surpasses the full-token baseline while discarding 82.5% of visual tokens. These results highlight latent objects as a practical and effective organizing principle for compact streaming video memory.", "arxiv_id": "2607.28312", "arxiv_url": "https://arxiv.org/abs/2607.28312", "authors": ["Mingkang Dong", "Muxin Pu", "Jie Li", "Bohan Guo", "Songruo Chen", "Bin Ren", "Xu Zheng", "Chen Zhao", "Tianwen Qian", "Mohamed Elhoseiny", "Yuqian Fu"], "brief": "ObjectStream \u662f\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u6846\u67b6\uff0c\u5c06\u51bb\u7ed3 Video-LLM \u8868\u5f81\u4e2d\u7684\u6f5c\u5728\u5bf9\u8c61\u7ec4\u7ec7\u4e3a\u957f\u671f\u8bb0\u5fc6\u951a\u70b9\uff0c\u5e76\u5728\u6709\u9650\u663e\u5b58\u4e0b\u7ef4\u62a4\u5bf9\u8c61\u5386\u53f2\u3001\u77ac\u65f6\u53d8\u5316\u548c\u8fd1\u671f\u4e0a\u4e0b\u6587\u3002\u5b83\u65e0\u9700\u5916\u90e8\u68c0\u6d4b/\u5206\u5272\u6a21\u578b\uff0c\u53ef\u63d0\u5347\u5bf9\u8c61\u8eab\u4efd\u3001\u4ea4\u4e92\u548c\u72b6\u6001\u53d8\u5316\u63a8\u7406\uff1b\u5728\u5b9e\u65f6\u57fa\u51c6\u4e0a\u5c06 Qwen2.5-VL-7B \u63d0\u5347 10.0 \u5206\uff0c\u540c\u65f6\u663e\u5b58\u5cf0\u503c\u548c\u9996 token \u5ef6\u8fdf\u7ea6\u51cf\u534a\uff0c\u5e76\u5728\u957f\u89c6\u9891\u4efb\u52a1\u4e2d\u4e22\u5f03 82.5% \u89c6\u89c9 token \u4ecd\u4f18\u4e8e\u5168 token \u57fa\u7ebf\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28312", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u957f\u4e0a\u4e0b\u6587", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28312v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ObjectStream: Latent Objects as Memory Anchors for Streaming Video Understanding", "tldr": "ObjectStream \u662f\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u6846\u67b6\uff0c\u5c06\u51bb\u7ed3 Video-LLM \u8868\u5f81\u4e2d\u7684\u6f5c\u5728\u5bf9\u8c61\u7ec4\u7ec7\u4e3a\u957f\u671f\u8bb0\u5fc6\u951a\u70b9\uff0c\u5e76\u5728\u6709\u9650\u663e\u5b58\u4e0b\u7ef4\u62a4\u5bf9\u8c61\u5386\u53f2\u3001\u77ac\u65f6\u53d8\u5316\u548c\u8fd1\u671f\u4e0a\u4e0b\u6587\u3002\u5b83\u65e0\u9700\u5916\u90e8\u68c0\u6d4b/\u5206\u5272\u6a21\u578b\uff0c\u53ef\u63d0\u5347\u5bf9\u8c61\u8eab\u4efd\u3001\u4ea4\u4e92\u548c\u72b6\u6001\u53d8\u5316\u63a8\u7406\uff1b\u5728\u5b9e\u65f6\u57fa\u51c6\u4e0a\u5c06 Qwen2.5-VL-7B \u63d0\u5347 10.0 \u5206\uff0c\u540c\u65f6\u663e\u5b58\u5cf0\u503c\u548c\u9996 token \u5ef6\u8fdf\u7ea6\u51cf\u534a\uff0c\u5e76\u5728\u957f\u89c6\u9891\u4efb\u52a1\u4e2d\u4e22\u5f03 82.5% \u89c6\u89c9 token \u4ecd\u4f18\u4e8e\u5168 token \u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Microservice architectures have become dominant for modernizing monolithic systems, yet identifying appropriate services remains challenging and largely manual. Existing decomposition approaches are predominantly code-centric, limiting applicability in early design stages where only textual requirements are available. Despite advances in Large Language Models (LLMs), limited empirical evidence exists on their ability to synthesize complete microservice architectures from natural-language requirements, including service definitions and inter-service interactions. This study investigates whether an LLM can bridge requirements engineering and architectural design, generating architectures solely from textual requirements and evaluating structural agreement and perceived quality of results. We conduct a mixed-method study using OpenAI o3 under zero-shot (ZS) and few-shot (FS) prompting across two systems (Bookstore, PetClinic), one execution per system/condition. Architectures are evaluated through (i) comparison with reference architectures using precision, recall, and F1-score for service identification and communication recovery, and (ii) a blinded expert assessment of correctness, completeness, modularity, and plausibility, plus open feedback synthesis. OpenAI o3 identifies services with higher agreement under FS prompting (F1 = 0.79 for ZS versus = 0.97 for FS). Communication recovery is more challenging: ZS produces dense architectures with high recall but low precision (F1 = 0.61), while FS improves agreement, reaching F1 = 0.82 and reducing unsupported dependencies. Expert evaluation corroborates these results, with FS architectures perceived as more modular, coherent, and plausible than ZS outputs. OpenAI o3 shows potential for requirements-driven synthesis when guided by exemplar prompting. Results are model- and context-specific from two small systems, not model-independent proof.", "arxiv_id": "2607.28307", "arxiv_url": "https://arxiv.org/abs/2607.28307", "authors": ["Danyllo Albuquerque", "Jos\u00e9 Renan", "Guillermo Rodr\u00edguez", "Guillermo Rodr\u00edguez", "Emanuel Dantas", "Ademar Fran\u00e7a", "Mirko Perkusich", "Kyller Gorg\u00f4nio", "Angelo Perkusich"], "brief": "\u8be5\u7814\u7a76\u8bc4\u4f30 OpenAI o3 \u662f\u5426\u80fd\u4ec5\u6839\u636e\u6587\u672c\u9700\u6c42\u751f\u6210\u5fae\u670d\u52a1\u67b6\u6784\uff0c\u5305\u62ec\u670d\u52a1\u5212\u5206\u548c\u670d\u52a1\u95f4\u901a\u4fe1\u3002\u7ed3\u679c\u663e\u793a\u5c11\u6837\u672c\u63d0\u793a\u663e\u8457\u4f18\u4e8e\u96f6\u6837\u672c\uff0c\u670d\u52a1\u8bc6\u522b F1 \u4ece 0.79 \u63d0\u5347\u5230 0.97\uff0c\u901a\u4fe1\u6062\u590d F1 \u63d0\u5347\u5230 0.82\uff0c\u4e13\u5bb6\u4e5f\u8ba4\u4e3a\u5176\u67b6\u6784\u66f4\u6a21\u5757\u5316\u3001\u53ef\u4fe1\uff0c\u4f46\u5b9e\u9a8c\u4ec5\u8986\u76d6\u4e24\u4e2a\u5c0f\u7cfb\u7edf\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28307", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8f6f\u4ef6\u5de5\u7a0b", "\u5fae\u670d\u52a1\u67b6\u6784", "\u9700\u6c42\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28307v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Textual Requirements to Microservice Architectures - A Comprehensive Evaluation of LLM-Based Design Synthesis", "tldr": "\u8be5\u7814\u7a76\u8bc4\u4f30 OpenAI o3 \u662f\u5426\u80fd\u4ec5\u6839\u636e\u6587\u672c\u9700\u6c42\u751f\u6210\u5fae\u670d\u52a1\u67b6\u6784\uff0c\u5305\u62ec\u670d\u52a1\u5212\u5206\u548c\u670d\u52a1\u95f4\u901a\u4fe1\u3002\u7ed3\u679c\u663e\u793a\u5c11\u6837\u672c\u63d0\u793a\u663e\u8457\u4f18\u4e8e\u96f6\u6837\u672c\uff0c\u670d\u52a1\u8bc6\u522b F1 \u4ece 0.79 \u63d0\u5347\u5230 0.97\uff0c\u901a\u4fe1\u6062\u590d F1 \u63d0\u5347\u5230 0.82\uff0c\u4e13\u5bb6\u4e5f\u8ba4\u4e3a\u5176\u67b6\u6784\u66f4\u6a21\u5757\u5316\u3001\u53ef\u4fe1\uff0c\u4f46\u5b9e\u9a8c\u4ec5\u8986\u76d6\u4e24\u4e2a\u5c0f\u7cfb\u7edf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Open vocabulary 3D scene understanding is essential for next-generation interactive systems, empowering users to intuitively query and navigate reconstructed environments using natural language. However, current 3D Gaussian frameworks are often bottlenecked by restrictive multiview capture requirements, costly scene-specific optimization, and the massive memory overhead of storing dense language features. We present a novel, training-free pipeline that fundamentally reimagines this paradigm by explicitly decoupling 3D geometric reconstruction from semantic integration. Given a standard monocular video sequence as input, our method efficiently outputs a compact, highly interpretable, and fully searchable object-level semantic Gaussian map. Rather than entangling heavy language embeddings within the mapping loop, we extract geometry independently and ground semantics through a lightweight, modular post-processing framework. Extensive evaluations on the Replica dataset demonstrate that this decoupled architecture preserves strong rendering fidelity and competitive segmentation accuracy. Crucially, by replacing dense per-Gaussian storage with modular, object-level semantic embeddings, our approach delivers an order-of-magnitude reduction in memory usage compared to SOTA baselines. This provides a highly efficient, scalable, and practical solution for open-vocabulary 3D retrieval and question answering directly from everyday monocular video.", "arxiv_id": "2607.28300", "arxiv_url": "https://arxiv.org/abs/2607.28300", "authors": ["Pouya Ardekhani", "Zahra Dehghanian", "Morteza Abolghasemi", "Hamid R. Rabiee"], "brief": "MonoVoc \u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u5355\u76ee\u89c6\u9891\u5f00\u653e\u8bcd\u6c47 3D Gaussian \u6784\u5efa\u6d41\u7a0b\uff0c\u5c06\u51e0\u4f55\u91cd\u5efa\u4e0e\u8bed\u4e49\u96c6\u6210\u663e\u5f0f\u89e3\u8026\u3002\u5b83\u7528\u5bf9\u8c61\u7ea7\u8bed\u4e49\u5d4c\u5165\u66ff\u4ee3\u9010\u9ad8\u65af\u7684\u5bc6\u96c6\u8bed\u8a00\u7279\u5f81\uff0c\u5728\u4fdd\u6301\u8f83\u597d\u6e32\u67d3\u8d28\u91cf\u548c\u5206\u5272\u7cbe\u5ea6\u7684\u540c\u65f6\uff0c\u76f8\u6bd4 SOTA \u663e\u8457\u964d\u4f4e\u5185\u5b58\u5f00\u9500\uff0c\u9002\u5408\u5f00\u653e\u8bcd\u6c47 3D \u68c0\u7d22\u4e0e\u95ee\u7b54\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28300", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u5f00\u653e\u8bcd\u6c47", "3D Gaussian", "\u5355\u76ee\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28300v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MonoVoc: Decoupling Geometry and Semantics for Lightweight Monocular Open-Vocabulary 3D Gaussians", "tldr": "MonoVoc \u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u5355\u76ee\u89c6\u9891\u5f00\u653e\u8bcd\u6c47 3D Gaussian \u6784\u5efa\u6d41\u7a0b\uff0c\u5c06\u51e0\u4f55\u91cd\u5efa\u4e0e\u8bed\u4e49\u96c6\u6210\u663e\u5f0f\u89e3\u8026\u3002\u5b83\u7528\u5bf9\u8c61\u7ea7\u8bed\u4e49\u5d4c\u5165\u66ff\u4ee3\u9010\u9ad8\u65af\u7684\u5bc6\u96c6\u8bed\u8a00\u7279\u5f81\uff0c\u5728\u4fdd\u6301\u8f83\u597d\u6e32\u67d3\u8d28\u91cf\u548c\u5206\u5272\u7cbe\u5ea6\u7684\u540c\u65f6\uff0c\u76f8\u6bd4 SOTA \u663e\u8457\u964d\u4f4e\u5185\u5b58\u5f00\u9500\uff0c\u9002\u5408\u5f00\u653e\u8bcd\u6c47 3D \u68c0\u7d22\u4e0e\u95ee\u7b54\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) deployed in dynamic financial environments face a critical challenge: maintaining factual accuracy as market conditions, regulations, and corporate facts change continuously. While 4-bit quantization enables efficient deployment, it severely limits the viability of sequential memory editing: existing methods undergo catastrophic performance degradation under this \"quantization stability crisis.\" We introduce CACHE-UK (Contextual Adaptive Continual Hybrid Editor for UK Finance), a stability-aware memory editing framework specifically designed for domain-specific, quantized LLMs. CACHE-UK integrates three components: a rank-1 LoRA perturbation mechanism that confines edits to the low-rank adapter subspace, a financial domain prioritization module for content-adaptive edit strength, and a closed-loop Stability Controller that tracks \"degradation debt\" to prevent catastrophic forgetting across sequential updates. Evaluated on a 4-bit quantized OpenLLaMA-3B model with a curated UK financial corpus of 88,021 documents, CACHE-UK reduces knowledge degradation by 11-17% relative to adapted baselines under identical 4-bit constraints -- its most robust effect -- while attaining the highest test success (generalization) rate observed in our setting (28%, a 6 percentage point improvement over the strongest adapted baseline). These results indicate that stability-aware editing can improve factual maintenance in resource-constrained financial LLM deployments, though absolute generalization rates remain low.", "arxiv_id": "2607.28292", "arxiv_url": "https://arxiv.org/abs/2607.28292", "authors": ["Anubhav Lakra", "Yue Feng"], "brief": "\u8bba\u6587\u63d0\u51fa CACHE-UK\uff0c\u4e00\u4e2a\u9762\u5411\u91d1\u878d\u9886\u57df 4-bit \u91cf\u5316\u5927\u6a21\u578b\u7684\u7a33\u5b9a\u6027\u611f\u77e5\u8fde\u7eed\u8bb0\u5fc6\u7f16\u8f91\u6846\u67b6\uff0c\u901a\u8fc7\u4f4e\u79e9 LoRA \u6270\u52a8\u3001\u91d1\u878d\u5185\u5bb9\u4f18\u5148\u7ea7\u548c\u95ed\u73af\u7a33\u5b9a\u63a7\u5236\u6765\u7f13\u89e3\u591a\u8f6e\u66f4\u65b0\u4e2d\u7684\u9057\u5fd8\u3002\u5b9e\u9a8c\u5728\u82f1\u56fd\u91d1\u878d\u8bed\u6599\u548c\u91cf\u5316 OpenLLaMA-3B \u4e0a\u663e\u793a\uff0c\u76f8\u6bd4\u6539\u9020\u57fa\u7ebf\u53ef\u964d\u4f4e 11-17% \u7684\u77e5\u8bc6\u9000\u5316\uff0c\u5e76\u5c06\u6d4b\u8bd5\u6cdb\u5316\u6210\u529f\u7387\u63d0\u5347\u5230 28%\uff0c\u4f46\u7edd\u5bf9\u6cdb\u5316\u80fd\u529b\u4ecd\u7136\u6709\u9650\u3002", "categories": ["cs.CL", "cs.AI", "cs.CE", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28292", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u7f16\u8f91", "\u91cf\u5316", "\u91d1\u878d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28292v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CACHE-UK: A Stability-Aware Memory Editor for Sequentially Updated Quantized LLMs in Finance", "tldr": "\u8bba\u6587\u63d0\u51fa CACHE-UK\uff0c\u4e00\u4e2a\u9762\u5411\u91d1\u878d\u9886\u57df 4-bit \u91cf\u5316\u5927\u6a21\u578b\u7684\u7a33\u5b9a\u6027\u611f\u77e5\u8fde\u7eed\u8bb0\u5fc6\u7f16\u8f91\u6846\u67b6\uff0c\u901a\u8fc7\u4f4e\u79e9 LoRA \u6270\u52a8\u3001\u91d1\u878d\u5185\u5bb9\u4f18\u5148\u7ea7\u548c\u95ed\u73af\u7a33\u5b9a\u63a7\u5236\u6765\u7f13\u89e3\u591a\u8f6e\u66f4\u65b0\u4e2d\u7684\u9057\u5fd8\u3002\u5b9e\u9a8c\u5728\u82f1\u56fd\u91d1\u878d\u8bed\u6599\u548c\u91cf\u5316 OpenLLaMA-3B \u4e0a\u663e\u793a\uff0c\u76f8\u6bd4\u6539\u9020\u57fa\u7ebf\u53ef\u964d\u4f4e 11-17% \u7684\u77e5\u8bc6\u9000\u5316\uff0c\u5e76\u5c06\u6d4b\u8bd5\u6cdb\u5316\u6210\u529f\u7387\u63d0\u5347\u5230 28%\uff0c\u4f46\u7edd\u5bf9\u6cdb\u5316\u80fd\u529b\u4ecd\u7136\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "ARC-AGI-3 turns abstraction into an interactive problem of skill acquisition. A player must infer an unfamiliar game\u0027s rules, hidden state, and goal while maintaining action efficiency because every move counts. We formalize these environments as parameterized rendered deterministic Moore machines and introduce Tycho, a coding-agent system that constructs and uses game-specific models during interaction. Tycho separates actionable observations from intermediate animation, level-completion, and game-over frames. From this structured history, an agent can model, test, plan with, repair, or bypass a free-form executable hypothesis. In one matched public-set run per policy, we compare four orchestration policies on all 25 public games using Claude Opus 4.8 under matched inference budgets. Actor-requested delegation to a model builder obtains the highest observed mean Relative Human Action Efficiency (RHAE), 88.49. With this selected policy, GPT-5.6 Sol and Opus 5 both reach 100.00 RHAE and complete all 183 levels. Their game-balanced first-run human-replay midranks are 98.5 and 100.0. Opus 5 uses 61% fewer scored actions than the aggregate official human baselines. Automatic repair after verification failures produces models that reproduce observed transitions much more accurately, yet reaches only 83.07 RHAE. Transition match indicates whether a simulator reproduces observed dynamics, not whether it has identified the objective or improves the next action. Strong play also requires deciding when to construct, repair, use, or bypass a model. We call this joint problem active abstraction: generating a testable model from costly interaction and deciding when acquiring or using it is worth its cost.", "arxiv_id": "2607.28287", "arxiv_url": "https://arxiv.org/abs/2607.28287", "authors": ["Jens Lehmann", "Andrei Aioanei", "Sahar Vahdati"], "brief": "\u8bba\u6587\u63d0\u51fa Tycho\uff0c\u4e00\u4e2a\u9762\u5411 ARC-AGI-3 \u7684\u7f16\u7801\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u901a\u8fc7\u4ea4\u4e92\u4e2d\u6784\u5efa\u3001\u9a8c\u8bc1\u3001\u4fee\u590d\u6216\u7ed5\u8fc7\u6e38\u620f\u4e13\u5c5e\u7684\u53ef\u6267\u884c\u4e16\u754c\u6a21\u578b\u6765\u5b66\u4e60\u89c4\u5219\u4e0e\u76ee\u6807\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5e26\u6a21\u578b\u6784\u5efa\u59d4\u6258\u7684\u7b56\u7565\u6548\u679c\u6700\u597d\uff0cGPT-5.6 Sol \u548c Opus 5 \u5728\u9009\u5b9a\u7b56\u7565\u4e0b\u5b8c\u6210\u5168\u90e8 183 \u4e2a\u5173\u5361\u5e76\u8fbe\u5230 100.00 RHAE\uff0c\u663e\u8457\u4f18\u4e8e\u5b98\u65b9\u4eba\u7c7b\u57fa\u7ebf\u52a8\u4f5c\u6548\u7387\u3002", "categories": ["cs.AI", "cs.CV", "cs.SC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28287", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u7a0b\u5e8f\u5408\u6210", "ARC"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28287v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tycho: Active Abstraction with Programmatic World Models for ARC-AGI-3", "tldr": "\u8bba\u6587\u63d0\u51fa Tycho\uff0c\u4e00\u4e2a\u9762\u5411 ARC-AGI-3 \u7684\u7f16\u7801\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u901a\u8fc7\u4ea4\u4e92\u4e2d\u6784\u5efa\u3001\u9a8c\u8bc1\u3001\u4fee\u590d\u6216\u7ed5\u8fc7\u6e38\u620f\u4e13\u5c5e\u7684\u53ef\u6267\u884c\u4e16\u754c\u6a21\u578b\u6765\u5b66\u4e60\u89c4\u5219\u4e0e\u76ee\u6807\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5e26\u6a21\u578b\u6784\u5efa\u59d4\u6258\u7684\u7b56\u7565\u6548\u679c\u6700\u597d\uff0cGPT-5.6 Sol \u548c Opus 5 \u5728\u9009\u5b9a\u7b56\u7565\u4e0b\u5b8c\u6210\u5168\u90e8 183 \u4e2a\u5173\u5361\u5e76\u8fbe\u5230 100.00 RHAE\uff0c\u663e\u8457\u4f18\u4e8e\u5b98\u65b9\u4eba\u7c7b\u57fa\u7ebf\u52a8\u4f5c\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The deployment of Vision-Language Models (VLMs) in critical domains like disaster management requires high-quality multimodal datasets, especially for transferring knowledge via Data-Free Knowledge Distillation (DFKD). However, existing datasets in this domain either entirely lack descriptive text, such as Incidents1M, or suffer from severe text-image semantic misalignment, such as CrisisMMD. In this work, we present a novel methodology to construct and automatically validate a large-scale multimodal dataset for disaster response. Starting from the vision-only Incidents1M, we successfully recovered 100,000 images and generated high-fidelity textual descriptions using two distinct Qwen3.5 architectures: a 4B dense model and a 35B Mixture-of-Experts (MoE) model. To ensure the generated captions provide reliable semantic anchoring for DFKD, we introduce an image-blind LLM-as-a-Judge validation pipeline leveraging Qwen3.5-9B. By intentionally obscuring the original image from the judge, this evaluator accurately simulates the modality gap of the student model during data-free distillation. Our evaluation across 173,179 label pairs demonstrates a high semantic agreement (78.65/100) between the two architectures. Furthermore, the automated evaluation reveals a conservative captioning behaviour, characterized by a high Precision (77.6%) and low Recall (46.0%). This minimizes the false positive noise, while simultaneously exposing underlying human annotation inconsistencies in the original ground truth. This work provides a scalable, LLM-validated multimodal dataset and a reproducible framework to advance cross-modal knowledge distillation.", "arxiv_id": "2607.28269", "arxiv_url": "https://arxiv.org/abs/2607.28269", "authors": ["Simone Giano", "Lorenzo Severini", "Alessandro Galdelli", "Adriano Mancini"], "brief": "\u672c\u6587\u4ece\u4ec5\u542b\u56fe\u50cf\u7684 Incidents1M \u4e2d\u6062\u590d 10 \u4e07\u5f20\u707e\u5bb3\u56fe\u50cf\uff0c\u5e76\u7528\u4e24\u79cd Qwen3.5 \u6a21\u578b\u751f\u6210\u9ad8\u8d28\u91cf\u6587\u672c\u63cf\u8ff0\uff0c\u6784\u5efa\u9762\u5411\u6570\u636e\u65e0\u5173\u77e5\u8bc6\u84b8\u998f\u7684\u591a\u6a21\u6001\u6570\u636e\u96c6\u3002\u4f5c\u8005\u63d0\u51fa\u56fe\u50cf\u76f2 LLM-as-a-Judge \u81ea\u52a8\u9a8c\u8bc1\u6d41\u7a0b\uff0c\u53d1\u73b0\u4e24\u79cd\u751f\u6210\u67b6\u6784\u8bed\u4e49\u4e00\u81f4\u6027\u8f83\u9ad8\uff0c\u540c\u65f6\u5b57\u5e55\u504f\u4fdd\u5b88\u3001\u7cbe\u786e\u7387\u9ad8\u4f46\u53ec\u56de\u7387\u8f83\u4f4e\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u9519\u8bef\u8bed\u4e49\u566a\u58f0\u3002", "categories": ["cs.CV", "cs.AI", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28269", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u6570\u636e\u96c6\u6784\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28269v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Theia: Large-Scale Multimodal Captioning and Automated Validation of the Incidents1M Dataset for Data-Free Distillation", "tldr": "\u672c\u6587\u4ece\u4ec5\u542b\u56fe\u50cf\u7684 Incidents1M \u4e2d\u6062\u590d 10 \u4e07\u5f20\u707e\u5bb3\u56fe\u50cf\uff0c\u5e76\u7528\u4e24\u79cd Qwen3.5 \u6a21\u578b\u751f\u6210\u9ad8\u8d28\u91cf\u6587\u672c\u63cf\u8ff0\uff0c\u6784\u5efa\u9762\u5411\u6570\u636e\u65e0\u5173\u77e5\u8bc6\u84b8\u998f\u7684\u591a\u6a21\u6001\u6570\u636e\u96c6\u3002\u4f5c\u8005\u63d0\u51fa\u56fe\u50cf\u76f2 LLM-as-a-Judge \u81ea\u52a8\u9a8c\u8bc1\u6d41\u7a0b\uff0c\u53d1\u73b0\u4e24\u79cd\u751f\u6210\u67b6\u6784\u8bed\u4e49\u4e00\u81f4\u6027\u8f83\u9ad8\uff0c\u540c\u65f6\u5b57\u5e55\u504f\u4fdd\u5b88\u3001\u7cbe\u786e\u7387\u9ad8\u4f46\u53ec\u56de\u7387\u8f83\u4f4e\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u9519\u8bef\u8bed\u4e49\u566a\u58f0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Combinatorial problems appear in numerous industrial applications. A common approach is to formulate these problems as declarative constraint models that can subsequently be compiled to and solved by a range of back-end solvers. Recent work shows that Large Language Models (LLMs) can produce correct models from natural language, but even a correct model can be expensive to solve because performance remains sensitive to modelling choices. In this work, we investigate whether LLMs can automate performance-oriented model reformulation. Inspired by Automatic Heuristic Design (AHD), we use an evolutionary framework in which an LLM proposes candidate reformulations that are verified and benchmarked against the user-defined baseline model. We compare AHD-adapted search strategies that control which prior attempts, instructions, and measured feedback enter each prompt. Existing retention strategies prioritize recency or performance, but do not explicitly diversify the context. To cover this gap, we introduce Profile-Diverse Retention (PDR), which applies Maximal Marginal Relevance (MMR) to instance-level runtime vectors to retain behaviourally diverse attempts. We systematically evaluate the strategies on eight CSPLib problems using validation-based final model selection. The results show that: (i) iterative reformulation can produce substantial held-out speedups; (ii) strategies that keep the retained context diverse outperform those that retain only recent or the fastest attempts; and (iii) validation-based selection improves the held-out speedup of every strategy.", "arxiv_id": "2607.28268", "arxiv_url": "https://arxiv.org/abs/2607.28268", "authors": ["Kostis Michailidis", "Dimos Tsouros", "Nguyen Dang", "Tias Guns"], "brief": "\u672c\u6587\u7528\u5927\u8bed\u8a00\u6a21\u578b\u5f15\u5bfc\u8fdb\u5316\u5f0f\u641c\u7d22\uff0c\u81ea\u52a8\u5bf9\u7ea6\u675f\u6a21\u578b\u8fdb\u884c\u9762\u5411\u6c42\u89e3\u6548\u7387\u7684\u91cd\u6784\uff0c\u5e76\u901a\u8fc7\u9a8c\u8bc1\u4e0e\u57fa\u51c6\u6d4b\u8bd5\u7b5b\u9009\u5019\u9009\u6a21\u578b\u3002\u63d0\u51fa\u57fa\u4e8e\u8fd0\u884c\u65f6\u884c\u4e3a\u591a\u6837\u6027\u7684\u4fdd\u7559\u7b56\u7565 PDR\uff0c\u5728 CSPLib \u516b\u4e2a\u95ee\u9898\u4e0a\u76f8\u6bd4\u53ea\u4fdd\u7559\u6700\u65b0\u6216\u6700\u5feb\u5c1d\u8bd5\u7684\u65b9\u6cd5\u53d6\u5f97\u66f4\u597d\u7684\u6cdb\u5316\u52a0\u901f\uff0c\u9a8c\u8bc1\u96c6\u9009\u62e9\u4e5f\u8fdb\u4e00\u6b65\u63d0\u5347\u4e86\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28268", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7ea6\u675f\u6c42\u89e3", "\u8fdb\u5316\u641c\u7d22", "\u81ea\u52a8\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28268v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LLM-Guided Evolutionary Search for Constraint Model Reformulation to Improve Solver Efficiency", "tldr": "\u672c\u6587\u7528\u5927\u8bed\u8a00\u6a21\u578b\u5f15\u5bfc\u8fdb\u5316\u5f0f\u641c\u7d22\uff0c\u81ea\u52a8\u5bf9\u7ea6\u675f\u6a21\u578b\u8fdb\u884c\u9762\u5411\u6c42\u89e3\u6548\u7387\u7684\u91cd\u6784\uff0c\u5e76\u901a\u8fc7\u9a8c\u8bc1\u4e0e\u57fa\u51c6\u6d4b\u8bd5\u7b5b\u9009\u5019\u9009\u6a21\u578b\u3002\u63d0\u51fa\u57fa\u4e8e\u8fd0\u884c\u65f6\u884c\u4e3a\u591a\u6837\u6027\u7684\u4fdd\u7559\u7b56\u7565 PDR\uff0c\u5728 CSPLib \u516b\u4e2a\u95ee\u9898\u4e0a\u76f8\u6bd4\u53ea\u4fdd\u7559\u6700\u65b0\u6216\u6700\u5feb\u5c1d\u8bd5\u7684\u65b9\u6cd5\u53d6\u5f97\u66f4\u597d\u7684\u6cdb\u5316\u52a0\u901f\uff0c\u9a8c\u8bc1\u96c6\u9009\u62e9\u4e5f\u8fdb\u4e00\u6b65\u63d0\u5347\u4e86\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The online three-dimensional bin packing problem (3D-BPP) is a longstanding challenge in logistics and industrial palletizing. Recent learning-based methods use a learned policy to select among feasible candidate placements. Performance depends on the candidate generator and representation, especially in industrial settings where packings must be space-efficient, stable, compact, and balanced. However, prior work has mainly optimized the policy, while candidate generation and representation remain largely geometry-driven. We address this gap with OPAL, an operationally guided placement-aware learning framework for industrial online 3D-BPP which combines an Operationally Guided Empty-Maximal-Space generator (OG-EMS), an operational representation for each candidate placement, and a masked ranking policy trained with proximal policy optimization. OG-EMS evaluates multiple anchors within each free-space region and prioritizes low, well-supported, compact, and spatially diverse placements. An xLSTM-based Placement Encoder models dependencies among geometric and operational candidate attributes, while a lightweight recurrent core combines the resulting embeddings with the current item and pallet state to rank feasible actions. On the BED-BPP benchmark, OPAL achieves a mean space utilization of 0.49, with improvements of 15.1% from operationally guided candidate generation and 6.3% from learned ranking, while maintaining robust inference-time performance.", "arxiv_id": "2607.28257", "arxiv_url": "https://arxiv.org/abs/2607.28257", "authors": ["Dheeraj Poolavaram", "Aanchal Rajesh Chugh", "Sebastian Dorn"], "brief": "\u672c\u6587\u63d0\u51fa OPAL\uff0c\u7528\u4e8e\u5de5\u4e1a\u5728\u7ebf\u4e09\u7ef4\u88c5\u7bb1\uff0c\u5c06\u64cd\u4f5c\u7ea6\u675f\u5f15\u5bfc\u7684\u5019\u9009\u653e\u7f6e\u751f\u6210\u3001\u5019\u9009\u8868\u793a\u548c\u57fa\u4e8e PPO \u7684\u6392\u5e8f\u7b56\u7565\u7ed3\u5408\u8d77\u6765\u3002\u5b83\u5728 BED-BPP \u57fa\u51c6\u4e0a\u8fbe\u5230 0.49 \u7684\u5e73\u5747\u7a7a\u95f4\u5229\u7528\u7387\uff0c\u5019\u9009\u751f\u6210\u5e26\u6765 15.1% \u63d0\u5347\uff0c\u5b66\u4e60\u6392\u5e8f\u989d\u5916\u5e26\u6765 6.3% \u63d0\u5347\uff0c\u5e76\u4fdd\u6301\u8f83\u7a33\u5b9a\u7684\u63a8\u7406\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28257", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u88c5\u7bb1", "\u5f3a\u5316\u5b66\u4e60", "\u7269\u6d41\u4f18\u5316", "\u5de5\u4e1a\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28257v1", "published_at": "2026-07-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Operationally Guided Placement-Aware Learning for Industrial Online 3D Bin Packing", "tldr": "\u672c\u6587\u63d0\u51fa OPAL\uff0c\u7528\u4e8e\u5de5\u4e1a\u5728\u7ebf\u4e09\u7ef4\u88c5\u7bb1\uff0c\u5c06\u64cd\u4f5c\u7ea6\u675f\u5f15\u5bfc\u7684\u5019\u9009\u653e\u7f6e\u751f\u6210\u3001\u5019\u9009\u8868\u793a\u548c\u57fa\u4e8e PPO \u7684\u6392\u5e8f\u7b56\u7565\u7ed3\u5408\u8d77\u6765\u3002\u5b83\u5728 BED-BPP \u57fa\u51c6\u4e0a\u8fbe\u5230 0.49 \u7684\u5e73\u5747\u7a7a\u95f4\u5229\u7528\u7387\uff0c\u5019\u9009\u751f\u6210\u5e26\u6765 15.1% \u63d0\u5347\uff0c\u5b66\u4e60\u6392\u5e8f\u989d\u5916\u5e26\u6765 6.3% \u63d0\u5347\uff0c\u5e76\u4fdd\u6301\u8f83\u7a33\u5b9a\u7684\u63a8\u7406\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
