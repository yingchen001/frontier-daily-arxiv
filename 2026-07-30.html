i", "Long Chen", "Lei Wang", "Gaole Dai", "Pengxiang Li", "Liangyu Chen", "Yue Wang", "Steven Hoi"], "brief": "Qwen-UI-Agent \u662f\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u4f7f\u7528\u7684\u57fa\u7840 GUI \u667a\u80fd\u4f53\uff0c\u8986\u76d6\u624b\u673a\u3001\u7535\u8111\u3001\u7f51\u9875\u4e0e DeepSearch \u573a\u666f\u3002\u5b83\u7edf\u4e00\u4e86 GUI \u64cd\u4f5c\u4e0e CLI \u6267\u884c\uff0c\u5e76\u901a\u8fc7\u771f\u5b9e\u8bbe\u5907\u8fd0\u884c\u65f6\u3001\u6570\u636e\u98de\u8f6e\u548c\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u957f\u7a0b\u4efb\u52a1\u80fd\u529b\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28227", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u591a\u6837\u5316\u6c99\u76d2\u73af\u5883\u4e0e\u5927\u89c4\u6a21\u771f\u5b9e\u79fb\u52a8\u8bbe\u5907\u8fd0\u884c\u65f6\uff0c\u652f\u6301\u8de8\u5e73\u53f0\u3001\u8de8\u8bbe\u5907\u7684 GUI \u4efb\u52a1\u6267\u884c\u3002", "\u7edf\u4e00\u52a8\u4f5c\u7a7a\u95f4\u53ef\u4ea4\u7ec7 GUI \u64cd\u4f5c\u4e0e CLI \u547d\u4ee4\uff0c\u5e76\u5728\u5355\u6b21\u6a21\u578b\u54cd\u5e94\u4e2d\u751f\u6210\u6279\u91cf\u52a8\u4f5c\uff0c\u63d0\u5347\u6267\u884c\u6548\u7387\u3002", "\u91c7\u7528 AutoResearch \u5f0f\u6570\u636e\u98de\u8f6e\u4e0e\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\uff0c\u652f\u6301\u8d85\u8fc7100\u6b65\u7684\u957f\u8f68\u8ff9\u8bad\u7ec3\uff0c\u5e76\u4f7f\u7528\u8d851\u4e07\u4e2a\u5e76\u53d1\u73af\u5883\u52a0\u901f rollout\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28227v1", "published_at": "2026-07-30", "score": 0.45, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Qwen-UI-Agent Technical Report: Toward Next-Generation Real-World Centric Foundation GUI Agents", "tldr": "Qwen\u63a8\u51fa\u9762\u5411\u771f\u5b9e\u8bbe\u5907\u7684GUI\u57fa\u7840\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "Qwen-UI-Agent \u662f\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u4f7f\u7528\u7684\u57fa\u7840 GUI \u667a\u80fd\u4f53\uff0c\u8986\u76d6\u624b\u673a\u3001\u7535\u8111\u3001\u7f51\u9875\u4e0e DeepSearch \u573a\u666f\u3002\u5b83\u7edf\u4e00\u4e86 GUI \u64cd\u4f5c\u4e0e CLI \u6267\u884c\uff0c\u5e76\u901a\u8fc7\u771f\u5b9e\u8bbe\u5907\u8fd0\u884c\u65f6\u3001\u6570\u636e\u98de\u8f6e\u548c\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u957f\u7a0b\u4efb\u52a1\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 GUI \u667a\u80fd\u4f53\u4ece\u57fa\u51c6\u6d4b\u8bd5\u63a8\u8fdb\u5230\u771f\u5b9e\u8bbe\u5907\u548c\u957f\u7a0b\u5de5\u4f5c\u6d41\u573a\u666f\uff0c\u5728 MobileWorld\u3001AndroidDaily\u3001OSWorld\u3001WebArena \u7b49\u591a\u7c7b\u8bc4\u6d4b\u4e0a\u8fbe\u5230\u6216\u63a5\u8fd1\u524d\u6cbf\u6a21\u578b\u6c34\u5e73\uff0c\u5c55\u793a\u4e86\u901a\u7528\u6570\u5b57\u8bbe\u5907\u6267\u884c\u5668\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Modern recommendation models gain prediction quality by scaling feature-interaction and sequence modules, but production cost constraints cap how far systems can scale. In this work, we propose Request-Oriented Compute Sharing (ROCS), a modeling and inference paradigm that exploits a unique property of recommendation inference: each user request is evaluated against many candidates, while request-side features are shared across candidates. ROCS defers request-candidate interactions as late as possible, isolates candidate-dependent representations, and evaluates substantial portions of the model once per request rather than once per candidate, significantly improving inference efficiency while maintaining or improving prediction quality. To realize this paradigm, we develop Generalized Layer Masking (GLM) to enforce candidate isolation in feature-interaction architectures, and Deep Cross Attention (DCA) to extend request-oriented sharing to sequence architectures. To support efficient GPU deployment, we co-design In-Kernel Broadcast Optimization (IKBO) that significantly accelerates ROCS model execution. Experiments on public benchmarks show that ROCS consistently improves the quality-efficiency tradeoff across recommendation backbones. On production-scale workloads, ROCS achieves up to a 3x QPS improvement on retrieval models without quality degradation and a 0.5% relative LogLoss improvement with a 50% QPS gain on a short-form video ranking model. ROCS has been deployed across large-scale recommendation systems spanning ads and organic surfaces, retrieval and ranking stages, and more than two orders of magnitude in inference complexity, delivering significant online gains at reduced infrastructure cost.", "arxiv_id": "2607.27744", "arxiv_url": "https://arxiv.org/abs/2607.27744", "authors": ["Yuxin Chen", "Liang Luo", "Buyun Zhang", "Jian Jiao", "Boda Li", "Haoyu Wang", "Tongyi Tang", "Ao Cai", "Zijian Shen", "Zhengkai Zhang", "Wenyi Xie", "Ryan Dick", "Han Liu", "Neng Shi", "Bin Yu", "Jianbo Xiao", "Shuyao Bi", "Hongtao Yu", "Yuanwei Fang", "Zhuoran Zhao", "Sijia Chen", "Yang Chen", "Shuqi Yang", "Qianru Li", "Zikun Liu", "Wei Ling", "Sihan Zeng", "Longhao Jin", "Jiaxin Lu", "Yinbin Ma", "Jiawei Li", "Yichen Ruan", "Yong Ler Lee", "Birmingham Guan", "Zijian Li", "Jianbo Sun", "Zhengyu Zhang", "Zeliang Chen", "Xiaohan Wei", "Yuchen Hao", "GP Musumeci", "Venkatesh Ranganathan", "Yantao Yao", "Chunqiang Tang", "Wenlin Chen", "Santanu Kolay", "Ellie Dingqiao Wen"], "brief": "\u672c\u6587\u63d0\u51fa Request-Oriented Compute Sharing\uff08ROCS\uff09\u63a8\u8350\u5efa\u6a21\u4e0e\u63a8\u7406\u8303\u5f0f\uff0c\u5229\u7528\u540c\u4e00\u7528\u6237\u8bf7\u6c42\u4f1a\u5339\u914d\u5927\u91cf\u5019\u9009\u3001\u8bf7\u6c42\u4fa7\u7279\u5f81\u53ef\u590d\u7528\u7684\u7279\u70b9\uff0c\u5c06\u5927\u91cf\u8ba1\u7b97\u4ece\u201c\u6bcf\u5019\u9009\u4e00 below 40% on the rubrics, showing that FinanceGym is challenging and leaves substantial headroom. With the same open-weight backbone, FinanceHarness improves the overall rubric score from 25.3% to 32.4%. FinanceHarness is available at https://github.com/Yijia-Xiao/FinanceHarness.", "arxiv_id": "2607.27853", "arxiv_url": "https://arxiv.org/abs/2607.27853", "authors": ["Yijia Xiao", "Rujun Han", "Yanfei Chen", "Zifeng Wang", "Ke Jiang", "Zhongying CuiZhu", "Vishy Tirumalashetty", "Wei Wang", "Burak Gokturk", "Tomas Pfister", "Chen-Yu Lee"], "brief": "\u8bba\u6587\u63d0\u51fa FinanceHarness\uff0c\u4e00\u4e2a\u7aef\u5230\u7aef\u81ea\u52a8\u5316\u91d1\u878d\u6df1\u5ea6\u7814\u7a76\u6846\u67b6\uff0c\u6574\u5408\u91d1\u878d\u5de5\u5177\u3001\u4ece\u4e1a\u8005\u5de5\u4f5c\u6d41\u3001\u667a\u80fd\u4f53\u6267\u884c\u5faa\u73af\u4e0e\u5956\u52b1\u5efa\u6a21\u3002\u540c\u65f6\u6784\u5efa FinanceGym\uff0c\u7528\u5e26\u65f6\u95f4\u622a\u65ad\u7ea6\u675f\u7684\u7814\u7a76\u95ee\u9898\u548c\u8bc4\u5206\u7ec6\u5219\u8bc4\u6d4b\u91d1\u878d\u7814\u7a76\u80fd\u529b\uff0c\u907f\u514d\u672a\u6765\u4fe1\u606f\u6cc4\u6f0f\u3002", "categories": ["cs.CL", "cs.AI", "q-fin.CP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27853", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["FinanceHarness \u8986\u76d6\u73af\u5883\u4e0e\u6570\u636e\u6784\u5efa\u3001\u91d1\u878d\u5de5\u5177\u8c03\u7528\u3001\u667a\u80fd\u4f53\u5faa\u73af\u6267\u884c\u548c\u5956\u52b1\u5efa\u6a21\uff0c\u9762\u5411\u91d1\u878d\u573a\u666f\u5b9a\u5236\u6df1\u5ea6\u7814\u7a76\u6d41\u7a0b\u3002", "FinanceGym \u91c7\u7528 thesis-driven \u7814\u7a76\u95ee\u9898\uff0c\u5e76\u7ed3\u5408 cutoff \u524d\u540e\u6807\u51c6\u8bbe\u8ba1\u8bc4\u5206\u7ec6\u5219\uff0c\u4ee5\u9a8c\u8bc1\u5386\u53f2\u5206\u6790\u4e0e\u672a\u6765\u4e8b\u4ef6\u9884\u6d4b\u80fd\u529b\u3002", "\u4e13\u5bb6\u9a8c\u8bc1\u663e\u793a\u57fa\u51c6\u901a\u8fc7\u7387\u4e3a82%\uff0c\u4f46\u9886\u5148 LLM \u4e0e\u667a\u80fd\u4f53\u5728\u8bc4\u5206\u7ec6\u5219\u4e0a\u4f4e\u4e8e40%\uff1b\u540c\u4e00\u5f00\u6e90\u9aa8\u5e72\u6a21\u578b\u4e0b\uff0cFinanceHarness \u5c06\u603b\u5206\u4ece25.3%\u63d0\u5347\u523032.4%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878dAI", "\u6df1\u5ea6\u7814\u7a76", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27853v1", "published_at": "2026-07-30", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FinanceHarness: Autonomous Financial Deep Research Framework", "tldr": "\u9762\u5411\u91d1\u878d\u6df1\u5ea6\u7814\u7a76\u7684\u667a\u80fd\u4f53\u6846\u67b6\u4e0e\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FinanceHarness\uff0c\u4e00\u4e2a\u7aef\u5230\u7aef\u81ea\u52a8\u5316\u91d1\u878d\u6df1\u5ea6\u7814\u7a76\u6846\u67b6\uff0c\u6574\u5408\u91d1\u878d\u5de5\u5177\u3001\u4ece\u4e1a\u8005\u5de5\u4f5c\u6d41\u3001\u667a\u80fd\u4f53\u6267\u884c\u5faa\u73af\u4e0e\u5956\u52b1\u5efa\u6a21\u3002\u540c\u65f6\u6784\u5efa FinanceGym\uff0c\u7528\u5e26\u65f6\u95f4\u622a\u65ad\u7ea6\u675f\u7684\u7814\u7a76\u95ee\u9898\u548c\u8bc4\u5206\u7ec6\u5219\u8bc4\u6d4b\u91d1\u878d\u7814\u7a76\u80fd\u529b\uff0c\u907f\u514d\u672a\u6765\u4fe1\u606f\u6cc4\u6f0f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u901a\u7528\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u63a8\u8fdb\u5230\u9ad8\u95e8\u69db\u7684\u91d1\u878d\u7814\u7a76\u573a\u666f\uff0c\u5f3a\u8c03\u65f6\u95f4\u70b9\u53ef\u9a8c\u8bc1\u6027\u4e0e\u9632\u4fe1\u606f\u6cc4\u6f0f\uff0c\u5bf9\u91d1\u878d\u667a\u80fd\u4f53\u8bc4\u6d4b\u3001\u5de5\u5177\u5316\u7814\u7a76\u6d41\u7a0b\u548c\u5b9e\u9645\u6295\u7814\u81ea\u52a8\u5316\u90fd\u6709\u8f83\u5f3a\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "LLM agents increasingly rely on long-term memory to support multi-session interaction and personalization. However, existing agent memory systems are designed around forward-only evolution, continuously accumulating, consolidating, and overwriting knowledge, with no principled mechanism to inspect, version, or revert prior states. This makes agents brittle under corrections, concept drift, and memory corruption, particularly after they have already been exposed to subsequent information. We present ChronoMem, a semantic version-control layer for agentic memory integrated into the production-ready, open-source Agent Development Kit by Google. ChronoMem commits whole-memory snapshots at each memory write, maintains structured version histories, and supports natural-language rollback requests by mapping undo intents to concrete historical versions through hybrid lexical and semantic retrieval, rank fusion, and reranking. We further introduce a post-exposure evaluation protocol that tests whether an agent can behave counterfactually after rollback by answering queries and summarizing history as if future updates had never occurred. On long-horizon conversational benchmarks augmented with evolving memory states and rollback tasks, ChronoMem substantially improves rollback-consistent question answering and history summarization relative to prompt-only and retrieval-only baselines, while achieving strong performance in semantic version selection. To our knowledge, ChronoMem is the first open-source system and benchmark for systematic semantic global memory rollback in LLM agents.", "arxiv_id": "2607.27773", "arxiv_url": "https://arxiv.org/abs/2607.27773", "authors": ["Yongye Su", "Wujiang Xu", "Chaoji Zuo", "Elisa Bertino"], "brief": "\u8bba\u6587\u63d0\u51fa ChronoMem\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u7684\u8bed\u4e49\u7248\u672c\u63a7\u5236\u5c42\uff0c\u96c6\u6210\u5230 Google \u5f00\u6e90 Agent Development Kit\u3002\u5b83\u5728\u6bcf\u6b21\u8bb0\u5fc6\u5199\u5165\u65f6\u63d0\u4ea4\u5168\u91cf\u5feb\u7167\uff0c\u5e76\u652f\u6301\u7528\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u56de\u6eda\u5230\u5386\u53f2\u8bb0\u5fc6\u72b6\u6001\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27773", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6bcf\u6b21\u8bb0\u5fc6\u66f4\u65b0\u90fd\u4fdd\u5b58 whole-memory snapshot\uff0c\u7ef4\u62a4\u7ed3\u6784\u5316\u7248\u672c\u5386\u53f2\uff0c\u907f\u514d\u4ec5\u5411\u524d\u7d2f\u79ef\u5bfc\u81f4\u7684\u8bb0\u5fc6\u6c61\u67d3\u4e0d\u53ef\u9006", "\u901a\u8fc7\u8bcd\u6cd5\u68c0\u7d22\u3001\u8bed\u4e49\u68c0\u7d22\u3001rank fusion \u4e0e\u91cd\u6392\u5e8f\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u64a4\u9500\u610f\u56fe\u6620\u5c04\u5230\u5177\u4f53\u5386\u53f2\u7248\u672c", "\u63d0\u51fa post-exposure \u8bc4\u6d4b\u534f\u8bae\uff0c\u68c0\u9a8c\u667a\u80fd\u4f53\u56de\u6eda\u540e\u80fd\u5426\u50cf\u4ece\u672a\u89c1\u8fc7\u540e\u7eed\u4fe1\u606f\u4e00\u6837\u56de\u7b54\u95ee\u9898\u548c\u603b\u7ed3\u5386\u53f2"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u7248\u672c\u63a7\u5236", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27773v1", "published_at": "2026-07-30", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ChronoMem: Version Control and Semantic Rollback for Large Language Model Agent Memory", "tldr": "\u4e3aLLM\u667a\u80fd\u4f53\u8bb0\u5fc6\u52a0\u5165\u8bed\u4e49\u7248\u672c\u56de\u6eda", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ChronoMem\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u7684\u8bed\u4e49\u7248\u672c\u63a7\u5236\u5c42\uff0c\u96c6\u6210\u5230 Google \u5f00\u6e90 Agent Development Kit\u3002\u5b83\u5728\u6bcf\u6b21\u8bb0\u5fc6\u5199\u5165\u65f6\u63d0\u4ea4\u5168\u91cf\u5feb\u7167\uff0c\u5e76\u652f\u6301\u7528\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u56de\u6eda\u5230\u5386\u53f2\u8bb0\u5fc6\u72b6\u6001\u3002", "why_notable": "\u957f\u671f\u8bb0\u5fc6\u662f\u5b9e\u7528\u578b LLM \u667a\u80fd\u4f53\u7684\u5173\u952e\u80fd\u529b\uff0c\u4f46\u73b0\u6709\u7cfb\u7edf\u7f3a\u5c11\u53ef\u68c0\u67e5\u3001\u53ef\u56de\u9000\u7684\u673a\u5236\u3002ChronoMem \u9996\u6b21\u7cfb\u7edf\u5316\u63d0\u4f9b\u5f00\u6e90\u7684\u5168\u5c40\u8bed\u4e49\u8bb0\u5fc6\u56de\u6eda\u7cfb\u7edf\u4e0e\u57fa\u51c6\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u591a\u8f6e\u3001\u591a\u4f1a\u8bdd\u667a\u80fd\u4f53\u5728\u7ea0\u9519\u3001\u6982\u5ff5\u6f02\u79fb\u548c\u8bb0\u5fc6\u6c61\u67d3\u573a\u666f\u4e0b\u7684\u53ef\u9760\u6027\u3002"}, {"abstract": "Agentic vision-language models (VLMs), which interleave textual reasoning with explicit tool calls such as cropping and code-based image manipulation, have emerged as a compelling paradigm for reliable and interpretable multimodal reasoning. However, recent studies have revealed that such models often use tools unfaithfully. Many process images are irrelevant to the question (e.g., the tool crops the wrong region or misses the queried target), yet the call still receives full credit and the model still answers correctly. Such decorative or misaligned tool calls waste computation and reveal that the model leans on prior knowledge or the original image rather than the evidence it retrieves. This may stem from two limitations of prevailing methods: the tool reward fails to distinguish useful from useless calls, and tool feedback carries no signal of usefulness. To this end, we introduce FaithEyes, a multi-agent self-judging framework. Concretely, we use a VLM to judge whether each process image helps answer the question. The judgement is injected into the reasoning context as part of the tool observation to help subsequent reasoning, and meanwhile is used to scale the tool reward by the helpful-tool ratio to suppress reward hacking. To keep judgement available at evaluation and thus ensure train-test consistency, we further design a multi-agent framework where the model itself serves as a subagent to judge the tool calls from main agent, eliminating any dependence on an external model at inference. Training via a two-stage SFT + RL pipeline on adapted open-source data, FaithEyes attains competitive or superior accuracy across visual perception and reasoning benchmarks, while markedly improving tool faithfulness. The homepage is at https://github.com/Mosi-AI/FaithEyes.", "arxiv_id": "2607.28225", "arxiv_url": "https://arxiv.org/abs/2607.28225", "authors": ["Haoqing Wang", "Xingrun Xing", "Wei Xia", "Ziheng Li", "Yehui Tang"], "brief": "FaithEyes \u63d0\u51fa\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u81ea\u8bc4\u6846\u67b6\uff0c\u8ba9 VLM \u5224\u65ad\u6bcf\u6b21\u88c1\u526a\u3001\u56fe\u50cf\u5904\u7406\u7b49\u5de5\u5177\u8c03\u7528\u751f\u6210\u7684\u8fc7\u7a0b\u56fe\u662f\u5426\u771f\u6b63\u6709\u52a9\u4e8e\u56de\u7b54\u95ee\u9898\u3002\u8be5\u5224\u65ad\u65e2\u4f5c\u4e3a\u5de5\u5177\u89c2\u5bdf\u53cd\u9988\u6ce8\u5165\u63a8\u7406\u4e0a\u4e0b\u6587\uff0c\u4e5f\u7528\u4e8e\u6309\u201c\u6709\u7528\u5de5\u5177\u6bd4\u4f8b\u201d\u7f29\u653e\u5956\u52b1\uff0c\u51cf\u5c11\u88c5\u9970\u6027\u5de5\u5177\u8c03\u7528\u548c\u5956\u52b1\u6295\u673a\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28225", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9 agentic VLM \u4e2d\u5de5\u5177\u8c03\u7528\u4e0d\u5fe0\u5b9e\u7684\u95ee\u9898\uff1a\u6a21\u578b\u53ef\u80fd\u88c1\u9519\u533a\u57df\u6216\u751f\u6210\u65e0\u5173\u8fc7\u7a0b\u56fe\uff0c\u5374\u4ecd\u56e0\u6700\u7ec8\u7b54\u5bf9\u800c\u83b7\u5f97\u5b8c\u6574\u5956\u52b1\u3002", "\u901a\u8fc7\u5b50\u667a\u80fd\u4f53\u5bf9\u4e3b\u667a\u80fd\u4f53\u7684\u5de5\u5177\u8c03\u7528\u8fdb\u884c\u6709\u7528\u6027\u5224\u65ad\uff0c\u4f7f\u8bad\u7ec3\u4e0e\u63a8\u7406\u9636\u6bb5\u90fd\u80fd\u83b7\u5f97\u4e00\u81f4\u7684\u5de5\u5177\u6709\u6548\u6027\u53cd\u9988\uff0c\u65e0\u9700\u4f9d\u8d56\u5916\u90e8\u8bc4\u4f30\u6a21\u578b\u3002", "\u91c7\u7528\u4e24\u9636\u6bb5 SFT + RL \u8bad\u7ec3\uff0c\u5728\u89c6\u89c9\u611f\u77e5\u4e0e\u63a8\u7406\u57fa\u51c6\u4e0a\u4fdd\u6301\u6216\u63d0\u5347\u51c6\u786e\u7387\uff0c\u540c\u65f6\u663e\u8457\u6539\u5584\u5de5\u5177\u8c03\u7528\u7684\u5fe0\u5b9e\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28225v1", "published_at": "2026-07-30", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FaithEyes: Towards Faithful Tool Use via Multi-Agent Process-Image Verification", "tldr": "\u7528\u591a\u667a\u80fd\u4f53\u9a8c\u8bc1\u63d0\u5347VLM\u5de5\u5177\u8c03\u7528\u5fe0\u5b9e\u6027", "upvotes": 0, "what_it_is": "FaithEyes \u63d0\u51fa\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u81ea\u8bc4\u6846\u67b6\uff0c\u8ba9 VLM \u5224\u65ad\u6bcf\u6b21\u88c1\u526a\u3001\u56fe\u50cf\u5904\u7406\u7b49\u5de5\u5177\u8c03\u7528\u751f\u6210\u7684\u8fc7\u7a0b\u56fe\u662f\u5426\u771f\u6b63\u6709\u52a9\u4e8e\u56de\u7b54\u95ee\u9898\u3002\u8be5\u5224\u65ad\u65e2\u4f5c\u4e3a\u5de5\u5177\u89c2\u5bdf\u53cd\u9988\u6ce8\u5165\u63a8\u7406\u4e0a\u4e0b\u6587\uff0c\u4e5f\u7528\u4e8e\u6309\u201c\u6709\u7528\u5de5\u5177\u6bd4\u4f8b\u201d\u7f29\u653e\u5956\u52b1\uff0c\u51cf\u5c11\u88c5\u9970\u6027\u5de5\u5177\u8c03\u7528\u548c\u5956\u52b1\u6295\u673a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5173\u6ce8\u70b9\u4ece\u201c\u6700\u7ec8\u7b54\u6848\u6b63\u786e\u201d\u63a8\u8fdb\u5230\u201c\u5de5\u5177\u8bc1\u636e\u662f\u5426\u771f\u7684\u652f\u6301\u63a8\u7406\u201d\uff0c\u6709\u52a9\u4e8e\u6784\u5efa\u66f4\u53ef\u89e3\u91ca\u3001\u66f4\u53ef\u9760\u7684\u591a\u6a21\u6001\u667a\u80fd\u4f53\uff0c\u5e76\u4e3a\u5de5\u5177\u4f7f\u7528\u578b VLM \u7684\u5956\u52b1\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u5b9e\u7528\u65b9\u6848\u3002"}, {"abstract": "Retrieving past experiences has become a common strategy to enhance large language model agents. However, most existing memory-augmented agents treat retrieved experiences as static records to be replayed verbatim, injecting them into the context regardless of whether they align with the agent\u0027s current situation. This ``replay\u0027\u0027 paradigm ignores the gap between the abstract, general nature of stored experience and the concrete, ever-changing states encountered at decision time, frequently causing negative transfer. In contrast, humans rarely recall past experiences verbatim; instead, they reorganize and adapt retrieved memories to fit the present context. Inspired by this, we propose MemHarness, a framework that equips LLM agents to actively harness and reconstruct past experiences based on the present context. At each decision step, a unified policy model critiques and reconstructs the retrieved experience conditioned on the current state, producing context-grounded guidance before acting. This reconstructive ability emerges naturally through end-to-end training with GRPO. Experiments on ALFWorld and WebShop show that MemHarness substantially outperforms pure RL and static memory-augmented baselines, demonstrating strong robustness in out-of-distribution (OOD) scenarios. Furthermore, our analyses reveal that this reconstruction objective not only prevents negative transfer but also serves as latent guidance during training, fundamentally improving the agent\u0027s intrinsic reasoning capabilities.", "arxiv_id": "2607.28272", "arxiv_url": "https://arxiv.org/abs/2607.28272", "authors": ["Rong Wu", "Daocheng Fu", "Licheng Wen", "Xuemeng Yang", "Shu Zou", "Jianbiao Mei", "Yuxin Wang", "Hairong Zhang", "Yu Yang", "Tao Hu", "Cong Zhang", "Botian Shi", "Pinlong Cai"], "brief": "\u8bba\u6587\u63d0\u51fa MemHarness\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8bb0\u5fc6\u91cd\u6784\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u5c06\u68c0\u7d22\u5230\u7684\u7ecf\u9a8c\u539f\u6837\u56de\u653e\uff0c\u800c\u662f\u5728\u6bcf\u4e2a\u51b3\u7b56\u6b65\u7531\u7edf\u4e00\u7b56\u7565\u6a21\u578b\u7ed3\u5408\u5f53\u524d\u72b6\u6001\u6279\u5224\u3001\u6539\u5199\u7ecf\u9a8c\uff0c\u751f\u6210\u66f4\u8d34\u5408\u60c5\u5883\u7684\u884c\u52a8\u6307\u5bfc\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/KnowledgeXLab/MemHarness", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.28272", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u9759\u6001\u8bb0\u5fc6\u56de\u653e\u4f1a\u56e0\u5386\u53f2\u7ecf\u9a8c\u4e0e\u5f53\u524d\u72b6\u6001\u4e0d\u5339\u914d\u5bfc\u81f4\u8d1f\u8fc1\u79fb", "\u901a\u8fc7\u7aef\u5230\u7aef GRPO \u8bad\u7ec3\uff0c\u4f7f\u6a21\u578b\u5b66\u4f1a\u5bf9\u68c0\u7d22\u7ecf\u9a8c\u8fdb\u884c\u6279\u5224\u4e0e\u4e0a\u4e0b\u6587\u91cd\u6784", "\u5728 ALFWorld \u548c WebShop \u4e0a\u4f18\u4e8e\u7eaf\u5f3a\u5316\u5b66\u4e60\u4e0e\u9759\u6001\u8bb0\u5fc6\u589e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u5728 OOD \u573a\u666f\u4e2d\u66f4\u9c81\u68d2"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "KnowledgeXLab@Shanghai AI Lab", "pdf_url": "https://arxiv.org/pdf/2607.28272v1", "published_at": "2026-07-30", "score": 0.402, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28272.png", "title": "MemHarness: Memory Is Reconstructed, Not Replayed", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u6309\u5f53\u524d\u60c5\u5883\u91cd\u6784\u8bb0\u5fc6\u518d\u884c\u52a8", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa MemHarness\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u8bb0\u5fc6\u91cd\u6784\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u5c06\u68c0\u7d22\u5230\u7684\u7ecf\u9a8c\u539f\u6837\u56de\u653e\uff0c\u800c\u662f\u5728\u6bcf\u4e2a\u51b3\u7b56\u6b65\u7531\u7edf\u4e00\u7b56\u7565\u6a21\u578b\u7ed3\u5408\u5f53\u524d\u72b6\u6001\u6279\u5224\u3001\u6539\u5199\u7ecf\u9a8c\uff0c\u751f\u6210\u66f4\u8d34\u5408\u60c5\u5883\u7684\u884c\u52a8\u6307\u5bfc\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u8bb0\u5fc6\u4ece\u201c\u68c0\u7d22\u540e\u590d\u7528\u201d\u63a8\u8fdb\u5230\u201c\u68c0\u7d22\u540e\u9002\u914d\u201d\uff0c\u66f4\u63a5\u8fd1\u4eba\u7c7b\u8bb0\u5fc6\u4f7f\u7528\u65b9\u5f0f\uff1b\u540c\u65f6\u8868\u660e\u8bb0\u5fc6\u91cd\u6784\u4e0d\u4ec5\u7f13\u89e3\u8d1f\u8fc1\u79fb\uff0c\u8fd8\u80fd\u4f5c\u4e3a\u8bad\u7ec3\u4e2d\u7684\u6f5c\u5728\u6307\u5bfc\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u81ea\u8eab\u63a8\u7406\u80fd\u529b\u3002"}, {"abstract": "LLM agents increasingly act as autonomous merchants that write their own product listings, and under competitive pressure, they fabricate attributes to win sales. Even under instructions to be honest, they fabricate attributes in a majority of listings across models. A platform\u0027s obvious remedy---verifying each claim against the truth---is unavailable, because it observes only a noisy, biased complaint signal, never the ground truth. We design CARP, a reputation-penalty mechanism with a deadband that forgives complaint noise and a state-dependent severity that counters reputation-driven detection erosion. CARP requires no product-level ground truth and is robust to strategic gaming. CARP protects consumers by suppressing the sales volume of low-rated liars while sparing honest sellers. Paired with SPARC, it closes most of the consumer-welfare gap relative to a perfect-information oracle, without ever accessing the truth. It also achieves the best welfare of the policies we compare. We further show that this felt penalty becomes behaviorally binding through SPARC, a byte-clean code-gated reflection mechanism: LLM merchants fabricate when lying is free but restrain themselves when fabrication costs them sales, a self-interested response rather than compliance. We trace this distinction to penalty-gated self-correction reasoning, and observe the binding across models, with supporting confidence intervals.", "arxiv_id": "2607.28330", "arxiv_url": "https://arxiv.org/abs/2607.28330", "authors": ["Mingdai Yang", "Shicheng Fan", "Kejing Yu", "Duohao Wang", "Li Sun", "Hao Peng", "Philip S. Yu", "Zhiwei Liu"], "brief": "\u8bba\u6587\u63d0\u51faCARP\u58f0\u8a89\u60e9\u7f5a\u673a\u5236\uff0c\u7528\u5e26\u5bb9\u5fcd\u533a\u95f4\u548c\u72b6\u6001\u4f9d\u8d56\u60e9\u7f5a\u7684\u6295\u8bc9\u4fe1\u53f7\u6291\u5236LLM\u5546\u5bb6\u865a\u5047\u5546\u54c1\u63cf\u8ff0\u3002\u5b83\u65e0\u9700\u9a8c\u8bc1\u5546\u54c1\u771f\u5b9e\u5c5e\u6027\uff0c\u5e76\u7ed3\u5408SPARC\u53cd\u601d\u673a\u5236\u8ba9\u60e9\u7f5a\u8f6c\u5316\u4e3a\u5b9e\u9645\u7684\u81ea\u5229\u7ea6\u675f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28330", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u591a\u79cdLLM\u5373\u4f7f\u88ab\u8981\u6c42\u8bda\u5b9e\uff0c\u5728\u7ade\u4e89\u6027\u5546\u54c1\u5217\u8868\u4e2d\u4ecd\u4f1a\u5927\u91cf\u7f16\u9020\u5c5e\u6027", "CARP\u4ec5\u4f9d\u8d56\u6709\u566a\u58f0\u4e14\u6709\u504f\u7684\u6295\u8bc9\u4fe1\u53f7\uff0c\u901a\u8fc7\u6b7b\u533a\u8fc7\u6ee4\u8bef\u62a5\uff0c\u5e76\u7528\u72b6\u6001\u4f9d\u8d56\u60e9\u7f5a\u5e94\u5bf9\u4f4e\u58f0\u8a89\u5356\u5bb6\u68c0\u6d4b\u5f31\u5316\u95ee\u9898", "\u4e0eSPARC\u7ed3\u5408\u540e\uff0c\u53ef\u5728\u4e0d\u8bbf\u95ee\u771f\u503c\u7684\u60c5\u51b5\u4e0b\u63a5\u8fd1\u5b8c\u7f8e\u4fe1\u606f oracle \u7684\u6d88\u8d39\u8005\u798f\u5229\uff0c\u5e76\u6291\u5236\u4f4e\u8bc4\u5206\u9020\u5047\u8005\u9500\u91cf"], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5236\u8bbe\u8ba1", "LLM\u5b89\u5168", "\u58f0\u8a89\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28330v1", "published_at": "2026-07-30", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Paying for Honesty Without Knowing the Truth: Reputation-Penalty Design for LLM Marketplace Agents", "tldr": "\u65e0\u9700\u771f\u503c\u4e5f\u80fd\u60e9\u7f5aLLM\u5546\u5bb6\u9020\u5047", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faCARP\u58f0\u8a89\u60e9\u7f5a\u673a\u5236\uff0c\u7528\u5e26\u5bb9\u5fcd\u533a\u95f4\u548c\u72b6\u6001\u4f9d\u8d56\u60e9\u7f5a\u7684\u6295\u8bc9\u4fe1\u53f7\u6291\u5236LLM\u5546\u5bb6\u865a\u5047\u5546\u54c1\u63cf\u8ff0\u3002\u5b83\u65e0\u9700\u9a8c\u8bc1\u5546\u54c1\u771f\u5b9e\u5c5e\u6027\uff0c\u5e76\u7ed3\u5408SPARC\u53cd\u601d\u673a\u5236\u8ba9\u60e9\u7f5a\u8f6c\u5316\u4e3a\u5b9e\u9645\u7684\u81ea\u5229\u7ea6\u675f\u3002", "why_notable": "\u5b83\u9488\u5bf9LLM\u667a\u80fd\u4f53\u8fdb\u5165\u5546\u4e1a\u5e73\u53f0\u540e\u7684\u6fc0\u52b1\u5931\u771f\u95ee\u9898\uff0c\u7ed9\u51fa\u4e00\u79cd\u4e0d\u4f9d\u8d56\u4e8b\u5b9e\u6838\u9a8c\u7684\u673a\u5236\u8bbe\u8ba1\u65b9\u6848\uff0c\u5c55\u793a\u4e86\u901a\u8fc7\u7ecf\u6d4e\u60e9\u7f5a\u800c\u975e\u6307\u4ee4\u5408\u89c4\u6765\u7ea6\u675f\u667a\u80fd\u4f53\u884c\u4e3a\u7684\u53ef\u884c\u6027\u3002"}, {"abstract": "A single human must audit $N$ LLM agents under a budget of $B \\ll N$ audits per round, guided by self-reported confidence that may be adversarially miscalibrated and by correlated errors. We model this as budgeted noisy inspection over a two-level Gaussian copula and locate the miscalibration threshold $\u03b4^*$ past which confidence-ranked auditing is \\emph{worse} than random. Two a-priori expectations reverse: $\u03b4^*$ \\emph{rises} as the budget shrinks, and cross-family correlation is not low---shared difficulty dominates lineage. Five open-weight LLMs show operationally useless (near-constant) confidence, point estimates at or beyond the flip though CIs straddle it; a proprietary model is informative and lands below it. We give a quantitative criterion for \\emph{vacuous} oversight, and replaying policies on recorded traces confirms the ordering.", "arxiv_id": "2607.28317", "arxiv_url": "https://arxiv.org/abs/2607.28317", "authors": ["Cesare Zavattari", "Alessandro Tommasi", "Giuseppe Prencipe"], "brief": "\u8bba\u6587\u5c06\u4e00\u4e2a\u4eba\u76d1\u7ba1\u5927\u91cfLLM\u667a\u80fd\u4f53\u3001\u6bcf\u8f6e\u53ea\u80fd\u5ba1\u8ba1\u5c11\u91cf\u6837\u672c\u7684\u95ee\u9898\uff0c\u5efa\u6a21\u4e3a\u5e26\u9884\u7b97\u7684\u566a\u58f0\u68c0\u67e5\uff0c\u5e76\u8003\u8651\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u5931\u51c6\u4e0e\u9519\u8bef\u76f8\u5173\u6027\u3002\u4f5c\u8005\u63a8\u5bfc\u51fa\u7f6e\u4fe1\u5ea6\u6392\u5e8f\u5ba1\u8ba1\u52a3\u4e8e\u968f\u673a\u5ba1\u8ba1\u7684\u5931\u51c6\u9608\u503c\uff0c\u5e76\u7528\u591a\u79cdLLM\u8f68\u8ff9\u9a8c\u8bc1\u7b56\u7565\u6392\u5e8f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28317", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u4e24\u5c42\u9ad8\u65afcopula\u6a21\u578b\uff0c\u523b\u753b\u667a\u80fd\u4f53\u9519\u8bef\u7684\u65cf\u5185\u4e0e\u8de8\u65cf\u76f8\u5173\u6027\u53ca\u7f6e\u4fe1\u5ea6\u5931\u51c6\u3002", "\u53d1\u73b0\u5f53\u5931\u51c6\u8d85\u8fc7\u9608\u503c\u03b4*\u65f6\uff0c\u6309\u7f6e\u4fe1\u5ea6\u4f18\u5148\u5ba1\u8ba1\u53cd\u800c\u6bd4\u968f\u673a\u5ba1\u8ba1\u66f4\u5dee\uff1b\u4e14\u9884\u7b97\u8d8a\u7d27\uff0c\u03b4*\u53cd\u800c\u8d8a\u9ad8\u3002", "\u5b9e\u9a8c\u663e\u793a5\u4e2a\u5f00\u6e90LLM\u7684\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u8fd1\u4f3c\u5e38\u6570\u3001\u76d1\u7ba1\u4ef7\u503c\u5f88\u4f4e\uff1b\u4e00\u4e2a\u95ed\u6e90\u6a21\u578b\u7f6e\u4fe1\u5ea6\u66f4\u6709\u4fe1\u606f\u91cf\u3002"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u8bc4\u4f30", "\u4eba\u5de5\u76d1\u7763", "\u98ce\u9669\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28317v1", "published_at": "2026-07-30", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "One Human, $N$ Agents: Audit-Budget Allocation for LLM Agent Fleets under Miscalibrated, Correlated Confidence", "tldr": "\u7814\u7a76LLM\u667a\u80fd\u4f53\u7fa4\u7684\u6709\u9650\u4eba\u5de5\u5ba1\u8ba1\u5206\u914d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u4e00\u4e2a\u4eba\u76d1\u7ba1\u5927\u91cfLLM\u667a\u80fd\u4f53\u3001\u6bcf\u8f6e\u53ea\u80fd\u5ba1\u8ba1\u5c11\u91cf\u6837\u672c\u7684\u95ee\u9898\uff0c\u5efa\u6a21\u4e3a\u5e26\u9884\u7b97\u7684\u566a\u58f0\u68c0\u67e5\uff0c\u5e76\u8003\u8651\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u5931\u51c6\u4e0e\u9519\u8bef\u76f8\u5173\u6027\u3002\u4f5c\u8005\u63a8\u5bfc\u51fa\u7f6e\u4fe1\u5ea6\u6392\u5e8f\u5ba1\u8ba1\u52a3\u4e8e\u968f\u673a\u5ba1\u8ba1\u7684\u5931\u51c6\u9608\u503c\uff0c\u5e76\u7528\u591a\u79cdLLM\u8f68\u8ff9\u9a8c\u8bc1\u7b56\u7565\u6392\u5e8f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aLLM\u667a\u80fd\u4f53\u5927\u89c4\u6a21\u90e8\u7f72\u4e2d\u7684\u4eba\u5de5\u76d1\u7763\u63d0\u4f9b\u4e86\u53ef\u91cf\u5316\u5ba1\u8ba1\u51c6\u5219\uff0c\u6307\u51fa\u7f6e\u4fe1\u5ea6\u5e76\u4e0d\u603b\u662f\u53ef\u9760\u4fe1\u53f7\uff0c\u5e76\u7ed9\u51fa\u5224\u65ad\u76d1\u7763\u662f\u5426\u201c\u7a7a\u6d1e\u5316\u201d\u7684\u64cd\u4f5c\u6027\u6807\u51c6\u3002"}, {"abstract": "Migration of legacy COBOL programs to Java requires extensive testing to ensure correct functionality. This effort is often complicated by the lack of test data and the difficulty of validating all corner cases. In this paper we propose a novel agentic test-synthesis method, the \"Locksmith Loop,\" which is initiated by preparing two runtime environments: the COBOL source and the generated Java target are each instrumented with mocks and executed off-mainframe on commodity hardware, then an iterative agentic loop performs Witness Search over input mocks to penetrate program branches, followed by parity-preserving mutations. When routing boundaries are reached, an analyzer identifies a Locked Paragraph: a condition preventing deeper exploration. Across three COBOL-Java case studies, spanning two open-source programs and one internal production-like COBOL program and ranging from 430 to 4,114 source lines, Locksmith consistently improved coverage beyond input-search plateaus, reaching nearly complete coverage on the two open-source programs and 91.90% branch coverage on the internal production-like COBOL program. The generated Java matched the COBOL reference under deterministic parity checks in all accepted test cases. Through these findings we demonstrate, to the best of our knowledge, a novel approach for validating agentic coding output using a deterministic oracle.", "arxiv_id": "2607.28271", "arxiv_url": "https://arxiv.org/abs/2607.28271", "authors": ["Andras Ferenczi", "Jordan Docherty", "Mariya Bessonov", "Matthew Findlay", "Krishna Lingamneni"], "brief": "\u8bba\u6587\u63d0\u51fa\u201cLocksmith Loop\u201d\u667a\u80fd\u4f53\u6d4b\u8bd5\u5408\u6210\u65b9\u6cd5\uff0c\u7528\u4e8e\u5728COBOL\u5230Java\u8fc1\u79fb\u4e2d\u751f\u6210\u9ad8\u8986\u76d6\u6d4b\u8bd5\u5e76\u505a\u786e\u5b9a\u6027\u7b49\u4ef7\u9a8c\u8bc1\u3002\u65b9\u6cd5\u5728\u672c\u5730\u6a21\u62df\u8fd0\u884c\u6e90\u7a0b\u5e8f\u4e0e\u76ee\u6807\u7a0b\u5e8f\uff0c\u901a\u8fc7\u8f93\u5165\u89c1\u8bc1\u641c\u7d22\u3001\u4fdd\u6301\u7b49\u4ef7\u7684\u53d8\u5f02\u548c\u9501\u5b9a\u5206\u652f\u5206\u6790\u9010\u6b65\u7a81\u7834\u8986\u76d6\u74f6\u9888\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28271", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u540c\u65f6\u5bf9COBOL\u6e90\u7a0b\u5e8f\u548c\u751f\u6210\u7684Java\u76ee\u6807\u7a0b\u5e8f\u8fdb\u884cmock\u4e0e\u63d2\u6869\uff0c\u5728\u975e\u5927\u578b\u673a\u73af\u5883\u4e2d\u6267\u884c\u5e76\u505a\u786e\u5b9a\u6027parity check", "\u901a\u8fc7Witness Search\u63a2\u7d22\u8f93\u5165mock\u4ee5\u7a7f\u900f\u5206\u652f\uff0c\u518d\u7528parity-preserving mutations\u6269\u5c55\u6d4b\u8bd5\u96c6", "\u57283\u4e2aCOBOL-Java\u6848\u4f8b\u4e2d\u7a81\u7834\u8f93\u5165\u641c\u7d22\u8986\u76d6\u5e73\u53f0\u671f\uff0c\u4e24\u4e2a\u5f00\u6e90\u7a0b\u5e8f\u63a5\u8fd1\u5b8c\u5168\u8986\u76d6\uff0c\u5185\u90e8\u751f\u4ea7\u7ea7\u7a0b\u5e8f\u8fbe\u523091.90%\u5206\u652f\u8986\u76d6"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u4ee3\u7801\u8fc1\u79fb", "\u7a0b\u5e8f\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28271v1", "published_at": "2026-07-30", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Agentic Method for Deterministic Validation of Legacy Code Migration", "tldr": "\u7528\u667a\u80fd\u4f53\u6d4b\u8bd5\u5faa\u73af\u9a8c\u8bc1COBOL\u8fc1\u79fbJava", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201cLocksmith Loop\u201d\u667a\u80fd\u4f53\u6d4b\u8bd5\u5408\u6210\u65b9\u6cd5\uff0c\u7528\u4e8e\u5728COBOL\u5230Java\u8fc1\u79fb\u4e2d\u751f\u6210\u9ad8\u8986\u76d6\u6d4b\u8bd5\u5e76\u505a\u786e\u5b9a\u6027\u7b49\u4ef7\u9a8c\u8bc1\u3002\u65b9\u6cd5\u5728\u672c\u5730\u6a21\u62df\u8fd0\u884c\u6e90\u7a0b\u5e8f\u4e0e\u76ee\u6807\u7a0b\u5e8f\uff0c\u901a\u8fc7\u8f93\u5165\u89c1\u8bc1\u641c\u7d22\u3001\u4fdd\u6301\u7b49\u4ef7\u7684\u53d8\u5f02\u548c\u9501\u5b9a\u5206\u652f\u5206\u6790\u9010\u6b65\u7a81\u7834\u8986\u76d6\u74f6\u9888\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u5f0f\u6d4b\u8bd5\u751f\u6210\u7528\u4e8e\u9057\u7559\u4ee3\u7801\u8fc1\u79fb\u9a8c\u8bc1\uff0c\u63d0\u4f9b\u4e86\u786e\u5b9a\u6027oracle\u6765\u9a8c\u8bc1AI\u751f\u6210\u4ee3\u7801\u7684\u529f\u80fd\u7b49\u4ef7\u6027\uff0c\u5bf9\u4f01\u4e1a\u7ea7COBOL\u73b0\u4ee3\u5316\u548c\u53ef\u4fe1\u4ee3\u7801\u8fc1\u79fb\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generative Artificial Intelligence (GenAI) is reconstructing the digital virtual world, upgrading agents through enhancing their abilities in autonomous learning, multi-modal interaction, content generation, and collaborative decision-making. In particular, the shift from conversational chatbots to agentic AI, the most recent significant technical breakthrough of GenAI, has brought a new form of services, agentic services and Agent-as-a-Service (AaaS), in which the agent\u0027s abilities are encapsulated, such as perception, decision-making, execution, collaboration, and content generation, to provide the customized agent services to users. The metaverse is a virtual ecosystem for human life, work, creation, and entertainment, supported by the new generation of digital technologies. Through combining agentic services and the metaverse, an Agentic Metaverse Service, denoted as AMServ, is produced for metaverse business processing, as a new form of metaverse service. The AaaS in the metaverse environment, denoted as Meta-AaaS, as an approach to realize AMServ, has become a new paradigm of agentic services and service computing. This paper overviews the evolution and new features of agents and services empowered by GenAI, reveals the roles and principles of agentic services in the metaverse environment, presents the forms, characteristics, and principles of the AMServ and the Meta-AaaS, discusses the typical application examples of the AMServ and the Meta-AaaS, and finally points out the new tendencies and research directions of the AMServ and the Meta-AaaS. The AMServ and the Meta-AaaS will bring great opportunities to human society and services in the AI era, and promote the rapid development of emerging service industries in the future.", "arxiv_id": "2607.28242", "arxiv_url": "https://arxiv.org/abs/2607.28242", "authors": ["Xiaofei Xu", "Quan Z. Sheng", "Zhongjie Wang", "Boualem Benatallah", "Xiao Wang", "Ruipeng Han"], "brief": "\u672c\u6587\u7efc\u8ff0 GenAI \u9a71\u52a8\u4e0b\u667a\u80fd\u4f53\u4e0e\u670d\u52a1\u8ba1\u7b97\u7684\u6f14\u8fdb\uff0c\u63d0\u51fa Agentic Metaverse Service\uff08AMServ\uff09\u4e0e Meta-AaaS \u6982\u5ff5\u6846\u67b6\u3002\u8bba\u6587\u68b3\u7406\u5176\u89d2\u8272\u3001\u5f62\u6001\u3001\u539f\u5219\u3001\u5178\u578b\u5e94\u7528\u4e0e\u672a\u6765\u7814\u7a76\u65b9\u5411\u3002", "categories": ["cs.SE", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28242", "impact_score": 5, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u667a\u80fd\u4f53\u7684\u611f\u77e5\u3001\u51b3\u7b56\u3001\u6267\u884c\u3001\u534f\u4f5c\u4e0e\u5185\u5bb9\u751f\u6210\u80fd\u529b\u5c01\u88c5\u4e3a Agent-as-a-Service", "\u63d0\u51fa\u5728\u5143\u5b87\u5b99\u73af\u5883\u4e2d\u5b9e\u73b0\u667a\u80fd\u4f53\u670d\u52a1\u7684 Meta-AaaS \u8303\u5f0f\uff0c\u7528\u4e8e\u652f\u6491\u865a\u62df\u4e1a\u52a1\u5904\u7406", "\u8ba8\u8bba AMServ/Meta-AaaS \u7684\u5e94\u7528\u573a\u666f\u3001\u670d\u52a1\u7279\u5f81\u53ca\u5f00\u653e\u7814\u7a76\u95ee\u9898"], "keywords": ["\u667a\u80fd\u4f53", "\u5143\u5b87\u5b99", "\u670d\u52a1\u8ba1\u7b97", "\u751f\u6210\u5f0fAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28242v1", "published_at": "2026-07-30", "score": 0.275, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Metaverse Services: A New As-a-Service Paradigm", "tldr": "\u63d0\u51fa\u5143\u5b87\u5b99\u4e2d\u7684\u667a\u80fd\u4f53\u5373\u670d\u52a1\u65b0\u8303\u5f0f", "upvotes": 0, "what_it_is": "\u672c\u6587\u7efc\u8ff0 GenAI \u9a71\u52a8\u4e0b\u667a\u80fd\u4f53\u4e0e\u670d\u52a1\u8ba1\u7b97\u7684\u6f14\u8fdb\uff0c\u63d0\u51fa Agentic Metaverse Service\uff08AMServ\uff09\u4e0e Meta-AaaS \u6982\u5ff5\u6846\u67b6\u3002\u8bba\u6587\u68b3\u7406\u5176\u89d2\u8272\u3001\u5f62\u6001\u3001\u539f\u5219\u3001\u5178\u578b\u5e94\u7528\u4e0e\u672a\u6765\u7814\u7a76\u65b9\u5411\u3002", "why_notable": "\u8be5\u6587\u4ece\u670d\u52a1\u8ba1\u7b97\u89c6\u89d2\u7cfb\u7edf\u5316\u5b9a\u4e49\u4e86\u667a\u80fd\u4f53\u4e0e\u5143\u5b87\u5b99\u7ed3\u5408\u7684\u65b0\u670d\u52a1\u8303\u5f0f\uff0c\u6709\u52a9\u4e8e\u6307\u5bfc\u672a\u6765\u865a\u62df\u4e16\u754c\u4e2d\u7684\u667a\u80fd\u4f53\u5e73\u53f0\u3001\u4e1a\u52a1\u6d41\u7a0b\u548c\u65b0\u5174\u670d\u52a1\u4ea7\u4e1a\u8bbe\u8ba1\u3002"}, {"abstract": "Large language model safeguards decide whether to answer before seeing how an answer will be used. This creates a basic problem for dual-use tasks: the same answer can help an authorized professional or an attacker, while an attacker can imitate a benign request and interaction history. We separate the capability released by the model from the evidence available about downstream use. When that evidence is copyable, we derive the exact worst-case floor on attacker assistance while preserving useful answers. The result yields a safety trilemma: Useful Capability, Reliable Safety, and Open Access cannot coexist. We then show how a trusted credential can complement existing safeguards by adding hard-to-copy information that predicts actual downstream use, and identify the stronger condition needed to eliminate the floor. Evidence from dual-use evaluations, adaptive attacks, and deployed trusted-access programs supports the practical relevance of these conditions.", "arxiv_id": "2607.27951", "arxiv_url": "https://arxiv.org/abs/2607.27951", "authors": ["Pingyu Wu", "Lingyao Zhu", "Weiming Zhang", "Nenghai Yu"], "brief": "\u8bba\u6587\u4ece\u7406\u8bba\u4e0a\u5206\u6790\u53cc\u7528\u9014\u4efb\u52a1\u4e2d\u7684LLM\u5b89\u5168\u9632\u62a4\uff0c\u6307\u51fa\u4ec5\u4f9d\u8d56\u53ef\u590d\u5236\u7684\u8bf7\u6c42\u5185\u5bb9\u4e0e\u4ea4\u4e92\u5386\u53f2\uff0c\u65e0\u6cd5\u53ef\u9760\u533a\u5206\u826f\u6027\u7528\u6237\u548c\u653b\u51fb\u8005\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6709\u7528\u80fd\u529b\u3001\u53ef\u9760\u5b89\u5168\u3001\u5f00\u653e\u8bbf\u95ee\u201d\u4e0d\u53ef\u517c\u5f97\u7684\u5b89\u5168\u4e09\u96be\u56f0\u5883\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27951", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u6a21\u578b\u91ca\u653e\u7684\u80fd\u529b\u4e0e\u53ef\u89c2\u5bdf\u7684\u4e0b\u6e38\u7528\u9014\u8bc1\u636e\u5206\u79bb\uff0c\u5f62\u5f0f\u5316\u5206\u6790\u653b\u51fb\u8005\u53ef\u83b7\u5f97\u5e2e\u52a9\u7684\u6700\u574f\u60c5\u51b5\u4e0b\u754c", "\u8bc1\u660e\u5f53\u5b89\u5168\u8bc1\u636e\u53ef\u88ab\u590d\u5236\u65f6\uff0c\u653b\u51fb\u8005\u53ef\u6a21\u4eff\u826f\u6027\u4e0a\u4e0b\u6587\uff0c\u4ece\u800c\u7ed5\u8fc7\u57fa\u4e8e\u4e0a\u4e0b\u6587\u7684\u9632\u62a4", "\u63d0\u51fa\u53ef\u4fe1\u51ed\u8bc1\u53ef\u4f5c\u4e3a\u96be\u4ee5\u590d\u5236\u7684\u4e0b\u6e38\u7528\u9014\u4fe1\u53f7\uff0c\u8865\u5145\u73b0\u6709\u5b89\u5168\u673a\u5236"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u53ef\u4fe1\u8bbf\u95ee", "\u53cc\u7528\u9014\u98ce\u9669", "\u6a21\u578b\u6cbb\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27951v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Safeguards Based on Copyable Context Cannot Provide Reliable Safety for LLMs", "tldr": "\u53ef\u590d\u5236\u4e0a\u4e0b\u6587\u65e0\u6cd5\u53ef\u9760\u4fdd\u969cLLM\u5b89\u5168", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ece\u7406\u8bba\u4e0a\u5206\u6790\u53cc\u7528\u9014\u4efb\u52a1\u4e2d\u7684LLM\u5b89\u5168\u9632\u62a4\uff0c\u6307\u51fa\u4ec5\u4f9d\u8d56\u53ef\u590d\u5236\u7684\u8bf7\u6c42\u5185\u5bb9\u4e0e\u4ea4\u4e92\u5386\u53f2\uff0c\u65e0\u6cd5\u53ef\u9760\u533a\u5206\u826f\u6027\u7528\u6237\u548c\u653b\u51fb\u8005\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6709\u7528\u80fd\u529b\u3001\u53ef\u9760\u5b89\u5168\u3001\u5f00\u653e\u8bbf\u95ee\u201d\u4e0d\u53ef\u517c\u5f97\u7684\u5b89\u5168\u4e09\u96be\u56f0\u5883\u3002", "why_notable": "\u8be5\u8bba\u6587\u4e3aLLM\u53cc\u7528\u9014\u5b89\u5168\u63d0\u4f9b\u4e86\u6e05\u6670\u7684\u7406\u8bba\u8fb9\u754c\uff0c\u8bf4\u660e\u5355\u9760\u63d0\u793a\u8bcd\u5ba1\u67e5\u3001\u5bf9\u8bdd\u5386\u53f2\u7b49\u4e0a\u4e0b\u6587\u4fe1\u53f7\u96be\u4ee5\u5b9e\u73b0\u53ef\u9760\u5b89\u5168\uff0c\u5bf9\u5f00\u653e\u6a21\u578b\u6cbb\u7406\u3001\u53ef\u4fe1\u8bbf\u95ee\u673a\u5236\u548c\u9ad8\u98ce\u9669\u80fd\u529b\u7ba1\u63a7\u5177\u6709\u91cd\u8981\u542f\u793a\u3002"}, {"abstract": "Training terminal agents at scale requires diverse, verifiable terminal tasks and high-quality interaction trajectories, yet acquiring such data remains a significant challenge. Existing synthesis methods face two key limitations: (1) weak reliability caused by the disconnect between task generation and real execution, and (2) limited diversity and scalability due to dependence on existing repositories. We propose Meta-Task, a framework that redefines terminal task synthesis as a Terminal-Bench-format task itself: an agent operates within a real container environment to iteratively generate, execute, and verify tasks, so that synthesized components are checked for internal consistency and executability within the generation loop itself. Building upon this, we decouple the target task requirements along multiple dimensions, introduce a multi-phase mechanism that dynamically designs novel task specifications before producing the actual tasks, and incorporate optional external material support to enhance diversity and realism. We additionally apply LLM-as-Judge filtering to ensure the quality of the final training data. Experiments on Terminal-Bench 2.0 show that fine-tuning on only 3,221 Meta-Task synthesized trajectories achieves 22.5% and 31.8% Avg Pass@1 for Qwen3-14B and Qwen3-32B respectively, outperforming concurrent approaches with significantly less training data.", "arxiv_id": "2607.27929", "arxiv_url": "https://arxiv.org/abs/2607.27929", "authors": ["Zhihong Pan", "Jiyuan He", "Kai Zhang", "Yupeng Han", "Ze Liu", "Yuze Zhao", "Yongcong Ye", "Zhaohua Yang"], "brief": "\u8bba\u6587\u63d0\u51fa Meta-Task\uff0c\u5c06\u7ec8\u7aef\u4efb\u52a1\u5408\u6210\u91cd\u5b9a\u4e49\u4e3a Terminal-Bench \u683c\u5f0f\u4efb\u52a1\uff1a\u8ba9\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u5bb9\u5668\u4e2d\u751f\u6210\u3001\u6267\u884c\u5e76\u9a8c\u8bc1\u4efb\u52a1\u3002\u6846\u67b6\u901a\u8fc7\u591a\u9636\u6bb5\u4efb\u52a1\u89c4\u683c\u8bbe\u8ba1\u3001\u53ef\u9009\u5916\u90e8\u6750\u6599\u652f\u6301\u4e0e LLM-as-Judge \u8fc7\u6ee4\uff0c\u4ea7\u51fa\u53ef\u6267\u884c\u4e14\u9ad8\u8d28\u91cf\u7684\u8bad\u7ec3\u8f68\u8ff9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27929", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u771f\u5b9e\u5bb9\u5668\u73af\u5883\u4e2d\u95ed\u73af\u751f\u6210\u3001\u6267\u884c\u3001\u9a8c\u8bc1\u4efb\u52a1\uff0c\u964d\u4f4e\u4efb\u52a1\u63cf\u8ff0\u4e0e\u5b9e\u9645\u53ef\u6267\u884c\u6027\u8131\u8282\u5e26\u6765\u7684\u53ef\u9760\u6027\u95ee\u9898", "\u5c06\u76ee\u6807\u4efb\u52a1\u9700\u6c42\u6309\u591a\u7ef4\u5ea6\u89e3\u8026\uff0c\u5e76\u5148\u52a8\u6001\u8bbe\u8ba1\u65b0\u4efb\u52a1\u89c4\u683c\uff0c\u518d\u751f\u6210\u5177\u4f53\u4efb\u52a1\uff0c\u63d0\u5347\u591a\u6837\u6027\u4e0e\u53ef\u6269\u5c55\u6027", "\u5728 Terminal-Bench 2.0 \u4e0a\uff0c\u4ec5\u7528 3221 \u6761\u5408\u6210\u8f68\u8ff9\u5fae\u8c03 Qwen3-14B/32B\uff0cAvg Pass@1 \u5206\u522b\u8fbe 22.5% \u548c 31.8%"], "keywords": ["\u667a\u80fd\u4f53", "\u7ec8\u7aef\u4efb\u52a1", "\u6570\u636e\u5408\u6210", "LLM\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27929v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Meta-Task: Turning Terminal Task Synthesis into a Terminal Task for Scalable Agent Training", "tldr": "\u628a\u7ec8\u7aef\u4efb\u52a1\u5408\u6210\u672c\u8eab\u53d8\u6210\u53ef\u6267\u884c\u4efb\u52a1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Meta-Task\uff0c\u5c06\u7ec8\u7aef\u4efb\u52a1\u5408\u6210\u91cd\u5b9a\u4e49\u4e3a Terminal-Bench \u683c\u5f0f\u4efb\u52a1\uff1a\u8ba9\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u5bb9\u5668\u4e2d\u751f\u6210\u3001\u6267\u884c\u5e76\u9a8c\u8bc1\u4efb\u52a1\u3002\u6846\u67b6\u901a\u8fc7\u591a\u9636\u6bb5\u4efb\u52a1\u89c4\u683c\u8bbe\u8ba1\u3001\u53ef\u9009\u5916\u90e8\u6750\u6599\u652f\u6301\u4e0e LLM-as-Judge \u8fc7\u6ee4\uff0c\u4ea7\u51fa\u53ef\u6267\u884c\u4e14\u9ad8\u8d28\u91cf\u7684\u8bad\u7ec3\u8f68\u8ff9\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u6570\u636e\u5408\u6210\u8fc7\u7a0b\u5d4c\u5165\u771f\u5b9e\u7ec8\u7aef\u6267\u884c\u73af\u5883\uff0c\u663e\u8457\u63d0\u5347\u7ec8\u7aef\u667a\u80fd\u4f53\u8bad\u7ec3\u6570\u636e\u7684\u53ef\u9a8c\u8bc1\u6027\u4e0e\u6269\u5c55\u6027\uff0c\u5e76\u4ee5\u66f4\u5c11\u6570\u636e\u8d85\u8fc7\u540c\u671f\u65b9\u6cd5\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "As large vision-language models (LVLMs) are deployed globally, the combination of multilingual instructions and visual information makes malicious attacks more covert and sophisticated than ever before. However, existing methods isolate language and modality defenses, which, coupled with the scarcity of safety data and high fine-tuning costs, makes it difficult for models to defend against compound attacks. To address this severe challenge, we propose a neuron-level cross-dimensional safety alignment framework driven by modality- and language-shared safety neurons (MLS-Neurons). First, we identify monolingual and unimodal safety neurons by comparing responses to harmful and benign samples, quantifying functional saliency through activation strength and downstream impact. Then, by intersecting these unimodal neurons within each language, we extract modality-shared safety neurons (MS-Neurons) responsive to both visual and textual risks, bridging the safety representation gap between modalities. Furthermore, using English as a semantic anchor, we intersect MS-Neurons across languages to identify modality- and language-shared safety neurons (MLS-Neurons), serving as key defenses against compound attacks. Finally, we update only this minimal subset of shared neurons (~0.03% of parameters), transferring English-only safety supervision to multilingual and multimodal scenarios. Extensive experiments show that our method significantly outperforms state-of-the-art approaches across diverse multilingual and multimodal safety benchmarks while preserving general utility.", "arxiv_id": "2607.27917", "arxiv_url": "https://arxiv.org/abs/2607.27917", "authors": ["Enyi Shi", "Fei Shen", "Chuancheng Shi", "Linxia Zhu", "Shuyi Miao", "Jinhui Tang", "Tat-Seng Chua"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u795e\u7ecf\u5143\u7ea7\u8de8\u7ef4\u5ea6\u5b89\u5168\u5bf9\u9f50\u6846\u67b6\uff0c\u901a\u8fc7\u8bc6\u522b\u6a21\u6001\u4e0e\u8bed\u8a00\u5171\u4eab\u7684\u5b89\u5168\u795e\u7ecf\u5143\uff08MLS-Neurons\uff09\uff0c\u5c06\u82f1\u8bed\u5b89\u5168\u76d1\u7763\u8fc1\u79fb\u5230\u591a\u8bed\u8a00\u3001\u591a\u6a21\u6001\u573a\u666f\u3002\u65b9\u6cd5\u4ec5\u66f4\u65b0\u7ea60.03%\u7684\u53c2\u6570\uff0c\u5373\u53ef\u63d0\u5347LVLM\u5bf9\u590d\u5408\u6076\u610f\u653b\u51fb\u7684\u9632\u5fa1\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27917", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5148\u901a\u8fc7\u6709\u5bb3/\u826f\u6027\u6837\u672c\u54cd\u5e94\u5dee\u5f02\uff0c\u5b9a\u4f4d\u5355\u8bed\u3001\u5355\u6a21\u6001\u5b89\u5168\u795e\u7ecf\u5143\uff0c\u5e76\u7528\u6fc0\u6d3b\u5f3a\u5ea6\u4e0e\u4e0b\u6e38\u5f71\u54cd\u8861\u91cf\u91cd\u8981\u6027", "\u5728\u6bcf\u79cd\u8bed\u8a00\u5185\u53d6\u89c6\u89c9\u4e0e\u6587\u672c\u98ce\u9669\u54cd\u5e94\u795e\u7ecf\u5143\u4ea4\u96c6\uff0c\u5f97\u5230\u6a21\u6001\u5171\u4eab\u5b89\u5168\u795e\u7ecf\u5143\uff0c\u5f25\u5408\u6a21\u6001\u95f4\u5b89\u5168\u8868\u5f81\u5dee\u5f02", "\u4ee5\u82f1\u8bed\u4e3a\u8bed\u4e49\u951a\u70b9\u8de8\u8bed\u8a00\u53d6\u4ea4\u96c6\uff0c\u5f97\u5230MLS-Neurons\uff0c\u4ec5\u5fae\u8c03\u6781\u5c0f\u53c2\u6570\u5b50\u96c6\u5373\u53ef\u517c\u987e\u5b89\u5168\u6027\u4e0e\u901a\u7528\u80fd\u529b"], "keywords": ["\u591a\u6a21\u6001", "\u5b89\u5168\u5bf9\u9f50", "\u6a21\u578b\u7f16\u8f91", "\u591a\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27917v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "One Anchor for All: Unified Multilingual and Multimodal Safety Alignment for LVLMs", "tldr": "\u7528\u5171\u4eab\u5b89\u5168\u795e\u7ecf\u5143\u7edf\u4e00LVLM\u591a\u8bed\u591a\u6a21\u6001\u5bf9\u9f50", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u795e\u7ecf\u5143\u7ea7\u8de8\u7ef4\u5ea6\u5b89\u5168\u5bf9\u9f50\u6846\u67b6\uff0c\u901a\u8fc7\u8bc6\u522b\u6a21\u6001\u4e0e\u8bed\u8a00\u5171\u4eab\u7684\u5b89\u5168\u795e\u7ecf\u5143\uff08MLS-Neurons\uff09\uff0c\u5c06\u82f1\u8bed\u5b89\u5168\u76d1\u7763\u8fc1\u79fb\u5230\u591a\u8bed\u8a00\u3001\u591a\u6a21\u6001\u573a\u666f\u3002\u65b9\u6cd5\u4ec5\u66f4\u65b0\u7ea60.03%\u7684\u53c2\u6570\uff0c\u5373\u53ef\u63d0\u5347LVLM\u5bf9\u590d\u5408\u6076\u610f\u653b\u51fb\u7684\u9632\u5fa1\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u8bed\u8a00\u4e0e\u591a\u6a21\u6001\u5b89\u5168\u9632\u5fa1\u7edf\u4e00\u5230\u4e00\u7ec4\u5171\u4eab\u795e\u7ecf\u5143\u4e0a\uff0c\u964d\u4f4e\u4e86\u5b89\u5168\u6570\u636e\u4e0e\u5fae\u8c03\u6210\u672c\uff0c\u5e76\u9488\u5bf9\u66f4\u9690\u853d\u7684\u8de8\u8bed\u8a00\u89c6\u89c9\u653b\u51fb\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u65b9\u6848\u3002"}, {"abstract": "Recent advances in large language models (LLMs) have enabled AI systems to assist scientific research and peer review. However, an essential capability for reliable AI-assisted scientific workflows remains underexplored: verifying whether reviewer feedback leads to meaningful and evidence-supported manuscript improvements. We introduce AutoSupervision, which evaluates whether scientific manuscript revisions genuinely address reviewer concerns through grounded evidence. AutoSupervision leverages transparent peer-review records as a natural source of supervision, where reviewer comments specify scientific concerns, author responses describe claimed resolutions, and revised manuscripts provide evidence of changes. Given reviewer comments, author responses, and revised manuscripts, models must characterize reviewer concerns, determine whether concerns have been addressed, and identify supporting manuscript evidence. We construct AutoSupervision from 56,000 Nature Communications articles and corresponding review records. Then we conducted experiments on LLMs, the ablation study, and the case study. Our results show that while LLMs perform well in characterizing reviewer concerns, with GPT-5.5 achieving a score of 0.754, evidence-based verification remains the primary bottleneck, with the best-performing model reaching only 0.501.", "arxiv_id": "2607.27845", "arxiv_url": "https://arxiv.org/abs/2607.27845", "authors": ["Haobo Li", "Eunseo Jung", "Wenxiao Zhao", "Feng Liu", "Jiong Wang", "Kaiyi Xu", "Zijie Guo", "Zixin Chen", "Ben Fei", "Fenghua Ling", "Lei Bai"], "brief": "\u8bba\u6587\u63d0\u51fa AutoSupervision\uff0c\u7528\u900f\u660e\u540c\u884c\u8bc4\u5ba1\u8bb0\u5f55\u6784\u5efa\u76d1\u7763\u4efb\u52a1\uff0c\u8bc4\u4f30\u4f5c\u8005\u4fee\u8ba2\u662f\u5426\u771f\u6b63\u56de\u5e94\u5ba1\u7a3f\u610f\u89c1\u5e76\u6709\u8bba\u6587\u8bc1\u636e\u652f\u6491\u3002\u6570\u636e\u6765\u81ea 5.6 \u4e07\u7bc7 Nature Communications \u6587\u7ae0\u53ca\u5176\u8bc4\u5ba1\u8bb0\u5f55\uff0c\u8986\u76d6\u5ba1\u7a3f\u610f\u89c1\u7406\u89e3\u3001\u56de\u5e94\u5224\u5b9a\u548c\u8bc1\u636e\u5b9a\u4f4d\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27845", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4efb\u52a1\u8f93\u5165\u5305\u62ec\u5ba1\u7a3f\u610f\u89c1\u3001\u4f5c\u8005\u56de\u590d\u4e0e\u4fee\u8ba2\u7a3f\uff0c\u8981\u6c42\u6a21\u578b\u523b\u753b\u5ba1\u7a3f\u5173\u5207\u3001\u5224\u65ad\u662f\u5426\u5df2\u89e3\u51b3\uff0c\u5e76\u627e\u51fa\u652f\u6491\u6027\u4fee\u6539\u8bc1\u636e", "\u6784\u5efa\u4e86\u5927\u89c4\u6a21\u79d1\u5b66\u5de5\u4f5c\u6d41\u9a8c\u8bc1\u6570\u636e\u96c6\uff0c\u5305\u542b 56,000 \u7bc7 Nature Communications \u6587\u7ae0\u53ca\u5bf9\u5e94\u540c\u884c\u8bc4\u5ba1\u8bb0\u5f55", "\u5b9e\u9a8c\u663e\u793a LLM \u64c5\u957f\u7406\u89e3\u5ba1\u7a3f\u5173\u5207\uff0c\u4f46\u57fa\u4e8e\u8bc1\u636e\u7684\u4fee\u8ba2\u9a8c\u8bc1\u4ecd\u662f\u74f6\u9888\uff0c\u6700\u4f73\u6a21\u578b\u4ec5\u8fbe\u5230 0.501"], "keywords": ["\u79d1\u5b66\u667a\u80fd", "\u540c\u884c\u8bc4\u5ba1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc1\u636e\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27845v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AutoSupervision: Closing the Feedback Loop in Scientific Workflows with Grounded Revision Verification", "tldr": "\u7528\u540c\u884c\u8bc4\u5ba1\u8bb0\u5f55\u9a8c\u8bc1\u8bba\u6587\u4fee\u6539\u662f\u5426\u771f\u5b9e\u5145\u5206", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoSupervision\uff0c\u7528\u900f\u660e\u540c\u884c\u8bc4\u5ba1\u8bb0\u5f55\u6784\u5efa\u76d1\u7763\u4efb\u52a1\uff0c\u8bc4\u4f30\u4f5c\u8005\u4fee\u8ba2\u662f\u5426\u771f\u6b63\u56de\u5e94\u5ba1\u7a3f\u610f\u89c1\u5e76\u6709\u8bba\u6587\u8bc1\u636e\u652f\u6491\u3002\u6570\u636e\u6765\u81ea 5.6 \u4e07\u7bc7 Nature Communications \u6587\u7ae0\u53ca\u5176\u8bc4\u5ba1\u8bb0\u5f55\uff0c\u8986\u76d6\u5ba1\u7a3f\u610f\u89c1\u7406\u89e3\u3001\u56de\u5e94\u5224\u5b9a\u548c\u8bc1\u636e\u5b9a\u4f4d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 AI \u8f85\u52a9\u79d1\u7814\u4ece\u751f\u6210\u5efa\u8bae\u63a8\u8fdb\u5230\u201c\u95ed\u73af\u9a8c\u8bc1\u201d\uff0c\u5173\u6ce8\u4fee\u6539\u662f\u5426\u771f\u5b9e\u3001\u6709\u636e\u3001\u53ef\u5ba1\u8ba1\uff0c\u5bf9\u81ea\u52a8\u5316\u540c\u884c\u8bc4\u5ba1\u3001\u79d1\u7814\u5199\u4f5c\u52a9\u624b\u548c\u53ef\u9760\u79d1\u5b66\u5de5\u4f5c\u6d41\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model unlearning is consistently fragile under relearn attacks. On TOFU, fine-tuning on twenty forget examples substantially recovers held-out forget-set ROUGE for every method we evaluate, and we trace this fragility to optimization geometry. The per-token answer margin of fourteen post-hoc methods spanning gradient, preference, and distillation families converges into a narrow band above the retain reference in 41 of 42 method--size cells, a regularity we call the margin cliff. We prove that this cliff follows whenever the retain coupling holds the diagnostic log-odds of forget content above a floor, a condition that token-saturating losses induce at stationarity and that we verify directly on 34 of 42 cells. Margin Calibration (\\textsc{MC}) is a plug-in polish adding a non-saturating margin hinge anchored at the reference\u0027s per-token margin plus a KL probe on a disjoint instruction corpus, restoring forget-side pressure where the native loss saturates. Under a stated gradient-dominance condition, whose on-trajectory gradient signature we measure by instrumenting the polish, its stationary set lies on the cliff-crossing side, yielding an attack-budget upper bound on the relearn margin lift. Across TOFU (three Llama-3 sizes, three forget tiers), MUSE-News on Llama-2-7B-hf, and a Phi-3.5 panel, a single frozen configuration wins all 14 head-to-head forget aggregates and all populated relearn cells (panel-mean post-attack ROUGE-L $0.41$ to $0.18$) and lowers raw membership AUC on 13/14, with reduced retain-side utility as the main cost. A deployment variant matches these gains without a retain-trained reference.", "arxiv_id": "2607.27836", "arxiv_url": "https://arxiv.org/abs/2607.27836", "authors": ["Xiangyu Yin", "Jiaxu Liu", "Zhen Chen", "Chih-Hong Cheng"], "brief": "\u8bba\u6587\u7cfb\u7edf\u5206\u6790\u4e86\u591a\u7c7bLLM\u53cd\u9057\u5fd8\u65b9\u6cd5\u5728\u91cd\u5b66\u653b\u51fb\u4e0b\u7684\u8106\u5f31\u6027\uff0c\u5e76\u63d0\u51fa\u201cmargin cliff\u201d\u89e3\u91ca\uff1a\u9057\u5fd8\u5185\u5bb9\u7684\u9010token\u7b54\u6848\u8fb9\u9645\u4f1a\u6536\u655b\u5230\u63a5\u8fd1\u4fdd\u7559\u53c2\u8003\u6a21\u578b\u7684\u7a84\u533a\u95f4\u3002\u4f5c\u8005\u63d0\u51fa\u5373\u63d2\u5373\u7528\u7684Margin Calibration\uff0c\u901a\u8fc7\u975e\u9971\u548c\u8fb9\u9645\u94f0\u94fe\u635f\u5931\u548cKL\u63a2\u9488\u7ee7\u7eed\u65bd\u538b\u9057\u5fd8\u5185\u5bb9\uff0c\u4ece\u800c\u589e\u5f3a\u6297\u91cd\u5b66\u9c81\u68d2\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27836", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728TOFU\u4e0a\uff0c\u4ec5\u752820\u4e2a\u9057\u5fd8\u6837\u672c\u5fae\u8c03\u5373\u53ef\u663e\u8457\u6062\u590d\u5404\u65b9\u6cd5\u7684\u9057\u5fd8\u96c6ROUGE\uff0c\u8bf4\u660e\u73b0\u6709unlearning\u666e\u904d\u6613\u88ab\u91cd\u5b66\u653b\u51fb\u51fb\u7a7f\u3002", "\u8bc4\u4f30\u8986\u76d6\u68af\u5ea6\u3001\u504f\u597d\u3001\u84b8\u998f\u7b4914\u79cd\u540e\u5904\u7406\u9057\u5fd8\u65b9\u6cd5\uff0c\u572841/42\u4e2a\u65b9\u6cd5-\u6a21\u578b\u89c4\u6a21\u7ec4\u5408\u4e2d\u89c2\u5bdf\u5230\u7edf\u4e00\u7684\u201cmargin cliff\u201d\u73b0\u8c61\u3002", "Margin Calibration\u5728TOFU\u3001MUSE-News\u548cPhi-3.5\u9762\u677f\u4e2d\u53d6\u5f9714/14\u4e2a\u9057\u5fd8\u805a\u5408\u6307\u6807\u80dc\u51fa\uff0c\u5e73\u5747\u653b\u51fb\u540eROUGE-L\u4ece0.41\u964d\u81f30.18\uff0c\u4f46\u4ee3\u4ef7\u662f\u4fdd\u7559\u4fa7\u80fd\u529b\u6709\u6240\u4e0b\u964d\u3002"], "keywords": ["\u6a21\u578b\u9057\u5fd8", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9c81\u68d2\u6027", "\u5b89\u5168\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27836v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Crossing the Margin Cliff: Toward Relearn-Robust LLM Unlearning via Margin Calibration", "tldr": "\u7528\u8fb9\u9645\u6821\u51c6\u63d0\u5347LLM\u9057\u5fd8\u6297\u91cd\u5b66\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u5206\u6790\u4e86\u591a\u7c7bLLM\u53cd\u9057\u5fd8\u65b9\u6cd5\u5728\u91cd\u5b66\u653b\u51fb\u4e0b\u7684\u8106\u5f31\u6027\uff0c\u5e76\u63d0\u51fa\u201cmargin cliff\u201d\u89e3\u91ca\uff1a\u9057\u5fd8\u5185\u5bb9\u7684\u9010token\u7b54\u6848\u8fb9\u9645\u4f1a\u6536\u655b\u5230\u63a5\u8fd1\u4fdd\u7559\u53c2\u8003\u6a21\u578b\u7684\u7a84\u533a\u95f4\u3002\u4f5c\u8005\u63d0\u51fa\u5373\u63d2\u5373\u7528\u7684Margin Calibration\uff0c\u901a\u8fc7\u975e\u9971\u548c\u8fb9\u9645\u94f0\u94fe\u635f\u5931\u548cKL\u63a2\u9488\u7ee7\u7eed\u65bd\u538b\u9057\u5fd8\u5185\u5bb9\uff0c\u4ece\u800c\u589e\u5f3a\u6297\u91cd\u5b66\u9c81\u68d2\u6027\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u4e0d\u4ec5\u63d0\u51fa\u4e86\u4e00\u4e2a\u89e3\u91caLLM\u9057\u5fd8\u8106\u5f31\u6027\u7684\u4f18\u5316\u51e0\u4f55\u673a\u5236\uff0c\u8fd8\u7ed9\u51fa\u53ef\u63d2\u62d4\u7684\u6539\u8fdb\u65b9\u6cd5\u548c\u8de8\u6570\u636e\u96c6\u9a8c\u8bc1\uff0c\u5bf9\u6784\u5efa\u66f4\u53ef\u4fe1\u3001\u6297\u653b\u51fb\u7684\u6a21\u578b\u9057\u5fd8\u6280\u672f\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Persistent memory lets long-running large language model agents reuse information across sessions and tasks. Yet errors in writable memory can persist and corrupt future behavior. Existing systems improve storage and retrieval, but they do not provide a transaction boundary for reliable updates and recovery. We therefore propose MemTxn, a governance layer outside the answer model. MemTxn verifies whether an update is supported by its source. It also selects the visible version when facts conflict and restores the application-visible state after a fault. The system uses Ordered PatchTest to validate writes, a Temporal Resolver to select versions, and a durable snapshot journal to recover state. On an item-disjoint audit, MemTxn accepts all 60 supported originals and rejects all 179 hard negatives. Under persistent multi-key faults on LongMemEval-S and LoCoMo states, it restores the complete declared active map without knowing the actual physical write set. On MemoryAgentBench FactConsolidation, MemTxn achieves the highest average F1 across all twelve answer-model configurations. It outperforms Dense by 17.06--24.07 points in five representative settings.", "arxiv_id": "2607.27834", "arxiv_url": "https://arxiv.org/abs/2607.27834", "authors": ["Hanshuai Cui", "Zhiqing Tang", "Zhi Yao", "Fanshuai Meng", "Qianli Ma", "Weijia Jia"], "brief": "\u8bba\u6587\u63d0\u51fa MemTxn\uff0c\u4e00\u4e2a\u4f4d\u4e8e\u56de\u7b54\u6a21\u578b\u5916\u90e8\u7684\u667a\u80fd\u4f53\u6301\u4e45\u8bb0\u5fc6\u6cbb\u7406\u5c42\uff0c\u7528\u4e8e\u9a8c\u8bc1\u5199\u5165\u662f\u5426\u6709\u6765\u6e90\u652f\u6491\u3001\u5728\u4e8b\u5b9e\u51b2\u7a81\u65f6\u9009\u62e9\u53ef\u89c1\u7248\u672c\uff0c\u5e76\u5728\u6545\u969c\u540e\u6062\u590d\u5e94\u7528\u53ef\u89c1\u72b6\u6001\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27834", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7 Ordered PatchTest \u6821\u9a8c\u8bb0\u5fc6\u66f4\u65b0\uff0c\u786e\u4fdd\u5199\u5165\u5185\u5bb9\u53ef\u7531\u539f\u59cb\u6765\u6e90\u652f\u6301\uff0c\u964d\u4f4e\u9519\u8bef\u8bb0\u5fc6\u957f\u671f\u6c61\u67d3\u98ce\u9669", "\u5f15\u5165 Temporal Resolver \u5904\u7406\u51b2\u7a81\u4e8b\u5b9e\u7684\u7248\u672c\u9009\u62e9\uff0c\u5e76\u7528\u6301\u4e45\u5feb\u7167\u65e5\u5fd7\u6062\u590d\u5b8c\u6574\u6d3b\u8dc3\u72b6\u6001", "\u5728\u5ba1\u8ba1\u6d4b\u8bd5\u4e2d\u63a5\u53d7\u5168\u90e860\u4e2a\u53d7\u652f\u6301\u539f\u59cb\u9879\u3001\u62d2\u7edd\u5168\u90e8179\u4e2a\u56f0\u96be\u8d1f\u4f8b\uff1b\u5728 MemoryAgentBench FactConsolidation \u4e0a\u53d6\u5f9712\u79cd\u56de\u7b54\u6a21\u578b\u914d\u7f6e\u7684\u6700\u9ad8\u5e73\u5747F1"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7ba1\u7406", "\u53ef\u9760\u6027", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27834v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MemTxn: A Transaction Boundary for Source-Supported Updates and Complete-State Recovery in Agent Memory", "tldr": "\u4e3a\u667a\u80fd\u4f53\u8bb0\u5fc6\u52a0\u5165\u53ef\u9760\u4e8b\u52a1\u8fb9\u754c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MemTxn\uff0c\u4e00\u4e2a\u4f4d\u4e8e\u56de\u7b54\u6a21\u578b\u5916\u90e8\u7684\u667a\u80fd\u4f53\u6301\u4e45\u8bb0\u5fc6\u6cbb\u7406\u5c42\uff0c\u7528\u4e8e\u9a8c\u8bc1\u5199\u5165\u662f\u5426\u6709\u6765\u6e90\u652f\u6491\u3001\u5728\u4e8b\u5b9e\u51b2\u7a81\u65f6\u9009\u62e9\u53ef\u89c1\u7248\u672c\uff0c\u5e76\u5728\u6545\u969c\u540e\u6062\u590d\u5e94\u7528\u53ef\u89c1\u72b6\u6001\u3002", "why_notable": "\u6301\u4e45\u8bb0\u5fc6\u662f\u957f\u7a0b LLM \u667a\u80fd\u4f53\u7684\u91cd\u8981\u57fa\u7840\u8bbe\u65bd\uff0c\u4f46\u9519\u8bef\u5199\u5165\u4f1a\u8de8\u4f1a\u8bdd\u653e\u5927\u5f71\u54cd\u3002MemTxn \u5c06\u6570\u636e\u5e93\u5f0f\u4e8b\u52a1\u4e0e\u6062\u590d\u601d\u60f3\u5f15\u5165\u667a\u80fd\u4f53\u8bb0\u5fc6\u7ba1\u7406\uff0c\u63d0\u5347\u4e86\u8bb0\u5fc6\u66f4\u65b0\u7684\u53ef\u9a8c\u8bc1\u6027\u3001\u51b2\u7a81\u5904\u7406\u548c\u6545\u969c\u6062\u590d\u80fd\u529b\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "User foundation models have demonstrated strong results in e-commerce and social recommendation, but most industrial deployments assume environments where user identity is stable and persistent. Open-web real-time bidding (RTB) operates on a structurally different data distribution: user identity is fragmented and non-persistent across browsing sessions, and the availability of browsing history depends on user privacy choices. Consequently, a significant portion of traffic carries no historical data, and available records often consist of relatively short, disjointed sessions. As a result, historical signals in this domain are typically represented as aggregated counters and recency buckets, leaving the sequential structure unexploited. To address this limitation, we present a user foundation model that applies self-supervised learning on user browsing histories and show that the learned representation improves multiple downstream production tasks, demonstrating the viability of this approach on the open web. We pre-train a Transformer encoder with masked language modeling and a sequence-level contrastive objective, then fine-tune it on the click prediction task. We optimize the encoder\u0027s pre-training pipeline with an LLM-in-the-loop search over a curated catalog of reviewable, code-level edits (lifters), instantiating the LLM-as-optimizer paradigm in an industrial setting. The same encoder representation yields +1.197% RIG on the production bid win-rate model and +1.354% RIG on the production CTR ranker; a 7-day live A/B test confirms +2.13% CTR, -1.13% eCPC (80% CI excluding zero on both metrics).", "arxiv_id": "2607.28019", "arxiv_url": "https://arxiv.org/abs/2607.28019", "authors": ["Solal Vernier", "Ivan Can Arisoy", "Merwan Barlier", "Bla\u017e \u0160krlj"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u7528\u4e8e\u5f00\u653e Web \u5b9e\u65f6\u7ade\u4ef7\u573a\u666f\u7684\u7528\u6237\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u81ea\u76d1\u7763\u5b66\u4e60\u6316\u6398\u788e\u7247\u5316\u3001\u77ed\u4f1a\u8bdd\u6d4f\u89c8\u5386\u53f2\u4e2d\u7684\u5e8f\u5217\u4fe1\u53f7\u3002\u6a21\u578b\u9884\u8bad\u7ec3\u540e\u53ef\u670d\u52a1\u4e8e\u70b9\u51fb\u7387\u3001\u7ade\u4ef7\u80dc\u7387\u7b49\u591a\u4e2a\u751f\u4ea7\u7ea7\u4e0b\u6e38\u4efb\u52a1\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28019", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u7528 Transformer encoder\uff0c\u5bf9\u7528\u6237\u6d4f\u89c8\u5e8f\u5217\u8fdb\u884c masked language modeling \u4e0e\u5e8f\u5217\u7ea7\u5bf9\u6bd4\u5b66\u4e60\u9884\u8bad\u7ec3", "\u9488\u5bf9\u5f00\u653e Web \u4e2d\u7528\u6237\u8eab\u4efd\u4e0d\u7a33\u5b9a\u3001\u5386\u53f2\u6570\u636e\u7a00\u758f\u4e14\u4f1a\u8bdd\u5272\u88c2\u7684\u95ee\u9898\uff0c\u66ff\u4ee3\u4f20\u7edf\u805a\u5408\u8ba1\u6570\u4e0e\u8fd1\u56e0\u6876\u7279\u5f81", "\u5728\u751f\u4ea7 bid win-rate \u6a21\u578b\u4e0a\u63d0\u5347 +1.197% RIG\uff0c\u5728 CTR ranker \u4e0a\u63d0\u5347 +1.354% RIG\uff1b7 \u5929\u7ebf\u4e0a A/B \u6d4b\u8bd5\u5e26\u6765 +2.13% CTR\u3001-1.13% eCPC"], "keywords": ["\u7528\u6237\u5efa\u6a21", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u5e7f\u544a\u63a8\u8350", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.28019v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Building a User Foundation Model for the Open Web", "tldr": "\u9762\u5411\u5f00\u653e\u7f51\u9875\u7684\u7528\u6237\u57fa\u7840\u6a21\u578b\u63d0\u5347\u5e7f\u544a\u6548\u679c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u7528\u4e8e\u5f00\u653e Web \u5b9e\u65f6\u7ade\u4ef7\u573a\u666f\u7684\u7528\u6237\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u81ea\u76d1\u7763\u5b66\u4e60\u6316\u6398\u788e\u7247\u5316\u3001\u77ed\u4f1a\u8bdd\u6d4f\u89c8\u5386\u53f2\u4e2d\u7684\u5e8f\u5217\u4fe1\u53f7\u3002\u6a21\u578b\u9884\u8bad\u7ec3\u540e\u53ef\u670d\u52a1\u4e8e\u70b9\u51fb\u7387\u3001\u7ade\u4ef7\u80dc\u7387\u7b49\u591a\u4e2a\u751f\u4ea7\u7ea7\u4e0b\u6e38\u4efb\u52a1\u3002", "why_notable": "\u8fd9\u662f\u7528\u6237\u57fa\u7840\u6a21\u578b\u4ece\u7535\u5546\u3001\u793e\u4ea4\u63a8\u8350\u6269\u5c55\u5230\u5f00\u653e Web \u5e7f\u544a\u573a\u666f\u7684\u5de5\u4e1a\u7ea7\u9a8c\u8bc1\uff0c\u8bc1\u660e\u5373\u4f7f\u5728\u9690\u79c1\u7ea6\u675f\u548c\u8eab\u4efd\u788e\u7247\u5316\u6761\u4ef6\u4e0b\uff0c\u5e8f\u5217\u5316\u7528\u6237\u8868\u793a\u4ecd\u80fd\u5e26\u6765\u7a33\u5b9a\u6536\u76ca\uff1b\u540c\u65f6\u5c55\u793a\u4e86 LLM-in-the-loop \u4f18\u5316\u9884\u8bad\u7ec3\u6d41\u6c34\u7ebf\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "In the physical world we inhabit, space and time are fundamentally continuous. However, existing machine learning paradigms for world modeling are largely confined to discrete-time prediction, thereby exhibiting significant inefficiency in capturing the dynamics of physical world. We introduce Physical-Time Flow (\\textbf{PT-Flow}), a novel approach that learns a continuous latent velocity field operating in physical time. Crucially, the underlying dynamics of sequential data are parameterized by an ordinary differential equation (ODE) embedded in a well-structured representation space. Under this paradigm, the prediction of future can be recast as temporal integration via an ODE solver in the compressed latent space. Building upon PT-Flow, we construct \\textbf{ODEWorld}, a continuous-time latent world model that is both efficient and versatile. By extracting time-variant features and enforcing ODE properties on both the dynamical representation space and the latent velocity field, ODEWorld effectively addresses the long-standing representation collapse issue in latent world model literature. This also enables high-quality image reconstruction even after long-horizon prediction. Moreover, its continuous nature allows for arbitrary temporal resolution and even backward prediction, which is impossible for most discrete-time models. Lastly, ODEWorld can provide rich planning-oriented information to facilitate downstream policy learning. Comprehensive experiments demonstrate that ODEWorld successfully reconciles planning-conducive dynamics abstraction with visual realism, excelling in both video generation and robotic control. \\href{https://dstate.github.io/odeworld_website/}{Project Website}.", "arxiv_id": "2607.27924", "arxiv_url": "https://arxiv.org/abs/2607.27924", "authors": ["Dongxiu Liu", "Haoyi Niu", "Peng Cheng", "Yuan Gao", "Xirui Kang", "Sangli Teng", "Koushil Sreenath", "Xianyuan Zhan"], "brief": "\u8bba\u6587\u63d0\u51fa Physical-Time Flow\uff08PT-Flow\uff09\uff0c\u5728\u6f5c\u5728\u7a7a\u95f4\u4e2d\u5b66\u4e60\u968f\u7269\u7406\u65f6\u95f4\u8fde\u7eed\u6f14\u5316\u7684\u901f\u5ea6\u573a\uff0c\u5e76\u4ee5ODE\u6c42\u89e3\u5668\u8fdb\u884c\u672a\u6765\u9884\u6d4b\u3002\u57fa\u4e8e\u6b64\u6784\u5efa ODEWorld\uff0c\u5b9e\u73b0\u53ef\u53d8\u65f6\u95f4\u5206\u8fa8\u7387\u3001\u957f\u7a0b\u89c6\u9891\u9884\u6d4b\u3001\u53cd\u5411\u9884\u6d4b\u53ca\u9762\u5411\u89c4\u5212\u7684\u52a8\u6001\u8868\u5f81\u3002", "categories": ["cs.LG", "cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.27924", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u5e8f\u5217\u6570\u636e\u52a8\u529b\u5b66\u53c2\u6570\u5316\u4e3a\u6f5c\u5728\u7a7a\u95f4\u4e2d\u7684\u5e38\u5fae\u5206\u65b9\u7a0b\uff0c\u628a\u9884\u6d4b\u8f6c\u5316\u4e3a\u8fde\u7eed\u65f6\u95f4\u79ef\u5206", "\u901a\u8fc7\u65f6\u95f4\u53d8\u5316\u7279\u5f81\u4e0eODE\u7ea6\u675f\u7f13\u89e3\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u4e2d\u7684\u8868\u5f81\u574d\u584c\uff0c\u957f\u7a0b\u9884\u6d4b\u540e\u4ecd\u80fd\u4fdd\u6301\u8f83\u597d\u56fe\u50cf\u91cd\u5efa\u8d28\u91cf", "\u652f\u6301\u4efb\u610f\u65f6\u95f4\u5206\u8fa8\u7387\u548c\u53cd\u5411\u9884\u6d4b\uff0c\u5e76\u5728\u89c6\u9891\u751f\u6210\u4e0e\u673a\u5668\u4eba\u63a7\u5236\u5b9e\u9a8c\u4e2d\u8868\u73b0\u7a81\u51fa"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8fde\u7eed\u65f6\u95f4\u5efa\u6a21", "ODE", "\u673a\u5668\u4eba\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.27924v1", "published_at": "2026-07-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ODEWorld: A Continuous Predictive Architecture via Physical-Time Flow", "tldr": "\u7528ODE\u6784\u5efa\u8fde\u7eed\u65f6\u95f4\u6f5c\u5728\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Physical-Time Flow\uff08PT-Flow\uff09\uff0c\u5728\u6f5c\u5728\u7a7a\u95f4\u4e2d\u5b66\u4e60\u968f\u7269\u7406\u65f6\u95f4\u8fde\u7eed\u6f14\u5316\u7684\u901f\u5ea6\u573a\uff0c\u5e76\u4ee5ODE\u6c42\u89e3\u5668\u8fdb\u884c\u672a\u6765\u9884\u6d4b\u3002\u57fa\u4e8e\u6b64\u6784\u5efa ODEWorld\uff0c\u5b9e\u73b0\u53ef\u53d8\u65f6\u95f4\u5206\u8fa8\u7387\u3001\u957f\u7a0b\u89c6\u9891\u9884\u6d4b\u3001\u53cd\u5411\u9884\u6d4b\u53ca\u9762\u5411\u89c4\u5212\u7684\u52a8\u6001\u8868\u5f81\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e16\u754c\u6a21\u578b\u4ece\u79bb\u6563\u6b65\u9884\u6d4b\u63a8\u8fdb\u5230\u7269\u7406\u65f6\u95f4\u8fde\u7eed\u5efa\u6a21\uff0c\u540c\u65f6\u517c\u987e\u89c6\u89c9\u771f\u5b9e\u611f\u4e0e\u53ef\u7528\u4e8e\u89c4\u5212\u7684\u52a8\u529b\u5b66\u62bd\u8c61\uff0c\u5bf9\u89c6\u9891\u9884\u6d4b\u3001\u673a\u5668\u4eba\u7b56\u7565\u5b66\u4e60\u548c\u901a\u7528\u4e16\u754c\u6a21\u578b\u5177\u6709\u5
