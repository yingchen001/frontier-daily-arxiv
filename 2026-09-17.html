09.19969v1", "published_at": "2026-09-17", "score": 0.631, "selected_reasons": ["\u77e5\u540d\u673a\u6784: DeepSeek", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.19969.png", "title": "DeepSeek-V4.1-Flash: Pushing the Limits of KV Cache Compression", "tldr": "DeepSeek\u65b0\u6a21\u578b\u5927\u5e45\u538b\u7f29\u957f\u4e0a\u4e0b\u6587KV\u7f13\u5b58", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa DeepSeek-V4.1-Flash\uff0c\u4e00\u4e2a\u652f\u6301\u767e\u4e07 token \u4e0a\u4e0b\u6587\u7684\u591a\u6a21\u6001 MoE \u6a21\u578b\uff0c\u9762\u5411\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u9ad8\u8f93\u5165\u8d1f\u8f7d\u4f18\u5316\u3002\u5b83\u901a\u8fc7 CED \u67b6\u6784\u3001CSA2 \u8de8\u5c42 KV \u590d\u7528\u4e0e FP4 KV \u7f13\u5b58\u663e\u8457\u964d\u4f4e\u9884\u586b\u5145\u3001\u5b58\u50a8\u548c\u5e26\u5bbd\u6210\u672c\u3002", "why_notable": "\u957f\u4e0a\u4e0b\u6587\u667a\u80fd\u4f53\u90e8\u7f72\u7684\u6838\u5fc3\u74f6\u9888\u6b63\u4ece\u8ba1\u7b97\u6269\u5c55\u5230 KV \u7f13\u5b58\u7684\u663e\u5b58\u3001\u5b58\u50a8\u4e0e\u4f20\u8f93\u6210\u672c\uff1b\u8be5\u5de5\u4f5c\u5728\u767e\u4e07\u4e0a\u4e0b\u6587\u3001\u591a\u6a21\u6001\u548c\u5f00\u6e90\u6743\u91cd\u573a\u666f\u4e0b\u7cfb\u7edf\u6027\u63a8\u8fdb KV \u538b\u7f29\uff0c\u5177\u6709\u91cd\u8981\u5de5\u7a0b\u4e0e\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "LLM-based GUI agents increasingly act on behalf of users in digital environments that were designed with human users in mind. These graphical user interfaces were designed to support, but also deliberately steer, the behaviour and decisions of users. While behavioural biases in the textual outputs of LLMs are well-documented, far less is known about how such influence operates when models act as agents that perceive interfaces and execute decisions---and, in particular, whether the reasoning capabilities increasingly built into these agents make them more robust to it. Drawing on Dual-Process Theory, we empirically investigate whether LLM-based GUI agents are susceptible to automatic (Type 1) and reflective (Type 2) digital nudges, and how their reasoning configuration moderates this susceptibility. In a randomized online shopping experiment with 3,600 agents and a total of 21,600 simulations across six frontier models from three providers, we found that agents were vulnerable to both nudge types. Crucially, the reasoning configuration moderated these effects in opposing directions, reducing susceptibility to automatic default nudges while heightening it to reflective social influence nudges. Extensive reasoning therefore did not make agents more robust but redirected the route through which choice architecture takes effect. Exploratory analysis further showed this redirection to be systematically structured by model scale. Beyond establishing nudge susceptibility as a behavioural property of agentic AI, the study positions interface design as a governance concern for organizations that delegate decisions to autonomous agents.", "arxiv_id": "2609.19843", "arxiv_url": "https://arxiv.org/abs/2609.19843", "authors": ["Haya Halimeh", "Sascha Kaltenpoth", "Kevin B\u00f6sch", "Oliver M\u00fcller"], "brief": "\u672c\u6587\u4ece\u53cc\u8fc7\u7a0b\u7406\u8bba\u51fa\u53d1\uff0c\u7814\u7a76\u57fa\u4e8eLLM\u7684GUI\u667a\u80fd\u4f53\u5728\u7f51\u8d2d\u754c\u9762\u4e2d\u662f\u5426\u4f1a\u53d7\u5230\u81ea\u52a8\u578b\u4e0e\u53cd\u601d\u578b\u6570\u5b57\u52a9\u63a8\u5f71\u54cd\u3002\u4f5c\u8005\u57286\u4e2a\u524d\u6cbf\u6a21\u578b\u30013600\u4e2a\u667a\u80fd\u4f53\u300121600\u6b21\u4eff\u771f\u4e2d\u53d1\u73b0\uff0c\u667a\u80fd\u4f53\u5bf9\u4e24\u7c7b\u52a9\u63a8\u5747\u5b58\u5728\u8106\u5f31\u6027\u3002", "categories": ["cs.AI", "econ.GN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19843", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u81ea\u52a8\u578b\u9ed8\u8ba4\u9009\u9879\u52a9\u63a8\u4e0e\u53cd\u601d\u578b\u793e\u4f1a\u5f71\u54cd\u52a9\u63a8\u90fd\u4f1a\u663e\u8457\u6539\u53d8GUI\u667a\u80fd\u4f53\u51b3\u7b56\u3002", "\u5f00\u542f\u6216\u589e\u5f3a\u63a8\u7406\u80fd\u529b\u5e76\u975e\u5355\u7eaf\u63d0\u5347\u9c81\u68d2\u6027\uff1a\u5b83\u964d\u4f4e\u5bf9\u9ed8\u8ba4\u52a9\u63a8\u7684\u654f\u611f\u6027\uff0c\u5374\u589e\u5f3a\u5bf9\u793e\u4f1a\u5f71\u54cd\u52a9\u63a8\u7684\u654f\u611f\u6027\u3002", "\u63a2\u7d22\u6027\u5206\u6790\u663e\u793a\uff0c\u8fd9\u79cd\u52a9\u63a8\u654f\u611f\u6027\u7684\u8f6c\u79fb\u4e0e\u6a21\u578b\u89c4\u6a21\u5b58\u5728\u7cfb\u7edf\u6027\u5173\u8054\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u884c\u4e3a\u504f\u5dee", "AI\u6cbb\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19843v1", "published_at": "2026-09-17", "score": 0.5, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "A Dual-Process Perspective on Nudge Susceptibility in LLM-Based GUI Agents", "tldr": "\u63a8\u7406\u578bGUI\u667a\u80fd\u4f53\u4ecd\u6613\u53d7\u754c\u9762\u52a9\u63a8\u5f71\u54cd", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ece\u53cc\u8fc7\u7a0b\u7406\u8bba\u51fa\u53d1\uff0c\u7814\u7a76\u57fa\u4e8eLLM\u7684GUI\u667a\u80fd\u4f53\u5728\u7f51\u8d2d\u754c\u9762\u4e2d\u662f\u5426\u4f1a\u53d7\u5230\u81ea\u52a8\u578b\u4e0e\u53cd\u601d\u578b\u6570\u5b57\u52a9\u63a8\u5f71\u54cd\u3002\u4f5c\u8005\u57286\u4e2a\u524d\u6cbf\u6a21\u578b\u30013600\u4e2a\u667a\u80fd\u4f53\u300121600\u6b21\u4eff\u771f\u4e2d\u53d1\u73b0\uff0c\u667a\u80fd\u4f53\u5bf9\u4e24\u7c7b\u52a9\u63a8\u5747\u5b58\u5728\u8106\u5f31\u6027\u3002", "why_notable": "\u8bba\u6587\u5c06\u884c\u4e3a\u7ecf\u6d4e\u5b66\u4e2d\u7684\u201c\u52a9\u63a8\u201d\u95ee\u9898\u6269\u5c55\u5230LLM GUI\u667a\u80fd\u4f53\uff0c\u6307\u51fa\u754c\u9762\u8bbe\u8ba1\u4f1a\u7cfb\u7edf\u6027\u5f71\u54cd\u81ea\u6cbb\u4ee3\u7406\u7684\u51b3\u7b56\u8def\u5f84\uff0c\u5bf9\u4f01\u4e1a\u90e8\u7f72\u667a\u80fd\u4f53\u3001AI\u6cbb\u7406\u4e0e\u754c\u9762\u5408\u89c4\u5177\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "LLM agents have recently shown promise in automating machine learning engineering by editing model and training code under execution feedback. Data, however, remains largely outside this agentic optimisation loop. We frame pre-training data selection as heuristic engineering over per-document features, i.e., lexical statistics, categorical labels, and perplexity. We introduce AutoData, an agent that searches directly over executable selection algorithms. Unlike prior data mixture methods that optimise weights over a fixed set of domains, AutoData searches a richer program space of scoring, stratification, and stochastic selection rules, discovering feature interactions automatically by iteratively refining algorithms with validation feedback from a proxy model. Within an overnight search, AutoData discovers a selection algorithm that outperforms existing human-designed curation pipelines. Despite being searched only on this small proxy, the discovered recipe transfers to larger scales and improves the downstream metric CORE. These results suggest that data engineering can be treated as an agentic machine learning problem, extending autonomous research from model and training-code optimization to the data.", "arxiv_id": "2609.19754", "arxiv_url": "https://arxiv.org/abs/2609.19754", "authors": ["Yan Meng", "Dhruv Srikanth", "Bingchen Zhao", "Zhengyao Jiang", "Yuxiang Wu"], "brief": "\u8bba\u6587\u63d0\u51fa AutoData\uff0c\u5c06\u9884\u8bad\u7ec3\u6570\u636e\u9009\u62e9\u5efa\u6a21\u4e3a\u57fa\u4e8e\u6587\u6863\u7279\u5f81\u7684\u542f\u53d1\u5f0f\u7a0b\u5e8f\u641c\u7d22\u3002\u5b83\u8ba9\u667a\u80fd\u4f53\u5728\u9a8c\u8bc1\u53cd\u9988\u4e0b\u8fed\u4ee3\u7f16\u5199\u548c\u6539\u8fdb\u53ef\u6267\u884c\u7684\u6570\u636e\u7b5b\u9009\u7b97\u6cd5\uff0c\u800c\u4e0d\u53ea\u662f\u8c03\u56fa\u5b9a\u9886\u57df\u6df7\u5408\u6743\u91cd\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19754", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u4e8e\u8bcd\u6c47\u7edf\u8ba1\u3001\u7c7b\u522b\u6807\u7b7e\u3001\u56f0\u60d1\u5ea6\u7b49\u9010\u6587\u6863\u7279\u5f81\uff0c\u641c\u7d22\u6253\u5206\u3001\u5206\u5c42\u4e0e\u968f\u673a\u9009\u62e9\u89c4\u5219\u7684\u7ec4\u5408\u7a0b\u5e8f", "\u4f7f\u7528\u5c0f\u578b\u4ee3\u7406\u6a21\u578b\u63d0\u4f9b\u9a8c\u8bc1\u53cd\u9988\uff0c\u5728\u4e00\u591c\u641c\u7d22\u5185\u53d1\u73b0\u4f18\u4e8e\u4eba\u5de5\u8bbe\u8ba1\u6570\u636e\u6e05\u6d17\u6d41\u7a0b\u7684\u9009\u62e9\u7b97\u6cd5", "\u5728\u5c0f\u4ee3\u7406\u6a21\u578b\u4e0a\u641c\u7d22\u5f97\u5230\u7684\u914d\u65b9\u53ef\u8fc1\u79fb\u5230\u66f4\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\uff0c\u5e76\u63d0\u5347\u4e0b\u6e38 CORE \u6307\u6807"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u9009\u62e9", "\u9884\u8bad\u7ec3", "\u81ea\u52a8\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19754v1", "published_at": "2026-09-17", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AutoData: Agentic Search for Pre-training Data Selection", "tldr": "\u7528\u667a\u80fd\u4f53\u81ea\u52a8\u641c\u7d22\u9884\u8bad\u7ec3\u6570\u636e\u7b5b\u9009\u7b56\u7565", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoData\uff0c\u5c06\u9884\u8bad\u7ec3\u6570\u636e\u9009\u62e9\u5efa\u6a21\u4e3a\u57fa\u4e8e\u6587\u6863\u7279\u5f81\u7684\u542f\u53d1\u5f0f\u7a0b\u5e8f\u641c\u7d22\u3002\u5b83\u8ba9\u667a\u80fd\u4f53\u5728\u9a8c\u8bc1\u53cd\u9988\u4e0b\u8fed\u4ee3\u7f16\u5199\u548c\u6539\u8fdb\u53ef\u6267\u884c\u7684\u6570\u636e\u7b5b\u9009\u7b97\u6cd5\uff0c\u800c\u4e0d\u53ea\u662f\u8c03\u56fa\u5b9a\u9886\u57df\u6df7\u5408\u6743\u91cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6570\u636e\u5de5\u7a0b\u7eb3\u5165\u667a\u80fd\u4f53\u81ea\u52a8\u5316\u673a\u5668\u5b66\u4e60\u4f18\u5316\u95ed\u73af\uff0c\u5c55\u793a\u4e86\u667a\u80fd\u4f53\u4e0d\u4ec5\u80fd\u6539\u6a21\u578b\u548c\u8bad\u7ec3\u4ee3\u7801\uff0c\u4e5f\u80fd\u81ea\u52a8\u53d1\u73b0\u6709\u6548\u7684\u6570\u636e\u7b5b\u9009\u7b56\u7565\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u7528\u4ef7\u503c\u548c\u6269\u5c55\u6f5c\u529b\u3002"}, {"abstract": "Autonomous large language model (LLM) agents are moving rapidly into high-stakes domains, yet existing agentic-AI security studies remain largely domain-agnostic and overlook the distinctive, high-consequence attack surface such settings create. We examine this gap through financial trading agents, a representative case of high-stakes agentic security, where a single compromised agent has direct execution authority over real capital in an adversarial, reflexive market. To this end, we present FARSIGHT (Financial Agent Robustness and Security Investigation and Global Holistic Testing), a framework that performs scheme-level evaluation of financial LLM agents on two axes: robustness under market turbulence (including flash-crash-like scenarios), and security against three attack types: attacks on information sources, attacks on agents, and agent-as-attacker behaviors. Applying FARSIGHT to 15 representative academic schemes, we find that most overlook robustness and realistic adversarial threats: 80% fail at least one core robustness metric and 100% exhibit security vulnerabilities. These two failure modes are inseparable: a small misjudgment can cascade into a market-wide crash on its own, while an adversary can deliberately trigger the same collapse at minimal cost.", "arxiv_id": "2609.19705", "arxiv_url": "https://arxiv.org/abs/2609.19705", "authors": ["Mengxiao Wang", "Nitesh Saxena"], "brief": "\u672c\u6587\u63d0\u51fa FARSIGHT \u6846\u67b6\uff0c\u5bf9\u5b66\u672f\u754c\u91d1\u878d LLM \u4ea4\u6613\u667a\u80fd\u4f53\u8fdb\u884c\u65b9\u6848\u7ea7\u9c81\u68d2\u6027\u4e0e\u5b89\u5168\u6027\u8bc4\u4f30\u3002\u7814\u7a76\u8986\u76d6\u5e02\u573a\u5267\u70c8\u6ce2\u52a8\u3001\u95ea\u5d29\u573a\u666f\uff0c\u4ee5\u53ca\u4fe1\u606f\u6e90\u653b\u51fb\u3001\u667a\u80fd\u4f53\u653b\u51fb\u548c\u667a\u80fd\u4f53\u4f5c\u6076\u7b49\u5a01\u80c1\u3002", "categories": ["cs.CR", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19705", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u4f3015\u4e2a\u4ee3\u8868\u6027\u5b66\u672f\u91d1\u878dLLM\u4ea4\u6613\u65b9\u6848\uff0c\u53d1\u73b080%\u672a\u901a\u8fc7\u81f3\u5c11\u4e00\u9879\u6838\u5fc3\u9c81\u68d2\u6027\u6307\u6807", "\u6240\u6709\u88ab\u8bc4\u4f30\u65b9\u6848\u5747\u5b58\u5728\u5b89\u5168\u6f0f\u6d1e\uff0c\u8bf4\u660e\u5f53\u524d\u8bbe\u8ba1\u666e\u904d\u4f4e\u4f30\u73b0\u5b9e\u5bf9\u6297\u73af\u5883", "\u6307\u51fa\u9c81\u68d2\u6027\u5931\u6548\u4e0e\u5b89\u5168\u653b\u51fb\u9ad8\u5ea6\u8026\u5408\uff1a\u5c0f\u8bef\u5224\u6216\u4f4e\u6210\u672c\u653b\u51fb\u90fd\u53ef\u80fd\u89e6\u53d1\u5e02\u573a\u7ea7\u8fde\u9501\u5d29\u76d8"], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878dAI", "\u5b89\u5168\u8bc4\u6d4b", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19705v1", "published_at": "2026-09-17", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SoK: Trading Agents or Market Crashers? Dissecting Robustness and Security Failures in Academic Financial LLM Trading Schemes", "tldr": "\u7cfb\u7edf\u63ed\u793a\u91d1\u878dLLM\u4ea4\u6613\u667a\u80fd\u4f53\u7684\u9ad8\u98ce\u9669\u5931\u6548", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa FARSIGHT \u6846\u67b6\uff0c\u5bf9\u5b66\u672f\u754c\u91d1\u878d LLM \u4ea4\u6613\u667a\u80fd\u4f53\u8fdb\u884c\u65b9\u6848\u7ea7\u9c81\u68d2\u6027\u4e0e\u5b89\u5168\u6027\u8bc4\u4f30\u3002\u7814\u7a76\u8986\u76d6\u5e02\u573a\u5267\u70c8\u6ce2\u52a8\u3001\u95ea\u5d29\u573a\u666f\uff0c\u4ee5\u53ca\u4fe1\u606f\u6e90\u653b\u51fb\u3001\u667a\u80fd\u4f53\u653b\u51fb\u548c\u667a\u80fd\u4f53\u4f5c\u6076\u7b49\u5a01\u80c1\u3002", "why_notable": "\u8bba\u6587\u5c06\u667a\u80fd\u4f53\u5b89\u5168\u7814\u7a76\u805a\u7126\u5230\u91d1\u878d\u4ea4\u6613\u8fd9\u4e00\u9ad8\u98ce\u9669\u573a\u666f\uff0c\u5f3a\u8c03\u62e5\u6709\u771f\u5b9e\u8d44\u91d1\u6267\u884c\u6743\u7684 LLM \u667a\u80fd\u4f53\u53ef\u80fd\u5e26\u6765\u7cfb\u7edf\u6027\u5e02\u573a\u98ce\u9669\uff0c\u5bf9\u672a\u6765\u91d1\u878dAI\u90e8\u7f72\u3001\u76d1\u7ba1\u548c\u5b89\u5168\u8bc4\u6d4b\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Self-evolving methods reduce the need for human-annotated trajectories by allowing tool-using agents to generate their own training data. Yet existing methods typically separate trajectory generation from evaluation, relying on static verifiers that cannot adapt to emerging failure modes or self-consistency signals that may reinforce errors shared across trajectories. Jointly adapting planning, execution, and evaluation offers a promising alternative, but introduces a fundamental coordination challenge: each component continuously changes the data or feedback used to train the others. We address this challenge with \\textbf{UnifiedPlayers}, a cooperative framework comprising a Planning Player that generates tasks, an Execution Player that produces multi-turn trajectories with Python tool calls, and an Evaluation Player that constructs executable verifiers. We design role-specific rewards that coordinate the three players toward a shared learning objective under GRPO. Across two model backbones and twelve reasoning benchmarks, UnifiedPlayers outperforms the strongest prior baseline by at least 3.5\\% on mathematical reasoning and 3.9\\% on general reasoning tasks. Moreover, the learned verifier achieves 84.2\\% adversarial detection accuracy, while its reward signal exhibits 2.03$\\times$ higher per-question variance than a self-consistency baseline, providing more discriminative verifications. These results highlight cooperation among specialized players as a promising path toward self-enhanced tool-integrated agents.", "arxiv_id": "2609.20089", "arxiv_url": "https://arxiv.org/abs/2609.20089", "authors": ["Wenjie Liao", "Liangjie Zhao", "Zehong Cao"], "brief": "\u8bba\u6587\u63d0\u51fa UnifiedPlayers\uff0c\u4e00\u4e2a\u7528\u4e8e\u5de5\u5177\u96c6\u6210\u63a8\u7406\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u8bad\u7ec3\u7684\u534f\u4f5c\u6846\u67b6\u3002\u5b83\u8ba9\u89c4\u5212\u3001\u6267\u884c\u4e0e\u8bc4\u4f30\u4e09\u4e2a Player \u5728 GRPO \u4e0b\u5171\u540c\u5b66\u4e60\uff0c\u5206\u522b\u751f\u6210\u4efb\u52a1\u3001\u4ea7\u751f\u5e26 Python \u5de5\u5177\u8c03\u7528\u7684\u591a\u8f6e\u8f68\u8ff9\uff0c\u5e76\u6784\u5efa\u53ef\u6267\u884c\u9a8c\u8bc1\u5668\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20089", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u8f68\u8ff9\u751f\u6210\u4e0e\u8bc4\u4f30\u7edf\u4e00\u5230\u540c\u4e00\u8bad\u7ec3\u95ed\u73af\u4e2d\uff0c\u907f\u514d\u9759\u6001\u9a8c\u8bc1\u5668\u96be\u4ee5\u9002\u5e94\u65b0\u9519\u8bef\u3001\u4ee5\u53ca\u81ea\u4e00\u81f4\u6027\u53ef\u80fd\u653e\u5927\u5171\u4eab\u9519\u8bef\u7684\u95ee\u9898\u3002", "\u8bbe\u8ba1\u89d2\u8272\u7279\u5b9a\u5956\u52b1\uff0c\u534f\u8c03 Planning\u3001Execution\u3001Evaluation \u4e09\u4e2a\u7ec4\u4ef6\u5728\u4e0d\u65ad\u53d8\u5316\u7684\u6570\u636e\u4e0e\u53cd\u9988\u4e2d\u5171\u540c\u4f18\u5316\u3002", "\u5728\u4e24\u4e2a\u6a21\u578b\u9aa8\u5e72\u548c\u5341\u4e8c\u4e2a\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u6570\u5b66\u63a8\u7406\u8f83\u6700\u5f3a\u57fa\u7ebf\u81f3\u5c11\u63d0\u5347 3.5%\uff0c\u901a\u7528\u63a8\u7406\u63d0\u5347 3.9%\uff1b\u5b66\u4e60\u5230\u7684\u9a8c\u8bc1\u5668\u5bf9\u6297\u68c0\u6d4b\u51c6\u786e\u7387\u8fbe 84.2%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u8c03\u7528", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20089v1", "published_at": "2026-09-17", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "UnifiedPlayers: Enhance Tool-Integrated Reasoning in Agentic Reinforcement Learning", "tldr": "\u591a\u89d2\u8272\u534f\u540c\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u5de5\u5177\u63a8\u7406\u667a\u80fd\u4f53\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa UnifiedPlayers\uff0c\u4e00\u4e2a\u7528\u4e8e\u5de5\u5177\u96c6\u6210\u63a8\u7406\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u8bad\u7ec3\u7684\u534f\u4f5c\u6846\u67b6\u3002\u5b83\u8ba9\u89c4\u5212\u3001\u6267\u884c\u4e0e\u8bc4\u4f30\u4e09\u4e2a Player \u5728 GRPO \u4e0b\u5171\u540c\u5b66\u4e60\uff0c\u5206\u522b\u751f\u6210\u4efb\u52a1\u3001\u4ea7\u751f\u5e26 Python \u5de5\u5177\u8c03\u7528\u7684\u591a\u8f6e\u8f68\u8ff9\uff0c\u5e76\u6784\u5efa\u53ef\u6267\u884c\u9a8c\u8bc1\u5668\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4efb\u52a1\u751f\u6210\u3001\u5de5\u5177\u8c03\u7528\u6267\u884c\u548c\u9a8c\u8bc1\u5668\u5b66\u4e60\u89c6\u4e3a\u534f\u4f5c\u535a\u5f08\u5f0f\u8bad\u7ec3\u8fc7\u7a0b\uff0c\u4e3a\u51cf\u5c11\u4eba\u5de5\u8f68\u8ff9\u6807\u6ce8\u3001\u63d0\u5347\u81ea\u6f14\u5316\u5de5\u5177\u667a\u80fd\u4f53\u7684\u53ef\u9760\u6027\u63d0\u4f9b\u4e86\u66f4\u52a8\u6001\u7684\u65b9\u6848\u3002"}, {"abstract": "Reinforcement learning now trains language-model agents that act over dozens of steps in live environments. The gains are large, and they are read as better decision-making. An agent in a closed loop writes its own inputs. Each observation follows from its own earlier actions, so the states it meets late in an episode are partly of its own making. An SFT checkpoint and an RL checkpoint are then scored from different states, even on identical tasks. Endpoint success mixes two changes: where the agent arrives, and what it does once it is there. Restricting the comparison to states both policies reach does not separate them. That restriction selects on an outcome, and in our data it flips the sign of the effect. We introduce checkpoint handoff, an evaluation protocol that clones a state one released checkpoint reached and hands it to another, with no retraining. Crossing a reacher role and a solver role over SFT and RL splits an endpoint gain into REACH and SOLVE. REACH is how often a policy arrives at a state the environment confirms is a fixed number of actions from success. SOLVE is how often it finishes from an identical cloned state. Across two benchmarks and two independently released pipelines, the reacher by solver interaction is positive in all five conditions. An RL history is worth more to an RL solver than the same history is to an SFT solver. On ALFWorld, RL improves both terms, and the SFT solver never succeeds where the RL solver fails. Independent REACH and SOLVE gaps predict the aggregate interaction. Handoff asks only that one checkpoint\u0027s history can be replayed under another, so long-horizon evaluation can report arrival and completion beside endpoint success.", "arxiv_id": "2609.19636", "arxiv_url": "https://arxiv.org/abs/2609.19636", "authors": ["Xuan Liu", "Jingbin Qian"], "brief": "\u8bba\u6587\u63d0\u51fa checkpoint handoff \u8bc4\u6d4b\u534f\u8bae\uff1a\u514b\u9686\u4e00\u4e2a\u68c0\u67e5\u70b9\u5230\u8fbe\u7684\u73af\u5883\u72b6\u6001\uff0c\u518d\u4ea4\u7ed9\u53e6\u4e00\u4e2a\u68c0\u67e5\u70b9\u7ee7\u7eed\u6267\u884c\uff0c\u65e0\u9700\u91cd\u8bad\u3002\u8be5\u65b9\u6cd5\u5c06\u957f\u7a0b\u667a\u80fd\u4f53\u7aef\u5230\u7aef\u6210\u529f\u7387\u63d0\u5347\u62c6\u5206\u4e3a\u201c\u5230\u8fbe\u597d\u72b6\u6001\u201d\u7684 REACH \u4e0e\u201c\u4ece\u540c\u4e00\u72b6\u6001\u89e3\u9898\u201d\u7684 SOLVE\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19636", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u95ed\u73af\u667a\u80fd\u4f53\u4f1a\u751f\u6210\u81ea\u5df1\u7684\u540e\u7eed\u89c2\u6d4b\uff0cSFT \u4e0e RL \u68c0\u67e5\u70b9\u5b9e\u9645\u662f\u5728\u4e0d\u540c\u72b6\u6001\u5206\u5e03\u4e0a\u88ab\u8bc4\u6d4b\uff0c\u7aef\u70b9\u6210\u529f\u7387\u6df7\u5408\u4e86\u5230\u8fbe\u80fd\u529b\u4e0e\u5b8c\u6210\u80fd\u529b\u3002", "\u8bc1\u660e\u4ec5\u6bd4\u8f83\u4e24\u4e2a\u7b56\u7565\u90fd\u80fd\u5230\u8fbe\u7684\u72b6\u6001\u4f1a\u4ea7\u751f\u9009\u62e9\u504f\u5dee\uff0c\u5728\u5b9e\u9a8c\u6570\u636e\u4e2d\u751a\u81f3\u4f1a\u7ffb\u8f6c\u6548\u679c\u7b26\u53f7\u3002", "\u5728\u4e24\u4e2a\u57fa\u51c6\u548c\u4e24\u4e2a\u72ec\u7acb\u53d1\u5e03\u6d41\u7a0b\u7684\u4e94\u79cd\u6761\u4ef6\u4e0b\uff0creacher \u4e0e solver \u4ea4\u4e92\u5747\u4e3a\u6b63\uff1bALFWorld \u4e0a RL \u540c\u65f6\u63d0\u5347 REACH \u4e0e SOLVE\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u8bc4\u6d4b\u65b9\u6cd5", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19636v1", "published_at": "2026-09-17", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Reach or Solve? Attributing Agentic RL Gains with Checkpoint Handoffs", "tldr": "\u7528\u68c0\u67e5\u70b9\u4ea4\u63a5\u62c6\u89e3\u667a\u80fd\u4f53RL\u6536\u76ca\u6765\u6e90", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa checkpoint handoff \u8bc4\u6d4b\u534f\u8bae\uff1a\u514b\u9686\u4e00\u4e2a\u68c0\u67e5\u70b9\u5230\u8fbe\u7684\u73af\u5883\u72b6\u6001\uff0c\u518d\u4ea4\u7ed9\u53e6\u4e00\u4e2a\u68c0\u67e5\u70b9\u7ee7\u7eed\u6267\u884c\uff0c\u65e0\u9700\u91cd\u8bad\u3002\u8be5\u65b9\u6cd5\u5c06\u957f\u7a0b\u667a\u80fd\u4f53\u7aef\u5230\u7aef\u6210\u529f\u7387\u63d0\u5347\u62c6\u5206\u4e3a\u201c\u5230\u8fbe\u597d\u72b6\u6001\u201d\u7684 REACH \u4e0e\u201c\u4ece\u540c\u4e00\u72b6\u6001\u89e3\u9898\u201d\u7684 SOLVE\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u957f\u7a0b LLM \u667a\u80fd\u4f53 RL \u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u7684\u5f52\u56e0\u8bc4\u6d4b\uff0c\u907f\u514d\u628a\u72b6\u6001\u5206\u5e03\u53d8\u5316\u8bef\u8bfb\u4e3a\u51b3\u7b56\u80fd\u529b\u63d0\u5347\uff0c\u6709\u52a9\u4e8e\u66f4\u53ef\u9760\u5730\u5206\u6790 RL \u8bad\u7ec3\u5230\u5e95\u6539\u8fdb\u4e86\u201c\u8d70\u5230\u54ea\u201d\u8fd8\u662f\u201c\u5230\u4e86\u4e4b\u540e\u600e\u4e48\u505a\u201d\u3002"}, {"abstract": "Information retrieval is increasingly important as LLM agents tackle complex tasks involving diverse information needs. Because retrieval relies on an index that represents each document through index keys, retrieval quality depends heavily on how effectively these keys expose the knowledge contained in each document. However, effective index representations vary across retrieval environments, making it difficult for any fixed optimization strategy to perform consistently. Yet evolving an index to its retrieval environment remains largely human-driven, requiring humans to diagnose retrieval failures, refine the optimization strategy, and reprocess the index accordingly. We propose SELF-INDEX, a framework that enables an index to self-evolve without human intervention. Its Optimizer autonomously diagnoses retrieval shortfalls, selectively revises the responsible index keys, and validates each revision before updating the index. Beyond reacting to observed retrieval demands, SELF-INDEX proactively explores additional demands through a Query Simulator, allowing the index to evolve beyond the queries already available for optimization. Across diverse corpora and retrievers, SELF-INDEX consistently improves retrieval performance while outperforming existing index optimization methods. We further show that these benefits extend to downstream applications, improving the effectiveness and efficiency of search agents and helping agent memory systems retrieve useful past interactions.", "arxiv_id": "2609.19656", "arxiv_url": "https://arxiv.org/abs/2609.19656", "authors": ["Sangam Lee", "Wonjae Lee", "Sunghwan Kim", "Deogyong Kim", "Jaehoon Kim", "Daye Nam", "SeongKu Kang", "Dongha Lee"], "brief": "\u8bba\u6587\u63d0\u51fa SELF-INDEX\uff0c\u4e00\u4e2a\u65e0\u9700\u4eba\u5de5\u5e72\u9884\u7684\u81ea\u8fdb\u5316\u68c0\u7d22\u7d22\u5f15\u6846\u67b6\u3002\u5b83\u80fd\u6839\u636e\u68c0\u7d22\u5931\u8d25\u81ea\u52a8\u5b9a\u4f4d\u95ee\u9898\u7d22\u5f15\u952e\u3001\u9009\u62e9\u6027\u4fee\u8ba2\u5e76\u9a8c\u8bc1\u66f4\u65b0\uff0c\u8fd8\u901a\u8fc7\u67e5\u8be2\u6a21\u62df\u4e3b\u52a8\u63a2\u7d22\u6f5c\u5728\u68c0\u7d22\u9700\u6c42\u3002", "categories": ["cs.IR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19656", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Optimizer \u81ea\u52a8\u8bca\u65ad\u68c0\u7d22\u77ed\u677f\uff0c\u9488\u5bf9\u8d23\u4efb\u6587\u6863\u7684 index keys \u8fdb\u884c\u5c40\u90e8\u4fee\u8ba2\uff0c\u800c\u975e\u5168\u91cf\u91cd\u5efa\u7d22\u5f15\u3002", "Query Simulator \u4e3b\u52a8\u751f\u6210\u989d\u5916\u67e5\u8be2\u9700\u6c42\uff0c\u4f7f\u7d22\u5f15\u4e0d\u4ec5\u9002\u914d\u5df2\u6709\u67e5\u8be2\uff0c\u4e5f\u80fd\u63d0\u524d\u8986\u76d6\u6f5c\u5728\u4fe1\u606f\u9700\u6c42\u3002", "\u5728\u591a\u79cd\u8bed\u6599\u548c\u68c0\u7d22\u5668\u4e0a\u6301\u7eed\u63d0\u5347\u68c0\u7d22\u6027\u80fd\uff0c\u5e76\u8fdb\u4e00\u6b65\u6539\u5584\u641c\u7d22\u667a\u80fd\u4f53\u548c\u667a\u80fd\u4f53\u8bb0\u5fc6\u68c0\u7d22\u7684\u6548\u679c\u4e0e\u6548\u7387\u3002"], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u667a\u80fd\u4f53", "\u7d22\u5f15\u4f18\u5316", "\u8bb0\u5fc6\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19656v1", "published_at": "2026-09-17", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Self-Evolving Search Index", "tldr": "\u8ba9\u68c0\u7d22\u7d22\u5f15\u81ea\u4e3b\u8bca\u65ad\u5e76\u8fdb\u5316\u4f18\u5316\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SELF-INDEX\uff0c\u4e00\u4e2a\u65e0\u9700\u4eba\u5de5\u5e72\u9884\u7684\u81ea\u8fdb\u5316\u68c0\u7d22\u7d22\u5f15\u6846\u67b6\u3002\u5b83\u80fd\u6839\u636e\u68c0\u7d22\u5931\u8d25\u81ea\u52a8\u5b9a\u4f4d\u95ee\u9898\u7d22\u5f15\u952e\u3001\u9009\u62e9\u6027\u4fee\u8ba2\u5e76\u9a8c\u8bc1\u66f4\u65b0\uff0c\u8fd8\u901a\u8fc7\u67e5\u8be2\u6a21\u62df\u4e3b\u52a8\u63a2\u7d22\u6f5c\u5728\u68c0\u7d22\u9700\u6c42\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7d22\u5f15\u4f18\u5316\u4ece\u4eba\u5de5\u8c03\u53c2\u548c\u79bb\u7ebf\u91cd\u5904\u7406\u63a8\u8fdb\u5230\u81ea\u52a8\u5316\u3001\u81ea\u9002\u5e94\u6d41\u7a0b\uff0c\u5bf9 LLM agent \u7684\u68c0\u7d22\u589e\u5f3a\u3001\u641c\u7d22\u89c4\u5212\u548c\u957f\u671f\u8bb0\u5fc6\u7cfb\u7edf\u90fd\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Executable environments enable LLM agents to learn from the consequences of their actions. For embodied agents, those consequences extend beyond whether the current task succeeds: completing a delivery can consume the time, energy, or money needed for later work. Learning to plan therefore requires environments that preserve these dependencies and turn them into feedback across a complete trajectory. We introduce DeliveryGym, a 3D environment for evaluating and training agents on continuous courier shifts. It couples multimodal tool interaction with persistent world dynamics and computes trajectory rewards from simulator events, making the costs of an agent\u0027s decisions available for reinforcement learning (RL). The environment also adapts future training shifts to the policy\u0027s observed weaknesses while keeping evaluation fixed. Across six models and 13 city maps, evaluation exposes a gap between reliably executing assigned deliveries and choosing and sequencing work over a shift. On the fixed test suite, RL improves Qwen3-VL-4B\u0027s net income by 54.3%, showing that learning from complete shifts improves performance under these coupled constraints. Adapting the training environment improves test income by 16.5% over uniform sampling at the same rollout budget, indicating that which situations an agent practices also matters. DeliveryGym provides an executable setting for studying how agents learn to coordinate deliveries and preserve resources for later orders within an episode.", "arxiv_id": "2609.19801", "arxiv_url": "https://arxiv.org/abs/2609.19801", "authors": ["Haoqiang Kang", "Yiming Zhang", "Yiyang Guo", "Chuying Li", "Jianzhi Shen", "Tianruo Rose Xu", "Xiaokang Ye", "Lianhui Qin"], "brief": "\u8bba\u6587\u63d0\u51fa DeliveryGym\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u4f30\u5177\u8eab\u5feb\u9012\u667a\u80fd\u4f53\u76843D\u53ef\u6267\u884c\u73af\u5883\u3002\u5b83\u5c06\u591a\u6a21\u6001\u5de5\u5177\u4ea4\u4e92\u3001\u6301\u4e45\u4e16\u754c\u52a8\u6001\u548c\u6574\u6bb5\u73ed\u6b21\u8f68\u8ff9\u5956\u52b1\u7ed3\u5408\u8d77\u6765\uff0c\u8ba9\u667a\u80fd\u4f53\u5b66\u4e60\u5728\u65f6\u95f4\u3001\u80fd\u91cf\u3001\u91d1\u94b1\u7b49\u8d44\u6e90\u7ea6\u675f\u4e0b\u9009\u62e9\u4e0e\u6392\u5e8f\u8ba2\u5355\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19801", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u73af\u5883\u8986\u76d613\u4e2a\u57ce\u5e02\u5730\u56fe\u548c\u8fde\u7eed\u5feb\u9012\u73ed\u6b21\uff0c\u8bc4\u4f30\u7684\u4e0d\u53ea\u662f\u5355\u6b21\u914d\u9001\u6210\u529f\u7387\uff0c\u8fd8\u5305\u62ec\u8de8\u4efb\u52a1\u8d44\u6e90\u6d88\u8017\u4e0e\u957f\u671f\u51c0\u6536\u76ca\u3002", "\u901a\u8fc7\u6a21\u62df\u5668\u4e8b\u4ef6\u8ba1\u7b97\u5b8c\u6574\u8f68\u8ff9\u5956\u52b1\uff0c\u4f7f\u5f3a\u5316\u5b66\u4e60\u80fd\u5229\u7528\u6574\u6bb5\u73ed\u6b21\u4e2d\u7684\u957f\u671f\u540e\u679c\u53cd\u9988\u3002", "\u81ea\u9002\u5e94\u8bfe\u7a0b\u4f1a\u6839\u636e\u7b56\u7565\u5f31\u70b9\u8c03\u6574\u8bad\u7ec3\u73ed\u6b21\uff1b\u5728\u56fa\u5b9a\u6d4b\u8bd5\u96c6\u4e0a\uff0cRL\u4f7f Qwen3-VL-4B \u51c0\u6536\u5165\u63d0\u534754.3%\uff0c\u81ea\u9002\u5e94\u8bad\u7ec3\u76f8\u6bd4\u5747\u5300\u91c7\u6837\u518d\u63d0\u534716.5%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5177\u8eab\u667a\u80fd", "\u5f3a\u5316\u5b66\u4e60", "\u957f\u7a0b\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19801v1", "published_at": "2026-09-17", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DeliveryGym: An RL Environment for Long-Horizon Embodied Agent Planning with Adaptive Curriculum", "tldr": "\u9762\u5411\u957f\u7a0b\u914d\u9001\u89c4\u5212\u76843D\u5f3a\u5316\u5b66\u4e60\u73af\u5883", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DeliveryGym\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u4f30\u5177\u8eab\u5feb\u9012\u667a\u80fd\u4f53\u76843D\u53ef\u6267\u884c\u73af\u5883\u3002\u5b83\u5c06\u591a\u6a21\u6001\u5de5\u5177\u4ea4\u4e92\u3001\u6301\u4e45\u4e16\u754c\u52a8\u6001\u548c\u6574\u6bb5\u73ed\u6b21\u8f68\u8ff9\u5956\u52b1\u7ed3\u5408\u8d77\u6765\uff0c\u8ba9\u667a\u80fd\u4f53\u5b66\u4e60\u5728\u65f6\u95f4\u3001\u80fd\u91cf\u3001\u91d1\u94b1\u7b49\u8d44\u6e90\u7ea6\u675f\u4e0b\u9009\u62e9\u4e0e\u6392\u5e8f\u8ba2\u5355\u3002", "why_notable": "\u5b83\u4e3aLLM/\u591a\u6a21\u6001\u5177\u8eab\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u66f4\u63a5\u8fd1\u771f\u5b9e\u5de5\u4f5c\u7684\u957f\u7a0b\u89c4\u5212\u57fa\u51c6\uff0c\u7a81\u51fa\u4ece\u201c\u4f1a\u6267\u884c\u4efb\u52a1\u201d\u5230\u201c\u4f1a\u9009\u62e9\u548c\u8c03\u5ea6\u4efb\u52a1\u201d\u7684\u80fd\u529b\u5dee\u8ddd\uff0c\u5e76\u9a8c\u8bc1\u4e86\u5b8c\u6574\u8f68\u8ff9RL\u4e0e\u81ea\u9002\u5e94\u8bfe\u7a0b\u7684\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Multi-turn agents trained with reinforcement learning (RL) receive a single scalar reward per trajectory, which motivates self on-policy distillation (OPD) to supply dense token-level supervision from a self-teacher with privileged task skills, letting a skill-free student internalize them. This recipe, however, is undermined by two findings in agentic tasks: privileged information alone does not always make a teacher reliable, and the benefit of teacher supervision is stage-dependent. We therefore propose RetireOPD (Self-Retiring On-Policy Distillation), which first optimizes a decoupled, skill-conditioned teacher with environment rewards and then trains a skill-free student jointly with RL and OPD. Rather than following a predefined distillation schedule, RetireOPD adopts Adaptive Retirement: the student drops the teacher on its own once their discrepancy stops shrinking and it reaches a target fraction of the teacher\u0027s success rate, after which training proceeds with RL alone. Across Qwen2.5 models from 1.5B to 7B, RetireOPD improves ALFWorld success rate over RL baseline by 14.1% to 18.8% and WebShop accuracy by 11.8% to 19.0%, and surpasses its own skill-conditioned teacher in every setting.", "arxiv_id": "2609.20784", "arxiv_url": "https://arxiv.org/abs/2609.20784", "authors": ["Yan Yu", "Zhengxi Lu", "Yizhou Liu", "Yichen Pan", "Aozhe Wang", "Qipeng Chen", "Hua Yang", "Wenqi Zhang", "Weiming Lu", "Qianglong Chen", "Yongliang Shen"], "brief": "\u672c\u6587\u63d0\u51fa RetireOPD\uff0c\u4e00\u79cd\u9762\u5411\u591a\u8f6e\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u81ea\u9000\u5f79\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u65b9\u6cd5\u3002\u5b83\u5148\u8bad\u7ec3\u5177\u5907\u7279\u6743\u6280\u80fd\u6761\u4ef6\u7684\u6559\u5e08\uff0c\u518d\u8ba9\u65e0\u6280\u80fd\u5b66\u751f\u7ed3\u5408 RL \u4e0e\u84b8\u998f\u5b66\u4e60\uff0c\u5e76\u5728\u5408\u9002\u65f6\u673a\u81ea\u52a8\u653e\u5f03\u6559\u5e08\u3001\u8f6c\u4e3a\u7eaf RL\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20784", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u667a\u80fd\u4f53\u4efb\u52a1\u4e2d\uff0c\u7279\u6743\u4fe1\u606f\u5e76\u4e0d\u603b\u80fd\u4fdd\u8bc1\u6559\u5e08\u53ef\u9760\uff0c\u4e14\u6559\u5e08\u76d1\u7763\u6536\u76ca\u968f\u8bad\u7ec3\u9636\u6bb5\u53d8\u5316\u3002", "\u63d0\u51fa Adaptive Retirement\uff1a\u5f53\u5b66\u751f\u4e0e\u6559\u5e08\u5dee\u5f02\u4e0d\u518d\u7f29\u5c0f\u4e14\u8fbe\u5230\u6559\u5e08\u6210\u529f\u7387\u76ee\u6807\u6bd4\u4f8b\u65f6\uff0c\u81ea\u52a8\u505c\u6b62\u84b8\u998f\u3002", "\u5728 Qwen2.5 1.5B \u5230 7B \u4e0a\uff0cALFWorld \u6210\u529f\u7387\u8f83 RL \u57fa\u7ebf\u63d0\u5347 14.1%\u201318.8%\uff0cWebShop \u51c6\u786e\u7387\u63d0\u5347 11.8%\u201319.0%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20784v1", "published_at": "2026-09-17", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RetireOPD: Self-Retiring On-Policy Distillation for Agentic Reinforcement Learning", "tldr": "\u8ba9\u667a\u80fd\u4f53\u81ea\u52a8\u505c\u6b62\u5411\u6559\u5e08\u84b8\u998f\uff0c\u5f3a\u5316\u5b66\u4e60\u66f4\u7a33\u66f4\u5f3a\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa RetireOPD\uff0c\u4e00\u79cd\u9762\u5411\u591a\u8f6e\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u81ea\u9000\u5f79\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u65b9\u6cd5\u3002\u5b83\u5148\u8bad\u7ec3\u5177\u5907\u7279\u6743\u6280\u80fd\u6761\u4ef6\u7684\u6559\u5e08\uff0c\u518d\u8ba9\u65e0\u6280\u80fd\u5b66\u751f\u7ed3\u5408 RL \u4e0e\u84b8\u998f\u5b66\u4e60\uff0c\u5e76\u5728\u5408\u9002\u65f6\u673a\u81ea\u52a8\u653e\u5f03\u6559\u5e08\u3001\u8f6c\u4e3a\u7eaf RL\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7f13\u89e3\u4e86\u667a\u80fd\u4f53 RL \u4e2d\u7a00\u758f\u5956\u52b1\u4e0e\u4e0d\u53ef\u9760\u6559\u5e08\u76d1\u7763\u7684\u77db\u76fe\uff0c\u907f\u514d\u4eba\u5de5\u8bbe\u5b9a\u84b8\u998f\u65e5\u7a0b\uff0c\u5e76\u4e14\u5b66\u751f\u6700\u7ec8\u5728\u6240\u6709\u8bbe\u7f6e\u4e2d\u8d85\u8fc7\u5176\u6280\u80fd\u6761\u4ef6\u6559\u5e08\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Cross-view object geo-localization (CVOGL) typically assumes a fixed query image, overlooking the ability of mobile agents to actively acquire more informative observations. To address this limitation, we introduce Active Cross-View Object Geo-Localization (ActiveGeo), where an agent sequentially selects new viewpoints and determines when to stop, aiming to improve localization with minimal observations. We further propose ActiveMoPT, an ActiveGeo framework with three-stage training. First, Multi-View Prompt-Preserving Adaptation enables the model to aggregate multiple query views while reusing the initial prompt. Second, Trajectory-Guided Policy Initialization uses supervised agent trajectories to learn viewpoint selection and initial stopping behavior. Third, Cost-Aware Policy Refinement employs GRPO with a gain-cost reward to jointly optimize localization accuracy and observation efficiency. We also construct ActiveGeo-858, a zero-shot test set containing 858 scenes and 1,716 target annotations. Experiments show that ActiveMoPT achieves state-of-the-art performance on MoP-UAV using only 1.45 query views on average, and substantially outperforms previous CVOGL approaches under zero-shot evaluation on ActiveGeo-858.", "arxiv_id": "2609.19662", "arxiv_url": "https://arxiv.org/abs/2609.19662", "authors": ["Shunyu Yao", "Xiaohan Zhang", "Zhuoran Yang", "Haoqi Lai", "Qi Ming", "Xiaoxi Hu", "Hui-Liang Shen", "Si-Yuan Cao"], "brief": "\u672c\u6587\u63d0\u51fa Active Cross-View Object Geo-Localization\uff08ActiveGeo\uff09\u4efb\u52a1\uff0c\u4f7f\u667a\u80fd\u4f53\u53ef\u987a\u5e8f\u9009\u62e9\u65b0\u89c6\u89d2\u5e76\u51b3\u5b9a\u4f55\u65f6\u505c\u6b62\uff0c\u4ee5\u7528\u66f4\u5c11\u89c2\u6d4b\u63d0\u5347\u8de8\u89c6\u89d2\u76ee\u6807\u5730\u7406\u5b9a\u4f4d\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa ActiveMoPT \u6846\u67b6\uff0c\u5e76\u6784\u5efa\u4e86\u96f6\u6837\u672c\u6d4b\u8bd5\u96c6 ActiveGeo-858\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19662", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7 Multi-View Prompt-Preserving Adaptation \u805a\u5408\u591a\u67e5\u8be2\u89c6\u89d2\uff0c\u540c\u65f6\u590d\u7528\u521d\u59cb\u63d0\u793a\u4fe1\u606f\u3002", "\u5229\u7528\u76d1\u7763\u5f0f\u8f68\u8ff9\u8fdb\u884c Trajectory-Guided Policy Initialization\uff0c\u521d\u59cb\u5316\u89c6\u89d2\u9009\u62e9\u4e0e\u505c\u6b62\u7b56\u7565\u3002", "\u91c7\u7528\u57fa\u4e8e GRPO \u7684 Cost-Aware Policy Refinement\uff0c\u7528\u589e\u76ca-\u6210\u672c\u5956\u52b1\u8054\u5408\u4f18\u5316\u5b9a\u4f4d\u7cbe\u5ea6\u548c\u89c2\u6d4b\u6548\u7387\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5730\u7406\u5b9a\u4f4d", "\u591a\u89c6\u89d2", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19662v1", "published_at": "2026-09-17", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Towards Active Cross-View Object Geo-Localization", "tldr": "\u8ba9\u79fb\u52a8\u667a\u80fd\u4f53\u4e3b\u52a8\u9009\u89c6\u89d2\u5b9a\u4f4d\u76ee\u6807", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Active Cross-View Object Geo-Localization\uff08ActiveGeo\uff09\u4efb\u52a1\uff0c\u4f7f\u667a\u80fd\u4f53\u53ef\u987a\u5e8f\u9009\u62e9\u65b0\u89c6\u89d2\u5e76\u51b3\u5b9a\u4f55\u65f6\u505c\u6b62\uff0c\u4ee5\u7528\u66f4\u5c11\u89c2\u6d4b\u63d0\u5347\u8de8\u89c6\u89d2\u76ee\u6807\u5730\u7406\u5b9a\u4f4d\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa ActiveMoPT \u6846\u67b6\uff0c\u5e76\u6784\u5efa\u4e86\u96f6\u6837\u672c\u6d4b\u8bd5\u96c6 ActiveGeo-858\u3002", "why_notable": "\u8bba\u6587\u5c06\u4f20\u7edf\u56fa\u5b9a\u67e5\u8be2\u56fe\u50cf\u7684\u8de8\u89c6\u89d2\u76ee\u6807\u5b9a\u4f4d\u6269\u5c55\u4e3a\u4e3b\u52a8\u611f\u77e5\u95ee\u9898\uff0c\u66f4\u8d34\u8fd1\u65e0\u4eba\u673a\u3001\u673a\u5668\u4eba\u7b49\u771f\u5b9e\u79fb\u52a8\u5e73\u53f0\uff1b\u5728 MoP-UAV \u4e0a\u4ec5\u5e73\u5747\u4f7f\u7528 1.45 \u4e2a\u67e5\u8be2\u89c6\u89d2\u5373\u8fbe\u5230\u6700\u4f18\u8868\u73b0\uff0c\u5e76\u5728\u96f6\u6837\u672c ActiveGeo-858 \u4e0a\u663e\u8457\u4f18\u4e8e\u65e2\u6709\u65b9\u6cd5\u3002"}, {"abstract": "Reasoning and agentic workloads increasingly demand efficient long-context inference. Yet full-attention decoding reads the growing history at every step, regardless of its benefit to the next prediction. We show that a pretrained model\u0027s decoding states already contain information predictive of this benefit, before the global read. Building on this finding, we introduce On-Demand Attention (ODA), a local-first decoding method that uses a lightweight recall head to selectively invoke global attention as its predicted benefit changes during generation. ODA trains only the recall head, leaving pretrained weights unchanged and the complete historical KV cache available for future recall. We further implement GPU-side conditional execution in vLLM, translating reduced global reads into practical decoding speedups over full attention at long context lengths. Experiments across Qwen and Gemma models, including hybrid-attention backbones, show that selective recall recovers most of the performance lost under local attention while substantially reducing global reads. These findings support long-context inference in which pretrained models guide their own access to the information they retain.", "arxiv_id": "2609.20734", "arxiv_url": "https://arxiv.org/abs/2609.20734", "authors": ["Haibo Feng", "Ruiqi Liang", "Hanyang Peng", "Shiqi Yu"], "brief": "\u8bba\u6587\u63d0\u51fa On-Demand Attention\uff08ODA\uff09\uff0c\u4e00\u79cd\u672c\u5730\u4f18\u5148\u7684\u957f\u4e0a\u4e0b\u6587\u89e3\u7801\u65b9\u6cd5\uff1a\u7528\u8f7b\u91cf recall head \u9884\u6d4b\u4f55\u65f6\u9700\u8981\u8c03\u7528\u5168\u5c40\u6ce8\u610f\u529b\u3002\u8be5\u65b9\u6cd5\u53ea\u8bad\u7ec3 recall head\uff0c\u4e0d\u6539\u52a8\u9884\u8bad\u7ec3\u6a21\u578b\u6743\u91cd\uff0c\u5e76\u4fdd\u7559\u5b8c\u6574\u5386\u53f2 KV cache \u4ee5\u4fbf\u540e\u7eed\u53ec\u56de\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20734", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u9884\u8bad\u7ec3\u6a21\u578b\u5728\u6267\u884c\u5168\u5c40\u8bfb\u53d6\u524d\uff0c\u5176\u89e3\u7801\u72b6\u6001\u5df2\u80fd\u9884\u6d4b\u5168\u5c40\u6ce8\u610f\u529b\u5bf9\u4e0b\u4e00\u6b65\u9884\u6d4b\u7684\u6536\u76ca\u3002", "ODA \u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u52a8\u6001\u9009\u62e9\u672c\u5730\u6ce8\u610f\u529b\u6216\u5168\u5c40\u6ce8\u610f\u529b\uff0c\u51cf\u5c11\u4e0d\u5fc5\u8981\u7684\u5386\u53f2\u4e0a\u4e0b\u6587\u8bfb\u53d6\u3002", "\u5728 vLLM \u4e2d\u5b9e\u73b0 GPU \u4fa7\u6761\u4ef6\u6267\u884c\uff0c\u5728 Qwen\u3001Gemma \u53ca\u6df7\u5408\u6ce8\u610f\u529b\u6a21\u578b\u4e0a\u51cf\u5c11\u5168\u5c40\u8bfb\u53d6\u5e76\u5e26\u6765\u957f\u4e0a\u4e0b\u6587\u89e3\u7801\u52a0\u901f\u3002"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u6ce8\u610f\u529b\u673a\u5236", "\u63a8\u7406\u52a0\u901f", "KV\u7f13\u5b58"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20734v1", "published_at": "2026-09-17", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "On-Demand Attention: Language Models Know When to Recall", "tldr": "\u6a21\u578b\u53ef\u6309\u9700\u51b3\u5b9a\u4f55\u65f6\u8bfb\u53d6\u957f\u4e0a\u4e0b\u6587\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa On-Demand Attention\uff08ODA\uff09\uff0c\u4e00\u79cd\u672c\u5730\u4f18\u5148\u7684\u957f\u4e0a\u4e0b\u6587\u89e3\u7801\u65b9\u6cd5\uff1a\u7528\u8f7b\u91cf recall head \u9884\u6d4b\u4f55\u65f6\u9700\u8981\u8c03\u7528\u5168\u5c40\u6ce8\u610f\u529b\u3002\u8be5\u65b9\u6cd5\u53ea\u8bad\u7ec3 recall head\uff0c\u4e0d\u6539\u52a8\u9884\u8bad\u7ec3\u6a21\u578b\u6743\u91cd\uff0c\u5e76\u4fdd\u7559\u5b8c\u6574\u5386\u53f2 KV cache \u4ee5\u4fbf\u540e\u7eed\u53ec\u56de\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u4e00\u79cd\u65e0\u9700\u6539\u52a8\u5927\u6a21\u578b\u4e3b\u4f53\u5373\u53ef\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u6548\u7387\u7684\u65b9\u6cd5\uff0c\u5728\u5c3d\u91cf\u4fdd\u6301\u6027\u80fd\u7684\u540c\u65f6\u964d\u4f4e\u5168\u5c40\u6ce8\u610f\u529b\u5f00\u9500\uff0c\u5bf9\u957f\u6587\u6863\u63a8\u7406\u548c\u9ad8\u541e\u5410\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model responses are non-deterministic, so failures in LLM agents are hard to reproduce: a failure depends on inference that is not bitwise reproducible, on tools that read changing state, and on a multi-step trajectory that a re-run rarely repeats. Record-and-replay makes a run reproducible, but existing agent tooling records runs only to trace or score them, not to test a code change against them. We present Chronicle, which records an agent run at its non-deterministic boundaries as immutable envelopes and replays it from the record. Its central operation, cut-point replay, serves a chosen subset of boundaries from the record and executes the complementary subset live with new code, turning a recorded incident into a regression test that runs in continuous integration. On a benchmark of 6 recorded failures with simulated model boundaries, recording adds 23 \u03bcs per crossing (0.008% of an assumed 300 ms model call), full replay issues zero model calls and is bit-stable across 20 repetitions, and cut-point tests fail on faulty code and pass on guarded and benign changes for all 6 incidents. In a mutation study of the guarded tools, cut-point tests catch every mutant that lets the recorded unsafe action through, while a baseline that stubs every boundary, using the same assertion, catches none. Chronicle and the benchmark are publicly available at https://github.com/theagentplane/chronicle.", "arxiv_id": "2609.20625", "arxiv_url": "https://arxiv.org/abs/2609.20625", "authors": ["Tisha Chawla", "Susheem Koul"], "brief": "Chronicle \u8bb0\u5f55\u667a\u80fd\u4f53\u8fd0\u884c\u4e2d\u7684\u975e\u786e\u5b9a\u6027\u8fb9\u754c\u4e3a\u4e0d\u53ef\u53d8\u5c01\u88c5\uff0c\u5e76\u53ef\u4ece\u8bb0\u5f55\u4e2d\u91cd\u653e\u3002\u5176\u6838\u5fc3\u7684 cut-point replay \u5141\u8bb8\u90e8\u5206\u8fb9\u754c\u7528\u5386\u53f2\u8bb0\u5f55\u3001\u90e8\u5206\u8fb9\u754c\u7528\u65b0\u4ee3\u7801\u5b9e\u65f6\u6267\u884c\uff0c\u4ece\u800c\u628a\u7ebf\u4e0a\u5931\u8d25\u8f6c\u5316\u4e3a\u53ef\u5728 CI \u4e2d\u8fd0\u884c\u7684\u56de\u5f52\u6d4b\u8bd5\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20625", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u975e\u786e\u5b9a\u6027\u6765\u6e90\uff1a\u6a21\u578b\u63a8\u7406\u3001\u5916\u90e8\u5de5\u5177\u72b6\u6001\u53d8\u5316\u3001\u591a\u6b65\u8f68\u8ff9\u6f02\u79fb\u3002", "\u8bb0\u5f55\u5f00\u9500\u4ec5\u7ea6\u6bcf\u6b21\u8fb9\u754c\u7a7f\u8d8a 23 \u5fae\u79d2\uff1b\u5b8c\u6574\u91cd\u653e\u65e0\u9700\u6a21\u578b\u8c03\u7528\uff0c\u5e76\u5728 20 \u6b21\u91cd\u590d\u4e2d\u4fdd\u6301\u6bd4\u7279\u7ea7\u7a33\u5b9a\u3002", "\u5728 6 \u4e2a\u8bb0\u5f55\u5931\u8d25\u6848\u4f8b\u548c\u5de5\u5177\u53d8\u5f02\u5b9e\u9a8c\u4e2d\uff0ccut-point \u6d4b\u8bd5\u80fd\u6355\u83b7\u653e\u884c\u5371\u9669\u52a8\u4f5c\u7684\u7f3a\u9677\uff0c\u800c\u5168\u8fb9\u754c\u6869\u66ff\u4ee3\u57fa\u7ebf\u65e0\u6cd5\u6355\u83b7\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u56de\u5f52\u6d4b\u8bd5", "\u53ef\u590d\u73b0\u6027", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20625v1", "published_at": "2026-09-17", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Chronicle: Cut-Point Replay for Regression Testing of LLM Agents", "tldr": "\u5c06LLM\u667a\u80fd\u4f53\u5931\u8d25\u590d\u73b0\u4e3a\u56de\u5f52\u6d4b\u8bd5", "upvotes": 0, "what_it_is": "Chronicle \u8bb0\u5f55\u667a\u80fd\u4f53\u8fd0\u884c\u4e2d\u7684\u975e\u786e\u5b9a\u6027\u8fb9\u754c\u4e3a\u4e0d\u53ef\u53d8\u5c01\u88c5\uff0c\u5e76\u53ef\u4ece\u8bb0\u5f55\u4e2d\u91cd\u653e\u3002\u5176\u6838\u5fc3\u7684 cut-point replay \u5141\u8bb8\u90e8\u5206\u8fb9\u754c\u7528\u5386\u53f2\u8bb0\u5f55\u3001\u90e8\u5206\u8fb9\u754c\u7528\u65b0\u4ee3\u7801\u5b9e\u65f6\u6267\u884c\uff0c\u4ece\u800c\u628a\u7ebf\u4e0a\u5931\u8d25\u8f6c\u5316\u4e3a\u53ef\u5728 CI \u4e2d\u8fd0\u884c\u7684\u56de\u5f52\u6d4b\u8bd5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u53ef\u89c2\u6d4b\u6027\u4ece\u201c\u8ffd\u8e2a/\u8bc4\u5206\u201d\u63a8\u8fdb\u5230\u201c\u53ef\u590d\u73b0\u56de\u5f52\u6d4b\u8bd5\u201d\uff0c\u4e3a LLM Agent \u7684\u6301\u7eed\u96c6\u6210\u3001\u6545\u969c\u590d\u76d8\u548c\u5b89\u5168\u9632\u62a4\u9a8c\u8bc1\u63d0\u4f9b\u4e86\u5b9e\u7528\u5de5\u7a0b\u673a\u5236\u3002"}, {"abstract": "The Internet of Agents is expected to enable large numbers of autonomous agents to discover, verify, and collaborate with each other across heterogeneous platforms. However, current agent protocols mainly address tool invocation and inter-agent communication, leaving scalable agent registration, trustworthy identification, and capability-oriented discovery largely unresolved. To address this, this paper proposes a scalable trust discovery architecture for the Internet of Agents. The proposed architecture adopts a hierarchical and distributed design consisting of three layers: Agent Root for trusted registry governance, Agent Registry for agent registration and metadata publication, and Agent Resolver for distributed capability discovery and trust-aware resolution. The architecture further introduces a registry-suffix-anchored composite identity scheme, which binds an agent native identifier to a trusted registry suffix to generate a globally discoverable identity. It also incorporates a dual-certificate and multi-level authentication mechanism to strengthen identity trust among agents. We implement a prototype and evaluate it through large-scale agent registration and resolution experiments. The prototype achieves an average registration latency of 58ms and an average discovery latency of 25ms, and it supports more than 19,000 registration requests per second and more than 29,000 agent discovery requests per second. These results demonstrate the feasibility of the proposed architecture, providing a practical approach toward scalable and identity-trusted agent ecosystems in the Internet of Agents.", "arxiv_id": "2609.20095", "arxiv_url": "https://arxiv.org/abs/2609.20095", "authors": ["Song Zhang", "Jiankang Yao", "Hongtao Li", "Xiaojun Zhang", "Xugang Shen", "Xin Li", "Yanbiao Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u6269\u5c55\u7684\u667a\u80fd\u4f53\u53ef\u4fe1\u53d1\u73b0\u67b6\u6784\uff0c\u7528\u4e8e\u652f\u6301\u8de8\u5e73\u53f0\u667a\u80fd\u4f53\u7684\u6ce8\u518c\u3001\u8eab\u4efd\u9a8c\u8bc1\u4e0e\u80fd\u529b\u53d1\u73b0\u3002\u67b6\u6784\u5305\u542b Agent Root\u3001Agent Registry\u3001Agent Resolver \u4e09\u5c42\uff0c\u5e76\u901a\u8fc7\u590d\u5408\u8eab\u4efd\u4e0e\u591a\u7ea7\u8ba4\u8bc1\u589e\u5f3a\u53ef\u4fe1\u534f\u4f5c\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20095", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u5c42\u6b21\u5316\u5206\u5e03\u5f0f\u8bbe\u8ba1\uff1aAgent Root \u8d1f\u8d23\u53ef\u4fe1\u6ce8\u518c\u6cbb\u7406\uff0cAgent Registry \u8d1f\u8d23\u6ce8\u518c\u4e0e\u5143\u6570\u636e\u53d1\u5e03\uff0cAgent Resolver \u8d1f\u8d23\u80fd\u529b\u53d1\u73b0\u4e0e\u53ef\u4fe1\u89e3\u6790", "\u63d0\u51fa\u57fa\u4e8e\u6ce8\u518c\u540e\u7f00\u951a\u5b9a\u7684\u590d\u5408\u8eab\u4efd\u65b9\u6848\uff0c\u5c06\u667a\u80fd\u4f53\u539f\u751f\u6807\u8bc6\u4e0e\u53ef\u4fe1\u6ce8\u518c\u540e\u7f00\u7ed1\u5b9a\uff0c\u5f62\u6210\u5168\u5c40\u53ef\u53d1\u73b0\u8eab\u4efd", "\u539f\u578b\u5b9e\u9a8c\u663e\u793a\u5e73\u5747\u6ce8\u518c\u5ef6\u8fdf 58ms\u3001\u53d1\u73b0\u5ef6\u8fdf 25ms\uff0c\u541e\u5410\u91cf\u8d85\u8fc7 1.9 \u4e07\u6b21\u6ce8\u518c/\u79d2\u548c 2.9 \u4e07\u6b21\u53d1\u73b0/\u79d2"], "keywords": ["\u667a\u80fd\u4f53", "\u53ef\u4fe1\u8eab\u4efd", "\u5206\u5e03\u5f0f\u7cfb\u7edf", "\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20095v1", "published_at": "2026-09-17", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Scalable Trust Discovery Architecture for the Internet of Agents", "tldr": "\u9762\u5411\u667a\u80fd\u4f53\u4e92\u8054\u7f51\u7684\u53ef\u4fe1\u53d1\u73b0\u67b6\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u6269\u5c55\u7684\u667a\u80fd\u4f53\u53ef\u4fe1\u53d1\u73b0\u67b6\u6784\uff0c\u7528\u4e8e\u652f\u6301\u8de8\u5e73\u53f0\u667a\u80fd\u4f53\u7684\u6ce8\u518c\u3001\u8eab\u4efd\u9a8c\u8bc1\u4e0e\u80fd\u529b\u53d1\u73b0\u3002\u67b6\u6784\u5305\u542b Agent Root\u3001Agent Registry\u3001Agent Resolver \u4e09\u5c42\uff0c\u5e76\u901a\u8fc7\u590d\u5408\u8eab\u4efd\u4e0e\u591a\u7ea7\u8ba4\u8bc1\u589e\u5f3a\u53ef\u4fe1\u534f\u4f5c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u8db3\u4e86\u73b0\u6709\u667a\u80fd\u4f53\u534f\u8bae\u5728\u53ef\u4fe1\u6ce8\u518c\u3001\u8eab\u4efd\u8bc6\u522b\u548c\u80fd\u529b\u53d1\u73b0\u4e0a\u7684\u7f3a\u53e3\uff0c\u4e3a\u5927\u89c4\u6a21 Internet of Agents \u751f\u6001\u63d0\u4f9b\u4e86\u53ef\u843d\u5730\u7684\u57fa\u7840\u8bbe\u65bd\u65b9\u6848\u3002"}, {"abstract": "Historical archives pose a difficult retrieval problem for retrievalaugmented generation systems: documents are OCR-degraded, heterogeneous across genres and sources, and require strong source traceability for scholarly and institutional use. We introduce TRACE, a training-free agentic retrieval framework designed for accountable source discovery over historical corpora. The system was developed in the context of DECIDON, an interdisciplinary project on the circulation of political discourse between parliamentary debates and the press during the French Third Republic, involving digitised historical collections and institutional use cases. The prototype is currently deployed internally within the project and accessible to 24 researchers across six partner institutions. We evaluate TRACE on HistoriQA-ThirdRepublic, a benchmark of 1,752 French historical questions over parliamentary debates and newspapers from 1887, with documents derived from Biblioth{\u00e8}que nationale de France digitised collections. TRACE achieves R@10 = 0.856 and MRR = 0.653, outperforming sparse, dense, graph-based, and agentic RAG baselines, with the largest gains on multi-hop and cross-corpus questions. At approximately $0.02 per question under the default hosted inference configuration, TRACE also remains economically feasible for heritage institutions, laboratories or companies that cannot rely on costly local GPU infrastructure. These results suggest that, for large digital libraries and archives, retrieval accountability and corpus-aware agent design can provide a practical alternative to heavier training-based or graph-construction approaches.", "arxiv_id": "2609.19897", "arxiv_url": "https://arxiv.org/abs/2609.19897", "authors": ["Donghan Bian", "Marie Puren", "Florian Cafiero"], "brief": "TRACE \u662f\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u667a\u80fd\u4f53\u68c0\u7d22\u6846\u67b6\uff0c\u7528\u4e8e\u5728 OCR \u9000\u5316\u3001\u6765\u6e90\u5f02\u6784\u7684\u5386\u53f2\u6863\u6848\u4e2d\u8fdb\u884c\u53ef\u95ee\u8d23\u7684\u6765\u6e90\u53d1\u73b0\u3002\u5b83\u9762\u5411\u6cd5\u56fd\u7b2c\u4e09\u5171\u548c\u56fd\u8bae\u4f1a\u8fa9\u8bba\u4e0e\u62a5\u520a\u8bed\u6599\uff0c\u5f3a\u8c03\u68c0\u7d22\u7ed3\u679c\u7684\u6765\u6e90\u53ef\u8ffd\u8e2a\u6027\u4e0e\u8de8\u8bed\u6599\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19897", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5728 HistoriQA-ThirdRepublic \u57fa\u51c6\u4e0a\u8bc4\u6d4b\uff0c\u8986\u76d6 1752 \u4e2a\u6cd5\u8bed\u5386\u53f2\u95ee\u9898\uff0c\u6570\u636e\u6765\u81ea\u6cd5\u56fd\u56fd\u5bb6\u56fe\u4e66\u9986\u6570\u5b57\u5316\u9986\u85cf", "\u8fbe\u5230 R@10 = 0.856\u3001MRR = 0.653\uff0c\u4f18\u4e8e\u7a00\u758f\u68c0\u7d22\u3001\u7a20\u5bc6\u68c0\u7d22\u3001\u56fe\u65b9\u6cd5\u548c\u5176\u4ed6 agentic RAG \u57fa\u7ebf", "\u5728\u591a\u8df3\u95ee\u9898\u548c\u8de8\u8bed\u6599\u95ee\u9898\u4e0a\u63d0\u5347\u6700\u660e\u663e\uff0c\u9ed8\u8ba4\u6258\u7ba1\u63a8\u7406\u6210\u672c\u7ea6\u6bcf\u9898 0.02 \u7f8e\u5143"], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u6570\u5b57\u6863\u6848", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19897v1", "published_at": "2026-09-17", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "TRACE: Accountable Agentic Retrieval for Source Discovery in Digital Archives", "tldr": "\u9762\u5411\u5386\u53f2\u6863\u6848\u7684\u53ef\u8ffd\u6eaf\u667a\u80fd\u4f53\u68c0\u7d22\u6846\u67b6", "upvotes": 0, "what_it_is": "TRACE \u662f\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u667a\u80fd\u4f53\u68c0\u7d22\u6846\u67b6\uff0c\u7528\u4e8e\u5728 OCR \u9000\u5316\u3001\u6765\u6e90\u5f02\u6784\u7684\u5386\u53f2\u6863\u6848\u4e2d\u8fdb\u884c\u53ef\u95ee\u8d23\u7684\u6765\u6e90\u53d1\u73b0\u3002\u5b83\u9762\u5411\u6cd5\u56fd\u7b2c\u4e09\u5171\u548c\u56fd\u8bae\u4f1a\u8fa9\u8bba\u4e0e\u62a5\u520a\u8bed\u6599\uff0c\u5f3a\u8c03\u68c0\u7d22\u7ed3\u679c\u7684\u6765\u6e90\u53ef\u8ffd\u8e2a\u6027\u4e0e\u8de8\u8bed\u6599\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u6216\u5927\u89c4\u6a21\u56fe\u6784\u5efa\uff0c\u4e5f\u80fd\u901a\u8fc7\u9762\u5411\u8bed\u6599\u7279\u6027\u7684\u667a\u80fd\u4f53\u8bbe\u8ba1\u63d0\u5347\u5386\u53f2\u6863\u6848\u68c0\u7d22\u7684\u53ef\u9760\u6027\u3001\u53ef\u89e3\u91ca\u6027\u548c\u5b9e\u9645\u53ef\u90e8\u7f72\u6027\uff0c\u5bf9\u6570\u5b57\u4eba\u6587\u3001\u6863\u6848\u9986\u548c\u6587\u5316\u9057\u4ea7\u673a\u6784\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning for LLM agents involves two distinct optimization di- mensions: how environment feedback is exploited within a trajectory, and how complete trajectories are aggregated across a batch. We formulate these dimen- sions as Intra-Trajectory Feedback Attribution and Inter-Trajectory Objec- tive Aggregation, and introduce BATON (Bayesian Attribution and Trajectory Objective Normalization), a dual-axis policy optimization framework. BATON instantiates the first axis with Bayesian Feedback Attribution, which constructs a feedback-conditioned posterior over sampled actions, and the second with Trajec- tory Mass Normalization (TMN), which assigns equal optimization mass to com- plete trajectories. Experiments with GRPO and GiGPO on ALFWorld, WebShop, and SearchQA show that both axes provide independent gains and that their combi- nation consistently achieves the strongest overall performance across model scales.", "arxiv_id": "2609.19830", "arxiv_url": "https://arxiv.org/abs/2609.19830", "authors": ["Yingxuan Zhuang", "Binhe Yu", "Jingxiao Yang", "Ruopei Sun", "Ziting Li", "Cheng Tan", "Xuhong Zhang", "Jianwei Yin", "Jintao Chen"], "brief": "\u8bba\u6587\u63d0\u51faBATON\u53cc\u8f74\u7b56\u7565\u4f18\u5316\u6846\u67b6\uff0c\u5c06LLM\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u62c6\u5206\u4e3a\u8f68\u8ff9\u5185\u53cd\u9988\u5f52\u56e0\u4e0e\u8f68\u8ff9\u95f4\u76ee\u6807\u805a\u5408\u4e24\u90e8\u5206\u3002\u5b83\u7528\u8d1d\u53f6\u65af\u53cd\u9988\u5f52\u56e0\u4e3a\u52a8\u4f5c\u6784\u9020\u53cd\u9988\u6761\u4ef6\u540e\u9a8c\uff0c\u5e76\u7528\u8f68\u8ff9\u8d28\u91cf\u5f52\u4e00\u5316\u8ba9\u5b8c\u6574\u8f68\u8ff9\u83b7\u5f97\u5747\u7b49\u4f18\u5316\u6743\u91cd\u3002", "categories": ["cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19830", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51faIntra-Trajectory Feedback Attribution\u4e0eInter-Trajectory Objective Aggregation\u4e24\u6761\u4f18\u5316\u7ef4\u5ea6\uff0c\u7528\u4e8e\u7cfb\u7edf\u5206\u6790LLM\u667a\u80fd\u4f53RL\u8bad\u7ec3\u3002", "Bayesian Feedback Attribution\u6839\u636e\u73af\u5883\u53cd\u9988\u5bf9\u91c7\u6837\u52a8\u4f5c\u8fdb\u884c\u540e\u9a8c\u5f52\u56e0\uff0c\u63d0\u5347\u8f68\u8ff9\u5185\u4fe1\u7528\u5206\u914d\u8d28\u91cf\u3002", "Trajectory Mass Normalization\u4e3a\u6bcf\u6761\u5b8c\u6574\u8f68\u8ff9\u5206\u914d\u76f8\u7b49\u4f18\u5316\u8d28\u91cf\uff0c\u51cf\u5c11\u6279\u5185\u8f68\u8ff9\u805a\u5408\u504f\u7f6e\uff1b\u5728ALFWorld\u3001WebShop\u3001SearchQA\u4e0a\u7ed3\u5408GRPO\u548cGiGPO\u5747\u5e26\u6765\u7a33\u5b9a\u589e\u76ca\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u7b56\u7565\u4f18\u5316", "\u8d1d\u53f6\u65af\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19830v1", "published_at": "2026-09-17", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Dual-Axis Policy Optimization for LLM Agents: Bayesian Feedback Attribution and Trajectory Mass Normalization", "tldr": "BATON\u4ece\u53cd\u9988\u5f52\u56e0\u4e0e\u8f68\u8ff9\u805a\u5408\u4e24\u8f74\u4f18\u5316LLM\u667a\u80fd\u4f53\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faBATON\u53cc\u8f74\u7b56\u7565\u4f18\u5316\u6846\u67b6\uff0c\u5c06LLM\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u62c6\u5206\u4e3a\u8f68\u8ff9\u5185\u53cd\u9988\u5f52\u56e0\u4e0e\u8f68\u8ff9\u95f4\u76ee\u6807\u805a\u5408\u4e24\u90e8\u5206\u3002\u5b83\u7528\u8d1d\u53f6\u65af\u53cd\u9988\u5f52\u56e0\u4e3a\u52a8\u4f5c\u6784\u9020\u53cd\u9988\u6761\u4ef6\u540e\u9a8c\uff0c\u5e76\u7528\u8f68\u8ff9\u8d28\u91cf\u5f52\u4e00\u5316\u8ba9\u5b8c\u6574\u8f68\u8ff9\u83b7\u5f97\u5747\u7b49\u4f18\u5316\u6743\u91cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u5e38\u88ab\u6df7\u5728\u4e00\u8d77\u7684\u53cd\u9988\u5229\u7528\u4e0e\u8f68\u8ff9\u805a\u5408\u95ee\u9898\u660e\u786e\u89e3\u8026\uff0c\u5e76\u7ed9\u51fa\u53ef\u63d2\u5165\u73b0\u6709\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\u7684\u6539\u8fdb\u7ec4\u4ef6\uff1b\u5728\u591a\u4e2a\u4ea4\u4e92\u5f0f\u4efb\u52a1\u548c\u6a21\u578b\u89c4\u6a21\u4e0a\u9a8c\u8bc1\u4e86\u4e92\u8865\u6536\u76ca\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Hateful memes spread abusive content through implicit interactions between images and text, posing serious threats to the safety of online communities. In recent years, multimodal large language models have been widely used for hateful meme detection and are increasingly adopted to generate explainable detection results. However, we find that existing explain-then-detect methods often couple explanation generation and label prediction within the same training process. This coupling causes interference between task objectives, leading to limited detection performance and even worse results than simple SFT baselines. To address these challenges, we propose ProKDA, a progressive knowledge-to-decision alignment method for explainable hateful meme detection. Inspired by the human annotation training process, ProKDA first uses an agentic background knowledge construction pipeline to obtain external knowledge related to meme understanding. It then adopts a three-stage training strategy that sequentially performs background knowledge learning, hatefulness detection learning, and hatefulness boundary alignment. Unlike prior explain-then-detect methods that jointly optimize both tasks, ProKDA focuses on a single training objective at each stage. This design reduces interference between the two tasks and progressively transforms background knowledge into robust detection decisions. Experiments on three public hateful meme benchmarks show that ProKDA achieves state-of-the-art detection performance and provides accurate, explainable, and evidence-supported decisions for hateful meme moderation. Project page: https://meizhiyuan88666.github.io/prokda.", "arxiv_id": "2609.19778", "arxiv_url": "https://arxiv.org/abs/2609.19778", "authors": ["Bo Xu", "Chenyuan Wang", "Xinyu Chen", "Quanhao Zhu", "Rui Lin", "Liang Zhao", "Hongfei Lin", "Feng Xia"], "brief": "\u8bba\u6587\u63d0\u51fa ProKDA\uff0c\u4e00\u79cd\u9762\u5411\u53ef\u89e3\u91ca\u4ec7\u6068\u6897\u56fe\u68c0\u6d4b\u7684\u6e10\u8fdb\u5f0f\u77e5\u8bc6\u5230\u51b3\u7b56\u5bf9\u9f50\u65b9\u6cd5\u3002\u5b83\u5148\u6784\u5efa\u4e0e\u6897\u56fe\u7406\u89e3\u76f8\u5173\u7684\u5916\u90e8\u80cc\u666f\u77e5\u8bc6\uff0c\u518d\u901a\u8fc7\u4e09\u9636\u6bb5\u8bad\u7ec3\u9010\u6b65\u5c06\u77e5\u8bc6\u8f6c\u5316\u4e3a\u7a33\u5065\u7684\u4ec7\u6068\u5224\u65ad\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19778", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u7528\u667a\u80fd\u5316\u80cc\u666f\u77e5\u8bc6\u6784\u5efa\u6d41\u7a0b\uff0c\u83b7\u53d6\u56fe\u6587\u9690\u542b\u8bed\u4e49\u3001\u6587\u5316\u80cc\u666f\u548c\u6f5c\u5728\u653b\u51fb\u5bf9\u8c61\u7b49\u5916\u90e8\u8bc1\u636e", "\u91c7\u7528\u4e09\u9636\u6bb5\u8bad\u7ec3\uff1a\u80cc\u666f\u77e5\u8bc6\u5b66\u4e60\u3001\u4ec7\u6068\u68c0\u6d4b\u5b66\u4e60\u3001\u4ec7\u6068\u8fb9\u754c\u5bf9\u9f50\uff0c\u907f\u514d\u89e3\u91ca\u751f\u6210\u4e0e\u6807\u7b7e\u9884\u6d4b\u76ee\u6807\u76f8\u4e92\u5e72\u6270", "\u5728\u4e09\u4e2a\u516c\u5f00\u4ec7\u6068\u6897\u56fe\u57fa\u51c6\u4e0a\u53d6\u5f97 SOTA\uff0c\u5e76\u80fd\u7ed9\u51fa\u5e26\u8bc1\u636e\u652f\u6491\u7684\u53ef\u89e3\u91ca\u5224\u51b3"], "keywords": ["\u591a\u6a21\u6001", "\u5185\u5bb9\u5b89\u5168", "\u53ef\u89e3\u91ca\u6027", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19778v1", "published_at": "2026-09-17", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Learn Before You Judge: Progressive Knowledge-to-Decision Alignment for Explainable Hateful Meme Detection", "tldr": "\u5206\u9636\u6bb5\u5bf9\u9f50\u77e5\u8bc6\u4e0e\u51b3\u7b56\uff0c\u63d0\u5347\u4ec7\u6068\u6897\u56fe\u68c0\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ProKDA\uff0c\u4e00\u79cd\u9762\u5411\u53ef\u89e3\u91ca\u4ec7\u6068\u6897\u56fe\u68c0\u6d4b\u7684\u6e10\u8fdb\u5f0f\u77e5\u8bc6\u5230\u51b3\u7b56\u5bf9\u9f50\u65b9\u6cd5\u3002\u5b83\u5148\u6784\u5efa\u4e0e\u6897\u56fe\u7406\u89e3\u76f8\u5173\u7684\u5916\u90e8\u80cc\u666f\u77e5\u8bc6\uff0c\u518d\u901a\u8fc7\u4e09\u9636\u6bb5\u8bad\u7ec3\u9010\u6b65\u5c06\u77e5\u8bc6\u8f6c\u5316\u4e3a\u7a33\u5065\u7684\u4ec7\u6068\u5224\u65ad\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u73b0\u6709\u201c\u5148\u89e3\u91ca\u518d\u68c0\u6d4b\u201d\u8054\u5408\u4f18\u5316\u4f1a\u635f\u5bb3\u68c0\u6d4b\u6027\u80fd\uff0c\u5e76\u901a\u8fc7\u5206\u9636\u6bb5\u5355\u76ee\u6807\u8bad\u7ec3\u7f13\u89e3\u4efb\u52a1\u5e72\u6270\uff0c\u5728\u5185\u5bb9\u5b89\u5168\u573a\u666f\u4e2d\u517c\u987e\u51c6\u786e\u6027\u4e0e\u53ef\u89e3\u91ca\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent advances in artificial intelligence (AI) are reshaping smart glasses from egocentric capture and display devices into platforms for wearable intelligence. Smart glasses increasingly serve as wearable AI systems that connect first-person observation with real-time assistance under strict form-factor constraints. We frame this transition through the lens of \\emph{AI smart glasses} and define them as a system-level concept in which egocentric sensing, resource-aware computing, intelligent reasoning, multimodal interaction, and real-world application constraints are co-designed for personalized assistance in the physical world. To systematically study this perspective, we organize the survey around four connected dimensions. First, we examine the hardware foundation that bounds sensing, computation, feedback delivery, and sustained deployment. Second, we study wearable intelligence, where egocentric signals are transformed into perceptual, contextual, and agentic capabilities. Third, we discuss interaction design, through which users request, receive, correct, and regulate assistance during ongoing activity. Fourth, we analyze application scenarios across healthcare, accessibility, situated learning, daily life assistance, cultural tourism, and industrial support, showing how domain requirements reshape system design and evaluation. We further identify five cross-cutting research challenges for future AI smart glasses: next-generation hardware, trustworthy egocentric intelligence, lifelong personalized memory, proactive intelligence, and embodied foundation models. By centering smart glasses as wearable-intelligence platforms, this survey provides a unified framework for organizing technologies, applications, and open challenges in this emerging area.", "arxiv_id": "2609.19793", "arxiv_url": "https://arxiv.org/abs/2609.19793", "authors": ["Xu Yuan", "Yi Wang", "Zhuohang Jiang", "Haohao Qu", "Yujuan Ding", "Shanru Lin", "Guoliang Xing", "Hongxia Yang", "Jiannong Cao", "Qing Li", "Wenqi Fan"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e AI smart glasses \u7684\u7cfb\u7edf\u7efc\u8ff0\uff0c\u5c06\u667a\u80fd\u773c\u955c\u4ece\u7b2c\u4e00\u89c6\u89d2\u611f\u77e5\u8bbe\u5907\u91cd\u65b0\u5b9a\u4e49\u4e3a\u9762\u5411\u7269\u7406\u4e16\u754c\u4e2a\u6027\u5316\u8f85\u52a9\u7684\u53ef\u7a7f\u6234\u667a\u80fd\u5e73\u53f0\u3002\u8bba\u6587\u4ece\u786c\u4ef6\u3001\u53ef\u7a7f\u6234\u667a\u80fd\u3001\u4ea4\u4e92\u8bbe\u8ba1\u548c\u5e94\u7528\u573a\u666f\u56db\u4e2a\u7ef4\u5ea6\u68b3\u7406\u6280\u672f\u8109\u7edc\u4e0e\u7cfb\u7edf\u6311\u6218\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19793", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa AI smart glasses \u7684\u7cfb\u7edf\u7ea7\u5b9a\u4e49\uff0c\u5f3a\u8c03\u7b2c\u4e00\u89c6\u89d2\u611f\u77e5\u3001\u8d44\u6e90\u53d7\u9650\u8ba1\u7b97\u3001\u667a\u80fd\u63a8\u7406\u3001\u591a\u6a21\u6001\u4ea4\u4e92\u4e0e\u771f\u5b9e\u5e94\u7528\u7ea6\u675f\u7684\u534f\u540c\u8bbe\u8ba1", "\u7cfb\u7edf\u68b3\u7406\u786c\u4ef6\u57fa\u7840\u3001\u611f\u77e5\u4e0e\u60c5\u5883\u7406\u89e3\u3001\u667a\u80fd\u4f53\u80fd\u529b\u3001\u7528\u6237\u4ea4\u4e92\u673a\u5236\u53ca\u533b\u7597\u3001\u65e0\u969c\u788d\u3001\u5b66\u4e60\u3001\u65e5\u5e38\u8f85\u52a9\u3001\u5de5\u4e1a\u7b49\u5e94\u7528\u573a\u666f", "\u603b\u7ed3\u672a\u6765\u4e94\u5927\u6311\u6218\uff1a\u4e0b\u4e00\u4ee3\u786c\u4ef6\u3001\u53ef\u4fe1\u7b2c\u4e00\u89c6\u89d2\u667a\u80fd\u3001\u7ec8\u8eab\u4e2a\u6027\u5316\u8bb0\u5fc6\u3001\u4e3b\u52a8\u667a\u80fd\u548c\u5177\u8eab\u57fa\u7840\u6a21\u578b"], "keywords": ["\u53ef\u7a7f\u6234\u667a\u80fd", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19793v1", "published_at": "2026-09-17", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AI Smart Glasses for Wearable Intelligence: From Egocentric Sensing to Agentic Personalization", "tldr": "\u7efc\u8ff0AI\u667a\u80fd\u773c\u955c\u7684\u53ef\u7a7f\u6234\u667a\u80fd\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e AI smart glasses \u7684\u7cfb\u7edf\u7efc\u8ff0\uff0c\u5c06\u667a\u80fd\u773c\u955c\u4ece\u7b2c\u4e00\u89c6\u89d2\u611f\u77e5\u8bbe\u5907\u91cd\u65b0\u5b9a\u4e49\u4e3a\u9762\u5411\u7269\u7406\u4e16\u754c\u4e2a\u6027\u5316\u8f85\u52a9\u7684\u53ef\u7a7f\u6234\u667a\u80fd\u5e73\u53f0\u3002\u8bba\u6587\u4ece\u786c\u4ef6\u3001\u53ef\u7a7f\u6234\u667a\u80fd\u3001\u4ea4\u4e92\u8bbe\u8ba1\u548c\u5e94\u7528\u573a\u666f\u56db\u4e2a\u7ef4\u5ea6\u68b3\u7406\u6280\u672f\u8109\u7edc\u4e0e\u7cfb\u7edf\u6311\u6218\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u4e3a\u5feb\u901f\u53d1\u5c55\u7684AI\u667a\u80fd\u773c\u955c\u9886\u57df\u63d0\u4f9b\u4e86\u7edf\u4e00\u5206\u7c7b\u6846\u67b6\uff0c\u628a\u786c\u4ef6\u5f62\u6001\u3001\u7b2c\u4e00\u89c6\u89d2AI\u3001\u4e2a\u6027\u5316\u8bb0\u5fc6\u4e0e\u667a\u80fd\u4f53\u5f0f\u8f85\u52a9\u8fde\u63a5\u8d77\u6765\uff0c\u6709\u52a9\u4e8e\u6307\u5bfc\u672a\u6765\u53ef\u7a7f\u6234AI\u7cfb\u7edf\u8bbe\u8ba1\u4e0e\u8bc4\u4f30\u3002"}, {"abstract": "The growing complexity of multi-domain operational environments (land, aerospace, naval, cyber, and electromagnetic spectrum) has increased the volume and velocity of data reaching command-and-control (C2) centers, straining the observe-orient-decide-act (OODA) decision cycle. Artificial Intelligence (AI) systems currently employed in defense are, in general, reactive and isolated tools that still rely heavily on human operators to integrate information, assess scenarios, and formulate courses of action. This paper proposes a conceptual Agentic AI architecture for AI systems that can plan, access data sources, execute tools, and act autonomously and audibly, aimed at supporting decision-making across the three Brazilian Armed Forces (Navy, Army, and Air Force). Four application fronts are discussed (decision support, situational analysis, feasibility studies, and countermeasure suggestion), as well as the data and sensor access requirements and the security and permission safeguards necessary for responsible employment across administrative, strategic, operational, and tactical contexts.", "arxiv_id": "2609.20080", "arxiv_url": "https://arxiv.org/abs/2609.20080", "authors": ["Gioliano de Oliveira Braga", "Sidnei Barbieri", "\u00c1gney Lopes Roth Ferraz", "Wagner Comin Sonaglio", "Henrique Curi de Miranda e Louren\u00e7o Alves Pereira"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6982\u5ff5\u6027 Agentic AI \u67b6\u6784\uff0c\u7528\u4e8e\u652f\u6301\u5df4\u897f\u6d77\u9646\u7a7a\u4e09\u519b\u5728\u9646\u3001\u7a7a\u5929\u3001\u6d77\u3001\u7f51\u7edc\u4e0e\u7535\u78c1\u7b49\u591a\u57df\u73af\u5883\u4e2d\u7684\u6307\u6325\u63a7\u5236\u51b3\u7b56\u3002\u8be5\u67b6\u6784\u5f3a\u8c03\u667a\u80fd\u4f53\u53ef\u89c4\u5212\u3001\u8bbf\u95ee\u6570\u636e\u6e90\u3001\u8c03\u7528\u5de5\u5177\uff0c\u5e76\u5728\u6743\u9650\u4e0e\u5ba1\u8ba1\u7ea6\u675f\u4e0b\u81ea\u4e3b\u8f85\u52a9\u884c\u52a8\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20080", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u9762\u5411 OODA \u51b3\u7b56\u5faa\u73af\u538b\u529b\uff0c\u8bd5\u56fe\u5c06\u5206\u6563\u7684\u9632\u52a1 AI \u5de5\u5177\u6574\u5408\u4e3a\u53ef\u534f\u540c\u7684\u667a\u80fd\u4f53\u5f0f\u51b3\u7b56\u652f\u6301\u7cfb\u7edf", "\u8ba8\u8bba\u56db\u7c7b\u5e94\u7528\u573a\u666f\uff1a\u51b3\u7b56\u652f\u6301\u3001\u6001\u52bf\u5206\u6790\u3001\u53ef\u884c\u6027\u7814\u7a76\u4e0e\u53cd\u5236\u63aa\u65bd\u5efa\u8bae", "\u5f3a\u8c03\u8de8\u5c42\u7ea7\u4f7f\u7528\u6240\u9700\u7684\u6570\u636e/\u4f20\u611f\u5668\u63a5\u5165\u3001\u5b89\u5168\u6743\u9650\u3001\u53ef\u5ba1\u8ba1\u6027\u4e0e\u8d1f\u8d23\u4efb\u90e8\u7f72\u673a\u5236"], "keywords": ["\u667a\u80fd\u4f53", "\u51b3\u7b56\u652f\u6301", "\u591a\u667a\u80fd\u4f53", "\u519b\u4e8bAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20080v1", "published_at": "2026-09-17", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A Proposal for an Agentic AI Architecture to Support Multi-Domain Decision-Making in the Brazilian Armed Forces", "tldr": "\u9762\u5411\u5df4\u897f\u519b\u65b9\u7684\u591a\u57df\u667a\u80fd\u4f53\u51b3\u7b56\u67b6\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u6982\u5ff5\u6027 Agentic AI \u67b6\u6784\uff0c\u7528\u4e8e\u652f\u6301\u5df4\u897f\u6d77\u9646\u7a7a\u4e09\u519b\u5728\u9646\u3001\u7a7a\u5929\u3001\u6d77\u3001\u7f51\u7edc\u4e0e\u7535\u78c1\u7b49\u591a\u57df\u73af\u5883\u4e2d\u7684\u6307\u6325\u63a7\u5236\u51b3\u7b56\u3002\u8be5\u67b6\u6784\u5f3a\u8c03\u667a\u80fd\u4f53\u53ef\u89c4\u5212\u3001\u8bbf\u95ee\u6570\u636e\u6e90\u3001\u8c03\u7528\u5de5\u5177\uff0c\u5e76\u5728\u6743\u9650\u4e0e\u5ba1\u8ba1\u7ea6\u675f\u4e0b\u81ea\u4e3b\u8f85\u52a9\u884c\u52a8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u667a\u80fd\u4f53 AI \u5f15\u5165\u591a\u57df\u519b\u4e8b\u6307
