sues is infeasible at scale. To address these challenges, we introduce WiCleanData, a refined version of Wikidata with a consistent tax- onomy and free from type constraint violations. Specifically, we have designed an automated pipeline that first cleans the taxonomy with language model assistance, then simplifies type constraints by hierarchical aggregation, and finally filters facts accordingly. The resulting knowledge graph, free from any type violation, is made publicly available via a Web interface, enabling easy exploration and downstream applications.", "arxiv_id": "2609.20057", "arxiv_url": "https://arxiv.org/abs/2609.20057", "authors": ["Yiwen Peng", "Marc Jeanmougin", "Thomas Bonald"], "brief": "\u672c\u6587\u63d0\u51fa WiCleanData\uff0c\u4e00\u4e2a\u901a\u8fc7\u5206\u7c7b\u4f53\u7cfb\u7cbe\u70bc\u4e0e\u7c7b\u578b\u7ea6\u675f\u6267\u884c\u6765\u6e05\u7406 Wikidata \u7684\u81ea\u52a8\u5316\u6d41\u7a0b\u3002\u8be5\u65b9\u6cd5\u501f\u52a9\u8bed\u8a00\u6a21\u578b\u6e05\u7406\u5206\u7c7b\u5c42\u7ea7\u3001\u805a\u5408\u7b80\u5316\u7c7b\u578b\u7ea6\u675f\uff0c\u5e76\u8fc7\u6ee4\u8fdd\u89c4\u4e8b\u5b9e\uff0c\u5f97\u5230\u65e0\u7c7b\u578b\u7ea6\u675f\u51b2\u7a81\u7684\u516c\u5f00\u77e5\u8bc6\u56fe\u8c31\uff0c\u4fbf\u4e8e\u68c0\u7d22\u548c\u4e0b\u6e38\u5e94\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20057", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u6570\u636e\u6e05\u6d17", "\u8bed\u8a00\u6a21\u578b", "\u7c7b\u578b\u7ea6\u675f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20057v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "WiCleanData: Guaranteeing the Type Consistency of Wikidata by Taxonomy Refinement and Constraint Enforcement", "tldr": "\u672c\u6587\u63d0\u51fa WiCleanData\uff0c\u4e00\u4e2a\u901a\u8fc7\u5206\u7c7b\u4f53\u7cfb\u7cbe\u70bc\u4e0e\u7c7b\u578b\u7ea6\u675f\u6267\u884c\u6765\u6e05\u7406 Wikidata \u7684\u81ea\u52a8\u5316\u6d41\u7a0b\u3002\u8be5\u65b9\u6cd5\u501f\u52a9\u8bed\u8a00\u6a21\u578b\u6e05\u7406\u5206\u7c7b\u5c42\u7ea7\u3001\u805a\u5408\u7b80\u5316\u7c7b\u578b\u7ea6\u675f\uff0c\u5e76\u8fc7\u6ee4\u8fdd\u89c4\u4e8b\u5b9e\uff0c\u5f97\u5230\u65e0\u7c7b\u578b\u7ea6\u675f\u51b2\u7a81\u7684\u516c\u5f00\u77e5\u8bc6\u56fe\u8c31\uff0c\u4fbf\u4e8e\u68c0\u7d22\u548c\u4e0b\u6e38\u5e94\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hierarchical robotic systems executing long-horizon manipulation tasks must make high-level semantic decisions that orchestrate stochastic low-level skills. In this setting, failed rollouts are ambiguous: a poor downstream state may reflect an invalid high-level decision, partial observation, or a valid decision whose physical execution failed. Traditional supervised learning lacks data for such recovery states, while reinforcement learning struggles with sparse rewards and non-local credit assignment. We propose MAGMA-GEN, an on-policy data-generation pipeline that converts ambiguous failed rollouts into validated recovery supervision. MAGMA-GEN first uses a privileged coach to hypothesize an early decision-level error and propose localized correction or recovery actions. Because this diagnosis is fallible, candidates are retained only if re-execution from the same state under matched conditions improves downstream progress. This produces supervised examples from the agent\u0027s own failure distribution without per-step human demonstrations. Evaluated on interactive long-horizon manipulation tasks, MAGMA-GEN improves task success and recovery capabilities, against distillation and trajectory-repair baselines under evolving task constraints in both simulation and real-robot execution.", "arxiv_id": "2609.20056", "arxiv_url": "https://arxiv.org/abs/2609.20056", "authors": ["Loan Bernat", "Matthieu Grard", "Ariane Herbulot", "Florent Lamiraux"], "brief": "MAGMA-GEN \u9762\u5411\u957f\u7a0b\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684\u5931\u8d25\u6b67\u4e49\u95ee\u9898\uff0c\u5229\u7528\u7279\u6743\u6559\u7ec3\u63d0\u51fa\u53ef\u80fd\u7684\u65e9\u671f\u51b3\u7b56\u9519\u8bef\u4e0e\u6062\u590d\u52a8\u4f5c\uff0c\u5e76\u901a\u8fc7\u4ece\u76f8\u540c\u72b6\u6001\u53cd\u4e8b\u5b9e\u91cd\u6267\u884c\u6765\u9a8c\u8bc1\u662f\u5426\u771f\u6b63\u6539\u5584\u8fdb\u5c55\u3002\u8be5\u65b9\u6cd5\u80fd\u4ece\u667a\u80fd\u4f53\u81ea\u8eab\u5931\u8d25\u5206\u5e03\u4e2d\u751f\u6210\u53ef\u9760\u7684\u6062\u590d\u76d1\u7763\u6570\u636e\uff0c\u65e0\u9700\u9010\u6b65\u4eba\u5de5\u793a\u8303\uff0c\u5e76\u5728\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u63d0\u5347\u6210\u529f\u7387\u548c\u6062\u590d\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20056", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u76d1\u7763\u5b66\u4e60", "\u53cd\u4e8b\u5b9e\u91cd\u6267\u884c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20056v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MAGMA-GEN: Validated Recovery Supervision from Ambiguous Failures via Counterfactual Re-Execution", "tldr": "MAGMA-GEN \u9762\u5411\u957f\u7a0b\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684\u5931\u8d25\u6b67\u4e49\u95ee\u9898\uff0c\u5229\u7528\u7279\u6743\u6559\u7ec3\u63d0\u51fa\u53ef\u80fd\u7684\u65e9\u671f\u51b3\u7b56\u9519\u8bef\u4e0e\u6062\u590d\u52a8\u4f5c\uff0c\u5e76\u901a\u8fc7\u4ece\u76f8\u540c\u72b6\u6001\u53cd\u4e8b\u5b9e\u91cd\u6267\u884c\u6765\u9a8c\u8bc1\u662f\u5426\u771f\u6b63\u6539\u5584\u8fdb\u5c55\u3002\u8be5\u65b9\u6cd5\u80fd\u4ece\u667a\u80fd\u4f53\u81ea\u8eab\u5931\u8d25\u5206\u5e03\u4e2d\u751f\u6210\u53ef\u9760\u7684\u6062\u590d\u76d1\u7763\u6570\u636e\uff0c\u65e0\u9700\u9010\u6b65\u4eba\u5de5\u793a\u8303\uff0c\u5e76\u5728\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u63d0\u5347\u6210\u529f\u7387\u548c\u6062\u590d\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Step distillation reduces the cost of video generation, but reusing a LoRA trained for a longer trajectory can alter its functional effect or degrade target quality. Static parameter compatibility offers one perspective on this problem; our observations show that similar measured geometry can coexist with different adapter behavior under a shortened denoising schedule. We propose DART, a training-free method that combines low-rank coordinate transport with target-schedule response calibration using forward evaluations and no source training videos. On a four-step Wan2.2 target, DART-F improves the joint quality score from 0.9029 to 0.9227 and changes macro functional retention from -0.4644 to +0.1349. Component analysis shows that calibration accounts for most of the quality improvement, while coordinate transport provides complementary gains when combined with calibration. Adapter-level results reveal positive functional effects for some adapters and strong attenuation with reduced negative functional effects for others. Evaluations on two additional targets show the same aggregate trend. These results motivate evaluating distilled-model LoRA reuse jointly through functional preservation and negative-transfer avoidance, without assuming recovery for every adapter.", "arxiv_id": "2609.20051", "arxiv_url": "https://arxiv.org/abs/2609.20051", "authors": ["Shihong Li", "Juntao Xu", "JinCao", "Maowen Tang", "Jun Huang", "Jintao Li"], "brief": "\u8bba\u6587\u63d0\u51fa DART\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LoRA \u590d\u7528\u65b9\u6cd5\uff0c\u7528\u4e8e\u5c06\u957f\u53bb\u566a\u8f68\u8ff9\u8bad\u7ec3\u7684 LoRA \u9002\u914d\u5230\u5c11\u6b65\u89c6\u9891\u6269\u6563\u6a21\u578b\u3002\u5b83\u7ed3\u5408\u4f4e\u79e9\u5750\u6807\u8fc1\u79fb\u4e0e\u76ee\u6807\u8c03\u5ea6\u54cd\u5e94\u6821\u51c6\uff0c\u5728\u56db\u6b65 Wan2.2 \u7b49\u76ee\u6807\u4e0a\u63d0\u5347\u751f\u6210\u8d28\u91cf\u5e76\u6539\u5584\u529f\u80fd\u4fdd\u7559\uff0c\u540c\u65f6\u51cf\u5c11\u8d1f\u8fc1\u79fb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20051", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "LoRA", "\u6a21\u578b\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20051v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DART: Distillation-Aware Reparameterization for Training-Free LoRA Reuse in Few-Step Video Diffusion Models", "tldr": "\u8bba\u6587\u63d0\u51fa DART\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LoRA \u590d\u7528\u65b9\u6cd5\uff0c\u7528\u4e8e\u5c06\u957f\u53bb\u566a\u8f68\u8ff9\u8bad\u7ec3\u7684 LoRA \u9002\u914d\u5230\u5c11\u6b65\u89c6\u9891\u6269\u6563\u6a21\u578b\u3002\u5b83\u7ed3\u5408\u4f4e\u79e9\u5750\u6807\u8fc1\u79fb\u4e0e\u76ee\u6807\u8c03\u5ea6\u54cd\u5e94\u6821\u51c6\uff0c\u5728\u56db\u6b65 Wan2.2 \u7b49\u76ee\u6807\u4e0a\u63d0\u5347\u751f\u6210\u8d28\u91cf\u5e76\u6539\u5584\u529f\u80fd\u4fdd\u7559\uff0c\u540c\u65f6\u51cf\u5c11\u8d1f\u8fc1\u79fb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Urban traffic forecasting often relies on information distributed across stakeholders who may be unable to share raw data due to privacy or commercial constraints, motivating federated spatial-temporal approaches. In such federated settings, each client observes traffic over a distinct sensor subgraph with its own spatial topology and temporal dynamics, leading to significant heterogeneity across clients. Existing federated spatial-temporal methods typically rely on model parameter aggregation and provide limited mechanisms for recovering spatial dependencies across client boundaries. This introduces two key limitations. Specifically, parameter aggregation across heterogeneous graph domains tends to dilute client-specific representations, while road network partitioning breaks the propagation of traffic dynamics across client boundaries. To address these challenges, we propose FedeRICo, a federated traffic forecasting framework that combines gradient-level collaboration with boundary-aware residual communication. FedeRICo employs a dual-branch forecasting architecture in which a globally guided branch captures transferable forecasting structure, while a private residual branch preserves client-specific corrections and incorporates boundary residual signals. The global branch is coordinated through gradient alignment across all clients, enabling collaborative optimisation without destructive parameter interference. To recover cross-client spatial dependencies, boundary messages are extracted through a trend-residual decomposition that suppresses periodic structure and communicates only transient spatial-temporal residual signals between physically adjacent clients. Experiments across four real-world traffic forecasting benchmarks demonstrate that FedeRICo consistently outperforms state-of-the-art federated spatial-temporal baselines while maintaining competitive training runtime.", "arxiv_id": "2609.20026", "arxiv_url": "https://arxiv.org/abs/2609.20026", "authors": ["Fermin Orozco", "Man Luo", "Johan Wahlstr\u00f6m"], "brief": "\u8bba\u6587\u63d0\u51fa FedeRICo\uff0c\u4e00\u4e2a\u9762\u5411\u4ea4\u901a\u6d41\u9884\u6d4b\u7684\u8054\u90a6\u65f6\u7a7a\u6846\u67b6\uff0c\u7528\u68af\u5ea6\u7ea7\u534f\u4f5c\u66ff\u4ee3\u76f4\u63a5\u53c2\u6570\u805a\u5408\uff0c\u5e76\u901a\u8fc7\u5168\u5c40\u5f15\u5bfc\u5206\u652f\u4e0e\u79c1\u6709\u6b8b\u5dee\u5206\u652f\u517c\u987e\u53ef\u8fc1\u79fb\u7ed3\u6784\u548c\u5ba2\u6237\u7aef\u4e2a\u6027\u5316\u3002\u5b83\u8fd8\u5229\u7528\u8fb9\u754c\u611f\u77e5\u7684\u6b8b\u5dee\u4fe1\u606f\u901a\u4fe1\uff0c\u6062\u590d\u8de8\u5ba2\u6237\u7aef\u9053\u8def\u8fb9\u754c\u7684\u7a7a\u95f4\u4f9d\u8d56\uff1b\u5728\u56db\u4e2a\u771f\u5b9e\u4ea4\u901a\u9884\u6d4b\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u8054\u90a6\u65f6\u7a7a\u65b9\u6cd5\uff0c\u4e14\u8bad\u7ec3\u5f00\u9500\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["cs.AI", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20026", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u4ea4\u901a\u9884\u6d4b", "\u65f6\u7a7a\u5efa\u6a21", "\u56fe\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20026v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FedeRICo: Federated Region-Influenced Coupling for Traffic Flow Prediction", "tldr": "\u8bba\u6587\u63d0\u51fa FedeRICo\uff0c\u4e00\u4e2a\u9762\u5411\u4ea4\u901a\u6d41\u9884\u6d4b\u7684\u8054\u90a6\u65f6\u7a7a\u6846\u67b6\uff0c\u7528\u68af\u5ea6\u7ea7\u534f\u4f5c\u66ff\u4ee3\u76f4\u63a5\u53c2\u6570\u805a\u5408\uff0c\u5e76\u901a\u8fc7\u5168\u5c40\u5f15\u5bfc\u5206\u652f\u4e0e\u79c1\u6709\u6b8b\u5dee\u5206\u652f\u517c\u987e\u53ef\u8fc1\u79fb\u7ed3\u6784\u548c\u5ba2\u6237\u7aef\u4e2a\u6027\u5316\u3002\u5b83\u8fd8\u5229\u7528\u8fb9\u754c\u611f\u77e5\u7684\u6b8b\u5dee\u4fe1\u606f\u901a\u4fe1\uff0c\u6062\u590d\u8de8\u5ba2\u6237\u7aef\u9053\u8def\u8fb9\u754c\u7684\u7a7a\u95f4\u4f9d\u8d56\uff1b\u5728\u56db\u4e2a\u771f\u5b9e\u4ea4\u901a\u9884\u6d4b\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u8054\u90a6\u65f6\u7a7a\u65b9\u6cd5\uff0c\u4e14\u8bad\u7ec3\u5f00\u9500\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The EU AI Act (Regulation 2024/1689) imposes technical obligations on high-risk AI providers, yet Articles 8-15 were drafted for predictive AI and leave seven technical gaps when applied to generative systems, spanning non-deterministic data governance, training-data provenance, continuous conformity, human oversight, open-ended robustness, emergent risk, and generative fairness. We deliver Governance-as-Code (GaC), a framework of 43 machine-checkable acceptance criteria across six compliance modules that run in a CI/CD pipeline and emit Article-indexed audit evidence, and we show the actual Rego policy code rather than merely describing it. Our central commitment is that the Act\u0027s open-textured standards (\"appropriate levels,\" \"possible biases\") become declared, auditable numbers: robustness thresholds are derived from the provider\u0027s documented baseline and a state-of-the-art floor, and framing bias is collapsed into eight measurable proxies tested by counterfactual demographic probing. We also correct who owes what, since under Article 25 and Chapter V a downstream deployer relies on the upstream provider\u0027s Article 53 training-data summary and documents only the layers it controls, so GaC verifies that summary rather than demanding per-sample documentation the deployer never had. We validate on two enterprise deployments, a high-risk advisory chatbot and a limited-risk content generator, benchmarking against a manual expert audit rather than documentation artifacts that were never designed to enforce compliance. GaC reproduces all of the manual audit\u0027s findings, including three penalty-triggering violations, while cutting audit labor by roughly 75%.", "arxiv_id": "2609.20016", "arxiv_url": "https://arxiv.org/abs/2609.20016", "authors": ["Rudrendu Kumar Paul", "Sourav Nandy"], "brief": "\u672c\u6587\u63d0\u51fa Governance-as-Code\uff08GaC\uff09\uff0c\u5c06\u6b27\u76df AI \u6cd5\u6848\u4e2d\u9488\u5bf9\u9ad8\u98ce\u9669 AI \u7684\u6280\u672f\u8981\u6c42\u8f6c\u5316\u4e3a\u53ef\u5728 CI/CD \u4e2d\u6267\u884c\u7684\u5408\u89c4\u68c0\u67e5\u6d41\u6c34\u7ebf\uff0c\u5305\u542b 6 \u4e2a\u6a21\u5757\u548c 43 \u6761\u673a\u5668\u53ef\u9a8c\u8bc1\u51c6\u5219\u3002\u5b83\u80fd\u751f\u6210\u6309\u6cd5\u6761\u7d22\u5f15\u7684\u5ba1\u8ba1\u8bc1\u636e\uff0c\u5728\u4e24\u4e2a\u4f01\u4e1a\u751f\u6210\u5f0f AI \u90e8\u7f72\u4e2d\u590d\u73b0\u4eba\u5de5\u5ba1\u8ba1\u53d1\u73b0\uff0c\u5e76\u5c06\u5ba1\u8ba1\u5de5\u4f5c\u91cf\u51cf\u5c11\u7ea6 75%\u3002", "categories": ["cs.CY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20016", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u5f0fAI", "\u5408\u89c4\u5ba1\u8ba1", "\u6cbb\u7406", "\u5b89\u5168\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20016v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Governance-as-Code: Translating EU AI Act Technical Requirements into Executable Compliance Pipelines for Generative AI Systems", "tldr": "\u672c\u6587\u63d0\u51fa Governance-as-Code\uff08GaC\uff09\uff0c\u5c06\u6b27\u76df AI \u6cd5\u6848\u4e2d\u9488\u5bf9\u9ad8\u98ce\u9669 AI \u7684\u6280\u672f\u8981\u6c42\u8f6c\u5316\u4e3a\u53ef\u5728 CI/CD \u4e2d\u6267\u884c\u7684\u5408\u89c4\u68c0\u67e5\u6d41\u6c34\u7ebf\uff0c\u5305\u542b 6 \u4e2a\u6a21\u5757\u548c 43 \u6761\u673a\u5668\u53ef\u9a8c\u8bc1\u51c6\u5219\u3002\u5b83\u80fd\u751f\u6210\u6309\u6cd5\u6761\u7d22\u5f15\u7684\u5ba1\u8ba1\u8bc1\u636e\uff0c\u5728\u4e24\u4e2a\u4f01\u4e1a\u751f\u6210\u5f0f AI \u90e8\u7f72\u4e2d\u590d\u73b0\u4eba\u5de5\u5ba1\u8ba1\u53d1\u73b0\uff0c\u5e76\u5c06\u5ba1\u8ba1\u5de5\u4f5c\u91cf\u51cf\u5c11\u7ea6 75%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Gromov--Wasserstein optimal transport (GW-OT) extends classical optimal transport by introducing structure-aware transport cost. This is particularly relevant for spatial transcriptomics, where dynamical reconstruction should preserve tissue structure in addition to matching expression patterns. While static formulations have been widely used for such structure-aware alignment, a general dynamic formulation for reconstructing continuous trajectories is still missing. We introduce Travelling Pair Dynamical Alignment and Trajectory Estimation (TP-DATE), a theoretical and computational framework to generalize GW-OT dynamically in a simulation-free manner. We formulate a broad class of static and dynamic Quadratic-form OT (QOT) through path actions and prove the static dynamic equivalence. We further develop travelling-pair flow matching, which allows interacting conditional paths and marginalizes their interactions into a single vector field. On synthetic and real spatial transcriptomics data, TP-DATE better preserves spatial structure and improves continuous 3D dynamics reconstruction.", "arxiv_id": "2609.20008", "arxiv_url": "https://arxiv.org/abs/2609.20008", "authors": ["Junda Ying", "Zhiwei Zeng", "Peijie Zhou", "Lei Zhang"], "brief": "\u63d0\u51fa TP-DATE\uff0c\u4e00\u4e2a\u5c06 Gromov-Wasserstein \u6700\u4f18\u4f20\u8f93\u52a8\u6001\u5316\u7684\u7406\u8bba\u4e0e\u8ba1\u7b97\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u65e0\u9700\u4eff\u771f\u7684\u60c5\u51b5\u4e0b\u91cd\u5efa\u8fde\u7eed\u8f68\u8ff9\u3002\u65b9\u6cd5\u901a\u8fc7\u8def\u5f84\u4f5c\u7528\u91cf\u7edf\u4e00\u9759\u6001\u4e0e\u52a8\u6001\u4e8c\u6b21\u578b\u6700\u4f18\u4f20\u8f93\uff0c\u5e76\u5728\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u6570\u636e\u4e0a\u66f4\u597d\u4fdd\u6301\u7ec4\u7ec7\u7a7a\u95f4\u7ed3\u6784\u3001\u63d0\u5347\u8fde\u7eed 3D \u52a8\u6001\u91cd\u5efa\u6548\u679c\u3002", "categories": ["cs.LG", "cs.AI", "math.OC", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20008", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6700\u4f18\u4f20\u8f93", "\u7a7a\u95f4\u8f6c\u5f55\u7ec4", "\u8f68\u8ff9\u91cd\u5efa", "\u6d41\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20008v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Dynamic Generalized Gromov-Wasserstein Optimal Transport", "tldr": "\u63d0\u51fa TP-DATE\uff0c\u4e00\u4e2a\u5c06 Gromov-Wasserstein \u6700\u4f18\u4f20\u8f93\u52a8\u6001\u5316\u7684\u7406\u8bba\u4e0e\u8ba1\u7b97\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u65e0\u9700\u4eff\u771f\u7684\u60c5\u51b5\u4e0b\u91cd\u5efa\u8fde\u7eed\u8f68\u8ff9\u3002\u65b9\u6cd5\u901a\u8fc7\u8def\u5f84\u4f5c\u7528\u91cf\u7edf\u4e00\u9759\u6001\u4e0e\u52a8\u6001\u4e8c\u6b21\u578b\u6700\u4f18\u4f20\u8f93\uff0c\u5e76\u5728\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u6570\u636e\u4e0a\u66f4\u597d\u4fdd\u6301\u7ec4\u7ec7\u7a7a\u95f4\u7ed3\u6784\u3001\u63d0\u5347\u8fde\u7eed 3D \u52a8\u6001\u91cd\u5efa\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "People increasingly turn to AI chatbots for news and explanations of world events. But do they receive the same political answers when they ask in different languages? Here we show that the language of a question can change how the same AI systems assess the war in Ukraine. We ask GPT, Claude and Gemini to evaluate twenty statements about the war in 112 languages, collecting 67,200 responses. The balance between Russia-leaning and Ukraine-leaning responses differs across languages. When we group responses by countries\u0027 official languages, they follow a pattern resembling worldwide political divisions: relatively more Russia-leaning answers correspond to more favourable public views of Russia, less support for Ukraine in United Nations votes, and less aid to Ukraine. The broad pattern recurs across all three models and remains when individual statement pairs are removed. Our findings suggest a possible route through which information warfare may shape the text used to train AI models, which may in turn spread geopolitical biases.", "arxiv_id": "2609.20005", "arxiv_url": "https://arxiv.org/abs/2609.20005", "authors": ["Maxim Chupilkin"], "brief": "\u672c\u6587\u6bd4\u8f83 GPT\u3001Claude \u548c Gemini \u5728 112 \u79cd\u8bed\u8a00\u4e2d\u5bf9\u4fc4\u4e4c\u6218\u4e89\u76f8\u5173\u9648\u8ff0\u7684\u56de\u7b54\uff0c\u53d1\u73b0\u540c\u4e00\u95ee\u9898\u6362\u7528\u4e0d\u540c\u8bed\u8a00\u4f1a\u5bfc\u81f4\u66f4\u504f\u4fc4\u7f57\u65af\u6216\u66f4\u504f\u4e4c\u514b\u5170\u7684\u8bc4\u4f30\u3002\u4e0d\u540c\u8bed\u8a00\u7684\u504f\u5411\u4e0e\u5bf9\u5e94\u56fd\u5bb6\u7684\u516c\u4f17\u4eb2\u4fc4\u7a0b\u5ea6\u3001\u8054\u5408\u56fd\u6295\u7968\u548c\u5bf9\u4e4c\u63f4\u52a9\u7b49\u73b0\u5b9e\u5730\u7f18\u653f\u6cbb\u5206\u88c2\u76f8\u547c\u5e94\uff0c\u63d0\u793a\u8bad\u7ec3\u6570\u636e\u53ef\u80fd\u643a\u5e26\u5e76\u653e\u5927\u4fe1\u606f\u6218\u9020\u6210\u7684\u5730\u7f18\u653f\u6cbb\u504f\u89c1\u3002", "categories": ["cs.AI", "cs.CL", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20005", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u653f\u6cbb\u504f\u89c1", "\u591a\u8bed\u8a00", "\u4fe1\u606f\u6218"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20005v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Geopolitical Divisions Across Languages in Large Language Models", "tldr": "\u672c\u6587\u6bd4\u8f83 GPT\u3001Claude \u548c Gemini \u5728 112 \u79cd\u8bed\u8a00\u4e2d\u5bf9\u4fc4\u4e4c\u6218\u4e89\u76f8\u5173\u9648\u8ff0\u7684\u56de\u7b54\uff0c\u53d1\u73b0\u540c\u4e00\u95ee\u9898\u6362\u7528\u4e0d\u540c\u8bed\u8a00\u4f1a\u5bfc\u81f4\u66f4\u504f\u4fc4\u7f57\u65af\u6216\u66f4\u504f\u4e4c\u514b\u5170\u7684\u8bc4\u4f30\u3002\u4e0d\u540c\u8bed\u8a00\u7684\u504f\u5411\u4e0e\u5bf9\u5e94\u56fd\u5bb6\u7684\u516c\u4f17\u4eb2\u4fc4\u7a0b\u5ea6\u3001\u8054\u5408\u56fd\u6295\u7968\u548c\u5bf9\u4e4c\u63f4\u52a9\u7b49\u73b0\u5b9e\u5730\u7f18\u653f\u6cbb\u5206\u88c2\u76f8\u547c\u5e94\uff0c\u63d0\u793a\u8bad\u7ec3\u6570\u636e\u53ef\u80fd\u643a\u5e26\u5e76\u653e\u5927\u4fe1\u606f\u6218\u9020\u6210\u7684\u5730\u7f18\u653f\u6cbb\u504f\u89c1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reward-based reinforcement learning for language models, exemplified by Group Relative Policy Optimization (GRPO), collapses an entire stochastic trajectory into a single scalar reward. This is clean and scalable, but it explores and allocates reward inefficiently: a trajectory may contain many causal decisions, recovery attempts, and environment-randomness events, yet every token or action inherits one trajectory-level advantage. We study tree-based rollout construction as a compute-allocation problem for policy-gradient estimation. Our central claim is that branches should be placed not where the policy is merely uncertain, but where an additional branch most reduces uncertainty about the policy gradient per unit of compute. From a law-of-total-variance decomposition of the local policy-gradient random variable, we derive two allocation laws: new branches reduce decision uncertainty, while repeated suffix rollouts reduce continuation uncertainty. The resulting EPIG-Tree score allocates branches using the already computed rollouts. It estimates occupancy- and score-weighted value uncertainty, along with a suffix law $n_e \\propto w_e \\|\\nabla_\u03b8\\log \u03c0(a_e|h_e)\\| \u03c3_e / \\sqrt{c_e}$. Empirically, EPIG reduces gradient MSE in cloned-state control, winning in all nine dense continuous-control environments of a 13-environment sweep and recovering the reference gradient direction near-perfectly, and it improves frozen-LLM gradient calibration relative to entropy branching. In online single-turn math, tree-local credit beats flat GRPO, while branch placement is secondary to token-level credit assignment. In online multi-turn Wordle, EPIG attains the highest final win rate (0.850), overtaking flat GRPO, which saturates early at 0.790, and entropy branching as training proceeds, confirming that the gradient-estimation advantage transfers to a stateful, large-action setting.", "arxiv_id": "2609.20004", "arxiv_url": "https://arxiv.org/abs/2609.20004", "authors": ["Nikita Khomich", "Leopold Hermansson", "Ido Hakimi"], "brief": "\u672c\u6587\u5c06\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u6811\u72b6 rollout \u5206\u652f\u4f4d\u7f6e\u89c6\u4e3a\u7b56\u7565\u68af\u5ea6\u4f30\u8ba1\u7684\u7b97\u529b\u5206\u914d\u95ee\u9898\uff0c\u63d0\u51fa EPIG-Tree\uff1a\u4f18\u5148\u5728\u6700\u80fd\u964d\u4f4e\u5355\u4f4d\u7b97\u529b\u4e0b\u68af\u5ea6\u4e0d\u786e\u5b9a\u6027\u7684\u8282\u70b9\u5206\u652f\uff0c\u800c\u975e\u4ec5\u6309\u7b56\u7565\u71b5\u5206\u652f\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u8fde\u7eed\u63a7\u5236\u3001\u51bb\u7ed3\u5927\u6a21\u578b\u68af\u5ea6\u6821\u51c6\u3001\u6570\u5b66\u9898\u4e0e\u591a\u8f6e Wordle \u4e2d\u964d\u4f4e\u68af\u5ea6\u8bef\u5dee\u5e76\u63d0\u5347\u8bad\u7ec3\u6548\u679c\uff0cWordle \u6700\u7ec8\u80dc\u7387\u8fbe\u5230 0.850\uff0c\u4f18\u4e8e flat GRPO \u548c\u71b5\u5206\u652f\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20004", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u8bed\u8a00\u6a21\u578b", "\u7b56\u7565\u68af\u5ea6", "\u7b97\u529b\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20004v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EPIG-Tree: Compute-Optimal Branching for Gradient-Efficient Reinforcement Learning", "tldr": "\u672c\u6587\u5c06\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u6811\u72b6 rollout \u5206\u652f\u4f4d\u7f6e\u89c6\u4e3a\u7b56\u7565\u68af\u5ea6\u4f30\u8ba1\u7684\u7b97\u529b\u5206\u914d\u95ee\u9898\uff0c\u63d0\u51fa EPIG-Tree\uff1a\u4f18\u5148\u5728\u6700\u80fd\u964d\u4f4e\u5355\u4f4d\u7b97\u529b\u4e0b\u68af\u5ea6\u4e0d\u786e\u5b9a\u6027\u7684\u8282\u70b9\u5206\u652f\uff0c\u800c\u975e\u4ec5\u6309\u7b56\u7565\u71b5\u5206\u652f\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u8fde\u7eed\u63a7\u5236\u3001\u51bb\u7ed3\u5927\u6a21\u578b\u68af\u5ea6\u6821\u51c6\u3001\u6570\u5b66\u9898\u4e0e\u591a\u8f6e Wordle \u4e2d\u964d\u4f4e\u68af\u5ea6\u8bef\u5dee\u5e76\u63d0\u5347\u8bad\u7ec3\u6548\u679c\uff0cWordle \u6700\u7ec8\u80dc\u7387\u8fbe\u5230 0.850\uff0c\u4f18\u4e8e flat GRPO \u548c\u71b5\u5206\u652f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated video interview assessment integrates verbal content, acoustic delivery, and visual behavior, yet numerical predictions alone provide limited inspectable support. We present E-AVI, an evidence-grounded framework that extracts timestamped multimodal evidence and integrates dimension-conditioned evidence attention with source-level embeddings for scoring. A shared evidence pool further supports natural-language feedback and follow-up question answering. On RecruitView and a private hospitality dataset, E-AVI consistently outperforms fine-tuned multimodal baselines in rank correlation. Ablation, evidence-deletion, bootstrap, human-audit, and QA analyses characterize the predictive contribution, grounding, and practical utility of the evidence pathway. Together, these results demonstrate that our proposed E-AVI framework improves predictive performance while providing inspectable support for assessment, feedback, and interactive analysis.", "arxiv_id": "2609.20001", "arxiv_url": "https://arxiv.org/abs/2609.20001", "authors": ["Haoshen Wang", "Dongbo Che", "Zeyi Xie", "Yuanjie Du", "Shicheng Hua", "Xingyu Wang"], "brief": "\u8bba\u6587\u63d0\u51fa E-AVI\uff0c\u4e00\u4e2a\u9762\u5411\u81ea\u52a8\u89c6\u9891\u9762\u8bd5\u8bc4\u4f30\u7684\u8bc1\u636e\u9a71\u52a8\u591a\u6a21\u6001\u6846\u67b6\uff0c\u53ef\u63d0\u53d6\u5e26\u65f6\u95f4\u6233\u7684\u8bed\u8a00\u3001\u58f0\u5b66\u548c\u89c6\u89c9\u8bc1\u636e\uff0c\u5e76\u7528\u8bc1\u636e\u6ce8\u610f\u529b\u8fdb\u884c\u8bc4\u5206\u3002\u5b83\u5728\u516c\u5f00\u4e0e\u79c1\u6709\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u5fae\u8c03\u591a\u6a21\u6001\u57fa\u7ebf\uff0c\u540c\u65f6\u652f\u6301\u53ef\u68c0\u67e5\u7684\u81ea\u7136\u8bed\u8a00\u53cd\u9988\u548c\u8ffd\u95ee\u95ee\u7b54\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20001", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u81ea\u52a8\u8bc4\u4f30", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20001v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "E-AVI: Evidence-Grounded Multimodal Assessment for Automated Video Interviews", "tldr": "\u8bba\u6587\u63d0\u51fa E-AVI\uff0c\u4e00\u4e2a\u9762\u5411\u81ea\u52a8\u89c6\u9891\u9762\u8bd5\u8bc4\u4f30\u7684\u8bc1\u636e\u9a71\u52a8\u591a\u6a21\u6001\u6846\u67b6\uff0c\u53ef\u63d0\u53d6\u5e26\u65f6\u95f4\u6233\u7684\u8bed\u8a00\u3001\u58f0\u5b66\u548c\u89c6\u89c9\u8bc1\u636e\uff0c\u5e76\u7528\u8bc1\u636e\u6ce8\u610f\u529b\u8fdb\u884c\u8bc4\u5206\u3002\u5b83\u5728\u516c\u5f00\u4e0e\u79c1\u6709\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u5fae\u8c03\u591a\u6a21\u6001\u57fa\u7ebf\uff0c\u540c\u65f6\u652f\u6301\u53ef\u68c0\u67e5\u7684\u81ea\u7136\u8bed\u8a00\u53cd\u9988\u548c\u8ffd\u95ee\u95ee\u7b54\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the widespread use of online navigation and ride-hailing services, achieving optimal route planning for diverse user preferences has recently attracted increasing attention. Classic graph algorithms for pathfinding use heuristic cost functions to define edge weight, thus providing no optimality guarantee of route quality. Prior data-driven approaches equating ground truth of the optimal route with user trajectory, which is however moderately influenced by the navigation service, suffers from the feedback loop problem. To address these issues, we propose a deep architecture that is able to jointly optimize cost functions and route-ranking model towards any route preference. First, we run a multi-objective Dijkstra algorithm offline to collect the set of Pareto optimal routes, deeming it as the complete candidate set. Exploiting the property of such a set, we design a neural network structure that emulates shortest-path search and route ranking in an end-to-end differentiable manner. Second, we define route preference as a task of constrained optimization of route attributes, and propose a novel loss function that optimizes a single-objective variable, with other variables strictly under constraints. We conduct extensive experiments on real-world datasets. The results show that our architecture significantly outperforms state-of-the-art methods in route quality and customizability.", "arxiv_id": "2609.19996", "arxiv_url": "https://arxiv.org/abs/2609.19996", "authors": ["Rui Zhao", "Chao Chen", "Longfei Xu", "Chenguang Ji", "Hengbin Cui", "Kaikui Liu", "Xiaolong Li"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u5fae\u5206\u7684\u6df1\u5ea6\u8def\u7ebf\u89c4\u5212\u67b6\u6784\uff0c\u5c06\u8fb9\u6210\u672c\u51fd\u6570\u5b66\u4e60\u4e0e\u8def\u7ebf\u6392\u5e8f\u8054\u5408\u4f18\u5316\uff0c\u4ee5\u9002\u914d\u4e0d\u540c\u7528\u6237\u504f\u597d\u3002\u65b9\u6cd5\u5148\u7528\u591a\u76ee\u6807 Dijkstra \u79bb\u7ebf\u751f\u6210 Pareto \u6700\u4f18\u5019\u9009\u8def\u7ebf\uff0c\u518d\u7528\u795e\u7ecf\u7f51\u7edc\u6a21\u62df\u6700\u77ed\u8def\u641c\u7d22\u4e0e\u6392\u5e8f\uff0c\u5e76\u901a\u8fc7\u5e26\u7ea6\u675f\u7684\u504f\u597d\u635f\u5931\u4f18\u5316\u8def\u7ebf\u5c5e\u6027\uff1b\u5728\u771f\u5b9e\u6570\u636e\u4e0a\u663e\u8457\u63d0\u5347\u8def\u7ebf\u8d28\u91cf\u4e0e\u53ef\u5b9a\u5236\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19996", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8def\u7ebf\u89c4\u5212", "\u53ef\u5fae\u4f18\u5316", "\u56fe\u7b97\u6cd5", "\u4e2a\u6027\u5316\u63a8\u8350"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19996v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Customizable and Jointly Optimized Route Planning: A Deep Architecture Enabling Differentiable Shortest-Path Search", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u5fae\u5206\u7684\u6df1\u5ea6\u8def\u7ebf\u89c4\u5212\u67b6\u6784\uff0c\u5c06\u8fb9\u6210\u672c\u51fd\u6570\u5b66\u4e60\u4e0e\u8def\u7ebf\u6392\u5e8f\u8054\u5408\u4f18\u5316\uff0c\u4ee5\u9002\u914d\u4e0d\u540c\u7528\u6237\u504f\u597d\u3002\u65b9\u6cd5\u5148\u7528\u591a\u76ee\u6807 Dijkstra \u79bb\u7ebf\u751f\u6210 Pareto \u6700\u4f18\u5019\u9009\u8def\u7ebf\uff0c\u518d\u7528\u795e\u7ecf\u7f51\u7edc\u6a21\u62df\u6700\u77ed\u8def\u641c\u7d22\u4e0e\u6392\u5e8f\uff0c\u5e76\u901a\u8fc7\u5e26\u7ea6\u675f\u7684\u504f\u597d\u635f\u5931\u4f18\u5316\u8def\u7ebf\u5c5e\u6027\uff1b\u5728\u771f\u5b9e\u6570\u636e\u4e0a\u663e\u8457\u63d0\u5347\u8def\u7ebf\u8d28\u91cf\u4e0e\u53ef\u5b9a\u5236\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fine-tuning foundation models on new tasks inevitably suffer from catastrophic forgetting. While existing works attempt to mitigate this on the basis of parameter-efficient fine-tuning methods, they adopted an overly restrictive Subspace Orthogonality condition. In this paper, we introduce a purely post-hoc and tuning-agnostic weight rectification framework that achieves Parameter Space Orthogonality, which is the necessary and sufficient condition for preserving historical performance to the first order. By projecting parameter updates into the JAcobian NUll Space (JANUS), our method significantly recovers compromised historical knowledge without interfering with the underlying fine-tuning process. To overcome the local validity of the Jacobian approximation, we further propose a Multi-step Adaptive Rectification mechanism that utilizes the JANUS shift to dynamically verify the valid trust region and adjust step sizes. Coupled with our proposed ghost projection, ghost orientation comparison, and sequence-level singular value decomposition compression techniques, JANUS also achieves great temporal and spatial efficiency. Experiments demonstrate that JANUS seamlessly integrates with various fine-tuning methods, significantly mitigating the stability-plasticity dilemma by recovering historical knowledge while preserving downstream task adaptation.", "arxiv_id": "2609.19985", "arxiv_url": "https://arxiv.org/abs/2609.19985", "authors": ["Zhilong Zheng", "Letian Tao", "Yang Guan", "Yujie Yang", "Wei Xiong", "Kehua Sheng", "Bo Zhang", "Jingliang Duan", "Keqiang Li", "Shengbo Eben Li"], "brief": "\u672c\u6587\u63d0\u51fa JANUS\uff0c\u4e00\u79cd\u7eaf\u540e\u5904\u7406\u4e14\u4e0e\u5fae\u8c03\u65b9\u6cd5\u65e0\u5173\u7684\u6743\u91cd\u6821\u6b63\u6846\u67b6\uff0c\u901a\u8fc7\u5c06\u53c2\u6570\u66f4\u65b0\u6295\u5f71\u5230\u96c5\u53ef\u6bd4\u96f6\u7a7a\u95f4\u6765\u6ee1\u8db3\u53c2\u6570\u7a7a\u95f4\u6b63\u4ea4\u6027\uff0c\u4ece\u800c\u7f13\u89e3\u57fa\u7840\u6a21\u578b\u5fae\u8c03\u4e2d\u7684\u707e\u96be\u6027\u9057\u5fd8\u3002\u65b9\u6cd5\u7ed3\u5408\u591a\u6b65\u81ea\u9002\u5e94\u6821\u6b63\u4e0e\u538b\u7f29\u6280\u5de7\uff0c\u5728\u4fdd\u6301\u65b0\u4efb\u52a1\u9002\u5e94\u80fd\u529b\u7684\u540c\u65f6\u663e\u8457\u6062\u590d\u5386\u53f2\u77e5\u8bc6\uff0c\u5e76\u53ef\u65e0\u7f1d\u63a5\u5165\u591a\u79cd\u5fae\u8c03\u6d41\u7a0b\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19985", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u707e\u96be\u6027\u9057\u5fd8", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u57fa\u7840\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19985v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Past, Future, All at Once: Mitigating Stability-Plasticity Dilemma via Post-hoc JANUS Rectification", "tldr": "\u672c\u6587\u63d0\u51fa JANUS\uff0c\u4e00\u79cd\u7eaf\u540e\u5904\u7406\u4e14\u4e0e\u5fae\u8c03\u65b9\u6cd5\u65e0\u5173\u7684\u6743\u91cd\u6821\u6b63\u6846\u67b6\uff0c\u901a\u8fc7\u5c06\u53c2\u6570\u66f4\u65b0\u6295\u5f71\u5230\u96c5\u53ef\u6bd4\u96f6\u7a7a\u95f4\u6765\u6ee1\u8db3\u53c2\u6570\u7a7a\u95f4\u6b63\u4ea4\u6027\uff0c\u4ece\u800c\u7f13\u89e3\u57fa\u7840\u6a21\u578b\u5fae\u8c03\u4e2d\u7684\u707e\u96be\u6027\u9057\u5fd8\u3002\u65b9\u6cd5\u7ed3\u5408\u591a\u6b65\u81ea\u9002\u5e94\u6821\u6b63\u4e0e\u538b\u7f29\u6280\u5de7\uff0c\u5728\u4fdd\u6301\u65b0\u4efb\u52a1\u9002\u5e94\u80fd\u529b\u7684\u540c\u65f6\u663e\u8457\u6062\u590d\u5386\u53f2\u77e5\u8bc6\uff0c\u5e76\u53ef\u65e0\u7f1d\u63a5\u5165\u591a\u79cd\u5fae\u8c03\u6d41\u7a0b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon robot manipulation requires not only stable local visuomotor control, but also continuous target tracking and reliable task progress assessment throughout execution. This challenge becomes particularly critical when multiple objects share identical appearances and must be manipulated in a prescribed order. In such scenarios, relying solely on a limited-horizon manipulation policy is often insufficient to determine which instance should be operated on and when the task should transition to the next stage. To address this challenge, we propose MaskHarness-WAM, an instance-grounded harness for long-horizon manipulation. The proposed system connects high-level task planning with low-level manipulation policies through target masks, while leveraging visual feedback for subtask scheduling and continuous execution. Since each subtask corresponds to a different target instance, the low-level policy requires a newly established initial target mask under the updated scene at each subtask transition. The harness continuously re-observes the environment, generates, and verifies the target mask at subtask boundaries, thereby updating the instance-level spatial condition provided to the low-level policy. Furthermore, the system advances the manipulation process by switching target instances according to the verified completion status of each subtask. Experiments on a real robot platform demonstrate that MaskHarness-WAM substantially outperforms limited-horizon policies on sequential multi-object manipulation, showing its effectiveness in extending local manipulation skills to reliable long-horizon execution.", "arxiv_id": "2609.19974", "arxiv_url": "https://arxiv.org/abs/2609.19974", "authors": ["Zitai Huang", "Taiyi Su", "Jian Zhu", "Jianjun Zhang", "Chong Ma", "Tianbin Liu", "Weiyi Lu", "Yi Xu", "Hanli Wang"], "brief": "\u8bba\u6587\u63d0\u51fa MaskHarness-WAM\uff0c\u7528\u5b9e\u4f8b\u7ea7\u76ee\u6807\u63a9\u7801\u628a\u9ad8\u5c42\u4efb\u52a1\u89c4\u5212\u4e0e\u4f4e\u5c42\u89c6\u89c9\u8fd0\u52a8\u63a7\u5236\u8fde\u63a5\u8d77\u6765\uff0c\u9762\u5411\u957f\u65f6\u7a0b\u3001\u591a\u7269\u4f53\u987a\u5e8f\u64cd\u4f5c\u3002\u7cfb\u7edf\u5728\u5b50\u4efb\u52a1\u5207\u6362\u65f6\u91cd\u65b0\u89c2\u6d4b\u3001\u751f\u6210\u5e76\u9a8c\u8bc1\u76ee\u6807\u63a9\u7801\uff0c\u6839\u636e\u5b8c\u6210\u72b6\u6001\u5207\u6362\u76ee\u6807\u5b9e\u4f8b\uff1b\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u663e\u793a\u5176\u663e\u8457\u4f18\u4e8e\u6709\u9650\u65f6\u57df\u64cd\u4f5c\u7b56\u7565\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19974", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u957f\u65f6\u7a0b\u4efb\u52a1", "\u89c6\u89c9\u63a7\u5236", "\u76ee\u6807\u8ddf\u8e2a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19974v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MaskHarness-WAM: Instance-Grounded Harnessing for Long-Horizon Robot Manipulation", "tldr": "\u8bba\u6587\u63d0\u51fa MaskHarness-WAM\uff0c\u7528\u5b9e\u4f8b\u7ea7\u76ee\u6807\u63a9\u7801\u628a\u9ad8\u5c42\u4efb\u52a1\u89c4\u5212\u4e0e\u4f4e\u5c42\u89c6\u89c9\u8fd0\u52a8\u63a7\u5236\u8fde\u63a5\u8d77\u6765\uff0c\u9762\u5411\u957f\u65f6\u7a0b\u3001\u591a\u7269\u4f53\u987a\u5e8f\u64cd\u4f5c\u3002\u7cfb\u7edf\u5728\u5b50\u4efb\u52a1\u5207\u6362\u65f6\u91cd\u65b0\u89c2\u6d4b\u3001\u751f\u6210\u5e76\u9a8c\u8bc1\u76ee\u6807\u63a9\u7801\uff0c\u6839\u636e\u5b8c\u6210\u72b6\u6001\u5207\u6362\u76ee\u6807\u5b9e\u4f8b\uff1b\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u663e\u793a\u5176\u663e\u8457\u4f18\u4e8e\u6709\u9650\u65f6\u57df\u64cd\u4f5c\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Federated Learning (FL) is experiencing a substantial research interest, with many frameworks being developed to allow practitioners to build federations easily and quickly. Most of these efforts do not consider two main aspects that are key to Machine Learning (ML) software: customizability and performance. This research addresses these issues by implementing an open-source FL framework named FastFederatedLearning (FFL). FFL is implemented in C/C++, focusing on code performance, and allows the user to specify any communication graph between clients and servers involved in the federation, ensuring customizability. FFL is tested against Intel OpenFL, achieving consistent speedups over different computational platforms (x86-64, ARM-v8, RISC-V), ranging from 2.5x and 3.69x. We aim to wrap FFL with a Python interface to ease its use and implement a middleware for different communication backends to be used. We aim to build dynamic federations in which relations between clients and servers are not static, giving life to an environment where federations can be seen as long-time evolving structures and exploited as services.", "arxiv_id": "2609.19972", "arxiv_url": "https://arxiv.org/abs/2609.19972", "authors": ["Gianluca Mittone", "Robert Birke", "Marco Aldinucci"], "brief": "\u672c\u6587\u63d0\u51fa\u5f00\u6e90\u8054\u90a6\u5b66\u4e60\u6846\u67b6 FastFederatedLearning\uff08FFL\uff09\uff0c\u7528 C/C++ \u5b9e\u73b0\u4ee5\u63d0\u5347\u6027\u80fd\uff0c\u5e76\u5141\u8bb8\u7528\u6237\u81ea\u5b9a\u4e49\u5ba2\u6237\u7aef\u4e0e\u670d\u52a1\u5668\u4e4b\u95f4\u7684\u4efb\u610f\u901a\u4fe1\u62d3\u6251\u3002\u76f8\u6bd4 Intel OpenFL\uff0cFFL \u5728 x86-64\u3001ARM-v8\u3001RISC-V \u7b49\u5e73\u53f0\u4e0a\u83b7\u5f97\u7ea6 2.5 \u5230 3.69 \u500d\u52a0\u901f\uff0c\u5e76\u8ba1\u5212\u52a0\u5165 Python \u63a5\u53e3\u4e0e\u52a8\u6001\u8054\u90a6\u652f\u6301\u3002", "categories": ["cs.PF", "cs.AI", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19972", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u5206\u5e03\u5f0f\u7cfb\u7edf", "\u9ad8\u6027\u80fd\u8ba1\u7b97", "\u901a\u4fe1\u62d3\u6251"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19972v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Efficiently Distributed Federated Learning", "tldr": "\u672c\u6587\u63d0\u51fa\u5f00\u6e90\u8054\u90a6\u5b66\u4e60\u6846\u67b6 FastFederatedLearning\uff08FFL\uff09\uff0c\u7528 C/C++ \u5b9e\u73b0\u4ee5\u63d0\u5347\u6027\u80fd\uff0c\u5e76\u5141\u8bb8\u7528\u6237\u81ea\u5b9a\u4e49\u5ba2\u6237\u7aef\u4e0e\u670d\u52a1\u5668\u4e4b\u95f4\u7684\u4efb\u610f\u901a\u4fe1\u62d3\u6251\u3002\u76f8\u6bd4 Intel OpenFL\uff0cFFL \u5728 x86-64\u3001ARM-v8\u3001RISC-V \u7b49\u5e73\u53f0\u4e0a\u83b7\u5f97\u7ea6 2.5 \u5230 3.69 \u500d\u52a0\u901f\uff0c\u5e76\u8ba1\u5212\u52a0\u5165 Python \u63a5\u53e3\u4e0e\u52a8\u6001\u8054\u90a6\u652f\u6301\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-based AI agents process user requests through iterative reasoning and tool execution, often involving the invocation of remote LLM APIs with local tool containers. This execution model can make the optimization of agent serving difficult because latency, local resource demand, and container bottlenecks inter-mix across requests. However, the current agent ecosystem runs without much consideration of resource dynamics, which results in significant waste of the precious resources. This paper analyzes the resource inter-mix of AI agents for three representative tasks: retrieval-augmented question answering, web search, and software coding. To this end, we characterize the latency with respect to the resource dynamics of processing multiple requests and tasks concurrently. Our measurements show that agents have a wide range of behaviors depending on tasks, so that even the same tool can differ substantially in resource dynamics. We also find that running multiple requests concurrently exposes task-dependent bottlenecks in resource dynamics such as CPU, disk I/O, and memory. Furthermore, we uncover that faster LLM responses or more CPU cores do not always accelerate agents. Based on these observations, we demonstrate new optimization opportunities that exploit the resource dynamics of tasks: CPU-aware tool admission and task-aware CPU allocation. Our results show that the latency of CPU-sensitive agent tasks improves $\\sim$5.4$\\times$, and the average latency across multiple tasks is reduced $\\sim$32% compared to native agents.", "arxiv_id": "2609.19947", "arxiv_url": "https://arxiv.org/abs/2609.19947", "authors": ["Wonmi Choi", "Minuk Park", "Zhixiong Niu", "Yongqiang Xiong", "Chuck Yoo", "Gyeongsik Yang"], "brief": "\u672c\u6587\u7cfb\u7edf\u5206\u6790\u4e86\u57fa\u4e8e\u5927\u6a21\u578b\u7684 AI \u667a\u80fd\u4f53\u5728\u68c0\u7d22\u95ee\u7b54\u3001\u7f51\u9875\u641c\u7d22\u548c\u4ee3\u7801\u4efb\u52a1\u4e2d\u7684\u5ef6\u8fdf\u4e0e\u672c\u5730\u8d44\u6e90\u52a8\u6001\uff0c\u53d1\u73b0\u4e0d\u540c\u4efb\u52a1\u751a\u81f3\u76f8\u540c\u5de5\u5177\u7684 CPU\u3001\u78c1\u76d8 I/O\u3001\u5185\u5b58\u74f6\u9888\u5dee\u5f02\u5f88\u5927\u3002\u4f5c\u8005\u63d0\u51fa CPU \u611f\u77e5\u7684\u5de5\u5177\u51c6\u5165\u548c\u4efb\u52a1\u611f\u77e5\u7684 CPU \u5206\u914d\uff0c\u53ef\u4f7f CPU \u654f\u611f\u4efb\u52a1\u5ef6\u8fdf\u63d0\u5347\u7ea6 5.4 \u500d\uff0c\u591a\u4efb\u52a1\u5e73\u5747\u5ef6\u8fdf\u964d\u4f4e\u7ea6 32%\u3002", "categories": ["cs.AI", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19947", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7cfb\u7edf\u4f18\u5316", "\u8d44\u6e90\u8c03\u5ea6", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19947v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Not All AI Agents Are Equal: Characterizing Resource and Performance Dynamics", "tldr": "\u672c\u6587\u7cfb\u7edf\u5206\u6790\u4e86\u57fa\u4e8e\u5927\u6a21\u578b\u7684 AI \u667a\u80fd\u4f53\u5728\u68c0\u7d22\u95ee\u7b54\u3001\u7f51\u9875\u641c\u7d22\u548c\u4ee3\u7801\u4efb\u52a1\u4e2d\u7684\u5ef6\u8fdf\u4e0e\u672c\u5730\u8d44\u6e90\u52a8\u6001\uff0c\u53d1\u73b0\u4e0d\u540c\u4efb\u52a1\u751a\u81f3\u76f8\u540c\u5de5\u5177\u7684 CPU\u3001\u78c1\u76d8 I/O\u3001\u5185\u5b58\u74f6\u9888\u5dee\u5f02\u5f88\u5927\u3002\u4f5c\u8005\u63d0\u51fa CPU \u611f\u77e5\u7684\u5de5\u5177\u51c6\u5165\u548c\u4efb\u52a1\u611f\u77e5\u7684 CPU \u5206\u914d\uff0c\u53ef\u4f7f CPU \u654f\u611f\u4efb\u52a1\u5ef6\u8fdf\u63d0\u5347\u7ea6 5.4 \u500d\uff0c\u591a\u4efb\u52a1\u5e73\u5747\u5ef6\u8fdf\u964d\u4f4e\u7ea6 32%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) have been applied to causal discovery, but candidate-graph generation rarely treats premature omission of potentially relevant causal relations as an explicit design objective. We propose MaSCoD, a multi-agent framework that organizes candidate third variables and local structural patterns before direct-edge judgment. We evaluate MaSCoD on Auto-MPG, DWD, and Sachs using GPT-5.4 as the primary backbone and GPT-4o for replication. MaSCoD exhibits a dataset- and backbone-dependent retention-selectivity profile rather than uniform superiority. Across all six dataset-backbone settings, Full, which supplies structural hypotheses before direct-edge judgment, achieved higher mean Recall and F1 than No Phase 1, which instead constructs them within the judgment procedure, while also increasing false-positive rates. Additional reference-edge retention over all evaluated baselines was observed on DWD with GPT-5.4 and on Sachs with GPT-4o, rather than uniformly across settings. Partial ablations showed that supplying both information components did not always outperform supplying only one. For GPT-5.4, stage-wise analysis showed that the Full-No Phase 1 retention gap was already present after direct-edge judgment, while reconciliation introduced additional reference-edge loss for Full on Sachs. These findings support structural pre-organization as an explicit design and evaluation target for omission control and motivate evaluating context construction jointly with its utilization in judgment.", "arxiv_id": "2609.19944", "arxiv_url": "https://arxiv.org/abs/2609.19944", "authors": ["Yudai Nakada", "Yuichiro Nishiura", "Jin Michael Splichal"], "brief": "\u8bba\u6587\u63d0\u51fa MaSCoD\uff0c\u4e00\u4e2a\u7528\u4e8e\u56e0\u679c\u53d1\u73b0\u5019\u9009\u56e0\u679c\u56fe\u751f\u6210\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5728\u76f4\u63a5\u5224\u65ad\u8fb9\u4e4b\u524d\u5148\u7ec4\u7ec7\u5019\u9009\u7b2c\u4e09\u53d8\u91cf\u4e0e\u5c40\u90e8\u7ed3\u6784\u6a21\u5f0f\uff0c\u4ee5\u51cf\u5c11\u8fc7\u65e9\u9057\u6f0f\u6f5c\u5728\u56e0\u679c\u5173\u7cfb\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u53ec\u56de\u7387\u548c F1 \u901a\u5e38\u9ad8\u4e8e\u4e0d\u505a\u7ed3\u6784\u9884\u7ec4\u7ec7\u7684\u7248\u672c\uff0c\u4f46\u4f1a\u589e\u52a0\u5047\u9633\u6027\uff0c\u4e14\u4f18\u52bf\u4f9d\u8d56\u6570\u636e\u96c6\u548c\u6a21\u578b\u9aa8\u5e72\uff0c\u5e76\u975e\u5168\u573a\u666f\u7a33\u5b9a\u9886\u5148\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19944", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u56e0\u679c\u53d1\u73b0", "\u5927\u8bed\u8a00\u6a21\u578b", "\u56fe\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19944v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MaSCoD: A Multi-Agent Framework for Structural-Context-Guided Candidate Causal Graph Generation", "tldr": "\u8bba\u6587\u63d0\u51fa MaSCoD\uff0c\u4e00\u4e2a\u7528\u4e8e\u56e0\u679c\u53d1\u73b0\u5019\u9009\u56e0\u679c\u56fe\u751f\u6210\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5728\u76f4\u63a5\u5224\u65ad\u8fb9\u4e4b\u524d\u5148\u7ec4\u7ec7\u5019\u9009\u7b2c\u4e09\u53d8\u91cf\u4e0e\u5c40\u90e8\u7ed3\u6784\u6a21\u5f0f\uff0c\u4ee5\u51cf\u5c11\u8fc7\u65e9\u9057\u6f0f\u6f5c\u5728\u56e0\u679c\u5173\u7cfb\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u53ec\u56de\u7387\u548c F1 \u901a\u5e38\u9ad8\u4e8e\u4e0d\u505a\u7ed3\u6784\u9884\u7ec4\u7ec7\u7684\u7248\u672c\uff0c\u4f46\u4f1a\u589e\u52a0\u5047\u9633\u6027\uff0c\u4e14\u4f18\u52bf\u4f9d\u8d56\u6570\u636e\u96c6\u548c\u6a21\u578b\u9aa8\u5e72\uff0c\u5e76\u975e\u5168\u573a\u666f\u7a33\u5b9a\u9886\u5148\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
