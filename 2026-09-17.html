label-equivariant repair, but it preserves only 2/8 original late-reference answers: eliminating a naming shortcut does not solve unknown future relevance. These results support a scoped evaluation methodology and reproducible failure analysis, not general superiority of the repaired algorithm. Paid pilot evidence, retrospective diagnostics, and new offline tests are reported separately; no independent held-out or natural-task validation is claimed.", "arxiv_id": "2609.20045", "arxiv_url": "https://arxiv.org/abs/2609.20045", "authors": ["Guangzhe Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6210\u5bf9\u5386\u53f2\u5ba1\u8ba1\u201d\u65b9\u6cd5\uff0c\u68c0\u9a8c\u8bb0\u5fc6\u538b\u7f29\u662f\u5426\u4e0d\u4ec5\u80fd\u56de\u7b54\u5f53\u524d\u95ee\u9898\uff0c\u8fd8\u4fdd\u7559\u672a\u6765\u66f4\u65b0\u6240\u9700\u7684\u5173\u952e\u533a\u5206\u4fe1\u606f\u3002\u4f5c\u8005\u5728\u5408\u6210\u673a\u5236\u4e0a\u7cfb\u7edf\u6bd4\u8f83\u4e0d\u540c\u8bb0\u5fc6\u6761\u4ef6\u4e0e\u6a21\u578b\u540e\u7aef\uff0c\u5e76\u5206\u89e3\u5206\u6790\u72b6\u6001\u4fdd\u7559\u3001\u54cd\u5e94\u4ea4\u4ed8\u548c\u7b54\u6848\u683c\u5f0f\u7b49\u5931\u8d25\u6765\u6e90\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20045", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6784\u9020\u4e24\u6bb5\u5f53\u524d\u7b54\u6848\u76f8\u540c\u3001\u4f46\u7ecf\u540c\u4e00\u672a\u6765\u66f4\u65b0\u540e\u5e94\u4ea7\u751f\u4e0d\u540c\u7b54\u6848\u7684\u5386\u53f2\u5bf9\uff0c\u7528\u4e8e\u66b4\u9732\u201c\u73b0\u5728\u6b63\u786e\u3001\u4ee5\u540e\u4e0d\u8db3\u201d\u7684\u538b\u7f29\u7f3a\u9677\u3002", "\u786e\u5b9a\u6027 frontier selector \u5728 DeepSeek \u4e0a\u4e25\u683c\u63ed\u793a\u51c6\u786e\u7387\u4e3a 96/96\uff0c\u5728 GLM \u4e0a\u4e3a 82/96\uff1bstructured writer \u8868\u73b0\u660e\u663e\u8f83\u5f31\uff0c\u5e76\u51fa\u73b0\u5927\u91cf\u8bed\u4e49\u9519\u8bef\u4f46\u683c\u5f0f\u5408\u89c4\u7684\u8bb0\u5fc6\u3002", "\u5893\u7891\u4fe1\u606f\u79fb\u9664\u5bfc\u81f4\u76ee\u6807\u673a\u5236 16/16 \u7cbe\u786e\u91cd\u653e\u5931\u8d25\uff1b\u6807\u8bc6\u7b26\u91cd\u547d\u540d\u8fdb\u4e00\u6b65\u63ed\u793a\u547d\u540d\u6377\u5f84\u95ee\u9898\uff0c\u539f frontier late-reference \u5145\u5206\u6027\u4ece 8/8 \u964d\u81f3 94/320\u3002"], "keywords": ["\u4e0a\u4e0b\u6587\u538b\u7f29", "\u8bb0\u5fc6\u673a\u5236", "\u6a21\u578b\u8bc4\u6d4b", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20045v1", "published_at": "2026-09-17", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Correct Now, Insufficient Later: Auditing Update Sufficiency in Context Compression", "tldr": "\u5ba1\u8ba1\u4e0a\u4e0b\u6587\u538b\u7f29\u7684\u672a\u6765\u66f4\u65b0\u4e0d\u8db3", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u6210\u5bf9\u5386\u53f2\u5ba1\u8ba1\u201d\u65b9\u6cd5\uff0c\u68c0\u9a8c\u8bb0\u5fc6\u538b\u7f29\u662f\u5426\u4e0d\u4ec5\u80fd\u56de\u7b54\u5f53\u524d\u95ee\u9898\uff0c\u8fd8\u4fdd\u7559\u672a\u6765\u66f4\u65b0\u6240\u9700\u7684\u5173\u952e\u533a\u5206\u4fe1\u606f\u3002\u4f5c\u8005\u5728\u5408\u6210\u673a\u5236\u4e0a\u7cfb\u7edf\u6bd4\u8f83\u4e0d\u540c\u8bb0\u5fc6\u6761\u4ef6\u4e0e\u6a21\u578b\u540e\u7aef\uff0c\u5e76\u5206\u89e3\u5206\u6790\u72b6\u6001\u4fdd\u7559\u3001\u54cd\u5e94\u4ea4\u4ed8\u548c\u7b54\u6848\u683c\u5f0f\u7b49\u5931\u8d25\u6765\u6e90\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u4e0a\u4e0b\u6587\u538b\u7f29\u8bc4\u6d4b\u4e0d\u80fd\u53ea\u770b\u5f53\u524d\u56de\u7b54\u6b63\u786e\u6027\uff0c\u8fd8\u8981\u5ba1\u8ba1\u5bf9\u672a\u77e5\u672a\u6765\u66f4\u65b0\u7684\u5145\u5206\u6027\uff1b\u540c\u65f6\u4ee5\u53ef\u590d\u73b0\u5b9e\u9a8c\u63ed\u793a\u4e86\u683c\u5f0f\u6b63\u786e\u4f46\u8bed\u4e49\u9519\u8bef\u3001\u5305\u88c5\u9519\u8bef\u3001\u547d\u540d\u6377\u5f84\u7b49\u7ec6\u7c92\u5ea6\u5931\u8d25\u6a21\u5f0f\uff0c\u5bf9\u957f\u671f\u8bb0\u5fc6\u4e0e\u538b\u7f29\u7b97\u6cd5\u8bc4\u4f30\u6709\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002\u4f46\u5b9e\u9a8c\u4ecd\u9650\u4e8e\u4ed8\u8d39 pilot \u4e0e\u5408\u6210\u4efb\u52a1\uff0c\u672a\u58f0\u79f0\u81ea\u7136\u4efb\u52a1\u6cdb\u5316\u3002"}, {"abstract": "Characterizing the physical properties of clay and cementitious materials matters across many fields, from materials science to geological waste disposal. Property simulation typically calls for 3D imaging, which is expensive, not always accessible, and technically limited for certain materials. Recent progress in deep generative models offers a way around this, reconstructing 3D volumes from the more easily acquired 2D images. Among GAN-based methods for 3D microstructure generation, SliceGAN has shown strong results for homogeneous isotropic and anisotropic systems. It struggles, however, to capture the finer detail of more complex heterogeneous microstructures, which motivates alternative generative frameworks. We introduce a hybrid approach that draws on the stability and generation quality of denoising diffusion models. Since no 3D ground truth is available, we replace the standard denoising loss with an adversarial loss, which yields a stable training process in our experiments. We show that the resulting model generates microstructures of varying complexity with minimal slice artefacts and close agreement with ground-truth phase fractions and structural descriptors.", "arxiv_id": "2609.20358", "arxiv_url": "https://arxiv.org/abs/2609.20358", "authors": ["Ali Aouf", "Eric Laloy", "Bart Rogiers", "Christophe De Vleeschouwer"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7a33\u5b9a\u6269\u6563-\u5bf9\u6297\u6df7\u5408\u751f\u6210\u6a21\u578b\uff0c\u4ece\u6613\u83b7\u53d6\u76842D\u5207\u7247\u56fe\u50cf\u91cd\u5efa\u9ecf\u571f\u3001\u6c34\u6ce5\u7b49\u6750\u6599\u76843D\u5fae\u7ed3\u6784\u3002\u8be5\u65b9\u6cd5\u9762\u5411\u7f3a\u5c113D\u771f\u5b9e\u6807\u6ce8\u7684\u573a\u666f\uff0c\u7528\u5bf9\u6297\u635f\u5931\u66ff\u4ee3\u6807\u51c6\u53bb\u566a\u635f\u5931\u6765\u8bad\u7ec3\u6269\u6563\u5f0f\u751f\u6210\u6846\u67b6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20358", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9SliceGAN\u5728\u590d\u6742\u5f02\u8d28\u5fae\u7ed3\u6784\u7ec6\u8282\u523b\u753b\u4e0a\u7684\u4e0d\u8db3\uff0c\u5f15\u5165\u53bb\u566a\u6269\u6563\u6a21\u578b\u7684\u7a33\u5b9a\u6027\u4e0e\u751f\u6210\u8d28\u91cf\u4f18\u52bf", "\u5728\u65e03D ground truth\u6761\u4ef6\u4e0b\uff0c\u901a\u8fc7\u5bf9\u6297\u635f\u5931\u7ea6\u675f\u751f\u6210\u4f53\u6570\u636e\u4e0e2D\u5207\u7247\u7edf\u8ba1\u4e00\u81f4", "\u5b9e\u9a8c\u663e\u793a\u751f\u6210\u7ed3\u679c\u5207\u7247\u4f2a\u5f71\u5c11\uff0c\u4e14\u76f8\u5206\u6570\u3001\u7ed3\u6784\u63cf\u8ff0\u7b26\u4e0e\u771f\u5b9e\u6570\u636e\u63a5\u8fd1"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u751f\u6210\u6a21\u578b", "\u4e09\u7ef4\u91cd\u5efa", "\u6750\u6599\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20358v1", "published_at": "2026-09-17", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Generating Heterogeneous 3D Geological Microstructures from 2D Images via a Stable Diffusion-Adversarial Model", "tldr": "\u75282D\u56fe\u50cf\u751f\u6210\u5f02\u8d283D\u5730\u8d28\u5fae\u7ed3\u6784", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7a33\u5b9a\u6269\u6563-\u5bf9\u6297\u6df7\u5408\u751f\u6210\u6a21\u578b\uff0c\u4ece\u6613\u83b7\u53d6\u76842D\u5207\u7247\u56fe\u50cf\u91cd\u5efa\u9ecf\u571f\u3001\u6c34\u6ce5\u7b49\u6750\u6599\u76843D\u5fae\u7ed3\u6784\u3002\u8be5\u65b9\u6cd5\u9762\u5411\u7f3a\u5c113D\u771f\u5b9e\u6807\u6ce8\u7684\u573a\u666f\uff0c\u7528\u5bf9\u6297\u635f\u5931\u66ff\u4ee3\u6807\u51c6\u53bb\u566a\u635f\u5931\u6765\u8bad\u7ec3\u6269\u6563\u5f0f\u751f\u6210\u6846\u67b6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u6602\u8d35\u6216\u96be\u4ee5\u83b7\u5f973D\u6210\u50cf\u7684\u6750\u6599\u4e0e\u5730\u8d28\u6837\u672c\u63d0\u4f9b\u4e86\u53ef\u884c\u66ff\u4ee3\u65b9\u6848\uff0c\u6709\u671b\u964d\u4f4e\u5fae\u7ed3\u6784\u5efa\u6a21\u4e0e\u7269\u6027\u6a21\u62df\u95e8\u69db\uff0c\u5e76\u6269\u5c55\u6269\u6563\u6a21\u578b\u5728\u79d1\u5b66\u8ba1\u7b97\u548c\u6750\u6599\u8868\u5f81\u4e2d\u7684\u5e94\u7528\u3002"}, {"abstract": "Spatial reasoning abilities correlate strongly with performance in STEM fields. Games offer a compelling medium for training these critical skills in developing children who have a natural proclivity for play. However, to facilitate human-like tutoring and player guidance, these games require an AI agent capable of making commonsense inferences from spatial events. Qualitative reasoning (QR) models appear to be a suitable framework for these application domains. As these models reason in symbolic representations, they can seamlessly translate game states into interpretable feedback for human-like player guidance. This paper introduces a hybrid qualitative model designed for Camelot Jr., a block-puzzle game that requires constructing multi-level bridges to connect two avatars stationed on separate towers. The game poses a challenge for the player, who must make platforms stable, plan their path, and ensure they use all the provided blocks. To handle the precise physics required by the domain, we integrate a mathematical center-of-mass stability logic to guide our qualitative solver. Our work facilitates spatial skill training in Camelot Jr. and contributes to the development of human-centric, explainable game-playing agents.", "arxiv_id": "2609.20349", "arxiv_url": "https://arxiv.org/abs/2609.20349", "authors": ["Abhishek Jaiswal", "Zoe Falomir"], "brief": "\u8bba\u6587\u4e3a Camelot Jr. \u79ef\u6728\u6865\u8c1c\u9898\u6e38\u620f\u63d0\u51fa\u4e00\u79cd\u6df7\u5408\u5b9a\u6027\u63a8\u7406\u6a21\u578b\uff0c\u7528\u4e8e\u63a8\u7406\u8def\u5f84\u8fde\u901a\u6027\u4e0e\u7ed3\u6784\u652f\u6491\u7a33\u5b9a\u6027\u3002\u6a21\u578b\u7ed3\u5408\u7b26\u53f7\u5316\u5b9a\u6027\u63a8\u7406\u4e0e\u8d28\u5fc3\u7a33\u5b9a\u6027\u8ba1\u7b97\uff0c\u5e2e\u52a9\u6e38\u620f\u667a\u80fd\u4f53\u751f\u6210\u53ef\u89e3\u91ca\u7684\u73a9\u5bb6\u6307\u5bfc\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20349", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u9488\u5bf9\u591a\u5c42\u6865\u6881\u642d\u5efa\u4efb\u52a1\uff0c\u540c\u65f6\u8003\u8651\u8def\u5f84\u89c4\u5212\u3001\u5e73\u53f0\u7a33\u5b9a\u548c\u7528\u5c3d\u6240\u6709\u79ef\u6728\u7b49\u7ea6\u675f", "\u5728\u5b9a\u6027\u63a8\u7406\u6846\u67b6\u4e2d\u5f15\u5165\u6570\u5b66\u8d28\u5fc3\u7a33\u5b9a\u6027\u903b\u8f91\uff0c\u4ee5\u5904\u7406\u6e38\u620f\u4e2d\u8f83\u7cbe\u786e\u7684\u7269\u7406\u7a33\u5b9a\u5224\u65ad", "\u7b26\u53f7\u5316\u8868\u793a\u53ef\u5c06\u6e38\u620f\u72b6\u6001\u8f6c\u5316\u4e3a\u4eba\u7c7b\u53ef\u7406\u89e3\u7684\u53cd\u9988\uff0c\u652f\u6301\u7c7b\u4f3c\u4eba\u7c7b\u5bfc\u5e08\u7684\u5f15\u5bfc"], "keywords": ["\u7a7a\u95f4\u63a8\u7406", "\u5b9a\u6027\u63a8\u7406", "\u6e38\u620f\u667a\u80fd\u4f53", "\u53ef\u89e3\u91caAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20349v1", "published_at": "2026-09-17", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "A Qualitative Model for Reasoning about Path and Support", "tldr": "\u9762\u5411\u79ef\u6728\u6865\u8c1c\u9898\u7684\u53ef\u89e3\u91ca\u7a7a\u95f4\u63a8\u7406\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4e3a Camelot Jr. \u79ef\u6728\u6865\u8c1c\u9898\u6e38\u620f\u63d0\u51fa\u4e00\u79cd\u6df7\u5408\u5b9a\u6027\u63a8\u7406\u6a21\u578b\uff0c\u7528\u4e8e\u63a8\u7406\u8def\u5f84\u8fde\u901a\u6027\u4e0e\u7ed3\u6784\u652f\u6491\u7a33\u5b9a\u6027\u3002\u6a21\u578b\u7ed3\u5408\u7b26\u53f7\u5316\u5b9a\u6027\u63a8\u7406\u4e0e\u8d28\u5fc3\u7a33\u5b9a\u6027\u8ba1\u7b97\uff0c\u5e2e\u52a9\u6e38\u620f\u667a\u80fd\u4f53\u751f\u6210\u53ef\u89e3\u91ca\u7684\u73a9\u5bb6\u6307\u5bfc\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5b9a\u6027\u63a8\u7406\u4e0e\u7269\u7406\u8ba1\u7b97\u7ed3\u5408\u5728\u6559\u80b2\u6e38\u620f\u667a\u80fd\u4f53\u4e2d\u7684\u5b9e\u7528\u4ef7\u503c\uff0c\u6709\u52a9\u4e8e\u6784\u5efa\u53ef\u89e3\u91ca\u3001\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684\u7a7a\u95f4\u80fd\u529b\u8bad\u7ec3\u7cfb\u7edf\u3002"}, {"abstract": "Traffic regulations are written for human interpretation and therefore rely on shared background knowledge and flexible phrasing, which inherently introduce ambiguity, context dependence, and semantic underspecification. These linguistic characteristics conflict with the precision required by computational reasoning engines such as Prolog, which demand explicit logical structure. This study evaluates two baseline translation approaches, Natural Language to Prolog ($NL\\rightarrow Prolog$) and Logical English to Prolog ($LE\\rightarrow Prolog$), and introduces a new reasoning-guided translation framework called Structured Four-Stage Legal Translation ($S4L\\rightarrow Prolog$). The proposed S4L framework performs semantic role extraction, scene completion, logical mapping, and Prolog rule generation within a single guided prompt, enabling direct translation of raw traffic rules into executable logic without human intervention. A benchmark consisting of twenty real-world traffic rules was used to evaluate each approach in terms of syntactic validity, semantic correctness, and logical completeness. $S4L\\rightarrow Prolog$ achieves the highest accuracy, correctly formalizing 75 percent of the rules, while $NL\\rightarrow Prolog$ reaches 60 percent and $LE\\rightarrow Prolog$ reaches 55 percent. Qualitative analysis further shows that S4L captures implicit causal relations, deontic modality, and exception structure more reliably than the baselines. These results demonstrate that structured reasoning prompts can substantially improve the reliability of natural-language-to-logic translation for legal and safety-critical applications.", "arxiv_id": "2609.20334", "arxiv_url": "https://arxiv.org/abs/2609.20334", "authors": ["May Myo Zin", "Wachara Fungwacharakorn", "Ken Satoh", "Katsumi Nitta"], "brief": "\u8bba\u6587\u63d0\u51fa Structured Four-Stage Legal Translation\uff08S4L\u2192Prolog\uff09\u6846\u67b6\uff0c\u901a\u8fc7\u8bed\u4e49\u89d2\u8272\u62bd\u53d6\u3001\u573a\u666f\u8865\u5168\u3001\u903b\u8f91\u6620\u5c04\u548c Prolog \u89c4\u5219\u751f\u6210\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u4ea4\u901a\u6cd5\u89c4\u76f4\u63a5\u8f6c\u4e3a\u53ef\u6267\u884c\u903b\u8f91\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20334", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5bf9\u6bd4 NL\u2192Prolog\u3001Logical English\u2192Prolog \u4e24\u79cd\u57fa\u7ebf\u65b9\u6cd5\uff0c\u8bc4\u4f30\u8bed\u6cd5\u6709\u6548\u6027\u3001\u8bed\u4e49\u6b63\u786e\u6027\u548c\u903b\u8f91\u5b8c\u6574\u6027", "\u572820\u6761\u771f\u5b9e\u4ea4\u901a\u89c4\u5219\u57fa\u51c6\u4e0a\uff0cS4L \u6b63\u786e\u5f62\u5f0f\u5316\u7387\u8fbe75%\uff0c\u9ad8\u4e8e NL\u2192Prolog \u768460%\u548c LE\u2192Prolog \u768455%", "\u7ed3\u6784\u5316\u63a8\u7406\u63d0\u793a\u66f4\u597d\u6355\u6349\u9690\u542b\u56e0\u679c\u5173\u7cfb\u3001\u4e49\u52a1/\u7981\u6b62\u7b49\u9053\u4e49\u6a21\u6001\u4ee5\u53ca\u4f8b\u5916\u7ed3\u6784"], "keywords": ["\u6cd5\u5f8b\u63a8\u7406", "\u903b\u8f91\u7f16\u7a0b", "\u63d0\u793a\u5de5\u7a0b", "\u7b26\u53f7\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20334v1", "published_at": "2026-09-17", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Structured Four-Stage Legal Translation: From Natural-Language Traffic Rules to PROLOG", "tldr": "\u56db\u9636\u6bb5\u63d0\u793a\u63d0\u5347\u4ea4\u901a\u6cd5\u89c4\u8f6cProlog\u51c6\u786e\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Structured Four-Stage Legal Translation\uff08S4L\u2192Prolog\uff09\u6846\u67b6\uff0c\u901a\u8fc7\u8bed\u4e49\u89d2\u8272\u62bd\u53d6\u3001\u573a\u666f\u8865\u5168\u3001\u903b\u8f91\u6620\u5c04\u548c Prolog \u89c4\u5219\u751f\u6210\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u4ea4\u901a\u6cd5\u89c4\u76f4\u63a5\u8f6c\u4e3a\u53ef\u6267\u884c\u903b\u8f91\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u7528\u7ed3\u6784\u5316\u63a8\u7406\u63d0\u793a\u63d0\u5347\u6cd5\u5f8b\u6587\u672c\u5230\u5f62\u5f0f\u903b\u8f91\u8f6c\u6362\u53ef\u9760\u6027\u7684\u53ef\u884c\u6027\uff0c\u5bf9\u4ea4\u901a\u6cd5\u89c4\u3001\u5408\u89c4\u5ba1\u67e5\u548c\u5b89\u5168\u5173\u952e\u7cfb\u7edf\u4e2d\u7684\u81ea\u52a8\u63a8\u7406\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Three-dimensional reconstruction from unorganized point clouds remains a challenging problem in computer vision, geometric modeling, and computer-aided design. While neural implicit methods achieve impressive reconstruction accuracy, geometry is typically encoded in latent representations that limit interpretability and reuse within engineering workflows. We present NeuSOGA3D (Neuro-Symbolic Geometric Abstraction in 3D), a hybrid framework that combines learned perceptual priors inherited from NeuSOGA with explicit symbolic geometric reasoning. The method projects point clouds onto principal orthographic planes, constructs symbolic implicit spline representations from the resulting observations, and fuses them through shape-preserving constructive solid geometry operations to generate a coarse visual hull. Additional geometric detail is recovered through cross-sectional decomposition and volumetric reconstruction using Partial Shape-Preserving Splines. Unlike conventional neural implicit approaches, NeuSOGA3D progressively transforms observations into explicit symbolic entities, including control polygons, implicit spline fields, cross-sections, and volumetric lofts. Experiments on all forty categories of the ModelNet40 benchmark demonstrate the ability of the framework to recover structurally meaningful and CAD-compatible geometric representations from diverse point-cloud observations. The results highlight the potential of combining learned perception with symbolic geometric reasoning for explainable geometric intelligence.", "arxiv_id": "2609.20323", "arxiv_url": "https://arxiv.org/abs/2609.20323", "authors": ["Qingde Li", "Qingqi Hong", "Zihan Li", "Jie Tian"], "brief": "\u8bba\u6587\u63d0\u51fa NeuSOGA3D\uff0c\u5c06\u795e\u7ecf\u611f\u77e5\u5148\u9a8c\u4e0e\u7b26\u53f7\u51e0\u4f55\u63a8\u7406\u7ed3\u5408\uff0c\u7528\u4e8e\u4ece\u65e0\u5e8f\u70b9\u4e91\u91cd\u5efa\u53ef\u89e3\u91ca\u3001\u53ef\u590d\u7528\u7684\u4e09\u7ef4\u51e0\u4f55\u3002\u5b83\u628a\u70b9\u4e91\u9010\u6b65\u8f6c\u5316\u4e3a\u63a7\u5236\u591a\u8fb9\u5f62\u3001\u9690\u5f0f\u6837\u6761\u573a\u3001\u622a\u9762\u4e0e\u4f53\u79ef\u653e\u6837\u7b49\u663e\u5f0f\u7b26\u53f7\u8868\u793a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20323", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u70b9\u4e91\u6295\u5f71\u5230\u4e3b\u6b63\u4ea4\u5e73\u9762\uff0c\u5e76\u4ece\u89c2\u6d4b\u4e2d\u6784\u5efa\u7b26\u53f7\u9690\u5f0f\u6837\u6761\u8868\u793a\u3002", "\u901a\u8fc7\u4fdd\u6301\u5f62\u72b6\u7684\u6784\u9020\u5b9e\u4f53\u51e0\u4f55\u64cd\u4f5c\u878d\u5408\u591a\u89c6\u56fe\u8868\u793a\uff0c\u751f\u6210\u7c97\u7565 visual hull\u3002", "\u5229\u7528\u622a\u9762\u5206\u89e3\u4e0e Partial Shape-Preserving Splines \u4f53\u79ef\u91cd\u5efa\u6062\u590d\u66f4\u591a\u51e0\u4f55\u7ec6\u8282\uff0c\u5e76\u5728 ModelNet40 \u516840\u7c7b\u4e0a\u5b9e\u9a8c\u9a8c\u8bc1\u3002"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u795e\u7ecf\u7b26\u53f7", "\u51e0\u4f55\u5efa\u6a21", "\u53ef\u89e3\u91caAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20323v1", "published_at": "2026-09-17", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "NeuSOGA3D: A Neuro-Symbolic Framework for Explainable 3D Geometric Reconstruction", "tldr": "\u795e\u7ecf\u7b26\u53f7\u6846\u67b6\u5b9e\u73b0\u53ef\u89e3\u91ca3D\u91cd\u5efa", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa NeuSOGA3D\uff0c\u5c06\u795e\u7ecf\u611f\u77e5\u5148\u9a8c\u4e0e\u7b26\u53f7\u51e0\u4f55\u63a8\u7406\u7ed3\u5408\uff0c\u7528\u4e8e\u4ece\u65e0\u5e8f\u70b9\u4e91\u91cd\u5efa\u53ef\u89e3\u91ca\u3001\u53ef\u590d\u7528\u7684\u4e09\u7ef4\u51e0\u4f55\u3002\u5b83\u628a\u70b9\u4e91\u9010\u6b65\u8f6c\u5316\u4e3a\u63a7\u5236\u591a\u8fb9\u5f62\u3001\u9690\u5f0f\u6837\u6761\u573a\u3001\u622a\u9762\u4e0e\u4f53\u79ef\u653e\u6837\u7b49\u663e\u5f0f\u7b26\u53f7\u8868\u793a\u3002", "why_notable": "\u76f8\u6bd4\u5e38\u89c1\u795e\u7ecf\u9690\u5f0f\u91cd\u5efa\u65b9\u6cd5\uff0c\u8be5\u6846\u67b6\u5f3a\u8c03\u53ef\u89e3\u91ca\u6027\u548c CAD \u5de5\u4f5c\u6d41\u517c\u5bb9\u6027\uff0c\u6709\u52a9\u4e8e\u628a\u70b9\u4e91\u91cd\u5efa\u7ed3\u679c\u8f6c\u5316\u4e3a\u5de5\u7a0b\u4e2d\u53ef\u7f16\u8f91\u3001\u53ef\u590d\u7528\u7684\u7b26\u53f7\u51e0\u4f55\u5b9e\u4f53\u3002"}, {"abstract": "Ubiquitous time series data across diverse domains enables critical applications in areas such as transportation systems and power grids. Recently, training foundation models on massive datasets to achieve accurate zero-shot forecasting has emerged as a major research focus. However, current studies predominantly prioritize architectural innovations while insufficiently addressing data diversity, often relying on simple data sampling strategies that fail to manage complex data distributions effectively, leading to inefficient use of training data and suboptimal performance. To address this, we propose QUALS, a large-scale time series corpus equilibrium framework. QUALS significantly enhances data efficiency, i.e., enabling existing models to achieve superior performance using only a small fraction of the original training data. Specifically, QUALS operates through two core mechanisms. First, a pattern quantization framework systematically decodes heterogeneous patterns from mixed corpora via vector quantization and uniform binning. Second, a learnability synchronization framework calibrates sampling weights for heterogeneous patterns, bridging the optimization gap between simple and complex motifs to maximize overall training efficiency. Extensive benchmarks demonstrate that pre-training on QUALS consistently achieves superior zero-shot performance, even under substantially reduced training budgets.", "arxiv_id": "2609.20156", "arxiv_url": "https://arxiv.org/abs/2609.20156", "authors": ["Yujie Li", "Zezhi Shao", "Chengqing Yu", "Yisong Fu", "Weijie Zhu", "Yifan Du", "Jilin Hu", "Bin Yang", "Yongjun Xu", "Fei Wang"], "brief": "\u672c\u6587\u63d0\u51fa QUALS\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u65f6\u95f4\u5e8f\u5217\u9884\u8bad\u7ec3\u7684\u6570\u636e\u5747\u8861\u6846\u67b6\uff0c\u91cd\u70b9\u89e3\u51b3\u73b0\u6709\u57fa\u7840\u6a21\u578b\u8bad\u7ec3\u4e2d\u6570\u636e\u5206\u5e03\u590d\u6742\u3001\u91c7\u6837\u4f4e\u6548\u7684\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u6a21\u5f0f\u91cf\u5316\u8bc6\u522b\u5f02\u6784\u65f6\u95f4\u5e8f\u5217\u6a21\u5f0f\uff0c\u5e76\u7528\u53ef\u5b66\u4e60\u6027\u540c\u6b65\u8c03\u6574\u91c7\u6837\u6743\u91cd\uff0c\u4f7f\u6a21\u578b\u5728\u663e\u8457\u51cf\u5c11\u8bad\u7ec3\u6570\u636e\u7684\u60c5\u51b5\u4e0b\u4ecd\u83b7\u5f97\u66f4\u597d\u7684\u96f6\u6837\u672c\u9884\u6d4b\u6027\u80fd\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20156", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u57fa\u7840\u6a21\u578b", "\u6570\u636e\u91c7\u6837", "\u96f6\u6837\u672c\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20156v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QUALS: Corpus Equilibrium for Universal Forecasting via Pattern Quantization and Learnability Synchronization", "tldr": "\u672c\u6587\u63d0\u51fa QUALS\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u65f6\u95f4\u5e8f\u5217\u9884\u8bad\u7ec3\u7684\u6570\u636e\u5747\u8861\u6846\u67b6\uff0c\u91cd\u70b9\u89e3\u51b3\u73b0\u6709\u57fa\u7840\u6a21\u578b\u8bad\u7ec3\u4e2d\u6570\u636e\u5206\u5e03\u590d\u6742\u3001\u91c7\u6837\u4f4e\u6548\u7684\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u6a21\u5f0f\u91cf\u5316\u8bc6\u522b\u5f02\u6784\u65f6\u95f4\u5e8f\u5217\u6a21\u5f0f\uff0c\u5e76\u7528\u53ef\u5b66\u4e60\u6027\u540c\u6b65\u8c03\u6574\u91c7\u6837\u6743\u91cd\uff0c\u4f7f\u6a21\u578b\u5728\u663e\u8457\u51cf\u5c11\u8bad\u7ec3\u6570\u636e\u7684\u60c5\u51b5\u4e0b\u4ecd\u83b7\u5f97\u66f4\u597d\u7684\u96f6\u6837\u672c\u9884\u6d4b\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generally, most voice agents are cascaded systems, i.e., an ASR model transcribes the caller\u0027s audio, a language model reads the transcript and decides what to say and which backend tools to call, and a TTS model speaks the reply. Nearly all of the decision making happens in the language model, but existing evaluations measure it either too broadly or too narrowly. End-to-end voice benchmarks score the full pipeline, so recognition errors and model errors mix into a single number. LLM benchmarks isolate the model but they do not evaluate what makes real phone calls hard, such as transcription issues, caller\u0027s voice being split across messages and the requirement that replies follow the language and script specified. We introduce the Multi-Turn Voice Agent Benchmark (MTVA-Bench), which evaluates the language model on the same conditions it faces inside a cascaded system. The caller is played by an LLM following a set of rubrics and tool calls are answered by a mock backend which responds to the arguments the model actually sent. The benchmark contains 49 agents working across 490 reviewed scenarios and supports 7 languages. Scoring is a combination of deterministic checks on tool calls with two LLM judges, one that scores scenario specific rules and one that grades conversation quality without access to the task. Both judges must cite specific messages from the transcript. Task and conversation scores are weighted equally, since a call can complete its task and still go badly for the caller. In a seven-model study, six of the models select the correct tool within 6.4 points of one another, but their overall scores span 24.4 points. Most of the gap comes from argument values, action ordering, rule compliance, and what the model says around its tool calls.", "arxiv_id": "2609.20152", "arxiv_url": "https://arxiv.org/abs/2609.20152", "authors": ["Pritish Mishra", "Ishaan Kumar", "Akshat Mandoli", "Sudarshan Kamath"], "brief": "\u672c\u6587\u63d0\u51fa MTVA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7ea7\u8054\u5f0f\u8bed\u97f3\u667a\u80fd\u4f53\u4e2d\u8d1f\u8d23\u51b3\u7b56\u7684\u8bed\u8a00\u6a21\u578b\uff0c\u6a21\u62df\u771f\u5b9e\u7535\u8bdd\u573a\u666f\u4e2d\u7684\u8f6c\u5199\u566a\u58f0\u3001\u591a\u8f6e\u62c6\u5206\u3001\u5de5\u5177\u8c03\u7528\u3001\u8bed\u8a00\u4e0e\u8bdd\u672f\u7ea6\u675f\u7b49\u95ee\u9898\u3002\u57fa\u51c6\u5305\u542b 49 \u4e2a\u667a\u80fd\u4f53\u3001490 \u4e2a\u5ba1\u9605\u573a\u666f\u548c 7 \u79cd\u8bed\u8a00\uff0c\u5e76\u7ed3\u5408\u786e\u5b9a\u6027\u5de5\u5177\u68c0\u67e5\u4e0e\u4e24\u4e2a LLM \u88c1\u5224\u6253\u5206\uff1b\u4e03\u6a21\u578b\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u5728\u9009\u5bf9\u5de5\u5177\u4e0a\u5dee\u8ddd\u4e0d\u5927\uff0c\u4f46\u6574\u4f53\u8868\u73b0\u56e0\u53c2\u6570\u3001\u52a8\u4f5c\u987a\u5e8f\u3001\u89c4\u5219\u9075\u5faa\u548c\u56de\u590d\u8d28\u91cf\u62c9\u5f00\u660e\u663e\u5dee\u8ddd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20152", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bed\u97f3\u4ea4\u4e92", "\u5927\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20152v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MTVA-Bench: Evaluating the Language Model Inside Cascaded Voice Agents", "tldr": "\u672c\u6587\u63d0\u51fa MTVA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u7ea7\u8054\u5f0f\u8bed\u97f3\u667a\u80fd\u4f53\u4e2d\u8d1f\u8d23\u51b3\u7b56\u7684\u8bed\u8a00\u6a21\u578b\uff0c\u6a21\u62df\u771f\u5b9e\u7535\u8bdd\u573a\u666f\u4e2d\u7684\u8f6c\u5199\u566a\u58f0\u3001\u591a\u8f6e\u62c6\u5206\u3001\u5de5\u5177\u8c03\u7528\u3001\u8bed\u8a00\u4e0e\u8bdd\u672f\u7ea6\u675f\u7b49\u95ee\u9898\u3002\u57fa\u51c6\u5305\u542b 49 \u4e2a\u667a\u80fd\u4f53\u3001490 \u4e2a\u5ba1\u9605\u573a\u666f\u548c 7 \u79cd\u8bed\u8a00\uff0c\u5e76\u7ed3\u5408\u786e\u5b9a\u6027\u5de5\u5177\u68c0\u67e5\u4e0e\u4e24\u4e2a LLM \u88c1\u5224\u6253\u5206\uff1b\u4e03\u6a21\u578b\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u5728\u9009\u5bf9\u5de5\u5177\u4e0a\u5dee\u8ddd\u4e0d\u5927\uff0c\u4f46\u6574\u4f53\u8868\u73b0\u56e0\u53c2\u6570\u3001\u52a8\u4f5c\u987a\u5e8f\u3001\u89c4\u5219\u9075\u5faa\u548c\u56de\u590d\u8d28\u91cf\u62c9\u5f00\u660e\u663e\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cortical hypometabolism measured by Fluorodeoxyglucose Positron Emission Tomography (FDG-PET) is a highly sensitive biomarker for dementia diagnosis. However, high costs, radiation exposure, and limited accessibility constrain its clinical utility. While cross-modal synthesis from Magnetic Resonance Imaging (MRI) offers a promising alternative, existing volumetric generation methods do not explicitly account for the highly folded cortical geometry, where disease-related patterns predominantly reside. To address this, we introduce a novel surface-based diffusion bridge framework DB-SUiT for MRI-to-PET translation that operates natively on the cortical manifold. A conditional Spherical U-shaped vision Transformer (SUiT) is specifically designed to model the intricate cross-modal relationships while preserving surface topology. It combines spherical convolutional encoders for multi-scale surface feature extraction with bottleneck Transformers to capture long-range spatial dependencies, while incorporating demographic and subcortical conditions to refine the synthesis. Evaluated on two datasets, including subjects with different dementia types, DB-SUiT demonstrates high-fidelity synthesis that substantially outperforms other baselines. In automated dementia classification, synthesized PET surfaces improve performance over MRI by 14.2% and PET volumes by 11.3%, approaching the performance of real PET surfaces. In a blinded reader study, synthetic PET achieved 85.5% diagnostic accuracy, compared with 75.8% for MRI and 95.2% for real PET. This further demonstrates cross-cohort and cross-pathology generalization, as the model was evaluated without retraining on an external cohort that included a dementia subtype not represented during training. Our code is available at https://github.com/ai-med/DB-SUiT.", "arxiv_id": "2609.20147", "arxiv_url": "https://arxiv.org/abs/2609.20147", "authors": ["Yitong Li", "Alexandra Samoylova", "Fabian Bongratz", "Timo Grimmer", "Dennis M. Hedderich", "Igor Yakushev", "Christian Wachinger"], "brief": "\u8bba\u6587\u63d0\u51fa DB-SUiT\uff0c\u4e00\u79cd\u5728\u5927\u8111\u76ae\u5c42\u8868\u9762\u6d41\u5f62\u4e0a\u8fdb\u884c MRI \u5230 FDG-PET \u5408\u6210\u7684\u6269\u6563\u6865\u6846\u67b6\uff0c\u7ed3\u5408\u7403\u9762\u5377\u79ef\u4e0e Transformer \u6765\u4fdd\u7559\u76ae\u5c42\u62d3\u6251\u5e76\u5efa\u6a21\u8de8\u6a21\u6001\u5173\u7cfb\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5408\u6210 PET \u660e\u663e\u4f18\u4e8e\u4f53\u7d20\u751f\u6210\u7b49\u57fa\u7ebf\uff0c\u5728\u75f4\u5446\u81ea\u52a8\u5206\u7c7b\u548c\u76f2\u8bfb\u8bca\u65ad\u4e2d\u663e\u8457\u63d0\u5347 MRI \u8868\u73b0\uff0c\u5e76\u5177\u5907\u8de8\u961f\u5217\u3001\u8de8\u75c5\u79cd\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20147", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u533b\u5b66\u5f71\u50cf", "\u591a\u6a21\u6001", "\u75f4\u5446\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20147v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bridging Modalities on the Cortex: Surface-based MRI to PET Translation with a Diffusion Bridge", "tldr": "\u8bba\u6587\u63d0\u51fa DB-SUiT\uff0c\u4e00\u79cd\u5728\u5927\u8111\u76ae\u5c42\u8868\u9762\u6d41\u5f62\u4e0a\u8fdb\u884c MRI \u5230 FDG-PET \u5408\u6210\u7684\u6269\u6563\u6865\u6846\u67b6\uff0c\u7ed3\u5408\u7403\u9762\u5377\u79ef\u4e0e Transformer \u6765\u4fdd\u7559\u76ae\u5c42\u62d3\u6251\u5e76\u5efa\u6a21\u8de8\u6a21\u6001\u5173\u7cfb\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5408\u6210 PET \u660e\u663e\u4f18\u4e8e\u4f53\u7d20\u751f\u6210\u7b49\u57fa\u7ebf\uff0c\u5728\u75f4\u5446\u81ea\u52a8\u5206\u7c7b\u548c\u76f2\u8bfb\u8bca\u65ad\u4e2d\u663e\u8457\u63d0\u5347 MRI \u8868\u73b0\uff0c\u5e76\u5177\u5907\u8de8\u961f\u5217\u3001\u8de8\u75c5\u79cd\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cognitive offloading to AI can reduce opportunities to practice skills, creating risks of deskilling. However, it remains unclear how to prevent deskilling without restricting access to AI. Here, we design two interventions to reduce offloading decisions: (1) metacognitive feedback that makes the implications of offloading for users explicit, and (2) an effort-based reward that incentivizes less extensive LLM assistance. We test both in a preregistered online experiment ($N = 704$) with a 2$\\times$2 design and a no-AI control. The task was to practice fraction arithmetic with an LLM-based assistant that provided solutions only on explicit request, followed by an unaided test. Metacognitive feedback reduced answer offloading (OR $= 0.47$) and improved test performance (OR $= 1.51$). We found no evidence that the reward affected either outcome. Our results identify metacognitive feedback as a promising design choice to reduce cognitive offloading.", "arxiv_id": "2609.20143", "arxiv_url": "https://arxiv.org/abs/2609.20143", "authors": ["Sebastian Maier", "Kai Schwabe", "Manuel Schneider", "Stefan Feuerriegel"], "brief": "\u8bba\u6587\u7814\u7a76\u5982\u4f55\u5728\u4e0d\u9650\u5236\u4f7f\u7528 LLM \u52a9\u624b\u7684\u60c5\u51b5\u4e0b\u51cf\u5c11\u8ba4\u77e5\u5916\u5305\uff0c\u4ee5\u907f\u514d\u6280\u80fd\u9000\u5316\u3002\u5728\u7ebf\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5143\u8ba4\u77e5\u53cd\u9988\u80fd\u663e\u8457\u51cf\u5c11\u7528\u6237\u76f4\u63a5\u7d22\u8981\u7b54\u6848\uff0c\u5e76\u63d0\u5347\u65e0\u8f85\u52a9\u6d4b\u8bd5\u8868\u73b0\uff1b\u57fa\u4e8e\u52aa\u529b\u7684\u5956\u52b1\u5219\u672a\u663e\u793a\u660e\u663e\u6548\u679c\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20143", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4eba\u673a\u4ea4\u4e92", "\u8ba4\u77e5\u5916\u5305", "\u6559\u80b2\u6280\u672f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20143v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Designing Against Deskilling: Metacognitive Feedback Reduces Cognitive Offloading to LLM Assistants", "tldr": "\u8bba\u6587\u7814\u7a76\u5982\u4f55\u5728\u4e0d\u9650\u5236\u4f7f\u7528 LLM \u52a9\u624b\u7684\u60c5\u51b5\u4e0b\u51cf\u5c11\u8ba4\u77e5\u5916\u5305\uff0c\u4ee5\u907f\u514d\u6280\u80fd\u9000\u5316\u3002\u5728\u7ebf\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5143\u8ba4\u77e5\u53cd\u9988\u80fd\u663e\u8457\u51cf\u5c11\u7528\u6237\u76f4\u63a5\u7d22\u8981\u7b54\u6848\uff0c\u5e76\u63d0\u5347\u65e0\u8f85\u52a9\u6d4b\u8bd5\u8868\u73b0\uff1b\u57fa\u4e8e\u52aa\u529b\u7684\u5956\u52b1\u5219\u672a\u663e\u793a\u660e\u663e\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent memory-augmented repository-level program repair methods reuse historical repair experiences to improve LLM-based issue resolution. However, our analysis reveals three limitations in existing repository-level memory retrieval. First, episodic memory is highly imbalanced across repositories, leaving low-resource repositories with little effective support. Second, more memory does not monotonically lead to higher repair success, suggesting that relevance, quality, and redundancy matter more than raw memory volume. Third, memory accumulation is phase-misaligned: repositories may contain many reproduction experiences but few patch or refinement experiences. To address these problems, we propose an adaptive experience retrieval framework for repository-level program repair. Our framework introduces coverage-aware retrieval, which falls back to cross-repository or repair-type-based memories when same-repository memory is insufficient; quality-aware selection, which ranks memories by relevance, historical utility, specificity, and redundancy; and stage-aware routing, which separates and retrieves memories for reproduction, localization, patch generation, patch refinement, and validation. Evaluated on SWE-Bench-Lite and SWE-Bench-Verified, the proposed framework improves repair performance on under-covered repositories, reduces noisy memory retrieval, and better supports failed-to-fixed patch refinement. Our results show that the key to memory-augmented repair is not simply accumulating more experiences, but retrieving the right experiences for the right repair context.", "arxiv_id": "2609.20130", "arxiv_url": "https://arxiv.org/abs/2609.20130", "authors": ["Z. C. Luo", "J. C. Guo", "W. J. He", "S. Y. Wang", "J. C. Yu", "F. M. Zhao", "Y. Chen", "T. Cao", "L. Q. Liu", "N. Zheng", "W. Xu", "J. Jiang", "Z. M. Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa AdaRepair-Mem\uff0c\u4e00\u4e2a\u9762\u5411\u4ed3\u5e93\u7ea7\u7a0b\u5e8f\u4fee\u590d\u7684\u81ea\u9002\u5e94\u7ecf\u9a8c\u68c0\u7d22\u6846\u67b6\uff0c\u9488\u5bf9\u5386\u53f2\u4fee\u590d\u8bb0\u5fc6\u5728\u4ed3\u5e93\u8986\u76d6\u3001\u8d28\u91cf\u5197\u4f59\u548c\u4fee\u590d\u9636\u6bb5\u4e0a\u7684\u4e0d\u5339\u914d\u95ee\u9898\u8fdb\u884c\u4f18\u5316\u3002\u65b9\u6cd5\u901a\u8fc7\u8986\u76d6\u611f\u77e5\u68c0\u7d22\u3001\u8d28\u91cf\u611f\u77e5\u9009\u62e9\u548c\u9636\u6bb5\u611f\u77e5\u8def\u7531\uff0c\u5728 SWE-Bench-Lite \u4e0e SWE-Bench-Verified \u4e0a\u63d0\u5347\u4e86\u4f4e\u8d44\u6e90\u4ed3\u5e93\u7684\u4fee\u590d\u6548\u679c\uff0c\u5e76\u51cf\u5c11\u566a\u58f0\u8bb0\u5fc6\u5e72\u6270\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20130", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a0b\u5e8f\u4fee\u590d", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bb0\u5fc6\u68c0\u7d22", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20130v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AdaRepair-Mem: Adaptive Experience Orchestration for Repository-Level Program Repair", "tldr": "\u8bba\u6587\u63d0\u51fa AdaRepair-Mem\uff0c\u4e00\u4e2a\u9762\u5411\u4ed3\u5e93\u7ea7\u7a0b\u5e8f\u4fee\u590d\u7684\u81ea\u9002\u5e94\u7ecf\u9a8c\u68c0\u7d22\u6846\u67b6\uff0c\u9488\u5bf9\u5386\u53f2\u4fee\u590d\u8bb0\u5fc6\u5728\u4ed3\u5e93\u8986\u76d6\u3001\u8d28\u91cf\u5197\u4f59\u548c\u4fee\u590d\u9636\u6bb5\u4e0a\u7684\u4e0d\u5339\u914d\u95ee\u9898\u8fdb\u884c\u4f18\u5316\u3002\u65b9\u6cd5\u901a\u8fc7\u8986\u76d6\u611f\u77e5\u68c0\u7d22\u3001\u8d28\u91cf\u611f\u77e5\u9009\u62e9\u548c\u9636\u6bb5\u611f\u77e5\u8def\u7531\uff0c\u5728 SWE-Bench-Lite \u4e0e SWE-Bench-Verified \u4e0a\u63d0\u5347\u4e86\u4f4e\u8d44\u6e90\u4ed3\u5e93\u7684\u4fee\u590d\u6548\u679c\uff0c\u5e76\u51cf\u5c11\u566a\u58f0\u8bb0\u5fc6\u5e72\u6270\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluating live streaming speech synthesis (TTS) requires assessing fine-grained, highly expressive prosody such as emotion, intonation, and energy which traditional MOS predictors fail to capture. While proprietary Large Language Models (LLMs) like Gemini can evaluate these aspects, they are too costly for massive inference and reinforcement learning feedback. To address this, we first introduce Live-ProsodyJudge (LPJ), a cost-effective pairwise evaluator distilled from Gemini into Qwen3-Omni. However, we identify a critical flaw in standard multi-dimensional evaluation: verdict coupling. The judge tends to lazily align all individual dimension scores with its overall preference, collapsing a rich multi-dimensional rubric into a single preference bit. To resolve this, we further propose Decoupled-Live-ProsodyJudge (D-LPJ). D-LPJ eliminates the overall verdict target to prevent blind following, masks uncertain pair-dimensions during Supervised Fine-Tuning(SFT), and introduces a novel span-local GRPO strategy that applies normalized advantages strictly to their corresponding rationale spans. Evaluated on highly curated human-annotated test sets, 10 sample balanced-order LPJ achieves higher point accuracy than a single Gemini call, while D-LPJ successfully produces independent,decoupled dimension judgments. Furthermore, in a Best-of-8 TTS candidate selection tournament, the LPJ-selected utterance falls within the human top-3 in 85.29% of high-confidence cases, demonstrating its efficacy for fine-grained TTS preference optimization.", "arxiv_id": "2609.20124", "arxiv_url": "https://arxiv.org/abs/2609.20124", "authors": ["Zifan Guan", "Longyu Lu", "Junan Zhang", "Zhizheng Wu", "Meiguang Jin", "Junfeng Ma"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e\u76f4\u64ad\u8bed\u97f3\u5408\u6210\u7684\u591a\u7ef4\u97f5\u5f8b\u8bc4\u6d4b\u5668 Live-ProsodyJudge\uff0c\u5c06 Gemini \u7684\u8bc4\u5224\u80fd\u529b\u84b8\u998f\u5230 Qwen3-Omni\uff0c\u4ee5\u4f4e\u6210\u672c\u8bc4\u4f30\u60c5\u611f\u3001\u8bed\u8c03\u3001\u80fd\u91cf\u7b49\u7ec6\u7c92\u5ea6\u97f5\u5f8b\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa D-LPJ\uff0c\u901a\u8fc7\u53bb\u9664\u603b\u4f53\u504f\u597d\u76ee\u6807\u3001\u5c4f\u853d\u4e0d\u786e\u5b9a\u7ef4\u5ea6\u548c span-local GRPO\uff0c\u7f13\u89e3\u591a\u7ef4\u8bc4\u5206\u88ab\u603b\u4f53\u504f\u597d\u7ed1\u67b6\u7684\u95ee\u9898\uff1b\u5728\u4eba\u7c7b\u6807\u6ce8\u6d4b\u8bd5\u548c TTS \u5019\u9009\u4f18\u9009\u4e2d\u8868\u73b0\u8f83\u597d\u3002", "categories": ["cs.SD", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20124", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u5408\u6210", "\u97f5\u5f8b\u8bc4\u4f30", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20124v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Multi-Dimensional Prosody Judgment For Live Streaming Speech Synthesis", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e\u76f4\u64ad\u8bed\u97f3\u5408\u6210\u7684\u591a\u7ef4\u97f5\u5f8b\u8bc4\u6d4b\u5668 Live-ProsodyJudge\uff0c\u5c06 Gemini \u7684\u8bc4\u5224\u80fd\u529b\u84b8\u998f\u5230 Qwen3-Omni\uff0c\u4ee5\u4f4e\u6210\u672c\u8bc4\u4f30\u60c5\u611f\u3001\u8bed\u8c03\u3001\u80fd\u91cf\u7b49\u7ec6\u7c92\u5ea6\u97f5\u5f8b\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa D-LPJ\uff0c\u901a\u8fc7\u53bb\u9664\u603b\u4f53\u504f\u597d\u76ee\u6807\u3001\u5c4f\u853d\u4e0d\u786e\u5b9a\u7ef4\u5ea6\u548c span-local GRPO\uff0c\u7f13\u89e3\u591a\u7ef4\u8bc4\u5206\u88ab\u603b\u4f53\u504f\u597d\u7ed1\u67b6\u7684\u95ee\u9898\uff1b\u5728\u4eba\u7c7b\u6807\u6ce8\u6d4b\u8bd5\u548c TTS \u5019\u9009\u4f18\u9009\u4e2d\u8868\u73b0\u8f83\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Straight-through processing (STP) on extracted key-value fields from financial documents without human review requires a calibrated probability together with a bounded guarantee on the residual error of the auto-approved tier. The emergence of modern Vision Language Models (VLMs) provides an out-of-the-box capability for extracting the key-values, but their verbalized confidence signals are unreliable and weakly track field correctness. This paper introduces a decomposed confidence layer along three interpretable channels, including perception, layout, and validation. Together with a final conformal risk control, the score can be used for reliable STP of financial documents. The method is validated on three public datasets covering real invoices, synthetic invoices, and ad-buy forms, using two different VLM families (Qwen3.6-27B and Gemini-3.1-Flash-Lite). Our decomposed score consistently improves the separation of correct from incorrect extractions, substantially raising the AUROC from 0.54-0.74 for VLM verbalized signals to 0.90-0.99 with contributions from all three designed channels. Crucially for industrial deployment, this enables usable STP. The native VLM confidence signals could clear only 0.1%-7.0% of fields under risk control at a target error of \u003c10%. In contrast, the proposed method auto-approves 49-72% of fields while holding the empirical error of the accepted tier at or below the target.", "arxiv_id": "2609.20110", "arxiv_url": "https://arxiv.org/abs/2609.20110", "authors": ["Yichao Jin", "Yushuo Wang", "Yuxuan Han", "Kwan Ching Yee Sonia", "Weiyang Song", "Chiu Jin-Chun Kent", "Wong Chong Hwee", "Wong Tiong Kiat", "Kenneth Zhu Ke", "Jingyuan Zhao"], "brief": "\u672c\u6587\u9488\u5bf9\u91d1\u878d\u6587\u6863\u5173\u952e\u5b57\u6bb5\u62bd\u53d6\u7684\u81ea\u52a8\u76f4\u901a\u5904\u7406\uff0c\u63d0\u51fa\u7531\u611f\u77e5\u3001\u7248\u9762\u548c\u6821\u9a8c\u4e09\u7c7b\u53ef\u89e3\u91ca\u4fe1\u53f7\u7ec4\u6210\u7684\u7f6e\u4fe1\u5ea6\u5c42\uff0c\u5e76\u7ed3\u5408\u4fdd\u5f62\u98ce\u9669\u63a7\u5236\u7ed9\u51fa\u53ef\u63a7\u9519\u8bef\u7387\u4fdd\u8bc1\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u663e\u8457\u4f18\u4e8e VLM \u81ea\u5e26\u53e3\u5934\u7f6e\u4fe1\u5ea6\uff0cAUROC \u63d0\u5347\u5230 0.90-0.99\uff0c\u5728\u76ee\u6807\u9519\u8bef\u7387\u4f4e\u4e8e 10% \u65f6\u53ef\u81ea\u52a8\u901a\u8fc7 49%-72% \u5b57\u6bb5\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20110", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u6863\u7406\u89e3", "\u591a\u6a21\u6001", "\u7f6e\u4fe1\u5ea6\u6821\u51c6", "\u98ce\u9669\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20110v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Perception, Layout, and Validation: Calibrated Confidence for Reliable Straight-Through Processing of Financial Documents", "tldr": "\u672c\u6587\u9488\u5bf9\u91d1\u878d\u6587\u6863\u5173\u952e\u5b57\u6bb5\u62bd\u53d6\u7684\u81ea\u52a8\u76f4\u901a\u5904\u7406\uff0c\u63d0\u51fa\u7531\u611f\u77e5\u3001\u7248\u9762\u548c\u6821\u9a8c\u4e09\u7c7b\u53ef\u89e3\u91ca\u4fe1\u53f7\u7ec4\u6210\u7684\u7f6e\u4fe1\u5ea6\u5c42\uff0c\u5e76\u7ed3\u5408\u4fdd\u5f62\u98ce\u9669\u63a7\u5236\u7ed9\u51fa\u53ef\u63a7\u9519\u8bef\u7387\u4fdd\u8bc1\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u663e\u8457\u4f18\u4e8e VLM \u81ea\u5e26\u53e3\u5934\u7f6e\u4fe1\u5ea6\uff0cAUROC \u63d0\u5347\u5230 0.90-0.99\uff0c\u5728\u76ee\u6807\u9519\u8bef\u7387\u4f4e\u4e8e 10% \u65f6\u53ef\u81ea\u52a8\u901a\u8fc7 49%-72% \u5b57\u6bb5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The Antibandwidth and Cyclic Antibandwidth problems are NP-hard graph labeling problems that aim to maximize the minimum (cyclic) distance between labels assigned to adjacent vertices. Extensive research on these problems has resulted in a variety of mathematical formulations and computational approaches. However, their minimum span perspective, in which a prescribed minimum (cyclic) distance is fixed and the objective is to minimize the label span, has received comparatively little attention. In this paper, we consider this complementary perspective by introducing the Minimum Span Antibandwidth/Cyclic Antibandwidth Labeling (MSABL/MSCABL) problems and developing a unified Boolean Satisfiability (SAT)-based framework for solving them. The SAT-based framework formulates MSABL/MSCABL as a sequence of decision problems and exploits their monotonicity to accelerate the search process. We also consider two SAT solving strategies, parallel and incremental SAT solving: the former examines multiple candidate spans concurrently, while the latter reuses a single SAT instance while progressively restricting the label domain. The proposed approaches are evaluated on benchmark instances from the Harwell-Boeing Sparse Matrix Collection and compared with CPLEXCP, CPLEXMIP, and Gurobi. The results show that SAT-based approaches are highly competitive in solution quality, with the parallel approach performing best overall for MSCABL and the incremental approach for MSABL. With the no-hole constraint, they remain competitive with CPLEXCP and significantly outperform CPLEXMIP and Gurobi, particularly for MSCABL. These results demonstrate the effectiveness of SAT solving as an exact approach for MSABL and MSCABL.", "arxiv_id": "2609.20091", "arxiv_url": "https://arxiv.org/abs/2609.20091", "authors": ["Hieu Truong Xuan", "Khanh To Van"], "brief": "\u672c\u6587\u63d0\u51fa\u6700\u5c0f\u8de8\u5ea6\u53cd\u5e26\u5bbd/\u5faa\u73af\u53cd\u5e26\u5bbd\u6807\u53f7\u95ee\u9898\uff08MSABL/MSCABL\uff09\uff0c\u5e76\u7528\u7edf\u4e00\u7684 SAT \u6846\u67b6\u5c06\u5176\u8f6c\u5316\u4e3a\u4e00\u7cfb\u5217\u5177\u6709\u5355\u8c03\u6027\u7684\u5224\u5b9a\u95ee\u9898\u6765\u6c42\u89e3\u3002\u5b9e\u9a8c\u8868\u660e\uff0cSAT \u65b9\u6cd5\u5728\u89e3\u8d28\u91cf\u4e0a\u5f88\u6709\u7ade\u4e89\u529b\uff1a\u5e76\u884c SAT \u66f4\u9002\u5408 MSCABL\uff0c\u589e\u91cf SAT \u66f4\u9002\u5408 MSABL\uff0c\u4e14\u5728\u90e8\u5206\u8bbe\u7f6e\u4e0b\u660e\u663e\u4f18\u4e8e CPLEXMIP \u548c Gurobi\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20091", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u4f18\u5316", "SAT\u6c42\u89e3", "\u7ec4\u5408\u4f18\u5316", "\u7cbe\u786e\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20091v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Solving Minimum Span Antibandwidth and Cyclic Antibandwidth Labeling Problems", "tldr": "\u672c\u6587\u63d0\u51fa\u6700\u5c0f\u8de8\u5ea6\u53cd\u5e26\u5bbd/\u5faa\u73af\u53cd\u5e26\u5bbd\u6807\u53f7\u95ee\u9898\uff08MSABL/MSCABL\uff09\uff0c\u5e76\u7528\u7edf\u4e00\u7684 SAT \u6846\u67b6\u5c06\u5176\u8f6c\u5316\u4e3a\u4e00\u7cfb\u5217\u5177\u6709\u5355\u8c03\u6027\u7684\u5224\u5b9a\u95ee\u9898\u6765\u6c42\u89e3\u3002\u5b9e\u9a8c\u8868\u660e\uff0cSAT \u65b9\u6cd5\u5728\u89e3\u8d28\u91cf\u4e0a\u5f88\u6709\u7ade\u4e89\u529b\uff1a\u5e76\u884c SAT \u66f4\u9002\u5408 MSCABL\uff0c\u589e\u91cf SAT \u66f4\u9002\u5408 MSABL\uff0c\u4e14\u5728\u90e8\u5206\u8bbe\u7f6e\u4e0b\u660e\u663e\u4f18\u4e8e CPLEXMIP \u548c Gurobi\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "SpeechLLMs have shown strong potential for emotion recognition, yet they read the predicted emotion off a generative decoder not suited for classification: it can emit labels outside the target set and favors frequent classes. We propose a discriminative adaptation that reads the final prompt token\u0027s hidden state through a classification head, producing a label in one forward pass without modifying the backbone. Because this readout starts from the hidden state the model would otherwise decode, it gives a controlled comparison of generative and discriminative inference in an otherwise identical speechLLM. We keep the head a single linear layer, trading little accuracy for interpretability: each emotion becomes one direction in the LLM output token space, revealing associated tokens. On IEMOCAP, across two speechLLM architectures, it improves Macro F1 and removes hallucinations, with largest gains on realistic ASR transcripts. Our analysis reveals that these emotion directions encode indirect associations mirroring biases in web-scale text.", "arxiv_id": "2609.20081", "arxiv_url": "https://arxiv.org/abs/2609.20081", "authors": ["Hasindri Watawana", "Sergio Burdisso", "Esa\u00fa Villatoro-Tello", "Manjunath K E", "Kadri Hacioglu", "Petr Motlicek", "Andreas Stolcke"], "brief": "\u8bba\u6587\u9488\u5bf9 SpeechLLM \u7528\u751f\u6210\u5f0f\u89e3\u7801\u505a\u60c5\u611f\u8bc6\u522b\u65f6\u5bb9\u6613\u8f93\u51fa\u975e\u6cd5\u6807\u7b7e\u3001\u504f\u5411\u9ad8\u9891\u7c7b\u522b\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u5728\u6700\u7ec8\u63d0\u793a token \u7684\u9690\u85cf\u72b6\u6001\u4e0a\u63a5\u4e00\u4e2a\u7ebf\u6027\u5206\u7c7b\u5934\uff0c\u5b9e\u73b0\u4e00\u6b21\u524d\u5411\u7684\u5224\u522b\u5f0f\u9884\u6d4b\u4e14\u4e0d\u6539\u52a8\u4e3b\u5e72\u6a21\u578b\u3002\u5728 IEMOCAP \u4e0a\uff0c\u8be5\u65b9\u6cd5\u5728\u4e24\u79cd SpeechLLM \u67b6\u6784\u4e2d\u63d0\u5347 Macro F1\u3001\u6d88\u9664\u6807\u7b7e\u5e7b\u89c9\uff0c\u5c24\u5176\u5728\u771f\u5b9e ASR \u8f6c\u5199\u573a\u666f\u589e\u76ca\u66f4\u660e\u663e\uff1b\u540c\u65f6\u5176\u53ef\u89e3\u91ca\u5206\u6790\u63ed\u793a\u4e86\u60c5\u611f\u65b9\u5411\u4e2d\u5b58\u5728\u6765\u81ea\u7f51\u7edc\u6587\u672c\u7684\u504f\u89c1\u5173\u8054\u3002", "categories": ["cs.CL", "cs.AI", "cs.SD", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20081", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u5927\u6a21\u578b", "\u60c5\u611f\u8bc6\u522b", "\u5224\u522b\u5f0f\u5fae\u8c03", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20081v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reading Emotions in the Token Space: Discriminative Adaptation of SpeechLLMs for Emotion Recognition", "tldr": "\u8bba\u6587\u9488\u5bf9 SpeechLLM \u7528\u751f\u6210\u5f0f\u89e3\u7801\u505a\u60c5\u611f\u8bc6\u522b\u65f6\u5bb9\u6613\u8f93\u51fa\u975e\u6cd5\u6807\u7b7e\u3001\u504f\u5411\u9ad8\u9891\u7c7b\u522b\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u5728\u6700\u7ec8\u63d0\u793a token \u7684\u9690\u85cf\u72b6\u6001\u4e0a\u63a5\u4e00\u4e2a\u7ebf\u6027\u5206\u7c7b\u5934\uff0c\u5b9e\u73b0\u4e00\u6b21\u524d\u5411\u7684\u5224\u522b\u5f0f\u9884\u6d4b\u4e14\u4e0d\u6539\u52a8\u4e3b\u5e72\u6a21\u578b\u3002\u5728 IEMOCAP \u4e0a\uff0c\u8be5\u65b9\u6cd5\u5728\u4e24\u79cd SpeechLLM \u67b6\u6784\u4e2d\u63d0\u5347 Macro F1\u3001\u6d88\u9664\u6807\u7b7e\u5e7b\u89c9\uff0c\u5c24\u5176\u5728\u771f\u5b9e ASR \u8f6c\u5199\u573a\u666f\u589e\u76ca\u66f4\u660e\u663e\uff1b\u540c\u65f6\u5176\u53ef\u89e3\u91ca\u5206\u6790\u63ed\u793a\u4e86\u60c5\u611f\u65b9\u5411\u4e2d\u5b58\u5728\u6765\u81ea\u7f51\u7edc\u6587\u672c\u7684\u504f\u89c1\u5173\u8054\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Interest in developing personalised language models is rapidly growing. While personalisation is often viewed as a mechanism to better serve diverse user needs, the effects of sustained interactions with personalised models on people\u0027s perception of and behaviour toward AI remain poorly understood. Most critically, downstream consequences outside the immediate human--AI interaction loop, such as effects on users\u0027 self-perceptions and interpersonal relationships, remain largely unexamined. In this study, we recruited 992 participants to complete daily advice-seeking interactions with language models over the course of five days, comparing outcomes from a non-personalised baseline against two personalisation approaches: memory-based (conditioned on prior conversational history) and survey-based (conditioned on information collected through a pre-study intake survey). We find that several changes in human-AI interaction over time are driven primarily by repeated exposure rather than personalisation itself. However, participants interacting with personalised models experienced differences in advice-seeking and information-sharing attitudes and behaviours: participants in the memory-based condition engaged in greater self-disclosure and rated the model as less creepy, while participants in the survey-based condition reported higher regret about having shared personal information with the AI. We conclude by highlighting the nuanced effects of different personalisation approaches on interaction outcomes, and discussing the implications of these findings for the responsible design and deployment of personalised AI systems.", "arxiv_id": "2609.20077", "arxiv_url": "https://arxiv.org/abs/2609.20077", "authors": ["Canfer Akbulut", "Justine Breuch", "Arianna Manzini", "Lujain Ibrahim", "Matija Franklin", "Roma Patel", "Iason Gabriel", "Kristian Lum", "Laura Weidinger"], "brief": "\u8be5\u7814\u7a76\u62db\u52df992\u540d\u53c2\u4e0e\u8005\uff0c\u57285\u5929\u5185\u6301\u7eed\u4e0e\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u6bcf\u65e5\u6c42\u5efa\u8bae\u4e92\u52a8\uff0c\u6bd4\u8f83\u975e\u4e2a\u6027\u5316\u3001\u57fa\u4e8e\u8bb0\u5fc6\u548c\u57fa\u4e8e\u95ee\u5377\u7684\u4e24\u79cd\u4e2a\u6027\u5316\u65b9\u5f0f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8bb8\u591a\u968f\u65f6\u95f4\u53d8\u5316\u7684\u4e92\u52a8\u6548\u679c\u4e3b\u8981\u6765\u81ea\u91cd\u590d\u63a5\u89e6\u800c\u975e\u4e2a\u6027\u5316\u672c\u8eab\uff1b\u4f46\u4e0d\u540c\u4e2a\u6027\u5316\u65b9\u5f0f\u4f1a\u5f71\u54cd\u7528\u6237\u7684\u4fe1\u606f\u5206\u4eab\u4e0e\u5efa\u8bae\u5bfb\u6c42\u6001\u5ea6\uff0c\u4f8b\u5982\u8bb0\u5fc6\u5f0f\u4e2a\u6027\u5316\u63d0\u5347\u81ea\u6211\u62ab\u9732\u4e14\u66f4\u5c11\u88ab\u8ba4\u4e3a\u201c\u8be1\u5f02\u201d\uff0c\u95ee\u5377\u5f0f\u4e2a\u6027\u5316\u5219\u5e26\u6765\u66f4\u9ad8\u7684\u4fe1\u606f\u5206\u4eab\u540e\u6094\u611f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20077", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u4e2a\u6027\u5316", "\u4eba\u673a\u4ea4\u4e92", "AI\u4f26\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20077v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tailored to you: longitudinal effects of personalising language models", "tldr": "\u8be5\u7814\u7a76\u62db\u52df992\u540d\u53c2\u4e0e\u8005\uff0c\u57285\u5929\u5185\u6301\u7eed\u4e0e\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u6bcf\u65e5\u6c42\u5efa\u8bae\u4e92\u52a8\uff0c\u6bd4\u8f83\u975e\u4e2a\u6027\u5316\u3001\u57fa\u4e8e\u8bb0\u5fc6\u548c\u57fa\u4e8e\u95ee\u5377\u7684\u4e24\u79cd\u4e2a\u6027\u5316\u65b9\u5f0f\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8bb8\u591a\u968f\u65f6\u95f4\u53d8\u5316\u7684\u4e92\u52a8\u6548\u679c\u4e3b\u8981\u6765\u81ea\u91cd\u590d\u63a5\u89e6\u800c\u975e\u4e2a\u6027\u5316\u672c\u8eab\uff1b\u4f46\u4e0d\u540c\u4e2a\u6027\u5316\u65b9\u5f0f\u4f1a\u5f71\u54cd\u7528\u6237\u7684\u4fe1\u606f\u5206\u4eab\u4e0e\u5efa\u8bae\u5bfb\u6c42\u6001\u5ea6\uff0c\u4f8b\u5982\u8bb0\u5fc6\u5f0f\u4e2a\u6027\u5316\u63d0\u5347\u81ea\u6211\u62ab\u9732\u4e14\u66f4\u5c11\u88ab\u8ba4\u4e3a\u201c\u8be1\u5f02\u201d\uff0c\u95ee\u5377\u5f0f\u4e2a\u6027\u5316\u5219\u5e26\u6765\u66f4\u9ad8\u7684\u4fe1\u606f\u5206\u4eab\u540e\u6094\u611f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper builds a theoretical bridge between the economic notion of marginal utility and two machine-learning constructs, matrix factorization and the Key--Value cache of transformer language models. The singular value spectrum of a rating matrix is shown to be a diminishing marginal utility schedule for latent factors, the eigenvalue spectrum of the projected covariance operator to be the marginal utility schedule of a model\u0027s learned representation, and cache eviction and low-rank cache compression to be instances of constrained utility maximization under a memory budget. The three collapse into a single allocation rule: retain the top dimensions whose eigenvalue exceeds the shadow price of the binding constraint. The framework is applied to the automated extraction of structured information from geo-mining documents, where it motivates a multi-pass inference protocol, a layer-wise TIES model merging procedure, and a selection policy combining extraction quality, localization drift and energy, scalarized with a Conditional Value-at-Risk term on drift. Two empirical contributions are reported. An 11.2-million-parameter hierarchical classifier, trained in about five minutes on a single GPU, reaches 90.0 per cent level-1 accuracy on a held-out test set from a 973-document uranium-exploration corpus, against 92.0 per cent for a proprietary model on a fifty-document human audit of the same corpus, at a latency of 2.62 ms per card against approximately 2,000 ms for the API and at negligible cost. A diagnostic of uniform-density TIES merging exposes a reproducible degenerate mode in which the merged model returns token-identical outputs across five geographically distinct districts while declaring high confidence; re-executing the merge under layer-wise calibrated densities removes that signature on the diagnostic sample. The full-scale extraction benchmark, including LoRA fine-tuning, is reported as projected rather than measured and remains an empirical extension of this work.", "arxiv_id": "2609.20068", "arxiv_url": "https://arxiv.org/abs/2609.20068", "authors": ["Caroline Gans Combe"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u628a\u8fb9\u9645\u6548\u7528\u3001\u77e9\u9635\u5206\u89e3\u8c31\u548c Transformer KV \u7f13\u5b58\u538b\u7f29\u7edf\u4e00\u8d77\u6765\u7684\u4fe1\u606f\u7ecf\u6d4e\u5b66\u6846\u67b6\uff0c\u5c06\u4fdd\u7559\u9ad8\u7279\u5f81\u503c\u7ef4\u5ea6\u89e3\u91ca\u4e3a\u5e26\u5185\u5b58\u7ea6\u675f\u7684\u6548\u7528\u6700\u5927\u5316\u3002\u8be5\u6846\u67b6\u7528\u4e8e\u5730\u8d28\u91c7\u77ff\u6587\u6863\u7ed3\u6784\u5316\u62bd\u53d6\uff0c\u5e76\u62a5\u544a\u4e86\u4e00\u4e2a\u5c0f\u578b\u5c42\u7ea7\u5206\u7c7b\u5668\u5728\u94c0\u52d8\u63a2\u8bed\u6599\u4e0a\u8fbe\u523090.0%\u4e00\u7ea7\u51c6\u786e\u7387\u3001\u4f4e\u5ef6\u8fdf\u4f4e\u6210\u672c\uff0c\u540c\u65f6\u53d1\u73b0\u5e76\u4fee\u6b63\u4e86TIES\u6a21\u578b\u5408\u5e76\u4e2d\u7684\u9000\u5316\u8f93\u51fa\u95ee\u9898\u3002\u90e8\u5206\u5927\u89c4\u6a21\u62bd\u53d6\u4e0eLoRA\u5b9e\u9a8c\u4ecd\u4e3a\u9884\u6d4b\u7ed3\u679c\uff0c\u5b9e\u8bc1\u652f\u6491\u6709\u9650\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20068", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["KV\u7f13\u5b58", "\u77e9\u9635\u5206\u89e3", "\u6a21\u578b\u5408\u5e76", "\u4fe1\u606f\u62bd\u53d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20068v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Marginal utility, matrix factorization, and the Key-Value (KV) cache: a unified information-economic framework for sovereign geo-mining inference", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u628a\u8fb9\u9645\u6548\u7528\u3001\u77e9\u9635\u5206\u89e3\u8c31\u548c Transformer KV \u7f13\u5b58\u538b\u7f29\u7edf\u4e00\u8d77\u6765\u7684\u4fe1\u606f\u7ecf\u6d4e\u5b66\u6846\u67b6\uff0c\u5c06\u4fdd\u7559\u9ad8\u7279\u5f81\u503c\u7ef4\u5ea6\u89e3\u91ca\u4e3a\u5e26\u5185\u5b58\u7ea6\u675f\u7684\u6548\u7528\u6700\u5927\u5316\u3002\u8be5\u6846\u67b6\u7528\u4e8e\u5730\u8d28\u91c7\u77ff\u6587\u6863\u7ed3\u6784\u5316\u62bd\u53d6\uff0c\u5e76\u62a5\u544a\u4e86\u4e00\u4e2a\u5c0f\u578b\u5c42\u7ea7\u5206\u7c7b\u5668\u5728\u94c0\u52d8\u63a2\u8bed\u6599\u4e0a\u8fbe\u523090.0%\u4e00\u7ea7\u51c6\u786e\u7387\u3001\u4f4e\u5ef6\u8fdf\u4f4e\u6210\u672c\uff0c\u540c\u65f6\u53d1\u73b0\u5e76\u4fee\u6b63\u4e86TIES\u6a21\u578b\u5408\u5e76\u4e2d\u7684\u9000\u5316\u8f93\u51fa\u95ee\u9898\u3002\u90e8\u5206\u5927\u89c4\u6a21\u62bd\u53d6\u4e0eLoRA\u5b9e\u9a8c\u4ecd\u4e3a\u9884\u6d4b\u7ed3\u679c\uff0c\u5b9e\u8bc1\u652f\u6491\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep learning models for multi-modal breast cancer diagnosis achieve high predictive accuracy but remain clinically unacceptable without actionable, counterfactual explanations. Attribution-based methods (LIME, SHAP) are categorically inapplicable to this purpose, as they generate no alternative instances and thus cannot be evaluated on counterfactual quality metrics. This investigation provides empirical evidence that FCA-Guided Counterfactual (FCA-CF) framework that uses a Formal Concept Analysis (FCA) concept lattice as a hard structural constraint on counterfactual search, operating over a multi-modal TCGA-BRCA dataset. We benchmark against four genuine counterfactual methods: Wachter-style CF, DiCE, FACE, and NICE, evaluated on 60 benign-predicted TCGA-BRCA instances. The FCA-CF framework achieves Validity = 1.0000 (100% of counterfactuals successfully flip the prediction), Sparsity = 2.37 features changed (best among all valid methods), and Proximity = 0.900 (normalised L2-based, matching NICE as joint best). The classifier achieves Accuracy = 0.980, F1 = 0.976, ROC-AUC = 0.9947. Ablation analysis confirms that the FCA lattice constraint is the primary sparsity driver (removing it increases sparsity by +40%, p \u003c 0.001, Cohen\u0027s d = 0.78), while Phase C greedy refinement accounts for the largest individual contribution (+113% sparsity increase when disabled, p \u003c 0.001, d = 5.01). FCA-guided counterfactual generation achieves a clinically important Pareto-dominant outcome; it is simultaneously the sparsest and among the most proximate of all valid methods, with perfect validity. The emergent sparsity property arising from lattice topology rather than numerical penalty terms constitutes a structurally novel contribution to the counterfactual explanation literature.", "arxiv_id": "2609.20067", "arxiv_url": "https://arxiv.org/abs/2609.20067", "authors": ["Abdullahi Isa", "Souley Boukari", "Muhammad Aliyu"], "brief": "\u672c\u6587\u63d0\u51fa FCA-CF \u6846\u67b6\uff0c\u7528\u5f62\u5f0f\u6982\u5ff5\u5206\u6790\u7684\u6982\u5ff5\u683c\u4f5c\u4e3a\u786c\u7ea6\u675f\uff0c\u4e3a\u591a\u6a21\u6001\u4e73\u817a\u764c\u8bca\u65ad\u6a21\u578b\u751f\u6210\u53ef\u884c\u52a8\u7684\u53cd\u4e8b\u5b9e\u89e3\u91ca\u3002\u5728 TCGA-BRCA \u6570\u636e\u4e0a\uff0c\u8be5\u65b9\u6cd5\u8fbe\u5230 100% \u6709\u6548\u6027\uff0c\u540c\u65f6\u4ee5\u5e73\u5747\u4ec5\u6539\u53d8 2.37 \u4e2a\u7279\u5f81\u53d6\u5f97\u6700\u4f73\u7a00\u758f\u6027\uff0c\u5e76\u4fdd\u6301\u8f83\u9ad8\u63a5\u8fd1\u5ea6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20067", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53cd\u4e8b\u5b9e\u89e3\u91ca", "\u591a\u6a21\u6001", "\u533b\u7597\u8bca\u65ad", "\u53ef\u89e3\u91caAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20067v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FCA-Guided Counterfactual Explanations for Multi-Modal Breast Cancer Diagnosis: A Framework Achieving Perfect Validity with Emergent Sparsity", "tldr": "\u672c\u6587\u63d0\u51fa FCA-CF \u6846\u67b6\uff0c\u7528\u5f62\u5f0f\u6982\u5ff5\u5206\u6790\u7684\u6982\u5ff5\u683c\u4f5c\u4e3a\u786c\u7ea6\u675f\uff0c\u4e3a\u591a\u6a21\u6001\u4e73\u817a\u764c\u8bca\u65ad\u6a21\u578b\u751f\u6210\u53ef\u884c\u52a8\u7684\u53cd\u4e8b\u5b9e\u89e3\u91ca\u3002\u5728 TCGA-BRCA \u6570\u636e\u4e0a\uff0c\u8be5\u65b9\u6cd5\u8fbe\u5230 100% \u6709\u6548\u6027\uff0c\u540c\u65f6\u4ee5\u5e73\u5747\u4ec5\u6539\u53d8 2.37 \u4e2a\u7279\u5f81\u53d6\u5f97\u6700\u4f73\u7a00\u758f\u6027\uff0c\u5e76\u4fdd\u6301\u8f83\u9ad8\u63a5\u8fd1\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Event cameras offer high temporal resolution and motion sensitivity for tiny UAV detection, yet distant targets generate sparse and fragmented events that are easily overwhelmed by clutter and ego-motion. Existing methods mainly rely on dense event representations or local sparse spatiotemporal modeling, resulting in redundant computation or fragmented modeling of motion continuity across distant asynchronous events. To address this limitation, we introduce serialized motion evidence accumulation, which treats motion continuity as an ordered evidence propagation process. Specifically, the same event stream is organized into locality-preserving spatiotemporal paths and chronology-preserving temporal paths through the latent complementary serializations. Based on this principle, we propose PointEvent, a lightweight event-wise state-space framework that alternates serialized scans across the complementary orders, progressively consolidating fragmented motion evidence beyond fixed local neighborhoods. A high-resolution event branch preserves fine-grained target responses, while compact context modulation suppresses interference. Experiments demonstrate that PointEvent achieves SOTA with the fewest parameters and fastest measured inference among the compared methods. Code: https://github.com/wzz-z/PointEvent", "arxiv_id": "2609.20066", "arxiv_url": "https://arxiv.org/abs/2609.20066", "authors": ["Zongze Wu", "Baofeng Jia", "Weiqi Yan", "Jingyuan Zhang", "Yu Zang", "Xiaoyu Chen", "Jing Han"], "brief": "\u672c\u6587\u63d0\u51fa PointEvent\uff0c\u7528\u201c\u5e8f\u5217\u5316\u8fd0\u52a8\u8bc1\u636e\u7d2f\u79ef\u201d\u91cd\u65b0\u5efa\u6a21\u4e8b\u4ef6\u76f8\u673a\u4e2d\u7684\u8fdc\u8ddd\u79bb\u5fae\u5c0f\u76ee\u6807\u68c0\u6d4b\uff0c\u5c06\u7a00\u758f\u5f02\u6b65\u4e8b\u4ef6\u6309\u4e92\u8865\u7684\u65f6\u7a7a\u8def\u5f84\u4e0e\u65f6\u95f4\u8def\u5f84\u8fdb\u884c\u6709\u5e8f\u4f20\u64ad\u3002\u8be5\u8f7b\u91cf\u7ea7\u4e8b\u4ef6\u7ea7\u72b6\u6001\u7a7a\u95f4\u6846\u67b6\u80fd\u6574\u5408\u8de8\u5c40\u90e8\u90bb\u57df\u7684\u788e\u7247\u5316\u8fd0\u52a8\u7ebf\u7d22\uff0c\u5e76\u901a\u8fc7\u9ad8\u5206\u8fa8\u7387\u5206\u652f\u4e0e\u4e0a\u4e0b\u6587\u8c03\u5236\u63d0\u5347\u76ee\u6807\u54cd\u5e94\u3001\u6291\u5236\u5e72\u6270\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u53c2\u6570\u91cf\u6700\u5c11\u3001\u63a8\u7406\u6700\u5feb\u7684\u540c\u65f6\u8fbe\u5230 SOTA\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20066", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e8b\u4ef6\u76f8\u673a", "\u5c0f\u76ee\u6807\u68c0\u6d4b", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "\u65e0\u4eba\u673a\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20066v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PointEvent: Rethinking Event-based Tiny Object Detection via Serialized Motion Evidence Accumulation", "tldr": "\u672c\u6587\u63d0\u51fa PointEvent\uff0c\u7528\u201c\u5e8f\u5217\u5316\u8fd0\u52a8\u8bc1\u636e\u7d2f\u79ef\u201d\u91cd\u65b0\u5efa\u6a21\u4e8b\u4ef6\u76f8\u673a\u4e2d\u7684\u8fdc\u8ddd\u79bb\u5fae\u5c0f\u76ee\u6807\u68c0\u6d4b\uff0c\u5c06\u7a00\u758f\u5f02\u6b65\u4e8b\u4ef6\u6309\u4e92\u8865\u7684\u65f6\u7a7a\u8def\u5f84\u4e0e\u65f6\u95f4\u8def\u5f84\u8fdb\u884c\u6709\u5e8f\u4f20\u64ad\u3002\u8be5\u8f7b\u91cf\u7ea7\u4e8b\u4ef6\u7ea7\u72b6\u6001\u7a7a\u95f4\u6846\u67b6\u80fd\u6574\u5408\u8de8\u5c40\u90e8\u90bb\u57df\u7684\u788e\u7247\u5316\u8fd0\u52a8\u7ebf\u7d22\uff0c\u5e76\u901a\u8fc7\u9ad8\u5206\u8fa8\u7387\u5206\u652f\u4e0e\u4e0a\u4e0b\u6587\u8c03\u5236\u63d0\u5347\u76ee\u6807\u54cd\u5e94\u3001\u6291\u5236\u5e72\u6270\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u53c2\u6570\u91cf\u6700\u5c11\u3001\u63a8\u7406\u6700\u5feb\u7684\u540c\u65f6\u8fbe\u5230 SOTA\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The rapid advancement of speech synthesis and voice conversion technologies has made audio deepfakes increasingly realistic, posing serious security risks in practical applications. While existing detection methods achieve strong performance under controlled conditions, they often fail to generalize under real-world perturbations and corruptions. In this paper, we propose ROGUE, a framework that dynamically constructs robust detection workflows by orchestrating multiple detection tools. ROGUE formulates workflow generation as a sequential decision-making problem and introduces a dual-agent paradigm, where a perturbation agent generates audio perturbations and a policy agent learns to select and execute detection tools under perturbed conditions. Through adversarial learning, ROGUE enables perturbation-aware tool selection, adaptive execution strategies, and improved robustness to distribution shifts. Extensive experiments across multiple datasets and real-world corruptions demonstrate that ROGUE consistently outperforms strong baselines in both robustness and generalization. Our results highlight the effectiveness of adversarially optimized workflow generation for building reliable audio deepfake detection systems in real-world deployment settings.", "arxiv_id": "2609.20063", "arxiv_url": "https://arxiv.org/abs/2609.20063", "authors": ["Xiang Li", "Pin-Yu Chen", "Wenqi Wei"], "brief": "\u672c\u6587\u63d0\u51fa ROGUE\uff0c\u5c06\u97f3\u9891\u6df1\u4f2a\u68c0\u6d4b\u6d41\u7a0b\u751f\u6210\u5efa\u6a21\u4e3a\u5e8f\u5217\u51b3\u7b56\u95ee\u9898\uff0c\u901a\u8fc7\u6270\u52a8\u667a\u80fd\u4f53\u548c\u7b56\u7565\u667a\u80fd\u4f53\u7684\u5bf9\u6297\u5b66\u4e60\u6765\u52a8\u6001\u7f16\u6392\u591a\u4e2a\u68c0\u6d4b\u5de5\u5177\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u6570\u636e\u96c6\u548c\u771f\u5b9e\u6270\u52a8\u4e0b\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u5177\u5907\u66f4\u597d\u7684\u9c81\u68d2\u6027\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.SD", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.20063", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u97f3\u9891\u6df1\u4f2a\u68c0\u6d4b", "\u5bf9\u6297\u5b66\u4e60", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.20063v1", "published_at": "2026-09-17", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Robust Workflow Generation via Adversarial Learning for Audio Deepfake Detection", "tldr": "\u672c\u6587\u63d0\u51fa ROGUE\uff0c\u5c06\u97f3\u9891\u6df1\u4f2a\u68c0\u6d4b\u6d41\u7a0b\u751f\u6210\u5efa\u6a21\u4e3a\u5e8f\u5217\u51b3\u7b56\u95ee\u9898\uff0c\u901a\u8fc7\u6270\u52a8\u667a\u80fd\u4f53\u548c\u7b56\u7565\u667a\u80fd\u4f53\u7684\u5bf9\u6297\u5b66\u4e60\u6765\u52a8\u6001\u7f16\u6392\u591a\u4e2a\u68c0\u6d4b\u5de5\u5177\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u6570\u636e\u96c6\u548c\u771f\u5b9e\u6270\u52a8\u4e0b\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u5177\u5907\u66f4\u597d\u7684\u9c81\u68d2\u6027\u4e0e\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI systems can strengthen democracy by supporting deliberation at scale by addressing cognitive, social, platform-design, and market-driven frictions, while preserving human agency. Unlike proposals such as liquid democracy that restructure representation through vote delegation, in this position paper, we argue that AI-assisted deliberation offers a more promising path by lowering barriers to meaningful engagement without substituting machine judgment for human choice. Drawing on evidence from online deliberation platforms and experimental research, we identify four guiding principles: preserving agency and autonomy, encouraging mutual respect, promoting equality and inclusiveness, and augmenting rather than substituting active citizenship. We also address critical challenges, including alignment, sycophancy, training bias, and over-reliance on AI systems. We call on the machine learning community to develop deliberation-focused AI systems evaluated not on engagement metrics but on their capacity to facilitate informed, representative, and friction-robust discourse.", "arxiv_id": "2609.20059", "arxiv_url": "https://arxiv.org/abs/2609.20059", "authors": ["Jos\u00e9 Ram\u00f3n Enr\u00edquez", "Jiaxin Pei", "Alex Pentland"], "brief": "\u672c\u6587\u4e3b\u5f20\u7528 AI \u5728\u5927\u89c4\u6a21\u6c11\u4e3b\u534f\u5546\u4e2d\u964d\u4f4e\u8ba4\u77e5\u3001\u793e\u4ea4\u3001\u5e73\u53f0\u8bbe\u8ba1\u548c\u5e02\u573a\u673a\u5236\u5e26\u6765\u7684\u53c2\u4e0e\u6469\u64e6\uff0c\u540c\u65f6\u575a\
