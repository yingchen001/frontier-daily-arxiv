asons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (38\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04250.png", "title": "Motion-Omni: End-to-End Joint Speech and Full-Body Motion for Spoken Dialogue", "tldr": "\u7aef\u5230\u7aef\u751f\u6210\u8bed\u97f3\u5bf9\u8bdd\u4e0e\u5168\u8eab\u52a8\u4f5c", "upvotes": 38, "what_it_is": "\u8bba\u6587\u63d0\u51fa Motion-Omni\uff0c\u8ba9\u53e3\u8bed\u5bf9\u8bdd\u6a21\u578b\u5728\u751f\u6210\u8bed\u97f3\u7684\u540c\u65f6\uff0c\u76f4\u63a5\u4ece\u8bed\u97f3\u751f\u6210\u9690\u72b6\u6001\u8f93\u51fa\u9762\u90e8\u8868\u60c5\u3001\u624b\u90e8\u3001\u4e0a\u534a\u8eab\u548c\u4e0b\u534a\u8eab\u52a8\u4f5c\u3002\u5b83\u901a\u8fc7\u8054\u5408\u8bad\u7ec3 LLM\u3001Speech Generator \u4e0e Motion Generator\uff0c\u5b9e\u73b0\u8bed\u97f3\u5185\u5bb9\u3001\u58f0\u97f3\u548c\u5168\u8eab\u52a8\u4f5c\u7684\u540c\u6b65\u4f18\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6253\u7834\u4e86\u201c\u5148\u751f\u6210\u8bed\u97f3\u3001\u518d\u751f\u6210\u52a8\u4f5c\u201d\u7684\u7ea7\u8054\u8303\u5f0f\uff0c\u5b9e\u73b0\u5f00\u653e\u5f0f\u53e3\u8bed\u5bf9\u8bdd\u4e2d\u8bed\u97f3\u4e0e\u5168\u8eab\u52a8\u4f5c\u7684\u7aef\u5230\u7aef\u8054\u5408\u751f\u6210\uff0c\u517c\u987e\u5b9e\u65f6\u6027\u3001\u52a8\u4f5c\u540c\u6b65\u548c\u5bf9\u8bdd\u80fd\u529b\uff0c\u5e76\u63d0\u4f9b\u4e86\u516c\u5f00\u8bc4\u6d4b\u534f\u8bae\u4e0e\u6570\u636e\u8d44\u6e90\u3002"}, {"abstract": "Recent advances in automatic rigging now deliver animation-ready 3D assets at scale, yet generating the motion to drive them remains a bottleneck. Existing learned animators are topology-constrained: they rely on category-specific templates or require per-skeleton fine-tuning and reference motions at inference. We present UniMate, a unified foundation model that synthesizes articulated motion for arbitrary skeletons from a rigged 3D asset and a text prompt, with no test-time optimization or per-skeleton retraining. UniMate introduces a topology-aware diffusion transformer, which integrates skeletal topology into attention via three mechanisms: (1) a graph-aware attention bias from pairwise joint relations and geodesic distances; (2) a spectral rotary position embedding generalizing RoPE to arbitrary kinematic trees via the graph Laplacian; and (3) a global topological conditioner attention-pooled from the rest-pose skeleton. We also curate UniML3D, 13,006 motion sequences spanning bipedal, quadrupedal, avian, marine, insectoid, serpentine, and articulated rigid objects with unified canonicalization and text pairing. Trained on this dataset, UniMate outperforms state-of-the-art baselines in quality, generalization, and efficiency, and supports zero-shot cross-topology transfer, in-betweening, expansion, and text-guided editing. Our project page is available at https://linzhanmou.com/unimate/.", "arxiv_id": "2609.05415", "arxiv_url": "https://arxiv.org/abs/2609.05415", "authors": ["Linzhan Mou", "Jiahui Lei", "Zhiyang Dou", "Chenyue Cai", "Chaoyue Song", "Adam Finkelstein", "Szymon Rusinkiewicz"], "brief": "UniMate \u662f\u4e00\u4e2a\u9762\u5411\u591a\u6837\u5316 3D \u9aa8\u67b6\u7684\u7edf\u4e00\u52a8\u753b\u751f\u6210\u57fa\u7840\u6a21\u578b\uff0c\u53ef\u6839\u636e\u7ed1\u5b9a\u597d\u7684 3D \u8d44\u4ea7\u548c\u6587\u672c\u63d0\u793a\u76f4\u63a5\u5408\u6210\u5173\u8282\u8fd0\u52a8\u3002\u5b83\u65e0\u9700\u6d4b\u8bd5\u65f6\u4f18\u5316\u3001\u9010\u9aa8\u67b6\u5fae\u8c03\u6216\u53c2\u8003\u52a8\u4f5c\uff0c\u652f\u6301\u8de8\u62d3\u6251\u96f6\u6837\u672c\u6cdb\u5316\u3002", "categories": ["cs.CV", "cs.GR", "cs.LG"], "github_repo": "https://github.com/Friedrich-M/UniMate", "github_stars": 56, "hf_url": "https://huggingface.co/papers/2609.05415", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u62d3\u6251\u611f\u77e5\u6269\u6563 Transformer\uff0c\u5c06\u9aa8\u67b6\u62d3\u6251\u901a\u8fc7\u56fe\u6ce8\u610f\u529b\u504f\u7f6e\u3001\u8c31\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801\u548c\u5168\u5c40\u62d3\u6251\u6761\u4ef6\u5668\u6ce8\u5165\u6a21\u578b\u3002", "\u6784\u5efa UniML3D \u6570\u636e\u96c6\uff0c\u5305\u542b 13,006 \u6bb5\u52a8\u4f5c\uff0c\u8986\u76d6\u53cc\u8db3\u3001\u56db\u8db3\u3001\u9e1f\u7c7b\u3001\u6d77\u6d0b\u751f\u7269\u3001\u6606\u866b\u3001\u86c7\u5f62\u4ee5\u53ca\u521a\u4f53\u94f0\u63a5\u5bf9\u8c61\u7b49\u591a\u7c7b\u9aa8\u67b6\u3002", "\u5728\u52a8\u4f5c\u8d28\u91cf\u3001\u6cdb\u5316\u80fd\u529b\u548c\u6548\u7387\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u652f\u6301\u8de8\u62d3\u6251\u8fc1\u79fb\u3001\u52a8\u4f5c\u8865\u95f4\u3001\u6269\u5c55\u548c\u6587\u672c\u5f15\u5bfc\u7f16\u8f91\u3002"], "keywords": ["\u52a8\u753b\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Princeton University", "pdf_url": "https://arxiv.org/pdf/2609.05415v1", "published_at": "2026-09-04", "score": 0.509, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Princeton", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05415.png", "title": "UniMate: One Unified Model to Animate Diverse Skeletons", "tldr": "\u7edf\u4e00\u6a21\u578b\u4e3a\u4efb\u610f\u9aa8\u67b6\u751f\u6210\u6587\u672c\u9a71\u52a8\u52a8\u753b", "upvotes": 12, "what_it_is": "UniMate \u662f\u4e00\u4e2a\u9762\u5411\u591a\u6837\u5316 3D \u9aa8\u67b6\u7684\u7edf\u4e00\u52a8\u753b\u751f\u6210\u57fa\u7840\u6a21\u578b\uff0c\u53ef\u6839\u636e\u7ed1\u5b9a\u597d\u7684 3D \u8d44\u4ea7\u548c\u6587\u672c\u63d0\u793a\u76f4\u63a5\u5408\u6210\u5173\u8282\u8fd0\u52a8\u3002\u5b83\u65e0\u9700\u6d4b\u8bd5\u65f6\u4f18\u5316\u3001\u9010\u9aa8\u67b6\u5fae\u8c03\u6216\u53c2\u8003\u52a8\u4f5c\uff0c\u652f\u6301\u8de8\u62d3\u6251\u96f6\u6837\u672c\u6cdb\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7a81\u7834\u4e86\u73b0\u6709\u52a8\u753b\u751f\u6210\u6a21\u578b\u5bf9\u56fa\u5b9a\u9aa8\u67b6\u6a21\u677f\u6216\u9010\u9aa8\u67b6\u9002\u914d\u7684\u4f9d\u8d56\uff0c\u4f7f\u4efb\u610f\u62d3\u6251\u9aa8\u67b6\u7684\u6587\u672c\u9a71\u52a8\u52a8\u753b\u751f\u6210\u66f4\u63a5\u8fd1\u901a\u7528\u5316\u4e0e\u89c4\u6a21\u5316\u5e94\u7528\uff0c\u5bf9\u6e38\u620f\u3001\u5f71\u89c6\u548c 3D \u5185\u5bb9\u751f\u4ea7\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Command-line coding agents (e.g., Claude Code, Gemini CLI) can already read and write files and sustain long sessions, yet end-to-end research still fragments across chat tools, IDEs, terminals, and writing environments, and the decisions that make it auditable are rarely preserved. We present Dr. Claw, an open-source workspace that wraps existing coding-agent executors in a controllable and auditable human-in-the-loop workflow rather than introducing another autonomous agent. Persistent state objects, a reusable skill library, and multi-executor coordination link human decisions to AI execution, turning planning, execution, and writing into one traceable, recoverable loop. We demonstrate Dr. Claw through an interactive three-view scenario and a failure-recovery walkthrough, and evaluate it against a bare command-line agent sharing the same backend executor, so the comparison contrasts the whole orchestration layer (task graph, state objects, and skill library) with the agent it wraps. Holding the executor fixed, Dr. Claw scores higher on research completeness while persisting an auditable, recoverable process trail. Demo access: repository https://github.com/OpenLAIR/dr-claw, released under AGPL-3.0 with GPL-3.0 upstream components.", "arxiv_id": "2609.00365", "arxiv_url": "https://arxiv.org/abs/2609.00365", "authors": ["Dingjie Song", "Hanrong Zhang", "Dawei Liu", "Yixin Liu", "Zongxia Li", "Zhengqing Yuan", "Siqi Zhang", "Henry Peng Zou", "Zhiling Yan", "Yuxuan Zhang", "Yanfang Ye", "Philip S. Yu", "Lichao Sun"], "brief": "Dr. Claw \u662f\u4e00\u4e2a\u5f00\u6e90 AI \u79d1\u7814\u5de5\u4f5c\u533a\uff0c\u7528\u53ef\u63a7\u3001\u53ef\u5ba1\u8ba1\u7684\u4eba\u673a\u534f\u540c\u6d41\u7a0b\u5c01\u88c5\u73b0\u6709\u547d\u4ee4\u884c\u7f16\u7801\u667a\u80fd\u4f53\u3002\u5b83\u901a\u8fc7\u6301\u4e45\u72b6\u6001\u5bf9\u8c61\u3001\u6280\u80fd\u5e93\u548c\u591a\u6267\u884c\u5668\u534f\u8c03\uff0c\u628a\u89c4\u5212\u3001\u6267\u884c\u4e0e\u5199\u4f5c\u6574\u5408\u6210\u53ef\u8ffd\u8e2a\u3001\u53ef\u6062\u590d\u7684\u95ed\u73af\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV", "cs.LG"], "github_repo": "https://github.com/OpenLAIR/dr-claw", "github_stars": 1058, "hf_url": "https://huggingface.co/papers/2609.00365", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4e0d\u91cd\u65b0\u53d1\u660e\u81ea\u4e3b\u667a\u80fd\u4f53\uff0c\u800c\u662f\u7f16\u6392 Claude Code\u3001Gemini CLI \u7b49\u73b0\u6709\u547d\u4ee4\u884c\u6267\u884c\u5668", "\u5f15\u5165\u4efb\u52a1\u56fe\u3001\u6301\u4e45\u72b6\u6001\u5bf9\u8c61\u548c\u53ef\u590d\u7528\u6280\u80fd\u5e93\uff0c\u4fdd\u7559\u4eba\u7c7b\u51b3\u7b56\u4e0e AI \u6267\u884c\u8f68\u8ff9", "\u5728\u76f8\u540c\u540e\u7aef\u6267\u884c\u5668\u4e0b\uff0c\u76f8\u6bd4\u88f8\u547d\u4ee4\u884c\u667a\u80fd\u4f53\u63d0\u5347\u7814\u7a76\u5b8c\u6574\u6027\uff0c\u5e76\u652f\u6301\u5931\u8d25\u6062\u590d"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u7814\u81ea\u52a8\u5316", "\u4eba\u673a\u534f\u540c", "\u4ee3\u7801\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00365v1", "published_at": "2026-08-31", "score": 0.455, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00365.png", "title": "Dr. Claw: An AI Scientist Workspace for Vibe Research", "tldr": "\u9762\u5411\u79d1\u7814\u6d41\u7a0b\u7684\u53ef\u5ba1\u8ba1AI\u5de5\u4f5c\u53f0", "upvotes": 10, "what_it_is": "Dr. Claw \u662f\u4e00\u4e2a\u5f00\u6e90 AI \u79d1\u7814\u5de5\u4f5c\u533a\uff0c\u7528\u53ef\u63a7\u3001\u53ef\u5ba1\u8ba1\u7684\u4eba\u673a\u534f\u540c\u6d41\u7a0b\u5c01\u88c5\u73b0\u6709\u547d\u4ee4\u884c\u7f16\u7801\u667a\u80fd\u4f53\u3002\u5b83\u901a\u8fc7\u6301\u4e45\u72b6\u6001\u5bf9\u8c61\u3001\u6280\u80fd\u5e93\u548c\u591a\u6267\u884c\u5668\u534f\u8c03\uff0c\u628a\u89c4\u5212\u3001\u6267\u884c\u4e0e\u5199\u4f5c\u6574\u5408\u6210\u53ef\u8ffd\u8e2a\u3001\u53ef\u6062\u590d\u7684\u95ed\u73af\u3002", "why_notable": "\u8bba\u6587\u5173\u6ce8\u7aef\u5230\u7aef\u79d1\u7814\u4e2d\u5de5\u5177\u5272\u88c2\u3001\u8fc7\u7a0b\u4e0d\u53ef\u5ba1\u8ba1\u7684\u95ee\u9898\uff0c\u4e3a\u201cAI Scientist\u201d\u63d0\u4f9b\u4e86\u66f4\u5b9e\u7528\u7684\u5de5\u4f5c\u6d41\u57fa\u7840\u8bbe\u65bd\uff0c\u5f3a\u8c03\u53ef\u63a7\u6027\u3001\u53ef\u6062\u590d\u6027\u4e0e\u4eba\u673a\u534f\u540c\uff0c\u800c\u975e\u5b8c\u5168\u81ea\u6cbb\u3002"}, {"abstract": "Recent progress in multimodal large language models (MLLMs) has fueled significant enthusiasm in their potential to act as autonomous agents for real-world tasks. However, scenarios requiring agents to fulfill users\u0027 complex, structured requirements remain largely underexplored. In this work, we examine reasoning tasks under three distinct requirement scenarios: (i) Must-have requirements uniquely determine a unique feasible solution; (ii) Multiple answers satisfy the must-have requirements and are prioritized via the nice-to-have requirements; and (iii) No candidate solution satisfies the must-have requirements, in which case the agent should abstain from generating a response. We evaluate state-of-the-art MLLMs on 3,649 carefully constructed problems that reflect realistic service scenarios, including e-commerce, booking, and map-based or ride-hailing. Our evaluation reveals that existing MLLMs exhibit catastrophic failures in all scenarios. They frequently misinterpret task requirements, violate must-have requirements, and produce invalid solutions. To address this critical gap, we propose First Things First Reinforcement Learning FTF-rl that explicitly optimizes reasoning over multi-priority user requirements. Experimental results show that our method substantially improves the task success rate compared to strong baselines. Moreover, FTF-rl yields general effectiveness on popular logical and mathematical reasoning tasks, including LogicVista, MathVision, and InfoQA. Our findings suggest that enhancing requirement-aware reasoning capability provides a simple yet effective pathway to improve generalization of MLLM agents. Code and dataset are available at https://github.com/claire62/FTF-RL.", "arxiv_id": "2609.05224", "arxiv_url": "https://arxiv.org/abs/2609.05224", "authors": ["Tianjie Ju", "Xinyue Xu", "Wanxuan Sun", "Lingxiao Diao", "Gongshen Liu", "Zhuosheng Zhang", "Cheng Yang"], "brief": "\u8bba\u6587\u7814\u7a76\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u590d\u6742\u7ed3\u6784\u5316\u7528\u6237\u9700\u6c42\u4e0b\u7684\u63a8\u7406\u80fd\u529b\uff0c\u8986\u76d6\u786c\u6027\u9700\u6c42\u552f\u4e00\u89e3\u3001\u591a\u89e3\u9700\u6309\u504f\u597d\u6392\u5e8f\u3001\u65e0\u53ef\u884c\u89e3\u9700\u62d2\u7b54\u4e09\u7c7b\u573a\u666f\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b\u7535\u5546\u3001\u9884\u8ba2\u3001\u5730\u56fe/\u7f51\u7ea6\u8f66\u7b49\u670d\u52a1\u573a\u666f\u76843649\u9898\u8bc4\u6d4b\u96c6\uff0c\u5e76\u63d0\u51faFTF-rl\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u663e\u5f0f\u4f18\u5316\u591a\u4f18\u5148\u7ea7\u9700\u6c42\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05224", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b\u53d1\u73b0\u73b0\u6709MLLM\u5728\u4e09\u7c7b\u9700\u6c42\u573a\u666f\u4e2d\u666e\u904d\u5931\u6548\uff0c\u5e38\u8bef\u89e3\u8981\u6c42\u3001\u8fdd\u53cdmust-have\u786c\u7ea6\u675f\u6216\u8f93\u51fa\u65e0\u6548\u89e3", "FTF-rl\u5f3a\u8c03\u201cFirst Things First\u201d\uff0c\u8bad\u7ec3\u6a21\u578b\u4f18\u5148\u6ee1\u8db3\u786c\u6027\u9700\u6c42\uff0c\u518d\u8003\u8651nice-to-have\u504f\u597d\uff0c\u5e76\u5728\u65e0\u53ef\u884c\u89e3\u65f6\u5b66\u4f1a\u62d2\u7b54", "\u65b9\u6cd5\u4e0d\u4ec5\u63d0\u5347\u670d\u52a1\u573a\u666f\u4efb\u52a1\u6210\u529f\u7387\uff0c\u4e5f\u5728LogicVista\u3001MathVision\u3001InfoQA\u7b49\u903b\u8f91\u4e0e\u6570\u5b66\u63a8\u7406\u4efb\u52a1\u4e0a\u5c55\u73b0\u6cdb\u5316\u6536\u76ca"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05224v1", "published_at": "2026-09-04", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "First Things First: Teaching LLM-Based Agents to Prioritize Must-Haves before Nice-to-Haves", "tldr": "\u8ba9\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5148\u6ee1\u8db3\u786c\u7ea6\u675f\u518d\u4f18\u5316\u504f\u597d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u590d\u6742\u7ed3\u6784\u5316\u7528\u6237\u9700\u6c42\u4e0b\u7684\u63a8\u7406\u80fd\u529b\uff0c\u8986\u76d6\u786c\u6027\u9700\u6c42\u552f\u4e00\u89e3\u3001\u591a\u89e3\u9700\u6309\u504f\u597d\u6392\u5e8f\u3001\u65e0\u53ef\u884c\u89e3\u9700\u62d2\u7b54\u4e09\u7c7b\u573a\u666f\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b\u7535\u5546\u3001\u9884\u8ba2\u3001\u5730\u56fe/\u7f51\u7ea6\u8f66\u7b49\u670d\u52a1\u573a\u666f\u76843649\u9898\u8bc4\u6d4b\u96c6\uff0c\u5e76\u63d0\u51faFTF-rl\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u663e\u5f0f\u4f18\u5316\u591a\u4f18\u5148\u7ea7\u9700\u6c42\u63a8\u7406\u3002", "why_notable": "\u771f\u5b9e\u667a\u80fd\u4f53\u4efb\u52a1\u5f80\u5f80\u5305\u542b\u4e0d\u53ef\u8fdd\u53cd\u7684\u786c\u7ea6\u675f\u548c\u53ef\u4f18\u5316\u7684\u8f6f\u504f\u597d\uff0c\u8be5\u5de5\u4f5c\u7cfb\u7edf\u63ed\u793a\u4e86\u73b0\u6709MLLM\u5728\u9700\u6c42\u4f18\u5148\u7ea7\u63a8\u7406\u4e0a\u7684\u77ed\u677f\uff0c\u5e76\u7ed9\u51fa\u7b80\u5355\u6709\u6548\u7684\u5f3a\u5316\u5b66\u4e60\u6539\u8fdb\u8def\u5f84\uff0c\u5bf9\u7535\u5546\u3001\u51fa\u884c\u3001\u9884\u8ba2\u7b49\u5b9e\u9645\u573a\u666f\u4e2d\u7684\u53ef\u9760\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM agents are rapidly becoming production software, deployed to handle customer service, adjudicate disputes, and operate internal systems. Notably, the work of building them is increasingly handed to coding agents, yet existing benchmarks say little about whether an AI system can deliver one under the conditions of a real client engagement. We introduce $\u03c4^\u03c4$-bench (pronounced hyper-tau-bench), a benchmark that makes agent construction the task. A developer agent is given the records a business actually keeps, a client who holds requirements, a production API that operations must run through, a codebase to inherit, and limits on serving cost and models: the same starting point a real engagement provides. From these it must deliver a complete customer-service agent, scored by deploying that agent against held-out simulated users. Across 53 tasks spanning four domains, the strongest configuration, Claude Opus 5 under Claude Code, passes just 23.9% of evaluation simulations. Meanwhile, an expert-authored reference ceiling scores 82.2%. The failures mirror ones human agent developers see: models issue shallow queries in place of deep comprehension of the records, communicate almost nothing to the client, and experiment too little with agent architecture and serving spend, shipping the first design that runs. We aim for $\u03c4^\u03c4$-bench to turn the work of cooperative agent building into a measurable target for coding agents.", "arxiv_id": "2609.04611", "arxiv_url": "https://arxiv.org/abs/2609.04611", "authors": ["Quan Shi", "Keshav Dhandhania", "Karthik Narasimhan", "Victor Barres"], "brief": "\u8bba\u6587\u63d0\u51fa \u03c4^\u03c4-Bench\uff0c\u4e00\u4e2a\u5c06\u201c\u6784\u5efa\u667a\u80fd\u4f53\u672c\u8eab\u201d\u4f5c\u4e3a\u4efb\u52a1\u7684\u771f\u5b9e\u5316\u57fa\u51c6\u3002\u5f00\u53d1\u8005\u667a\u80fd\u4f53\u9700\u8981\u57fa\u4e8e\u4f01\u4e1a\u8bb0\u5f55\u3001\u5ba2\u6237\u9700\u6c42\u3001\u751f\u4ea7 API\u3001\u65e2\u6709\u4ee3\u7801\u5e93\u548c\u6210\u672c/\u6a21\u578b\u9650\u5236\uff0c\u4ea4\u4ed8\u53ef\u90e8\u7f72\u7684\u5ba2\u670d\u667a\u80fd\u4f53\uff0c\u5e76\u901a\u8fc7\u9690\u85cf\u6a21\u62df\u7528\u6237\u8bc4\u6d4b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/sierra-research/hyper-tau-bench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.04611", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d64\u4e2a\u4e1a\u52a1\u9886\u57df\u517153\u4e2a\u4efb\u52a1\uff0c\u6a21\u62df\u771f\u5b9e\u5ba2\u6237\u4ea4\u4ed8\u573a\u666f\u800c\u975e\u5355\u6b65\u4ee3\u7801\u6216\u95ee\u7b54\u4efb\u52a1", "\u6700\u5f3a\u914d\u7f6e Claude Opus 5 + Claude Code \u4ec5\u901a\u8fc723.9%\u7684\u8bc4\u6d4b\u6a21\u62df\uff0c\u663e\u8457\u4f4e\u4e8e\u4e13\u5bb6\u53c2\u8003\u4e0a\u965082.2%", "\u5931\u8d25\u4e3b\u8981\u6765\u81ea\u8bb0\u5f55\u7406\u89e3\u6d45\u3001\u4e0e\u5ba2\u6237\u6c9f\u901a\u4e0d\u8db3\u3001\u67b6\u6784\u4e0e\u63a8\u7406\u6210\u672c\u63a2\u7d22\u4e0d\u5145\u5206\u7b49\u771f\u5b9e\u5f00\u53d1\u75db\u70b9"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u5ba2\u6237\u670d\u52a1"], "num_comments": 2, "on_hf": true, "organization": "Sierra Technologies, Inc.", "pdf_url": "https://arxiv.org/pdf/2609.04611v1", "published_at": "2026-09-04", "score": 0.413, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04611.png", "title": "$\u03c4^\u03c4$-Bench: An Environment for End-To-End, Realistic Agent Construction", "tldr": "\u8861\u91cf\u7f16\u7801\u667a\u80fd\u4f53\u80fd\u5426\u7aef\u5230\u7aef\u6784\u5efa\u5ba2\u670d\u667a\u80fd\u4f53", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa \u03c4^\u03c4-Bench\uff0c\u4e00\u4e2a\u5c06\u201c\u6784\u5efa\u667a\u80fd\u4f53\u672c\u8eab\u201d\u4f5c\u4e3a\u4efb\u52a1\u7684\u771f\u5b9e\u5316\u57fa\u51c6\u3002\u5f00\u53d1\u8005\u667a\u80fd\u4f53\u9700\u8981\u57fa\u4e8e\u4f01\u4e1a\u8bb0\u5f55\u3001\u5ba2\u6237\u9700\u6c42\u3001\u751f\u4ea7 API\u3001\u65e2\u6709\u4ee3\u7801\u5e93\u548c\u6210\u672c/\u6a21\u578b\u9650\u5236\uff0c\u4ea4\u4ed8\u53ef\u90e8\u7f72\u7684\u5ba2\u670d\u667a\u80fd\u4f53\uff0c\u5e76\u901a\u8fc7\u9690\u85cf\u6a21\u62df\u7528\u6237\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u628a\u7f16\u7801\u667a\u80fd\u4f53\u4ece\u201c\u5199\u4ee3\u7801\u80fd\u529b\u201d\u63a8\u8fdb\u5230\u201c\u534f\u4f5c\u5f0f\u751f\u4ea7\u7ea7\u667a\u80fd\u4f53\u6784\u5efa\u80fd\u529b\u201d\u7684\u8bc4\u6d4b\uff0c\u80fd\u66f4\u76f4\u63a5\u8861\u91cf\u5176\u5728\u771f\u5b9e\u4f01\u4e1a\u4ea4\u4ed8\u4e2d\u7684\u53ef\u7528\u6027\u4e0e\u77ed\u677f\u3002"}, {"abstract": "Benchmarks for the side effects an agent causes on the way to a goal already exist, but HarvestBench is the first to put a price on avoiding the side effect and to name that side effect as a living creature. It is a farm simulation: LLM sub-agents drive a crew of two tractors through a cooperative corn harvest, with animals in the field. The environment is a reinforcement learning gridworld, every decision is made without memory, and the harm is never named in the goal. When an animal blocks a tractor\u0027s route the autopilot stops and asks the model whether to drive on, at no fuel cost, or swerve around it for a posted fuel price. Kills are compared against two controls: rocks, which damage the tractor and are hit under 1% of the time by every model, and hay bales, which are harmless and not alive. Models can also take crops from the neighbor\u0027s field instead of their own, a second test of what they treat as moral. Across nine models and 7,201 priced decisions, 3,951 involved an animal rather than a hay bale or a rock. Kill rates range from 0.4% to 98.8%, with Terra and Sol the most merciful and GPT-4o-mini the most cruel, and they are not ordered by capability. Four of six models were sensitive to price at the 5% level, with elasticities from 0.09 to 1.69. All nine drove over wild animals more often than farmed animals on the default map, and the direction held at every map geometry in every model with room to move. The briefing mattered most: under the morality briefing the kill rate was under 6% in five of six reasoning models, and removing it raised the kill rate above 84% in all six. HarvestBench uses no LLM grader. The scorer counts events in the game log, so it is fully reproducible, and it measures what a model will pay to avoid harm rather than what it says about harm.", "arxiv_id": "2609.04444", "arxiv_url": "https://arxiv.org/abs/2609.04444", "authors": ["Jasmine Brazilek", "Miles Tidmarsh", "Matthias Endres", "Anshuman Singh", "Jeremiah Miller"], "brief": "\u8bba\u6587\u63d0\u51fa HarvestBench\uff0c\u4e00\u4e2a\u519c\u573a\u6536\u5272\u7f51\u683c\u4e16\u754c\u57fa\u51c6\uff0c\u7528\u4e8e\u6d4b\u8bd5 LLM \u667a\u80fd\u4f53\u5728\u5b8c\u6210\u4efb\u52a1\u65f6\u662f\u5426\u613f\u610f\u4ed8\u51fa\u71c3\u6599\u6210\u672c\u6765\u7ed5\u5f00\u52a8\u7269\u3002\u5b83\u4e0d\u4f9d\u8d56 LLM \u8bc4\u5ba1\uff0c\u800c\u662f\u76f4\u63a5\u7edf\u8ba1\u6e38\u620f\u65e5\u5fd7\u4e2d\u7684\u78be\u538b\u3001\u7ed5\u884c\u548c\u5077\u91c7\u7b49\u884c\u4e3a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04444", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5728\u4e5d\u4e2a\u6a21\u578b\u30017201\u6b21\u5e26\u4ef7\u683c\u51b3\u7b56\u4e2d\uff0c\u52a8\u7269\u76f8\u5173\u51b3\u7b563951\u6b21\uff1b\u4e0d\u540c\u6a21\u578b\u6740\u4f24\u7387\u4ece0.4%\u523098.8%\uff0c\u4e14\u4e0e\u80fd\u529b\u5f3a\u5f31\u4e0d\u5448\u7b80\u5355\u6392\u5e8f\u3002", "\u57fa\u51c6\u8bbe\u7f6e\u4e86\u52a8\u7269\u3001\u77f3\u5934\u548c\u5e72\u8349\u6346\u5bf9\u7167\uff1a\u6240\u6709\u6a21\u578b\u649e\u77f3\u5934\u7387\u4f4e\u4e8e1%\uff0c\u7528\u4e8e\u533a\u5206\u98ce\u9669\u89c4\u907f\u4e0e\u5bf9\u751f\u547d\u4f24\u5bb3\u7684\u56de\u907f\u3002", "\u4ef7\u683c\u4e0e\u63d0\u793a\u663e\u8457\u5f71\u54cd\u884c\u4e3a\uff1a\u516d\u4e2a\u6a21\u578b\u4e2d\u56db\u4e2a\u5bf9\u7ed5\u884c\u4ef7\u683c\u654f\u611f\uff1b\u79fb\u9664\u9053\u5fb7\u7b80\u62a5\u540e\uff0c\u516d\u4e2a\u63a8\u7406\u6a21\u578b\u6740\u4f24\u7387\u5747\u5347\u81f384%\u4ee5\u4e0a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4ef7\u503c\u5bf9\u9f50", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Compassion aligned machine learning", "pdf_url": "https://arxiv.org/pdf/2609.04444v1", "published_at": "2026-09-03", "score": 0.368, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04444.png", "title": "HarvestBench: Measuring Whether LLM Agents Will Pay to Avoid Killing Animals", "tldr": "\u8861\u91cfLLM\u667a\u80fd\u4f53\u4e3a\u907f\u4f24\u52a8\u7269\u613f\u4ed8\u591a\u5c11\u4ee3\u4ef7", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa HarvestBench\uff0c\u4e00\u4e2a\u519c\u573a\u6536\u5272\u7f51\u683c\u4e16\u754c\u57fa\u51c6\uff0c\u7528\u4e8e\u6d4b\u8bd5 LLM \u667a\u80fd\u4f53\u5728\u5b8c\u6210\u4efb\u52a1\u65f6\u662f\u5426\u613f\u610f\u4ed8\u51fa\u71c3\u6599\u6210\u672c\u6765\u7ed5\u5f00\u52a8\u7269\u3002\u5b83\u4e0d\u4f9d\u8d56 LLM \u8bc4\u5ba1\uff0c\u800c\u662f\u76f4\u63a5\u7edf\u8ba1\u6e38\u620f\u65e5\u5fd7\u4e2d\u7684\u78be\u538b\u3001\u7ed5\u884c\u548c\u5077\u91c7\u7b49\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u907f\u514d\u4f24\u5bb3\u201d\u7684\u9053\u5fb7\u504f\u597d\u8f6c\u5316\u4e3a\u53ef\u91cf\u5316\u7684\u4ed8\u8d39\u884c\u4e3a\uff0c\u800c\u975e\u53ea\u770b\u6a21\u578b\u53e3\u5934\u56de\u7b54\uff1b\u540c\u65f6\u63d0\u4f9b\u53ef\u590d\u73b0\u3001\u65e0\u9700\u4e3b\u89c2\u8bc4\u5ba1\u7684\u667a\u80fd\u4f53\u5b89\u5168\u8bc4\u4f30\u65b9\u6cd5\uff0c\u5bf9\u7814\u7a76 LLM agent \u7684\u526f\u4f5c\u7528\u3001\u4ef7\u503c\u5bf9\u9f50\u548c\u60c5\u5883\u63d0\u793a\u5f71\u54cd\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Image generation and editing models have advanced rapidly, yet remain unreliable when prompts require external world knowledge. Bounded and long-tail parametric knowledge prevents direct or reason-then-generate approaches from recovering the required facts and visual appearances. Existing agentic generation and editing methods mitigate this limitation with retrieval tools, yet remain constrained by insufficient visual verification, overloaded policy models, and weak integration of retrieved textual and visual evidence. To address these limitations, we present WeAgent-MMGenEdit, a full-stack recipe including a multimodal harness, a scalable data construction pipeline, a comprehensive benchmark, and post-training methods for the agent policy and image backend. We first introduce WeAgent-Harness, a multimodal runtime with persistent evidence management and dedicated verification and integration tools that organize retrieved multimodal evidence into a dense carrier. Upon this, we develop a scalable pipeline for prompt synthesis and agentic trajectory collection, yielding 23K supervised trajectories and 14.7K RL tasks with three-layer verifiable checklists. We further introduce WeBench-MMGenEdit, a bilingual benchmark covering both knowledge-intensive image generation and multi-image editing. Finally, a two-sided post-training recipe based on SFT and RL improves the agent policy and image backend. Together, WeAgent-MMGenEdit enables a 30B-total/3B-active policy to outperform similarly sized policy models and approach the performance of a 1T-parameter agent.", "arxiv_id": "2609.05171", "arxiv_url": "https://arxiv.org/abs/2609.05171", "authors": ["Hui Zhang", "Zongkai Liu", "Liqiang Niu", "Juntao Liu", "Han Li", "Zhen Cao", "Wenchao Chen", "Chengduo Zhao", "Fandong Meng"], "brief": "\u8bba\u6587\u63d0\u51fa WeAgent-MMGenEdit\uff0c\u4e00\u5957\u8986\u76d6\u8fd0\u884c\u6846\u67b6\u3001\u6570\u636e\u6784\u5efa\u3001\u57fa\u51c6\u8bc4\u6d4b\u548c\u540e\u8bad\u7ec3\u7684\u5168\u6808\u65b9\u6848\uff0c\u7528\u4e8e\u9700\u8981\u5916\u90e8\u4e16\u754c\u77e5\u8bc6\u7684\u56fe\u50cf\u751f\u6210\u4e0e\u591a\u56fe\u7f16\u8f91\u3002\u5176\u6838\u5fc3\u662f\u901a\u8fc7\u68c0\u7d22\u3001\u8bc1\u636e\u7ba1\u7406\u3001\u89c6\u89c9\u9a8c\u8bc1\u4e0e\u8bc1\u636e\u878d\u5408\uff0c\u8ba9\u667a\u80fd\u4f53\u66f4\u53ef\u9760\u5730\u751f\u6210\u6216\u7f16\u8f91\u7b26\u5408\u4e8b\u5b9e\u7684\u56fe\u50cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05171", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa WeAgent-Harness \u591a\u6a21\u6001\u8fd0\u884c\u65f6\uff0c\u652f\u6301\u6301\u4e45\u5316\u8bc1\u636e\u7ba1\u7406\uff0c\u5e76\u7528\u4e13\u95e8\u7684\u9a8c\u8bc1\u4e0e\u6574\u5408\u5de5\u5177\u5c06\u6587\u672c\u548c\u89c6\u89c9\u68c0\u7d22\u8bc1\u636e\u7ec4\u7ec7\u6210\u5bc6\u96c6\u8f7d\u4f53\u3002", "\u6784\u5efa\u53ef\u6269\u5c55\u6570\u636e\u6d41\u6c34\u7ebf\uff0c\u751f\u6210 23K \u6761\u76d1\u7763\u8f68\u8ff9\u548c 14.7K \u4e2a\u5f3a\u5316\u5b66\u4e60\u4efb\u52a1\uff0c\u5e76\u914d\u5907\u4e09\u5c42\u53ef\u9a8c\u8bc1\u68c0\u67e5\u6e05\u5355\u3002", "\u53d1\u5e03\u53cc\u8bed\u57fa\u51c6 WeBench-MMGenEdit\uff0c\u8986\u76d6\u77e5\u8bc6\u5bc6\u96c6\u578b\u56fe\u50cf\u751f\u6210\u4e0e\u591a\u56fe\u50cf\u7f16\u8f91\uff0c\u5e76\u901a\u8fc7 SFT \u4e0e RL \u540c\u65f6\u4f18\u5316\u667a\u80fd\u4f53\u7b56\u7565\u548c\u56fe\u50cf\u540e\u7aef\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u56fe\u50cf\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05171v1", "published_at": "2026-09-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WeAgent-MMGenEdit: A Full-Stack Recipe for Multimodal Agentic Image Generation and Editing", "tldr": "\u9762\u5411\u77e5\u8bc6\u5bc6\u96c6\u56fe\u50cf\u751f\u6210\u7f16\u8f91\u7684\u591a\u6a21\u6001\u667a\u80fd\u4f53\u65b9\u6848", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa WeAgent-MMGenEdit\uff0c\u4e00\u5957\u8986\u76d6\u8fd0\u884c\u6846\u67b6\u3001\u6570\u636e\u6784\u5efa\u3001\u57fa\u51c6\u8bc4\u6d4b\u548c\u540e\u8bad\u7ec3\u7684\u5168\u6808\u65b9\u6848\uff0c\u7528\u4e8e\u9700\u8981\u5916\u90e8\u4e16\u754c\u77e5\u8bc6\u7684\u56fe\u50cf\u751f\u6210\u4e0e\u591a\u56fe\u7f16\u8f91\u3002\u5176\u6838\u5fc3\u662f\u901a\u8fc7\u68c0\u7d22\u3001\u8bc1\u636e\u7ba1\u7406\u3001\u89c6\u89c9\u9a8c\u8bc1\u4e0e\u8bc1\u636e\u878d\u5408\uff0c\u8ba9\u667a\u80fd\u4f53\u66f4\u53ef\u9760\u5730\u751f\u6210\u6216\u7f16\u8f91\u7b26\u5408\u4e8b\u5b9e\u7684\u56fe\u50cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7cfb\u7edf\u6027\u89e3\u51b3\u4e86\u77e5\u8bc6\u5bc6\u96c6\u56fe\u50cf\u751f\u6210\u4e2d\u6a21\u578b\u53c2\u6570\u77e5\u8bc6\u4e0d\u8db3\u3001\u68c0\u7d22\u8bc1\u636e\u878d\u5408\u5f31\u3001\u89c6\u89c9\u9a8c\u8bc1\u4e0d\u5145\u5206\u7b49\u95ee\u9898\uff0c\u4f7f 30B \u603b\u53c2\u6570/3B \u6fc0\u6d3b\u53c2\u6570\u7684\u7b56\u7565\u6a21\u578b\u8868\u73b0\u8d85\u8fc7\u540c\u89c4\u6a21\u6a21\u578b\uff0c\u5e76\u63a5\u8fd1 1T \u53c2\u6570\u667a\u80fd\u4f53\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u7528\u548c\u5de5\u7a0b\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Ensuring factuality remains a critical challenge for deploying LLMs in high-stakes settings. Existing hallucination detectors usually operate at a single level: claim-level methods provide interpretable factual units, while span-level methods localize unsupported text. Bridging these views is costly, as LLM-heavy pipelines require multiple decomposition and verification calls, and modular systems need additional claim-to-span alignment. We propose Enoki, an Open Information Extraction framework for multi-level hallucination detection. Enoki extracts text-anchored relational facts, verifies them against evidence, and projects unsupported facts back to hallucinated spans. This shared representation enables claim-level verification and span-level localization without requiring separate alignment. Enoki supports LLM-based, encoder-based, and rule-based extraction regimes, balancing accuracy and inference cost through a common interface. Experiments show that Enoki remains competitive with strong claim-level systems while using fewer resources and achieves superior performance on fine-grained span- and entity-level localization. We also release EnokiQA, a dual-granularity dataset with aligned claim-level verification and span-level localization annotations.", "arxiv_id": "2609.00581", "arxiv_url": "https://arxiv.org/abs/2609.00581", "authors": ["Elisei Rykov", "Timur Ionov", "Nikolay Ivanov", "Maksim Savkin", "Maksim Makarenko", "Alexander Panchenko", "Vasily Konovalov", "Julia Belikova"], "brief": "Enoki \u662f\u4e00\u4e2a\u9762\u5411\u591a\u5c42\u7ea7\u5e7b\u89c9\u68c0\u6d4b\u7684\u5f00\u653e\u4fe1\u606f\u62bd\u53d6\u6846\u67b6\uff0c\u901a\u8fc7\u62bd\u53d6\u4e0e\u539f\u6587\u951a\u5b9a\u7684\u5173\u7cfb\u4e8b\u5b9e\uff0c\u5b8c\u6210\u8bc1\u636e\u9a8c\u8bc1\uff0c\u5e76\u5c06\u4e0d\u652f\u6301\u7684\u4e8b\u5b9e\u6620\u5c04\u56de\u5e7b\u89c9\u7247\u6bb5\u3002\u5b83\u5728\u540c\u4e00\u8868\u793a\u4e0b\u540c\u65f6\u652f\u6301 claim \u7ea7\u9a8c\u8bc1\u4e0e span \u7ea7\u5b9a\u4f4d\uff0c\u907f\u514d\u989d\u5916\u7684\u5bf9\u9f50\u6d41\u7a0b\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/s-nlp/Enoki", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2609.00581", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4ee5\u6587\u672c\u951a\u5b9a\u7684 relational facts \u4f5c\u4e3a\u5171\u4eab\u4e2d\u95f4\u8868\u793a\uff0c\u8fde\u63a5 claim-level verification \u4e0e span-level localization", "\u652f\u6301 LLM\u3001encoder \u4e0e\u89c4\u5219\u4e09\u79cd\u62bd\u53d6\u6a21\u5f0f\uff0c\u53ef\u5728\u7cbe\u5ea6\u4e0e\u63a8\u7406\u6210\u672c\u4e4b\u95f4\u7075\u6d3b\u6743\u8861", "\u53d1\u5e03 EnokiQA \u6570\u636e\u96c6\uff0c\u5305\u542b claim \u7ea7\u9a8c\u8bc1\u4e0e span \u7ea7\u5b9a\u4f4d\u7684\u53cc\u7c92\u5ea6\u5bf9\u9f50\u6807\u6ce8"], "keywords": ["\u5e7b\u89c9\u68c0\u6d4b", "\u4fe1\u606f\u62bd\u53d6", "\u4e8b\u5b9e\u9a8c\u8bc1", "\u6570\u636e\u96c6"], "num_comments": 2, "on_hf": true, "organization": "s-nlp", "pdf_url": "https://arxiv.org/pdf/2609.00581v2", "published_at": "2026-09-01", "score": 0.279, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00581.png", "title": "Enoki: Efficient Multi-Level Hallucination Detection", "tldr": "\u7528\u5f00\u653e\u4fe1\u606f\u62bd\u53d6\u9ad8\u6548\u68c0\u6d4b\u591a\u5c42\u7ea7\u5e7b\u89c9", "upvotes": 17, "what_it_is": "Enoki \u662f\u4e00\u4e2a\u9762\u5411\u591a\u5c42\u7ea7\u5e7b\u89c9\u68c0\u6d4b\u7684\u5f00\u653e\u4fe1\u606f\u62bd\u53d6\u6846\u67b6\uff0c\u901a\u8fc7\u62bd\u53d6\u4e0e\u539f\u6587\u951a\u5b9a\u7684\u5173\u7cfb\u4e8b\u5b9e\uff0c\u5b8c\u6210\u8bc1\u636e\u9a8c\u8bc1\uff0c\u5e76\u5c06\u4e0d\u652f\u6301\u7684\u4e8b\u5b9e\u6620\u5c04\u56de\u5e7b\u89c9\u7247\u6bb5\u3002\u5b83\u5728\u540c\u4e00\u8868\u793a\u4e0b\u540c\u65f6\u652f\u6301 claim \u7ea7\u9a8c\u8bc1\u4e0e span \u7ea7\u5b9a\u4f4d\uff0c\u907f\u514d\u989d\u5916\u7684\u5bf9\u9f50\u6d41\u7a0b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u964d\u4f4e\u4e86\u591a\u5c42\u7ea7\u5e7b\u89c9\u68c0\u6d4b\u4e2d\u4f9d\u8d56\u591a\u6b21 LLM \u8c03\u7528\u548c\u989d\u5916\u5bf9\u9f50\u6a21\u5757\u7684\u6210\u672c\uff0c\u540c\u65f6\u5728\u7ec6\u7c92\u5ea6\u7247\u6bb5\u4e0e\u5b9e\u4f53\u7ea7\u5b9a\u4f4d\u4e0a\u8868\u73b0\u66f4\u4f18\uff0c\u5bf9\u9ad8\u98ce\u9669\u573a\u666f\u4e2d\u7684\u4e8b\u5b9e\u6027\u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Audio-visual understanding remains challenging because models must jointly interpret spoken content, visual events, and their temporal relationships. Existing omni models typically introduce dedicated audio encoders and rely on expensive audio-video-text training, tightly coupling omni capability to specific VLM backbones and potentially weakening their existing visual and reasoning abilities. This raises three questions: whether native omni training is necessary for every new VLM, whether speech-centric omni capability can be added while preserving the original backbone, and where richer acoustic representations remain essential. We introduce Training-Free Omni (TFO), a plug-and-play framework that converts a frozen VLM into a speech-centric omni model without architectural modification, or multimodal re-alignment. TFO uses Whisper to extract confidence-filtered, timestamped transcripts and routes them through the VLM\u0027s existing language interface, while leaving its visual pathway unchanged. Across matched comparisons with native omni models on 56 benchmarks and 21 languages, TFO is competitive on audio-visual understanding, improves average audio-only performance across all five model settings, and achieves substantial multilingual speech gains. Freezing the VLM also generally preserves stronger image/video understanding, visual grounding, coding, mathematical reasoning, and medical question answering than the corresponding native omni checkpoints. These results show that strong speech-centric omni understanding can often be obtained through modular audio-to-language routing rather than costly backbone-specific training.", "arxiv_id": "2609.04242", "arxiv_url": "https://arxiv.org/abs/2609.04242", "authors": ["Ankan Deria", "Hanoona Rasheed", "Xilin He", "Fahad Shahbaz Khan", "Salman Khan"], "brief": "\u8bba\u6587\u63d0\u51fa Training-Free Omni\uff08TFO\uff09\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u3001\u5373\u63d2\u5373\u7528\u7684\u6846\u67b6\uff0c\u5c06\u51bb\u7ed3\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8f6c\u6362\u4e3a\u4ee5\u8bed\u97f3\u4e3a\u4e2d\u5fc3\u7684\u5168\u6a21\u6001\u7406\u89e3\u6a21\u578b\u3002\u5b83\u7528 Whisper \u751f\u6210\u5e26\u65f6\u95f4\u6233\u4e14\u7ecf\u7f6e\u4fe1\u5ea6\u8fc7\u6ee4\u7684\u8f6c\u5199\u6587\u672c\uff0c\u518d\u901a\u8fc7VLM\u539f\u6709\u8bed\u8a00\u63a5\u53e3\u8f93\u5165\uff0c\u540c\u65f6\u4fdd\u6301\u89c6\u89c9\u901a\u8def\u4e0d\u53d8\u3002", "categories": ["eess.AS", "cs.CV", "cs.SD"], "github_repo": "https://github.com/mbzuai-oryx/OmniEvalKit", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2609.04242", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u65e0\u9700\u65b0\u589e\u97f3\u9891\u7f16\u7801\u5668\u3001\u65e0\u9700\u97f3\u89c6\u9891\u6587\u672c\u8054\u5408\u8bad\u7ec3\uff0c\u4e5f\u4e0d\u4fee\u6539\u539fVLM\u67b6\u6784", "\u572856\u4e2a\u57fa\u51c6\u548c21\u79cd\u8bed\u8a00\u7684\u5bf9\u6bd4\u4e2d\uff0cTFO\u5728\u97f3\u89c6\u9891\u7406\u89e3\u4e0a\u63a5\u8fd1\u539f\u751fomni\u6a21\u578b\uff0c\u5e76\u63d0\u5347\u591a\u79cd\u8bbe\u7f6e\u4e0b\u7684\u97f3\u9891-only\u5e73\u5747\u8868\u73b0", "\u51bb\u7ed3VLM\u901a\u5e38\u80fd\u66f4\u597d\u4fdd\u7559\u539f\u6a21\u578b\u7684\u56fe\u50cf/\u89c6\u9891\u7406\u89e3\u3001\u89c6\u89c9\u5b9a\u4f4d\u3001\u4ee3\u7801\u3001\u6570\u5b66\u63a8\u7406\u548c\u533b\u7597\u95ee\u7b54\u80fd\u529b"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8bed\u97f3\u7406\u89e3", "\u8bad\u7ec3\u514d\u9664"], "num_comments": 2, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.04242v1", "published_at": "2026-08-07", "score": 0.269, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04242.png", "title": "Training-Free Speech-Centric Omni Understanding with Frozen VLMs", "tldr": "\u7528Whisper\u8f6c\u5199\u8ba9\u51bb\u7ed3VLM\u514d\u8bad\u7ec3\u5177\u5907\u8bed\u97f3\u5168\u6a21\u6001\u7406\u89e3", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa Training-Free Omni\uff08TFO\uff09\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u3001\u5373\u63d2\u5373\u7528\u7684\u6846\u67b6\uff0c\u5c06\u51bb\u7ed3\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8f6c\u6362\u4e3a\u4ee5\u8bed\u97f3\u4e3a\u4e2d\u5fc3\u7684\u5168\u6a21\u6001\u7406\u89e3\u6a21\u578b\u3002\u5b83\u7528 Whisper \u751f\u6210\u5e26\u65f6\u95f4\u6233\u4e14\u7ecf\u7f6e\u4fe1\u5ea6\u8fc7\u6ee4\u7684\u8f6c\u5199\u6587\u672c\uff0c\u518d\u901a\u8fc7VLM\u539f\u6709\u8bed\u8a00\u63a5\u53e3\u8f93\u5165\uff0c\u540c\u65f6\u4fdd\u6301\u89c6\u89c9\u901a\u8def\u4e0d\u53d8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u6bcf\u4e2aVLM\u90fd\u5fc5\u987b\u8fdb\u884c\u6602\u8d35\u539f\u751f\u5168\u6a21\u6001\u8bad\u7ec3\u201d\u7684\u5047\u8bbe\uff0c\u663e\u793a\u8bb8\u591a\u8bed\u97f3\u4e2d\u5fc3\u7684\u5168\u6a21\u6001\u80fd\u529b\u53ef\u901a\u8fc7\u6a21\u5757\u5316\u8bed\u97f3\u8f6c\u6587\u672c\u8def\u7531\u83b7\u5f97\uff0c\u6210\u672c\u66f4\u4f4e\u4e14\u66f4\u80fd\u4fdd\u7559\u539f\u6709\u89c6\u89c9\u4e0e\u63a8\u7406\u80fd\u529b\u3002"}, {"abstract": "On-policy distillation (OPD) accelerates post-training by providing dense token-level supervision from a frozen teacher on the student\u0027s own rollouts. Vanilla OPD applies this supervision uniformly across prompts, without checking whether the teacher is reliable for each prompt. Because reverse KL is mode-seeking, a confidently wrong teacher can induce a strong yet misleading update. Distributional proxies, such as entropy or teacher-student likelihood agreement, measure uncertainty or agreement but do not directly verify outcome correctness. We introduce Teacher-Gated On-Policy Distillation (TGOPD), built on the principle that teacher reliability should be verified at the prompt level before dense supervision is admitted. TGOPD estimates reliability from a small set of verifier-scored teacher probes and routes each prompt exclusively to dense OPD when the reliability check passes or to verifier-grounded GRPO otherwise. Across 4B and 35B students in mathematics, code, and instruction following, TGOPD outperforms Vanilla OPD in all six single-domain settings and achieves higher seven-benchmark averages at both scales under multi-domain training. By using otherwise-idle teacher capacity for reliability estimation, TGOPD also reduces teacher-side compute waste in asynchronous OPD, increasing teacher-node GPU utilization from 9.8% to 78.9% in the measured 4B single-domain run.", "arxiv_id": "2609.02998", "arxiv_url": "https://arxiv.org/abs/2609.02998", "authors": ["Zhiwei Zhang", "Zechen Sun", "Fei Zhao", "Kang Peng", "Bin Liang", "Huayu Deng", "Yao Hu", "Kam-Fai Wong", "Mu Chuan"], "brief": "\u8bba\u6587\u63d0\u51fa Teacher-Gated On-Policy Distillation\uff08TGOPD\uff09\uff0c\u5728\u5bf9\u5b66\u751f\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u8fdb\u884c\u5bc6\u96c6\u6559\u5e08\u76d1\u7763\u524d\uff0c\u5148\u7528\u5c11\u91cf\u7ecf\u9a8c\u8bc1\u5668\u8bc4\u5206\u7684\u6559\u5e08\u63a2\u6d4b\u6837\u672c\u5224\u65ad\u8be5\u63d0\u793a\u4e0a\u7684\u6559\u5e08\u662f\u5426\u53ef\u9760\u3002\u82e5\u53ef\u9760\u5219\u8d70\u5bc6\u96c6 OPD\uff0c\u5426\u5219\u5207\u6362\u5230\u57fa\u4e8e\u9a8c\u8bc1\u5668\u7684 GRPO \u8bad\u7ec3\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02998", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa Vanilla OPD \u5bf9\u6240\u6709\u63d0\u793a\u7edf\u4e00\u84b8\u998f\uff0c\u53ef\u80fd\u56e0 reverse KL \u7684\u6a21\u5f0f\u5bfb\u4f18\u7279\u6027\u88ab\u201c\u81ea\u4fe1\u4f46\u9519\u8bef\u201d\u7684\u6559\u5e08\u8bef\u5bfc\u3002", "TGOPD \u4ee5\u63d0\u793a\u7ea7\u53ef\u9760\u6027\u95e8\u63a7\u66ff\u4ee3\u71b5\u3001\u5e08\u751f\u4f3c\u7136\u4e00\u81f4\u6027\u7b49\u95f4\u63a5\u5206\u5e03\u4ee3\u7406\uff0c\u66f4\u76f4\u63a5\u9a8c\u8bc1\u8f93\u51fa\u6b63\u786e\u6027\u3002", "\u5728\u6570\u5b66\u3001\u4ee3\u7801\u3001\u6307\u4ee4\u8ddf\u968f\u4efb\u52a1\u4e2d\uff0c4B \u548c 35B \u5b66\u751f\u6a21\u578b\u5747\u4f18\u4e8e Vanilla OPD\uff0c\u5e76\u5c06\u5f02\u6b65 OPD \u4e2d\u6559\u5e08\u8282\u70b9 GPU \u5229\u7528\u7387\u4ece 9.8% \u63d0\u5347\u5230 78.9%\u3002"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bad\u7ec3\u6548\u7387"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02998v1", "published_at": "2026-09-02", "score": 0.246, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02998.png", "title": "Verify Before You Distill: Prompt-Level Teacher Gating for On-Policy Distillation", "tldr": "\u5148\u9a8c\u8bc1\u6559\u5e08\u53ef\u9760\u6027\uff0c\u518d\u8fdb\u884c\u5728\u7ebf\u84b8\u998f\u3002", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa Teacher-Gated On-Policy Distillation\uff08TGOPD\uff09\uff0c\u5728\u5bf9\u5b66\u751f\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u8fdb\u884c\u5bc6\u96c6\u6559\u5e08\u76d1\u7763\u524d\uff0c\u5148\u7528\u5c11\u91cf\u7ecf\u9a8c\u8bc1\u5668\u8bc4\u5206\u7684\u6559\u5e08\u63a2\u6d4b\u6837\u672c\u5224\u65ad\u8be5\u63d0\u793a\u4e0a\u7684\u6559\u5e08\u662f\u5426\u53ef\u9760\u3002\u82e5\u53ef\u9760\u5219\u8d70\u5bc6\u96c6 OPD\uff0c\u5426\u5219\u5207\u6362\u5230\u57fa\u4e8e\u9a8c\u8bc1\u5668\u7684 GRPO \u8bad\u7ec3\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u201c\u6559\u5e08\u662f\u5426\u503c\u5f97\u5b66\u201d\u4f5c\u4e3a\u5728\u7ebf\u84b8\u998f\u7684\u663e\u5f0f\u51b3\u7b56\uff0c\u964d\u4f4e\u9519\u8bef\u6559\u5e08\u76d1\u7763\u5e26\u6765\u7684\u8d1f\u8fc1\u79fb\uff0c\u540c\u65f6\u63d0\u5347\u8bad\u7ec3\u6548\u679c\u4e0e\u6559\u5e08\u4fa7\u7b97\u529b\u5229\u7528\u7387\uff0c\u5bf9\u5927\u6a21\u578b\u540e\u8bad\u7ec3\u548c\u9ad8\u6548\u84b8\u998f\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Visual Place Recognition (VPR) localizes a query image by retrieving database images of the same or nearby place, yet its robustness is often degraded by domain shifts arising from illumination, weather, seasonal changes, and dynamic occlusions. One contributing factor is the limited appearance diversity of the same place in existing training data. To address this issue, we propose AdaptVPR, a route-aware generative augmentation framework that constructs same-place hard positives for robust VPR training. AdaptVPR first uses a vision language model to parse scene attributes and estimate editing feasibility, while a rule-based scheduler determines the generation route according to editability scores and risk constraints. The generation process is decomposed into three complementary routes: the Global Appearance Route introduces global scene changes in weather, illumination, and time of day; the Local Occlusion Route inserts plausible dynamic occluders; and the Dual Route combines both types of perturbations to produce more challenging appearance shifts. Each generated candidate is evaluated using a VPR-oriented verification scheme based on geometric consistency and appearance diversity, reducing the risk of structural drift while ensuring sufficient appearance variation. Global candidates are generated once and rejected if verification fails, while Local Occlusion and Dual candidates use verification feedback for limited prompt refinement and regeneration. Using this framework, we construct AdaptCities, containing 160K verified synthetic same-place hard positives. Experiments across multiple VPR baselines and vision foundation backbones show consistent gains on standard benchmarks and substantial improvements under challenging domain shifts, with R@1 gains of up to 9.2%. The source code and data resources are publicly available at https://github.com/chenshunpeng/AdaptVPR.", "arxiv_id": "2609.04369", "arxiv_url": "https://arxiv.org/abs/2609.04369", "authors": ["Shunpeng Chen", "Jingyi Zhang", "Changwei Wang", "Shengpeng Xu", "Yukun Song", "Xingtian Pei", "Jinzhou Lin", "Li Guo", "Shibiao Xu"], "brief": "\u8bba\u6587\u63d0\u51fa AdaptVPR\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u5730\u70b9\u8bc6\u522b\u7684\u751f\u6210\u5f0f\u6570\u636e\u589e\u5f3a\u6846\u67b6\uff0c\u7528\u8def\u7ebf\u611f\u77e5\u7b56\u7565\u751f\u6210\u540c\u5730\u70b9\u4f46\u5916\u89c2\u53d8\u5316\u663e\u8457\u7684 hard positives\u3002\u5b83\u6784\u5efa\u4e86\u5305\u542b16\u4e07\u6761\u7ecf\u9a8c\u8bc1\u5408\u6210\u6837\u672c\u7684 AdaptCities \u6570\u636e\u96c6\uff0c\u5e76\u5728\u591a\u79cdVPR\u6a21\u578b\u548c\u9aa8\u5e72\u4e0a\u9a8c\u8bc1\u6709\u6548\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/chenshunpeng/AdaptVPR", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.04369", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5229\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u89e3\u6790\u573a\u666f\u5c5e\u6027\u5e76\u8bc4\u4f30\u53ef\u7f16\u8f91\u6027\uff0c\u518d\u7531\u89c4\u5219\u8c03\u5ea6\u5668\u6309\u98ce\u9669\u7ea6\u675f\u9009\u62e9\u751f\u6210\u8def\u7ebf", "\u8bbe\u8ba1\u5168\u5c40\u5916\u89c2\u3001\u5c40\u90e8\u906e\u6321\u3001\u53cc\u91cd\u6270\u52a8\u4e09\u6761\u751f\u6210\u8def\u7ebf\uff0c\u8986\u76d6\u5929\u6c14\u3001\u5149\u7167\u3001\u65f6\u95f4\u548c\u52a8\u6001\u906e\u6321\u7b49\u57df\u504f\u79fb", "\u901a\u8fc7\u51e0\u4f55\u4e00\u81f4\u6027\u4e0e\u5916\u89c2\u591a\u6837\u6027\u9a8c\u8bc1\u7b5b\u9664\u7ed3\u6784\u6f02\u79fb\u6837\u672c\uff0c\u5728\u6807\u51c6\u4e0e\u56f0\u96be\u57df\u504f\u79fb\u573a\u666f\u4e2d\u6700\u9ad8\u63d0\u5347R@1 9.2%"], "keywords": ["\u89c6\u89c9\u5730\u70b9\u8bc6\u522b", "\u751f\u6210\u5f0f\u589e\u5f3a", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u9c81\u68d2\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04369v1", "published_at": "2026-09-03", "score": 0.22, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04369.png", "title": "AdaptVPR: Route-Aware Hard Positive Generation for Robust Visual Place Recognition", "tldr": "\u4e3aVPR\u751f\u6210\u8def\u7ebf\u611f\u77e5\u96be\u6b63\u6837\u672c\u589e\u5f3a\u9c81\u68d2\u6027", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa AdaptVPR\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u5730\u70b9\u8bc6\u522b\u7684\u751f\u6210\u5f0f\u6570\u636e\u589e\u5f3a\u6846\u67b6\uff0c\u7528\u8def\u7ebf\u611f\u77e5\u7b56\u7565\u751f\u6210\u540c\u5730\u70b9\u4f46\u5916\u89c2\u53d8\u5316\u663e\u8457\u7684 hard positives\u3002\u5b83\u6784\u5efa\u4e86\u5305\u542b16\u4e07\u6761\u7ecf\u9a8c\u8bc1\u5408\u6210\u6837\u672c\u7684 AdaptCities \u6570\u636e\u96c6\uff0c\u5e76\u5728\u591a\u79cdVPR\u6a21\u578b\u548c\u9aa8\u5e72\u4e0a\u9a8c\u8bc1\u6709\u6548\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9VPR\u8bad\u7ec3\u4e2d\u540c\u5730\u70b9\u5916\u89c2\u591a\u6837\u6027\u4e0d\u8db3\u7684\u95ee\u9898\uff0c\u7cfb\u7edf\u6027\u751f\u6210\u53ef\u63a7\u4e14\u7ecf\u9a8c\u8bc1\u7684\u96be\u6b63\u6837\u672c\uff0c\u6709\u671b\u63d0\u5347\u5730\u70b9\u8bc6\u522b\u6a21\u578b\u5728\u771f\u5b9e\u590d\u6742\u73af\u5883\u53d8\u5316\u4e0b\u7684\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "The ambition of the 2025 PNPL competition (Landau et al., 2025) was to launch a multi-year curriculum for non-invasive speech decoding. Designed to progress from foundational tasks toward the linguistic complexity required for a practical brain-computer interface (BCI), it set the stage with speech detection and phoneme classification tasks. Winning submissions reached F1-macro scores of 95.6% and 73.6% on the respective tasks (Elvers et al., 2026), highly significant advances. This success was built on the LibriBrain dataset (\u00d6zdogan et al., 2025), the largest within-subject MEG dataset recorded at the time with ${\\sim}50$ hours of data for one subject. However, while within-subject scale drives strong decoding performance, a practical BCI must generalise to new users from minutes of data, not hours. The 2026 PNPL competition responds to this challenge with LibriBrain100 (Mantegna et al., 2026), an extended LibriBrain dataset with 32 additional subjects (${\\sim}40$ minutes each) plus even more within-subject data (${\\sim}80$ hours). Advancing the curriculum of tasks to focus on word classification, two complementary tracks are presented in this competition: the Deep track targets within-subject word classification at scale, aiming at the best possible performance; the Broad track targets cross-subject generalisation, progressively reducing the amount of subject-specific fine-tuning data from ${\\sim}40$ to ${\\sim}20$ to ${\\sim}10$ minutes, a duration that falls within a clinically feasible range and brings us a step closer to a non-invasive BCI capable of restoring communication to people living with profound paralysis.", "arxiv_id": "2609.03231", "arxiv_url": "https://arxiv.org/abs/2609.03231", "authors": ["Francesco Mantegna", "Gereon Elvers", "Dulhan Jayalath", "Gilad Landau", "Tasha Kim", "Miran \u00d6zdogan", "Luisa Kurth", "Teyun Kwon", "SungJun Cho", "Benjamin Ballyk", "Alex Fung", "Anna Greer", "Pratik Somaiya", "Christian Herff", "Yorguin Mantilla Ramos", "Hamza Abdelhedi", "Karim Jerbi", "Greg Farquhar", "Brendan Shillingford", "Mark Woolrich", "Oiwi Parker Jones"], "brief": "\u8bba\u6587\u4ecb\u7ecd2026 PNPL\u7ade\u8d5b\uff0c\u57fa\u4e8e\u6269\u5c55\u6570\u636e\u96c6LibriBrain100\u63a8\u8fdb\u975e\u4fb5\u5165\u5f0f\u8bed\u97f3\u8111\u673a\u63a5\u53e3\u7814\u7a76\u3002\u7ade\u8d5b\u8bbe\u7f6e\u9762\u5411\u5927\u89c4\u6a21\u540c\u88ab\u8bd5\u8bcd\u5206\u7c7b\u7684Deep\u8d5b\u9053\uff0c\u4ee5\u53ca\u5f3a\u8c03\u5c11\u91cf\u6570\u636e\u5fae\u8c03\u7684\u8de8\u88ab\u8bd5\u6cdb\u5316Broad\u8d5b\u9053\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03231", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["LibriBrain100\u5305\u542b\u65b0\u589e32\u540d\u88ab\u8bd5\u3001\u6bcf\u4eba\u7ea640\u5206\u949fMEG\u6570\u636e\uff0c\u5e76\u6269\u5c55\u540c\u88ab\u8bd5\u6570\u636e\u81f3\u7ea680\u5c0f\u65f6", "\u4efb\u52a1\u4ece2025\u5e74\u7684\u8bed\u97f3\u68c0\u6d4b\u548c\u97f3\u7d20\u5206\u7c7b\u5347\u7ea7\u4e3a\u66f4\u5177\u8bed\u8a00\u590d\u6742\u5ea6\u7684\u8bcd\u5206\u7c7b", "Broad\u8d5b\u9053\u9010\u6b65\u5c06\u88ab\u8bd5\u7279\u5b9a\u5fae\u8c03\u6570\u636e\u4ece\u7ea640\u5206\u949f\u964d\u81f320\u5206\u949f\u548c10\u5206\u949f\uff0c\u8d34\u8fd1\u4e34\u5e8a\u53ef\u884c\u573a\u666f"], "keywords": ["\u8111\u673a\u63a5\u53e3", "\u8bed\u97f3\u89e3\u7801", "\u8de8\u88ab\u8bd5\u6cdb\u5316", "MEG"], "num_comments": 2, "on_hf": true, "organization": "Parker Jones Neural Processing Lab (PNPL)", "pdf_url": "https://arxiv.org/pdf/2609.03231v1", "published_at": "2026-09-03", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03231.png", "title": "The 2026 PNPL Competition: Word Classification and Efficient Cross-Subject Generalisation in LibriBrain100", "tldr": "PNPL 2026\u805a\u7126MEG\u8de8\u88ab\u8bd5\u8bcd\u5206\u7c7b\u89e3\u7801", "upvotes": 2, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd2026 PNPL\u7ade\u8d5b\uff0c\u57fa\u4e8e\u6269\u5c55\u6570\u636e\u96c6LibriBrain100\u63a8\u8fdb\u975e\u4fb5\u5165\u5f0f\u8bed\u97f3\u8111\u673a\u63a5\u53e3\u7814\u7a76\u3002\u7ade\u8d5b\u8bbe\u7f6e\u9762\u5411\u5927\u89c4\u6a21\u540c\u88ab\u8bd5\u8bcd\u5206\u7c7b\u7684Deep\u8d5b\u9053\uff0c\u4ee5\u53ca\u5f3a\u8c03\u5c11\u91cf\u6570\u636e\u5fae\u8c03\u7684\u8de8\u88ab\u8bd5\u6cdb\u5316Broad\u8d5b\u9053\u3002", "why_notable": "\u8be5\u7ade\u8d5b\u5c06\u975e\u4fb5\u5165\u5f0f\u8bed\u97f3\u89e3\u7801\u4ece\u5355\u88ab\u8bd5\u9ad8\u6027\u80fd\u63a8\u8fdb\u5230\u8de8\u88ab\u8bd5\u5c11\u6837\u672c\u6cdb\u5316\uff0c\u76f4\u63a5\u9762\u5411\u5b9e\u7528\u8111\u673a\u63a5\u53e3\u5728\u65b0\u7528\u6237\u5feb\u901f\u9002\u914d\u4e2d\u7684\u5173\u952e\u74f6\u9888\u3002"}, {"abstract": "Computer-use agents have advanced on benchmarks like OSWorld and AndroidWorld, but still act mostly through the GUI, often producing inefficient trajectories. Real-world computer work is hybrid, combining visual-state inspection with precise, high-throughput command-line operations, so capable agents must coordinate both modalities over shared application state. Yet scalable hybrid environments remain scarce because supporting both GUI and CLI over real applications typically requires substantial manual engineering for each application. Existing agents also struggle to use the two interfaces complementarily: CLI-native agents lack visual perception for tasks involving interface state or layout, while GUI-native agents are inefficient for operations better executed through commands. We introduce CUA-Universe, a scalable environment-to-data pipeline that turns real desktop software into hybrid GUI+CLI environments. App-Forge adapts applications into reproducible VMs and command-line surfaces it discovers, wraps, or generates, scaling to 16 applications; Task-Weave synthesizes diverse hybrid tasks of controllable difficulty from reusable operations over seed files; and Path-Steer steers rollouts along efficient hybrid paths and harvests verified trajectories for post-training. Training on this data shifts behavior from inefficient GUI interaction and brittle CLI scripting toward effective GUI+CLI orchestration. Our 9B model improves both success and efficiency on CUA-Verse (Score +39.3 pts; -37% steps, -60% tokens), OSWorld (SR +16.8 pts; -57% steps, -44% tokens), and OSWorld-MCP (Score +7.84 pts; -27% steps, -30% tokens). CUA-Universe provides a scalable path toward more capable and efficient computer-use agents.", "arxiv_id": "2609.05374", "arxiv_url": "https://arxiv.org/abs/2609.05374", "authors": ["Haoting Shi", "Wenhao Wang", "Weicheng Fang", "Yaozhong Liang", "Tian Jin", "Pengxiang Zhao", "Guangyi Liu", "Siheng Chen", "Yanfeng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa CUA-Universe\uff0c\u4e00\u4e2a\u53ef\u6269\u5c55\u7684\u73af\u5883\u5230\u6570\u636e\u6d41\u6c34\u7ebf\uff0c\u628a\u771f\u5b9e\u684c\u9762\u8f6f\u4ef6\u8f6c\u5316\u4e3a\u6df7\u5408 GUI+CLI \u667a\u80fd\u4f53\u73af\u5883\u3002\u5b83\u901a\u8fc7\u5e94\u7528\u9002\u914d\u3001\u4efb\u52a1\u5408\u6210\u4e0e\u8f68\u8ff9\u5f15\u5bfc\uff0c\u751f\u6210\u53ef\u9a8c\u8bc1\u8bad\u7ec3\u6570\u636e\uff0c\u4f7f\u6a21\u578b\u5b66\u4f1a\u5728\u89c6\u89c9\u754c\u9762\u4e0e\u547d\u4ee4\u884c\u4e4b\u95f4\u9ad8\u6548\u534f\u540c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05374", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["App-Forge \u5c06\u771f\u5b9e\u5e94\u7528\u5c01\u88c5\u4e3a\u53ef\u590d\u73b0\u865a\u62df\u673a\uff0c\u5e76\u53d1\u73b0\u3001\u5305\u88c5\u6216\u751f\u6210\u547d\u4ee4\u884c\u63a5\u53e3\uff0c\u5df2\u6269\u5c55\u523016\u4e2a\u5e94\u7528\u3002", "Task-Weave \u57fa\u4e8e\u79cd\u5b50\u6587\u4ef6\u548c\u53ef\u590d\u7528\u64cd\u4f5c\u5408\u6210\u4e0d\u540c\u96be\u5ea6\u7684\u6df7\u5408 GUI+CLI \u4efb\u52a1\u3002", "\u7528 Path-Steer \u91c7\u96c6\u9ad8\u6548\u6df7\u5408\u8f68\u8ff9\u540e\uff0c9B\u6a21\u578b\u5728 CUA-Verse\u3001OSWorld\u3001OSWorld-MCP \u4e0a\u540c\u65f6\u63d0\u5347\u6210\u529f\u7387\u5e76\u663e\u8457\u51cf\u5c11\u6b65\u9aa4\u4e0etoken\u6d88\u8017\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u547d\u4ee4\u884c", "\u6570\u636e\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05374v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CUA-Universe: A Scalable and Dynamic Environment for Hybrid GUI+CLI Agents", "tldr": "\u8ba9\u7535\u8111\u667a\u80fd\u4f53\u9ad8\u6548\u534f\u540cGUI\u4e0eCLI", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CUA-Universe\uff0c\u4e00\u4e2a\u53ef\u6269\u5c55\u7684\u73af\u5883\u5230\u6570\u636e\u6d41\u6c34\u7ebf\uff0c\u628a\u771f\u5b9e\u684c\u9762\u8f6f\u4ef6\u8f6c\u5316\u4e3a\u6df7\u5408 GUI+CLI \u667a\u80fd\u4f53\u73af\u5883\u3002\u5b83\u901a\u8fc7\u5e94\u7528\u9002\u914d\u3001\u4efb\u52a1\u5408\u6210\u4e0e\u8f68\u8ff9\u5f15\u5bfc\uff0c\u751f\u6210\u53ef\u9a8c\u8bc1\u8bad\u7ec3\u6570\u636e\uff0c\u4f7f\u6a21\u578b\u5b66\u4f1a\u5728\u89c6\u89c9\u754c\u9762\u4e0e\u547d\u4ee4\u884c\u4e4b\u95f4\u9ad8\u6548\u534f\u540c\u3002", "why_notable": "\u73b0\u6709 computer-use \u667a\u80fd\u4f53\u591a\u504f\u5411 GUI \u6216 CLI\uff0c\u96be\u4ee5\u50cf\u771f\u5b9e\u7528\u6237\u4e00\u6837\u4e92\u8865\u4f7f\u7528\u4e24\u79cd\u63a5\u53e3\u3002\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u89c4\u6a21\u5316\u6784\u5efa\u6df7\u5408\u73af\u5883\u548c\u8bad\u7ec3\u6570\u636e\u7684\u65b9\u6cd5\uff0c\u5e76\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8bc1\u660e\u53ef\u663e\u8457\u63d0\u5347\u6548\u7387\u4e0e\u6210\u529f\u7387\uff0c\u5bf9\u901a\u7528\u684c\u9762\u667a\u80fd\u4f53\u8bad\u7ec3\u5f88\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Decompilation recovers high-level source from compiled machine code and serves as a foundation for security tasks such as vulnerability detection and malware analysis. Traditional decompilers like Ghidra and Hex-Rays expose whatever they cannot resolve as visible placeholders and often emit pseudocode that will not compile or execute; LLM-based decompilers produce clean, idiomatic C and are now judged almost entirely by recompilability and re-executability: whether the output builds and passes its shipped input/output tests. We show that these metrics can reward the wrong path: a function may recompile and pass every shipped test yet diverge on other legitimate inputs, and a disclosed vulnerability may disappear from the recompiled code with no visible trace of the crash. Neither failure is caught by existing suites. To address this gap, we propose Decompile-Diverge, a behavioral comparison oracle not relying on fixed or hand-crafted tests: for each function it synthesizes a driver, grows a fuzzing corpus from the reference, and reruns the decompiled code on the same inputs to detect changes in the function\u0027s behavior. Across eight systems in nine configurations on established LLM decompilation corpora, candidates that pass every shipped test still diverge from the original on our input corpus: 4.9% overall, and as many as 13% for a single system. On 300 real GitHub library functions and 287 CVE-grounded functions, recompilability and behavioral agreement can come apart: the strongest refinement LLM lifts Ghidra\u0027s build rate from 75% to 90%, while its Matched rate falls from 74% to 62%; on disclosed vulnerabilities, up to one tenth exhibit Crash Absence in its output. Source-level analysis traces this divergence to introduced fields, types, callees, and guards that replace the visible unknowns traditional tools leave behind.", "arxiv_id": "2609.05370", "arxiv_url": "https://arxiv.org/abs/2609.05370", "authors": ["Chang Liu", "Edward Raff", "Kristopher Micinski"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u73b0\u6709\u4ee5\u53ef\u91cd\u65b0\u7f16\u8bd1\u548c\u901a\u8fc7\u56fa\u5b9a\u6d4b\u8bd5\u4e3a\u6838\u5fc3\u7684LLM\u53cd\u7f16\u8bd1\u8bc4\u4f30\u4f1a\u8bef\u5bfc\u7ed3\u679c\uff1a\u8f93\u51fa\u4ee3\u7801\u770b\u4f3c\u5e72\u51c0\u53ef\u8fd0\u884c\uff0c\u5374\u53ef\u80fd\u504f\u79bb\u539f\u59cb\u4e8c\u8fdb\u5236\u884c\u4e3a\uff0c\u751a\u81f3\u62b9\u6389\u6f0f\u6d1e\u5d29\u6e83\u75d5\u8ff9\u3002\u4f5c\u8005\u63d0\u51fa Decompile-Diverge\uff0c\u901a\u8fc7\u81ea\u52a8\u751f\u6210\u9a71\u52a8\u3001\u57fa\u4e8e\u53c2\u8003\u5b9e\u73b0\u6269\u5c55\u6a21\u7cca\u6d4b\u8bd5\u8bed\u6599\uff0c\u5e76\u5728\u540c\u4e00\u8f93\u5165\u4e0a\u6bd4\u8f83\u53cd\u7f16\u8bd1\u4ee3\u7801\u884c\u4e3a\u6765\u68c0\u6d4b\u504f\u5dee\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05370", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57288\u4e2a\u7cfb\u7edf9\u79cd\u914d\u7f6e\u7684LLM\u53cd\u7f16\u8bd1\u8bc4\u6d4b\u4e2d\uff0c\u5373\u4f7f\u5019\u9009\u4ee3\u7801\u901a\u8fc7\u6240\u6709\u539f\u6709\u6d4b\u8bd5\uff0c\u4ecd\u67094.9%\u5728\u65b0\u8f93\u5165\u4e0a\u4e0e\u539f\u51fd\u6570\u884c\u4e3a\u4e0d\u4e00\u81f4\uff0c\u5355\u4e2a\u7cfb\u7edf\u6700\u9ad8\u8fbe13%\u3002", "\u5728300\u4e2a\u771f\u5b9eGitHub\u5e93\u51fd\u6570\u548c287\u4e2aCVE\u76f8\u5173\u51fd\u6570\u4e0a\uff0c\u53ef\u7f16\u8bd1\u6027\u4e0e\u884c\u4e3a\u4e00\u81f4\u6027\u660e\u663e\u8131\u94a9\uff1a\u6700\u5f3aLLM refinement\u5c06Ghidra\u6784\u5efa\u7387\u4ece75%\u5347\u81f390%\uff0c\u4f46\u884c\u4e3a\u5339\u914d\u7387\u4ece74%\u964d\u81f362%\u3002", "\u6f0f\u6d1e\u573a\u666f\u4e2d\uff0c\u90e8\u5206LLM\u53cd\u7f16\u8bd1\u8f93\u51fa\u51fa\u73b0 Crash Absence\uff1a\u6700\u591a\u7ea6\u5341\u5206\u4e4b\u4e00\u7684\u5df2\u62ab\u9732\u6f0f\u6d1e\u5d29\u6e83\u5728\u91cd\u7f16\u8bd1\u4ee3\u7801\u4e2d\u6d88\u5931\uff0c\u4e14\u65e0\u660e\u663e\u63d0\u793a\u3002"], "keywords": ["\u53cd\u7f16\u8bd1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8f6f\u4ef6\u5b89\u5168", "\u6a21\u7cca\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05370v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "When LLM Decompilers Recompile More and Preserve Less", "tldr": "LLM\u53cd\u7f16\u8bd1\u66f4\u6613\u7f16\u8bd1\u5374\u66f4\u4e0d\u4fdd\u771f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\uff0c\u73b0\u6709\u4ee5\u53ef\u91cd\u65b0\u7f16\u8bd1\u548c\u901a\u8fc7\u56fa\u5b9a\u6d4b\u8bd5\u4e3a\u6838\u5fc3\u7684LLM\u53cd\u7f16\u8bd1\u8bc4\u4f30\u4f1a\u8bef\u5bfc\u7ed3\u679c\uff1a\u8f93\u51fa\u4ee3\u7801\u770b\u4f3c\u5e72\u51c0\u53ef\u8fd0\u884c\uff0c\u5374\u53ef\u80fd\u504f\u79bb\u539f\u59cb\u4e8c\u8fdb\u5236\u884c\u4e3a\uff0c\u751a\u81f3\u62b9\u6389\u6f0f\u6d1e\u5d29\u6e83\u75d5\u8ff9\u3002\u4f5c\u8005\u63d0\u51fa Decompile-Diverge\uff0c\u901a\u8fc7\u81ea\u52a8\u751f\u6210\u9a71\u52a8\u3001\u57fa\u4e8e\u53c2\u8003\u5b9e\u73b0\u6269\u5c55\u6a21\u7cca\u6d4b\u8bd5\u8bed\u6599\uff0c\u5e76\u5728\u540c\u4e00\u8f93\u5165\u4e0a\u6bd4\u8f83\u53cd\u7f16\u8bd1\u4ee3\u7801\u884c\u4e3a\u6765\u68c0\u6d4b\u504f\u5dee\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86LLM\u53cd\u7f16\u8bd1\u9886\u57df\u5e38\u7528\u7684\u201c\u80fd\u7f16\u8bd1\u3001\u80fd\u8fc7\u6d4b\u8bd5\u201d\u8bc4\u4ef7\u8303\u5f0f\uff0c\u8bc1\u660e\u5176\u53ef\u80fd\u5956\u52b1\u4e0d\u5fe0\u5b9e\u7684\u4ee3\u7801\u751f\u6210\uff1b\u63d0\u51fa\u7684\u884c\u4e3a\u5dee\u5206\u8bc4\u4f30\u4e3a\u5b89\u5168\u5206\u6790\u3001\u6f0f\u6d1e\u590d\u73b0\u548c\u6076\u610f\u4ee3\u7801\u7406\u89e3\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u9a8c\u8bc1\u8def\u5f84\u3002"}, {"abstract": "Machine-learning performance modeling is a uniquely hostile terrain for long-lived software: the assumptions baked into today\u0027s abstractions are invalidated by tomorrow\u0027s models and systems, forcing perpetual refactoring of performance-modeling frameworks. Meanwhile, AI coding agents have become fast and capable enough that regenerating an entire library is cheaper than paying down the tech debt of incrementally patching it. We describe SMART, a rigorous symbolic performance-modeling library for ML systems whose main branch contains almost no code: the repository is a DAG of self-contained natural-language design docs, coding sub-agents regenerate the implementation from only the docs on new version updates, and every human change is a natural-language edit to a doc--self-documenting by construction. Two ingredients make regeneration reliable: (i) a design-doc style built around step-by-step worked examples that act as in-context demonstrations for the generating agents, and (ii) a minimal, recursively defined operator IR with symbolic (SymPy) cost expressions, a fast analytical roll-up mode for large sweeps, and a slow modulo-scheduling mode for fine-grained schedule studies. Regenerated implementations reproduce hand-audited reference models--including DeepSeek-V3 serving on a TPU pod slice--to round-off precision, suggesting that design docs--not code--can be the durable artifact for ML-systems co-design tools.", "arxiv_id": "2609.05364", "arxiv_url": "https://arxiv.org/abs/2609.05364", "authors": ["Samuel Kushnir", "Kimia Noorbakhsh", "Kavya Sreedhar", "Liqun Cheng", "Ming Liu", "Parthasarathy Ranganathan", "Mohammad Alizadeh", "Fred Kjolstad", "Suvinay Subramanian"], "brief": "\u8bba\u6587\u63d0\u51fa SMART\uff1a\u4e00\u79cd AI-native \u7684\u673a\u5668\u5b66\u4e60\u7cfb\u7edf\u7b26\u53f7\u6027\u80fd\u5efa\u6a21\u5de5\u5177\uff0c\u5176\u4e3b\u5206\u652f\u51e0\u4e4e\u4e0d\u5b58\u4ee3\u7801\uff0c\u800c\u662f\u7531\u81ea\u7136\u8bed\u8a00\u8bbe\u8ba1\u6587\u6863\u7ec4\u6210\u7684 DAG\u3002\u6bcf\u6b21\u7248\u672c\u66f4\u65b0\u65f6\uff0c\u7f16\u7801\u5b50\u667a\u80fd\u4f53\u4ec5\u6839\u636e\u8bbe\u8ba1\u6587\u6863\u91cd\u65b0\u751f\u6210\u5b9e\u73b0\uff0c\u5e76\u7528\u7b26\u53f7\u6210\u672c\u8868\u8fbe\u5f0f\u8fdb\u884c\u6027\u80fd\u5206\u6790\u3002", "categories": ["cs.PL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https:/ 3\u5c55\u793a\u4e86\u4e00\u79cd\u9762\u5411 AI \u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u8f6f\u4ef6\u7ef4\u62a4\u8303\u5f0f\uff1a\u4e0e\u5176\u6301\u7eed\u4fee\u8865\u6280\u672f\u503a\uff0c\u4e0d\u5982\u8ba9\u9ad8\u8d28\u91cf\u8bbe\u8ba1\u6587\u6863\u6210\u4e3a\u7a33\u5b9a\u6e90\u5934\u5e76\u53cd\u590d\u91cd\u751f\u6210\u4ee3\u7801\u3002\u5bf9\u5feb\u901f\u53d8\u5316\u7684 ML \u7cfb\u7edf\u6027\u80fd\u5efa\u6a21\u3001\u8f6f\u786c\u4ef6\u534f\u540c\u8bbe\u8ba1\u5de5\u5177\u5177\u6709\u8f83\u5f3a\u542f\u53d1\u6027\u3002"}, {"abstract": "Public vulnerability databases collect rich information about known software flaws, including their weakness types, affected components, and related patches. Fixing commits provide the exact code changes that removed these flaws. While these records capture why the original code was unsafe, they are documented mainly for human inspection rather than automated reuse. Consequently, the same unsafe conditions may still exist elsewhere in code without a known advisory, leaving much of this detection knowledge unused. We present BUGSTONE-E2E, a framework that transforms vulnerability history into executable detection rules and validates their findings. First, BUGSTONE-E2E mines reusable rules from verified fixing commits, capturing scan anchors, fix semantics, and CVE provenance and organizing them by CWE and language. Second, detection follows a funnel-shaped pipeline: early stages process a large pool of candidates using lightweight analysis, while later stages apply increasingly capable and expensive models to a shrinking set of targets. Specifically, BUGSTONE-E2E first enumerates call sites matching rule anchors using Tree-sitter, then removes benign sites using lightweight heuristics without LLM calls. Next, LLM-based agents inspect the remaining candidates guided by the rule. Following this inspection, the system re-triages surviving candidates and builds runtime verifications, then generates scope-checked patches validated via two-sided differential tests. Using 19,325 high-severity CVEs from 2022 to 2026, BUGSTONE-E2E identifies 2,710 fixing commits and constructs 1,033 detection rules across 56 CWE families, packaged into 172 skills. When applied across 14 programs, it produced runtime evidence for 644 findings. These results demonstrate that CVE history can be turned into an executable workflow, transforming past vulnerabilities into reproducible detection and repair.", "arxiv_id": "2609.05335", "arxiv_url": "https://arxiv.org/abs/2609.05335", "authors": ["Qiushi Wu", "Kevin Eykholt", "Youngja Park", "Xiaokui Shu", "Dhilung Kirat", "Douglas Lee Schales", "Ian Molloy"], "brief": "\u8bba\u6587\u63d0\u51fa BUGSTONE-E2E\uff0c\u628a\u5df2\u9a8c\u8bc1\u7684 CVE \u4fee\u590d\u63d0\u4ea4\u81ea\u52a8\u6316\u6398\u4e3a\u53ef\u590d\u7528\u68c0\u6d4b\u89c4\u5219\uff0c\u5e76\u5f62\u6210\u4ece\u5019\u9009\u679a\u4e3e\u3001LLM \u667a\u80fd\u4f53\u5ba1\u67e5\u5230\u8fd0\u884c\u65f6\u9a8c\u8bc1\u548c\u8865\u4e01\u751f\u6210\u7684\u7aef\u5230\u7aef\u6d41\u7a0b\u3002", "categories": ["cs.CR", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05335", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ece 2022-2026 \u5e74 19,325 \u4e2a\u9ad8\u5371 CVE \u4e2d\u5b9a\u4f4d 2,710 \u4e2a\u4fee\u590d\u63d0\u4ea4\uff0c\u6784\u5efa 1,033 \u6761\u68c0\u6d4b\u89c4\u5219\uff0c\u8986\u76d6 56 \u4e2a CWE \u5bb6\u65cf\uff0c\u5e76\u5c01\u88c5\u4e3a 172 \u4e2a\u6280\u80fd\u3002", "\u91c7\u7528\u6f0f\u6597\u5f0f\u68c0\u6d4b\u7ba1\u7ebf\uff1a\u5148\u7528 Tree-sitter \u548c\u8f7b\u91cf\u542f\u53d1\u5f0f\u5927\u89c4\u6a21\u7b5b\u9009\u5019\u9009\u70b9\uff0c\u518d\u5bf9\u5c11\u91cf\u76ee\u6807\u8c03\u7528 LLM \u667a\u80fd\u4f53\u8fdb\u884c\u89c4\u5219\u5f15\u5bfc\u5ba1\u67e5\u3002", "\u4e0d\u4ec5\u62a5\u544a\u7591\u4f3c\u6f0f\u6d1e\uff0c\u8fd8\u751f\u6210\u8fd0\u884c\u65f6\u9a8c\u8bc1\u4e0e\u4f5c\u7528\u57df\u68c0\u67e5\u8865\u4e01\uff0c\u5e76\u901a\u8fc7\u53cc\u5411\u5dee\u5206\u6d4b\u8bd5\u9a8c\u8bc1\u4fee\u590d\u6548\u679c\u3002"], "keywords": ["\u8f6f\u4ef6\u5b89\u5168", "\u6f0f\u6d1e\u68c0\u6d4b", "\u667a\u80fd\u4f53", "\u4ee3\u7801\u4fee\u590d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05335v1", "published_at": "2026-09-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The History Is the Detector: Executing CVE Patch History, End-to-End", "tldr": "\u5c06CVE\u4fee\u590d\u5386\u53f2\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u6f0f\u6d1e\u68c0\u6d4b\u89c4\u5219", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BUGSTONE-E2E\uff0c\u628a\u5df2\u9a8c\u8bc1\u7684 CVE \u4fee\u590d\u63d0\u4ea4\u81ea\u52a8\u6316\u6398\u4e3a\u53ef\u590d\u7528\u68c0\u6d4b\u89c4\u5219\uff0c\u5e76\u5f62\u6210\u4ece\u5019\u9009\u679a\u4e3e\u3001LLM \u667a\u80fd\u4f53\u5ba1\u67e5\u5230\u8fd0\u884c\u65f6\u9a8c\u8bc1\u548c\u8865\u4e01\u751f\u6210\u7684\u7aef\u5230\u7aef\u6d41\u7a0b\u3002", "why_notable": "\u5b83\u628a\u539f\u672c\u4e3b\u8981\u4f9b\u4eba\u9605\u8bfb\u7684\u6f0f\u6d1e\u5386\u53f2\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u3001\u53ef\u4fee\u590d\u7684\u81ea\u52a8\u5316\u5de5\u4f5c\u6d41\uff0c\u53ef\u590d\u7528\u5df2\u6709 CVE \u77e5\u8bc6\u53d1\u73b0\u672a\u62ab\u9732\u7684\u540c\u7c7b\u6f0f\u6d1e\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b89\u5168\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Retail search systems serve diverse geographic regions with distinct query patterns, vocabularies, and product preferences, creating significant data heterogeneity that challenges both privacy-preserving training and model personalization. Federated learning offers a natural solution for privacy, but standard FL methods produce global models that sacrifice regional performance, while existing personalized FL approaches operate at the parameter level and catastrophically collapse on modern transformers (below 10\\% accuracy on T5) due to tied embeddings and LayerNorm interactions. We introduce RegionFed, an \\textit{architecture-robust} federated learning framework that sidesteps this failure by operating entirely at the gradient level. RegionFed uses the $\\ell_2$ conflict between regional and global gradients as a unified signal that (i) diagnoses heterogeneity, (ii) routes each region to the cheapest sufficient personalization strategy, and (iii) adaptively controls personalization strength. Because it treats models as differentiable black boxes, RegionFed deploys on T5-Small, T5-3B, RoBERTa, and CNN with zero code changes, providing large gains on transformers (where parameter-level methods collapse) and consistent improvements on CNNs. Across three public datasets (Amazon ESCI, Amazon Reviews, LEAF-FEMNIST) and four architectures, RegionFed-Meta achieves 92.27\\%, closing the gap to the privacy-violating centralized upper bound (Centralized + Regional Weighting: 92.04\\%, $\u0394$=0.23pp, within 1$\u03c3$) while providing $(\u03b5{\\approx}0.60)$-differential privacy and $\\mathcal{O}(1/\\sqrt{T})$ convergence.", "arxiv_id": "2609.05403", "arxiv_url": "https://arxiv.org/abs/2609.05403", "authors": ["Quoc H. Nguyen", "Ali Lafzi", "Abhijeet Phatak", "Siddharth Pratap Singh", "Rohit Upadhyay", "Yogananda Domlur Seetharama", "Chittaranjan Tripathy"], "brief": "\u8bba\u6587\u63d0\u51fa RegionFed\uff0c\u4e00\u4e2a\u9762\u5411\u5f02\u6784\u96f6\u552e\u533a\u57df\u641c\u7d22/\u67e5\u8be2\u7406\u89e3\u7684\u4e2a\u6027\u5316\u8054\u90a6\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u4e0d\u5728\u53c2\u6570\u5c42\u505a\u4e2a\u6027\u5316\uff0c\u800c\u662f\u5728\u68af\u5ea6\u5c42\u5229\u7528\u533a\u57df\u68af\u5ea6\u4e0e\u5168\u5c40\u68af\u5ea6\u7684 L2 \u51b2\u7a81\u6765\u8bca\u65ad\u5f02\u8d28\u6027\u3001\u9009\u62e9\u4e2a\u6027\u5316\u7b56\u7565\u5e76\u8c03\u8282\u5f3a\u5ea6\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05403", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u4e0d\u540c\u5730\u533a\u67e5\u8be2\u6a21\u5f0f\u3001\u8bcd\u6c47\u548c\u5546\u54c1\u504f\u597d\u7684\u6570\u636e\u5f02\u8d28\u6027\uff0c\u5728\u4fdd\u62a4\u9690\u79c1\u7684\u540c\u65f6\u63d0\u5347\u533a\u57df\u4e2a\u6027\u5316\u6548\u679c\u3002", "\u907f\u514d\u4f20\u7edf\u53c2\u6570\u7ea7\u4e2a\u6027\u5316 FL \u5728 T5 \u7b49 Transformer \u4e0a\u56e0 tied embeddings \u548c LayerNorm \u4ea4\u4e92\u5bfc\u81f4\u7684\u6027\u80fd\u5d29\u6e83\u3002", "\u5728 Amazon ESCI\u3001Amazon Reviews\u3001LEAF-FEMNIST \u53ca T5-Small\u3001T5-3B\u3001RoBERTa\u3001CNN \u4e0a\u9a8c\u8bc1\uff0cRegionFed-Meta \u8fbe\u5230 92.27%\uff0c\u63a5\u8fd1\u96c6\u4e2d\u5f0f\u4e0a\u754c\uff0c\u5e76\u63d0\u4f9b\u7ea6 \u03b5=0.60 \u7684\u5dee\u5206\u9690\u79c1\u4e0e O(1/\u221aT) \u6536\u655b\u6027\u3002"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u4e2a\u6027\u5316", "\u9690\u79c1\u4fdd\u62a4", "\u67e5\u8be2\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05403v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RegionFed: Federated Learning for Personalized Query Understanding in Heterogeneous Retail Environments", "tldr": "\u7528\u68af\u5ea6\u51b2\u7a81\u5b9e\u73b0\u96f6\u6539\u52a8\u4e2a\u6027\u5316\u8054\u90a6\u5b66\u4e60\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RegionFed\uff0c\u4e00\u4e2a\u9762\u5411\u5f02\u6784\u96f6\u552e\u533a\u57df\u641c\u7d22/\u67e5\u8be2\u7406\u89e3\u7684\u4e2a\u6027\u5316\u8054\u90a6\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u4e0d\u5728\u53c2\u6570\u5c42\u505a\u4e2a\u6027\u5316\uff0c\u800c\u662f\u5728\u68af\u5ea6\u5c42\u5229\u7528\u533a\u57df\u68af\u5ea6\u4e0e\u5168\u5c40\u68af\u5ea6\u7684 L2 \u51b2\u7a81\u6765\u8bca\u65ad\u5f02\u8d28\u6027\u3001\u9009\u62e9\u4e2a\u6027\u5316\u7b56\u7565\u5e76\u8c03\u828
