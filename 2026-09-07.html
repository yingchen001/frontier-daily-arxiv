86 LLM \u8f85\u52a9\u542f\u53d1\u5f0f\u53d1\u73b0\u53ef\u7528\u4e8e\u66f4\u8d34\u8fd1\u771f\u5b9e\u786c\u4ef6\u4ee3\u4ef7\u7684\u91cf\u5b50\u7535\u8def\u7efc\u5408\u4f18\u5316\u3002"}, {"abstract": "We present a Hessian-based approach to numerically continue periodic orbits in dynamical systems. A loop (periodic orbit candidate) is parametrized as a Fourier series; a loss function is defined based on the deviation of the loop from the physical differential equations. Unlike previous work relying on hand-derived Jacobians, our method automates the process by leveraging automatic differentiation, a common machine learning technique. The continuation direction can be determined by the flat directions of the loss landscapes (directions with zero eigenvalues), making the search of periodic orbits efficient and guided. Our method is integrator-free, precisely initializes oscillations around unstable fixed points, and efficiently detects orbit family intersections and subharmonic bifurcations. As a demonstration, we present full continuations of periodic double pendulum oscillations from fixed points, showing bifurcations along orbit families and categorizing branches of periodic orbits. In particular, we find periodic orbits where both pendulum masses are never simultaneously at rest, which to our knowledge has been missing in the literature.", "arxiv_id": "2609.05337", "arxiv_url": "https://arxiv.org/abs/2609.05337", "authors": ["Leo Yao", "Ziming Liu", "Max Tegmark"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e Hessian \u7684\u5468\u671f\u8f68\u9053\u6570\u503c\u5ef6\u62d3\u65b9\u6cd5\uff0c\u5c06\u5019\u9009\u95ed\u5408\u8f68\u9053\u8868\u793a\u4e3a\u5085\u91cc\u53f6\u7ea7\u6570\uff0c\u5e76\u7528\u504f\u79bb\u52a8\u529b\u5b66\u65b9\u7a0b\u7684\u635f\u5931\u51fd\u6570\u523b\u753b\u8bef\u5dee\u3002\u65b9\u6cd5\u501f\u52a9\u81ea\u52a8\u5fae\u5206\u81ea\u52a8\u8ba1\u7b97\u6240\u9700\u5bfc\u6570\uff0c\u901a\u8fc7\u635f\u5931\u666f\u89c2\u7684\u96f6\u7279\u5f81\u503c\u5e73\u5766\u65b9\u5411\u5f15\u5bfc\u5468\u671f\u8f68\u9053\u65cf\u641c\u7d22\u3002", "categories": ["cs.LG", "math-ph", "nlin.CD", "physics.class-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05337", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u624b\u5de5\u63a8\u5bfc Jacobian\uff0c\u5229\u7528\u81ea\u52a8\u5fae\u5206\u5b9e\u73b0\u5468\u671f\u8f68\u9053\u5ef6\u62d3\u4e0e\u5206\u5c94\u68c0\u6d4b", "\u65b9\u6cd5\u4e0d\u4f9d\u8d56\u6570\u503c\u79ef\u5206\u5668\uff0c\u53ef\u7cbe\u786e\u521d\u59cb\u5316\u4e0d\u7a33\u5b9a\u56fa\u5b9a\u70b9\u9644\u8fd1\u7684\u632f\u8361", "\u5728\u53cc\u6446\u7cfb\u7edf\u4e2d\u5b8c\u6574\u5ef6\u62d3\u591a\u7c7b\u5468\u671f\u8f68\u9053\uff0c\u53d1\u73b0\u8f68\u9053\u65cf\u4ea4\u53c9\u3001\u6b21\u8c10\u6ce2\u5206\u5c94\u4ee5\u53ca\u6b64\u524d\u6587\u732e\u4e2d\u7f3a\u5931\u7684\u4e00\u7c7b\u5468\u671f\u89e3"], "keywords": ["\u52a8\u529b\u7cfb\u7edf", "\u81ea\u52a8\u5fae\u5206", "\u6570\u503c\u4f18\u5316", "\u975e\u7ebf\u6027\u52a8\u529b\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05337v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Variational Continuation for Double Pendulum Periodic Orbits", "tldr": "\u7528\u81ea\u52a8\u5fae\u5206\u5ef6\u62d3\u53cc\u6446\u5468\u671f\u8f68\u9053", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e Hessian \u7684\u5468\u671f\u8f68\u9053\u6570\u503c\u5ef6\u62d3\u65b9\u6cd5\uff0c\u5c06\u5019\u9009\u95ed\u5408\u8f68\u9053\u8868\u793a\u4e3a\u5085\u91cc\u53f6\u7ea7\u6570\uff0c\u5e76\u7528\u504f\u79bb\u52a8\u529b\u5b66\u65b9\u7a0b\u7684\u635f\u5931\u51fd\u6570\u523b\u753b\u8bef\u5dee\u3002\u65b9\u6cd5\u501f\u52a9\u81ea\u52a8\u5fae\u5206\u81ea\u52a8\u8ba1\u7b97\u6240\u9700\u5bfc\u6570\uff0c\u901a\u8fc7\u635f\u5931\u666f\u89c2\u7684\u96f6\u7279\u5f81\u503c\u5e73\u5766\u65b9\u5411\u5f15\u5bfc\u5468\u671f\u8f68\u9053\u65cf\u641c\u7d22\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u673a\u5668\u5b66\u4e60\u4e2d\u5e38\u7528\u7684\u81ea\u52a8\u5fae\u5206\u4e0e\u7ecf\u5178\u975e\u7ebf\u6027\u52a8\u529b\u5b66\u5468\u671f\u8f68\u9053\u5ef6\u62d3\u7ed3\u5408\uff0c\u964d\u4f4e\u4e86\u590d\u6742\u7cfb\u7edf\u5206\u6790\u7684\u63a8\u5bfc\u6210\u672c\uff0c\u5e76\u5c55\u793a\u4e86\u53d1\u73b0\u65b0\u5468\u671f\u8f68\u9053\u7ed3\u6784\u7684\u80fd\u529b\u3002"}, {"abstract": "Vision-language-action (VLA) models can execute short manipulation skills, but remain brittle in long-horizon procedures requiring persistent task state, dependency-aware reasoning, conditional decisions, and reliable grounding. We investigate a neuro-symbolic framework that combines learned VLA control with explicit task graphs and multimodal procedural memory. Task graphs encode action dependencies, valid transitions, and branch conditions, while memory maintains the active step, completed actions, textual context, and task-relevant visual evidence. Together, these structures guide object selection, destination grounding, subgoal dispatch, and verification of expected state transitions. Human demonstrations provide additional spatial and temporal guidance through gaze or saliency cues. To isolate their effect on policy learning, our initial study bypasses cross-view gaze transfer and directly annotates pseudo-gaze in robot-view teleoperation videos. The resulting guidance is used during VLA fine-tuning and inference. We study two long-horizon manipulation domains, workspace clearing and surgical-instrument handling, which require ordered execution, visually grounded decisions, and conditional branching. We evaluate correct-object and destination selection, subtask completion, task progress, step-order consistency, complete-task success, and procedural or execution mistakes. This work positions structured symbolic reasoning and demonstration-derived visual guidance as complementary mechanisms for reliable long-horizon VLA manipulation.", "arxiv_id": "2609.05369", "arxiv_url": "https://arxiv.org/abs/2609.05369", "authors": ["Vivek Chavan", "Yahuan Shi", "Oliver Heimann", "Kevin Haninger", "J\u00f6rg Kr\u00fcger"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u65f6\u7a0b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u64cd\u4f5c\u7684\u795e\u7ecf\u7b26\u53f7\u6846\u67b6\uff0c\u5c06\u5b66\u4e60\u5230\u7684VLA\u63a7\u5236\u4e0e\u663e\u5f0f\u4efb\u52a1\u56fe\u3001\u591a\u6a21\u6001\u8fc7\u7a0b\u8bb0\u5fc6\u7ed3\u5408\u3002\u8be5\u6846\u67b6\u7528\u4e8e\u7ef4\u62a4\u4efb\u52a1\u72b6\u6001\u3001\u5904\u7406\u4f9d\u8d56\u4e0e\u5206\u652f\uff0c\u5e76\u901a\u8fc7\u6f14\u793a\u4e2d\u7684\u4f2a\u51dd\u89c6/\u663e\u8457\u6027\u7ebf\u7d22\u589e\u5f3a\u7269\u4f53\u4e0e\u76ee\u6807\u4f4d\u7f6e grounding\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05369", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u7528\u4efb\u52a1\u56fe\u7f16\u7801\u52a8\u4f5c\u4f9d\u8d56\u3001\u5408\u6cd5\u8f6c\u79fb\u4e0e\u6761\u4ef6\u5206\u652f\uff0c\u7f13\u89e3\u957f\u6d41\u7a0b\u4efb\u52a1\u4e2d\u7684\u6b65\u9aa4\u6df7\u4e71\u4e0e\u72b6\u6001\u9057\u5fd8", "\u5f15\u5165\u591a\u6a21\u6001\u8fc7\u7a0b\u8bb0\u5fc6\uff0c\u8bb0\u5f55\u5f53\u524d\u6b65\u9aa4\u3001\u5df2\u5b8c\u6210\u52a8\u4f5c\u3001\u6587\u672c\u4e0a\u4e0b\u6587\u548c\u5173\u952e\u89c6\u89c9\u8bc1\u636e\uff0c\u7528\u4e8e\u5b50\u76ee\u6807\u6d3e\u53d1\u4e0e\u72b6\u6001\u9a8c\u8bc1", "\u5728\u5de5\u4f5c\u533a\u6e05\u7406\u548c\u624b\u672f\u5668\u68b0\u5904\u7406\u4e24\u7c7b\u957f\u65f6\u7a0b\u64cd\u4f5c\u4efb\u52a1\u4e0a\u8bc4\u4f30\u7269\u4f53\u9009\u62e9\u3001\u76ee\u6807\u9009\u62e9\u3001\u4efb\u52a1\u8fdb\u5ea6\u3001\u987a\u5e8f\u4e00\u81f4\u6027\u548c\u5b8c\u6574\u6210\u529f\u7387"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u795e\u7ecf\u7b26\u53f7", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba\u64cd\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05369v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Towards Neuro-Symbolic Procedural Reasoning for Long-Horizon Vision-Language-Action Manipulation", "tldr": "\u795e\u7ecf\u7b26\u53f7\u6846\u67b6\u63d0\u5347\u957f\u7a0bVLA\u64cd\u4f5c\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u957f\u65f6\u7a0b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u64cd\u4f5c\u7684\u795e\u7ecf\u7b26\u53f7\u6846\u67b6\uff0c\u5c06\u5b66\u4e60\u5230\u7684VLA\u63a7\u5236\u4e0e\u663e\u5f0f\u4efb\u52a1\u56fe\u3001\u591a\u6a21\u6001\u8fc7\u7a0b\u8bb0\u5fc6\u7ed3\u5408\u3002\u8be5\u6846\u67b6\u7528\u4e8e\u7ef4\u62a4\u4efb\u52a1\u72b6\u6001\u3001\u5904\u7406\u4f9d\u8d56\u4e0e\u5206\u652f\uff0c\u5e76\u901a\u8fc7\u6f14\u793a\u4e2d\u7684\u4f2a\u51dd\u89c6/\u663e\u8457\u6027\u7ebf\u7d22\u589e\u5f3a\u7269\u4f53\u4e0e\u76ee\u6807\u4f4d\u7f6e grounding\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u7b26\u53f7\u5316\u8fc7\u7a0b\u63a8\u7406\u3001\u89c6\u89c9\u8bc1\u636e\u8bb0\u5fc6\u4e0eVLA\u7b56\u7565\u7ed3\u5408\uff0c\u9488\u5bf9\u957f\u65f6\u7a0b\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u5e38\u89c1\u7684\u72b6\u6001\u4fdd\u6301\u3001\u6761\u4ef6\u51b3\u7b56\u548c\u53ef\u9760 grounding \u95ee\u9898\u63d0\u4f9b\u4e86\u7cfb\u7edf\u6027\u601d\u8def\uff0c\u5177\u6709\u63d0\u5347\u5b9e\u9645\u673a\u5668\u4eba\u4efb\u52a1\u6267\u884c\u7a33\u5b9a\u6027\u7684\u6f5c\u529b\u3002"}, {"abstract": "Palynomorphs (microscopic, organic-walled fossils such as pollen, spores, and dinoflagellates) are important high-resolution records of past climates and are critical to the study of ancient ecosystems. Existing methods rely on manual analysis of high-resolution, multifocal digital microscopy images, which is slow and time-consuming and requires researchers to compromise on the scale of their investigations. To the best of our knowledge, our work proposes the first ever scalable end-to-end pipeline for automated palynomorph detection in whole slide images that addresses this bottleneck through: (1) efficient methods for decomposing and compressing digitized multifocal microscope slide images into tractable 2-dimensional tiles for analysis; (2) benchmarking modern object detection models, including RF-DETR, for the detection of palynomorphs, achieving an AP@50 of 0.879; (3) an efficient algorithm for the synthesis of detection outputs across large-scale, high-resolution images; and (4) an I/O optimization resulting in faster inference time. Our methods drastically reduce the time required for palynomorph detection in a single slide from often days of manual inspection to under one hour of automated analysis, enabling palynological research at a substantially greater scale.", "arxiv_id": "2609.05323", "arxiv_url": "https://arxiv.org/abs/2609.05323", "authors": ["Abbas Shaikh", "Praise Mayor", "Patrick Ainlay-Vazquez", "Aditya Viswanathan", "Teon Golden", "Eric Zhang", "Ingrid C. Romero", "Alexander E. White", "Scott Wing", "Arko Barman"], "brief": "\u8bba\u6587\u63d0\u51fa\u9996\u4e2a\u9762\u5411\u591a\u7126\u6570\u5b57\u663e\u5fae\u5168\u5207\u7247\u56fe\u50cf\u7684\u5b62\u7c89\u5316\u77f3\u81ea\u52a8\u68c0\u6d4b\u7aef\u5230\u7aef\u6d41\u6c34\u7ebf\u3002\u5b83\u5c06\u9ad8\u5206\u8fa8\u7387\u591a\u7126\u56fe\u50cf\u5206\u89e3\u538b\u7f29\u4e3a\u53ef\u5904\u7406\u7684\u4e8c\u7ef4\u56fe\u5757\uff0c\u5e76\u7528\u73b0\u4ee3\u76ee\u6807\u68c0\u6d4b\u6a21\u578b\u5b8c\u6210\u5927\u89c4\u6a21\u68c0\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05323", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u8bbe\u8ba1\u4e86\u591a\u7126\u663e\u5fae\u5168\u5207\u7247\u56fe\u50cf\u7684\u9ad8\u6548\u5206\u89e3\u4e0e\u538b\u7f29\u65b9\u6cd5\uff0c\u5c06\u590d\u6742\u6570\u636e\u8f6c\u4e3a\u53ef\u5206\u6790\u7684\u4e8c\u7ef4\u56fe\u5757", "\u57fa\u51c6\u6d4b\u8bd5 RF-DETR \u7b49\u76ee\u6807\u68c0\u6d4b\u6a21\u578b\uff0c\u5b62\u7c89\u68c0\u6d4b\u8fbe\u5230 AP@50 0.879", "\u63d0\u51fa\u8de8\u5927\u5c3a\u5ea6\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\u5408\u6210\u68c0\u6d4b\u7ed3\u679c\u7684\u7b97\u6cd5\uff0c\u5e76\u901a\u8fc7 I/O \u4f18\u5316\u52a0\u901f\u63a8\u7406"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u76ee\u6807\u68c0\u6d4b", "\u6570\u5b57\u75c5\u7406", "\u79d1\u5b66\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05323v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Scalable Detection of Fossil Palynomorphs in Multifocal Digital Microscopy Images", "tldr": "\u81ea\u52a8\u68c0\u6d4b\u663e\u5fae\u5207\u7247\u4e2d\u7684\u5316\u77f3\u5b62\u7c89", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u9996\u4e2a\u9762\u5411\u591a\u7126\u6570\u5b57\u663e\u5fae\u5168\u5207\u7247\u56fe\u50cf\u7684\u5b62\u7c89\u5316\u77f3\u81ea\u52a8\u68c0\u6d4b\u7aef\u5230\u7aef\u6d41\u6c34\u7ebf\u3002\u5b83\u5c06\u9ad8\u5206\u8fa8\u7387\u591a\u7126\u56fe\u50cf\u5206\u89e3\u538b\u7f29\u4e3a\u53ef\u5904\u7406\u7684\u4e8c\u7ef4\u56fe\u5757\uff0c\u5e76\u7528\u73b0\u4ee3\u76ee\u6807\u68c0\u6d4b\u6a21\u578b\u5b8c\u6210\u5927\u89c4\u6a21\u68c0\u6d4b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u5355\u5f20\u5207\u7247\u7684\u5b62\u7c89\u68c0\u6d4b\u4ece\u4eba\u5de5\u6570\u5929\u7f29\u77ed\u5230\u81ea\u52a8\u5316\u4e00\u5c0f\u65f6\u5185\uff0c\u663e\u8457\u63d0\u5347\u53e4\u6c14\u5019\u4e0e\u53e4\u751f\u6001\u7814\u7a76\u7684\u6570\u636e\u5904\u7406\u89c4\u6a21\u548c\u6548\u7387\u3002"}, {"abstract": "Few-shot action recognition (FSAR) aims to recognize unseen action categories with only a small number of annotated video samples. Recent works typically apply single-prototype supervision at the network output and fail to sufficiently exploit rich cross-frame global spatial information in videos. Even existing multi-level metric schemes only impose parallel prototype constraints on intermediate layers, without progressive supervision along the full feature pipeline, which results in limited generalization ability of the learned class prototypes. Inspired by this, we present a novel method, hierarchical metric learning for few-shot action recognition (HML-FSAR). First, a spatial-enhanced module is developed to capture cross-frame global spatial representations. Combined with temporal MHA, heterogeneous alignment, spatial-temporal feature fusion and dictionary learning modules, it constructs the complete feature processing pipeline. Second, a hierarchical metric learning (HML) strategy is embedded into HML-FSAR. Composed of center metric, alignment metric, contrastive metric, dictionary metric and prototype metric, HML imposes progressive multi-stage complementary constraints from frame-level representations to final class prototypes, so as to jointly optimize feature compactness, heterogeneous spatial-temporal alignment, inter-class discriminability and anti-noise robustness. The proposed HML-FSAR method is validated on five widely-used FSAR datasets, and experimental results fully demonstrate its effectiveness.", "arxiv_id": "2609.05242", "arxiv_url": "https://arxiv.org/abs/2609.05242", "authors": ["Jiaxin Zhang", "Haoran Gao", "Xizhan Gao", "Zihao Dong", "Tingwei Wang", "Sijie Niu"], "brief": "\u8bba\u6587\u63d0\u51fa HML-FSAR\uff0c\u7528\u4e8e\u5c0f\u6837\u672c\u89c6\u9891\u52a8\u4f5c\u8bc6\u522b\u3002\u65b9\u6cd5\u901a\u8fc7\u7a7a\u95f4\u589e\u5f3a\u3001\u65f6\u5e8f\u6ce8\u610f\u529b\u3001\u5f02\u6784\u5bf9\u9f50\u3001\u65f6\u7a7a\u878d\u5408\u4e0e\u5b57\u5178\u5b66\u4e60\u6784\u5efa\u5b8c\u6574\u7279\u5f81\u7ba1\u7ebf\uff0c\u5e76\u5728\u591a\u9636\u6bb5\u52a0\u5165\u5c42\u7ea7\u5ea6\u91cf\u76d1\u7763\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05242", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u8bbe\u8ba1\u7a7a\u95f4\u589e\u5f3a\u6a21\u5757\uff0c\u6355\u83b7\u8de8\u5e27\u5168\u5c40\u7a7a\u95f4\u4fe1\u606f\uff0c\u5f25\u8865\u4ec5\u4f9d\u8d56\u8f93\u51fa\u539f\u578b\u76d1\u7763\u7684\u4e0d\u8db3", "\u63d0\u51fa\u5c42\u7ea7\u5ea6\u91cf\u5b66\u4e60\u7b56\u7565\uff0c\u5305\u542b\u4e2d\u5fc3\u5ea6\u91cf\u3001\u5bf9\u9f50\u5ea6\u91cf\u3001\u5bf9\u6bd4\u5ea6\u91cf\u3001\u5b57\u5178\u5ea6\u91cf\u548c\u539f\u578b\u5ea6\u91cf", "\u5728\u4e94\u4e2a\u5e38\u7528\u5c0f\u6837\u672c\u52a8\u4f5c\u8bc6\u522b\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\uff0c\u63d0\u5347\u7c7b\u5185\u7d27\u51d1\u6027\u3001\u7c7b\u95f4\u53ef\u5206\u6027\u4e0e\u6297\u566a\u80fd\u529b"], "keywords": ["\u5c0f\u6837\u672c\u5b66\u4e60", "\u89c6\u9891\u7406\u89e3", "\u5ea6\u91cf\u5b66\u4e60", "\u52a8\u4f5c\u8bc6\u522b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05242v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Few-Shot Video Recognition via Hierarchical Metric Learning", "tldr": "\u5c42\u7ea7\u5ea6\u91cf\u5b66\u4e60\u63d0\u5347\u5c0f\u6837\u672c\u52a8\u4f5c\u8bc6\u522b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HML-FSAR\uff0c\u7528\u4e8e\u5c0f\u6837\u672c\u89c6\u9891\u52a8\u4f5c\u8bc6\u522b\u3002\u65b9\u6cd5\u901a\u8fc7\u7a7a\u95f4\u589e\u5f3a\u3001\u65f6\u5e8f\u6ce8\u610f\u529b\u3001\u5f02\u6784\u5bf9\u9f50\u3001\u65f6\u7a7a\u878d\u5408\u4e0e\u5b57\u5178\u5b66\u4e60\u6784\u5efa\u5b8c\u6574\u7279\u5f81\u7ba1\u7ebf\uff0c\u5e76\u5728\u591a\u9636\u6bb5\u52a0\u5165\u5c42\u7ea7\u5ea6\u91cf\u76d1\u7763\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5c06\u76d1\u7763\u4ece\u6700\u7ec8\u539f\u578b\u6269\u5c55\u5230\u7279\u5f81\u5904\u7406\u5168\u6d41\u7a0b\uff0c\u80fd\u66f4\u5145\u5206\u5229\u7528\u89c6\u9891\u7684\u65f6\u7a7a\u7ed3\u6784\uff0c\u5bf9\u63d0\u5347\u5c0f\u6837\u672c\u52a8\u4f5c\u8bc6\u522b\u7684\u6cdb\u5316\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Diffusion TV is an interactive AI art installation that offers a tangible and embodied experience of diffusion models through a modified CRT TV. By physically manipulating the TV\u0027s antenna, audiences control the clarity of AI-generated images and sounds, metaphorically enacting the denoising process that underlies diffusion-based generation. Using the tuning knob, participants switch between three channels featuring AI-generated animals from the Past (extinct species), Present (endangered species), and Future (speculative creatures), situating the interaction within a temporal and ecological narrative. Through continuous audiovisual feedback and physical interaction, Diffusion TV foregrounds the generative process over final outputs, allowing audiences to explore intermediate states as experiential material. Rather than providing explicit technical explanation, the work presents an alternative, embodied mode of explainable AI that invites exploratory engagement with and reflection on generative technologies.", "arxiv_id": "2609.05404", "arxiv_url": "https://arxiv.org/abs/2609.05404", "authors": ["Sihwa Park"], "brief": "\u8bba\u6587\u4ecb\u7ecd\u4e86\u4e00\u4e2a\u540d\u4e3a Diffusion TV \u7684\u4e92\u52a8 AI \u827a\u672f\u88c5\u7f6e\uff1a\u901a\u8fc7\u6539\u9020 CRT \u7535\u89c6\uff0c\u8ba9\u89c2\u4f17\u7528\u5929\u7ebf\u548c\u65cb\u94ae\u4ee5\u8eab\u4f53\u5316\u65b9\u5f0f\u4f53\u9a8c\u6269\u6563\u6a21\u578b\u751f\u6210\u56fe\u50cf\u4e0e\u58f0\u97f3\u7684\u8fc7\u7a0b\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05404", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": ["\u89c2\u4f17\u901a\u8fc7\u7269\u7406\u64cd\u63a7\u7535\u89c6\u5929\u7ebf\uff0c\u63a7\u5236 AI \u751f\u6210\u56fe\u50cf\u548c\u58f0\u97f3\u7684\u6e05\u6670\u5ea6\uff0c\u5bf9\u5e94\u6269\u6563\u6a21\u578b\u4e2d\u7684\u53bb\u566a\u8fc7\u7a0b", "\u8c03\u8c10\u65cb\u94ae\u53ef\u5207\u6362\u4e09\u4e2a\u9891\u9053\uff1a\u8fc7\u53bb\u7684\u706d\u7edd\u52a8\u7269\u3001\u73b0\u5728\u7684\u6fd2\u5371\u52a8\u7269\u3001\u672a\u6765\u7684\u60f3\u8c61\u751f\u7269", "\u88c5\u7f6e\u5f3a\u8c03\u751f\u6210\u8fc7\u7a0b\u4e2d\u7684\u4e2d\u95f4\u72b6\u6001\uff0c\u800c\u975e\u53ea\u5c55\u793a\u6700\u7ec8\u751f\u6210\u7ed3\u679c\uff0c\u63d0\u4f9b\u4e00\u79cd\u5177\u8eab\u5316\u7684\u53ef\u89e3\u91ca AI \u4f53\u9a8c"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u4eba\u673a\u4ea4\u4e92", "\u53ef\u89e3\u91caAI", "\u751f\u6210\u5f0fAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05404v1", "published_at": "2026-09-04", "score": 0.1, "selected_reasons": [], "thumbnail": null, "title": "Diffusion TV: Experiencing Diffusion Models through Tangible, Embodied Interaction", "tldr": "\u7528\u5b9e\u4f53\u7535\u89c6\u4ea4\u4e92\u4f53\u9a8c\u6269\u6563\u6a21\u578b\u53bb\u566a\u8fc7\u7a0b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd\u4e86\u4e00\u4e2a\u540d\u4e3a Diffusion TV \u7684\u4e92\u52a8 AI \u827a\u672f\u88c5\u7f6e\uff1a\u901a\u8fc7\u6539\u9020 CRT \u7535\u89c6\uff0c\u8ba9\u89c2\u4f17\u7528\u5929\u7ebf\u548c\u65cb\u94ae\u4ee5\u8eab\u4f53\u5316\u65b9\u5f0f\u4f53\u9a8c\u6269\u6563\u6a21\u578b\u751f\u6210\u56fe\u50cf\u4e0e\u58f0\u97f3\u7684\u8fc7\u7a0b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u6269\u6563\u6a21\u578b\u7684\u6280\u672f\u673a\u5236\u8f6c\u5316\u4e3a\u53ef\u89e6\u6478\u3001\u53ef\u611f\u77e5\u7684\u516c\u5171\u827a\u672f\u4f53\u9a8c\uff0c\u4e3a\u751f\u6210\u5f0f AI \u7684\u89e3\u91ca\u3001\u6559\u80b2\u4e0e\u516c\u4f17\u53c2\u4e0e\u63d0\u4f9b\u4e86\u4e0d\u540c\u4e8e\u6587\u5b57\u8bf4\u660e\u6216\u53ef\u89c6\u5316\u56fe\u8868\u7684\u65b0\u8def\u5f84\u3002"}, {"abstract": "The integration of GenAI tools into higher education assessment raises important questions about how students understand, interpret, and respond to AI-mediated evaluation. As instructors increasingly explore AI tools for providing feedback, prior research has examined whether GenAI-generated feedback improves writing performance and how students perceive its usefulness; comparatively little is known, however, about how students interpret such evaluation when they are explicitly informed that an AI system, rather than a human instructor, produced the feedback and the score. This study reports findings from a qualitative pedagogical inquiry conducted in an undergraduate technical communication course for computing students at a Saudi public university. Thirteen male undergraduate computing students completed an in-class handwritten writing task; the scanned submissions were evaluated by ChatGPT using a rubric-based prompt aligned with the task objectives. Students were then explicitly informed that ChatGPT had generated the score and feedback and were invited to reflect on the evaluation in writing. Inductive thematic analysis of these reflections identified four themes: perceived usefulness of feedback; awareness of AI\u0027s contextual and pedagogical limitations; conditional trust, distinguishing feedback utility from evaluative authority; and reflection on the institutional and pedagogical role of the human instructor. Participants accepted GenAI feedback as useful for surface-level revision but consistently positioned the human instructor as the appropriate authority over grading decisions. The study identifies this as a distinction between feedback utility and evaluative authority, two judgments that students treat as analytically separate rather than as opposite ends of a single approval scale...", "arxiv_id": "2609.05346", "arxiv_url": "https://arxiv.org/abs/2609.05346", "authors": ["Rayed AlGhamdi"], "brief": "\u672c\u6587\u7814\u7a76\u9ad8\u7b49\u6559\u80b2\u4e2d\u5b66\u751f\u5982\u4f55\u770b\u5f85\u900f\u660e\u544a\u77e5\u7684AI\u8f85\u52a9\u5199\u4f5c\u8bc4\u4ef7\u3002\u7814\u7a76\u8ba913\u540d\u6c99\u7279\u516c\u7acb\u5927\u5b66\u8ba1\u7b97\u673a\u4e13\u4e1a\u672c\u79d1\u751f\u5b8c\u6210\u5199\u4f5c\u4efb\u52a1\uff0c\u5e76\u7531ChatGPT\u6309\u91cf\u89c4\u8bc4\u5206\u4e0e\u53cd\u9988\uff0c\u518d\u5206\u6790\u5b66\u751f\u53cd\u601d\u6587\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05346", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": ["\u5f52\u7eb3\u51fa\u56db\u7c7b\u4e3b\u9898\uff1a\u53cd\u9988\u6709\u7528\u6027\u3001\u5bf9AI\u60c5\u5883\u4e0e\u6559\u5b66\u5c40\u9650\u7684\u8ba4\u8bc6\u3001\u6761\u4ef6\u6027\u4fe1\u4efb\u3001\u5bf9\u6559\u5e08\u89d2\u8272\u7684\u518d\u786e\u8ba4", "\u5b66\u751f\u666e\u904d\u8ba4\u4e3aChatGPT\u53cd\u9988\u53ef\u7528\u4e8e\u8868\u5c42\u4fee\u6539\u548c\u6539\u8fdb\u8868\u8fbe\uff0c\u4f46\u4e0d\u5e94\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u5206\u6743\u5a01", "\u63d0\u51fa\u201c\u53cd\u9988\u6548\u7528\u201d\u4e0e\u201c\u8bc4\u4ef7\u6743\u5a01\u201d\u7684\u533a\u5206\uff0c\u8bf4\u660e\u5b66\u751f\u5e76\u975e\u7b80\u5355\u5730\u63a5\u53d7\u6216\u62d2\u7eddAI\u8bc4\u4ef7"], "keywords": ["\u6559\u80b2AI", "\u751f\u6210\u5f0fAI", "\u5199\u4f5c\u8bc4\u4f30", "\u4eba\u673a\u534f\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05346v1", "published_at": "2026-09-04", "score": 0.1, "selected_reasons": [], "thumbnail": null, "title": "Who Should Grade My Work? Student Perspectives on Transparent AI-Assisted Writing Assessment in Higher Education", "tldr": "\u5b66\u751f\u8ba4\u53efAI\u53cd\u9988\uff0c\u4f46\u4e0d\u613f\u4ea4\u51fa\u8bc4\u5206\u6743", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u9ad8\u7b49\u6559\u80b2\u4e2d\u5b66\u751f\u5982\u4f55\u770b\u5f85\u900f\u660e\u544a\u77e5\u7684AI\u8f85\u52a9\u5199\u4f5c\u8bc4\u4ef7\u3002\u7814\u7a76\u8ba913\u540d\u6c99\u7279\u516c\u7acb\u5927\u5b66\u8ba1\u7b97\u673a\u4e13\u4e1a\u672c\u79d1\u751f\u5b8c\u6210\u5199\u4f5c\u4efb\u52a1\uff0c\u5e76\u7531ChatGPT\u6309\u91cf\u89c4\u8bc4\u5206\u4e0e\u53cd\u9988\uff0c\u518d\u5206\u6790\u5b66\u751f\u53cd\u601d\u6587\u672c\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3aAI\u8f85\u52a9\u6559\u80b2\u8bc4\u4ef7\u63d0\u4f9b\u4e86\u5b66\u751f\u89c6\u89d2\u8bc1\u636e\uff0c\u5f3a\u8c03\u900f\u660e\u544a\u77e5\u4e0b\u5b66\u751f\u5bf9AI\u53cd\u9988\u548c\u8bc4\u5206\u6743\u7684\u5dee\u5f02\u5316\u6001\u5ea6\uff0c\u5bf9\u9ad8\u6821\u90e8\u7f72GenAI\u8bc4\u9605\u7cfb\u7edf\u5177\u6709\u5b9e\u8df5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "We present a system that uses a Vision-Language Model (VLM) as a diagnostic agent for adapting a detect-to-track pipeline to a new target domain without access to target-domain labels. Rather than optimizing against annotated metrics, the VLM directly inspects rendered tracking outputs, identifies visual failure modes, and recommends parameter updates through an iterative tuning loop. We first demonstrate that ground-truth-supervised hyperparameter transfer can be brittle. On MOT17-\u003eMOT20, applying a source-derived oracle configuration reduces mean HOTA by 0.090, from a target-domain ceiling of 0.357, to 0.267. Without using any target-domain labels, our VLM-based tuner recovers 67.8% of this lost headroom, finishing within 0.029 HOTA of the target ceiling; on the highest-density target sequence, it recovers up to 86.7%. We further show that label-free Bayesian optimization with handcrafted proxy objectives struggles under large domain shifts and can degrade configurations that are already strong. In contrast, the VLM tuner acts selectively: when its visual diagnosis reveals no clear failure mode, it declines to modify the configuration, preserving performance on easy transfers while improving hard ones. Finally, we characterize the conditions under which this approach succeeds, namely, when domain shift manifests through exposed detection-level parameters, versus where it is less effective, such as MOT17-\u003eDanceTrack, where the source oracle is already near-optimal.", "arxiv_id": "2609.05239", "arxiv_url": "https://arxiv.org/abs/2609.05239", "authors": ["Daniel Davila", "Ravikumar Balakrishnan", "Mike Cochran"], "brief": "\u672c\u6587\u63d0\u51fa\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u8bca\u65ad\u667a\u80fd\u4f53\uff0c\u5728\u65e0\u76ee\u6807\u57df\u6807\u7b7e\u7684\u60c5\u51b5\u4e0b\u68c0\u67e5\u8ddf\u8e2a\u53ef\u89c6\u5316\u7ed3\u679c\u3001\u8bc6\u522b\u5931\u8d25\u6a21\u5f0f\u5e76\u8fed\u4ee3\u8c03\u6574\u68c0\u6d4b\u5230\u8ddf\u8e2a\u6d41\u6c34\u7ebf\u53c2\u6570\u3002\u5b9e\u9a8c\u663e\u793a\u5728 MOT17\u2192MOT20 \u4e0a\u53ef\u6062\u590d\u56e0\u8de8\u57df\u8fc1\u79fb\u635f\u5931\u7684\u7ea6 67.8% HOTA \u7a7a\u95f4\uff0c\u9ad8\u5bc6\u5ea6\u5e8f\u5217\u6700\u9ad8 86.7%\uff0c\u4e14\u76f8\u6bd4\u65e0\u6807\u7b7e\u8d1d\u53f6\u65af\u4f18\u5316\u66f4\u80fd\u9009\u62e9\u6027\u5730\u907f\u514d\u7834\u574f\u5df2\u6709\u5f3a\u914d\u7f6e\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05239", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u591a\u76ee\u6807\u8ddf\u8e2a", "\u65e0\u76d1\u7763\u57df\u9002\u5e94"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05239v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cross-Domain Tracker Adaptation Without Target-Domain Labels via Vision-Language Agents", "tldr": "\u672c\u6587\u63d0\u51fa\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u8bca\u65ad\u667a\u80fd\u4f53\uff0c\u5728\u65e0\u76ee\u6807\u57df\u6807\u7b7e\u7684\u60c5\u51b5\u4e0b\u68c0\u67e5\u8ddf\u8e2a\u53ef\u89c6\u5316\u7ed3\u679c\u3001\u8bc6\u522b\u5931\u8d25\u6a21\u5f0f\u5e76\u8fed\u4ee3\u8c03\u6574\u68c0\u6d4b\u5230\u8ddf\u8e2a\u6d41\u6c34\u7ebf\u53c2\u6570\u3002\u5b9e\u9a8c\u663e\u793a\u5728 MOT17\u2192MOT20 \u4e0a\u53ef\u6062\u590d\u56e0\u8de8\u57df\u8fc1\u79fb\u635f\u5931\u7684\u7ea6 67.8% HOTA \u7a7a\u95f4\uff0c\u9ad8\u5bc6\u5ea6\u5e8f\u5217\u6700\u9ad8 86.7%\uff0c\u4e14\u76f8\u6bd4\u65e0\u6807\u7b7e\u8d1d\u53f6\u65af\u4f18\u5316\u66f4\u80fd\u9009\u62e9\u6027\u5730\u907f\u514d\u7834\u574f\u5df2\u6709\u5f3a\u914d\u7f6e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Continuous sliders are useful only when coefficient changes produce predictable image changes. Yet most diffusion sliders derive their axes from text or learned representations, leaving their scales disconnected from observable image properties. Consequently, we cannot tell in advance which attributes are learnable, compare control strengths directly, or anticipate interference when multiple controls are combined. We propose Measured Sliders, a framework that defines continuous controls through closed-form differentiable image measurements. A common measurement space unifies the pipeline. Before training, an observability test identifies usable supervision. During training, a measurement-guided objective learns target movement while suppressing non-target changes. After training, decoded calibration expresses controls in comparable units of realized image change. Multiple LoRA branches are stored in one checkpoint and composed without training on joint activations. Across SDXL and FLUX.1-dev, the resulting controls are ordered, selective, and composable. On 553 prompts, lighting direction reaches rho = 0.995 and 98.9% monotone sweeps. A five-attribute checkpoint achieves average selectivity 2.59, compared with 1.50 for the strongest baseline, and preserves every requested direction in 96.7% of pair and 86.1% of triple compositions. The observability test also separates every subsequently successful measurement from the failed candidate. Overall, image-space measurement provides a common basis for learning, diagnosing, calibrating, and composing continuous generative controls.", "arxiv_id": "2609.05234", "arxiv_url": "https://arxiv.org/abs/2609.05234", "authors": ["Yijia Chen", "Boyu Wei", "Xuanhua Yin"], "brief": "\u8bba\u6587\u63d0\u51fa Measured Sliders\uff0c\u7528\u53ef\u5fae\u7684\u56fe\u50cf\u6d4b\u91cf\u6765\u5b9a\u4e49\u548c\u8bad\u7ec3\u6269\u6563\u6a21\u578b\u7684\u8fde\u7eed\u63a7\u5236\u6ed1\u6746\uff0c\u4f7f\u63a7\u5236\u5c3a\u5ea6\u76f4\u63a5\u5bf9\u5e94\u53ef\u89c2\u5bdf\u7684\u56fe\u50cf\u5c5e\u6027\u53d8\u5316\u3002\u8be5\u65b9\u6cd5\u5305\u542b\u53ef\u89c2\u6d4b\u6027\u6d4b\u8bd5\u3001\u6d4b\u91cf\u5f15\u5bfc\u8bad\u7ec3\u548c\u89e3\u7801\u6821\u51c6\uff0c\u5728 SDXL \u4e0e FLUX.1-dev \u4e0a\u5b9e\u73b0\u4e86\u66f4\u6709\u5e8f\u3001\u9009\u62e9\u6027\u66f4\u5f3a\u4e14\u53ef\u7ec4\u5408\u7684\u63a7\u5236\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05234", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u53ef\u63a7\u751f\u6210", "\u56fe\u50cf\u6d4b\u91cf", "LoRA"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05234v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Measured Sliders: Learning Continuous Controls from Differentiable Image Measurements", "tldr": "\u8bba\u6587\u63d0\u51fa Measured Sliders\uff0c\u7528\u53ef\u5fae\u7684\u56fe\u50cf\u6d4b\u91cf\u6765\u5b9a\u4e49\u548c\u8bad\u7ec3\u6269\u6563\u6a21\u578b\u7684\u8fde\u7eed\u63a7\u5236\u6ed1\u6746\uff0c\u4f7f\u63a7\u5236\u5c3a\u5ea6\u76f4\u63a5\u5bf9\u5e94\u53ef\u89c2\u5bdf\u7684\u56fe\u50cf\u5c5e\u6027\u53d8\u5316\u3002\u8be5\u65b9\u6cd5\u5305\u542b\u53ef\u89c2\u6d4b\u6027\u6d4b\u8bd5\u3001\u6d4b\u91cf\u5f15\u5bfc\u8bad\u7ec3\u548c\u89e3\u7801\u6821\u51c6\uff0c\u5728 SDXL \u4e0e FLUX.1-dev \u4e0a\u5b9e\u73b0\u4e86\u66f4\u6709\u5e8f\u3001\u9009\u62e9\u6027\u66f4\u5f3a\u4e14\u53ef\u7ec4\u5408\u7684\u63a7\u5236\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent hybrid Structure-from-Motion (SfM) systems combine the robustness of feed-forward 3D reconstruction with the accuracy of traditional bundle adjustment (BA) with pixel matching. They are usually the best performing methods however their scalability and usability remains limited since estimating dense correspondences between views is prohibitively costly, especially considering time constraints inherent to online applications like Visual SLAM (VSLAM). In this paper, we introduce a regularized BA framework that leverages a fast multi-view matcher and monocular priors for initialization and regularization. In contrast to existing systems, our unified approach seamlessly supports both online VSLAM and offline reconstruction from unordered image collections within the same optimization framework and sharing common hyperparameters for all tasks. Extensive experiments across both domains demonstrate improved performance and speed tradeoffs over traditional, feed-forward, and hybrid baselines. Notably for VSLAM, our uncalibrated method outperforms all previous calibrated approaches.", "arxiv_id": "2609.05210", "arxiv_url": "https://arxiv.org/abs/2609.05210", "authors": ["Vincent Leroy", "Philippe Weinzaepfel", "Lojze Zust", "Yohann Cabon", "J\u00e9rome Revaud"], "brief": "BLASt3R\u63d0\u51fa\u4e00\u79cd\u6b63\u5219\u5316\u675f\u8c03\u6574\u6846\u67b6\uff0c\u7ed3\u5408\u5feb\u901f\u591a\u89c6\u56fe\u5339\u914d\u5668\u4e0e\u5355\u76ee\u5148\u9a8c\uff0c\u7528\u4e8e\u521d\u59cb\u5316\u548c\u7ea6\u675f\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u7edf\u4e00\u652f\u6301\u5728\u7ebfVSLAM\u548c\u79bb\u7ebf\u65e0\u5e8f\u56fe\u50cf\u91cd\u5efa\uff0c\u5728\u7cbe\u5ea6\u4e0e\u901f\u5ea6\u6743\u8861\u4e0a\u4f18\u4e8e\u4f20\u7edf\u3001\u524d\u9988\u548c\u6df7\u5408\u5f0f\u57fa\u7ebf\uff0c\u4e14\u5728VSLAM\u4e2d\u672a\u6807\u5b9a\u8bbe\u7f6e\u4e5f\u8d85\u8fc7\u4ee5\u5f80\u6807\u5b9a\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05210", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u675f\u8c03\u6574", "\u89c6\u89c9SLAM", "\u591a\u89c6\u56fe\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05210v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BLASt3R: Bundle Adjustment of Any Image Set with Multi-View Matching and Monocular Priors", "tldr": "BLASt3R\u63d0\u51fa\u4e00\u79cd\u6b63\u5219\u5316\u675f\u8c03\u6574\u6846\u67b6\uff0c\u7ed3\u5408\u5feb\u901f\u591a\u89c6\u56fe\u5339\u914d\u5668\u4e0e\u5355\u76ee\u5148\u9a8c\uff0c\u7528\u4e8e\u521d\u59cb\u5316\u548c\u7ea6\u675f\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u7edf\u4e00\u652f\u6301\u5728\u7ebfVSLAM\u548c\u79bb\u7ebf\u65e0\u5e8f\u56fe\u50cf\u91cd\u5efa\uff0c\u5728\u7cbe\u5ea6\u4e0e\u901f\u5ea6\u6743\u8861\u4e0a\u4f18\u4e8e\u4f20\u7edf\u3001\u524d\u9988\u548c\u6df7\u5408\u5f0f\u57fa\u7ebf\uff0c\u4e14\u5728VSLAM\u4e2d\u672a\u6807\u5b9a\u8bbe\u7f6e\u4e5f\u8d85\u8fc7\u4ee5\u5f80\u6807\u5b9a\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-modal learning has demonstrated strong potential in medical applications by integrating heterogeneous data sources such as medical imaging, clinical records, and genomics to improve predictive performance and support clinical decision-making. However, advances in this area are often constrained by two key challenges: the limited availability of well-curated, ready-to-use datasets that accurately reflect real-world conditions, where medical data are frequently collected inconsistently and are often incomplete; and the inherent difficulty of integrating heterogeneous data modalities. In this work, we introduce a newly curated multi-center, multi-modal, and longitudinal dataset designed to support the evaluation of a wide range of learning pipelines under realistic conditions. The dataset comprises a total of 1,365 lung cancer patients and has three imaging modalities (whole-slide images, CT scans, and PET scans), structured clinical data, transcriptomic, and longitudinal follow-up and treatment information. For each imaging modality the dataset contains more than one instance. Moreover, the dataset exhibits substantial and non-uniform missingness across modalities, making it well-suited for studying robust multi-modal fusion strategies. We further provide both uni-modal and multi-modal benchmarks on the task of 12-month overall survival prediction, disease-specific survival, as well as longitudinal benchmark of hazard prediction under severe missing data. Our results show that, despite high levels of missingness, integrating complementary modalities consistently improves predictive performance over uni-modal approaches, highlighting the value of multi-modal fusion in realistic clinical settings. The dataset and benchmark code are available at https://github.com/ritacmendes/MMIST-LUNG.", "arxiv_id": "2609.05202", "arxiv_url": "https://arxiv.org/abs/2609.05202", "authors": ["Rita Cordeiro Mendes", "Maria Rita Fonseca Verdelho", "Carlos Santiago", "Catarina Barata"], "brief": "\u672c\u6587\u53d1\u5e03\u4e86\u4e00\u4e2a\u771f\u5b9e\u4e16\u754c\u3001\u591a\u4e2d\u5fc3\u3001\u591a\u6a21\u6001\u3001\u7eb5\u5411\u80ba\u764c\u6570\u636e\u96c6\uff0c\u5305\u542b1365\u540d\u60a3\u8005\u7684\u75c5\u7406\u5168\u5207\u7247\u3001CT\u3001PET\u3001\u7ed3\u6784\u5316\u4e34\u5e8a\u6570\u636e\u3001\u8f6c\u5f55\u7ec4\u4ee5\u53ca\u968f\u8bbf\u548c\u6cbb\u7597\u4fe1\u606f\u3002\u6570\u636e\u5177\u6709\u663e\u8457\u4e14\u4e0d\u5747\u5300\u7684\u6a21\u6001\u7f3a\u5931\uff0c\u5e76\u63d0\u4f9b\u751f\u5b58\u9884\u6d4b\u4e0e\u7eb5\u5411\u98ce\u9669\u9884\u6d4b\u57fa\u51c6\uff1b\u5b9e\u9a8c\u663e\u793a\u591a\u6a21\u6001\u878d\u5408\u5728\u9ad8\u7f3a\u5931\u573a\u666f\u4e0b\u4ecd\u4f18\u4e8e\u5355\u6a21\u6001\u65b9\u6cd5\u3002", "categories": ["eess.IV", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05202", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u533b\u5b66\u5f71\u50cf", "\u80ba\u764c\u6570\u636e\u96c6", "\u751f\u5b58\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05202v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Real-World Multi-Modal and Longitudinal Lung Cancer Dataset", "tldr": "\u672c\u6587\u53d1\u5e03\u4e86\u4e00\u4e2a\u771f\u5b9e\u4e16\u754c\u3001\u591a\u4e2d\u5fc3\u3001\u591a\u6a21\u6001\u3001\u7eb5\u5411\u80ba\u764c\u6570\u636e\u96c6\uff0c\u5305\u542b1365\u540d\u60a3\u8005\u7684\u75c5\u7406\u5168\u5207\u7247\u3001CT\u3001PET\u3001\u7ed3\u6784\u5316\u4e34\u5e8a\u6570\u636e\u3001\u8f6c\u5f55\u7ec4\u4ee5\u53ca\u968f\u8bbf\u548c\u6cbb\u7597\u4fe1\u606f\u3002\u6570\u636e\u5177\u6709\u663e\u8457\u4e14\u4e0d\u5747\u5300\u7684\u6a21\u6001\u7f3a\u5931\uff0c\u5e76\u63d0\u4f9b\u751f\u5b58\u9884\u6d4b\u4e0e\u7eb5\u5411\u98ce\u9669\u9884\u6d4b\u57fa\u51c6\uff1b\u5b9e\u9a8c\u663e\u793a\u591a\u6a21\u6001\u878d\u5408\u5728\u9ad8\u7f3a\u5931\u573a\u666f\u4e0b\u4ecd\u4f18\u4e8e\u5355\u6a21\u6001\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pathology foundation models integrated with multiple instance learning achieve competitive accuracy within single-cancer cohorts, yet cross-cancer generalization remains unresolved due to organ-specific histological and architectural differences. In this paper, we propose Conserved Immune Topology (CIT), a lightweight spatial representation for cross-cancer MSI-H prediction that augments foundation-model embeddings with biologically motivated immune descriptors. CIT uses unsupervised clustering to identify immune-associated tiles, then encodes tertiary lymphoid structures, peritumoral immune reactions, multi-scale tumor-infiltrating lymphocyte density, and immune-tumor mixing from frozen foundation-model embeddings and tile coordinates without requiring annotations or target-domain data. The proposed method was evaluated under cross-site and cross-cancer settings using CPTAC-COAD and TCGA-STAD cohorts, which introduce scanner variability, distribution shifts, and organ-specific architectural variations. Zero-shot cross-cancer transfer with CIT increased TransMIL AUC from 0.6627 to 0.7161, an absolute gain of 0.0534 (p=0.003), with consistent improvements across all three MIL aggregators. These results suggest that spatial immune topology provides potentially an organ-invariant representation for MSI-H prediction, supporting cross-cancer generalization of pathology foundation models.", "arxiv_id": "2609.05182", "arxiv_url": "https://arxiv.org/abs/2609.05182", "authors": ["Dasari Naga Raju"], "brief": "\u8bba\u6587\u63d0\u51fa\u4fdd\u5b88\u514d\u75ab\u62d3\u6251\uff08CIT\uff09\uff0c\u5728\u75c5\u7406\u57fa\u7840\u6a21\u578b\u5d4c\u5165\u4e0a\u52a0\u5165\u65e0\u76d1\u7763\u63d0\u53d6\u7684\u7a7a\u95f4\u514d\u75ab\u63cf\u8ff0\u7b26\uff0c\u7528\u4e8e\u8de8\u764c\u79cd MSI-H \u9884\u6d4b\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u6807\u6ce8\u6216\u76ee\u6807\u57df\u6570\u636e\uff0c\u5728\u7ed3\u76f4\u80a0\u764c\u5230\u80c3\u764c\u7b49\u8de8\u7ad9\u70b9\u3001\u8de8\u764c\u79cd\u8bbe\u7f6e\u4e2d\u663e\u8457\u63d0\u5347 MIL \u6a21\u578b\u6cdb\u5316\u80fd\u529b\uff0cTransMIL AUC \u4ece 0.6627 \u63d0\u5347\u5230 0.7161\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05182", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u75c5\u7406\u57fa\u7840\u6a21\u578b", "\u591a\u5b9e\u4f8b\u5b66\u4e60", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05182v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Conserved Immune Topology Improves Pathology Foundation Model Generalization for Cross-Cancer MSI-H Prediction", "tldr": "\u8bba\u6587\u63d0\u51fa\u4fdd\u5b88\u514d\u75ab\u62d3\u6251\uff08CIT\uff09\uff0c\u5728\u75c5\u7406\u57fa\u7840\u6a21\u578b\u5d4c\u5165\u4e0a\u52a0\u5165\u65e0\u76d1\u7763\u63d0\u53d6\u7684\u7a7a\u95f4\u514d\u75ab\u63cf\u8ff0\u7b26\uff0c\u7528\u4e8e\u8de8\u764c\u79cd MSI-H \u9884\u6d4b\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u6807\u6ce8\u6216\u76ee\u6807\u57df\u6570\u636e\uff0c\u5728\u7ed3\u76f4\u80a0\u764c\u5230\u80c3\u764c\u7b49\u8de8\u7ad9\u70b9\u3001\u8de8\u764c\u79cd\u8bbe\u7f6e\u4e2d\u663e\u8457\u63d0\u5347 MIL \u6a21\u578b\u6cdb\u5316\u80fd\u529b\uff0cTransMIL AUC \u4ece 0.6627 \u63d0\u5347\u5230 0.7161\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Background and Objective: External evaluation of medical-imaging AI is often collapsed into discrimination. We evaluated a computational protocol that separately tests discrimination, probability calibration, fixed operatingpoint transport, shortcut-associated signal, and limited-label recoverability for pediatric pneumonia classification across datasets from three countries. Methods: After exact-duplicate removal, 5,824 Guangzhou radiographs supported leakage-controlled source development and internal testing. A frozen three-seed DenseNet121 dual-view ensemble was evaluated zero-shot on BDCXR-3257 from Bangladesh (n = 3, 257) and an untouched harmonized VinDr-PCXR/PediCXR test cohort from Vietnam (n = 1, 077). Matched seed-42 variants tested architectural robustness. Secondary BDCXR analyses used a fixed 651-image adaptation pool and 2,606-image hold-out; 163, 326, and 651 labels represented 5%, 10%, and 20% of complete BDCXR. Results: Internal AUROC was 0.976 with 95.1% sensitivity. BDCXR and VinDr-PCXR AUROC were 0.798 and 0.742, while frozen-threshold sensitivity fell to 6.2% and 0%. Source-to-BDCXR AUROC degradation occurred for a full-image baseline (0.961 to 0.749), ungated dual-view model (0.977 to 0.766), and gated MixStyle model (0.966 to 0.789). With 163 BDCXR labels, Platt recalibration preserved AUROC while increasing held-out sensitivity to 88.3%, but specificity was 47.9% and the alert rate was 78.5%. Two hundred repeated 163-label fits confirmed sensitivity recovery but substantial specificity variability. Conclusions: Cross-dataset shifts across countries affected ranking, probability alignment, and source-defined decision behavior differently. Transport studies should evaluate these components separately and quantify the operational burden of apparent recovery.", "arxiv_id": "2609.05140", "arxiv_url": "https://arxiv.org/abs/2609.05140", "authors": ["Nazim-E-Alam"], "brief": "\u672c\u6587\u8bc4\u4f30\u4e86\u513f\u79d1\u80f8\u7247\u80ba\u708e\u6df1\u5ea6\u5b66\u4e60\u6a21\u578b\u5728\u4e2d\u56fd\u3001\u5b5f\u52a0\u62c9\u56fd\u3001\u8d8a\u5357\u4e09\u4e2a\u6570\u636e\u96c6\u95f4\u7684\u53ef\u8fc1\u79fb\u6027\uff0c\u4e0d\u53ea\u770bAUROC\uff0c\u8fd8\u5206\u522b\u8003\u5bdf\u6821\u51c6\u3001\u56fa\u5b9a\u9608\u503c\u8868\u73b0\u3001\u6377\u5f84\u4fe1\u53f7\u548c\u5c11\u91cf\u6807\u6ce8\u6062\u590d\u3002\u7ed3\u679c\u663e\u793a\u8de8\u56fd\u6570\u636e\u8fc1\u79fb\u4f1a\u663e\u8457\u7834\u574f\u9608\u503c\u4e0b\u7684\u654f\u611f\u6027\uff0c\u751a\u81f3\u964d\u81f3\u63a5\u8fd1\u96f6\uff1b\u5c11\u91cf\u76ee\u6807\u57df\u6807\u6ce8\u53ef\u901a\u8fc7\u6821\u51c6\u6062\u590d\u654f\u611f\u6027\uff0c\u4f46\u4f1a\u5e26\u6765\u9ad8\u8bef\u62a5\u7387\u548c\u8f83\u5927\u8fd0\u884c\u8d1f\u62c5\u3002", "categories": ["eess.IV", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05140", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u6a21\u578b\u6cdb\u5316", "\u6821\u51c6", "\u80f8\u7247\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05140v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cross-dataset transportability of pediatric chest X-ray deep learning across three countries: discrimination, calibration, operating-point failure, and limited-label recovery", "tldr": "\u672c\u6587\u8bc4\u4f30\u4e86\u513f\u79d1\u80f8\u7247\u80ba\u708e\u6df1\u5ea6\u5b66\u4e60\u6a21\u578b\u5728\u4e2d\u56fd\u3001\u5b5f\u52a0\u62c9\u56fd\u3001\u8d8a\u5357\u4e09\u4e2a\u6570\u636e\u96c6\u95f4\u7684\u53ef\u8fc1\u79fb\u6027\uff0c\u4e0d\u53ea\u770bAUROC\uff0c\u8fd8\u5206\u522b\u8003\u5bdf\u6821\u51c6\u3001\u56fa\u5b9a\u9608\u503c\u8868\u73b0\u3001\u6377\u5f84\u4fe1\u53f7\u548c\u5c11\u91cf\u6807\u6ce8\u6062\u590d\u3002\u7ed3\u679c\u663e\u793a\u8de8\u56fd\u6570\u636e\u8fc1\u79fb\u4f1a\u663e\u8457\u7834\u574f\u9608\u503c\u4e0b\u7684\u654f\u611f\u6027\uff0c\u751a\u81f3\u964d\u81f3\u63a5\u8fd1\u96f6\uff1b\u5c11\u91cf\u76ee\u6807\u57df\u6807\u6ce8\u53ef\u901a\u8fc7\u6821\u51c6\u6062\u590d\u654f\u611f\u6027\uff0c\u4f46\u4f1a\u5e26\u6765\u9ad8\u8bef\u62a5\u7387\u548c\u8f83\u5927\u8fd0\u884c\u8d1f\u62c5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Semantic 3D maps are increasingly constructed automatically for aerial robotics by integrating learned semantic predictions into 3D representations. While this avoids costly manual 3D annotation, errors in the perception and mapping pipeline can persist in the resulting map, reducing its reliability for downstream autonomous tasks. Existing 3D semantic map refinement methods either rely on the original observations, treat occupancy as part of the prediction problem, or apply non-learned local regularization to completed maps. Instead, we study post-hoc semantic correction, asking whether semantic accuracy can be recovered directly from the completed map while keeping its geometry and occupancy fixed. We introduce \\method, a graph-based model that corrects voxel labels based on local geometry and neighboring semantic information. To obtain training pairs, we corrupt contiguous regions of annotated OccuFly maps according to class confusions observed in upstream maps. We evaluate \\method on completed OccuFly maps generated from predictions of four independently trained 2D segmentation models. \\method consistently improves mIoU by 4.23--5.00 percentage points, with gains broadly distributed across the evaluated semantic classes and particularly strong improvements for tree, roof, and wall. Results on an independently reconstructed out-of-distribution aerial scene further suggest that the learned correction can transfer beyond the environments seen during training.", "arxiv_id": "2609.05114", "arxiv_url": "https://arxiv.org/abs/2609.05114", "authors": ["Sunesh Praveen Raja Sundarasami", "Taehyoung Kim", "Johannes Scherer", "Toma\u017e Coti\u010d", "Sivasubiramaniam Subbiah", "Andreas Greiner", "Paul Spannaus", "Sebastian Houben"], "brief": "\u672c\u6587\u63d0\u51fa VoxelFix\uff0c\u4e00\u79cd\u57fa\u4e8e\u56fe\u7684\u540e\u5904\u7406\u65b9\u6cd5\uff0c\u5728\u56fa\u5b9a\u5df2\u5b8c\u62103D\u4f53\u7d20\u5730\u56fe\u51e0\u4f55\u4e0e\u5360\u7528\u7684\u524d\u63d0\u4e0b\uff0c\u5229\u7528\u5c40\u90e8\u51e0\u4f55\u548c\u90bb\u57df\u8bed\u4e49\u4fe1\u606f\u4fee\u6b63\u4f53\u7d20\u8bed\u4e49\u6807\u7b7e\u3002\u8be5\u65b9\u6cd5\u5728 OccuFly \u5730\u56fe\u4e0a\u5c06 mIoU \u7a33\u5b9a\u63d0\u5347\u7ea64.23\u52305.00\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u6811\u3001\u5c4b\u9876\u3001\u5899\u7b49\u7c7b\u522b\u4e0a\u6539\u8fdb\u660e\u663e\uff0c\u4e14\u5177\u5907\u4e00\u5b9a\u8de8\u573a\u666f\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05114", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u8bed\u4e49\u5730\u56fe", "\u4f53\u7d20", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u8bed\u4e49\u5206\u5272"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05114v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VoxelFix: Post-Hoc Semantic Correction of Completed 3D Voxel Maps", "tldr": "\u672c\u6587\u63d0\u51fa VoxelFix\uff0c\u4e00\u79cd\u57fa\u4e8e\u56fe\u7684\u540e\u5904\u7406\u65b9\u6cd5\uff0c\u5728\u56fa\u5b9a\u5df2\u5b8c\u62103D\u4f53\u7d20\u5730\u56fe\u51e0\u4f55\u4e0e\u5360\u7528\u7684\u524d\u63d0\u4e0b\uff0c\u5229\u7528\u5c40\u90e8\u51e0\u4f55\u548c\u90bb\u57df\u8bed\u4e49\u4fe1\u606f\u4fee\u6b63\u4f53\u7d20\u8bed\u4e49\u6807\u7b7e\u3002\u8be5\u65b9\u6cd5\u5728 OccuFly \u5730\u56fe\u4e0a\u5c06 mIoU \u7a33\u5b9a\u63d0\u5347\u7ea64.23\u52305.00\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u6811\u3001\u5c4b\u9876\u3001\u5899\u7b49\u7c7b\u522b\u4e0a\u6539\u8fdb\u660e\u663e\uff0c\u4e14\u5177\u5907\u4e00\u5b9a\u8de8\u573a\u666f\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Industrial anomaly detection must handle two distinct defect families: structural anomalies, which manifest as local texture corruptions, and logical anomalies, which violate global rules on object count, composition, or arrangement. Existing detectors typically favor one family at the expense of the other. In particular, training-free methods effectively exploit frozen representations but lack an explicit notion of object count, while methods that reason about counts usually rely on category-specific component modeling. We show that counting ability can be introduced into training-free anomaly detection without additional training or part-level supervision. Our key idea is a normal-set calibration that aligns heterogeneous anomaly cues using statistics from normal images, enabling their direct fusion within a unified training-free framework. Built upon this calibration, our detector combines complementary frozen cues to address both logical and structural anomalies. On MVTec-LOCO, our method achieves image-level AUROCs of 89.0 and 95.9 on logical and structural anomalies, respectively, yielding a 92.5 average---the best among training-free detectors in our comparison. It remains competitive with methods requiring network training or part annotations, while its structural variant matches PatchCore on MVTec-AD (99.1 image-AUROC), suggesting that the proposed calibration generalizes beyond logical anomaly detection.", "arxiv_id": "2609.05091", "arxiv_url": "https://arxiv.org/abs/2609.05091", "authors": ["Changyi Li", "Miao Yu", "Kai Dong", "Yu Xiao"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5de5\u4e1a\u5f02\u5e38\u68c0\u6d4b\u65b9\u6cd5\uff0c\u901a\u8fc7\u6b63\u5e38\u6837\u672c\u6821\u51c6\u6765\u5bf9\u9f50\u5e76\u878d\u5408\u4e0d\u540c\u5f02\u5e38\u7ebf\u7d22\uff0c\u540c\u65f6\u8986\u76d6\u5c40\u90e8\u7eb9\u7406\u7834\u574f\u7684\u7ed3\u6784\u5f02\u5e38\u548c\u5168\u5c40\u8ba1\u6570/\u5e03\u5c40\u8fdd\u89c4\u7684\u903b\u8f91\u5f02\u5e38\u3002\u5728 MVTec-LOCO \u4e0a\u53d6\u5f97 92.5 \u5e73\u5747 image-AUROC\uff0c\u4f18\u4e8e\u5bf9\u6bd4\u4e2d\u7684\u8bad\u7ec3\u514d\u8d39\u65b9\u6cd5\uff0c\u5e76\u5728 MVTec-AD \u4e0a\u7ed3\u6784\u5f02\u5e38\u68c0\u6d4b\u8fbe\u5230\u63a5\u8fd1 PatchCore \u7684\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05091", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f02\u5e38\u68c0\u6d4b", "\u89c6\u89c9\u8868\u5f81", "\u65e0\u8bad\u7ec3\u65b9\u6cd5", "\u5de5\u4e1a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05091v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Training-Free Logical and Structural Anomaly Detection via Calibrated Fusion", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5de5\u4e1a\u5f02\u5e38\u68c0\u6d4b\u65b9\u6cd5\uff0c\u901a\u8fc7\u6b63\u5e38\u6837\u672c\u6821\u51c6\u6765\u5bf9\u9f50\u5e76\u878d\u5408\u4e0d\u540c\u5f02\u5e38\u7ebf\u7d22\uff0c\u540c\u65f6\u8986\u76d6\u5c40\u90e8\u7eb9\u7406\u7834\u574f\u7684\u7ed3\u6784\u5f02\u5e38\u548c\u5168\u5c40\u8ba1\u6570/\u5e03\u5c40\u8fdd\u89c4\u7684\u903b\u8f91\u5f02\u5e38\u3002\u5728 MVTec-LOCO \u4e0a\u53d6\u5f97 92.5 \u5e73\u5747 image-AUROC\uff0c\u4f18\u4e8e\u5bf9\u6bd4\u4e2d\u7684\u8bad\u7ec3\u514d\u8d39\u65b9\u6cd5\uff0c\u5e76\u5728 MVTec-AD \u4e0a\u7ed3\u6784\u5f02\u5e38\u68c0\u6d4b\u8fbe\u5230\u63a5\u8fd1 PatchCore \u7684\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated gastrointestinal (GI) endoscopy classification requires models that generalize across diverse modalities and class distributions, often far from natural-image pretraining. We propose MultiAttenGastro, a plug-and-play attention framework with parallel 1-D channel, 2-D spatial, and 3-D contextual heads, and present the first systematic cross-dataset evaluation across eight CNN and transformer backbones on five public GI datasets (80 backbone--dataset runs). We find that attention effectiveness is not universal but tracks the representational gap between ImageNet features and the target distribution: MultiAttenGastro improves 6 of 8 backbones on Kvasir-Capsule (14-class WCE, large gap; best macro F1 98.33\\%), is uniformly negative on the small-gap Kvasir-v2 benchmark (0/8), and shows mixed outcomes on datasets with intermediate gap. Five-seed ablation on the strongest case (Kvasir-Capsule, ConvNeXt-Tiny) shows this improvement is directionally consistent, but not statistically decisive (paired $t$: $p=0.47$; Wilcoxon: $p=0.63$), and that individual attention heads are not uniformly beneficial in isolation only their combination yields a positive mean effect. Centered Kernel Alignment (CKA) analysis links this pattern to representational redundancy: low inter-head CKA under large domain gaps coincides with the framework\u0027s only consistent gains, while high redundancy under small gaps coincides with its losses. We report these results, including the non-significant margins, as evidence for when and why multi-dimensional attention helps GI endoscopy classification, rather than as a claim that MultiAttenGastro is a strictly superior architectural choice.", "arxiv_id": "2609.05070", "arxiv_url": "https://arxiv.org/abs/2609.05070", "authors": ["Sadhana Devarajan", "Praveen Kumar Chandaliya", "Dhruvin Jashvant Kumar Shah", "Kishor Upla", "Kiran Raja"], "brief": "\u8bba\u6587\u63d0\u51fa MultiAttenGastro\uff0c\u4e00\u4e2a\u53ef\u63d2\u62d4\u7684\u591a\u7ef4\u6ce8\u610f\u529b\u6a21\u5757\uff0c\u7ed3\u5408\u901a\u9053\u3001\u7a7a\u95f4\u548c\u4e0a\u4e0b\u6587\u6ce8\u610f\u529b\u7528\u4e8e\u80c3\u80a0\u5185\u955c\u56fe\u50cf\u5206\u7c7b\u3002\u7cfb\u7edf\u8bc4\u4f30\u663e\u793a\u5176\u6548\u679c\u53d6\u51b3\u4e8e\u76ee\u6807\u6570\u636e\u4e0e ImageNet \u9884\u8bad\u7ec3\u7279\u5f81\u7684\u8868\u5f81\u5dee\u8ddd\uff1a\u5728\u5927\u57df\u5dee\u6570\u636e\u96c6\u4e0a\u6709\u7a33\u5b9a\u589e\u76ca\uff0c\u5728\u5c0f\u5dee\u8ddd\u6570\u636e\u96c6\u4e0a\u53cd\u800c\u4e0b\u964d\uff0c\u4e14\u7edf\u8ba1\u663e\u8457\u6027\u6709\u9650\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05070", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u6ce8\u610f\u529b\u673a\u5236", "\u56fe\u50cf\u5206\u7c7b", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05070v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MultiAttenGastro: Multi-Dimensional Attention Augmentation for Gastrointestinal Endoscopy Classification", "tldr": "\u8bba\u6587\u63d0\u51fa MultiAttenGastro\uff0c\u4e00\u4e2a\u53ef\u63d2\u62d4\u7684\u591a\u7ef4\u6ce8\u610f\u529b\u6a21\u5757\uff0c\u7ed3\u5408\u901a\u9053\u3001\u7a7a\u95f4\u548c\u4e0a\u4e0b\u6587\u6ce8\u610f\u529b\u7528\u4e8e\u80c3\u80a0\u5185\u955c\u56fe\u50cf\u5206\u7c7b\u3002\u7cfb\u7edf\u8bc4\u4f30\u663e\u793a\u5176\u6548\u679c\u53d6\u51b3\u4e8e\u76ee\u6807\u6570\u636e\u4e0e ImageNet \u9884\u8bad\u7ec3\u7279\u5f81\u7684\u8868\u5f81\u5dee\u8ddd\uff1a\u5728\u5927\u57df\u5dee\u6570\u636e\u96c6\u4e0a\u6709\u7a33\u5b9a\u589e\u76ca\uff0c\u5728\u5c0f\u5dee\u8ddd\u6570\u636e\u96c6\u4e0a\u53cd\u800c\u4e0b\u964d\uff0c\u4e14\u7edf\u8ba1\u663e\u8457\u6027\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous systems require robust low-latency perception under rapidly changing scene dynamics and challenging illumination. In event cameras object detection commonly relies on recurrent architectures to accumulate sparse temporal information over time. This work investigates how temporal information can be encoded directly within the event representation. We propose a confidence-normalized continuous multi-timescale representation based on logarithmic B-spline temporal encoding together with a geometry-aware local confidence mechanism that exploits the spatial structure of event generation. Using a fixed feed-forward EventCenterNet detector, we show that the proposed representations consistently outperform the compact CSTR representation on PEDRo and Gen1 datasets. We further introduce a recursive exponential-polynomial approximation that enables efficient event-by-event updates while largely preserving detection performance. These results demonstrate that carefully designed event representations can capture a substantial portion of the temporal information learned through recurrent temporal modeling, providing a promising foundation for efficient feed-forward, event-driven, and future neuromorphic object detection.", "arxiv_id": "2609.05049", "arxiv_url": "https://arxiv.org/abs/2609.05049", "authors": ["Fredrik Lundell", "Per-Erik Forssen", "M\u00e5rten Wadenb\u00e4ck", "Astrid Lundmark"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u4e8b\u4ef6\u76f8\u673a\u76ee\u6807\u68c0\u6d4b\u7684\u8fde\u7eed\u591a\u65f6\u95f4\u5c3a\u5ea6\u4e8b\u4ef6\u8868\u793a\uff0c\u7ed3\u5408\u5bf9\u6570 B \u6837\u6761\u65f6\u95f4\u7f16\u7801\u548c\u51e0\u4f55\u611f\u77e5\u7684\u5c40\u90e8\u7f6e\u4fe1\u5ea6\u5f52\u4e00\u5316\uff0c\u5728\u56fa\u5b9a\u524d\u9988 EventCenterNet \u4e0a\u4f18\u4e8e CSTR\u3002\u8fd8\u63d0\u51fa\u9012\u5f52\u6307\u6570-\u591a\u9879\u5f0f\u8fd1\u4f3c\uff0c\u5b9e\u73b0\u9ad8\u6548\u9010\u4e8b\u4ef6\u66f4\u65b0\u5e76\u57fa\u672c\u4fdd\u6301\u68c0\u6d4b\u6027\u80fd\uff0c\u8bf4\u660e\u7cbe\u5fc3\u8bbe\u8ba1\u7684\u4e8b\u4ef6\u8868\u793a\u53ef\u66ff\u4ee3\u90e8\u5206\u5faa\u73af\u65f6\u5e8f\u5efa\u6a21\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05049", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e8b\u4ef6\u76f8\u673a", "\u76ee\u6807\u68c0\u6d4b", "\u65f6\u5e8f\u5efa\u6a21", "\u524d\u9988\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05049v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Efficient Multi-Timescale Event Representations for Feed-Forward Object Detection", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u4e8b\u4ef6\u76f8\u673a\u76ee\u6807\u68c0\u6d4b\u7684\u8fde\u7eed\u591a\u65f6\u95f4\u5c3a\u5ea6\u4e8b\u4ef6\u8868\u793a\uff0c\u7ed3\u5408\u5bf9\u6570 B \u6837\u6761\u65f6\u95f4\u7f16\u7801\u548c\u51e0\u4f55\u611f\u77e5\u7684\u5c40\u90e8\u7f6e\u4fe1\u5ea6\u5f52\u4e00\u5316\uff0c\u5728\u56fa\u5b9a\u524d\u9988 EventCenterNet \u4e0a\u4f18\u4e8e CSTR\u3002\u8fd8\u63d0\u51fa\u9012\u5f52\u6307\u6570-\u591a\u9879\u5f0f\u8fd1\u4f3c\uff0c\u5b9e\u73b0\u9ad8\u6548\u9010\u4e8b\u4ef6\u66f4\u65b0\u5e76\u57fa\u672c\u4fdd\u6301\u68c0\u6d4b\u6027\u80fd\uff0c\u8bf4\u660e\u7cbe\u5fc3\u8bbe\u8ba1\u7684\u4e8b\u4ef6\u8868\u793a\u53ef\u66ff\u4ee3\u90e8\u5206\u5faa\u73af\u65f6\u5e8f\u5efa\u6a21\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Species identification in camera trap images has been widely studied, but key ecological modeling tasks such as species abundance or density estimation also require counting individual animals. However, the lack of counting labels in most datasets and low frame rates (typically ~1 frame per second) make sequence-level tracking and count estimation particularly challenging. In this work, we present PuTR-CouT, a counting-by-tracking framework built on a transformer-based learned association mechanism for sequence-level animal counting in camera trap images. To address the scarcity of annotated tracking data, we generate synthetic training data by exploiting structural priors, such as static backgrounds and short temporal bursts, to heuristically create pseudo-tracking labels in a weakly supervised manner. The resulting tracker associates detections across frames, using these tracks to estimate per-species counts. We also refine the MaxBoxCount heuristic used by the top solutions of the iWildCam 2021 challenge as a strong baseline, setting the highest score reported to date. When evaluated on the iWildCam 2021 benchmark, our framework PuTR-CouT delivers competitive counting results compared to the improved MaxBoxCount, with the added capability of multi-species predictions and track-level verification.", "arxiv_id": "2609.05038", "arxiv_url": "https://arxiv.org/abs/2609.05038", "authors": ["Fagner Cunha", "Juan G. Colonna", "Eulanda M. dos Santos"], "brief": "\u672c\u6587\u63d0\u51fa PuTR-CouT\uff0c\u7528\u57fa\u4e8e Transformer \u7684\u5173\u8054\u673a\u5236\u5728\u76f8\u673a\u9677\u9631\u56fe\u50cf\u5e8f\u5217\u4e2d\u901a\u8fc7\u8ddf\u8e2a\u5b9e\u73b0\u52a8\u7269\u8ba1\u6570\u3002\u65b9\u6cd5\u5229\u7528\u9759\u6001\u80cc\u666f\u548c\u77ed\u65f6\u5e8f\u5217\u7b49\u7ed3\u6784\u5148\u9a8c\u751f\u6210\u4f2a\u8ddf\u8e2a\u6807\u7b7e\uff0c\u7f13\u89e3\u7f3a\u5c11\u6807\u6ce8\u7684\u95ee\u9898\uff1b\u5728 iWildCam 2021 \u4e0a\u53d6\u5f97\u4e0e\u5f3a\u5316\u7248 MaxBoxCount \u76f8\u5f53\u7684\u8ba1\u6570\u6548\u679c\uff0c\u5e76\u652f\u6301\u591a\u7269\u79cd\u9884\u6d4b\u548c\u8f68\u8ff9\u7ea7\u9a8c\u8bc1\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05038", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u8ddf\u8e2a", "\u52a8\u7269\u8ba1\u6570", "\u5f31\u76d1\u7763\u5b66\u4e60", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05038v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PuTR-CouT: Counting-by-Tracking in Camera-Trap Image Sequences", "tldr": "\u672c\u6587\u63d0\u51fa PuTR-CouT\uff0c\u7528\u57fa\u4e8e Transformer \u7684\u5173\u8054\u673a\u5236\u5728\u76f8\u673a\u9677\u9631\u56fe\u50cf\u5e8f\u5217\u4e2d\u901a\u8fc7\u8ddf\u8e2a\u5b9e\u73b0\u52a8\u7269\u8ba1\u6570\u3002\u65b9\u6cd5\u5229\u7528\u9759\u6001\u80cc\u666f\u548c\u77ed\u65f6\u5e8f\u5217\u7b49\u7ed3\u6784\u5148\u9a8c\u751f\u6210\u4f2a\u8ddf\u8e2a\u6807\u7b7e\uff0c\u7f13\u89e3\u7f3a\u5c11\u6807\u6ce8\u7684\u95ee\u9898\uff1b\u5728 iWildCam 2021 \u4e0a\u53d6\u5f97\u4e0e\u5f3a\u5316\u7248 MaxBoxCount \u76f8\u5f53\u7684\u8ba1\u6570\u6548\u679c\uff0c\u5e76\u652f\u6301\u591a\u7269\u79cd\u9884\u6d4b\u548c\u8f68\u8ff9\u7ea7\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Acquiring high quality annotated medical image data is critical for training deep learning models; however, annotation is expensive, time consuming, and requires domain expertise. Conditional diffusion models, such as ControlNet, offer an alternative by generating images conditioned on semantic masks and text. However, existing approaches fail to capture fine grained properties (e.g., intensity and texture), as well as semantic consistency expected by domain experts, limiting their effectiveness for downstream tasks. Recent attempts to address these issues using reinforcement learning fine-tuning remain limited due to the reliance on a single scalar reward, which conflates diverse failure modes and provides weak corrective signals. We propose PRISM, a Compositional Reward Model (CRM) framework for conditional medical image generation. Instead of assigning a single reward, we decompose image quality into verifier grounded stages, each evaluating a distinct aspect of correctness from fine to coarse properties, including low level attributes (intensity and texture), structural alignment with conditioning inputs, and high level semantic fidelity. These stage wise rewards are composed through a Hierarchical Constrained Propagation (HCP) mechanism that enforces a fine to coarse notion of correctness, ensuring that lower level deficiencies are resolved before higher level rewards are accrued, preventing easier objectives from masking critical failures. We evaluate PRISM across three datasets spanning diverse medical imaging tasks: PanNuke (multi-class cell segmentation), CeDeM (villi/crypt detection and measurement), and ISIC (skin lesion classification). Training downstream models with data generated by PRISM yields improvements over closest baselines, including a 2.3% increase in mDice on PanNuke, a 8.5% reduction in Mean Relative Error (MRE) on CeDeM, and increases ISIC F1 by 5.9%.", "arxiv_id": "2609.05028", "arxiv_url": "https://arxiv.org/abs/2609.05028", "authors": ["Aayush Kumar Tyagi", "Prathosh A. P.", "Mausam"], "brief": "\u8bba\u6587\u63d0\u51fa PRISM\uff0c\u7528\u7ec4\u5408\u5f0f\u5956\u52b1\u6a21\u578b\u6539\u8fdb\u6761\u4ef6\u533b\u5b66\u56fe\u50cf\u751f\u6210\uff0c\u5c06\u56fe\u50cf\u8d28\u91cf\u62c6\u5206\u4e3a\u5f3a\u5ea6\u3001\u7eb9\u7406\u3001\u7ed3\u6784\u5bf9\u9f50\u548c\u8bed\u4e49\u4e00\u81f4\u6027\u7b49\u5206\u9636\u6bb5\u5956\u52b1\u3002\u901a\u8fc7\u5c42\u7ea7\u7ea6\u675f\u4f20\u64ad\u673a\u5236\uff0c\u6a21\u578b\u5148\u4fee\u6b63\u4f4e\u5c42\u7f3a\u9677\u518d\u7d2f\u79ef\u9ad8\u5c42\u5956\u52b1\uff0c\u907f\u514d\u5355\u4e00\u5956\u52b1\u63a9\u76d6\u5173\u952e\u5931\u8d25\uff1b\u5728 PanNuke\u3001CeDeM\u3001ISIC \u4e0a\u751f\u6210\u6570\u636e\u8bad\u7ec3\u4e0b\u6e38\u6a21\u578b\u5747\u4f18\u4e8e\u57fa\u7ebf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05028", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u5956\u52b1\u6a21\u578b", "\u6570\u636e\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05028v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Compositional Reward Models for Conditional Medical Image Generation", "tldr": "\u8bba\u6587\u63d0\u51fa PRISM\uff0c\u7528\u7ec4\u5408\u5f0f\u5956\u52b1\u6a21\u578b\u6539\u8fdb\u6761\u4ef6\u533b\u5b66\u56fe\u50cf\u751f\u6210\uff0c\u5c06\u56fe\u50cf\u8d28\u91cf\u62c6\u5206\u4e3a\u5f3a\u5ea6\u3001\u7eb9\u7406\u3001\u7ed3\u6784\u5bf9\u9f50\u548c\u8bed\u4e49\u4e00\u81f4\u6027\u7b49\u5206\u9636\u6bb5\u5956\u52b1\u3002\u901a\u8fc7\u5c42\u7ea7\u7ea6\u675f\u4f20\u64ad\u673a\u5236\uff0c\u6a21\u578b\u5148\u4fee\u6b63\u4f4e\u5c42\u7f3a\u9677\u518d\u7d2f\u79ef\u9ad8\u5c42\u5956\u52b1\uff0c\u907f\u514d\u5355\u4e00\u5956\u52b1\u63a9\u76d6\u5173\u952e\u5931\u8d25\uff1b\u5728 PanNuke\u3001CeDeM\u3001ISIC \u4e0a\u751f\u6210\u6570\u636e\u8bad\u7ec3\u4e0b\u6e38\u6a21\u578b\u5747\u4f18\u4e8e\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In the field of computer vision and graphics, high-quality reconstruction of the human body in static scenes has been achieved in recent years by a single multilayer perceptron (MLP) in a number of approaches. However, MLPs have capacity limitations, requiring substantial training time and computational resources for dynamic scene reconstruction. And the quality of reconstruction is significantly constrained. This paper proposes a method for effectively processing complex spatiotemporal signals in dynamic scene human 3D modeling. The proposed method uses Temporal Residual Neural Radiance Fields to achieve novel view rendering and new pose synthesis of human bodies.To address the problem of representing temporal signals in video sequences, we construct a temporal residual field which is not related to the MLP architecture. Secondly, to improve reconstruction efficiency, we propose an integrated approach that reduces trainable parameters and accelerates rendering, thereby enhancing the network\u0027s feature representation capability. Finally, we design a multi-dimensional loss function to accurately measure the loss between predicted and actual spatial pixel values. The experimental results show that our proposed approach improves the peak signal-to-noise ratio (PSNR) and structural similarity index (SSIM) accuracy metrics compared to the latest representative methods. It maintains similar accuracy to Anim-NeRF and Neural Body while achieving a nearly 780-fold increase in time efficiency.", "arxiv_id": "2609.04984", "arxiv_url": "https://arxiv.org/abs/2609.04984", "authors": ["Tianle Du", "Jie Wang", "Xiaolong Xie", "Wei Li", "Pengxiang Su", "Jie Liu"], "brief": "\u63d0\u51fa Temporal Residual Neural Radiance Fields\uff0c\u7528\u4e8e\u5355\u76ee\u89c6\u9891\u4e2d\u7684\u52a8\u6001\u4eba\u4f53\u4e09\u7ef4\u91cd\u5efa\u3001 novel view \u6e32\u67d3\u548c\u65b0\u59ff\u6001\u5408\u6210\u3002\u65b9\u6cd5\u901a\u8fc7\u65f6\u95f4\u6b8b\u5dee\u573a\u3001\u53c2\u6570\u538b\u7f29\u4e0e\u52a0\u901f\u6e32\u67d3\u8bbe\u8ba1\u63d0\u5347\u6548\u7387\uff0c\u5e76\u5728 PSNR\u3001SSIM \u4e0a\u4f18\u4e8e\u4ee3\u8868\u65b9\u6cd5\uff1b\u5728\u63a5\u8fd1 Anim-NeRF \u548c Neural Body \u7cbe\u5ea6\u7684\u540c\u65f6\u5b9e\u73b0\u7ea6 780 \u500d\u65f6\u95f4\u6548\u7387\u63d0\u5347\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04984", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u8f90\u5c04\u573a", "\u4e09\u7ef4\u91cd\u5efa", "\u52a8\u6001\u4eba\u4f53", "\u5355\u76ee\u89c6\u9891"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04984v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Temporal Residual Neural Radiance Fields for Monocular Video Dynamic Human Body Reconstruction", "tldr": "\u63d0\u51fa Temporal Residual Neural Radiance Fields\uff0c\u7528\u4e8e\u5355\u76ee\u89c6\u9891\u4e2d\u7684\u52a8\u6001\u4eba\u4f53\u4e09\u7ef4\u91cd\u5efa\u3001 novel view \u6e32\u67d3\u548c\u65b0\u59ff\u6001\u5408\u6210\u3002\u65b9\u6cd5\u901a\u8fc7\u65f6\u95f4\u6b8b\u5dee\u573a\u3001\u53c2\u6570\u538b\u7f29\u4e0e\u52a0\u901f\u6e32\u67d3\u8bbe\u8ba1\u63d0\u5347\u6548\u7387\uff0c\u5e76\u5728 PSNR\u3001SSIM \u4e0a\u4f18\u4e8e\u4ee3\u8868\u65b9\u6cd5\uff1b\u5728\u63a5\u8fd1 Anim-NeRF \u548c Neural Body \u7cbe\u5ea6\u7684\u540c\u65f6\u5b9e\u73b0\u7ea6 780 \u500d\u65f6\u95f4\u6548\u7387\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Personalization models generate new images guided by a few subject references, while style transfer methods aim to produce images aligned with a global style derived from a reference image. Recent approaches perform well when the reference image contains a single object, effectively capturing a global style that encompasses all implicit attributes. However, when applied to complex real-world scenes containing multiple objects with distinct attribute characteristics, these methods, due to their global-level guidance, fail to localize relevant elements in the reference image. The global guidance restricts their ability to generate new images based on the local attributes in the reference image. Moreover, existing methods typically employ a single identifier token to capture all details from the reference, resulting in a lack of individual, attribute-level control. Motivated by these limitations, we propose RefDiT, a novel framework for reference-guided image generation. RefDiT takes as input a reference image, a text prompt, and an optional user-provided guidance context. RefDiT employs local region guidance using the attributes of local elements. It constructs an attribute-aware conditioning signal from the reference image by performing attribute-level decomposition of the identifier token and performs context adjustment in the inference prompt to train low-rank adapter (LoRA) blocks of a diffusion transformer (DiT)-based generative model. RefDiT learns the correspondence between identifier tokens and local regions in the reference image, enabling more effective local guidance.", "arxiv_id": "2609.04976", "arxiv_url": "https://arxiv.org/abs/2609.04976", "authors": ["Rameshwar Mishra", "Srikrishna Karanam", "A V Subramanyam"], "brief": "\u672c\u6587\u63d0\u51fa RefDiT\uff0c\u7528\u4e8e\u57fa\u4e8e\u53c2\u8003\u56fe\u50cf\u7684\u751f\u6210\uff0c\u9488\u5bf9\u591a\u7269\u4f53\u590d\u6742\u573a\u666f\u4e2d\u5168\u5c40\u53c2\u8003\u6307\u5bfc\u96be\u4ee5\u5b9a\u4f4d\u5c40\u90e8\u5c5e\u6027\u7684\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u5c5e\u6027\u7ea7\u5206\u89e3\u6807\u8bc6\u7b26\u3001\u6784\u5efa\u5c40\u90e8\u533a\u57df\u6761\u4ef6\u4fe1\u53f7\uff0c\u5e76\u8bad\u7ec3 DiT \u751f\u6210\u6a21\u578b\u4e2d\u7684 LoRA \u6a21\u5757\uff0c\u5b9e\u73b0\u66f4\u7ec6\u7c92\u5ea6\u7684\u5c40\u90e8\u5c5e\u6027\u63a7\u5236\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04976", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u4e2a\u6027\u5316\u751f\u6210", "\u5c40\u90e8\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04976v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RefDiT: Local Attribute Guidance in Reference-Based Image Generation", "tldr": "\u672c\u6587\u63d0\u51fa RefDiT\uff0c\u7528\u4e8e\u57fa\u4e8e\u53c2\u8003\u56fe\u50cf\u7684\u751f\u6210\uff0c\u9488\u5bf9\u591a\u7269\u4f53\u590d\u6742\u573a\u666f\u4e2d\u5168\u5c40\u53c2\u8003\u6307\u5bfc\u96be\u4ee5\u5b9a\u4f4d\u5c40\u90e8\u5c5e\u6027\u7684\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u5c5e\u6027\u7ea7\u5206\u89e3\u6807\u8bc6\u7b26\u3001\u6784\u5efa\u5c40\u90e8\u533a\u57df\u6761\u4ef6\u4fe1\u53f7\uff0c\u5e76\u8bad\u7ec3 DiT \u751f\u6210\u6a21\u578b\u4e2d\u7684 LoRA \u6a21\u5757\uff0c\u5b9e\u73b0\u66f4\u7ec6\u7c92\u5ea6\u7684\u5c40\u90e8\u5c5e\u6027\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cross-view localization (CVL) estimates the pose of a ground image by matching it to a geo-referenced satellite image. To bridge the extreme viewpoint gap, mainstream pipelines rely on Bird\u0027s-Eye-View (BEV) transformations or 2D-to-3D lifting. However, deriving 3D structures from a single ground image is fundamentally ill-posed, causing these methods to endure geometric distortions and computational costs during 3D lifting or BEV projection. Furthermore, relying on external depth foundation models to resolve this introduces latency and remains susceptible to noisy predictions. In this work, we present a different approach inspired by a human navigation technique called resection, that can perform direct ground to satellite image matching and loc
