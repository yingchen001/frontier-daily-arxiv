alization without relying on external depth foundation models. The key insights of our method are that (i) ground keypoints can be translated into azimuthal rays on the satellite map, and (ii) these rays ideally converge at the user location. Exploiting this geometric constraint through direct line-to-point correspondences, we introduce a minimal Azimuthal Ray Convergence (ARC) solver to identify the intersection, alongside an ARC loss to optimize the matching network. By eliminating dependencies on computationally heavy BEV transformations and external depth foundation models, our approach achieves faster, memory-efficient inference, while its explicit feature matching ensures straightforward compatibility with existing frameworks. Experiments on VIGOR and KITTI demonstrate that ARC-Loc maintains competitive localization accuracy compared to recent approaches, highlighting its practicality.", "arxiv_id": "2609.04965", "arxiv_url": "https://arxiv.org/abs/2609.04965", "authors": ["Hyeongsik Kim", "Mincheol Kim", "Heejoon Moon", "Je Hyeong Hong"], "brief": "\u8bba\u6587\u63d0\u51fa ARC-Loc\uff0c\u7528\u5730\u9762\u56fe\u50cf\u5173\u952e\u70b9\u5728\u536b\u661f\u56fe\u4e0a\u7684\u65b9\u4f4d\u5c04\u7ebf\u6536\u655b\u4f5c\u4e3a\u51e0\u4f55\u7ebf\u7d22\uff0c\u76f4\u63a5\u8fdb\u884c\u8de8\u89c6\u89d2\u5b9a\u4f4d\uff0c\u907f\u514d\u4f9d\u8d56 BEV \u53d8\u6362\u30013D lifting \u6216\u5916\u90e8\u6df1\u5ea6\u6a21\u578b\u3002\u65b9\u6cd5\u5305\u542b\u6700\u5c0f ARC \u6c42\u89e3\u5668\u548c ARC \u635f\u5931\uff0c\u5728 VIGOR \u4e0e KITTI \u4e0a\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u5b9a\u4f4d\u7cbe\u5ea6\uff0c\u540c\u65f6\u63a8\u7406\u66f4\u5feb\u3001\u66f4\u7701\u663e\u5b58\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04965", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8de8\u89c6\u89d2\u5b9a\u4f4d", "\u51e0\u4f55\u5339\u914d", "\u89c6\u89c9\u5b9a\u4f4d", "\u536b\u661f\u56fe\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04965v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ARC-Loc: Leveraging Azimuthal Ray Convergence as a Geometric Cue for Direct Cross-View Localization", "tldr": "\u8bba\u6587\u63d0\u51fa ARC-Loc\uff0c\u7528\u5730\u9762\u56fe\u50cf\u5173\u952e\u70b9\u5728\u536b\u661f\u56fe\u4e0a\u7684\u65b9\u4f4d\u5c04\u7ebf\u6536\u655b\u4f5c\u4e3a\u51e0\u4f55\u7ebf\u7d22\uff0c\u76f4\u63a5\u8fdb\u884c\u8de8\u89c6\u89d2\u5b9a\u4f4d\uff0c\u907f\u514d\u4f9d\u8d56 BEV \u53d8\u6362\u30013D lifting \u6216\u5916\u90e8\u6df1\u5ea6\u6a21\u578b\u3002\u65b9\u6cd5\u5305\u542b\u6700\u5c0f ARC \u6c42\u89e3\u5668\u548c ARC \u635f\u5931\uff0c\u5728 VIGOR \u4e0e KITTI \u4e0a\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u5b9a\u4f4d\u7cbe\u5ea6\uff0c\u540c\u65f6\u63a8\u7406\u66f4\u5feb\u3001\u66f4\u7701\u663e\u5b58\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recovering camera and hand motion in world coordinates from egocentric video is a key capability for activity understanding, robot learning, and augmented reality. Existing systems typically decompose this problem into separate stages for camera motion, depth, hand reconstruction, and trajectory refinement, resulting in substantial computational overhead and preventing the joint modeling of camera and hand motion. We introduce MINT (Minting IN-the-Wild Trajectories), the first foundation model that directly produces complete world-space two-hand trajectories from ego-centric RGB video. From a single shared spatiotemporal video representation, MINT jointly predicts the camera trajectory, camera-frame hand states, and per-frame hand presence, and then produces world-space hand motion via explicit coordinate transformations. Training such a model at scale is challenging, since paired world-space camera and hand annotations are scarce. We therefore develop an open-source labeling EGOPIPELINE that converts large collections of public egocentric videos into structured camera-and-hand trajectory supervision. MINT is first pretrained on these large-scale pseudo-labels and then fine-tuned on a small set of high-quality joint annotations. Across public benchmarks, MINT achieves [xxx] improvement in world-space hand trajectory accuracy, [xxx] improvement in camera trajectory estimation, and [xxx] faster end-to-end trajectory generation than the labeling pipeline, while generalizing zero-shot to unseen egocentric datasets. We release the model, training and inference code, labeling pipeline, and a curated 1,021-hour egocentric trajectory dataset.", "arxiv_id": "2609.04958", "arxiv_url": "https://arxiv.org/abs/2609.04958", "authors": ["Zijie Zhu", "Weiren Cai", "Yizhou Wang", "Zhenjie Yang", "Yide Liu", "Jiahao Chen", "Guanqi He"], "brief": "MINT \u662f\u4e00\u4e2a\u4ece\u7b2c\u4e00\u89c6\u89d2 RGB \u89c6\u9891\u76f4\u63a5\u4f30\u8ba1\u4e16\u754c\u5750\u6807\u7cfb\u4e0b\u76f8\u673a\u8f68\u8ff9\u4e0e\u53cc\u624b\u8fd0\u52a8\u7684\u7edf\u4e00\u6a21\u578b\uff0c\u907f\u514d\u4e86\u4f20\u7edf\u591a\u9636\u6bb5\u6d41\u6c34\u7ebf\u7684\u9ad8\u5f00\u9500\u3002\u4f5c\u8005\u6784\u5efa\u5f00\u6e90 EGOPIPELINE \u751f\u6210\u5927\u89c4\u6a21\u4f2a\u6807\u6ce8\uff0c\u5e76\u7ed3\u5408\u5c11\u91cf\u9ad8\u8d28\u91cf\u6807\u6ce8\u5fae\u8c03\uff0c\u4f7f\u6a21\u578b\u5728\u516c\u5f00\u57fa\u51c6\u548c\u96f6\u6837\u672c\u6570\u636e\u96c6\u4e0a\u63d0\u5347\u8f68\u8ff9\u4f30\u8ba1\u7cbe\u5ea6\u5e76\u52a0\u901f\u63a8\u7406\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04958", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u89c6\u89c9", "\u8fd0\u52a8\u4f30\u8ba1", "\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "\u673a\u5668\u4eba\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04958v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MINT: A Unified Model for World-Space Camera and Hand Motion Estimation from Scalable Egocentric Pipeline Supervision", "tldr": "MINT \u662f\u4e00\u4e2a\u4ece\u7b2c\u4e00\u89c6\u89d2 RGB \u89c6\u9891\u76f4\u63a5\u4f30\u8ba1\u4e16\u754c\u5750\u6807\u7cfb\u4e0b\u76f8\u673a\u8f68\u8ff9\u4e0e\u53cc\u624b\u8fd0\u52a8\u7684\u7edf\u4e00\u6a21\u578b\uff0c\u907f\u514d\u4e86\u4f20\u7edf\u591a\u9636\u6bb5\u6d41\u6c34\u7ebf\u7684\u9ad8\u5f00\u9500\u3002\u4f5c\u8005\u6784\u5efa\u5f00\u6e90 EGOPIPELINE \u751f\u6210\u5927\u89c4\u6a21\u4f2a\u6807\u6ce8\uff0c\u5e76\u7ed3\u5408\u5c11\u91cf\u9ad8\u8d28\u91cf\u6807\u6ce8\u5fae\u8c03\uff0c\u4f7f\u6a21\u578b\u5728\u516c\u5f00\u57fa\u51c6\u548c\u96f6\u6837\u672c\u6570\u636e\u96c6\u4e0a\u63d0\u5347\u8f68\u8ff9\u4f30\u8ba1\u7cbe\u5ea6\u5e76\u52a0\u901f\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Instruction-guided 3D editing is essential for interactive content creation, yet it faces a significant bottleneck: the severe scarcity of high-quality paired training data. Existing approaches attempt to bypass this by either relying on slow test-time optimization or training on pseudo-pairs constructed via complex pipelines, which often introduce structural drift and geometric artifacts. In this paper, we propose a novel framework that learns feed-forward 3D editing without paired 3D supervision via Generative Prior Distillation. Instead of relying on ground-truth 3D pairs, our core idea is to distill visual, semantic, and geometric knowledge from powerful foundation models directly into a 3D editing model. Specifically, through a differentiable rendering pipeline, we supervise the 3D representation using two complementary signals: a 2D visual prior from an image editing model at the main editing view, and a semantic prior from a Vision-Language Model at novel views to ensure strict instruction following and source identity preservation. Crucially, to address the geometric collapse and multi-view inconsistencies inherent in 2D projection supervision, we introduce a 3D-aware Distribution Matching regularization. Acting as a geometric prior, this term operates in the 3D latent space, constraining the edited output to remain within the manifold of realistic 3D assets defined by a pretrained image to 3D teacher model. Extensive experiments demonstrate that our method achieves superior instruction fidelity and cross-view consistency, significantly outperforming state-of-the-art baselines. Our project is available at: https://github.com/thiamine128/PriorEdit3D.", "arxiv_id": "2609.04942", "arxiv_url": "https://arxiv.org/abs/2609.04942", "authors": ["Hao Wen", "Weibin Yun", "Hongxing Fan", "Haotian Lu", "Rui Chen", "Zehuan Huang", "Lu Sheng"], "brief": "\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u6210\u5bf93D\u76d1\u7763\u7684\u6307\u4ee4\u5f15\u5bfc3D\u7f16\u8f91\u6846\u67b6\uff0c\u901a\u8fc7\u751f\u6210\u5148\u9a8c\u84b8\u998f\u628a\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u3001\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u548c\u56fe\u50cf\u52303D\u6559\u5e08\u6a21\u578b\u7684\u77e5\u8bc6\u6ce8\u5165\u524d\u99883D\u7f16\u8f91\u6a21\u578b\u3002\u65b9\u6cd5\u5229\u7528\u53ef\u5fae\u6e32\u67d3\u548c3D\u611f\u77e5\u5206\u5e03\u5339\u914d\u6b63\u5219\uff0c\u7f13\u89e3\u51e0\u4f55\u584c\u7f29\u4e0e\u591a\u89c6\u89d2\u4e0d\u4e00\u81f4\uff0c\u5728\u6307\u4ee4\u9075\u5faa\u548c\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04942", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["3D\u7f16\u8f91", "\u751f\u6210\u5148\u9a8c\u84b8\u998f", "\u591a\u6a21\u6001", "\u4e09\u7ef4\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04942v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning 3D Editing without Paired Supervision via Generative Prior Distillation", "tldr": "\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u6210\u5bf93D\u76d1\u7763\u7684\u6307\u4ee4\u5f15\u5bfc3D\u7f16\u8f91\u6846\u67b6\uff0c\u901a\u8fc7\u751f\u6210\u5148\u9a8c\u84b8\u998f\u628a\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u3001\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u548c\u56fe\u50cf\u52303D\u6559\u5e08\u6a21\u578b\u7684\u77e5\u8bc6\u6ce8\u5165\u524d\u99883D\u7f16\u8f91\u6a21\u578b\u3002\u65b9\u6cd5\u5229\u7528\u53ef\u5fae\u6e32\u67d3\u548c3D\u611f\u77e5\u5206\u5e03\u5339\u914d\u6b63\u5219\uff0c\u7f13\u89e3\u51e0\u4f55\u584c\u7f29\u4e0e\u591a\u89c6\u89d2\u4e0d\u4e00\u81f4\uff0c\u5728\u6307\u4ee4\u9075\u5faa\u548c\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The visual aesthetics of photographs are deeply influenced by lens characteristics such as aperture shape, optical vignetting and optical diffraction, which together define a camera\u0027s unique optical style. Existing lens effect rendering methods primarily focus on accurately simulating the blur transition from small to large apertures but overlook the stylistic aspects of lens effects. As a result, they fail to produce diverse bokeh effects under large apertures or capture distinctive photographic phenomena such as starbursts that emerge under small apertures. In this work, we introduce LensStyle, a unified framework for controllable stylized lens effect rendering that explicitly models lens aesthetics through joint continuous-discrete control. Our model incorporates a Dual-Path Controller that disentangles continuous optical parameter modulation (e.g., focus distance and blur strength) from discrete lens-style conditioning (e.g., circular, polygonal, donut, cat-eye, and starburst effects), enabling fine-grained, interpretable, and physically grounded lens manipulation within a single unified framework. To support model training, we curate a comprehensive MultiLens dataset containing multi-lens image pairs synthesized under real optical constraints. Extensive experiments demonstrate that LensStyle achieves superior realism, controllability, and aesthetic quality compared with existing lens effect rendering approaches and diffusion-based image editing models, advancing computational photography toward multiple-lens-style simulation.", "arxiv_id": "2609.04939", "arxiv_url": "https://arxiv.org/abs/2609.04939", "authors": ["Yachuan Huang", "Liwen Xiao", "Liao Shen", "Qiwen Wang", "Huiqiang Sun", "Zhiyu Pan", "Zhiguo Cao"], "brief": "\u672c\u6587\u63d0\u51fa LensStyle\uff0c\u4e00\u4e2a\u53ef\u63a7\u7684\u98ce\u683c\u5316\u955c\u5934\u6548\u679c\u6e32\u67d3\u6846\u67b6\uff0c\u901a\u8fc7\u8fde\u7eed\u5149\u5b66\u53c2\u6570\u4e0e\u79bb\u6563\u955c\u5934\u98ce\u683c\u7684\u8054\u5408\u63a7\u5236\uff0c\u6a21\u62df\u7126\u8ddd\u3001\u865a\u5316\u5f3a\u5ea6\u4ee5\u53ca\u5706\u5f62\u3001\u591a\u8fb9\u5f62\u3001\u751c\u751c\u5708\u3001\u732b\u773c\u3001\u661f\u8292\u7b49\u955c\u5934\u7f8e\u5b66\u3002\u4f5c\u8005\u6784\u5efa\u4e86 MultiLens \u6570\u636e\u96c6\uff0c\u5e76\u5728\u5b9e\u9a8c\u4e2d\u76f8\u6bd4\u73b0\u6709\u955c\u5934\u6e32\u67d3\u548c\u6269\u6563\u5f0f\u56fe\u50cf\u7f16\u8f91\u65b9\u6cd5\u53d6\u5f97\u66f4\u597d\u7684\u771f\u5b9e\u611f\u3001\u53ef\u63a7\u6027\u548c\u5ba1\u7f8e\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04939", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u6444\u5f71", "\u56fe\u50cf\u6e32\u67d3", "\u53ef\u63a7\u751f\u6210", "\u955c\u5934\u6548\u679c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04939v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LensStyle: Learning the Optical Aesthetics for Controllable Stylized Lens Effect Rendering", "tldr": "\u672c\u6587\u63d0\u51fa LensStyle\uff0c\u4e00\u4e2a\u53ef\u63a7\u7684\u98ce\u683c\u5316\u955c\u5934\u6548\u679c\u6e32\u67d3\u6846\u67b6\uff0c\u901a\u8fc7\u8fde\u7eed\u5149\u5b66\u53c2\u6570\u4e0e\u79bb\u6563\u955c\u5934\u98ce\u683c\u7684\u8054\u5408\u63a7\u5236\uff0c\u6a21\u62df\u7126\u8ddd\u3001\u865a\u5316\u5f3a\u5ea6\u4ee5\u53ca\u5706\u5f62\u3001\u591a\u8fb9\u5f62\u3001\u751c\u751c\u5708\u3001\u732b\u773c\u3001\u661f\u8292\u7b49\u955c\u5934\u7f8e\u5b66\u3002\u4f5c\u8005\u6784\u5efa\u4e86 MultiLens \u6570\u636e\u96c6\uff0c\u5e76\u5728\u5b9e\u9a8c\u4e2d\u76f8\u6bd4\u73b0\u6709\u955c\u5934\u6e32\u67d3\u548c\u6269\u6563\u5f0f\u56fe\u50cf\u7f16\u8f91\u65b9\u6cd5\u53d6\u5f97\u66f4\u597d\u7684\u771f\u5b9e\u611f\u3001\u53ef\u63a7\u6027\u548c\u5ba1\u7f8e\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Interactive visual world models must distinguish observation from physical intervention. Camera motion reveals new surfaces, whereas intervention changes object motion, contact, and deformation. Current video world models are largely driven by appearance priors and often lose physical or spatial consistency over long horizons. We present TourPhysics, an online framework initialized from a single image and a declarative physical configuration. TourPhysics extends PhysOmni, our ACM Multimedia 2026 work, from finite physics-grounded video synthesis to persistent exploration and manipulation. TourPhysics combines deterministic simulation with video generation while assigning separate roles to simulator state, geometric evidence, generator controls, and appearance memory. For each action, the simulator computes a finite physical and camera trajectory before the corresponding observation is generated. Accepted observations publish the terminal state and update the appearance memory and subsequent generator controls, while the committed state and simulator geometry remain fixed throughout synthesis and retry. We further separate the simulator geometry used for projection and visibility from the relative depth used to condition the generator. A reference-anchored memory retrieves accepted static appearance through geometric cross-view correspondence and incorporates it through a bounded residual that reverts to the native path when no valid correspondence exists. On simulator-defined camera tours and object manipulations, TourPhysics follows prescribed camera and object trajectories more closely than the evaluated baselines, preserves the input scene, and reduces appearance drift during long-horizon revisits.", "arxiv_id": "2609.04911", "arxiv_url": "https://arxiv.org/abs/2609.04911", "authors": ["Xin Zhang", "Yabo Chen", "Zixuan Duan", "Haibin Huang", "Chi Zhang", "Feng Xu", "Xuelong Li"], "brief": "TourPhysics \u4ece\u5355\u5f20\u56fe\u50cf\u548c\u58f0\u660e\u5f0f\u7269\u7406\u914d\u7f6e\u51fa\u53d1\uff0c\u5c06\u786e\u5b9a\u6027\u7269\u7406\u4eff\u771f\u4e0e\u89c6\u9891\u751f\u6210\u7ed3\u5408\uff0c\u7528\u4e8e\u957f\u671f\u89c6\u89d2\u63a2\u7d22\u548c\u7269\u4f53\u64cd\u63a7\u3002\u5b83\u901a\u8fc7\u5206\u79bb\u4eff\u771f\u72b6\u6001\u3001\u51e0\u4f55\u8bc1\u636e\u3001\u751f\u6210\u63a7\u5236\u4e0e\u5916\u89c2\u8bb0\u5fc6\uff0c\u63d0\u9ad8\u76f8\u673a/\u7269\u4f53\u8f68\u8ff9\u4e00\u81f4\u6027\uff0c\u51cf\u5c11\u957f\u7a0b\u91cd\u8bbf\u4e2d\u7684\u5916\u89c2\u6f02\u79fb\u5e76\u66f4\u597d\u4fdd\u7559\u8f93\u5165\u573a\u666f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04911", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u7269\u7406\u4eff\u771f", "\u89c6\u9891\u751f\u6210", "\u573a\u666f\u63a2\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04911v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TourPhysics: Bringing Physics to World Models for Exploration and Manipulation from a Single Image", "tldr": "TourPhysics \u4ece\u5355\u5f20\u56fe\u50cf\u548c\u58f0\u660e\u5f0f\u7269\u7406\u914d\u7f6e\u51fa\u53d1\uff0c\u5c06\u786e\u5b9a\u6027\u7269\u7406\u4eff\u771f\u4e0e\u89c6\u9891\u751f\u6210\u7ed3\u5408\uff0c\u7528\u4e8e\u957f\u671f\u89c6\u89d2\u63a2\u7d22\u548c\u7269\u4f53\u64cd\u63a7\u3002\u5b83\u901a\u8fc7\u5206\u79bb\u4eff\u771f\u72b6\u6001\u3001\u51e0\u4f55\u8bc1\u636e\u3001\u751f\u6210\u63a7\u5236\u4e0e\u5916\u89c2\u8bb0\u5fc6\uff0c\u63d0\u9ad8\u76f8\u673a/\u7269\u4f53\u8f68\u8ff9\u4e00\u81f4\u6027\uff0c\u51cf\u5c11\u957f\u7a0b\u91cd\u8bbf\u4e2d\u7684\u5916\u89c2\u6f02\u79fb\u5e76\u66f4\u597d\u4fdd\u7559\u8f93\u5165\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present InterSing, a framework for generating realistic 3D head animations for duet singing performances. Unlike solo singing, duet performance requires each singer to balance individual expressiveness with intermittent interaction at musically salient moments, such as phrase boundaries, synchronized rhythms, and call-and-response passages. Because these interactions are sparse and rhythm-dependent, existing audio-driven animation methods and conversational interaction models do not adequately capture their structure. Our key insight is that duet coordination can be represented as a time-varying signal that reflects how strongly performers engage with one another throughout a song. Based on this observation, we introduce interaction logits, an interpretable latent representation that models the degree of cross-performer engagement at each time step. We learn these logits using weak supervision and use them to condition an interaction-aware diffusion model jointly driven by audio features and interaction dynamics. This formulation enables unified multi-mode generation, spanning independent motion, coordinated behavior, and smooth transitions between them. Experiments show that InterSing generates realistic and expressive singing head animations with stronger coordination and musical alignment than existing methods, while preserving each performer\u0027s characteristic motion style. We further demonstrate that the same formulation generalizes to multi-singer performances and provides intuitive control over when and how performers engage.", "arxiv_id": "2609.04903", "arxiv_url": "https://arxiv.org/abs/2609.04903", "authors": ["Yihan Zhou", "Zikai Huang", "Yuyang Yu", "Xuemiao Xu", "Cheng Xu", "Shengfeng He"], "brief": "\u672c\u6587\u63d0\u51fa InterSing\uff0c\u7528\u4e8e\u751f\u6210\u4e8c\u91cd\u5531\u573a\u666f\u4e2d\u771f\u5b9e\u7684 3D \u5934\u90e8\u6f14\u5531\u52a8\u753b\u3002\u65b9\u6cd5\u5f15\u5165\u53ef\u89e3\u91ca\u7684\u201c\u4ea4\u4e92 logits\u201d\u6765\u523b\u753b\u968f\u65f6\u95f4\u53d8\u5316\u7684\u6b4c\u624b\u4e92\u52a8\u5f3a\u5ea6\uff0c\u5e76\u7528\u5176\u6761\u4ef6\u5316\u6269\u6563\u6a21\u578b\uff0c\u4ece\u800c\u5728\u72ec\u7acb\u52a8\u4f5c\u3001\u534f\u540c\u884c\u4e3a\u548c\u5e73\u6ed1\u8fc7\u6e21\u95f4\u7edf\u4e00\u751f\u6210\u3002\u5b9e\u9a8c\u8868\u660e\u5176\u5728\u534f\u8c03\u6027\u3001\u97f3\u4e50\u5bf9\u9f50\u548c\u4e2a\u4f53\u98ce\u683c\u4fdd\u6301\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u53ef\u6269\u5c55\u5230\u591a\u4eba\u6f14\u5531\u4e0e\u4ea4\u4e92\u63a7\u5236\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04903", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u52a8\u753b", "\u6269\u6563\u6a21\u578b", "\u97f3\u9891\u9a71\u52a8", "\u4ea4\u4e92\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04903v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "InterSing: Explicit Interaction Dynamics for 3D Duet Singing Animation and Beyond", "tldr": "\u672c\u6587\u63d0\u51fa InterSing\uff0c\u7528\u4e8e\u751f\u6210\u4e8c\u91cd\u5531\u573a\u666f\u4e2d\u771f\u5b9e\u7684 3D \u5934\u90e8\u6f14\u5531\u52a8\u753b\u3002\u65b9\u6cd5\u5f15\u5165\u53ef\u89e3\u91ca\u7684\u201c\u4ea4\u4e92 logits\u201d\u6765\u523b\u753b\u968f\u65f6\u95f4\u53d8\u5316\u7684\u6b4c\u624b\u4e92\u52a8\u5f3a\u5ea6\uff0c\u5e76\u7528\u5176\u6761\u4ef6\u5316\u6269\u6563\u6a21\u578b\uff0c\u4ece\u800c\u5728\u72ec\u7acb\u52a8\u4f5c\u3001\u534f\u540c\u884c\u4e3a\u548c\u5e73\u6ed1\u8fc7\u6e21\u95f4\u7edf\u4e00\u751f\u6210\u3002\u5b9e\u9a8c\u8868\u660e\u5176\u5728\u534f\u8c03\u6027\u3001\u97f3\u4e50\u5bf9\u9f50\u548c\u4e2a\u4f53\u98ce\u683c\u4fdd\u6301\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u53ef\u6269\u5c55\u5230\u591a\u4eba\u6f14\u5531\u4e0e\u4ea4\u4e92\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Weakly supervised 3D occupancy prediction reduces the reliance on costly 3D annotations by learning from 2D pseudo-labels generated by vision foundation models. However, existing methods typically use these imperfect pseudo-labels directly as supervision, making occupancy learning vulnerable to erroneous geometric and semantic targets. We observe that agreement across repeated observations provides an inexpensive and reliable cue for assessing pseudo-label reliability. Based on this observation, we propose \\textbf{LetOccVote}, a weakly supervised Gaussian-based occupancy framework that leverages cross-frame voting to improve both geometric and semantic supervision. For geometry, Depth Vote exploits cross-frame geometric agreement to refine supported pseudo depth and reject contradictory estimates before volumetric lifting and depth supervision. For semantics, Semantic Vote aggregates pseudo-semantic observations in a shared 3D space to identify reliable and contested evidence, strengthening reliable semantic supervision while filtering unreliable pseudo-label segments. The entire framework is trained solely with 2D pseudo-label supervision without requiring 3D occupancy annotations. On Occ3D-nuScenes, LetOccVote achieves 53.27 IoU and 20.39 mIoU, establishing state-of-the-art performance among methods with 2D pseudo-label supervision.", "arxiv_id": "2609.04846", "arxiv_url": "https://arxiv.org/abs/2609.04846", "authors": ["Chi Zhang", "Qi Song", "Feifei Li", "Jie Li", "Rui Huang"], "brief": "LetOccVote\u63d0\u51fa\u4e00\u79cd\u5f31\u76d1\u77633D\u5360\u7528\u9884\u6d4b\u6846\u67b6\uff0c\u5229\u7528\u8de8\u5e27\u4e00\u81f4\u6027\u6295\u7968\u6765\u8bc4\u4f30\u548c\u7b5b\u90092D\u57fa\u7840\u6a21\u578b\u751f\u6210\u7684\u4f2a\u6807\u7b7e\u53ef\u9760\u6027\u3002\u65b9\u6cd5\u5206\u522b\u901a\u8fc7\u6df1\u5ea6\u6295\u7968\u6539\u8fdb\u51e0\u4f55\u76d1\u7763\u3001\u8bed\u4e49\u6295\u7968\u8fc7\u6ee4\u4e0d\u53ef\u9760\u8bed\u4e49\u7247\u6bb5\uff0c\u4ec5\u75282D\u4f2a\u6807\u7b7e\u8bad\u7ec3\u5c31\u5728Occ3D-nuScenes\u4e0a\u8fbe\u52302D\u4f2a\u6807\u7b7e\u76d1\u7763\u65b9\u6cd5\u7684\u6700\u4f73\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04846", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["3D\u5360\u7528\u9884\u6d4b", "\u5f31\u76d1\u7763\u5b66\u4e60", "\u4f2a\u6807\u7b7e", "\u591a\u89c6\u89d2\u51e0\u4f55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04846v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LetOccVote: Learning Weakly Supervised 3D Occupancy through Consensus", "tldr": "LetOccVote\u63d0\u51fa\u4e00\u79cd\u5f31\u76d1\u77633D\u5360\u7528\u9884\u6d4b\u6846\u67b6\uff0c\u5229\u7528\u8de8\u5e27\u4e00\u81f4\u6027\u6295\u7968\u6765\u8bc4\u4f30\u548c\u7b5b\u90092D\u57fa\u7840\u6a21\u578b\u751f\u6210\u7684\u4f2a\u6807\u7b7e\u53ef\u9760\u6027\u3002\u65b9\u6cd5\u5206\u522b\u901a\u8fc7\u6df1\u5ea6\u6295\u7968\u6539\u8fdb\u51e0\u4f55\u76d1\u7763\u3001\u8bed\u4e49\u6295\u7968\u8fc7\u6ee4\u4e0d\u53ef\u9760\u8bed\u4e49\u7247\u6bb5\uff0c\u4ec5\u75282D\u4f2a\u6807\u7b7e\u8bad\u7ec3\u5c31\u5728Occ3D-nuScenes\u4e0a\u8fbe\u52302D\u4f2a\u6807\u7b7e\u76d1\u7763\u65b9\u6cd5\u7684\u6700\u4f73\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Single domain generalization (SDG) aims to learn a model from one labeled source domain that generalizes to unseen target domains. A common strategy is to enrich the source distribution with augmented or generated samples, and recent text-to-image (T2I) diffusion models provide a strong generative prior for this purpose. However, diversity alone is insufficient for robust generalization, because useful generated samples should also capture variations that the current classifier finds difficult. Motivated by distributionally robust optimization (DRO), we define a semantic ambiguity set in the class-conditional generative space of a pretrained T2I model and search it for samples with high classification loss under the current classifier. To this end, we introduce PAPT++, a risk-aware adversarial generation-training framework for SDG. PAPT++ first learns diverse semantic reference images for each class through image-text alignment and intra-class diversity regularization. These references then serve as denoising targets during classifier-guided diffusion synthesis, reducing semantic drift while guiding generation toward challenging variations. The generated samples are combined with the source data to update the classifier, and the updated classifier guides the next synthesis round in return. In this way, PAPT++ progressively exposes the classifier to challenging yet semantically consistent variations. Extensive experiments on standard SDG benchmarks demonstrate the superiority of the proposed PAPT++ method and the effectiveness of its main components.", "arxiv_id": "2609.04837", "arxiv_url": "https://arxiv.org/abs/2609.04837", "authors": ["Zhipeng Xu", "De Cheng", "Xinyang Jiang", "Lingfeng He", "Huaijie Wang", "Dongsheng Li", "Nannan Wang", "Xinbo Gao"], "brief": "\u672c\u6587\u63d0\u51fa PAPT++\uff0c\u4e00\u79cd\u9762\u5411\u5355\u57df\u6cdb\u5316\u7684\u98ce\u9669\u611f\u77e5\u5bf9\u6297\u751f\u6210\u4e0e\u8bad\u7ec3\u6846\u67b6\uff0c\u5229\u7528\u9884\u8bad\u7ec3\u6587\u751f\u56fe\u6269\u6563\u6a21\u578b\u5728\u8bed\u4e49\u4e00\u81f4\u7684\u7c7b\u522b\u6761\u4ef6\u7a7a\u95f4\u4e2d\u5bfb\u627e\u5f53\u524d\u5206\u7c7b\u5668\u96be\u4ee5\u5904\u7406\u7684\u9ad8\u635f\u5931\u6837\u672c\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u6837\u5316\u8bed\u4e49\u53c2\u8003\u56fe\u7ea6\u675f\u751f\u6210\u3001\u518d\u7528\u751f\u6210\u7684\u6311\u6218\u6837\u672c\u8fed\u4ee3\u66f4\u65b0\u5206\u7c7b\u5668\uff0c\u5728\u591a\u4e2a\u5355\u57df\u6cdb\u5316\u57fa\u51c6\u4e0a\u53d6\u5f97\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u7684\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04837", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u57df\u6cdb\u5316", "\u6269\u6563\u6a21\u578b", "\u5bf9\u6297\u8bad\u7ec3", "\u9c81\u68d2\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04837v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PAPT++: Risk-Aware Adversarial Tuning and Generation for Single Domain Generalization", "tldr": "\u672c\u6587\u63d0\u51fa PAPT++\uff0c\u4e00\u79cd\u9762\u5411\u5355\u57df\u6cdb\u5316\u7684\u98ce\u9669\u611f\u77e5\u5bf9\u6297\u751f\u6210\u4e0e\u8bad\u7ec3\u6846\u67b6\uff0c\u5229\u7528\u9884\u8bad\u7ec3\u6587\u751f\u56fe\u6269\u6563\u6a21\u578b\u5728\u8bed\u4e49\u4e00\u81f4\u7684\u7c7b\u522b\u6761\u4ef6\u7a7a\u95f4\u4e2d\u5bfb\u627e\u5f53\u524d\u5206\u7c7b\u5668\u96be\u4ee5\u5904\u7406\u7684\u9ad8\u635f\u5931\u6837\u672c\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u6837\u5316\u8bed\u4e49\u53c2\u8003\u56fe\u7ea6\u675f\u751f\u6210\u3001\u518d\u7528\u751f\u6210\u7684\u6311\u6218\u6837\u672c\u8fed\u4ee3\u66f4\u65b0\u5206\u7c7b\u5668\uff0c\u5728\u591a\u4e2a\u5355\u57df\u6cdb\u5316\u57fa\u51c6\u4e0a\u53d6\u5f97\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u7684\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Monocular depth estimation foundation models, such as the Depth Anything series, have achieved remarkable performance across diverse domains. However, they still suffer from critical failures under adverse weather conditions, such as fog, rain, snow, or at night. To address this, we present Weather-Conditioned Depth Anything (DA-W), a framework that explicitly disentangles style from content for weather-robust depth estimation. Specifically, we introduce a Style Filter trained on a curated mix of real and synthetic degradation datasets to extract content-independent, degradation-aware weather embeddings. This style embedding is then injected into the Depth Anything backbone using a parameter-efficient, zero-initialized adapter. Such a lightweight modulation allows a single unified model to robustly adapt to diverse conditions, including fog, rain, snow, and low-light, while avoiding catastrophic forgetting of its core generalization abilities in normal conditions. We train the adapter using a pseudo-label distillation and alignment strategy. Our comprehensive experiments demonstrate that our proposed DA-W achieves state-of-the-art robust depth estimation, improving AbsRel by an average of 3.7% on our curated weather benchmarks, while matching or slightly outperforming performance on standard clean benchmarks. Our project page is available at https://zhaoming-tamu.github.io/WCDA/.", "arxiv_id": "2609.04827", "arxiv_url": "https://arxiv.org/abs/2609.04827", "authors": ["Zhaoming Xu", "Chan-Wei Hu", "Kuan-Ru Huang", "Zihao Zhu", "Renjie Li", "Yang Zhou", "Zhengzhong Tu"], "brief": "\u672c\u6587\u63d0\u51fa Weather-Conditioned Depth Anything\uff08DA-W\uff09\uff0c\u901a\u8fc7\u98ce\u683c\u8fc7\u6ee4\u5668\u63d0\u53d6\u4e0e\u5185\u5bb9\u89e3\u8026\u7684\u5929\u6c14\u9000\u5316\u5d4c\u5165\uff0c\u5e76\u7528\u8f7b\u91cf\u96f6\u521d\u59cb\u5316\u9002\u914d\u5668\u6ce8\u5165 Depth Anything \u4e3b\u5e72\uff0c\u4ee5\u63d0\u5347\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u5728\u96fe\u3001\u96e8\u3001\u96ea\u3001\u591c\u95f4\u7b49\u6076\u52a3\u5929\u6c14\u4e0b\u7684\u9c81\u68d2\u6027\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5929\u6c14\u57fa\u51c6\u4e0a AbsRel \u5e73\u5747\u63d0\u5347 3.7%\uff0c\u540c\u65f6\u4fdd\u6301\u6216\u7565\u4f18\u4e8e\u6807\u51c6\u5e72\u51c0\u573a\u666f\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04827", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u9c81\u68d2\u6027", "\u9002\u914d\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04827v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Weather-Conditioned Depth Anything", "tldr": "\u672c\u6587\u63d0\u51fa Weather-Conditioned Depth Anything\uff08DA-W\uff09\uff0c\u901a\u8fc7\u98ce\u683c\u8fc7\u6ee4\u5668\u63d0\u53d6\u4e0e\u5185\u5bb9\u89e3\u8026\u7684\u5929\u6c14\u9000\u5316\u5d4c\u5165\uff0c\u5e76\u7528\u8f7b\u91cf\u96f6\u521d\u59cb\u5316\u9002\u914d\u5668\u6ce8\u5165 Depth Anything \u4e3b\u5e72\uff0c\u4ee5\u63d0\u5347\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u5728\u96fe\u3001\u96e8\u3001\u96ea\u3001\u591c\u95f4\u7b49\u6076\u52a3\u5929\u6c14\u4e0b\u7684\u9c81\u68d2\u6027\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5929\u6c14\u57fa\u51c6\u4e0a AbsRel \u5e73\u5747\u63d0\u5347 3.7%\uff0c\u540c\u65f6\u4fdd\u6301\u6216\u7565\u4f18\u4e8e\u6807\u51c6\u5e72\u51c0\u573a\u666f\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-vehicle cooperative autonomous driving enhances the safety and reliability of autonomous driving systems through information sharing among connected vehicles, demonstrating significant potential for improving traffic safety. LLM-based approaches leverage strong reasoning capabilities of LLMs to enable effective inter-vehicle negotiation and improve cooperative driving performance. However, driving decisions in complex traffic scenarios are inherently multi-solution in nature. As a result, existing negotiation-based methods often converge prematurely to suboptimal solutions, hindering consensus formation and limiting the practical deployment of cooperative autonomous driving systems. To address this challenge, we propose CoLMIN, the LLM-based multi-decision path negotiation framework for cooperative autonomous driving, achieving stable decision consensus through multi-decision path negotiation and reflective reasoning. To achieve stable and high-quality consensus in cooperative autonomous driving, CoLMIN consists of three key components: (i) an LLM-based Multi-Intent Negotiation module (LMin), which adopts a Negotiator-Evaluator paradigm and generates multiple candidate driving intentions for joint evaluation; (ii) an Evaluation-based Shallow Reflection Module (ESRM), which analyzes negotiation outcomes and provides feedback to guide subsequent negotiations, thereby accelerating consensus formation; and (iii) an LLM-based Deep Reflection Module (LDRM), which performs long-term reflection over negotiation histories to mitigate cognitive fixation and prevent the system from converging to suboptimal solutions. Experimental results in the CARLA simulation environment demonstrate that CoLMIN significantly outperforms existing methods in challenging interactive driving scenarios.", "arxiv_id": "2609.04807", "arxiv_url": "https://arxiv.org/abs/2609.04807", "authors": ["Zhe Huang", "Zhaoxin Fan", "Shuo Wang", "Wenjun Wu", "Xuan Zhao", "Min Liu"], "brief": "\u672c\u6587\u63d0\u51fa CoLMIN\uff0c\u4e00\u4e2a\u9762\u5411\u534f\u540c\u81ea\u52a8\u9a7e\u9a76\u7684 LLM \u591a\u51b3\u7b56\u8def\u5f84\u534f\u5546\u6846\u67b6\uff0c\u901a\u8fc7\u591a\u610f\u56fe\u751f\u6210\u3001\u8bc4\u4f30\u5f0f\u6d45\u53cd\u601d\u548c\u957f\u671f\u6df1\u53cd\u601d\u6765\u5f62\u6210\u66f4\u7a33\u5b9a\u7684\u8f66\u8f86\u95f4\u51b3\u7b56\u5171\u8bc6\u3002\u5b9e\u9a8c\u5728 CARLA \u4e2d\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u5728\u590d\u6742\u4ea4\u4e92\u9a7e\u9a76\u573a\u666f\u4e0b\u4f18\u4e8e\u73b0\u6709\u534f\u5546\u65b9\u6cd5\uff0c\u80fd\u51cf\u5c11\u8fc7\u65e9\u6536\u655b\u5230\u6b21\u4f18\u65b9\u6848\u7684\u95ee\u9898\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04807", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u9a7e\u9a76", "\u5927\u8bed\u8a00\u6a21\u578b", "\u534f\u540c\u51b3\u7b56"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04807v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoLMIN: LLM-based Multi-Decision Path Negotiation for Cooperative Autonomous Driving", "tldr": "\u672c\u6587\u63d0\u51fa CoLMIN\uff0c\u4e00\u4e2a\u9762\u5411\u534f\u540c\u81ea\u52a8\u9a7e\u9a76\u7684 LLM \u591a\u51b3\u7b56\u8def\u5f84\u534f\u5546\u6846\u67b6\uff0c\u901a\u8fc7\u591a\u610f\u56fe\u751f\u6210\u3001\u8bc4\u4f30\u5f0f\u6d45\u53cd\u601d\u548c\u957f\u671f\u6df1\u53cd\u601d\u6765\u5f62\u6210\u66f4\u7a33\u5b9a\u7684\u8f66\u8f86\u95f4\u51b3\u7b56\u5171\u8bc6\u3002\u5b9e\u9a8c\u5728 CARLA \u4e2d\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u5728\u590d\u6742\u4ea4\u4e92\u9a7e\u9a76\u573a\u666f\u4e0b\u4f18\u4e8e\u73b0\u6709\u534f\u5546\u65b9\u6cd5\uff0c\u80fd\u51cf\u5c11\u8fc7\u65e9\u6536\u655b\u5230\u6b21\u4f18\u65b9\u6848\u7684\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Partially Relevant Video Retrieval (PRVR) aims to retrieve untrimmed videos that contain moments relevant to a text query. Since the target moment occupies only a portion of the video, PRVR requires retrieval based on fine-grained understanding beyond coarse video-level matching. However, existing methods often rely on frozen CLIP frame features, which lack temporal understanding. Even with recent progress in parameter-efficient CLIP adaptation, video-level predictions can still be supported by imprecise frame-level evidence. In this paper, we propose an Intrinsic Temporal Adaptation (ITA) framework for PRVR. First, our Backbone-Internal Temporal Adaptation allows the last few visual transformer layers to attend over groups of neighboring frames. This provides temporally aware frame embeddings while keeping CLIP frozen and training only adaptation parameters. Second, we introduce Affinity-Weighted Gradient Propagation to address the weakly supervised nature of PRVR, softly aggregating top-$k$ frames based on text-frame affinities and propagating learning signals to multiple query-relevant frames. Our method achieves state-of-the-art performance on PRVR benchmarks, demonstrates robust cross-dataset transfer, and retrieves substantially more accurate frame-level evidence within ground-truth query-relevant moments. Our code is available at github.com/hynnsk/ITA.", "arxiv_id": "2609.04800", "arxiv_url": "https://arxiv.org/abs/2609.04800", "authors": ["Hyun Seok Seong", "Woojin Jun", "SuBeen Lee", "Jae-Pil Heo"], "brief": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u90e8\u5206\u76f8\u5173\u89c6\u9891\u68c0\u7d22\u7684 Intrinsic Temporal Adaptation\uff08ITA\uff09\u6846\u67b6\uff0c\u5728\u51bb\u7ed3 CLIP \u4e3b\u4f53\u7684\u540c\u65f6\u4e3a\u89c6\u89c9 Transformer \u540e\u51e0\u5c42\u52a0\u5165\u90bb\u8fd1\u5e27\u65f6\u5e8f\u9002\u914d\uff0c\u5e76\u901a\u8fc7\u4eb2\u548c\u5ea6\u52a0\u6743\u68af\u5ea6\u4f20\u64ad\u7f13\u89e3\u5f31\u76d1\u7763\u4e0b\u7684\u5e27\u7ea7\u8bc1\u636e\u4e0d\u51c6\u95ee\u9898\u3002\u65b9\u6cd5\u5728 PRVR \u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u8de8\u6570\u636e\u96c6\u8fc1\u79fb\u66f4\u7a33\u5065\uff0c\u5e76\u80fd\u66f4\u51c6\u786e\u5b9a\u4f4d\u67e5\u8be2\u76f8\u5173\u7684\u89c6\u9891\u7247\u6bb5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04800", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u68c0\u7d22", "CLIP", "\u65f6\u5e8f\u5efa\u6a21", "\u5f31\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04800v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Intrinsic Temporal Adaptation of CLIP for Partially Relevant Video Retrieval", "tldr": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u90e8\u5206\u76f8\u5173\u89c6\u9891\u68c0\u7d22\u7684 Intrinsic Temporal Adaptation\uff08ITA\uff09\u6846\u67b6\uff0c\u5728\u51bb\u7ed3 CLIP \u4e3b\u4f53\u7684\u540c\u65f6\u4e3a\u89c6\u89c9 Transformer \u540e\u51e0\u5c42\u52a0\u5165\u90bb\u8fd1\u5e27\u65f6\u5e8f\u9002\u914d\uff0c\u5e76\u901a\u8fc7\u4eb2\u548c\u5ea6\u52a0\u6743\u68af\u5ea6\u4f20\u64ad\u7f13\u89e3\u5f31\u76d1\u7763\u4e0b\u7684\u5e27\u7ea7\u8bc1\u636e\u4e0d\u51c6\u95ee\u9898\u3002\u65b9\u6cd5\u5728 PRVR \u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u8de8\u6570\u636e\u96c6\u8fc1\u79fb\u66f4\u7a33\u5065\uff0c\u5e76\u80fd\u66f4\u51c6\u786e\u5b9a\u4f4d\u67e5\u8be2\u76f8\u5173\u7684\u89c6\u9891\u7247\u6bb5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Lesion-focused image classification presents a core analytical challenge, as discriminative signals are often sparse, spatially dispersed, and easily obscured by background noise, while conventional convolutional neural networks (CNNs) process entire images uniformly and may dilute signal relevance. This study hypothesizes that adaptive fusion of global contextual information and lesion-focused local information can improve classification performance compared with using either representation independently. We propose a three-branch, attention-guided deep learning framework built on Densely Connected Convolutional Network-121 (DenseNet-121) to improve feature attribution, interpretability, and classification reliability. The architecture consists of a global branch that learns representations from full images, followed by Gradient-weighted Class Activation Mapping (Grad-CAM) to generate attention maps that highlight prediction-relevant regions and produce masked inputs, and a local branch enhanced with a Convolutional Block Attention Module (CBAM) to extract refined spatial and channel-wise features from these focused regions. An adaptive fusion branch integrates global and local representations by learning instance-specific weights, allowing dynamic prioritization between contextual and localized information. The framework is evaluated on a synthetic Spot Pattern Dataset (SSPD) and three benchmark datasets, including skin lesion, guava leaf, and grape leaf image datasets, where the fusion branch outperformed the individual global and local branches, reaching 97.75% accuracy on the skin lesion dataset and 99.64% on the guava leaf dataset. The results highlight the value of attention-guided architectures in healthcare analytics by improving model transparency, strengthening feature relevance, and supporting more reliable data-driven decision-making in medical image analysis.", "arxiv_id": "2609.04791", "arxiv_url": "https://arxiv.org/abs/2609.04791", "authors": ["Mst Shafia Tasnima", "Md Samaun Elaheea", "Tanjim Taharat Aurpab", "Md Musfique Anwar"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e DenseNet-121 \u7684\u4e09\u5206\u652f\u6ce8\u610f\u529b\u5f15\u5bfc\u878d\u5408\u6846\u67b6\uff0c\u7ed3\u5408\u5168\u56fe\u4e0a\u4e0b\u6587\u7279\u5f81\u3001Grad-CAM \u5b9a\u4f4d\u7684\u75c5\u7076\u5c40\u90e8\u7279\u5f81\u4ee5\u53ca\u81ea\u9002\u5e94\u5168\u5c40-\u5c40\u90e8\u878d\u5408\u3002\u8be5\u65b9\u6cd5\u5728\u76ae\u80a4\u75c5\u7076\u3001\u756a\u77f3\u69b4\u53f6\u548c\u8461\u8404\u53f6\u7b49\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u5355\u72ec\u5168\u5c40\u6216\u5c40\u90e8\u5206\u652f\uff0c\u76ae\u80a4\u75c5\u7076\u51c6\u786e\u7387\u8fbe 97.75%\uff0c\u63d0\u5347\u4e86\u5206\u7c7b\u6027\u80fd\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04791", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf", "\u56fe\u50cf\u5206\u7c7b", "\u6ce8\u610f\u529b\u673a\u5236", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04791v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "An Attention-Guided Global and Local Fusion Framework for Lesion-Focused Image Classification", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e DenseNet-121 \u7684\u4e09\u5206\u652f\u6ce8\u610f\u529b\u5f15\u5bfc\u878d\u5408\u6846\u67b6\uff0c\u7ed3\u5408\u5168\u56fe\u4e0a\u4e0b\u6587\u7279\u5f81\u3001Grad-CAM \u5b9a\u4f4d\u7684\u75c5\u7076\u5c40\u90e8\u7279\u5f81\u4ee5\u53ca\u81ea\u9002\u5e94\u5168\u5c40-\u5c40\u90e8\u878d\u5408\u3002\u8be5\u65b9\u6cd5\u5728\u76ae\u80a4\u75c5\u7076\u3001\u756a\u77f3\u69b4\u53f6\u548c\u8461\u8404\u53f6\u7b49\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u5355\u72ec\u5168\u5c40\u6216\u5c40\u90e8\u5206\u652f\uff0c\u76ae\u80a4\u75c5\u7076\u51c6\u786e\u7387\u8fbe 97.75%\uff0c\u63d0\u5347\u4e86\u5206\u7c7b\u6027\u80fd\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Zero-shot 6D pose estimation pipelines increasingly rely on strong downstream pose solvers, but their performance is often limited by the front-end: object proposals must preserve partially visible true positives while rejecting semantically plausible distractors. We introduce Cue-Calibrated Linguistic Object Onboarding (CLON), a front-end requiring no task-specific training for new objects. Given rendered templates of the onboarded object set, CLON constructs a linguistic semantic memory for top-down proposal generation and object-set cue weights for calibrated proposal scoring. The linguistic memory guides SAM 3 toward high-recall proposals for onboarded objects, while cue weights are computed once from the onboarded object set before scene inference and kept fixed during online scoring. On seven BOP-Classic-Core datasets, CLON improves detection AP by 8.1 percentage points (pp), segmentation AP by 6.2 pp, and downstream 6D pose AR by up to 4.1 pp over CNOS and SAM-6D front-ends.", "arxiv_id": "2609.04784", "arxiv_url": "https://arxiv.org/abs/2609.04784", "authors": ["Seojin Ji", "Yoojin Kwon", "Hyung-Sin Kim"], "brief": "\u672c\u6587\u63d0\u51fa CLON\uff0c\u4e00\u4e2a\u65e0\u9700\u9488\u5bf9\u65b0\u7269\u4f53\u8bad\u7ec3\u7684\u96f6\u6837\u672c 6D \u4f4d\u59ff\u4f30\u8ba1\u524d\u7aef\u3002\u5b83\u5229\u7528\u6e32\u67d3\u6a21\u677f\u6784\u5efa\u8bed\u8a00\u8bed\u4e49\u8bb0\u5fc6\u5e76\u6821\u51c6\u7269\u4f53\u7ebf\u7d22\u6743\u91cd\uff0c\u5f15\u5bfc SAM 3 \u751f\u6210\u9ad8\u53ec\u56de\u5019\u9009\u5e76\u6291\u5236\u5e72\u6270\u7269\uff0c\u5728\u591a\u4e2a BOP \u6570\u636e\u96c6\u4e0a\u63d0\u5347\u68c0\u6d4b\u3001\u5206\u5272\u548c\u4e0b\u6e38 6D \u4f4d\u59ff\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04784", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["6D\u4f4d\u59ff\u4f30\u8ba1", "\u96f6\u6837\u672c", "\u89c6\u89c9\u5206\u5272", "\u76ee\u6807\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04784v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CLON: Cue-Calibrated Linguistic Object Onboarding for Zero-Shot 6D Pose Front-Ends", "tldr": "\u672c\u6587\u63d0\u51fa CLON\uff0c\u4e00\u4e2a\u65e0\u9700\u9488\u5bf9\u65b0\u7269\u4f53\u8bad\u7ec3\u7684\u96f6\u6837\u672c 6D \u4f4d\u59ff\u4f30\u8ba1\u524d\u7aef\u3002\u5b83\u5229\u7528\u6e32\u67d3\u6a21\u677f\u6784\u5efa\u8bed\u8a00\u8bed\u4e49\u8bb0\u5fc6\u5e76\u6821\u51c6\u7269\u4f53\u7ebf\u7d22\u6743\u91cd\uff0c\u5f15\u5bfc SAM 3 \u751f\u6210\u9ad8\u53ec\u56de\u5019\u9009\u5e76\u6291\u5236\u5e72\u6270\u7269\uff0c\u5728\u591a\u4e2a BOP \u6570\u636e\u96c6\u4e0a\u63d0\u5347\u68c0\u6d4b\u3001\u5206\u5272\u548c\u4e0b\u6e38 6D \u4f4d\u59ff\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-modal medical images and clinical reports provide complementary anatomical, functional, and semantic information for medical image segmentation. Effectively exploiting these heterogeneous sources requires fine-grained cross-modal information fusion that preserves subtle spatial details while capturing semantic dependencies across modalities. Existing fusion approaches frequently rely on cross-attention, whose computational burden increases rapidly with spatial resolution, making dense cross-modal interaction difficult on high-resolution feature maps, particularly for volumetric medical images. In this work, we propose CoMLP, a cooperatively-gated MLP module for fine-grained cross-modal information fusion in medical image segmentation. CoMLP models cross-modal dependencies through cooperative cross-gating, built upon complementary regional and dilated MLP interactions, to capture local and global cross-modal dependencies. We further develop a multi-source fusion architecture in which CoMLP performs both inter-image fusion across imaging modalities and vision-language fusion between visual features and textual reports, enabling heterogeneous information to be integrated without relying on dense cross-attention. Extensive experiments on five medical segmentation benchmarks, covering 2D/3D images, clinical reports, multiple imaging modalities, and diverse anatomical regions, demonstrate consistent improvements over state-of-the-art multi-modal and language-guided segmentation methods. Ablation studies further show that fine-grained interaction at high spatial resolutions and complementary local-global fusion are critical to the performance gains. These results demonstrate the potential of MLP-based interaction as an effective alternative for fine-grained cross-modal information fusion in medical image segmentation.", "arxiv_id": "2609.04781", "arxiv_url": "https://arxiv.org/abs/2609.04781", "authors": ["Mingyuan Meng", "Shuchang Ye", "Mingjian Li", "Zhenyu Zhao", "Jinman Kim", "Lei Bi"], "brief": "\u8bba\u6587\u63d0\u51fa CoMLP\uff0c\u4e00\u79cd\u534f\u540c\u95e8\u63a7 MLP \u6a21\u5757\uff0c\u7528\u4e8e\u533b\u5b66\u56fe\u50cf\u5206\u5272\u4e2d\u7684\u7ec6\u7c92\u5ea6\u8de8\u6a21\u6001\u878d\u5408\uff0c\u907f\u514d\u9ad8\u5206\u8fa8\u7387\u7279\u5f81\u4e0a\u5bc6\u96c6\u4ea4\u53c9\u6ce8\u610f\u529b\u7684\u9ad8\u8ba1\u7b97\u5f00\u9500\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u5c40\u90e8\u533a\u57df\u4e0e\u7a7a\u6d1e MLP \u4ea4\u4e92\uff0c\u540c\u65f6\u652f\u6301\u591a\u5f71\u50cf\u6a21\u6001\u878d\u5408\u548c\u5f71\u50cf-\u6587\u672c\u62a5\u544a\u878d\u5408\uff0c\u5728\u4e94\u4e2a 2D/3D \u533b\u5b66\u5206\u5272\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u591a\u6a21\u6001\u4e0e\u8bed\u8a00\u5f15\u5bfc\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04781", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00", "MLP"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04781v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoMLP: Cooperatively-Gated MLPs for Fine-Grained Cross-Modal Information Fusion in Medical Image Segmentation", "tldr": "\u8bba\u6587\u63d0\u51fa CoMLP\uff0c\u4e00\u79cd\u534f\u540c\u95e8\u63a7 MLP \u6a21\u5757\uff0c\u7528\u4e8e\u533b\u5b66\u56fe\u50cf\u5206\u5272\u4e2d\u7684\u7ec6\u7c92\u5ea6\u8de8\u6a21\u6001\u878d\u5408\uff0c\u907f\u514d\u9ad8\u5206\u8fa8\u7387\u7279\u5f81\u4e0a\u5bc6\u96c6\u4ea4\u53c9\u6ce8\u610f\u529b\u7684\u9ad8\u8ba1\u7b97\u5f00\u9500\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u5c40\u90e8\u533a\u57df\u4e0e\u7a7a\u6d1e MLP \u4ea4\u4e92\uff0c\u540c\u65f6\u652f\u6301\u591a\u5f71\u50cf\u6a21\u6001\u878d\u5408\u548c\u5f71\u50cf-\u6587\u672c\u62a5\u544a\u878d\u5408\uff0c\u5728\u4e94\u4e2a 2D/3D \u533b\u5b66\u5206\u5272\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u591a\u6a21\u6001\u4e0e\u8bed\u8a00\u5f15\u5bfc\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Industrial anomaly detection faces two engineering bottlenecks: memory bank construction latency and inference efficiency. Traditional sampling algorithms (Farthest Point Sampling, K-Means, etc.) rely on numerous backbone forward passes and iterative distance computations, with construction times ranging from minutes to hours; heavy computation components such as multi-scale feature extraction struggle to meet the millisecond-level real-time requirements of production lines. This paper focuses on sampling efficiency and inference optimization for industrial deployment with two core contributions: (1) PSP (Plugin Sampler Pipeline)---a four-stage adaptive memory bank sampling pipeline based on 18-dimensional pixel metadata and five complementary visual plugins. PSP completes all sampling with zero backbone forward passes; coarse filtering is sub-second numerical sorting, and metadata extraction is a one-time offline cost. PSP supports progressive deployment and incremental updates. (2) Two engineering optimization strategies---parallel memory bank similarity computation (reducing inference memory and latency by over 95\\%) and stratified pixel sampling for large-scale evaluation (reducing computation time by 20$\\times$ while keeping metrics stable). As a vehicle for validation, we introduce LUMIN (Lightweight Universal Manufacturing Inspection Network) with extreme segmentation-head compression, systematically exploring the accuracy-efficiency frontier against strong baselines. Experiments on five benchmarks demonstrate that PSP matches state-of-the-art sampling accuracy at near-random construction cost (341$\\times$ faster than FPS), while inference optimizations reduce evaluation time by 20$\\times$ with negligible accuracy loss.", "arxiv_id": "2609.04775", "arxiv_url": "https://arxiv.org/abs/2609.04775", "authors": ["Pengfei Yang"], "brief": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u5de5\u4e1a\u5f02\u5e38\u68c0\u6d4b\u90e8\u7f72\u7684 LUMIN\uff0c\u91cd\u70b9\u89e3\u51b3\u8bb0\u5fc6\u5e93\u6784\u5efa\u6162\u548c\u63a8\u7406\u6548\u7387\u4f4e\u7684\u95ee\u9898\u3002\u5176 PSP \u91c7\u6837\u7ba1\u7ebf\u65e0\u9700\u9aa8\u5e72\u7f51\u7edc\u524d\u5411\u5373\u53ef\u5b8c\u6210\u91c7\u6837\uff0c\u6784\u5efa\u901f\u5ea6\u6bd4 FPS \u5feb 341 \u500d\uff1b\u5e76\u901a\u8fc7\u5e76\u884c\u76f8\u4f3c\u5ea6\u8ba1\u7b97\u548c\u5206\u5c42\u50cf\u7d20\u91c7\u6837\u5c06\u8bc4\u4f30/\u63a8\u7406\u5f00\u9500\u663e\u8457\u964d\u4f4e\uff0c\u7cbe\u5ea6\u635f\u5931\u5f88\u5c0f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04775", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f02\u5e38\u68c0\u6d4b", "\u5de5\u4e1a\u89c6\u89c9", "\u6a21\u578b\u52a0\u901f", "\u8bb0\u5fc6\u5e93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04775v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LUMIN: Lightweight Universal Manufacturing Inspection Network for Anomaly Detection", "tldr": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u5de5\u4e1a\u5f02\u5e38\u68c0\u6d4b\u90e8\u7f72\u7684 LUMIN\uff0c\u91cd\u70b9\u89e3\u51b3\u8bb0\u5fc6\u5e93\u6784\u5efa\u6162\u548c\u63a8\u7406\u6548\u7387\u4f4e\u7684\u95ee\u9898\u3002\u5176 PSP \u91c7\u6837\u7ba1\u7ebf\u65e0\u9700\u9aa8\u5e72\u7f51\u7edc\u524d\u5411\u5373\u53ef\u5b8c\u6210\u91c7\u6837\uff0c\u6784\u5efa\u901f\u5ea6\u6bd4 FPS \u5feb 341 \u500d\uff1b\u5e76\u901a\u8fc7\u5e76\u884c\u76f8\u4f3c\u5ea6\u8ba1\u7b97\u548c\u5206\u5c42\u50cf\u7d20\u91c7\u6837\u5c06\u8bc4\u4f30/\u63a8\u7406\u5f00\u9500\u663e\u8457\u964d\u4f4e\uff0c\u7cbe\u5ea6\u635f\u5931\u5f88\u5c0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "3D surface cutting and UV unwrapping are fundamental problems in computer graphics. Traditional geometric optimization methods mainly focus on reducing parameterization distortion, but they often overlook visual semantic coherence in seam layouts. Recent autoregressive generative methods improve semantic coherence, yet limited perception of mesh topology often causes inaccurate local cuts. To address these limitations, we introduce SeamFlow, a novel generative framework for 3D surface cutting. We reformulate the discrete mesh-cutting problem as continuous flow matching in a high-dimensional edge-probability space. Through continuous relaxation, SeamFlow learns a deterministic mapping from a Gaussian prior to a target seam-probability distribution. An evolution network couples local topological tokens with global shape priors and guides smooth probability flow through Ordinary Differential Equation solving. Compared with existing autoregressive generative frameworks, SeamFlow improves topology awareness through edge tokenization while eliminating both 3D spatial projection errors and artificial sequential-order bias. Extensive experiments demonstrate that SeamFlow achieves exceptional semantic coherence and remarkably low parameterization distortion. The project page is https://meshy-dev.github.io/seamflow.", "arxiv_id": "2609.04751", "arxiv_url": "https://arxiv.org/abs/2609.04751", "authors": ["Yuming Zhao", "Zangyueyang Xian", "Qijian Zhang", "Rendong Liang", "Qin Jia", "Ying He", "Junhui Hou"], "brief": "SeamFlow \u5c06 3D \u7f51\u683c\u5207\u5272\u4e0e UV \u5c55\u5f00\u4e2d\u7684\u79bb\u6563\u63a5\u7f1d\u751f\u6210\uff0c\u91cd\u6784\u4e3a\u8fb9\u6982\u7387\u7a7a\u95f4\u4e2d\u7684\u8fde\u7eed\u6d41\u5339\u914d\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u7ed3\u5408\u5c40\u90e8\u62d3\u6251 token \u4e0e\u5168\u5c40\u5f62\u72b6\u5148\u9a8c\uff0c\u751f\u6210\u66f4\u7b26\u5408\u827a\u672f\u8bed\u4e49\u7684\u63a5\u7f1d\u5e03\u5c40\uff0c\u5e76\u5728\u5b9e\u9a8c\u4e2d\u540c\u65f6\u964d\u4f4e\u53c2\u6570\u5316\u5931\u771f\u3001\u63d0\u5347\u62d3\u6251\u611f\u77e5\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04751", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u89c6\u89c9", "\u6d41\u5339\u914d", "\u7f51\u683c\u5904\u7406", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04751v1", "published_at": "2026-09-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SeamFlow: Structure-Aware Flow Matching on Edge Probabilities for Artist-Like UV Unwrapping", "tldr": "SeamFlow \u5c06 3D \u7f51\u683c\u5207\u5272\u4e0e UV \u5c55\u5f00\u4e2d\u7684\u79bb\u6563\u63a5\u7f1d\u751f\u6210\uff0c\u91cd\u6784\u4e3a\u8fb9\u6982\u7387\u7a7a\u95f4\u4e2d\u7684\u8fde\u7eed\u6d41\u5339\u914d\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u7ed3\u5408\u5c40\u90e8\u62d3\u6251 token \u4e0e\u5168\u5c40\u5f62\u72b6\u5148\u9a8c\uff0c\u751f\u6210\u66f4\u7b26\u5408\u827a\u672f\u8bed\u4e49\u7684\u63a5\u7f1d\u5e03\u5c40\uff0c\u5e76\u5728\u5b9e\u9a8c\u4e2d\u540c\u65f6\u964d\u4f4e\u53c2\u6570\u5316\u5931\u771f\u3001\u63d0\u5347\u62d3\u6251\u611f\u77e5\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
