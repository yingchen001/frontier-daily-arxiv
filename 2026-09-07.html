2\u5f3a\u5ea6\u3002", "why_notable": "\u5b83\u63d0\u51fa\u4e86\u4e00\u79cd\u67b6\u6784\u9c81\u68d2\u7684\u4e2a\u6027\u5316\u8054\u90a6\u5b66\u4e60\u601d\u8def\uff1a\u628a\u6a21\u578b\u5f53\u4f5c\u53ef\u5fae\u9ed1\u76d2\uff0c\u4ec5\u57fa\u4e8e\u68af\u5ea6\u4fe1\u53f7\u5b8c\u6210\u4e2a\u6027\u5316\u51b3\u7b56\uff0c\u56e0\u800c\u53ef\u5728\u5927\u578b Transformer \u4e0e\u4f20\u7edf CNN \u4e0a\u96f6\u4ee3\u7801\u6539\u52a8\u90e8\u7f72\uff0c\u5bf9\u9690\u79c1\u4fdd\u62a4\u96f6\u552e\u641c\u7d22\u548c\u8de8\u533a\u57df\u63a8\u8350\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM decision components that can operate within agent workflows often produce action-relevant recommendations or judgements together with explanations. Operators may use the named factors to monitor a system, diagnose errors, or decide when to escalate an output. Such use assumes that the explanations agree with the component\u0027s observable decision behaviour. We test two interpretations of the named factors: necessity, meaning that changing a factor would change the output, and sufficiency, meaning that retaining it while removing other changeable information would preserve the output. We evaluate these interpretations in two synthetic use cases: recommending advisors to clients and judging prompts for harmfulness or risk. Models return an output and the top three factors that most influenced it. Controlled black-box interventions estimate a necessity score for each factor by measuring how often changing it changes the output, and a sufficiency score by measuring how often retaining it preserves the output. Across eight models from the Claude, GPT, and Gemini families, the mean Spearman correlations between the cited ranking and the necessity and sufficiency scores are 0.349 and 0.354 for advisor recommendation, and 0.431 and 0.580 for prompt monitoring. Furthermore, an uncited factor scores above the lowest-scoring cited factor in 57.6% of advisor responses under necessity and 58.1% under sufficiency; the corresponding prompt-monitoring rates are 25.8% and 8.9%. The cited top three contain useful information but do not reliably identify the three factors with the strongest measured influence under necessity or sufficiency. The framework provides a black-box reliability check for explanations used in agent oversight while remaining scoped to individual LLM decisions.", "arxiv_id": "2609.05385", "arxiv_url": "https://arxiv.org/abs/2609.05385", "authors": ["Urja Pawar", "Rajitha Ramanayake", "Nabeel Kemal", "Ashwin Kandath", "Owen O\u0027Neill", "Guillaume Bourgeon", "Houssem Chatbri"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9ed1\u76d2\u8bc4\u4f30\u6846\u67b6\uff0c\u68c0\u9a8cLLM\u7ed9\u51fa\u7684\u201c\u5f71\u54cd\u56e0\u7d20\u201d\u89e3\u91ca\u662f\u5426\u4e0e\u5176\u5b9e\u9645\u51b3\u7b56\u884c\u4e3a\u4e00\u81f4\u3002\u4f5c\u8005\u4ece\u5fc5\u8981\u6027\u548c\u5145\u5206\u6027\u4e24\u79cd\u89c6\u89d2\uff0c\u5728\u987e\u95ee\u63a8\u8350\u4e0e\u98ce\u9669\u63d0\u793a\u5224\u65ad\u4e24\u4e2a\u5408\u6210\u4efb\u52a1\u4e0a\u8bc4\u4f30Claude\u3001GPT\u3001Gemini\u7b498\u4e2a\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05385", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u89e3\u91ca\u56e0\u7d20\u5b9a\u4e49\u4e3a\u4e24\u7c7b\u53ef\u68c0\u9a8c\u5173\u7cfb\uff1a\u6539\u53d8\u8be5\u56e0\u7d20\u662f\u5426\u4f1a\u6539\u53d8\u8f93\u51fa\u7684\u201c\u5fc5\u8981\u6027\u201d\uff0c\u4ee5\u53ca\u4fdd\u7559\u8be5\u56e0\u7d20\u5e76\u79fb\u9664\u5176\u4ed6\u4fe1\u606f\u662f\u5426\u80fd\u4fdd\u6301\u8f93\u51fa\u7684\u201c\u5145\u5206\u6027\u201d\u3002", "\u901a\u8fc7\u53d7\u63a7\u9ed1\u76d2\u5e72\u9884\u4f30\u8ba1\u6bcf\u4e2a\u56e0\u7d20\u7684\u5fc5\u8981\u6027\u4e0e\u5145\u5206\u6027\u5206\u6570\uff0c\u5e76\u4e0e\u6a21\u578b\u81ea\u79f0\u7684\u524d\u4e09\u5f71\u54cd\u56e0\u7d20\u6392\u5e8f\u505a\u76f8\u5173\u6027\u6bd4\u8f83\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u6a21\u578b\u5f15\u7528\u7684\u56e0\u7d20\u6709\u4e00\u5b9a\u4fe1\u606f\u91cf\uff0c\u4f46\u4e0e\u5b9e\u9645\u5f71\u54cd\u529b\u76f8\u5173\u6027\u6709\u9650\uff1b\u672a\u88ab\u5f15\u7528\u7684\u56e0\u7d20\u5e38\u5e38\u6bd4\u5df2\u5f15\u7528\u56e0\u7d20\u66f4\u6709\u5f71\u54cd\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u667a\u80fd\u4f53", "\u6a21\u578b\u8bc4\u4f30", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05385v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Necessary or Sufficient? Evaluating LLM Explanations With Behavioural Evidence", "tldr": "\u7528\u884c\u4e3a\u5e72\u9884\u68c0\u9a8cLLM\u89e3\u91ca\u662f\u5426\u53ef\u4fe1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9ed1\u76d2\u8bc4\u4f30\u6846\u67b6\uff0c\u68c0\u9a8cLLM\u7ed9\u51fa\u7684\u201c\u5f71\u54cd\u56e0\u7d20\u201d\u89e3\u91ca\u662f\u5426\u4e0e\u5176\u5b9e\u9645\u51b3\u7b56\u884c\u4e3a\u4e00\u81f4\u3002\u4f5c\u8005\u4ece\u5fc5\u8981\u6027\u548c\u5145\u5206\u6027\u4e24\u79cd\u89c6\u89d2\uff0c\u5728\u987e\u95ee\u63a8\u8350\u4e0e\u98ce\u9669\u63d0\u793a\u5224\u65ad\u4e24\u4e2a\u5408\u6210\u4efb\u52a1\u4e0a\u8bc4\u4f30Claude\u3001GPT\u3001Gemini\u7b498\u4e2a\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aLLM\u89e3\u91ca\u5728\u667a\u80fd\u4f53\u76d1\u7763\u3001\u9519\u8bef\u8bca\u65ad\u548c\u4eba\u5de5\u5347\u7ea7\u51b3\u7b56\u4e2d\u7684\u53ef\u9760\u6027\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u7684\u884c\u4e3a\u8bc1\u636e\u68c0\u9a8c\u65b9\u6cd5\uff0c\u63d0\u9192\u7528\u6237\u4e0d\u80fd\u76f4\u63a5\u76f8\u4fe1\u6a21\u578b\u81ea\u62a5\u7684\u51b3\u7b56\u7406\u7531\u3002"}, {"abstract": "We propose Ref-GeNVS, a training-free, reflection-aware method for generative novel view synthesis (NVS) in mirror scenes. Existing multi-view diffusion models often fail to recognize the mirror in the scene and cannot exploit reflected content for scene generation. To fix this issue without additional training, our key idea is to treat a mirror image as two complementary views. From input images, we estimate the mirror plane and reflect camera poses to form virtual views. Based on this virtual view setup, we propose a two-stage generation method consisting of Mirror-gated attention and Reflection injection, which enables reflection-consistent NVS by explicitly leveraging reflection relationships in a multi-view diffusion model. Ref-GeNVS inherits the strong generalizability of the multi-view diffusion backbone, while it does not require finetuning. On synthetic and real scenes including mirrors, Ref-GeNVS outperforms recent generative NVS methods by generating reflection-consistent and contextually coherent novel views, revealing scene structure visible only through mirrors. Project page: https://kim-geonu.github.io/Ref-GeNVS/", "arxiv_id": "2609.05382", "arxiv_url": "https://arxiv.org/abs/2609.05382", "authors": ["GeonU Kim", "Shin Dong-Yeon", "Tae-Hyun Oh"], "brief": "\u8bba\u6587\u63d0\u51fa Ref-GeNVS\uff0c\u4e00\u79cd\u9762\u5411\u542b\u955c\u9762\u573a\u666f\u7684\u514d\u8bad\u7ec3\u751f\u6210\u5f0f\u65b0\u89c6\u89d2\u5408\u6210\u65b9\u6cd5\u3002\u5b83\u5c06\u955c\u4e2d\u56fe\u50cf\u89c6\u4e3a\u4e92\u8865\u865a\u62df\u89c6\u89d2\uff0c\u901a\u8fc7\u4f30\u8ba1\u955c\u9762\u5e73\u9762\u5e76\u53cd\u5c04\u76f8\u673a\u4f4d\u59ff\uff0c\u8ba9\u591a\u89c6\u89d2\u6269\u6563\u6a21\u578b\u663e\u5f0f\u5229\u7528\u53cd\u5c04\u4fe1\u606f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05382", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u955c\u9762\u5e73\u9762\u4f30\u8ba1\u4e0e\u76f8\u673a\u4f4d\u59ff\u53cd\u5c04\uff0c\u6784\u5efa\u955c\u4e2d\u5185\u5bb9\u5bf9\u5e94\u7684\u865a\u62df\u89c6\u89d2\uff0c\u5efa\u6a21\u771f\u5b9e\u89c6\u56fe\u4e0e\u53cd\u5c04\u89c6\u56fe\u5173\u7cfb", "\u63d0\u51fa\u4e24\u9636\u6bb5\u751f\u6210\u6d41\u7a0b\uff1aMirror-gated attention \u4e0e Reflection injection\uff0c\u4ee5\u63d0\u5347\u53cd\u5c04\u4e00\u81f4\u6027\u548c\u573a\u666f\u4e0a\u4e0b\u6587\u8fde\u8d2f\u6027", "\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u6216\u5fae\u8c03\uff0c\u7ee7\u627f\u591a\u89c6\u89d2\u6269\u6563\u6a21\u578b\u7684\u6cdb\u5316\u80fd\u529b\uff0c\u5e76\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u955c\u9762\u573a\u666f\u4e2d\u4f18\u4e8e\u8fd1\u671f\u751f\u6210\u5f0f NVS \u65b9\u6cd5"], "keywords": ["\u65b0\u89c6\u89d2\u5408\u6210", "\u6269\u6563\u6a21\u578b", "\u4e09\u7ef4\u89c6\u89c9", "\u955c\u9762\u53cd\u5c04"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05382v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Reflection-aware Generative Novel View Synthesis", "tldr": "\u65e0\u9700\u8bad\u7ec3\u5b9e\u73b0\u955c\u9762\u611f\u77e5\u7684\u65b0\u89c6\u89d2\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Ref-GeNVS\uff0c\u4e00\u79cd\u9762\u5411\u542b\u955c\u9762\u573a\u666f\u7684\u514d\u8bad\u7ec3\u751f\u6210\u5f0f\u65b0\u89c6\u89d2\u5408\u6210\u65b9\u6cd5\u3002\u5b83\u5c06\u955c\u4e2d\u56fe\u50cf\u89c6\u4e3a\u4e92\u8865\u865a\u62df\u89c6\u89d2\uff0c\u901a\u8fc7\u4f30\u8ba1\u955c\u9762\u5e73\u9762\u5e76\u53cd\u5c04\u76f8\u673a\u4f4d\u59ff\uff0c\u8ba9\u591a\u89c6\u89d2\u6269\u6563\u6a21\u578b\u663e\u5f0f\u5229\u7528\u53cd\u5c04\u4fe1\u606f\u3002", "why_notable": "\u955c\u9762\u53cd\u5c04\u957f\u671f\u662f\u65b0\u89c6\u89d2\u5408\u6210\u4e2d\u7684\u96be\u70b9\uff0c\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u8ba9\u73b0\u6709\u591a\u89c6\u89d2\u6269\u6563\u6a21\u578b\u7406\u89e3\u5e76\u5229\u7528\u955c\u4e2d\u53ef\u89c1\u7ed3\u6784\uff0c\u5bf9\u5ba4\u5185\u91cd\u5efa\u3001\u865a\u62df\u73b0\u5b9e\u548c\u590d\u6742\u6750\u8d28\u573a\u666f\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are increasingly evaluated on molecular property benchmarks, but accuracy cannot distinguish a model that predicts a property from one that retrieves a published number. We audit 22 frontier models on 12 regression benchmarks for verbatim retrieval and find that it is widespread but relatively benchmark-specific: on five datasets more than $50\\%$ of the LLMs show verbatim retrieval, while on the remaining datasets it appears only in isolated cells. We run our experiments at two reasoning levels and find that reasoning changes retrieval. The same experiments, on the same molecules and with the same prompt, are flagged $89\\%$ more often at the higher reasoning level than at the lowest one. Finally, we test a way to interrupt retrieval in our most contaminated cases, and find that the strongest models in some cases still recognise a combination of transformed SMILES strings and original labels. Furthermore, suppressing retrieval moves the prediction errors of the different models closer together in relative terms, while their differing use of verbatim retrieval spreads them apart. This indicates that the general predictive capability of an LLM is not determined solely by the amount of memorised values. This work provides an overview of the amount and depth of verbatim retrieval in molecular regression benchmarks using LLMs.", "arxiv_id": "2609.05381", "arxiv_url": "https://arxiv.org/abs/2609.05381", "authors": ["Matthias Busch", "Marius Tacke", "Sviatlana V. Lamaka", "Mikhail L. Zheludkevich", "Christian J. Cyron", "Roland C. Aydin", "Christian Feiler"], "brief": "\u8bba\u6587\u5ba1\u8ba1\u4e8622\u4e2a\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u572812\u4e2a\u5206\u5b50\u6027\u8d28\u56de\u5f52\u57fa\u51c6\u4e0a\u7684\u8868\u73b0\uff0c\u533a\u5206\u6a21\u578b\u662f\u5728\u771f\u5b9e\u9884\u6d4b\u6027\u8d28\u8fd8\u662f\u76f4\u63a5\u590d\u73b0\u5df2\u53d1\u8868\u6570\u503c\u3002\u7814\u7a76\u53d1\u73b0\u9010\u5b57\u6570\u503c\u68c0\u7d22\u5e7f\u6cdb\u5b58\u5728\u4f46\u9ad8\u5ea6\u4f9d\u8d56\u5177\u4f53\u6570\u636e\u96c6\uff0c\u4e14\u63a8\u7406\u5f3a\u5ea6\u4f1a\u663e\u8457\u6539\u53d8\u68c0\u7d22\u884c\u4e3a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05381", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u57285\u4e2a\u5206\u5b50\u56de\u5f52\u6570\u636e\u96c6\u4e0a\uff0c\u8d85\u8fc750%\u7684LLM\u8868\u73b0\u51fa\u5df2\u53d1\u8868\u6570\u503c\u7684\u9010\u5b57\u68c0\u7d22\u73b0\u8c61\uff0c\u5176\u4f59\u6570\u636e\u96c6\u5219\u591a\u4e3a\u96f6\u6563\u51fa\u73b0\u3002", "\u540c\u4e00\u5206\u5b50\u3001\u540c\u4e00\u63d0\u793a\u4e0b\uff0c\u9ad8\u63a8\u7406\u7b49\u7ea7\u6bd4\u6700\u4f4e\u63a8\u7406\u7b49\u7ea7\u591a\u89e6\u53d189%\u7684\u68c0\u7d22\u6807\u8bb0\uff0c\u8bf4\u660e\u201c\u63a8\u7406\u201d\u53ef\u80fd\u589e\u5f3a\u8bb0\u5fc6\u8c03\u7528\u3002", "\u5373\u4f7f\u5bf9SMILES\u5b57\u7b26\u4e32\u505a\u53d8\u6362\u5e76\u5c1d\u8bd5\u4e2d\u65ad\u68c0\u7d22\uff0c\u6700\u5f3a\u6a21\u578b\u5728\u6c61\u67d3\u4e25\u91cd\u573a\u666f\u4e2d\u4ecd\u80fd\u8bc6\u522b\u53d8\u6362\u8f93\u5165\u4e0e\u539f\u59cb\u6807\u7b7e\u7684\u7ec4\u5408\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5206\u5b50\u5efa\u6a21", "\u57fa\u51c6\u8bc4\u6d4b", "\u6570\u636e\u6c61\u67d3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05381v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Molecular D\u00e9j\u00e0 Vu: Digit-Level Retrieval of Published Values in Frontier Language Models", "tldr": "\u524d\u6cbfLLM\u4f1a\u9010\u5b57\u68c0\u7d22\u5206\u5b50\u6027\u8d28\u6570\u503c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5ba1\u8ba1\u4e8622\u4e2a\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u572812\u4e2a\u5206\u5b50\u6027\u8d28\u56de\u5f52\u57fa\u51c6\u4e0a\u7684\u8868\u73b0\uff0c\u533a\u5206\u6a21\u578b\u662f\u5728\u771f\u5b9e\u9884\u6d4b\u6027\u8d28\u8fd8\u662f\u76f4\u63a5\u590d\u73b0\u5df2\u53d1\u8868\u6570\u503c\u3002\u7814\u7a76\u53d1\u73b0\u9010\u5b57\u6570\u503c\u68c0\u7d22\u5e7f\u6cdb\u5b58\u5728\u4f46\u9ad8\u5ea6\u4f9d\u8d56\u5177\u4f53\u6570\u636e\u96c6\uff0c\u4e14\u63a8\u7406\u5f3a\u5ea6\u4f1a\u663e\u8457\u6539\u53d8\u68c0\u7d22\u884c\u4e3a\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u5206\u5b50\u6027\u8d28\u57fa\u51c6\u4e0a\u7684LLM\u9ad8\u5206\u53ef\u80fd\u90e8\u5206\u6765\u81ea\u8bad\u7ec3\u8bed\u6599\u8bb0\u5fc6\u800c\u975e\u771f\u5b9e\u9884\u6d4b\u80fd\u529b\uff0c\u5bf9AI\u7528\u4e8e\u5206\u5b50\u53d1\u73b0\u3001\u6750\u6599\u8bbe\u8ba1\u548c\u79d1\u5b66\u57fa\u51c6\u8bc4\u6d4b\u7684\u53ef\u4fe1\u5ea6\u63d0\u51fa\u91cd\u8981\u8b66\u793a\u3002"}, {"abstract": "Visuomotor imitation policies can achieve high performance under in-distribution visual conditions yet fail when visually similar objects or receptacles are introduced. We study this behavior as a problem of conditional visual grounding: the visual target required for successful control changes with the manipulation phase and, in more complex tasks, with the observed task state. Using Action Chunking with Transformers (ACT), we systematically introduce distractor objects and receptacles with controlled color and shape similarity and localize failures to picking and placement. We find that distractor sensitivity is specific to both the type of visual similarity and the manipulation stage. Guided by this diagnosis, we evaluate distractor augmentation, phase-dependent attention regularization, and appearance-based visual prompting as complementary interventions for improving target selection while preserving spatial information required for control. These interventions substantially improve robustness in simulation and on a physical UR3e. We further examine the same failure pattern in a pretrained vision-language-action policy on a state-conditioned instrument-handling task, where the observed state of a medical instrument determines the correct destination. Together, the results show that visual distractors can cause incorrect object or destination selection even when the underlying manipulation skill remains intact, and that explicitly improving target selection can substantially recover performance across distinct visuomotor policy-learning regimes.", "arxiv_id": "2609.05376", "arxiv_url": "https://arxiv.org/abs/2609.05376", "authors": ["Vivek Chavan", "Pengtao Xie", "Yahuan Shi", "Oliver Heimann", "Kevin Haninger", "J\u00f6rg Kr\u00fcger"], "brief": "\u8bba\u6587\u5c06\u89c6\u89c9\u8fd0\u52a8\u6a21\u4eff\u7b56\u7565\u5728\u76f8\u4f3c\u5e72\u6270\u7269\u4e0b\u7684\u5931\u8d25\u5f52\u56e0\u4e8e\u201c\u6761\u4ef6\u89c6\u89c9\u5b9a\u4f4d\u201d\u95ee\u9898\uff1a\u4e0d\u540c\u64cd\u4f5c\u9636\u6bb5\u6216\u4efb\u52a1\u72b6\u6001\u9700\u8981\u5173\u6ce8\u4e0d\u540c\u89c6\u89c9\u76ee\u6807\u3002\u4f5c\u8005\u57fa\u4e8e ACT \u7cfb\u7edf\u5206\u6790\u5e72\u6270\u7269\u5bf9\u6293\u53d6\u4e0e\u653e\u7f6e\u7684\u5f71\u54cd\uff0c\u5e76\u63d0\u51fa\u591a\u79cd\u5e72\u9884\u65b9\u6cd5\u63d0\u5347\u9c81\u68d2\u6027\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05376", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u63a7\u5236\u5e72\u6270\u7269\u4e0e\u76ee\u6807\u5728\u989c\u8272\u3001\u5f62\u72b6\u4e0a\u7684\u76f8\u4f3c\u6027\uff0c\u5b9a\u4f4d\u6a21\u4eff\u7b56\u7565\u5728\u6293\u53d6\u548c\u653e\u7f6e\u9636\u6bb5\u7684\u5931\u8d25\u6a21\u5f0f", "\u53d1\u73b0\u5e72\u6270\u654f\u611f\u6027\u540c\u65f6\u4f9d\u8d56\u89c6\u89c9\u76f8\u4f3c\u7c7b\u578b\u548c\u64cd\u4f5c\u9636\u6bb5\uff0c\u9519\u8bef\u591a\u6765\u81ea\u76ee\u6807\u6216\u76ee\u7684\u5730\u9009\u62e9\u800c\u975e\u5e95\u5c42\u64cd\u4f5c\u6280\u80fd\u4e27\u5931", "\u9a8c\u8bc1\u4e86\u5e72\u6270\u589e\u5f3a\u3001\u9636\u6bb5\u76f8\u5173\u6ce8\u610f\u529b\u6b63\u5219\u5316\u3001\u57fa\u4e8e\u5916\u89c2\u7684\u89c6\u89c9\u63d0\u793a\u7b49\u65b9\u6cd5\uff0c\u5728\u4eff\u771f\u548c UR3e \u5b9e\u673a\u4e0a\u663e\u8457\u63d0\u5347\u9c81\u68d2\u6027"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60", "\u89c6\u89c9\u5b9a\u4f4d", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05376v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "What Matters, When? Diagnosing and Improving Conditional Visual Grounding in Visuomotor Imitation Policies", "tldr": "\u8bca\u65ad\u5e76\u63d0\u5347\u89c6\u89c9\u6a21\u4eff\u7b56\u7565\u7684\u6297\u5e72\u6270\u76ee\u6807\u9009\u62e9\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u89c6\u89c9\u8fd0\u52a8\u6a21\u4eff\u7b56\u7565\u5728\u76f8\u4f3c\u5e72\u6270\u7269\u4e0b\u7684\u5931\u8d25\u5f52\u56e0\u4e8e\u201c\u6761\u4ef6\u89c6\u89c9\u5b9a\u4f4d\u201d\u95ee\u9898\uff1a\u4e0d\u540c\u64cd\u4f5c\u9636\u6bb5\u6216\u4efb\u52a1\u72b6\u6001\u9700\u8981\u5173\u6ce8\u4e0d\u540c\u89c6\u89c9\u76ee\u6807\u3002\u4f5c\u8005\u57fa\u4e8e ACT \u7cfb\u7edf\u5206\u6790\u5e72\u6270\u7269\u5bf9\u6293\u53d6\u4e0e\u653e\u7f6e\u7684\u5f71\u54cd\uff0c\u5e76\u63d0\u51fa\u591a\u79cd\u5e72\u9884\u65b9\u6cd5\u63d0\u5347\u9c81\u68d2\u6027\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u89c6\u89c9\u6a21\u4eff\u7b56\u7565\u5728\u5206\u5e03\u5916\u76f8\u4f3c\u7269\u4f53\u573a\u666f\u4e2d\u7684\u5173\u952e\u8106\u5f31\u70b9\uff0c\u5e76\u7ed9\u51fa\u53ef\u64cd\u4f5c\u7684\u8bca\u65ad\u4e0e\u6539\u8fdb\u624b\u6bb5\uff0c\u5bf9\u63d0\u5347\u673a\u5668\u4eba\u6a21\u4eff\u5b66\u4e60\u5728\u771f\u5b9e\u590d\u6742\u73af\u5883\u4e2d\u7684\u53ef\u9760\u6027\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Trade-up recommendation identifies higher-quality alternatives that preserve a customer\u0027s purchase intent while offering upgraded benefits. Large language models (LLMs) can reason about such distinctions, but applying them directly to hundreds of millions of product pairs is operationally impractical. We introduce a two-level framework that distills LLM reasoning into an efficient non-generative student and adapts its decision boundary to product-type-specific trade-up criteria. At Level 1, a retrieval-augmented few-shot LLM teacher generates structured relation labels and natural-language rationales. These rationales supervise a compact embedding-pair classifier through alignment and contrastive objectives; at inference, the student uses only two precomputed 768-dimensional product embeddings, with no LLM calls or text generation. On a fixed human-annotated benchmark of 8,352 pairs, a 15.5M-parameter four-class reasoning-distilled student achieves AUC 0.924 (95% CI [0.918, 0.929]), compared with 0.912 for the four-class label-only student. At Level 2, product-type test-time training (PT-TTT) uses few-shot demonstrations to optimize lightweight category-specific adapters over the frozen student. PT-TTT improves AUC from 0.924 to 0.941 and average precision from 0.920 to 0.940. On a 100K-pair proxy catalog, the distilled student on a single eight-GPU machine is approximately 5,000x faster and 10,000x lower in estimated cost than direct LLM inference.", "arxiv_id": "2609.05363", "arxiv_url": "https://arxiv.org/abs/2609.05363", "authors": ["Siliang Liu", "Mohammad Ghasemi", "Sapan Patel", "Amin Banitalebi-Dehkordi"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u4e24\u7ea7\u201c\u5347\u7ea7\u8d2d\u4e70\u201d\u63a8\u8350\u6846\u67b6\uff1a\u5148\u7528\u68c0\u7d22\u589e\u5f3a\u5c11\u6837\u672cLLM\u6559\u5e08\u751f\u6210\u7ed3\u6784\u5316\u5173\u7cfb\u6807\u7b7e\u4e0e\u81ea\u7136\u8bed\u8a00\u7406\u7531\uff0c\u518d\u5c06\u5176\u84b8\u998f\u5230\u8f7b\u91cf\u7ea7\u975e\u751f\u6210\u5f0f\u5546\u54c1\u5bf9\u5206\u7c7b\u5668\u4e2d\u3002\u968f\u540e\u901a\u8fc7\u4ea7\u54c1\u7c7b\u578b\u6d4b\u8bd5\u65f6\u8bad\u7ec3\uff0c\u4e3a\u4e0d\u540c\u54c1\u7c7b\u5b66\u4e60\u8f7b\u91cf\u9002\u914d\u5668\u4ee5\u8c03\u6574\u51b3\u7b56\u8fb9\u754c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05363", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5b66\u751f\u6a21\u578b\u63a8\u7406\u65f6\u4ec5\u4f7f\u7528\u4e24\u4e2a\u9884\u8ba1\u7b97\u7684768\u7ef4\u5546\u54c1\u5d4c\u5165\uff0c\u65e0\u9700LLM\u8c03\u7528\u6216\u6587\u672c\u751f\u6210\uff0c\u9002\u5408\u5927\u89c4\u6a21\u5546\u54c1\u5bf9\u7b5b\u9009\u3002", "\u57288,352\u4e2a\u4eba\u5de5\u6807\u6ce8\u5546\u54c1\u5bf9\u57fa\u51c6\u4e0a\uff0c15.5M\u53c2\u6570\u56db\u5206\u7c7b\u84b8\u998f\u5b66\u751f\u8fbe\u5230AUC 0.924\uff0c\u9ad8\u4e8e\u4ec5\u7528\u6807\u7b7e\u8bad\u7ec3\u76840.912\u3002", "\u4ea7\u54c1\u7c7b\u578b\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u5c06AUC\u4ece0.924\u63d0\u5347\u52300.941\uff0c\u5e73\u5747\u7cbe\u5ea6\u4ece0.920\u63d0\u5347\u52300.940\uff1b\u572810\u4e07\u5546\u54c1\u5bf9\u4ee3\u7406\u76ee\u5f55\u4e0a\u76f8\u8f83\u76f4\u63a5LLM\u63a8\u7406\u7ea6\u5feb5000\u500d\u3001\u6210\u672c\u4f4e10000\u500d\u3002"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05363v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Distill Globally, Adapt Locally: Reasoning Distillation and Product-Type Test-Time Training for Scalable Trade-Up Recommendation", "tldr": "\u7528LLM\u84b8\u998f\u4e0e\u6d4b\u8bd5\u65f6\u9002\u914d\u6269\u5c55\u5347\u7ea7\u63a8\u8350", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u4e24\u7ea7\u201c\u5347\u7ea7\u8d2d\u4e70\u201d\u63a8\u8350\u6846\u67b6\uff1a\u5148\u7528\u68c0\u7d22\u589e\u5f3a\u5c11\u6837\u672cLLM\u6559\u5e08\u751f\u6210\u7ed3\u6784\u5316\u5173\u7cfb\u6807\u7b7e\u4e0e\u81ea\u7136\u8bed\u8a00\u7406\u7531\uff0c\u518d\u5c06\u5176\u84b8\u998f\u5230\u8f7b\u91cf\u7ea7\u975e\u751f\u6210\u5f0f\u5546\u54c1\u5bf9\u5206\u7c7b\u5668\u4e2d\u3002\u968f\u540e\u901a\u8fc7\u4ea7\u54c1\u7c7b\u578b\u6d4b\u8bd5\u65f6\u8bad\u7ec3\uff0c\u4e3a\u4e0d\u540c\u54c1\u7c7b\u5b66\u4e60\u8f7b\u91cf\u9002\u914d\u5668\u4ee5\u8c03\u6574\u51b3\u7b56\u8fb9\u754c\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u5982\u4f55\u628aLLM\u7684\u7ec6\u7c92\u5ea6\u5546\u54c1\u6bd4\u8f83\u63a8\u7406\u8f6c\u5316\u4e3a\u4f4e\u6210\u672c\u3001\u53ef\u90e8\u7f72\u7684\u63a8\u8350\u6a21\u578b\uff0c\u5e76\u901a\u8fc7\u54c1\u7c7b\u7ea7\u6d4b\u8bd5\u65f6\u9002\u914d\u5904\u7406\u4e0d\u540c\u4ea7\u54c1\u7684\u5347\u7ea7\u6807\u51c6\u5dee\u5f02\uff0c\u5bf9\u5de5\u4e1a\u7ea7\u7535\u5546\u63a8\u8350\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generating categorical graphs requires choosing node and edge types that form a coherent structure without depending on node order. Many graph generators encode categories as fixed one-hot vectors, which can impose an artificial geometry in which categories are equidistant. We propose Embedded Graph Flows (EGF), a generative model that learns continuous embeddings for node and unordered-edge categories and transports Gaussian noise towards these learnt endpoints using a permutation-equivariant graph transformer. A terminal readout maps the embeddings back to discrete graph categories. Across molecular benchmarks, EGF achieved competitive performance. On QM9, EGF gives the best result on all four reported metrics among the three methods, including a Fr\u00e9chet ChemNet Distance (FCD) of 0.150, compared with 0.717 for the categorical-diffusion baseline DiGress and 0.812 for the bridge-based baseline GruM. When applied to larger molecules in ZINC250k, EGF retains the lowest maximum mean discrepancy (MMD) using the neighbourhood subgraph pairwise distance kernel (NSPDK), indicating close agreement with the local substructures of the reference molecules. Our code is available at https://github.com/Trusted-System-Lab/EGF.", "arxiv_id": "2609.05328", "arxiv_url": "https://arxiv.org/abs/2609.05328", "authors": ["Ethan Ma", "Zihan Wang", "Chris Siu Yeung Chow", "Xinguo Feng", "Qingqing Li", "Rui Jiang", "Naipeng Dong", "Guangdong Bai"], "brief": "\u8bba\u6587\u63d0\u51fa Embedded Graph Flows\uff08EGF\uff09\uff0c\u4e3a\u8282\u70b9\u548c\u65e0\u5e8f\u8fb9\u7c7b\u522b\u5b66\u4e60\u8fde\u7eed\u5d4c\u5165\uff0c\u5e76\u7528\u7f6e\u6362\u7b49\u53d8\u56fe Transformer \u5c06\u9ad8\u65af\u566a\u58f0\u4f20\u8f93\u5230\u8fd9\u4e9b\u5d4c\u5165\u7aef\u70b9\uff0c\u6700\u540e\u8bfb\u51fa\u4e3a\u79bb\u6563\u56fe\u7c7b\u522b\u3002\u8be5\u65b9\u6cd5\u7528\u4e8e\u5206\u7c7b\u56fe\u751f\u6210\uff0c\u91cd\u70b9\u9a8c\u8bc1\u5728\u5206\u5b50\u56fe\u751f\u6210\u4efb\u52a1\u4e0a\u7684\u6548\u679c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05328", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u907f\u514d\u4f20\u7edf one-hot \u7c7b\u522b\u8868\u793a\u5e26\u6765\u7684\u201c\u7c7b\u522b\u7b49\u8ddd\u201d\u4eba\u5de5\u51e0\u4f55\u5047\u8bbe\uff0c\u6539\u4e3a\u5b66\u4e60\u7c7b\u522b\u7684\u8fde\u7eed\u5d4c\u5165\u7a7a\u95f4\u3002", "\u91c7\u7528\u7f6e\u6362\u7b49\u53d8\u56fe Transformer \u5efa\u6a21\u8282\u70b9\u4e0e\u8fb9\uff0c\u4fdd\u8bc1\u751f\u6210\u8fc7\u7a0b\u4e0d\u4f9d\u8d56\u8282\u70b9\u987a\u5e8f\u3002", "\u5728 QM9 \u4e0a\u591a\u9879\u6307\u6807\u4f18\u4e8e DiGress \u548c GruM\uff0cFCD \u8fbe\u5230 0.150\uff1b\u5728 ZINC250k \u4e0a NSPDK MMD \u6700\u4f4e\uff0c\u8bf4\u660e\u5c40\u90e8\u5b50\u7ed3\u6784\u5339\u914d\u66f4\u597d\u3002"], "keywords": ["\u56fe\u751f\u6210", "\u6d41\u6a21\u578b", "\u5206\u5b50\u751f\u6210", "\u56fe\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05328v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Embedded Graph Flows for Categorical Graph Generation", "tldr": "\u7528\u8fde\u7eed\u5d4c\u5165\u6d41\u751f\u6210\u66f4\u4f18\u5206\u7c7b\u56fe", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Embedded Graph Flows\uff08EGF\uff09\uff0c\u4e3a\u8282\u70b9\u548c\u65e0\u5e8f\u8fb9\u7c7b\u522b\u5b66\u4e60\u8fde\u7eed\u5d4c\u5165\uff0c\u5e76\u7528\u7f6e\u6362\u7b49\u53d8\u56fe Transformer \u5c06\u9ad8\u65af\u566a\u58f0\u4f20\u8f93\u5230\u8fd9\u4e9b\u5d4c\u5165\u7aef\u70b9\uff0c\u6700\u540e\u8bfb\u51fa\u4e3a\u79bb\u6563\u56fe\u7c7b\u522b\u3002\u8be5\u65b9\u6cd5\u7528\u4e8e\u5206\u7c7b\u56fe\u751f\u6210\uff0c\u91cd\u70b9\u9a8c\u8bc1\u5728\u5206\u5b50\u56fe\u751f\u6210\u4efb\u52a1\u4e0a\u7684\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u79bb\u6563\u7c7b\u522b\u56fe\u751f\u6210\u63d0\u4f9b\u4e86\u4ecb\u4e8e\u8fde\u7eed\u6d41\u6a21\u578b\u4e0e\u79bb\u6563\u8bfb\u51fa\u4e4b\u95f4\u7684\u65b0\u5efa\u6a21\u65b9\u5f0f\uff0c\u5728\u5206\u5b50\u751f\u6210\u57fa\u51c6\u4e0a\u8868\u73b0\u5f3a\u52b2\uff0c\u53ef\u80fd\u63d0\u5347\u56fe\u751f\u6210\u6a21\u578b\u5bf9\u7c7b\u522b\u5173\u7cfb\u548c\u5c40\u90e8\u7ed3\u6784\u7684\u523b\u753b\u80fd\u529b\u3002"}, {"abstract": "When there is not enough labeled data to properly train deep learning models, transfer learning can help. We still do not fully understand how effective it is in neuroimaging, especially for Alzheimer\u0027s disease research. It is also not clear if these transferred models can work on new datasets without being retrained for each specific task. We evaluate whether a compact, supervised pretrained model can serve as a reusable foundation model for downstream neuroimaging tasks. We freeze the 7.18 million weights of a 3D CNN previously trained for brain-age prediction, and adapt it to each task using Low-Rank Adaptation (LoRA), requiring only ~1% additional trainable parameters. We evaluate generalizability in six experiments. Adapting the model to classify cognitively normal versus Dementia on ADNI gave an AUC of 0.964 on held-out folds (Experiment #1). Applying that adapted model unchanged to OASIS-3, with no retraining, gave an AUC of 0.871 (Experiment #2). Reusing its output logit together with age and a cognitive score distinguished stable from progressing MCI with an AUC of 0.828 (Experiment #3). Adapting the same backbone to predict amyloid positivity from structural MRI gave an AUC of 0.804 (Experiment #4). Finally, the same approach estimated ICV-normalized hippocampal and white matter hypointensity volumes directly from the T1w image, with R^2 of 0.80 and 0.91 respectively, tasks normally addressed with much larger U-Net networks (Experiments #5 and #6). A compact model supervised on brain age can therefore serve as a reusable backbone, adapting to each task with ~1% additional parameters and transferring to an unseen cohort without any training. Our findings suggest that a carefully trained brain age model can serve as an effective foundation model for Alzheimer\u0027s related tasks, even under strict data constraints.", "arxiv_id": "2609.05400", "arxiv_url": "https://arxiv.org/abs/2609.05400", "authors": ["Reza Rajabli", "D. Louis Collins"], "brief": "\u672c\u6587\u8bc4\u4f30\u4e00\u4e2a\u5df2\u7528\u4e8e\u8111\u9f84\u9884\u6d4b\u7684\u7d27\u51d1\u76d1\u7763\u9884\u8bad\u7ec33D CNN\uff0c\u662f\u5426\u53ef\u4f5c\u4e3a\u963f\u5c14\u8328\u6d77\u9ed8\u76f8\u5173\u8111MRI\u4efb\u52a1\u7684\u53ef\u590d\u7528\u7279\u5f81\u63d0\u53d6\u5668\u3002\u4f5c\u8005\u51bb\u7ed37.18M\u4e3b\u5e72\u53c2\u6570\uff0c\u4ec5\u7528LoRA\u589e\u52a0\u7ea61%\u53ef\u8bad\u7ec3\u53c2\u6570\uff0c\u5b8c\u6210\u8bca\u65ad\u5206\u7c7b\u3001\u8fdb\u5c55\u9884\u6d4b\u3001\u6dc0\u7c89\u6837\u86cb\u767d\u9884\u6d4b\u548c\u4f53\u79ef\u4f30\u8ba1\u7b49\u4efb\u52a1\u3002", "categories": ["cs.CV", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05400", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728ADNI\u4e0a\u533a\u5206\u8ba4\u77e5\u6b63\u5e38\u4e0e\u75f4\u5446\u8fbe\u5230AUC 0.964\uff0c\u5e76\u53ef\u4e0d\u7ecf\u91cd\u8bad\u7ec3\u8fc1\u79fb\u5230OASIS-3\uff0cAUC 0.871", "\u7ed3\u5408\u6a21\u578b\u8f93\u51fa\u3001\u5e74\u9f84\u548c\u8ba4\u77e5\u8bc4\u5206\u9884\u6d4bMCI\u7a33\u5b9a/\u8fdb\u5c55\uff0cAUC\u8fbe\u52300.828", "\u540c\u4e00\u4e3b\u5e72\u53ef\u9884\u6d4b\u6dc0\u7c89\u6837\u86cb\u767d\u9633\u6027\uff08AUC 0.804\uff09\uff0c\u5e76\u4f30\u8ba1\u6d77\u9a6c\u4f53\u79ef\u548c\u767d\u8d28\u4f4e\u4fe1\u53f7\u4f53\u79ef\uff08R\u00b2\u5206\u522b\u4e3a0.80\u548c0.91\uff09"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u8fc1\u79fb\u5b66\u4e60", "\u963f\u5c14\u8328\u6d77\u9ed8", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05400v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Generalizable Feature Extractor for Alzheimer\u0027s-Related Brain MRI Tasks", "tldr": "\u8111\u9f843D CNN\u53ef\u8fc1\u79fb\u81f3\u963f\u5c14\u8328\u6d77\u9ed8\u4efb\u52a1", "upvotes": 0, "what_it_is": "\u672c\u6587\u8bc4\u4f30\u4e00\u4e2a\u5df2\u7528\u4e8e\u8111\u9f84\u9884\u6d4b\u7684\u7d27\u51d1\u76d1\u7763\u9884\u8bad\u7ec33D CNN\uff0c\u662f\u5426\u53ef\u4f5c\u4e3a\u963f\u5c14\u8328\u6d77\u9ed8\u76f8\u5173\u8111MRI\u4efb\u52a1\u7684\u53ef\u590d\u7528\u7279\u5f81\u63d0\u53d6\u5668\u3002\u4f5c\u8005\u51bb\u7ed37.18M\u4e3b\u5e72\u53c2\u6570\uff0c\u4ec5\u7528LoRA\u589e\u52a0\u7ea61%\u53ef\u8bad\u7ec3\u53c2\u6570\uff0c\u5b8c\u6210\u8bca\u65ad\u5206\u7c7b\u3001\u8fdb\u5c55\u9884\u6d4b\u3001\u6dc0\u7c89\u6837\u86cb\u767d\u9884\u6d4b\u548c\u4f53\u79ef\u4f30\u8ba1\u7b49\u4efb\u52a1\u3002", "why_notable": "\u7814\u7a76\u8868\u660e\uff0c\u5c0f\u89c4\u6a21\u76d1\u7763\u9884\u8bad\u7ec3\u7684\u8111\u9f84\u6a21\u578b\u4e5f\u80fd\u5728\u795e\u7ecf\u5f71\u50cf\u5c0f\u6837\u672c\u573a\u666f\u4e2d\u5145\u5f53\u5b9e\u7528\u57fa\u7840\u6a21\u578b\uff0c\u663e\u8457\u964d\u4f4e\u4e0b\u6e38\u8bad\u7ec3\u53c2\u6570\u9700\u6c42\uff0c\u5e76\u5177\u5907\u8de8\u961f\u5217\u96f6\u91cd\u8bad\u7ec3\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "More than a decade in, explainable AI (XAI) for computer vision has assembled a mature toolbox: attribution, feature visualization, concept-based, and circuit-based methods. Yet almost all of the field\u0027s effort has gone into building and comparing these methods, and little into the question they were meant to answer---how interpretable are our models, and are we making progress as they evolve? We argue for shifting the field\u0027s focus from methods to models, along two complementary lines. One is already within reach: existing tools let us characterize and compare what different models represent and compute. The other is harder, and largely neglected: whether a model can actually be understood by the humans who rely on it---the independent evaluators on whom trust and certification depend, not the experts confirming what they already expect. It can only be measured, not inferred. We review why the toolbox is mature enough to support both, survey the thin body of work comparing models, draw a parallel to systems neuroscience, and close with a model-centric XAI agenda.", "arxiv_id": "2609.05399", "arxiv_url": "https://arxiv.org/abs/2609.05399", "authors": ["Julien Colin", "Nuria Oliver", "Thomas Serre"], "brief": "\u672c\u6587\u662f\u4e00\u7bc7\u89c2\u70b9/\u7efc\u8ff0\u6027\u8bba\u6587\uff0c\u8ba4\u4e3a\u8ba1\u7b97\u673a\u89c6\u89c9XAI\u5df2\u6709\u6210\u719f\u5de5\u5177\u7bb1\uff0c\u4f46\u7814\u7a76\u91cd\u5fc3\u8fc7\u5ea6\u96c6\u4e2d\u5728\u65b9\u6cd5\u672c\u8eab\u3002\u4f5c\u8005\u4e3b\u5f20\u8f6c\u5411\u201c\u6a21\u578b\u4e2d\u5fc3\u201d\u7684\u53ef\u89e3\u91ca\u6027\uff1a\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u8868\u5f81\u4e0e\u8ba1\u7b97\uff0c\u5e76\u76f4\u63a5\u6d4b\u91cf\u4eba\u7c7b\u80fd\u5426\u771f\u6b63\u7406\u89e3\u6a21\u578b\u3002", "categories": ["cs.CV", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05399", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u68b3\u7406\u5f52\u56e0\u3001\u7279\u5f81\u53ef\u89c6\u5316\u3001\u6982\u5ff5\u65b9\u6cd5\u3001\u56de\u8def\u5206\u6790\u7b49\u89c6\u89c9XAI\u5de5\u5177\uff0c\u6307\u51fa\u5176\u5df2\u8db3\u4ee5\u652f\u6301\u6a21\u578b\u7ea7\u6bd4\u8f83", "\u5f3a\u8c03\u53ef\u89e3\u91ca\u6027\u4e0d\u80fd\u53ea\u7531\u4e13\u5bb6\u4e8b\u540e\u9a8c\u8bc1\u63a8\u65ad\uff0c\u800c\u5e94\u7531\u72ec\u7acb\u4f7f\u7528\u8005\u7684\u7406\u89e3\u80fd\u529b\u6765\u5b9e\u6d4b", "\u501f\u9274\u7cfb\u7edf\u795e\u7ecf\u79d1\u5b66\u7684\u7814\u7a76\u8303\u5f0f\uff0c\u63d0\u51fa\u4ee5\u6a21\u578b\u8868\u5f81\u3001\u8ba1\u7b97\u673a\u5236\u548c\u4eba\u7c7b\u53ef\u7406\u89e3\u6027\u4e3a\u6838\u5fc3\u7684XAI\u8bae\u7a0b"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u6a21\u578b\u8bc4\u4f30", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05399v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Interpretability Methods to Interpretable Models", "tldr": "\u547c\u5401XAI\u4ece\u89e3\u91ca\u65b9\u6cd5\u8f6c\u5411\u53ef\u89e3\u91ca\u6a21\u578b\u8bc4\u4f30", "upvotes": 0, "what_it_is": "\u672c\u6587\u662f\u4e00\u7bc7\u89c2\u70b9/\u7efc\u8ff0\u6027\u8bba\u6587\uff0c\u8ba4\u4e3a\u8ba1\u7b97\u673a\u89c6\u89c9XAI\u5df2\u6709\u6210\u719f\u5de5\u5177\u7bb1\uff0c\u4f46\u7814\u7a76\u91cd\u5fc3\u8fc7\u5ea6\u96c6\u4e2d\u5728\u65b9\u6cd5\u672c\u8eab\u3002\u4f5c\u8005\u4e3b\u5f20\u8f6c\u5411\u201c\u6a21\u578b\u4e2d\u5fc3\u201d\u7684\u53ef\u89e3\u91ca\u6027\uff1a\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u8868\u5f81\u4e0e\u8ba1\u7b97\uff0c\u5e76\u76f4\u63a5\u6d4b\u91cf\u4eba\u7c7b\u80fd\u5426\u771f\u6b63\u7406\u89e3\u6a21\u578b\u3002", "why_notable": "\u8bba\u6587\u5c06XAI\u7684\u5173\u6ce8\u70b9\u4ece\u201c\u89e3\u91ca\u5de5\u5177\u662f\u5426\u597d\u7528\u201d\u63a8\u8fdb\u5230\u201c\u6a21\u578b\u672c\u8eab\u662f\u5426\u66f4\u53ef\u7406\u89e3\u201d\uff0c\u5bf9\u6a21\u578b\u8bc4\u4f30\u3001\u4fe1\u4efb\u8ba4\u8bc1\u548c\u5b89\u5168\u90e8\u7f72\u5177\u6709\u65b9\u6cd5\u8bba\u610f\u4e49\u3002"}, {"abstract": "Reliable 3D understanding of the surrounding environment is a core requirement for autonomous driving. Multi-view surround camera rigs provide broad scene coverage, but the spatially adjacent images typically overlap only minimally. Consequently, the depth of most pixels must be inferred from monocular appearance cues. These cues can appear differently across images and may therefore be interpreted differently by the depth estimation model. We target two main sources of cross-image inconsistency: differences in camera intrinsics and the limited receptive field of each image. We address the former by conditioning the features on per-pixel camera-aware ray embeddings, enabling the network to account for camera-dependent variations in monocular cues. We address the latter by extending each pixel\u0027s context beyond its own image through cross-image attention constrained to geometrically plausible regions, derived from the calibrated rig setup. The model is trained in a fully self-supervised manner based on photometric consistency. Evaluations on DDAD and nuScenes show improved overall depth accuracy and cross-image depth consistency over state-of-the-art self-supervised methods under in-domain and cross-domain evaluation. Code is available at https://abualhanud.github.io/CrossDepthPage/.", "arxiv_id": "2609.05397", "arxiv_url": "https://arxiv.org/abs/2609.05397", "authors": ["Samer Abualhanud", "Max Mehltretter"], "brief": "CrossDepth \u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u591a\u6444\u50cf\u5934\u73af\u89c6\u573a\u666f\uff0c\u63d0\u51fa\u4e00\u79cd\u53ef\u6cdb\u5316\u7684\u81ea\u76d1\u7763\u591a\u89c6\u89d2\u6df1\u5ea6\u4f30\u8ba1\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u76f8\u673a\u611f\u77e5\u5c04\u7ebf\u5d4c\u5165\u4e0e\u51e0\u4f55\u7ea6\u675f\u8de8\u56fe\u50cf\u6ce8\u610f\u529b\uff0c\u7f13\u89e3\u4e0d\u540c\u76f8\u673a\u89c6\u89d2\u95f4\u5355\u76ee\u7ebf\u7d22\u89e3\u91ca\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05397", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u9010\u50cf\u7d20 camera-aware ray embeddings \u5bf9\u7279\u5f81\u8fdb\u884c\u6761\u4ef6\u5316\uff0c\u663e\u5f0f\u5efa\u6a21\u4e0d\u540c\u76f8\u673a\u5185\u53c2\u5e26\u6765\u7684\u5916\u89c2\u4e0e\u51e0\u4f55\u5dee\u5f02", "\u5f15\u5165\u8de8\u56fe\u50cf\u6ce8\u610f\u529b\uff0c\u4f46\u4ec5\u5728\u7531\u6807\u5b9a\u76f8\u673a\u9635\u5217\u63a8\u5bfc\u51fa\u7684\u51e0\u4f55\u53ef\u884c\u533a\u57df\u5185\u4ea4\u4e92\uff0c\u4ee5\u6269\u5c55\u5355\u5f20\u56fe\u50cf\u4e4b\u5916\u7684\u4e0a\u4e0b\u6587", "\u91c7\u7528\u57fa\u4e8e\u5149\u5ea6\u4e00\u81f4\u6027\u7684\u5b8c\u5168\u81ea\u76d1\u7763\u8bad\u7ec3\uff0c\u5728 DDAD \u548c nuScenes \u4e0a\u63d0\u5347\u6df1\u5ea6\u7cbe\u5ea6\u4e0e\u8de8\u56fe\u50cf\u4e00\u81f4\u6027\uff0c\u5e76\u5177\u5907\u8de8\u57df\u6cdb\u5316\u4f18\u52bf"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u6df1\u5ea6\u4f30\u8ba1", "\u591a\u89c6\u89d2", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05397v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CrossDepth: Geometry-Constrained Attention for Generalizable Multi-View Surround Depth Estimation", "tldr": "\u51e0\u4f55\u7ea6\u675f\u8de8\u89c6\u89d2\u6ce8\u610f\u529b\u63d0\u5347\u73af\u89c6\u6df1\u5ea6\u4f30\u8ba1", "upvotes": 0, "what_it_is": "CrossDepth \u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u591a\u6444\u50cf\u5934\u73af\u89c6\u573a\u666f\uff0c\u63d0\u51fa\u4e00\u79cd\u53ef\u6cdb\u5316\u7684\u81ea\u76d1\u7763\u591a\u89c6\u89d2\u6df1\u5ea6\u4f30\u8ba1\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u76f8\u673a\u611f\u77e5\u5c04\u7ebf\u5d4c\u5165\u4e0e\u51e0\u4f55\u7ea6\u675f\u8de8\u56fe\u50cf\u6ce8\u610f\u529b\uff0c\u7f13\u89e3\u4e0d\u540c\u76f8\u673a\u89c6\u89d2\u95f4\u5355\u76ee\u7ebf\u7d22\u89e3\u91ca\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u73af\u89c6\u591a\u6444\u50cf\u5934\u4e2d\u89c6\u91ce\u91cd\u53e0\u5c11\u3001\u4e3b\u8981\u4f9d\u8d56\u5355\u76ee\u7ebf\u7d22\u7684\u5173\u952e\u96be\u9898\uff0c\u5229\u7528\u76f8\u673a\u51e0\u4f55\u5148\u9a8c\u7ea6\u675f\u6ce8\u610f\u529b\u4ea4\u4e92\uff0c\u5728\u4e0d\u4f9d\u8d56\u6df1\u5ea6\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u4e86\u81ea\u52a8\u9a7e\u9a76\u573a\u666f\u7684\u6df1\u5ea6\u4f30\u8ba1\u53ef\u9760\u6027\u4e0e\u4e00\u81f4\u6027\u3002"}, {"abstract": "Visual reasoning tasks require a system to jointly perceive visual content and apply formal relational constraints---a combination that neither pure neural nor purely symbolic approaches handle well in isolation. This paper proposes a Neuro-Symbolic (NeSy) framework that closes this gap by tightly coupling a Vision-Language Model (VLM) for automatic First-Order Logic (FOL) rule induction with a Dynamic Logic Tensor Network (D-LTN) for differentiable rule verification, in a closed iterative feedback loop. The VLM receives a small set of labelled visual examples and proposes candidate FOL rules conforming to a strict grammar (Think); the D-LTN is automatically assembled from these rules at runtime and evaluates them grounding on CNN-produced visual embeddings (Verify); and verification failures are fed back to guide the VLM\u0027s next hypothesis (Revise). Evaluated on the ViSudo-PC benchmark across four visual domains (MNIST, EMNIST, KMNIST, FMNIST), the system induces valid Sudoku constraint rules using only three training examples as visual context. The proposed method achieves AUC scores matching or outperforming previous methods (NeuPSL, LTN), showing the potential for automatic rule discovery through VLM. Code is available at https://github.com/homayoun-afshari/nesy.", "arxiv_id": "2609.05388", "arxiv_url": "https://arxiv.org/abs/2609.05388", "authors": ["Homayoun Afshari", "Pietro Basci", "Alessandro Russo", "Lia Morra"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u795e\u7ecf\u7b26\u53f7\u89c6\u89c9\u63a8\u7406\u6846\u67b6\uff0c\u5c06Vision-Language Model\u7528\u4e8e\u4ece\u5c11\u91cf\u6807\u6ce8\u89c6\u89c9\u6837\u4f8b\u4e2d\u751f\u6210\u4e00\u9636\u903b\u8f91\u89c4\u5219\uff0c\u5e76\u7528\u52a8\u6001Logic Tensor Network\u8fdb\u884c\u53ef\u5fae\u9a8c\u8bc1\u3002\u7cfb\u7edf\u901a\u8fc7Think-Verify-Revise\u95ed\u73af\uff0c\u628a\u9a8c\u8bc1\u5931\u8d25\u53cd\u9988\u7ed9VLM\u8fed\u4ee3\u4fee\u6b63\u89c4\u5219\u5047\u8bbe\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05388", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["VLM\u5728\u4e25\u683c\u8bed\u6cd5\u7ea6\u675f\u4e0b\u81ea\u52a8\u5f52\u7eb3\u4e00\u9636\u903b\u8f91\u5019\u9009\u89c4\u5219\uff0c\u65e0\u9700\u4eba\u5de5\u624b\u5199\u89c4\u5219\u3002", "D-LTN\u5728\u8fd0\u884c\u65f6\u6839\u636e\u5019\u9009\u89c4\u5219\u52a8\u6001\u7ec4\u88c5\uff0c\u5e76\u57fa\u4e8eCNN\u89c6\u89c9\u5d4c\u5165\u5bf9\u89c4\u5219\u8fdb\u884c\u53ef\u5fae\u9a8c\u8bc1\u3002", "\u5728ViSudo-PC\u56db\u4e2a\u89c6\u89c9\u57df\u4e0a\uff0c\u4ec5\u75283\u4e2a\u8bad\u7ec3\u6837\u4f8b\u4f5c\u4e3a\u89c6\u89c9\u4e0a\u4e0b\u6587\u5373\u53ef\u5f52\u7eb3\u6709\u6548\u6570\u72ec\u7ea6\u675f\uff0cAUC\u8fbe\u5230\u6216\u8d85\u8fc7NeuPSL\u3001LTN\u7b49\u65b9\u6cd5\u3002"], "keywords": ["\u795e\u7ecf\u7b26\u53f7", "\u89c6\u89c9\u63a8\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u903b\u8f91\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05388v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Think-Verify-Revise: Neuro-Symbolic Visual Reasoning with Vision-Language Models and Dynamic Logic Tensor Networks", "tldr": "VLM\u81ea\u52a8\u5f52\u7eb3\u89c4\u5219\u5e76\u7528D-LTN\u9a8c\u8bc1\u4fee\u6b63", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u795e\u7ecf\u7b26\u53f7\u89c6\u89c9\u63a8\u7406\u6846\u67b6\uff0c\u5c06Vision-Language Model\u7528\u4e8e\u4ece\u5c11\u91cf\u6807\u6ce8\u89c6\u89c9\u6837\u4f8b\u4e2d\u751f\u6210\u4e00\u9636\u903b\u8f91\u89c4\u5219\uff0c\u5e76\u7528\u52a8\u6001Logic Tensor Network\u8fdb\u884c\u53ef\u5fae\u9a8c\u8bc1\u3002\u7cfb\u7edf\u901a\u8fc7Think-Verify-Revise\u95ed\u73af\uff0c\u628a\u9a8c\u8bc1\u5931\u8d25\u53cd\u9988\u7ed9VLM\u8fed\u4ee3\u4fee\u6b63\u89c4\u5219\u5047\u8bbe\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86VLM\u53ef\u7528\u4e8e\u81ea\u52a8\u7b26\u53f7\u89c4\u5219\u53d1\u73b0\uff0c\u5e76\u4e0e\u53ef\u5fae\u903b\u8f91\u7f51\u7edc\u5f62\u6210\u95ed\u73af\u9a8c\u8bc1\u4e0e\u4fee\u6b63\uff0c\u7f13\u89e3\u7eaf\u795e\u7ecf\u65b9\u6cd5\u7f3a\u5c11\u7ea6\u675f\u63a8\u7406\u3001\u7eaf\u7b26\u53f7\u65b9\u6cd5\u4f9d\u8d56\u4eba\u5de5\u89c4\u5219\u7684\u95ee\u9898\uff0c\u5bf9\u5c0f\u6837\u672c\u89c6\u89c9\u63a8\u7406\u548c\u795e\u7ecf\u7b26\u53f7\u7cfb\u7edf\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent advances in Earth Observation representation learning accommodate heterogeneous sensors and missing observations, often through larger architectures. We present MEOX (Multimodal Earth Observation with eXperts), a multimodal masked autoencoder with a 2.939 million-parameter encoder and 3.115 million parameters in total. Sensor-specific adapters, explicit validity signals, and a shared sparse-expert block preserve modality-dependent processing before a learned patch-wise fusion. Four metadata tokens then accompany a single spatial sequence through fourteen further encoder blocks. Shared expert projections with private low-rank residuals constrain parameter growth, while rotary attention supports downstream spatial grids different from pretraining. The model is pretrained on 1.228 million MMEarth64 samples using modality-balanced masked reconstruction and structured sensor dropout. Frozen transfer is evaluated on six GEO-Bench tasks at both 64 and 224 pixels. The model reaches 64.42% mean intersection-over-union on cashew segmentation at 64 pixels and 90.56% average accuracy on EuroSAT at 224 pixels, exceeding the corresponding reported CSMoE results. BigEarthNet finetuning reaches 72.95% micro-average precision. Routing diagnostics distinguish expert participation, spatial dependence, modality association, and functional contribution. A held-out WorldCover probe measures a 0.64-percentage-point benefit from metadata, while retrieval separates same-sensor semantics from cross-sensor alignment. These results demonstrate sensor-flexible representation learning and strong task transfer using a compact parameter budget.", "arxiv_id": "2609.05351", "arxiv_url": "https://arxiv.org/abs/2609.05351", "authors": ["Mohanad Albughdadi"], "brief": "\u8bba\u6587\u63d0\u51fa MEOX\uff0c\u4e00\u4e2a\u4ec5\u7ea6311.5\u4e07\u53c2\u6570\u7684\u591a\u6a21\u6001\u5730\u7403\u89c2\u6d4b masked autoencoder\u3002\u5b83\u901a\u8fc7\u4f20\u611f\u5668\u4e13\u5c5e\u9002\u914d\u5668\u3001\u7a00\u758f\u4e13\u5bb6\u6a21\u5757\u3001\u6709\u6548\u6027\u4fe1\u53f7\u4e0e\u5143\u6570\u636e token\uff0c\u5728\u5f02\u6784\u4f20\u611f\u5668\u548c\u7f3a\u5931\u89c2\u6d4b\u573a\u666f\u4e0b\u5b66\u4e60\u53ef\u8fc1\u79fb\u8868\u5f81\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05351", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u5171\u4eab\u7a00\u758f\u4e13\u5bb6\u6295\u5f71\u7ed3\u5408\u79c1\u6709\u4f4e\u79e9\u6b8b\u5dee\uff0c\u5728\u63a7\u5236\u53c2\u6570\u91cf\u7684\u540c\u65f6\u4fdd\u7559\u6a21\u6001\u76f8\u5173\u5904\u7406\u80fd\u529b\u3002", "\u5728122.8\u4e07 MMEarth64 \u6837\u672c\u4e0a\u9884\u8bad\u7ec3\uff0c\u4f7f\u7528\u6a21\u6001\u5747\u8861 masked \u91cd\u5efa\u548c\u7ed3\u6784\u5316\u4f20\u611f\u5668 dropout\u3002", "\u5728\u516d\u4e2a GEO-Bench \u4efb\u52a1\u4e0a\u8bc4\u4f30\uff0cEuroSAT 224\u50cf\u7d20\u51c6\u786e\u7387\u8fbe90.56%\uff0c\u8170\u679c\u5206\u527264\u50cf\u7d20 mIoU \u8fbe64.42%\uff0c\u8d85\u8fc7\u76f8\u5e94 CSMoE \u62a5\u544a\u7ed3\u679c\u3002"], "keywords": ["\u5730\u7403\u89c2\u6d4b", "\u591a\u6a21\u6001", "\u6df7\u5408\u4e13\u5bb6", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05351v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MEOX: Compact Multimodal Mixture-of-Experts for Earth Observation", "tldr": "\u5c0f\u6a21\u578b\u5b9e\u73b0\u5f3a\u5730\u7403\u89c2\u6d4b\u591a\u6a21\u6001\u8fc1\u79fb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MEOX\uff0c\u4e00\u4e2a\u4ec5\u7ea6311.5\u4e07\u53c2\u6570\u7684\u591a\u6a21\u6001\u5730\u7403\u89c2\u6d4b masked autoencoder\u3002\u5b83\u901a\u8fc7\u4f20\u611f\u5668\u4e13\u5c5e\u9002\u914d\u5668\u3001\u7a00\u758f\u4e13\u5bb6\u6a21\u5757\u3001\u6709\u6548\u6027\u4fe1\u53f7\u4e0e\u5143\u6570\u636e token\uff0c\u5728\u5f02\u6784\u4f20\u611f\u5668\u548c\u7f3a\u5931\u89c2\u6d4b\u573a\u666f\u4e0b\u5b66\u4e60\u53ef\u8fc1\u79fb\u8868\u5f81\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5730\u7403\u89c2\u6d4b\u591a\u6a21\u6001\u8868\u5f81\u4e0d\u4e00\u5b9a\u4f9d\u8d56\u5927\u6a21\u578b\uff0c\u7d27\u51d1\u67b6\u6784\u4e5f\u80fd\u5904\u7406\u591a\u4f20\u611f\u5668\u3001\u7f3a\u5931\u6a21\u6001\u548c\u4e0d\u540c\u7a7a\u95f4\u5206\u8fa8\u7387\uff0c\u5e76\u5728\u4e0b\u6e38\u4efb\u52a1\u4e0a\u53d6\u5f97\u5f3a\u8fc1\u79fb\u8868\u73b0\uff0c\u5177\u6709\u90e8\u7f72\u548c\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Hyperspectral and multispectral image fusion (HMIF) aims to reconstruct a high-resolution hyperspectral image (HR-HSI) by combining the fine spatial details of a high-resolution multispectral image (HR-MSI) with the rich spectral information of a low-resolution hyperspectral image (LR-HSI). Recent advances in implicit neural representations (INRs) have enabled flexible coordinate-based modeling for HMIF; however, existing INR-based approaches may not fully capture fine-grained spatial structures and rich spectral dependencies. Moreover, the LR-HSI and HR-MSI are primarily incorporated through degradation-consistency constraints, leaving their complementary information underexploited. To address these limitations, we propose Two-Stage Reconstruction with Implicit Tensor Neural Representation (TSR-ITNR), a unified self-supervised framework integrating representation refinement and observation-guided calibration. In Stage 1, TSR-ITNR learns an implicit Tucker representation and refines its low-rank spatial coefficient tensor and spectral basis to better capture fine spatial structures and interband correlations. A fixed pretrained denoiser further provides a deep prior for the preliminary reconstruction. In Stage 2, parameter-free calibration derives complementary and noninterfering corrections from both observations to recover information insufficiently captured in Stage 1. Theoretical analysis establishes the geometry-preserving property of spectral refinement and the orthogonal complementarity of calibration. Extensive experiments on multiple benchmark datasets demonstrate strong quantitative, visual, and spectral reconstruction performance without ground-truth HR-HSI supervision. Beyond conventional reconstruction metrics, we further assess the effectiveness of TSR-ITNR using downstream semantic segmentation accuracy.", "arxiv_id": "2609.05303", "arxiv_url": "https://arxiv.org/abs/2609.05303", "authors": ["Liqian Yang", "Xingchi Chen", "Xinfeng Gui", "Xiangyong Cao", "Qianxin Yi"], "brief": "\u8bba\u6587\u63d0\u51fa TSR-ITNR\uff0c\u4e00\u4e2a\u7528\u4e8e\u9ad8\u5149\u8c31-\u591a\u5149\u8c31\u56fe\u50cf\u878d\u5408\u7684\u4e24\u9636\u6bb5\u81ea\u76d1\u7763\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u9690\u5f0f Tucker \u5f20\u91cf\u8868\u793a\u8fdb\u884c\u7a7a\u95f4-\u5149\u8c31\u7ec6\u5316\uff0c\u5e76\u5229\u7528\u89c2\u6d4b\u5f15\u5bfc\u6821\u51c6\u8fdb\u4e00\u6b65\u878d\u5408 LR-HSI \u4e0e HR-MSI \u7684\u4e92\u8865\u4fe1\u606f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05303", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7b2c\u4e00\u9636\u6bb5\u5b66\u4e60\u9690\u5f0f Tucker \u8868\u793a\uff0c\u7ec6\u5316\u4f4e\u79e9\u7a7a\u95f4\u7cfb\u6570\u5f20\u91cf\u4e0e\u5149\u8c31\u57fa\uff0c\u4ee5\u6355\u6349\u7ec6\u7c92\u5ea6\u7a7a\u95f4\u7ed3\u6784\u548c\u8c31\u95f4\u76f8\u5173\u6027", "\u5f15\u5165\u56fa\u5b9a\u9884\u8bad\u7ec3\u53bb\u566a\u5668\u4f5c\u4e3a\u6df1\u5ea6\u5148\u9a8c\uff0c\u5728\u65e0 HR-HSI \u771f\u503c\u76d1\u7763\u4e0b\u63d0\u5347\u521d\u6b65\u91cd\u5efa\u8d28\u91cf", "\u7b2c\u4e8c\u9636\u6bb5\u91c7\u7528\u65e0\u53c2\u6570\u6821\u51c6\uff0c\u4ece LR-HSI \u548c HR-MSI \u4e2d\u63d0\u53d6\u4e92\u8865\u4e14\u975e\u5e72\u6270\u7684\u4fee\u6b63\u4fe1\u606f\uff0c\u5e76\u901a\u8fc7\u7406\u8bba\u5206\u6790\u8bc1\u660e\u5149\u8c31\u7ec6\u5316\u7684\u51e0\u4f55\u4fdd\u6301\u6027\u4e0e\u6821\u51c6\u7684\u6b63\u4ea4\u4e92\u8865\u6027"], "keywords": ["\u9ad8\u5149\u8c31\u6210\u50cf", "\u8d85\u5206\u8fa8\u7387", "\u9690\u5f0f\u795e\u7ecf\u8868\u793a", "\u56fe\u50cf\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05303v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Learning Spatial-Spectral Refinement and Calibrating Complementary Observations for Hyperspectral Image Super-Resolution", "tldr": "\u81ea\u76d1\u7763\u9ad8\u5149\u8c31\u8d85\u5206\u8fa8\u7387\u878d\u5408\u65b0\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TSR-ITNR\uff0c\u4e00\u4e2a\u7528\u4e8e\u9ad8\u5149\u8c31-\u591a\u5149\u8c31\u56fe\u50cf\u878d\u5408\u7684\u4e24\u9636\u6bb5\u81ea\u76d1\u7763\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u9690\u5f0f Tucker \u5f20\u91cf\u8868\u793a\u8fdb\u884c\u7a7a\u95f4-\u5149\u8c31\u7ec6\u5316\uff0c\u5e76\u5229\u7528\u89c2\u6d4b\u5f15\u5bfc\u6821\u51c6\u8fdb\u4e00\u6b65\u878d\u5408 LR-HSI \u4e0e HR-MSI \u7684\u4e92\u8865\u4fe1\u606f\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u73b0\u6709\u9690\u5f0f\u795e\u7ecf\u8868\u793a\u5728\u9ad8\u5149\u8c31\u8d85\u5206\u8fa8\u7387\u4e2d\u7a7a\u95f4\u7ec6\u8282\u3001\u5149\u8c31\u4f9d\u8d56\u548c\u4e92\u8865\u89c2\u6d4b\u5229\u7528\u4e0d\u8db3\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u7edf\u4e00\u7684\u81ea\u76d1\u7763\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u8f83\u5f3a\u7684\u91cd\u5efa\u4e0e\u4e0b\u6e38\u8bed\u4e49\u5206\u5272\u8868\u73b0\uff0c\u5177\u6709\u5b9e\u9645\u9065\u611f\u6210\u50cf\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Explicit primitive-based radiance fields such as 3D Gaussian Splatting typically model view-dependent appearance using low-order spherical harmonics (SH). Although efficient to evaluate, SH coefficients dominate per-primitive storage and memory traffic, while their band-limited basis restricts angular detail. We present a thorough, end-to-end comparison of SH and recent spherical appearance models and introduce an implicit alternative that decodes compact per-primitive latent codes using a tiny shared MLP. We integrate all models into the same optimized pipeline, fusing their forward and backward passes into a differentiable CUDA rasterizer and provide a portable WebGL viewer for laptop and mobile GPUs. Our evaluation across reconstruction quality, memory use, and optimization and rendering performance shows that recent spherical models offer the strongest overall quality-efficiency trade-off. Our neural representation is the most compact model evaluated and, compared to third-degree SH, reduces the per-primitive appearance footprint from 192 to 28 bytes, accelerates optimization by 1.3$\\times$, while improving reconstruction quality. We further analyze how appearance parametrization shapes optimization, identifying differences in recovered geometry and the tendency of expressive models to absorb non-static scene content. Together, our framework and analysis provide practical guidance for replacing SH beyond what image metrics alone can capture.", "arxiv_id": "2609.05255", "arxiv_url": "https://arxiv.org/abs/2609.05255", "authors": ["Florian Hahlbohm", "Jorge Condor", "Linus Franke", "Martin Eisemann", "Marcus Magnor"], "brief": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e863D Gaussian Splatting\u4e2d\u7403\u8c10\u51fd\u6570\u4e0e\u8fd1\u671f\u7403\u9762\u5916\u89c2\u6a21\u578b\uff0c\u5e76\u63d0\u51fa\u7528\u5171\u4eab\u5c0f\u578bMLP\u89e3\u7801\u6bcf\u4e2a\u9ad8\u65af\u7684\u7d27\u51d1\u6f5c\u7801\u6765\u8868\u793a\u89c6\u89d2\u76f8\u5173\u5916\u89c2\u3002\u4f5c\u8005\u5c06\u591a\u79cd\u5916\u89c2\u6a21\u578b\u96c6\u6210\u5230\u540c\u4e00CUDA\u53ef\u5fae\u5149\u6805\u5316\u6d41\u6c34\u7ebf\uff0c\u5e76\u63d0\u4f9bWebGL\u67e5\u770b\u5668\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05255", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u795e\u7ecf\u5916\u89c2\u8868\u793a\u5c06\u6bcf\u4e2aprimitive\u7684\u5916\u89c2\u5b58\u50a8\u4ece\u4e09\u9636SH\u7684192\u5b57\u8282\u964d\u81f328\u5b57\u8282", "\u76f8\u6bd4\u4e09\u9636SH\uff0c\u4f18\u5316\u901f\u5ea6\u63d0\u5347\u7ea61.3\u500d\uff0c\u540c\u65f6\u91cd\u5efa\u8d28\u91cf\u66f4\u597d", "\u5206\u6790\u53d1\u73b0\u5916\u89c2\u53c2\u6570\u5316\u4f1a\u5f71\u54cd\u51e0\u4f55\u6062\u590d\uff0c\u8868\u8fbe\u529b\u66f4\u5f3a\u7684\u6a21\u578b\u53ef\u80fd\u5438\u6536\u975e\u9759\u6001\u573a\u666f\u5185\u5bb9"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u9ad8\u65af\u6cfc\u6e85", "\u795e\u7ecf\u6e32\u67d3", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05255v1", "published_at": "2026-09-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Compact Neural Appearance Models for Efficient Gaussian Splatting", "tldr": "\u7528\u7d27\u51d1\u795e\u7ecf\u5916\u89c2\u66ff\u4ee3SH\u63d0\u5347\u9ad8\u65af\u6cfc\u6e85\u6548\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e863D Gaussian Splatting\u4e2d\u7403\u8c10\u51fd\u6570\u4e0e\u8fd1\u671f\u7403\u9762\u5916\u89c2\u6a21\u578b\uff0c\u5e76\u63d0\u51fa\u7528\u5171\u4eab\u5c0f\u578bMLP\u89e3\u7801\u6bcf\u4e2a\u9ad8\u65af\u7684\u7d27\u51d1\u6f5c\u7801\u6765\u8868\u793a\u89c6\u89d2\u76f8\u5173\u5916\u89c2\u3002\u4f5c\u8005\u5c06\u591a\u79cd\u5916\u89c2\u6a21\u578b\u96c6\u6210\u5230\u540c\u4e00CUDA\u53ef\u5fae\u5149\u6805\u5316\u6d41\u6c34\u7ebf\uff0c\u5e76\u63d0\u4f9bWebGL\u67e5\u770b\u5668\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u4ec5\u63d0\u51fa\u4e86\u66f4\u7d27\u51d1\u7684\u9ad8\u65af\u6cfc\u6e85\u5916\u89c2\u8868\u793a\uff0c\u8fd8\u5728\u7edf\u4e00\u9ad8\u6027\u80fd\u5b9e\u73b0\u4e2d\u7ed9\u51fa\u8d28\u91cf\u3001\u663e\u5b58\u3001\u8bad\u7ec3\u548c\u6e32\u67d3\u6548\u7387\u7684\u7aef\u5230\u7aef\u5bf9\u6bd4\uff0c\u4e3a\u5b9e\u9645\u66ff\u6362SH\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u4f9d\u636e\u3002"}, {"abstract": "Large Language Models (LLMs) often help users generate artifacts through iterative cycles of generation and revision in conversation. A challenge here is that, when users specify only a local change during revision, LLMs must instead identify the relevant dependencies and propagate the revision to all affected parts of the artifact. This paper studies this ability of LLMs on conversationally generated artifacts, where the artifact context and its dependencies may be embedded in the conversation history. Toward practical use, we also explore cost-effective test-time compute for this new setting. Specifically, we introduce a new benchmark for this setting, and evaluate nine revision methods, including sequential reflection and parallel sampling variants, using gpt-oss-20b/120b, gpt-5.4-mini, and qwen3.5-9b/27b/122b on the benchmark. The results show that baselines achieve accuracies of 68.3--93%, and the most cost-effective method is selecting from three parallel samples using either LLM-based or medoid selection, which improves accuracy by 2.2--9.7%. Our code and dataset are available at https://github.com/ntt-dkiku/llm-revision-propagation.", "arxiv_id": "2609.03254", "arxiv_url": "https://arxiv.org/abs/2609.03254", "authors": ["Daisuke Kikuta"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u65b0\u57fa\u51c6\uff0c\u8bc4\u4f30\u5f53\u7528\u6237\u53ea\u63d0\u51fa\u5c40\u90e8\u4fee\u6539\u65f6\uff0cLLM\u80fd\u5426\u4ece\u4f1a\u8bdd\u5386\u53f2\u4e2d\u8bc6\u522b\u4f9d\u8d56\u5173\u7cfb\u5e76\u540c\u6b65\u4fee\u6b63\u6240\u6709\u53d7\u5f71\u54cd\u5185\u5bb9\u3002\u4f5c\u8005\u6bd4\u8f83\u4e869\u79cd\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7b56\u7565\uff0c\u5305\u62ec\u987a\u5e8f\u53cd\u601d\u4e0e\u5e76\u884c\u91c7\u6837\u9009\u62e9\u65b9\u6cd5\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/ntt-dkiku/llm-revision-propagation", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03254", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u9762\u5411\u4f1a\u8bdd\u5f0f\u751f\u6210\u5de5\u4ef6\u7684\u4fee\u8ba2\u4f20\u64ad\u4efb\u52a1\uff0c\u5173\u6ce8\u4f9d\u8d56\u4fe1\u606f\u53ef\u80fd\u9690\u85cf\u5728\u5bf9\u8bdd\u5386\u53f2\u4e2d\u7684\u73b0\u5b9e\u573a\u666f", "\u8bc4\u6d4bgpt-oss\u3001gpt-5.4-mini\u3001qwen3.5\u7b49\u591a\u4e2a\u89c4\u6a21\u6a21\u578b\uff0c\u57fa\u7ebf\u51c6\u786e\u7387\u4e3a68.3%\u81f393%", "\u4ece3\u4e2a\u5e76\u884c\u6837\u672c\u4e2d\u7528LLM\u6216medoid\u65b9\u6cd5\u9009\u62e9\u7ed3\u679c\u6700\u5177\u6210\u672c\u6548\u76ca\uff0c\u53ef\u63d0\u5347\u51c6\u786e\u73872.2%\u81f39.7%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u5bf9\u8bdd\u751f\u6210", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03254v1", "published_at": "2026-09-03", "score": 0.173, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03254.png", "title": "What Else Needs Fixing? Exploring Cost-Effective Test-Time Compute for Revision Propagation in Artifacts Generated Through Conversation", "tldr": "\u7814\u7a76LLM\u5bf9\u4f1a\u8bdd\u751f\u6210\u5185\u5bb9\u7684\u4fee\u8ba2\u4f20\u64ad\u80fd\u529b", "upvotes": 1, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u65b0\u57fa\u51c6\uff0c\u8bc4\u4f30\u5f53\u7528\u6237\u53ea\u63d0\u51fa\u5c40\u90e8\u4fee\u6539\u65f6\uff0cLLM\u80fd\u5426\u4ece\u4f1a\u8bdd\u5386\u53f2\u4e2d\u8bc6\u522b\u4f9d\u8d56\u5173\u7cfb\u5e76\u540c\u6b65\u4fee\u6b63\u6240\u6709\u53d7\u5f71\u54cd\u5185\u5bb9\u3002\u4f5c\u8005\u6bd4\u8f83\u4e869\u79cd\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7b56\u7565\uff0c\u5305\u62ec\u987a\u5e8f\u53cd\u601d\u4e0e\u5e76\u884c\u91c7\u6837\u9009\u62e9\u65b9\u6cd5\u3002", "why_notable": "\u8bba\u6587\u628a\u5e38\u89c1\u7684\u201c\u5c40\u90e8\u4fee\u6539\u5bfc\u81f4\u5168\u5c40\u4e00\u81f4\u6027\u66f4\u65b0\u201d\u95ee\u9898\u7cfb\u7edf\u5316\u4e3a\u53ef\u8bc4\u6d4b\u4efb\u52a1\uff0c\u5e76\u63a2\u7d22\u4f4e\u6210\u672c\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7b56\u7565\uff0c\u5bf9\u63d0\u5347LLM\u8f85\u52a9\u5199\u4f5c\u3001\u4ee3\u7801\u3001\u6587\u6863\u7b49\u8fed\u4ee3\u751f\u6210\u573a\u666f\u7684\u53ef\u9760\u6027\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Wireless signals with position-related labels are pivotal for both performance evaluation and model training in the realm of wireless sensing. However, acquiring real-world datasets is often challenged by significant measurement and labeling costs. Traditional methods for synthesizing labeled wireless signals typically rely on environmental models, leading to extensive hyper-parameter tuning and inadequate realism for comprehensive model training purposes. To address these limitations, we introduce a novel deep learning (DL)-based method, namely Inter-Instance Generative Adversarial Networks (IIns-GAN), to generate realistic labeled wireless signals. The generated signals are particularly adaptive to different environment scenarios and well-suited for various model training tasks, including distance estimation and environment identification. We have conducted extensive experiments on public Ultra-Wideband (UWB) datasets to evaluate the realism and utility of the generated signals. The results demonstrate that the signals generated by IIns-GAN mirror the physical characteristics of real-world measurements, and significantly contribute to the improvement of model training in diverse wireless sensing tasks.", "arxiv_id": "2609.05396", "arxiv_url": "https://arxiv.org/abs/2609.05396", "authors": ["Yuxiao Li", "Keke Hu", "Santiago Mazuelas", "Yuan Shen"], "brief": "\u8bba\u6587\u63d0\u51fa Inter-Instance GAN\uff08IIns-GAN\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u6df1\u5ea6\u751f\u6210\u6a21\u578b\u7684\u5e26\u6807\u7b7e\u65e0\u7ebf\u4fe1\u53f7\u5408\u6210\u65b9\u6cd5\u3002\u5b83\u53ef\u751f\u6210\u9002\u5e94\u4e0d\u540c\u73af\u5883\u573a\u666f\u7684 UWB \u65e0\u7ebf\u4fe1\u53f7\uff0c\u7528\u4e8e\u8ddd\u79bb\u4f30\u8ba1\u3001\u73af\u5883\u8bc6\u522b\u7b49\u65e0\u7ebf\u611f\u77e5\u6a21\u578b\u8bad\u7ec3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05396", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u771f\u5b9e\u65e0\u7ebf\u4fe1\u53f7\u91c7\u96c6\u4e0e\u4f4d\u7f6e\u6807\u6ce8\u6210\u672c\u9ad8\u7684\u95ee\u9898\uff0c\u7528\u751f\u6210\u5f0f\u6a21\u578b\u66ff\u4ee3\u4f9d\u8d56\u73af\u5883\u5efa\u6a21\u7684\u4f20\u7edf\u5408\u6210\u65b9\u6cd5", "IIns-GAN \u5f3a\u8c03\u8de8\u5b9e\u4f8b\u5173\u7cfb\u5efa\u6a21\uff0c\u4f7f\u751f\u6210\u4fe1\u53f7\u66f4\u8d34\u8fd1\u771f\u5b9e\u6d4b\u91cf\u7684\u7269\u7406\u7279\u5f81", "\u5728\u516c\u5f00 UWB \u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\uff0c\u751f\u6210\u6570\u636e\u53ef\u63d0\u5347\u8ddd\u79bb\u4f30\u8ba1\u548c\u73af\u5883\u8bc6\u522b\u7b49\u4efb\u52a1\u7684\u8bad\u7ec3\u6548\u679c"], "keywords": ["\u751f\u6210\u6a21\u578b", "\u65e0\u7ebf\u611f\u77e5", "\u6570\u636e\u5408\u6210", "GAN"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05396v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "A Deep Generative Model for Synthesizing Labeled Wireless Signals", "tldr": "\u7528GAN\u751f\u6210\u5e26\u4f4d\u7f6e\u6807\u7b7e\u7684\u771f\u5b9e\u65e0\u7ebf\u4fe1\u53f7", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Inter-Instance GAN\uff08IIns-GAN\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u6df1\u5ea6\u751f\u6210\u6a21\u578b\u7684\u5e26\u6807\u7b7e\u65e0\u7ebf\u4fe1\u53f7\u5408\u6210\u65b9\u6cd5\u3002\u5b83\u53ef\u751f\u6210\u9002\u5e94\u4e0d\u540c\u73af\u5883\u573a\u666f\u7684 UWB \u65e0\u7ebf\u4fe1\u53f7\uff0c\u7528\u4e8e\u8ddd\u79bb\u4f30\u8ba1\u3001\u73af\u5883\u8bc6\u522b\u7b49\u65e0\u7ebf\u611f\u77e5\u6a21\u578b\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u6df1\u5ea6\u751f\u6210\u6a21\u578b\u7528\u4e8e\u5e26\u6807\u7b7e\u65e0\u7ebf\u4fe1\u53f7\u5408\u6210\uff0c\u964d\u4f4e\u65e0\u7ebf\u611f\u77e5\u6570\u636e\u83b7\u53d6\u6210\u672c\uff0c\u5e76\u63d0\u5347\u5408\u6210\u6570\u636e\u5728\u4e0b\u6e38\u8bad\u7ec3\u4e2d\u7684\u5b9e\u7528\u6027\uff0c\u5bf9\u4f4e\u6210\u672c\u6784\u5efa\u65e0\u7ebf\u611f\u77e5\u6570\u636e\u96c6\u6709\u6f5c\u5728\u4ef7\u503c\u3002"}, {"abstract": "Chilli (Capsicum annuum) is one of India\u0027s most economically significant crops, yet its productivity is persistently threatened by diseases that are difficult to identify without expert intervention. While Vision Transformers (ViTs) have achieved high classification accuracy, their large computational footprint makes deployment on resource constrained devices challenging. Existing compression approaches typically address pruning, quantization, and knowledge distillation in isolation, leaving the potential benefits and interactions of their combined application insufficiently explored. We propose a unified Vision Transformer compression framework that combines Hessian-Balanced Adaptive Block Pruning (H-BAC), guided by second-order sensitivity estimation, with quantization and attention-based knowledge distillation. To systematically identify the most effective configuration within each compression family, each technique is first evaluated independently through controlled ablation studies, after which the best-performing components are integrated into a sequential deployment pipeline tailored to real-world agricultural constraints. On a chilli 3-class village-split dataset with a genuine cross-village, cross-device out-of-distribution test split, the resulting compressed models match or exceed the 95.13% FP32 baseline\u0027s accuracy, alongside 74-98% model size reduction, and the fully integrated compression pipeline achieves a 54.5x size reduction (327.42 MB to 6.01 MB) at 95.13 +/- 2.32% accuracy across four tested configurations. A direct comparison further reveals that, on this dataset, a directly-trained student of the same final size, without pruning or distillation, reaches comparable accuracy of 94.87%, at the same 6.01 MB INT8 size, indicating where H-BAC and knowledge distillation are, and are not yet shown to be, worth their computational cost.", "arxiv_id": "2609.05334", "arxiv_url": "https://arxiv.org/abs/2609.05334", "authors": ["Mahadev Sunil Kumar", "Bhavika Gondi", "Desaisetty Venkata Satya Sai Swapnith", "Gangireddy Rahul Jogi", "Sudheesh Manalil", "Arnab Raha", "Amitava Mukherjee", "Parthasarathy Seethapathy", "G. Gopakumar"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8d44\u6e90\u53d7\u9650\u519c\u4e1a\u8bbe\u5907\u7684ViT\u538b\u7f29\u6846\u67b6\uff0c\u5c06\u4e8c\u9636\u654f\u611f\u5ea6\u5f15\u5bfc\u7684H-BAC\u5757\u526a\u679d\u3001\u91cf\u5316\u4e0e\u6ce8\u610f\u529b\u77e5\u8bc6\u84b8\u998f\u4e32\u8054\uff0c\u7528\u4e8e\u8fa3\u6912\u4e09\u5206\u7c7b\u75c5\u5bb3\u8bc6\u522b\u3002\u4f5c\u8005\u8fd8\u901a\u8fc7\u72ec\u7acb\u6d88\u878d\u548c\u8de8\u6751\u5e84\u3001\u8de8\u8bbe\u5907OOD\u6d4b\u8bd5\u8bc4\u4f30\u5404\u538b\u7f29\u7ec4\u4ef6\u7684\u771f\u5b9e\u6536\u76ca\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05334", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728\u6751\u5e84\u5212\u5206\u7684\u8fa3\u69123\u5206\u7c7b\u6570\u636e\u96c6\u4e0a\uff0c\u538b\u7f29\u6a21\u578b\u53ef\u5339\u914d\u6216\u8d85\u8fc795.13%\u7684FP32\u57fa\u7ebf\u7cbe\u5ea6\u3002", "\u5b8c\u6574\u6d41\u6c34\u7ebf\u5c06\u6a21\u578b\u4ece327.42 MB\u538b\u7f29\u52306.01 MB\uff0c\u5b9e\u73b054.5\u500d\u5c3a\u5bf8\u7f29\u51cf\uff0c\u7cbe\u5ea6\u4e3a95.13\u00b12.32%\u3002", "\u540c\u5c3a\u5bf8\u76f4\u63a5\u8bad\u7ec3\u7684INT8\u5b66\u751f\u6a21\u578b\u8fbe\u523094.87%\u7cbe\u5ea6\uff0c\u63d0\u793a\u526a\u679d\u548c\u84b8\u998f\u5728\u8be5\u4efb\u52a1\u4e0a\u7684\u989d\u5916\u6536\u76ca\u6709\u9650\u3002"], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u89c6\u89c9Transformer", "\u7aef\u4fa7AI", "\u519c\u4e1a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05334v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Lightweight Vision Transformer Compression for On-Device Plant Disease Detection in Resource-Constrained Agricultural Field Conditions", "tldr": "\u538b\u7f29ViT\u7528\u4e8e\u7530\u95f4\u7aef\u4fa7\u8fa3\u6912\u75c5\u5bb3\u68c0\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u8d44\u6e90\u53d7\u9650\u519c\u4e1a\u8bbe\u5907\u7684ViT\u538b\u7f29\u6846\u67b6\uff0c\u5c06\u4e8c\u9636\u654f\u611f\u5ea6\u5f15\u5bfc\u7684H-BAC\u5757\u526a\u679d\u3001\u91cf\u5316\u4e0e\u6ce8\u610f\u529b\u77e5\u8bc6\u84b8\u998f\u4e32\u8054\uff0c\u7528\u4e8e\u8fa3\u6912\u4e09\u5206\u7c7b\u75c5\u5bb3\u8bc6\u522b\u3002\u4f5c\u8005\u8fd8\u901a\u8fc7\u72ec\u7acb\u6d88\u878d\u548c\u8de8\u6751\u5e84\u3001\u8de8\u8bbe\u5907OOD\u6d4b\u8bd5\u8bc4\u4f30\u5404\u538b\u7f29\u7ec4\u4ef6\u7684\u771f\u5b9e\u6536\u76ca\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5173\u6ce8\u771f\u5b9e\u519c\u4e1a\u573a\u666f\u4e0b\u7684\u7aef\u4fa7\u90e8\u7f72\uff0c\u800c\u975e\u4ec5\u5728\u6807\u51c6\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u538b\u7f29\u7387\uff1b\u540c\u65f6\u8bda\u5b9e\u6bd4\u8f83\u4e86\u590d\u6742\u538b\u7f29\u6d41\u6c34\u7ebf\u4e0e\u76f4\u63a5\u8bad\u7ec3\u5c0f\u6a21\u578b\u7684\u6027\u4ef7\u6bd4\uff0c\u5bf9\u4f4e\u8d44\u6e90\u89c6\u89c9\u6a21\u578b\u843d\u5730\u5177\u6709\u5b9e\u7528\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Quantum circuits are central to implementing quantum algorithms on quantum devices, where quantum gates must be reversible. Many quantum algorithms rely on Boolean functions, which must therefore be implemented reversibly within quantum circuits. Reversible circuit synthesis provides a way to translate such Boolean functions into reversible circuits. Binary decision diagrams (BDDs) offer a scalable approach to this task, but the resulting BDDs and circuits depend heavily on variable ordering. Existing ordering heuristics commonly minimize BDD size because it is closely tied to the circuit size. However, BDD size is an imperfect proxy for the quantum cost of the synthesized circuit (QCC). We propose \\texttt{QuantumEvo}, an evolutionary framework that uses an LLM as a heuristic generator for QCC-aware BDD variable ordering. Instead of predicting orderings directly, \\texttt{QuantumEvo} searches over ordering heuristics initialized from multiple heuristic families. Candidate heuristics directly manipulate variable orderings using standard BDD operations and are selected by downstream QCC. The discovered heuristic, HGA-QE, modifies the sifting step inside a genetic algorithm so that the procedure is better aligned with QCC. Across the benchmark set, HGA-QE achieves a 70.9\\% tie-or-win rate against the per-function best baseline and is strictly best on 13.5\\% of the functions. The results demonstrate broadly competitive QCC performance, with HGA-QE showing a clearer relative advantage in strict wins on the two benchmark suites drawn from sources different from the data used for heuristic discovery.", "arxiv_id": "2609.05327", "arxiv_url": "https://arxiv.org/abs/2609.05327", "authors": ["Yoonju Sim", "Federico Berto", "Chuanbo Hua", "Jinkyoo Park", "Changhyun Kwon"], "brief": "\u8bba\u6587\u63d0\u51fa QuantumEvo\uff0c\u7528 LLM \u751f\u6210\u5e76\u8fdb\u5316\u7528\u4e8e BDD \u53d8\u91cf\u6392\u5e8f\u7684\u542f\u53d1\u5f0f\uff0c\u4ee5\u4f18\u5316\u53ef\u9006\u91cf\u5b50\u7535\u8def\u7efc\u5408\u4e2d\u7684\u91cf\u5b50\u6210\u672c\u3002\u5176\u53d1\u73b0\u7684 HGA-QE \u542f\u53d1\u5f0f\u6539\u9020\u4e86\u9057\u4f20\u7b97\u6cd5\u4e2d\u7684 sifting \u6b65\u9aa4\uff0c\u4f7f\u6392\u5e8f\u8fc7\u7a0b\u66f4\u76f4\u63a5\u5bf9\u9f50\u4e0b\u6e38\u91cf\u5b50\u7535\u8def\u6210\u672c\u3002", "categories": ["cs.AI", "cs.AR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05327", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u76f4\u63a5\u8ba9 LLM \u9884\u6d4b\u53d8\u91cf\u987a\u5e8f\uff0c\u800c\u662f\u5728\u591a\u7c7b\u521d\u59cb\u542f\u53d1\u5f0f\u57fa\u7840\u4e0a\u641c\u7d22\u6392\u5e8f\u89c4\u5219\uff0c\u63d0\u5347\u6cdb\u5316\u4e0e\u53ef\u63a7\u6027", "\u5019\u9009\u542f\u53d1\u5f0f\u901a\u8fc7\u6807\u51c6 BDD \u64cd\u4f5c\u8c03\u6574\u53d8\u91cf\u987a\u5e8f\uff0c\u5e76\u4ee5\u6700\u7ec8\u5408\u6210\u7535\u8def\u7684\u91cf\u5b50\u6210\u672c QCC \u4f5c\u4e3a\u9009\u62e9\u76ee\u6807", "HGA-QE \u5728\u57fa\u51c6\u4e0a\u76f8\u5bf9\u9010\u51fd\u6570\u6700\u4f73\u57fa\u7ebf\u8fbe\u5230 70.9% \u7684\u5e73\u5c40\u6216\u80dc\u51fa\u7387\uff0c\u5e76\u5728 13.5% \u51fd\u6570\u4e0a\u4e25\u683c\u6700\u4f18"], "keywords": ["\u91cf\u5b50\u8ba1\u7b97", "\u7535\u8def\u7efc\u5408", "LLM", "\u8fdb\u5316\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05327v1", "published_at": "2026-09-04", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "LLM-Driven Algorithm Design for Quantum Circuit Synthesis based on Binary Decision Diagrams", "tldr": "LLM\u8fdb\u5316\u641c\u7d22\u91cf\u5b50\u7535\u8defBDD\u6392\u5e8f\u542f\u53d1\u5f0f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa QuantumEvo\uff0c\u7528 LLM \u751f\u6210\u5e76\u8fdb\u5316\u7528\u4e8e BDD \u53d8\u91cf\u6392\u5e8f\u7684\u542f\u53d1\u5f0f\uff0c\u4ee5\u4f18\u5316\u53ef\u9006\u91cf\u5b50\u7535\u8def\u7efc\u5408\u4e2d\u7684\u91cf\u5b50\u6210\u672c\u3002\u5176\u53d1\u73b0\u7684 HGA-QE \u542f\u53d1\u5f0f\u6539\u9020\u4e86\u9057\u4f20\u7b97\u6cd5\u4e2d\u7684 sifting \u6b65\u9aa4\uff0c\u4f7f\u6392\u5e8f\u8fc7\u7a0b\u66f4\u76f4\u63a5\u5bf9\u9f50\u4e0b\u6e38\u91cf\u5b50\u7535\u8def\u6210\u672c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa BDD \u5927\u5c0f\u5e76\u4e0d\u603b\u662f\u91cf\u5b50\u7535\u8def\u6210\u672c\u7684\u597d\u4ee3\u7406\uff0c\u5e76\u5c55\u793a\u4e
