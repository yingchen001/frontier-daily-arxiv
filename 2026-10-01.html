<style>

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
  .card:hover { border-color:var(--accent); box-shadow:0 2px 12px rgba(37,99,235,.12); }
  .card.top { border-top:3px solid #f59e0b; }
  .card h3 { margin:0 0 8px; font-size:16px; line-height:1.4; }
  .card h3 .rank { color:var(--accent); font-weight:700; margin-right:5px; }
  .card h3 .badge { font-size:10px; background:#fef3c7; color:#92660a; border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:middle; }
  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }
  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }

  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

  /* 详情弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; padding:28px 16px; overflow:auto; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); color:var(--fg); max-width:920px; margin:0 auto; border-radius:14px; padding:22px 26px; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; line-height:1; color:var(--muted); cursor:pointer; }

  .pdfwrap { width:100%; height:600px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }

<script>
const PAPERS = [{"abstract": "We present AREX-2, an effort to advance the self-improving capability of LLM agents, which we define as the ability to iteratively refine a solution at test time. This ability rests on two complementary capabilities: reflection, which produces a solution better than the current one, and long-horizon execution, which keeps the iteration effective over many rounds. We hypothesize that both capabilities are domain-agnostic, and can therefore be learned in scenarios that are well suited for supervision. Accordingly, we synthesize long-horizon improvement trajectories from machine learning and algorithmic programming tasks, two domains that offer verifiable feedback and reward sustained iteration. Trained on this data, our agent, built on Qwen3.8-27B, achieves strong results on MLE-bench Lite (81.8) and Frontier-CS (70.7), transfers to deep research with 84.0 on BrowseComp, 52.6 on HLE, 92.2 on GAIA, and 93.8 on DeepSearchQA, and keeps improving as its budget of rounds grows. These results show that long-horizon reflective data is an effective route toward self-improving agents.", "arxiv_id": "2609.38288", "arxiv_url": "https://arxiv.org/abs/2609.38288", "authors": ["Hongjin Qian", "Chaofan Li", "Kun Luo", "Wenqing Wei", "Jianlyu Chen", "Shuqi Lu", "Yuyang Hu", "Hongwang Xiao", "Hui Wang", "Chaozhuo Li", "Qiwei Ye", "Zhicheng Dou", "Defu Lian", "Zheng Liu"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/VectorSpaceLab/AREX-2", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2609.38288", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Beijing Academy of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.38288v1", "published_at": "2026-09-29", "score": 0.508, "selected_reasons": ["\u77e5\u540d\u673a\u6784: BAAI", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (119\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38288.png", "title": "AREX-2: Advancing Self-Improving Agents through Long-Horizon Reflective Tasks", "tldr": null, "upvotes": 119, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier LLMs are increasingly used to automate scientific research through iterative search. We distinguish idea-driven search from solution-driven search and identify three core challenges: organizing evolving research ideas, selecting promising directions, and maintaining alignment between ideas and their implementations. To address these challenges, we introduce the Agentic Idea Manager (AIM), a fully autonomous framework for managing and exploring research directions in idea-driven automated research. Inspired by Bayesian optimization, AIM uses an Agentic Surrogate and an Agentic Acquisition mechanism to organize discovered ideas and guide their selection. A Solution Auditor maintains idea-solution integrity, while a Resource Planner adaptively allocates the remaining experimental budget across parallel search branches. Experiments on 10 AutoLab benchmark tasks show that AIM surpasses the strongest baseline by 1.6 percentage points on System Optimization tasks and 4.9 percentage points on long-horizon Model Development \u0026 CUDA tasks. Notably, AIM reaches the best baseline performance up to 3.1x faster in wall-clock time. We further provide a theoretical analysis of when searching over ideas becomes beneficial. Our analysis shows that explicit idea-level allocation makes semantic coverage directly controllable, and that broader coverage becomes increasingly valuable when competitive research directions are sparse among many plausible alternatives. Project Page: https://imhgchoi.github.io/agentic-idea-manager/", "arxiv_id": "2609.38445", "arxiv_url": "https://arxiv.org/abs/2609.38445", "authors": ["Hyeong Kyu Choi", "Bhavana Dalvi Mishra", "Jiefeng Chen", "Mihir Parmar", "Rui Meng", "Chun-Liang Li", "Xiangru Tang", "Sharon Li", "Jinsung Yoon", "Tomas Pfister"], "brief": "", "categories": ["cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.38445", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2609.38445v1", "published_at": "2026-09-29", "score": 0.508, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (43\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38445.png", "title": "AIM: Agentic Idea Management for Automated Research", "tldr": null, "upvotes": 43, "what_it_is": null, "why_notable": null}, {"abstract": "Software development requires more than editing code: developers repeatedly run software, interact with its interfaces, visually inspect its behavior, and use these observations to decide what to change next and whether a change works. Existing coding agents and computer-use agents are largely studied in isolation, leaving this integrated development process underexplored. Diagnosing a runtime interaction failure requires agents to connect visual observations with the responsible code, then use the application again to verify the repair. We introduce CUA-SWE, a benchmark, environment, and evaluation pipeline for software engineering with computer use. Beyond studying how GUI feedback supports diagnosis and repair, we ask whether agents can complete software engineering tasks when required specification or operational information is available only through the running application\u0027s visual interface. CUA-SWE spans four software engineering domains and requires agents to modify code and configuration, execute commands, interact with running software, and inspect visual feedback within the same task. Each task includes deterministic, task-specific tests that verify whether the resulting software satisfies the requirements and preserves specified behavior. Our evaluation characterizes how frontier agents combine source-level execution with application screenshots and graphical interaction to produce verified software changes. We examine performance across domains and task information requirements, alongside the development behaviors associated with successful repairs. CUA-SWE provides a unified testbed for studying how agents use visual feedback and interaction to guide software engineering, with executable correctness criteria for the resulting software.", "arxiv_id": "2609.32600", "arxiv_url": "https://arxiv.org/abs/2609.32600", "authors": ["Prince Zizhuang Wang", "Chenhao Liang", "Zelong Xu", "Aojie Yuan", "Xiaolin Zhou", "Haiyue Zhang", "Yue Zhao", "Xiyang Hu", "Shuli Jiang"], "brief": "", "categories": ["cs.AI", "cs.SE"], "github_repo": "https://github.com/kingofspace0wzz/cua-swe", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2609.32600", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2609.32600v1", "published_at": "2026-09-26", "score": 0.468, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32600.png", "title": "CUA-SWE: When Computer-Use Agents Meet Visual Software Engineering", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "GUI agents require high-quality interaction trajectories to learn how software environments respond to actions, maintain state, and support multi-step workflows. However, the diversity of available trajectories is constrained by the applications, interface states, and workflows accessible in the underlying environments. Expanding this coverage requires deploying increasingly diverse and complex software, with specialized applications imposing additional installation, configuration, and runtime costs. We introduce AutoGUIWorld, a data generation framework that combines the visual priors of image generators with the task knowledge of a planner to synthesize GUI interaction trajectories without deploying or running the corresponding software environments. AutoGUIWorld samples initial GUI scenes from structured specifications of operating-system context, visual appearance, and interface state, and generates tasks conditioned on those scenes. A planner then specifies atomic actions and their intended visual consequences, while an image generator iteratively edits the current screenshot to produce subsequent observations. Action grounding and transition-level quality filtering yield 79,266 spatially annotated step-level training samples across Ubuntu, Windows, macOS, and Chrome. Fine-tuning Qwen3.5-35B-A3B on AutoGUIWorld trajectories improves the mean task score on OSWorld from 33.0% to 40.8% and the task success rate on ScienceBoard from 14.0% to 32.2%. These results show that generated trajectories improve GUI-agent performance on real desktop and scientific tasks.", "arxiv_id": "2610.01215", "arxiv_url": "https://arxiv.org/abs/2610.01215", "authors": ["Cheng Yang", "Yifan Wu", "Yutao Huang", "Zhaohua Zhang", "Beiduo Chen", "Muxi Chen", "Chenchen Zhao", "Hexuan Deng", "Haolin Yang", "Geyuan Zhu", "Sa Zhu", "Jianhuan Zhuo", "Qiuyong Xiao", "Jianhao Ruan", "Yiran Peng", "Jiayi Zhang", "Tian Ye", "Xinlei Yu", "Tianwen Jiang", "Jihong Zhang", "Yuyu Luo"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/ImYangC7/AutoGUIWorld", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.01215", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2610.01215v1", "published_at": "2026-10-01", "score": 0.458, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.01215.png", "title": "AutoGUIWorld: Image Generators as Visual World Models for GUI Agent", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific coding agents receive equations, boundary conditions, and output requirements in writing, then must assess the programs they revise. Rules to Tools (R2T) supplies prepared executable checks of public scientific requirements. Matched SciCode repair groups share written checks, starting programs, model, and budgets; the tool group receives a callable implementation. Across two task-ID cohorts, complete repair is 26/30 with text and 29/30 with the prepared checks. Three task IDs favor tools, one favors text, and eleven tie. The eight-ID cohort scores 13/16 versus 15/16, with a task-cluster bootstrap 95% interval of [-12.5, 43.75] percentage points for the difference. The larger shared-definition SciCode cohort ties at 13/24 per group. Five development-exposed tasks with alternate starting programs score 3/10 versus 7/10. The tool group favors tasks 17, 77, and 11; initial checks flag task 17 and report no violation for tasks 77 and 11. Task 37 favors text and has no initial reported violation. A fresh source-through-Python arm also reaches 15/16, matching the dedicated command\u0027s aggregate. In a matched PDE comparison, detailed text scores 23/24 and checks score 24/24, with 31.2% lower reported model output for checks. Agent-side output savings vary by cohort, while public CPU use rises in both task-ID cohorts. These results measure task-dependent repair outcomes and agent-side costs with prepared checks.", "arxiv_id": "2610.00313", "arxiv_url": "https://arxiv.org/abs/2610.00313", "authors": ["Jingjie Ning", "Guojiang Zhao", "Chen Xu", "Shanshan Zhong", "Xiaochuan Li", "Ji Zeng", "Guolin Ke"], "brief": "", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.00313", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.00313v1", "published_at": "2026-09-29", "score": 0.398, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.00313.png", "title": "Rules to Tools: Executable Checks for LLM Agents in Scientific Computing", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Modern multimodal models bring generation and understanding into a single unified system, which enables them to provide and learn from their own feedback. Motivated by this unified capacity, we introduce UniEvo-VL, a self-evolving framework for multimodal models to learn from this constructive self-correction feedback during test-time compute. Instead of relying on a separate, often larger, teacher, we leverage their self-critiques as privileged information and ask a single multimodal model to act as both teacher and student with different contexts. The student only sees the vanilla question, while the teacher conditions on the privileged critique. Then training minimizes the per-state divergence between their denoising diffusion distributions over the student\u0027s own sampling trajectories. Experiments demonstrate that UniEvo-VL improves the image generation capabilities of multimodal models, while maintaining their sensitivity to additional reflection information. Specifically, we build on top of the open-source Qwen-image-2512 and observe a significant performance gain from 0.747 to 0.808 on GenEval and from 32.97 to 35.53 on GenEval2 Soft-TIFA. Moreover, attempts with more powerful external critics (e.g., GPT5.6-Luna) show that multimodal models with strong judge capabilities can anticipate a higher self-evolving ceiling. Last but not least, mixed text-rendering outcomes show that our self-improvements may not be uniform across different tasks. Our study aims to shed light on the current hot recursive self-improvement research line to enhance the user experience when using multimodal models without external supervision or guidance.", "arxiv_id": "2609.38721", "arxiv_url": "https://arxiv.org/abs/2609.38721", "authors": ["Fang Wu", "Da Xing", "Yanjie Huang", "Junxi Wang", "Ji Wang", "Hejia Geng", "Guancheng Wan", "Bowen Zuo", "Xiaomin Li", "Shixiang Tang", "Xinyu Xiang", "Zehong Wang", "Shiyi Du", "Peng Xia", "Shuangjia Zheng", "Yining Hong", "Li Erran Li", "Jure Leskovec", "Yejin Choi"], "brief": "", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.38721", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Stanford NLP", "pdf_url": "https://arxiv.org/pdf/2609.38721v1", "published_at": "2026-09-30", "score": 0.376, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (230\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38721.png", "title": "UniEvo-VL: An On-policy Self-Distillation Training Recipe for Multimodal Model Self-improvement", "tldr": null, "upvotes": 230, "what_it_is": null, "why_notable": null}, {"abstract": "Terminal agents act through stochastic model generations, yet the ability to generate a useful action does not ensure its reliable execution. A poor command (e.g., wrong package install) can change the environment in ways that hinder subsequent progress, even when the model could generate a better alternative. We investigate whether allocating test-time compute at the model-harness boundary can improve action reliability and trajectory success, and what makes this allocation effective. To study these questions, we introduce Mid-Harness, which samples and verifies candidate actions before forwarding one for execution, while keeping the generator and harness unchanged. With a TMAX-9B generator, more action sampling yields little benefit under weak verification, whereas a capable verifier can exploit useful alternatives from the same generator. On TerminalBench-Lite, a GPT-5.6 Sol verifier raises Pass@1 from 50.00% for the base agent to 68.03% with 8 sampled actions. When the same TMAX-9B model serves as the verifier, pairwise verification performs best among the evaluated verification mechanisms. Distilling responses from the stronger verifier into TMAX-9B further improves Pass@1, while leaving the action generator unchanged. With TMAX-9B on TerminalBench-Lite, combining action and trajectory scaling reaches higher success at lower estimated token cost than generating more trajectories alone. Mid-Harness also improves performance across additional models, benchmarks, and harnesses. These findings identify action scaling as a promising target for test-time compute scaling in terminal agents.", "arxiv_id": "2609.39982", "arxiv_url": "https://arxiv.org/abs/2609.39982", "authors": ["Minki Kang", "Ryo Hachiuma", "Shaokun Zhang", "Subhashree Radhakrishnan", "Yonggan Fu", "Jindong Jiang", "Mingjie Liu", "Ehsan Hosseini-Asl", "Yi Dong", "Yu-Chiang Frank Wang", "Byung-Kwan Lee"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.39982", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 5, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.39982v1", "published_at": "2026-09-30", "score": 0.357, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (102\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.39982.png", "title": "Mid-Harness: Scaling Actions Between Model and Harness for Terminal Agents", "tldr": null, "upvotes": 102, "what_it_is": null, "why_notable": null}, {"abstract": "High-compression tokenizers are essential for scaling latent image generative models. However, aggressive compression creates a fundamental tradeoff between reconstruction fidelity and generation efficiency: high compression image encoder always increases the learning difficulty of diffusion training, resulting in slow model convergence. Recent representation autoencoders speed up the diffusion training by improving the latent feature\u0027s expressive capability by replacing VAE encoders with pretrained semantic encoders, yet they are typically limited to moderate compression and lose pixel-level details necessary for faithful reconstruction. To achieve both high compression and fast diffusion training, we propose DC-SAE, a Decoupled Compact Semantic Autoencoder designed for high-compression image generation with accelerated diffusion model convergence. DC-SAE consists of two key components: (1) a macro-level architecture design that leverages semantic encoders to enable higher compression ratios, and (2) a pixel-level encoder that preserves low-level details, ensuring high-fidelity image reconstruction. We empirically demonstrate that DC-SAE performs strongly on image generation tasks, achieving both compact latent representations and efficient training dynamics. Specifically, on the ImageNet dataset with $512 \\times 512$ resolution, DC-SAE achieves $32\\times$ spatial compression, with 29.79 PSNR and 3.37 gFID, substantially outperforming the previous state-of-the-art high-compression tokenizer baselines DC-AE by 13.5% and 54.9% on PSNR and gFID, respectively, maintaining comparable throughput and faster diffusion model training convergence. Beyond class-conditional generation, a $1.6$B-parameter DiT using DC-SAE achieves 0.84 on GenEval and 86.007 on DPG-Bench for text-to-image generation at $1024\\times1024$ resolution.", "arxiv_id": "2609.39222", "arxiv_url": "https://arxiv.org/abs/2609.39222", "authors": ["Xu Huang", "Ye Huang", "Zijun Liao", "Yuwei Niu", "Xiaojie Li", "Menghan Zhou", "De Wen Soh", "Xiaotong Li", "Daquan Zhou"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/DAGroup-PKU/DCSAE", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2609.39222", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "DAGroup-PKU", "pdf_url": "https://arxiv.org/pdf/2609.39222v1", "published_at": "2026-09-30", "score": 0.334, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (34\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.39222.png", "title": "DC-SAE: Deep Compression Semantic Autoencoder for Faster Diffusion Convergence", "tldr": null, "upvotes": 34, "what_it_is": null, "why_notable": null}, {"abstract": "An unsuccessful LLM agent rollout contains more information than its final reward: the observations available to the agent, the actions it chose, and the environment\u0027s responses. Reusing this experience for learning requires identifying a decision to revise and testing a concrete alternative. We introduce the Agent Error Dataset (AED), comprising 50,228 error-diagnosis pairs from 9,961 source tasks across 33 environments, 19 harness families, and 23 policy models in text-based agent systems. We retain source traces and execution metadata to support cross-setting failure analysis and re-diagnosis without repeating the original rollout. Our five-stage Agentic Error-to-Training (AET) pipeline collects natural failures, generates diagnoses and proposed corrections, and checks them against recorded evidence. Where replay is supported, we compare corrections with original-action retries from the same checkpoint under matched execution settings. We then construct separate training views for diagnosis and actor recovery. Across 3,062 matched replay pairs, first-proposal corrections raise verifier pass rates from 18.4% to 51.1%, a gain of 32.7 percentage points. Using a separately frozen diagnosis release, full-diagnosis fine-tuning on 1,656 source tasks raises Qwen3-8B\u0027s exact-step agreement with internal teacher labels from 47.2% to 63.6%, averaged over three seeds on a 943-case holdout. The strongest prompted reference in this comparison scores 54.7%, and mean agreement improves at each of four increasing training-set sizes. In a single-seed comparison of actor-training recipes, action-only repair training scores 6.67 percentage points higher on WebShop-lite than success-only training.", "arxiv_id": "2609.40111", "arxiv_url": "https://arxiv.org/abs/2609.40111", "authors": ["Kunlun Zhu", "Xuyan Ye", "Yibo Li", "Cheng Qian", "Beibin Li", "Heng Ji"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.40111", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Apodex", "pdf_url": "https://arxiv.org/pdf/2609.40111v2", "published_at": "2026-09-30", "score": 0.332, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (45\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.40111.png", "title": "Agent Error Dataset: Scaling 50,000 Error--Diagnosis Pairs for Failure Analysis and Error-Aware Post-Training", "tldr": null, "upvotes": 45, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific software presents a demanding test for computer-using agents based on visual language models (VLMs): completing a research workflow requires interpreting specialized interfaces, manipulating scientific objects, and producing verifiable results. We thus introduce OSWorld-Science, a benchmark and evaluation environment that combines scientifically meaningful tasks, artifact-based evaluation, and an efficient agent harness for studying computer use in the scientific domain. The benchmark contains 12 VLMs and 146 high-quality tasks across several scientific domains and software configurations, covering workflows such as molecular drawing and retrosynthesis, pathology image analysis, statistical computing, and physical simulation. Tasks are developed through expert proposals and iterative human--AI co-design, with selection guided by scientific value and difficulty. Task-specific execution-based evaluators inspect application states and generated artifacts, including molecular structures, segmentation masks, plots, and numerical results, and award partial credit for incomplete outcomes. Our special harness integrates model adapters, interaction-loop control, and trajectory logging to support comparisons of models and interaction strategies. Our results show that current state-of-the-art VLMs with a strong harness still face challenges in addressing key questions in the scientific domains. We also analyze the benchmarking results across multi-linguistics, reasoning efforts, context length and other factors and derive several important conclusions and directions to assist future development. Overall, we provide an integrated framework connecting expert-defined scientific goals to verifiable software outcomes, enabling systematic evaluation of both agent capabilities and harness design in scientific workflows.", "arxiv_id": "2609.39903", "arxiv_url": "https://arxiv.org/abs/2609.39903", "authors": ["Dingyuan Dai", "Heli Qi", "Lei Liu", "Yinxi Li", "Baiding Chen", "Zijun Dou", "Qingcheng Zeng", "Qi Kang", "Oliver Sun", "Eric Wang", "Bo Zhou", "Haixin Wang", "Yufan Du", "Shi Bo", "Ruihan Lin", "Mengqi Yuan", "Dunjie Lu", "Steven Dillmann", "Yiming Shi", "Tina Su", "Amy Xin", "Minghao Liu", "Xi Wang", "Xu Huang", "Ge Zhang", "Pengyu Nie", "Zhen Yang", "Jie Tang", "Juanzi Li", "Weihao Xuan", "Tianyu Liu"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/DiscoAILab/OSWorld-Science", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2609.39903", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "DiscoAILab", "pdf_url": "https://arxiv.org/pdf/2609.39903v1", "published_at": "2026-09-30", "score": 0.329, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (26\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.39903.png", "title": "OSWorld-Science: A Benchmark of Computer Use Agents for Learning and Using Scientific Software", "tldr": null, "upvotes": 26, "what_it_is": null, "why_notable": null}, {"abstract": "Many language tasks have no single answer that can be checked automatically. Rubrics provide criteria for judging responses to these tasks. For reinforcement learning, the resulting verdicts must be combined into a scalar reward. A common approach sums the points assigned to satisfied criteria. Distinct verdict patterns can thus receive the same reward, and the fixed points encode how much each criterion should count, not how strongly its verdict distinguishes the current rollouts. Beyond this aggregation problem, judging the full rubric needs more judge requests as the criterion count grows. To address these limitations, Rubric Response Theory (RRT) measures quality and selects criteria when rubric criteria are monotone indicators of a shared target. Rather than adding assigned points, RRT uses a two parameter item response model that treats the verdict pattern as evidence about scalar quality specific to the rubric. Under this model, its likelihood score maximizes the local signal-to-noise ratio for quality. Its Response Parameter Network (RPN) reads the prompt and criterion text to predict criterion difficulty and discrimination. As the policy distribution changes during training, RRT uses online expectation maximization to update the RPN from current rollout verdicts. With Qwen3.5-4B as the policy, RRT\u0027s macro criterion score across Medical, Science, Rubrics as Rewards Science, and RubricBench is 1.7 points above that of group relative policy optimization (GRPO). On hard and very hard criteria in Medical and Science, RRT gains 2.8 to 5.6 points over GRPO. At half the criterion budget, adaptive Fisher selection with a frozen RPN keeps the macro criterion score across four datasets within 0.1 points of GRPO with full judging. These results show RRT can reduce judge requests while remaining competitive with GRPO.", "arxiv_id": "2609.35646", "arxiv_url": "https://arxiv.org/abs/2609.35646", "authors": ["Milad Yazdani", "Yaser Souri", "Xiren Zhou", "Pranit Chawla", "Dena Shahriari", "Subhojit Som", "Xia Song"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/milad1378yz/rrt", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2609.35646", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2609.35646v1", "published_at": "2026-09-28", "score": 0.321, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35646.png", "title": "Rubric Rewards from Item Response Theory", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "Reward models score responses from large language models (LLMs) and guide LLM training toward human preferences. However, reward models can favor superficial attributes such as length or confidence, leading LLMs to produce higher-scoring but not more correct responses. Existing mitigation methods either retrain the reward model or apply a fixed correction to one known bias, such as a preference for longer responses. Retraining requires additional data and computational resources, while existing editing methods require the target bias to be specified in advance and use a fixed edit for that bias. To this end, we propose BiasReducer, a lightweight framework that edits only the linear reward head and selects the relevant edits for each new dataset. First, BiasReducer uses a sparse autoencoder (SAE)-style encoder to learn which attributes (e.g., length and confidence) the reward model is sensitive to. Second, it learns how to reduce the reward model\u0027s dependence on each attribute by determining which direction to adjust the reward head and how much to adjust it. Third, for a new dataset, it ranks the attributes by their influence on reward scores, selects the relevant ones, and edits the reward model accordingly. BiasReducer consistently improves reward-model robustness to biases toward superficial response attributes. Across five reward models, BiasReducer-M improves the three benchmarks by 8.3, 18.0, and 6.9 percentage points on average, outperforming the two training-based baselines. The gains transfer downstream, reducing unnecessary verbosity and sycophancy while maintaining comparable judged quality.", "arxiv_id": "2609.32720", "arxiv_url": "https://arxiv.org/abs/2609.32720", "authors": ["Shuang Liu", "Yongliang Miao", "Yanguang Liu", "Haoyi Xiong", "Mengnan Du"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/olivialiu121/BiasReducer-RM", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.32720", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2609.32720v1", "published_at": "2026-09-26", "score": 0.312, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32720.png", "title": "BiasReducer: Adaptive Bias Mitigation for Reward Models", "tldr": null, "upvotes": 18, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) is a promising approach for training language agents, providing dense teacher supervision on student-generated trajectories. However, in multi-turn interaction, an incorrect action changes the states the student encounters later, so errors compound across turns. In preliminary experiments across three Qwen3 models (8B to 235B), we find that more than half of the failed rollouts contain a pivotal mistake, an action that moves the agent farther from completing the task, and this mistake typically occurs early. These pivotal mistakes often remain recoverable: guiding the model for only a few turns after the pivotal turn can restore task success. We therefore propose PivotOPD, an on-policy distillation framework that jointly trains the student to prevent pivotal mistakes and to recover from the states they create. At each pivotal mistake, a teacher model provides a gold action and then names a recovery action at each of the next few turns. Preventive distillation uses the gold action with reverse KL to steer the student away from the pivotal mistake, while recovery distillation uses the recovery actions with forward KL to transfer recovery behaviors that the student rarely samples. Against 13 baselines on ALFWorld, WebShop, and Search-based QA, PivotOPD achieves the strongest average performance for both Qwen3-1.7B and Qwen3-8B students, improving over the strongest baseline on ALFWorld by +5.5% with the 1.7B student. The gains also transfer to another model family on the software engineering domain, where PivotOPD raises the resolve rate of a Nemotron-3.5 student on SWE-Bench Verified by +3.2%. Project page: https://research.nvidia.com/labs/lpr/pivotopd/", "arxiv_id": "2609.40285", "arxiv_url": "https://arxiv.org/abs/2609.40285", "authors": ["Yinghui He", "Yapei Chang", "Khushi Bhardwaj", "Daniele Molinari", "Tugrul Konuk", "Jan Kautz", "Ali Hatamizadeh"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.40285", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.40285v1", "published_at": "2026-09-30", "score": 0.311, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (20\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.40285.png", "title": "PivotOPD: Learning to Recover from Pivotal Mistakes in Multi-Turn Agents", "tldr": null, "upvotes": 20, "what_it_is": null, "why_notable": null}, {"abstract": "A small trainable advisor can steer a frozen language-model executor using natural-language advice. In addition to learning from task rewards, the advisor can use feedback from completed interactions to improve its advice. However, a plausible correction need not change execution, yet learning from such corrections can still affect the advisor\u0027s future decisions in other contexts. In a shared-parameter model, we prove that such corrections can limit learning if their targets favor useful advice less strongly than those of other corrections. Keeping them less often than the rest improves the model\u0027s eventual performance compared to learning from every correction. Motivated by this, our method, Advisor Self-Distillation (AdviSD), pairs outcome-based reinforcement learning with self-distillation from a feedback-conditioned copy of the advisor selectively. Reflection proposes corrections, and the advisor scores the same recorded executor response with and without its issued advice, using the magnitude of the difference to select decisions for supervision. This approach does not require executor likelihoods or additional executor rollouts. Experiments with Qwen3-8B advisors for Gemini and Claude show that AdviSD outperforms advisor-GRPO by 4.2-6.4 percentage points on BFCL-v3 and by 3.9-5.1 score points on EnvScaler. The trained advisors generalize to out-of-domain tasks and transfer across different executor versions and model families. AdviSD also beats matched-count random selection, supporting the value of its selection rule.", "arxiv_id": "2609.38142", "arxiv_url": "https://arxiv.org/abs/2609.38142", "authors": ["Rishabh Agrawal", "Hejie Cui", "Shasha Li", "Shanchan Wu", "Sercan \u00d6. Ar\u0131k"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.38142", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2609.38142v1", "published_at": "2026-09-29", "score": 0.309, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38142.png", "title": "AdviSD: Learning to Advise Frontier LLMs via Targeted Multi-Turn Self-Distillation", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon robot manipulation reuses skills across many task compositions, but improving these compositions with additional end-to-end demonstrations is costly. A practical self-improving system must decide both what to teach next and where to apply that supervision. We present ROBOCOACH, a world-model-guided coaching framework that uses imagined failures to guide demonstration requests and expert updates. Its Route-Imagine-Diagnose-Improve (RIDI) loop executes reusable skill experts inside COACHWORLD, our shared action-conditioned world model, and uses a progress judge to record the first subtask that fails to complete. Aggregated records select which subtask demonstrations to acquire and which expert adapters to update. Across two simulation suites and two real-robot platforms, imagined and deployed success correlate over 22 task-policy pairs (rho = 0.840). Controlled comparisons show that our coaching method outperforms matched baselines under matched data budgets and update schedules. With only 150 additional subtask demonstrations, success rises from 13.3% to 75.0% on Franka and from 40.0% to 83.8% on AgileX. The coached experts also transfer to four held-out compositions, achieving an average success of 35.0%, compared with 0% for a shared-policy baseline updated with uniformly acquired demonstrations. Together, these results show that world models can serve as active coaches, turning imagined failures into targeted supervision for modular policy improvement. Project Page: https://robocoach-ai.github.io/", "arxiv_id": "2609.39685", "arxiv_url": "https://arxiv.org/abs/2609.39685", "authors": ["Jiajun Liu", "Yifan Chen", "Yichao Liu", "Jiayi Zhang", "Ruoqu Chen", "Shaoxuan Xie", "Guocai Yao", "Mengdi Xu", "Sen Cui", "Changshui Zhang"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/RoboCoach-AI/CoachWorld", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.39685", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2609.39685v1", "published_at": "2026-09-30", "score": 0.296, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.39685.png", "title": "RoboCoach: World Models as Active Coaches for Compositional Robot Skills", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Unified Multimodal Models (UMMs) often rely on separate visual representations for understanding and generation, increasing visual context length and complicating integration with established vision-language pretraining pipelines. Recent advances in pixel-space modeling offer an encoder-free alternative, but extending this paradigm from images to videos is non-trivial: video understanding and generation adopt different temporal representations, leaving the design of a unified visual interface an open question. We present PixelUMM, an encoder-free model for unified image and video understanding and generation directly in pixel space. PixelUMM represents images as spatial patches and videos as spatiotemporal tubelets, connecting raw pixels to a shared multimodal backbone through single-layer linear projections. Its Mixture-of-Transformers architecture combines shared attention with task-specific parameters and extends clean-pixel prediction to video generation, jointly supporting autoregressive text prediction and pixel-space flow matching. Experiments show that PixelUMM achieves competitive performance across image and video understanding and generation tasks. We further conduct empirical studies of key design choices, including decoder design and spatial-temporal patch size, providing insights for future pixel-space unified multimodal models.", "arxiv_id": "2609.38597", "arxiv_url": "https://arxiv.org/abs/2609.38597", "authors": ["Cong Wei", "Xuanchi Ren", "Bryan Chu", "Weiming Ren", "Huan Ling", "Jiahui Huang", "Laura Leal-Taix\u00e9", "Sanja Fidler", "Wenhu Chen", "Zian Wang", "Jay Zhangjie Wu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/nv-tlabs/PixelUMM", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.38597", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.38597v1", "published_at": "2026-09-29", "score": 0.296, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38597.png", "title": "PixelUMM: Encoder-Free Unified Image and Video Understanding and Generation", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly deployed as agents for multi-step decision-making, yet transfer poorly to unseen environments. World-model methods address this by training agents to predict future observations, at the cost of additional training and errors that compound when predictions are used for planning. However, for LLM agents operating in digital environments, much of this world knowledge is already internalized during pretraining, which shifts the problem from acquiring it to eliciting it. We argue that typical post-training provides little pressure for such elicitation, since supervision under a single goal at each visited state inadvertently drives policies to rely on superficial contextual habits. We introduce EVOKE, a post-training method that supplies this pressure through goal diversity at fixed states. Motivated by theory showing that an agent competent across diverse goals must encode a world model recoverable from its action preferences, EVOKE holds the environment state and interaction history fixed and ranks the same candidate actions under alternative goals, forcing action preferences to change, so that a policy relying on contextual habits or single-goal correlations cannot order them correctly. This implicitly elicits the policy\u0027s pretrained world knowledge to inform decisions. We evaluate EVOKE across diverse tasks in three backbones, demonstrating improved task performance, unseen environment generalization, and data efficiency. We further conduct controlled analyses to better understand what drives these gains. These findings offer a new perspective on eliciting internalized world knowledge for transferable action through direct decision supervision.", "arxiv_id": "2609.38334", "arxiv_url": "https://arxiv.org/abs/2609.38334", "authors": ["Yuhan Guo", "Jinming Liu", "Liang Xu", "Ziqiang Li", "Jianguo Huang", "Zhicheng Wang", "Hu Zhu", "Qiuyu Chen", "Yuntao Wei", "Xin Jin", "Wenjun Zeng"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/Gnonymous/EVOKE", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2609.38334", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2609.38334v2", "published_at": "2026-09-29", "score": 0.282, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (66\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38334.png", "title": "EVOKE: Eliciting World Knowledge in Agents for Transferable Decision-Making", "tldr": null, "upvotes": 66, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-reward guided reinforcement learning (i.e., RL) offers a promising way to improve joint audio-video diffusion models along several complementary objectives, including modality-specific quality, cross-modal semantic alignment, and temporal synchronization. Its effectiveness, however, depends on two quantities that change during training: where reward-driven updates should act, and how competing rewards should be combined. Existing methods tend to rely on fixed routing and reward weights, failing to track evolving model functions. To address these limitations, we propose Adaptive Reward Routing to jointly adapt update locations and reward coordination during forward-process RL (i.e., DiffusionNFT) of joint audio-video diffusion models. Our method consists of two components. (i) Cross-Modal Influence-Guided Routing (Localizing Updates): We use bidirectional cross-attention responses as an efficient proxy for evolving cross-modal influence, dynamically reweighting token-aware losses and scaling gradients across cross-modal layers without additional model interventions. (ii) Preference-Preserving Modality-Aware Reweighting (Coordinating Rewards): We preserve predefined weights as preference priors and use branch-specific reward-gradient interactions as residual corrections after warm-up. This resolves evolving conflicts without letting dominant rewards suppress weak but essential objectives. Extensive experiments demonstrate consistent improvements in modality quality, semantic consistency, and audio-video synchronization over strong RL baselines. Ablations and mechanism analyses further validate the complementary benefits of adaptive update routing and reward coordination.", "arxiv_id": "2609.37200", "arxiv_url": "https://arxiv.org/abs/2609.37200", "authors": ["Songlin Yang", "Xiaotong Zhao", "Jiacheng Zhang", "Zhe Wang", "Toyota Li", "Eric Liu", "Alan Zhao", "Anyi Rao"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37200", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2609.37200v1", "published_at": "2026-09-29", "score": 0.276, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37200.png", "title": "Adaptive Reward Routing: Dynamic Multi-Reward Optimization for Joint Audio-Video Diffusion via Forward-Process RL", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Research agents explain planned experiments. We measure predictive credit with paired forecasts sharing an intervention, forecaster, and outcome while varying description, matched explanation, and donor context. Five checks track commitment, delivery, predictive gain, alignment, and known-signal uptake. Across 336 prospective states in controlled learning, 12 Tox21 endpoints, and 24 OpenML tasks, v5\u0027s frozen credit decision was inconclusive. Tox21\u0027s preregistered ROC AUC interval-score harm test was unmet ($D-M=-.0026$, 95 percent interval [$-.0174$, .0104]); OpenML\u0027s joint formation, point-equivalence, and repeatability rule was unmet. Matched point-accuracy gains over description remained unconfirmed, and Tox21/OpenML seed-donor intervals spanned zero. Under requested DeepSeek V4 Pro, matched and donor cards reduced secondary Tox21 drift by 64.5 and 59.1 percent. A DeepSeek V4 Flash replay raised matched point MAE from .01823 to .02020 and missed matched-donor interval-score equivalence. OpenML full-card assignment widened nominal 80 percent intervals by 21 percent, with 49.3 percent coverage versus 51.4 percent for description and content in 66/144 cards. Direct-text Flash delivered all 144 notes without detectable matched point-accuracy gain. A researcher-authored mechanism positive control lowered point MAE by 2.60 percentage points versus description. The protocol measures predictive credit for research-agent benchmarks and scientific forecasting; natural-explanation credit remained unconfirmed at the tested donor resolutions.", "arxiv_id": "2610.00314", "arxiv_url": "https://arxiv.org/abs/2610.00314", "authors": ["Jingjie Ning", "Xueqi Li", "Yibo Kong", "Dongting Li"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.00314", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.00314v1", "published_at": "2026-09-29", "score": 0.248, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.00314.png", "title": "Predictive Credit: Measuring What Scientific Explanations Add to Experimental Forecasts", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Modern agentic systems combine an AI model with a harness that controls execution and environmental interactions. Harness design strongly affects long-horizon performance, yet its combinatorial search space demands substantial human effort that must be repeated as models change. Existing automated methods explore this space narrowly, optimizing only components such as prompts or skills or becoming trapped by fixed, exploitative search strategies. We introduce MILO (Meta-evolutionary Island Orchestration), a framework that co-evolves agent harnesses and the strategy used to discover them. MILO combines: (i) hierarchical lineage memory over island-based trees, using rejected mutations as negative evidence; (ii) per-island mutator agents that rewrite complete harnesses using global search history and parent-specific feedback; and (iii) an orchestrator that adapts search through lineage grafting and speciation, mutator reassignment and curriculum revision. Across Terminal-Bench 2.1, PaperBench, and DeepSWE, MILO-discovered harnesses outperform eight state-of-the-art harnesses and six search methods using frontier (Opus 4.8) and open-weight (gpt-oss-120b) models. With Opus 4.8, MILO improves resolution over its initial harness by $+12.0\\%$, $+28.3\\%$, and $+10.3\\%$, respectively, compared with best prior-search gains of $+4.5\\%$, $+18.3\\%$, and $0\\%$. On Terminal-Bench 2.1, it achieves $86.1 \\pm 2.0\\%$, exceeding the official leaderboard\u0027s top entry ($83.8 \\pm 2.3\\%$) while using 26\\% fewer tokens than its initial harness. On EinsteinArena open problems, MILO improves best-known upper bounds for Erd\u0151s minimum-overlap ($0.3808586 \\to 0.3808568$) and the first and third autocorrelation inequalities ($1.50274365 \\to 1.50274360$; $1.45081 \\to 1.44889$).", "arxiv_id": "2609.38349", "arxiv_url": "https://arxiv.org/abs/2609.38349", "authors": ["Prithwish Jana", "Mononito Goswami", "Hao Liu", "Xinyu Li", "Langlin Huang", "Zhehui Huang", "Zhishen Huang", "Patrick Bl\u00f6baum", "Anoop Deoras", "Purak Jain", "Nikos Kanakaris", "Sahika Genc"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.38349", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Amazon", "pdf_url": "https://arxiv.org/pdf/2609.38349v1", "published_at": "2026-09-29", "score": 0.226, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38349.png", "title": "MILO: Automated Harness Discovery via Orchestrated Multi-Agent Evolution", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Training a single LLM agent jointly across diverse interactive environments has attracted increasing attention as a route to generalist agents. Existing curriculum and data-selection strategies often allocate training at the environment level or prioritize local reward-based signals, without explicitly considering relationships between current rollouts across environments for prompt-group selection. Meanwhile, as environments are learned at different rates, all-failure and all-success rollout groups can coexist within a batch, leaving those data without group-relative reward signals. Both challenges highlight limitations of relying solely on scalar rewards in multi-environment RL: they provide limited information about cross-environment relationships and no within-group reward contrast when rewards are identical. This motivates richer textual feedback, such as rubrics describing rollout behaviours, to guide learning. Beyond rubrics\u0027 usage as reward, we repurpose rubrics to guide both online data selection and policy supervision. An LLM judge tags each rollout using a predefined rubric vocabulary shared across environments. The resulting profiles guide the selection of data that aligns with the overall behavioural composition of the mixed-environment batch while limiting overlap with already-selected data. Available positive rubrics (describing desired behaviours) provide privileged context for an on-policy self-distillation teacher, supplying additional token-level supervision, while negative rubrics (describing undesired behaviours) guide subsequent rollout generation away from recurring failure modes. Together, these components form RISED. Across model backbones, RISED achieves the highest mean pass rate across environments and ranks first or second in every individual environment. Rubric-based analysis of RISED can further characterize the behavioural changes accompanying these gains.", "arxiv_id": "2610.00979", "arxiv_url": "https://arxiv.org/abs/2610.00979", "authors": ["Jingtan Wang", "Sirajul Salekin", "Young mok Jung", "Javier Movellan", "Bryan Kian Hsiang Low", "Manjot Bilkhu"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.00979", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.00979v1", "published_at": "2026-10-01", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "RISED: RubrIcs for agentic multi-environment Selection and sElf-Distillation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As LLM agents undertake increasingly complex, long-horizon tasks, verifying their outputs becomes increasingly challenging. We study how verification capability can be strengthened with a fixed base model, without access to reference answers or grading rubrics at test time. Repeated sampling yields multiple rollouts that can contain complementary correct claims, but we need a reliable verification mechanism to determine which claims to trust. We first find that disagreement often exposes correct alternatives, while consensus can conceal errors. These observations motivate VeriHarness, which turns the underlying LLM a generator uses into an agentic verifier by giving it a workspace, evidence tools, and reusable verification skills. A disagreement resolver checks competing claims against environmental evidence, while a consensus challenger tests shared claims and searches for omitted requirements. Their findings guide the selection and revision of the final artifact. Across five long-horizon workspace benchmarks and two frontier models, VeriHarness achieves the highest selection scores among the evaluated baselines. Evidence-backed revision further improves average performance, bringing gains over a single rollout to 6.2 points with Gemini 3.5 Flash and 6.4 points with Claude Opus 4.8. We further show that verification skills can self-improve from failure feedback, demonstrating VeriHarness as a novel and critical approach for scaling long-horizon agentic verification. We release the full pool of approximately 26,000 rollouts across all five benchmarks and both models, produced at a cost of over $100,000, to support future research on agentic verification.", "arxiv_id": "2610.00972", "arxiv_url": "https://arxiv.org/abs/2610.00972", "authors": ["Caiqi Zhang", "Rujun Han", "Zifeng Wang", "Zoey CuiZhu", "Nigel Collier", "Tomas Pfister", "Chen-Yu Lee"], "brief": "", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.00972", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.00972v1", "published_at": "2026-10-01", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VeriHarness: Scaling Agentic Verification for Long-Horizon Tasks", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present OmniSeek, an agentic framework that transforms an Omni Large Language Model (Omni-LLM) into an active, multi-turn reasoning agent with native tool use. Rather than passively processing an entire audio-visual sequence in a single forward pass, OmniSeek makes evidence acquisition part of the reasoning process: it dynamically decides whether to look or listen, and over which temporal window, to retrieve sparse but critical evidence across different modalities within long contexts. Through an iterative multi-turn protocol, the retrieved raw audio or visual segments are appended back into the context to support subsequent reasoning. To cold-start this capability, we build a data engine that synthesizes OmniTraj-170K, a corpus of multi-hop Chain-of-Thought trajectories with interleaved audio and visual evidence. We first supervise the model on these trajectories to instill multi-turn tool-use behavior, and then further optimize the policy via a two-stage reinforcement learning with verifiable rewards. Moreover, we introduce an Audio-Visual Necessity objective that explicitly rewards successful trajectories whose reasoning depends on both modalities, discouraging single-modality shortcuts. Extensive experiments across a wide range of benchmarks demonstrate that OmniSeek learns adaptive cross-modal evidence seeking and consistently improves audio-visual reasoning performance.", "arxiv_id": "2610.02181", "arxiv_url": "https://arxiv.org/abs/2610.02181", "authors": ["Haibo Wang", "Jiteng Mu", "Jialu Li", "Jingru Yi", "Yuanjun Xiong", "Jianming Zhang", "Lifu Huang", "Mingze Xu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.02181", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.02181v1", "published_at": "2026-10-01", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "OmniSeek: Native Tool Integration for Multi-turn Audio-Visual Reasoning", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Patch retrieval, the task of finding the commit that fixes a known vulnerability, is the foundation of vulnerability management workflows, yet 60% to 63% of CVEs in the major advisory databases lack a patch link. We present PatchHolmes, a two-phase patch retrieval system that pairs a hybrid first-stage retriever with an agentic second-stage inspection loop. Unlike pointwise prior work that scores each candidate independently, the Phase 2 agent reads the top-100 listwise: it sees the full candidate list at once and selectively reads 3 to 10 commits through four budgeted tools before submitting a single best commit. On GitHubAD, PatchHolmes beats the pointwise binary classifier Favia by 25.34% Recall@1 and the retrieve-and-CoT baseline IRCoT by 31.40%, at one agent conversation per CVE versus Favia\u0027s ten; with the candidate set held identical, the agent adds 27.32% Recall@1 over taking the retriever\u0027s top candidate, and the same agent, transferred unchanged to PatchFinder_top10, lifts Recall@1 from PatchFinder\u0027s own top-1 pick (24.28%) to 39.86%. Swapping the LLM backbone within the Qwen family changes Recall@1 by under 1%, and a second model family (gpt-oss) stays far above the no-agent floor, so the gain comes from the listwise agent loop; the entire system runs on a frozen open-weight model over a local Git repository, without fine-tuning or external search APIs.", "arxiv_id": "2609.38807", "arxiv_url": "https://arxiv.org/abs/2609.38807", "authors": ["Guanqun Yang", "Yingming Zhou", "Jiangrui Zheng", "Shudong Hao", "Xueqing Liu"], "brief": "", "categories": ["cs.IR", "cs.SE"], "github_repo": "https://github.com/Aizhouym/PatchHolmes", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.38807", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Stevens Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2609.38807v1", "published_at": "2026-09-30", "score": 0.215, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38807.png", "title": "PatchHolmes: Agentic Patch Retrieval via Listwise Selection", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Existing auto-research benchmarks often entangle multiple sources of improvement, including training frameworks, hyperparameters, compute budgets, and data, making it difficult to attribute why one frontier agent outperforms another to specific research capabilities. In this work, we isolate and systematically evaluate Data Intelligence: an agent\u0027s ability to understand, manipulate, and improve the data that shapes model capabilities. We introduce AutoDataBench, a controlled testbed built on a conceptual framework of data intelligence spanning data diagnosis, data organization, and data construction, instantiated through three highly curated optimization tasks while holding non-data factors fixed. Across tool use, retrieval, and knowledge injection, we evaluate frontier LLMs\u0027 ability to improve training data through iterative experimentation under task-specific resource budgets. Beyond optimization performance, we ask: do LLMs understand what their data interventions do? We compare predictions made before training with observed outcomes to seek evidence of data-effect reasoning beyond trial and error, and explore whether iterative feedback helps LLMs better understand how changes to training data affect model performance. Finally, we show that reusing AutoDataBench trajectories for mid-training improves downstream coding performance, highlighting its value in both evaluating data intelligence and generating high-quality training data. Code and resources are available at https://github.com/AutoDataBench/AutoDataBench.", "arxiv_id": "2609.40097", "arxiv_url": "https://arxiv.org/abs/2609.40097", "authors": ["Ruifeng Yuan", "Yizhi Li", "Yaxin Du", "Fengyu Cai", "Yiqi Liu", "Hou Pong Chan", "Chenghua Lin", "Yun Chen", "Jian Yang", "Bryan Dai", "Pinyan Lu", "Chenghao Xiao"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/AutoDataBench/AutoDataBench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.40097", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "AutoDataBench", "pdf_url": "https://arxiv.org/pdf/2609.40097v1", "published_at": "2026-09-30", "score": 0.208, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.40097.png", "title": "AutoDataBench: A Data-centric Testbed for Accelerating Auto Research", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Latent visual reasoning (LVR) enables multimodal large language models (MLLMs) to perform intermediate computation in continuous latent tokens rather than expressing every reasoning step in words. However, unlike textual CoT, latent reasoning is not directly observable, making it difficult to supervise what latent tokens learn. In this work, we first conduct a thorough analysis of latent-token behavior and identify a latent evidence-credit gap: latent tokens respond only weakly to image perturbations that alter the correct answer. We hypothesize that this issue stems from the lack of explicit supervision during GRPO training. These findings suggest that a final-answer reward provides too little guidance on what visual evidence to preserve or how credit should be assigned across latent tokens. To bridge this gap, we propose ReaLVR, which brings visual-evidence supervision to the model\u0027s own free-running latent trajectories. ReaLVR contrasts correct and model-generated wrong answers to determine where stronger supervision is needed, and relevant and mismatched visual evidence to specify what to preserve. Across three model families, ReaLVR consistently outperforms evaluated LVR baselines, achieving the highest five-task average of 63.7% on Qwen2.5-VL-7B. Crucially, we are the first to scale visual reasoning in latent space, showing that our framework continues to deliver robust improvements at frontier model scales up to 235B. Further analyses show more question-sensitive latent-token positions, stronger alignment with relevant visual regions, and greater fixed-context dependence on the most attended latent tokens.", "arxiv_id": "2609.34563", "arxiv_url": "https://arxiv.org/abs/2609.34563", "authors": ["Xi Xiao", "Tianchen Zhao", "Youngeun Kim", "Zhuowei Li", "Linghan Xu", "Jiaye Wu", "Zheng Zhang", "Xiang Xu", "Xuanbai Chen", "Farhan Tejani", "Jakub Zablocki", "Julia Xu", "Yifan Xing"], "brief": "", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": "https://github.com/xixiaouab/ReaLVR-code", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2609.34563", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Amazon", "pdf_url": "https://arxiv.org/pdf/2609.34563v1", "published_at": "2026-09-28", "score": 0.168, "selected_reasons": ["HF trending (206\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34563.png", "title": "Rethinking Latent Visual Reasoning: Grounding Latent Reasoning in Visual Evidence", "tldr": null, "upvotes": 206, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) trains a student to match the teacher\u0027s next-token distributions on the student\u0027s own trajectories and has yielded substantial empirical gains. Generalized variants allow the student to surpass the teacher by extrapolating an implicit reward in output space. The language-model head, however, attenuates this change anisotropically: much of the change encoded in the teacher\u0027s hidden states reaches the logits at a small fraction of its weight, and the sampled-token log-probability ratios on which output-space extrapolation relies inject noise that the extrapolation amplifies, making training unstable. We observe that reinforcement learning (RL) shifts a model\u0027s internal representations relative to its base checkpoint, and that the direction of this shift can be measured at every layer. Motivated by this observation, we propose RIDE (RL-Induced Direction Extrapolation), which extrapolates the RL-induced change directly in representation space: at every layer and token position, RIDE computes the residual between the teacher and its pre-RL checkpoint and regresses the student\u0027s hidden states toward targets displaced beyond the teacher along this residual. Conditioned on a sampled trajectory, this regression is equivalent to maximizing a linear directional reward defined by the residual under a quadratic penalty centered at the teacher, which makes explicit how the objective moves the student along the RL-induced direction while limiting its deviation from the teacher. Across four base/RL-teacher pairs spanning different scales, architectures, and pre-training lineages, RIDE approaches or exceeds the RL-trained teacher on every pair and is the only method whose mean does so, and it consistently outperforms output-space extrapolation, which degrades the student whenever the teacher is close to its base. Project page: https://github.com/xixixixixxxx/RIDE.", "arxiv_id": "2609.36484", "arxiv_url": "https://arxiv.org/abs/2609.36484", "authors": ["Hao Li", "MeiJia Chen", "Weijie Ren", "Donghan Li", "Zijun Tian", "Jingchun Huang", "Naibo Wang"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/xixixixixxxx/RIDE", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.36484", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.36484v1", "published_at": "2026-09-29", "score": 0.16, "selected_reasons": ["HF trending (231\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36484.png", "title": "The Teacher Is a Direction, Not a Destination: Extrapolating RL-Induced Representation Residuals in On-Policy Distillation", "tldr": null, "upvotes": 231, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-using large language model (LLM) agents turn generated text into real side effects, so poisoned tool metadata, retrieved pages, memory, and reusable skills can steer the next call. Vetting an artifact before admission does not settle this. A safe variant and a leaking variant can produce the same admission evidence, and a sound gate then cannot relax that site for either. We make that condition precise, which leaves the last boundary a deployment can still act on. We present Provenance-Aware Capability Enforcement (PACE), which mediates every tool call immediately before it executes. Path confinement proposes an executable cut of represented influence paths, while capability and effect verification checks schema-defined effects against authority compiled from the authenticated request. We distinguish the certified execution contract from the evaluated configuration, which can restore an authorized call after a proposed block or apply a declared repair. Confinement requires the final action to preserve the certified cut. On eight executable agent-security benchmarks with three target-model families, the evaluated configuration gives strictly lowest attack success in 62 of 79 eligible attack columns and ties in 14; full-benchmark native utility loses at most three points relative to the undefended agent. A complete ablation over 1167 paired cases attributes most security gains to effect verification and refusal control to boundary adaptation. A reduced-scale adaptive search succeeds on 0/30 out-of-authority targets against the defense.", "arxiv_id": "2610.01349", "arxiv_url": "https://arxiv.org/abs/2610.01349", "authors": ["Fengpeng Li", "Qizhou Wang", "Yuke Hu", "Kemou Li", "Jun Liu", "Haiwei Wu", "Jiantao Zhou", "Di Wang"], "brief": "", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.01349", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.01349v1", "published_at": "2026-10-01", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PACE: Provenance-Aware Capability Enforcement for Tool-Using LLM Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Professional work often starts with a brief request that leaves the professional to work out what is needed, which documents matter, and whether the request\u0027s premise holds. We introduce DAYJOB, a benchmark of 130 tasks built by professionals in healthcare (50) and finance (80). The tasks are estimated to take a professional 13.6 hours on average in healthcare and 16.6 in finance. Each task is a containerized Harbor environment with an expert rubric of binary criteria (median 47.5 and 57.5 per task) that an agentic judge applies to the delivered files, and an attempt passes only if it meets every criterion. Across 30 model configurations from 13 developers, the strongest, Claude Opus 5.5, passes 24.7% of healthcare and 23.9% of finance attempts, and the median configuration passes 0.6% and 2.5%. In case studies, agents accept premises that the record contradicts and carry wrong inputs through otherwise consistent analyses. We release all healthcare tasks, 50 of the 80 finance tasks, the evaluation harness, and the leaderboard.", "arxiv_id": "2610.01306", "arxiv_url": "https://arxiv.org/abs/2610.01306", "authors": ["Stephanie Finley", "Liudas Panavas", "Thomas Mikkelson", "Cam Hinton", "Stacey Ganss", "Bradley Monton", "Emily Kendall", "Michelle Spradlin", "Lydia Bye", "Michael O\u0027Brien", "Lauren Ylvisaker", "Derek Ray", "Suhaas Garre", "Sushant Mehta", "Edwin Chen"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.01306", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.01306v1", "published_at": "2026-10-01", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DAYJOB: A Benchmark for Long-Horizon Professional Work", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Errors in LLM agent executions and their visible consequences can be separated by many steps, making decisive-error localization a matter of understanding both step content and step dependencies. We introduce DeFA, a dependency-guided framework for agent failure attribution. DeFA first combines protocol relations and semantic dependencies into an event dependency graph spanning the trajectory. It then identifie
