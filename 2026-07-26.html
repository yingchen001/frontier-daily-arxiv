1\u3002"}, {"abstract": "Low-Rank Adaptation (LoRA) has become a widely adopted technique for efficient neural network fine-tuning, decomposing model updates into low-rank matrices. However, LoRA remains computationally costly because it updates all matrices uniformly, regardless of their actual contribution to adaptation. This cost is especially prohibitive for large-scale models with billions of parameters and for resource-constrained settings such as edge deployment and on-device fine-tuning. We show for the first time that not all LoRA matrices are equally worth tuning: matrices with smaller condition numbers (the ratio of largest to smallest singular value) are already well-balanced across directions and contribute only marginally to adaptation, whereas matrices with larger condition numbers contain underdeveloped directions that span richer subspaces and drive most of the performance gains. This observation itself is a key contribution of our work, and it motivates a more selective approach to fine-tuning. Building on this insight, we propose \\k{appa}-LoRA, a method that optimizes LoRA by focusing updates on the matrices with the largest condition numbers, which capture the most informative directions of change. By restricting LoRA updates to the top 50% of weight matrices ranked by condition number, \\k{appa}-LoRA halves the trainable parameter count and correspondingly reduces compute and memory cost. Extensive experiments across multiple benchmarks show that this design cuts fine-tuning time by 16.2% on average while matching the accuracy of standard LoRA and reducing memory cost by 4.5%. Further analysis reveals that the condition numbers of the selected matrices consistently decrease over training, suggesting that \\k{appa}-LoRA\u0027s effectiveness stems from targeted spectral rebalancing rather than parameter selection alone.", "arxiv_id": "2607.22489", "arxiv_url": "https://arxiv.org/abs/2607.22489", "authors": ["Jianghui Wang", "Silong Yong", "Francesco Orabona", "Marco Canini", "Katia P. Sycara", "Yaqi Xie"], "brief": "\u8bba\u6587\u53d1\u73b0LoRA\u77e9\u9635\u7684\u6761\u4ef6\u6570\u53ef\u9884\u6d4b\u5176\u5fae\u8c03\u4ef7\u503c\uff1a\u6761\u4ef6\u6570\u5927\u7684\u77e9\u9635\u5305\u542b\u66f4\u672a\u5145\u5206\u53d1\u5c55\u7684\u65b9\u5411\uff0c\u5bf9\u9002\u914d\u8d21\u732e\u66f4\u5927\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u03ba-LoRA\uff0c\u53ea\u66f4\u65b0\u6761\u4ef6\u6570\u6392\u540d\u9760\u524d\u7684\u77e9\u9635\uff0c\u4ee5\u964d\u4f4e\u5fae\u8c03\u6210\u672c\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22489", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u9996\u6b21\u7cfb\u7edf\u6307\u51faLoRA\u4e2d\u5e76\u975e\u6240\u6709\u77e9\u9635\u540c\u7b49\u91cd\u8981\uff0c\u8f83\u5927\u6761\u4ef6\u6570\u5bf9\u5e94\u66f4\u4e30\u5bcc\u7684\u53ef\u4f18\u5316\u5b50\u7a7a\u95f4", "\u03ba-LoRA\u4ec5\u66f4\u65b0\u6761\u4ef6\u6570\u6700\u9ad8\u768450%\u6743\u91cd\u77e9\u9635\uff0c\u5c06\u53ef\u8bad\u7ec3\u53c2\u6570\u91cf\u51cf\u534a", "\u591a\u57fa\u51c6\u5b9e\u9a8c\u663e\u793a\u5728\u4fdd\u6301\u6807\u51c6LoRA\u7cbe\u5ea6\u7684\u540c\u65f6\uff0c\u5e73\u5747\u5fae\u8c03\u65f6\u95f4\u964d\u4f4e16.2%\uff0c\u663e\u5b58\u6210\u672c\u964d\u4f4e4.5%"], "keywords": ["\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "LoRA", "\u6a21\u578b\u538b\u7f29", "\u8c31\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22489v1", "published_at": "2026-07-24", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "\\k{appa}-LoRA: Condition Numbers Reveal Which LoRA Matrices Worth Updating", "tldr": "\u7528\u6761\u4ef6\u6570\u7b5b\u9009\u6700\u503c\u5f97\u66f4\u65b0\u7684LoRA\u77e9\u9635", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0LoRA\u77e9\u9635\u7684\u6761\u4ef6\u6570\u53ef\u9884\u6d4b\u5176\u5fae\u8c03\u4ef7\u503c\uff1a\u6761\u4ef6\u6570\u5927\u7684\u77e9\u9635\u5305\u542b\u66f4\u672a\u5145\u5206\u53d1\u5c55\u7684\u65b9\u5411\uff0c\u5bf9\u9002\u914d\u8d21\u732e\u66f4\u5927\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u03ba-LoRA\uff0c\u53ea\u66f4\u65b0\u6761\u4ef6\u6570\u6392\u540d\u9760\u524d\u7684\u77e9\u9635\uff0c\u4ee5\u964d\u4f4e\u5fae\u8c03\u6210\u672c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u63d0\u4f9b\u4e86\u4e00\u4e2a\u7b80\u5355\u3001\u53ef\u89e3\u91ca\u7684\u8c31\u5206\u6790\u51c6\u5219\u6765\u9009\u62e9LoRA\u66f4\u65b0\u5bf9\u8c61\uff0c\u6709\u671b\u63d0\u5347\u5927\u6a21\u578b\u548c\u7aef\u4fa7\u573a\u666f\u4e0b\u53c2\u6570\u9ad8\u6548\u5fae\u8c03\u7684\u5b9e\u7528\u6027\u3002"}, {"abstract": "Dysphagia is a debilitating late effect of head and neck cancer (HNC) treatment, yet timely identification of at-risk patients remains challenging in survivorship care. Definitive assessment relies on videofluoroscopic imaging, as captured by the Dynamic Imaging Grade of Swallowing Toxicity (CTCAE-DIGEST), which, while validated, requires specialized equipment, trained personnel, and significant patient burden, limiting its routine use in surveillance. Patient-reported outcomes (PROs), by contrast, are low-cost, scalable, and easily collected at any clinical encounter, making them an attractive alternative signal for identifying patients who may warrant further evaluation. However, a clear clinical framework for translating PRO responses into actionable interventions is still evolving. In particular, uncertainty remains regarding when a patient\u0027s self-reported symptom burden should prompt escalation of care. This study addresses this gap by formulating a single-visit PRO-clinical prediction framework and introducing a clinically interpretable two-stage stacking model to predict swallowing impairment risk using PRO responses and structured clinical variables, without requiring videofluoroscopic imaging. The proposed framework quantifies the independent contributions of patient-reported symptoms and clinical factors within a unified and interpretable risk assessment model. Our findings demonstrate that individual MDADI responses contain predictive information beyond that captured by composite or global summary scores, while interpretability analyses reveal symptom patterns and clinical risk factors associated with swallowing impairment. Together, these results support the use of structured PRO-clinical integration as a practical, imaging-free approach for dysphagia risk stratification in HNC survivorship.", "arxiv_id": "2607.22514", "arxiv_url": "https://arxiv.org/abs/2607.22514", "authors": ["Siyuan Zhao", "Eric Ababio Anyimadu", "Zachary G. Brumm", "Yue Ma", "Clifton David Fuller", "Xinhua Zhang", "G. Elisabeta Marai", "Guadalupe Canahuate"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5355\u6b21\u5c31\u8bca\u53ef\u7528\u7684\u4e24\u9636\u6bb5 PRO-\u4e34\u5e8a stacking \u6a21\u578b\uff0c\u7528\u60a3\u8005\u62a5\u544a\u7ed3\u5c40\uff08MDADI\uff09\u548c\u7ed3\u6784\u5316\u4e34\u5e8a\u53d8\u91cf\u9884\u6d4b\u5934\u9888\u764c\u5e78\u5b58\u8005\u541e\u54bd\u969c\u788d\u98ce\u9669\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u89c6\u9891\u900f\u89c6\u541e\u54bd\u68c0\u67e5\uff0c\u65e8\u5728\u4e3a\u662f\u5426\u5347\u7ea7\u62a4\u7406\u6216\u8fdb\u4e00\u6b65\u8bc4\u4f30\u63d0\u4f9b\u53ef\u89e3\u91ca\u98ce\u9669\u5206\u5c42\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22514", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u4e24\u9636\u6bb5 stacking \u6846\u67b6\uff0c\u5206\u522b\u6574\u5408\u60a3\u8005\u81ea\u8bc4\u75c7\u72b6\u4e0e\u4e34\u5e8a\u56e0\u7d20\uff0c\u5e76\u91cf\u5316\u4e8c\u8005\u7684\u72ec\u7acb\u8d21\u732e", "\u53d1\u73b0\u5355\u4e2a MDADI \u95ee\u9898\u56de\u7b54\u6bd4\u7efc\u5408\u5206\u6216\u5168\u5c40\u6c47\u603b\u5206\u5305\u542b\u66f4\u591a\u9884\u6d4b\u4fe1\u606f", "\u53ef\u89e3\u91ca\u6027\u5206\u6790\u63ed\u793a\u4e86\u4e0e\u541e\u54bd\u969c\u788d\u76f8\u5173\u7684\u5173\u952e\u75c7\u72b6\u6a21\u5f0f\u548c\u4e34\u5e8a\u98ce\u9669\u56e0\u7d20"], "keywords": ["\u533b\u7597AI", "\u98ce\u9669\u5206\u5c42", "\u53ef\u89e3\u91ca\u673a\u5668\u5b66\u4e60", "\u4e34\u5e8a\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22514v1", "published_at": "2026-07-24", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Dysphagia Risk Stratification in Head and Neck Cancer via Two-Stage PRO-Clinical Stacking", "tldr": "\u7528\u60a3\u8005\u81ea\u8bc4\u4e0e\u4e34\u5e8a\u53d8\u91cf\u9884\u6d4b\u541e\u54bd\u969c\u788d\u98ce\u9669", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5355\u6b21\u5c31\u8bca\u53ef\u7528\u7684\u4e24\u9636\u6bb5 PRO-\u4e34\u5e8a stacking \u6a21\u578b\uff0c\u7528\u60a3\u8005\u62a5\u544a\u7ed3\u5c40\uff08MDADI\uff09\u548c\u7ed3\u6784\u5316\u4e34\u5e8a\u53d8\u91cf\u9884\u6d4b\u5934\u9888\u764c\u5e78\u5b58\u8005\u541e\u54bd\u969c\u788d\u98ce\u9669\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u89c6\u9891\u900f\u89c6\u541e\u54bd\u68c0\u67e5\uff0c\u65e8\u5728\u4e3a\u662f\u5426\u5347\u7ea7\u62a4\u7406\u6216\u8fdb\u4e00\u6b65\u8bc4\u4f30\u63d0\u4f9b\u53ef\u89e3\u91ca\u98ce\u9669\u5206\u5c42\u3002", "why_notable": "\u8be5\u7814\u7a76\u5c06\u4f4e\u6210\u672c\u3001\u6613\u91c7\u96c6\u7684\u60a3\u8005\u81ea\u8bc4\u6570\u636e\u8f6c\u5316\u4e3a\u53ef\u64cd\u4f5c\u7684\u4e34\u5e8a\u98ce\u9669\u8bc4\u4f30\u5de5\u5177\uff0c\u6709\u671b\u51cf\u5c11\u5bf9\u4e13\u7528\u5f71\u50cf\u68c0\u67e5\u7684\u4f9d\u8d56\uff0c\u63d0\u5347\u5934\u9888\u764c\u968f\u8bbf\u4e2d\u7684\u541e\u54bd\u969c\u788d\u65e9\u7b5b\u4e0e\u5206\u8bca\u6548\u7387\u3002"}, {"abstract": "Data scarcity poses a fundamental challenge in training generative models to produce initial guesses for parametric optimization problems that are otherwise numerically expensive to solve. We therefore study a $k$-neighborhood data collection strategy that augments datasets of converged solutions with intermediate solver iterates, increasing the amount of training data without additional solver runs. To understand the benefits of this approach, we derive a generalization bound based on Rademacher complexity that reveals the role of the $k$-neighborhoods and related parameters. To achieve this result, we focus on one-sided box-constrained quadratic programs solved by projected gradient descent. We illustrate the behavior of this solver on two examples. The approach proposed in this paper enables a more capable DDDAS paradigm by improving the efficiency of the data-model-optimization loop. We finish by discussing two views of learning solver-iterate data and connect our analysis with GLENS, a new data-efficient global search method.", "arxiv_id": "2607.22467", "arxiv_url": "https://arxiv.org/abs/2607.22467", "authors": ["Anjian Li", "Ryne Beeson"], "brief": "\u672c\u6587\u7814\u7a76\u5728\u53c2\u6570\u5316\u4f18\u5316\u95ee\u9898\u4e2d\uff0c\u5c06\u5df2\u6536\u655b\u89e3\u9644\u8fd1\u7684PGD\u4e2d\u95f4\u8fed\u4ee3\u4f5c\u4e3a\u8bad\u7ec3\u6570\u636e\u7684 k-neighborhood \u6570\u636e\u6536\u96c6\u7b56\u7565\u3002\u4f5c\u8005\u9488\u5bf9\u5355\u8fb9\u76d2\u7ea6\u675f\u4e8c\u6b21\u89c4\u5212\uff0c\u7ed9\u51fa\u57fa\u4e8eRademacher\u590d\u6742\u5ea6\u7684\u6cdb\u5316\u754c\uff0c\u5206\u6790\u8fd9\u79cd\u6570\u636e\u6269\u589e\u4e3a\u4f55\u80fd\u63d0\u5347\u5b66\u4e60\u521d\u503c\u751f\u6210\u5668\u7684\u6548\u7387\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22467", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u5229\u7528\u5df2\u8fd0\u884c\u6c42\u89e3\u5668\u4ea7\u751f\u7684\u4e2d\u95f4\u8fed\u4ee3\u70b9\u6269\u5145\u6570\u636e\u96c6\uff0c\u65e0\u9700\u989d\u5916\u6c42\u89e3\u5668\u8c03\u7528\u5373\u53ef\u7f13\u89e3\u6570\u636e\u7a00\u7f3a", "\u5728\u6295\u5f71\u68af\u5ea6\u4e0b\u964d\u6c42\u89e3\u5355\u8fb9\u76d2\u7ea6\u675f\u4e8c\u6b21\u89c4\u5212\u7684\u8bbe\u5b9a\u4e0b\uff0c\u63a8\u5bfc\u5305\u542b k-neighborhood \u53c2\u6570\u5f71\u54cd\u7684\u6cdb\u5316\u8bef\u5dee\u754c", "\u901a\u8fc7\u4e24\u4e2a\u793a\u4f8b\u5c55\u793a\u6c42\u89e3\u5668\u8fed\u4ee3\u884c\u4e3a\uff0c\u5e76\u5c06\u5206\u6790\u4e0e\u6570\u636e\u9ad8\u6548\u5168\u5c40\u641c\u7d22\u65b9\u6cd5 GLENS \u53ca DDDAS \u95ed\u73af\u8054\u7cfb\u8d77\u6765"], "keywords": ["\u4f18\u5316", "\u6cdb\u5316\u7406\u8bba", "\u6570\u636e\u589e\u5f3a", "\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22467v1", "published_at": "2026-07-24", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Complexity Bounds and Approaches to Learning Projected Gradient Descent Solver Iterates", "tldr": "\u7528PGD\u4e2d\u95f4\u8fed\u4ee3\u6269\u589e\u4f18\u5316\u5b66\u4e60\u6570\u636e", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5728\u53c2\u6570\u5316\u4f18\u5316\u95ee\u9898\u4e2d\uff0c\u5c06\u5df2\u6536\u655b\u89e3\u9644\u8fd1\u7684PGD\u4e2d\u95f4\u8fed\u4ee3\u4f5c\u4e3a\u8bad\u7ec3\u6570\u636e\u7684 k-neighborhood \u6570\u636e\u6536\u96c6\u7b56\u7565\u3002\u4f5c\u8005\u9488\u5bf9\u5355\u8fb9\u76d2\u7ea6\u675f\u4e8c\u6b21\u89c4\u5212\uff0c\u7ed9\u51fa\u57fa\u4e8eRademacher\u590d\u6742\u5ea6\u7684\u6cdb\u5316\u754c\uff0c\u5206\u6790\u8fd9\u79cd\u6570\u636e\u6269\u589e\u4e3a\u4f55\u80fd\u63d0\u5347\u5b66\u4e60\u521d\u503c\u751f\u6210\u5668\u7684\u6548\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u201c\u5b66\u4e60\u4f18\u5316\u6c42\u89e3\u5668\u8f68\u8ff9\u201d\u63d0\u4f9b\u4e86\u7406\u8bba\u89e3\u91ca\uff0c\u8bf4\u660e\u4e2d\u95f4\u8fed\u4ee3\u6570\u636e\u53ef\u4f5c\u4e3a\u4f4e\u6210\u672c\u76d1\u7763\u4fe1\u53f7\u63d0\u5347\u6570\u636e\u6548\u7387\uff0c\u5bf9\u6602\u8d35\u53c2\u6570\u5316\u4f18\u5316\u3001\u4eff\u771f\u4f18\u5316\u548c\u6570\u636e\u9a71\u52a8\u52a8\u6001\u7cfb\u7edf\u5e94\u7528\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Volatility forecasting is dominated by persistence and measurement noise, leaving limited residual structure for nonlinear models to exploit. We introduce Susceptible Architectures (SUSA), a reservoir-design principle for volatility forecasting, and its two concrete implementations, based on complex-valued open-chain and periodic reservoirs and regime-conditioned experts to interpret reservoir features across calm, onset, recovery, and persistent-stress states. We also implement open-system $q$-qubit counterparts in Qiskit while retaining a common AR-Ridge anchor and a bounded residual correction trained under QLIKE. We evaluate models on 16 U.S. equity and exchange-traded-fund series using three disjoint chronological training, validation, and test folds, a 12-observation input window, and a five-observation forecast horizon. The proposed models perform competitively with GARCH, achieving statistically significant QLIKE improvements for specific assets (IWM, XLP). Also models\u0027 forecasts complement HARQ-style predictions: a stacked ensemble improves mean QLIKE by 0.0116 over its strongest constituent and wins in 75% of test scenarios.", "arxiv_id": "2607.22491", "arxiv_url": "https://arxiv.org/abs/2607.22491", "authors": ["Aliaksei Kaliutau"], "brief": "\u8bba\u6587\u63d0\u51fa Susceptible Architectures\uff08SUSA\uff09\u4f5c\u4e3a\u9762\u5411\u91d1\u878d\u6ce2\u52a8\u7387\u9884\u6d4b\u7684\u50a8\u5907\u6c60\u8bbe\u8ba1\u539f\u5219\uff0c\u5e76\u5b9e\u73b0\u590d\u503c\u5f00\u653e\u94fe\u3001\u5468\u671f\u50a8\u5907\u6c60\u53ca Qiskit \u4e2d\u7684\u5f00\u653e\u7cfb\u7edf\u91cf\u5b50\u7248\u672c\u3002\u65b9\u6cd5\u7ed3\u5408 AR-Ridge \u57fa\u7ebf\u3001QLIKE \u8bad\u7ec3\u7684\u6709\u754c\u6b8b\u5dee\u6821\u6b63\uff0c\u4ee5\u53ca\u6309\u5e73\u9759\u3001\u7206\u53d1\u3001\u6062\u590d\u3001\u6301\u7eed\u538b\u529b\u7b49\u5e02\u573a\u72b6\u6001\u5212\u5206\u7684\u4e13\u5bb6\u6a21\u578b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22491", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": ["\u572816\u4e2a\u7f8e\u56fd\u80a1\u7968\u4e0eETF\u5e8f\u5217\u4e0a\u8bc4\u4f30\uff0c\u91c7\u75283\u7ec4\u6309\u65f6\u95f4\u5212\u5206\u7684\u8bad\u7ec3\u3001\u9a8c\u8bc1\u3001\u6d4b\u8bd5\u6298\u300112\u671f\u8f93\u5165\u7a97\u53e3\u548c5\u671f\u9884\u6d4b horizon", "SUSA \u6a21\u578b\u6574\u4f53\u53ef\u4e0e GARCH \u7ade\u4e89\uff0c\u5e76\u5728 IWM\u3001XLP \u7b49\u7279\u5b9a\u8d44\u4ea7\u4e0a\u53d6\u5f97\u7edf\u8ba1\u663e\u8457\u7684 QLIKE \u6539\u8fdb", "\u4e0e HARQ \u98ce\u683c\u9884\u6d4b\u4e92\u8865\uff1a\u5806\u53e0\u96c6\u6210\u76f8\u8f83\u6700\u5f3a\u5355\u6a21\u578b\u5e73\u5747 QLIKE \u964d\u4f4e0.0116\uff0c\u5e76\u572875%\u6d4b\u8bd5\u573a\u666f\u4e2d\u80dc\u51fa"], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u91d1\u878d\u9884\u6d4b", "\u50a8\u5907\u6c60\u8ba1\u7b97", "\u91cf\u5b50\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22491v1", "published_at": "2026-07-24", "score": 0.1, "selected_reasons": [], "thumbnail": null, "title": "Susceptible Reservoir Architectures for Regime-Conditional Volatility Forecasting", "tldr": "\u7528\u6613\u611f\u50a8\u5907\u6c60\u6539\u8fdb\u5206\u72b6\u6001\u6ce2\u52a8\u7387\u9884\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Susceptible Architectures\uff08SUSA\uff09\u4f5c\u4e3a\u9762\u5411\u91d1\u878d\u6ce2\u52a8\u7387\u9884\u6d4b\u7684\u50a8\u5907\u6c60\u8bbe\u8ba1\u539f\u5219\uff0c\u5e76\u5b9e\u73b0\u590d\u503c\u5f00\u653e\u94fe\u3001\u5468\u671f\u50a8\u5907\u6c60\u53ca Qiskit \u4e2d\u7684\u5f00\u653e\u7cfb\u7edf\u91cf\u5b50\u7248\u672c\u3002\u65b9\u6cd5\u7ed3\u5408 AR-Ridge \u57fa\u7ebf\u3001QLIKE \u8bad\u7ec3\u7684\u6709\u754c\u6b8b\u5dee\u6821\u6b63\uff0c\u4ee5\u53ca\u6309\u5e73\u9759\u3001\u7206\u53d1\u3001\u6062\u590d\u3001\u6301\u7eed\u538b\u529b\u7b49\u5e02\u573a\u72b6\u6001\u5212\u5206\u7684\u4e13\u5bb6\u6a21\u578b\u3002", "why_notable": "\u91d1\u878d\u6ce2\u52a8\u7387\u9884\u6d4b\u901a\u5e38\u88ab\u5f3a\u6301\u4e45\u6027\u548c\u566a\u58f0\u4e3b\u5bfc\uff0c\u975e\u7ebf\u6027\u6a21\u578b\u5f88\u96be\u53d1\u6325\u4f5c\u7528\uff1b\u8be5\u5de5\u4f5c\u901a\u8fc7\u72b6\u6001\u6761\u4ef6\u5316\u50a8\u5907\u6c60\u548c\u6b8b\u5dee\u6821\u6b63\uff0c\u4e3a\u5c06 reservoir computing \u4e0e\u91cf\u5b50\u542f\u53d1\u6a21\u578b\u7528\u4e8e\u5b9e\u9645\u91d1\u878d\u9884\u6d4b\u63d0\u4f9b\u4e86\u4e00\u4e2a\u53ef\u68c0\u9a8c\u6846\u67b6\u3002"}, {"abstract": "Singular value soft-thresholding can be computed via a reduction to the matrix polar decomposition, which allows one to exploit GPU-friendly algorithms for computing the polar decomposition. Empirically, there is a significant speed-up on GPUs compared to the standard approach using the SVD. We leave the investigation of robustness to future work, but note that due to the discontinuous nature of the sign function, the reduction to the polar decomposition is likely only suitable for low-accuracy applications.", "arxiv_id": "2607.22484", "arxiv_url": "https://arxiv.org/abs/2607.22484", "authors": ["Stephen Becker"], "brief": "\u672c\u6587\u63d0\u51fa\u5c06\u5947\u5f02\u503c\u8f6f\u9608\u503c\u95ee\u9898\u7ea6\u5316\u4e3a\u77e9\u9635\u6781\u5206\u89e3\uff0c\u4ece\u800c\u5229\u7528\u66f4\u9002\u5408GPU\u7684\u6781\u5206\u89e3\u7b97\u6cd5\u66ff\u4ee3\u4f20\u7edfSVD\u8ba1\u7b97\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728GPU\u4e0a\u76f8\u6bd4\u6807\u51c6SVD\u65b9\u6848\u6709\u663e\u8457\u52a0\u901f\u3002", "categories": ["math.NA", "cs.LG", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22484", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5947\u5f02\u503c\u8f6f\u9608\u503c\u7b97\u5b50\u901a\u8fc7\u77e9\u9635\u6781\u5206\u89e3\u5b9e\u73b0\uff0c\u907f\u514d\u76f4\u63a5\u4f9d\u8d56\u5b8c\u6574SVD\u6d41\u7a0b", "\u53ef\u5229\u7528GPU\u53cb\u597d\u7684\u6781\u5206\u89e3\u8fed\u4ee3\u7b97\u6cd5\uff0c\u5728\u4f4e\u7cbe\u5ea6\u573a\u666f\u4e2d\u83b7\u5f97\u660e\u663e\u901f\u5ea6\u4f18\u52bf", "\u4f5c\u8005\u6307\u51fa\u7531\u4e8e\u7b26\u53f7\u51fd\u6570\u4e0d\u8fde\u7eed\uff0c\u8be5\u7ea6\u5316\u7684\u6570\u503c\u9c81\u68d2\u6027\u4ecd\u5f85\u7814\u7a76\uff0c\u53ef\u80fd\u4e0d\u9002\u5408\u9ad8\u7cbe\u5ea6\u9700\u6c42"], "keywords": ["\u6570\u503c\u7ebf\u6027\u4ee3\u6570", "\u4f4e\u79e9\u4f18\u5316", "GPU\u8ba1\u7b97", "\u77e9\u9635\u5206\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22484v1", "published_at": "2026-07-24", "score": 0.1, "selected_reasons": [], "thumbnail": null, "title": "Singular value soft-thresholding via the polar decomposition", "tldr": "\u7528\u6781\u5206\u89e3\u52a0\u901fGPU\u4e0a\u7684\u5947\u5f02\u503c\u8f6f\u9608\u503c\u8ba1\u7b97", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u5c06\u5947\u5f02\u503c\u8f6f\u9608\u503c\u95ee\u9898\u7ea6\u5316\u4e3a\u77e9\u9635\u6781\u5206\u89e3\uff0c\u4ece\u800c\u5229\u7528\u66f4\u9002\u5408GPU\u7684\u6781\u5206\u89e3\u7b97\u6cd5\u66ff\u4ee3\u4f20\u7edfSVD\u8ba1\u7b97\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728GPU\u4e0a\u76f8\u6bd4\u6807\u51c6SVD\u65b9\u6848\u6709\u663e\u8457\u52a0\u901f\u3002", "why_notable": "\u5947\u5f02\u503c\u8f6f\u9608\u503c\u5e7f\u6cdb\u7528\u4e8e\u4f4e\u79e9\u4f18\u5316\u3001\u77e9\u9635\u8865\u5168\u548c\u673a\u5668\u5b66\u4e60\u4e2d\u7684\u6838\u8303\u6570\u6b63\u5219\u5316\uff1b\u82e5\u80fd\u5728GPU\u4e0a\u9ad8\u6548\u5b9e\u73b0\uff0c\u53ef\u63d0\u5347\u76f8\u5173\u5927\u89c4\u6a21\u4f18\u5316\u7b97\u6cd5\u7684\u5b9e\u7528\u6027\u80fd\u3002"}, {"abstract": "For scale-invariant deep networks, Hyperball-style optimizers have shown strong performance in large-scale training by fixing the norms of matrix-valued parameters and normalizing updates. However, the source of their advantage remains unclear. Starting from the angular displacement between consecutive parameter states, we derive an angular effective learning rate that accounts for the parameter-update angle, parameter norm, and update norm. We also show that the conventional norm-based measure is a special case under parameter-update orthogonality. We then decompose optimizer updates into radial and tangential components and analyze how radial updates affect one-step angular displacement. Under the training configurations considered, numerical results show that the radial component has only a limited direct effect on the angular effective learning rate. It therefore cannot explain why MuonH converges more slowly than MuonWD early in training but overtakes it later. To further isolate the underlying mechanism, we devise a heuristic experiment that modifies only the learning-rate schedule so that the dynamics of each optimizer reproduce those of the other. The results suggest that their main difference stems from the evolution of the effective step size rather than an intrinsically superior update direction induced by Hyperball. Our pretraining experiments further show that more aggressive learning-rate decay can accelerate MuonH early in training but may impair its later performance. Thus, maintaining a constant angular velocity does not eliminate the learning-rate-scheduling problem; careful scheduling remains essential to realizing the potential of Hyperball-style optimizers. Our code is publicly available at https://github.com/mangocrazz/hyperball-may-not-be-a-free-lunch.", "arxiv_id": "2607.22444", "arxiv_url": "https://arxiv.org/abs/2607.22444", "authors": ["Yihao Xiao", "Jialong Sun", "Zitian Gao", "Zeming Wei", "Chutian Wang", "Ran Tao", "Jiaye Teng", "Bryan Dai"], "brief": "\u672c\u6587\u5206\u6790\u4e86 Hyperball \u98ce\u683c\u4f18\u5316\u5668\u5728\u5c3a\u5ea6\u4e0d\u53d8\u6df1\u5ea6\u7f51\u7edc\u4e2d\u7684\u4f18\u52bf\u6765\u6e90\uff0c\u63d0\u51fa\u89d2\u5411\u6709\u6548\u5b66\u4e60\u7387\uff0c\u5e76\u5c06\u66f4\u65b0\u5206\u89e3\u4e3a\u5f84\u5411\u4e0e\u5207\u5411\u6210\u5206\u3002\u5b9e\u9a8c\u8868\u660e\u5f84\u5411\u6210\u5206\u5bf9\u89d2\u5411\u6b65\u957f\u7684\u76f4\u63a5\u5f71\u54cd\u6709\u9650\uff0cMuonH \u4e0e MuonWD \u7684\u5dee\u5f02\u4e3b\u8981\u6765\u81ea\u6709\u6548\u6b65\u957f\u968f\u8bad\u7ec3\u6f14\u5316\uff0c\u800c\u975e Hyperball \u5e26\u6765\u7684\u5929\u7136\u66f4\u4f18\u66f4\u65b0\u65b9\u5411\uff1b\u5b66\u4e60\u7387\u8c03\u5ea6\u4ecd\u7136\u5173\u952e\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22444", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f18\u5316\u5668", "\u5b66\u4e60\u7387\u8c03\u5ea6", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22444v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hyperball May Not Be a Free Lunch", "tldr": "\u672c\u6587\u5206\u6790\u4e86 Hyperball \u98ce\u683c\u4f18\u5316\u5668\u5728\u5c3a\u5ea6\u4e0d\u53d8\u6df1\u5ea6\u7f51\u7edc\u4e2d\u7684\u4f18\u52bf\u6765\u6e90\uff0c\u63d0\u51fa\u89d2\u5411\u6709\u6548\u5b66\u4e60\u7387\uff0c\u5e76\u5c06\u66f4\u65b0\u5206\u89e3\u4e3a\u5f84\u5411\u4e0e\u5207\u5411\u6210\u5206\u3002\u5b9e\u9a8c\u8868\u660e\u5f84\u5411\u6210\u5206\u5bf9\u89d2\u5411\u6b65\u957f\u7684\u76f4\u63a5\u5f71\u54cd\u6709\u9650\uff0cMuonH \u4e0e MuonWD \u7684\u5dee\u5f02\u4e3b\u8981\u6765\u81ea\u6709\u6548\u6b65\u957f\u968f\u8bad\u7ec3\u6f14\u5316\uff0c\u800c\u975e Hyperball \u5e26\u6765\u7684\u5929\u7136\u66f4\u4f18\u66f4\u65b0\u65b9\u5411\uff1b\u5b66\u4e60\u7387\u8c03\u5ea6\u4ecd\u7136\u5173\u952e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This work addresses the generation of theoretical correlation matrices with prescribed sparsity patterns associated to graph structures. We propose a novel convex optimization framework in which an initial matrix is projected onto an elliptope under a positive semidefiniteness constraint. Several numerical schemes are implemented and compared. The problem falls within the broader class of matrix completion, where off-diagonal entries corresponding to absent edges are fixed to zero and diagonal entries are fixed to one. Beyond this structural constraint, the approach offers greater flexibility than existing methods by allowing control over the mean of the off-diagonal entry distribution, enabling the generation of correlation matrices that better reflect realistic data. This procedure is not designed to yield a uniform distribution over the feasible set; rather, it provides a principled and tunable way to construct correlation matrices suitable for benchmarking statistical methods for graphical model inference. Theoretical guarantees on the existence of solutions are established, both in the general setting and under the additional mean constraint. Simulation studies illustrate the properties of the generated matrices with respect to graph structure. The methodology is applied to two real-world datasets from neuroscience and finance, and a comparison with GAN-based correlation matrix generation is provided.", "arxiv_id": "2607.22436", "arxiv_url": "https://arxiv.org/abs/2607.22436", "authors": ["Ali Fakhar", "K{\u00e9}vin Polisano", "Ir{\u00e8}ne Gannaz", "Sophie Achard"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u51f8\u4f18\u5316\u7684\u76f8\u5173\u77e9\u9635\u751f\u6210\u65b9\u6cd5\uff0c\u5728\u7ed9\u5b9a\u56fe\u7a00\u758f\u7ed3\u6784\u4e0b\u5c06\u521d\u59cb\u77e9\u9635\u6295\u5f71\u5230\u6ee1\u8db3\u534a\u6b63\u5b9a\u548c\u5355\u4f4d\u5bf9\u89d2\u7ea6\u675f\u7684\u692diptope\u4e2d\u3002\u76f8\u6bd4\u5df2\u6709\u65b9\u6cd5\uff0c\u5b83\u8fd8\u80fd\u63a7\u5236\u975e\u5bf9\u89d2\u5143\u7d20\u5747\u503c\uff0c\u66f4\u9002\u5408\u751f\u6210\u7528\u4e8e\u56fe\u6a21\u578b\u63a8\u65ad\u57fa\u51c6\u6d4b\u8bd5\u7684\u53ef\u8c03\u76f8\u5173\u77e9\u9635\uff0c\u5e76\u5728\u4eff\u771f\u3001\u795e\u7ecf\u79d1\u5b66\u548c\u91d1\u878d\u6570\u636e\u4e0a\u9a8c\u8bc1\u4e86\u6548\u679c\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22436", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u51f8\u4f18\u5316", "\u76f8\u5173\u77e9\u9635", "\u56fe\u6a21\u578b", "\u77e9\u9635\u8865\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22436v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Graph-Based Correlation Matrix Generation: A Convex Optimization Approach", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u51f8\u4f18\u5316\u7684\u76f8\u5173\u77e9\u9635\u751f\u6210\u65b9\u6cd5\uff0c\u5728\u7ed9\u5b9a\u56fe\u7a00\u758f\u7ed3\u6784\u4e0b\u5c06\u521d\u59cb\u77e9\u9635\u6295\u5f71\u5230\u6ee1\u8db3\u534a\u6b63\u5b9a\u548c\u5355\u4f4d\u5bf9\u89d2\u7ea6\u675f\u7684\u692diptope\u4e2d\u3002\u76f8\u6bd4\u5df2\u6709\u65b9\u6cd5\uff0c\u5b83\u8fd8\u80fd\u63a7\u5236\u975e\u5bf9\u89d2\u5143\u7d20\u5747\u503c\uff0c\u66f4\u9002\u5408\u751f\u6210\u7528\u4e8e\u56fe\u6a21\u578b\u63a8\u65ad\u57fa\u51c6\u6d4b\u8bd5\u7684\u53ef\u8c03\u76f8\u5173\u77e9\u9635\uff0c\u5e76\u5728\u4eff\u771f\u3001\u795e\u7ecf\u79d1\u5b66\u548c\u91d1\u878d\u6570\u636e\u4e0a\u9a8c\u8bc1\u4e86\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Explainable AI (XAI) in creative practice can be less about technocentric explanation and more about enabling artists to inspect modify and debug models as part of making Yet largescale texttoimage diffusion systems are typically presented as opaque endtoend tools limiting this kind of material engagement We argue that even large models can function as creative materials when their internal structure is made visible and manipulable To support this we propose a handson approach to explainability centred on experimentation and intervention We instantiate this approach with a model bending and an interactive (inspection) interface integrated into ComfyUIs nodebased workflow including interactive layer selection and intervention controls Through qualitative and quantitative analysis of bending interventions in Stable Diffusion 15 we show how manipulating specific components of a diffusion pipeline produces relatively consistent families of visual effects allowing artists to build practical layerlevel intuition about how different parts of the model shape generated images", "arxiv_id": "2607.22428", "arxiv_url": "https://arxiv.org/abs/2607.22428", "authors": ["Ahmed M. Abuzuraiq", "Philippe Pasquier"], "brief": "\u672c\u6587\u5c06\u6269\u6563\u6a21\u578b\u89c6\u4e3a\u53ef\u88ab\u827a\u672f\u5bb6\u201c\u62c6\u7bb1\u201d\u548c\u64cd\u4f5c\u7684\u521b\u4f5c\u6750\u6599\uff0c\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5b9e\u8df5\u7684\u53ef\u89e3\u91ca\u65b9\u6cd5\uff0c\u8ba9\u7528\u6237\u5728 ComfyUI \u4e2d\u68c0\u67e5\u3001\u9009\u62e9\u5e76\u5e72\u9884\u6a21\u578b\u5c42\u3002\u57fa\u4e8e Stable Diffusion 1.5 \u7684\u5b9e\u9a8c\u8868\u660e\uff0c\u5bf9\u7279\u5b9a\u7ec4\u4ef6\u7684\u5f2f\u6298\u5e72\u9884\u4f1a\u4ea7\u751f\u76f8\u5bf9\u7a33\u5b9a\u7684\u89c6\u89c9\u6548\u679c\u65cf\uff0c\u6709\u52a9\u4e8e\u827a\u672f\u5bb6\u5f62\u6210\u5c42\u7ea7\u76f4\u89c9\u5e76\u8c03\u8bd5\u751f\u6210\u7ed3\u679c\u3002", "categories": ["cs.HC", "cs.AI", "cs.LG", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22428", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u53ef\u89e3\u91ca\u4eba\u5de5\u667a\u80fd", "\u4eba\u673a\u4ea4\u4e92", "\u751f\u6210\u827a\u672f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22428v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unboxing Diffusion Models for the Arts: Interactive Model Bending and Practice-Based Explainability", "tldr": "\u672c\u6587\u5c06\u6269\u6563\u6a21\u578b\u89c6\u4e3a\u53ef\u88ab\u827a\u672f\u5bb6\u201c\u62c6\u7bb1\u201d\u548c\u64cd\u4f5c\u7684\u521b\u4f5c\u6750\u6599\uff0c\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5b9e\u8df5\u7684\u53ef\u89e3\u91ca\u65b9\u6cd5\uff0c\u8ba9\u7528\u6237\u5728 ComfyUI \u4e2d\u68c0\u67e5\u3001\u9009\u62e9\u5e76\u5e72\u9884\u6a21\u578b\u5c42\u3002\u57fa\u4e8e Stable Diffusion 1.5 \u7684\u5b9e\u9a8c\u8868\u660e\uff0c\u5bf9\u7279\u5b9a\u7ec4\u4ef6\u7684\u5f2f\u6298\u5e72\u9884\u4f1a\u4ea7\u751f\u76f8\u5bf9\u7a33\u5b9a\u7684\u89c6\u89c9\u6548\u679c\u65cf\uff0c\u6709\u52a9\u4e8e\u827a\u672f\u5bb6\u5f62\u6210\u5c42\u7ea7\u76f4\u89c9\u5e76\u8c03\u8bd5\u751f\u6210\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sample retrieval tools can help composers find harmonically compatible material, but querying from a fixed reference sample becomes less informative as arrangements evolve and the harmonic context shifts with each musical decision. We present Reflector, an interactive audio workstation that tracks harmonic combinations as they accumulate on the composer\u0027s timeline and adapts retrieval as the arrangement develops. The system is organized around a fixed interval-class oracle: a hand-designed table of weights that scores how pitch-class content combines between sources. An encoder trained entirely on synthetic audio learns to approximate the oracle in a 128-dimensional embedding space, where dot products stand in for compatibility scores at interactive speed. As the composer arranges material on a multi-track timeline, a sweep-line analysis discovers co-sounding regions, computes oracle-weighted centroids, and retrieves against the composite harmonic identity of the session as it evolves. Session centroids projected into a navigable 3-D space reveal structural harmonic relations across the composer\u0027s body of work. This paper is a systems account: we give the design rationale for each architectural decision, characterize Reflector\u0027s behavior through intrinsic measurements on a working sample library, and describe the implementation. The characterization yields a central finding: the learned embedding preserves the kernel\u0027s pairwise judgments while covering the whole library, something the kernel cannot do when used directly as a retrieval rule, because the embedding\u0027s normalized geometry cannot express the degenerate solutions that direct scoring favors. The entire pipeline runs locally with no copyrighted training data. Reflector is free, and the training pipeline is open source.", "arxiv_id": "2607.22413", "arxiv_url": "https://arxiv.org/abs/2607.22413", "authors": ["Austin Rockman"], "brief": "\u672c\u6587\u63d0\u51fa Reflector\uff0c\u4e00\u4e2a\u9762\u5411\u91c7\u6837\u4f5c\u66f2\u7684\u4ea4\u4e92\u5f0f\u97f3\u9891\u5de5\u4f5c\u7ad9\uff0c\u4f1a\u968f\u7f16\u66f2\u65f6\u95f4\u7ebf\u4e2d\u7d20\u6750\u7684\u53e0\u52a0\u52a8\u6001\u8ffd\u8e2a\u548c\u58f0\u4e0a\u4e0b\u6587\uff0c\u5e76\u68c0\u7d22\u66f4\u548c\u8c10\u517c\u5bb9\u7684\u91c7\u6837\u3002\u7cfb\u7edf\u7528\u624b\u5de5\u8bbe\u8ba1\u7684\u97f3\u7a0b\u7c7b oracle \u751f\u6210\u5408\u6210\u8bad\u7ec3\u6570\u636e\uff0c\u8bad\u7ec3\u5d4c\u5165\u6a21\u578b\u4ee5\u4ea4\u4e92\u901f\u5ea6\u8fd1\u4f3c\u517c\u5bb9\u6027\u8bc4\u5206\uff1b\u5b9e\u9a8c\u8868\u660e\u8be5\u5d4c\u5165\u80fd\u4fdd\u7559\u6210\u5bf9\u548c\u58f0\u5224\u65ad\u5e76\u8986\u76d6\u5b8c\u6574\u7d20\u6750\u5e93\uff0c\u4e14\u5168\u6d41\u7a0b\u672c\u5730\u8fd0\u884c\u3001\u65e0\u9700\u7248\u6743\u8bad\u7ec3\u6570\u636e\u3002", "categories": ["cs.SD", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22413", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u9891\u68c0\u7d22", "\u97f3\u4e50\u751f\u6210", "\u8868\u793a\u5b66\u4e60", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22413v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reflector: Arrangement-Aware Harmonic Retrieval for Sample-Based Composition", "tldr": "\u672c\u6587\u63d0\u51fa Reflector\uff0c\u4e00\u4e2a\u9762\u5411\u91c7\u6837\u4f5c\u66f2\u7684\u4ea4\u4e92\u5f0f\u97f3\u9891\u5de5\u4f5c\u7ad9\uff0c\u4f1a\u968f\u7f16\u66f2\u65f6\u95f4\u7ebf\u4e2d\u7d20\u6750\u7684\u53e0\u52a0\u52a8\u6001\u8ffd\u8e2a\u548c\u58f0\u4e0a\u4e0b\u6587\uff0c\u5e76\u68c0\u7d22\u66f4\u548c\u8c10\u517c\u5bb9\u7684\u91c7\u6837\u3002\u7cfb\u7edf\u7528\u624b\u5de5\u8bbe\u8ba1\u7684\u97f3\u7a0b\u7c7b oracle \u751f\u6210\u5408\u6210\u8bad\u7ec3\u6570\u636e\uff0c\u8bad\u7ec3\u5d4c\u5165\u6a21\u578b\u4ee5\u4ea4\u4e92\u901f\u5ea6\u8fd1\u4f3c\u517c\u5bb9\u6027\u8bc4\u5206\uff1b\u5b9e\u9a8c\u8868\u660e\u8be5\u5d4c\u5165\u80fd\u4fdd\u7559\u6210\u5bf9\u548c\u58f0\u5224\u65ad\u5e76\u8986\u76d6\u5b8c\u6574\u7d20\u6750\u5e93\uff0c\u4e14\u5168\u6d41\u7a0b\u672c\u5730\u8fd0\u884c\u3001\u65e0\u9700\u7248\u6743\u8bad\u7ec3\u6570\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The renewed global focus on lunar exploration, driven by the prospect of in-situ resource utilization and a sustained human presence on the Moon, has created growing demand for accurate, large-scale characterization of the lunar surface. Although vast quantities of orbital remote-sensing data have been collected, scientific analysis and resource mapping remain fragmented by heterogeneous multiinstrument observations, sparse labels, and bespoke task-specific modelling workflows. Here we introduce LunarFM, a multimodal foundation model that learns a general representation of the lunar surface from diverse orbital measurements. LunarFM assimilates observations from six instruments across three lunar missions, mapping 18 input channels to a shared embedding space. We demonstrate that this embedding space supports a diverse range of downstream applications, including similarity search, few-shot resource mapping, mineral abundance regression, and geological unit classification, enabling efficient scientific investigation and resource-oriented analysis. We provide a machine-learning-ready dataset of co-registered multimodal observations spanning latitudes from 70\u00b0S to 70\u00b0N, a pretrained multimodal masked autoencoder, and a companion embedding dataset providing a joint 768-dimensional representation of lunar surface properties. All code and data are available at https://lunarfm.trillium.tech/", "arxiv_id": "2607.22408", "arxiv_url": "https://arxiv.org/abs/2607.22408", "authors": ["Marc Girona-Mata", "Jakob Gawlikowski", "Sumit Goski", "Gautier Bardi de Fourtou", "Valentin T. Bickel", "Ben Moseley", "Abigail Calzada-Diaz", "Sylvester Kaczmarek", "Ra\u00fal Ramos-Poll\u00e1n"], "brief": "\u672c\u6587\u63d0\u51fa LunarFM\uff0c\u4e00\u4e2a\u9762\u5411\u6708\u7403\u8868\u9762\u7684\u591a\u6a21\u6001\u57fa\u7840\u6a21\u578b\uff0c\u878d\u5408\u4e09\u4e2a\u6708\u7403\u4efb\u52a1\u4e2d\u516d\u79cd\u4eea\u5668\u768418\u4e2a\u9065\u611f\u901a\u9053\uff0c\u5b66\u4e60\u7edf\u4e00\u7684\u6708\u8868\u5d4c\u5165\u8868\u793a\u3002\u8be5\u8868\u793a\u53ef\u7528\u4e8e\u76f8\u4f3c\u6027\u641c\u7d22\u3001\u5c11\u6837\u672c\u8d44\u6e90\u5236\u56fe\u3001\u77ff\u7269\u4e30\u5ea6\u56de\u5f52\u548c\u5730\u8d28\u5355\u5143\u5206\u7c7b\uff0c\u5e76\u5f00\u6e90\u914d\u51c6\u6570\u636e\u96c6\u3001\u9884\u8bad\u7ec3\u6a21\u578b\u4e0e\u5d4c\u5165\u6570\u636e\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22408", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u57fa\u7840\u6a21\u578b", "\u9065\u611f", "\u6708\u7403\u63a2\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22408v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LunarFM: A Shared Multimodal Representation of the Moon\u0027s Surface", "tldr": "\u672c\u6587\u63d0\u51fa LunarFM\uff0c\u4e00\u4e2a\u9762\u5411\u6708\u7403\u8868\u9762\u7684\u591a\u6a21\u6001\u57fa\u7840\u6a21\u578b\uff0c\u878d\u5408\u4e09\u4e2a\u6708\u7403\u4efb\u52a1\u4e2d\u516d\u79cd\u4eea\u5668\u768418\u4e2a\u9065\u611f\u901a\u9053\uff0c\u5b66\u4e60\u7edf\u4e00\u7684\u6708\u8868\u5d4c\u5165\u8868\u793a\u3002\u8be5\u8868\u793a\u53ef\u7528\u4e8e\u76f8\u4f3c\u6027\u641c\u7d22\u3001\u5c11\u6837\u672c\u8d44\u6e90\u5236\u56fe\u3001\u77ff\u7269\u4e30\u5ea6\u56de\u5f52\u548c\u5730\u8d28\u5355\u5143\u5206\u7c7b\uff0c\u5e76\u5f00\u6e90\u914d\u51c6\u6570\u636e\u96c6\u3001\u9884\u8bad\u7ec3\u6a21\u578b\u4e0e\u5d4c\u5165\u6570\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We consider the problem of learning from a single finite trajectory of an ergodic stochastic dynamical system. More precisely, we study discrete-time autonomous stochastic systems defining time-homogeneous Markov processes. We first focus on estimating the optimal one-step prediction function by nonlinear least squares, and derive high-probability guarantees measured with respect to the invariant measure of the process. These results make explicit how the non-independent and non-identically distributed nature of trajectory data modifies the classical statistical learning analysis. We then extend the framework to higher-order systems and finite-state spaces. Finally, we show that the same least squares and concentration arguments naturally extend to learning Koopman operators. Our approach combines tools from statistical learning theory and quantitative ergodic theory for Markov chains. It relies, in particular, on a concentration inequality for Hilbert-space-valued additive functionals of uniformly geometrically ergodic Markov chains.", "arxiv_id": "2607.22399", "arxiv_url": "https://arxiv.org/abs/2607.22399", "authors": ["Oleksii Kachaiev", "Silvia Villa", "Lorenzo Rosasco"], "brief": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u4ece\u904d\u5386\u968f\u673a\u52a8\u529b\u7cfb\u7edf\u7684\u4e00\u6761\u6709\u9650\u8f68\u8ff9\u4e2d\u5b66\u4e60\u6a21\u578b\uff0c\u91cd\u70b9\u7528\u975e\u7ebf\u6027\u6700\u5c0f\u4e8c\u4e58\u4f30\u8ba1\u6700\u4f18\u4e00\u6b65\u9884\u6d4b\u51fd\u6570\uff0c\u5e76\u7ed9\u51fa\u76f8\u5bf9\u4e8e\u4e0d\u53d8\u6d4b\u5ea6\u7684\u9ad8\u6982\u7387\u6cdb\u5316\u4fdd\u8bc1\u3002\u7ed3\u679c\u523b\u753b\u4e86\u8f68\u8ff9\u6570\u636e\u975e\u72ec\u7acb\u540c\u5206\u5e03\u5bf9\u7edf\u8ba1\u5b66\u4e60\u5206\u6790\u7684\u5f71\u54cd\uff0c\u5e76\u6269\u5c55\u5230\u9ad8\u9636\u7cfb\u7edf\u3001\u6709\u9650\u72b6\u6001\u7a7a\u95f4\u548c Koopman \u7b97\u5b50\u5b66\u4e60\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22399", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7edf\u8ba1\u5b66\u4e60", "\u52a8\u529b\u7cfb\u7edf", "\u9a6c\u5c14\u53ef\u592b\u94fe", "Koopman\u7b97\u5b50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22399v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Ergodic Dynamical Systems from a Finite Trajectory", "tldr": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u4ece\u904d\u5386\u968f\u673a\u52a8\u529b\u7cfb\u7edf\u7684\u4e00\u6761\u6709\u9650\u8f68\u8ff9\u4e2d\u5b66\u4e60\u6a21\u578b\uff0c\u91cd\u70b9\u7528\u975e\u7ebf\u6027\u6700\u5c0f\u4e8c\u4e58\u4f30\u8ba1\u6700\u4f18\u4e00\u6b65\u9884\u6d4b\u51fd\u6570\uff0c\u5e76\u7ed9\u51fa\u76f8\u5bf9\u4e8e\u4e0d\u53d8\u6d4b\u5ea6\u7684\u9ad8\u6982\u7387\u6cdb\u5316\u4fdd\u8bc1\u3002\u7ed3\u679c\u523b\u753b\u4e86\u8f68\u8ff9\u6570\u636e\u975e\u72ec\u7acb\u540c\u5206\u5e03\u5bf9\u7edf\u8ba1\u5b66\u4e60\u5206\u6790\u7684\u5f71\u54cd\uff0c\u5e76\u6269\u5c55\u5230\u9ad8\u9636\u7cfb\u7edf\u3001\u6709\u9650\u72b6\u6001\u7a7a\u95f4\u548c Koopman \u7b97\u5b50\u5b66\u4e60\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frozen EEG encoders proliferate; per-model fine-tune defaults do not scale. We present Nimbus Personalizer: one contract encode to Bayesian head to BrainState (optional affine mid-tier) that sits on heterogeneous frozen trunks without a new personalization stack per architecture. Thesis (systems): the contribution is the trunk-agnostic API - not LDA-on-embeddings as an ML novelty - so OEMs integrate once and swap trunks. Evidence: the same surface runs on five classical trunks EEGNet, Shallow, Deep, Conformer, ATCNet x four MI datasets (18 cells) and on a foundation encoder (REVE) under the same Personalizer. Where embedding capacity exists, the head is a cheap default mid-point versus warm-start fine-tune or PEFT, costing orders of magnitude less adaptation wall time while recovering much of the fine-tune accuracy gain; calibration-only-when-clean holds in 12/18 cells. Head gains are supporting evidence that the API is useful where capacity exists. Subject-level confidence intervals identify the clearest dataset and span zero elsewhere. All results are exploratory (subject-level bootstrap, no confirmatory tests); the decision logic for when to escalate adaptation is addressed in our companion work on the control layer.", "arxiv_id": "2607.22397", "arxiv_url": "https://arxiv.org/abs/2607.22397", "authors": ["Sergey Musienko"], "brief": "\u8bba\u6587\u63d0\u51fa Nimbus Personalizer\uff0c\u4e00\u4e2a\u9762\u5411\u51bb\u7ed3 EEG \u7f16\u7801\u5668\u548c\u57fa\u7840\u6a21\u578b\u7684\u901a\u7528\u4e2a\u6027\u5316 API\uff0c\u7528\u7edf\u4e00\u7684\u201c\u7f16\u7801\u5668\u5230\u8d1d\u53f6\u65af\u5934/BrainState\u201d\u63a5\u53e3\u9002\u914d\u4e0d\u540c\u4e3b\u5e72\uff0c\u907f\u514d\u6bcf\u4e2a\u67b6\u6784\u5355\u72ec\u7ef4\u62a4\u5fae\u8c03\u6d41\u7a0b\u3002\u5728\u591a\u79cd\u7ecf\u5178 EEG \u4e3b\u5e72\u30014\u4e2a\u8fd0\u52a8\u60f3\u8c61\u6570\u636e\u96c6\u4ee5\u53ca\u4e00\u4e2a\u57fa\u7840\u7f16\u7801\u5668\u4e0a\u63a2\u7d22\u9a8c\u8bc1\uff0c\u663e\u793a\u5728\u6709\u8db3\u591f\u5d4c\u5165\u80fd\u529b\u65f6\u53ef\u7528\u4f4e\u6210\u672c\u9002\u914d\u6062\u590d\u76f8\u5f53\u4e00\u90e8\u5206\u5fae\u8c03\u589e\u76ca\uff0c\u4f46\u7ed3\u679c\u4ecd\u5c5e\u63a2\u7d22\u6027\u4e14\u90e8\u5206\u6570\u636e\u96c6\u7f6e\u4fe1\u533a\u95f4\u8de8\u96f6\u3002", "categories": ["cs.HC", "cs.LG", "q-bio.NC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22397", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8111\u673a\u63a5\u53e3", "\u4e2a\u6027\u5316", "\u57fa\u7840\u6a21\u578b", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22397v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Universal BCI Personalization: One API for Frozen EEG Trunks and Foundation Models", "tldr": "\u8bba\u6587\u63d0\u51fa Nimbus Personalizer\uff0c\u4e00\u4e2a\u9762\u5411\u51bb\u7ed3 EEG \u7f16\u7801\u5668\u548c\u57fa\u7840\u6a21\u578b\u7684\u901a\u7528\u4e2a\u6027\u5316 API\uff0c\u7528\u7edf\u4e00\u7684\u201c\u7f16\u7801\u5668\u5230\u8d1d\u53f6\u65af\u5934/BrainState\u201d\u63a5\u53e3\u9002\u914d\u4e0d\u540c\u4e3b\u5e72\uff0c\u907f\u514d\u6bcf\u4e2a\u67b6\u6784\u5355\u72ec\u7ef4\u62a4\u5fae\u8c03\u6d41\u7a0b\u3002\u5728\u591a\u79cd\u7ecf\u5178 EEG \u4e3b\u5e72\u30014\u4e2a\u8fd0\u52a8\u60f3\u8c61\u6570\u636e\u96c6\u4ee5\u53ca\u4e00\u4e2a\u57fa\u7840\u7f16\u7801\u5668\u4e0a\u63a2\u7d22\u9a8c\u8bc1\uff0c\u663e\u793a\u5728\u6709\u8db3\u591f\u5d4c\u5165\u80fd\u529b\u65f6\u53ef\u7528\u4f4e\u6210\u672c\u9002\u914d\u6062\u590d\u76f8\u5f53\u4e00\u90e8\u5206\u5fae\u8c03\u589e\u76ca\uff0c\u4f46\u7ed3\u679c\u4ecd\u5c5e\u63a2\u7d22\u6027\u4e14\u90e8\u5206\u6570\u636e\u96c6\u7f6e\u4fe1\u533a\u95f4\u8de8\u96f6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Curvature notions on graphs, particularly Ollivier-Ricci and Forman, have emerged as powerful tools for addressing fundamental issues in Graph Neural Networks (GNNs) such as oversmoothing and oversquashing, but rely almost exclusively on local edge-level comparisons and therefore fail to certify how information actually propagates over long distances. We introduce Entropic Curvature, a global, transport-based curvature obtained by extending the Lott-Sturm-Villani framework to graphs through the displacement convexity of entropy along Wasserstein geodesics. We define a tractable Weak Entropic Curvature proxy that lower-bounds the global entropic curvature, and from it derive (i) a Poincare-type inequality controlling oversmoothing, (ii) a transport-entropy generalization bound, and (iii) an expansion paradox proving that sparsity, strong spectral expansion, and positive entropic curvature cannot coexist in large graphs, unifying oversmoothing and oversquashing as opposite ends of a single curvature spectrum. We translate the theory into three practical mechanisms, the E-Gate aggregator, the ENT structural encoding, and Midpoint-Completion Rewiring (MCR), and benchmark them against SDRF, FoSR, BORF, LCP, and Graph Ricci Flow on six node-classification benchmarks, and graph-classification.", "arxiv_id": "2607.22381", "arxiv_url": "https://arxiv.org/abs/2607.22381", "authors": ["Rachid Caich", "Yassine Abbahaddou"], "brief": "\u8bba\u6587\u63d0\u51fa\u56fe\u4e0a\u7684\u71b5\u66f2\u7387\uff0c\u5c06\u6700\u4f18\u4f20\u8f93\u4e0e\u71b5\u7684\u4f4d\u79fb\u51f8\u6027\u7528\u4e8e\u523b\u753b\u5168\u5c40\u4fe1\u606f\u4f20\u64ad\uff0c\u5e76\u7ed9\u51fa\u53ef\u8ba1\u7b97\u7684\u5f31\u71b5\u66f2\u7387\u4e0b\u754c\u3002\u57fa\u4e8e\u8be5\u7406\u8bba\u63a8\u5bfc\u4e86\u63a7\u5236\u8fc7\u5e73\u6ed1\u3001\u6cdb\u5316\u4e0e\u8fc7\u538b\u7f29/\u6269\u5f20\u5173\u7cfb\u7684\u7ed3\u679c\uff0c\u5e76\u8bbe\u8ba1 E-Gate\u3001ENT \u7f16\u7801\u548c MCR \u91cd\u8fde\uff0c\u5728\u591a\u9879\u56fe\u5206\u7c7b\u4e0e\u8282\u70b9\u5206\u7c7b\u57fa\u51c6\u4e0a\u4e0e\u73b0\u6709\u66f2\u7387/\u91cd\u8fde\u65b9\u6cd5\u6bd4\u8f83\u3002", "categories": ["cs.LG", "cs.SI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22381", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u51e0\u4f55\u6df1\u5ea6\u5b66\u4e60", "\u6700\u4f18\u4f20\u8f93", "\u8fc7\u5e73\u6ed1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22381v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Local-Global Geometric Insights for Graph Neural Networks via Entropic Curvature", "tldr": "\u8bba\u6587\u63d0\u51fa\u56fe\u4e0a\u7684\u71b5\u66f2\u7387\uff0c\u5c06\u6700\u4f18\u4f20\u8f93\u4e0e\u71b5\u7684\u4f4d\u79fb\u51f8\u6027\u7528\u4e8e\u523b\u753b\u5168\u5c40\u4fe1\u606f\u4f20\u64ad\uff0c\u5e76\u7ed9\u51fa\u53ef\u8ba1\u7b97\u7684\u5f31\u71b5\u66f2\u7387\u4e0b\u754c\u3002\u57fa\u4e8e\u8be5\u7406\u8bba\u63a8\u5bfc\u4e86\u63a7\u5236\u8fc7\u5e73\u6ed1\u3001\u6cdb\u5316\u4e0e\u8fc7\u538b\u7f29/\u6269\u5f20\u5173\u7cfb\u7684\u7ed3\u679c\uff0c\u5e76\u8bbe\u8ba1 E-Gate\u3001ENT \u7f16\u7801\u548c MCR \u91cd\u8fde\uff0c\u5728\u591a\u9879\u56fe\u5206\u7c7b\u4e0e\u8282\u70b9\u5206\u7c7b\u57fa\u51c6\u4e0a\u4e0e\u73b0\u6709\u66f2\u7387/\u91cd\u8fde\u65b9\u6cd5\u6bd4\u8f83\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Feature-attribution methods assign scores relating input variables to a model\u0027s output, but do not by themselves characterize how explicitly defined interaction operators compose across its intermediate layers. We introduce \\emph{interior interpretability}, a propagation-based perspective on internal model organization, and instantiate it for tabular Transformers using attention rollout. We interpret rollout as a row-stochastic operator encoding attention-mediated propagation between feature tokens. By applying classical Doeblin--Dobrushin contraction theory, we show that a rollout operator with a small Dobrushin coefficient is quantitatively close to a rank-one stochastic matrix whose common row is determined by its normalized column sums. This result gives a structural interpretation to the corresponding rollout propagation profile. In Transformers trained for metabolomic age prediction, the measured rollout contraction strengthens with depth. Trained and randomly initialized models also exhibit different propagation profiles, although the present experiments do not establish the predictive relevance of individual rollout-ranked variables. Exploratory comparisons with PCA and GradientExplainer approximations to SHAP reveal localized agreement among highly ranked variables but weak agreement across complete rankings. Attention rollout is therefore used here as a diagnostic of attention-mediated propagation, not as a causal explanation or faithful attribution of the complete Transformer.", "arxiv_id": "2607.22367", "arxiv_url": "https://arxiv.org/abs/2607.22367", "authors": ["Umberto Biccari", "Qian Huang", "Enrique Zuazua"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u5185\u90e8\u53ef\u89e3\u91ca\u6027\u201d\u89c6\u89d2\uff0c\u7528\u6ce8\u610f\u529b rollout \u5206\u6790\u8868\u683c Transformer \u4e2d\u7279\u5f81 token \u5982\u4f55\u5728\u5c42\u95f4\u4f20\u64ad\uff0c\u5e76\u7528 Doeblin\u2013Dobrushin \u6536\u7f29\u7406\u8bba\u89e3\u91ca rollout \u7b97\u5b50\u7684\u7ed3\u6784\u3002\u5f53 Dobrushin \u7cfb\u6570\u8f83\u5c0f\u65f6\uff0crollout \u63a5\u8fd1\u79e9\u4e00\u968f\u673a\u77e9\u9635\uff1b\u5728\u4ee3\u8c22\u7ec4\u5e74\u9f84\u9884\u6d4b\u5b9e\u9a8c\u4e2d\uff0c\u4f20\u64ad\u6536\u7f29\u968f\u6df1\u5ea6\u589e\u5f3a\uff0c\u8bad\u7ec3\u6a21\u578b\u4e0e\u968f\u673a\u6a21\u578b\u5448\u73b0\u4e0d\u540c\u4f20\u64ad\u6a21\u5f0f\u3002\u4f5c\u8005\u5f3a\u8c03\u8be5\u65b9\u6cd5\u662f\u6ce8\u610f\u529b\u4f20\u64ad\u8bca\u65ad\u5de5\u5177\uff0c\u800c\u975e\u5b8c\u6574\u56e0\u679c\u5f52\u56e0\u6216\u5fe0\u5b9e\u7279\u5f81\u89e3\u91ca\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22367", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "Transformer", "\u6ce8\u610f\u529b\u673a\u5236", "\u8868\u683c\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22367v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Interior interpretability with attention rollout: contraction and propagation profiles in Transformers", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u5185\u90e8\u53ef\u89e3\u91ca\u6027\u201d\u89c6\u89d2\uff0c\u7528\u6ce8\u610f\u529b rollout \u5206\u6790\u8868\u683c Transformer \u4e2d\u7279\u5f81 token \u5982\u4f55\u5728\u5c42\u95f4\u4f20\u64ad\uff0c\u5e76\u7528 Doeblin\u2013Dobrushin \u6536\u7f29\u7406\u8bba\u89e3\u91ca rollout \u7b97\u5b50\u7684\u7ed3\u6784\u3002\u5f53 Dobrushin \u7cfb\u6570\u8f83\u5c0f\u65f6\uff0crollout \u63a5\u8fd1\u79e9\u4e00\u968f\u673a\u77e9\u9635\uff1b\u5728\u4ee3\u8c22\u7ec4\u5e74\u9f84\u9884\u6d4b\u5b9e\u9a8c\u4e2d\uff0c\u4f20\u64ad\u6536\u7f29\u968f\u6df1\u5ea6\u589e\u5f3a\uff0c\u8bad\u7ec3\u6a21\u578b\u4e0e\u968f\u673a\u6a21\u578b\u5448\u73b0\u4e0d\u540c\u4f20\u64ad\u6a21\u5f0f\u3002\u4f5c\u8005\u5f3a\u8c03\u8be5\u65b9\u6cd5\u662f\u6ce8\u610f\u529b\u4f20\u64ad\u8bca\u65ad\u5de5\u5177\uff0c\u800c\u975e\u5b8c\u6574\u56e0\u679c\u5f52\u56e0\u6216\u5fe0\u5b9e\u7279\u5f81\u89e3\u91ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study information bottlenecks in modern deep-learning architectures -- RNNs, softmax transformers, linear-attention transformers and state-space models -- through the lens of the indexing primitive. In this primitive, the input consists of $n$ bits and one integer $i$ from $1$ to $n$ called the index, and the output equals the value of the $i$-th bit. We introduce causal complexity for masked architectures. We show that architectures with low causal complexity cannot solve the indexing primitive in any constant number of layers when the index appears at the end of the input. In particular, this limitation applies to low-parameter RNNs, SSMs and masked linear-attention transformers. In contrast, small softmax transformers can solve it in one layer, while non-masked linear-attention transformers can solve it in 2, which separates them from their masked counterparts. In turn, when the index appears at the beginning, we show that small RNNs are capable of solving this task in 1 layer, while all the other architectures require 2. All our impossibility results are unconditional and apply even to models that employ infinite-precision real arithmetic. Moreover, experiments for up to $n=64$ qualitatively align with our theory: configurations with low-parameter theoretical solutions learn the indexing task easily, while configurations that do not admit such theoretical solutions struggle to learn as the sequence length grows.", "arxiv_id": "2607.22361", "arxiv_url": "https://arxiv.org/abs/2607.22361", "authors": ["Alexander Kozachinskiy", "Vicente Opazo", "Felipe Urrutia"], "brief": "\u672c\u6587\u7528\u201c\u7d22\u5f15\u201d\u4efb\u52a1\u5206\u6790 RNN\u3001Transformer\u3001\u7ebf\u6027\u6ce8\u610f\u529b\u548c\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u4e2d\u7684\u4fe1\u606f\u74f6\u9888\uff0c\u5e76\u63d0\u51fa\u7528\u4e8e\u63a9\u7801\u67b6\u6784\u7684\u56e0\u679c\u590d\u6742\u5ea6\u6982\u5ff5\u3002\u7406\u8bba\u8bc1\u660e\u4f4e\u56e0\u679c\u590d\u6742\u5ea6\u6a21\u578b\u5728\u7d22\u5f15\u4f4d\u4e8e\u8f93\u5165\u672b\u5c3e\u65f6\u65e0\u6cd5\u7528\u5e38\u6570\u5c42\u89e3\u51b3\u8be5\u4efb\u52a1\uff0c\u800c softmax Transformer \u548c\u975e\u63a9\u7801\u7ebf\u6027\u6ce8\u610f\u529b\u53ef\u9ad8\u6548\u89e3\u51b3\uff1b\u5b9e\u9a8c\u7ed3\u679c\u4e0e\u7406\u8bba\u8d8b\u52bf\u4e00\u81f4\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22361", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7406\u8bba\u5206\u6790", "Transformer", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "\u4fe1\u606f\u74f6\u9888"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22361v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Indexing: the Beginning and the End", "tldr": "\u672c\u6587\u7528\u201c\u7d22\u5f15\u201d\u4efb\u52a1\u5206\u6790 RNN\u3001Transformer\u3001\u7ebf\u6027\u6ce8\u610f\u529b\u548c\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u4e2d\u7684\u4fe1\u606f\u74f6\u9888\uff0c\u5e76\u63d0\u51fa\u7528\u4e8e\u63a9\u7801\u67b6\u6784\u7684\u56e0\u679c\u590d\u6742\u5ea6\u6982\u5ff5\u3002\u7406\u8bba\u8bc1\u660e\u4f4e\u56e0\u679c\u590d\u6742\u5ea6\u6a21\u578b\u5728\u7d22\u5f15\u4f4d\u4e8e\u8f93\u5165\u672b\u5c3e\u65f6\u65e0\u6cd5\u7528\u5e38\u6570\u5c42\u89e3\u51b3\u8be5\u4efb\u52a1\uff0c\u800c softmax Transformer \u548c\u975e\u63a9\u7801\u7ebf\u6027\u6ce8\u610f\u529b\u53ef\u9ad8\u6548\u89e3\u51b3\uff1b\u5b9e\u9a8c\u7ed3\u679c\u4e0e\u7406\u8bba\u8d8b\u52bf\u4e00\u81f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In recent years, the growing complexity of last-mile pickup operations has increased the need for fast and accurate decision-making on logistics platforms. This challenge is fundamentally driven by two key and tightly coupled decision-making processes: order dispatching and routing. Solving them separately overlooks their interdependence, while fully end-to-end learning can be unstable and costly on large, variable-scale instances due to sparse rewards. To solve this problem, we propose an integrated optimization framework which couples a learned routing oracle with real-time dispatching heuristics. For the routing subproblem, we develop a Dynamic-Residual Graph Attention Network encoder with a Look-Ahead Courier-Personalized decoder. For the dispatching subproblem, we develop a routing-oracle-guided dispatching heuristic with local search, where the oracle provides near-optimal solutions to select candidate couriers while retaining real-time scalability. Extensive experiments on real-world datasets from Cainiao Logistics are used to test the performance of our approach, including an offline evaluation and an online rolling-horizon simulation. The experimental results show that our approach outperforms other benchmarks regarding solution quality and solving time, indicating it can effectively support logistics companies in solving real-time and large-scale last-mile pickup problems.", "arxiv_id": "2607.22356", "arxiv_url": "https://arxiv.org/abs/2607.22356", "authors": ["Yida Xu", "Zhaofang Mao", "Yuheng Miao", "Jiaxin Zhang", "Yiting Sun"], "brief": "\u8bba\u6587\u9762\u5411\u672b\u7aef\u63fd\u6536\u4e2d\u7684\u8ba2\u5355\u6d3e\u53d1\u4e0e\u8def\u5f84\u89c4\u5212\u8026\u5408\u95ee\u9898\uff0c\u63d0\u51fa\u5c06\u5b66\u4e60\u578b\u8def\u5f84\u89c4\u5212\u9884\u8a00\u673a\u4e0e\u5b9e\u65f6\u6d3e\u53d1\u542f\u53d1\u5f0f\u7ed3\u5408\u7684\u96c6\u6210\u4f18\u5316\u6846\u67b6\u3002\u57fa\u4e8e\u771f\u5b9e\u83dc\u9e1f\u7269\u6d41\u6570\u636e\u7684\u79bb\u7ebf\u8bc4\u4f30\u548c\u5728\u7ebf\u6eda\u52a8\u4eff\u771f\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u5728\u89e3\u8d28\u91cf\u548c\u6c42\u89e3\u65f6\u95f4\u4e0a\u5747\u4f18\u4e8e\u591a\u79cd\u57fa\u7ebf\uff0c\u66f4\u9002\u5408\u5927\u89c4\u6a21\u5b9e\u65f6\u7269\u6d41\u573a\u666f\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22356", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u7ec4\u5408\u4f18\u5316", "\u7269\u6d41\u8c03\u5ea6", "\u56fe\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22356v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Integrated Order Dispatching and Routing for Last-Mile Pickup via Deep Reinforcement Learning", "tldr": "\u8bba\u6587\u9762\u5411\u672b\u7aef\u63fd\u6536\u4e2d\u7684\u8ba2\u5355\u6d3e\u53d1\u4e0e\u8def\u5f84\u89c4\u5212\u8026\u5408\u95ee\u9898\uff0c\u63d0\u51fa\u5c06\u5b66\u4e60\u578b\u8def\u5f84\u89c4\u5212\u9884\u8a00\u673a\u4e0e\u5b9e\u65f6\u6d3e\u53d1\u542f\u53d1\u5f0f\u7ed3\u5408\u7684\u96c6\u6210\u4f18\u5316\u6846\u67b6\u3002\u57fa\u4e8e\u771f\u5b9e\u83dc\u9e1f\u7269\u6d41\u6570\u636e\u7684\u79bb\u7ebf\u8bc4\u4f30\u548c\u5728\u7ebf\u6eda\u52a8\u4eff\u771f\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u5728\u89e3\u8d28\u91cf\u548c\u6c42\u89e3\u65f6\u95f4\u4e0a\u5747\u4f18\u4e8e\u591a\u79cd\u57fa\u7ebf\uff0c\u66f4\u9002\u5408\u5927\u89c4\u6a21\u5b9e\u65f6\u7269\u6d41\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The speed of sound in tissue is a prerequisite for well-focused imaging and has diagnostic value, but recovering it from raw pulse-echo channel data is fundamentally a nonlinear inverse problem. Learned solvers are fast yet label hungry. Simulated sound-speed labels are expensive, while abundant real channel data is unlabeled. We propose IQ-JEPA to exploit both data types. An encoder is pretrained without labels to predict the latent representation of masked in-phase and quadrature (IQ) regions from visible context, then fine-tuned on simulated maps. Sound speed appears in the IQ signal as a phase difference, invariant to the constant phase offset. The encoder is a Hermitian vision transformer that operates on the complex signal directly. Its attention is equivariant to that phase and its conjugate-product feed-forward is invariant to it, so the encoder reads a quantity analogous to the one classical coherence methods use. On 79,293 Fullwave 2.5 simulations at 2.5 MHz, pretraining on the 63,435 unlabeled acquisitions reaches 15.60 m/s at 10,000 labels. This is a roughly threefold gain in label efficiency over supervised training, growing to over fourfold at 1,000 labels. It is about 2.2x below an InversionNet baseline, and 8.71 m/s at full labels. The gain still grows with more unlabeled pretraining data. Our comparisons point to self-supervision as the dominant factor. The same encoder transfers. Its frozen features expose sound speed and attenuation, and cross-distribution pretraining between layered and abdominal phantoms costs little accuracy. We see this as a first step toward a foundation model for quantitative ultrasound.", "arxiv_id": "2607.22351", "arxiv_url": "https://arxiv.org/abs/2607.22351", "authors": ["Masashi Sode", "Gianmarco Pinton"], "brief": "\u8bba\u6587\u63d0\u51fa IQ-JEPA\uff0c\u7528\u81ea\u76d1\u7763\u8054\u5408\u5d4c\u5165\u9884\u6d4b\u4ece\u672a\u6807\u6ce8\u8d85\u58f0 IQ \u6570\u636e\u4e2d\u9884\u8bad\u7ec3\uff0c\u518d\u7528\u5c11\u91cf\u4eff\u771f\u6807\u7b7e\u5fae\u8c03\u4ee5\u4f30\u8ba1\u7ec4\u7ec7\u58f0\u901f\u548c\u8870\u51cf\u3002\u5176\u57fa\u4e8e\u590d\u6570\u4fe1\u53f7\u7684 Hermitian Vision Transformer \u5229\u7528\u76f8\u4f4d\u4e0d\u53d8/\u7b49\u53d8\u7ed3\u6784\uff0c\u5728\u58f0\u901f\u4f30\u8ba1\u4e0a\u76f8\u6bd4\u7eaf\u76d1\u7763\u8bad\u7ec3\u663e\u8457\u63d0\u5347\u6807\u7b7e\u6548\u7387\uff0c1\u4e07\u6807\u7b7e\u7ea6\u8fbe 15.60 m/s \u8bef\u5dee\uff0c\u4f4e\u6807\u7b7e\u4e0b\u63d0\u5347\u53ef\u8d85\u8fc7\u56db\u500d\u3002", "categories": ["cs.LG", "physics.med-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22351", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u533b\u5b66\u5f71\u50cf", "\u89c6\u89c9Transformer", "\u8d85\u58f0\u6210\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22351v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "IQ-JEPA: A Joint-Embedding Predictive Architecture with a Hermitian Vision Transformer for Sound Speed and Attenuation Estimation from Ultrasound IQ Data", "tldr": "\u8bba\u6587\u63d0\u51fa IQ-JEPA\uff0c\u7528\u81ea\u76d1\u7763\u8054\u5408\u5d4c\u5165\u9884\u6d4b\u4ece\u672a\u6807\u6ce8\u8d85\u58f0 IQ \u6570\u636e\u4e2d\u9884\u8bad\u7ec3\uff0c\u518d\u7528\u5c11\u91cf\u4eff\u771f\u6807\u7b7e\u5fae\u8c03\u4ee5\u4f30\u8ba1\u7ec4\u7ec7\u58f0\u901f\u548c\u8870\u51cf\u3002\u5176\u57fa\u4e8e\u590d\u6570\u4fe1\u53f7\u7684 Hermitian Vision Transformer \u5229\u7528\u76f8\u4f4d\u4e0d\u53d8/\u7b49\u53d8\u7ed3\u6784\uff0c\u5728\u58f0\u901f\u4f30\u8ba1\u4e0a\u76f8\u6bd4\u7eaf\u76d1\u7763\u8bad\u7ec3\u663e\u8457\u63d0\u5347\u6807\u7b7e\u6548\u7387\uff0c1\u4e07\u6807\u7b7e\u7ea6\u8fbe 15.60 m/s \u8bef\u5dee\uff0c\u4f4e\u6807\u7b7e\u4e0b\u63d0\u5347\u53ef\u8d85\u8fc7\u56db\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The development of effective urban climate adaptation strategies requires comprehensive spatial information on rooftops and buildings, since such information underpins the assessment of ecosystem services provided by green infrastructure, particularly for urban heat island (UHI) mitigation. Although green roofs are widely acknowledged as a promising measure for improving urban thermal comfort, most existing research maps either current green rooftops or rooftops with greening potential, but not both. This study presents a modified deep convolutional neural network rooftop classification framework based on Roofpedia, developed by the Urban Analytics Lab at the National University of Singapore. The proposed model combines high resolution aerial imagery with rooftop slope information derived from a digital surface model and relies entirely on publicly available Swisstopo datasets: SWISSIMAGE orthophotos, swissSURFACE3D elevation data, and swissTLM3D building footprints. Applied to Bern, Switzerland, the model labels rooftops into four categories: existing green roofs, rooftops suitable for green roof installation, rooftops with solar panels, and flat rooftops unsuitable for greening. The framework identifies realistic opportunities for green roof expansion and supplies urban planners with evidence-based information for green infrastructure deployment in Bern and other Swiss cities. Because it is fully open source, the framework is transferable to cities worldwide.", "arxiv_id": "2607.22342", "arxiv_url": "https://arxiv.org/abs/2607.22342", "authors": ["Htet Yamin Ko Ko"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u6df1\u5ea6\u5377\u79ef\u7f51\u7edc\u7684\u56db\u5206\u7c7b\u5c4b\u9876\u8bc6\u522b\u6846\u67b6\uff0c\u7ed3\u5408\u745e\u58eb\u516c\u5f00\u822a\u62cd\u5f71\u50cf\u3001DSM\u5761\u5ea6\u4fe1\u606f\u548c\u5efa\u7b51\u8f6e\u5ed3\u6570\u636e\uff0c\u533a\u5206\u73b0\u6709\u7eff\u5c4b\u9876\u3001\u9002\u5408\u6539\u9020\u5c4b\u9876\u3001\u592a\u9633\u80fd\u5c4b\u9876\u548c\u4e0d\u9002\u5408\u7eff\u5316\u7684\u5e73\u5c4b\u9876\u3002\u8be5\u65b9\u6cd5\u5728\u4f2f\u5c14\u5c3c\u9a8c\u8bc1\uff0c\u53ef\u4e3a\u7eff\u5c4b\u9876\u6269\u5c55\u548c\u57ce\u5e02\u70ed\u5c9b\u7f13\u89e3\u89c4\u5212\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u7684\u7a7a\u95f4\u8bc1\u636e\uff0c\u5e76\u56e0\u5b8c\u5168\u5f00\u6e90\u800c\u5177\u5907\u8de8\u57ce\u5e02\u8fc1\u79fb\u6f5c\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22342", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9065\u611f", "\u6df1\u5ea6\u5b66\u4e60", "\u57ce\u5e02\u89c4\u5212", "\u7eff\u8272\u57fa\u7840\u8bbe\u65bd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22342v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Binary Rooftop Mapping: A Four-Class Deep Learning Framework for Green Roof Potential Assessment from Open Swiss Geospatial Data", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u6df1\u5ea6\u5377\u79ef\u7f51\u7edc\u7684\u56db\u5206\u7c7b\u5c4b\u9876\u8bc6\u522b\u6846\u67b6\uff0c\u7ed3\u5408\u745e\u58eb\u516c\u5f00\u822a\u62cd\u5f71\u50cf\u3001DSM\u5761\u5ea6\u4fe1\u606f\u548c\u5efa\u7b51\u8f6e\u5ed3\u6570\u636e\uff0c\u533a\u5206\u73b0\u6709\u7eff\u5c4b\u9876\u3001\u9002\u5408\u6539\u9020\u5c4b\u9876\u3001\u592a\u9633\u80fd\u5c4b\u9876\u548c\u4e0d\u9002\u5408\u7eff\u5316\u7684\u5e73\u5c4b\u9876\u3002\u8be5\u65b9\u6cd5\u5728\u4f2f\u5c14\u5c3c\u9a8c\u8bc1\uff0c\u53ef\u4e3a\u7eff\u5c4b\u9876\u6269\u5c55\u548c\u57ce\u5e02\u70ed\u5c9b\u7f13\u89e3\u89c4\u5212\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u7684\u7a7a\u95f4\u8bc1\u636e\uff0c\u5e76\u56e0\u5b8c\u5168\u5f00\u6e90\u800c\u5177\u5907\u8de8\u57ce\u5e02\u8fc1\u79fb\u6f5c\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multiple Sequence Alignments (MSAs) provide protein language models with explicit evolutionary context, but their large depth makes subsampling unavoidable under limited token budgets. Existing strategies, including random selection, identity-based filtering, and diversity-driven sampling, are effective heuristics, yet provide limited control over the evolutionary signals retained in the subset. In this work, we recast MSA subsampling as an explicit optimization problem, where key evolutionary measures, including query identity and diversity, are treated as controllable objectives. Building on this view, we introduce AP-REASONER, an Affinity-Propagation-based factor-graph approach. With evolution-aware unary factors, exemplar-consistency factors, and two control knobs, AP-REASONER performs factor-graph reasoning through message passing to infer a fixed-budget MSA subset. Experiments on long-range contact prediction and conformational ensemble prediction show that AP-REASONER outperforms baseline subsamplers on structure-sensitive downstream tasks and enables controllable recovery of alternative protein conformations. These results highlight the value of modeling MSA subsampling as a controllable optimization problem, where factor-graph reasoning offers an effective alternative to heuristic selection.", "arxiv_id": "2607.22314", "arxiv_url": "https://arxiv.org/abs/2607.22314", "authors": ["Zhangzhi Xiong", "Minzhang Li", "Haotian Yu", "Sixian Shen", "Kexin Zhang", "Mingrui Li", "Jie Zheng", "Kewei Tu", "Jingyi Yu"], "brief": "\u8bba\u6587\u5c06\u86cb\u767d\u8d28\u591a\u5e8f\u5217\u6bd4\u5bf9\uff08MSA\uff09\u5b50\u91c7\u6837\u91cd\u65b0\u8868\u8ff0\u4e3a\u53ef\u63a7\u4f18\u5316\u95ee\u9898\uff0c\u628a\u67e5\u8be2\u76f8\u4f3c\u6027\u548c\u591a\u6837\u6027\u7b49\u8fdb\u5316\u4fe1\u53f7\u4f5c\u4e3a\u76ee\u6807\u3002\u63d0\u51fa\u57fa\u4e8e\u4eb2\u548c\u4f20\u64ad\u4e0e\u56e0\u5b50\u56fe\u6d88\u606f\u4f20\u9012\u7684 AP-REASONER\uff0c\u5728\u957f\u7a0b\u63a5\u89e6\u9884\u6d4b\u548c\u6784\u8c61\u96c6\u5408\u9884\u6d4b\u4e2d\u4f18\u4e8e\u5e38\u89c1\u542f\u53d1\u5f0f\u91c7\u6837\u65b9\u6cd5\uff0c\u5e76\u80fd\u66f4\u53ef\u63a7\u5730\u6062\u590d\u66ff\u4ee3\u86cb\u767d\u6784\u8c61\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22314", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u86cb\u767d\u8d28\u5efa\u6a21", "\u56e0\u5b50\u56fe", "\u6d88\u606f\u4f20\u9012", "\u5e8f\u5217\u91c7\u6837"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22314v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evolution-Aware MSA Reasoning for Subsampling via Factor Graphs", "tldr": "\u8bba\u6587\u5c06\u86cb\u767d\u8d28\u591a\u5e8f\u5217\u6bd4\u5bf9\uff08MSA\uff09\u5b50\u91c7\u6837\u91cd\u65b0\u8868\u8ff0\u4e3a\u53ef\u63a7\u4f18\u5316\u95ee\u9898\uff0c\u628a\u67e5\u8be2\u76f8\u4f3c\u6027\u548c\u591a\u6837\u6027\u7b49\u8fdb\u5316\u4fe1\u53f7\u4f5c\u4e3a\u76ee\u6807\u3002\u63d0\u51fa\u57fa\u4e8e\u4eb2\u548c\u4f20\u64ad\u4e0e\u56e0\u5b50\u56fe\u6d88\u606f\u4f20\u9012\u7684 AP-REASONER\uff0c\u5728\u957f\u7a0b\u63a5\u89e6\u9884\u6d4b\u548c\u6784\u8c61\u96c6\u5408\u9884\u6d4b\u4e2d\u4f18\u4e8e\u5e38\u89c1\u542f\u53d1\u5f0f\u91c7\u6837\u65b9\u6cd5\uff0c\u5e76\u80fd\u66f4\u53ef\u63a7\u5730\u6062\u590d\u66ff\u4ee3\u86cb\u767d\u6784\u8c61\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Estimating contemporaneous bidirectional interactions from observational data is difficult because each outcome is endogenous to the other, while flexible regressions may capture only reduced-form dependence. This paper proposes SEM-DNN, a heteroscedastic neural simultaneous-equation estimator that learns reciprocal structural interactions without external instruments. Identification exploits conditional covariance diagonalization: when structural shocks have zero conditional means, are conditionally uncorrelated given predetermined covariates, and exhibit nonproportional conditional variances, only the true interaction coefficients diagonalize the conditional residual covariance across the feature space. The method jointly approximates nonlinear structural mean functions and feature-dependent variances using a diagonal Gaussian quasi-likelihood that incorporates the simultaneous-system Jacobian. We establish unique identification and positive-definite local curvature of the profiled population criterion and show that, under neural-profile compatibility conditions, the implemented neural criterion inherits this curvature despite nonunique network parameterizations. The coefficients admit a causal interpretation when the structural equations represent autonomous mechanisms that remain invariant under the relevant interventions. Monte Carlo experiments with nonlinear, high-dimensional nuisance functions and non-Gaussian shocks show that SEM-DNN recovers structural effects more reliably than parametric, kernel-based, and separate-equation neural alternatives as information increases, although at greater computational cost. An application to ready-to-eat cereal scanner data illustrates how the method can study contemporaneous price-sales feedback and assess identification strength, residual diagonalization, variance calibration, and optimization sensitivity.", "arxiv_id": "2607.22313", "arxiv_url": "https://arxiv.org/abs/2607.22313", "authors": ["Masahiro Tanaka"], "brief": "\u8bba\u6587\u63d0\u51fa SEM-DNN\uff0c\u4e00\u79cd\u5f02\u65b9\u5dee\u795e\u7ecf\u8054\u7acb\u65b9\u7a0b\u4f30\u8ba1\u5668\uff0c\u53ef\u5728\u65e0\u5916\u90e8\u5de5\u5177\u53d8\u91cf\u7684\u89c2\u6d4b\u6570\u636e\u4e2d\u5b66\u4e60\u5f53\u671f\u53cc\u5411\u56e0\u679c\u4f5c\u7528\u3002\u5176\u5229\u7528\u6761\u4ef6\u65b9\u5dee\u975e\u6bd4\u4f8b\u5e26\u6765\u7684\u6b8b\u5dee\u534f\u65b9\u5dee\u5bf9\u89d2\u5316\u5b9e\u73b0\u8bc6\u522b\uff0c\u5e76\u5728\u4eff\u771f\u548c\u8c37\u7269\u9500\u552e\u6570\u636e\u4e2d\u76f8\u6bd4\u53c2\u6570\u3001\u6838\u65b9\u6cd5\u548c\u5206\u65b9\u7a0b\u795e\u7ecf\u6a21\u578b\u66f4\u53ef\u9760\u5730\u6062\u590d\u7ed3\u6784\u6548\u5e94\uff0c\u4f46\u8ba1\u7b97\u6210\u672c\u66f4\u9ad8\u3002", "categories": ["stat.ML", "cs.LG", "stat.ME"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22313", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u795e\u7ecf\u7f51\u7edc", "\u8054\u7acb\u65b9\u7a0b", "\u5f02\u65b9\u5dee"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22313v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Bidirectional Causal Interactions with Heteroscedastic Neural Networks", "tldr": "\u8bba\u6587\u63d0\u51fa SEM-DNN\uff0c\u4e00\u79cd\u5f02\u65b9\u5dee\u795e\u7ecf\u8054\u7acb\u65b9\u7a0b\u4f30\u8ba1\u5668\uff0c\u53ef\u5728\u65e0\u5916\u90e8\u5de5\u5177\u53d8\u91cf\u7684\u89c2\u6d4b\u6570\u636e\u4e2d\u5b66\u4e60\u5f53\u671f\u53cc\u5411\u56e0\u679c\u4f5c\u7528\u3002\u5176\u5229\u7528\u6761\u4ef6\u65b9\u5dee\u975e\u6bd4\u4f8b\u5e26\u6765\u7684\u6b8b\u5dee\u534f\u65b9\u5dee\u5bf9\u89d2\u5316\u5b9e\u73b0\u8bc6\u522b\uff0c\u5e76\u5728\u4eff\u771f\u548c\u8c37\u7269\u9500\u552e\u6570\u636e\u4e2d\u76f8\u6bd4\u53c2\u6570\u3001\u6838\u65b9\u6cd5\u548c\u5206\u65b9\u7a0b\u795e\u7ecf\u6a21\u578b\u66f4\u53ef\u9760\u5730\u6062\u590d\u7ed3\u6784\u6548\u5e94\uff0c\u4f46\u8ba1\u7b97\u6210\u672c\u66f4\u9ad8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Synthetic data augmentation in speech is common practice for linguistic tasks like ASR, but has seen far less work for paralinguistic ones, especially clinical tasks where labelled data is expensive and some patient groups are underrepresented. Voice cloning is one such augmentation approach, but is typically evaluated on speech intelligibility (WER) or speaker similarity (SS) rather than on downstream performance, and it remains unclear whether these preserve the paralinguistic signal such tasks depend on. We benchmark eight voice cloning models on five paralinguistic tasks across public and clinical datasets, showing most preserve signal with modest degradation. We then clone English clinical speech into Japanese and find that training on cloned data outperforms raw cross-lingual transfer for depression and anxiety detection on real Japanese speech, suggesting voice cloning is a promising direction for augmenting clinical speech data in low-resource languages.", "arxiv_id": "2607.22304", "arxiv_url": "https://arxiv.org/abs/2607.22304", "authors": ["Roseline Polle", "Owen Parsons", "George Fairs", "Luis Miguel San Martin
