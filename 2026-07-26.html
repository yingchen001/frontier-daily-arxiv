765\u72b6\u6001\u9020\u6210\u4fe1\u606f\u6cc4\u6f0f\uff0c\u53ea\u5b66\u4e60\u573a\u666f\u548c\u7269\u4f53\u5982\u4f55\u54cd\u5e94\u673a\u5668\u4eba\u63a5\u89e6\u4e0e\u8fd0\u52a8\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22535", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u52a8\u4f5c\u5b9e\u73b0\u4ece\u4e16\u754c\u6a21\u578b\u4e2d\u79fb\u51fa\uff1a\u547d\u4ee4\u7ecf\u63a7\u5236\u5668\u4e0e\u8fd0\u52a8\u5b66\u751f\u6210\u540d\u4e49\u8f68\u8ff9\uff0c\u4f5c\u4e3a\u4e2d\u95f4\u4fe1\u53f7\u66ff\u4ee3\u539f\u59cb\u52a8\u4f5c\u6216\u6cc4\u6f0f\u672a\u6765\u4ea4\u4e92\u7ed3\u679c\u7684\u72b6\u6001\u3002", "\u5c06\u673a\u5668\u4eba\u51e0\u4f55\u3001\u8fd0\u52a8\u5b66\u548c\u5916\u89c2\u901a\u8fc7 URDF \u663e\u5f0f\u6e32\u67d3\uff0c\u914d\u5408\u76f8\u673a\u611f\u77e5\u7684\u9759\u6001 RGB/\u6df1\u5ea6\u4e0a\u4e0b\u6587\uff0c\u5f62\u6210\u8de8\u89c6\u89d2\u3001\u8de8\u673a\u5668\u4eba\u5f62\u6001\u7684\u4e00\u81f4\u89c6\u89c9\u63a5\u53e3\u3002", "\u5f15\u5165\u672b\u7aef\u6267\u884c\u5668\u6df1\u5ea6\u4e0e\u573a\u666f\u6df1\u5ea6\u914d\u5bf9\uff0c\u7f13\u89e3\u6df1\u5ea6\u6b67\u4e49\uff0c\u4e3a\u63a5\u89e6\u3001\u906e\u6321\u548c\u7269\u4f53\u8fd0\u52a8\u9884\u6d4b\u63d0\u4f9b\u51e0\u4f55\u7ebf\u7d22\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22535v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Robot-Factored World Models via Robot Rendering", "tldr": "\u7528\u673a\u5668\u4eba\u6e32\u67d3\u89e3\u8026\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa robot-factored world models\uff1a\u5c06\u52a8\u4f5c\u547d\u4ee4\u5148\u901a\u8fc7\u673a\u5668\u4eba\u63a7\u5236\u5668\u548c\u8fd0\u52a8\u5b66\u8f6c\u6210\u53ef\u90e8\u7f72\u7684\u540d\u4e49\u8f68\u8ff9\uff0c\u518d\u7528 URDF \u6e32\u67d3\u6210\u53ef\u89c1\u673a\u5668\u4eba\u51e0\u4f55\uff0c\u4f5c\u4e3a\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u6761\u4ef6\u8f93\u5165\u3002\u6a21\u578b\u56e0\u6b64\u4e0d\u5fc5\u5b66\u4e60\u52a8\u4f5c\u5230\u673a\u5668\u4eba\u8fd0\u52a8\u7684\u5b9e\u73b0\u8fc7\u7a0b\uff0c\u4e5f\u907f\u514d\u4f7f\u7528\u672a\u6765\u72b6\u6001\u9020\u6210\u4fe1\u606f\u6cc4\u6f0f\uff0c\u53ea\u5b66\u4e60\u573a\u666f\u548c\u7269\u4f53\u5982\u4f55\u54cd\u5e94\u673a\u5668\u4eba\u63a5\u89e6\u4e0e\u8fd0\u52a8\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u673a\u5668\u4eba\u672c\u4f53\u76f8\u5173\u56e0\u7d20\u663e\u5f0f\u56e0\u5b50\u5316\uff0c\u964d\u4f4e\u4e16\u754c\u6a21\u578b\u5b66\u4e60\u96be\u5ea6\uff0c\u5e76\u63d0\u5347\u8de8\u673a\u5668\u4eba\u6cdb\u5316\u80fd\u529b\uff1b\u8fd8\u80fd\u5c06\u4eba\u7c7b\u6f14\u793a\u7684\u624b\u90e8\u8fd0\u52a8\u91cd\u5b9a\u5411\u5e76\u6e32\u67d3\u4e3a\u673a\u5668\u4eba\u51e0\u4f55\uff0c\u751f\u6210\u673a\u5668\u4eba\u64cd\u4f5c\u89c6\u9891\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u673a\u5668\u4eba\u5b66\u4e60\u4e0e\u4eff\u771f\u6570\u636e\u751f\u6210\u4ef7\u503c\u3002"}, {"abstract": "Geometry Foundation Models (GFMs) have substantially advanced monocular 3D reconstruction, yet extending this capability to 4D dynamic understanding remains a fundamental challenge. Most existing motion perception methods (e.g., sparse tracking, dense point-wise flow) treat motion as independent point-wise displacements, ignoring the structured nature of physical motion. However, real-world objects usually obey rigid-body kinematics, and points thus usually move collectively, not in isolation. Motion itself possesses geometric structure: physical objects undergo a set of rigid-body transformations governed by SE(3), rather than unstructured point-wise displacements. Building on this insight, we propose SM4RT, a Structured Motion 4D Reconstruction Transformer for end-to-end 3D reconstruction and structured motion perception. SM4RT introduces Structure-of-Motion to represent scene dynamics, where scene motion is decomposed into a compact set of motion bases, each represented as a temporal sequence of 6D twists in SE(3). Dense scene motion is then recovered by sparse, time-shared per-pixel assignment weights over these bases, ensuring points on the same object share a common rigid-body motion trajectory. SM4RT introduces a parallel motion geometry encoder and decoder that jointly infer 3D geometry, world-coordinate motion, and scene kinematic structure in a single forward pass from monocular RGB video. SM4RT achieves strong motion reconstruction performance while preserving the geometric structure of scene motion.", "arxiv_id": "2607.22534", "arxiv_url": "https://arxiv.org/abs/2607.22534", "authors": ["Shing Ho J. Lin", "Wenzhao Zheng", "Dong Zhuo", "Yuqi Wu", "Jie Zhou", "Jiwen Lu"], "brief": "SM4RT\u63d0\u51fa\u4e00\u79cd\u7aef\u5230\u7aef\u76844D\u91cd\u5efaTransformer\uff0c\u4ece\u5355\u76eeRGB\u89c6\u9891\u4e2d\u540c\u65f6\u6062\u590d3D\u51e0\u4f55\u3001\u4e16\u754c\u5750\u6807\u8fd0\u52a8\u4e0e\u573a\u666f\u8fd0\u52a8\u5b66\u7ed3\u6784\u3002\u5176\u6838\u5fc3\u662f\u5c06\u52a8\u6001\u573a\u666f\u8868\u793a\u4e3a\u5c11\u91cf\u521a\u4f53\u8fd0\u52a8\u57fa\u53ca\u50cf\u7d20\u7ea7\u5206\u914d\u6743\u91cd\uff0c\u800c\u975e\u72ec\u7acb\u70b9\u4f4d\u79fb\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22534", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51faStructure-of-Motion\u8868\u793a\uff0c\u5c06\u573a\u666f\u8fd0\u52a8\u5206\u89e3\u4e3a\u4e00\u7ec4\u7d27\u51d1\u7684\u8fd0\u52a8\u57fa\uff0c\u6bcf\u4e2a\u8fd0\u52a8\u57fa\u7531SE(3)\u4e0a\u7684\u65f6\u95f4\u5e8f\u52176D twists\u8868\u793a", "\u901a\u8fc7\u7a00\u758f\u4e14\u65f6\u95f4\u5171\u4eab\u7684\u9010\u50cf\u7d20\u5206\u914d\u6743\u91cd\u6062\u590d\u7a20\u5bc6\u8fd0\u52a8\uff0c\u4f7f\u540c\u4e00\u7269\u4f53\u4e0a\u7684\u70b9\u5171\u4eab\u4e00\u81f4\u7684\u521a\u4f53\u8fd0\u52a8\u8f68\u8ff9", "\u8bbe\u8ba1\u5e76\u884c\u7684\u8fd0\u52a8\u51e0\u4f55\u7f16\u7801\u5668\u4e0e\u89e3\u7801\u5668\uff0c\u5728\u5355\u6b21\u524d\u5411\u4f20\u64ad\u4e2d\u8054\u5408\u63a8\u65ad3D\u51e0\u4f55\u3001\u8fd0\u52a8\u548c\u8fd0\u52a8\u5b66\u7ed3\u6784"], "keywords": ["4D\u91cd\u5efa", "\u51e0\u4f55\u57fa\u7840\u6a21\u578b", "\u8fd0\u52a8\u5efa\u6a21", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22534v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SM4RT: Learning Structured Motion Geometry for 4D Reconstruction", "tldr": "\u7528\u7ed3\u6784\u5316SE(3)\u8fd0\u52a8\u63d0\u5347\u5355\u76ee4D\u91cd\u5efa", "upvotes": 0, "what_it_is": "SM4RT\u63d0\u51fa\u4e00\u79cd\u7aef\u5230\u7aef\u76844D\u91cd\u5efaTransformer\uff0c\u4ece\u5355\u76eeRGB\u89c6\u9891\u4e2d\u540c\u65f6\u6062\u590d3D\u51e0\u4f55\u3001\u4e16\u754c\u5750\u6807\u8fd0\u52a8\u4e0e\u573a\u666f\u8fd0\u52a8\u5b66\u7ed3\u6784\u3002\u5176\u6838\u5fc3\u662f\u5c06\u52a8\u6001\u573a\u666f\u8868\u793a\u4e3a\u5c11\u91cf\u521a\u4f53\u8fd0\u52a8\u57fa\u53ca\u50cf\u7d20\u7ea7\u5206\u914d\u6743\u91cd\uff0c\u800c\u975e\u72ec\u7acb\u70b9\u4f4d\u79fb\u3002", "why_notable": "\u8bba\u6587\u5c06\u51e0\u4f55\u57fa\u7840\u6a21\u578b\u4ece\u9759\u6001\u5355\u76ee3D\u91cd\u5efa\u63a8\u8fdb\u5230\u52a8\u60014D\u7406\u89e3\uff0c\u5e76\u663e\u5f0f\u5f15\u5165\u521a\u4f53\u8fd0\u52a8\u7ed3\u6784\u7ea6\u675f\uff0c\u6709\u671b\u6bd4\u4f20\u7edf\u70b9\u7ea7\u5149\u6d41\u6216\u8ddf\u8e2a\u65b9\u6cd5\u66f4\u7b26\u5408\u7269\u7406\u8fd0\u52a8\u89c4\u5f8b\uff0c\u63d0\u5347\u52a8\u6001\u573a\u666f\u91cd\u5efa\u7684\u7a33\u5b9a\u6027\u4e0e\u53ef\u89e3\u91ca\u6027\u3002"}, {"abstract": "Inferring physical properties such as mass, stiffness, and elasticity from a single image is essential for simulation and embodied AI, yet most existing approaches rely on multi-view reconstruction or physics-based supervision. We introduce SiPhy, a unified framework for single-image physical property reasoning that aligns 3D-aware visual cues, depth with language-based material knowledge. From one RGB image, SiPhy samples pseudo-voxel points, extracts CLIP features, and grounds them to material candidates proposed by a VLM. A part-based contrastive aggregator enforces region consistency, while a heaviness-aware refinement improves thickness and volume estimation for dense objects. Across ABO-500, MVImgNet-100, and PhysXNet-100, SiPhy achieves state-of-the-art single-image performance, surpassing multi-view reconstruction methods by improving mass MnRE by up to 93% (vs. PUGS), reducing density MAE by 35.5% (vs. NeRF2Physics), and lowering Young\u0027s modulus error by 23.5%. We further validate SiPhy on real hand-object interaction datasets, demonstrating its potential as a data annotation engine for physical understanding from single-view imagery.", "arxiv_id": "2607.22355", "arxiv_url": "https://arxiv.org/abs/2607.22355", "authors": ["Hoang Le", "Joonwoo Kwon", "Elkhan Ismayilzada", "Yufei Zhang", "Zijun Cui"], "brief": "SiPhy \u662f\u4e00\u4e2a\u5355\u5f20 RGB \u56fe\u50cf\u7269\u7406\u5c5e\u6027\u63a8\u7406\u6846\u67b6\uff0c\u5c06 3D \u611f\u77e5\u89c6\u89c9\u7ebf\u7d22\u3001\u6df1\u5ea6\u4fe1\u606f\u4e0e\u57fa\u4e8e\u8bed\u8a00\u7684\u6750\u6599\u77e5\u8bc6\u5bf9\u9f50\uff0c\u7528\u4e8e\u4f30\u8ba1\u8d28\u91cf\u3001\u5bc6\u5ea6\u3001\u521a\u5ea6/\u5f39\u6027\u7b49\u5c5e\u6027\u3002\u5b83\u901a\u8fc7\u4f2a\u4f53\u7d20\u91c7\u6837\u3001CLIP \u7279\u5f81\u548c VLM \u63d0\u8bae\u7684\u6750\u6599\u5019\u9009\u8fdb\u884c grounding\uff0c\u5e76\u52a0\u5165\u90e8\u4ef6\u7ea7\u5bf9\u6bd4\u805a\u5408\u4e0e\u91cd\u91cf\u611f\u77e5\u7ec6\u5316\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22355", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u5355\u5f20 RGB \u56fe\u50cf\u91c7\u6837\u4f2a\u4f53\u7d20\u70b9\u5e76\u63d0\u53d6 CLIP \u7279\u5f81\uff0c\u7ed3\u5408 VLM \u751f\u6210\u7684\u6750\u6599\u5019\u9009\u8fdb\u884c\u6750\u6599\u4e0e\u7269\u7406\u5c5e\u6027\u63a8\u7406", "\u63d0\u51fa\u90e8\u4ef6\u7ea7\u5bf9\u6bd4\u805a\u5408\u5668\u4ee5\u5f3a\u5316\u533a\u57df\u4e00\u81f4\u6027\uff0c\u5e76\u7528 heaviness-aware refinement \u6539\u5584\u539a\u5ea6\u548c\u4f53\u79ef\u4f30\u8ba1", "\u5728 ABO-500\u3001MVImgNet-100\u3001PhysXNet-100 \u4e0a\u8fbe\u5230\u5355\u56fe SOTA\uff0c\u8d28\u91cf MnRE \u6700\u9ad8\u8f83 PUGS \u63d0\u5347 93%\uff0c\u5bc6\u5ea6 MAE \u8f83 NeRF2Physics \u964d\u4f4e 35.5%"], "keywords": ["\u7269\u7406\u63a8\u7406", "\u591a\u6a21\u6001", "\u4e09\u7ef4\u89c6\u89c9", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22355v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SiPhy: Single-Image Physical Property Reasoning", "tldr": "\u5355\u56fe\u63a8\u65ad\u7269\u4f53\u8d28\u91cf\u3001\u5bc6\u5ea6\u4e0e\u5f39\u6027\u7b49\u7269\u7406\u5c5e\u6027", "upvotes": 0, "what_it_is": "SiPhy \u662f\u4e00\u4e2a\u5355\u5f20 RGB \u56fe\u50cf\u7269\u7406\u5c5e\u6027\u63a8\u7406\u6846\u67b6\uff0c\u5c06 3D \u611f\u77e5\u89c6\u89c9\u7ebf\u7d22\u3001\u6df1\u5ea6\u4fe1\u606f\u4e0e\u57fa\u4e8e\u8bed\u8a00\u7684\u6750\u6599\u77e5\u8bc6\u5bf9\u9f50\uff0c\u7528\u4e8e\u4f30\u8ba1\u8d28\u91cf\u3001\u5bc6\u5ea6\u3001\u521a\u5ea6/\u5f39\u6027\u7b49\u5c5e\u6027\u3002\u5b83\u901a\u8fc7\u4f2a\u4f53\u7d20\u91c7\u6837\u3001CLIP \u7279\u5f81\u548c VLM \u63d0\u8bae\u7684\u6750\u6599\u5019\u9009\u8fdb\u884c grounding\uff0c\u5e76\u52a0\u5165\u90e8\u4ef6\u7ea7\u5bf9\u6bd4\u805a\u5408\u4e0e\u91cd\u91cf\u611f\u77e5\u7ec6\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5355\u56fe\u89c6\u89c9\u7406\u89e3\u3001\u6750\u6599\u8bed\u8a00\u77e5\u8bc6\u548c\u7269\u7406\u5c5e\u6027\u4f30\u8ba1\u7ed3\u5408\u8d77\u6765\uff0c\u51cf\u5c11\u4e86\u5bf9\u591a\u89c6\u89d2\u91cd\u5efa\u6216\u7269\u7406\u76d1\u7763\u7684\u4f9d\u8d56\uff0c\u5bf9\u4eff\u771f\u3001\u673a\u5668\u4eba\u4ea4\u4e92\u548c\u5177\u8eab AI \u4e2d\u7684\u7269\u4f53\u7269\u7406\u5efa\u6a21\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Medical multimodal large language models (MLLMs) are increasingly expected to perform complex image understanding tasks, yet their reliability is often compromised by frequent errors in visual interpretation. To systematically trace these failures, we traverse the hierarchy from high-level clinical tasks down to fundamental visual perception. We therefore introduce Perception-Bench, a large-scale benchmark comprising 1.13 million samples that assesses medical MLLMs across six dimensions: attribute judgment, spatial grounding, spatial understanding, disease prediction, anomaly detection, and report generation, spanning both 2D and 3D radiology images. Our analysis on Perception-Bench reveals that existing MLLMs lack the ability to capture even the most basic lesion attributes, such as location, size, and density. This inability to ground clinical outputs in primary visual evidence reveals that the models\u0027 diagnostic unreliability is rooted in a critical but overlooked bottleneck in low-level visual perception. Motivated by this, we propose RadSight, a perception-driven MLLM built upon a dual 2D/3D encoder architecture that preserves native imaging spatial structures. RadSight formulates medical image understanding as a four-stage progressive process: visual-language alignment, fine-grained visual perception, clinical diagnosis, and diagnostic interpretation. The model is trained on an 8.37 million perception-oriented corpus using progressive curriculum learning. On Perception-Bench, RadSight consistently outperforms existing MLLMs across all six evaluation dimensions, with particularly strong gains in spatial grounding and clinical diagnosis. It also achieves consistent improvements on public 2D and 3D medical benchmarks, further demonstrating that robust low-level visual perception is a critical foundation for reliable clinical understanding. Code and model will be publicly available.", "arxiv_id": "2607.22293", "arxiv_url": "https://arxiv.org/abs/2607.22293", "authors": ["Jianqin Liu", "Weiwei Cao", "Wanxing Chang", "Ruifeng Yuan", "Bowen Shi", "Zhilin Zheng", "Xianjie Zhang", "Ling Zhang", "Peng Wang", "Jianpeng Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u5927\u89c4\u6a21\u533b\u5b66\u611f\u77e5\u8bc4\u6d4b\u96c6 Perception-Bench\uff0c\u5e76\u63ed\u793a\u73b0\u6709\u533b\u5b66 MLLM \u7684\u8bca\u65ad\u9519\u8bef\u6839\u6e90\u5728\u4f4e\u5c42\u89c6\u89c9\u611f\u77e5\u4e0d\u8db3\u3002\u57fa\u4e8e\u6b64\uff0c\u4f5c\u8005\u6784\u5efa RadSight\uff0c\u91c7\u7528\u53cc 2D/3D \u7f16\u7801\u5668\u4e0e\u6e10\u8fdb\u5f0f\u8bad\u7ec3\uff0c\u5f3a\u5316\u653e\u5c04\u5f71\u50cf\u7684\u7ec6\u7c92\u5ea6\u611f\u77e5\u3001\u8bca\u65ad\u4e0e\u89e3\u91ca\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22293", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Perception-Bench \u542b 113 \u4e07\u6837\u672c\uff0c\u8986\u76d6\u5c5e\u6027\u5224\u65ad\u3001\u7a7a\u95f4\u5b9a\u4f4d\u3001\u7a7a\u95f4\u7406\u89e3\u3001\u75be\u75c5\u9884\u6d4b\u3001\u5f02\u5e38\u68c0\u6d4b\u3001\u62a5\u544a\u751f\u6210\u516d\u7c7b\u4efb\u52a1\uff0c\u5e76\u652f\u6301 2D \u4e0e 3D \u653e\u5c04\u5f71\u50cf\u3002", "\u5206\u6790\u53d1\u73b0\u73b0\u6709\u533b\u5b66 MLLM \u96be\u4ee5\u53ef\u9760\u8bc6\u522b\u75c5\u7076\u4f4d\u7f6e\u3001\u5927\u5c0f\u3001\u5bc6\u5ea6\u7b49\u57fa\u7840\u89c6\u89c9\u5c5e\u6027\uff0c\u5bfc\u81f4\u4e34\u5e8a\u8f93\u51fa\u7f3a\u4e4f\u89c6\u89c9\u8bc1\u636e\u652f\u6491\u3002", "RadSight \u4f7f\u7528\u53cc 2D/3D \u7f16\u7801\u5668\u4fdd\u7559\u539f\u751f\u7a7a\u95f4\u7ed3\u6784\uff0c\u5e76\u5728 837 \u4e07\u611f\u77e5\u5bfc\u5411\u8bed\u6599\u4e0a\u8fdb\u884c\u56db\u9636\u6bb5\u6e10\u8fdb\u8bfe\u7a0b\u5b66\u4e60\u3002"], "keywords": ["\u533b\u5b66\u591a\u6a21\u6001", "\u653e\u5c04\u5f71\u50cf", "\u89c6\u89c9\u611f\u77e5", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22293v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RadSight: Towards Perceptually Reliable Multimodal Radiology Image Understanding", "tldr": "RadSight\u63d0\u5347\u653e\u5c04\u5f71\u50cf\u591a\u6a21\u6001\u611f\u77e5\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5927\u89c4\u6a21\u533b\u5b66\u611f\u77e5\u8bc4\u6d4b\u96c6 Perception-Bench\uff0c\u5e76\u63ed\u793a\u73b0\u6709\u533b\u5b66 MLLM \u7684\u8bca\u65ad\u9519\u8bef\u6839\u6e90\u5728\u4f4e\u5c42\u89c6\u89c9\u611f\u77e5\u4e0d\u8db3\u3002\u57fa\u4e8e\u6b64\uff0c\u4f5c\u8005\u6784\u5efa RadSight\uff0c\u91c7\u7528\u53cc 2D/3D \u7f16\u7801\u5668\u4e0e\u6e10\u8fdb\u5f0f\u8bad\u7ec3\uff0c\u5f3a\u5316\u653e\u5c04\u5f71\u50cf\u7684\u7ec6\u7c92\u5ea6\u611f\u77e5\u3001\u8bca\u65ad\u4e0e\u89e3\u91ca\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u533b\u5b66\u591a\u6a21\u6001\u6a21\u578b\u7684\u53ef\u9760\u6027\u95ee\u9898\u8ffd\u6eaf\u5230\u4f4e\u5c42\u89c6\u89c9\u611f\u77e5\u74f6\u9888\uff0c\u5e76\u63d0\u4f9b\u4e86\u5927\u89c4\u6a21\u57fa\u51c6\u4e0e\u9488\u5bf9\u6027\u6a21\u578b\u65b9\u6848\uff1b\u5bf9\u63d0\u5347\u653e\u5c04\u5f71\u50cf\u7406\u89e3\u3001\u4e34\u5e8a\u8bca\u65ad\u53ef\u4fe1\u5ea6\u548c\u533b\u5b66 MLLM \u8bc4\u6d4b\u6807\u51c6\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "In this paper, we propose a new solution for addressing the content cold-start problem in industry-scale search and recommender systems. Compared to prior approaches, we have made the following new contributions: 1) our solution spans the entire multi-stage funnel and generalizes well for both search and recommendation surfaces, 2) our solution reduces bias favoring existing content, allowing more accurate model prediction across content types and reducing short-term tradeoffs associated with high volumes of explicit content exploration, 3) our solution is evaluated with a scalable measurement framework that enables fast short-term experimentation while validating long-term impact. We have iteratively built and successfully deployed this new system at Pinterest in the past two years and observed significant improvements in fresh content exploration, overall user engagement, and content ecosystem health.", "arxiv_id": "2607.22518", "arxiv_url": "https://arxiv.org/abs/2607.22518", "authors": ["Olafur Gudmundsson", "Bo Zhao", "Huayi Liao", "Anna Kiyantseva", "Sai Xiao", "Heath Vinicombe", "Mostafa Keikha", "Luke DeLuccia", "Zihao Chen", "Junpeng Hou", "Weijie Jiang", "Bhawna Juneja", "Andreanne Lemay", "Wei-Ting Lin", "Keyvan Moghadam", "Jiaxing Qu", "Zhiqing Rao", "Zhihua Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u90e8\u7f72\u4e86 PinEqualizer\uff0c\u4e00\u4e2a\u9762\u5411 Pinterest \u5de5\u4e1a\u7ea7\u641c\u7d22\u4e0e\u63a8\u8350\u7684\u5168\u6f0f\u6597\u5185\u5bb9\u63a2\u7d22\u548c\u53bb\u504f\u7cfb\u7edf\u3002\u5b83\u7528\u4e8e\u7f13\u89e3\u65b0\u5185\u5bb9\u51b7\u542f\u52a8\uff0c\u51cf\u5c11\u6a21\u578b\u5bf9\u65e2\u6709\u5185\u5bb9\u7684\u504f\u7f6e\uff0c\u5e76\u63d0\u5347\u65b0\u9c9c\u5185\u5bb9\u66dd\u5149\u4e0e\u7528\u6237\u53c2\u4e0e\u3002", "categories": ["cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22518", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d6\u53ec\u56de\u3001\u6392\u5e8f\u7b49\u591a\u9636\u6bb5\u6f0f\u6597\uff0c\u5e76\u540c\u65f6\u9002\u7528\u4e8e\u641c\u7d22\u548c\u63a8\u8350\u573a\u666f", "\u901a\u8fc7\u53bb\u504f\u673a\u5236\u964d\u4f4e\u7cfb\u7edf\u5bf9\u5386\u53f2\u70ed\u95e8\u6216\u5df2\u6709\u5185\u5bb9\u7684\u504f\u597d\uff0c\u4f7f\u4e0d\u540c\u5185\u5bb9\u7c7b\u578b\u7684\u9884\u6d4b\u66f4\u51c6\u786e", "\u6784\u5efa\u53ef\u6269\u5c55\u8bc4\u4f30\u6846\u67b6\uff0c\u652f\u6301\u77ed\u671f\u5feb\u901f\u5b9e\u9a8c\u5e76\u9a8c\u8bc1\u957f\u671f\u751f\u6001\u5f71\u54cd"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u641c\u7d22", "\u51b7\u542f\u52a8", "\u53bb\u504f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22518v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PinEqualizer: Full Funnel Content Exploration and Debiasing System at Pinterest", "tldr": "Pinterest\u5168\u94fe\u8def\u51b7\u542f\u52a8\u63a2\u7d22\u4e0e\u53bb\u504f\u7cfb\u7edf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5e76\u90e8\u7f72\u4e86 PinEqualizer\uff0c\u4e00\u4e2a\u9762\u5411 Pinterest \u5de5\u4e1a\u7ea7\u641c\u7d22\u4e0e\u63a8\u8350\u7684\u5168\u6f0f\u6597\u5185\u5bb9\u63a2\u7d22\u548c\u53bb\u504f\u7cfb\u7edf\u3002\u5b83\u7528\u4e8e\u7f13\u89e3\u65b0\u5185\u5bb9\u51b7\u542f\u52a8\uff0c\u51cf\u5c11\u6a21\u578b\u5bf9\u65e2\u6709\u5185\u5bb9\u7684\u504f\u7f6e\uff0c\u5e76\u63d0\u5347\u65b0\u9c9c\u5185\u5bb9\u66dd\u5149\u4e0e\u7528\u6237\u53c2\u4e0e\u3002", "why_notable": "\u8fd9\u662f\u4e00\u5957\u5df2\u5728 Pinterest \u751f\u4ea7\u73af\u5883\u8fed\u4ee3\u90e8\u7f72\u4e24\u5e74\u7684\u5de5\u4e1a\u7ea7\u65b9\u6848\uff0c\u517c\u987e\u5185\u5bb9\u51b7\u542f\u52a8\u3001\u7528\u6237\u4f53\u9a8c\u548c\u5185\u5bb9\u751f\u6001\u5065\u5eb7\uff0c\u5bf9\u5927\u89c4\u6a21\u63a8\u8350\u7cfb\u7edf\u7684\u65b0\u5185\u5bb9\u63a2\u7d22\u5177\u6709\u8f83\u9ad8\u5b9e\u8df5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Learning world models that infer environment dynamics from high-dimensional observations and predict outcomes under candidate actions is central to planning and control. Joint-Embedding Predictive Architectures (JEPAs) provide a compelling framework for learning such models in representation space. Recent action-conditioned extensions perform promisingly in visual control and latent-space planning, but leave a fundamental question unresolved: when does controlled latent prediction identify both the underlying state and the controlled dynamics? This is challenging under nonlinear observations and behavior policies with limited conditional action variation, where state-dependent evolution and action effects can be statistically confounded. We establish a joint identifiability theory for controlled world models with Gaussian latent states under state-dependent Gaussian behavior policies. We identify two policy-dependent conditions: spectral separation of the predictable signal governs representation identifiability, while non-degenerate conditional action variation governs transition identifiability. We prove that when both conditions hold, every global minimizer of the JEPA objective identifies the latent state and controlled transition up to an orthogonal transformation. We further derive quantitative bounds on representation and transition identifiability under approximate optimization. Finally, we construct predictor perturbations along weakly excited action directions whose counterfactual-to-on-policy error ratio is the inverse transition-identifiability margin, revealing the cost of limited action coverage. Experiments across nonlinear observation maps and behavior policies corroborate the theory and demonstrate implications for transition identifiability, counterfactual prediction, and goal-conditioned latent planning.", "arxiv_id": "2607.22430", "arxiv_url": "https://arxiv.org/abs/2607.22430", "authors": ["Xiangteng Zhang", "Yang Guan", "Bo Zhang", "Ya-Qin Zhang", "Shengbo Eben Li"], "brief": "\u672c\u6587\u7814\u7a76\u52a8\u4f5c\u6761\u4ef6 JEPA \u7c7b\u4e16\u754c\u6a21\u578b\u4f55\u65f6\u80fd\u4ece\u9ad8\u7ef4\u89c2\u6d4b\u4e2d\u540c\u65f6\u8bc6\u522b\u6f5c\u5728\u72b6\u6001\u4e0e\u53d7\u63a7\u52a8\u529b\u5b66\u3002\u8bba\u6587\u5728\u9ad8\u65af\u6f5c\u53d8\u91cf\u548c\u72b6\u6001\u4f9d\u8d56\u9ad8\u65af\u884c\u4e3a\u7b56\u7565\u8bbe\u5b9a\u4e0b\uff0c\u7ed9\u51fa\u4e86\u5168\u5c40\u6700\u4f18\u4e0e\u8fd1\u4f3c\u4f18\u5316\u65f6\u7684\u53ef\u8fa8\u8bc6\u6027\u6761\u4ef6\u548c\u8bef\u5dee\u754c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22430", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u4e24\u7c7b\u7b56\u7565\u76f8\u5173\u6761\u4ef6\uff1a\u53ef\u9884\u6d4b\u4fe1\u53f7\u7684\u8c31\u5206\u79bb\u51b3\u5b9a\u8868\u5f81\u53ef\u8fa8\u8bc6\u6027\uff0c\u6761\u4ef6\u52a8\u4f5c\u53d8\u5316\u7684\u975e\u9000\u5316\u6027\u51b3\u5b9a\u8f6c\u79fb\u52a8\u529b\u5b66\u53ef\u8fa8\u8bc6\u6027", "\u8bc1\u660e\u5f53\u6761\u4ef6\u6ee1\u8db3\u65f6\uff0cJEPA \u76ee\u6807\u7684\u4efb\u610f\u5168\u5c40\u6700\u5c0f\u89e3\u90fd\u80fd\u5728\u6b63\u4ea4\u53d8\u6362\u610f\u4e49\u4e0b\u8bc6\u522b\u6f5c\u5728\u72b6\u6001\u548c\u53d7\u63a7\u8f6c\u79fb", "\u6784\u9020\u5f31\u6fc0\u6d3b\u52a8\u4f5c\u65b9\u5411\u4e0a\u7684\u9884\u6d4b\u5668\u6270\u52a8\uff0c\u63ed\u793a\u53cd\u4e8b\u5b9e\u8bef\u5dee\u4e0e\u5728\u7b56\u7565\u8bef\u5dee\u4e4b\u6bd4\u7531\u8f6c\u79fb\u53ef\u8fa8\u8bc6\u6027\u88d5\u5ea6\u63a7\u5236"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u53ef\u8fa8\u8bc6\u6027", "\u5f3a\u5316\u5b66\u4e60", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22430v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "On the Identifiability of Controlled World Models", "tldr": "\u53d7\u63a7\u4e16\u754c\u6a21\u578b\u53ef\u8fa8\u8bc6\u6027\u7684\u7406\u8bba\u523b\u753b", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u52a8\u4f5c\u6761\u4ef6 JEPA \u7c7b\u4e16\u754c\u6a21\u578b\u4f55\u65f6\u80fd\u4ece\u9ad8\u7ef4\u89c2\u6d4b\u4e2d\u540c\u65f6\u8bc6\u522b\u6f5c\u5728\u72b6\u6001\u4e0e\u53d7\u63a7\u52a8\u529b\u5b66\u3002\u8bba\u6587\u5728\u9ad8\u65af\u6f5c\u53d8\u91cf\u548c\u72b6\u6001\u4f9d\u8d56\u9ad8\u65af\u884c\u4e3a\u7b56\u7565\u8bbe\u5b9a\u4e0b\uff0c\u7ed9\u51fa\u4e86\u5168\u5c40\u6700\u4f18\u4e0e\u8fd1\u4f3c\u4f18\u5316\u65f6\u7684\u53ef\u8fa8\u8bc6\u6027\u6761\u4ef6\u548c\u8bef\u5dee\u754c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u548c\u6f5c\u7a7a\u95f4\u89c4\u5212\u63d0\u4f9b\u4e86\u57fa\u7840\u7406\u8bba\uff0c\u89e3\u91ca\u4e86\u884c\u4e3a\u7b56\u7565\u52a8\u4f5c\u8986\u76d6\u4e0d\u8db3\u65f6\u4e3a\u4f55\u4f1a\u5bfc\u81f4\u53cd\u4e8b\u5b9e\u9884\u6d4b\u548c\u63a7\u5236\u5931\u8d25\uff0c\u5bf9\u89c6\u89c9\u63a7\u5236\u3001\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u548c\u4e16\u754c\u6a21\u578b\u8bad\u7ec3\u5177\u6709\u6307\u5bfc\u610f\u4e49\u3002"}, {"abstract": "Open-weight language models from different families exhibit complementary capabilities, motivating their consolidation into a compact student through on-policy distillation (OPD). However, full-vocabulary OPD typically assumes a shared tokenizer, while existing cross-tokenizer methods may discard teacher probability mass or assign it to student tokens with unrelated content. We introduce Byte-Prefix Marginalization (BPM), which re-expresses the teacher\u0027s next-token distribution over the student vocabulary in a shared byte space. Specifically, BPM assigns each teacher token\u0027s probability to the longest student token whose byte representation is a prefix of the teacher token\u0027s bytes, aggregates mass mapped to the same student token, and places otherwise unmatched mass in an explicit residual category. This produces a vocabulary-complete, byte-aligned, and mass-preserving target for dense OPD. The target exactly recovers the teacher-induced byte-prefix marginal when the relevant prefix does not span multiple teacher tokens (a condition satisfied at more than 99% of training positions) and uses a mass-preserving, chain-factorized lower bound otherwise. Across Qwen3-32B, GLM-Z1-9B-0414, and MiniMax-M2.7 as teachers, BPM consistently outperforms current cross-tokenizer methods on six mathematics and programming benchmarks, improving six-benchmark avg@8 by 3.7-6.6 points over the strongest baselines.", "arxiv_id": "2607.22334", "arxiv_url": "https://arxiv.org/abs/2607.22334", "authors": ["Hao Wang", "Kun Yuan", "Wenlin Zhong", "Minglei Zhang", "Han Xiao", "Ming Sun", "Honggang Qi"], "brief": "\u8bba\u6587\u63d0\u51fa Byte-Prefix Marginalization\uff08BPM\uff09\uff0c\u5c06\u4e0d\u540c\u5206\u8bcd\u5668\u6559\u5e08\u6a21\u578b\u7684\u4e0b\u4e00\u8bcd\u5206\u5e03\u91cd\u8868\u8fbe\u5230\u5b66\u751f\u8bcd\u8868\u7684\u5171\u4eab\u5b57\u8282\u7a7a\u95f4\u4e2d\u3002\u5b83\u901a\u8fc7\u5b57\u8282\u524d\u7f00\u5339\u914d\u4e0e\u6b8b\u5dee\u7c7b\u522b\u4fdd\u7559\u6982\u7387\u8d28\u91cf\uff0c\u4e3a\u5bc6\u96c6\u5728\u7b56\u7565\u84b8\u998f\u63d0\u4f9b\u8bcd\u8868\u5b8c\u6574\u3001\u5b57\u8282\u5bf9\u9f50\u4e14\u8d28\u91cf\u5b88\u6052\u7684\u76ee\u6807\u5206\u5e03\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22334", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["BPM\u628a\u6559\u5e08token\u6982\u7387\u5206\u914d\u7ed9\u5176\u5b57\u8282\u8868\u793a\u6700\u957f\u524d\u7f00\u5339\u914d\u7684\u5b66\u751ftoken\uff0c\u5e76\u805a\u5408\u540c\u4e00\u5b66\u751ftoken\u4e0a\u7684\u6982\u7387\u8d28\u91cf\u3002", "\u5bf9\u65e0\u6cd5\u5339\u914d\u7684\u6982\u7387\u8d28\u91cf\u8bbe\u7f6e\u663e\u5f0f\u6b8b\u5dee\u7c7b\u522b\uff0c\u907f\u514d\u73b0\u6709\u8de8\u5206\u8bcd\u5668\u84b8\u998f\u4e2d\u4e22\u5931\u8d28\u91cf\u6216\u9519\u8bef\u5bf9\u9f50\u8bed\u4e49\u7684\u95ee\u9898\u3002", "\u5728Qwen3-32B\u3001GLM-Z1-9B-0414\u3001MiniMax-M2.7\u7b49\u6559\u5e08\u6a21\u578b\u4e0a\uff0c\u516d\u4e2a\u6570\u5b66\u4e0e\u7f16\u7a0b\u57fa\u51c6avg@8\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u53473.7\u52306.6\u5206\u3002"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u8bed\u8a00\u6a21\u578b", "\u5206\u8bcd\u5668", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22334v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Cross-Tokenizer On-Policy Distillation via Byte-Prefix Marginalization", "tldr": "BPM\u5b9e\u73b0\u8de8\u5206\u8bcd\u5668\u9ad8\u8d28\u91cf\u5728\u7b56\u7565\u84b8\u998f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Byte-Prefix Marginalization\uff08BPM\uff09\uff0c\u5c06\u4e0d\u540c\u5206\u8bcd\u5668\u6559\u5e08\u6a21\u578b\u7684\u4e0b\u4e00\u8bcd\u5206\u5e03\u91cd\u8868\u8fbe\u5230\u5b66\u751f\u8bcd\u8868\u7684\u5171\u4eab\u5b57\u8282\u7a7a\u95f4\u4e2d\u3002\u5b83\u901a\u8fc7\u5b57\u8282\u524d\u7f00\u5339\u914d\u4e0e\u6b8b\u5dee\u7c7b\u522b\u4fdd\u7559\u6982\u7387\u8d28\u91cf\uff0c\u4e3a\u5bc6\u96c6\u5728\u7b56\u7565\u84b8\u998f\u63d0\u4f9b\u8bcd\u8868\u5b8c\u6574\u3001\u5b57\u8282\u5bf9\u9f50\u4e14\u8d28\u91cf\u5b88\u6052\u7684\u76ee\u6807\u5206\u5e03\u3002", "why_notable": "\u8de8\u5206\u8bcd\u5668\u84b8\u998f\u662f\u6574\u5408\u4e0d\u540c\u5f00\u6e90\u6a21\u578b\u80fd\u529b\u7684\u91cd\u8981\u74f6\u9888\u3002BPM\u63d0\u4f9b\u4e86\u4e00\u4e2a\u6982\u7387\u8d28\u91cf\u5b88\u6052\u4e14\u5b9e\u73b0\u4e0a\u6e05\u6670\u7684\u5bf9\u9f50\u65b9\u6cd5\uff0c\u80fd\u66f4\u53ef\u9760\u5730\u628a\u591a\u5bb6\u65cf\u5927\u6a21\u578b\u80fd\u529b\u538b\u7f29\u5230\u7d27\u51d1\u5b66\u751f\u6a21\u578b\u4e2d\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large reasoning models (LRMs) generate long reasoning traces before producing final answers. While these traces may contain useful signals for hallucination detection, harnessing them is non-trivial because long trajectories often include noisy steps that obscure the cues relevant to truthfulness assessment. In this paper, we identify two prevalent forms of reasoning noises, i.e., irrelevant steps and repetitive steps, and show that both substantially degrade hallucination detection performance. Existing confidence-based scores and naive embedding-based filtering fail to reliably separate noisy from informative steps. To address this challenge, we propose REDE, a novel learning framework for denoising reasoning traces for hallucination detection. Specifically, REDE leverages final-answer attention as an automatic supervision signal to shape the step-level representation space, yielding refined embeddings in which noisy steps can be reliably identified and filtered. REDE can be readily plugged into diverse hallucination detectors by operating on the filtered reasoning trajectory after removing noisy steps. Extensive experiments on multiple reasoning benchmarks show that REDE consistently improves detection performance over competitive baselines.", "arxiv_id": "2607.22098", "arxiv_url": "https://arxiv.org/abs/2607.22098", "authors": ["Junlin Fang", "Do Nguyen-Thanh", "Xiaogang Xu", "Zhen Fang", "Sean Du"], "brief": "\u672c\u6587\u63d0\u51fa REDE\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u578b\u63a8\u7406\u6a21\u578b\u7684\u63a8\u7406\u8f68\u8ff9\u53bb\u566a\u6846\u67b6\uff0c\u7528\u4e8e\u63d0\u5347\u6700\u7ec8\u7b54\u6848\u5e7b\u89c9\u68c0\u6d4b\u3002\u5b83\u8bc6\u522b\u5e76\u8fc7\u6ee4\u63a8\u7406\u4e2d\u7684\u65e0\u5173\u6b65\u9aa4\u548c\u91cd\u590d\u6b65\u9aa4\uff0c\u4fdd\u7559\u66f4\u80fd\u53cd\u6620\u771f\u5b9e\u6027\u7684\u63a8\u7406\u4fe1\u53f7\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22098", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u5927\u578b\u63a8\u7406\u6a21\u578b\u957f\u63a8\u7406\u94fe\u4e2d\u5e38\u89c1\u4e24\u7c7b\u566a\u58f0\uff1a\u65e0\u5173\u6b65\u9aa4\u4e0e\u91cd\u590d\u6b65\u9aa4\uff0c\u4e14\u4f1a\u663e\u8457\u524a\u5f31\u5e7b\u89c9\u68c0\u6d4b\u6548\u679c", "\u5229\u7528\u6700\u7ec8\u7b54\u6848\u6ce8\u610f\u529b\u4f5c\u4e3a\u81ea\u52a8\u76d1\u7763\u4fe1\u53f7\uff0c\u5b66\u4e60\u66f4\u9002\u5408\u533a\u5206\u566a\u58f0\u4e0e\u6709\u6548\u6b65\u9aa4\u7684\u6b65\u9aa4\u7ea7\u8868\u793a\u7a7a\u95f4", "REDE \u53ef\u4f5c\u4e3a\u63d2\u4ef6\u63a5\u5165\u591a\u79cd\u5e7b\u89c9\u68c0\u6d4b\u5668\uff0c\u5728\u591a\u4e2a\u63a8\u7406\u57fa\u51c6\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u7f6e\u4fe1\u5ea6\u6253\u5206\u548c\u6734\u7d20\u5d4c\u5165\u8fc7\u6ee4\u7b49\u57fa\u7ebf"], "keywords": ["\u5e7b\u89c9\u68c0\u6d4b", "\u63a8\u7406\u6a21\u578b", "\u8868\u793a\u5b66\u4e60", "\u53ef\u4fe1AI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22098v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Reasoning Denoiser: Denoising Reasoning Traces for Hallucination Detection in Large Reasoning Models", "tldr": "\u7528\u63a8\u7406\u8f68\u8ff9\u53bb\u566a\u63d0\u5347\u5e7b\u89c9\u68c0\u6d4b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa REDE\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u578b\u63a8\u7406\u6a21\u578b\u7684\u63a8\u7406\u8f68\u8ff9\u53bb\u566a\u6846\u67b6\uff0c\u7528\u4e8e\u63d0\u5347\u6700\u7ec8\u7b54\u6848\u5e7b\u89c9\u68c0\u6d4b\u3002\u5b83\u8bc6\u522b\u5e76\u8fc7\u6ee4\u63a8\u7406\u4e2d\u7684\u65e0\u5173\u6b65\u9aa4\u548c\u91cd\u590d\u6b65\u9aa4\uff0c\u4fdd\u7559\u66f4\u80fd\u53cd\u6620\u771f\u5b9e\u6027\u7684\u63a8\u7406\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5927\u578b\u63a8\u7406\u6a21\u578b\u7684\u957f\u63a8\u7406\u8f68\u8ff9\u4ece\u201c\u76f4\u63a5\u4f7f\u7528\u201d\u8f6c\u5411\u201c\u5148\u53bb\u566a\u518d\u68c0\u6d4b\u201d\uff0c\u4e3a\u5229\u7528\u4e2d\u95f4\u63a8\u7406\u8fc7\u7a0b\u505a\u53ef\u9760\u6027\u8bc4\u4f30\u63d0\u4f9b\u4e86\u66f4\u5b9e\u7528\u7684\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u590d\u6742\u63a8\u7406\u4efb\u52a1\u4e2d\u7684\u5e7b\u89c9\u8bc6\u522b\u80fd\u529b\u3002"}, {"abstract": "Full self-attention in large language models scales as O(N^2), which limits long-context document analysis to 65,536 tokens and requires costly GPU clusters. The Reduced Interaction Sampling (RIS) inference engine addresses this constraint as a model-agnostic architecture. Without modifying weights, RIS reduces self-attention complexity to O(N log N) using sparse stochastic geometry that fits within commodity memory limits. We validate RIS on Qwen2-1.5B-Instruct across two regimes. In controlled evaluations at 32,768 tokens (where native dense attention serves as the upper bound), RIS-Stochastic at 1% density and 70 ensemble seeds achieves 75.00% accuracy, outperforming the native dense baseline (71.88%), while RIS-Stochastic at 5% density and 10 seeds matches it (71.88%). This demonstrates that sparse attention acts as a regularizer: low density (1%) over multiple seeds filters out sequence-level noise, whereas higher density (5%) reintroduces distractor noise. Under the tightest budget, RIS-Structural reaches 68.75% accuracy at 1% density with just 10 seeds, recovering 75% of the contextual gap relative to the zero-context floor (59.38%). At 65,536 tokens, where dense attention triggers out-of-memory faults, RIS yields retrieval gains of up to 14.06 percentage points over the zero-context floor (51.56%), which is confirmed as marginally significant under McNemar\u0027s paired test (p = 0.078 \u003c 0.10). All evaluations run on commodity, unaccelerated CPU servers (16-128 GB of RAM), demonstrating that long-context LLM inference is feasible on standard academic hardware without GPU acceleration.", "arxiv_id": "2607.21927", "arxiv_url": "https://arxiv.org/abs/2607.21927", "authors": ["Anderson R. Santos"], "brief": "\u8bba\u6587\u63d0\u51fa RIS-Kernel\uff0c\u4e00\u79cd\u6a21\u578b\u65e0\u5173\u7684\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u67b6\u6784\uff0c\u65e0\u9700\u6539\u6743\u91cd\u5373\u53ef\u7528\u7a00\u758f\u968f\u673a\u51e0\u4f55\u5c06\u81ea\u6ce8\u610f\u529b\u590d\u6742\u5ea6\u4ece O(N^2) \u964d\u5230 O(N log N)\u3002\u4f5c\u8005\u5728 Qwen2-1.5B-Instruct \u4e0a\u9a8c\u8bc1\u5176\u53ef\u5728\u666e\u901aCPU\u5185\u5b58\u73af\u5883\u4e0b\u5904\u7406 32K-65K token \u957f\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21927", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["RIS \u901a\u8fc7\u4f4e\u5bc6\u5ea6\u7a00\u758f\u6ce8\u610f\u529b\u91c7\u6837\u66ff\u4ee3\u5168\u91cf\u81ea\u6ce8\u610f\u529b\uff0c\u4e0d\u4fee\u6539\u6a21\u578b\u53c2\u6570\uff0c\u76ee\u6807\u662f\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u7684\u663e\u5b58/\u5185\u5b58\u9700\u6c42\u3002", "\u5728 32,768 token \u8bc4\u6d4b\u4e2d\uff0cRIS-Stochastic \u4ee5 1% \u5bc6\u5ea6\u300170 \u4e2a ensemble seeds \u8fbe\u5230 75.00% \u51c6\u786e\u7387\uff0c\u9ad8\u4e8e dense attention \u57fa\u7ebf\u7684 71.88%\u3002", "\u5728 65,536 token \u573a\u666f\u4e2d\uff0cdense attention \u4f1a OOM\uff0c\u800c RIS \u5728 16-128GB RAM \u7684\u666e\u901aCPU\u670d\u52a1\u5668\u4e0a\u8fd0\u884c\uff0c\u5e76\u76f8\u5bf9\u96f6\u4e0a\u4e0b\u6587\u57fa\u7ebf\u6700\u9ad8\u63d0\u5347 14.06 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u7a00\u758f\u6ce8\u610f\u529b", "\u63a8\u7406\u4f18\u5316", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.21927v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RIS-Kernel: A Model-Agnostic Architecture for Long-Context LLM Inference via Sparse Attention", "tldr": "\u7528\u7a00\u758f\u6ce8\u610f\u529b\u5728CPU\u4e0a\u8dd1\u957f\u4e0a\u4e0b\u6587LLM", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RIS-Kernel\uff0c\u4e00\u79cd\u6a21\u578b\u65e0\u5173\u7684\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u67b6\u6784\uff0c\u65e0\u9700\u6539\u6743\u91cd\u5373\u53ef\u7528\u7a00\u758f\u968f\u673a\u51e0\u4f55\u5c06\u81ea\u6ce8\u610f\u529b\u590d\u6742\u5ea6\u4ece O(N^2) \u964d\u5230 O(N log N)\u3002\u4f5c\u8005\u5728 Qwen2-1.5B-Instruct \u4e0a\u9a8c\u8bc1\u5176\u53ef\u5728\u666e\u901aCPU\u5185\u5b58\u73af\u5883\u4e0b\u5904\u7406 32K-65K token \u957f\u4e0a\u4e0b\u6587\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u65e0\u9700\u8bad\u7ec3\u6216\u6539\u6a21\u578b\u6743\u91cd\u7684\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u8def\u5f84\uff0c\u53ef\u80fd\u663e\u8457\u964d\u4f4e\u957f\u6587\u6863\u5206\u6790\u5bf9GPU\u96c6\u7fa4\u7684\u4f9d\u8d56\uff1b\u5176\u7a00\u758f\u6ce8\u610f\u529b\u8fd8\u8868\u73b0\u51fa\u7c7b\u4f3c\u6b63\u5219\u5316\u7684\u6548\u679c\uff0c\u5728\u4f4e\u5bc6\u5ea6\u591a\u91c7\u6837\u4e0b\u53ef\u80fd\u8fc7\u6ee4\u4e0a\u4e0b\u6587\u566a\u58f0\u3002"}, {"abstract": "Model merging plays a crucial role in consolidating multiple specialized models into a single, unified model, especially in the era of large language models (LLMs). Recent research has primarily focused on developing strategies to enhance merging performance with the trained models, while the impact of training paradigms, such as supervised fine-tuning (SFT) and reinforcement learning (RL), on the effectiveness of model merging remains underexplored. In this study, we systematically explore the merging behavior of RL-trained LLMs compared to those trained with traditional SFT. Through comprehensive evaluations across five representative tasks, we find that RL significantly reduces task conflicts and results in less performance degradation after merging, making RL-trained models particularly well-suited for this process. To unearth the reasons behind the superior suitability of RL for model merging, we conduct extensive empirical experiments and theoretical analyses. Our findings highlight three key factors: (1) On-policy training data in RL control the gradient updates in a smaller magnitude, reducing the risk of overwriting existing knowledge for other tasks in the model. (2) The RL optimization objective, which favors ``\\textit{enough is as good as a feast}\", progressively reduces the magnitude and the number of conflict parameter updates as the model converges. (3) Joint optimization of positive and negative examples in RL steers the model towards an unbiased task-specific parameter subspace, ensuring robust performance while further preventing parameter conflicts.", "arxiv_id": "2607.22039", "arxiv_url": "https://arxiv.org/abs/2607.22039", "authors": ["Zixuan Ren", "Jinliang Lu", "Junhong Wu", "Yang Zhao", "Dai Dai", "Hua Wu", "Haifeng Wang", "Chengqing Zong"], "brief": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u5f3a\u5316\u5b66\u4e60\uff08RL\uff09\u4e0e\u76d1\u7763\u5fae\u8c03\uff08SFT\uff09\u8bad\u7ec3\u540e\u7684\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6a21\u578b\u5408\u5e76\u4e2d\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\uff0cRL\u8bad\u7ec3\u6a21\u578b\u5728\u4e94\u7c7b\u4ee3\u8868\u6027\u4efb\u52a1\u4e0a\u5408\u5e76\u540e\u6027\u80fd\u9000\u5316\u66f4\u5c0f\uff0c\u5e76\u4ece\u7ecf\u9a8c\u4e0e\u7406\u8bba\u4e0a\u89e3\u91ca\u4e86\u5176\u539f\u56e0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22039", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["RL\u7684on-policy\u8bad\u7ec3\u6570\u636e\u4f7f\u68af\u5ea6\u66f4\u65b0\u5e45\u5ea6\u66f4\u5c0f\uff0c\u964d\u4f4e\u8986\u76d6\u5176\u4ed6\u4efb\u52a1\u77e5\u8bc6\u7684\u98ce\u9669\u3002", "RL\u76ee\u6807\u5448\u73b0\u201c\u591f\u597d\u5373\u53ef\u201d\u7684\u4f18\u5316\u7279\u6027\uff0c\u968f\u7740\u6536\u655b\u9010\u6b65\u51cf\u5c11\u51b2\u7a81\u53c2\u6570\u66f4\u65b0\u7684\u5e45\u5ea6\u548c\u6570\u91cf\u3002", "RL\u540c\u65f6\u5229\u7528\u6b63\u8d1f\u6837\u672c\u8fdb\u884c\u4f18\u5316\uff0c\u5c06\u6a21\u578b\u63a8\u5411\u66f4\u65e0\u504f\u7684\u4efb\u52a1\u7279\u5b9a\u53c2\u6570\u5b50\u7a7a\u95f4\uff0c\u4ece\u800c\u7f13\u89e3\u53c2\u6570\u51b2\u7a81\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u5408\u5e76", "\u591a\u4efb\u52a1\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22039v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Enough is as good as a feast: A Comprehensive Analysis of How Reinforcement Learning Mitigates Task Conflicts in LLMs", "tldr": "RL\u8bad\u7ec3\u8ba9LLM\u5408\u5e76\u65f6\u4efb\u52a1\u51b2\u7a81\u66f4\u5c11\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u5f3a\u5316\u5b66\u4e60\uff08RL\uff09\u4e0e\u76d1\u7763\u5fae\u8c03\uff08SFT\uff09\u8bad\u7ec3\u540e\u7684\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6a21\u578b\u5408\u5e76\u4e2d\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\uff0cRL\u8bad\u7ec3\u6a21\u578b\u5728\u4e94\u7c7b\u4ee3\u8868\u6027\u4efb\u52a1\u4e0a\u5408\u5e76\u540e\u6027\u80fd\u9000\u5316\u66f4\u5c0f\uff0c\u5e76\u4ece\u7ecf\u9a8c\u4e0e\u7406\u8bba\u4e0a\u89e3\u91ca\u4e86\u5176\u539f\u56e0\u3002", "why_notable": "\u8be5\u7814\u7a76\u4ece\u8bad\u7ec3\u8303\u5f0f\u89d2\u5ea6\u89e3\u91ca\u4e86\u4e3a\u4ec0\u4e48RL\u8bad\u7ec3\u6a21\u578b\u66f4\u9002\u5408\u6a21\u578b\u5408\u5e76\uff0c\u4e3a\u591a\u4efb\u52a1LLM\u6574\u5408\u3001\u51cf\u5c11\u707e\u96be\u6027\u5e72\u6270\u548c\u63d0\u5347\u5408\u5e76\u9c81\u68d2\u6027\u63d0\u4f9b\u4e86\u65b0\u7684\u5b9e\u8df5\u4f9d\u636e\u3002"}, {"abstract": "We introduce time-reversed imaging, a new paradigm that infers what just happened in a scene from fading multimodal traces. Instead of extrapolating or interpolating video frames, our goal is to infer past human-environment interactions from residual physical imprints observable in thermal, ultraviolet, and visible spectra. To study this problem, we present TRACE-HEI, the first proof-of-concept dataset for time-reversed imaging, containing synchronized tri-modal video sequences of actions such as sitting, touching, moving objects, and liquid spills, captured across diverse materials and recorded up to three minutes after contact. To establish the benchmark, we propose a multimodal inference approach that extracts structured textual descriptions of detected traces and uses them to constrain a vision-language-guided diffusion model for reconstructing plausible past frames. Experiments show that inferring recent events from fading traces is challenging but feasible when complementary modalities reduce solution ambiguity. This work defines the first computational and experimental foundation for time-reversed imaging, bridging vision, physics, and generative reasoning, and opening new directions for scene understanding beyond instantaneous observation.", "arxiv_id": "2607.22352", "arxiv_url": "https://arxiv.org/abs/2607.22352", "authors": ["Jorge Bacca", "Kebin Contreras", "Luis Toscano-Palomino", "Mauro Dalla Mura"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u65f6\u95f4\u53cd\u8f6c\u6210\u50cf\u201d\u65b0\u4efb\u52a1\uff1a\u4ece\u70ed\u6210\u50cf\u3001\u7d2b\u5916\u548c\u53ef\u89c1\u5149\u4e2d\u9010\u6e10\u6d88\u9000\u7684\u7269\u7406\u75d5\u8ff9\uff0c\u63a8\u65ad\u8fc7\u53bb\u7684\u4eba-\u73af\u5883\u4ea4\u4e92\u3002\u4f5c\u8005\u6784\u5efa TRACE-HEI \u6570\u636e\u96c6\uff0c\u5e76\u7528\u7ed3\u6784\u5316\u75d5\u8ff9\u63cf\u8ff0\u7ea6\u675f\u89c6\u89c9\u8bed\u8a00\u5f15\u5bfc\u7684\u6269\u6563\u6a21\u578b\u6765\u751f\u6210\u53ef\u80fd\u7684\u8fc7\u53bb\u5e27\u3002", "categories": ["cs.CV", "cs.AI", "eess.IV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22352", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["TRACE-HEI \u662f\u9996\u4e2a\u65f6\u95f4\u53cd\u8f6c\u6210\u50cf\u6982\u5ff5\u9a8c\u8bc1\u6570\u636e\u96c6\uff0c\u5305\u542b\u5750\u4e0b\u3001\u89e6\u6478\u3001\u79fb\u52a8\u7269\u4f53\u3001\u6db2\u4f53\u6cfc\u6d12\u7b49\u52a8\u4f5c\u7684\u540c\u6b65\u4e09\u6a21\u6001\u89c6\u9891\u3002", "\u6570\u636e\u8986\u76d6\u591a\u79cd\u6750\u6599\uff0c\u5e76\u5728\u63a5\u89e6\u540e\u6700\u957f\u4e09\u5206\u949f\u5185\u8bb0\u5f55\u70ed\u3001\u7d2b\u5916\u3001\u53ef\u89c1\u5149\u6b8b\u7559\u75d5\u8ff9\u3002", "\u65b9\u6cd5\u5148\u63d0\u53d6\u75d5\u8ff9\u7684\u7ed3\u6784\u5316\u6587\u672c\u63cf\u8ff0\uff0c\u518d\u7528\u4e8e\u7ea6\u675f\u89c6\u89c9\u8bed\u8a00\u5f15\u5bfc\u6269\u6563\u6a21\u578b\uff0c\u964d\u4f4e\u8fc7\u53bb\u573a\u666f\u91cd\u5efa\u7684\u6b67\u4e49\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u6269\u6563\u6a21\u578b", "\u573a\u666f\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22352v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Time-Reversed Imaging: A Multimodal Benchmark and Framework for Reconstructing Past Human-Environment Interactions", "tldr": "\u7528\u591a\u6a21\u6001\u6b8b\u7559\u75d5\u8ff9\u91cd\u5efa\u521a\u53d1\u751f\u7684\u573a\u666f\u4e8b\u4ef6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u65f6\u95f4\u53cd\u8f6c\u6210\u50cf\u201d\u65b0\u4efb\u52a1\uff1a\u4ece\u70ed\u6210\u50cf\u3001\u7d2b\u5916\u548c\u53ef\u89c1\u5149\u4e2d\u9010\u6e10\u6d88\u9000\u7684\u7269\u7406\u75d5\u8ff9\uff0c\u63a8\u65ad\u8fc7\u53bb\u7684\u4eba-\u73af\u5883\u4ea4\u4e92\u3002\u4f5c\u8005\u6784\u5efa TRACE-HEI \u6570\u636e\u96c6\uff0c\u5e76\u7528\u7ed3\u6784\u5316\u75d5\u8ff9\u63cf\u8ff0\u7ea6\u675f\u89c6\u89c9\u8bed\u8a00\u5f15\u5bfc\u7684\u6269\u6563\u6a21\u578b\u6765\u751f\u6210\u53ef\u80fd\u7684\u8fc7\u53bb\u5e27\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u573a\u666f\u7406\u89e3\u4ece\u201c\u89c2\u5bdf\u5f53\u524d\u201d\u6269\u5c55\u5230\u201c\u63a8\u65ad\u521a\u521a\u53d1\u751f\u8fc7\u4ec0\u4e48\u201d\uff0c\u7ed3\u5408\u591a\u6a21\u6001\u611f\u77e5\u3001\u7269\u7406\u75d5\u8ff9\u4e0e\u751f\u6210\u5f0f\u63a8\u7406\uff0c\u4e3a\u53d6\u8bc1\u3001\u673a\u5668\u4eba\u611f\u77e5\u548c\u73af\u5883\u7406\u89e3\u63d0\u4f9b\u4e86\u65b0\u7684\u57fa\u51c6\u4e0e\u7814\u7a76\u65b9\u5411\u3002"}, {"abstract": "Diffusion models have recently achieved remarkable success in high-fidelity image synthesis, yet their application to visual text generation and editing remains relatively underexplored. Unlike general image generation, visual text tasks demand precise structural regularity and legibility, which may pose additional challenges for small-scale text and non-Latin scripts such as Chinese. Existing UNet-based models often struggle to produce clear and coherent text, while DiT-based models, though more expressive, are typically limited to a single task, which may lead to redundant training pipelines, inconsistent visual styles, and reduced cross-task generalization. To address these challenges, we propose InnoText, a unified DiT-based framework capable of performing both text generation and editing within a single model. We introduce a Font Size-Aware Modulation (FSAM) module to enhance representations across font scales, a Small-Character Aware Augmentation strategy to improve fine-grained fidelity, and a Task-Specific Region Weighted Loss for adaptive optimization. To support training and evaluation, we also construct a high-quality bilingual (English-Chinese) visual text dataset covering diverse fonts, sizes, and backgrounds. Experimental results demonstrate that our method achieves superior generation accuracy and editing quality, producing visually appealing and realistic text images.", "arxiv_id": "2607.22101", "arxiv_url": "https://arxiv.org/abs/2607.22101", "authors": ["Haowei Liu", "Runze He", "Jian Lu", "Ao Ma", "Run Ling", "Ke Cao", "Jiasong Feng", "Wei Feng", "Shuo Lu", "Yexing Xu", "Yun Wang", "Jing Wang", "Zhanjie Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa InnoText\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684 DiT-based \u6846\u67b6\uff0c\u5728\u5355\u4e00\u6a21\u578b\u5185\u540c\u65f6\u652f\u6301\u89c6\u89c9\u6587\u5b57\u751f\u6210\u4e0e\u7f16\u8f91\u3002\u5b83\u9762\u5411\u5c0f\u5b57\u53f7\u4e0e\u4e2d\u6587\u7b49\u975e\u62c9\u4e01\u6587\u5b57\u7684\u53ef\u8bfb\u6027\u96be\u9898\uff0c\u6784\u5efa\u4e86\u9ad8\u8d28\u91cf\u4e2d\u82f1\u53cc\u8bed\u89c6\u89c9\u6587\u5b57\u6570\u636e\u96c6\u5e76\u9a8c\u8bc1\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22101", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165 Font Size-Aware Modulation\uff08FSAM\uff09\uff0c\u589e\u5f3a\u4e0d\u540c\u5b57\u53f7\u4e0b\u7684\u6587\u5b57\u7ed3\u6784\u4e0e\u7279\u5f81\u8868\u793a\u80fd\u529b\u3002", "\u63d0\u51fa Small-Character Aware Augmentation\uff0c\u63d0\u5347\u5c0f\u5b57\u7b26\u548c\u7ec6\u7c92\u5ea6\u7b14\u753b\u7684\u751f\u6210\u6e05\u6670\u5ea6\u3002", "\u8bbe\u8ba1 Task-Specific Region Weighted Loss\uff0c\u9488\u5bf9\u751f\u6210\u4e0e\u7f16\u8f91\u4efb\u52a1\u7684\u5173\u952e\u533a\u57df\u8fdb\u884c\u81ea\u9002\u5e94\u4f18\u5316\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001", "\u56fe\u50cf\u7f16\u8f91", "\u6587\u5b57\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22101v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "InnoText: A Unified Model for Visual Text Generation and Editing", "tldr": "\u7edf\u4e00DiT\u6a21\u578b\u63d0\u5347\u4e2d\u82f1\u89c6\u89c9\u6587\u5b57\u751f\u6210\u7f16\u8f91", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa InnoText\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684 DiT-based \u6846\u67b6\uff0c\u5728\u5355\u4e00\u6a21\u578b\u5185\u540c\u65f6\u652f\u6301\u89c6\u89c9\u6587\u5b57\u751f\u6210\u4e0e\u7f16\u8f91\u3002\u5b83\u9762\u5411\u5c0f\u5b57\u53f7\u4e0e\u4e2d\u6587\u7b49\u975e\u62c9\u4e01\u6587\u5b57\u7684\u53ef\u8bfb\u6027\u96be\u9898\uff0c\u6784\u5efa\u4e86\u9ad8\u8d28\u91cf\u4e2d\u82f1\u53cc\u8bed\u89c6\u89c9\u6587\u5b57\u6570\u636e\u96c6\u5e76\u9a8c\u8bc1\u6548\u679c\u3002", "why_notable": "\u89c6\u89c9\u6587\u5b57\u751f\u6210\u8981\u6c42\u9ad8\u7ed3\u6784\u89c4\u6574\u6027\u548c\u53ef\u8bfb\u6027\uff0c\u5c24\u5176\u5728\u5c0f\u5b57\u53f7\u4e0e\u4e2d\u6587\u573a\u666f\u4e2d\u66f4\u5177\u6311\u6218\u3002InnoText \u5c06\u751f\u6210\u548c\u7f16\u8f91\u7edf\u4e00\u5230\u4e00\u4e2a\u6a21\u578b\u4e2d\uff0c\u51cf\u5c11\u91cd\u590d\u8bad\u7ec3\u6d41\u7a0b\uff0c\u5e76\u63d0\u5347\u8de8\u4efb\u52a1\u4e00\u81f4\u6027\u4e0e\u5b9e\u7528\u6027\u3002"}, {"abstract": "This paper introduces a new benchmark test, Medical-Checklist, for assessing medical multimodal models. The recent advancements in multimodal models have demonstrated significant potential in the field of medical vision-language tasks. However, it is becoming increasingly clear that evaluating these models\u0027 performance, whether they are applied to natural or medical images, is challenging. The critical question is whether the models can accurately understand an input image while associating it with relevant input text. To address this, Medical-Checklist imposes a binary test on the models: they are given an image and two captions, where one is correct and the other incorrect, and the model must select the correct one. The incorrect caption contains a single medical concept (word or phrase) that is inaccurately substituted from the correct caption. Although the task is simple, this simplicity enables the unified assessment of diverse multimodal models designed and learned on different principles. It also enables us to verify whether models correctly understand a wide range of medical concepts across various medical sub-domains. Medical-Checklist is designed to reduce potential biases in data and to enable evaluation of the models\u0027 ability to handle out-of-distribution inputs, which were difficult in existing datasets. When evaluating four state-of-the-art medical multimodal models with Medical-Checklist, it was revealed that despite their excellent performance in specific tasks such as Med-VQA, they may not correctly understand images, suggesting a long journey ahead for clinical application. The dataset and code will be made public upon acceptance.", "arxiv_id": "2607.21998", "arxiv_url": "https://arxiv.org/abs/2607.21998", "authors": ["Bannapol Limanond", "Masanori Suganuma", "Takayuki Okatani"], "brief": "\u8bba\u6587\u63d0\u51fa Medical-Checklist\uff0c\u4e00\u4e2a\u9762\u5411\u533b\u5b66\u591a\u6a21\u6001\u6a21\u578b\u7684\u65b0\u57fa\u51c6\u3002\u5b83\u7ed9\u5b9a\u533b\u5b66\u56fe\u50cf\u4e0e\u4e24\u6761\u63cf\u8ff0\uff0c\u8ba9\u6a21\u578b\u9009\u62e9\u6b63\u786e\u63cf\u8ff0\uff0c\u5176\u4e2d\u9519\u8bef\u63cf\u8ff0\u4ec5\u66ff\u6362\u4e00\u4e2a\u533b\u5b66\u6982\u5ff5\uff0c\u4ee5\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u771f\u6b63\u7406\u89e3\u56fe\u50cf\u4e0e\u6587\u672c\u5bf9\u5e94\u5173\u7cfb\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21998", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u7b80\u5355\u7684\u4e8c\u5206\u7c7b caption \u9009\u62e9\u4efb\u52a1\uff0c\u4fbf\u4e8e\u7edf\u4e00\u8bc4\u4f30\u4e0d\u540c\u67b6\u6784\u548c\u8bad\u7ec3\u65b9\u5f0f\u7684\u533b\u5b66\u591a\u6a21\u6001\u6a21\u578b", "\u9519\u8bef\u63cf\u8ff0\u901a\u8fc7\u66ff\u6362\u5355\u4e2a\u533b\u5b66\u8bcd\u6216\u77ed\u8bed\u6784\u9020\uff0c\u53ef\u7ec6\u7c92\u5ea6\u68c0\u67e5\u6a21\u578b\u5bf9\u591a\u533b\u5b66\u5b50\u9886\u57df\u6982\u5ff5\u7684\u7406\u89e3", "\u8bc4\u6d4b4\u4e2a\u5148\u8fdb\u533b\u5b66\u591a\u6a21\u6001\u6a21\u578b\u53d1\u73b0\uff0c\u5373\u4f7f\u5728 Med-VQA \u7b49\u4efb\u52a1\u8868\u73b0\u8f83\u597d\uff0c\u4e5f\u53ef\u80fd\u672a\u771f\u6b63\u7406\u89e3\u533b\u5b66\u56fe\u50cf"], "keywords": ["\u533b\u5b66\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00", "\u57fa\u51c6\u8bc4\u6d4b", "\u533b\u5b66\u5f71\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.21998v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Medical-Checklist: Assessing the Comprehension of Medical Images by Multimodal Models", "tldr": "\u7528\u4e8c\u9009\u4e00\u6e05\u5355\u8bc4\u6d4b\u533b\u5b66\u591a\u6a21\u6001\u56fe\u50cf\u7406\u89e3", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Medical-Checklist\uff0c\u4e00\u4e2a\u9762\u5411\u533b\u5b66\u591a\u6a21\u6001\u6a21\u578b\u7684\u65b0\u57fa\u51c6\u3002\u5b83\u7ed9\u5b9a\u533b\u5b66\u56fe\u50cf\u4e0e\u4e24\u6761\u63cf\u8ff0\uff0c\u8ba9\u6a21\u578b\u9009\u62e9\u6b63\u786e\u63cf\u8ff0\uff0c\u5176\u4e2d\u9519\u8bef\u63cf\u8ff0\u4ec5\u66ff\u6362\u4e00\u4e2a\u533b\u5b66\u6982\u5ff5\uff0c\u4ee5\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u771f\u6b63\u7406\u89e3\u56fe\u50cf\u4e0e\u6587\u672c\u5bf9\u5e94\u5173\u7cfb\u3002", "why_notable": "\u8be5\u57fa\u51c6\u9488\u5bf9\u533b\u5b66\u591a\u6a21\u6001\u8bc4\u6d4b\u4e2d\u7684\u504f\u5dee\u548c\u5206\u5e03\u5916\u6cdb\u5316\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u66f4\u76f4\u63a5\u7684\u56fe\u50cf\u7406\u89e3\u8bca\u65ad\u5de5\u5177\uff0c\u5bf9\u4e34\u5e8a\u5e94\u7528\u524d\u7684\u53ef\u9760\u6027\u8bc4\u4f30\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Electroencephalography (EEG) is widely used to diagnose neurological conditions, but its analysis usually relies on either predefined spectral features or deep neural networks. Predefined features carry a strong bias, since they fix in advance what counts as informative, while deep neural networks and foundation models are hard to interpret and need large amounts of data and compute. We present bag-of-waves, an interpretable framework that learns a small dictionary of recurring EEG waveform templates, called atoms, using shift-invariant k-means without labels. The continuous EEG is then turned into a sequence of atom tokens, whose counts feed a simple downstream classifier or clustering step. We extend this representation in two ways: we add atom-to-atom transitions, which we call n- grams, to capture temporal structure, and we move from single-channel atoms to regional and cross-channel spatial atoms for the multichannel case. We test the method on three complementary datasets, each probing a different aspect: single-channel mouse genotype clustering with only sixteen animals (the low-data and temporal case), resting-state dementia classification (the spatial case), and the TUEV benchmark, a six-way classification of clinical EEG events (a high-data comparison against strong deep and foundation baselines). Across all three datasets, bag-of-waves achieves performance competitive with state-of-the-art deep and foundation models. Yet, it operates with a fraction of the parameter count and provides full interpretability: because every atom corresponds to an inspectable waveform, the method explicitly recovers known clinical morphologies that a neurophysiologist can directly validate. Its main advantage is that it works in the low-data regime where heavier models are a poor fit.", "arxiv_id": "2607.22508", "arxiv_url": "https://arxiv.org/abs/2607.22508", "authors": ["Athanasios Papastathopoulos-Katsaros", "Steven T. Lee", "Lin Yao", "Ajay Thomas", "Junseok Park", "Matthew J. McGinley", "Zhandong Liu"], "brief": "\u8bba\u6587\u63d0\u51fa bag-of-waves\uff0c\u4e00\u79cd\u65e0\u76d1\u7763\u5b66\u4e60 EEG \u91cd\u590d\u6ce2\u5f62\u6a21\u677f\uff08atoms\uff09\u7684\u53ef\u89e3\u91ca\u6846\u67b6\uff0c\u5e76\u5c06\u8fde\u7eed EEG \u8f6c\u4e3a atom token \u8ba1\u6570\u7528\u4e8e\u5206\u7c7b\u6216\u805a\u7c7b\u3002\u65b9\u6cd5\u8fdb\u4e00\u6b65\u52a0\u5165 atom \u8f6c\u79fb n-gram \u6355\u6349\u65f6\u95f4\u7ed3\u6784\uff0c\u5e76\u6269\u5c55\u5230\u533a\u57df\u4e0e\u8de8\u901a\u9053\u7a7a\u95f4 atoms \u4ee5\u5904\u7406\u591a\u901a\u9053 EEG\u3002", "categories": ["cs.LG", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22508", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528 shift-invariant k-means \u5728\u65e0\u6807\u7b7e\u6570\u636e\u4e2d\u5b66\u4e60\u5c11\u91cf\u53ef\u68c0\u67e5\u7684 EEG \u6ce2\u5f62\u5b57\u5178\uff0c\u907f\u514d\u624b\u5de5\u9891\u8c31\u7279\u5f81\u504f\u7f6e\u4e0e\u6df1\u5ea6\u6a21\u578b\u9ed1\u7bb1\u95ee\u9898\u3002", "\u901a\u8fc7 atom \u8ba1\u6570\u3001atom-to-atom n-gram\u3001\u5355\u901a\u9053/\u533a\u57df/\u8de8\u901a\u9053\u7a7a\u95f4 atoms \u540c\u65f6\u5efa\u6a21\u4f4e\u6570\u636e\u3001\u65f6\u95f4\u52a8\u6001\u4e0e\u7a7a\u95f4\u7ed3\u6784\u3002", "\u5728\u5c0f\u9f20\u57fa\u56e0\u578b\u805a\u7c7b\u3001\u9759\u606f\u6001\u75f4\u5446\u5206\u7c7b\u548c TUEV \u4e34\u5e8a\u4e8b\u4ef6\u516d\u5206\u7c7b\u4e0a\uff0c\u6027\u80fd\u63a5\u8fd1\u6df1\u5ea6\u6a21\u578b\u548c\u57fa\u7840\u6a21\u578b\uff0c\u4f46\u53c2\u6570\u66f4\u5c11\u4e14\u53ef\u89e3\u91ca\u3002"], "keywords": ["\u8111\u7535\u5206\u6790", "\u53ef\u89e3\u91ca\u673a\u5668\u5b66\u4e60", "\u4f4e\u6570\u636e\u5b66\u4e60", "\u4fe1\u53f7\u5904\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22508v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Interpretable EEG biomarkers with bag-of-waves: Spatial and temporal waveform dictionaries for low-data regimes", "tldr": "\u7528\u53ef\u89e3\u91ca\u6ce2\u5f62\u5b57\u5178\u505a\u4f4e\u6570\u636eEEG\u5206\u6790", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa bag-of-waves\uff0c\u4e00\u79cd\u65e0\u76d1\u7763\u5b66\u4e60 EEG \u91cd\u590d\u6ce2\u5f62\u6a21\u677f\uff08atoms\uff09\u7684\u53ef\u89e3\u91ca\u6846\u67b6\uff0c\u5e76\u5c06\u8fde\u7eed EEG \u8f6c\u4e3a atom token \u8ba1\u6570\u7528\u4e8e\u5206\u7c7b\u6216\u805a\u7c7b\u3002\u65b9\u6cd5\u8fdb\u4e00\u6b65\u52a0\u5165 atom \u8f6c\u79fb n-gram \u6355\u6349\u65f6\u95f4\u7ed3\u6784\uff0c\u5e76\u6269\u5c55\u5230\u533a\u57df\u4e0e\u8de8\u901a\u9053\u7a7a\u95f4 atoms \u4ee5\u5904\u7406\u591a\u901a\u9053 EEG\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u4f4e\u6570\u636e EEG \u573a\u666f\u4e2d\u517c\u5177\u7ade\u4e89\u6027\u80fd\u4e0e\u4e34\u5e8a\u53ef\u89e3\u91ca\u6027\uff0c\u6bcf\u4e2a atom \u90fd\u5bf9\u5e94\u53ef\u7531\u795e\u7ecf\u751f\u7406\u5b66\u4e13\u5bb6\u9a8c\u8bc1\u7684\u5177\u4f53\u6ce2\u5f62\u5f62\u6001\uff0c\u9002\u5408\u6570\u636e\u7a00\u7f3a\u3001\u7b97\u529b\u6709\u9650\u4e14\u9700\u8981\u53ef\u89e3\u91ca\u8bca\u65ad\u4f9d\u636e\u7684\u795e\u7ecf\u79d1\u5b66\u4e0e\u4e34\u5e8a\u5e94\u7528\u3002"}, {"abstract": "In overparameterized linear regression, many weak spectral directions act like a ridge penalty on the signal-bearing spectrum; negative ridge is the natural correction, pushing filters above one. The stable negative-ridge endpoint, however, is structurally limited: its pole must stay below the smallest nonzero empirical eigenvalue, and it anti-shrinks smaller eigenvalues more than larger ones. Early-stopped negative-shifted gradient descent escapes this constraint. Its filter is smooth at the would-be pole and mixed-sign-capable: above-ridgeless directions form a leading prefix, with lower directions shrunk or exposure-controlled while stopping sets the crossover. In a Gaussian spike-plus-flat model we discover a Marchenko-Pastur barrier: the shift that cancels the implicit penalty lies a bulk width above the smallest empirical eigenvalue, and the stopped path improves on every admissible endpoint by a polynomial factor in risk under explicit conditions. Our main theorem permits a general high-effective-rank tail: its trace sets the implicit floor, its squared spectrum controls exposure, and the floor-critical path recovers all head scales at once, beyond positive shrinkage and, once scales separate, every uniform rescaling of ridgeless. Handling the noncontractive shifted dynamics is the central technical challenge; localized Duhamel integrals control them. A finite-grid hold-out inequality transfers the separations to the validation-selected algorithm.", "arxiv_id": "2607.22474", "arxiv_url": "https://arxiv.org/abs/2607.22474", "authors": ["Peng Zhao"], "brief": "\u672c\u6587\u7814\u7a76\u8fc7\u53c2\u6570\u7ebf\u6027\u56de\u5f52\u4e2d\u7684\u8c31\u6b63\u5219\u5316\uff0c\u63d0\u51fa\u7528\u65e9\u505c\u7684\u8d1f\u79fb\u4f4d\u68af\u5ea6\u4e0b\u964d\u7a81\u7834\u7a33\u5b9a\u8d1f\u5cad\u56de\u5f52\u7aef\u70b9\u7684\u7ed3\u6784\u9650\u5236\u3002\u5176\u6ee4\u6ce2\u5668\u53ef\u5728\u9ad8\u4fe1\u53f7\u8c31\u65b9\u5411\u4ea7\u751f\u201c\u53cd\u6536\u7f29\u201d\uff0c\u540c\u65f6\u5bf9\u4f4e\u8c31\u65b9\u5411\u4fdd\u6301\u6536\u7f29\u6216\u63a7\u5236\u66b4\u9732\u3002", "categories": ["cs.LG", "math.ST", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22474", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u7a33\u5b9a\u8d1f\u5cad\u7aef\u70b9\u53d7\u9650\u4e8e\u6781\u70b9\u5fc5\u987b\u4f4e\u4e8e\u6700\u5c0f\u975e\u96f6\u7ecf\u9a8c\u7279\u5f81\u503c\uff0c\u4e14\u4f1a\u5bf9\u5c0f\u7279\u5f81\u503c\u8fc7\u5ea6\u53cd\u6536\u7f29\u3002", "\u63d0\u51fa\u65e9\u505c\u8d1f\u79fb\u4f4d\u68af\u5ea6\u4e0b\u964d\uff0c\u6ee4\u6ce2\u5668\u5728\u6f5c\u5728\u6781\u70b9\u5904\u4fdd\u6301\u5e73\u6ed1\uff0c\u5e76\u53ef\u5f62\u6210\u9ad8\u8c31\u65b9\u5411\u589e\u5f3a\u3001\u4f4e\u8c31\u65b9\u5411\u6536\u7f29\u7684\u6df7\u5408\u7b26\u53f7\u6b63\u5219\u3002", "\u5728 Gaussian spike-plus-flat \u6a21\u578b\u4e2d\u53d1\u73b0 Marchenko-Pastur \u5c4f\u969c\uff0c\u5e76\u8bc1\u660e\u5728\u4e00\u5b9a\u6761\u4ef6\u4e0b\u65e9\u505c\u8def\u5f84\u76f8\u8f83\u6240\u6709\u53ef\u884c\u7aef\u70b9\u53ef\u83b7\u5f97\u591a\u9879\u5f0f\u7ea7\u98ce\u9669\u6539\u8fdb\u3002"], "keywords": ["\u8c31\u6b63\u5219\u5316", "\u7ebf\u6027\u56de\u5f52", "\u68af\u5ea6\u4e0b\u964d", "\u7edf\u8ba1\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22474v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Negative-Ridge Endpoints: Mixed-Sign Spectral Regularization via Negative-Shifted Gradient Descent", "tldr": "\u8d1f\u79fb\u4f4d\u68af\u5ea6\u4e0b\u964d\u5b9e\u73b0\u6df7\u5408\u7b26\u53f7\u8c31\u6b63\u5219", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u8fc7\u53c2\u6570\u7ebf\u6027\u56de\u5f52\u4e2d\u7684\u8c31\u6b63\u5219\u5316\uff0c\u63d0\u51fa\u7528\u65e9\u505c\u7684\u8d1f\u79fb\u4f4d\u68af\u5ea6\u4e0b\u964d\u7a81\u7834\u7a33\u5b9a\u8d1f\u5cad\u56de\u5f52\u7aef\u70b9\u7684\u7ed3\u6784\u9650\u5236\u3002\u5176\u6ee4\u6ce2\u5668\u53ef\u5728\u9ad8\u4fe1\u53f7\u8c31\u65b9\u5411\u4ea7\u751f\u201c\u53cd\u6536\u7f29\u201d\uff0c\u540c\u65f6\u5bf9\u4f4e\u8c31\u65b9\u5411\u4fdd\u6301\u6536\u7f29\u6216\u63a7\u5236\u66b4\u9732\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6df1\u5316\u4e86\u5bf9\u8fc7\u53c2\u6570\u7ebf\u6027\u6a21\u578b\u4e2d\u9690\u5f0f\u6b63\u5219\u5316\u548c\u8c31\u6ee4\u6ce2\u7684\u7406\u89e3\uff0c\u5c55\u793a\u4e86\u8d1f\u79fb\u4f4d\u52a8\u6001\u53ef\u8d85\u8d8a\u4f20\u7edf\u5cad\u56de\u5f52\u3001\u8d1f\u5cad\u56de\u5f52\u548c\u65e0\u5cad\u89e3\u7684\u7edf\u4e00\u7f29\u653e\uff0c\u5728\u7406\u8bba\u4e0a\u4e3a\u66f4\u7cbe\u7ec6\u7684\u65e9\u505c\u4e0e\u8c31\u6b63\u5219\u65b9\u6cd5\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Do learned audio embeddings encode structure that nobody told them to encode? We probe four large pretrained audio models (AST, CLAP, BEATs-bio and BirdNET) with a downstream task none of them saw during training: recovering phylogenetic distance from species vocalizations. If the geometry of the embedding space tracks the tree of life, the representation is picking up something deeper than the labels the model was optimized for. We run Mantel tests across two independent radiations. In 32 marine mammal species (1,754 recordings from the Watkins Marine Mammal Sound Database) the foundation models recover strong phylogenetic signal within the 26 cetaceans (CLAP r=0.82, BEATs-bio r=0.82, AST r=0.74; all p\u003c0.001), among the highest acoustic-phylogenetic correlations reported for any taxon. Hand-crafted MFCC features (105d) find nothing (r=0.040, p=0.338). The gap survives after PCA-projecting every embedding down to 105 dimensions, so it is not an artefact of representation size. It also survives a partial Mantel test controlling for dominant frequency (partial Mantel r=0.404, keeping 97% of the variance explained), so it is not just pitch in disguise. We repeat the analysis on 20 bird species using the Jetz et al. (2012) phylogeny, and this time add BirdNET, a classifier trained end-to-end on around 6,000 bird species. The general-purpose foundation models recover the signal again (AST r=0.55, CLAP r=0.52). The unexpected result is that neither BirdNET nor the bioacoustic BEATs-bio beat them (r around 0.32 to 0.36). Matching the training domain to the target taxon does not, by itself, help. Pretrained audio embeddings carry evolutionary information across two independent radiations, and domain-specific pretraining is not required for it to emerge.", "arxiv_id": "2607.22458", "arxiv_url": "https://arxiv.org/abs/2607.22458", "authors": ["V\u00edctor Rinc\u00f3n Yepes"], "brief": "\u8bba\u6587\u68c0\u9a8c\u5927\u578b\u9884\u8bad\u7ec3\u97f3\u9891\u6a21\u578b\u7684\u5d4c\u5165\u7a7a\u95f4\u662f\u5426\u80fd\u4ece\u52a8\u7269\u53eb\u58f0\u4e2d\u6062\u590d\u7cfb\u7edf\u53d1\u80b2\u8ddd\u79bb\u3002\u7ed3\u679c\u663e\u793a\uff0cAST\u3001CLAP \u7b49\u901a\u7528\u97f3\u9891\u57fa\u7840\u6a21\u578b\u5728\u6d77\u6d0b\u54fa\u4e73\u52a8\u7269\u548c\u9e1f\u7c7b\u4e2d\u90fd\u7f16\u7801\u4e86\u663e\u8457\u7684\u6f14\u5316\u7ed3\u6784\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22458", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u572832\u79cd\u6d77\u6d0b\u54fa\u4e73\u52a8\u7269\u30011754\u6bb5\u5f55\u97f3\u4e0a\uff0cCLAP\u3001BEATs-bio\u3001AST \u572826\u79cd\u9cb8\u7c7b\u5185\u53d6\u5f97\u5f88\u5f3a\u7cfb\u7edf\u53d1\u80b2\u76f8\u5173\u6027\uff0cMantel r\u6700\u9ad8\u7ea60.82\uff0c\u663e\u8457\u4f18\u4e8eMFCC\u3002", "\u5c06\u5d4c\u5165\u964d\u7ef4\u5230105\u7ef4\u540e\u4f18\u52bf\u4ecd\u5b58\u5728\uff0c\u4e14\u63a7\u5236\u4e3b\u5bfc\u9891\u7387\u540e\u4ecd\u4fdd\u7559\u5927\u90e8\u5206\u89e3\u91ca\u65b9\u5dee\uff0c\u8bf4\u660e\u4e0d\u662f\u7ef4\u5ea6\u6216\u97f3\u9ad8\u9020\u6210\u7684\u5047\u8c61\u3002", "\u572820\u79cd\u9e1f\u7c7b\u4e0a\uff0cAST\u548cCLAP\u4ecd\u80fd\u6062\u590d\u6f14\u5316\u4fe1\u53f7\uff0c\u800c\u4e13\u95e8\u9762\u5411\u9e1f\u7c7b\u7684BirdNET\u548c\u751f\u7269\u58f0\u5b66\u6a21\u578bBEATs-bio\u5e76\u672a\u4f18\u4e8e\u901a\u7528\u6a21\u578b\u3002"], "keywords": ["\u97f3\u9891\u57fa\u7840\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u751f\u7269\u58f0\u5b66", "\u7cfb\u7edf\u53d1\u80b2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22458v1", "published_at": "2026-07-24", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Phylogenetic signal in marine mammal and bird vocalizations captured by audio foundation models: the limited benefit of domain-specific pretraining", "tldr": "\u901a\u7528\u97f3\u9891\u6a21\u578b\u53ef\u6355\u6349\u7269\u79cd\u6f14\u5316\u4fe1\u53f7", "upvotes": 0, "what_it_is": "\u8bba\u6587\u68c0\u9a8c\u5927\u578b\u9884\u8bad\u7ec3\u97f3\u9891\u6a21\u578b\u7684\u5d4c\u5165\u7a7a\u95f4\u662f\u5426\u80fd\u4ece\u52a8\u7269\u53eb\u58f0\u4e2d\u6062\u590d\u7cfb\u7edf\u53d1\u80b2\u8ddd\u79bb\u3002\u7ed3\u679c\u663e\u793a\uff0cAST\u3001CLAP \u7b49\u901a\u7528\u97f3\u9891\u57fa\u7840\u6a21\u578b\u5728\u6d77\u6d0b\u54fa\u4e73\u52a8\u7269\u548c\u9e1f\u7c7b\u4e2d\u90fd\u7f16\u7801\u4e86\u663e\u8457\u7684\u6f14\u5316\u7ed3\u6784\u3002", "why_notable": "\u8be5\u7814\u7a76\u8868\u660e\u97f3\u9891\u57fa\u7840\u6a21\u578b\u80fd\u5728\u672a\u663e\u5f0f\u8bad\u7ec3\u7684\u4efb\u52a1\u4e2d\u6355\u6349\u6df1\u5c42\u751f\u7269\u6f14\u5316\u4fe1\u606f\uff0c\u5e76\u6311\u6218\u4e86\u201c\u9886\u57df\u4e13\u7528\u9884\u8bad\u7ec3\u5fc5\u7136\u66f4\u597d\u201d\u7684\u76f4\u89c9\uff0c\u5bf9\u751f\u7269\u58f0\u5b66\u3001\u751f\u6001\u76d1\u6d4b\u548c\u8868\u5f81\u5b66\u4e60\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "A central design principle in modern machine learning and artificial intelligence is to align a model\u0027s inductive bias with the structure of its input data. For matrix-valued inputs, relevant matrix-level relationships can be characterised through spectral values and spectral subspaces; however, common coordinate-wise rotation-gate data-encoding unitaries used in most quantum machine learning models do not explicitly construct such a matrix-level representation. We introduce Quantum Spectral Models (QSMs), in which we construct the generator of the data-encoding unitary directly from each input matrix. We study three QSM variants based on symmetric, global block, and non-overlapping patch-local block Hamiltonians. Their outputs admit truncated Fourier representations in which input-dependent spectral gaps supply candidate phase carriers, while spectral subspaces help determine their coefficients. We evaluate the QSMs and comparison quantum models on two matrix representations of Pendigits and two controlled synthetic tasks defined by spectral statistics. At the largest evaluated circuit depth, QSM variants lead the tested quantum models in mean test accuracy across all four benchmarks. The patch-local QSM leads on Pendigits, whereas the global block-Hamiltonian QSM leads on the controlled spectral tasks. Ablations show a task-dependent reversal: subspace-preserving controls perform better on Pendigits, whereas spectral-value-only controls lead among the tested ablations on the synthetic tasks. Together, these results shed new light on quantum machine-learning model design by showing how input-conditioned spectral representations can provide an analysable inductive bias, while offering a broader perspective on structure-aware model design in machine learning and artificial intelligence.", "arxiv_id": "2607.22516", "arxiv_url": "https://arxiv.org/abs/2607.22516", "authors": ["Peiyong Wang", "Udaya Parampalli", "Casey R. Myers"], "brief": "\u8bba\u6587\u63d0\u51fa Quantum Spectral Models\uff08QSM\uff09\uff0c\u76f4\u63a5\u7531\u8f93\u5165\u77e9\u9635\u6784\u9020\u6570\u636e\u7f16\u7801\u9149\u7684\u751f\u6210\u5143\uff0c\u4f7f\u6a21\u578b\u663e\u5f0f\u5229\u7528\u77e9\u9635\u7684\u8c31\u503c\u4e0e\u8c31\u5b50\u7a7a\u95f4\u3002\u4f5c\u8005\u8bbe\u8ba1\u4e86\u5bf9\u79f0\u3001\u5168\u5c40\u5757\u3001\u975e\u91cd\u53e0\u5c40\u90e8\u5757\u4e09\u7c7b\u54c8\u5bc6\u987f\u91cf\u53d8\u4f53\uff0c\u5e76\u5728\u624b\u5199\u6570\u5b57\u4e0e\u53d7\u63a7\u8c31\u7edf\u8ba1\u4efb\u52a1\u4e0a\u9a8c\u8bc1\u6548\u679c\u3002", "categories": ["quant-ph", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22516", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["QSM \u7684\u8f93\u51fa\u53ef\u8868\u793a\u4e3a\u622a\u65ad\u5085\u91cc\u53f6\u5f62\u5f0f\uff0c\u5176\u4e2d\u8f93\u5165\u76f8\u5173\u7684\u8c31\u95f4\u9699\u63d0\u4f9b\u76f8\u4f4d\u8f7d\u4f53\uff0c\u8c31\u5b50\u7a7a\u95f4\u5f71\u54cd\u7cfb\u6570\u3002", "\u5728 Pendigits \u7684\u4e24\u79cd\u77e9\u9635\u8868\u793a\u548c\u4e24\u7c7b\u5408\u6210\u8c31\u4efb\u52a1\u4e0a\uff0c\u6700\u5927\u6d4b\u8bd5\u7535\u8def\u6df1\u5ea6\u4e0b QSM \u5e73\u5747\u51c6\u786e\u7387\u9886\u5148\u5bf9\u6bd4\u91cf\u5b50\u6a21\u578b\u3002", "\u6d88\u878d\u663e\u793a\u5f52\u7eb3\u504f\u7f6e\u5177\u6709\u4efb\u52a1\u4f9d\u8d56\u6027\uff1aPendigits \u66f4\u53d7\u76ca\u4e8e\u4fdd\u7559\u5b50\u7a7a\u95f4\u7684\u63a7\u5236\uff0c\u5408\u6210\u8c31\u4efb\u52a1\u4e2d\u4ec5\u8c31\u503c\u63a7\u5236\u8868\u73b0\u66f4\u597d\u3002"], "keywords": ["\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u8c31\u65b9\u6cd5", "\u5f52\u7eb3\u504f\u7f6e", "\u6570\u636e\u7f16\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22516v1", "published_at": "2026-07-24", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Quantum Spectral Model: Data Reuploading with Input-Conditioned Frequency Support", "tldr": "\u7528\u8f93\u5165\u8c31\u7ed3\u6784\u6539\u8fdb\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u7f16\u7801", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Quantum Spectral Models\uff08QSM\uff09\uff0c\u76f4\u63a5\u7531\u8f93\u5165\u77e9\u9635\u6784\u9020\u6570\u636e\u7f16\u7801\u9149\u7684\u751f\u6210\u5143\uff0c\u4f7f\u6a21\u578b\u663e\u5f0f\u5229\u7528\u77e9\u9635\u7684\u8c31\u503c\u4e0e\u8c31\u5b50\u7a7a\u95f4\u3002\u4f5c\u8005\u8bbe\u8ba1\u4e86\u5bf9\u79f0\u3001\u5168\u5c40\u5757\u3001\u975e\u91cd\u53e0\u5c40\u90e8\u5757\u4e09\u7c7b\u54c8\u5bc6\u987f\u91cf\u53d8\u4f53\uff0c\u5e76\u5728\u624b\u5199\u6570\u5b57\u4e0e\u53d7\u63a7\u8c31\u7edf\u8ba1\u4efb\u52a1\u4e0a\u9a8c\u8bc1\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u7684\u6570\u636e\u91cd\u4e0a\u4f20\u4e0e\u7f16\u7801\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u66f4\u7ed3\u6784\u5316\u3001\u53ef\u5206\u6790\u7684\u5f52\u7eb3\u504f\u7f6e\uff0c\u8bf4\u660e\u76f4\u63a5\u5229\u7528\u77e9\u9635\u8c31\u7ed3\u6784\u53ef\u80fd\u4f18\u4e8e\u5e38\u89c1\u9010\u5750\u6807\u65cb\u8f6c\u7f16\u7801\uff0c\u5bf9\u7ed3\u6784\u611f\u77e5\u6a21\u578b\u8bbe\u8ba1\u4e5f\u6709\u542f\u53d
