ution feedback to update and expand the skill library. This interactive co-evolution effectively bridges the gap between structured verification and open-ended exploration. Empirical evaluations on tool-use and reasoning benchmarks demonstrate that Skill-SP, serving as a robust evolution engine, consistently pushes the performance ceiling of competent backbones while catalyzing striking turnarounds for initially misaligned models. Our code is available at https://github.com/Qwen-Applications/skill-self-play.", "arxiv_id": "2607.22529", "arxiv_url": "https://arxiv.org/abs/2607.22529", "authors": ["Siyuan Huang", "Pengyu Cheng", "Haotian Liu", "Tao Chen", "Yihao Liu", "Jingwei Ni", "Shijie Zhou", "Ziyi Yang", "Gangwei Jiang", "Mengyu Zhou", "Yu Cheng", "Xiaoxi Jiang", "Guanjun Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa Skill Self-Play\uff08Skill-SP\uff09\uff0c\u901a\u8fc7\u63d0\u51fa\u8005\u3001\u6c42\u89e3\u8005\u4e0e\u52a8\u6001\u6280\u80fd\u63a7\u5236\u5668\u7ec4\u6210\u7684\u5f3a\u5316\u5b66\u4e60\u81ea\u535a\u5f08\u6846\u67b6\uff0c\u8ba9 LLM \u5728\u53ef\u9a8c\u8bc1\u6280\u80fd\u6267\u884c\u4e0e\u5f00\u653e\u5f0f\u4efb\u52a1\u751f\u6210\u4e4b\u95f4\u5171\u540c\u8fdb\u5316\u3002\u7cfb\u7edf\u5c06\u4efb\u52a1\u751f\u6210\u7ed1\u5b9a\u5230\u53ef\u6267\u884c\u6280\u80fd\uff0c\u5e76\u6839\u636e\u53cd\u9988\u66f4\u65b0\u4e0e\u6269\u5c55\u6280\u80fd\u5e93\uff0c\u4ece\u800c\u63d0\u5347\u6a21\u578b\u5728\u5de5\u5177\u4f7f\u7528\u548c\u63a8\u7406\u4efb\u52a1\u4e0a\u7684\u80fd\u529b\u4e0a\u9650\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Qwen-Applications/skill-self-play", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22529", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ee5\u201c\u6280\u80fd\u201d\u4f5c\u4e3a\u4e2d\u95f4\u5c42\uff1a\u5355\u4e2a\u6280\u80fd\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u6267\u884c\u53cd\u9988\uff0c\u52a8\u6001\u8def\u7531\u5219\u4fdd\u6301\u4efb\u52a1\u591a\u6837\u6027\u3002", "\u6846\u6 57df\u53d7\u9650\u201d\u7684\u6838\u5fc3\u77db\u76fe\uff0c\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u6280\u80fd\u81ea\u535a\u5f08\u673a\u5236\uff0c\u517c\u5177\u53ef\u9760\u53cd\u9988\u4e0e\u4efb\u52a1\u591a\u6837\u6027\uff0c\u5bf9\u667a\u80fd\u4f53\u8bad\u7ec3\u3001\u5de5\u5177\u4f7f\u7528\u548c\u81ea\u52a8\u80fd\u529b\u6269\u5c55\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Although large language models (LLMs) exhibit remarkable reasoning capabilities, their reliance on text-only pre-training restricts the perception of the multimodal physical world. Native multimodal pre-training avoids this limitation by training models from scratch on multimodal inputs, thereby achieving deep cross-modal integration and mitigating optimization asymmetries inherent to traditional late-fusion architectures. Despite these advantages, the scaling properties of this paradigm remain systematically uncharacterized. To address this gap, we investigate the optimal model size and token count for training a transformer-based vision-language model under a fixed computational budget. We demonstrate that minimal objective loss adheres to a predictable compute law, whereas compute-optimal model sizes and token counts scale as power laws. Notably, language and multimodal objectives manifest distinct scaling behaviors. The language allocation law is largely invariant to the composition of the data, indicating stable language learning regardless of the multimodal data ratio. Conversely, the multimodal allocation law is highly sensitive to this composition. Specifically, text-heavy mixtures become compute-efficient only at larger model scales, shifting the optimal resource allocation toward greater model capacity. Additionally, by modeling the influence of data composition on compute laws and allocation exponents, we derive an efficiency frontier specifying precise configurations of model size, token count, and data mixture. Downstream evaluations further reveal that native multimodal pre-training induces positive cross-modal transfer, thereby enhancing pure-text spatial reasoning and enabling robust multimodal in-context learning. In summary, this empirical research establishes the essential groundwork for predictably scaling multimodal foundation models.", "arxiv_id": "2607.22043", "arxiv_url": "https://arxiv.org/abs/2607.22043", "authors": ["Haoyuan Wu", "Aoqi Wu", "Hai Wang", "Jiajia Wu", "Jinxiang Ou", "Bei Yu"], "brief": "\u8bba\u6587\u4ece\u96f6\u8bad\u7ec3 Transformer \u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u7814\u7a76\u56fa\u5b9a\u8ba1\u7b97\u9884\u7b97\u4e0b\u6a21\u578b\u89c4\u6a21\u3001token \u6570\u4e0e\u6570\u636e\u914d\u6bd4\u7684\u6700\u4f18\u5173\u7cfb\u3002\u7ed3\u679c\u7ed9\u51fa\u539f\u751f\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u7684\u8ba1\u7b97\u5f8b\u3001\u8d44\u6e90\u5206\u914d\u5f8b\u548c\u6570\u636e\u914d\u6bd4\u6548\u7387\u524d\u6cbf\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22043", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6700\u5c0f\u76ee\u6807\u635f\u5931\u7b26\u5408\u53ef\u9884\u6d4b\u7684 compute law\uff0c\u8ba1\u7b97\u6700\u4f18\u6a21\u578b\u89c4\u6a21\u4e0e token \u6570\u5448\u5e42\u5f8b\u589e\u957f\u3002", "\u8bed\u8a00\u76ee\u6807\u4e0e\u591a\u6a21\u6001\u76ee\u6807\u8868\u73b0\u51fa\u4e0d\u540c\u7f29\u653e\u884c\u4e3a\uff1a\u8bed\u8a00\u5206\u914d\u5f8b\u5bf9\u6570\u636e\u7ec4\u6210\u8f83\u7a33\u5b9a\uff0c\u591a\u6a21\u6001\u5206\u914d\u5f8b\u5bf9\u56fe\u6587\u6bd4\u4f8b\u9ad8\u5ea6\u654f\u611f\u3002", "\u6587\u672c\u5360\u6bd4\u8f83\u9ad8\u7684\u6570\u636e\u6df7\u5408\u5728\u66f4\u5927\u6a21\u578b\u89c4\u6a21\u4e0b\u624d\u66f4\u5177\u8ba1\u7b97\u6548\u7387\uff0c\u5e76\u4f1a\u63a8\u52a8\u6700\u4f18\u914d\u7f6e\u504f\u5411\u66f4\u5927\u6a21\u578b\u5bb9\u91cf\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u9884\u8bad\u7ec3", "\u7f29\u653e\u89c4\u5f8b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b that research ideation should be treated as a conjunction of both objectives and framed as a Quality-Diversity (QD) search. In line with this perspective, we introduce IDEAgent, a multi-agent framework that manages the evolution of ideas through lineages. We jointly drive Quality using multi-objective feedback for dedicated repair and refinement, while Diversity is achieved through lightweight sequential memory and explicit comparison against completed ideas, their historical ancestors, and rejected proposals. To systematically evaluate this QD conjunction, we develop Yield, a joint metric that computes the largest set of mutually diverse ideas that satisfy a predetermined quality threshold. Finally, through evaluations across 32 topics spanning 8 domains of Computer Science, we show that IDEAgent outperforms the best baseline by 3.89x on Yield, while achieving non-zero Yield on 8x more topics. We further corroborate these findings through an analysis of quality improvements, showing that repair and refinement are crucial for building logical rigor and clarity while preserving non-obviousness. To encourage future research on QD-search-based ideation, we open-source IDEAgent at https://github.com/declare-lab/IDEAgent.", "arxiv_id": "2607.22375", "arxiv_url": "https://arxiv.org/abs/2607.22375", "authors": ["Varun Gumma", "Navonil Majumder", "Soumitra Sinhahajari", "Soujanya Poria"], "brief": "\u8bba\u6587\u63d0\u51fa IDEAgent\uff0c\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u7814\u7a76\u6784\u601d\u6846\u67b6\uff0c\u5c06\u60f3\u6cd5\u751f\u6210\u5efa\u6a21\u4e3a\u8d28\u91cf\u4e0e\u591a\u6837\u6027\u8054\u5408\u4f18\u5316\u7684 QD \u641c\u7d22\u3002\u5b83\u901a\u8fc7\u60f3\u6cd5\u8c31\u7cfb\u3001\u591a\u76ee\u6807\u53cd\u9988\u4fee\u590d\u4e0e\u7cbe\u70bc\uff0c\u4ee5\u53ca\u5bf9\u5386\u53f2/\u62d2\u7edd\u60f3\u6cd5\u7684\u663e\u5f0f\u6bd4\u8f83\u6765\u6f14\u5316\u7814\u7a76\u521b\u610f\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/declare-lab/IDEAgent", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.22375", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa Yield \u6307\u6807\uff1a\u8861\u91cf\u6ee1\u8db3\u8d28\u91cf\u9608\u503c\u4e14\u5f7c\u6b64\u591a\u6837\u7684\u6700\u5927\u60f3\u6cd5\u96c6\u5408", "\u5728\u8ba1\u7b97\u673a\u79d1\u5b66 8 \u4e2a\u9886\u57df\u300132 \u4e2a\u4e3b\u9898\u4e0a\u8bc4\u6d4b\uff0cIDEAgent \u7684 Yield \u76f8\u6bd4\u6700\u4f73\u57fa\u7ebf\u63d0\u5347 3.89 \u500d", "\u4fee\u590d\u4e0e\u7cbe\u70bc\u673a\u5236\u663e\u8457\u63d0\u5347\u903b\u8f91\u4e25\u8c28\u6027\u548c\u8868\u8fbe\u6e05\u6670\u5ea6\uff0c\u540c\u65f6\u4fdd\u6301\u60f3\u6cd5\u7684\u975e\u663e\u7136\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u53d1\u73b0", "\u8d28\u91cf\u591a\u6837\u6027\u641c\u7d22", "\u7814\u7a76\u60f3\u6cd5\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Deep Cognition and Language Research (DeCLaRe) Lab", "pdf_url": "https://arxiv.org/pdf/2607.22375v1", "published_at": "2026-07-24", "score": 0.372, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.22375.png", "title": "IDEAgent: Agentic Quality-Diversity Search for Research Idea Generation", "tldr": "\u7528\u8d28\u91cf-\u591a\u6837\u6027\u641c\u7d22\u751f\u6210\u7814\u7a76\u60f3\u6cd5", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa IDEAgent\uff0c\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u7814\u7a76\u6784\u601d\u6846\u67b6\uff0c\u5c06\u60f3\u6cd5\u751f\u6210\u5efa\u6a21\u4e3a\u8d28\u91cf\u4e0e\u591a\u6837\u6027\u8054\u5408\u4f18\u5316\u7684 QD \u641c\u7d22\u3002\u5b83\u901a\u8fc7\u60f3\u6cd5\u8c31\u7cfb\u3001\u591a\u76ee\u6807\u53cd\u9988\u4fee\u590d\u4e0e\u7cbe\u70bc\uff0c\u4ee5\u53ca\u5bf9\u5386\u53f2/\u62d2\u7edd\u60f3\u6cd5\u7684\u663e\u5f0f\u6bd4\u8f83\u6765\u6f14\u5316\u7814\u7a76\u521b\u610f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u79d1\u7814\u9009\u9898\u751f\u6210\u4ece\u5355\u7eaf\u8ffd\u6c42\u8d28\u91cf\u6216\u591a\u6837\u6027\u63a8\u8fdb\u5230\u4e8c\u8005\u8054\u5408\u4f18\u5316\uff0c\u5e76\u7ed9\u51fa\u53ef\u91cf\u5316\u8bc4\u6d4b\u6307\u6807\uff0c\u5bf9\u81ea\u52a8\u5316\u79d1\u5b66\u53d1\u73b0\u548c\u7814\u7a76\u52a9\u624b\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Production AI agents\u0027 failures are less often due to an inability to reason well and more often because they cannot manage what is in their reasoning context: conversation histories, large prompts, large tool definitions, and ballooning tool outputs. Agents drown in their own accumulating history while paying a token cost that grows every turn, producing missing recalls within and across conversations. The incumbent response treats this as a storage-and-retrieval problem. We argue that framing is too narrow. Actively managing what an agent holds in mind is a lifecycle, not merely a store: it spans deciding what to remember, extracting and structuring it, choosing the right store per data type, consolidating and forgetting while preserving provenance, deciding what is relevant now, anticipating what is needed next, and compacting context to a budget without losing what matters. In serious production this operates not over a single user but across an organizational scope hierarchy. We name this discipline Agentic Context Management (ACM) and decompose it into five primitives: architecting, ingesting, scoping, anticipating, and compacting \u0026 consolidation. We then make the economic case: naive context accumulation grows token cost quadratically in conversation length, crude summarization buys linear cost at the price of an accuracy cliff, and only validated compaction achieves linear cost with preserved fidelity. We describe a reference implementation, Maximem Synap, that realizes the five primitives as a multi-tenant service and reports 92% on LongMemEval and 93.2% on LoCoMo under the configuration detailed in Section 6. We close with dimensions existing benchmarks do not yet capture, latency, token efficiency, and context-rot resistance, and the frontier of decision-level and organization-level context the category points toward.", "arxiv_id": "2607.21503", "arxiv_url": "https://arxiv.org/abs/2607.21503", "authors": ["Gaurav Dadhich"], "brief": "\u8bba\u6587\u5c06\u667a\u80fd\u4f53\u8bb0\u5fc6\u4e0e\u6210\u672c\u95ee\u9898\u91cd\u65b0\u5b9a\u4e49\u4e3a\u4e0a\u4e0b\u6587\u751f\u547d\u5468\u671f\u4e0e\u67b6\u6784\u95ee\u9898\uff0c\u800c\u975e\u5355\u7eaf\u5b58\u50a8\u68c0\u7d22\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51fa Agentic Context Management\uff08ACM\uff09\u53ca\u4e94\u4e2a\u539f\u8bed\uff0c\u5e76\u7ed9\u51fa\u591a\u79df\u6237\u53c2\u8003\u5b9e\u73b0 Maximem Synap\u3002", "categories": ["cs.AI", "cs.IR"], "github_repo": "https://github.com/maximem-ai/eval_benchmark_runs_output", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21503", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["ACM \u5305\u542b\u67b6\u6784\u3001\u6444\u53d6\u3001\u4f5c\u7528\u57df\u7ba1\u7406\u3001\u9700\u6c42\u9884\u5224\u3001\u538b\u7f29\u4e0e\u5de9\u56fa\u4e94\u4e2a\u6838\u5fc3\u539f\u8bed", "\u5206\u6790\u6307\u51fa\u6734\u7d20\u4e0a\u4e0b\u6587\u7d2f\u79ef\u4f1a\u5bfc\u81f4 token \u6210\u672c\u968f\u5bf9\u8bdd\u957f\u5ea6\u4e8c\u6b21\u589e\u957f\uff0c\u7b80\u5355\u6458\u8981\u4f1a\u5e26\u6765\u51c6\u786e\u7387\u65ad\u5d16", "\u53c2\u8003\u7cfb\u7edf\u5728 LongMemEval \u8fbe\u5230 92%\uff0c\u5728 LoCoMo \u8fbe\u5230 93.2%\uff0c\u5e76\u5f3a\u8c03\u5ef6\u8fdf\u3001token \u6548\u7387\u548c\u6297\u4e0a\u4e0b\u6587\u8150\u5316\u7b49\u65b0\u8bc4\u6d4b\u7ef4\u5ea6"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u8bb0\u5fc6\u7cfb\u7edf", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.21503v1", "published_at": "2026-07-23", "score": 0.358, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.21503.png", "title": "Agentic Context Management: Solving Agent Memory and Cost by Treating Them as Lifecycle and Architecture Problems", "tldr": "\u63d0\u51fa\u9762\u5411\u751f\u4ea7\u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u751f\u547d\u5468\u671f\u7ba1\u7406\u6846\u67b6", "upvotes": 2, "what_it_is": "\u8bba\u6587\u5c06\u667a\u80fd\u4f53\u8bb0\u5fc6\u4e0e\u6210\u672c\u95ee\u9898\u91cd\u65b0\u5b9a\u4e49\u4e3a\u4e0a\u4e0b\u6587\u751f\u547d\u5468\u671f\u4e0e\u67b6\u6784\u95ee\u9898\uff0c\u800c\u975e\u5355\u7eaf\u5b58\u50a8\u68c0\u7d22\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51fa Agentic Context Management\uff08ACM\uff09\u53ca\u4e94\u4e2a\u539f\u8bed\uff0c\u5e76\u7ed9\u51fa\u591a\u79df\u6237\u53c2\u8003\u5b9e\u73b0 Maximem Synap\u3002", "why_notable": "\u8be5\u8bba\u6587\u628a\u667a\u80fd\u4f53\u8bb0\u5fc6\u4ece\u201c\u68c0\u7d22\u589e\u5f3a\u201d\u6269\u5c55\u4e3a\u751f\u4ea7\u7ea7\u4e0a\u4e0b\u6587\u67b6\u6784\u95ee\u9898\uff0c\u76f4\u63a5\u9762\u5411\u957f\u5bf9\u8bdd\u3001\u591a\u7528\u6237\u3001\u7ec4\u7ec7\u7ea7\u90e8\u7f72\u4e2d\u7684\u6210\u672c\u3001\u53ef\u9760\u6027\u4e0e\u53ef\u8ffd\u6eaf\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u6307\u5bfc\u4ef7\u503c\u3002"}, {"abstract": "Automating theoretical research is constrained not only by the generation of candidate results, but also by their reliable evaluation. A common approach is to close the research loop with a large language model (LLM) reviewer. However, such reviewers remain empirically unreliable: they may accept fabricated papers and detect them at rates close to chance (Bad Scientist, 2025). We present CausalForge, a framework for automated theoretical research in causal inference grounded in the Lean proof assistant. CausalForge combines Causalean, a foundational Lean library for causal inference containing 7,035 machine-checked declarations developed with language-model assistance under human design and review, with CausalSmith, a self-improving agentic pipeline that selects research topics, proposes results, formalizes statements, constructs proofs, and presents the resulting artifacts for human inspection. Because a machine-checked proof establishes only that a formal statement follows from its assumptions, not that the statement faithfully captures the intended scientific claim, the pipeline augments kernel verification with a statement audit that compares each formal theorem against the informal claim it is intended to express. We evaluate the system using artifacts produced by completed autonomous research runs. The source code, formal library, and run records are available at https://github.com/Jiyuan-Tan/CausalForge.", "arxiv_id": "2607.22511", "arxiv_url": "https://arxiv.org/abs/2607.22511", "authors": ["Jiyuan Tan", "Vasilis Syrgkanis"], "brief": "\u8bba\u6587\u63d0\u51fa CausalForge\uff0c\u4e00\u4e2a\u9762\u5411\u56e0\u679c\u63a8\u65ad\u7406\u8bba\u7814\u7a76\u7684\u81ea\u52a8\u5316\u6846\u67b6\uff0c\u5c06 Lean \u8bc1\u660e\u52a9\u624b\u4f5c\u4e3a\u53ef\u9760\u8bc4\u4f30\u57fa\u7840\u3002\u5b83\u7ed3\u5408\u56e0\u679c\u63a8\u65ad\u5f62\u5f0f\u5316\u5e93 Causalean \u4e0e\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf CausalSmith\uff0c\u81ea\u52a8\u9009\u9898\u3001\u63d0\u51fa\u7ed3\u679c\u3001\u5f62\u5f0f\u5316\u547d\u9898\u3001\u6784\u9020\u8bc1\u660e\u5e76\u4f9b\u4eba\u5ba1\u67e5\u3002", "categories": ["stat.ML", "cs.AI", "cs.LG", "econ.EM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22511", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa Causalean\uff1a\u5305\u542b 7,035 \u4e2a\u673a\u5668\u68c0\u67e5\u58f0\u660e\u7684\u56e0\u679c\u63a8\u65ad Lean \u57fa\u7840\u5e93\uff0c\u7531\u8bed\u8a00\u6a21\u578b\u8f85\u52a9\u5e76\u7ecf\u4eba\u7c7b\u8bbe\u8ba1\u4e0e\u5ba1\u67e5", "\u63d0\u51fa CausalSmith\uff1a\u81ea\u6539\u8fdb agentic \u6d41\u6c34\u7ebf\uff0c\u8986\u76d6\u7814\u7a76\u4e3b\u9898\u9009\u62e9\u3001\u7ed3\u679c\u63d0\u51fa\u3001\u5f62\u5f0f\u5316\u3001\u8bc1\u660e\u751f\u6210\u4e0e\u4ea7\u7269\u5c55\u793a", "\u5728 Lean kernel \u9a8c\u8bc1\u4e4b\u5916\u52a0\u5165 statement audit\uff0c\u68c0\u67e5\u5f62\u5f0f\u5b9a\u7406\u662f\u5426\u5fe0\u5b9e\u8868\u8fbe\u5bf9\u5e94\u7684\u975e\u5f62\u5f0f\u79d1\u5b66\u4e3b\u5f20"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u56e0\u679c\u63a8\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22511v1", "published_at": "2026-07-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CausalForge: A Formally Grounded, Self-Improving Agentic Framework for Automated Research in Causal Inference", "tldr": "\u7528Lean\u9a8c\u8bc1\u7684\u56e0\u679c\u63a8\u65ad\u81ea\u52a8\u7814\u7a76\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CausalForge\uff0c\u4e00\u4e2a\u9762\u5411\u56e0\u679c\u63a8\u65ad\u7406\u8bba\u7814\u7a76\u7684\u81ea\u52a8\u5316\u6846\u67b6\uff0c\u5c06 Lean \u8bc1\u660e\u52a9\u624b\u4f5c\u4e3a\u53ef\u9760\u8bc4\u4f30\u57fa\u7840\u3002\u5b83\u7ed3\u5408\u56e0\u679c\u63a8\u65ad\u5f62\u5f0f\u5316\u5e93 Causalean \u4e0e\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf CausalSmith\uff0c\u81ea\u52a8\u9009\u9898\u3001\u63d0\u51fa\u7ed3\u679c\u3001\u5f62\u5f0f\u5316\u547d\u9898\u3001\u6784\u9020\u8bc1\u660e\u5e76\u4f9b\u4eba\u5ba1\u67e5\u3002", "why_notable": "\u5b83\u5c06\u81ea\u52a8\u79d1\u7814\u4ece\u4f9d\u8d56\u4e0d\u53ef\u9760\u7684 LLM \u5ba1\u7a3f\uff0c\u63a8\u8fdb\u5230\u57fa\u4e8e\u5f62\u5f0f\u5316\u8bc1\u660e\u7684\u53ef\u9a8c\u8bc1\u95ed\u73af\uff0c\u5e76\u7279\u522b\u5173\u6ce8\u201c\u5f62\u5f0f\u547d\u9898\u662f\u5426\u5bf9\u5e94\u771f\u5b9e\u79d1\u7814\u4e3b\u5f20\u201d\u8fd9\u4e00\u5173\u952e\u53ef\u9760\u6027\u95ee\u9898\uff0c\u5bf9\u81ea\u52a8\u5316\u7406\u8bba\u7814\u7a76\u548c\u56e0\u679c\u63a8\u65ad\u5f62\u5f0f\u5316\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Routing to select large language models (LLMs) with different cost-quality trade-offs has become a fundamental deployment feature of enterprise AI. Existing routers, primarily make independent routing decisions for each LLM call. However, agentic applications execute as long-horizon workflows whose quality is determined only by a delayed, task-level outcome. This mismatch prevents per-call routers from correctly attributing feedback to individual routing decisions. Towards mitigating this, we present TRACE-Router, a task-level routing framework that aligns routing with the unit of supervision. TRACE-Router assigns each task to a model once at admission using a contextual bandit, pins all subsequent LLM calls to the selected backend, and updates its policy using the task\u0027s terminal reward, jointly accounting for accuracy and latency. By leveraging delayed task feedback, TRACE-Router learns routing policies that adapt to the workload while avoiding explicit task-complexity estimation. Across three agentic benchmarks, TRACE-Router consistently improves the accuracy-latency trade-off, achieving non-dominated Pareto frontier points. On tau2-Bench, it outperforms latency-matched interpolation between individual models by 7-8 accuracy points, while on Terminal-Bench it achieves 7.1 higher accuracy points than the strongest single model baseline with 36% lower latency.", "arxiv_id": "2607.22465", "arxiv_url": "https://arxiv.org/abs/2607.22465", "authors": ["Ritik Raj", "Souvik Kundu", "Sarbartha Banerjee", "Dheemanth Joshi", "Ishita Vohra", "Tushar Krishna"], "brief": "\u8bba\u6587\u63d0\u51fa TRACE-Router\uff0c\u5c06LLM\u8def\u7531\u51b3\u7b56\u4ece\u5355\u6b21\u8c03\u7528\u63d0\u5347\u5230\u4efb\u52a1\u7ea7\uff1a\u4efb\u52a1\u8fdb\u5165\u65f6\u7528\u4e0a\u4e0b\u6587\u8d4c\u535a\u673a\u9009\u62e9\u4e00\u4e2a\u540e\u7aef\u6a21\u578b\uff0c\u5e76\u5728\u6574\u4e2a\u957f\u7a0b\u667a\u80fd\u4f53\u6d41\u7a0b\u4e2d\u56fa\u5b9a\u4f7f\u7528\u8be5\u6a21\u578b\u3002\u7cfb\u7edf\u4f9d\u636e\u6700\u7ec8\u4efb\u52a1\u5956\u52b1\u66f4\u65b0\u7b56\u7565\uff0c\u540c\u65f6\u6743\u8861\u51c6\u786e\u7387\u4e0e\u5ef6\u8fdf\u3002", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22465", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u667a\u80fd\u4f53\u957f\u7a0b\u5de5\u4f5c\u6d41\u4e2d\u53cd\u9988\u5ef6\u8fdf\u3001\u5355\u6b21\u8c03\u7528\u96be\u4ee5\u5f52\u56e0\u7684\u95ee\u9898\uff0c\u5c06\u76d1\u7763\u4fe1\u53f7\u5bf9\u9f50\u5230\u4efb\u52a1\u7ea7\u7ed3\u679c", "\u91c7\u7528 contextual bandit \u5728\u7ebf\u5b66\u4e60\u8def\u7531\u7b56\u7565\uff0c\u65e0\u9700\u663e\u5f0f\u4f30\u8ba1\u4efb\u52a1\u590d\u6742\u5ea6\u5373\u53ef\u9002\u5e94\u5de5\u4f5c\u8d1f\u8f7d\u53d8\u5316", "\u5728 tau2-Bench \u548c Terminal-Bench \u7b49\u4e09\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u4f18\u51c6\u786e\u7387-\u5ef6\u8fdf\u5e15\u7d2f\u6258\u524d\u6cbf\uff1bTerminal-Bench \u4e0a\u6bd4\u6700\u5f3a\u5355\u6a21\u578b\u9ad8 7.1 \u4e2a\u51c6\u786e\u7387\u70b9\u4e14\u5ef6\u8fdf\u4f4e 36%"], "keywords": ["\u667a\u80fd\u4f53", "\u6a21\u578b\u8def\u7531", "\u5728\u7ebf\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22465v1", "published_at": "2026-07-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TRACE-ROUTER: Task-Consistent and Adaptive Online Routing for Agentic AI", "tldr": "\u9762\u5411\u667a\u80fd\u4f53\u4efb\u52a1\u7684\u81ea\u9002\u5e94LLM\u8def\u7531\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TRACE-Router\uff0c\u5c06LLM\u8def\u7531\u51b3\u7b56\u4ece\u5355\u6b21\u8c03\u7528\u63d0\u5347\u5230\u4efb\u52a1\u7ea7\uff1a\u4efb\u52a1\u8fdb\u5165\u65f6\u7528\u4e0a\u4e0b\u6587\u8d4c\u535a\u673a\u9009\u62e9\u4e00\u4e2a\u540e\u7aef\u6a21\u578b\uff0c\u5e76\u5728\u6574\u4e2a\u957f\u7a0b\u667a\u80fd\u4f53\u6d41\u7a0b\u4e2d\u56fa\u5b9a\u4f7f\u7528\u8be5\u6a21\u578b\u3002\u7cfb\u7edf\u4f9d\u636e\u6700\u7ec8\u4efb\u52a1\u5956\u52b1\u66f4\u65b0\u7b56\u7565\uff0c\u540c\u65f6\u6743\u8861\u51c6\u786e\u7387\u4e0e\u5ef6\u8fdf\u3002", "why_notable": "\u4f01\u4e1a\u7ea7AI\u90e8\u7f72\u4e2d\u6a21\u578b\u8def\u7531\u76f4\u63a5\u5f71\u54cd\u6210\u672c\u3001\u5ef6\u8fdf\u548c\u8d28\u91cf\u3002\u8be5\u5de5\u4f5c\u8868\u660e\uff0c\u5bf9\u667a\u80fd\u4f53\u5e94\u7528\u800c\u8a00\uff0c\u4efb\u52a1\u7ea7\u8def\u7531\u6bd4\u9010\u8c03\u7528\u8def\u7531\u66f4\u7b26\u5408\u771f\u5b9e\u4f18\u5316\u76ee\u6807\uff0c\u53ef\u663e\u8457\u6539\u5584\u957f\u7a0b\u4efb\u52a1\u7684\u6548\u7387\u4e0e\u6548\u679c\u6743\u8861\u3002"}, {"abstract": "Diagnosing the root cause of anomalies is essential for safe industrial operation. Despite extensive sensor instrumentation, formulating hypotheses and gathering evidence remains a manual process, creating a major operational bottleneck. While existing data-driven approaches aim to automate this, two critical limitations restrict their deployment: their operate as black boxes unable to justify their diagnosis, and they require scarce labeled examples of faulty operation. To address this gap, we introduce AgentRCA, a zero-shot agentic framework for evidence-grounded root cause analysis. Rather than learning fault-specific mappings, AgentRCA performs inference-time reasoning by combining a data-driven digital twin (modeling normal system dynamics) with a tool-augmented large language model. The agent iteratively gathers statistical evidence, evaluates competing hypotheses, and identifies the physical fault that best explains the observed behavior. Evaluated on a real-world multiphase-flow facility and a large-scale chemical plant, AgentRCA achieves diagnostic performance competitive with fully supervised baselines without relying on fault-specific training. Crucially, it produces transparent reasoning traces that explicitly link observed symptoms to their underlying physical causes. These results establish autonomous hypothesis-driven reasoning as a practical foundation for scalable industrial root cause analysis.", "arxiv_id": "2607.22385", "arxiv_url": "https://arxiv.org/abs/2607.22385", "authors": ["Amaury Wei", "Olga Fink"], "brief": "\u8bba\u6587\u63d0\u51fa AgentRCA\uff0c\u4e00\u4e2a\u7528\u4e8e\u5de5\u4e1a\u5f02\u5e38\u6839\u56e0\u5206\u6790\u7684\u96f6\u6837\u672c\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u7ed3\u5408\u6570\u636e\u9a71\u52a8\u7684\u6570\u5b57\u5b6a\u751f\u4e0e\u5de5\u5177\u589e\u5f3a\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u63a8\u7406\u65f6\u4e3b\u52a8\u6536\u96c6\u7edf\u8ba1\u8bc1\u636e\u3001\u6bd4\u8f83\u5047\u8bbe\u5e76\u5b9a\u4f4d\u7269\u7406\u6545\u969c\u539f\u56e0\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22385", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0d\u4f9d\u8d56\u6545\u969c\u7c7b\u578b\u6807\u6ce8\u6570\u636e\u8bad\u7ec3\uff0c\u800c\u662f\u5229\u7528\u6b63\u5e38\u5de5\u51b5\u6570\u5b57\u5b6a\u751f\u5efa\u6a21\u7cfb\u7edf\u52a8\u6001\u5e76\u8fdb\u884c\u63a8\u7406\u65f6\u8bca\u65ad", "LLM \u667a\u80fd\u4f53\u901a\u8fc7\u8c03\u7528\u5de5\u5177\u8fed\u4ee3\u83b7\u53d6\u7edf\u8ba1\u8bc1\u636e\uff0c\u8bc4\u4f30\u7ade\u4e89\u6027\u6545\u969c\u5047\u8bbe\uff0c\u5f62\u6210\u8bc1\u636e\u652f\u6491\u7684\u63a8\u7406\u94fe", "\u5728\u771f\u5b9e\u591a\u76f8\u6d41\u8bbe\u65bd\u548c\u5927\u89c4\u6a21\u5316\u5de5\u5382\u6570\u636e\u4e0a\uff0c\u8fbe\u5230\u63a5\u8fd1\u5168\u76d1\u7763\u65b9\u6cd5\u7684\u8bca\u65ad\u6027\u80fd\uff0c\u5e76\u63d0\u4f9b\u900f\u660e\u53ef\u8ffd\u6eaf\u89e3\u91ca"], "keywords": ["\u667a\u80fd\u4f53", "\u6839\u56e0\u5206\u6790", "\u5de5\u4e1aAI", "\u6570\u5b57\u5b6a\u751f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22385v1", "published_at": "2026-07-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Agentic Root Cause Analysis through Evidence-Grounded Reasoning", "tldr": "\u96f6\u6837\u672c\u667a\u80fd\u4f53\u5b9e\u73b0\u53ef\u89e3\u91ca\u5de5\u4e1a\u6839\u56e0\u8bca\u65ad", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AgentRCA\uff0c\u4e00\u4e2a\u7528\u4e8e\u5de5\u4e1a\u5f02\u5e38\u6839\u56e0\u5206\u6790\u7684\u96f6\u6837\u672c\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u7ed3\u5408\u6570\u636e\u9a71\u52a8\u7684\u6570\u5b57\u5b6a\u751f\u4e0e\u5de5\u5177\u589e\u5f3a\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u63a8\u7406\u65f6\u4e3b\u52a8\u6536\u96c6\u7edf\u8ba1\u8bc1\u636e\u3001\u6bd4\u8f83\u5047\u8bbe\u5e76\u5b9a\u4f4d\u7269\u7406\u6545\u969c\u539f\u56e0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u667a\u80fd\u4f53\u5f0f\u5047\u8bbe\u63a8\u7406\u5f15\u5165\u5de5\u4e1a\u6839\u56e0\u5206\u6790\uff0c\u7f13\u89e3\u4e86\u4f20\u7edf\u9ed1\u76d2\u6a21\u578b\u4e0d\u53ef\u89e3\u91ca\u3001\u76d1\u7763\u65b9\u6cd5\u4f9d\u8d56\u7a00\u7f3a\u6545\u969c\u6807\u7b7e\u7684\u95ee\u9898\uff0c\u5bf9\u53ef\u6269\u5c55\u3001\u53ef\u4fe1\u7684\u5de5\u4e1a\u8fd0\u7ef4\u8bca\u65ad\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present Nanbeige4.2-3B, a compact general agentic model with 3B non-embedding parameters. It delivers strong performance across code-agent, office-agent, and complex tool-use tasks while maintaining highly competitive reasoning capabilities in mathematics, coding, and science. Nanbeige4.2-3B is pretrained from scratch on 28T tokens with a Looped Transformer that reuses the layer stack to increase capacity without adding parameters. For SFT data and trajectory construction, we expand the diversity of executable environments, task assets, and agentic scaffolds through real-world deployment and large-scale synthesis. Our RL pipeline applies mixed-mode RLHF over Think and Non-Think responses to improve overall model quality and reduce failure cases, length-controlled reasoning RL to balance accuracy and reasoning efficiency, and agentic RL with outcome and process rewards to stabilize long-horizon training. Extensive evaluations show that Nanbeige4.2-3B outperforms larger models, including Qwen3.5-9B and Gemma4-12B, across diverse agentic benchmarks while remaining competitive on reasoning and alignment tasks. Performance with OpenClaw further supports its use as a compact local personal assistant.", "arxiv_id": "2607.22083", "arxiv_url": "https://arxiv.org/abs/2607.22083", "authors": ["Nanbeige Lab", ":", "Chen Yang", "Chengrui Huang", "Fufeng Lan", "Hanhui Chen", "Hao Zhou", "Huatong Song", "Jiaqi Cao", "Jiaying Zhu", "Jinlin Niu", "Kai Wang", "Lisheng Huang", "Qiliang Liang", "Ran Le", "Ruixiang Feng", "Shuang Sun", "Tao Gu", "Tao Zhang", "Tianyu Luo", "Yang Song", "Yun Xing", "Yuntao Wen", "Ziyao Xu", "Zongchao Chen", "Zongqiang Li"], "brief": "\u8bba\u6587\u63d0\u51fa Nanbeige4.2-3B\uff0c\u4e00\u4e2a\u4ec5\u542b 3B \u975e\u5d4c\u5165\u53c2\u6570\u7684\u901a\u7528\u667a\u80fd\u4f53\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4ece\u96f6\u9884\u8bad\u7ec3\u3001\u667a\u80fd\u4f53\u6570\u636e\u6784\u5efa\u4e0e\u591a\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\uff0c\u5728\u4ee3\u7801\u667a\u80fd\u4f53\u3001\u529e\u516c\u667a\u80fd\u4f53\u548c\u590d\u6742\u5de5\u5177\u4f7f\u7528\u4efb\u52a1\u4e0a\u53d6\u5f97\u5f3a\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22083", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4f7f\u7528 Looped Transformer \u590d\u7528\u5c42\u6808\uff0c\u5728\u4e0d\u589e\u52a0\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u6a21\u578b\u5bb9\u91cf\uff0c\u5e76\u57fa\u4e8e 28T tokens \u4ece\u96f6\u9884\u8bad\u7ec3\u3002", "\u901a\u8fc7\u771f\u5b9e\u90e8\u7f72\u4e0e\u5927\u89c4\u6a21\u5408\u6210\u6269\u5c55\u53ef\u6267\u884c\u73af\u5883\u3001\u4efb\u52a1\u8d44\u4ea7\u548c\u667a\u80fd\u4f53\u811a\u624b\u67b6\uff0c\u63d0\u5347 SFT \u8f68\u8ff9\u591a\u6837\u6027\u3002", "\u5f3a\u5316\u5b66\u4e60\u7ba1\u7ebf\u7ed3\u5408\u6df7\u5408\u6a21\u5f0f RLHF\u3001\u957f\u5ea6\u53d7\u63a7\u63a8\u7406 RL\uff0c\u4ee5\u53ca\u5e26\u7ed3\u679c\u548c\u8fc7\u7a0b\u5956\u52b1\u7684\u667a\u80fd\u4f53 RL\uff0c\u4ee5\u63d0\u5347\u8d28\u91cf\u3001\u6548\u7387\u548c\u957f\u7a0b\u7a33\u5b9a\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5c0f\u6a21\u578b", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22083v1", "published_at": "2026-07-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Nanbeige4.2-3B: Unlocking Agentic Capabilities in a Compact Mode", "tldr": "3B\u5c0f\u6a21\u578b\u5b9e\u73b0\u5f3a\u5de5\u5177\u4e0e\u667a\u80fd\u4f53\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Nanbeige4.2-3B\uff0c\u4e00\u4e2a\u4ec5\u542b 3B \u975e\u5d4c\u5165\u53c2\u6570\u7684\u901a\u7528\u667a\u80fd\u4f53\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4ece\u96f6\u9884\u8bad\u7ec3\u3001\u667a\u80fd\u4f53\u6570\u636e\u6784\u5efa\u4e0e\u591a\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\uff0c\u5728\u4ee3\u7801\u667a\u80fd\u4f53\u3001\u529e\u516c\u667a\u80fd\u4f53\u548c\u590d\u6742\u5de5\u5177\u4f7f\u7528\u4efb\u52a1\u4e0a\u53d6\u5f97\u5f3a\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u7d27\u51d1\u6a21\u578b\u4e5f\u80fd\u5177\u5907\u8f83\u5f3a\u7684\u672c\u5730\u5316\u667a\u80fd\u4f53\u80fd\u529b\uff0c\u5e76\u5728\u591a\u7c7b\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\u8d85\u8fc7 Qwen3.5-9B\u3001Gemma4-12B \u7b49\u66f4\u5927\u6a21\u578b\uff0c\u5bf9\u4f4e\u6210\u672c\u672c\u5730\u4e2a\u4eba\u52a9\u624b\u548c\u7aef\u4fa7\u5de5\u5177\u8c03\u7528\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) are emerging as core reasoning modules for embodied agents, yet it remains unclear how well general-purpose models can solve long-horizon embodied tasks from a single high-level instruction. We introduce MissionBench, a benchmark for mission-level evaluation of MLLMs in aerial 3D environments. It comprises 120 missions across five simulated 3D environments and four task families. Agents must autonomously plan, navigate, and report outcomes using only egocentric observations and its action history, without aerial-specific fine-tuning. Across 22 open- and closed-source MLLMs, the strongest model succeeds on fewer than 35% of missions compared to 84.4% human performance, highlighting the difficulty of multi-step embodied tasks. Despite large variations between model families, we observe gains from scaling, indicating that larger general-purpose models possess stronger zero-shot embodied capabilities. Our analysis shows that mission-level competence requires coordinating multiple capabilities beyond spatial perception, including multi-step planning and adaptive reasoning. This motivates closed-loop evaluation and highlights both the promise and risk of scaling-driven improvements for embodied AI.", "arxiv_id": "2607.22014", "arxiv_url": "https://arxiv.org/abs/2607.22014", "authors": ["Suman Navaratnarajah", "Taehyoung Kim", "Jona Ruthardt", "Ishaan Bhimwal", "Ryousuke Yamada", "Yannik Blei", "Wolfram Burgard", "Yuki M Asano"], "brief": "\u8bba\u6587\u63d0\u51fa MissionBench\uff0c\u7528\u4e8e\u5728\u822a\u62cd\u4e09\u7ef4\u73af\u5883\u4e2d\u8bc4\u4f30 MLLM \u667a\u80fd\u4f53\u4ece\u5355\u6761\u9ad8\u5c42\u6307\u4ee4\u5b8c\u6210\u957f\u7a0b\u4efb\u52a1\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b5\u4e2a\u6a21\u62df3D\u73af\u5883\u30014\u7c7b\u4efb\u52a1\u5171120\u4e2a\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u4ec5\u51ed\u7b2c\u4e00\u89c6\u89d2\u89c2\u5bdf\u548c\u52a8\u4f5c\u5386\u53f2\u81ea\u4e3b\u89c4\u5212\u3001\u5bfc\u822a\u5e76\u6c47\u62a5\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22014", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b22\u4e2a\u5f00\u6e90\u4e0e\u95ed\u6e90MLLM\uff0c\u6700\u4f73\u6a21\u578b\u4efb\u52a1\u6210\u529f\u7387\u4f4e\u4e8e35%\uff0c\u663e\u8457\u843d\u540e\u4e8e\u4eba\u7c7b84.4%\u7684\u8868\u73b0", "\u4efb\u52a1\u5f3a\u8c03\u95ed\u73af\u3001\u957f\u7a0b\u3001\u4efb\u52a1\u7ea7\u8bc4\u4f30\uff0c\u800c\u975e\u5355\u6b65\u611f\u77e5\u6216\u9759\u6001\u95ee\u7b54\uff0c\u8986\u76d6\u89c4\u5212\u3001\u5bfc\u822a\u3001\u7ed3\u679c\u62a5\u544a\u7b49\u80fd\u529b", "\u5b9e\u9a8c\u663e\u793a\u6a21\u578b\u89c4\u6a21\u6269\u5927\u5e26\u6765\u96f6\u6837\u672c\u5177\u8eab\u80fd\u529b\u63d0\u5347\uff0c\u4f46\u4efb\u52a1\u6210\u529f\u4ecd\u9700\u7a7a\u95f4\u611f\u77e5\u3001\u591a\u6b65\u89c4\u5212\u4e0e\u81ea\u9002\u5e94\u63a8\u7406\u534f\u540c"], "keywords": ["\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd", "\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22014v1", "published_at": "2026-07-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Zero-Shot Mission-Level Evaluation for Aerial MLLM Agents", "tldr": "MissionBench\u8bc4\u6d4b\u822a\u62cd\u5177\u8eabMLLM\u96f6\u6837\u672c\u4efb\u52a1\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MissionBench\uff0c\u7528\u4e8e\u5728\u822a\u62cd\u4e09\u7ef4\u73af\u5883\u4e2d\u8bc4\u4f30 MLLM \u667a\u80fd\u4f53\u4ece\u5355\u6761\u9ad8\u5c42\u6307\u4ee4\u5b8c\u6210\u957f\u7a0b\u4efb\u52a1\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b5\u4e2a\u6a21\u62df3D\u73af\u5883\u30014\u7c7b\u4efb\u52a1\u5171120\u4e2a\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u4ec5\u51ed\u7b2c\u4e00\u89c6\u89d2\u89c2\u5bdf\u548c\u52a8\u4f5c\u5386\u53f2\u81ea\u4e3b\u89c4\u5212\u3001\u5bfc\u822a\u5e76\u6c47\u62a5\u7ed3\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06MLLM\u8bc4\u4f30\u63a8\u8fdb\u5230\u822a\u62cd\u4e09\u7ef4\u5177\u8eab\u4efb\u52a1\u7ea7\u522b\uff0c\u63ed\u793a\u901a\u7528\u591a\u6a21\u6001\u6a21\u578b\u5728\u771f\u5b9e\u957f\u7a0b\u95ed\u73af\u4efb\u52a1\u4e2d\u7684\u660e\u663e\u77ed\u677f\uff0c\u540c\u65f6\u4e5f\u6307\u51fa\u89c4\u6a21\u5316\u53ef\u80fd\u5e26\u6765\u7684\u5177\u8eab\u80fd\u529b\u63d0\u5347\u4e0e\u6f5c\u5728\u98ce\u9669\u3002"}, {"abstract": "Vision-language models (VLMs) process large numbers of visual tokens, resulting in substantial inference latency and memory overhead. This has motivated extensive research on visual token compression. While training-free strategies rely on heuristic metrics and suffer significant performance degradation under high compression ratios, many training-based methods introduce external compression modules that force the VLM backbone to adapt, incurring substantial retraining cost and compromising VLMs\u0027 priors. Effective visual token compression hinges on strong information encoding, a capability already present in pretrained VLMs but underutilized by existing approaches. Motivated by this, we propose VisCo, a training-efficient self-compression framework that reuses the pretrained VLM itself as an intrinsic compressor. VisCo is a parameter-sharing autoencoder that compresses visual information using a small set of memory tokens and transfers hierarchical information from encoding to decoding. Experiments show that VisCo surpasses prior methods across all evaluated compression ratios, with larger gains under more aggressive compression, and remains stable even in the extreme single-token setting. Moreover, when combined with the original visual tokens, the learned memory tokens can even improve the base model, suggesting that VisCo captures complementary representations beyond compression.", "arxiv_id": "2607.12756", "arxiv_url": "https://arxiv.org/abs/2607.12756", "authors": ["Yupeng Zheng", "Kai Zou", "Bin Liu", "Nenghai Yu"], "brief": "VisCo\u63d0\u51fa\u4e00\u79cd\u8bad\u7ec3\u9ad8\u6548\u7684\u81ea\u538b\u7f29\u6846\u67b6\uff0c\u5c06\u9884\u8bad\u7ec3VLM\u672c\u8eab\u590d\u7528\u4e3a\u5185\u5728\u538b\u7f29\u5668\u3002\u5b83\u901a\u8fc7\u5c11\u91cfmemory tokens\u8fdb\u884c\u89c6\u89c9\u4fe1\u606f\u538b\u7f29\uff0c\u5e76\u5728\u7f16\u7801\u5230\u89e3\u7801\u8fc7\u7a0b\u4e2d\u4f20\u9012\u5c42\u7ea7\u4fe1\u606f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Zyvpeng/VisCo", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2607.12756", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u53c2\u6570\u5171\u4eab\u7684\u81ea\u7f16\u7801\u5668\u8bbe\u8ba1\uff0c\u907f\u514d\u5f15\u5165\u5927\u578b\u5916\u90e8\u538b\u7f29\u6a21\u5757\uff0c\u964d\u4f4e\u91cd\u8bad\u7ec3\u6210\u672c\u5e76\u4fdd\u7559VLM\u5148\u9a8c\u3002", "\u5728\u591a\u79cd\u538b\u7f29\u6bd4\u4f8b\u4e0b\u5747\u4f18\u4e8e\u65e2\u6709\u65b9\u6cd5\uff0c\u538b\u7f29\u8d8a\u6fc0\u8fdb\u6536\u76ca\u8d8a\u660e\u663e\uff0c\u5355token\u6781\u7aef\u538b\u7f29\u573a\u666f\u4ecd\u4fdd\u6301\u7a33\u5b9a\u3002", "\u5b66\u4e60\u5230\u7684memory tokens\u4e0e\u539f\u59cb\u89c6\u89c9token\u7ed3\u5408\u65f6\u8fd8\u80fd\u63d0\u5347\u57fa\u7840\u6a21\u578b\u8868\u73b0\uff0c\u8bf4\u660e\u5176\u6355\u83b7\u4e86\u4e92\u8865\u8868\u5f81\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u538b\u7f29", "\u591a\u6a21\u6001", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.12756v1", "published_at": "2026-07-14", "score": 0.247, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.12756.png", "title": "VisCo: Leveraging Large Language Models as Intrinsic Encoders for Visual Token Compression", "tldr": "\u7528VLM\u81ea\u8eab\u7f16\u7801\u5668\u9ad8\u6548\u538b\u7f29\u89c6\u89c9token", "upvotes": 1, "what_it_is": "VisCo\u63d0\u51fa\u4e00\u79cd\u8bad\u7ec3\u9ad8\u6548\u7684\u81ea\u538b\u7f29\u6846\u67b6\uff0c\u5c06\u9884\u8bad\u7ec3VLM\u672c\u8eab\u590d\u7528\u4e3a\u5185\u5728\u538b\u7f29\u5668\u3002\u5b83\u901a\u8fc7\u5c11\u91cfmemory tokens\u8fdb\u884c\u89c6\u89c9\u4fe1\u606f\u538b\u7f29\uff0c\u5e76\u5728\u7f16\u7801\u5230\u89e3\u7801\u8fc7\u7a0b\u4e2d\u4f20\u9012\u5c42\u7ea7\u4fe1\u606f\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u9884\u8bad\u7ec3VLM\u5df2\u6709\u7684\u4fe1\u606f\u7f16\u7801\u80fd\u529b\u7528\u4e8e\u89c6\u89c9token\u538b\u7f29\uff0c\u517c\u987e\u9ad8\u538b\u7f29\u7387\u3001\u4f4e\u8bad\u7ec3\u6210\u672c\u548c\u6027\u80fd\u7a33\u5b9a\u6027\uff0c\u5bf9\u964d\u4f4eVLM\u63a8\u7406\u5ef6\u8fdf\u4e0e\u663e\u5b58\u5f00\u9500\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-language model (VLM) agents increasingly use tools to act on 3D scenes rather than only describe them. Existing 3D benchmarks score textual responses or single-object operations, leaving agent action on complete multi-object 3D scenes under evaluated. We present SceneActBench, a benchmark for visually conditioned action across five 3D tasks under a unified agent-environment loop. Given PNG images or sampled video frames and, where applicable, supplied 3D assets, an agent acts on a 3D environment. We evaluate each final output against hidden ground truth with task-specific geometric metrics. SceneActBench comprises five tasks built from 210 source instances, yielding 520 task cases including paired input conditions. Every task runs through one fixed agent loop to keep the comparison fair. Across eleven proprietary VLM configurations, Overall scores span 38.6-50.2, and none performs consistently well across tasks. We further analyse where and how failures manifest.", "arxiv_id": "2607.22393", "arxiv_url": "https://arxiv.org/abs/2607.22393", "authors": ["Yifei Zhao", "Xiangxin Zhou", "Wenhao Yang", "Jiaqi Tang", "Pu Jian", "Huanjin Yao", "Jiarui Yao", "Haowei Lin", "Chunchao Guo", "Zhuo Chen", "Wenkai Lyu", "Jianzhu Ma", "Xueqian Wang", "Wenxi Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa SceneActBench\uff0c\u4e00\u4e2a\u9762\u5411\u5b8c\u6574\u591a\u7269\u4f533D\u573a\u666f\u7684\u89c6\u89c9\u6761\u4ef6\u52a8\u4f5c\u57fa\u51c6\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u7684\u667a\u80fd\u4f53-\u73af\u5883\u5faa\u73af\uff0c\u8ba9VLM\u667a\u80fd\u4f53\u57fa\u4e8e\u56fe\u50cf/\u89c6\u9891\u5e27\u53ca\u53ef\u90093D\u8d44\u4ea7\u6267\u884c\u4e94\u7c7b3D\u4efb\u52a1\uff0c\u5e76\u7528\u9690\u85cf\u771f\u503c\u7684\u51e0\u4f55\u6307\u6807\u8bc4\u4f30\u6700\u7ec8\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": "https://github.com/Feinaldo2/SceneActBench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2607.22393", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b5\u7c7b3D\u573a\u666f\u884c\u52a8\u4efb\u52a1\uff0c\u57fa\u4e8e210\u4e2a\u6e90\u5b9e\u4f8b\u6784\u5efa520\u4e2a\u4efb\u52a1\u6848\u4f8b\uff0c\u5e76\u652f\u6301\u6210\u5bf9\u8f93\u5165\u6761\u4ef6\u5bf9\u6bd4", "\u6240\u6709\u6a21\u578b\u4f7f\u7528\u56fa\u5b9a\u7edf\u4e00\u7684\u667a\u80fd\u4f53\u5faa\u73af\uff0c\u907f\u514d\u56e0\u4ea4\u4e92\u6d41\u7a0b\u4e0d\u540c\u9020\u6210\u4e0d\u516c\u5e73\u6bd4\u8f83", "\u8bc4\u6d4b11\u79cd\u95ed\u6e90VLM\u914d\u7f6e\uff0c\u603b\u5206\u4ec5\u4e3a38.6\u523050.2\uff0c\u4e14\u6ca1\u6709\u6a21\u578b\u80fd\u5728\u6240\u6709\u4efb\u52a1\u4e0a\u7a33\u5b9a\u8868\u73b0\u826f\u597d"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "3D\u573a\u666f", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22393v1", "published_at": "2026-07-24", "score": 0.221, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.22393.png", "title": "SceneActBench: Can Agents Act on the 3D Scenes They See?", "tldr": "\u8bc4\u6d4bVLM\u667a\u80fd\u4f53\u57283D\u573a\u666f\u4e2d\u7684\u771f\u5b9e\u884c\u52a8\u80fd\u529b", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa SceneActBench\uff0c\u4e00\u4e2a\u9762\u5411\u5b8c\u6574\u591a\u7269\u4f533D\u573a\u666f\u7684\u89c6\u89c9\u6761\u4ef6\u52a8\u4f5c\u57fa\u51c6\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u7684\u667a\u80fd\u4f53-\u73af\u5883\u5faa\u73af\uff0c\u8ba9VLM\u667a\u80fd\u4f53\u57fa\u4e8e\u56fe\u50cf/\u89c6\u9891\u5e27\u53ca\u53ef\u90093D\u8d44\u4ea7\u6267\u884c\u4e94\u7c7b3D\u4efb\u52a1\uff0c\u5e76\u7528\u9690\u85cf\u771f\u503c\u7684\u51e0\u4f55\u6307\u6807\u8bc4\u4f30\u6700\u7ec8\u7ed3\u679c\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u8bc4\u6d4b\u6587\u672c\u56de\u7b54\u6216\u5355\u7269\u4f53\u64cd\u4f5c\u76843D\u57fa\u51c6\uff0cSceneActBench\u66f4\u8d34\u8fd1VLM\u667a\u80fd\u4f53\u5728\u590d\u67423D\u73af\u5883\u4e2d\u611f\u77e5\u3001\u89c4\u5212\u548c\u6267\u884c\u52a8\u4f5c\u7684\u771f\u5b9e\u9700\u6c42\uff0c\u63ed\u793a\u4e86\u5f53\u524d\u6a21\u578b\u5728\u591a\u7269\u4f533D\u573a\u666f\u64cd\u4f5c\u4e0a\u7684\u660e\u663e\u77ed\u677f\u3002"}, {"abstract": "In multilingual retrieval augmented generation, a retriever can retrieve relevant documents written in multiple languages, which are subsequently reranked before answer generation. However, it remains unclear whether existing multilingual rerankers consider document language when ordering semantically relevant candidates. Our analysis shows that these rerankers do not consistently prioritize documents written in the same language as the query when semantically equivalent documents are available across languages, even though document language can affect answer generation. We release LAMAR, a language aware multilingual cross encoder trained to account for both semantic relevance and language coherence. LAMAR first uses English anchored relevance distillation to establish consistent relevance scoring across multilingual inputs and then applies preference alignment for language coherence to encourage documents written in the same language as the query to receive higher rankings while retaining semantic relevance. In a controlled experiment designed to assess language coherence, LAMAR achieves the best performance overall and across all languages examined individually. LAMAR also remains competitive on established multilingual reranking benchmarks. In practical retrieval settings, LAMAR achieves the best results across all reported metrics when reranking candidates retrieved in the first stage. These results demonstrate that LAMAR accounts for language coherence while achieving strong performance on general multilingual reranking benchmarks.", "arxiv_id": "2607.22042", "arxiv_url": "https://arxiv.org/abs/2607.22042", "authors": ["Seongtae Hong", "Youngjoon Jang", "Jungseob Lee", "Seungyoon Lee", "Heuiseok Lim"], "brief": "\u8bba\u6587\u53d1\u5e03\u4e86 LAMAR\uff0c\u4e00\u4e2a\u8bed\u8a00\u611f\u77e5\u7684\u591a\u8bed cross-encoder \u91cd\u6392\u5668\uff0c\u7528\u4e8e\u591a\u8bed RAG \u4e2d\u5bf9\u8de8\u8bed\u8a00\u5019\u9009\u6587\u6863\u6392\u5e8f\u3002\u5b83\u5728\u8bed\u4e49\u76f8\u5173\u6027\u4e4b\u5916\u663e\u5f0f\u8003\u8651\u67e5\u8be2\u4e0e\u6587\u6863\u7684\u8bed\u8a00\u4e00\u81f4\u6027\uff0c\u4f18\u5148\u6392\u5e8f\u4e0e\u67e5\u8be2\u540c\u8bed\u79cd\u4e14\u8bed\u4e49\u76f8\u5173\u7684\u6587\u6863\u3002", "categories": ["cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22042", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u73b0\u6709\u591a\u8bed\u91cd\u6392\u5668\u5728\u8bed\u4e49\u7b49\u4ef7\u6587\u6863\u5b58\u5728\u65f6\uff0c\u5e76\u4e0d\u7a33\u5b9a\u4f18\u5148\u9009\u62e9\u4e0e\u67e5\u8be2\u540c\u8bed\u8a00\u7684\u6587\u6863\uff0c\u800c\u8fd9\u4f1a\u5f71\u54cd\u540e\u7eed\u7b54\u6848\u751f\u6210\u8d28\u91cf", "\u91c7\u7528 English-anchored relevance distillation \u5efa\u7acb\u8de8\u8bed\u8a00\u4e00\u81f4\u7684\u76f8\u5173\u6027\u8bc4\u5206\uff0c\u518d\u901a\u8fc7 language coherence preference alignment \u5f3a\u5316\u540c\u8bed\u79cd\u504f\u597d", "\u5728\u8bed\u8a00\u4e00\u81f4\u6027\u63a7\u5236\u5b9e\u9a8c\u3001\u591a\u8bed\u91cd\u6392\u57fa\u51c6\u548c\u5b9e\u9645\u4e24\u9636\u6bb5\u68c0\u7d22\u8bbe\u7f6e\u4e2d\uff0cLAMAR \u5747\u8868\u73b0\u5f3a\u52b2\uff0c\u5e76\u5728\u591a\u9879\u6307\u6807\u4e0a\u53d6\u5f97\u6700\u4f73\u7ed3\u679c"], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u591a\u8bed\u6a21\u578b", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u91cd\u6392\u5e8f"], "num_comments": 0, "on_hf": true, "organization": "NLP \u0026 AI - Korea University", "pdf_url": "https://arxiv.org/pdf/2607.22042v1", "published_at": "2026-07-24", "score": 0.204, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.22042.png", "title": "LAMAR: An Open Language-Aware Multilingual Alignment Reranker", "tldr": "LAMAR\u8ba9\u591a\u8bed\u68c0\u7d22\u91cd\u6392\u517c\u987e\u76f8\u5173\u6027\u4e0e\u8bed\u8a00\u4e00\u81f4\u6027", "upvotes": 2, "what_it_is": "\u8bba\u6587\u53d1\u5e03\u4e86 LAMAR\uff0c\u4e00\u4e2a\u8bed\u8a00\u611f\u77e5\u7684\u591a\u8bed cross-encoder \u91cd\u6392\u5668\uff0c\u7528\u4e8e\u591a\u8bed RAG \u4e2d\u5bf9\u8de8\u8bed\u8a00\u5019\u9009\u6587\u6863\u6392\u5e8f\u3002\u5b83\u5728\u8bed\u4e49\u76f8\u5173\u6027\u4e4b\u5916\u663e\u5f0f\u8003\u8651\u67e5\u8be2\u4e0e\u6587\u6863\u7684\u8bed\u8a00\u4e00\u81f4\u6027\uff0c\u4f18\u5148\u6392\u5e8f\u4e0e\u67e5\u8be2\u540c\u8bed\u79cd\u4e14\u8bed\u4e49\u76f8\u5173\u7684\u6587\u6863\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u591a\u8bed RAG \u4e2d\u88ab\u5ffd\u89c6\u7684\u201c\u8bed\u8a00\u4e00\u81f4\u6027\u201d\u95ee\u9898\uff0c\u5e76\u63d0\u4f9b\u5f00\u6e90\u91cd\u6392\u5668\uff0c\u5728\u4e0d\u727a\u7272\u901a\u7528\u591a\u8bed\u76f8\u5173\u6027\u6392\u5e8f\u80fd\u529b\u7684\u540c\u65f6\u6539\u5584\u4e0b\u6e38\u751f\u6210\u4f53\u9a8c\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent conditional video generation models have shown promising potentials to transform 3D engine renderings, such as depth maps and untextured geometry, into photorealistic videos for gaming and immersive content creation. These applications require long-horizon auto-regressive generation that continuously synthesizes new frames while preserving a persistent 3D world. Auto-regressive generators synthesize video chunk by chunk with a bounded KV cache, so when the camera revisits a location after its context has been evicted, the model often regenerates inconsistent appearance, even though the conditioning renderings (e.g., depth) remain perfectly aligned with the underlying geometry.We address this revisit inconsistency without any post-training by exploiting correspondences the 3D engine already provides: temporal correspondence retrieves pose-matched historical latent chunks into the KV cache as loop-closure memory, while spatial correspondence from camera pose and depth reprojection biases token-level attention toward geometrically corresponding regions of the retrieved chunks. We demonstrate our method on loop-closure trajectories mined from TartanAir and TartanGround dataset to mirror complicate real-world application scenarios, where it outperforms existing training-free baselines on revisit consistency without losing overall video quality. Project Page: https://wenchao-m.github.io/ClosetheLoop.github.io/", "arxiv_id": "2607.21848", "arxiv_url": "https://arxiv.org/abs/2607.21848", "authors": ["Wenchao Ma", "Changran Liu", "Sharon X. Huang", "Haomiao Jiang"], "brief": "\u672c\u6587\u9488\u5bf9\u81ea\u56de\u5f52\u751f\u6210\u5f0f\u6e32\u67d3\u4e2d\u76f8\u673a\u91cd\u8bbf\u65e7\u4f4d\u7f6e\u65f6\u5916\u89c2\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u540e\u8bad\u7ec3\u7684\u95ed\u73af\u8bb0\u5fc6\u65b9\u6cd5\u3002\u5b83\u5229\u75283D\u5f15\u64ce\u5df2\u6709\u7684\u65f6\u95f4\u4e0e\u7a7a\u95f4\u5bf9\u5e94\u5173\u7cfb\uff0c\u5c06\u5386\u53f2\u6f5c\u53d8\u91cf\u7247\u6bb5\u91cd\u65b0\u5f15\u5165KV\u7f13\u5b58\uff0c\u5e76\u5f15\u5bfc\u6ce8\u610f\u529b\u5bf9\u9f50\u51e0\u4f55\u5bf9\u5e94\u533a\u57df\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21848", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u65f6\u95f4\u5bf9\u5e94\u5173\u7cfb\u68c0\u7d22\u59ff\u6001\u5339\u914d\u7684\u5386\u53f2latent\u7247\u6bb5\uff0c\u4f5c\u4e3a\u81ea\u56de\u5f52\u751f\u6210\u7684loop-closure memory", "\u5229\u7528\u76f8\u673a\u4f4d\u59ff\u4e0e\u6df1\u5ea6\u91cd\u6295\u5f71\u5efa\u7acb\u7a7a\u95f4\u5bf9\u5e94\uff0c\u5728token\u7ea7\u6ce8\u610f\u529b\u4e2d\u504f\u5411\u51e0\u4f55\u4e00\u81f4\u533a\u57df", "\u5728TartanAir\u4e0eTartanGround\u6316\u6398\u7684\u95ed\u73af\u8f68\u8ff9\u4e0a\uff0c\u76f8\u6bd4\u73b0\u6709\u514d\u8bad\u7ec3\u57fa\u7ebf\u63d0\u5347\u91cd\u8bbf\u4e00\u81f4\u6027\u4e14\u4fdd\u6301\u6574\u4f53\u89c6\u9891\u8d28\u91cf"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u751f\u6210\u5f0f\u6e32\u67d3", "\u4e00\u81f4\u6027", "3D\u89c6\u89c9"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.21848v1", "published_at": "2026-07-23", "score": 0.204, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.21848.png", "title": "Closing the Loop: Training-Free Revisit Consistency for Autoregressive Generative Rendering", "tldr": "\u514d\u8bad\u7ec3\u63d0\u5347\u957f\u89c6\u9891\u91cd\u8bbf\u4e00\u81f4\u6027", "upvotes": 2, "what_it_is": "\u672c\u6587\u9488\u5bf9\u81ea\u56de\u5f52\u751f\u6210\u5f0f\u6e32\u67d3\u4e2d\u76f8\u673a\u91cd\u8bbf\u65e7\u4f4d\u7f6e\u65f6\u5916\u89c2\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u540e\u8bad\u7ec3\u7684\u95ed\u73af\u8bb0\u5fc6\u65b9\u6cd5\u3002\u5b83\u5229\u75283D\u5f15\u64ce\u5df2\u6709\u7684\u65f6\u95f4\u4e0e\u7a7a\u95f4\u5bf9\u5e94\u5173\u7cfb\uff0c\u5c06\u5386\u53f2\u6f5c\u53d8\u91cf\u7247\u6bb5\u91cd\u65b0\u5f15\u5165KV\u7f13\u5b58\uff0c\u5e76\u5f15\u5bfc\u6ce8\u610f\u529b\u5bf9\u9f50\u51e0\u4f55\u5bf9\u5e94\u533a\u57df\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u6a21\u578b\u5373\u53ef\u7f13\u89e3\u957f\u65f6\u7a0b\u89c6\u9891\u751f\u6210\u4e2d\u7684\u4e16\u754c\u6301\u4e45\u6027\u95ee\u9898\uff0c\u9002\u5408\u6e38\u620f\u3001\u4eff\u771f\u548c\u6c89\u6d78\u5f0f\u5185\u5bb9\u521b\u4f5c\u4e2d\u76843D\u5f15\u64ce\u5230\u7167\u7247\u7ea7\u89c6\u9891\u6e32\u67d3\u6d41\u7a0b\u3002"}, {"abstract": "With the rapid adoption of long-context large language models (LLMs), the continuously growing KV cache during decoding has become the critical memory bottleneck. To tackle this challenge, we propose HiKV, a novel algorithm-hardware co-design that exploits KV cache redundancy through hierarchical importance awareness. Algorithmically, HiKV compresses the KV cache at two granularities: Stage I evicts unimportant tokens within a fixed budget, and Stage II further loads only the significant elements of each retained token, reaching compression ratios unattainable at a single granularity. Architecturally, we develop a dedicated accelerator centered on a reconfigurable importance sorter that switches between the distinct sorting datapaths each stage requires, unifying the two-stage acceleration in one circuit with minimal overhead. Evaluated on representative LLMs, HiKV achieves up to 7.95x speedup and 90% energy reduction in the attention computation over the vanilla KV cache baseline within negligible 1% accuracy loss. Under iso-accuracy constraints, HiKV outperforms state-of-the-art importance-based methods by achieving an additional 1.82~4.87x reduction in external memory accesses. These benefits are enabled by specialized hardware components that add only 8% to the system area.", "arxiv_id": "2607.22389", "arxiv_url": "https://arxiv.org/abs/2607.22389", "authors": ["Chao Fang", "Jun Yin", "Man Shi", "Marian Verhelst"], "brief": "HiKV \u662f\u4e00\u79cd\u9762\u5411 LLM \u89e3\u7801\u7684\u7b97\u6cd5-\u786c\u4ef6\u534f\u540c\u65b9\u6848\uff0c\u901a\u8fc7\u5206\u5c42\u91cd\u8981\u6027\u611f\u77e5\u538b\u7f29 KV cache\uff0c\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u7684\u5185\u5b58\u74f6\u9888\u3002\u5b83\u7ed3\u5408 token \u7ea7\u6dd8\u6c70\u4e0e\u5143\u7d20\u7ea7\u52a0\u8f7d\uff0c\u5e76\u8bbe\u8ba1\u4e13\u7528\u52a0\u901f\u5668\u9ad8\u6548\u652f\u6301\u4e24\u9636\u6bb5\u6392\u5e8f\u4e0e\u538b\u7f29\u3002", "categories": ["cs.AR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22389", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Stage I \u5728\u56fa\u5b9a\u9884\u7b97\u5185\u6dd8\u6c70\u4e0d\u91cd\u8981 token\uff0cStage II \u8fdb\u4e00\u6b65\u4ec5\u52a0\u8f7d\u4fdd\u7559 token \u4e2d\u7684\u91cd\u8981 KV \u5143\u7d20\uff0c\u5b9e\u73b0\u5355\u4e00\u7c92\u5ea6\u65b9\u6cd5\u96be\u4ee5\u8fbe\u5230\u7684\u538b\u7f29\u7387", "\u63d0\u51fa\u53ef\u91cd\u6784\u91cd\u8981\u6027\u6392\u5e8f\u5668\uff0c\u5728\u540c\u4e00\u786c\u4ef6\u7535\u8def\u4e2d\u5207\u6362\u4e24\u9636\u6bb5\u6240\u9700\u7684\u4e0d\u540c\u6392\u5e8f\u6570\u636e\u901a\u8def\uff0c\u989d\u5916\u9762\u79ef\u5f00\u9500\u4ec5\u7ea6 8%", "\u5728\u4ee3\u8868\u6027 LLM \u4e0a\uff0c\u76f8\u6bd4\u539f\u59cb KV cache\uff0c\u6ce8\u610f\u529b\u8ba1\u7b97\u6700\u9ad8\u52a0\u901f 7.95 \u500d\u3001\u80fd\u8017\u964d\u4f4e 90%\uff0c\u7cbe\u5ea6\u635f\u5931\u53ef\u5ffd\u7565\u81f3\u7ea6 1%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "KV\u7f13\u5b58", "\u786c\u4ef6\u52a0\u901f", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22389v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HiKV: Hierarchical Importance-Aware KV Cache with Hardware Acceleration for LLM Decoding", "tldr": "\u5206\u5c42\u538b\u7f29KV\u7f13\u5b58\u52a0\u901f\u957f\u4e0a\u4e0b\u6587\u89e3\u7801", "upvotes": 0, "what_it_is": "HiKV \u662f\u4e00\u79cd\u9762\u5411 LLM \u89e3\u7801\u7684\u7b97\u6cd5-\u786c\u4ef6\u534f\u540c\u65b9\u6848\uff0c\u901a\u8fc7\u5206\u5c42\u91cd\u8981\u6027\u611f\u77e5\u538b\u7f29 KV cache\uff0c\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u7684\u5185\u5b58\u74f6\u9888\u3002\u5b83\u7ed3\u5408 token \u7ea7\u6dd8\u6c70\u4e0e\u5143\u7d20\u7ea7\u52a0\u8f7d\uff0c\u5e76\u8bbe\u8ba1\u4e13\u7528\u52a0\u901f\u5668\u9ad8\u6548\u652f\u6301\u4e24\u9636\u6bb5\u6392\u5e8f\u4e0e\u538b\u7f29\u3002", "why_notable": "\u957f\u4e0a\u4e0b\u6587 LLM \u63a8\u7406\u7684\u6838\u5fc3\u74f6\u9888\u4e4b\u4e00\u662f KV cache \u5e26\u6765\u7684\u663e\u5b58\u4e0e\u8bbf\u5b58\u538b\u529b\u3002HiKV \u540c\u65f6\u4ece\u7b97\u6cd5\u538b\u7f29\u7c92\u5ea6\u548c\u786c\u4ef6\u6267\u884c\u6548\u7387\u5165\u624b\uff0c\u5728\u8fd1\u4f3c\u65e0\u635f\u7cbe\u5ea6\u4e0b\u663e\u8457\u51cf\u5c11\u5916\u90e8\u5185\u5b58\u8bbf\u95ee\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "LLM-based database agents show promise, but differing task scopes, testbeds, and metrics hinder comparison. We identify four gaps between evaluation and production operations: live-environment fidelity (multi-turn read-write interaction with a running database); observation-space scale and complexity (causal diagnosis across thousands of time series, business logs, and concurrent activity); solution-space openness (multiple remediations with different operational trade-offs); and scenario complexity and coverage (faults cascading across internal mechanisms and operational domains). We present DBA-Bench, a benchmark addressing these gaps through production fidelity, outcome-first evaluation, and controlled scenario reproducibility. It uses instrumented PostgreSQL environments with active workloads, persistent state, and multi-source observations; defines success by measurable recovery or fault elimination under safety constraints; and restores snapshots with scenario-specific checks before each run. The benchmark contains 106 scenarios across seven task domains, with two public difficulty labels based on reference-path diagnostic depth and environmental complexity. We evaluate nine baseline groups, including six foundation-model systems, two GPT-5.5-backed database agents, and a Human DBA reference. Across 848 automated runs, Diagnosis, Outcome, and Safe Pass rates are 32.7%, 19.6%, and 12.4%; the best automated baseline reaches 17.9% Safe Pass versus 93.4% for the Human DBA reference. Automated Safe Pass falls from 19.6% on Easy scenarios to 7.6% on Hard scenarios, underscoring the difficulty of safe end-to-end remediation.", "arxiv_id": "2607.22165", "arxiv_url": "https://arxiv.org/abs/2607.22165", "authors": ["Junming Chen", "Junyang Jiang", "Xu Chen", "Zibo Liang", "Kai Zheng"], "brief": "\u8bba\u6587\u63d0\u51fa DBA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u57fa\u4e8e LLM \u7684\u6570\u636e\u5e93\u8fd0\u7ef4\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u751f\u4ea7\u5f0f\u73af\u5883\u4e2d\u7684\u8bca\u65ad\u4e0e\u4fee\u590d\u80fd\u529b\u3002\u5b83\u57fa\u4e8e\u5e26\u4e3b\u52a8\u8d1f\u8f7d\u3001\u6301\u4e45\u72b6\u6001\u548c\u591a\u6e90\u89c2\u6d4b\u7684 PostgreSQL \u73af\u5883\uff0c\u8986\u76d6 106 \u4e2a\u53ef\u590d\u73b0\u5b9e\u9a8c\u573a\u666f\u3002", "categories": ["cs.DB", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22165", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5f3a\u8c03\u751f\u4ea7\u4fdd\u771f\u5ea6\uff1a\u652f\u6301\u591a\u8f6e\u8bfb\u5199\u4ea4\u4e92\u3001\u8fd0\u884c\u4e2d\u6570\u636e\u5e93\u3001\u6570\u5343\u6761\u65f6\u5e8f\u6307\u6807\u3001\u4e1a\u52a1\u65e5\u5fd7\u4e0e\u5e76\u53d1\u6d3b\u52a8\u89c2\u6d4b\u3002", "\u91c7\u7528\u7ed3\u679c\u4f18\u5148\u8bc4\u4f30\uff1a\u4ee5\u6545\u969c\u6d88\u9664\u6216\u6027\u80fd\u6062\u590d\u4e3a\u6210\u529f\u6807\u51c6\uff0c\u5e76\u52a0\u5165\u5b89\u5168\u7ea6\u675f\uff0c\u800c\u975e\u53ea\u8bc4\u4f30\u8bca\u65ad\u6587\u672c\u662f\u5426\u6b63\u786e\u3002", "\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u81ea\u52a8\u5316\u7cfb\u7edf\u5dee\u8ddd\u663e\u8457\uff1a848 \u6b21\u8fd0\u884c\u4e2d\u6700\u4f73\u81ea\u52a8\u57fa\u7ebf Safe Pass \u4ec5 17.9%\uff0c\u800c\u4eba\u7c7b DBA \u8fbe 93.4%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u5e93", "\u57fa\u51c6\u8bc4\u6d4b", "\u8fd0\u7ef4\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22165v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DBA-Bench: A Production-Fidelity Benchmark for LLM-Based Database Operations Agents", "tldr": "\u9762\u5411\u771f\u5b9e\u6570\u636e\u5e93\u8fd0\u7ef4\u667a\u80fd\u4f53\u7684\u9ad8\u4fdd\u771f\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DBA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u57fa\u4e8e LLM \u7684\u6570\u636e\u5e93\u8fd0\u7ef4\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u751f\u4ea7\u5f0f\u73af\u5883\u4e2d\u7684\u8bca\u65ad\u4e0e\u4fee\u590d\u80fd\u529b\u3002\u5b83\u57fa\u4e8e\u5e26\u4e3b\u52a8\u8d1f\u8f7d\u3001\u6301\u4e45\u72b6\u6001\u548c\u591a\u6e90\u89c2\u6d4b\u7684 PostgreSQL \u73af\u5883\uff0c\u8986\u76d6 106 \u4e2a\u53ef\u590d\u73b0\u5b9e\u9a8c\u573a\u666f\u3002", "why_notable": "\u8be5\u57fa\u51c6\u628a\u6570\u636e\u5e93\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u9759\u6001\u95ee\u7b54\u63a8\u8fdb\u5230\u771f\u5b9e\u7aef\u5230\u7aef\u8fd0\u7ef4\u95ed\u73af\uff0c\u63ed\u793a\u4e86\u73b0\u6709 LLM \u4ee3\u7406\u5728\u5b89\u5168\u4fee\u590d\u3001\u56e0\u679c\u8bca\u65ad\u548c\u590d\u6742\u573a\u666f\u6cdb\u5316\u4e0a\u7684\u5de8\u5927\u4e0d\u8db3\uff0c\u5bf9\u6570\u636e\u5e93\u81ea\u6cbb\u8fd0\u7ef4\u548c\u4f01\u4e1a\u7ea7 LLM agent \u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Test-time scaling through iterative self-evolution with environment feedback, as demonstrated by AlphaEvolve, shows remarkable performance gains. We hypothesize that the success of such evolution frameworks hinges on meta-skills, such as self-reflection with environment feedback, that enable effective multi-round refinement, yet are largely neglected by traditional post-training. To bridge this gap, we present MetaEvolve, a framework designed to develop these meta-skills via a data synthesis pipeline, evolution-aware reinforcement learning (RL), and inference-time evolutionary search. Concretely, we ground MetaEvolve in coding, where program execution provides natural, continuous reward signals beyond binary correctness. Building on these signals, we synthesize evolution trajectories as training data, each containing a current program, its fitness score (combining correctness and efficiency), and a history of prior attempts, and train the model via RL with verifiable rewards derived from test case execution. By training on large-scale code data, we aim to inspire generalizable domain-agnostic meta-skills that can transfer broadly to open-ended problems where such rich training signals are scarce. Across seven coding benchmarks, MetaEvolve outperforms the strongest baseline by 10.01% absolute on in-distribution tasks and 24.12% on out-of-distribution tasks. On open-ended algorithm optimization problems entirely outside the training domain, it further achieves a 46.9% relative improvement. These results demonstrate that explicitly cultivating self-evolution meta-skills offers a principled path toward more capable and autonomously self-evolving AI.", "arxiv_id": "2607.21971", "arxiv_url": "https://arxiv.org/abs/2607.21971", "authors": ["Shujin Wu", "Cheng Qian", "Xiusi Chen", "Heng Ji"], "brief": "\u8bba\u6587\u63d0\u51fa MetaEvolve\uff0c\u901a\u8fc7\u4ee3\u7801\u6267\u884c\u53cd\u9988\u5408\u6210\u8fdb\u5316\u8f68\u8ff9\uff0c\u5e76\u7528\u5e26\u53ef\u9a8c\u8bc1\u5956\u52b1\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5927\u6a21\u578b\u638c\u63e1\u81ea\u53cd\u601d\u3001\u591a\u8f6e\u6539\u8fdb\u7b49\u5143\u6280\u80fd\u3002\u63a8\u7406\u9636\u6bb5\u7ed3\u5408\u8fdb\u5316\u5f0f\u641c\u7d22\uff0c\u8ba9\u6a21\u578b\u80fd\u5728\u6d4b\u8bd5\u65f6\u6301\u7eed\u4f18\u5316\u7b54\u6848\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21971", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ee5\u4ee3\u7801\u4efb\u52a1\u4e3a\u8bad\u7ec3\u573a\u666f\uff0c\u5229\u7528\u7a0b\u5e8f\u6267\u884c\u7ed3\u679c\u63d0\u4f9b\u8fde\u7eed\u5956\u52b1\uff0c\u7efc\u5408\u8861\u91cf\u6b63\u786e\u6027\u4e0e\u6548\u7387\uff0c\u800c\u4e0d\u53ea\u4f9d\u8d56\u4e8c\u5143\u5bf9\u9519\u3002", "\u6784\u5efa\u5305\u542b\u5f53\u524d\u7a0b\u5e8f\u3001\u9002\u5e94\u5ea6\u5206\u6570\u548c\u5386\u53f2\u5c1d\u8bd5\u7684\u8fdb\u5316\u8f68\u8ff9\u6570\u636e\uff0c\u7528\u4e8e\u8bad\u7ec3\u6a21\u578b\u5b66\u4e60\u5982\u4f55\u57fa\u4e8e\u53cd\u9988\u8fed\u4ee3\u6539\u8fdb\u3002", "\u5728\u4e03\u4e2a\u4ee3\u7801\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u5206\u5e03\u5185\u63d0\u534710.01\u4e2a\u767e\u5206\u70b9\uff0c\u5206\u5e03\u5916\u63d0\u534724.12\u4e2a\u767e\u5206\u70b9\uff1b\u5728\u5f00\u653e\u5f0f\u7b97\u6cd5\u4f18\u5316\u4efb\u52a1\u4e0a\u76f8\u5bf9\u63d0\u534746.9%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4ee3\u7801\u751f\u6210", "\u81ea\u6211\u8fdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.21971v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Teaching LLMs to Self-Evolve: Cultivating Core Meta-Skills with Reinforcement Learning", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u57f9\u517bLLM\u81ea\u6211\u8fdb\u5316\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MetaEvolve\uff0c\u901a\u8fc7\u4ee3\u7801\u6267\u884c\u53cd\u9988\u5408\u6210\u8fdb\u5316\u8f68\u8ff9\uff0c\u5e76\u7528\u5e26\u53ef\u9a8c\u8bc1\u5956\u52b1\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5927\u6a21\u578b\u638c\u63e1\u81ea\u53cd\u601d\u3001\u591a\u8f6e\u6539\u8fdb\u7b49\u5143\u6280\u80fd\u3002\u63a8\u7406\u9636\u6bb5\u7ed3\u5408\u8fdb\u5316\u5f0f\u641c\u7d22\uff0c\u8ba9\u6a21\u578b\u80fd\u5728\u6d4b\u8bd5\u65f6\u6301\u7eed\u4f18\u5316\u7b54\u6848\u3002", "why_notable": "\u5b83\u628a\u6d4b\u8bd5\u65f6\u81ea\u6211\u8fdb\u5316\u80fd\u529b\u4ece\u63a8\u7406\u6280\u5de7\u63a8\u8fdb\u5230\u53ef\u8bad\u7ec3\u7684\u5143\u6280\u80fd\uff0c\u5c55\u793a\u4e86\u901a\u8fc7\u53ef\u9a8c\u8bc1\u53cd\u9988\u548c\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u6a21\u578b\u81ea\u4e3b\u8fed\u4ee3\u80fd\u529b\u7684\u53ef\u884c\u8def\u5f84\uff0c\u5bf9\u4ee3\u7801\u751f\u6210\u3001\u5f00\u653e\u5f0f\u95ee\u9898\u6c42\u89e3\u548c\u667a\u80fd\u4f53\u8bad\u7ec3\u90fd\u6709\u6f5c\u5728\u5f71\u54cd\u3002"}, {"abstract": "Benchmarks for LLM-agent memory typically generate conversations first and extract answer keys afterwards -- with documented label-error and contamination problems -- and they overwhelmingly measure short interaction histories. We invert the pipeline: a seeded life-script sampler emits facts with validity intervals, volatility classes, and source channels before any text exists; an LLM renderer writes chat and email from per-event fact manifests; a fidelity verifier confirms every planted fact; and questions are instantiated mechanically from the script, so gold answers are script-valid by construction and separately validated for answerability. The synthetic, fictionalized corpus (~380 questions, 15 types) embeds features absent from the benchmarks we survey: per-fact validity intervals, sent/received trust distinctions, injection probes in a benign harness, and as-of-date question sets. Benchmarking five memory architectures against a no-memory control (fixed answerer, versioned LLM judge, three replicates, two horizons), we find backend rankings invert with history length: the budgeted curated-map memory that leads at three weeks loses recall of evicted content by nine weeks (96% to 72%) while a provenance-typed graph rises to 90%; the inversion is positive for all six users under complete cross-family re-judging (exact p=0.031). A full-rendered-history baseline ties or exceeds the best memory system at the short horizon but shows no judge-independent advantage at nine weeks, at about twice the read cost. Write-stage quality strongly correlates with downstream quality (weakly-written facts fail 24% vs 2%), and injection resistance tracked whether provenance boundaries survive representation. A layered architecture performs best among the memory systems in both regimes (96.8% short-horizon) and is released as Veracium, an open-source library, with the corpus generator and harness.", "arxiv_id": "2607.21962", "arxiv_url": "https://arxiv.org/abs/2607.21962", "authors": ["Quentin Spencer"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u201cGround Truth First\u201d\u7684 LLM \u667a\u80fd\u4f53\u8bb0\u5fc6\u8bc4\u6d4b\u6d41\u7a0b\uff1a\u5148\u751f\u6210\u5e26\u6709\u6548\u671f\u3001\u6ce2\u52a8\u6027\u548c\u6765\u6e90\u6e20\u9053\u7684\u4e8b\u5b9e\u811a\u672c\uff0c\u518d\u6e32\u67d3\u4e3a\u804a\u5929/\u90ae\u4ef6\u5e76\u673a\u68b0\u751f\u6210\u95ee\u9898\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03\u4e86 Veracium \u5f00\u6e90\u5e93\u3001\u8bed\u6599\u751f\u6210\u5668\u4e0e\u8bc4\u6d4b\u6846\u67b6\uff0c\u5e76\u6bd4\u8f83\u4e86\u591a\u79cd\u8bb0\u5fc6\u67b6\u6784\u5728\u4e0d\u540c\u65f6\u95f4\u8de8\u5ea6\u4e0b\u7684\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.21962", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u7ea6380\u4e2a\u95ee\u9898\u300115\u7c7b\u9898\u578b\u7684\u5408\u6210\u865a\u6784\u8bed\u6599\uff0c\u5305\u542b\u4e8b\u5b9e\u6709\u6548\u671f\u3001\u6536\u53d1\u4fe1\u4efb\u5dee\u5f02\u3001\u6ce8\u5165\u63a2\u9488\u548c as-of-date \u95ee\u9898\u96c6\uff0c\u907f\u514d\u540e\u9a8c\u62bd\u53d6\u7b54\u6848\u5e26\u6765\u7684\u6807\u6ce8\u9519\u8bef\u4e0e\u6c61\u67d3\u3002", "\u8bc4\u6d4b5\u79cd\u8bb0\u5fc6\u67b6\u6784\u548c\u65e0\u8bb0\u5fc6\u57fa\u7ebf\uff0c\u53d1\u73b0\u8bb0\u5fc6\u540e\u7aef\u6392\u540d\u4f1a\u968f\u5386\u53f2\u957f\u5ea6\u53cd\u8f6c\uff1a curated-map \u77ed\u671f\u9886\u5148\u4f46\u4e5d\u5468\u53ec\u56de\u4e0b\u964d\uff0c provenance-typed graph \u957f\u671f\u5347\u81f390%\u3002", "\u5199\u5165\u9636\u6bb5\u8d28\u91cf\u4e0e\u4e0b\u6e38\u8868\u73b0\u5f3a\u76f8\u5173\uff1b\u80fd\u5426\u4fdd\u6301\u6765\u6e90\u8fb9\u754c\u4e5f\u5f71\u54cd\u6ce8\u5165\u62b5\u6297\u80fd\u529b\uff1b\u5206\u5c42\u8bb0\u5fc6\u67b6\u6784\u5728\u77ed\u671f\u548c\u957f\u671f\u5747\u8868\u73b0\u6700\u4f73\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u8bc4\u6d4b\u57fa\u51c6", "\u5b89\u5168\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.21962v1", "published_at": "2026-07-24", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Ground Truth First: A Longitudinal Evaluation Instrument for Agent Memory, and the Tenure Crossover in Memory-Architecture Rankings", "tldr": "\u63d0\u51fa\u5148\u6709\u771f\u503c\u7684\u667a\u80fd\u4f53\u8bb0\u5fc6\u8bc4\u6d4b\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u201cGround Truth First\u201d\u7684 LLM \u667a\u80fd\u4f53\u8bb0\u5fc6\u8bc4\u6d4b\u6d41\u7a0b\uff1a\u5148\u751f\u6210\u5e26\u6709\u6548\u671f\u3001\u6ce2\u52a8\u6027\u548c\u6765\u6e90\u6e20\u9053\u7684\u4e8b\u5b9e\u811a\u672c\uff0c\u518d\u6e32\u67d3\u4e3a\u804a\u5929/\u90ae\u4ef6\u5e76\u673a\u68b0\u751f\u6210\u95ee\u9898\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03\u4e86 Veracium \u5f00\u6e90\u5e93\u3001\u8bed\u6599\u751f\u6210\u5668\u4e0e\u8bc4\u6d4b\u6846\u67b6\uff0c\u5e76\u6bd4\u8f83\u4e86\u591a\u79cd\u8bb0\u5fc6\u67b6\u6784\u5728\u4e0d\u540c\u65f6\u95f4\u8de8\u5ea6\u4e0b\u7684\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u8bc4\u6d4b\u4e2d\u7684\u771f\u503c\u53ef\u9760\u6027\u3001\u77ed\u5386\u53f2\u504f\u7f6e\u548c\u6c61\u67d3\u95ee\u9898\u63d0\u51fa\u7cfb\u7edf\u6027\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u63ed\u793a\u4e0d\u540c\u8bb0\u5fc6\u67b6\u6784\u5b58\u5728\u201c\u4efb\u671f\u4ea4\u53c9\u201d\u73b0\u8c61\uff0c\u5bf9\u6784\u5efa\u53ef\u957f\u671f\u4f7f\u7528\u3001\u53ef\u5ba1\u8ba1\u4e14\u6297\u6ce8\u5165\u7684 LLM agent \u8bb0\u5fc6\u7cfb\u7edf\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Action-conditioned video world models predict future observations from an initial observation and an action signal. In robotics, actions influence future observations through two distinct processes: they are first realized into robot motion by the robot body and controller, and the scene then responds through contact and object motion. Conditioning directly on action commands asks the world model to learn the realization process itself, while conditioning on logged future states leaks the interaction outcomes it is meant to predict. We propose robot-factored world models, which move two robot-specific factors outside the world model. First, action realization: each command is rolled through the robot\u0027s own controller and kinematics into a deployment-available nominal trajectory, a middle signal that avoids both action-realization learning and future-state leakage. Second, robot rendering: this nominal trajectory is rendered through the robot URDF, factoring the robot\u0027s geometry, kinematics, and appearance out of the model and into explicit rendered robot geometry. To resolve depth ambiguity, we pair end-effector depth with scene depth, giving geometric cues for contact and occlusion beyond image-plane overlap. Together, camera-aware static RGB/depth context and rendered robot geometry form a shared visual world-model interface that stays consistent across viewpoints and robot embodiments, so the model sees the action only as visible robot geometry and learns how objects respond to it. Our experiments show that the rendered interface outperforms vector-conditioned baselines and generalizes to unseen robot embodiments at inference. We further demonstrate that our model generates robot manipulation videos from human demonstrations by retargeting and rendering the hand motion as robot geometry.", "arxiv_id": "2607.22535", "arxiv_url": "https://arxiv.org/abs/2607.22535", "authors": ["Byungjun Kim", "Taeksoo Kim", "Hyunsoo Cha", "Hanbyul Joo"], "brief": "\u8bba\u6587\u63d0\u51fa robot-factored world models\uff1a\u5c06\u52a8\u4f5c\u547d\u4ee4\u5148\u901a\u8fc7\u673a\u5668\u4eba\u63a7\u5236\u5668\u548c\u8fd0\u52a8\u5b66\u8f6c\u6210\u53ef\u90e8\u7f72\u7684\u540d\u4e49\u8f68\u8ff9\uff0c\u518d\u7528 URDF \u6e32\u67d3\u6210\u53ef\u89c1\u673a\u5668\u4eba\u51e0\u4f55\uff0c\u4f5c\u4e3a\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u6761\u4ef6\u8f93\u5165\u3002\u6a21\u578b\u56e0\u6b64\u4e0d\u5fc5\u5b66\u4e60\u52a8\u4f5c\u5230\u673a\u5668\u4eba\u8fd0\u52a8\u7684\u5b9e\u73b0\u8fc7\u7a0b\uff0c\u4e5f\u907f\u514d\u4f7f\u7528\u672a\u6
