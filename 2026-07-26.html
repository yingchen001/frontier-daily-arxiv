Fernandez", "Cole Looney", "Xiaoliang Wu", "Alexandra Livia Georgescu", "Stefano Goria"], "brief": "\u8bba\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e868\u79cd\u8bed\u97f3\u514b\u9686\u6a21\u578b\u57285\u4e2a\u526f\u8bed\u8a00\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\uff0c\u53d1\u73b0\u591a\u6570\u6a21\u578b\u5728\u5408\u6210\u8bed\u97f3\u4e2d\u80fd\u8f83\u597d\u4fdd\u7559\u60c5\u7eea\u3001\u4e34\u5e8a\u72b6\u6001\u7b49\u526f\u8bed\u8a00\u4fe1\u53f7\uff0c\u4f46\u4f1a\u6709\u8f7b\u5fae\u6027\u80fd\u4e0b\u964d\u3002\u8fdb\u4e00\u6b65\u5c06\u82f1\u8bed\u4e34\u5e8a\u8bed\u97f3\u514b\u9686\u4e3a\u65e5\u8bed\u540e\uff0c\u7528\u4e8e\u8bad\u7ec3\u7684\u5408\u6210\u6570\u636e\u5728\u65e5\u8bed\u771f\u5b9e\u8bed\u97f3\u7684\u6291\u90c1\u548c\u7126\u8651\u68c0\u6d4b\u4e0a\u4f18\u4e8e\u76f4\u63a5\u8de8\u8bed\u8a00\u8fc1\u79fb\uff0c\u663e\u793a\u5176\u53ef\u7528\u4e8e\u4f4e\u8d44\u6e90\u4e34\u5e8a\u8bed\u97f3\u6570\u636e\u589e\u5f3a\u3002", "categories": ["cs.LG", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22304", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u514b\u9686", "\u6570\u636e\u589e\u5f3a", "\u4e34\u5e8a\u8bed\u97f3", "\u8de8\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22304v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Synthetic Speech, Real Signal: Paralinguistic Preservation and Cross-Lingual Augmentation via Voice Cloning", "tldr": "\u8bba\u6587\u7cfb\u7edf\u8bc4\u6d4b\u4e868\u79cd\u8bed\u97f3\u514b\u9686\u6a21\u578b\u57285\u4e2a\u526f\u8bed\u8a00\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\uff0c\u53d1\u73b0\u591a\u6570\u6a21\u578b\u5728\u5408\u6210\u8bed\u97f3\u4e2d\u80fd\u8f83\u597d\u4fdd\u7559\u60c5\u7eea\u3001\u4e34\u5e8a\u72b6\u6001\u7b49\u526f\u8bed\u8a00\u4fe1\u53f7\uff0c\u4f46\u4f1a\u6709\u8f7b\u5fae\u6027\u80fd\u4e0b\u964d\u3002\u8fdb\u4e00\u6b65\u5c06\u82f1\u8bed\u4e34\u5e8a\u8bed\u97f3\u514b\u9686\u4e3a\u65e5\u8bed\u540e\uff0c\u7528\u4e8e\u8bad\u7ec3\u7684\u5408\u6210\u6570\u636e\u5728\u65e5\u8bed\u771f\u5b9e\u8bed\u97f3\u7684\u6291\u90c1\u548c\u7126\u8651\u68c0\u6d4b\u4e0a\u4f18\u4e8e\u76f4\u63a5\u8de8\u8bed\u8a00\u8fc1\u79fb\uff0c\u663e\u793a\u5176\u53ef\u7528\u4e8e\u4f4e\u8d44\u6e90\u4e34\u5e8a\u8bed\u97f3\u6570\u636e\u589e\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Forecasting multiple time-series with high-dimensional covariates presents a core challenge: unifying common temporal patterns while retaining meaningful series-specific information. We introduce Hopformer (Homogeneity-Pursuit Transformer), a two-stage framework that addresses this challenge. In the first stage, we perform a Sparsity Pattern Aggregation (SPA) scheme extracting a common low-variance trend that incorporates the covariates. This acts as a homogenization layer. In the second stage, a LoRA-fine-tuned Transformer models the remaining complex dependencies in the residual. Our method is theoretically grounded. We prove that SPA achieves a near-optimal bias-variance trade-off via an oracle inequality. We also provide generalization bounds for the second stage under dependent time series data. Hopformer sets a new state of the art, improving MASE by an average of 6.56% across synthetic and real-world forecasting benchmarks.", "arxiv_id": "2607.22299", "arxiv_url": "https://arxiv.org/abs/2607.22299", "authors": ["Wan Zhang", "Qinjie Lin", "Chan Lee", "Weijian Li", "Han Liu", "Kai Zhang"], "brief": "Hopformer \u9762\u5411\u5e26\u9ad8\u7ef4\u534f\u53d8\u91cf\u7684\u591a\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\uff0c\u5148\u7528\u7a00\u758f\u6a21\u5f0f\u805a\u5408\u63d0\u53d6\u5171\u540c\u4f4e\u65b9\u5dee\u8d8b\u52bf\u8fdb\u884c\u540c\u8d28\u5316\uff0c\u518d\u7528 LoRA \u5fae\u8c03 Transformer \u5efa\u6a21\u6b8b\u5dee\u4e2d\u7684\u590d\u6742\u4f9d\u8d56\u3002\u8bba\u6587\u7ed9\u51fa\u504f\u5dee-\u65b9\u5dee\u6743\u8861\u548c\u4f9d\u8d56\u65f6\u95f4\u5e8f\u5217\u6cdb\u5316\u754c\u7684\u7406\u8bba\u5206\u6790\uff0c\u5e76\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u57fa\u51c6\u4e0a\u5c06 MASE \u5e73\u5747\u63d0\u5347 6.56%\uff0c\u8fbe\u5230\u65b0\u7684\u6700\u4f18\u7ed3\u679c\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22299", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "Transformer", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u6cdb\u5316\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22299v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hopformer: Homogeneity-Pursuit Transformer for Time Series Forecasting", "tldr": "Hopformer \u9762\u5411\u5e26\u9ad8\u7ef4\u534f\u53d8\u91cf\u7684\u591a\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\uff0c\u5148\u7528\u7a00\u758f\u6a21\u5f0f\u805a\u5408\u63d0\u53d6\u5171\u540c\u4f4e\u65b9\u5dee\u8d8b\u52bf\u8fdb\u884c\u540c\u8d28\u5316\uff0c\u518d\u7528 LoRA \u5fae\u8c03 Transformer \u5efa\u6a21\u6b8b\u5dee\u4e2d\u7684\u590d\u6742\u4f9d\u8d56\u3002\u8bba\u6587\u7ed9\u51fa\u504f\u5dee-\u65b9\u5dee\u6743\u8861\u548c\u4f9d\u8d56\u65f6\u95f4\u5e8f\u5217\u6cdb\u5316\u754c\u7684\u7406\u8bba\u5206\u6790\uff0c\u5e76\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u57fa\u51c6\u4e0a\u5c06 MASE \u5e73\u5747\u63d0\u5347 6.56%\uff0c\u8fbe\u5230\u65b0\u7684\u6700\u4f18\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Graph-based recommendations are widely adopted in real-world industrial applications. However, graphs in these systems often reach a massive scale, posing notable scalability and efficiency challenges. This requires techniques that can effectively balance predictive quality with computational cost. One promising approach is graph coarsening, an adaptive graph reduction technique that offers a way to systematically construct smaller, yet structurally representative, versions of the original large-scale graphs. In this work, we propose a flexible two-stage diffusion framework that combines graph coarsening with multi-step label propagation in the telecommunications domain. Domain-specific heuristics are applied to first aggregate nodes into meaningful communities, reducing graph size while preserving essential business-relevant relationships. An initial diffusion process done by a Label Propagation Algorithm (LPA) or a Graph Neural Network (GNN) propagates labels across the coarsened graph to produce coarse-grained predictions. Finally, a second LPA within subgraphs generates the final recommendations for individual users. On a real-world telecommunications dataset, when using LPA in both stages, our method achieves up to +24% NDCG@5 over the full-graph LPA baseline. Incorporating a lightweight GNN in the first stage further boosts NDCG@5 by more than 50%, but requires substantial training and inference time. Through extensive experiments and a detailed ablation, we quantify these trade-offs and demonstrate that our coarsening-driven approach delivers an optimal balance between scalability, latency, and recommendation quality.", "arxiv_id": "2607.22287", "arxiv_url": "https://arxiv.org/abs/2607.22287", "authors": ["Alessandro Sbandi", "Federico Siciliano", "Fabrizio Silvestri"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e24\u9636\u6bb5\u56fe\u6269\u6563\u63a8\u8350\u6846\u67b6\uff0c\u5148\u7528\u9886\u57df\u542f\u53d1\u5f0f\u8fdb\u884c\u56fe\u7c97\u5316\uff0c\u518d\u5728\u7c97\u56fe\u548c\u5b50\u56fe\u4e0a\u901a\u8fc7\u6807\u7b7e\u4f20\u64ad\u6216\u8f7b\u91cfGNN\u751f\u6210\u7528\u6237\u63a8\u8350\u3002\u5728\u771f\u5b9e\u7535\u4fe1\u6570\u636e\u4e0a\uff0c\u53cc\u9636\u6bb5LPA\u76f8\u8f83\u5168\u56feLPA\u7684NDCG@5\u6700\u9ad8\u63d0\u534724%\uff0c\u52a0\u5165GNN\u53ef\u63d0\u5347\u8d85\u8fc750%\u4f46\u8ba1\u7b97\u5f00\u9500\u66f4\u5927\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22287", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u56fe\u5b66\u4e60", "\u6807\u7b7e\u4f20\u64ad", "\u56fe\u7c97\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22287v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Efficient Recommendations via Graph Coarsening and Label Propagation", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e24\u9636\u6bb5\u56fe\u6269\u6563\u63a8\u8350\u6846\u67b6\uff0c\u5148\u7528\u9886\u57df\u542f\u53d1\u5f0f\u8fdb\u884c\u56fe\u7c97\u5316\uff0c\u518d\u5728\u7c97\u56fe\u548c\u5b50\u56fe\u4e0a\u901a\u8fc7\u6807\u7b7e\u4f20\u64ad\u6216\u8f7b\u91cfGNN\u751f\u6210\u7528\u6237\u63a8\u8350\u3002\u5728\u771f\u5b9e\u7535\u4fe1\u6570\u636e\u4e0a\uff0c\u53cc\u9636\u6bb5LPA\u76f8\u8f83\u5168\u56feLPA\u7684NDCG@5\u6700\u9ad8\u63d0\u534724%\uff0c\u52a0\u5165GNN\u53ef\u63d0\u5347\u8d85\u8fc750%\u4f46\u8ba1\u7b97\u5f00\u9500\u66f4\u5927\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Anomaly detection is inherently characterised by severe class imbalance, making the interpretation of evaluation metrics challenging. Although metrics such as AUROC, AUPR, F1-score, and MCC are widely used, their values convey different meanings depending on the anomaly ratio. In this work, we analyse the behaviour of those four common anomaly detection metrics under varying levels of imbalance. We focus on the study of metric landscapes, visualisations that relate metric values to true positive and true negative rates, providing an intuitive view of metric preferences and stability. Our analysis offers practical guidance for interpreting and comparing anomaly detection results across datasets with different imbalance ratios.", "arxiv_id": "2607.22286", "arxiv_url": "https://arxiv.org/abs/2607.22286", "authors": ["Romain Hermary", "Nesryne Mejri", "Djamila Aouada"], "brief": "\u672c\u6587\u5206\u6790\u4e86\u5f02\u5e38\u68c0\u6d4b\u5728\u7c7b\u522b\u6781\u5ea6\u4e0d\u5e73\u8861\u60c5\u51b5\u4e0b\u5e38\u7528\u8bc4\u4f30\u6307\u6807\uff08AUROC\u3001AUPR\u3001F1\u3001MCC\uff09\u7684\u884c\u4e3a\u5dee\u5f02\u3002\u901a\u8fc7\u6307\u6807\u666f\u89c2\u53ef\u89c6\u5316\u5c55\u793a\u4e0d\u540c\u5f02\u5e38\u6bd4\u4f8b\u4e0b\u6307\u6807\u4e0e\u771f\u6b63\u7387\u3001\u771f\u8d1f\u7387\u7684\u5173\u7cfb\uff0c\u4e3a\u8de8\u6570\u636e\u96c6\u6bd4\u8f83\u5f02\u5e38\u68c0\u6d4b\u7ed3\u679c\u63d0\u4f9b\u89e3\u91ca\u6307\u5357\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22286", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f02\u5e38\u68c0\u6d4b", "\u8bc4\u4f30\u6307\u6807", "\u7c7b\u522b\u4e0d\u5e73\u8861"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22286v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "An Insight on Evaluation Metrics Under the Imbalanced Case of Anomaly Detection", "tldr": "\u672c\u6587\u5206\u6790\u4e86\u5f02\u5e38\u68c0\u6d4b\u5728\u7c7b\u522b\u6781\u5ea6\u4e0d\u5e73\u8861\u60c5\u51b5\u4e0b\u5e38\u7528\u8bc4\u4f30\u6307\u6807\uff08AUROC\u3001AUPR\u3001F1\u3001MCC\uff09\u7684\u884c\u4e3a\u5dee\u5f02\u3002\u901a\u8fc7\u6307\u6807\u666f\u89c2\u53ef\u89c6\u5316\u5c55\u793a\u4e0d\u540c\u5f02\u5e38\u6bd4\u4f8b\u4e0b\u6307\u6807\u4e0e\u771f\u6b63\u7387\u3001\u771f\u8d1f\u7387\u7684\u5173\u7cfb\uff0c\u4e3a\u8de8\u6570\u636e\u96c6\u6bd4\u8f83\u5f02\u5e38\u68c0\u6d4b\u7ed3\u679c\u63d0\u4f9b\u89e3\u91ca\u6307\u5357\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Remaining useful life (RUL) prediction and failure-mode classification are central tasks in predictive maintenance. Many data-driven pipelines use fixed-window supervised learning with complete terminal labels; such routes do not naturally encode the temporal recursion linking successive degradation-state predictions when observations are partial or unit identities are unavailable. We formulate prognostics as vector General Value Function (GVF) prediction on an absorbing degradation process, treating RUL and failure-mode probabilities as temporally consistent targets rather than independent window-level labels, and estimate them with a multi-step temporal-difference estimator, TD($n,\u03bb$). Supporting theory identifies the Bellman fixed point of the vector GVFs, characterizes the linear projected-TD limit and its relation to complete-return Monte Carlo regression under realizability, and explains when bootstrapped TD targets are less variable than Monte Carlo returns. On an event-triggered multimode simulation and NASA C-MAPSS label-scarce stitch data, TD improves RUL and failure-mode prediction relative to a supervised same-backbone Monte Carlo control, especially under scarce complete labels. Practically, fragmented, identity-free degradation records can contribute local Bellman transitions instead of being discarded until complete run-to-failure labels are available.", "arxiv_id": "2607.22268", "arxiv_url": "https://arxiv.org/abs/2607.22268", "authors": ["Hao Yan", "Ali Sarabi", "Qing Zou", "Boyang Xu"], "brief": "\u8bba\u6587\u5c06\u5269\u4f59\u5bff\u547d\u9884\u6d4b\u548c\u6545\u969c\u6a21\u5f0f\u5206\u7c7b\u8868\u8ff0\u4e3a\u5438\u6536\u9000\u5316\u8fc7\u7a0b\u4e0a\u7684\u5411\u91cf\u5e7f\u4e49\u4ef7\u503c\u51fd\u6570\u9884\u6d4b\uff0c\u7528 TD(n,\u03bb) \u591a\u6b65\u65f6\u5e8f\u5dee\u5206\u6765\u5b66\u4e60\u65f6\u95f4\u4e00\u81f4\u7684\u76ee\u6807\uff0c\u800c\u4e0d\u662f\u72ec\u7acb\u7684\u56fa\u5b9a\u7a97\u53e3\u76d1\u7763\u6807\u7b7e\u3002\u7406\u8bba\u4e0a\u5206\u6790\u4e86 Bellman \u4e0d\u52a8\u70b9\u3001\u7ebf\u6027\u6295\u5f71 TD \u6781\u9650\u53ca\u5176\u4e0e\u8499\u7279\u5361\u6d1b\u56de\u5f52\u7684\u5173\u7cfb\uff1b\u5b9e\u9a8c\u5728\u4eff\u771f\u548c NASA C-MAPSS \u7a00\u7f3a\u6807\u7b7e\u6570\u636e\u4e0a\u4f18\u4e8e\u540c\u9aa8\u5e72\u76d1\u7763\u8499\u7279\u5361\u6d1b\u65b9\u6cd5\uff0c\u5c24\u5176\u9002\u5408\u788e\u7247\u5316\u3001\u65e0\u8eab\u4efd\u7684\u9000\u5316\u8bb0\u5f55\u3002", "categories": ["stat.ML", "cs.LG", "stat.AP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22268", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9884\u6d4b\u6027\u7ef4\u62a4", "\u65f6\u5e8f\u5dee\u5206\u5b66\u4e60", "\u5269\u4f59\u5bff\u547d\u9884\u6d4b", "\u6545\u969c\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22268v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "General Value Functions for Remaining Useful Life and Failure-Mode Prediction", "tldr": "\u8bba\u6587\u5c06\u5269\u4f59\u5bff\u547d\u9884\u6d4b\u548c\u6545\u969c\u6a21\u5f0f\u5206\u7c7b\u8868\u8ff0\u4e3a\u5438\u6536\u9000\u5316\u8fc7\u7a0b\u4e0a\u7684\u5411\u91cf\u5e7f\u4e49\u4ef7\u503c\u51fd\u6570\u9884\u6d4b\uff0c\u7528 TD(n,\u03bb) \u591a\u6b65\u65f6\u5e8f\u5dee\u5206\u6765\u5b66\u4e60\u65f6\u95f4\u4e00\u81f4\u7684\u76ee\u6807\uff0c\u800c\u4e0d\u662f\u72ec\u7acb\u7684\u56fa\u5b9a\u7a97\u53e3\u76d1\u7763\u6807\u7b7e\u3002\u7406\u8bba\u4e0a\u5206\u6790\u4e86 Bellman \u4e0d\u52a8\u70b9\u3001\u7ebf\u6027\u6295\u5f71 TD \u6781\u9650\u53ca\u5176\u4e0e\u8499\u7279\u5361\u6d1b\u56de\u5f52\u7684\u5173\u7cfb\uff1b\u5b9e\u9a8c\u5728\u4eff\u771f\u548c NASA C-MAPSS \u7a00\u7f3a\u6807\u7b7e\u6570\u636e\u4e0a\u4f18\u4e8e\u540c\u9aa8\u5e72\u76d1\u7763\u8499\u7279\u5361\u6d1b\u65b9\u6cd5\uff0c\u5c24\u5176\u9002\u5408\u788e\u7247\u5316\u3001\u65e0\u8eab\u4efd\u7684\u9000\u5316\u8bb0\u5f55\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autoregressive foundation models trained on tokenized electronic health records (EHRs) can support zero-shot clinical prediction, yet most operate on structured event codes alone, and do not incorporate multiple modalities in a principled way. We present a framework for conditioning such models on auxiliary clinical modalities, including ECG waveforms, chest X-ray images, and clinical notes, using modality-specific latent compression and gated cross-attention with temporal alignment. We investigate two key design choices: (1) how to compress long per-modality sequences (e.g., ECG time series) before they enter the multi-modal cross-attention. This feature may be essential to reduce compute overheads and may be beneficial for generalization; (2) how the choice of pretrained encoder for each modality impacts downstream performance. Through controlled ablations on MIMIC-IV, we show that the best latent-compression configurations outperforms both uncompressed cross-attention and mean pooling. Encoder choice has a clear within-modality effect, with stronger pretrained encoders consistently outperforming weaker alternatives. We further show that merely adding auxiliary modalities does not guarantee improvement on ICU mortality prediction over an EHR-only baseline. This implies that careful design of the fusion architecture and an appropriate evaluation in the clinical context are required.", "arxiv_id": "2607.22264", "arxiv_url": "https://arxiv.org/abs/2607.22264", "authors": ["Yuxuan Liu", "Joshua Placidi", "Jinpei Han", "Alfred John Balston", "Marek Rei", "A. Aldo Faisal"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7535\u5b50\u5065\u5eb7\u8bb0\u5f55\u7684\u81ea\u56de\u5f52\u57fa\u7840\u6a21\u578b\u591a\u6a21\u6001\u878d\u5408\u6846\u67b6\uff0c\u53ef\u6761\u4ef6\u5316\u5229\u7528 ECG\u3001\u80f8\u7247\u548c\u4e34\u5e8a\u6587\u672c\u7b49\u8f85\u52a9\u4fe1\u606f\uff0c\u901a\u8fc7\u6a21\u6001\u7279\u5b9a\u6f5c\u53d8\u91cf\u538b\u7f29\u3001\u65f6\u95f4\u5bf9\u9f50\u548c\u95e8\u63a7\u4ea4\u53c9\u6ce8\u610f\u529b\u63a5\u5165 EHR \u5e8f\u5217\u3002MIMIC-IV \u6d88\u878d\u663e\u793a\uff0c\u5408\u9002\u7684\u6f5c\u53d8\u91cf\u538b\u7f29\u4f18\u4e8e\u4e0d\u538b\u7f29\u4ea4\u53c9\u6ce8\u610f\u529b\u548c\u5747\u503c\u6c60\u5316\uff0c\u5f3a\u9884\u8bad\u7ec3\u7f16\u7801\u5668\u5e26\u6765\u66f4\u597d\u6548\u679c\uff1b\u4f46\u7b80\u5355\u52a0\u5165\u591a\u6a21\u6001\u5e76\u4e0d\u4e00\u5b9a\u63d0\u5347 ICU \u6b7b\u4ea1\u9884\u6d4b\uff0c\u9700\u7cbe\u5fc3\u8bbe\u8ba1\u878d\u5408\u4e0e\u8bc4\u4f30\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22264", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597AI", "\u591a\u6a21\u6001", "\u57fa\u7840\u6a21\u578b", "\u7535\u5b50\u5065\u5eb7\u8bb0\u5f55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22264v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Autoregressive EHR Foundation Models with Multimodal Inputs", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7535\u5b50\u5065\u5eb7\u8bb0\u5f55\u7684\u81ea\u56de\u5f52\u57fa\u7840\u6a21\u578b\u591a\u6a21\u6001\u878d\u5408\u6846\u67b6\uff0c\u53ef\u6761\u4ef6\u5316\u5229\u7528 ECG\u3001\u80f8\u7247\u548c\u4e34\u5e8a\u6587\u672c\u7b49\u8f85\u52a9\u4fe1\u606f\uff0c\u901a\u8fc7\u6a21\u6001\u7279\u5b9a\u6f5c\u53d8\u91cf\u538b\u7f29\u3001\u65f6\u95f4\u5bf9\u9f50\u548c\u95e8\u63a7\u4ea4\u53c9\u6ce8\u610f\u529b\u63a5\u5165 EHR \u5e8f\u5217\u3002MIMIC-IV \u6d88\u878d\u663e\u793a\uff0c\u5408\u9002\u7684\u6f5c\u53d8\u91cf\u538b\u7f29\u4f18\u4e8e\u4e0d\u538b\u7f29\u4ea4\u53c9\u6ce8\u610f\u529b\u548c\u5747\u503c\u6c60\u5316\uff0c\u5f3a\u9884\u8bad\u7ec3\u7f16\u7801\u5668\u5e26\u6765\u66f4\u597d\u6548\u679c\uff1b\u4f46\u7b80\u5355\u52a0\u5165\u591a\u6a21\u6001\u5e76\u4e0d\u4e00\u5b9a\u63d0\u5347 ICU \u6b7b\u4ea1\u9884\u6d4b\uff0c\u9700\u7cbe\u5fc3\u8bbe\u8ba1\u878d\u5408\u4e0e\u8bc4\u4f30\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A data-driven inverse optimization problem (DDIOP) is the problem of estimating the objective-function parameters (weights) that explain observed optimal-solution data, and it arises in many applications, including integer linear programming (ILP). It is known that, by applying gradient-based optimization methods to the suboptimality loss, the inverse optimization of ILPs can be solved exactly within finitely many oracle iterations, and that the required number of iterations is bounded as $T=O(1/\u03b3(\\ell_{\\mathrm{sub}})^2)$ in terms of a problem-dependent geometric constant $\u03b3(\\ell_{\\mathrm{sub}})$. However, no means of bounding $\u03b3(\\ell_{\\mathrm{sub}})$ from below as a function of the problem size has been available, and hence the number of iterations could not be given as an explicit function of the problem size. We therefore give, when the forward problem is an integer linear program (ILP), the number of iterations sufficient for projected subgradient descent applied to the suboptimality loss to achieve exact consistency with the observed data, as a fully explicit function of the number of samples, the dimension of the features, the ranges of the features, and the structure of the constraint coefficient matrix, up to polynomial factors in the basic constants (the diameter of the weight set, the step-size parameter, and the Lipschitz constant of the suboptimality loss).", "arxiv_id": "2607.22263", "arxiv_url": "https://arxiv.org/abs/2607.22263", "authors": ["Akira Kitaoka"], "brief": "\u672c\u6587\u7814\u7a76\u6574\u6570\u7ebf\u6027\u89c4\u5212\u7684\u6570\u636e\u9a71\u52a8\u9006\u4f18\u5316\uff0c\u7ed9\u51fa\u4e86\u6295\u5f71\u6b21\u68af\u5ea6\u4e0b\u964d\u5728\u6b21\u4f18\u6027\u635f\u5931\u4e0a\u8fbe\u5230\u4e0e\u89c2\u6d4b\u6570\u636e\u7cbe\u786e\u4e00\u81f4\u6240\u9700\u7684\u663e\u5f0f\u8fed\u4ee3\u6b21\u6570\u3002\u76f8\u6bd4\u4ee5\u5f80\u53ea\u4f9d\u8d56\u672a\u77e5\u51e0\u4f55\u5e38\u6570\u7684\u754c\uff0c\u672c\u6587\u5c06\u590d\u6742\u5ea6\u8868\u793a\u4e3a\u6837\u672c\u6570\u3001\u7279\u5f81\u7ef4\u5ea6\u3001\u7279\u5f81\u8303\u56f4\u548c\u7ea6\u675f\u77e9\u9635\u7ed3\u6784\u7b49\u95ee\u9898\u89c4\u6a21\u53c2\u6570\u7684\u51fd\u6570\u3002", "categories": ["math.OC", "cs.AI", "cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22263", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9006\u4f18\u5316", "\u6574\u6570\u7ebf\u6027\u89c4\u5212", "\u8fed\u4ee3\u590d\u6742\u5ea6", "\u6570\u636e\u9a71\u52a8\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22263v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Explicit Iteration Complexity of Exact Data-Driven Inverse Optimization for Integer Linear Programs", "tldr": "\u672c\u6587\u7814\u7a76\u6574\u6570\u7ebf\u6027\u89c4\u5212\u7684\u6570\u636e\u9a71\u52a8\u9006\u4f18\u5316\uff0c\u7ed9\u51fa\u4e86\u6295\u5f71\u6b21\u68af\u5ea6\u4e0b\u964d\u5728\u6b21\u4f18\u6027\u635f\u5931\u4e0a\u8fbe\u5230\u4e0e\u89c2\u6d4b\u6570\u636e\u7cbe\u786e\u4e00\u81f4\u6240\u9700\u7684\u663e\u5f0f\u8fed\u4ee3\u6b21\u6570\u3002\u76f8\u6bd4\u4ee5\u5f80\u53ea\u4f9d\u8d56\u672a\u77e5\u51e0\u4f55\u5e38\u6570\u7684\u754c\uff0c\u672c\u6587\u5c06\u590d\u6742\u5ea6\u8868\u793a\u4e3a\u6837\u672c\u6570\u3001\u7279\u5f81\u7ef4\u5ea6\u3001\u7279\u5f81\u8303\u56f4\u548c\u7ea6\u675f\u77e9\u9635\u7ed3\u6784\u7b49\u95ee\u9898\u89c4\u6a21\u53c2\u6570\u7684\u51fd\u6570\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modeling shared and subject-specific structure in multisubject spatiotemporal data remains challenging, particularly in neuroimaging, where both spatial and temporal patterns exhibit rich variability across subjects. Existing matrix and tensor decompositions provide interpretable factorizations, but rely on fixed multilinear structures or coupling schemes that may limit their flexibility in capturing complex variability. In this work, we introduce a spatiotemporal variational tensor decomposition (ST-VTD) framework that combines a tensor factorization generative model with structured priors to jointly represent spatial maps and temporal dynamics. Spatial factors are regularized to promote a low-rank structure inspired by the LL1 decomposition, while temporal factors are modeled using a learned Long short-term memory (LSTM)-based prior, enabling flexible and adaptive dynamics. Posterior inference is performed using an amortized variational formulation by unrolling iterations of an optimization algorithm, leading to an interpretable and parameter-efficient architecture. The proposed inference framework employs a warm-start strategy based on group independent component analysis, which we found to improve optimization performance. Experiments on a realistic synthetic functional MRI (fMRI) dataset demonstrate that the proposed approach significantly improves latent factor recovery compared with representative classical and probabilistic decomposition benchmarks.", "arxiv_id": "2607.22262", "arxiv_url": "https://arxiv.org/abs/2607.22262", "authors": ["Laura M. Montaldo", "Ricardo A. Borsoi", "Sebastian Miron", "Tulay Adali"], "brief": "\u8bba\u6587\u63d0\u51fa ST-VTD \u65f6\u7a7a\u53d8\u5206\u5f20\u91cf\u5206\u89e3\u6846\u67b6\uff0c\u7528\u4e8e\u591a\u88ab\u8bd5\u65f6\u7a7a\u6570\u636e\u4e2d\u540c\u65f6\u5efa\u6a21\u5171\u4eab\u4e0e\u4e2a\u4f53\u5dee\u5f02\u7ed3\u6784\u3002\u65b9\u6cd5\u7ed3\u5408\u4f4e\u79e9\u7a7a\u95f4\u5148\u9a8c\u3001\u57fa\u4e8e LSTM \u7684\u65f6\u95f4\u52a8\u6001\u5148\u9a8c\u548c\u644a\u9500\u53d8\u5206\u63a8\u65ad\uff0c\u5728\u4eff\u771f fMRI \u6570\u636e\u4e0a\u76f8\u6bd4\u7ecf\u5178\u4e0e\u6982\u7387\u5206\u89e3\u65b9\u6cd5\u663e\u8457\u63d0\u5347\u6f5c\u56e0\u5b50\u6062\u590d\u6548\u679c\u3002", "categories": ["stat.ML", "cs.LG", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22262", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f20\u91cf\u5206\u89e3", "\u53d8\u5206\u63a8\u65ad", "\u65f6\u7a7a\u5efa\u6a21", "\u795e\u7ecf\u5f71\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22262v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Variational Low-rank Tensor Decomposition for Multisubject Spatiotemporal Data Analysis", "tldr": "\u8bba\u6587\u63d0\u51fa ST-VTD \u65f6\u7a7a\u53d8\u5206\u5f20\u91cf\u5206\u89e3\u6846\u67b6\uff0c\u7528\u4e8e\u591a\u88ab\u8bd5\u65f6\u7a7a\u6570\u636e\u4e2d\u540c\u65f6\u5efa\u6a21\u5171\u4eab\u4e0e\u4e2a\u4f53\u5dee\u5f02\u7ed3\u6784\u3002\u65b9\u6cd5\u7ed3\u5408\u4f4e\u79e9\u7a7a\u95f4\u5148\u9a8c\u3001\u57fa\u4e8e LSTM \u7684\u65f6\u95f4\u52a8\u6001\u5148\u9a8c\u548c\u644a\u9500\u53d8\u5206\u63a8\u65ad\uff0c\u5728\u4eff\u771f fMRI \u6570\u636e\u4e0a\u76f8\u6bd4\u7ecf\u5178\u4e0e\u6982\u7387\u5206\u89e3\u65b9\u6cd5\u663e\u8457\u63d0\u5347\u6f5c\u56e0\u5b50\u6062\u590d\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep learning models using traditional softmax classifiers have achieved remarkable success in various classification tasks. However, their performance degrades significantly on imbalanced datasets. Although Balanced Softmax is widely adopted as a state-of-the-art rebalancing method, it possesses inherent limitations, such as yielding disproportionately lower testing accuracy for tail classes. To mitigate these shortcomings, we propose the Class-Balanced Softmax (CBS). Rooted in a theoretical Bayesian framework and a heuristic power-law assumption, the CBS is a simple logit adjustment that is computationally inexpensive and easily integrated into existing pipelines. Furthermore, we characterise a fundamental phenomenon in models trained on imbalanced data, termed the preference issue, wherein models exhibit higher training error and a larger generalisation gap for classes with limited data. To quantify this issue, we introduce a novel metric and demonstrate that CBS effectively mitigates the preference issue. Extensive experiments on large-scale benchmarks show that CBS is highly scalable and outperforms existing methods, including Balanced Softmax.", "arxiv_id": "2607.22258", "arxiv_url": "https://arxiv.org/abs/2607.22258", "authors": ["Yi-Hang Zhu", "Rajeev Raman", "Shiqi Su", "Jianyuan Sun", "Xinyu Yang", "Nan Xing", "Huiyu Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Class-Balanced Softmax\uff08CBS\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u8d1d\u53f6\u65af\u7406\u8bba\u548c\u5e42\u5f8b\u5047\u8bbe\u7684\u957f\u5c3e\u8bc6\u522b logit \u8c03\u6574\u65b9\u6cd5\uff0c\u53ef\u4f4e\u6210\u672c\u63a5\u5165\u73b0\u6709\u5206\u7c7b\u8bad\u7ec3\u6d41\u7a0b\u3002\u4f5c\u8005\u8fd8\u523b\u753b\u4e86\u4e0d\u5e73\u8861\u6570\u636e\u8bad\u7ec3\u4e2d\u7684\u201c\u504f\u597d\u95ee\u9898\u201d\uff0c\u5e76\u901a\u8fc7\u65b0\u6307\u6807\u8bc1\u660e CBS \u80fd\u7f13\u89e3\u5c3e\u7c7b\u8bad\u7ec3\u8bef\u5dee\u548c\u6cdb\u5316\u5dee\u8ddd\uff0c\u5728\u5927\u89c4\u6a21\u57fa\u51c6\u4e0a\u4f18\u4e8e Balanced Softmax \u7b49\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22258", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u5c3e\u8bc6\u522b", "\u7c7b\u522b\u4e0d\u5e73\u8861", "Softmax", "\u8d1d\u53f6\u65af\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22258v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Class-Balanced Softmax: A Bayes Theory-Based Method for Long-Tailed Recognition", "tldr": "\u8bba\u6587\u63d0\u51fa Class-Balanced Softmax\uff08CBS\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u8d1d\u53f6\u65af\u7406\u8bba\u548c\u5e42\u5f8b\u5047\u8bbe\u7684\u957f\u5c3e\u8bc6\u522b logit \u8c03\u6574\u65b9\u6cd5\uff0c\u53ef\u4f4e\u6210\u672c\u63a5\u5165\u73b0\u6709\u5206\u7c7b\u8bad\u7ec3\u6d41\u7a0b\u3002\u4f5c\u8005\u8fd8\u523b\u753b\u4e86\u4e0d\u5e73\u8861\u6570\u636e\u8bad\u7ec3\u4e2d\u7684\u201c\u504f\u597d\u95ee\u9898\u201d\uff0c\u5e76\u901a\u8fc7\u65b0\u6307\u6807\u8bc1\u660e CBS \u80fd\u7f13\u89e3\u5c3e\u7c7b\u8bad\u7ec3\u8bef\u5dee\u548c\u6cdb\u5316\u5dee\u8ddd\uff0c\u5728\u5927\u89c4\u6a21\u57fa\u51c6\u4e0a\u4f18\u4e8e Balanced Softmax \u7b49\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Low-Rank Adaptation (LoRA) is a widely used parameter-efficient fine-tuning method for large language models, but its performance depends strongly on how a fixed rank budget is distributed across Transformer modules. Existing adaptive-rank methods usually rely on local gradient statistics collected during training, which introduces extra memory and computation and overlooks task-conditioned global information flow. We propose IFCLoRA, a topology-aware rank allocation method applied before fine-tuning. Using a small calibration set and a frozen pretrained model, IFCLoRA builds a sparse task-conditioned interaction graph whose nodes represent LoRA-compatible modules. It combines a global information-flow topology prior with local gradient sensitivity to compute Information-Flow Centrality scores, which estimate each module\u0027s adaptation importance under multi-hop propagation. Ranks are then assigned once under a global budget. Across multiple models, tasks, and low-rank settings, IFCLoRA consistently outperforms LoRA, AdaLoRA, and EVA under matched training configurations and total rank budgets, while retaining training costs comparable to standard LoRA. On mathematical reasoning with LLaMA 3 8B, IFCLoRA improves over LoRA by 1.36 percent at rank 4 and 1.82 percent at rank 8. Further analysis shows task-dependent, non-uniform rank profiles, indicating that global information-flow structure provides an informative and interpretable prior for low-budget parameter-efficient fine-tuning.", "arxiv_id": "2607.22251", "arxiv_url": "https://arxiv.org/abs/2607.22251", "authors": ["Wei Zhang", "Xinwu Liu", "Yihang Cheng"], "brief": "IFCLoRA\u63d0\u51fa\u4e00\u79cd\u5728\u5fae\u8c03\u524d\u8fdb\u884c\u7684\u62d3\u6251\u611f\u77e5LoRA\u79e9\u5206\u914d\u65b9\u6cd5\uff0c\u7528\u5c0f\u6821\u51c6\u96c6\u548c\u51bb\u7ed3\u6a21\u578b\u6784\u5efa\u4efb\u52a1\u6761\u4ef6\u7684\u4fe1\u606f\u4ea4\u4e92\u56fe\uff0c\u7ed3\u5408\u5168\u5c40\u4fe1\u606f\u6d41\u4e2d\u5fc3\u6027\u4e0e\u5c40\u90e8\u68af\u5ea6\u654f\u611f\u5ea6\u6765\u51b3\u5b9a\u5404\u6a21\u5757\u79e9\u9884\u7b97\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u76f8\u540c\u603b\u79e9\u548c\u8bad\u7ec3\u914d\u7f6e\u4e0b\u4f18\u4e8eLoRA\u3001AdaLoRA\u548cEVA\uff0c\u540c\u65f6\u8bad\u7ec3\u6210\u672c\u63a5\u8fd1\u6807\u51c6LoRA\uff0c\u5728LLaMA 3 8B\u6570\u5b66\u63a8\u7406\u4e0a\u5e26\u6765\u7ea61%\u52302%\u7684\u63d0\u5347\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22251", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u5927\u8bed\u8a00\u6a21\u578b", "LoRA", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22251v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "IFCLoRA: Topology-Aware Rank Allocation for Parameter-Efficient Fine-Tuning", "tldr": "IFCLoRA\u63d0\u51fa\u4e00\u79cd\u5728\u5fae\u8c03\u524d\u8fdb\u884c\u7684\u62d3\u6251\u611f\u77e5LoRA\u79e9\u5206\u914d\u65b9\u6cd5\uff0c\u7528\u5c0f\u6821\u51c6\u96c6\u548c\u51bb\u7ed3\u6a21\u578b\u6784\u5efa\u4efb\u52a1\u6761\u4ef6\u7684\u4fe1\u606f\u4ea4\u4e92\u56fe\uff0c\u7ed3\u5408\u5168\u5c40\u4fe1\u606f\u6d41\u4e2d\u5fc3\u6027\u4e0e\u5c40\u90e8\u68af\u5ea6\u654f\u611f\u5ea6\u6765\u51b3\u5b9a\u5404\u6a21\u5757\u79e9\u9884\u7b97\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u76f8\u540c\u603b\u79e9\u548c\u8bad\u7ec3\u914d\u7f6e\u4e0b\u4f18\u4e8eLoRA\u3001AdaLoRA\u548cEVA\uff0c\u540c\u65f6\u8bad\u7ec3\u6210\u672c\u63a5\u8fd1\u6807\u51c6LoRA\uff0c\u5728LLaMA 3 8B\u6570\u5b66\u63a8\u7406\u4e0a\u5e26\u6765\u7ea61%\u52302%\u7684\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Bayesian optimization (BO) is an optimization method that sequentially proposes the next candidate explainable variables for optimizing target variables by balancing exploration and exploitation. BO is often used under a limited evaluation budget, such as hyperparameter tuning of deep learning. Despite its effectiveness, conventional BO may have poor convergence in practical experimental science where each evaluation is often costly and time-consuming. Recently, BO methods have been proposed that accelerate optimization by using pseudo-experimental data that simulate experimental data. However, when only a limited number of experimental data are available, the generated pseudo-experimental data may be of insufficient quality. In this study, we developed PolyBO to improve optimization time by generating high-quality pseudo-experimental data even when the number of trials is limited. PolyBO performs BO efficiently by generating pseudo-experimental data with an adaptively updated versatile parametric model. This low-capacity polynomial regression model is intended to enable efficient BO even with limited experimental data. PolyBO updates the BO surrogate model with a combined dataset consisting of experimental data and pseudo-experimental data and then performs optimization. Using synthetic benchmark functions with diverse landscapes, we found that PolyBO reduced the optimization time by a median of 42\\%. For a real-world material composition optimization problem, PolyBO reduced the optimization time by a median of 96\\% compared with conventional methods. Overall, PolyBO achieves efficient optimization in settings where each experiment requires a long time.", "arxiv_id": "2607.22238", "arxiv_url": "https://arxiv.org/abs/2607.22238", "authors": ["Hirotaka Sugawara", "Yujin Taguchi", "Kei Minagawa", "Yusuke Hiki", "Takashi Morikura", "Akira Funahashi"], "brief": "\u672c\u6587\u63d0\u51fa PolyBO\uff0c\u7528\u81ea\u9002\u5e94\u66f4\u65b0\u7684\u4f4e\u5bb9\u91cf\u591a\u9879\u5f0f\u56de\u5f52\u6a21\u578b\u751f\u6210\u9ad8\u8d28\u91cf\u4f2a\u5b9e\u9a8c\u6570\u636e\uff0c\u5e76\u4e0e\u771f\u5b9e\u5b9e\u9a8c\u6570\u636e\u4e00\u8d77\u66f4\u65b0\u8d1d\u53f6\u65af\u4f18\u5316\u4ee3\u7406\u6a21\u578b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5408\u6210\u57fa\u51c6\u4e0a\u5c06\u4f18\u5316\u65f6\u95f4\u4e2d\u4f4d\u6570\u964d\u4f4e 42%\uff0c\u5728\u771f\u5b9e\u6750\u6599\u7ec4\u6210\u4f18\u5316\u4e2d\u964d\u4f4e 96%\uff0c\u9002\u5408\u5355\u6b21\u5b9e\u9a8c\u8017\u65f6\u8f83\u957f\u7684\u573a\u666f\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22238", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8d1d\u53f6\u65af\u4f18\u5316", "\u5b9e\u9a8c\u4f18\u5316", "\u56de\u5f52\u6a21\u578b", "\u6750\u6599\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22238v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Optimization of time-consuming experimental conditions using pseudo-experimental data guided by adaptive polynomial regression", "tldr": "\u672c\u6587\u63d0\u51fa PolyBO\uff0c\u7528\u81ea\u9002\u5e94\u66f4\u65b0\u7684\u4f4e\u5bb9\u91cf\u591a\u9879\u5f0f\u56de\u5f52\u6a21\u578b\u751f\u6210\u9ad8\u8d28\u91cf\u4f2a\u5b9e\u9a8c\u6570\u636e\uff0c\u5e76\u4e0e\u771f\u5b9e\u5b9e\u9a8c\u6570\u636e\u4e00\u8d77\u66f4\u65b0\u8d1d\u53f6\u65af\u4f18\u5316\u4ee3\u7406\u6a21\u578b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5408\u6210\u57fa\u51c6\u4e0a\u5c06\u4f18\u5316\u65f6\u95f4\u4e2d\u4f4d\u6570\u964d\u4f4e 42%\uff0c\u5728\u771f\u5b9e\u6750\u6599\u7ec4\u6210\u4f18\u5316\u4e2d\u964d\u4f4e 96%\uff0c\u9002\u5408\u5355\u6b21\u5b9e\u9a8c\u8017\u65f6\u8f83\u957f\u7684\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Zermelo\u0027s algorithm is a classical method for computing the maximum likelihood estimator in the Bradley--Terry (BT) model, but its convergence can be slow in practice. To accelerate computation, Newman introduced a family of Zermelo-type fixed-point iterations parameterized by $\u03b1$, with Zermelo\u0027s algorithm recovered at $\u03b1=1$. Empirical evidence suggests that the choice $\u03b1=0$ often converges substantially faster, making it a promising alternative, yet the mechanism underlying this acceleration remains elusive. This paper provides theoretical insight into this phenomenon through a systematic local convergence analysis. We derive closed-form expressions for local convergence factors under synchronous and asynchronous updates and analyze their dependence on $\u03b1$ via spectral analysis of the associated Jacobian matrices. For synchronous updates, we show that the algorithm may fail to converge when $\u03b1\u003c1$, and its local convergence factor is quasi-convex in $\u03b1$ under the population BT model. In contrast, asynchronous updates are always locally convergent, and their local convergence factor is provably monotonically increasing in $\u03b1$ under the population BT model of consistently ordered bipartite comparison graphs, establishing the optimality of $\u03b1=0$ in this setting. We further establish asymptotic approximation results for the population convergence factors under the BT model, justifying their practical relevance. Numerical experiments on synthetic and real-world datasets confirm the theory. Our analysis complements existing convergence results and shows that the acceleration of $\u03b1=0$ arises not only from the parameter choice but, more importantly, from the use of asynchronous updates.", "arxiv_id": "2607.22221", "arxiv_url": "https://arxiv.org/abs/2607.22221", "authors": ["Ruijian Han", "Ding Lu", "Yiming Xu"], "brief": "\u672c\u6587\u5206\u6790 Bradley--Terry \u6a21\u578b\u4e2d\u4e00\u7c7b Zermelo \u578b\u56fa\u5b9a\u70b9\u8fed\u4ee3\u7684\u5c40\u90e8\u6536\u655b\u6027\uff0c\u7ed9\u51fa\u540c\u6b65\u4e0e\u5f02\u6b65\u66f4\u65b0\u4e0b\u6536\u655b\u56e0\u5b50\u7684\u95ed\u5f0f\u8868\u8fbe\u548c\u8c31\u5206\u6790\u7ed3\u679c\u3002\u7406\u8bba\u8868\u660e\u540c\u6b65\u66f4\u65b0\u5728 \u03b1\u003c1 \u65f6\u53ef\u80fd\u4e0d\u6536\u655b\uff0c\u800c\u5f02\u6b65\u66f4\u65b0\u59cb\u7ec8\u5c40\u90e8\u6536\u655b\uff0c\u5e76\u5728\u7279\u5b9a\u603b\u4f53\u6a21\u578b\u4e0b\u8bc1\u660e \u03b1=0 \u6700\u4f18\uff1b\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u52a0\u901f\u4e3b\u8981\u6765\u81ea\u5f02\u6b65\u66f4\u65b0\u673a\u5236\u3002", "categories": ["stat.ML", "cs.LG", "math.NA", "stat.CO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22221", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7edf\u8ba1\u5b66\u4e60", "\u6392\u5e8f\u6a21\u578b", "\u6536\u655b\u5206\u6790", "\u6570\u503c\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22221v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Convergence analysis of a family of Zermelo-type iterations for the Bradley--Terry model", "tldr": "\u672c\u6587\u5206\u6790 Bradley--Terry \u6a21\u578b\u4e2d\u4e00\u7c7b Zermelo \u578b\u56fa\u5b9a\u70b9\u8fed\u4ee3\u7684\u5c40\u90e8\u6536\u655b\u6027\uff0c\u7ed9\u51fa\u540c\u6b65\u4e0e\u5f02\u6b65\u66f4\u65b0\u4e0b\u6536\u655b\u56e0\u5b50\u7684\u95ed\u5f0f\u8868\u8fbe\u548c\u8c31\u5206\u6790\u7ed3\u679c\u3002\u7406\u8bba\u8868\u660e\u540c\u6b65\u66f4\u65b0\u5728 \u03b1\u003c1 \u65f6\u53ef\u80fd\u4e0d\u6536\u655b\uff0c\u800c\u5f02\u6b65\u66f4\u65b0\u59cb\u7ec8\u5c40\u90e8\u6536\u655b\uff0c\u5e76\u5728\u7279\u5b9a\u603b\u4f53\u6a21\u578b\u4e0b\u8bc1\u660e \u03b1=0 \u6700\u4f18\uff1b\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u52a0\u901f\u4e3b\u8981\u6765\u81ea\u5f02\u6b65\u66f4\u65b0\u673a\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this study, we introduce latent PDE mapping, a broadly applicable physics-informed learning technique designed to enable efficient geometric generalization with sparse training data. Latent PDE mapping pulls back geometry-specific PDE residuals and boundary conditions to a predefined latent geometry via the deformation gradient, thereby enabling the automated calculation of geometry-consistent shape gradients that are missing in conventional physics-informed machine learning formulations. We demonstrate the utility of latent PDE mapping in solving the anisotropic Aliev-Panfilov PDE of cardiac electrophysiology using both physics-informed neural networks and physics-informed deep operator networks. The Aliev-Panfilov PDE serves as a challenging exemplar: a nonlinear, time-dependent PDE benchmark with sharp gradients that are expensive to capture using traditional numerical solvers. To represent the limited data regime, we train the networks using just fifteen geometric samples drawn from parameterized distributions in two and three spatial dimensions. While modest improvements appear for geometries parameterized by affine and shear deformations, latent PDE mapping demonstrates significant benefits on select geometric families, achieving a factor ~4-6 reduction in mean relative L2 error. Furthermore, our results show that the computational cost of applying latent PDE mapping was modest during network training, and negligible at inference. Taken together, our study highlights how latent PDE mapping facilitates the creation of generalizable physics-informed machine learning models from limited sets of training geometries.", "arxiv_id": "2607.22215", "arxiv_url": "https://arxiv.org/abs/2607.22215", "authors": ["Ingvild Askim Adde", "Mary M. Maleckar", "Gabriel Balaban"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u6f5c\u5728PDE\u6620\u5c04\u201d\uff0c\u5c06\u4e0d\u540c\u51e0\u4f55\u4e0a\u7684PDE\u6b8b\u5dee\u548c\u8fb9\u754c\u6761\u4ef6\u62c9\u56de\u5230\u7edf\u4e00\u6f5c\u5728\u51e0\u4f55\u4e2d\uff0c\u4ece\u800c\u5728\u7269\u7406\u7ea6\u675f\u5b66\u4e60\u4e2d\u81ea\u52a8\u83b7\u5f97\u51e0\u4f55\u4e00\u81f4\u7684\u5f62\u72b6\u68af\u5ea6\u3002\u8be5\u65b9\u6cd5\u5728\u5fc3\u810f\u7535\u751f\u7406 Aliev-Panfilov \u65b9\u7a0b\u4e0a\u7ed3\u5408 PINN \u548c\u7269\u7406\u7ea6\u675f\u7b97\u5b50\u7f51\u7edc\u9a8c\u8bc1\uff0c\u4ec5\u752815\u4e2a\u51e0\u4f55\u6837\u672c\u5373\u53ef\u63d0\u5347\u8de8\u51e0\u4f55\u6cdb\u5316\uff0c\u5728\u90e8\u5206\u51e0\u4f55\u65cf\u4e0a\u5e73\u5747\u76f8\u5bf9L2\u8bef\u5dee\u964d\u4f4e\u7ea64-6\u500d\uff0c\u8bad\u7ec3\u5f00\u9500\u8f83\u5c0f\u4e14\u63a8\u7406\u51e0\u4e4e\u65e0\u989d\u5916\u6210\u672c\u3002", "categories": ["cs.LG", "physics.comp-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22215", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7269\u7406\u7ea6\u675f\u5b66\u4e60", "\u504f\u5fae\u5206\u65b9\u7a0b", "\u51e0\u4f55\u6cdb\u5316", "\u7b97\u5b50\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22215v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Latent PDE mapping for efficient physics-informed learning across geometries with limited data", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u6f5c\u5728PDE\u6620\u5c04\u201d\uff0c\u5c06\u4e0d\u540c\u51e0\u4f55\u4e0a\u7684PDE\u6b8b\u5dee\u548c\u8fb9\u754c\u6761\u4ef6\u62c9\u56de\u5230\u7edf\u4e00\u6f5c\u5728\u51e0\u4f55\u4e2d\uff0c\u4ece\u800c\u5728\u7269\u7406\u7ea6\u675f\u5b66\u4e60\u4e2d\u81ea\u52a8\u83b7\u5f97\u51e0\u4f55\u4e00\u81f4\u7684\u5f62\u72b6\u68af\u5ea6\u3002\u8be5\u65b9\u6cd5\u5728\u5fc3\u810f\u7535\u751f\u7406 Aliev-Panfilov \u65b9\u7a0b\u4e0a\u7ed3\u5408 PINN \u548c\u7269\u7406\u7ea6\u675f\u7b97\u5b50\u7f51\u7edc\u9a8c\u8bc1\uff0c\u4ec5\u752815\u4e2a\u51e0\u4f55\u6837\u672c\u5373\u53ef\u63d0\u5347\u8de8\u51e0\u4f55\u6cdb\u5316\uff0c\u5728\u90e8\u5206\u51e0\u4f55\u65cf\u4e0a\u5e73\u5747\u76f8\u5bf9L2\u8bef\u5dee\u964d\u4f4e\u7ea64-6\u500d\uff0c\u8bad\u7ec3\u5f00\u9500\u8f83\u5c0f\u4e14\u63a8\u7406\u51e0\u4e4e\u65e0\u989d\u5916\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual anomaly detection requires adaptive representations and reliable decision boundaries, particularly when anomalous training samples are scarce and class distributions are highly imbalanced. Classical kernel-based methods yield principled geometric decision regions but typically operate on fixed features, while deep detectors learn task-specific representations but often fail to provide an explicit margin-aware kernel boundary. In this study, we propose DLM-SVDD, a deep large-margin novelty-detection framework that jointly learns convolutional features and an explicit kernel-based decision boundary. By drawing on the large-margin $\\ell_p$-Support Vector Data Description ($\\ell_p$-SVDD) approach, the proposed method performs explicit margin maximization and nonlinear slack penalization while adapting the representation to the target task. To train the proposed model, we present an optimization scheme that alternates between a Frank--Wolfe--based update of the convex dual boundary and a CNN update step operating on a smooth margin-violation loss induced by the recovered boundary. To improve scalability, we analyze the efficiency--accuracy trade-offs for different kernel approximation strategies, deriving practical propositions for large-scale anomaly detection. Extensive experiments on multiple standard benchmarks show consistent performance improvements over the baseline and strong overall performance compared with state-of-the-art methods while illustrating that the proposed joint representation--boundary learning scheme remains effective under severe imbalanced class distributions.", "arxiv_id": "2607.22212", "arxiv_url": "https://arxiv.org/abs/2607.22212", "authors": ["Alireza Dastmalchi Saei", "Shervin Rahimzadeh Arashloo"], "brief": "\u8bba\u6587\u63d0\u51fa DLM-SVDD\uff0c\u5c06\u5377\u79ef\u7279\u5f81\u5b66\u4e60\u4e0e\u5927\u95f4\u9694 \u2113p-SVDD \u6838\u51b3\u7b56\u8fb9\u754c\u8054\u5408\u4f18\u5316\uff0c\u7528\u4e8e\u89c6\u89c9\u5f02\u5e38\u68c0\u6d4b\u3002\u65b9\u6cd5\u901a\u8fc7\u4ea4\u66ff\u8fdb\u884c Frank-Wolfe \u5bf9\u5076\u8fb9\u754c\u66f4\u65b0\u548c CNN \u5e73\u6ed1\u95f4\u9694\u635f\u5931\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u4f18\u4e8e\u57fa\u7ebf\u5e76\u5728\u7c7b\u522b\u6781\u4e0d\u5e73\u8861\u573a\u666f\u4e0b\u4fdd\u6301\u8f83\u5f3a\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22212", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f02\u5e38\u68c0\u6d4b", "\u6df1\u5ea6\u5b66\u4e60", "\u6838\u65b9\u6cd5", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22212v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Deep Convolutional Large-Margin $\\ell_p$-SVDD for Visual Anomaly Detection", "tldr": "\u8bba\u6587\u63d0\u51fa DLM-SVDD\uff0c\u5c06\u5377\u79ef\u7279\u5f81\u5b66\u4e60\u4e0e\u5927\u95f4\u9694 \u2113p-SVDD \u6838\u51b3\u7b56\u8fb9\u754c\u8054\u5408\u4f18\u5316\uff0c\u7528\u4e8e\u89c6\u89c9\u5f02\u5e38\u68c0\u6d4b\u3002\u65b9\u6cd5\u901a\u8fc7\u4ea4\u66ff\u8fdb\u884c Frank-Wolfe \u5bf9\u5076\u8fb9\u754c\u66f4\u65b0\u548c CNN \u5e73\u6ed1\u95f4\u9694\u635f\u5931\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u4f18\u4e8e\u57fa\u7ebf\u5e76\u5728\u7c7b\u522b\u6781\u4e0d\u5e73\u8861\u573a\u666f\u4e0b\u4fdd\u6301\u8f83\u5f3a\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce trajectory-regularized stochastic optimal control (TRSOC), which augments standard stochastic optimal control (SOC) with a Kullback--Leibler (KL) divergence between controlled and reference trajectory distributions. Using Girsanov\u0027s theorem, the trajectory KL reduces to a quadratic drift mismatch penalty, yielding a modified running cost that preserves the dynamic programming (DP) structure. We derive the corresponding Hamilton--Jacobi--Bellman (HJB) equation and characterize the optimal policy. In the linear-quadratic (LQ) setting, the formulation admits a closed-form solution with an augmented control cost. Experiments show that the regularization parameter induces a trade-off between performance-driven and reference-preserving behavior, including cases with reference dynamics learned from offline data.", "arxiv_id": "2607.22201", "arxiv_url": "https://arxiv.org/abs/2607.22201", "authors": ["Mintae Kim", "Koushil Sreenath"], "brief": "\u63d0\u51fa\u8f68\u8ff9\u6b63\u5219\u5316\u968f\u673a\u6700\u4f18\u63a7\u5236\uff08TRSOC\uff09\uff0c\u5728\u6807\u51c6\u968f\u673a\u6700\u4f18\u63a7\u5236\u4e2d\u52a0\u5165\u53d7\u63a7\u8f68\u8ff9\u5206\u5e03\u4e0e\u53c2\u8003\u8f68\u8ff9\u5206\u5e03\u7684 KL \u6563\u5ea6\u3002\u901a\u8fc7 Girsanov \u5b9a\u7406\u5c06\u8f68\u8ff9 KL \u5316\u4e3a\u6f02\u79fb\u5dee\u5f02\u7684\u4e8c\u6b21\u60e9\u7f5a\uff0c\u4fdd\u7559\u52a8\u6001\u89c4\u5212\u7ed3\u6784\uff0c\u5e76\u5728 LQ \u60c5\u5f62\u7ed9\u51fa\u95ed\u5f0f\u89e3\uff1b\u5b9e\u9a8c\u5c55\u793a\u4e86\u6027\u80fd\u4f18\u5316\u4e0e\u4fdd\u6301\u53c2\u8003\u52a8\u6001\u4e4b\u95f4\u7684\u53ef\u8c03\u6743\u8861\u3002", "categories": ["eess.SY", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.22201", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u968f\u673a\u6700\u4f18\u63a7\u5236", "KL\u6563\u5ea6", "\u52a8\u6001\u89c4\u5212", "\u79bb\u7ebf\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.22201v1", "published_at": "2026-07-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Trajectory-Regularized Stochastic Optimal Control via KL Divergence", "tldr": "\u63d0\u51fa\u8f68\u8ff9\u6b63\u5219\u5316\u968f\u673a\u6700\u4f18\u63a7\u5236\uff08TRSOC\uff09\uff0c\u5728\u6807\u51c6\u968f\u673a\u6700\u4f18\u63a7\u5236\u4e2d\u52a0\u5165\u53d7\u63a7\u8f68\u8ff9\u5206\u5e03\u4e0e\u53c2\u8003\u8f68\u8ff9\u5206\u5e03\u7684 KL \u6563\u5ea6\u3002\u901a\u8fc7 Girsanov \u5b9a\u7406\u5c06\u8f68\u8ff9 KL \u5316\u4e3a\u6f02\u79fb\u5dee\u5f02\u7684\u4e8c\u6b21\u60e9\u7f5a\uff0c\u4fdd\u7559\u52a8\u6001\u89c4\u5212\u7ed3\u6784\uff0c\u5e76\u5728 LQ \u60c5\u5f62\u7ed9\u51fa\u95ed\u5f0f\u89e3\uff1b\u5b9e\u9a8c\u5c55\u793a\u4e86\u6027\u80fd\u4f18\u5316\u4e0e\u4fdd\u6301\u53c2\u8003\u52a8\u6001\u4e4b\u95f4\u7684\u53ef\u8c03\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
