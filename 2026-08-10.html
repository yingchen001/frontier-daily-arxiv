weak object-level proposals, requires no question-specific evidence annotations, and adds no inference-time overhead. Across nine public benchmarks and four backbones, CED outperforms prior RL-based post-training methods, with targeted analyses verifying its object-centric signal.", "arxiv_id": "2608.08021", "arxiv_url": "https://arxiv.org/abs/2608.08021", "authors": ["Haojie Huang", "Xinlei Yu", "Chengming Xu", "Zhangquan Chen", "Cheng Yang", "Qingdong He", "Yu Yang", "Jiangning Zhang", "Xiaobin Hu"], "brief": "\u8bba\u6587\u63d0\u51fa Counterfactual Evidence Disentanglement\uff08CED\uff09\uff0c\u5728\u8bad\u7ec3\u65f6\u5ba1\u8ba1 VLM \u7684\u7b54\u6848\u662f\u5426\u56e0\u679c\u4f9d\u8d56\u4e8e\u56fe\u50cf\u4e2d\u7684\u5c40\u90e8\u8bc1\u636e\u533a\u57df\u3002\u5b83\u5c06\u8be5\u8bc1\u636e\u4fe1\u53f7\u878d\u5165 GRPO\uff0c\u5956\u52b1\u65e2\u7b54\u5bf9\u53c8\u4f9d\u8d56\u771f\u5b9e\u89c6\u89c9\u8bc1\u636e\u7684\u56de\u7b54\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08021", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u4e2d\u548c\u5bf9\u8c61\u4e2d\u5fc3\u7684 Evidence Region\uff0c\u5e76\u4e0e\u5339\u914d\u7684\u975e\u8bc1\u636e\u533a\u57df\u5bf9\u6bd4\u652f\u6301\u5ea6\u4e0b\u964d\uff0c\u8861\u91cf\u7b54\u6848\u5bf9\u5c40\u90e8\u8bc1\u636e\u7684\u56e0\u679c\u4f9d\u8d56", "\u65e0\u9700\u95ee\u9898\u7ea7\u8bc1\u636e\u6807\u6ce8\uff0c\u4ec5\u4f7f\u7528\u5f31\u5bf9\u8c61\u7ea7\u5019\u9009\u533a\u57df\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u65f6\u5f00\u9500", "\u57289\u4e2a\u516c\u5f00\u57fa\u51c6\u548c4\u79cd\u9aa8\u5e72\u6a21\u578b\u4e0a\u4f18\u4e8e\u65e2\u6709 RL \u540e\u8bad\u7ec3\u65b9\u6cd5\uff0c\u5e76\u901a\u8fc7\u5b9a\u5411\u5206\u6790\u9a8c\u8bc1\u5bf9\u8c61\u4e2d\u5fc3\u4fe1\u53f7\u6709\u6548"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u8bc1\u636e grounding"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08021v1", "published_at": "2026-08-08", "score": 0.246, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08021.png", "title": "Evidence-RL: Towards Evidence-intensive Visual Reasoning", "tldr": "\u7528\u53cd\u4e8b\u5b9e\u8bc1\u636e\u5ba1\u8ba1\u5f3a\u5316\u89c6\u89c9\u63a8\u7406 grounding", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa Counterfactual Evidence Disentanglement\uff08CED\uff09\uff0c\u5728\u8bad\u7ec3\u65f6\u5ba1\u8ba1 VLM \u7684\u7b54\u6848\u662f\u5426\u56e0\u679c\u4f9d\u8d56\u4e8e\u56fe\u50cf\u4e2d\u7684\u5c40\u90e8\u8bc1\u636e\u533a\u57df\u3002\u5b83\u5c06\u8be5\u8bc1\u636e\u4fe1\u53f7\u878d\u5165 GRPO\uff0c\u5956\u52b1\u65e2\u7b54\u5bf9\u53c8\u4f9d\u8d56\u771f\u5b9e\u89c6\u89c9\u8bc1\u636e\u7684\u56de\u7b54\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4ece\u201c\u662f\u5426\u770b\u56fe\u201d\u63a8\u8fdb\u5230\u201c\u662f\u5426\u4f9d\u8d56\u6b63\u786e\u5c40\u90e8\u8bc1\u636e\u201d\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11 VLM \u5229\u7528\u8bed\u8a00\u5148\u9a8c\u3001\u6570\u636e\u6377\u5f84\u6216\u65e0\u5173\u89c6\u89c9\u4e0a\u4e0b\u6587\u4f5c\u7b54\u7684\u95ee\u9898\uff0c\u5bf9\u63d0\u5347\u89c6\u89c9\u63a8\u7406\u53ef\u9760\u6027\u548c\u53ef\u89e3\u91ca grounding \u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Activation Oracles (AOs) are language models trained to answer natural-language questions about another model\u0027s internal activations. They offer a flexible interface for reading hidden information from model states, especially when relevant information is internally represented but absent or incomplete in visible behavior. However, AOs are themselves learned systems: their answers are shaped by training data, objectives, and learned reporting behavior, rather than being neutral readouts of represented information. We study this in a controlled Taboo Word Guessing setting, where subject models are fine-tuned to internally use a hidden concept while avoiding direct disclosure. Contrary to the expectation that an AO trained on such a subject becomes a specialist reader, we find that fine-tuned AOs can become concept-specific anti-readers: they selectively fail to recover the concept persistently present during their own training. This failure is not simply explained by absence of the concept from the subject or oracle representations: the target remains decodable inside the oracle, while LogitLens and layer-ablation analyses indicate that the failure arises in the AO readout pathway. Our results show that behavioral leakage, representation-level decodability, and AO-verbalizability can come apart, raising a reliability concern for learned interpretability interfaces.", "arxiv_id": "2607.23379", "arxiv_url": "https://arxiv.org/abs/2607.23379", "authors": ["Tobias Bersia", "Tatiana Gaintseva"], "brief": "\u8bba\u6587\u7814\u7a76 Activation Oracles \u4f5c\u4e3a\u8bfb\u53d6\u6a21\u578b\u5185\u90e8\u6fc0\u6d3b\u7684\u53ef\u5b66\u4e60\u63a5\u53e3\u65f6\u7684\u53ef\u9760\u6027\u95ee\u9898\u3002\u5728\u53d7\u63a7 Taboo Word Guessing \u4efb\u52a1\u4e2d\u53d1\u73b0\uff0c\u5fae\u8c03\u540e\u7684 AO \u53ef\u80fd\u5bf9\u8bad\u7ec3\u4e2d\u53cd\u590d\u51fa\u73b0\u7684\u7279\u5b9a\u9690\u85cf\u6982\u5ff5\u53cd\u800c\u9009\u62e9\u6027\u8bfb\u4e0d\u51fa\u6765\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.23379", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u4e3b\u4f53\u6a21\u578b\u5185\u90e8\u4f7f\u7528\u9690\u85cf\u6982\u5ff5\u4f46\u907f\u514d\u76f4\u63a5\u6cc4\u9732\u7684\u53d7\u63a7\u8bbe\u7f6e\uff0c\u7528\u4e8e\u6d4b\u8bd5 AO \u662f\u5426\u80fd\u8bfb\u53d6\u5185\u90e8\u8868\u5f81\u3002", "\u53d1\u73b0\u5fae\u8c03 AO \u4e0d\u662f\u6210\u4e3a\u4e13\u95e8\u8bfb\u8005\uff0c\u800c\u53ef\u80fd\u53d8\u6210\u6982\u5ff5\u7279\u5b9a\u7684\u201c\u53cd\u8bfb\u8005\u201d\uff0c\u6301\u7eed\u65e0\u6cd5\u6062\u590d\u8bad\u7ec3\u4e2d\u5b58\u5728\u7684\u76ee\u6807\u6982\u5ff5\u3002", "LogitLens\u3001\u5c42\u6d88\u878d\u4e0e\u53ef\u89e3\u7801\u6027\u5206\u6790\u8868\u660e\uff0c\u76ee\u6807\u6982\u5ff5\u4ecd\u5728 oracle \u5185\u90e8\u53ef\u89e3\u7801\uff0c\u5931\u8d25\u4e3b\u8981\u53d1\u751f\u5728 AO \u7684\u8bfb\u51fa\u4e0e\u8bed\u8a00\u5316\u8def\u5f84\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u8868\u5f81\u5206\u6790"], "num_comments": 2, "on_hf": true, "organization": "Queen Mary University of London", "pdf_url": "https://arxiv.org/pdf/2607.23379v1", "published_at": "2026-07-25", "score": 0.245, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.23379.png", "title": "When Activation Oracles Learn Not to Read: Concept-Specific Blind Spots in Fine-Tuned Oracles", "tldr": "\u5fae\u8c03\u6fc0\u6d3b oracle \u4f1a\u5f62\u6210\u6982\u5ff5\u76f2\u70b9", "upvotes": 10, "what_it_is": "\u8bba\u6587\u7814\u7a76 Activation Oracles \u4f5c\u4e3a\u8bfb\u53d6\u6a21\u578b\u5185\u90e8\u6fc0\u6d3b\u7684\u53ef\u5b66\u4e60\u63a5\u53e3\u65f6\u7684\u53ef\u9760\u6027\u95ee\u9898\u3002\u5728\u53d7\u63a7 Taboo Word Guessing \u4efb\u52a1\u4e2d\u53d1\u73b0\uff0c\u5fae\u8c03\u540e\u7684 AO \u53ef\u80fd\u5bf9\u8bad\u7ec3\u4e2d\u53cd\u590d\u51fa\u73b0\u7684\u7279\u5b9a\u9690\u85cf\u6982\u5ff5\u53cd\u800c\u9009\u62e9\u6027\u8bfb\u4e0d\u51fa\u6765\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u53ef\u5b66\u4e60\u7684\u53ef\u89e3\u91ca\u6027\u63a5\u53e3\u5e76\u975e\u4e2d\u7acb\u8bfb\u6570\u5668\uff1a\u884c\u4e3a\u6cc4\u9732\u3001\u8868\u5f81\u53ef\u89e3\u7801\u6027\u548c AO \u80fd\u5426\u8bed\u8a00\u5316\u62a5\u544a\u53ef\u80fd\u76f8\u4e92\u8131\u94a9\uff0c\u5bf9\u4f9d\u8d56\u6a21\u578b\u8bfb\u5185\u90e8\u72b6\u6001\u7684\u5b89\u5168\u8bc4\u4f30\u4e0e\u53ef\u89e3\u91ca\u6027\u65b9\u6cd5\u63d0\u51fa\u53ef\u9760\u6027\u8b66\u793a\u3002"}, {"abstract": "Turn-taking is a central component of full-duplex interaction. Which turn-taking behaviors are appropriate varies with the scenario, yet current models apply a single norm regardless of context. This limitation originates in their training data: human-human speech corpora capture natural timing phenomena but provide little role grounding or scenario-specific norms, while heuristic or prompted synthesis methods inject turn-taking behaviors without basing them on human preferences. We introduce DuplexGen, a framework for generating dialogues with scenario-adaptive turn-taking by calibrating LLM predictions against a small set of slot-level human preference annotations. In six cooperative and competitive tasks, human turn-taking preferences differ systematically, and DuplexGen aligns substantially more closely with those preferences than uncalibrated prompting or training solely on generic human-human data; a full-duplex model trained on DuplexGen-generated data exhibits distinctive, human-preferred turn-taking behaviors. These results show that human calibration, not corpus scale or prompt design alone, is what allows turn-taking synthesis to be scenario-specific.", "arxiv_id": "2607.26178", "arxiv_url": "https://arxiv.org/abs/2607.26178", "authors": ["Takyoung Kim", "Kang-wook Kim", "Sang Hoon Woo", "Julia Hirschberg", "Gunhee Kim", "Dilek Hakkani-T\u00fcr"], "brief": "\u8bba\u6587\u63d0\u51fa DuplexGen\uff0c\u4e00\u4e2a\u751f\u6210\u5177\u5907\u573a\u666f\u81ea\u9002\u5e94\u8f6e\u66ff\u884c\u4e3a\u7684\u4eba\u673a\u5168\u53cc\u5de5\u5bf9\u8bdd\u6846\u67b6\u3002\u5b83\u7528\u5c11\u91cf\u69fd\u4f4d\u7ea7\u4eba\u7c7b\u504f\u597d\u6807\u6ce8\u6821\u51c6 LLM \u9884\u6d4b\uff0c\u4f7f\u5408\u6210\u6570\u636e\u66f4\u7b26\u5408\u4e0d\u540c\u4efb\u52a1\u4e2d\u7684\u4eba\u7c7b\u8f6e\u66ff\u504f\u597d\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/duplexgen/duplexgen-code", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2607.26178", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u5408\u4f5c\u4e0e\u7ade\u4e89\u7b49\u516d\u7c7b\u4efb\u52a1\u4e2d\u7684\u4eba\u7c7b turn-taking \u504f\u597d\u5b58\u5728\u7cfb\u7edf\u6027\u5dee\u5f02\uff0c\u4e0d\u80fd\u7528\u5355\u4e00\u5bf9\u8bdd\u89c4\u8303\u8986\u76d6\u3002", "DuplexGen \u901a\u8fc7\u5c0f\u89c4\u6a21\u69fd\u4f4d\u7ea7\u504f\u597d\u6807\u6ce8\u6821\u51c6 LLM\uff0c\u800c\u975e\u4ec5\u4f9d\u8d56\u63d0\u793a\u8bcd\u6216\u5927\u89c4\u6a21\u4eba-\u4eba\u8bed\u6599\u3002", "\u7528 DuplexGen \u6570\u636e\u8bad\u7ec3\u7684\u5168\u53cc\u5de5\u6a21\u578b\u8868\u73b0\u51fa\u66f4\u9c9c\u660e\u4e14\u66f4\u53d7\u4eba\u7c7b\u504f\u597d\u7684\u8f6e\u66ff\u884c\u4e3a\u3002"], "keywords": ["\u5bf9\u8bdd\u7cfb\u7edf", "\u4eba\u673a\u4ea4\u4e92", "\u6570\u636e\u5408\u6210", "\u504f\u597d\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2607.26178v1", "published_at": "2026-07-28", "score": 0.226, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.26178.png", "title": "DuplexGen: Adaptive Synthesis of Human-AI Turn-Taking Dialogues", "tldr": "\u7528\u5c11\u91cf\u4eba\u7c7b\u504f\u597d\u6821\u51c6\u751f\u6210\u573a\u666f\u5316\u5168\u53cc\u5de5\u5bf9\u8bdd", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa DuplexGen\uff0c\u4e00\u4e2a\u751f\u6210\u5177\u5907\u573a\u666f\u81ea\u9002\u5e94\u8f6e\u66ff\u884c\u4e3a\u7684\u4eba\u673a\u5168\u53cc\u5de5\u5bf9\u8bdd\u6846\u67b6\u3002\u5b83\u7528\u5c11\u91cf\u69fd\u4f4d\u7ea7\u4eba\u7c7b\u504f\u597d\u6807\u6ce8\u6821\u51c6 LLM \u9884\u6d4b\uff0c\u4f7f\u5408\u6210\u6570\u636e\u66f4\u7b26\u5408\u4e0d\u540c\u4efb\u52a1\u4e2d\u7684\u4eba\u7c7b\u8f6e\u66ff\u504f\u597d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5168\u53cc\u5de5\u4eba\u673a\u4ea4\u4e92\u4e2d\u7684\u8f6e\u66ff\u884c\u4e3a\u9700\u8981\u6309\u573a\u666f\u6821\u51c6\uff0c\u4eba\u7c7b\u504f\u597d\u4fe1\u53f7\u6bd4\u8bed\u6599\u89c4\u6a21\u6216\u63d0\u793a\u8bbe\u8ba1\u66f4\u5173\u952e\uff0c\u5bf9\u6784\u5efa\u81ea\u7136\u3001\u53ef\u63a7\u7684\u5b9e\u65f6\u8bed\u97f3\u5bf9\u8bdd\u7cfb\u7edf\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Real-world shopping often requires constructing a basket of complementary items rather than retrieving a single product. Such combo-shopping tasks arise in device setup, meal preparation, event planning, and group takeout ordering, requiring joint reasoning about item compatibility, availability, store-level requirements, delivery fees, coupons, and budgets. Evaluation is challenging because multiple baskets may satisfy the same request, making exact-match metrics unsuitable, whereas semantic evaluation alone cannot detect infeasible orders, invalid coupon combinations, or incorrect payments. We introduce ComboShoppingBench, an agentic shopping benchmark for open-ended yet verifiable basket construction in a simulated commerce and takeout environment. During task synthesis, an exploration agent constructs a feasible and semantically coherent basket of purchasable products; this witness guides the generation of coupons, budget constraints, user queries, and aligned evaluation rubrics. During evaluation, LLM judges assess semantic satisfaction, response quality, and claim faithfulness, while deterministic validation checks product-ID validity, budget compliance, and coupon optimality. Experiments with diverse LLM agents demonstrate that even strong agents struggle on ComboShoppingBench, highlighting substantial room for improvement in reliable, constraint-aware combo shopping.", "arxiv_id": "2608.09282", "arxiv_url": "https://arxiv.org/abs/2608.09282", "authors": ["Adrian Li", "Kelong Mao", "Yudong Guo", "Heming Xia", "Xinwei Yang", "Lirui Luo", "Jace Wong", "Pu Yao", "Sulong Xu", "Simiu Gu"], "brief": "\u672c\u6587\u63d0\u51fa ComboShoppingBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u6709\u9884\u7b97\u3001\u4f18\u60e0\u5238\u3001\u914d\u9001\u8d39\u7b49\u7ea6\u675f\u4e0b\u6784\u5efa\u7ec4\u5408\u8d2d\u7269\u7bee\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u7ed3\u5408 LLM \u8bed\u4e49\u8bc4\u5ba1\u4e0e\u786e\u5b9a\u6027\u6821\u9a8c\uff0c\u53d1\u73b0\u73b0\u6709\u5f3a\u6a21\u578b\u5728\u7ea6\u675f\u611f\u77e5\u3001\u53ef\u884c\u8ba2\u5355\u548c\u4f18\u60e0\u5238\u4f18\u5316\u4e0a\u4ecd\u8868\u73b0\u4e0d\u8db3\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09282", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u7ea6\u675f\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09282v1", "published_at": "2026-08-10", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ComboShoppingBench: Evaluating LLM Agents for Budget-Constrained Basket Shopping with Coupons", "tldr": "\u672c\u6587\u63d0\u51fa ComboShoppingBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u6709\u9884\u7b97\u3001\u4f18\u60e0\u5238\u3001\u914d\u9001\u8d39\u7b49\u7ea6\u675f\u4e0b\u6784\u5efa\u7ec4\u5408\u8d2d\u7269\u7bee\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u7ed3\u5408 LLM \u8bed\u4e49\u8bc4\u5ba1\u4e0e\u786e\u5b9a\u6027\u6821\u9a8c\uff0c\u53d1\u73b0\u73b0\u6709\u5f3a\u6a21\u578b\u5728\u7ea6\u675f\u611f\u77e5\u3001\u53ef\u884c\u8ba2\u5355\u548c\u4f18\u60e0\u5238\u4f18\u5316\u4e0a\u4ecd\u8868\u73b0\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents are increasingly equipped with skills to perform complex tasks through multi-step reasoning and tool use. Although skills provide reusable procedural knowledge, agents may still execute them unreliably. Even when an agent has demonstrated the capability to complete tasks under the guidance of a skill, it may fail to do so consistently across similar tasks or repeated runs due to deviations from the skill procedure or incorrect execution of individual steps. Such instability limits the practical reliability of LLM agents. To address this problem, we propose SkillSentry, a skill-oriented runtime assurance framework built upon a new domain-specific language (DSL) for representing runtime guidance for skill execution. SkillSentry initializes the runtime guidance by combining a skill specification extracted from the corresponding skill document with execution experience mined from historical successful and failed traces. It then wraps around the agent execution loop to monitor and guide skill execution under the current guidance, while iteratively refining the guidance using newly collected traces. We evaluate SkillSentry on 15 skills across two LLM agents, each paired with two backbone models, i.e., Claude Code with Claude-Haiku-4.5 and Claude-Opus-4.6, and Codex with GPT-5.2 and GPT-5.4. Our results show that SkillSentry improves the task success rate of LLM agents by 24.1% across skills, on average, while exhibiting lower variability across repeated runs.", "arxiv_id": "2608.09253", "arxiv_url": "https://arxiv.org/abs/2608.09253", "authors": ["You Lu", "Xinyu Huang", "Bihuan Chen", "Xin Peng"], "brief": "\u8bba\u6587\u63d0\u51fa SkillSentry\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u6280\u80fd\u6267\u884c\u7684\u8fd0\u884c\u65f6\u4fdd\u969c\u6846\u67b6\uff0c\u7528 DSL \u8868\u793a\u6280\u80fd\u6267\u884c\u6307\u5bfc\uff0c\u5e76\u7ed3\u5408\u6280\u80fd\u6587\u6863\u4e0e\u5386\u53f2\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u521d\u59cb\u5316\u548c\u8fed\u4ee3\u4f18\u5316\u6307\u5bfc\u3002\u5b83\u5728\u6267\u884c\u8fc7\u7a0b\u4e2d\u76d1\u63a7\u5e76\u7ea0\u504f\u667a\u80fd\u4f53\u7684\u6280\u80fd\u6b65\u9aa4\uff0c\u5728 15 \u4e2a\u6280\u80fd\u3001\u591a\u4e2a\u667a\u80fd\u4f53\u548c\u6a21\u578b\u4e0a\u5e73\u5747\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387 24.1%\uff0c\u5e76\u964d\u4f4e\u91cd\u590d\u8fd0\u884c\u6ce2\u52a8\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09253", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5de5\u5177\u4f7f\u7528", "\u8fd0\u884c\u65f6\u4fdd\u969c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09253v1", "published_at": "2026-08-10", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SkillSentry: Reliable Skill Execution for LLM Agents via Runtime Assurance", "tldr": "\u8bba\u6587\u63d0\u51fa SkillSentry\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u6280\u80fd\u6267\u884c\u7684\u8fd0\u884c\u65f6\u4fdd\u969c\u6846\u67b6\uff0c\u7528 DSL \u8868\u793a\u6280\u80fd\u6267\u884c\u6307\u5bfc\uff0c\u5e76\u7ed3\u5408\u6280\u80fd\u6587\u6863\u4e0e\u5386\u53f2\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u521d\u59cb\u5316\u548c\u8fed\u4ee3\u4f18\u5316\u6307\u5bfc\u3002\u5b83\u5728\u6267\u884c\u8fc7\u7a0b\u4e2d\u76d1\u63a7\u5e76\u7ea0\u504f\u667a\u80fd\u4f53\u7684\u6280\u80fd\u6b65\u9aa4\uff0c\u5728 15 \u4e2a\u6280\u80fd\u3001\u591a\u4e2a\u667a\u80fd\u4f53\u548c\u6a21\u578b\u4e0a\u5e73\u5747\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387 24.1%\uff0c\u5e76\u964d\u4f4e\u91cd\u590d\u8fd0\u884c\u6ce2\u52a8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When a dog opens its mouth and barks, humans naturally recognize what the sound is and when it occurs. Building audio-visual models with this same ability requires representations that capture both semantic and temporal alignment. Current approaches fall short on one side or the other: embedding models match semantic but lose temporal information; synchronization models capture temporal offsets but lack semantic understanding. To bridge this gap, we propose FATE, Frame-level Audio-visual Temporal Embedding. Unlike prior embedding models that pool each modality into a single embedding and discard temporal information, FATE retains frame-level sequences, aligns them on the physical timeline, and computes similarity over strictly aligned frame pairs. Unlike synchronization models that output only an offset prediction, FATE encodes synchronization in a reusable embedding space, trained with a joint objective combining cross-video semantic and within-video temporal contrastive learning to capture both what sounds and when it occurs. Across three tasks, FATE surpasses the strongest baseline on temporal and semantic retrieval by a large margin, matches fully supervised methods on event localization in a zero-shot setting, and achieves the best correlation with human judgments as a generation evaluation metric. The source code can be found at \\texttt{https://github.com/guankaisi/FATE}.", "arxiv_id": "2608.01310", "arxiv_url": "https://arxiv.org/abs/2608.01310", "authors": ["Kaisi Guan", "Bingzi Zhang", "Xihua Wang", "Ying Ba", "Xin Cheng", "Yijing Chen", "Ruihua Song"], "brief": "\u8bba\u6587\u63d0\u51fa FATE\uff0c\u4e00\u79cd\u5e27\u7ea7\u97f3\u89c6\u9891\u65f6\u95f4\u5d4c\u5165\u65b9\u6cd5\uff0c\u4fdd\u7559\u97f3\u9891\u4e0e\u89c6\u9891\u7684\u5e27\u5e8f\u5217\u5e76\u5728\u7269\u7406\u65f6\u95f4\u7ebf\u4e0a\u4e25\u683c\u5bf9\u9f50\u8ba1\u7b97\u76f8\u4f3c\u5ea6\u3002\u5b83\u901a\u8fc7\u8de8\u89c6\u9891\u8bed\u4e49\u5bf9\u6bd4\u4e0e\u540c\u89c6\u9891\u65f6\u95f4\u5bf9\u6bd4\u8054\u5408\u8bad\u7ec3\uff0c\u4f7f\u5d4c\u5165\u540c\u65f6\u8868\u8fbe\u201c\u662f\u4ec0\u4e48\u58f0\u97f3\u201d\u548c\u201c\u4f55\u65f6\u53d1\u751f\u201d\u3002", "categories": ["cs.MM"], "github_repo": "https://github.com/guankaisi/FATE", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2608.01310", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u540c\u4e8e\u5c06\u6574\u6bb5\u97f3\u9891/\u89c6\u9891\u6c60\u5316\u4e3a\u5355\u4e00\u5411\u91cf\u7684\u4f20\u7edf\u5d4c\u5165\u6a21\u578b\uff0cFATE \u4fdd\u7559\u5e27\u7ea7\u65f6\u5e8f\u4fe1\u606f\u3002", "\u4e0d\u540c\u4e8e\u53ea\u9884\u6d4b\u65f6\u95f4\u504f\u79fb\u7684\u540c\u6b65\u6a21\u578b\uff0cFATE \u5c06\u540c\u6b65\u5173\u7cfb\u7f16\u7801\u5230\u53ef\u590d\u7528\u7684\u5d4c\u5165\u7a7a\u95f4\u4e2d\u3002", "\u5728\u65f6\u95f4\u4e0e\u8bed\u4e49\u68c0\u7d22\u3001\u96f6\u6837\u672c\u4e8b\u4ef6\u5b9a\u4f4d\u3001\u751f\u6210\u8bc4\u4f30\u76f8\u5173\u6027\u7b49\u4efb\u52a1\u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u5728\u96f6\u6837\u672c\u5b9a\u4f4d\u4e2d\u63a5\u8fd1\u5168\u76d1\u7763\u65b9\u6cd5\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u97f3\u89c6\u9891\u7406\u89e3", "\u8868\u5f81\u5b66\u4e60", "\u5bf9\u6bd4\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Renmin University of China", "pdf_url": "https://arxiv.org/pdf/2608.01310v1", "published_at": "2026-08-02", "score": 0.218, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01310.png", "title": "FATE: Frame-Level Audio-Visual Temporal Embedding", "tldr": "\u5e27\u7ea7\u97f3\u89c6\u9891\u5d4c\u5165\u540c\u65f6\u5bf9\u9f50\u8bed\u4e49\u4e0e\u65f6\u95f4", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa FATE\uff0c\u4e00\u79cd\u5e27\u7ea7\u97f3\u89c6\u9891\u65f6\u95f4\u5d4c\u5165\u65b9\u6cd5\uff0c\u4fdd\u7559\u97f3\u9891\u4e0e\u89c6\u9891\u7684\u5e27\u5e8f\u5217\u5e76\u5728\u7269\u7406\u65f6\u95f4\u7ebf\u4e0a\u4e25\u683c\u5bf9\u9f50\u8ba1\u7b97\u76f8\u4f3c\u5ea6\u3002\u5b83\u901a\u8fc7\u8de8\u89c6\u9891\u8bed\u4e49\u5bf9\u6bd4\u4e0e\u540c\u89c6\u9891\u65f6\u95f4\u5bf9\u6bd4\u8054\u5408\u8bad\u7ec3\uff0c\u4f7f\u5d4c\u5165\u540c\u65f6\u8868\u8fbe\u201c\u662f\u4ec0\u4e48\u58f0\u97f3\u201d\u548c\u201c\u4f55\u65f6\u53d1\u751f\u201d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f25\u5408\u4e86\u97f3\u89c6\u9891\u8bed\u4e49\u7406\u89e3\u4e0e\u65f6\u95f4\u540c\u6b65\u5efa\u6a21\u4e4b\u95f4\u7684\u7f3a\u53e3\uff0c\u53ef\u7528\u4e8e\u68c0\u7d22\u3001\u4e8b\u4ef6\u5b9a\u4f4d\u548c\u97f3\u89c6\u9891\u751f\u6210\u8d28\u91cf\u8bc4\u4f30\u7b49\u591a\u79cd\u591a\u6a21\u6001\u4efb\u52a1\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Creative capabilities of MLLMs matter in design, communication, education, and human--AI collaboration, yet remain difficult to evaluate because explicit targets and reward signals are scarce compared with accuracy-oriented tasks. Cross-concept understanding is a core cognitive capacity underlying receptive creativity. It enables a perceiver to recover intended meaning from non-obvious but meaningful conceptual relations. We operationalize item construction as cross-concept encoding and model inference as cross-concept decoding. We introduce C4, a cognition-inspired evaluation framework for Chengyu (Chinese idiom)-based Cross-Concept Creativity. Its encoding component maps target slots to imageable substitute concepts along bridge paths in a manually annotated and third-party-reviewed cross-concept network, enabling batch generation with explicit structure, difficulty indexed by bridge count and depth, and exact answers. Using this framework, we instantiate the C4 Evaluation Set (C4-Eval), comprising 184 synthetic items and 37 human-created cross-concept chengyu figures collected from online sources. We manually construct and review cross-concept relations, bridge paths, and reasoning processes for the collected figures. Each C4-Eval item is instantiated in five task settings, yielding 884 primary answer-recovery cases. Across ten evaluated MLLMs, the strongest closed models reach 50.7% and 48.0% primary accuracy, while open-source models remain substantially lower. Candidate constraints improve accuracy sharply, but bridge hints and explanation requests provide only modest gains. These results expose a substantial gap in how current MLLMs decode creatively encoded meaning through cross-concept relations. The code is in the supplementary material.", "arxiv_id": "2608.06501", "arxiv_url": "https://arxiv.org/abs/2608.06501", "authors": ["Ming Wang", "Yuqing Zhang", "Tingna Xie", "Xiangju Li", "Xiaocui Yang", "Daling Wang", "Shi Feng", "Yifei Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa C4\uff0c\u4e00\u4e2a\u9762\u5411\u4e2d\u6587\u6210\u8bed\u8de8\u6982\u5ff5\u521b\u610f\u7406\u89e3\u7684\u8ba4\u77e5\u542f\u53d1\u5f0f\u8bc4\u6d4b\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4eba\u5de5\u6807\u6ce8\u7684\u8de8\u6982\u5ff5\u7f51\u7edc\u751f\u6210\u53ef\u63a7\u96be\u5ea6\u3001\u5177\u5907\u7cbe\u786e\u7b54\u6848\u7684\u56fe\u6587\u9898\u76ee\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u80fd\u5426\u89e3\u7801\u975e\u663e\u6027\u7684\u6982\u5ff5\u5173\u8054\u3002", "categories": ["cs.AI", "cs.CL", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06501", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa C4-Eval\uff0c\u5305\u542b184\u4e2a\u5408\u6210\u9898\u548c37\u4e2a\u6765\u81ea\u7f51\u7edc\u7684\u4eba\u7c7b\u521b\u4f5c\u6210\u8bed\u8de8\u6982\u5ff5\u56fe\u5f62\uff0c\u5e76\u6269\u5c55\u4e3a884\u4e2a\u4e3b\u8981\u7b54\u6848\u6062\u590d\u6d4b\u8bd5\u6848\u4f8b\u3002", "\u9898\u76ee\u751f\u6210\u57fa\u4e8e\u201c\u6865\u63a5\u8def\u5f84\u201d\u5c06\u6210\u8bed\u76ee\u6807\u69fd\u4f4d\u6620\u5c04\u5230\u53ef\u6210\u50cf\u66ff\u4ee3\u6982\u5ff5\uff0c\u96be\u5ea6\u7531\u6865\u6570\u91cf\u548c\u6df1\u5ea6\u63a7\u5236\u3002", "\u8bc4\u6d4b10\u4e2aMLLM\u540e\u53d1\u73b0\uff0c\u6700\u5f3a\u95ed\u6e90\u6a21\u578b\u4e3b\u4efb\u52a1\u51c6\u786e\u7387\u7ea650.7%\u548c48.0%\uff0c\u5f00\u6e90\u6a21\u578b\u663e\u8457\u66f4\u4f4e\uff1b\u5019\u9009\u7ea6\u675f\u5e2e\u52a9\u660e\u663e\uff0c\u800c\u6865\u63d0\u793a\u548c\u8981\u6c42\u89e3\u91ca\u63d0\u5347\u6709\u9650\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u521b\u610f\u7406\u89e3", "\u8bc4\u6d4b\u57fa\u51c6", "\u4e2d\u6587\u8bed\u4e49"], "num_comments": 2, "on_hf": true, "organization": "KinaMind", "pdf_url": "https://arxiv.org/pdf/2608.06501v1", "published_at": "2026-08-06", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06501.png", "title": "Can MLLMs Decode the Creative Leap? Introducing C4 for Cross-Concept Understanding", "tldr": "C4\u8bc4\u6d4b\u63ed\u793aMLLM\u8de8\u6982\u5ff5\u521b\u610f\u7406\u89e3\u77ed\u677f", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa C4\uff0c\u4e00\u4e2a\u9762\u5411\u4e2d\u6587\u6210\u8bed\u8de8\u6982\u5ff5\u521b\u610f\u7406\u89e3\u7684\u8ba4\u77e5\u542f\u53d1\u5f0f\u8bc4\u6d4b\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u4eba\u5de5\u6807\u6ce8\u7684\u8de8\u6982\u5ff5\u7f51\u7edc\u751f\u6210\u53ef\u63a7\u96be\u5ea6\u3001\u5177\u5907\u7cbe\u786e\u7b54\u6848\u7684\u56fe\u6587\u9898\u76ee\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u80fd\u5426\u89e3\u7801\u975e\u663e\u6027\u7684\u6982\u5ff5\u5173\u8054\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u521b\u610f\u7406\u89e3\u201d\u8f6c\u5316\u4e3a\u53ef\u7ed3\u6784\u5316\u3001\u53ef\u63a7\u96be\u5ea6\u3001\u53ef\u9a8c\u8bc1\u7b54\u6848\u7684\u8bc4\u6d4b\u4efb\u52a1\uff0c\u5f25\u8865\u4e86\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u975e\u51c6\u786e\u7387\u5bfc\u5411\u521b\u610f\u80fd\u529b\u8bc4\u4f30\u4e0a\u7684\u7a7a\u767d\uff0c\u5e76\u663e\u793a\u5f53\u524d\u6a21\u578b\u5bf9\u8de8\u6982\u5ff5\u9690\u55bb\u5f0f\u8868\u8fbe\u4ecd\u5b58\u5728\u660e\u663e\u80fd\u529b\u7f3a\u53e3\u3002"}, {"abstract": "Benchmarking video-language models has largely focused on short clips and single-sentence metrics, leaving open whether current systems can generate accurate long-form, paragraph-level descriptions. We introduce CLIP-CC-Bench, an evaluation suite for long-form video description built from 5 hours of movie content segmented into 90-second clips, each paired with an expert-written paragraph-style reference. The evaluation suite employs an ensemble of five state-of-the-art LLM-based embedding models to increase reliability and mitigate single-model bias, and applies two complementary methodologies: (i) coarse-grained semantic matching and (ii) fine-grained semantic matching to compare model-generated descriptions against CLIP-CC-Bench references. Using this framework, we evaluate 17 state-of-the-art video-language models and report both their Borda-aggregated rankings and their average scores on CLIP-CC-Bench. We further quantify the protocol\u0027s internal reliability through inter-judge agreement and bootstrap ranking stability. We release standardized evaluation scripts, model outputs, and aggregation tools at https://github.com/Multimodal-Intelligence-Lab/CLIP-CC-Bench to support reproducibility. CLIP-CC-Bench provides a practical evaluation framework for long-form video description, filling a gap left by existing short-clip and QA-only benchmarks.", "arxiv_id": "2608.04302", "arxiv_url": "https://arxiv.org/abs/2608.04302", "authors": ["Mukhtiar Ali", "Harsh Dubey", "Sugam Mishra", "Chulwoo Pack"], "brief": "\u8bba\u6587\u63d0\u51fa CLIP-CC-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u89c6\u9891\u8bed\u8a00\u6a21\u578b\u751f\u6210\u6bb5\u843d\u7ea7\u957f\u89c6\u9891\u63cf\u8ff0\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u57fa\u4e8e 5 \u5c0f\u65f6\u7535\u5f71\u5185\u5bb9\uff0c\u5207\u5206\u4e3a 90 \u79d2\u7247\u6bb5\uff0c\u5e76\u914d\u6709\u4e13\u5bb6\u64b0\u5199\u7684\u6bb5\u843d\u5f0f\u53c2\u8003\u63cf\u8ff0\u3002", "categories": ["cs.CV", "cs.IR", "cs.MM"], "github_repo": "https://github.com/Multimodal-Intelligence-Lab/CLIP-CC-Bench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.04302", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 5 \u4e2a\u5148\u8fdb LLM \u5d4c\u5165\u6a21\u578b\u7ec4\u6210\u8bc4\u6d4b\u96c6\u6210\uff0c\u964d\u4f4e\u5355\u4e00\u6a21\u578b\u8bc4\u5224\u504f\u5dee\u5e76\u63d0\u5347\u53ef\u9760\u6027", "\u540c\u65f6\u4f7f\u7528\u7c97\u7c92\u5ea6\u8bed\u4e49\u5339\u914d\u4e0e\u7ec6\u7c92\u5ea6\u8bed\u4e49\u5339\u914d\uff0c\u5bf9\u751f\u6210\u63cf\u8ff0\u548c\u53c2\u8003\u6bb5\u843d\u8fdb\u884c\u6bd4\u8f83", "\u8bc4\u6d4b 17 \u4e2a\u4e3b\u6d41\u89c6\u9891\u8bed\u8a00\u6a21\u578b\uff0c\u5e76\u62a5\u544a Borda \u805a\u5408\u6392\u540d\u3001\u5e73\u5747\u5206\u3001\u8bc4\u5ba1\u4e00\u81f4\u6027\u548c\u81ea\u52a9\u6cd5\u6392\u540d\u7a33\u5b9a\u6027"], "keywords": ["\u89c6\u9891\u8bed\u8a00\u6a21\u578b", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u89c6\u9891\u7406\u89e3"], "num_comments": 3, "on_hf": true, "organization": "MINT Lab", "pdf_url": "https://arxiv.org/pdf/2608.04302v1", "published_at": "2026-08-05", "score": 0.208, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04302.png", "title": "CLIP-CC-Bench: Evaluating Paragraph-Level Video Descriptions in Video-Language Models", "tldr": "\u9762\u5411\u957f\u89c6\u9891\u6bb5\u843d\u63cf\u8ff0\u7684\u65b0\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa CLIP-CC-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u89c6\u9891\u8bed\u8a00\u6a21\u578b\u751f\u6210\u6bb5\u843d\u7ea7\u957f\u89c6\u9891\u63cf\u8ff0\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u57fa\u4e8e 5 \u5c0f\u65f6\u7535\u5f71\u5185\u5bb9\uff0c\u5207\u5206\u4e3a 90 \u79d2\u7247\u6bb5\uff0c\u5e76\u914d\u6709\u4e13\u5bb6\u64b0\u5199\u7684\u6bb5\u843d\u5f0f\u53c2\u8003\u63cf\u8ff0\u3002", "why_notable": "\u73b0\u6709\u89c6\u9891\u8bed\u8a00\u8bc4\u6d4b\u591a\u805a\u7126\u77ed\u7247\u6bb5\u3001\u5355\u53e5\u63cf\u8ff0\u6216\u95ee\u7b54\u4efb\u52a1\uff0c\u8be5\u5de5\u4f5c\u8865\u4e0a\u4e86\u957f\u89c6\u9891\u6bb5\u843d\u7ea7\u63cf\u8ff0\u8bc4\u4f30\u7684\u7a7a\u7f3a\uff0c\u5e76\u5f00\u6e90\u811a\u672c\u3001\u6a21\u578b\u8f93\u51fa\u548c\u805a\u5408\u5de5\u5177\uff0c\u4fbf\u4e8e\u590d\u73b0\u548c\u540e\u7eed\u6bd4\u8f83\u3002"}, {"abstract": "Foundation models are used to extract transferable representations from large amounts of unlabeled data, typically via self-supervised learning (SSL). However, many of these models rely on architectures that offer limited interpretability, a critical issue in high-stakes domains such as medical imaging. We propose DualIFM, a foundation model that is interpretable-by-design via a BagNet backbone whose small receptive fields generate class evidence maps that are faithful to the model\u0027s decision-making process. Additionally, DualIFM incorporates a $2D$ projection layer during pretraining that enables direct visualization of the representation space, providing a dataset-level view of the learned structure including meaningful clinical clusters as well as potential spurious correlations. We trained DualIFM on over 800,000 color fundus photographs from various sources to learn generalizable representations for different downstream tasks. Our model achieves performance comparable to RETFound, which has $16\\times$ more parameters, while providing interpretable predictions on out-of-distribution data. These results suggest that large-scale SSL pretraining paired with inherent interpretability can lead to robust representations for retinal imaging. Code and pretrained models are available at github.com/berenslab/interpretable_FM.", "arxiv_id": "2603.18846", "arxiv_url": "https://arxiv.org/abs/2603.18846", "authors": ["Samuel Ofosu Mensah", "Camila Roa", "Kerol Djoumessi", "Philipp Berens"], "brief": "\u8bba\u6587\u63d0\u51fa DualIFM\uff0c\u4e00\u4e2a\u9762\u5411\u773c\u5e95\u5f69\u7167\u7684\u53ef\u89e3\u91ca\u57fa\u7840\u6a21\u578b\u3002\u5b83\u7528 BagNet \u5c0f\u611f\u53d7\u91ce\u9aa8\u5e72\u751f\u6210\u5fe0\u5b9e\u4e8e\u51b3\u7b56\u8fc7\u7a0b\u7684\u8bc1\u636e\u56fe\uff0c\u5e76\u5728\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\u4e2d\u52a0\u5165\u4e8c\u7ef4\u6295\u5f71\u4ee5\u53ef\u89c6\u5316\u8868\u5f81\u7a7a\u95f4\u3002", "categories": ["cs.CV", "cs.LG", "stat.CO"], "github_repo": "https://github.com/berenslab/interpretable_FM", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2603.18846", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u8d85\u8fc780\u4e07\u5f20\u591a\u6765\u6e90\u5f69\u8272\u773c\u5e95\u7167\u7247\u4e0a\u8fdb\u884c\u5927\u89c4\u6a21\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\uff0c\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u89c6\u7f51\u819c\u5f71\u50cf\u8868\u5f81", "BagNet \u67b6\u6784\u63d0\u4f9b\u9010\u7c7b\u8bc1\u636e\u56fe\uff0c\u4f7f\u5355\u5f20\u56fe\u50cf\u9884\u6d4b\u5177\u5907\u5185\u751f\u53ef\u89e3\u91ca\u6027\uff0c\u9002\u7528\u4e8e\u5206\u5e03\u5916\u6570\u636e\u5206\u6790", "\u4e8c\u7ef4\u6295\u5f71\u5c42\u53ef\u76f4\u63a5\u5c55\u793a\u6570\u636e\u96c6\u5c42\u9762\u7684\u8868\u5f81\u7ed3\u6784\uff0c\u5e2e\u52a9\u53d1\u73b0\u4e34\u5e8a\u805a\u7c7b\u4e0e\u6f5c\u5728\u4f2a\u76f8\u5173"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027", "\u57fa\u7840\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Eberhard Karls Universit\u00e4t T\u00fcbingen", "pdf_url": "https://arxiv.org/pdf/2603.18846v4", "published_at": "2026-03-19", "score": 0.206, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2603.18846.png", "title": "Towards Interpretable Foundation Models for Retinal Fundus Images", "tldr": "\u53ef\u89e3\u91ca\u89c6\u7f51\u819c\u57fa\u91d1\u6a21\u578b\u6027\u80fd\u63a5\u8fd1\u5927\u6a21\u578b", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa DualIFM\uff0c\u4e00\u4e2a\u9762\u5411\u773c\u5e95\u5f69\u7167\u7684\u53ef\u89e3\u91ca\u57fa\u7840\u6a21\u578b\u3002\u5b83\u7528 BagNet \u5c0f\u611f\u53d7\u91ce\u9aa8\u5e72\u751f\u6210\u5fe0\u5b9e\u4e8e\u51b3\u7b56\u8fc7\u7a0b\u7684\u8bc1\u636e\u56fe\uff0c\u5e76\u5728\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\u4e2d\u52a0\u5165\u4e8c\u7ef4\u6295\u5f71\u4ee5\u53ef\u89c6\u5316\u8868\u5f81\u7a7a\u95f4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u57fa\u7840\u6a21\u578b\u7684\u8fc1\u79fb\u80fd\u529b\u4e0e\u533b\u7597\u5f71\u50cf\u4e2d\u5173\u952e\u7684\u53ef\u89e3\u91ca\u6027\u7ed3\u5408\u8d77\u6765\uff0c\u5728\u53c2\u6570\u91cf\u4ec5\u4e3a RETFound \u7ea61/16\u7684\u60c5\u51b5\u4e0b\u53d6\u5f97\u76f8\u8fd1\u6027\u80fd\uff0c\u5e76\u5f00\u6e90\u4ee3\u7801\u4e0e\u9884\u8bad\u7ec3\u6a21\u578b\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) have demonstrated remarkable capabilities in emotional intelligence. However, prevailing research predominantly focuses on task-specific specialization, often neglecting inter-task synergy and leaving latent reasoning potential underexplored. To bridge this gap, we introduce OneEmo, a unified affective generalist capable of mastering emotion perception, comprehension, and interaction. For this purpose, we first construct EmoWorld-130K, a comprehensive dataset that distills specialized affective knowledge into explicit reasoning trajectories via a human-in-the-loop workflow. Supervised fine-tuning on this corpus reveals significant mutual benefits derived from multi-task learning. Second, to fully unlock the latent reasoning potential, we propose Emo-Chord, a novel reinforcement learning strategy that stabilizes optimization through unified multi-task reward allocation. Extensive experiments demonstrate that OneEmo achieves state-of-the-art performance against similarly sized baselines across most benchmarks. Notably, despite having significantly fewer parameters than commercial models, OneEmo delivers highly competitive results. This paper paves the way for more reliable and interpretable affective computing. The code is available at https://github.com/waHAHJIAHAO/OneEmo.", "arxiv_id": "2608.06013", "arxiv_url": "https://arxiv.org/abs/2608.06013", "authors": ["Jiahao Huang", "Zheng Lian", "Jingyi Zhang", "Zhide Chen", "Xiaojiang Peng", "Shaonan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa OneEmo\uff0c\u4e00\u4e2a\u9762\u5411\u60c5\u611f\u611f\u77e5\u3001\u7406\u89e3\u4e0e\u4ea4\u4e92\u7684\u7edf\u4e00\u591a\u6a21\u6001\u60c5\u611f\u901a\u7528\u6a21\u578b\u3002\u4f5c\u8005\u6784\u5efa EmoWorld-130K \u6570\u636e\u96c6\uff0c\u5e76\u7ed3\u5408\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u7b56\u7565\u63d0\u5347\u8de8\u4efb\u52a1\u60c5\u611f\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.HC"], "github_repo": "https://github.com/waHAHJIAHAO/OneEmo", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2608.06013", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa EmoWorld-130K\uff0c\u901a\u8fc7\u4eba\u7c7b\u53c2\u4e0e\u6d41\u7a0b\u5c06\u4e13\u95e8\u60c5\u611f\u77e5\u8bc6\u84b8\u998f\u4e3a\u663e\u5f0f\u63a8\u7406\u8f68\u8ff9\u3002", "\u591a\u4efb\u52a1\u76d1\u7763\u5fae\u8c03\u663e\u793a\u60c5\u611f\u611f\u77e5\u3001\u7406\u89e3\u548c\u4ea4\u4e92\u4efb\u52a1\u4e4b\u95f4\u5b58\u5728\u660e\u663e\u4e92\u8865\u589e\u76ca\u3002", "\u63d0\u51fa Emo-Chord \u5f3a\u5316\u5b66\u4e60\u7b56\u7565\uff0c\u901a\u8fc7\u7edf\u4e00\u7684\u591a\u4efb\u52a1\u5956\u52b1\u5206\u914d\u7a33\u5b9a\u4f18\u5316\uff0c\u5e76\u5728\u591a\u6570\u57fa\u51c6\u4e0a\u8fbe\u5230\u540c\u89c4\u6a21\u6a21\u578b\u6700\u4f73\u8868\u73b0\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u60c5\u611f\u8ba1\u7b97", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.06013v1", "published_at": "2026-08-06", "score": 0.202, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06013.png", "title": "OneEmo: A Unified Multimodal Reasoning Model for Emotion Perception, Understanding, and Interaction", "tldr": "\u7edf\u4e00\u591a\u6a21\u6001\u60c5\u611f\u63a8\u7406\u6a21\u578bOneEmo\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OneEmo\uff0c\u4e00\u4e2a\u9762\u5411\u60c5\u611f\u611f\u77e5\u3001\u7406\u89e3\u4e0e\u4ea4\u4e92\u7684\u7edf\u4e00\u591a\u6a21\u6001\u60c5\u611f\u901a\u7528\u6a21\u578b\u3002\u4f5c\u8005\u6784\u5efa EmoWorld-130K \u6570\u636e\u96c6\uff0c\u5e76\u7ed3\u5408\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u7b56\u7565\u63d0\u5347\u8de8\u4efb\u52a1\u60c5\u611f\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u4efb\u52a1\u4e13\u7528\u60c5\u611f\u6a21\u578b\u8d70\u5411\u7edf\u4e00\u60c5\u611f\u63a8\u7406\u6a21\u578b\uff0c\u5f3a\u8c03\u8de8\u4efb\u52a1\u534f\u540c\u4e0e\u53ef\u89e3\u91ca\u63a8\u7406\uff1b\u5728\u53c2\u6570\u91cf\u5c11\u4e8e\u5546\u4e1a\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\u4ecd\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7ed3\u679c\uff0c\u5bf9\u53ef\u9760\u60c5\u611f\u8ba1\u7b97\u548c\u591a\u6a21\u6001\u4eba\u673a\u4ea4\u4e92\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Predicting the answer to interventional ``what if\u0027\u0027 questions --- the outcome of an action never taken --- requires a \\emph{mechanistic}, causal model, not a curve fit; and learning such a model requires \\emph{experiments}, because passive data leaves its mechanisms unidentified. Experiments are expensive, so the central problem is \\emph{data efficiency}. We present the Model Discovery Agent (MDA), which couples a large language model (LLM), used as a \\emph{proposer} of candidate structures, with standard Bayesian machinery --- sequential Monte Carlo (SMC) for parameter and structure posteriors, simulation-based inference (SBI) for intractable likelihoods, and value-of-information (VoI) for experiment design --- to discover latent mechanistic world models from few interventions. MDA operates in the M-open setting: when the truth lies outside the current hypothesis class, a predictive check flags the inadequacy and the proposer expands the hypothesis space with a new model whose parameters are then identified by designed experiments. We show that \\emph{discovery and design reinforce}: the design step identifies the mechanism the discovery step proposes, and the identified mechanism improves predictions, enabling further discoveries from the remaining unexplained residuals. On three different benchmarks --- covering physics (\\DPbench, \\citep{wiemann2026discoverphysics}), chemistry (\\CHEMbench, \\citep{kabra2026autoscilab}) and biology (\\HHbench, a new partially observed single-neuron electrophysiology benchmark we create) --- we show that MDA sets a new SOTA in terms of data-efficient model learning and reliable interventional forecasting ability.", "arxiv_id": "2608.09696", "arxiv_url": "https://arxiv.org/abs/2608.09696", "authors": ["Kevin Murphy"], "brief": "\u8bba\u6587\u63d0\u51fa Model Discovery Agent\uff08MDA\uff09\uff0c\u7528 LLM \u63d0\u8bae\u5019\u9009\u673a\u5236\u7ed3\u6784\uff0c\u5e76\u7ed3\u5408 SMC\u3001SBI \u4e0e\u4ef7\u503c\u4fe1\u606f\u51c6\u5219\u8fdb\u884c\u8d1d\u53f6\u65af\u5b9e\u9a8c\u8bbe\u8ba1\u3002\u5b83\u80fd\u5728\u5c11\u91cf\u5e72\u9884\u5b9e\u9a8c\u4e2d\u53d1\u73b0\u53ef\u7528\u4e8e\u53cd\u4e8b\u5b9e\u9884\u6d4b\u7684\u6f5c\u5728\u56e0\u679c\u673a\u5236\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09696", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528 LLM \u4f5c\u4e3a\u6a21\u578b\u7ed3\u6784 proposer\uff0c\u8d1d\u53f6\u65af\u65b9\u6cd5\u8d1f\u8d23\u53c2\u6570/\u7ed3\u6784\u540e\u9a8c\u63a8\u65ad\u4e0e\u5b9e\u9a8c\u9009\u62e9", "\u652f\u6301 M-open \u573a\u666f\uff1a\u5f53\u5f53\u524d\u5047\u8bbe\u7c7b\u4e0d\u8db3\u65f6\uff0c\u901a\u8fc7\u9884\u6d4b\u68c0\u9a8c\u89e6\u53d1\u6269\u5c55\u65b0\u6a21\u578b\u7a7a\u95f4", "\u5728\u7269\u7406\u3001\u5316\u5b66\u548c\u65b0\u5efa\u5355\u795e\u7ecf\u5143\u7535\u751f\u7406\u57fa\u51c6\u4e0a\uff0c\u5b9e\u73b0\u66f4\u9ad8\u6570\u636e\u6548\u7387\u548c\u66f4\u53ef\u9760\u5e72\u9884\u9884\u6d4b"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u8d1d\u53f6\u65af\u63a8\u65ad", "\u79d1\u5b66\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09696v1", "published_at": "2026-08-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Model Discovery Agent: LLM-assisted Bayesian experiment design for data-efficient discovery of mechanistic world models", "tldr": "LLM\u7ed3\u5408\u8d1d\u53f6\u65af\u8bbe\u8ba1\u9ad8\u6548\u53d1\u73b0\u673a\u5236\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Model Discovery Agent\uff08MDA\uff09\uff0c\u7528 LLM \u63d0\u8bae\u5019\u9009\u673a\u5236\u7ed3\u6784\uff0c\u5e76\u7ed3\u5408 SMC\u3001SBI \u4e0e\u4ef7\u503c\u4fe1\u606f\u51c6\u5219\u8fdb\u884c\u8d1d\u53f6\u65af\u5b9e\u9a8c\u8bbe\u8ba1\u3002\u5b83\u80fd\u5728\u5c11\u91cf\u5e72\u9884\u5b9e\u9a8c\u4e2d\u53d1\u73b0\u53ef\u7528\u4e8e\u53cd\u4e8b\u5b9e\u9884\u6d4b\u7684\u6f5c\u5728\u56e0\u679c\u673a\u5236\u6a21\u578b\u3002", "why_notable": "\u5c06 LLM \u7684\u7ed3\u6784\u751f\u6210\u80fd\u529b\u4e0e\u4e25\u8c28\u7684\u8d1d\u53f6\u65af\u5b9e\u9a8c\u8bbe\u8ba1\u7ed3\u5408\uff0c\u9762\u5411\u79d1\u5b66\u53d1\u73b0\u4e2d\u6602\u8d35\u5e72\u9884\u6570\u636e\u7684\u6838\u5fc3\u74f6\u9888\uff0c\u5c55\u793a\u4e86\u667a\u80fd\u4f53\u8f85\u52a9\u53d1\u73b0\u673a\u5236\u4e16\u754c\u6a21\u578b\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Internal safety scores judge a prompt before any text is generated, and they are validated by how well they separate harmful prompts from benign ones. That separation is then read as evidence that the score will also catch the attacks that succeed. Harmful intent is a property of the prompt. Jailbreak success is an outcome produced later by a particular target model, decoding policy, and judge. A filter tuned on a score that measures the wrong quantity spends its false positive budget on attacks that would have failed anyway. In this paper we audit that inference. Attention based measurements are usually read from prompt dependent locations, so a wrapper changes both the content being judged and the place the signal is taken from. We therefore introduce Active Attention Probing, which supplies a fixed content independent measurement coordinate. We pair every base goal with a plain and a wrapped version and generate real completions from the target models. On Llama, wrapping raises harmful generation from 0.05 to 0.27 while harmful intent AUROC falls from 0.936 to 0.803, so the attacks grow more dangerous while the prompts look safer to the score. Among wrapped harmful prompts the outcome AUROC is 0.220, which places the attacks that succeeded below the attacks that failed. Rare token, passive, and detector derived channels reproduce the reversal on the same matched design, and the reversal itself persists across three target models, seven attack families, and two independent judges. Distribution shift then degrades calibration and threshold transfer before it degrades ranking.", "arxiv_id": "2608.09624", "arxiv_url": "https://arxiv.org/abs/2608.09624", "authors": ["Mingyu Luo", "Ming Deng", "Zilang Qiu", "Yiming Cheng", "Ci Tao", "Xue Tan", "Sijin Sun", "Yangfu Li", "Ping Chen", "Jun Dai", "Xiaoyan Sun"], "brief": "\u8bba\u6587\u5ba1\u8ba1\u4e86\u7528\u751f\u6210\u524d\u5185\u90e8\u5b89\u5168\u5206\u6570\u68c0\u6d4b\u8d8a\u72f1\u653b\u51fb\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u6307\u51fa\u5b83\u8861\u91cf\u7684\u662f\u63d0\u793a\u6709\u5bb3\u610f\u56fe\u800c\u975e\u5b9e\u9645\u8d8a\u72f1\u6210\u529f\u3002\u4f5c\u8005\u63d0\u51fa Active Attention Probing\uff0c\u7528\u56fa\u5b9a\u3001\u5185\u5bb9\u65e0\u5173\u7684\u6d4b\u91cf\u5750\u6807\u8bc4\u4f30\u5185\u90e8\u4fe1\u53f7\uff0c\u5e76\u5728\u591a\u6a21\u578b\u3001\u591a\u653b\u51fb\u65cf\u548c\u591a\u8bc4\u5ba1\u5668\u4e0a\u9a8c\u8bc1\u8fd9\u4e00\u5931\u914d\u3002", "categories": ["cs.CL", "cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09624", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728 Llama \u4e0a\uff0c\u5305\u88c5\u653b\u51fb\u4f7f\u6709\u5bb3\u751f\u6210\u7387\u4ece 0.05 \u5347\u81f3 0.27\uff0c\u4f46\u6709\u5bb3\u610f\u56fe AUROC \u4ece 0.936 \u964d\u81f3 0.803\uff0c\u653b\u51fb\u66f4\u5371\u9669\u5374\u663e\u5f97\u66f4\u5b89\u5168\u3002", "\u5728\u5305\u88c5\u540e\u7684\u6709\u5bb3\u63d0\u793a\u4e2d\uff0c\u7ed3\u679c\u9884\u6d4b AUROC \u4ec5\u4e3a 0.220\uff0c\u6210\u529f\u653b\u51fb\u53cd\u800c\u6392\u5728\u5931\u8d25\u653b\u51fb\u4e4b\u540e\u3002", "\u53cd\u5411\u6392\u5e8f\u73b0\u8c61\u5728\u7a00\u6709 token\u3001\u88ab\u52a8\u4fe1\u53f7\u3001\u68c0\u6d4b\u5668\u6d3e\u751f\u901a\u9053\u4e2d\u590d\u73b0\uff0c\u5e76\u8de8\u4e09\u79cd\u76ee\u6807\u6a21\u578b\u3001\u4e03\u7c7b\u653b\u51fb\u548c\u4e24\u4e2a\u72ec\u7acb\u8bc4\u5ba1\u5668\u4fdd\u6301\u7a33\u5b9a\u3002"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb", "\u5b89\u5168\u8bc4\u6d4b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09624v1", "published_at": "2026-08-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Measuring the Wrong Thing: Internal Harmfulness Scores Anti-Rank Successful Jailbreaks", "tldr": "\u5185\u90e8\u6709\u5bb3\u6027\u8bc4\u5206\u4f1a\u53cd\u5411\u4f4e\u4f30\u6210\u529f\u8d8a\u72f1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5ba1\u8ba1\u4e86\u7528\u751f\u6210\u524d\u5185\u90e8\u5b89\u5168\u5206\u6570\u68c0\u6d4b\u8d8a\u72f1\u653b\u51fb\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u6307\u51fa\u5b83\u8861\u91cf\u7684\u662f\u63d0\u793a\u6709\u5bb3\u610f\u56fe\u800c\u975e\u5b9e\u9645\u8d8a\u72f1\u6210\u529f\u3002\u4f5c\u8005\u63d0\u51fa Active Attention Probing\uff0c\u7528\u56fa\u5b9a\u3001\u5185\u5bb9\u65e0\u5173\u7684\u6d4b\u91cf\u5750\u6807\u8bc4\u4f30\u5185\u90e8\u4fe1\u53f7\uff0c\u5e76\u5728\u591a\u6a21\u578b\u3001\u591a\u653b\u51fb\u65cf\u548c\u591a\u8bc4\u5ba1\u5668\u4e0a\u9a8c\u8bc1\u8fd9\u4e00\u5931\u914d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u5f53\u524d\u7528\u5185\u90e8\u5b89\u5168\u5206\u6570\u8fc7\u6ee4\u8d8a\u72f1\u63d0\u793a\u7684\u6838\u5fc3\u524d\u63d0\uff0c\u8bf4\u660e\u9ad8\u533a\u5206\u6709\u5bb3/\u65e0\u5bb3\u63d0\u793a\u5e76\u4e0d\u7b49\u4e8e\u80fd\u62e6\u622a\u6210\u529f\u653b\u51fb\uff0c\u5bf9 LLM \u5b89\u5168\u8bc4\u6d4b\u3001\u6821\u51c6\u548c\u9632\u62a4\u9608\u503c\u8fc1\u79fb\u5177\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "Activation-based tools are usually tied to one model\u0027s native hidden space, requiring probes, sparse autoencoders, and natural-language interpreters to be rebuilt or rediscovered for each new language model. We present a Universal Activation Bus, a framework that provides a common activation interface across compatible language models. Using a small set of source models, we learn a shared dense space together with one lightweight linear encoder--decoder adapter pair per model. After source training, the interface is frozen; a new model joins by fitting only its adapter pair on unlabeled matched text. The resulting interface allows activation-based tools to be shared across connected models, including common probes and SAE features as well as access to an NLA originally trained for a different model. Across five models, semantically related texts form consistent neighborhoods in the shared space, and an onboarded model reuses these tools effectively without retraining them. We further show that an intermediate activation from one model can be used by another model\u0027s frozen upper layers to produce predictions. These results establish a stable, model-wise activation contract for reusable tools across compatible language models.", "arxiv_id": "2608.09521", "arxiv_url": "https://arxiv.org/abs/2608.09521", "authors": ["Su-Hyeon Kim", "Jiwan Mun", "Yo-Sub Han"], "brief": "\u8bba\u6587\u63d0\u51fa Universal Activation Bus\uff1a\u4e3a\u591a\u4e2a\u517c\u5bb9\u8bed\u8a00\u6a21\u578b\u5b66\u4e60\u4e00\u4e2a\u5171\u4eab\u7a20\u5bc6\u6fc0\u6d3b\u7a7a\u95f4\uff0c\u5e76\u4e3a\u6bcf\u4e2a\u6a21\u578b\u914d\u4e00\u4e2a\u8f7b\u91cf\u7ebf\u6027\u7f16\u7801\u5668\u2014\u89e3\u7801\u5668\u9002\u914d\u5668\u3002\u65b0\u6a21\u578b\u53ea\u9700\u5728\u672a\u6807\u6ce8\u5339\u914d\u6587\u672c\u4e0a\u62df\u5408\u81ea\u8eab\u9002\u914d\u5668\uff0c\u5c31\u80fd\u63a5\u5165\u51bb\u7ed3\u63a5\u53e3\u5e76\u590d\u7528\u63a2\u9488\u3001SAE \u7279\u5f81\u548c\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\u5668\u7b49\u5de5\u5177\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09521", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u4e2a\u6a21\u578b\u4ec5\u9700\u4e00\u4e2a\u7ebf\u6027 adapter pair\uff0c\u5c06\u539f\u751f\u9690\u85cf\u8868\u793a\u6620\u5c04\u5230\u5171\u4eab\u6fc0\u6d3b\u7a7a\u95f4\u5e76\u53ef\u89e3\u7801\u56de\u6a21\u578b\u7a7a\u95f4", "\u5728\u4e94\u4e2a\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff1a\u8bed\u4e49\u76f8\u5173\u6587\u672c\u5728\u5171\u4eab\u7a7a\u95f4\u4e2d\u5f62\u6210\u4e00\u81f4\u90bb\u57df\uff0c\u8de8\u6a21\u578b\u5de5\u5177\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u590d\u7528", "\u5c55\u793a\u4e00\u4e2a\u6a21\u578b\u7684\u4e2d\u95f4\u6fc0\u6d3b\u53ef\u88ab\u53e6\u4e00\u4e2a\u6a21\u578b\u51bb\u7ed3\u7684\u4e0a\u5c42\u7f51\u7edc\u4f7f\u7528\u5e76\u4ea7\u751f\u9884\u6d4b"], "keywords": ["\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u6fc0\u6d3b\u7a7a\u95f4", "\u8bed\u8a00\u6a21\u578b", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09521v1", "published_at": "2026-08-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "One Adapter Pair per Model: A Universal Activation Interface for Language Models", "tldr": "\u7528\u901a\u7528\u6fc0\u6d3b\u63a5\u53e3\u590d\u7528\u8de8\u6a21\u578b\u89e3\u91ca\u5de5\u5177", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Universal Activation Bus\uff1a\u4e3a\u591a\u4e2a\u517c\u5bb9\u8bed\u8a00\u6a21\u578b\u5b66\u4e60\u4e00\u4e2a\u5171\u4eab\u7a20\u5bc6\u6fc0\u6d3b\u7a7a\u95f4\uff0c\u5e76\u4e3a\u6bcf\u4e2a\u6a21\u578b\u914d\u4e00\u4e2a\u8f7b\u91cf\u7ebf\u6027\u7f16\u7801\u5668\u2014\u89e3\u7801\u5668\u9002\u914d\u5668\u3002\u65b0\u6a21\u578b\u53ea\u9700\u5728\u672a\u6807\u6ce8\u5339\u914d\u6587\u672c\u4e0a\u62df\u5408\u81ea\u8eab\u9002\u914d\u5668\uff0c\u5c31\u80fd\u63a5\u5165\u51bb\u7ed3\u63a5\u53e3\u5e76\u590d\u7528\u63a2\u9488\u3001SAE \u7279\u5f81\u548c\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\u5668\u7b49\u5de5\u5177\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bd5\u56fe\u89e3\u51b3\u53ef\u89e3\u91ca\u6027\u5de5\u5177\u4e0e\u5355\u4e00\u6a21\u578b\u9690\u85cf\u7a7a\u95f4\u5f3a\u7ed1\u5b9a\u7684\u95ee\u9898\uff0c\u4e3a\u8de8\u6a21\u578b\u5171\u4eab\u63a2\u9488\u3001SAE \u548c\u89e3\u91ca\u5668\u63d0\u4f9b\u7edf\u4e00\u201c\u6fc0\u6d3b\u5951\u7ea6\u201d\uff0c\u6709\u671b\u964d\u4f4e\u6a21\u578b\u5206\u6790\u4e0e\u8fc1\u79fb\u6210\u672c\u3002"}, {"abstract": "Large language model-powered coding agents are increasingly used to modify existing code repositories, for example, by adding features or fixing bugs. Yet existing repository-level benchmarks typically evaluate only whether the final patch passes tests. Satisfying a user request requires a long chain of interdependent reasoning and decisions: an agent must recover explicit and implicit requirements, formulate a repository-grounded implementation plan, and translate it into correct code. A pass/fail outcome cannot characterize how an unsuccessful trajectory diverges from the requirements and implementation process needed for a correct patch. To address this gap, we introduce SWE-RPG, a repository-level benchmark that combines executable patch evaluation with validated ground-truth references (GTs) for (1) Requirement Clarification and (2) Implementation Planning. These intermediate GTs support retrospective, GT-aligned diagnosis of complete coding-agent trajectories across clarification, planning, code generation, and artifact submission. SWE-RPG comprises 163 tasks from 31 Python and Java repositories, including 113 bug fixes and 50 feature additions. We evaluate 3 coding agents, including Claude Code, Codex, and OpenCode, with 6 large language model backends, including Claude-Sonnet-5 and GPT-5.6-Terra. Results show that the evaluated popular coding agents still struggle to implement user requests in existing repositories, achieving an average resolved rate of only 31.5% on SWE-RPG. Intermediate-GT diagnosis further identifies implicit requirement recovery as the main bottleneck, accounting for 24.5%--46.0% of agent runs. This result suggests implicit-requirement recovery as a key candidate direction for improving coding agents. The benchmark data and evaluation code are available at https://github.com/Xin-Zhou-smu/SWE-RPG-Bench.", "arxiv_id": "2608.09072", "arxiv_url": "https://arxiv.org/abs/2608.09072", "authors": ["Xin Zhou", "Chun Yong Chong", "Kisub Kim", "Yun Peng", "Rui Shu", "Zihan Wu", "Xu Han", "Guowen Yuan", "Zeyang Zhuang", "Jounghoon Kim", "Jeongjin Ju", "Seongmin Ju", "Taein Yoon", "David Lo"], "brief": "\u8bba\u6587\u63d0\u51faSWE-RPG\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4ee3\u7801\u4ed3\u5e93\u95ee\u9898\u4fee\u590d\u4e0e\u529f\u80fd\u6dfb\u52a0\u7684\u7edf\u4e00\u57fa\u51c6\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u6700\u7ec8\u8865\u4e01\u662f\u5426\u901a\u8fc7\u6d4b\u8bd5\uff0c\u8fd8\u63d0\u4f9b\u9700\u6c42\u6f84\u6e05\u548c\u5b9e\u73b0\u89c4\u5212\u7684\u4eba\u5de5\u9a8c\u8bc1\u6807\u51c6\u7b54\u6848\uff0c\u7528\u4e8e\u8bca\u65ad\u7f16\u7801\u667a\u80fd\u4f53\u5931\u8d25\u73af\u8282\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09072", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5305\u542b31\u4e2aPython\u548cJava\u4ed3\u5e93\u4e2d\u7684163\u4e2a\u4efb\u52a1\uff0c\u5176\u4e2d113\u4e2a\u7f3a\u9677\u4fee\u590d\u300150\u4e2a\u529f\u80fd\u6dfb\u52a0", "\u8bc4\u6d4bClaude Code\u3001Codex\u3001OpenCode\u7b493\u7c7b\u7f16\u7801\u667a\u80fd\u4f53\u53ca6\u79cd\u5927\u6a21\u578b\u540e\u7aef", "\u5e73\u5747\u89e3\u51b3\u7387\u4ec531.5%\uff0c\u9690\u5f0f\u9700\u6c42\u6062\u590d\u662f\u4e3b\u8981\u74f6\u9888\uff0c\u5360\u5931\u8d25\u8fd0\u884c\u768424.5%\u201346.0%"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09072v1", "published_at": "2026-08-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "A Unified Issue Resolution Benchmark for Requirement Clarification, Planning, and Code Generation for Coding Agents", "tldr": "SWE-RPG\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\u9700\u6c42\u6f84\u6e05\u3001\u89c4\u5212\u4e0e\u4fee\u590d\u5168\u6d41\u7a0b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faSWE-RPG\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4ee3\u7801\u4ed3\u5e93\u95ee\u9898\u4fee\u590d\u4e0e\u529f\u80fd\u6dfb\u52a0\u7684\u7edf\u4e00\u57fa\u51c6\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u6700\u7ec8\u8865\u4e01\u662f\u5426\u901a\u8fc7\u6d4b\u8bd5\uff0c\u8fd8\u63d0\u4f9b\u9700\u6c42\u6f84\u6e05\u548c\u5b9e\u73b0\u89c4\u5212\u7684\u4eba\u5de5\u9a8c\u8bc1\u6807\u51c6\u7b54\u6848\uff0c\u7528\u4e8e\u8bca\u65ad\u7f16\u7801\u667a\u80fd\u4f53\u5931\u8d25\u73af\u8282\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u770b\u6700\u7ec8\u6d4b\u8bd5\u901a\u8fc7\u7387\u7684SWE\u7c7b\u57fa\u51c6\uff0cSWE-RPG\u80fd\u5b9a\u4f4d\u9700\u6c42\u7406\u89e3\u3001\u5b9e\u73b0\u89c4\u5212\u3001\u4ee3\u7801\u751f\u6210\u7b49\u4e2d\u95f4\u73af\u8282\u95ee\u9898\uff0c\u4e3a\u6539\u8fdb\u7f16\u7801\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u8bca\u65ad\u4f9d\u636e\u3002"}, {"abstract": "A main promise of looped language models (LMs) is depth-adaptive inference. By iterating a block of shared layers a variable number of times, the model can use less compute for \"easy\" tokens and more for \"hard\" ones. However, this adaptivity breaks standard batching: tokens in the same batch now require a different number of loops, so there is no unified forward pass, making efficient inference difficult. Standard inference frameworks like vLLM schedule on the token level and cannot handle this because tokens need to be removed from the batch within the forward pass. Loop-level scheduling has been proposed as a solution, but never implemented end to end. The key challenge is that looped architectures also contain non-looped boundary stages (e.g., token embedding and LM head) that must be scheduled at different frequencies than the loop. We introduce continuous depth batching (CDB), which schedules at the granularity of individual loop iterations. CDB handles boundary stages and loop steps in separate priority queues, makes exit decisions one step ahead, and overlaps all scheduling work with GPU computation. On Ouro 1.4B and Huginn 3.5B, CDB can realize up to $99\\%$ of the theoretical maximum speed-up from adaptive-depth, translating to $1.5$-$1.9\\times$ higher offline throughput and $45$-$90\\%$ lower normalized latency under dynamic serving load.", "arxiv_id": "2608.09444", "arxiv_url": "https://arxiv.org/abs/2608.09444", "authors": ["Kristian Schwethelm", "Daniel Rueckert", "Georgios Kaissis"], "brief": "\u8bba\u6587\u63d0\u51fa continuous depth batching\uff08CDB\uff09\uff0c\u9762\u5411\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u65f6\u4e0d\u540c token \u9700\u8981\u4e0d\u540c\u5faa\u73af\u6df1\u5ea6\u7684\u95ee\u9898\uff0c\u5b9e\u73b0\u6309\u5355\u6b21\u5faa\u73af\u8fed\u4ee3\u7c92\u5ea6\u7684\u9ad8\u6548\u8c03\u5ea6\u3002\u5b83\u5c06\u8fb9\u754c\u9636\u6bb5\u4e0e\u5faa\u73af\u6b65\u9aa4\u5206\u5f00\u6392\u961f\uff0c\u5e76\u63d0\u524d\u505a\u9000\u51fa\u51b3\u7b56\uff0c\u4ece\u800c\u5728\u7aef\u5230\u7aef\u7cfb\u7edf\u4e2d\u652f\u6301\u6df1\u5ea6\u81ea\u9002\u5e94\u6279\u5904\u7406\u3002", "categories": ["cs.LG", "cs.CL", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09444", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u4e2d\u201c\u6613 token \u5c11\u7b97\u3001\u96be token \u591a\u7b97\u201d\u5bfc\u81f4\u6807\u51c6\u6279\u5904\u7406\u5931\u6548\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u6309\u5faa\u73af\u8fed\u4ee3\u800c\u975e token \u6216\u6574\u5c42\u5faa\u73af\u8c03\u5ea6\u3002", "CDB \u4f7f\u7528\u72ec\u7acb\u4f18\u5148\u961f\u5217\u8c03\u5ea6\u975e\u5faa\u73af\u8fb9\u754c\u9636\u6bb5\uff08\u5982 embedding\u3001LM head\uff09\u4e0e\u5faa\u73af\u6b65\u9aa4\uff0c\u5e76\u5c06\u8c03\u5ea6\u5f00\u9500\u4e0e GPU \u8ba1\u7b97\u91cd\u53e0\u3002", "\u5728 Ouro 1.4B \u548c Huginn 3.5B \u4e0a\uff0c\u53ef\u5b9e\u73b0\u6700\u9ad8 99% \u7684\u7406\u8bba\u81ea\u9002\u5e94\u52a0\u901f\uff0c\u79bb\u7ebf\u541e\u5410\u63d0\u5347 1.5-1.9 \u500d\uff0c\u52a8\u6001\u670d\u52a1\u5f52\u4e00\u5316\u5ef6\u8fdf\u964d\u4f4e 45%-90%\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u52a8\u6001\u8ba1\u7b97", "\u7cfb\u7edf\u8c03\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09444v1", "published_at": "2026-08-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Depth-adaptive Inference of Looped Language Models via Continuous Depth Batching", "tldr": "CDB\u8ba9\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u9ad8\u6548\u6df1\u5ea6\u81ea\u9002\u5e94\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa continuous depth batching\uff08CDB\uff09\uff0c\u9762\u5411\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u65f6\u4e0d\u540c token \u9700\u8981\u4e0d\u540c\u5faa\u73af\u6df1\u5ea6\u7684\u95ee\u9898\uff0c\u5b9e\u73b0\u6309\u5355\u6b21\u5faa\u73af\u8fed\u4ee3\u7c92\u5ea6\u7684\u9ad8\u6548\u8c03\u5ea6\u3002\u5b83\u5c06\u8fb9\u754c\u9636\u6bb5\u4e0e\u5faa\u73af\u6b65\u9aa4\u5206\u5f00\u6392\u961f\uff0c\u5e76\u63d0\u524d\u505a\u9000\u51fa\u51b3\u7b56\uff0c\u4ece\u800c\u5728\u7aef\u5230\u7aef\u7cfb\u7edf\u4e2d\u652f\u6301\u6df1\u5ea6\u81ea\u9002\u5e94\u6279\u5904\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u9f50\u4e86\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u6df1\u5ea6\u81ea\u9002\u5e94\u63a8\u7406\u4ece\u7b97\u6cd5\u627f\u8bfa\u5230\u7cfb\u7edf\u843d\u5730\u7684\u5173\u952e\u7f3a\u53e3\uff0c\u5c55\u793a\u4e86\u5728\u771f\u5b9e\u670d\u52a1\u8d1f\u8f7d\u4e0b\u63a5\u8fd1\u7406\u8bba\u4e0a\u9650\u7684\u52a0\u901f\u6f5c\u529b\uff0c\u5bf9\u9ad8\u6548\u5927\u6a21\u578b\u63a8\u7406\u6846\u67b6\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Query-Key Normalization (QK-Norm) improves the training stability and quality of modern Large Language Models (LLMs). However, under Tensor Parallelism (TP), layerwise QK-Norm introduces additional cross-GPU communication because the normalization factor depends on the full hidden vector. We present SwiftQK, a multi-GPU RMSNorm kernel that exchanges only scalar normalization statistics and overlaps the remaining Peer-to-Peer reduction with independent element-wise computation in a deadlock-safe persistent kernel. Evaluations on recent LLMs show that SwiftQK reduces QK-Norm latency by 81.4--93.9% relative to the standard TP QK-Norm using full-vector All-Gather. In end-to-end serving, SwiftQK reduces TPOT on average by 29.5% over the All-Gather-based baseline and by 14.3% over an optimized scalar-aggregation implementation.", "arxiv_id": "2608.09160", "arxiv_url": "https://arxiv.org/abs/2608.09160", "authors": ["Gyudong Kim", "Wonjun Han", "Young Geun Kim"], "brief": "\u672c\u6587\u63d0\u51fa SwiftQK\uff0c\u4e00\u4e2a\u9762\u5411\u591a GPU \u5f20\u91cf\u5e76\u884c\u7684 QK-Norm/RMSNorm \u9ad8\u6548\u5185\u6838\u3002\u5b83\u4ec5\u4ea4\u6362\u6807\u91cf\u5f52\u4e00\u5316\u7edf\u8ba1\u91cf\uff0c\u5e76\u901a\u8fc7\u6301\u4e45\u5316\u5185\u6838\u5c06\u70b9\u5bf9\u70b9\u89c4\u7ea6\u4e0e\u72ec\u7acb\u9010\u5143\u7d20\u8ba1\u7b97\u91cd\u53e0\u6267\u884c\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09160", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9 QK-Norm \u5728\u5f20\u91cf\u5e76\u884c\u4e2d\u56e0\u4f9d\u8d56\u5b8c\u6574\u9690\u85cf\u5411\u91cf\u800c\u4ea7\u751f\u989d\u5916\u8de8 GPU \u901a\u4fe1\u7684\u95ee\u9898\uff0c\u907f\u514d\u4f20\u7edf\u5168\u5411\u91cf All-Gather\u3002", "\u4ec5\u4f20\u8f93\u6807\u91cf\u5f52\u4e00\u5316\u7edf\u8ba1\u4fe1\u606f\uff0c\u5e76\u91c7\u7528\u6b7b\u9501\u5b89\u5168\u7684 persistent kernel \u91cd\u53e0\u901a\u4fe1\u4e0e\u8ba1\u7b97\u3002", "\u5728\u8fd1\u671f LLM \u4e0a\uff0cQK-Norm \u5ef6\u8fdf\u8f83\u6807\u51c6 TP All-Gather \u65b9\u6848\u964d\u4f4e 81.4%\u201393.9%\uff0c\u7aef\u5230\u7aef\u670d\u52a1 TPOT \u5e73\u5747\u964d\u4f4e 29.5%\u3002"], "keywords": ["\u5927\u6a21\u578b", "\u5f20\u91cf\u5e76\u884c", "\u7cfb\u7edf\u4f18\u5316", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09160v1", "published_at": "2026-08-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SwiftQK: Fast and Communication-Efficient Tensor Parallelism for Query-Key Normalization", "tldr": "SwiftQK\u663e\u8457\u964d\u4f4eTP\u4e0bQK-Norm\u901a\u4fe1\u5f00\u9500", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa SwiftQK\uff0c\u4e00\u4e2a\u9762\u5411\u591a GPU \u5f20\u91cf\u5e76\u884c\u7684 QK-Norm/RMSNorm \u9ad8\u6548\u5185\u6838\u3002\u5b83\u4ec5\u4ea4\u6362\u6807\u91cf\u5f52\u4e00\u5316\u7edf\u8ba1\u91cf\uff0c\u5e76\u901a\u8fc7\u6301\u4e45\u5316\u5185\u6838\u5c06\u70b9\u5bf9\u70b9\u89c4\u7ea6\u4e0e\u72ec\u7acb\u9010\u5143\u7d20\u8ba1\u7b97\u91cd\u53e0\u6267\u884c\u3002", "why_notable": "QK-Norm \u6b63\u5728\u88ab\u73b0\u4ee3 LLM \u7528\u4e8e\u63d0\u5347\u8bad\u7ec3\u7a33\u5b9a\u6027\u548c\u6a21\u578b\u8d28\u91cf\uff0c\u4f46\u5176\u5e76\u884c\u901a\u4fe1\u5f00\u9500\u4f1a\u5f71\u54cd\u63a8\u7406\u4e0e\u670d\u52a1\u6548\u7387\u3002SwiftQK \u901a\u8fc7\u5e95\u5c42\u901a\u4fe1\u4e0e\u5185\u6838\u4f18\u5316\u663e\u8457\u51cf\u5c11\u5ef6\u8fdf\uff0c\u5bf9\u5927\u6a21\u578b\u5f20\u91cf\u5e76\u884c\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-language-action (VLA) models are a widely adopted paradigm for embodied policies. They excel at efficient closed-loop control but do not explicitly model how physical scenes evolve as a task unfolds. Recently emerging world-action models (WAMs) leverage pretrained video world models to capture spatiotemporal evolution, yet retaining future generation or a large video backbone in the control loop substantially increases inference cost. We introduce World Tokens, an embodied policy architecture built around a World Adapter that bridges visual-language understanding, world-dynamics modeling, and action generation. It uses world modeling during training to enhance the action policy while preserving efficient deployment. Specifically, the World Adapter transforms VLM features into a fixed set of world tokens, which condition a jointly fine-tuned future-video denoiser and simultaneously serve as the action expert\u0027s sole visual-language context. This shared conditioning allows gradients from future-video denoising to directly shape the representation used for action prediction, while exclusive routing prevents the policy from bypassing that representation. At deployment, the world-model branch is removed, leaving only the VLM, World Adapter, and action expert, with no online video-model inference. With a 2B backbone and no embodied action pretraining, World Tokens is highly competitive on LIBERO, attains the best reported averages on SIMPLER, substantially improves real-world R1 Pro success over a matched action-only baseline, and generates each action chunk at VLA-level latency.", "arxiv_id": "2608.09730", "arxiv_url": "https://arxiv.org/abs/2608.09730", "authors": ["Qu Tang", "Benhui Zhuang", "Bo Yuan", "Xue Yu", "Longteng Guo", "Junlan Feng"], "brief": "\u8bba\u6587\u63d0\u51fa World Tokens \u67b6\u6784\uff0c\u901a\u8fc7 World Adapter \u5c06 VLM \u7279\u5f81\u8f6c\u4e3a\u56fa\u5b9a\u4e16\u754c\u4ee4\u724c\uff0c\u5728\u8bad\u7ec3\u65f6\u540c\u65f6\u7528\u4e8e\u672a\u6765\u89c6\u9891\u53bb\u566a\u548c\u52a8\u4f5c\u9884\u6d4b\u3002\u90e8\u7f72\u65f6\u79fb\u9664\u4e16\u754c\u6a21\u578b\u5206\u652f\uff0c\u4fdd\u7559\u63a5\u8fd1 VLA \u7684\u4f4e\u5ef6\u8fdf\u63a7\u5236\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09730", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bad\u7ec3\u9636\u6bb5\u5f15\u5165\u672a\u6765\u89c6\u9891\u53bb\u566a\u4efb\u52a1\uff0c\u8ba9\u4e16\u754c\u52a8\u529b\u5b66\u5efa\u6a21\u7684\u68af\u5ea6\u76f4\u63a5\u5851\u9020\u52a8\u4f5c\u7b56\u7565\u6240\u7528\u8868\u5f81", "\u52a8\u4f5c\u4e13\u5bb6\u53ea\u80fd\u8bbf\u95ee World Adapter \u4ea7\u751f\u7684\u4e16\u754c\u4ee4\u724c\uff0c\u907f\u514d\u7ed5\u8fc7\u4e16\u754c\u8868\u5f81\u5b66\u4e60", "\u5728 LIBERO\u3001SIMPLER \u548c\u771f\u5b9e R1 Pro \u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u6216\u5339\u914d\u5f3a\u57fa\u7ebf\uff0c\u4e14\u65e0\u9700\u5728\u7ebf\u89c6\u9891\u751f\u6210\u63a8\u7406"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09730v1", "published_at": "2026-08-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "World Tokens: Enhancing Embodied Policies with Training-Time World Modeling", "tldr": "\u7528\u8bad\u7ec3\u671f\u4e16\u754c\u5efa\u6a21\u589e\u5f3a\u9ad8\u6548\u5177\u8eab\u7b56\u7565", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa World Tokens \u67b6\u6784\uff0c\u901a\u8fc7 World Adapter \u5c06 VLM \u7279\u5f81\u8f6c\u4e3a\u56fa\u5b9a\u4e16\u754c\u4ee4\u724c\uff0c\u5728\u8bad\u7ec3\u65f6\u540c\u65f6\u7528\u4e8e\u672a\u6765\u89c6\u9891\u53bb\u566a\u548c\u52a8\u4f5c\u9884\u6d4b\u3002\u90e8\u7f72\u65f6\u79fb\u9664\u4e16\u754c\u6a21\u578b\u5206\u652f\uff0c\u4fdd\u7559\u63a5\u8fd1 VLA \u7684\u4f4e\u5ef6\u8fdf\u63a7\u5236\u3002", "why_notable": "\u5b83\u517c\u987e\u4e86\u4e16\u754c\u6a21\u578b\u7684\u65f6\u7a7a\u9884\u6d4b\u80fd\u529b\u4e0e VLA \u7684\u63a8\u7406\u6548\u7387\uff0c\u4e3a\u5177\u8eab\u63a7\u5236\u63d0\u4f9b\u4e86\u4e00\u79cd\u201c\u8bad\u7ec3\u65f6\u5b66\u4e16\u754c\u3001\u90e8\u7f72\u65f6\u4e0d\u80cc\u8d1f\u4e16\u754c\u6a21\u578b\u201d\u7684\u5b9e\u7528\u8def\u7ebf\u3002"}, {"abstract": "Training a language model suite classically requires training each model separately and serving them independently. We improve both training and inference efficiency by stacking sub-models of increasing size into a single nested architecture trained end-to-end. This Matryoshka training framework reduces the total parameter count of the suite, enables low-cost distillation from the largest to all smaller sub-models at every training step, and is well-suited for speculative decoding as the draft model is contained within the verifier. We validate our approach by training a Matryoshka suite comprising 500M, 1.5B, and 3B sub-models. Our suite is on par with independently trained baselines on benchmark performance and validation and out-of-domain perplexities, while using 36% less training compute and improving the throughput of speculative decoding by 14-26%. We also ablate key architectural choices, offering guidance for building strong Matryoshka LM suites.", "arxiv_id": "2608.09703", "arxiv_url": "https://arxiv.org/abs/2608.09703", "authors": ["Nathan Godey", "Yoav Artzi"], "brief": "\u8bba\u6587\u63d0\u51fa Matryoshka \u8bed\u8a00\u6a21\u578b\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u4e0d\u540c\u89c4\u6a21\u5b50\u6a21\u578b\u5d4c\u5957\u5728\u540c\u4e00\u67b6\u6784\u4e2d\u7aef\u5230\u7aef\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u8ba9\u5c0f\u6a21\u578b\u5171\u4eab\u5927\u6a21\u578b\u7ed3\u6784\uff0c\u5e76\u5728\u8bad\u7ec3\u8fc7\u7a0b\u4e2d\u6301\u7eed\u4ece\u6700\u5927\u5b50\u6a21\u578b\u4f4e\u6210\u672c\u84b8\u998f\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09703", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u4e86\u5305\u542b 500M\u30011.5B\u30013B \u5b50\u6a21\u578b\u7684\u5d4c\u5957\u5f0f\u8bed\u8a00\u6a21\u578b\u5957\u4ef6\uff0c\u65e0\u9700\u5206\u522b\u8bad\u7ec3\u548c\u90e8\u7f72\u591a\u4e2a\u72ec\u7acb\u6a21\u578b", "\u76f8\u6bd4\u72ec\u7acb\u8bad\u7ec3\u57fa\u7ebf\uff0c\u5728\u57fa\u51c6\u6027\u80fd\u3001\u9a8c\u8bc1\u96c6\u56f0\u60d1\u5ea6\u548c\u57df\u5916\u56f0\u60d1\u5ea6\u4e0a\u57fa\u672c\u6301\u5e73\uff0c\u540c\u65f6\u51cf\u5c11 36% \u8bad\u7ec3\u8ba1\u7b97\u91cf", "\u5929\u7136\u9002\u914d speculative decoding\uff0c\u56e0\u4e3a\u8349\u7a3f\u6a21\u578b\u5305\u542b\u5728\u9a8c\u8bc1\u6a21\u578b\u5185\u90e8\uff0c\u63a8\u7406\u541e\u5410\u63d0\u5347 14%-26%"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u52a0\u901f", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09703v1", "published_at": "2026-08-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Matryoshka Language Model Suites", "tldr": "\u5957\u5a03\u5f0f\u8bed\u8a00\u6a21\u578b\u5957\u4ef6\u964d\u4f4e\u8bad\u7ec3\u4e0e\u63a8\u7406\u6210\u672c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Matryoshka \u8bed\u8a00\u6a21\u578b\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u4e0d\u540c\u89c4\u6a21\u5b50\u6a21\u578b\u5d4c\u5957\u5728\u540c\u4e00\u67b6\u6784\u4e2d\u7aef\u5230\u7aef\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u8ba9\u5c0f\u6a21\u578b\u5171\u4eab\u5927\u6a21\u578b\u7ed3\u6784\uff0c\u5e76\u5728\u8bad\u7ec3\u8fc7\u7a0b\u4e2d\u6301\u7eed\u4ece\u6700\u5927\u5b50\u6a21\u578b\u4f4e\u6210\u672c\u84b8\u998f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u89c4\u6a21\u6a21\u578b\u5957\u4ef6\u7684\u8bad\u7ec3\u3001\u84b8\u998f\u548c\u63a8\u7406\u52a0\u901f\u7edf\u4e00\u5230\u4e00\u4e2a\u5d4c\u5957\u67b6\u6784\u4e2d\uff0c\u517c\u987e\u6027\u80fd\u4e0e\u6548\u7387\uff0c\u5bf9\u9700\u8981\u6309\u6210\u672c\u52a8\u6001\u9009\u62e9\u6a21\u578b\u89c4\u6a21\u7684\u5b9e\u9645\u90e8\u7f72\u573a\u666f\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "Large language models can write parametric CAD programs from a natural-language description (text-to-CAD generation), but a single sample is often wrong. Increasing test-time compute by sampling multiple candidates only helps if a good candidate can be identified, yet no ground-truth model is available at generation time. Existing systems often require a separate verifier, such as a vision-language judge, to select among candidates. We investigate whether the candidate pool itself provides enough signal for effective selection and a verifier-free alternative. We intr
