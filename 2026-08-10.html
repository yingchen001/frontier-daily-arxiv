\u540c\u6e38\u620f\u548c\u89d2\u8272\u4e0a\u8868\u73b0\u4e0d\u5747\uff0c\u5e76\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 SPaRTan \u81ea\u535a\u5f08\u53cd\u601d\u673a\u5236\uff0c\u53ef\u6539\u5584 GPT-5-mini \u7684\u5f31\u52bf\u89d2\u8272\u8868\u73b0\uff0c\u4f46\u5bf9 Qwen3-32B \u63d0\u5347\u6709\u9650\u3002", "categories": ["cs.CL", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09128", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u793e\u4f1a\u63a8\u7406", "\u81ea\u535a\u5f08"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09128v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Social Gym and SPaRTan: Benchmarking and Improving LLM Social Reasoning via Multi-Agent Game Tournaments", "tldr": "\u8bba\u6587\u63d0\u51fa Social Gym\uff0c\u4e00\u4e2a\u5305\u542b 21 \u4e2a\u591a\u667a\u80fd\u4f53\u793e\u4ea4\u6e38\u620f\u7684\u5ba2\u89c2\u8bc4\u6d4b\u73af\u5883\uff0c\u901a\u8fc7\u89c4\u5219\u5224\u5b9a\u80dc\u8d1f\u548c Elo \u9526\u6807\u8d5b\u8861\u91cf\u5927\u6a21\u578b\u7684\u5408\u4f5c\u3001\u8c08\u5224\u4e0e\u9002\u5e94\u80fd\u529b\u3002\u5b9e\u9a8c\u53d1\u73b0 GPT-5-mini \u603b\u4f53\u9886\u5148\u4f46\u5404\u6a21\u578b\u5728\u4e0d\u540c\u6e38\u620f\u548c\u89d2\u8272\u4e0a\u8868\u73b0\u4e0d\u5747\uff0c\u5e76\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 SPaRTan \u81ea\u535a\u5f08\u53cd\u601d\u673a\u5236\uff0c\u53ef\u6539\u5584 GPT-5-mini \u7684\u5f31\u52bf\u89d2\u8272\u8868\u73b0\uff0c\u4f46\u5bf9 Qwen3-32B \u63d0\u5347\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-evolving methods improve the capabilities of LLM agents by sampling trajectories from the underlying LLMs and learning from these trajectories. However, these methods struggle to learn beyond the inherent capability boundary of the agents, since the agents cannot sample correct trajectories on difficult examples for further improvements. In this paper, we propose a zeroth-order self-evolution framework that enables agents to learn beyond their capability boundary by perturbing LLM parameters to adapt to difficult examples without any trajectory annotations. Specifically, we perturb LoRA parameters of LLMs, run the agent, compute the losses under the perturbed and original parameters, and use the loss difference to estimate gradients and further update the LoRA parameters. We sample trajectories using the updated LLMs for supervised fine-tuning to break through the capability boundary of the agents, forming a closed self-evolution loop. We introduce a parallel perturbation inference mechanism and an adaptive lookup mechanism to reduce time consumption in zeroth-order optimization, with an answer perplexity loss that provides smooth and stable zeroth-order loss values. Experiments on multiple deep research benchmarks show that our method obtains substantially more successful trajectories and consistently outperforms strong baselines, especially on difficult examples. The code and released artifacts are available at https://github.com/hidk1911/ZOForLLMAgents.", "arxiv_id": "2608.09292", "arxiv_url": "https://arxiv.org/abs/2608.09292", "authors": ["Bingzhen Liu", "Xiaomeng Fan", "Yuwei Wu", "Zhi Gao", "Mingyang Gao", "Chuanhao Li", "Yunde Jia"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u81ea\u8fdb\u5316\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u96f6\u9636\u4f18\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u6270\u52a8 LoRA \u53c2\u6570\u5e76\u5229\u7528\u635f\u5931\u5dee\u4f30\u8ba1\u68af\u5ea6\uff0c\u4f7f\u667a\u80fd\u4f53\u5728\u65e0\u8f68\u8ff9\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u9002\u5e94\u56f0\u96be\u6837\u672c\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u66f4\u65b0\u540e\u6a21\u578b\u91c7\u6837\u8f68\u8ff9\u518d\u8fdb\u884c\u76d1\u7763\u5fae\u8c03\uff0c\u5f62\u6210\u95ed\u73af\u81ea\u8fdb\u5316\uff0c\u5728\u591a\u4e2a\u6df1\u5ea6\u7814\u7a76\u57fa\u51c6\u4e0a\u663e\u8457\u589e\u52a0\u6210\u529f\u8f68\u8ff9\u5e76\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u56f0\u96be\u6837\u672c\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09292", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u96f6\u9636\u4f18\u5316", "\u81ea\u8fdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09292v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond the Capability Boundary: Zeroth-Order Optimization for Self-Evolving LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u81ea\u8fdb\u5316\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u96f6\u9636\u4f18\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u6270\u52a8 LoRA \u53c2\u6570\u5e76\u5229\u7528\u635f\u5931\u5dee\u4f30\u8ba1\u68af\u5ea6\uff0c\u4f7f\u667a\u80fd\u4f53\u5728\u65e0\u8f68\u8ff9\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u9002\u5e94\u56f0\u96be\u6837\u672c\u3002\u8be5\u65b9\u6cd5\u7ed3\u5408\u66f4\u65b0\u540e\u6a21\u578b\u91c7\u6837\u8f68\u8ff9\u518d\u8fdb\u884c\u76d1\u7763\u5fae\u8c03\uff0c\u5f62\u6210\u95ed\u73af\u81ea\u8fdb\u5316\uff0c\u5728\u591a\u4e2a\u6df1\u5ea6\u7814\u7a76\u57fa\u51c6\u4e0a\u663e\u8457\u589e\u52a0\u6210\u529f\u8f68\u8ff9\u5e76\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u56f0\u96be\u6837\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Offline context optimization improves an agent by revising its instructions and examples while keeping the model frozen. This approach learns from rollouts on an adaptation set, but some queries produce only failed rollouts. In these cases, the optimizer sees no successful example of how the available tools can reach the correct answer. We introduce MemeMind, which uses an offline reference answer to recover this missing experience. TraceBuilder identifies the evidence required by the reference, executes text search, image retrieval, and visual grounding, and verifies the resulting tool trace before adding it to the adaptation buffer. ToolGuide then summarizes the collected traces into a shared guide and separate instructions for each tool. The reference answers and constructed traces are used only during adaptation, while inference uses the learned guides with a frozen model. We study this problem through Anime, Comic, and Game meme interpretation. These memes combine edited and ambiguous visual content, overlaid text, long tail franchise knowledge, and culture specific references. Their interpretation can require coordinated visual grounding, image retrieval, and text search, making them a demanding setting in which native rollout groups may fail together. We evaluate MemeMind on MemeX, a benchmark of 1,000 such memes annotated by experts. Across two Qwen3-VL models, two language partitions, and two independent judges, MemeMind improves over the strongest context optimization baseline by 22.0% and 21.1% on Qwen3-VL-30B-A3B, and by 8.1% and 8.0% on Qwen3-VL-235B-A22B under GPT-5 judging. Ablations and held out traces show that constructing successful tool use for failed groups provides the largest component gain and produces more effective evidence acquisition at inference time.", "arxiv_id": "2608.09316", "arxiv_url": "https://arxiv.org/abs/2608.09316", "authors": ["Run Yang", "Weihang Wang", "Boheng Sheng", "Yuchen He", "Jielei Zhang", "Pengyu Chen", "Zhiyu Wu", "Qiang Sun", "Huyang Sun", "Longwen Gao"], "brief": "MemeMind\u9488\u5bf9\u79bb\u7ebf\u4e0a\u4e0b\u6587\u4f18\u5316\u4e2d\u201c\u6240\u6709 rollout \u90fd\u5931\u8d25\u201d\u5bfc\u81f4\u7f3a\u5c11\u6210\u529f\u7ecf\u9a8c\u7684\u95ee\u9898\uff0c\u5229\u7528\u79bb\u7ebf\u53c2\u8003\u7b54\u6848\u6784\u9020\u5e76\u9a8c\u8bc1\u6587\u672c\u641c\u7d22\u3001\u56fe\u50cf\u68c0\u7d22\u548c\u89c6\u89c9\u5b9a\u4f4d\u7b49\u5de5\u5177\u8c03\u7528\u8f68\u8ff9\uff0c\u518d\u603b\u7ed3\u4e3a\u63a8\u7406\u65f6\u53ef\u7528\u7684\u5de5\u5177\u6307\u5357\u3002 \u5728 MemeX \u8868\u60c5\u5305\u7406\u89e3\u57fa\u51c6\u4e0a\uff0c\u5b83\u5728\u51bb\u7ed3 Qwen3-VL \u6a21\u578b\u6761\u4ef6\u4e0b\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u4e0a\u4e0b\u6587\u4f18\u5316\u57fa\u7ebf\uff0c\u5c24\u5176\u901a\u8fc7\u4e3a\u5931\u8d25\u6837\u672c\u8865\u5145\u6210\u529f\u5de5\u5177\u4f7f\u7528\u8f68\u8ff9\u5e26\u6765\u4e3b\u8981\u589e\u76ca\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09316", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u4f18\u5316", "\u591a\u6a21\u6001", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09316v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MemeMind: Reference-Guided Trace Construction for Offline Context Optimization", "tldr": "MemeMind\u9488\u5bf9\u79bb\u7ebf\u4e0a\u4e0b\u6587\u4f18\u5316\u4e2d\u201c\u6240\u6709 rollout \u90fd\u5931\u8d25\u201d\u5bfc\u81f4\u7f3a\u5c11\u6210\u529f\u7ecf\u9a8c\u7684\u95ee\u9898\uff0c\u5229\u7528\u79bb\u7ebf\u53c2\u8003\u7b54\u6848\u6784\u9020\u5e76\u9a8c\u8bc1\u6587\u672c\u641c\u7d22\u3001\u56fe\u50cf\u68c0\u7d22\u548c\u89c6\u89c9\u5b9a\u4f4d\u7b49\u5de5\u5177\u8c03\u7528\u8f68\u8ff9\uff0c\u518d\u603b\u7ed3\u4e3a\u63a8\u7406\u65f6\u53ef\u7528\u7684\u5de5\u5177\u6307\u5357\u3002 \u5728 MemeX \u8868\u60c5\u5305\u7406\u89e3\u57fa\u51c6\u4e0a\uff0c\u5b83\u5728\u51bb\u7ed3 Qwen3-VL \u6a21\u578b\u6761\u4ef6\u4e0b\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u4e0a\u4e0b\u6587\u4f18\u5316\u57fa\u7ebf\uff0c\u5c24\u5176\u901a\u8fc7\u4e3a\u5931\u8d25\u6837\u672c\u8865\u5145\u6210\u529f\u5de5\u5177\u4f7f\u7528\u8f68\u8ff9\u5e26\u6765\u4e3b\u8981\u589e\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent graphical user interface (GUI) grounders have significantly advanced single-shot accuracy on standard benchmarks, yet their performance degrades sharply on small targets, densely packed controls and out-of-distribution interfaces. We attribute this gap to a paradigmatic limitation shared by existing approaches: none of them treats a produced coordinate as a hypothesis to be reflected upon and revised under new visual evidence. This manifests as three coupled issues: 1) Lack of post-hoc reflection. The prediction is frozen at the moment of emission, leaving no internal mechanism to challenge or refine it. 2) Visual evidence decoupled from the prediction. The auxiliary visual evidence is gathered to support the upcoming coordinate rather than to scrutinise the one already committed to. 3) Refinement over views, not over predictions. The iterative zoom-in refines the inspected region instead of inheriting a previous coordinate as a spatial prior to be corrected. In this paper, we propose LookAgain, a closed-loop GUI grounder driven by post-prediction visual reflection. LookAgain reformulates grounding as a multi-turn predict-look-again-refine process with two primitives: \"locate\" posts a coordinate hypothesis, renders a marker on the image and appends a local patch of the predicted region. It anchors the next reasoning step to the previous prediction as a spatial prior; \"confirm\" accepts or reject the hypothesis and terminates the procedure. We train the LookAgain grounder with SFT on constructed reflective trajectories as a cold start, followed by GRPO with terminal grounding correctness as the sole reward. Extensive experiments show that LookAgain consistently improves performance on both refusal-aware and general GUI grounding benchmarks, achieving state-of-the-art results. Comprehensive ablations further verify the effectiveness of the proposed framework.", "arxiv_id": "2608.09723", "arxiv_url": "https://arxiv.org/abs/2608.09723", "authors": ["Renshan Zhang", "Haoyang Meng", "Yixiao He", "Rui Shao", "April Hua Liu", "Liqiang Nie"], "brief": "\u672c\u6587\u63d0\u51fa LookAgain\uff0c\u5c06 GUI \u5750\u6807\u5b9a\u4f4d\u6539\u4e3a\u95ed\u73af\u7684\u201c\u9884\u6d4b-\u518d\u770b-\u4fee\u6b63\u201d\u6d41\u7a0b\uff1a\u5148\u7ed9\u51fa\u5750\u6807\u5047\u8bbe\uff0c\u518d\u5728\u56fe\u50cf\u4e0a\u6807\u8bb0\u5e76\u67e5\u770b\u5c40\u90e8\u533a\u57df\uff0c\u901a\u8fc7\u89c6\u89c9\u53cd\u601d\u786e\u8ba4\u6216\u62d2\u7edd\u3002\u65b9\u6cd5\u5148\u7528\u53cd\u601d\u8f68\u8ff9\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u7528\u4ec5\u57fa\u4e8e\u6700\u7ec8\u5b9a\u4f4d\u6b63\u786e\u6027\u7684 GRPO \u8bad\u7ec3\uff0c\u5728\u591a\u4e2a GUI grounding \u57fa\u51c6\u4e0a\u53d6\u5f97\u4e00\u81f4\u63d0\u5347\u548c\u6700\u65b0\u6700\u4f73\u7ed3\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09723", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u5f62\u754c\u9762\u5b9a\u4f4d", "\u89c6\u89c9\u53cd\u601d", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09723v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LookAgain: Closed-Loop GUI Grounding with Visually Grounded Reflection", "tldr": "\u672c\u6587\u63d0\u51fa LookAgain\uff0c\u5c06 GUI \u5750\u6807\u5b9a\u4f4d\u6539\u4e3a\u95ed\u73af\u7684\u201c\u9884\u6d4b-\u518d\u770b-\u4fee\u6b63\u201d\u6d41\u7a0b\uff1a\u5148\u7ed9\u51fa\u5750\u6807\u5047\u8bbe\uff0c\u518d\u5728\u56fe\u50cf\u4e0a\u6807\u8bb0\u5e76\u67e5\u770b\u5c40\u90e8\u533a\u57df\uff0c\u901a\u8fc7\u89c6\u89c9\u53cd\u601d\u786e\u8ba4\u6216\u62d2\u7edd\u3002\u65b9\u6cd5\u5148\u7528\u53cd\u601d\u8f68\u8ff9\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u7528\u4ec5\u57fa\u4e8e\u6700\u7ec8\u5b9a\u4f4d\u6b63\u786e\u6027\u7684 GRPO \u8bad\u7ec3\uff0c\u5728\u591a\u4e2a GUI grounding \u57fa\u51c6\u4e0a\u53d6\u5f97\u4e00\u81f4\u63d0\u5347\u548c\u6700\u65b0\u6700\u4f73\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) have advanced scene understanding and enabled explicit reasoning in end-to-end autonomous driving. However, existing methods insufficiently integrate spatial-physical evidence into planning reasoning, while reasoning adaptation remains coarse-grained and falls short of scene-specific planning demands. Furthermore, reasoning-path optimization for higher planning quality remains largely unexplored in autonomous-driving post-training. To address these limitations, we propose FactorDrive, an end-to-end autonomous driving framework for adaptive multi-step reasoning driven by planning-critical factors (PCFs). We first perform large-scale driving-domain instruction tuning to establish foundational driving knowledge. Building on this foundation, we construct PCF-CoT, a chain-of-thought (CoT) dataset that grounds planning reasoning in trajectory-relevant spatial-physical evidence and organizes reasoning around scene-specific PCFs, enabling the composition and depth of reasoning paths to adapt to different planning demands. We further introduce Quality Search-Guided Group Relative Policy Optimization (QS-GRPO), which guides Monte Carlo Tree Search (MCTS) with trajectory-level planning rewards to discover reasoning paths with higher planning quality and uses the resulting responses to optimize the policy through GRPO, thereby improving trajectory planning performance. Extensive experiments on both open-loop (nuScenes) and closed-loop-oriented (NAVSIM) benchmarks demonstrate that FactorDrive achieves state-of-the-art planning performance.", "arxiv_id": "2608.09591", "arxiv_url": "https://arxiv.org/abs/2608.09591", "authors": ["Guolei Huang", "Tengfei She", "Yuxuan Lu", "Yao Huang", "Yuqi Ye", "Yongjun Shen"], "brief": "FactorDrive \u9762\u5411\u7aef\u5230\u7aef\u81ea\u52a8\u9a7e\u9a76\uff0c\u5f15\u5165\u7531\u89c4\u5212\u5173\u952e\u56e0\u7d20\u9a71\u52a8\u7684\u81ea\u9002\u5e94\u591a\u6b65\u63a8\u7406\uff0c\u5c06\u8f68\u8ff9\u76f8\u5173\u7684\u7a7a\u95f4\u7269\u7406\u8bc1\u636e\u878d\u5165\u89c4\u5212\u601d\u7ef4\u94fe\u3002\u5176\u901a\u8fc7 PCF-CoT \u6570\u636e\u96c6\u548c QS-GRPO \u540e\u8bad\u7ec3\u4f18\u5316\u63a8\u7406\u8def\u5f84\uff0c\u5728 nuScenes \u4e0e NAVSIM \u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u5148\u8fdb\u7684\u89c4\u5212\u6027\u80fd\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09591", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u601d\u7ef4\u94fe", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09591v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FactorDrive: Adaptive Multi-Step Reasoning Driven by Planning-Critical Factors for End-to-End Autonomous Driving", "tldr": "FactorDrive \u9762\u5411\u7aef\u5230\u7aef\u81ea\u52a8\u9a7e\u9a76\uff0c\u5f15\u5165\u7531\u89c4\u5212\u5173\u952e\u56e0\u7d20\u9a71\u52a8\u7684\u81ea\u9002\u5e94\u591a\u6b65\u63a8\u7406\uff0c\u5c06\u8f68\u8ff9\u76f8\u5173\u7684\u7a7a\u95f4\u7269\u7406\u8bc1\u636e\u878d\u5165\u89c4\u5212\u601d\u7ef4\u94fe\u3002\u5176\u901a\u8fc7 PCF-CoT \u6570\u636e\u96c6\u548c QS-GRPO \u540e\u8bad\u7ec3\u4f18\u5316\u63a8\u7406\u8def\u5f84\uff0c\u5728 nuScenes \u4e0e NAVSIM \u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u5148\u8fdb\u7684\u89c4\u5212\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Natural-language-driven \"vibe coding\" enables the one-shot generation of visually rich and interactive web applications, yet reliable assessment of their quality has not kept pace. Existing evaluations often score isolated artifacts or final task outcomes, offering limited evidence about which failures occur and why. We introduce VideoVIBE, a video-grounded benchmark that transforms human-operated webpage recordings into fine-grained diagnostic tasks. It contains approximately 1.7K diagnostic Video QA instances derived from 6,338 verified failures across generated webpages, spanning semantic-logical, visual-motion, structural-temporal, and functional failures. Diagnoses are grounded primarily in recorded presentation and behavior, with webpage source code used as complementary context. We further propose V2Lens, a training-free, evidence-grounded multi-agent system that challenges and selectively refines initial video-based diagnoses through targeted visual and source-code verification. Across thirteen closed-source and open-weight Video MLLMs, Gemini-2.5-Flash is the strongest standalone model with a score of 64.54, while V2Lens reaches 71.72, an improvement of 7.18 points. Together, our results show that video-grounded evaluation can move beyond isolated artifacts and aggregate outcomes toward a behaviorally faithful and diagnostically informative account of generated application quality.", "arxiv_id": "2608.09573", "arxiv_url": "https://arxiv.org/abs/2608.09573", "authors": ["Jiajun Xu", "Yanghao Zhou", "Jingyun Liao", "Yu Bai", "Jinxing Zhou", "Chengliang Liu", "Changsen Yuan", "Bo Wang", "Qian Liu"], "brief": "\u8bba\u6587\u63d0\u51fa VideoVIBE\uff0c\u4e00\u4e2a\u9762\u5411\u4e00\u6b21\u6027\u81ea\u7136\u8bed\u8a00\u751f\u6210\u4ea4\u4e92\u5f0f\u7f51\u7ad9\u7684\u516c\u5f00\u89c6\u9891\u8bca\u65ad\u57fa\u51c6\uff0c\u5c06\u4eba\u5de5\u64cd\u4f5c\u7f51\u9875\u5f55\u50cf\u8f6c\u5316\u4e3a\u7ec6\u7c92\u5ea6 Video QA\uff0c\u7528\u4e8e\u5b9a\u4f4d\u8bed\u4e49\u3001\u89c6\u89c9\u3001\u7ed3\u6784\u548c\u529f\u80fd\u5931\u8d25\u3002\u8fd8\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u591a\u667a\u80fd\u4f53\u8bca\u65ad\u7cfb\u7edf V2Lens\uff0c\u901a\u8fc7\u89c6\u9891\u4e0e\u6e90\u7801\u8bc1\u636e\u6821\u9a8c\u6539\u8fdb\u8bca\u65ad\uff0c\u5728 13 \u4e2a\u89c6\u9891\u591a\u6a21\u6001\u6a21\u578b\u4e0a\u8f83\u6700\u5f3a\u5355\u6a21\u578b\u63d0\u5347 7.18 \u5206\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09573", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u89c6\u9891\u7406\u89e3", "\u7f51\u7ad9\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09573v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VideoVIBE: A Video-Grounded Diagnostic Benchmark for One-Shot Interactive Website Generation", "tldr": "\u8bba\u6587\u63d0\u51fa VideoVIBE\uff0c\u4e00\u4e2a\u9762\u5411\u4e00\u6b21\u6027\u81ea\u7136\u8bed\u8a00\u751f\u6210\u4ea4\u4e92\u5f0f\u7f51\u7ad9\u7684\u516c\u5f00\u89c6\u9891\u8bca\u65ad\u57fa\u51c6\uff0c\u5c06\u4eba\u5de5\u64cd\u4f5c\u7f51\u9875\u5f55\u50cf\u8f6c\u5316\u4e3a\u7ec6\u7c92\u5ea6 Video QA\uff0c\u7528\u4e8e\u5b9a\u4f4d\u8bed\u4e49\u3001\u89c6\u89c9\u3001\u7ed3\u6784\u548c\u529f\u80fd\u5931\u8d25\u3002\u8fd8\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u591a\u667a\u80fd\u4f53\u8bca\u65ad\u7cfb\u7edf V2Lens\uff0c\u901a\u8fc7\u89c6\u9891\u4e0e\u6e90\u7801\u8bc1\u636e\u6821\u9a8c\u6539\u8fdb\u8bca\u65ad\uff0c\u5728 13 \u4e2a\u89c6\u9891\u591a\u6a21\u6001\u6a21\u578b\u4e0a\u8f83\u6700\u5f3a\u5355\u6a21\u578b\u63d0\u5347 7.18 \u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video world models must capture how scenes evolve over time and across viewpoints. Training them for long-horizon generation and camera control therefore benefits from long videos paired with camera trajectories and temporally grounded semantics. Existing corpora rarely offer the three together: large-scale web video provides broad visual diversity but no trajectories or time-aligned text, while pose-annotated datasets are typically short-range or reconstruction-oriented. We introduce Sekai2, a multi-source real-world video dataset that carries the world-exploration footage of Sekai toward interactive world modeling. The release contains 128,892 clips totaling 2,826 hours from 10,428 source videos across 113 countries or regions, and is deliberately weighted toward sustained observation: under a common 120-second decomposition, 43,594 segments reach the full two minutes and account for 51.4% of all footage. Every clip includes a released camera trajectory and hierarchical annotations disentangling subject motion, environment dynamics, static scene content, and camera behavior, resulting in 649,597 temporally grounded segments. Crucially, we further introduce 982 panoramic sequences captured along non-linear trajectories with loops and revisits. These revisits provide repeated observations of the same locations across time and viewpoints, offering essential supervision for learning persistent scene representations, long-term spatial memory, and geometrically consistent world models. Corpus-scale analyses demonstrate complete pose-and-caption coverage, broad geographic and semantic diversity, varied camera trajectories, and highly non-redundant temporal descriptions. Together, these properties make Sekai2 a scalable resource for long-horizon video generation, camera-controllable synthesis, and interactive world-model pre-training.", "arxiv_id": "2608.09449", "arxiv_url": "https://arxiv.org/abs/2608.09449", "authors": ["Kang He", "Wenshuo Peng", "Zihui Gao", "Jiaming Tan", "Kaipeng Zhang", "Yongtao Ge"], "brief": "Sekai2 \u662f\u4e00\u4e2a\u9762\u5411\u4ea4\u4e92\u5f0f\u4e16\u754c\u5efa\u6a21\u7684\u5927\u89c4\u6a21\u771f\u5b9e\u89c6\u9891\u6570\u636e\u96c6\uff0c\u5305\u542b\u7ea612.9\u4e07\u4e2a\u7247\u6bb5\u30012826\u5c0f\u65f6\u89c6\u9891\uff0c\u5e76\u63d0\u4f9b\u5b8c\u6574\u76f8\u673a\u8f68\u8ff9\u4e0e\u65f6\u95f4\u5bf9\u9f50\u7684\u5206\u5c42\u8bed\u4e49\u6807\u6ce8\u3002\u5b83\u7279\u522b\u5f3a\u8c03\u957f\u65f6\u89c2\u5bdf\u3001\u975e\u7ebf\u6027\u5168\u666f\u8f68\u8ff9\u4e0e\u5730\u70b9\u91cd\u8bbf\uff0c\u53ef\u652f\u6301\u957f\u671f\u89c6\u9891\u751f\u6210\u3001\u76f8\u673a\u53ef\u63a7\u5408\u6210\u548c\u51e0\u4f55\u4e00\u81f4\u7684\u4e16\u754c\u6a21\u578b\u9884\u8bad\u7ec3\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09449", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6570\u636e\u96c6", "\u76f8\u673a\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09449v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Sekai2: From World Exploration to Interactive World Modeling", "tldr": "Sekai2 \u662f\u4e00\u4e2a\u9762\u5411\u4ea4\u4e92\u5f0f\u4e16\u754c\u5efa\u6a21\u7684\u5927\u89c4\u6a21\u771f\u5b9e\u89c6\u9891\u6570\u636e\u96c6\uff0c\u5305\u542b\u7ea612.9\u4e07\u4e2a\u7247\u6bb5\u30012826\u5c0f\u65f6\u89c6\u9891\uff0c\u5e76\u63d0\u4f9b\u5b8c\u6574\u76f8\u673a\u8f68\u8ff9\u4e0e\u65f6\u95f4\u5bf9\u9f50\u7684\u5206\u5c42\u8bed\u4e49\u6807\u6ce8\u3002\u5b83\u7279\u522b\u5f3a\u8c03\u957f\u65f6\u89c2\u5bdf\u3001\u975e\u7ebf\u6027\u5168\u666f\u8f68\u8ff9\u4e0e\u5730\u70b9\u91cd\u8bbf\uff0c\u53ef\u652f\u6301\u957f\u671f\u89c6\u9891\u751f\u6210\u3001\u76f8\u673a\u53ef\u63a7\u5408\u6210\u548c\u51e0\u4f55\u4e00\u81f4\u7684\u4e16\u754c\u6a21\u578b\u9884\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time training (TTT) offers a lightweight way to adapt vision--language--action (VLA) policies from unlabeled deployment streams, but it remains difficult to use reliably in closed-loop manipulation. A shared adaptation space can mix incompatible task corrections, while an online update can alter subsequent actions before its consequences are known. We introduce a reliable TTT framework for VLA policies (VANE). VANE conditions prompt adaptation on the current vision--language context and learns from the future visual consequences of executed actions. Candidate updates are isolated from the live policy, evaluated on subsequent observations, and committed only when supported by future evidence, making adaptation selective and reversible. On SimplerEnv WidowX, VANE improves average success by $3.2$ percentage points over the corresponding TTT baseline. Results on Google Robot further show that deployment-time gains remain task- and embodiment-dependent. Together, these results demonstrate a constrained, evidence-based approach to adapting VLA policies during interaction.", "arxiv_id": "2608.09448", "arxiv_url": "https://arxiv.org/abs/2608.09448", "authors": ["Hongjin Ji", "Guoyang Xia", "Luoyang Sun", "Fangxiang Feng", "Lei Ren"], "brief": "\u672c\u6587\u63d0\u51fa VANE\uff0c\u7528\u4e8e\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5728\u90e8\u7f72\u65f6\u8fdb\u884c\u66f4\u53ef\u9760\u7684\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u3002\u5b83\u5c06\u5019\u9009\u66f4\u65b0\u4e0e\u5728\u7ebf\u7b56\u7565\u9694\u79bb\uff0c\u5e76\u5229\u7528\u672a\u6765\u89c6\u89c9\u7ed3\u679c\u9a8c\u8bc1\u540e\u518d\u63d0\u4ea4\uff0c\u4ece\u800c\u63d0\u5347\u95ed\u73af\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684\u9002\u5e94\u7a33\u5b9a\u6027\uff1b\u5728 SimplerEnv WidowX \u4e0a\u76f8\u6bd4\u5bf9\u5e94 TTT \u57fa\u7ebf\u5e73\u5747\u6210\u529f\u7387\u63d0\u5347 3.2 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09448", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u6d4b\u8bd5\u65f6\u8bad\u7ec3", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09448v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VANE: Reliable Test-Time Training for Vision-Language-Action Models via Future Visual Representation Prediction", "tldr": "\u672c\u6587\u63d0\u51fa VANE\uff0c\u7528\u4e8e\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5728\u90e8\u7f72\u65f6\u8fdb\u884c\u66f4\u53ef\u9760\u7684\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u3002\u5b83\u5c06\u5019\u9009\u66f4\u65b0\u4e0e\u5728\u7ebf\u7b56\u7565\u9694\u79bb\uff0c\u5e76\u5229\u7528\u672a\u6765\u89c6\u89c9\u7ed3\u679c\u9a8c\u8bc1\u540e\u518d\u63d0\u4ea4\uff0c\u4ece\u800c\u63d0\u5347\u95ed\u73af\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684\u9002\u5e94\u7a33\u5b9a\u6027\uff1b\u5728 SimplerEnv WidowX \u4e0a\u76f8\u6bd4\u5bf9\u5e94 TTT \u57fa\u7ebf\u5e73\u5747\u6210\u529f\u7387\u63d0\u5347 3.2 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion transformer (DiT), a rapidly emerging architecture for image generation, has gained much attention. However, despite ongoing efforts to improve its performance, the understanding of DiT remains superficial. In this work, we delve into and investigate a critical conditioning mechanism within DiT, adaLN-Zero, which achieves superior performance compared to adaLN. Our work studies three potential elements driving this performance, including an SE-like structure, zero-initialization, and a \"gradual\" update order, among which zero-initialization is proved to be the most influential. Building on this understanding, we propose an analysis-guided initialization strategy, termed adaLN-Gaussian, which serves both as an empirical validation of our analysis and as a practical initialization method that consistently improves optimization efficiency. On the other hand, inspired by the SE-like structure, we introduce an improved conditioning mechanism called SE-adaLN-Zero. Extensive experiments following DiT on four datasets, especially on ImageNet1K demonstrate the effectiveness and generalization of adaLN-Gaussian and SE-adaLN-Zero. Beyond class-to-image generation, we also evaluate the generalization of the two improved methods on text-to-image generation.", "arxiv_id": "2608.09438", "arxiv_url": "https://arxiv.org/abs/2608.09438", "authors": ["Jie Zhu", "Mingyu Ding", "Boqiang Duan", "Leye Wang", "Jingdong Wang"], "brief": "\u672c\u6587\u7cfb\u7edf\u5206\u6790\u4e86 Diffusion Transformer \u4e2d\u5173\u952e\u6761\u4ef6\u673a\u5236 adaLN-Zero \u7684\u4f5c\u7528\u6765\u6e90\uff0c\u53d1\u73b0\u96f6\u521d\u59cb\u5316\u662f\u5176\u4f18\u4e8e adaLN \u7684\u6700\u4e3b\u8981\u56e0\u7d20\u3002\u57fa\u4e8e\u8be5\u53d1\u73b0\u63d0\u51fa adaLN-Gaussian \u521d\u59cb\u5316\u548c SE-adaLN-Zero \u6761\u4ef6\u673a\u5236\uff0c\u5728\u591a\u6570\u636e\u96c6\u3001ImageNet1K \u4ee5\u53ca\u6587\u672c\u5230\u56fe\u50cf\u751f\u6210\u4e2d\u63d0\u5347\u4e86\u4f18\u5316\u6548\u7387\u4e0e\u6cdb\u5316\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09438", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u89c6\u89c9 Transformer", "\u56fe\u50cf\u751f\u6210", "\u521d\u59cb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09438v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unveiling the Secret of AdaLN-Zero in Diffusion Transformer", "tldr": "\u672c\u6587\u7cfb\u7edf\u5206\u6790\u4e86 Diffusion Transformer \u4e2d\u5173\u952e\u6761\u4ef6\u673a\u5236 adaLN-Zero \u7684\u4f5c\u7528\u6765\u6e90\uff0c\u53d1\u73b0\u96f6\u521d\u59cb\u5316\u662f\u5176\u4f18\u4e8e adaLN \u7684\u6700\u4e3b\u8981\u56e0\u7d20\u3002\u57fa\u4e8e\u8be5\u53d1\u73b0\u63d0\u51fa adaLN-Gaussian \u521d\u59cb\u5316\u548c SE-adaLN-Zero \u6761\u4ef6\u673a\u5236\uff0c\u5728\u591a\u6570\u636e\u96c6\u3001ImageNet1K \u4ee5\u53ca\u6587\u672c\u5230\u56fe\u50cf\u751f\u6210\u4e2d\u63d0\u5347\u4e86\u4f18\u5316\u6548\u7387\u4e0e\u6cdb\u5316\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pretrained self-supervised representations have emerged as a core component of current deepfake detection methods, yet it remains unclear which of their properties make real and fake media distinguishable. In this work, we uncover a surprisingly consistent phenomenon: across multiple pretrained models, datasets, and both image and video domains, fake samples systematically produce lower-magnitude representations than their real counterparts. Motivated by this finding, we formulate deepfake detection as an anomaly detection problem and show that simple statistics of feature magnitude achieve competitive performance with far more sophisticated deepfake detection methods. We further investigate the origin of this effect and demonstrate that reduced feature magnitude is primarily associated with semantic shifts introduced by fake content, while low-level generative fingerprints play a comparatively smaller role. Finally, we show that this discriminative signal strengthens as the size of the underlying foundation model grows, suggesting that advances in representation learning naturally translate into stronger zero-shot deepfake detectors.", "arxiv_id": "2608.09427", "arxiv_url": "https://arxiv.org/abs/2608.09427", "authors": ["Stefan Smeu", "Dragos-Alexandru Boldisor", "Elisabeta Oneata", "Dan Oneata"], "brief": "\u8be5\u8bba\u6587\u53d1\u73b0\u591a\u4e2a\u9884\u8bad\u7ec3\u81ea\u76d1\u7763\u57fa\u7840\u6a21\u578b\u5728\u56fe\u50cf\u548c\u89c6\u9891\u6df1\u5ea6\u4f2a\u9020\u6837\u672c\u4e0a\u90fd\u4f1a\u4ea7\u751f\u66f4\u4f4e\u5e45\u503c\u7684\u7279\u5f81\u8868\u793a\u3002\u57fa\u4e8e\u8fd9\u4e00\u73b0\u8c61\uff0c\u4f5c\u8005\u5c06\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b\u89c6\u4e3a\u5f02\u5e38\u68c0\u6d4b\uff0c\u4ec5\u7528\u7279\u5f81\u5e45\u503c\u7edf\u8ba1\u5c31\u80fd\u53d6\u5f97\u63a5\u8fd1\u590d\u6742\u65b9\u6cd5\u7684\u6548\u679c\uff0c\u5e76\u4e14\u6a21\u578b\u8d8a\u5927\u96f6\u6837\u672c\u68c0\u6d4b\u4fe1\u53f7\u8d8a\u5f3a\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09427", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b", "\u57fa\u7840\u6a21\u578b", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u5f02\u5e38\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09427v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Foundation Models are Implicit Deepfake Detectors", "tldr": "\u8be5\u8bba\u6587\u53d1\u73b0\u591a\u4e2a\u9884\u8bad\u7ec3\u81ea\u76d1\u7763\u57fa\u7840\u6a21\u578b\u5728\u56fe\u50cf\u548c\u89c6\u9891\u6df1\u5ea6\u4f2a\u9020\u6837\u672c\u4e0a\u90fd\u4f1a\u4ea7\u751f\u66f4\u4f4e\u5e45\u503c\u7684\u7279\u5f81\u8868\u793a\u3002\u57fa\u4e8e\u8fd9\u4e00\u73b0\u8c61\uff0c\u4f5c\u8005\u5c06\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b\u89c6\u4e3a\u5f02\u5e38\u68c0\u6d4b\uff0c\u4ec5\u7528\u7279\u5f81\u5e45\u503c\u7edf\u8ba1\u5c31\u80fd\u53d6\u5f97\u63a5\u8fd1\u590d\u6742\u65b9\u6cd5\u7684\u6548\u679c\uff0c\u5e76\u4e14\u6a21\u578b\u8d8a\u5927\u96f6\u6837\u672c\u68c0\u6d4b\u4fe1\u53f7\u8d8a\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in large vision-language models (LVLMs) have enabled powerful multimodal reasoning by integrating visual encoders with large language models (LLMs). However, their reliability is frequently undermined by hallucinations, where generated text inaccurately describes the visual input. Although fine-tuning can mitigate this problem, it is computationally expensive and requires large, curated datasets, making training-free alternatives attractive. Among these, model editing is more promising than decoding-based approaches: decoding methods adapt outputs per input but introduce computational overhead and instability, whereas model editing modifies internal representations offline, providing a more efficient and stable solution. However, existing model-editing techniques typically rely on a single global subspace to correct hallucinations, treating all test samples identically and failing to capture diverse hallucination modes across inputs. To address this limitation, we propose a training-free hallucination mitigation framework for dynamic, per-instance suppression at test time. Our method first constructs a set of Disentangled Hallucination Subspaces, each isolating a distinct hallucination mode. During inference, the model adaptively calculates weights reflecting each input\u0027s relationship to these subspaces, guiding a dynamically combined projection that selectively suppresses the most probable hallucination directions while preserving image-grounded semantics. Extensive experiments across multiple vision-language benchmarks and LVLM families demonstrate consistent improvements, highlighting the robustness, generalizability, and efficiency of our approach.", "arxiv_id": "2608.09344", "arxiv_url": "https://arxiv.org/abs/2608.09344", "authors": ["Ali Cheraghian", "Hamidreza Dastmalchi", "Hamed Barzamini", "Morteza Saberi", "Mojtaba Golzan", "Shafin Rahman", "Hossein Rahmani"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684 LVLM \u5e7b\u89c9\u7f13\u89e3\u65b9\u6cd5\uff0c\u4e0d\u518d\u4f7f\u7528\u5355\u4e00\u5168\u5c40\u7f16\u8f91\u5b50\u7a7a\u95f4\uff0c\u800c\u662f\u6784\u5efa\u591a\u4e2a\u89e3\u8026\u5e7b\u89c9\u5b50\u7a7a\u95f4\u6765\u8868\u793a\u4e0d\u540c\u5e7b\u89c9\u6a21\u5f0f\u3002\u63a8\u7406\u65f6\u6839\u636e\u6bcf\u4e2a\u8f93\u5165\u52a8\u6001\u52a0\u6743\u5e76\u6295\u5f71\u6291\u5236\u6700\u53ef\u80fd\u7684\u5e7b\u89c9\u65b9\u5411\uff0c\u5728\u591a\u4e2a\u89c6\u89c9\u8bed\u8a00\u57fa\u51c6\u548c\u6a21\u578b\u65cf\u4e0a\u5e26\u6765\u7a33\u5b9a\u63d0\u5347\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u6548\u7387\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09344", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9\u7f13\u89e3", "\u6a21\u578b\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09344v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Global Editing: Per-Instance Disentangled Subspaces for Training-Free Hallucination Mitigation in LVLMs", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684 LVLM \u5e7b\u89c9\u7f13\u89e3\u65b9\u6cd5\uff0c\u4e0d\u518d\u4f7f\u7528\u5355\u4e00\u5168\u5c40\u7f16\u8f91\u5b50\u7a7a\u95f4\uff0c\u800c\u662f\u6784\u5efa\u591a\u4e2a\u89e3\u8026\u5e7b\u89c9\u5b50\u7a7a\u95f4\u6765\u8868\u793a\u4e0d\u540c\u5e7b\u89c9\u6a21\u5f0f\u3002\u63a8\u7406\u65f6\u6839\u636e\u6bcf\u4e2a\u8f93\u5165\u52a8\u6001\u52a0\u6743\u5e76\u6295\u5f71\u6291\u5236\u6700\u53ef\u80fd\u7684\u5e7b\u89c9\u65b9\u5411\uff0c\u5728\u591a\u4e2a\u89c6\u89c9\u8bed\u8a00\u57fa\u51c6\u548c\u6a21\u578b\u65cf\u4e0a\u5e26\u6765\u7a33\u5b9a\u63d0\u5347\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion caching is a lightweight strategy that accelerates Diffusion Transformers (DiTs) by reusing intermediate features across denoising steps, but existing paradigms face a fundamental trade-off: online heuristics lack global budget awareness, whereas static schedules lack instance adaptivity and fail to flexibly adapt to varying runtime budget constraints. To bridge this gap, we present BAG (Budget-Aware Gating), a novel caching policy that unifies global budget pacing with dynamic, instance-adaptive feature reuse. Rather than relying on hand-crafted rules, BAG employs a lightweight gating network that dynamically decides whether to execute a full computation or reuse cached features at each step by jointly conditioning on the budget state and local trajectory feedback. We train this policy via offline-to-online schedule distillation, transferring the decision-making of offline-searched schedules into a compact online gate. Extensive experiments on FLUX.1-dev and Wan2.1 demonstrate that BAG consistently outperforms state-of-the-art caching methods across various speedup tiers while remaining robust across different resolutions, seeds, and guidance scales. Code will be released.", "arxiv_id": "2608.09231", "arxiv_url": "https://arxiv.org/abs/2608.09231", "authors": ["Tong Zhao", "Mingkun Lei", "Yucheng Han", "Chi Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa BAG\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563 Transformer \u7f13\u5b58\u52a0\u901f\u7684\u9884\u7b97\u611f\u77e5\u95e8\u63a7\u7b56\u7565\uff0c\u5728\u6bcf\u4e2a\u53bb\u566a\u6b65\u9aa4\u6839\u636e\u5168\u5c40\u9884\u7b97\u72b6\u6001\u548c\u5c40\u90e8\u8f68\u8ff9\u53cd\u9988\u52a8\u6001\u51b3\u5b9a\u662f\u5426\u590d\u7528\u7279\u5f81\u3002\u901a\u8fc7\u79bb\u7ebf\u5230\u5728\u7ebf\u7684\u8c03\u5ea6\u84b8\u998f\u8bad\u7ec3\u8f7b\u91cf\u95e8\u63a7\u7f51\u7edc\uff0c\u5728 FLUX.1-dev \u548c Wan2.1 \u4e0a\u76f8\u6bd4\u73b0\u6709\u7f13\u5b58\u65b9\u6cd5\u5728\u591a\u79cd\u52a0\u901f\u6863\u4f4d\u4e0b\u8868\u73b0\u66f4\u597d\uff0c\u5e76\u5177\u5907\u8f83\u5f3a\u9c81\u68d2\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09231", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6a21\u578b\u52a0\u901f", "\u7279\u5f81\u7f13\u5b58", "\u95e8\u63a7\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09231v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BAG: Budget-Aware Gating for Diffusion Caching", "tldr": "\u8bba\u6587\u63d0\u51fa BAG\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563 Transformer \u7f13\u5b58\u52a0\u901f\u7684\u9884\u7b97\u611f\u77e5\u95e8\u63a7\u7b56\u7565\uff0c\u5728\u6bcf\u4e2a\u53bb\u566a\u6b65\u9aa4\u6839\u636e\u5168\u5c40\u9884\u7b97\u72b6\u6001\u548c\u5c40\u90e8\u8f68\u8ff9\u53cd\u9988\u52a8\u6001\u51b3\u5b9a\u662f\u5426\u590d\u7528\u7279\u5f81\u3002\u901a\u8fc7\u79bb\u7ebf\u5230\u5728\u7ebf\u7684\u8c03\u5ea6\u84b8\u998f\u8bad\u7ec3\u8f7b\u91cf\u95e8\u63a7\u7f51\u7edc\uff0c\u5728 FLUX.1-dev \u548c Wan2.1 \u4e0a\u76f8\u6bd4\u73b0\u6709\u7f13\u5b58\u65b9\u6cd5\u5728\u591a\u79cd\u52a0\u901f\u6863\u4f4d\u4e0b\u8868\u73b0\u66f4\u597d\uff0c\u5e76\u5177\u5907\u8f83\u5f3a\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Next-scale visual autoregressive models (VARs) have emerged as a powerful generative paradigm, producing high-quality images through efficient coarse-to-fine prediction. However, their potential for text-guided image editing remains largely underexplored. Existing training-free VAR editing approaches often formulate editing as target-conditioned regeneration guided or constrained by the source image, and may rely on inversion, test-time optimization, attention control, or user-provided masks. This generation-centric formulation does not fully exploit the multiscale source representations provided by VARs and may introduce additional computation or intervention. We instead take a source-centric perspective on VAR editing, in which the encoded source image tokens serve as the primary visual state and the editing process focuses on condition-induced changes. Based on this perspective, we propose \\textbf{EditMod}, which compares source- and target-conditioned predictions under a shared autoregressive context, treats their difference as a scale-wise editing direction, and applies it as a residual update to source tokens at selected scales. Experiments show that EditMod achieves leading source-image fidelity while maintaining strong text alignment, and completes end-to-end editing of a 1K image in only 1.57 seconds on a single A100 GPU without per-image preparation.", "arxiv_id": "2608.09057", "arxiv_url": "https://arxiv.org/abs/2608.09057", "authors": ["Hongyi Fang", "Chuwen Xie", "Benjia Zhou", "Yu-Xuan Qiu", "Chenggong Hu", "Zhibin Wang", "Chao Chen", "Jianbin Qin", "Rui Mao"], "brief": "\u672c\u6587\u63d0\u51fa EditMod\uff0c\u5c06\u89c6\u89c9\u81ea\u56de\u5f52\u6a21\u578b\u7528\u4e8e\u6587\u672c\u5f15\u5bfc\u56fe\u50cf\u7f16\u8f91\u65f6\u4ece\u201c\u751f\u6210\u76ee\u6807\u56fe\u201d\u8f6c\u5411\u201c\u5efa\u6a21\u7f16\u8f91\u53d8\u5316\u201d\u3002\u65b9\u6cd5\u5728\u5171\u4eab\u81ea\u56de\u5f52\u4e0a\u4e0b\u6587\u4e0b\u6bd4\u8f83\u6e90\u6761\u4ef6\u4e0e\u76ee\u6807\u6761\u4ef6\u9884\u6d4b\uff0c\u5c06\u5dee\u5f02\u4f5c\u4e3a\u9010\u5c3a\u5ea6\u7f16\u8f91\u65b9\u5411\u5e76\u6b8b\u5dee\u66f4\u65b0\u6e90\u56fe token\uff0c\u5728\u4fdd\u6301\u6e90\u56fe\u4fdd\u771f\u5ea6\u7684\u540c\u65f6\u5177\u5907\u8f83\u5f3a\u6587\u672c\u5bf9\u9f50\uff0c\u5355\u5f20 A100 \u4e0a\u7f16\u8f91 1K \u56fe\u50cf\u4ec5\u9700 1.57 \u79d2\u4e14\u65e0\u9700\u9010\u56fe\u4f18\u5316\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09057", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u81ea\u56de\u5f52\u6a21\u578b", "\u6587\u672c\u5f15\u5bfc", "\u89c6\u89c9\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09057v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Model the Edit, Not the Image: Visual Autoregressive Editing from a Source-Centric Perspective", "tldr": "\u672c\u6587\u63d0\u51fa EditMod\uff0c\u5c06\u89c6\u89c9\u81ea\u56de\u5f52\u6a21\u578b\u7528\u4e8e\u6587\u672c\u5f15\u5bfc\u56fe\u50cf\u7f16\u8f91\u65f6\u4ece\u201c\u751f\u6210\u76ee\u6807\u56fe\u201d\u8f6c\u5411\u201c\u5efa\u6a21\u7f16\u8f91\u53d8\u5316\u201d\u3002\u65b9\u6cd5\u5728\u5171\u4eab\u81ea\u56de\u5f52\u4e0a\u4e0b\u6587\u4e0b\u6bd4\u8f83\u6e90\u6761\u4ef6\u4e0e\u76ee\u6807\u6761\u4ef6\u9884\u6d4b\uff0c\u5c06\u5dee\u5f02\u4f5c\u4e3a\u9010\u5c3a\u5ea6\u7f16\u8f91\u65b9\u5411\u5e76\u6b8b\u5dee\u66f4\u65b0\u6e90\u56fe token\uff0c\u5728\u4fdd\u6301\u6e90\u56fe\u4fdd\u771f\u5ea6\u7684\u540c\u65f6\u5177\u5907\u8f83\u5f3a\u6587\u672c\u5bf9\u9f50\uff0c\u5355\u5f20 A100 \u4e0a\u7f16\u8f91 1K \u56fe\u50cf\u4ec5\u9700 1.57 \u79d2\u4e14\u65e0\u9700\u9010\u56fe\u4f18\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Answering complex conditional questions using Large Language Models (LLMs) and Retrieval-Augmented Generation (RAG) remains a challenge, particularly in domain-specific contexts where general-purpose LLMs and RAG tend to underperform. We hypothesize that augmenting RAG with unstructured and structured knowledge, extracted from both documents and knowledge graphs (KGs), can improve reasoning and answer accuracy for such tasks. To test this, we propose KGCaRe, a hybrid approach that combines neural retrieval with symbolic reasoning over LLM-generated KGs. KGCaRe constructs a KG from documents using a multi-prompt extraction strategy and stores it in a graph database. Simultaneously, the documents are embedded into a vector store to enable neural retrieval. KGCaRe performs innovative iterative graph traversal guided by the LLM to extract relevant triples, prune irrelevant information, and uses additional clue entities to traverse the graph again if the initial traversal does not provide satisfactory context to generate the answer. The relevant triples extracted from the KG in path form, along with semantically retrieved text passages, are then fed into custom KGCaRe prompts to generate answers to the complex conditional questions with explanations. We evaluate KGCaRe on two complex conditional QA datasets. Our results on these datasets show that KGCaRe consistently outperforms existing baselines, including Vanilla LLM, Code Prompt, Text Prompt, Think-on-Graph, Vanilla RAG, and HybridContextQA, across multiple LLMs such as Mistral, Mixtral, GPT-3.5, and GPT-4o. We publicly release the software pipeline that we developed to implement the proposed KGCaRe approach.", "arxiv_id": "2608.09779", "arxiv_url": "https://arxiv.org/abs/2608.09779", "authors": ["Ghanshyam Verma", "Simanta Sarkar", "Devishree Pillai", "Hotaka Shiokawa", "Yourong Xu", "Fiona Veazey", "Peter Hubbert", "Hui Su", "Paul Buitelaar"], "brief": "\u8bba\u6587\u63d0\u51fa KGCaRe\uff0c\u5c06\u6587\u6863\u81ea\u52a8\u6784\u5efa\u6210\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u7ed3\u5408\u5411\u91cf\u68c0\u7d22\uff0c\u7528 LLM \u5f15\u5bfc\u8fed\u4ee3\u56fe\u904d\u5386\u6765\u83b7\u53d6\u76f8\u5173\u4e09\u5143\u7ec4\u4e0e\u6587\u672c\u8bc1\u636e\u3002\u8be5\u65b9\u6cd5\u5728\u590d\u6742\u6761\u4ef6\u95ee\u7b54\u4efb\u52a1\u4e0a\u4f18\u4e8e\u666e\u901a LLM\u3001RAG\u3001Think-on-Graph \u7b49\u57fa\u7ebf\uff0c\u5e76\u80fd\u751f\u6210\u5e26\u89e3\u91ca\u7684\u7b54\u6848\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09779", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u95ee\u7b54\u7cfb\u7edf", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09779v1", "published_at": "2026-08-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "KGCaRe: Explainable Complex Conditional Question Answering using Automatic Knowledge Graph Construction and Context Retrieval with LLMs", "tldr": "\u8bba\u6587\u63d0\u51fa KGCaRe\uff0c\u5c06\u6587\u6863\u81ea\u52a8\u6784\u5efa\u6210\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u7ed3\u5408\u5411\u91cf\u68c0\u7d22\uff0c\u7528 LLM \u5f15\u5bfc\u8fed\u4ee3\u56fe\u904d\u5386\u6765\u83b7\u53d6\u76f8\u5173\u4e09\u5143\u7ec4\u4e0e\u6587\u672c\u8bc1\u636e\u3002\u8be5\u65b9\u6cd5\u5728\u590d\u6742\u6761\u4ef6\u95ee\u7b54\u4efb\u52a1\u4e0a\u4f18\u4e8e\u666e\u901a LLM\u3001RAG\u3001Think-on-Graph \u7b49\u57fa\u7ebf\uff0c\u5e76\u80fd\u751f\u6210\u5e26\u89e3\u91ca\u7684\u7b54\u6848\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate air quality forecasting is essential for public health and urban environmental management, but remains challenging because pollutant channels differ in periodicity and distribution drift, while their concentration trajectories contain both multi-scale dependencies and rapid changes. Recent methods have improved spatial dependency learning and meteorological covariate modeling. However, pollutant channels are still passed through the same normalization rule and temporal backbone, using a shared latent representation for channel-specific distributions and changes at different rates. To address this limitation, we propose AirFlow, a pollutant-aware dual-stream framework that operates on station multivariate observations without additional graph propagation or predefined signal decomposition. Specifically, AirFlow designs two novel blocks: (1) a statistic-guided normalization routing mechanism that selects a normalization path for each pollutant according to its 24-hour autocorrelation and distribution drift; and (2) a hierarchical dual-stream state model b\u9c81\u68d2\u6027\u8f83\u5f31\uff0c\u90e8\u5206\u6a21\u578b\u53ef\u80fd\u8fc7\u62df\u5408 FLORES\uff0c\u4e14\u6a21\u578b\u666e\u904d\u66f4\u64c5\u957f\u7ffb\u8bd1\u7f8e\u56fd\u8bed\u5883\u5185\u5bb9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
