hows that LLM personalities can shift under contextual perturbations, how these shifts vary across traits, events, personas, and models remains poorly understood. We study event-induced personality change after 11 major life events, using the Big Five traits as a psychometric anchor and interpreting the resulting trajectories against longitudinal evidence from human personality psychology. Across four diagnostic axes, PC-Agents exhibit measurable trait shifts at similar rates for event-trait pairs with and without documented human change directions. Even when shifts follow the expected direction, their magnitudes usually fall below human effect-size ranges. Gender and cultural-region prompts show little moderating effect, while persona-level dispersion is compressed three- to four-fold relative to human samples. To enable systematic comparison, we introduce BFI-Adapt, a reusable benchmark for scoring the directional fidelity of event-induced personality change, and use it to rank 14 models. A validation suite shows that the measured shifts exceed no-event retest noise, remain stable under independently paraphrased prompts, exhibit limited and model-dependent convergence with scenario-based behavioral choices, and persist across intervening unrelated dialogue. Together, these checks establish the measured trajectories as robust event-conditioned response patterns. Our results suggest that current PC-Agents simulate the mean of human personality dynamics, but not its shape.", "arxiv_id": "2608.06485", "arxiv_url": "https://arxiv.org/abs/2608.06485", "authors": ["Ming Wang", "Peidong Wang", "Xiaocui Yang", "Daling Wang", "Shi Feng", "Fiona Fui-Hoon Nah", "Ee-Peng Lim"], "brief": "\u672c\u6587\u7814\u7a76\u4eba\u683c\u6761\u4ef6\u5316 LLM \u667a\u80fd\u4f53\u5728\u7ecf\u538611\u7c7b\u91cd\u5927\u751f\u6d3b\u4e8b\u4ef6\u540e\uff0c\u57fa\u4e8e\u5927\u4e94\u4eba\u683c\u4ea7\u751f\u7684\u6027\u683c\u53d8\u5316\u662f\u5426\u7b26\u5408\u4eba\u7c7b\u7eb5\u5411\u5fc3\u7406\u5b6 ty Evolution in LLM Agents After Life Events", "tldr": "\u8bc4\u6d4bLLM\u667a\u80fd\u4f53\u7ecf\u5386\u4e8b\u4ef6\u540e\u7684\u4eba\u683c\u6f14\u5316\u771f\u5b9e\u6027", "upvotes": 3, "what_it_is": "\u672c\u6587\u7814\u7a76\u4eba\u683c\u6761\u4ef6\u5316 LLM \u667a\u80fd\u4f53\u5728\u7ecf\u538611\u7c7b\u91cd\u5927\u751f\u6d3b\u4e8b\u4ef6\u540e\uff0c\u57fa\u4e8e\u5927\u4e94\u4eba\u683c\u4ea7\u751f\u7684\u6027\u683c\u53d8\u5316\u662f\u5426\u7b26\u5408\u4eba\u7c7b\u7eb5\u5411\u5fc3\u7406\u5b66\u89c4\u5f8b\u3002\u4f5c\u8005\u63d0\u51fa BFI-Adapt \u57fa\u51c6\uff0c\u7528\u4e8e\u8861\u91cf\u4e8b\u4ef6\u8bf1\u53d1\u4eba\u683c\u53d8\u5316\u7684\u65b9\u5411\u4e00\u81f4\u6027\uff0c\u5e76\u8bc4\u6d4b\u4e8614\u4e2a\u6a21\u578b\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a LLM \u667a\u80fd\u4f53\u7684\u201c\u957f\u671f\u4eba\u683c\u4e00\u81f4\u6027\u201d\u548c\u201c\u4eba\u683c\u6210\u957f\u201d\u95ee\u9898\u7cfb\u7edf\u5316\u4e3a\u53ef\u8bc4\u6d4b\u4efb\u52a1\uff0c\u6307\u51fa\u5f53\u524d\u6a21\u578b\u66f4\u50cf\u662f\u5728\u6a21\u62df\u4eba\u7c7b\u4eba\u683c\u53d8\u5316\u7684\u5e73\u5747\u8d8b\u52bf\uff0c\u800c\u975e\u771f\u5b9e\u5206\u5e03\u5f62\u6001\uff0c\u5bf9\u60c5\u611f\u966a\u4f34\u3001\u793e\u4f1a\u6a21\u62df\u548c\u89d2\u8272\u626e\u6f14\u667a\u80fd\u4f53\u7684\u53ef\u4fe1\u5ea6\u8bc4\u4f30\u6709\u91cd\u8981\u4ef7\u503c\u3002"}, {"abstract": "Once visual content enters an AI pipeline, its owner often retains little technical control over how it is used. Legal and regulatory remedies can address misuse, but many technical interventions must be applied earlier, when content is released or accessed. This survey examines the protective paradigm that has grown around this intervention point, which we call \\emph{adversarial attacks for good}. Perturbations and structured signals long studied as attacks on learned models are instead applied by data owners, creators, platforms, or auditors to disrupt unauthorized automation or support later accountability. Five research communities have arrived at this inversion largely independently, each addressing a different stage of a visual asset\u0027s lifecycle: privacy filters against unwanted recognition at sharing time, unlearnable examples against unauthorized training, generative safeguards against malicious editing or imitation, adversarial CAPTCHAs for access control against automated agents, and provenance mechanisms for post-circulation attribution. Although developed in separate venues with incompatible success criteria, many of these methods exploit persistent gaps between human perception, semantic interpretation, and machine inference, suggesting that the paradigm remains relevant as visual pipelines evolve toward multimodal models and autonomous agents. To make their claims comparable, we evaluate all five families along shared axes of transferability, adaptability, and deployment readiness. Across the lifecycle, we find that most protections are still validated mainly against static or weakly adaptive adversaries, while evidence beyond controlled benchmarks remains scarce. We close by consolidating cross-stage countermeasures and open problems for robust, composable, and deployable owner-side protection.", "arxiv_id": "2608.04314", "arxiv_url": "https://arxiv.org/abs/2608.04314", "authors": ["Jiaming Zhang", "Boyang Chen", "Zherui Li", "Fuyao Zhang", "Xinyu Yan", "Hong Xi Tae", "Wenwen He", "Xuan Wang", "Siqi Guo", "Junhao Dong", "Kun Wang", "Hanxun Huang", "Yige Li", "Xingjun Ma", "Yang Cao", "Lingjuan Lyu", "Wei Yang Bryan Lim"], "brief": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u201c\u5584\u610f\u5bf9\u6297\u653b\u51fb\u201d\u8303\u5f0f\uff1a\u5c06\u539f\u672c\u7528\u4e8e\u653b\u51fb\u6a21\u578b\u7684\u6270\u52a8\u548c\u7ed3\u6784\u5316\u4fe1\u53f7\uff0c\u8f6c\u5316\u4e3a\u5185\u5bb9\u6240\u6709\u8005\u3001\u521b\u4f5c\u8005\u3001\u5e73\u53f0\u6216\u5ba1\u8ba1\u65b9\u7684\u4e3b\u52a8\u4fdd\u62a4\u624b\u6bb5\u3002\u8bba\u6587\u8986\u76d6\u89c6\u89c9\u8d44\u4ea7\u4ece\u53d1 1b\u4f5c\u8005\u3001\u5e73\u53f0\u6216\u5ba1\u8ba1\u65b9\u7684\u4e3b\u52a8\u4fdd\u62a4\u624b\u6bb5\u3002\u8bba\u6587\u8986\u76d6\u89c6\u89c9\u8d44\u4ea7\u4ece\u53d1\u5e03\u3001\u8bad\u7ec3\u3001\u751f\u6210\u7f16\u8f91\u3001\u8bbf\u95ee\u63a7\u5236\u5230\u6d41\u901a\u6eaf\u6e90\u7684\u4e94\u7c7b\u9632\u62a4\u6280\u672f\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u628a\u5206\u6563\u5728\u9690\u79c1\u3001\u7248\u6743\u3001\u751f\u6210\u5f0f\u5b89\u5168\u3001\u8bbf\u95ee\u63a7\u5236\u548c\u6eaf\u6e90\u7b49\u9886\u57df\u7684\u6280\u672f\u7edf\u4e00\u4e3a\u89c6\u89c9\u5185\u5bb9\u6240\u6709\u8005\u4fa7\u4e3b\u52a8\u9632\u62a4\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u591a\u6a21\u6001\u4e0e\u81ea\u52a8\u5316 AI \u6d41\u6c34\u7ebf\u4e0b\u5185\u5bb9\u63a7\u5236\u6743\u7684\u6280\u672f\u8fb9\u754c\u4e0e\u672a\u6765\u6311\u6218\u3002"}, {"abstract": "GUI agents are shifting from metadata-dependent large language models to purely visual multimodal large language models (MLLMs) that operate directly on screenshots. The core task, GUI grounding, requires translating abstract user instructions into precise element coordinates. This task faces a persistent dual obstacle: conventional grounding models lack the semantic richness to interpret abstract instructions, while end-to-end MLLMs suffer from coordinate hallucinations caused by deficient fine-grained perception. We propose a regression-free framework where a frozen MLLM performs instruction parsing and a dedicated grounding model handles precise localization without learning any coordinate regression. A frozen MLLM first elaborates the abstract instruction into a structured visual description rich in layout cues. These descriptions are then fed to a novel Layout-Aware GUI Grounding Model, which performs regression-free localization by matching against layout-prior candidates, inherently suppressing hallucinations and avoiding expensive fine-tuning. The grounding model is trained with only Text/Icon binary labels, requiring no coordinate regression parameters. On ScreenSpot-Pro, our method achieves over 20% improvement in grounding accuracy over end-to-end systems; on Mind2Web, it raises success rate and element selection rate by more than 15%. These results demonstrate that decoupling instruction understanding from layout-aware localization effectively resolves the core challenges of GUI interaction.", "arxiv_id": "2608.09654", "arxiv_url": "https://arxiv.org/abs/2608.09654", "authors": ["Yuke Li", "Xuehan Hou"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u5750\u6807\u56de\u5f52\u7684GUI grounding\u6846\u67b6\uff1a\u51bb\u7ed3MLLM\u8d1f\u8d23\u5c06\u62bd\u8c61\u6307\u4ee4\u89e3\u6790\u4e3a\u5e26\u5e03\u5c40\u7ebf\u7d22\u7684\u89c6\u89c9\u63cf\u8ff0\uff0c\u4e13\u7528\u5e03\u5c40\u611f\u77e5\u6a21\u578b\u518d\u901a\u8fc7\u5019\u9009\u5143\u7d20\u5339\u914d\u5b8c\u6210\u7cbe\u786e\u5b9a\u4f4d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09654", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6307\u4ee4\u7406\u89e3\u4e0e\u5750\u6807\u5b9a\u4f4d\u89e3\u8026\uff0c\u907f\u514d\u7aef\u5230\u7aefMLLM\u76f4\u63a5\u8f93\u51fa\u5750\u6807\u5e26\u6765\u7684\u5e7b\u89c9\u95ee\u9898\u3002", "\u63d0\u51faLayout-Aware GUI Grounding Model\uff0c\u57fa\u4e8e\u5e03\u5c40\u5148\u9a8c\u5019\u9009\u8fdb\u884c\u5339\u914d\u5b9a\u4f4d\uff0c\u4e0d\u5b66\u4e60\u5750\u6807\u56de\u5f52\u53c2\u6570\u3002", "\u8bad\u7ec3\u4ec5\u9700Text/Icon\u4e8c\u5206\u7c7b\u6807\u7b7e\uff1b\u5728ScreenSpot-Pro\u4e0a\u51c6\u786e\u7387\u8f83\u7aef\u5230\u7aef\u7cfb\u7edf\u63d0\u5347\u8d8520%\uff0c\u5728Mind2Web\u4e0a\u6210\u529f\u7387\u548c\u5143\u7d20\u9009\u62e9\u7387\u63d0\u5347\u8d8515%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u591a\u6a21\u6001", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09654v1", "published_at": "2026-08-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Hallucination-Free GUI Grounding via Regression-Free Layout-Aware Matching", "tldr": "\u7528\u5e03\u5c40\u5339\u914d\u51cf\u5c11GUI\u5b9a\u4f4d\u5e7b\u89c9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u5750\u6807\u56de\u5f52\u7684GUI grounding\u6846\u67b6\uff1a\u51bb\u7ed3MLLM\u8d1f\u8d23\u5c06\u62bd\u8c61\u6307\u4ee4\u89e3\u6790\u4e3a\u5e26\u5e03\u5c40\u7ebf\u7d22\u7684\u89c6\u89c9\u63cf\u8ff0\uff0c\u4e13\u7528\u5e03\u5c40\u611f\u77e5\u6a21\u578b\u518d\u901a\u8fc7\u5019\u9009\u5143\u7d20\u5339\u914d\u5b8c\u6210\u7cbe\u786e\u5b9a\u4f4d\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4ee5\u8f7b\u91cf\u76d1\u7763\u548c\u65e0\u9700\u5fae\u8c03\u5750\u6807\u56de\u5f52\u7684\u65b9\u5f0f\u63d0\u5347GUI\u667a\u80fd\u4f53\u89c6\u89c9\u5b9a\u4f4d\u53ef\u9760\u6027\uff0c\u5bf9\u7eaf\u622a\u56fe\u9a71\u52a8\u7684GUI\u64cd\u4f5c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agent skills, bundles of instructions and resources that an LLM agent loads on demand, form an emerging supply chain where a single poisoned skill can persistently compromise every agent that installs it. However, existing skill attacks either fire on every request or rely on fine-tuned weights or multiple skills, leaving a conditional and low-cost backdoor unexplored. In this work, we present ElasticBack, an effective conditional single-skill backdoor that plants a rule R in the skill document and a benign-looking trigger T in the user query, so the malicious payload fires only when both co-occur. ElasticBack binds the two sides through a trigger-as-switch construction, generating R via semantic-anchored rule injection. It then freezes R and evolves T against it with a stealth-constrained genetic search, so that effectiveness and stealth are optimized, keeping the backdoor weight-free and dormant on benign inputs. Extensive experiments across three target behaviors (50 skills each) and four agent LLMs show that ElasticBack attains a high attack success rate at a near-zero false-positive rate with preserved clean accuracy, transfers across models, and evades deployment-time defenses. These results motivate stronger defenses for the skill supply chain.", "arxiv_id": "2608.09577", "arxiv_url": "https://arxiv.org/abs/2608.09577", "authors": ["Hao Sui", "Simeng Qin", "Jie Liao", "Xiaojun Jia", "Bing Chen", "Yang Liu"], "brief": "\u672c\u6587\u63d0\u51fa ElasticBack\uff0c\u4e00\u79cd\u9762\u5411 LLM Agent \u6280\u80fd\u4f9b\u5e94\u94fe\u7684\u6761\u4ef6\u5f0f\u5355\u6280\u80fd\u540e\u95e8\u653b\u51fb\u3002\u5b83\u5728\u6280\u80fd\u6587\u6863\u4e2d\u690d\u5165\u89c4\u5219 R\uff0c\u5e76\u5728\u7528\u6237\u67e5\u8be2\u4e2d\u8bbe\u8ba1\u770b\u4f3c\u6b63\u5e38\u7684\u89e6\u53d1\u5668 T\uff0c\u53ea\u6709\u4e8c\u8005\u540c\u65f6\u51fa\u73b0\u65f6\u624d\u6fc0\u6d3b\u6076\u610f\u884c\u4e3a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09577", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u201ctrigger-as-switch\u201d\u673a\u5236\uff0c\u5c06\u6280\u80fd\u5185\u89c4\u5219\u4e0e\u7528\u6237\u4fa7\u89e6\u53d1\u77ed\u8bed\u8026\u5408\uff0c\u907f\u514d\u666e\u901a\u8f93\u5165\u8bef\u89e6\u53d1\u3002", "\u901a\u8fc7\u8bed\u4e49\u951a\u5b9a\u89c4\u5219\u6ce8\u5165\u751f\u6210\u540e\u95e8\u89c4\u5219 R\uff0c\u518d\u56fa\u5b9a R \u5e76\u7528\u5e26\u9690\u853d\u6027\u7ea6\u675f\u7684\u9057\u4f20\u641c\u7d22\u4f18\u5316\u89e6\u53d1\u5668 T\u3002", "\u57283\u7c7b\u76ee\u6807\u884c\u4e3a\u3001\u6bcf\u7c7b50\u4e2a\u6280\u80fd\u30014\u79cdAgent LLM\u4e0a\u9a8c\u8bc1\uff0c\u653b\u51fb\u6210\u529f\u7387\u9ad8\u3001\u8bef\u62a5\u7387\u8fd1\u96f6\u3001\u5e72\u51c0\u4efb\u52a1\u51c6\u786e\u7387\u57fa\u672c\u4fdd\u6301\uff0c\u5e76\u5177\u5907\u8de8\u6a21\u578b\u8fc1\u79fb\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u540e\u95e8\u653b\u51fb", "\u4f9b\u5e94\u94fe\u5b89\u5168", "LLM\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09577v1", "published_at": "2026-08-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ElasticBack: Stealthy Conditional Backdoor in LLM-Agent Skills via Coupled Trigger-Rule Optimization", "tldr": "\u5355\u6280\u80fd\u6761\u4ef6\u540e\u95e8\u53ef\u9690\u853d\u52ab\u6301LLM\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa ElasticBack\uff0c\u4e00\u79cd\u9762\u5411 LLM Agent \u6280\u80fd\u4f9b\u5e94\u94fe\u7684\u6761\u4ef6\u5f0f\u5355\u6280\u80fd\u540e\u95e8\u653b\u51fb\u3002\u5b83\u5728\u6280\u80fd\u6587\u6863\u4e2d\u690d\u5165\u89c4\u5219 R\uff0c\u5e76\u5728\u7528\u6237\u67e5\u8be2\u4e2d\u8bbe\u8ba1\u770b\u4f3c\u6b63\u5e38\u7684\u89e6\u53d1\u5668 T\uff0c\u53ea\u6709\u4e8c\u8005\u540c\u65f6\u51fa\u73b0\u65f6\u624d\u6fc0\u6d3b\u6076\u610f\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86LLM\u667a\u80fd\u4f53\u6280\u80fd\u751f\u6001\u4e2d\u7684\u4f4e\u6210\u672c\u3001\u514d\u5fae\u8c03\u3001\u5355\u6280\u80fd\u6761\u4ef6\u540e\u95e8\u98ce\u9669\uff0c\u4e14\u80fd\u89c4\u907f\u90e8\u7f72\u671f\u9632\u5fa1\uff0c\u5bf9\u672a\u6765Agent\u63d2\u4ef6/\u6280\u80fd\u4f9b\u5e94\u94fe\u5b89\u5168\u5177\u6709\u91cd\u8981\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Verified code generation asks a large language model (LLM) to generate both an executable program and a machine-checkable proof that the program meets a formal specification, promising software that is correct by construction. The de facto workflow decouples the two halves of the problem: first synthesize a program, then attempt to prove it correct. We observe that this sequential pipeline can be both ineffective and inefficient in practice. A program generated without anticipating its proof can be subtly incorrect or structurally difficult to verify, forcing the LLM into brittle repair loops that alternate between patching the code and patching the proof. Inspired by Dijkstra\u0027s view that a program and its correctness argument should be developed hand in hand, we propose $P^3$, an LLM-based agentic workflow that first derives a unified program-and-proof plan from the specification, then elaborates the implementation and proof scaffold under this shared plan. To evaluate verified code generation in realistic settings, we further introduce Lean4Commit0, a repository-derived, library-level benchmark built by extracting core APIs from real-world software repositories and translating their requirements, including relational specifications across APIs, into Lean tasks. Using four frontier LLM backends, we evaluate $P^3$ on Verina, AlgoVeri, and our Lean4Commit0 benchmark, where it achieves the highest solve rate in every benchmark--model setting. Compared with the stronger baseline, it improves solve rates by 4.6--11.2 percentage points and reduces per-task API cost by up to roughly 40\\% and wall-clock time by up to roughly 37\\% on the difficult subset of each benchmark. A targeted ablation further shows gains of 3.3--8.3 points over implementation-only planning, isolating the benefit of planning the program and proof jointly.", "arxiv_id": "2608.09277", "arxiv_url": "https://arxiv.org/abs/2608.09277", "authors": ["Zenan Li", "Ziran Yang", "Peiyang Song", "Zhaoyu Li", "Kaiyu Yang"], "brief": "\u8bba\u6587\u63d0\u51fa P\u00b3\uff0c\u4e00\u79cd\u57fa\u4e8e LLM \u7684\u667a\u80fd\u4f53\u5f0f\u9a8c\u8bc1\u4ee3\u7801\u751f\u6210\u6d41\u7a0b\uff1a\u5148\u4ece\u5f62\u5f0f\u5316\u89c4\u683c\u63a8\u5bfc\u7edf\u4e00\u7684\u201c\u7a0b\u5e8f-\u8bc1\u660e\u201d\u8ba1\u5212\uff0c\u518d\u5728\u8be5\u8ba1\u5212\u4e0b\u751f\u6210\u5b9e\u73b0\u4e0e\u8bc1\u660e\u811a\u624b\u67b6\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 Lean4Commit0\uff0c\u4e00\u4e2a\u6765\u81ea\u771f\u5b9e\u8f6f\u4ef6\u4ed3\u5e93\u3001\u9762\u5411\u5e93\u7ea7 API \u7684 Lean \u57fa\u51c6\u3002", "categories": ["cs.AI", "cs.PL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09277", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0d\u540c\u4e8e\u5148\u5199\u7a0b\u5e8f\u518d\u8865\u8bc1\u660e\u7684\u4e32\u884c\u6d41\u7a0b\uff0cP\u00b3 \u5c06\u7a0b\u5e8f\u7ed3\u6784\u4e0e\u6b63\u786e\u6027\u8bba\u8bc1\u540c\u6b65\u89c4\u5212\uff0c\u51cf\u5c11\u540e\u7eed\u8106\u5f31\u7684\u4ee3\u7801/\u8bc1\u660e\u4fee\u8865\u5faa\u73af\u3002", "Lean4Commit0 \u4ece\u771f\u5b9e\u4ed3\u5e93\u62bd\u53d6\u6838\u5fc3 API\uff0c\u5e76\u5c06\u9700\u6c42\u53ca\u8de8 API \u5173\u7cfb\u89c4\u683c\u7ffb\u8bd1\u4e3a Lean \u4efb\u52a1\uff0c\u66f4\u8d34\u8fd1\u5b9e\u9645\u9a8c\u8bc1\u4ee3\u7801\u751f\u6210\u573a\u666f\u3002", "\u5728 Verina\u3001AlgoVeri \u548c Lean4Commit0 \u4e0a\uff0cP\u00b3 \u5728\u56db\u79cd\u524d\u6cbf LLM \u540e\u7aef\u4e2d\u5747\u53d6\u5f97\u6700\u9ad8\u89e3\u9898\u7387\uff0c\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u63d0\u5347 4.6\u201311.2 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u964d\u4f4e\u6700\u9ad8\u7ea6 40% API \u6210\u672c\u548c 37% \u65f6\u95f4\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09277v1", "published_at": "2026-08-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "P$^{3}$: Joint Program-and-Proof Planning for Verified Code Generation", "tldr": "\u8054\u5408\u89c4\u5212\u7a0b\u5e8f\u4e0e\u8bc1\u660e\u63d0\u5347\u9a8c\u8bc1\u4ee3\u7801\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa P\u00b3\uff0c\u4e00\u79cd\u57fa\u4e8e LLM \u7684\u667a\u80fd\u4f53\u5f0f\u9a8c\u8bc1\u4ee3\u7801\u751f\u6210\u6d41\u7a0b\uff1a\u5148\u4ece\u5f62\u5f0f\u5316\u89c4\u683c\u63a8\u5bfc\u7edf\u4e00\u7684\u201c\u7a0b\u5e8f-\u8bc1\u660e\u201d\u8ba1\u5212\uff0c\u518d\u5728\u8be5\u8ba1\u5212\u4e0b\u751f\u6210\u5b9e\u73b0\u4e0e\u8bc1\u660e\u811a\u624b\u67b6\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 Lean4Commit0\uff0c\u4e00\u4e2a\u6765\u81ea\u771f\u5b9e\u8f6f\u4ef6\u4ed3\u5e93\u3001\u9762\u5411\u5e93\u7ea7 API \u7684 Lean \u57fa\u51c6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u7a0b\u5e8f\u4e0e\u8bc1\u660e\u5171\u540c\u8bbe\u8ba1\u201d\u7684\u7ecf\u5178\u601d\u60f3\u843d\u5230 LLM \u5de5\u4f5c\u6d41\u4e2d\uff0c\u663e\u8457\u63d0\u5347\u4e86\u5f62\u5f0f\u5316\u9a8c\u8bc1\u4ee3\u7801\u751f\u6210\u7684\u6210\u529f\u7387\u4e0e\u6548\u7387\uff1b\u540c\u65f6\u65b0\u57fa\u51c6\u8865\u8db3\u4e86\u771f\u5b9e\u5e93\u7ea7\u4efb\u52a1\u8bc4\u6d4b\u7684\u7f3a\u53e3\uff0c\u5bf9\u53ef\u9760\u8f6f\u4ef6\u81ea\u52a8\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Tool-augmented vision-language models increasingly \"think with images\": they call crop, zoom, or code tools and reason over the returned pixels. However, recent work using blind tests, gain decompositions, and attention analyses has shown that returned images contribute little, raising the question: if pixels do not carry the gain, what does? We hypothesize that the load-bearing signal is the structured text emitted before any returned pixel arrives: tool name, coordinates, target description, and intent. This textual scaffold encodes where to look and what to find. We introduce TextCall (call-but-no-return) to test this: it keeps the scaffold but replaces returned images with the text placeholder [Image output skipped]. Three studies support the hypothesis. (i) Non-necessity of returned pixels: across LoRA, full fine-tuning, and RL, TextCall matches or exceeds full thinking-with-images; under RL it preserves tool use at the reported checkpoint, avoiding the failure mode where, under matched settings, seeing the returned image causes the model to stop calling tools and answer directly. (ii) Sufficiency of the scaffold: on matched training queries, scaffold-only input yields equivalent accuracy to returned-image input. (iii) Component specificity: decomposing the scaffold into reasoning text and spatial code shows both components contribute, with the dominant one varying by task. Together these results support the Tool-Call Scaffold Hypothesis: in current thinking-with-images distributions, the active signal is the structured text emitted at tool-call time; the returned image is a redundant carrier. TextCall preserves accuracy while reducing latency by 29-46% and eliminating tool-execution API calls. Our claims hold for current thinking-with-images benchmarks; constructing tasks where pixels are genuinely load-bearing remains an open direction.", "arxiv_id": "2608.09682", "arxiv_url": "https://arxiv.org/abs/2608.09682", "authors": ["Jiahao Shao", "Yuanbo Yang", "Yiyi Liao", "Yujun Shen", "Ceyuan Yang", "Yinghao Xu"], "brief": "\u8bba\u6587\u63d0\u51fa Tool-Call Scaffold Hypothesis\uff1a\u5728\u5f53\u524d\u201c\u770b\u56fe\u601d\u8003\u201d\u5f0f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u771f\u6b63\u8d77\u4f5c\u7528\u7684\u4e0d\u662f\u5de5\u5177\u8fd4\u56de\u7684\u56fe\u50cf\u50cf\u7d20\uff0c\u800c\u662f\u8c03\u7528\u5de5\u5177\u524d\u751f\u6210\u7684\u7ed3\u6784\u5316\u6587\u672c\u3002\u4f5c\u8005\u8bbe\u8ba1 TextCall\uff0c\u53ea\u4fdd\u7559\u5de5\u5177\u540d\u3001\u5750\u6807\u3001\u76ee\u6807\u63cf\u8ff0\u4e0e\u610f\u56fe\u7b49\u6587\u672c\u811a\u624b\u67b6\uff0c\u8df3\u8fc7\u56fe\u50cf\u8fd4\u56de\uff0c\u5e76\u7cfb\u7edf\u9a8c\u8bc1\u5176\u6709\u6548\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09682", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["TextCall \u5c06\u5de5\u5177\u8fd4\u56de\u56fe\u50cf\u66ff\u6362\u4e3a\u5360\u4f4d\u7b26\uff0c\u4f46\u4fdd\u7559\u5de5\u5177\u8c03\u7528\u6587\u672c\uff0c\u5728 LoRA\u3001\u5168\u91cf\u5fae\u8c03\u548c\u5f3a\u5316\u5b66\u4e60\u8bbe\u7f6e\u4e0b\u53ef\u5339\u914d\u6216\u8d85\u8fc7\u5b8c\u6574\u56fe\u50cf\u5de5\u5177\u65b9\u6848\u3002", "\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u5339\u914d\u8bad\u7ec3\u67e5\u8be2\u4e0a\uff0c\u4ec5\u4f7f\u7528\u6587\u672c\u811a\u624b\u67b6\u4e0e\u4f7f\u7528\u8fd4\u56de\u56fe\u50cf\u7684\u51c6\u786e\u7387\u76f8\u5f53\uff0c\u8bf4\u660e\u7ed3\u6784\u5316\u8c03\u7528\u6587\u672c\u672c\u8eab\u5df2\u63d0\u4f9b\u5173\u952e\u63a8\u7406\u4fe1\u53f7\u3002", "\u5206\u89e3\u5206\u6790\u53d1\u73b0\uff0c\u63a8\u7406\u6587\u672c\u4e0e\u7a7a\u95f4\u4ee3\u7801/\u5750\u6807\u4fe1\u606f\u90fd\u5bf9\u6027\u80fd\u6709\u8d21\u732e\uff0c\u4e3b\u5bfc\u56e0\u7d20\u968f\u4efb\u52a1\u53d8\u5316\uff1b\u540c\u65f6 TextCall \u53ef\u964d\u4f4e 29-46% \u5ef6\u8fdf\u5e76\u51cf\u5c11\u5de5\u5177\u6267\u884c API \u8c03\u7528\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5de5\u5177\u4f7f\u7528", "\u89c6\u89c9\u63a8\u7406", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09682v1", "published_at": "2026-08-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Thinking With Tools, Not With Pixels: Tool Calls as Text Scaffolds for Visual Reasoning", "tldr": "\u89c6\u89c9\u63a8\u7406\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u5de5\u5177\u8c03\u7528\u6587\u672c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Tool-Call Scaffold Hypothesis\uff1a\u5728\u5f53\u524d\u201c\u770b\u56fe\u601d\u8003\u201d\u5f0f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u771f\u6b63\u8d77\u4f5c\u7528\u7684\u4e0d\u662f\u5de5\u5177\u8fd4\u56de\u7684\u56fe\u50cf\u50cf\u7d20\uff0c\u800c\u662f\u8c03\u7528\u5de5\u5177\u524d\u751f\u6210\u7684\u7ed3\u6784\u5316\u6587\u672c\u3002\u4f5c\u8005\u8bbe\u8ba1 TextCall\uff0c\u53ea\u4fdd\u7559\u5de5\u5177\u540d\u3001\u5750\u6807\u3001\u76ee\u6807\u63cf\u8ff0\u4e0e\u610f\u56fe\u7b49\u6587\u672c\u811a\u624b\u67b6\uff0c\u8df3\u8fc7\u56fe\u50cf\u8fd4\u56de\uff0c\u5e76\u7cfb\u7edf\u9a8c\u8bc1\u5176\u6709\u6548\u6027\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u6311\u6218\u4e86\u5de5\u5177\u589e\u5f3a\u89c6\u89c9\u63a8\u7406\u4e2d\u201c\u8fd4\u56de\u50cf\u7d20\u662f\u5173\u952e\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u6307\u51fa\u6a21\u578b\u53ef\u80fd\u4e3b\u8981\u4f9d\u8d56\u5de5\u5177\u8c03\u7528\u65f6\u751f\u6210\u7684\u6587\u672c\u7ed3\u6784\u6765\u5b8c\u6210\u5b9a\u4f4d\u4e0e\u63a8\u7406\u3002\u5b83\u4e0d\u4ec5\u4e3a\u7406\u89e3 VLM \u5de5\u5177\u4f7f\u7528\u673a\u5236\u63d0\u4f9b\u4e86\u65b0\u89e3\u91ca\uff0c\u4e5f\u5e26\u6765\u66f4\u4f4e\u6210\u672c\u3001\u4f4e\u5ef6\u8fdf\u7684\u63a8\u7406\u8303\u5f0f\u3002"}, {"abstract": "Human evaluation of AI systems and digital products is costly, slow, and difficult to scale. Offline evaluations are more scalable but often abstract away human diversity and interactive behavior. We therefore introduce MatrAIx, a population-scale simulated-user evaluation infrastructure for testing AI systems and digital products with heterogeneous users. MatrAIx has three core components: First, Persona 8B contains 8.3 billion persona records represented by 1,290 categorical dimensions. Records are either sampled from a dependency graph that preserves correlated attributes or derived from human-authored profiles. We release a quality-filtered coreset of approximately 1 million personas, comprising 599,847 human-grounded and 400,000 synthetic records. Second, the MatrAIx Playground provides four environments in which diverse users evaluate and interact with digital products: Survey, AI Chatbot, Web, and App. Third, MatrAIx provides 1,010 application tasks spanning more than 25 domains, including Commerce, Software, Finance, and Healthcare. We conducted 18,189 evaluation trials across eight representative tasks. Persona agents were powered by three LLMs: Claude Opus 4.8, GPT 5.5, and Claude Haiku 4.5. The resulting feedback captures how decisions and preferences vary across persona backgrounds, including hesitation after a price increase, willingness to continue after an AI assistant fails, and latency tolerance. We conducted two main validation studies: First, a 400-trial controlled study evaluated persona adherence across ten behavioral attributes and all four environments. The declared behavior was expressed or correctly suppressed in 366 trials (91.5%). Second, human and LLM judges evaluated the extraction quality of human-grounded personas. Overall, MatrAIx provides an end-to-end infrastructure for evaluating AI systems and digital products with diverse simulated human users.", "arxiv_id": "2608.04205", "arxiv_url": "https://arxiv.org/abs/2608.04205", "authors": ["Xiaomin Li", "Yuexing Hao", "Jianheng Hou", "Jintao Huang", "Qianfeng Wen", "Shirley Huang", "Yifan Liu", "Xiaoyi Liu", "Yilan Fan", "Yijun Wang", "Koutian Wu", "Ruoqi Gao", "Muhammad Ahmed Mohsin", "Jing Tang", "Brihi Joshi", "Heming Liu", "Zheyuan Deng", "Zonglin Di", "Sankalp Jajee", "Jiuyao Lu", "Zhiwei Zhang", "Saksham Kapoor", "Ishan Gupta", "Yunhan Zhao", "Chanwoo Park", "Yucheng Lu", "Bing Hu", "Weihang Xiao", "Aravind Mohan", "Hanwen Xing", "Runyu Zhang", "Mihir Kulshreshtha", "Yuanda Xu", "Qianyu Zhu", "Dianzhuo Wang", "Yuxin Xiao", "Bowen Jiang", "Yongye Su", "Wenhao Chai", "Zuxin Liu", "Lawrence Yunliang Chen", "Xuandong Zhao", "Ethan Ye", "Shivam Patel", "Jason Xie", "Alex Martin Richmond", "Weixiang Ding", "Emre Okcular", "Diya Mathew", "Ziheng Wang", "Rana M. Shahroz Khan", "Zhejian Peng", "Fang Wu", "Fan Nie", "Xinyang Han", "Yubin Kim", "Jiawei Zhang", "Zhenting Qi", "Huangyuan Su", "Xu Pan", "Abinitha Gourabathina", "Hyewon Jeong", "Hemanth Neelgund Ramesh", "Kumail Alhamoud", "Kimia Hamidieh", "Zidi Xiong", "Samuel Schmidgall", "Pengrui Han", "Yepeng Huang", "Yongheng Wang", "Bowen Yang", "Alex Gu", "Yuchu Wang", "Akshay Paruchuri", "Brenna Li", "Hejie Cui", "Jiayuan Ding", "Chaosheng Dong", "Jiahao Wang", "Yixuan He", "Chi Wang", "Pamela Bhattacharya", "Tianyi Peng", "Paul Pu Liang", "Mitchell Gordon", "Yilun Du", "Marinka Zitnik", "James Zou", "Prasanna Tambe", "Philip Torr", "Emily Fox", "Asu Ozdaglar", "Dawn Song"], "brief": "\u8bba\u6587\u63d0\u51fa MatrAIx\uff0c\u4e00\u4e2a\u9762\u5411 AI \u7cfb\u7edf\u4e0e\u6570\u5b57\u4ea7\u54c1\u7684\u7fa4\u4f53\u7ea7\u6a21\u62df\u7528\u6237\u8bc4\u6d4b\u57fa\u7840\u8bbe\u65bd\u3002\u5b83\u6784\u5efa\u4e86\u5305\u542b 83 \u4ebf persona \u8bb0\u5f55\u7684 Persona 8B\uff0c\u5e76\u63d0\u4f9b Survey\u3001AI Chatbot\u3001Web\u3001App \u56db\u7c7b\u4ea4\u4e92\u73af\u5883\u548c 1010 \u4e2a\u8de8\u9886\u57df\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/MatrAIx-ai/MatrAIx-Persona-8B", "github_stars": 498, "hf_url": "https://huggingface.co/papers/2608.04205", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Persona 8B \u7528 1290 \u4e2a\u7c7b\u522b\u7ef4\u5ea6\u8868\u793a\u7528\u6237\u753b\u50cf\uff0c\u5e76\u901a\u8fc7\u4f9d\u8d56\u56fe\u91c7\u6837\u4fdd\u6301\u5c5e\u6027\u76f8\u5173\u6027\uff1b\u540c\u65f6\u53d1\u5e03\u7ea6 100 \u4e07\u9ad8\u8d28\u91cf coreset\u3002", "MatrAIx Playground \u652f\u6301\u6a21\u62df\u7528\u6237\u5728\u95ee\u5377\u3001\u804a\u5929\u673a\u5668\u4eba\u3001\u7f51\u9875\u548c\u5e94\u7528\u73af\u5883\u4e2d\u4e0e\u4ea7\u54c1\u4ea4\u4e92\u3002", "\u5728 18189 \u6b21\u8bc4\u6d4b\u8bd5\u9a8c\u548c 400 \u6b21\u53d7\u63a7\u9a8c\u8bc1\u4e2d\uff0cpersona \u884c\u4e3a\u5c5e\u6027\u9075\u5faa\u7387\u8fbe\u5230 91.5%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7528\u6237\u6a21\u62df", "\u8bc4\u6d4b\u57fa\u51c6", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 2, "on_hf": true, "organization": "MatrAIx", "pdf_url": "https://arxiv.org/pdf/2608.04205v1", "published_at": "2026-08-04", "score": 0.335, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04205.png", "title": "MatrAIx: Simulating the World with 8.3 Billion Persona Agents", "tldr": "\u752883\u4ebf\u4eba\u683c\u667a\u80fd\u4f53\u89c4\u6a21\u5316\u8bc4\u6d4b\u4ea7\u54c1", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa MatrAIx\uff0c\u4e00\u4e2a\u9762\u5411 AI \u7cfb\u7edf\u4e0e\u6570\u5b57\u4ea7\u54c1\u7684\u7fa4\u4f53\u7ea7\u6a21\u62df\u7528\u6237\u8bc4\u6d4b\u57fa\u7840\u8bbe\u65bd\u3002\u5b83\u6784\u5efa\u4e86\u5305\u542b 83 \u4ebf persona \u8bb0\u5f55\u7684 Persona 8B\uff0c\u5e76\u63d0\u4f9b Survey\u3001AI Chatbot\u3001Web\u3001App \u56db\u7c7b\u4ea4\u4e92\u73af\u5883\u548c 1010 \u4e2a\u8de8\u9886\u57df\u4efb\u52a1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bd5\u56fe\u628a\u6602\u8d35\u3001\u4f4e\u6269\u5c55\u6027\u7684\u4eba\u7c7b\u8bc4\u6d4b\u8f6c\u5316\u4e3a\u53ef\u89c4\u6a21\u5316\u3001\u53ef\u8986\u76d6\u5f02\u8d28\u4eba\u7fa4\u7684\u6a21\u62df\u7528\u6237\u5b9e\u9a8c\uff0c\u5bf9 AI \u4ea7\u54c1\u6d4b\u8bd5\u3001\u7528\u6237\u7814\u7a76\u548c\u667a\u80fd\u4f53\u8bc4\u4f30\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent works train agents by constructing large-scale multimodal environment pools. However, we find that simply increasing the number of multimodal environments does not always benefit. We further analyze the limitations in current multimodal environment distributions through a series of experiments. Based on these findings, we study how to build more effective training environment distributions from two dimensions: **diversity** and **difficulty structure**. For diversity, we propose **Ability-aware Environment Selection (AES)** to obtain diverse environment sets. For difficulty structure, we propose **Hierarchical Difficulty Curriculum (HDC)**, which organizes curriculum learning through two difficulty levels: harness weakening and state-scale progression. Experiments show that AES and HDC effectively improve multimodal agent training.", "arxiv_id": "2608.03571", "arxiv_url": "https://arxiv.org/abs/2608.03571", "authors": ["Kejian Zhu", "Zhuoran Jin", "Dongqi Huang", "Hongbang Yuan", "Yupu Hao", "Kang Liu", "Jun Zhao"], "brief": "\u8bba\u6587\u6307\u51fa\u5355\u7eaf\u6269\u5927\u591a\u6a21\u6001\u73af\u5883\u6c60\u89c4\u6a21\u5e76\u4e0d\u603b\u80fd\u63d0\u5347\u667a\u80fd\u4f53\u5b66\u4e60\u6548\u679c\uff0c\u5e76\u7cfb\u7edf\u5206\u6790\u73b0\u6709\u73af\u5883\u5206\u5e03\u7684\u5c40\u9650\u3002\u57fa\u4e8e\u591a\u6837\u6027\u4e0e\u96be\u5ea6\u7ed3\u6784\u4e24\u6761\u4e3b\u7ebf\uff0c\u63d0\u51fa\u80fd\u529b\u611f\u77e5\u73af\u5883\u9009\u62e9 AES \u548c\u5206\u5c42\u96be\u5ea6\u8bfe\u7a0b HDC \u6765\u6784\u5efa\u66f4\u6709\u6548\u7684\u8bad\u7ec3\u73af\u5883\u5206\u5e03\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/GaryStack/Beyond-MMEnv-Scaling", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2608.03571", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u73af\u5883\u6570\u91cf\u6269\u5f20\u5b58\u5728\u8fb9\u9645\u6536\u76ca\u751a\u81f3\u65e0\u6548\u95ee\u9898\uff0c\u5173\u952e\u5728\u4e8e\u73af\u5883\u5206\u5e03\u7684\u591a\u6837\u6027\u4e0e\u96be\u5ea6\u7ec4\u7ec7", "\u63d0\u51fa AES\uff0c\u6839\u636e\u667a\u80fd\u4f53\u80fd\u529b\u8986\u76d6\u9009\u62e9\u66f4\u5177\u591a\u6837\u6027\u7684\u73af\u5883\u96c6\u5408", "\u63d0\u51fa HDC\uff0c\u901a\u8fc7\u5de5\u5177/\u7ea6\u675f\u5f31\u5316\u4e0e\u72b6\u6001\u89c4\u6a21\u9012\u8fdb\u6784\u5efa\u5206\u5c42\u8bfe\u7a0b\u5b66\u4e60"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u8bfe\u7a0b\u5b66\u4e60", "\u73af\u5883\u6784\u5efa"], "num_comments": 2, "on_hf": true, "organization": "Chinese Academic of Science Institute of Automation", "pdf_url": "https://arxiv.org/pdf/2608.03571v2", "published_at": "2026-08-04", "score": 0.291, "selected_reasons": ["HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03571.png", "title": "Beyond Simply Environment Scaling: Designing Effective Environment Distributions for Multimodal Agent Learning", "tldr": "\u8bbe\u8ba1\u66f4\u4f18\u73af\u5883\u5206\u5e03\u63d0\u5347\u591a\u6a21\u6001\u667a\u80fd\u4f53\u8bad\u7ec3", "upvotes": 28, "what_it_is": "\u8bba\u6587\u6307\u51fa\u5355\u7eaf\u6269\u5927\u591a\u6a21\u6001\u73af\u5883\u6c60\u89c4\u6a21\u5e76\u4e0d\u603b\u80fd\u63d0\u5347\u667a\u80fd\u4f53\u5b66\u4e60\u6548\u679c\uff0c\u5e76\u7cfb\u7edf\u5206\u6790\u73b0\u6709\u73af\u5883\u5206\u5e03\u7684\u5c40\u9650\u3002\u57fa\u4e8e\u591a\u6837\u6027\u4e0e\u96be\u5ea6\u7ed3\u6784\u4e24\u6761\u4e3b\u7ebf\uff0c\u63d0\u51fa\u80fd\u529b\u611f\u77e5\u73af\u5883\u9009\u62e9 AES \u548c\u5206\u5c42\u96be\u5ea6\u8bfe\u7a0b HDC \u6765\u6784\u5efa\u66f4\u6709\u6548\u7684\u8bad\u7ec3\u73af\u5883\u5206\u5e03\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u201c\u5806\u89c4\u6a21\u201d\u8f6c\u5411\u201c\u8bbe\u8ba1\u5206\u5e03\u201d\uff0c\u4e3a\u591a\u6a21\u6001\u667a\u80fd\u4f53\u8bad\u7ec3\u73af\u5883\u6784\u5efa\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u65b9\u6cd5\uff0c\u53ef\u80fd\u63d0\u5347\u8bad\u7ec3\u6548\u7387\u3001\u6cdb\u5316\u80fd\u529b\u4e0e\u590d\u6742\u4efb\u52a1\u5b66\u4e60\u6548\u679c\u3002"}, {"abstract": "Autoregressive models accumulate error over long rollouts, yet at deployment there is no ground truth to measure it against. We train a single conditional latent diffusion model that steps a dynamical system forward or backward in time via a direction flag, and show that this bidirectionality supplies a measurement-free test-time error signal: rolling forward $i$ steps and then backward $i$ steps must return the model to its start, so the round-trip discrepancy $\\mathcal{C}_i$ is a self-supervised proxy for the unobservable rollout error: no ensembles, no held-out data, no governing equations, for one extra rollout. We validate on compressible magnetohydrodynamics (MHD), an astrophysical turbulent radiative mixing layer, and natural face videos (CelebV-HQ). On held-out MHD trajectories, $\\mathcal{C}_i$ ranks rollout error (Spearman $0.91$-$0.98$ at fixed depth; $0.69 \\pm 0.16$ within trajectories), and a simple calibrator fit on training rollouts predicts its magnitude to within $1.14\\times$ ($68\\%$) and $1.29\\times$ ($95\\%$) with near-nominal coverage - one nat beyond a depth-only predictor, transferring to all six decoded physical fields. The same signal flags the out-of-distribution Orszag-Tang vortex (AUROC $0.98$; $1.0$ by depth $10$) exactly where sampling-dispersion baselines invert, and it cuts incurred error by $15\\%$ at $80\\%$ coverage - three times the depth-only baseline. Bidirectional training comes at negative cost, beating direction specialists in both directions, and the backward direction doubles as a fast inverse solver. On LE-PDE-UQ\u0027s turbulent Navier-Stokes benchmark, a single bidirectional model reaches accuracy within $1.3\\times$ of their ten-model ensemble at a tenth of the training cost, with the best training-free pixel-level calibration. Round-trip consistency turns reversibility into a practical trust signal for generative models.", "arxiv_id": "2608.00675", "arxiv_url": "https://arxiv.org/abs/2608.00675", "authors": ["Alexander Scheinker"], "brief": "\u8bba\u6587\u8bad\u7ec3\u4e00\u4e2a\u53ef\u6309\u65b9\u5411\u6807\u5fd7\u524d\u5411\u6216\u540e\u5411\u63a8\u8fdb\u52a8\u529b\u7cfb\u7edf\u7684\u6761\u4ef6\u6f5c\u7a7a\u95f4\u6269\u6563\u6a21\u578b\uff0c\u5e76\u5229\u7528\u201c\u524d\u8fdb i \u6b65\u518d\u540e\u9000 i \u6b65\u5e94\u56de\u5230\u8d77\u70b9\u201d\u7684\u5f80\u8fd4\u5dee\u5f02\u4f5c\u4e3a\u6d4b\u8bd5\u65f6\u8bef\u5dee\u4fe1\u53f7\u3002\u8be5\u4fe1\u53f7\u65e0\u9700\u771f\u5b9e\u6807\u7b7e\u3001\u96c6\u6210\u6a21\u578b\u3001\u63a7\u5236\u65b9\u7a0b\u6216\u989d\u5916\u9a8c\u8bc1\u6570\u636e\uff0c\u5c31\u80fd\u4f30\u8ba1\u957f\u7a0b\u81ea\u56de\u5f52 rollout \u7684\u8bef\u5dee\u4e0e\u4e0d\u786e\u5b9a\u6027\u3002", "categories": ["stat.ML", "cs.LG", "physics.comp-ph", "physics.plasm-ph"], "github_repo": "https://github.com/alexscheinker/round-trip-consistency", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2608.00675", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728 MHD\u3001\u5929\u4f53\u6e4d\u6d41\u8f90\u5c04\u6df7\u5408\u5c42\u3001CelebV-HQ \u89c6\u9891\u548c Navier-Stokes \u57fa\u51c6\u4e0a\u9a8c\u8bc1\uff0c\u5f80\u8fd4\u5dee\u5f02\u4e0e\u771f\u5b9e rollout \u8bef\u5dee\u9ad8\u5ea6\u76f8\u5173\uff0cMHD \u56fa\u5b9a\u6df1\u5ea6 Spearman \u8fbe 0.91-0.98\u3002", "\u7b80\u5355\u6821\u51c6\u5668\u53ef\u5c06\u8bef\u5dee\u5e45\u5ea6\u9884\u6d4b\u5230 68% \u533a\u95f4 1.14\u00d7\u300195% \u533a\u95f4 1.29\u00d7\uff0c\u5e76\u80fd\u8fc1\u79fb\u5230\u516d\u4e2a\u89e3\u7801\u7269\u7406\u573a\u3002", "\u53ef\u68c0\u6d4b\u5206\u5e03\u5916 Orszag-Tang vortex\uff0cAUROC 0.98\uff0c\u6df1\u5ea6 10 \u8fbe 1.0\uff1b\u5728 80% \u8986\u76d6\u4e0b\u5c06\u5b9e\u9645\u8bef\u5dee\u964d\u4f4e 15%\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u7269\u7406\u4eff\u771f", "\u52a8\u529b\u7cfb\u7edf"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00675v1", "published_at": "2026-08-01", "score": 0.28, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00675.png", "title": "Round-Trip Consistency: Bidirectional Diffusion Models Can Predict Their Own Rollout Errors", "tldr": "\u53cc\u5411\u6269\u6563\u7528\u5f80\u8fd4\u4e00\u81f4\u6027\u81ea\u6d4b rollout \u8bef\u5dee", "upvotes": 6, "what_it_is": "\u8bba\u6587\u8bad\u7ec3\u4e00\u4e2a\u53ef\u6309\u65b9\u5411\u6807\u5fd7\u524d\u5411\u6216\u540e\u5411\u63a8\u8fdb\u52a8\u529b\u7cfb\u7edf\u7684\u6761\u4ef6\u6f5c\u7a7a\u95f4\u6269\u6563\u6a21\u578b\uff0c\u5e76\u5229\u7528\u201c\u524d\u8fdb i \u6b65\u518d\u540e\u9000 i \u6b65\u5e94\u56de\u5230\u8d77\u70b9\u201d\u7684\u5f80\u8fd4\u5dee\u5f02\u4f5c\u4e3a\u6d4b\u8bd5\u65f6\u8bef\u5dee\u4fe1\u53f7\u3002\u8be5\u4fe1\u53f7\u65e0\u9700\u771f\u5b9e\u6807\u7b7e\u3001\u96c6\u6210\u6a21\u578b\u3001\u63a7\u5236\u65b9\u7a0b\u6216\u989d\u5916\u9a8c\u8bc1\u6570\u636e\uff0c\u5c31\u80fd\u4f30\u8ba1\u957f\u7a0b\u81ea\u56de\u5f52 rollout \u7684\u8bef\u5dee\u4e0e\u4e0d\u786e\u5b9a\u6027\u3002", "why_notable": "\u5b83\u628a\u65f6\u95f4\u53ef\u9006\u6027\u8f6c\u5316\u4e3a\u751f\u6210\u5f0f\u52a8\u529b\u6a21\u578b\u7684\u5b9e\u7528\u53ef\u4fe1\u5ea6\u4fe1\u53f7\uff0c\u89e3\u51b3\u90e8\u7f72\u65f6\u65e0\u771f\u5b9e\u6807\u7b7e\u96be\u4ee5\u8bc4\u4f30\u957f\u7a0b\u8bef\u5dee\u7684\u95ee\u9898\uff1b\u540c\u65f6\u5355\u4e2a\u53cc\u5411\u6a21\u578b\u8bad\u7ec3\u6210\u672c\u4f4e\u4e8e\u96c6\u6210\u65b9\u6cd5\uff0c\u8fd8\u53ef\u517c\u4f5c\u5feb\u901f\u9006\u5411\u6c42\u89e3\u5668\u3002"}, {"abstract": "Large language models fine-tuned on human behavioural data have emerged as general-purpose cognitive proxies, but the scale this requires, and whether these models process task structure or exploit statistical shortcuts, remain open questions. We train fourteen models from 135M to 14B parameters across four architecture families on Psych-101, a dataset of 10.7 million trial-level choices from 160 experiments. For in-distribution simulations, scale barely matters. The models fall within a narrow band, as though against a ceiling, and 0.6B to 1B parameters suffice to match a 70B baseline on held-out participants. Out-of-distribution, that band opens into a markedly steeper scaling gradient, with larger models clearly advantaged in generalisation to novel task structure. To determine what information these models use, we run two diagnostics. We progressively strip four prompt channels -- task instructions, experimental stimuli, outcome feedback, and choice history -- across 27 experiments, and permute trial order. Masking the content of stimuli and feedback destroys 75.7% of learned information and pushes models below chance, demonstrating that choice history alone does not account for performance. Permutation reveals invariance on tasks with independent trials but sensitivity where trial order is determined by prior responses. Small cognitively fine-tuned models therefore show promise as noise ceiling estimators for psychological experiments, though their scope remains bounded by the paradigms seen in training.", "arxiv_id": "2608.05224", "arxiv_url": "https://arxiv.org/abs/2608.05224", "authors": ["Nick Oh", "Fernand Gobet"], "brief": "\u8bba\u6587\u5728 Psych-101 \u4e0a\u8bad\u7ec3\u4e8614\u4e2a\u4e0d\u540c\u89c4\u6a21\u4e0e\u67b6\u6784\u7684\u6a21\u578b\uff0c\u7528\u4e8e\u6a21\u62df160\u4e2a\u5fc3\u7406\u5b66\u5b9e\u9a8c\u4e2d\u7684\u4eba\u7c7b\u8bd5\u6b21\u7ea7\u9009\u62e9\u884c\u4e3a\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5206\u5e03\u5185\u6a21\u62df\u4e2d0.6B\u52301B\u53c2\u6570\u6a21\u578b\u5df2\u63a5\u8fd170B\u57fa\u7ebf\uff0c\u4f46\u5206\u5e03\u5916\u6cdb\u5316\u4ecd\u660e\u663e\u4f9d\u8d56\u6a21\u578b\u89c4\u6a21\u3002", "categories": ["cs.AI", "cs.CY"], "github_repo": "https://github.com/socius-org/Centauri", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.05224", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u7528\u5305\u542b1070\u4e07\u6761\u8bd5\u6b21\u7ea7\u9009\u62e9\u3001\u8986\u76d6160\u4e2a\u5b9e\u9a8c\u7684 Psych-101 \u6570\u636e\u96c6\u8fdb\u884c\u8ba4\u77e5\u884c\u4e3a\u5fae\u8c03\u3002", "\u5206\u5e03\u5185\u4efb\u52a1\u4e2d\u6a21\u578b\u8868\u73b0\u63a5\u8fd1\u4e0a\u9650\uff0c\u5c0f\u6a21\u578b\u5373\u53ef\u5339\u914d\u5927\u6a21\u578b\uff1b\u4f46\u9762\u5bf9\u65b0\u4efb\u52a1\u7ed3\u6784\u65f6\uff0c\u5927\u6a21\u578b\u6cdb\u5316\u4f18\u52bf\u66f4\u660e\u663e\u3002", "\u901a\u8fc7\u906e\u853d\u63d0\u793a\u901a\u9053\u548c\u6253\u4e71\u8bd5\u6b21\u987a\u5e8f\u8bca\u65ad\u6a21\u578b\u4fe1\u606f\u6765\u6e90\uff0c\u53d1\u73b0\u523a\u6fc0\u4e0e\u53cd\u9988\u5185\u5bb9\u8d21\u732e\u4e86\u5927\u90e8\u5206\u5b66\u4e60\u4fe1\u606f\uff0c\u9009\u62e9\u5386\u53f2\u4e0d\u8db3\u4ee5\u89e3\u91ca\u6027\u80fd\u3002"], "keywords": ["\u8ba4\u77e5\u5efa\u6a21", "\u57fa\u7840\u6a21\u578b", "\u884c\u4e3a\u6a21\u62df", "\u6cdb\u5316"], "num_comments": 4, "on_hf": true, "organization": "socius labs", "pdf_url": "https://arxiv.org/pdf/2608.05224v2", "published_at": "2026-08-05", "score": 0.257, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05224.png", "title": "Small Foundation Models of Human Cognition and Behaviour", "tldr": "\u5c0f\u6a21\u578b\u4e5f\u80fd\u6709\u6548\u6a21\u62df\u4eba\u7c7b\u8ba4\u77e5\u884c\u4e3a", "upvotes": 8, "what_it_is": "\u8bba\u6587\u5728 Psych-101 \u4e0a\u8bad\u7ec3\u4e8614\u4e2a\u4e0d\u540c\u89c4\u6a21\u4e0e\u67b6\u6784\u7684\u6a21\u578b\uff0c\u7528\u4e8e\u6a21\u62df160\u4e2a\u5fc3\u7406\u5b66\u5b9e\u9a8c\u4e2d\u7684\u4eba\u7c7b\u8bd5\u6b21\u7ea7\u9009\u62e9\u884c\u4e3a\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5206\u5e03\u5185\u6a21\u62df\u4e2d0.6B\u52301B\u53c2\u6570\u6a21\u578b\u5df2\u63a5\u8fd170B\u57fa\u7ebf\uff0c\u4f46\u5206\u5e03\u5916\u6cdb\u5316\u4ecd\u660e\u663e\u4f9d\u8d56\u6a21\u578b\u89c4\u6a21\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u201c\u8ba4\u77e5\u4ee3\u7406\u5fc5\u987b\u4f9d\u8d56\u8d85\u5927\u6a21\u578b\u201d\u7684\u5047\u8bbe\uff0c\u8868\u660e\u5c0f\u578b\u5fae\u8c03\u6a21\u578b\u53ef\u4f5c\u4e3a\u5fc3\u7406\u5b66\u5b9e\u9a8c\u7684\u566a\u58f0\u4e0a\u9650\u4f30\u8ba1\u5668\uff0c\u540c\u65f6\u4e5f\u63ed\u793a\u5176\u6cdb\u5316\u8fb9\u754c\u4e0e\u5bf9\u4efb\u52a1\u7ed3\u6784\u7684\u4f9d\u8d56\u3002"}, {"abstract": "Small language models are often the only option for deployment under tight latency, cost, and on-premises constraints, but they are rarely trained from scratch: a compressed model is usually recovered through knowledge distillation (KD). This recovery step largely decides the final quality, yet it is expensive. We present a practitioner\u0027s study of how to make distillation training efficient, organised around two systems contributions. First, we show that offline KD (caching the teacher\u0027s top-$K$ logits once and training the student against the cache) matches online distillation at near-identical training loss while removing the teacher from memory, running about 29\\% faster per iteration, and reaching up to 41\\% higher throughput on a single H200 GPU. Second, we introduce a \\emph{fused, chunked KL loss} that never materialises the full vocabulary-sized logit tensor, making peak memory linear in the sequence length. This removes the memory spike that otherwise caps context length and lets us train at four times the context (32{,}768 tokens) on a single GPU. A separate output-head-only toy benchmark isolates the loss kernel and confirms its memory and iteration-rate scaling from 4K to 256K tokens. Together these make large-scale healing and hundreds of ablations affordable. We also report supporting ablations on loss design and sequence packing. We release our chunked-loss implementation: https://github.com/CompactifAI/Full-Chunked-KL-Loss.", "arxiv_id": "2608.03796", "arxiv_url": "https://arxiv.org/abs/2608.03796", "authors": ["Bakbergen Ryskulov", "Iker Garc\u00eda-Ferrero", "David Montero", "David Jansen", "Ali Hashemi", "Jezabel R. Garcia", "Antonio Tiene", "Rom\u00e1n Or\u00fas"], "brief": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u964d\u4f4e\u5c0f\u8bed\u8a00\u6a21\u578b\u77e5\u8bc6\u84b8\u998f\u6210\u672c\uff0c\u63d0\u51fa\u79bb\u7ebf\u7f13\u5b58\u6559\u5e08\u6a21\u578bTop-K logits\u7684\u84b8\u998f\u6d41\u7a0b\uff0c\u4ee5\u53ca\u4e0d\u663e\u5f0f\u5c55\u5f00\u5b8c\u6574\u8bcd\u8868logits\u7684\u878d\u5408\u5206\u5757KL\u635f\u5931\u3002\u4e24\u8005\u7ed3\u5408\u53ef\u63d0\u5347\u8bad\u7ec3\u541e\u5410\u5e76\u663e\u8457\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u84b8\u998f\u7684\u663e\u5b58\u5cf0\u503c\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/CompactifAI/Full-Chunked-KL-Loss", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.03796", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u79bb\u7ebfKD\u5c06\u6559\u5e08Top-K logits\u9884\u5148\u7f13\u5b58\uff0c\u8bad\u7ec3\u635f\u5931\u63a5\u8fd1\u5728\u7ebf\u84b8\u998f\uff0c\u540c\u65f6\u79fb\u9664\u6559\u5e08\u6a21\u578b\u663e\u5b58\u5360\u7528\uff0c\u5355\u5f20H200\u4e0a\u5355\u8fed\u4ee3\u7ea6\u5feb29%\u3001\u541e\u5410\u6700\u9ad8\u63d0\u534741%", "\u63d0\u51fafused chunked KL loss\uff0c\u907f\u514d\u7269\u5316\u5b8c\u6574\u8bcd\u8868\u5927\u5c0f\u7684logit\u5f20\u91cf\uff0c\u4f7f\u5cf0\u503c\u663e\u5b58\u968f\u5e8f\u5217\u957f\u5ea6\u7ebf\u6027\u589e\u957f", "\u5728\u5355GPU\u4e0a\u652f\u63014\u500d\u4e0a\u4e0b\u6587\u957f\u5ea6\u8bad\u7ec3\uff0c\u53ef\u8fbe32,768 tokens\uff1b\u72ec\u7acbtoy benchmark\u9a8c\u8bc14K\u5230256K tokens\u8303\u56f4\u5185\u7684\u663e\u5b58\u4e0e\u901f\u5ea6\u6269\u5c55\u6027"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bad\u7ec3\u6548\u7387", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 3, "on_hf": true, "organization": "Multiverse Computing", "pdf_url": "https://arxiv.org/pdf/2608.03796v1", "published_at": "2026-08-04", "score": 0.256, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03796.png", "title": "Efficient Knowledge Distillation for LLMs: Offline Top-K Logits and a Fused Chunked KL Loss", "tldr": "\u7528\u79bb\u7ebfTop-K\u4e0e\u5206\u5757KL\u9ad8\u6548\u84b8\u998fLLM", "upvotes": 9, "what_it_is": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u964d\u4f4e\u5c0f\u8bed\u8a00\u6a21\u578b\u77e5\u8bc6\u84b8\u998f\u6210\u672c\uff0c\u63d0\u51fa\u79bb\u7ebf\u7f13\u5b58\u6559\u5e08\u6a21\u578bTop-K logits\u7684\u84b8\u998f\u6d41\u7a0b\uff0c\u4ee5\u53ca\u4e0d\u663e\u5f0f\u5c55\u5f00\u5b8c\u6574\u8bcd\u8868logits\u7684\u878d\u5408\u5206\u5757KL\u635f\u5931\u3002\u4e24\u8005\u7ed3\u5408\u53ef\u63d0\u5347\u8bad\u7ec3\u541e\u5410\u5e76\u663e\u8457\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u84b8\u998f\u7684\u663e\u5b58\u5cf0\u503c\u3002", "why_notable": "\u8bba\u6587\u9762\u5411\u5b9e\u9645LLM\u538b\u7f29\u90e8\u7f72\u4e2d\u7684\u6838\u5fc3\u74f6\u9888\uff0c\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u7684\u7cfb\u7edf\u7ea7\u4f18\u5316\uff0c\u80fd\u8ba9\u5927\u89c4\u6a21\u84b8\u998f\u3001\u6a21\u578b\u4fee\u590d\u548c\u5927\u91cf\u6d88\u878d\u5b9e\u9a8c\u66f4\u4fbf\u5b9c\u3001\u66f4\u53ef\u884c\uff0c\u5c24\u5176\u9002\u5408\u8d44\u6e90\u53d7\u9650\u573a\u666f\u4e0b\u7684\u5c0f\u6a21\u578b\u8bad\u7ec3\u3002"}, {"abstract": "Audio reasoning is essential for machine understanding of the acoustic world. Reinforcement learning with verifiable rewards can elicit such reasoning, yet existing reward designs are complementary in their limitations: outcome-based rewards supervise only the final answer and let the model reach it without attending to the audio, whereas process-based rewards score the reasoning itself but rely on coarse, hand-crafted, and fixed criteria that neither adapt to each question nor stay grounded in the acoustic evidence. Moreover, questions differ in what they demand, with some hinging on perception and others on multi-step reasoning, and any static criterion weakens as the policy improves. Supervising the reasoning process with fine-grained, audio-grounded, and adaptive rewards is therefore crucial, yet challenging since such rewards are impractical to design by hand for every sample. To this end, we introduce AudioRubrics, a reinforcement learning framework that supervises audio reasoning with self-evolving, audio-grounded rubric rewards. AudioRubrics synthesizes per-sample rubrics from the raw waveform and, conditioned on the model\u0027s own rollouts, regenerates and reweights criteria per group, supplying a continuous learning signal that keeps targeting the current policy\u0027s weaknesses as static criteria saturate. Comprehensive evaluations across three audio reasoning benchmarks reveal that AudioRubrics substantially outperforms a wide range of open-source and training-based baselines. Furthermore, our analysis shows that the gains scale with the capability of the rubric generator and judge, and AudioRubrics converges to a stable reasoning length that avoids both degenerate collapse and unbounded growth. The improvement in audio perception further demonstrates the effectiveness of anchoring supervision in the acoustic evidence. Our project page is available at https://audiorubrics.github.io.", "arxiv_id": "2608.02831", "arxiv_url": "https://arxiv.org/abs/2608.02831", "authors": ["Fangxu Yu", "Tao Feng", "Dehai Min", "Zinan Lin", "Weijia Xu", "Michael Xu", "Philip S. Yu", "Ge Liu", "Tianyi Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa AudioRubrics\uff0c\u4e00\u4e2a\u9762\u5411\u97f3\u9891\u63a8\u7406\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u4ece\u539f\u59cb\u6ce2\u5f62\u4e3a\u6bcf\u4e2a\u6837\u672c\u751f\u6210\u7ec6\u7c92\u5ea6\u3001\u97f3\u9891\u4f9d\u636e\u5316\u7684\u8bc4\u5206\u89c4\u7ea6\uff0c\u5e76\u968f\u6a21\u578b rollout \u52a8\u6001\u66f4\u65b0\u4e0e\u52a0\u6743\uff0c\u7528\u4f5c\u8fc7\u7a0b\u5956\u52b1\u3002", "categories": ["cs.SD", "cs.CL"], "github_repo": "https://github.com/tianyi-lab/AudioRubrics", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.02831", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u7ed3\u679c\u5956\u52b1\u5ffd\u89c6\u97f3\u9891\u8bc1\u636e\u3001\u56fa\u5b9a\u8fc7\u7a0b\u5956\u52b1\u7c97\u7cd9\u4e14\u6613\u9971\u548c\u7684\u95ee\u9898\uff0c\u5f15\u5165\u9010\u6837\u672c\u81ea\u9002\u5e94 rubric \u5956\u52b1\u3002", "rubric \u7531\u97f3\u9891\u5185\u5bb9\u751f\u6210\uff0c\u5e76\u6839\u636e\u5f53\u524d\u7b56\u7565\u8f93\u51fa\u91cd\u65b0\u751f\u6210\u548c\u91cd\u52a0\u6743\uff0c\u6301\u7eed\u9488\u5bf9\u6a21\u578b\u5f31\u70b9\u63d0\u4f9b\u5b66\u4e60\u4fe1\u53f7\u3002", "\u5728\u4e09\u4e2a\u97f3\u9891\u63a8\u7406\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u591a\u79cd\u5f00\u6e90\u4e0e\u8bad\u7ec3\u5f0f\u57fa\u7ebf\uff0c\u5e76\u8868\u73b0\u51fa\u7a33\u5b9a\u7684\u63a8\u7406\u957f\u5ea6\u4e0e\u66f4\u597d\u7684\u97f3\u9891\u611f\u77e5\u80fd\u529b\u3002"], "keywords": ["\u97f3\u9891\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u8fc7\u7a0b\u5956\u52b1", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "University of Maryland College Park", "pdf_url": "https://arxiv.org/pdf/2608.02831v1", "published_at": "2026-08-03", "score": 0.254, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02831.png", "title": "Reinforcement Learning with Evolving Rubrics as Rewards for Audio Reasoning", "tldr": "\u7528\u81ea\u6f14\u5316\u97f3\u9891\u8bc4\u5206\u89c4\u7ea6\u5f3a\u5316\u97f3\u9891\u63a8\u7406", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa AudioRubrics\uff0c\u4e00\u4e2a\u9762\u5411\u97f3\u9891\u63a8\u7406\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u4ece\u539f\u59cb\u6ce2\u5f62\u4e3a\u6bcf\u4e2a\u6837\u672c\u751f\u6210\u7ec6\u7c92\u5ea6\u3001\u97f3\u9891\u4f9d\u636e\u5316\u7684\u8bc4\u5206\u89c4\u7ea6\uff0c\u5e76\u968f\u6a21\u578b rollout \u52a8\u6001\u66f4\u65b0\u4e0e\u52a0\u6743\uff0c\u7528\u4f5c\u8fc7\u7a0b\u5956\u52b1\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u4ece\u9759\u6001\u7b54\u6848\u76d1\u7763\u63a8\u8fdb\u5230\u53ef\u6f14\u5316\u3001\u8bc1\u636e\u9a71\u52a8\u7684\u8fc7\u7a0b\u76d1\u7763\uff0c\u6709\u671b\u63d0\u5347\u97f3\u9891\u5927\u6a21\u578b\u5728\u590d\u6742\u611f\u77e5\u4e0e\u591a\u6b65\u63a8\u7406\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\u548c\u53ef\u8bad\u7ec3\u6027\u3002"}, {"abstract": "CLI-based software-engineering agents have matured rapidly, yet the open ecosystem has converged on a single training environment: trajectory datasets used to fine-tune open models are collected almost exclusively under OpenHands. Models fine-tuned on this data score well under OpenHands but degrade substantially when deployed under any non-training scaffold. Untrained base models do not show this divergence, indicating the gap is fine-tuning-induced and tied to the conventions of the training scaffold. We argue that a load-bearing scaffold-specific behavior is planning structure, in two senses this paper distinguishes: explicit planning, a pre-execution plan produced as a first-class artifact, and implicit planning, the structural conventions that shape execution throughout the agent loop. Under this hypothesis, closing the gap requires moving planning from a fixed scaffold artifact to a learned model capability. We introduce Decoupling CLI Agent Scaffolding (DCAS), a backend-substitution interception layer that routes API traffic between any CLI scaffold and any backend model without modifying the scaffold, enabling cross-scaffold evaluation and planning-aware trajectory collection. Using DCAS, a controlled plan-source intervention confirms planning quality is a high-leverage component, with gains exceeding the cross-scaffold drops we observe. A model fine-tuned on a small set of DCAS-collected planning-aware trajectories under a single scaffold gains consistently across non-training scaffolds, and the two senses of planning are empirically separable in training data.", "arxiv_id": "2608.06113", "arxiv_url": "https://arxiv.org/abs/2608.06113", "authors": ["Kishanthan Thangarajah", "Boyuan Chen", "Ahmed E. Hassan"], "brief": "\u8bba\u6587\u63d0\u51faDCAS\uff0c\u4e00\u4e2a\u65e0\u9700\u4fee\u6539CLI\u811a\u624b\u67b6\u5373\u53ef\u5728\u4efb\u610f\u811a\u624b\u67b6\u4e0e\u540e\u7aef\u6a21\u578b\u95f4\u8f6c\u53d1API\u6d41\u91cf\u7684\u62e6\u622a\u5c42\uff0c\u7528\u4e8e\u8de8\u811a\u624b\u67b6\u8bc4\u6d4b\u4e0e\u91c7\u96c6\u89c4\u5212\u611f\u77e5\u8f68\u8ff9\u3002\u7814\u7a76\u6307\u51fa\u5fae\u8c03\u540e\u7684\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u8fc7\u5ea6\u4f9d\u8d56\u8bad\u7ec3\u811a\u624b\u67b6\u4e2d\u7684\u89c4\u5212\u7ed3\u6784\uff0c\u5e76\u5c1d\u8bd5\u5c06\u89c4\u5212\u4ece\u811a\u624b\u67b6\u7ea6\u5b9a\u5185\u5316\u4e3a\u6a21\u578b\u80fd\u529b\u3002", "categories": ["cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.06113", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0OpenHands\u8f68\u8ff9\u5fae\u8c03\u6a21\u578b\u5728OpenHands\u5185\u8868\u73b0\u597d\uff0c\u4f46\u8fc1\u79fb\u5230\u5176\u4ed6CLI\u811a\u624b\u67b6\u65f6\u663e\u8457\u9000\u5316\uff1b\u57fa\u7840\u6a21\u578b\u6ca1\u6709\u8fd9\u79cd\u5206\u5316\uff0c\u8bf4\u660e\u95ee\u9898\u7531\u5fae\u8c03\u8bf1\u53d1\u3002", "\u533a\u5206\u4e24\u7c7b\u89c4\u5212\uff1a\u663e\u5f0f\u89c4\u5212\u662f\u6267\u884c\u524d\u751f\u6210\u7684\u8ba1\u5212\u5de5\u4ef6\uff0c\u9690\u5f0f\u89c4\u5212\u662f\u8d2f\u7a7f\u667a\u80fd\u4f53\u5faa\u73af\u7684\u7ed3\u6784\u6027\u6267\u884c\u7ea6\u5b9a\u3002", "\u901a\u8fc7DCAS\u8fdb\u884c\u8ba1\u5212\u6765\u6e90\u5e72\u9884\uff0c\u9a8c\u8bc1\u89c4\u5212\u8d28\u91cf\u662f\u9ad8\u6760\u6746\u56e0\u7d20\uff1b\u5c11\u91cf\u89c4\u5212\u611f\u77e5\u8f68\u8ff9\u5fae\u8c03\u5373\u53ef\u63d0\u5347\u975e\u8bad\u7ec3\u811a\u624b\u67b6\u4e0a\u7684\u8868\u73b0\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u89c4\u5212", "\u6cdb\u5316"], "num_comments": 2, "on_hf": true, "organization": "Centre for Software Excellence", "pdf_url": "https://arxiv.org/pdf/2608.06113v1", "published_at": "2026-08-06", "score": 0.253, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.06113.png", "title": "DCAS: Decoupling CLI Agent Scaffolding to Internalize Planning across Scaffolds", "tldr": "DCAS\u8ba9CLI\u667a\u80fd\u4f53\u8de8\u811a\u624b\u67b6\u6cdb\u5316\u66f4\u7a33", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51faDCAS\uff0c\u4e00\u4e2a\u65e0\u9700\u4fee\u6539CLI\u811a\u624b\u67b6\u5373\u53ef\u5728\u4efb\u610f\u811a\u624b\u67b6\u4e0e\u540e\u7aef\u6a21\u578b\u95f4\u8f6c\u53d1API\u6d41\u91cf\u7684\u62e6\u622a\u5c42\uff0c\u7528\u4e8e\u8de8\u811a\u624b\u67b6\u8bc4\u6d4b\u4e0e\u91c7\u96c6\u89c4\u5212\u611f\u77e5\u8f68\u8ff9\u3002\u7814\u7a76\u6307\u51fa\u5fae\u8c03\u540e\u7684\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u8fc7\u5ea6\u4f9d\u8d56\u8bad\u7ec3\u811a\u624b\u67b6\u4e2d\u7684\u89c4\u5212\u7ed3\u6784\uff0c\u5e76\u5c1d\u8bd5\u5c06\u89c4\u5212\u4ece\u811a\u624b\u67b6\u7ea6\u5b9a\u5185\u5316\u4e3a\u6a21\u578b\u80fd\u529b\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u6307\u51fa\u5f00\u6e90\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u4e2d\u7684\u5173\u952e\u504f\u5dee\uff1a\u6a21\u578b\u53ef\u80fd\u5b66\u5230\u7684\u662f\u811a\u624b\u67b6\u60ef\u4f8b\u800c\u975e\u901a\u7528\u80fd\u529b\u3002DCAS\u4e3a\u8de8\u811a\u624b\u67b6\u516c\u5e73\u8bc4\u6d4b\u3001\u6570\u636e\u91c7\u96c6\u548c\u63d0\u5347CLI\u667a\u80fd\u4f53\u6cdb\u5316\u63d0\u4f9b\u4e86\u5b9e\u7528\u5de5\u5177\u3002"}, {"abstract": "World generative models are typically used through what they produce: a rendered future, a video-conditioned action, or latent context computed by a costly generative branch. We argue that their more reusable asset is the computation that constructs a future. As a generator transforms a corrupted future into a coherent trajectory, its intermediate states organize appearance, spatial layout, and interaction across levels of abstraction. Can this future-generative computation be internalized in a representation inferred from the present alone? We present Enfold, which transfers this computation into a representation predicted from the current visual context and language instruction. During training, multi-level states exposed as the generator processes the observed future supervise a current-only encoder. The learned representation is fed back to condition future generation and is read by task heads without allowing task gradients to reshape the encoder. At deployment, action prediction no longer executes the generator. Across LIBERO, RoboTwin2.0, and real-robot tasks, Enfold supports strong control while reducing action latency by $3.7\\times$ relative to Fast--WAM, Enfold-Flash reaches $10.1\\times$. Representation analyses show that it suppresses nuisance variation and preferentially captures changes that emerge over longer horizons. When the current scene is altered by human intervention, both the generated continuation and the executed actions adapt, which is inconsistent with fixed trajectory replay. These results recast a world generator as a source of predictive control representations: its future need not be materialized at every step if its internal structure can be enfolded into the present.", "arxiv_id": "2607.26657", "arxiv_url": "https://arxiv.org/abs/2607.26657", "authors": ["Weili Zeng", "Yitong Xing", "Fulong Liu", "Chengqun Yang", "Antao Xiang", "Feng Tian", "Jingnan Gao", "Jisong Cai", "Xin Wang", "Xiaomin Wu", "Yao Mu", "Xiaokang Yang", "Yichao Yan"], "brief": "Enfold \u5c06\u672a\u6765\u751f\u6210\u6a21\u578b\u5728\u53bb\u566a/\u751f\u6210\u672a\u6765\u8f68\u8ff9\u65f6\u7684\u591a\u5c42\u4e2d\u95f4\u72b6\u6001\uff0c\u8fc1\u79fb\u5230\u4e00\u4e2a\u4ec5\u7531\u5f53\u524d\u89c6\u89c9\u4e0a\u4e0b\u6587\u548c\u8bed\u8a00\u6307\u4ee4\u9884\u6d4b\u7684\u8868\u5f81\u4e2d\u3002\u90e8\u7f72\u65f6\u65e0\u9700\u6267\u884c\u6602\u8d35\u7684\u672a\u6765\u751f\u6210\u5668\uff0c\u76f4\u63a5\u7528\u8be5\u9884\u6d4b\u8868\u5f81\u8fdb\u884c\u673a\u5668\u4eba\u52a8\u4f5c\u63a7\u5236\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/zwl666666/enfold", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2607.26657", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bad\u7ec3\u65f6\u7528\u751f\u6210\u5668\u5904\u7406\u5df2\u89c2\u6d4b\u672a\u6765\u65f6\u66b4\u9732\u7684\u591a\u5c42\u5185\u90e8\u72b6\u6001\uff0c\u76d1\u7763\u5f53\u524d\u5e27\u7f16\u7801\u5668\u5b66\u4e60\u9884\u6d4b\u6027\u8868\u5f81", "\u8be5\u8868\u5f81\u65e2\u53ef\u53cd\u5411\u6761\u4ef6\u672a\u6765\u751f\u6210\uff0c\u4e5f\u53ef\u4f9b\u4efb\u52a1\u5934\u8bfb\u53d6\uff1b\u540c\u65f6\u963b\u65ad\u4efb\u52a1\u68af\u5ea6\u91cd\u5851\u7f16\u7801\u5668\u4ee5\u4fdd\u6301\u8868\u5f81\u7a33\u5b9a", "\u5728 LIBERO\u3001RoboTwin2.0 \u548c\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\uff0c\u76f8\u6bd4 Fast-WAM \u52a8\u4f5c\u5ef6\u8fdf\u964d\u4f4e 3.7 \u500d\uff0cEnfold-Flash \u8fbe\u5230 10.1 \u500d"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u63a7\u5236", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26657v3", "published_at": "2026-07-29", "score": 0.251, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.26657.png", "title": "Enfold: Folding World Model Imagination into Predictive Representations for Ultra-Efficient Embodied Control", "tldr": "\u628a\u4e16\u754c\u6a21\u578b\u751f\u6210\u8fc7\u7a0b\u84b8\u998f\u6210\u9ad8\u6548\u63a7\u5236\u8868\u5f81", "upvotes": 1, "what_it_is": "Enfold \u5c06\u672a\u6765\u751f\u6210\u6a21\u578b\u5728\u53bb\u566a/\u751f\u6210\u672a\u6765\u8f68\u8ff9\u65f6\u7684\u591a\u5c42\u4e2d\u95f4\u72b6\u6001\uff0c\u8fc1\u79fb\u5230\u4e00\u4e2a\u4ec5\u7531\u5f53\u524d\u89c6\u89c9\u4e0a\u4e0b\u6587\u548c\u8bed\u8a00\u6307\u4ee4\u9884\u6d4b\u7684\u8868\u5f81\u4e2d\u3002\u90e8\u7f72\u65f6\u65e0\u9700\u6267\u884c\u6602\u8d35\u7684\u672a\u6765\u751f\u6210\u5668\uff0c\u76f4\u63a5\u7528\u8be5\u9884\u6d4b\u8868\u5f81\u8fdb\u884c\u673a\u5668\u4eba\u52a8\u4f5c\u63a7\u5236\u3002", "why_notable": "\u8bba\u6587\u5c06\u4e16\u754c\u6a21\u578b\u7684\u4ef7\u503c\u4ece\u201c\u751f\u6210\u672a\u6765\u89c6\u9891/\u8f68\u8ff9\u201d\u8f6c\u5411\u201c\u590d\u7528\u751f\u6210\u672a\u6765\u6240\u9700\u7684\u5185\u90e8\u8ba1\u7b97\u201d\uff0c\u5728\u4fdd\u6301\u5f3a\u63a7\u5236\u80fd\u529b\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63a8\u7406\u5ef6\u8fdf\uff0c\u5bf9\u5b9e\u65f6\u5177\u8eab\u673a\u5668\u4eba\u63a7\u5236\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Privileged on-policy distillation provides dense supervision for multi-turn agents by allowing a synchronized teacher to re-score the student\u0027s response at every turn with access to training-only references, such as successful trajectories. In interactive environments, however, the student\u0027s preceding actions continually change the execution state. As the student takes different actions or completes subgoals in a different order, its rollout may reach states not covered by the reference, making the reference an unreliable source of guidance for the state actually reached. Applying privileged distillation indiscriminately therefore creates state--reference mismatch. This mismatch motivates a central objective: providing privileged reference guidance that remains compatible with the student\u0027s current execution state. We introduce State-Matched Routing and Contextualized Self-Distillation (SMRC-SD), which explicitly determines when and how a privileged trajectory should guide an on-policy student. At each turn, SMRC-SD verifies whether the student\u0027s current execution state matches a supported state along the reference trajectory. Distillation is applied only at matched states, filtering out turns for which the reference lacks locally compatible guidance. For each matched state, SMRC-SD further constructs state-conditioned teacher context from the successful trajectory, grounding supervision in the state actually reached. Across ALFWorld and WebShop, SMRC-SD consistently outperforms unconditional successful full-path distillation. With Qwen3-1.7B, it improves task success from $0.746$ to $0.865$ on ALFWorld and from $0.574$ to $0.693$ on WebShop. Controlled routing and context ablations support both selecting locally supported turns and constructing state-compatible teacher context as contributors to these gains. Code is available at https://github.com/liujunzhuo/SMRC-SD.", "arxiv_id": "2608.05219", "arxiv_url": "https://arxiv.org/abs/2608.05219", "authors": ["Junzhuo Liu", "Weiwei Li", "Jun Ling", "Peng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa SMRC-SD\uff0c\u7528\u4e8e\u591a\u8f6e\u4ea4\u4e92\u667a\u80fd\u4f53\u7684\u7279\u6743\u5728\u7ebf\u84b8\u998f\u3002\u5b83\u5728\u6bcf\u4e00\u6b65\u68c0\u67e5\u5b66\u751f\u5f53\u524d\u6267\u884c\u72b6\u6001\u662f\u5426\u4e0e\u6210\u529f\u53c2\u8003\u8f68\u8ff9\u4e2d\u7684\u53ef\u652f\u6301\u72b6\u6001\u5339\u914d\uff0c\u53ea\u5728\u5339\u914d\u65f6\u84b8\u998f\uff0c\u5e76\u6784\u9020\u72b6\u6001\u6761\u4ef6\u5316\u7684\u6559\u5e08\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/liujunzhuo/SMRC-SD", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.05219", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u7279\u6743\u84b8\u998f\u4e2d\u7684\u72b6\u6001--\u53c2\u8003\u4e0d\u5339\u914d\u95ee\u9898\uff1a\u5b66\u751f\u52a8\u4f5c\u6539\u53d8\u73af\u5883\u72b6\u6001\u540e\uff0c\u6210\u529f\u8f68\u8ff9\u53ef\u80fd\u4e0d\u518d\u9002\u5408\u4f5c\u4e3a\u5f53\u524d\u72b6\u6001\u7684\u76d1\u7763\u3002", "State-Matched Routing \u4ec5\u5728\u5b66\u751f\u72b6\u6001\u4e0e\u53c2\u8003\u8f68\u8ff9\u5c40\u90e8\u5339\u914d\u65f6\u542f\u7528\u84b8\u998f\uff0c\u8fc7\u6ee4\u4e0d\u53ef\u9760\u76d1\u7763\u3002", "\u5728 ALFWorld \u548c WebShop \u4e0a\u663e\u8457\u4f18\u4e8e\u65e0\u6761\u4ef6\u5168\u8def\u5f84\u84b8\u998f\uff0cQwen3-1.7B \u6210\u529f\u7387\u5206\u522b\u4ece 0.746 \u63d0\u5347\u5230 0.865\u3001\u4ece 0.574 \u63d0\u5347\u5230 0.693\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u4ea4\u4e92\u73af\u5883"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05219v1", "published_at": "2026-08-05", "score": 0.249, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05219.png", "title": "When Privileged Guidance Misaligns: State-Matched Routing and Contextualized Self-Distillation for Multi-Turn Agents", "tldr": "\u7528\u72b6\u6001\u5339\u914d\u7f13\u89e3\u591a\u8f6e\u667a\u80fd\u4f53\u84b8\u998f\u8bef\u5bfc", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa SMRC-SD\uff0c\u7528\u4e8e\u591a\u8f6e\u4ea4\u4e92\u667a\u80fd\u4f53\u7684\u7279\u6743\u5728\u7ebf\u84b8\u998f\u3002\u5b83\u5728\u6bcf\u4e00\u6b65\u68c0\u67e5\u5b66\u751f\u5f53\u524d\u6267\u884c\u72b6\u6001\u662f\u5426\u4e0e\u6210\u529f\u53c2\u8003\u8f68\u8ff9\u4e2d\u7684\u53ef\u652f\u6301\u72b6\u6001\u5339\u914d\uff0c\u53ea\u5728\u5339\u914d\u65f6\u84b8\u998f\uff0c\u5e76\u6784\u9020\u72b6\u6001\u6761\u4ef6\u5316\u7684\u6559\u5e08\u4e0a\u4e0b\u6587\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u591a\u8f6e\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u5e38\u89c1\u4f46\u5bb9\u6613\u88ab\u5ffd\u89c6\u7684\u8f68\u8ff9\u9519\u914d\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u7684\u84b8\u998f\u673a\u5236\uff1b\u5728\u5177\u8eab\u4efb\u52a1\u548c\u7f51\u9875\u8d2d\u7269\u4efb\u52a1\u4e0a\u5747\u6709\u660e\u663e\u6536\u76ca\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM-based agents are rapidly advancing, autonomously invoking external tools to complete multi-step tasks for users. However, agents often acquire more sensitive information than the task requires. Existing privacy benchmarks audit what the agent\u0027s response or outgoing actions disclose, but overlook the acquisition stage where data first enters the agent\u0027s context. The over-acquired information is then one careless action or one attack away from an outright leak. To assess its prevalence, we introduce \\emph{PrivacyPeek}, a benchmark for evaluating acquisition-stage privacy leakage of LLM-based agents, with $1{,}182$ cases across $7$ acquisition behaviours and $16$ application domains. Specifically, \\emph{Acquisition Inspection} examines the agent\u0027s tool-call trajectory, both the tools it invokes and the data it receives, to detect when it acquires sensitive information beyond the task scope. \\emph{Probe Elicitation} then issues a follow-up probe and measures how readily an attacker could elicit sensitive information the agent acquired but did not disclose. Our experiments on $10$ LLM-based agents across $4$ model families show that the unnecessary acquisition of sensitive information is widespread. In addition, we observe a correlation between the task-completion capability and acquisition-stage leakage. Prompt-level defences reduce only a small fraction of acquisition-stage leakage, leaving the majority unmitigated. These results make auditing acquisition-stage privacy both urgent and necessary. Our dataset and code are available at https://github.com/Xuan269/PrivacyPeek-Resource.", "arxiv_id": "2606.00152", "arxiv_url": "https://arxiv.org/abs/2606.00152", "authors": ["Mingxuan Zhang", "Jiahui Han", "Dadi Guo", "Songze Li", "Guanchu Wang", "Na Zou", "Dongrui Liu", "Xia Hu"], "brief": "\u8bba\u6587\u63d0\u51fa PrivacyPeek\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u201c\u4fe1\u606f\u83b7\u53d6\u9636\u6bb5\u201d\u9690\u79c1\u6cc4\u6f0f\u7684\u57fa\u51c6\uff0c\u5173\u6ce8\u667a\u80fd\u4f53\u8c03\u7528\u5de5\u5177\u65f6\u662f\u5426\u83b7\u53d6\u4e86\u8d85\u51fa\u4efb\u52a1\u6240\u9700\u7684\u654f\u611f\u4fe1\u606f\u3002\u57fa\u51c6\u5305\u542b 1182 \u4e2a\u6848\u4f8b\uff0c\u8986\u76d6 7 \u7c7b\u83b7\u53d6\u884c\u4e3a\u548c 16 \u4e2a\u5e94\u7528\u9886\u57df\uff0c\u5e76\u7ed3\u5408\u8f68\u8ff9\u68c0\u67e5\u4e0e\u540e\u7eed\u63a2\u6d4b\u8bc4\u4f30\u6f5c\u5728\u6cc4\u6f0f\u98ce\u9669\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": "https://github.com/Xuan269/PrivacyPeek-Resource", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2606.00152", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Acquisition Inspection \u68c0\u67e5\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u8f68\u8ff9\uff0c\u5305\u62ec\u8c03\u7528\u4e86\u54ea\u4e9b\u5de5\u5177\u4ee5\u53ca\u63a5\u6536\u4e86\u54ea\u4e9b\u6570\u636e\uff0c\u4ee5\u8bc6\u522b\u8d8a\u6743\u6216\u8fc7\u5ea6\u83b7\u53d6\u7684\u654f\u611f\u4fe1\u606f", "Probe Elicitation \u901a\u8fc7\u540e\u7eed\u653b\u51fb\u5f0f\u63d0\u95ee\uff0c\u8861\u91cf\u667a\u80fd\u4f53\u662f\u5426\u5bb9\u6613\u5410\u9732\u5df2\u83b7\u53d6\u4f46\u539f\u672c\u672a\u62ab\u9732\u7684\u654f\u611f\u4fe1\u606f", "\u5728 4 \u4e2a\u6a21\u578b\u5bb6\u65cf\u7684 10 \u4e2a LLM \u667a\u80fd\u4f53\u4e0a\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8fc7\u5ea6\u83b7\u53d6\u654f\u611f\u4fe1\u606f\u666e\u904d\u5b58\u5728\uff0c\u4e14\u4efb\u52a1\u5b8c\u6210\u80fd\u529b\u8d8a\u5f3a\u5f80\u5f80\u83b7\u53d6\u9636\u6bb5\u6cc4\u6f0f\u8d8a\u9ad8\uff1b\u63d0\u793a\u8bcd\u9632\u5fa1\u6548\u679c\u6709\u9650"], "keywords": ["\u667a\u80fd\u4f53", "\u9690\u79c1\u5b89\u5168", "\u5de5\u5177\u8c03\u7528", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2606.00152v2", "published_at": "2026-05-29", "score": 0.248, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2606.00152.png", "title": "PrivacyPeek: Auditing What LLM-Based Agents Acquire, Not Just What They Say", "tldr": "\u5ba1\u8ba1LLM\u667a\u80fd\u4f53\u83b7\u53d6\u9636\u6bb5\u7684\u9690\u79c1\u6cc4\u6f0f", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa PrivacyPeek\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u201c\u4fe1\u606f\u83b7\u53d6\u9636\u6bb5\u201d\u9690\u79c1\u6cc4\u6f0f\u7684\u57fa\u51c6\uff0c\u5173\u6ce8\u667a\u80fd\u4f53\u8c03\u7528\u5de5\u5177\u65f6\u662f\u5426\u83b7\u53d6\u4e86\u8d85\u51fa\u4efb\u52a1\u6240\u9700\u7684\u654f\u611f\u4fe1\u606f\u3002\u57fa\u51c6\u5305\u542b 1182 \u4e2a\u6848\u4f8b\uff0c\u8986\u76d6 7 \u7c7b\u83b7\u53d6\u884c\u4e3a\u548c 16 \u4e2a\u5e94\u7528\u9886\u57df\uff0c\u5e76\u7ed3\u5408\u8f68\u8ff9\u68c0\u67e5\u4e0e\u540e\u7eed\u63a2\u6d4b\u8bc4\u4f30\u6f5c\u5728\u6cc4\u6f0f\u98ce\u9669\u3002", "why_notable": "\u73b0\u6709\u9690\u79c1\u8bc4\u6d4b\u591a\u5173\u6ce8\u6700\u7ec8\u56de\u7b54\u6216\u5916\u53d1\u52a8\u4f5c\u662f\u5426\u6cc4\u5bc6\uff0c\u800c\u8be5\u5de5\u4f5c\u5c06\u5ba1\u8ba1\u524d\u79fb\u5230\u4fe1\u606f\u8fdb\u5165\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u7684\u9636\u6bb5\uff0c\u63ed\u793a\u4e86\u5de5\u5177\u578b\u667a\u80fd\u4f53\u4e2d\u66f4\u9690\u853d\u4e14\u66f4\u65e9\u53d1\u751f\u7684\u9690\u79c1\u98ce\u9669\uff0c\u5bf9\u5b89\u5168\u8bc4\u6d4b\u3001\u667a\u80fd\u4f53\u6743\u9650\u8bbe\u8ba1\u548c\u4f01\u4e1a\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language Models (VLMs) should answer from concrete image evidence rather than language priors, dataset shortcuts, or irrelevant visual context. Existing perception-aware post-training methods encourage image use through global perturbations or attention proxies, but they do not test whether a sampled answer causally depends on the local evidence that supports it. We propose Counterfactual Evidence Disentanglement (CED), a training-time evidence audit for VLM grounding. For each response, CED neutralizes an object-centric Evidence Region and compares the resulting support drop against matched non-evidence Regions. We combine this signal with answer correctness inside GRPO, rewarding correct answers that rely on the evidence path rather than shortcut or nuisance paths. CED uses
