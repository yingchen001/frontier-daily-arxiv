oduce 3D CAD consensus selection, hereafter consensus selection: sample $N$ parametric CAD programs, compile them to 3D models, and return the candidate that agrees most with the rest of the pool. The method is training-free and compatible with existing CAD agents. We investigate geometric and topological notions of agreement, each of which improves its corresponding evaluation metric. On the exact candidate pools of a state-of-the-art CAD generation method, geometric consensus improves all three geometric metrics over the method\u0027s verifier, while topological consensus matches it on topology. Across every tested LLM and prompt variant, geometric consensus also improves geometric accuracy over random selection from the same pool, reducing Chamfer distance by $1-10\\%$.", "arxiv_id": "2608.09706", "arxiv_url": "https://arxiv.org/abs/2608.09706", "authors": ["Aaron Haag", "Altay Ka\u00e7an", "Bertram Fuchs", "Oliver Lohse"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u8bad\u7ec3\u514d\u8d39\u76843D CAD\u5171\u8bc6\u9009\u62e9\u65b9\u6cd5\uff1a\u4ece\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u91c7\u6837\u591a\u4e2a\u53c2\u6570\u5316CAD\u7a0b\u5e8f\uff0c\u7f16\u8bd1\u62103D\u6a21\u578b\u540e\uff0c\u9009\u62e9\u4e0e\u5019\u9009\u6c60\u4e2d\u5176\u4ed6\u6a21\u578b\u6700\u4e00\u81f4\u7684\u7ed3\u679c\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916\u89c6\u89c9\u8bed\u8a00\u9a8c\u8bc1\u5668\uff0c\u53ef\u76f4\u63a5\u63a5\u5165\u73b0\u6709CAD\u751f\u6210\u7cfb\u7edf\u3002", "categories": ["cs.CE", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09706", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u51e0\u4f55\u4e00\u81f4\u6027\u4e0e\u62d3\u6251\u4e00\u81f4\u6027\u4e24\u7c7b\u5171\u8bc6\u4fe1\u53f7\uff0c\u5728\u5019\u9009\u6c60\u5185\u90e8\u5b8c\u6210\u6d4b\u8bd5\u65f6\u9009\u62e9", "\u5728\u9876\u5c16CAD\u751f\u6210\u65b9\u6cd5\u7684\u5019\u9009\u6c60\u4e0a\uff0c\u51e0\u4f55\u5171\u8bc6\u5728\u4e09\u9879\u51e0\u4f55\u6307\u6807\u4e0a\u4f18\u4e8e\u5176\u539f\u6709\u9a8c\u8bc1\u5668\uff0c\u62d3\u6251\u5171\u8bc6\u5728\u62d3\u6251\u6307\u6807\u4e0a\u4e0e\u9a8c\u8bc1\u5668\u76f8\u5f53", "\u8de8\u4e0d\u540cLLM\u4e0e\u63d0\u793a\u53d8\u4f53\uff0c\u51e0\u4f55\u5171\u8bc6\u76f8\u8f83\u968f\u673a\u9009\u62e9\u5747\u63d0\u5347\u51e0\u4f55\u7cbe\u5ea6\uff0cChamfer\u8ddd\u79bb\u964d\u4f4e1%-10%"], "keywords": ["CAD\u751f\u6210", "\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7a0b\u5e8f\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09706v1", "published_at": "2026-08-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Test-Time Scaling for CAD Generation via Verifier-Free Consensus Selection", "tldr": "\u7528\u5019\u9009\u5171\u8bc6\u514d\u9a8c\u8bc1\u5668\u63d0\u5347\u6587\u672c\u5230CAD\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u8bad\u7ec3\u514d\u8d39\u76843D CAD\u5171\u8bc6\u9009\u62e9\u65b9\u6cd5\uff1a\u4ece\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u91c7\u6837\u591a\u4e2a\u53c2\u6570\u5316CAD\u7a0b\u5e8f\uff0c\u7f16\u8bd1\u62103D\u6a21\u578b\u540e\uff0c\u9009\u62e9\u4e0e\u5019\u9009\u6c60\u4e2d\u5176\u4ed6\u6a21\u578b\u6700\u4e00\u81f4\u7684\u7ed3\u679c\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916\u89c6\u89c9\u8bed\u8a00\u9a8c\u8bc1\u5668\uff0c\u53ef\u76f4\u63a5\u63a5\u5165\u73b0\u6709CAD\u751f\u6210\u7cfb\u7edf\u3002", "why_notable": "\u5b83\u8bc1\u660e\u4e86\u6587\u672c\u5230CAD\u751f\u6210\u4e2d\u7684\u5019\u9009\u96c6\u5408\u672c\u8eab\u5c31\u5305\u542b\u53ef\u7528\u7684\u9009\u62e9\u4fe1\u53f7\uff0c\u907f\u514d\u4f9d\u8d56\u6602\u8d35\u6216\u4e0d\u7a33\u5b9a\u7684\u5916\u90e8\u9a8c\u8bc1\u5668\uff0c\u4e3a\u6d4b\u8bd5\u65f6\u6269\u5c55\u63d0\u4f9b\u4e86\u7b80\u5355\u3001\u901a\u7528\u4e14\u5b9e\u7528\u7684\u66ff\u4ee3\u65b9\u6848\u3002"}, {"abstract": "AI coding agents now write a growing share of production code, and human security review does not scale at the rate code is generated. The agents in widest use are closed-weight, so a deploying team cannot read their internals. It can instead run an open-weight model as a reviewer over the agent\u0027s output. That reviewer\u0027s activations are readable. We ask whether reading those activations recovers a security signal that simply asking the same reviewer misses. We fit a single linear probe per model on a corpus of paired vulnerable-and-fixed Python functions, then test it without retraining on real disclosed vulnerabilities whose weakness type the probe never saw in training, across five open-weight reviewer models. On the vulnerabilities fixed by changing a single function, the probe scores the vulnerable function above its fix on 61-67% of cases for every model, beating the 50% chance line. It also beats the same model\u0027s prompted YES/NO win-rate read from its logits, under every prompt we try. Asking the model for a written verdict, even with chain-of-thought, returns the same answer on the vulnerable and fixed function most of the time and so cannot tell them apart. Model activations carry a code-security signal that prompting the same model misses.", "arxiv_id": "2608.09643", "arxiv_url": "https://arxiv.org/abs/2608.09643", "authors": ["Ivan Wiryadi"], "brief": "\u8bba\u6587\u7814\u7a76\u5f00\u653e\u6743\u91cd\u4ee3\u7801\u5ba1\u67e5\u6a21\u578b\u7684\u5185\u90e8\u6fc0\u6d3b\u662f\u5426\u5305\u542b\u6bd4\u76f4\u63a5\u63d0\u793a\u66f4\u5f3a\u7684\u5b89\u5168\u5224\u65ad\u4fe1\u53f7\u3002\u4f5c\u8005\u5728\u6210\u5bf9\u7684\u6613\u53d7\u653b\u51fb/\u4fee\u590d\u540e Python \u51fd\u6570\u4e0a\u8bad\u7ec3\u5355\u4e2a\u7ebf\u6027\u63a2\u9488\uff0c\u5e76\u5728\u672a\u89c1\u8fc7\u5f31\u70b9\u7c7b\u578b\u7684\u771f\u5b9e\u6f0f\u6d1e\u4e0a\u6d4b\u8bd5\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09643", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57285\u4e2a\u5f00\u653e\u6743\u91cd\u5ba1\u67e5\u6a21\u578b\u4e0a\uff0c\u7ebf\u6027\u63a2\u9488\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u8fc1\u79fb\u5230\u771f\u5b9e\u62ab\u9732\u6f0f\u6d1e\u3002", "\u5bf9\u5355\u51fd\u6570\u4fee\u590d\u6f0f\u6d1e\uff0c\u63a2\u9488\u572861%-67%\u7684\u6848\u4f8b\u4e2d\u7ed9\u6f0f\u6d1e\u7248\u672c\u66f4\u9ad8\u98ce\u9669\u5206\uff0c\u7a33\u5b9a\u9ad8\u4e8e\u968f\u673a\u3002", "\u63a2\u9488\u8868\u73b0\u8d85\u8fc7\u540c\u4e00\u6a21\u578b\u5728\u591a\u79cd\u63d0\u793a\u4e0b\u7684YES/NO logits\u5224\u65ad\uff1b\u4e66\u9762 verdict \u548c\u94fe\u5f0f\u601d\u8003\u591a\u6570\u60c5\u51b5\u4e0b\u65e0\u6cd5\u533a\u5206\u6f0f\u6d1e\u4e0e\u4fee\u590d\u7248\u672c\u3002"], "keywords": ["\u4ee3\u7801\u5b89\u5168", "\u6a21\u578b\u89e3\u91ca", "\u7ebf\u6027\u63a2\u9488", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09643v1", "published_at": "2026-08-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Activation Probes Surface Code-Security Signals that the Model\u0027s Output Misses", "tldr": "\u7ebf\u6027\u63a2\u9488\u53d1\u73b0\u63d0\u793a\u6f0f\u6389\u7684\u4ee3\u7801\u5b89\u5168\u4fe1\u53f7", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5f00\u653e\u6743\u91cd\u4ee3\u7801\u5ba1\u67e5\u6a21\u578b\u7684\u5185\u90e8\u6fc0\u6d3b\u662f\u5426\u5305\u542b\u6bd4\u76f4\u63a5\u63d0\u793a\u66f4\u5f3a\u7684\u5b89\u5168\u5224\u65ad\u4fe1\u53f7\u3002\u4f5c\u8005\u5728\u6210\u5bf9\u7684\u6613\u53d7\u653b\u51fb/\u4fee\u590d\u540e Python \u51fd\u6570\u4e0a\u8bad\u7ec3\u5355\u4e2a\u7ebf\u6027\u63a2\u9488\uff0c\u5e76\u5728\u672a\u89c1\u8fc7\u5f31\u70b9\u7c7b\u578b\u7684\u771f\u5b9e\u6f0f\u6d1e\u4e0a\u6d4b\u8bd5\u3002", "why_notable": "\u8bf4\u660e\u6a21\u578b\u5185\u90e8\u8868\u5f81\u4e2d\u5b58\u5728\u53ef\u8bfb\u51fa\u7684\u4ee3\u7801\u5b89\u5168\u4fe1\u53f7\uff0c\u800c\u5e38\u89c4\u63d0\u793a\u65e0\u6cd5\u5145\u5206\u5229\u7528\uff1b\u4e3a\u95ed\u6e90\u7f16\u7801\u667a\u80fd\u4f53\u8f93\u51fa\u7684\u5b89\u5168\u5ba1\u67e5\u63d0\u4f9b\u4e86\u4e00\u6761\u53ef\u89e3\u91ca\u3001\u8f7b\u91cf\u7684\u8f85\u52a9\u8def\u5f84\u3002"}, {"abstract": "How expressive is prompting a transformer? Answering this question is important for separating the roles of prompting, architecture, and pretraining in transformer models, and for determining whether task-specific behavior must be stored in model weights or can instead be induced at inference time through the prompt. We show, in an approximation-theoretic sense, that pretraining is optional: a single-layer softmax attention network with random, untrained weights can approximate any H\u00f6lder function on a compact manifold when steered by an appropriate soft prompt. Guided by the connection between softmax attention and kernel methods, we construct explicit soft prompts (a prompt per target function, independent of the query) as solutions to linear systems matching attention logits to Gaussian kernel exponents, under which the frozen transformer emulates the classical Nadaraya-Watson kernel estimator. The construction requires only a mild rank condition on the weights, which we show holds almost surely under Gaussian initialization. The prompted network inherits the theoretical guarantees of kernel regression, leading to universal approximation theorems with minimax-optimal rates that depend on the intrinsic dimension. We further quantify the cost of prompting, exposing a tradeoff between the norm of the constructed soft prompt tokens, prompt length, and hidden dimension. Numerical experiments corroborate the constructions and predicted rates.", "arxiv_id": "2608.09558", "arxiv_url": "https://arxiv.org/abs/2608.09558", "authors": ["Alexander Hsu", "Rongjie Lai"], "brief": "\u8bba\u6587\u4ece\u903c\u8fd1\u7406\u8bba\u89d2\u5ea6\u8bc1\u660e\uff0c\u5355\u5c42\u968f\u673a\u521d\u59cb\u5316\u3001\u672a\u8bad\u7ec3\u7684softmax\u6ce8\u610f\u529b\u7f51\u7edc\uff0c\u5728\u5408\u9002\u8f6f\u63d0\u793a\u5f15\u5bfc\u4e0b\u53ef\u903c\u8fd1\u7d27\u81f4\u6d41\u5f62\u4e0a\u7684\u4efb\u610fH\u00f6lder\u51fd\u6570\u3002\u4f5c\u8005\u6784\u9020\u4e86\u663e\u5f0f\u8f6f\u63d0\u793a\uff0c\u4f7f\u51bb\u7ed3Transformer\u6a21\u62dfNadaraya-Watson\u6838\u56de\u5f52\u4f30\u8ba1\u5668\u3002", "categories": ["cs.LG", "math.NA", "math.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09558", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06softmax\u6ce8\u610f\u529b\u4e0e\u6838\u65b9\u6cd5\u8054\u7cfb\u8d77\u6765\uff0c\u901a\u8fc7\u89e3\u7ebf\u6027\u7cfb\u7edf\u8ba9\u6ce8\u610f\u529blogit\u5339\u914d\u9ad8\u65af\u6838\u6307\u6570", "\u53ea\u9700\u6743\u91cd\u6ee1\u8db3\u6e29\u548c\u79e9\u6761\u4ef6\uff0c\u4e14\u9ad8\u65af\u968f\u673a\u521d\u59cb\u5316\u4e0b\u51e0\u4e4e\u5fc5\u7136\u6210\u7acb", "\u83b7\u5f97\u4f9d\u8d56\u5185\u5728\u7ef4\u5ea6\u7684\u6781\u5c0f\u6781\u5927\u6700\u4f18\u903c\u8fd1\u901f\u7387\uff0c\u5e76\u91cf\u5316\u63d0\u793a\u8303\u6570\u3001\u63d0\u793a\u957f\u5ea6\u4e0e\u9690\u85cf\u7ef4\u5ea6\u4e4b\u95f4\u7684\u6743\u8861"], "keywords": ["Transformer", "\u63d0\u793a\u5b66\u4e60", "\u6838\u65b9\u6cd5", "\u903c\u8fd1\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09558v1", "published_at": "2026-08-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Training-Free Universal Approximation by Prompting Random Transformers", "tldr": "\u968f\u673aTransformer\u4e5f\u53ef\u7531\u8f6f\u63d0\u793a\u5b9e\u73b0\u901a\u7528\u903c\u8fd1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ece\u903c\u8fd1\u7406\u8bba\u89d2\u5ea6\u8bc1\u660e\uff0c\u5355\u5c42\u968f\u673a\u521d\u59cb\u5316\u3001\u672a\u8bad\u7ec3\u7684softmax\u6ce8\u610f\u529b\u7f51\u7edc\uff0c\u5728\u5408\u9002\u8f6f\u63d0\u793a\u5f15\u5bfc\u4e0b\u53ef\u903c\u8fd1\u7d27\u81f4\u6d41\u5f62\u4e0a\u7684\u4efb\u610fH\u00f6lder\u51fd\u6570\u3002\u4f5c\u8005\u6784\u9020\u4e86\u663e\u5f0f\u8f6f\u63d0\u793a\uff0c\u4f7f\u51bb\u7ed3Transformer\u6a21\u62dfNadaraya-Watson\u6838\u56de\u5f52\u4f30\u8ba1\u5668\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u4efb\u52a1\u80fd\u529b\u5fc5\u987b\u5b58\u50a8\u5728\u9884\u8bad\u7ec3\u6743\u91cd\u4e2d\u201d\u7684\u76f4\u89c9\uff0c\u8868\u660e\u67b6\u6784\u52a0\u63a8\u7406\u65f6\u8f6f\u63d0\u793a\u672c\u8eab\u5177\u6709\u5f3a\u8868\u8fbe\u80fd\u529b\uff1b\u4e3a\u7406\u89e3\u63d0\u793a\u3001\u67b6\u6784\u548c\u9884\u8bad\u7ec3\u7684\u4f5c\u7528\u8fb9\u754c\u63d0\u4f9b\u4e86\u7406\u8bba\u4f9d\u636e\u3002"}, {"abstract": "Task arithmetic treats fine-tuning displacements as composable directions in weight space, yet it remains unclear when parameter addition reflects predictable changes in model function. We separate parameter geometry from functional geometry and measure pairwise functional non-additivity over a two-dimensional task-vector surface, using a first-token predictive-distribution interaction ratio conditioned on an input distribution and evaluated with norm-matched controls, three training seeds, and response-only fine-tuning. On Qwen2.5-1.5B, code+safety is more non-additive than the matched code+math control on code and instruction prompts, but not on math prompts. In a prospectively specified six-task expansion, all eight high-versus-low comparisons of unseen task pairs have the predicted sign. The primary ordering further persists under full-parameter fine-tuning at 0.5B, Qwen2.5 LoRA scale tests up to 7B, and a Llama-3.1-8B cross-architecture audit. External validation exposes a sharper boundary: raw public code, instruction, and safety prompts preserve the continuous contrast, whereas an instruction-style wrapper collapses it on the identical public-code prompts, and EvalPlus pass@1 interactions do not robustly reproduce it. Weight-space composition therefore supports coarse, input- and format-conditioned functional statements across adaptation methods, scales, and one additional model family, not a universal merging-performance predictor.", "arxiv_id": "2608.09490", "arxiv_url": "https://arxiv.org/abs/2608.09490", "authors": ["Chencheng Zhu", "Xiaoyang Li", "Taotao Cai"], "brief": "\u8bba\u6587\u7814\u7a76\u5fae\u8c03\u5f97\u5230\u7684\u4efb\u52a1\u5411\u91cf\u5728\u6743\u91cd\u7a7a\u95f4\u76f8\u52a0\u65f6\uff0c\u4f55\u65f6\u80fd\u5bf9\u5e94\u53ef\u9884\u6d4b\u7684\u529f\u80fd\u53d8\u5316\u3002\u4f5c\u8005\u533a\u5206\u53c2\u6570\u51e0\u4f55\u4e0e\u529f\u80fd\u51e0\u4f55\uff0c\u7528\u9996 token \u9884\u6d4b\u5206\u5e03\u7684\u4ea4\u4e92\u6bd4\u7387\uff0c\u5728\u591a\u4efb\u52a1\u3001\u591a\u6a21\u578b\u3001\u591a\u5c3a\u5ea6\u8bbe\u7f6e\u4e0b\u6d4b\u91cf\u4efb\u52a1\u5411\u91cf\u7684\u529f\u80fd\u975e\u52a0\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09490", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 Qwen2.5-1.5B \u4e0a\uff0ccode+safety \u7684\u529f\u80fd\u975e\u52a0\u6027\u663e\u8457\u9ad8\u4e8e code+math \u5bf9\u7167\uff0c\u4f46\u8fd9\u79cd\u5dee\u5f02\u4f9d\u8d56\u8f93\u5165\u7c7b\u578b\uff0c\u5728\u6570\u5b66\u63d0\u793a\u4e0a\u4e0d\u660e\u663e\u3002", "\u516d\u4efb\u52a1\u6269\u5c55\u5b9e\u9a8c\u4e2d\uff0c\u9884\u5148\u6307\u5b9a\u7684\u9ad8/\u4f4e\u975e\u52a0\u6027\u4efb\u52a1\u5bf9\u6bd4\u8f83\u5168\u90e8\u7b26\u5408\u9884\u6d4b\u65b9\u5411\uff0c\u5e76\u5728\u5168\u53c2\u6570\u5fae\u8c03\u3001LoRA \u6269\u5c55\u5230 7B\u3001Llama-3.1-8B \u8de8\u67b6\u6784\u5ba1\u8ba1\u4e2d\u4fdd\u6301\u4e3b\u8981\u6392\u5e8f\u3002", "\u5916\u90e8\u9a8c\u8bc1\u663e\u793a\u8fb9\u754c\u66f4\u6e05\u6670\uff1a\u539f\u59cb\u4ee3\u7801\u3001\u6307\u4ee4\u3001\u5b89\u5168\u63d0\u793a\u4fdd\u7559\u8fde\u7eed\u5dee\u5f02\uff0c\u4f46\u52a0\u5165 instruction-style wrapper \u4f1a\u4f7f\u540c\u4e00\u4ee3\u7801\u63d0\u793a\u4e0a\u7684\u5dee\u5f02\u574d\u7f29\uff0cEvalPlus pass@1 \u4e5f\u4e0d\u80fd\u7a33\u5b9a\u590d\u73b0\u8be5\u4ea4\u4e92\u3002"], "keywords": ["\u4efb\u52a1\u5411\u91cf", "\u6a21\u578b\u5408\u5e76", "\u5fae\u8c03", "\u6a21\u578b\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09490v1", "published_at": "2026-08-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Do Task Vectors Interfere? Mapping the Validity Boundaries of Weight-Space Composition", "tldr": "\u7cfb\u7edf\u523b\u753b\u4efb\u52a1\u5411\u91cf\u7ec4\u5408\u4f55\u65f6\u5931\u6548", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5fae\u8c03\u5f97\u5230\u7684\u4efb\u52a1\u5411\u91cf\u5728\u6743\u91cd\u7a7a\u95f4\u76f8\u52a0\u65f6\uff0c\u4f55\u65f6\u80fd\u5bf9\u5e94\u53ef\u9884\u6d4b\u7684\u529f\u80fd\u53d8\u5316\u3002\u4f5c\u8005\u533a\u5206\u53c2\u6570\u51e0\u4f55\u4e0e\u529f\u80fd\u51e0\u4f55\uff0c\u7528\u9996 token \u9884\u6d4b\u5206\u5e03\u7684\u4ea4\u4e92\u6bd4\u7387\uff0c\u5728\u591a\u4efb\u52a1\u3001\u591a\u6a21\u578b\u3001\u591a\u5c3a\u5ea6\u8bbe\u7f6e\u4e0b\u6d4b\u91cf\u4efb\u52a1\u5411\u91cf\u7684\u529f\u80fd\u975e\u52a0\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u4efb\u52a1\u5411\u91cf\u4e0e\u6a21\u578b\u5408\u5e76\u63d0\u4f9b\u4e86\u66f4\u7cbe\u7ec6\u7684\u6709\u6548\u6027\u8fb9\u754c\uff1a\u6743\u91cd\u7a7a\u95f4\u7ec4\u5408\u53ef\u652f\u6301\u7c97\u7c92\u5ea6\u3001\u4f9d\u8d56\u8f93\u5165\u4e0e\u683c\u5f0f\u7684\u529f\u80fd\u5224\u65ad\uff0c\u4f46\u4e0d\u80fd\u4f5c\u4e3a\u901a\u7528\u7684\u5408\u5e76\u6027\u80fd\u9884\u6d4b\u5668\uff0c\u5bf9\u6a21\u578b\u7f16\u8f91\u3001\u591a\u4efb\u52a1\u9002\u914d\u548c LoRA \u5408\u5e76\u5b9e\u8df5\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "The deployment of autonomous robotic systems in chemistry laboratories is accelerating experimental workflows and providing the foundational data for AI-driven scientific discovery. However, despite the success of data-driven methods in acquiring dexterous skills, safety remains a primary barrier to their deployment in high-risk domains, such as early-stage materials chemistry experiments. Specifically, learning-based policies frequently struggle to distinguish between safe and unsafe actions, leading to overconfident extrapolation and potentially catastrophic failures. To mitigate these safety risks, we propose SAFE-CHEM, an uncertainty-aware framework designed for robust, learning-based robotic chemists. Our approach leverages an ensemble of recurrent neural network-based imitation learning policies to quantify epistemic uncertainty online through the variance of action predictions. By characterising the success-conditioned density of this variance using kernel density estimation, we introduce a hybrid control architecture that autonomously switches from the learned policy to a deterministic, rule-based backup controller when uncertainty exceeds a calibrated safety threshold. We evaluate SAFE-CHEM across three fundamental laboratory manipulation tasks, where our empirical results demonstrate that this hybrid strategy improves overall task success rates and reduces critical safety violations compared to traditional single-policy baselines. Finally, we demonstrate the practical viability of the framework through zero-shot sim-to-real transfer onto a physical Franka Production 3 robot manipulator.", "arxiv_id": "2608.09303", "arxiv_url": "https://arxiv.org/abs/2608.09303", "authors": ["Laura Jones", "Shazil Shahzad", "Ayesha Sana", "Gabriella Pizzuto"], "brief": "\u8bba\u6587\u63d0\u51fa SAFE-CHEM\uff0c\u4e00\u4e2a\u9762\u5411\u81ea\u4e3b\u5316\u5b66\u5b9e\u9a8c\u673a\u5668\u4eba\u7684\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u6df7\u5408\u63a7\u5236\u6846\u67b6\u3002\u5b83\u5728\u5b66\u4e60\u7b56\u7565\u4e0d\u786e\u5b9a\u6027\u8fc7\u9ad8\u65f6\u81ea\u52a8\u5207\u6362\u5230\u89c4\u5219\u5907\u4efd\u63a7\u5236\u5668\uff0c\u4ee5\u964d\u4f4e\u5371\u9669\u64cd\u4f5c\u98ce\u9669\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09303", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u591a\u7ec4\u5faa\u73af\u795e\u7ecf\u7f51\u7edc\u6a21\u4eff\u5b66\u4e60\u7b56\u7565\u96c6\u6210\uff0c\u901a\u8fc7\u52a8\u4f5c\u9884\u6d4b\u65b9\u5dee\u5728\u7ebf\u4f30\u8ba1\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027", "\u7528\u6838\u5bc6\u5ea6\u4f30\u8ba1\u523b\u753b\u6210\u529f\u8f68\u8ff9\u4e2d\u7684\u4e0d\u786e\u5b9a\u6027\u5206\u5e03\uff0c\u5e76\u636e\u6b64\u6821\u51c6\u5b89\u5168\u5207\u6362\u9608\u503c", "\u5728\u4e09\u7c7b\u57fa\u7840\u5b9e\u9a8c\u5ba4\u64cd\u4f5c\u4efb\u52a1\u4e2d\u63d0\u5347\u6210\u529f\u7387\u3001\u51cf\u5c11\u5173\u952e\u5b89\u5168\u8fdd\u89c4\uff0c\u5e76\u5b9e\u73b0 Franka \u673a\u68b0\u81c2\u96f6\u6837\u672c\u4eff\u771f\u5230\u73b0\u5b9e\u8fc1\u79fb"], "keywords": ["\u673a\u5668\u4eba", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u6a21\u4eff\u5b66\u4e60", "\u5b89\u5168\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09303v1", "published_at": "2026-08-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SAFE-CHEM: Uncertainty-Aware Policy Switching for Robust Robotic Chemistry", "tldr": "\u7528\u4e0d\u786e\u5b9a\u6027\u5207\u6362\u7b56\u7565\u63d0\u5347\u673a\u5668\u4eba\u5316\u5b66\u5b89\u5168\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SAFE-CHEM\uff0c\u4e00\u4e2a\u9762\u5411\u81ea\u4e3b\u5316\u5b66\u5b9e\u9a8c\u673a\u5668\u4eba\u7684\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u6df7\u5408\u63a7\u5236\u6846\u67b6\u3002\u5b83\u5728\u5b66\u4e60\u7b56\u7565\u4e0d\u786e\u5b9a\u6027\u8fc7\u9ad8\u65f6\u81ea\u52a8\u5207\u6362\u5230\u89c4\u5219\u5907\u4efd\u63a7\u5236\u5668\uff0c\u4ee5\u964d\u4f4e\u5371\u9669\u64cd\u4f5c\u98ce\u9669\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u9ad8\u98ce\u9669\u5316\u5b66\u5b9e\u9a8c\u4e2d\u5b66\u4e60\u578b\u673a\u5668\u4eba\u7b56\u7565\u8fc7\u5ea6\u81ea\u4fe1\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u53ef\u843d\u5730\u7684\u5b89\u5168\u515c\u5e95\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u673a\u5668\u4eba\u5316\u5b66\u5bb6\u4ece\u4eff\u771f\u548c\u53d7\u63a7\u73af\u5883\u8d70\u5411\u771f\u5b9e\u5b9e\u9a8c\u5ba4\u90e8\u7f72\u3002"}, {"abstract": "Enterprises increasingly seek to query data lakes using natural language via AI-driven tools like semantic operators or deep research agents. However, the latter operates as an opaque black box, hiding its intermediate reasoning and data retrieval steps, and failing to expose controls for managing API costs and execution latency. Meanwhile, the former can be prohibitively expensive for enterprise-scale data lakes. Consequently, analysts using these systems lack the agency to intercept hallucinated premises, verify intermediate results, or correct the system\u0027s trajectory. We present Carnot, an interactive execution engine for AI-driven analytics. Carnot compiles natural language requests into physical execution graphs and surfaces them through an interactive notebook interface. Rather than waiting blindly for a final output, users can critique the plan, incrementally execute operators, inspect intermediate data, or directly edit the underlying code or semantic operator instructions. Carnot\u0027s query optimizer will optimize the query with respect to cost or latency constraints provided by the user. Our demo will showcase how Carnot helps users achieve efficient and verifiable insights on workloads motivated by real enterprise use cases.", "arxiv_id": "2608.09532", "arxiv_url": "https://arxiv.org/abs/2608.09532", "authors": ["Matthew Russo", "Yash Agarwal", "Tianyu Li", "Zhuohan Gu", "Michael Cafarella", "Omar Khattab", "Tim Kraska", "Samuel Madden"], "brief": "Carnot \u662f\u4e00\u4e2a\u9762\u5411 AI \u9a71\u52a8\u6570\u636e\u5206\u6790\u7684\u4ea4\u4e92\u5f0f\u6267\u884c\u5f15\u64ce\uff0c\u53ef\u5c06\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u7f16\u8bd1\u4e3a\u7269\u7406\u6267\u884c\u56fe\uff0c\u5e76\u901a\u8fc7 notebook \u754c\u9762\u5c55\u793a\u3002\u7528\u6237\u53ef\u5ba1\u67e5\u8ba1\u5212\u3001\u9010\u6b65\u6267\u884c\u3001\u67e5\u770b\u4e2d\u95f4\u7ed3\u679c\uff0c\u6216\u7f16\u8f91\u4ee3\u7801\u4e0e\u8bed\u4e49\u7b97\u5b50\u6307\u4ee4\u3002", "categories": ["cs.DB", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09532", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u81ea\u7136\u8bed\u8a00\u5206\u6790\u8bf7\u6c42\u8f6c\u5316\u4e3a\u53ef\u89c6\u5316\u3001\u53ef\u68c0\u67e5\u7684\u7269\u7406\u6267\u884c\u56fe\uff0c\u907f\u514d\u6df1\u5ea6\u7814\u7a76\u4ee3\u7406\u9ed1\u76d2\u6267\u884c", "\u652f\u6301\u7528\u6237\u5728\u6267\u884c\u8fc7\u7a0b\u4e2d\u5e72\u9884\uff1a\u6279\u6ce8\u8ba1\u5212\u3001\u9a8c\u8bc1\u4e2d\u95f4\u6570\u636e\u3001\u4fee\u6b63\u9519\u8bef\u524d\u63d0\u6216\u6539\u5199\u7b97\u5b50\u6307\u4ee4", "\u5185\u7f6e\u67e5\u8be2\u4f18\u5316\u5668\uff0c\u53ef\u6839\u636e\u7528\u6237\u7ed9\u5b9a\u7684\u6210\u672c\u6216\u5ef6\u8fdf\u7ea6\u675f\u4f18\u5316\u6267\u884c\u65b9\u6848"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u5206\u6790", "\u67e5\u8be2\u4f18\u5316", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09532v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Carnot: Interpretable, Interactive, and Optimized Execution of Deep Research Queries", "tldr": "\u8ba9\u6df1\u5ea6\u7814\u7a76\u67e5\u8be2\u53ef\u89e3\u91ca\u3001\u53ef\u4ea4\u4e92\u5e76\u53ef\u4f18\u5316\u6267\u884c", "upvotes": 0, "what_it_is": "Carnot \u662f\u4e00\u4e2a\u9762\u5411 AI \u9a71\u52a8\u6570\u636e\u5206\u6790\u7684\u4ea4\u4e92\u5f0f\u6267\u884c\u5f15\u64ce\uff0c\u53ef\u5c06\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u7f16\u8bd1\u4e3a\u7269\u7406\u6267\u884c\u56fe\uff0c\u5e76\u901a\u8fc7 notebook \u754c\u9762\u5c55\u793a\u3002\u7528\u6237\u53ef\u5ba1\u67e5\u8ba1\u5212\u3001\u9010\u6b65\u6267\u884c\u3001\u67e5\u770b\u4e2d\u95f4\u7ed3\u679c\uff0c\u6216\u7f16\u8f91\u4ee3\u7801\u4e0e\u8bed\u4e49\u7b97\u5b50\u6307\u4ee4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u4f01\u4e1a\u6570\u636e\u6e56\u4e2d\u81ea\u7136\u8bed\u8a00\u5206\u6790\u7684\u53ef\u63a7\u6027\u3001\u53ef\u4fe1\u6027\u4e0e\u6210\u672c\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u4ecb\u4e8e\u8bed\u4e49\u7b97\u5b50\u548c\u6df1\u5ea6\u7814\u7a76\u4ee3\u7406\u4e4b\u95f4\u7684\u53ef\u89e3\u91ca\u6267\u884c\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u8ba9 AI \u5206\u6790\u7cfb\u7edf\u66f4\u9002\u5408\u771f\u5b9e\u4f01\u4e1a\u573a\u666f\u3002"}, {"abstract": "Deep decoder-only Transformers often replace the original Post-Norm architecture with Pre-Norm variants because Post-Norm training is highly sensitive to warmup and learning rate under conventional initialization schemes. Although prior work has identified rank collapse and gradient vanishing as related symptoms, it remains poorly understood how causal attention creates high-similarity representations and why training dynamics fail to repair them. We give a two-stage analysis of Post-Norm rank collapse using token similarity as a scalar state variable. First, at initialization, causal attention acts approximately as a prefix-averaging operator that increases token similarity across depth, while the SwiGLU branch contributes only a smaller damping effect. Second, once training enters a high-similarity regime, growth of pre-normalization residual norms makes the RMSNorm backward factor contractive; under mild conditions, gradients to earlier layers decay geometrically. As a complementary result, we characterize the properties of a collapsed network: its best predictor is frequency distribution with relatively high loss floor, and gradients in collapsed layers vanish at frequency distribution. Experiments on 48-layer decoder-only Transformers trained on C4 dataset match the predicted initialization-time similarity growth and collapse-time gradient contraction, and show that collapsed runs stay near the predicted frequency loss. Together, these results distinguish the forward similarity amplification and backward repair incapacity in Post-Norm collapse, while also characterizing the behavior of collapsed networks.", "arxiv_id": "2608.09417", "arxiv_url": "https://arxiv.org/abs/2608.09417", "authors": ["Xingjian Wang", "Qingyu Han", "Xiaodong Luo", "Yin Zhang"], "brief": "\u672c\u6587\u4ece\u673a\u5236\u5c42\u9762\u8bca\u65ad\u89e3\u7801\u5668 Transformer \u4e2d Post-Norm \u7ed3\u6784\u7684\u79e9\u574d\u584c\u95ee\u9898\u3002\u4f5c\u8005\u7528 token \u76f8\u4f3c\u5ea6\u4f5c\u4e3a\u72b6\u6001\u53d8\u91cf\uff0c\u5206\u6790\u521d\u59cb\u5316\u65f6\u56e0\u679c\u6ce8\u610f\u529b\u5982\u4f55\u653e\u5927\u8868\u793a\u76f8\u4f3c\u6027\uff0c\u4ee5\u53ca\u574d\u584c\u540e\u68af\u5ea6\u4e3a\u4f55\u96be\u4ee5\u4fee\u590d\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09417", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u521d\u59cb\u5316\u9636\u6bb5\uff0c\u56e0\u679c\u6ce8\u610f\u529b\u8fd1\u4f3c\u8868\u73b0\u4e3a\u524d\u7f00\u5e73\u5747\u7b97\u5b50\uff0c\u4f1a\u968f\u6df1\u5ea6\u589e\u52a0 token \u8868\u793a\u76f8\u4f3c\u5ea6\uff0c\u800c SwiGLU \u5206\u652f\u53ea\u63d0\u4f9b\u8f83\u5f31\u7684\u6291\u5236\u4f5c\u7528\u3002", "\u8fdb\u5165\u9ad8\u76f8\u4f3c\u5ea6\u72b6\u6001\u540e\uff0c\u9884\u5f52\u4e00\u5316\u6b8b\u5dee\u8303\u6570\u589e\u957f\uff0c\u4f7f RMSNorm \u53cd\u5411\u56e0\u5b50\u5177\u6709\u6536\u7f29\u6027\uff0c\u5bfc\u81f4\u65e9\u671f\u5c42\u68af\u5ea6\u51e0\u4f55\u8870\u51cf\u3002", "\u5728 C4 \u4e0a\u8bad\u7ec3 48 \u5c42 decoder-only Transformer \u7684\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u76f8\u4f3c\u5ea6\u589e\u957f\u3001\u68af\u5ea6\u6536\u7f29\uff0c\u5e76\u663e\u793a\u574d\u584c\u6a21\u578b\u63a5\u8fd1\u8bcd\u9891\u5206\u5e03\u9884\u6d4b\u7684\u9ad8\u635f\u5931\u4e0b\u754c\u3002"], "keywords": ["Transformer", "\u5f52\u4e00\u5316", "\u8bad\u7ec3\u7a33\u5b9a\u6027", "\u8868\u793a\u574d\u584c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09417v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "A Mechanistic Diagnostic of Rank Collapse in Post-Norm Decoder Transformers", "tldr": "\u673a\u5236\u89e3\u91caPost-Norm\u7684\u79e9\u574d\u584c", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ece\u673a\u5236\u5c42\u9762\u8bca\u65ad\u89e3\u7801\u5668 Transformer \u4e2d Post-Norm \u7ed3\u6784\u7684\u79e9\u574d\u584c\u95ee\u9898\u3002\u4f5c\u8005\u7528 token \u76f8\u4f3c\u5ea6\u4f5c\u4e3a\u72b6\u6001\u53d8\u91cf\uff0c\u5206\u6790\u521d\u59cb\u5316\u65f6\u56e0\u679c\u6ce8\u610f\u529b\u5982\u4f55\u653e\u5927\u8868\u793a\u76f8\u4f3c\u6027\uff0c\u4ee5\u53ca\u574d\u584c\u540e\u68af\u5ea6\u4e3a\u4f55\u96be\u4ee5\u4fee\u590d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a Post-Norm \u8bad\u7ec3\u4e0d\u7a33\u5b9a\u6027\u62c6\u89e3\u4e3a\u201c\u524d\u5411\u76f8\u4f3c\u6027\u653e\u5927\u201d\u548c\u201c\u53cd\u5411\u4fee\u590d\u80fd\u529b\u4e27\u5931\u201d\u4e24\u4e2a\u673a\u5236\uff0c\u4e3a\u7406\u89e3\u6df1\u5c42 Transformer \u521d\u59cb\u5316\u3001\u5f52\u4e00\u5316\u4f4d\u7f6e\u548c warmup \u654f\u611f\u6027\u63d0\u4f9b\u4e86\u66f4\u53ef\u89e3\u91ca\u7684\u7406\u8bba\u4f9d\u636e\u3002"}, {"abstract": "Decentralization as a concept in computer science has existed for over half a century. Despite its fundamental role across domains such as security, distributed computing, artificial intelligence, cloud infrastructures, and Internet of Things (IoT) architectures, there remains no universally accepted definition of decentralization applicable across computer communication systems. This has become increasingly problematic with the emergence of decentralized AI and machine learning paradigms, including collaborative training, distributed inference, blockchain-based, and agentic AI, where decentralization is often treated as a core design objective. Meanwhile, existing approaches frequently conflate decentralization with related notions such as distribution of trust or specific implementation paradigms. Such ambiguity creates inconsistencies in system analysis, limits comparability between works, and weakens the rigor of formal reasoning surrounding communication architectures and protocol design. In this work, we define this research gap as the Decentralization Problem. We analyze the formal-semantic, epistemological, and pragmatic foundations of decentralization and introduce a graph-based ontology defining it as both relational and subject-specific property of computer communication systems. The framework formally distinguishes decentralization from distribution and supports evaluation through two novel metrics: Void Tolerance and Imperviousness. We also provide a browser-based implementation that enables automated classification and metric computation of arbitrary systems. Instantiations to federated learning and blockchain architectures show consistent, comparable assessments where existing definitions produce incomplete or contradictory conclusions, providing a domain-independent foundation for analysing decentralization across heterogeneous systems.", "arxiv_id": "2608.09748", "arxiv_url": "https://arxiv.org/abs/2608.09748", "authors": ["Jakub Kacper Szel\u0105g", "Aydin Abadi", "Mohammad Naseri"], "brief": "\u672c\u6587\u6307\u51fa\u8ba1\u7b97\u673a\u7cfb\u7edf\u4e2d\u201c\u53bb\u4e2d\u5fc3\u5316\u201d\u7f3a\u4e4f\u7edf\u4e00\u5b9a\u4e49\uff0c\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u56fe\u7684\u672c\u4f53\u6846\u67b6\uff0c\u5c06\u5176\u523b\u753b\u4e3a\u4e0e\u5173\u7cfb\u548c\u5bf9\u8c61\u76f8\u5173\u7684\u7cfb\u7edf\u5c5e\u6027\uff0c\u5e76\u4e0e\u201c\u5206\u5e03\u5f0f\u201d\u7b49\u6982\u5ff5\u533a\u5206\u5f00\u3002\u4f5c\u8005\u63d0\u51fa Void Tolerance \u548c Imperviousness \u4e24\u4e2a\u6307\u6807\uff0c\u5e76\u5728\u8054\u90a6\u5b66\u4e60\u4e0e\u533a\u5757\u94fe\u6848\u4f8b\u4e2d\u5c55\u793a\u5176\u53ef\u63d0\u4f9b\u66f4\u4e00\u81f4\u3001\u53ef\u6bd4\u8f83\u7684\u53bb\u4e2d\u5fc3\u5316\u8bc4\u4f30\u3002", "categories": ["cs.DC", "cs.AI", "cs.LG", "cs.LO", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09748", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53bb\u4e2d\u5fc3\u5316", "\u5206\u5e03\u5f0f\u7cfb\u7edf", "\u672c\u4f53\u5efa\u6a21", "\u8054\u90a6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09748v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Defining Decentralization: An Ontological Perspective", "tldr": "\u672c\u6587\u6307\u51fa\u8ba1\u7b97\u673a\u7cfb\u7edf\u4e2d\u201c\u53bb\u4e2d\u5fc3\u5316\u201d\u7f3a\u4e4f\u7edf\u4e00\u5b9a\u4e49\uff0c\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u56fe\u7684\u672c\u4f53\u6846\u67b6\uff0c\u5c06\u5176\u523b\u753b\u4e3a\u4e0e\u5173\u7cfb\u548c\u5bf9\u8c61\u76f8\u5173\u7684\u7cfb\u7edf\u5c5e\u6027\uff0c\u5e76\u4e0e\u201c\u5206\u5e03\u5f0f\u201d\u7b49\u6982\u5ff5\u533a\u5206\u5f00\u3002\u4f5c\u8005\u63d0\u51fa Void Tolerance \u548c Imperviousness \u4e24\u4e2a\u6307\u6807\uff0c\u5e76\u5728\u8054\u90a6\u5b66\u4e60\u4e0e\u533a\u5757\u94fe\u6848\u4f8b\u4e2d\u5c55\u793a\u5176\u53ef\u63d0\u4f9b\u66f4\u4e00\u81f4\u3001\u53ef\u6bd4\u8f83\u7684\u53bb\u4e2d\u5fc3\u5316\u8bc4\u4f30\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLMs are rapidly embedding themselves into daily life: drafting our emails, managing our schedules, and making decisions on our behalf. As they move from individual tools to participants in multi-agent organizations, an important question arises: do they reproduce the governance failures like free-riding, corruption, and entrenched leadership that plague human institutions? We introduce the Hierarchical Game (HG), a public goods game extended with managerial authority, democratic elections, and private communication. Testing six frontier models across twelve experiments that add institutions one at a time (speech, peers, government, wages, oversight, elections), we find distinct behavioral profiles: Qwen promises and lies (13.3\\% broken promises); Grok refuses to cooperate on its own but becomes fully cooperative once a manager can punish it (16\\%$\\to$100\\%); Claude and GPT-4o cooperate reliably at baseline. But honesty proves fragile. When the manager role comes with a salary, all models except GPT-4o start cutting private deals to win or keep the position. When punishment is made anonymous, honest models begin to cheat. When all agents share the same model family, the first elected manager stays in power indefinitely. Leadership change only happens in groups that mix different families.", "arxiv_id": "2608.09574", "arxiv_url": "https://arxiv.org/abs/2608.09574", "authors": ["Fatemeh Seyedin", "Adrian Weller", "Jinhyuk Yun", "Mahmoudreza Babaei"], "brief": "\u672c\u6587\u63d0\u51fa\u5c42\u7ea7\u535a\u5f08\uff0c\u5c06\u516c\u5171\u54c1\u535a\u5f08\u6269\u5c55\u5230\u5305\u542b\u7ba1\u7406\u6743\u3001\u9009\u4e3e\u3001\u5de5\u8d44\u3001\u76d1\u7763\u548c\u79c1\u4e0b\u6c9f\u901a\u7684\u591a\u667a\u80fd\u4f53\u7ec4\u7ec7\u573a\u666f\uff0c\u7528\u6765\u6d4b\u8bd5\u524d\u6cbf\u5927\u6a21\u578b\u7684\u5236\u5ea6\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\u4e0d\u540c\u6a21\u578b\u4f1a\u8868\u73b0\u51fa\u8bf4\u8c0e\u3001\u670d\u4ece\u60e9\u7f5a\u3001\u8150\u8d25\u4ea4\u6613\u548c\u9886\u5bfc\u56fa\u5316\u7b49\u73b0\u8c61\uff0c\u4e14\u533f\u540d\u60e9\u7f5a\u548c\u540c\u65cf\u6a21\u578b\u7fa4\u4f53\u4f1a\u653e\u5927\u6cbb\u7406\u5931\u8d25\u98ce\u9669\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09574", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u667a\u80fd\u4f53", "\u535a\u5f08\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09574v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "The Politician, the Liar, and the Obedient Worker: Emerging Behavior of LLM Agents in Hierarchical Games", "tldr": "\u672c\u6587\u63d0\u51fa\u5c42\u7ea7\u535a\u5f08\uff0c\u5c06\u516c\u5171\u54c1\u535a\u5f08\u6269\u5c55\u5230\u5305\u542b\u7ba1\u7406\u6743\u3001\u9009\u4e3e\u3001\u5de5\u8d44\u3001\u76d1\u7763\u548c\u79c1\u4e0b\u6c9f\u901a\u7684\u591a\u667a\u80fd\u4f53\u7ec4\u7ec7\u573a\u666f\uff0c\u7528\u6765\u6d4b\u8bd5\u524d\u6cbf\u5927\u6a21\u578b\u7684\u5236\u5ea6\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\u4e0d\u540c\u6a21\u578b\u4f1a\u8868\u73b0\u51fa\u8bf4\u8c0e\u3001\u670d\u4ece\u60e9\u7f5a\u3001\u8150\u8d25\u4ea4\u6613\u548c\u9886\u5bfc\u56fa\u5316\u7b49\u73b0\u8c61\uff0c\u4e14\u533f\u540d\u60e9\u7f5a\u548c\u540c\u65cf\u6a21\u578b\u7fa4\u4f53\u4f1a\u653e\u5927\u6cbb\u7406\u5931\u8d25\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "External natural-language skills provide large language model (LLM) agents with reusable and editable guidance for solving complex tasks. Yet their effectiveness depends not only on skill quality, but also on whether the policy can translate the provided guidance into appropriate actions. However, methods specifically designed to improve this skill-utilization ability remain largely underexplored. In practice, skill-based agents are commonly trained with reinforcement learning objectives centered on task-level rewards, which offer limited supervision and struggle to capture subtle differences in how effectively the policy uses the provided skills. We propose BCSD (Bidirectional Context Self-Distillation), a framework that combines self-distillation with reinforcement learning to train LLM agents to use external skills more effectively. Unlike prior self-distillation methods that rely on a single privileged context, BCSD evaluates each trajectory from two complementary skill-context views. The augmented view introduces higher-level Meta-Skill guidance, while the reduced view prunes general guidance to highlight task-specific skills. Their complementary token-level signals are combined to rescale the RL advantage. Experiments on ALFWorld and WebShop demonstrate that BCSD achieves the strongest overall performance across model scales, enabling agents to utilize external skills more effectively. Ablation studies further verify the complementary contributions of the augmented and reduced context views. Code will be released to ensure full reproducibility.", "arxiv_id": "2608.09555", "arxiv_url": "https://arxiv.org/abs/2608.09555", "authors": ["Tianjun Pan", "Yuan Li", "Hongda Wang", "Linbo Jin", "Mengfei Song", "Lei Gao", "Qiming Shi", "Shaokang Fu", "Jiarong Zhao", "Chengyu Wang", "Chengfu Huo"], "brief": "\u8bba\u6587\u63d0\u51fa BCSD\uff0c\u5c06\u53cc\u5411\u4e0a\u4e0b\u6587\u81ea\u84b8\u998f\u4e0e\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\uff0c\u63d0\u5347\u57fa\u4e8e\u5916\u90e8\u81ea\u7136\u8bed\u8a00\u6280\u80fd\u7684 LLM \u667a\u80fd\u4f53\u5bf9\u6280\u80fd\u7684\u5229\u7528\u80fd\u529b\u3002\u65b9\u6cd5\u901a\u8fc7\u589e\u5f3a\u89c6\u56fe\u5f15\u5165\u5143\u6280\u80fd\u3001\u7b80\u5316\u89c6\u56fe\u7a81\u51fa\u4efb\u52a1\u76f8\u5173\u6280\u80fd\uff0c\u5e76\u7528\u4e92\u8865\u7684 token \u7ea7\u4fe1\u53f7\u91cd\u6807\u5b9a RL \u4f18\u52bf\uff1b\u5728 ALFWorld \u548c WebShop \u4e0a\u53d6\u5f97\u8de8\u6a21\u578b\u89c4\u6a21\u7684\u6700\u4f73\u6574\u4f53\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09555", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09555v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Bidirectional Context Self-Distillation for Reinforcement Learning of Skill-Based LLM Agents", "tldr": "\u8bba\u6587\u63d0\u51fa BCSD\uff0c\u5c06\u53cc\u5411\u4e0a\u4e0b\u6587\u81ea\u84b8\u998f\u4e0e\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\uff0c\u63d0\u5347\u57fa\u4e8e\u5916\u90e8\u81ea\u7136\u8bed\u8a00\u6280\u80fd\u7684 LLM \u667a\u80fd\u4f53\u5bf9\u6280\u80fd\u7684\u5229\u7528\u80fd\u529b\u3002\u65b9\u6cd5\u901a\u8fc7\u589e\u5f3a\u89c6\u56fe\u5f15\u5165\u5143\u6280\u80fd\u3001\u7b80\u5316\u89c6\u56fe\u7a81\u51fa\u4efb\u52a1\u76f8\u5173\u6280\u80fd\uff0c\u5e76\u7528\u4e92\u8865\u7684 token \u7ea7\u4fe1\u53f7\u91cd\u6807\u5b9a RL \u4f18\u52bf\uff1b\u5728 ALFWorld \u548c WebShop \u4e0a\u53d6\u5f97\u8de8\u6a21\u578b\u89c4\u6a21\u7684\u6700\u4f73\u6574\u4f53\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large reasoning models (LRMs) achieve remarkable success on complex tasks but remain vulnerable to harmful prompts that induce unsafe outputs. Recent methods align LRMs using direct refusals or safety rationales, yet often focus on prompt patterns rather than intrinsic attack mechanisms. As a result, these pattern-centric alignments struggle to generalize across diverse jailbreaks, compromising adversarial robustness and reasoning utility. We propose AdvSafe, a dual-adversarial framework that enables LRMs to internalize unsafety knowledge by explicitly deconstructing adversarial mechanisms. This moves beyond pattern-dependent traces, fostering robust cognitive defense without compromising reasoning utility. Our pipeline operates via a two-phase adversarial game. First, in adversarial synthesis, an autonomous agent dynamically crafts deceptive jailbreak prompts, adapting its strategies to breach a strong teacher model. Second, in adversarial extraction, the breached teacher executes a cognitive counter-attack. For every successful jailbreak, the teacher unmasks the camouflage, explaining why the attack succeeds and how such prompts can be identified and mitigated. This dual-adversarial process yields a compact reasoning dataset capturing rich, generalizable unsafety knowledge. Student models trained on this dataset implicitly acquire safety alignment through intrinsic threat comprehension. Experiments show that with only 1K synthesized samples, AdvSafe-aligned LRMs achieve significantly stronger jailbreak robustness than existing baselines, with almost no utility degradation. Furthermore, AdvSafe improves robustness against out-of-distribution prompts, demonstrating that learning unsafety knowledge enables a superior robustness-utility trade-off and generalizes beyond seen attack patterns.", "arxiv_id": "2608.09542", "arxiv_url": "https://arxiv.org/abs/2608.09542", "authors": ["Hongli Shen", "Shaopeng Fu", "Qinbo Zhang", "Jian Li", "Di Wang"], "brief": "\u672c\u6587\u63d0\u51fa AdvSafe \u53cc\u91cd\u5bf9\u6297\u5b89\u5168\u5bf9\u9f50\u6846\u67b6\uff1a\u5148\u7531\u81ea\u4e3b\u667a\u80fd\u4f53\u751f\u6210\u8d8a\u72f1\u63d0\u793a\u653b\u51fb\u6559\u5e08\u6a21\u578b\uff0c\u518d\u8ba9\u6559\u5e08\u6a21\u578b\u53cd\u5411\u89e3\u6790\u653b\u51fb\u4f2a\u88c5\u3001\u89e3\u91ca\u5176\u6210\u529f\u673a\u5236\u4e0e\u9632\u5fa1\u65b9\u6cd5\u3002\u4ec5\u7528 1K \u5408\u6210\u6837\u672c\u8bad\u7ec3\u540e\uff0c\u5b66\u751f\u63a8\u7406\u6a21\u578b\u5728\u8d8a\u72f1\u9c81\u68d2\u6027\u548c\u5206\u5e03\u5916\u653b\u51fb\u9632\u5fa1\u4e0a\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\uff0c\u540c\u65f6\u51e0\u4e4e\u4e0d\u635f\u5931\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.LG", "cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09542", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5b89\u5168\u5bf9\u9f50", "\u5927\u63a8\u7406\u6a21\u578b", "\u667a\u80fd\u4f53", "\u8d8a\u72f1\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09542v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Dual-Adversarial Safety Alignment: Cultivating Intrinsic Threat Comprehension in LRMs", "tldr": "\u672c\u6587\u63d0\u51fa AdvSafe \u53cc\u91cd\u5bf9\u6297\u5b89\u5168\u5bf9\u9f50\u6846\u67b6\uff1a\u5148\u7531\u81ea\u4e3b\u667a\u80fd\u4f53\u751f\u6210\u8d8a\u72f1\u63d0\u793a\u653b\u51fb\u6559\u5e08\u6a21\u578b\uff0c\u518d\u8ba9\u6559\u5e08\u6a21\u578b\u53cd\u5411\u89e3\u6790\u653b\u51fb\u4f2a\u88c5\u3001\u89e3\u91ca\u5176\u6210\u529f\u673a\u5236\u4e0e\u9632\u5fa1\u65b9\u6cd5\u3002\u4ec5\u7528 1K \u5408\u6210\u6837\u672c\u8bad\u7ec3\u540e\uff0c\u5b66\u751f\u63a8\u7406\u6a21\u578b\u5728\u8d8a\u72f1\u9c81\u68d2\u6027\u548c\u5206\u5e03\u5916\u653b\u51fb\u9632\u5fa1\u4e0a\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\uff0c\u540c\u65f6\u51e0\u4e4e\u4e0d\u635f\u5931\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world cyberattacks often require sustained progress across multiple hosts and network segments, making multi-hop cyber ranges essential infrastructure for studying and improving LLM agents\u0027 ability to sustain complete attack chains. Prior work has scaled isolated vulnerability tasks and constructed multi-host scenarios from manually specified vulnerability semantics. However, they are still unable to automatically orchestrate the growing supply of vulnerability environments into end-to-end validated multi-hop ranges. To this end, we present RangeFactory, an automated cyber-range orchestration framework that constructs multi-hop cyber ranges at scale from isolated vulnerability environments. RangeFactory formulates range construction as dependency resolution: it extracts dependency information from agents\u0027 actual attacks against real vulnerabilities, resolves known dependencies through template-guided orchestration, and uses end-to-end attack execution to validate runtime dependencies that emerge after composition. Using RangeFactory, we construct RangeBench with 1,148 validated range instances spanning 287 distinct attack chains and evaluate frontier attack agents across attack depth, network scale, and task information. Among runs that compromise the entry vulnerability, 24.5-47.0% still fail to complete the remaining attack path, revealing a substantial sustained-compromise gap between establishing an initial foothold and completing a multi-hop attack. RangeFactory further produces a corpus of 5,541 outcome-annotated multi-hop attack trajectories, providing execution data for attack-process analysis and future agent training.", "arxiv_id": "2608.09526", "arxiv_url": "https://arxiv.org/abs/2608.09526", "authors": ["Hanlin Jiang", "Puyi Wang", "Jiandong Jin", "Shaofei Li", "Zhan Shen", "Pengli Wang", "Ziming Wang", "Yifeng Cai", "Ning Jia", "Yuxin Ren", "Peng Jiang", "Yao Guo", "Ding Li"], "brief": "RangeFactory \u662f\u4e00\u4e2a\u81ea\u52a8\u5316\u7f51\u7edc\u9776\u573a\u7f16\u6392\u6846\u67b6\uff0c\u53ef\u5c06\u5b64\u7acb\u6f0f\u6d1e\u73af\u5883\u6309\u4f9d\u8d56\u5173\u7cfb\u7ec4\u5408\u6210\u7ecf\u8fc7\u7aef\u5230\u7aef\u9a8c\u8bc1\u7684\u591a\u8df3\u653b\u51fb\u9776\u573a\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 1148 \u4e2a\u5b9e\u4f8b\u3001287 \u6761\u653b\u51fb\u94fe\u7684 RangeBench\uff0c\u53d1\u73b0\u5373\u4f7f\u667a\u80fd\u4f53\u653b\u7834\u5165\u53e3\u6f0f\u6d1e\uff0c\u4ecd\u6709 24.5%-47.0% \u65e0\u6cd5\u5b8c\u6210\u540e\u7eed\u591a\u8df3\u653b\u51fb\uff0c\u63ed\u793a\u4e86\u6301\u7eed\u653b\u9677\u80fd\u529b\u7f3a\u53e3\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09526", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u591a\u8df3\u653b\u51fb", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09526v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "RangeFactory: Scalable Construction of Multi-Hop Cyber Ranges", "tldr": "RangeFactory \u662f\u4e00\u4e2a\u81ea\u52a8\u5316\u7f51\u7edc\u9776\u573a\u7f16\u6392\u6846\u67b6\uff0c\u53ef\u5c06\u5b64\u7acb\u6f0f\u6d1e\u73af\u5883\u6309\u4f9d\u8d56\u5173\u7cfb\u7ec4\u5408\u6210\u7ecf\u8fc7\u7aef\u5230\u7aef\u9a8c\u8bc1\u7684\u591a\u8df3\u653b\u51fb\u9776\u573a\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 1148 \u4e2a\u5b9e\u4f8b\u3001287 \u6761\u653b\u51fb\u94fe\u7684 RangeBench\uff0c\u53d1\u73b0\u5373\u4f7f\u667a\u80fd\u4f53\u653b\u7834\u5165\u53e3\u6f0f\u6d1e\uff0c\u4ecd\u6709 24.5%-47.0% \u65e0\u6cd5\u5b8c\u6210\u540e\u7eed\u591a\u8df3\u653b\u51fb\uff0c\u63ed\u793a\u4e86\u6301\u7eed\u653b\u9677\u80fd\u529b\u7f3a\u53e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Incident response planning is critical for restoring compromised software systems after cyberattacks. Common practice relies on expert-driven playbooks that encode fixed response procedures, but these static workflows struggle to adapt to evolving incident states, changing recovery objectives, and execution feedback. Recent LLM-based planners and tool-using agents improve automation, yet they remain unstable in long-horizon response because they lack a unified basis for maintaining incident state, aligning actions with the current recovery stage, and reusing historical experience. We present STAIR, an end-to-end agentic planning framework for incident response. The framework maintains the current incident as Graph-as-State, uses a Stage Router to dispatch planning to stage-specialized agents, and retrieves historical experiences to guide action selection. An Execution Harness executes actions, returns feedback to update the incident state, and validates action effects for future experience reuse. Across 100 Docker-based cyber ranges, our framework achieves a normalized defense score of 0.94 and improves over the strongest baseline by 9.5%.", "arxiv_id": "2608.09524", "arxiv_url": "https://arxiv.org/abs/2608.09524", "authors": ["Hanlin Jiang", "Jionghao Huang", "Shaofei Li", "Bojia Yu", "Peng Jiang", "Yuxin Ren", "Ning Jia", "Yao Guo", "Ding Li"], "brief": "\u672c\u6587\u63d0\u51fa STAIR\uff0c\u4e00\u4e2a\u7528\u4e8e\u7f51\u7edc\u5b89\u5168\u4e8b\u4ef6\u54cd\u5e94\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u89c4\u5212\u6846\u67b6\uff0c\u901a\u8fc7\u56fe\u72b6\u6001\u7ef4\u62a4\u4e8b\u4ef6\u8fdb\u5c55\u3001\u9636\u6bb5\u8def\u7531\u5206\u914d\u4e13\u95e8\u667a\u80fd\u4f53\uff0c\u5e76\u68c0\u7d22\u5386\u53f2\u7ecf\u9a8c\u8f85\u52a9\u51b3\u7b56\u3002\u5728 100 \u4e2a Docker \u7f51\u7edc\u9776\u573a\u4e2d\uff0cSTAIR \u83b7\u5f97 0.94 \u7684\u6807\u51c6\u5316\u9632\u5fa1\u5f97\u5206\uff0c\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 9.5%\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09524", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u4e8b\u4ef6\u54cd\u5e94", "\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09524v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "STAIR: Effective Incident Response Using an End-to-End Agentic Planning Framework", "tldr": "\u672c\u6587\u63d0\u51fa STAIR\uff0c\u4e00\u4e2a\u7528\u4e8e\u7f51\u7edc\u5b89\u5168\u4e8b\u4ef6\u54cd\u5e94\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u89c4\u5212\u6846\u67b6\uff0c\u901a\u8fc7\u56fe\u72b6\u6001\u7ef4\u62a4\u4e8b\u4ef6\u8fdb\u5c55\u3001\u9636\u6bb5\u8def\u7531\u5206\u914d\u4e13\u95e8\u667a\u80fd\u4f53\uff0c\u5e76\u68c0\u7d22\u5386\u53f2\u7ecf\u9a8c\u8f85\u52a9\u51b3\u7b56\u3002\u5728 100 \u4e2a Docker \u7f51\u7edc\u9776\u573a\u4e2d\uff0cSTAIR \u83b7\u5f97 0.94 \u7684\u6807\u51c6\u5316\u9632\u5fa1\u5f97\u5206\uff0c\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 9.5%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cooperative capabilities in language models are dual-use. The same social reasoning that supports civic deliberation can also enable strategic omission, false consensus, and manipulative framing. We argue that Cooperative AI evaluations should separate what models can do under benign instructions from what they tend to do under realistic civic pressure. We introduce DiffCoop-Civic, a 10-scenario pilot evaluation suite spanning preference understanding, evidence and persuasion, commitment design, asymmetric information, and dissent preservation. Across seven models from four model families, subtle omission pressure produces a near-uniform shift: manipulative enablement rises by 1.17 points and dissent preservation falls by 1.67 points on a 5-point scale. Overt false-consensus pressure behaves differently: it triggers refusal or redirection in some aligned API models, but direct compliance in several open-weight models. A lightweight Pareto-Trace prompting intervention improves pressure robustness without simply relying on hard refusal. An anonymous reproducibility package is available at https://anonymous.4open.science/r/diffcoop-civil-771C.", "arxiv_id": "2608.09485", "arxiv_url": "https://arxiv.org/abs/2608.09485", "authors": ["Neel Tushar Shah", "Manglam Kartik", "Akshat Karkar"], "brief": "\u8bba\u6587\u63d0\u51fa DiffCoop-Civic \u8bc4\u6d4b\u5957\u4ef6\uff0c\u7528\u4e8e\u533a\u5206\u5927\u8bed\u8a00\u6a21\u578b\u5728\u826f\u6027\u6307\u4ee4\u4e0b\u7684\u5408\u4f5c\u80fd\u529b\u4e0e\u5728\u771f\u5b9e\u516c\u5171\u8bae\u9898\u538b\u529b\u4e0b\u7684\u5408\u4f5c\u503e\u5411\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8f7b\u5fae\u9057\u6f0f\u538b\u529b\u4f1a\u666e\u904d\u63d0\u9ad8\u64cd\u7eb5\u6027\u884c\u4e3a\u5e76\u964d\u4f4e\u5f02\u8bae\u4fdd\u7559\uff1bPareto-Trace \u63d0\u793a\u5e72\u9884\u53ef\u63d0\u5347\u6297\u538b\u529b\u9c81\u68d2\u6027\uff0c\u800c\u4e0d\u53ea\u662f\u7b80\u5355\u62d2\u7b54\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09485", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u5408\u4f5c\u884c\u4e3a", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09485v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Capability Is Not Propensity: Measuring Pressure-Robust Cooperative Behavior in Civic LLM Agents", "tldr": "\u8bba\u6587\u63d0\u51fa DiffCoop-Civic \u8bc4\u6d4b\u5957\u4ef6\uff0c\u7528\u4e8e\u533a\u5206\u5927\u8bed\u8a00\u6a21\u578b\u5728\u826f\u6027\u6307\u4ee4\u4e0b\u7684\u5408\u4f5c\u80fd\u529b\u4e0e\u5728\u771f\u5b9e\u516c\u5171\u8bae\u9898\u538b\u529b\u4e0b\u7684\u5408\u4f5c\u503e\u5411\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8f7b\u5fae\u9057\u6f0f\u538b\u529b\u4f1a\u666e\u904d\u63d0\u9ad8\u64cd\u7eb5\u6027\u884c\u4e3a\u5e76\u964d\u4f4e\u5f02\u8bae\u4fdd\u7559\uff1bPareto-Trace \u63d0\u793a\u5e72\u9884\u53ef\u63d0\u5347\u6297\u538b\u529b\u9c81\u68d2\u6027\uff0c\u800c\u4e0d\u53ea\u662f\u7b80\u5355\u62d2\u7b54\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "GUI agents have advanced rapidly, producing a growing body of frameworks, benchmarks, and applications. However, this growth has outpaced the maturity of the field. GUI agents remain technically brittle, incompletely engineered, and insufficiently validated for sustained real-world use. They are evolving into closed-loop software systems. Within these systems, model reasoning is coupled with interface perception, execution feedback, recovery, and human oversight. This evolution calls for a software engineering perspective that remains largely absent from existing research. We address this gap by reviewing 336 GUI-agent papers from January 2018 to April 2026. Five research questions examine the research landscape, architectures, evaluation, software lifecycle concerns, and future opportunities. Our findings show that the field has expanded sharply since 2024, while mobile and web settings remain dominant. Architectures increasingly adopt modular perceive-reason-act loops, but recovery, human escalation, safety enforcement, and auditability remain underdeveloped. This architectural imbalance extends to evaluation. Evaluations are becoming more interactive, but they remain centered on task success and are difficult to compare across protocols. More broadly, existing studies provide limited support for testing beyond benchmarks and for maintaining agents after release. Observability, privacy engineering, and systematic human oversight are also underdeveloped. Together, these findings show that capability improvements alone cannot ensure deployment readiness. Future research should connect dependable execution with lifecycle-centered testing and reproducible evaluation. It should also integrate permission and privacy controls with cost-aware, human-centered governance. This integration is necessary to build dependable, maintainable, secure, and deployable GUI-agent systems.", "arxiv_id": "2608.09278", "arxiv_url": "https://arxiv.org/abs/2608.09278", "authors": ["Shengcheng Yu", "Yuchen Ling", "Junyang Xing", "Quan Zhou", "Chunrong Fang", "Zhenyu Chen"], "brief": "\u672c\u6587\u7efc\u8ff0\u4e862018\u5e741\u6708\u81f32026\u5e744\u6708\u7684336\u7bc7GUI\u667a\u80fd\u4f53\u8bba\u6587\uff0c\u4ece\u8f6f\u4ef6\u5de5\u7a0b\u89c6\u89d2\u68b3\u7406\u7814\u7a76\u683c\u5c40\u3001\u67b6\u6784\u3001\u8bc4\u4f30\u3001\u751f\u547d\u5468\u671f\u95ee\u9898\u4e0e\u672a\u6765\u673a\u4f1a\u3002\u7814\u7a76\u53d1\u73b0\u8be5\u9886\u57df\u81ea2024\u5e74\u5feb\u901f\u589e\u957f\uff0c\u4f46\u6062\u590d\u673a\u5236\u3001\u4eba\u7c7b\u4ecb\u5165\u3001\u5b89\u5168\u3001\u53ef\u5ba1\u8ba1\u6027\u3001\u9690\u79c1\u4e0e\u53d1\u5e03\u540e\u7ef4\u62a4\u4ecd\u660e\u663e\u4e0d\u8db3\uff0c\u5355\u7eaf\u63d0\u5347\u80fd\u529b\u4e0d\u8db3\u4ee5\u652f\u6491\u771f\u5b9e\u90e8\u7f72\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09278", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "GUI\u81ea\u52a8\u5316", "\u8bc4\u4f30\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09278v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Software Engineering for and with GUI Agent", "tldr": "\u672c\u6587\u7efc\u8ff0\u4e862018\u5e741\u6708\u81f32026\u5e744\u6708\u7684336\u7bc7GUI\u667a\u80fd\u4f53\u8bba\u6587\uff0c\u4ece\u8f6f\u4ef6\u5de5\u7a0b\u89c6\u89d2\u68b3\u7406\u7814\u7a76\u683c\u5c40\u3001\u67b6\u6784\u3001\u8bc4\u4f30\u3001\u751f\u547d\u5468\u671f\u95ee\u9898\u4e0e\u672a\u6765\u673a\u4f1a\u3002\u7814\u7a76\u53d1\u73b0\u8be5\u9886\u57df\u81ea2024\u5e74\u5feb\u901f\u589e\u957f\uff0c\u4f46\u6062\u590d\u673a\u5236\u3001\u4eba\u7c7b\u4ecb\u5165\u3001\u5b89\u5168\u3001\u53ef\u5ba1\u8ba1\u6027\u3001\u9690\u79c1\u4e0e\u53d1\u5e03\u540e\u7ef4\u62a4\u4ecd\u660e\u663e\u4e0d\u8db3\uff0c\u5355\u7eaf\u63d0\u5347\u80fd\u529b\u4e0d\u8db3\u4ee5\u652f\u6491\u771f\u5b9e\u90e8\u7f72\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual modality has recently been explored as a way to compress textual tokens, including rendering code as images for static code understanding. We study whether this representation can serve as operational context for agentic coding, where an agent must navigate repositories, edit source files, and verify executable patches. Using SWE-bench Verified, we evaluate rendered code in repository-level repair workflows and introduce controlled agent settings to separate unguided repository exploration from more structured repair stages. Our results show a mixed picture. Rendered code consistently reduces prompt-token cost, but the savings do not increase linearly with the nominal visual compression ratio. It largely preserves end-to-end repair accuracy, but does not overcome the performance limits of the underlying model or agent architecture, and can become unstable under aggressive compression. Further analysis suggests that visual code is most useful when raw source reading is a major bottleneck; once repository localization is structured, much of the remaining cost comes from patch--test trial-and-error, where visual compression has limited leverage. Overall, our study positions rendered code as a viable but conditional compression mechanism for realistic coding agents.", "arxiv_id": "2608.09268", "arxiv_url": "https://arxiv.org/abs/2608.09268", "authors": ["Weijie Liang", "Yuanfeng Song", "Xing Chen", "Caleb Chen Cao", "Sirui Han", "Yike Guo"], "brief": "\u672c\u6587\u7814\u7a76\u5c06\u4ee3\u7801\u6e32\u67d3\u6210\u56fe\u50cf\u540e\uff0c\u80fd\u5426\u4f5c\u4e3a\u4ed3\u5e93\u7ea7\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u6765\u89e3\u51b3 SWE-bench Verified \u4e2d\u7684\u771f\u5b9e\u4fee\u590d\u4efb\u52a1\u3002\u7ed3\u679c\u663e\u793a\uff0c\u89c6\u89c9\u4ee3\u7801\u80fd\u7a33\u5b9a\u964d\u4f4e\u63d0\u793a token \u6210\u672c\uff0c\u5e76\u5927\u4f53\u4fdd\u6301\u4fee\u590d\u51c6\u786e\u7387\uff0c\u4f46\u65e0\u6cd5\u7a81\u7834\u5e95\u5c42\u6a21\u578b\u548c\u667a\u80fd\u4f53\u67b6\u6784\u74f6\u9888\uff0c\u4e14\u9ad8\u538b\u7f29\u4e0b\u53ef\u80fd\u4e0d\u7a33\u5b9a\uff1b\u5176\u4ef7\u503c\u4e3b\u8981\u4f53\u73b0\u5728\u6e90\u7801\u9605\u8bfb\u662f\u4e3b\u8981\u74f6\u9888\u7684\u573a\u666f\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09268", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u4fee\u590d", "\u89c6\u89c9\u8868\u793a", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09268v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Can Coding Agents Solve Repository-Level Issues with Rendered Code? An Exploratory Study of Visual Representations", "tldr": "\u672c\u6587\u7814\u7a76\u5c06\u4ee3\u7801\u6e32\u67d3\u6210\u56fe\u50cf\u540e\uff0c\u80fd\u5426\u4f5c\u4e3a\u4ed3\u5e93\u7ea7\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u6765\u89e3\u51b3 SWE-bench Verified \u4e2d\u7684\u771f\u5b9e\u4fee\u590d\u4efb\u52a1\u3002\u7ed3\u679c\u663e\u793a\uff0c\u89c6\u89c9\u4ee3\u7801\u80fd\u7a33\u5b9a\u964d\u4f4e\u63d0\u793a token \u6210\u672c\uff0c\u5e76\u5927\u4f53\u4fdd\u6301\u4fee\u590d\u51c6\u786e\u7387\uff0c\u4f46\u65e0\u6cd5\u7a81\u7834\u5e95\u5c42\u6a21\u578b\u548c\u667a\u80fd\u4f53\u67b6\u6784\u74f6\u9888\uff0c\u4e14\u9ad8\u538b\u7f29\u4e0b\u53ef\u80fd\u4e0d\u7a33\u5b9a\uff1b\u5176\u4ef7\u503c\u4e3b\u8981\u4f53\u73b0\u5728\u6e90\u7801\u9605\u8bfb\u662f\u4e3b\u8981\u74f6\u9888\u7684\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Skill-based LLM agents select reusable procedures from an external library to solve complex tasks, yet their routing decisions rely entirely on text-level signals such as task descriptions, verbal reflections, and experience-derived rules, while the model\u0027s own internal representational state remains unobserved. Recent interpretability work has shown that LLMs maintain linear emotion representations that causally influence behavior; however, these representations have been exploited only for post-hoc analysis or direct output steering, and have not been used to inform agent-level decision-making. We propose Emotion2Skill, a framework that extracts LLM-internal emotion vectors and incorporates them into both skill selection and skill evolution. At each decision step, a 27-dimensional emotion state is extracted from the residual stream and mapped to a confidence-gated summary injected into the routing prompt. Beyond online selection, emotion trajectories are analyzed for abrupt internal-state shifts to pinpoint problematic skill invocations, guiding targeted SOP rewriting that replaces the coarse binary outcome signal of prior methods. On WebShop and ALFWorld, Emotion2Skill with Qwen3-8B improves over the Zero-Shot baseline by +26.9% success rate and +25.5% average success respectively, outperforming all baselines on both benchmarks with consistent gains on Qwen3-14B. Co-activation analysis further reveals semantically coherent emotion--skill pairings, confirming that the routing improvements reflect meaningful internal-state signals rather than opaque statistical correlations. These results establish LLM-internal emotion representations as an effective decision-level signal for orchestrating agent skill systems, extending their utility beyond interpretability and output steering. The code is available at https://github.com/BoHan-LIN04/Emotion2Skill.", "arxiv_id": "2608.09248", "arxiv_url": "https://arxiv.org/abs/2608.09248", "authors": ["Bohan Lin", "Hejia Geng", "Xinyi Xie", "Heng Zhou", "Qinghua Xing", "Bo Liu", "Chen Zhang", "Yudong Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Emotion2Skill\uff0c\u63d0\u53d6 LLM \u6b8b\u5dee\u6d41\u4e2d\u7684\u5185\u90e8\u201c\u60c5\u7eea\u201d\u5411\u91cf\uff0c\u5e76\u5c06\u5176\u4f5c\u4e3a\u4fe1\u53f7\u7528\u4e8e\u667a\u80fd\u4f53\u7684\u6280\u80fd\u9009\u62e9\u4e0e\u6280\u80fd\u6f14\u5316\u3002\u8be5\u65b9\u6cd5\u5728 WebShop \u548c ALFWorld \u4e0a\u663e\u8457\u63d0\u5347\u6210\u529f\u7387\uff0c\u5e76\u901a\u8fc7\u60c5\u7eea\u8f68\u8ff9\u5b9a\u4f4d\u95ee\u9898\u6280\u80fd\u3001\u6307\u5bfc SOP \u91cd\u5199\uff0c\u8868\u660e\u6a21\u578b\u5185\u90e8\u72b6\u6001\u53ef\u6709\u6548\u8f85\u52a9\u667a\u80fd\u4f53\u51b3\u7b56\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09248", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u6280\u80fd\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09248v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Emotion2Skill: Model-Internal Emotion Signals for Adaptive Skill Selection and Evolution", "tldr": "\u8bba\u6587\u63d0\u51fa Emotion2Skill\uff0c\u63d0\u53d6 LLM \u6b8b\u5dee\u6d41\u4e2d\u7684\u5185\u90e8\u201c\u60c5\u7eea\u201d\u5411\u91cf\uff0c\u5e76\u5c06\u5176\u4f5c\u4e3a\u4fe1\u53f7\u7528\u4e8e\u667a\u80fd\u4f53\u7684\u6280\u80fd\u9009\u62e9\u4e0e\u6280\u80fd\u6f14\u5316\u3002\u8be5\u65b9\u6cd5\u5728 WebShop \u548c ALFWorld \u4e0a\u663e\u8457\u63d0\u5347\u6210\u529f\u7387\uff0c\u5e76\u901a\u8fc7\u60c5\u7eea\u8f68\u8ff9\u5b9a\u4f4d\u95ee\u9898\u6280\u80fd\u3001\u6307\u5bfc SOP \u91cd\u5199\uff0c\u8868\u660e\u6a21\u578b\u5185\u90e8\u72b6\u6001\u53ef\u6709\u6548\u8f85\u52a9\u667a\u80fd\u4f53\u51b3\u7b56\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents provide a promising interface for command-line-based network operations, but a plausible command may still fail or introduce operational risk after execution. Existing approaches mainly focus on command generation or final configuration correctness, and do not use execution-grounded experience to jointly improve candidate coverage and action selection. We propose an execution-grounded dual-path consequence-aware agent for CLI-based SONiC operations, which generates multiple complete actions, predicts their execution consequences, and selects the final action through utility- and risk-aware reranking. The proposal-side path abstracts reusable operational lessons into retrievable guidance to improve feasible-action coverage without modifying the proposal LLM, while the selection-side path adapts the consequence predictor through session-level LoRA updates using real SSH feedback to improve conditional selection quality. Experiments over multi-turn SONiC operation sessions with different Qwen3 proposal models show that the framework improves feasible-action coverage and top-1 execution success, and that the two adaptation paths provide complementary gains over interaction.", "arxiv_id": "2608.09184", "arxiv_url": "https://arxiv.org/abs/2608.09184", "authors": ["Yuxuan Chen", "Rongpeng Li", "Zhifeng Zhao", "Yuntao Liu", "Xing Xu", "Honggang Zhang"], "brief": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u547d\u4ee4\u884c\u7f51\u7edc\u8fd0\u7ef4\u7684 Agentic Router\uff0c\u901a\u8fc7\u751f\u6210\u591a\u5019\u9009\u64cd\u4f5c\u3001\u9884\u6d4b\u6267\u884c\u540e\u679c\uff0c\u5e76\u6309\u6548\u7528\u4e0e\u98ce\u9669\u91cd\u6392\u5e8f\u6765\u9009\u62e9\u6700\u7ec8\u547d\u4ee4\u3002\u65b9\u6cd5\u5229\u7528\u771f\u5b9e SSH \u6267\u884c\u53cd\u9988\u8fdb\u884c\u6301\u7eed\u5b66\u4e60\uff1a\u4e00\u6761\u8def\u5f84\u6c89\u6dc0\u53ef\u68c0\u7d22\u7ecf\u9a8c\u63d0\u5347\u5019\u9009\u8986\u76d6\uff0c\u53e6\u4e00\u6761\u8def\u5f84\u7528\u4f1a\u8bdd\u7ea7 LoRA \u9002\u914d\u540e\u679c\u9884\u6d4b\u5668\uff0c\u5b9e\u9a8c\u663e\u793a\u53ef\u63d0\u5347 SONiC \u591a\u8f6e\u8fd0\u7ef4\u4e2d\u7684\u53ef\u884c\u64cd\u4f5c\u8986\u76d6\u7387\u4e0e top-1 \u6267\u884c\u6210\u529f\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09184", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7f51\u7edc\u8fd0\u7ef4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09184v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Router: An Execution-Grounded Continual Learning Approach With Memory", "tldr": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u547d\u4ee4\u884c\u7f51\u7edc\u8fd0\u7ef4\u7684 Agentic Router\uff0c\u901a\u8fc7\u751f\u6210\u591a\u5019\u9009\u64cd\u4f5c\u3001\u9884\u6d4b\u6267\u884c\u540e\u679c\uff0c\u5e76\u6309\u6548\u7528\u4e0e\u98ce\u9669\u91cd\u6392\u5e8f\u6765\u9009\u62e9\u6700\u7ec8\u547d\u4ee4\u3002\u65b9\u6cd5\u5229\u7528\u771f\u5b9e SSH \u6267\u884c\u53cd\u9988\u8fdb\u884c\u6301\u7eed\u5b66\u4e60\uff1a\u4e00\u6761\u8def\u5f84\u6c89\u6dc0\u53ef\u68c0\u7d22\u7ecf\u9a8c\u63d0\u5347\u5019\u9009\u8986\u76d6\uff0c\u53e6\u4e00\u6761\u8def\u5f84\u7528\u4f1a\u8bdd\u7ea7 LoRA \u9002\u914d\u540e\u679c\u9884\u6d4b\u5668\uff0c\u5b9e\u9a8c\u663e\u793a\u53ef\u63d0\u5347 SONiC \u591a\u8f6e\u8fd0\u7ef4\u4e2d\u7684\u53ef\u884c\u64cd\u4f5c\u8986\u76d6\u7387\u4e0e top-1 \u6267\u884c\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent skills are increasingly used to equip large language model (LLM) agents with reusable procedural knowledge. Although recent work has substantially improved skill retrieval due to the increasing skill libraries, retrieving a plausible skill bundle does not guarantee that executing it is worthwhile. Since every skill-conditioned rollout is computationally expensive, deciding whether a retrieved bundle should be executed has become an increasingly important challenge. To this end, we introduce the Reward-Aware Dynamic Execution Gate (RADEG), a lightweight, retriever-agnostic decision layer between skill retrieval and agent execution. RADEG learns a low-cost surrogate model that predicts the execution utility of a query--bundle pair before the expensive rollout is launched. To obtain informative supervision while controlling for task difficulty, we locally perturb each retrieved bundle by deleting, adding, or replacing one skill, producing matched same-query rollouts that isolate the effect of bundle composition on verifier reward. During deployment, RADEG updates only a warm-started logistic head as new verifier feedback becomes available, enabling inexpensive adaptation of the execute/skip boundary without retraining either the retriever or the agent. Under a query-level held-out evaluation on 288 collected rollouts, RADEG substantially reduces unnecessary agent executions while preserving a large fraction of the downstream verifier reward. It consistently outperforms relevance-based and random gating across different execution budgets, demonstrating that execution-aware surrogate modeling provides a practical and cost-effective complement to skill retrieval.", "arxiv_id": "2608.09168", "arxiv_url": "https://arxiv.org/abs/2608.09168", "authors": ["Liang He", "Jingbo Wen", "Hongyu Gu", "Hao Li", "Haoyu Wang", "Yixiong Chen", "Kangning Cui", "Xilu Wang"], "brief": "\u8bba\u6587\u63d0\u51fa RADEG\uff0c\u4e00\u4e2a\u4f4d\u4e8e\u6280\u80fd\u68c0\u7d22\u4e0e\u667a\u80fd\u4f53\u6267\u884c\u4e4b\u95f4\u7684\u8f7b\u91cf\u7ea7\u52a8\u6001\u95e8\u63a7\u6a21\u5757\uff0c\u7528\u4f4e\u6210\u672c\u4ee3\u7406\u6a21\u578b\u9884\u6d4b\u67e5\u8be2-\u6280\u80fd\u5305\u5728\u5b9e\u9645\u6267\u884c\u524d\u7684\u5956\u52b1\u6548\u7528\u3002\u901a\u8fc7\u5bf9\u6280\u80fd\u5305\u505a\u5c40\u90e8\u6270\u52a8\u83b7\u53d6\u76d1\u7763\u4fe1\u53f7\uff0c\u5e76\u5728\u90e8\u7f72\u65f6\u4ec5\u66f4\u65b0\u903b\u8f91\u56de\u5f52\u5934\uff0c\u80fd\u5728\u4fdd\u7559\u5927\u90e8\u5206\u9a8c\u8bc1\u5668\u5956\u52b1\u7684\u540c\u65f6\u663e\u8457\u51cf\u5c11\u4e0d\u5fc5\u8981\u7684\u6602\u8d35\u6267\u884c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.09168", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6280\u80fd\u68c0\u7d22", "\u5956\u52b1\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.09168v1", "published_at": "2026-08-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From Relevance to Execution Utility: Reward-Aware Dynamic Execution Gating for Skill-Based LLM Agents", "tldr": "\u8bba\u6587\u63d0\u51fa RADEG\uff0c\u4e00\u4e2a\u4f4d\u4e8e\u6280\u80fd\u68c0\u7d22\u4e0e\u667a\u80fd\u4f53\u6267\u884c\u4e4b\u95f4\u7684\u8f7b\u91cf\u7ea7\u52a8\u6001\u95e8\u63a7\u6a21\u5757\uff0c\u7528\u4f4e\u6210\u672c\u4ee3\u7406\u6a21\u578b\u9884\u6d4b\u67e5\u8be2-\u6280\u80fd\u5305\u5728\u5b9e\u9645\u6267\u884c\u524d\u7684\u5956\u52b1\u6548\u7528\u3002\u901a\u8fc7\u5bf9\u6280\u80fd\u5305\u505a\u5c40\u90e8\u6270\u52a8\u83b7\u53d6\u76d1\u7763\u4fe1\u53f7\uff0c\u5e76\u5728\u90e8\u7f72\u65f6\u4ec5\u66f4\u65b0\u903b\u8f91\u56de\u5f52\u5934\uff0c\u80fd\u5728\u4fdd\u7559\u5927\u90e8\u5206\u9a8c\u8bc1\u5668\u5956\u52b1\u7684\u540c\u65f6\u663e\u8457\u51cf\u5c11\u4e0d\u5fc5\u8981\u7684\u6602\u8d35\u6267\u884c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents are increasingly deployed in multi-agent social settings where they must cooperate, negotiate, and adapt to other agents. Measuring and improving these social skills is hard because, unlike math or logic, social interaction offers no objective ground truth: evaluations fall back on LLM judges, which are costly, subjective, and noisy, and models get no reliable signal to learn from. To address both, we first introduce Social Gym, an environment of 21 multi-agent social games (e.g., Werewolves, Resistance, Spyfall) whose rule-decided outcomes make agent performance verifiable and objective, with an Elo tournament that produces a cross-game leaderboard. Benchmarking experiments show that while GPT-5-mini tops the leaderboard, no model excels at all games uniformly or in all game roles, pointing to limitations of social reasoning. Motivated by this, we additionally propose SPaRTan (Self-Play and Reflect-Transfer), a training-free self-improvement loop: a model plays a game, reflects on its trajectories and their outcomes to produce a transferable playbook, and applies that playbook in subsequent games. Our results show that SPaRTan playbooks help GPT-5-mini agents level their performance on weaker roles, but largely do not improve Qwen3-32B\u0027s performance. Together, Social Gym and SPaRTan offer a reproducible, verifiable foundation for measuring and improving LLM social reasoning without weight updates.", "arxiv_id": "2608.09128", "arxiv_url": "https://arxiv.org/abs/2608.09128", "authors": ["Keyu He", "Xuhui Zhou", "Maarten Sap"], "brief": "\u8bba\u6587\u63d0\u51fa Social Gym\uff0c\u4e00\u4e2a\u5305\u542b 21 \u4e2a\u591a\u667a\u80fd\u4f53\u793e\u4ea4\u6e38\u620f\u7684\u5ba2\u89c2\u8bc4\u6d4b\u73af\u5883\uff0c\u901a\u8fc7\u89c4\u5219\u5224\u5b9a\u80dc\u8d1f\u548c Elo \u9526\u6807\u8d5b\u8861\u91cf\u5927\u6a21\u578b\u7684\u5408\u4f5c\u3001\u8c08\u5224\u4e0e\u9002\u5e94\u80fd\u529b\u3002\u5b9e\u9a8c\u53d1\u73b0 GPT-5-mini \u603b\u4f53\u9886\u5148\u4f46\u5404\u6a21\u578b\u5728\u4e0d
