  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }

  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }

  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }

<script>
const PAPERS = [{"abstract": "While progress in informal mathematics has come largely from scaling the chain-of-thought and agentic reasoning of frontier language models, formal theorem proving has increasingly relied on human-designed workflows around these models, such as planning, decomposition, and orchestrating specialized provers. This raises a bitter-lesson question: can a simple agentic loop that scales test-time compute match these workflows? The answer matters as formal verification must scale to keep up with frontier models producing research mathematics, yet new workflows rarely settle it, as their gains are often confounded with stronger models or more compute. We study this question with h1, a simple harness that gives a model an efficient interface to Lean 4 and keeps it working through verifier feedback and self-reflection, without imposing a decomposition or search structure. h1 reaches state-of-the-art results on PutnamBench, FATE-X, and FormalConjectures100-Solved, settles eight open problems in FormalConjectures, and, at matched models, matches or outperforms specialized workflows such as Goedel-Architect and AlphaProof Nexus, surprisingly showing that a single attempt (pass@1) can often scale to solve open problems. Through ablations and matched-model comparisons with Claude Code and AxProverBase, we find that simplicity alone is not enough: an efficient Lean interface largely determines cost and solve rate. We thus recommend that future work evaluate frontier models with efficient execution feedback before prescribing workflows, at the risk of bitter lessons.", "arxiv_id": "2610.35962", "arxiv_url": "https://arxiv.org/abs/2610.35962", "authors": ["Skander Moalla", "Ahmad Rammal", "Niket Patel", "Remi Munos", "Julia Kempe"], "brief": "", "categories": ["cs.LG", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.35962", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Meta Llama", "pdf_url": "https://arxiv.org/pdf/2610.35962v1", "published_at": "2026-10-25", "score": 0.479, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35962.png", "title": "h1: A Taste of the Bitter Lesson in Automated Theorem Proving", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Omnimodal large language models (Omni-LLMs) are increasingly expected to assist users while observing continuous audiovisual streams. However, existing evaluations provide limited insight into how reliably these models connect stream evidence and user needs to timely, sustained interventions. We introduce \\textbf{Omni-InteractScope}, a benchmark of 1,479 human-annotated, cross-reviewed interactions with 1,790 temporal targets across eight task groups. It links input modalities, event triggers, intervention types, and user needs, covering event-timed tool invocation and query-free assistance alongside notifications, warnings, state tracking, and continuous responses. Our experimental results on the proposed benchmark reveal three critical limitations of current Omni-LLMs: (1) \\textbf{Timely tool invocation remains unreliable}: all 12 evaluated models produce an on-time first response for at most 40\\% of tool-invocation targets, and joint timing-and-tool accuracy reaches at most 32.0\\%. (2) \\textbf{Query-free reminders remain poorly covered}: all evaluated models achieve lower timely reference-target recall on query-free reminders than on explicit questions, measured on their respective target sets. Reminder recall never exceeds 23.0\\%. (3) \\textbf{End-to-end guidance coverage remains limited}: nine models cover none of the 26 guidance sequences in full, and the remaining three cover only one to three sequences each. Targeted controls further show that tool-invocation scores alone do not establish event grounding and that reminder coverage depends on response history and frequency. These findings motivate developing and evaluating streaming assistants for timely action, initiative under general user needs, and coverage of entire response sequences.", "arxiv_id": "2610.35439", "arxiv_url": "https://arxiv.org/abs/2610.35439", "authors": ["Yinsong Yan", "Ling Wang", "Yuxuan Wang", "Yifan Yang", "Ruiyang Xu", "Junming Lin", "Qi Chen", "Meng Gao", "Minghao Han", "Yunfei Chu", "Qize Yang", "Xize Cheng", "Jin Xu", "Jibin Wu"], "brief": "", "categories": ["cs.AI", "cs.CV", "cs.HC"], "github_repo": "https://github.com/YinsongYan/Omni-InteractScope", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.35439", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2610.35439v1", "published_at": "2026-10-26", "score": 0.477, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35439.png", "title": "Omni-InteractScope: Benchmarking Proactive and Agentic Interaction in Continuous Omnimodal Streams", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal intelligence can be viewed as human-guided co-evolution between worlds and agents through interaction. However, scaling this process faces two bottlenecks: constructing heterogeneous, verifiable environments is costly, and manual Harness iteration cannot keep pace with growing task diversity and complexity. A key insight is that tasks with different modalities and surface forms can share the same underlying capability requirements. We therefore introduce The Trinity, a recursive self-improvement framework coupling world generation with Harness evolution through three roles: Creator, Explorer, and Evolver. Drawing on verified execution trajectories, Evolver shifts the basis of task organization from surface categories to shared requirements, reorganizing the original task tree into a hierarchical capability tree. We introduce Capability-Driven Real2Sim2Real: for heterogeneous tasks at the same node, Creator abstracts their common requirements into simplified, verifiable simulated worlds for capability learning, while evaluation on original tasks measures transfer. Along this capability tree, Explorer progressively evolves reusable capability modules through selective inheritance, forming a Harness tree whose validated updates accumulate across iterations within a fixed topology. The resulting Harnesses specialize in different capabilities, motivating a Capability-Aware Harness Router that uses public task information to select compatible module configurations from the tree. Our evolved Harnesses improve mean performance by 34 points across 28 training benchmarks and 26 points across 18 unseen benchmarks, including two real-world embodied tasks.", "arxiv_id": "2610.36077", "arxiv_url": "https://arxiv.org/abs/2610.36077", "authors": ["Weidong Tang", "Ruiheng Wang", "Jingxuan Zhang", "Hexin Wang", "Haoyuan Chen", "Zhengfeiyang Zhang", "Yixing Ma", "Zichen Jiang", "Ziyu Guo", "Haodong Li", "Zhengbo Jiao", "Zhiqing Cui", "Xinxiang Yin", "Shuo Liang", "Zhenglin Wan", "Hongzhan Lin", "Wangbo Zhao Kaipeng Zhang", "Pengfei Zhou", "Odin Zhang", "Yang You"], "brief": "", "categories": ["cs.AI", "cs.CV"], "github_repo": "https://github.com/InfRec-Cardinal/The-Trinity", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2610.36077", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.36077v1", "published_at": "2026-10-26", "score": 0.4, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (533\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36077.png", "title": "The Trinity:Capability-Driven Recursive Self-Improvement for Multimodal Agents", "tldr": null, "upvotes": 533, "what_it_is": null, "why_notable": null}, {"abstract": "Learning controllable world dynamics from heterogeneous interaction videos is challenging because robot embodiments use incompatible action spaces, while human videos lack native control labels. We present RynnWorld-Latent, a cross-embodiment video world model that uses the 3D-grounded latent actions introduced by RynnLAM as a shared conditioning interface. This representation enables joint pretraining on human interaction videos, robot demonstrations, and simulation rollouts without requiring a common native action space. Built on a pretrained video transformer, RynnWorld-Latent combines global action tokens with an identity-initialized local pathway that aligns actions with future video latents. We pretrain on 23 datasets comprising approximately 553.5M frames and adapt the model to target robots through post-training. The framework supports two data-generation routes: digital teleoperation uses target robot commands to generate action-video demonstrations, while latent-action synthesis transfers source motion to an edited initial frame and pairs the resulting rollout with retargeted pseudo robot actions. Experiments show improved video prediction metrics on public benchmarks and two real-robot platforms, alongside qualitative action following when different action sequences share the same initial observation. Synthetic mid-training improves policy success rates on LIBERO and LIBERO-Plus, and both generation routes improve real-world policy success rates over real-demonstration-only training in the evaluated settings. These results support universal latent actions as a scalable interface for learning controllable visual dynamics across heterogeneous embodiments.", "arxiv_id": "2610.36791", "arxiv_url": "https://arxiv.org/abs/2610.36791", "authors": ["Haoyu Zhao", "Yinzhou Tang", "Zixuan Wang", "Minghao Zhu", "Dongchi Huang", "Xingyue Zhao", "Qin Zhao", "Kehan Li", "Siteng Huang", "Xin Li", "Zhenyu Zeng", "Mingxiu Chen", "Deli Zhao", "Zhongyu Li"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/alibaba-damo-academy/RynnWorld-Latent", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2610.36791", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "DAMO Academy", "pdf_url": "https://arxiv.org/pdf/2610.36791v1", "published_at": "2026-10-27", "score": 0.326, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36791.png", "title": "RynnWorld-Latent: A Cross-Embodiment World Model Conditioned on Universal Latent Actions", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon LLM agents interact with their environments through complete assistant turns while generating each action token by token. We observe that critic values vary primarily across turns, motivating optimization anchored at turns with finer credit allocation among tokens. We propose Multiscale Policy Optimization (MPO), combining Multiscale Advantage Estimation (MAE) and turn-level importance sampling to align credit assignment and policy updates at the turn scale. Extensive experiments across search, tool-use, and automation tasks with 4B and 30B-A3B models demonstrate consistent gains over strong RL baselines.", "arxiv_id": "2610.35013", "arxiv_url": "https://arxiv.org/abs/2610.35013", "authors": ["Tao Ren", "Hui Yang", "Jia Deng", "Tingyang Chen", "Qiyao Wang", "Shuo Tang", "Ziyang Zeng", "Yuhua Jiang", "Guanghao Li", "Huatong Song", "Yining Li", "Yifan Luo", "Kunbao Ding", "Feng Chang", "Chuan Hao", "Ran Tao", "Bryan Dai", "Jiafeng Liang", "Jinyang Jiang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.35013", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": "IQuest", "pdf_url": "https://arxiv.org/pdf/2610.35013v1", "published_at": "2026-10-26", "score": 0.315, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (373\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35013.png", "title": "Multiscale Policy Optimization for Long-Horizon LLM Agents", "tldr": null, "upvotes": 373, "what_it_is": null, "why_notable": null}, {"abstract": "Learning velocity fields directly in pixel space is difficult and slow. We show that coarse second-order image statistics can ease this task: frozen Wiener estimates improve velocity learning, with gains extending beyond the linear predictions they explicitly provide. Moreover, we observe similar but complementary gains from frozen bases and pixel decoding. These observations motivate Wiener-informed Decoding (WiD), which uses statistical knowledge both for direct prediction and to organize decoder computation without modifying native blocks. WiD combines a trainable Wiener prediction path with coefficient interfaces that inject features into the native decoder and return its predicted coefficient corrections, with these components initialized with data statistics. All introduced parameters, including the spectrum and coordinate transforms, are trained jointly under the original pixel-space velocity objective. Across model scales and decoder architectures, WiD accelerates training and improves generation quality with modest parameter overhead. It also yields smoother gradient trajectories and remains effective with representation alignment. WiD improves class-conditional and text-to-image generation across different resolutions. On ImageNet 256 x 256, PixelDiT-XL with WiD reaches FID 1.53 after 500 epochs, achieving comparable quality to PixelDiT with 37.5% fewer training epochs. Statistical denoisers contribute beyond the estimate: their computational structure can also ease pixel-space training.", "arxiv_id": "2610.36192", "arxiv_url": "https://arxiv.org/abs/2610.36192", "authors": ["Ziqiao Wang", "Yang You"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/NUS-HPC-AI-Lab/WiD", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2610.36192", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.36192v1", "published_at": "2026-10-26", "score": 0.262, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36192.png", "title": "Beyond the Estimate: Wiener-Informed Decoding for Easier Training of Pixel-Space Flow Models", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Text-to-image (T2I) platforms typically return several images per prompt so users can explore different visual interpretations and choose one that matches their intent. However, T2I models are usually optimized for single-image quality which comes at a cost of multi-image diversity, limiting this exploration. Diversity is also contextual: one user wants variations in background, while another wants them in artistic style, and the same user may later want variations in clothing. The generated images should differ along whatever axis the user cares about. In this paper, we introduce T-DIG, a text-conditioned diversity framework for image generation and editing. T-DIG is an iterative framework comprising multiple modules that lets users type prompts, inspect default generations, request variations using natural language, and continue refining outputs until they\u0027re satisfied. At its core, T-DIG uses an LLM policy that produces K axis-conditioned prompts or edit instructions for a frozen generator or editor. We train this policy with GRPO using a text-conditioned diversity reward and alignment penalties. Because the image generator remains frozen, T-DIG applies to open-weight, distilled, and proprietary models. We also release the first dataset for text-conditioned prompt diversity in image generation, with the training and validation splits built from human-written axes and a test set drawn from real user interactions with T-DIG. T-DIG far exceeds baselines in improving text-conditioned diversity, while preserving base-prompt alignment across a variety of metrics and human judgements. We show that user-directed diversity exploration can be added to a wide range of image generation models, open and closed, without the need to access their weights. Website: https://image-study.org/t-dig/", "arxiv_id": "2610.29003", "arxiv_url": "https://arxiv.org/abs/2610.29003", "authors": ["Simran Khanuja", "Rohit Gandikota", "Gaurav Parmar", "Graham Neubig"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/simran-khanuja/t-dig", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.29003", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.29003v1", "published_at": "2026-10-21", "score": 0.261, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.29003.png", "title": "T-DIG: Text-Conditioned Diversity for Image Generation", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Data science agents can automate end-to-end machine learning workflows, yet they remain far from competitive on human leaderboards. Agents make process errors such as insufficient exploration, unsound validation, coding bugs, and poor use of a fixed budget (re-running the same exploratory data analysis and baseline models in every attempt). We propose AdaPRA to address these issues: a persistent coding agent harness that accumulates knowledge across attempts on the same task, with rubric-guided process supervision that identifies and corrects errors. Our process reward agent audits the agent\u0027s trajectory and workspace by executing checks, and adapts its rubrics to each task. We find that rubrics seeded from easier tasks generalize to harder tasks, with rubric adaptation further improving performance. With five attempts per task, AdaPRA improves an 80B Qwen model\u0027s leaderboard percentile by 24.5 points on DSPredict-Easy and 14.8 points on DSPredict-Hard while reducing process errors. We also show that supervision with rubrics mined from one base model\u0027s runs improves another (DeepSeek-V3.2), and that AdaPRA beats DataPRM, a competitive PRM for data science. We also share our code for reproducibility.", "arxiv_id": "2610.33245", "arxiv_url": "https://arxiv.org/abs/2610.33245", "authors": ["Atharva Naik", "Vivek Chari", "Pol Llado", "Daniel Fried", "Carolyn Ros\u00e9", "Benjamin Van Durme", "Sam Thomson", "Justin Svegliato"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.33245", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.33245v1", "published_at": "2026-10-23", "score": 0.25, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33245.png", "title": "AdaPRA: Process Reward Agents with Adaptive Rubrics for Data Science", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Forecasting an unresolved event requires finding relevant evidence and deciding how strongly it supports each outcome. Yet outcome-based training of Large Language Model (LLM) forecasters often begins with preassembled evidence at a single prediction date, leaving evidence acquisition outside the learning loop. We introduce AlphaBet, an agentic reinforcement learning (RL) framework that trains a single LLM policy to search, reason, and report probabilities across multiple pre-resolution dates. Each dated forecast is scored by a proper scoring rule against the eventual outcome, allowing one resolved event to supervise decisions under different information states. We decompose forecasting regret into an evidence-acquisition gap and a probability-reporting gap, and show that Group Relative Policy Optimization (GRPO)\u0027s standard-deviation normalization can distort the reporting target under multi-class proper scores. On GLM-4.5-Air, AlphaBet reduces the Brier score from 0.731 to 0.626 on Forecast-Dojo and from 0.612 to 0.528 on FutureX. Controlled ablations attribute these gains to multi-date training and show that they come from improvements in both information acquisition and probability reporting. Our empirical results validate that GRPO\u0027s std normalization degrades proper-scoring-rule performance while leaving top-outcome accuracy largely unchanged.", "arxiv_id": "2610.22684", "arxiv_url": "https://arxiv.org/abs/2610.22684", "authors": ["Liqin Ye", "Rongzhi Zhang", "Xin Liu", "Zheng Li", "Yuan He", "Qingyu Yin", "Priyanka Nigam", "Chao Zhang"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/AlphaBet-Agent/AlphaBet", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.22684", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Georgia Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2610.22684v1", "published_at": "2026-10-15", "score": 0.198, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22684.png", "title": "AlphaBet: Reinforcement Learning for LLM Event Forecasting Agents", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion language models (DLMs) generate text through iterative denoising, enabling bidirectional context modeling and parallel token refinement. Recent studies have applied reinforcement learning (RL) to DLMs and improved their reasoning performance. However, the iterative denoising process makes credit assignment more challenging, as final outcome rewards provide limited information about how different tokens contribute to the final output. In this paper, we propose Denoising Token Credit Assignment (DTCA), a framework for token-level credit assignment in reinforcement learning for diffusion language models. DTCA estimates token contributions by measuring the improvement in prediction confidence of remaining masked positions after token commitment and groups these signals according to part-of-speech (POS) categories. These contribution weights are used to select informative denoising timesteps and assign token-level learning signals during RL training. DTCA further calibrates these learning signals according to token-level entropy changes induced by policy updates. Experiments on LLaDA-8B-Instruct show that DTCA consistently improves mathematical reasoning performance across different generation budgets, with gains of up to 9.0 points on MATH500 and 5.3 points on GSM8K over the base model.", "arxiv_id": "2610.35201", "arxiv_url": "https://arxiv.org/abs/2610.35201", "authors": ["Hongze Chen", "Miao Pan", "Lizhou Liang", "Qinfeng Li", "Xinyin Ma", "Yongliang Shen", "Weishi Wang", "Daniel Dahlmeier", "Xuhong Zhang", "Wenqi Zhang"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/ZJU-OmniAI/DTCA", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.35201", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ZJU-OmniAI", "pdf_url": "https://arxiv.org/pdf/2610.35201v1", "published_at": "2026-10-26", "score": 0.16, "selected_reasons": ["HF trending (250\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35201.png", "title": "DTCA: Denoising Token Credit Assignment for Reinforcement Learning in Diffusion Language Models", "tldr": null, "upvotes": 250, "what_it_is": null, "why_notable": null}, {"abstract": "Memory is increasingly used in long-horizon agents, yet the net value of building memory over direct retrieval from raw history remains largely unclear. Through a large-scale evaluation across multiple benchmarks and model backbones, we find many dedicated memory systems underperform naive RAG in many cases, indicating a negative net value. Taking RAG as a reference, we dissect the net value of memory into the gains and losses over direct retrieval, termed memory benefit and memory tax. These gains and losses arise because memory process changes how the raw information is organized and accessed. We view such changes as the double-edged deviations from the raw history. They are originally designed and introduced to benefit the task, for example by reorganizing facts or distilling preferences, but some may also remove or obscure evidence, giving rise to memory tax. Since memory benefit reflects the expected gains of its design, we then focus more on the overlooked memory tax, study how it arises from the system and evaluation side, and generalize the concept to more application scenarios of memory. We hope the notion of memory tax can provide a new lens and shift more attention from standalone performance to the net value of memory, informing more reliable memory designs and evaluations. We will open-source the code and results to the community. Project Page: https://hexuan21.github.io/MemoryTax/", "arxiv_id": "2610.34073", "arxiv_url": "https://arxiv.org/abs/2610.34073", "authors": ["Xuan He", "Sining Zhoubian", "Ruozhen Yang", "Yuhao Wen", "Zhineng Wang", "Yuyang Hu", "Ke Yang", "Yuyu Zhang", "Ping Nie", "Jiawei Han", "ChengXiang Zhai"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/hexuan21/MemoryTax", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2610.34073", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2610.34073v1", "published_at": "2026-10-25", "score": 0.159, "selected_reasons": ["HF trending (141\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34073.png", "title": "Memory Tax: Dissecting the Net Value of Agent Memory", "tldr": null, "upvotes": 141, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion video models produce striking clips, but they cannot reliably render an exact formula, a correct chart, a rule-consistent game or narration synchronized to on-screen events. A different route is emerging: multimodal agents that write code to render every frame and synthesize every sound. We introduce VibeVideoBench, a benchmark for evaluating agents on code-driven video generation. Its 239 self-contained tasks in English and Chinese span 12 categories, from data stories and music-driven pieces to classroom lessons and paper explainers; each asks an agent, running in its native harness inside a sandbox with no image or video generation model, to deliver a finished MP4 with sound within one hour. Evaluation is hierarchical and evidence-based: program checks of the delivery spec, about 13k task-specific rubric checks traced to the requirements they enforce, and five quality dimensions anchored per task, scored by three VLM judge panels. Across nine frontier agent systems and 2,151 scored rollouts, GPT-6 Astra and Claude Opus 5.5 rank first and second with both the judges and human annotators, and the strongest system satisfies every core requirement on 76.3% of tasks. Delivery is a second axis: counting missing videos as zero changes the ranking, and three quarters of the lost videos are final renders that started too late, ran too slowly or never started, a failure of how agents plan their hour. Agents build their own rendering pipelines and inspect their own frames, yet how much they look does not predict quality. The judges\u0027 ranking of the systems closely matches blind human preferences.", "arxiv_id": "2610.35864", "arxiv_url": "https://arxiv.org/abs/2610.35864", "authors": ["Muxi Diao", "Wenbin Xu", "Lele Yang", "Xuyang Ma", "Yuzhe Chen", "Jiankang Chen", "Kaiyu Jiang", "Changyi Liu", "Haoyu Zhang", "Hongyi Fu", "Jianxiong Wang", "Tianke Zhang", "Haonan Fan", "Yingxin Li", "Bingyi Li", "Xu Wang", "Xuanyu Zheng", "Bin Wen", "Tingting Gao", "Han Li", "Wentao Zhang", "Weiran Xu", "Kongming Liang", "Zhanyu Ma"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.35864", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.35864v2", "published_at": "2026-10-26", "score": 0.141, "selected_reasons": ["HF trending (173\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35864.png", "title": "VibeVideoBench: Evaluating Multimodal Agents on Code-Driven Video Generation", "tldr": null, "upvotes": 173, "what_it_is": null, "why_notable": null}, {"abstract": "High-resolution video matting requires preserving fine details, such as hair strands and soft transparency, while maintaining consistency across frames. Memory-based methods achieve strong matting quality by matching current-frame features with information stored from earlier frames, but this process becomes increasingly costly as resolution grows. We present MatAnyone-E, an efficient extension of MatAnyone 2 that focuses computation where it is most needed. Our approach first performs low-resolution propagation to identify uncertain regions that require closer inspection and the memory candidates most relevant to them. It then performs high-resolution matching only for these regions using the selected memory, while reusing low-resolution matching results elsewhere. This strategy reduces both the number of locations requiring detailed matching and the amount of memory searched, while preserving the information needed to produce a complete matte. We further reduce the cost of generating high-resolution mattes with a lightweight decoder designed around measured runtime bottlenecks and trained to reproduce the original decoder\u0027s representations. Experiments show that MatAnyone-E maintains matting quality comparable to MatAnyone 2 while achieving an estimated 7.4x inference speedup and reducing peak GPU memory usage to 7.6% of the usage of MatAnyone 2 at 4K. With compilation-enabled inference on a single NVIDIA H200 GPU, it reaches 73.07 FPS at 1080p and 28.62 FPS at 4K.", "arxiv_id": "2610.35724", "arxiv_url": "https://arxiv.org/abs/2610.35724", "authors": ["Shuyun Wang", "Shangchen Zhou", "Peiqing Yang", "Yuekun Dai", "Xin Yu", "Chen Change Loy"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Shuyun-Wang/MatAnyone-E", "github_stars": 64, "hf_url": "https://huggingface.co/papers/2610.35724", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "MMLab@NTU", "pdf_url": "https://arxiv.org/pdf/2610.35724v1", "published_at": "2026-10-26", "score": 0.12, "selected_reasons": ["HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35724.png", "title": "MatAnyone-E: Sparse Memory Propagation for Efficient High-Resolution Video Matting", "tldr": null, "upvotes": 18, "what_it_is": null, "why_notable": null}, {"abstract": "Image and video generators can produce spatially consistent visual content, but how to use this capability to improve spatial understanding remains underexplored. We study this problem from two perspectives: geometric supervision during training and explicit geometric evidence during inference. To this end, we introduce a unified geometric understanding and generation model (GeoUG) that integrates depth and multi-view generation with spatial understanding. First, we design a multi-scale depth codec that enables metric-depth generation using a pretrained visual autoencoder, and show that joint training yields task-dependent gains in spatial understanding. Second, we introduce 3DCueBench to control geometric difficulty while balancing selected 2D cues, and find that generated depth provides larger reasoning gains on questions requiring fine-grained geometric discrimination. Building on this finding, we develop adaptive interleaved reasoning, in which GeoUG first drafts an answer and then decides whether to generate geometric evidence to confirm or revise it. We train this decision through reinforcement learning, balancing accuracy gains over retaining the draft against generation cost. GeoUG achieves circular accuracies of 97.9%, 90.8%, and 94.2% on CV-Bench-3D, 3DCueBench, and DA-2K with fewer generation calls than always generating.", "arxiv_id": "2610.36022", "arxiv_url": "https://arxiv.org/abs/2610.36022", "authors": ["Rui Yang", "Yanwei Li", "Sili Chen", "Jingjia Huang", "Yi Lin", "Hengshuang Zhao"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/hku-sail/GeoUG", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2610.36022", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.36022v1", "published_at": "2026-10-26", "score": 0.074, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36022.png", "title": "Learning and Reasoning with Geometry: How Generation Helps Spatial Understanding", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "How much of zero-shot benchmark accuracy is captured by word-level alignment between a pre-training corpus and the benchmark target? We study this question through word-level unigram cross-entropy (UCE), a tokenizer-agnostic, model-free measure of lexical alignment between a reference corpus and a target benchmark. Likelihood training shapes the model\u0027s predictive distribution from the pre-training corpus, and zero-shot scores under likelihood-based evaluation depend in part on the lexical alignment between that corpus and the benchmark target. Cleanly tracing how the lexical imprint of pre-training data scales with corpus--benchmark alignment requires controlled from-scratch pre-training that varies corpus identity while holding the training recipe fixed. Across this controlled sweep, spanning $10$ zero-shot benchmarks, $4$ pre-training corpora, and $3$ model scales, we find that corpus--benchmark lexical alignment, UCE, consistently tracks zero-shot accuracy on every benchmark, with corpora more aligned with the benchmark (lower UCE) achieving higher accuracy. The same signal extends from measurement to control at finer scopes. At the document level, strengthening the imprint by selecting training documents to maximize lexical alignment with the benchmark produces the accuracy gains predicted by the mechanism. At the prompt level, matching the imprint per prompt by routing each prompt to the drafter whose domain corpus is most lexically aligned with it produces measurable throughput gains over a generalist-drafter baseline. Taken together, pre-training corpora leave a measurable lexical imprint on base-model zero-shot behavior, and UCE provides a model-free probe of lexical alignment between reference and target data.", "arxiv_id": "2602.10657", "arxiv_url": "https://arxiv.org/abs/2602.10657", "authors": ["Jeonghoon Kim", "Woojin Chung", "Woomin Song", "Cheonbok Park", "Nako Sung", "Jinwoo Shin"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/penpaperkeycode/lexical-imprint", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2602.10657", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "HyperCLOVA X", "pdf_url": "https://arxiv.org/pdf/2602.10657v2", "published_at": "2026-02-11", "score": 0.073, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2602.10657.png", "title": "The Lexical Imprint of Pre-training Data", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Safe household navigation requires robots to regulate clearance and speed according to what an obstacle is and how close it is, without unnecessary conservatism. Yet existing evaluations do not test whether semantic safety distinctions are reflected in continuous motion. To that end, we introduce OSMA-Bench, an Obstacle-Conditioned Safe Motion Adaptation Benchmark built on spatially matched scenario sets that differ only in obstacle type. We also propose the \\emph{Semantic Sensitivity Index} (SSI), which measures whether clearance and distance-dependent speed and smoothness follow the caution ordering of obstacles. Evaluating VLM-based and vision-language-action (VLA) policies on the benchmark, we find that neither consistently adapts its motion to obstacle safety, even with explicit safety prompts. Our analysis shows that the policies can correctly distinguish obstacles by safety relevance but fail to reflect this distinction in the motion parameters or actions they produce. For VLM-based policies, which recognize the obstacle and then generate a navigation program, adding an explicit parameter-inference step between these two stages improves adaptation. These findings expose a gap in \\emph{semantic-to-motion grounding}, highlighting the need to translate semantic caution into appropriately safe motion.", "arxiv_id": "2610.34674", "arxiv_url": "https://arxiv.org/abs/2610.34674", "authors": ["Hyunwoong Bae", "Jisu Han", "Jiyeon Choi", "Dohoon Kim", "Taesup Moon"], "brief": "", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": "https://github.com/OSMA-Bench/OSMA-Bench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.34674", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Seoul National University", "pdf_url": "https://arxiv.org/pdf/2610.34674v1", "published_at": "2026-10-26", "score": 0.065, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34674.png", "title": "Benchmarking Obstacle-Conditioned Safety in Household Robot Navigation", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Despite rapid advances in large language models (LLMs), their deployment in the sports and health domain remains high-risk due to the absence of domain-specific evaluation benchmarks. Existing general-purpose benchmarks (e.g., MMLU and HELM) primarily assess broad knowledge and reasoning capabilities, but fail to capture critical domain requirements such as exercise safety, physiological appropriateness, personalization, and actionable coaching quality. This gap is particularly concerning in fitness and health applications, where incorrect or unsafe recommendations can lead to physical harm. To address this limitation, we introduce MoveBench, the first comprehensive benchmarking framework specifically designed for evaluating LLMs in sports and health coaching. The proposed benchmark integrates heterogeneous task formats, including multiple-choice questions (MCQs) and open-ended question answering (OpenQA), grounded in real-world user scenarios and paired with structured rubrics emphasizing safety compliance, scientific validity, and training logic. Through large-scale evaluation of 15 diverse LLMs on 809 questions with 5,012 rubric-level criteria, our results reveal substantial performance variability, particularly in safety awareness, structured program design, and personalization capability, highlighting a critical gap between knowing and doing. Our work establishes a foundational evaluation standard for sports and health LLM applications and provides a reproducible framework for advancing safe, reliable, and context-aware AI-driven coaching systems. Open resources are available at https://github.com/SatoSakula/MoveBench.", "arxiv_id": "2610.26185", "arxiv_url": "https://arxiv.org/abs/2610.26185", "authors": ["Yitong Li", "Jiang Bian", "Jingling Wang", "Pan Ding", "Chengying Gu"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/Keep-Tech/MoveBench", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.26185", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26185v2", "published_at": "2026-10-19", "score": 0.061, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26185.png", "title": "MoveBench: A Rubric-Based Benchmark for Evaluating Large Language Models in Sports and Health Coaching", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce OvisOCR3, a 0.8B model for a broad range of OCR-related tasks. OvisOCR3 unifies document parsing, general OCR, key information extraction (KIE), document figure captioning, and cross-page table reconstruction in a single model. We train the model on real and synthetic data through continued pretraining and use domain-balanced mid-training to balance supervision across tasks with different data volumes and response lengths. Multi-teacher on-policy distillation transfers expertise from five domain-specific 4B teachers into the shared model, followed by mixed-task reinforcement learning with domain-specific rewards. We compare OvisOCR3 with general-purpose vision-language models and specialized OCR models on public and in-house benchmarks covering all five task families. In these comparisons, it achieves an overall score of 96.74 on OmniDocBench v1.6 and the highest overall scores on PureDocBench, Real5-OmniDocBench, and MDPBench. On OCRBench v2, it ranks first, scoring 65.9 and 61.3 on the English and Chinese splits, respectively. It also outperforms the baselines on OCRBench and all four KIE benchmarks. On DocFigCapBench, it achieves the highest localization F1 and a caption score close to that of Qwen3.8-Max. For cross-page tables, it leads in Relation F1 on CrossTabBench and truncated-table TEDS on MPDocBench-Parse. These results demonstrate that a compact 0.8B model can achieve strong performance across diverse OCR-related tasks. OvisOCR3 is available at https://huggingface.co/ATH-MaaS/OvisOCR3.", "arxiv_id": "2610.33066", "arxiv_url": "https://arxiv.org/abs/2610.33066", "authors": ["Yu Xia", "Yinglun Li", "Yuhui Chen", "Jinlong Huang", "Yuyang Wanyan", "Shengze Shi", "Yifei Song", "Yue Duan", "Shubo Lin", "Jianshan Zhao", "En Lin", "Shiyin Lu", "Qing-Guo Chen", "Zhao Xu", "Weihua Luo"], "brief": "", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.33066", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ATH-MaaS", "pdf_url": "https://arxiv.org/pdf/2610.33066v1", "published_at": "2026-10-20", "score": 0.058, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33066.png", "title": "OvisOCR3 Technical Report", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Looped transformers reuse a shared block of layers to increase computational depth without increasing the number of trainable parameters. They are trained with backpropagation through time (BPTT). To save training compute, BPTT is often truncated to the last few loops, but truncation yields biased gradients that may weaken the benefit of looping. In this work, we study the value of truncation in looped transformer training in a systematic way: we jointly vary model size, training tokens, and forward and backward loop counts across nearly 600 training runs and fit a unified scaling law that captures the effects of looping and truncation through effective parameters. Despite the training-compute savings of truncation, our fitted law favors full BPTT when forward and backward loop counts are jointly optimized. In matched-compute runs, full BPTT through fewer loops consistently outperforms truncated settings of the same compute. The law further shows that at fixed model size, the compute-optimal loop count and training-token budget both grow with compute. When model size is also free, the law identifies two fully trained loops as the best looped setting. Experimentally, this setting achieves lower validation loss than the compute-optimal non-looped model with about 27% fewer non-embedding parameters and only 8% more training compute.", "arxiv_id": "2610.26030", "arxiv_url": "https://arxiv.org/abs/2610.26030", "authors": ["Xuyuan Xiong", "Siyu Chen", "Zihan Shao", "Yue Su", "Weiyang Jin", "Ping Luo", "Zhuoran Yang", "Xihui Liu"], "brief": "", "categories": ["cs.LG", "stat.ML"], "github_repo": "https://github.com/xjxyys/Truncate-or-Not", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.26030", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26030v2", "published_at": "2026-10-19", "score": 0.053, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26030.png", "title": "Truncate or Not? A Scaling Study of Looped Transformers with Truncated Backpropagation", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Financial institutions operating under data-residency constraints are restricted to open-weight models small enough to locally host, which trail frontier systems on multi-step quantitative reasoning. On-policy distillation narrows such gaps by supervising a student on its own rollouts, but traditional OPD requires a strong external teacher, and on-policy self-distillation (OPSD) conditions on a full reference solution. We ask how much of that signal is necessary. We present Fin-SD, a localized hindsight self-distillation recipe for multi-step reasoning. Given a problem the student fails, the student itself identifies the first incorrect reasoning step and writes a short critique of that step. We truncate the student\u0027s trajectory immediately before the error (aiming to obtain a correct prefix), condition a frozen copy of the student on the same prefix plus the hint, and distill that hint-conditioned teacher into the student over a short rollout under reverse KL. No external model contributes a gradient. We apply Fin-SD to GPT-OSS-20B on a custom multi-step financial reasoning benchmark that requires deriving formula inputs from realistic scenarios via accounting conventions. We find: (i) replacing the critique with a generic-feedback control matches Fin-SD\u0027s entire 3.03 pp accuracy gain over the base model on the FinanceReasoning Hard subset, suggesting the gain comes from where supervision is applied, not hint content; (ii) the model writing the hint does not need to be stronger than the model receiving it: hints from same-family GPT-OSS-120B, at roughly 6x the parameters, yield no materially greater benefits than self-written hints; and (iii) Fin-SD matches on-policy self-distillation from full reference solutions on accuracy while generating 9.5% fewer tokens. With Fin-SD, general reasoning on MMLU-Pro and a fourteen-metric compliance audit on FinTrust show no material regression.", "arxiv_id": "2610.36082", "arxiv_url": "https://arxiv.org/abs/2610.36082", "authors": ["Johnny Yu", "Cyril Gorlla"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/johnnyhyu/fin-sd", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.36082", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "CTGT, Inc.", "pdf_url": "https://arxiv.org/pdf/2610.36082v1", "published_at": "2026-10-26", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36082.png", "title": "How Much Does the Hint Matter? Scope Conditions for Hindsight Self-Distillation in Financial Reasoning", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Outcome RL raises pass@1 but not pass@k at large k (Yue et al., 2025). But every pass@1 is scored under a token budget. Every recipe also trains under one. On physics and math problems at fixed token budgets, we compare the pass@1 of 20 released RL models (1.5B to 32B) with that of the thinking models they started from. We ask whether each pass@1 gain is changed behaviour or new knowledge. We divide each change in pass@1 into three parts. Finishing measures answering before the budget runs out. Reliability measures being right once finished. Reach measures problems RL solves that its base answered wrongly in all eight tries, minus problems the base solves that RL answered wrongly in all eight. We find four things. (1) Where the base often hits the token budget before answering, most of the change, gain or loss, is finishing (82% at 4k and 8k). Given more tokens, the base closes most of the finishing gap itself. (2) Where the base has enough tokens, the gain is reliability: the RL model is graded right more often, even on problems both finish. (3) By our definition, RL rarely solves what its base cannot. Reach adds at most 2.1 percentage points on any of our four physics and math sets. We checked 144 physics problems that only the RL model solved. Of these, 3.5% hold up when resampled or read. In a random sample, nine of ten new RL steps a human confirmed also appear in the base\u0027s samples. (4) In a small-scale RL run on an 8B model, the gain on new problems is finishing, with reliability flat. Supplying each problem\u0027s physical setup was not shown to improve on plain RL.", "arxiv_id": "2610.34894", "arxiv_url": "https://arxiv.org/abs/2610.34894", "authors": ["Shan Yang"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/shanyang-me/outcome-rl-buys", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34894", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34894v1", "published_at": "2026-10-26", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34894.png", "title": "What Outcome RL Buys: Finishing, Reliability, Rarely Reach", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Physical reasoning underpins how embodied systems understand and act in the physical world, yet vision-language models (VLMs) remain unreliable on questions about dynamics and physical causality. Progress is critically constrained by the scarcity of grounded counterfactual training data, as observational videos capture only the factual trajectory that occurred. The self-evolving paradigm offers a route beyond fixed datasets by enabling models to construct their own training problems. Extending this paradigm to physics, however, requires an external source of truth that can both validate model-proposed environments and verify alternative physical outcomes under intervention. We introduce \\physevolve{}, a verifier-grounded self-evolving framework that trains VLMs for causal physical reasoning from model-proposed executable worlds and simulation-authored tasks. At each round, a shared VLM proposes executable world programs and evidence schemas; a deterministic physics engine freezes each valid world, simulates matched baseline and body-elided counterfactual branches, and synthesizes discrete, answer-bound visual tasks. Exact verifier feedback from task solving updates both the shared policy via GRPO and an adaptive curriculum over physical intents. Starting from Qwen3-VL-8B-Instruct, \\physevolve{} achieves targeted gains across PhysBench, CausalPhys, and ContPhy without human intervention data, improving PhysBench Throwing by $8.8$ points and ContPhy Counterfactual Removal and Goal-Pit by $7.4$ and $24.4$ points. These gains concentrate on interaction-sensitive and altered-world questions, demonstrating zero-shot transfer of causal principles to unseen complex dynamics (cloth, fluid, soft bodies) and real-world video.", "arxiv_id": "2610.34921", "arxiv_url": "https://arxiv.org/abs/2610.34921", "authors": ["Jinyuan Hu", "Yilei Jiang", "Chen Tang", "Minghong Cai", "Xinran Liu", "Xiangyu Yue"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/yelonhu/PhysEvolve", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.34921", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34921v1", "published_at": "2026-10-26", "score": 0.045, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34921.png", "title": "PhysEvolve: Verifier-grounded Self-evolution for Physical Reasoning with Executable Worlds", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Phenomena responsible for emerging technologies originate from novel molecular states at buried interfaces. Yet quantitatively resolving these features is out of reach in most cases. Resonant scattering has demonstrated sensitivity to these local states but is limited due to a lack of accurate interpretive models. We leverage a machine learning (ML)-optimized optical model to analyze polarized resonant soft X-ray scattering (RSoXS) from molecular thin films. This new analysis establishes the direct and quantitative interpretation of molecular orientation, chemical identity and packing states as a function of depth with sub-monolayer resolution - reaching beyond the diffraction limit via locking energy and polarization through the optical model. From our analysis, we discover a gradient evolution of molecular orientation and packing emerging from the interface, indicative of competing surface versus bulk growth dynamics and contradicting hypotheses of substrate patterning. This nondestructive insight into buried interfacial formation and final state opens possibilities in controlling interfacial states and phenomena in next-generation technologies.", "arxiv_id": "2610.31924", "arxiv_url": "https://arxiv.org/abs/2610.31924", "authors": ["Harlan Heilman", "Em Biegler", "Sushil Adhikari", "Victor Murcia", "Tanner Melody", "Fred Woodall", "Lars Thomsen", "Obaid Alqahtani", "Brian A. Collins"], "brief": "", "categories": ["cond-mat.mtrl-sci", "cond-mat.soft", "physics.data-an", "physics.optics"], "github_repo": "https://github.com/WSU-Carbon-Lab/refl-analysis", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31924", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "WSU Carbon Lab", "pdf_url": "https://arxiv.org/pdf/2610.31924v1", "published_at": "2026-10-22", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31924.png", "title": "Sub-monolayer tracking of molecular states at buried interfaces", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "This paper introduces Quaternion Approximate Networks (QUAN), a novel deep learning framework that leverages quaternion algebra for rotation equivariant image classification and object detection. Unlike conventional quaternion neural networks attempting to operate entirely in the quaternion domain, QUAN approximates quaternion convolution through Hamilton product decomposition using real-valued operations. This approach preserves geometric properties while enabling efficient implementation with custom CUDA kernels. We introduce Independent Quaternion Batch Normalization (IQBN) for training stability and extend quaternion operations to spatial attention mechanisms. QUAN is evaluated on image classification (CIFAR-10/100, ImageNet), object detection (COCO, DOTA), and robotic perception tasks. In classification tasks, QUAN achieves higher accuracy with fewer parameters and faster convergence compared to existing convolution and quaternion-based models. For objection detection, QUAN demonstrates improved parameter efficiency and rotation handling over standard Convolutional Neural Networks (CNNs) while establishing the SOTA for quaternion CNNs in this downstream task. These results highlight its potential for deployment in resource-constrained robotic systems requiring rotation-aware perception and application in other domains. Code: https://cwru-aism.github.io/ QUANpaper/", "arxiv_id": "2509.05512", "arxiv_url": "https://arxiv.org/abs/2509.05512", "authors": ["Bryce Grant", "Peng Wang"], "brief": "", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/bryceag11/QUAN_ultralytics", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2509.05512", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2509.05512v2", "published_at": "2025-09-05", "score": 0.042, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2509.05512.png", "title": "Quaternion Approximate Networks for Enhanced Image Classification and Oriented Object Detection", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in search agents have enabled large language models to tackle complex tasks by retrieving and synthesizing external information. However, existing search agents often lack search-state awareness, i.e., the ability to recognize what information has been obtained and what remains missing, leading to hallucinated reasoning and prematurely terminated search. To address this limitation, we propose Self-Assessment Reinforcement Learning (SARL), a reinforcement learning framework in which models learn to recognize their own search state during training and improve their search behavior accordingly, without requiring additional assessment at test time. SARL achieves this through a dual reward design that captures the corrective effect of each assessment while penalizing excessive reliance on it, jointly encouraging effective and efficient search trajectories. Under this setup, SARL achieves a 24.3% relative improvement over the strongest baseline, with average gains of 35.9% on multi-hop reasoning and 27.9% on deep research benchmarks against the strongest per-benchmark baselines. SARL further surpasses methods built on auxiliary supervision or multi-agent coordination, despite operating as a standalone RL framework with no inference-time scaffolding. Beyond final performance, SARL maintains training stability under extended search horizons, a regime where existing methods consistently degrade, enabling sustained gains as task complexity grows.", "arxiv_id": "2610.30435", "arxiv_url": "https://arxiv.org/abs/2610.30435", "authors": ["Taewhoo Lee", "Minju Song", "Jungwoo Park", "Chanwoong Yoon", "Junha Jung", "Hyeon Hwang", "Sanghoon Lee", "Minbyul Jeong", "Jaewoo Kang"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30435", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30435v1", "published_at": "2026-10-21", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30435.png", "title": "Self-Assessment Reinforcement Learning for Search-State Awareness in Retrieval-Augmented Large Language Models", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time adaptation helps a deployed model respond to changing inputs, but the same intervention can rescue one batch and damage the next. Updating normalization statistics, for example, can improve corrupted images yet fail when a batch contains mostly one class. Average accuracy hides these failures and cannot tell a model when to use an intervention. Target labels can guide this decision, but they are scarce and some choices are already clear. We introduce PORTAL, a controller that chooses when to deploy an intervention, which inputs to label, and when to stop querying. Each available prediction rule is a candidate, and its predictions are fixed before current feedback arrives. Every acquired label therefore evaluates all candidates on the same input. PORTAL combines these shared comparisons and directs queries toward candidates that can still overtake the current leader. It stops when the remaining labels cannot change the choice or when the possible accuracy gain no longer justifies another query. Our analysis links the required feedback to accuracy gaps and shared mistakes, explaining why some choices need much less evidence. Experiments show that this control turns an intervention that loses accuracy overall into a useful choice on selected batches. It prevents severe failures caused by changes in arrival order and preserves gains across complete corruption streams. When a fixed rule already works well, PORTAL uses little feedback to retain its performance. Periodic label checks reveal when past evidence needs refreshing and help the controller recover as conditions change. The acquired labels also train stronger candidates for future batches, and selection brings nearly all of their accuracy gains into deployment. The same feedback therefore improves both the choice made now and the predictions available to later batches.", "arxiv_id": "2610.37658", "arxiv_url": "https://arxiv.org/abs/2610.37658", "authors": ["Jiahao Zhang", "Xinling Wen", "Liangliang Li", "Yu Chen"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37658", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37658v1", "published_at": "2026-10-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Should We Intervene at Test Time?", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Dexterous manipulation with multi-fingered hands is the next frontier of robotics, yet learned hand skills remain limited to simple grasps or basic repeated motions, such as rotating an object. As robots attempt more demanding in-hand maneuvers, safety, such as not dropping the object, becomes critical, yet it is rarely measured. We study in-hand object pose reaching, a task that demands diverse and difficult grasps: moving an object to almost any position and orientation within reach of the fingers, at any wrist orientation, through long sequences of consecutive goals. We present a recipe for training such policies for a LEAP hand in simulation without human data, built on a range of insights, from diverse resets and goals via generated grasp datasets to an adaptive friction curriculum. With careful system identification, the policies transfer zero-shot to the real hand, using either motion capture or a single wrist-mounted depth camera, and prove remarkably capable and robust. On top of the task policy, we add a learned residual safety filter with adjustable conservativeness, letting us tune the balance between performance and safety and greatly reduce object drops. In 13.3 hours of real-robot evaluation over 4,800 unseen goals across 4 objects and diverse wrist orientations, the state-based policy reaches 95.2% of goals within 2 cm and 0.4 rad, and the filter cuts its drops by 75% while still reaching 91.5% of goals. The policies can also spin a lightbulb held in an arbitrary pose, reach out-of-distribution goals, withstand fast arm motion and perturbations, and, needing only a wrist camera, serve as portable skills such as screwing in a lightbulb. We release the full recipe as a platform for studying performance, reliability, and safety in high-dimensional dexterous systems. Videos and more are available at https://ian-chuang.github.io/dexsafe/.", "arxiv_id": "2610.37652", "arxiv_url": "https://arxiv.org/abs/2610.37652", "authors": ["Ian Chuang", "Hiya Shah", "Vamsi Chilamkur", "Iman Soltani", "Claire Tomlin"], "brief": "", "categories": ["cs.RO", "cs.LG", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37652", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37652v1", "published_at": "2026-10-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Pushing Dexterity and Safety for In-Hand Object Pose Reaching That Works Remarkably Well", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We explore how to build performant large language model (LLM) tool-use agents that complete complex, multi-step tasks. Specifically, we study how data composition in synthetically generated tool-use environments affects the training of such agents. To do so, we propose the SynthAPI pipeline, which explicitly controls the diversity of generated environments along the axes of tools, tasks, and the databases on which the tools operate. By systematically varying SynthAPI\u0027s generation controls in 458,752 tasks across 849 trained models of four different sizes, we derive a scaling law that predicts downstream tool-use agent generalization based on the scale and composition of the synthesized environments. These predictable relationships reveal several lessons for scaling tool-use agent data. As data budgets grow, scaling tool and database diversity becomes more effective than increasing the number of tasks, and increasing data complexity yields larger gains. Scaling according to these findings yields agents that outperform models trained on data from prior work in large-scale tool-use agent and synthetic environment generation across four evaluation benchmarks.", "arxiv_id": "2610.37648", "arxiv_url": "https://arxiv.org/abs/2610.37648", "authors": ["Andrew Szot", "Samira Abnar", "Omar Attia", "Abbas Kazerouni", "Michael Kirchhof", "Cheng-Yu Hsieh", "Raviteja Vemulapalli", "Alexander Toshev"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37648", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37648v1", "published_at": "2026-10-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Scaling Laws for Tool-Use Agents via Controllable Environment Synthesis", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Eigenvalues are a workhorse of graph machine learning: spectral clustering, spectral graph neural networks, and graph kernels all summarize a network by the eigenvalues of a matrix. These eigenvalues are almost always treated as a static list of numbers. When a graph changes, however, its eigenvalues move, and when the matrix is not symmetric, they move in the complex plane, where they can wind around each other. The pattern of this winding is a braid, a classical object from topology. We propose spectral braids, a methodology for dynamic directed networks: each snapshot is aggregated into a community-level transition matrix, its complex eigenvalues are tracked over time, and the braid they trace is read off as a word. The word is then mapped to a matrix by the Burau representation, which gives a fixed-size feature vector for any classifier. The braid has a concrete meaning: each eigenvalue describes how a group of communities behaves, and each crossing records one group overtaking another. We evaluate the method on dynamic network classification, using synthetic networks of online communities whose labels describe how the network evolved between the same starting and ending states. Our experimental results show that the proposed features reach 97.1% accuracy on four classes, against 44.5% for the best feature set that does not track eigenvalues, and that the Burau features also separate networks containing the same events in a different order, which simple counts of crossings cannot do. To the best of our knowledge, this is the first study that defines braids and braid monodromy on graph data and uses them as features for learning on dynamic networks.", "arxiv_id": "2610.37580", "arxiv_url": "https://arxiv.org/abs/2610.37580", "authors": ["Mehmet Emin Aktas", "Esra Akbas"], "brief": "", "categories": ["cs.SI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37580", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37580v1", "published_at": "2026-10-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Spectral Braids: A Topological Descriptor for Dynamic Directed Networks", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present LCM-Promo, an LLM-based uplift model for promotion allocation. LCM-Promo is a task-specific Large Commerce Model (LCM): a finetuned LLM trained on transactional commerce data to predict user intent and promotion response. It learns monotonic promotion-response curves from production logs by interpreting single-token outputs as conversion-threshold probabilities, while conditioning on session context such as day and delivery shift. In a production A/B test on churn reactivation, LCM-Promo increased conversion by 1% and reduced promotion cost by 6% relative to the Segment-EMA production baseline.", "arxiv_id": "2610.37570", "arxiv_url": "https://arxiv.org/abs/2610.37570", "authors": ["Nesta Midavaine", "Floris Fok", "Paulo Mendes", "Joao Silva", "\u00d6nder Aka\u00e7\u0131k", "Dimas Lima", "Z\u00fclk\u00fcf Gen\u00e7"], "brief": "", "categories": ["cs.LG", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37570", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37570v1", "published_at": "2026-10-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LCM-Promo: An LLM-Based Uplift Model for Promotion Allocation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Predictive maintenance is vital for commercial aviation, yet progress remains hindered by the lack of public, large-scale real-world datasets. As a result, most methods are developed and evaluated on proprietary data, limiting reproducibility. We introduce Pneuma, the first publicly available large-scale benchmark for predictive maintenance using onboard time series from in-service commercial aircraft. Built around bleed air systems, Pneuma contains over 920 million multivariate time steps across four aircraft types and 9 verified fault scenarios, directly aligned with real maintenance logs. The dataset exhibits key real-world challenges, including substantial class imbalance, subtle fault evolution patterns, and significant variance across aircraft configurations. We structure the benchmark around three tasks: multivariate forecasting, supervised fault classification, and unsupervised anomaly detection, with labels derived from actual maintenance records. Under unified settings, we evaluate over 25 models from four methodological families on 9 carefully curated subsets. The results reveal that even strong contemporary models struggle with subtle fault signatures. Further analyses show consistent gains from additional in-context examples and multivariate inference, while forecasting quality is strongly associated with anomaly detection performance. Together, these findings provide practical insights into effectively modeling complex real-world aviation time series. We hope Pneuma will serve as a rigorous and reproducible foundation for advancing data-driven predictive maintenance toward real-world deployment in commercial aviation.", "arxiv_id": "2610.37563", "arxiv_url": "https://arxiv.org/abs/2610.37563", "authors": ["Jiafeng Lin", "Yutian Zhang", "Huan Zhang", "Yuxuan Wang", "Jinyan Feng", "Yuhui Liu", "Zhongyi Pei", "Jianmin Wang"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37563", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37563v1", "published_at": "2026-10-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Pneuma: A Large-Scale Real-World Time Series Benchmark for Commercial Aircraft Predictive Maintenance", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Label-free reinforcement learning with verifiable rewards (RLVR) rewards a language model for agreeing with its own majority vote. It improves reasoning at first but eventually collapses: the self-assessed reward goes to one while accuracy falls, often until the model gives the same answer to every problem. The collapse appears only when training uses many problems. We explain this dataset-size dependence as a collective instability. In a solvable many-problem model in which problems share parameters, a population whose problems prefer different answers amplifies any shared perturbation for as long as the population-averaged slope $\\langle F\u0027\\rangle$ of the single-problem self-reinforcement drift $F$ is positive. This holds while problems are still uncertain about their answers. Per-problem sharpening, slowed by $1/N$ for $N$ training problems, races against the shared mode, which grows at a rate $\\propto\u03bb^2$ independent of $N$, where $\u03bb$ is the strength of the shared coupling. This yields a critical number of problems $N_c\\simeq\\ln(1/\u03b4)/(\u03bb^2G)$, where $\u03b4$ seeds the shared mode and $G$ decreases with the initial confidence. Simulations of the model confirm the predictions: a sharp transition, $N_c\\propto\u03bb^{-2}$ up to a logarithmic correction, a single critical amplification $\u03bb^2NG$ across couplings, confidence profiles and training variants, a logarithmic dependence on batch size, and no collapse for confident initial models. A kernel version of the theory identifies a protective coupling (generalization of sharpening) and a marginal-entropy bonus that stabilizes the uniform collective mode. In label-free RL of a small Transformer, removing the shared direction prevents collapse entirely, restoring it causes collapse, and collapse grows with training-set size and base-model entropy.", "arxiv_id": "2610.37553", "arxiv_url": "https://arxiv.org/abs/2610.37553", "authors": ["Peize Ding"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37553", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37553v1", "published_at": "2026-10-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Collective Dynamics of Self-Reinforcement: How Cross-Task Coupling Drives Policy Collapse in Unsupervised RLVR", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-attention mechanisms have estab
