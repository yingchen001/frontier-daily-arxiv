const PAPERS = [{"abstract": "A reasoning model can improve from its own on-policy experience, but this inner loop is fragile: terminal verifiers provide reliable yet sparse supervision, while dense same-model guidance can reinforce false confidence or overconcentrate learning on a narrow solution mode. We introduce FlowBalance, a verifier-grounded self-improvement method that learns a normalized distribution over complete responses. For each on-policy trajectory, a frozen training-time view of the same policy uses privileged context to produce token-level log-probability gains, which are aggregated into a trajectory-level self-guidance score. FlowBalance calibrates this score with the verifier-derived group advantage: guidance is retained on positive-advantage trajectories, reversed on negative-advantage trajectories, and disabled when the rollout group provides no outcome preference. The resulting energy exponentially reweights a reference policy, and profiled trajectory balance fits the normalized target with one log-partition estimate per rollout group. This realizes outcome-calibrated self-guidance via trajectory balance, without a separate token-level imitation loss. Our analysis establishes within-group contrast preservation, a minimum-change reverse-KL characterization, monotonic verifier control of target reward, and an exact correction against false-positive self-guidance on rejected responses. On mathematical reasoning, FlowBalance improves average performance over FlowRL on both Qwen3-4B and Qwen3-8B, while also improving training speed and stability, avoiding direct OPSD\u0027s response-length collapse, and exhibiting higher correct-strategy diversity in a controlled AIME24 diagnostic.", "arxiv_id": "2609.03241", "arxiv_url": "https://arxiv.org/abs/2609.03241", "authors": ["Zixun Huang", "Kishan Panaganti", "Haitao Mi", "Leowei Liang"], "brief": "FlowBalance \u662f\u4e00\u79cd\u9762\u5411\u63a8\u7406\u6a21\u578b\u7684\u5728\u7b56\u7565\u81ea\u6539\u8fdb 63a8\u7406\u6a21\u578b\u81ea\u6539\u8fdb\u3002", "upvotes": 82, "what_it_is": "FlowBalance \u662f\u4e00\u79cd\u9762\u5411\u63a8\u7406\u6a21\u578b\u7684\u5728\u7b56\u7565\u81ea\u6539\u8fdb\u65b9\u6cd5\uff0c\u901a\u8fc7\u7ec8\u7aef\u9a8c\u8bc1\u5668\u7684\u7ec4\u4f18\u52bf\u6765\u6821\u51c6\u6a21\u578b\u81ea\u8eab\u4ea7\u751f\u7684\u8f68\u8ff9\u7ea7\u6307\u5bfc\u4fe1\u53f7\u3002\u5b83\u7528\u8f68\u8ff9\u5e73\u8861\u62df\u5408\u5f52\u4e00\u5316\u54cd\u5e94\u5206\u5e03\uff0c\u5728\u4e0d\u5f15\u5165\u989d\u5916 token \u7ea7\u6a21\u4eff\u635f\u5931\u7684\u60c5\u51b5\u4e0b\u5b9e\u73b0\u7a33\u5b9a\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u63a8\u7406\u6a21\u578b\u81ea\u6211\u8bad\u7ec3\u4e2d\u201c\u7a00\u758f\u9a8c\u8bc1\u5668\u76d1\u7763\u201d\u548c\u201c\u540c\u6a21\u578b\u7a20\u5bc6\u6307\u5bfc\u6613\u81ea\u4fe1\u653e\u5927\u201d\u7684\u77db\u76fe\uff0c\u63d0\u51fa\u4e86\u5e26\u7406\u8bba\u523b\u753b\u7684\u6821\u51c6\u673a\u5236\uff0c\u6709\u671b\u63d0\u5347\u6570\u5b66\u63a8\u7406\u7b49\u53ef\u9a8c\u8bc1\u4efb\u52a1\u4e2d\u7684\u7a33\u5b9a\u81ea\u6539\u8fdb\u80fd\u529b\u3002"}, {"abstract": "Recursive self-improvement (RSI) requires a concrete mechanism through which an AI system observes its capabilities and converts that evidence into the next round of learning. We present NeoHorse-1, a family of agent-native models developed to explore this path through agentic post-training. Our system combines a heterogeneous model pool with intelligent routing, recording the predicted capability demand, selected service tier, and subsequent interaction for each user turn. These records are converted into training examples that preserve interleaved reasoning, tool calls, and harness context, and are admitted through structural validation, six-dimensional semantic evaluation, and subscene-level labeling. Routing signals organize supervised fine-tuning into a three-stage curriculum and extend to routing-guided on-policy distillation, where a teacher supervises student-generated responses under the same progression. Capability-guided allocation then converts evaluation feedback into the next training mixture, closing an evaluation-selection-update loop in which what the system learns to do shapes what it learns from next. Across eleven benchmarks covering harness-based agents, tool use, coding, and instruction following, post-training raises the macro-average from 58.94 to 64.87 at 4B and from 65.60 to 69.04 at 9B, substantially narrowing the aggregate gap between the post-trained 4B model and the 9B base model. NeoHorse-1 provides an initial prototype of this feedback-driven process and a path toward harness-mediated RSI across successive iterations.", "arxiv_id": "2609.08183", "arxiv_url": "https://arxiv.org/abs/2609.08183", "authors": ["NeoHorse Team", "Guoliang Cao", "Guohao Dai", "Tianyu Guo", "Kai Han", "Hailin Hu", "Zihan Jiang", "Xiang Kuang", "Boxun Li", "Yulong Li", "Zehua Pei", "Yuchuan Tian", "Jiamin Wang", "Yu Wang", "Yunhe Wang", "Yihong Wu", "Haiyang Xu", "Shuo Zhang", "Hang Zhou", "Siyang Cheng", "Jiayu Fan", "Wei He", "Qingrui Jiao", "Hongguang Li", "Zhiyuan Li", "Runke Liu", "Xi Liu", "Xinchen Liu", "Sinno Jialin Pan", "Yi Ren", "Liuyang Song", "Chenyu Wang", "Bei Yu", "Quanlu Zhang", "Xiangyu Zhang", "Mengyu Zheng", "Yingjie Zong"], "brief": "\u8bba\u6587\u63d0\u51fa NeoHorse-1\uff0c\u4e00\u7ec4\u9762\u5411\u667a\u80fd\u4f53\u7684\u6a21\u578b\uff0c\u901a\u8fc7\u201c\u8def\u7531\u2014\u8bb0\u5f55\u2014\u8bad\u7ec3\u2014\u8bc4\u4f30\u2014\u518d\u5206\u914d\u201d\u7684\u95ed\u73af\u8fdb\u884c agentic post-training\u3002\u7cfb\u7edf\u5c06\u7528\u6237\u4ea4\u4e92\u4e2d\u7684\u80fd\u529b\u9700\u6c42\u3001\u670d\u52a1\u5c42\u7ea7\u9009\u62e9\u3001\u5de5\u5177\u8c03\u7528\u4e0e\u63a8\u7406\u8f68\u8ff9\u8f6c\u5316\u4e3a\u8bad\u7ec3\u6570\u636e\uff0c\u4ee5\u63a2\u7d22\u53ef\u8fed\u4ee3\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u673a\u5236\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Token every account-day at comparable modeled cost.", "arxiv_id": "2609.06966", "arxiv_url": "https://arxiv.org/abs/2609.06966", "authors": ["Aashiq Muhamed", "Virginia Smith"], "brief": "\u8bba\u6587\u63d0\u51fa MOLE\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u9632\u5fa1\u8005\u80fd\u5426\u5728\u6709\u9650\u5ba1\u8ba1\u9884\u7b97\u4e0b\u53d1\u73b0 AI \u667a\u80fd\u4f53\u5185\u90e8\u5a01\u80c1\u7684\u5f00\u653e\u57fa\u51c6\u3002\u5b83\u6a21\u62df 150 \u4e2a AI \u64cd\u4f5c\u8d26\u6237\u5728 9 \u4e2a\u6709\u72b6\u6001\u670d\u52a1\u4e2d\u8fde\u7eed 30 \u4e2a\u5de5\u4f5c\u65e5\u7684\u6d3b\u52a8\uff0c\u8986\u76d6\u6a21\u578b\u6743\u91cd\u5916\u6cc4\u3001\u8bad\u7ec3\u6570\u636e\u6295\u6bd2\u3001\u53d1\u5e03\u95e8\u69db\u524a\u5f31\u7b49\u98ce\u9669\u3002", "categories": ["cs.LG", "cs.CL", "cs.CR"], "github_repo": "https://github.com/aashiqmuhamed/mole", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.06966", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["MOLE \u5305\u542b 12 \u7c7b\u5a01\u80c1\u30018 \u4e2a\u8bed\u6599\u96c6\u3001\u7ea6 200 \u4ebf tokens\uff0c\u5e76\u8bc4\u4f30\u4e86\u6765\u81ea 4 \u4e2a\u6a21\u578b\u751f\u6210\u7684\u667a\u80fd\u4f53\u6d3b\u52a8\u3002", "\u5728 39 \u4e2a\u667a\u80fd\u4f53\u6a21\u578b\u4e2d\uff0c72% \u80fd\u5b8c\u6210\u5927\u591a\u6570\u6709\u5bb3\u76ee\u6807\uff0c\u4e14\u667a\u80fd\u4f53\u662f\u5426\u62d2\u7b54\u5e76\u4e0d\u80fd\u9884\u6d4b\u5176\u662f\u5426\u771f\u6b63\u5b8c\u6210\u5371\u5bb3\u3002", "\u8bba\u6587\u6bd4\u8f83\u4e86 40 \u79cd\u76d1\u63a7\u5668\u5728\u4e0d\u540c\u8bed\u6599\u751f\u6210\u5668\u3001\u53ef\u89c2\u6d4b\u6027\u6c34\u5e73\u548c\u5a01\u80c1\u7c7b\u578b\u4e0b\u7684\u8868\u73b0\uff1b\u6700\u4f73\u5355\u65e5\u5ba1\u8ba1\u4e8b\u4ef6\u76d1\u63a7\u5668\u4ecd\u6f0f\u68c0\u8fd1\u534a\u5df2\u5b8c\u6210\u5371\u5bb3\u3002"], "keywords": ["\u667a\u80fd\u4f53", "AI\u5b89\u5168", "\u57fa\u51c6\u6d4b\u8bd5", "\u5a01\u80c1\u68c0\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2609.06966v1", "published_at": "2026-09-07", "score": 0.466, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06966.png", "title": "MOLE: Detecting Insider Threats in AI Agents", "tldr": "\u68c0\u6d4bAI\u667a\u80fd\u4f53\u5185\u90e8\u5a01\u80c1\u7684\u65b0\u57fa\u51c6", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa MOLE\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u9632\u5fa1\u8005\u80fd\u5426\u5728\u6709\u9650\u5ba1\u8ba1\u9884\u7b97\u4e0b\u53d1\u73b0 AI \u667a\u80fd\u4f53\u5185\u90e8\u5a01\u80c1\u7684\u5f00\u653e\u57fa\u51c6\u3002\u5b83\u6a21\u62df 150 \u4e2a AI \u64cd\u4f5c\u8d26\u6237\u5728 9 \u4e2a\u6709\u72b6\u6001\u670d\u52a1\u4e2d\u8fde\u7eed 30 \u4e2a\u5de5\u4f5c\u65e5\u7684\u6d3b\u52a8\uff0c\u8986\u76d6\u6a21\u578b\u6743\u91cd\u5916\u6cc4\u3001\u8bad\u7ec3\u6570\u636e\u6295\u6bd2\u3001\u53d1\u5e03\u95e8\u69db\u524a\u5f31\u7b49\u98ce\u9669\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 AI \u667a\u80fd\u4f53\u5b89\u5168\u4ece\u5355\u8f6e\u63d0\u793a\u653b\u51fb\u6269\u5c55\u5230\u957f\u671f\u3001\u6709\u72b6\u6001\u3001\u7ec4\u7ec7\u7ea7\u8d26\u6237\u6d3b\u52a8\u76d1\u63a7\uff0c\u63ed\u793a\u73b0\u6709\u76d1\u63a7\u65b9\u6cd5\u5728\u771f\u5b9e\u5ba1\u8ba1\u9884\u7b97\u7ea6\u675f\u4e0b\u7684\u660e\u663e\u4e0d\u8db3\uff0c\u5e76\u4e3a\u5185\u90e8\u5a01\u80c1\u68c0\u6d4b\u4e0e\u76d1\u63a7\u5668\u4f18\u5316\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u57fa\u51c6\u3002"}, {"abstract": "Air-Ground Object Search (AGOS) in urban environments is a challenging embodied task, which requires an Unmanned Aerial Vehicle (UAV) and an Unmanned Ground Vehicle (UGV) to jointly search for and verify a specified target vehicle from multi-view visual references. To study this underexplored problem, we introduce AGOS-Bench, the first dedicated benchmark for evaluating whether general-purpose Vision-Language Models (VLMs) can integrate aerial discoveries and ground-level verification through UAV-UGV cooperation. We further provide AGOS-Dataset as the companion resource of exemplary trajectories constructed by an automatic pipeline. It consists of 7.7k episodes for searching objects of diverse categories and attributes, spanning three difficulty levels. To address the AGOS task, we propose AGOS-Agent, a training-free and tool-augmented approach. The agentic method relieves VLMs from complex and dynamic coordination via a deliberate search-handoff-verify cooperation protocol, only demanding VLMs for scene understanding and decision-making. Extensive experiments on nine VLMs show that AGOS-Agent improves overall success rate for eight of the nine evaluated backbones while reducing decision steps for all nine. On the hard split, the SR and SPL of Gemini-3.6-Flash increase from 8.6% to 55.7% and from 7.6% to 44.0%, respectively.", "arxiv_id": "2609.08402", "arxiv_url": "https://arxiv.org/abs/2609.08402", "authors": ["Boao Yu", "Zimo Chen", "Junreng Rao", "Yue Hu", "Zhengqiu Zhu", "Yong Zhao", "Rusheng Ju"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u57ce\u5e02\u73af\u5883\u7684\u7a7a\u5730\u534f\u540c\u76ee\u6807\u641c\u7d22\u4efb\u52a1 AGOS\uff0c\u5e76\u6784\u5efa\u9996\u4e2a\u4e13\u7528\u8bc4\u6d4b\u57fa\u51c6 AGOS-Bench \u4e0e\u5305\u542b 7.7k \u6761\u793a\u4f8b\u8f68\u8ff9\u7684 AGOS-Dataset\u3002\u540c\u65f6\u63d0\u51fa\u514d\u8bad\u7ec3\u3001\u5de5\u5177\u589e\u5f3a\u7684 AGOS-Agent\uff0c\u901a\u8fc7\u201c\u641c\u7d22-\u4ea4\u63a5-\u9a8c\u8bc1\u201d\u534f\u8bae\u534f\u8c03 UAV \u4e0e UGV\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08402", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["AGOS \u8981\u6c42\u65e0\u4eba\u673a\u4ece\u7a7a\u4e2d\u53d1\u73b0\u5019\u9009\u76ee\u6807\uff0c\u65e0\u4eba\u8f66\u5728\u5730\u9762\u89c6\u89d2\u8 \u5de5\u5177\u589e\u5f3a\u5373\u53ef\u663e\u8457\u63d0\u5347\u901a\u7528 VLM \u5728\u591a\u673a\u5668\u4eba\u534f\u4f5c\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\uff0c\u5177\u6709\u673a\u5668\u4eba\u641c\u7d22\u3001\u57ce\u5e02\u5de1\u68c0\u4e0e\u5177\u8eab\u667a\u80fd\u8bc4\u6d4b\u4ef7\u503c\u3002"}, {"abstract": "Most end-to-end autonomous-driving systems learn by imitating human driving logs, leaving their learned behavior constrained by the quality and behavioral coverage of the recorded trajectories. This report presents DriveZero, an end-to-end system that learns driving behavior beyond human demonstrations. It decomposes driving into a perception model and an action model, pretrains each in the regime best suited to it, and combines them into one end-to-end planner. The two models call for different learning recipes: perception must understand the world, and benefits from massive and diverse visual data; action must interact with it, and requires closed-loop feedback. On the action side, we introduce DriveRL, a mixed-agent closed-loop reinforcement-learning framework. It converts real driving logs into interactive worlds, where a privileged teacher policy is trained with PPO through closed-loop rollouts. For the perception model, DriveVFM consolidates multiple frozen vision foundation models, including DINOv3, SigLIP2, SAM and Depth Anything V2, into a single backbone from raw images alone, requiring no task-specific annotations. DriveZero then unifies the two: a camera-only planner that distills the frozen DriveRL teacher through its rolled-out trajectories. The goal-conditioned teacher can moreover be queried under augmented driving intents, yielding diverse, goal-consistent supervision that logged data cannot provide. On nuPlan, DriveRL with value-guided test-time action search achieves a mean score of 93.57 across the Val14, Test14-hard, and Test14-random community splits in both non-reactive and reactive modes, exceeding the Log-Replay expert on all three splits. DriveZero achieves state-of-the-art performance on NAVSIMv1, NAVSIMv2 and the closed-loop HUGSIM benchmark without any human trajectory supervision.", "arxiv_id": "2609.06055", "arxiv_url": "https://arxiv.org/abs/2609.06055", "authors": ["Hao He", "Chengcheng Hu", "Zirun Su", "Heng Zhang", "Haisong Liu", "Jinke Li", "Haochen Tian", "Zhenwei Shen", "Hongyang Li", "Zhichao Li", "Yunchen Yang", "Bochao Huang", "Siyu Zhang", "Kuangye Chen", "Xiongjie Zhang", "Wentao Dai", "Hengchen Dai", "Siyuan Liu", "Zehao Huang", "Naiyan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa DriveZero\uff0c\u5c06\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u84b8\u998f\u51fa\u7684\u611f\u77e5\u9aa8\u5e72\u4e0e\u95ed\u73af\u5f3a\u5316\u5b66\u4e60\u52a8\u4f5c\u6559\u5e08\u7ed3\u5408\uff0c\u6784\u5efa\u76f8\u673a\u8f93\u5165\u7684\u7aef\u5230\u7aef\u81ea\u52a8\u9a7e\u9a76\u89c4\u5212\u5668\u3002\u5176\u6838\u5fc3\u76ee\u6807\u662f\u7a81\u7834\u4ec5\u6a21\u4eff\u4eba\u7c7b\u9a7e\u9a76\u65e5\u5fd7\u5e26\u6765\u7684\u884c\u4e3a\u8986\u76d6\u4e0e\u8d28\u91cf\u4e0a\u9650\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/XiaomiAutoL3/DriveZero", "github_stars": 42, "hf_url": "https://huggingface.co/papers/2609.06055", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["DriveRL \u5c06\u771f\u5b9e\u9a7e\u9a76\u65e5\u5fd7\u8f6c\u5316\u4e3a\u53ef\u4ea4\u4e92\u4e16\u754c\uff0c\u7528 PPO \u8bad\u7ec3\u7279\u6743\u6559\u5e08\u7b56\u7565\uff0c\u5e76\u652f\u6301\u95ed\u73af rollout \u4e0e\u4ef7\u503c\u5f15\u5bfc\u7684\u6d4b\u8bd5\u65f6\u52a8\u4f5c\u641c\u7d22\u3002", "DriveVFM \u878d\u5408 DINOv3\u3001SigLIP2\u3001SAM\u3001Depth Anything V2 \u7b49\u51bb\u7ed3\u89c6\u89c9\u57fa\u7840\u6a21\u578b\uff0c\u4ece\u539f\u59cb\u56fe\u50cf\u5b66\u4e60\u611f\u77e5\u8868\u5f81\uff0c\u65e0\u9700\u4efb\u52a1\u6807\u6ce8\u3002", "DriveZero \u901a\u8fc7\u84b8\u998f DriveRL \u6559\u5e08\u7684\u6eda\u52a8\u8f68\u8ff9\u8bad\u7ec3\u76f8\u673a-only\u89c4\u5212\u5668\uff0c\u5e76\u53ef\u7528\u76ee\u6807\u6761\u4ef6\u6559\u5e08\u751f\u6210\u65e5\u5fd7\u4e2d\u4e0d\u5b58\u5728\u7684\u591a\u6837\u5316\u76d1\u7763\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u5f3a\u5316\u5b66\u4e60", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u7aef\u5230\u7aef\u89c4\u5212"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06055v1", "published_at": "2026-09-05", "score": 0.327, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06055.png", "title": "DriveZero: End-to-End Driving Beyond Human Demonstrations", "tldr": "\u65e0\u9700\u4eba\u7c7b\u8f68\u8ff9\u76d1\u7763\u7684\u7aef\u5230\u7aef\u9a7e\u9a76\u7cfb\u7edf", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa DriveZero\uff0c\u5c06\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u84b8\u998f\u51fa\u7684\u611f\u77e5\u9aa8\u5e72\u4e0e\u95ed\u73af\u5f3a\u5316\u5b66\u4e60\u52a8\u4f5c\u6559\u5e08\u7ed3\u5408\uff0c\u6784\u5efa\u76f8\u673a\u8f93\u5165\u7684\u7aef\u5230\u7aef\u81ea\u52a8\u9a7e\u9a76\u89c4\u5212\u5668\u3002\u5176\u6838\u5fc3\u76ee\u6807\u662f\u7a81\u7834\u4ec5\u6a21\u4eff\u4eba\u7c7b\u9a7e\u9a76\u65e5\u5fd7\u5e26\u6765\u7684\u884c\u4e3a\u8986\u76d6\u4e0e\u8d28\u91cf\u4e0a\u9650\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u7aef\u5230\u7aef\u81ea\u52a8\u9a7e\u9a76\u53ef\u4ee5\u4e0d\u4f9d\u8d56\u4eba\u7c7b\u8f68\u8ff9\u76d1\u7763\uff0c\u901a\u8fc7\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u4e0e\u95ed\u73af\u5f3a\u5316\u5b66\u4e60\u83b7\u5f97\u8d85\u8d8a\u65e5\u5fd7\u56de\u653e\u4e13\u5bb6\u7684\u8868\u73b0\uff1b\u5728 nuPlan\u3001NAVSIMv1/v2 \u548c HUGSIM \u4e0a\u8fbe\u5230\u9886\u5148\u7ed3\u679c\uff0c\u5177\u6709\u8f83\u5f3a\u65b9\u6cd5\u8bba\u4e0e\u5de5\u7a0b\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Aerial Vision-and-Language Navigation requires drones to follow natural-language instructions and navigate through complex urban environments. Accurate navigation relies on both local and global spatial information, which support immediate action grounding and long-horizon path planning, respectively. However, existing zero-shot methods typically operate at a single spatial scale, relying either on local representations constructed online from current observations or on global memories built offline from historical experience. To address this limitation, we propose AirAnchor, a new paradigm that bridges local and global spatial information through spatial anchors and integrates both into a shared navigation framework, enabling comprehensive spatial grounding for decision-making. AirAnchor consists of three core components: (1) Query-Driven Spatial Anchor Grounding, which identifies decision-relevant anchors from visual observations and organizes them into local spatial representations; (2) Persistent Object Spatial Memory, which incrementally maintains an object knowledge base as persistent global spatial memory and retrieves landmark-related spatial priors; and (3) a Spatially-Informed Navigation Agent, which explicitly integrates both local and global spatial information into an agentic framework for decision-making. Extensive experiments on AerialVLN demonstrate that AirAnchor substantially outperforms existing zero-shot baselines, validating the effectiveness and efficiency of the proposed paradigm.", "arxiv_id": "2609.08442", "arxiv_url": "https://arxiv.org/abs/2609.08442", "authors": ["Shanwei Fan", "Bin Zhang", "Zhiwei Xu", "Yingxuan Teng", "Siqi Dai", "Lin Cheng", "Guoliang Fan"], "brief": "\u8bba\u6587\u63d0\u51fa AirAnchor\uff0c\u7528\u7a7a\u95f4\u951a\u70b9\u8fde\u63a5\u5728\u7ebf\u5c40\u90e8\u89c2\u6d4b\u4e0e\u6301\u4e45\u5168\u5c40\u8bb0\u5fc6\uff0c\u7528\u4e8e\u822a\u62cd\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u3002\u8be5\u65b9\u6cd5\u8ba9\u65e0\u4eba\u673a\u5728\u96f6\u6837\u672c\u573a\u666f\u4e0b\u540c\u65f6\u8fdb\u884c\u5373\u65f6\u52a8\u4f5c\u843d\u5730\u4e0e\u957f\u7a0b\u8def\u5f84\u89c4\u5212\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08442", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7 Query-Driven Spatial Anchor Grounding \u4ece\u89c6\u89c9\u89c2\u6d4b\u4e2d\u8bc6\u522b\u4e0e\u6307\u4ee4\u51b3\u7b56\u76f8\u5173\u7684\u7a7a\u95f4\u951a\u70b9\uff0c\u6784\u5efa\u5c40\u90e8\u7a7a\u95f4\u8868\u793a", "\u5f15\u5165 Persistent Object Spatial Memory\uff0c\u589e\u91cf\u7ef4\u62a4\u5bf9\u8c61\u77e5\u8bc6\u5e93\u4f5c\u4e3a\u5168\u5c40\u7a7a\u95f4\u8bb0\u5fc6\uff0c\u5e76\u68c0\u7d22\u5730\u6807\u76f8\u5173\u7a7a\u95f4\u5148\u9a8c", "\u5c06\u5c40\u90e8\u951a\u70b9\u4e0e\u5168\u5c40\u8bb0\u5fc6\u663e\u5f0f\u6574\u5408\u8fdb\u5bfc\u822a\u667a\u80fd\u4f53\uff0c\u5728 AerialVLN \u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u96f6\u6837\u672c\u57fa\u7ebf"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u7a7a\u95f4\u8bb0\u5fc6", "\u65e0\u4eba\u673a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08442v1", "published_at": "2026-09-08", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AirAnchor: Bridging Local and Global Spatial Information for Zero-Shot Aerial Vision-and-Language Navigation", "tldr": "\u878d\u5408\u5c40\u90e8\u4e0e\u5168\u5c40\u7a7a\u95f4\u4fe1\u606f\u7684\u96f6\u6837\u672c\u65e0\u4eba\u673a\u5bfc\u822a", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AirAnchor\uff0c\u7528\u7a7a\u95f4\u951a\u70b9\u8fde\u63a5\u5728\u7ebf\u5c40\u90e8\u89c2\u6d4b\u4e0e\u6301\u4e45\u5168\u5c40\u8bb0\u5fc6\uff0c\u7528\u4e8e\u822a\u62cd\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u3002\u8be5\u65b9\u6cd5\u8ba9\u65e0\u4eba\u673a\u5728\u96f6\u6837\u672c\u573a\u666f\u4e0b\u540c\u65f6\u8fdb\u884c\u5373\u65f6\u52a8\u4f5c\u843d\u5730\u4e0e\u957f\u7a0b\u8def\u5f84\u89c4\u5212\u3002", "why_notable": "\u73b0\u6709\u96f6\u6837\u672c\u822a\u62cd\u5bfc\u822a\u591a\u4f9d\u8d56\u5355\u4e00\u7a7a\u95f4\u5c3a\u5ea6\uff0cAirAnchor \u5c06\u5c40\u90e8\u611f\u77e5\u548c\u5168\u5c40\u8bb0\u5fc6\u7edf\u4e00\u5230\u540c\u4e00\u51b3\u7b56\u6846\u67b6\u4e2d\uff0c\u63d0\u5347\u4e86\u590d\u6742\u57ce\u5e02\u73af\u5883\u4e0b\u7684\u6cdb\u5316\u5bfc\u822a\u80fd\u529b\u4e0e\u5b9e\u7528\u6027\u3002"}, {"abstract": "Vision-language-action (VLA) models map visual observations and language instructions directly to robot actions, but long-horizon tasks require more than action prediction. An agent must coordinate perception, planning, execution, progress verification, and recovery as the physical state evolves. An action prediction or a model-generated skill decision does not, by itself, guarantee that the proposed operation is valid in the current state or that its outcome will be verified. We propose EmbodiedSkills, a unified framework that treats each skill decision as an execution proposal: the runtime checks its prerequisites before execution and verifies the outcome afterward. A shared executable-skill interface connects high-level skill selection, bounded low-level VLA execution, and post-action verification within a single agent loop. Because this interface remains fixed, low-level VLA policies can be replaced or adapted without changing the agent loop. The interface also records planning, execution, verification, and recovery events as structured trajectories, which provide supervision for individual components and can support optional online adaptation when interactive feedback is available. We instantiate EmbodiedSkills with Qwen3-VL and OpenPI/pi0.5 on RoboTwin 2.0 and LIBERO. Task-adapted low-level VLA policies achieve an average success rate of 86.20% across 50 RoboTwin 2.0 tasks and 97.40% across the four LIBERO suites. These results establish the execution performance of the task-adapted low-level VLA policies used in EmbodiedSkills. On four memory-dependent RMBench tasks, the same task-adapted execution approach achieves 12.5% average success. The framework provides a trainable and inspectable agent layer for turning these policies into closed-loop embodied systems.", "arxiv_id": "2609.01281", "arxiv_url": "https://arxiv.org/abs/2609.01281", "authors": ["Wei Wang", "Wenqiao Zhang", "Yutong Lin", "Yuqian Yuan", "Tianwei Lin", "Jinhao Mao", "Zhenxuan Fan", "Mingjian Gao", "Yang Dai", "Wentong Li", "Zheqi Lv", "Zheng Dong", "Yingjie Niu", "Jiaqi Zhu", "Jun Xiao", "Chao Li", "Yueting Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa EmbodiedSkills\uff0c\u4e00\u4e2a\u7528\u4e8e\u7f16\u6392\u3001\u8bad\u7ec3\u548c\u90e8\u7f72 VLA \u673a\u5668\u4eba\u7684\u7edf\u4e00\u6846\u67b6\u3002\u5b83\u628a\u6bcf\u6b21\u6280\u80fd\u9009\u62e9\u89c6\u4e3a\u201c\u6267\u884c\u63d0\u6848\u201d\uff0c\u5728\u6267\u884c\u524d\u68c0\u67e5\u524d\u7f6e\u6761\u4ef6\u3001\u6267\u884c\u540e\u9a8c\u8bc1\u7ed3\u679c\uff0c\u5e76\u5c06\u89c4\u5212\u3001\u6267\u884c\u3001\u9a8c\u8bc1\u548c\u6062\u590d\u8bb0\u5f55\u4e3a\u7ed3\u6784\u5316\u8f68\u8ff9\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/DCDmllm/EmbodiedSkills", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2609.01281", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u5171\u4eab\u7684\u53ef\u6267\u884c\u6280\u80fd\u63a5\u53e3\uff0c\u8fde\u63a5\u9ad8\u5c42\u6280\u80fd\u9009\u62e9\u3001\u4f4e\u5c42 VLA \u6267\u884c\u548c\u540e\u52a8\u4f5c\u9a8c\u8bc1\uff0c\u5f62\u6210\u95ed\u73af\u667a\u80fd\u4f53\u5faa\u73af", "\u63a5\u53e3\u56fa\u5b9a\uff0c\u53ef\u66ff\u6362\u6216\u9002\u914d\u4e0d\u540c\u4f4e\u5c42 VLA \u7b56\u7565\uff0c\u65e0\u9700\u6539\u52a8\u6574\u4f53\u667a\u80fd\u4f53\u6846\u67b6", "\u5728 RoboTwin 2.0 \u7684 50 \u4e2a\u4efb\u52a1\u4e0a\u8fbe\u5230 86.20% \u5e73\u5747\u6210\u529f\u7387\uff0c\u5728 LIBERO \u56db\u5957\u4efb\u52a1\u4e0a\u8fbe\u5230 97.40%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "VLA\u6a21\u578b", "\u667a\u80fd\u4f53", "\u673a\u5668\u4eba"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01281v1", "published_at": "2026-09-01", "score": 0.275, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01281.png", "title": "EmbodiedSkills: A Unified Framework for Orchestrating, Training, and Deploying VLA Agents", "tldr": "\u7edf\u4e00\u6280\u80fd\u63a5\u53e3\u8ba9VLA\u673a\u5668\u4eba\u95ed\u73af\u6267\u884c\u4e0e\u9a8c\u8bc1", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa EmbodiedSkills\uff0c\u4e00\u4e2a\u7528\u4e8e\u7f16\u6392\u3001\u8bad\u7ec3\u548c\u90e8\u7f72 VLA \u673a\u5668\u4eba\u7684\u7edf\u4e00\u6846\u67b6\u3002\u5b83\u628a\u6bcf\u6b21\u6280\u80fd\u9009\u62e9\u89c6\u4e3a\u201c\u6267\u884c\u63d0\u6848\u201d\uff0c\u5728\u6267\u884c\u524d\u68c0\u67e5\u524d\u7f6e\u6761\u4ef6\u3001\u6267\u884c\u540e\u9a8c\u8bc1\u7ed3\u679c\uff0c\u5e76\u5c06\u89c4\u5212\u3001\u6267\u884c\u3001\u9a8c\u8bc1\u548c\u6062\u590d\u8bb0\u5f55\u4e3a\u7ed3\u6784\u5316\u8f68\u8ff9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 VLA \u4ece\u5355\u6b65\u52a8\u4f5c\u9884\u6d4b\u6269\u5c55\u4e3a\u53ef\u68c0\u67e5\u3001\u53ef\u6062\u590d\u3001\u53ef\u8bad\u7ec3\u7684\u5177\u8eab\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5f3a\u8c03\u957f\u7a0b\u4efb\u52a1\u4e2d\u7684\u72b6\u6001\u6709\u6548\u6027\u548c\u7ed3\u679c\u9a8c\u8bc1\uff0c\u5bf9\u673a\u5668\u4eba\u4efb\u52a1\u90e8\u7f72\u66f4\u5b9e\u7528\u3002"}, {"abstract": "Causal inference is the practice of estimating the effect of a treatment or intervention from data. It traditionally requires a bespoke pipeline for every new problem: first proposing a causal mechanism, selecting a compatible estimator, and finally training it. Meanwhile, across diverse settings and modalities, much of machine learning has shifted to the paradigm of foundation models: networks pretrained once at scale and applied to new tasks without fine-tuning. Causal foundation models (CFMs) bring this paradigm to causal inference. CFMs are pretrained neural networks that estimate causal quantities, such as the average treatment effect, on entirely new datasets using in-context learning without requiring model updates. This work provides a practical introduction to this emerging area. We summarize the necessary background in causal inference and machine learning before discussing CFMs. Throughout, we include example code and Jupyter notebooks.", "arxiv_id": "2609.03003", "arxiv_url": "https://arxiv.org/abs/2609.03003", "authors": ["Christopher Stith", "Hossein Rahmani", "Jesse C. Cresswell"], "brief": "\u672c\u6587\u4ecb\u7ecd Causal Foundation Models\uff08CFMs\uff09\uff1a\u9884\u8bad\u7ec3\u795e\u7ecf\u7f51\u7edc\u53ef\u5728\u65b0\u6570\u636e\u96c6\u4e0a\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u4f30\u8ba1\u5e73\u5747\u5904\u7406\u6548\u5e94\u7b49\u56e0\u679c\u91cf\uff0c\u65e0\u9700\u9488\u5bf9\u6bcf\u4e2a\u95ee\u9898\u91cd\u65b0\u5efa\u6a21\u6216\u5fae\u8c03\u3002\u8bba\u6587\u7cfb\u7edf\u68b3\u7406\u56e0\u679c\u63a8\u65ad\u4e0e\u673a\u5668\u5b66\u4e60\u80cc\u666f\uff0c\u5e76\u63d0\u4f9b\u793a\u4f8b\u4ee3\u7801\u548c Jupyter notebooks\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": "https://github.com/layer6ai-labs/cfms", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2609.03003", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u57fa\u7840\u6a21\u578b\u8303\u5f0f\u5f15\u5165\u56e0\u679c\u63a8\u65ad\uff0c\u76ee\u6807\u662f\u51cf\u5c11\u4f20\u7edf\u56e0\u679c\u5206\u6790\u4e2d\u673a\u5236\u5047\u8bbe\u3001\u4f30\u8ba1\u5668\u9009\u62e9\u548c\u8bad\u7ec3\u7684\u5b9a\u5236\u6d41\u7a0b", "CFMs \u901a\u8fc7 in-context learning \u5728\u5168\u65b0\u6570\u636e\u96c6\u4e0a\u76f4\u63a5\u4f30\u8ba1\u56e0\u679c\u91cf\uff0c\u5982 average treatment effect", "\u8bba\u6587\u504f\u5b9e\u8df5\u5bfc\u5411\uff0c\u63d0\u4f9b\u80cc\u666f\u7efc\u8ff0\u3001\u65b9\u6cd5\u8ba8\u8bba\u548c\u53ef\u8fd0\u884c\u4ee3\u7801\uff0c\u4fbf\u4e8e\u7814\u7a76\u8005\u5165\u95e8"], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u57fa\u7840\u6a21\u578b", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Layer 6 AI", "pdf_url": "https://arxiv.org/pdf/2609.03003v1", "published_at": "2026-09-02", "score": 0.27, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03003.png", "title": "Causal Foundation Models", "tldr": "\u7efc\u8ff0\u56e0\u679c\u57fa\u7840\u6a21\u578b\u7684\u65b0\u5174\u8303\u5f0f", "upvotes": 12, "what_it_is": "\u672c\u6587\u4ecb\u7ecd Causal Foundation Models\uff08CFMs\uff09\uff1a\u9884\u8bad\u7ec3\u795e\u7ecf\u7f51\u7edc\u53ef\u5728\u65b0\u6570\u636e\u96c6\u4e0a\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u4f30\u8ba1\u5e73\u5747\u5904\u7406\u6548\u5e94\u7b49\u56e0\u679c\u91cf\uff0c\u65e0\u9700\u9488\u5bf9\u6bcf\u4e2a\u95ee\u9898\u91cd\u65b0\u5efa\u6a21\u6216\u5fae\u8c03\u3002\u8bba\u6587\u7cfb\u7edf\u68b3\u7406\u56e0\u679c\u63a8\u65ad\u4e0e\u673a\u5668\u5b66\u4e60\u80cc\u666f\uff0c\u5e76\u63d0\u4f9b\u793a\u4f8b\u4ee3\u7801\u548c Jupyter notebooks\u3002", "why_notable": "\u56e0\u679c\u63a8\u65ad\u957f\u671f\u4f9d\u8d56\u95ee\u9898\u7279\u5b9a\u5efa\u6a21\uff0c\u800c CFMs \u8bd5\u56fe\u63d0\u4f9b\u53ef\u8fc1\u79fb\u3001\u9884\u8bad\u7ec3\u3001\u65e0\u9700\u5fae\u8c03\u7684\u901a\u7528\u56e0\u679c\u4f30\u8ba1\u5668\uff1b\u82e5\u6210\u719f\uff0c\u53ef\u80fd\u663e\u8457\u964d\u4f4e\u56e0\u679c\u5206\u6790\u95e8\u69db\uff0c\u5e76\u63a8\u52a8\u56e0\u679c\u63a8\u65ad\u4e0e\u57fa\u7840\u6a21\u578b\u7ed3\u5408\u3002"}, {"abstract": "Long-horizon manipulation is partially observable: the information needed to choose the next action may appear only in observations from minutes earlier. Existing memory mechanisms: retrieval banks, learned compressors, recurrent states must decide what to keep from the past before knowing what a future decision will require. This was motivated by the assumption that minute-scale history is too large to process directly, which modern VLM backbones no longer make true. In this work, we introduce SimpleMemVLA, a VLA without a dedicated memory module. It keeps the sampled history intact and passes it to the backbone in the timestamped video format the backbone was pretrained to process; the hidden states of a generated sub-task then form the only channel from history to a standard flow-matching action head. Since consecutive decisions share most of their history, prefilling the shared prefix during action execution keeps latency close to a single-frame VLA. SimpleMemVLA sets a new state of the art on four memory benchmarks without cost on general-purpose control. Holding the backbone and training setup fixed, it outperforms retrieval, compression and recurrent-state mechanisms by a wide margin, and causal interventions confirm that the policy genuinely reads its history. Code available at https://github.com/wadeKeith/SimpleMemVLA", "arxiv_id": "2609.05533", "arxiv_url": "https://arxiv.org/abs/2609.05533", "authors": ["Cheng Yin", "Wang Xu", "Junpeng Yang", "Sikyuen Tam", "Hanyu Liu", "Yuan Yao", "Xiangrui Zeng", "Junbo Cui", "Yequan Wang", "Zhouping Yin", "Yankai Lin"], "brief": "SimpleMemVLA \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u4e13\u7528\u8bb0\u5fc6\u6a21\u5757\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\uff1a\u4fdd\u7559\u91c7\u6837\u540e\u7684\u5b8c\u6574\u5386\u53f2\uff0c\u5e76\u4ee5\u5e26\u65f6\u95f4\u6233\u7684\u89c6\u9891\u683c\u5f0f\u8f93\u5165\u9884\u8bad\u7ec3 VLM \u4e3b\u5e72\u3002\u6a21\u578b\u901a\u8fc7\u751f\u6210\u5b50\u4efb\u52a1\u7684\u9690\u85cf\u72b6\u6001\u5c06\u5386\u53f2\u4fe1\u606f\u4f20\u9012\u7ed9\u6807\u51c6 flow-matching \u52a8\u4f5c\u5934\uff0c\u5b9e\u73b0\u957f\u65f6\u7a0b\u64cd\u4f5c\u51b3\u7b56\u3002", "categories": ["cs.CV", "cs.LG", "cs.RO"], "github_repo": "https://github.com/wadeKeith/SimpleMemVLA", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.05533", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4e0d\u4f7f\u7528\u68c0\u7d22\u5e93\u3001\u538b\u7f29\u5668\u6216\u5faa\u73af\u72b6\u6001\uff0c\u800c\u662f\u8ba9 VLM \u4e3b\u5e72\u76f4\u63a5\u5904\u7406\u5206\u949f\u7ea7\u5386\u53f2\u89c6\u9891\u3002", "\u5229\u7528\u8fde\u7eed\u51b3\u7b56\u5171\u4eab\u5927\u90e8\u5206\u5386\u53f2\u7684\u7279\u70b9\uff0c\u901a\u8fc7 prefix prefilling \u5c06\u63a8\u7406\u5ef6\u8fdf\u4fdd\u6301\u63a5\u8fd1\u5355\u5e27 VLA\u3002", "\u5728\u56db\u4e2a\u8bb0\u5fc6\u57fa\u51c6\u4e0a\u8fbe\u5230\u65b0 SOTA\uff0c\u5e76\u5728\u56fa\u5b9a\u4e3b\u5e72\u548c\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u663e\u8457\u4f18\u4e8e\u68c0\u7d22\u3001\u538b\u7f29\u548c\u5faa\u73af\u8bb0\u5fc6\u673a\u5236\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u957f\u671f\u8bb0\u5fc6", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "OpenBMB", "pdf_url": "https://arxiv.org/pdf/2609.05533v1", "published_at": "2026-09-02", "score": 0.247, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05533.png", "title": "SimpleMemVLA: A Simple but Effective Native-Video Memory for Vision-Language-Action Models", "tldr": "\u76f4\u63a5\u7528\u957f\u89c6\u9891\u5386\u53f2\u63d0\u5347VLA\u957f\u671f\u64cd\u4f5c\u8bb0\u5fc6", "upvotes": 3, "what_it_is": "SimpleMemVLA \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u4e13\u7528\u8bb0\u5fc6\u6a21\u5757\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\uff1a\u4fdd\u7559\u91c7\u6837\u540e\u7684\u5b8c\u6574\u5386\u53f2\uff0c\u5e76\u4ee5\u5e26\u65f6\u95f4\u6233\u7684\u89c6\u9891\u683c\u5f0f\u8f93\u5165\u9884\u8bad\u7ec3 VLM \u4e3b\u5e72\u3002\u6a21\u578b\u901a\u8fc7\u751f\u6210\u5b50\u4efb\u52a1\u7684\u9690\u85cf\u72b6\u6001\u5c06\u5386\u53f2\u4fe1\u606f\u4f20\u9012\u7ed9\u6807\u51c6 flow-matching \u52a8\u4f5c\u5934\uff0c\u5b9e\u73b0\u957f\u65f6\u7a0b\u64cd\u4f5c\u51b3\u7b56\u3002", "why_notable": "\u8bba\u6587\u6311\u6218\u4e86\u201c\u957f\u5386\u53f2\u5fc5\u987b\u5148\u538b\u7f29\u6216\u9009\u62e9\u6027\u8bb0\u5fc6\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u5c55\u793a\u73b0\u4ee3\u89c6\u9891\u8bed\u8a00\u6a21\u578b\u53ef\u76f4\u63a5\u5229\u7528\u539f\u751f\u89c6\u9891\u5386\u53f2\u5b8c\u6210\u957f\u671f\u64cd\u4f5c\u4efb\u52a1\uff1b\u540c\u65f6\u517c\u987e\u6027\u80fd\u4e0e\u5ef6\u8fdf\uff0c\u5bf9\u673a\u5668\u4eba\u957f\u7a0b\u4efb\u52a1\u89c4\u5212\u548c\u6267\u884c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Many NLP tasks, such as summarization and extractive question answering, reduce to retrieving relevant content from documents under two constraints: coverage, retaining enough pertinent information to achieve some goal, and conciseness, removing as much irrelevant information as possible. Conformal prediction methods have been used to guarantee coverage, and must be optimized for conciseness through design of a score function. State-of-the-art scoring functions use hand-engineered LLM prompts asking the model to rate the importance of content, but manual prompt engineering is labor-intensive and task-specific. We introduce the Conformal Relevance framework which uses in-context learning example curation and ensembling to create a score function which maintains coverage while improving conciseness with minimal manual input. We demonstrate this framework\u0027s application on seven NLP tasks, and also theoretically study the impact of diversity for ensembled conformal scores, giving a complementarity condition that characterizes when ensembling improves worst-case sentence scores, and a saturation bound on ensemble improvement.", "arxiv_id": "2609.03005", "arxiv_url": "https://arxiv.org/abs/2609.03005", "authors": ["Xiao Shi Huang", "Chen-Yuan Lin", "Bruce Kuwahara", "Kin Kwan Leung", "Jesse C. Cresswell"], "brief": "\u8bba\u6587\u63d0\u51fa Conformal Relevance \u6846\u67b6\uff0c\u901a\u8fc7\u4e0a\u4e0b\u6587\u793a\u4f8b\u7b5b\u9009\u4e0e\u96c6\u6210\u6765\u6784\u9020\u4fdd\u5f62\u9884\u6d4b\u7684\u76f8\u5173\u6027\u8bc4\u5206\u51fd\u6570\uff0c\u5728\u4fdd\u8bc1\u8986\u76d6\u7387\u7684\u540c\u65f6\u51cf\u5c11\u5197\u4f59\u5185\u5bb9\u3002\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u9488\u5bf9\u6458\u8981\u3001\u62bd\u53d6\u5f0f\u95ee\u7b54\u7b49\u4efb\u52a1\u7684\u4eba\u5de5\u63d0\u793a\u8bcd\u8bbe\u8ba1\u9700\u6c42\uff0c\u5e76\u5728\u4e03\u7c7b NLP \u4efb\u52a1\u4e0a\u9a8c\u8bc1\u3002", "categories": ["cs.CL", "cs.LG", "stat.ML"], "github_repo": "https://github.com/layer6ai-labs/conformal-relevance", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.03005", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u591a\u79cd\u8bed\u8a00\u4efb\u52a1\u62bd\u8c61\u4e3a\u5728\u8986\u76d6\u6027\u4e0e\u7b80\u6d01\u6027\u7ea6\u675f\u4e0b\u7684\u76f8\u5173\u5185\u5bb9\u68c0\u7d22\u95ee\u9898\u3002", "\u7528 in-context learning \u793a\u4f8b\u7b56\u5212\u4e0e\u96c6\u6210\u66ff\u4ee3\u624b\u5de5\u8bbe\u8ba1\u7684\u91cd\u8981\u6027\u8bc4\u5206\u63d0\u793a\u8bcd\u3002", "\u7406\u8bba\u5206\u6790\u4e86\u96c6\u6210\u4fdd\u5f62\u5206\u6570\u4e2d\u591a\u6837\u6027\u7684\u4f5c\u7528\uff0c\u7ed9\u51fa\u4e92\u8865\u6027\u6761\u4ef6\u4e0e\u96c6\u6210\u6536\u76ca\u9971\u548c\u754c\u3002"], "keywords": ["\u4fdd\u5f62\u9884\u6d4b", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u96c6\u6210\u5b66\u4e60", "\u81ea\u7136\u8bed\u8a00\u5904\u7406"], "num_comments": 2, "on_hf": true, "organization": "Layer 6 AI", "pdf_url": "https://arxiv.org/pdf/2609.03005v1", "published_at": "2026-09-02", "score": 0.238, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03005.png", "title": "Unifying Conformal Language Tasks with In-Context Ensembles", "tldr": "\u7528\u4e0a\u4e0b\u6587\u96c6\u6210\u7edf\u4e00\u63d0\u5347\u4fdd\u5f62\u8bed\u8a00\u4efb\u52a1\u7cbe\u7b80\u6027", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa Conformal Relevance \u6846\u67b6\uff0c\u901a\u8fc7\u4e0a\u4e0b\u6587\u793a\u4f8b\u7b5b\u9009\u4e0e\u96c6\u6210\u6765\u6784\u9020\u4fdd\u5f62\u9884\u6d4b\u7684\u76f8\u5173\u6027\u8bc4\u5206\u51fd\u6570\uff0c\u5728\u4fdd\u8bc1\u8986\u76d6\u7387\u7684\u540c\u65f6\u51cf\u5c11\u5197\u4f59\u5185\u5bb9\u3002\u8be5\u65b9\u6cd5\u51cf\u5c11\u4e86\u9488\u5bf9\u6458\u8981\u3001\u62bd\u53d6\u5f0f\u95ee\u7b54\u7b49\u4efb\u52a1\u7684\u4eba\u5de5\u63d0\u793a\u8bcd\u8bbe\u8ba1\u9700\u6c42\uff0c\u5e76\u5728\u4e03\u7c7b NLP \u4efb\u52a1\u4e0a\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4fdd\u5f62\u9884\u6d4b\u7684\u8986\u76d6\u4fdd\u8bc1\u4e0e LLM \u4e0a\u4e0b\u6587\u5b66\u4e60\u7ed3\u5408\uff0c\u63d0\u4f9b\u4e86\u66f4\u81ea\u52a8\u5316\u3001\u8de8\u4efb\u52a1\u7684\u8bc4\u5206\u51fd\u6570\u6784\u5efa\u65b9\u5f0f\uff0c\u6709\u671b\u964d\u4f4e\u4fdd\u5f62 NLP \u7cfb\u7edf\u843d\u5730\u4e2d\u7684\u63d0\u793a\u5de5\u7a0b\u6210\u672c\u3002"}, {"abstract": "Safety alignment is usually posed as a topic-level question: is this subject harmful? Deployments ask a narrower one. A civics tutor and a public-sector assistant may share a base model yet need different boundaries inside the same topic, refusing targeted political manipulation while still answering factual questions about the same election. We formulate this as narrow-boundary safety and introduce an offline self-generated framework combining controlled topic generation, coverage repair, in-distribution compensation data, and harmful-benign pairs for training and evaluation. Single-shot generation leaves 19.88% of prompts without accepted refusal traces, whereas escalating retries leave 0.20%. On political persuasion with Qwen3-8B, training on refusal data completed through Escalate increases target-domain refusal from 9.47% to 84.75% and reduces the mean unsafe-response rate across three broader harmfulness benchmarks from 26.26% to 0.14%, but increases XSTest over-refusal from 2.00% to 74.00%. In a separate matched comparison, replacing external responses with verified target-model responses reduces over-refusal from 15.20% to 5.20%. Boundary-pair data reduces comply-side over-refusal on held-out pairs from 32.94% to 4.16%, while harmful-side refusal decreases only from 91.88% to 87.72%. These results show that data composition controls the safety and usability trade-off, and that safety alignment should be evaluated on both sides of the intended refusal boundary.", "arxiv_id": "2609.04482", "arxiv_url": "https://arxiv.org/abs/2609.04482", "authors": ["Alejo L\u00f3pez-\u00c1vila", "Iker Garc\u00eda-Ferrero", "Jezabel Garcia", "Antonio Tiene", "Rom\u00e1n Or\u00fas"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u7a84\u8fb9\u754c\u5b89\u5168\u201d\u8bbe\u5b9a\uff0c\u5173\u6ce8\u540c\u4e00\u8bdd\u9898\u5185\u54ea\u4e9b\u8bf7\u6c42\u8be5\u62d2\u7edd\u3001\u54ea\u4e9b\u4ecd\u5e94\u56de\u7b54\u3002\u4f5c\u8005\u6784\u5efa\u79bb\u7ebf\u81ea\u751f\u6210\u8bad\u7ec3\u6846\u67b6\uff0c\u901a\u8fc7\u4e3b\u9898\u751f\u6210\u3001\u8986\u76d6\u4fee\u590d\u3001\u5206\u5e03\u5185\u8865\u507f\u6570\u636e\u548c\u6709\u5bb3-\u826f\u6027\u8fb9\u754c\u5bf9\u6765\u8bad\u7ec3\u4e0e\u8bc4\u4f30\u53ef\u63a7\u62d2\u7b54\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04482", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5347\u7ea7\u91cd\u8bd5\u673a\u5236\u5c06\u65e0\u53ef\u7528\u62d2\u7b54\u8f68\u8ff9\u7684\u63d0\u793a\u6bd4\u4f8b\u4ece19.88%\u964d\u81f30.20%\uff0c\u663e\u8457\u6539\u5584\u62d2\u7b54\u6570\u636e\u8986\u76d6\u3002", "\u5728\u653f\u6cbb\u529d\u670d\u4efb\u52a1\u4e2d\uff0c\u57fa\u4e8e\u8865\u5168\u62d2\u7b54\u6570\u636e\u8bad\u7ec3\u4f7f\u76ee\u6807\u57df\u62d2\u7b54\u7387\u4ece9.47%\u5347\u81f384.75%\uff0c\u5e7f\u4e49\u6709\u5bb3\u57fa\u51c6\u5e73\u5747\u4e0d\u5b89\u5168\u56de\u590d\u7387\u4ece26.26%\u964d\u81f30.14%\u3002", "\u8fb9\u754c\u5bf9\u6570\u636e\u5c06\u826f\u6027\u4fa7\u8fc7\u5ea6\u62d2\u7b54\u4ece32.94%\u964d\u81f34.16%\uff0c\u540c\u65f6\u6709\u5bb3\u4fa7\u62d2\u7b54\u4ec5\u4ece91.88%\u5c0f\u5e45\u964d\u81f387.72%\u3002"], "keywords": ["\u5b89\u5168\u5bf9\u9f50", "\u62d2\u7b54\u63a7\u5236", "\u6570\u636e\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Multiverse Computing", "pdf_url": "https://arxiv.org/pdf/2609.04482v1", "published_at": "2026-09-03", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04482.png", "title": "Safety for Whom? Boundary-Aware Self-Distillation for Controlled LLM Safety Refusal", "tldr": "\u8ba9LLM\u6309\u7ec6\u7c92\u5ea6\u8fb9\u754c\u7cbe\u51c6\u62d2\u7b54", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u7a84\u8fb9\u754c\u5b89\u5168\u201d\u8bbe\u5b9a\uff0c\u5173\u6ce8\u540c\u4e00\u8bdd\u9898\u5185\u54ea\u4e9b\u8bf7\u6c42\u8be5\u62d2\u7edd\u3001\u54ea\u4e9b\u4ecd\u5e94\u56de\u7b54\u3002\u4f5c\u8005\u6784\u5efa\u79bb\u7ebf\u81ea\u751f\u6210\u8bad\u7ec3\u6846\u67b6\uff0c\u901a\u8fc7\u4e3b\u9898\u751f\u6210\u3001\u8986\u76d6\u4fee\u590d\u3001\u5206\u5e03\u5185\u8865\u507f\u6570\u636e\u548c\u6709\u5bb3-\u826f\u6027\u8fb9\u754c\u5bf9\u6765\u8bad\u7ec3\u4e0e\u8bc4\u4f30\u53ef\u63a7\u62d2\u7b54\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5b89\u5168\u5bf9\u9f50\u4ece\u7c97\u7c92\u5ea6\u8bdd\u9898\u5224\u65ad\u63a8\u8fdb\u5230\u90e8\u7f72\u6240\u9700\u7684\u7ec6\u7c92\u5ea6\u8fb9\u754c\u63a7\u5236\uff0c\u63ed\u793a\u6570\u636e\u7ec4\u6210\u4f1a\u663e\u8457\u5f71\u54cd\u5b89\u5168\u6027\u4e0e\u53ef\u7528\u6027\u7684\u6743\u8861\uff0c\u5c24\u5176\u5f3a\u8c03\u5e94\u540c\u65f6\u8bc4\u4f30\u62d2\u7b54\u8fb9\u754c\u4e24\u4fa7\u7684\u8868\u73b0\u3002"}, {"abstract": "We present a systems-security case study of a two-node split-LLM training system whose privacy evaluation passed while leaving an observable channel untested. The Trusted Local Node (TLN) sends protected activations to the Untrusted Cloud Node (UCN), the UCN returns its output, and TLN, holding the private loss, returns the output gradient. The frame the UCN receives mixes real rows with decoys, and the loss ignores the decoys. Their gradients are exactly zero, so the pattern of zeros reveals which rows were real. We measure it with a protocol fixed in advance: a leak injected at known strength to prove the instrument can see one, a shuffled-label control to prove it does not report absent leaks, and a threshold set before the runs. Across nine seeds, the zeros identified the real rows on every frame, 4,096 of 4,096 per run. An attack on the frame contents recovered about one extra token per hundred over a constant-guess baseline (+0.65 to +1.50 percentage points); the shuffled controls recovered nothing. A second set of runs repeated this on a configuration that keeps model quality within budget, so the finding is not confined to a setting nobody would deploy. On both datasets, every such run passed the forward-channel privacy check and the quality check, yet failed that same check once the returned gradient was included. Clipping and noising each row of the gradient closed the leak for about 0.01 nats of held-out cross-entropy. The system is not thereby safe: five classes of attack, including those accumulating observations across training steps, were never measured.", "arxiv_id": "2609.04382", "arxiv_url": "https://arxiv.org/abs/2609.04382", "authors": ["Georgios Politis", "Evangelos Pappas"], "brief": "\u8bba\u6587\u5206\u6790\u4e00\u4e2a\u4e24\u8282\u70b9 Split-LLM \u8bad\u7ec3\u7cfb\u7edf\u7684\u9690\u79c1\u5931\u6548\uff1a\u672c\u5730\u8282\u70b9\u7528\u8bf1\u9975\u884c\u6df7\u6dc6\u771f\u5b9e\u6fc0\u6d3b\uff0c\u4f46\u4e91\u7aef\u6536\u5230\u7684\u8fd4\u56de\u68af\u5ea6\u4e2d\u8bf1\u9975\u884c\u68af\u5ea6\u6070\u4e3a\u96f6\uff0c\u4ece\u800c\u76f4\u63a5\u6cc4\u9732\u771f\u5b9e\u884c\u4f4d\u7f6e\u3002\u4f5c\u8005\u7528\u9884\u6ce8\u518c\u5b9e\u9a8c\u534f\u8bae\u9a8c\u8bc1\u8be5\u6f0f\u6d1e\uff0c\u5e76\u8bc4\u4f30\u7b80\u5355\u9632\u62a4\u7684\u6548\u679c\u3002", "categories": ["cs.CR", "cs.DC", "cs.LG"], "github_repo": "https://github.com/setloop-io/Privacy-Failure-in-Split-LLM-Training-The-Returned-Gradient-Nullifies-the-Decoys", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04382", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u57289\u4e2a\u968f\u673a\u79cd\u5b50\u4e0b\uff0c\u96f6\u68af\u5ea6\u6a21\u5f0f\u6bcf\u6b21\u90fd\u80fd\u8bc6\u522b\u771f\u5b9e\u884c\uff0c\u8fbe\u52304096/4096\u7684\u51c6\u786e\u8bc6\u522b\u3002", "\u57fa\u4e8e\u5e27\u5185\u5bb9\u7684\u653b\u51fb\u76f8\u8f83\u5e38\u6570\u731c\u6d4b\u57fa\u7ebf\u591a\u6062\u590d\u7ea6\u6bcf\u767e\u4e2a token 1\u4e2a\uff0c\u63d0\u53470.65\u81f31.50\u4e2a\u767e\u5206\u70b9\uff1b\u6253\u4e71\u6807\u7b7e\u5bf9\u7167\u65e0\u6cc4\u9732\u3002", "\u5bf9\u6bcf\u884c\u68af\u5ea6\u8fdb\u884c\u88c1\u526a\u548c\u52a0\u566a\u53ef\u5173\u95ed\u8be5\u6cc4\u9732\u901a\u9053\uff0c\u4ee3\u4ef7\u7ea6\u4e3a0.01 nats\u7684\u9a8c\u8bc1\u96c6\u4ea4\u53c9\u71b5\u4e0a\u5347\u3002"], "keywords": ["\u9690\u79c1\u5b89\u5168", "\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u68af\u5ea6\u6cc4\u9732", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Setloop", "pdf_url": "https://arxiv.org/pdf/2609.04382v1", "published_at": "2026-09-03", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04382.png", "title": "Privacy Failure in Split-LLM Training, The Returned Gradient Nullifies the Decoys", "tldr": "Split-LLM\u8bad\u7ec3\u4e2d\u68af\u5ea6\u66b4\u9732\u771f\u5b9e\u6837\u672c", "upvotes": 4, "what_it_is": "\u8bba\u6587\u5206\u6790\u4e00\u4e2a\u4e24\u8282\u70b9 Split-LLM \u8bad\u7ec3\u7cfb\u7edf\u7684\u9690\u79c1\u5931\u6548\uff1a\u672c\u5730\u8282\u70b9\u7528\u8bf1\u9975\u884c\u6df7\u6dc6\u771f\u5b9e\u6fc0\u6d3b\uff0c\u4f46\u4e91\u7aef\u6536\u5230\u7684\u8fd4\u56de\u68af\u5ea6\u4e2d\u8bf1\u9975\u884c\u68af\u5ea6\u6070\u4e3a\u96f6\uff0c\u4ece\u800c\u76f4\u63a5\u6cc4\u9732\u771f\u5b9e\u884c\u4f4d\u7f6e\u3002\u4f5c\u8005\u7528\u9884\u6ce8\u518c\u5b9e\u9a8c\u534f\u8bae\u9a8c\u8bc1\u8be5\u6f0f\u6d1e\uff0c\u5e76\u8bc4\u4f30\u7b80\u5355\u9632\u62a4\u7684\u6548\u679c\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86 Split-LLM \u9690\u79c1\u8bc4\u4f30\u4e2d\u5bb9\u6613\u5ffd\u7565\u7684\u53cd\u5411\u68af\u5ea6\u901a\u9053\uff1a\u5373\u4f7f\u524d\u5411\u9690\u79c1\u68c0\u67e5\u548c\u6a21\u578b\u8d28\u91cf\u68c0\u67e5\u5747\u901a\u8fc7\uff0c\u8fd4\u56de\u68af\u5ea6\u4ecd\u53ef\u5b8c\u5168\u7834\u574f\u8bf1\u9975\u4fdd\u62a4\u673a\u5236\uff0c\u5bf9\u5206\u5e03\u5f0f\u5927\u6a21\u578b\u8bad\u7ec3\u7684\u5b89\u5168\u8bc4\u4f30\u5177\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "We present FIRE3D, a unified framework that takes a single RGB image or casual RGB video and transforms it into simulation-ready 3D scene assets for games and interactive applications in under a minute. At the core of FIRE3D is a feed-forward, end-to-end network that predicts a compositional scene representation from posed RGB-D observations estimated from the RGB capture, including the 6-DoF pose, bounding box, mesh, and texture for every object. By modeling the scene as a collection of discrete entities, FIRE3D produces amodally complete and simulation-ready environments where objects are physically decoupled and ready for interaction. Our framework requires no test-time optimization, runs orders of magnitude faster than prior interaction-ready methods, and provides object-level completeness beyond existing feed-forward 3D approaches. We demonstrate competitive or state-of-the-art results across pose accuracy, geometry completeness, and texture quality across various datasets while being orders of magnitudes faster. Project page: https://xiahongchi.github.io/Fire3D/", "arxiv_id": "2609.08848", "arxiv_url": "https://arxiv.org/abs/2609.08848", "authors": ["Hongchi Xia", "Tianhang Cheng", "Wei-Chiu Ma", "Shenlong Wang"], "brief": "FIRE3D \u662f\u4e00\u4e2a\u524d\u9988\u5f0f\u7aef\u5230\u7aef\u6846\u67b6\uff0c\u53ef\u4ece\u5355\u5f20 RGB \u56fe\u50cf\u6216\u666e\u901a RGB \u89c6\u9891\u751f\u6210\u53ef\u7528\u4e8e\u4eff\u771f\u3001\u6e38\u620f\u548c\u4ea4\u4e92\u5e94\u7528\u7684 3D \u573a\u666f\u8d44\u4ea7\u3002\u5b83\u5c06\u573a\u666f\u8868\u793a\u4e3a\u79bb\u6563\u7269\u4f53\u96c6\u5408\uff0c\u5e76\u9884\u6d4b\u6bcf\u4e2a\u7269\u4f53\u7684 6-DoF \u4f4d\u59ff\u3001\u5305\u56f4\u76d2\u3001\u7f51\u683c\u548c\u7eb9\u7406\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08848", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u65e0\u9700\u6d4b\u8bd5\u65f6\u4f18\u5316\uff0c\u76f4\u63a5\u524d\u9988\u63a8\u7406\u5373\u53ef\u5b8c\u6210\u573a\u666f\u91cd\u5efa\uff0c\u901f\u5ea6\u6bd4\u4ee5\u5f80\u4ea4\u4e92\u5c31\u7eea\u65b9\u6cd5\u5feb\u6570\u4e2a\u6570\u91cf\u7ea7", "\u5229\u7528\u4ece RGB \u8f93\u5165\u4f30\u8ba1\u7684\u5e26\u4f4d\u59ff RGB-D \u89c2\u6d4b\uff0c\u751f\u6210\u7269\u4f53\u7ea7\u7ec4\u5408\u5f0f\u573a\u666f\u8868\u793a", "\u8f93\u51fa\u7684\u7269\u4f53\u5177\u5907\u975e\u6a21\u6001\u5b8c\u6574\u6027\u548c\u7269\u7406\u89e3\u8026\u7279\u6027\uff0c\u53ef\u76f4\u63a5\u7528\u4e8e\u4eff\u771f\u548c\u4ea4\u4e92"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u573a\u666f\u7406\u89e3", "\u5177\u8eab\u4eff\u771f", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08848v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FIRE3D: Feed-forward Interactive 3D Scene Reconstruction Within A Minute", "tldr": "\u4e00\u5206\u949f\u5185\u751f\u6210\u53ef\u4ea4\u4e923D\u573a\u666f\u8d44\u4ea7", "upvotes": 0, "what_it_is": "FIRE3D \u662f\u4e00\u4e2a\u524d\u9988\u5f0f\u7aef\u5230\u7aef\u6846\u67b6\uff0c\u53ef\u4ece\u5355\u5f20 RGB \u56fe\u50cf\u6216\u666e\u901a RGB \u89c6\u9891\u751f\u6210\u53ef\u7528\u4e8e\u4eff\u771f\u3001\u6e38\u620f\u548c\u4ea4\u4e92\u5e94\u7528\u7684 3D \u573a\u666f\u8d44\u4ea7\u3002\u5b83\u5c06\u573a\u666f\u8868\u793a\u4e3a\u79bb\u6563\u7269\u4f53\u96c6\u5408\uff0c\u5e76\u9884\u6d4b\u6bcf\u4e2a\u7269\u4f53\u7684 6-DoF \u4f4d\u59ff\u3001\u5305\u56f4\u76d2\u3001\u7f51\u683c\u548c\u7eb9\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5feb\u901f 3D \u91cd\u5efa\u63a8\u8fdb\u5230\u201c\u53ef\u4ea4\u4e92\u3001\u53ef\u4eff\u771f\u201d\u7684\u8d44\u4ea7\u7ea7\u8f93\u51fa\uff0c\u4e0d\u4ec5\u91cd\u5efa\u51e0\u4f55\u548c\u7eb9\u7406\uff0c\u8fd8\u663e\u5f0f\u6062\u590d\u72ec\u7acb\u7269\u4f53\u53ca\u5176\u59ff\u6001\uff0c\u5177\u6709\u6e38\u620f\u3001\u673a\u5668\u4eba\u4eff\u771f\u548c\u4ea4\u4e92\u5f0f\u5185\u5bb9\u751f\u6210\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "How far a pushed object slides depends on its mass and friction, which no single image reveals. Pretrained visual encoders are increasingly used as the perception front end of world models for manipulation, and their physical competence is assessed with perturbation benchmarks and linear probes, almost always in a clean, fixed-camera scene. We show that these assessments cannot distinguish an encoder that infers physics from one that does not. CALIPER (calibrate, then predict) is a direct test: an object of unknown mass and friction is struck twice at known speeds, a third strike is shown only up to the moment of contact, and a linear readout on frozen features must predict how far the object slides. Swapping in another object\u0027s calibration clips checks that the evidence is actually used. Across 2,000 simulated episodes and eight representations, from V-JEPA 2 to a randomly initialised ViT and raw pixels, calibration adds +0.50 R^2 and the swap removes it. Yet in the clean scene every representation lands within 0.02 R^2 of the ceiling set by true simulator state, because a fixed camera exposes the object\u0027s displacement directly in pixel coordinates. Resampling camera, lighting, and clutter for every clip spreads the same representations across 0.50 R^2; when the readout chooses a push speed for a goal distance, V-JEPA 2 misses by 4 mm and the random ViT by 20 mm, no better than ignoring the object. Linear probes track none of this: a change in frame aggregation moves a probe more than pretraining does, and erasing the probed mass direction from the same representation costs nothing in one scene and 0.35 R^2 in the other. Whether a benchmark can rank models is an empirical property, and we give three checks that establish it.", "arxiv_id": "2609.08250", "arxiv_url": "https://arxiv.org/abs/2609.08250", "authors": ["Aman Mehta", "Riya Baviskar"], "brief": "\u8bba\u6587\u63d0\u51fa CALIPER \u57fa\u51c6\uff1a\u901a\u8fc7\u4e24\u6b21\u5df2\u77e5\u649e\u51fb\u6821\u51c6\u7269\u4f53\u8d28\u91cf\u4e0e\u6469\u64e6\uff0c\u518d\u9884\u6d4b\u7b2c\u4e09\u6b21\u649e\u51fb\u540e\u7684\u6ed1\u884c\u8ddd\u79bb\u3002\u4f5c\u8005\u53d1\u73b0\u56fa\u5b9a\u76f8\u673a\u6d01\u51c0\u573a\u666f\u4f1a\u8ba9\u51e0\u4e4e\u6240\u6709\u89c6\u89c9\u8868\u5f81\u770b\u8d77\u6765\u540c\u6837\u597d\uff0c\u65e0\u6cd5\u533a\u5206\u771f\u5b9e\u7269\u7406\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08250", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728 2000 \u4e2a\u6a21\u62df episode\u30018 \u79cd\u8868\u5f81\u4e0a\uff0c\u6821\u51c6\u4fe1\u606f\u5e26\u6765 +0.50 R\u00b2\uff0c\u66ff\u6362\u9519\u8bef\u6821\u51c6\u7247\u6bb5\u4f1a\u6d88\u9664\u6536\u76ca\uff0c\u9a8c\u8bc1\u6a21\u578b\u786e\u5b9e\u9700\u8981\u5229\u7528\u7269\u7406\u8bc1\u636e\u3002", "\u56fa\u5b9a\u76f8\u673a\u6d01\u51c0\u573a\u666f\u4e2d\uff0cV-JEPA 2\u3001\u968f\u673a\u521d\u59cb\u5316 ViT\u3001\u539f\u59cb\u50cf\u7d20\u7b49\u8868\u5f81\u90fd\u63a5\u8fd1\u6a21\u62df\u5668\u771f\u5b9e\u72b6\u6001\u4e0a\u9650\uff0c\u4e3b\u8981\u56e0\u4e3a\u50cf\u7d20\u5750\u6807\u76f4\u63a5\u66b4\u9732\u4f4d\u79fb\u3002", "\u968f\u673a\u53d8\u5316\u76f8\u673a\u3001\u5149\u7167\u548c\u6742\u7269\u540e\uff0c\u5404\u8868\u5f81\u5dee\u8ddd\u6269\u5927\u5230\u7ea6 0.50 R\u00b2\uff1bV-JEPA 2 \u76ee\u6807\u8ddd\u79bb\u8bef\u5dee 4mm\uff0c\u968f\u673a ViT \u8bef\u5dee 20mm\uff0c\u51e0\u4e4e\u7b49\u540c\u5ffd\u7565\u7269\u4f53\u5c5e\u6027\u3002"], "keywords": ["\u7269\u7406\u63a8\u7406", "\u89c6\u89c9\u8868\u5f81", "\u673a\u5668\u4eba", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08250v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CALIPER: Clean Scenes Cannot Rank Physical Inference in Pretrained Visual Representations", "tldr": "\u6d01\u51c0\u573a\u666f\u65e0\u6cd5\u53ef\u9760\u8bc4\u4f30\u89c6\u89c9\u8868\u5f81\u7684\u7269\u7406\u63a8\u7406\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CALIPER \u57fa\u51c6\uff1a\u901a\u8fc7\u4e24\u6b21\u5df2\u77e5\u649e\u51fb\u6821\u51c6\u7269\u4f53\u8d28\u91cf\u4e0e\u6469\u64e6\uff0c\u518d\u9884\u6d4b\u7b2c\u4e09\u6b21\u649e\u51fb\u540e\u7684\u6ed1\u884c\u8ddd\u79bb\u3002\u4f5c\u8005\u53d1\u73b0\u56fa\u5b9a\u76f8\u673a\u6d01\u51c0\u573a\u666f\u4f1a\u8ba9\u51e0\u4e4e\u6240\u6709\u89c6\u89c9\u8868\u5f81\u770b\u8d77\u6765\u540c\u6837\u597d\uff0c\u65e0\u6cd5\u533a\u5206\u771f\u5b9e\u7269\u7406\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5e38\u7528\u7ebf\u6027\u63a2\u9488\u548c\u6d01\u51c0\u6270\u52a8\u57fa\u51c6\u53ef\u80fd\u4e25\u91cd\u9ad8\u4f30\u89c6\u89c9\u7f16\u7801\u5668\u7684\u7269\u7406\u7406\u89e3\u80fd\u529b\uff0c\u5e76\u7ed9\u51fa\u53ef\u9a8c\u8bc1\u57fa\u51c6\u662f\u5426\u80fd\u533a\u5206\u6a21\u578b\u7684\u68c0\u67e5\u65b9\u6cd5\uff0c\u5bf9\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b\u548c\u64cd\u4f5c\u611f\u77e5\u8bc4\u6d4b\u5177\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "Chunk-autoregressive video world models typically condition each generated chunk on one action. An action received during sampling must therefore wait for the next chunk, condition future solver evaluations on a state produced under the previous action, or trigger rollback that repeats completed evaluations. We introduce ActionSplice, an inference framework that formulates this problem as Counterfactual State Transport (CST). A lightweight corrector transports the interrupted backbone-native representation toward the matched state induced by the revised action at the same solver step. The world model and sampler remain frozen, and sampling resumes without replaying completed evaluations. The retargeting variant $\\mathrm{CST}*{R}$ updates the entire active chunk, while the temporal-splicing variant $\\mathrm{CST}*{T}$ preserves a temporal prefix and updates only the suffix. Across minWM-Wan Action2V and HY-WM1.5, $\\mathrm{CST}*{R}$ reduces rollback-relative LPIPS by 61.5% and 75.9% relative to direct condition swapping. $\\mathrm{CST}*{T}$ reduces suffix LPIPS by 56.1% and 77.5%, respectively, while providing $2.73\\times$ and $1.69\\times$ pixel-ready speedups over waiting. Under the HY-WorldPlay protocol, $\\mathrm{CST}_{R}$ obtains a PSNR of 25.66 dB, an SSIM of 0.6902, and an LPIPS of 0.1337 against the original rollout.", "arxiv_id": "2609.08230", "arxiv_url": "https://arxiv.org/abs/2609.08230", "authors": ["Pardis Taghavi", "Tingyu Guo", "Jonas Lossner", "Gaurav Pandey", "Reza Langari"], "brief": "\u8bba\u6587\u63d0\u51fa ActionSplice\uff0c\u5c06\u5206\u5757\u81ea\u56de\u5f52\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4e2d\u7684\u91c7\u6837\u4e2d\u9014\u52a8\u4f5c\u4fee\u6539\u8868\u8ff0\u4e3a\u53cd\u4e8b\u5b9e\u72b6\u6001\u4f20\u8f93\uff08CST\uff09\u95ee\u9898\u3002\u5b83\u7528\u8f7b\u91cf\u6821\u6b63\u5668\u5728\u4e0d\u51bb\u7ed3\u6a21\u578b\u548c\u91c7\u6837\u5668\u3001\u4e0d\u91cd\u7b97\u5df2\u5b8c\u6210\u6b65\u9aa4\u7684\u524d\u63d0\u4e0b\uff0c\u628a\u5f53\u524d\u8868\u793a\u8c03\u6574\u5230\u65b0\u52a8\u4f5c\u5bf9\u5e94\u72b6\u6001\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08230", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["CST_R \u91cd\u5b9a\u5411\u6574\u4e2a\u5f53\u524d\u751f\u6210\u5757\uff0cCST_T \u4fdd\u7559\u65f6\u95f4\u524d\u7f00\u3001\u4ec5\u66f4\u65b0\u540e\u7f00\uff0c\u517c\u987e\u4e00\u81f4\u6027\u4e0e\u54cd\u5e94\u901f\u5ea6\u3002", "\u5728 minWM-Wan Action2V \u548c HY-WM1.5 \u4e0a\uff0c\u76f8\u6bd4\u76f4\u63a5\u5207\u6362\u52a8\u4f5c\uff0cCST_R \u7684 rollback-relative LPIPS \u5206\u522b\u964d\u4f4e 61.5% \u548c 75.9%\u3002", "CST_T \u7684\u540e\u7f00 LPIPS \u5206\u522b\u964d\u4f4e 56.1% \u548c 77.5%\uff0c\u5e76\u76f8\u5bf9\u7b49\u5f85\u7b56\u7565\u5e26\u6765 2.73\u00d7 \u548c 1.69\u00d7 \u50cf\u7d20\u5c31\u7eea\u52a0\u901f\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u4ea4\u4e92\u5f0f\u63a7\u5236", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08230v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ActionSplice: In-Flight Action Editing for Interactive World Models", "tldr": "\u65e0\u9700\u56de\u6eda\u7684\u4ea4\u4e92\u5f0f\u89c6\u9891\u52a8\u4f5c\u5373\u65f6\u7f16\u8f91", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ActionSplice\uff0c\u5c06\u5206\u5757\u81ea\u56de\u5f52\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4e2d\u7684\u91c7\u6837\u4e2d\u9014\u52a8\u4f5c\u4fee\u6539\u8868\u8ff0\u4e3a\u53cd\u4e8b\u5b9e\u72b6\u6001\u4f20\u8f93\uff08CST\uff09\u95ee\u9898\u3002\u5b83\u7528\u8f7b\u91cf\u6821\u6b63\u5668\u5728\u4e0d\u51bb\u7ed3\u6a21\u578b\u548c\u91c7\u6837\u5668\u3001\u4e0d\u91cd\u7b97\u5df2\u5b8c\u6210\u6b65\u9aa4\u7684\u524d\u63d0\u4e0b\uff0c\u628a\u5f53\u524d\u8868\u793a\u8c03\u6574\u5230\u65b0\u52a8\u4f5c\u5bf9\u5e94\u72b6\u6001\u3002", "why_notable": "\u5b83\u89e3\u51b3\u4e86\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\u4e2d\u52a8\u4f5c\u8f93\u5165\u5ef6\u8fdf\u3001\u56de\u6eda\u91cd\u7b97\u6216\u72b6\u6001\u4e0d\u5339\u914d\u7684\u95ee\u9898\uff0c\u4f7f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u66f4\u9002\u5408\u5b9e\u65f6\u63a7\u5236\u548c\u4ea4\u4e92\u5f0f\u4eff\u771f\uff0c\u4e14\u65e0\u9700\u6539\u52a8\u539f\u6a21\u578b\u4e0e\u91c7\u6837\u5668\u3002"}, {"abstract": "Video generation models have recently attracted substantial attention for their ability to generate visually compelling videos, yet ensuring physically consistent and plausible dynamics still remains a fundamental challenge, driving a growing line of research on physical realism in video generation. To address this challenge, motivated by the fact that physical regularities are primarily encoded in motion patterns, we propose PhysFlow, a novel two-stage framework for improving the physical plausibility of generated videos by decomposing video generation into motion-aware optical flow generation followed by motion-conditioned appearance synthesis. Specifically, PhysFlow consists of a physics-aware optical-flow video generator called PA-Flow and a flow-guided video generator called FlowRender. During the first stage, PA-Flow employs a physics-aware attention module to model how motion attributes and material properties influence global motion and local deformation, respectively, and generates an optical flow video as an explicit representation of motion. In the second stage, FlowRender leverages the decoupled motion representation as guidance to synthesize realistic textures and appearances, ultimately producing the final physically plausible video. To further support model training with explicit physical supervision, we construct PhysVideo, a physics-based video dataset generated with a physics engine and 3D-GS rendering, containing 10K foreground objects and 50K realistic video sequences with annotations of motion and material properties. Extensive experiments demonstrate that our proposed PhysFlow generates videos with superior physical plausibility while maintaining high visual fidelity compared with existing methods.", "arxiv_id": "2609.08215", "arxiv_url": "https://arxiv.org/abs/2609.08215", "authors": ["Cong Wang", "Hanxin Zhu", "Yonglin Tian", "Jiayi Luo", "Ruiqi Song", "Boyi Sun", "Long Chen", "Zhibo Chen"], "brief": "\u8bba\u6587\u63d0\u51fa PhysFlow\uff0c\u4e24\u9636\u6bb5\u89c6\u9891\u751f\u6210\u6846\u67b6\uff1a\u5148\u751f\u6210\u7b26\u5408\u7269\u7406\u89c4\u5f8b\u7684\u5149\u6d41\u8fd0\u52a8\uff0c\u518d\u57fa\u4e8e\u5149\u6d41\u5408\u6210\u5916\u89c2\u7eb9\u7406\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 PhysVideo \u6570\u636e\u96c6\uff0c\u7528\u7269\u7406\u5f15\u64ce\u4e0e 3D-GS \u6e32\u67d3\u751f\u6210\u5e26\u8fd0\u52a8\u548c\u6750\u8d28\u6807\u6ce8\u7684\u89c6\u9891\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08215", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["PA-Flow \u901a\u8fc7\u7269\u7406\u611f\u77e5\u6ce8\u610f\u529b\u5efa\u6a21\u8fd0\u52a8\u5c5e\u6027\u3001\u6750\u8d28\u5c5e\u6027\u5bf9\u5168\u5c40\u8fd0\u52a8\u548c\u5c40\u90e8\u5f62\u53d8\u7684\u5f71\u54cd\uff0c\u663e\u5f0f\u751f\u6210\u5149\u6d41\u89c6\u9891\u3002", "FlowRender \u5c06\u89e3\u8026\u540e\u7684\u5149\u6d41\u4f5c\u4e3a\u8fd0\u52a8\u6761\u4ef6\uff0c\u5f15\u5bfc\u751f\u6210\u5177\u6709\u771f\u5b9e\u7eb9\u7406\u548c\u5916\u89c2\u7684\u6700\u7ec8\u89c6\u9891\u3002", "PhysVideo \u5305\u542b 1 \u4e07\u4e2a\u524d\u666f\u7269\u4f53\u30015 \u4e07\u6bb5\u771f\u5b9e\u611f\u89c6\u9891\u5e8f\u5217\uff0c\u5e76\u63d0\u4f9b\u8fd0\u52a8\u4e0e\u6750\u8d28\u5c5e\u6027\u6807\u6ce8\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7269\u7406\u4eff\u771f", "\u5149\u6d41", "\u53ef\u63a7\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08215v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PhysFlow: Physics-Aware Optical Flow for Motion Controllable Video Generation", "tldr": "\u7528\u7269\u7406\u611f\u77e5\u5149\u6d41\u63d0\u5347\u53ef\u63a7\u89c6\u9891\u751f\u6210\u771f\u5b9e\u611f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PhysFlow\uff0c\u4e24\u9636\u6bb5\u89c6\u9891\u751f\u6210\u6846\u67b6\uff1a\u5148\u751f\u6210\u7b26\u5408\u7269\u7406\u89c4\u5f8b\u7684\u5149\u6d41\u8fd0\u52a8\uff0c\u518d\u57fa\u4e8e\u5149\u6d41\u5408\u6210\u5916\u89c2\u7eb9\u7406\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 PhysVideo \u6570\u636e\u96c6\uff0c\u7528\u7269\u7406\u5f15\u64ce\u4e0e 3D-GS \u6e32\u67d3\u751f\u6210\u5e26\u8fd0\u52a8\u548c\u6750\u8d28\u6807\u6ce8\u7684\u89c6\u9891\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7269\u7406\u89c4\u5f8b\u663e\u5f0f\u6ce8\u5165\u89c6\u9891\u751f\u6210\u7684\u8fd0\u52a8\u8868\u793a\u4e2d\uff0c\u6709\u52a9\u4e8e\u7f13\u89e3\u5f53\u524d\u751f\u6210\u89c6\u9891\u201c\u770b\u8d77\u6765\u771f\u5b9e\u4f46\u8fd0\u52a8\u4e0d\u5408\u7406\u201d\u7684\u95ee\u9898\uff0c\u5e76\u63d0\u4f9b\u4e86\u53ef\u7528\u4e8e\u7269\u7406\u76d1\u7763\u8bad\u7ec3\u7684\u65b0\u6570\u636e\u96c6\u3002"}, {"abstract": "Scientific figures are the interface through which research claims are inspected and reused, but final published panels rarely expose the data or plotting code that produced them. Recovering this hidden provenance from pixels is therefore underdetermined. We introduce SciFigure2Code, an AI-reconstructed benchmark that instead evaluates presentation recovery: generating editable Python programs that preserve how a scientific panel is arranged and read. Role-specialized Codex agents generate, execute, visually refine, and audit silver-standard presentation programs that capture geometry, visual hierarchy, encodings, annotations, and typography without claiming to recover original measurements or author source code. This reconstruction-and-audit protocol turns final published panels into auditable reference packages; the resulting resource contains 6,740 reviewed panels and SciFigureBench, a balanced 337-panel test set across 31 chart subtypes, five domains, and three complexity levels. Across 14 zero-shot models in image-only and caption-assisted settings, execution, multi-component layouts, axes, legends, and scientific labels remain weak. Claude Opus 4.7 achieves the highest image-only Overall score, Claude Opus 4.6 leads caption-assisted reconstruction, and two-stage plan-then-code prompting improves Overall for all four tested models. SciFigure2Code provides an auditable testbed for agents that construct editable, visually faithful scientific figure presentations.", "arxiv_id": "2609.08155", "arxiv_url": "https://arxiv.org/abs/2609.08155", "authors": ["Wentao Li", "Yibo Wu", "Yizhe Chen", "Ruixuan Chen", "Jiangjie Qiu", "Yijun Li", "Zhao Leyi", "Xiaonan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa SciFigure2Code\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u8bba\u6587\u56fe\u8868\u7684\u201c\u5c55\u793a\u590d\u539f\u201d\u57fa\u51c6\uff0c\u8bc4\u4f30\u6a21\u578b\u4ece\u56fe\u50cf\u751f\u6210\u53ef\u7f16\u8f91 Python \u7ed8\u56fe\u7a0b\u5e8f\u7684\u80fd\u529b\u3002\u5b83\u4e0d\u8ffd\u6c42\u6062\u590d\u539f\u59cb\u6570\u636e\u6216\u4f5c\u8005\u6e90\u7801\uff0c\u800c\u662f\u91cd\u5efa\u56fe\u8868\u5e03\u5c40\u3001\u89c6\u89c9\u5c42\u7ea7\u3001\u7f16\u7801\u3001\u6807\u6ce8\u4e0e\u6392\u7248\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08155", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4f7f\u7528\u89d2\u8272\u5206\u5de5\u7684 Codex agents \u751f\u6210\u3001\u6267\u884c\u3001\u89c6\u89c9\u8fed\u4ee3\u548c\u5ba1\u8ba1\u94f6\u6807\u51c6\u7ed8\u56fe\u7a0b\u5e8f\uff0c\u5f62\u6210\u53ef\u8ffd\u6eaf\u53c2\u8003\u5305", "\u6570\u636e\u96c6\u5305\u542b 6,740 \u4e2a\u7ecf\u5ba1\u67e5\u9762\u677f\uff0c\u5e76\u6784\u5efa 337 \u9762\u677f\u7684 SciFigureBench\uff0c\u8986\u76d6 31 \u7c7b\u56fe\u8868\u30015 \u4e2a\u9886\u57df\u548c 3 \u4e2a\u590d\u6742\u5ea6\u7b49\u7ea7", "\u8bc4\u6d4b 14 \u4e2a\u96f6\u6837\u672c\u6a21\u578b\u53d1\u73b0\uff0c\u591a\u7ec4\u4ef6\u5e03\u5c40\u3001\u5750\u6807\u8f74\u3001\u56fe\u4f8b\u548c\u79d1\u5b66\u6807\u6ce8\u4ecd\u662f\u4e3b\u8981\u77ed\u677f\uff1b\u4e24\u9636\u6bb5\u201c\u5148\u89c4\u5212\u540e\u7f16\u7801\u201d\u63d0\u793a\u53ef\u7a33\u5b9a\u63d0\u5347\u8868\u73b0"], "keywords": ["\u591a\u6a21\u6001", "\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u79d1\u5b66\u56fe\u8868"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08155v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SciFigure2Code: An AI-Reconstructed Benchmark for Scientific Figure-to-Code", "tldr": "\u79d1\u5b66\u56fe\u8868\u8f6c\u53ef\u7f16\u8f91\u4ee3\u7801\u7684\u65b0\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SciFigure2Code\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u8bba\u6587\u56fe\u8868\u7684\u201c\u5c55\u793a\u590d\u539f\u201d\u57fa\u51c6\uff0c\u8bc4\u4f30\u6a21\u578b\u4ece\u56fe\u50cf\u751f\u6210\u53ef\u7f16\u8f91 Python \u7ed8\u56fe\u7a0b\u5e8f\u7684\u80fd\u529b\u3002\u5b83\u4e0d\u8ffd\u6c42\u6062\u590d\u539f\u59cb\u6570\u636e\u6216\u4f5c\u8005\u6e90\u7801\uff0c\u800c\u662f\u91cd\u5efa\u56fe\u8868\u5e03\u5c40\u3001\u89c6\u89c9\u5c42\u7ea7\u3001\u7f16\u7801\u3001\u6807\u6ce8\u4e0e\u6392\u7248\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u96be\u4ee5\u9a8c\u8bc1\u7684\u201c\u4ece\u50cf\u7d20\u6062\u590d\u539f\u59cb\u79d1\u5b66\u56fe\u8868 provenance\u201d\u8f6c\u5316\u4e3a\u53ef\u5ba1\u8ba1\u7684\u5c55\u793a\u590d\u539f\u4efb\u52a1\uff0c\u4e3a\u591a\u6a21\u6001\u4ee3\u7801\u751f\u6210\u4e0e\u79d1\u7814\u56fe\u8868\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u66f4\u73b0\u5b9e\u3001\u53ef\u6267\u884c\u7684\u8bc4\u6d4b\u5e73\u53f0\u3002"}, {"abstract": "Vision transformers (ViTs) have achieved remarkable generalization across visual domains, yet little is known about how they internally represent the structure of the world. To address this gap, we use Cross-Layer Transcoders (CLTs) to read concept circuits from ViTs: directed graphs whose nodes correspond to sparse, interpretable concepts and edges capture concept interactions across layers. Our method yields two complementary views of model behavior. The global concept circuit is input-invariant and can be recovered directly from learned cross-layer weights, exposing the reusable \"world knowledge\" encoded in the model. The instance concept circuit is input-dependent and identifies the concepts and pathways actually used for a specific prediction, enabling faithful example-level explanations. We demonstrate the utility of concept circuits in three ways: (1) Automatic spurious correlation discovery: leveraging the statistics of our global concept circuits to identify shortcut dependencies within the model. (2) Spurious correlation removal: intervening on the instance concept circuit to steer the model towards correct predictions. Empirical results show that our method outperforms existing counterparts by 11.0% on the Waterbird dataset. (3) Model comparison: contrasting the global concept circuits of different foundation models (e.g., CLIP vs. DINO) to reveal how supervision paradigms shape representational structure. Our code is available at https://github.com/deep-real/VisionCLT", "arxiv_id": "2609.09055", "arxiv_url": "https://arxiv.org/abs/2609.09055", "authors": ["Yanlin Chen", "Tang Li", "Xi Peng"], "brief": "\u8bba\u6587\u4f7f\u7528\u8de8\u5c42\u8f6c\u7801\u5668\uff08CLT\uff09\u4ece\u89c6\u89c9Transformer\u4e2d\u8bfb\u53d6\u201c\u6982\u5ff5\u7535\u8def\u201d\uff1a\u4ee5\u7a00\u758f\u53ef\u89e3\u91ca\u6982\u5ff5\u4e3a\u8282\u70b9\u3001\u8de8\u5c42\u4ea4\u4e92\u4e3a\u8fb9\u7684\u6709\u5411\u56fe\u3002\u5b83\u540c\u65f6\u63d0\u4f9b\u5168\u5c40\u7684\u6a21\u578b\u5185\u5728\u77e5\u8bc6\u7ed3\u6784\u89c6\u56fe\uff0c\u4ee5\u53ca\u9488\u5bf9\u5355\u4e2a\u6837\u672c\u9884\u6d4b\u7684\u5b9e\u4f8b\u7ea7\u89e3\u91ca\u8def\u5f84\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09055", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u5168\u5c40\u6982\u5ff5\u7535\u8def\uff0c\u53ef\u76f4\u63a5\u4ece\u8de8\u5c42\u6743\u91cd\u6062\u590d\uff0c\u63ed\u793a\u6a21\u578b\u4e2d\u53ef\u590d\u7528\u7684\u8f93\u5165\u65e0\u5173\u201c\u4e16\u754c\u77e5\u8bc6\u201d\u3002", "\u63d0\u51fa\u5b9e\u4f8b\u6982\u5ff5\u7535\u8def\uff0c\u5b9a\u4f4d\u7279\u5b9a\u9884\u6d4b\u4e2d\u5b9e\u9645\u4f7f\u7528\u7684\u6982\u5ff5\u4e0e\u63a8\u7406\u8def\u5f84\uff0c\u652f\u6301\u66f4\u5fe0\u5b9e\u7684\u6837\u672c\u7ea7\u89e3\u91ca\u3002", "\u53ef\u7528\u4e8e\u81ea\u52a8\u53d1\u73b0\u548c\u79fb\u9664\u4f2a\u76f8\u5173\uff0c\u5728 Waterbird \u6570\u636e\u96c6\u4e0a\u6bd4\u5df2\u6709\u65b9\u6cd5\u9ad8\u51fa 11.0%\uff0c\u5e76\u80fd\u6bd4\u8f83 CLIP \u4e0e DINO \u7b49\u57fa\u7840\u6a21\u578b\u7684\u8868\u5f81\u5dee\u5f02\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u89c6\u89c9Transformer", "\u6982\u5ff5\u7535\u8def", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09055v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "\"World Knowledge\" in the Weights: Reading Concept Circuits of Vision Transformers", "tldr": "\u7528\u6982\u5ff5\u7535\u8def\u89e3\u8bfbViT\u6743\u91cd\u4e2d\u7684\u4e16\u754c\u77e5\u8bc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4f7f\u7528\u8de8\u5c42\u8f6c\u7801\u5668\uff08CLT\uff09\u4ece\u89c6\u89c9Transformer\u4e2d\u8bfb\u53d6\u201c\u6982\u5ff5\u7535\u8def\u201d\uff1a\u4ee5\u7a00\u758f\u53ef\u89e3\u91ca\u6982\u5ff5\u4e3a\u8282\u70b9\u3001\u8de8\u5c42\u4ea4\u4e92\u4e3a\u8fb9\u7684\u6709\u5411\u56fe\u3002\u5b83\u540c\u65f6\u63d0\u4f9b\u5168\u5c40\u7684\u6a21\u578b\u5185\u5728\u77e5\u8bc6\u7ed3\u6784\u89c6\u56fe\uff0c\u4ee5\u53ca\u9488\u5bf9\u5355\u4e2a\u6837\u672c\u9884\u6d4b\u7684\u5b9e\u4f8b\u7ea7\u89e3\u91ca\u8def\u5f84\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aViT\u5185\u90e8\u8868\u5f81\u4ece\u7279\u5f81\u53ef\u89c6\u5316\u63a8\u8fdb\u5230\u53ef\u64cd\u4f5c\u7684\u6982\u5ff5\u56e0\u679c\u8def\u5f84\u5c42\u9762\uff0c\u4e0d\u4ec5\u80fd\u89e3\u91ca\u6a21\u578b\u4e3a\u4f55\u9884\u6d4b\uff0c\u8fd8\u80fd\u5e72\u9884\u4f2a\u76f8\u5173\u5e76\u6bd4\u8f83\u4e0d\u540c\u8bad\u7ec3\u8303\u5f0f\u5851\u9020\u51fa\u7684\u77e5\u8bc6\u7ed3\u6784\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u53ef\u89e3\u91ca\u6027\u4e0e\u6a21\u578b\u8bca\u65ad\u4ef7\u503c\u3002"}, {"abstract": "Implicit neural representation (INR) has achieved remarkable progress in novel view synthesis and image/video coding in recent years.Compared to conventional end-to-end image codecs, INR-based compressors demonstrate significant advantages in decoding complexity. However, their practical application has been hindered by the inferior encoding speed and underutilized decoding efficiency.In this work, we propose a feedforward INR image coding architecture, Practical INR Image Codec (PIC), that computes all the necessary information for INR network in a single forward pass, achieving an encoding speed of 20 FPS. Additionally, we implement a highl
