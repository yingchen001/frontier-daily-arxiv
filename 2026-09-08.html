7ed3\u5408\u5b66\u4e60\u5f0f\u6df1\u5ea6\u4f30\u8ba1\u7684\u91cd\u6295\u5f71\u7ea6\u675f\uff0c\u5728\u906e\u6321\u3001\u5149\u7167\u53d8\u5316\u548c\u5f31\u7eb9\u7406\u573a\u666f\u4e0b\u6bd4\u4f20\u7edf\u5355\u76ee VINS \u66f4\u7a33\u5065\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present GOLF, the first-place solution to the SHOW3D Interaction Field Estimation Challenge at HANDS@ECCV 2026. Given synchronized egocentric stereo views, the task is to predict a 3D vector from each of 21 hand joints to the closest point on the manipulated object. GOLF combines dense global context, locally sampled hand/object evidence, and common-frame Pl\u00fccker-ray geometry. We adapt DINOv3 ViT-H+/16 with LoRA and trainable LayerNorm parameters, then jointly decode both interaction fields. Our primary model achieves an official score of 27.61 and a mean ADE of 27.96 mm on the hidden test set. An equal-weight ensemble with a complementary directly fine-tuned variant improves these results to an official score of 27.47 and a mean ADE of 27.82 mm, securing first place.", "arxiv_id": "2609.08607", "arxiv_url": "https://arxiv.org/abs/2609.08607", "authors": ["Minqiang Zou", "Riqiang Jin", "Zhi Lv", "Dong Luo", "Lianghai Tian", "Zhenyu Zhao", "Qi Xu", "Tong Wu", "Mochen Yu", "Yao Tang"], "brief": "GOLF \u9762\u5411\u81ea\u6211\u4e2d\u5fc3\u53cc\u76ee\u89c6\u89d2\u7684\u624b\u7269\u4ea4\u4e92\u573a\u4f30\u8ba1\uff0c\u7ed3\u5408\u5168\u5c40\u4e0a\u4e0b\u6587\u3001\u5c40\u90e8\u624b/\u7269\u4f53\u8bc1\u636e\u4e0e\u7edf\u4e00\u5750\u6807\u7cfb\u4e0b\u7684 Pl\u00fccker \u5c04\u7ebf\u51e0\u4f55\uff0c\u5e76\u57fa\u4e8e DINOv3 \u8fdb\u884c\u9ad8\u6548\u9002\u914d\u3002\u8be5\u65b9\u6cd5\u5728 SHOW3D Interaction Field Estimation Challenge \u4e2d\u53d6\u5f97\u7b2c\u4e00\u540d\uff0c\u96c6\u6210\u540e\u9690\u85cf\u6d4b\u8bd5\u96c6 mean ADE \u8fbe\u5230 27.82 mm\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08607", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u89c6\u89c9", "\u624b\u7269\u4ea4\u4e92", "\u53cc\u76ee\u89c6\u89c9", "\u51e0\u4f55\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08607v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GOLF: Global Observation with Local Focus for Calibration-Aware Stereo Interaction Field Estimation", "tldr": "GOLF \u9762\u5411\u81ea\u6211\u4e2d\u5fc3\u53cc\u76ee\u89c6\u89d2\u7684\u624b\u7269\u4ea4\u4e92\u573a\u4f30\u8ba1\uff0c\u7ed3\u5408\u5168\u5c40\u4e0a\u4e0b\u6587\u3001\u5c40\u90e8\u624b/\u7269\u4f53\u8bc1\u636e\u4e0e\u7edf\u4e00\u5750\u6807\u7cfb\u4e0b\u7684 Pl\u00fccker \u5c04\u7ebf\u51e0\u4f55\uff0c\u5e76\u57fa\u4e8e DINOv3 \u8fdb\u884c\u9ad8\u6548\u9002\u914d\u3002\u8be5\u65b9\u6cd5\u5728 SHOW3D Interaction Field Estimation Challenge \u4e2d\u53d6\u5f97\u7b2c\u4e00\u540d\uff0c\u96c6\u6210\u540e\u9690\u85cf\u6d4b\u8bd5\u96c6 mean ADE \u8fbe\u5230 27.82 mm\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Microscopic image analysis has long been recognized as a promising approach for monitoring activated sludge. In recent years, deep learning-based image analysis has been increasingly adopted in this field because of its high performance. However, previous studies on microscopic image analysis of activated sludge have rarely explored transformer-based models or self-supervised foundation models and have instead relied on CNNs and supervised ImageNet pretraining. In addition, previous studies often downsampled image sizes, but the effects of downsampling have not been sufficiently investigated, and the relationship between downsampling strategies and image analysis performance remains unclear. Furthermore, no study has quantitatively compared deep learning performance with quantitative image analysis (QIA), which was widely used before the emergence of deep learning. In this study, to examine how model architecture and learning strategies affect performance in microscopic image analysis of activated sludge and to quantitatively determine whether deep learning outperforms QIA, we prepared three types of activated sludge samples, classified their microscopic images, and evaluated classification accuracy. Our results showed that transformer-based architectures and alternative pretraining methods were effective in terms of classification accuracy. Our downsampling analysis showed that using overly small images reduced accuracy, but increasing image size beyond a certain point did not improve it further. In addition, the analysis indicated that, to achieve high classification accuracy, maintaining the field of view was a more effective downsampling strategy than maintaining resolution. Finally, our comparison between deep learning and QIA showed that deep learning outperformed QIA in terms of accuracy.", "arxiv_id": "2609.08570", "arxiv_url": "https://arxiv.org/abs/2609.08570", "authors": ["Suguru Hakoshima", "Tomohiro Tobino", "Fumiyuki Nakajima"], "brief": "\u672c\u6587\u7814\u7a76\u6d3b\u6027\u6c61\u6ce5\u663e\u5fae\u56fe\u50cf\u5206\u7c7b\u4e2d\u6a21\u578b\u67b6\u6784\u3001\u9884\u8bad\u7ec3\u65b9\u5f0f\u548c\u4e0b\u91c7\u6837\u7b56\u7565\u7684\u5f71\u54cd\uff0c\u5e76\u4e0e\u4f20\u7edf\u5b9a\u91cf\u56fe\u50cf\u5206\u6790\uff08QIA\uff09\u8fdb\u884c\u5b9a\u91cf\u6bd4\u8f83\u3002\u7ed3\u679c\u663e\u793a\uff0cTransformer \u67b6\u6784\u548c\u66ff\u4ee3\u9884\u8bad\u7ec3\u65b9\u6cd5\u80fd\u63d0\u5347\u5206\u7c7b\u51c6\u786e\u7387\uff1b\u56fe\u50cf\u8fc7\u5c0f\u4f1a\u964d\u7cbe\u5ea6\uff0c\u4f46\u8d85\u8fc7\u4e00\u5b9a\u5c3a\u5bf8\u6536\u76ca\u6709\u9650\uff0c\u4fdd\u6301\u89c6\u91ce\u6bd4\u4fdd\u6301\u5206\u8fa8\u7387\u66f4\u91cd\u8981\u3002\u6df1\u5ea6\u5b66\u4e60\u6574\u4f53\u51c6\u786e\u7387\u4f18\u4e8e QIA\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08570", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u663e\u5fae\u56fe\u50cf", "Transformer", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08570v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Effects of model architecture and learning strategies on deep learning-based recognition of activated sludge microscopic images and comparison with quantitative image analysis", "tldr": "\u672c\u6587\u7814\u7a76\u6d3b\u6027\u6c61\u6ce5\u663e\u5fae\u56fe\u50cf\u5206\u7c7b\u4e2d\u6a21\u578b\u67b6\u6784\u3001\u9884\u8bad\u7ec3\u65b9\u5f0f\u548c\u4e0b\u91c7\u6837\u7b56\u7565\u7684\u5f71\u54cd\uff0c\u5e76\u4e0e\u4f20\u7edf\u5b9a\u91cf\u56fe\u50cf\u5206\u6790\uff08QIA\uff09\u8fdb\u884c\u5b9a\u91cf\u6bd4\u8f83\u3002\u7ed3\u679c\u663e\u793a\uff0cTransformer \u67b6\u6784\u548c\u66ff\u4ee3\u9884\u8bad\u7ec3\u65b9\u6cd5\u80fd\u63d0\u5347\u5206\u7c7b\u51c6\u786e\u7387\uff1b\u56fe\u50cf\u8fc7\u5c0f\u4f1a\u964d\u7cbe\u5ea6\uff0c\u4f46\u8d85\u8fc7\u4e00\u5b9a\u5c3a\u5bf8\u6536\u76ca\u6709\u9650\uff0c\u4fdd\u6301\u89c6\u91ce\u6bd4\u4fdd\u6301\u5206\u8fa8\u7387\u66f4\u91cd\u8981\u3002\u6df1\u5ea6\u5b66\u4e60\u6574\u4f53\u51c6\u786e\u7387\u4f18\u4e8e QIA\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Despite recent advances in surgical vision-language models (VLMs), temporal reasoning remains limited because existing supervision is largely frame-centric. Frame-level scene graphs (SGs) have proven effective in providing structured representations of surgical environments but do not explicitly model the dynamics of surgical workflows. To explicitly model how surgical states evolve across time, we introduce a multi-level structured temporal supervision methodology that augments frame-level surgical SGs with object-level continuity, event-level interaction continuity, and procedure-level connectivity. We then execute temporal queries over the resulting spatio-temporal scene graphs (STSGs) to generate evidence-grounded question-answer pairs, which together form the STSG-VQA benchmark. Each question is linked to the temporal interval and STSG evidence used to derive its reference answer, enabling traceable verification. The benchmark contains 18,458 question-answer pairs across seven temporal categories. Fine-tuning Qwen3-VL-4B and Hulu-Med-4B with STSG-derived supervision improves question-level micro accuracy by 24.39 and 19.56 percentage points over their zero-shot baselines and by 16.50 and 14.25 points over static scene-graph supervision, respectively. These gains span all temporal categories, indicating that STSG-derived supervision helps surgical VLMs reason over temporally grounded interactions rather than isolated frames. The code and dataset will be made publicly available upon acceptance.", "arxiv_id": "2609.08543", "arxiv_url": "https://arxiv.org/abs/2609.08543", "authors": ["Jing Li", "Duygu Sarikaya"], "brief": "\u8bba\u6587\u63d0\u51fa STSG-VQA\uff0c\u5c06\u624b\u672f\u573a\u666f\u56fe\u6269\u5c55\u4e3a\u65f6\u7a7a\u573a\u666f\u56fe\uff0c\u901a\u8fc7\u5bf9\u8c61\u8fde\u7eed\u6027\u3001\u4e8b\u4ef6\u4ea4\u4e92\u8fde\u7eed\u6027\u548c\u6d41\u7a0b\u8fde\u63a5\u6027\u663e\u5f0f\u5efa\u6a21\u624b\u672f\u72b6\u6001\u968f\u65f6\u95f4\u7684\u53d8\u5316\uff0c\u5e76\u751f\u6210\u5e26\u8bc1\u636e\u6eaf\u6e90\u7684\u65f6\u5e8f\u95ee\u7b54\u57fa\u51c6\u3002\u57fa\u4e8e\u8be5\u76d1\u7763\u5fae\u8c03 Qwen3-VL-4B \u548c Hulu-Med-4B\uff0c\u76f8\u6bd4\u96f6\u6837\u672c\u548c\u9759\u6001\u573a\u666f\u56fe\u76d1\u7763\u5747\u663e\u8457\u63d0\u5347\u65f6\u5e8f\u95ee\u7b54\u51c6\u786e\u7387\uff0c\u8bf4\u660e\u5176\u80fd\u589e\u5f3a\u624b\u672f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u65f6\u95f4\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08543", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u95ee\u7b54", "\u65f6\u7a7a\u573a\u666f\u56fe", "\u533b\u7597\u5f71\u50cf", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08543v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "STSG-VQA: Evidence-Grounded Temporal Question Answering from Surgical Spatio-Temporal Scene Graphs", "tldr": "\u8bba\u6587\u63d0\u51fa STSG-VQA\uff0c\u5c06\u624b\u672f\u573a\u666f\u56fe\u6269\u5c55\u4e3a\u65f6\u7a7a\u573a\u666f\u56fe\uff0c\u901a\u8fc7\u5bf9\u8c61\u8fde\u7eed\u6027\u3001\u4e8b\u4ef6\u4ea4\u4e92\u8fde\u7eed\u6027\u548c\u6d41\u7a0b\u8fde\u63a5\u6027\u663e\u5f0f\u5efa\u6a21\u624b\u672f\u72b6\u6001\u968f\u65f6\u95f4\u7684\u53d8\u5316\uff0c\u5e76\u751f\u6210\u5e26\u8bc1\u636e\u6eaf\u6e90\u7684\u65f6\u5e8f\u95ee\u7b54\u57fa\u51c6\u3002\u57fa\u4e8e\u8be5\u76d1\u7763\u5fae\u8c03 Qwen3-VL-4B \u548c Hulu-Med-4B\uff0c\u76f8\u6bd4\u96f6\u6837\u672c\u548c\u9759\u6001\u573a\u666f\u56fe\u76d1\u7763\u5747\u663e\u8457\u63d0\u5347\u65f6\u5e8f\u95ee\u7b54\u51c6\u786e\u7387\uff0c\u8bf4\u660e\u5176\u80fd\u589e\u5f3a\u624b\u672f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u65f6\u95f4\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Out-of-distribution (OOD) detection is crucial for safe deployment of medical AI systems, where domain shifts arise across institutions, acquisition protocols, and patient populations. VLMs enable zero-shot OOD detection by embedding images into a language-aligned latent space, where cross-modal similarity serves as a non-parametric confidence signal for identifying in-distribution samples. Yet existing methods rely almost exclusively on final-layer embeddings, implicitly assuming that the deepest representations are universally optimal. We first show that this assumption does not hold in medical imaging: intermediate layers provide complementary OOD signals, and the optimal representational depth depends on the respective image modality. While prior work selects layer combinations via entropy minimization of normalized histograms, we demonstrate that single-resolution entropy estimation is highly sensitive to binning choices, leading to performance variations of up to 19.3% AUROC. To address this instability, we propose a multi-resolution entropy estimation strategy that aggregates histogram statistics across multiple discretization scales, enabling robust and stable intermediate-layer selection. Across two medical OOD benchmarks, namely MIDOG and OASIS, covering distinct imaging modalities, diverse shift types, and different VLM backbones, our method consistently outperforms state-of-the-art approaches, offering a lightweight and stable solution for zero-shot OOD detection.", "arxiv_id": "2609.08524", "arxiv_url": "https://arxiv.org/abs/2609.08524", "authors": ["Shyam Nandan Rai", "Francesco Di Salvo", "Sebastian Doerrich", "Christian Ledig"], "brief": "\u8bba\u6587\u6307\u51fa\u533b\u5b66\u5f71\u50cf\u4e2d VLM \u7684\u6700\u7ec8\u5c42\u8868\u793a\u5e76\u4e0d\u603b\u662f\u6700\u9002\u5408\u96f6\u6837\u672c OOD \u68c0\u6d4b\uff0c\u4e2d\u95f4\u5c42\u80fd\u63d0\u4f9b\u4e92\u8865\u4fe1\u53f7\u4e14\u6700\u4f18\u5c42\u968f\u6a21\u6001\u53d8\u5316\u3002\u4f5c\u8005\u63d0\u51fa\u591a\u5206\u8fa8\u7387\u71b5\u4f30\u8ba1\u6765\u7a33\u5b9a\u9009\u62e9\u4e2d\u95f4\u5c42\uff0c\u907f\u514d\u5355\u4e00\u76f4\u65b9\u56fe\u5206\u7bb1\u5e26\u6765\u7684\u5927\u5e45\u6ce2\u52a8\uff0c\u5e76\u5728 MIDOG\u3001OASIS \u7b49\u533b\u5b66 OOD \u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08524", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "OOD\u68c0\u6d4b", "\u533b\u5b66\u5f71\u50cf", "\u96f6\u6837\u672c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08524v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Layer Selection in VLMs for Zero-Shot OOD Detection via Multi-Resolution Entropy Estimation", "tldr": "\u8bba\u6587\u6307\u51fa\u533b\u5b66\u5f71\u50cf\u4e2d VLM \u7684\u6700\u7ec8\u5c42\u8868\u793a\u5e76\u4e0d\u603b\u662f\u6700\u9002\u5408\u96f6\u6837\u672c OOD \u68c0\u6d4b\uff0c\u4e2d\u95f4\u5c42\u80fd\u63d0\u4f9b\u4e92\u8865\u4fe1\u53f7\u4e14\u6700\u4f18\u5c42\u968f\u6a21\u6001\u53d8\u5316\u3002\u4f5c\u8005\u63d0\u51fa\u591a\u5206\u8fa8\u7387\u71b5\u4f30\u8ba1\u6765\u7a33\u5b9a\u9009\u62e9\u4e2d\u95f4\u5c42\uff0c\u907f\u514d\u5355\u4e00\u76f4\u65b9\u56fe\u5206\u7bb1\u5e26\u6765\u7684\u5927\u5e45\u6ce2\u52a8\uff0c\u5e76\u5728 MIDOG\u3001OASIS \u7b49\u533b\u5b66 OOD \u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sign language video generation demands precise hand and facial articulation, yet modern video diffusion models, trained predominantly on spoken-language video, produce artifacts that render signing unintelligible. We propose SignRefine, a sign language video generation model that produces comprehensible signing from 2D keypoint conditioning alone, generalizing across appearances and visual conditions. Our approach builds on a pretrained video diffusion transformer and introduces local adapters with spatial grounding to selectively refine hand and face regions, steering the strong base model\u0027s prior toward accurate articulation. To enable this work and support broader sign language research, we present NVSign, a large-scale dataset of video content natively produced in sign language, offering diverse signer appearances, environments, and natural conversational settings. Trained on this data, our model shows up to 30% improvement in hand pose precision metrics over the strongest baseline and is preferred by sign language users for visual quality and comprehensibility in more than 80% of comparisons.", "arxiv_id": "2609.08496", "arxiv_url": "https://arxiv.org/abs/2609.08496", "authors": ["Anton Pelykh", "Edward Fish", "Ozge Mercanoglu Sincan", "Richard Bowden"], "brief": "\u672c\u6587\u63d0\u51fa SignRefine\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563 Transformer \u9002\u914d\u5230\u624b\u8bed\u89c6\u9891\u751f\u6210\uff0c\u4ec5\u4f9d\u8d56 2D \u5173\u952e\u70b9\u6761\u4ef6\u5373\u53ef\u751f\u6210\u53ef\u7406\u89e3\u7684\u624b\u8bed\u3002\u65b9\u6cd5\u901a\u8fc7\u5e26\u7a7a\u95f4\u5b9a\u4f4d\u7684\u5c40\u90e8\u9002\u914d\u5668\u91cd\u70b9\u4f18\u5316\u624b\u90e8\u548c\u9762\u90e8\u533a\u57df\uff0c\u5e76\u53d1\u5e03\u5927\u89c4\u6a21\u624b\u8bed\u6570\u636e\u96c6 NVSign\uff1b\u5b9e\u9a8c\u4e2d\u624b\u90e8\u59ff\u6001\u7cbe\u5ea6\u6700\u9ad8\u63d0\u5347 30%\uff0c\u7528\u6237\u504f\u597d\u7387\u8d85\u8fc7 80%\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08496", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u624b\u8bed\u751f\u6210", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08496v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SignRefine: Adapting Foundational Video Models for Sign Language Generation", "tldr": "\u672c\u6587\u63d0\u51fa SignRefine\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563 Transformer \u9002\u914d\u5230\u624b\u8bed\u89c6\u9891\u751f\u6210\uff0c\u4ec5\u4f9d\u8d56 2D \u5173\u952e\u70b9\u6761\u4ef6\u5373\u53ef\u751f\u6210\u53ef\u7406\u89e3\u7684\u624b\u8bed\u3002\u65b9\u6cd5\u901a\u8fc7\u5e26\u7a7a\u95f4\u5b9a\u4f4d\u7684\u5c40\u90e8\u9002\u914d\u5668\u91cd\u70b9\u4f18\u5316\u624b\u90e8\u548c\u9762\u90e8\u533a\u57df\uff0c\u5e76\u53d1\u5e03\u5927\u89c4\u6a21\u624b\u8bed\u6570\u636e\u96c6 NVSign\uff1b\u5b9e\u9a8c\u4e2d\u624b\u90e8\u59ff\u6001\u7cbe\u5ea6\u6700\u9ad8\u63d0\u5347 30%\uff0c\u7528\u6237\u504f\u597d\u7387\u8d85\u8fc7 80%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Observing objects grasped by a robot hand is challenging due to severe visual occlusions. Although in-hand manipulation can expose hidden surfaces, existing approaches often rely on predefined or open-loop reorientation strategies that do not explicitly target under-observed regions. We propose AURORA, an active 3D reconstruction framework that closes the loop between online object-centric reconstruction and in-hand reorientation. At its core, Ray-GPIS estimates direction-wise reconstruction uncertainty along candidate viewing rays and selects next-best-view targets using an uncertainty--novelty objective, which are realized through an axis-conditioned in-hand rotation policy. The resulting RGB-D observations are fused incrementally using CAD-free 6D pose tracking and lightweight geometric reconstruction. Experiments demonstrate that AURORA improves reconstruction quality and information-acquisition efficiency over non-active rotation strategies, while Ray-GPIS also outperforms active view-planning baselines in reconstruction performance, action-ranking quality, and planning efficiency. Targeted ablations further validate its robustness to hand occlusion and pose errors. The project webpage is available at https://aurorahand.github.io/", "arxiv_id": "2609.08493", "arxiv_url": "https://arxiv.org/abs/2609.08493", "authors": ["Feiyu Zhao", "Yuetong Li", "Chenxi Xiao"], "brief": "AURORA \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u624b\u5185\u7269\u4f53\u7684\u4e3b\u52a8\u4e09\u7ef4\u91cd\u5efa\u6846\u67b6\uff0c\u901a\u8fc7\u5728\u7ebf\u4f30\u8ba1\u4e0d\u540c\u89c6\u89d2\u7684\u91cd\u5efa\u4e0d\u786e\u5b9a\u6027\uff0c\u4e3b\u52a8\u9009\u62e9\u4e0b\u4e00\u6700\u4f73\u89c2\u5bdf\u65b9\u5411\u5e76\u9a71\u52a8\u624b\u5185\u65cb\u8f6c\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u76f8\u6bd4\u975e\u4e3b\u52a8\u65cb\u8f6c\u548c\u73b0\u6709\u4e3b\u52a8\u89c6\u89d2\u89c4\u5212\u65b9\u6cd5\uff0c\u5b83\u80fd\u66f4\u9ad8\u6548\u5730\u83b7\u53d6\u4fe1\u606f\u5e76\u63d0\u5347\u91cd\u5efa\u8d28\u91cf\uff0c\u5bf9\u906e\u6321\u548c\u4f4d\u59ff\u8bef\u5dee\u4e5f\u8f83\u9c81\u68d2\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08493", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u4e09\u7ef4\u91cd\u5efa", "\u4e3b\u52a8\u611f\u77e5", "\u89c6\u89d2\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08493v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AURORA: Active Uncertainty-Driven Re-Orientation for In-Hand Reconstruction", "tldr": "AURORA \u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u624b\u5185\u7269\u4f53\u7684\u4e3b\u52a8\u4e09\u7ef4\u91cd\u5efa\u6846\u67b6\uff0c\u901a\u8fc7\u5728\u7ebf\u4f30\u8ba1\u4e0d\u540c\u89c6\u89d2\u7684\u91cd\u5efa\u4e0d\u786e\u5b9a\u6027\uff0c\u4e3b\u52a8\u9009\u62e9\u4e0b\u4e00\u6700\u4f73\u89c2\u5bdf\u65b9\u5411\u5e76\u9a71\u52a8\u624b\u5185\u65cb\u8f6c\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u76f8\u6bd4\u975e\u4e3b\u52a8\u65cb\u8f6c\u548c\u73b0\u6709\u4e3b\u52a8\u89c6\u89d2\u89c4\u5212\u65b9\u6cd5\uff0c\u5b83\u80fd\u66f4\u9ad8\u6548\u5730\u83b7\u53d6\u4fe1\u606f\u5e76\u63d0\u5347\u91cd\u5efa\u8d28\u91cf\uff0c\u5bf9\u906e\u6321\u548c\u4f4d\u59ff\u8bef\u5dee\u4e5f\u8f83\u9c81\u68d2\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Gaussian splats provide a fast, high-fidelity representation for 3D objects but are often constructed from incomplete input data in practice, leaving missing regions. Existing completion methods either do not preserve the original splats or require scarcely available 3D training data. We propose GSComplete, which combines 3D generation based on Score Distillation Sampling with a novel preservation loss that encourages the original splats to be preserved where they should be visible. This effectively completes the Gaussian splat object using only 2D diffusion priors while fully preserving existing splats and generating new splats only in missing regions, without occluding the input. To evaluate our approach, we introduce a new dataset of partial Gaussian splat objects and show that GSComplete achieves significantly more accurate preservation of the input than existing methods with comparable plausibility of the completed result. Our code and dataset will be made available upon acceptance.", "arxiv_id": "2609.08449", "arxiv_url": "https://arxiv.org/abs/2609.08449", "authors": ["Elias Brugger", "Philipp Erler", "Stefan Ohrhallinger", "Paul Guerrero"], "brief": "GSComplete \u9488\u5bf9\u8f93\u5165\u4e0d\u5b8c\u6574\u7684 3D Gaussian Splat \u7269\u4f53\u8865\u5168\u95ee\u9898\uff0c\u5229\u7528 2D \u6269\u6563\u6a21\u578b\u5148\u9a8c\u548c Score Distillation Sampling \u751f\u6210\u7f3a\u5931\u533a\u57df\u3002\u65b9\u6cd5\u5f15\u5165\u4fdd\u7559\u635f\u5931\uff0c\u5728\u8865\u5168\u65f6\u5c3d\u91cf\u4fdd\u6301\u539f\u6709 splats \u4e0d\u88ab\u906e\u6321\u6216\u4fee\u6539\uff0c\u5e76\u5728\u65b0\u6784\u5efa\u7684\u6570\u636e\u96c6\u4e0a\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u663e\u8457\u63d0\u5347\u8f93\u5165\u4fdd\u771f\u5ea6\uff0c\u8865\u5168\u5408\u7406\u6027\u76f8\u5f53\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08449", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u9ad8\u65af\u6cfc\u6e85", "\u6269\u6563\u6a21\u578b", "\u7269\u4f53\u8865\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08449v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GSComplete: Gaussian Splat Completion with 2D Diffusion Priors", "tldr": "GSComplete \u9488\u5bf9\u8f93\u5165\u4e0d\u5b8c\u6574\u7684 3D Gaussian Splat \u7269\u4f53\u8865\u5168\u95ee\u9898\uff0c\u5229\u7528 2D \u6269\u6563\u6a21\u578b\u5148\u9a8c\u548c Score Distillation Sampling \u751f\u6210\u7f3a\u5931\u533a\u57df\u3002\u65b9\u6cd5\u5f15\u5165\u4fdd\u7559\u635f\u5931\uff0c\u5728\u8865\u5168\u65f6\u5c3d\u91cf\u4fdd\u6301\u539f\u6709 splats \u4e0d\u88ab\u906e\u6321\u6216\u4fee\u6539\uff0c\u5e76\u5728\u65b0\u6784\u5efa\u7684\u6570\u636e\u96c6\u4e0a\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u663e\u8457\u63d0\u5347\u8f93\u5165\u4fdd\u771f\u5ea6\uff0c\u8865\u5168\u5408\u7406\u6027\u76f8\u5f53\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multiple Instance Learning (MIL) is widely used for weakly supervised learning, particularly in digital pathology, where fine-grained annotations are costly. Most MIL methods aggregate instance features via attention mechanisms. However, attention weights do not always faithfully reflect instance importance and may focus on spuriously correlated regions. In this work, we propose CAR-MIL, a framework that explicitly guides attention learning through a counterfactual attention regularization objective inspired by counterfactual explanations. Built on a standard attention-based MIL architecture, our approach introduces a lightweight counterfactual attention branch trained to produce an alternative prediction while remaining close to the factual attention distribution. This encourages prediction changes to arise from minimal, structured redistributions of attention, leading to more informative evidence allocation. The resulting factual and counterfactual attention maps capture complementary evidence: the former highlights regions supporting the prediction, while the latter reveals regions whose reweighting would challenge it. We evaluate our method on synthetic MIL benchmarks with instance-level ground truth enabling controlled analysis of attention behavior and on five digital pathology datasets across four tasks. CAR-MIL maintains competitive classification performance, with the largest gains observed on more challenging tasks, while improving attention reliability, demonstrating the benefits of integrating counterfactual explainability reasoning into attention learning. Code is available at: https://github.com/ImaneCR/CAR-MIL/.", "arxiv_id": "2609.08419", "arxiv_url": "https://arxiv.org/abs/2609.08419", "authors": ["Imane Chraki", "Pierre Marza", "Stergios Christodoulidis", "Maria Vakalopoulou"], "brief": "\u672c\u6587\u63d0\u51fa CAR-MIL\uff0c\u5728\u6ce8\u610f\u529b\u5f0f\u591a\u5b9e\u4f8b\u5b66\u4e60\u4e2d\u52a0\u5165\u53cd\u4e8b\u5b9e\u6ce8\u610f\u529b\u6b63\u5219\uff0c\u901a\u8fc7\u8f7b\u91cf\u53cd\u4e8b\u5b9e\u5206\u652f\u5f15\u5bfc\u6ce8\u610f\u529b\u5206\u5e03\u8fdb\u884c\u6700\u5c0f\u4e14\u7ed3\u6784\u5316\u7684\u91cd\u5206\u914d\u3002\u8be5\u65b9\u6cd5\u5728\u5408\u6210\u57fa\u51c6\u548c5\u4e2a\u6570\u5b57\u75c5\u7406\u6570\u636e\u96c6\u4e0a\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u5206\u7c7b\u6027\u80fd\uff0c\u5e76\u63d0\u5347\u6ce8\u610f\u529b\u53ef\u9760\u6027\uff0c\u5c24\u5176\u5728\u66f4\u56f0\u96be\u4efb\u52a1\u4e0a\u6536\u76ca\u66f4\u660e\u663e\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08419", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u5b9e\u4f8b\u5b66\u4e60", "\u6570\u5b57\u75c5\u7406", "\u6ce8\u610f\u529b\u673a\u5236", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08419v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CAR-MIL: Counterfactual Attention Regularization for Multiple Instance Learning", "tldr": "\u672c\u6587\u63d0\u51fa CAR-MIL\uff0c\u5728\u6ce8\u610f\u529b\u5f0f\u591a\u5b9e\u4f8b\u5b66\u4e60\u4e2d\u52a0\u5165\u53cd\u4e8b\u5b9e\u6ce8\u610f\u529b\u6b63\u5219\uff0c\u901a\u8fc7\u8f7b\u91cf\u53cd\u4e8b\u5b9e\u5206\u652f\u5f15\u5bfc\u6ce8\u610f\u529b\u5206\u5e03\u8fdb\u884c\u6700\u5c0f\u4e14\u7ed3\u6784\u5316\u7684\u91cd\u5206\u914d\u3002\u8be5\u65b9\u6cd5\u5728\u5408\u6210\u57fa\u51c6\u548c5\u4e2a\u6570\u5b57\u75c5\u7406\u6570\u636e\u96c6\u4e0a\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u5206\u7c7b\u6027\u80fd\uff0c\u5e76\u63d0\u5347\u6ce8\u610f\u529b\u53ef\u9760\u6027\uff0c\u5c24\u5176\u5728\u66f4\u56f0\u96be\u4efb\u52a1\u4e0a\u6536\u76ca\u66f4\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Remote sensing multimodal large language models (RS-MLLMs) have advanced scene understanding and visual question answering over satellite imagery, yet localizing specific objects or changed regions remains challenging. Existing approaches rely on generating bounding box coordinates as token sequences, which is fragile for the small, densely packed objects common in remote sensing and increasingly error-prone when multiple targets must be localized simultaneously. In this work, we present an RS-specific formulation of the region selection paradigm, previously explored in natural-image MLLMs, and extend it to temporal change localization over multi-image sequences. Our framework employs a text-conditioned region proposal module, encodes each candidate as special tokens carrying per-frame visual features enriched with spatial and temporal cues, and lets the LLM localize targets by selecting region tokens in its response. We construct a multi-task training and evaluation suite spanning localization, referring expression, visual grounding, and understanding tasks across single-image and multi-temporal settings. Experiments show that our approach substantially outperforms coordinate-generation baselines on temporal change localization, while improving single-image visual grounding and maintaining competitive understanding performance. Oracle analysis decomposes the contributions of the region proposer and the LLM selector, providing diagnostic insight unique to this framework. Our code will be available at https://github.com/juwan-kr/RS-RegionSelect.", "arxiv_id": "2609.08391", "arxiv_url": "https://arxiv.org/abs/2609.08391", "authors": ["Juwan Chung", "Sungjune Park", "Yeongyun Kim", "Yong Man Ro"], "brief": "\u672c\u6587\u5c06\u533a\u57df\u9009\u62e9\u8303\u5f0f\u5f15\u5165\u9065\u611f\u591a\u6a21\u6001\u5927\u6a21\u578b\uff0c\u7528\u6587\u672c\u6761\u4ef6\u533a\u57df\u63d0\u8bae\u5668\u751f\u6210\u5019\u9009\u533a\u57df\uff0c\u5e76\u8ba9\u5927\u6a21\u578b\u901a\u8fc7\u9009\u62e9\u533a\u57df token \u6765\u5b9a\u4f4d\u76ee\u6807\u6216\u65f6\u5e8f\u53d8\u5316\u533a\u57df\u3002\u76f8\u6bd4\u76f4\u63a5\u751f\u6210\u8fb9\u754c\u6846\u5750\u6807\uff0c\u8be5\u65b9\u6cd5\u5728\u591a\u65f6\u76f8\u53d8\u5316\u5b9a\u4f4d\u4e0a\u663e\u8457\u66f4\u7a33\u5065\uff0c\u540c\u65f6\u63d0\u5347\u5355\u56fe\u89c6\u89c9\u6307\u4ee3\u8868\u8fbe/\u89c6\u89c9 grounding\uff0c\u7406\u89e3\u4efb\u52a1\u8868\u73b0\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08391", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9065\u611f", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u53d8\u5316\u68c0\u6d4b", "\u89c6\u89c9\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08391v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Coordinates to Candidate Regions: Temporal Change Localization via Region Selection in Remote Sensing Multimodal LLMs", "tldr": "\u672c\u6587\u5c06\u533a\u57df\u9009\u62e9\u8303\u5f0f\u5f15\u5165\u9065\u611f\u591a\u6a21\u6001\u5927\u6a21\u578b\uff0c\u7528\u6587\u672c\u6761\u4ef6\u533a\u57df\u63d0\u8bae\u5668\u751f\u6210\u5019\u9009\u533a\u57df\uff0c\u5e76\u8ba9\u5927\u6a21\u578b\u901a\u8fc7\u9009\u62e9\u533a\u57df token \u6765\u5b9a\u4f4d\u76ee\u6807\u6216\u65f6\u5e8f\u53d8\u5316\u533a\u57df\u3002\u76f8\u6bd4\u76f4\u63a5\u751f\u6210\u8fb9\u754c\u6846\u5750\u6807\uff0c\u8be5\u65b9\u6cd5\u5728\u591a\u65f6\u76f8\u53d8\u5316\u5b9a\u4f4d\u4e0a\u663e\u8457\u66f4\u7a33\u5065\uff0c\u540c\u65f6\u63d0\u5347\u5355\u56fe\u89c6\u89c9\u6307\u4ee3\u8868\u8fbe/\u89c6\u89c9 grounding\uff0c\u7406\u89e3\u4efb\u52a1\u8868\u73b0\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Floorplans are compact, appearance-invariant maps ideal for indoor localization, yet existing methods rely on depth networks that are brittle in cluttered scenes. We propose GALoc, a geometry-first framework that replaces depth prediction with gravity-aligned wireframes that satisfy verticality and coplanarity by construction. Given monocular RGB, camera intrinsics, relative poses, and IMU orientation, GALoc constructs a linear constraint matrix encoding verticality and coplanarity, and finds the camera gauge minimizing its smallest singular value via global search. The rectified wireframes are projected into bird\u0027s-eye-view layouts through a closed-form, FOV-consistent transformation and matched against the floorplan via metric-free SE(2) search. We evaluate end-to-end on Structured3D, with calibrated noise on Gibson, and on real-world author-collected sequences. When sufficient wall geometry is visible, GALoc matches or outperforms depth-based baselines -- achieving 88% sequential localization success at 0.1m over 100-step sequences on Gibson vs the baseline\u0027s 68% -- while abstaining in structure-blind scenes.", "arxiv_id": "2609.08385", "arxiv_url": "https://arxiv.org/abs/2609.08385", "authors": ["Jeahn Han", "Minji Kim", "Jeongbin Sohn", "Jonghyeok Park", "Matthias Wuest", "Pyojin Kim"], "brief": "GALoc\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u6df1\u5ea6\u9884\u6d4b\u7684\u5355\u76ee\u5ba4\u5185\u5e73\u9762\u56fe\u5b9a\u4f4d\u65b9\u6cd5\uff0c\u5229\u7528IMU\u91cd\u529b\u65b9\u5411\u7ea6\u675f\u751f\u6210\u6ee1\u8db3\u5782\u76f4\u6027\u4e0e\u5171\u9762\u7684\u7ebf\u6846\uff0c\u518d\u6295\u5f71\u5230\u9e1f\u77b0\u5e03\u5c40\u5e76\u4e0e\u5e73\u9762\u56fe\u5339\u914d\u3002\u5b9e\u9a8c\u663e\u793a\u5728\u53ef\u89c1\u5899\u4f53\u7ed3\u6784\u5145\u8db3\u65f6\u4f18\u4e8e\u6216\u6301\u5e73\u6df1\u5ea6\u65b9\u6cd5\uff0c\u5728Gibson\u4e0a100\u6b65\u5e8f\u52170.1m\u6210\u529f\u7387\u8fbe88%\uff0c\u9ad8\u4e8e\u57fa\u7ebf68%\uff0c\u4e14\u80fd\u5728\u7ed3\u6784\u4e0d\u8db3\u573a\u666f\u4e2d\u4e3b\u52a8\u653e\u5f03\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08385", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u76ee\u5b9a\u4f4d", "\u5ba4\u5185\u5b9a\u4f4d", "\u51e0\u4f55\u89c6\u89c9", "\u5e73\u9762\u56fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08385v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GALoc: Gravity Aligned Wireframes for Depth-Free Monocular Floorplan Localization", "tldr": "GALoc\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u6df1\u5ea6\u9884\u6d4b\u7684\u5355\u76ee\u5ba4\u5185\u5e73\u9762\u56fe\u5b9a\u4f4d\u65b9\u6cd5\uff0c\u5229\u7528IMU\u91cd\u529b\u65b9\u5411\u7ea6\u675f\u751f\u6210\u6ee1\u8db3\u5782\u76f4\u6027\u4e0e\u5171\u9762\u7684\u7ebf\u6846\uff0c\u518d\u6295\u5f71\u5230\u9e1f\u77b0\u5e03\u5c40\u5e76\u4e0e\u5e73\u9762\u56fe\u5339\u914d\u3002\u5b9e\u9a8c\u663e\u793a\u5728\u53ef\u89c1\u5899\u4f53\u7ed3\u6784\u5145\u8db3\u65f6\u4f18\u4e8e\u6216\u6301\u5e73\u6df1\u5ea6\u65b9\u6cd5\uff0c\u5728Gibson\u4e0a100\u6b65\u5e8f\u52170.1m\u6210\u529f\u7387\u8fbe88%\uff0c\u9ad8\u4e8e\u57fa\u7ebf68%\uff0c\u4e14\u80fd\u5728\u7ed3\u6784\u4e0d\u8db3\u573a\u666f\u4e2d\u4e3b\u52a8\u653e\u5f03\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time adaptation (TTA) has emerged as a prominent strategy for adapting vision-language models to distribution shifts during inference. We conduct a per-sample analysis of model predictions before and after adaptation, and observe two failure modes in existing TTA methods that echo previous work. Adaptations are frequently negligible, yielding no change in the model\u0027s predictions, and more severely, they can be detrimental by flipping previously correct predictions to incorrect ones. This naturally raises a question: Can we identify and skip such negligible or harmful adaptations? In this work, we introduce a new problem of selective adaptation, which aims to determine whether a given test sample should undergo adaptation or be skipped. To this end, we propose Cross-Augmentation Similarity (CAS), a simple baseline that performs adaptation only when predictions across augmented views exhibit low similarity. Notably, CAS not only preserves but in some cases improves overall accuracy, even when skipping nearly 85% of the adaptation process. We hope other researchers will explore this new direction and surpass the performance of our baseline. Our code is available at https://github.com/sirujiang/selective-adaptation.", "arxiv_id": "2609.08367", "arxiv_url": "https://arxiv.org/abs/2609.08367", "authors": ["Siru Jiang", "Yuwei Liang", "Jian Liang", "Ran He", "Tieniu Tan"], "brief": "\u8bba\u6587\u63d0\u51fa\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6d4b\u8bd5\u65f6\u9002\u5e94\u4e2d\u7684\u201c\u9009\u62e9\u6027\u9002\u5e94\u201d\u95ee\u9898\uff1a\u5224\u65ad\u6bcf\u4e2a\u6d4b\u8bd5\u6837\u672c\u662f\u5426\u503c\u5f97\u9002\u5e94\uff0c\u4ee5\u907f\u514d\u65e0\u6548\u6216\u6709\u5bb3\u66f4\u65b0\u3002\u4f5c\u8005\u63d0\u51fa\u7b80\u5355\u57fa\u7ebf CAS\uff0c\u901a\u8fc7\u589e\u5f3a\u89c6\u56fe\u95f4\u9884\u6d4b\u76f8\u4f3c\u5ea6\u51b3\u5b9a\u662f\u5426\u9002\u5e94\uff0c\u5728\u8df3\u8fc7\u8fd1 85% \u9002\u5e94\u8ba1\u7b97\u7684\u60c5\u51b5\u4e0b\u4ecd\u80fd\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u51c6\u786e\u7387\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08367", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u9002\u5e94", "\u5206\u5e03\u504f\u79fb", "\u6570\u636e\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08367v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "To Adapt or Not to Adapt? Selective Adaptation for Vision-Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6d4b\u8bd5\u65f6\u9002\u5e94\u4e2d\u7684\u201c\u9009\u62e9\u6027\u9002\u5e94\u201d\u95ee\u9898\uff1a\u5224\u65ad\u6bcf\u4e2a\u6d4b\u8bd5\u6837\u672c\u662f\u5426\u503c\u5f97\u9002\u5e94\uff0c\u4ee5\u907f\u514d\u65e0\u6548\u6216\u6709\u5bb3\u66f4\u65b0\u3002\u4f5c\u8005\u63d0\u51fa\u7b80\u5355\u57fa\u7ebf CAS\uff0c\u901a\u8fc7\u589e\u5f3a\u89c6\u56fe\u95f4\u9884\u6d4b\u76f8\u4f3c\u5ea6\u51b3\u5b9a\u662f\u5426\u9002\u5e94\uff0c\u5728\u8df3\u8fc7\u8fd1 85% \u9002\u5e94\u8ba1\u7b97\u7684\u60c5\u51b5\u4e0b\u4ecd\u80fd\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Text-to-motion (T2M) generation maps natural language to human joint movements, aiding gaming, VR, and robotics. Retrieval-Augmented Text-to-Motion (RAG-T2M) improves generation on complex descriptions by conditioning on retrieved motion-text pairs. However, existing RAG-T2M models face two challenges: coarse-grained retrieval and fusion mechanisms overlook the hierarchical, spatial-temporal topology of human motion, and a representation gap exists because retrieved evidence resides in a semantic space separate from the generator\u0027s latents. To address the first, we present ReMoMask, a structure-aware RAG framework coupling Hierarchical Bidirectional Momentum (HBM) contrastive learning to align global and part-level features with text; Semantic Spatial-Temporal Attention (SSTA) for topology-aware fusion; and Topology Structured Masking (TSM) to force robust part-level grounding via adaptive masking. To address the second, we introduce ReMoMask-2, which rebuilds the retrieval database directly within the generator\u0027s pre-quantization latent space and aligns text queries via a distilled lightweight projector, allowing the generator to directly consume the retrieved motion\u0027s semantic content. Extensive experiments on HumanML3D, KIT-ML, and SnapMoGen demonstrate our retriever achieves state-of-the-art accuracy, while ReMoMask-2 attains the lowest FID on KIT-ML and SnapMoGen; notably, its single mask-transformer stage surpasses ReMoMask\u0027s full two-stage pipeline and delivers the fastest inference.", "arxiv_id": "2609.08365", "arxiv_url": "https://arxiv.org/abs/2609.08365", "authors": ["Yiran Wang", "Zeyu Zhang", "Ling Shao", "Hao Tang"], "brief": "\u8bba\u6587\u63d0\u51fa ReMoMask/ReMoMask-2\uff0c\u7528\u7ed3\u6784\u611f\u77e5\u7684\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\u6539\u8fdb\u6587\u672c\u5230\u52a8\u4f5c\u751f\u6210\uff0c\u663e\u5f0f\u5efa\u6a21\u4eba\u4f53\u52a8\u4f5c\u7684\u5c42\u7ea7\u90e8\u4f4d\u4e0e\u65f6\u7a7a\u62d3\u6251\u3002ReMoMask-2 \u5c06\u68c0\u7d22\u5e93\u5efa\u5728\u751f\u6210\u5668\u9884\u91cf\u5316\u6f5c\u7a7a\u95f4\u4e2d\uff0c\u5e76\u7528\u8f7b\u91cf\u6295\u5f71\u5668\u5bf9\u9f50\u6587\u672c\u67e5\u8be2\uff0c\u7f29\u5c0f\u68c0\u7d22\u8bc1\u636e\u4e0e\u751f\u6210\u5668\u8868\u793a\u7684\u9e3f\u6c9f\u3002\u5728 HumanML3D\u3001KIT-ML \u548c SnapMoGen \u4e0a\u53d6\u5f97\u9886\u5148\u68c0\u7d22\u6548\u679c\uff0c\u5e76\u5728 KIT-ML\u3001SnapMoGen \u4e0a\u83b7\u5f97\u6700\u4f4e FID\uff0c\u4e14\u63a8\u7406\u66f4\u5feb\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08365", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u672c\u5230\u52a8\u4f5c\u751f\u6210", "\u68c0\u7d22\u589e\u5f3a", "\u63a9\u7801\u751f\u6210", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08365v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReMoMask-2: Latent Retrieval-Augmented Masked Motion Generation", "tldr": "\u8bba\u6587\u63d0\u51fa ReMoMask/ReMoMask-2\uff0c\u7528\u7ed3\u6784\u611f\u77e5\u7684\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\u6539\u8fdb\u6587\u672c\u5230\u52a8\u4f5c\u751f\u6210\uff0c\u663e\u5f0f\u5efa\u6a21\u4eba\u4f53\u52a8\u4f5c\u7684\u5c42\u7ea7\u90e8\u4f4d\u4e0e\u65f6\u7a7a\u62d3\u6251\u3002ReMoMask-2 \u5c06\u68c0\u7d22\u5e93\u5efa\u5728\u751f\u6210\u5668\u9884\u91cf\u5316\u6f5c\u7a7a\u95f4\u4e2d\uff0c\u5e76\u7528\u8f7b\u91cf\u6295\u5f71\u5668\u5bf9\u9f50\u6587\u672c\u67e5\u8be2\uff0c\u7f29\u5c0f\u68c0\u7d22\u8bc1\u636e\u4e0e\u751f\u6210\u5668\u8868\u793a\u7684\u9e3f\u6c9f\u3002\u5728 HumanML3D\u3001KIT-ML \u548c SnapMoGen \u4e0a\u53d6\u5f97\u9886\u5148\u68c0\u7d22\u6548\u679c\uff0c\u5e76\u5728 KIT-ML\u3001SnapMoGen \u4e0a\u83b7\u5f97\u6700\u4f4e FID\uff0c\u4e14\u63a8\u7406\u66f4\u5feb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Moving-object perception must decide which image regions correspond to real motion and keep every instance identified over time. Methods that read motion from appearance, optical flow, or estimated trajectories lose that evidence under poor illumination, adverse weather, reflections, and occlusion. Radar is a natural remedy because it measures radial velocity directly instead of inferring it from photometric correspondence. However, existing benchmarks do not jointly provide radar measurements, dense moving-instance masks, and temporally consistent identities for surveillance. We therefore introduce RGBTR-Motion, a synchronized and calibrated fixed-camera benchmark that pairs RGB, thermal, and radar streams with dense instance masks and temporally consistent identities across diverse surveillance scenes. We also develop SAM-Radar, an RGB, thermal, and radar-based segmentation and tracking framework built on SAM 3. SAM-Radar\u0027s radar-aware detector fuses calibrated RGBT features with radar returns that are grounded at their projected image locations, and motion supervision, implemented as foreground classification of those projected returns, teaches the detector to reject clutter without any text prompt. The tracker associates accepted radar returns with individual trajectories and uses them as physical evidence that a visually degraded target remains present. This allows it to bridge short periods of low visibility or occlusion and reconnect a reappearing target to its existing identity instead of starting a new track. SAM-Radar attains 0.7027 IoU and 0.8090 F1-50, and raises MOTA, HOTA, and IDF1 by 0.2977, 0.1603, and 0.2857 over the strongest competing values.", "arxiv_id": "2609.08346", "arxiv_url": "https://arxiv.org/abs/2609.08346", "authors": ["Jue Wang", "Xuan Wang", "Hao Zhou", "Ruixiang Zhou", "Yixuan Zhou", "Tianshuo Yuan", "Jieming Ma", "Jie Zhang", "Fei Luo"], "brief": "\u8bba\u6587\u63d0\u51fa RGBTR-Motion\uff0c\u4e00\u4e2a\u540c\u6b65\u6807\u5b9a\u7684\u56fa\u5b9a\u6444\u50cf\u5934\u6570\u636e\u96c6\uff0c\u8054\u5408\u63d0\u4f9b RGB\u3001\u70ed\u6210\u50cf\u3001\u96f7\u8fbe\u3001\u7a20\u5bc6\u8fd0\u52a8\u5b9e\u4f8b\u63a9\u7801\u548c\u8de8\u65f6\u95f4\u4e00\u81f4\u8eab\u4efd\u6807\u6ce8\u3002\u57fa\u4e8e\u6b64\uff0c\u4f5c\u8005\u5f00\u53d1 SAM-Radar\uff0c\u5728 SAM 3 \u4e0a\u878d\u5408 RGBT \u7279\u5f81\u4e0e\u6295\u5f71\u5230\u56fe\u50cf\u4f4d\u7f6e\u7684\u96f7\u8fbe\u56de\u6ce2\uff0c\u7528\u96f7\u8fbe\u901f\u5ea6\u8bc1\u636e\u63d0\u5347\u8fd0\u52a8\u76ee\u6807\u5206\u5272\u4e0e\u8ddf\u8e2a\uff0c\u5728\u4f4e\u7167\u5ea6\u3001\u906e\u6321\u7b49\u573a\u666f\u4e0b\u663e\u8457\u63d0\u9ad8 MOTA\u3001HOTA \u548c IDF1\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08346", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u76ee\u6807\u8ddf\u8e2a", "\u56fe\u50cf\u5206\u5272", "\u96f7\u8fbe\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08346v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Segment Any Motion with Radar: Robust Multimodal Moving-Object Segmentation and Tracking", "tldr": "\u8bba\u6587\u63d0\u51fa RGBTR-Motion\uff0c\u4e00\u4e2a\u540c\u6b65\u6807\u5b9a\u7684\u56fa\u5b9a\u6444\u50cf\u5934\u6570\u636e\u96c6\uff0c\u8054\u5408\u63d0\u4f9b RGB\u3001\u70ed\u6210\u50cf\u3001\u96f7\u8fbe\u3001\u7a20\u5bc6\u8fd0\u52a8\u5b9e\u4f8b\u63a9\u7801\u548c\u8de8\u65f6\u95f4\u4e00\u81f4\u8eab\u4efd\u6807\u6ce8\u3002\u57fa\u4e8e\u6b64\uff0c\u4f5c\u8005\u5f00\u53d1 SAM-Radar\uff0c\u5728 SAM 3 \u4e0a\u878d\u5408 RGBT \u7279\u5f81\u4e0e\u6295\u5f71\u5230\u56fe\u50cf\u4f4d\u7f6e\u7684\u96f7\u8fbe\u56de\u6ce2\uff0c\u7528\u96f7\u8fbe\u901f\u5ea6\u8bc1\u636e\u63d0\u5347\u8fd0\u52a8\u76ee\u6807\u5206\u5272\u4e0e\u8ddf\u8e2a\uff0c\u5728\u4f4e\u7167\u5ea6\u3001\u906e\u6321\u7b49\u573a\u666f\u4e0b\u663e\u8457\u63d0\u9ad8 MOTA\u3001HOTA \u548c IDF1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Representing a 3D scene as multi-view images allows 2D VLMs to reason in 3D by reusing priors from pre-training, sidestepping the scarcity of annotated 3D data. However, it produces thousands of redundant visual tokens whose cost grows with every view. Existing visual token pruners fall into two families, each limited in the 3D multi-view setting. Learned importance methods rank tokens by attention or encoder features; because redundancy here is fundamentally spatial, they keep near-duplicate tokens from a few prominent regions and leave most of the scene unrepresented. Voxelization methods improve spatial coverage but cannot enforce an exact token budget and saturate as multi-view observations overlap in 3D, capping retention well below the target. We show that spatial coverage is associated with 3D reasoning performance and introduce CoVeR, a deterministic, training-free selector that uses only token coordinates, with no learned signals. CoVeR selects tokens that collectively cover every region of the scene, and solves the limitations of both families: it enforces an exact per-scene budget, breaks the voxelization saturation plateau, and avoids the near-duplicate selections of learned importance. Extensive experiments show CoVeR outperforms prior SOTAs on all three 3D reasoning benchmarks and generalizes as a plug-and-play module tested across four VLMs. Notably, with only $\\approx$8% of visual tokens, it preserves 93.5% of full-token performance, surpassing SOTA by 3.9 percentage points on average across benchmarks.", "arxiv_id": "2609.08345", "arxiv_url": "https://arxiv.org/abs/2609.08345", "authors": ["Nhat-Tan Bui", "Varshini Elangovan", "Arun Reddy Anugu", "Sreyas Mohan", "Wei Ye", "Dilin Wang", "JQ Huang", "Rakesh Ranjan", "Aviral Chharia", "Fernando De la Torre"], "brief": "\u8bba\u6587\u63d0\u51fa CoVeR\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u89c6\u89d2 3D \u573a\u666f\u89c6\u89c9 token \u526a\u679d\u65b9\u6cd5\uff0c\u4ec5\u5229\u7528 token \u5750\u6807\u6765\u9009\u62e9\u80fd\u8986\u76d6\u573a\u666f\u5404\u533a\u57df\u7684 token\u3002\u5b83\u80fd\u5728\u7cbe\u786e\u9884\u7b97\u4e0b\u51cf\u5c11\u5197\u4f59\u3001\u63d0\u5347\u7a7a\u95f4\u8986\u76d6\uff0c\u5728\u4e09\u4e2a 3D \u63a8\u7406\u57fa\u51c6\u548c\u56db\u4e2a VLM \u4e0a\u5747\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff1b\u4ec5\u4fdd\u7559\u7ea6 8% \u89c6\u89c9 token \u4ecd\u53ef\u4fdd\u6301 93.5% \u7684\u5168 token \u6027\u80fd\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08345", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "3D\u63a8\u7406", "Token\u526a\u679d", "\u591a\u89c6\u89d2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08345v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoVeR: Coverage-Based Token Pruning for Multi-View 3D Reasoning in VLMs", "tldr": "\u8bba\u6587\u63d0\u51fa CoVeR\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u89c6\u89d2 3D \u573a\u666f\u89c6\u89c9 token \u526a\u679d\u65b9\u6cd5\uff0c\u4ec5\u5229\u7528 token \u5750\u6807\u6765\u9009\u62e9\u80fd\u8986\u76d6\u573a\u666f\u5404\u533a\u57df\u7684 token\u3002\u5b83\u80fd\u5728\u7cbe\u786e\u9884\u7b97\u4e0b\u51cf\u5c11\u5197\u4f59\u3001\u63d0\u5347\u7a7a\u95f4\u8986\u76d6\uff0c\u5728\u4e09\u4e2a 3D \u63a8\u7406\u57fa\u51c6\u548c\u56db\u4e2a VLM \u4e0a\u5747\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff1b\u4ec5\u4fdd\u7559\u7ea6 8% \u89c6\u89c9 token \u4ecd\u53ef\u4fdd\u6301 93.5% \u7684\u5168 token \u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
