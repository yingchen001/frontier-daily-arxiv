y optimized decoder that reaches 2000 FPS decoding speed, significantly surpassing JPEG\u0027s performance at comparable rate-distortion (RD) performance. To the best of our knowledge, this work presents the first learning-based image codec that simultaneously outperforms or is comparable with JPEG in both RD performance and decoding speed while maintaining practical encoding speed. Code is available at https://github.com/actcwlf/PIC.", "arxiv_id": "2609.09020", "arxiv_url": "https://arxiv.org/abs/2609.09020", "authors": ["Xiang Liu", "Jinxiang Wang", "Bin Chen", "Zimo Liu", "Mingyao Hong", "Jiawei Li", "Yaowei Wang", "Shu-tao Xia"], "brief": "\u672c\u6587\u63d0\u51fa Practical INR Image Codec\uff08PIC\uff09\uff0c\u4e00\u79cd\u524d\u9988\u5f0f\u9690\u5f0f\u795e\u7ecf\u8868\u793a\u56fe\u50cf\u7f16\u7801\u67b6\u6784\uff0c\u53ef\u5728\u5355\u6b21\u524d\u5411\u4f20\u64ad\u4e2d\u751f\u6210INR\u7f51\u7edc\u6240\u9700\u4fe1\u606f\u3002\u5b83\u540c\u65f6\u5b9e\u73b020 FPS\u7f16\u7801\u548c\u7ea62000 FPS\u89e3\u7801\uff0c\u5e76\u5728\u7387\u5931\u771f\u6027\u80fd\u4e0a\u4e0eJPEG\u76f8\u5f53\u6216\u66f4\u4f18\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09020", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u524d\u9988INR\u56fe\u50cf\u7f16\u7801\u65b9\u5f0f\uff0c\u907f\u514d\u4f20\u7edfINR\u538b\u7f29\u4e2d\u8017\u65f6\u7684\u9010\u56fe\u4f18\u5316\uff0c\u663e\u8457\u63d0\u5347\u7f16\u7801\u901f\u5ea6\u3002", "\u9ad8\u5ea6\u4f18\u5316\u89e3\u7801\u5668\u5b9e\u73b0\u4e9a\u6beb\u79d2\u7ea7\u89e3\u7801\uff0c\u8fbe\u5230\u7ea62000 FPS\uff0c\u8d85\u8fc7JPEG\u89e3\u7801\u901f\u5ea6\u3002", "\u5728\u53ef\u6bd4\u7387\u5931\u771f\u6027\u80fd\u4e0b\uff0c\u540c\u65f6\u517c\u987e\u5b66\u4e60\u5f0f\u7f16\u7801\u7684\u538b\u7f29\u8868\u73b0\u548c\u4f20\u7edf\u7f16\u7801\u5668\u7684\u5b9e\u7528\u901f\u5ea6\u3002"], "keywords": ["\u56fe\u50cf\u538b\u7f29", "\u9690\u5f0f\u795e\u7ecf\u8868\u793a", "\u5b66\u4e60\u5f0f\u7f16\u7801", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09020v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PIC: Revisiting INR for Image Coding with Fast Encoding and Sub-Millisecond Decoding", "tldr": "PIC\u5b9e\u73b0\u5feb\u901f\u7f16\u7801\u4e0e\u4e9a\u6beb\u79d2INR\u56fe\u50cf\u89e3\u7801", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Practical INR Image Codec\uff08PIC\uff09\uff0c\u4e00\u79cd\u524d\u9988\u5f0f\u9690\u5f0f\u795e\u7ecf\u8868\u793a\u56fe\u50cf\u7f16\u7801\u67b6\u6784\uff0c\u53ef\u5728\u5355\u6b21\u524d\u5411\u4f20\u64ad\u4e2d\u751f\u6210INR\u7f51\u7edc\u6240\u9700\u4fe1\u606f\u3002\u5b83\u540c\u65f6\u5b9e\u73b020 FPS\u7f16\u7801\u548c\u7ea62000 FPS\u89e3\u7801\uff0c\u5e76\u5728\u7387\u5931\u771f\u6027\u80fd\u4e0a\u4e0eJPEG\u76f8\u5f53\u6216\u66f4\u4f18\u3002", "why_notable": "\u8fd9\u662f\u5c11\u89c1\u7684\u5728\u7387\u5931\u771f\u3001\u7f16\u7801\u901f\u5ea6\u548c\u89e3\u7801\u901f\u5ea6\u4e09\u65b9\u9762\u540c\u65f6\u63a5\u8fd1\u6216\u8d85\u8d8aJPEG\u7684\u5b66\u4e60\u5f0f\u56fe\u50cf\u7f16\u7801\u65b9\u6848\uff0c\u63d0\u5347\u4e86INR\u538b\u7f29\u4ece\u7814\u7a76\u8d70\u5411\u5b9e\u7528\u90e8\u7f72\u7684\u53ef\u80fd\u6027\u3002"}, {"abstract": "Spherical observations provide global visual context for 3D scene understanding. However, visual information is encoded in an angular domain, whereas the physical world is represented in Cartesian coordinates. This cross-space representation gap complicates geometric correspondence and semantic evidence aggregation. To delve into this challenge, we introduce Spheriverse, comprising $64,400$ temporally aligned spherical image-LiDAR pairs organized into 644 sequences. The dataset spans diverse scenes, illumination, and weather conditions, with fine-grained semantic classes. We further establish benchmarks for semantic occupancy prediction, semantic mapping, and 3D object detection, evaluating 30+ methods through overall and scene-wise comparisons. For dense prediction, we propose SphereOcc, an occupancy framework that couples spherical geometry modeling with semantic evidence retrieval. Cartesian-Spherical Representation Remodeling (CSRR) incorporates spherical range-azimuth geometry into Cartesian voxel features through region-wise modulation. Spherical Evidence Re-querying (SER) then conditions queries on voxel content and range-height-azimuth geometry to adaptively retrieve relevant semantic evidence from source spherical image features. SphereOcc achieves 13.91% mIoU and 24.65% GeoIoU, outperforming the respective best-performing methods, TPVFormer and SurroundOcc, by 1.70 and 2.10 percentage points. It also ranks first in both metrics across all five scenes, with consistent advantages across the evaluated spatial partitions and reduced fields of view. The established benchmark and source code will be available at https://feit-feiteng.github.io/Spheriverse.", "arxiv_id": "2609.09012", "arxiv_url": "https://arxiv.org/abs/2609.09012", "authors": ["Fei Teng", "Sheng Wu", "Mengfei Duan", "Guoqiang Zhao", "Junhui Ma", "Kai Luo", "Siyu Li", "Hao Shi", "Zhiyong Li", "Kailun Yang"], "brief": "\u8bba\u6587\u63d0\u51fa Spheriverse \u6570\u636e\u96c6\uff0c\u5305\u542b 64,400 \u5bf9\u65f6\u95f4\u5bf9\u9f50\u7684\u7403\u9762\u56fe\u50cf-LiDAR \u6570\u636e\uff0c\u8986\u76d6\u591a\u573a\u666f\u3001\u5149\u7167\u548c\u5929\u6c14\u6761\u4ef6\u3002\u4f5c\u8005\u5efa\u7acb\u8bed\u4e49\u5360\u7528\u9884\u6d4b\u3001\u8bed\u4e49\u5efa\u56fe\u548c3D\u76ee\u6807\u68c0\u6d4b\u57fa\u51c6\uff0c\u5e76\u63d0\u51fa SphereOcc \u6846\u67b6\u6539\u8fdb\u7403\u9762\u89c2\u6d4b\u4e0b\u7684\u5360\u7528\u7406\u89e3\u3002", "categories": ["cs.CV", "cs.RO", "eess.IV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09012", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Spheriverse \u5305\u542b 644 \u4e2a\u5e8f\u5217\u300164,400 \u5bf9\u7403\u9762\u56fe\u50cf-LiDAR\uff0c\u5e26\u7ec6\u7c92\u5ea6\u8bed\u4e49\u7c7b\u522b\u6807\u6ce8\u3002", "\u8bc4\u6d4b 30 \u591a\u79cd\u65b9\u6cd5\uff0c\u8986\u76d6\u8bed\u4e49\u5360\u7528\u3001\u8bed\u4e49\u5efa\u56fe\u30013D\u76ee\u6807\u68c0\u6d4b\uff0c\u5e76\u63d0\u4f9b\u6574\u4f53\u4e0e\u5206\u573a\u666f\u5bf9\u6bd4\u3002", "SphereOcc \u901a\u8fc7 CSRR \u5efa\u6a21\u7403\u9762\u8ddd\u79bb-\u65b9\u4f4d\u51e0\u4f55\uff0c\u5e76\u7528 SER \u4ece\u7403\u9762\u56fe\u50cf\u7279\u5f81\u4e2d\u81ea\u9002\u5e94\u68c0\u7d22\u8bed\u4e49\u8bc1\u636e\uff0cmIoU \u8fbe 13.91%\u3001GeoIoU \u8fbe 24.65%\u3002"], "keywords": ["3D\u573a\u666f\u7406\u89e3", "\u591a\u6a21\u6001", "\u8bed\u4e49\u5360\u7528", "\u81ea\u52a8\u9a7e\u9a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09012v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Spheriverse: 3D Scene Understanding from Spherical Observations in the Wild", "tldr": "\u9762\u5411\u7403\u9762\u89c2\u6d4b\u76843D\u573a\u666f\u7406\u89e3\u6570\u636e\u96c6\u4e0e\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Spheriverse \u6570\u636e\u96c6\uff0c\u5305\u542b 64,400 \u5bf9\u65f6\u95f4\u5bf9\u9f50\u7684\u7403\u9762\u56fe\u50cf-LiDAR \u6570\u636e\uff0c\u8986\u76d6\u591a\u573a\u666f\u3001\u5149\u7167\u548c\u5929\u6c14\u6761\u4ef6\u3002\u4f5c\u8005\u5efa\u7acb\u8bed\u4e49\u5360\u7528\u9884\u6d4b\u3001\u8bed\u4e49\u5efa\u56fe\u548c3D\u76ee\u6807\u68c0\u6d4b\u57fa\u51c6\uff0c\u5e76\u63d0\u51fa SphereOcc \u6846\u67b6\u6539\u8fdb\u7403\u9762\u89c2\u6d4b\u4e0b\u7684\u5360\u7528\u7406\u89e3\u3002", "why_notable": "\u7403\u9762\u76f8\u673a\u63d0\u4f9b\u5168\u5c40\u89c6\u91ce\uff0c\u4f46\u4e0e\u7b1b\u5361\u5c143D\u7a7a\u95f4\u5b58\u5728\u8868\u793a\u9e3f\u6c9f\uff1b\u8be5\u5de5\u4f5c\u7cfb\u7edf\u6027\u63d0\u4f9b\u6570\u636e\u3001\u57fa\u51c6\u548c\u6a21\u578b\uff0c\u4e3a\u81ea\u52a8\u9a7e\u9a76\u3001\u673a\u5668\u4eba\u7b49\u5168\u666f3D\u611f\u77e5\u4efb\u52a1\u63d0\u4f9b\u91cd\u8981\u57fa\u7840\u8bbe\u65bd\u3002"}, {"abstract": "Object 6D pose estimation formulations have progressively reduced reliance on object-specific priors, evolving from explicit 3D models to multi-view object captures to single reference images. We take this progression to its extreme by introducing prior-free relative 6D pose estimation, which lifts the assumption of knowing which object is to be posed within the scene. This novel setting aims to estimate the relative poses of multiple instances of an unknown object within the same image, without requiring CAD models, templates, or reference images. We solve this by formulating a novel method (PROSE) that finds coarse correspondences between object instances using multimodal foundation features, thus requiring no training. We refine these correspondences by imposing cycle consistency across tuples of instances, and leverage the resulting globally consistent correspondences to estimate the relative 6D pose between any pair of instances. To enable systematic evaluation, we design a novel benchmark (PRENCH) built from three multi-instance BOP datasets and enriched with task-specific metadata. PROSE consistently outperforms baselines obtained by adapting state-of-the-art single-image methods to the proposed setting, while requiring neither task-specific supervision nor additional learned components. Project website: https://tev-fbk.github.io/PROSE/", "arxiv_id": "2609.08949", "arxiv_url": "https://arxiv.org/abs/2609.08949", "authors": ["Behdad Khodabandehloo", "Andrea Caraffa", "Davide Boscaini", "Fabio Poiesi"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u65e0\u5148\u9a8c\u76f8\u5bf96D\u4f4d\u59ff\u4f30\u8ba1\u201d\u65b0\u4efb\u52a1\uff1a\u5728\u6ca1\u6709CAD\u6a21\u578b\u3001\u6a21\u677f\u6216\u53c2\u8003\u56fe\u7684\u60c5\u51b5\u4e0b\uff0c\u4f30\u8ba1\u540c\u4e00\u56fe\u50cf\u4e2d\u672a\u77e5\u7269\u4f53\u591a\u4e2a\u5b9e\u4f8b\u4e4b\u95f4\u7684\u76f8\u5bf9\u4f4d\u59ff\u3002\u4f5c\u8005\u63d0\u51fa\u514d\u8bad\u7ec3\u65b9\u6cd5PROSE\uff0c\u5e76\u6784\u5efaPRENCH\u57fa\u51c6\u7528\u4e8e\u7cfb\u7edf\u8bc4\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08949", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["PROSE\u5229\u7528\u591a\u6a21\u6001\u57fa\u7840\u6a21\u578b\u7279\u5f81\u5728\u4e0d\u540c\u7269\u4f53\u5b9e\u4f8b\u95f4\u5bfb\u627e\u7c97\u5bf9\u5e94\u5173\u7cfb\uff0c\u65e0\u9700\u4efb\u52a1\u4e13\u7528\u8bad\u7ec3\u3002", "\u901a\u8fc7\u8de8\u591a\u4e2a\u5b9e\u4f8b\u5143\u7ec4\u7684\u5faa\u73af\u4e00\u81f4\u6027\u7ea6\u675f\u7ec6\u5316\u5339\u914d\uff0c\u83b7\u5f97\u5168\u5c40\u4e00\u81f4\u7684\u5bf9\u5e94\u70b9\u3002", "PRENCH\u57fa\u4e8e\u4e09\u4e2a\u591a\u5b9e\u4f8bBOP\u6570\u636e\u96c6\u6784\u5efa\uff0c\u5e76\u52a0\u5165\u9762\u5411\u8be5\u4efb\u52a1\u7684\u5143\u6570\u636e\uff1bPROSE\u4f18\u4e8e\u6539\u9020\u540e\u7684\u5355\u56fe\u50cf\u4f4d\u59ff\u4f30\u8ba1\u57fa\u7ebf\u3002"], "keywords": ["6D\u4f4d\u59ff\u4f30\u8ba1", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u51e0\u4f55\u5339\u914d", "\u65e0\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08949v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Prior-free relative 6D pose estimation of multiple object instances", "tldr": "\u65e0\u9700\u5148\u9a8c\u4f30\u8ba1\u672a\u77e5\u591a\u5b9e\u4f8b\u76f8\u5bf96D\u4f4d\u59ff", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u65e0\u5148\u9a8c\u76f8\u5bf96D\u4f4d\u59ff\u4f30\u8ba1\u201d\u65b0\u4efb\u52a1\uff1a\u5728\u6ca1\u6709CAD\u6a21\u578b\u3001\u6a21\u677f\u6216\u53c2\u8003\u56fe\u7684\u60c5\u51b5\u4e0b\uff0c\u4f30\u8ba1\u540c\u4e00\u56fe\u50cf\u4e2d\u672a\u77e5\u7269\u4f53\u591a\u4e2a\u5b9e\u4f8b\u4e4b\u95f4\u7684\u76f8\u5bf9\u4f4d\u59ff\u3002\u4f5c\u8005\u63d0\u51fa\u514d\u8bad\u7ec3\u65b9\u6cd5PROSE\uff0c\u5e76\u6784\u5efaPRENCH\u57fa\u51c6\u7528\u4e8e\u7cfb\u7edf\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c066D\u4f4d\u59ff\u4f30\u8ba1\u5bf9\u7269\u4f53\u5148\u9a8c\u7684\u4f9d\u8d56\u8fdb\u4e00\u6b65\u964d\u5230\u6700\u4f4e\uff0c\u62d3\u5c55\u4e86\u672a\u77e5\u7269\u4f53\u5b9e\u4f8b\u7ea7\u51e0\u4f55\u7406\u89e3\u7684\u5e94\u7528\u8fb9\u754c\uff1b\u514d\u8bad\u7ec3\u65b9\u6848\u4e5f\u63d0\u5347\u4e86\u5728\u5f00\u653e\u73af\u5883\u4e2d\u7684\u5b9e\u7528\u6027\u3002"}, {"abstract": "Reasoning segmentation converts an implicit linguistic conclusion into a precise mask, requiring both semantic identification and spatial grounding. Existing MLLM-segmenter interfaces either use a special trigger or compress both signals into one context, although they receive different supervision and fail differently. This coupling obscures whether a failure arises from target interpretation or from localization. We present SeGDeP, an explicit what-where interface. A semantic prompt branch and an independent geometric projection path transform resolved MLLM states into semantic features and a DETR-predicted box, which jointly condition a SAM 3 mask decoder. Training first aligns this executable interface, then uses group reward-decoupled policy optimization (GDPO) to balance format, box-IoU, and mask-IoU feedback. SeGDeP-4B reaches 82.7 average cIoU over eight RefCOCO-family splits and 66.0/59.6 gIoU on ReasonSeg val/test while adapting only 0.38% of Qwen3-VL parameters through LoRA. Controlled stage-wise ablations, gradient diagnostics, and prompt interventions further show that the two paths develop complementary semantic and geometric specialization rather than duplicating the same evidence.", "arxiv_id": "2609.08867", "arxiv_url": "https://arxiv.org/abs/2609.08867", "authors": ["Linnan Zhao", "Xu Liu", "Lingling Li", "Licheng Jiao", "Fang Liu", "Wenping Ma"], "brief": "\u8bba\u6587\u63d0\u51fa SeGDeP\uff0c\u4e00\u79cd\u9762\u5411\u63a8\u7406\u5206\u5272\u7684\u663e\u5f0f\u201cwhat-where\u201d\u63a5\u53e3\uff0c\u5c06 MLLM \u7684\u8bed\u4e49\u7406\u89e3\u4e0e\u7a7a\u95f4\u5b9a\u4f4d\u5206\u6210\u4e24\u6761\u72ec\u7acb\u8def\u5f84\uff0c\u5e76\u5171\u540c\u9a71\u52a8 SAM 3 \u751f\u6210\u7cbe\u786e\u63a9\u7801\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08867", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bed\u4e49\u63d0\u793a\u5206\u652f\u8d1f\u8d23\u76ee\u6807\u8bed\u4e49\u8bc6\u522b\uff0c\u51e0\u4f55\u6295\u5f71\u8def\u5f84\u72ec\u7acb\u9884\u6d4b DETR \u98ce\u683c\u8fb9\u754c\u6846\uff0c\u7528\u4e8e\u533a\u5206\u7406\u89e3\u9519\u8bef\u4e0e\u5b9a\u4f4d\u9519\u8bef", "\u8bad\u7ec3\u5206\u4e24\u9636\u6bb5\uff1a\u5148\u5bf9\u9f50\u53ef\u6267\u884c\u63a5\u53e3\uff0c\u518d\u7528 GDPO \u5e73\u8861\u683c\u5f0f\u3001\u6846 IoU \u4e0e\u63a9\u7801 IoU \u5956\u52b1", "SeGDeP-4B \u5728\u516b\u4e2a RefCOCO-family \u5212\u5206\u4e0a\u8fbe\u5230 82.7 \u5e73\u5747 cIoU\uff0c\u5728 ReasonSeg val/test \u4e0a\u8fbe\u5230 66.0/59.6 gIoU\uff0c\u4e14\u4ec5\u901a\u8fc7 LoRA \u8c03\u6574 Qwen3-VL \u7684 0.38% \u53c2\u6570"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u5206\u5272", "\u89c6\u89c9\u5b9a\u4f4d", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08867v1", "published_at": "2026-09-08", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SeGDeP: Semantic- and Geometric-Aware Decoupled Prompts for Reasoning Segmentation", "tldr": "\u89e3\u8026\u8bed\u4e49\u4e0e\u51e0\u4f55\u63d0\u793a\u63d0\u5347\u63a8\u7406\u5206\u5272", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SeGDeP\uff0c\u4e00\u79cd\u9762\u5411\u63a8\u7406\u5206\u5272\u7684\u663e\u5f0f\u201cwhat-where\u201d\u63a5\u53e3\uff0c\u5c06 MLLM \u7684\u8bed\u4e49\u7406\u89e3\u4e0e\u7a7a\u95f4\u5b9a\u4f4d\u5206\u6210\u4e24\u6761\u72ec\u7acb\u8def\u5f84\uff0c\u5e76\u5171\u540c\u9a71\u52a8 SAM 3 \u751f\u6210\u7cbe\u786e\u63a9\u7801\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9 MLLM \u5206\u5272\u63a5\u53e3\u4e2d\u8bed\u4e49\u4e0e\u51e0\u4f55\u4fe1\u53f7\u8026\u5408\u7684\u95ee\u9898\u7ed9\u51fa\u6e05\u6670\u89e3\u6cd5\uff0c\u4e0d\u4ec5\u63d0\u5347\u6027\u80fd\uff0c\u8fd8\u589e\u5f3a\u4e86\u9519\u8bef\u8bca\u65ad\u4e0e\u6a21\u5757\u53ef\u89e3\u91ca\u6027\uff0c\u5bf9\u591a\u6a21\u6001\u63a8\u7406\u5206\u5272\u548c\u53ef\u63a7\u89c6\u89c9 grounding \u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multi-agent traffic simulation seeks diverse, coordinated, and physically realistic futures from maps and observed history. Long-horizon closed-loop generation must reconcile multiple decision time scales while its context evolves with generated states. Existing methods often unfold long futures from the initial scene and resolve intent, interaction, and motion monolithically, weakening cross-scale consistency and adaptation. We present HI-FLOOP, a branch-consistent multi-timescale state-feedback framework. Eight scene-level Worlds represent joint hypotheses, and all agents share the selected World identity throughout an 8-second rollout. Within the branch, an 8-second Goal anchors intent, a 2-second Preview coordinates interactions, and 1-second Control produces physical motion. Every 0.5-second commit feeds back only its executed prefix as new facts, while unexecuted hypotheses never enter factual memory. Joint Preview Interaction (JPI) induces a sparse directed future graph from Preview and uses conflict probabilities and signed arrival-time differences to gate interaction refinement. For generated-state recovery, a prefix-frozen A-to-B cascade lets frozen Model A generate 0-1 seconds, then transfers typed physical state, admissible context, and the branch index, but no latent state, to an independent Model B for re-encoding and 1-2-second recovery. On the full H-D public-validation split of 955 scenarios, one complete S1 run yields an Overall score of 0.689987 with the official evaluator. Under agent-centric oracle evaluation, HI-FLOOP achieves oracle-minADE@8 of 1.196636 m over the 8-second horizon and 0.526 m over the 6-second horizon.", "arxiv_id": "2609.08796", "arxiv_url": "https://arxiv.org/abs/2609.08796", "authors": ["Rx Fan", "Zhan H"], "brief": "\u8bba\u6587\u63d0\u51fa HI-FLOOP\uff0c\u4e00\u4e2a\u7528\u4e8e\u591a\u667a\u80fd\u4f53\u4ea4\u901a\u4eff\u771f\u7684\u5206\u5c42\u3001\u591a\u65f6\u95f4\u5c3a\u5ea6\u72b6\u6001\u53cd\u9988\u6846\u67b6\u3002\u5b83\u5c06\u573a\u666f\u5047\u8bbe\u3001\u957f\u671f\u76ee\u6807\u3001\u4e2d\u671f\u4ea4\u4e92\u9884\u89c8\u548c\u77ed\u671f\u7269\u7406\u63a7\u5236\u89e3\u8026\uff0c\u5e76\u901a\u8fc7\u95ed\u73af\u53cd\u9988\u751f\u6210\u66f4\u4e00\u81f4\u76848\u79d2\u672a\u6765\u8f68\u8ff9\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08796", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u75288\u4e2a\u573a\u666f\u7ea7 World \u8868\u793a\u8054\u5408\u672a\u6765\u5047\u8bbe\uff0c\u6240\u6709\u4ea4\u901a\u53c2\u4e0e\u8005\u5728\u540c\u4e008\u79d2 rollout \u4e2d\u5171\u4eab\u4e00\u81f4\u7684\u5206\u652f\u8eab\u4efd\u3002", "\u75288\u79d2 Goal\u30012\u79d2 Preview\u30011\u79d2 Control \u5206\u522b\u5904\u7406\u610f\u56fe\u3001\u4ea4\u4e92\u534f\u8c03\u548c\u7269\u7406\u8fd0\u52a8\uff0c\u5e76\u6bcf0.5\u79d2\u4ec5\u5c06\u5df2\u6267\u884c\u524d\u7f00\u5199\u56de\u4e8b\u5b9e\u8bb0\u5fc6\u3002", "\u63d0\u51fa Joint Preview Interaction\uff0c\u901a\u8fc7\u7a00\u758f\u6709\u5411\u672a\u6765\u4ea4\u4e92\u56fe\u3001\u51b2\u7a81\u6982\u7387\u548c\u5230\u8fbe\u65f6\u95f4\u5dee\u6765\u7b5b\u9009\u5e76\u7ec6\u5316\u591a\u8f66\u4ea4\u4e92\u3002", "\u5728955\u4e2a H-D public-validation \u573a\u666f\u4e0a Overall \u5f97\u52060.689987\uff0cagent-centric oracle-minADE@8 \u4e3a1.196636\u7c73\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u4ea4\u901a\u4eff\u771f", "\u591a\u667a\u80fd\u4f53", "\u8f68\u8ff9\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08796v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Hi-FLoop: Hierarchical State-Feedback Loops for Multi-Timescale World Modeling", "tldr": "\u5206\u5c42\u53cd\u9988\u63d0\u5347\u957f\u65f6\u4ea4\u901a\u4e16\u754c\u5efa\u6a21", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HI-FLOOP\uff0c\u4e00\u4e2a\u7528\u4e8e\u591a\u667a\u80fd\u4f53\u4ea4\u901a\u4eff\u771f\u7684\u5206\u5c42\u3001\u591a\u65f6\u95f4\u5c3a\u5ea6\u72b6\u6001\u53cd\u9988\u6846\u67b6\u3002\u5b83\u5c06\u573a\u666f\u5047\u8bbe\u3001\u957f\u671f\u76ee\u6807\u3001\u4e2d\u671f\u4ea4\u4e92\u9884\u89c8\u548c\u77ed\u671f\u7269\u7406\u63a7\u5236\u89e3\u8026\uff0c\u5e76\u901a\u8fc7\u95ed\u73af\u53cd\u9988\u751f\u6210\u66f4\u4e00\u81f4\u76848\u79d2\u672a\u6765\u8f68\u8ff9\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u957f\u65f6\u95ed\u73af\u4ea4\u901a\u751f\u6210\u4e2d\u5e38\u89c1\u7684\u8de8\u65f6\u95f4\u5c3a\u5ea6\u4e0d\u4e00\u81f4\u95ee\u9898\uff0c\u663e\u5f0f\u533a\u5206\u5047\u8bbe\u4e0e\u4e8b\u5b9e\uff0c\u5e76\u8ba9\u6a21\u578b\u968f\u751f\u6210\u72b6\u6001\u6301\u7eed\u81ea\u9002\u5e94\u66f4\u65b0\uff0c\u5bf9\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u548c\u8f68\u8ff9\u9884\u6d4b\u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Many emerging video language modeling tasks require systems to move beyond clip-level abstraction and model visual content as it unfolds over extended time horizons. However, most existing video datasets rely on coarse or sparsely aligned supervision, which compresses temporal variation and limits the ability of models to learn reusable representations of continuous visual dynamics. We introduce Kairos, a video dataset for video-language modeling with time-resolved annotations. Kairos consists of long-duration videos, ranging from ten minutes to half an hour, annotated with fine-grained temporal alignment. The annotations capture ongoing actions, entity appearances and attributes, interactions, and evolving contextual cues along the video timeline. This time-resolved structure supports fine-grained evaluation, long-range modeling and reasoning, instruction data construction, representation learning, and video generation. Kairos provides a general-purpose foundation for modeling visual experiences over time.", "arxiv_id": "2609.08755", "arxiv_url": "https://arxiv.org/abs/2609.08755", "authors": ["Ruibo Ming", "Lei Sun", "Deheng Zhang", "He Zhang", "Jialu Li", "Jian Wang", "Zhendong Li", "Mengshun Hu", "Danda Pani Paudel", "Luc Van Gool", "Jinjin Gu"], "brief": "Kairos \u662f\u4e00\u4e2a\u7528\u4e8e\u89c6\u9891-\u8bed\u8a00\u5efa\u6a21\u7684\u957f\u65f6\u957f\u89c6\u9891\u6570\u636e\u96c6\uff0c\u8986\u76d6\u7ea610\u523030\u5206\u949f\u7684\u89c6\u9891\u5e76\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u65f6\u95f4\u5bf9\u9f50\u6807\u6ce8\u3002\u5176\u6807\u6ce8\u6cbf\u65f6\u95f4\u8f74\u8bb0\u5f55\u52a8\u4f5c\u3001\u5b9e\u4f53\u5916\u89c2\u4e0e\u5c5e\u6027\u3001\u4ea4\u4e92\u4ee5\u53ca\u4e0a\u4e0b\u6587\u53d8\u5316\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08755", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u76f8\u6bd4\u4f20\u7edf\u7c97\u7c92\u5ea6\u6216\u7a00\u758f\u5bf9\u9f50\u7684\u89c6\u9891\u6570\u636e\u96c6\uff0cKairos \u5f3a\u8c03\u8fde\u7eed\u89c6\u89c9\u52a8\u6001\u7684\u65f6\u95f4\u5206\u8fa8\u76d1\u7763", "\u652f\u6301\u957f\u7a0b\u89c6\u9891\u7406\u89e3\u3001\u7ec6\u7c92\u5ea6\u8bc4\u6d4b\u3001\u89c6\u9891\u63a8\u7406\u3001\u6307\u4ee4\u6570\u636e\u6784\u5efa\u548c\u8868\u5f81\u5b66\u4e60\u7b49\u4efb\u52a1", "\u6807\u6ce8\u5185\u5bb9\u8986\u76d6\u52a8\u4f5c\u6301\u7eed\u8fc7\u7a0b\u3001\u5b9e\u4f53\u53d8\u5316\u3001\u4ea4\u4e92\u5173\u7cfb\u548c\u573a\u666f\u4e0a\u4e0b\u6587\u6f14\u5316"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u957f\u89c6\u9891\u5efa\u6a21", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08755v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Kairos: A Dataset for Fine-Grained Video-Language Modeling over Space, Time, and Dynamics", "tldr": "\u9762\u5411\u957f\u89c6\u9891\u7ec6\u7c92\u5ea6\u65f6\u5e8f\u6807\u6ce8\u7684\u6570\u636e\u96c6", "upvotes": 0, "what_it_is": "Kairos \u662f\u4e00\u4e2a\u7528\u4e8e\u89c6\u9891-\u8bed\u8a00\u5efa\u6a21\u7684\u957f\u65f6\u957f\u89c6\u9891\u6570\u636e\u96c6\uff0c\u8986\u76d6\u7ea610\u523030\u5206\u949f\u7684\u89c6\u9891\u5e76\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u65f6\u95f4\u5bf9\u9f50\u6807\u6ce8\u3002\u5176\u6807\u6ce8\u6cbf\u65f6\u95f4\u8f74\u8bb0\u5f55\u52a8\u4f5c\u3001\u5b9e\u4f53\u5916\u89c2\u4e0e\u5c5e\u6027\u3001\u4ea4\u4e92\u4ee5\u53ca\u4e0a\u4e0b\u6587\u53d8\u5316\u3002", "why_notable": "\u5b83\u4e3a\u957f\u89c6\u9891\u4e2d\u7684\u7a7a\u95f4\u3001\u65f6\u95f4\u4e0e\u52a8\u6001\u5efa\u6a21\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u7684\u6570\u636e\u57fa\u7840\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u89c6\u9891\u8bed\u8a00\u6a21\u578b\u4ece\u7247\u6bb5\u7ea7\u7406\u89e3\u8d70\u5411\u8fde\u7eed\u89c6\u89c9\u7ecf\u9a8c\u5efa\u6a21\u3002"}, {"abstract": "Egocentric 4D interaction forecasting aims to anticipate both where future interactions will occur in 3D and how the human body will move to realize them, providing an important capability for assistive robotics and human-computer interaction. Existing methods struggle to translate semantic understanding into precise continuous 3D localization and to balance motion diversity with structural consistency in pose forecasting. More fundamentally, these tasks are often modeled separately, leaving the continuous geometric and temporal correspondence between interaction locations and body motion insufficiently captured. To address these challenges, we introduce Coherent4D, a large-scale egocentric dataset for continuous 4D interaction forecasting, comprising approximately 233K samples across three domains. Each sample pairs a sequence of future 3D interaction locations with corresponding full-body poses, aligned in time and expressed in a shared coordinate system. We also provide evaluation metrics in continuous space. Building on this formulation, we propose HIGFlow, a Hand Interaction Guided Residual Flow framework that models forecasting as a cascaded where-to-how process. HIGFlow first forecasts continuous future interaction locations by combining semantic grounding with short-horizon visual dynamics, and then uses the predicted location sequence to condition a deterministic motion anchor and residual Flow Matching for diverse yet structurally consistent full-body motion forecasting. Extensive experiments across all three domains demonstrate consistent improvements over representative baselines on both location and pose forecasting, while ablations validate the contributions of the proposed components. The project page is available at https://corrineqiu.github.io/from-where-to-how/.", "arxiv_id": "2609.08636", "arxiv_url": "https://arxiv.org/abs/2609.08636", "authors": ["Qiaohui Chu", "Haoyu Zhang", "Meng Liu", "Haoxiang Shi", "Dongmei Jiang", "Liqiang Nie"], "brief": "\u8bba\u6587\u63d0\u51fa Coherent4D\uff0c\u4e00\u4e2a\u9762\u5411\u7b2c\u4e00\u89c6\u89d2\u8fde\u7eed4D\u4ea4\u4e92\u9884\u6d4b\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u5c06\u672a\u67653D\u4ea4\u4e92\u4f4d\u7f6e\u4e0e\u5168\u8eab\u59ff\u6001\u5728\u7edf\u4e00\u5750\u6807\u548c\u65f6\u95f4\u8f74\u4e0a\u914d\u5bf9\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa HIGFlow\uff0c\u4ee5\u201c\u5148\u9884\u6d4b\u4ea4\u4e92\u4f4d\u7f6e\u3001\u518d\u751f\u6210\u8eab\u4f53\u52a8\u4f5c\u201d\u7684\u7ea7\u8054\u6846\u67b6\u5b9e\u73b0\u4f4d\u7f6e\u4e0e\u59ff\u6001\u8054\u5408\u9884\u6d4b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08636", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Coherent4D \u5305\u542b\u7ea623.3\u4e07\u6837\u672c\uff0c\u8986\u76d6\u4e09\u4e2a\u9886\u57df\uff0c\u6bcf\u4e2a\u6837\u672c\u63d0\u4f9b\u672a\u67653D\u4ea4\u4e92\u4f4d\u7f6e\u5e8f\u5217\u53ca\u5bf9\u5e94\u5168\u8eab\u59ff\u6001\u3002", "HIGFlow \u5148\u7ed3\u5408\u8bed\u4e49\u5b9a\u4f4d\u4e0e\u77ed\u65f6\u89c6\u89c9\u52a8\u6001\u9884\u6d4b\u8fde\u7eed\u672a\u6765\u4ea4\u4e92\u4f4d\u7f6e\uff0c\u518d\u7528\u4f4d\u7f6e\u5e8f\u5217\u6761\u4ef6\u5316\u52a8\u4f5c\u751f\u6210\u3002", "\u901a\u8fc7\u786e\u5b9a\u6027\u8fd0\u52a8\u951a\u70b9\u4e0e\u6b8b\u5dee Flow Matching\uff0c\u5728\u4fdd\u6301\u8eab\u4f53\u7ed3\u6784\u4e00\u81f4\u6027\u7684\u540c\u65f6\u751f\u6210\u591a\u6837\u5316\u5168\u8eab\u52a8\u4f5c\u3002"], "keywords": ["\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "4D\u9884\u6d4b", "\u4eba\u4f53\u52a8\u4f5c", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08636v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Where to How: Continuous 4D Interaction Forecasting from Egocentric Video", "tldr": "\u4ece\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u8fde\u7eed\u9884\u6d4b4D\u4ea4\u4e92\u4e0e\u52a8\u4f5c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Coherent4D\uff0c\u4e00\u4e2a\u9762\u5411\u7b2c\u4e00\u89c6\u89d2\u8fde\u7eed4D\u4ea4\u4e92\u9884\u6d4b\u7684\u5927\u89c4\u6a21\u6570\u636e\u96c6\uff0c\u5e76\u5c06\u672a\u67653D\u4ea4\u4e92\u4f4d\u7f6e\u4e0e\u5168\u8eab\u59ff\u6001\u5728\u7edf\u4e00\u5750\u6807\u548c\u65f6\u95f4\u8f74\u4e0a\u914d\u5bf9\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa HIGFlow\uff0c\u4ee5\u201c\u5148\u9884\u6d4b\u4ea4\u4e92\u4f4d\u7f6e\u3001\u518d\u751f\u6210\u8eab\u4f53\u52a8\u4f5c\u201d\u7684\u7ea7\u8054\u6846\u67b6\u5b9e\u73b0\u4f4d\u7f6e\u4e0e\u59ff\u6001\u8054\u5408\u9884\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u4ea4\u4e92\u53d1\u751f\u5728\u54ea\u91cc\u201d\u548c\u201c\u8eab\u4f53\u5982\u4f55\u79fb\u52a8\u201d\u653e\u5165\u8fde\u7eed4D\u51e0\u4f55\u65f6\u7a7a\u6846\u67b6\u4e2d\u7edf\u4e00\u5efa\u6a21\uff0c\u8865\u8db3\u4e86\u4ee5\u5f80\u4f4d\u7f6e\u9884\u6d4b\u4e0e\u59ff\u6001\u9884\u6d4b\u5272\u88c2\u7684\u95ee\u9898\uff0c\u5bf9\u8f85\u52a9\u673a\u5668\u4eba\u3001\u5177\u8eab\u611f\u77e5\u548c\u4eba\u673a\u4ea4\u4e92\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reliable video generation requires more than high-quality frames to form a coherent story: a model must maintain a persistent state, transporting visual attributes such as identity, scene layout, motion, and fine details across time. Existing training-free methods mainly strengthen cross-frame attention or analyze local attention entropy, but these views do not reveal whether temporal interactions stay in a healthy transport regime. In this work, we study video generation through the perspective of Temporal State Transport. We introduce Spectral Tension, a signed diagnostic that compares local attention diffuseness with global spectral diversity, and use it to identify two opposite temporal failures: fragmented transport and over-mixing hotspots. Based on this diagnosis, we propose Spectral Transport Homeostasis, a training-free regulator that softly corrects pathological temporal states while largely preserving balanced ones. Experiments on pretrained video generation models show that the original model often occupies imbalanced temporal regimes, whereas our method selectively applies larger corrections to the worst temporal hotspots and improves temporal consistency and visual quality without finetuning. Code: https://github.com/lytang63/temporal-state-transport", "arxiv_id": "2609.08505", "arxiv_url": "https://arxiv.org/abs/2609.08505", "authors": ["Luyao Tang", "Bingjun Luo", "Dong Yi", "Jialin Guo", "Haoning Xi", "Cheng Chen", "Yizhou Yu", "Chaoqi Chen"], "brief": "\u8bba\u6587\u4ece\u201c\u65f6\u95f4\u72b6\u6001\u4f20\u8f93\u201d\u89c6\u89d2\u5206\u6790\u89c6\u9891\u751f\u6210\u4e2d\u7684\u8de8\u5e27\u4e00\u81f4\u6027\u95ee\u9898\uff0c\u63d0\u51fa Spectral Tension \u8bca\u65ad\u6ce8\u610f\u529b\u7684\u5c40\u90e8\u6269\u6563\u4e0e\u5168\u5c40\u8c31\u591a\u6837\u6027\u662f\u5426\u5931\u8861\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 Spectral Transport Homeostasis \u8c03\u8282\u5668\uff0c\u81ea\u52a8\u4fee\u6b63\u788e\u7247\u5316\u4f20\u8f93\u548c\u8fc7\u5ea6\u6df7\u5408\u70ed\u70b9\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08505", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Spectral Tension \u662f\u4e00\u79cd\u5e26\u7b26\u53f7\u8bca\u65ad\u6307\u6807\uff0c\u7528\u4e8e\u533a\u5206\u4e24\u7c7b\u76f8\u53cd\u65f6\u5e8f\u6545\u969c\uff1a\u8de8\u5e27\u72b6\u6001\u4f20\u8f93\u788e\u7247\u5316\u4e0e\u5c40\u90e8\u8fc7\u5ea6\u6df7\u5408\u3002", "\u65b9\u6cd5\u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u6ce8\u610f\u529b\u7ed3\u6784\u8fdb\u884c\u8f6f\u8c03\u8282\uff0c\u65e0\u9700\u5fae\u8c03\u6216\u91cd\u65b0\u8bad\u7ec3\u3002", "\u5b9e\u9a8c\u663e\u793a\u539f\u59cb\u6a21\u578b\u5e38\u5904\u4e8e\u65f6\u5e8f\u5931\u8861\u72b6\u6001\uff0c\u8be5\u65b9\u6cd5\u80fd\u5bf9\u6700\u4e25\u91cd\u70ed\u70b9\u65bd\u52a0\u66f4\u5927\u4fee\u6b63\uff0c\u63d0\u5347\u65f6\u95f4\u4e00\u81f4\u6027\u4e0e\u89c6\u89c9\u8d28\u91cf\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u65f6\u5e8f\u4e00\u81f4\u6027", "\u6ce8\u610f\u529b\u673a\u5236", "\u8c31\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08505v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Temporal State Transport in Video Generation: Diagnosing and Correcting Spectral Imbalance", "tldr": "\u7528\u8c31\u8bca\u65ad\u4fee\u6b63\u89c6\u9891\u751f\u6210\u65f6\u5e8f\u5931\u8861", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ece\u201c\u65f6\u95f4\u72b6\u6001\u4f20\u8f93\u201d\u89c6\u89d2\u5206\u6790\u89c6\u9891\u751f\u6210\u4e2d\u7684\u8de8\u5e27\u4e00\u81f4\u6027\u95ee\u9898\uff0c\u63d0\u51fa Spectral Tension \u8bca\u65ad\u6ce8\u610f\u529b\u7684\u5c40\u90e8\u6269\u6563\u4e0e\u5168\u5c40\u8c31\u591a\u6837\u6027\u662f\u5426\u5931\u8861\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 Spectral Transport Homeostasis \u8c03\u8282\u5668\uff0c\u81ea\u52a8\u4fee\u6b63\u788e\u7247\u5316\u4f20\u8f93\u548c\u8fc7\u5ea6\u6df7\u5408\u70ed\u70b9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u53ea\u662f\u589e\u5f3a\u8de8\u5e27\u6ce8\u610f\u529b\uff0c\u800c\u662f\u63d0\u51fa\u4e86\u53ef\u8bca\u65ad\u3001\u53ef\u5e72\u9884\u7684\u8c31\u89c6\u89d2\u6765\u7406\u89e3\u89c6\u9891\u751f\u6210\u7684\u65f6\u5e8f\u72b6\u6001\u4f20\u8f93\uff0c\u4e3a\u8bad\u7ec3-free \u63d0\u5347\u89c6\u9891\u4e00\u81f4\u6027\u63d0\u4f9b\u4e86\u66f4\u5177\u89e3\u91ca\u6027\u7684\u5de5\u5177\u3002"}, {"abstract": "Unified multimodal models integrate visual understanding and generation within a single network, yet the two capabilities are commonly optimized as separate tasks. We introduce Generative Grounding Feedback(GGF), a self-evolving post-training framework that uses only text prompts and the model\u0027s own visual experience. Given a prompt, the model first generates a visual ``dream.\u0027\u0027 Flow-level feedback compares text-, image-, and repair-conditioned predictions at the same noisy latent state, transferring image-grounded generation directions to the prompt condition. Dream replay grounding replays this dream through captioning and re-imagination, training claim-level evidence to remain consistent across the replay while separating unrelated visual experiences. Jointly optimized, these two directions let generation provide visual grounding for understanding and understanding refine subsequent generation without paired image--text supervision. Experiments across unified models with different understanding--generation integration designs show consistent improvements in text-to-image generation together with modest gains in visual understanding.", "arxiv_id": "2609.08282", "arxiv_url": "https://arxiv.org/abs/2609.08282", "authors": ["Ke Hao", "Yuanzhi Liang", "Tingxi Chen", "Rui Li", "Haibin Huang", "Chi Zhang", "Yun Gu", "Xuelong Li"], "brief": "\u8bba\u6587\u63d0\u51fa Generative Grounding Feedback\uff08GGF\uff09\uff0c\u4e00\u79cd\u9762\u5411\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u540e\u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u4ec5\u4f9d\u8d56\u6587\u672c\u63d0\u793a\u548c\u6a21\u578b\u81ea\u8eab\u751f\u6210\u7684\u89c6\u89c9\u201c\u68a6\u5883\u201d\uff0c\u8ba9\u751f\u6210\u4e0e\u7406\u89e3\u80fd\u529b\u76f8\u4e92\u53cd\u9988\u3001\u5171\u540c\u63d0\u5347\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08282", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Flow-level feedback \u5728\u540c\u4e00\u566a\u58f0\u6f5c\u53d8\u91cf\u72b6\u6001\u4e0b\u6bd4\u8f83\u6587\u672c\u3001\u56fe\u50cf\u548c\u4fee\u590d\u6761\u4ef6\u9884\u6d4b\uff0c\u628a\u56fe\u50cf\u951a\u5b9a\u7684\u751f\u6210\u65b9\u5411\u8fc1\u79fb\u5230\u6587\u672c\u6761\u4ef6\u4e2d", "Dream replay grounding \u901a\u8fc7\u751f\u6210\u56fe\u50cf\u7684\u63cf\u8ff0\u4e0e\u518d\u60f3\u8c61\uff0c\u7ea6\u675f\u58f0\u660e\u7ea7\u8bc1\u636e\u5728\u56de\u653e\u8fc7\u7a0b\u4e2d\u4fdd\u6301\u4e00\u81f4\uff0c\u5e76\u533a\u5206\u65e0\u5173\u89c6\u89c9\u7ecf\u9a8c", "\u65e0\u9700\u6210\u5bf9\u56fe\u6587\u76d1\u7763\uff0c\u5728\u591a\u79cd\u7406\u89e3-\u751f\u6210\u4e00\u4f53\u5316\u67b6\u6784\u4e0a\u63d0\u5347\u6587\u672c\u5230\u56fe\u50cf\u751f\u6210\uff0c\u5e76\u5e26\u6765\u89c6\u89c9\u7406\u89e3\u7684\u5c0f\u5e45\u589e\u76ca"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u751f\u6210", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u6a21\u578b\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08282v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Dreaming in Flow: Generative Grounding Feedback for Self-Evolving Unified Multimodal Models", "tldr": "\u8ba9\u591a\u6a21\u6001\u6a21\u578b\u7528\u81ea\u751f\u6210\u56fe\u50cf\u81ea\u6211\u8fdb\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Generative Grounding Feedback\uff08GGF\uff09\uff0c\u4e00\u79cd\u9762\u5411\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u540e\u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u4ec5\u4f9d\u8d56\u6587\u672c\u63d0\u793a\u548c\u6a21\u578b\u81ea\u8eab\u751f\u6210\u7684\u89c6\u89c9\u201c\u68a6\u5883\u201d\uff0c\u8ba9\u751f\u6210\u4e0e\u7406\u89e3\u80fd\u529b\u76f8\u4e92\u53cd\u9988\u3001\u5171\u540c\u63d0\u5347\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u63a2\u7d22\u4e86\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u81ea\u76d1\u7763\u81ea\u8fdb\u5316\u8def\u5f84\uff0c\u628a\u6a21\u578b\u81ea\u8eab\u751f\u6210\u7ed3\u679c\u8f6c\u5316\u4e3a\u89c6\u89c9 grounding \u4fe1\u53f7\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11\u5bf9\u4eba\u5de5\u56fe\u6587\u6570\u636e\u7684\u4f9d\u8d56\uff0c\u5e76\u7f13\u89e3\u7406\u89e3\u4e0e\u751f\u6210\u5206\u79bb\u4f18\u5316\u7684\u95ee\u9898\u3002"}, {"abstract": "Open vocabulary 3D semantic segmentation methods typically lift CLIP features into 3D. This embeds points in a joint vision-language space known to behave like a bag-of-words on compositional tasks. Furthermore, even annotation free variants often require a large 3D training corpus and a dedicated 3D encoder per domain. Instead we use a vision-language model purely as a translator. It produces structured, entity-level descriptions of each posed image. These descriptions are grounded, projected, and aggregated directly in a general-purpose, language-only embedding space, with no 3D training corpus or encoder required. On ScanNet++, our pipeline is competitive with strong annotation free baselines trained on ScanNet. On a 5-building cultural heritage benchmark, raw scores initially favor a CLIP-based variant, but a single systematic vocabulary correction reverses this ranking. An effect confirmed by a second, independent correction on a different class, indicating that language-space embeddings track physical content more faithfully. This fidelity extends to genuinely out-of-vocabulary (OOV) objects on ScanNet++ proving that language-space embeddings separate presence from absence objects far more sharply than CLIP-based embeddings do. GoDeep also localize these OOV objects within the scene, all without any 2D-3D annotation. Because every representation remains discrete text, predictions are also explainable at the point level. Finally, exploiting both a heuristic weighting, that favors precise over merely frequent observations and GoDeep\u0027s explainability property, we propose an aggregation strategy, as a proof of concept, that favors finer elements localization.", "arxiv_id": "2609.09082", "arxiv_url": "https://arxiv.org/abs/2609.09082", "authors": ["Thodoris Betsas", "Anastasios Doulamis", "Andreas Georgopoulos"], "brief": "GoDeep \u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4ec5\u4f5c\u4e3a\u201c\u7ffb\u8bd1\u5668\u201d\uff0c\u628a\u5e26\u4f4d\u59ff\u56fe\u50cf\u8f6c\u6210\u7ed3\u6784\u5316\u5b9e\u4f53\u7ea7\u6587\u672c\u63cf\u8ff0\uff0c\u518d\u6295\u5f71\u5e76\u805a\u5408\u5230\u7eaf\u8bed\u8a00\u5d4c\u5165\u7a7a\u95f4\u4e2d\u5b8c\u62103D\u8bed\u4e49\u7406\u89e3\u3002\u65b9\u6cd5\u65e0\u97003D\u8bad\u7ec3\u8bed\u6599\u3001\u4e13\u75283D\u7f16\u7801\u5668\u62162D-3D\u6807\u6ce8\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09082", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u540c\u4e8e\u76f4\u63a5\u63d0\u5347 CLIP \u7279\u5f81\uff0cGoDeep \u805a\u5408\u79bb\u6563\u6587\u672c\u63cf\u8ff0\u7684\u8bed\u8a00\u5d4c\u5165\uff0c\u7f13\u89e3 CLIP \u5728\u7ec4\u5408\u8bed\u4e49\u4e0a\u7c7b\u4f3c\u201c\u8bcd\u888b\u201d\u7684\u95ee\u9898", "\u5728 ScanNet++ \u4e0a\u53ef\u4e0e\u4f7f\u7528 ScanNet \u8bad\u7ec3\u7684\u5f3a\u514d\u6807\u6ce8\u57fa\u7ebf\u7ade\u4e89\uff0c\u5e76\u80fd\u66f4\u6e05\u6670\u5730\u533a\u5206\u771f\u5b9e\u5b58\u5728\u4e0e\u4e0d\u5b58\u5728\u7684 OOV \u7269\u4f53", "\u6587\u672c\u5316\u8868\u793a\u5e26\u6765\u70b9\u7ea7\u53ef\u89e3\u91ca\u6027\uff0c\u5e76\u7ed3\u5408\u504f\u5411\u7cbe\u786e\u89c2\u6d4b\u7684\u52a0\u6743\u805a\u5408\u7b56\u7565\u63d0\u5347\u7ec6\u7c92\u5ea6\u5143\u7d20\u5b9a\u4f4d"], "keywords": ["3D\u7406\u89e3", "\u5f00\u653e\u8bcd\u6c47", "\u591a\u6a21\u6001", "\u8bed\u4e49\u5206\u5272"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09082v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "GoDeep: Annotation-Free Open-Vocabulary 3D Scene Understanding via Language-Space Lifting", "tldr": "\u7528\u8bed\u8a00\u7a7a\u95f4\u63d0\u5347\u5b9e\u73b0\u514d\u6807\u6ce8\u5f00\u653e\u8bcd\u6c473D\u7406\u89e3", "upvotes": 0, "what_it_is": "GoDeep \u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4ec5\u4f5c\u4e3a\u201c\u7ffb\u8bd1\u5668\u201d\uff0c\u628a\u5e26\u4f4d\u59ff\u56fe\u50cf\u8f6c\u6210\u7ed3\u6784\u5316\u5b9e\u4f53\u7ea7\u6587\u672c\u63cf\u8ff0\uff0c\u518d\u6295\u5f71\u5e76\u805a\u5408\u5230\u7eaf\u8bed\u8a00\u5d4c\u5165\u7a7a\u95f4\u4e2d\u5b8c\u62103D\u8bed\u4e49\u7406\u89e3\u3002\u65b9\u6cd5\u65e0\u97003D\u8bad\u7ec3\u8bed\u6599\u3001\u4e13\u75283D\u7f16\u7801\u5668\u62162D-3D\u6807\u6ce8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5f00\u653e\u8bcd\u6c473D\u573a\u666f\u7406\u89e3\u53ef\u4ee5\u6446\u81313D\u8bad\u7ec3\u8bed\u6599\u548c\u9886\u57df\u4e13\u7528\u7f16\u7801\u5668\uff0c\u4e14\u5728\u771f\u6b63\u672a\u77e5\u7c7b\u522b\u5b9a\u4f4d\u4e0e\u53ef\u89e3\u91ca\u6027\u4e0a\u4f18\u4e8e\u5e38\u89c1 CLIP \u7279\u5f81\u63d0\u5347\u8def\u7ebf\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "State-of-the-art vision models process images in their entirety, lacking the ability to selectively zoom in on relevant regions. This limitation is particularly acute in scenarios where processing must be conditioned on a specific task - such as instance detection, which requires localizing a specific object in a high-resolution, cluttered scene. In such settings, critical details are easily lost as images are often resized to match the model dimensions and computational constraints. We introduce Coarse-to-Fine Glimpse-based Active Perception (CF-GAP), a task-driven front-end that enhances high-resolution processing of existing instance detectors. CF-GAP selectively directs a sequence of limited view glimpses across the scene, utilizing task information to iteratively refine focus on the most relevant regions. These localized regions are then processed at high resolution by a downstream instance detector. By avoiding full-image processing and eliminating irrelevant confounding information, CF-GAP improves Average Precision (AP) by up to 20% across various state-of-the-art instance detectors on the HR-InsDet and Robotools benchmarks, while further enabling lightweight detectors to outperform their larger counterparts.", "arxiv_id": "2609.09025", "arxiv_url": "https://arxiv.org/abs/2609.09025", "authors": ["Oleh Kolner", "Thomas Ortner", "Stanis\u0142aw Wo\u017aniak", "Angeliki Pantazi"], "brief": "\u8bba\u6587\u63d0\u51fa CF-GAP\uff0c\u4e00\u79cd\u4efb\u52a1\u9a71\u52a8\u7684\u7c97\u5230\u7ec6\u4e3b\u52a8\u611f\u77e5\u524d\u7aef\uff0c\u7528\u6709\u9650\u89c6\u91ce\u7684\u8fde\u7eed\u201c\u51dd\u89c6\u201d\u5728\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\u4e2d\u9010\u6b65\u805a\u7126\u76ee\u6807\u76f8\u5173\u533a\u57df\u3002\u5b83\u5c06\u9009\u4e2d\u7684\u5c40\u90e8\u533a\u57df\u4ea4\u7ed9\u73b0\u6709\u5b9e\u4f8b\u68c0\u6d4b\u5668\u9ad8\u5206\u8fa8\u7387\u5904\u7406\uff0c\u4ece\u800c\u907f\u514d\u6574\u56fe\u7f29\u653e\u5e26\u6765\u7684\u7ec6\u8282\u4e22\u5931\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09025", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u4efb\u52a1\u4fe1\u606f\u5f15\u5bfc\u51dd\u89c6\u5e8f\u5217\uff0c\u4ece\u7c97\u7565\u5168\u5c40\u5b9a\u4f4d\u9010\u6b65\u7ec6\u5316\u5230\u5173\u952e\u5c40\u90e8\u533a\u57df", "\u53ef\u4f5c\u4e3a\u73b0\u6709\u5b9e\u4f8b\u68c0\u6d4b\u5668\u7684\u524d\u7aef\u6a21\u5757\uff0c\u65e0\u9700\u6574\u56fe\u9ad8\u5206\u8fa8\u7387\u5904\u7406\uff0c\u51cf\u5c11\u65e0\u5173\u80cc\u666f\u5e72\u6270", "\u5728 HR-InsDet \u548c Robotools \u57fa\u51c6\u4e0a\uff0c\u4f7f\u591a\u79cd SOTA \u68c0\u6d4b\u5668 AP \u6700\u9ad8\u63d0\u5347 20%\uff0c\u5e76\u8ba9\u8f7b\u91cf\u68c0\u6d4b\u5668\u8d85\u8fc7\u66f4\u5927\u6a21\u578b"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u5b9e\u4f8b\u68c0\u6d4b", "\u4e3b\u52a8\u611f\u77e5", "\u9ad8\u5206\u8fa8\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09025v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Task-driven Processing with Coarse-to-Fine Glimpse-based Active Perception", "tldr": "\u7528\u4e3b\u52a8\u51dd\u89c6\u63d0\u5347\u9ad8\u5206\u8fa8\u7387\u5b9e\u4f8b\u68c0\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CF-GAP\uff0c\u4e00\u79cd\u4efb\u52a1\u9a71\u52a8\u7684\u7c97\u5230\u7ec6\u4e3b\u52a8\u611f\u77e5\u524d\u7aef\uff0c\u7528\u6709\u9650\u89c6\u91ce\u7684\u8fde\u7eed\u201c\u51dd\u89c6\u201d\u5728\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\u4e2d\u9010\u6b65\u805a\u7126\u76ee\u6807\u76f8\u5173\u533a\u57df\u3002\u5b83\u5c06\u9009\u4e2d\u7684\u5c40\u90e8\u533a\u57df\u4ea4\u7ed9\u73b0\u6709\u5b9e\u4f8b\u68c0\u6d4b\u5668\u9ad8\u5206\u8fa8\u7387\u5904\u7406\uff0c\u4ece\u800c\u907f\u514d\u6574\u56fe\u7f29\u653e\u5e26\u6765\u7684\u7ec6\u8282\u4e22\u5931\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u9ad8\u5206\u8fa8\u7387\u3001\u6742\u4e71\u573a\u666f\u4e2d\u7684\u7279\u5b9a\u76ee\u6807\u68c0\u6d4b\u75db\u70b9\uff0c\u63d0\u4f9b\u4e86\u66f4\u9ad8\u6548\u7684\u9009\u62e9\u6027\u89c6\u89c9\u5904\u7406\u8303\u5f0f\uff0c\u517c\u5177\u7cbe\u5ea6\u63d0\u5347\u548c\u8ba1\u7b97\u8282\u7701\u6f5c\u529b\uff0c\u5bf9\u673a\u5668\u4eba\u89c6\u89c9\u548c\u5b9e\u4f8b\u68c0\u6d4b\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present DXPR, a depth-based cross-modal place recognition (CMPR) framework that uses vision foundation models (VFMs) to match monocular camera queries against a LiDAR map without modality-specific encoders. This enables robots and autonomous vehicles to robustly localize using only cameras within pre-built LiDAR maps, even under severe seasonal, weather, and illumination changes. The key idea is to convert both camera images and LiDAR scans into a unified depth image representation so that a single VFM backbone with an aggregation head can learn modality-invariant global descriptors. To make pairwise metric learning faithful to scene geometry, we introduce a geometry-aware overlap miner: after cross-modal scale alignment of camera and LiDAR depth, we forward-warp measurements between views to compute a pixel-level overlap score. This score relabels ambiguous pairs and adaptively modulates the positive margin in a multi-similarity loss to avoid overfitting on weakly overlapping views. Extensive experiments on KITTI odometry and Boreas demonstrate strong performance and robustness across seasons, weather, and day/night. On KITTI, DXPR achieves near-perfect Recall@1 on most sequences and outperforms prior CMPR baselines. On Boreas, DXPR achieves intra-sequence performance on par with a strong single-modal baseline (DINOv2-SALAD), while showing clear improvements in the more challenging inter-sequence setting. Compared with RangeBEV, our method consistently performs better in both intra- and inter-sequence evaluations, demonstrating robustness under diverse seasonal and illumination changes.", "arxiv_id": "2609.09005", "arxiv_url": "https://arxiv.org/abs/2609.09005", "authors": ["Yungsoo Han", "Youngseok Jang", "Seungwon Roh", "Jeongyeon Seo", "H. Jin Kim"], "brief": "DXPR \u662f\u4e00\u79cd\u57fa\u4e8e\u6df1\u5ea6\u56fe\u7684\u8de8\u6a21\u6001\u5730\u70b9\u8bc6\u522b\u6846\u67b6\uff0c\u5c06\u5355\u76ee\u56fe\u50cf\u548c LiDAR \u626b\u63cf\u7edf\u4e00\u8f6c\u6362\u4e3a\u6df1\u5ea6\u56fe\u8868\u793a\uff0c\u5e76\u7528\u540c\u4e00\u4e2a\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u63d0\u53d6\u5168\u5c40\u63cf\u8ff0\u5b50\u3002\u5b83\u8ba9\u673a\u5668\u4eba\u6216\u81ea\u52a8\u9a7e\u9a76\u8f66\u8f86\u4ec5\u51ed\u76f8\u673a\u5373\u53ef\u5728\u9884\u5efa LiDAR \u5730\u56fe\u4e2d\u9c81\u68d2\u5b9a\u4f4d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09005", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u4f7f\u7528\u6a21\u6001\u4e13\u7528\u7f16\u7801\u5668\uff0c\u800c\u662f\u901a\u8fc7\u7edf\u4e00\u6df1\u5ea6\u56fe\u8868\u793a\u8ba9 VFM \u5b66\u4e60\u76f8\u673a\u4e0e LiDAR \u7684\u6a21\u6001\u4e0d\u53d8\u7279\u5f81\u3002", "\u63d0\u51fa\u51e0\u4f55\u611f\u77e5\u91cd\u53e0\u6316\u6398\u5668\uff1a\u8fdb\u884c\u8de8\u6a21\u6001\u5c3a\u5ea6\u5bf9\u9f50\u540e\uff0c\u901a\u8fc7\u524d\u5411\u6295\u5f71\u8ba1\u7b97\u50cf\u7d20\u7ea7\u89c6\u56fe\u91cd\u53e0\u5206\u6570\u3002", "\u5728 KITTI \u548c Boreas \u4e0a\u9a8c\u8bc1\uff0c\u9762\u5bf9\u5b63\u8282\u3001\u5929\u6c14\u3001\u5149\u7167\u548c\u663c\u591c\u53d8\u5316\u5747\u4f18\u4e8e\u591a\u79cd\u8de8\u6a21\u6001\u5730\u70b9\u8bc6\u522b\u57fa\u7ebf\u3002"], "keywords": ["\u5730\u70b9\u8bc6\u522b", "\u591a\u6a21\u6001", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u81ea\u52a8\u9a7e\u9a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09005v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DXPR: Depth-Based Vision-LiDAR Cross-Modal Place Recognition Using Vision Foundation Models", "tldr": "\u7528\u6df1\u5ea6\u8868\u793a\u7edf\u4e00\u76f8\u673a\u4e0eLiDAR\u5730\u70b9\u8bc6\u522b", "upvotes": 0, "what_it_is": "DXPR \u662f\u4e00\u79cd\u57fa\u4e8e\u6df1\u5ea6\u56fe\u7684\u8de8\u6a21\u6001\u5730\u70b9\u8bc6\u522b\u6846\u67b6\uff0c\u5c06\u5355\u76ee\u56fe\u50cf\u548c LiDAR \u626b\u63cf\u7edf\u4e00\u8f6c\u6362\u4e3a\u6df1\u5ea6\u56fe\u8868\u793a\uff0c\u5e76\u7528\u540c\u4e00\u4e2a\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u63d0\u53d6\u5168\u5c40\u63cf\u8ff0\u5b50\u3002\u5b83\u8ba9\u673a\u5668\u4eba\u6216\u81ea\u52a8\u9a7e\u9a76\u8f66\u8f86\u4ec5\u51ed\u76f8\u673a\u5373\u53ef\u5728\u9884\u5efa LiDAR \u5730\u56fe\u4e2d\u9c81\u68d2\u5b9a\u4f4d\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u8fc1\u79fb\u5230\u76f8\u673a-LiDAR \u8de8\u6a21\u6001\u5b9a\u4f4d\u4e2d\uff0c\u964d\u4f4e\u4e86\u5bf9\u4e13\u7528\u7f16\u7801\u5668\u7684\u4f9d\u8d56\uff0c\u5e76\u663e\u8457\u63d0\u5347\u590d\u6742\u73af\u5883\u53d8\u5316\u4e0b\u7684\u5730\u56fe\u91cd\u5b9a\u4f4d\u9c81\u68d2\u6027\uff0c\u5bf9\u673a\u5668\u4eba\u5bfc\u822a\u548c\u81ea\u52a8\u9a7e\u9a76\u5b9a\u4f4d\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "UAV video question answering requires separating camera motion from changes in the scene, but RGB-only multimodal models receive no explicit, stable reference for that separation. We present EgoSIS, a pose-free adapter that converts RGB-derived bidirectional flow into motion-canonical visual evidence in three stages. Factorized Visual Ego-Transitions (FVET) fits a robust image-plane transition and exposes motion, residual-support, and reliability factors. Reliability-Gated Ego-Transition Memory (ReTEM) uses reliability-weighted updates for a bounded history and re-anchors it at cuts or sustained uncertainty. Ego-Aligned Spatial Evidence (EASE) warps supported visual features into each segment\u0027s local anchor and injects four spatial evidence tokens per visual slice through zero-initialized residuals, without changing Qwen\u0027s visual-token count. On SIS-Bench, EgoSIS-8B obtains 89.9\\% perception, 82.5\\% perception-plus-memory, and 76.2\\% overall accuracy, with the largest gains concentrated in self-awareness perception and memory. The adapter thus provides an interpretable interface between optical flow and spatial reasoning.", "arxiv_id": "2609.08938", "arxiv_url": "https://arxiv.org/abs/2609.08938", "authors": ["Jingpu Yang", "Fengxian Ji", "Mingxuan Cui", "Yilin Sun", "Hang Zhang", "Jianhua Zhu", "Yufeng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa EgoSIS\uff0c\u4e00\u4e2a\u65e0\u9700\u59ff\u6001\u4fe1\u606f\u7684 RGB \u9002\u914d\u5668\uff0c\u5c06\u53cc\u5411\u5149\u6d41\u8f6c\u5316\u4e3a\u8fd0\u52a8\u89c4\u8303\u5316\u7684\u7a7a\u95f4\u8bc1\u636e\uff0c\u7528\u4e8e\u63d0\u5347\u65e0\u4eba\u673a\u89c6\u9891\u95ee\u7b54\u4e2d\u7684\u7a7a\u95f4\u4e0e\u8bb0\u5fc6\u63a8\u7406\u3002\u5b83\u901a\u8fc7\u4f30\u8ba1\u56fe\u50cf\u5e73\u9762\u81ea\u8fd0\u52a8\u3001\u7ef4\u62a4\u53ef\u9760\u6027\u95e8\u63a7\u8bb0\u5fc6\uff0c\u5e76\u5c06\u89c6\u89c9\u7279\u5f81\u5bf9\u9f50\u5230\u5c40\u90e8\u951a\u70b9\u540e\u6ce8\u5165 Qwen\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08938", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Factorized Visual Ego-Transitions\uff0c\u4ece\u5149\u6d41\u4e2d\u5206\u89e3\u51fa\u8fd0\u52a8\u3001\u6b8b\u5dee\u652f\u6301\u4e0e\u53ef\u9760\u6027\u56e0\u5b50\uff0c\u5e2e\u52a9\u533a\u5206\u76f8\u673a\u8fd0\u52a8\u548c\u771f\u5b9e\u573a\u666f\u53d8\u5316", "\u8bbe\u8ba1 Reliability-Gated Ego-Transition Memory\uff0c\u7528\u53ef\u9760\u6027\u52a0\u6743\u66f4\u65b0\u6709\u754c\u5386\u53f2\uff0c\u5e76\u5728\u955c\u5934\u5207\u6362\u6216\u6301\u7eed\u4e0d\u786e\u5b9a\u65f6\u91cd\u65b0\u951a\u5b9a", "EASE \u5c06\u53d7\u652f\u6301\u7684\u89c6\u89c9\u7279\u5f81\u626d\u66f2\u5230\u5c40\u90e8\u8fd0\u52a8\u951a\u70b9\uff0c\u6bcf\u4e2a\u89c6\u89c9\u5207\u7247\u6ce8\u51654\u4e2a\u7a7a\u95f4\u8bc1\u636e token\uff0c\u4e14\u4e0d\u589e\u52a0 Qwen \u539f\u6709\u89c6\u89c9 token \u6570"], "keywords": ["\u65e0\u4eba\u673a\u89c6\u89c9", "\u89c6\u9891\u95ee\u7b54", "\u5149\u6d41", "\u7a7a\u95f4\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08938v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "EgoSIS: From Factorized Visual Ego-Transitions to Motion-Canonical Spatial Evidence for UAV Reasoning", "tldr": "\u7528\u5149\u6d41\u89e3\u8026\u65e0\u4eba\u673a\u81ea\u8fd0\u52a8\u4e0e\u573a\u666f\u53d8\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EgoSIS\uff0c\u4e00\u4e2a\u65e0\u9700\u59ff\u6001\u4fe1\u606f\u7684 RGB \u9002\u914d\u5668\uff0c\u5c06\u53cc\u5411\u5149\u6d41\u8f6c\u5316\u4e3a\u8fd0\u52a8\u89c4\u8303\u5316\u7684\u7a7a\u95f4\u8bc1\u636e\uff0c\u7528\u4e8e\u63d0\u5347\u65e0\u4eba\u673a\u89c6\u9891\u95ee\u7b54\u4e2d\u7684\u7a7a\u95f4\u4e0e\u8bb0\u5fc6\u63a8\u7406\u3002\u5b83\u901a\u8fc7\u4f30\u8ba1\u56fe\u50cf\u5e73\u9762\u81ea\u8fd0\u52a8\u3001\u7ef4\u62a4\u53ef\u9760\u6027\u95e8\u63a7\u8bb0\u5fc6\uff0c\u5e76\u5c06\u89c6\u89c9\u7279\u5f81\u5bf9\u9f50\u5230\u5c40\u90e8\u951a\u70b9\u540e\u6ce8\u5165 Qwen\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a RGB-only \u591a\u6a21\u6001\u6a21\u578b\u63d0\u4f9b\u4e86\u53ef\u89e3\u91ca\u7684\u81ea\u8fd0\u52a8\u8865\u507f\u63a5\u53e3\uff0c\u5728\u65e0\u9700\u663e\u5f0f\u4f4d\u59ff\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347 UAV \u89c6\u9891\u95ee\u7b54\uff0c\u5c24\u5176\u662f\u81ea\u6211\u611f\u77e5\u4e0e\u8bb0\u5fc6\u7c7b\u95ee\u9898\uff1b\u5728 SIS-Bench \u4e0a\u8fbe\u5230 76.2% \u603b\u4f53\u51c6\u786e\u7387\u3002"}, {"abstract": "Language-guided robots need persistent scene memories to follow instructions, revisit objects, and resolve references to objects encountered over time. While much of language-guided scene-memory retrieval has emphasized spatial or relational references, many everyday object references specify objects by multiple persistent attributes, such as category, material, size, or surface appearance. We formalize this problem as attribute-compositional retrieval, where a fixed object-centric scene memory is queried with natural language to retrieve the object satisfying the requested attributes. To investigate this capability directly, we introduce a controlled evaluation protocol with fixed scene memories and attribute-defined targets, separating retrieval from perception and annotation ambiguities. We then propose FRAME, which turns language into query-relevant attribute weights, uses learned readouts to estimate per-attribute evidence from object embeddings, and ranks objects by aggregating this evidence according to the query. Across held-out scenes and object assets, FRAME outperforms representative scene-memory retrieval baselines while reducing post-decomposition object scoring to lightweight matrix-vector computation. These results position attribute-compositional retrieval as a complementary scene-memory capability for language-guided robots, showing that persistent object attributes can be exposed as composable evidence for accurate and efficient multi-attribute retrieval.", "arxiv_id": "2609.08886", "arxiv_url": "https://arxiv.org/abs/2609.08886", "authors": ["Woosang Jeon", "Sanghyeok Choi", "Minwoo Kim", "Taehyun Jung", "Taehyeong Kim"], "brief": "\u8bba\u6587\u63d0\u51fa\u5c5e\u6027\u7ec4\u5408\u68c0\u7d22\u4efb\u52a1\uff1a\u5728\u56fa\u5b9a\u7684\u5bf9\u8c61\u4e2d\u5fc3\u573a\u666f\u8bb0\u5fc6\u4e2d\uff0c\u6839\u636e\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u7684\u7c7b\u522b\u3001\u6750\u8d28\u3001\u5927\u5c0f\u3001\u5916\u89c2\u7b49\u6301\u4e45\u5c5e\u6027\u627e\u56de\u76ee\u6807\u7269\u4f53\u3002\u4f5c\u8005\u63d0\u51fa FRAME\uff0c\u5c06\u8bed\u8a00\u67e5\u8be2\u8f6c\u4e3a\u5c5e\u6027\u6743\u91cd\uff0c\u5e76\u7528\u5b66\u4e60\u5230\u7684\u5c5e\u6027\u8bfb\u51fa\u5668\u4ece\u7269\u4f53\u5d4c\u5165\u4e2d\u63d0\u53d6\u8bc1\u636e\u8fdb\u884c\u6392\u5e8f\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08886", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u53d7\u63a7\u8bc4\u6d4b\u534f\u8bae\uff0c\u56fa\u5b9a\u573a\u666f\u8bb0\u5fc6\u4e0e\u5c5e\u6027\u5b9a\u4e49\u76ee\u6807\uff0c\u5c3d\u91cf\u5265\u79bb\u611f\u77e5\u8bef\u5dee\u548c\u6807\u6ce8\u6b67\u4e49\u5bf9\u68c0\u7d22\u80fd\u529b\u8bc4\u4f30\u7684\u5f71\u54cd", "FRAME \u5c06\u81ea\u7136\u8bed\u8a00\u5206\u89e3\u4e3a\u67e5\u8be2\u76f8\u5173\u7684\u5c5e\u6027\u6743\u91cd\uff0c\u518d\u5bf9\u6bcf\u4e2a\u7269\u4f53\u4f30\u8ba1\u9010\u5c5e\u6027\u8bc1\u636e\uff0c\u5b9e\u73b0\u53ef\u7ec4\u5408\u7684\u591a\u5c5e\u6027\u5339\u914d", "\u5728\u672a\u89c1\u573a\u666f\u548c\u7269\u4f53\u8d44\u4ea7\u4e0a\u4f18\u4e8e\u4ee3\u8868\u6027\u573a\u666f\u8bb0\u5fc6\u68c0\u7d22\u57fa\u7ebf\uff0c\u4e14\u7269\u4f53\u6253\u5206\u53ef\u7b80\u5316\u4e3a\u8f7b\u91cf\u77e9\u9635-\u5411\u91cf\u8ba1\u7b97"], "keywords": ["\u673a\u5668\u4eba", "\u573a\u666f\u8bb0\u5fc6", "\u89c6\u89c9\u8bed\u8a00", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08886v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FRAME: Factored Retrieval via Attribute Readouts for Object-Centric Scene Memory", "tldr": "\u7528\u5c5e\u6027\u7ec4\u5408\u9ad8\u6548\u68c0\u7d22\u673a\u5668\u4eba\u573a\u666f\u8bb0\u5fc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5c5e\u6027\u7ec4\u5408\u68c0\u7d22\u4efb\u52a1\uff1a\u5728\u56fa\u5b9a\u7684\u5bf9\u8c61\u4e2d\u5fc3\u573a\u666f\u8bb0\u5fc6\u4e2d\uff0c\u6839\u636e\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u7684\u7c7b\u522b\u3001\u6750\u8d28\u3001\u5927\u5c0f\u3001\u5916\u89c2\u7b49\u6301\u4e45\u5c5e\u6027\u627e\u56de\u76ee\u6807\u7269\u4f53\u3002\u4f5c\u8005\u63d0\u51fa FRAME\uff0c\u5c06\u8bed\u8a00\u67e5\u8be2\u8f6c\u4e3a\u5c5e\u6027\u6743\u91cd\uff0c\u5e76\u7528\u5b66\u4e60\u5230\u7684\u5c5e\u6027\u8bfb\u51fa\u5668\u4ece\u7269\u4f53\u5d4c\u5165\u4e2d\u63d0\u53d6\u8bc1\u636e\u8fdb\u884c\u6392\u5e8f\u3002", "why_notable": "\u5b83\u628a\u673a\u5668\u4eba\u957f\u671f\u573a\u666f\u8bb0\u5fc6\u4e2d\u7684\u7269\u4f53\u68c0\u7d22\u4ece\u7a7a\u95f4\u5173\u7cfb\u6269\u5c55\u5230\u66f4\u65e5\u5e38\u7684\u591a\u5c5e\u6027\u5f15\u7528\uff0c\u5e76\u63d0\u4f9b\u4e86\u9ad8\u6548\u3001\u53ef\u7ec4\u5408\u7684\u68c0\u7d22\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u8bed\u8a00\u5f15\u5bfc\u673a\u5668\u4eba\u66f4\u51c6\u786e\u5730\u627e\u7269\u548c\u91cd\u8bbf\u5bf9\u8c61\u3002"}, {"abstract": "Cancer segmentation models can fail silently, generating plausible but incorrect masks that risk missed findings or unnecessary biopsies. A critical question arises: Do AI models \"know\" when they are wrong, and if so, can we use the signal to predict their own failures? Humans do have a \"Feeling of Error\" (FOE): a spontaneous sense of unease that flags a potential error during thinking. We investigate whether cancer segmentation models exhibit an analogous internal signal. Unlike output-level cues (e.g., prediction confidence or uncertainty), which offer no insight into why a failure occurs and suffer from a sensitivity-quality tradeoff where high detection sensitivity could degrade overall segmentation quality. We instead propose to capture the model\u0027s FOE from its inner workings. Using mechanistic interpretability tools, specifically Sparse Autoencoders, we decompose internal neural activations into a dictionary of human-interpretable concepts and show that failure cases exhibit a distinct latent signature: fewer active concepts with lower activation magnitudes compared to successful segmentation. By training a classifier on these concept activations, we achieve accurate failure detection along with explanations for the model\u0027s mistakes. Experiments on prostate, pancreatic, and brain cancer segmentation demonstrate that our approach outperforms output-based methods in failure detection while preserving segmentation quality.", "arxiv_id": "2609.08879", "arxiv_url": "https://arxiv.org/abs/2609.08879", "authors": ["Mengmeng Ma", "Yunxiang Peng", "Tang Li", "Lu Lin", "Binsheng Zhao", "Oguz Akin", "Xi Peng"], "brief": "\u8bba\u6587\u63d0\u51fa\u4ece\u764c\u75c7\u5206\u5272\u6a21\u578b\u7684\u5185\u90e8\u6fc0\u6d3b\u4e2d\u63d0\u53d6\u7c7b\u4f3c\u201c\u9519\u8bef\u611f\u201d\u7684\u4fe1\u53f7\uff0c\u800c\u975e\u4f9d\u8d56\u8f93\u51fa\u7f6e\u4fe1\u5ea6\u6216\u4e0d\u786e\u5b9a\u6027\u3002\u901a\u8fc7\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5c06\u795e\u7ecf\u6fc0\u6d3b\u5206\u89e3\u4e3a\u53ef\u89e3\u91ca\u6982\u5ff5\uff0c\u5e76\u8bad\u7ec3\u5206\u7c7b\u5668\u9884\u6d4b\u5206\u5272\u662f\u5426\u5931\u8d25\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08879", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5931\u8d25\u6837\u672c\u5728\u6f5c\u5728\u6982\u5ff5\u7a7a\u95f4\u4e2d\u5448\u73b0\u66f4\u5c11\u6d3b\u8dc3\u6982\u5ff5\u3001\u6fc0\u6d3b\u5e45\u5ea6\u66f4\u4f4e\u7684\u7279\u5f81\u7b7e\u540d", "\u57fa\u4e8e\u6982\u5ff5\u6fc0\u6d3b\u7684\u5931\u8d25\u68c0\u6d4b\u4f18\u4e8e\u8f93\u51fa\u5c42\u7f6e\u4fe1\u5ea6/\u4e0d\u786e\u5b9a\u6027\u65b9\u6cd5", "\u5728\u524d\u5217\u817a\u764c\u3001\u80f0\u817a\u764c\u548c\u8111\u764c\u5206\u5272\u4efb\u52a1\u4e0a\u9a8c\u8bc1\uff0c\u5e76\u80fd\u5728\u4fdd\u6301\u5206\u5272\u8d28\u91cf\u7684\u540c\u65f6\u63d0\u4f9b\u9519\u8bef\u89e3\u91ca"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u53ef\u89e3\u91ca\u6027", "\u56fe\u50cf\u5206\u5272", "\u6a21\u578b\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08879v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Medical AI Encodes a \"Feeling of Error\": Verifying Cancer Segmentation via Internal Concepts", "tldr": "\u7528\u5185\u90e8\u6982\u5ff5\u4fe1\u53f7\u68c0\u6d4b\u764c\u75c7\u5206\u5272\u5931\u8d25", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4ece\u764c\u75c7\u5206\u5272\u6a21\u578b\u7684\u5185\u90e8\u6fc0\u6d3b\u4e2d\u63d0\u53d6\u7c7b\u4f3c\u201c\u9519\u8bef\u611f\u201d\u7684\u4fe1\u53f7\uff0c\u800c\u975e\u4f9d\u8d56\u8f93\u51fa\u7f6e\u4fe1\u5ea6\u6216\u4e0d\u786e\u5b9a\u6027\u3002\u901a\u8fc7\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5c06\u795e\u7ecf\u6fc0\u6d3b\u5206\u89e3\u4e3a\u53ef\u89e3\u91ca\u6982\u5ff5\uff0c\u5e76\u8bad\u7ec3\u5206\u7c7b\u5668\u9884\u6d4b\u5206\u5272\u662f\u5426\u5931\u8d25\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u673a\u5236\u53ef\u89e3\u91ca\u6027\u7528\u4e8e\u533b\u5b66\u5206\u5272\u5b89\u5168\u9a8c\u8bc1\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u4e0d\u727a\u7272\u6a21\u578b\u8f93\u51fa\u8d28\u91cf\u7684\u81ea\u6211\u9519\u8bef\u68c0\u6d4b\u65b9\u5f0f\uff0c\u5bf9\u964d\u4f4e\u6f0f\u8bca\u548c\u4e0d\u5fc5\u8981\u6d3b\u68c0\u98ce\u9669\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Text-guided Video Temporal Grounding (VTG) aims to localize the relevant segments in an untrimmed video based on text queries, yet collecting dense temporal annotations and training task-specific models remain costly and brittle under distribution shift. Recent training-free VTG approaches mitigate this issue by directly matching pretrained vision-language representations, but they still face two fundamental information bottlenecks: frame-wise visual encoding overlooks temporal dynamics, while fixed query embeddings cannot resolve query ambiguity. To address these issues, we propose DSE-VTG, a \\underline{D}ual-\\underline{S}ide \\underline{E}nhancement framework that addresses both without any task-specific training. On the visual side, Multi-scale Similarity Fusion (MSF) combines frame- and clip-level similarities into a unified, temporally aware similarity profile. On the textual side, Query-level Test-Time Adaptation (Q-TTA) optimizes a lightweight additive offset to adapt the query embedding to the video at test time, without finetuning the backbone or calling external large language models. Extensive experiments on three standard and two OOD benchmarks show that DSE-VTG achieves state-of-the-art performance among training-free methods. On Charades-STA, it improves mIoU over the strongest prior training-free method by 5.61 points. Under distribution shift, DSE-VTG reaches 50.86 mIoU on Charades-CG Novel-Word, surpassing the strongest supervised baseline by 2.76 mIoU. Our code will be released upon acceptance.", "arxiv_id": "2609.08850", "arxiv_url": "https://arxiv.org/abs/2609.08850", "authors": ["Zhuo Cao", "Bingqing Zhang", "Sen Wang", "Xue Li"], "brief": "\u672c\u6587\u63d0\u51fa DSE-VTG\uff0c\u4e00\u4e2a\u65e0\u9700\u4efb\u52a1\u7279\u5b9a\u8bad\u7ec3\u7684\u89c6\u9891\u65f6\u5e8f\u5b9a\u4f4d\u6846\u67b6\u3002\u5b83\u4ece\u89c6\u89c9\u4fa7\u878d\u5408\u5e27\u7ea7\u4e0e\u7247\u6bb5\u7ea7\u76f8\u4f3c\u5ea6\uff0c\u4ece\u6587\u672c\u4fa7\u5728\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\u67e5\u8be2\u5d4c\u5165\uff0c\u4ee5\u63d0\u5347\u5f00\u653e\u5206\u5e03\u4e0b\u7684\u5b9a\u4f4d\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08850", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Multi-scale Similarity Fusion \u540c\u65f6\u5229\u7528\u5e27\u7ea7\u548c clip \u7ea7\u76f8\u4f3c\u5ea6\uff0c\u5f62\u6210\u66f4\u5177\u65f6\u95f4\u52a8\u6001\u611f\u77e5\u7684\u76f8\u4f3c\u5ea6\u66f2\u7ebf\u3002", "Query-level Test-Time Adaptation \u4ec5\u4f18\u5316\u8f7b\u91cf\u52a0\u6027\u504f\u79fb\u6765\u8c03\u6574\u67e5\u8be2\u5d4c\u5165\uff0c\u4e0d\u5fae\u8c03\u9aa8\u5e72\u6a21\u578b\uff0c\u4e5f\u4e0d\u8c03\u7528\u5916\u90e8\u5927\u8bed\u8a00\u6a21\u578b\u3002", "\u5728 3 \u4e2a\u6807\u51c6\u57fa\u51c6\u548c 2 \u4e2a OOD \u57fa\u51c6\u4e0a\u8fbe\u5230\u514d\u8bad\u7ec3\u65b9\u6cd5 SOTA\uff1bCharades-STA \u4e0a mIoU \u6bd4\u6700\u5f3a\u5148\u524d\u514d\u8bad\u7ec3\u65b9\u6cd5\u9ad8 5.61 \u70b9\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u65f6\u5e8f\u5b9a\u4f4d", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08850v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DSE-VTG: Dual-Side Enhancement for Training-Free Video Temporal Grounding", "tldr": "\u514d\u8bad\u7ec3\u589e\u5f3a\u89c6\u9891\u65f6\u5e8f\u5b9a\u4f4d\u7684\u89c6\u89c9\u4e0e\u6587\u672c\u4e24\u7aef", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa DSE-VTG\uff0c\u4e00\u4e2a\u65e0\u9700\u4efb\u52a1\u7279\u5b9a\u8bad\u7ec3\u7684\u89c6\u9891\u65f6\u5e8f\u5b9a\u4f4d\u6846\u67b6\u3002\u5b83\u4ece\u89c6\u89c9\u4fa7\u878d\u5408\u5e27\u7ea7\u4e0e\u7247\u6bb5\u7ea7\u76f8\u4f3c\u5ea6\uff0c\u4ece\u6587\u672c\u4fa7\u5728\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\u67e5\u8be2\u5d4c\u5165\uff0c\u4ee5\u63d0\u5347\u5f00\u653e\u5206\u5e03\u4e0b\u7684\u5b9a\u4f4d\u6548\u679c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u514d\u8bad\u7ec3 VTG \u7684\u4e24\u4e2a\u6838\u5fc3\u74f6\u9888\u2014\u2014\u89c6\u89c9\u65f6\u95f4\u52a8\u6001\u4e0d\u8db3\u548c\u6587\u672c\u67e5\u8be2\u6b67\u4e49\u2014\u2014\u5206\u522b\u8bbe\u8ba1\u8f7b\u91cf\u589e\u5f3a\u673a\u5236\uff0c\u5728\u65e0\u9700\u6807\u6ce8\u8bad\u7ec3\u548c\u6a21\u578b\u5fae\u8c03\u7684\u524d\u63d0\u4e0b\u663e\u8457\u63d0\u5347\u9c81\u68d2\u6027\uff0c\u5c24\u5176\u5728\u5206\u5e03\u5916\u573a\u666f\u4e2d\u751a\u81f3\u8d85\u8fc7\u5f3a\u76d1\u7763\u57fa\u7ebf\u3002"}, {"abstract": "High-fidelity vehicle assets are essential for controllable traffic scene generation, particularly for synthesizing rare and safety-critical long-tail scenarios. However, reconstructing a reusable vehicle representation from in-the-wild onboard images remains challenging for two reasons. First, image-to-3D generation methods generally produce models without reliable metric scale. Second, onboard cameras usually observe only one side of a target vehicle, making conventional multi-view reconstruction incomplete on unobserved regions. To solve these problems, we propose a feed-forward vehicle asset reconstruction method, which leverages two complementary priors to reconstruct 3D Gaussian representations for vehicles using sparse one-sided observations. To achieve metric-scale reconstruction, a visual foundation model is first utilized to serve as a visual prior for Gaussian initialization. The Gaussian attributes are then estimated by a learnable encoder-decoder module. A symmetry-aware cloning strategy is presented to complete the unobserved side directly in Gaussian space, which exploits the bilateral structure of vehicles as a geometric prior. Experiments on the public dataset demonstrate that the proposed method significantly outperforms existing approaches in both vehicle asset completeness and geometric accuracy.", "arxiv_id": "2609.08841", "arxiv_url": "https://arxiv.org/abs/2609.08841", "authors": ["Jinyu Miao", "Jiusi Li", "Yifei He", "Miao Long", "Kun Jiang", "Mengmeng Yang", "Diange Yang"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u524d\u9988\u5f0f\u8f66\u8f86\u8d44\u4ea7\u91cd\u5efa\u65b9\u6cd5\uff0c\u5229\u7528\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u4e0e\u8f66\u8f86\u53cc\u4fa7\u5bf9\u79f0\u51e0\u4f55\u5148\u9a8c\uff0c\u4ece\u8f66\u8f7d\u56fe\u50cf\u7684\u6709\u9650\u5355\u4fa7\u89c2\u6d4b\u4e2d\u91cd\u5efa\u53ef\u590d\u7528\u76843D Gaussian\u8f66\u8f86\u8868\u793a\u3002\u65b9\u6cd5\u540c\u65f6\u89e3\u51b3\u5c3a\u5ea6\u4e0d\u53ef\u9760\u4e0e\u80cc\u4fa7\u7f3a\u5931\u4e24\u5927\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08841", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u4f5c\u4e3a\u9ad8\u65af\u521d\u59cb\u5316\u7684\u89c6\u89c9\u5148\u9a8c\uff0c\u5e2e\u52a9\u83b7\u5f97\u7c73\u5236\u5c3a\u5ea6\u7684\u8f66\u8f86\u91cd\u5efa", "\u901a\u8fc7\u53ef\u5b66\u4e60\u7684\u7f16\u7801\u5668-\u89e3\u7801\u5668\u4f30\u8ba1\u9ad8\u65af\u5c5e\u6027\uff0c\u751f\u6210\u9ad8\u4fdd\u771f\u8f66\u8f863D Gaussian\u8868\u793a", "\u63d0\u51fa\u5bf9\u79f0\u611f\u77e5\u514b\u9686\u7b56\u7565\uff0c\u5728\u9ad8\u65af\u7a7a\u95f4\u76f4\u63a5\u8865\u5168\u672a\u89c2\u6d4b\u4fa7\uff0c\u63d0\u5347\u5b8c\u6574\u6027\u4e0e\u51e0\u4f55\u7cbe\u5ea6"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "3D Gaussian", "\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u5148\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08841v1", "published_at": "2026-09-08", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Leveraging Visual and Geometric Priors for Metric-scale and Complete Vehicle Gaussian Reconstruction from Limited Views", "tldr": "\u4ece\u5355\u4fa7\u7a00\u758f\u89c6\u89d2\u91cd\u5efa\u7c73\u5236\u5b8c\u6574\u8f66\u8f86\u9ad8\u65af\u6a21\u578b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u524d\u9988\u5f0f\u8f66\u8f86\u8d44\u4ea7\u91cd\u5efa\u65b9\u6cd5\uff0c\u5229\u7528\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u4e0e\u8f66\u8f86\u53cc\u4fa7\u5bf9\u79f0\u51e0\u4f55\u5148\u9a8c\uff0c\u4ece\u8f66\u8f7d\u56fe\u50cf\u7684\u6709\u9650\u5355\u4fa7\u89c2\u6d4b\u4e2d\u91cd\u5efa\u53ef\u590d\u7528\u76843D Gaussian\u8f66\u8f86\u8868\u793a\u3002\u65b9\u6cd5\u540c\u65f6\u89e3\u51b3\u5c3a\u5ea6\u4e0d\u53ef\u9760\u4e0e\u80cc\u4fa7\u7f3a\u5931\u4e24\u5927\u95ee\u9898\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u4e2d\u53ef\u63a7\u4ea4\u901a\u573a\u666f\u751f\u6210\uff0c\u5c24\u5176\u6709\u52a9\u4e8e\u6784\u5efa\u7f55\u89c1\u548c\u5b89\u5168\u5173\u952e\u957f\u5c3e\u573a\u666f\u7684\u9ad8\u8d28\u91cf\u8f66\u8f86\u8d44\u4ea7\uff1b\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u5728\u5b8c\u6574\u6027\u548c\u51e0\u4f55\u7cbe\u5ea6\u4e0a\u663e\u8457\u66f4\u4f18\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Autonomous 3D active mapping requires a space robot to choose where to sense while building the geometry needed for navigation. Learned occupancy completion extends spatial context beyond the current field of view, but one predicted map often serves two planning roles: it scores expected surface gain and constrains collision-free motion. Unsupported occupancy can therefore distort both where the robot looks and where it believes it can travel. We study this coupled interface in a controlled closed-loop benchmark by holding the active-mapping system fixed and varying only its planner-facing occupancy across observation-only, learned, oracle-corrected, and ground-truth conditions. Improving occupancy accuracy does not monotonically improve closed-loop coverage: across 25 starts, planning with ground-truth occupancy reaches 70% of the learned baseline\u0027s final coverage 12.7 steps earlier on average, while increasing final coverage by only 0.031. Guided by this diagnosis, we introduce an observation-gated filter that retains completion in insufficiently observed regions and suppresses predictions only after repeated frustum exposure without nearby RGB-D support. The filter improves both targeted failure-prone starts without retraining or ground truth. These results motivate online revision of planner-facing geometry during autonomous intervals between communication windows. The current study assumes benchmark RGB-D observations and sufficiently accurate pose estimates; planetary sensing conditions and accumulated localization drift remain to be evaluated.", "arxiv_id": "2609.09069", "arxiv_url": "https://arxiv.org/abs/2609.09069", "authors": ["Jiahui Zhang", "Bonian Han", "Gongbo Liang", "Yu Zhang"], "brief": "\u672c\u6587\u91cd\u65b0\u5ba1\u89c6\u5b66\u4e60\u5f0f\u5360\u636e\u8865\u5168\u5728\u81ea\u4e3b3D\u4e3b\u52a8\u5efa\u56fe\u4e2d\u7684\u89c4\u5212\u4f5c\u7528\uff0c\u53d1\u73b0\u66f4\u9ad8\u5360\u636e\u7cbe\u5ea6\u5e76\u4e0d\u5fc5\u7136\u5e26\u6765\u66f4\u597d\u95ed\u73af\u8986\u76d6\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd observation-gated filter\uff0c\u5728\u7f3a\u4e4f\u89c2\u6d4b\u533a\u57df\u4fdd\u7559\u8865\u5168\uff0c\u4f46\u5bf9\u591a\u6b21\u89c6\u9525\u66dd\u5149\u540e\u4ecd\u65e0RGB-D\u652f\u6301\u7684\u9884\u6d4b\u8fdb\u884c\u6291\u5236\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09069", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728\u56fa\u5b9a\u4e3b\u52a8\u5efa\u56fe\u7cfb\u7edf\u4e0b\uff0c\u4ec5\u6539\u53d8\u89c4\u5212\u5668\u53ef\u89c1\u7684\u5360\u636e\u56fe\uff0c\u5bf9\u6bd4\u7eaf\u89c2\u6d4b\u3001\u5b66\u4e60\u9884\u6d4b\u3001oracle\u6821\u6b63\u548c\u771f\u503c\u6761\u4ef6\u3002", "\u5b9e\u9a8c\u663e\u793a\u5360\u
