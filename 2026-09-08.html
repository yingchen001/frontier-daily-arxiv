636e\u7cbe\u5ea6\u4e0e\u95ed\u73af\u8986\u76d6\u5e76\u975e\u5355\u8c03\u76f8\u5173\uff1a\u771f\u503c\u5360\u636e\u5e73\u5747\u63d0\u524d12.7\u6b65\u8fbe\u5230\u5b66\u4e60\u57fa\u7ebf70%\u6700\u7ec8\u8986\u76d6\uff0c\u4f46\u6700\u7ec8\u8986\u76d6\u4ec5\u63d0\u53470.031\u3002", "\u6240\u63d0\u89c2\u6d4b\u95e8\u63a7\u8fc7\u6ee4\u65e0\u9700\u91cd\u8bad\u7ec3\u6216\u771f\u503c\uff0c\u53ef\u6539\u5584\u6613\u5931\u8d25\u8d77\u70b9\u7684\u8868\u9762\u589e\u76ca\u4f30\u8ba1\u4e0e\u78b0\u649e\u7ea6\u675f\u95ee\u9898\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u4e3b\u52a8\u5efa\u56fe", "\u5360\u636e\u9884\u6d4b", "\u4e09\u7ef4\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09069v1", "published_at": "2026-09-08", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Rethinking Learned Occupancy in Autonomous Active Mapping with Observation-Gated Filtering", "tldr": "\u89c2\u6d4b\u95e8\u63a7\u8fc7\u6ee4\u63d0\u5347\u81ea\u4e3b3D\u4e3b\u52a8\u5efa\u56fe\u89c4\u5212\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u91cd\u65b0\u5ba1\u89c6\u5b66\u4e60\u5f0f\u5360\u636e\u8865\u5168\u5728\u81ea\u4e3b3D\u4e3b\u52a8\u5efa\u56fe\u4e2d\u7684\u89c4\u5212\u4f5c\u7528\uff0c\u53d1\u73b0\u66f4\u9ad8\u5360\u636e\u7cbe\u5ea6\u5e76\u4e0d\u5fc5\u7136\u5e26\u6765\u66f4\u597d\u95ed\u73af\u8986\u76d6\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd observation-gated filter\uff0c\u5728\u7f3a\u4e4f\u89c2\u6d4b\u533a\u57df\u4fdd\u7559\u8865\u5168\uff0c\u4f46\u5bf9\u591a\u6b21\u89c6\u9525\u66dd\u5149\u540e\u4ecd\u65e0RGB-D\u652f\u6301\u7684\u9884\u6d4b\u8fdb\u884c\u6291\u5236\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u5b66\u4e60\u5f0f\u5360\u636e\u8865\u5168\u5728\u4e3b\u52a8\u5efa\u56fe\u4e2d\u540c\u65f6\u5f71\u54cd\u63a2\u7d22\u76ee\u6807\u9009\u62e9\u548c\u53ef\u901a\u884c\u6027\u5224\u65ad\uff0c\u9519\u8bef\u9884\u6d4b\u4f1a\u8026\u5408\u653e\u5927\u89c4\u5212\u5931\u6548\uff1b\u5176\u5728\u7ebf\u8fc7\u6ee4\u601d\u8def\u5bf9\u901a\u4fe1\u53d7\u9650\u7684\u7a7a\u95f4/\u884c\u661f\u673a\u5668\u4eba\u81ea\u4e3b\u5efa\u56fe\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Three-dimensional femoral reconstruction from radiographs supports surgical planning, implant sizing, and post-operative follow-up, but remains ill-posed as X-ray projections discard depth information. Existing methods often incorporate a 3D statistical shape model (SSM) as a shape prior to guide reconstructions toward anatomically plausible shapes, relying on iterative 3D-to-2D projection matching. Yet, these approaches are computationally expensive and constrain their SSM to a single dimensionality, leaving the statistical relationship between 2D observations and 3D geometry largely unexploited and unexplored. We instead propose a joint 2D-3D SSM that explicitly captures the co-variation between 2D and 3D segmentations in a shared latent space. During training, 2D and 3D segmentations are registered to a common 3D template and its corresponding 2D projections, and the resulting stationary velocity fields are jointly decomposed using principal component analysis (PCA). This joint modeling allows the 2D-to-3D mapping to be learned directly from data rather than computing correspondences at inference time. For unseen subjects, the 3D shape is recovered directly by lifting the 2D latent coordinates to the 3D PCA subspace, thereby eliminating the need for iterative 3D-to-2D projection. Experiments on NMDID demonstrate that the proposed joint 2D-3D SSM outperforms a widely-used 3D-only SSM baseline while achieving inference approximately 4 times faster, at under 3 seconds per subject. The code is available at: https://github.com/florence-dellaniello-picard/joint2d3d-ssm.", "arxiv_id": "2609.09010", "arxiv_url": "https://arxiv.org/abs/2609.09010", "authors": ["Florence Dell\u0027Aniello Picard", "Pranav Poudel", "Nairouz Shehata", "Fr\u00e9d\u00e9ric Lavoie", "Herve Lombaert"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u9aa8\u79d1\u91cd\u5efa\u7684\u8054\u54082D-3D\u7edf\u8ba1\u5f62\u72b6\u6a21\u578b\uff0c\u5728\u5171\u4eab\u6f5c\u7a7a\u95f4\u4e2d\u5efa\u6a21X\u51492D\u5206\u5272\u4e0e3D\u80a1\u9aa8\u51e0\u4f55\u7684\u534f\u540c\u53d8\u5316\u3002\u63a8\u7406\u65f6\u53ef\u76f4\u63a5\u4ece2D\u6f5c\u53d8\u91cf\u6620\u5c04\u52303D\u5f62\u72b6\uff0c\u65e0\u9700\u8fed\u4ee3\u5f0f3D\u52302D\u6295\u5f71\u5339\u914d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09010", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5c062D\u4e0e3D\u5206\u5272\u5171\u540c\u914d\u51c6\u52303D\u6a21\u677f\u53ca\u51762D\u6295\u5f71\uff0c\u5e76\u5bf9\u5e73\u7a33\u901f\u5ea6\u573a\u8fdb\u884c\u8054\u5408PCA\u5206\u89e3", "\u4ece\u6570\u636e\u4e2d\u76f4\u63a5\u5b66\u4e602D\u52303D\u5f62\u72b6\u6620\u5c04\uff0c\u51cf\u5c11\u4f20\u7edf3D-only SSM\u63a8\u7406\u65f6\u7684\u5bf9\u5e94\u641c\u7d22\u4e0e\u6295\u5f71\u4f18\u5316", "\u5728NMDID\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u5e38\u75283D-only SSM\u57fa\u7ebf\uff0c\u5355\u4e2a\u53d7\u8bd5\u8005\u63a8\u7406\u4f4e\u4e8e3\u79d2\uff0c\u7ea6\u5feb4\u500d"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u4e09\u7ef4\u91cd\u5efa", "\u7edf\u8ba1\u5f62\u72b6\u6a21\u578b", "\u9aa8\u79d1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09010v1", "published_at": "2026-09-08", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "A Joint 2D-3D Statistical Shape Model for Orthopedic Reconstruction", "tldr": "\u8054\u54082D-3D\u5f62\u72b6\u6a21\u578b\u52a0\u901f\u80a1\u9aa8\u91cd\u5efa", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u9aa8\u79d1\u91cd\u5efa\u7684\u8054\u54082D-3D\u7edf\u8ba1\u5f62\u72b6\u6a21\u578b\uff0c\u5728\u5171\u4eab\u6f5c\u7a7a\u95f4\u4e2d\u5efa\u6a21X\u51492D\u5206\u5272\u4e0e3D\u80a1\u9aa8\u51e0\u4f55\u7684\u534f\u540c\u53d8\u5316\u3002\u63a8\u7406\u65f6\u53ef\u76f4\u63a5\u4ece2D\u6f5c\u53d8\u91cf\u6620\u5c04\u52303D\u5f62\u72b6\uff0c\u65e0\u9700\u8fed\u4ee3\u5f0f3D\u52302D\u6295\u5f71\u5339\u914d\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628aX\u5149\u89c2\u6d4b\u4e0e3D\u89e3\u5256\u5f62\u72b6\u7684\u7edf\u8ba1\u5173\u7cfb\u663e\u5f0f\u7eb3\u5165\u540c\u4e00\u5f62\u72b6\u6a21\u578b\uff0c\u5728\u4fdd\u6301\u89e3\u5256\u5408\u7406\u6027\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u91cd\u5efa\u901f\u5ea6\uff0c\u9002\u5408\u624b\u672f\u89c4\u5212\u3001\u690d\u5165\u7269\u9009\u578b\u548c\u672f\u540e\u968f\u8bbf\u7b49\u4e34\u5e8a\u573a\u666f\u3002"}, {"abstract": "Partially Relevant Video Retrieval (PRVR) retrieves untrimmed videos when queries describe only short moments. Although recent methods improve local representations, uncertainty modeling, and global context, final ranking often still trusts the strongest local response; a coincidentally similar fragment can therefore produce an unsupported peak. We identify this failure as the query-agnostic concentration bottleneck and propose TRACE, a score-level evidence verification operator for PRVR. Given a query and global video registers, TRACE activates query-relevant registers, routes their support to frame-level evidence, and smoothly marginalizes alternative query-to-register-to-frame paths before localized temporal selection. Unlike representation-level feature fusion, TRACE uses this evidence only as a query-conditioned residual calibration of the original local score. On ActivityNet Captions, Charades-STA, and TVR, TRACE achieves the best SumR on all three benchmarks and improves the DreamPRVR backbone by 1.2, 1.1, and 1.5 points, respectively. Ablation, routing-corruption, hard-negative, and cross-backbone transfer analyses support the interpretation that the gains arise from query-conditioned evidence verification rather than a generic score offset.", "arxiv_id": "2609.08999", "arxiv_url": "https://arxiv.org/abs/2609.08999", "authors": ["Shuaiqi Cheng", "Siyu You", "Yanbi Wu", "Yuxi Chen", "Jiahao Zhang", "Xuming Hu"], "brief": "\u8bba\u6587\u9488\u5bf9\u90e8\u5206\u76f8\u5173\u89c6\u9891\u68c0\u7d22\u4e2d\u201c\u5c40\u90e8\u5cf0\u503c\u8bef\u5224\u201d\u95ee\u9898\uff0c\u63d0\u51faTRACE\uff1a\u4e00\u79cd\u6587\u672c\u6761\u4ef6\u7684\u8bc1\u636e\u9a8c\u8bc1\u7b97\u5b50\u3002\u5b83\u5229\u7528\u67e5\u8be2\u6fc0\u6d3b\u5168\u5c40\u89c6\u9891\u5bc4\u5b58\u5668\uff0c\u5c06\u652f\u6301\u8bc1\u636e\u8def\u7531\u5230\u5e27\u7ea7\u5206\u6570\uff0c\u5e76\u4f5c\u4e3a\u6b8b\u5dee\u6821\u51c6\u539f\u59cb\u5c40\u90e8\u5206\u6570\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08999", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51faPRVR\u4e2d\u7684\u67e5\u8be2\u65e0\u5173\u96c6\u4e2d\u74f6\u9888\uff1a\u5076\u7136\u76f8\u4f3c\u7684\u5c40\u90e8\u7247\u6bb5\u53ef\u80fd\u83b7\u5f97\u4e0d\u53ef\u9760\u9ad8\u5206", "TRACE\u5728\u5206\u6570\u5c42\u8fdb\u884c\u8bc1\u636e\u9a8c\u8bc1\uff0c\u800c\u975e\u76f4\u63a5\u505a\u8868\u793a\u878d\u5408\uff0c\u5e73\u6ed1\u8fb9\u7f18\u5316\u591a\u6761\u67e5\u8be2-\u5bc4\u5b58\u5668-\u5e27\u8def\u5f84", "\u5728ActivityNet Captions\u3001Charades-STA\u548cTVR\u4e0a\u5747\u53d6\u5f97\u6700\u4f73SumR\uff0c\u76f8\u6bd4DreamPRVR\u63d0\u53471.2\u30011.1\u30011.5\u70b9"], "keywords": ["\u89c6\u9891\u68c0\u7d22", "\u591a\u6a21\u6001", "\u8bc1\u636e\u5efa\u6a21", "\u5206\u6570\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08999v1", "published_at": "2026-09-08", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Concentrate After Imagination: Text-Conditioned Evidence Grounding for Partially Relevant Video Retrieval", "tldr": "TRACE\u7528\u67e5\u8be2\u6761\u4ef6\u8bc1\u636e\u6821\u51c6\u89c6\u9891\u7247\u6bb5\u68c0\u7d22\u5206\u6570", "upvotes": 0, "what_it_is": "\u8bba\u6587\u9488\u5bf9\u90e8\u5206\u76f8\u5173\u89c6\u9891\u68c0\u7d22\u4e2d\u201c\u5c40\u90e8\u5cf0\u503c\u8bef\u5224\u201d\u95ee\u9898\uff0c\u63d0\u51faTRACE\uff1a\u4e00\u79cd\u6587\u672c\u6761\u4ef6\u7684\u8bc1\u636e\u9a8c\u8bc1\u7b97\u5b50\u3002\u5b83\u5229\u7528\u67e5\u8be2\u6fc0\u6d3b\u5168\u5c40\u89c6\u9891\u5bc4\u5b58\u5668\uff0c\u5c06\u652f\u6301\u8bc1\u636e\u8def\u7531\u5230\u5e27\u7ea7\u5206\u6570\uff0c\u5e76\u4f5c\u4e3a\u6b8b\u5dee\u6821\u51c6\u539f\u59cb\u5c40\u90e8\u5206\u6570\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4ece\u6392\u5e8f\u5206\u6570\u6821\u51c6\u89d2\u5ea6\u63d0\u5347\u89c6\u9891\u68c0\u7d22\u53ef\u9760\u6027\uff0c\u80fd\u51cf\u5c11\u7531\u5c40\u90e8\u76f8\u4f3c\u7247\u6bb5\u5bfc\u81f4\u7684\u8bef\u68c0\uff0c\u5e76\u901a\u8fc7\u591a\u79cd\u6d88\u878d\u548c\u8fc1\u79fb\u5b9e\u9a8c\u9a8c\u8bc1\u5176\u589e\u76ca\u6765\u81ea\u67e5\u8be2\u6761\u4ef6\u8bc1\u636e\u9a8c\u8bc1\u3002"}, {"abstract": "Pixel-level annotation of fixed traffic-camera imagery is expensive, while crosswalk models trained from street-level imagery face a substantial viewpoint and appearance shift when applied to elevated CCTV. We investigate a data-efficient target-domain pipeline using 241 manually annotated CCTV images and 5,926 unlabeled CCTV frames. A source-domain experiment trains a 31.0M-parameter custom U-Net on 3,300 first-person-view (FPV) images and obtains 93.05% IoU on its 330-image FPV test split. This result is a source baseline, not transferred performance: the released CCTV notebook instantiates a 42.0M-parameter DeepLabV3-ResNet50 from torchvision weights, and no compatible mapping from the U-Net checkpoint is implemented. Training on 201 manual CCTV images and selecting on 40 held-out manual masks yields 88.91% IoU. The model then predicts all unlabeled frames; image-level certainty and a largest-component area prior rank the candidates, and the top 1,000 attain mean certainty 0.976 and mean combined score 0.988. A repository audit shows that the reported second-stage 98.52% IoU was measured on a 150-image split containing only teacher-generated pseudo-masks. Because of a directory-layout mismatch, the executed combined-data loader found zero manual samples and split 1,000 pseudo-labeled samples into 850 training and 150 evaluation samples. We therefore report 98.52% as internal pseudo-label agreement rather than human-ground-truth accuracy. The defensible target-domain result is 88.91% IoU on the 40 manual validation images. Batch-one FP32 inference at 512 x 512 requires 12.98 ms, corresponding to 77.03 FPS, on an NVIDIA RTX A6000 48 GB GPU. These findings support the practicality of confidence-and-geometry filtering while also showing why pseudo-label evaluation must remain isolated from the labels used for self-training.", "arxiv_id": "2609.08914", "arxiv_url": "https://arxiv.org/abs/2609.08914", "authors": ["Abdirashid Omar", "Jonghyuk Park"], "brief": "\u8bba\u6587\u7814\u7a76\u7528\u5c11\u91cf\u4eba\u5de5\u6807\u6ce8CCTV\u56fe\u50cf\u548c\u5927\u91cf\u672a\u6807\u6ce8\u5e27\u8fdb\u884c\u76ee\u6807\u57df\u4eba\u884c\u6a2a\u9053\u5206\u5272\uff0c\u5e76\u901a\u8fc7\u7f6e\u4fe1\u5ea6\u4e0e\u51e0\u4f55\u5148\u9a8c\u7b5b\u9009\u4f2a\u6807\u7b7e\u3002\u6458\u8981\u540c\u65f6\u6307\u51fa\u6b64\u524d98.52% IoU\u5b9e\u9645\u662f\u4f2a\u6807\u7b7e\u5185\u90e8\u4e00\u81f4\u6027\u800c\u975e\u4eba\u5de5\u771f\u503c\u6027\u80fd\uff0c\u53ef\u9760\u7ed3\u679c\u4e3a40\u5f20\u4eba\u5de5\u9a8c\u8bc1\u56fe\u4e0a\u768488.91% IoU\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08914", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528241\u5f20\u4eba\u5de5\u6807\u6ce8CCTV\u56fe\u50cf\u4e0e5,926\u5f20\u672a\u6807\u6ce8CCTV\u5e27\uff1bDeepLabV3-ResNet50\u5728201\u5f20\u8bad\u7ec3\u300140\u5f20\u9a8c\u8bc1\u4e0a\u8fbe\u523088.91% IoU\u3002", "\u57fa\u4e8e\u56fe\u50cf\u7ea7\u7f6e\u4fe1\u5ea6\u548c\u6700\u5927\u8fde\u901a\u57df\u9762\u79ef\u5148\u9a8c\u7b5b\u9009\u4f2a\u6807\u7b7e\uff0c\u524d1,000\u4e2a\u5019\u9009\u5e73\u5747\u7f6e\u4fe1\u5ea60.976\u3001\u7efc\u5408\u5f97\u52060.988\u3002", "\u5ba1\u8ba1\u53d1\u73b098.52% IoU\u8bc4\u4f30\u96c6\u53ea\u542b\u6559\u5e08\u751f\u6210\u4f2a\u6807\u7b7e\uff0c\u5e94\u89c6\u4e3a\u4f2a\u6807\u7b7e\u4e00\u81f4\u6027\uff1b512\u00d7512\u5355\u5f20\u63a8\u7406\u5728RTX A6000\u4e0a\u8fbe77.03 FPS\u3002"], "keywords": ["\u8bed\u4e49\u5206\u5272", "\u534a\u76d1\u7763\u5b66\u4e60", "\u4f2a\u6807\u7b7e", "\u9065\u611f\u53d8\u5316\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08914v1", "published_at": "2026-09-08", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "CoSA: Correlation-Guided Change A ttention with Learnable Residual Gating for Remote Sensing Change Detection", "tldr": "\u5c11\u6837\u672cCCTV\u4eba\u884c\u6a2a\u9053\u5206\u5272\u4e0e\u4f2a\u6807\u7b7e\u5ba1\u8ba1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u7528\u5c11\u91cf\u4eba\u5de5\u6807\u6ce8CCTV\u56fe\u50cf\u548c\u5927\u91cf\u672a\u6807\u6ce8\u5e27\u8fdb\u884c\u76ee\u6807\u57df\u4eba\u884c\u6a2a\u9053\u5206\u5272\uff0c\u5e76\u901a\u8fc7\u7f6e\u4fe1\u5ea6\u4e0e\u51e0\u4f55\u5148\u9a8c\u7b5b\u9009\u4f2a\u6807\u7b7e\u3002\u6458\u8981\u540c\u65f6\u6307\u51fa\u6b64\u524d98.52% IoU\u5b9e\u9645\u662f\u4f2a\u6807\u7b7e\u5185\u90e8\u4e00\u81f4\u6027\u800c\u975e\u4eba\u5de5\u771f\u503c\u6027\u80fd\uff0c\u53ef\u9760\u7ed3\u679c\u4e3a40\u5f20\u4eba\u5de5\u9a8c\u8bc1\u56fe\u4e0a\u768488.91% IoU\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u4e86\u5c0f\u6837\u672c\u76ee\u6807\u57df\u9002\u914d\u548c\u4f2a\u6807\u7b7e\u7b5b\u9009\u5728\u56fa\u5b9a\u6444\u50cf\u5934\u573a\u666f\u4e2d\u7684\u5b9e\u7528\u6027\uff0c\u540c\u65f6\u63ed\u793a\u81ea\u8bad\u7ec3\u4e2d\u5c06\u4f2a\u6807\u7b7e\u6df7\u5165\u8bc4\u4f30\u4f1a\u5bfc\u81f4\u6027\u80fd\u865a\u9ad8\u7684\u95ee\u9898\uff0c\u5bf9\u534a\u76d1\u7763\u89c6\u89c9\u7cfb\u7edf\u7684\u8bc4\u4f30\u89c4\u8303\u6709\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "The rapid growth of multimodal data has intensified the need for question answering (QA) systems capable of reasoning across heterogeneous sources such as text, tables, and images. In this paper, we present a comprehensive methodological comparison of three influential frameworks, namely Multimodal Adaptive Extraction (MAE), Solar, and UniMMQA, tracing the evolution of multimodal question answering from modality-adaptive pipelines to fully unified architectures. We examine how each approach models cross-modal interactions, transforms heterogeneous inputs, and performs reasoning, highlighting key design differences in modality representation, reasoning, and answer generation. Our analysis demonstrates a clear shift from explicit modality-specific processing toward unified text-centric formulations enabled by pre-trained language models (PLMs). Empirical comparisons across benchmark datasets show that this transition leads to substantial improvements in both Exact Match (EM) and F1-Scores, with UniMMQA achieving the most consistent and scalable performance. Despite these advances, we identify persistent challenges, including information loss during modality transformation, error propagation in multi-stage pipelines, and limitations in capturing fine-grained cross-modal dependencies. Overall, this study provides a deeper understanding of current design trends and offers insights into the future direction of unified multimodal reasoning systems.", "arxiv_id": "2609.08896", "arxiv_url": "https://arxiv.org/abs/2609.08896", "authors": ["Abdullah Al Shafi"], "brief": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83 MAE\u3001Solar \u4e0e UniMMQA \u4e09\u7c7b\u591a\u6a21\u6001\u95ee\u7b54\u6846\u67b6\uff0c\u68b3\u7406\u5176\u4ece\u6a21\u6001\u81ea\u9002\u5e94\u62bd\u53d6\u6d41\u6c34\u7ebf\u5230\u7edf\u4e00\u67b6\u6784\u7684\u6f14\u8fdb\u3002\u8bba\u6587\u91cd\u70b9\u5206\u6790\u8de8\u6a21\u6001\u4ea4\u4e92\u3001\u5f02\u6784\u8f93\u5165\u8f6c\u6362\u3001\u63a8\u7406\u4e0e\u7b54\u6848\u751f\u6210\u65b9\u5f0f\u7684\u5dee\u5f02\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08896", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u591a\u6a21\u6001\u95ee\u7b54\u6b63\u4ece\u663e\u5f0f\u6a21\u6001\u4e13\u7528\u5904\u7406\u8f6c\u5411\u7531\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u9a71\u52a8\u7684\u6587\u672c\u4e2d\u5fc3\u7edf\u4e00\u8868\u793a\u3002", "\u5728\u591a\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u6bd4\u8f83 EM \u4e0e F1\uff0c\u663e\u793a UniMMQA \u5177\u5907\u66f4\u7a33\u5b9a\u3001\u53ef\u6269\u5c55\u7684\u8868\u73b0\u3002", "\u603b\u7ed3\u73b0\u6709\u6311\u6218\uff1a\u6a21\u6001\u8f6c\u6362\u4e2d\u7684\u4fe1\u606f\u635f\u5931\u3001\u591a\u9636\u6bb5\u6d41\u6c34\u7ebf\u8bef\u5dee\u4f20\u64ad\u3001\u7ec6\u7c92\u5ea6\u8de8\u6a21\u6001\u4f9d\u8d56\u5efa\u6a21\u4e0d\u8db3\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u95ee\u7b54\u7cfb\u7edf", "\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b", "\u8de8\u6a21\u6001\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08896v1", "published_at": "2026-09-08", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Evolution of Multimodal Question Answering: From Modality-Adaptive Extraction to Unified Language Representation", "tldr": "\u7efc\u8ff0\u591a\u6a21\u6001\u95ee\u7b54\u8d70\u5411\u7edf\u4e00\u8bed\u8a00\u8868\u793a", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83 MAE\u3001Solar \u4e0e UniMMQA \u4e09\u7c7b\u591a\u6a21\u6001\u95ee\u7b54\u6846\u67b6\uff0c\u68b3\u7406\u5176\u4ece\u6a21\u6001\u81ea\u9002\u5e94\u62bd\u53d6\u6d41\u6c34\u7ebf\u5230\u7edf\u4e00\u67b6\u6784\u7684\u6f14\u8fdb\u3002\u8bba\u6587\u91cd\u70b9\u5206\u6790\u8de8\u6a21\u6001\u4ea4\u4e92\u3001\u5f02\u6784\u8f93\u5165\u8f6c\u6362\u3001\u63a8\u7406\u4e0e\u7b54\u6848\u751f\u6210\u65b9\u5f0f\u7684\u5dee\u5f02\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e0d\u662f\u63d0\u51fa\u5355\u4e00\u65b0\u6a21\u578b\uff0c\u800c\u662f\u5bf9\u4ee3\u8868\u6027\u591a\u6a21\u6001\u95ee\u7b54\u65b9\u6cd5\u8fdb\u884c\u65b9\u6cd5\u8bba\u5bf9\u6bd4\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u9886\u57df\u67b6\u6784\u6f14\u8fdb\u8d8b\u52bf\uff0c\u5e76\u4e3a\u7edf\u4e00\u591a\u6a21\u6001\u63a8\u7406\u7cfb\u7edf\u7684\u8bbe\u8ba1\u63d0\u4f9b\u53c2\u8003\u3002"}, {"abstract": "Person identification from millimeter-wave (mmWave) point clouds has mainly relied on gait. Indoor walking, however, is often brief and interrupted, while other activities of daily living (ADLs) may provide complementary identity information. We investigate identification across seven ADLs using mm-ADL, a new point-cloud dataset collected from 11 subjects under a controlled protocol. This extension introduces heterogeneous states and transitions whose spatial and temporal characteristics vary with activity. We therefore study whether activity can provide useful context for learning identity representations. We propose an activity-conditioned framework in which a human activity recognition router dispatches each clip to an activity-specific identity expert. The framework is implemented as a supervised mixture of experts, using a dual-stream static-dynamic PointNet (DS-SDPNet) to combine time-aggregated spatial structure with frame-to-frame information. We evaluate closed-set identification (ID) and subject-disjoint re-identification (ReID). With learned hard routing, ID accuracy increases from 62.1% to 68.0%. In a two-occupant ReID setting, hard routing increases mAP from 57.2% to 75.4% and Rank-1 accuracy from 59.1% to 82.1%. Under a matched gallery partition, activity-specific experts also outperform a shared embedding, showing that the gain extends beyond restricting the gallery. These results support the feasibility of using ADLs beyond gait for identification and the value of activity conditioning under controlled indoor conditions.", "arxiv_id": "2609.08818", "arxiv_url": "https://arxiv.org/abs/2609.08818", "authors": ["Xilai Wang", "Zixiong Han", "Saad Rhanmouni", "Chenzhe Zhao", "Yunze Lu", "Miodrag Bolic"], "brief": "\u672c\u6587\u7814\u7a76\u7528\u6beb\u7c73\u6ce2\u70b9\u4e91\u5728\u591a\u79cd\u65e5\u5e38\u6d3b\u52a8\u4e2d\u8fdb\u884c\u4eba\u5458\u8bc6\u522b\uff0c\u800c\u4e0d\u53ea\u4f9d\u8d56\u6b65\u6001\uff0c\u5e76\u6784\u5efa\u4e86\u5305\u542b11\u540d\u53d7\u8bd5\u8005\u30017\u7c7b\u6d3b\u52a8\u7684 mm-ADL \u6570\u636e\u96c6\u3002\u63d0\u51fa\u6d3b\u52a8\u6761\u4ef6\u5316\u7684\u6df7\u5408\u4e13\u5bb6\u6846\u67b6\uff0c\u7531\u6d3b\u52a8\u8bc6\u522b\u8def\u7531\u5668\u5206\u53d1\u5230\u7279\u5b9a\u8eab\u4efd\u4e13\u5bb6\uff0c\u5728\u95ed\u96c6\u8bc6\u522b\u548c\u4e24\u4eba\u91cd\u8bc6\u522b\u4efb\u52a1\u4e0a\u663e\u8457\u63d0\u5347\u51c6\u786e\u7387\u4e0e mAP\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08818", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6beb\u7c73\u6ce2\u70b9\u4e91", "\u4eba\u5458\u8bc6\u522b", "\u884c\u4e3a\u8bc6\u522b", "\u6df7\u5408\u4e13\u5bb6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08818v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Gait: Person Identification from Millimeter-Wave Point Clouds Across Activities of Daily Living", "tldr": "\u672c\u6587\u7814\u7a76\u7528\u6beb\u7c73\u6ce2\u70b9\u4e91\u5728\u591a\u79cd\u65e5\u5e38\u6d3b\u52a8\u4e2d\u8fdb\u884c\u4eba\u5458\u8bc6\u522b\uff0c\u800c\u4e0d\u53ea\u4f9d\u8d56\u6b65\u6001\uff0c\u5e76\u6784\u5efa\u4e86\u5305\u542b11\u540d\u53d7\u8bd5\u8005\u30017\u7c7b\u6d3b\u52a8\u7684 mm-ADL \u6570\u636e\u96c6\u3002\u63d0\u51fa\u6d3b\u52a8\u6761\u4ef6\u5316\u7684\u6df7\u5408\u4e13\u5bb6\u6846\u67b6\uff0c\u7531\u6d3b\u52a8\u8bc6\u522b\u8def\u7531\u5668\u5206\u53d1\u5230\u7279\u5b9a\u8eab\u4efd\u4e13\u5bb6\uff0c\u5728\u95ed\u96c6\u8bc6\u522b\u548c\u4e24\u4eba\u91cd\u8bc6\u522b\u4efb\u52a1\u4e0a\u663e\u8457\u63d0\u5347\u51c6\u786e\u7387\u4e0e mAP\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Arm pose estimation enables applications in fitness, extended reality input, rehabilitation, and life logging. Prior smartwatch-based approaches rely on calibration poses and preprocessing pipelines that transform raw IMU measurements into standardized training formats. These steps hinder deployment in everyday settings and introduce errors due to imperfect calibration and sensor drift. We present ArmPoser, a calibration-free arm pose estimation system using a single smartwatch IMU. Our central contribution is training models directly in the reference frame native to consumer smartwatches, aligning learning with how IMU data is produced by deployed devices. By operating on device-native axes, ArmPoser removes the need for coordinate transformations, explicit alignment, and bone-offset calibration used in prior work. We further augment training with physically grounded variations in watch placement and arm morphology to account for user-specific variability. ArmPoser also includes a wear-configuration module that infers anterior or posterior forearm placement and crown orientation. We evaluate pose estimation on public benchmarks and on a 10-participant, 30-activity study using watchOS and Android smartwatches, where ArmPoser matches or exceeds calibrated baselines without any user calibration.", "arxiv_id": "2609.08806", "arxiv_url": "https://arxiv.org/abs/2609.08806", "authors": ["Bishnu Dev", "Vasco Xu", "Xi-Aan Loh", "Chenfeng Gao", "Henry Hoffmann", "Karan Ahuja"], "brief": "ArmPoser \u4f7f\u7528\u5355\u4e2a\u667a\u80fd\u624b\u8868 IMU \u5b9e\u73b0\u5b9e\u65f6\u3001\u514d\u6821\u51c6\u7684\u624b\u81c2\u59ff\u6001\u4f30\u8ba1\uff0c\u76f4\u63a5\u5728\u6d88\u8d39\u7ea7\u624b\u8868\u539f\u751f\u5750\u6807\u7cfb\u4e2d\u8bad\u7ec3\u6a21\u578b\uff0c\u907f\u514d\u4f20\u7edf\u65b9\u6cd5\u4e2d\u7684\u5750\u6807\u53d8\u6362\u3001\u663e\u5f0f\u5bf9\u9f50\u548c\u9aa8\u9abc\u504f\u79fb\u6821\u51c6\u3002\u5b83\u901a\u8fc7\u6a21\u62df\u624b\u8868\u4f69\u6234\u4f4d\u7f6e\u548c\u624b\u81c2\u5f62\u6001\u5dee\u5f02\u589e\u5f3a\u8bad\u7ec3\uff0c\u5e76\u80fd\u8bc6\u522b\u4f69\u6234\u914d\u7f6e\uff1b\u5728\u516c\u5f00\u57fa\u51c6\u548c\u771f\u5b9e\u7528\u6237\u7814\u7a76\u4e2d\uff0c\u65e0\u9700\u7528\u6237\u6821\u51c6\u5373\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u6821\u51c6\u5f0f\u57fa\u7ebf\u3002", "categories": ["cs.CV", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08806", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u59ff\u6001\u4f30\u8ba1", "\u53ef\u7a7f\u6234\u8bbe\u5907", "IMU", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08806v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ArmPoser: Real-Time, Calibration-Free Arm Pose Estimation from Smartwatch IMU", "tldr": "ArmPoser \u4f7f\u7528\u5355\u4e2a\u667a\u80fd\u624b\u8868 IMU \u5b9e\u73b0\u5b9e\u65f6\u3001\u514d\u6821\u51c6\u7684\u624b\u81c2\u59ff\u6001\u4f30\u8ba1\uff0c\u76f4\u63a5\u5728\u6d88\u8d39\u7ea7\u624b\u8868\u539f\u751f\u5750\u6807\u7cfb\u4e2d\u8bad\u7ec3\u6a21\u578b\uff0c\u907f\u514d\u4f20\u7edf\u65b9\u6cd5\u4e2d\u7684\u5750\u6807\u53d8\u6362\u3001\u663e\u5f0f\u5bf9\u9f50\u548c\u9aa8\u9abc\u504f\u79fb\u6821\u51c6\u3002\u5b83\u901a\u8fc7\u6a21\u62df\u624b\u8868\u4f69\u6234\u4f4d\u7f6e\u548c\u624b\u81c2\u5f62\u6001\u5dee\u5f02\u589e\u5f3a\u8bad\u7ec3\uff0c\u5e76\u80fd\u8bc6\u522b\u4f69\u6234\u914d\u7f6e\uff1b\u5728\u516c\u5f00\u57fa\u51c6\u548c\u771f\u5b9e\u7528\u6237\u7814\u7a76\u4e2d\uff0c\u65e0\u9700\u7528\u6237\u6821\u51c6\u5373\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u6821\u51c6\u5f0f\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Preoperative evaluation of trigeminal neuralgia (TN) often requires joint interpretation of structural MRI, which depicts the trigeminal nerve and surrounding cisternal anatomy, and time-of-flight MRA, which highlights vascular structures. Although MRI-MRA fusion is clinically attractive for visualizing neurovascular compression, this task is poorly captured by conventional whole-brain registration evaluation because the clinically relevant target is a small trigeminal ROI, vessel annotations are partial and clinically focused, local TOF-MRA contrast is variable, and field-of-view mismatch can limit deformable alignment. We formulate TN MRI-MRA fusion as an ROI-centered neurovascular registration-evaluation problem and construct a benchmark from 149 patients with clinician-annotated bilateral trigeminal ROIs. Six representative registration pipelines were evaluated using local image-based metrics, segmentation-derived vessel-localization metrics, prediction-volume analysis, and contrast- and FOV-stratified comparisons. Conventional evaluation summaries were often misleading: local image similarity, vessel-background separability, and downstream vessel localization did not co-rank methods; one-sided vessel distances were strongly affected by predicted vessel extent under partial annotations; and local MRA contrast determined when vessel-separability metrics were informative. Deformable refinement provided only a small, FOV-dependent benefit over affine alignment, while reader review showed that locally favorable vessel distances could coexist with globally implausible registrations. These findings indicate that TN MRI-MRA registration should be evaluated as a local, vessel-aware, contrast-sensitive, and FOV-aware visualization task rather than as generic multimodal brain registration. Our code is publicly available at https://github.com/jhuldr/TN-Reg-Benchmark.", "arxiv_id": "2609.08805", "arxiv_url": "https://arxiv.org/abs/2609.08805", "authors": ["Xupeng Zhang", "Xihang Wang", "Michael Xie", "Haoyuan Liang", "Hau Ern Lien", "Oishika Das", "James Feghali", "Risheng Xu", "Peirong Liu"], "brief": "\u672c\u6587\u5c06\u4e09\u53c9\u795e\u7ecf\u75db\u672f\u524d MRI-MRA \u878d\u5408\u91cd\u65b0\u5b9a\u4e49\u4e3a\u4ee5\u4e09\u53c9\u795e\u7ecf\u5c40\u90e8 ROI \u4e3a\u4e2d\u5fc3\u7684\u795e\u7ecf\u8840\u7ba1\u914d\u51c6\u8bc4\u4f30\u95ee\u9898\uff0c\u5e76\u57fa\u4e8e149\u540d\u60a3\u8005\u548c\u4e34\u5e8a\u6807\u6ce8\u6784\u5efa\u57fa\u51c6\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u4f20\u7edf\u5168\u8111\u914d\u51c6\u6307\u6807\u5e38\u4f1a\u8bef\u5bfc\u8bc4\u4f30\uff0c\u5c40\u90e8\u8840\u7ba1\u611f\u77e5\u3001\u5bf9\u6bd4\u5ea6\u654f\u611f\u548c\u89c6\u91ce\u5339\u914d\u7684\u6307\u6807\u66f4\u80fd\u53cd\u6620\u4e34\u5e8a\u53ef\u7528\u6027\uff1b\u5f62\u53d8\u914d\u51c6\u76f8\u5bf9\u4eff\u5c04\u914d\u51c6\u6536\u76ca\u6709\u9650\u4e14\u4f9d\u8d56\u89c6\u91ce\u6761\u4ef6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08805", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u56fe\u50cf\u914d\u51c6", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08805v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluation Principles for MRI-MRA Registration in Trigeminal Neuralgia: An ROI-Centered Neurovascular Benchmark", "tldr": "\u672c\u6587\u5c06\u4e09\u53c9\u795e\u7ecf\u75db\u672f\u524d MRI-MRA \u878d\u5408\u91cd\u65b0\u5b9a\u4e49\u4e3a\u4ee5\u4e09\u53c9\u795e\u7ecf\u5c40\u90e8 ROI \u4e3a\u4e2d\u5fc3\u7684\u795e\u7ecf\u8840\u7ba1\u914d\u51c6\u8bc4\u4f30\u95ee\u9898\uff0c\u5e76\u57fa\u4e8e149\u540d\u60a3\u8005\u548c\u4e34\u5e8a\u6807\u6ce8\u6784\u5efa\u57fa\u51c6\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u4f20\u7edf\u5168\u8111\u914d\u51c6\u6307\u6807\u5e38\u4f1a\u8bef\u5bfc\u8bc4\u4f30\uff0c\u5c40\u90e8\u8840\u7ba1\u611f\u77e5\u3001\u5bf9\u6bd4\u5ea6\u654f\u611f\u548c\u89c6\u91ce\u5339\u914d\u7684\u6307\u6807\u66f4\u80fd\u53cd\u6620\u4e34\u5e8a\u53ef\u7528\u6027\uff1b\u5f62\u53d8\u914d\u51c6\u76f8\u5bf9\u4eff\u5c04\u914d\u51c6\u6536\u76ca\u6709\u9650\u4e14\u4f9d\u8d56\u89c6\u91ce\u6761\u4ef6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hyperspectral unmixing decomposes mixed pixels into material endmembers and their abundances from contiguous spectral observations. In modular sensing pipelines, endmembers are often first identified and then treated as fixed during abundance estimation. When this fixed endmember prior is inaccurate, spatially structured mismatch arising from illumination changes, sensor artifacts, or material boundaries may be incorrectly captured by the abundance variables, leading to unstable decompositions. This study presents an interpretable stage-wise hyperspectral unmixing framework (I-HyperSU) under fixed endmember priors, which is explicitly decomposed into a fixed endmember matrix $\\mathbf{A}$, an abundance block $\\mathbf{X}$, and a structural residual refinement block $\\mathbf{S}$. The X-block estimates abundances using FISTA with nonnegativity and sparsity enhancement, and a soft penalty that approximately enforces sum-to-one constraints. The S-block jointly applies low-rank SVD structural regularization and a lightweight deep image prior (DIP) to refine structured residuals. This staged design makes the interaction between abundance and residual components transparent and interpretable. Experiments on Samson, Urban, and Jasper Ridge datasets demonstrate that, under fixed and imperfect endmember priors, soft abundance relaxation consistently outperforms hard simplex projection. Under the default N-FINDR endmember prior, the proposed framework reduces the joint reconstruction error by 61.7\\%--69.5\\% compared with a fixed-$\\mathbf{A}$ UCLS baseline, while keeping the abundance RMSE nearly unchanged, indicating that the residual refinement branch accounts for structured model mismatch without degrading the abundance estimates. For example, on Urban, the reconstruction SAM decreases from $5.99^\\circ$ for the X-only model to $1.92^\\circ$ for the full model.", "arxiv_id": "2609.08786", "arxiv_url": "https://arxiv.org/abs/2609.08786", "authors": ["Ziyi Guan", "Jianping Zhang", "Qian Liu"], "brief": "\u672c\u6587\u63d0\u51fa I-HyperSU\uff1a\u5728\u56fa\u5b9a\u4e14\u53ef\u80fd\u4e0d\u51c6\u786e\u7684\u7aef\u5143\u5148\u9a8c\u4e0b\uff0c\u5c06\u9ad8\u5149\u8c31\u89e3\u6df7\u663e\u5f0f\u5206\u4e3a\u4e30\u5ea6\u4f30\u8ba1\u4e0e\u7ed3\u6784\u5316\u6b8b\u5dee refinement \u4e24\u9636\u6bb5\u3002\u65b9\u6cd5\u7528 FISTA \u4f30\u8ba1\u7a00\u758f\u975e\u8d1f\u4e30\u5ea6\uff0c\u5e76\u7ed3\u5408\u4f4e\u79e9 SVD \u4e0e\u8f7b\u91cf DIP \u4fee\u6b63\u7ed3\u6784\u5316\u5931\u914d\uff0c\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u663e\u8457\u964d\u4f4e\u91cd\u5efa\u8bef\u5dee\u4e14\u57fa\u672c\u4e0d\u635f\u5bb3\u4e30\u5ea6\u7cbe\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08786", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u5149\u8c31\u89e3\u6df7", "\u53ef\u89e3\u91ca\u5b66\u4e60", "\u4f4e\u79e9\u5efa\u6a21", "\u6df1\u5ea6\u56fe\u50cf\u5148\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08786v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Interpretable Hyperspectral Unmixing Framework with Fixed Endmember Prior and Structured Residual Refinement", "tldr": "\u672c\u6587\u63d0\u51fa I-HyperSU\uff1a\u5728\u56fa\u5b9a\u4e14\u53ef\u80fd\u4e0d\u51c6\u786e\u7684\u7aef\u5143\u5148\u9a8c\u4e0b\uff0c\u5c06\u9ad8\u5149\u8c31\u89e3\u6df7\u663e\u5f0f\u5206\u4e3a\u4e30\u5ea6\u4f30\u8ba1\u4e0e\u7ed3\u6784\u5316\u6b8b\u5dee refinement \u4e24\u9636\u6bb5\u3002\u65b9\u6cd5\u7528 FISTA \u4f30\u8ba1\u7a00\u758f\u975e\u8d1f\u4e30\u5ea6\uff0c\u5e76\u7ed3\u5408\u4f4e\u79e9 SVD \u4e0e\u8f7b\u91cf DIP \u4fee\u6b63\u7ed3\u6784\u5316\u5931\u914d\uff0c\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u663e\u8457\u964d\u4f4e\u91cd\u5efa\u8bef\u5dee\u4e14\u57fa\u672c\u4e0d\u635f\u5bb3\u4e30\u5ea6\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hyperspectral images (HSIs) are often degraded by mixed noise, including band-dependent Gaussian perturbations and structured artifacts such as stripes, dead-lines, and impulse noise. Most deep denoisers regress the clean image directly, entangling signal and structured noise. We instead model HSI denoising as $\\Y=\\A\\X+\\Snoise+\\Nnoise$, where $\\A\\X$ is a low-rank spectral-subspace (unmixing) reconstruction, $\\Snoise$ is structured sparse noise and $\\Nnoise$ is residual Gaussian noise. The resulting regularized optimization problem is unrolled into AXS-Net, a $K$-stage alternating proximal-point framework. Each stage combines an analytic spectral-basis gradient step, an SSX-Block proximal operator for abundance coefficients, and an SBlock proximal operator for the structured residual with column-consistent and sparse priors. This optimization correspondence exposes interpretable endmembers, abundance maps, and structured-noise estimates. Across ICVL, CAVE, and Harvard datasets and five noise configurations, the proposed AXS-Net achieves strong in-domain accuracy and competitive zero-shot transfer, with consistent gains across all five noise regimes on ICVL and Harvard. The recovered structured-noise closely follows the synthetic reference, and the recovered spectral basis is smooth and band-ordered rather than an arbitrary set of latent channels.", "arxiv_id": "2609.08777", "arxiv_url": "https://arxiv.org/abs/2609.08777", "authors": ["Ziyi Guan", "Jianping Zhang", "Zheng Yang"], "brief": "\u8bba\u6587\u5c06\u9ad8\u5149\u8c31\u56fe\u50cf\u53bb\u566a\u663e\u5f0f\u5efa\u6a21\u4e3a\u4f4e\u79e9\u5149\u8c31\u5b50\u7a7a\u95f4\u91cd\u5efa\u3001\u7ed3\u6784\u5316\u7a00\u758f\u566a\u58f0\u548c\u9ad8\u65af\u6b8b\u5dee\u566a\u58f0\u7684\u5206\u89e3\uff0c\u5e76\u5c55\u5f00\u4e3a\u53ef\u89e3\u91ca\u7684 AXS-Net \u4ea4\u66ff\u8fd1\u7aef\u4f18\u5316\u7f51\u7edc\u3002\u8be5\u65b9\u6cd5\u5728 ICVL\u3001CAVE\u3001Harvard \u591a\u6570\u636e\u96c6\u548c\u591a\u79cd\u566a\u58f0\u8bbe\u7f6e\u4e0b\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\uff0c\u5e76\u80fd\u6062\u590d\u6709\u610f\u4e49\u7684\u7aef\u5143\u3001\u4e30\u5ea6\u56fe\u548c\u7ed3\u6784\u5316\u566a\u58f0\u4f30\u8ba1\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08777", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u5149\u8c31\u56fe\u50cf", "\u56fe\u50cf\u53bb\u566a", "\u6df1\u5ea6\u5c55\u5f00", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08777v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AXS-Net: Interpretable Deep Unfolding for Hyperspectral Image Denoising via Spectral Basis Unmixing and Structured Noise Refinement", "tldr": "\u8bba\u6587\u5c06\u9ad8\u5149\u8c31\u56fe\u50cf\u53bb\u566a\u663e\u5f0f\u5efa\u6a21\u4e3a\u4f4e\u79e9\u5149\u8c31\u5b50\u7a7a\u95f4\u91cd\u5efa\u3001\u7ed3\u6784\u5316\u7a00\u758f\u566a\u58f0\u548c\u9ad8\u65af\u6b8b\u5dee\u566a\u58f0\u7684\u5206\u89e3\uff0c\u5e76\u5c55\u5f00\u4e3a\u53ef\u89e3\u91ca\u7684 AXS-Net \u4ea4\u66ff\u8fd1\u7aef\u4f18\u5316\u7f51\u7edc\u3002\u8be5\u65b9\u6cd5\u5728 ICVL\u3001CAVE\u3001Harvard \u591a\u6570\u636e\u96c6\u548c\u591a\u79cd\u566a\u58f0\u8bbe\u7f6e\u4e0b\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\uff0c\u5e76\u80fd\u6062\u590d\u6709\u610f\u4e49\u7684\u7aef\u5143\u3001\u4e30\u5ea6\u56fe\u548c\u7ed3\u6784\u5316\u566a\u58f0\u4f30\u8ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cultural heritage collections often contain contemporary and historical visual records of the same physical object. Linking these records is difficult because corresponding images may differ in viewpoint, acquisition conditions, color reproduction, framing, resolution, and degradation, while genuine historical images are frequently scarce. This study investigates whether synthetically aged contemporary images can replace or complement missing historical training data in bidirectional instance-level retrieval. Synthetic old-domain images are generated using degradation-oriented transformations. An EfficientNetV2-M model is evaluated on identity-disjoint training, validation, and test sets across three dataset partitions and three training seeds. Mixed real-synthetic training is compared with real-only baselines using proportionally scaled and fixed 300-batch-per-epoch schedules. Complete replacement of genuine historical images reduced bidirectional mean R@1 from 86.56% to 81.27%, showing that synthetic aging does not reproduce the full genuine old-domain variability. Increasing the number of independently generated synthetic variants provided no consistent improvement. Under controlled scarcity, however, synthetic completion improved mean R@1 by 3.69 percentage points at 25% genuine historical coverage and by 2.92 points at 50%, relative to the proportionally scaled real-only baselines. At 75%, the gain decreased to 2.00 points, while performance remained comparable to the complete-real-data reference. Fixed-schedule real-only controls did not reproduce these improvements. The results indicate that genuine and synthetic observations are complementary. Synthetic completion primarily benefits retrieval by extending cross-domain identity coverage rather than by increasing training exposure, with its contribution gradually decreasing as genuine historical coverage increases.", "arxiv_id": "2609.08766", "arxiv_url": "https://arxiv.org/abs/2609.08766", "authors": ["Marcin Iwanowski", "Adam Mazgaj", "Ferdynand Gorski", "Sabina Szymoniak"], "brief": "\u672c\u6587\u7814\u7a76\u7528\u5408\u6210\u8001\u5316\u7684\u5f53\u4ee3\u56fe\u50cf\u8865\u8db3\u7a00\u7f3a\u5386\u53f2\u56fe\u50cf\uff0c\u4ee5\u8bad\u7ec3\u8de8\u57df\u6587\u5316\u9057\u4ea7\u5b9e\u4f8b\u68c0\u7d22\u6a21\u578b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5b8c\u5168\u7528\u5408\u6210\u56fe\u50cf\u66ff\u4ee3\u771f\u5b9e\u5386\u53f2\u56fe\u50cf\u4f1a\u964d\u6027\u80fd\uff0c\u4f46\u5728\u771f\u5b9e\u5386\u53f2\u56fe\u50cf\u8986\u76d6\u7387\u8f83\u4f4e\u65f6\uff0c\u5408\u6210\u8865\u5168\u53ef\u63d0\u5347\u53cc\u5411\u68c0\u7d22R@1\u7ea62\u52304\u4e2a\u767e\u5206\u70b9\uff0c\u8bf4\u660e\u4e8c\u8005\u5177\u6709\u4e92\u8865\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08766", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u5316\u9057\u4ea7\u68c0\u7d22", "\u5408\u6210\u6570\u636e", "\u8de8\u57df\u68c0\u7d22", "\u56fe\u50cf\u9000\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08766v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Compensating for Scarce Historical Images in Cross-Domain Cultural Heritage Retrieval Using Synthetic Aging", "tldr": "\u672c\u6587\u7814\u7a76\u7528\u5408\u6210\u8001\u5316\u7684\u5f53\u4ee3\u56fe\u50cf\u8865\u8db3\u7a00\u7f3a\u5386\u53f2\u56fe\u50cf\uff0c\u4ee5\u8bad\u7ec3\u8de8\u57df\u6587\u5316\u9057\u4ea7\u5b9e\u4f8b\u68c0\u7d22\u6a21\u578b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5b8c\u5168\u7528\u5408\u6210\u56fe\u50cf\u66ff\u4ee3\u771f\u5b9e\u5386\u53f2\u56fe\u50cf\u4f1a\u964d\u6027\u80fd\uff0c\u4f46\u5728\u771f\u5b9e\u5386\u53f2\u56fe\u50cf\u8986\u76d6\u7387\u8f83\u4f4e\u65f6\uff0c\u5408\u6210\u8865\u5168\u53ef\u63d0\u5347\u53cc\u5411\u68c0\u7d22R@1\u7ea62\u52304\u4e2a\u767e\u5206\u70b9\uff0c\u8bf4\u660e\u4e8c\u8005\u5177\u6709\u4e92\u8865\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While 3D Gaussian Splatting (3DGS) has emerged as a powerful representation for real-time novel view synthesis, rendering high-fidelity scenes often relies on a massive number of Gaussian primitives, incurring substantial storage and computational overhead. Existing simplification techniques are largely intrusive, requiring training-time pruning, architectural modifications, or computationally expensive per-scene fine-tuning. These drawbacks limit their deployment on off-the-shelf pretrained models. In this paper, we propose CVT-GS, a novel optimization-free post-hoc simplification framework that directly compresses trained 3DGS scenes without sacrificing visual fidelity. Our approach first constructs spatially coherent cells over Gaussian centers via a geometry-aware Centroidal Voronoi Tessellation (CVT). Subsequently, a lightweight neural cell merger predicts the geometry and appearance of a single, highly representative Gaussian primitive for each cell under differentiable rendering supervision. By formulating simplification as a rendering-aware many-to-one merging process rather than naive primitive pruning, CVT-GS outputs a standard 3DGS scene that is seamlessly compatible with existing renderers. Experiments on various datasets demonstrate the superiority of our method. Notably, when achieving a 100-fold reduction in Gaussian points, our method operates 12 times faster than state-of-the-art methods while improving the PSNR by 1.3 dB.", "arxiv_id": "2609.08730", "arxiv_url": "https://arxiv.org/abs/2609.08730", "authors": ["Bingxian Li", "Yilong Li", "Jingliang Peng", "Peng-Shuai Wang", "Fei Zhu", "Guozheng Li", "Chi Harold Liu", "Guoping Wang", "Bo Pang"], "brief": "\u672c\u6587\u63d0\u51fa CVT-GS\uff0c\u4e00\u79cd\u65e0\u9700\u4f18\u5316\u5fae\u8c03\u7684\u540e\u5904\u7406\u5f0f 3D Gaussian Splatting \u7b80\u5316\u6846\u67b6\uff0c\u53ef\u76f4\u63a5\u538b\u7f29\u5df2\u8bad\u7ec3\u597d\u7684 3DGS \u573a\u666f\u3002\u65b9\u6cd5\u7528\u8d28\u5fc3 Voronoi \u5212\u5206\u6784\u5efa\u7a7a\u95f4\u4e00\u81f4\u7684\u9ad8\u65af\u5355\u5143\uff0c\u5e76\u901a\u8fc7\u8f7b\u91cf\u795e\u7ecf\u5408\u5e76\u5668\u5c06\u6bcf\u4e2a\u5355\u5143\u5408\u6210\u4e3a\u4ee3\u8868\u6027\u9ad8\u65af\uff1b\u5728\u9ad8\u65af\u70b9\u6570\u51cf\u5c11 100 \u500d\u65f6\uff0c\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u5feb 12 \u500d\u4e14 PSNR \u63d0\u5347 1.3 dB\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08730", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u9ad8\u65af\u6e85\u5c04", "\u6a21\u578b\u538b\u7f29", "\u65b0\u89c6\u89d2\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08730v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CVT-GS: Learning to Simplify 3D Gaussian Splatting with Centroidal Voronoi Tessellation", "tldr": "\u672c\u6587\u63d0\u51fa CVT-GS\uff0c\u4e00\u79cd\u65e0\u9700\u4f18\u5316\u5fae\u8c03\u7684\u540e\u5904\u7406\u5f0f 3D Gaussian Splatting \u7b80\u5316\u6846\u67b6\uff0c\u53ef\u76f4\u63a5\u538b\u7f29\u5df2\u8bad\u7ec3\u597d\u7684 3DGS \u573a\u666f\u3002\u65b9\u6cd5\u7528\u8d28\u5fc3 Voronoi \u5212\u5206\u6784\u5efa\u7a7a\u95f4\u4e00\u81f4\u7684\u9ad8\u65af\u5355\u5143\uff0c\u5e76\u901a\u8fc7\u8f7b\u91cf\u795e\u7ecf\u5408\u5e76\u5668\u5c06\u6bcf\u4e2a\u5355\u5143\u5408\u6210\u4e3a\u4ee3\u8868\u6027\u9ad8\u65af\uff1b\u5728\u9ad8\u65af\u70b9\u6570\u51cf\u5c11 100 \u500d\u65f6\uff0c\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u5feb 12 \u500d\u4e14 PSNR \u63d0\u5347 1.3 dB\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pigment deposition in paper marbling displaces the pattern already present, coupling the appearance of each gesture to later actions. We recover executable programs for a deposition-based digital marbling model: given a target image, we optimise an ordered program of capsule insertions whose replay approximates it. The capsule primitive continuously joins circular drops to elongated deposits. Its transport is exactly area-preserving and has a closed-form inverse on the exterior of the deposited region. A replay adjoint reconstructs intermediate states, retaining coordinates lost inside deposits and periodic position checkpoints. At 2000 gestures and 1024^2 pixels, the PyTorch replay implementation uses 8.7x less memory than the tested checkpointed-autograd configuration at comparable step time; the fused implementation fits a program in about four minutes on one workstation GPU. We evaluate image reconstruction on five marbled sheets, compare against transport-disabled fitting, one-pass geometric compensation and a published stroke-based fitter at matched stroke count, and measure sensitivity to an alternative ordered-drop transport. Recovered programs replay across a 4x range of linear resolution. Edits specified in program order or in palette space -- inserting a gesture, recolouring a stage, translating a stage -- replay correctly under the same model; edits specified by image content, such as moving a motif, do not. On synthetic targets with known generating programs, the recovered programs match the images but not the generating gestures under a positional matching statistic. The output is an editable program in the specified digital medium.", "arxiv_id": "2609.08722", "arxiv_url": "https://arxiv.org/abs/2609.08722", "authors": ["Tianqi Liu", "Yushan Han", "Hang Liu"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u53cd\u5411\u6570\u5b57\u6c34\u62d3\u201d\uff1a\u7ed9\u5b9a\u76ee\u6807\u6c34\u62d3\u56fe\u50cf\uff0c\u4f18\u5316\u4e00\u4e32\u6709\u5e8f\u7684\u80f6\u56ca\u72b6\u989c\u6599\u6c89\u79ef\u624b\u52bf\u7a0b\u5e8f\uff0c\u4f7f\u5176\u91cd\u653e\u540e\u903c\u8fd1\u76ee\u6807\u3002\u5176 replay adjoint \u80fd\u91cd\u5efa\u4e2d\u95f4\u72b6\u6001\u5e76\u663e\u8457\u7701\u5185\u5b58\uff0c\u5728 2000 \u4e2a\u624b\u52bf\u30011024\u00b2 \u50cf\u7d20\u4e0b\u6bd4\u6d4b\u8bd5\u7684 checkpointed autograd \u5c11\u7528 8.7 \u500d\u5185\u5b58\uff0c\u4e14\u751f\u6210\u7684\u7a0b\u5e8f\u53ef\u5728\u540c\u4e00\u6570\u5b57\u5a92\u4ecb\u4e2d\u91cd\u653e\u4e0e\u7f16\u8f91\u3002", "categories": ["cs.GR", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08722", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u56fe\u5f62\u5b66", "\u56fe\u50cf\u91cd\u5efa", "\u53ef\u5fae\u6e32\u67d3", "\u7a0b\u5e8f\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08722v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Inverse Digital Marbling: Recovering Gesture Programs with a Replay Adjoint", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u53cd\u5411\u6570\u5b57\u6c34\u62d3\u201d\uff1a\u7ed9\u5b9a\u76ee\u6807\u6c34\u62d3\u56fe\u50cf\uff0c\u4f18\u5316\u4e00\u4e32\u6709\u5e8f\u7684\u80f6\u56ca\u72b6\u989c\u6599\u6c89\u79ef\u624b\u52bf\u7a0b\u5e8f\uff0c\u4f7f\u5176\u91cd\u653e\u540e\u903c\u8fd1\u76ee\u6807\u3002\u5176 replay adjoint \u80fd\u91cd\u5efa\u4e2d\u95f4\u72b6\u6001\u5e76\u663e\u8457\u7701\u5185\u5b58\uff0c\u5728 2000 \u4e2a\u624b\u52bf\u30011024\u00b2 \u50cf\u7d20\u4e0b\u6bd4\u6d4b\u8bd5\u7684 checkpointed autograd \u5c11\u7528 8.7 \u500d\u5185\u5b58\uff0c\u4e14\u751f\u6210\u7684\u7a0b\u5e8f\u53ef\u5728\u540c\u4e00\u6570\u5b57\u5a92\u4ecb\u4e2d\u91cd\u653e\u4e0e\u7f16\u8f91\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Table Structure Recognition (TSR) aims to extract the bounding boxes of cells and table structure (e.g., HTML) from table images. Although current approaches have made significant progress, the latest image-to-sequence methods overlook the explicit utilization of the bounding box information when predicting HTML sequences, leading to error predictions in complex scenes. In this paper, we introduce a novel framework BGTR (Bounding Box-Guided Table Recognizer). To more effectively utilize bounding box information, we first predict the bounding boxes of cells and then use this information to guide the generation of HTML sequences. While utilizing bounding box information can enhance the accuracy of HTML sequences, for natural scene tables, the data volume is too small to allow for sufficient training of bbox-guided HTML generation. In response, we adopt a progressive training method for natural scene tables and introduce SNSTab, a synthetically generated natural scene table dataset. Our experiments on five benchmark datasets demonstrate SOTA performance.", "arxiv_id": "2609.08705", "arxiv_url": "https://arxiv.org/abs/2609.08705", "authors": ["Lei Hu", "Shuangping Huang"], "brief": "\u8bba\u6587\u63d0\u51fa BGTR \u8868\u683c\u8bc6\u522b\u6846\u67b6\uff0c\u5148\u9884\u6d4b\u5355\u5143\u683c\u8fb9\u754c\u6846\uff0c\u518d\u7528\u8fb9\u754c\u6846\u4fe1\u606f\u6307\u5bfc HTML \u8868\u683c\u7ed3\u6784\u751f\u6210\uff0c\u4ee5\u51cf\u5c11\u590d\u6742\u573a\u666f\u4e2d\u7684\u7ed3\u6784\u9884\u6d4b\u9519\u8bef\u3002\u9488\u5bf9\u81ea\u7136\u573a\u666f\u8868\u683c\u6570\u636e\u4e0d\u8db3\u95ee\u9898\uff0c\u4f5c\u8005\u91c7\u7528\u6e10\u8fdb\u5f0f\u8bad\u7ec3\u5e76\u6784\u5efa\u5408\u6210\u6570\u636e\u96c6 SNSTab\uff0c\u5728\u4e94\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u8fbe\u5230 SOTA \u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08705", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u683c\u7ed3\u6784\u8bc6\u522b", "\u76ee\u6807\u68c0\u6d4b", "\u6587\u6863\u7406\u89e3", "\u5408\u6210\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08705v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Enhancing Table Structure Recognition via Bounding Box Guidance", "tldr": "\u8bba\u6587\u63d0\u51fa BGTR \u8868\u683c\u8bc6\u522b\u6846\u67b6\uff0c\u5148\u9884\u6d4b\u5355\u5143\u683c\u8fb9\u754c\u6846\uff0c\u518d\u7528\u8fb9\u754c\u6846\u4fe1\u606f\u6307\u5bfc HTML \u8868\u683c\u7ed3\u6784\u751f\u6210\uff0c\u4ee5\u51cf\u5c11\u590d\u6742\u573a\u666f\u4e2d\u7684\u7ed3\u6784\u9884\u6d4b\u9519\u8bef\u3002\u9488\u5bf9\u81ea\u7136\u573a\u666f\u8868\u683c\u6570\u636e\u4e0d\u8db3\u95ee\u9898\uff0c\u4f5c\u8005\u91c7\u7528\u6e10\u8fdb\u5f0f\u8bad\u7ec3\u5e76\u6784\u5efa\u5408\u6210\u6570\u636e\u96c6 SNSTab\uff0c\u5728\u4e94\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u8fbe\u5230 SOTA \u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Organoids are three-dimensional tissue models whose morphology provides important insights into tumor development, disease progression, and drug testing. Extracting these morphological features relies heavily on manual segmentation, which is time-consuming and labor-intensive. Furthermore, performing quantitative statistical analysis typically requires custom coding skills and a mathematical background, presenting a major barrier for experimental biologists. To address these challenges, we introduce MorphoOrgaAgent, a multi-agent framework that achieves zero-shot organoid segmentation, automated data analysis, and report generation based on natural language input. The framework consists mainly of three core components: a TaskUnderstandingAgent that identifies requested measurements and visualization types; a hybrid segmentation module that combines Cellpose-derived geometric prompts with text prompts to guide SAM3 for zero-shot organoid instance segmentation; and a ReportAgent that computes quantitative metrics and compiles them alongside generated visualizations into a structured report. We further introduce MorphoOrgaVQA, a benchmark designed for quantitative evaluation of agent systems in organoid morphology analysis. Experimental results demonstrate that MorphoOrgaAgent handles both explicit and descriptive user requests, produces measurements closely matching ground truth, and generates complete analysis reports without requiring manual programming. The complete source code and MorphoOrgaVQA benchmark are publicly available at https://github.com/peng-lab/MorphoOrgaAgent.", "arxiv_id": "2609.08696", "arxiv_url": "https://arxiv.org/abs/2609.08696", "authors": ["Hanyi Zhang", "Maximilian Hoermann", "Lion J. Gleiter", "Yiling Xu", "Bettina Katalin Budai", "Hans-Ulrich Kauczor", "Carsten Marr", "Tingying Peng"], "brief": "MorphoOrgaAgent \u662f\u4e00\u4e2a\u57fa\u4e8e\u57fa\u7840\u6a21\u578b\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u901a\u8fc7\u81ea\u7136\u8bed\u8a00\u5b9e\u73b0\u7c7b\u5668\u5b98\u96f6\u6837\u672c\u5b9e\u4f8b\u5206\u5272\u3001\u5b9a\u91cf\u5206\u6790\u4e0e\u62a5\u544a\u751f\u6210\u3002\u5b83\u7ed3\u5408 Cellpose \u51e0\u4f55\u63d0\u793a\u548c\u6587\u672c\u63d0\u793a\u5f15\u5bfc SAM3\uff0c\u5e76\u5728\u65b0\u63d0\u51fa\u7684 MorphoOrgaVQA \u57fa\u51c6\u4e0a\u663e\u793a\u51fa\u63a5\u8fd1\u771f\u5b9e\u6807\u6ce8\u7684\u6d4b\u91cf\u6548\u679c\uff0c\u964d\u4f4e\u4e86\u5b9e\u9a8c\u751f\u7269\u5b66\u5bb6\u7684\u7f16\u7a0b\u95e8\u69db\u3002", "categories": ["cs.MA", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08696", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u57fa\u7840\u6a21\u578b", "\u7c7b\u5668\u5b98\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08696v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MorphoOrgaAgent: A Foundation-Model-Based Multi-Agent System for Autonomous Organoid Analysis", "tldr": "MorphoOrgaAgent \u662f\u4e00\u4e2a\u57fa\u4e8e\u57fa\u7840\u6a21\u578b\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u901a\u8fc7\u81ea\u7136\u8bed\u8a00\u5b9e\u73b0\u7c7b\u5668\u5b98\u96f6\u6837\u672c\u5b9e\u4f8b\u5206\u5272\u3001\u5b9a\u91cf\u5206\u6790\u4e0e\u62a5\u544a\u751f\u6210\u3002\u5b83\u7ed3\u5408 Cellpose \u51e0\u4f55\u63d0\u793a\u548c\u6587\u672c\u63d0\u793a\u5f15\u5bfc SAM3\uff0c\u5e76\u5728\u65b0\u63d0\u51fa\u7684 MorphoOrgaVQA \u57fa\u51c6\u4e0a\u663e\u793a\u51fa\u63a5\u8fd1\u771f\u5b9e\u6807\u6ce8\u7684\u6d4b\u91cf\u6548\u679c\uff0c\u964d\u4f4e\u4e86\u5b9e\u9a8c\u751f\u7269\u5b66\u5bb6\u7684\u7f16\u7a0b\u95e8\u69db\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-form instructional videos require automatic chaptering to support browsing, navigation, and knowledge access. Recent long-context language models can perform chaptering from textualized video inputs, but they remain costly and brittle for content-dense lecture videos with long transcripts, smooth topic transitions, and detailed chapter outputs. A scalable segment-then-caption paradigm reduces this cost, but introduces two new challenges: boundary error propagation and fragmented cross-chapter context. We propose \\textbf{CausalChapter}, an intervention-inspired framework for long-video chaptering that estimates prediction-level influence through lightweight masking and removal interventions. For boundary localization, our Local Dependency Shift module detects drops in predictive dependency between adjacent temporal windows; for chapter description generation, our Cross-Segment Support Selection module reranks historical contexts according to their support for the current prediction. Experiments on long-video chaptering benchmarks show that CausalChapter improves boundary localization, chapter description quality, and cross-chapter coherence.", "arxiv_id": "2609.08686", "arxiv_url": "https://arxiv.org/abs/2609.08686", "authors": ["Xinran Duan", "Guozhang Li", "Yaoyao Zhong", "Mei Wang", "Lizhi Wang", "Hua Huang"], "brief": "\u8bba\u6587\u63d0\u51fa CausalChapter\uff0c\u7528\u5e72\u9884\u5f0f\u4f9d\u8d56\u5efa\u6a21\u6539\u8fdb\u957f\u6559\u5b66\u89c6\u9891\u81ea\u52a8\u5206\u7ae0\uff0c\u9488\u5bf9\u201c\u5148\u5206\u6bb5\u518d\u751f\u6210\u6807\u9898/\u63cf\u8ff0\u201d\u8303\u5f0f\u4e2d\u7684\u8fb9\u754c\u8bef\u5dee\u4f20\u64ad\u548c\u8de8\u7ae0\u8282\u4e0a\u4e0b\u6587\u788e\u7247\u5316\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u8f7b\u91cf\u906e\u853d/\u79fb\u9664\u5e72\u9884\u4f30\u8ba1\u9884\u6d4b\u4f9d\u8d56\uff0c\u7528\u4e8e\u8fb9\u754c\u5b9a\u4f4d\u548c\u5386\u53f2\u4e0a\u4e0b\u6587\u91cd\u6392\uff0c\u5728\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u7ae0\u8282\u8fb9\u754c\u3001\u63cf\u8ff0\u8d28\u91cf\u4e0e\u8de8\u7ae0\u8282\u8fde\u8d2f\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08686", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u957f\u89c6\u9891\u5206\u7ae0", "\u56e0\u679c\u5efa\u6a21", "\u4e0a\u4e0b\u6587\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08686v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CausalChapter: Improving Long-Video Chaptering with Interventional Dependency Modeling", "tldr": "\u8bba\u6587\u63d0\u51fa CausalChapter\uff0c\u7528\u5e72\u9884\u5f0f\u4f9d\u8d56\u5efa\u6a21\u6539\u8fdb\u957f\u6559\u5b66\u89c6\u9891\u81ea\u52a8\u5206\u7ae0\uff0c\u9488\u5bf9\u201c\u5148\u5206\u6bb5\u518d\u751f\u6210\u6807\u9898/\u63cf\u8ff0\u201d\u8303\u5f0f\u4e2d\u7684\u8fb9\u754c\u8bef\u5dee\u4f20\u64ad\u548c\u8de8\u7ae0\u8282\u4e0a\u4e0b\u6587\u788e\u7247\u5316\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u8f7b\u91cf\u906e\u853d/\u79fb\u9664\u5e72\u9884\u4f30\u8ba1\u9884\u6d4b\u4f9d\u8d56\uff0c\u7528\u4e8e\u8fb9\u754c\u5b9a\u4f4d\u548c\u5386\u53f2\u4e0a\u4e0b\u6587\u91cd\u6392\uff0c\u5728\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u7ae0\u8282\u8fb9\u754c\u3001\u63cf\u8ff0\u8d28\u91cf\u4e0e\u8de8\u7ae0\u8282\u8fde\u8d2f\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Semantic segmentation on very-high-resolution images remains challenging due to the high computational cost and the difficulty of capturing fine-grained details. We propose CoordFormer, a novel coordinate-based architecture for semantic segmentation that predicts labels at arbitrary spatial locations through a Coordinate Decoder equipped with a Localized Cross-Attention mechanism. The decoder combines coordinate embeddings with high-resolution local patch features and interacts with global tokens extracted from a downsampled image processed by a ViT foundation encoder, enabling rich semantic context while preserving pixel-level precision. This design enables flexible inference at arbitrary resolutions while keeping memory low on very-high-resolution inputs, and supports an efficient semantic-edge-focused strategy that concentrates computation along boundaries, maintaining fine-grained accuracy while reducing latency and computational cost. CoordFormer achieves state-of-the-art performance on MaSS13K and outperforms comparably sized and higher-parameter methods on DIS5K and KPIs, demonstrating its effectiveness for high-quality, very-high-resolution semantic segmentation.", "arxiv_id": "2609.08660", "arxiv_url": "https://arxiv.org/abs/2609.08660", "authors": ["Iacopo Curti", "Pierluigi Zama Ramirez", "Alioscia Petrelli", "Luigi Di Stefano"], "brief": "CoordFormer \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u5750\u6807\u7684\u9ad8\u5206\u8fa8\u7387\u8bed\u4e49\u5206\u5272\u67b6\u6784\uff0c\u53ef\u5728\u4efb\u610f\u7a7a\u95f4\u5750\u6807\u9884\u6d4b\u6807\u7b7e\uff0c\u5e76\u7ed3\u5408\u5c40\u90e8\u9ad8\u5206\u8fa8\u7387\u7279\u5f81\u4e0e ViT \u5168\u5c40\u8bed\u4e49\u4e0a\u4e0b\u6587\u3002\u8be5\u65b9\u6cd5\u5728\u8d85\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\u4e0a\u964d\u4f4e\u663e\u5b58\u4e0e\u8ba1\u7b97\u5f00\u9500\uff0c\u652f\u6301\u8fb9\u754c\u91cd\u70b9\u63a8\u7406\uff0c\u5e76\u5728 MaSS13K\u3001DIS5K\u3001KPIs \u7b49\u6570\u636e\u96c6\u53d6\u5f97\u9886\u5148\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08660", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u4e49\u5206\u5272", "\u89c6\u89c9Transformer", "\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf", "\u5750\u6807\u8868\u793a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08660v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CoordFormer: Give Me Any Coordinates and I Will Give You Labels", "tldr": "CoordFormer \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u5750\u6807\u7684\u9ad8\u5206\u8fa8\u7387\u8bed\u4e49\u5206\u5272\u67b6\u6784\uff0c\u53ef\u5728\u4efb\u610f\u7a7a\u95f4\u5750\u6807\u9884\u6d4b\u6807\u7b7e\uff0c\u5e76\u7ed3\u5408\u5c40\u90e8\u9ad8\u5206\u8fa8\u7387\u7279\u5f81\u4e0e ViT \u5168\u5c40\u8bed\u4e49\u4e0a\u4e0b\u6587\u3002\u8be5\u65b9\u6cd5\u5728\u8d85\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\u4e0a\u964d\u4f4e\u663e\u5b58\u4e0e\u8ba1\u7b97\u5f00\u9500\uff0c\u652f\u6301\u8fb9\u754c\u91cd\u70b9\u63a8\u7406\uff0c\u5e76\u5728 MaSS13K\u3001DIS5K\u3001KPIs \u7b49\u6570\u636e\u96c6\u53d6\u5f97\u9886\u5148\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Onboard object detection in Earth observation is constrained by limited computational resources and the absence of fully corrected imagery. While convolutional detectors are hardware-efficient, they often struggle to extract robust representations from raw and noisy data. Conversely, transformer-based models provide stronger global reasoning capabilities but remain difficult to deploy on FPGA accelerators due to quadratic attention complexity and non-compatible operations. We introduce TriCCOT, a tri-part architecture for robust and deployable onboard object detection. TriCCOT combines a convolutional region proposal network, a conformal prediction stage, and Aper-GATES, our hardware-friendly attention-based classifier. The region proposal network generates candidate bounding boxes, which are subsequently enlarged via conformal prediction, providing a distribution-free probabilistic coverage guarantee. The resulting crops are processed by Aper-GATES, which reformulates self-attention through convolutional projections, global channel statistics, and hardware-friendly gating operations, avoiding standard transformer operations that are poorly suited to CNN-oriented accelerators. Experiments on the DIOR and VDVRaw datasets demonstrate competitive detection performance and improved robustness to spatial blur and signal-dependent noise when compared to FPGA-compatible architectures. Finally, we report full deployment on a Xilinx Versal VCK190 FPGA without modifying the underlying DPU architecture, enabling unified CNN-Transformer inference for spaceborne embedded applications.", "arxiv_id": "2609.08659", "arxiv_url": "https://arxiv.org/abs/2609.08659", "authors": ["Adrien Dorise", "Marjorie Bellizzi", "Julia Cohen", "St\u00e9phane May"], "brief": "\u672c\u6587\u63d0\u51fa TriCCOT\uff0c\u7528\u4e8e\u661f\u8f7d\u5730\u7403\u89c2\u6d4b\u4e2d\u7684\u76ee\u6807\u68c0\u6d4b\uff0c\u7ed3\u5408\u5377\u79ef\u5019\u9009\u6846\u751f\u6210\u3001\u4fdd\u5f62\u9884\u6d4b\u6269\u6846\u548c\u786c\u4ef6\u53cb\u597d\u7684\u6ce8\u610f\u529b\u5206\u7c7b\u5668 Aper-GATES\u3002\u8be5\u65b9\u6cd5\u5728 DIOR \u548c VDVRaw \u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u68c0\u6d4b\u6027\u80fd\uff0c\u5e76\u63d0\u5347\u4e86\u5bf9\u6a21\u7cca\u548c\u566a\u58f0\u7684\u9c81\u68d2\u6027\uff0c\u540c\u65f6\u53ef\u5b8c\u6574\u90e8\u7f72\u5230 Xilinx Versal VCK190 FPGA \u4e0a\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08659", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "Transformer", "\u8fb9\u7f18\u90e8\u7f72", "\u4fdd\u5f62\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08659v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TriCCOT: Tri-part Convolutional Conformal Transformer for Onboard Space Object Detection", "tldr": "\u672c\u6587\u63d0\u51fa TriCCOT\uff0c\u7528\u4e8e\u661f\u8f7d\u5730\u7403\u89c2\u6d4b\u4e2d\u7684\u76ee\u6807\u68c0\u6d4b\uff0c\u7ed3\u5408\u5377\u79ef\u5019\u9009\u6846\u751f\u6210\u3001\u4fdd\u5f62\u9884\u6d4b\u6269\u6846\u548c\u786c\u4ef6\u53cb\u597d\u7684\u6ce8\u610f\u529b\u5206\u7c7b\u5668 Aper-GATES\u3002\u8be5\u65b9\u6cd5\u5728 DIOR \u548c VDVRaw \u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u68c0\u6d4b\u6027\u80fd\uff0c\u5e76\u63d0\u5347\u4e86\u5bf9\u6a21\u7cca\u548c\u566a\u58f0\u7684\u9c81\u68d2\u6027\uff0c\u540c\u65f6\u53ef\u5b8c\u6574\u90e8\u7f72\u5230 Xilinx Versal VCK190 FPGA \u4e0a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Charts are structured visual compositions whose elements have distinct functional roles, semantic correspondences, and visibility relations. This structural view motivates evaluating whether models can understand and manipulate charts at the layer level. Existing chart benchmarks, however, primarily assess the correctness or fidelity of final outputs and do not directly evaluate these layer-wise behaviors. We present LayerWiseBench, a benchmark organized around three core concepts, layer attribution, layer binding, and visibility ordering, that structure its chart-understanding and chart-editing evaluations. Generated from executable chart programs, LayerWiseBench pairs each rendered chart with spatially aligned per-layer RGBA assets and construction-derived labels for functional roles, semantic bindings, and visibility relations. From this layer-wise representation, we derive controlled understanding questions, editing targets, reference images, and evaluation regions. It contains 2,800 source charts across 14 chart paradigms, from which we derive 7,329 layer-wise understanding questions and 53,791 instruction-guided editing variants. Among the evaluated VLMs, Qwen3.5-27B, which achieves the highest QA macro-average, obtains 93.04% accuracy on layer attribution and 97.46% on layer binding, but only 61.46% on visibility ordering. Across the four evaluated image editors, overall mIoU ranges from 1.49% to 4.93%, and visibility-constrained edits have the lowest mIoU for every editor, ranging from 0.37% to 2.00%. Taken together, these results identify tasks involving front-to-back relations between overlapping components as a recurring challenge across understanding and editing, motivating more explicit modeling of component identity and visibility relations.", "arxiv_id": "2609.08657", "arxiv_url": "https://arxiv.org/abs/2609.08657", "authors": ["Xiaochuan Zhong", "Yifan Hou", "Chenxi Pang", "Shaobo Cui"], "brief": "\u8bba\u6587\u63d0\u51fa LayerWiseBench\uff0c\u7528\u53ef\u6267\u884c\u56fe\u8868\u7a0b\u5e8f\u751f\u6210\u5e26\u6709\u9010\u5c42 RGBA \u8d44\u4ea7\u548c\u7ed3\u6784\u6807\u7b7e\u7684\u56fe\u8868\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u56fe\u8868\u7684\u5c42\u5f52\u56e0\u3001\u5c42\u7ed1\u5b9a\u548c\u53ef\u89c1\u6027\u987a\u5e8f\u7406\u89e3\uff0c\u4ee5\u53ca\u6307\u4ee4\u5f0f\u56fe\u8868\u7f16\u8f91\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u5c42\u5f52\u56e0\u548c\u7ed1\u5b9a\u4e0a\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5bf9\u91cd\u53e0\u7ec4\u4ef6\u7684\u524d\u540e\u53ef\u89c1\u5173\u7cfb\u660e\u663e\u4e0d\u8db3\uff1b\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u6574\u4f53 mIoU \u5f88\u4f4e\uff0c\u5c24\u5176\u96be\u4ee5\u5904\u7406\u53ef\u89c1\u6027\u7ea6\u675f\u7f16\u8f91\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08657", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u8868\u7406\u89e3", "\u591a\u6a21\u6001", "\u89c6\u89c9\u7f16\u8f91", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08657v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Charts Are Beyond Pixels: Probing for Layer-Wise Chart Understanding and Editing", "tldr": "\u8bba\u6587\u63d0\u51fa LayerWiseBench\uff0c\u7528\u53ef\u6267\u884c\u56fe\u8868\u7a0b\u5e8f\u751f\u6210\u5e26\u6709\u9010\u5c42 RGBA \u8d44\u4ea7\u548c\u7ed3\u6784\u6807\u7b7e\u7684\u56fe\u8868\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u56fe\u8868\u7684\u5c42\u5f52\u56e0\u3001\u5c42\u7ed1\u5b9a\u548c\u53ef\u89c1\u6027\u987a\u5e8f\u7406\u89e3\uff0c\u4ee5\u53ca\u6307\u4ee4\u5f0f\u56fe\u8868\u7f16\u8f91\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u5c42\u5f52\u56e0\u548c\u7ed1\u5b9a\u4e0a\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5bf9\u91cd\u53e0\u7ec4\u4ef6\u7684\u524d\u540e\u53ef\u89c1\u5173\u7cfb\u660e\u663e\u4e0d\u8db3\uff1b\u56fe\u50cf\u7f16\u8f91\u6a21\u578b\u6574\u4f53 mIoU \u5f88\u4f4e\uff0c\u5c24\u5176\u96be\u4ee5\u5904\u7406\u53ef\u89c1\u6027\u7ea6\u675f\u7f16\u8f91\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In proton therapy, plans are typically optimized on a single planning CT, making robustness evaluation essential under anatomical changes. However, current scenarios often rely on simplified perturbations that poorly capture complex, patient-specific variability. We propose SynthRCT, a scalable conditional generative framework for 3D anatomical deformation synthesis. Based on a conditional variational autoencoder, SynthRCT learns a latent deformation space and decodes sampled latent codes into local stationary velocity fields conditioned on an input anatomy. Local fields are assembled into coherent full-volume transformations, enabling memory-scalable generation for large field-of-view CT data. We validate the approach on respiratory 4DCT data with multiple breathing-phase anatomies per subject. SynthRCT enables patient-specific sampling of plausible anatomical transformations beyond predefined robustness scenarios. Code available at: https://github.com/TomasGuija/SynthRCT.", "arxiv_id": "2609.08627", "arxiv_url": "https://arxiv.org/abs/2609.08627", "authors": ["Tomas Guija-Valiente", "Blanca Rodriguez-Gonzalez", "Norberto Malpica"], "brief": "SynthRCT \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u6761\u4ef6\u53d8\u5206\u81ea\u7f16\u7801\u5668\u7684 3D \u89e3\u5256\u5f62\u53d8\u751f\u6210\u6846\u67b6\uff0c\u53ef\u6839\u636e\u8f93\u5165 CT \u89e3\u5256\u7ed3\u6784\u91c7\u6837\u5e76\u751f\u6210\u5c40\u90e8\u901f\u5ea6\u573a\uff0c\u518d\u62fc\u63a5\u6210\u5168\u4f53\u79ef\u5f62\u53d8\u3002\u8be5\u65b9\u6cd5\u5728\u547c\u5438 4DCT \u6570\u636e\u4e0a\u9a8c\u8bc1\uff0c\u80fd\u751f\u6210\u66f4\u7b26\u5408\u60a3\u8005\u4e2a\u4f53\u5dee\u5f02\u7684\u91cd\u590d CT/\u5f62\u53d8\u573a\uff0c\u7528\u4e8e\u8d28\u5b50\u6cbb\u7597\u8ba1\u5212\u7684\u9c81\u68d2\u6027\u8bc4\u4f30\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08627", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u751f\u6210\u6a21\u578b", "\u5f62\u53d8\u5408\u6210", "\u8d28\u5b50\u6cbb\u7597"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08627v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SynthRCT: Scalable Conditional Deformation Synthesis for Synthetic Repeat CT Generation", "tldr": "SynthRCT \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u6761\u4ef6\u53d8\u5206\u81ea\u7f16\u7801\u5668\u7684 3D \u89e3\u5256\u5f62\u53d8\u751f\u6210\u6846\u67b6\uff0c\u53ef\u6839\u636e\u8f93\u5165 CT \u89e3\u5256\u7ed3\u6784\u91c7\u6837\u5e76\u751f\u6210\u5c40\u90e8\u901f\u5ea6\u573a\uff0c\u518d\u62fc\u63a5\u6210\u5168\u4f53\u79ef\u5f62\u53d8\u3002\u8be5\u65b9\u6cd5\u5728\u547c\u5438 4DCT \u6570\u636e\u4e0a\u9a8c\u8bc1\uff0c\u80fd\u751f\u6210\u66f4\u7b26\u5408\u60a3\u8005\u4e2a\u4f53\u5dee\u5f02\u7684\u91cd\u590d CT/\u5f62\u53d8\u573a\uff0c\u7528\u4e8e\u8d28\u5b50\u6cbb\u7597\u8ba1\u5212\u7684\u9c81\u68d2\u6027\u8bc4\u4f30\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A simultaneous localization and mapping (SLAM) method using a monocular camera and a low-cost inertial measurement unit (IMU) sensor is an effective way to fulfill a low-cost sensor configuration. Using this sensor configuration, visual-inertial system (VINS) focuses on fusing data from a camera and an IMU sensor to estimate the six degrees-of-freedom (DOF) of the sensor pose. Typically, VINS uses only a single camera as visual input, which lead to problems such as error accumulation due to occlusion, various illumination, and textureless environments. In this paper, we propose a new multiple fisheye camera-based visual-inertial system called MFVINS. We present an IMU-aided FAST feature tracker for multiple cameras that enables efficient extraction and robust matching of local features. Then, the proposed method filters out outliers caused by fisheye distortion on the normalized image plane. Subsequently, a new reprojection error with physical validity constraints is proposed for bundle adjustment using learning-based depth estimation. The proposed method is applied to various scenarios, and its effectiveness is demonstrated by comparing previous VINS methods. In particular, MFVINS is implemented in real-time process to leverage the advantages of using multiple cameras -- robustness against occlusion and textureless regions -- while reducing the computational burden.", "arxiv_id": "2609.08626", "arxiv_url": "https://arxiv.org/abs/2609.08626", "authors": ["Eunseong Jang", "YuJin Chung", "Sang Jun Lee", "Jihyun Yoon", "HyungGi Jo"], "brief": "\u8bba\u6587\u63d0\u51fa MFVINS\uff0c\u4e00\u4e2a\u57fa\u4e8e\u591a\u9c7c\u773c\u76f8\u673a\u4e0e\u4f4e\u6210\u672c IMU \u7684\u5b9e\u65f6\u89c6\u89c9\u60ef\u6027 SLAM \u7cfb\u7edf\u3002\u65b9\u6cd5\u901a\u8fc7 IMU \u8f85\u52a9\u591a\u76f8\u673a FAST \u7279\u5f81\u8ddf\u8e2a\u3001\u9c7c\u773c\u7578\u53d8\u5916\u70b9\u8fc7\u6ee4\uff0c\u4ee5\u53ca\u7ed3\u5408\u5b66\u4e60\u5f0f\u6df1\u5ea6\u4f30\u8ba1\u7684\u91cd\u6295\u5f71\u7ea6\u675f\uff0c\u5728\u906e\u6321\u3001\u5149\u7167\u53d8\u5316\u548c\u5f31\u7eb9\u7406\u573a\u666f\u4e0b\u6bd4\u4f20\u7edf\u5355\u76ee VINS \u66f4\u7a33\u5065\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08626", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u60ef\u6027SLAM", "\u591a\u76f8\u673a", "\u9c7c\u773c\u76f8\u673a", "\u673a\u5668\u4eba\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08626v1", "published_at": "2026-09-08", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MFVINS: Multiple Fisheye Camera-Based Visual Inertial System", "tldr": "\u8bba\u6587\u63d0\u51fa MFVINS\uff0c\u4e00\u4e2a\u57fa\u4e8e\u591a\u9c7c\u773c\u76f8\u673a\u4e0e\u4f4e\u6210\u672c IMU \u7684\u5b9e\u65f6\u89c6\u89c9\u60ef\u6027 SLAM \u7cfb\u7edf\u3002\u65b9\u6cd5\u901a\u8fc7 IMU \u8f85\u52a9\u591a\u76f8\u673a FAST \u7279\u5f81\u8ddf\u8e2a\u3001\u9c7c\u773c\u7578\u53d8\u5916\u70b9\u8fc7\u6ee4\uff0c\u4ee5\u53ca\u
