ab/trace-bench}.", "arxiv_id": "2609.30670", "arxiv_url": "https://arxiv.org/abs/2609.30670", "authors": ["Yibo Ma", "Qianqian Zhang", "Peng Liu", "Tiancheng Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u4e2a\u6761\u4ef6\u611f\u77e5\u7684\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u4e0e\u8bc4\u6d4b\u6846\u67b6\uff0c\u663e\u5f0f\u6807\u6ce8\u8bc1\u636e\u4f55\u65f6\u6709\u6548\u3001\u89c6\u89c9\u5386\u53f2\u5982\u4f55\u4f7f\u7528\u4ee5\u53ca\u4f55\u65f6\u89e6\u53d1\u56de\u7b54\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u7684\u56e0\u679c Core-Adapter \u534f\u8bae\u8bc4\u4f30\u6a21\u578b\u5728\u7b54\u6848\u8d28\u91cf\u3001\u53ca\u65f6\u6027\u3001\u5de5\u4f5c\u91cf\u3001\u5b8c\u6210\u7387\u548c\u53ef\u9760\u6027\u7b49\u7ef4\u5ea6\u7684\u771f\u5b9e\u6267\u884c\u884c\u4e3a\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": "https://github.com/om-ai-lab/trace-bench", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2609.30670", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u5305\u542b 517 \u4e2a\u89c6\u9891\u30011240 \u6761\u8bb0\u5f55\u7684\u65f6\u5e8f\u5ba1\u8ba1\u4efb\u52a1\uff0c\u5e26\u6709\u8bc1\u636e\u65f6\u95f4\u4e0e\u6307\u4ee4\u4f9d\u8d56\u89e6\u53d1\u6807\u6ce8\u3002", "\u8bc4\u6d4b 8 \u4e2a\u516c\u5f00\u6a21\u578b\u6216\u7cfb\u7edf\u7684 8 \u79cd\u914d\u7f6e\uff0c\u53d1\u73b0\u76f8\u8fd1 QA \u51c6\u786e\u7387\u53ef\u80fd\u63a9\u76d6\u5b8c\u6210\u7387\u3001\u7b54\u6848\u6709\u6548\u6027\u548c\u751f\u6210\u5de5\u4f5c\u91cf\u7684\u663e\u8457\u5dee\u5f02\u3002", "\u5c06\u4e3b\u52a8\u54cd\u5e94\u6027\u80fd\u62c6\u89e3\u4e3a\u56de\u7b54\u8d28\u91cf\u3001\u54cd\u5e94\u5ef6\u8fdf\u3001\u8bef\u62a5\u548c\u6f0f\u6389\u76ee\u6807\u65f6\u95f4\u7a97\u7b49\u591a\u7ef4\u6307\u6807\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u8bc4\u6d4b\u57fa\u51c6", "\u6d41\u5f0f\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "OmAI Lab", "pdf_url": "https://arxiv.org/pdf/2609.30670v1", "published_at": "2026-09-25", "score": 0.235, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.30670.png", "title": "TRACE: Temporal Audit and Condition-aware Evaluation of Streaming Video Understanding", "tldr": "\u9762\u5411\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u7684\u65f6\u5e8f\u5ba1\u8ba1\u8bc4\u6d4b\u6846\u67b6", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u4e2a\u6761\u4ef6\u611f\u77e5\u7684\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u4e0e\u8bc4\u6d4b\u6846\u67b6\uff0c\u663e\u5f0f\u6807\u6ce8\u8bc1\u636e\u4f55\u65f6\u6709\u6548\u3001\u89c6\u89c9\u5386\u53f2\u5982\u4f55\u4f7f\u7528\u4ee5\u53ca\u4f55\u65f6\u89e6\u53d1\u56de\u7b54\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u7684\u56e0\u679c Core-Adapter \u534f\u8bae\u8bc4\u4f30\u6a21\u578b\u5728\u7b54\u6848\u8d28\u91cf\u3001\u53ca\u65f6\u6027\u3001\u5de5\u4f5c\u91cf\u3001\u5b8c\u6210\u7387\u548c\u53ef\u9760\u6027\u7b49\u7ef4\u5ea6\u7684\u771f\u5b9e\u6267\u884c\u884c\u4e3a\u3002", "why_notable": "TRACE \u5f3a\u8c03\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u4e0d\u80fd\u53ea\u770b\u5355\u4e00\u51c6\u786e\u7387\uff0c\u800c\u5e94\u89c6\u4e3a\u53d7\u6267\u884c\u6761\u4ef6\u7ea6\u675f\u7684\u7cfb\u7edf\u884c\u4e3a\u8bc4\u4f30\uff1b\u8fd9\u6709\u52a9\u4e8e\u66f4\u516c\u5e73\u5730\u6bd4\u8f83\u5b9e\u65f6\u591a\u6a21\u6001\u6a21\u578b\uff0c\u5e76\u66b4\u9732\u90e8\u7f72\u4e2d\u7684\u5ef6\u8fdf\u3001\u8bef\u89e6\u53d1\u548c\u5de5\u4f5c\u91cf\u95ee\u9898\u3002"}, {"abstract": "On-policy distillation (OPD) corrects a student on the responses it writes, but its signal is the teacher\u0027s next-token distribution: it tells the student what the teacher says but misses how it thinks. Latent supervision promises the missing part by aligning the student\u0027s latent states to the teacher\u0027s. Recent methods such as OPRD bring this signal into on-policy distillation. However, we observe two failures of this recipe when distilling Qwen3-4B and Qwen3-8B into Qwen3-1.7B-Base. Early gain, late collapse: latent supervision alone lifts MATH-500 accuracy from 25 to 46 in 10 steps, but subsequent training degrades performance down to 11 with no recovery. Better alignment, worse behavior: although the alignment metric steadily improves throughout this collapse, the most aligned model turns out to be the worst performing. Further analysis suggests a mismatch in how the latent signal is applied: layers paired by depth play different roles in the two models, so continued alignment may pull the student toward teacher states it cannot understand. To address this, we propose LastOPD, which applies the latent signal only at the last-layer state, the common interface both LM heads read, and only during a 10-step crossfade into token-level OPD. This keeps the useful part of the latent signal and hands the student to token-level supervision before the collapse sets in. Extensive experiments show that LastOPD improves MATH-500 over token-only OPD by 5.55 and 4.02 points with the 4B and 8B teachers, leads on most held-out datasets, and reaches the final score of token-only OPD in about half the steps. Code is available at https://github.com/Muyiiiii/LastOPD.", "arxiv_id": "2609.28845", "arxiv_url": "https://arxiv.org/abs/2609.28845", "authors": ["Jie Yang", "Zhengyu Fang", "Zelin Xu", "Jiarui Sun", "Xiran Fan", "Junpeng Wang", "Liang Wang", "Qinghua Liu", "Yiwei Cai", "Yan Zheng"], "brief": "\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u5728on-policy\u84b8\u998f\u4e2d\u52a0\u5165\u6f5c\u72b6\u6001\u76d1\u7763\u65f6\u51fa\u73b0\u7684\u8bad\u7ec3\u5d29\u584c\u95ee\u9898\uff0c\u5e76\u63d0\u51faLastOPD\uff1a\u53ea\u5728\u6700\u540e\u4e00\u5c42\u9690\u85cf\u72b6\u6001\u65bd\u52a0\u6f5c\u76d1\u7763\uff0c\u5e76\u5728\u77ed\u6682\u8fc7\u6e21\u540e\u5207\u6362\u5230token\u7ea7OPD\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/Muyiiiii/LastOPD", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28845", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0OPRD\u5f0f\u6f5c\u72b6\u6001\u5bf9\u9f50\u4f1a\u51fa\u73b0\u201c\u65e9\u671f\u63d0\u5347\u3001\u540e\u671f\u5d29\u584c\u201d\uff1aMATH-500\u53ef\u4ece25\u5347\u523046\uff0c\u4f46\u7ee7\u7eed\u8bad\u7ec3\u4f1a\u8dcc\u81f311\u3002", "\u6307\u51fa\u201c\u5bf9\u9f50\u66f4\u597d\u4f46\u884c\u4e3a\u66f4\u5dee\u201d\u7684\u53cd\u5e38\u73b0\u8c61\uff0c\u539f\u56e0\u53ef\u80fd\u662f\u5e08\u751f\u6a21\u578b\u6309\u6df1\u5ea6\u914d\u5c42\u65f6\u5c42\u529f\u80fd\u4e0d\u5339\u914d\u3002", "LastOPD\u4ec5\u5bf9\u9f50LM head\u5171\u4eab\u7684\u6700\u540e\u5c42\u8868\u793a\uff0c\u5e76\u53ea\u7528\u4e8e10\u6b65crossfade\uff0c\u968f\u540e\u4ea4\u7ed9token\u7ea7\u76d1\u7763\uff0c\u907f\u514d\u6301\u7eed\u9519\u8bef\u7275\u5f15\u3002"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8868\u793a\u5b66\u4e60", "\u6570\u5b66\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28845v1", "published_at": "2026-09-23", "score": 0.23, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.28845.png", "title": "LastOPD: Taming Collapse in Latent On-Policy Distillation", "tldr": "LastOPD\u7f13\u89e3\u6f5c\u72b6\u6001\u84b8\u998f\u540e\u671f\u5d29\u584c", "upvotes": 6, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u5728on-policy\u84b8\u998f\u4e2d\u52a0\u5165\u6f5c\u72b6\u6001\u76d1\u7763\u65f6\u51fa\u73b0\u7684\u8bad\u7ec3\u5d29\u584c\u95ee\u9898\uff0c\u5e76\u63d0\u51faLastOPD\uff1a\u53ea\u5728\u6700\u540e\u4e00\u5c42\u9690\u85cf\u72b6\u6001\u65bd\u52a0\u6f5c\u76d1\u7763\uff0c\u5e76\u5728\u77ed\u6682\u8fc7\u6e21\u540e\u5207\u6362\u5230token\u7ea7OPD\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u6f5c\u8868\u793a\u84b8\u998f\u4e2d\u7b80\u5355\u5c42\u5bf9\u9f50\u7684\u6f5c\u5728\u98ce\u9669\uff0c\u5e76\u7ed9\u51fa\u4e00\u4e2a\u8f7b\u91cf\u3001\u7a33\u5b9a\u4e14\u52a0\u901f\u6536\u655b\u7684\u4fee\u6b63\u65b9\u6848\uff1b\u5728Qwen3\u84b8\u998f\u5b9e\u9a8c\u4e2d\u76f8\u8f83token-only OPD\u5728MATH-500\u4e0a\u63d0\u53474\u52305.5\u5206\uff0c\u5e76\u7ea6\u7528\u4e00\u534a\u6b65\u6570\u8fbe\u5230\u57fa\u7ebf\u6700\u7ec8\u6548\u679c\u3002"}, {"abstract": "Public software repositories, like GitHub and Software Heritage Archive, store billions of files, yet extracting their implicit engineering knowledge ---i.e., the algorithms they implement, the paradigms they follow, the patterns they instantiate, and the application domains they serve--- remains challenging, as current tools are constrained to syntactic and token-level analysis. We present a pipeline for building an open-taxonomy semantic annotation of source code using a code-specialised Large Language Model. The extracted entities are grounded in Wikidata through a three-stage linking procedure: a deterministic SPARQL stage handles unambiguous entities, a Deep Research Agent resolves the residual long tail, and a hierarchy-rollup stage imports the parent-of closure of each resolved Wikidata identifier. The resulting annotations are materialised as a source-code-specific open-taxonomy knowledge graph. We further introduce a calibrated quality-assurance protocol that quantifies annotation precision by combining a small human gold set with an LLM-as-a-judge filter. We applied our pipeline to the 167 million files of the Stack-Edu corpus, creating the first known large-scale open-taxonomy knowledge graph for source code. Our graph, named CodeGraph, contains approximately 158 million nodes, which include around 145 million files, about 63,000 extracted concept entities (such as algorithms, paradigms, design patterns, and application domains), and roughly 19,800 grounded Wikidata entities. Furthermore, CodeGraph features approximately 1 billion typed edges that connect files to their respective concepts, link these concepts to their grounded Wikidata identifiers, and relate them to their parent categories, covering 14 programming languages.", "arxiv_id": "2609.29474", "arxiv_url": "https://arxiv.org/abs/2609.29474", "authors": ["Federico Pennino", "Andrea Gurioli", "Stefano Zacchiroli", "Maurizio Gabbrielli", "Paolo Ferragina"], "brief": "\u8bba\u6587\u63d0\u51fa CodeGraph\uff1a\u7528\u4ee3\u7801\u4e13\u7528\u5927\u6a21\u578b\u4ece\u6e90\u7801\u4e2d\u62bd\u53d6\u7b97\u6cd5\u3001\u8303\u5f0f\u3001\u8bbe\u8ba1\u6a21\u5f0f\u3001\u5e94\u7528\u9886\u57df\u7b49\u8bed\u4e49\u6982\u5ff5\uff0c\u5e76\u901a\u8fc7 Wikidata \u8fdb\u884c\u5b9e\u4f53\u5bf9\u9f50\uff0c\u6784\u5efa\u6e90\u7801\u5f00\u653e\u5206\u7c7b\u77e5\u8bc6\u56fe\u8c31\u3002", "categories": ["cs.SE", "cs.CL", "cs.IR"], "github_repo": "https://github.com/halykoss/CodeGraph", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.29474", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u4e09\u9636\u6bb5 Wikidata \u94fe\u63a5\u6d41\u7a0b\uff1a\u786e\u5b9a\u6027 SPARQL \u5904\u7406\u660e\u786e\u5b9e\u4f53\uff0cDeep Research Agent \u89e3\u6790\u957f\u5c3e\u5b9e\u4f53\uff0c\u518d\u5f15\u5165\u7236\u7c7b\u5c42\u7ea7\u95ed\u5305\u3002", "\u5728 Stack-Edu \u8bed\u6599\u7684 1.67 \u4ebf\u4e2a\u6587\u4ef6\u4e0a\u8fd0\u884c\uff0c\u8986\u76d6 14 \u79cd\u7f16\u7a0b\u8bed\u8a00\u3002", "\u751f\u6210\u7ea6 1.58 \u4ebf\u8282\u70b9\u548c 10 \u4ebf\u6761\u7c7b\u578b\u5316\u8fb9\uff0c\u5305\u62ec \u7ea6 6.3 \u4e07\u4e2a\u62bd\u53d6\u6982\u5ff5\u4e0e 1.98 \u4e07\u4e2a Wikidata \u5bf9\u9f50\u5b9e\u4f53\u3002"], "keywords": ["\u4ee3\u7801\u7406\u89e3", "\u77e5\u8bc6\u56fe\u8c31", "\u4fe1\u606f\u62bd\u53d6", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.29474v1", "published_at": "2026-09-24", "score": 0.225, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.29474.png", "title": "CodeGraph: Open-Taxonomy Knowledge Graph for Source Code with Wikidata Grounding", "tldr": "\u4e3a\u6e90\u7801\u6784\u5efa\u5927\u89c4\u6a21\u5f00\u653e\u5206\u7c7b\u77e5\u8bc6\u56fe\u8c31", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa CodeGraph\uff1a\u7528\u4ee3\u7801\u4e13\u7528\u5927\u6a21\u578b\u4ece\u6e90\u7801\u4e2d\u62bd\u53d6\u7b97\u6cd5\u3001\u8303\u5f0f\u3001\u8bbe\u8ba1\u6a21\u5f0f\u3001\u5e94\u7528\u9886\u57df\u7b49\u8bed\u4e49\u6982\u5ff5\uff0c\u5e76\u901a\u8fc7 Wikidata \u8fdb\u884c\u5b9e\u4f53\u5bf9\u9f50\uff0c\u6784\u5efa\u6e90\u7801\u5f00\u653e\u5206\u7c7b\u77e5\u8bc6\u56fe\u8c31\u3002", "why_notable": "\u5b83\u628a\u6e90\u7801\u5206\u6790\u4ece\u8bed\u6cd5\u4e0e token \u5c42\u9762\u63a8\u8fdb\u5230\u5f00\u653e\u8bed\u4e49\u77e5\u8bc6\u5c42\u9762\uff0c\u53ef\u652f\u6301\u4ee3\u7801\u641c\u7d22\u3001\u8f6f\u4ef6\u5de5\u7a0b\u77e5\u8bc6\u6316\u6398\u3001\u6559\u80b2\u8d44\u6e90\u7ec4\u7ec7\u548c\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u80cc\u666f\u77e5\u8bc6\u6784\u5efa\u3002"}, {"abstract": "Adapting large language models to individual users remains challenging due to the tension between fine-grained personalization and scalable deployment. We present CARD, a hierarchical framework that achieves effective personalization through progressive refinement. CARD first clusters users according to shared stylistic patterns and learns group-specific LoRA adapters, enabling robust generalization and strong low-resource performance. To capture individual differences within each cluster, we propose an implicit preference learning mechanism that contrasts user-authored text with cluster-level generations, allowing the model to infer user-specific style preferences without manual annotation. At inference time, CARD injects personalization exclusively at decoding via lightweight user preference vectors and low-rank logit corrections, while keeping the base model frozen. Experiments on the LaMP and LongLaMP benchmarks show that CARD achieves superior generation quality compared to baselines, while significantly improving efficiency and scalability for practical personalized text generation.", "arxiv_id": "2601.06352", "arxiv_url": "https://arxiv.org/abs/2601.06352", "authors": ["Yutong Song", "Jiang Wu", "Weijia Zhang", "Chengze Shen", "Shaofan Yuan", "Weitao Lu", "Jian Wang", "Yu Wang", "Nikil Dutt", "Amir M. Rahmani"], "brief": "CARD \u662f\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u6587\u672c\u751f\u6210\u7684\u5c42\u6b21\u5316\u6846\u67b6\uff1a\u5148\u6309\u7528\u6237\u5199\u4f5c\u98ce\u683c\u805a\u7c7b\u5e76\u8bad\u7ec3\u7fa4\u7ec4\u7ea7 LoRA \u9002\u914d\u5668\uff0c\u518d\u901a\u8fc7\u9690\u5f0f\u504f\u597d\u5b66\u4e60\u6355\u6349\u7fa4\u7ec4\u5185\u4e2a\u4f53\u5dee\u5f02\u3002\u63a8\u7406\u65f6\u4ec5\u5728\u89e3\u7801\u9636\u6bb5\u6ce8\u5165\u7528\u6237\u504f\u597d\u5411\u91cf\u548c\u4f4e\u79e9 logit \u4fee\u6b63\uff0c\u4fdd\u6301\u57fa\u5ea7\u6a21\u578b\u51bb\u7ed3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2601.06352", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6309\u5171\u4eab\u98ce\u683c\u6a21\u5f0f\u805a\u7c7b\u7528\u6237\uff0c\u5b66\u4e60\u7ec4\u7ea7 LoRA\uff0c\u4ee5\u63d0\u5347\u4f4e\u8d44\u6e90\u7528\u6237\u4e0a\u7684\u6cdb\u5316\u80fd\u529b", "\u901a\u8fc7\u5bf9\u6bd4\u7528\u6237\u539f\u521b\u6587\u672c\u4e0e\u7fa4\u7ec4\u7ea7\u751f\u6210\u7ed3\u679c\uff0c\u81ea\u52a8\u63a8\u65ad\u7528\u6237\u98ce\u683c\u504f\u597d\uff0c\u65e0\u9700\u4eba\u5de5\u6807\u6ce8", "\u5728 LaMP \u4e0e LongLaMP \u57fa\u51c6\u4e0a\u4f18\u4e8e\u4e2a\u6027\u5316\u751f\u6210\u57fa\u7ebf\uff0c\u5e76\u63d0\u5347\u63a8\u7406\u6548\u7387\u4e0e\u90e8\u7f72\u53ef\u6269\u5c55\u6027"], "keywords": ["\u4e2a\u6027\u5316\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "LoRA", "\u504f\u597d\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "UC Irvine", "pdf_url": "https://arxiv.org/pdf/2601.06352v3", "published_at": "2026-01-09", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2601.06352.png", "title": "CARD: Cluster-level Adaptation with Reward-guided Decoding for Personalized Text Generation", "tldr": "\u7528\u805a\u7c7b\u9002\u914d\u5668\u4e0e\u5956\u52b1\u89e3\u7801\u5b9e\u73b0\u9ad8\u6548\u4e2a\u6027\u5316\u751f\u6210", "upvotes": 4, "what_it_is": "CARD \u662f\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u6587\u672c\u751f\u6210\u7684\u5c42\u6b21\u5316\u6846\u67b6\uff1a\u5148\u6309\u7528\u6237\u5199\u4f5c\u98ce\u683c\u805a\u7c7b\u5e76\u8bad\u7ec3\u7fa4\u7ec4\u7ea7 LoRA \u9002\u914d\u5668\uff0c\u518d\u901a\u8fc7\u9690\u5f0f\u504f\u597d\u5b66\u4e60\u6355\u6349\u7fa4\u7ec4\u5185\u4e2a\u4f53\u5dee\u5f02\u3002\u63a8\u7406\u65f6\u4ec5\u5728\u89e3\u7801\u9636\u6bb5\u6ce8\u5165\u7528\u6237\u504f\u597d\u5411\u91cf\u548c\u4f4e\u79e9 logit \u4fee\u6b63\uff0c\u4fdd\u6301\u57fa\u5ea7\u6a21\u578b\u51bb\u7ed3\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u7ec6\u7c92\u5ea6\u4e2a\u6027\u5316\u4e0e\u5927\u89c4\u6a21\u90e8\u7f72\u4e4b\u95f4\u53d6\u5f97\u8f83\u597d\u5e73\u8861\uff0c\u628a\u4e2a\u4f53\u5dee\u5f02\u8f6c\u79fb\u5230\u8f7b\u91cf\u89e3\u7801\u63a7\u5236\u4e2d\uff0c\u964d\u4f4e\u4e86\u4e3a\u6bcf\u4e2a\u7528\u6237\u8bad\u7ec3\u6216\u5b58\u50a8\u72ec\u7acb\u6a21\u578b\u7684\u6210\u672c\uff0c\u9002\u5408\u5b9e\u9645\u4e2a\u6027\u5316\u5199\u4f5c\u4e0e\u63a8\u8350\u5f0f\u751f\u6210\u573a\u666f\u3002"}, {"abstract": "We study training-inference mismatch in reinforcement learning with verifiable rewards (RLVR) for large language models, where rollouts are sampled by an inference engine while gradients are computed by a training engine, and the two engines assign different probabilities to the same tokens. To account for this discrepancy in policy updates, we introduce calibrated importance sampling (CIS). CIS is motivated by an empirically supported logit-displacement characterization that expresses the mismatch as an additive displacement $\\varepsilon_t$ in log-odds, determined by the per-logit perturbation before the softmax, whose distribution is approximately invariant to token confidence. This characterization motivates a confidence-aware truncation: large positive displacements are truncated at a single constant threshold, which maps back to an importance-ratio cap that tightens as token confidence increases. Theoretically, we show that CIS replaces the unbounded second moment that governs the error of exact importance sampling with a term bounded by a constant, at the cost of a bias controlled by the truncated excess. In evaluation across three mixture-of-experts models and five mathematical reasoning benchmarks, CIS achieves the highest five-benchmark average on all three models among the evaluated baselines. Diagnostic analyses show that CIS places less truncation bias on low-confidence tokens than truncated importance sampling, while upward clipping of small importance weights reduces held-out accuracy.", "arxiv_id": "2609.32444", "arxiv_url": "https://arxiv.org/abs/2609.32444", "authors": ["Tianrun Yu", "Kaixiang Zhao", "Shangzhe Li", "Yuxiao Yang", "Porter Jenkins", "Weitong Zhang", "Taylor W. Killian"], "brief": "\u8bba\u6587\u7814\u7a76RLVR\u4e2d\u63a8\u7406\u5f15\u64ce\u91c7\u6837\u4e0e\u8bad\u7ec3\u5f15\u64ce\u8ba1\u7b97\u68af\u5ea6\u65f6\u5bf9\u540c\u4e00token\u6982\u7387\u4f30\u8ba1\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\uff0c\u5e76\u63d0\u51fa calibrated importance sampling\uff08CIS\uff09\u6765\u4fee\u6b63\u7b56\u7565\u66f4\u65b0\u3002\u5176\u6838\u5fc3\u662f\u7528log-odds\u4e2d\u7684\u52a0\u6027\u4f4d\u79fb\u523b\u753b\u9519\u914d\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba1\u7f6e\u4fe1\u5ea6\u611f\u77e5\u7684\u622a\u65ad\u89c4\u5219\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/kzhao5/CIS-RL", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32444", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u8bad\u7ec3-\u63a8\u7406\u9519\u914d\u53ef\u8fd1\u4f3c\u8868\u793a\u4e3asoftmax\u524dlogit\u6270\u52a8\u5bfc\u81f4\u7684log-odds\u52a0\u6027\u4f4d\u79fb\uff0c\u4e14\u8be5\u4f4d\u79fb\u5206\u5e03\u5bf9token\u7f6e\u4fe1\u5ea6\u8fd1\u4f3c\u4e0d\u53d8", "CIS\u5bf9\u5927\u7684\u6b63\u5411\u4f4d\u79fb\u91c7\u7528\u5e38\u6570\u9608\u503c\u622a\u65ad\uff0c\u6620\u5c04\u4e3a\u968ftoken\u7f6e\u4fe1\u5ea6\u5347\u9ad8\u800c\u66f4\u4e25\u683c\u7684\u91cd\u8981\u6027\u6bd4\u7387\u4e0a\u9650", "\u7406\u8bba\u4e0a\u5c06\u7cbe\u786e\u91cd\u8981\u6027\u91c7\u6837\u4e2d\u63a7\u5236\u8bef\u5dee\u7684\u65e0\u754c\u4e8c\u9636\u77e9\u66ff\u6362\u4e3a\u5e38\u6570\u6709\u754c\u9879\uff0c\u4ee3\u4ef7\u662f\u53ef\u7531\u622a\u65ad\u8d85\u989d\u63a7\u5236\u7684\u504f\u5dee", "\u57283\u4e2a\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\u548c5\u4e2a\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0cCIS\u53d6\u5f97\u6240\u6709\u6a21\u578b\u4e2d\u6700\u9ad8\u7684\u4e94\u57fa\u51c6\u5e73\u5747\u8868\u73b0"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u91cd\u8981\u6027\u91c7\u6837", "\u6570\u5b66\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.32444v1", "published_at": "2026-09-26", "score": 0.221, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32444.png", "title": "Rethinking Training-Inference Mismatch in LLM Reinforcement Learning: Where It Arises and How to Correct It", "tldr": "\u7528\u6821\u51c6\u91cd\u8981\u6027\u91c7\u6837\u4fee\u6b63LLM\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u63a8\u7406\u9519\u914d", "upvotes": 4, "what_it_is": "\u8bba\u6587\u7814\u7a76RLVR\u4e2d\u63a8\u7406\u5f15\u64ce\u91c7\u6837\u4e0e\u8bad\u7ec3\u5f15\u64ce\u8ba1\u7b97\u68af\u5ea6\u65f6\u5bf9\u540c\u4e00token\u6982\u7387\u4f30\u8ba1\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\uff0c\u5e76\u63d0\u51fa calibrated importance sampling\uff08CIS\uff09\u6765\u4fee\u6b63\u7b56\u7565\u66f4\u65b0\u3002\u5176\u6838\u5fc3\u662f\u7528log-odds\u4e2d\u7684\u52a0\u6027\u4f4d\u79fb\u523b\u753b\u9519\u914d\uff0c\u5e76\u636e\u6b64\u8bbe\u8ba1\u7f6e\u4fe1\u5ea6\u611f\u77e5\u7684\u622a\u65ad\u89c4\u5219\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9LLM\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6d41\u6c34\u7ebf\u4e2d\u5e38\u88ab\u5ffd\u89c6\u4f46\u5b9e\u9645\u5b58\u5728\u7684\u5f15\u64ce\u6982\u7387\u9519\u914d\u95ee\u9898\uff0c\u7ed9\u51fa\u7edf\u8ba1\u523b\u753b\u3001\u7406\u8bba\u5206\u6790\u548c\u6709\u6548\u4fee\u6b63\u65b9\u6cd5\uff1b\u5bf9RLVR\u3001\u6570\u5b66\u63a8\u7406\u8bad\u7ec3\u548c\u5927\u89c4\u6a21\u5206\u5e03\u5f0f\u8bad\u7ec3\u7cfb\u7edf\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Realistic online handwriting depends not only on individual character shapes, but also on how a writer connects, spaces, and aligns adjacent characters. Existing methods rely primarily on long-range sequence modeling and capture these inter-character behaviors only implicitly. This often produces plausible glyphs accompanied by broken cursive joins, inconsistent spacing, or writer-inconsistent transitions. We introduce BoundInk, a writer-conditioned framework that treats inter-character boundaries as explicit generation units. By jointly modeling local transitions and surrounding text context, BoundInk preserves writer-specific glyph appearance while improving connectivity and spacing across complete text lines. We further introduce a boundary-aware evaluation framework that directly assesses cursive continuity and spatial relationships between characters beyond conventional trajectory similarity. Across three benchmark-matched settings, BoundInk improves all applicable boundary-quality measures and reduces normalized dynamic time warping by 17.6--47.8%. In blind human evaluations, BoundInk outputs are preferred in 78.0--82.6% of valid criterion-wise judgments.", "arxiv_id": "2604.02103", "arxiv_url": "https://arxiv.org/abs/2604.02103", "authors": ["Jinsu Shin", "Sungeun Hong", "JinYeong Bak"], "brief": "BoundInk \u662f\u4e00\u4e2a\u4f5c\u8005\u6761\u4ef6\u5316\u7684\u5728\u7ebf\u624b\u5199\u751f\u6210\u6846\u67b6\uff0c\u5c06\u5b57\u7b26\u95f4\u8fb9\u754c\u4f5c\u4e3a\u663e\u5f0f\u751f\u6210\u5355\u5143\u6765\u5efa\u6a21\u3002\u5b83\u8054\u5408\u5229\u7528\u5c40\u90e8\u7b14\u753b\u8fc7\u6e21\u4e0e\u5468\u56f4\u6587\u672c\u4e0a\u4e0b\u6587\uff0c\u5728\u4fdd\u6301\u4e66\u5199\u8005\u5b57\u5f62\u98ce\u683c\u7684\u540c\u65f6\u6539\u5584\u8fde\u7b14\u3001\u95f4\u8ddd\u548c\u5bf9\u9f50\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/jinsu0000/cashg-official", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2604.02103", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5b57\u95f4\u8fde\u63a5\u3001\u95f4\u8ddd\u3001\u5bf9\u9f50\u7b49\u8fb9\u754c\u884c\u4e3a\u4ece\u9690\u5f0f\u957f\u5e8f\u5217\u5efa\u6a21\u4e2d\u62c6\u51fa\uff0c\u4f5c\u4e3a\u72ec\u7acb\u751f\u6210\u76ee\u6807", "\u63d0\u51fa\u8fb9\u754c\u611f\u77e5\u8bc4\u4f30\u6846\u67b6\uff0c\u76f4\u63a5\u8861\u91cf\u8fde\u7b14\u8fde\u7eed\u6027\u4e0e\u5b57\u7b26\u95f4\u7a7a\u95f4\u5173\u7cfb", "\u5728\u4e09\u4e2a\u57fa\u51c6\u5339\u914d\u8bbe\u7f6e\u4e2d\uff0c\u8fb9\u754c\u8d28\u91cf\u6307\u6807\u5168\u9762\u63d0\u5347\uff0c\u5f52\u4e00\u5316 DTW \u964d\u4f4e 17.6%\u201347.8%\uff0c\u76f2\u6d4b\u504f\u597d\u7387\u8fbe 78.0%\u201382.6%"], "keywords": ["\u624b\u5199\u751f\u6210", "\u5e8f\u5217\u5efa\u6a21", "\u4e2a\u6027\u5316\u751f\u6210", "\u8bc4\u4f30\u65b9\u6cd5"], "num_comments": 2, "on_hf": true, "organization": "Sungkyunkwan University", "pdf_url": "https://arxiv.org/pdf/2604.02103v3", "published_at": "2026-04-02", "score": 0.217, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2604.02103.png", "title": "BoundInk: Boundary-Aware Online Handwriting Generation", "tldr": "\u663e\u5f0f\u5efa\u6a21\u5b57\u95f4\u8fb9\u754c\u63d0\u5347\u5728\u7ebf\u624b\u5199\u751f\u6210", "upvotes": 1, "what_it_is": "BoundInk \u662f\u4e00\u4e2a\u4f5c\u8005\u6761\u4ef6\u5316\u7684\u5728\u7ebf\u624b\u5199\u751f\u6210\u6846\u67b6\uff0c\u5c06\u5b57\u7b26\u95f4\u8fb9\u754c\u4f5c\u4e3a\u663e\u5f0f\u751f\u6210\u5355\u5143\u6765\u5efa\u6a21\u3002\u5b83\u8054\u5408\u5229\u7528\u5c40\u90e8\u7b14\u753b\u8fc7\u6e21\u4e0e\u5468\u56f4\u6587\u672c\u4e0a\u4e0b\u6587\uff0c\u5728\u4fdd\u6301\u4e66\u5199\u8005\u5b57\u5f62\u98ce\u683c\u7684\u540c\u65f6\u6539\u5584\u8fde\u7b14\u3001\u95f4\u8ddd\u548c\u5bf9\u9f50\u3002", "why_notable": "\u8bba\u6587\u5173\u6ce8\u4ee5\u5f80\u5728\u7ebf\u624b\u5199\u751f\u6210\u4e2d\u5e38\u88ab\u5ffd\u7565\u7684\u5b57\u95f4\u8fc7\u6e21\u95ee\u9898\uff0c\u901a\u8fc7\u663e\u5f0f\u8fb9\u754c\u5efa\u6a21\u663e\u8457\u63d0\u5347\u6574\u884c\u624b\u5199\u7684\u81ea\u7136\u5ea6\u548c\u4e00\u81f4\u6027\uff0c\u5bf9\u624b\u5199\u5408\u6210\u3001\u4e2a\u6027\u5316\u5b57\u4f53\u4e0e\u8f68\u8ff9\u751f\u6210\u8bc4\u4f30\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Jev is a fast, low-cost decision model that answers natural-language questions with choices, binary judgments, and scores. As its public ecosystem grows rapidly, it remains unclear how Jev is used across applications and how public attention relates to project distribution. To answer these questions, we conduct a large-scale, data-driven analysis of 2,170 publicly available Jev projects collected from GitHub as of September 22, 2026. We find rapid early growth in Jev\u0027s public ecosystem, with both new projects and integration into existing repositories. Across diverse domains, projects use Jev for multiple decision purposes and combine its interfaces. Attribute judgment and scoring are widely used, while the use of action selection, content filtering, and model and tool selection varies across domains. These patterns suggest that Jev serves as a reusable decision component whose functionality varies with the surrounding workflow. Meanwhile, public attention is concentrated in routing and interface agents and does not track project counts. Our findings provide a quantitative view of Jev\u0027s emerging ecosystem and inform the design and evaluation of general-purpose decision models across diverse application contexts.", "arxiv_id": "2609.30216", "arxiv_url": "https://arxiv.org/abs/2609.30216", "authors": ["Guoming Ling", "Muen Xue", "Zijian Ye"], "brief": "\u672c\u6587\u5bf9\u622a\u81f32026\u5e749\u670822\u65e5 GitHub \u4e0a2170\u4e2a\u516c\u5f00 Jev \u9879\u76ee\u8fdb\u884c\u6570\u636e\u9a71\u52a8\u5206\u6790\uff0c\u7814\u7a76\u8fd9\u79cd\u4f4e\u6210\u672c\u81ea\u7136\u8bed\u8a00\u51b3\u7b56\u6a21\u578b\u5728\u771f\u5b9e\u5e94\u7528\u4e2d\u7684\u529f\u80fd\u3001\u9886\u57df\u5206\u5e03\u4e0e\u5173\u6ce8\u5ea6\u3002\u7814\u7a76\u53d1\u73b0 Jev \u5e38\u88ab\u4f5c\u4e3a\u53ef\u590d\u7528\u51b3\u7b56\u7ec4\u4ef6\uff0c\u7528\u4e8e\u5c5e\u6027\u5224\u65ad\u3001\u8bc4\u5206\u3001\u8def\u7531\u3001\u5de5\u5177\u9009\u62e9\u7b49\u4efb\u52a1\u3002", "categories": ["cs.SE"], "github_repo": "https://github.com/godxue1/Jev_in_the_wild", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30216", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u6536\u96c6\u5e76\u5206\u67902170\u4e2a\u516c\u5f00 Jev \u9879\u76ee\uff0c\u8986\u76d6\u65b0\u5efa\u9879\u76ee\u4e0e\u65e2\u6709\u4ed3\u5e93\u96c6\u6210\u573a\u666f", "Jev \u7684\u5c5e\u6027\u5224\u65ad\u548c\u8bc4\u5206\u63a5\u53e3\u4f7f\u7528\u6700\u5e7f\uff0c\u52a8\u4f5c\u9009\u62e9\u3001\u5185\u5bb9\u8fc7\u6ee4\u3001\u6a21\u578b\u4e0e\u5de5\u5177\u9009\u62e9\u968f\u9886\u57df\u5dee\u5f02\u660e\u663e", "\u516c\u4f17\u5173\u6ce8\u4e3b\u8981\u96c6\u4e2d\u5728\u8def\u7531\u548c\u754c\u9762\u667a\u80fd\u4f53\u65b9\u5411\uff0c\u4f46\u4e0e\u9879\u76ee\u6570\u91cf\u5206\u5e03\u5e76\u4e0d\u4e00\u81f4"], "keywords": ["\u51b3\u7b56\u6a21\u578b", "\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u751f\u6001\u5206\u6790"], "num_comments": 1, "on_hf": true, "organization": "The Chinese University of Hong Kong", "pdf_url": "https://arxiv.org/pdf/2609.30216v1", "published_at": "2026-09-24", "score": 0.212, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.30216.png", "title": "Jev in the Wild: A Data-Driven Analysis of the Jev Model\u0027s Functionality, Applications and Ecosystem", "tldr": "\u5927\u89c4\u6a21\u5206\u6790Jev\u516c\u5171\u9879\u76ee\u751f\u6001\u4e0e\u5e94\u7528\u6a21\u5f0f", "upvotes": 8, "what_it_is": "\u672c\u6587\u5bf9\u622a\u81f32026\u5e749\u670822\u65e5 GitHub \u4e0a2170\u4e2a\u516c\u5f00 Jev \u9879\u76ee\u8fdb\u884c\u6570\u636e\u9a71\u52a8\u5206\u6790\uff0c\u7814\u7a76\u8fd9\u79cd\u4f4e\u6210\u672c\u81ea\u7136\u8bed\u8a00\u51b3\u7b56\u6a21\u578b\u5728\u771f\u5b9e\u5e94\u7528\u4e2d\u7684\u529f\u80fd\u3001\u9886\u57df\u5206\u5e03\u4e0e\u5173\u6ce8\u5ea6\u3002\u7814\u7a76\u53d1\u73b0 Jev \u5e38\u88ab\u4f5c\u4e3a\u53ef\u590d\u7528\u51b3\u7b56\u7ec4\u4ef6\uff0c\u7528\u4e8e\u5c5e\u6027\u5224\u65ad\u3001\u8bc4\u5206\u3001\u8def\u7531\u3001\u5de5\u5177\u9009\u62e9\u7b49\u4efb\u52a1\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u4f9b\u4e86 Jev \u8fd9\u4e00\u65b0\u5174\u901a\u7528\u51b3\u7b56\u6a21\u578b\u751f\u6001\u7684\u9996\u4e2a\u91cf\u5316\u89c6\u89d2\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u4f4e\u6210\u672c\u51b3\u7b56\u6a21\u578b\u5982\u4f55\u5d4c\u5165\u771f\u5b9e\u8f6f\u4ef6\u4e0e\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u5e76\u4e3a\u540e\u7eed\u6a21\u578b\u8bbe\u8ba1\u548c\u8bc4\u4f30\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "A nascent family of methods that forgoes the policy gradient and reweights a supervised regression instead has garnered momentum in reinforcement learning for diffusion and flow models. DiffusionNFT, FlowAWR, and RAM are representative regimes with contrasting motivations. It is yet opaque what, if anything, they share. We substantiate that each is the solution of one divergence-constrained reward-maximization problem, and they are differentiated only by the convex generator that defines the constraint. Under the unified modeling framework, we unravel the relaxations that prior art made during building the advantage-embedded regression target: approximating the KKT condition and posterior normalizer for the linear and exponential tilt shapes DiffusionNFT and FlowAWR respectively, while preserving the exact sparsemax projection onto the probability simplex for linear tilt leads to another superior model type in this work. Beyond the theoretical underpinnings, we further empirically investigate the design space and shed light on the training recipe for regression-style diffusion RL. Retaining the merits discovered during our exploration gives rise to DiffusionRFT, our paradigm that converges faster, trains more stably, and attains the top performance.", "arxiv_id": "2609.33444", "arxiv_url": "https://arxiv.org/abs/2609.33444", "authors": ["Toyota Li", "David Zhao", "Alan Zhao"], "brief": "\u672c\u6587\u5c06 DiffusionNFT\u3001FlowAWR\u3001RAM \u7b49\u56de\u5f52\u5f0f\u6269\u6563/\u6d41\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u7edf\u4e00\u4e3a\u4e00\u7c7b\u5e26\u6563\u5ea6\u7ea6\u675f\u7684\u5956\u52b1\u6700\u5927\u5316\u95ee\u9898\u3002\u4f5c\u8005\u63ed\u793a\u4e0d\u540c\u65b9\u6cd5\u672c\u8d28\u4e0a\u53ea\u7531\u7ea6\u675f\u7684\u51f8\u751f\u6210\u51fd\u6570\u533a\u5206\uff0c\u5e76\u63d0\u51fa\u66f4\u7a33\u5b9a\u9ad8\u6548\u7684 DiffusionRFT\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33444", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u660e\u591a\u79cd\u65e0\u7b56\u7565\u68af\u5ea6\u7684\u76d1\u7763\u56de\u5f52\u91cd\u52a0\u6743\u65b9\u6cd5\u5171\u4eab\u7edf\u4e00\u7684\u6563\u5ea6\u7ea6\u675f\u5956\u52b1\u6700\u5927\u5316\u5f62\u5f0f", "\u5206\u6790\u65e2\u6709\u65b9\u6cd5\u5728\u6784\u9020\u5e26\u4f18\u52bf\u51fd\u6570\u7684\u56de\u5f52\u76ee\u6807\u65f6\u5bf9 KKT \u6761\u4ef6\u3001\u540e\u9a8c\u5f52\u4e00\u5316\u9879\u7b49\u6240\u505a\u8fd1\u4f3c", "\u4fdd\u7559\u7ebf\u6027\u503e\u659c\u4e0b\u7684\u7cbe\u786e sparsemax \u6982\u7387\u5355\u7eaf\u5f62\u6295\u5f71\uff0c\u5f97\u5230\u6536\u655b\u66f4\u5feb\u3001\u8bad\u7ec3\u66f4\u7a33\u3001\u6027\u80fd\u66f4\u4f18\u7684 DiffusionRFT"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u751f\u6210\u6a21\u578b", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33444v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Elucidating the Design Space of Regression-based Diffusion Reinforcement Learning", "tldr": "\u7edf\u4e00\u89e3\u6790\u56de\u5f52\u5f0f\u6269\u6563\u5f3a\u5316\u5b66\u4e60\u8bbe\u8ba1\u7a7a\u95f4", "upvotes": 0, "what_it_is": "\u672c\u6587\u5c06 DiffusionNFT\u3001FlowAWR\u3001RAM \u7b49\u56de\u5f52\u5f0f\u6269\u6563/\u6d41\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u7edf\u4e00\u4e3a\u4e00\u7c7b\u5e26\u6563\u5ea6\u7ea6\u675f\u7684\u5956\u52b1\u6700\u5927\u5316\u95ee\u9898\u3002\u4f5c\u8005\u63ed\u793a\u4e0d\u540c\u65b9\u6cd5\u672c\u8d28\u4e0a\u53ea\u7531\u7ea6\u675f\u7684\u51f8\u751f\u6210\u51fd\u6570\u533a\u5206\uff0c\u5e76\u63d0\u51fa\u66f4\u7a33\u5b9a\u9ad8\u6548\u7684 DiffusionRFT\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u8fd1\u671f\u5feb\u901f\u53d1\u5c55\u7684\u6269\u6563\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u63d0\u4f9b\u4e86\u7edf\u4e00\u7406\u8bba\u89e3\u91ca\uff0c\u5e76\u7cfb\u7edf\u68b3\u7406\u4e86\u5173\u952e\u8bbe\u8ba1\u9009\u62e9\uff0c\u5bf9\u6539\u8fdb\u751f\u6210\u6a21\u578b\u7684\u5956\u52b1\u5bf9\u9f50\u8bad\u7ec3\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "A central goal in robotics is to enable manipulation across changing tasks and environments. Vision-language-action (VLA) models provide broad manipulation capabilities but can struggle when execution requires diagnosing failures and adapting behavior. Strong agents can discover effective interventions through interaction with these policies. We propose Recursive Harness Distillation to accumulate this experience as reusable guidance across agents. A strong agent distills its experience into a playbook for a light agent, then recursively refines the playbook using the light agent\u0027s execution feedback. The resulting playbook enables agents to reuse accumulated intervention knowledge in new task instances without updating model parameters. In real-world manipulation, the harness improves success from 37.3% to 64.0%. On SimplerEnv Bridge, the light agent with the playbook achieves 66.7% success, compared with 41.7% for the GR00T-only baseline, and outperforms the strong agent without a playbook. The same playbook also benefits the strong agent, which reaches 79.2% success. These results demonstrate the feasibility of harness distillation for robotics: intervention experience can be accumulated, refined through execution, and reused across agents to improve manipulation.", "arxiv_id": "2609.33378", "arxiv_url": "https://arxiv.org/abs/2609.33378", "authors": ["Seungyeon Kim", "Junhoo Lee", "Minkyu Kim", "Baekseung Kim", "Nojun Kwak"], "brief": "\u8bba\u6587\u63d0\u51fa Recursive Harness Distillation\uff1a\u8ba9\u5f3a\u667a\u80fd\u4f53\u5c06\u4e0e VLA \u7b56\u7565\u4ea4\u4e92\u4e2d\u83b7\u5f97\u7684\u6545\u969c\u8bca\u65ad\u4e0e\u5e72\u9884\u7ecf\u9a8c\u84b8\u998f\u6210\u53ef\u590d\u7528 playbook\uff0c\u5e76\u901a\u8fc7\u8f7b\u91cf\u667a\u80fd\u4f53\u7684\u6267\u884c\u53cd\u9988\u9012\u5f52\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u53c2\u6570\uff0c\u5373\u53ef\u5728\u65b0\u4efb\u52a1\u5b9e\u4f8b\u4e2d\u590d\u7528\u64cd\u4f5c\u5e72\u9884\u77e5\u8bc6\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33378", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5f3a\u667a\u80fd\u4f53\u5148\u63a2\u7d22\u6709\u6548\u5e72\u9884\u7b56\u7565\uff0c\u518d\u5c06\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u8f7b\u91cf\u667a\u80fd\u4f53\u53ef\u6267\u884c\u7684 playbook", "\u901a\u8fc7\u8f7b\u91cf\u667a\u80fd\u4f53\u6267\u884c\u53cd\u9988\u9012\u5f52\u4fee\u8ba2 playbook\uff0c\u5b9e\u73b0\u8de8\u667a\u80fd\u4f53\u7ecf\u9a8c\u79ef\u7d2f\u4e0e\u6539\u8fdb", "\u771f\u5b9e\u673a\u5668\u4eba\u64cd\u4f5c\u6210\u529f\u7387\u4ece 37.3% \u63d0\u5347\u5230 64.0%\uff1b\u5728 SimplerEnv Bridge \u4e0a\u8f7b\u91cf\u667a\u80fd\u4f53\u4ece 41.7% \u63d0\u5347\u5230 66.7%"], "keywords": ["\u673a\u5668\u4eba", "\u667a\u80fd\u4f53", "VLA", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33378v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Recursive Harness Distillation across Agents for Robot Manipulation", "tldr": "\u9012\u5f52\u84b8\u998f\u5e72\u9884\u7ecf\u9a8c\u63d0\u5347\u673a\u5668\u4eba\u64cd\u4f5c\u6210\u529f\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Recursive Harness Distillation\uff1a\u8ba9\u5f3a\u667a\u80fd\u4f53\u5c06\u4e0e VLA \u7b56\u7565\u4ea4\u4e92\u4e2d\u83b7\u5f97\u7684\u6545\u969c\u8bca\u65ad\u4e0e\u5e72\u9884\u7ecf\u9a8c\u84b8\u998f\u6210\u53ef\u590d\u7528 playbook\uff0c\u5e76\u901a\u8fc7\u8f7b\u91cf\u667a\u80fd\u4f53\u7684\u6267\u884c\u53cd\u9988\u9012\u5f52\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u53c2\u6570\uff0c\u5373\u53ef\u5728\u65b0\u4efb\u52a1\u5b9e\u4f8b\u4e2d\u590d\u7528\u64cd\u4f5c\u5e72\u9884\u77e5\u8bc6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u4e0d\u6539\u52a8\u5e95\u5c42 VLA \u6a21\u578b\u53c2\u6570\u4e5f\u80fd\u6301\u7eed\u79ef\u7d2f\u548c\u8fc1\u79fb\u64cd\u4f5c\u7ecf\u9a8c\u7684\u8def\u5f84\uff0c\u5bf9\u63d0\u5347\u673a\u5668\u4eba\u5728\u590d\u6742\u73af\u5883\u4e2d\u7684\u81ea\u9002\u5e94\u6267\u884c\u4e0e\u6545\u969c\u6062\u590d\u80fd\u529b\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "World Action Models (WAMs) jointly generate video and robot actions through iterative diffusion and perform strongly in robotic manipulation. However, their prohibitive compute and memory costs pose substantial deployment challenges. Post-training quantization (PTQ) can reduce these costs, but existing PTQ methods such as smoothing and rotation are insufficient to maintain the precision of action generation. To overcome this limitation, we propose Q-WAM, a new 4-bit weight-activation quantization for WAMs that preserves the actions the model generates. Specifically, we introduce the \\textit{Action Observability Gramian (AOG)}, which measures how much rounding errors in each weighted combination of a layer\u0027s input channels change the final action through all denoising steps. We also develop Action-Subspace Protection (ASP), which keeps the few most action-sensitive channel combinations in a tiny 16-bit low-rank branch and quantizes the complementary weights and activations to 4 bits, both as dense matrix multiplications that run efficiently on GPUs. Finally, to preserve action quality with minimal overhead, we identify the experts that matter most for the generated action by aggregating the AOG-derived action mass across the layers of each expert and apply ASP only to those experts. We evaluate Q-WAM on three WAMs, both in simulation and in real-world deployment. On the RoboTwin 2.0 benchmark, it reaches 89.6--93.0\\% average success rate, within 1.1 percentage points of the 16-bit models, while reducing the memory of the quantized blocks by 3.1--3.4$\\times$. Our method outperforms the strongest baseline, SVDQuant, by 2.5--8.7 percentage points. On a Unitree G1 humanoid and a bimanual UR3 robot, it improves success over SVDQuant by 12.8-17.6 percentage points.", "arxiv_id": "2609.33269", "arxiv_url": "https://arxiv.org/abs/2609.33269", "authors": ["Arash Akbari", "Arman Akbari", "Jingwu Luo", "Yuhao Lei", "Yi Gao", "Weiwei Chen", "Xuan Zhang", "Zhenman Fang", "Geng Yuan", "Yanzhi Wang"], "brief": "\u8bba\u6587\u63d0\u51faQ-WAM\uff0c\u4e00\u79cd\u9762\u5411World Action Models\u76844\u6bd4\u7279\u6743\u91cd-\u6fc0\u6d3b\u8bad\u7ec3\u540e\u91cf\u5316\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u8bc6\u522b\u5e76\u4fdd\u62a4\u5bf9\u6700\u7ec8\u673a\u5668\u4eba\u52a8\u4f5c\u6700\u654f\u611f\u7684\u4f4e\u7ef4\u5b50\u7a7a\u95f4\uff0c\u5728\u663e\u8457\u964d\u4f4e\u663e\u5b58\u4e0e\u8ba1\u7b97\u6210\u672c\u7684\u540c\u65f6\u7ef4\u6301\u52a8\u4f5c\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33269", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51faAction Observability Gramian\uff0c\u7528\u4e8e\u8861\u91cf\u5404\u8f93\u5165\u901a\u9053\u7ec4\u5408\u7684\u91cf\u5316\u820d\u5165\u8bef\u5dee\u4f1a\u5982\u4f55\u5f71\u54cd\u591a\u6b65\u53bb\u566a\u540e\u7684\u6700\u7ec8\u52a8\u4f5c\u3002", "\u8bbe\u8ba1Action-Subspace Protection\uff0c\u5c06\u5c11\u91cf\u52a8\u4f5c\u654f\u611f\u65b9\u5411\u4fdd\u7559\u572816\u6bd4\u7279\u4f4e\u79e9\u5206\u652f\uff0c\u5176\u4f59\u6743\u91cd\u4e0e\u6fc0\u6d3b\u91cf\u5316\u52304\u6bd4\u7279\uff0c\u5e76\u4fdd\u6301GPU\u53cb\u597d\u7684\u7a20\u5bc6\u77e9\u9635\u4e58\u6cd5\u3002", "\u901a\u8fc7\u8de8\u5c42\u805a\u5408\u52a8\u4f5c\u654f\u611f\u5ea6\uff0c\u4ec5\u5bf9\u6700\u5173\u952e\u4e13\u5bb6\u5e94\u7528\u4fdd\u62a4\uff1b\u5728RoboTwin 2.0\u4e0a\u6210\u529f\u7387\u8fbe89.6\u201393.0%\uff0c\u8ddd16\u6bd4\u7279\u6a21\u578b\u4ec51.1\u4e2a\u767e\u5206\u70b9\uff0c\u4f18\u4e8eSVDQuant 2.5\u20138.7\u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u91cf\u5316", "\u6269\u6563\u6a21\u578b", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33269v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Q-WAM: 4-Bit Quantization of World Action Models with Action-Subspace Protection", "tldr": "Q-WAM\u5b9e\u73b0\u9ad8\u4fdd\u771f4\u6bd4\u7279\u673a\u5668\u4eba\u52a8\u4f5c\u6a21\u578b\u91cf\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faQ-WAM\uff0c\u4e00\u79cd\u9762\u5411World Action Models\u76844\u6bd4\u7279\u6743\u91cd-\u6fc0\u6d3b\u8bad\u7ec3\u540e\u91cf\u5316\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u8bc6\u522b\u5e76\u4fdd\u62a4\u5bf9\u6700\u7ec8\u673a\u5668\u4eba\u52a8\u4f5c\u6700\u654f\u611f\u7684\u4f4e\u7ef4\u5b50\u7a7a\u95f4\uff0c\u5728\u663e\u8457\u964d\u4f4e\u663e\u5b58\u4e0e\u8ba1\u7b97\u6210\u672c\u7684\u540c\u65f6\u7ef4\u6301\u52a8\u4f5c\u751f\u6210\u8d28\u91cf\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u673a\u5668\u4eba\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u4e2d\u201c\u89c6\u9891\u751f\u6210\u53ef\u63a5\u53d7\u4f46\u52a8\u4f5c\u7cbe\u5ea6\u6613\u53d7\u635f\u201d\u7684\u91cf\u5316\u75db\u70b9\uff0c\u63d0\u51fa\u52a8\u4f5c\u654f\u611f\u6027\u9a71\u52a8\u7684\u4fdd\u62a4\u673a\u5236\uff0c\u5e76\u5728\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u9a8c\u8bc1\u4e86\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Video world models are emerging as data engines, action planners, and generative simulators for autonomous driving, but existing benchmarks primarily assess visual fidelity and coarse physical plausibility, providing limited evidence on whether generated driving futures obey realistic vehicle kinematics and dynamics. This limitation is further compounded by the lack of datasets in which vehicle, road, maneuver, and speed conditions are independently controlled, and ground-truth vehicle states are recorded in synchrony with videos. We introduce VehDyn, a driving world model benchmark for vehicle dynamics. VehDyn is built on a CARLA-CarSim co-simulation platform where photorealistic rendering is coupled with a validated multi-body dynamics model, and it contains 10,080 configurations from a full factorial design over five vehicle types, four tire-road friction coefficients, three maneuvers, four target speeds, 14 scenes, and three illuminations, each paired with synchronized position, velocity, and attitude sequences. Built on this dataset, VehDyn introduces a hierarchical evaluation framework that measures trajectory alignment, kinematic consistency, and dynamic consistency, and benchmarks 12 state-of-the-art video world models. We further assess the video quality using two established protocols and correlate it with the VehDyn score. Trajectory-level metrics are nearly saturated, with ten of twelve models within 20\\% of ground truth, while no model reaches 92\\% of ground truth on dynamic consistency, and visual-quality metrics are only weakly correlated with vehicle-dynamics fidelity. DrivingWorld achieves the highest VehDyn score, followed by Cosmos 3 Nano and LTX-Video 2.5, and the VehDyn score agrees closely with human judgment. VehDyn provides a systematic foundation for developing driving world models that are physically consistent and visually realistic.", "arxiv_id": "2609.33264", "arxiv_url": "https://arxiv.org/abs/2609.33264", "authors": ["Tianyi Wang", "Wangsheng Du", "Jiazhou Chen", "Tianyi Zeng", "Xiangyu Li", "Jiseop Byeon", "Yujin Wang", "Yiming Xu", "Yangyang Wang", "Bingzhao Gao", "Sikai Chen", "Zhaomiao Guo", "Junfeng Jiao", "Christian Claudel", "Alexandre Bayen"], "brief": "\u8bba\u6587\u63d0\u51fa VehDyn\uff0c\u4e00\u4e2a\u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u8f66\u8f86\u52a8\u529b\u5b66\u57fa\u51c6\u3002\u5b83\u57fa\u4e8e CARLA-CarSim \u8054\u5408\u4eff\u771f\u6784\u5efa\u53d7\u63a7\u6570\u636e\u96c6\uff0c\u5e76\u7528\u5206\u5c42\u6307\u6807\u8bc4\u4f30\u751f\u6210\u89c6\u9891\u4e2d\u7684\u8f68\u8ff9\u3001\u8fd0\u52a8\u5b66\u4e0e\u52a8\u529b\u5b66\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV", "cs.AI", "cs.ET", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33264", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6570\u636e\u96c6\u8986\u76d6 10080 \u79cd\u914d\u7f6e\uff0c\u7cfb\u7edf\u63a7\u5236\u8f66\u578b\u3001\u8def\u9762\u6469\u64e6\u3001\u673a\u52a8\u52a8\u4f5c\u3001\u76ee\u6807\u901f\u5ea6\u3001\u573a\u666f\u4e0e\u5149\u7167\uff0c\u5e76\u540c\u6b65\u8bb0\u5f55\u4f4d\u7f6e\u3001\u901f\u5ea6\u548c\u59ff\u6001\u5e8f\u5217\u3002", "\u63d0\u51fa\u5206\u5c42\u8bc4\u6d4b\u6846\u67b6\uff1a\u8f68\u8ff9\u5bf9\u9f50\u3001\u8fd0\u52a8\u5b66\u4e00\u81f4\u6027\u3001\u52a8\u529b\u5b66\u4e00\u81f4\u6027\uff0c\u6bd4\u5355\u7eaf\u89c6\u89c9\u8d28\u91cf\u66f4\u5173\u6ce8\u8f66\u8f86\u7269\u7406\u771f\u5b9e\u6027\u3002", "\u8bc4\u6d4b 12 \u4e2a\u524d\u6cbf\u89c6\u9891\u4e16\u754c\u6a21\u578b\u53d1\u73b0\uff1a\u8f68\u8ff9\u6307\u6807\u63a5\u8fd1\u9971\u548c\uff0c\u4f46\u52a8\u529b\u5b66\u4e00\u81f4\u6027\u4ecd\u660e\u663e\u4e0d\u8db3\uff0c\u89c6\u89c9\u8d28\u91cf\u6307\u6807\u4e0e\u52a8\u529b\u5b66\u4fdd\u771f\u5ea6\u76f8\u5173\u6027\u8f83\u5f31\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u9891\u751f\u6210", "\u4eff\u771f\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33264v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "VehDyn: A Driving World Model Benchmark for Vehicle Dynamics", "tldr": "\u8bc4\u6d4b\u9a7e\u9a76\u4e16\u754c\u6a21\u578b\u7684\u8f66\u8f86\u52a8\u529b\u5b66\u771f\u5b9e\u6027\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VehDyn\uff0c\u4e00\u4e2a\u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u8f66\u8f86\u52a8\u529b\u5b66\u57fa\u51c6\u3002\u5b83\u57fa\u4e8e CARLA-CarSim \u8054\u5408\u4eff\u771f\u6784\u5efa\u53d7\u63a7\u6570\u636e\u96c6\uff0c\u5e76\u7528\u5206\u5c42\u6307\u6807\u8bc4\u4f30\u751f\u6210\u89c6\u9891\u4e2d\u7684\u8f68\u8ff9\u3001\u8fd0\u52a8\u5b66\u4e0e\u52a8\u529b\u5b66\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u9a7e\u9a76\u4e16\u754c\u6a21\u578b\u4e0d\u80fd\u53ea\u770b\u753b\u9762\u903c\u771f\u5ea6\uff0c\u8fd8\u5fc5\u987b\u9a8c\u8bc1\u8f66\u8f86\u52a8\u529b\u5b66\u662f\u5426\u53ef\u4fe1\uff0c\u4e3a\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u3001\u89c4\u5212\u4e0e\u6570\u636e\u751f\u6210\u63d0\u4f9b\u4e86\u66f4\u7269\u7406\u4e00\u81f4\u7684\u8bc4\u6d4b\u57fa\u7840\u3002"}, {"abstract": "FMCW LiDAR measures per-point radial Doppler velocity alongside range, providing a motion cue unavailable in conventional time-of-flight sensors. Exploiting this signal at long range remains understudied. We present an FMCW LiDAR dataset of 575 sequences (57.5K frames) with over 8 million annotated 3D boxes across 16 detection classes and per-point labels across 24 semantic classes, captured by six commercial FMCW LiDAR sensors and six paired 4K cameras across eight Bay Area cities, including 237 nighttime sequences, with annotations extending to 400m. We define a benchmark with three tasks: 3D object detection, scene flow estimation, and semantic segmentation. Detection and scene flow are evaluated across three range bins to 400m, with a public evaluation server. We explore the impact of Doppler measurements on flagship recognition tasks, and find significant improvements up to 2X in detection AP of far-away vehicles and pedestrians, particularly in low-latency single-frame settings. We similarly find scene flow accuracy is significantly improved with Doppler measurements across all ranges. Our dataset and benchmark have been publicly released at https://scenes.aeva.com.", "arxiv_id": "2609.33230", "arxiv_url": "https://arxiv.org/abs/2609.33230", "authors": ["Gautham Narayan Narasimhan", "Heethesh Vhavle", "Kumar Bhargav Viswanatha", "James Reuther", "Deva Ramanan"], "brief": "\u8bba\u6587\u53d1\u5e03 AevaScenes\uff1a\u4e00\u4e2a\u9762\u5411\u957f\u8ddd\u79bb\u611f\u77e5\u7684 FMCW LiDAR \u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u5305\u542b 57.5K \u5e27\u3001800\u4e07+ 3D\u6846\u3001\u9010\u70b9\u8bed\u4e49\u6807\u7b7e\uff0c\u5e76\u8986\u76d6\u6700\u8fdc 400 \u7c73\u3002\u5176\u6838\u5fc3\u5173\u6ce8 FMCW LiDAR \u7684\u9010\u70b9\u5f84\u5411\u591a\u666e\u52d2\u901f\u5ea6\u5bf9\u68c0\u6d4b\u3001\u573a\u666f\u6d41\u548c\u8bed\u4e49\u5206\u5272\u7684\u4ef7\u503c\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33230", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6570\u636e\u7531 6 \u4e2a\u5546\u7528 FMCW LiDAR \u548c 6 \u4e2a\u914d\u5bf9 4K \u76f8\u673a\u91c7\u96c6\uff0c\u8986\u76d6\u6e7e\u533a 8 \u4e2a\u57ce\u5e02\u3001575 \u6bb5\u5e8f\u5217\uff0c\u5176\u4e2d 237 \u6bb5\u4e3a\u591c\u95f4\u573a\u666f\u3002", "\u63d0\u4f9b 16 \u7c7b 3D\u76ee\u6807\u68c0\u6d4b\u6807\u6ce8\u4e0e 24 \u7c7b\u9010\u70b9\u8bed\u4e49\u6807\u6ce8\uff0c\u5e76\u8bbe\u7f6e 3D\u68c0\u6d4b\u3001\u573a\u666f\u6d41\u4f30\u8ba1\u3001\u8bed\u4e49\u5206\u5272\u4e09\u9879\u516c\u5f00\u57fa\u51c6\u3002", "\u5b9e\u9a8c\u663e\u793a\u591a\u666e\u52d2\u4fe1\u606f\u53ef\u663e\u8457\u63d0\u5347\u8fdc\u8ddd\u79bb\u8f66\u8f86\u4e0e\u884c\u4eba\u68c0\u6d4b\uff0c\u8fdc\u8ddd\u68c0\u6d4b AP \u6700\u9ad8\u63d0\u5347\u7ea6 2 \u500d\uff0c\u5e76\u5728\u5404\u8ddd\u79bb\u6bb5\u63d0\u5347\u573a\u666f\u6d41\u7cbe\u5ea6\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u4e09\u7ef4\u611f\u77e5", "\u6570\u636e\u96c6", "\u573a\u666f\u6d41"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33230v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AevaScenes: An FMCW LiDAR Dataset and Benchmark for Long-Range Perception", "tldr": "\u9996\u4e2a\u5927\u89c4\u6a21\u957f\u8dddFMCW LiDAR\u611f\u77e5\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u5e03 AevaScenes\uff1a\u4e00\u4e2a\u9762\u5411\u957f\u8ddd\u79bb\u611f\u77e5\u7684 FMCW LiDAR \u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u5305\u542b 57.5K \u5e27\u3001800\u4e07+ 3D\u6846\u3001\u9010\u70b9\u8bed\u4e49\u6807\u7b7e\uff0c\u5e76\u8986\u76d6\u6700\u8fdc 400 \u7c73\u3002\u5176\u6838\u5fc3\u5173\u6ce8 FMCW LiDAR \u7684\u9010\u70b9\u5f84\u5411\u591a\u666e\u52d2\u901f\u5ea6\u5bf9\u68c0\u6d4b\u3001\u573a\u666f\u6d41\u548c\u8bed\u4e49\u5206\u5272\u7684\u4ef7\u503c\u3002", "why_notable": "FMCW LiDAR \u80fd\u76f4\u63a5\u63d0\u4f9b\u901f\u5ea6\u7ebf\u7d22\uff0c\u4f46\u5176\u5728 400 \u7c73\u7ea7\u957f\u8ddd\u611f\u77e5\u4e2d\u7684\u4f5c\u7528\u6b64\u524d\u7f3a\u4e4f\u7cfb\u7edf\u7814\u7a76\u3002\u8be5\u6570\u636e\u96c6\u89c4\u6a21\u5927\u3001\u6807\u6ce8\u4e30\u5bcc\u3001\u542b\u591c\u95f4\u573a\u666f\u548c\u516c\u5f00\u8bc4\u6d4b\u670d\u52a1\u5668\uff0c\u6709\u671b\u63a8\u52a8\u81ea\u52a8\u9a7e\u9a76\u957f\u8ddd\u611f\u77e5\u4e0e\u8fd0\u52a8\u4f30\u8ba1\u7814\u7a76\u3002"}, {"abstract": "Generative models learn visual structure through denoising, yet their internal states are entangled with both noise level and network depth, making it difficult to obtain a stable visual representation from the generator itself. We introduce RepFlow, which learns such a representation from the generator\u0027s evolving computation and uses it to guide generation. Specifically, a separate timestep-free encoder is trained, through a timestep-conditioned predictor, to recover generator states across depths and noise levels from masked clean images. By excluding the reference noise and masked-out content from the encoder\u0027s input, we encourage the encoder to distill visual information that is recoverable from the visible image context and predictive of generator states. The representation learned from the generator\u0027s evolving states is then fed back to guide and improve the generator, whose updated states provide supervision for further representation learning, forming a reciprocal learning process. This reciprocal process improves multi-step generation and representation quality, as measured by frozen linear probing on ImageNet with latent-space SiT and pixel-space JiT, without an externally pretrained representation teacher. Across the two unconditional settings, FID decreases by $19.2$--$40.8\\%$ relative to native training, while linear-probe accuracy improves by 6.80--10.04 percentage points over the best searched raw generator features. The learned representation also serves as a distributional metric for one-step JiT post-training, extending its role from instance-level alignment to distribution-level supervision.", "arxiv_id": "2609.33217", "arxiv_url": "https://arxiv.org/abs/2609.33217", "authors": ["Weili Zeng", "Feng Tian", "Shengqi Liu", "Yichao Yan"], "brief": "RepFlow\u63d0\u51fa\u4e00\u79cd\u4e92\u60e0\u5b66\u4e60\u6846\u67b6\uff1a\u4ece\u751f\u6210\u5668\u968f\u6df1\u5ea6\u548c\u566a\u58f0\u6c34\u5e73\u6f14\u5316\u7684\u5185\u90e8\u72b6\u6001\u4e2d\u5b66\u4e60\u7a33\u5b9a\u89c6\u89c9\u8868\u5f81\uff0c\u518d\u5c06\u8be5\u8868\u5f81\u53cd\u9988\u7ed9\u751f\u6210\u5668\u4ee5\u63d0\u5347\u751f\u6210\u8d28\u91cf\u3002\u5b83\u65e0\u9700\u5916\u90e8\u9884\u8bad\u7ec3\u8868\u5f81\u6559\u5e08\uff0c\u5728\u6f5c\u7a7a\u95f4SiT\u548c\u50cf\u7d20\u7a7a\u95f4JiT\u4e0a\u540c\u65f6\u6539\u8fdb\u751f\u6210\u4e0e\u7ebf\u6027\u63a2\u6d4b\u8868\u5f81\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33217", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bad\u7ec3\u4e00\u4e2a\u4e0d\u4f9d\u8d56\u65f6\u95f4\u6b65\u7684\u7f16\u7801\u5668\uff0c\u901a\u8fc7\u65f6\u95f4\u6b65\u6761\u4ef6\u9884\u6d4b\u5668\uff0c\u4ece\u906e\u6321\u540e\u7684\u5e72\u51c0\u56fe\u50cf\u4e2d\u6062\u590d\u751f\u6210\u5668\u5728\u4e0d\u540c\u6df1\u5ea6\u4e0e\u566a\u58f0\u6c34\u5e73\u4e0b\u7684\u72b6\u6001\u3002", "\u7f16\u7801\u5668\u8f93\u5165\u6392\u9664\u53c2\u8003\u566a\u58f0\u548c\u88ab\u906e\u6321\u5185\u5bb9\uff0c\u4fc3\u4f7f\u5176\u63d0\u70bc\u53ef\u7531\u53ef\u89c1\u4e0a\u4e0b\u6587\u6062\u590d\u3001\u4e14\u80fd\u9884\u6d4b\u751f\u6210\u5668\u72b6\u6001\u7684\u89c6\u89c9\u4fe1\u606f\u3002", "\u5728\u65e0\u6761\u4ef6\u751f\u6210\u8bbe\u7f6e\u4e2d\uff0c\u76f8\u6bd4\u539f\u751f\u8bad\u7ec3FID\u76f8\u5bf9\u4e0b\u964d19.2%--40.8%\uff0cImageNet\u51bb\u7ed3\u7ebf\u6027\u63a2\u6d4b\u51c6\u786e\u7387\u8f83\u6700\u4f73\u539f\u59cb\u751f\u6210\u5668\u7279\u5f81\u63d0\u53476.80--10.04\u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u751f\u6210\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "Flow\u6a21\u578b", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33217v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RepFlow: Reciprocal Supervision Improves Generation and Representation in Flow Models", "tldr": "\u751f\u6210\u4e0e\u8868\u5f81\u76f8\u4e92\u76d1\u7763\u63d0\u5347Flow\u6a21\u578b", "upvotes": 0, "what_it_is": "RepFlow\u63d0\u51fa\u4e00\u79cd\u4e92\u60e0\u5b66\u4e60\u6846\u67b6\uff1a\u4ece\u751f\u6210\u5668\u968f\u6df1\u5ea6\u548c\u566a\u58f0\u6c34\u5e73\u6f14\u5316\u7684\u5185\u90e8\u72b6\u6001\u4e2d\u5b66\u4e60\u7a33\u5b9a\u89c6\u89c9\u8868\u5f81\uff0c\u518d\u5c06\u8be5\u8868\u5f81\u53cd\u9988\u7ed9\u751f\u6210\u5668\u4ee5\u63d0\u5347\u751f\u6210\u8d28\u91cf\u3002\u5b83\u65e0\u9700\u5916\u90e8\u9884\u8bad\u7ec3\u8868\u5f81\u6559\u5e08\uff0c\u5728\u6f5c\u7a7a\u95f4SiT\u548c\u50cf\u7d20\u7a7a\u95f4JiT\u4e0a\u540c\u65f6\u6539\u8fdb\u751f\u6210\u4e0e\u7ebf\u6027\u63a2\u6d4b\u8868\u5f81\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7f13\u89e3\u4e86\u751f\u6210\u6a21\u578b\u5185\u90e8\u7279\u5f81\u53d7\u566a\u58f0\u6b65\u4e0e\u7f51\u7edc\u6df1\u5ea6\u7ea0\u7f20\u3001\u96be\u4ee5\u76f4\u63a5\u7528\u4f5c\u7a33\u5b9a\u8868\u5f81\u7684\u95ee\u9898\uff0c\u5e76\u5c55\u793a\u4e86\u751f\u6210\u8d28\u91cf\u4e0e\u8868\u5f81\u8d28\u91cf\u53ef\u4ee5\u5728\u540c\u4e00Flow\u6a21\u578b\u4e2d\u4e92\u76f8\u4fc3\u8fdb\uff0c\u5bf9\u7edf\u4e00\u751f\u6210\u6a21\u578b\u548c\u89c6\u89c9\u8868\u5f81\u5b66\u4e60\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Repetition is closely associated with memorization in generative models, but how other training images affect the retention and copying of targets remains unclear. We study this question in class-conditioned flow matching, where images outside the target set form the background. At fixed target repetition and same-class background row count, replacing repeated same-class images with distinct images reduces the target extraction rate from 80.7% to 18.0%. To explain this effect, we develop a paired-trajectory framework that isolates target-induced parameter displacement and the background gradient response to it. This response has an exact path-integrated curvature representation, connecting background loss geometry to target learning. Reciprocal response transfer between repeated and distinct backgrounds changes target retention and copying in both directions, establishing the response\u0027s causal role. After target removal, the response correction parallel to the target-induced displacement preserves approximately 90% of the copying effects of full response transfer. Directly scaling the displacement also changes copying without further training. The post-removal copying effects of reciprocal transfer are reproduced across datasets and architectures. Together, these results identify the background gradient response as a mechanism through which same-class training data shape the retention of target learning and the reproduction of target images.", "arxiv_id": "2609.33210", "arxiv_url": "https://arxiv.org/abs/2609.33210", "authors": ["Xuanhua Yin", "Boyu Wei", "Shuyi Zhang", "Shunqi Mao", "Chuanzhi Xu", "Weidong Cai"], "brief": "\u672c\u6587\u7814\u7a76\u7c7b\u6761\u4ef6 Flow Matching \u4e2d\uff0c\u76ee\u6807\u56fe\u50cf\u91cd\u590d\u8bad\u7ec3\u65f6\uff0c\u5176\u4ed6\u540c\u7c7b\u80cc\u666f\u56fe\u50cf\u5982\u4f55\u5f71\u54cd\u76ee\u6807\u7684\u4fdd\u7559\u4e0e\u590d\u5236\u3002\u4f5c\u8005\u63d0\u51fa\u6210\u5bf9\u8f68\u8ff9\u5206\u6790\u6846\u67b6\uff0c\u8bc1\u660e\u80cc\u666f\u68af\u5ea6\u5bf9\u76ee\u6807\u8bf1\u5bfc\u53c2\u6570\u4f4d\u79fb\u7684\u54cd\u5e94\u662f\u5f71\u54cd\u8bb0\u5fc6\u5316\u7684\u5173\u952e\u673a\u5236\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33210", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728\u76ee\u6807\u91cd\u590d\u6b21\u6570\u548c\u540c\u7c7b\u80cc\u666f\u6570\u91cf\u56fa\u5b9a\u65f6\uff0c\u7528\u4e0d\u540c\u56fe\u50cf\u66ff\u6362\u91cd\u590d\u540c\u7c7b\u80cc\u666f\uff0c\u53ef\u5c06\u76ee\u6807\u63d0\u53d6\u7387\u4ece80.7%\u964d\u81f318.0%", "\u63d0\u51fa\u6210\u5bf9\u8f68\u8ff9\u6846\u67b6\uff0c\u5206\u79bb\u76ee\u6807\u8bf1\u5bfc\u7684\u53c2\u6570\u4f4d\u79fb\u4e0e\u80cc\u666f\u68af\u5ea6\u54cd\u5e94\uff0c\u5e76\u7ed9\u51fa\u8def\u5f84\u79ef\u5206\u66f2\u7387\u8868\u793a", "\u901a\u8fc7\u80cc\u666f\u54cd\u5e94\u7684\u53cc\u5411\u8fc1\u79fb\u3001\u76ee\u6807\u79fb\u9664\u540e\u6821\u6b63\u548c\u76f4\u63a5\u7f29\u653e\u53c2\u6570\u4f4d\u79fb\uff0c\u9a8c\u8bc1\u5176\u5bf9\u590d\u5236\u884c\u4e3a\u5177\u6709\u56e0\u679c\u4f5c\u7528"], "keywords": ["\u751f\u6210\u6a21\u578b", "Flow Matching", "\u8bb0\u5fc6\u5316", "\u8bad\u7ec3\u52a8\u529b\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33210v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Background Gradients Shape Memorization in Flow Matching", "tldr": "\u80cc\u666f\u6837\u672c\u68af\u5ea6\u54cd\u5e94\u51b3\u5b9a\u751f\u6210\u6a21\u578b\u8bb0\u5fc6\u590d\u5236", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u7c7b\u6761\u4ef6 Flow Matching \u4e2d\uff0c\u76ee\u6807\u56fe\u50cf\u91cd\u590d\u8bad\u7ec3\u65f6\uff0c\u5176\u4ed6\u540c\u7c7b\u80cc\u666f\u56fe\u50cf\u5982\u4f55\u5f71\u54cd\u76ee\u6807\u7684\u4fdd\u7559\u4e0e\u590d\u5236\u3002\u4f5c\u8005\u63d0\u51fa\u6210\u5bf9\u8f68\u8ff9\u5206\u6790\u6846\u67b6\uff0c\u8bc1\u660e\u80cc\u666f\u68af\u5ea6\u5bf9\u76ee\u6807\u8bf1\u5bfc\u53c2\u6570\u4f4d\u79fb\u7684\u54cd\u5e94\u662f\u5f71\u54cd\u8bb0\u5fc6\u5316\u7684\u5173\u952e\u673a\u5236\u3002", "why_notable": "\u8bba\u6587\u4ece\u8bad\u7ec3\u52a8\u529b\u5b66\u548c\u635f\u5931\u51e0\u4f55\u89d2\u5ea6\u89e3\u91ca\u4e86\u751f\u6210\u6a21\u578b\u8bb0\u5fc6\u5316\u4e0d\u53ea\u7531\u76ee\u6807\u91cd\u590d\u51b3\u5b9a\uff0c\u8fd8\u53d7\u540c\u7c7b\u80cc\u666f\u6570\u636e\u7684\u68af\u5ea6\u54cd\u5e94\u5851\u9020\uff0c\u4e3a\u7406\u89e3\u548c\u7f13\u89e3\u9690\u79c1\u6cc4\u9732\u5f0f\u590d\u5236\u63d0\u4f9b\u4e86\u673a\u5236\u6027\u8bc1\u636e\u3002"}, {"abstract": "World-Action Models (WAMs) offer visual foresight for robotic manipulation, but pixel-space models repeatedly reconstruct entire future scenes, incurring high computational cost and spatio-temporal redundancy. In physical manipulation, consecutive frames often share most of their visual context; the changes between them are what an action policy needs to anticipate. We introduce DeltaWAM, a change-centric WAM that makes a compact delta token the unit of future prediction. Each token is a single vector encoding changes between consecutive dense DINO feature maps. DeltaWAM builds on DeltaWorld, a latent world model pretrained on large-scale videos, to autoregressively predict one delta token per future frame. A flow-matching action expert then conditions on the predicted transitions and current DINO features, which serve as spatial anchors, to generate action chunks. Trained for 256 GPU hours on two H100 GPUs, DeltaWAM has 0.725B parameters and achieves 92.8% average success on LIBERO. It also shows robust generalization under procedural perturbations on LIBERO-Pro. Inference takes 142.1 ms per action chunk with 3.86 GB peak memory.", "arxiv_id": "2609.33177", "arxiv_url": "https://arxiv.org/abs/2609.33177", "authors": ["Tianyun Jiang", "Wenrui Bao", "Bingxin Xu", "Yu Tian", "Yuzhang Shang"], "brief": "\u8bba\u6587\u63d0\u51fa DeltaWAM\uff0c\u4e00\u79cd\u4ee5\u76f8\u90bb\u5e27\u89c6\u89c9\u53d8\u5316\u4e3a\u6838\u5fc3\u7684\u673a\u5668\u4eba World-Action Model\u3002\u5b83\u7528\u5355\u4e2a delta token \u8868\u793a\u8fde\u7eed DINO \u7279\u5f81\u56fe\u4e4b\u95f4\u7684\u53d8\u5316\uff0c\u5e76\u81ea\u56de\u5f52\u9884\u6d4b\u672a\u6765\u53d8\u5316\uff0c\u518d\u751f\u6210\u52a8\u4f5c\u7247\u6bb5\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33177", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u518d\u91cd\u5efa\u5b8c\u6574\u672a\u6765\u56fe\u50cf\uff0c\u800c\u662f\u9884\u6d4b\u6bcf\u5e27\u4e00\u4e2a\u7d27\u51d1 delta token\uff0c\u51cf\u5c11\u65f6\u7a7a\u5197\u4f59\u4e0e\u8ba1\u7b97\u5f00\u9500", "\u57fa\u4e8e\u5927\u89c4\u6a21\u89c6\u9891\u9884\u8bad\u7ec3\u7684 DeltaWorld\uff0c\u5e76\u7ed3\u5408 flow-matching action expert \u751f\u6210\u673a\u5668\u4eba\u64cd\u4f5c\u52a8\u4f5c", "0.725B \u53c2\u6570\u3001256 GPU \u5c0f\u65f6\u8bad\u7ec3\uff0c\u5728 LIBERO \u4e0a\u8fbe\u5230 92.8% \u5e73\u5747\u6210\u529f\u7387\uff0c\u63a8\u7406\u6bcf\u4e2a\u52a8\u4f5c\u7247\u6bb5 142.1 ms\u3001\u5cf0\u503c\u663e\u5b58 3.86 GB"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u9884\u6d4b", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33177v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DeltaWAM: Change-Centric Visual Foresight via Delta Tokens for an Efficient World-Action Model", "tldr": "\u7528\u53d8\u5316\u4ee4\u724c\u9ad8\u6548\u9884\u6d4b\u673a\u5668\u4eba\u89c6\u89c9\u672a\u6765", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DeltaWAM\uff0c\u4e00\u79cd\u4ee5\u76f8\u90bb\u5e27\u89c6\u89c9\u53d8\u5316\u4e3a\u6838\u5fc3\u7684\u673a\u5668\u4eba World-Action Model\u3002\u5b83\u7528\u5355\u4e2a delta token \u8868\u793a\u8fde\u7eed DINO \u7279\u5f81\u56fe\u4e4b\u95f4\u7684\u53d8\u5316\uff0c\u5e76\u81ea\u56de\u5f52\u9884\u6d4b\u672a\u6765\u53d8\u5316\uff0c\u518d\u751f\u6210\u52a8\u4f5c\u7247\u6bb5\u3002", "why_notable": "\u5c06\u89c6\u89c9\u524d\u77bb\u4ece\u50cf\u7d20\u7ea7\u5168\u573a\u666f\u751f\u6210\u8f6c\u5411\u53d8\u5316\u5efa\u6a21\uff0c\u4e3a\u673a\u5668\u4eba\u64cd\u4f5c\u63d0\u4f9b\u66f4\u9ad8\u6548\u3001\u53ef\u6cdb\u5316\u7684\u4e16\u754c-\u52a8\u4f5c\u5efa\u6a21\u8def\u5f84\uff0c\u5728\u6027\u80fd\u548c\u63a8\u7406\u6210\u672c\u4e4b\u95f4\u53d6\u5f97\u8f83\u597d\u5e73\u8861\u3002"}, {"abstract": "World-Action models (WAMs) trained on static demonstrations often fail to manipulate moving targets even when they possess the required manipulation skills. We attribute this failure to target-response collapse: as execution advances, the policy becomes increasingly biased toward the learned continuation of its ongoing behavior and less responsive to target relocation. To bridge the gap between what the model has learned and what it can generate from the current context, we formulate dynamic manipulation as counterfactual planning by decoupling the context used for plan generation from the physical state used for execution. Our framework, Dynamic Predictive Planning (DPP), first uses the WAM\u0027s predictive rollout to estimate when an interaction is expected to occur, and combines this timing estimate with observed target motion to predict the target\u0027s future interaction position. DPP then constructs a counterfactual observation that places this predicted target position in a familiar robot context, allowing the model to invoke an existing manipulation skill rather than generate a recovery behavior from an unfamiliar robot-target configuration. The resulting plan is connected to the robot\u0027s actual state during execution. DPP enables real-time dynamic manipulation on a single consumer GPU without additional training on dynamic data. Experiments in simulation and on a real robot demonstrate consistent improvements across diverse target motions, with simulation performance surpassing all evaluated baselines, including methods additionally trained on dynamic data. Project page: https://methoder00.github.io/DPP/", "arxiv_id": "2609.33172", "arxiv_url": "https://arxiv.org/abs/2609.33172", "authors": ["Sunwoo Park", "Wonbin Lee", "Seonghyun Jin", "Youngmin Kim", "Jangho Park", "Jong Chul Ye"], "brief": "\u8bba\u6587\u63d0\u51fa Dynamic Predictive Planning\uff08DPP\uff09\uff0c\u628a\u52a8\u6001\u64cd\u63a7\u8f6c\u5316\u4e3a\u53cd\u4e8b\u5b9e\u89c4\u5212\u95ee\u9898\u3002\u5b83\u5229\u7528 World-Action Model \u7684\u9884\u6d4b\u5c55\u5f00\u4f30\u8ba1\u4ea4\u4e92\u65f6\u673a\u548c\u76ee\u6807\u672a\u6765\u4f4d\u7f6e\uff0c\u518d\u5728\u719f\u6089\u7684\u673a\u5668\u4eba\u4e0a\u4e0b\u6587\u4e2d\u751f\u6210\u64cd\u63a7\u8ba1\u5212\uff0c\u5e76\u8fde\u63a5\u5230\u771f\u5b9e\u6267\u884c\u72b6\u6001\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33172", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u9759\u6001\u6f14\u793a\u8bad\u7ec3\u7684 WAM \u5728\u52a8\u6001\u76ee\u6807\u4e0a\u5931\u6548\u6e90\u4e8e\u201c\u76ee\u6807\u54cd\u5e94\u584c\u7f29\u201d\uff1a\u6267\u884c\u4e2d\u7b56\u7565\u8d8a\u6765\u8d8a\u4f9d\u8d56\u5df2\u751f\u6210\u884c\u4e3a\uff0c\u96be\u4ee5\u53ca\u65f6\u54cd\u5e94\u76ee\u6807\u79fb\u52a8", "DPP \u89e3\u8026\u201c\u7528\u4e8e\u751f\u6210\u8ba1\u5212\u7684\u4e0a\u4e0b\u6587\u201d\u548c\u201c\u7528\u4e8e\u6267\u884c\u7684\u7269\u7406\u72b6\u6001\u201d\uff0c\u901a\u8fc7\u6784\u9020\u53cd\u4e8b\u5b9e\u89c2\u6d4b\u8c03\u7528\u5df2\u6709\u9759\u6001\u64cd\u63a7\u6280\u80fd", "\u65e0\u9700\u52a8\u6001\u6570\u636e\u518d\u8bad\u7ec3\uff0c\u53ef\u5728\u5355\u5f20\u6d88\u8d39\u7ea7 GPU \u4e0a\u5b9e\u65f6\u8fd0\u884c\uff1b\u4eff\u771f\u548c\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u5747\u4f18\u4e8e\u591a\u79cd\u57fa\u7ebf\uff0c\u4eff\u771f\u4e2d\u751a\u81f3\u8d85\u8fc7\u4f7f\u7528\u52a8\u6001\u6570\u636e\u8bad\u7ec3\u7684\u65b9\u6cd5"], "keywords": ["\u673a\u5668\u4eba\u64cd\u63a7", "\u4e16\u754c\u6a21\u578b", "\u89c4\u5212", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33172v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Dynamic Manipulation with World-Action Models via Counterfactual Planning", "tldr": "\u7528\u53cd\u4e8b\u5b9e\u89c4\u5212\u8ba9\u9759\u6001\u6280\u80fd\u64cd\u63a7\u52a8\u6001\u76ee\u6807", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Dynamic Predictive Planning\uff08DPP\uff09\uff0c\u628a\u52a8\u6001\u64cd\u63a7\u8f6c\u5316\u4e3a\u53cd\u4e8b\u5b9e\u89c4\u5212\u95ee\u9898\u3002\u5b83\u5229\u7528 World-Action Model \u7684\u9884\u6d4b\u5c55\u5f00\u4f30\u8ba1\u4ea4\u4e92\u65f6\u673a\u548c\u76ee\u6807\u672a\u6765\u4f4d\u7f6e\uff0c\u518d\u5728\u719f\u6089\u7684\u673a\u5668\u4eba\u4e0a\u4e0b\u6587\u4e2d\u751f\u6210\u64cd\u63a7\u8ba1\u5212\uff0c\u5e76\u8fde\u63a5\u5230\u771f\u5b9e\u6267\u884c\u72b6\u6001\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5c55\u793a\u4e86\u65e0\u9700\u989d\u5916\u52a8\u6001\u6570\u636e\u8bad\u7ec3\uff0c\u4e5f\u80fd\u628a\u9759\u6001\u6f14\u793a\u4e2d\u5b66\u5230\u7684\u64cd\u63a7\u6280\u80fd\u8fc1\u79fb\u5230\u52a8\u6001\u76ee\u6807\u573a\u666f\uff0c\u63d0\u5347\u4e86\u4e16\u754c\u6a21\u578b/\u52a8\u4f5c\u6a21\u578b\u5728\u771f\u5b9e\u673a\u5668\u4eba\u52a8\u6001\u4ea4\u4e92\u4e2d\u7684\u5b9e\u7528\u6027\u3002"}, {"abstract": "Co-training offers a straightforward way to build a multi-task vision-language-action (VLA) policy, but can fall short of the performance achieved by training each task independently. The challenge is to retain these task-specific gains in a multi-task policy without joint post-training. Combining independently trained experts through model merging is a natural approach, yet strong individual experts do not necessarily yield a strong merged policy. We identify one source of this incompatibility: task-specific changes to the action interface, comprising action normalization and the action encoder and decoder. We propose PolicyWeave, combining merge-compatible post-training with context-guided sparse merging. During post-training, all experts retain the common base policy\u0027s action interface, while task adaptation is restricted to LoRA updates in the hidden layers of the action model. This makes the experts more compatible with existing model merging methods. However, merging all experts can still introduce interference from unrelated tasks at deployment. PolicyWeave scores each expert\u0027s LoRA updates using the initial visual-language context, determines the expert set through leave-one-layer-out ranking stability, and forms a sparse weighted merge of the selected updates that remains fixed for current task. We evaluate PolicyWeave with GR00T N1.5 on 18 RoboCasa365 tasks, using only 10% of the target-task demonstrations for supervised fine-tuning (SFT). Preserving the shared action interface raises the average success rate across four static merging methods from 17.0% to 52.8%. PolicyWeave achieves 64.7% success with these SFT experts and 74.1% after task-specific reinforcement learning (RL), compared with 60.7% for joint RL. Further evaluations on LIBERO-10 and an AgileX Piper arm support the deployment of independently learned skills in long-horizon and real-world manipulation.", "arxiv_id": "2609.33125", "arxiv_url": "https://arxiv.org/abs/2609.33125", "authors": ["Zhizhen Zhang", "Yuxia Fu", "Zijian Wang", "Helen Huang", "Yadan Luo"], "brief": "\u8bba\u6587\u63d0\u51fa PolicyWeave\uff0c\u7528\u5171\u4eab\u52a8\u4f5c\u63a5\u53e3\u7edf\u4e00\u72ec\u7acb\u8bad\u7ec3\u7684 VLA \u673a\u5668\u4eba\u4e13\u5bb6\uff0c\u5e76\u901a\u8fc7\u4e0a\u4e0b\u6587\u5f15\u5bfc\u7684\u7a00\u758f LoRA \u5408\u5e76\u5f62\u6210\u591a\u4efb\u52a1\u7b56\u7565\u3002\u6838\u5fc3\u53d1\u73b0\u662f\u4efb\u52a1\u7279\u5b9a\u7684\u52a8\u4f5c\u5f52\u4e00\u5316\u4e0e\u52a8\u4f5c\u7f16\u89e3\u7801\u5668\u4f1a\u7834\u574f\u4e13\u5bb6\u95f4\u53ef\u5408\u5e76\u6027\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33125", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u540e\u8bad\u7ec3\u9636\u6bb5\u4fdd\u7559\u57fa\u7840\u7b56\u7565\u7684\u5171\u4eab\u52a8\u4f5c\u63a5\u53e3\uff0c\u4ec5\u5728\u52a8\u4f5c\u6a21\u578b\u9690\u85cf\u5c42\u4f7f\u7528 LoRA \u8fdb\u884c\u4efb\u52a1\u9002\u914d\uff0c\u4ee5\u63d0\u5347\u6a21\u578b\u5408\u5e76\u517c\u5bb9\u6027\u3002", "\u90e8\u7f72\u65f6\u6839\u636e\u521d\u59cb\u89c6\u89c9-\u8bed\u8a00\u4e0a\u4e0b\u6587\u4e3a\u5404\u4e13\u5bb6 LoRA \u6253\u5206\uff0c\u5e76\u901a\u8fc7\u9010\u5c42\u7559\u4e00\u7684\u6392\u5e8f\u7a33\u5b9a\u6027\u9009\u62e9\u76f8\u5173\u4e13\u5bb6\uff0c\u907f\u514d\u65e0\u5173\u4efb\u52a1\u5e72\u6270\u3002", "\u5728 RoboCasa365 \u768418\u4e2a\u4efb\u52a1\u4e0a\uff0c\u4ec5\u752810%\u76ee\u6807\u4efb\u52a1\u793a\u8303\uff0c\u9759\u6001\u5408\u5e76\u5e73\u5747\u6210\u529f\u7387\u753117.0%\u63d0\u5347\u81f352.8%\uff1bPolicyWeave \u8fbe\u523064.7%\uff0c\u7ed3\u5408\u4efb\u52a1\u7279\u5b9aRL\u540e\u8fbe74.1%\uff0c\u4f18\u4e8e\u8054\u5408RL\u768460.7%\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u6a21\u578b\u5408\u5e76", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33125v1", "published_at": "2026-09-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Train Together or Merge Later? Unifying VLA Experts via a Shared Action Interface", "tldr": "PolicyWeave\u7a00\u758f\u5408\u5e76\u591a\u4efb\u52a1VLA\u4e13\u5bb6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PolicyWeave\uff0c\u7528\u5171\u4eab\u52a8\u4f5c\u63a5\u53e3\u7edf\u4e00\u72ec\u7acb\u8bad\u7ec3\u7684 VLA \u673a\u5668\u4eba\u4e13\u5bb6\uff0c\u5e76\u901a\u8fc7\u4e0a\u4e0b\u6587\u5f15\u5bfc\u7684\u7a00\u758f LoRA \u5408\u5e76\u5f62\u6210\u591a\u4efb\u52a1\u7b56\u7565\u3002\u6838\u5fc3\u53d1\u73b0\u662f\u4efb\u52a1\u7279\u5b9a\u7684\u52a8\u4f5c\u5f52\u4e00\u5316\u4e0e\u52a8\u4f5c\u7f16\u89e3\u7801\u5668\u4f1a\u7834\u574f\u4e13\u5bb6\u95f4\u53ef\u5408\u5e76\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u591a\u4efb\u52a1\u673a\u5668\u4eba VLA \u7b56\u7565\u63d0\u4f9b\u4e86\u201c\u72ec\u7acb\u5b66\u4e60\u3001\u540e\u671f\u7ec4\u5408\u201d\u7684\u5b9e\u7528\u8def\u5f84\uff0c\u7f13\u89e3\u4e86\u8054\u5408\u8bad\u7ec3\u6210\u672c\u9ad8\u3001\u4e13\u5bb6\u5408\u5e76\u4e92\u76f8\u5e72\u6270\u7684\u95ee\u9898\uff0c\u5e76\u5728\u4eff\u771f\u3001\u957f\u65f6\u7a0b\u4efb\u52a1\u548c\u771f\u5b9e\u673a\u68b0\u81c2\u4e0a\u9a8c\u8bc1\u4e86\u53ef\u90e8\u7f72\u6027\u3002"}, {"abstract": "Personalized large language models are often expected to follow explicit style instructions, yet we find that such instructions can undermine the user-specific characteristics that per
