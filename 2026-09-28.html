u606f\u4e3b\u8981\u4fee\u8fb9\u754c\uff0c\u533a\u57df\u6d88\u606f\u4e3b\u8981\u4fee\u975e\u8fb9\u754c\u9519\u8bef\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33996", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u5206\u5272", "\u6761\u4ef6\u968f\u673a\u573a", "\u63a9\u7801\u7ec6\u5316", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33996v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "UnfoldCRF: Structured Mask Refinement with Image-Conditioned Latent Regions", "tldr": "UnfoldCRF \u5c06\u5206\u5272\u63a9\u7801\u7ec6\u5316\u5efa\u6a21\u4e3a\u5e26\u50cf\u7d20\u6807\u7b7e\u548c\u6f5c\u5728\u533a\u57df\u53d8\u91cf\u7684\u6761\u4ef6\u968f\u673a\u573a\uff0c\u901a\u8fc7\u5c55\u5f00\u963b\u5c3c\u5747\u503c\u573a\u63a8\u7406\uff0c\u5f15\u5165\u6821\u6b63\u4e00\u5143\u9879\u3001\u5c40\u90e8\u6210\u5bf9\u4ea4\u4e92\u548c\u56fe\u50cf\u6761\u4ef6\u533a\u57df\u4e00\u81f4\u6027\u3002\u76f8\u6bd4\u540c\u9884\u7b97\u9ed1\u76d2\u5faa\u73af\u7ec6\u5316\u5668\uff0c\u5b83\u5728 COD10K \u548c\u8de8\u6570\u636e\u96c6\u3001\u8de8\u63a9\u7801\u6e90\u8bbe\u7f6e\u4e0b\u53d6\u5f97\u66f4\u7a33\u5b9a\u63d0\u5347\uff0c\u5e76\u5728\u672a\u89c1\u8fc7\u7684\u63a9\u7801\u751f\u6210\u5668\u4e0a\u6cdb\u5316\u66f4\u597d\uff1b\u5206\u6790\u663e\u793a\u6210\u5bf9\u6d88\u606f\u4e3b\u8981\u4fee\u8fb9\u754c\uff0c\u533a\u57df\u6d88\u606f\u4e3b\u8981\u4fee\u975e\u8fb9\u754c\u9519\u8bef\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Weed detection is an important component of precision agriculture, enabling site-specific weed management and reducing unnecessary herbicide use. Although deep learning methods have achieved strong results for crop and weed detection, many studies rely on single-dataset evaluation, making it difficult to assess robustness across different agricultural domains. This paper presents a multi-dataset benchmark of deep object detectors for weed detection in precision agriculture, with a focused evaluation of YOLO26 models. We evaluate nano, small, and medium variants on seven public weed-detection datasets covering different crops, weed species, field conditions, acquisition setups, and annotation protocols. The models are compared in terms of detection accuracy, model complexity, inference latency, FPS, and model size. In addition to in-dataset evaluation, we investigate cross-domain generalization using a unified one-class weed setup and evaluate multi-source training using the combined training subsets from all datasets. The results show that YOLO26 achieves strong in-dataset performance, with YOLO26m obtaining the highest average accuracy and YOLO26s providing the best practical accuracy-efficiency trade-off. However, cross-domain performance decreases substantially, with YOLO26s dropping from an average in-domain mAP$_{50:95}$ of 0.603 to 0.148 in the off-domain setting. Multi-source training improves performance on several datasets, but does not fully eliminate domain shift. Overall, the benchmark highlights the importance of dataset diversity, domain similarity, and target-domain adaptation for robust weed detection in real-world precision agriculture applications.", "arxiv_id": "2609.33991", "arxiv_url": "https://arxiv.org/abs/2609.33991", "authors": ["Hristina Zdraveska", "Vlatko Spasev", "Ivica Dimitrovski", "Ivan Kitanovski", "Petre Lameski"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411\u7cbe\u51c6\u519c\u4e1a\u6742\u8349\u68c0\u6d4b\u7684\u591a\u6570\u636e\u96c6\u57fa\u51c6\uff0c\u7cfb\u7edf\u8bc4\u4f30 YOLO26 \u7684 nano\u3001small\u3001medium \u7248\u672c\u57287\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u4e0a\u7684\u51c6\u786e\u7387\u3001\u901f\u5ea6\u548c\u6a21\u578b\u89c4\u6a21\u3002\u7ed3\u679c\u663e\u793a YOLO26m \u7cbe\u5ea6\u6700\u9ad8\u3001YOLO26s \u5728\u7cbe\u5ea6\u4e0e\u6548\u7387\u95f4\u6700\u5747\u8861\uff0c\u4f46\u8de8\u57df\u68c0\u6d4b\u6027\u80fd\u663e\u8457\u4e0b\u964d\uff0c\u591a\u6e90\u8bad\u7ec3\u53ea\u80fd\u90e8\u5206\u7f13\u89e3\u57df\u504f\u79fb\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33991", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u7cbe\u51c6\u519c\u4e1a", "YOLO", "\u57df\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33991v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Multi-Dataset Benchmark of YOLO-Based Weed Detection in Precision Agriculture", "tldr": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411\u7cbe\u51c6\u519c\u4e1a\u6742\u8349\u68c0\u6d4b\u7684\u591a\u6570\u636e\u96c6\u57fa\u51c6\uff0c\u7cfb\u7edf\u8bc4\u4f30 YOLO26 \u7684 nano\u3001small\u3001medium \u7248\u672c\u57287\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u4e0a\u7684\u51c6\u786e\u7387\u3001\u901f\u5ea6\u548c\u6a21\u578b\u89c4\u6a21\u3002\u7ed3\u679c\u663e\u793a YOLO26m \u7cbe\u5ea6\u6700\u9ad8\u3001YOLO26s \u5728\u7cbe\u5ea6\u4e0e\u6548\u7387\u95f4\u6700\u5747\u8861\uff0c\u4f46\u8de8\u57df\u68c0\u6d4b\u6027\u80fd\u663e\u8457\u4e0b\u964d\uff0c\u591a\u6e90\u8bad\u7ec3\u53ea\u80fd\u90e8\u5206\u7f13\u89e3\u57df\u504f\u79fb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Spatial reasoning is fundamental to general robot intelligence, as it enables robots to complete long-horizon tasks involving multi-object interaction. We introduce Simify, a training-free, test-time framework that performs explicit spatial reasoning via massively parallel physics simulation. From a single RGB-D image of a scene, Simify reconstructs simulation-ready assets leveraging 3D generative models and vision-language models. Then given a task specified by a reward function (e.g., build the tallest tower), Simify launches thousands of parallel rollouts in simulation and performs an evolutionary search to optimize object arrangements, typically converging within seconds. We conduct quantitative experiments on real-robot hardware to demonstrate the ability of our framework to execute complex object rearrangement tasks end-to-end with previously unseen objects. Results show that our framework outperforms prior work on foundation models for spatial reasoning by effectively exploiting large-scale parallel simulation during inference, and also highlight the importance of complete and accurate geometry for successful sim-to-real transfer.", "arxiv_id": "2609.33982", "arxiv_url": "https://arxiv.org/abs/2609.33982", "authors": ["Ivan Kapelyukh", "Yafei Hu", "Ran Gong", "Brandon May", "Tushar Kusnur", "Laura Herlant", "Karl Schmeckpeper", "Edward Johns", "Xiaohan Zhang"], "brief": "\u63d0\u51fa Simify\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6d4b\u8bd5\u65f6\u673a\u5668\u4eba\u7a7a\u95f4\u63a8\u7406\u6846\u67b6\uff1a\u4ece\u5355\u5f20 RGB-D \u56fe\u50cf\u501f\u52a9 3D \u751f\u6210\u6a21\u578b\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u91cd\u5efa\u53ef\u4eff\u771f\u7684\u573a\u666f\u8d44\u4ea7\uff0c\u518d\u901a\u8fc7\u5927\u89c4\u6a21\u5e76\u884c\u7269\u7406\u4eff\u771f\u548c\u8fdb\u5316\u641c\u7d22\u4f18\u5316\u7269\u4f53\u6446\u653e\u3002\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u5904\u7406\u672a\u89c1\u7269\u4f53\u7684\u590d\u6742\u91cd\u6392\u4efb\u52a1\uff0c\u5e76\u4f18\u4e8e\u4ee5\u5f80\u57fa\u4e8e\u57fa\u7840\u6a21\u578b\u7684\u7a7a\u95f4\u63a8\u7406\u65b9\u6cd5\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33982", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u7a7a\u95f4\u63a8\u7406", "\u751f\u6210\u6a21\u578b", "\u4eff\u771f\u5230\u73b0\u5b9e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33982v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Test-Time Spatial Reasoning for Robot Manipulation Using Generative Real-to-Sim", "tldr": "\u63d0\u51fa Simify\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6d4b\u8bd5\u65f6\u673a\u5668\u4eba\u7a7a\u95f4\u63a8\u7406\u6846\u67b6\uff1a\u4ece\u5355\u5f20 RGB-D \u56fe\u50cf\u501f\u52a9 3D \u751f\u6210\u6a21\u578b\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u91cd\u5efa\u53ef\u4eff\u771f\u7684\u573a\u666f\u8d44\u4ea7\uff0c\u518d\u901a\u8fc7\u5927\u89c4\u6a21\u5e76\u884c\u7269\u7406\u4eff\u771f\u548c\u8fdb\u5316\u641c\u7d22\u4f18\u5316\u7269\u4f53\u6446\u653e\u3002\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u5904\u7406\u672a\u89c1\u7269\u4f53\u7684\u590d\u6742\u91cd\u6392\u4efb\u52a1\uff0c\u5e76\u4f18\u4e8e\u4ee5\u5f80\u57fa\u4e8e\u57fa\u7840\u6a21\u578b\u7684\u7a7a\u95f4\u63a8\u7406\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Immersive video communication requires photorealistic, render-efficient, and compact dynamic scene representations. 3D Gaussian Splatting (3DGS) offers a promising representation, but dynamic 3DGS remains difficult to compress due to dense primitives and spatiotemporal redundancy. Anchor-based formulations improve compactness with sparse scaffolds that share geometry and appearance across primitives. However, existing designs often rely on deforming a single canonical scaffold and condition each primitive on its associated anchor in isolation, limiting their ability to handle non-local dynamics and disocclusion while under-exploiting inter-anchor correlations, particularly in motion- or texture-dense regions. To address these limitations, we propose SAGA, a volumetric video codec built upon Sparse Anchor-assisted GAussian splatting representations. SAGA represents dynamic 3D scenes using hierarchically organized sparse 4D anchors, where coordinate-based INR decoders generate fine anchors and Gaussian primitives from inter-anchor interpolations, enabling compact parameter sharing across spatiotemporal structures. For long-range dependencies among unstructured anchors, we further introduce fixed-size memory slots with orthogonality-informed updates for accurate entropy-context modeling. Experiments show that SAGA achieves strong rate-distortion performance against GIFStream, with PSNR BD-rate reductions of 80.39% and 83.94% on Neu3D and MPEG MIV, respectively.", "arxiv_id": "2609.33969", "arxiv_url": "https://arxiv.org/abs/2609.33969", "authors": ["Ge Gao", "Siyue Teng", "Chanqgi Wang", "Fan Zhang", "Nantheera Anantrasirichai", "Jui Chiu Chiang", "Wen-Hsiao Peng", "David Bull"], "brief": "\u8bba\u6587\u63d0\u51fa SAGA\uff0c\u4e00\u79cd\u57fa\u4e8e\u9ad8\u65af\u6cfc\u6e85\u7684\u4f53\u79ef\u89c6\u9891\u538b\u7f29\u65b9\u6cd5\uff0c\u7528\u7a00\u758f\u5206\u5c42 4D \u951a\u70b9\u548c\u5750\u6807 INR \u89e3\u7801\u5668\u5171\u4eab\u65f6\u7a7a\u7ed3\u6784\u53c2\u6570\u3002\u5176\u56fa\u5b9a\u5927\u5c0f\u8bb0\u5fc6\u69fd\u7528\u4e8e\u5efa\u6a21\u975e\u7ed3\u6784\u5316\u951a\u70b9\u7684\u957f\u7a0b\u4f9d\u8d56\uff0c\u5728 Neu3D \u548c MPEG MIV \u4e0a\u76f8\u5bf9 GIFStream \u83b7\u5f97\u7ea6 80% \u4ee5\u4e0a\u7684 PSNR BD-rate \u964d\u4f4e\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33969", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u65af\u6cfc\u6e85", "\u89c6\u9891\u538b\u7f29", "\u795e\u7ecf\u8868\u793a", "\u4f53\u79ef\u89c6\u9891"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33969v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Gaussian Splatting-based Volumetric Video Compression with Sparse 4D Anchors", "tldr": "\u8bba\u6587\u63d0\u51fa SAGA\uff0c\u4e00\u79cd\u57fa\u4e8e\u9ad8\u65af\u6cfc\u6e85\u7684\u4f53\u79ef\u89c6\u9891\u538b\u7f29\u65b9\u6cd5\uff0c\u7528\u7a00\u758f\u5206\u5c42 4D \u951a\u70b9\u548c\u5750\u6807 INR \u89e3\u7801\u5668\u5171\u4eab\u65f6\u7a7a\u7ed3\u6784\u53c2\u6570\u3002\u5176\u56fa\u5b9a\u5927\u5c0f\u8bb0\u5fc6\u69fd\u7528\u4e8e\u5efa\u6a21\u975e\u7ed3\u6784\u5316\u951a\u70b9\u7684\u957f\u7a0b\u4f9d\u8d56\uff0c\u5728 Neu3D \u548c MPEG MIV \u4e0a\u76f8\u5bf9 GIFStream \u83b7\u5f97\u7ea6 80% \u4ee5\u4e0a\u7684 PSNR BD-rate \u964d\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Directional multi-transmitter localization from sparse received-power observations is difficult because the receiver observes only the source-unresolved aggregate field: multiple directional sources superpose, building blockage fragments their visible regions, and stronger sources can mask weaker ones. We present SymNetPro, which retains the dual-task radio-map reconstruction and localization backbone of SymNet and adds two targeted components. First, a sparse line-of-sight (LOS)-aware attention bias injects obstruction-aware spatial relations into selected token interactions. Second, transmitter-drop augmentation recomposes training scenes after removing one sample-supported transmitter, exposing the model to controlled source-cardinality variation. Experiments on directional ray-traced urban environments show substantially lower OSPA than representative localization baselines under extreme sparse sampling, with consistent gains under measurement noise and increasing transmitter count. A transmitter-specific evidence analysis further shows that remaining misses concentrate in regimes where the target contributes little distinguishable power to the aggregate observation.", "arxiv_id": "2609.33964", "arxiv_url": "https://arxiv.org/abs/2609.33964", "authors": ["Lyuzhou Ye", "Heng Fan", "Yan Huang"], "brief": "SymNetPro\u9762\u5411\u7a00\u758f\u63a5\u6536\u529f\u7387\u89c2\u6d4b\u4e0b\u7684\u591a\u65b9\u5411\u53d1\u5c04\u673a\u5b9a\u4f4d\uff0c\u5728SymNet\u7684\u65e0\u7ebf\u7535\u5730\u56fe\u91cd\u5efa\u4e0e\u5b9a\u4f4d\u6846\u67b6\u4e0a\u52a0\u5165LOS\u611f\u77e5\u6ce8\u610f\u529b\u504f\u7f6e\u548c\u53d1\u5c04\u673a\u4e22\u5f03\u589e\u5f3a\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u57ce\u5e02\u5c04\u7ebf\u8ffd\u8e2a\u573a\u666f\u4e2d\u663e\u8457\u964d\u4f4eOSPA\u8bef\u5dee\uff0c\u5e76\u5728\u566a\u58f0\u548c\u53d1\u5c04\u673a\u6570\u91cf\u589e\u52a0\u65f6\u4fdd\u6301\u7a33\u5b9a\u4f18\u52bf\u3002", "categories": ["cs.IT", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33964", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65e0\u7ebf\u5b9a\u4f4d", "\u6ce8\u610f\u529b\u673a\u5236", "\u6570\u636e\u589e\u5f3a", "\u65e0\u7ebf\u7535\u5730\u56fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33964v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SymNetPro: LOS-Aware Directional Multi-Transmitter Localization from Sparse Radio Observations", "tldr": "SymNetPro\u9762\u5411\u7a00\u758f\u63a5\u6536\u529f\u7387\u89c2\u6d4b\u4e0b\u7684\u591a\u65b9\u5411\u53d1\u5c04\u673a\u5b9a\u4f4d\uff0c\u5728SymNet\u7684\u65e0\u7ebf\u7535\u5730\u56fe\u91cd\u5efa\u4e0e\u5b9a\u4f4d\u6846\u67b6\u4e0a\u52a0\u5165LOS\u611f\u77e5\u6ce8\u610f\u529b\u504f\u7f6e\u548c\u53d1\u5c04\u673a\u4e22\u5f03\u589e\u5f3a\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u57ce\u5e02\u5c04\u7ebf\u8ffd\u8e2a\u573a\u666f\u4e2d\u663e\u8457\u964d\u4f4eOSPA\u8bef\u5dee\uff0c\u5e76\u5728\u566a\u58f0\u548c\u53d1\u5c04\u673a\u6570\u91cf\u589e\u52a0\u65f6\u4fdd\u6301\u7a33\u5b9a\u4f18\u52bf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable 3D spatial understanding is essential for autonomous navigation, obstacle avoidance, and scene reconstruction. While state-of-the-art learned depth estimation techniques achieve high accuracy in-distribution, they often generalize poorly to novel viewpoints and altitudes. This paper presents a geometrically derived, training-free depth estimation method using epipolar transfer with only two monocular images and camera pose estimates. By leveraging camera motion to synthesize a virtual stereo pair with a freely chosen baseline, our approach transforms temporal correspondence into a stereo triangulation task while mitigating geometric degeneracies inherent to direct two-view triangulation. Validated across outdoor drone flights (to a maximum range of approximately 90\\,m) and indoor OptiTrack environments against LiDAR ground truth, the method achieves an indoor AbsRel of 0.092 and $\u03b4\u003c 1.25$ of 0.940, comparable to direct triangulation (AbsRel 0.073) while retaining valid depth over a larger fraction of challenging scenes, and substantially outperforms off-the-shelf learning-based baselines such as ZoeDepth (AbsRel 0.225) and Depth Anything V2 (AbsRel 0.570), which are not trained or fine-tuned for this domain, with no training data required.", "arxiv_id": "2609.33939", "arxiv_url": "https://arxiv.org/abs/2609.33939", "authors": ["Diksha Aggarwal", "Rutvik Dagadkhair", "Sanjana Srivastava", "Bradley Denby", "Kevin Kochersberger"], "brief": "\u63d0\u51fa EpiTransfer\uff0c\u4e00\u79cd\u57fa\u4e8e\u6781\u7ebf\u8f6c\u79fb\u7684\u514d\u8bad\u7ec3\u7a00\u758f\u6df1\u5ea6\u4f30\u8ba1\u65b9\u6cd5\uff0c\u4ec5\u9700\u4e24\u5e27\u5355\u76ee\u56fe\u50cf\u548c\u76f8\u673a\u4f4d\u59ff\uff0c\u901a\u8fc7\u5408\u6210\u53ef\u9009\u57fa\u7ebf\u7684\u865a\u62df\u53cc\u76ee\u5c06\u65f6\u5e8f\u5339\u914d\u8f6c\u5316\u4e3a\u7acb\u4f53\u4e09\u89d2\u5316\u3002\u8be5\u65b9\u6cd5\u5728\u65e0\u4eba\u673a\u6237\u5916\u4e0e\u5ba4\u5185 OptiTrack \u573a\u666f\u4e2d\u53ef\u4f30\u8ba1\u7ea6 90 \u7c73\u8303\u56f4\u6df1\u5ea6\uff0c\u8986\u76d6\u66f4\u591a\u56f0\u96be\u533a\u57df\uff0c\u5e76\u5728\u672a\u505a\u9886\u57df\u8bad\u7ec3\u65f6\u660e\u663e\u4f18\u4e8e ZoeDepth\u3001Depth Anything V2 \u7b49\u901a\u7528\u5b66\u4e60\u5f0f\u57fa\u7ebf\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33939", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df1\u5ea6\u4f30\u8ba1", "\u5355\u76ee\u89c6\u89c9", "\u51e0\u4f55\u65b9\u6cd5", "\u65e0\u4eba\u673a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33939v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EpiTransfer: Sparse, Training-Free Long-Range Depth Estimation from Temporal Monocular Aerial Frames", "tldr": "\u63d0\u51fa EpiTransfer\uff0c\u4e00\u79cd\u57fa\u4e8e\u6781\u7ebf\u8f6c\u79fb\u7684\u514d\u8bad\u7ec3\u7a00\u758f\u6df1\u5ea6\u4f30\u8ba1\u65b9\u6cd5\uff0c\u4ec5\u9700\u4e24\u5e27\u5355\u76ee\u56fe\u50cf\u548c\u76f8\u673a\u4f4d\u59ff\uff0c\u901a\u8fc7\u5408\u6210\u53ef\u9009\u57fa\u7ebf\u7684\u865a\u62df\u53cc\u76ee\u5c06\u65f6\u5e8f\u5339\u914d\u8f6c\u5316\u4e3a\u7acb\u4f53\u4e09\u89d2\u5316\u3002\u8be5\u65b9\u6cd5\u5728\u65e0\u4eba\u673a\u6237\u5916\u4e0e\u5ba4\u5185 OptiTrack \u573a\u666f\u4e2d\u53ef\u4f30\u8ba1\u7ea6 90 \u7c73\u8303\u56f4\u6df1\u5ea6\uff0c\u8986\u76d6\u66f4\u591a\u56f0\u96be\u533a\u57df\uff0c\u5e76\u5728\u672a\u505a\u9886\u57df\u8bad\u7ec3\u65f6\u660e\u663e\u4f18\u4e8e ZoeDepth\u3001Depth Anything V2 \u7b49\u901a\u7528\u5b66\u4e60\u5f0f\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-Time Adaptation (TTA) and Generalized Category Discovery (GCD) are traditionally treated as disjoint problems: the former adapts models to domain shift assuming all test classes are known, while the latter discovers novel categories assuming labeled training data for known classes. However, real-world deployment rarely fits either setting. Motivated by this gap, we introduce Test-Time Generalized Category Discovery (TT-GCD), a unified and more realistic scenario where a vision-language model must adapt to distribution shifts, classify known categories using only textual supervision, and discover novel categories, all during test time and without access to labeled data. To address this challenging scenario, we propose PACT (Prototype Assignment for Category discovery at Test time), a fully unsupervised framework that casts known-class recognition and novel-class discovery via prototype assignment. PACT first re-aligns shifted visual features with the text-derived class representations of the VLM using confident zero-shot predictions. Known and novel categories are then both represented by prototypes in the visual embedding space, estimated from the unlabeled test stream, and each test image is assigned to the category whose prototype is most similar to its visual feature. Extensive experiments across corruption and domain-shift benchmarks demonstrate that PACT outperforms adapted state-of-the-art TTA and GCD methods, effectively bridging the gap between adaptation and discovery.", "arxiv_id": "2609.33937", "arxiv_url": "https://arxiv.org/abs/2609.33937", "authors": ["Shambhavi Mishra", "Omprakash Chakraborty", "Julio Silva-Rodriguez", "Ismail Ben Ayed", "Marco Pedersoli", "Jose Dolz"], "brief": "\u8bba\u6587\u63d0\u51fa\u6d4b\u8bd5\u65f6\u5e7f\u4e49\u7c7b\u522b\u53d1\u73b0\uff08TT-GCD\uff09\u65b0\u8bbe\u5b9a\uff1a\u6a21\u578b\u9700\u5728\u65e0\u6807\u6ce8\u6d4b\u8bd5\u6570\u636e\u4e0a\u540c\u65f6\u9002\u5e94\u5206\u5e03\u504f\u79fb\u3001\u8bc6\u522b\u5df2\u77e5\u7c7b\u5e76\u53d1\u73b0\u65b0\u7c7b\u3002\u65b9\u6cd5 PACT \u901a\u8fc7\u89c6\u89c9-\u8bed\u8a00\u539f\u578b\u5bf9\u9f50\u4e0e\u65e0\u76d1\u7763\u539f\u578b\u5206\u914d\uff0c\u5728\u591a\u79cd\u8150\u8680\u548c\u57df\u504f\u79fb\u57fa\u51c6\u4e0a\u4f18\u4e8e\u6539\u9020\u540e\u7684 TTA \u4e0e GCD \u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33937", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7c7b\u522b\u53d1\u73b0", "\u6d4b\u8bd5\u65f6\u9002\u5e94", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u65e0\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33937v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Test-Time Generalized Category Discovery", "tldr": "\u8bba\u6587\u63d0\u51fa\u6d4b\u8bd5\u65f6\u5e7f\u4e49\u7c7b\u522b\u53d1\u73b0\uff08TT-GCD\uff09\u65b0\u8bbe\u5b9a\uff1a\u6a21\u578b\u9700\u5728\u65e0\u6807\u6ce8\u6d4b\u8bd5\u6570\u636e\u4e0a\u540c\u65f6\u9002\u5e94\u5206\u5e03\u504f\u79fb\u3001\u8bc6\u522b\u5df2\u77e5\u7c7b\u5e76\u53d1\u73b0\u65b0\u7c7b\u3002\u65b9\u6cd5 PACT \u901a\u8fc7\u89c6\u89c9-\u8bed\u8a00\u539f\u578b\u5bf9\u9f50\u4e0e\u65e0\u76d1\u7763\u539f\u578b\u5206\u914d\uff0c\u5728\u591a\u79cd\u8150\u8680\u548c\u57df\u504f\u79fb\u57fa\u51c6\u4e0a\u4f18\u4e8e\u6539\u9020\u540e\u7684 TTA \u4e0e GCD \u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Adapting video models to new tasks typically requires dedicated data curation and fine-tuning. While visual analogy provides a training-free alternative by specifying tasks in-context, it remains restricted to the image domain. To explore whether analogy-based methods can unify diverse video tasks and generalize to out-of-distribution scenarios, we introduce ViGeo, a framework that extends visual in-context learning to the video domain via spatiotemporal canvas completion. Evaluated on a diverse task taxonomy with a strict train-test split, ViGeo generalizes to unseen video manipulations and zero-shot modalities (e.g., event cameras). Finally, we identify task internalization, where a query format associated with a pretrained task overrides the demonstration, and show that this shortcut can be removed with a small amount of task-unrelated data, highlighting the need to decorrelate prompt format from task identity.", "arxiv_id": "2609.33935", "arxiv_url": "https://arxiv.org/abs/2609.33935", "authors": ["Chia-Hsiang Kao", "Belinda Zeng", "Bharath Hariharan", "Menglin Jia"], "brief": "\u8bba\u6587\u63d0\u51fa ViGeo\uff0c\u5c06\u89c6\u89c9\u7c7b\u6bd4\u5f0f\u4e0a\u4e0b\u6587\u5b66\u4e60\u6269\u5c55\u5230\u89c6\u9891\u9886\u57df\uff0c\u901a\u8fc7\u65f6\u7a7a\u753b\u5e03\u8865\u5168\u6765\u7edf\u4e00\u591a\u79cd\u89c6\u9891\u4efb\u52a1\uff0c\u4e14\u65e0\u9700\u9488\u5bf9\u6bcf\u4e2a\u4efb\u52a1\u4e13\u95e8\u5fae\u8c03\u3002\u5728\u4e25\u683c\u8bad\u7ec3-\u6d4b\u8bd5\u5212\u5206\u4e0b\uff0cViGeo \u80fd\u6cdb\u5316\u5230\u672a\u89c1\u8fc7\u7684\u89c6\u9891\u64cd\u4f5c\u548c\u4e8b\u4ef6\u76f8\u673a\u7b49\u96f6\u6837\u672c\u6a21\u6001\uff0c\u5e76\u63ed\u793a\u4e86\u63d0\u793a\u683c\u5f0f\u4e0e\u4efb\u52a1\u8eab\u4efd\u8026\u5408\u5bfc\u81f4\u7684\u201c\u4efb\u52a1\u5185\u5316\u201d\u95ee\u9898\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33935", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u591a\u6a21\u6001", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33935v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Video, Ergo Genero: Unifying Video Tasks via Spatiotemporal Analogy", "tldr": "\u8bba\u6587\u63d0\u51fa ViGeo\uff0c\u5c06\u89c6\u89c9\u7c7b\u6bd4\u5f0f\u4e0a\u4e0b\u6587\u5b66\u4e60\u6269\u5c55\u5230\u89c6\u9891\u9886\u57df\uff0c\u901a\u8fc7\u65f6\u7a7a\u753b\u5e03\u8865\u5168\u6765\u7edf\u4e00\u591a\u79cd\u89c6\u9891\u4efb\u52a1\uff0c\u4e14\u65e0\u9700\u9488\u5bf9\u6bcf\u4e2a\u4efb\u52a1\u4e13\u95e8\u5fae\u8c03\u3002\u5728\u4e25\u683c\u8bad\u7ec3-\u6d4b\u8bd5\u5212\u5206\u4e0b\uff0cViGeo \u80fd\u6cdb\u5316\u5230\u672a\u89c1\u8fc7\u7684\u89c6\u9891\u64cd\u4f5c\u548c\u4e8b\u4ef6\u76f8\u673a\u7b49\u96f6\u6837\u672c\u6a21\u6001\uff0c\u5e76\u63ed\u793a\u4e86\u63d0\u793a\u683c\u5f0f\u4e0e\u4efb\u52a1\u8eab\u4efd\u8026\u5408\u5bfc\u81f4\u7684\u201c\u4efb\u52a1\u5185\u5316\u201d\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern methods reconstruct or generate simulation-ready articulated objects, predicting not only their geometry but also how their parts are connected and allowed to move. Evaluating the geometry is straightforward, but evaluating the predicted articulation is not, because articulation specifies a motion rather than a shape, and there is no agreed distance between two motions. More specifically, existing protocols score joint type, axis direction, origin, and motion limits separately, although these parameters jointly describe a single physical motion, and the same motion can be written as different parameter values. As a result, a joint can score maximally wrong against an equivalent encoding of itself, and several component errors are ill-conditioned or undefined exactly where predictions become accurate. We propose ArticulateArena, a representation-invariant counterpart of Chamfer distance for articulation that compares the motions one-DOF joints induce rather than the parameters that encode them. It represents each joint by the unordered pair of its Lie-algebra endpoint twists, and we prove that the resulting quotient distance is a metric. It unifies fixed, revolute, prismatic, and helical joints, brings continuous joints into the same score through a compactification, and reads as the RMS motion of the moving part in meters when weighted by its mass distribution. A motion-aware tree edit distance lifts the metric to full kinematic trees, pricing structural errors such as spurious or missing joints in the same motion units as joint errors, and for a fixed inner product it remains a metric on trees up to relabeling. Alongside the metric we release ArticulateArena-20K, a new suite of 19,977 articulated objects with verified kinematics, and we re-evaluate published reconstruction methods on it under the new metric. Project page: https://heyumeng.com/ArticulateArena-web/", "arxiv_id": "2609.33931", "arxiv_url": "https://arxiv.org/abs/2609.33931", "authors": ["Yumeng He", "Yongfei She", "Huanyu Chen", "Chun Yuan", "Peihao Li", "Joseph Masterjohn", "Yin Yang", "Ying Jiang", "Chenfanfu Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa ArticulateArena\uff0c\u4e00\u79cd\u9762\u5411\u5173\u8282\u8fd0\u52a8\u5b66\u7684\u8868\u793a\u4e0d\u53d8\u5ea6\u91cf\uff0c\u76f4\u63a5\u6bd4\u8f83\u4e00\u81ea\u7531\u5ea6\u5173\u8282\u8bf1\u5bfc\u7684\u8fd0\u52a8\u800c\u975e\u5173\u8282\u53c2\u6570\uff0c\u907f\u514d\u7b49\u4ef7\u53c2\u6570\u5316\u88ab\u8bef\u5224\u7684\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u53ef\u7edf\u4e00\u56fa\u5b9a\u3001\u65cb\u8f6c\u3001\u5e73\u79fb\u548c\u87ba\u65cb\u5173\u8282\uff0c\u5e76\u6269\u5c55\u5230\u5b8c\u6574\u8fd0\u52a8\u6811\uff1b\u540c\u65f6\u53d1\u5e03\u8fd12\u4e07\u4e2a\u5e26\u9a8c\u8bc1\u8fd0\u52a8\u5b66\u7684\u7269\u4f53\u6570\u636e\u96c6\u5e76\u91cd\u65b0\u8bc4\u6d4b\u73b0\u6709\u91cd\u5efa\u65b9\u6cd5\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33931", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u4e09\u7ef4\u91cd\u5efa", "\u8fd0\u52a8\u5b66", "\u8bc4\u6d4b\u6307\u6807"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33931v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ArticulateArena: A Metric for Articulated Kinematics", "tldr": "\u8bba\u6587\u63d0\u51fa ArticulateArena\uff0c\u4e00\u79cd\u9762\u5411\u5173\u8282\u8fd0\u52a8\u5b66\u7684\u8868\u793a\u4e0d\u53d8\u5ea6\u91cf\uff0c\u76f4\u63a5\u6bd4\u8f83\u4e00\u81ea\u7531\u5ea6\u5173\u8282\u8bf1\u5bfc\u7684\u8fd0\u52a8\u800c\u975e\u5173\u8282\u53c2\u6570\uff0c\u907f\u514d\u7b49\u4ef7\u53c2\u6570\u5316\u88ab\u8bef\u5224\u7684\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u53ef\u7edf\u4e00\u56fa\u5b9a\u3001\u65cb\u8f6c\u3001\u5e73\u79fb\u548c\u87ba\u65cb\u5173\u8282\uff0c\u5e76\u6269\u5c55\u5230\u5b8c\u6574\u8fd0\u52a8\u6811\uff1b\u540c\u65f6\u53d1\u5e03\u8fd12\u4e07\u4e2a\u5e26\u9a8c\u8bc1\u8fd0\u52a8\u5b66\u7684\u7269\u4f53\u6570\u636e\u96c6\u5e76\u91cd\u65b0\u8bc4\u6d4b\u73b0\u6709\u91cd\u5efa\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Predicting spatial gene expression from histology images could scale spatial transcriptomics (ST) to image-only cohorts, but conventional histology-based ST prediction is trained and evaluated mainly by per-gene spatial-profile reconstruction. This objective is misaligned with a key downstream use of ST: differentially expressed gene (DEG) discovery, where genes are ranked for a biological or morphology-defined contrast by evidence of between-group expression differences. We formulate image-based differential expression ranking (IDER), which asks whether predicted expression profiles preserve the contrast-specific ranked gene list obtained from measured profiles. IDER compares gene rankings induced by differential-expression statistics, rather than raw expression magnitudes or per-gene spatial correlations. We further introduce a differentiable IDER objective that aligns these statistics across genes and can be trained with morphology-derived proxy contrasts without predefined biological group labels. Experiments on public ST datasets show improved DEG-ranking agreement and pathway-enrichment overlap over conventional reconstruction objectives, including morphology-derived and pathologist-annotated tissue-region evaluations.", "arxiv_id": "2609.33928", "arxiv_url": "https://arxiv.org/abs/2609.33928", "authors": ["Kaito Shiku", "Kazuya Nishimura", "Yasuhiro Kojima", "Ryoma Bise"], "brief": "\u672c\u6587\u63d0\u51fa\u56fe\u50cf\u9a71\u52a8\u5dee\u5f02\u8868\u8fbe\u6392\u5e8f\uff08IDER\uff09\uff0c\u5c06\u7ec4\u7ec7\u5b66\u56fe\u50cf\u9884\u6d4b\u7a7a\u95f4\u57fa\u56e0\u8868\u8fbe\u7684\u76ee\u6807\u4ece\u9010\u57fa\u56e0\u91cd\u5efa\u8f6c\u5411\u4fdd\u7559\u5dee\u5f02\u8868\u8fbe\u57fa\u56e0\u6392\u540d\u3002\u4f5c\u8005\u8bbe\u8ba1\u4e86\u53ef\u5fae IDER \u8bad\u7ec3\u76ee\u6807\uff0c\u53ef\u5229\u7528\u5f62\u6001\u5b66\u4ee3\u7406\u5bf9\u6bd4\u8fdb\u884c\u8bad\u7ec3\uff1b\u5728\u516c\u5f00\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u6570\u636e\u4e0a\u63d0\u5347\u4e86 DEG \u6392\u540d\u4e00\u81f4\u6027\u548c\u901a\u8def\u5bcc\u96c6\u91cd\u53e0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33928", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u75c5\u7406", "\u7a7a\u95f4\u8f6c\u5f55\u7ec4", "\u57fa\u56e0\u8868\u8fbe\u9884\u6d4b", "\u5dee\u5f02\u8868\u8fbe\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33928v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Preserving DEG Rankings for Gene Discovery in Histology-Based Spatial Gene Expression Prediction", "tldr": "\u672c\u6587\u63d0\u51fa\u56fe\u50cf\u9a71\u52a8\u5dee\u5f02\u8868\u8fbe\u6392\u5e8f\uff08IDER\uff09\uff0c\u5c06\u7ec4\u7ec7\u5b66\u56fe\u50cf\u9884\u6d4b\u7a7a\u95f4\u57fa\u56e0\u8868\u8fbe\u7684\u76ee\u6807\u4ece\u9010\u57fa\u56e0\u91cd\u5efa\u8f6c\u5411\u4fdd\u7559\u5dee\u5f02\u8868\u8fbe\u57fa\u56e0\u6392\u540d\u3002\u4f5c\u8005\u8bbe\u8ba1\u4e86\u53ef\u5fae IDER \u8bad\u7ec3\u76ee\u6807\uff0c\u53ef\u5229\u7528\u5f62\u6001\u5b66\u4ee3\u7406\u5bf9\u6bd4\u8fdb\u884c\u8bad\u7ec3\uff1b\u5728\u516c\u5f00\u7a7a\u95f4\u8f6c\u5f55\u7ec4\u6570\u636e\u4e0a\u63d0\u5347\u4e86 DEG \u6392\u540d\u4e00\u81f4\u6027\u548c\u901a\u8def\u5bcc\u96c6\u91cd\u53e0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generative models often suffer from mode collapse and limited sample diversity. While prior works attempt to mitigate this by jointly generating a batch of samples and repelling their trajectories, these heuristics do not explicitly maximize the diversity of the resulting endpoints. We introduce JIVE, a training-free framework that enhances generative diversity by injecting velocity perturbations aligned with the leading right singular subspace of the generator\u0027s endpoint Jacobian. By leveraging this local geometric structure, JIVE provably maximizes endpoint diversity while preserving sample quality. To maintain practical efficiency, we compute these perturbation directions via matrix-free iterations rooted in classical numerical linear algebra, requiring only a small computational overhead. Across different benchmarks, JIVE boosts both pixel and feature-level diversity in few-step and one-step generation.", "arxiv_id": "2609.33906", "arxiv_url": "https://arxiv.org/abs/2609.33906", "authors": ["Guangxun Zhang", "Brian Cai", "Boxuan Zhang", "Chao Chen", "Ruixiang Tang"], "brief": "JIVE \u662f\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u751f\u6210\u91c7\u6837\u591a\u6837\u6027\u589e\u5f3a\u6846\u67b6\uff0c\u901a\u8fc7\u6cbf\u751f\u6210\u5668\u7ec8\u70b9\u96c5\u53ef\u6bd4\u77e9\u9635\u7684\u4e3b\u53f3\u5947\u5f02\u5b50\u7a7a\u95f4\u6ce8\u5165\u901f\u5ea6\u6270\u52a8\uff0c\u76f4\u63a5\u6269\u5927\u751f\u6210\u7ec8\u70b9\u7684\u4f53\u79ef\u4e0e\u5dee\u5f02\u3002\u5b83\u5728\u4fdd\u6301\u6837\u672c\u8d28\u91cf\u7684\u540c\u65f6\u63d0\u5347\u50cf\u7d20\u7ea7\u548c\u7279\u5f81\u7ea7\u591a\u6837\u6027\uff0c\u5e76\u53ef\u7528\u77e9\u9635\u65e0\u5173\u8fed\u4ee3\u9ad8\u6548\u8ba1\u7b97\uff0c\u9002\u7528\u4e8e\u5c11\u6b65\u548c\u4e00\u6b65\u751f\u6210\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33906", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u6a21\u578b", "\u91c7\u6837\u591a\u6837\u6027", "\u96c5\u53ef\u6bd4\u77e9\u9635", "\u6570\u503c\u7ebf\u6027\u4ee3\u6570"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33906v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "JIVE: Jacobian-Informed Volume Expansion for Diverse Generative Sampling", "tldr": "JIVE \u662f\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u751f\u6210\u91c7\u6837\u591a\u6837\u6027\u589e\u5f3a\u6846\u67b6\uff0c\u901a\u8fc7\u6cbf\u751f\u6210\u5668\u7ec8\u70b9\u96c5\u53ef\u6bd4\u77e9\u9635\u7684\u4e3b\u53f3\u5947\u5f02\u5b50\u7a7a\u95f4\u6ce8\u5165\u901f\u5ea6\u6270\u52a8\uff0c\u76f4\u63a5\u6269\u5927\u751f\u6210\u7ec8\u70b9\u7684\u4f53\u79ef\u4e0e\u5dee\u5f02\u3002\u5b83\u5728\u4fdd\u6301\u6837\u672c\u8d28\u91cf\u7684\u540c\u65f6\u63d0\u5347\u50cf\u7d20\u7ea7\u548c\u7279\u5f81\u7ea7\u591a\u6837\u6027\uff0c\u5e76\u53ef\u7528\u77e9\u9635\u65e0\u5173\u8fed\u4ee3\u9ad8\u6548\u8ba1\u7b97\uff0c\u9002\u7528\u4e8e\u5c11\u6b65\u548c\u4e00\u6b65\u751f\u6210\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In diffusion-based generation, a neural network can be trained to predict the clean data, the noise, or the velocity from a noisy input. These prediction targets are interconvertible and describe the same generative process, yet plain Diffusion Transformers operating on large pixel patches succeed with clean prediction and fail with noise or velocity prediction. We argue that this asymmetry arises because noisy targets require the residual stream to preserve noise-dependent input variation through depth for the final readout, forcing subsequent layers to compute on noisy representations. A spectrally concentrated clean target imposes a lighter demand, leaving greater freedom to organize hidden representations for subsequent computation. We call this preservation requirement *residual-stream burden* and show how it shapes representation learning in Diffusion Transformers. Controlled experiments indicate that the exploitable structure is spectral concentration in patch space and that the bandwidth of the persistent residual state is a key resource for noisy prediction. We further show that this account is consistent with recent decoupled pixel-space architectures, whose diverse designs all reduce the residual-stream burden on the main pathway. To examine this understanding from a complementary direction, we expand and reorganize the residual-stream bandwidth directly, introducing Spatially Indexed Hyper-Connections (SiHC) that reach FID 1.71 on ImageNet $256^2$. Together, these results identify residual-stream burden as a mechanism through which prediction targets and architecture jointly shape representation learning in Diffusion Transformers.", "arxiv_id": "2609.33895", "arxiv_url": "https://arxiv.org/abs/2609.33895", "authors": ["Tongtong Liang", "Siqi Kou", "Ziqiao Xi", "Esha Singh", "Kun Zhou", "Zhijie Deng", "Alexander Cloninger", "Yu-Xiang Wang", "Rahul Parhi"], "brief": "\u8bba\u6587\u89e3\u91ca\u4e86\u4e3a\u4ec0\u4e48\u666e\u901a Diffusion Transformer \u5728\u5927\u50cf\u7d20\u5757\u8bbe\u7f6e\u4e0b\u7528\u5e72\u51c0\u56fe\u50cf\u9884\u6d4b\u6548\u679c\u597d\uff0c\u800c\u566a\u58f0/\u901f\u5ea6\u9884\u6d4b\u5bb9\u6613\u5931\u8d25\uff1a\u566a\u58f0\u76ee\u6807\u4f1a\u7ed9\u6b8b\u5dee\u6d41\u5e26\u6765\u66f4\u91cd\u7684\u8f93\u5165\u7ec6\u8282\u4fdd\u7559\u8d1f\u62c5\uff0c\u9650\u5236\u4e2d\u95f4\u8868\u793a\u5b66\u4e60\u3002\u4f5c\u8005\u901a\u8fc7\u5b9e\u9a8c\u9a8c\u8bc1\u9891\u8c31\u96c6\u4e2d\u6027\u548c\u6b8b\u5dee\u5e26\u5bbd\u662f\u5173\u952e\u56e0\u7d20\uff0c\u5e76\u63d0\u51fa Spatially Indexed Hyper-Connections \u6269\u5c55\u6b8b\u5dee\u5e26\u5bbd\uff0c\u5728 ImageNet 256\u00d7256 \u4e0a\u8fbe\u5230 FID 1.71\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33895", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "Transformer", "\u8868\u793a\u5b66\u4e60", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33895v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Residual-Stream Burden Shapes Representation Learning in Diffusion Transformers", "tldr": "\u8bba\u6587\u89e3\u91ca\u4e86\u4e3a\u4ec0\u4e48\u666e\u901a Diffusion Transformer \u5728\u5927\u50cf\u7d20\u5757\u8bbe\u7f6e\u4e0b\u7528\u5e72\u51c0\u56fe\u50cf\u9884\u6d4b\u6548\u679c\u597d\uff0c\u800c\u566a\u58f0/\u901f\u5ea6\u9884\u6d4b\u5bb9\u6613\u5931\u8d25\uff1a\u566a\u58f0\u76ee\u6807\u4f1a\u7ed9\u6b8b\u5dee\u6d41\u5e26\u6765\u66f4\u91cd\u7684\u8f93\u5165\u7ec6\u8282\u4fdd\u7559\u8d1f\u62c5\uff0c\u9650\u5236\u4e2d\u95f4\u8868\u793a\u5b66\u4e60\u3002\u4f5c\u8005\u901a\u8fc7\u5b9e\u9a8c\u9a8c\u8bc1\u9891\u8c31\u96c6\u4e2d\u6027\u548c\u6b8b\u5dee\u5e26\u5bbd\u662f\u5173\u952e\u56e0\u7d20\uff0c\u5e76\u63d0\u51fa Spatially Indexed Hyper-Connections \u6269\u5c55\u6b8b\u5dee\u5e26\u5bbd\uff0c\u5728 ImageNet 256\u00d7256 \u4e0a\u8fbe\u5230 FID 1.71\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Driving policies require capabilities of scene understanding and future evolution prediction. To achieve this goal, current end-to-end models typically construct complex perception-planning pipelines or introduce world models that explicitly predict future states, resulting in a complex system architecture. Inspired by the transferability of general-purpose visual representations, we argue that combining sufficiently strong visual representations with representation world modeling can support effective planning without relying on complex inference-time auxiliary modules. Based on this insight, we present ReDrive, an end-to-end driving framework that strengthens planning-oriented visual features via future representation prediction. To achieve this, ReDrive adopts a three-stage training pipeline consisting of driving video pretraining, joint world-modeling and planning training, and planner adaptation. This yields a strong planning-oriented representation and a high-performance planner, while requiring neither auxiliary perception modules nor future prediction at inference time. Experiments on NAVSIM demonstrate strong performance, achieving 91.0 PDMS on NAVSIM v1 and 90.8 EPDMS on NAVSIM v2. These results show that shaping representations with world modeling is sufficient to enable high-performance end-to-end planning while retaining a simple encoder-planner inference pipeline.", "arxiv_id": "2609.33854", "arxiv_url": "https://arxiv.org/abs/2609.33854", "authors": ["Yueting Zhu", "Shaoyu Chen", "Yuehao Song", "Hui Sun", "Qian Zhang", "Wenyu Liu", "Xinggang Wang"], "brief": "\u8bba\u6587\u63d0\u51fa ReDrive\uff0c\u901a\u8fc7\u672a\u6765\u8868\u5f81\u9884\u6d4b\u6765\u5851\u9020\u9762\u5411\u89c4\u5212\u7684\u89c6\u89c9\u8868\u793a\uff0c\u7528\u66f4\u7b80\u5355\u7684\u7aef\u5230\u7aef\u7f16\u7801\u5668-\u89c4\u5212\u5668\u66ff\u4ee3\u590d\u6742\u611f\u77e5\u89c4\u5212\u6d41\u6c34\u7ebf\u6216\u63a8\u7406\u65f6\u4e16\u754c\u6a21\u578b\u3002\u5176\u4e09\u9636\u6bb5\u8bad\u7ec3\u5728 NAVSIM \u4e0a\u53d6\u5f97\u8f83\u5f3a\u6027\u80fd\uff0cNAVSIM v1 \u8fbe\u5230 91.0 PDMS\u3001v2 \u8fbe\u5230 90.8 EPDMS\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33854", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u4e16\u754c\u6a21\u578b", "\u7aef\u5230\u7aef\u89c4\u5212", "\u89c6\u89c9\u8868\u5f81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33854v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReDrive: Shaping Representations with World Modeling for End-to-End Driving", "tldr": "\u8bba\u6587\u63d0\u51fa ReDrive\uff0c\u901a\u8fc7\u672a\u6765\u8868\u5f81\u9884\u6d4b\u6765\u5851\u9020\u9762\u5411\u89c4\u5212\u7684\u89c6\u89c9\u8868\u793a\uff0c\u7528\u66f4\u7b80\u5355\u7684\u7aef\u5230\u7aef\u7f16\u7801\u5668-\u89c4\u5212\u5668\u66ff\u4ee3\u590d\u6742\u611f\u77e5\u89c4\u5212\u6d41\u6c34\u7ebf\u6216\u63a8\u7406\u65f6\u4e16\u754c\u6a21\u578b\u3002\u5176\u4e09\u9636\u6bb5\u8bad\u7ec3\u5728 NAVSIM \u4e0a\u53d6\u5f97\u8f83\u5f3a\u6027\u80fd\uff0cNAVSIM v1 \u8fbe\u5230 91.0 PDMS\u3001v2 \u8fbe\u5230 90.8 EPDMS\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modeling temporal dependence and uncertainty is central to forecasting with world models. The Visual Bayesian Regression World Model combines visual features, physical histories and known covariates through interpretable regression, within a modular architecture supporting trend, seasonal and cycle dynamics. Visual compression reduces representation dimension, while Bayesian variable selection reduces active regression dimension. Posterior prediction combines forecasts across predictor subsets using their posterior probabilities as weights and accounts for parameter uncertainty and future disturbances. The model forecasts joint visual--physical states recursively and physical targets directly. Across four forecasting tasks spanning object motion, vegetation greenness and solar power, ViBR-WM achieves lower mean overall physical-target error than Temporal Straightening, ConvLSTM, PredRNN and SimVP on every task. Repeated fitting and resampling support these overall gains.", "arxiv_id": "2609.33844", "arxiv_url": "https://arxiv.org/abs/2609.33844", "authors": ["Jifan Li", "Ning Ning"], "brief": "\u672c\u6587\u63d0\u51fa ViBR-WM\uff0c\u5c06\u89c6\u89c9\u7279\u5f81\u3001\u7269\u7406\u5386\u53f2\u548c\u5df2\u77e5\u534f\u53d8\u91cf\u7ed3\u5408\u5230\u53ef\u89e3\u91ca\u7684\u8d1d\u53f6\u65af\u56de\u5f52\u4e16\u754c\u6a21\u578b\u4e2d\uff0c\u5e76\u652f\u6301\u8d8b\u52bf\u3001\u5b63\u8282\u548c\u5468\u671f\u52a8\u6001\u5efa\u6a21\u3002\u6a21\u578b\u901a\u8fc7\u89c6\u89c9\u538b\u7f29\u548c\u8d1d\u53f6\u65af\u53d8\u91cf\u9009\u62e9\u964d\u4f4e\u7ef4\u5ea6\uff0c\u5728\u7269\u4f53\u8fd0\u52a8\u3001\u690d\u88ab\u7eff\u5ea6\u548c\u592a\u9633\u80fd\u9884\u6d4b\u7b49\u4efb\u52a1\u4e0a\u76f8\u8f83 Temporal Straightening\u3001ConvLSTM\u3001PredRNN \u548c SimVP \u90fd\u53d6\u5f97\u66f4\u4f4e\u7684\u7269\u7406\u76ee\u6807\u9884\u6d4b\u8bef\u5dee\u3002", "categories": ["stat.ME", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33844", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8d1d\u53f6\u65af\u56de\u5f52", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33844v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ViBR-WM: Visual Bayesian Regression for World Modeling", "tldr": "\u672c\u6587\u63d0\u51fa ViBR-WM\uff0c\u5c06\u89c6\u89c9\u7279\u5f81\u3001\u7269\u7406\u5386\u53f2\u548c\u5df2\u77e5\u534f\u53d8\u91cf\u7ed3\u5408\u5230\u53ef\u89e3\u91ca\u7684\u8d1d\u53f6\u65af\u56de\u5f52\u4e16\u754c\u6a21\u578b\u4e2d\uff0c\u5e76\u652f\u6301\u8d8b\u52bf\u3001\u5b63\u8282\u548c\u5468\u671f\u52a8\u6001\u5efa\u6a21\u3002\u6a21\u578b\u901a\u8fc7\u89c6\u89c9\u538b\u7f29\u548c\u8d1d\u53f6\u65af\u53d8\u91cf\u9009\u62e9\u964d\u4f4e\u7ef4\u5ea6\uff0c\u5728\u7269\u4f53\u8fd0\u52a8\u3001\u690d\u88ab\u7eff\u5ea6\u548c\u592a\u9633\u80fd\u9884\u6d4b\u7b49\u4efb\u52a1\u4e0a\u76f8\u8f83 Temporal Straightening\u3001ConvLSTM\u3001PredRNN \u548c SimVP \u90fd\u53d6\u5f97\u66f4\u4f4e\u7684\u7269\u7406\u76ee\u6807\u9884\u6d4b\u8bef\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Construction environments evolve continuously, causing large geometric changes that degrade static mapping and registration performance. This necessitates active perception, where robots deliberately select sensing configurations to resolve the environment\u0027s current state. We present DeltaSeek, an initial framework toward active perception in evolving built environments. While our broader objective is a system that reasons about where, how, and when to observe, this paper addresses a critical prerequisite: how a robot\u0027s sensing embodiment constrains the observations it can acquire. We formalize an embodiment\u0027s permissible observation set and evaluate with a Husky A300 equipped with a UR5e on an IFC-derived benchmark under chassis-mounted and wrist-mounted RGB-D configurations, scoring observations by geometric visibility and effort by drivable distance. In a room-scale scene with eight controlled changes spanning four observability conditions, exhaustive evaluation over 240 permissible base poses and five arm postures shows that two changes admit no chassis viewpoint whatsoever, while the wrist camera resolves both. For changes observed by both embodiments, the median base travel is $6.0$~m for the wrist camera and $15.2$~m for the chassis camera. These results distinguish sensing limitations from acquisition costs, clarifying whether an observation is impossible or simply requires more travel.", "arxiv_id": "2609.33836", "arxiv_url": "https://arxiv.org/abs/2609.33836", "authors": ["Sanjay Acharjee", "Md Nazmus Sakib"], "brief": "DeltaSeek \u9762\u5411\u6301\u7eed\u53d8\u5316\u7684\u65bd\u5de5\u73af\u5883\uff0c\u7814\u7a76\u673a\u5668\u4eba\u4e3b\u52a8\u611f\u77e5\u4e2d\u201c\u4f20\u611f\u5668\u5b89\u88c5\u65b9\u5f0f\u201d\u5982\u4f55\u9650\u5236\u53ef\u83b7\u5f97\u89c2\u6d4b\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u8155\u90e8 RGB-D \u76f8\u673a\u80fd\u89c2\u6d4b\u5230\u5e95\u76d8\u76f8\u673a\u5b8c\u5168\u770b\u4e0d\u5230\u7684\u53d8\u5316\uff0c\u5e76\u5c06\u5171\u540c\u53ef\u89c2\u6d4b\u53d8\u5316\u7684\u4e2d\u4f4d\u79fb\u52a8\u8ddd\u79bb\u4ece 15.2 \u7c73\u964d\u81f3 6.0 \u7c73\uff0c\u4ece\u800c\u533a\u5206\u4e86\u611f\u77e5\u4e0d\u53ef\u8fbe\u4e0e\u91c7\u96c6\u6210\u672c\u9ad8\u4e24\u7c7b\u95ee\u9898\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33836", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u4e3b\u52a8\u611f\u77e5", "\u4e09\u7ef4\u89c6\u89c9", "\u65bd\u5de5\u73af\u5883"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33836v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DeltaSeek: Toward Active Perception in Evolving Construction Environments", "tldr": "DeltaSeek \u9762\u5411\u6301\u7eed\u53d8\u5316\u7684\u65bd\u5de5\u73af\u5883\uff0c\u7814\u7a76\u673a\u5668\u4eba\u4e3b\u52a8\u611f\u77e5\u4e2d\u201c\u4f20\u611f\u5668\u5b89\u88c5\u65b9\u5f0f\u201d\u5982\u4f55\u9650\u5236\u53ef\u83b7\u5f97\u89c2\u6d4b\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u8155\u90e8 RGB-D \u76f8\u673a\u80fd\u89c2\u6d4b\u5230\u5e95\u76d8\u76f8\u673a\u5b8c\u5168\u770b\u4e0d\u5230\u7684\u53d8\u5316\uff0c\u5e76\u5c06\u5171\u540c\u53ef\u89c2\u6d4b\u53d8\u5316\u7684\u4e2d\u4f4d\u79fb\u52a8\u8ddd\u79bb\u4ece 15.2 \u7c73\u964d\u81f3 6.0 \u7c73\uff0c\u4ece\u800c\u533a\u5206\u4e86\u611f\u77e5\u4e0d\u53ef\u8fbe\u4e0e\u91c7\u96c6\u6210\u672c\u9ad8\u4e24\u7c7b\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion models are now widely used in Bayesian inverse problems in imaging as priors, where latent diffusion models are often used for larger scale problems to keep the computational complexity and model-size manageable. Unfortunately, the auto-encoder based compression results in loss of spatial detail. In addition, the optimization is converted to a non-linear problem. In this paper, we introduce a posterior sampling algorithm customized for the pyramidal/cascaded architecture, which relies on a coarse to fine hierarchical strategy to generate images in the pixel domain. We present CLIMB-Flow which alternates between three steps: an end-point estimation from the current coarse and noisy image, data-consistent update of the clean image, and re-noising it back to the level the network expects. Together these steps sample the posterior at that scale using an approximate Gibbs sampling from two conditional distributions. Experiments on ImageNet, CelebA, AFHQ and fastMRI span inpainting, deblurring, super-resolution and accelerated MRI, with PSNR gains of 1.37-7.66 dB over the strongest competing method on CelebA and pixel-domain reconstruction up to 512x512.", "arxiv_id": "2609.33834", "arxiv_url": "https://arxiv.org/abs/2609.33834", "authors": ["Zeqiu Yu", "Ruizhi Yuan", "Mathews Jacob"], "brief": "\u672c\u6587\u63d0\u51fa CLIMB-Flow\uff0c\u7528\u4e8e\u57fa\u4e8e\u6269\u6563\u5148\u9a8c\u7684\u6210\u50cf\u8d1d\u53f6\u65af\u9006\u95ee\u9898\u540e\u9a8c\u91c7\u6837\uff0c\u9762\u5411\u91d1\u5b57\u5854/\u7ea7\u8054\u5f0f\u591a\u5c3a\u5ea6\u50cf\u7d20\u57df\u751f\u6210\u67b6\u6784\u3002\u65b9\u6cd5\u901a\u8fc7\u7aef\u70b9\u4f30\u8ba1\u3001\u6570\u636e\u4e00\u81f4\u6027\u66f4\u65b0\u548c\u91cd\u65b0\u52a0\u566a\u4ea4\u66ff\u6267\u884c\uff0c\u5728\u4fee\u590d\u3001\u53bb\u6a21\u7cca\u3001\u8d85\u5206\u8fa8\u7387\u548c\u52a0\u901f MRI \u7b49\u4efb\u52a1\u4e0a\u76f8\u8f83\u5f3a\u57fa\u7ebf\u63d0\u5347 1.37\u20137.66 dB\uff0c\u5e76\u652f\u6301\u6700\u9ad8 512\u00d7512 \u91cd\u5efa\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33834", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8d1d\u53f6\u65af\u9006\u95ee\u9898", "\u56fe\u50cf\u91cd\u5efa", "\u591a\u5c3a\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33834v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CLIMB-flow: Coupled Linear Inverse posterior sampling via Multiscale-Based flow", "tldr": "\u672c\u6587\u63d0\u51fa CLIMB-Flow\uff0c\u7528\u4e8e\u57fa\u4e8e\u6269\u6563\u5148\u9a8c\u7684\u6210\u50cf\u8d1d\u53f6\u65af\u9006\u95ee\u9898\u540e\u9a8c\u91c7\u6837\uff0c\u9762\u5411\u91d1\u5b57\u5854/\u7ea7\u8054\u5f0f\u591a\u5c3a\u5ea6\u50cf\u7d20\u57df\u751f\u6210\u67b6\u6784\u3002\u65b9\u6cd5\u901a\u8fc7\u7aef\u70b9\u4f30\u8ba1\u3001\u6570\u636e\u4e00\u81f4\u6027\u66f4\u65b0\u548c\u91cd\u65b0\u52a0\u566a\u4ea4\u66ff\u6267\u884c\uff0c\u5728\u4fee\u590d\u3001\u53bb\u6a21\u7cca\u3001\u8d85\u5206\u8fa8\u7387\u548c\u52a0\u901f MRI \u7b49\u4efb\u52a1\u4e0a\u76f8\u8f83\u5f3a\u57fa\u7ebf\u63d0\u5347 1.37\u20137.66 dB\uff0c\u5e76\u652f\u6301\u6700\u9ad8 512\u00d7512 \u91cd\u5efa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Adversarial attacks have long posed a fundamental threat to machine learning systems. As multimodal large language models (MLLMs) rapidly evolve and become widely deployed, assessing their vulnerability to such attacks is essential for their safe use. In this work, we investigate whether a single adversarial image can consistently mislead diverse frontier MLLMs in black-box settings. We propose O-Attack, a highly transferable black-box attack framework. This framework builds on our insight that surrogate models contain a broad, high-level, cross-modally aligned semantic space. This space extends beyond final-layer outputs and provides multiple semantically consistent representations that remain underexploited by existing attacks. Within this space, O-Attack anchors aligned representations, progressively broadens semantic conditions, and optimizes perturbations through semantic consensus to promote consistent target alignment. By fully exploiting this space with the same surrogate models as M-Attack, O-Attack raises attack success rates on GPT-5.4 (29.1% to 77.2%), Claude-4.6 (42.8% to 81.6%), and Gemini-3.1 (38.2% to 80.9%). Extensive experiments across 24 MLLMs show that O-Attack outperforms six state-of-the-art methods in black-box transferability, with consistent effectiveness across prompts and improved efficiency and imperceptibility. This work exposes the practical safety risks posed by black-box adversarial attacks against frontier MLLMs, underscoring the need for more rigorous robustness evaluation and more effective defenses.", "arxiv_id": "2609.33833", "arxiv_url": "https://arxiv.org/abs/2609.33833", "authors": ["Sen Nie", "Jie Zhang", "Zhongqi Wang", "Shiguang Shan", "Xilin Chen"], "brief": "\u672c\u6587\u63d0\u51fa O-Attack\uff0c\u4e00\u79cd\u9762\u5411\u524d\u6cbf\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u9ad8\u53ef\u8fc1\u79fb\u9ed1\u76d2\u5bf9\u6297\u653b\u51fb\u6846\u67b6\uff0c\u5229\u7528\u4ee3\u7406\u6a21\u578b\u4e2d\u8de8\u6a21\u6001\u5bf9\u9f50\u7684\u9ad8\u5c42\u8bed\u4e49\u7a7a\u95f4\u6765\u4f18\u5316\u5355\u5f20\u5bf9\u6297\u56fe\u50cf\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 GPT\u3001Claude\u3001Gemini \u7b49 24 \u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e0a\u663e\u8457\u63d0\u5347\u653b\u51fb\u6210\u529f\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u597d\u7684\u6548\u7387\u548c\u4e0d\u53ef\u611f\u77e5\u6027\uff0c\u66b4\u9732\u4e86\u73b0\u6709 MLLM \u7684\u73b0\u5b9e\u5b89\u5168\u98ce\u9669\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33833", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5bf9\u6297\u653b\u51fb", "\u9ed1\u76d2\u653b\u51fb", "\u6a21\u578b\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33833v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One Attack to Fool Them All: Highly Transferable Black-Box Adversarial Attacks on Frontier MLLMs", "tldr": "\u672c\u6587\u63d0\u51fa O-Attack\uff0c\u4e00\u79cd\u9762\u5411\u524d\u6cbf\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u9ad8\u53ef\u8fc1\u79fb\u9ed1\u76d2\u5bf9\u6297\u653b\u51fb\u6846\u67b6\uff0c\u5229\u7528\u4ee3\u7406\u6a21\u578b\u4e2d\u8de8\u6a21\u6001\u5bf9\u9f50\u7684\u9ad8\u5c42\u8bed\u4e49\u7a7a\u95f4\u6765\u4f18\u5316\u5355\u5f20\u5bf9\u6297\u56fe\u50cf\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 GPT\u3001Claude\u3001Gemini \u7b49 24 \u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e0a\u663e\u8457\u63d0\u5347\u653b\u51fb\u6210\u529f\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u597d\u7684\u6548\u7387\u548c\u4e0d\u53ef\u611f\u77e5\u6027\uff0c\u66b4\u9732\u4e86\u73b0\u6709 MLLM \u7684\u73b0\u5b9e\u5b89\u5168\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual anomaly detectors identify deviations from known-normal data, but their anomaly signals may mix evidence of actual anomalies with benign visual variation. We investigate whether automated interpretability can augment visual anomaly detectors by identifying and intervening on different components of this signal. We decompose PatchCore nearest-normal residuals into sparse features using Sparse Autoencoders (SAEs), and provide high-activation and contrastive non-active examples to a Multimodal LLM, which describes each feature and labels it as anomaly, distractor, or uncertain. These labels guide interventions in the SAE hidden representation, where distractor features are suppressed and anomaly features amplified. The edited representation is then used to reconstruct patch embeddings, which are rescored with PatchCore. Across 40 categories from four benchmarks, applying both interventions jointly improves macro-average image-level AUROC from 0.8724 to 0.8857 on source data and from 0.8066 to 0.8210 under synthetic corruptions. On three additional RobustAD categories with real acquisition shifts, the same interventions improve AUROC from 0.8745 to 0.9056 on source data and from 0.6069 to 0.6599 under real acquisition shifts. Finally, individual feature interventions across all 43 categories show that the MLLM labels are aligned in aggregate with how features differently affect normal and anomalous images.", "arxiv_id": "2609.33818", "arxiv_url": "https://arxiv.org/abs/2609.33818", "authors": ["Antonio De Santis", "Arsenio Leo", "Marco Brambilla"], "brief": "\u672c\u6587\u7528\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5206\u89e3 PatchCore \u7684\u5f02\u5e38\u6b8b\u5dee\u4fe1\u53f7\uff0c\u5e76\u8ba9\u591a\u6a21\u6001\u5927\u6a21\u578b\u81ea\u52a8\u89e3\u91ca\u7279\u5f81\u3001\u533a\u5206\u771f\u5b9e\u5f02\u5e38\u4e0e\u5e72\u6270\u56e0\u7d20\u3002\u6839\u636e\u89e3\u91ca\u7ed3\u679c\u6291\u5236\u5e72\u6270\u7279\u5f81\u3001\u653e\u5927\u5f02\u5e38\u7279\u5f81\u540e\uff0c\u5728\u591a\u4e2a\u5f02\u5e38\u68c0\u6d4b\u57fa\u51c6\u548c\u5206\u5e03\u504f\u79fb\u573a\u666f\u4e0b\u7a33\u5b9a\u63d0\u5347 AUROC\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33818", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u5f02\u5e38\u68c0\u6d4b", "\u53ef\u89e3\u91ca\u6027", "\u591a\u6a21\u6001", "\u7a00\u758f\u81ea\u7f16\u7801\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33818v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Augmenting Visual Anomaly Detection with Automated Interpretability", "tldr": "\u672c\u6587\u7528\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5206\u89e3 PatchCore \u7684\u5f02\u5e38\u6b8b\u5dee\u4fe1\u53f7\uff0c\u5e76\u8ba9\u591a\u6a21\u6001\u5927\u6a21\u578b\u81ea\u52a8\u89e3\u91ca\u7279\u5f81\u3001\u533a\u5206\u771f\u5b9e\u5f02\u5e38\u4e0e\u5e72\u6270\u56e0\u7d20\u3002\u6839\u636e\u89e3\u91ca\u7ed3\u679c\u6291\u5236\u5e72\u6270\u7279\u5f81\u3001\u653e\u5927\u5f02\u5e38\u7279\u5f81\u540e\uff0c\u5728\u591a\u4e2a\u5f02\u5e38\u68c0\u6d4b\u57fa\u51c6\u548c\u5206\u5e03\u504f\u79fb\u573a\u666f\u4e0b\u7a33\u5b9a\u63d0\u5347 AUROC\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Motorized two-wheelers (MTW) dominate Indian roads but remain underrepresented in driver behavior research. This study presents the first large-scale analysis of MTW driver gaze behavior in naturalistic, heterogeneous urban traffic, using the \\textit{myEye2Wheeler} dataset. A semantic segmentation pipeline (YOLOv11 + SAM2) was used to extract object-level gaze metrics under two attention modes: direct gaze (foveal overlap) and central vision (parafoveal monitoring). Results reveal a functional division: central vision supports broad monitoring, while direct gaze enables brief, selective sampling. Novice riders exhibit road-anchored scanning, returning to the road between object fixations, while experienced riders form longer chains of attention across multiple objects. The findings suggest that experience primarily refines temporal rhythm rather than altering allocation strategy and reduces object-class effects in gaze patterns. These findings offer new insight into MTW attention structures and inform future work on behavior modeling and safety systems.", "arxiv_id": "2609.33811", "arxiv_url": "https://arxiv.org/abs/2609.33811", "authors": ["Prerak Srivastava", "Bhaiya Vaibhaw Kumar", "Kavita Vemuri"], "brief": "\u672c\u6587\u57fa\u4e8e myEye2Wheeler \u6570\u636e\u96c6\uff0c\u5bf9\u5370\u5ea6\u57ce\u5e02\u590d\u6742\u4ea4\u901a\u4e2d\u7684\u673a\u52a8\u4e24\u8f6e\u8f66\u9a91\u624b\u51dd\u89c6\u884c\u4e3a\u8fdb\u884c\u4e86\u5927\u89c4\u6a21\u81ea\u7136istic\ let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
