<script>
const PAPERS = [{"abstract": "Preparing high quality training data for foundation models requires scalable pipelines that transform heterogeneous documents and videos into structured records. Such pipelines expand each parent item into an ordered and input dependent sequence of children, whose counts may be long tailed. GPUs should batch children across parents while preserving parent relationships, child order, completion status, and result routing. Existing systems either hide parallelism behind coarse grained jobs or expose flat records that force applications to manage lineage and regrouping. We present RayOrch, a programming model and distributed execution engine that preserves parent child relations throughout execution. Programs declare ordered variable cardinality expansions and matching gathers. The compiler validates each pair, while the runtime records child membership, immediate parents, immutable ordinals, and terminal states. Per Call FIFO Ready Queues batch ready children across parents. Gathers reconstruct results from declared membership and ordinals rather than batch boundaries or completion order. Parents can advance as soon as all required children become terminal. Typed parent scoped failures suppress undispatched siblings of the failed parent while allowing unrelated parents to continue. On NVIDIA H20 GPUs, RayOrch achieves 15.14 times speedup when scaling MinerU from 4 to 64 GPUs and 7.82 times speedup when scaling a video pipeline from 8 to 64 GPUs. It reduces end to end time by 13.1 percent versus Ray Data and 29.0 percent versus Daft on MinerU, and by 16.0 percent versus Ray Data on Docling. Code available at https://github.com/OpenDCAI/RayOrch .", "arxiv_id": "2609.18703", "arxiv_url": "https://arxiv.org/abs/2609.18703", "authors": ["Xiaochen Ma", "Zimo Meng", "Junzhu Liang", "Youhe Jiang", "Yue Cheng", "Hao Liang", "Bohan Zeng", "Dengchun Li", "Lu Ma", "Zhengyang Zhao", "Zhen Hao Wong", "Runming He", "Meiyi Qiang", "Jiangtao Guan", "Binhang Yuan", "Wentao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa RayOrch\uff0c\u4e00\u79cd\u9762\u5411\u57fa\u7840\u6a21\u578b\u6570\u636e\u51c6\u5907\u7684\u7f16\u7a0b\u6a21\u578b\u4e0e\u5206\u5e03\u5f0f\u6267\u884c\u5f15\u64ce\u3002\u5b83\u5728\u6587\u6863/\u89c6\u9891\u5904\u7406\u6d41\u6c34\u7ebf\u4e2d\u663e\u5f0f\u4fdd\u7559\u7236\u5b50\u8840\u7f18\u3001\u5b50\u4efb\u52a1\u987a\u5e8f\u3001\u5b8c\u6210\u72b6\u6001\u4e0e\u7ed3\u679c\u8def\u7531\uff0c\u652f\u6301\u53ef\u53d8\u6570\u91cf\u5c55\u5f00\u4e0e\u5339\u914d\u805a\u5408\u3002", "categories": ["cs.DC"], "github_repo": "https://github.com/OpenDCAI/RayOrch", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2609.18703", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7a0b\u5e8f\u58f0\u660e\u6709\u5e8f\u3001\u53ef\u53d8\u57fa\u6570\u7684 expand \u4e0e\u5bf9\u5e94 gather\uff0c\u7f16\u8bd1\u5668\u9a8c\u8bc1\u5339\u914d\u5173\u7cfb\uff0c\u8fd0\u884c\u65f6\u8bb0\u5f55\u5b50\u9879\u6210\u5458\u5173\u7cfb\u3001\u7236\u9879\u3001\u4e0d\u53ef\u53d8\u5e8f\u53f7\u548c\u7ec8\u6b62\u72b6\u6001\u3002", "\u901a\u8fc7 Per Call FIFO Ready Queues \u8de8\u7236\u9879\u6279\u5904\u7406\u5c31\u7eea\u5b50\u4efb\u52a1\u4ee5\u63d0\u5347 GPU \u5229\u7528\u7387\uff0c\u540c\u65f6 gather \u6309\u58f0\u660e\u7684\u6210\u5458\u5173\u7cfb\u4e0e\u5e8f\u53f7\u91cd\u5efa\u7ed3\u679c\uff0c\u800c\u975e\u4f9d\u8d56\u6279\u8fb9\u754c\u6216\u5b8c\u6210\u987a\u5e8f\u3002", "\u5728 NVIDIA H20 \u4e0a\uff0cMinerU \u4ece 4 \u5230 64 GPU \u83b7\u5f97 15.14 \u500d\u52a0\u901f\uff0c\u89c6\u9891\u6d41\u6c34\u7ebf\u4ece 8 \u5230 64 GPU \u83b7\u5f97 7.82 \u500d\u52a0\u901f\uff1b\u7aef\u5230\u7aef\u65f6\u95f4\u8f83 Ray Data/Daft \u6709\u660e\u663e\u4e0b\u964d\u3002"], "keywords": ["\u6570\u636e\u5de5\u7a0b", "\u5206\u5e03\u5f0f\u7cfb\u7edf", "\u57fa\u7840\u6a21\u578b", "\u6570\u636e\u5904\u7406"], "num_comments": 3, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2609.18703v1", "published_at": "2026-09-16", "score": 0.546, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (45\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.18703.png", "title": "RayOrch: Programming and Executing Lineage-Controlled Multi-Grain Dataflows for Foundation-Model Data Preparation", "tldr": "RayOrch\u9ad8\u6548\u7f16\u6392\u4fdd\u8840\u7f18\u591a\u7c92\u5ea6\u6570\u636e\u6d41", "upvotes": 45, "what_it_is": "\u8bba\u6587\u63d0\u51fa RayOrch\uff0c\u4e00\u79cd\u9762\u5411\u57fa\u7840\u6a21\u578b\u6570\u636e\u51c6\u5907\u7684\u7f16\u7a0b\u6a21\u578b\u4e0e\u5206\u5e03\u5f0f\u6267\u884c\u5f15\u64ce\u3002\u5b83\u5728\u6587\u6863/\u89c6\u9891\u5904\u7406\u6d41\u6c34\u7ebf\u4e2d\u663e\u5f0f\u4fdd\u7559\u7236\u5b50\u8840\u7f18\u3001\u5b50\u4efb\u52a1\u987a\u5e8f\u3001\u5b8c\u6210\u72b6\u6001\u4e0e\u7ed3\u679c\u8def\u7531\uff0c\u652f\u6301\u53ef\u53d8\u6570\u91cf\u5c55\u5f00\u4e0e\u5339\u914d\u805a\u5408\u3002", "why_notable": "\u5b83\u9488\u5bf9\u57fa\u7840\u6a21\u578b\u6570\u636e\u51c6\u5907\u4e2d\u5e38\u89c1\u7684\u957f\u5c3e\u3001\u53ef\u53d8\u5b50\u4efb\u52a1\u548c\u8840\u7f18\u91cd\u7ec4\u96be\u9898\uff0c\u63d0\u4f9b\u4e86\u6bd4\u901a\u7528\u6570\u636e\u6d41\u7cfb\u7edf\u66f4\u8d34\u5408\u7684\u62bd\u8c61\u4e0e\u6267\u884c\u673a\u5236\uff0c\u6709\u671b\u63d0\u5347\u5927\u89c4\u6a21\u591a\u6a21\u6001\u6570\u636e\u6e05\u6d17\u3001\u89e3\u6790\u548c\u7ed3\u6784\u5316\u6d41\u6c34\u7ebf\u7684\u541e\u5410\u4e0e\u53ef\u9760\u6027\u3002"}, {"abstract": "Document rerankers determine what evidence reaches the downstream model in RAG and deep research, yet mainstream rerankers select by relevance matching, and individually relevant documents rarely constitute the complete, complementary, non-redundant set a complex information need demands. Prior work rewards a set by its aggregate rubric score, shifting the objective from ranking documents to composing sets. Yet that score is one scalar shared by every document in the set, so the supervision is sparse: a redundant document is rewarded with the rest whenever the set scores well, and a decisive one penalized with the rest whenever it does not; credit assignment leaves contributors indistinguishable from free riders. On-policy distillation could densify this supervision, but existing methods give every rollout the same fixed guidance, too prescriptive for strong rollouts and too abstract for weak ones. We therefore propose AdaTutoRank, a setwise reranker trained with Adaptive Tutoring Optimization (ATO) under a three-level hierarchy of nine rubric dimensions, which supplies silver labels for the cold start, rewards for reinforcement learning, and hints for distillation. ATO draws three hint forms of increasing specificity from the policy\u0027s own frozen snapshot: the rubrics alone, a self-selector\u0027s sibling-set chosen under rubrics, and a self-reflector\u0027s reflection contrasting the rollout with that sibling-set; each rollout receives the form matched to its quality. Re-scoring that rollout under the hint-conditioned frozen teacher and the hint-free snapshot distills the hint\u0027s effect into a token-level advantage that complements the group-relative outcome advantage. Across ten benchmarks spanning RAG, deep research, and setwise evaluation, AdaTutoRank attains the best overall performance while issuing fewer retrieval calls.", "arxiv_id": "2609.32472", "arxiv_url": "https://arxiv.org/abs/2609.32472", "authors": ["Kailin Jiang", "Lei Liu", "Jian Xi", "Yangqi Chen", "Hui Xu", "Hongwei Zhao", "Bin Li", "Yu Lu", "Haibo Shi"], "brief": "\u8bba\u6587\u63d0\u51fa AdaTutoRank\uff0c\u4e00\u79cd\u9762\u5411 RAG \u4e0e\u6df1\u5ea6\u7814\u7a76\u7684\u96c6\u5408\u7ea7\u6587\u6863\u91cd\u6392\u5e8f\u5668\uff0c\u4e0d\u518d\u53ea\u6309\u5355\u7bc7\u76f8\u5173\u6027\u6392\u5e8f\uff0c\u800c\u662f\u4f18\u5316\u6587\u6863\u96c6\u5408\u7684\u5b8c\u6574\u6027\u3001\u4e92\u8865\u6027\u4e0e\u4f4e\u5197\u4f59\u3002\u5176\u6838\u5fc3\u8bad\u7ec3\u65b9\u6cd5 Adaptive Tutoring Optimization \u4f1a\u6839\u636e\u6a21\u578b\u5f53\u524d\u8f93\u51fa\u8d28\u91cf\u63d0\u4f9b\u4e0d\u540c\u7c92\u5ea6\u7684\u201c\u8f85\u5bfc\u201d\u4fe1\u53f7\uff0c\u4ee5\u7f13\u89e3\u96c6\u5408\u7ea7\u5956\u52b1\u4e2d\u7684\u4fe1\u7528\u5206\u914d\u7a00\u758f\u95ee\u9898\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/AdaTutoRank/AdaTutoRank", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.32472", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u4e09\u5c42\u4e5d\u7ef4 rubric \u4f53\u7cfb\uff0c\u540c\u65f6\u7528\u4e8e\u51b7\u542f\u52a8\u94f6\u6807\u7b7e\u3001\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u548c\u84b8\u998f\u63d0\u793a\u3002", "ATO \u63d0\u4f9b\u4e09\u79cd\u7531\u51bb\u7ed3\u7b56\u7565\u5feb\u7167\u751f\u6210\u7684\u81ea\u9002\u5e94\u63d0\u793a\uff1a\u4ec5 rubric\u3001\u57fa\u4e8e rubric \u7684 sibling-set \u9009\u62e9\u3001\u4ee5\u53ca\u5bf9 rollout \u4e0e sibling-set \u7684\u53cd\u601d\u5bf9\u6bd4\u3002", "\u901a\u8fc7\u6bd4\u8f83\u6709\u63d0\u793a\u6559\u5e08\u4e0e\u65e0\u63d0\u793a\u5feb\u7167\u7684\u91cd\u8bc4\u5206\uff0c\u5c06\u63d0\u793a\u6548\u679c\u84b8\u998f\u4e3a token \u7ea7 advantage\uff0c\u5e76\u7ed3\u5408 group-relative outcome advantage \u8bad\u7ec3\u3002", "\u5728\u8986\u76d6 RAG\u3001\u6df1\u5ea6\u7814\u7a76\u548c\u96c6\u5408\u7ea7\u8bc4\u6d4b\u7684\u5341\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u4f73\u6574\u4f53\u6027\u80fd\uff0c\u540c\u65f6\u51cf\u5c11\u68c0\u7d22\u8c03\u7528\u6b21\u6570\u3002"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u91cd\u6392\u5e8f", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2609.32472v1", "published_at": "2026-09-26", "score": 0.495, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32472.png", "title": "AdaTutoRank: Learning to Rerank Document Sets via Adaptive Tutoring Optimization for RAG and Deep Research", "tldr": "\u81ea\u9002\u5e94\u63d0\u793a\u4f18\u5316\u8bad\u7ec3\u96c6\u5408\u91cd\u6392\u5e8f\u5668", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa AdaTutoRank\uff0c\u4e00\u79cd\u9762\u5411 RAG \u4e0e\u6df1\u5ea6\u7814\u7a76\u7684\u96c6\u5408\u7ea7\u6587\u6863\u91cd\u6392\u5e8f\u5668\uff0c\u4e0d\u518d\u53ea\u6309\u5355\u7bc7\u76f8\u5173\u6027\u6392\u5e8f\uff0c\u800c\u662f\u4f18\u5316\u6587\u6863\u96c6\u5408\u7684\u5b8c\u6574\u6027\u3001\u4e92\u8865\u6027\u4e0e\u4f4e\u5197\u4f59\u3002\u5176\u6838\u5fc3\u8bad\u7ec3\u65b9\u6cd5 Adaptive Tutoring Optimization \u4f1a\u6839\u636e\u6a21\u578b\u5f53\u524d\u8f93\u51fa\u8d28\u91cf\u63d0\u4f9b\u4e0d\u540c\u7c92\u5ea6\u7684\u201c\u8f85\u5bfc\u201d\u4fe1\u53f7\uff0c\u4ee5\u7f13\u89e3\u96c6\u5408\u7ea7\u5956\u52b1\u4e2d\u7684\u4fe1\u7528\u5206\u914d\u7a00\u758f\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u91cd\u6392\u5e8f\u76ee\u6807\u4ece\u201c\u627e\u6700\u76f8\u5173\u6587\u6863\u201d\u63a8\u8fdb\u5230\u201c\u7ec4\u5408\u6700\u6709\u7528\u8bc1\u636e\u96c6\u201d\uff0c\u5e76\u7528\u81ea\u9002\u5e94\u8f85\u5bfc\u89e3\u51b3\u96c6\u5408\u7ea7\u5956\u52b1\u96be\u4ee5\u7ed9\u5355\u6587\u6863\u5206\u914d\u8d21\u732e\u7684\u95ee\u9898\uff0c\u5bf9\u590d\u6742\u95ee\u7b54\u3001\u957f\u94fe\u7814\u7a76\u548c\u9ad8\u6210\u672c\u68c0\u7d22\u573a\u666f\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Existing point tracking models face a fundamental tradeoff: they can either track a sparse set of query points over long horizons, or track all points across only short clips. We introduce TrackEverything, a 3D point tracker that breaks this trade-off by representing videos as persistent 3D scene tracks in world coordinates. Grounded in the insight that videos are 2D projections of an underlying 3D world, TrackEverything decouples model complexity from video duration, allowing it to scale with unique physical scene geometry instead. Our approach introduces three key innovations. First, we employ a voxelization-based de-duplication mechanism at sliding-window boundaries to merge co-located tracks, preventing repeated observations of the same surface from redundantly accumulating. Second, we decompose tracking into an endpoint refiner that predicts each point\u0027s destination and static-versus-dynamic classification, followed by a lightweight trajectory refiner that decodes dense trajectories exclusively for dynamic points. Third, we propose 3D WAFT, replacing memory-prohibitive 4D correlation volumes with efficient feature sampling in the scene cloud. To the best of our knowledge, TrackEverything is the first 3D tracker capable of tracking all visible points across videos exceeding 1000 frames within 40 GB of GPU memory. On TAPVid-3D, TrackEverything outperforms all open-source all-frame dense 3D trackers by more than 20% APD on short clips, while remaining competitive with state-of-the-art sparse trackers on long sequences, despite tracking far more points.", "arxiv_id": "2609.30222", "arxiv_url": "https://arxiv.org/abs/2609.30222", "authors": ["Ayush Jain", "Sreeharsha Paruchuri", "Ishita Gupta", "Fan Zhang", "Tanner Schmidt", "Jakob Engel", "Katerina Fragkiadaki", "Adam W. Harley"], "brief": "TrackEverything \u5c06\u89c6\u9891\u8868\u793a\u4e3a\u4e16\u754c\u5750\u6807\u4e2d\u7684\u6301\u4e45\u5316 3D \u573a\u666f\u8f68\u8ff9\uff0c\u628a\u8ddf\u8e2a\u590d\u6742\u5ea6\u4ece\u89c6\u9891\u65f6\u957f\u8f6c\u79fb\u5230\u72ec\u7279\u7269\u7406\u51e0\u4f55\u89c4\u6a21\u4e0a\u3002\u5b83\u9996\u6b21\u572840GB\u663e\u5b58\u5185\u5b9e\u73b0\u8d85\u8fc71000\u5e27\u89c6\u9891\u7684\u5168\u53ef\u89c1\u70b9\u7a20\u5bc63D\u8ddf\u8e2a\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30222", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u6ed1\u52a8\u7a97\u53e3\u8fb9\u754c\u4f7f\u7528\u57fa\u4e8e\u4f53\u7d20\u5316\u7684\u53bb\u91cd\u673a\u5236\uff0c\u5408\u5e76\u5171\u5740\u8f68\u8ff9\uff0c\u907f\u514d\u540c\u4e00\u8868\u9762\u88ab\u91cd\u590d\u7d2f\u79ef\u3002", "\u5c06\u8ddf\u8e2a\u5206\u89e3\u4e3a\u7ec8\u70b9\u7ec6\u5316\u5668\u548c\u8f7b\u91cf\u8f68\u8ff9\u7ec6\u5316\u5668\uff1a\u5148\u9884\u6d4b\u76ee\u6807\u4f4d\u7f6e\u4e0e\u9759/\u52a8\u6001\u5206\u7c7b\uff0c\u518d\u4ec5\u4e3a\u52a8\u6001\u70b9\u89e3\u7801\u7a20\u5bc6\u8f68\u8ff9\u3002", "\u63d0\u51fa3D WAFT\uff0c\u7528\u573a\u666f\u70b9\u4e91\u4e2d\u7684\u9ad8\u6548\u7279\u5f81\u91c7\u6837\u66ff\u4ee3\u663e\u5b58\u5f00\u9500\u5de8\u5927\u76844D\u76f8\u5173\u4f53\uff1b\u5728TAPVid-3D\u4e0a\u77ed\u89c6\u9891APD\u8f83\u5f00\u6e90\u5168\u5e27\u7a20\u5bc63D\u8ddf\u8e2a\u5668\u63d0\u5347\u8d85\u8fc720%\u3002"], "keywords": ["\u4e09\u7ef4\u89c6\u89c9", "\u70b9\u8ddf\u8e2a", "\u89c6\u9891\u7406\u89e3", "\u673a\u5668\u4eba\u611f\u77e5"], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2609.30222v1", "published_at": "2026-09-24", "score": 0.486, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.30222.png", "title": "TrackEverything: Long Horizon Dense Tracking via De-Duplicating 3D Scene Representations", "tldr": "\u7528\u53bb\u91cd3D\u573a\u666f\u8868\u793a\u5b9e\u73b0\u5343\u5e27\u7ea7\u7a20\u5bc6\u70b9\u8ddf\u8e2a", "upvotes": 7, "what_it_is": "TrackEverything \u5c06\u89c6\u9891\u8868\u793a\u4e3a\u4e16\u754c\u5750\u6807\u4e2d\u7684\u6301\u4e45\u5316 3D \u573a\u666f\u8f68\u8ff9\uff0c\u628a\u8ddf\u8e2a\u590d\u6742\u5ea6\u4ece\u89c6\u9891\u65f6\u957f\u8f6c\u79fb\u5230\u72ec\u7279\u7269\u7406\u51e0\u4f55\u89c4\u6a21\u4e0a\u3002\u5b83\u9996\u6b21\u572840GB\u663e\u5b58\u5185\u5b9e\u73b0\u8d85\u8fc71000\u5e27\u89c6\u9891\u7684\u5168\u53ef\u89c1\u70b9\u7a20\u5bc63D\u8ddf\u8e2a\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7a81\u7834\u4e86\u73b0\u6709\u70b9\u8ddf\u8e2a\u201c\u957f\u65f6\u7a0b\u53ea\u80fd\u7a00\u758f\u3001\u7a20\u5bc6\u53ea\u80fd\u77ed\u7247\u6bb5\u201d\u7684\u6838\u5fc3\u74f6\u9888\uff0c\u5bf9\u957f\u89c6\u9891\u7406\u89e3\u3001\u673a\u5668\u4eba\u611f\u77e5\u3001\u52a8\u6001\u573a\u666f\u91cd\u5efa\u548c\u7269\u4f53\u4ea4\u4e92\u5206\u6790\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Human hand-object interactions (HOIs) provide a rich source of demonstrations for dexterous manipulation, but learning directly from them presents challenges in bridging morphology gaps, ensuring dynamical feasibility, and sim-to-real deployment. We present Morphometric Imitation, a three-stage framework that transforms reconstructed HOIs into zero-shot sim-to-real visuomotor policies. First, morphometric optimization (MMO) kinematically retargets human motion across hand morphologies while preserving demonstrated contacts. Second, residual reinforcement learning (RL) refines the kinematic reference using object pose and contact information from the human motion to produce dynamically feasible robot demonstrations. Third, these demonstrations are distilled into visuomotor policies. Across three robot hands and ten HOIs, MMO outperforms five baselines in contact F1, improving on the strongest ones by 8 to 28 points, while improving the success rate of downstream dynamic retargeting by as much as 35 points. On a Sharpa hand, the visuomotor policies achieve 89.3% zero-shot success in 300 real-world trials on 30 objects spanning 10 categories. Project page: https://morphometricimitation.github.io", "arxiv_id": "2609.28660", "arxiv_url": "https://arxiv.org/abs/2609.28660", "authors": ["Tara Sadjadpour", "Siming He", "C. K. Wolfe", "Haozhi Qi", "Lea Wilken", "S. Shankar Sastry", "Claire Tomlin", "Jitendra Malik"], "brief": "\u8bba\u6587\u63d0\u51fa Morphometric Imitation \u4e09\u9636\u6bb5\u6846\u67b6\uff0c\u628a\u91cd\u5efa\u7684\u4eba\u624b-\u7269\u4f53\u4ea4\u4e92\u6f14\u793a\u8f6c\u5316\u4e3a\u53ef\u96f6\u6837\u672c\u90e8\u7f72\u5230\u771f\u5b9e\u673a\u5668\u4eba\u624b\u7684\u89c6\u89c9\u8fd0\u52a8\u7b56\u7565\u3002\u6846\u67b6\u4f9d\u6b21\u8fdb\u884c\u4fdd\u6301\u63a5\u89e6\u7684\u5f62\u6001\u611f\u77e5\u52a8\u4f5c\u91cd\u5b9a\u5411\u3001\u6b8b\u5dee\u5f3a\u5316\u5b66\u4e60\u52a8\u6001\u53ef\u884c\u5316\uff0c\u4ee5\u53ca\u7b56\u7565\u84b8\u998f\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/tsadja/morphometric", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2609.28660", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5f62\u6001\u4f18\u5316\uff08MMO\uff09\u5728\u4e0d\u540c\u624b\u90e8\u5f62\u6001\u95f4\u91cd\u5b9a\u5411\u4eba\u624b\u52a8\u4f5c\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u7559\u6f14\u793a\u4e2d\u7684\u63a5\u89e6\u5173\u7cfb", "\u6b8b\u5dee\u5f3a\u5316\u5b66\u4e60\u5229\u7528\u4eba\u7c7b\u6f14\u793a\u4e2d\u7684\u7269\u4f53\u4f4d\u59ff\u4e0e\u63a5\u89e6\u4fe1\u606f\uff0c\u751f\u6210\u52a8\u6001\u53ef\u884c\u7684\u673a\u5668\u4eba\u793a\u8303", "\u57283\u79cd\u673a\u5668\u4eba\u624b\u300110\u7c7b\u4eba\u624b-\u7269\u4f53\u4ea4\u4e92\u4e0a\uff0cMMO\u8f83\u6700\u5f3a\u57fa\u7ebf\u63a5\u89e6F1\u63d0\u53478\u523028\u70b9\uff1bSharpa\u624b\u771f\u5b9e\u5b9e\u9a8c\u4e2d30\u4e2a\u7269\u4f53300\u6b21\u8bd5\u9a8c\u8fbe89.3%\u96f6\u6837\u672c\u6210\u529f\u7387"], "keywords": ["\u7075\u5de7\u64cd\u4f5c", "\u6a21\u4eff\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u4eff\u771f\u5230\u73b0\u5b9e"], "num_comments": 1, "on_hf": true, "organization": "UC Berkeley", "pdf_url": "https://arxiv.org/pdf/2609.28660v2", "published_at": "2026-09-23", "score": 0.48, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Berkeley", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.28660.png", "title": "Morphometric Imitation: From Morphology and Contact Aware Hand Retargeting to Sim-to-Real Visuomotor Policy", "tldr": "\u5c06\u4eba\u624b\u6f14\u793a\u8f6c\u5316\u4e3a\u771f\u5b9e\u673a\u5668\u4eba\u7075\u5de7\u64cd\u4f5c\u7b56\u7565", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Morphometric Imitation \u4e09\u9636\u6bb5\u6846\u67b6\uff0c\u628a\u91cd\u5efa\u7684\u4eba\u624b-\u7269\u4f53\u4ea4\u4e92\u6f14\u793a\u8f6c\u5316\u4e3a\u53ef\u96f6\u6837\u672c\u90e8\u7f72\u5230\u771f\u5b9e\u673a\u5668\u4eba\u624b\u7684\u89c6\u89c9\u8fd0\u52a8\u7b56\u7565\u3002\u6846\u67b6\u4f9d\u6b21\u8fdb\u884c\u4fdd\u6301\u63a5\u89e6\u7684\u5f62\u6001\u611f\u77e5\u52a8\u4f5c\u91cd\u5b9a\u5411\u3001\u6b8b\u5dee\u5f3a\u5316\u5b66\u4e60\u52a8\u6001\u53ef\u884c\u5316\uff0c\u4ee5\u53ca\u7b56\u7565\u84b8\u998f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7cfb\u7edf\u6027\u89e3\u51b3\u4e86\u4ece\u4eba\u624b\u6f14\u793a\u5230\u673a\u5668\u4eba\u7075\u5de7\u64cd\u4f5c\u4e2d\u7684\u5f62\u6001\u5dee\u5f02\u3001\u52a8\u529b\u5b66\u53ef\u884c\u6027\u548c\u4eff\u771f\u5230\u73b0\u5b9e\u8fc1\u79fb\u95ee\u9898\uff0c\u5c55\u793a\u4e86\u8f83\u5f3a\u7684\u771f\u5b9e\u4e16\u754c\u96f6\u6837\u672c\u6cdb\u5316\u80fd\u529b\uff0c\u5bf9\u4f4e\u6210\u672c\u83b7\u53d6\u7075\u5de7\u64cd\u4f5c\u6570\u636e\u548c\u8bad\u7ec3\u673a\u5668\u4eba\u624b\u7b56\u7565\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reward models underpin the alignment of large language models, yet the dominant designs reduce each prompt--response pair to a point estimate or to a distribution from a fixed parametric family. This is at odds with human preference, which is inherently multimodal: the same response can be reasonably judged in many ways, and no single family covers all of them. To better fit this structure, we introduce DRM, a Diffusion Reward Model that recasts reward modeling as conditional density estimation over $p(\\mathbf{r}\\mid x,y)$. Conditioned on a frozen LLM encoder, a lightweight Diffusion Transformer denoises Gaussian noise into a reward vector, placing no parametric assumption on the output distribution and naturally representing its multimodal structure. A single architecture handles both multi-attribute regression and pairwise preference data, and at inference $N$ samples form an empirical reward distribution that can be aggregated into a scalar, a variance, or quantiles. Across five benchmarks, DRM matches or surpasses baselines under matched data and backbone, stays competitive with much larger discriminative, distributional, and generative RMs despite its modest training scale, and recovers multimodal reward structure where conventional heads collapse to a point. Uncertainty-aware rejection and lower-confidence-bound (LCB) aggregation further demonstrate that DRM can exploit distributional information beyond a scalar reward to improve reward-model decisions. Downstream RLHF experiments additionally show that using DRM as the training-time reward leads to improved policy performance, directly validating the practical benefit of diffusion-based reward modeling for RLHF training.", "arxiv_id": "2609.33803", "arxiv_url": "https://arxiv.org/abs/2609.33803", "authors": ["Xiangyang Wang", "Bingxiang He", "Zeyuan Liu", "Jiaze WangZiqing Qiao", "Yuxin Zuo", "Huan-ang Gao", "Cheng Qian", "Wenbin Zhang", "Ran Li", "Youbang Sun", "Ning Ding", "Yuanchun Shi", "Zhiyuan Liu", "Chaojun Xiao", "Chun Yu"], "brief": "\u8bba\u6587\u63d0\u51fa Diffusion Reward Model\uff08DRM\uff09\uff0c\u5c06\u5956\u52b1\u5efa\u6a21\u91cd\u6784\u4e3a\u6761\u4ef6\u5bc6\u5ea6\u4f30\u8ba1 p(r|x,y)\uff0c\u800c\u975e\u5355\u4e00\u70b9\u4f30\u8ba1\u6216\u56fa\u5b9a\u5206\u5e03\u5047\u8bbe\u3002\u5b83\u7528\u51bb\u7ed3 LLM \u7f16\u7801\u5668\u52a0\u8f7b\u91cf Diffusion Transformer \u751f\u6210\u5956\u52b1\u5411\u91cf\uff0c\u53ef\u7edf\u4e00\u5904\u7406\u591a\u5c5e\u6027\u56de\u5f52\u4e0e\u6210\u5bf9\u504f\u597d\u6570\u636e\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/thunlp/DRM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33803", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u6269\u6563\u53bb\u566a\u751f\u6210\u5956\u52b1\u5206\u5e03\uff0c\u907f\u514d\u9ad8\u65af\u7b49\u56fa\u5b9a\u53c2\u6570\u65cf\u5047\u8bbe\uff0c\u66f4\u81ea\u7136\u8868\u8fbe\u591a\u5cf0\u4eba\u7c7b\u504f\u597d\u3002", "\u63a8\u7406\u65f6\u91c7\u6837 N \u4e2a\u5956\u52b1\u5f62\u6210\u7ecf\u9a8c\u5206\u5e03\uff0c\u53ef\u805a\u5408\u4e3a\u6807\u91cf\u5956\u52b1\u3001\u65b9\u5dee\u3001\u5206\u4f4d\u6570\u6216 LCB \u7b49\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u6307\u6807\u3002", "\u5728\u4e94\u4e2a\u57fa\u51c6\u4e0a\u5339\u914d\u6216\u8d85\u8fc7\u540c\u7b49\u8bbe\u7f6e\u57fa\u7ebf\uff0c\u5e76\u5728 RLHF \u4e0b\u6e38\u5b9e\u9a8c\u4e2d\u63d0\u5347\u7b56\u7565\u6027\u80fd\u3002"], "keywords": ["\u5956\u52b1\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "RLHF", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "Tsinghua NLP Group", "pdf_url": "https://arxiv.org/pdf/2609.33803v1", "published_at": "2026-09-27", "score": 0.446, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33803.png", "title": "Diffusion Reward Models", "tldr": "\u7528\u6269\u6563\u6a21\u578b\u523b\u753b\u591a\u5cf0\u4eba\u7c7b\u504f\u597d\u5956\u52b1", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Diffusion Reward Model\uff08DRM\uff09\uff0c\u5c06\u5956\u52b1\u5efa\u6a21\u91cd\u6784\u4e3a\u6761\u4ef6\u5bc6\u5ea6\u4f30\u8ba1 p(r|x,y)\uff0c\u800c\u975e\u5355\u4e00\u70b9\u4f30\u8ba1\u6216\u56fa\u5b9a\u5206\u5e03\u5047\u8bbe\u3002\u5b83\u7528\u51bb\u7ed3 LLM \u7f16\u7801\u5668\u52a0\u8f7b\u91cf Diffusion Transformer \u751f\u6210\u5956\u52b1\u5411\u91cf\uff0c\u53ef\u7edf\u4e00\u5904\u7406\u591a\u5c5e\u6027\u56de\u5f52\u4e0e\u6210\u5bf9\u504f\u597d\u6570\u636e\u3002", "why_notable": "\u5b83\u628a\u5956\u52b1\u6a21\u578b\u4ece\u201c\u7ed9\u5206\u5668\u201d\u63a8\u8fdb\u5230\u201c\u504f\u597d\u5206\u5e03\u5efa\u6a21\u5668\u201d\uff0c\u80fd\u5229\u7528\u4e0d\u786e\u5b9a\u6027\u548c\u591a\u5cf0\u7ed3\u6784\u6539\u8fdb\u62d2\u7edd\u51b3\u7b56\u4e0e RLHF \u8bad\u7ec3\uff0c\u5bf9 LLM \u5bf9\u9f50\u66f4\u8d34\u8fd1\u771f\u5b9e\u4eba\u7c7b\u504f\u597d\u3002"}, {"abstract": "Symbolic models make melody, harmony, rhythm, and form explicit but typically stop before a finished recording; audio models produce complete songs while leaving composition implicit. We introduce YuE2, which unifies symbolic and audio music generation at frontier quality through symbolic planning. A single AR-NAR Mixture-of-Transformers (MoT) first writes a readable score specifying melody and harmony, expands it into semantic music tokens, and realizes it as full-song audio. In comparisons using the same checkpoint, experts prefer symbolic planning for overall quality and musicality, with 49.3% of overall preferences versus 34.6% without planning. Experts also favor the unified model over a separate language model and diffusion Transformer. On WildSongBench, YuE2 scores 6.73 on SongBench Global Avg, exceeding all evaluated public baselines. Selecting from eight candidates (best-of-8), YuE2 reaches 6.96, the highest observed mean among all evaluated systems. Expert listening further establishes its competitiveness with proprietary song generators, favoring best-of-8 over Suno v4.5 and yielding nearly balanced preferences against Suno v5. To learn this generation process from recordings without aligned scores, we introduce MERT2 and SheetSage2 to supply semantic and symbolic supervision. MERT2 sets a new state of the art in music representation learning, surpassing previous best results on 14 of 15 MARBLE metrics; SheetSage2 leads 12 of 15 benchmark-metric pairs in our lead-sheet transcription comparison. The same checkpoint follows score edits while largely preserving unedited musical content and generates zero-shot covers without cover-specific training. Its readable score also enables agentic music editing, with external language models translating user feedback into revisions of the composition.", "arxiv_id": "2609.33757", "arxiv_url": "https://arxiv.org/abs/2609.33757", "authors": ["Ruibin Yuan", "Jiahao Pan", "Junyan Jiang", "Zhiyue Wu", "Ziya Zhou", "Jiankai Sun", "Yizhi Li", "Ge Zhang", "Yicheng Gu", "Zeyue Tian", "Junyu Dai", "Hanfeng Lin", "Kai Li", "Shangda Wu", "Xuanjie Liu", "Jiaming Wang", "Zihan Liu", "Yue Wang", "Yinghao Ma", "Hanzhi Yin", "Kangrui Chen", "Xinyue Zhang", "Ziyang Ma", "Mengqi Liao", "Hejia Zhao", "Guowei Huang", "Chao Yan", "Lei Ke", "Jianwei Yu", "Bei Liu", "Joe Guo", "Liumeng Xue", "Gus Xia", "Wei Xue", "Yike Guo"], "brief": "\u8bba\u6587\u63d0\u51fa YuE2\uff0c\u5c06\u4e50\u8c31\u5f0f\u7b26\u53f7\u751f\u6210\u4e0e\u5168\u6b4c\u66f2\u97f3\u9891\u751f\u6210\u7edf\u4e00\u5230\u4e00\u4e2a AR-NAR Mixture-of-Transformers \u6a21\u578b\u4e2d\u3002\u6a21\u578b\u5148\u751f\u6210\u53ef\u8bfb\u4e50\u8c31\uff0c\u518d\u6269\u5c55\u4e3a\u8bed\u4e49\u97f3\u4e50 token\uff0c\u6700\u7ec8\u5408\u6210\u4e3a\u5b8c\u6574\u97f3\u9891\u3002", "categories": ["eess.AS", "cs.LG", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33757", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["\u7b26\u53f7\u89c4\u5212\u663e\u8457\u63d0\u5347\u4e13\u5bb6\u504f\u597d\uff1a\u6574\u4f53\u8d28\u91cf\u4e0e\u97f3\u4e50\u6027\u504f\u597d\u7387\u4e3a 49.3%\uff0c\u9ad8\u4e8e\u65e0\u89c4\u5212\u7684 34.6%\u3002", "\u5728 WildSongBench \u4e0a SongBench Global Avg \u8fbe 6.73\uff0cbest-of-8 \u8fbe 6.96\uff0c\u8d85\u8fc7\u516c\u5f00\u57fa\u7ebf\u5e76\u63a5\u8fd1\u4e13\u6709\u6b4c\u66f2\u751f\u6210\u5668\u3002", "\u5f15\u5165 MERT2 \u4e0e SheetSage2\uff0c\u4ece\u65e0\u5bf9\u9f50\u4e50\u8c31\u7684\u5f55\u97f3\u4e2d\u63d0\u4f9b\u8bed\u4e49\u4e0e\u7b26\u53f7\u76d1\u7763\uff0c\u5e76\u5728\u97f3\u4e50\u8868\u5f81\u5b66\u4e60\u548c\u4e3b\u65cb\u5f8b\u8c31\u8f6c\u5199\u57fa\u51c6\u4e0a\u53d6\u5f97\u9886\u5148\u3002"], "keywords": ["\u97f3\u4e50\u751f\u6210", "\u591a\u6a21\u6001", "\u7b26\u53f7\u97f3\u4e50", "\u97f3\u9891\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Multimodal Art Projection", "pdf_url": "https://arxiv.org/pdf/2609.33757v1", "published_at": "2026-09-27", "score": 0.408, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33757.png", "title": "YuE2: Unifying Symbolic and Audio Music Generation at Frontier Quality", "tldr": "YuE2\u7528\u7b26\u53f7\u89c4\u5212\u751f\u6210\u524d\u6cbf\u7ea7\u5b8c\u6574\u6b4c\u66f2", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa YuE2\uff0c\u5c06\u4e50\u8c31\u5f0f\u7b26\u53f7\u751f\u6210\u4e0e\u5168\u6b4c\u66f2\u97f3\u9891\u751f\u6210\u7edf\u4e00\u5230\u4e00\u4e2a AR-NAR Mixture-of-Transformers \u6a21\u578b\u4e2d\u3002\u6a21\u578b\u5148\u751f\u6210\u53ef\u8bfb\u4e50\u8c31\uff0c\u518d\u6269\u5c55\u4e3a\u8bed\u4e49\u97f3\u4e50 token\uff0c\u6700\u7ec8\u5408\u6210\u4e3a\u5b8c\u6574\u97f3\u9891\u3002", "why_notable": "\u5b83\u628a\u201c\u53ef\u7f16\u8f91\u3001\u53ef\u89e3\u91ca\u7684\u4f5c\u66f2\u7ed3\u6784\u201d\u548c\u201c\u9ad8\u8d28\u91cf\u5b8c\u6574\u97f3\u9891\u751f\u6210\u201d\u7ed3\u5408\u8d77\u6765\uff0c\u4e0d\u4ec5\u63d0\u5347\u6b4c\u66f2\u751f\u6210\u8d28\u91cf\uff0c\u8fd8\u652f\u6301\u4e50\u8c31\u7f16\u8f91\u3001\u96f6\u6837\u672c\u7ffb\u5531\u548c\u57fa\u4e8e\u7528\u6237\u53cd\u9988\u7684\u97f3\u4e50\u4fee\u6539\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Despite recent progress in agentic multi-shot video generation, producing coherent and consistent long-form stories remains challenging. Existing agentic pipelines typically rely on textual shot plans or previously generated pixels, yet lack an explicit mechanism for propagating the consequences of story events and maintaining the video world state across shots. As a result, missing visual details may be reconstructed inaccurately, while visual drift may propagate across subsequent shots, undermining both narrative coherence and visual consistency. To address these challenges, we propose StoryEngine, a state-grounded agentic framework for video storytelling. StoryEngine establishes a separation between authoritative semantic plans and unreliable visual observations. Specifically, StoryEngine maintains a structured representation of entity placement and story-relevant states, and propagates event-induced changes to define the intended start and end states of each shot. To visually realize these states, StoryEngine constructs canonical references for recurring entities and environments, and compiles state and visual constraints into executable render plans. Meanwhile, to realize these states correctly, a bounded evaluation-guided repair loop further corrects local state inconsistencies. Together, these mechanisms preserve causal story progression and prevent local visual errors from propagating across shots. To comprehensively evaluate long-form storytelling, we construct a benchmark across diverse scenarios and visual styles, with metrics assessing storytelling quality, narrative coherence, and visual consistency. Experimental results demonstrate that StoryEngine consistently outperforms state-of-the-art methods across all evaluation dimensions, validating its effectiveness for coherent and consistent video storytelling.", "arxiv_id": "2609.33627", "arxiv_url": "https://arxiv.org/abs/2609.33627", "authors": ["Yingrui Wang", "Zeqing Wang", "Yeying Jin"], "brief": "StoryEngine \u63d0\u51fa\u4e00\u79cd\u72b6\u6001\u9a71\u52a8\u7684\u667a\u80fd\u4f53\u5f0f\u89c6\u9891\u53d9\u4e8b\u6846\u67b6\uff0c\u901a\u8fc7\u7ef4\u62a4\u7ed3\u6784\u5316\u7684\u5b9e\u4f53\u4f4d\u7f6e\u4e0e\u6545\u4e8b\u72b6\u6001\uff0c\u5728\u591a\u955c\u5934\u751f\u6210\u4e2d\u663e\u5f0f\u4f20\u64ad\u4e8b\u4ef6\u540e\u679c\u3002\u5b83\u5c06\u8bed\u4e49\u8ba1\u5212\u4e0e\u4e0d\u53ef\u9760\u7684\u89c6\u89c9\u89c2\u6d4b\u5206\u79bb\uff0c\u5e76\u7ed3\u5408\u53c2\u8003\u6784\u5efa\u3001\u6e32\u67d3\u8ba1\u5212\u4e0e\u8bc4\u4f30\u4fee\u590d\u5faa\u73af\u6765\u51cf\u5c11\u53d9\u4e8b\u548c\u89c6\u89c9\u6f02\u79fb\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33627", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7ef4\u62a4\u5b9e\u4f53\u4f4d\u7f6e\u3001\u73af\u5883\u4e0e\u6545\u4e8b\u76f8\u5173\u72b6\u6001\u7684\u7ed3\u6784\u5316\u8868\u793a\uff0c\u5b9a\u4e49\u6bcf\u4e2a\u955c\u5934\u7684\u9884\u671f\u8d77\u6b62\u72b6\u6001", "\u4e3a\u91cd\u590d\u51fa\u73b0\u7684\u89d2\u8272\u548c\u573a\u666f\u6784\u5efa\u89c4\u8303\u89c6\u89c9\u53c2\u8003\uff0c\u5e76\u5c06\u72b6\u6001\u7ea6\u675f\u7f16\u8bd1\u4e3a\u53ef\u6267\u884c\u6e32\u67d3\u8ba1\u5212", "\u5f15\u5165\u6709\u754c\u7684\u8bc4\u4f30\u5f15\u5bfc\u4fee\u590d\u5faa\u73af\uff0c\u7ea0\u6b63\u5c40\u90e8\u72b6\u6001\u4e0d\u4e00\u81f4\uff0c\u907f\u514d\u9519\u8bef\u8de8\u955c\u5934\u4f20\u64ad"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u667a\u80fd\u4f53", "\u4e16\u754c\u72b6\u6001", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33627v1", "published_at": "2026-09-27", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "StoryEngine: A State-Grounded Agentic Framework for Video Storytelling", "tldr": "\u7528\u663e\u5f0f\u4e16\u754c\u72b6\u6001\u63d0\u5347\u957f\u89c6\u9891\u6545\u4e8b\u4e00\u81f4\u6027", "upvotes": 0, "what_it_is": "StoryEngine \u63d0\u51fa\u4e00\u79cd\u72b6\u6001\u9a71\u52a8\u7684\u667a\u80fd\u4f53\u5f0f\u89c6\u9891\u53d9\u4e8b\u6846\u67b6\uff0c\u901a\u8fc7\u7ef4\u62a4\u7ed3\u6784\u5316\u7684\u5b9e\u4f53\u4f4d\u7f6e\u4e0e\u6545\u4e8b\u72b6\u6001\uff0c\u5728\u591a\u955c\u5934\u751f\u6210\u4e2d\u663e\u5f0f\u4f20\u64ad\u4e8b\u4ef6\u540e\u679c\u3002\u5b83\u5c06\u8bed\u4e49\u8ba1\u5212\u4e0e\u4e0d\u53ef\u9760\u7684\u89c6\u89c9\u89c2\u6d4b\u5206\u79bb\uff0c\u5e76\u7ed3\u5408\u53c2\u8003\u6784\u5efa\u3001\u6e32\u67d3\u8ba1\u5212\u4e0e\u8bc4\u4f30\u4fee\u590d\u5faa\u73af\u6765\u51cf\u5c11\u53d9\u4e8b\u548c\u89c6\u89c9\u6f02\u79fb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u957f\u89c6\u9891\u751f\u6210\u4e2d\u7684\u6838\u5fc3\u75db\u70b9\u2014\u2014\u8de8\u955c\u5934\u56e0\u679c\u8fde\u8d2f\u4e0e\u89c6\u89c9\u4e00\u81f4\u6027\uff0c\u63d0\u51fa\u663e\u5f0f\u4e16\u754c\u72b6\u6001\u4f5c\u4e3a\u53d9\u4e8b\u63a7\u5236\u4e2d\u67a2\uff0c\u6bd4\u4ec5\u4f9d\u8d56\u6587\u672c\u5206\u955c\u6216\u5386\u53f2\u50cf\u7d20\u66f4\u7a33\u5065\uff0c\u5e76\u6784\u5efa\u4e86\u9762\u5411\u957f\u7bc7\u89c6\u9891\u53d9\u4e8b\u7684\u7efc\u5408\u8bc4\u6d4b\u57fa\u51c6\u3002"}, {"abstract": "Tactile sensing is an essential modality for robots performing contact-rich, dexterous manipulation, particularly under visual occlusion. While pre-trained image encoders are standard in robot learning pipelines, tactile encoders are still commonly trained from scratch from raw, noisy signals, which might limit their expressivity. Existing self-supervised learning (SSL) approaches focus predominantly on vision-based tactile sensors, leaving distributed electronic skins largely unaddressed. These sensors, however, have a distinctive property: their sensing elements are sparse and irregularly arranged over the surface they cover, which makes direct reuse of visual SSL methods suboptimal. We present Tactile-JEPA, an efficient self-supervised pre-training method that uses the spatial arrangement of tactile sensors to learn topology-aware representations. Specifically, it is trained to predict the embeddings of masked sensing elements from the unmasked remainder, using the sensor connectivity graph to guide spatial masking. Our analysis shows that effective tactile representations require capturing both local contact details and the global state of the tactile surface, which we achieve through dual-scale masking. Across three diverse datasets spanning magnetic and piezoresistive sensors, different robot embodiments, and single- and paired-sensor configurations, Tactile-JEPA reduces force estimation error by 6.3% and in-hand orientation error by 20.8% over the prior state-of-the-art, with consistent gains in other downstream applications, including policy learning. Overall, our results demonstrate that the benefit of tactile sensing depends critically on the quality of encoder pre-training, a problem which Tactile-JEPA addresses directly. Code is available at https://github.com/E-Kovtun/tactile.", "arxiv_id": "2609.24385", "arxiv_url": "https://arxiv.org/abs/2609.24385", "authors": ["Elizaveta Kovtun", "Matvey Konovalov", "Andrey Sakhovskiy", "Semen Budennyy"], "brief": "\u8bba\u6587\u63d0\u51fa Tactile-JEPA\uff0c\u4e00\u79cd\u7528\u4e8e\u5206\u5e03\u5f0f\u89e6\u89c9\u4f20\u611f\u5668\u7684\u81ea\u76d1\u7763\u8868\u793a\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u5229\u7528\u89e6\u89c9\u5355\u5143\u5728\u673a\u5668\u4eba\u8868\u9762\u7684\u7a00\u758f\u3001\u4e0d\u89c4\u5219\u62d3\u6251\u7ed3\u6784\uff0c\u901a\u8fc7\u9884\u6d4b\u88ab\u906e\u853d\u4f20\u611f\u5355\u5143\u7684\u8868\u5f81\u6765\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u89e6\u89c9\u7f16\u7801\u5668\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/E-Kovtun/tactile", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2609.24385", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u7528\u4f20\u611f\u5668\u8fde\u63a5\u56fe\u6307\u5bfc\u7a7a\u95f4\u906e\u853d\uff0c\u4f7f\u9884\u8bad\u7ec3\u9002\u914d\u7535\u5b50\u76ae\u80a4\u7684\u975e\u7f51\u683c\u5316\u3001\u7a00\u758f\u5e03\u5c40\u3002", "\u63d0\u51fa\u53cc\u5c3a\u5ea6\u906e\u853d\u673a\u5236\uff0c\u540c\u65f6\u6355\u6349\u5c40\u90e8\u63a5\u89e6\u7ec6\u8282\u4e0e\u6574\u4e2a\u89e6\u89c9\u8868\u9762\u7684\u5168\u5c40\u72b6\u6001\u3002", "\u5728\u4e09\u7c7b\u78c1\u6027\u4e0e\u538b\u963b\u5f0f\u89e6\u89c9\u6570\u636e\u96c6\u4e0a\uff0c\u76f8\u6bd4 prior SOTA \u5c06\u529b\u4f30\u8ba1\u8bef\u5dee\u964d\u4f4e 6.3%\u3001\u624b\u5185\u59ff\u6001\u8bef\u5dee\u964d\u4f4e 20.8%\uff0c\u5e76\u63d0\u5347\u7b56\u7565\u5b66\u4e60\u7b49\u4e0b\u6e38\u4efb\u52a1\u8868\u73b0\u3002"], "keywords": ["\u89e6\u89c9\u611f\u77e5", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u8868\u793a\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24385v1", "published_at": "2026-09-21", "score": 0.294, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24385.png", "title": "Tactile-JEPA: Topology-Aware Self-Supervised Representation Learning for Distributed Tactile Sensors", "tldr": "\u9762\u5411\u7535\u5b50\u76ae\u80a4\u7684\u62d3\u6251\u611f\u77e5\u89e6\u89c9\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\u3002", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa Tactile-JEPA\uff0c\u4e00\u79cd\u7528\u4e8e\u5206\u5e03\u5f0f\u89e6\u89c9\u4f20\u611f\u5668\u7684\u81ea\u76d1\u7763\u8868\u793a\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u5229\u7528\u89e6\u89c9\u5355\u5143\u5728\u673a\u5668\u4eba\u8868\u9762\u7684\u7a00\u758f\u3001\u4e0d\u89c4\u5219\u62d3\u6251\u7ed3\u6784\uff0c\u901a\u8fc7\u9884\u6d4b\u88ab\u906e\u853d\u4f20\u611f\u5355\u5143\u7684\u8868\u5f81\u6765\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u89e6\u89c9\u7f16\u7801\u5668\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u586b\u8865\u4e86\u5206\u5e03\u5f0f\u7535\u5b50\u76ae\u80a4\u89e6\u89c9\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\u7684\u7a7a\u767d\uff0c\u8bc1\u660e\u89e6\u89c9\u7f16\u7801\u5668\u8d28\u91cf\u4f1a\u663e\u8457\u5f71\u54cd\u673a\u5668\u4eba\u63a5\u89e6\u64cd\u4f5c\u6027\u80fd\uff0c\u4e3a\u590d\u6742\u89e6\u89c9\u4f20\u611f\u5668\u7684\u901a\u7528\u8868\u5f81\u5b66\u4e60\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Pretrained vision-language-action (VLA) models enable broad manipulation but remain unreliable in tasks demanding precision and repeatability. Applying real-world online reinforcement learning (RL) to VLA post-training enables autonomous trial-and-error improvement beyond demonstrations alone, but exposes two bottlenecks: 1) unreliable value signals can induce policy drift; 2) large-VLA overhead constrains throughput and sample efficiency. To address these challenges, we present VLA-Precision, an efficient real-world online RL framework featuring the Asymmetric Co-Bootstrapping (ACoB) algorithm and the ACoB-Stream architecture. Specifically, ACoB establishes asymmetric co-bootstrapping across timescales: early intervention-guided behavioral learning rapidly improves policy performance while enhancing online experience quality. As autonomous experience accumulates, global return propagation and local preference ranking progressively calibrate value estimates, yielding relative action advantages for reference-regularized policy improvement while suppressing drift. To enable ACoB on large VLAs, we develop ACoB-Stream, a closed-loop experience--policy architecture that establishes invariant-state decoupling and on-demand streaming as design principles, delivering up to 10.9$\\times$ improvements in throughput and computational efficiency. Extensive evaluations on nine high-precision chemistry tasks across four categories and four robot embodiments show that VLA-Precision achieves 98.3\\% mean success rate in 45.8 min/task, with 27.6 s episodes running at 1.2$\\times$ and 1.8$\\times$ the speeds of VLA and RL baselines. Resources are available at https://vla-precision.github.io.", "arxiv_id": "2609.04355", "arxiv_url": "https://arxiv.org/abs/2609.04355", "authors": ["Chenyu Su", "Zhaolong Shen", "Yuan Qian", "Chen Qian", "Rui Zhang", "Feng Yan", "Weixing Chen", "Fei Zhang", "Jiamin Wang", "Shuang Cong", "Weiwei Shang"], "brief": "\u8bba\u6587\u63d0\u51fa VLA-Precision\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u7cbe\u5bc6\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5176\u6838\u5fc3\u662f Asymmetric Co-Bootstrapping \u7b97\u6cd5\u4e0e ACoB-Stream \u67b6\u6784\uff0c\u7528\u4e8e\u63d0\u5347\u5927\u578b VLA \u6a21\u578b\u5728\u9ad8\u7cbe\u5ea6\u3001\u53ef\u91cd\u590d\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\u4e0e\u8bad\u7ec3\u6548\u7387\u3002", "categories": ["cs.RO", "cs.AI", "cs.HC", "cs.LG"], "github_repo": "https://github.com/scy-v/VLA-Precision", "github_stars": 81, "hf_url": "https://huggingface.co/papers/2609.04355", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["ACoB \u901a\u8fc7\u65e9\u671f\u4eba\u5de5\u5e72\u9884\u5f15\u5bfc\u884c\u4e3a\u5b66\u4e60\u3001\u540e\u671f\u81ea\u4e3b\u7ecf\u9a8c\u79ef\u7d2f\u6765\u9010\u6b65\u6821\u51c6\u4ef7\u503c\u4f30\u8ba1\uff0c\u964d\u4f4e\u7b56\u7565\u6f02\u79fb\u98ce\u9669\u3002", "\u7ed3\u5408\u5168\u5c40\u56de\u62a5\u4f20\u64ad\u4e0e\u5c40\u90e8\u504f\u597d\u6392\u5e8f\uff0c\u6784\u9020\u76f8\u5bf9\u52a8\u4f5c\u4f18\u52bf\uff0c\u5e76\u7528\u53c2\u8003\u6b63\u5219\u5316\u6539\u8fdb\u7b56\u7565\u3002", "ACoB-Stream \u901a\u8fc7\u72b6\u6001\u89e3\u8026\u4e0e\u6309\u9700\u6d41\u5f0f\u5904\u7406\uff0c\u5c06\u5927\u578b VLA \u5728\u7ebf\u8bad\u7ec3\u541e\u5410\u548c\u8ba1\u7b97\u6548\u7387\u6700\u9ad8\u63d0\u5347 10.9 \u500d\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba\u64cd\u4f5c"], "num_comments": 2, "on_hf": true, "organization": "university of science and technology  of china", "pdf_url": "https://arxiv.org/pdf/2609.04355v3", "published_at": "2026-09-03", "score": 0.274, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04355.png", "title": "VLA-Precision: Asymmetric Co-Bootstrapping for Efficient Real-World Online RL of Vision-Language-Action Models", "tldr": "\u8ba9VLA\u673a\u5668\u4eba\u9ad8\u6548\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u7cbe\u5bc6\u64cd\u4f5c", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa VLA-Precision\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u7cbe\u5bc6\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5176\u6838\u5fc3\u662f Asymmetric Co-Bootstrapping \u7b97\u6cd5\u4e0e ACoB-Stream \u67b6\u6784\uff0c\u7528\u4e8e\u63d0\u5347\u5927\u578b VLA \u6a21\u578b\u5728\u9ad8\u7cbe\u5ea6\u3001\u53ef\u91cd\u590d\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\u4e0e\u8bad\u7ec3\u6548\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u771f\u5b9e\u673a\u5668\u4eba\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u4ef7\u503c\u4e0d\u7a33\u5b9a\u548c\u5927\u6a21\u578b\u4f4e\u541e\u5410\u74f6\u9888\uff0c\u5c55\u793a\u4e86 VLA \u6a21\u578b\u5728\u771f\u5b9e\u9ad8\u7cbe\u5ea6\u5316\u5b66\u64cd\u4f5c\u4efb\u52a1\u4e2d\u63a5\u8fd1\u5b9e\u7528\u5316\u7684\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u80fd\u529b\u3002"}, {"abstract": "Existing multi-agent benchmarks primarily test in competitive settings, short-horizon interactions under 20 steps, or simply aggregate individual performance, failing to isolate and highlight genuine collaboration capabilities of LLM-based agents. We introduce AgentWorld, a benchmark of 100 human-annotated tasks (with 100 augmented variants) for evaluating long-horizon, multi-agent collaboration. Tasks span 50+ interaction rounds across a rich MMORPG sandbox and require 3-20 agents with asymmetric roles and abilities to coordinate through communication, joint planning, and resource sharing under a blackbox setting where each agent acts independently without access to others\u0027 internal states. To quantify collaboration effectiveness in addition to conventional binary task success, we propose Causal Collaboration Effectiveness (CCE), a graph-based metric that traces causal dependencies between agent actions and measures what fraction of a team\u0027s effort actually contributed to the outcome. Experiments with Gemini 3 Flash, Claude Haiku 4.5, GPT-5 Mini, and DeepSeek R1-70B show that even the best model achieves only 52.0% task success, with systematic failure modes including communication breakdowns, role confusion, and inability to maintain shared plans across rounds. AgentWorld is fully open-source.", "arxiv_id": "2609.31590", "arxiv_url": "https://arxiv.org/abs/2609.31590", "authors": ["Raphael Shu", "Yusen Zhang", "Young Min Cho", "Jin Mo Yang", "Yuan Yuan", "Wenliang Zheng", "Sharath Chandra Guntuku", "Lyle Ungar", "Zhou Yu", "Rui Zhang"], "brief": "AgentWorld \u662f\u4e00\u4e2a\u8bc4\u6d4b LLM \u591a\u667a\u80fd\u4f53\u957f\u7a0b\u534f\u4f5c\u80fd\u529b\u7684\u5f00\u653e\u57fa\u51c6\uff0c\u5305\u542b 100 \u4e2a\u771f\u4eba\u6807\u6ce8\u4efb\u52a1\u53ca 100 \u4e2a\u589e\u5f3a\u53d8\u4f53\u3002\u4efb\u52a1\u7f6e\u4e8e MMORPG \u6c99\u76d2\u4e2d\uff0c\u8981\u6c42 3-20 \u4e2a\u5177\u5907\u975e\u5bf9\u79f0\u89d2\u8272\u548c\u80fd\u529b\u7684\u667a\u80fd\u4f53\u5728 50 \u8f6e\u4ee5\u4e0a\u4ea4\u4e92\u4e2d\u534f\u540c\u5b8c\u6210\u76ee\u6807\u3002", "categories": ["cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31590", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4efb\u52a1\u5f3a\u8c03\u771f\u5b9e\u534f\u4f5c\u800c\u975e\u7ade\u4e89\u6216\u77ed\u7a0b\u4ea4\u4e92\uff0c\u667a\u80fd\u4f53\u9700\u901a\u8fc7\u6c9f\u901a\u3001\u8054\u5408\u89c4\u5212\u548c\u8d44\u6e90\u5171\u4eab\u5b8c\u6210\u590d\u6742\u76ee\u6807\u3002", "\u63d0\u51fa Causal Collaboration Effectiveness\uff08CCE\uff09\u6307\u6807\uff0c\u7528\u56fe\u7ed3\u6784\u8ffd\u8e2a\u667a\u80fd\u4f53\u884c\u52a8\u95f4\u7684\u56e0\u679c\u4f9d\u8d56\uff0c\u8861\u91cf\u56e2\u961f\u52aa\u529b\u4e2d\u771f\u6b63\u8d21\u732e\u4e8e\u7ed3\u679c\u7684\u6bd4\u4f8b\u3002", "\u5b9e\u9a8c\u663e\u793a Gemini 3 Flash\u3001Claude Haiku 4.5\u3001GPT-5 Mini\u3001DeepSeek R1-70B \u7b49\u6a21\u578b\u8868\u73b0\u4ecd\u6709\u9650\uff0c\u6700\u4f73\u6210\u529f\u7387\u4ec5 52.0%\uff0c\u5e38\u89c1\u5931\u8d25\u5305\u62ec\u6c9f\u901a\u65ad\u88c2\u3001\u89d2\u8272\u6df7\u6dc6\u548c\u957f\u671f\u8ba1\u5212\u7ef4\u6301\u5931\u8d25\u3002"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u534f\u4f5c"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.31590v1", "published_at": "2026-09-25", "score": 0.259, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.31590.png", "title": "AgentWorld: Benchmarking Long-Horizon Collaboration of Multi-agent LLMs", "tldr": "\u9762\u5411\u957f\u7a0b\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u7684\u65b0\u57fa\u51c6\u3002", "upvotes": 7, "what_it_is": "AgentWorld \u662f\u4e00\u4e2a\u8bc4\u6d4b LLM \u591a\u667a\u80fd\u4f53\u957f\u7a0b\u534f\u4f5c\u80fd\u529b\u7684\u5f00\u653e\u57fa\u51c6\uff0c\u5305\u542b 100 \u4e2a\u771f\u4eba\u6807\u6ce8\u4efb\u52a1\u53ca 100 \u4e2a\u589e\u5f3a\u53d8\u4f53\u3002\u4efb\u52a1\u7f6e\u4e8e MMORPG \u6c99\u76d2\u4e2d\uff0c\u8981\u6c42 3-20 \u4e2a\u5177\u5907\u975e\u5bf9\u79f0\u89d2\u8272\u548c\u80fd\u529b\u7684\u667a\u80fd\u4f53\u5728 50 \u8f6e\u4ee5\u4e0a\u4ea4\u4e92\u4e2d\u534f\u540c\u5b8c\u6210\u76ee\u6807\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u77ed\u7a0b\u3001\u7ade\u4e89\u6216\u4e2a\u4f53\u80fd\u529b\u805a\u5408\u63a8\u8fdb\u5230\u957f\u7a0b\u534f\u4f5c\u573a\u666f\uff0c\u5e76\u63d0\u4f9b\u56e0\u679c\u534f\u4f5c\u6548\u7387\u6307\u6807\uff0c\u6709\u52a9\u4e8e\u7cfb\u7edf\u6027\u63ed\u793a\u5f53\u524d LLM \u667a\u80fd\u4f53\u5728\u56e2\u961f\u534f\u4f5c\u4e2d\u7684\u74f6\u9888\u3002"}, {"abstract": "Long-horizon reasoning remains a central challenge for large language models (LLMs) under sparse-reward regimes. We argue that this brittleness arises from two biases induced by complex reasoning spaces: an exploration bias, where models are drawn toward locally plausible but structurally unstable branches, and a compounding bias, where small local deviations accumulate across depth and suppress rare rewards. We introduce Symbolic Closure Analysis (SCA) as a theoretical lens characterizing how branching structures and sparse rewards induce these biases in long-horizon reasoning with local admissibility, and as a design principle for structural priors in less formal reasoning tasks. Motivated by this analysis, we propose SAGE (Structural Admissibility-Guided Exploration), a unified framework that injects structural guidance to alleviate exploration bias and compounding bias in long-horizon reasoning. SAGE combines two complementary structural guidance: algebraic sparsification, which projects locally admissible candidates onto operator-indexed algebraic subspaces to suppress spurious branching and mitigate exploration bias, and hyperbolic structural guidance, which embeds reasoning states into a negatively curved space to provide dense depth-wise signals and mitigate compounding bias. Across 12 benchmarks and 7 model families, SAGE outperforms competitive baselines. In particular, SAGE achieves up to an 8-fold improvement on the Andrews-Curtis problem, an open real-world long-horizon task. Code is available at: https://github.com/Susan571/SAGE-NeurIPS2026.", "arxiv_id": "2609.30192", "arxiv_url": "https://arxiv.org/abs/2609.30192", "authors": ["Xinyue Zeng", "Jiawei Zhang", "Yujun Yan", "Dawei Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Symbolic Closure Analysis\uff08SCA\uff09\u6765\u523b\u753b\u7a00\u758f\u5956\u52b1\u957f\u7a0b\u63a8\u7406\u4e2d\u7684\u63a2\u7d22\u504f\u5dee\u4e0e\u7d2f\u79ef\u504f\u5dee\uff0c\u5e76\u636e\u6b64\u6784\u5efa SAGE \u6846\u67b6\u3002SAGE \u901a\u8fc7\u7ed3\u6784\u53ef\u91c7\u7eb3\u6027\u5f15\u5bfc\uff0c\u4e3a\u5927\u8bed\u8a00\u6a21\u578b\u7684\u957f\u94fe\u63a8\u7406\u63d0\u4f9b\u66f4\u7a33\u5b9a\u7684\u641c\u7d22\u4e0e\u6df1\u5ea6\u4fe1\u53f7\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Susan571/SAGE-NeurIPS2026", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30192", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u4e24\u7c7b\u504f\u5dee\u89e3\u91ca\uff1a\u6a21\u578b\u5bb9\u6613\u8fdb\u5165\u5c40\u90e8\u5408\u7406\u4f46\u7ed3\u6784\u4e0d\u7a33\u5b9a\u7684\u5206\u652f\uff0c\u4e14\u5c40\u90e8\u5c0f\u8bef\u5dee\u4f1a\u968f\u63a8\u7406\u6df1\u5ea6\u7d2f\u79ef\u5e76\u63a9\u76d6\u7a00\u6709\u5956\u52b1\u3002", "SAGE \u7ed3\u5408\u4ee3\u6570\u7a00\u758f\u5316\u4e0e\u53cc\u66f2\u7ed3\u6784\u5f15\u5bfc\uff1a\u524d\u8005\u538b\u5236\u4f2a\u5206\u652f\uff0c\u540e\u8005\u5728\u8d1f\u66f2\u7387\u7a7a\u95f4\u4e2d\u4e3a\u63a8\u7406\u72b6\u6001\u63d0\u4f9b\u7a20\u5bc6\u7684\u9010\u6df1\u5ea6\u4fe1\u53f7\u3002", "\u5728 12 \u4e2a\u57fa\u51c6\u548c 7 \u4e2a\u6a21\u578b\u5bb6\u65cf\u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u5728 Andrews-Curtis \u95ee\u9898\u4e0a\u6700\u9ad8\u53d6\u5f97 8 \u500d\u63d0\u5347\u3002"], "keywords": ["\u957f\u7a0b\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7ed3\u6784\u5f15\u5bfc", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.30192v1", "published_at": "2026-09-24", "score": 0.258, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.30192.png", "title": "SAGE: Mitigating Long-Horizon Reasoning Biases via Topological Guidance", "tldr": "\u7528\u62d3\u6251\u7ed3\u6784\u5f15\u5bfc\u7f13\u89e3\u957f\u7a0b\u63a8\u7406\u504f\u5dee", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa Symbolic Closure Analysis\uff08SCA\uff09\u6765\u523b\u753b\u7a00\u758f\u5956\u52b1\u957f\u7a0b\u63a8\u7406\u4e2d\u7684\u63a2\u7d22\u504f\u5dee\u4e0e\u7d2f\u79ef\u504f\u5dee\uff0c\u5e76\u636e\u6b64\u6784\u5efa SAGE \u6846\u67b6\u3002SAGE \u901a\u8fc7\u7ed3\u6784\u53ef\u91c7\u7eb3\u6027\u5f15\u5bfc\uff0c\u4e3a\u5927\u8bed\u8a00\u6a21\u578b\u7684\u957f\u94fe\u63a8\u7406\u63d0\u4f9b\u66f4\u7a33\u5b9a\u7684\u641c\u7d22\u4e0e\u6df1\u5ea6\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u957f\u7a0b\u63a8\u7406\u5931\u8d25\u5f52\u56e0\u4e8e\u63a8\u7406\u7a7a\u95f4\u7684\u62d3\u6251\u4e0e\u5206\u652f\u7ed3\u6784\u95ee\u9898\uff0c\u5e76\u7ed9\u51fa\u53ef\u64cd\u4f5c\u7684\u7ed3\u6784\u5148\u9a8c\u6ce8\u5165\u65b9\u6cd5\uff1b\u82e5\u7ed3\u679c\u53ef\u9760\uff0c\u5bf9\u7a00\u758f\u5956\u52b1\u63a8\u7406\u3001\u6570\u5b66\u63a8\u7406\u548c\u590d\u6742\u641c\u7d22\u4efb\u52a1\u90fd\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Latent world models predict the consequences of actions, but accurate prediction does not guarantee that latent distance reflects which candidate will execute successfully. We identify a decision-local prediction gap: among the few futures competing for execution, a candidate predicted closer to the goal can produce a worse realized outcome than an available alternative. We introduce D-JEPA, a decision-aligned latent world model that learns decision-relevant relations among candidate futures from executed outcomes. A bounded, permutation-equivariant operator jointly reasons over goal-relative predictive features and ordinal evidence, refining pretrained predictive geometry where action choices are most consequential. Restricted predictor adaptation and a shared ordinal interface extend this alignment across complementary predictive geometries. D-JEPA further realizes the learned decision structure in JEPA-compatible future representations, enabling deployment through native latent-distance planning. Evaluations across latent control, manipulation, pretrained action-producing models, physical robots and autonomous driving demonstrate improved action selection, including 87.89% success on PushT, a 15.04-point average gain on RoboTwin, and a 17-point gain on physical robot tasks. These results establish decision-relevant relational structure as a direct bridge between predictive world modeling and effective control.", "arxiv_id": "2609.24749", "arxiv_url": "https://arxiv.org/abs/2609.24749", "authors": ["Shuaijun Liu", "Chengyu Wu", "Qifu Wen", "Feiyang You", "Chenglong Zhang", "Shuyang Hao", "Xi Lin", "Ningxin Su"], "brief": "\u8bba\u6587\u63d0\u51fa D-JEPA\uff0c\u4e00\u79cd\u51b3\u7b56\u5bf9\u9f50\u7684\u6f5c\u5728\u4e16\u754c\u6a21\u578b\uff0c\u7528\u5df2\u6267\u884c\u7ed3\u679c\u5b66\u4e60\u5019\u9009\u672a\u6765\u4e4b\u95f4\u4e0e\u51b3\u7b56\u76f8\u5173\u7684\u5173\u7cfb\u3002\u5b83\u5728\u9884\u8bad\u7ec3\u9884\u6d4b\u51e0\u4f55\u57fa\u7840\u4e0a\u8fdb\u884c\u5c40\u90e8\u4fee\u6b63\uff0c\u4f7f\u6f5c\u5728\u8ddd\u79bb\u89c4\u5212\u66f4\u80fd\u53cd\u6620\u771f\u5b9e\u52a8\u4f5c\u6267\u884c\u6548\u679c\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": "https://github.com/NEBULIS-Lab/D-JEPA", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2609.24749", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u201c\u51b3\u7b56\u5c40\u90e8\u9884\u6d4b\u7f3a\u53e3\u201d\uff1a\u9884\u6d4b\u66f4\u63a5\u8fd1\u76ee\u6807\u7684\u5019\u9009\u672a\u6765\uff0c\u5b9e\u9645\u7ed3\u679c\u53ef\u80fd\u53cd\u800c\u66f4\u5dee\u3002", "\u8bbe\u8ba1\u6709\u754c\u3001\u7f6e\u6362\u7b49\u53d8\u7684\u5173\u7cfb\u7b97\u5b50\uff0c\u8054\u5408\u5229\u7528\u76ee\u6807\u76f8\u5bf9\u9884\u6d4b\u7279\u5f81\u4e0e\u5e8f\u6570\u8bc1\u636e\uff0c\u5bf9\u5173\u952e\u52a8\u4f5c\u9009\u62e9\u533a\u57df\u8fdb\u884c\u51e0\u4f55\u7ec6\u5316\u3002", "\u5728 PushT\u3001RoboTwin\u3001\u7269\u7406\u673a\u5668\u4eba\u548c\u81ea\u52a8\u9a7e\u9a76\u7b49\u4efb\u52a1\u4e0a\u63d0\u5347\u52a8\u4f5c\u9009\u62e9\uff0cPushT \u6210\u529f\u7387\u8fbe 87.89%\uff0cRoboTwin \u5e73\u5747\u63d0\u5347 15.04 \u70b9\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba", "\u5f3a\u5316\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "NEBULIS Lab", "pdf_url": "https://arxiv.org/pdf/2609.24749v1", "published_at": "2026-09-21", "score": 0.256, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.24749.png", "title": "D-JEPA: A Decision-Aligned Latent World Model", "tldr": "\u8ba9\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u66f4\u8d34\u8fd1\u51b3\u7b56\u6210\u8d25\u3002", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa D-JEPA\uff0c\u4e00\u79cd\u51b3\u7b56\u5bf9\u9f50\u7684\u6f5c\u5728\u4e16\u754c\u6a21\u578b\uff0c\u7528\u5df2\u6267\u884c\u7ed3\u679c\u5b66\u4e60\u5019\u9009\u672a\u6765\u4e4b\u95f4\u4e0e\u51b3\u7b56\u76f8\u5173\u7684\u5173\u7cfb\u3002\u5b83\u5728\u9884\u8bad\u7ec3\u9884\u6d4b\u51e0\u4f55\u57fa\u7840\u4e0a\u8fdb\u884c\u5c40\u90e8\u4fee\u6b63\uff0c\u4f7f\u6f5c\u5728\u8ddd\u79bb\u89c4\u5212\u66f4\u80fd\u53cd\u6620\u771f\u5b9e\u52a8\u4f5c\u6267\u884c\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e16\u754c\u6a21\u578b\u7684\u9884\u6d4b\u80fd\u529b\u4e0e\u63a7\u5236\u51b3\u7b56\u76f4\u63a5\u5bf9\u9f50\uff0c\u7f13\u89e3\u201c\u9884\u6d4b\u51c6\u4f46\u9009\u5f97\u5dee\u201d\u7684\u95ee\u9898\uff0c\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u3001\u81ea\u52a8\u9a7e\u9a76\u548c\u6f5c\u5728\u7a7a\u95f4\u89c4\u5212\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Self-evolving vision-language models train on questions they generate from unlabeled images. Since these questions have no gold answers, prior methods label them by majority vote over sampled answers or by a model judge. In a human evaluation, we find that 24\\% of majority-vote labels and 18\\% of model-judge labels produced during self-evolution are wrong. To address this problem, we present Verifiable QA Generation for Self-Evolving Models (VQS), which changes how the model judges answers. Instead of voting on an answer, the model parses each image into a structured record, such as a scene graph, a chart table, or a diagram graph. Fixed programs then write a question from the record and compute its answer. The model still acts as a visual checker, but it only confirms the individual facts the program reads, one short claim at a time. These claim-level checks select the parser\u0027s training targets, so the parser also improves without labels. Human raters find 94\\% of VQS answers correct, against 76\\% for majority voting. Across ten benchmarks, VQS improves Qwen3-VL by up to 3.18 points at the 2B, 4B, and 8B scales and outperforms the strongest self-evolving baseline at each. Gains keep growing over three training rounds, reaching 3.84 points at 2B. Code is released at https://github.com/ahmedheakl/VQS", "arxiv_id": "2609.33855", "arxiv_url": "https://arxiv.org/abs/2609.33855", "authors": ["Ahmed Heakl", "Sungik Choi", "Moontae Lee", "Salman Khan"], "brief": "\u8bba\u6587\u63d0\u51fa VQS\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u81ea\u8fdb\u5316\u7684\u53ef\u9a8c\u8bc1\u95ee\u7b54\u751f\u6210\u65b9\u6cd5\u3002\u5b83\u5148\u5c06\u56fe\u50cf\u89e3\u6790\u4e3a\u7ed3\u6784\u5316\u8bb0\u5f55\uff0c\u518d\u7531\u56fa\u5b9a\u7a0b\u5e8f\u751f\u6210\u95ee\u9898\u5e76\u8ba1\u7b97\u7b54\u6848\uff0c\u7528\u9010\u6761\u4e8b\u5b9e\u6838\u9a8c\u66ff\u4ee3\u7b54\u6848\u6295\u7968\u6216\u6a21\u578b\u88c1\u5224\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG", "cs.NE"], "github_repo": "https://github.com/ahmedheakl/VQS", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33855", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u73b0\u6709\u81ea\u8fdb\u5316\u6807\u6ce8\u566a\u58f0\u5f88\u9ad8\uff1a\u591a\u6570\u6295\u7968\u6807\u7b7e\u7ea624%\u9519\u8bef\uff0c\u6a21\u578b\u88c1\u5224\u6807\u7b7e\u7ea618%\u9519\u8bef\u3002", "VQS\u5c06\u56fe\u50cf\u8868\u793a\u4e3a\u573a\u666f\u56fe\u3001\u56fe\u8868\u8868\u683c\u6216\u793a\u610f\u56fe\u56fe\u7ed3\u6784\uff0c\u5e76\u7528\u7a0b\u5e8f\u4ece\u7ed3\u6784\u5316\u8bb0\u5f55\u751f\u6210\u53ef\u9a8c\u8bc1\u95ee\u7b54\u3002", "\u6a21\u578b\u53ea\u9700\u9a8c\u8bc1\u7a0b\u5e8f\u8bfb\u53d6\u7684\u77ed\u4e8b\u5b9e\u58f0\u660e\uff0c\u65e2\u63d0\u5347\u7b54\u6848\u53ef\u9760\u6027\uff0c\u4e5f\u4e3a\u89e3\u6790\u5668\u63d0\u4f9b\u65e0\u6807\u7b7e\u8bad\u7ec3\u76ee\u6807\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u81ea\u8bad\u7ec3", "\u7a0b\u5e8f\u9a8c\u8bc1", "\u6570\u636e\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.33855v1", "published_at": "2026-09-27", "score": 0.251, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33855.png", "title": "Program-Verified Self-Evolution for Vision-Language Models", "tldr": "\u7528\u7a0b\u5e8f\u9a8c\u8bc1\u63d0\u5347VLM\u81ea\u8fdb\u5316\u6807\u6ce8\u53ef\u9760\u6027", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa VQS\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u81ea\u8fdb\u5316\u7684\u53ef\u9a8c\u8bc1\u95ee\u7b54\u751f\u6210\u65b9\u6cd5\u3002\u5b83\u5148\u5c06\u56fe\u50cf\u89e3\u6790\u4e3a\u7ed3\u6784\u5316\u8bb0\u5f55\uff0c\u518d\u7531\u56fa\u5b9a\u7a0b\u5e8f\u751f\u6210\u95ee\u9898\u5e76\u8ba1\u7b97\u7b54\u6848\uff0c\u7528\u9010\u6761\u4e8b\u5b9e\u6838\u9a8c\u66ff\u4ee3\u7b54\u6848\u6295\u7968\u6216\u6a21\u578b\u88c1\u5224\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u81ea\u8bad\u7ec3\u4e2d\u7684\u201c\u8f6f\u88c1\u5224\u201d\u8f6c\u5316\u4e3a\u66f4\u53ef\u63a7\u7684\u7a0b\u5e8f\u5316\u9a8c\u8bc1\uff0c\u663e\u8457\u964d\u4f4e\u4f2a\u6807\u7b7e\u9519\u8bef\u7387\uff1b\u4eba\u5de5\u8bc4\u4f30\u663e\u793a\u7b54\u6848\u6b63\u786e\u7387\u8fbe94%\uff0c\u5e76\u5728\u5341\u4e2a\u57fa\u51c6\u4e0a\u6301\u7eed\u63d0\u5347 Qwen3-VL 2B/4B/8B \u8868\u73b0\u3002"}, {"abstract": "We introduce Kaggle Game Arena, an open and ever-expanding platform to evaluate large language models (LLMs) through competitive games. Different from static benchmarks, game arena enables models to play head-to-head matchups in structured environments where the gameplay strength naturally increases as models evolve, preventing performance saturation. This technical report details the infrastructure behind Game Arena and describes the three pilot game environments: Chess, Poker, and Werewolf. These environments span perfect information, imperfect information, and multiplayer game settings, enabling a systematic study of models\u0027 strategic planning, adaptation, and robustness under uncertainty. For each game, we provide a detailed description of the environment, evaluation metrics, and results from running full competitions across models. Through robust infrastructure and large-scale ground-truth based evaluation, Game Arena ensures reproducibility, transparency and generalizability to new games and variants over time.", "arxiv_id": "2609.31473", "arxiv_url": "https://arxiv.org/abs/2609.31473", "authors": ["Bovard Doerschuk-Tiberi", "Yao Yan", "Justin Chiu", "Hann Wang", "Timothy Chung", "Martyna Plomecka", "John Schultz", "Jon Lipovetz", "Clayton Drazner", "Yuchen Zhuang", "Jaimie Hwang", "Nate Keating", "Riley Jones", "Andrew Lee", "Oran Kelly", "Ian Gemp", "Michael Aaron", "Laurel Prince", "Kate Larson", "Jeff Moser", "Harrison Jobe", "Chad Woodford", "Siqi Liu", "Andrew Wang", "Bo Chang", "Christopher D\u0027Mello", "Diane Chaleff", "Addison Howard", "Johnny Yip", "Chuck Sugnet", "Antonio Gulli", "Meghan O\u0027Connell", "Will Cukierski", "Nenad Tomasev", "Dima Yeroshenko", "Kinjal Parekh", "Roxanne Daniel", "Marc Lanctot", "Domino Weir", "Elsa Dong", "Daniel Hennes", "Melissa Nalubwama", "Robert Fraser", "Ryan Trostle", "Jun Peng", "Tom Mason", "Lloyd Hightower", "Chiamaka Chukwuka", "Yuexiang Zhai", "Phoebe Kirk", "Yi Su", "Yuting Han", "Jie Ren", "Chris Prichard", "Sahand Sharifzadeh", "Karim Hakimzadeh", "DJ Sterling", "Meg Risdal", "Kate Olszewska", "Ya Xu", "Orhan Firat", "Minmin Chen"], "brief": "\u8bba\u6587\u4ecb\u7ecd Kaggle Game Arena\uff0c\u4e00\u4e2a\u901a\u8fc7\u6a21\u578b\u95f4\u5bf9\u6218\u6765\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5f00\u653e\u5e73\u53f0\u3002\u5176\u9996\u6279\u73af\u5883\u5305\u62ec\u56fd\u9645\u8c61\u68cb\u3001\u6251\u514b\u548c\u72fc\u4eba\u6740\uff0c\u8986\u76d6\u5b8c\u5168\u4fe1\u606f\u3001\u4e0d\u5b8c\u5168\u4fe1\u606f\u4e0e\u591a\u4eba\u535a\u5f08\u573a\u666f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31473", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u76f8\u6bd4\u9759\u6001\u57fa\u51c6\uff0cGame Arena \u901a\u8fc7\u6301\u7eed\u5bf9\u6218\u907f\u514d\u5206\u6570\u9971\u548c\uff0c\u968f\u6a21\u578b\u8fdb\u6b65\u81ea\u7136\u63d0\u9ad8\u8bc4\u6d4b\u96be\u5ea6", "\u4e09\u7c7b\u8bd5\u70b9\u6e38\u620f\u5206\u522b\u8003\u5bdf\u6218\u7565\u89c4\u5212\u3001\u9002\u5e94\u80fd\u529b\u3001\u4fe1\u606f\u4e0d\u786e\u5b9a\u6027\u4e0b\u7684\u9c81\u68d2\u6027\u548c\u591a\u4eba\u4e92\u52a8\u80fd\u529b", "\u5e73\u53f0\u63d0\u4f9b\u53ef\u590d\u73b0\u7684\u57fa\u7840\u8bbe\u65bd\u3001\u7edf\u4e00\u8bc4\u4f30\u6307\u6807\u548c\u5927\u89c4\u6a21\u57fa\u4e8e\u771f\u5b9e\u7ed3\u679c\u7684\u6bd4\u8d5b\u8bc4\u6d4b"], "keywords": ["\u5927\u6a21\u578b\u8bc4\u6d4b", "\u667a\u80fd\u4f53", "\u535a\u5f08\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Kaggle", "pdf_url": "https://arxiv.org/pdf/2609.31473v1", "published_at": "2026-09-25", "score": 0.246, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.31473.png", "title": "Game Arena: Strategic LLM Evaluation in Competitive Environments", "tldr": "\u7528\u7ade\u6280\u6e38\u620f\u52a8\u6001\u8bc4\u6d4bLLM\u6218\u7565\u80fd\u529b", "upvotes": 4, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd Kaggle Game Arena\uff0c\u4e00\u4e2a\u901a\u8fc7\u6a21\u578b\u95f4\u5bf9\u6218\u6765\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5f00\u653e\u5e73\u53f0\u3002\u5176\u9996\u6279\u73af\u5883\u5305\u62ec\u56fd\u9645\u8c61\u68cb\u3001\u6251\u514b\u548c\u72fc\u4eba\u6740\uff0c\u8986\u76d6\u5b8c\u5168\u4fe1\u606f\u3001\u4e0d\u5b8c\u5168\u4fe1\u606f\u4e0e\u591a\u4eba\u535a\u5f08\u573a\u666f\u3002", "why_notable": "\u5b83\u4e3aLLM\u80fd\u529b\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u52a8\u6001\u3001\u66f4\u63a5\u8fd1\u771f\u5b9e\u51b3\u7b56\u573a\u666f\u7684\u8303\u5f0f\uff0c\u6709\u52a9\u4e8e\u8861\u91cf\u6a21\u578b\u5728\u957f\u671f\u89c4\u5212\u3001\u535a\u5f08\u63a8\u7406\u548c\u4e0d\u786e\u5b9a\u73af\u5883\u4e2d\u7684\u5b9e\u9645\u8868\u73b0\u3002"}, {"abstract": "Visual token reduction is an effective way to accelerate multimodal large language models (MLLMs), but performance deteriorates rapidly under extremely low token budgets. Existing work has explored both visual-token selection and training-based adaptation to reduced visual inputs. We take a step further by asking how a heavily compressed MLLM should learn from the states induced by its own generations. This setting naturally calls for on-policy self-distillation: a heavily compressed model is supervised on the states induced by its own generations, while its full-token counterpart serves as an information-rich teacher. Based on this insight, we propose LT-OPD, a training framework for extreme visual-token reduction. The student rolls out responses with only a small fraction of visual tokens, and a frozen full-token copy of the same MLLM provides distributional supervision along these student-generated trajectories. To stabilize on-policy learning when visual evidence is severely limited, we further introduce a budget-level curriculum that progressively decreases the token budget during training. Across nine benchmarks on Qwen3.5-4B, LT-OPD raises average retained performance under 5% visual-token retention from 68.6% to 82.3%, outperforming training-free, training-based, and reinforcement-learning baselines at the same budget. The gains transfer consistently to Qwen3.5-9B, GLM-4.6V-9B, and LLaVA-OV-1.5-4B. LT-OPD also reduces KV-cache usage by 85.2% and prefill FLOPs by 85.4% without additional inference overhead, demonstrating that on-policy learning can substantially recover capabilities lost to extreme visual-token reduction.", "arxiv_id": "2609.32353", "arxiv_url": "https://arxiv.org/abs/2609.32353", "authors": ["Junxian Li", "Ruixuan Yang", "Tianao Zhang", "Tiange Xu", "Weisheng Dong", "Yulun Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa LT-OPD\uff0c\u4e00\u79cd\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u6781\u7aef\u89c6\u89c9 token \u538b\u7f29\u7684\u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u8ba9\u4f4e\u89c6\u89c9 token \u5b66\u751f\u6a21\u578b\u6cbf\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u5b66\u4e60\uff0c\u7531\u5168 token \u51bb\u7ed3\u6559\u5e08\u6a21\u578b\u63d0\u4f9b\u5206\u5e03\u76d1\u7763\uff0c\u5e76\u901a\u8fc7\u9010\u6b65\u964d\u4f4e token \u9884\u7b97\u7684\u8bfe\u7a0b\u8bad\u7ec3\u7a33\u5b9a\u5b66\u4e60\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": "https://github.com/Yrxxxxxxxx1007/LT-OPD", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.32353", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 on-policy self-distillation\uff1a\u5b66\u751f\u5728\u5c11\u91cf\u89c6\u89c9 token \u4e0b\u751f\u6210\u56de\u7b54\uff0c\u6559\u5e08\u5728\u540c\u4e00\u8f68\u8ff9\u72b6\u6001\u4e0a\u63d0\u4f9b\u66f4\u4e30\u5bcc\u7684\u5206\u5e03\u76d1\u7763\u3002", "\u5f15\u5165\u9884\u7b97\u7ea7\u8bfe\u7a0b\u5b66\u4e60\uff0c\u8bad\u7ec3\u4e2d\u9010\u6b65\u51cf\u5c11\u89c6\u89c9 token \u6570\u91cf\uff0c\u4ee5\u7f13\u89e3\u6781\u7aef\u538b\u7f29\u4e0b\u89c6\u89c9\u8bc1\u636e\u4e0d\u8db3\u5bfc\u81f4\u7684\u4e0d\u7a33\u5b9a\u3002", "\u5728 Qwen3.5-4B \u7684\u4e5d\u4e2a\u57fa\u51c6\u4e0a\uff0c5% \u89c6\u89c9 token \u4fdd\u7559\u65f6\u5e73\u5747\u6027\u80fd\u4ece 68.6% \u63d0\u5347\u5230 82.3%\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230 Qwen3.5-9B\u3001GLM-4.6V-9B\u3001LLaVA-OV-1.5-4B\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u6a21\u578b\u538b\u7f29", "\u77e5\u8bc6\u84b8\u998f", "\u89c6\u89c9token"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.32353v1", "published_at": "2026-09-26", "score": 0.238, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32353.png", "title": "Fewer Tokens, More Self-Teaching: On-Policy Self-Distillation for Extreme Visual Token Reduction", "tldr": "\u7528\u5728\u7ebf\u81ea\u84b8\u998f\u6062\u590d\u6781\u4f4e\u89c6\u89c9token\u6027\u80fd", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa LT-OPD\uff0c\u4e00\u79cd\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u6781\u7aef\u89c6\u89c9 token \u538b\u7f29\u7684\u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u8ba9\u4f4e\u89c6\u89c9 token \u5b66\u751f\u6a21\u578b\u6cbf\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u5b66\u4e60\uff0c\u7531\u5168 token \u51bb\u7ed3\u6559\u5e08\u6a21\u578b\u63d0\u4f9b\u5206\u5e03\u76d1\u7763\uff0c\u5e76\u901a\u8fc7\u9010\u6b65\u964d\u4f4e token \u9884\u7b97\u7684\u8bfe\u7a0b\u8bad\u7ec3\u7a33\u5b9a\u5b66\u4e60\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u591a\u6a21\u6001\u6a21\u578b\u63a8\u7406\u6210\u672c\u7684\u6838\u5fc3\u74f6\u9888\uff0c\u5728\u51e0\u4e4e\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u6062\u590d\u6781\u7aef\u89c6\u89c9 token \u538b\u7f29\u9020\u6210\u7684\u80fd\u529b\u635f\u5931\uff0c\u540c\u65f6\u51cf\u5c11 85% \u4ee5\u4e0a KV-cache \u548c prefill FLOPs\uff0c\u5177\u6709\u660e\u786e\u7684\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Streaming video understanding requires models to interpret evidence as it arrives, yet current evaluations often report task scores without specifying when evidence becomes valid, how visual history is maintained, or how responses are triggered. As a result, similar scores may correspond to different workloads, failure modes, and operational behavior. We introduce TRACE (Temporal Audit and Condition-aware Evaluation), a condition-aware benchmark and evaluation framework that makes these factors explicit. TRACE combines temporally audited visual tasks with evidence timing and instruction-dependent trigger annotations, a unified causal Core--Adapter protocol that controls information availability while recording actual history processing and response events, and multidimensional reporting of answer quality, timeliness, response-selection behavior, workload, completion, and reliability. On 1,240 records from 517 videos, we evaluate eight publicly available models or systems in eight configurations. We find that nearly identical QA accuracy can mask substantial differences in completion, answer validity, and generation workload, while proactive performance separates into response quality, response delay, false alarms (responses emitted while no target window is currently valid and a later one remains), and missed target windows. These results show that streaming-video performance should be interpreted as execution-conditioned system behavior rather than a single score. Our benchmark and code can be accessed at \\href{https://github.com/om-ai-lab/trace-bench}{https://github.com/om-ai-l
