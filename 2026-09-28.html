sonalization methods aim to preserve. We call this failure mode personalization collapse: explicit style control can conflict with implicit user preferences. To address this challenge, we propose PsPLUG, a lightweight plug-in that learns a user-specific residual after accounting for the requested style. PsPLUG also allows us to tune personalization strength at inference time. Our experiments show that explicit style instructions can diminish personalization in existing methods, whereas PsPLUG better preserves user preferences while providing precise control over the balance between personalization and style adherence.", "arxiv_id": "2601.06362", "arxiv_url": "https://arxiv.org/abs/2601.06362", "authors": ["Yutong Song", "Jiang Wu", "Shaofan Yuan", "Chengze Shen", "Jian Wang", "Yu Wang", "Nikil Dutt", "Amir M. Rahmani"], "brief": "\u672c\u6587\u6307\u51fa\u4e2a\u6027\u5316\u5927\u6a21\u578b\u5728\u9075\u5faa\u663e\u5f0f\u98ce\u683c\u6307\u4ee4\u65f6\uff0c\u53ef\u80fd\u4e22\u5931\u9690\u5f0f\u7528\u6237\u504f\u597d\uff0c\u79f0\u4e3a\u201c\u4e2a\u6027\u5316\u574d\u584c\u201d\u3002\u4f5c\u8005\u63d0\u51fa\u8f7b\u91cf\u63d2\u4ef6 PsPLUG\uff0c\u5728\u6263\u9664\u76ee\u6807\u98ce\u683c\u5f71\u54cd\u540e\u5b66\u4e60\u7528\u6237\u7279\u5b9a\u6b8b\u5dee\uff0c\u5e76\u652f\u6301\u63a8\u7406\u65f6\u8c03\u8282\u4e2a\u6027\u5316\u5f3a\u5ea6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2601.06362", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u663e\u5f0f\u98ce\u683c\u63a7\u5236\u4f1a\u524a\u5f31\u73b0\u6709\u4e2a\u6027\u5316\u65b9\u6cd5\u4fdd\u7559\u7528\u6237\u7279\u5f81\u7684\u80fd\u529b", "PsPLUG\u901a\u8fc7\u5b66\u4e60\u7528\u6237\u7279\u5b9a\u6b8b\u5dee\uff0c\u5728\u98ce\u683c\u9075\u5faa\u4e0e\u4e2a\u6027\u5316\u8868\u8fbe\u4e4b\u95f4\u89e3\u8026", "\u63a8\u7406\u9636\u6bb5\u53ef\u8c03\u8282\u4e2a\u6027\u5316\u5f3a\u5ea6\uff0c\u5b9e\u73b0\u98ce\u683c\u4e00\u81f4\u6027\u4e0e\u7528\u6237\u504f\u597d\u7684\u53ef\u63a7\u5e73\u8861"], "keywords": ["\u4e2a\u6027\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u98ce\u683c\u63a7\u5236", "\u53ef\u63a7\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "UC Irvine", "pdf_url": "https://arxiv.org/pdf/2601.06362v3", "published_at": "2026-01-10", "score": 0.196, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2601.06362.png", "title": "Do Implicit Personalization and Explicit Styles Conflict? PsPLUG: A Lightweight Plug-in for Balancing Personalization and Style in Customized LLMs", "tldr": "PsPLUG\u7f13\u89e3\u4e2a\u6027\u5316\u4e0e\u663e\u5f0f\u98ce\u683c\u51b2\u7a81", "upvotes": 4, "what_it_is": "\u672c\u6587\u6307\u51fa\u4e2a\u6027\u5316\u5927\u6a21\u578b\u5728\u9075\u5faa\u663e\u5f0f\u98ce\u683c\u6307\u4ee4\u65f6\uff0c\u53ef\u80fd\u4e22\u5931\u9690\u5f0f\u7528\u6237\u504f\u597d\uff0c\u79f0\u4e3a\u201c\u4e2a\u6027\u5316\u574d\u584c\u201d\u3002\u4f5c\u8005\u63d0\u51fa\u8f7b\u91cf\u63d2\u4ef6 PsPLUG\uff0c\u5728\u6263\u9664\u76ee\u6807\u98ce\u683c\u5f71\u54cd\u540e\u5b66\u4e60\u7528\u6237\u7279\u5b9a\u6b8b\u5dee\uff0c\u5e76\u652f\u6301\u63a8\u7406\u65f6\u8c03\u8282\u4e2a\u6027\u5316\u5f3a\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u4e2a\u6027\u5316LLM\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u98ce\u683c\u6307\u4ee4\u51b2\u7a81\u95ee\u9898\uff0c\u5e76\u63d0\u4f9b\u4e86\u8f7b\u91cf\u3001\u53ef\u63a7\u7684\u63d2\u4ef6\u5f0f\u89e3\u51b3\u65b9\u6848\uff0c\u5bf9\u5b9a\u5236\u5316\u52a9\u624b\u3001\u5199\u4f5c\u4ee3\u7406\u548c\u7528\u6237\u753b\u50cf\u9a71\u52a8\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Merging low-rank adapters (LoRAs) promises to eliminate the overhead of swapping task-specific weights at inference time. However, existing merging methods assume every layer needs the same rank budget. Further, some methods assume that rank budget needs to be split equally among the tasks too. We show this uniform-budget assumption is a major source of the performance gap between merged and per-task LoRAs. However, rank selection is an NP hard problem. To this end, we introduce Net Utility, a data free metric that first decomposes every task LoRA by its Singular Value Decomposition (SVD) and scores each of those singular directions by its task utility and its interference with other tasks directions. Next, we globally pool these scores to select singular directions with the highest values with a constraint on the total number of directions selected. The proposed Net Utility metric is applied on top of five different merging methods across three different merging spaces. The merging is done over two sets of tasks, vision and language tasks. Net utility based rank allocation outperforms its counterparts without that allocation. On average, over vision tasks it achieves +2.1% improvement in performance, and +2.2% improvement over the language tasks.", "arxiv_id": "2609.22237", "arxiv_url": "https://arxiv.org/abs/2609.22237", "authors": ["Avinash Amballa", "Yashas Malur Saidutta", "Wenbo Li", "Lazar Valkov", "Srinivas Chappidi"], "brief": "\u672c\u6587\u6307\u51fa\u73b0\u6709LoRA\u5408\u5e76\u65b9\u6cd5\u4e2d\u201c\u5404\u5c42\u3001\u5404\u4efb\u52a1\u5747\u5300\u5206\u914d\u79e9\u9884\u7b97\u201d\u7684\u5047\u8bbe\u4f1a\u9020\u6210\u6027\u80fd\u635f\u5931\u3002\u4f5c\u8005\u63d0\u51fa\u65e0\u9700\u6570\u636e\u7684 Net Utility \u6307\u6807\uff0c\u901a\u8fc7SVD\u5206\u89e3\u5404\u4efb\u52a1LoRA\u5e76\u8bc4\u4f30\u5947\u5f02\u65b9\u5411\u7684\u4efb\u52a1\u6548\u7528\u4e0e\u8de8\u4efb\u52a1\u5e72\u6270\uff0c\u4ece\u5168\u5c40\u9009\u62e9\u6700\u6709\u4ef7\u503c\u7684\u65b9\u5411\u8fdb\u884c\u9884\u7b97\u53d7\u9650\u5408\u5e76\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.22237", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5c06LoRA\u79e9\u9009\u62e9\u5efa\u6a21\u4e3a\u9884\u7b97\u7ea6\u675f\u4e0b\u7684\u5168\u5c40\u65b9\u5411\u9009\u62e9\u95ee\u9898\uff0c\u5e76\u6307\u51fa\u7cbe\u786e\u6c42\u89e3\u4e3aNP-hard", "Net Utility \u65e0\u9700\u8bad\u7ec3\u6570\u636e\uff0c\u7efc\u5408\u8861\u91cf\u6bcf\u4e2a\u5947\u5f02\u65b9\u5411\u7684\u4efb\u52a1\u8d21\u732e\u4e0e\u5bf9\u5176\u4ed6\u4efb\u52a1\u7684\u5e72\u6270", "\u5728\u89c6\u89c9\u4e0e\u8bed\u8a00\u4efb\u52a1\u30015\u79cd\u5408\u5e76\u65b9\u6cd5\u548c3\u79cd\u5408\u5e76\u7a7a\u95f4\u4e0a\u9a8c\u8bc1\uff0c\u5e73\u5747\u5206\u522b\u63d0\u5347\u7ea62.1%\u548c2.2%"], "keywords": ["\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u6a21\u578b\u5408\u5e76", "\u591a\u4efb\u52a1\u5b66\u4e60", "LoRA"], "num_comments": 2, "on_hf": true, "organization": "Samsung Research", "pdf_url": "https://arxiv.org/pdf/2609.22237v1", "published_at": "2026-09-03", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.22237.png", "title": "Not All Ranks Are Equal: Budget-Aware LoRA Merging Across Tasks", "tldr": "\u6309\u6548\u7528\u5206\u914dLoRA\u79e9\u9884\u7b97\uff0c\u63d0\u5347\u591a\u4efb\u52a1\u5408\u5e76\u6548\u679c", "upvotes": 2, "what_it_is": "\u672c\u6587\u6307\u51fa\u73b0\u6709LoRA\u5408\u5e76\u65b9\u6cd5\u4e2d\u201c\u5404\u5c42\u3001\u5404\u4efb\u52a1\u5747\u5300\u5206\u914d\u79e9\u9884\u7b97\u201d\u7684\u5047\u8bbe\u4f1a\u9020\u6210\u6027\u80fd\u635f\u5931\u3002\u4f5c\u8005\u63d0\u51fa\u65e0\u9700\u6570\u636e\u7684 Net Utility \u6307\u6807\uff0c\u901a\u8fc7SVD\u5206\u89e3\u5404\u4efb\u52a1LoRA\u5e76\u8bc4\u4f30\u5947\u5f02\u65b9\u5411\u7684\u4efb\u52a1\u6548\u7528\u4e0e\u8de8\u4efb\u52a1\u5e72\u6270\uff0c\u4ece\u5168\u5c40\u9009\u62e9\u6700\u6709\u4ef7\u503c\u7684\u65b9\u5411\u8fdb\u884c\u9884\u7b97\u53d7\u9650\u5408\u5e76\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9LoRA\u591a\u4efb\u52a1\u5408\u5e76\u4e2d\u7684\u6838\u5fc3\u74f6\u9888\u2014\u2014\u79e9\u9884\u7b97\u5206\u914d\u4e0d\u5747\u2014\u2014\u7ed9\u51fa\u8f7b\u91cf\u3001\u901a\u7528\u4e14\u65e0\u9700\u6570\u636e\u7684\u89e3\u51b3\u65b9\u6848\uff0c\u53ef\u76f4\u63a5\u589e\u5f3a\u73b0\u6709\u5408\u5e76\u65b9\u6cd5\uff0c\u964d\u4f4e\u63a8\u7406\u65f6\u5207\u6362\u9002\u914d\u5668\u7684\u5f00\u9500\u3002"}, {"abstract": "Standard positional encodings treat position as a one-dimensional reading-order coordinate, but reading order alone does not determine hierarchical textual structure. We use a hierarchical rotary positional encoding (hRoPE) that represents paragraph, sentence, and token indices as separate channels, hold the token sequence fixed, intervene on the paragraph coordinate $p_1$, and measure cross-paragraph attention with a token-distance-exact estimator. Attention is compressed in every corpus, but compression alone is not diagnostic of true structure: an architecturally identical channel with density-matched random labels is compressed too. What distinguishes real structure is the depth of compression: the real-versus-random depth gap is resolvable in two of three corpora and not in the third, and real-structure depth varies more strongly across corpora than the control\u0027s. Comparing eight corpus-only quantities across three constructs (lexical persistence, paragraph length, embedding-based coherence), none fully reproduces the cross-corpus ordering of depth, though embedding-based coherence comes closest. At the paragraph level that relation transfers as a common slope, but with the opposite sign to the corpus-level ranking: controlling for length, diversity, and position, paragraphs with more similar neighbors compress less deeply, with no detectable slope difference between any pair of corpora, while length, lexical-diversity, and position effects remain corpus-specific. Compression depth, not its location, is the reproducible signature of genuine paragraph structure in our setting.", "arxiv_id": "2609.23551", "arxiv_url": "https://arxiv.org/abs/2609.23551", "authors": ["Shuyang Xiang"], "brief": "\u8bba\u6587\u7528\u5c42\u7ea7\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801 hRoPE \u5c06\u6bb5\u843d\u3001\u53e5\u5b50\u3001\u8bcd\u5143\u4f4d\u7f6e\u5206\u901a\u9053\u8868\u793a\uff0c\u5e76\u5728\u56fa\u5b9a\u8bcd\u5143\u5e8f\u5217\u4e0b\u5e72\u9884\u6bb5\u843d\u5750\u6807\uff0c\u5206\u6790\u8de8\u6bb5\u843d\u6ce8\u610f\u529b\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u6ce8\u610f\u529b\u538b\u7f29\u672c\u8eab\u4e0d\u8db3\u4ee5\u8bc1\u660e\u771f\u5b9e\u7ed3\u6784\uff0c\u771f\u6b63\u53ef\u590d\u73b0\u7684\u4fe1\u53f7\u662f\u201c\u538b\u7f29\u6df1\u5ea6\u201d\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/ShuyangenFrance/hrope", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.23551", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u57fa\u4e8e\u6bb5\u843d\u5750\u6807\u5e72\u9884\u548c\u7cbe\u786e\u63a7\u5236\u8bcd\u5143\u8ddd\u79bb\u7684\u4f30\u8ba1\u65b9\u6cd5\uff0c\u6d4b\u91cf\u8de8\u6bb5\u843d\u6ce8\u610f\u529b\u538b\u7f29\u3002", "\u968f\u673a\u5bc6\u5ea6\u5339\u914d\u6807\u7b7e\u4e5f\u4f1a\u4ea7\u751f\u6ce8\u610f\u529b\u538b\u7f29\uff0c\u56e0\u6b64\u538b\u7f29\u4f4d\u7f6e\u6216\u662f\u5426\u538b\u7f29\u5e76\u975e\u771f\u5b9e\u5c42\u7ea7\u7ed3\u6784\u7684\u5145\u5206\u8bc1\u636e\u3002", "\u771f\u5b9e\u6bb5\u843d\u7ed3\u6784\u4e0e\u968f\u673a\u5bf9\u7167\u7684\u538b\u7f29\u6df1\u5ea6\u5dee\u5f02\u5728\u4e09\u4e2a\u8bed\u6599\u4e2d\u6709\u4e24\u4e2a\u53ef\u5206\u8fa8\uff0c\u4e14\u771f\u5b9e\u7ed3\u6784\u7684\u6df1\u5ea6\u8de8\u8bed\u6599\u53d8\u5316\u66f4\u5f3a\u3002"], "keywords": ["\u4f4d\u7f6e\u7f16\u7801", "\u6ce8\u610f\u529b\u673a\u5236", "\u6587\u672c\u7ed3\u6784", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.23551v2", "published_at": "2026-09-20", "score": 0.175, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.23551.png", "title": "Paragraph Boundaries Are Not White Space:Compression Depth as the Signature of Hierarchical Structure", "tldr": "\u538b\u7f29\u6df1\u5ea6\u63ed\u793a\u771f\u5b9e\u6bb5\u843d\u5c42\u7ea7\u7ed3\u6784", "upvotes": 1, "what_it_is": "\u8bba\u6587\u7528\u5c42\u7ea7\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801 hRoPE \u5c06\u6bb5\u843d\u3001\u53e5\u5b50\u3001\u8bcd\u5143\u4f4d\u7f6e\u5206\u901a\u9053\u8868\u793a\uff0c\u5e76\u5728\u56fa\u5b9a\u8bcd\u5143\u5e8f\u5217\u4e0b\u5e72\u9884\u6bb5\u843d\u5750\u6807\uff0c\u5206\u6790\u8de8\u6bb5\u843d\u6ce8\u610f\u529b\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u6ce8\u610f\u529b\u538b\u7f29\u672c\u8eab\u4e0d\u8db3\u4ee5\u8bc1\u660e\u771f\u5b9e\u7ed3\u6784\uff0c\u771f\u6b63\u53ef\u590d\u73b0\u7684\u4fe1\u53f7\u662f\u201c\u538b\u7f29\u6df1\u5ea6\u201d\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3a\u5206\u6790\u8bed\u8a00\u6a21\u578b\u662f\u5426\u6355\u6349\u6587\u672c\u5c42\u7ea7\u7ed3\u6784\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u8bca\u65ad\u6307\u6807\uff0c\u6307\u51fa\u5e94\u5173\u6ce8\u538b\u7f29\u6df1\u5ea6\u800c\u975e\u7b80\u5355\u7684\u6ce8\u610f\u529b\u538b\u7f29\u73b0\u8c61\uff0c\u5bf9\u4f4d\u7f6e\u7f16\u7801\u548c\u957f\u6587\u672c\u7ed3\u6784\u5efa\u6a21\u5177\u6709\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002"}, {"abstract": "Concept erasure aims to suppress undesirable knowledge in text-to-image generative models. However, existing robustness evaluations typically rely on relearning attacks tailored to specific model architectures. We study concept reactivation across two substantially different generative paradigms: noise-prediction U-Nets and flow-matching Transformers. We introduce \\textbf{Concept Score Relearning (CSR)}, a unified parameter-level framework that reactivates erased concepts by optimizing each model within its native prediction space. CSR requires no external target-concept image dataset and applies the same concept-directed objective to both U-Net-based Stable Diffusion and Transformer-based FLUX. Experiments across diverse concepts and multiple erasure methods demonstrate consistent concept reactivation across both architectures, highlighting the cross-architecture applicability of CSR and the persistent recoverability of apparently erased concepts. For strict nudity, CSR reaches average ASRs of 50.47\\% on FLUX and 40.29\\% on Stable Diffusion, consistently ranking first across all evaluated safety settings.", "arxiv_id": "2609.33445", "arxiv_url": "https://arxiv.org/abs/2609.33445", "authors": ["Hong Xi Tae", "Jiaming Zhang", "Wenwen He", "Xuan Wang", "Wei Yang Bryan Lim"], "brief": "\u672c\u6587\u63d0\u51fa Concept Score Relearning\uff08CSR\uff09\uff0c\u4e00\u79cd\u8de8\u67b6\u6784\u7684\u53c2\u6570\u7ea7\u6982\u5ff5\u91cd\u6fc0\u6d3b\u653b\u51fb\u6846\u67b6\u3002\u5b83\u5728\u6a21\u578b\u539f\u751f\u9884\u6d4b\u7a7a\u95f4\u4e2d\u4f18\u5316\uff0c\u53ef\u540c\u65f6\u653b\u51fb U-Net \u7248 Stable Diffusion \u4e0e Transformer \u7248 FLUX\uff0c\u4e14\u4e0d\u9700\u8981\u76ee\u6807\u6982\u5ff5\u56fe\u50cf\u6570\u636e\u96c6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33445", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["CSR \u4f7f\u7528\u7edf\u4e00\u7684\u6982\u5ff5\u5bfc\u5411\u76ee\u6807\uff0c\u5728\u566a\u58f0\u9884\u6d4b U-Net \u548c flow-matching Transformer \u4e24\u7c7b\u751f\u6210\u8303\u5f0f\u4e0a\u5747\u9002\u7528\u3002", "\u5b9e\u9a8c\u8986\u76d6\u591a\u79cd\u88ab\u64e6\u9664\u6982\u5ff5\u548c\u591a\u79cd\u6982\u5ff5\u64e6\u9664\u65b9\u6cd5\uff0c\u7ed3\u679c\u663e\u793a\u770b\u4f3c\u88ab\u5220\u9664\u7684\u6982\u5ff5\u4ecd\u53ef\u88ab\u7a33\u5b9a\u6062\u590d\u3002", "\u5728\u4e25\u683c\u88f8\u9732\u5185\u5bb9\u573a\u666f\u4e2d\uff0cCSR \u5728 FLUX \u4e0a\u5e73\u5747\u653b\u51fb\u6210\u529f\u7387\u8fbe 50.47%\uff0c\u5728 Stable Diffusion \u4e0a\u8fbe 40.29%\uff0c\u5728\u6240\u6709\u5b89\u5168\u8bbe\u7f6e\u4e2d\u8868\u73b0\u6700\u5f3a\u3002"], "keywords": ["\u6587\u672c\u5230\u56fe\u50cf", "\u6a21\u578b\u5b89\u5168", "\u6982\u5ff5\u64e6\u9664", "\u5bf9\u6297\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33445v1", "published_at": "2026-09-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Concept Score Relearning: A Unified Cross-Architecture Attack on Concept Erasure", "tldr": "\u7edf\u4e00\u91cd\u5b66\u4e60\u653b\u51fb\u53ef\u6062\u590d\u88ab\u64e6\u9664\u6982\u5ff5", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Concept Score Relearning\uff08CSR\uff09\uff0c\u4e00\u79cd\u8de8\u67b6\u6784\u7684\u53c2\u6570\u7ea7\u6982\u5ff5\u91cd\u6fc0\u6d3b\u653b\u51fb\u6846\u67b6\u3002\u5b83\u5728\u6a21\u578b\u539f\u751f\u9884\u6d4b\u7a7a\u95f4\u4e2d\u4f18\u5316\uff0c\u53ef\u540c\u65f6\u653b\u51fb U-Net \u7248 Stable Diffusion \u4e0e Transformer \u7248 FLUX\uff0c\u4e14\u4e0d\u9700\u8981\u76ee\u6807\u6982\u5ff5\u56fe\u50cf\u6570\u636e\u96c6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u5f53\u524d\u6587\u672c\u5230\u56fe\u50cf\u6a21\u578b\u6982\u5ff5\u64e6\u9664\u65b9\u6cd5\u7684\u8106\u5f31\u6027\uff1a\u5373\u4f7f\u8de8\u8d8a\u4e0d\u540c\u751f\u6210\u67b6\u6784\uff0c\u88ab\u64e6\u9664\u6982\u5ff5\u4ecd\u53ef\u80fd\u901a\u8fc7\u7edf\u4e00\u91cd\u5b66\u4e60\u76ee\u6807\u6062\u590d\uff0c\u5bf9\u751f\u6210\u5f0f\u6a21\u578b\u5b89\u5168\u8bc4\u6d4b\u548c\u5185\u5bb9\u5b89\u5168\u9632\u62a4\u5177\u6709\u91cd\u8981\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Despite rapid progress in vision-language-action (VLA) models, existing reasoning paradigms still face a fundamental \\emph{state-representation mismatch} in open-loop planning. Given only an initial observation, models must internally simulate action-conditioned state transitions, whereas text-, pixel-, and latent-space reasoning can suffer from lossy spatial compression, error-accumulating visual generation, and bypass of intermediate latent tokens, respectively, undermining reliable long-horizon planning. We propose \\textbf{State-Space Visual Reasoning} (SSVR), which decouples static visual context, language constraints, and a recurrent latent state. SSVR encodes the initial image and instruction once, then conditions each action prediction on the latent state and updates it with an action-conditioned GRU. Using Qwen2.5-VL as the backbone, SSVR achieves 99.5/99.6, 96.3/98.0, and 83.9/90.6 EM/PR on FrozenLake, Maze, and MiniBehavior, substantially outperforming prior methods. Extensive experiments support the effectiveness of recurrent state modeling for VLA open-loop planning across input transformations and transfer settings. By reusing static visual-textual context and updating a compact recurrent state, SSVR supports efficient multi-step inference, achieving up to $98.58\\times$ faster Maze decoding rollouts than the evaluated baselines with the prefix cache prebuilt.", "arxiv_id": "2609.33412", "arxiv_url": "https://arxiv.org/abs/2609.33412", "authors": ["Junhao Xiao", "Haoxiang Zhao", "Menghao Fang", "Jinkui Zhang", "Jinghan Yu", "Xinyu Huang", "Zhiyu Wu", "Kaiming Xu", "Yi Chen", "Youjun Bao", "Zhiyuan Ma"], "brief": "\u8bba\u6587\u63d0\u51fa State-Space Visual Reasoning\uff08SSVR\uff09\uff0c\u9762\u5411\u4ec5\u7ed9\u5b9a\u521d\u59cb\u89c2\u6d4b\u7684\u5f00\u73af VLA \u89c4\u5212\u3002\u5b83\u5c06\u9759\u6001\u89c6\u89c9\u4e0a\u4e0b\u6587\u3001\u8bed\u8a00\u7ea6\u675f\u4e0e\u53ef\u9012\u5f52\u66f4\u65b0\u7684\u6f5c\u5728\u72b6\u6001\u89e3\u8026\uff0c\u7528\u52a8\u4f5c\u6761\u4ef6 GRU \u6a21\u62df\u591a\u6b65\u72b6\u6001\u8f6c\u79fb\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33412", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["SSVR \u53ea\u7f16\u7801\u4e00\u6b21\u521d\u59cb\u56fe\u50cf\u548c\u6307\u4ee4\uff0c\u6bcf\u6b65\u57fa\u4e8e\u5f53\u524d\u6f5c\u5728\u72b6\u6001\u9884\u6d4b\u52a8\u4f5c\uff0c\u5e76\u7528\u52a8\u4f5c\u6761\u4ef6 GRU \u66f4\u65b0\u72b6\u6001\u3002", "\u57fa\u4e8e Qwen2.5-VL\uff0c\u5728 FrozenLake\u3001Maze\u3001MiniBehavior \u4e0a\u5206\u522b\u8fbe\u5230 99.5/99.6\u300196.3/98.0\u300183.9/90.6 \u7684 EM/PR\uff0c\u663e\u8457\u4f18\u4e8e\u65e2\u6709\u65b9\u6cd5\u3002", "\u901a\u8fc7\u590d\u7528\u9759\u6001\u89c6\u89c9-\u6587\u672c\u4e0a\u4e0b\u6587\u548c\u7d27\u51d1\u72b6\u6001\u66f4\u65b0\uff0c\u591a\u6b65\u63a8\u7406\u66f4\u9ad8\u6548\uff1b\u5728 Maze \u89e3\u7801 rollout \u4e2d\u6700\u9ad8\u5b9e\u73b0 98.58\u00d7 \u52a0\u901f\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u72b6\u6001\u5efa\u6a21", "\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33412v1", "published_at": "2026-09-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Resolving State-Representation Mismatch: State-Space Visual Reasoning for Open-Loop VLA Planning", "tldr": "\u7528\u5faa\u73af\u72b6\u6001\u89e3\u51b3VLA\u5f00\u73af\u89c4\u5212\u9519\u914d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa State-Space Visual Reasoning\uff08SSVR\uff09\uff0c\u9762\u5411\u4ec5\u7ed9\u5b9a\u521d\u59cb\u89c2\u6d4b\u7684\u5f00\u73af VLA \u89c4\u5212\u3002\u5b83\u5c06\u9759\u6001\u89c6\u89c9\u4e0a\u4e0b\u6587\u3001\u8bed\u8a00\u7ea6\u675f\u4e0e\u53ef\u9012\u5f52\u66f4\u65b0\u7684\u6f5c\u5728\u72b6\u6001\u89e3\u8026\uff0c\u7528\u52a8\u4f5c\u6761\u4ef6 GRU \u6a21\u62df\u591a\u6b65\u72b6\u6001\u8f6c\u79fb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 VLA \u5f00\u73af\u957f\u7a0b\u89c4\u5212\u4e2d\u7684\u201c\u72b6\u6001\u8868\u793a\u9519\u914d\u201d\u63d0\u51fa\u660e\u786e\u5efa\u6a21\u65b9\u6848\uff0c\u907f\u514d\u7eaf\u6587\u672c\u3001\u50cf\u7d20\u751f\u6210\u6216\u666e\u901a\u6f5c\u53d8\u91cf\u63a8\u7406\u7684\u7d2f\u79ef\u8bef\u5dee\u4e0e\u4fe1\u606f\u7ed5\u8fc7\u95ee\u9898\uff0c\u5728\u7cbe\u5ea6\u548c\u63a8\u7406\u6548\u7387\u4e0a\u90fd\u6709\u660e\u663e\u6536\u76ca\u3002"}, {"abstract": "In realistic education, a solution is often expressed not only in words but in a drawing--a circuit, a geometric construction, a function plot--and a teacher must grade the drawing as carefully as the text. Recent advances in unified multimodal models have enabled scientific image generation, yet verifying the correctness of these specialized visual outputs remains a critical bottleneck: errors often arise from intricate domain knowledge, structural reasoning, and multi-step instruction rather than surface-level artifacts. Existing verifiers mainly target natural images and compress judgement into scalar scores, leaving scientific coverage and explainable feedback for error correction underexplored. To bridge this gap, we make three main contributions. (1) We construct SciGen-Verify, a benchmark dedicated to explainable verification of scientific image generation, spanning instruction following, multidisciplinary reasoning, and world knowledge domains. It contains a three-tier hierarchical protocol over the binary judgement, supporting explanation, and corrective editing instruction. (2) We develop SciGen-Verifier, a reasoning-driven multimodal verifier trained via cold-start supervised fine-tuning followed by a curriculum-based two-stage reinforcement learning pipeline. The rubric-guided process rewards first strengthen scientific reasoning exploration and outcome rewards subsequently align output with ground-truth annotation. (3) On SciGen-Verify, SciGen-Verifier achieves competitive performance against much larger proprietary models. It further serves as a practical online critic for iterative image rectification.", "arxiv_id": "2609.33399", "arxiv_url": "https://arxiv.org/abs/2609.33399", "authors": ["Jiali Chen", "Zhengteng Lin", "Zuqi Wang", "Shirong Lin", "Xi Yu", "Xusen Hei", "DingBa Fu", "Jiayuan Xie", "Yi Cai"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 SciGen-Verify \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u79d1\u5b66\u56fe\u50cf\u751f\u6210\u7ed3\u679c\u662f\u5426\u6b63\u786e\uff0c\u5e76\u8981\u6c42\u7ed9\u51fa\u89e3\u91ca\u4e0e\u4fee\u6b63\u5efa\u8bae\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa SciGen-Verifier\uff0c\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e0e\u8bfe\u7a0b\u5f0f\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u5b9e\u73b0\u9762\u5411\u79d1\u5b66\u56fe\u50cf\u7684\u591a\u6a21\u6001\u63a8\u7406\u9a8c\u8bc1\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33399", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["SciGen-Verify \u8986\u76d6\u6307\u4ee4\u9075\u5faa\u3001\u591a\u5b66\u79d1\u63a8\u7406\u4e0e\u4e16\u754c\u77e5\u8bc6\uff0c\u91c7\u7528\u201c\u4e8c\u5206\u7c7b\u5224\u65ad\u2014\u89e3\u91ca\u2014\u7f16\u8f91\u4fee\u6b63\u6307\u4ee4\u201d\u7684\u4e09\u5c42\u6807\u6ce8\u534f\u8bae\u3002", "SciGen-Verifier \u5148\u7528\u51b7\u542f\u52a8\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u901a\u8fc7\u57fa\u4e8e rubric \u7684\u63a8\u7406\u5956\u52b1\u548c\u7ed3\u679c\u5956\u52b1\u8fdb\u884c\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u3002", "\u5728\u8be5\u57fa\u51c6\u4e0a\u53ef\u4e0e\u66f4\u5927\u89c4\u6a21\u95ed\u6e90\u6a21\u578b\u7ade\u4e89\uff0c\u5e76\u53ef\u4f5c\u4e3a\u5728\u7ebf\u8bc4\u8bba\u5668\u8f85\u52a9\u8fed\u4ee3\u4fee\u6b63\u751f\u6210\u56fe\u50cf\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u79d1\u5b66\u56fe\u50cf", "\u53ef\u89e3\u91ca\u9a8c\u8bc1", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33399v1", "published_at": "2026-09-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SciGen-Verifier: A Multimodal Reasoner for Explainable Verification in Scientific Image Generation", "tldr": "\u9762\u5411\u79d1\u5b66\u56fe\u50cf\u751f\u6210\u7684\u53ef\u89e3\u91ca\u9a8c\u8bc1\u5668\u4e0e\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 SciGen-Verify \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u79d1\u5b66\u56fe\u50cf\u751f\u6210\u7ed3\u679c\u662f\u5426\u6b63\u786e\uff0c\u5e76\u8981\u6c42\u7ed9\u51fa\u89e3\u91ca\u4e0e\u4fee\u6b63\u5efa\u8bae\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa SciGen-Verifier\uff0c\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e0e\u8bfe\u7a0b\u5f0f\u4e24\u9636\u6bb5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u5b9e\u73b0\u9762\u5411\u79d1\u5b66\u56fe\u50cf\u7684\u591a\u6a21\u6001\u63a8\u7406\u9a8c\u8bc1\u3002", "why_notable": "\u79d1\u5b66\u56fe\u50cf\u751f\u6210\u7684\u9519\u8bef\u5f80\u5f80\u6d89\u53ca\u7ed3\u6784\u3001\u9886\u57df\u77e5\u8bc6\u548c\u591a\u6b65\u63a8\u7406\uff0c\u5355\u7eaf\u81ea\u7136\u56fe\u50cf\u5ba1\u7f8e\u8bc4\u5206\u96be\u4ee5\u8986\u76d6\u3002\u8be5\u5de5\u4f5c\u628a\u9a8c\u8bc1\u4ece\u6807\u91cf\u6253\u5206\u63a8\u8fdb\u5230\u53ef\u89e3\u91ca\u8bca\u65ad\u4e0e\u53ef\u6267\u884c\u4fee\u6b63\uff0c\u5bf9\u6559\u80b2\u3001\u79d1\u7814\u7ed8\u56fe\u548c\u591a\u6a21\u6001\u751f\u6210\u7cfb\u7edf\u7684\u53ef\u9760\u6027\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present VGGT-Diff, a geometry-routed multi-view diffusion model for sparse-view novel view synthesis. Existing novel view synthesis (NVS) methods face a fundamental trade-off: reconstruction-based approaches preserve observed geometry but struggle to synthesize unseen regions, while diffusion-based methods provide strong generative priors yet rely on implicit source-to-query correspondence. VGGT-Diff bridges these regimes by routing visual geometry latents from VGGT-\u03a9 into a pretrained video diffusion model. Each visual token is associated with a 3D point and confidence, then transformed into query-aligned latent conditions through a confidence-aware Visual Geometry Router (VGR) that preserves front and back surface evidence. These conditions guide joint target-view denoising, while Point-Track Residual Consistency (PTRC) regularizes predicted-clean residuals along reliable 3D tracks, improving multi-view stability. We further introduce robust geometry conditioning, combining training-time regularization with inference-time guidance for improved robustness. Experiments show competitive or state-of-the-art performance across interpolation and extrapolation under different viewpoint difficulties. Our code is available at https://github.com/chenkangjie1123/VGGT-Diff.", "arxiv_id": "2609.33253", "arxiv_url": "https://arxiv.org/abs/2609.33253", "authors": ["Kangjie Chen", "Xiangyu Li", "Dongbin Zhang", "Chaoda Zheng", "Shijia Chen", "Jinhao Deng", "Hongbin Lin", "Choo Sin Wai", "Minqi Wang", "Minghao Yang", "Dake Zhong", "Guorui Song", "Yu Zhang", "Xianming Liu", "Boyang Wang"], "brief": "\u8bba\u6587\u63d0\u51fa VGGT-Diff\uff0c\u5c06 VGGT-\u03a9 \u63d0\u4f9b\u7684\u89c6\u89c9\u51e0\u4f55\u6f5c\u8868\u793a\u8def\u7531\u5230\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u4e2d\uff0c\u7528\u4e8e\u7a00\u758f\u89c6\u89d2\u65b0\u89c6\u56fe\u5408\u6210\u3002\u5b83\u7ed3\u5408\u91cd\u5efa\u65b9\u6cd5\u7684\u51e0\u4f55\u4e00\u81f4\u6027\u4e0e\u6269\u6563\u6a21\u578b\u7684\u751f\u6210\u5148\u9a8c\uff0c\u5728\u63d2\u503c\u548c\u5916\u63a8\u89c6\u89d2\u4e0b\u751f\u6210\u66f4\u7a33\u5b9a\u7684\u65b0\u89c6\u56fe\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33253", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bbe\u8ba1\u7f6e\u4fe1\u5ea6\u611f\u77e5\u7684 Visual Geometry Router\uff0c\u5c06\u5e26\u67093D\u70b9\u4e0e\u7f6e\u4fe1\u5ea6\u7684\u89c6\u89c9 token \u8f6c\u6362\u4e3a\u76ee\u6807\u89c6\u89d2\u5bf9\u9f50\u7684\u6f5c\u6761\u4ef6\uff0c\u5e76\u4fdd\u7559\u524d\u540e\u8868\u9762\u8bc1\u636e\u3002", "\u63d0\u51fa Point-Track Residual Consistency\uff0c\u5728\u53ef\u97603D\u8f68\u8ff9\u4e0a\u7ea6\u675f\u9884\u6d4b\u5e72\u51c0\u6b8b\u5dee\uff0c\u63d0\u5347\u591a\u89c6\u56fe\u4e00\u81f4\u6027\u3002", "\u5f15\u5165\u9c81\u68d2\u51e0\u4f55\u6761\u4ef6\u673a\u5236\uff0c\u7ed3\u5408\u8bad\u7ec3\u65f6\u6b63\u5219\u5316\u4e0e\u63a8\u7406\u65f6\u5f15\u5bfc\uff0c\u589e\u5f3a\u51e0\u4f55\u6761\u4ef6\u4e0d\u51c6\u786e\u65f6\u7684\u7a33\u5b9a\u6027\u3002"], "keywords": ["\u65b0\u89c6\u56fe\u5408\u6210", "\u6269\u6563\u6a21\u578b", "\u4e09\u7ef4\u89c6\u89c9", "\u591a\u89c6\u89d2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33253v1", "published_at": "2026-09-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "VGGT-Diff: Visual Geometry Meets Diffusion for Sparse-View Novel View Synthesis", "tldr": "\u7528\u51e0\u4f55\u5f15\u5bfc\u6269\u6563\u63d0\u5347\u7a00\u758f\u89c6\u89d2\u65b0\u89c6\u56fe\u5408\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VGGT-Diff\uff0c\u5c06 VGGT-\u03a9 \u63d0\u4f9b\u7684\u89c6\u89c9\u51e0\u4f55\u6f5c\u8868\u793a\u8def\u7531\u5230\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u4e2d\uff0c\u7528\u4e8e\u7a00\u758f\u89c6\u89d2\u65b0\u89c6\u56fe\u5408\u6210\u3002\u5b83\u7ed3\u5408\u91cd\u5efa\u65b9\u6cd5\u7684\u51e0\u4f55\u4e00\u81f4\u6027\u4e0e\u6269\u6563\u6a21\u578b\u7684\u751f\u6210\u5148\u9a8c\uff0c\u5728\u63d2\u503c\u548c\u5916\u63a8\u89c6\u89d2\u4e0b\u751f\u6210\u66f4\u7a33\u5b9a\u7684\u65b0\u89c6\u56fe\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u6709\u6548\u7f13\u89e3\u4e86\u65b0\u89c6\u56fe\u5408\u6210\u4e2d\u201c\u51e0\u4f55\u4fdd\u771f\u201d\u4e0e\u201c\u672a\u77e5\u533a\u57df\u751f\u6210\u80fd\u529b\u201d\u4e4b\u95f4\u7684\u6743\u8861\uff0c\u5c06\u663e\u5f0f\u89c6\u89c9\u51e0\u4f55\u4e0e\u89c6\u9891\u6269\u6563\u5148\u9a8c\u7ed3\u5408\uff0c\u5728\u7a00\u758f\u89c6\u89d2\u3001\u63d2\u503c\u548c\u5916\u63a8\u7b49\u591a\u79cd\u96be\u5ea6\u8bbe\u7f6e\u4e0b\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u6216\u6700\u5148\u8fdb\u7ed3\u679c\u3002"}, {"abstract": "Visual world models enable robotic planning by predicting future observations, but dense latent-state propagation and sample-intensive trajectory optimization incur high inference latency and peak memory usage, limiting real-time deployment on resource-constrained platforms. Existing sparse world-model acceleration methods either rely on unguided token sparsification, which may discard planning-relevant information and restrict achievable sparsity, or introduce heavy auxiliary modules and cumbersome multi-stage training pipelines. In this work, we present Scope-WM, an efficient visual world model that scopes computation to prediction-relevant latent regions and promising action sequences. Scope-WM distills prediction relevance into a lightweight action-conditioned selector and applies full dynamics prediction only to a compact subset of selected tokens. It updates the remaining tokens using a compact summary of foreground states and their changes, allowing the background to perceive foreground dynamics without costly token-to-token interactions. During planning, Scope-WM preserves and reuses high-quality action sequences discovered during the initial MPC search, focusing subsequent search under reduced rollout budgets. The resulting pipeline requires only a one-off selector distillation followed by a single joint training stage for the sparse world model. On the challenging Push-T task, Scope-WM reduces peak GPU memory usage and planning time to $18.1\\%$ and $14.3\\%$ of those of dense DINO-WM, respectively, corresponding to a $6.97\\times$ planning speedup, while maintaining competitive task performance. Further evaluations across five diverse visual planning tasks demonstrate the general applicability of Scope-WM. Code is available at https://github.com/ChunZheng2022/Scope-WM.", "arxiv_id": "2609.33218", "arxiv_url": "https://arxiv.org/abs/2609.33218", "authors": ["Chunzheng Li", "Zesheng Jia", "Hongda Zhang", "Jiaying Tang", "Yuntian Wang", "Siao Liu", "Jin Wang"], "brief": "\u672c\u6587\u63d0\u51fa Scope-WM\uff0c\u4e00\u79cd\u9762\u5411\u673a\u5668\u4eba\u89c6\u89c9\u89c4\u5212\u7684\u9ad8\u6548\u4e16\u754c\u6a21\u578b\u3002\u5b83\u5c06\u8ba1\u7b97\u805a\u7126\u5230\u4e0e\u9884\u6d4b\u76f8\u5173\u7684\u6f5c\u5728\u533a\u57df\u548c\u66f4\u6709\u5e0c\u671b\u7684\u52a8\u4f5c\u5e8f\u5217\uff0c\u4ece\u800c\u964d\u4f4e\u63a8\u7406\u5ef6\u8fdf\u4e0e\u663e\u5b58\u5360\u7528\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33218", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u8f7b\u91cf\u7ea7\u52a8\u4f5c\u6761\u4ef6\u9009\u62e9\u5668\u84b8\u998f\u9884\u6d4b\u76f8\u5173\u6027\uff0c\u4ec5\u5bf9\u5c11\u91cf\u9009\u4e2d token \u6267\u884c\u5b8c\u6574\u52a8\u529b\u5b66\u9884\u6d4b\u3002", "\u672a\u9009\u4e2d\u80cc\u666f token \u7531\u524d\u666f\u72b6\u6001\u53ca\u53d8\u5316\u7684\u7d27\u51d1\u6458\u8981\u66f4\u65b0\uff0c\u4f7f\u80cc\u666f\u611f\u77e5\u524d\u666f\u52a8\u6001\u800c\u907f\u514d\u6602\u8d35\u7684\u5168 token \u4ea4\u4e92\u3002", "\u5728\u89c4\u5212\u9636\u6bb5\u590d\u7528\u521d\u59cb MPC \u641c\u7d22\u5f97\u5230\u7684\u9ad8\u8d28\u91cf\u52a8\u4f5c\u5e8f\u5217\uff0c\u540e\u7eed\u4ee5\u66f4\u4f4e rollout \u9884\u7b97\u805a\u7126\u641c\u7d22\uff1b\u5728 Push-T \u4e0a\u663e\u5b58\u548c\u89c4\u5212\u65f6\u95f4\u5206\u522b\u964d\u81f3 dense DINO-WM \u7684 18.1% \u548c 14.3%\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba\u89c4\u5212", "\u7a00\u758f\u8ba1\u7b97", "\u89c6\u89c9\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33218v1", "published_at": "2026-09-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Scope-WM: Scoped Computation for Efficient Visual World Models", "tldr": "\u6309\u9700\u7a00\u758f\u8ba1\u7b97\u52a0\u901f\u89c6\u89c9\u4e16\u754c\u6a21\u578b\u89c4\u5212", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Scope-WM\uff0c\u4e00\u79cd\u9762\u5411\u673a\u5668\u4eba\u89c6\u89c9\u89c4\u5212\u7684\u9ad8\u6548\u4e16\u754c\u6a21\u578b\u3002\u5b83\u5c06\u8ba1\u7b97\u805a\u7126\u5230\u4e0e\u9884\u6d4b\u76f8\u5173\u7684\u6f5c\u5728\u533a\u57df\u548c\u66f4\u6709\u5e0c\u671b\u7684\u52a8\u4f5c\u5e8f\u5217\uff0c\u4ece\u800c\u964d\u4f4e\u63a8\u7406\u5ef6\u8fdf\u4e0e\u663e\u5b58\u5360\u7528\u3002", "why_notable": "Scope-WM \u5728\u4e0d\u5f15\u5165\u590d\u6742\u591a\u9636\u6bb5\u8bad\u7ec3\u6216\u91cd\u578b\u8f85\u52a9\u6a21\u5757\u7684\u60c5\u51b5\u4e0b\uff0c\u5b9e\u73b0\u4e86\u63a5\u8fd1 7 \u500d\u7684\u89c4\u5212\u52a0\u901f\u5e76\u4fdd\u6301\u7ade\u4e89\u6027\u4efb\u52a1\u8868\u73b0\uff0c\u5bf9\u8d44\u6e90\u53d7\u9650\u5e73\u53f0\u4e0a\u7684\u5b9e\u65f6\u673a\u5668\u4eba\u89c6\u89c9\u89c4\u5212\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Personal Graphical User Interface (GUI) agents rely on interaction history to infer what a user wants from ambiguous instructions and to anticipate recurring routines. Existing approaches retrieve task-relevant history and append it to the policy\u0027s context, implicitly assuming that experience relevant to a task remains useful for each decision within it. We find that this help is largely spent at the first decision: retrieved history strongly improves the opening step of an episode, yet provides little sustained benefit over the remaining 90\\% of steps, and offers weak guidance on whether a proactive suggestion is warranted. A relevant record may tell the agent where to begin, but not which past action applies to the current screen or whether a routine is due now. The underlying issue is that relevance does not imply applicability}: relevance is determined at the task level, whereas applicability depends on the situation at decision time. We therefore recast personalization as experience activation and introduce ExpActivator, a training-free framework that activates only the experience applicable to the current situation. During execution, ExpActivator matches each new screen to historical states in the frozen GUI backbone\u0027s latent space and supplies the corresponding action as a reference. Before execution, it activates a recurring intent only when the current time and scenario provide sufficient support, and otherwise abstains. Across four GUI backbones, ExpActivator improves within-trajectory step success by 28\\% on average, achieves the best personalized execution on every backbone while using about one-fifth as many history tokens, and reaches approximately 2.3$\\times$ the Matthews correlation coefficient of the strongest proactive baseline. Experience pays where it is activated, not where it is appended.", "arxiv_id": "2609.33304", "arxiv_url": "https://arxiv.org/abs/2609.33304", "authors": ["Fuyao Zhang", "Xuan Wang", "Zherui Li", "Jiaming Zhang", "Longtao Huang", "Wei Yang Bryan Lim"], "brief": "\u8bba\u6587\u6307\u51fa\u4e2a\u4eba GUI \u667a\u80fd\u4f53\u4e2d\uff0c\u68c0\u7d22\u5230\u7684\u5386\u53f2\u7ecf\u9a8c\u867d\u4e0e\u4efb\u52a1\u76f8\u5173\uff0c\u4f46\u5f80\u5f80\u53ea\u5bf9\u9996\u6b65\u6709\u5e2e\u52a9\uff0c\u540e\u7eed\u51b3\u7b56\u9700\u8981\u5224\u65ad\u7ecf\u9a8c\u5728\u5f53\u524d\u754c\u9762\u4e0e\u60c5\u5883\u4e0b\u662f\u5426\u9002\u7528\u3002\u4f5c\u8005\u63d0\u51fa\u514d\u8bad\u7ec3\u6846\u67b6 ExpActivator\uff0c\u5728\u6267\u884c\u65f6\u6309\u5f53\u524d\u5c4f\u5e55\u6fc0\u6d3b\u53ef\u7528\u5386\u53f2\u52a8\u4f5c\uff0c\u5728\u6267\u884c\u524d\u6309\u65f6\u95f4\u4e0e\u573a\u666f\u5224\u65ad\u662f\u5426\u89e6\u53d1\u4f8b\u884c\u610f\u56fe\uff1b\u5728\u56db\u79cd GUI \u9aa8\u5e72\u4e0a\u5e73\u5747\u63d0\u5347\u6b65\u9aa4\u6210\u529f\u7387 28%\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u5386\u53f2 token \u4f7f\u7528\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33304", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "GUI\u667a\u80fd\u4f53", "\u4e2a\u6027\u5316", "\u7ecf\u9a8c\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33304v1", "published_at": "2026-09-27", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Relevance Does Not Imply Applicability: Experience Activation for Personal GUI Agents", "tldr": "\u8bba\u6587\u6307\u51fa\u4e2a\u4eba GUI \u667a\u80fd\u4f53\u4e2d\uff0c\u68c0\u7d22\u5230\u7684\u5386\u53f2\u7ecf\u9a8c\u867d\u4e0e\u4efb\u52a1\u76f8\u5173\uff0c\u4f46\u5f80\u5f80\u53ea\u5bf9\u9996\u6b65\u6709\u5e2e\u52a9\uff0c\u540e\u7eed\u51b3\u7b56\u9700\u8981\u5224\u65ad\u7ecf\u9a8c\u5728\u5f53\u524d\u754c\u9762\u4e0e\u60c5\u5883\u4e0b\u662f\u5426\u9002\u7528\u3002\u4f5c\u8005\u63d0\u51fa\u514d\u8bad\u7ec3\u6846\u67b6 ExpActivator\uff0c\u5728\u6267\u884c\u65f6\u6309\u5f53\u524d\u5c4f\u5e55\u6fc0\u6d3b\u53ef\u7528\u5386\u53f2\u52a8\u4f5c\uff0c\u5728\u6267\u884c\u524d\u6309\u65f6\u95f4\u4e0e\u573a\u666f\u5224\u65ad\u662f\u5426\u89e6\u53d1\u4f8b\u884c\u610f\u56fe\uff1b\u5728\u56db\u79cd GUI \u9aa8\u5e72\u4e0a\u5e73\u5747\u63d0\u5347\u6b65\u9aa4\u6210\u529f\u7387 28%\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u5386\u53f2 token \u4f7f\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Constructing complex physical worlds from language requires coordinating extensive 3D environments, detailed structures and objects at different spatial scales, and interacting physical processes under both stated goals and implicit physical constraints. We present WorldAgent, an agentic framework for verification-guided physical world construction from a single natural-language prompt, without iterative user debugging. A world construction layer expands the prompt into a structured world specification and uses physical knowledge to build scenes and run numerical simulations. After every step, a verification layer inspects scene geometry and simulation states alongside rendered views. Failed checks guide automatic revisions to the specification and re-execution of the affected steps. Accepted worlds pass the required checks and remain editable for further inspection and resimulation. We introduce AgenticSimBench, on which WorldAgent achieves the best scores among the evaluated agent-based methods on five of seven metrics. In a 26-participant user study, it receives the highest mean ratings across all four criteria.", "arxiv_id": "2609.33208", "arxiv_url": "https://arxiv.org/abs/2609.33208", "authors": ["Caoliwen Wang", "Mengdi Wang", "Yige Chen", "Zejia Wu", "Bowen Huang", "Siyuan Chen", "Guanxiong Chen", "Lifu Wei", "Heng Zhang", "Qinghai Zhang", "Yin Yang", "Guandao Yang", "Shiying Xiong", "Peng Wang", "Chenfanfu Jiang", "Peter Yichen Chen"], "brief": "WorldAgent \u662f\u4e00\u4e2a\u4ece\u5355\u6761\u81ea\u7136\u8bed\u8a00\u63d0\u793a\u6784\u5efa\u590d\u6742\u7269\u7406\u4e16\u754c\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u201c\u6784\u5efa\u5c42\u201d\u751f\u6210\u7ed3\u6784\u5316\u4e16\u754c\u89c4\u683c\u3001\u642d\u5efa3D\u573a\u666f\u5e76\u8fd0\u884c\u6570\u503c\u6a21\u62df\u3002\u5176\u201c\u9a8c\u8bc1\u5c42\u201d\u4f1a\u5728\u6bcf\u6b65\u68c0\u67e5\u51e0\u4f55\u3001\u4eff\u771f\u72b6\u6001\u548c\u6e32\u67d3\u89c6\u56fe\uff0c\u5931\u8d25\u540e\u81ea\u52a8\u4fee\u6b63\u89c4\u683c\u5e76\u91cd\u6267\u884c\uff1b\u5728 AgenticSimBench \u4e0a\u591a\u9879\u6307\u6807\u9886\u5148\uff0c\u5e76\u5728\u7528\u6237\u7814\u7a76\u4e2d\u83b7\u5f97\u6700\u9ad8\u5e73\u5747\u8bc4\u5206\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33208", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "3D\u751f\u6210", "\u7269\u7406\u4eff\u771f", "\u81ea\u52a8\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33208v1", "published_at": "2026-09-27", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "WorldAgent: Verification-Guided Agentic Physical World Construction", "tldr": "WorldAgent \u662f\u4e00\u4e2a\u4ece\u5355\u6761\u81ea\u7136\u8bed\u8a00\u63d0\u793a\u6784\u5efa\u590d\u6742\u7269\u7406\u4e16\u754c\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u201c\u6784\u5efa\u5c42\u201d\u751f\u6210\u7ed3\u6784\u5316\u4e16\u754c\u89c4\u683c\u3001\u642d\u5efa3D\u573a\u666f\u5e76\u8fd0\u884c\u6570\u503c\u6a21\u62df\u3002\u5176\u201c\u9a8c\u8bc1\u5c42\u201d\u4f1a\u5728\u6bcf\u6b65\u68c0\u67e5\u51e0\u4f55\u3001\u4eff\u771f\u72b6\u6001\u548c\u6e32\u67d3\u89c6\u56fe\uff0c\u5931\u8d25\u540e\u81ea\u52a8\u4fee\u6b63\u89c4\u683c\u5e76\u91cd\u6267\u884c\uff1b\u5728 AgenticSimBench \u4e0a\u591a\u9879\u6307\u6807\u9886\u5148\uff0c\u5e76\u5728\u7528\u6237\u7814\u7a76\u4e2d\u83b7\u5f97\u6700\u9ad8\u5e73\u5747\u8bc4\u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal models increasingly interpret visual environments, but their ability to recognize the same building across photographs, floor plans, elevations, sections, and renderings remains poorly characterized. We introduce ARCH-B, a benchmark of 354 four-choice questions across 11 cross-representational archetypes, constructed from a building-linked corpus of 3.9 million architectural images using visually similar distractors, model-guided difficulty screening, and manual validation. We evaluate 25 multimodal models and collect 5,830 responses from non-expert human participants. Model accuracy ranges from 10.45% to 83.90%, compared with a human baseline of 35.35%. Models perform comparatively well on mixed-representation outlier detection and photograph matching, but remain weaker on floorplan-to-photograph correspondence. Human and model difficulty across archetypes is only weakly correlated (Spearman\u0027s (\u03c1=0.33)). Held-out evaluation confirms that the difficulty identified during screening generalizes beyond the curation models. ARCH-B provides a diagnostic evaluation of visual correspondence and representation transfer across architectural media.", "arxiv_id": "2609.34047", "arxiv_url": "https://arxiv.org/abs/2609.34047", "authors": ["Kieran Sagar Parikh", "Jose Luis Garcia del Castillo y Lopez"], "brief": "\u672c\u6587\u63d0\u51fa ARCH-B\uff0c\u4e00\u4e2a\u8bc4\u4f30\u591a\u6a21\u6001\u6a21\u578b\u8de8\u5efa\u7b51\u8868\u793a\u7406\u89e3\u80fd\u529b\u7684\u57fa\u51c6\uff0c\u6db5\u76d6\u7167\u7247\u3001\u5e73\u9762\u56fe\u3001\u7acb\u9762\u56fe\u3001\u5256\u9762\u56fe\u548c\u6e32\u67d3\u56fe\u7b49 11 \u7c7b\u8de8\u8868\u793a\u5339\u914d\u4efb\u52a1\u3002\u5bf9 25 \u4e2a\u591a\u6a21\u6001\u6a21\u578b\u548c\u4eba\u7c7b\u975e\u4e13\u5bb6\u6d4b\u8bd5\u663e\u793a\uff0c\u6a21\u578b\u6700\u9ad8\u53ef\u8fbe 83.90% \u51c6\u786e\u7387\u4f46\u5728\u5e73\u9762\u56fe\u5230\u7167\u7247\u5bf9\u5e94\u4e0a\u4ecd\u8f83\u5f31\uff0c\u4e14\u6a21\u578b\u4e0e\u4eba\u7c7b\u7684\u96be\u5ea6\u6a21\u5f0f\u76f8\u5173\u6027\u8f83\u4f4e\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34047", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u7406\u89e3", "\u57fa\u51c6\u6d4b\u8bd5", "\u5efa\u7b51\u8868\u793a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34047v1", "published_at": "2026-09-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ARCH-B: Architectural Representation, Comprehension and Hierarchy Benchmark", "tldr": "\u672c\u6587\u63d0\u51fa ARCH-B\uff0c\u4e00\u4e2a\u8bc4\u4f30\u591a\u6a21\u6001\u6a21\u578b\u8de8\u5efa\u7b51\u8868\u793a\u7406\u89e3\u80fd\u529b\u7684\u57fa\u51c6\uff0c\u6db5\u76d6\u7167\u7247\u3001\u5e73\u9762\u56fe\u3001\u7acb\u9762\u56fe\u3001\u5256\u9762\u56fe\u548c\u6e32\u67d3\u56fe\u7b49 11 \u7c7b\u8de8\u8868\u793a\u5339\u914d\u4efb\u52a1\u3002\u5bf9 25 \u4e2a\u591a\u6a21\u6001\u6a21\u578b\u548c\u4eba\u7c7b\u975e\u4e13\u5bb6\u6d4b\u8bd5\u663e\u793a\uff0c\u6a21\u578b\u6700\u9ad8\u53ef\u8fbe 83.90% \u51c6\u786e\u7387\u4f46\u5728\u5e73\u9762\u56fe\u5230\u7167\u7247\u5bf9\u5e94\u4e0a\u4ecd\u8f83\u5f31\uff0c\u4e14\u6a21\u578b\u4e0e\u4eba\u7c7b\u7684\u96be\u5ea6\u6a21\u5f0f\u76f8\u5173\u6027\u8f83\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reasoning vision-language models (VLMs) process images and videos as long sequences of visual tokens, making inference expensive. Training-free token pruning reduces this cost, but aggressive compression can sharply degrade performance, often attributed to irreversible loss of task-relevant visual information. We show that this explanation is incomplete. In a fixed-context Pass@K analysis, repeated sampling from the same pruned visual representation recovers many examples missed by greedy decoding, indicating that useful visual evidence can remain accessible but be used unreliably. We call this the representation-utilization gap. Motivated by this observation, we introduce SCOPD, a sparse-context on-policy self-distillation framework in which a student generates reasoning trajectories from pruned visual tokens while a privileged full-context teacher supervises the same on-policy prefixes. SCOPD requires no ground-truth responses, architectural changes, or additional inference-time computation. We further introduce SCOPD+, which uses a small visual-budget intervention to identify visually sensitive response positions and selectively distill them. At 10% visual-token retention, the Vanilla model retains 86.37% of its unpruned performance across 13 benchmarks. SCOPD raises this to 90.49%, while SCOPD+ further improves it to 92.43%. Across token budgets, benchmarks, and pruning operators, our results show that efficient reasoning depends not only on which visual information survives pruning, but also on how reliably the model learns to use it.", "arxiv_id": "2609.34044", "arxiv_url": "https://arxiv.org/abs/2609.34044", "authors": ["Ahmadreza Jeddi", "Enming Zhang", "Jasper Gerigk", "Hakki Karaimer", "Mozhgan Nasr Azadani", "Jiayun Luo", "Minh Ngoc Le", "Gholamali Aminian", "Hugo Buurmeijer", "Yongchao Chen", "Leonid Sigal", "Igor Gilitschenski", "Konstantinos G. Derpanis", "Marco Pavone", "Babak Taati"], "brief": "\u8bba\u6587\u6307\u51fa\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u89c6\u89c9 token \u526a\u679d\u540e\u6027\u80fd\u4e0b\u964d\uff0c\u4e0d\u4ec5\u56e0\u4e3a\u4fe1\u606f\u4e22\u5931\uff0c\u8fd8\u5b58\u5728\u201c\u8868\u793a-\u5229\u7528\u9e3f\u6c9f\u201d\uff1a\u6709\u7528\u89c6\u89c9\u8bc1\u636e\u4ecd\u5728\u4f46\u6a21\u578b\u4f7f\u7528\u4e0d\u7a33\u5b9a\u3002\u4f5c\u8005\u63d0\u51fa SCOPD \u7528\u5168\u4e0a\u4e0b\u6587\u6559\u5e08\u5bf9\u7a00\u758f\u4e0a\u4e0b\u6587\u5b66\u751f\u8fdb\u884c\u5728\u7ebf\u81ea\u84b8\u998f\uff0c\u65e0\u9700\u6807\u6ce8\u3001\u6539\u7ed3\u6784\u6216\u589e\u52a0\u63a8\u7406\u5f00\u9500\uff1b\u5728\u4ec5\u4fdd\u7559 10% \u89c6\u89c9 token \u65f6\uff0c\u5c06\u6027\u80fd\u4fdd\u6301\u7387\u4ece 86.37% \u63d0\u5347\u5230 90.49%\uff0cSCOPD+ \u8fdb\u4e00\u6b65\u5230 92.43%\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34044", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29", "\u81ea\u84b8\u998f", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34044v1", "published_at": "2026-09-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SCOPD: Sparse-Context On-Policy Self-Distillation for Efficient Vision-Language Models", "tldr": "\u8bba\u6587\u6307\u51fa\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u89c6\u89c9 token \u526a\u679d\u540e\u6027\u80fd\u4e0b\u964d\uff0c\u4e0d\u4ec5\u56e0\u4e3a\u4fe1\u606f\u4e22\u5931\uff0c\u8fd8\u5b58\u5728\u201c\u8868\u793a-\u5229\u7528\u9e3f\u6c9f\u201d\uff1a\u6709\u7528\u89c6\u89c9\u8bc1\u636e\u4ecd\u5728\u4f46\u6a21\u578b\u4f7f\u7528\u4e0d\u7a33\u5b9a\u3002\u4f5c\u8005\u63d0\u51fa SCOPD \u7528\u5168\u4e0a\u4e0b\u6587\u6559\u5e08\u5bf9\u7a00\u758f\u4e0a\u4e0b\u6587\u5b66\u751f\u8fdb\u884c\u5728\u7ebf\u81ea\u84b8\u998f\uff0c\u65e0\u9700\u6807\u6ce8\u3001\u6539\u7ed3\u6784\u6216\u589e\u52a0\u63a8\u7406\u5f00\u9500\uff1b\u5728\u4ec5\u4fdd\u7559 10% \u89c6\u89c9 token \u65f6\uff0c\u5c06\u6027\u80fd\u4fdd\u6301\u7387\u4ece 86.37% \u63d0\u5347\u5230 90.49%\uff0cSCOPD+ \u8fdb\u4e00\u6b65\u5230 92.43%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tracking any point of a dynamic scene in metric 3D - in absolute meters, not up to an unknown scale - underpins 3D and 4D reconstruction, robot navigation, and autonomous driving, where decisions are made in meters, not pixels. Our objective is a 3D point tracker accurate in those absolute terms and operating within a single commodity GPU, pose-free, monocular budget. Our method rests on one observation: once a point\u0027s 2D image trajectory is fixed, the quantity that governs its metric accuracy is the depth along its pixel ray. Rather than learning tracking end-to-end, we therefore compose two frozen front-ends - dense optical flow for 2D correspondence and a monocular metric-depth network for the third dimension - and learn only the residual they cannot supply: that depth, refined by a compact state space model (Mamba-3) conditioned on appearance features (DINOv3). A state space model rather than the transformers the strongest 3D trackers adopt is what makes a single-GPU budget attainable: it summarises a track in a fixed-size recurrent state whose memory cost is constant in the number of frames, whereas attention requires a key-value cache that grows linearly with them. On the TAPVid-3D minival benchmark our best configuration attains the highest absolute metric accuracy among methods evaluated under identical conditions (mean metric Average Jaccard, 0.256), exceeding strong feed-forward trackers, while a companion analysis, reproduced with each competitor\u0027s own evaluator, explains why several published trackers lose most of their accuracy under this budget.", "arxiv_id": "2609.34035", "arxiv_url": "https://arxiv.org/abs/2609.34035", "authors": ["Masahiro Ogawa", "Qi An", "Atsushi Yamashita"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u52a8\u6001\u573a\u666f\u7684\u5355\u76ee\u3001\u65e0\u4f4d\u59ff\u3001\u5355GPU\u9884\u7b97\u4e0b\u7684\u7c73\u52363D\u70b9\u8ddf\u8e2a\u65b9\u6cd5\u3002\u5b83\u51bb\u7ed3\u5149\u6d41\u4e0e\u5355\u76ee\u5ea6\u91cf\u6df1\u5ea6\u524d\u7aef\uff0c\u4ec5\u7528\u57fa\u4e8eMamba-3\u7684\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u7ed3\u5408DINOv3\u7279\u5f81\u6765\u4fee\u6b63\u6cbf\u50cf\u7d20\u5c04\u7ebf\u7684\u6df1\u5ea6\u6b8b\u5dee\uff0c\u5728TAPVid-3D minival\u4e0a\u53d6\u5f97\u5f53\u524d\u540c\u6761\u4ef6\u4e0b\u6700\u9ad8\u7684\u7edd\u5bf9\u5ea6\u91cf\u7cbe\u5ea6\u3002", "categories": ["cs.CV", "cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34035", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["3D\u89c6\u89c9", "\u70b9\u8ddf\u8e2a", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "\u5355\u76ee\u6df1\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34035v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "3D Point Tracking with State Space Models", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u52a8\u6001\u573a\u666f\u7684\u5355\u76ee\u3001\u65e0\u4f4d\u59ff\u3001\u5355GPU\u9884\u7b97\u4e0b\u7684\u7c73\u52363D\u70b9\u8ddf\u8e2a\u65b9\u6cd5\u3002\u5b83\u51bb\u7ed3\u5149\u6d41\u4e0e\u5355\u76ee\u5ea6\u91cf\u6df1\u5ea6\u524d\u7aef\uff0c\u4ec5\u7528\u57fa\u4e8eMamba-3\u7684\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u7ed3\u5408DINOv3\u7279\u5f81\u6765\u4fee\u6b63\u6cbf\u50cf\u7d20\u5c04\u7ebf\u7684\u6df1\u5ea6\u6b8b\u5dee\uff0c\u5728TAPVid-3D minival\u4e0a\u53d6\u5f97\u5f53\u524d\u540c\u6761\u4ef6\u4e0b\u6700\u9ad8\u7684\u7edd\u5bf9\u5ea6\u91cf\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A manga reader meets a character on one page and knows them on sight a hundred pages later, without ever being handed a cast list. Re-identifying comic characters demands the same, open-set and sequential: pages arrive as a stream in reading order, new faces appear before anyone names them, and the cast is assembled as the story is read. $\\textbf{Re:Cognize}$ evaluates recognition as the story is read, not against a cast handed over in advance: four protocols on one query stream, from closed-set retrieval to a cast the model must build and grow itself. The surprise is where models fail. Recognising is close to solved: one reference image per character already ranks as well as a gallery built in advance. Knowing what to believe is not: a model that adds its own matches makes its cast worse, while the same growth with correct labels would gain over twenty points of top-1 accuracy. The bottleneck is acceptance, not vision, and one comparison decides it: an addition pays exactly when it is right more often than the cast already was on the queries it takes over. The comparison has nothing to fit, and measured on half of a new corpus it calls the other half correctly. $\\textbf{ReCast}$ puts it to work with nothing fitted on data: a cast sheet of one running average per character, grown only where the page itself vouches for a crop. It recovers a third to two thirds of what perfect labels would, depending on whether the cast starts from random examples or from first appearances. Re:Cognize measures whether a model can read along; ReCast is a cast that does. Our claims are on identity maintenance, recognising characters already met; the emergence of new ones is measured as a diagnostic under a fixed reference rule, and we propose no method for it.", "arxiv_id": "2609.34032", "arxiv_url": "https://arxiv.org/abs/2609.34032", "authors": ["Aaditya Baranwal", "Madhav Kataria", "Yogesh S Rawat", "Shruti Vyas"], "brief": "\u8bba\u6587\u63d0\u51fa Re:Cognize\uff0c\u7528\u987a\u5e8f\u9605\u8bfb\u6d41\u8bc4\u4f30\u6f2b\u753b\u89d2\u8272\u5f00\u653e\u96c6\u91cd\u8bc6\u522b\uff0c\u800c\u4e0d\u662f\u9884\u5148\u7ed9\u5b9a\u5b8c\u6574\u89d2\u8272\u8868\u3002\u7814\u7a76\u53d1\u73b0\u89c6\u89c9\u5339\u914d\u672c\u8eab\u5df2\u8f83\u5f3a\uff0c\u4e3b\u8981\u74f6\u9888\u5728\u4e8e\u662f\u5426\u63a5\u53d7\u5e76\u52a0\u5165\u6a21\u578b\u81ea\u5df1\u7684\u5339\u914d\uff1b\u4e3a\u6b64\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 ReCast\uff0c\u901a\u8fc7\u9ad8\u7f6e\u4fe1\u9875\u9762\u8bc1\u636e\u9010\u6b65\u7ef4\u62a4\u89d2\u8272\u8868\uff0c\u53ef\u6062\u590d\u5b8c\u7f8e\u6807\u7b7e\u589e\u76ca\u7684\u4e09\u5206\u4e4b\u4e00\u5230\u4e09\u5206\u4e4b\u4e8c\u3002", "categories": ["cs.CV", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34032", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u7269\u91cd\u8bc6\u522b", "\u5f00\u653e\u96c6\u8bc6\u522b", "\u6f2b\u753b\u7406\u89e3", "\u591a\u5a92\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34032v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Re:Cognize -- Open-Set Comic Character Re-Identification", "tldr": "\u8bba\u6587\u63d0\u51fa Re:Cognize\uff0c\u7528\u987a\u5e8f\u9605\u8bfb\u6d41\u8bc4\u4f30\u6f2b\u753b\u89d2\u8272\u5f00\u653e\u96c6\u91cd\u8bc6\u522b\uff0c\u800c\u4e0d\u662f\u9884\u5148\u7ed9\u5b9a\u5b8c\u6574\u89d2\u8272\u8868\u3002\u7814\u7a76\u53d1\u73b0\u89c6\u89c9\u5339\u914d\u672c\u8eab\u5df2\u8f83\u5f3a\uff0c\u4e3b\u8981\u74f6\u9888\u5728\u4e8e\u662f\u5426\u63a5\u53d7\u5e76\u52a0\u5165\u6a21\u578b\u81ea\u5df1\u7684\u5339\u914d\uff1b\u4e3a\u6b64\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 ReCast\uff0c\u901a\u8fc7\u9ad8\u7f6e\u4fe1\u9875\u9762\u8bc1\u636e\u9010\u6b65\u7ef4\u62a4\u89d2\u8272\u8868\uff0c\u53ef\u6062\u590d\u5b8c\u7f8e\u6807\u7b7e\u589e\u76ca\u7684\u4e09\u5206\u4e4b\u4e00\u5230\u4e09\u5206\u4e4b\u4e8c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present a new class of near-linear algorithms for efficiently integrating general tensor fields defined on trees with distance dependent kernels, the Structure-Adaptive Tree Field Integrators (STAD-TFIs). STAD-TFIs exploit the tree\u0027s underlying structure through decompositions built around path backbones and single vertex separators, and use two-dimensional fast Fourier transforms to compute interactions jointly. By exploiting this structural information, STAD-TFIs achieve more computationally efficient integration than their regular efficient tree field integrators (TFI) counterparts. We provide a detailed theoretical analysis of our proposed approach and complement it with an exhaustive empirical evaluation, ranging from speed tests on synthetic trees, through accelerated Sinkhorn-based relaxations of the Optimal Transport algorithms on real meshes, to Topological Attention Transformers for vision tasks. To the best of our knowledge, we provide some of the first results showing that efficient to compute and accurate relaxations of the geodesic Sinkhorn-based solutions of the Optimal Transport problem can be derived by applying fast TFI methods.", "arxiv_id": "2609.34025", "arxiv_url": "https://arxiv.org/abs/2609.34025", "authors": ["Millend Roy", "Soham Samal", "Ivan Zelich", "Krzysztof Marcin Choromanski"], "brief": "\u8bba\u6587\u63d0\u51fa\u7ed3\u6784\u81ea\u9002\u5e94\u6811\u573a\u79ef\u5206\u5668\uff08STAD-TFI\uff09\uff0c\u5229\u7528\u6811\u7684\u8def\u5f84\u9aa8\u67b6\u4e0e\u5355\u70b9\u5206\u9694\u7ed3\u6784\uff0c\u5e76\u7ed3\u5408\u4e8c\u7ef4 FFT\uff0c\u9ad8\u6548\u8ba1\u7b97\u5e26\u8ddd\u79bb\u76f8\u5173\u6838\u7684\u6811\u4e0a\u5f20\u91cf\u573a\u79ef\u5206\u3002\u8be5\u65b9\u6cd5\u76f8\u6bd4\u5e38\u89c4 TFI \u66f4\u5feb\uff0c\u5177\u6709\u8fd1\u7ebf\u6027\u590d\u6742\u5ea6\uff0c\u5e76\u5728\u5408\u6210\u6811\u3001\u7f51\u683c\u6700\u4f18\u4f20\u8f93 Sinkhorn \u677e\u5f1b\u548c\u89c6\u89c9 Topological Attention Transformer \u4e2d\u9a8c\u8bc1\u4e86\u52a0\u901f\u6548\u679c\u3002", "categories": ["cs.LG", "cs.CV", "cs.DS", "math.NA", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34025", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u6548\u7b97\u6cd5", "\u6811\u7ed3\u6784", "\u6700\u4f18\u4f20\u8f93", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34025v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Structure-Adaptive Tree Field Integrators", "tldr": "\u8bba\u6587\u63d0\u51fa\u7ed3\u6784\u81ea\u9002\u5e94\u6811\u573a\u79ef\u5206\u5668\uff08STAD-TFI\uff09\uff0c\u5229\u7528\u6811\u7684\u8def\u5f84\u9aa8\u67b6\u4e0e\u5355\u70b9\u5206\u9694\u7ed3\u6784\uff0c\u5e76\u7ed3\u5408\u4e8c\u7ef4 FFT\uff0c\u9ad8\u6548\u8ba1\u7b97\u5e26\u8ddd\u79bb\u76f8\u5173\u6838\u7684\u6811\u4e0a\u5f20\u91cf\u573a\u79ef\u5206\u3002\u8be5\u65b9\u6cd5\u76f8\u6bd4\u5e38\u89c4 TFI \u66f4\u5feb\uff0c\u5177\u6709\u8fd1\u7ebf\u6027\u590d\u6742\u5ea6\uff0c\u5e76\u5728\u5408\u6210\u6811\u3001\u7f51\u683c\u6700\u4f18\u4f20\u8f93 Sinkhorn \u677e\u5f1b\u548c\u89c6\u89c9 Topological Attention Transformer \u4e2d\u9a8c\u8bc1\u4e86\u52a0\u901f\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-Time Training (TTT) adapts models to incoming test samples (e.g. out-of-distribution, (OOD)) when conventional fine-tuning is infeasible. Existing TTT methods for Vision-Language Models (VLMs) create supervision from several augmented views, each requiring forward (and often backward) passes through the entire VLM, incurring substantial computational cost. We observe that one forward pass with all the intermediate layer outputs already yields far more signal than the final embedding from all augmentations. We introduce Layer Query Network (LQN), a lightweight approach that can adapt a frozen VLM (teacher) in a single forward pass of the VLM via a small model (student). LQN uses Position-Aware Distillation (PAD) to mimic the teacher VLM\u0027s intermediate-layer spatial tokens by querying spatial coordinates of intermediate tokens. LQN additionally relies on Location Consistency Regularization (LCR), a self-supervision technique, replacing expensive O(H x W) image augmentation with O(1) coordinate sampling. Integrating these, LQN i) adapts and improves zero-shot CLIP ViT-B/16 by 9.8% Top-1 on OOD ImageNet, ii) outperforms the previous best GS-Bias on fine-grained classification by 3.9% Top-1, iii) achieves faster convergence than TPS for CLIP ResNet-50 (47 mins vs 55 mins), iv) generalizes adaptation to VLMs like SigLIP, EVA-CLIP, and CoCa, and lightweight students like MLP, ResNet, VGG, and v) extends to panoptic, instance, and semantic segmentation.", "arxiv_id": "2609.34021", "arxiv_url": "https://arxiv.org/abs/2609.34021", "authors": ["Rajat Modi", "Priyank Pathak", "Xin Liang", "Yogesh Singh Rawat"], "brief": "\u63d0\u51fa Layer Query Network\uff08LQN\uff09\uff0c\u901a\u8fc7\u5355\u6b21\u524d\u5411\u5229\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u95f4\u5c42\u7a7a\u95f4 token\uff0c\u5e76\u7528\u4f4d\u7f6e\u611f\u77e5\u84b8\u998f\u548c\u4f4d\u7f6e\u4e00\u81f4\u6027\u6b63\u5219\u6765\u8fdb\u884c\u6d4b\u8bd5\u65f6\u8bad\u7ec3\uff0c\u907f\u514d\u591a\u89c6\u56fe\u589e\u5f3a\u5e26\u6765\u7684\u9ad8\u8ba1\u7b97\u6210\u672c\u3002\u5728 OOD ImageNet\u3001\u7ec6\u7c92\u5ea6\u5206\u7c7b\u548c\u5206\u5272\u7b49\u4efb\u52a1\u4e0a\u63d0\u5347 CLIP \u7b49 VLM \u7684\u9002\u5e94\u6548\u679c\uff0c\u5e76\u5b9e\u73b0\u66f4\u5feb\u6536\u655b\u548c\u8de8\u6a21\u578b\u6cdb\u5316\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34021", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u8bad\u7ec3", "\u77e5\u8bc6\u84b8\u998f", "\u5f00\u653e\u96c6\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34021v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Position Aware Layer Queries for Test Time Training in Vision Language Models", "tldr": "\u63d0\u51fa Layer Query Network\uff08LQN\uff09\uff0c\u901a\u8fc7\u5355\u6b21\u524d\u5411\u5229\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u95f4\u5c42\u7a7a\u95f4 token\uff0c\u5e76\u7528\u4f4d\u7f6e\u611f\u77e5\u84b8\u998f\u548c\u4f4d\u7f6e\u4e00\u81f4\u6027\u6b63\u5219\u6765\u8fdb\u884c\u6d4b\u8bd5\u65f6\u8bad\u7ec3\uff0c\u907f\u514d\u591a\u89c6\u56fe\u589e\u5f3a\u5e26\u6765\u7684\u9ad8\u8ba1\u7b97\u6210\u672c\u3002\u5728 OOD ImageNet\u3001\u7ec6\u7c92\u5ea6\u5206\u7c7b\u548c\u5206\u5272\u7b49\u4efb\u52a1\u4e0a\u63d0\u5347 CLIP \u7b49 VLM \u7684\u9002\u5e94\u6548\u679c\uff0c\u5e76\u5b9e\u73b0\u66f4\u5feb\u6536\u655b\u548c\u8de8\u6a21\u578b\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Phishing remains one of the most common vectors for financial and identity fraud, and most detection systems still rely on inspecting a page\u0027s URL, HTML markup, or domain registration history. These signals are easy for an attacker to rotate or obfuscate, and they say very little about what actually convinces a victim to hand over a password or a card number: the way the page looks. This paper describes a visual, image-based approach to phishing detection that treats a rendered webpage the same way a human eye would, as a picture that either matches a trusted brand or doesn\u0027t. A YOLOv8 convolutional neural network was trained to classify full-page website screenshots as phishing or legitimate based on layout, logo placement, color scheme, and login-form structure, rather than on text extracted from the page. The system reached 92% classification accuracy on a held-out test set, processed a single screenshot in roughly 100 milliseconds, and, after a round of data augmentation aimed specifically at lighting, compression, and scaling variation, cut the false-positive rate by 11% relative to the pre-augmentation baseline. The paper walks through the dataset construction, the augmentation strategy, the model architecture and training setup, and the resulting performance, and closes with a discussion of where this kind of visual detector fits alongside, rather than instead of, existing URL- and content-based defenses.", "arxiv_id": "2609.34015", "arxiv_url": "https://arxiv.org/abs/2609.34015", "authors": ["Basil Sajid Shaikh", "Hajar Homayouni"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u7f51\u9875\u622a\u56fe\u7684\u9493\u9c7c\u7f51\u7ad9\u89c6\u89c9\u68c0\u6d4b\u65b9\u6cd5\uff0c\u7528 YOLOv8 \u4ece\u9875\u9762\u5e03\u5c40\u3001Logo\u3001\u914d\u8272\u548c\u767b\u5f55\u8868\u5355\u7ed3\u6784\u7b49\u89c6\u89c9\u7279\u5f81\u5224\u65ad\u7f51\u9875\u662f\u5426\u9493\u9c7c\u3002\u6a21\u578b\u5728\u6d4b\u8bd5\u96c6\u4e0a\u8fbe\u5230 92% \u51c6\u786e\u7387\uff0c\u5355\u5f20\u622a\u56fe\u7ea6 100 \u6beb\u79d2\u5904\u7406\uff0c\u5e76\u901a\u8fc7\u6570\u636e\u589e\u5f3a\u5c06\u8bef\u62a5\u7387\u76f8\u5bf9\u964d\u4f4e 11%\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34015", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u7f51\u7edc\u5b89\u5168", "\u76ee\u6807\u68c0\u6d4b", "\u9493\u9c7c\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34015v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Computer Vision Approach to Visual Fraud Detection in Phishing Websites Using YOLOv8", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u7f51\u9875\u622a\u56fe\u7684\u9493\u9c7c\u7f51\u7ad9\u89c6\u89c9\u68c0\u6d4b\u65b9\u6cd5\uff0c\u7528 YOLOv8 \u4ece\u9875\u9762\u5e03\u5c40\u3001Logo\u3001\u914d\u8272\u548c\u767b\u5f55\u8868\u5355\u7ed3\u6784\u7b49\u89c6\u89c9\u7279\u5f81\u5224\u65ad\u7f51\u9875\u662f\u5426\u9493\u9c7c\u3002\u6a21\u578b\u5728\u6d4b\u8bd5\u96c6\u4e0a\u8fbe\u5230 92% \u51c6\u786e\u7387\uff0c\u5355\u5f20\u622a\u56fe\u7ea6 100 \u6beb\u79d2\u5904\u7406\uff0c\u5e76\u901a\u8fc7\u6570\u636e\u589e\u5f3a\u5c06\u8bef\u62a5\u7387\u76f8\u5bf9\u964d\u4f4e 11%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present ZeroBot, a real2sim framework for learning a robot manipulation task from scratch in minutes under challenging conditions: zero human demonstrations, zero policy pre-training, and zero known object models. Given only a single view of an object and a goal pose for that object, ZeroBot uses image-to-3D generative models to obtain a complete object mesh, which is used in simulation for large-scale parallel reinforcement learning. To accelerate training, we introduce an action space which leverages the generated geometry and learned value function to sample states involving robot-object contact. When evaluated on real-world tasks including grasping, pushing, articulated object interaction, and multi-stage manipulation, ZeroBot achieves an 87% success rate with an average training time of 119 seconds. These results show the value of using image-to-3D models in a real2sim framework for rapid, autonomous robot learning.", "arxiv_id": "2609.34010", "arxiv_url": "https://arxiv.org/abs/2609.34010", "authors": ["Ivan Kapelyukh", "Xiaohan Zhang", "Stephen James", "Laura Herlant", "Edward Johns"], "brief": "ZeroBot \u63d0\u51fa\u4e00\u79cd\u751f\u6210\u5f0f real2sim \u673a\u5668\u4eba\u5b66\u4e60\u6846\u67b6\uff0c\u4ec5\u51ed\u5355\u89c6\u89d2\u7269\u4f53\u56fe\u50cf\u548c\u76ee\u6807\u59ff\u6001\uff0c\u7528\u56fe\u50cf\u52303D\u6a21\u578b\u751f\u6210\u7269\u4f53\u7f51\u683c\uff0c\u5e76\u5728\u4eff\u771f\u4e2d\u8fdb\u884c\u5927\u89c4\u6a21\u5e76\u884c\u5f3a\u5316\u5b66\u4e60\u3002\u5b83\u65e0\u9700\u4eba\u5de5\u793a\u8303\u3001\u7b56\u7565\u9884\u8bad\u7ec3\u6216\u5df2\u77e5\u7269\u4f53\u6a21\u578b\uff0c\u5728\u771f\u5b9e\u6293\u53d6\u3001\u63a8\u52a8\u3001\u5173\u8282\u7269\u4f53\u4ea4\u4e92\u548c\u591a\u9636\u6bb5\u64cd\u4f5c\u4e2d\u5e73\u5747\u8bad\u7ec3119\u79d2\uff0c\u6210\u529f\u7387\u8fbe\u523087%\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34010", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u751f\u6210\u6a21\u578b", "\u4eff\u771f\u5230\u73b0\u5b9e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34010v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ZeroBot: Learning from Scratch in Minutes with Generative Real2Sim", "tldr": "ZeroBot \u63d0\u51fa\u4e00\u79cd\u751f\u6210\u5f0f real2sim \u673a\u5668\u4eba\u5b66\u4e60\u6846\u67b6\uff0c\u4ec5\u51ed\u5355\u89c6\u89d2\u7269\u4f53\u56fe\u50cf\u548c\u76ee\u6807\u59ff\u6001\uff0c\u7528\u56fe\u50cf\u52303D\u6a21\u578b\u751f\u6210\u7269\u4f53\u7f51\u683c\uff0c\u5e76\u5728\u4eff\u771f\u4e2d\u8fdb\u884c\u5927\u89c4\u6a21\u5e76\u884c\u5f3a\u5316\u5b66\u4e60\u3002\u5b83\u65e0\u9700\u4eba\u5de5\u793a\u8303\u3001\u7b56\u7565\u9884\u8bad\u7ec3\u6216\u5df2\u77e5\u7269\u4f53\u6a21\u578b\uff0c\u5728\u771f\u5b9e\u6293\u53d6\u3001\u63a8\u52a8\u3001\u5173\u8282\u7269\u4f53\u4ea4\u4e92\u548c\u591a\u9636\u6bb5\u64cd\u4f5c\u4e2d\u5e73\u5747\u8bad\u7ec3119\u79d2\uff0c\u6210\u529f\u7387\u8fbe\u523087%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frame selection is an important component of long-video question answering (VQA) with Multimodal Large Language Models (MLLMs). Existing frame-selection methods improve over simple top-$k$ embedding retrieval and uniform sampling, but are typically applied under a fixed global selection budget. We introduce \\textbf{MetaSampling}, a training-free, plug-and-play sampling strategy that can be applied on top of existing frame selectors. MetaSampling improves downstream VQA efficiency by dynamically reducing the number of frames passed to the MLLM while preserving, and in some cases improving, answer accuracy. We evaluate MetaSampling across 36 paired frame-selector--MLLM-backbone--VQA-benchmark configurations. MetaSampling reduces the number of selected frames in all 36 configurations and improves accuracy in 25 of them, yielding an average frame reduction of $8.9\\%$ while slightly improving accuracy overall.", "arxiv_id": "2609.33998", "arxiv_url": "https://arxiv.org/abs/2609.33998", "authors": ["Ashim Dahal", "Bikramjit Banerjee"], "brief": "\u63d0\u51fa MetaSampling\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u3001\u53ef\u5373\u63d2\u5373\u7528\u7684\u957f\u89c6\u9891\u95ee\u7b54\u5e27\u91c7\u6837\u7b56\u7565\uff0c\u53ef\u53e0\u52a0\u5728\u73b0\u6709\u5e27\u9009\u62e9\u5668\u4e0a\uff0c\u52a8\u6001\u51cf\u5c11\u9001\u5165\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u5e27\u6570\u3002\u5b9e\u9a8c\u8986\u76d636\u79cd\u914d\u7f6e\uff0c\u6240\u6709\u914d\u7f6e\u90fd\u51cf\u5c11\u5e27\u6570\uff0c25\u79cd\u914d\u7f6e\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e73\u5747\u51cf\u5c118.9%\u5e27\u6570\u4e14\u6574\u4f53\u51c6\u786e\u7387\u7565\u6709\u63d0\u5347\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33998", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u95ee\u7b54", "\u591a\u6a21\u6001", "\u5e27\u91c7\u6837", "\u6548\u7387\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33998v1", "published_at": "2026-09-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MetaSampling: Making Frame Samplers Efficient for Long-Video Question Answering", "tldr": "\u63d0\u51fa MetaSampling\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u3001\u53ef\u5373\u63d2\u5373\u7528\u7684\u957f\u89c6\u9891\u95ee\u7b54\u5e27\u91c7\u6837\u7b56\u7565\uff0c\u53ef\u53e0\u52a0\u5728\u73b0\u6709\u5e27\u9009\u62e9\u5668\u4e0a\uff0c\u52a8\u6001\u51cf\u5c11\u9001\u5165\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u5e27\u6570\u3002\u5b9e\u9a8c\u8986\u76d636\u79cd\u914d\u7f6e\uff0c\u6240\u6709\u914d\u7f6e\u90fd\u51cf\u5c11\u5e27\u6570\uff0c25\u79cd\u914d\u7f6e\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e73\u5747\u51cf\u5c118.9%\u5e27\u6570\u4e14\u6574\u4f53\u51c6\u786e\u7387\u7565\u6709\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Learned mask refiners improve segmentation accuracy, but it is hard to tell how much of the improvement comes from explicit structure rather than from extra capacity, and whether it holds up when the mask generator or its error distribution changes. UnfoldCRF treats refinement as inference in a conditional random field over pixel labels and latent region variables. Its energy has a corrected unary term, learned local pairwise interactions, and image-conditioned latent-region consistency, with a null state that lets a region with weak label agreement withdraw from the consistency term; inference unrolls damped mean-field updates on this one energy. To isolate the effect of structure, we compare against recurrent black-box refiners that read the same inputs and receive the same parameter budget, stage count, and supervision. On COD10K, UnfoldCRF beats the strongest matched control by 1.0 $F^\u03c9_\u03b2$ point, improves all four COD metrics, and lowers the fraction of images made worse from 11.7\\% to 8.5\\%. Under a train-once protocol over five datasets and several mask sources, the 2.6M-parameter variant gains 4.2 mean $\u0394$IoU against 2.0 for its control, and a variant built on frozen DINOv2 features matches the strongest foundation-model refiner with about a seventh of its resident parameters while staying ahead of its own control. On mask generators never seen in training, the gain is 2.0 $F^\u03c9_\u03b2$ points against 0.6 for the control. Zeroing individual messages shows where the corrections come from: the pairwise messages mostly fix boundaries, the region messages mostly fix non-boundary errors. Code and supporting materials will be publicly released.", "arxiv_id": "2609.33996", "arxiv_url": "https://arxiv.org/abs/2609.33996", "authors": ["Chunming He", "Rihan Zhang", "Lei Xu", "Guanyi Qin", "Chengyu Fang", "Longxiang Tang", "Fengyang Xiao", "Sina Farsiu"], "brief": "UnfoldCRF \u5c06\u5206\u5272\u63a9\u7801\u7ec6\u5316\u5efa\u6a21\u4e3a\u5e26\u50cf\u7d20\u6807\u7b7e\u548c\u6f5c\u5728\u533a\u57df\u53d8\u91cf\u7684\u6761\u4ef6\u968f\u673a\u573a\uff0c\u901a\u8fc7\u5c55\u5f00\u963b\u5c3c\u5747\u503c\u573a\u63a8\u7406\uff0c\u5f15\u5165\u6821\u6b63\u4e00\u5143\u9879\u3001\u5c40\u90e8\u6210\u5bf9\u4ea4\u4e92\u548c\u56fe\u50cf\u6761\u4ef6\u533a\u57df\u4e00\u81f4\u6027\u3002\u76f8\u6bd4\u540c\u9884\u7b97\u9ed1\u76d2\u5faa\u73af\u7ec6\u5316\u5668\uff0c\u5b83\u5728 COD10K \u548c\u8de8\u6570\u636e\u96c6\u3001\u8de8\u63a9\u7801\u6e90\u8bbe\u7f6e\u4e0b\u53d6\u5f97\u66f4\u7a33\u5b9a\u63d0\u5347\uff0c\u5e76\u5728\u672a\u89c1\u8fc7\u7684\u63a9\u7801\u751f\u6210\u5668\u4e0a\u6cdb\u5316\u66f4\u597d\uff1b\u5206\u6790\u663e\u793a\u6210\u5bf9\u6d88\
