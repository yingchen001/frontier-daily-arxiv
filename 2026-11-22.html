<script>
const PAPERS = [{"abstract": "Multi-agent LLM systems increasingly divide long tasks among subagents whose reports a senior agent turns into the final answer. Such a division of labor pays off only if each agent, and above all the senior agent, carries out the duties of its role. Current evaluations, however, mostly score the final answer, and a fluent, well-cited answer cannot show whether the senior agent weighed its subagents\u0027 reports or merely aggregated them. To assess whether a senior agent meets its assigned responsibilities, we define role integrity as the preservation of an agent\u0027s functional responsibilities when it acts on its subordinates\u0027 material. To measure it, we introduce RI-Bench, a behavioral benchmark grounded in the structures and public records of three institutional hierarchies: peer review, appellate adjudication, and parliamentary inquiry. We choose these hierarchies because their rules explicitly assign the senior role a duty toward subordinate material, and together they cover three basic duties: to weigh, to verify, and to relay. Rather than scoring output correctness, we measure how senior agents\u0027 outputs respond to controlled changes in subordinate material, using rule-based checks and a rubric-guided LLM judge calibrated against human annotation. Across eight LLMs and over 12,000 agentic episodes, senior agents rarely adopt a planted procedural error (2.9% of rulings) but often follow a majority of generic reviews (up to 71% of decisions) or drop witnesses\u0027 stated limitations (up to 65% of cited claims). Obligation prompts reduce these failures without removing them, and they also shift behavior in the control conditions. These findings motivate direct, obligation-specific evaluation of role integrity rather than inferring it from general capability or explicit role instructions. Code and data are available at https://github.com/jxtse/ri-bench.", "arxiv_id": "2611.27139", "arxiv_url": "https://arxiv.org/abs/2611.27139", "authors": ["Jinxiang Xie", "Xinyi Zhang", "Changjiang Jiang", "Kexu Liu", "Qi Yang", "Yuxin Su"], "brief": "\u63d0\u51fa\u89d2\u8272\u5b8c\u6574\u6027\u57fa\u51c6RI-Bench\uff0c\u68c0\u9a8c\u4e0a\u7ea7\u667a\u80fd\u4f53\u662f\u5426\u5c65\u884c\u6743\u8861\u3001\u6838\u9a8c\u548c\u8f6c\u8ff0\u804c\u8d23\u3002\u901a\u8fc7\u53d7\u63a7\u4fee\u6539\u4e0b\u7ea7\u6750\u6599\uff0c\u7ed3\u5408\u89c4\u5219\u68c0\u67e5\u4e0e\u7ecf\u4eba\u5de5\u6807\u6ce8\u6821\u51c6\u7684\u6a21\u578b\u8bc4\u5ba1\u8861\u91cf\u884c\u4e3a\u53d8\u5316\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27139", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["RI-Bench\u8986\u76d6\u540c\u884c\u8bc4\u5ba1\u3001\u4e0a\u8bc9\u88c1\u51b3\u548c\u8bae\u4f1a\u8c03\u67e5", "\u6d4b\u8bd58\u4e2a\u6a21\u578b\u3001\u903e12000\u6b21\u667a\u80fd\u4f53\u4ea4\u4e92", "\u76f2\u4ece\u591a\u6570\u6700\u9ad871%\uff0c\u9057\u6f0f\u8bc1\u8bcd\u9650\u5236\u6700\u9ad865%"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u8bc4\u4f30", "\u89d2\u8272\u5b8c\u6574\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27139v1", "published_at": "2026-11-20", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Do Senior Agents Do Their Job? Measuring Role Integrity in How LLM Agents Use Subordinate Material", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u591a\u667a\u80fd\u4f53\u4e2d\u7684\u4e0a\u7ea7\u6a21\u578b\u867d\u5c11\u91c7\u7eb3\u7a0b\u5e8f\u9519\u8bef\uff0c\u5374\u5e38\u76f2\u4ece\u591a\u6570\u6216\u9057\u6f0f\u8bc1\u8bcd\u9650\u5236\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u89d2\u8272\u5b8c\u6574\u6027\u57fa\u51c6RI-Bench\uff0c\u68c0\u9a8c\u4e0a\u7ea7\u667a\u80fd\u4f53\u662f\u5426\u5c65\u884c\u6743\u8861\u3001\u6838\u9a8c\u548c\u8f6c\u8ff0\u804c\u8d23\u3002\u901a\u8fc7\u53d7\u63a7\u4fee\u6539\u4e0b\u7ea7\u6750\u6599\uff0c\u7ed3\u5408\u89c4\u5219\u68c0\u67e5\u4e0e\u7ecf\u4eba\u5de5\u6807\u6ce8\u6821\u51c6\u7684\u6a21\u578b\u8bc4\u5ba1\u8861\u91cf\u884c\u4e3a\u53d8\u5316\u3002", "why_notable": "\u628a\u8bc4\u4f30\u7126\u70b9\u4ece\u6700\u7ec8\u7b54\u6848\u8d28\u91cf\u8f6c\u5411\u804c\u8d23\u5c65\u884c\uff0c\u63ed\u793a\u6d41\u7545\u4e14\u6709\u5f15\u7528\u7684\u56de\u7b54\u4e5f\u53ef\u80fd\u63a9\u76d6\u5931\u804c\uff1b\u804c\u8d23\u63d0\u793a\u80fd\u7f13\u89e3\u95ee\u9898\uff0c\u5374\u65e0\u6cd5\u6d88\u9664\u3002"}, {"abstract": "LLM agents are being proposed for bank model validation, yet evaluations that compare agent-assisted work with manual practice credit the agent with gains that come from digitized evidence and deterministic tests. We propose a staged architecture in which an LLM-free controlled workflow (P1) is both the fallback and the control arm for individually authorized agent tasks (P2), and an attribution protocol that credits an agent only for faults P1 does not already report. The protocol charges decoy false alarms, unnecessary actions and endorsed developer assertions, counts invalid outputs as misses, folds newly automatable findings back into P1 with discovery credit, and fixes safety bounds and a break-even cost gate in advance. On a synthetic credit-scorecard harness, five scripted reference policies show why this matters: naive case accuracy (4/6) and pooled detection (3/5) tie four flawed policies, whereas the protocol separates all five and credits only the reference policy with detection beyond P1. One fold-back round raises a P1-parroting policy\u0027s naive scores without any change to the policy. A regression matrix of sixteen mutants covers nine ways in which earlier versions of the evaluation passed misleadingly. No LLM agent has been evaluated yet; we specify a falsifiable pilot.", "arxiv_id": "2611.27094", "arxiv_url": "https://arxiv.org/abs/2611.27094", "authors": ["M. Ahmadi Achachlouei"], "brief": "\u63d0\u51fa\u4ee5\u65e0\u5927\u6a21\u578b\u6d41\u7a0bP1\u4e3a\u5bf9\u7167\u548c\u56de\u9000\u3001\u9010\u9879\u6388\u6743\u667a\u80fd\u4f53\u4efb\u52a1P2\u7684\u67b6\u6784\u3002\u5f52\u56e0\u534f\u8bae\u4ec5\u8ba4\u53ef\u8d85\u51faP1\u7684\u6545\u969c\u53d1\u73b0\uff0c\u5e76\u6263\u9664\u8bef\u62a5\u4e0e\u591a\u4f59\u64cd\u4f5c\u3002", "categories": ["cs.CL", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27094", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u5f52\u56e0\u534f\u8bae\u4ec5\u8ba1P1\u672a\u62a5\u544a\u6545\u969c\uff0c\u5e76\u9884\u8bbe\u6210\u672c\u95e8\u69db", "\u5408\u6210\u4fe1\u7528\u8bc4\u5206\u6d4b\u8bd5\u4e2d\uff0c\u534f\u8bae\u533a\u5206\u5168\u90e85\u79cd\u811a\u672c\u7b56\u7565", "16\u4e2a\u56de\u5f52\u53d8\u5f02\u4f53\u8986\u76d69\u7c7b\u8bef\u5bfc\u6027\u8bc4\u4f30\u6f0f\u6d1e"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u4f30", "\u6a21\u578b\u9a8c\u8bc1", "\u8d21\u732e\u5f52\u56e0", "\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27094v1", "published_at": "2026-11-20", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Separating Automation Gains from Agent Contributions in AI-Assisted Model Validation", "tldr": "\u7528\u5206\u9636\u6bb5\u5bf9\u7167\u4e0e\u5f52\u56e0\u534f\u8bae\uff0c\u533a\u5206\u94f6\u884c\u6a21\u578b\u9a8c\u8bc1\u4e2d\u7684\u81ea\u52a8\u5316\u6536\u76ca\u548c\u667a\u80fd\u4f53\u8d21\u732e\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4ee5\u65e0\u5927\u6a21\u578b\u6d41\u7a0bP1\u4e3a\u5bf9\u7167\u548c\u56de\u9000\u3001\u9010\u9879\u6388\u6743\u667a\u80fd\u4f53\u4efb\u52a1P2\u7684\u67b6\u6784\u3002\u5f52\u56e0\u534f\u8bae\u4ec5\u8ba4\u53ef\u8d85\u51faP1\u7684\u6545\u969c\u53d1\u73b0\uff0c\u5e76\u6263\u9664\u8bef\u62a5\u4e0e\u591a\u4f59\u64cd\u4f5c\u3002", "why_notable": "\u5c06\u667a\u80fd\u4f53\u4ef7\u503c\u4e0e\u6570\u5b57\u5316\u3001\u786e\u5b9a\u6027\u6d4b\u8bd5\u6536\u76ca\u62c6\u5f00\uff0c\u907f\u514d\u5e38\u89c4\u51c6\u786e\u7387\u63a9\u76d6\u7f3a\u9677\uff1b\u4e3a\u94f6\u884c\u6a21\u578b\u9a8c\u8bc1\u63d0\u4f9b\u53ef\u8bc1\u4f2a\u7684\u8bd5\u70b9\u8bc4\u4f30\u8bbe\u8ba1\u3002"}, {"abstract": "Low-bit activation quantization of large language models remains challenging, as a small number of dominant directions dictate the quantization range. State-of-the-art methods isolate these directions in a high-precision subspace through transformations calibrated offline and folded into the weights, which fixes the subspace for all prompts, leaving each prompt\u0027s few unique directions unprotected, and rules it out wherever no weight can absorb the transformation. We present PLoQ, a prompt-adaptive low-rank decomposition that extracts the dominant activation components before quantization, quantizes them separately, and restores them within the layer\u0027s GEMM, without modifying the weights. The low-rank component\u0027s basis is estimated from each prompt during prefill and reused throughout decoding. At the same bit width as state-of-the-art mixed-precision quantization (4-bit weights, activations and K/V cache with an eighth of the channels at 8 bits, about 4.2 bits per activation on average), PLoQ outperforms it on all six Llama and Qwen models from 1B to 70B parameters, at up to 8k tokens (16k on two of them), recovering up to 46% of the perplexity that the state of the art still loses to 4-bit activations. On Llama-3.1-8B at 8k tokens it adds only 4% to prefill and 8% to decoding.", "arxiv_id": "2611.27092", "arxiv_url": "https://arxiv.org/abs/2611.27092", "authors": ["Faraz Tahmasebi", "Michael Pellauer", "Hyoukjun Kwon", "Sitao Huang"], "brief": "PLoQ\u5728\u9884\u586b\u5145\u9636\u6bb5\u4e3a\u6bcf\u4e2a\u63d0\u793a\u4f30\u8ba1\u4f4e\u79e9\u57fa\uff0c\u5c06\u4e3b\u5bfc\u6fc0\u6d3b\u5206\u91cf\u5206\u79bb\u91cf\u5316\uff0c\u5e76\u5728\u5c42\u5185\u77e9\u9635\u4e58\u6cd5\u4e2d\u6062\u590d\uff1b\u89e3\u7801\u65f6\u590d\u7528\u8be5\u57fa\uff0c\u65e0\u9700\u4fee\u6539\u6743\u91cd\u3002", "categories": ["cs.LG", "cs.CL", "cs.DC", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27092", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u793a\u81ea\u9002\u5e94\u4f4e\u79e9\u5206\u89e3\uff0c\u9884\u586b\u5145\u4f30\u57fa\u3001\u89e3\u7801\u590d\u7528", "\u5e73\u5747\u6bcf\u6fc0\u6d3b\u7ea64.2\u4f4d\uff0c\u516d\u4e2a1B\u81f370B\u6a21\u578b\u5747\u4f18\u4e8e\u57fa\u7ebf", "8B\u6a21\u578b\u57288k\u957f\u5ea6\u4e0b\uff0c\u9884\u586b\u5145\u4e0e\u89e3\u7801\u5f00\u9500\u4e3a4%\u548c8%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4f4e\u4f4d\u91cf\u5316", "\u4f4e\u79e9\u5206\u89e3", "\u63a8\u7406\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27092v1", "published_at": "2026-11-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PLoQ: A Prompt-Specific Low-Rank Basis for 4-bit Quantization of LLM Activations", "tldr": "\u6309\u63d0\u793a\u63d0\u53d6\u4f4e\u79e9\u4e3b\u65b9\u5411\uff0c\u5728\u4e0d\u6539\u6743\u91cd\u7684\u524d\u63d0\u4e0b\u6539\u5584\u5927\u6a21\u578b\u56db\u4f4d\u6fc0\u6d3b\u91cf\u5316\u3002", "upvotes": 0, "what_it_is": "PLoQ\u5728\u9884\u586b\u5145\u9636\u6bb5\u4e3a\u6bcf\u4e2a\u63d0\u793a\u4f30\u8ba1\u4f4e\u79e9\u57fa\uff0c\u5c06\u4e3b\u5bfc\u6fc0\u6d3b\u5206\u91cf\u5206\u79bb\u91cf\u5316\uff0c\u5e76\u5728\u5c42\u5185\u77e9\u9635\u4e58\u6cd5\u4e2d\u6062\u590d\uff1b\u89e3\u7801\u65f6\u590d\u7528\u8be5\u57fa\uff0c\u65e0\u9700\u4fee\u6539\u6743\u91cd\u3002", "why_notable": "\u7a81\u7834\u56fa\u5b9a\u91cf\u5316\u5b50\u7a7a\u95f4\u96be\u4ee5\u9002\u914d\u63d0\u793a\u7684\u9650\u5236\uff0c\u540c\u4f4d\u5bbd\u4e0b\u6700\u591a\u5f25\u8865\u57fa\u7ebf\u56f0\u60d1\u5ea6\u635f\u5931\u768446%\uff0c\u5e76\u4ee5\u8f83\u5c0f\u63a8\u7406\u5f00\u9500\u4fdd\u6301\u6743\u91cd\u4e0d\u53d8\u3002"}, {"abstract": "An information operation active on several platforms presents different names, personas, and topics on each. Its working routine is harder to change. We call this routine the operation\u0027s production signature: the regularities in when and how its accounts post, reply, and repost. We measure it from timestamps and coarse action types only, using no content, profile metadata, or network ties, as timing and action profiles for accounts and learned action-gap policies for populations. We then ask which parts of a signature carry over to another platform and which belong to a single operation. We train models on Twitter archives of four state-linked operations and apply them to Internet Research Agency (IRA) accounts on Reddit, with no Reddit training labels. They rank the IRA accounts at AUC 0.90-0.94. Content detectors on the same route fall from 0.98 within a platform to 0.81. Daily phase accounts for most of the transfer. Posting volume reverses direction between platforms, and action mix follows the role accounts hold on each platform. What transfers is not unique to the IRA: a second operation shares the same working-hours window, and action-gap policies separate every operation from organic accounts (AUC 0.96-1.0) without consistently ranking their own operation first. On 938 Telegram channels, groups that forward the same sources keep ordinary hours and pace but publish original posts in the same ten-minute windows more often than chance. This pattern is invisible when accounts are examined one at a time. Our results suggest that timing and action traces learned on one platform can help flag likely operations on another.", "arxiv_id": "2611.27137", "arxiv_url": "https://arxiv.org/abs/2611.27137", "authors": ["Lin Tian", "Marian-Andrei Rizoiu"], "brief": "\u7814\u7a76\u4ee5\u65f6\u95f4\u6233\u548c\u7c97\u7c92\u5ea6\u52a8\u4f5c\u6784\u5efa\u8d26\u53f7\u751f\u4ea7\u7279\u5f81\u53ca\u7fa4\u4f53\u52a8\u4f5c\u95f4\u9694\u7b56\u7565\uff0c\u65e0\u9700\u5185\u5bb9\u6216\u5173\u7cfb\u7f51\u7edc\u3002\u6a21\u578b\u5728\u56db\u9879\u884c\u52a8\u7684Twitter\u6863\u6848\u4e0a\u8bad\u7ec3\uff0c\u518d\u8fc1\u79fb\u5230Reddit\u8bc6\u522bIRA\u8d26\u53f7\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27137", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u65e0Reddit\u8bad\u7ec3\u6807\u7b7e\uff0c\u8de8\u5e73\u53f0\u8bc6\u522bAUC\u8fbe0.90\u20130.94", "\u65e5\u5185\u65f6\u6bb5\u8d21\u732e\u4e3b\u8981\u8fc1\u79fb\u80fd\u529b\uff0c\u53d1\u5e16\u91cf\u6548\u5e94\u8de8\u5e73\u53f0\u53cd\u8f6c", "938\u4e2aTelegram\u9891\u9053\u4e2d\uff0c\u540c\u6e90\u8f6c\u53d1\u7fa4\u4f53\u539f\u521b\u5e16\u5448\u5341\u5206\u949f\u7a97\u53e3\u540c\u6b65"], "keywords": ["\u4fe1\u606f\u884c\u52a8", "\u8de8\u5e73\u53f0\u68c0\u6d4b", "\u884c\u4e3a\u5206\u6790", "\u534f\u540c\u884c\u4e3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27137v1", "published_at": "2026-11-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Cross-Platform Production Signatures of State-Linked Information Operations", "tldr": "\u4ec5\u51ed\u53d1\u5e16\u65f6\u95f4\u4e0e\u52a8\u4f5c\u6a21\u5f0f\uff0c\u6a21\u578b\u5373\u53ef\u8de8\u5e73\u53f0\u8bc6\u522b\u56fd\u5bb6\u5173\u8054\u4fe1\u606f\u884c\u52a8\u8d26\u53f7\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u4ee5\u65f6\u95f4\u6233\u548c\u7c97\u7c92\u5ea6\u52a8\u4f5c\u6784\u5efa\u8d26\u53f7\u751f\u4ea7\u7279\u5f81\u53ca\u7fa4\u4f53\u52a8\u4f5c\u95f4\u9694\u7b56\u7565\uff0c\u65e0\u9700\u5185\u5bb9\u6216\u5173\u7cfb\u7f51\u7edc\u3002\u6a21\u578b\u5728\u56db\u9879\u884c\u52a8\u7684Twitter\u6863\u6848\u4e0a\u8bad\u7ec3\uff0c\u518d\u8fc1\u79fb\u5230Reddit\u8bc6\u522bIRA\u8d26\u53f7\u3002", "why_notable": "\u884c\u4e3a\u8282\u5f8b\u6bd4\u5185\u5bb9\u68c0\u6d4b\u66f4\u80fd\u8de8\u5e73\u53f0\u8fc1\u79fb\uff0c\u4e3a\u4fe1\u606f\u884c\u52a8\u7b5b\u67e5\u63d0\u4f9b\u4f4e\u6570\u636e\u4f9d\u8d56\u8def\u5f84\uff1b\u4f46\u5171\u4eab\u4f5c\u606f\u5e76\u4e0d\u652f\u6301\u5bf9\u5177\u4f53\u884c\u52a8\u7684\u552f\u4e00\u5f52\u56e0\u3002"}, {"abstract": "Reward models and LLM judges are routinely quantized to 4 bits so that scoring many candidates stays affordable, and the usual check is that benchmark accuracy barely moves. That check is close to blind. Across eight reward models from two families (0.6B-8B), three generative judges and four 4-bit quantizers, quantization rewrites 1.1-12.3% of pairwise preference decisions on RewardBench while aggregate accuracy moves by as little as 0.03 points (p = 1.00), because the errors it fixes and introduces cancel. Flips concentrate where the full-precision margin is small relative to the quantization noise scale sigma: a Gaussian approximation Phi(-|m|/sigma) describes the aggregate rate, over-predicting it in all 30 scalar settings and failing for generative judges, and occupancy of the resulting vulnerability window falls from 25% to 7% with model size, which is what makes small judges fragile. The churn stays within noise under benign best-of-16 and becomes clear under adversarial pressure for some quantizers (146:54 harmful:helpful flips on one family, reversing sign on another). Downstream it changes what ships: across six (model, quantizer) pairs from two families, 14.6-65.7% of problems get a different best-of-64 selection while only 2.6-9.6% get a different final answer, with selections changing 5-8x more often than answers in every pair, and the pair the benchmark calls identical (0.03 points, p = 1.00) still changes 34.5% of them. Benchmark churn ranks that downstream change (rho = 0.89); benchmark accuracy does not order it reliably. Held-out audits then locate the useful diagnostic in the margin rather than the Gaussian: every margin-based predictor orders flips identically (AUC 0.927), and on the level a directly measured churn rate wins in-distribution. As a routing signal it is matched by plain top-k. The contribution is the characterization, not the model.", "arxiv_id": "2611.27155", "arxiv_url": "https://arxiv.org/abs/2611.27155", "authors": ["Omkar Shewale", "Deepak Kumar", "Divakar Kumar Yadav"], "brief": "\u7814\u7a76\u7cfb\u7edf\u8bc4\u4f30\u5956\u52b1\u6a21\u578b\u4e0e\u751f\u6210\u5f0f\u88c1\u5224\u7684\u56db\u6bd4\u7279\u91cf\u5316\uff0c\u8ffd\u8e2a\u504f\u597d\u7ffb\u8f6c\u53ca\u4e0b\u6e38\u9009\u62e9\u53d8\u5316\u3002\u4ee5\u5168\u7cbe\u5ea6\u8bc4\u5206\u95f4\u9694\u5b9a\u4f4d\u6613\u53d7\u91cf\u5316\u566a\u58f0\u5f71\u54cd\u7684\u8106\u5f31\u7a97\u53e3\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27155", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d68\u4e2a\u5956\u52b1\u6a21\u578b\u30013\u4e2a\u751f\u6210\u5f0f\u88c1\u5224\u548c4\u79cd\u91cf\u5316\u5668", "RewardBench\u504f\u597d\u7ffb\u8f6c\u7387\u8fbe1.1%\u201412.3%", "best-of-64\u9009\u62e9\u6539\u53d814.6%\u201465.7%"], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u5956\u52b1\u6a21\u578b", "\u504f\u597d\u8bc4\u4f30", "\u51b3\u7b56\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27155v1", "published_at": "2026-11-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "The Vulnerability Window: Decision Instability in Quantized Reward Models", "tldr": "\u56db\u6bd4\u7279\u91cf\u5316\u53ef\u5728\u51c6\u786e\u7387\u51e0\u4e4e\u4e0d\u53d8\u65f6\u6539\u5199\u504f\u597d\u51b3\u7b56\uff0c\u5e76\u663e\u8457\u6539\u53d8\u5019\u9009\u9009\u62e9", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7cfb\u7edf\u8bc4\u4f30\u5956\u52b1\u6a21\u578b\u4e0e\u751f\u6210\u5f0f\u88c1\u5224\u7684\u56db\u6bd4\u7279\u91cf\u5316\uff0c\u8ffd\u8e2a\u504f\u597d\u7ffb\u8f6c\u53ca\u4e0b\u6e38\u9009\u62e9\u53d8\u5316\u3002\u4ee5\u5168\u7cbe\u5ea6\u8bc4\u5206\u95f4\u9694\u5b9a\u4f4d\u6613\u53d7\u91cf\u5316\u566a\u58f0\u5f71\u54cd\u7684\u8106\u5f31\u7a97\u53e3\u3002", "why_notable": "\u63ed\u793a\u603b\u4f53\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u76f8\u4e92\u62b5\u6d88\u7684\u51b3\u7b56\u53d8\u5316\uff1b\u504f\u597d\u7ffb\u8f6c\u7387\u6bd4\u51c6\u786e\u7387\u66f4\u80fd\u53cd\u6620\u4e0b\u6e38\u9009\u62e9\u6f02\u79fb\uff0c\u4e3a\u91cf\u5316\u8bc4\u4f30\u63d0\u4f9b\u66f4\u6709\u6548\u7684\u8bca\u65ad\u4f9d\u636e\u3002"}, {"abstract": "Chain-of-thought (CoT) reasoning exposes intermediate steps, but a correct answer does not establish that an LLM relies on the dependence expressed by those steps or reasons efficiently. We operationalize CoT faithfulness and efficiency within a common framework. Specifically, we represent a CoT as a semantic reasoning graph and decompose the model\u0027s predictive dependence along two complementary axes: dependence explained by semantic support versus additional reasoning history, and dependence allocated to answer-reaching versus off-path reasoning. This decomposition yields global and step-level measures of unfaithfulness and inefficiency. Controlled interventions show that the proposed metrics respond to hidden dependence and induced off-path reasoning as intended. Across mathematical and multi-hop reasoning tasks, answer-level unfaithfulness is consistently associated with greater predictive uncertainty, whereas both unfaithfulness and inefficiency exhibit weak or inconsistent associations with answer correctness. We further derive theoretically grounded, graph-aware fine-tuning objectives that improve the targeted reasoning properties without directly optimizing the computationally expensive metrics or compromising answer accuracy. Results indicate that accuracy and brevity provide incomplete assessments of reasoning quality: reliable CoT evaluation should also consider whether the LLM\u0027s predictive dependence is faithfully represented and efficiently allocated.", "arxiv_id": "2611.27100", "arxiv_url": "https://arxiv.org/abs/2611.27100", "authors": ["Chenruo Liu", "Quan Zhang", "Qi Lei"], "brief": "\u5c06\u601d\u7ef4\u94fe\u8868\u793a\u4e3a\u8bed\u4e49\u63a8\u7406\u56fe\uff0c\u6309\u8bed\u4e49\u652f\u6301\u4e0e\u989d\u5916\u5386\u53f2\u3001\u901a\u5411\u7b54\u6848\u4e0e\u504f\u79bb\u8def\u5f84\u4e24\u8f74\u5206\u89e3\u9884\u6d4b\u4f9d\u8d56\uff0c\u6784\u5efa\u5168\u5c40\u53ca\u6b65\u9aa4\u7ea7\u6307\u6807\uff0c\u5e76\u8bbe\u8ba1\u56fe\u611f\u77e5\u5fae\u8c03\u76ee\u6807\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27100", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d7\u63a7\u5e72\u9884\u9a8c\u8bc1\u6307\u6807\u80fd\u8bc6\u522b\u9690\u6027\u4f9d\u8d56\u4e0e\u504f\u79bb\u8def\u5f84\u63a8\u7406", "\u6570\u5b66\u4e0e\u591a\u8df3\u4efb\u52a1\u4e2d\uff0c\u4e0d\u5fe0\u5b9e\u6027\u5173\u8054\u66f4\u9ad8\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027", "\u56fe\u611f\u77e5\u5fae\u8c03\u65e0\u9700\u76f4\u63a5\u4f18\u5316\u6602\u8d35\u6307\u6807\uff0c\u4e14\u4e0d\u635f\u5bb3\u51c6\u786e\u7387"], "keywords": ["\u601d\u7ef4\u94fe", "\u63a8\u7406\u8bc4\u4f30", "\u5fe0\u5b9e\u6027", "\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27100v1", "published_at": "2026-11-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Reasoning in Two Dimensions: Quantifying Chain-of-Thought Faithfulness and Efficiency", "tldr": "\u7528\u8bed\u4e49\u63a8\u7406\u56fe\u91cf\u5316\u601d\u7ef4\u94fe\u7684\u5fe0\u5b9e\u6027\u4e0e\u6548\u7387\uff0c\u63ed\u793a\u7b54\u5bf9\u4e0d\u7b49\u4e8e\u63a8\u7406\u53ef\u9760\u3002", "upvotes": 0, "what_it_is": "\u5c06\u601d\u7ef4\u94fe\u8868\u793a\u4e3a\u8bed\u4e49\u63a8\u7406\u56fe\uff0c\u6309\u8bed\u4e49\u652f\u6301\u4e0e\u989d\u5916\u5386\u53f2\u3001\u901a\u5411\u7b54\u6848\u4e0e\u504f\u79bb\u8def\u5f84\u4e24\u8f74\u5206\u89e3\u9884\u6d4b\u4f9d\u8d56\uff0c\u6784\u5efa\u5168\u5c40\u53ca\u6b65\u9aa4\u7ea7\u6307\u6807\uff0c\u5e76\u8bbe\u8ba1\u56fe\u611f\u77e5\u5fae\u8c03\u76ee\u6807\u3002", "why_notable": "\u628a\u63a8\u7406\u8d28\u91cf\u4ece\u51c6\u786e\u7387\u548c\u7bc7\u5e45\u6269\u5c55\u5230\u4f9d\u8d56\u662f\u5426\u5fe0\u5b9e\u3001\u5206\u914d\u662f\u5426\u6709\u6548\uff0c\u5e76\u63d0\u4f9b\u53ef\u8bad\u7ec3\u7684\u6539\u8fdb\u76ee\u6807\uff0c\u4e3a\u601d\u7ef4\u94fe\u8bc4\u4f30\u8865\u4e0a\u4e24\u4e2a\u5173\u952e\u7ef4\u5ea6\u3002"}, {"abstract": "Autoregressive Transformers generally fail on out-of-distribution reasoning due to two primary reasons: positional corruption over long sequences and structural state drift across deep execution steps. We introduce ORION, a framework that supervises exact canonical execution states via auxiliary heads to anchor latent trajectories to valid computational manifolds. Across Folding, GridShift, and CLRS-30, a pre-registered 2 x 2 factorial shows that RoPE and ORION address orthogonal axes. RoPE recovers length extrapolation (59.8%), while ORION recovers depth extrapolation (66.7%). Moreover, their combination complementarily achieves strict additive gain in joint length-depth extrapolation, while either method alone offers near satisfactory results. Negative controls confirm that the gain depends strictly on exact canonical alignment; hashed state statistics fail to constrain depth extrapolation.", "arxiv_id": "2611.27087", "arxiv_url": "https://arxiv.org/abs/2611.27087", "authors": ["Sibi Gokul", "Jyoti Prakash Meher"], "brief": "ORION\u7528\u8f85\u52a9\u9884\u6d4b\u5934\u76d1\u7763\u7cbe\u786e\u7684\u89c4\u8303\u6267\u884c\u72b6\u6001\uff0c\u5c06\u9690\u8868\u793a\u8f68\u8ff9\u951a\u5b9a\u5230\u6709\u6548\u8ba1\u7b97\u72b6\u6001\u3002\u5b83\u9488\u5bf9\u6df1\u5c42\u6267\u884c\u4e2d\u7684\u72b6\u6001\u6f02\u79fb\uff0c\u4e0e\u5904\u7406\u4f4d\u7f6e\u95ee\u9898\u7684RoPE\u4e92\u8865\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27087", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9884\u6ce8\u518c2\u00d72\u5b9e\u9a8c\u8986\u76d6Folding\u3001GridShift\u53caCLRS-30", "RoPE\u957f\u5ea6\u5916\u63a8\u8fbe59.8%\uff0cORION\u6df1\u5ea6\u5916\u63a8\u8fbe66.7%", "\u8054\u5408\u5916\u63a8\u5448\u4e25\u683c\u52a0\u6027\u589e\u76ca\uff1b\u54c8\u5e0c\u72b6\u6001\u7edf\u8ba1\u76d1\u7763\u65e0\u6548"], "keywords": ["\u7cfb\u7edf\u6027\u6cdb\u5316", "\u72b6\u6001\u76d1\u7763", "\u5206\u5e03\u5916\u63a8\u7406", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27087v1", "published_at": "2026-11-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ORION: Exact Canonical-State Supervision for Systematic Generalization in Transformers", "tldr": "\u901a\u8fc7\u7cbe\u786e\u6267\u884c\u72b6\u6001\u76d1\u7763\u7ea0\u6b63\u63a8\u7406\u6f02\u79fb\uff0c\u4e0e\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801\u4e92\u8865\u63d0\u5347\u957f\u5ea6\u548c\u6df1\u5ea6\u5916\u63a8\u3002", "upvotes": 0, "what_it_is": "ORION\u7528\u8f85\u52a9\u9884\u6d4b\u5934\u76d1\u7763\u7cbe\u786e\u7684\u89c4\u8303\u6267\u884c\u72b6\u6001\uff0c\u5c06\u9690\u8868\u793a\u8f68\u8ff9\u951a\u5b9a\u5230\u6709\u6548\u8ba1\u7b97\u72b6\u6001\u3002\u5b83\u9488\u5bf9\u6df1\u5c42\u6267\u884c\u4e2d\u7684\u72b6\u6001\u6f02\u79fb\uff0c\u4e0e\u5904\u7406\u4f4d\u7f6e\u95ee\u9898\u7684RoPE\u4e92\u8865\u3002", "why_notable": "\u5c06\u957f\u5ea6\u4e0e\u6df1\u5ea6\u5916\u63a8\u5931\u8d25\u62c6\u6210\u53ef\u5206\u522b\u5e72\u9884\u7684\u4e24\u6761\u8f74\uff0c\u5e76\u7528\u8d1f\u5bf9\u7167\u8868\u660e\u7cbe\u786e\u72b6\u6001\u5bf9\u9f50\u7684\u91cd\u8981\u6027\uff0c\u4e3a\u7cfb\u7edf\u6027\u6cdb\u5316\u63d0\u4f9b\u660e\u786e\u8bad\u7ec3\u6293\u624b\u3002"}, {"abstract": "Task 3 of the FinReason Cup 2026 scores a system on two values per case, the one an XBRL filing reports and the one its own calculation relationships imply, and labels each failure as structural, extraction or calculation. This report shows that the calculation-error rate so defined does not count arithmetic failures, and bounds how far it is from one using the published board alone. One of the three rules behind the benchmark, DQC_US_0015, has an answer that is the negation of the reported value (in all 110 published practice cases, against 1 of 120 and 6 of 102 for the other two), so a calculation label on such a case records a wrong fact or a wrong route, not a wrong sum. Subtracting the available structural and extraction labels from each entry\u0027s error count on that rule gives a floor: the bound is positive for 22 of the 23 ranked entries, and at the top it is sharpest, with at least 11 of 12 and 12 of 13 calculation errors of the two joint-first entries falling on cases where no arithmetic remained. The calculation-error rate of the best systems on this task is almost entirely not arithmetic. The vehicle for that result is an entry that reconstructs the three data-quality rules the benchmark is drawn from, DQC_US_0015, DQC_US_0117 and DQC_US_0126, as a deterministic system with no learned parameters, no training step and no external service, running all 680 cases in 1.4 seconds. It scores 96.62% under the offline judge on development and 95.29% on the published test set, and its residual error concentrates in cases where a concept carries several equally flagged facts and the question names no dimensional member. Reading those error classes against the per-rule accuracies is what exposed the metric, which is why both are reported here.", "arxiv_id": "2611.27192", "arxiv_url": "https://arxiv.org/abs/2611.27192", "authors": ["Vladimir Beskorovainyi"], "brief": "\u7814\u7a76\u91cd\u5efa\u4e09\u9879\u8d22\u52a1\u6570\u636e\u8d28\u91cf\u89c4\u5219\uff0c\u4ee5\u65e0\u8bad\u7ec3\u7684\u786e\u5b9a\u6027\u7cfb\u7edf\u5ba1\u8ba1\u8d5b\u4e8b\u6307\u6807\u3002\u7ed3\u5408\u516c\u5f00\u699c\u5355\u4e0e\u9010\u89c4\u5219\u9519\u8bef\u5206\u6790\uff0c\u7ed9\u51fa\u88ab\u8bef\u5f52\u4e3a\u8ba1\u7b97\u9519\u8bef\u7684\u975e\u7b97\u672f\u5931\u8bef\u4e0b\u754c\u3002", "categories": ["cs.CL", "cs.CE", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27192", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["DQC_US_0015\u7684110\u4e2a\u7ec3\u4e60\u6848\u4f8b\u7b54\u6848\u5747\u4e3a\u62a5\u544a\u503c\u53d6\u8d1f", "\u5e76\u5217\u7b2c\u4e00\u7684\u8ba1\u7b97\u9519\u8bef\u81f3\u5c1111/12\u300112/13\u65e0\u9700\u7b97\u672f", "\u786e\u5b9a\u6027\u7cfb\u7edf1.4\u79d2\u5904\u7406680\u4f8b\uff0c\u6d4b\u8bd5\u51c6\u786e\u738795.29%"], "keywords": ["\u91d1\u878d\u63a8\u7406", "\u8bc4\u6d4b\u6307\u6807", "\u89c4\u5219\u7cfb\u7edf", "\u9519\u8bef\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27192v1", "published_at": "2026-11-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "How Much of a Calculation-Error Rate Is Not Arithmetic: Auditing the FinReason Cup 2026 Task 3 Metric with a Deterministic Rule System", "tldr": "\u786e\u5b9a\u6027\u89c4\u5219\u7cfb\u7edf\u63ed\u793a\u91d1\u878d\u63a8\u7406\u699c\u5355\u4e2d\uff0c\u9886\u5148\u7cfb\u7edf\u7684\u8ba1\u7b97\u9519\u8bef\u51e0\u4e4e\u5747\u975e\u7b97\u672f\u5931\u8bef\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u91cd\u5efa\u4e09\u9879\u8d22\u52a1\u6570\u636e\u8d28\u91cf\u89c4\u5219\uff0c\u4ee5\u65e0\u8bad\u7ec3\u7684\u786e\u5b9a\u6027\u7cfb\u7edf\u5ba1\u8ba1\u8d5b\u4e8b\u6307\u6807\u3002\u7ed3\u5408\u516c\u5f00\u699c\u5355\u4e0e\u9010\u89c4\u5219\u9519\u8bef\u5206\u6790\uff0c\u7ed9\u51fa\u88ab\u8bef\u5f52\u4e3a\u8ba1\u7b97\u9519\u8bef\u7684\u975e\u7b97\u672f\u5931\u8bef\u4e0b\u754c\u3002", "why_notable": "\u7528\u53ef\u590d\u73b0\u89c4\u5219\u6267\u884c\u4e0e\u699c\u5355\u4e0b\u754c\u5206\u6790\uff0c\u63ed\u793a\u8ba1\u7b97\u9519\u8bef\u6807\u7b7e\u6df7\u5165\u4e8b\u5b9e\u6216\u8def\u5f84\u9519\u8bef\uff0c\u4e3a\u91d1\u878d\u63a8\u7406\u8bc4\u6d4b\u7684\u6307\u6807\u89e3\u91ca\u4e0e\u4fee\u8ba2\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "LLM simulations are validated by equivalence with human effects, yet a zero reference passes whenever the human 90 percent interval lies inside the margin, as the human benchmark shows before simulation. When the zero reference fails, planned precision gives independent simulations the margin up to which passing is a 5 percent test of response. In an exploratory 70-experiment reanalysis, 72 percent of GPT-4\u0027s $\\pm$0.20 SD passes were zero-reference passes; GPT-4 passed 16 contrasts the zero reference failed (1.58 expected without response). In a preregistered audit, Claude Sonnet 5.5 passed three intention targets, all zero-reference passes, and the registered belief-gradient control; norm beliefs changed 0.065 SD against humans\u0027 0.351 (zero-reference check added after unblinding; norm beliefs emphasized after inspection). Registered tests detected no overestimation; average-effect intervals excluded overestimation above 0.08 SD. A group audit\u0027s precision floor is 1.33 facts against a 2.9-fact effect. Report the zero-reference threshold beside every equivalence decision.", "arxiv_id": "2611.27186", "arxiv_url": "https://arxiv.org/abs/2611.27186", "authors": ["Tengfei Shao", "Asma Rezaei", "Ali Reza Kamali"], "brief": "\u7814\u7a76\u7528\u96f6\u6548\u5e94\u53c2\u7167\u5ba1\u67e5\u5927\u6a21\u578b\u6a21\u62df\u7684\u7b49\u4ef7\u68c0\u9a8c\uff0c\u533a\u5206\u5bbd\u677e\u5bb9\u5dee\u4e0b\u7684\u901a\u8fc7\u4e0e\u771f\u5b9e\u54cd\u5e94\u8bc1\u636e\uff0c\u5e76\u7ed3\u5408\u4e03\u5341\u9879\u5b9e\u9a8c\u91cd\u5206\u6790\u548c\u9884\u6ce8\u518c\u5ba1\u8ba1\u9a8c\u8bc1\u3002", "categories": ["cs.AI", "cs.CL", "cs.CY", "s platforms have already taken down. They lose much of their accuracy on an actor they have not seen, even though no operator in the archived data is trying to avoid them. A real operator wants two things, to reach an audience and to avoid being caught. We present IO-AI, a framework that gives simulated agents these two capabilities, engagement and evasion, and tests what each one does to detection. The agents are built from the posting behavior of real campaigns and choose the emotion, type, and timing of each post. An agent and a detector then train against each other in turn. We rank the trained agents by how hard they are to detect and train one detector on them from easiest to hardest. On 20 Twitter IO campaigns, this detector reduces missed detections of adaptive agents by 65% relative to a detector trained only on the archived campaigns, at a similar false-alarm rate. On actors it has never seen it reaches an F1 of 0.81, against 0.62. We find that an agent trained to seek engagement becomes easier to catch, because it learns the fast, emotional retweeting that archived campaigns were caught producing. An agent that was trained for engagement before the game keeps its engagement lead after it learns to evade. We also introduce a behavioral distance metric that compares two groups of accounts using only their unlabeled posting histories. The larger the distance between two groups, the worse a detector trained on one does on the other (Spearman rho = -0.58), so the metric can be used to choose which new groups to test first.", "arxiv_id": "2611.27156", "arxiv_url": "https://arxiv.org/abs/2611.27156", "authors": ["Lin Tian", "Marian-Andrei Rizoiu"], "brief": "IO-AI\u4f9d\u636e\u771f\u5b9e\u884c\u52a8\u7684\u53d1\u5e16\u884c\u4e3a\u6784\u5efa\u667a\u80fd\u4f53\uff0c\u6a21\u62df\u4e89\u53d6\u4e92\u52a8\u4e0e\u89c4\u907f\u68c0\u6d4b\u3002\u667a\u80fd\u4f53\u4e0e\u68c0\u6d4b\u5668\u4ea4\u66ff\u5bf9\u6297\u8bad\u7ec3\uff0c\u518d\u6309\u68c0\u6d4b\u96be\u5ea6\u7531\u6613\u5230\u96be\u8bad\u7ec3\u7edf\u4e00\u68c0\u6d4b\u5668\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27156", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["20\u4e2aTwitter\u884c\u52a8\u4e0a\uff0c\u76f8\u8fd1\u8bef\u62a5\u7387\u4e0b\u6f0f\u68c0\u51cf\u5c1165%", "\u672a\u89c1\u64cd\u4f5c\u8005\u4e0a\u7684F1\u4ece0.62\u63d0\u5347\u81f30.81", "\u65e0\u6807\u7b7e\u884c\u4e3a\u8ddd\u79bb\u4e0e\u8de8\u7fa4\u4f53\u68c0\u6d4b\u8868\u73b0\u76f8\u5173\u03c1=-0.58"], "keywords": ["\u4fe1\u606f\u64cd\u7eb5", "\u667a\u80fd\u4f53", "\u5bf9\u6297\u8bad\u7ec3", "\u884c\u4e3a\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27156v1", "published_at": "2026-11-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Co-Evolving Behavioral Agents and Detectors for Adaptive Information Operations", "tldr": "\u901a\u8fc7\u884c\u4e3a\u667a\u80fd\u4f53\u4e0e\u68c0\u6d4b\u5668\u5171\u6f14\u5316\u8bad\u7ec3\uff0c\u663e\u8457\u63d0\u5347\u5bf9\u81ea\u9002\u5e94\u4fe1\u606f\u64cd\u7eb5\u7684\u8bc6\u522b\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "IO-AI\u4f9d\u636e\u771f\u5b9e\u884c\u52a8\u7684\u53d1\u5e16\u884c\u4e3a\u6784\u5efa\u667a\u80fd\u4f53\uff0c\u6a21\u62df\u4e89\u53d6\u4e92\u52a8\u4e0e\u89c4\u907f\u68c0\u6d4b\u3002\u667a\u80fd\u4f53\u4e0e\u68c0\u6d4b\u5668\u4ea4\u66ff\u5bf9\u6297\u8bad\u7ec3\uff0c\u518d\u6309\u68c0\u6d4b\u96be\u5ea6\u7531\u6613\u5230\u96be\u8bad\u7ec3\u7edf\u4e00\u68c0\u6d4b\u5668\u3002", "why_notable": "\u5c06\u68c0\u6d4b\u8bc4\u4f30\u4ece\u9759\u6001\u5386\u53f2\u6837\u672c\u63a8\u8fdb\u5230\u4e3b\u52a8\u89c4\u907f\u7684\u5bf9\u624b\uff0c\u5e76\u663e\u793a\u8bfe\u7a0b\u5f0f\u5bf9\u6297\u8bad\u7ec3\u53ef\u6539\u5584\u8de8\u64cd\u4f5c\u8005\u6cdb\u5316\uff0c\u4e3a\u66f4\u8d34\u8fd1\u771f\u5b9e\u5a01\u80c1\u7684\u6d4b\u8bd5\u63d0\u4f9b\u8def\u5f84\u3002"}, {"abstract": "Language models fuse reports in retrieval, multi-agent consensus and agent memory, where treating shared-source reports as independent can double count evidence. A common remedy is an instruction to count each source once. Its value depends on the receiver\u0027s raw baseline. Pricing it needs an exact reference. We build the graded-dependence exact reference: binary worlds with single-report reliability 0.65 and four dependence levels, whose disclosed parameters give every world an exact posterior and every rule a target risk. The paired gain protocol scores raw and instructed answers of four configurations on 2,976 worlds. Agreement and gain separate in both directions. At $\u03b4$ = 0, claude-opus-5-5 and gpt-6.1-sol agreed with the rule within 0.001 in 744 of 744, and the instruction raised their posterior mismatch by 0.044; gpt-6-luna agreed in 165 of 744 and gained 0.0140 (95% interval 0.0064 to 0.0219); claude-haiku-5-5\u0027s gain moved from -0.0295 ($\u03b4$ = 0) to +0.0302 ($\u03b4$ = 1) (descriptive). The prespecified first-child endpoint contrast, gain at $\u03b4$ = 1 minus $\u03b4$ = 0, was 0.0342 (0.0303 to 0.0382). In the preregistered tests, the raw source-weight contrast was positive (0.259, 95% interval 0.182 to 0.337; Holm rejected zero) and the grouping endpoint difference was not detected (0.0004, -0.0023 to 0.0031). This interval excludes differences larger than 0.0031 in magnitude and lies within the registered precision bound of $\\pm$0.0046. The reference prices the rule before any model call. The paired gain, estimable as a Brier difference on labelled deployment items, decides adoption per receiver and prompt condition.", "arxiv_id": "2611.27138", "arxiv_url": "https://arxiv.org/abs/2611.27138", "authors": ["Tengfei Shao", "Asma Rezaei", "Ali Reza Kamali"], "brief": "\u6784\u5efa\u56db\u6863\u8bc1\u636e\u4f9d\u8d56\u7a0b\u5ea6\u7684\u4e8c\u5143\u4e16\u754c\uff0c\u4ee5\u7cbe\u786e\u540e\u9a8c\u4f5c\u4e3a\u8bc4\u4f30\u57fa\u51c6\u3002\u901a\u8fc7\u914d\u5bf9\u6bd4\u8f83\u56db\u79cd\u6a21\u578b\u914d\u7f6e\u5728\u539f\u59cb\u4e0e\u53bb\u91cd\u6307\u4ee4\u4e0b\u7684\u56de\u7b54\uff0c\u533a\u5206\u89c4\u5219\u9075\u4ece\u4e0e\u5b9e\u9645\u6536\u76ca\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27138", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5355\u62a5\u544a\u53ef\u9760\u5ea6\u8bbe\u4e3a0.65\uff0c\u8bc4\u4f30\u8986\u76d62976\u4e2a\u4e16\u754c", "\u96f6\u4f9d\u8d56\u65f6\uff0c\u4e24\u914d\u7f6e744\u4f8b\u5747\u9075\u4ece\u89c4\u5219\uff0c\u540e\u9a8c\u5931\u914d\u5374\u589e\u52a00.044", "\u914d\u5bf9\u6536\u76ca\u53ef\u7528Brier\u5206\u6570\u5dee\u4f30\u8ba1\uff0c\u652f\u6301\u6309\u6a21\u578b\u4e0e\u63d0\u793a\u6761\u4ef6\u51b3\u7b56"], "keywords": ["\u8bc1\u636e\u878d\u5408", "\u6982\u7387\u6821\u51c6", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27138v1", "published_at": "2026-11-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Double counting in LLM evidence fusion: exact posteriors separate rule compliance from posterior gain", "tldr": "\u7cbe\u786e\u540e\u9a8c\u5b9e\u9a8c\u8868\u660e\uff0c\u6a21\u578b\u9075\u5b88\u6765\u6e90\u53bb\u91cd\u89c4\u5219\uff0c\u4e0d\u4e00\u5b9a\u80fd\u6539\u5584\u8bc1\u636e\u878d\u5408\u51c6\u786e\u6027\u3002", "upvotes": 0, "what_it_is": "\u6784\u5efa\u56db\u6863\u8bc1\u636e\u4f9d\u8d56\u7a0b\u5ea6\u7684\u4e8c\u5143\u4e16\u754c\uff0c\u4ee5\u7cbe\u786e\u540e\u9a8c\u4f5c\u4e3a\u8bc4\u4f30\u57fa\u51c6\u3002\u901a\u8fc7\u914d\u5bf9\u6bd4\u8f83\u56db\u79cd\u6a21\u578b\u914d\u7f6e\u5728\u539f\u59cb\u4e0e\u53bb\u91cd\u6307\u4ee4\u4e0b\u7684\u56de\u7b54\uff0c\u533a\u5206\u89c4\u5219\u9075\u4ece\u4e0e\u5b9e\u9645\u6536\u76ca\u3002", "why_notable": "\u5c06\u6307\u4ee4\u9075\u4ece\u4e0e\u6982\u7387\u9884\u6d4b\u8d28\u91cf\u660e\u786e\u5206\u5f00\uff0c\u4e3a\u8bc1\u636e\u53bb\u91cd\u63d0\u4f9b\u53ef\u8ba1\u7b97\u7684\u6536\u76ca\u57fa\u51c6\uff0c\u907f\u514d\u628a\u7edf\u4e00\u89c4\u5219\u8bef\u5f53\u4f5c\u666e\u904d\u6709\u6548\u7684\u6539\u8fdb\u3002"}, {"abstract": "Large language models (LLMs) are increasingly asked where to center the coefficients of a small-sample Bayesian regression, but the evidence is unclear: benchmarks are often built to match the prior and models may remember them. We audit this practice with one frontier and one flash-tier model, using hidden feature names, post-cutoff housing data and a pre-specified test that gives features the wrong descriptions. First, the models share their errors (correlation $0.92$--$0.99$ across draws, vendors and paraphrases): averaging $20$ draws is no more accurate than one, and treating draws as independent creates overconfidence. Much of this error comes from reporting each feature\u0027s effect alone, not with the others held fixed. Second, against the best classical prior, the LLM center helps clearly on one of four benchmarks (RMSE $-5.8\\%$), marginally on two, and hurts mean RMSE on the fourth. Third, the LLM\u0027s stated uncertainty is unreliable; letting the data set the prior scale cuts the harm of a wrong center four-fold against a unit-variance prior. A pre-specified external test returned the verdict \\textsc{partial}: on $18$ rule-selected problems the center helps on six and hurts on four, and a hard trust gate trusts a harmful prior while an evidence-weighted mixture is safer.", "arxiv_id": "2611.27075", "arxiv_url": "https://arxiv.org/abs/2611.27075", "authors": ["Ran Zou", "Yang Liu"], "brief": "\u5ba1\u8ba1\u4e24\u6863\u5927\u6a21\u578b\u4e3a\u5c0f\u6837\u672c\u8d1d\u53f6\u65af\u56de\u5f52\u63d0\u4f9b\u7cfb\u6570\u5148\u9a8c\u7684\u6548\u679c\u3002\u901a\u8fc7\u9690\u85cf\u7279\u5f81\u540d\u3001\u4f7f\u7528\u8bad\u7ec3\u622a\u6b62\u540e\u7684\u4f4f\u623f\u6570\u636e\u53ca\u9519\u914d\u7279\u5f81\u63cf\u8ff0\uff0c\u68c0\u9a8c\u6536\u76ca\u4e0e\u53ef\u9760\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27075", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8bef\u5dee\u76f8\u5173\u6027\u8fbe0.92\u20140.99\uff0c\u5e73\u574720\u6b21\u91c7\u6837\u65e0\u6539\u5584", "\u5bf9\u6bd4\u6700\u4f73\u7ecf\u5178\u5148\u9a8c\uff0c4\u4e2a\u57fa\u51c6\u4ec51\u4e2a\u660e\u786e\u83b7\u76ca", "\u7531\u6570\u636e\u8bbe\u5b9a\u5148\u9a8c\u5c3a\u5ea6\uff0c\u4f7f\u9519\u8bef\u4e2d\u5fc3\u5371\u5bb3\u964d\u81f3\u56db\u5206\u4e4b\u4e00"], "keywords": ["\u8d1d\u53f6\u65af\u56de\u5f52", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5148\u9a8c\u5206\u5e03", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27075v1", "published_at": "2026-11-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Do LLM-Elicited Priors Help? A Controlled Audit of Language Models as Priors for Small-Sample Bayesian Regression", "tldr": "\u53d7\u63a7\u5ba1\u8ba1\u53d1\u73b0\uff0c\u5927\u6a21\u578b\u56de\u5f52\u5148\u9a8c\u6536\u76ca\u6709\u9650\uff0c\u6570\u636e\u9a71\u52a8\u5c3a\u5ea6\u4e0e\u6df7\u5408\u7b56\u7565\u66f4\u5b89\u5168\u3002", "upvotes": 0, "what_it_is": "\u5ba1\u8ba1\u4e24\u6863\u5927\u6a21\u578b\u4e3a\u5c0f\u6837\u672c\u8d1d\u53f6\u65af\u56de\u5f52\u63d0\u4f9b\u7cfb\u6570\u5148\u9a8c\u7684\u6548\u679c\u3002\u901a\u8fc7\u9690\u85cf\u7279\u5f81\u540d\u3001\u4f7f\u7528\u8bad\u7ec3\u622a\u6b62\u540e\u7684\u4f4f\u623f\u6570\u636e\u53ca\u9519\u914d\u7279\u5f81\u63cf\u8ff0\uff0c\u68c0\u9a8c\u6536\u76ca\u4e0e\u53ef\u9760\u6027\u3002", "why_notable": "\u63ed\u793a\u591a\u6b21\u91c7\u6837\u5e76\u4e0d\u7b49\u4e8e\u72ec\u7acb\u8bc1\u636e\uff1b18\u4e2a\u5916\u90e8\u4efb\u52a1\u4e2d\u4ec56\u4e2a\u83b7\u76ca\u30014\u4e2a\u53d7\u635f\uff0c\u652f\u6301\u8bc1\u636e\u52a0\u6743\u6df7\u5408\u800c\u975e\u786c\u4fe1\u4efb\u95e8\u63a7\u3002"}, {"abstract": "Multilingual reasoning distillation requires choosing the language in which teacher reasoning is presented, yet existing recipes often entangle linguistic form with differences in generation, translation, and filtering. We construct content-controlled supervision by rendering the same verified English trajectories into English, translated target-language, and language-mixed shells, and fine-tune two pretrained students in three target languages, evaluating them on multilingual mathematical reasoning at two difficulty levels. Even with the underlying reasoning content held fixed, we find that shell choice can change downstream accuracy, with effects varying across students, languages, and difficulty levels. Pre-training compatibility does not consistently track these outcomes, and even when our tests find no clear accuracy difference between shells, their output-language behavior can still differ substantially. These results suggest that the supervision shell is a distinct design choice in multilingual reasoning distillation.", "arxiv_id": "2611.27053", "arxiv_url": "https://arxiv.org/abs/2611.27053", "authors": ["Hoejoon Kwon", "Jinhee Jang", "Byeonggeuk Lim", "YoungBin Kim"], "brief": "\u5c06\u540c\u4e00\u6279\u7ecf\u9a8c\u8bc1\u7684\u82f1\u8bed\u63a8\u7406\u8f68\u8ff9\u8f6c\u6362\u4e3a\u82f1\u8bed\u3001\u76ee\u6807\u8bed\u8a00\u548c\u6df7\u5408\u8bed\u8a00\u4e09\u79cd\u76d1\u7763\u5f62\u5f0f\uff0c\u5fae\u8c03\u4e24\u4e2a\u9884\u8bad\u7ec3\u5b66\u751f\u6a21\u578b\uff0c\u9694\u79bb\u8bed\u8a00\u5f62\u5f0f\u5bf9\u591a\u8bed\u8a00\u63a8\u7406\u84b8\u998f\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27053", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u56fa\u5b9a\u5df2\u9a8c\u8bc1\u63a8\u7406\u5185\u5bb9\uff0c\u5bf9\u6bd4\u4e09\u79cd\u76d1\u7763\u8bed\u8a00\u5f62\u5f0f", "\u4e24\u4e2a\u5b66\u751f\u6a21\u578b\u3001\u4e09\u79cd\u76ee\u6807\u8bed\u8a00\u3001\u4e24\u4e2a\u96be\u5ea6\u7b49\u7ea7", "\u51c6\u786e\u7387\u5dee\u5f02\u4e0d\u660e\u786e\u65f6\uff0c\u8f93\u51fa\u8bed\u8a00\u4ecd\u53ef\u80fd\u663e\u8457\u4e0d\u540c"], "keywords": ["\u591a\u8bed\u8a00\u63a8\u7406", "\u77e5\u8bc6\u84b8\u998f", "\u6570\u5b66\u63a8\u7406", "\u53d7\u63a7\u5b9e\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27053v1", "published_at": "2026-11-20", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Isolating the Language Shell: A Content-Controlled Study of Multilingual Reasoning", "tldr": "\u56fa\u5b9a\u63a8\u7406\u5185\u5bb9\u540e\uff0c\u76d1\u7763\u8bed\u8a00\u5f62\u5f0f\u4ecd\u4f1a\u5f71\u54cd\u591a\u8bed\u8a00\u6570\u5b66\u63a8\u7406\u51c6\u786e\u7387\u4e0e\u8f93\u51fa\u8bed\u8a00\u3002", "upvotes": 0, "what_it_is": "\u5c06\u540c\u4e00\u6279\u7ecf\u9a8c\u8bc1\u7684\u82f1\u8bed\u63a8\u7406\u8f68\u8ff9\u8f6c\u6362\u4e3a\u82f1\u8bed\u3001\u76ee\u6807\u8bed\u8a00\u548c\u6df7\u5408\u8bed\u8a00\u4e09\u79cd\u76d1\u7763\u5f62\u5f0f\uff0c\u5fae\u8c03\u4e24\u4e2a\u9884\u8bad\u7ec3\u5b66\u751f\u6a21\u578b\uff0c\u9694\u79bb\u8bed\u8a00\u5f62\u5f0f\u5bf9\u591a\u8bed\u8a00\u63a8\u7406\u84b8\u998f\u7684\u5f71\u54cd\u3002", "why_notable": "\u5c06\u76d1\u7763\u8bed\u8a00\u5f62\u5f0f\u4ece\u751f\u6210\u3001\u7ffb\u8bd1\u548c\u7b5b\u9009\u5dee\u5f02\u4e2d\u5265\u79bb\uff0c\u8868\u660e\u5b83\u662f\u84b8\u998f\u7684\u72ec\u7acb\u8bbe\u8ba1\u53d8\u91cf\uff0c\u4e14\u9884\u8bad\u7ec3\u517c\u5bb9\u6027\u4e0d\u80fd\u7a33\u5b9a\u9884\u6d4b\u6548\u679c\u3002"}, {"abstract": "Language models assign different probabilities to token sequences that decode to the same string. In reinforcement learning from verifiable rewards (RLVR), a trainer that re-encodes sampled text may train on a different token sequence with the same reward. We ask how far this moves a training update, and whether the movement has a consistent direction. From one checkpoint, we compare updates on the same rollouts, canonical and with selected tokens split into two pieces, against an update on a different batch. On Qwen2.5-0.5B with three-digit addition, splitting about one token in 25 moves the update 0.556 times as far as replacing the batch. The ratio rises with the fraction split in four models and depends on which tokens are split; within a checkpoint, the displacements share a direction across batches. In a tabular model with one table per tokenization and a single sampled string, we prove that whenever two strings below an unsampled prefix differ in probability, only the zero full-gradient step agrees across tokenizations, however it is weighted. In an audit that decodes and re-encodes resampled rollouts, re-encoding touches up to 5.2% of rollouts but at most 0.08% of tokens, far below the split fractions we test. Training on fixed rollouts, the canonical arm finishes ahead in 14 of 18 pre-registered pairs; the interval for the mean accuracy difference includes zero over all pairs and excludes it only under the registered exclusion rule, which favours the canonical arm.", "arxiv_id": "2611.27083", "arxiv_url": "https://arxiv.org/abs/2611.27083", "authors": ["Zhe Dong", "Fang Qin"], "brief": "\u7814\u7a76\u4fdd\u6301\u6587\u672c\u4e0e\u5956\u52b1\u4e0d\u53d8\u65f6\uff0c\u91cd\u5206\u8bcd\u5982\u4f55\u6539\u53d8RLVR\u66f4\u65b0\u3002\u901a\u8fc7\u540c\u6279\u8f68\u8ff9\u7684\u89c4\u8303\u5206\u8bcd\u4e0e\u62c6\u5206\u5206\u8bcd\u5bf9\u7167\uff0c\u7ed3\u5408\u8868\u683c\u6a21\u578b\u8bc1\u660e\u53ca\u8bad\u7ec3\u5ba1\u8ba1\u91cf\u5316\u5f71\u54cd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27083", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["Qwen2.5-0.5B\u4e2d\u62c6\u5206\u7ea64%\u8bcd\u5143\uff0c\u66f4\u65b0\u4f4d\u79fb\u8fbe\u6362\u6279\u6b21\u76840.556\u500d", "\u56db\u6a21\u578b\u4e2d\u4f4d\u79fb\u968f\u62c6\u5206\u6bd4\u4f8b\u589e\u5927\uff0c\u540c\u68c0\u67e5\u70b9\u8de8\u6279\u6b21\u65b9\u5411\u4e00\u81f4", "\u89c4\u8303\u5206\u8bcd\u572818\u7ec4\u9884\u6ce8\u518c\u8bad\u7ec3\u5bf9\u7167\u4e2d\u8d6214\u7ec4\uff0c\u603b\u4f53\u5dee\u5f02\u533a\u95f4\u542b\u96f6"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5206\u8bcd", "\u8bed\u8a00\u6a21\u578b", "\u8bad\u7ec3\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27083v1", "published_at": "2026-11-20", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "How Far Does Lossless Re-tokenization Move an RLVR Update?", "tldr": "\u65e0\u635f\u91cd\u5206\u8bcd\u4e5f\u4f1a\u663e\u8457\u6539\u53d8\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u7684\u66f4\u65b0\uff0c\u5e76\u5448\u73b0\u4e00\u81f4\u504f\u79fb\u65b9\u5411\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u4fdd\u6301\u6587\u672c\u4e0e\u5956\u52b1\u4e0d\u53d8\u65f6\uff0c\u91cd\u5206\u8bcd\u5982\u4f55\u6539\u53d8RLVR\u66f4\u65b0\u3002\u901a\u8fc7\u540c\u6279\u8f68\u8ff9\u7684\u89c4\u8303\u5206\u8bcd\u4e0e\u62c6\u5206\u5206\u8bcd\u5bf9\u7167\uff0c\u7ed3\u5408\u8868\u683c\u6a21\u578b\u8bc1\u660e\u53ca\u8bad\u7ec3\u5ba1\u8ba1\u91cf\u5316\u5f71\u54cd\u3002", "why_notable": "\u63ed\u793a\u6587\u672c\u548c\u5956\u52b1\u76f8\u540c\u5e76\u4e0d\u4fdd\u8bc1\u8bad\u7ec3\u66f4\u65b0\u7b49\u4ef7\uff0c\u4e3aRLVR\u6570\u636e\u7ba1\u7ebf\u63d0\u4f9b\u68c0\u67e5\u4f9d\u636e\uff1b\u5b9e\u9645\u91cd\u7f16\u7801\u4ec5\u89e6\u53ca\u81f3\u591a0.08%\u8bcd\u5143\uff0c\u5f71\u54cd\u89c4\u6a21\u9700\u533a\u5206\u3002"}, {"abstract": "In this paper we introduce a new benchmark dataset, NightmareDiscourseBench, for testing NLP pipelines that identify forms of direct discourse in English-language fiction. We first review existing publicly available benchmarks (providing summary statistics and reviewing available metadata) for this task, identifying theoretical inconsistency and exclusive focus on speech as primary issues in this domain. We then overview our narrative theory-based framework for classifying and evaluating different forms of direct discourse, and finally describe NightmareDiscourseBench, a new benchmark test set of 12 text samples accompanied by metadata pertinent to the task of direct discourse identification.", "arxiv_id": "2611.27059", "arxiv_url": "https://arxiv.org/abs/2611.27059", "authors": ["Claudia Carroll", "Gabi Kirilloff", "Dashiell Leigh"], "brief": "\u63d0\u51fa\u7528\u4e8e\u8bc4\u6d4b\u82f1\u8bed\u5c0f\u8bf4\u76f4\u63a5\u8bdd\u8bed\u8bc6\u522b\u6d41\u7a0b\u7684\u65b0\u57fa\u51c6\u3002\u6838\u5fc3\u505a\u6cd5\u662f\u4ee5\u53d9\u4e8b\u7406\u8bba\u5efa\u7acb\u5206\u7c7b\u4e0e\u8bc4\u4f30\u6846\u67b6\uff0c\u5e76\u4e3a12\u4e2a\u6587\u672c\u6837\u672c\u914d\u5907\u4efb\u52a1\u76f8\u5173\u5143\u6570\u636e\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27059", "impact_score": 4, "is_agent": false, "is_top": true, "key_points": ["NightmareDiscourseBench\u542b12\u4e2a\u6587\u672c\u6837\u672c\u53ca\u76f8\u5173\u5143\u6570\u636e", "\u57fa\u4e8e\u53d9\u4e8b\u7406\u8bba\u5206\u7c7b\u3001\u8bc4\u4f30\u591a\u79cd\u76f4\u63a5\u8bdd\u8bed\u5f62\u5f0f", "\u68b3\u7406\u516c\u5f00\u57fa\u51c6\u7edf\u8ba1\u4e0e\u5143\u6570\u636e\uff0c\u6307\u51fa\u7406\u8bba\u4e0d\u4e00\u81f4\u53ca\u53ea\u5173\u6ce8\u8a00\u8bed\u7684\u95ee\u9898"], "keywords": ["\u81ea\u7136\u8bed\u8a00\u5904\u7406", "\u8bdd\u8bed\u8bc6\u522b", "\u8bc4\u6d4b\u57fa\u51c6", "\u53d9\u4e8b\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27059v1", "published_at": "2026-11-20", "score": 0.1, "selected_reasons": [], "thumbnail": null, "title": "NightmareDiscourseBench: A Benchmark Dataset for Fictional Direct Discourse Identification Pipelines", "tldr": "\u4ee5\u53d9\u4e8b\u7406\u8bba\u7edf\u4e00\u5c0f\u8bf4\u76f4\u63a5\u8bdd\u8bed\u5206\u7c7b\uff0c\u6784\u5efa\u8986\u76d6\u591a\u79cd\u5f62\u5f0f\u7684\u8bc6\u522b\u6d4b\u8bd5\u96c6\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u7528\u4e8e\u8bc4\u6d4b\u82f1\u8bed\u5c0f\u8bf4\u76f4\u63a5\u8bdd\u8bed\u8bc6\u522b\u6d41\u7a0b\u7684\u65b0\u57fa\u51c6\u3002\u6838\u5fc3\u505a\u6cd5\u662f\u4ee5\u53d9\u4e8b\u7406\u8bba\u5efa\u7acb\u5206\u7c7b\u4e0e\u8bc4\u4f30\u6846\u67b6\uff0c\u5e76\u4e3a12\u4e2a\u6587\u672c\u6837\u672c\u914d\u5907\u4efb\u52a1\u76f8\u5173\u5143\u6570\u636e\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u5c06\u8bc4\u6d4b\u4ece\u5355\u4e00\u8a00\u8bed\u8bc6\u522b\u6269\u5c55\u5230\u591a\u79cd\u76f4\u63a5\u8bdd\u8bed\u5f62\u5f0f\uff0c\u5e76\u4ee5\u7406\u8bba\u6846\u67b6\u6539\u5584\u5206\u7c7b\u4e00\u81f4\u6027\uff0c\u4e3a\u6587\u5b66\u6587\u672c\u5206\u6790\u63d0\u4f9b\u66f4\u660e\u786e\u7684\u6d4b\u8bd5\u4f9d\u636e\u3002"}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
