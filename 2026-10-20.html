nt": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27620v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Local Allow, Global Deny: Why Per-Action Authorization Does Not Compose in LLM Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recursive self-improvement (RSI) promises AI systems, such as self-evolving LLM agents, that become better at producing further improvements. Evaluating this promise requires separating product claims about the final system from process claims about the improvement process itself. Existing surveys specify the evidence these claims require, but how often studies report that evidence remains unmeasured. We examine this question through full-text coding of 114 eligible studies in a reproducible arXiv search frame frozen in October 2026, including 90 that describe their own systems as RSI. The codebook links claims to evaluation designs. Independent human coding, third-reader adjudication, and a separate blind coding of improver comparisons assess coding reliability. Among the 90 RSI studies, 90% report product evaluation beyond development tasks under a broad criterion that includes partial or unstated separation, while 60% report evaluation on tasks unused for selection. Only 22% audit two or more reruns of the full loop. In a human-coded random sample, the RSI studies show the same contrast: 45% evaluate on tasks unused for selection and 14% audit two or more reruns. Of the 26 studies claiming a better improvement procedure, 23 report a related comparison, but only 4 compare earlier and later procedures from identical starting artifacts at a matched budget. Across these results and a comparison set of established works, evidence for repeatability and improved procedures remains less developed than product evaluation. Three propositions explain how selection effects, shared evaluator errors, and changes in system state limit what product evaluations can establish. Together, the findings support a claim-indexed reporting standard that connects each claim to the evaluation design needed to test it.", "arxiv_id": "2610.27610", "arxiv_url": "https://arxiv.org/abs/2610.27610", "authors": ["Zihan Chen", "Di Zhu", "Lei Nico Zheng"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27610", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27610v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Auditing the Product, Not the Recursion: The Evaluation Evidence Behind Recursive Self-Improvement Claims", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents have become capable kernel engineers on mainstream GPU stacks, but they struggle on emerging accelerators such as Ascend NPUs, whose programming model is barely represented in pretraining data. Recent NPU agents address this gap largely through experience: they accumulate memory from their own generation and optimization trials and reuse it on later tasks. We argue that experience alone is not enough for kernel generation. An agent can only remember what it has tried, and it rarely tries a mechanism it does not know. As a result, such memory offers little help when a new operator calls for a different mechanism, and even familiar operators raise unseen situations as optimization proceeds. We present ASCENDEVOLVE, which grounds every step of an evolutionary kernel search in a large external knowledge base built from platform documentation, toolkit headers, and operator repositories. Because this corpus far exceeds any context window, ASCENDEVOLVE indexes it and routes each agent to a small, task-specific slice of evidence instead of the corpus itself. The retrieved knowledge seeds diverse implementation strategies, guides repair when a candidate fails, and constrains how strong candidates are recombined. On 53 Ascend C operators from CANN-Bench spanning four difficulty levels, ASCENDEVOLVE achieves an overall score of 71.39, improving over Reflexion and OpenEvolve by 11.6% and 17.2%.", "arxiv_id": "2610.27588", "arxiv_url": "https://arxiv.org/abs/2610.27588", "authors": ["Xi Chen", "Ming Shen", "Haotian Yan", "Ruoyu Sun", "Tianjun Yao"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27588", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27588v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Experience: Knowledge-Guided Evolution for NPU Kernel Generation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Porous-material adsorption studies require coordinated structure preparation, force-field selection, simulation, validation, and interpretation, making end-to-end automation difficult. We test whether RaspAssistant, a hierarchical multi-agent framework, can carry an adsorption study from force-field preparation through validation and downstream separation analysis. Across twelve multi-agent workflow-reproduction runs spanning four adsorption and separation benchmarks, overall scores ranged from 8.50 to 10.00 on a rubric evaluating workflow correctness, simulation validity, and analysis consistency. In a separate eight-case force-field extraction benchmark, the mean weighted score was 0.967, combining parameter agreement and RASPA readiness. In open-ended studies, the system diagnosed and refined an acetylene force field and, after validating a CO$_2$ force field against MFI experiments, screened 197 pure-silica zeolites that passed automated input checks. These results demonstrate autonomous workflow execution after task specification and input provision: RaspAssistant coordinates, validates, adapts, and documents extended adsorption-simulation workflows while exposing model sensitivity and methodological limitations for expert review.", "arxiv_id": "2610.27572", "arxiv_url": "https://arxiv.org/abs/2610.27572", "authors": ["Marko Petkovi\u0107", "Susanne Gooijer", "Jos\u00e9 Manuel Vicent-Luna", "Vlado Menkovski", "Sof\u00eda Calero"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27572", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27572v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "RaspAssistant as an Agentic Framework for Automating Adsorption Simulation Research in Porous Materials", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When an LLM agent acts on behalf of a user, it is expected to act within the authorization scope the user grants. Existing agent evaluations largely measure task completion or harmful consequences and can therefore overlook actions that violate this delegation without producing conventional safety or privacy harms. We introduce AuthorizationBench, a benchmark of authorization alignment grounded in documented real-world cases. A scalable construction pipeline produces 286 executable tasks spanning situational triggers, the presence or absence of direct harmful consequences, and ten application domains. We execute every task with four models at two reasoning-effort settings across three agent harnesses in an authorization-aware sandbox that keeps authorized and out-of-authorization paths executable and observable, yielding 6,864 trajectories. Agents act out of authorization in 19.2% of trajectories, with rates ranging from 10.5% to 26.6% across the 24 configurations. Task completion does not imply authorization. Increasing reasoning effort leaves the aggregate rate nearly unchanged, with effects varying across models. On controlled pairs, agents act out of authorization at similar rates with (17.9%) and without (20.8%) direct harmful consequences, and more often under benign pressures than malicious injections (23.5% versus 17.6%, p=0.002). Our results show that task capability, additional reasoning, and consequence-oriented safety evaluation do not by themselves ensure authorization alignment. Moreover, agents that consult the principal before completing a task exhibit lower rates of out-of-authorization behavior (14.0% versus 21.6%, p\u003c0.001), pointing to a tension between agent autonomy and preserving users\u0027 decision authority that calls for further human-centered study. Dataset and code are available at https://github.com/PEACH-Research-Lab/AuthorizationBench .", "arxiv_id": "2610.27548", "arxiv_url": "https://arxiv.org/abs/2610.27548", "authors": ["Zhiping Zhang", "Franklin Mingzhe Li", "Zihao Huang", "Tianshi Li"], "brief": "", "categories": ["cs.AI", "cs.CR", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27548", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27548v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Act on Your Behalf, Beyond Your Authorization: Benchmarking LLM Agent Authorization Alignment", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic system design is increasingly shifting from hand-crafted prompts and workflows toward automated search over agentic programs and interaction structures, with multi-agent systems receiving growing attention. Yet a central question remains unresolved: when does an automatically generated multi-agent structure exhibit a functionally meaningful division of responsibility? We argue that automated multi-agent design should move beyond searching for effective architectures toward identifying which responsibilities are functionally necessary, how they should be allocated, and when they should change. To explore this, we propose Automated Multi-Agent Organization Design (AMOD), which treats organization itself as a first-class design object, explicitly modeling how agent teams are composed, what functional responsibilities the agents assume, how they coordinate, and how collective decisions are made. We formulate AMOD as an execution-driven design loop. For each task, an automated designer instantiates an organization by assigning functional responsibilities and coordination rules to a set of agents. After execution, task outcomes, intermediate artifacts, and interaction traces are examined to identify which responsibilities may be missing, duplicated, or ineffective, and the organization is revised accordingly. We also propose testing discovered responsibilities by removing them, replacing them with generic roles, or changing their assignment under matched resource budgets, with complementary evaluations. AMOD provides a principled foundation for evidence-based and adaptive multi-agent organization design.", "arxiv_id": "2610.27531", "arxiv_url": "https://arxiv.org/abs/2610.27531", "authors": ["Shao-Jun Xia", "Yuner Zhang", "Huixin Zhang", "Di Wang", "Yifan Jiang", "Liangxi Liu"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27531", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27531v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Automated Multi-Agent Organization Design: From Architecture Search to Organizational Learning", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When a language model develops capabilities not traceable to its individual components, when a multi-agent AI system outperforms each agent on its own, or when a human-AI pair succeeds where either fails in isolation, AI researchers describe it as a case of ``synergy\u0027\u0027 or ``emergence\u0027\u0027. However, these are usually informal assessments not supported by a theoretical framework, making these claims impossible to compare or even meaningfully dispute. Here we argue that \\emph{information decomposition can serve as a unifying formal framework to operationalize assessments about synergy in AI systems}. Information decomposition provides a way to distinguish qualitatively different \\emph{types} of information, including unique information available from individual components, redundant information shared across multiple components, and synergistic information accessible only from parts taken together. This gives claims of emergence a precise, falsifiable criterion: a system\u0027s behavior is emergent only if it carries synergistic information about task-relevant outcomes. We apply this lens to attention heads, autonomous agents, and human-AI teams, showing how it organizes existing knowledge across scales and substrates, while also generating cross-level conjectures that siloed fields would miss.", "arxiv_id": "2610.28479", "arxiv_url": "https://arxiv.org/abs/2610.28479", "authors": ["Christoph Riedl", "Fernando E. Rosas"], "brief": "", "categories": ["cs.AI", "cs.HC", "cs.IT", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28479", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28479v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Claims of emergence in AI should be grounded in information decomposition", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents increasingly use persistent memory to personalize responses, and personal attributes in this memory pose a privacy risk if exposed. We ask how consulting memory during dialogue changes what users go on to say, and thus what the memory comes to reveal. In multi-session simulations, a simulated user with 24 personal attributes talks with a support agent that does or does not consult memory, and in both settings attributes are inferred from the full accumulated record. Across four support models, memory raises response quality but also empirical leakage, the share of attribute values correctly inferred from the record, by a margin that widens over sessions. The cause is a loop in ordinary, non-adversarial assistance. Memory-conditioned responses carry earlier values forward, often as presuppositions, and users affirm them or leave them uncorrected, so that cues and the agent\u0027s own guesses become recorded values. The loop reinforces itself, and removing the agent\u0027s mentions of an attribute lowers its later disclosure about twice as much as single-turn effects predict. Users cannot leave it on their own, since correcting a value discloses the attribute, declining to discuss it shifts later predictions toward sensitive values, and incorrect values left in place become entrenched. The loop is best weakened at the agent\u0027s response. Instructing the agent not to state or presuppose attributes brings leakage to about the no-memory level while keeping most of the quality gains, whereas filtering or anonymizing what users say or what is stored gives up much of them.", "arxiv_id": "2610.28315", "arxiv_url": "https://arxiv.org/abs/2610.28315", "authors": ["Masahiro Kaneko", "Hiromi Arai", "Timothy Baldwin"], "brief": "", "categories": ["cs.CR", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28315", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28315v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Disclosure Begets Disclosure: A Self-Reinforcing Privacy Loop in LLM Agents with Persistent Memory", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent studies in harness optimization have shown substantial performance gains in language model agents without updating model weights. A well-designed harness more effectively leverages the underlying model\u0027s capabilities by shaping context, tool use, and execution workflows. However, na\u00efve success rates alone do not fully characterize whether optimized harness yields more reliable success on tasks already within reach (elicitation) or a broader range of solvable tasks (expansion). This distinction is crucial for recursive self-improvement and evolutionary search, as expansion may provide a broader range of successful experiences to push the capability boundaries. Despite the growing significance, this distinction remains underexplored in harness optimization. We conduct a systematic analysis to study the effect of gains from harness optimization. Building on pass@k analyses in the reinforcement learning (RL) literature that compare models before and after RL training, we compare optimized harnesses with their pre-optimization counterparts. Specifically, we assess changes in reachable task coverage, compare harness optimization with model scaling and increased inference-time compute, and examine how gains vary with task difficulty. Across static prediction and dynamic tasks, we find that pass@1 advantages of harness over stronger interventions can reverse at larger attempt budgets and aggregate gains conceal shortfalls on hard tasks, underscoring the need for a fine-grained diagnosis.", "arxiv_id": "2610.27889", "arxiv_url": "https://arxiv.org/abs/2610.27889", "authors": ["Younghyun Kim", "Wooseok Seo", "Minseo Kim", "Seunghyuk Oh", "Minjae Lee", "Donghoon Kim", "Hyung Il Koo", "Jaehyung Kim", "Wonjun Kang"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27889", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27889v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Elicitation or Expansion? Demystifying Gains from Agent Harness Optimization", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In long-term memory systems, memories are constructed from interaction histories and retrieved in response to queries, enhancing the reasoning ability of LLM agents. In complex scenarios, facts are scattered across sessions and their relationships evolve over time, making it difficult for existing memory systems to compose them to adapt to diverse queries. Motivated by the modularity and composability of code, we propose Memory as Code (MaC), a unified memory framework that jointly designs memory construction and retrieval through a shared code abstraction. MaC couples codified construction, which establishes executable memory abstractions, with declarative retrieval, which translates queries into structured retrieval programs. Specifically, codified construction builds a three-layer executable memory structure that progresses from an atomic function layer, through a relational layer, to a modular composition layer. Declarative retrieval recasts retrieval from relevance-based fact selection into declarative query processing over memory. Experiments on LoCoMo and LongMemEval show relative gains of up to 15.91% in overall LLM-judge accuracy over the strongest baseline in each setting, while substantially reducing token consumption, highlighting the effectiveness of memory as code for long-horizon memory tasks.", "arxiv_id": "2610.27700", "arxiv_url": "https://arxiv.org/abs/2610.27700", "authors": ["Aoting Zeng", "Yuxin Du", "Jianwei Wang", "Yizhang He", "Shan Jiang", "Xuemin Lin", "Kai Wang"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27700", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27700v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Memory as Code: Declarative Retrieval over Codified Long-Term Memory", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Matryoshka Representation Learning (MRL) is designed to support flexible representation sizes by jointly optimizing nested prefixes. While effective, this design lacks an explicit constraint to ensure that the leading portion provides a suitable compact encoding. To address this, we propose SpecMRL, which reorganizes the feature space to enable more effective prefix readout. Specifically, we extend MRL with a parameter-derived spectral basis organized with feature importance. SpecMRL otherwise follows standard MRL, with prefix readout performed in the learned spectral space. Experiments on MTEB show that SpecMRL outperforms MRL at all evaluated reduced dimensions, with larger gains under more aggressive compression. These results suggest that the learned spectral basis better prioritizes informative directions, enabling more effective representation compression. Notably, SpecMRL extends the performance frontier of MRL, surpassing full-dimensional MRL with only half the embedding dimensions.", "arxiv_id": "2610.26824", "arxiv_url": "https://arxiv.org/abs/2610.26824", "authors": ["Zhongxin Chen", "Songhao Wu", "Heng Cui", "Cong Li", "Xiao Zhou", "Rui Yan"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/CentreChen/Spec-MRL", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2610.26824", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26824v1", "published_at": "2026-10-19", "score": 0.138, "selected_reasons": ["HF trending (80\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26824.png", "title": "SpecMRL: Redesign Matryoshka Representation Learning within Parametric Spectrum", "tldr": null, "upvotes": 80, "what_it_is": null, "why_notable": null}, {"abstract": "Experience generated during deployment offers an opportunity for robots to improve policy reliability through learning from their own executions. However, learning through human corrections requires teleoperators to monitor execution and intervene when policies fail, a demand that is difficult to meet as robot fleets grow. We introduce collective experience learning (CEL), a learning paradigm in which deployed robots share their execution experience to improve a common policy. We realize CEL through failure-guided experience retrieval fine-tuning (FERT), which uses failure contexts from robot executions to retrieve relevant trajectory segments from the fleet\u0027s shared successful experience and uses their actions as supervision for policy updates, without collecting additional expert demonstrations or corrective actions. A fault-tolerant asynchronous training system (FATS) coordinates experience collection, policy optimization and policy distribution despite local interruptions within the robot fleet. Across five real-world manipulation tasks, the resulting policies achieve success rates of 93.3-99.2%, evaluated over 120 trials per task on robots excluded from training data collection. With collection time per robot held fixed, larger fleets provide more experience and FERT generally achieves higher success rates across the evaluated sizes. On multi-stage phone packaging, learning with 96 robots increases success from 79.2% to 98.3%. These results support collective experience as a practical basis for scalable robot learning and a path towards improving policy reliability during deployment without collecting additional expert corrective actions.", "arxiv_id": "2610.25736", "arxiv_url": "https://arxiv.org/abs/2610.25736", "authors": ["Chao Yu", "Shu\u0027ang Yu", "Hao Lin", "Hongzhi Zang", "Yuxiang Yan", "Chenxi Jiang", "Zhen Guo", "Chuankang Li", "Yihao Chen", "Xin Xu", "Xu Fu", "Jiakai Zhou", "Liangzhi Shi", "Hongyi Ren", "Yiwei Liu", "Jing Wu", "Yuanqing Wang", "Chen Wu", "Bo Dai", "Chunyu Yang", "Hongliang Huang", "Shuoyu Yue", "Weiqi Yin", "Yinuo Chen", "Ruihua Chen", "Chunyang Zhu", "Han Xiao", "Yanghao Li", "Ruipu Wu", "Zhikai Cai", "Xiu Chen", "Xu Tan", "Yuchen Yan", "Jialin Zhang", "Wen Zeng", "Yiming Zhou", "Zixiao Huang", "Guanghui Ren", "Quanlu Zhang", "Boxun Li", "Maoqing Yao", "Yu Wang"], "brief": "", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25736", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25736v1", "published_at": "2026-10-19", "score": 0.129, "selected_reasons": ["HF trending (108\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25736.png", "title": "Learning from Fleet Experience: A Collective Learning Paradigm for Robots", "tldr": null, "upvotes": 108, "what_it_is": null, "why_notable": null}, {"abstract": "AI coworkers must coordinate tools, communicate across turns, and act on changing workspace state while respecting workflow constraints. Constructing training experience for these capabilities requires coherent requests, service records, tool interfaces, and grading checks. We present CoworkEnv, a capability-guided framework for synthesizing executable training environments for AI coworkers. Workflow requirements guide task construction, and programmatic validation with feedback repair checks generated specifications and grading behavior. Teacher executions yield curated demonstrations for supervised fine-tuning (SFT), while student interactions provide rollouts and rewards for reinforcement learning (RL). Using these resources, we train compact PocketWorker models. For Qwen3-VL-8B-Instruct, SFT raises the mean score from 46.6 to 64.1 on Claw-Eval, including a 31.9-point gain on Multi-turn tasks. An SFT-only extension to ClawMark demonstrates applicability across coworker benchmarks. We further compare RL training dynamics across configurations that vary reward processing and credit assignment. Improving training rewards provide preliminary evidence that the constructed environments support policy optimization.", "arxiv_id": "2610.24960", "arxiv_url": "https://arxiv.org/abs/2610.24960", "authors": ["Zhongwei Xie", "Yiming Du", "Jiaxin Bai", "Baixuan Xu", "Chunyang Li", "Xiyu Ren", "Wei Fan", "Tianshi Zheng", "Weizhi Du", "Jingqiao Yu", "Xingsu Li", "Zhaowei Wang", "Yangqiu Song"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/HKUST-KnowComp/CoworkEnv", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2610.24960", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.24960v1", "published_at": "2026-10-18", "score": 0.126, "selected_reasons": ["HF trending (38\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24960.png", "title": "CoworkEnv: Synthesizing Training Environments for Long-Horizon Cowork Agents", "tldr": null, "upvotes": 38, "what_it_is": null, "why_notable": null}, {"abstract": "Procedural generation plays a key role in synthetic data creation and game development, offering greater controllability, editability, and diversity than static mesh representations. However, VLM-based code generation often produces relatively simple 3D assets, while sophisticated photorealistic procedural systems require extensive manual development. Existing VLM-guided procedural methods remain largely constrained by predefined factories and APIs, limiting their ability to create novel asset types. We introduce InfiniDream, a VLM-driven framework for open-ended procedural 3D world generation. First, we propose Symbolically Constrained Asset Generation, which leverages existing procedural algorithms to create novel, photorealistic assets while preserving editability and seed-based diversity. Second, we develop an end-to-end text-to-world pipeline that combines semantic scene planning with Deterministic Frustum-Guided Grid Placement to construct large-scale 3D worlds with precise object placement, procedural population, and animation. Extensive evaluations on 100 object and 20 scene generation tasks demonstrate improvements across four perceptual metrics. Diversity analysis, ablation studies, and human preference evaluations further validate the effectiveness of our framework. Project page: https://yichuanh.github.io/infinidream-page/", "arxiv_id": "2610.26853", "arxiv_url": "https://arxiv.org/abs/2610.26853", "authors": ["Yi-Chuan Huang", "Hao-Jen Chien", "Zheng-Hui Huang", "Yu-Lun Liu", "Kaipeng Zhang", "Zhixiang Wang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/yichuanH/InfiniDream", "github_stars": 25, "hf_url": "https://huggingface.co/papers/2610.26853", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Alaya Lab", "pdf_url": "https://arxiv.org/pdf/2610.26853v2", "published_at": "2026-10-19", "score": 0.121, "selected_reasons": ["HF trending (26\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26853.png", "title": "InfiniDream: Open-Ended Photorealistic 3D Worlds Through Procedural Generation", "tldr": null, "upvotes": 26, "what_it_is": null, "why_notable": null}, {"abstract": "The goal of a world model is to capture the dynamics of an environment. This has the great appeal that it allows agents to plan and simulate a course of actions with the help of a world model. For these uses to be reliable, however, the learned dynamics must behave well beyond the specific state-action combinations observed in expert rollouts. Despite this, the relationship between data coverage, dynamics generalization, and downstream planning performance remains underexplored. We study this relationship through the lens of compositional generalization: can a world model recombine familiar state and action factors into valid dynamics? To answer this, we introduce AnyGoal, a benchmark of goal-shifted task variants built from widely used world-model environments, together with an open-source library. Each task is designed to be within reach of a world model that has learned the underlying dynamics: individual state factors and actions remain within their training support, but their combinations are underrepresented in expert trajectories. Across multiple environments and world model families, we find that current models consistently exhibit failures under these recombinations. By examining dynamics and representation failures across model families, interaction regimes, and evaluation metrics, we study where current world models generalize and where challenges remain for goal-shifted prediction and planning. Together, this framework, benchmark, and analysis provide a basis for evaluating progress toward world models that generalize to new planning tasks.", "arxiv_id": "2610.26844", "arxiv_url": "https://arxiv.org/abs/2610.26844", "authors": ["Heejeong Nam", "Divyat Mahajan", "Quentin Le Lidec", "Randall Balestriero", "David Klindt"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/galilai-group/AnyGoal", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.26844", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "galilai-group", "pdf_url": "https://arxiv.org/pdf/2610.26844v1", "published_at": "2026-10-19", "score": 0.113, "selected_reasons": ["HF trending (31\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26844.png", "title": "AnyGoal: On World Model Generalization Beyond Expert Rollouts", "tldr": null, "upvotes": 31, "what_it_is": null, "why_notable": null}, {"abstract": "Robotic value models assess task execution from visual observations and instructions, providing feedback for policy learning and execution monitoring. However, existing evaluations cover only selected aspects of execution understanding, leaving the reliability of value feedback insufficiently tested. We introduce RoboValue, a fine-grained sim-and-real benchmark for unified evaluation of robotic value models. Its framework evaluates four complementary capability dimensions through shared interfaces: task-state understanding, temporal progress monitoring, failure and recovery reasoning, and value consistency. Diagnostic trajectories and instruction variations test whether value judgments accurately reflect task requirements and changes throughout execution. RoboValue-Dataset covers 15 simulation and 20 real-world manipulation tasks, providing expert demonstrations for training and annotated trajectories for fine-grained evaluation. We evaluate representative robotic value models in zero-shot and one-shot settings under standard conditions and separate shifts in robot embodiment and environment. Our results reveal errors in fine-grained instruction grounding, history-dependent progress tracking, and recovery assessment, even in models with strong outcome and forward-progress scores. The same semantic subtask can also receive substantially different value gains across valid execution orders. These findings identify concrete targets for value supervision, while the dataset and public leaderboard support continued assessment of feedback reliability. The website is available at https://robovalue-benchmark.github.io/.", "arxiv_id": "2610.26663", "arxiv_url": "https://arxiv.org/abs/2610.26663", "authors": ["Shengbang Liu", "Zhengye Du", "Zhilong Wan", "Honghao Su", "Chenxiang Xia", "Chang Ge", "Jinyang Xiao", "Nan Wang", "Zhipeng Hu", "Huining Yuan", "Shu\u0027ang Yu", "Yue Chen", "Tianxing Chen", "Chuankang Li", "Maoqing Yao", "Wenbo Ding", "Yu Wang", "Guanghui Ren", "Chao Yu"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/RoboValue-Benchmark/RoboValue", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2610.26663", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26663v1", "published_at": "2026-10-19", "score": 0.11, "selected_reasons": ["HF trending (20\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26663.png", "title": "RoboValue: A Fine-Grained Sim-and-Real Benchmark for Unified Evaluation of Robotic Value Models", "tldr": null, "upvotes": 20, "what_it_is": null, "why_notable": null}, {"abstract": "Feed-forward 3D Gaussian Splatting (3DGS) promises instant scene reconstruction with high-quality novel-view synthesis. Yet, fine-grained geometry and appearance remain difficult to recover, motivating us to revisit how feed-forward models represent, aggregate, and refine detailed visual information. We introduce FineSplat, a feed-forward 3DGS framework built around fine-grained image patches. Since global multi-view attention becomes prohibitively expensive at such high token resolutions, we develop a dual-grouping strategy that combines two complementary forms of locality: view-wise grouping enables efficient interaction among neighboring views, while 3D spatial grouping reconnects geometrically related tokens that may never have interacted under view-wise grouping by lifting them into the 3D scene space. We further leverage reconstruction error as direct feedback, providing an explicit rendering-based signal to recover fine-grained structures and appearance, thereby overcoming the limitations of one-pass feed-forward prediction. Finally, a compact Gaussian generation scheme preserves the benefits of fine-grained features without unnecessarily increasing the number of primitives. Together, these designs enable FineSplat to recover richer geometry and appearance while remaining efficient and compact, achieving state-of-the-art results by a substantial margin, under the same or smaller Gaussian budgets than existing methods.", "arxiv_id": "2610.25011", "arxiv_url": "https://arxiv.org/abs/2610.25011", "authors": ["Hyebin Kim", "Hwasik Jeong", "Joonhyuk Park", "Gyeongjin Kang", "Jungwoo Kim", "Younghyun Kim", "Eunbyung Park"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/hyebinny/FineSplat", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.25011", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25011v1", "published_at": "2026-10-18", "score": 0.106, "selected_reasons": ["HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25011.png", "title": "FineSplat: Fine Patches, Local Groups, Detailed Splats", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming video world models generate the future chunk by chunk, conditioned on their own past and a stream of actions. Trained on short clips, they drift once a rollout exceeds the training horizon, as prediction errors re-enter the context and compound. A common remedy is to train the model on its own rollouts via distribution matching distillation (DMD). For action-conditioned world models, the teacher becomes a bottleneck: an external video model is agnostic to the actions, whereas the model\u0027s own pretrained network drifts in the same manner as the student. We observe that a long rollout need not match a teacher, provided it remains a realistic continuation of its own scene that follows the commanded actions. Realism and scene fidelity can be measured against real-data statistics, which remain valid at any horizon, while action following is preserved by the model\u0027s conditional generation loss. We propose Fr\u00e9chet Forcing, which fine-tunes a world model together with its deployed multi-step sampler under three constraints. Generative anchoring applies the flow-matching loss after a self-generated history ending on real data. Context fidelity, a Fr\u00e9chet distance (FD) on latent statistics of the free rollout centred on each clip\u0027s own ground truth, keeps every rollout faithful to its scene. Reality matching, an FD to real frames in a frozen perceptual space, keeps the generated frames realistic. Because all three targets are derived from short real clips without comparing a rollout against a long recorded future, training requires no teacher, no online critic and no long videos. Fine-tuning MiniWorld-1B, pretrained on 253-frame clips, for at most 36 GPU-hours on 381-frame clips yields rollouts that remain stable beyond 4,000 frames and continue to follow their actions in both robot manipulation and camera-controlled exploration.", "arxiv_id": "2610.25666", "arxiv_url": "https://arxiv.org/abs/2610.25666", "authors": ["Yian Zhao", "Yu Yan", "Hongcan Guo", "Ruochong Zheng", "Jian Zhang", "Jie Chen"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/zhao-yian/Frechet_Forcing", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2610.25666", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25666v1", "published_at": "2026-10-19", "score": 0.103, "selected_reasons": ["HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25666.png", "title": "Frechet Forcing: Training Long-Horizon Streaming World Models from Short Clips", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "Emerging Joint-Embedding Predictive Architectures (JEPAs) are moving beyond representation learning towards latent world models that support prediction, planning, and control. Yet their latent worlds naturally lack a human-interpretable interface. In this Perspective, we argue that as JEPA latents become internal states for prediction and action, interpretability must move beyond what they encode to how latent variables interact, evolve, and causally drive prediction. To this end, we envision a four-stage research agenda, involving Ground, Structure, Verify, and Act, to guide this shift toward actionable latent-world understanding. Within our framework, existing JEPA interpretability efforts provide early evidence for Ground, while systematic analysis of latent structure, causal verification, and intervention remains largely unexplored. Overall, this Perspective aims to call for a broader latent-world interpretability agenda that shifts attention from decoding representations toward understanding, validating, and acting on latent worlds.", "arxiv_id": "2610.25296", "arxiv_url": "https://arxiv.org/abs/2610.25296", "authors": ["Jize Wang", "Yongcheng Jing", "Xinyi Le", "Cailian Chen", "Xinping Guan", "Dacheng Tao"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/Jize-W/Awesome-World-Model-Interpretability", "github_stars": 98, "hf_url": "https://huggingface.co/papers/2610.25296", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25296v1", "published_at": "2026-10-18", "score": 0.099, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25296.png", "title": "World Model Interpretability: From Decoding Representations to Understanding Latent Worlds", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Harness development plays a crucial role in building capable AI agents. Recent approaches improve harnesses through recursive self-improvement (RSI), but their performance gains often come with higher execution costs. We introduce HarnessPro, a label-free method for evolving harnesses to improve task performance while reducing execution cost. In this setting, candidate harnesses are evaluated using LLM-generated tests without access to ground-truth solutions or official tests. Specialized agents diagnose execution trajectories, plan updates with different performance-cost priorities, and implement them as candidate harnesses. Rather than returning a single harness, HarnessPro uses normalized weighted squared-distance selection to provide cost-focused (lite), balanced (medium), and performance-focused (heavy) harnesses for different deployment budgets. Selected harnesses enter the next iteration, where execution feedback guides further updates. Our experiments cover Terminal-Bench 2, SWE-Bench Pro, and ProgramBench, using GPT-5.5 with Codex and GLM-5.2 with Claude Code. Across these benchmarks using GPT-5.5 with Codex, the heavy mode of HarnessPro achieves an average pass-rate gain of 2.0 percentage points and an average per-task cost reduction of 26.1% relative to RHO. This advantage also holds when using GLM-5.2 with Claude Code. Code is available at https://github.com/pzs19/HarnessPro", "arxiv_id": "2610.26770", "arxiv_url": "https://arxiv.org/abs/2610.26770", "authors": ["Zhuoshi Pan", "ZhiYuan Feng", "Yukuo Cen", "Honglin Lin", "Junru Lu", "Zhongxia Chen", "Shuo Yang", "H. Vicky Zhao", "Jie Tang"], "brief": "", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/pzs19/HarnessPro", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.26770", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26770v2", "published_at": "2026-10-19", "score": 0.098, "selected_reasons": ["HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26770.png", "title": "HarnessPro: Recursive Harness Self-Improvement with Pareto Optimization for Performance-Cost Trade-offs", "tldr": null, "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "Game engines and coding agents can specify the layout, motion, and camera of a scene, yet turning such coarse structure into realistic video requires a renderer that follows the structure and completes the appearance it leaves open. Existing renderers are tied to the representation of one engine, need tens of denoising steps or a costly distillation of their own, and learn from conditions that are not aligned with their target videos. We present SolarRenderer, a structure-conditioned video renderer that adapts a frozen MiniMax-H3 33B backbone with two lightweight LoRAs. Structural videos enter the native reference pathway of the backbone at the positions of the frames they describe, without a type identifier and described only in plain text, so that a single control LoRA follows arbitrary structural representations. Starting from a pretrained four-step LoRA, structure-guided distribution matching renders in four steps, 12.3 times faster than 50-step sampling, while preserving the learned control. A block-causal variant extends the same design to streaming and renders 768p video in real time. To train the model, we build a frame-aligned corpus of 136K clips from game engines, simulators, and YouTube videos. Experiments on an in-distribution test set and a generalization benchmark of 16 structural representations show that SolarRenderer achieves state-of-the-art results across both, and generalizes to 11 unseen representations, including pose skeletons, drawings, and point clouds.", "arxiv_id": "2610.28630", "arxiv_url": "https://arxiv.org/abs/2610.28630", "authors": ["Guian Fang", "Shengju Qian", "Dongyue Lu", "Junchao Huang", "Lutao Jiang", "Xin Wang", "Yiren Song", "Li Jiang", "Mike Zheng Shou"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Enderfga/SolarRenderer", "github_stars": 153, "hf_url": "https://huggingface.co/papers/2610.28630", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Show Lab", "pdf_url": "https://arxiv.org/pdf/2610.28630v1", "published_at": "2026-10-20", "score": 0.095, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28630.png", "title": "SolarRenderer: Few-Step Generative Reference Rendering", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "We propose KronLSTM, a linear attention architecture based on the Kronecker Delta Rule, a novel update rule for associative matrix memories. KronLSTM extends the xLSTM family with a memory-revision mechanism that corrects targeted associations while modifying the memory only along a single direction in matrix space. This minimally invasive memory revision reduces interference with previously stored information compared with delta-rule updates, making it particularly well suited for long-context language modeling. The resulting memory dynamics can be mathematically described as a Markov chain that converges to a steady-state distribution, while the expected norm of the memory matrix remains uniformly bounded throughout the entire input sequence. Hence, KronLSTM ensures stable memory dynamics without requiring additional normalization and stabilization mechanisms for the memory state. Experiments show that KronLSTM is competitive with, and often outperforms, existing linear attention architectures, including models of the (Gated) DeltaNet family, with particularly strong performance on long context benchmarks. These results establish the Kronecker Delta Rule as an effective and analytically tractable foundation for stable associative memory in recurrent linear attention architectures. Our code (https://github.com/NX-AI/KronLSTM) and models (https://huggingface.co/collections/NX-AI/kronlstm) are open-source.", "arxiv_id": "2610.26834", "arxiv_url": "https://arxiv.org/abs/2610.26834", "authors": ["Anamaria-Roberta Hartl", "Levente Z\u00f3lyomi", "Michael List", "G\u00fcnter Klambauer", "Sebastian B\u00f6ck", "Sepp Hochreiter"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.26834", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "NX-AI", "pdf_url": "https://arxiv.org/pdf/2610.26834v1", "published_at": "2026-10-19", "score": 0.095, "selected_reasons": ["HF trending (28\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26834.png", "title": "Kronecker Delta Rule for Long Context Linear Attention", "tldr": null, "upvotes": 28, "what_it_is": null, "why_notable": null}, {"abstract": "Generalizing real-time physics-based animation across diverse 3D shapes and spatial discretizations remains challenging. In this paper, we introduce PhysSkin++, a physics-informed framework that learns continuous neural skinning fields from static geometries to construct compact deformation subspaces. Specifically, we propose a Neural Skinning Fields Autoencoder that predicts shape-dependent deformation subspaces without per-object network training. To learn these subspaces without simulation trajectories, we develop a Physics-Informed Self-Supervised Learning strategy that combines skinning-field normalization with conflict-aware gradient correction, stabilizing joint optimization under physical and orthogonality constraints. The learned representation supports efficient reduced dynamics with user control and contact interactions, together with direct animation binding to meshes, point clouds, and 3D Gaussians. For prescribed rig animation, we further introduce a self-supervised complementarity objective to learn complementary elastic responses without enforcing complementarity constraints at runtime. Experiments demonstrate cross-shape generalization of the learned skinning fields, real-time reduced simulation, and applications to controllable, collision-aware, and rig-complementary animation.", "arxiv_id": "2610.26067", "arxiv_url": "https://arxiv.org/abs/2610.26067", "authors": ["Yuanhang Lei", "Baofei Liu", "Xingxuan Li", "Tao Cheng", "Zixuan Wang", "Boming Zhao", "Yujun Shen", "Siyuan Huang", "Ruizhen Hu", "Peter Yichen Chen", "Hujun Bao", "Zhaopeng Cui"], "brief": "", "categories": ["cs.CV", "cs.GR"], "github_repo": "https://github.com/zju3dv/PhysSkin", "github_stars": 34, "hf_url": "https://huggingface.co/papers/2610.26067", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26067v1", "published_at": "2026-10-19", "score": 0.089, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26067.png", "title": "PhysSkin++: Real-Time and Generalizable Physics-Based Animation via Self-Supervised Neural Skinning", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Unified audio-video creation requires a single model capable of text-conditioned joint synthesis, bidirectional cross-modal generation, and instruction-guided editing across both modalities. Existing methods rely heavily on paired corpora, which are scarce for joint generation and even rarer for editing. Consequently, they are spent learning single-branch generative and editing capabilities that abundant unimodal data could readily teach, rather than on the cross-modal coupling. Furthermore, prevailing systems apply a single shared noise schedule to both modalities, neglecting two critical limitations. First, due to the significant discrepancy in information density, video requires prolonged high noise to organize spatial and motion structure, whereas the sparser audio signal can settle earlier during the synthesis process, the dynamics a uniform schedule might compromise. Second, lockstep denoising leaves asymmetric workflows, such as conditioning on one modality to synthesize or edit another, untrained. We present UniAVC, which addresses both obstacles. It first trains each branch on unimodal dataset to full generative and editing competence, and subsequently dedicates paired data to exploit cross-modal correspondence. Modality-decoupled schedulers meanwhile warp the noise schedule independently from a shared timestep, while subtasks with one clean modality directly supervise asymmetric configurations. These settings respectively enable intent-aware editing, which preserves one modality intact while enlisting it to constrain the other, and post-inference self-refinement, which regenerates only an unsatisfactory branch against an accepted one. UniAVC thus spans multiple creation tasks from a single set of weights without task-specific adapters.", "arxiv_id": "2610.24791", "arxiv_url": "https://arxiv.org/abs/2610.24791", "authors": ["Kien T. Pham", "Yuhao Liu", "Chong Hou Choi", "Zhenqi He", "Yanghao Wang", "Chenyang Lei", "Rui Liu", "Qifeng Chen", "Long Chen"], "brief": "", "categories": ["cs.CV", "cs.MM", "cs.SD", "eess.AS"], "github_repo": "https://github.com/HKUST-LongGroup/UniAVC", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2610.24791", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.24791v2", "published_at": "2026-10-17", "score": 0.089, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24791.png", "title": "UniAVC: Unified Audio-Video Creation via Progressive Training and Asymmetric Scheduling", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Video Reasoning Segmentation (VRS) requires a model to identify an implicitly described target and predict its pixel-level mask trajectory, while resolving the spatial relations and temporal events that determine the answer. Text-only Chain-of-Thought (CoT) can explain a target choice without making the underlying visual references explicit, leaving a \\emph{video reference gap} between linguistic inference and the evidence distributed across frames. We introduce \\textbf{Temporal Chain of Video Primitives (TCoVP)}, a spatiotemporally grounded form of Video CoT that organizes query-relevant observations into a chronological reasoning chain. Each primitive associates an entity reference with temporal support and timestamped spatial evidence, and the chain interleaves these references with language to guide reasoning about which entity is relevant, when the queried event holds, and where its evidence appears. The selected target primitives then provide box prompts and temporal support for video mask prediction. We construct TCoVP-SFT-15k and TCoVP-RL-13k to learn this representation through supervised fine-tuning and chain-aligned reinforcement learning. Extensive experiments across five VRS benchmarks and three model backbones demonstrate the strong performance of TCoVP, highlighting the effectiveness of organizing spatial and temporal evidence within the reasoning process. All models and code will be publicly released. Project page: \\url{https://victor-wjw.github.io/TCoVP/}", "arxiv_id": "2610.25090", "arxiv_url": "https://arxiv.org/abs/2610.25090", "authors": ["Junwei Wen", "Deshui Miao", "Guangming Lu", "Ming-Hsuan Yang", "Xin Li", "Wenjie Pei"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25090", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25090v1", "published_at": "2026-10-18", "score": 0.085, "selected_reasons": ["HF trending (19\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25090.png", "title": "Think Visually Across Space and Time: Grounded Reasoning for Video Segmentation", "tldr": null, "upvotes": 19, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper, we systematically investigate the mechanisms, scaling behavior, and generalization of physical Recursive self-improvement. We introduce PhysRSI-eval to quantify physical RSI through a five-axis metric: First-Attempt Performance, Efficiency, Success, Budget and Improvement from failure. Different VLMs are evaluated on 18 manipulation tasks under a fixed interaction budget. The analysis of experimental results motivates the Physical Barrel Hypothesis: different capabilities may constrain different parts of improvement. The five-axis metrics also distinguish systems with close public benchmark averages and show that high scores need not come with early or efficient gains. We study observational scaling from two perspectives: predicting the relative performance of VLM agents from their public capabilities, and forecasting later progress from early physical feedback. Together, these analyses ask how quickly and how far an agent can improve. Moreover, we conduct workspace interventions and then analyze what improvement leaves behind. Removing history reduces late-round success, frozen workspaces remain useful on unseen layouts, and three cross-task cases achieve success earlier. The results suggest that scene-specific adaptation and reusable experience can coexist.", "arxiv_id": "2610.26848", "arxiv_url": "https://arxiv.org/abs/2610.26848", "authors": ["Zekai Li", "Jiayi Yu", "Jinlu Zhang", "Luyang Niu", "Zekun Qi", "Jun Zheng", "Xuchuan Chen", "Dairu Liu", "Yintianrun Zhang", "He Wang", "Li Yi"], "brief": "", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.26848", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Galbot", "pdf_url": "https://arxiv.org/pdf/2610.26848v1", "published_at": "2026-10-19", "score": 0.082, "selected_reasons": ["HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26848.png", "title": "Where is Physical RSI capability from? An Observational Scaling Law of LLM-as-policy", "tldr": null, "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "Lifelong agents continually accumulate and reuse experience to improve after deployment, yet in practice they often operate under tight generation, interaction, and memory budgets. Under such stringent joint constraints, we find that existing lifelong-memory methods can become ineffective, with several sophisticated approaches offering little advantage over simple retrieval or even no-memory agents. This reveals a more fundamental problem: resource scarcity makes each memory decision more consequential. When only a small amount of past experience can be retained or reused and opportunities for reasoning and recovery are limited, retrieving a relevant but ineffective memory can consume scarce context and hinder downstream execution. The key challenge is therefore not simply to retrieve relevant experience, but to determine which experiences are actually worth retaining and reusing. To address this challenge, we propose TokenWorth, a lightweight online memory framework that learns query-dependent memory worth from sparse execution feedback and applies it consistently to memory retrieval and bounded memory management. Across three LifelongAgentBench environments and both local and API-based deployments, TokenWorth achieves the highest task success rate while using the fewest output tokens among the evaluated methods. These results suggest that effective lifelong adaptation under resource constraints depends not on remembering more, but on learning what is worth remembering. Our code is publicly available at https://github.com/AIGNLAI/TokenWorth.", "arxiv_id": "2610.26453", "arxiv_url": "https://arxiv.org/abs/2610.26453", "authors": ["Guannan Lai", "Zi-Yang Bai", "Jun-Peng Jiang", "Han-Jia Ye"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/AIGNLAI/TokenWorth", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.26453", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Nanjing University", "pdf_url": "https://arxiv.org/pdf/2610.26453v1", "published_at": "2026-10-19", "score": 0.082, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26453.png", "title": "Remembering Has a Price: Learning Memory Worth under Resource Constraints", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "General-purpose manipulation requires reliable behavior across embodiments, objects, and task demands. We introduce HandsOn, a composable simulation platform and benchmark for cross-embodiment dexterous manipulation. It supports five robotic arms, six dexterous hands, and approximately 200 rigid, articulated, and deformable assets in randomized scenes. The benchmark pairs 18,000 curated human demonstrations with 66 human-verified tasks: Core-50 supports demonstration-based learning and execution tests, while Transfer-16 evaluates asset and relation transfer, skill composition, and deformable manipulation without target-task training demonstrations. Qualitative real-robot rollouts illustrate sim-to-real transfer. Across diffusion, vision-language-action, world-action, and prompted VLM-based methods, the best trained multi-task policy achieves 29.1% Core-50 success. Without benchmark finetuning, GPT-6 using move_eef for palm-and-finger control achieves 5.2% on Core-50 and 1.9% on Transfer-16 over 660 trials. Trained-policy stage diagnostics expose failures in contact establishment, action coordination, and maintaining achieved goals, with additional sequencing errors in composed tasks. HandsOn provides a shared basis for investigating manipulation generalization and the limits of reliable physical interaction.", "arxiv_id": "2610.26765", "arxiv_url": "https://arxiv.org/abs/2610.26765", "authors": ["Tianwei Luo", "Yiming He", "Hongjin Wu", "Ting Pan", "Debin Ren", "Haorui Guo", "Junlin Yang", "Yuxin Zuo", "Zhehao Kou", "Kaisen Yang", "Zhuoqun Lai", "Yi Ding", "Jiale Yu", "Yuchen Zhang", "Zijie Qiu", "Haozhan Li", "Ning Ding"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/TsinghuaC3I/HandsOn", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2610.26765", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.26765v1", "published_at": "2026-10-19", "score": 0.079, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26765.png", "title": "HandsOn: A Large-Scale Simulation Benchmark for Generalizable Dexterous Manipulation", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Industrial manipulation in flexible manufacturing, e.g., high-mix, low-volume (HMLV) electronics assembly, requires robot policies to adapt to changing products and production conditions. Such settings impose industrial process constraints, including product variants, moving material flows, finite execution windows, and tight geometric tolerances. However, existing evaluation frameworks do not systematically capture these constraints when assessing generalist robot policies. To address this gap, we introduce LIBERO-Industry, a novel benchmark built on the widely used robot learning benchmark LIBERO, that translates the aforementioned industrial constraints into controllable task conditions and measurable success criteria. Specifically, LIBERO-Industry comprises three classic task scenarios: Static-to-Dynamic (S2D) loading, Dynamic-to-Static (D2S) unloading, and Dynamic-to-Dynamic (D2D) transfer. The suites contain 216 tasks in total that systematically vary object geometry, conveyor speed, interaction-window duration, and geometric acceptance region size. Extensive experiments across five generalist robot policies (including vision-language-action models and world-action models) show that performance progressively degrades as industrial constraints are introduced and combined. Under a shared fine-tuning and evaluation protocol, the LIBERO-Industry co-training condition achieved higher observed target-transfer completion than the original-LIBERO condition.", "arxiv_id": "2610.16782", "arxiv_url": "https://arxiv.org/abs/2610.16782", "authors": ["Ming Shin Cindy Sung", "Duan Leijiahao", "Haoxiang Wang", "Boning Tan", "Liangna Fu", "Chao Tan", "Yafu Li", "Yulong Chen", "Chaoqun Wan", "Zhen Huang", "Shuxian Liang", "Xian-Sheng Hua"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/IAIE-PhysicalAI/LIBERO-Industry", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.16782", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Physical AI Group, Institute of AI for Engineering (IAIE), Tongji University", "pdf_url": "https://arxiv.org/pdf/2610.16782v2", "published_at": "2026-10-12", "score": 0.079, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.16782.png", "title": "LIBERO-Industry: Benchmarking Robotic Manipulation under Industrial Process Constraints", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "A guardrail classifier is reported as if unsafe were a property of text. It is not: it is a property of a policy, and the policy enters the model through its labels. We exploit an accident of an industrial deployment in which the same ~53k prompts were labelled twice, under two operational definitions (\"is this a request for harmful content?\" and \"would a moderator block this?\"), and used to train ten guardrail arms sharing architecture, codebase and optimiser family, at two model scales. First, the guardrail\u0027s own training corpus already contained the benchmarks: JailbreakBench-benign is 88% and OR-Bench-hard 82% present in the training pools, two over-refusal benchmarks, the kind a guardrail reports to argue it does not over-block. Everything below is decontaminated. Second, safety benchmarks stratify sharply by how much of their score is decided by the label definition rather than by the model: with architecture and optimiser fixed, the range across the ten arms is 0.99 on HarmBench-copyright and 0.043 on WildGuard-benign, a 23x spread. Third, a benchmark score can be moved across its entire range by 0.03% of the parameters. Across these arms HarmBench-copyright spans 0-100 and OR-Bench-hard over-refusal 3.4-56.4%, and the four arms whose last supervision signal carries a given policy occupy one extreme of both (exact rank p=0.005, or 0.04-0.14 at worst), at unchanged detection capability. For a distilled student the teacher\u0027s soft labels do this even when every hard label carries the other policy, so teacher provenance is an unrecorded confound in any released checkpoint. Fourth, validation accuracy on the one split that grades all twenty arms tracks agreement with the annotator\u0027s policy (rho=+0.74), not detection capability (rho=+0.34). We argue that guardrail evaluations should report contamination, a seed floor and the definition they were graded against as first-class variables.", "arxiv_id": "2610.25060", "arxiv_url": "https://arxiv.org/abs/2610.25060", "authors": ["Vahid Jebraeeli", "Jonathon Romero", "Yijin Wang", "Adrian Chan", "Jianbang Zhang"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25060", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25060v1", "published_at": "2026-10-18", "score": 0.064, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25060.png", "title": "Policy Is Not Capability: Some Safety Benchmarks Measure Which Definition of \"Unsafe\" You Trained On", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Coding agents keep working on runs that will fail verification, and asking a frontier model to watch for this is expensive in its own right. We introduce StopLoss, a small external monitor that learns failure recognition from completed trajectories and their verifier outcomes. The name is inspired by the stop-loss order in finance: StopLoss ends a run early when the run is likely to fail, which saves resources. Final outcomes label earlier local windows, so a fine-tuned language model can score the most recent tool steps in a single forward pass, and a threshold calibrated on successful runs turns that score into an abort decision without changing the executor. Trained on GPT-family SWE-rebench trajectories and evaluated on SWE-bench Verified and a SWE-bench Pro subset with GPT and Claude executors, StopLoss is compared against six general-purpose judges reading identical windows. Outcome supervision lifts failure prediction from near chance to a useful signal at the first check, at one to two orders of magnitude lower cost per check than any tested judge. This translates into savings: relative to completing every task, StopLoss lowers cost per retained solve by 4.5\\% on Verified while preserving 99\\% of successful runs, and by up to 31\\% on the costlier Pro subset, reaching 48\\% with a Qwen3-8B backbone, and in all four settings its cost per retained solve is below that of every judge policy. Outcome-trained small monitors can make failure recognition cheap enough for early stopping to pay for itself.", "arxiv_id": "2610.25525", "arxiv_url": "https://arxiv.org/abs/2610.25525", "authors": ["Jiarong Liang", "Xueguang Ma", "Dongfu Jiang", "Yuxuan Zhang", "Ping Nie", "Wenhu Chen"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/TIGER-AI-Lab/StopLoss", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25525", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25525v1", "published_at": "2026-10-18", "score": 0.064, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25525.png", "title": "StopLoss: Teaching Agents to Predict Failure and Stop Early", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "We ask how much an autoregressive transformer retains of its prompt after generating $t$ tokens. Consider two different prompts followed by the same continuation text, so that any difference in their hidden states comes from the prompt alone, and we find that the distance between their hidden states decays approximately as a power law $t^{-\u03b1}$, where $\u03b1=1$ is the rate at which a fixed prompt\u0027s share of uniform attention shrinks and smaller values mean longer memory. Trained models forget fast ($\u03b1\\approx0.55$--$0.7$), untrained ones slowly ($\u03b1\\approx0.2$--$0.5$). We prove that this offset is $O\\big(P(\\log t)^{L-1}/t\\big)$ for a prompt of length $P$ and depth $L$. The bound holds for finite-depth pre-LN softmax transformers with bounded attention logits, under one additional condition: the pre-norm activations stay away from zero. The mechanism is geometric: the prompt\u0027s direct influence is diluted as the context grows, and \\emph{relay} --- continuation tokens passing on what earlier tokens read from the prompt --- can only add logarithmic factors. This is what we call the \\emph{conditional no-hair theorem}: given the text generated so far, the prompt\u0027s influence on the next token vanishes as $t$ grows, so any property of the prompt that survives, such as its language, must be carried by the text itself. An exactly solvable linear relay model shows that the bound cannot be improved and reproduces the rise of the local exponent towards $1$ seen in untrained networks. Cancelling the dilution with a logit bias stops the decay early in training and reverses it after, so dilution is necessary for the forgetting we measure; untrained networks and the solvable model show it is also sufficient.", "arxiv_id": "2610.24133", "arxiv_url": "https://arxiv.org/abs/2610.24133", "authors": ["Shuyang Xiang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/ShuyangenFrance/no-hair-transformers", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.24133", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.24133v1", "published_at": "2026-10-16", "score": 0.061, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24133.png", "title": "A Conditional No-Hair Theorem for Transformers: How Language Models Forget Their Prompt", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Enterprise agents answer questions over workplace records that evolve through team collaboration. As information is shared, corrected, and revised across documents, chats, and figures, multiple versions of the same information accumulate in the workspace. Reliable question answering therefore requires agents to reason over sufficient evidence, resolve cross-source and temporal conflicts, and recognize when the available evidence is insufficient to establish an answer. To systematically evaluate these capabilities, we introduce MMEnterprise-Bench, a benchmark comprising 1,613 questions grounded in evolving multimodal records from simulated collaboration projects, covering three categories: Evidence Reasoning, Conflict Resolution, and Unanswerability. We evaluate 10 proprietary and open-source multimodal LLMs and find that even the strongest models struggle when evidence contains cross-source or temporal conflicts or spans multiple images. Moreover, increasing the retrieval budget or employing a larger retriever improves evidence recall but does not consistently translate into higher answer accuracy. These findings highlight the persistent challenges of reasoning over evolving workplace records and establish MMEnterprise-Bench as a testbed for developing more reliable enterprise agents. Code and data are available at https://mlvlab.github.io/MMEnterprise-Bench/.", "arxiv_id": "2610.27911", "arxiv_url": "https://arxiv.org/abs/2610.27911", "authors": ["Seohyun Lee", "Jongha Kim", "Dohwan Ko", "Ji Soo Lee", "Seoung Choi", "Jayun Ku", "Hyunwoo J. Kim"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/mlvlab/MMEnterprise-Bench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.27911", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27911v1", "published_at": "2026-10-20", "score": 0.057, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.27911.png", "title": "MMEnterprise-Bench: Evaluating Enterprise Agents over Evolving Multimodal Records", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Recent works show that LLMs can generate kernels with strong performance on server GPUs. Edge deployment presents distinct challenges because the hardware is heterogeneous, the software stacks are fragmented, and the resource budgets are tight. LLM kernel generation across diverse edge backends has yet to be studied systematically. We introduce EdgeKernelBench, which combines a unified IR deployment framework with a hierarchical benchmark for edge workloads. The unified IR captures reusable computation, scheduling, and memory decisions and connects to each target backend through a compiler interface. The benchmark spans progressively larger program scopes, from individual operators to compact model graphs, across representative edge application domains. We instantiate the design with TVM as a reference compiler and validate it across heterogeneous edge backends. With a single generation attempt, the best model achieves 64.5% Correct@1 but only 25.5% Fast@1.0. This gap shows that functional correctness does not consistently translate into performance gains. We therefore introduce the Layered Edge Kernel Agent (LEKA), which organizes optimization through a layered IR. On the agent evaluation subset, LEKA achieves 43.5% Fast@1.0, compared with 13.0% for direct generation and 26.1% for Claude Code. LEKA and Claude Code use the same base model and optimization budget. Together, EdgeKernelBench and LEKA support unified evaluation and layered optimization of kernels generated by LLMs across edge backends.", "arxiv_id": "2610.24648", "arxiv_url": "https://arxiv.org/abs/2610.24648", "authors": ["Yuhua Zheng", "Xueyi Chen", "Xinze Zou", "Xin Li", "Haoji Hu", "Huan Wang"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/pillor9/EdgeKernelBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.24648", "impact_score"
