  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }
  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }
  .stats b { color:var(--fg); }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }

  .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; line-height:1; color:var(--muted); cursor:pointer; }

<script>
const PAPERS = [{"abstract": "Recent advances in multimodal large language models (MLLMs) have enabled them to act as autonomous agents, creating and editing 3D models via code or direct software manipulation. In practical workflows, these models must infer object shapes, materials, spatial layouts, and lighting from diverse references while strictly following instructions to reconstruct, modify, or design 3D content. However, existing benchmarks provide limited coverage of such open-ended requests across real-world scenarios. To bridge this gap, we introduce BlenderWorld, the first comprehensive benchmark dedicated to evaluating frontier models on realistic 3D creation tasks. BlenderWorld comprises 223 tasks spanning architecture, products, natural environments, and scientific visualization, driven by text, image, video, and structured specification inputs. To rigorously assess these complex deliverables, we establish a unified evaluation protocol: we render the submitted Blender projects from multiple viewpoints and evaluate them against 2,651 task-specific binary rubrics alongside holistic visual quality scores. Benchmarking thirteen frontier models reveals that GPT-6-Astra achieves the highest overall fused score of 79.9, followed by Opus-5 (73.0) and GPT-5.6-Sol (67.7). Ultimately, our findings reveal a critical bottleneck: while current models can parse broad instructions, they still profoundly struggle with fine-grained 3D spatial coherence and accurate structural reproduction in Blender, leaving substantial headroom for future 3D-native agentics.", "arxiv_id": "2610.23986", "arxiv_url": "https://arxiv.org/abs/2610.23986", "authors": ["Xinyu Fang", "Yuchi Wang", "Weihao Yu", "Rongyao Fang", "Zhaohai Li", "Zhixun Li", "Tiancheng Gu", "Xilin Wei", "Yuhang Zang", "Hongsheng Li", "Dahua Lin", "Guofeng Zhang", "Shuai Bai", "Zhibo Yang", "Dayiheng Liu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/QwenLM/BlenderWorld", "github_stars": 172, "hf_url": "https://huggingface.co/papers/2610.23986", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2610.23986v1", "published_at": "2026-10-14", "score": 0.596, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (22\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.23986.png", "title": "BlenderWorld: Benchmarking Visual Agents for 3D Creation from Real-World References", "tldr": null, "upvotes": 22, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) have made rapid progress on visual reasoning, yet many tasks require evidence that is difficult to obtain through internal reasoning alone: our controlled study on 22 benchmarks shows that simply increasing the inference budget of the base model yields only modest gains. Such tasks demand grounded perception, external knowledge, and numerical measurements obtained through heterogeneous tools, whose outputs must be made interpretable to the model and retained across reasoning steps. We introduce OpenVLHarness, a multimodal reasoning harness organized around a capability layer and persistent multimodal memory. The capability layer combines task-level tool interfaces with evidence rendering, providing consistent access to heterogeneous backends and converting their outputs into model-readable observations. Persistent multimodal memory retains the corresponding images, structured data, and web references as addressable artifacts throughout each query. A coding interface executes generated programs over stored data, enabling computations that combine results from multiple tools. Together, these mechanisms support an iterative process of acquiring, inspecting, and composing multimodal evidence. Evaluated on 22 benchmarks with eight open and proprietary backbones, OpenVLHarness improves average scores by 9.7-12.6 points over matched no-tool baselines, including +11.2 with Qwen3-VL-8B, +9.7 with Kimi K3, and +9.9 with GPT-6 Astra. With GPT-6 Luna at medium reasoning effort, OpenVLHarness outperforms the base model, Codex, and Visual Sketchpad at maximum effort by 7.7-8.5 points while incurring at most 37% of their model-token cost.", "arxiv_id": "2610.26860", "arxiv_url": "https://arxiv.org/abs/2610.26860", "authors": ["Yu Zhou", "Cheng-Fu Yang", "Rui Sun", "Di Wu", "Sibo Peng", "Mingyang Zhang", "Zhen Yang", "Ruiyi Zhang", "Nanyun Peng", "Zhe Gan", "Kai-Wei Chang"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.CV", "cs.LG", "cs.MM"], "github_repo": "https://github.com/uclanlp/OpenVLHarness", "github_stars": 50, "hf_url": "https://huggingface.co/papers/2610.26860", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Apple", "pdf_url": "https://arxiv.org/pdf/2610.26860v1", "published_at": "2026-10-19", "score": 0.52, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Apple", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (97\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26860.png", "title": "OpenVLHarness: Real World Visual Agentic Tool-Use with Multimodal Memory", "tldr": null, "upvotes": 97, "what_it_is": null, "why_notable": null}, {"abstract": "Can large language model (LLM) agents deliver expert-level operations research (OR) solutions directly from original client materials, without prior expert reformulation? Existing OR benchmarks typically begin with self-contained descriptions or predefined optimization tasks, underrepresenting the translation of original business materials into professionally validated solutions. We introduce OR-License, an end-to-end benchmark of 31 instances across 10 industrial scenarios from paid OR engagements totaling USD 3.68 million. It preserves original requirements, input data, deliverable formats, and information boundaries after de-identification. To study information acquisition, we introduce ORSim, a controlled client simulator that discloses business facts without supplying OR expertise. Hidden evaluation checks feasibility and compares objective quality against original expert solutions accepted by clients before benchmark construction. Deployment-Adjusted Quality (DAQ) averages expert-relative quality across instances, assigning zero to infeasible deliveries. Across 11 frontier LLMs using coding-agent harnesses, several exceed the expert reference in conditional objective quality, but none matches its DAQ; the strongest primary Claude Code configuration achieves 88.39% strict feasibility and a DAQ of 0.87 against the expert reference of 1. Client information acquisition extends beyond clarification into solution development and validation, with some later stages showing higher confirmed issue-resolution proportions. Trajectory analysis identifies formulation and implementation failures, while task-equalized research-chain completion rates range from 24% to 45% across models on evaluable tasks. These findings motivate sustained information-gap resolution, faithful problem formulation, and evidence-linked self-improvement for reliable long-horizon agents.", "arxiv_id": "2610.24087", "arxiv_url": "https://arxiv.org/abs/2610.24087", "authors": ["Peisong Wang", "Feixue Liu", "Yize Meng", "Bowen Liu", "Ruoyu Chen", "Gaoyang Dai", "Xing He", "Aiqian Li", "Fengchi Yuan", "Aochuan Chen", "Chenyi Zi", "Yuhan Li", "Hongchuan Zeng", "Yimo Yan", "Nuo Chen", "Jie Fu", "Zuo-Jun Max Shen", "Yong-Hong KUO", "Jia Li"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/NineAbyss/OR-License", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.24087", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Data Science \u0026 Artificial Intelligence Lab at HKUST", "pdf_url": "https://arxiv.org/pdf/2610.24087v1", "published_at": "2026-10-16", "score": 0.51, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (196\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24087.png", "title": "OR-License: Evaluating LLM Agents as Real-World Operations Research Practitioners", "tldr": null, "upvotes": 196, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Model (LLM) agents are increasingly deployed in unfamiliar and evolving environments, requiring them to proactively explore, understand, and adapt to environmental dynamics. However, existing benchmarks rarely test whether agents can proactively discover how an environment works and adapt as it evolves. To address this gap, we introduce AdaExploreBench, a benchmark for proactive exploration and test-time adaptation in evolving environments. By instantiating environmental dynamics as hidden rules, AdaExploreBench requires agents to actively acquire evidence and infer the rules. Under implicit rule drift, the latent rule changes without announcement, requiring agents to detect from degraded performance that prior knowledge is stale and re-explore. Experiments on eight leading LLMs show that proactive and adaptive exploration remain challenging: GPT-6 Sol achieves only 61.9% calibrated accuracy, while providing sufficient evidence or removing rule drift improves average performance significantly by close to 10%. These results reveal a critical bottleneck in current LLM agents: they can often reason effectively from informative evidence once it is available, but struggle to actively acquire the right evidence and recognize when previously acquired evidence is no longer valid.", "arxiv_id": "2610.25950", "arxiv_url": "https://arxiv.org/abs/2610.25950", "authors": ["Rui Wang", "Zishen Lai", "Jiayu Liu", "Cheng Qian", "Jeonghwan Kim", "Heng Wang", "Xuejun Zhang", "Jiateng Liu", "Bingxuan Li", "Shujin Wu", "Qing Zong", "Tianshi Zheng", "Chunyang Li", "Qihan Lin", "Chen Li", "Dadi Guo", "Xiusi Chen", "Yangqiu Song"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/HKUST-KnowComp/AdaExploreBench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.25950", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "HKUST", "pdf_url": "https://arxiv.org/pdf/2610.25950v1", "published_at": "2026-10-19", "score": 0.456, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (27\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25950.png", "title": "AdaExploreBench: Benchmarking LLM Agents for Proactive Exploration and Test-time Adaptation in Evolving Environments", "tldr": null, "upvotes": 27, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents have shown promising potential in coding tasks, and their performance is jointly determined by the policy model and the harness that mediates their interaction with the environment. Indeed, harness and policy are mutually reinforcing and evolving only one component is suboptimal---a harness tuned for one checkpoint may not target the failure modes of an updated policy, while policy learning remains limited to the trajectories elicited by a fixed harness. In light of this, we propose Self-HPO, a recursive self-improving framework for coding agents that alternates harness and policy optimization, using the evolving policy as its own harness proposer. Specifically, in each round, the current policy first analyzes its own failures and proposes new harness candidates (H-step). The policy is then updated through reinforcement learning (RL) under the selected harness (P-step), and hard tasks identified during training form the next harness search set, keeping harness optimization targeted to the policy\u0027s evolving failure modes. Across three coding benchmarks, Self-HPO consistently outperforms harness-only and policy-only baselines, improving Qwen3.5-35B-A3B\u0027s average resolve rate from 57.8% to 64.8%, with gains generalizing to out-of-distribution settings. Further analysis shows that both optimized components retain gains even when paired with their base counterparts, while their joint gain exceeds the sum of their individual gains. Self-HPO also improves reliability (Pass@1) and expands the capability frontier (Pass@k) over the base agent. Additionally, we show that with a stronger external model (e.g., Opus 4.8) as the harness proposer, the same framework yields a further performance boost.", "arxiv_id": "2610.22791", "arxiv_url": "https://arxiv.org/abs/2610.22791", "authors": ["Zhepei Wei", "Wenlin Yao", "Baolin Peng", "Danqing Wang", "Qianhui Wu", "Hao Cheng", "Yu Meng", "Jianfeng Gao"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/MSR-Orchard/Self-HPO", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2610.22791", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2610.22791v1", "published_at": "2026-10-16", "score": 0.373, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (43\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22791.png", "title": "Self-Evolving Coding Agents via Harness-Policy Optimization", "tldr": null, "upvotes": 43, "what_it_is": null, "why_notable": null}, {"abstract": "Memory-native evolution requires making memory an intrinsic capability of foundation models, enabling them to continuously accumulate and utilize information. To this end, we introduce MemT-1.0, a new architecture of memory foundation models that internalize memory as part of model computation. Building on Metis, MemT-1.0 employs Gated DeltaNet-2 with a stable token-level memory update mechanism within each turn. We further introduce Mixture-of-Storage to scale native memory capacity. Following a deliberate backbone preparation, we develop a two-stage training pipeline consisting of continued pre-training and post-training, supported by 34B tokens of training data and efficient training and inference infrastructure. We release a model family comprising MemT-1.0-Nano and MemT-1.0-Flash, and conduct a comprehensive evaluation of memory and general capabilities. The results show that they outperform the parametric memory baselines on average and remain competitive with retrieval-augmented methods, while largely preserving general capabilities. At a history length of 128K tokens, MemT-1.0-Nano achieves approximately $1.86\\times$ end-to-end inference speedup and a $66\\times$ reduction in persistent storage relative to full context KV cache. By internalizing retrieved procedural experience, MemT-1.0 improves task success on agentic tasks, providing a practical step toward memory-native evolution.", "arxiv_id": "2610.26825", "arxiv_url": "https://arxiv.org/abs/2610.26825", "authors": ["Zhiyu Li", "Zeyu Zhang", "Linyun Liu", "Yiwei Bu", "Chenyang Xi", "Xichong Zhang", "Yi Yu", "Yu Yu", "Zhichen Liu", "Yuxiao Yi", "Chunyu Li", "Haoran Liu", "Zhenkai Ding", "Le Zhou", "Juncheng Zhang", "Boyu Chen", "Zehao Lin", "Guorui Li", "Renyu Fu", "Ji Li", "Youyang Xia", "Jiajun Shen", "Harvey Li", "Jingsong Zhou", "Helan Hu", "Tong Shen", "Tianxiao Xu", "Chenye Han", "Weijie Li", "Zhongquan Zhou", "Hongming Xu", "Yuekeng Li", "Erenkai Zhu", "Peng Yu", "Wenhao Li", "Jingyi Kang", "Xixuan Hao", "Xuzhou Zhu", "Can Chen", "Jiawei Liu", "Chen Jiang", "Tao Jiang", "Fangwei Xiang", "Zepeng Yao", "Kai Chen", "Guang Yang", "Mingfei Lu", "Chunhui Li", "Zhengxuan Jiang", "Bo Tang", "Shiyu Zhan", "Yihang Sun", "Jie Chu", "Wenjun Xiong", "Zhenxiang Hua", "Chen Lin", "Detong Su", "Dongyu Deng", "Qiuping Ding", "Guofeng Ding", "Si Chen", "Guohua Wen", "Xu Chen", "Zhi-Qin John Xu", "Ying-Cong Chen", "Ningyu Zhang", "Haofen Wang", "Muning Wen", "Haotian Chen", "Wentao Zhang", "Xuanhe Zhou", "Rita Zhang", "Junchi Yan", "Feiyu Xiong"], "brief": "", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/MemTensor/MemT-1.0", "github_stars": 192, "hf_url": "https://huggingface.co/papers/2610.26825", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "MemTensor", "pdf_url": "https://arxiv.org/pdf/2610.26825v2", "published_at": "2026-10-19", "score": 0.327, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (109\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26825.png", "title": "MemT-1.0: Towards Memory-Native Evolution", "tldr": null, "upvotes": 109, "what_it_is": null, "why_notable": null}, {"abstract": "An effective visual tokenizer must preserve image fidelity while producing latents that downstream diffusion models can learn efficiently. Prior work improves latent diffusability through semantic alignment or joint tokenizer--diffusion training. Revisiting REPA-E, a representative approach, we find that removing its diffusion objective and dedicated generative blocks while retaining semantic prediction from corrupted latents yields comparable downstream generation performance under a matched setting. This observation motivates a general principle of robust prediction: generation-relevant information should remain recoverable from corrupted latents. We instantiate this principle with two complementary objectives. RobustAlign predicts pretrained semantic features from corrupted latents to preserve high-level structure, while RobustRecon reconstructs the clean image to retain fine-grained spatial and appearance information. Together, they form Robust Alignment and Reconstruction VAE (RoAR-VAE). Our analysis suggests that robust prediction improves diffusability by making useful information more accessible in high-variance latent directions, which diffusion models tend to learn earlier. Empirically, RoAR-VAE improves average generation benchmark performance by 2.19 points over the strongest baseline tokenizer under the same training budget, while improving small-text reconstruction accuracy by 16.93 percentage points over FLUX.1-VAE. These results demonstrate that RoAR-VAE achieves a favorable balance between reconstruction fidelity and downstream generative learnability.", "arxiv_id": "2610.26216", "arxiv_url": "https://arxiv.org/abs/2610.26216", "authors": ["Yang Yue", "Fangyun Wei", "Yitong Wang", "Jinjing Zhao", "Henry Zheng", "Dong Chen", "Gao Huang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/LeapLabTHU/RoAR-VAE", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2610.26216", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tsinghua-LeapLab", "pdf_url": "https://arxiv.org/pdf/2610.26216v1", "published_at": "2026-10-19", "score": 0.321, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (26\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26216.png", "title": "RoAR-VAE: Improving Latent Diffusability through Robust Prediction", "tldr": null, "upvotes": 26, "what_it_is": null, "why_notable": null}, {"abstract": "Video overlay removal aims to recover scenes obscured by subtitles, titles, and logos while preserving surrounding content. Existing methods use temporal propagation or source-conditioned generation, but can leave residual overlays and distort scene structure when useful source information is obscured. We propose DeOverlay, a source-anchored flow model that reconstructs the clean video from the source latent with fixed source guidance. Specifically, we train a shared velocity network along paired source-to-clean paths using region-weighted flow matching, enabling successive cor- rections from intermediate states. To select local source cues, we develop visibility-normalized temporal aggregation that excludes masked positions and averages the remaining observations. Global source context and edit-region embeddings complement these cues through additive condi- tioning, retaining a single video-token sequence. To evaluate scene recovery across diverse overlay conditions, we introduce DVTE-Bench, comprising 1,631 paired videos across eight text-overlay categories, with OCR-screened clean targets, frame-aligned pixel masks, and a common evaluation protocol. Experiments on the complete release show that DeOverlay outperforms four baselines on all five reconstruction and perceptual metrics, reducing Mask LPIPS and Mask VFID by 58.3% and 70.3%, respectively, relative to the strongest evaluated baseline. Additional qualitative examples demonstrate the removal of graphic logos and stickers. We will make the complete benchmark, evaluation code, and test outputs availabl. Project page:https://yahooo-m.github.io/DVTE-Bench/", "arxiv_id": "2610.26081", "arxiv_url": "https://arxiv.org/abs/2610.26081", "authors": ["Deshui Miao", "Yuhang Ma", "Shaoyong Jia", "Wenzhao Gao", "Yue Zhang", "Shaohui Jiao", "Xin Li"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.26081", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2610.26081v1", "published_at": "2026-10-19", "score": 0.313, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26081.png", "title": "DeOverlay: A Benchmark and Source-Anchored Flow for Video Overlay Removal", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Existing world models can generate action-conditioned video from a single image. Many focus on camera movement, allowing users to explore the generated scene. However, navigation alone does not ensure that an action follows persistent rules when its outcome depends on state that is invisible in the current frame. We present Stateful Harness, a framework that separates world evolution from video rendering to support stateful and rule-governed interaction. It maintains an evolving world state under specified rules, renders each resulting event with a frozen video model, and uses the generated clip to update the world state for the next turn. At each turn, the harness resolves the action selected by the user and compiles the resulting event into an instruction, while a preview clip from an editable 3D scene provides spatial and camera guidance. To evaluate rule compliance, we build WorldState-Bench, a benchmark of 50 counterfactual twin pairs that share an initial frame and action but differ in hidden state and required outcome. Under rule-only prompting, the best of the 11 evaluated video backends produces the required endings for both cases in 32% of pairs. For MiniMax-H3, specifying the required endings raises this rate from 32% to 64%, while the full harness reaches 92% with the same frozen model. These results support separating rule execution from video rendering for world interactions with hidden state.", "arxiv_id": "2610.26811", "arxiv_url": "https://arxiv.org/abs/2610.26811", "authors": ["Chan Yan Ki", "Yanran Zhang", "Wenzhao Zheng", "Xiaofeng Wang", "Zheng Zhu", "Lei Chen", "Jie Zhou", "Jiwen Lu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Zhangyr2022/StateWorldModel", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2610.26811", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Tsinghua-IVG", "pdf_url": "https://arxiv.org/pdf/2610.26811v1", "published_at": "2026-10-19", "score": 0.309, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26811.png", "title": "State World Models: Execute the Rules, Generate the Pixels", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding accelerates large language model inference through parallel verification of tokens proposed by a drafter. Diffusion drafters further parallelize proposal generation, but greater proposal capacity or higher mean accepted tokens (MAT) need not yield higher throughput. Because verification accepts only a consecutive prefix, early rejections can render later correct predictions ineffective, limiting MAT gains, while even higher MAT may not improve throughput if per-round latency increases. We introduce DScout, which uses two complementary factorizations to guide diffusion drafter training and inference for higher throughput. For training, DScout factorizes position-wise loss into inclusion, weighting, and prediction loss. This guides the design and combination of mixed-horizon training, intra-block unmasking, and acceptance-weighted loss to align supervision with prefix acceptance and improve MAT. For inference, DScout factorizes throughput as the ratio of MAT to per-round latency, guiding target-conditioning depth, drafter depth, and inference block size selection to identify a high-throughput configuration for each workload. Across six benchmarks, DScout achieves $3.84\\times$ and $4.14\\times$ mean speedups over autoregressive decoding on Qwen3-4B and Qwen3-8B, respectively, improving mean speedup over the state-of-the-art baseline by 9.1% and 7.1%. Across models and concurrency settings, our inference configuration policy provides up to 9.75% additional mean speedup over DScout\u0027s fixed configuration.", "arxiv_id": "2610.23935", "arxiv_url": "https://arxiv.org/abs/2610.23935", "authors": ["Jiakun Fan", "Min Xiao", "Qiang Wang", "Neiwen Ling", "Zhichao Liu", "Zhihao Jia", "Dimitrios S. Nikolopoulos", "Zijun Wei"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.23935", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2610.23935v1", "published_at": "2026-10-07", "score": 0.302, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.23935.png", "title": "Factorization-Guided Training and Inference for Diffusion-Drafted Speculative Decoding", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Many modern language models have adopted hybrid architectures that incorporate both linear-time recurrence and softmax attention. Modern recurrence layers provide a highly expressive mixing mechanism while ensuring high throughput by compressing contextual information into a fixed-size state, but underperform softmax attention in contextual information retrieval. In this paper, we reveal a Competing Learning phenomenon where different kinds of mixers compete to learn the same function, and when any layer learns a function, it suppresses the corresponding learning signal for other layers. Layer attribution analysis reveals that under typical data distributions, modern recurrence learns retrieval functions faster than softmax attention, causing attention to fail to learn retrieval in most cases. Stopping weight updates in recurrence in the middle of training helps attention learn retrieval. Based on these results, we propose a staged training procedure for pre-training hybrid architectures on natural language. Empirical results on models up to 1B parameters show that our method results in substantial improvement in language modeling loss, common-sense reasoning, as well as a wide range of retrieval-related tasks across different context lengths.", "arxiv_id": "2610.26830", "arxiv_url": "https://arxiv.org/abs/2610.26830", "authors": ["Xingyu Shen", "Yingfa Chen", "Ziqing Qiao", "Chaojun Xiao", "Xu Han", "Zhiyuan Liu"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/thunlp/competing-learning", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.26830", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Tsinghua NLP Group", "pdf_url": "https://arxiv.org/pdf/2610.26830v1", "published_at": "2026-10-19", "score": 0.287, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26830.png", "title": "Competing Learning in Hybrid Architectures", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Existing Multi-token prediction (MTP) methods are auxiliary by design: the multi-horizon loss mostly trains modules attached to the backbone, and each added horizon costs another module and another pass. We propose Efficient Causal Self-Recursion (ECHO), which removes both costs. The backbone\u0027s own final layer predicts every horizon, so the supervision lands on the parameters that generate the next token, and Dynamic Depth Sampling (DDS) keeps deeper horizons affordable by drawing the training depth with probabilities that decay along depth. Future prediction thus becomes part of the autoregressive objective rather than a task attached to it, and the gains follow on both sides of it. In pretraining, added depth converts into downstream accuracy where auxiliary modules saturate, concentrating on reasoning and code at half the MTP training overhead of training every depth. At inference, the pretrained model is its own drafter: it drafts beyond the depth it was trained for, and keeps its draft-target alignment on the open-ended, high-entropy generation where post-hoc drafters lose theirs. The advantage survives a doubled token budget, a repeated pretraining run, and supervised finetuning.", "arxiv_id": "2610.24766", "arxiv_url": "https://arxiv.org/abs/2610.24766", "authors": ["Yuxuan Zhou", "Junyuan Shang", "Tianyu Wang", "Chunrui Zheng", "Zichang Liu", "Wenbin Chang", "Shuohuan Wang", "Dianhai Yu"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/ernie-research/ECHO", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2610.24766", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ernie-research", "pdf_url": "https://arxiv.org/pdf/2610.24766v1", "published_at": "2026-10-17", "score": 0.287, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Baidu", "HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24766.png", "title": "ECHO: Efficient Causal Self-Recursion Beyond Auxiliary Multi-Token Prediction", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Modern text-to-image (T2I) systems use internet-scale language pretraining for text-conditioned image generation. We ask whether language pretraining is necessary for strong T2I generation. We introduce Halcyon, a family of early-fusion multimodal autoregressive models pretrained entirely from scratch on GPIC, a dataset of 100M image-text pairs. Halcyon-0.52B outperforms LlamaGen-XL/8 (48.0 vs. 63.3 gFD) with 18.2$\\times$ less pretraining compute. Further, Halcyon-1.6B outperforms JiT-T2I-XXL/8++ (35.3 vs. 41.0 gFD) with 275$\\times$ less pretraining compute. Controlled experiments show that text-only pretraining does not improve T2I generation. Halcyon also learns image captioning by replacing caption dropout with I2T supervision, maintaining competitive T2I generation quality under the same pretraining budget. We show that strong T2I systems can be trained from scratch without internet-scale language pretraining. Code and models are available at https://cs.stanford.edu/~keshik/halcyon", "arxiv_id": "2610.26863", "arxiv_url": "https://arxiv.org/abs/2610.26863", "authors": ["Keshigeyan Chandrasegaran", "Yue Zhao", "Armin W. Thomas", "Ehsan Adeli", "Jiajun Wu", "Juan Carlos Niebles", "Li Fei-Fei", "Michael Poli"], "brief": "", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.26863", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2610.26863v2", "published_at": "2026-10-19", "score": 0.283, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26863.png", "title": "Text-to-Image Generative Modeling Without Language Pretraining", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Adapting existing manga into coherent animation that stays faithful to the source is a valuable yet challenging task. Existing methods either access the manga mainly through text, losing its characters and art style, or feed manga pages directly into video generation models, which misinterpret the manga\u0027s structure and produce incorrect storylines. In this paper, we propose Manga2Animate, a multi-agent framework that grounds every stage of generation in the source manga. We decompose the task into two intermediate representations, an animation script and a visual storyboard. Each representation is produced by a creator agent and reviewed against the source panels by a paired reviewer agent. We tailor representation-specific selection and dual-level feedback to progressively refine both before synthesizing the final animation. Extensive experiments and a user study demonstrate that Manga2Animate produces animations more faithful to the source manga and more consistent across shots than state-of-the-art approaches. Project page: https://annchenn.github.io/Manga2Animate/", "arxiv_id": "2610.26851", "arxiv_url": "https://arxiv.org/abs/2610.26851", "authors": ["Sheng-Wei Zhang", "Hsi-An Chen", "Yan-Ting Liou", "Chih-Hsuan Chen", "Shih-Chen Tseng", "Yu-Lun Liu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/annchenn/Manga2Animate", "github_stars": 27, "hf_url": "https://huggingface.co/papers/2610.26851", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "National Yang Ming Chiao Tung University", "pdf_url": "https://arxiv.org/pdf/2610.26851v1", "published_at": "2026-10-19", "score": 0.27, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26851.png", "title": "Manga2Animate: An Agentic Framework for Faithful Manga Animation with Script and Storyboard Planning", "tldr": null, "upvotes": 24, "what_it_is": null, "why_notable": null}, {"abstract": "Memory has become integral to the LLM agent ecosystem, supporting information retention and reuse across interactions. However, most existing agent memory systems construct memory in a query-agnostic manner, which can incur unnecessary preprocessing cost and discard details that later prove essential. Recent studies have begun shifting memory processing toward runtime adaptation, but typically specialize in particular operations or fixed processing schemes, leaving flexible control over performance, cost, and latency largely underexplored. To address this challenge, we present \\textbf{MemPilot}, a flexible framework that orchestrates on-demand memory curation under different performance--cost--latency preferences. Specifically, we optimize a multi-step LLM policy via reinforcement learning to iteratively choose between retrieving from query-agnostic memory and delegating query-specific curation of raw multimodal history to heterogeneous LLMs and VLMs. The policy jointly controls evidence amount, curation instructions, model selection, and visual access, enabling fine-grained allocation of runtime computation. To optimize this policy under competing objectives, we adapt objective-wise advantage decoupling by separately estimating each objective\u0027s advantage before aggregation. Moreover, we introduce prefix-based marginal utility estimation for fine-grained credit assignment across multi-step rollouts. Experiments on five multimodal agent-memory benchmarks demonstrate favorable performance--cost--latency trade-offs across optimization preferences, with preference sweeps yielding broader frontiers than existing trade-off-aware baselines.", "arxiv_id": "2610.06830", "arxiv_url": "https://arxiv.org/abs/2610.06830", "authors": ["Haozhen Zhang", "Haodong Yue", "Quanyu Long", "Jianzhu Bao", "Qingyuan Liu", "Tao Feng", "Bohan Liu", "Weida Liang", "Wenya Wang"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/ViktorAxelsen/MemPilot", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2610.06830", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2610.06830v1", "published_at": "2026-10-05", "score": 0.26, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (26\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06830.png", "title": "MemPilot: Orchestrating On-Demand Multimodal Memory Curation for LLM Agents", "tldr": null, "upvotes": 26, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon, semi-verifiable agentic tasks often rely on rubric-based evaluation, but the evidence needed to assess these tasks can be spread across the environment state and the execution trace. A judge may overlook this evidence or accept unsupported claims, including an agent\u0027s own reports of success. When rubric verdicts serve as reinforcement-learning rewards, such errors can reinforce undesirable behavior. We introduce Sauron, an evidence-first agentic verifier that investigates both state and trace and relies on a claim only after independently validating it against its source. Bounded queries and joint investigation of related criteria reduce context use and redundant work, and each verdict carries an auditable receipt of its supporting evidence. Across 2,586 human-labeled criteria from 100 personal-assistant episodes, Sauron achieves the highest F1 of five verifiers on all eight backbones tested while costing less than Gandalf, the strongest baseline. With GPT-5.6 Sol, it reaches 0.96 F1 versus Gandalf\u0027s 0.92 at 23% lower cost, with a wider margin on process criteria. On a paired fault-injection suite covering 13 families, several of which simulate reward hacking, Sauron detects 97% of injected failures while flagging only 2% of clean controls, outperforming baselines even when they are given the full trace. On TRAIL, a benchmark for detecting and localizing real agent errors, Sauron leads both Gandalf and TRAIL\u0027s own judge on all three quality metrics.", "arxiv_id": "2610.17724", "arxiv_url": "https://arxiv.org/abs/2610.17724", "authors": ["Reza Sanayei", "Razvan-Gabriel Dumitru", "Sunjie Hou", "MohammadHossein Rezaei", "Haris Riaz", "Robert Vacareanu", "Minglai Yang", "Ying Liu", "Mihai Surdeanu", "Daniel Yue Zhang"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/rsanayei/Sauron", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.17724", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Scale AI", "pdf_url": "https://arxiv.org/pdf/2610.17724v1", "published_at": "2026-10-13", "score": 0.231, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17724.png", "title": "Evidence-First Agentic Verification", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "Graphical User Interface (GUI) agents increasingly act over streaming omni-modal observations spanning screenshots, audio, video, interaction history, and device states. However, exposing this complete context uniformly at every step ignores that relevance is transient and sparse: the signal determining one action can become clutter at the next. Because executed actions feed back into the context, these errors compound into Sequential Distraction, driving the agent into irreversible trajectory drift. We formulate the underlying requirement as Focused Perception: a representation that is step-adaptive, action-sufficient, and non-intrusive. We realize this in FocusGUI, a lightweight adapter that dynamically prioritizes multimodal channels against a step-specific decision reference. Instead of uniformly processing all inputs, it compresses the most relevant evidence into a compact latent and subtly injects it into the frozen decoder\u0027s embeddings, guiding the model\u0027s attention without altering its native parameter space. FocusGUI trains from action supervision alone, requiring neither modality-relevance labels nor backbone fine-tuning. Across four omni-modal backbones, it raises overall Type Match by +33.2 and Exact Match by 3.0 times over the frozen backbone on average, and Type Match by +30.1 over the strongest existing enhancement method.", "arxiv_id": "2610.26203", "arxiv_url": "https://arxiv.org/abs/2610.26203", "authors": ["Fuyao Zhang", "Wenwen He", "Jiaming Zhang", "Yurong Hao", "Xuan Wang", "Guowei Guan", "Che Wang", "Longtao Huang", "Wei Yang Bryan Lim"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/fyzhang1/FocusGUI", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.26203", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2610.26203v1", "published_at": "2026-10-19", "score": 0.228, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26203.png", "title": "Focused Omni-Modal GUI Agents", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "LLM routing aims to select a capable model at low cost, but specialized routers can require updates as models and tasks change. We propose COMPASS, an agentic router in which an LLM follows a routing recipe, gathers performance and cost evidence through tools, and optionally inspects candidate answers before selecting a model. Our evaluations on LLMRouterBench and DeepSWE show that agentic routing can improve accuracy and lower model-call cost relative to specialized and trained routing baselines, without routing-specific training. On LLMRouterBench, COMPASS reaches 69.85% accuracy at \\$139.57, compared with RLCascadeRouter\u0027s 69.14% at \\$180.22. On DeepSWE under fixed five-fold cross-validation, it reaches 78.1% at \\$215, compared with 74.1% at \\$500 for the best single model. COMPASS also supports routing across benchmarks and adapts to an expanded model pool by reading new evaluation records, without changing the router\u0027s weights or prompt.", "arxiv_id": "2610.27822", "arxiv_url": "https://arxiv.org/abs/2610.27822", "authors": ["Amin Rezaei", "Pouya Parsa"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27822", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27822v1", "published_at": "2026-10-20", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "COMPASS: Routing via Capability-Oriented Model Profiling with Adaptive Search, Selection, and Tool Use", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "6G will be designed faster than it can be built: AI-driven search already proposes physical-layer algorithms at machine speed, while carrying a single one onto embedded baseband silicon remains specialist work. That silicon imposes hard memory and numeric limits, but also exposes cost structures a GPU lacks, and a design flow that never runs on the target sees neither. We present an agentic workflow in which an LLM coding agent implements algorithms on a commercial baseband SoC, optimizes them down to agent-written vector assembly, and validates them on silicon. The agent is guided by a knowledge base of measured platform facts, checked at every step against evaluators it is instructed never to edit, and metered per phase. We showcase the workflow on an AI-discovered orthogonal time frequency space (OTFS) detector portfolio on the open 6G4All platform. It yields twelve kernels that run cycle-exactly on silicon, their optimized versions at 18k-405k cycles (30-660 $\u03bc$s) per frame. It also yields a new detector shaped by the chip\u0027s measured costs that needs 13.9% fewer cycles than the port of the discovered detector while matching its error rate, with a measured edge our evaluation cannot statistically resolve, a structure that a hardware-blind search objective had no reason to find. What is not specific to OTFS is the workflow: an LLM agent exploring an implementation space under real hardware limits, with the cost of every choice measured rather than assumed.", "arxiv_id": "2610.27797", "arxiv_url": "https://arxiv.org/abs/2610.27797", "authors": ["Eric Mittag", "Lukas Brechtel", "Maximilian Stark", "Hans D. Schotten"], "brief": "", "categories": ["cs.AI", "cs.NI", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27797", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27797v1", "published_at": "2026-10-20", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Toward Agentic AI for the 6G Physical Layer: From Algorithm Discovery to Verified Baseband Silicon", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-using LLM agents increasingly answer e-commerce queries through multi-step tool interactions. The expected output of a tool call can shift between agent development and execution, allowing a plausible but incorrect value to be returned without an explicit failure signal. These silent errors may propagate through subsequent decisions into final answers. To study agents\u0027 resilience across this end-to-end process, we formulate Silent-error Resilience Task, an interactive task that evaluates whether they complete the original query after a silent error corrupts an intermediate state. We introduce RITE, a benchmark built from human-authored industrial workflows and production-log-derived inputs. To enable controlled and reproducible evaluation, we use a semantic error taxonomy to inject errors into fixed workflow prefixes, freeze recorded tool behavior, and let agents continue freely. It contains 167 matched units across nine e-commerce workflows, yielding 501 silent-error, correct-value, and explicit-failure instances. Across 10 recent LLMs, silent errors roughly halve task success and are consistently harder than explicit failures. Recognition, use of an available verification path, and integration of the resulting evidence form successive bottlenecks. We also propose a light State Checker as an intervention to test whether resilience can be improved.", "arxiv_id": "2610.27777", "arxiv_url": "https://arxiv.org/abs/2610.27777", "authors": ["Wenshuo Zhang", "Yuquan Lin", "Yushi Sun", "Yishi Lin", "Rui Sheng", "Peng He", "Han Gao", "Wang Jikai", "Yifeng Rong"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27777", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27777v1", "published_at": "2026-10-20", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "RITE: Evaluating End-to-End Resilience to Silent Tool Errors in E-Commerce Agentic Systems", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many scientific phenomena are best understood as outcomes of underlying optimization problems, yet automated scientific discovery has largely focused on recovering equations that describe observed input-output patterns. We introduce OptScientist, a novel automated framework for discovering compact symbolic optimization laws directly from data. OptScientist comprises (i) a model that infers symbolic optimization problems by first learning to represent data as an optimization problem and then extracting its symbolic form, and (ii) an LLM agentic system embedding the model in a discovery process that integrates theoretical priors from scientific literature, discovers candidate laws, abstracts their underlying mechanisms, and suggests new data to collect. We first evaluate OptScientist on OptFeynman, a novel benchmark of 99 physics-derived optimization problems, where OptScientist recovers ground-truth laws for over 80% of the problems and remains robust to noisy contextual information, while substantially outperforming machine-learning, symbolic, and LLM-based model-discovery baselines. On human risky choice and central-bank monetary policy, OptScientist discovers compact symbolic optimization laws that achieve held-out predictive performance competitive with leading baselines, while using few parameters and substantially fewer tokens than LLM baselines. Overall, OptScientist extends automated scientific discovery to uncovering optimization laws that generate observed phenomena, enabling automated theory building across the physical, biological, behavioral, and social sciences.", "arxiv_id": "2610.28562", "arxiv_url": "https://arxiv.org/abs/2610.28562", "authors": ["Ma ZhenYao", "Yue Liang", "Jian-Qiao Zhu"], "brief": "", "categories": ["cs.AI", "cs.LG", "cs.SC", "econ.EM", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28562", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28562v1", "published_at": "2026-10-20", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "OptScientist: Automated Discovery of Optimization Laws", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents are commonly trained with RLVR, but the sparse nature of typical RLVR rewards makes credit assignment challenging, especially for long-horizon tasks. We propose Self-Credit, an end-to-end agentic RL method that creates dense supervision signals from sparse outcome rewards using self-generated credit assignment via intra-group rescaling. Self-Credit builds on group-based RL with three components. First, during its rollouts, the policy model generates summaries with citations to earlier turns containing critical evidence, which serve as self-generated credit. Second, we refine this model-generated credit with intra-group rescaling, which compares cited actions across successful and failed rollouts for the same prompt. This approach uses group-level agreement and disagreement to remove undeserved credit and further emphasize credit assigned to critical actions. Third, advantage reweighting uses the rescaled credit weights to update the advantages of the cited turns. On BrowseComp-Plus, Self-Credit improves over the base models by 37.0 and 36.2 points on Qwen3 8B and 32B respectively, and outperforms the strongest agentic RL baselines by 8.5 and 5.6 points, respectively. Self-Credit also improves over the strongest baselines by 4.9 points on GAIA and 4.7 points on xBench-DeepSearch. Analyses show that self-generated credit provides useful signals for selecting critical actions, and that intra-group rescaling, especially on failed rollouts, is important across model scales.", "arxiv_id": "2610.28388", "arxiv_url": "https://arxiv.org/abs/2610.28388", "authors": ["Fangcong Yin", "Ming Yin", "Tanvi Bhandarkar", "Aashu Singh", "Eryk Helenowski", "Shlok Kumar Mishra", "Saghar Hosseini", "Karthik Abinav Sankararaman", "Greg Durrett", "Dinkar Juyal"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28388", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28388v1", "published_at": "2026-10-20", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Self-Credit: Credit Assignment for Long-Horizon Agentic RL via Intra-group Rescaling", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this report, we introduce Sage-A1.5, a 35B Mixture-of-Experts agentic model that builds on A1 to advance long-horizon problem solving through adaptive capability composition. Compared with A1, Sage-A1.5 learns not only to solve individual tasks, but also to organize work and revise its approach during execution. Sage-A1.5 highlights three improvements: agentic orchestration, verification, and open scientific discovery. First, agentic orchestration extends single-agent execution through task delegation and parallel collaboration among subagents with isolated contexts, enabling complex tasks to be decomposed and addressed concurrently and supporting efficient execution while reducing interference across concurrent subagents. Second, agentic verification strengthens long-horizon reliability through progress checking, evidence validation, and reflective strategy revision, allowing the agent to recognize unproductive search paths and pursue alternative approaches. Third, open scientific discovery extends agentic capabilities beyond answering predefined questions to conducting exploratory research, connecting scientific inquiry with interactive analysis and inspectable research artifacts. We showcase these capabilities through complicated agentic tasks and multidisciplinary scientific applications. Besides, we hope Sage-A1.5 provides the community with an accessible foundation for open scientific discovery, offering a practical path from long-horizon task execution to collaborative, verifiable, and inspectable scientific exploration.", "arxiv_id": "2610.28578", "arxiv_url": "https://arxiv.org/abs/2610.28578", "authors": ["Wenjie Lou", "Tianshuo Peng", "Shiyang Feng", "Shengji Tang", "Runmin Ma", "Ruizhe Chen", "Jinxin Shi", "Haoyang Peng", "Fangchen Yu", "Zhijie Zhong", "Yuhao Zhou", "Yue Fan", "Yixin Chen", "Yiming Wu", "Yiheng Wang", "Yigeng Jiang", "Yichen Jiang", "Yi Xie", "Xu Guo", "Xiaohan He", "Tao Hu", "Songtao Huang", "Siyu Zhou", "Shuaiyu Zhang", "Shangheng Du", "Qinglong Cao", "Kun Li", "Jingqi Ye", "Hongbin Zhou", "Guohang Yan", "Zongsheng Cao", "Ziyi Wang", "Zhuo Liu", "Zhiyin Yu", "Zhiwang Zhou", "Zelin Tan", "Yuqing Zhu", "Yaoze Zhang", "Yang Chen", "Xuming He", "Xiuliang Liang", "Xingjian Guo", "Xiang Zhuang", "Weiping Shen", "Weida Wang", "Tianyuan Zhou", "Tianlin Ye", "Tengyuan Fan", "Siyu Yan", "Shuo Li", "Shuchen Pu", "Shengyuan Xu", "Shao Zhang", "Ran Wei", "Qinyuan Qin", "Qingyu Yang", "Nianchen Deng", "Meng Dai", "Kuikun Liu", "Kaitao Chen", "Juncheng Xiao", "Jiangning Liu", "Jianbiao Mei", "Jia Yu", "Haonan He", "Hangfan Zhang", "Cheng Yang", "Chen Zhang", "Bihao Zhan", "Benteng Cheng", "Yuqiang Li", "Yihao Liu", "Yang Yang", "Xujun Fu", "Xiaosong Wang", "Xiangyu Yue", "Wenwei Zhang", "Shuyue Hu", "Pinlong Cai", "Mianxin Liu", "Lei Bai", "Jie Zhou", "Jie Hou", "Jiamin Wu", "Hui Wang", "Haijun Li", "Guangyu Wang", "Dongzhan Zhou", "Chunfeng Song", "Chao Yang", "Biqing Qi", "Xing Xie", "Dahua Lin", "Bowen Zhou", "Xiangchao Yan", "Wenlong Zhang", "Shufei Zhang", "Peng Ye", "Bo Zhang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28578", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Intern Science", "pdf_url": "https://arxiv.org/pdf/2610.28578v1", "published_at": "2026-10-20", "score": 0.217, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28578.png", "title": "Sage-A1.5: From Long-Horizon Execution to Scientific Exploration with Capability Composition", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "While LLM agents are increasingly capable of gathering and synthesizing evidence from a single homogeneous source, such as structured tables or unstructured data, real-world analytical questions frequently span heterogeneous sources. For example, answering one enterprise question may require both a result computed over an internal database and evidence found on the web. Recent evaluations on benchmarks like HybridDeepResearch show that even frontier agents struggle when evidence must cross this boundary. While these benchmarks have exposed the limitation, methodologies to explicitly teach cross-source reasoning remain absent. To address this, we introduce HybridResearcher, a 4B agent trained to bridge evidence across the structured and unstructured boundary. To build it, we synthesize cross-source bridge trajectories by starting with validated single-source tasks-such as existing text-to-SQL or web search queries-and fabricating the missing source around a bridge entity drawn from the seed\u0027s own output. We retain a sample only when strict construction gates confirm that neither side alone suffices, ensuring the data requires true cross-source interdependence. Finally, we train on this curated dataset using supervised fine-tuning followed by reinforcement learning. Evaluated on the existing HybridDeepResearch benchmark, HybridResearcher improves over our base model, Qwen3.5-4B, by 30.0 points pass@8 and surpasses the far larger Qwen3.5-397B-A17B by 8.3 points, while also improving over its base model on established, held-out single-source benchmarks (BrowseComp and BrowseComp-Plus), demonstrating that this complex cross-source reasoning can be taught directly to small models without triggering catastrophic forgetting.", "arxiv_id": "2610.24899", "arxiv_url": "https://arxiv.org/abs/2610.24899", "authors": ["Soyoung Yoon", "Peiran Xu", "Han Wang", "Ruofan Wu", "Xiaodong Yu", "Feng Yan", "Mohit Bansal", "Debiao Li", "Seung-Won Hwang", "Yuxiong He", "Zhewei Yao"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.24899", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Snowflake", "pdf_url": "https://arxiv.org/pdf/2610.24899v1", "published_at": "2026-10-17", "score": 0.183, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24899.png", "title": "HybridResearcher: Bridging the Structured-Unstructured Boundary for Deep Research Agents", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "We study language-conditioned local navigation, where a robot must navigate to a text-specified target visible in its initial observation and stop at the described location. End-to-end navigation policies require diverse training data to generalize across scenes, yet real-robot data is costly to collect and simulated data leaves a sim-to-real gap. Internet egocentric videos offer a scalable source of real-world navigation experience. Our key insight is to learn goal-directed visual dynamics from Internet egocentric videos, and use these dynamics to support robot action generation. To this end, we propose ScaleNav, a unified world-action framework with three-stage training. We first perform instruction-conditioned video pretraining on these videos to learn how observations evolve as the camera approaches instructed targets across diverse real-world scenes. Action alignment then uses action-labeled simulated data to train the model to predict executable action chunks. Joint fine-tuning subsequently optimizes all trainable components together for navigation. ScaleNav achieves success rates of 86.5% on a single-view adaptation of Short-Horizon OVON and 94.9% on our HabitatGS-LN benchmark, outperforming the evaluated baselines on both benchmarks. We further deploy and evaluate ScaleNav on a real quadruped robot, with results supporting the model\u0027s ability to generalize to real-world navigation. Code and videos are available at https://zju3dv.github.io/ScaleNav/", "arxiv_id": "2610.25690", "arxiv_url": "https://arxiv.org/abs/2610.25690", "authors": ["Yihui Yang", "Yuanhong Yu", "Jiawei Wang", "Zhongrui Yu", "Jia Shi", "Kun Zhan", "Ruizhen Hu", "Xiaowei Zhou", "Yu Liu", "Sida Peng"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/MachEmbodied/ScaleNav", "github_stars": 39, "hf_url": "https://huggingface.co/papers/2610.25690", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25690v1", "published_at": "2026-10-19", "score": 0.155, "selected_reasons": ["HF trending (84\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25690.png", "title": "ScaleNav: Scalable Internet Video Pretraining for Language-Conditioned Local Navigation", "tldr": null, "upvotes": 84, "what_it_is": null, "why_notable": null}, {"abstract": "Reconstructing human activity from egocentric video requires more than recovering individual 3D components: the observer\u0027s motion, surrounding geometry, and hand-object interactions must fit together in a consistent world. Achieving this coherence requires both joint reconstruction and aligned supervision, yet existing methods and datasets offer limited support for either. We present EgoXperience, a full-stack paradigm that addresses these needs through data collection, automatic annotation, unified modeling, and benchmarking. Central to EgoXperience is an automatic annotation engine, EgoX-Engine, that couples geometrically verified object tracking with SLAM-based world alignment, yielding consistent supervision for the camera, scene, hands, and objects. This yields EgoX-Data-6M, a 50-hour dataset of task-driven manipulation and locomotion within and across indoor and outdoor environments, with second-level task captions. We carefully select one hour across these activity categories as EgoX-Bench to evaluate joint reconstruction. To translate this supervision into reconstruction, we introduce EgoX, trained with EgoX-Data-6M and complementary annotations from additional public datasets. Given monocular egocentric video and first-frame object masks, our model achieves joint metric reconstruction of the camera, scene, hands, and objects in a shared world coordinate frame with a single forward pass. Extensive experiments demonstrate state-of-the-art performance across scene estimation and world-space hand-object pose recovery. Against the strongest evaluated baselines, EgoX reduces camera, hand, and depth errors by 68.9%, 65.6%, and 42.9%, and improves object pose scores by 28.0%.", "arxiv_id": "2610.26625", "arxiv_url": "https://arxiv.org/abs/2610.26625", "authors": ["Xinhao Ji", "Hui En Pang", "Hao Li", "Kairui Hu", "Jiner Wang", "Mingze Sun", "Ziang Cao", "Yalun Dai", "Thang Luu", "Qin Ma", "Hongyi Chen", "Yukang Cao", "Fangzhou Hong", "Zhaoxi Chen", "Ziwei Liu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Ropedia/EgoXperience", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2610.26625", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Ropedia", "pdf_url": "https://arxiv.org/pdf/2610.26625v1", "published_at": "2026-10-19", "score": 0.154, "selected_reasons": ["HF trending (130\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26625.png", "title": "EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience", "tldr": null, "upvotes": 130, "what_it_is": null, "why_notable": null}, {"abstract": "Human egocentric experience offers a rich foundation for learning how the world is organized and how it changes through interaction. Realizing this potential at scale requires turning growing volumes of recordings into learning resources that connect scene structure, object semantics, and interaction histories across viewpoints and time, while reducing dependence on costly manual annotation. We introduce HOLI-WORLD, an integrated ecosystem connecting experience capture, world representation, automated data construction, model learning, and independent evaluation. To sup- port learning at scale, HOLIWORLD-Foundry combines complementary static and dynamic perception to automatically construct world records that connect persistent scene structure and evolving object states with interaction histories and supporting observations. HOLIWORLD-Data organizes these records from approximately 100 self-collected scenes into grounded learning resources, including approximately 80K QA pairs used to train HOLIWORLD-VL-4B. Independent human annotations of heldout recordings form HOLIWORLD-Bench, supporting evaluation of both annotation quality and learned spatial and temporal understanding. Experiments on ScanNet, ScanNet++, Aria Digital Twin, and HOLIWORLD-Bench demonstrate strong performance in static perception and dynamic tracking, while training on HOLIWORLD-Data substantially improves HOLIWORLD-VL-4B\u0027s spatial and temporal reasoning on HOLI- WORLD-Bench and EgoDynamic4D. HOLIWORLD provides a practical foundation for expanding learning resources from the continuous flow of human experience and advancing machine understanding of the dynamic world.", "arxiv_id": "2610.26549", "arxiv_url": "https://arxiv.org/abs/2610.26549", "authors": ["Hao Li", "Xiyuan Zheng", "Yuanyuan Gao", "Yalun Dai", "Xinhao Ji", "Xuan-Li Chen", "Jing Zhao", "Fangzhou Hong", "Zhaoxi Chen", "Ziwei Liu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Ropedia/holi-world", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2610.26549", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Ropedia", "pdf_url": "https://arxiv.org/pdf/2610.26549v1", "published_at": "2026-10-19", "score": 0.153, "selected_reasons": ["HF trending (116\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26549.png", "title": "Holi-World: Building Holistic World Intelligence from Human-Ego Experience", "tldr": null, "upvotes": 116, "what_it_is": null, "why_notable": null}, {"abstract": "Brain encoding models aim to predict neural responses to stimuli. The most widely used approach fits readouts from frozen pretrained backbones. Using neural data to train large models from scratch or fully fine-tune them after task-pretraining has proven difficult because neural data is costly and limited. We show that parameter-efficient fine-tuning (PEFT) enables us to effectively adapt very large pretrained backbones for brain encoding with a small number of trainable parameters. To make it computationally practical, we exploit the backbone\u0027s causal structure to predict multiple timepoints in a single pass instead of using sliding windows, significantly reducing feature-extraction cost. This enables efficient fine-tuning of multimodal backbones with up to 104B parameters, the largest model adapted for brain encoding to our knowledge. Trained with a low-rank adapter (LoRA) and a lightweight readout, our approach consistently improves brain encoding performance across nine diverse multimodal backbones. On the same Qwen3-Omni backbone as the prior state-of-the-art (SoTA), our method BrainLoRA achieves the best published performance on the Algonauts 2025 Challenge. We also show the adapted multimodal backbones remain interpretable: modality attribution recovers the canonical sensory topography that prior work often obtains by construction from separate unimodal encoders, and neural adaptation increases the contribution of audio inputs and cross-modal mixing within the backbone. To scale out the number of adapted models, we develop a multi-LoRA kernel that accelerates joint training of multiple LoRAs on a shared backbone. This enables an ensemble of 200+ adapted models that ranks first on the public Algonauts post-challenge leaderboard at the time of writing. Together, our results highlight PEFT as an efficient and powerful paradigm for brain encoding.", "arxiv_id": "2610.26802", "arxiv_url": "https://arxiv.org/abs/2610.26802", "authors": ["Zhuofan Josh Ying", "Guanglong Sun", "Nolan Ho", "Kieran Liu", "Rui Yang", "Andrew Chen", "Nikolaus Kriegeskorte", "Pony Ma", "Hossein Adeli"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.26802", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Mind Lab", "pdf_url": "https://arxiv.org/pdf/2610.26802v1", "published_at": "2026-10-19", "score": 0.151, "selected_reasons": ["HF trending (234\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26802.png", "title": "Scaling Parameter-Efficient Fine-Tuning for Brain Encoding", "tldr": null, "upvotes": 234, "what_it_is": null, "why_notable": null}, {"abstract": "Vulnerability benchmarks and software engineering research depend on rebuilding historical software. Yet builds rely on external resources, such as base images and packages, that change independently of the source code. In this study, we examine this environment decay on 14,159 OSS-Fuzz cases. We find that 69.7% no longer complete reconstruction and verification, and that most failures share a small number of recurring failure symptoms. A recurring failure can therefore be diagnosed once and its repair reused. We present Relay, a hybrid framework that uses an LLM to derive and validate deterministic repair rules from representative failures, reuses them without model calls, and escalates cases unresolved by rules to a per-case agent. We evaluate Relay in human-guided and fully automated rule-derivation campaigns and compare it with a per-case agent approach. We find that rule derivation can be fully automated, and that reusable rules restore as many builds as per-case agents with fewer build executions. However, agents restore cases that the rules cannot. Our results show that a hybrid approach that applies rules first and escalates the remaining cases to an agent restores more builds than either approach alone and at a lower cost than using agents alone.", "arxiv_id": "2610.27784", "arxiv_url": "https://arxiv.org/abs/2610.27784", "authors": ["Olivier Nourry", "Yoshiki Higo"], "brief": "", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27784", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27784v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "RELAY: Scaling Historical Build Restoration through Rule Reuse and Agentic Repair", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Training LLM agents for policy-constrained tool environments, such as an airline backend with booking, refund, and cancellation policies, requires tasks that exercise the environment\u0027s rules individually and in combination. Existing synthesis pipelines let a model propose tasks and retain only those it immediately solves, biasing training data toward easier behaviors. We introduce Gradus (Graded Rungs of Ascending Difficulty from an Underlying System), which decouples what a task should teach from the concrete task and solution used to teach it. Without seed tasks, Gradus treats a fixed environment as a latent syllabus, extracting guarded behavioral operators that capture how actions depend on current conditions and how their effects reshape subsequent decisions. It composes these operators into increasingly demanding tasks while using corpus-level feedback to target missing outcome combinations. Crucially, Gradus jointly calibrates tasks and solutions against the environment: execution feedback identifies which side to refine while preserving the intended behavioral requirements. Verification thus becomes a recovery signal rather than a terminal filter, coupling coverage-guided exploration with the preservation of difficult examples. From off-the-shelf backbones, the resulting curriculum lifts a 30B model from 59% to 89% on $\u03c4^2$-Bench and from 47% to 83% on CAR-Bench with an Opus 4.5 proposer, and to 76% and 62%, respectively, with an open-weight Qwen3-235B proposer. These results show the value of jointly controlling which behaviors are explored and which survive into verified training data.", "arxiv_id": "2610.27781", "arxiv_url": "https://arxiv.org/abs/2610.27781", "authors": ["Qing Ping", "Wei Yang", "Panpan Xu", "Johannes Kirmayr", "Lukas Stappen", "Junjie Tang", "Jun Huan"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27781", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.27781v1", "published_at": "2026-10-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "GRADUS: Discovering and Recovering Agent Lessons from the Environment\u0027s Latent Syllabus", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous LLM agents act through tools under per-action authorization: a local guard screens each tool call in isolation. We show that local authorization does not compose into global authorization. A compositional authorization failure (CAF) is a locally authorized execution, or a pair of locally authorized executions, that violates a global policy spanning intent, purpose, provenance, consent, and delegation. We characterize CAFs along two axes, expressiveness (single-trace safety versus relational k-safety) and observability (a ladder of monitor profiles). Our central result is an impossibility: relational purpose violations form a 2-safety hyperproperty with no per-trace locus of blame, so a per-action monitor that never raises a false alarm detects none of them, independent of the underlying model or decision procedure; they become visible only under cross-execution monitoring, which none of the six guardrails we survey implements. We make this constructive with AL-SYNTH, a SAT/SMT synthesizer (using no language model) that emits minimal CAF witnesses, each checked against an exhaustive oracle. The empirical signature is sharp: across nine LLM judges the per-action view approves the synthesized witness almost without exception, blocking it at a rate comparable to a benign control, yet the same models flag it when shown the two executions together. Per-action authorization is therefore structurally insufficient for relational policy conjuncts not reducible to single-trace safety: to bound them, a monitor must compare executions or accept false alarms.", "arxiv_id": "2610.27620", "arxiv_url": "https://arxiv.org/abs/2610.27620", "authors": ["Anmol Pandey", "Aditya Jain", "Liang Chen", "Carsten Maple"], "brief": "", "categories": ["cs.CR", "cs.AI", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.27620", "impact_score": null, "is_age
