ps://arxiv.org/abs/2611.33636", "authors": ["Dongheon Lee", "DongJae Lee", "Sewhan Chun", "Chanseul Cho", "Youngwook Kim", "Youngmin Ro", "Yonghyun Jeong"], "brief": "HiGLR\u662f\u4e00\u79cd\u9ad8\u6548\u591a\u5c3a\u5ea6\u7edf\u4e00\u56fe\u50cf\u590d\u539f\u7f51\u7edc\uff0c\u901a\u8fc7\u5206\u6790\u7a7a\u95f4\u5197\u4f59\uff0c\u4ee5\u5b66\u4e60\u6838\u66ff\u6362\u6700\u7ec6\u5c3a\u5ea6\u6ce8\u610f\u529b\uff0c\u5e76\u7ed3\u5408\u5757\u8def\u7531\u6df7\u5408\u6ce8\u610f\u529b\u4e0e\u53cc\u7a7a\u95f4\u524d\u9988\u7f51\u7edc\u964d\u4f4e\u5f00\u9500\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/dslisleedh/HiGLR", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.33636", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6700\u7ec6\u5c3a\u5ea6\u7528\u5b66\u4e60\u7684\u8f93\u5165\u65e0\u5173\u6838\u66ff\u4ee3\u81ea\u6ce8\u610f\u529b", "\u5757\u8def\u7531\u6df7\u5408\u6ce8\u610f\u529b\u7ed3\u5408\u7c97\u5c3a\u5ea6\u7a20\u5bc6\u4e0e\u7ec6\u5c3a\u5ea6\u5757\u7a00\u758f\u8ba1\u7b97", "Dual-Space FFN\u5206\u79bb\u7d27\u51d1\u7a7a\u95f4\u6df7\u5408\u4e0e\u6269\u5c55\u7a7a\u95f4\u975e\u7ebf\u6027"], "keywords": ["\u56fe\u50cf\u590d\u539f", "\u9ad8\u6548\u6ce8\u610f\u529b", "\u591a\u5c3a\u5ea6\u7f51\u7edc", "\u63a8\u7406\u52a0\u901f"], "num_comments": 3, "on_hf": true, "organization": "University of Seoul", "pdf_url": "https://arxiv.org/pdf/2611.33636v1", "published_at": "2026-11-25", "score": 0.27, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33636.png", "title": "What Is Redundant at High Resolution? Efficient Attention and Feed-Forward Design for All-in-One Image Restoration", "tldr": "\u901a\u8fc7\u524a\u51cf\u9ad8\u5206\u8fa8\u7387\u6ce8\u610f\u529b\u4e0e\u524d\u9988\u7f51\u7edc\u5197\u4f59\uff0c\u517c\u987e\u7edf\u4e00\u56fe\u50cf\u590d\u539f\u8d28\u91cf\u548c\u901f\u5ea6\u3002", "upvotes": 14, "what_it_is": "HiGLR\u662f\u4e00\u79cd\u9ad8\u6548\u591a\u5c3a\u5ea6\u7edf\u4e00\u56fe\u50cf\u590d\u539f\u7f51\u7edc\uff0c\u901a\u8fc7\u5206\u6790\u7a7a\u95f4\u5197\u4f59\uff0c\u4ee5\u5b66\u4e60\u6838\u66ff\u6362\u6700\u7ec6\u5c3a\u5ea6\u6ce8\u610f\u529b\uff0c\u5e76\u7ed3\u5408\u5757\u8def\u7531\u6df7\u5408\u6ce8\u610f\u529b\u4e0e\u53cc\u7a7a\u95f4\u524d\u9988\u7f51\u7edc\u964d\u4f4e\u5f00\u9500\u3002", "why_notable": "\u5728\u8fbe\u5230\u9886\u5148\u590d\u539f\u6027\u80fd\u7684\u540c\u65f6\uff0c\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u6700\u9ad8\u5b9e\u73b04.24\u500d\u63a8\u7406\u52a0\u901f\uff0c\u5c55\u793a\u4e86\u6309\u5c3a\u5ea6\u6d88\u9664\u5197\u4f59\u7684\u8bbe\u8ba1\u4ef7\u503c\u3002"}, {"abstract": "A growing body of recent work addresses the retargeting of human hand-object demonstrations to robotic hands. To train whole-robot policies, however, the retargeted motions must be kinematically feasible and physically executable, and be produced efficiently at scale. We present DexEngine, a simulation pipeline that turns human manipulation data into train-ready, physically executable arm-hand trajectories. DexEngine first places each clip\u0027s hand-object motion where the arms can reach it, finds an arm motion that follows the human hands, and then corrects the motion in physics simulation with residual reinforcement learning. From nine human hand-object datasets, we generate about 5,200 clips for each of four dexterous hands, augmented into 65,000 trajectories (116 h) and 325,000 episodes (578 h) in total. Even with arms attached, DexEngine tracks objects more accurately than prior floating-hand methods and runs over 10x faster than RL-based ones. Policies trained on our data far outperform those trained on the same clips without physics correction or with the arms attached after a floating-hand correction, showing that fine-tuning data need physics correction. Mid-training on our data further improves them at equal fine-tuning budget, in simulation and on a real robot.", "arxiv_id": "2611.33579", "arxiv_url": "https://arxiv.org/abs/2611.33579", "authors": ["Wongyun Yu", "Honggeun Kim", "Donguk Lee", "Minchan Kim", "Kyoung Whan Choe", "Minsu Cho"], "brief": "DexEngine\u5148\u5c06\u4eba\u7c7b\u624b\u7269\u8fd0\u52a8\u653e\u5165\u673a\u68b0\u81c2\u53ef\u8fbe\u533a\u57df\uff0c\u518d\u6c42\u89e3\u8ddf\u968f\u52a8\u4f5c\uff0c\u5e76\u7528\u6b8b\u5dee\u5f3a\u5316\u5b66\u4e60\u5728\u7269\u7406\u4eff\u771f\u4e2d\u4fee\u6b63\uff0c\u751f\u6210\u53ef\u76f4\u63a5\u8bad\u7ec3\u7684\u81c2\u624b\u534f\u540c\u8f68\u8ff9\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/wongyun-yu/DexEngine", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.33579", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d69\u4e2a\u4eba\u7c7b\u6570\u636e\u96c6\u30014\u79cd\u7075\u5de7\u624b\uff0c\u751f\u62106.5\u4e07\u6761\u8f68\u8ff9", "\u6b8b\u5dee\u5f3a\u5316\u5b66\u4e60\u4fee\u6b63\u7269\u7406\u6267\u884c\uff0c\u901f\u5ea6\u8d85RL\u7c7b\u65b9\u6cd510\u500d", "\u6570\u636e\u4e2d\u671f\u8bad\u7ec3\u5728\u76f8\u540c\u5fae\u8c03\u9884\u7b97\u4e0b\u63d0\u5347\u4eff\u771f\u4e0e\u771f\u673a\u8868\u73b0"], "keywords": ["\u7075\u5de7\u64cd\u4f5c", "\u52a8\u4f5c\u91cd\u5b9a\u5411", "\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "POSTECH Computer Vision Lab", "pdf_url": "https://arxiv.org/pdf/2611.33579v1", "published_at": "2026-11-25", "score": 0.26, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33579.png", "title": "DexEngine: Scaling Human Demonstrations into Physically Executable Whole-Robot Data", "tldr": "\u5c06\u4eba\u7c7b\u64cd\u4f5c\u6f14\u793a\u8f6c\u4e3a\u53ef\u7269\u7406\u6267\u884c\u7684\u673a\u68b0\u81c2\u4e0e\u7075\u5de7\u624b\u8f68\u8ff9\uff0c\u652f\u6301\u89c4\u6a21\u5316\u7b56\u7565\u8bad\u7ec3\u3002", "upvotes": 3, "what_it_is": "DexEngine\u5148\u5c06\u4eba\u7c7b\u624b\u7269\u8fd0\u52a8\u653e\u5165\u673a\u68b0\u81c2\u53ef\u8fbe\u533a\u57df\uff0c\u518d\u6c42\u89e3\u8ddf\u968f\u52a8\u4f5c\uff0c\u5e76\u7528\u6b8b\u5dee\u5f3a\u5316\u5b66\u4e60\u5728\u7269\u7406\u4eff\u771f\u4e2d\u4fee\u6b63\uff0c\u751f\u6210\u53ef\u76f4\u63a5\u8bad\u7ec3\u7684\u81c2\u624b\u534f\u540c\u8f68\u8ff9\u3002", "why_notable": "\u628a\u6f14\u793a\u91cd\u5b9a\u5411\u4ece\u60ac\u6d6e\u624b\u6269\u5c55\u5230\u5b8c\u6574\u81c2\u624b\u7cfb\u7edf\uff0c\u5e76\u9a8c\u8bc1\u7269\u7406\u4fee\u6b63\u5bf9\u8bad\u7ec3\u6570\u636e\u8d28\u91cf\u7684\u91cd\u8981\u6027\uff0c\u4e3a\u89c4\u6a21\u5316\u5229\u7528\u4eba\u7c7b\u6f14\u793a\u63d0\u4f9b\u53ef\u884c\u8def\u5f84\u3002"}, {"abstract": "We introduce Puzzling-Bench, a benchmark of 23,777 puzzles with community-verified answers drawn from the Puzzling Stack Exchange archive (2014-2026): riddles, ciphers, logic grids, lateral-thinking problems, wordplay and recreational mathematics, a third of them with images. Every puzzle carries the answer accepted by its author, a short reference answer taken from it (LLM-extracted for the evaluation sets and checked on a 50-puzzle human review), the author\u0027s own hints, community tags and a creation date, so that the benchmark supports hint ablations, category analysis and a rolling post-cutoff slice (254 puzzles posted after the training cutoff of six of the nine models we evaluate, including the best one) as a contamination check. We evaluate nine frontier and open models with a two-tier scorer (normalized exact match, then an LLM judge) and validate the judge with three judges from two model families: they agree on 95-97% of verdicts (kappa 0.82-0.96), move no model by more than 1.6 points, and show no own-family preference. The best model, GPT-6.1, reaches 74.8% on a shared 255-puzzle set; a hard core of 17 puzzles defeats all nine models; model failures are strongly correlated, and the second-best model contributes a single puzzle to a greedy ensemble, yet an oracle over all nine reaches 91%. On a 100-puzzle multimodal pilot, withholding the question\u0027s image costs the two best models 24 and 35 points. We release the dataset, the scoring pipeline and all per-row provenance.", "arxiv_id": "2611.34331", "arxiv_url": "https://arxiv.org/abs/2611.34331", "authors": ["Abhinav Sharma", "Li Li", "Chien Van Nguyen", "Sai Karthik Navuluru", "Bo Ni", "Xiangbo Gao", "Xiaolei Huang", "Yue Zhao", "Nesreen K. Ahmed", "Tyler Derr", "Yu Wang", "Hongjie Chen", "Zhengzhong Tu", "Thien Huu Nguyen", "Ryan A. Rossi", "Franck Dernoncourt"], "brief": "\u6784\u5efa\u542b23777\u9053\u793e\u533a\u8c1c\u9898\u7684\u8bc4\u6d4b\u96c6\uff0c\u4fdd\u7559\u4f5c\u8005\u8ba4\u53ef\u7b54\u6848\u3001\u63d0\u793a\u4e0e\u6765\u6e90\u3002\u91c7\u7528\u7cbe\u786e\u5339\u914d\u52a0\u6a21\u578b\u88c1\u5224\u8bc4\u5206\uff0c\u5e76\u652f\u6301\u63d0\u793a\u6d88\u878d\u3001\u5206\u7c7b\u5206\u6790\u548c\u8bad\u7ec3\u622a\u6b62\u540e\u6d4b\u8bd5\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/a1bhinav/puzzling-bench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.34331", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e5d\u6a21\u578b\u5171\u6d4b255\u9898\uff0cGPT-6.1\u8fbe74.8%\uff0c17\u9898\u5168\u90e8\u5931\u8d25", "\u4e09\u4f4d\u6a21\u578b\u88c1\u5224\u5224\u5b9a\u4e00\u81f4\u738795\u201397%\uff0c\u6392\u540d\u5f97\u5206\u53d8\u52a8\u4e0d\u8d851.6\u70b9", "100\u9898\u591a\u6a21\u6001\u8bd5\u6d4b\u4e2d\uff0c\u53bb\u6389\u56fe\u50cf\u4f7f\u6700\u5f3a\u4e24\u6a21\u578b\u4e0b\u964d24\u548c35\u70b9"], "keywords": ["\u6a21\u578b\u8bc4\u6d4b", "\u63a8\u7406\u80fd\u529b", "\u591a\u6a21\u6001", "\u6570\u636e\u6c61\u67d3"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34331v1", "published_at": "2026-11-25", "score": 0.234, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34331.png", "title": "Puzzling-Bench: Evaluating Language Models on 23,777 Human-Written Puzzles with Community-Verified Answers", "tldr": "\u4ee5\u793e\u533a\u9a8c\u8bc1\u8c1c\u9898\u8bc4\u6d4b\u4e5d\u79cd\u6a21\u578b\uff0c\u63ed\u793a\u5171\u540c\u63a8\u7406\u76f2\u533a\u4e0e\u56fe\u50cf\u4fe1\u606f\u7684\u91cd\u8981\u6027\u3002", "upvotes": 4, "what_it_is": "\u6784\u5efa\u542b23777\u9053\u793e\u533a\u8c1c\u9898\u7684\u8bc4\u6d4b\u96c6\uff0c\u4fdd\u7559\u4f5c\u8005\u8ba4\u53ef\u7b54\u6848\u3001\u63d0\u793a\u4e0e\u6765\u6e90\u3002\u91c7\u7528\u7cbe\u786e\u5339\u914d\u52a0\u6a21\u578b\u88c1\u5224\u8bc4\u5206\uff0c\u5e76\u652f\u6301\u63d0\u793a\u6d88\u878d\u3001\u5206\u7c7b\u5206\u6790\u548c\u8bad\u7ec3\u622a\u6b62\u540e\u6d4b\u8bd5\u3002", "why_notable": "\u793e\u533a\u8ba4\u53ef\u7b54\u6848\u4e0e\u9010\u9898\u6eaf\u6e90\u589e\u5f3a\u8bc4\u6d4b\u53ef\u6838\u67e5\u6027\uff1b\u8bad\u7ec3\u622a\u6b62\u540e\u7684\u9898\u76ee\u53ef\u68c0\u67e5\u6c61\u67d3\uff0c\u76f8\u5173\u5931\u8d25\u5219\u63ed\u793a\u6a21\u578b\u95f4\u4e92\u8865\u80fd\u529b\u6709\u9650\u3002"}, {"abstract": "Part-aware 3D generation requires not only globally plausible objects but also complete, well-separated semantic parts, yet high-quality part decompositions remain too scarce to support large-scale supervised fine-tuning. We study whether preference fine-tuning based on Direct Preference Optimization (DPO) can adapt a pretrained part-aware generator from limited part-annotated data without architectural changes. We rank candidates generated with different random seeds against ground-truth (GT) geometric metrics, and select the (object, target-part) examples with the largest across-seed quality gap. Each selected example stores a seed pair whose two flow trajectories share one clean GT compositional latent and differ only in Gaussian noise. We derive a reference-relative target-block preference loss from FlowDPO that compares the two trajectories against a frozen reference model. GT flow-matching losses on the target block and complete part set provide absolute supervision, while only the diffusion transformer (DiT) is updated. Human-ranked controls test an alternative ordering source, and synthetic cropping provides controlled loser targets that are incomplete by construction. Among the three training-set scales, the medium-scale setting gives the strongest result on held-out Objaverse and outperforms both the pretrained generator and the reported direct supervised fine-tuning baseline on the multi-part aggregate. Further analysis shows sensitivity to pair ordering, target-part coverage, and the balance between pairwise and GT supervision. Cross-dataset experiments show less consistent gains under distribution shift.", "arxiv_id": "2611.30472", "arxiv_url": "https://arxiv.org/abs/2611.30472", "authors": ["Zishan Qin", "Rui Li", "Zeyu Zhang", "Sevvandi Kandanaarachchi", "Lina Yao", "Dong Gong"], "brief": "\u5728\u4e0d\u6539\u53d8\u9884\u8bad\u7ec3\u751f\u6210\u5668\u67b6\u6784\u7684\u524d\u63d0\u4e0b\uff0c\u7528\u771f\u5b9e\u51e0\u4f55\u6307\u6807\u7b5b\u9009\u968f\u673a\u79cd\u5b50\u504f\u597d\u5bf9\u3002\u7ed3\u5408\u76ee\u6807\u90e8\u4ef6\u7684FlowDPO\u635f\u5931\u4e0e\u771f\u5b9e\u6570\u636e\u6d41\u5339\u914d\u76d1\u7763\uff0c\u4ec5\u66f4\u65b0\u6269\u6563\u53d8\u6362\u5668\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30472", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6309\u8de8\u79cd\u5b50\u8d28\u91cf\u5dee\u7b5b\u9009\u5bf9\u8c61\u4e0e\u76ee\u6807\u90e8\u4ef6\u504f\u597d\u5bf9", "FlowDPO\u5bf9\u6bd4\u51bb\u7ed3\u53c2\u8003\u6a21\u578b\uff0c\u53e0\u52a0\u90e8\u4ef6\u6d41\u5339\u914d\u76d1\u7763", "\u4e09\u79cd\u6570\u636e\u89c4\u6a21\u4e2d\uff0c\u4e2d\u7b49\u89c4\u6a21\u5728Objaverse\u4e0a\u8868\u73b0\u6700\u4f73"], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u504f\u597d\u4f18\u5316", "\u90e8\u4ef6\u5efa\u6a21"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30472v1", "published_at": "2026-11-23", "score": 0.233, "selected_reasons": ["HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30472.png", "title": "Target-Part Preference Optimization for Part-Aware 3D Generation", "tldr": "\u901a\u8fc7\u76ee\u6807\u90e8\u4ef6\u504f\u597d\u5fae\u8c03\uff0c\u5229\u7528\u6709\u9650\u6807\u6ce8\u6539\u5584\u4e09\u7ef4\u751f\u6210\u7684\u90e8\u4ef6\u5b8c\u6574\u6027\u4e0e\u5206\u79bb\u5ea6\u3002", "upvotes": 16, "what_it_is": "\u5728\u4e0d\u6539\u53d8\u9884\u8bad\u7ec3\u751f\u6210\u5668\u67b6\u6784\u7684\u524d\u63d0\u4e0b\uff0c\u7528\u771f\u5b9e\u51e0\u4f55\u6307\u6807\u7b5b\u9009\u968f\u673a\u79cd\u5b50\u504f\u597d\u5bf9\u3002\u7ed3\u5408\u76ee\u6807\u90e8\u4ef6\u7684FlowDPO\u635f\u5931\u4e0e\u771f\u5b9e\u6570\u636e\u6d41\u5339\u914d\u76d1\u7763\uff0c\u4ec5\u66f4\u65b0\u6269\u6563\u53d8\u6362\u5668\u3002", "why_notable": "\u4e3a\u90e8\u4ef6\u6807\u6ce8\u7a00\u7f3a\u7684\u4e09\u7ef4\u751f\u6210\u63d0\u4f9b\u4e86\u504f\u597d\u5fae\u8c03\u8def\u5f84\uff0c\u591a\u90e8\u4ef6\u7efc\u5408\u8868\u73b0\u4f18\u4e8e\u76f4\u63a5\u76d1\u7763\u5fae\u8c03\uff0c\u4f46\u8de8\u6570\u636e\u96c6\u589e\u76ca\u4e0d\u7a33\u5b9a\u3002"}, {"abstract": "While video diffusion models have grown faster and increasingly streamable, the video VAE remains a primary latency bottleneck across interactive generation and editing pipelines. Existing VAEs and their acceleration methods rely mainly on heavy convolutions or full frame attention, and most focus only on decoding, leaving encoding costly for streaming conditional generation and editing. This raises a natural question: Do video VAE encoding and decoding actually require such global spatiotemporal modeling? By analyzing the effective receptive fields of pretrained video VAEs, we find that both encoding and decoding a patch rely almost entirely on its spatial and temporal neighbors. To exploit this strong locality, we introduce LiveVAE, a streaming encoder and decoder built on causal window attention, which cuts per frame compute while keeping the temporal KV cache bounded for streaming. Decoupled encoder/decoder distillation followed by joint finetuning preserves the pretrained latent space, making LiveVAE a drop-in replacement for the original VAE. On MiniMax-H3, LiveVAE achieves 5.2-6.2x faster encoding and 3.0-3.3x faster decoding than the official VAE with higher PSNR. Paired with our dedicated inference infrastructure, LiveVAE pushes the speedup to 13.4x with almost no quality loss. Code and models will be released.", "arxiv_id": "2611.34912", "arxiv_url": "https://arxiv.org/abs/2611.34912", "authors": ["Jiachen An", "Sijie Zhao", "Le Li", "Hongyu Liu", "Zhiyuan Li", "Tianyu Yang", "Xiaoyu Kong", "Xunliang Cai", "Yong Zhang", "Chi-Man Pun", "Xiaoming Wei", "Xiaodong Cun"], "brief": "LiveVAE\u4ee5\u56e0\u679c\u7a97\u53e3\u6ce8\u610f\u529b\u5b9e\u73b0\u6d41\u5f0f\u89c6\u9891\u7f16\u89e3\u7801\uff0c\u4fdd\u7559\u539f\u6709\u6f5c\u7a7a\u95f4\uff1b\u7f16\u7801\u63d0\u901f5.2\u81f36.2\u500d\u3001\u89e3\u7801\u63d0\u901f3\u81f33.3\u500d\uff0c\u4e14\u91cd\u5efa\u8d28\u91cf\u66f4\u9ad8\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/MeiGen-AI/LiveVAE", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.34912", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u53d8\u5206\u81ea\u7f16\u7801\u5668", "\u6d41\u5f0f\u63a8\u7406", "\u6a21\u578b\u52a0\u901f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34912v1", "published_at": "2026-11-25", "score": 0.058, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34912.png", "title": "LiveVAE: Causal Window Attention Makes Efficient Streaming Video VAE", "tldr": "LiveVAE\u4ee5\u56e0\u679c\u7a97\u53e3\u6ce8\u610f\u529b\u5b9e\u73b0\u6d41\u5f0f\u89c6\u9891\u7f16\u89e3\u7801\uff0c\u4fdd\u7559\u539f\u6709\u6f5c\u7a7a\u95f4\uff1b\u7f16\u7801\u63d0\u901f5.2\u81f36.2\u500d\u3001\u89e3\u7801\u63d0\u901f3\u81f33.3\u500d\uff0c\u4e14\u91cd\u5efa\u8d28\u91cf\u66f4\u9ad8\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Action-conditioned world models play a vital role in robotics and autonomous driving, yet existing video diffusion models struggle to maintain dynamic object persistence. When the camera turns away and returns, out-of-view moving entities fail to evolve plausibly in latent space, often mutating or vanishing entirely due to bounded perspective views. To resolve this issue, we propose OmniPersist, a unified framework that couples perspective video generation with panoramic evolution within a single-stage diffusion model, without relying on auxiliary models or initial panoramic inputs. To maintain efficiency, we model the panoramic stream at a lower frame rate, bridging both views across space and time via Geometric Anchoring (GeoAnch) for spatial correspondence and Temporal Compensation (TemComp) for temporal aggregation. OmniPersist is agnostic to camera-control architectures, supporting both latent-level and attention-level conditioning. Extensive experiments on a newly constructed dynamic benchmark across image-to-video and video continuation tasks demonstrate consistent gains in visual quality, camera controllability, revisit consistency, and dynamic persistence.", "arxiv_id": "2611.32473", "arxiv_url": "https://arxiv.org/abs/2611.32473", "authors": ["Zhilu Zhang", "Xiaoyu Liu", "Wenxi Liu", "Shengfeng He"], "brief": "OmniPersist\u5c06\u900f\u89c6\u89c6\u9891\u751f\u6210\u4e0e\u4f4e\u5e27\u7387\u5168\u666f\u6f14\u5316\u8026\u5408\uff0c\u8ba9\u89c6\u91ce\u5916\u52a8\u6001\u7269\u4f53\u6301\u7eed\u6f14\u53d8\uff1b\u5b9e\u9a8c\u663e\u793a\u89c6\u89c9\u8d28\u91cf\u3001\u76f8\u673a\u53ef\u63a7\u6027\u53ca\u91cd\u8bbf\u4e00\u81f4\u6027\u5747\u63d0\u5347\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/cszhilu1998/OmniPersist", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.32473", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u65f6\u7a7a\u4e00\u81f4\u6027"], "num_comments": 2, "on_hf": true, "organization": "Singapore Management University", "pdf_url": "https://arxiv.org/pdf/2611.32473v1", "published_at": "2026-11-24", "score": 0.057, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32473.png", "title": "OmniPersist: Persistent Dynamic World Modeling via Coupled Panoramic Evolution", "tldr": "OmniPersist\u5c06\u900f\u89c6\u89c6\u9891\u751f\u6210\u4e0e\u4f4e\u5e27\u7387\u5168\u666f\u6f14\u5316\u8026\u5408\uff0c\u8ba9\u89c6\u91ce\u5916\u52a8\u6001\u7269\u4f53\u6301\u7eed\u6f14\u53d8\uff1b\u5b9e\u9a8c\u663e\u793a\u89c6\u89c9\u8d28\u91cf\u3001\u76f8\u673a\u53ef\u63a7\u6027\u53ca\u91cd\u8bbf\u4e00\u81f4\u6027\u5747\u63d0\u5347\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Memory benchmarks built on question answering tell an agent which fact to recall. Workplace requests often leave that need implicit: to post an update in the team\u0027s channel, an agent must work out which channel from earlier interactions and use it in a tool call. We evaluate Memanto, a memory agent that ranks memories with an information-theoretic relevance score, on DolphinBench, which tests memory through 600 simulated workplace tasks, each validated as requiring memory. Running in the Hermes agent harness with GPT-6-Luna and at most 6 iterations per conversation, Memanto completes 503 tasks (83.83%). The strongest configuration reported by the benchmark\u0027s authors, Mem0 with GPT-5.6-Luna and up to 60 iterations, completes 424 (70.67%). Memanto\u0027s run also has the lowest total cost ($10.86, against $61.48 for the cheapest reported run) and the shortest median task latency (15.32s). Grading uses the benchmark\u0027s own judge, but the agent model differs, so these results compare complete systems. The memory system affects both whether an agent completes such tasks and what completion costs.", "arxiv_id": "2611.28231", "arxiv_url": "https://arxiv.org/abs/2611.28231", "authors": ["Suleman Khan", "Rasa Rahnema", "Tara Khani", "Majid Fekri", "Fattane Zarrinkalam"], "brief": "\u5728\u9700\u9690\u5f0f\u8c03\u7528\u8bb0\u5fc6\u7684\u804c\u573a\u4efb\u52a1\u4e2d\u8bc4\u6d4bMemanto\uff0c\u5b8c\u6210\u7387\u8fbe83.83%\uff0c\u6210\u672c\u4e0e\u5ef6\u8fdf\u66f4\u4f4e\uff1b\u4f46\u6a21\u578b\u4e0d\u540c\uff0c\u7ed3\u679c\u53cd\u6620\u6574\u5957\u7cfb\u7edf\u5dee\u5f02\u3002", "categories": ["cs.IR", "cs.AI"], "github_repo": "https://github.com/moorcheh-ai/memanto-benchmark", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.28231", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bb0\u5fc6", "\u76f8\u5173\u6027\u6392\u5e8f", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Moorcheh.ai", "pdf_url": "https://arxiv.org/pdf/2611.28231v1", "published_at": "2026-11-20", "score": 0.053, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28231.png", "title": "Evaluating Memanto on DolphinBench for AI Agents", "tldr": "\u5728\u9700\u9690\u5f0f\u8c03\u7528\u8bb0\u5fc6\u7684\u804c\u573a\u4efb\u52a1\u4e2d\u8bc4\u6d4bMemanto\uff0c\u5b8c\u6210\u7387\u8fbe83.83%\uff0c\u6210\u672c\u4e0e\u5ef6\u8fdf\u66f4\u4f4e\uff1b\u4f46\u6a21\u578b\u4e0d\u540c\uff0c\u7ed3\u679c\u53cd\u6620\u6574\u5957\u7cfb\u7edf\u5dee\u5f02\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Many pan-sharpening (PS) networks reconstruct high-resolution multispectral (HRMS) images by adding learned residuals to 4$\\times$-interpolated low-resolution multispectral (LRMS) inputs, incorporating panchromatic (PAN) detail only through these residual corrections. This raises a simple question: Why start with a blurry base when sharp spatial detail is already available? We propose PanBase, a sharper multispectral starting point designed for more effective residual learning. Guided by physical sensor characteristics, PanBase combines PAN spatial detail with LRMS spectral information while enforcing consistency with the LRMS observations under sensor-specific blur. We construct this base without neural network training, estimating only nine coefficients per spectral band through closed-form calibration. Our PanBase can be easily integrated into existing backbones with a global residual skip through two simple changes: (i) replacing the skip base with PanBase and (ii) concatenating it as an additional input. Using each backbone\u0027s original training recipe and matched training budgets, PanBase improves most reduced- and full-resolution metrics on WorldView-3, QuickBird, and GaoFen-2, while achieving 4.4$\\times$ faster training convergence on average. In zero-shot evaluation on WorldView-2, standalone PanBase achieves competitive reconstruction without target-sensor fitting or neural refinement.", "arxiv_id": "2611.32002", "arxiv_url": "https://arxiv.org/abs/2611.32002", "authors": ["Jeonghyeok Do", "Geunhyuk Youk", "Munchurl Kim"], "brief": "\u63d0\u51faPanBase\uff0c\u4ee5\u5168\u8272\u7ec6\u8282\u548c\u591a\u5149\u8c31\u4fe1\u606f\u6784\u5efa\u65e0\u9700\u8bad\u7ec3\u7684\u6e05\u6670\u5e95\u56fe\uff0c\u66ff\u6362\u73b0\u6709\u7f51\u7edc\u7684\u6a21\u7cca\u57fa\u5e95\uff1b\u63d0\u5347\u591a\u6570\u878d\u5408\u6307\u6807\uff0c\u8bad\u7ec3\u6536\u655b\u5e73\u5747\u52a0\u5feb4.4\u500d\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/KAIST-VICLab/PanBase", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.32002", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9065\u611f\u5f71\u50cf", "\u5168\u8272\u9510\u5316", "\u6b8b\u5dee\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "KAIST VIClab (Prof. Munchurl Kim)", "pdf_url": "https://arxiv.org/pdf/2611.32002v1", "published_at": "2026-11-24", "score": 0.05, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.32002.png", "title": "Change the Base, Change the Game: Rethinking Pan-sharpening", "tldr": "\u63d0\u51faPanBase\uff0c\u4ee5\u5168\u8272\u7ec6\u8282\u548c\u591a\u5149\u8c31\u4fe1\u606f\u6784\u5efa\u65e0\u9700\u8bad\u7ec3\u7684\u6e05\u6670\u5e95\u56fe\uff0c\u66ff\u6362\u73b0\u6709\u7f51\u7edc\u7684\u6a21\u7cca\u57fa\u5e95\uff1b\u63d0\u5347\u591a\u6570\u878d\u5408\u6307\u6807\uff0c\u8bad\u7ec3\u6536\u655b\u5e73\u5747\u52a0\u5feb4.4\u500d\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Proactive assistants that guide people through physical tasks must decide, every few seconds, whether a step is complete and whether a mistake has occurred. We find that two benchmarks for this task largely reward knowing when rather than seeing what: a timer that never looks at the video, raising an alarm at 25 s and confirming each step at 30 s, reaches a mistake F1 of 0.373 on Ego-MC-Bench, above every published result (at most 0.27). We formalize this as the video-blind frontier, the best trade-off between completion accuracy and mistake F1 that policies reach from the elapsed time, the instruction and training statistics alone: every published per-step result on Ego-MC-Bench lies inside it, and so do all twelve zero-shot models we run on QICD. To move beyond it, we introduce Evidence-Contrastive Training (ECT): fine-tune on the benchmark\u0027s own questions, and pair its positives with negatives from the same recording at the same elapsed time, so that elapsed time cannot separate the two sides of a pair. Trained on 209 QICD videos in about 15 GPU-hours, a 2B model with ECT crosses the frontier on both benchmarks in all four seeds; transferred to Ego-MC-Bench without adaptation, it confirms 59% of mistake-free steps in time, against 30% for a published model with the same backbone trained on about 25k synthetic counterfactuals and real recordings. Its decisions follow the video beyond what timing explains: at equal elapsed time it tells a finished step from an unfinished one in 90-92% of test pairs, where the instruction\u0027s typical duration reaches 65%, rescaling the time stamps between the frames leaves it essentially unchanged, and swapping in another recording, of the same recipe where one exists, cuts its completion accuracy by two thirds. The code and model weights will be publicly released.", "arxiv_id": "2611.30895", "arxiv_url": "https://arxiv.org/abs/2611.30895", "authors": ["Bohe Chen"], "brief": "\u7814\u7a76\u53d1\u73b0\u4e3b\u52a8\u4efb\u52a1\u52a9\u624b\u8bc4\u6d4b\u53ef\u88ab\u8ba1\u65f6\u7b56\u7565\u53d6\u5de7\uff0c\u63d0\u51fa\u8bc1\u636e\u5bf9\u6bd4\u8bad\u7ec3\u8feb\u4f7f\u6a21\u578b\u4f9d\u8d56\u89c6\u9891\u3002\u4ec5\u7528209\u6bb5\u89c6\u9891\u8bad\u7ec3\u76842B\u6a21\u578b\u7a81\u7834\u8ba1\u65f6\u57fa\u7ebf\uff0c\u8de8\u6570\u636e\u96c6\u53ca\u65f6\u786e\u8ba4\u7387\u8fbe59%\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/bhc6/speak-when-you-see-it", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.30895", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e3b\u52a8\u52a9\u624b", "\u89c6\u9891\u7406\u89e3", "\u5bf9\u6bd4\u5b66\u4e60", "\u8bc4\u6d4b\u504f\u5dee"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30895v1", "published_at": "2026-11-23", "score": 0.049, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30895.png", "title": "Speak When You See It: Proactive Task Assistants Should Wait for Evidence, Not the Clock", "tldr": "\u7814\u7a76\u53d1\u73b0\u4e3b\u52a8\u4efb\u52a1\u52a9\u624b\u8bc4\u6d4b\u53ef\u88ab\u8ba1\u65f6\u7b56\u7565\u53d6\u5de7\uff0c\u63d0\u51fa\u8bc1\u636e\u5bf9\u6bd4\u8bad\u7ec3\u8feb\u4f7f\u6a21\u578b\u4f9d\u8d56\u89c6\u9891\u3002\u4ec5\u7528209\u6bb5\u89c6\u9891\u8bad\u7ec3\u76842B\u6a21\u578b\u7a81\u7834\u8ba1\u65f6\u57fa\u7ebf\uff0c\u8de8\u6570\u636e\u96c6\u53ca\u65f6\u786e\u8ba4\u7387\u8fbe59%\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Contrastive decoding (CD) mitigates object hallucination in multimodal large language models (MLLMs) by contrasting token distributions under different conditions to adjust token scores. However, existing generative and discriminative benchmarks primarily measure final task scores, which can be confounded by candidate filtering, changes in generation trajectories, and response biases, making it difficult to isolate the effects of the underlying contrastive adjustments. To address these limitations while complementing existing evaluations, we introduce CONCOR (Contrastive Correction Evaluation), a controlled benchmark that directly evaluates the competition between ground-truth and different types of hallucinated candidates using the Contrastive Grounding Margin (CGM). CGM also enables analysis of directional consistency, composition, and reliability of contrastive corrections. Our evaluation reveals that existing CD methods exhibit distinct correction behaviors: some consistently favor ground-truth candidates, whereas others produce strong corrections but also introduce more errors. Crucially, these differences help explain their contrasting responses to increased contrast strength, which improves some methods while degrading others. These findings highlight the importance of evaluating the contrastive correction itself, rather than relying solely on final-output performance, and CONCOR provides a controlled and interpretable framework for understanding and improving CD methods for hallucination mitigation.", "arxiv_id": "2611.30460", "arxiv_url": "https://arxiv.org/abs/2611.30460", "authors": ["Ting Chen", "Geng Li", "Guohao Chen", "Hanjia Lyu"], "brief": "\u63d0\u51faCONCOR\u57fa\u51c6\uff0c\u76f4\u63a5\u8861\u91cf\u5bf9\u6bd4\u89e3\u7801\u5bf9\u771f\u5b9e\u4e0e\u5e7b\u89c9\u5019\u9009\u7684\u7ea0\u6b63\u6548\u679c\uff1b\u53d1\u73b0\u4e0d\u540c\u65b9\u6cd5\u7684\u7ea0\u9519\u53ef\u9760\u6027\u5b58\u5728\u5dee\u5f02\uff0c\u89e3\u91ca\u4e86\u589e\u5f3a\u5bf9\u6bd4\u5f3a\u5ea6\u4e3a\u4f55\u6709\u65f6\u6539\u5584\u3001\u6709\u65f6\u635f\u5bb3\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30460", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5bf9\u6bd4\u89e3\u7801", "\u89c6\u89c9\u5e7b\u89c9", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": "Singapore Management University", "pdf_url": "https://arxiv.org/pdf/2611.30460v2", "published_at": "2026-11-23", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30460.png", "title": "CONCOR: Benchmarking Contrastive Decoding for Visual Hallucination Mitigation Beyond Final-Output Performance", "tldr": "\u63d0\u51faCONCOR\u57fa\u51c6\uff0c\u76f4\u63a5\u8861\u91cf\u5bf9\u6bd4\u89e3\u7801\u5bf9\u771f\u5b9e\u4e0e\u5e7b\u89c9\u5019\u9009\u7684\u7ea0\u6b63\u6548\u679c\uff1b\u53d1\u73b0\u4e0d\u540c\u65b9\u6cd5\u7684\u7ea0\u9519\u53ef\u9760\u6027\u5b58\u5728\u5dee\u5f02\uff0c\u89e3\u91ca\u4e86\u589e\u5f3a\u5bf9\u6bd4\u5f3a\u5ea6\u4e3a\u4f55\u6709\u65f6\u6539\u5584\u3001\u6709\u65f6\u635f\u5bb3\u8868\u73b0\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Image analogy transfers a demonstrated transformation from a before/after pair (A, A\u0027) to a new query image B. Existing methods assume all changes in (A, A\u0027) should be fully transferred, limiting flexibility when users want only a subset of the demonstrated edits. We introduce Selective Image Analogy (SIA), a new setting where a single demonstration pair encodes multiple edits, and the user selects at inference time which edits to apply to B. To support this, we curate a multi-edit analogy dataset with full-edit and partial-edit targets. We then train a model that first learns to transfer the complete demonstrated transformation, and then gains selective control through a mask-aligned suppression mechanism: a token-gated LoRA that restricts adapter updates to suppressed edit tokens during denoising, paired with a concept suppression vector that weakens the selected tokens in the text embeddings before denoising. Together, these components allow SIA to suppress unwanted edits that remain visible in A\u0027, while preserving the user-selected ones, all without requiring a new demonstration pair for each edit combination. We perform extensive quantitative and qualitative evaluations along with user studies to demonstrate the efficacy of our approach.", "arxiv_id": "2611.33894", "arxiv_url": "https://arxiv.org/abs/2611.33894", "authors": ["Amirhossein Alimohammadi", "Kian Izadpanah", "Bardiya Kariminia", "Yiorgos Chrysanthou", "Ali Mahdavi-Amiri"], "brief": "\u63d0\u51fa\u9009\u62e9\u6027\u56fe\u50cf\u7c7b\u6bd4\uff0c\u8ba9\u7528\u6237\u4ece\u5355\u7ec4\u793a\u4f8b\u7684\u591a\u9879\u7f16\u8f91\u4e2d\u6309\u9700\u8fc1\u79fb\uff1b\u901a\u8fc7\u95e8\u63a7LoRA\u4e0e\u6982\u5ff5\u6291\u5236\u8fc7\u6ee4\u65e0\u5173\u7f16\u8f91\uff0c\u5b9a\u91cf\u8bc4\u4f30\u548c\u7528\u6237\u7814\u7a76\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": "https://github.com/alimohammadiamirhossein/selective-image-analogy", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.33894", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u8fc1\u79fb\u5b66\u4e60", "\u6269\u6563\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Simon Fraser University", "pdf_url": "https://arxiv.org/pdf/2611.33894v1", "published_at": "2026-11-25", "score": 0.045, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33894.png", "title": "SIA: Selective Image Analogy", "tldr": "\u63d0\u51fa\u9009\u62e9\u6027\u56fe\u50cf\u7c7b\u6bd4\uff0c\u8ba9\u7528\u6237\u4ece\u5355\u7ec4\u793a\u4f8b\u7684\u591a\u9879\u7f16\u8f91\u4e2d\u6309\u9700\u8fc1\u79fb\uff1b\u901a\u8fc7\u95e8\u63a7LoRA\u4e0e\u6982\u5ff5\u6291\u5236\u8fc7\u6ee4\u65e0\u5173\u7f16\u8f91\uff0c\u5b9a\u91cf\u8bc4\u4f30\u548c\u7528\u6237\u7814\u7a76\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) typically relies on a verifier that can reliably judge whether sampled solutions are correct. However, in many realistic settings, complete verification is generally unavailable, while cheap checks can only falsify failures. We formalize this regime as one-sided verifiability (OSV): verified negatives are reliable counterexamples, but verified positives are merely non-falsified candidates and may contain many false positives. This asymmetry makes standard RLVR unreliable, because reinforcing verified positives can directly reward shortcuts that pass partial checks. To address this issue, we propose Negative-Only Policy Optimization (NOPO), which treats verified positives as unlabeled and updates the policy only by suppressing trusted verified negatives. Specifically, NOPO combines a reference-relative negative suppression loss with a group-level adapter that scales each update by the proportion of non-falsified responses. Across unit-test, constraint-check, and LLM self-verifiers, NOPO improves pass@k over baselines on code, logic, and math benchmarks when oracle rewards are unavailable. These gains persist under inference-time scaling and cross-benchmark transfer.", "arxiv_id": "2611.17287", "arxiv_url": "https://arxiv.org/abs/2611.17287", "authors": ["Jiacheng Xu", "Shuo He", "Fuxiang Zhang", "Chaojie Wang", "Bo An"], "brief": "\u63d0\u51fa\u4ec5\u6291\u5236\u53ef\u9760\u8d1f\u4f8b\u7684\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u907f\u514d\u4e0d\u5b8c\u6574\u9a8c\u8bc1\u8bef\u5956\u9519\u8bef\u7b54\u6848\uff1b\u5728\u4ee3\u7801\u3001\u903b\u8f91\u548c\u6570\u5b66\u4efb\u52a1\u4e0a\u63d0\u5347\u901a\u8fc7\u7387\uff0c\u4e14\u652f\u6301\u63a8\u7406\u6269\u5c55\u4e0e\u8de8\u57fa\u51c6\u8fc1\u79fb\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17287", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u9a8c\u8bc1", "\u7b56\u7565\u4f18\u5316"], "num_comments": 3, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.17287v1", "published_at": "2026-11-12", "score": 0.045, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17287.png", "title": "Negative-Only Policy Optimization for One-Sided Verifiable Rewards", "tldr": "\u63d0\u51fa\u4ec5\u6291\u5236\u53ef\u9760\u8d1f\u4f8b\u7684\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u907f\u514d\u4e0d\u5b8c\u6574\u9a8c\u8bc1\u8bef\u5956\u9519\u8bef\u7b54\u6848\uff1b\u5728\u4ee3\u7801\u3001\u903b\u8f91\u548c\u6570\u5b66\u4efb\u52a1\u4e0a\u63d0\u5347\u901a\u8fc7\u7387\uff0c\u4e14\u652f\u6301\u63a8\u7406\u6269\u5c55\u4e0e\u8de8\u57fa\u51c6\u8fc1\u79fb\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Decision models are language models fine-tuned to return a probability for each option of a typed query, which routers and guardrails threshold directly. They are built on multilingual bases but ranked almost entirely in English. We evaluate 25 top-ranked open-weight decision models on 17 tasks in 14 languages, comparing each language with English on parallel items. Every model loses accuracy in every language, from about 2 points in high-resource languages to 8 in Tamil, while confidence falls only half as much: a threshold set for 95\\% accuracy in English yields 90% in Tamil. The size of the loss is set by the language and the base model rather than by leaderboard rank. In 81 controlled fine-tuning runs, task skill learned in English transfers to other languages and a few thousand target-language items narrow large losses, but neither more data nor full-parameter tuning closes them. Finally, the same test items are answered more accurately in all 23 benchmark--language pairs we compare when an LLM rather than a person translated them, so LLM-translated test sets understate the gap.", "arxiv_id": "2611.33307", "arxiv_url": "https://arxiv.org/abs/2611.33307", "authors": ["Mingzhe Du", "Thong Thanh Nguyen", "Nguyen Tran Cong Duy", "See-Kiong Ng", "Luu Anh Tuan"], "brief": "\u8bc4\u6d4b25\u4e2a\u51b3\u7b56\u6a21\u578b\u53d1\u73b0\uff0c\u591a\u8bed\u8a00\u51c6\u786e\u7387\u4e0b\u964d\u800c\u7f6e\u4fe1\u5ea6\u964d\u5e45\u4e0d\u8db3\uff0c\u82f1\u8bed\u9608\u503c\u96be\u4ee5\u8fc1\u79fb\uff1b\u5c11\u91cf\u76ee\u6807\u8bed\u8a00\u6570\u636e\u53ef\u7f29\u5c0f\u5dee\u8ddd\uff0c\u673a\u5668\u7ffb\u8bd1\u6d4b\u8bd5\u96c6\u5219\u4f4e\u4f30\u5dee\u8ddd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33307", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u8bed\u8a00\u8bc4\u6d4b", "\u51b3\u7b56\u6a21\u578b", "\u7f6e\u4fe1\u5ea6\u6821\u51c6", "\u8de8\u8bed\u8a00\u8fc1\u79fb"], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.33307v1", "published_at": "2026-11-24", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33307.png", "title": "Lost in Translation, Not in Confidence: Benchmarking and Calibrating Multilingual Decision Models", "tldr": "\u8bc4\u6d4b25\u4e2a\u51b3\u7b56\u6a21\u578b\u53d1\u73b0\uff0c\u591a\u8bed\u8a00\u51c6\u786e\u7387\u4e0b\u964d\u800c\u7f6e\u4fe1\u5ea6\u964d\u5e45\u4e0d\u8db3\uff0c\u82f1\u8bed\u9608\u503c\u96be\u4ee5\u8fc1\u79fb\uff1b\u5c11\u91cf\u76ee\u6807\u8bed\u8a00\u6570\u636e\u53ef\u7f29\u5c0f\u5dee\u8ddd\uff0c\u673a\u5668\u7ffb\u8bd1\u6d4b\u8bd5\u96c6\u5219\u4f4e\u4f30\u5dee\u8ddd\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "In-context learning (ICL) enables foundation models to perform unseen tasks from context without parameter updates. In robotic manipulation, a human video provides the context that specifies how a task should be performed. However, scaling human-video ICL on world-action models (WAMs) faces two challenges: task-level human-robot pairs are not temporally aligned with robot actions, and standard action losses allow policies to rely on initial-scene or task-identity shortcuts rather than tracking the context. We present Entangle, an in-context world-action model that maps a single human video and current robot observations to future visual states and executable actions. To scale temporally aligned training data, we convert recorded robot videos into matched human contexts via video-to-video generation, supplemented by real paired recordings. For model training, we combine variable-length video windows with an intra-task contrastive objective that distinguishes the paired action trajectory from other executions of the same task, preventing task-identity shortcuts. Without task-specific fine-tuning, Entangle improves steadily as aligned training data scales, reaching an average score of 83.5/100 across six unseen tasks on an Astribot S1 robot, and achieves a 69.5% average success rate on seven unseen RoboTwin tasks, outperforming Zero-WAM by 22.6 percentage points. Under Context-OOD, although trained only on scene-aligned pairs, Entangle transfers context-specified behaviors across rearranged layouts and substituted tools. Project page at https://entangle-robotics.github.io/", "arxiv_id": "2611.28732", "arxiv_url": "https://arxiv.org/abs/2611.28732", "authors": ["Chendong Xiang", "Chengwen Zhang", "Ruowen Zhao", "Zeyuan Wang", "Shuhe Huang", "Rongxu Cui", "Min Zhao", "Fan Bao", "Hengkai Tan", "Jun Zhu"], "brief": "Entangle\u901a\u8fc7\u751f\u6210\u5bf9\u9f50\u7684\u4eba\u7c7b\u89c6\u9891\u548c\u4efb\u52a1\u5185\u5bf9\u6bd4\u5b66\u4e60\uff0c\u8ba9\u673a\u5668\u4eba\u4ec5\u51ed\u5355\u6bb5\u89c6\u9891\u6267\u884c\u65b0\u4efb\u52a1\uff1b\u65e0\u9700\u5fae\u8c03\uff0c\u4eff\u771f\u6210\u529f\u7387\u8fbe69.5%\uff0c\u5e76\u80fd\u8fc1\u79fb\u81f3\u65b0\u5e03\u5c40\u548c\u5de5\u5177\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28732", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u63a7", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.28732v2", "published_at": "2026-11-21", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28732.png", "title": "Entangle: Scaling Human-Video In-Context World-Action Models across Unseen Tasks and Contexts", "tldr": "Entangle\u901a\u8fc7\u751f\u6210\u5bf9\u9f50\u7684\u4eba\u7c7b\u89c6\u9891\u548c\u4efb\u52a1\u5185\u5bf9\u6bd4\u5b66\u4e60\uff0c\u8ba9\u673a\u5668\u4eba\u4ec5\u51ed\u5355\u6bb5\u89c6\u9891\u6267\u884c\u65b0\u4efb\u52a1\uff1b\u65e0\u9700\u5fae\u8c03\uff0c\u4eff\u771f\u6210\u529f\u7387\u8fbe69.5%\uff0c\u5e76\u80fd\u8fc1\u79fb\u81f3\u65b0\u5e03\u5c40\u548c\u5de5\u5177\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Entity disambiguation (mapping ambiguous mentions in text to entities in a knowledge base) is a foundational step in tasks such as knowledge graph construction, question answering, and information extraction. Recent work has applied LLMs to this problem, achieving stateof-the-art performance. Notably, reasoning LLMs have been shown to perform entity disambiguation in a true zero-shot fashion, generalizing across knowledge bases and domains. However, it is unclear whether this capability survives, or remains competitive, with smaller LLMs, where entity disambiguation has typically relied on reranking rather than reasoning. We ask when reasoning is worth its cost at small scale. We compare pointwise, listwise, and reasoning-based candidate-selection components within a classical coarse-to-fine entity disambiguation pipeline, across the classical, few-shot and true zero-shot settings. The reasoning paradigm is trained with distillation and reinforcement learning recipes. The benefit of reasoning grows with domain shift: negligible in-domain, decisive in the true zero-shot setting. We show that two distinct factors are at work: the reranker\u0027s uncertainty over the candidates locates where the paradigms disagree, while shift governs which is right when they do.", "arxiv_id": "2611.30334", "arxiv_url": "https://arxiv.org/abs/2611.30334", "authors": ["Samy Haffoudhi", "Fabian M Suchanek", "Nils Holzenberger"], "brief": "\u6bd4\u8f83\u5c0f\u578b\u8bed\u8a00\u6a21\u578b\u5728\u5b9e\u4f53\u6d88\u6b67\u4e2d\u7684\u91cd\u6392\u5e8f\u4e0e\u63a8\u7406\u7b56\u7565\uff0c\u53d1\u73b0\u63a8\u7406\u5728\u57df\u5185\u6536\u76ca\u751a\u5fae\uff0c\u4f46\u5728\u771f\u6b63\u96f6\u6837\u672c\u573a\u666f\u4f18\u52bf\u663e\u8457\uff1b\u91cd\u6392\u5e8f\u4e0d\u786e\u5b9a\u6027\u5b9a\u4f4d\u5206\u6b67\uff0c\u57df\u504f\u79fb\u51b3\u5b9a\u8c01\u66f4\u51c6\u786e\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/samyhaff/ed-study", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.30334", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5b9e\u4f53\u6d88\u6b67", "\u5c0f\u578b\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u57df\u504f\u79fb"], "num_comments": 2, "on_hf": true, "organization": "Telecom Paris", "pdf_url": "https://arxiv.org/pdf/2611.30334v1", "published_at": "2026-11-23", "score": 0.042, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30334.png", "title": "When Does Reasoning Help Entity Disambiguation? Small LLMs In-Domain and Under Shift", "tldr": "\u6bd4\u8f83\u5c0f\u578b\u8bed\u8a00\u6a21\u578b\u5728\u5b9e\u4f53\u6d88\u6b67\u4e2d\u7684\u91cd\u6392\u5e8f\u4e0e\u63a8\u7406\u7b56\u7565\uff0c\u53d1\u73b0\u63a8\u7406\u5728\u57df\u5185\u6536\u76ca\u751a\u5fae\uff0c\u4f46\u5728\u771f\u6b63\u96f6\u6837\u672c\u573a\u666f\u4f18\u52bf\u663e\u8457\uff1b\u91cd\u6392\u5e8f\u4e0d\u786e\u5b9a\u6027\u5b9a\u4f4d\u5206\u6b67\uff0c\u57df\u504f\u79fb\u51b3\u5b9a\u8c01\u66f4\u51c6\u786e\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Group-based reinforcement learning with verifiable rewards often yields all-fail groups on long-horizon agent tasks: every sampled trajectory receives zero reward, leaving group-relative methods without a reward-based policy gradient. A common remedy supplies complete solutions from a stronger model, but full trajectories are expensive and expose the learner to long off-policy histories. We introduce SPLICE, which constructs local training targets from failed current-policy trajectories online. For each all-fail group, a proposal model selects a splice point in a current-policy trajectory and generates several bounded options from that point. We estimate each option\u0027s value using repeated current-policy continuations, convert positive estimates into a return-weighted local target, and fit the current policy on the options. We evaluate SPLICE across two policy families on two long-horizon agent tasks, Software Engineering with SWE-bench Verified and Deep Research with BrowseComp-Plus. SPLICE outperforms GRPO and full-trajectory guidance baselines in all four settings, improving over GRPO by 2.8--9.8 percentage points. On initially failed SWE tasks, it raises GRPO\u0027s graduation rate by 10.8 percentage points. Further experiments show that SPLICE improves performance while reducing costly proposal-model computation.", "arxiv_id": "2611.34777", "arxiv_url": "https://arxiv.org/abs/2611.34777", "authors": ["Haowen Hou", "Yicheng Liu", "Zhen Huang", "Jiaqi Wang"], "brief": "SPLICE\u901a\u8fc7\u5931\u8d25\u8f68\u8ff9\u7684\u5c40\u90e8\u9009\u9879\u4e0e\u7eed\u8dd1\u4f30\u503c\u8bad\u7ec3\u667a\u80fd\u4f53\uff0c\u5728\u4e24\u7c7b\u957f\u7a0b\u4efb\u52a1\u4e0a\u8f83GRPO\u63d0\u53472.8\u20149.8\u4e2a\u767e\u5206\u70b9\uff0c\u540c\u65f6\u51cf\u5c11\u6307\u5bfc\u6a21\u578b\u8ba1\u7b97\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34777", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1", "\u7b56\u7565\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2611.34777v1", "published_at": "2026-11-25", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34777.png", "title": "When Every Rollout Fails: Splicing Learner-Conditioned Options into Long-Horizon Agent RL", "tldr": "SPLICE\u901a\u8fc7\u5931\u8d25\u8f68\u8ff9\u7684\u5c40\u90e8\u9009\u9879\u4e0e\u7eed\u8dd1\u4f30\u503c\u8bad\u7ec3\u667a\u80fd\u4f53\uff0c\u5728\u4e24\u7c7b\u957f\u7a0b\u4efb\u52a1\u4e0a\u8f83GRPO\u63d0\u53472.8\u20149.8\u4e2a\u767e\u5206\u70b9\uff0c\u540c\u65f6\u51cf\u5c11\u6307\u5bfc\u6a21\u578b\u8ba1\u7b97\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Fully online on-policy distillation (OPD) is costly for long-horizon agents because each update depends on fresh environment rollouts. Prefix replay offers an efficient alternative by sampling current-student responses from stored histories, reducing idle time for long-tail rollouts and allowing each collected trajectory to support multiple updates. However, our analysis of the complete prefix replay pipeline identifies two limitations in long-horizon settings. In trajectory collection, teacher-only trajectories miss student-induced histories, while broader history coverage can reduce teacher reliability. In trajectory reuse, fixed position-based schedules cannot identify critical decisions that may occur at any trajectory depth. We introduce CARE-OPD (Collect for coverAge, Replay with Evidence) to address both limitations. Student-seeded teacher completions and response-level confidence gating expand history coverage while filtering unreliable updates. Hindsight replay allocation then uses downstream execution evidence to select consequential turns. Across long-horizon tasks Software Engineering and Deep Research, CARE-OPD outperforms online OPD and prior prefix replay baselines. On SWE-bench Verified, it raises task success to 59.5% while reducing end-to-end training time by 45% and environment actions by 44% relative to asynchronous online OPD.", "arxiv_id": "2611.34756", "arxiv_url": "https://arxiv.org/abs/2611.34756", "authors": ["Haowen Hou", "Gen Li", "Ruilin Li", "Yicheng Liu", "Zhen Huang", "Shuai Dong", "Congcong Wang", "Kaiwen Tuo", "Hongrui Wu", "Zelin Peng", "Kanghui Tian", "Ji Zhao", "Dianyi Wang", "Jiaqi Wang"], "brief": "CARE-OPD\u7ed3\u5408\u5b66\u751f\u5386\u53f2\u8986\u76d6\u3001\u6559\u5e08\u7f6e\u4fe1\u8fc7\u6ee4\u4e0e\u6267\u884c\u8bc1\u636e\u56de\u653e\u4f18\u5316\u957f\u7a0b\u667a\u80fd\u4f53\u84b8\u998f\uff0c\u4efb\u52a1\u6210\u529f\u7387\u8fbe59.5%\uff0c\u8bad\u7ec3\u65f6\u95f4\u51cf\u5c1145%\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34756", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u667a\u80fd\u4f53", "\u7ecf\u9a8c\u56de\u653e"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2611.34756v1", "published_at": "2026-11-25", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34756.png", "title": "Collect for Coverage, Replay with Evidence: Adaptive and Efficient On-Policy Distillation for Long-Horizon Agents", "tldr": "CARE-OPD\u7ed3\u5408\u5b66\u751f\u5386\u53f2\u8986\u76d6\u3001\u6559\u5e08\u7f6e\u4fe1\u8fc7\u6ee4\u4e0e\u6267\u884c\u8bc1\u636e\u56de\u653e\u4f18\u5316\u957f\u7a0b\u667a\u80fd\u4f53\u84b8\u998f\uff0c\u4efb\u52a1\u6210\u529f\u7387\u8fbe59.5%\uff0c\u8bad\u7ec3\u65f6\u95f4\u51cf\u5c1145%\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Scaling robot learning requires demonstrations that combine realistic visual observations with reliable action supervision. Simulation-based synthesis faces a substantial visual gap relative to real environments, while video-only generation struggles to maintain physically consistent interactions and provide aligned action labels. We present DemoFoundry, an automated framework that couples coding agents with generative rendering to synthesize photorealistic and physically grounded robot demonstrations. Coding agents both construct aligned real--proxy video pairs from existing robot episodes to train a video renderer and write executable interaction programs to generate new demonstrations. Given a scene reference and task instruction, an agent reconstructs task-relevant geometry and writes a control program without requiring target-task human demonstrations. Program execution in a physics simulator produces proxy videos with aligned robot states and actions. The video renderer translates these proxy videos into scene-consistent, photorealistic observations, reducing the need for detailed appearance modeling in each scene. Automated task-execution checks select successful trajectories for rendering and policy learning. Experiments show improved visual quality and action--video consistency. Policies trained on the generated demonstrations outperform raw-simulation training and approach the performance of training on an equal number of real demonstrations.", "arxiv_id": "2611.34671", "arxiv_url": "https://arxiv.org/abs/2611.34671", "authors": ["Ruixiang Wang", "Xinyue Yao", "Xuanning Zhou", "Yueci Deng", "Yongyi Su", "Kui Jia"], "brief": "DemoFoundry\u7ed3\u5408\u7f16\u7a0b\u667a\u80fd\u4f53\u3001\u7269\u7406\u4eff\u771f\u4e0e\u751f\u6210\u5f0f\u6e32\u67d3\uff0c\u81ea\u52a8\u5408\u6210\u903c\u771f\u4e14\u52a8\u4f5c\u5bf9\u9f50\u7684\u673a\u5668\u4eba\u793a\u8303\uff1b\u8bad\u7ec3\u7b56\u7565\u4f18\u4e8e\u539f\u59cb\u4eff\u771f\uff0c\u63a5\u8fd1\u7b49\u91cf\u771f\u5b9e\u793a\u8303\u7684\u6548\u679c\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34671", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u751f\u6210\u5f0f\u6e32\u67d3", "\u5408\u6210\u6570\u636e"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34671v1", "published_at": "2026-11-25", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34671.png", "title": "DemoFoundry: Toward Scalable Photorealistic Robot Data with Coding Agents and Generative Rendering", "tldr": "DemoFoundry\u7ed3\u5408\u7f16\u7a0b\u667a\u80fd\u4f53\u3001\u7269\u7406\u4eff\u771f\u4e0e\u751f\u6210\u5f0f\u6e32\u67d3\uff0c\u81ea\u52a8\u5408\u6210\u903c\u771f\u4e14\u52a8\u4f5c\u5bf9\u9f50\u7684\u673a\u5668\u4eba\u793a\u8303\uff1b\u8bad\u7ec3\u7b56\u7565\u4f18\u4e8e\u539f\u59cb\u4eff\u771f\uff0c\u63a5\u8fd1\u7b49\u91cf\u771f\u5b9e\u793a\u8303\u7684\u6548\u679c\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) for text-to-SQL agents pays a query when its result matches the reference on one database. However, a wrong query can match by luck when the data lack the rows that expose its bug. We study a counterfactual-database (CF) reward that also runs the final query on a few hidden, code-generated copies of the database and pays only if all results match (strict form) or by the share matched (mean form). On 1,302 synthetic audit questions, the strict form lowers the share of buggy queries paid in full from 29.5% to 16.8% and of reward hacks from 54.1% to 1.9%, rejecting 0 of 2,847 correct queries; copies from a family-blind generator do about as well. In a controlled GRPO comparison on a 3.35B model with three seeds per arm, training on the mean form did not improve in-domain accuracy (8.4% vs 11.7%), because the two rewards disagreed on only 5-7% of rollouts; on Spider it gained 1.6 points. One seed reverses both signs, so single-seed reward comparisons mislead. Code: https://github.com/RishiiGamer2201/counterfactual-sql-rewards ; data, models, demo: https://huggingface.co/counterfactual-sql", "arxiv_id": "2611.34363", "arxiv_url": "https://arxiv.org/abs/2611.34363", "authors": ["Shreshth Rai", "Rishii Kumar Singh", "Aksh Aggarwal"], "brief": "\u63d0\u51fa\u5728\u53cd\u4e8b\u5b9e\u6570\u636e\u5e93\u526f\u672c\u4e0a\u6267\u884c\u67e5\u8be2\u7684\u5956\u52b1\u673a\u5236\uff0c\u5c06\u5956\u52b1\u4f5c\u5f0a\u7387\u4ece54.1%\u964d\u81f31.9%\uff0c\u4e14\u672a\u8bef\u62d2\u6b63\u786e\u67e5\u8be2\uff1b\u4f46\u8bad\u7ec3\u6536\u76ca\u6709\u9650\uff0c\u591a\u968f\u673a\u79cd\u5b50\u7ed3\u679c\u663e\u793a\u6548\u679c\u4e0d\u7a33\u5b9a\u3002", "categories": ["cs.LG", "cs.CL", "cs.DB"], "github_repo": "https://github.com/RishiiGamer2201/counterfactual-sql-rewards", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34363", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u6587\u672c\u8f6cSQL", "\u5956\u52b1\u4f5c\u5f0a", "\u53cd\u4e8b\u5b9e\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "Counterfactual SQL Rewards", "pdf_url": "https://arxiv.org/pdf/2611.34363v1", "published_at": "2026-11-25", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34363.png", "title": "Single-Database Rewards Are Hackable: Counterfactual Execution for Trustworthy Text-to-SQL RL", "tldr": "\u63d0\u51fa\u5728\u53cd\u4e8b\u5b9e\u6570\u636e\u5e93\u526f\u672c\u4e0a\u6267\u884c\u67e5\u8be2\u7684\u5956\u52b1\u673a\u5236\uff0c\u5c06\u5956\u52b1\u4f5c\u5f0a\u7387\u4ece54.1%\u964d\u81f31.9%\uff0c\u4e14\u672a\u8bef\u62d2\u6b63\u786e\u67e5\u8be2\uff1b\u4f46\u8bad\u7ec3\u6536\u76ca\u6709\u9650\uff0c\u591a\u968f\u673a\u79cd\u5b50\u7ed3\u679c\u663e\u793a\u6548\u679c\u4e0d\u7a33\u5b9a\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "AI monitors, classifiers that flag dangerous behaviour by AI agents, are often evaluated against transcripts generated by attack policies acting as proxies for dangerous behaviour in deployment. We evaluate an ex-production OpenAI monitor as a case study and find that measured false negative rate is highly sensitive to both the method used to generate attack policies and the level of optimisation applied within that method. This rate ranged from 0.5\\% to 20.8\\% across optimisation levels of a single method (reinforcement learning), and from 6.4\\% to 23.0\\% across methods at their best observed optimisation level (optimised prompting vs.\\ transcript editing). Every attack policy was developed against proxy monitors only: all reported results show attacks transferring to the held-out GPT-5.4 target monitor. Our results suggest that monitor evasion evaluations can easily mislead: an evaluation using only basic attack methods may give false confidence that a monitor is strong. The sensitivity to attack-policy choice raises a problem: interpreting any particular result as evidence about deployment performance requires justification. The transcripts produced by attack policies are proxies for the dangerous behaviour a monitor must flag in deployment. These proxies can introduce visible artefacts, such as reasoning about a ``side task\u0027\u0027 absent from the instructions shown to the monitor, that affect monitor judgements. Given the sensitivity above, the choice of proxy can change an evaluation\u0027s conclusion. Reading these results as evidence about deployment therefore requires a separate legitimacy argument for why the proxies are informative, including any justification of conservativeness. Making convincing arguments remains an open problem.", "arxiv_id": "2611.34934", "arxiv_url": "https://arxiv.org/abs/2611.34934", "authors": ["Charlie Griffin", "Oliver Makins", "Asa Cooper Stickland", "Alessandro Abate", "Yarin Gal", "Abby D\u0027Cruz", "Xander Davies"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u653b\u51fb\u7b56\u7565\u53ca\u5176\u4f18\u5316\u7a0b\u5ea6\u4f1a\u663e\u8457\u5f71\u54cdAI\u76d1\u63a7\u5668\u8bc4\u4f30\uff0c\u6f0f\u62a5\u7387\u6700\u9ad8\u8fbe23%\u3002\u4ec5\u7528\u57fa\u7840\u653b\u51fb\u53ef\u80fd\u9ad8\u4f30\u5b89\u5168\u6027\uff0c\u4ee3\u7406\u653b\u51fb\u80fd\u5426\u53cd\u6620\u90e8\u7f72\u98ce\u9669\u4ecd\u9700\u8bba\u8bc1\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34934", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5b89\u5168\u8bc4\u4f30", "\u5bf9\u6297\u653b\u51fb", "\u667a\u80fd\u4f53\u76d1\u63a7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34934v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Attack Policy Selection can Mislead Monitor Evaluators", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u653b\u51fb\u7b56\u7565\u53ca\u5176\u4f18\u5316\u7a0b\u5ea6\u4f1a\u663e\u8457\u5f71\u54cdAI\u76d1\u63a7\u5668\u8bc4\u4f30\uff0c\u6f0f\u62a5\u7387\u6700\u9ad8\u8fbe23%\u3002\u4ec5\u7528\u57fa\u7840\u653b\u51fb\u53ef\u80fd\u9ad8\u4f30\u5b89\u5168\u6027\uff0c\u4ee3\u7406\u653b\u51fb\u80fd\u5426\u53cd\u6620\u90e8\u7f72\u98ce\u9669\u4ecd\u9700\u8bba\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent patches are larger than developers\u0027, which is widely read as over-editing. But patch size does not say whether the extra edits are needed, what they are, or where they come from. We introduce Delta Residue Attribution (DRA), which replays agent trajectories, traces every block (unit) of the final patch to the step that wrote it, reverts each unit, and reruns the task tests to decide whether the unit is needed. We apply DRA to 7,660 resolved GitHub Copilot CLI trajectories from 18 frontier models on SWE-bench Verified (6,728) and DeepSWE (932), and grade developer patches using the same method. Agent patches do change more lines than developers\u0027; on SWE-bench Verified the majority of extra edits add tests (61%) and documentation (13%) while on DeepSWE, most extra edits are code (58%). On both benchmarks, agents\u0027 code is on average at least as necessary as developers\u0027 (mean $NP_{code}$ 0.887 vs. 0.864 on SWE-bench Verified, where 11 of 18 models leave less unneeded code than developers, and 0.797 vs. 0.785 on DeepSWE). On average, 11% of an agent patch\u0027s code units on SWE-bench Verified are still unneeded, and 89% of those change behavior. Debug steps write almost none of the unneeded code. Code necessity differs substantially by model; it is unrelated to resolve rate on SWE-bench Verified and negatively correlated with it on DeepSWE (Spearman -0.59, p = 0.01). On SWE-bench Verified, pruning with DRA using only the tests the agent can see (its own tests and the repository\u0027s) removes the majority of unneeded code but also some needed code (67% recall, 46% precision), and 89% of pruned patches still resolve the task; asking the agent to audit its own diff is more precise but less effective (36% recall, 66% precision). We recommend that benchmarks report code necessity next to resolve rate and that over-editing be addressed through model training and harness-level pruning.", "arxiv_id": "2611.34875", "arxiv_url": "https://arxiv.org/abs/2611.34875", "authors": ["Aakash Goel", "Benjamin Steenhoek", "Yu Hu"], "brief": "\u63d0\u51faDRA\uff0c\u901a\u8fc7\u9010\u5757\u64a4\u9500\u4fee\u6539\u5e76\u91cd\u8dd1\u6d4b\u8bd5\u8861\u91cf\u7f16\u7801\u667a\u80fd\u4f53\u7684\u8fc7\u5ea6\u7f16\u8f91\u3002\u5206\u67907660\u6761\u8f68\u8ff9\u53d1\u73b0\uff0c\u8865\u4e01\u867d\u66f4\u5927\uff0c\u4ee3\u7801\u5fc5\u8981\u6027\u4e0d\u4f4e\u4e8e\u5f00\u53d1\u8005\uff0c\u4f46\u4ecd\u5b58\u5728\u5197\u4f59\u4fee\u6539\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34875", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u4ee3\u7801\u8d28\u91cf", "\u5b9e\u8bc1\u7814\u7a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34875v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Much Do Coding Agents Over-Edit, and Why? An Empirical Study of Unneeded Edits in Repository-Level Agent Patches", "tldr": "\u63d0\u51faDRA\uff0c\u901a\u8fc7\u9010\u5757\u64a4\u9500\u4fee\u6539\u5e76\u91cd\u8dd1\u6d4b\u8bd5\u8861\u91cf\u7f16\u7801\u667a\u80fd\u4f53\u7684\u8fc7\u5ea6\u7f16\u8f91\u3002\u5206\u67907660\u6761\u8f68\u8ff9\u53d1\u73b0\uff0c\u8865\u4e01\u867d\u66f4\u5927\uff0c\u4ee3\u7801\u5fc5\u8981\u6027\u4e0d\u4f4e\u4e8e\u5f00\u53d1\u8005\uff0c\u4f46\u4ecd\u5b58\u5728\u5197\u4f59\u4fee\u6539\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep research agents gather information from multiple sources and synthesize it into reports on complex, open-ended questions. Existing benchmarks assess report quality along several dimensions, but lack a dedicated knowledge-centric evaluation of which research directions a report covers and how deeply it explores them. We introduce DRBench Pro, a benchmark that makes structured knowledge coverage the primary evaluation target. Our automated pipeline builds local knowledge trees from Wikipedia and uses sampled subgraphs to generate research queries and evidence-grounded rubrics. Each rubric corresponds to a relation in the tree, preserving the structure of the knowledge being evaluated. Agents receive only the research query. This structure allows us to measure breadth across major research directions and depth along related knowledge chains, with their geometric mean giving overall coverage. The benchmark includes 144 cases across 24 domains and 44,102 rubrics. Evaluating 16 deep research agents reveals different strengths in breadth and depth, with the best-performing agent reaching 57.04% overall coverage. Rubric judgments agree closely with human annotations, and agent rankings remain stable across the tested metric configurations.", "arxiv_id": "2611.34852", "arxiv_url": "https://arxiv.org/abs/2611.34852", "authors": ["Han Huang", "Yuchen Yan", "Xingyu Wu", "Yijun Li", "Chao Deng", "Jie Liu", "Jin Ma", "Yongliang Shen"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u77e5\u8bc6\u6811\u7684\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u8bc4\u6d4b\uff0c\u8861\u91cf\u77e5\u8bc6\u8986\u76d6\u5e7f\u5ea6\u4e0e\u6df1\u5ea6\uff1b16\u4e2a\u667a\u80fd\u4f53\u6700\u4f73\u8986\u76d6\u7387\u4e3a57.04%\uff0c\u8bc4\u5206\u4e0e\u4eba\u5de5\u6807\u6ce8\u9ad8\u5ea6\u4e00\u81f4\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34852", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6df1\u5ea6\u7814\u7a76", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u77e5\u8bc6\u8986\u76d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34852v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DRBench Pro: A Knowledge-Centric Benchmark for Professional Deep Research Agents", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u77e5\u8bc6\u6811\u7684\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u8bc4\u6d4b\uff0c\u8861\u91cf\u77e5\u8bc6\u8986\u76d6\u5e7f\u5ea6\u4e0e\u6df1\u5ea6\uff1b16\u4e2a\u667a\u80fd\u4f53\u6700\u4f73\u8986\u76d6\u7387\u4e3a57.04%\uff0c\u8bc4\u5206\u4e0e\u4eba\u5de5\u6807\u6ce8\u9ad8\u5ea6\u4e00\u81f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We consider the problem of constructing knowledge bases for applications based on large language models, in which the structure of a knowledge base determines how an application can retrieve and connect the information needed to answer a question. We study Self-Structuring Learning, a setting in which questions and expected answers guide the construction of a persistent knowledge base whose editable structure can be a graph schema or the organization of linked knowledge documents. We propose Knowledge-Base Gradient Descent, which diagnoses discrepancies between expected answers and responses obtained through the current knowledge base. At each round, the method proposes a structural edit, rebuilds the knowledge base, and adopts the edit when the learning loss decreases. The retained structure is evaluated on other questions about the same sources. By randomizing over candidate edits, we express the loss change of an edit as a derivative with respect to the probability of selecting it, and we evaluate joint edits as single candidates because their changes interact. Schema Descent instantiates the method for graph schemas. In experiments on large documents, each a bundle of research papers, the updated knowledge cards and graph schemas obtain higher mean Answer F1 on held-out generated questions than their initial structures, with schema gains in every document. On human questions, mean F1 rises for schemas and falls for cards: the updated structures serve the kind of question they were learned from.", "arxiv_id": "2611.34841", "arxiv_url": "https://arxiv.org/abs/2611.34841", "authors": ["Masahiro Kato"], "brief": "\u63d0\u51fa\u77e5\u8bc6\u5e93\u68af\u5ea6\u4e0b\u964d\uff0c\u7528\u95ee\u7b54\u8bef\u5dee\u6307\u5bfc\u7ed3\u6784\u7f16\u8f91\u5e76\u4fdd\u7559\u964d\u635f\u4fee\u6539\u3002\u751f\u6210\u6d4b\u8bd5\u9898\u4e0a\u8868\u73b0\u63d0\u5347\uff0c\u4f46\u4eba\u7c7b\u95ee\u9898\u4e0a\u56fe\u7ed3\u6784\u63d0\u5347\u3001\u77e5\u8bc6\u5361\u4e0b\u964d\uff0c\u663e\u793a\u4f18\u5316\u4f9d\u8d56\u8bad\u7ec3\u95ee\u9898\u7c7b\u578b\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34841", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u5e93", "\u7ed3\u6784\u5b66\u4e60", "\u95ee\u7b54\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34841v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Knowledge-Base Gradient Descent: Self-Structuring Learning through Question Answering", "tldr": "\u63d0\u51fa\u77e5\u8bc6\u5e93\u68af\u5ea6\u4e0b\u964d\uff0c\u7528\u95ee\u7b54\u8bef\u5dee\u6307\u5bfc\u7ed3\u6784\u7f16\u8f91\u5e76\u4fdd\u7559\u964d\u635f\u4fee\u6539\u3002\u751f\u6210\u6d4b\u8bd5\u9898\u4e0a\u8868\u73b0\u63d0\u5347\uff0c\u4f46\u4eba\u7c7b\u95ee\u9898\u4e0a\u56fe\u7ed3\u6784\u63d0\u5347\u3001\u77e5\u8bc6\u5361\u4e0b\u964d\uff0c\u663e\u793a\u4f18\u5316\u4f9d\u8d56\u8bad\u7ec3\u95ee\u9898\u7c7b\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World models predict how an environment responds to actions, so that candidate actions can be evaluated before execution. Executed actions, or decisions, taken in this manner are only as reliable as the model\u0027s predictive capabilities, and predictions in turn are only reliable within the model\u0027s experience. Epistemic uncertainty (EU) is the signal that marks where that experience ends. In this work we offer an extensive empirical study on how training objectives and architectures shape epistemic uncertainty of world models. More precisely, we present a controlled comparison of post-hoc EU (last-layer Laplace and ensembles) between two dominant models of different paradigms: 1) LeWorldModel (LeWM): A joint-embedding predictive architecture (JEPA), which predicts the next embedding without a decoder, and 2) DreamerV3: A recurrent state-space model (RSSM), which reconstructs the observation from a recurrent latent state. In ten simulated visual-control environments, we follow a controlled state perturbation of the environment state through every stage of the models up to the final EU estimate. We find that the RSSM attenuates the state perturbation through two mechanisms before it reaches an estimator on the predictor feature. Its recurrent update averages over context, so a change in a single frame reaches the state at a fraction of its size and recovers only as the change persists. Its reconstruction objective weights an entity by the pixels it covers, so a small object can be lost due to the training objective. The JEPA has neither mechanism and passes the change through all stages to the uncertainty. We further show that this translates to gaps in five uncertainty related downstream tasks, from unfamiliar-state detection to uncertainty-penalised planning: the RSSM uncertainty misses deviations that its own posterior registers, whereas the JEPA uncertainty reports what its model sees.", "arxiv_id": "2611.34830", "arxiv_url": "https://arxiv.org/abs/2611.34830", "authors": ["Simon Baur", "Wojciech Samek", "Jackie Ma"], "brief": "\u5728\u5341\u4e2a\u89c6\u89c9\u63a7\u5236\u73af\u5883\u4e2d\u5bf9\u6bd4JEPA\u4e0eRSSM\u7684\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\uff0c\u53d1\u73b0RSSM\u4f1a\u56e0\u5faa\u73af\u66f4\u65b0\u548c\u91cd\u5efa\u76ee\u6807\u5f31\u5316\u72b6\u6001\u53d8\u5316\uff0cJEPA\u5219\u66f4\u80fd\u4fdd\u7559\u4fe1\u53f7\u5e76\u652f\u6301\u68c0\u6d4b\u4e0e\u89c4\u5212\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34830", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027", "\u89c6\u89c9\u63a7\u5236", "\u6a21\u578b\u67b6\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34830v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Not all world models can doubt: how training objective and architecture shape epistemic uncertainty in JEPA and RSSM world models", "tldr": "\u5728\u5341\u4e2a\u89c6\u89c9\u63a7\u5236\u73af\u5883\u4e2d\u5bf9\u6bd4JEPA\u4e0eRSSM\u7684\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\uff0c\u53d1\u73b0RSSM\u4f1a\u56e0\u5faa\u73af\u66f4\u65b0\u548c\u91cd\u5efa\u76ee\u6807\u5f31\u5316\u72b6\u6001\u53d8\u5316\uff0cJEPA\u5219\u66f4\u80fd\u4fdd\u7559\u4fe1\u53f7\u5e76\u652f\u6301\u68c0\u6d4b\u4e0e\u89c4\u5212\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video generation models are increasingly evaluated as visual reasoners: given a first frame and a natural-language prompt, can the model produce the video in which the specified task is carried out? The paradigm is considered advantageous because the reasoning is native to the visual medium, unfolding directly in the frames rather than through language or code. Whether this native route is in fact the more reliable path to visual reasoning has not been tested against a symbolic alternative under the same conditions. We therefore pose the same tasks, with identical inputs, output specification and evaluator, to both media: rather than denoising pixels, a coding agent writes a program that renders the answer video, which an unmodified rule-based evaluator scores. On VBVR-Pro-Bench (Xu et al., 2026), a 500-instance suite spanning five cognitive categories with symbolic ground truth, the agent receives the same first frame and prompt as the video model, with no access to ground truth, metadata or generation models, and one attempt per instance. Three closed-model agents (Codex with gpt-6-astra, Claude Code with Fable 5.1 and Gemini CLI with Gemini 3.1 Pro) score 0.923, 0.894 and 0.893, each more than 0.22 above the strongest video model. Among 23 runnable open-weight models, the best, GLM-5, reaches 0.572, above all video models except the RL-trained one. Together, we show that for tasks whose solutions can be computed from a first frame and a prompt, program synthesis is currently a substantially more reliable route to visual reasoning than video generation. We further distinguish depictive programs, which navigate the image to recover a transferable sche
