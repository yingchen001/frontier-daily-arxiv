me, from propositional programs, which operate on hard-coded values, revealing how visual reasoning unfolds in agent-written programs and what it implies for its nature of reasoning in general.", "arxiv_id": "2611.34813", "arxiv_url": "https://arxiv.org/abs/2611.34813", "authors": ["Dezhi Luo", "Fengyuan Yu", "Haotian Zhang", "Zehong Zhao", "Ran Ji", "Siyuan An", "Huayi Qin", "Qingying Gao", "Zhongang Cai", "Lei Yang", "Ziqi Huang", "Ruisi Wang", "Maijunxian Wang", "Hokin Deng"], "brief": "\u5728\u76f8\u540c\u8f93\u5165\u4e0e\u8bc4\u6d4b\u6761\u4ef6\u4e0b\uff0c\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u7f16\u5199\u7a0b\u5e8f\u6e32\u67d3\u7b54\u6848\u89c6\u9891\uff1b\u95ed\u6e90\u667a\u80fd\u4f53\u5f97\u5206\u5747\u6bd4\u6700\u5f3a\u89c6\u9891\u6a21\u578b\u9ad8\u903e0.22\uff0c\u663e\u793a\u7a0b\u5e8f\u5408\u6210\u66f4\u53ef\u9760\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34813", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u63a8\u7406", "\u7f16\u7801\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u5408\u6210", "\u89c6\u9891\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34813v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Solve Vision with Code: Coding Agents Are Stronger Visual Reasoners Than Video Models", "tldr": "\u5728\u76f8\u540c\u8f93\u5165\u4e0e\u8bc4\u6d4b\u6761\u4ef6\u4e0b\uff0c\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u7f16\u5199\u7a0b\u5e8f\u6e32\u67d3\u7b54\u6848\u89c6\u9891\uff1b\u95ed\u6e90\u667a\u80fd\u4f53\u5f97\u5206\u5747\u6bd4\u6700\u5f3a\u89c6\u9891\u6a21\u578b\u9ad8\u903e0.22\uff0c\u663e\u793a\u7a0b\u5e8f\u5408\u6210\u66f4\u53ef\u9760\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mixed-task reinforcement learning (MixRL) directly trains a unified policy across domains to continually expand agent capabilities without training separate specialists or requiring an extra distillation stage. Despite its appeal, scaling MixRL poses significant challenges in achieving stable and efficient mixed-task learning, effectively allocating rollout compute, and supporting continual domain expansion. To address these challenges, we propose Maco-RL, an approach that effectively scales MixRL. Specifically, Maco-RL employs a quota-based scheduler for asynchronous rollouts across multiple task domains, thereby stabilizing training by balancing gradient contributions and mitigating off-policy effects. Along an orthogonal axis, Maco-RL further introduces Tri-Buffer Sampling (TBS) to allocate compute among samples with varying levels of mastery, promoting sustained frontier exploration while preserving acquired capabilities. Experiments on five benchmarks show Maco-RL raises Qwen3.5-27B\u0027s overall score from 43.6 to 54.2 and then to 60.1 with continual expansion, reaching the frontier held by Qwen3.8-27B, which is further pushed outward by +5.7. Maco-RL also outperforms single-task RL with less compute for policy updates. These results support MixRL as a practical and compute-efficient post-training approach with substantial potential to strengthen general agent capabilities.", "arxiv_id": "2611.34703", "arxiv_url": "https://arxiv.org/abs/2611.34703", "authors": ["Jiacheng Zhang", "Qixing Zhou", "Haiyang Wang", "Qipeng Gu", "Shuzhe Wu", "Feiyang Pan", "Lue Fan", "Dandan Tu", "Zhaoxiang Zhang"], "brief": "Maco-RL\u7528\u914d\u989d\u8c03\u5ea6\u548c\u4e09\u7f13\u51b2\u91c7\u6837\u7a33\u5b9a\u591a\u4efb\u52a1\u5f3a\u5316\u5b66\u4e60\u3001\u4f18\u5316\u7b97\u529b\u5206\u914d\uff1b\u4e94\u9879\u57fa\u51c6\u603b\u5206\u4ece43.6\u5347\u81f360.1\uff0c\u7b56\u7565\u66f4\u65b0\u7b97\u529b\u5c11\u4e8e\u5355\u4efb\u52a1\u8bad\u7ec3\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34703", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u591a\u4efb\u52a1\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34703v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Maco-RL: Scaling Agent Capabilities with Mixed-Task Reinforcement Learning", "tldr": "Maco-RL\u7528\u914d\u989d\u8c03\u5ea6\u548c\u4e09\u7f13\u51b2\u91c7\u6837\u7a33\u5b9a\u591a\u4efb\u52a1\u5f3a\u5316\u5b66\u4e60\u3001\u4f18\u5316\u7b97\u529b\u5206\u914d\uff1b\u4e94\u9879\u57fa\u51c6\u603b\u5206\u4ece43.6\u5347\u81f360.1\uff0c\u7b56\u7565\u66f4\u65b0\u7b97\u529b\u5c11\u4e8e\u5355\u4efb\u52a1\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pretrained vision-language-action (VLA) models rarely satisfy all behavioral requirements of a new platform, and teams without a large deployed fleet lack the data to address the resulting failures. We propose a failure-driven data flywheel for post-training such models. It constructs target scenarios absent from the available data by inserting task-relevant entities into reconstructed real-world scenes, and evaluates the model against each behavioral requirement of the target task. Failure rates form a failure map across task conditions and difficulty levels, which is re-evaluated after each round and assigns larger data generation quotas to conditions where the model still fails. We instantiate the framework in autonomous driving for occluded-pedestrian emergence and yielding at stop-sign-controlled intersections, and evaluate it on two VLA models and one non-VLA planner in simulation and on a real vehicle. For occluded-pedestrian emergence, five rounds of post-training improve the critical-phase collision-free rate on the sealed test set from 0.261 to 0.579 for AutoVLA and from 0.390 to 0.765 for ReCogDrive, while the unnecessary braking rate in paired control scenarios never exceeds 0.013. On a full-scale vehicle without real-world training, post-trained ReCogDrive achieves 4 of 5 safe passages, versus 1 of 5 for the base model. Fine-grained evaluation reveals a pattern obscured by the collision-free rate alone: both VLA models learn anticipatory deceleration before reaching the occluding vehicle, while braking after pedestrian emergence remains limited. For stop-sign yielding, the stop-before-line rate rises from 0.100 to 0.897 for AutoVLA and from 0.000 to 0.667 for ReCogDrive. With sequential training from the pedestrian-capability models, it reaches 0.599 and 0.358, respectively, while the pedestrian collision-free rate decreases by at most 0.032.", "arxiv_id": "2611.34698", "arxiv_url": "https://arxiv.org/abs/2611.34698", "authors": ["Yuhao Luo", "Zihao Sheng", "Zilin Huang", "Zhengyang Wan", "Boyue Wang", "Ruolin Yang", "Shuai Wang", "Sikai Chen"], "brief": "\u63d0\u51fa\u5931\u8d25\u9a71\u52a8\u7684\u6570\u636e\u98de\u8f6e\uff0c\u6309\u6a21\u578b\u8584\u5f31\u573a\u666f\u52a8\u6001\u751f\u6210\u6570\u636e\u5e76\u8fed\u4ee3\u540e\u8bad\u7ec3\uff1b\u5728\u81ea\u52a8\u9a7e\u9a76\u4e2d\u663e\u8457\u63d0\u5347\u907f\u649e\u4e0e\u505c\u8f66\u8ba9\u884c\u8868\u73b0\uff0c\u5b9e\u8f66\u6d4b\u8bd5\u4e5f\u6709\u6539\u5584\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34698", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u81ea\u52a8\u9a7e\u9a76", "\u6570\u636e\u751f\u6210", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34698v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Failure-Driven Data Flywheel for Post-Training Vision-Language-Action Models", "tldr": "\u63d0\u51fa\u5931\u8d25\u9a71\u52a8\u7684\u6570\u636e\u98de\u8f6e\uff0c\u6309\u6a21\u578b\u8584\u5f31\u573a\u666f\u52a8\u6001\u751f\u6210\u6570\u636e\u5e76\u8fed\u4ee3\u540e\u8bad\u7ec3\uff1b\u5728\u81ea\u52a8\u9a7e\u9a76\u4e2d\u663e\u8457\u63d0\u5347\u907f\u649e\u4e0e\u505c\u8f66\u8ba9\u884c\u8868\u73b0\uff0c\u5b9e\u8f66\u6d4b\u8bd5\u4e5f\u6709\u6539\u5584\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous research agents are emerging as a promising approach to scientific problem-solving across disciplines, owing to their growing ability to improve a solution through repeated experiments. Evaluating this ability requires benchmarks that pose open-ended research problems and measure improvements over established scientific methods. We introduce REE (Research Entrance Exam), a benchmark that tests AI agents on scientific research. It consists of 100 open-ended research problems spanning five broad scientific areas and 23 domains. To ensure high quality, every problem is drawn from active research in its field and individually reviewed by domain experts. Each problem is posed as a task of iterative improvement: an agent has up to 12 hours to improve a working starter solution, and REE scores the result on a common scale against an established expert solution evaluated under comparable conditions. By this measure, two of the four frontier agents we evaluate, Claude Opus 5.5 and GPT-6.1 Sol, outperform the expert solutions on 86% and 81% of problems, across all five scientific areas. Their runs also show how they do so: both agents surpass the expert solutions within the first two hours on average, and their best solutions mostly tailor or combine established methods of the field. REE thus provides a unified framework for evaluating autonomous scientific research, capturing both improvements over established methods and the research processes behind them.", "arxiv_id": "2611.34646", "arxiv_url": "https://arxiv.org/abs/2611.34646", "authors": ["Zeqi Zhou", "Minghao Liu", "Jiarui Liu", "Qingcheng Zeng", "Rui Yang", "Tianyu Liu", "Zetao Yang", "Wenqiang Zu", "Enduo Zhao", "Heng-Jui Chang", "Lun-Hsin Kuo", "Meng-Fu Chen", "Haokai Zhao", "Weijia Zhang", "Jen-Tse Huang", "Stephen Huang", "Eli Cheung", "Zhijing Jin", "Mona Diab", "Weihao Xuan"], "brief": "\u63d0\u51fa\u79d1\u7814\u667a\u80fd\u4f53\u57fa\u51c6REE\uff0c\u8986\u76d6100\u9053\u5f00\u653e\u7814\u7a76\u9898\uff0c\u4ee5\u9650\u65f6\u8fed\u4ee3\u6539\u8fdb\u8861\u91cf\u80fd\u529b\uff1b\u4e24\u6b3e\u524d\u6cbf\u667a\u80fd\u4f53\u5206\u522b\u572886%\u548c81%\u7684\u9898\u76ee\u4e0a\u8d85\u8fc7\u4e13\u5bb6\u65b9\u6848\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34646", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u7814\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u79d1\u5b66\u7814\u7a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34646v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "REE: A Scientific Research Entrance Exam for AI Agents", "tldr": "\u63d0\u51fa\u79d1\u7814\u667a\u80fd\u4f53\u57fa\u51c6REE\uff0c\u8986\u76d6100\u9053\u5f00\u653e\u7814\u7a76\u9898\uff0c\u4ee5\u9650\u65f6\u8fed\u4ee3\u6539\u8fdb\u8861\u91cf\u80fd\u529b\uff1b\u4e24\u6b3e\u524d\u6cbf\u667a\u80fd\u4f53\u5206\u522b\u572886%\u548c81%\u7684\u9898\u76ee\u4e0a\u8d85\u8fc7\u4e13\u5bb6\u65b9\u6848\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large pretrained language models provide capable policies for interactive tasks, but how much model capacity is necessary for a specialized language agent? We introduce ZeroHero, a framework for training small language agents (SLAs) from scratch. In each environment, a large language model acts as the expert, and we collect its successful trajectories. We pretrain each SLA, which has fewer than 50 million parameters, to predict the expert\u0027s responses given the interaction history. We then post-train the agent on its own interactions using proximal policy optimization (PPO). During post-training, reasoning alignment supplements environment rewards with expert supervision on the language the agent generates alongside its actions. We evaluate the agents in three multistep environments where acting requires both understanding and generating language. In Crafter, agents interpret textual observations and generate reasoning before acting. In WebShop, they translate shopping instructions into search queries. In Alfworld-Dialogue, they ask clarifying questions and use the answers to guide household actions. The agents approach expert performance on WebShop and surpass their respective demonstration experts on Crafter training rollouts and held-out Alfworld-Dialogue tasks. An interactive demo is available at https://zoyav.github.io/-ZoyaV-zerohero-demo.", "arxiv_id": "2611.34635", "arxiv_url": "https://arxiv.org/abs/2611.34635", "authors": ["Nikita Sorokin", "Zoya Volovikova", "Alexey Skrynnik", "Aleksandr Panov"], "brief": "ZeroHero\u7528\u4e13\u5bb6\u8f68\u8ff9\u4e0e\u5f3a\u5316\u5b66\u4e60\u4ece\u96f6\u8bad\u7ec3\u4e0d\u8db3\u4e94\u5343\u4e07\u53c2\u6570\u7684\u8bed\u8a00\u667a\u80fd\u4f53\uff0c\u5e76\u4ee5\u63a8\u7406\u5bf9\u9f50\u8f85\u52a9\u8bad\u7ec3\uff1b\u5728\u4e09\u4e2a\u591a\u6b65\u73af\u5883\u4e2d\u63a5\u8fd1\u6216\u8d85\u8fc7\u793a\u8303\u4e13\u5bb6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34635", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u667a\u80fd\u4f53", "\u5c0f\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34635v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ZeroHero: Training Small Language Agents from Scratch", "tldr": "ZeroHero\u7528\u4e13\u5bb6\u8f68\u8ff9\u4e0e\u5f3a\u5316\u5b66\u4e60\u4ece\u96f6\u8bad\u7ec3\u4e0d\u8db3\u4e94\u5343\u4e07\u53c2\u6570\u7684\u8bed\u8a00\u667a\u80fd\u4f53\uff0c\u5e76\u4ee5\u63a8\u7406\u5bf9\u9f50\u8f85\u52a9\u8bad\u7ec3\uff1b\u5728\u4e09\u4e2a\u591a\u6b65\u73af\u5883\u4e2d\u63a5\u8fd1\u6216\u8d85\u8fc7\u793a\u8303\u4e13\u5bb6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As agents based on vision-language models (VLMs) increasingly interpret social-media content, errors in their analysis may lend credibility to rumors and amplify their spread. In this paper, we study the problem of visual cognitive collusion, in which coordinated posts combine authentic images and locally faithful captions to induce VLM agents to infer and accept attacker-chosen target claims through their own reasoning. To enable systematic evaluation of this cognitive threat, we introduce a new benchmark comprising 544 target cases and 33.2K candidate images across eight application domains. We further propose VisualMontage, a multi-agent framework for simulating such attacks through narrative planning, image selection and ordering, and caption assignment under iterative review. We evaluate this threat through extensive experiments across 12 vision-language models, examining modality effects, production-team components, and downstream defenses. Using identical attack feeds across models without victim-specific optimization, we demonstrate cross-model transferability, achieving mean attack success rates of 61.93% for proprietary models and 68.71% for open-weight models. Moreover, 92.65% of generated feeds pass independent model-based validity auditing. Even after downstream review, residual attack success rates range from 35.3% to 76.7% across the evaluated configurations. Our additional controlled comparisons further reveal that captions can improve model-rated posting naturalness while reducing attack success. Together, these findings reveal a novel cognitive threat in social-media interpretation and motivate safeguards that assess how authentic posts jointly shape agents\u0027 reasoning and conclusions.", "arxiv_id": "2611.34603", "arxiv_url": "https://arxiv.org/abs/2611.34603", "authors": ["Jinwei Hu", "Lai Wei", "Zhuoyun Li", "Youcheng Sun", "Yi Dong", "Xiaowei Huang"], "brief": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u771f\u5b9e\u56fe\u7247\u4e0e\u5fe0\u5b9e\u914d\u6587\u7684\u7ec4\u5408\u8bf1\u5bfc\u89c6\u89c9\u8bed\u8a00\u667a\u80fd\u4f53\u63a5\u53d7\u6307\u5b9a\u8bba\u65ad\uff1b\u8de8\u6a21\u578b\u653b\u51fb\u6210\u529f\u7387\u8d85\u516d\u6210\uff0c\u540e\u7eed\u5ba1\u67e5\u4ecd\u96be\u5f7b\u5e95\u9632\u5fa1\u3002", "categories": ["cs.CV", "cs.AI", "cs.MA", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34603", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u591a\u667a\u80fd\u4f53", "\u5bf9\u6297\u653b\u51fb", "\u793e\u4ea4\u5a92\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34603v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VisualMontage: Manipulating the Beliefs of Vision-Language Agents with Authentic Image Sequences", "tldr": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u771f\u5b9e\u56fe\u7247\u4e0e\u5fe0\u5b9e\u914d\u6587\u7684\u7ec4\u5408\u8bf1\u5bfc\u89c6\u89c9\u8bed\u8a00\u667a\u80fd\u4f53\u63a5\u53d7\u6307\u5b9a\u8bba\u65ad\uff1b\u8de8\u6a21\u578b\u653b\u51fb\u6210\u529f\u7387\u8d85\u516d\u6210\uff0c\u540e\u7eed\u5ba1\u67e5\u4ecd\u96be\u5f7b\u5e95\u9632\u5fa1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Catastrophic forgetting, the drastic loss of previously acquired capabilities when learning new ones, is a central challenge in language model fine-tuning. Supervised fine-tuning (SFT) is widely believed to be prone to such forgetting. Recent works have attributed this to the off-policy nature of SFT, arguing that on-policy learning is key to continual learning. In this paper, we challenge this premise. We show that while maximizing new-task performance can induce catastrophic forgetting, alternative hyperparameter choices (lower learning rate and batch size) can yield similar gains with little to no forgetting. With hyperparameters selected jointly for gain and retention, vanilla SFT retains prior capabilities far better than previously suggested and can be competitive with Self-Distillation Fine-Tuning (SDFT), an on-policy approach designed to mitigate forgetting. While SDFT can be more robust to hyperparameter choices, it also requires a retention-aware criterion to identify hyperparameter configurations that avoid catastrophic forgetting. Our results challenge the view that on-policy training is what enables learning with retention and raise broader questions about what drives catastrophic forgetting during fine-tuning.", "arxiv_id": "2611.34579", "arxiv_url": "https://arxiv.org/abs/2611.34579", "authors": ["Nirmit Joshi", "Nathan Srebro", "Eran Malach"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u964d\u4f4e\u5b66\u4e60\u7387\u548c\u6279\u91cf\u5927\u5c0f\u3001\u517c\u987e\u589e\u76ca\u4e0e\u4fdd\u7559\u6765\u9009\u53c2\uff0c\u53ef\u8ba9\u666e\u901aSFT\u83b7\u5f97\u76f8\u8fd1\u7684\u65b0\u4efb\u52a1\u6536\u76ca\u4e14\u51e0\u4e4e\u4e0d\u9057\u5fd8\uff0c\u8868\u73b0\u53ef\u5ab2\u7f8e\u5728\u7ebf\u7b56\u7565\u81ea\u84b8\u998f\u5fae\u8c03\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34579", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76d1\u7763\u5fae\u8c03", "\u707e\u96be\u6027\u9057\u5fd8", "\u6301\u7eed\u5b66\u4e60", "\u8d85\u53c2\u6570\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34579v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tune for Retention, Not Just Gain: SFT Forgets Far Less than You Think", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u964d\u4f4e\u5b66\u4e60\u7387\u548c\u6279\u91cf\u5927\u5c0f\u3001\u517c\u987e\u589e\u76ca\u4e0e\u4fdd\u7559\u6765\u9009\u53c2\uff0c\u53ef\u8ba9\u666e\u901aSFT\u83b7\u5f97\u76f8\u8fd1\u7684\u65b0\u4efb\u52a1\u6536\u76ca\u4e14\u51e0\u4e4e\u4e0d\u9057\u5fd8\uff0c\u8868\u73b0\u53ef\u5ab2\u7f8e\u5728\u7ebf\u7b56\u7565\u81ea\u84b8\u998f\u5fae\u8c03\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern video generators excel at producing visually plausible futures guided by text and image prompts. Yet their emphasis on semantic plausibility does not guarantee fidelity to the physical consequences of specific actions. Action-conditioned world models (ACWMs), in contrast, aim to simulate how the world responds to robot actions, enabling scalable policy evaluation and improvement without costly real-world rollouts. The challenge is not merely to generate a plausible future, but to predict what follows from a specific physical action. As video priors grow stronger, we ask how little adaptation is truly needed to bridge this gap. We introduce Dianjing, a minimal recipe that preserves and unlocks the capabilities of strong video priors through unified physical action conditioning, training concentrated at the high noise levels where motion and layout, and thus the consequences of actions, are decided, and native history conditioning. Built upon MiniMax H3, a 33B video foundation model, Dianjing freezes the pretrained backbone and trains only 0.34% of its parameters using approximately 65 hours of robot video across two embodiments, without additional robot-specific pretraining or camera calibration. Controlled ablations show that where training is allocated across noise levels matters more than how actions enter the network. On WorldOracle, which evaluates predictions against paired real-world executions, Dianjing achieves the best scores on four of the five evaluation tracks and ranks second on AgiBot-Long. Our findings suggest that strong video priors already bring us most of the way to world modeling; lightweight physical action grounding can unlock their potential for real-world prediction.", "arxiv_id": "2611.34435", "arxiv_url": "https://arxiv.org/abs/2611.34435", "authors": ["Zanyi Wang", "Xia Chen", "Liu Liu", "Xianglong Guo", "Dengyang Jiang", "Haodong Li", "Tingyang Xiao", "Wenhao Hu", "Zhizhong Su"], "brief": "Dianjing\u4ec5\u5fae\u8c03\u89c6\u9891\u6a21\u578b0.34%\u7684\u53c2\u6570\uff0c\u752865\u5c0f\u65f6\u673a\u5668\u4eba\u89c6\u9891\u6784\u5efa\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\uff0c\u5728\u4e94\u9879\u771f\u5b9e\u6267\u884c\u9884\u6d4b\u8bc4\u6d4b\u4e2d\u56db\u9879\u6700\u4f18\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34435", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u673a\u5668\u4eba\u5b66\u4e60", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34435v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Most of the Way There: Turning a Strong Video Prior into an Action-Conditioned World Model", "tldr": "Dianjing\u4ec5\u5fae\u8c03\u89c6\u9891\u6a21\u578b0.34%\u7684\u53c2\u6570\uff0c\u752865\u5c0f\u65f6\u673a\u5668\u4eba\u89c6\u9891\u6784\u5efa\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\uff0c\u5728\u4e94\u9879\u771f\u5b9e\u6267\u884c\u9884\u6d4b\u8bc4\u6d4b\u4e2d\u56db\u9879\u6700\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents are evolving from passive chatbots into autonomous systems that operate continuously in dynamic environments. Such agents need not only solve current tasks but also learn from past interactions to improve future performance. However, existing streaming benchmarks often rely on short task sequences or largely independent tasks, providing limited evidence of whether agents can effectively reuse experience when later tasks depend on earlier outcomes. To address this gap, we introduce \\textbf{EvoLink-Bench}, a benchmark for evaluating self-evolving agents in long-horizon, interdependent task streams. It covers daily office work, multi-turn dialogue, and AutoResearch-style workflows, with persistent workspaces and dependencies across tasks. The benchmark includes two complementary levels: \\textbf{L1}, which evaluates the acquisition and revision of language-expressible knowledge, and \\textbf{L2}, which assesses the development of task-level capabilities through execution and feedback. Its evaluation further distinguishes within-task recovery, persistent-state updates, and experience reuse in later tasks. We evaluate five agent frameworks across three backbone configurations under three persistence conditions, covering 19,635 scored task slots from selected evaluation cohorts. Results show that no framework consistently performs best across both levels, retries recover only a limited proportion of failed tasks, and persistent-state updates do not necessarily improve subsequent performance. Furthermore, the effects of evolution differ between knowledge- and capability-level tasks, suggesting that these two forms of evolution require different learning mechanisms. Performance gains also vary across domains and task streams, with improvements on some tasks not necessarily extending to others.", "arxiv_id": "2611.34400", "arxiv_url": "https://arxiv.org/abs/2611.34400", "authors": ["Wei Chen", "Xiaodong Lu", "Weihao Shen", "Gongxun Li", "Xingyu Guo", "Qihang Sun", "Fuwei Zhang", "Zhao Zhang", "Yikun Ban", "Shuang Li", "Deqing Wang", "Fuzhen Zhuang"], "brief": "\u63d0\u51fa EvoLink-Bench\uff0c\u4ee5\u957f\u671f\u76f8\u4e92\u4f9d\u8d56\u4efb\u52a1\u6d41\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u77e5\u8bc6\u4e0e\u80fd\u529b\u6f14\u5316\u3002\u6d4b\u8bd5\u53d1\u73b0\uff0c\u65e0\u6846\u67b6\u5168\u9762\u9886\u5148\uff0c\u6301\u4e45\u72b6\u6001\u66f4\u65b0\u672a\u5fc5\u63d0\u5347\u540e\u7eed\u8868\u73b0\uff0c\u4e24\u7c7b\u6f14\u5316\u9700\u8981\u4e0d\u540c\u5b66\u4e60\u673a\u5236\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34400", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60", "\u8bc4\u6d4b\u57fa\u51c6", "\u7ecf\u9a8c\u590d\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34400v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EvoLink-Bench: A Benchmark for Evaluating Self-Evolving Agents in Long-Horizon Interdependent Task Streams", "tldr": "\u63d0\u51fa EvoLink-Bench\uff0c\u4ee5\u957f\u671f\u76f8\u4e92\u4f9d\u8d56\u4efb\u52a1\u6d41\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u77e5\u8bc6\u4e0e\u80fd\u529b\u6f14\u5316\u3002\u6d4b\u8bd5\u53d1\u73b0\uff0c\u65e0\u6846\u67b6\u5168\u9762\u9886\u5148\uff0c\u6301\u4e45\u72b6\u6001\u66f4\u65b0\u672a\u5fc5\u63d0\u5347\u540e\u7eed\u8868\u73b0\uff0c\u4e24\u7c7b\u6f14\u5316\u9700\u8981\u4e0d\u540c\u5b66\u4e60\u673a\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Skill acquisition alone does not establish a reusable skill library: task proficiency does not specify a compositional interface. Motivated by agents that acquire and refine skills, we study independently learned soft-prompt skills on frozen language models, with skill identities and execution order supplied. Across four digit-task bases and three record-editing models, mean composition accuracy in one call is at most 7.6%, compared with 88.2% to 100% over two calls that add computation and an explicit intermediate output. Neutral-insertion training improves robustness but leaves substantial interference, which block length and per-token norm alone cannot explain on two of four digit bases. Blocks of the same operation need not be interchangeable: after training next to frozen learned partners, a post hoc test on two Qwen bases shows that replacing those partners with independently learned blocks of the same operations lowers median composition accuracy from 98.0% and 95.3% to 12.7% and 0.5%, although every replacement scores at least 90% alone. Repair can improve a composition while impairing the original skill, and rehearsal improves retention while transfer remains limited on Qwen2.5-0.5B. Internal interventions constrain explanations without identifying a shared failure mechanism. These findings motivate evaluating compatibility, retention and transfer alongside acquisition when building skill libraries for self-evolving agents. Code is available at https://github.com/YanLin-Quinne/SkillCompatibility.", "arxiv_id": "2611.34398", "arxiv_url": "https://arxiv.org/abs/2611.34398", "authors": ["Yan Lin", "Zhongliang Guo", "Jingyu Sun", "Qiyan Zhao", "Ruihong Zeng", "Ying Chen", "Zhengtao Yao", "Yan Wen", "Kunyu Peng", "Yuxia Wang"], "brief": "\u7814\u7a76\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u4e2d\u72ec\u7acb\u5b66\u4e60\u7684\u8f6f\u63d0\u793a\u6280\u80fd\u7ec4\u5408\uff0c\u53d1\u73b0\u5355\u6b21\u8c03\u7528\u51c6\u786e\u7387\u81f3\u591a7.6%\uff0c\u4e24\u6b21\u8c03\u7528\u53ef\u8fbe88.2%\u4ee5\u4e0a\uff1b\u6280\u80fd\u4fee\u590d\u8fd8\u53ef\u80fd\u635f\u5bb3\u539f\u80fd\u529b\uff0c\u51f8\u663e\u517c\u5bb9\u6027\u4e0e\u4fdd\u7559\u8bc4\u4f30\u7684\u91cd\u8981\u6027\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34398", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6280\u80fd\u7ec4\u5408", "\u8f6f\u63d0\u793a", "\u80fd\u529b\u4fdd\u7559", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34398v1", "published_at": "2026-11-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Skills Fail to Compose: Compatibility and Retention in Language Models", "tldr": "\u7814\u7a76\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u4e2d\u72ec\u7acb\u5b66\u4e60\u7684\u8f6f\u63d0\u793a\u6280\u80fd\u7ec4\u5408\uff0c\u53d1\u73b0\u5355\u6b21\u8c03\u7528\u51c6\u786e\u7387\u81f3\u591a7.6%\uff0c\u4e24\u6b21\u8c03\u7528\u53ef\u8fbe88.2%\u4ee5\u4e0a\uff1b\u6280\u80fd\u4fee\u590d\u8fd8\u53ef\u80fd\u635f\u5bb3\u539f\u80fd\u529b\uff0c\u51f8\u663e\u517c\u5bb9\u6027\u4e0e\u4fdd\u7559\u8bc4\u4f30\u7684\u91cd\u8981\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
