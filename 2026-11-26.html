<script>
const PAPERS = [{"abstract": "Real-time autoregressive video generators stream minutes of video and accept new prompts on the fly, but struggle to keep people, objects, and places consistent over a long interactive story. Agent systems provide such memory for offline multi-shot generation, yet they read the whole script in advance, plan each shot before generating it, and regenerate failed shots, which a live stream does not allow. We present Agentic LongLive, an asynchronous agentic memory for long video generation. A memory agent on separate GPUs reads only the prompts revealed so far, never the generated video, and keeps a text state and evolving images for every person, object, and scene. From this entity memory it composes a global image and a per-shot memory image, which an auxiliary GPU prefills into the generator\u0027s attention sink before the next shot starts, and writes entity cards for the prompts that name them, so the video never waits for memory and video errors are not written back. A small language model, trained with reinforcement learning and an image reward calibrated using downstream video outcomes, decides what to remember before the next prompt is known. On LongStory-Online, a new benchmark of 25 stories (857 shots) revealed one shot at a time, Agentic LongLive improves persistent-state accuracy of LongLive-2.0, its base generator, by 26.3 points, protagonist identity by 44.9, and revisited-place consistency by 40.4, at about 1% extra generation time on H100. The full system streams faster than real time on one 8xB200 node with the generator in BF16 (34.3 FPS), keeps image quality stable over 14-minute stories, and improves identity on two MiniMax-H3 generators, one of which, LongLive-H3, also runs in real time with it. To our knowledge, it is the first real-time video generator with text and image memory kept by an LLM agent.", "arxiv_id": "2611.34907", "arxiv_url": "https://arxiv.org/abs/2611.34907", "authors": ["Shaoteng Liu", "Shuai Yang", "Wei Huang", "Luozhou Wang", "Song Han", "Yukang Chen"], "brief": "\u7cfb\u7edf\u7528\u72ec\u7acbGPU\u4e0a\u7684\u8bb0\u5fc6\u667a\u80fd\u4f53\uff0c\u4ec5\u4f9d\u636e\u5df2\u63ed\u793a\u63d0\u793a\u7ef4\u62a4\u4eba\u7269\u3001\u7269\u4f53\u4e0e\u573a\u666f\u7684\u56fe\u6587\u72b6\u6001\u3002\u8f85\u52a9GPU\u5728\u4e0b\u4e00\u955c\u5934\u524d\u5c06\u8bb0\u5fc6\u56fe\u9884\u586b\u5165\u751f\u6210\u5668\u6ce8\u610f\u529b\u6c47\uff0c\u907f\u514d\u963b\u585e\u89c6\u9891\u6d41\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/NVlabs/LongLive", "github_stars": 2912, "hf_url": "https://huggingface.co/papers/2611.34907", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5c0f\u8bed\u8a00\u6a21\u578b\uff0c\u4ee5\u89c6\u9891\u7ed3\u679c\u6821\u51c6\u56fe\u50cf\u5956\u52b1", "LongStory-Online\u542b25\u4e2a\u6545\u4e8b\u3001857\u4e2a\u955c\u5934", "\u6301\u7eed\u72b6\u6001\u51c6\u786e\u7387\u63d0\u534726.3\u70b9\uff0c\u989d\u5916\u751f\u6210\u8017\u65f6\u7ea61%"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u667a\u80fd\u4f53\u8bb0\u5fc6", "\u591a\u6a21\u6001", "\u5b9e\u65f6\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2611.34907v1", "published_at": "2026-11-25", "score": 0.802, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34907.png", "title": "Agentic LongLive: Asynchronous Agentic Memory for Long Video Generation", "tldr": "\u5f02\u6b65\u667a\u80fd\u4f53\u7ef4\u62a4\u56fe\u6587\u5b9e\u4f53\u8bb0\u5fc6\uff0c\u8ba9\u5b9e\u65f6\u957f\u89c6\u9891\u66f4\u4e00\u81f4\u4e14\u51e0\u4e4e\u4e0d\u589e\u52a0\u7b49\u5f85\u3002", "upvotes": 17, "what_it_is": "\u7cfb\u7edf\u7528\u72ec\u7acbGPU\u4e0a\u7684\u8bb0\u5fc6\u667a\u80fd\u4f53\uff0c\u4ec5\u4f9d\u636e\u5df2\u63ed\u793a\u63d0\u793a\u7ef4\u62a4\u4eba\u7269\u3001\u7269\u4f53\u4e0e\u573a\u666f\u7684\u56fe\u6587\u72b6\u6001\u3002\u8f85\u52a9GPU\u5728\u4e0b\u4e00\u955c\u5934\u524d\u5c06\u8bb0\u5fc6\u56fe\u9884\u586b\u5165\u751f\u6210\u5668\u6ce8\u610f\u529b\u6c47\uff0c\u907f\u514d\u963b\u585e\u89c6\u9891\u6d41\u3002", "why_notable": "\u5c06\u667a\u80fd\u4f53\u8bb0\u5fc6\u5f15\u5165\u5b9e\u65f6\u89c6\u9891\u6d41\uff0c\u4e14\u4e0d\u56de\u8bfb\u89c6\u9891\uff0c\u907f\u514d\u751f\u6210\u9519\u8bef\u6c61\u67d3\u8bb0\u5fc6\uff1b\u4e3b\u89d2\u8eab\u4efd\u4e0e\u91cd\u8bbf\u573a\u666f\u4e00\u81f4\u6027\u5206\u522b\u63d0\u534744.9\u548c40.4\u70b9\u3002"}, {"abstract": "Looped Transformers boost expressivity by reusing shared layers across loops, yet at the cost of efficiency. Pushing their expressivity-efficiency frontier requires rethinking the core mechanism connecting adjacent loops: What should be passed as a Transformer loops? We introduce Mixture-of-Loops Transformer (MoLT), whose Mixture-of-Loops Attention (MoLA) uses keys and values (KV) as memory for selective reuse across depths and loops. Under loop residual, MoLT-R retains the residual stream and reads local KV across loops for expressivity. Under loop KV, MoLT-KV instead restarts from embeddings and reads current-loop local KV with preceding-loop memory KV at earlier positions for efficiency. MoLT-KV eliminates same-position cross-loop dependence and, paired with loop forcing for parallel training, unlocks single-traversal Mixture-of-Loops (MoL) decoding beyond the training loop horizon. To balance efficiency and quality, we introduce U-shaped MoLT (U-MoLT), which separates memory construction from prediction readout and skips unused decoder traversals without changing predictions. In 400B-token pretraining, U-MoLT outperforms OLMo3 across 700M/1.5B dense and 3B MoE models, achieving 1.7x validation cross-entropy (CE) token efficiency at 700M while improving 3B MoE 10-domain perplexity by 0.75 and 10-task accuracy by 2.1 percentage points. In 100B-token continued pretraining of Qwen3.5-0.8B-Base, our U-MoLT adaptation lowers CE on all 11 domains over the matched baseline with 1.4x mean token efficiency. At inference, U-MoLT with MoL-Hybrid-2 matches non-looped OLMo3 latency at 996.6 vs. 1,000.6 ms on S-size (~113M) models. Code is available at https://github.com/hustvl/MoLT", "arxiv_id": "2611.34923", "arxiv_url": "https://arxiv.org/abs/2611.34923", "authors": ["Lianghui Zhu", "Shijie Wang", "Xinggang Wang", "Jinze Bai", "Bo Wang", "Xiang Bai"], "brief": "\u63d0\u51fa\u4ee5\u6ce8\u610f\u529b\u952e\u503c\u4f5c\u4e3a\u8de8\u5faa\u73af\u8bb0\u5fc6\u7684\u67b6\u6784\uff0c\u9009\u62e9\u6027\u590d\u7528\u4e0d\u540c\u6df1\u5ea6\u7684\u4fe1\u606f\u3002U\u5f62\u53d8\u4f53\u5c06\u8bb0\u5fc6\u6784\u5efa\u4e0e\u9884\u6d4b\u8bfb\u53d6\u5206\u79bb\uff0c\u8df3\u8fc7\u4e0d\u5f71\u54cd\u9884\u6d4b\u7684\u89e3\u7801\u904d\u5386\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/hustvl/MoLT", "github_stars": 69, "hf_url": "https://huggingface.co/papers/2611.34923", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["MoLT-KV\u6d88\u9664\u540c\u4f4d\u7f6e\u8de8\u5faa\u73af\u4f9d\u8d56\uff0c\u652f\u6301\u5e76\u884c\u8bad\u7ec3", "4000\u4ebf\u8bcd\u5143\u9884\u8bad\u7ec3\uff1a700M\u6a21\u578b\u8bcd\u5143\u6548\u7387\u8fbe1.7\u500d", "3B MoE\u6a21\u578b\u5341\u4efb\u52a1\u51c6\u786e\u7387\u63d0\u53472.1\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u5faa\u73af\u7f51\u7edc", "\u6ce8\u610f\u529b\u673a\u5236", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2611.34923v1", "published_at": "2026-11-25", "score": 0.59, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (64\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34923.png", "title": "Mixture-of-Loops Transformer", "tldr": "\u4ee5\u952e\u503c\u8bb0\u5fc6\u91cd\u6784\u5faa\u73af\u5c42\u95f4\u8fde\u63a5\uff0c\u63d0\u5347\u8bed\u8a00\u6a21\u578b\u8bad\u7ec3\u6548\u7387\u5e76\u4fdd\u6301\u4f4e\u63a8\u7406\u5ef6\u8fdf\u3002", "upvotes": 64, "what_it_is": "\u63d0\u51fa\u4ee5\u6ce8\u610f\u529b\u952e\u503c\u4f5c\u4e3a\u8de8\u5faa\u73af\u8bb0\u5fc6\u7684\u67b6\u6784\uff0c\u9009\u62e9\u6027\u590d\u7528\u4e0d\u540c\u6df1\u5ea6\u7684\u4fe1\u606f\u3002U\u5f62\u53d8\u4f53\u5c06\u8bb0\u5fc6\u6784\u5efa\u4e0e\u9884\u6d4b\u8bfb\u53d6\u5206\u79bb\uff0c\u8df3\u8fc7\u4e0d\u5f71\u54cd\u9884\u6d4b\u7684\u89e3\u7801\u904d\u5386\u3002", "why_notable": "\u5b83\u628a\u5faa\u73af\u8ba1\u7b97\u7684\u8868\u8fbe\u4f18\u52bf\u4e0e\u4f4e\u5ef6\u8fdf\u89e3\u7801\u7ed3\u5408\u8d77\u6765\uff0c\u5e76\u5728\u591a\u79cd\u89c4\u6a21\u53ca\u7eed\u8bad\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\u6536\u76ca\uff0c\u4e3a\u5171\u4eab\u5c42\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u66f4\u5b9e\u7528\u7684\u8bbe\u8ba1\u8def\u5f84\u3002"}, {"abstract": "Establishing effective scaling laws for medical multimodal large language models (MLLMs) remains a persistent and fundamental challenge. Our systematic evaluation shows that existing medical MLLMs tend to underperform frontier general-purpose MLLMs across a range of medical tasks, while scaling model size primarily improves text capabilities rather than multimodal perception, and enabling reasoning modes fails to close this visual gap. To investigate how medical multimodal intelligence scales in practice, we introduce Sage-Med-Preview, a 35B-parameter medical multimodal model with 3B activated parameters, built by combining stage-specific curation over 322.7 million candidate records with a progressive training curriculum spanning medical pretraining, staged supervised fine-tuning, and adaptive reinforcement learning. Across this curriculum, progressive supervised refinement and adaptive reinforcement learning yield consistent stage-wise gains, substantially advancing both specialized visual understanding and medical language capabilities. Evaluated against 77 competing models across 238 clinical tasks spanning 61 public and 13 private multi-center benchmarks in more than 40 modalities, Sage-Med-Preview achieves an average score of 58.26% on the 31 public multimodal benchmarks. It outperforms the state-of-the-art open-source medical model Hulu-Med-235B-A22B at 50.99% and the general scientific model Intern-S2-Preview at 52.24%, and approaches the advanced proprietary model GPT-6.2-Sol across multiple tasks such as comprehensive multimodal understanding, report generation, and visual grounding. Although substantial challenges remain in complex medical reasoning and multi-step clinical workflows, this report provides empirical evidence, actionable data and training recipes, and a rigorous benchmark toward scalable clinical multimodal intelligence.", "arxiv_id": "2611.34575", "arxiv_url": "https://arxiv.org/abs/2611.34575", "authors": ["Sage-Med Team", ":", "Ming Hu", "Cheng Tang", "Wei Li", "Rongbin Li", "Feilong Tang", "Junru Hu", "Hongze Zhu", "Qiujuan Yan", "Huanze Tang", "Shaocong Wei", "Siyuan Yan", "Min Cen", "Zhongxing Xu", "Zhonghua Wang", "Lie Ju", "Zhen Yu", "Wenjie Li", "Shiyan Su", "Jing Hao", "Jingyong Liang", "Diping Song", "Fang Yan", "Chenglong Ma", "Junzhi Ning", "Haochen Xue", "Zanting Ye", "Chenrun Wang", "Jinjie Wei", "Yi Xin", "Jianghan Shen", "Siqi Luo", "Jiyao Liu", "Huidong Xie", "Jun Zhao", "Rulin Zhou", "Longquan Jiang", "Ziyan Huang", "Ying Chen", "Hanxiao Zhang", "Junyang Wu", "Mouxiao Bian", "Jiashi Lin", "Chenyu Wang", "Qi Qin", "Jie Huang", "Yiling Zhou", "Jiawei Chen", "Kefan Wang", "Jingjing Hua", "Yaoyu Liu", "Huihui Xu", "Tianbin Li", "Jin Ye", "Ziyang Chen", "Shujian Gao", "Zilin Lu", "Jiangtao Yan", "Changkai Ji", "Wenhao Tang", "Xinyi Zeng", "Yuxing Chen", "Hongwei Yang", "Rongzhao Zhang", "Jinru Ding", "Yingcheng Wu", "Zhenfei Yin", "Jinzhe Li", "Lu Lu", "Yun Zhong", "Zhishan Lin", "Bingli Wang", "Xiaohan Ren", "Jianmin Qian", "Penghao Zhao", "Zhongbo Tian", "Zhenbang Zhou", "Peiling Dai", "Mengjing Zhao", "Jingyu Zheng", "Pinan Liu", "Shiwei Li", "Victoria Mar", "Cristina Vico-Alonso", "Qiang Wu", "Xianming Liu", "Lingtong Huang", "Dili Song", "Minghui Zhang", "Wenlong Zhang", "Qipeng Guo", "Yuqiang Li", "Nanqing Dong", "Yun Gu", "Qi Duan", "Hongliang Ren", "Hongming Shan", "Yin Xie", "Xiang An", "Benyou Wang", "Yueming Su", "Yefeng Zheng", "Zongyuan Ge", "Chun-Mei Feng", "Jie Xu", "Yu Qiao", "Junjun He", "Yirong Chen"], "brief": "\u7814\u7a76\u63a8\u51fa\u603b\u53c2\u6570350\u4ebf\u3001\u6fc0\u6d3b30\u4ebf\u7684\u533b\u7597\u591a\u6a21\u6001\u6a21\u578b\uff0c\u4ece3.227\u4ebf\u6761\u5019\u9009\u8bb0\u5f55\u5206\u9636\u6bb5\u7b5b\u9009\u6570\u636e\uff0c\u7ed3\u5408\u533b\u7597\u9884\u8bad\u7ec3\u3001\u5206\u9636\u6bb5\u76d1\u7763\u5fae\u8c03\u4e0e\u81ea\u9002\u5e94\u5f3a\u5316\u5b66\u4e60\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/Sage-Med/Sage-Med-Preview", "github_stars": 19, "hf_url": "https://huggingface.co/papers/2611.34575", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6269\u5927\u53c2\u6570\u4e3b\u8981\u6539\u5584\u6587\u672c\u80fd\u529b\uff0c\u63a8\u7406\u6a21\u5f0f\u672a\u5f25\u5408\u89c6\u89c9\u5dee\u8ddd", "\u6e10\u8fdb\u76d1\u7763\u5fae\u8c03\u4e0e\u81ea\u9002\u5e94\u5f3a\u5316\u5b66\u4e60\u5e26\u6765\u6301\u7eed\u9636\u6bb5\u6536\u76ca", "31\u4e2a\u516c\u5f00\u591a\u6a21\u6001\u57fa\u51c6\u5e73\u574758.26%\uff0c\u8d85\u8d8a\u533b\u7597\u5f00\u6e90\u5bf9\u7167"], "keywords": ["\u533b\u7597\u4eba\u5de5\u667a\u80fd", "\u591a\u6a21\u6001\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u6269\u5c55"], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2611.34575v1", "published_at": "2026-11-25", "score": 0.563, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (89\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34575.png", "title": "Sage-Med: Scaling Medical Multimodal Intelligence", "tldr": "\u901a\u8fc7\u5206\u9636\u6bb5\u6570\u636e\u7b5b\u9009\u4e0e\u6e10\u8fdb\u8bad\u7ec3\uff0c\u533b\u7597\u591a\u6a21\u6001\u6a21\u578b\u4ee5\u8f83\u4f4e\u6fc0\u6d3b\u89c4\u6a21\u63d0\u5347\u89c6\u89c9\u4e0e\u8bed\u8a00\u80fd\u529b\u3002", "upvotes": 89, "what_it_is": "\u7814\u7a76\u63a8\u51fa\u603b\u53c2\u6570350\u4ebf\u3001\u6fc0\u6d3b30\u4ebf\u7684\u533b\u7597\u591a\u6a21\u6001\u6a21\u578b\uff0c\u4ece3.227\u4ebf\u6761\u5019\u9009\u8bb0\u5f55\u5206\u9636\u6bb5\u7b5b\u9009\u6570\u636e\uff0c\u7ed3\u5408\u533b\u7597\u9884\u8bad\u7ec3\u3001\u5206\u9636\u6bb5\u76d1\u7763\u5fae\u8c03\u4e0e\u81ea\u9002\u5e94\u5f3a\u5316\u5b66\u4e60\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u7528\u8986\u76d6238\u9879\u4e34\u5e8a\u4efb\u52a1\u7684\u8bc4\u6d4b\uff0c\u663e\u793a\u533b\u7597\u591a\u6a21\u6001\u63d0\u5347\u4e0d\u80fd\u53ea\u9760\u6269\u5927\u6a21\u578b\uff0c\u5e76\u7ed9\u51fa\u53ef\u64cd\u4f5c\u7684\u6570\u636e\u7b5b\u9009\u4e0e\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Image editing models can follow a wide range of instructions, but video editing models still lag behind, limited in part by the difficulty of collecting paired source and edited videos. Is it possible to transfer advanced image editing capabilities to video editors without new paired videos? We introduce Image-to-Video Transfer (I2VT), which improves pretrained video editors and expands them to new editing tasks using an image editor. It enables efficient post-training with no architectural changes and no new videos, using only individual images. Our key idea is to let the video editor role-play as an image editor: it edits an image as a one-frame video, with the image editor guiding the video editor\u0027s predictions at each denoising step. Although the video editor sees only single images during training, at test time it applies the improved and expanded capabilities to whole video clips while preserving temporal consistency. To push the boundaries of video editing, we introduce OpenVE++, an extension of OpenVE-Bench that adds four new editing tasks useful for video production, including action changes, expression changes, body movements, and scene relighting. Our experiments across three different video editors show that I2VT improves existing editing capabilities and expands them to new tasks, and our models achieve state-of-the-art (SOTA) performance on both OpenVE-Bench and OpenVE++.", "arxiv_id": "2611.34941", "arxiv_url": "https://arxiv.org/abs/2611.34941", "authors": ["Ji Xie", "Yanhao Jia", "Xiangpeng Yang", "Martin Q. Ma", "Sihan Xu", "Erik Cambria", "Louis-Philippe Morency"], "brief": "I2VT\u5c06\u5355\u5f20\u56fe\u50cf\u89c6\u4f5c\u5355\u5e27\u89c6\u9891\uff0c\u8ba9\u56fe\u50cf\u7f16\u8f91\u5668\u5728\u6bcf\u4e2a\u53bb\u566a\u6b65\u9aa4\u6307\u5bfc\u89c6\u9891\u7f16\u8f91\u5668\u9884\u6d4b\u3002\u65e0\u9700\u6539\u52a8\u67b6\u6784\u6216\u65b0\u589e\u89c6\u9891\u6570\u636e\uff0c\u5373\u53ef\u540e\u8bad\u7ec3\u5e76\u6269\u5c55\u7f16\u8f91\u4efb\u52a1\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/HorizonWind2004/i2v-transfer", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2611.34941", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["I2VT\u9010\u53bb\u566a\u6b65\u8fc1\u79fb\u6307\u5bfc\uff0c\u4ec5\u7528\u5355\u5f20\u56fe\u50cf\u8bad\u7ec3", "OpenVE++\u65b0\u589e\u52a8\u4f5c\u3001\u8868\u60c5\u3001\u8eab\u4f53\u8fd0\u52a8\u4e0e\u573a\u666f\u91cd\u5149\u71674\u7c7b\u4efb\u52a1", "\u57283\u79cd\u89c6\u9891\u7f16\u8f91\u5668\u4e0a\u9a8c\u8bc1\uff0c\u4e24\u4e2a\u57fa\u51c6\u5747\u8fbe\u5230SOTA"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u56fe\u50cf\u7f16\u8f91", "\u77e5\u8bc6\u8fc1\u79fb", "\u540e\u8bad\u7ec3"], "num_comments": 3, "on_hf": true, "organization": "Carnegie Mellon University School of Computer Science", "pdf_url": "https://arxiv.org/pdf/2611.34941v1", "published_at": "2026-11-25", "score": 0.563, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (44\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34941.png", "title": "Improving and Expanding Video Editing Capabilities Without Videos", "tldr": "\u4ec5\u7528\u5355\u5f20\u56fe\u50cf\u540e\u8bad\u7ec3\uff0c\u5c06\u56fe\u50cf\u7f16\u8f91\u80fd\u529b\u8fc1\u79fb\u5230\u89c6\u9891\u5e76\u4fdd\u6301\u65f6\u5e8f\u4e00\u81f4\u6027\u3002", "upvotes": 44, "what_it_is": "I2VT\u5c06\u5355\u5f20\u56fe\u50cf\u89c6\u4f5c\u5355\u5e27\u89c6\u9891\uff0c\u8ba9\u56fe\u50cf\u7f16\u8f91\u5668\u5728\u6bcf\u4e2a\u53bb\u566a\u6b65\u9aa4\u6307\u5bfc\u89c6\u9891\u7f16\u8f91\u5668\u9884\u6d4b\u3002\u65e0\u9700\u6539\u52a8\u67b6\u6784\u6216\u65b0\u589e\u89c6\u9891\u6570\u636e\uff0c\u5373\u53ef\u540e\u8bad\u7ec3\u5e76\u6269\u5c55\u7f16\u8f91\u4efb\u52a1\u3002", "why_notable": "\u7ed5\u5f00\u6210\u5bf9\u89c6\u9891\u6570\u636e\u7684\u91c7\u96c6\u74f6\u9888\uff0c\u4e3a\u5df2\u6709\u89c6\u9891\u7f16\u8f91\u5668\u63d0\u4f9b\u4f4e\u6210\u672c\u80fd\u529b\u5347\u7ea7\u8def\u5f84\uff1b\u5355\u5e27\u8bad\u7ec3\u540e\u4ecd\u80fd\u5728\u6574\u6bb5\u89c6\u9891\u4e0a\u4fdd\u6301\u65f6\u5e8f\u4e00\u81f4\u6027\u3002"}, {"abstract": "Agent harnesses today manage context on the model\u0027s behalf: when the window fills, the harness triggers a compaction that summarizes the history. We study the alternative, \\emph{model-driven} context management, in which the model itself decides when and what to compact through a context API. We gave models control over their own context in \\nooa, NVIDIA\u0027s open source agent harness, and compared the two strategies on document research and machine learning engineering across context budgets from 8K to 512K tokens. Models that use the context API effectively reach higher accuracy, often with fewer input tokens, especially at tight budgets: \\textbf{GPT 6.1 nearly triples its score at a 32K budget} on OfficeQA Pro v2 (21\\%~$\\rightarrow$~56\\%), and \\textbf{Kimi gains with up to 41\\% fewer input tokens}. Models differ widely, however, in how often they use the API, how aggressively they compact, and when they start compacting, and prompt changes shift that timing. Finally, we show that \\textbf{inference engines can make model-driven edits cheaper}: by reusing the KV cache of the unchanged suffix after an edit, \\textbf{we cut prefill compute by up to 15\\% per request with no measurable change in accuracy}. Together, these results point to a new co-design frontier: models trained to manage their own context, served by inference engines that support KV cache editing.", "arxiv_id": "2611.34147", "arxiv_url": "https://arxiv.org/abs/2611.34147", "authors": ["Alessio Devoto", "Avinash Vem", "Tara Safavi", "Sanjay Kariyappa", "Yu-Hsuan Tseng", "Paul Furgale", "Ricardo Silveira Cabral"], "brief": "\u5728\u5f00\u6e90\u667a\u80fd\u4f53\u6846\u67b6 nooa \u4e2d\uff0c\u6a21\u578b\u901a\u8fc7\u4e0a\u4e0b\u6587 API \u81ea\u884c\u51b3\u5b9a\u4f55\u65f6\u538b\u7f29\u3001\u4fdd\u7559\u4ec0\u4e48\u3002\u7814\u7a76\u5bf9\u6bd4\u6846\u67b6\u81ea\u52a8\u538b\u7f29\uff0c\u5e76\u6d4b\u8bd5\u7f16\u8f91\u540e\u590d\u7528\u7f13\u5b58\u7684\u63a8\u7406\u4f18\u5316\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/nvidia-nemo/labs-OO-Agents", "github_stars": 2332, "hf_url": "https://huggingface.co/papers/2611.34147", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6\u6587\u6863\u7814\u7a76\u4e0e\u673a\u5668\u5b66\u4e60\u5de5\u7a0b\uff0c\u9884\u7b97\u4e3a8K\u81f3512K", "32K\u4e0bGPT 6.1\u5f97\u5206\u4ece21%\u5347\u81f356%", "\u590d\u7528\u672a\u6539\u540e\u7f00KV\u7f13\u5b58\uff0c\u5355\u8bf7\u6c42\u9884\u586b\u5145\u8ba1\u7b97\u6700\u591a\u964d15%"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u63a8\u7406\u4f18\u5316", "\u7f13\u5b58\u590d\u7528"], "num_comments": 3, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2611.34147v1", "published_at": "2026-11-25", "score": 0.556, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34147.png", "title": "Letting Models Manage Their Own Context: Where We Stand", "tldr": "\u8ba9\u6a21\u578b\u81ea\u4e3b\u51b3\u5b9a\u4e0a\u4e0b\u6587\u538b\u7f29\u65f6\u673a\u4e0e\u5185\u5bb9\uff0c\u53ef\u63d0\u5347\u667a\u80fd\u4f53\u51c6\u786e\u7387\u5e76\u964d\u4f4e\u5f00\u9500\u3002", "upvotes": 7, "what_it_is": "\u5728\u5f00\u6e90\u667a\u80fd\u4f53\u6846\u67b6 nooa \u4e2d\uff0c\u6a21\u578b\u901a\u8fc7\u4e0a\u4e0b\u6587 API \u81ea\u884c\u51b3\u5b9a\u4f55\u65f6\u538b\u7f29\u3001\u4fdd\u7559\u4ec0\u4e48\u3002\u7814\u7a76\u5bf9\u6bd4\u6846\u67b6\u81ea\u52a8\u538b\u7f29\uff0c\u5e76\u6d4b\u8bd5\u7f16\u8f91\u540e\u590d\u7528\u7f13\u5b58\u7684\u63a8\u7406\u4f18\u5316\u3002", "why_notable": "\u4e0a\u4e0b\u6587\u7ba1\u7406\u4e0d\u5fc5\u53ea\u662f\u6846\u67b6\u7684\u88ab\u52a8\u515c\u5e95\u673a\u5236\uff0c\u4e5f\u53ef\u6210\u4e3a\u6a21\u578b\u80fd\u529b\u3002\u7ed3\u679c\u63d0\u793a\u6a21\u578b\u8bad\u7ec3\u4e0e\u63a8\u7406\u7f13\u5b58\u7f16\u8f91\u503c\u5f97\u534f\u540c\u8bbe\u8ba1\uff0c\u4f46\u6536\u76ca\u53d6\u51b3\u4e8e\u6a21\u578b\u4f7f\u7528\u7b56\u7565\u3002"}, {"abstract": "Real-to-simulation transfer, which builds simulations from real-world observations, has long been studied in research and industry. Recently, coding agents have become capable of generating simulation programs from video recordings, and several benchmarks have been proposed to evaluate them. However, each individual benchmark defines its own inputs, deliverables, and scoring pipeline. This leads to $N \\times M$ integrations when evaluating $N$ methods on $M$ benchmarks. To this end, we present Real2SimLab, a unified platform for real-to-simulation transfer. It evaluates a method by running its written program and scoring the output simulation with the original scorer of each benchmark. Moreover, Real2SimLab provides a pipeline to create training data and reward annotations for real-to-simulation methods. Our pipeline carefully avoids data contamination by filtering out the video recordings that exist in benchmarks. For each video recording, a program is first produced, and then our pipeline computes its reward with the same code that Real2SimLab uses for evaluation. So far, it supports 47 coding agents and 5 non-agent methods on 6 benchmarks. Both the platform and Awesome-Real2Sim, our research map of nearly 300 real-to-simulation papers, are open source, and we invite the Real2SimHub community to build them together.", "arxiv_id": "2611.34849", "arxiv_url": "https://arxiv.org/abs/2611.34849", "authors": ["Yongchang Zhang", "Jie Huang", "Yunhe Ni", "Ningyu Zhou", "Guangyu Zhao", "Ruixun Liu", "Rui Huang", "Yidi Wu", "TianZe Zhang", "Zixiang Jiang", "Xiang Li", "Kevin Shen", "Yiwu Zhong"], "brief": "Real2SimLab\u7edf\u4e00\u8fd0\u884c\u65b9\u6cd5\u751f\u6210\u7684\u4eff\u771f\u7a0b\u5e8f\uff0c\u5e76\u8c03\u7528\u5404\u57fa\u51c6\u539f\u6709\u8bc4\u5206\u5668\u8bc4\u6d4b\uff1b\u540c\u65f6\u751f\u6210\u8bad\u7ec3\u6570\u636e\u4e0e\u5956\u52b1\u6807\u6ce8\uff0c\u8fc7\u6ee4\u57fa\u51c6\u89c6\u9891\u4ee5\u907f\u514d\u6570\u636e\u6c61\u67d3\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/Real2SimHub/Real2SimLab", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2611.34849", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u652f\u630147\u4e2a\u7f16\u7801\u667a\u80fd\u4f53\u30015\u4e2a\u975e\u667a\u80fd\u4f53\u65b9\u6cd5\u548c6\u4e2a\u57fa\u51c6", "\u6267\u884c\u751f\u6210\u7a0b\u5e8f\uff0c\u4fdd\u7559\u5404\u57fa\u51c6\u539f\u59cb\u8bc4\u5206\u5668", "\u8bad\u7ec3\u5956\u52b1\u590d\u7528\u8bc4\u6d4b\u4ee3\u7801\uff0c\u8fc7\u6ee4\u57fa\u51c6\u4e2d\u7684\u89c6\u9891"], "keywords": ["\u4eff\u771f\u751f\u6210", "\u7f16\u7801\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u8bad\u7ec3\u6570\u636e"], "num_comments": 3, "on_hf": true, "organization": "PKU-VaLuE-Lab", "pdf_url": "https://arxiv.org/pdf/2611.34849v1", "published_at": "2026-11-25", "score": 0.544, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (104\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34849.png", "title": "Real2SimLab: A Unified Platform for Real-to-Simulation Transfer", "tldr": "\u7edf\u4e00\u771f\u5b9e\u89c6\u9891\u5230\u4eff\u771f\u7684\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u7ba1\u7ebf\uff0c\u964d\u4f4e\u8de8\u57fa\u51c6\u65b9\u6cd5\u63a5\u5165\u6210\u672c\u3002", "upvotes": 104, "what_it_is": "Real2SimLab\u7edf\u4e00\u8fd0\u884c\u65b9\u6cd5\u751f\u6210\u7684\u4eff\u771f\u7a0b\u5e8f\uff0c\u5e76\u8c03\u7528\u5404\u57fa\u51c6\u539f\u6709\u8bc4\u5206\u5668\u8bc4\u6d4b\uff1b\u540c\u65f6\u751f\u6210\u8bad\u7ec3\u6570\u636e\u4e0e\u5956\u52b1\u6807\u6ce8\uff0c\u8fc7\u6ee4\u57fa\u51c6\u89c6\u9891\u4ee5\u907f\u514d\u6570\u636e\u6c61\u67d3\u3002", "why_notable": "\u5c06\u5206\u6563\u7684\u8bc4\u6d4b\u63a5\u53e3\u6574\u5408\u4e3a\u5171\u4eab\u5e73\u53f0\uff0c\u964d\u4f4e\u8de8\u57fa\u51c6\u6bd4\u8f83\u6210\u672c\uff1b\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u590d\u7528\u8bc4\u5206\u4ee3\u7801\uff0c\u6709\u52a9\u4e8e\u4fdd\u6301\u5956\u52b1\u4fe1\u53f7\u4e00\u81f4\u3002"}, {"abstract": "Learning for dexterous manipulation is limited by the scarcity of high-quality demonstrations: retargeting from human video is imprecise, teleoperation gives no force feedback to the operator, and exoskeleton-based collection is hard to scale up. We present PyRUA-Dex, a framework that enables coding agents to develop dexterous manipulation through programmatic policy, without the need of demonstrations. The programmatic policy is developed in two stages: during exploration, multiple agents explore in parallel for task skills and ways to compose them, and a distilling agent condenses the successful attempts into a task library and one program. During refinement, this program is improved through randomized layouts for enhanced robustness and execution efficiency. In simulated environments, PyRUA-Dex achieves SOTA on Bench2Dex with a score of 72.9 and reaches 81.0% success on DexJoCo under full randomization, ahead of every trained policy on both benchmarks. In real world experiments on a bimanual platform with two 22-DoF hands, PyRUA-Dex learns to play piano, write calligraphy, and other tasks efficiently: learning a new piece from sheet music takes as little as 30 minutes. These results suggest that PyRUA-Dex is an effective framework for developing dexterous manipulation policies with coding agents in the absence of high quality dexterous manipulation demonstrations.", "arxiv_id": "2611.33144", "arxiv_url": "https://arxiv.org/abs/2611.33144", "authors": ["Feixiang Ruan", "Guodong Lv", "Kewei Zhang", "Wenbo Huang", "Yintianrun Zhang", "Qiang Wang", "Ruiyang Si", "Shunyu Yang", "Shulong Jiang", "Weicheng Duan", "Rui Ni", "Jianxin Bi", "Lekai Wang", "Yuze Fan", "Haobo Li", "Zeliang Fu", "Jiankun Zhang", "Duomin Wang", "Enze Xie", "Daquan Zhou"], "brief": "PyRUA-Dex\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u76f4\u63a5\u5f00\u53d1\u7a0b\u5e8f\u5316\u64cd\u4f5c\u7b56\u7565\uff1a\u591a\u667a\u80fd\u4f53\u5e76\u884c\u63a2\u7d22\u6280\u80fd\u4e0e\u7ec4\u5408\uff0c\u84b8\u998f\u4e3a\u4efb\u52a1\u5e93\u548c\u7a0b\u5e8f\uff0c\u518d\u7528\u968f\u673a\u5e03\u5c40\u4f18\u5316\u9c81\u68d2\u6027\u4e0e\u6267\u884c\u6548\u7387\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33144", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5e76\u884c\u63a2\u7d22\u4e0e\u84b8\u998f\u751f\u6210\u7a0b\u5e8f\u5316\u7b56\u7565\uff0c\u65e0\u9700\u793a\u8303\u6570\u636e", "Bench2Dex\u5f97\u520672.9\uff0cDexJoCo\u6210\u529f\u738781.0%", "\u53cc22\u81ea\u7531\u5ea6\u673a\u68b0\u624b\u5b9e\u673a\u9a8c\u8bc1\uff0c\u5b66\u65b0\u66f2\u6700\u5feb30\u5206\u949f"], "keywords": ["\u7075\u5de7\u64cd\u4f5c", "\u7f16\u7801\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u5316\u7b56\u7565", "\u673a\u5668\u4eba\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "DAGroup-PKU", "pdf_url": "https://arxiv.org/pdf/2611.33144v1", "published_at": "2026-11-24", "score": 0.521, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (44\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33144.png", "title": "PyRUA-Dex: Learning Programmatic Policies for Dexterous Bimanual Manipulation with Coding Agents", "tldr": "\u7f16\u7801\u667a\u80fd\u4f53\u65e0\u9700\u793a\u8303\u5373\u53ef\u7f16\u5199\u53cc\u624b\u7075\u5de7\u64cd\u4f5c\u7b56\u7565\uff0c\u5728\u4eff\u771f\u4e0e\u5b9e\u673a\u4efb\u52a1\u4e2d\u8868\u73b0\u7a81\u51fa\u3002", "upvotes": 44, "what_it_is": "PyRUA-Dex\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u76f4\u63a5\u5f00\u53d1\u7a0b\u5e8f\u5316\u64cd\u4f5c\u7b56\u7565\uff1a\u591a\u667a\u80fd\u4f53\u5e76\u884c\u63a2\u7d22\u6280\u80fd\u4e0e\u7ec4\u5408\uff0c\u84b8\u998f\u4e3a\u4efb\u52a1\u5e93\u548c\u7a0b\u5e8f\uff0c\u518d\u7528\u968f\u673a\u5e03\u5c40\u4f18\u5316\u9c81\u68d2\u6027\u4e0e\u6267\u884c\u6548\u7387\u3002", "why_notable": "\u5c06\u7f16\u7801\u667a\u80fd\u4f53\u7528\u4e8e\u751f\u6210\u53ef\u6267\u884c\u7684\u7075\u5de7\u64cd\u4f5c\u7a0b\u5e8f\uff0c\u7ed5\u5f00\u9ad8\u8d28\u91cf\u793a\u8303\u91c7\u96c6\u74f6\u9888\uff1b\u4e24\u9879\u4eff\u771f\u57fa\u51c6\u9886\u5148\u8bad\u7ec3\u5f0f\u7b56\u7565\uff0c\u5e76\u5c55\u793a\u771f\u5b9e\u53cc\u624b\u64cd\u4f5c\u80fd\u529b\u3002"}, {"abstract": "Embodied agents operating around people must not only recognize social cues, but also decide when the available evidence is sufficient, whether to intervene, and how to respond without violating social norms. Existing benchmarks typically evaluate these abilities in isolation or with access to completed videos, obscuring where an online social decision fails. We introduce AIRIS, a causal streaming benchmark that formulates social embodied intelligence as a time-anchored chain of Attention, Intention, Reaction, and Interaction (A-I-R-I). AIRIS contains 8,000 expert-curated questions grounded in 357 egocentric clips across 11 context categories and 36 capability dimensions. At each query, models receive only the observation prefix available at that time; decision-aware metrics reward calibrated waiting and complete reactions while penalizing premature commitment. Evaluating 45 proprietary and open-source general-purpose, embodied, streaming-video, and omni-modal models reveals fragmented and temporally miscalibrated competence. General-purpose VLMs excel at passive cue grounding and intent recognition, whereas embodied specialists lead on isolated reaction sub-decisions; yet across all families, models frequently guess intents before sufficient evidence emerges and fail to jointly align intervention timing, action domain, and concrete execution within the same episode. AIRIS thus provides a diagnostic foundation for bridging the gap between passive social perception and reliable embodied interaction.", "arxiv_id": "2611.34347", "arxiv_url": "https://arxiv.org/abs/2611.34347", "authors": ["Yuchen Zhou", "Hongsheng Wu", "Jiayu Tang", "Yunxuan Mao", "Hanjing Ye", "Shenghao Zhang", "Jing Tang", "Chun-Kai Fan", "Yufei Huang", "Yonggen Ling", "He Zhang"], "brief": "AIRIS\u5c06\u793e\u4ea4\u5177\u8eab\u80fd\u529b\u62c6\u4e3a\u6ce8\u610f\u3001\u610f\u56fe\u3001\u53cd\u5e94\u4e0e\u4ea4\u4e92\u7684\u65f6\u95f4\u94fe\u3002\u6a21\u578b\u53ea\u80fd\u8bfb\u53d6\u67e5\u8be2\u65f6\u523b\u4e4b\u524d\u7684\u89c6\u9891\uff0c\u5e76\u901a\u8fc7\u51b3\u7b56\u611f\u77e5\u6307\u6807\u8bc4\u4f30\u7b49\u5f85\u3001\u5e72\u9884\u65f6\u673a\u4e0e\u6267\u884c\u5b8c\u6574\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AIRIS-bench/AIRIS", "github_stars": 23, "hf_url": "https://huggingface.co/papers/2611.34347", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["8000\u9053\u4e13\u5bb6\u6574\u7406\u95ee\u9898\uff0c\u8986\u76d6357\u6bb5\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "A-I-R-I\u65f6\u95f4\u94fe\u8986\u76d611\u7c7b\u60c5\u5883\u300136\u9879\u80fd\u529b\u7ef4\u5ea6", "\u8bc4\u6d4b45\u4e2a\u6a21\u578b\uff0c\u666e\u904d\u5b58\u5728\u610f\u56fe\u62a2\u5224\u4e0e\u5e72\u9884\u6267\u884c\u8131\u8282"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u9891\u7406\u89e3", "\u793e\u4ea4\u63a8\u7406", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2611.34347v1", "published_at": "2026-11-25", "score": 0.51, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34347.png", "title": "AIRIS: Benchmarking Social Embodied Intelligence in Egocentric Streaming Videos", "tldr": "\u7528\u56e0\u679c\u89c6\u9891\u6d41\u8bc4\u6d4b\u5177\u8eab\u667a\u80fd\u7684\u793e\u4ea4\u51b3\u7b56\uff0c\u63ed\u793a\u8fc7\u65e9\u5224\u65ad\u4e0e\u5e72\u9884\u6267\u884c\u8131\u8282\u3002", "upvotes": 17, "what_it_is": "AIRIS\u5c06\u793e\u4ea4\u5177\u8eab\u80fd\u529b\u62c6\u4e3a\u6ce8\u610f\u3001\u610f\u56fe\u3001\u53cd\u5e94\u4e0e\u4ea4\u4e92\u7684\u65f6\u95f4\u94fe\u3002\u6a21\u578b\u53ea\u80fd\u8bfb\u53d6\u67e5\u8be2\u65f6\u523b\u4e4b\u524d\u7684\u89c6\u9891\uff0c\u5e76\u901a\u8fc7\u51b3\u7b56\u611f\u77e5\u6307\u6807\u8bc4\u4f30\u7b49\u5f85\u3001\u5e72\u9884\u65f6\u673a\u4e0e\u6267\u884c\u5b8c\u6574\u6027\u3002", "why_notable": "\u5b83\u5c06\u88ab\u52a8\u8bc6\u522b\u4e0e\u5728\u7ebf\u884c\u52a8\u653e\u8fdb\u540c\u4e00\u51b3\u7b56\u94fe\uff0c\u65e2\u68c0\u67e5\u662f\u5426\u770b\u61c2\uff0c\u4e5f\u68c0\u67e5\u4f55\u65f6\u4ecb\u5165\u3001\u5982\u4f55\u6267\u884c\uff0c\u4e3a\u5b9a\u4f4d\u793e\u4ea4\u5177\u8eab\u7cfb\u7edf\u7684\u65f6\u5e8f\u5931\u8bef\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Large language models (LLMs) that continue improving after deployment (e.g., recursive self-improvement) offer a promising path toward general intelligence. Current test-time methods pursue this goal on unlabeled questions, primarily relying on self-consistency: they generate independent solutions and use majority voting to select an answer or construct training targets. This leaves earlier reasoning unused at inference and can reinforce an incorrect majority during training. Humans instead build on earlier attempts to preserve useful reasoning, correct mistakes and improve their problem-solving strategies. Following this principle, we propose Test-Time Recursive Self-Improvement (TT-RSI), a label-free framework for improving LLMs at test time through two mutually reinforcing components: (1) In-Context RSI repeatedly re-solves each question using the full previous solution as a reference, letting the model decide whether and how to use it so that inference compute builds on earlier reasoning. (2) In-Weight RSI distills successive refinements into the model\u0027s weights, enabling progress beyond an initially wrong majority and theoretically bringing the first attempt toward the model\u0027s infinite-step refinement limit. The updated model answers better and refines more effectively, generating stronger references for subsequent training. Extensive experiments show that TT-RSI improves average accuracy by +13.89% over the base model and outperforms the strongest self-consistency-based method by +4.79% under the same test-time scaling budget.", "arxiv_id": "2611.30965", "arxiv_url": "https://arxiv.org/abs/2611.30965", "authors": ["Jianyu Wu", "Yizhou Wang", "Encheng Su", "Jinouwen Zhang", "Pengze Li", "Lintao Wang", "Chen Tang", "Aoran Wang", "Wanli Ouyang", "Shixiang Tang"], "brief": "TT-RSI\u7ed3\u5408\u4e0a\u4e0b\u6587\u9012\u5f52\u6539\u8fdb\u4e0e\u6743\u91cd\u66f4\u65b0\uff1a\u6a21\u578b\u53c2\u8003\u5b8c\u6574\u7684\u5148\u524d\u89e3\u7b54\u53cd\u590d\u6c42\u89e3\uff0c\u518d\u5c06\u8fde\u7eed\u6539\u8fdb\u84b8\u998f\u8fdb\u6743\u91cd\uff0c\u4f7f\u63a8\u7406\u4e0e\u8bad\u7ec3\u76f8\u4e92\u4fc3\u8fdb\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/uanu2002/TT-RSI", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.30965", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["In-Context RSI\u53c2\u8003\u5b8c\u6574\u524d\u6b21\u89e3\u7b54\u8fed\u4ee3\u6c42\u89e3", "In-Weight RSI\u5c06\u8fde\u7eed\u6539\u8fdb\u84b8\u998f\u8fdb\u6a21\u578b\u6743\u91cd", "\u51c6\u786e\u7387\u8f83\u57fa\u5ea7\u63d0\u534713.89%\uff0c\u8f83\u6700\u5f3a\u5bf9\u7167\u63d0\u53474.79%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 4, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2611.30965v1", "published_at": "2026-11-23", "score": 0.501, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30965.png", "title": "Beyond Self-Consistency: Recursive Self-Improvement at Test Time", "tldr": "\u901a\u8fc7\u590d\u7528\u5148\u524d\u63a8\u7406\u5e76\u84b8\u998f\u8fed\u4ee3\u6539\u8fdb\uff0c\u8ba9\u6a21\u578b\u5728\u65e0\u6807\u7b7e\u6d4b\u8bd5\u4e2d\u6301\u7eed\u63d0\u5347\u51c6\u786e\u7387\u3002", "upvotes": 15, "what_it_is": "TT-RSI\u7ed3\u5408\u4e0a\u4e0b\u6587\u9012\u5f52\u6539\u8fdb\u4e0e\u6743\u91cd\u66f4\u65b0\uff1a\u6a21\u578b\u53c2\u8003\u5b8c\u6574\u7684\u5148\u524d\u89e3\u7b54\u53cd\u590d\u6c42\u89e3\uff0c\u518d\u5c06\u8fde\u7eed\u6539\u8fdb\u84b8\u998f\u8fdb\u6743\u91cd\uff0c\u4f7f\u63a8\u7406\u4e0e\u8bad\u7ec3\u76f8\u4e92\u4fc3\u8fdb\u3002", "why_notable": "\u5b83\u8ba9\u6d4b\u8bd5\u65f6\u7b97\u529b\u79ef\u7d2f\u5e76\u4fee\u6b63\u5df2\u6709\u63a8\u7406\uff0c\u800c\u975e\u53ea\u505a\u72ec\u7acb\u91c7\u6837\u6295\u7968\uff1b\u5728\u76f8\u540c\u9884\u7b97\u4e0b\u8d85\u8fc7\u6700\u5f3a\u81ea\u4e00\u81f4\u6027\u65b9\u6cd5\uff0c\u5c55\u793a\u65e0\u6807\u7b7e\u6301\u7eed\u6539\u8fdb\u7684\u6f5c\u529b\u3002"}, {"abstract": "Verification is increasingly critical across various inference and learning paradigms, such as test-time scaling, recursive intelligence and automated research, where feedback can improve efficiency and optimization. Common score-based verifiers, or discriminative reward models, predict a scalar reward for an output. While useful for filtering, rewarding, and ranking, such scores provide no explicit, auditable evidentiary basis for the judgment. In parallel, although existing generative process reward models offer text feedback, most designs do not fully exploit agentic capabilities, such as tool use and iterative reasoning, which are essential for fact-checking and fine-grained claim verification. In this paper, we address these limitations by introducing Agent-as-a-Verifier, an agentic, certificate-producing verification system that places role-separated LLM agents inside a formal-methods-inspired claim-obligation-certificate protocol. Given a generation candidate, Agent-as-a-Verifier produces a certificate by extracting a verdict-blind dependency graph of claims, independently compiling the task\u0027s acceptance contract, and deriving checkable obligations. On Terminal-Bench 2.1, Agent-as-a-Verifier achieves higher accuracy than the state-of-the-art approach. Across different downstream applications, the augmented agent also outperforms the plain agent on FrontierMath and CyberGym. More importantly, Agent-as-a-Verifier is able to identify reward-hacking solutions that deceive the benchmark evaluator, highlighting its broader potential for iterative and recursive agent optimization. Code is available at https://github.com/sunyxedu/General-Verifier", "arxiv_id": "2611.34132", "arxiv_url": "https://arxiv.org/abs/2611.34132", "authors": ["Yuxuan Sun", "Hao", "Chen", "Nagarajan Natarajan", "Sushrut Karmalkar", "Niranjani Prasad", "Amit Sharma", "Hongxiang Fan"], "brief": "\u63d0\u51fa\u667a\u80fd\u4f53\u9a8c\u8bc1\u7cfb\u7edf\uff0c\u4ee5\u89d2\u8272\u5206\u79bb\u7684\u5927\u6a21\u578b\u6267\u884c\u58f0\u660e\u2014\u4e49\u52a1\u2014\u8bc1\u4e66\u534f\u8bae\u3002\u7cfb\u7edf\u5728\u4e0d\u9884\u8bbe\u5224\u5b9a\u7684\u60c5\u51b5\u4e0b\u63d0\u53d6\u58f0\u660e\u4f9d\u8d56\u56fe\uff0c\u72ec\u7acb\u7f16\u8bd1\u9a8c\u6536\u5951\u7ea6\u5e76\u751f\u6210\u53ef\u6838\u67e5\u4e49\u52a1\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34132", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u58f0\u660e\u2014\u4e49\u52a1\u2014\u8bc1\u4e66\u534f\u8bae\u5c06\u9a8c\u8bc1\u4f9d\u636e\u663e\u5f0f\u5316", "Terminal-Bench 2.1\u51c6\u786e\u7387\u8d85\u8fc7\u6700\u5148\u8fdb\u65b9\u6cd5", "\u589e\u5f3a\u667a\u80fd\u4f53\u5728FrontierMath\u3001CyberGym\u4e0a\u4f18\u4e8e\u539f\u7248"], "keywords": ["\u667a\u80fd\u4f53", "\u8f93\u51fa\u9a8c\u8bc1", "\u5f62\u5f0f\u5316\u65b9\u6cd5", "\u5956\u52b1\u6295\u673a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34132v1", "published_at": "2026-11-25", "score": 0.5, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Agent-as-a-Verifier: From Scores to Evidence for General Verification", "tldr": "\u901a\u8fc7\u89d2\u8272\u5206\u79bb\u7684\u667a\u80fd\u4f53\u751f\u6210\u53ef\u6838\u67e5\u8bc1\u4e66\uff0c\u8ba9\u8f93\u51fa\u9a8c\u8bc1\u4ece\u6807\u91cf\u8bc4\u5206\u8f6c\u5411\u8bc1\u636e\u5224\u65ad\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u667a\u80fd\u4f53\u9a8c\u8bc1\u7cfb\u7edf\uff0c\u4ee5\u89d2\u8272\u5206\u79bb\u7684\u5927\u6a21\u578b\u6267\u884c\u58f0\u660e\u2014\u4e49\u52a1\u2014\u8bc1\u4e66\u534f\u8bae\u3002\u7cfb\u7edf\u5728\u4e0d\u9884\u8bbe\u5224\u5b9a\u7684\u60c5\u51b5\u4e0b\u63d0\u53d6\u58f0\u660e\u4f9d\u8d56\u56fe\uff0c\u72ec\u7acb\u7f16\u8bd1\u9a8c\u6536\u5951\u7ea6\u5e76\u751f\u6210\u53ef\u6838\u67e5\u4e49\u52a1\u3002", "why_notable": "\u5c06\u9a8c\u8bc1\u7ed3\u679c\u4e0e\u53ef\u5ba1\u8ba1\u8bc1\u636e\u7ed1\u5b9a\uff0c\u5e76\u80fd\u8bc6\u522b\u6b3a\u9a97\u57fa\u51c6\u8bc4\u4f30\u5668\u7684\u5956\u52b1\u6295\u673a\u65b9\u6848\uff0c\u4e3a\u667a\u80fd\u4f53\u8fed\u4ee3\u4f18\u5316\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u53cd\u9988\u3002"}, {"abstract": "Knowledge-intensive video generation remains challenging because prompts often omit the facts, appearances, and temporal relationships required for accurate generation. While search-based workflows can retrieve missing evidence, manually designed strategies limit adaptive planning, and conventional training suffers from costly video-level feedback and coarse trajectory-level credit assignment. In this paper, we present Loupe, a video generation agent that retrieves and verifies textual and visual evidence to construct evidence-grounded temporal video prompts with reference images. We further introduce Rubric-Based Credit (RBC), which leverages prompt-specific factual, visual, and temporal requirements to evaluate intermediate search and planning decisions before video rendering. Building on RBC, RBC-SFT reweights assistant-token learning by step quality, while RBC-GRPO incorporates step-level credits alongside a final planning reward, without rendering videos during RL. To address the lack of dedicated search-oriented evaluation, we construct Search-VBench, which contains 150 held-out prompts across seven categories. Experiments show that Loupe improves all four evaluation dimensions across three video generators, raising the overall score of MiniMax-H3 from 32.80 to 70.67 and outperforming an untrained search workflow. Ablation experiments show that full RBC training outperforms standard SFT followed by trajectory-level GRPO by 5.27 points. Human evaluations and results on Sci-VBench and KIVI-Bench further demonstrate improved generation quality, scientific grounding, factual precision, and helpfulness. Our project page is available at https://zengkaiya.github.io/Loupe/.", "arxiv_id": "2611.31895", "arxiv_url": "https://arxiv.org/abs/2611.31895", "authors": ["Kai Zeng", "Ruichuan An", "Zhen Fang", "Xi Fang", "Han Lyu", "Moran Li", "Yingchen Yu", "Yifan Dai", "Bohan Zeng", "Quanqing Xu", "Zhengzhou Zhu", "Wentao Zhang"], "brief": "Loupe\u68c0\u7d22\u5e76\u6838\u9a8c\u6587\u672c\u4e0e\u89c6\u89c9\u8bc1\u636e\uff0c\u6784\u5efa\u5e26\u53c2\u8003\u56fe\u7684\u65f6\u5e8f\u89c6\u9891\u63d0\u793a\u3002\u5176RBC\u673a\u5236\u6309\u4e8b\u5b9e\u3001\u89c6\u89c9\u548c\u65f6\u5e8f\u8981\u6c42\u8bc4\u4ef7\u4e2d\u95f4\u51b3\u7b56\uff0c\u6307\u5bfc\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31895", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RBC-SFT\u6309\u6b65\u9aa4\u8d28\u91cf\u52a0\u6743\uff0cRBC-GRPO\u8bad\u7ec3\u65e0\u9700\u6e32\u67d3\u89c6\u9891", "Search-VBench\u542b150\u6761\u7559\u51fa\u63d0\u793a\uff0c\u8986\u76d67\u7c7b\u4efb\u52a1", "MiniMax-H3\u603b\u5206\u4ece32.80\u63d0\u5347\u81f370.67"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u8bc1\u636e\u68c0\u7d22"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2611.31895v1", "published_at": "2026-11-24", "score": 0.477, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31895.png", "title": "Loupe: Reinforcing Knowledge-Intensive Video Generation Agents", "tldr": "\u901a\u8fc7\u68c0\u7d22\u6838\u9a8c\u8bc1\u636e\u4e0e\u6b65\u9aa4\u7ea7\u5956\u52b1\uff0c\u89c6\u9891\u751f\u6210\u667a\u80fd\u4f53\u63d0\u5347\u4e8b\u5b9e\u51c6\u786e\u6027\u5e76\u964d\u4f4e\u8bad\u7ec3\u6210\u672c\u3002", "upvotes": 8, "what_it_is": "Loupe\u68c0\u7d22\u5e76\u6838\u9a8c\u6587\u672c\u4e0e\u89c6\u89c9\u8bc1\u636e\uff0c\u6784\u5efa\u5e26\u53c2\u8003\u56fe\u7684\u65f6\u5e8f\u89c6\u9891\u63d0\u793a\u3002\u5176RBC\u673a\u5236\u6309\u4e8b\u5b9e\u3001\u89c6\u89c9\u548c\u65f6\u5e8f\u8981\u6c42\u8bc4\u4ef7\u4e2d\u95f4\u51b3\u7b56\uff0c\u6307\u5bfc\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u3002", "why_notable": "\u5c06\u53cd\u9988\u524d\u79fb\u81f3\u68c0\u7d22\u4e0e\u89c4\u5212\u9636\u6bb5\uff0c\u51cf\u5c11\u6602\u8d35\u7684\u89c6\u9891\u7ea7\u53cd\u9988\u4f9d\u8d56\uff1b\u5b8c\u6574\u8bad\u7ec3\u6bd4\u6807\u51c6\u5fae\u8c03\u52a0\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u9ad85.27\u5206\u3002"}, {"abstract": "Flow-based generative policies offer expressive action modeling for embodied control, yet achieving efficient one-step generation under reward-driven policy optimization remains challenging. In particular, evolving action distributions during online reinforcement learning may introduce inconsistencies between instantaneous-velocity learning and interval-averaged action generation. To address this challenge, we propose iMFPO, a one-step generative policy optimization framework with decoupled velocity learning and drift-aware velocity alignment. A shared interval-conditioned actor supports instantaneous-velocity supervision and interval-averaged action generation. JVP-corrected velocity regression is jointly optimized with reward-driven policy objectives, with action-level guidance from a frozen PPO teacher during training. At inference, iMFPO directly generates actions through interval-averaged velocity prediction, achieving one-step control without iterative flow integration. Across Go2, G1, H1, and Spot, zero-latent evaluation yields mean returns of 35.69, 34.44, 416.23, and 29.86. On Go2, action-generation latency drops from 15.57 ms to 0.41 ms relative to 64-step RFPO. Code: https://github.com/AIGeeksGroup/iMFPO. Website: https://aigeeksgroup.github.io/iMFPO.", "arxiv_id": "2611.33922", "arxiv_url": "https://arxiv.org/abs/2611.33922", "authors": ["Lisiyu Pan", "Ting Huang", "Zeyu Zhang", "Hao Tang"], "brief": "\u63d0\u51fa\u5355\u6b65\u751f\u6210\u7b56\u7565\u4f18\u5316\u6846\u67b6\uff0c\u89e3\u8026\u901f\u5ea6\u5b66\u4e60\u4e0e\u52a8\u4f5c\u751f\u6210\uff0c\u4ee5\u6f02\u79fb\u611f\u77e5\u5bf9\u9f50\u7f13\u89e3\u5206\u5e03\u53d8\u5316\u9020\u6210\u7684\u4e0d\u4e00\u81f4\uff0c\u5e76\u7ed3\u5408\u51bb\u7ed3\u7684PPO\u6559\u5e08\u6307\u5bfc\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/AIGeeksGroup/iMFPO", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33922", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5171\u4eab\u533a\u95f4\u6761\u4ef6\u6f14\u5458\uff0c\u517c\u987e\u77ac\u65f6\u901f\u5ea6\u76d1\u7763\u4e0e\u533a\u95f4\u5e73\u5747\u52a8\u4f5c\u751f\u6210", "JVP\u4fee\u6b63\u901f\u5ea6\u56de\u5f52\u4e0e\u5956\u52b1\u9a71\u52a8\u7b56\u7565\u76ee\u6807\u8054\u5408\u4f18\u5316", "Go2\u52a8\u4f5c\u751f\u6210\u5ef6\u8fdf\u753164\u6b65RFPO\u768415.57\u964d\u81f30.41\u6beb\u79d2"], "keywords": ["\u5177\u8eab\u63a7\u5236", "\u751f\u6210\u5f0f\u7b56\u7565", "\u5f3a\u5316\u5b66\u4e60", "\u6d41\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2611.33922v1", "published_at": "2026-11-25", "score": 0.455, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33922.png", "title": "iMFPO: Improving Mean Flow Policy Optimization with Drift-Aware Velocity Alignment for Embodied Control", "tldr": "\u901a\u8fc7\u6f02\u79fb\u611f\u77e5\u901f\u5ea6\u5bf9\u9f50\uff0c\u5b9e\u73b0\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u5355\u6b65\u751f\u6210\u5f0f\u673a\u5668\u4eba\u63a7\u5236\u3002", "upvotes": 9, "what_it_is": "\u63d0\u51fa\u5355\u6b65\u751f\u6210\u7b56\u7565\u4f18\u5316\u6846\u67b6\uff0c\u89e3\u8026\u901f\u5ea6\u5b66\u4e60\u4e0e\u52a8\u4f5c\u751f\u6210\uff0c\u4ee5\u6f02\u79fb\u611f\u77e5\u5bf9\u9f50\u7f13\u89e3\u5206\u5e03\u53d8\u5316\u9020\u6210\u7684\u4e0d\u4e00\u81f4\uff0c\u5e76\u7ed3\u5408\u51bb\u7ed3\u7684PPO\u6559\u5e08\u6307\u5bfc\u8bad\u7ec3\u3002", "why_notable": "\u5c06\u6d41\u5f0f\u7b56\u7565\u7684\u8868\u8fbe\u80fd\u529b\u4e0e\u5355\u6b65\u63a8\u7406\u7ed3\u5408\uff0c\u5728\u56db\u79cd\u673a\u5668\u4eba\u4e0a\u9a8c\u8bc1\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u52a8\u4f5c\u751f\u6210\u5ef6\u8fdf\uff0c\u4e3a\u5b9e\u65f6\u5177\u8eab\u63a7\u5236\u63d0\u4f9b\u9ad8\u6548\u8def\u5f84\u3002"}, {"abstract": "Autoresearch agents, which autonomously design, run, and refine experiments, are accelerating scientific progress, particularly in AI research. However, existing agents rely on harnesses that combine multiple mechanisms, making it difficult to determine how individual components contribute to performance. We systematically study harness design for long-horizon, self-evolving autoresearch agents along two dimensions: context management, which determines what an agent retains from its past attempts, and skill management, which governs how it stores and reuses lessons from those attempts. Across MLE-Bench and KernelBench with gpt-oss-120b, gpt-6-luna, and gpt-6-sol, we isolate the effects of individual harness design choices by evaluating each against a recency-truncation baseline within a shared agent framework. For context management, we find that preserving individually accessible records of past attempts is more effective than maintaining a rolling summary, with context folding performing best across all six settings and improving upon the baseline by up to 19.2%. For skill management, selectively discarding persistently unused lessons is more effective on average than consolidating them or promoting them to standing rules. Building on these findings, we combine context folding and skill deletion in MLEvolver, which achieves a 72.7% medal rate on MLE-Bench Lite and a 94% $\\mathrm{fast}_1$ score on KernelBench Level 3, substantially outperforming AIDE and OpenEvolve under the same inference budget. Overall, our study distills design principles for preserving experimental history and curating reusable lessons in autoresearch harnesses, paving the way for agents that turn accumulated experience into sustained progress.", "arxiv_id": "2611.28244", "arxiv_url": "https://arxiv.org/abs/2611.28244", "authors": ["Kelvin Kiu-Wai Tam", "Newt Hue-Nam K. Nguyen", "Tianshi Zheng", "Yunxiang Mo", "Weihan Li", "Zhongwei Xie", "Chiu Yeung Tang", "Jui-Yu Ho", "Yangqiu Song", "Ginny Y. Wong", "Simon See"], "brief": "\u7814\u7a76\u5728\u7edf\u4e00\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\uff0c\u62c6\u5206\u8bc4\u4f30\u4e0a\u4e0b\u6587\u4e0e\u6280\u80fd\u7ba1\u7406\u7b56\u7565\u3002\u5c06\u4e0a\u4e0b\u6587\u6298\u53e0\u4e0e\u95f2\u7f6e\u6280\u80fd\u5220\u9664\u7ed3\u5408\u4e3a MLEvolver\uff0c\u4f7f\u5386\u53f2\u5b9e\u9a8c\u548c\u7ecf\u9a8c\u652f\u6301\u6301\u7eed\u4f18\u5316\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28244", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0a\u4e0b\u6587\u6298\u53e0\u5728\u516d\u7ec4\u8bbe\u7f6e\u4e2d\u5747\u6700\u4f18\uff0c\u8f83\u57fa\u7ebf\u6700\u9ad8\u63d0\u534719.2%", "\u5220\u9664\u957f\u671f\u672a\u7528\u6280\u80fd\uff0c\u5e73\u5747\u4f18\u4e8e\u6280\u80fd\u5408\u5e76\u6216\u5347\u7ea7\u4e3a\u5e38\u9a7b\u89c4\u5219", "MLEvolver\u83b772.7%\u5956\u724c\u7387\u4e0e94% fast_1\u5206\u6570"], "keywords": ["\u79d1\u7814\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u6280\u80fd\u7ba1\u7406", "\u81ea\u6211\u6f14\u5316"], "num_comments": 2, "on_hf": true, "organization": "HKUST", "pdf_url": "https://arxiv.org/pdf/2611.28244v1", "published_at": "2026-11-20", "score": 0.454, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28244.png", "title": "Demystifying the Autoresearch Harness: How Context and Skills Shape Self-Evolving Agents", "tldr": "\u4fdd\u7559\u53ef\u72ec\u7acb\u8bbf\u95ee\u7684\u5b9e\u9a8c\u8bb0\u5f55\u5e76\u5220\u9664\u95f2\u7f6e\u6280\u80fd\uff0c\u80fd\u63d0\u5347\u79d1\u7814\u667a\u80fd\u4f53\u7684\u957f\u671f\u8868\u73b0\u3002", "upvotes": 5, "what_it_is": "\u7814\u7a76\u5728\u7edf\u4e00\u667a\u80fd\u4f53\u6846\u67b6\u4e0b\uff0c\u62c6\u5206\u8bc4\u4f30\u4e0a\u4e0b\u6587\u4e0e\u6280\u80fd\u7ba1\u7406\u7b56\u7565\u3002\u5c06\u4e0a\u4e0b\u6587\u6298\u53e0\u4e0e\u95f2\u7f6e\u6280\u80fd\u5220\u9664\u7ed3\u5408\u4e3a MLEvolver\uff0c\u4f7f\u5386\u53f2\u5b9e\u9a8c\u548c\u7ecf\u9a8c\u652f\u6301\u6301\u7eed\u4f18\u5316\u3002", "why_notable": "\u901a\u8fc7\u53d7\u63a7\u6bd4\u8f83\u660e\u786e\u4e86\u5386\u53f2\u8bb0\u5f55\u4e0e\u6280\u80fd\u7ef4\u62a4\u7684\u4f5c\u7528\uff1b\u540c\u7b49\u63a8\u7406\u9884\u7b97\u4e0b\u8d85\u8d8a\u5df2\u6709\u7cfb\u7edf\uff0c\u4e3a\u957f\u671f\u79d1\u7814\u667a\u80fd\u4f53\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u8bbe\u8ba1\u4f9d\u636e\u3002"}, {"abstract": "Generating coherent and explorable 3D worlds from scattered images with little or no visual overlap is a fundamental and long-standing challenge in computer vision, which existing geometry-aware methods fail to address. Meanwhile, existing image- and video-based methods may generate unseen regions but produce inconsistent geometry across views. To bridge this gap, we present WorldBridge, a framework for coherent and controllable 3D world generation under scattered images with little or no visual overlap. WorldBridge encodes scattered references into a global scene context to guide geometry and appearance generation across views. Our temporal and spatial reference attention mechanism further enhances the fidelity of temporal references along the target trajectory and supports flexible spatial references outside it. A plug-and-play latent-reference consistency strategy improves reference fidelity through reprojection-guided test-time optimization. We also introduce the WorldBridge benchmark suite to evaluate 3D world generation from scattered, low-overlap references, which is rarely explored by current benchmarks. Both qualitative and quantitative results demonstrate that our method enables controllable and coherent 3D world generation, surpassing the existing state-of-the-art solutions. Our project page is available at https://davidyan2001.github.io/WorldBridge/.", "arxiv_id": "2611.34079", "arxiv_url": "https://arxiv.org/abs/2611.34079", "authors": ["Weilong Yan", "Jingyu Hu", "Hongli Xu", "Yifan Zhan", "Beibei Lin", "Anbang Wang", "Qinqian Lei", "Jingwei Huang", "Robby T. Tan"], "brief": "WorldBridge\u5c06\u5206\u6563\u53c2\u8003\u56fe\u50cf\u7f16\u7801\u4e3a\u5168\u5c40\u573a\u666f\u4e0a\u4e0b\u6587\uff0c\u8054\u5408\u5f15\u5bfc\u8de8\u89c6\u89d2\u51e0\u4f55\u4e0e\u5916\u89c2\u751f\u6210\uff1b\u518d\u7ed3\u5408\u65f6\u7a7a\u53c2\u8003\u6ce8\u610f\u529b\u548c\u6d4b\u8bd5\u65f6\u4f18\u5316\uff0c\u63d0\u5347\u53c2\u8003\u4fdd\u771f\u5ea6\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34079", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u65f6\u7a7a\u53c2\u8003\u6ce8\u610f\u529b\u517c\u987e\u8f68\u8ff9\u5185\u65f6\u95f4\u53c2\u8003\u4e0e\u8f68\u8ff9\u5916\u7a7a\u95f4\u53c2\u8003", "\u6f5c\u5728\u53c2\u8003\u4e00\u81f4\u6027\u7b56\u7565\u91c7\u7528\u91cd\u6295\u5f71\u5f15\u5bfc\u7684\u6d4b\u8bd5\u65f6\u4f18\u5316", "\u63d0\u51faWorldBridge\u57fa\u51c6\uff0c\u8bc4\u6d4b\u4f4e\u91cd\u53e0\u53c2\u8003\u4e0b\u7684\u4e09\u7ef4\u4e16\u754c\u751f\u6210"], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u591a\u89c6\u89d2\u4e00\u81f4\u6027", "\u6ce8\u610f\u529b\u673a\u5236", "\u6d4b\u8bd5\u65f6\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2611.34079v1", "published_at": "2026-11-25", "score": 0.449, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34079.png", "title": "WorldBridge: Bridging Scattered Views for Coherent 3D World Generation", "tldr": "\u901a\u8fc7\u5168\u5c40\u573a\u666f\u5efa\u6a21\u4e0e\u53c2\u8003\u4e00\u81f4\u6027\u4f18\u5316\uff0c\u4ece\u4f4e\u91cd\u53e0\u56fe\u50cf\u751f\u6210\u8fde\u8d2f\u53ef\u63a7\u7684\u4e09\u7ef4\u4e16\u754c\u3002", "upvotes": 4, "what_it_is": "WorldBridge\u5c06\u5206\u6563\u53c2\u8003\u56fe\u50cf\u7f16\u7801\u4e3a\u5168\u5c40\u573a\u666f\u4e0a\u4e0b\u6587\uff0c\u8054\u5408\u5f15\u5bfc\u8de8\u89c6\u89d2\u51e0\u4f55\u4e0e\u5916\u89c2\u751f\u6210\uff1b\u518d\u7ed3\u5408\u65f6\u7a7a\u53c2\u8003\u6ce8\u610f\u529b\u548c\u6d4b\u8bd5\u65f6\u4f18\u5316\uff0c\u63d0\u5347\u53c2\u8003\u4fdd\u771f\u5ea6\u3002", "why_notable": "\u5c06\u4e09\u7ef4\u751f\u6210\u63a8\u8fdb\u5230\u53c2\u8003\u56fe\u50cf\u51e0\u4e4e\u4e0d\u91cd\u53e0\u7684\u56f0\u96be\u573a\u666f\uff0c\u517c\u987e\u53ef\u63a2\u7d22\u6027\u3001\u51e0\u4f55\u8fde\u8d2f\u6027\u4e0e\u63a7\u5236\u80fd\u529b\uff0c\u5e76\u4e3a\u8fd9\u4e00\u4efb\u52a1\u5efa\u7acb\u4e13\u95e8\u8bc4\u6d4b\u57fa\u51c6\u3002"}, {"abstract": "Generating PPTX presentations is a structured task that requires semantic planning, visual composition, precise layout, and editability, motivating collaboration among specialized agents. However, programmatic methods offer editability but often produce rigid designs, while image-based methods provide visual richness but flatten content into difficult-to-edit pixels. A hybrid system can combine these strengths, but must coordinate interdependent decisions across content, layout, and appearance. To address this challenge, we propose SlidesWeaver, a hybrid multi-agent system that coordinates language and vision agents through shared deck- and slide-level states. Specifically, it uses staged multimodal commitment, diffusion-based composition planning, and two generation schedules for different priorities between composition freedom and accurate text preservation, while preserving native text and geometry. Across 1,728 generations spanning 24 system-model configurations, SlidesWeaver achieves consistently superior overall quality across all evaluated dimensions while maintaining structural control, editability, and practical generation efficiency.", "arxiv_id": "2611.28010", "arxiv_url": "https://arxiv.org/abs/2611.28010", "authors": ["Wenrui Zhou", "Jiashun Liu", "Sujie Hu", "Bang Liu", "Ling Pan"], "brief": "SlidesWeaver\u8ba9\u8bed\u8a00\u4e0e\u89c6\u89c9\u667a\u80fd\u4f53\u5171\u4eab\u6574\u5957\u6587\u7a3f\u53ca\u5355\u9875\u72b6\u6001\uff0c\u4ee5\u5206\u9636\u6bb5\u591a\u6a21\u6001\u51b3\u7b56\u548c\u6269\u6563\u5f0f\u6784\u56fe\u89c4\u5212\u534f\u8c03\u5185\u5bb9\u3001\u5e03\u5c40\u4e0e\u5916\u89c2\uff0c\u540c\u65f6\u4fdd\u7559\u539f\u751f\u6587\u672c\u548c\u51e0\u4f55\u5143\u7d20\u3002", "categories": ["cs.HC", "cs.CV", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28010", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5171\u4eab\u6587\u7a3f\u7ea7\u4e0e\u5355\u9875\u7ea7\u72b6\u6001\uff0c\u534f\u8c03\u8bed\u8a00\u548c\u89c6\u89c9\u667a\u80fd\u4f53", "\u6269\u6563\u5f0f\u6784\u56fe\u89c4\u5212\u914d\u5408\u4e24\u79cd\u751f\u6210\u8c03\u5ea6\uff0c\u6743\u8861\u6784\u56fe\u81ea\u7531\u4e0e\u6587\u672c\u4fdd\u771f", "\u8bc4\u4f30\u8986\u76d624\u79cd\u7cfb\u7edf\u6a21\u578b\u914d\u7f6e\u30011,728\u6b21\u751f\u6210"], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u6f14\u793a\u6587\u7a3f\u751f\u6210", "\u591a\u6a21\u6001\u751f\u6210", "\u53ef\u7f16\u8f91\u5185\u5bb9"], "num_comments": 2, "on_hf": true, "organization": "HKUST", "pdf_url": "https://arxiv.org/pdf/2611.28010v2", "published_at": "2026-09-08", "score": 0.445, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28010.png", "title": "Beyond Code and Pixels: Co-Generating Editable and Visually Rich Presentations", "tldr": "\u901a\u8fc7\u8bed\u8a00\u4e0e\u89c6\u89c9\u591a\u667a\u80fd\u4f53\u534f\u4f5c\uff0c\u517c\u987e\u6f14\u793a\u6587\u7a3f\u7684\u89c6\u89c9\u4e30\u5bcc\u6027\u4e0e\u539f\u751f\u53ef\u7f16\u8f91\u6027\u3002", "upvotes": 10, "what_it_is": "SlidesWeaver\u8ba9\u8bed\u8a00\u4e0e\u89c6\u89c9\u667a\u80fd\u4f53\u5171\u4eab\u6574\u5957\u6587\u7a3f\u53ca\u5355\u9875\u72b6\u6001\uff0c\u4ee5\u5206\u9636\u6bb5\u591a\u6a21\u6001\u51b3\u7b56\u548c\u6269\u6563\u5f0f\u6784\u56fe\u89c4\u5212\u534f\u8c03\u5185\u5bb9\u3001\u5e03\u5c40\u4e0e\u5916\u89c2\uff0c\u540c\u65f6\u4fdd\u7559\u539f\u751f\u6587\u672c\u548c\u51e0\u4f55\u5143\u7d20\u3002", "why_notable": "\u5c06\u7a0b\u5e8f\u5316\u751f\u6210\u7684\u53ef\u7f16\u8f91\u6027\u4e0e\u56fe\u50cf\u751f\u6210\u7684\u89c6\u89c9\u8868\u73b0\u7ed3\u5408\uff0c\u5728\u5404\u9879\u8bc4\u4f30\u7ef4\u5ea6\u53d6\u5f97\u66f4\u4f18\u8d28\u91cf\uff0c\u540c\u65f6\u4fdd\u6301\u7ed3\u6784\u63a7\u5236\u548c\u5b9e\u7528\u751f\u6210\u6548\u7387\u3002"}, {"abstract": "General-purpose multimodal foundation models enable robots to adapt during deployment from observations and execution feedback, without task-specific demonstrations or training. However, the robot retains what it learns only in the model\u0027s working context. Once the task ends, it loses this execution knowledge, such as how to carry a bowl between two grippers. On the next attempt at the task, the robot may take just as long and repeat the same mistakes. To avoid this repetition, robots must retain execution knowledge across attempts. Yet replaying past actions is insufficient, because their effects depend on the current conditions. Procedures that determine actions from the current scene address this, but when they meet conditions that earlier attempts did not cover, revising them requires the measured effects of earlier actions. We therefore propose SEEK, an agentic framework that retains both, enabling robots to improve across attempts while keeping the underlying model fixed. To adapt retained knowledge to the current scene, SEEK adopts a Self-Evolving Programmatic Policy (SEPP) that encodes manipulation as executable procedures and determines each action from current observations. As the robot executes these procedures, SEEK records the measured effects of its actions, including those from failed attempts, in a Persistent Action-Effect Bank (PAEB). Where a retained procedure applies, it acts without a model request; where it meets a condition it does not cover, this evidence guides its revision. On RoboDojo, knowledge retained over ten attempts raises SEEK\u0027s average task score from 27.0 to 54.4 and its success rate from 19.7% to 48.0% across all 42 tasks. On 34 of these tasks with GPT-6.2 Astra, SEEK reaches 80.1 after five attempts, against 49.6 for the same model acting directly, and uses 77.6% fewer model requests. https://zeyangguan.github.io/SEEK-Agentic-Robot-Manipulation/", "arxiv_id": "2611.33915", "arxiv_url": "https://arxiv.org/abs/2611.33915", "authors": ["Zeyang Guan", "Qihao Zhao", "Rui Gong", "Zhang Haitian", "Yalun Dai", "Yangyu Huang", "Lingao Xiao", "Haozhe Du", "Xuehui Yu", "Ye Lu", "Jianjun Gao", "Ruoyu Wang", "Haowen Bai", "Hao Li", "Scarlett Li", "Kim-Hui Yap"], "brief": "SEEK\u5c06\u64cd\u4f5c\u7ecf\u9a8c\u4fdd\u5b58\u4e3a\u53ef\u6267\u884c\u7b56\u7565SEPP\u548c\u52a8\u4f5c\u6548\u679c\u5e93PAEB\u3002\u7a0b\u5e8f\u6839\u636e\u5f53\u524d\u89c2\u6d4b\u9009\u52a8\u4f5c\uff0c\u9047\u5230\u672a\u8986\u76d6\u6761\u4ef6\u65f6\u5229\u7528\u5386\u53f2\u6267\u884c\u8bc1\u636e\u4fee\u8ba2\uff0c\u65e0\u9700\u66f4\u65b0\u5e95\u5c42\u6a21\u578b\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/ZeyangGuan/SEEK-Agentic-Robot-Manipulation", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.33915", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["SEPP\u6309\u5f53\u524d\u573a\u666f\u6267\u884c\uff0cPAEB\u4fdd\u7559\u5931\u8d25\u52a8\u4f5c\u6548\u679c", "RoboDojo\u517142\u9879\u4efb\u52a1\uff0c\u5341\u6b21\u5c1d\u8bd5\u6210\u529f\u738719.7%\u219248.0%", "34\u9879\u4efb\u52a1\u4e94\u6b21\u5c1d\u8bd5\u5f97\u520680.1\uff0c\u6a21\u578b\u8bf7\u6c42\u51cf\u5c1177.6%"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u591a\u6a21\u6001\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.33915v1", "published_at": "2026-11-25", "score": 0.439, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33915.png", "title": "SEEK: Self-Evolution through Execution Knowledge for Agentic Robot Manipulation", "tldr": "\u673a\u5668\u4eba\u901a\u8fc7\u6301\u4e45\u5316\u64cd\u4f5c\u7a0b\u5e8f\u4e0e\u52a8\u4f5c\u6548\u679c\uff0c\u5728\u6a21\u578b\u56fa\u5b9a\u65f6\u8de8\u6b21\u5c1d\u8bd5\u6301\u7eed\u6539\u8fdb\u3002", "upvotes": 11, "what_it_is": "SEEK\u5c06\u64cd\u4f5c\u7ecf\u9a8c\u4fdd\u5b58\u4e3a\u53ef\u6267\u884c\u7b56\u7565SEPP\u548c\u52a8\u4f5c\u6548\u679c\u5e93PAEB\u3002\u7a0b\u5e8f\u6839\u636e\u5f53\u524d\u89c2\u6d4b\u9009\u52a8\u4f5c\uff0c\u9047\u5230\u672a\u8986\u76d6\u6761\u4ef6\u65f6\u5229\u7528\u5386\u53f2\u6267\u884c\u8bc1\u636e\u4fee\u8ba2\uff0c\u65e0\u9700\u66f4\u65b0\u5e95\u5c42\u6a21\u578b\u3002", "why_notable": "\u628a\u77ed\u671f\u4e0a\u4e0b\u6587\u4e2d\u7684\u7ecf\u9a8c\u53d8\u6210\u53ef\u590d\u7528\u3001\u53ef\u4fee\u8ba2\u7684\u957f\u671f\u64cd\u4f5c\u77e5\u8bc6\uff0c\u540c\u65f6\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u5e76\u51cf\u5c11\u6a21\u578b\u8c03\u7528\uff0c\u4e3a\u673a\u5668\u4eba\u90e8\u7f72\u540e\u7684\u6301\u7eed\u6539\u8fdb\u63d0\u4f9b\u8def\u5f84\u3002"}, {"abstract": "Coding agents can generate runnable games from natural-language descriptions. However, a runnable game does not guarantee an excellent gameplay experience for players. In our view, a playful game should provide 1) reliable core functionality, 2) appealing visual design and assets, and 3) rich gameplay that supports exploration and progression. How agents can improve these aspects of playfulness remains underexplored. In our work, we propose Play2Evolve, a recursive game development framework with three stages: Initialization, Refinement, and Evolution. Using playfulness as feedback, agents playtest the game and diagnose issues in its functionality, visual presentation, and gameplay. Their feedback guides bug fixes and asset improvements. It also helps agents propose new gameplay and aesthetic goals for continued game evolution. To enrich game materials, we combine a video generation model with code to create appealing static and dynamic assets and integrate them into interactive gameplay. Finally, Play2Evolve achieves state-of-the-art performance among the evaluated methods, scoring 60.05 on GameCraft-Bench compared with 50.81 after Game Initialization and 52.46 for Play2Code. Human overall-quality ratings reach 3.67, compared with 2.38 and 2.43, respectively. Our code will be released at https://github.com/showlab/Play2Evolve.", "arxiv_id": "2611.33457", "arxiv_url": "https://arxiv.org/abs/2611.33457", "authors": ["Weijia Mao", "Kevin Qinghong Lin", "Zhen Fang", "Danze Chen", "Dongxing Mao", "Mike Zheng Shou"], "brief": "Play2Evolve\u5c06\u6e38\u620f\u5f00\u53d1\u5206\u4e3a\u521d\u59cb\u5316\u3001\u6539\u8fdb\u4e0e\u6f14\u5316\uff0c\u8ba9\u667a\u80fd\u4f53\u8bd5\u73a9\u8bca\u65ad\u5e76\u8fed\u4ee3\u76ee\u6807\uff1b\u7ed3\u5408\u89c6\u9891\u751f\u6210\u6a21\u578b\u4e0e\u4ee3\u7801\uff0c\u5236\u4f5c\u5e76\u6574\u5408\u9759\u6001\u548c\u52a8\u6001\u7d20\u6750\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/showlab/Play2Evolve", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2611.33457", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bd5\u73a9\u53cd\u9988\u9a71\u52a8\u4fee\u590d\u7f3a\u9677\u3001\u6539\u5584\u7d20\u6750\u4e0e\u63d0\u51fa\u65b0\u73a9\u6cd5\u76ee\u6807", "GameCraft-Bench\u5f97\u520660.05\uff0cPlay2Code\u4e3a52.46", "\u4eba\u5de5\u6574\u4f53\u8d28\u91cf\u8bc4\u52063.67\uff0c\u521d\u59cb\u5316\u7248\u672c\u4e3a2.38"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u6e38\u620f\u751f\u6210", "\u89c6\u9891\u751f\u6210", "\u53cd\u9988\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "Show Lab", "pdf_url": "https://arxiv.org/pdf/2611.33457v1", "published_at": "2026-11-24", "score": 0.432, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33457.png", "title": "Playfulness as Feedback for Agentic Game Development", "tldr": "\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u4ee5\u8bd5\u73a9\u53cd\u9988\u9012\u5f52\u6539\u8fdb\u6e38\u620f\uff0c\u517c\u987e\u529f\u80fd\u3001\u89c6\u89c9\u4e0e\u73a9\u6cd5\u6f14\u8fdb\u3002", "upvotes": 19, "what_it_is": "Play2Evolve\u5c06\u6e38\u620f\u5f00\u53d1\u5206\u4e3a\u521d\u59cb\u5316\u3001\u6539\u8fdb\u4e0e\u6f14\u5316\uff0c\u8ba9\u667a\u80fd\u4f53\u8bd5\u73a9\u8bca\u65ad\u5e76\u8fed\u4ee3\u76ee\u6807\uff1b\u7ed3\u5408\u89c6\u9891\u751f\u6210\u6a21\u578b\u4e0e\u4ee3\u7801\uff0c\u5236\u4f5c\u5e76\u6574\u5408\u9759\u6001\u548c\u52a8\u6001\u7d20\u6750\u3002", "why_notable": "\u628a\u6e38\u620f\u751f\u6210\u7684\u4f18\u5316\u76ee\u6807\u4ece\u201c\u80fd\u8fd0\u884c\u201d\u63a8\u8fdb\u5230\u5b9e\u9645\u6e38\u73a9\u8d28\u91cf\uff0c\u5e76\u5c06\u8bd5\u73a9\u8bca\u65ad\u8fde\u63a5\u5230\u6301\u7eed\u5f00\u53d1\uff1b\u57fa\u51c6\u4e0e\u4eba\u5de5\u8bc4\u5206\u5747\u663e\u793a\u660e\u663e\u63d0\u5347\u3002"}, {"abstract": "Robots should adapt to unfamiliar environments and acquire new skills through interaction, then execute those skills efficiently with practice. Vision-language-action policies provide efficient control, but often need additional human demonstrations to handle unfamiliar settings; reasoning agents can discover solutions using broad prior knowledge and robot-control APIs, but repeated deliberation and repair are costly. Inspired by human learning through reasoning and practice, we propose RoboEvo$^2$, a framework for recursive harness-policy co-evolution. In Policy-to-Harness (P2H) evolution, policy failures guide a coding agent to search complementary Code, Code+ICL, and Code+Policy routes, consolidating verified solutions into reusable skills, routing strategies, and experience memory. In Harness-to-Policy (H2P) evolution, verified trajectories provide supervised training, while Counterfactual Preference Distillation (CPD) teaches the policy to favor successful corrections over failures from the same starting state. The improved policy provides stronger motor skills for subsequent search, while its remaining failures redirect harness evolution, closing the reciprocal loop. Through recursive co-evolution without additional human demonstrations, RoboEvo$^2$ improves standalone success from 11.0% to 84.1% and hybrid success from 30.4% to 90.5% on LIBERO-PRO, with similar gains and reduced agentic costs on RoboTwin C2R. Further experiments demonstrate autonomous task acquisition, cross-embodiment harness transfer, and 95.0% hybrid success on the Unitree G1-D. Our models and code will be publicly released.", "arxiv_id": "2611.34675", "arxiv_url": "https://arxiv.org/abs/2611.34675", "authors": ["Chenzhi Liu", "Jiehong Lin", "Wei Huang", "Xuzhao Huang", "Haoyuan Li", "Yang Zhang", "Junchao Huang", "Chenyeyang Cai", "Bo Wang", "Kazuhiro Kosuge", "Zhongrui Wang", "Xiaojuan Qi"], "brief": "\u63d0\u51fa\u673a\u5668\u4eba\u667a\u80fd\u4f53\u6846\u67b6\u4e0e\u63a7\u5236\u7b56\u7565\u7684\u53cc\u5411\u8fdb\u5316\u673a\u5236\uff1a\u7b56\u7565\u5931\u8d25\u9a71\u52a8\u7f16\u7801\u667a\u80fd\u4f53\u641c\u7d22\u5e76\u6c89\u6dc0\u6280\u80fd\uff0c\u9a8c\u8bc1\u8f68\u8ff9\u4e0e\u53cd\u4e8b\u5b9e\u504f\u597d\u84b8\u998f\u518d\u7528\u4e8e\u8bad\u7ec3\u7b56\u7565\uff0c\u5f62\u6210\u9012\u5f52\u95ed\u73af\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": "https://github.com/kaiknower/RoboEvo2", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.34675", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["P2H\u641c\u7d22Code\u3001Code+ICL\u3001Code+Policy\u4e09\u6761\u8def\u7ebf", "H2P\u7528\u9a8c\u8bc1\u8f68\u8ff9\u76d1\u7763\u8bad\u7ec3\uff0cCPD\u5b66\u4e60\u540c\u8d77\u70b9\u6210\u529f\u7ea0\u9519\u504f\u597d", "LIBERO-PRO\u72ec\u7acb\u6210\u529f\u738711.0%\u219284.1%\uff0c\u6df7\u5408\u8fbe90.5%"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34675v1", "published_at": "2026-11-25", "score": 0.429, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34675.png", "title": "RoboEvo$^2$: Recursive Robot Self-Improvement via H
