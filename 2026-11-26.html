arness-Policy Co-Evolution", "tldr": "\u8ba9\u63a8\u7406\u667a\u80fd\u4f53\u4e0e\u63a7\u5236\u7b56\u7565\u9012\u5f52\u4e92\u6559\uff0c\u673a\u5668\u4eba\u65e0\u9700\u65b0\u589e\u4eba\u7c7b\u793a\u8303\u5373\u53ef\u63d0\u5347\u6280\u80fd", "upvotes": 9, "what_it_is": "\u63d0\u51fa\u673a\u5668\u4eba\u667a\u80fd\u4f53\u6846\u67b6\u4e0e\u63a7\u5236\u7b56\u7565\u7684\u53cc\u5411\u8fdb\u5316\u673a\u5236\uff1a\u7b56\u7565\u5931\u8d25\u9a71\u52a8\u7f16\u7801\u667a\u80fd\u4f53\u641c\u7d22\u5e76\u6c89\u6dc0\u6280\u80fd\uff0c\u9a8c\u8bc1\u8f68\u8ff9\u4e0e\u53cd\u4e8b\u5b9e\u504f\u597d\u84b8\u998f\u518d\u7528\u4e8e\u8bad\u7ec3\u7b56\u7565\uff0c\u5f62\u6210\u9012\u5f52\u95ed\u73af\u3002", "why_notable": "\u5c06\u6602\u8d35\u7684\u63a8\u7406\u7ea0\u9519\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u6280\u80fd\u4e0e\u9ad8\u6548\u63a7\u5236\uff0c\u51cf\u5c11\u5bf9\u65b0\u589e\u4eba\u7c7b\u793a\u8303\u7684\u4f9d\u8d56\uff0c\u5e76\u5c55\u793a\u8de8\u673a\u5668\u4eba\u8fc1\u79fb\u4e0e\u81ea\u4e3b\u4efb\u52a1\u4e60\u5f97\u80fd\u529b\u3002"}, {"abstract": "Computer-using agents are increasingly expected to complete realistic user goals rather than isolated GUI actions. However, existing benchmarks typically isolate web, mobile, or desktop environments, leaving it unclear whether a single generalist agent can execute long-horizon workflows that span multiple operating systems and persistent application states. We introduce OS-Omni, a live cross-platform benchmark and execution environment for evaluating computer-using agents across Windows, Ubuntu, macOS, iOS, Android, and Web environments. OS-Omni is released in versioned waves of 300 tasks each; this paper focuses on the first release, v1, which contains 48 tasks per platform and 12 cross-platform workflows that pair a desktop with an Android phone. OS-Omni provides reproducible initialization, platform-specific adapters, trajectory logging, and executable final-state evaluators, and includes controlled service-backed applications for workflows involving account, cart, budget, calendar, message, and other persistent state. Human studies show that OS-Omni tasks require 67.54 interaction steps, substantially exceeding OSWorld references of 15.0 steps. On v1, the strongest evaluated agent, Claude Opus 5.5, reaches 68.5% average success, trailing the 77.3% human reference by 8.8 points; the gap is uneven across platforms, with frontier models exceeding humans on Linux but trailing them by more than 25 points on iOS and macOS. These results indicate that current agents remain far from platform-robust, long-horizon computer use, especially when success requires sustained state tracking and durable final-state changes.", "arxiv_id": "2611.34232", "arxiv_url": "https://arxiv.org/abs/2611.34232", "authors": ["Hui Shen", "Yunta Hsieh", "Jianing Ma", "Zhuoran Yin", "Zhuhan Bao", "Ziyuan Liu", "Qi Han", "Xiuqi Xu", "Xianbang Wang", "Wenhao Chai", "Sihan Xu", "Chenyang Zhao", "Yanheng Shang", "Dongfu Jiang", "Rui Sun", "Xingzhi Li", "Chenqi Yin", "Zesen Zhao", "Boyuan Zheng", "Jisen Li", "Xiaoxia Wu", "Ruoyan Zhang", "Ruiyao Liu", "Jing Xiong", "He Xiao", "Nan Zheng", "Hangxiang Chen", "Shengyang Tao", "Deyang Luorong", "Yifeng Liu", "Jingxuan Zhang", "Chaofan Tao", "Yuren Wang", "Jiaqi Mo", "Rui Hu", "Xing Wei", "Xiaofeng Liu", "Xin Xu", "Han Wu", "Mengyao Wen", "Guobin Zhang", "Shatong Zhu", "Hei Ting Una Chan", "Sicheng Chen", "Kai Zhang", "Mengkang Hu", "Zhongwei Wan", "Xin Wang", "Chuanyang Zheng", "Ziheng Zhang", "Hengyuan Zhang", "Zunhai Su", "Kanzhi Cheng", "Dehan Kong", "Yian Wang", "Hanrong Zhang", "Jiawei Lu", "Yifan Zhang", "Junnan Li", "Changyi Yang", "Jintao Qu", "Wenyao Gao", "Jiaxuan Luo", "Jiaxin Deng", "Yuhao Chen", "Xuesong Ye", "Jingwen Gu", "Yichi Zhang", "Qun Lou", "Shen Yan", "Ben Athiwaratkun", "Qiushi Sun", "Mi Zhang", "Ping Luo", "Wenhu Chen", "Ngai Wong"], "brief": "OS-Omni\u63d0\u4f9b\u8de8\u516d\u7c7b\u5e73\u53f0\u7684\u5b9e\u65f6\u8bc4\u6d4b\u4e0e\u6267\u884c\u73af\u5883\uff0c\u4ee5\u53ef\u590d\u73b0\u521d\u59cb\u5316\u3001\u8f68\u8ff9\u8bb0\u5f55\u548c\u53ef\u6267\u884c\u7ec8\u6001\u8bc4\u4f30\uff0c\u68c0\u9a8c\u667a\u80fd\u4f53\u80fd\u5426\u5b8c\u6210\u6d89\u53ca\u6301\u4e45\u5e94\u7528\u72b6\u6001\u7684\u957f\u6d41\u7a0b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34232", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["v1\u5171300\u9879\u4efb\u52a1\uff1a\u6bcf\u5e73\u53f048\u9879\uff0c\u8de8\u5e73\u53f0\u6d41\u7a0b12\u9879", "\u4eba\u7c7b\u5b8c\u6210\u4efb\u52a1\u970067.54\u6b65\uff0cOSWorld\u53c2\u8003\u4e3a15\u6b65", "Claude Opus 5.5\u6210\u529f\u738768.5%\uff0c\u4eba\u7c7b\u4e3a77.3%"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u8ba1\u7b97\u673a\u64cd\u4f5c", "\u8de8\u5e73\u53f0", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34232v1", "published_at": "2026-11-25", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "OS-Omni: Benchmarking Generalist Computer-Using Agents on Long-Horizon Workflows Across Platforms", "tldr": "\u7528\u516d\u7c7b\u5e73\u53f0\u7684\u957f\u6d41\u7a0b\u4efb\u52a1\u8bc4\u6d4b\u901a\u7528\u7535\u8111\u667a\u80fd\u4f53\uff0c\u63ed\u793a\u8de8\u5e73\u53f0\u53ef\u9760\u6027\u77ed\u677f\u3002", "upvotes": 0, "what_it_is": "OS-Omni\u63d0\u4f9b\u8de8\u516d\u7c7b\u5e73\u53f0\u7684\u5b9e\u65f6\u8bc4\u6d4b\u4e0e\u6267\u884c\u73af\u5883\uff0c\u4ee5\u53ef\u590d\u73b0\u521d\u59cb\u5316\u3001\u8f68\u8ff9\u8bb0\u5f55\u548c\u53ef\u6267\u884c\u7ec8\u6001\u8bc4\u4f30\uff0c\u68c0\u9a8c\u667a\u80fd\u4f53\u80fd\u5426\u5b8c\u6210\u6d89\u53ca\u6301\u4e45\u5e94\u7528\u72b6\u6001\u7684\u957f\u6d41\u7a0b\u3002", "why_notable": "\u8bc4\u6d4b\u4ece\u5b64\u7acb\u754c\u9762\u64cd\u4f5c\u8f6c\u5411\u6301\u7eed\u72b6\u6001\u8ffd\u8e2a\u4e0e\u771f\u5b9e\u7ec8\u6001\u53d8\u66f4\uff1b\u6a21\u578b\u5728Linux\u8d85\u8fc7\u4eba\u7c7b\uff0c\u5374\u5728iOS\u548cmacOS\u843d\u540e\u903e25\u4e2a\u767e\u5206\u70b9\u3002"}, {"abstract": "Understanding large-scale 3D urban scenes requires representations that capture both multi-scale geometric structures and complex spatial relationships. However, existing 3D vision-language methods primarily emphasize global semantic alignment or object-level representations, leaving structured relational modeling underexplored within unified contrastive and generative frameworks. In this paper, we present 3D CoCa v3, a scene-graph-enhanced contrastive and generative framework for urban 3D scene understanding. Our framework features a Pyramid Vision Encoder for multi-scale geometric representation learning and a language-model-based decoder with question-guided caption retrieval and visual cross-attention. We further introduce MSG-based relational descriptions to enrich contrastive 3D-language alignment with structured spatial relationships. To support semantic and relational supervision, we construct City3D-9.6K, a multi-view urban vision-language dataset with aligned visual-geometric observations, scene captions, and scene graphs. Extensive experiments on City-3DQA demonstrate that 3D CoCa v3 achieves 88.35% and 64.79% overall top-1 accuracy on the sentence-wise and city-wise splits, surpassing 3D CoCa v2 by 20.88 and 3.57 percentage points, respectively. Furthermore, 3D CoCa v3 achieves the best performance on GeoEval3D, demonstrating its effectiveness in urban spatial reasoning and geometric understanding. Code is available at https://github.com/AIGeeksGroup/3DCoCav3.", "arxiv_id": "2611.33835", "arxiv_url": "https://arxiv.org/abs/2611.33835", "authors": ["Nannan Zhang", "Ting Huang", "Zeyu Zhang", "Haoyu Chen", "Yanjie Zhu", "Hao Tang"], "brief": "\u63d0\u51fa\u7edf\u4e00\u5bf9\u6bd4\u5b66\u4e60\u4e0e\u751f\u6210\u5efa\u6a21\u7684\u57ce\u5e02\u4e09\u7ef4\u7406\u89e3\u6846\u67b6\uff0c\u4ee5\u91d1\u5b57\u5854\u89c6\u89c9\u7f16\u7801\u5668\u63d0\u53d6\u591a\u5c3a\u5ea6\u51e0\u4f55\u7279\u5f81\uff0c\u5e76\u7ed3\u5408\u95ee\u9898\u5f15\u5bfc\u7684\u63cf\u8ff0\u68c0\u7d22\u3001\u89c6\u89c9\u4ea4\u53c9\u6ce8\u610f\u529b\u548c\u573a\u666f\u56fe\u5173\u7cfb\u76d1\u7763\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AIGeeksGroup/3DCoCav3", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33835", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u91d1\u5b57\u5854\u89c6\u89c9\u7f16\u7801\u5668\u7ed3\u5408MSG\u5173\u7cfb\u63cf\u8ff0\u5efa\u6a21\u51e0\u4f55\u4e0e\u7a7a\u95f4\u5173\u7cfb", "\u6784\u5efaCity3D-9.6K\uff0c\u5bf9\u9f50\u89c6\u89c9\u51e0\u4f55\u3001\u63cf\u8ff0\u4e0e\u573a\u666f\u56fe", "City-3DQA\u4e24\u79cd\u5212\u5206\u51c6\u786e\u7387\u8fbe88.35%\u4e0e64.79%"], "keywords": ["\u4e09\u7ef4\u573a\u666f\u7406\u89e3", "\u89c6\u89c9\u8bed\u8a00\u5b66\u4e60", "\u573a\u666f\u56fe", "\u7a7a\u95f4\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2611.33835v1", "published_at": "2026-11-25", "score": 0.423, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33835.png", "title": "3D CoCa v3: Contrastive Learners with Scene Graphs for Urban Scene Understanding", "tldr": "\u5c06\u573a\u666f\u56fe\u878d\u5165\u4e09\u7ef4\u89c6\u89c9\u8bed\u8a00\u5b66\u4e60\uff0c\u663e\u8457\u63d0\u5347\u57ce\u5e02\u95ee\u7b54\u4e0e\u7a7a\u95f4\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u7edf\u4e00\u5bf9\u6bd4\u5b66\u4e60\u4e0e\u751f\u6210\u5efa\u6a21\u7684\u57ce\u5e02\u4e09\u7ef4\u7406\u89e3\u6846\u67b6\uff0c\u4ee5\u91d1\u5b57\u5854\u89c6\u89c9\u7f16\u7801\u5668\u63d0\u53d6\u591a\u5c3a\u5ea6\u51e0\u4f55\u7279\u5f81\uff0c\u5e76\u7ed3\u5408\u95ee\u9898\u5f15\u5bfc\u7684\u63cf\u8ff0\u68c0\u7d22\u3001\u89c6\u89c9\u4ea4\u53c9\u6ce8\u610f\u529b\u548c\u573a\u666f\u56fe\u5173\u7cfb\u76d1\u7763\u3002", "why_notable": "\u628a\u7ed3\u6784\u5316\u7a7a\u95f4\u5173\u7cfb\u7eb3\u5165\u4e09\u7ef4\u8bed\u8a00\u5bf9\u9f50\uff0c\u8865\u8db3\u4ec5\u5173\u6ce8\u5168\u5c40\u6216\u5bf9\u8c61\u8bed\u4e49\u7684\u5c40\u9650\uff1b\u8f83\u524d\u4ee3\u6700\u9ad8\u63d0\u534720.88\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728GeoEval3D\u53d6\u5f97\u6700\u4f73\u8868\u73b0\u3002"}, {"abstract": "A language-model decoder carries state between decoding steps, and in hardware a wrong state update can leave the current token correct and corrupt the output several tokens later, so a design can pass output tests and still be wrong. AIChipBench asks what LLM coding agents need to build such hardware correctly. Agents implement quantized Qwen3.5, Gemma 3, Gemma 4, and Llama 3.2 decoders in synthesizable register-transfer-level (RTL) code against an executable integer reference that specifies the outputs and the stored state at every decoding step. They debug against public tests under fixed budgets; their frozen designs are graded on held-out token sequences, resets, memory stalls, and synthesis, and a second track asks them to speed up a correct design at nearly fixed area. Across 9,136 attempts by four coding agents, the difficulty lies in stored state. Feedback that points to the first state mismatch raises acceptance over output-only feedback in all 12 agent--task cells of a matched study, by 25.0 to 46.9 percentage points, and halves the agent-hours per accepted design. Regraded on new sequences and conditions, 45 of 69 accepted designs fail within the 32 steps their tests required. More than a third of attempts to speed up a correct design end without one. An overall score ranks Sol 5.6 and Fable 5.1 above Astra 6 and Opus 5.5, and both halves of the instances give this order in all 200 random splits. Hardware agents therefore need debugging feedback that exposes stored state, and their benchmarks need final tests well beyond the development cases.", "arxiv_id": "2611.33093", "arxiv_url": "https://arxiv.org/abs/2611.33093", "authors": ["Guangyuan Wang", "Chengran Li", "Minchen Luo", "Jichen Feng", "Mengdi Wang", "Yifan Zhang"], "brief": "\u63d0\u51fa\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\u8bbe\u8ba1\u91cf\u5316\u8bed\u8a00\u6a21\u578b\u89e3\u7801\u5668\u786c\u4ef6\u7684\u57fa\u51c6\uff0c\u4ee5\u53ef\u6267\u884c\u6574\u6570\u53c2\u8003\u9010\u6b65\u6838\u9a8c\u8f93\u51fa\u548c\u5b58\u50a8\u72b6\u6001\uff0c\u5e76\u6d4b\u8bd5\u672a\u89c1\u5e8f\u5217\u3001\u590d\u4f4d\u3001\u8bbf\u5b58\u505c\u987f\u53ca\u7efc\u5408\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/frontiereval/AIChipBench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.33093", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u56db\u4e2a\u7f16\u7801\u667a\u80fd\u4f53\u7d2f\u8ba1\u5b8c\u62109,136\u6b21\u5c1d\u8bd5", "\u9996\u6b21\u72b6\u6001\u5931\u914d\u53cd\u9988\u63d0\u5347\u901a\u8fc7\u738725.0\u81f346.9\u4e2a\u767e\u5206\u70b9", "69\u4e2a\u5df2\u901a\u8fc7\u8bbe\u8ba1\u4e2d\uff0c45\u4e2a\u5728\u65b0\u6761\u4ef6\u4e0b32\u6b65\u5185\u5931\u8d25"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u786c\u4ef6\u8bbe\u8ba1", "\u72b6\u6001\u9a8c\u8bc1", "\u4eba\u5de5\u667a\u80fd\u52a0\u901f\u5668"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33093v1", "published_at": "2026-11-24", "score": 0.405, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33093.png", "title": "AIChipBench: Benchmarking LLM Agents for Automated AI Accelerator Design", "tldr": "\u786c\u4ef6\u7f16\u7801\u667a\u80fd\u4f53\u6613\u9057\u6f0f\u72b6\u6001\u9519\u8bef\uff0c\u9010\u6b65\u72b6\u6001\u53cd\u9988\u663e\u8457\u63d0\u9ad8\u8bbe\u8ba1\u901a\u8fc7\u7387\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\u8bbe\u8ba1\u91cf\u5316\u8bed\u8a00\u6a21\u578b\u89e3\u7801\u5668\u786c\u4ef6\u7684\u57fa\u51c6\uff0c\u4ee5\u53ef\u6267\u884c\u6574\u6570\u53c2\u8003\u9010\u6b65\u6838\u9a8c\u8f93\u51fa\u548c\u5b58\u50a8\u72b6\u6001\uff0c\u5e76\u6d4b\u8bd5\u672a\u89c1\u5e8f\u5217\u3001\u590d\u4f4d\u3001\u8bbf\u5b58\u505c\u987f\u53ca\u7efc\u5408\u3002", "why_notable": "\u63ed\u793a\u53ea\u770b\u8f93\u51fa\u4f1a\u9ad8\u4f30\u786c\u4ef6\u667a\u80fd\u4f53\u7684\u53ef\u9760\u6027\uff1b\u72b6\u6001\u7ea7\u53cd\u9988\u5c06\u6bcf\u4e2a\u5408\u683c\u8bbe\u8ba1\u6240\u9700\u667a\u80fd\u4f53\u5de5\u65f6\u51cf\u534a\uff0c\u4e3a\u8c03\u8bd5\u4e0e\u8bc4\u6d4b\u63d0\u4f9b\u76f4\u63a5\u4f9d\u636e\u3002"}, {"abstract": "Recent advances in LLM-assisted theorem proving and program verification have attracted widespread attention. Beyond determining whether a proposition is true, LLM agents must produce evidence that can be independently checked by humans or formal verification tools. To evaluate the underlying, protocol-agnostic ability of LLM agents to construct verifiable proofs-rather than their proficiency with any particular proof language or verification tool, we introduce Merlin-Bench. Drawing on interactive proof systems from computational complexity theory, we cast an LLM agent as the prover: under a designated protocol, the agent interacts with a formal verifier to substantiate its claimed answer to a problem instance. We develop an automated framework for constructing test cases and use it to create 100 cases across 15 problem families, each formulated within this prover-verifier framework. Experiments with 10 frontier LLMs across multiple agent harnesses show that reliably producing verifiable proofs in accordance with specified protocols remains a substantial challenge. Our case studies further provide actionable insights into improving agents\u0027 ability to generate verifier-accepted proofs: tool use is essential for completing practical proof tasks; different forms of guidance, ranging from engineering instructions to problem-specific knowledge, substantially affect success rates on interactive-proof tasks; and proof-solving experience distilled from abstract tasks can transfer to concrete, real-world verification tasks.", "arxiv_id": "2611.33676", "arxiv_url": "https://arxiv.org/abs/2611.33676", "authors": ["Yankai Shu", "Xingyu Zhao", "Chuan Mao", "Congchi Yin"], "brief": "\u63d0\u51fa Merlin-Bench\uff0c\u5c06\u667a\u80fd\u4f53\u8bbe\u4e3a\u8bc1\u660e\u8005\uff0c\u6309\u6307\u5b9a\u534f\u8bae\u4e0e\u5f62\u5f0f\u5316\u9a8c\u8bc1\u5668\u4ea4\u4e92\u3002\u901a\u8fc7\u81ea\u52a8\u751f\u6210\u6d4b\u8bd5\uff0c\u8bc4\u4f30\u4e0d\u4f9d\u8d56\u7279\u5b9a\u8bc1\u660e\u8bed\u8a00\u6216\u5de5\u5177\u7684\u53ef\u9a8c\u8bc1\u8bc1\u660e\u6784\u9020\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.33676", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["Merlin-Bench \u5305\u542b15\u7c7b\u95ee\u9898\u3001100\u4e2a\u6d4b\u8bd5\u6848\u4f8b", "\u8bc4\u6d4b10\u4e2a\u524d\u6cbf\u6a21\u578b\u53ca\u591a\u79cd\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6", "\u5de5\u5177\u4f7f\u7528\u81f3\u5173\u91cd\u8981\uff0c\u62bd\u8c61\u4efb\u52a1\u8bc1\u660e\u7ecf\u9a8c\u53ef\u8fc1\u79fb\u81f3\u5b9e\u9645\u9a8c\u8bc1"], "keywords": ["\u4ea4\u4e92\u5f0f\u8bc1\u660e", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u667a\u80fd\u4f53\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.33676v1", "published_at": "2026-11-25", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Interactive Proofs as a Unified Framework for Evaluating and Leveraging Verifiable Proof Generation by LLM Agents", "tldr": "\u4ee5\u4ea4\u4e92\u5f0f\u8bc1\u660e\u8bc4\u6d4b\u667a\u80fd\u4f53\u7684\u53ef\u9a8c\u8bc1\u63a8\u7406\uff0c\u63ed\u793a\u5de5\u5177\u4e0e\u6307\u5bfc\u5bf9\u6210\u529f\u7387\u7684\u5173\u952e\u4f5c\u7528\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa Merlin-Bench\uff0c\u5c06\u667a\u80fd\u4f53\u8bbe\u4e3a\u8bc1\u660e\u8005\uff0c\u6309\u6307\u5b9a\u534f\u8bae\u4e0e\u5f62\u5f0f\u5316\u9a8c\u8bc1\u5668\u4ea4\u4e92\u3002\u901a\u8fc7\u81ea\u52a8\u751f\u6210\u6d4b\u8bd5\uff0c\u8bc4\u4f30\u4e0d\u4f9d\u8d56\u7279\u5b9a\u8bc1\u660e\u8bed\u8a00\u6216\u5de5\u5177\u7684\u53ef\u9a8c\u8bc1\u8bc1\u660e\u6784\u9020\u80fd\u529b\u3002", "why_notable": "\u628a\u8bc4\u6d4b\u91cd\u70b9\u4ece\u7b54\u6848\u6b63\u786e\u8f6c\u5411\u8bc1\u636e\u53ef\u6838\u9a8c\uff0c\u4e3a\u8de8\u534f\u8bae\u6bd4\u8f83\u8bc1\u660e\u80fd\u529b\u63d0\u4f9b\u6846\u67b6\uff0c\u5e76\u5c55\u793a\u62bd\u8c61\u8bc1\u660e\u7ecf\u9a8c\u5411\u5b9e\u9645\u9a8c\u8bc1\u4efb\u52a1\u8fc1\u79fb\u7684\u6f5c\u529b\u3002"}, {"abstract": "Large language models (LLMs) perform well on chemistry knowledge benchmarks, which mainly assess question answering and isolated tasks. Chemical research, however, requires using specialized tools and interpreting their outputs to obtain chemically valid results. To address this gap, we introduce Crucible Bench to evaluate this ability across all four stages of the design-make-test-analyze (DMTA) cycle. The benchmark contains 1,078 tasks in 12 task families curated from 18 published datasets, covering molecular design, synthesis planning, experimental execution, closed-loop optimization, simulation, and analytical characterization. Agents access 75 domain-specific tools through the Model Context Protocol in seven isolated environments. Sandboxed graders verify the resulting synthesis routes, experimental protocols, and other outputs. Laboratory tasks use robotic simulators or previously measured experimental data. We evaluate 14 LLMs as agents and find that the best achieves an overall score of 0.545, with synthesis planning and closed-loop optimization emerging as the hardest domains. Overall performance does not predict optimization performance well: the model ranked twelfth overall achieves the highest score in closed-loop optimization. Error analysis also shows that agents often submit chemically invalid results despite running their tools successfully. Stronger models benefit more from tool access, but reliable use of chemical software remains a challenge that Crucible Bench can track as models improve.", "arxiv_id": "2611.34254", "arxiv_url": "https://arxiv.org/abs/2611.34254", "authors": ["Yinjun Liu", "Xinye Li", "Ruisen Peng", "Lang Gao", "Zixiang Xu", "Zirui Song", "Xiuying Chen"], "brief": "Crucible Bench\u8986\u76d6\u5316\u5b66\u7814\u7a76\u8bbe\u8ba1\u3001\u5236\u5907\u3001\u6d4b\u8bd5\u3001\u5206\u6790\u5168\u6d41\u7a0b\uff0c\u8ba9\u667a\u80fd\u4f53\u5728\u9694\u79bb\u73af\u5883\u4e2d\u8c03\u7528\u4e13\u4e1a\u5de5\u5177\uff0c\u5e76\u4ee5\u6c99\u7bb1\u9a8c\u8bc1\u4ea7\u7269\u7684\u5316\u5b66\u6709\u6548\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34254", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6c47\u96c618\u4e2a\u6570\u636e\u96c6\uff0c\u542b1078\u9879\u4efb\u52a1\u300112\u7c7b\u4efb\u52a1\u65cf", "\u901a\u8fc7MCP\u63a5\u516575\u79cd\u5de5\u5177\uff0c\u8fd0\u884c\u4e8e7\u4e2a\u9694\u79bb\u73af\u5883", "\u8bc4\u6d4b14\u4e2a\u6a21\u578b\uff0c\u6700\u9ad8\u603b\u52060.545\uff0c\u5408\u6210\u4e0e\u4f18\u5316\u6700\u96be"], "keywords": ["\u5316\u5b66\u7814\u7a76", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u5de5\u5177\u8c03\u7528", "\u95ed\u73af\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34254v1", "published_at": "2026-11-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Crucible: Evaluating LLM Agents in Executable Chemistry Research Environments", "tldr": "\u7528\u53ef\u6267\u884c\u5316\u5b66\u7814\u7a76\u4efb\u52a1\u8bc4\u6d4b\u667a\u80fd\u4f53\uff0c\u63ed\u793a\u5de5\u5177\u8c03\u7528\u6210\u529f\u4e0d\u7b49\u4e8e\u7ed3\u679c\u6709\u6548\u3002", "upvotes": 0, "what_it_is": "Crucible Bench\u8986\u76d6\u5316\u5b66\u7814\u7a76\u8bbe\u8ba1\u3001\u5236\u5907\u3001\u6d4b\u8bd5\u3001\u5206\u6790\u5168\u6d41\u7a0b\uff0c\u8ba9\u667a\u80fd\u4f53\u5728\u9694\u79bb\u73af\u5883\u4e2d\u8c03\u7528\u4e13\u4e1a\u5de5\u5177\uff0c\u5e76\u4ee5\u6c99\u7bb1\u9a8c\u8bc1\u4ea7\u7269\u7684\u5316\u5b66\u6709\u6548\u6027\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u4ece\u77e5\u8bc6\u95ee\u7b54\u63a8\u8fdb\u5230\u53ef\u6267\u884c\u7814\u7a76\u6d41\u7a0b\uff1b\u603b\u5206\u7b2c\u5341\u4e8c\u7684\u6a21\u578b\u5374\u5728\u95ed\u73af\u4f18\u5316\u4e2d\u9886\u5148\uff0c\u63d0\u793a\u7efc\u5408\u6392\u540d\u96be\u4ee5\u4ee3\u8868\u4e13\u9879\u7814\u7a76\u80fd\u529b\u3002"}, {"abstract": "Agentic review systems are increasingly flagging suspected bugs in Linux kernel patches as textual reports. A maintainer who receives such reports needs further inspection to determine whether the report is true. The inspection requires understanding whether the bug can be triggered and, if necessary, manually constructing one. As a consequence, despite the excessive textual explanation, many reports go unanswered. In this paper, we argue that a runnable proof-of-concept (PoC) is the key information in such AI-generated kernel review reports. It is, however, challenging to automatically synthesize a valid and runnable PoC. We present ReproCue, a framework that generates PoCs for AI-generated Linux kernel reviews. ReproCue replays the historical kernel bugs and learns one reproduction finite-state-machine (FSM) per subsystem from successful runs. An FSM records the steps a reproduction goes through, together with the requirements observed at each step. Given a new review, ReproCue follows the FSM of that subsystem, adjusting the PoC and the environment as execution shows what is missing. In 100 recent AI-generated reviews, ReproCue writes PoCs for 49 of them, compared with 10 for the current agentic reproducer and 9 for the state-of-the-art directed fuzzing. Excitingly, with our generated PoCs, Linux kernel maintainers confirmed 69.4% of them, much higher than 9.3% from Sashiko where only textual explanations are included, making AI reviews more actionable in practice.", "arxiv_id": "2611.34142", "arxiv_url": "https://arxiv.org/abs/2611.34142", "authors": ["Xiao Wu", "Yunbo Ni", "Hao Sun", "Yuanyuan Yuan", "Shaohua Li"], "brief": "ReproCue\u91cd\u653e\u5386\u53f2\u5185\u6838\u7f3a\u9677\uff0c\u4ece\u6210\u529f\u8fd0\u884c\u4e2d\u5b66\u4e60\u5404\u5b50\u7cfb\u7edf\u7684\u590d\u73b0\u6709\u9650\u72b6\u6001\u673a\uff1b\u9488\u5bf9\u65b0\u62a5\u544a\uff0c\u6309\u72b6\u6001\u673a\u6267\u884c\uff0c\u5e76\u4f9d\u636e\u53cd\u9988\u8c03\u6574\u590d\u73b0\u7a0b\u5e8f\u4e0e\u73af\u5883\u3002", "categories": ["cs.OS", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34142", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6309\u5b50\u7cfb\u7edf\u5b66\u4e60FSM\uff0c\u8bb0\u5f55\u590d\u73b0\u6b65\u9aa4\u53ca\u6240\u9700\u6761\u4ef6", "100\u4efd\u62a5\u544a\u751f\u621049\u4efdPoC\uff0c\u4e24\u7c7b\u57fa\u7ebf\u4e3a10\u4efd\u548c9\u4efd", "\u7ef4\u62a4\u8005\u786e\u8ba4\u738769.4%\uff0c\u7eaf\u6587\u672cSashiko\u4e3a9.3%"], "keywords": ["\u7f3a\u9677\u590d\u73b0", "\u5185\u6838\u5b89\u5168", "\u7a0b\u5e8f\u5206\u6790", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34142v1", "published_at": "2026-11-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Reproducer Synthesis for AI-Reported Bugs in the Linux Kernel", "tldr": "ReproCue\u5c06AI\u5185\u6838\u7f3a\u9677\u62a5\u544a\u8f6c\u4e3a\u53ef\u8fd0\u884c\u590d\u73b0\u7a0b\u5e8f\uff0c\u63d0\u5347\u7ef4\u62a4\u8005\u786e\u8ba4\u7387\u3002", "upvotes": 0, "what_it_is": "ReproCue\u91cd\u653e\u5386\u53f2\u5185\u6838\u7f3a\u9677\uff0c\u4ece\u6210\u529f\u8fd0\u884c\u4e2d\u5b66\u4e60\u5404\u5b50\u7cfb\u7edf\u7684\u590d\u73b0\u6709\u9650\u72b6\u6001\u673a\uff1b\u9488\u5bf9\u65b0\u62a5\u544a\uff0c\u6309\u72b6\u6001\u673a\u6267\u884c\uff0c\u5e76\u4f9d\u636e\u53cd\u9988\u8c03\u6574\u590d\u73b0\u7a0b\u5e8f\u4e0e\u73af\u5883\u3002", "why_notable": "\u628a\u5197\u957f\u7684AI\u5ba1\u67e5\u610f\u89c1\u8f6c\u4e3a\u53ef\u6267\u884c\u8bc1\u636e\uff0c\u964d\u4f4e\u7ef4\u62a4\u8005\u9a8c\u8bc1\u6210\u672c\uff1b\u7ed3\u679c\u663e\u793a\uff0c\u590d\u73b0\u7a0b\u5e8f\u80fd\u663e\u8457\u63d0\u9ad8\u62a5\u544a\u7684\u53ef\u786e\u8ba4\u6027\u4e0e\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present AliceAI-Foundation-80B-A3B-Base, a mixture-of-experts language model with 80 billion total parameters and approximately 3 billion active parameters per token, trained from scratch at Yandex and released under the Apache 2.0 license. The model combines Kimi Delta Attention with full attention, uses Attention Residuals, and is trained with Muon. Training comprises general pretraining on 17.5 trillion tokens, two context-extension stages, and a dedicated stage for reasoning and agentic interaction. We describe the data collection and augmentation pipelines, evaluation protocols, architectural ablations, and scaling-law experiments. We identify the limitations of held-out training loss as a proxy for downstream performance and introduce an auxiliary loss on mixture-of-experts outputs to stabilize training at the predicted learning rate. Domain-specific data selection and augmentation improve factual knowledge, mathematics, and programming skills, while agent trajectories introduced during pretraining improve performance on agentic benchmarks after supervised fine-tuning. In zero-shot reasoning evaluation, the model achieves leading results among open base models of comparable size, with 88.7% pass@8 on IMO-AnswerBench and 82.9% pass@8 on LiveCodeBench v5-v6. To evaluate Russian-language factual knowledge, we introduce and release two benchmarks with their evaluation protocols: WikiWebFacts, which tests short factual questions drawn from encyclopedic sources and search queries, and HardMultiQA, which tests more demanding factual questions inspired by user interactions. Our model scores 86.5% on WikiWebFacts and 67.9% on HardMultiQA, compared with 83.2% and 65.4% for DeepSeek-V4-Flash-Base (284B total and 13B active parameters) and 72.8% and 54.5% for Nemotron-3-Super-120B-A12B-Base (120B total and 12B active parameters), outperforming both larger models on these benchmarks.", "arxiv_id": "2611.34529", "arxiv_url": "https://arxiv.org/abs/2611.34529", "authors": ["Nikolay Skachkov", "Ekaterina Redina", "Maksim Konoplev", "Evgenii Uskov", "Veronika Zykova", "Ivan Tsarikov", "Artemii Zakharov", "Mariia Godunova", "Dmitrii Lunin", "Maria Nikiforova", "Valerii Levanov", "Anton Kalsin", "Daniil Panteleev", "Alexey Gerasev", "Ilia Kopytin", "Yermek Kapushev", "Egor Liakhov", "Irina Lialikova", "Tatiana Taekina", "Anastasia Volotova", "Assol Kubaeva", "Kirill Alekseev", "Pavel Otlivanchik", "Mukhammadfirdavs Kosimov", "Vladislav Negodin", "Ivan Vinogradov", "Anton Andriushchenko", "Maksim Nikitin", "Daniil Sukhoi", "Alexander Mazitov", "Maksim Abraham", "Philip Zmushko", "Maksim Ignatov", "Ivan Sapozhkov", "Timofey Byzov", "Edgar Shmavonian"], "brief": "\u8fd9\u662f\u4ece\u96f6\u8bad\u7ec3\u3001\u4ee5Apache 2.0\u5f00\u653e\u7684\u6df7\u5408\u4e13\u5bb6\u57fa\u7840\u6a21\u578b\u3002\u5b83\u878d\u5408Kimi Delta Attention\u4e0e\u5168\u6ce8\u610f\u529b\uff0c\u5206\u9636\u6bb5\u6269\u5c55\u4e0a\u4e0b\u6587\uff0c\u5e76\u52a0\u5165\u63a8\u7406\u548c\u667a\u80fd\u4f53\u4ea4\u4e92\u8bad\u7ec3\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34529", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u603b\u53c2\u6570800\u4ebf\u3001\u6bcf\u8bcd\u5143\u6fc0\u6d3b\u7ea630\u4ebf\uff0c\u9884\u8bad\u7ec317.5\u4e07\u4ebf\u8bcd\u5143", "\u91c7\u7528Attention Residuals\u4e0eMuon\uff0c\u4e13\u5bb6\u8f93\u51fa\u8f85\u52a9\u635f\u5931\u7a33\u5b9a\u8bad\u7ec3", "IMO-AnswerBench\u4e0eLiveCodeBench\u7684pass@8\u8fbe88.7%\u300182.9%"], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3", "\u63a8\u7406\u80fd\u529b", "\u667a\u80fd\u4f53\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34529v1", "published_at": "2026-11-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AliceAI-Foundation-80B-A3B-Base", "tldr": "\u4ee5\u6bcf\u8bcd\u5143\u7ea6\u4e09\u5341\u4ebf\u6fc0\u6d3b\u53c2\u6570\uff0c\u5b9e\u73b0\u5f3a\u6570\u5b66\u3001\u7f16\u7a0b\u63a8\u7406\u4e0e\u4fc4\u8bed\u4e8b\u5b9e\u95ee\u7b54\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4ece\u96f6\u8bad\u7ec3\u3001\u4ee5Apache 2.0\u5f00\u653e\u7684\u6df7\u5408\u4e13\u5bb6\u57fa\u7840\u6a21\u578b\u3002\u5b83\u878d\u5408Kimi Delta Attention\u4e0e\u5168\u6ce8\u610f\u529b\uff0c\u5206\u9636\u6bb5\u6269\u5c55\u4e0a\u4e0b\u6587\uff0c\u5e76\u52a0\u5165\u63a8\u7406\u548c\u667a\u80fd\u4f53\u4ea4\u4e92\u8bad\u7ec3\u3002", "why_notable": "\u4ee5\u8f83\u5c11\u6fc0\u6d3b\u53c2\u6570\u53d6\u5f97\u5f3a\u63a8\u7406\u8868\u73b0\uff0c\u4fc4\u8bed\u4e8b\u5b9e\u95ee\u7b54\u8d85\u8fc7\u4e24\u4e2a\u66f4\u5927\u6a21\u578b\uff1b\u8fd8\u5f00\u653e\u4e24\u5957\u4fc4\u8bed\u57fa\u51c6\uff0c\u5e76\u5c55\u793a\u9884\u8bad\u7ec3\u667a\u80fd\u4f53\u8f68\u8ff9\u7684\u6536\u76ca\u3002"}, {"abstract": "To avoid the quadratic cost of dense attention over long contexts, models such as DeepSeek-V4 and Hy4 have turned natively sparse, and speculative decoding, which matters most where decoding is slowest, increasingly runs on them. Their drafters, however, still keep a context cache of their own, over the whole prompt or a sliding window. Beyond memory, such a cache costs prefill time, prefix-cache hits and decode concurrency. Drafters that read the target\u0027s cache avoid one of their own, but settle only which cache, not which positions, and still read everything or a recent window. Neither rule is made for the query at hand, and computing a selection per query in the drafter would cost more as the context grows. Yet a natively sparse target already picks positions for each query, over a cache it keeps anyway. Both of the drafter\u0027s choices are therefore already made, and paid for, by the target: its cache and its selection. We measure how far one selection carries: made a step early, it still covers close to nine tenths of what each later token selects on DS-V4.1-Flash. We present DFly2, a block-parallel drafter that shares the target\u0027s sparsity. Each draft layer reads the KV its paired target layer cached (KV sharing), at the positions that layer\u0027s indexer selected, a fixed number anywhere in the context (Index sharing). DFly2 thus runs no scoring pass and keeps no cache of its own. On DS-V4.1-Flash, GLM-5.3-Flash and Hy4~flash, whose sparse attention and architecture differ, it accepts more tokens per step than DFlash and DSpark trained on the same recipe, over general, long-context and agentic benchmarks. Its margin over the stronger baseline widens from 3.9%-10.5% on general workloads to 10.0%-31.5% on long-context and agentic ones. At high concurrency on DS-V4.1-Flash, at matched per-user decode speed, its throughput is 62% and 81% higher on two 64K sets.", "arxiv_id": "2611.34776", "arxiv_url": "https://arxiv.org/abs/2611.34776", "authors": ["Hong Liu", "Rui Cen", "Junhan Shi", "Lin Niu", "Runzhi Fan", "Zhaojing Zhou", "Haodi Lei", "Jiebin Zhang", "Saiyong Yang", "Junqiang Zheng", "Zhenghai Xue", "Guanghua Yu", "Jianchen Zhu"], "brief": "DFly2\u662f\u5757\u5e76\u884c\u8349\u7a3f\u6a21\u578b\uff0c\u5404\u5c42\u76f4\u63a5\u8bfb\u53d6\u914d\u5bf9\u76ee\u6807\u5c42\u7684KV\u7f13\u5b58\u53ca\u5176\u9009\u4e2d\u7684\u7a00\u758f\u4f4d\u7f6e\uff0c\u7701\u53bb\u72ec\u7acb\u7f13\u5b58\u548c\u7d22\u5f15\u8bc4\u5206\uff0c\u5e76\u5c06\u5df2\u6709\u9009\u62e9\u7528\u4e8e\u540e\u7eed\u8349\u7a3f\u751f\u6210\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.34776", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["KV sharing\u4e0eIndex sharing\u590d\u7528\u7f13\u5b58\u53ca\u4f4d\u7f6e\u9009\u62e9", "\u63d0\u524d\u4e00\u6b65\u7684\u7d22\u5f15\u8986\u76d6\u540e\u7eed\u9009\u62e9\u8fd190%", "\u4e24\u4e2a64K\u6d4b\u8bd5\u96c6\u540c\u901f\u9ad8\u5e76\u53d1\u541e\u5410\u63d0\u534762%\u548c81%"], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u7a00\u758f\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34776v1", "published_at": "2026-11-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DFly2: Turbocharging Long-Context Speculative Decoding by Sharing the Target\u0027s Sparsity", "tldr": "\u590d\u7528\u76ee\u6807\u6a21\u578b\u7f13\u5b58\u4e0e\u7a00\u758f\u7d22\u5f15\uff0c\u8ba9\u957f\u4e0a\u4e0b\u6587\u63a8\u6d4b\u89e3\u7801\u66f4\u5feb\u4e14\u65e0\u9700\u72ec\u7acb\u7f13\u5b58\u3002", "upvotes": 0, "what_it_is": "DFly2\u662f\u5757\u5e76\u884c\u8349\u7a3f\u6a21\u578b\uff0c\u5404\u5c42\u76f4\u63a5\u8bfb\u53d6\u914d\u5bf9\u76ee\u6807\u5c42\u7684KV\u7f13\u5b58\u53ca\u5176\u9009\u4e2d\u7684\u7a00\u758f\u4f4d\u7f6e\uff0c\u7701\u53bb\u72ec\u7acb\u7f13\u5b58\u548c\u7d22\u5f15\u8bc4\u5206\uff0c\u5e76\u5c06\u5df2\u6709\u9009\u62e9\u7528\u4e8e\u540e\u7eed\u8349\u7a3f\u751f\u6210\u3002", "why_notable": "\u628a\u76ee\u6807\u6a21\u578b\u5df2\u652f\u4ed8\u7684\u7a00\u758f\u9009\u62e9\u6210\u672c\u8f6c\u5316\u4e3a\u89e3\u7801\u6536\u76ca\uff1b\u5728\u4e09\u79cd\u67b6\u6784\u4e0a\u5747\u63d0\u9ad8\u63a5\u53d7\u8bcd\u5143\u6570\uff0c\u957f\u4e0a\u4e0b\u6587\u4e0e\u667a\u80fd\u4f53\u8d1f\u8f7d\u4f18\u52bf\u66f4\u5927\u3002"}, {"abstract": "Diffusion Transformers (DiTs) scale model capacity by increasing both parameter count and computation. Mixture-of-Experts (MoE) variants expand parameter capacity while keeping per-token computation roughly fixed, but still require substantial parameter storage. In this paper, we propose Dynamic Looped MoE DiT (DyLoMo-DiT), which reuses parameters rather than adding them: a weight-shared loop repeatedly applies the middle layers, while sparse experts allocate parameter capacity across tokens. This design deepens the network without adding parameters, freeing the parameter budget for other uses, such as more experts or more distinct layers. It also allocates compute dynamically, varying the number of passes across noise levels. Experiments show that DyLoMo-DiT makes more effective use of parameter and compute budgets, with further gains from assigning more passes to low-noise steps. On ImageNet $256\\times256$, DyLoMo-DiT reduces FID by 11-24% relative to DiT and 36-56% relative to DiT-MoE at matched parameter and compute budgets. For text-to-image generation, a scaled DyLoMo-DiT achieves a higher GenEval score than FLUX.1 (0.714 vs. 0.673), with less than one tenth of its active parameters (1.05B vs. 12B).", "arxiv_id": "2611.30844", "arxiv_url": "https://arxiv.org/abs/2611.30844", "authors": ["Lernie Li", "Yuanliu Liu", "Pengfei Xiong", "Wei Zhang"], "brief": "\u63d0\u51fa\u7ed3\u5408\u6743\u91cd\u5171\u4eab\u5faa\u73af\u4e0e\u7a00\u758f\u4e13\u5bb6\u7684\u6269\u6563\u6a21\u578b\uff0c\u91cd\u590d\u6267\u884c\u4e2d\u95f4\u5c42\u4ee5\u589e\u52a0\u6df1\u5ea6\u800c\u4e0d\u65b0\u589e\u53c2\u6570\uff0c\u5e76\u968f\u566a\u58f0\u6c34\u5e73\u52a8\u6001\u8c03\u6574\u5faa\u73af\u6b21\u6570\uff0c\u5c06\u66f4\u591a\u8ba1\u7b97\u5206\u914d\u7ed9\u4f4e\u566a\u58f0\u6b65\u9aa4\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/OneBoxCream/DyLoMo-DiT", "github_stars": 41, "hf_url": "https://huggingface.co/papers/2611.30844", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5171\u4eab\u6743\u91cd\u5faa\u73af\u52a0\u6df1\u7f51\u7edc\uff0c\u7a00\u758fMoE\u6309\u4ee4\u724c\u5206\u914d\u5bb9\u91cf", "ImageNet\u540c\u9884\u7b97FID\u8f83DiT\u964d\u4f4e11\u201324%", "GenEval\u8fbe0.714\uff0c\u6d3b\u8dc3\u53c2\u6570\u4ec51.05B"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u53c2\u6570\u5171\u4eab", "\u56fe\u50cf\u751f\u6210"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30844v1", "published_at": "2026-11-23", "score": 0.348, "selected_reasons": ["HF trending (56\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30844.png", "title": "DyLoMo-DiT: Dynamic Looped Mixture-of-Experts Diffusion Transformers", "tldr": "\u901a\u8fc7\u5171\u4eab\u6743\u91cd\u5faa\u73af\u4e0e\u7a00\u758f\u4e13\u5bb6\uff0c\u5728\u76f8\u540c\u9884\u7b97\u4e0b\u63d0\u5347\u6269\u6563\u6a21\u578b\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 56, "what_it_is": "\u63d0\u51fa\u7ed3\u5408\u6743\u91cd\u5171\u4eab\u5faa\u73af\u4e0e\u7a00\u758f\u4e13\u5bb6\u7684\u6269\u6563\u6a21\u578b\uff0c\u91cd\u590d\u6267\u884c\u4e2d\u95f4\u5c42\u4ee5\u589e\u52a0\u6df1\u5ea6\u800c\u4e0d\u65b0\u589e\u53c2\u6570\uff0c\u5e76\u968f\u566a\u58f0\u6c34\u5e73\u52a8\u6001\u8c03\u6574\u5faa\u73af\u6b21\u6570\uff0c\u5c06\u66f4\u591a\u8ba1\u7b97\u5206\u914d\u7ed9\u4f4e\u566a\u58f0\u6b65\u9aa4\u3002", "why_notable": "\u5c55\u793a\u4e86\u53c2\u6570\u590d\u7528\u4e0e\u52a8\u6001\u8ba1\u7b97\u5206\u914d\u7684\u534f\u540c\u4ef7\u503c\uff1a\u4e0d\u4ec5\u6539\u5584\u540c\u9884\u7b97\u751f\u6210\u8d28\u91cf\uff0c\u8fd8\u4ee5\u4e0d\u8db3FLUX.1\u5341\u5206\u4e4b\u4e00\u7684\u6d3b\u8dc3\u53c2\u6570\u53d6\u5f97\u66f4\u9ad8GenEval\u5206\u6570\u3002"}, {"abstract": "Code-driven video generation asks a coding agent to write and run rendering programs. This gives exact control over typography, data visualizations, synchronized audio, and multi-shot scenes, and it leaves an editable project behind. A program that exits cleanly can still render overlapping labels, a camera aimed away from its subject, broken object interactions, or narration that drifts out of sync, and none of these raise a runtime error. Feeding rendered frames and audio back into the coding session bloats its long-horizon context, while critiquing only the finished full-resolution render turns early design mistakes into costly rewrites. We introduce VibeVideoAgent, a training-free framework that lets coding agents inspect their drafts throughout production. Multimodal perception runs in short-lived contexts kept apart from the coder and returns compact, grounded Findings. Seven primitives operate on a unified multi-clock representation of assets and drafts: they explore media from coarse to fine, verify quoted requirements with evidence from every required modality, compare a draft with a reference or an earlier revision on separate clocks, and measure stream signals locally. A lightweight staged protocol has the agent test its riskiest decision on a minimal preview first. On all 239 VibeVideoBench tasks, with matched agent runtimes and a fixed perception model, VibeVideoAgent improves holistic audiovisual quality (L3) for Claude Opus 5.5 (4.03 -\u003e 4.43, while L2 rubric compliance rises from 98.87% to 99.35%), GPT-6 Astra (4.03 -\u003e 4.27), and Claude Sonnet 5.5 (3.97 -\u003e 4.10), with the largest gains in audio-visual synchronization (up to +0.56). Controlled ablations show that each component contributes, and trajectory audits show that the granularity of code edits governs the trade-off between rubric adherence and perceptual quality.", "arxiv_id": "2611.34237", "arxiv_url": "https://arxiv.org/abs/2611.34237", "authors": ["Xuanyu Zheng", "Luoyuan Zhang", "Yancheng Long", "Haoyang Xu", "Muxi Diao", "Yuzhe Chen", "Kaiyu Jiang", "Bin Wen", "Tingting Gao"], "brief": "\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u89c6\u9891\u751f\u6210\u6846\u67b6\uff0c\u5c06\u591a\u6a21\u6001\u611f\u77e5\u7f6e\u4e8e\u72ec\u7acb\u77ed\u671f\u4e0a\u4e0b\u6587\uff0c\u4ee5\u7cbe\u7b80\u53d1\u73b0\u53cd\u9988\u7ed9\u7f16\u7801\u667a\u80fd\u4f53\uff1b\u901a\u8fc7\u5206\u9636\u6bb5\u9884\u89c8\uff0c\u5728\u5236\u4f5c\u8fc7\u7a0b\u4e2d\u9a8c\u8bc1\u5e76\u4fee\u6b63\u8349\u7a3f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Kling-Keye/VibeVideoAgent", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.34237", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4e03\u79cd\u611f\u77e5\u539f\u8bed\u57fa\u4e8e\u7edf\u4e00\u591a\u65f6\u949f\u8868\u793a\u68c0\u67e5\u5a92\u4f53", "\u5206\u9636\u6bb5\u534f\u8bae\u5148\u7528\u6700\u5c0f\u9884\u89c8\u6d4b\u8bd5\u6700\u9ad8\u98ce\u9669\u51b3\u7b56", "239\u9879\u4efb\u52a1\u4e2d\uff0cOpus\u89c6\u542c\u8d28\u91cf\u75314.03\u5347\u81f34.43"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001\u611f\u77e5", "\u97f3\u753b\u540c\u6b65"], "num_comments": 5, "on_hf": true, "organization": "Kling-Keye", "pdf_url": "https://arxiv.org/pdf/2611.34237v1", "published_at": "2026-11-25", "score": 0.332, "selected_reasons": ["HF trending (54\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34237.png", "title": "VibeVideoAgent: Closing the Perceptual Loop for Code-Driven Video Generation", "tldr": "\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5728\u89c6\u9891\u5236\u4f5c\u4e2d\u6301\u7eed\u611f\u77e5\u8349\u7a3f\uff0c\u53ca\u65f6\u4fee\u6b63\u89c6\u542c\u7f3a\u9677\u800c\u975e\u53ea\u68c0\u67e5\u7a0b\u5e8f\u8fd0\u884c\u3002", "upvotes": 54, "what_it_is": "\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u89c6\u9891\u751f\u6210\u6846\u67b6\uff0c\u5c06\u591a\u6a21\u6001\u611f\u77e5\u7f6e\u4e8e\u72ec\u7acb\u77ed\u671f\u4e0a\u4e0b\u6587\uff0c\u4ee5\u7cbe\u7b80\u53d1\u73b0\u53cd\u9988\u7ed9\u7f16\u7801\u667a\u80fd\u4f53\uff1b\u901a\u8fc7\u5206\u9636\u6bb5\u9884\u89c8\uff0c\u5728\u5236\u4f5c\u8fc7\u7a0b\u4e2d\u9a8c\u8bc1\u5e76\u4fee\u6b63\u8349\u7a3f\u3002", "why_notable": "\u5c06\u8fd0\u884c\u6210\u529f\u4e0e\u89c6\u542c\u8d28\u91cf\u533a\u5206\u5f00\uff0c\u8865\u4e0a\u4ee3\u7801\u751f\u6210\u89c6\u9891\u7684\u611f\u77e5\u53cd\u9988\u73af\u8282\uff1b\u4e09\u79cd\u667a\u80fd\u4f53\u5747\u83b7\u63d0\u5347\uff0c\u97f3\u753b\u540c\u6b65\u589e\u76ca\u6700\u9ad8\u8fbe0.56\u3002"}, {"abstract": "Multi-page document vision-language models encode each page independently, creating a feature-level discontinuity at page boundaries: visual tokens are formed without access to content on adjacent pages, and the language model must reason over these page representations formed in isolation. We introduce DocSEAM (Document Selective Enrichment via Anchored Masking), a lightweight module inserted between a pretrained vision encoder and the language model that injects the inductive bias of local cross-page context into visual representations. For each page, DocSEAM forms a local triplet with its two neighbors, applies center-anchored masked self-attention with directional salience gates to fuse information from neighbor pages, and returns only the enriched center-page tokens, leaving the visual token count unchanged. After a supervised cross-page warm-up and multi-page fine-tuning with DocSEAM frozen, our 9B-parameter model achieves state-of-the-art results among the evaluated open-weight models of up to 10B parameters on five multi-page document VQA benchmarks. We further show that under controlled re-pagination, DocSEAM reduces sensitivity to boundary placement and improves cross-page span localization", "arxiv_id": "2611.34420", "arxiv_url": "https://arxiv.org/abs/2611.34420", "authors": ["Hoang-Nhat Nguyen", "Chen Change Loy"], "brief": "DocSEAM\u5728\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u4e0e\u8bed\u8a00\u6a21\u578b\u4e4b\u95f4\u63d2\u5165\u8f7b\u91cf\u6a21\u5757\uff0c\u5c06\u6bcf\u9875\u4e0e\u76f8\u90bb\u4e24\u9875\u7ec4\u6210\u5c40\u90e8\u4e09\u5143\u7ec4\uff0c\u4ee5\u4e2d\u5fc3\u951a\u5b9a\u63a9\u7801\u6ce8\u610f\u529b\u548c\u65b9\u5411\u663e\u8457\u6027\u95e8\u63a7\u878d\u5408\u8de8\u9875\u4fe1\u606f\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/mossbee/DocSEAM", "github_stars": 19, "hf_url": "https://huggingface.co/papers/2611.34420", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ec5\u8fd4\u56de\u589e\u5f3a\u540e\u7684\u4e2d\u5fc3\u9875\u8bcd\u5143\uff0c\u89c6\u89c9\u8bcd\u5143\u603b\u6570\u4e0d\u53d8", "\u5148\u505a\u76d1\u7763\u5f0f\u8de8\u9875\u9884\u70ed\uff0c\u518d\u51bb\u7ed3DocSEAM\u8fdb\u884c\u591a\u9875\u5fae\u8c03", "9B\u6a21\u578b\u5728\u4e94\u9879\u57fa\u51c6\u4e0a\u9886\u5148\u53d7\u6d4b\u768410B\u4ee5\u5185\u5f00\u653e\u6743\u91cd\u6a21\u578b"], "keywords": ["\u6587\u6863\u7406\u89e3", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8de8\u9875\u6ce8\u610f\u529b", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 4, "on_hf": true, "organization": "MMLab@NTU", "pdf_url": "https://arxiv.org/pdf/2611.34420v1", "published_at": "2026-11-25", "score": 0.323, "selected_reasons": ["HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34420.png", "title": "DocSEAM: Bidirectional Cross-Page Encoding for Multi-Page Document Understanding", "tldr": "\u901a\u8fc7\u53cc\u5411\u90bb\u9875\u4fe1\u606f\u878d\u5408\u589e\u5f3a\u89c6\u89c9\u8868\u5f81\uff0c\u5728\u4e0d\u589e\u52a0\u89c6\u89c9\u8bcd\u5143\u7684\u524d\u63d0\u4e0b\u63d0\u5347\u591a\u9875\u6587\u6863\u7406\u89e3\u3002", "upvotes": 27, "what_it_is": "DocSEAM\u5728\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u4e0e\u8bed\u8a00\u6a21\u578b\u4e4b\u95f4\u63d2\u5165\u8f7b\u91cf\u6a21\u5757\uff0c\u5c06\u6bcf\u9875\u4e0e\u76f8\u90bb\u4e24\u9875\u7ec4\u6210\u5c40\u90e8\u4e09\u5143\u7ec4\uff0c\u4ee5\u4e2d\u5fc3\u951a\u5b9a\u63a9\u7801\u6ce8\u610f\u529b\u548c\u65b9\u5411\u663e\u8457\u6027\u95e8\u63a7\u878d\u5408\u8de8\u9875\u4fe1\u606f\u3002", "why_notable": "\u5b83\u5c06\u8de8\u9875\u4e0a\u4e0b\u6587\u63d0\u524d\u6ce8\u5165\u89c6\u89c9\u8868\u5f81\uff0c\u800c\u975e\u4ec5\u4ea4\u7ed9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\uff1b\u53d7\u63a7\u91cd\u5206\u9875\u5b9e\u9a8c\u663e\u793a\uff0c\u5176\u964d\u4f4e\u4e86\u9875\u8fb9\u754c\u654f\u611f\u6027\u5e76\u6539\u5584\u8de8\u9875\u7247\u6bb5\u5b9a\u4f4d\u3002"}, {"abstract": "Robot world models are increasingly used to evaluate and plan policies, yet robot training data are dominated by successful demonstrations. Off the happy path, when a grasp is misaligned or mistimed and the object is pushed, tilted, or slips, their predictions break down. Across five pretrained action-conditioned models, object-motion error is at most 10.4% lower than that of a static baseline that copies the first frame, and two models are worse than this baseline. We present WorldReforge, which teaches world models what happens when manipulation goes wrong. We construct the Reforge dataset of 62k simulated trajectories by perturbing reference grasps in position, orientation, and closure timing, recording each resulting push, slip, or failed pickup with ground-truth object pose, contact, and surface points. WorldReforge turns this ground truth into two training signals without additional inference cost. Interaction Alignment focuses reconstruction on the small object and contact regions that a global loss underweights, and Surface Correspondence trains backbone features to follow the same physical surface points across frames. On Cosmos3 Nano, WorldReforge reduces object trajectory error by 28.2% overall and by 35.0% on unseen objects, and it lowers the error in predicting how two actions\u0027 outcomes diverge by 43.3%. Although trained only in simulation, it also improves reconstruction on DROID and on real failure videos. Controlled data studies show that failed contact and successful holding teach complementary physics: failed contact teaches how objects respond, and holding teaches how a grasped state persists. Our code, data, and models are available at aim-uofa.github.io/WorldReforge/.", "arxiv_id": "2611.33925", "arxiv_url": "https://arxiv.org/abs/2611.33925", "authors": ["Zhiyue Zhao", "Mingyu Liu", "Bolin Zhang", "Liyang Li", "Guangyu Huang", "Canyu Zhao", "Jinchuan Shi", "Haokai Zhang", "Hao Chen", "Chunhua Shen"], "brief": "WorldReforge\u901a\u8fc7\u6270\u52a8\u6293\u53d6\u751f\u6210\u5931\u8d25\u8f68\u8ff9\uff0c\u4ee5\u4ea4\u4e92\u5bf9\u9f50\u5f3a\u5316\u7269\u4f53\u53ca\u63a5\u89e6\u533a\u91cd\u5efa\uff0c\u5e76\u7528\u8868\u9762\u5bf9\u5e94\u7ea6\u675f\u8de8\u5e27\u7279\u5f81\uff0c\u65e0\u9700\u589e\u52a0\u63a8\u7406\u6210\u672c\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/aim-uofa/WorldReforge", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.33925", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Reforge\u542b6.2\u4e07\u6761\u6a21\u62df\u8f68\u8ff9\uff0c\u6270\u52a8\u6293\u53d6\u4f4d\u7f6e\u3001\u65b9\u5411\u4e0e\u95ed\u5408\u65f6\u673a", "\u4ea4\u4e92\u5bf9\u9f50\u805a\u7126\u63a5\u89e6\u533a\u57df\uff0c\u8868\u9762\u5bf9\u5e94\u8ffd\u8e2a\u8de8\u5e27\u540c\u4e00\u7269\u7406\u70b9", "Cosmos3 Nano\u8f68\u8ff9\u8bef\u5dee\u964d28.2%\uff0c\u672a\u89c1\u7269\u4f53\u964d35.0%"], "keywords": ["\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b", "\u5931\u8d25\u6570\u636e", "\u7269\u7406\u9884\u6d4b", "\u4eff\u771f\u8fc1\u79fb"], "num_comments": 3, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2611.33925v1", "published_at": "2026-11-25", "score": 0.3, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33925.png", "title": "Beyond the Happy Path: Generalizing Robot World Models from Simulated Failures", "tldr": "\u7528\u6a21\u62df\u6293\u53d6\u5931\u8d25\u4e0e\u63a5\u89e6\u76d1\u7763\uff0c\u63d0\u5347\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b\u5bf9\u7269\u4f53\u8fd0\u52a8\u7684\u9884\u6d4b\u80fd\u529b\u3002", "upvotes": 13, "what_it_is": "WorldReforge\u901a\u8fc7\u6270\u52a8\u6293\u53d6\u751f\u6210\u5931\u8d25\u8f68\u8ff9\uff0c\u4ee5\u4ea4\u4e92\u5bf9\u9f50\u5f3a\u5316\u7269\u4f53\u53ca\u63a5\u89e6\u533a\u91cd\u5efa\uff0c\u5e76\u7528\u8868\u9762\u5bf9\u5e94\u7ea6\u675f\u8de8\u5e27\u7279\u5f81\uff0c\u65e0\u9700\u589e\u52a0\u63a8\u7406\u6210\u672c\u3002", "why_notable": "\u628a\u64cd\u4f5c\u5931\u8d25\u8f6c\u5316\u4e3a\u7269\u7406\u5b66\u4e60\u4fe1\u53f7\uff0c\u8865\u8db3\u6210\u529f\u793a\u8303\u7684\u8986\u76d6\u76f2\u533a\uff1b\u4ec5\u7528\u6a21\u62df\u8bad\u7ec3\u4e5f\u6539\u5584\u771f\u5b9e\u5931\u8d25\u89c6\u9891\u91cd\u5efa\uff0c\u52a8\u4f5c\u7ed3\u679c\u5dee\u5f02\u9884\u6d4b\u8bef\u5dee\u4e0b\u964d43.3%\u3002"}, {"abstract": "Accurate 3D surface reconstruction from unposed images remains a fundamental challenge in computer vision. Recent feed-forward pointmap methods eliminate the need for camera poses but inherently produce discrete, sparse representations. In this paper, we present a generalizable pipeline that directly recovers continuous, high-fidelity 3D surfaces from unposed images by seamlessly integrating pointmap- and ray-based representations. Our approach first extracts explicit geometric priors using a pre-trained pointmap model. A query-view-centric selection module then identifies geometrically relevant reference views via a robust surfel voting mechanism. Next, a cross-attention regressor bridges target query rays with reference features to estimate a continuous coarse surface. Lastly, a raylet-based module aggregates local 3D features to carve out high-frequency details and analytical normals. Trained as a single foundation model on 9 diverse datasets, our method demonstrates exceptional zero-shot generalization on 6 unseen datasets, clearly surpassing state-of-the-art baselines in geometric accuracy and detail preservation.", "arxiv_id": "2611.34128", "arxiv_url": "https://arxiv.org/abs/2611.34128", "authors": ["Shenxing Wei", "Jinxi Li", "Zihui Zhang", "Ajay Kumar", "Wei Wang", "Bo Yang"], "brief": "\u63d0\u51fa\u53ef\u6cdb\u5316\u7684\u524d\u9988\u91cd\u5efa\u7ba1\u7ebf\uff0c\u5148\u7528\u9884\u8bad\u7ec3\u70b9\u56fe\u6a21\u578b\u63d0\u53d6\u51e0\u4f55\u5148\u9a8c\uff0c\u518d\u7b5b\u9009\u53c2\u8003\u89c6\u56fe\uff0c\u4ee5\u8de8\u6ce8\u610f\u529b\u9884\u6d4b\u8fde\u7eed\u7c97\u8868\u9762\uff0c\u5e76\u805a\u5408\u5c40\u90e8\u4e09\u7ef4\u7279\u5f81\u8865\u5145\u7ec6\u8282\u3002", "categories": ["cs.CV", "cs.AI", "cs.CG", "cs.GR", "cs.RO"], "github_repo": "https://github.com/vLAR-group/FoundSurface", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.34128", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ee5surfel\u6295\u7968\u7b5b\u9009\u51e0\u4f55\u76f8\u5173\u7684\u53c2\u8003\u89c6\u56fe", "\u8de8\u6ce8\u610f\u529b\u8fde\u63a5\u67e5\u8be2\u5c04\u7ebf\u4e0e\u53c2\u8003\u7279\u5f81\uff0craylet\u7ec6\u5316\u8868\u9762", "\u57289\u4e2a\u6570\u636e\u96c6\u8bad\u7ec3\uff0c\u57286\u4e2a\u672a\u89c1\u6570\u636e\u96c6\u96f6\u6837\u672c\u8bc4\u6d4b"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u591a\u89c6\u56fe\u51e0\u4f55", "\u8868\u9762\u5efa\u6a21", "\u96f6\u6837\u672c\u6cdb\u5316"], "num_comments": 3, "on_hf": true, "organization": "The Hong Kong Polytechnic University", "pdf_url": "https://arxiv.org/pdf/2611.34128v1", "published_at": "2026-11-25", "score": 0.296, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34128.png", "title": "FoundSurface: Feedforward Ray-Based 3D Scene Surface Reconstruction from Unposed Images", "tldr": "\u878d\u5408\u70b9\u56fe\u51e0\u4f55\u5148\u9a8c\u4e0e\u5c04\u7ebf\u5efa\u6a21\uff0c\u4ece\u65e0\u4f4d\u59ff\u56fe\u50cf\u76f4\u63a5\u91cd\u5efa\u8fde\u7eed\u4e14\u7cbe\u7ec6\u7684\u4e09\u7ef4\u8868\u9762\u3002", "upvotes": 17, "what_it_is": "\u63d0\u51fa\u53ef\u6cdb\u5316\u7684\u524d\u9988\u91cd\u5efa\u7ba1\u7ebf\uff0c\u5148\u7528\u9884\u8bad\u7ec3\u70b9\u56fe\u6a21\u578b\u63d0\u53d6\u51e0\u4f55\u5148\u9a8c\uff0c\u518d\u7b5b\u9009\u53c2\u8003\u89c6\u56fe\uff0c\u4ee5\u8de8\u6ce8\u610f\u529b\u9884\u6d4b\u8fde\u7eed\u7c97\u8868\u9762\uff0c\u5e76\u805a\u5408\u5c40\u90e8\u4e09\u7ef4\u7279\u5f81\u8865\u5145\u7ec6\u8282\u3002", "why_notable": "\u5c06\u65e0\u4f4d\u59ff\u91cd\u5efa\u4ece\u79bb\u6563\u7a00\u758f\u70b9\u63a8\u8fdb\u5230\u8fde\u7eed\u8868\u9762\uff0c\u517c\u987e\u9ad8\u9891\u7ec6\u8282\u4e0e\u89e3\u6790\u6cd5\u7ebf\uff1b\u8de8\u6570\u636e\u96c6\u96f6\u6837\u672c\u7ed3\u679c\u663e\u793a\u8f83\u5f3a\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "Recent unified multimodal models aim to combine visual understanding and generation within a single model, yet effectively integrating the two capabilities remains challenging. Leveraging pretrained vision-language models offers a way to build on already learned multimodal knowledge, but making this knowledge effectively accessible to visual generation remains nontrivial. We find that a central challenge lies in the heterogeneous visual representations used for understanding and generation. To address this challenge, we introduce Integral, which converts a pretrained vision-language model into a unified multimodal model by constructing a shared visual representation space across the two capabilities. Integral implements this design through two complementary components. Abstraction Fusion constructs shared visual tokens by aggregating hierarchical representations from the frozen vision encoder, while Block-wise MoT introduces a lightweight generative stream that interacts with the vision-language model only at block boundaries. Our approach effectively preserves the pretrained understanding capability while extending it to strong visual generation. Controlled comparisons further demonstrate that sharing visual representations between understanding and generation substantially improves generative learning compared with using a separate visual representation space, despite comparable reconstruction fidelity. These results suggest that representations learned by pretrained vision-language models already provide an effective foundation for visual generation.", "arxiv_id": "2611.31237", "arxiv_url": "https://arxiv.org/abs/2611.31237", "authors": ["JB Kim", "Byungwoo Jeon", "Kyungmin Lee", "Hyeonmo Kang", "Cheonbok Park", "Shinyoung Joo", "Jinwoo Shin", "Jeonghoon Kim"], "brief": "Integral\u5c06\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6539\u9020\u6210\u7406\u89e3\u4e0e\u751f\u6210\u7edf\u4e00\u7684\u6a21\u578b\uff1a\u805a\u5408\u51bb\u7ed3\u89c6\u89c9\u7f16\u7801\u5668\u7684\u5c42\u7ea7\u8868\u5f81\uff0c\u518d\u8ba9\u8f7b\u91cf\u751f\u6210\u6d41\u5728\u6a21\u5757\u8fb9\u754c\u4e0e\u539f\u6a21\u578b\u4ea4\u4e92\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/the-jb/integral", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.31237", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Abstraction Fusion\u805a\u5408\u5c42\u7ea7\u8868\u5f81\u4e3a\u5171\u4eab\u89c6\u89c9\u4ee4\u724c", "Block-wise MoT\u4ec5\u5728\u6a21\u5757\u8fb9\u754c\u8fde\u63a5\u751f\u6210\u6d41", "\u91cd\u5efa\u4fdd\u771f\u5ea6\u76f8\u8fd1\u65f6\uff0c\u5171\u4eab\u8868\u5f81\u663e\u8457\u6539\u5584\u751f\u6210\u5b66\u4e60"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u56fe\u50cf\u751f\u6210", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2611.31237v1", "published_at": "2026-11-23", "score": 0.295, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31237.png", "title": "Let Vision-Language Models Generate Images through Their Representations", "tldr": "\u901a\u8fc7\u5171\u4eab\u89c6\u89c9\u8868\u5f81\uff0c\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u53ef\u4fdd\u7559\u7406\u89e3\u80fd\u529b\u5e76\u6269\u5c55\u56fe\u50cf\u751f\u6210\u3002", "upvotes": 16, "what_it_is": "Integral\u5c06\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6539\u9020\u6210\u7406\u89e3\u4e0e\u751f\u6210\u7edf\u4e00\u7684\u6a21\u578b\uff1a\u805a\u5408\u51bb\u7ed3\u89c6\u89c9\u7f16\u7801\u5668\u7684\u5c42\u7ea7\u8868\u5f81\uff0c\u518d\u8ba9\u8f7b\u91cf\u751f\u6210\u6d41\u5728\u6a21\u5757\u8fb9\u754c\u4e0e\u539f\u6a21\u578b\u4ea4\u4e92\u3002", "why_notable": "\u5b83\u8868\u660e\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u8868\u5f81\u4e0d\u4ec5\u670d\u52a1\u4e8e\u7406\u89e3\uff0c\u4e5f\u80fd\u652f\u6491\u751f\u6210\uff0c\u4e3a\u590d\u7528\u5df2\u6709\u591a\u6a21\u6001\u77e5\u8bc6\u3001\u51cf\u5c11\u4e24\u7c7b\u80fd\u529b\u7684\u8868\u5f81\u5272\u88c2\u63d0\u4f9b\u4e86\u8def\u5f84\u3002"}, {"abstract": "AI wearables, such as smart glasses, extend the context available to agents beyond digital environments to users\u0027 physical surroundings. With these devices, computer tasks can originate from users\u0027 ongoing activities rather than solely from explicit instructions. Through first-person observations, agents can identify objects and activities relevant to user requests and ground digital tasks in the surrounding context. We call this interaction paradigm Ego Use. However, first-person observations are limited by the wearer\u0027s viewpoint and may provide incomplete or ambiguous evidence of ongoing activities. As new observations arrive, agents may need to revise their understanding of the physical context and user intent, and reassess whether prior digital actions remain valid. Whether current agents can reliably handle these changes remains insufficiently evaluated. We introduce EgoUseBench, a benchmark for evaluating Ego Use across three interaction settings with different levels of first-person context. Computer-Use relies on explicit instructions, Offline Ego Use provides prerecorded first-person context before execution, and Online Ego Use provides continuous observations as user intent evolves. Based on over 74 hours of real-world first-person recordings, we construct 693 tasks across the three interaction settings. To capture task evolution, we track first-person observations, user requirements, and website state separately. We further group tasks by how information changes during execution, resulting in three types: Graft (revised user requirements), Refresh (new first-person observations), and Clarify (agent-initiated information seeking). We evaluate advanced models and find that average success rates in Online Ego Use are 26.3% lower than in Computer-Use. This result reveals the difficulty of keeping task execution aligned with evolving first-person context and user intent.", "arxiv_id": "2611.34466", "arxiv_url": "https://arxiv.org/abs/2611.34466", "authors": ["Yurun Chen", "Biao Yi", "Qihang Yu", "Keting Yin", "Shengyu Zhang"], "brief": "\u63d0\u51fa\u8fde\u63a5\u7269\u7406\u60c5\u5883\u4e0e\u7535\u8111\u64cd\u4f5c\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u6bd4\u8f83\u7eaf\u6307\u4ee4\u3001\u79bb\u7ebf\u4e0e\u5728\u7ebf\u7b2c\u4e00\u89c6\u89d2\u8f93\u5165\u3002\u5206\u522b\u8ddf\u8e2a\u89c2\u5bdf\u3001\u7528\u6237\u9700\u6c42\u548c\u7f51\u7ad9\u72b6\u6001\uff0c\u6d4b\u8bd5\u667a\u80fd\u4f53\u80fd\u5426\u968f\u60c5\u5883\u53d8\u5316\u8c03\u6574\u6267\u884c\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/YurunChen/EgoUseBench", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2611.34466", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u57fa\u4e8e\u8d85\u8fc774\u5c0f\u65f6\u771f\u5b9e\u7b2c\u4e00\u89c6\u89d2\u5f55\u50cf\u6784\u5efa693\u9879\u4efb\u52a1", "\u6309\u53d8\u5316\u5212\u5206Graft\u3001Refresh\u3001Clarify\u4e09\u7c7b\u4efb\u52a1", "\u5728\u7ebf\u60c5\u5883\u5e73\u5747\u6210\u529f\u7387\u6bd4\u7eaf\u6307\u4ee4\u7535\u8111\u64cd\u4f5c\u4f4e26.3%"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u7535\u8111\u64cd\u4f5c", "\u7b2c\u4e00\u89c6\u89d2", "\u610f\u56fe\u5bf9\u9f50"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2611.34466v1", "published_at": "2026-11-25", "score": 0.289, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34466.png", "title": "EgoUseBench: Benchmarking Computer-Use Agents under Evolving First-Person Contexts", "tldr": "\u7528\u771f\u5b9e\u7b2c\u4e00\u89c6\u89d2\u4efb\u52a1\u8bc4\u6d4b\u7535\u8111\u64cd\u4f5c\u667a\u80fd\u4f53\uff0c\u63ed\u793a\u52a8\u6001\u60c5\u5883\u4e0b\u7684\u610f\u56fe\u5bf9\u9f50\u77ed\u677f\u3002", "upvotes": 19, "what_it_is": "\u63d0\u51fa\u8fde\u63a5\u7269\u7406\u60c5\u5883\u4e0e\u7535\u8111\u64cd\u4f5c\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u6bd4\u8f83\u7eaf\u6307\u4ee4\u3001\u79bb\u7ebf\u4e0e\u5728\u7ebf\u7b2c\u4e00\u89c6\u89d2\u8f93\u5165\u3002\u5206\u522b\u8ddf\u8e2a\u89c2\u5bdf\u3001\u7528\u6237\u9700\u6c42\u548c\u7f51\u7ad9\u72b6\u6001\uff0c\u6d4b\u8bd5\u667a\u80fd\u4f53\u80fd\u5426\u968f\u60c5\u5883\u53d8\u5316\u8c03\u6574\u6267\u884c\u3002", "why_notable": "\u5c06\u7535\u8111\u64cd\u4f5c\u8bc4\u6d4b\u4ece\u9759\u6001\u6307\u4ee4\u63a8\u8fdb\u5230\u6301\u7eed\u53d8\u5316\u7684\u771f\u5b9e\u60c5\u5883\uff0c\u66b4\u9732\u5f53\u524d\u6a21\u578b\u5728\u66f4\u65b0\u610f\u56fe\u7406\u89e3\u3001\u91cd\u5ba1\u65e2\u6709\u64cd\u4f5c\u4e0a\u7684\u80fd\u529b\u7f3a\u53e3\u3002"}, {"abstract": "Diffusion models have shown strong potential for image matting by transferring generative priors learned from large-scale pretraining. However, existing approaches largely rely on latent diffusion models, whose compressed representations and VAE-based reconstruction introduce a mismatch with the high-frequency precision required for matting. We present PixelMatte, a framework that adapts pretrained pixel-space diffusion transformers for high-fidelity image matting. We show that strong image-conditioned matting capabilities can be acquired even from a pure text-to-image model without paired image-to-image pretraining. Our approach reuses the backbone\u0027s native patch embedding to jointly process the input image, trimap, and noisy alpha matte as spatially aligned tokens, enabling direct pixel-space prediction without additional condition encoders or adapters. With pixel-accurate synthetic supervision and real-image fine-tuning, PixelMatte predicts alpha mattes in a single forward pass. Two lightweight calibration modules, LayerShift and High-Pass Refiner, further improve regional opacity accuracy and boundary fidelity. Experiments across four benchmarks and two distinct pixel diffusion backbones demonstrate substantial improvements over existing methods, reducing SAD and gradient errors by 24-44% relative to RenderMatte on P3M-500-NP and AM-2K, while achieving competitive performance on AIM-500 and RenderMatte-2K. These results demonstrate the effectiveness of pixel-space generative priors for precision-sensitive image matting. Project page: https://white-yc.github.io/pixelmatte/.", "arxiv_id": "2611.34929", "arxiv_url": "https://arxiv.org/abs/2611.34929", "authors": ["Baihan Yang", "Xin Lin", "Yufan Wei", "Baiang Li", "Yuheng Liu", "Juanxi Tian", "Xiaohui Xie", "Truong Nguyen"], "brief": "\u8be5\u6846\u67b6\u5c06\u9884\u8bad\u7ec3\u50cf\u7d20\u7a7a\u95f4\u6269\u6563Transformer\u7528\u4e8e\u62a0\u56fe\uff0c\u901a\u8fc7\u539f\u751f\u8865\u4e01\u5d4c\u5165\u5bf9\u9f50\u56fe\u50cf\u3001\u4e09\u5206\u56fe\u4e0e\u5e26\u566a\u900f\u660e\u5ea6\u56fe\uff0c\u5e76\u7ed3\u5408\u5408\u6210\u76d1\u7763\u548c\u771f\u5b9e\u56fe\u50cf\u5fae\u8c03\u5b9e\u73b0\u5355\u6b21\u9884\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/White-YC/pixelmatte", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2611.34929", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u539f\u751f\u8865\u4e01\u5d4c\u5165\u8054\u5408\u5904\u7406\u4e09\u7c7b\u8f93\u5165\uff0c\u65e0\u9700\u989d\u5916\u6761\u4ef6\u7f16\u7801\u5668", "LayerShift\u4e0eHigh-Pass Refiner\u6821\u51c6\u900f\u660e\u5ea6\u548c\u8fb9\u754c", "\u4e24\u9879\u57fa\u51c6\u4e0a\u8f83RenderMatte\u7684SAD\u4e0e\u68af\u5ea6\u8bef\u5dee\u964d\u4f4e24\u201344%"], "keywords": ["\u56fe\u50cf\u62a0\u56fe", "\u6269\u6563\u6a21\u578b", "\u89c6\u89c9\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.34929v1", "published_at": "2026-11-25", "score": 0.286, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34929.png", "title": "High-Fidelity Image Matting with Pixel-Space Diffusion Transformers", "tldr": "PixelMatte\u5c06\u50cf\u7d20\u7a7a\u95f4\u751f\u6210\u5148\u9a8c\u8fc1\u79fb\u81f3\u62a0\u56fe\uff0c\u5355\u6b21\u524d\u5411\u63d0\u5347\u900f\u660e\u5ea6\u4e0e\u8fb9\u754c\u7cbe\u5ea6\u3002", "upvotes": 19, "what_it_is": "\u8be5\u6846\u67b6\u5c06\u9884\u8bad\u7ec3\u50cf\u7d20\u7a7a\u95f4\u6269\u6563Transformer\u7528\u4e8e\u62a0\u56fe\uff0c\u901a\u8fc7\u539f\u751f\u8865\u4e01\u5d4c\u5165\u5bf9\u9f50\u56fe\u50cf\u3001\u4e09\u5206\u56fe\u4e0e\u5e26\u566a\u900f\u660e\u5ea6\u56fe\uff0c\u5e76\u7ed3\u5408\u5408\u6210\u76d1\u7763\u548c\u771f\u5b9e\u56fe\u50cf\u5fae\u8c03\u5b9e\u73b0\u5355\u6b21\u9884\u6d4b\u3002", "why_notable": "\u7ed5\u5f00\u6f5c\u7a7a\u95f4\u538b\u7f29\u4e0eVAE\u91cd\u5efa\u5bf9\u7ec6\u8282\u7cbe\u5ea6\u7684\u9650\u5236\uff0c\u8bc1\u660e\u7eaf\u6587\u751f\u56fe\u9884\u8bad\u7ec3\u4e5f\u80fd\u8fc1\u79fb\u81f3\u7cbe\u7ec6\u62a0\u56fe\uff0c\u5e76\u5728\u56db\u4e2a\u57fa\u51c6\u3001\u4e24\u79cd\u9aa8\u5e72\u4e0a\u9a8c\u8bc1\u3002"}, {"abstract": "World-action models jointly predict future observations and actions, yet visual corruption can disrupt the resulting policies. We introduce HOG-WAM, which adds future Histograms of Oriented Gradients (HOG) as structural supervision derived directly from demonstration images. An auxiliary HOG diffusion transformer (DiT) module reads RGB features through asymmetric attention, allowing its objective to shape the visual representation used for control. The module is used only during training and removed at inference, preserving FastWAM\u0027s RGB-to-action architecture. We evaluate four controlled observation corruptions through a visual-corruption extension of RoboTwin, termed RoboTwin-Plus; HOG-WAM achieves the highest success among the compared policies under all four. Mixed-noise success increases from 78.86% to 82.86% relative to FastWAM, with comparable performance on clean scenes. On LIBERO Plus, overall success increases from 74.49% to 75.26%, with the largest gain under sensor noise, from 74.14% to 78.89%. Across four Franka tasks, average success increases from 40% to 59% under clean observations and from 17% to 24% under noisy observations. A representation ablation favors combining RGB observations with auxiliary HOG prediction over replacing RGB with HOG. These findings support future-gradient prediction as complementary supervision for visually robust control, with larger absolute gains on physical tasks than in simulation. Code is available at https://github.com/iPPLab/HOG-WAM.", "arxiv_id": "2611.34811", "arxiv_url": "https://arxiv.org/abs/2611.34811", "authors": ["Boxuan Dong", "Yupeng Qian", "Ying Wu", "Heshuai Li", "Junhao Tan", "Zhenxiong Tan", "Weijia Wu", "Weihao Yu"], "brief": "\u5728\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u4e2d\u52a0\u5165\u672a\u6765HOG\u7ed3\u6784\u76d1\u7763\uff0c\u7528\u975e\u5bf9\u79f0\u6ce8\u610f\u529b\u8ba9\u8f85\u52a9\u6269\u6563Transformer\u8bfb\u53d6RGB\u7279\u5f81\u5e76\u4f18\u5316\u63a7\u5236\u8868\u5f81\u3002\u8be5\u6a21\u5757\u4ec5\u8bad\u7ec3\u65f6\u4f7f\u7528\uff0c\u63a8\u7406\u65f6\u79fb\u9664\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": "https://github.com/iPPLab/HOG-WAM", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.34811", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8f85\u52a9HOG DiT\u9884\u6d4b\u672a\u6765\u68af\u5ea6\uff0c\u4fdd\u7559RGB\u5230\u52a8\u4f5c\u67b6\u6784", "RoboTwin-Plus\u6df7\u5408\u566a\u58f0\u6210\u529f\u7387\u753178.86%\u5347\u81f382.86%", "\u56db\u9879Franka\u4efb\u52a1\u5e72\u51c0\u89c2\u6d4b\u5e73\u5747\u6210\u529f\u7387\u753140%\u5347\u81f359%"], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u9c81\u68d2\u6027", "\u7ed3\u6784\u76d1\u7763"], "num_comments": 2, "on_hf": true, "organization": "intelligence++", "pdf_url": "https://arxiv.org/pdf/2611.34811v1", "published_at": "2026-11-25", "score": 0.279, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.34811.png", "title": "HOG-WAM: Improving Visual Robustness through Future Gradient Prediction", "tldr": "\u901a\u8fc7\u9884\u6d4b\u672a\u6765\u56fe\u50cf\u68af\u5ea6\u5f3a\u5316\u89c6\u89c9\u8868\u5f81\uff0c\u63d0\u5347\u673a\u5668\u4eba\u7b56\u7565\u6297\u566a\u6027\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u5f00\u9500\u3002", "upvotes": 22, "what_it_is": "\u5728\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u4e2d\u52a0\u5165\u672a\u6765HOG\u7ed3\u6784\u76d1\u7763\uff0c\u7528\u975e\u5bf9\u79f0\u6ce8\u610f\u529b\u8ba9\u8f85\u52a9\u6269\u6563Transformer\u8bfb\u53d6RGB\u7279\u5f81\u5e76\u4f18\u5316\u63a7\u5236\u8868\u5f81\u3002\u8be5\u6a21\u5757\u4ec5\u8bad\u7ec3\u65f6\u4f7f\u7528\uff0c\u63a8\u7406\u65f6\u79fb\u9664\u3002", "why_notable": "\u5c06\u793a\u8303\u56fe\u50cf\u4e2d\u7684\u7ed3\u6784\u4fe1\u606f\u8f6c\u5316\u4e3a\u65e0\u9700\u989d\u5916\u6807\u6ce8\u7684\u76d1\u7763\uff0c\u517c\u987e\u6297\u566a\u4e0e\u63a8\u7406\u6548\u7387\uff1b\u5b9e\u673a\u4efb\u52a1\u7684\u7edd\u5bf9\u6536\u76ca\u5927\u4e8e\u4eff\u771f\uff0c\u663e\u793a\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Embodied spatial intelligence requires agents to gather information through exploration and interaction, then use it to reason and act. Existing benchmarks insufficiently distinguish correct outcomes from completion of these task requirements. We introduce ROAM-Bench to evaluate these abilities under robot motion and collision constraints. Independent checks use simulation state and episode records to assess outcomes and task requirements, with stronger checks of geometry, coverage, or placement. It comprises 250 manually validated tasks across 11 types in five groups and 27 indoor environments, covering object and room search, counting, geometric judgments, direction reasoning, and relocation. Human evaluators achieve 84% strict task success on 100 sampled tasks, with every correct outcome satisfying the required checks. Across seven frontier vision-language models, we identify two complementary failure modes: correct outcomes with unmet task requirements, and incorrect outcomes despite passing stronger checks. Oracle-input diagnostics show that more complete target observations and calibrated feedback improve final spatial judgments.", "arxiv_id": "2611.33143", "arxiv_url": "https://arxiv.org/abs/2611.33143", "authors": ["Xingjian Ran", "Xiaoye Mo", "Sihao Liu", "Li Luo", "Taiqiang Wu", "Ji Zhao", "Wenqi Shao", "Hongyang Li", "Jiaqi Wang", "Bo Dai"], "brief": "\u63d0\u51fa\u53d7\u673a\u5668\u4eba\u8fd0\u52a8\u4e0e\u78b0\u649e\u7ea6\u675f\u7684\u5177\u8eab\u7a7a\u95f4\u8bc4\u6d4b\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u63a2\u7d22\u3001\u4ea4\u4e92\u5e76\u63a8\u7406\u3002\u5229\u7528\u4eff\u771f\u72b6\u6001\u548c\u56de\u5408\u8bb0\u5f55\uff0c\u72ec\u7acb\u6838\u9a8c\u7ed3\u679c\u53ca\u4efb\u52a1\u8981\u6c42\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/rxjfighting/ROAM-Bench", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2611.33143", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["250\u4e2a\u4eba\u5de5\u9a8c\u8bc1\u4efb\u52a1\uff0c\u6db5\u76d611\u7c7b\u300127\u4e2a\u5ba4\u5185\u73af\u5883", "7\u4e2a\u524d\u6cbf\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u66b4\u9732\u7ed3\u679c\u4e0e\u8fc7\u7a0b\u4e0d\u4e00\u81f4", "100\u4e2a\u62bd\u6837\u4efb\u52a1\u4e2d\uff0c\u4eba\u7c7b\u4e25\u683c\u6210\u529f\u7387\u8fbe84%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u7a7a\u95f4\u63a8\u7406", "\u8bc4\u6d4b\u57fa\u51c6", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "JD.com Open Source", "pdf_url": "https://arxiv.org/pdf/2611.33143v1", "published_at": "2026-11-24", "score": 0.274, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.33143.png", "title": "ROAM-Bench: Evaluating Embodied Active Spatial Intelligence through Evidence Verification", "tldr": "\u901a\u8fc7\u72ec\u7acb\u8bc1\u636e\u6838\u9a8c\uff0c\u533a\u5206\u5177\u8eab\u667a\u80fd\u4f53\u7b54\u5bf9\u7ed3\u679c\u4e0e\u771f\u6b63\u5b8c\u6210\u7a7a\u95f4\u4efb\u52a1\u3002", "upvotes": 13, "what_it_is": "\u63d0\u51fa\u53d7\u673a\u5668\u4eba\u8fd0\u52a8\u4e0e\u78b0\u649e\u7ea6\u675f\u7684\u5177\u8eab\u7a7a\u95f4\u8bc4\u6d4b\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u63a2\u7d22\u3001\u4ea4\u4e92\u5e76\u63a8\u7406\u3002\u5229\u7528\u4eff\u771f\u72b6\u6001\u548c\u56de\u5408\u8bb0\u5f55\uff0c\u72ec\u7acb\u6838\u9a8c\u7ed3\u679c\u53ca\u4efb\u52a1\u8981\u6c42\u3002", "why_notable": "\u5c06\u7ed3\u679c\u6b63\u786e\u4e0e\u8bc1\u636e\u5145\u5206\u5206\u5f00\u8bc4\u4f30\uff0c\u63ed\u793a\u4ec5\u770b\u7b54\u6848\u4f1a\u9057\u6f0f\u7684\u80fd\u529b\u7f3a\u53e3\uff1b\u8bca\u65ad\u663e\u793a\u66f4\u5b8c\u6574\u89c2\u6d4b\u4e0e\u6821\u51c6\u53cd\u9988\u53ef\u6539\u5584\u7a7a\u95f4\u5224\u65ad\u3002"}, {"abstract": "Multi-scale architectures are widely adopted in all-in-one image restoration (AIO-IR) to capture larger-scale context at low-resolution stages and refine details at high-resolution (HR) stages. However, processing spatially large feature maps at HR stages incurs substantial computational costs and memory traffic, making efficient HR processing challenging. To address this challenge, we propose High-resolution Global-Local Restoration (HiGLR), an efficient multi-scale AIO-IR network grounded in an analysis of spatial redundancy in self-attention and convolutional feed-forward networks (ConvFFNs). Specifically, this analysis identifies three key redundancies: per-query readout at the finest-scale stage, key routing across neighboring queries at intermediate stages, and spatial mixing in the expanded feature spaces of ConvFFNs. Accordingly, HiGLR replaces costly self-attention at the finest-scale stage with a learned input-independent kernel. At intermediate stages, we propose a Block-Routed Hybrid Attention, which combines coarse-scale dense attention with fine-scale block-sparse attention over value residuals relative to coarse summaries, and shares routing indices across neighboring queries. We further introduce a Dual-Space FFN that performs spatial mixing in a compact space and pointwise nonlinear transformation in an expanded space, enabling efficient kernel fusion. Combining these designs, HiGLR achieves state-of-the-art performance while delivering up to a $4.24\\times$ inference speedup over existing methods.", "arxiv_id": "2611.33636", "arxiv_url": "htt
