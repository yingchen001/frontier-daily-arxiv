<script>
const PAPERS = [{"abstract": "World action models (WAMs) have emerged as a promising paradigm for robotic control by jointly predicting future visual dynamics and actions from an initial observation and instruction. However, existing WAMs struggle with long-horizon prediction, as generating dense video rollouts is highly inefficient. Some recent WAMs address this by predicting a single future frame without generating the full video, but this approach neglects how to progress toward the goal. We present ProWAM, a progressive world action model that jointly predicts actions and an ordered sequence of sparse visual sub-goals, providing explicit visual guidance to anchor action generation throughout task execution. This design scales naturally, as sub-goal prediction can be learned from large-scale action-free videos, allowing the video backbone to offload complex visual planning from the action policy. For efficient action generation, ProWAM executes a single video-backbone forward pass to cache sparse sub-goal features, eliminating iterative full-video generation and requiring only lightweight action denoising during replanning. Across extensive evaluations, ProWAM achieves superior out-of-distribution robustness. On simulation benchmarks, it sets new state-of-the-art results on LIBERO-Plus (85.8%) and randomized RoboTwin (75.7%), outperforming the strongest baseline with relative gains of up to +35.9%. On RoboCasa365, ProWAM achieves a 48.1% success rate and 18.2% on the challenging Composite-Unseen split, ranking 4th overall. Crucially, in zero-shot real-world experiments, ProWAM achieves 70.0% success, outperforming the strongest baseline by +15.0 (from 55.0% to 70.0%, a +27.3% relative gain) in novel scenes. These results demonstrate the value of progress-indexed visual foresight for closed-loop control. Our program is in https://sii-ferenas.github.io/ProWAM-page.", "arxiv_id": "2610.02508", "arxiv_url": "https://arxiv.org/abs/2610.02508", "authors": ["Fei Zhang", "Zhaochong An", "Duncan Frost", "Yikai Wang", "Pengfei Liu", "Ya Zhang", "Michal Drozdzal", "Amir Bar"], "brief": "", "categories": ["cs.AI", "cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.02508", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2610.02508v1", "published_at": "2026-10-01", "score": 0.37, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (76\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.02508.png", "title": "World Action Modeling with Progressive Visual Planning", "tldr": null, "upvotes": 76, "what_it_is": null, "why_notable": null}, {"abstract": "Recurrent neural networks (RNNs) compress the historical context into a memory state of fixed size, thus allowing for constant-time inference. The memory state size is a crucial factor in their performance, as exemplified by the strong performance and resurgence of linear attention, which extends the vector-valued hidden states of ordinary RNNs to matrix-valued hidden states. Crucially, linear attention does so in a parameter-efficient way, in particular by using an outer product of the key and value vectors to write to the matrix-valued hidden state. We generalize this construction and propose triadic linear attention, which writes the triadic outer product of a key, a second key, and a value, into a third-order (i.e., 3D) tensor state, and reads from it by contracting both key axes with two queries. An $E$-dimensional second key thus yields an $E$-fold increase in state size while adding only two projections. Triadic linear attention is compatible with data-dependent forgetting, the delta rule, and chunkwise-parallel training. Applied to Gated DeltaNet and scalar-gated linear attention, triadic linear attention substantially improves long-context language modeling and recall, outperforming alternatives that enlarge the state.", "arxiv_id": "2609.36529", "arxiv_url": "https://arxiv.org/abs/2609.36529", "authors": ["Oliver Sieberling", "Bharat Runwal", "David Jin", "Ryan Chin", "Rameswar Panda", "Yoon Kim"], "brief": "", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/OliverSieberling/TriadicLinearAttention", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2609.36529", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Massachusetts Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2609.36529v1", "published_at": "2026-09-29", "score": 0.334, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36529.png", "title": "Triadic Linear Attention: Three-Dimensional Recurrent States for Long-Context Sequence Modeling", "tldr": null, "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "Autoregressive (AR) video diffusion enables low-latency, streamable video generation, but prediction errors often accumulate over long rollouts. Training the generator on its own rollouts exposes it to these imperfect histories. However, existing video-level distribution matching distillation (DMD) scores the whole rollout jointly. Because a chunk is evaluated together with its past and future, its correction can favor matching artifacts in the surrounding context merely to preserve temporal consistency. To provide a clearer visual-quality signal, we introduce Rollout-Marginal Distillation (RMD). RMD retains the generated history for AR prediction but scores each chunk independently against a chunk teacher, ensuring its quality correction is not compromised by an imperfect temporal context. To compensate for the lack of temporal context in independent chunk scoring, RMD subsequently applies video-level DMD to restore temporal coherence. Extensive experiments demonstrate that RMD maintains high visual quality far beyond its training horizon and outperforms video-level DMD baselines. Code and video results are available at https://cjeen.github.io/RMD", "arxiv_id": "2609.37925", "arxiv_url": "https://arxiv.org/abs/2609.37925", "authors": ["Chenjian Gao", "Zhihao Hu", "Jianqi Ma", "Jun Zhang", "Weidong Zhang", "Tianfan Xue"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/cjeen/RMD", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.37925", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2609.37925v1", "published_at": "2026-09-29", "score": 0.315, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37925.png", "title": "Rollout-Marginal Distillation for Long-Horizon Autoregressive Video Generation", "tldr": null, "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "Supervised fine-tuning (SFT) learns most aggressively from tokens that the model deems least likely. This helps acquire new behaviors, but also amplifies noisy or conflicting supervision and can overwrite useful pretrained knowledge. Through a unified policy-loss view, we revisit existing token-reweighting methods and show that they assign nonnegative coefficients to demonstrated tokens. Consequently, they can suppress or amplify supervised updates, but cannot reverse harmful features once learned. Moreover, larger training weights do not amount to feature extrapolation, since they change the optimization trajectory rather than scale a fixed SFT direction. We argue that reversal and extrapolation require a stable reference frame defined by a fixed SFT delta. Motivated by this, we propose SCALE (Selective Control of Adaptation via Local Entropy), an entropy-guided adaptation-strength-control method that freezes the pretrained model and the SFT delta and learns bounded token- and module-specific gates by minimizing predictive entropy alone. These gates suppress, reverse, or extrapolate frozen SFT features according to their alignment with entropy reduction. Across Qwen2.5-Math-1.5B, Qwen2.5-Math-7B, and Qwen3-4B-Base, SCALE achieves mathematical-reasoning averages of 37.84, 43.60, and 36.57, exceeding the strongest corresponding baselines while remaining competitive on general-retention benchmarks. It also attains the best average code-generation performance across HumanEval, HumanEval+, and MBPP for all three models. These results suggest that effective SFT correction can benefit from controlling how already learned residuals are used, rather than only modifying how they are learned.", "arxiv_id": "2609.33463", "arxiv_url": "https://arxiv.org/abs/2609.33463", "authors": ["Cunchun Li", "Haonan He", "Yifan Gao", "Minglei Li", "Jingqi Ye", "Qingyu Yang", "Peng Ye"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33463", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2609.33463v1", "published_at": "2026-09-27", "score": 0.284, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33463.png", "title": "Rethinking Token Reweighting for SFT: Suppress, Reverse, and Extrapolate Learned Features", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) models have advanced robotic manipulation, but their zero-shot generalization in new tasks and environments remains limited, and their reliance on specialized training keeps them from benefiting directly from rapidly advancing general-purpose vision-language models (VLMs). In parallel, recent agentic robotic systems leverage VLMs for high-level reasoning or coding agents for robot control, but often depend on extensive external models and tools, introducing additional complexity and cost. This motivates us to ask: Can a general-purpose VLM itself operate a robot more like the human teleoperator by reasoning directly from observations, issuing actions, and continuously adapting to execution feedback, without relying on external models such as learned action experts, coding agents or grounding tools like SAM3? In this work, we introduce MotorMind, a robot manipulation harness that connects VLM-proposed mid-level actions to deterministic robot control and feedback, with asynchronous monitoring and background memory updates. Without task-specific policy training, coding agents, or additional grounding tools such as SAM3, MotorMind achieves 66.7% success on the base LIBERO-PRO suites and 53.8% under perturbations, compared with at most 13.3% and 19.2%, respectively, for the prior zero-shot methods we evaluate. The same interface reaches 95% average success on a real xArm6 robot across direct manipulation and human-perturbation settings. Replacing the backbone with a stronger VLM further improves performance, while the remaining failures - primarily due to visual grounding, embodied reasoning, and action knowledge - decrease as VLM capability improves. These results show that a general-purpose VLM, when equipped with an appropriate mid-level action representation and asynchronous execution harness, can perform effective zero-shot robotic manipulation.", "arxiv_id": "2609.38078", "arxiv_url": "https://arxiv.org/abs/2609.38078", "authors": ["Bingxuan Li", "Siqi Song", "Yizhuo Wu", "Jiarui Yao", "Tong Zhang", "Huan Zhang"], "brief": "", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.38078", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2609.38078v1", "published_at": "2026-09-29", "score": 0.274, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (89\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38078.png", "title": "MotorMind: Scaffolding General Vision Language Models for Zero-Shot Robot Manipulation", "tldr": null, "upvotes": 89, "what_it_is": null, "why_notable": null}, {"abstract": "Natively training joint video-audio generation models at higher resolutions empowers them to learn richer visual details and sharper motion dynamics. However, full attention incurs quadratic cost and, as resolution increases, spreads attention over increasingly redundant tokens, diluting learning signals for informative content and disrupting pretrained priors. Existing sparse attention methods either target training-free acceleration or overlook the unique structure of joint video-audio data, where cross-modal interactions are inherently concentrated around sound-producing regions. To address this, we propose Prism, a dynamic sparse attention framework for natively training joint video-audio generation models at 2K. In particular, Prism organizes the token sequence into spatiotemporal macro-zones, enabling the attention structure to adapt to local content. For each zone, it estimates local information structure via video feature variance along the channel and feature norms from the audio-to-video cross-attention, jointly capturing how visual content varies directionally and how strongly audio influences each visual region. Based on these signals, Prism dynamically assigns a tailored block shape to each zone, applying finer partitioning along axes of rapid visual content variation and strong audio-visual coupling. This encourages tokens within each block to remain semantically coherent, allowing block-level features to capture both visual content and joint video-audio interaction patterns. Prism further adopts a hybrid block selection strategy to dynamically determine per-query sparsity. Experiments show that Prism achieves 2.5$\\times$ training speedup compared to full attention, while surpassing it in generation quality.", "arxiv_id": "2610.05416", "arxiv_url": "https://arxiv.org/abs/2610.05416", "authors": ["Shuyuan Tu", "Qi Tian", "Yinming Huang", "Yue Wu", "Xintong Han", "Kaihang Pan", "Weijie Kong", "Jiangfeng Xiong", "Jian-Wei Zhang", "Zuxuan Wu", "Yu-Gang Jiang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Tencent-Hunyuan/Prism", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05416", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2610.05416v1", "published_at": "2026-10-04", "score": 0.248, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05416.png", "title": "Prism: Dynamic Sparse Attention for Native 2K Joint Video-Audio Generation Model Training", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "World simulation is inherently multisensory, demanding synchronized visual and acoustic dynamics in real time. Yet prevailing interactive world models remain strictly silent, focusing exclusively on visual rendering and control while overlooking the acoustic dimension. We present HelixWorld, a real-time interactive audio-visual world model where visual scenes and camera-grounded spatial stereo sound co-evolve natively under user interaction. We curate a high-fidelity spatial audio-visual dataset with true stereo acoustics and metric camera poses, upon which we pre-train a bidirectional teacher conditioned on 6-DoF camera trajectories and user actions. To enable low-latency causal interaction, we distill the teacher into a few-step streaming student via an online trajectory distillation loss, sustaining drift-free joint audio-visual rollouts at 24 FPS on a single GPU. Furthermore, we formalize spatial-acoustic consistency and introduce HelixBench to evaluate whether synthesized sound fields faithfully track dynamic viewpoint motion. Extensive experiments demonstrate that HelixWorld matches state-of-the-art silent world models in visual fidelity and responsiveness, while significantly surpassing existing baselines in camera-aligned spatial-acoustic immersion.", "arxiv_id": "2609.38123", "arxiv_url": "https://arxiv.org/abs/2609.38123", "authors": ["Lei Ke", "Jiahao Pan", "Zeyue Tian", "Jiaming Wang", "Haoyuan Huang", "Kam Man Wu", "Pengjun Fang", "Hongyu Liu", "Chenyang Qi", "Lin Wang", "Ruibin Yuan", "Weijia Chen", "Fangneng Zhan", "Qifeng Chen", "Wei Xue", "Yike Guo"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/NoizAI/HelixWorld", "github_stars": 620, "hf_url": "https://huggingface.co/papers/2609.38123", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "NoizAI", "pdf_url": "https://arxiv.org/pdf/2609.38123v1", "published_at": "2026-09-29", "score": 0.154, "selected_reasons": ["HF trending (32\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38123.png", "title": "HelixWorld: A Real-time Interactive Audio-Visual World Model", "tldr": null, "upvotes": 32, "what_it_is": null, "why_notable": null}, {"abstract": "An AI companion that talks with someone for months should come to understand them. It should know who they are, remember what they said, and recognize when something from the past matters now. Testing this needs real conversations, but real conversations are private, so existing benchmarks use invented people and invented questions. We release RealCompanion, ten real relationships between people and an AI companion, with 27,218 messages over up to 120 days. For each person, we release the full conversation, a profile, a persona, chat test items, and question test items. Every label points to the messages that support it, and every chat label comes with the reasoning that produced it. The real data shows three things. First, people rarely refer back. Only 3.4% of their messages depend on something said earlier, and when one does, the earlier message is usually far away (a median of 2,157 messages back). Averages hide this. Looking at the most recent messages finds the needed one 95.9% of the time overall, but only 2.2% of the time when it is far back. Second, AI systems cannot tell when the past matters. The detectors we tested barely beat chance on real messages, and when the same earlier messages are labeled \"memories\" instead of \"earlier messages\", models bring up the past 10 to 14 percentage points more often, even when nothing from the past is needed. Third, AI systems read more into a person than the person revealed. Three agent systems rebuild each persona equally well (F1 0.71). They see the person, and then imagine more. Understanding a person depends on knowing when their past matters and where what they shared ends, and only real conversations can test it.", "arxiv_id": "2610.01780", "arxiv_url": "https://arxiv.org/abs/2610.01780", "authors": ["Arman Behnam", "Sunglyoung Kim", "Liangwei Yang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.01780", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Quis Lab", "pdf_url": "https://arxiv.org/pdf/2610.01780v2", "published_at": "2026-10-01", "score": 0.151, "selected_reasons": ["HF trending (254\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.01780.png", "title": "RealCompanion: Benchmarking Human Understanding from Reasoning over Longitudinal Real-World Conversations", "tldr": null, "upvotes": 254, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic AI is emerging as a promising paradigm for automating complex cybersecurity decisions, yet its use in enforcing zero trust introduces significant challenges in safety, reliability, and policy compliance. This paper presents Agentic AI based zero trust architecture (Agentic-ZTA) that operationalizes the NIST SP 800-207 ZTA architecture control loop through coordinated multi- agent decision pipeline. In the proposed framework, policy knowledge is embedded into a retrieval-augmented generation pipeline and retrieved at inference time as top-k relevant policies. Access requests are intercepted by the Policy Enforcement Point (PEP), enriched with contextual metadata. The request context is routed to a policy engine agent which invokes domain-specialized core agents first followed by supporting agents, if further evaluation needed. AI agents reason over access context, policy constraints and determine trust. The retrieved policies are embedded into agent prompt during inference time and agentic trust scores are aggregated and evaluated by a trust-algorithm, producing the final access decision for enforcement under continuous verification. We implement Agentic-ZTA in a testbed and evaluate it on representative access-control use cases scenarios. Our Agentic-ZTA framework achieves 95.0% accuracy, 93.9% precision, and 96.3% recall, and demonstrate the feasibility of enforcing zero trust using AI agents.", "arxiv_id": "2610.05782", "arxiv_url": "https://arxiv.org/abs/2610.05782", "authors": ["Shovan Roy", "Lopamudra Praharaj", "Maanak Gupta", "Bhavani Thuraisingham"], "brief": "", "categories": ["cs.AI", "cs.CR", "cs.ET", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05782", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05782v1", "published_at": "2026-10-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic-ZTA: A Multi-Agent Architecture for Autonomous Zero Trust Enforcement", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents rely on long-term memory to retain and reuse information when performing tasks over long horizons. Existing methods provide limited support for handling memories that become outdated as new observations or domain evidence arrive. Such outdated memories may remain semantically relevant, continue to affect dependent records, and retain value as historical evidence. This calls for two capabilities: dependency tracking to identify downstream effects and historical preservation to retain useful past records. We propose Provenance-Aware Cascading Memory Invalidation (PACMI), a framework that represents memories and new evidence in a provenance graph with typed dependency edges. PACMI assigns records to a four-state validity lattice, propagates validity changes to dependent memories, and uses the resulting states for retrieval and stale-premise detection. We also introduce a diagnostic benchmark with 100 cases and 300 queries across five domains. The evaluation separates node, context-, and answer-level performance. PACMI achieves the highest final-answer accuracy on this benchmark, and its paired difference from the strongest baseline is significant under an exact McNemar test. The premise checker achieves perfect precision, recall, and F 1 on the controlled query distribution. Cascading propagation primarily improves memorystate correctness: removing it increases final-answer errors from 3 to 11, but the paired difference does not reach the 0.05 significance threshold. Code and data will be made publicly available.", "arxiv_id": "2610.05732", "arxiv_url": "https://arxiv.org/abs/2610.05732", "authors": ["Yiqi Wang", "Jiaqi Liu", "Jiaqi Zhang", "Zhangkai Wu", "Yiqun Duan", "Mingkai Zheng", "Taotao Cai"], "brief": "", "categories": ["cs.LG", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05732", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05732v1", "published_at": "2026-10-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PACMI: Provenance-Aware Cascading Memory Invalidation for Long-Term LLM Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents are increasingly built for medical work and scored on clinical benchmarks. Each such score, however, comes from a model running inside an agent harness, the system that controls the loop between the model and its environment. An agent\u0027s score is therefore a property of a model--harness pair. For medical agents, how much outcomes change with the harness has rarely been measured. Measuring this change, and explaining it, raises two challenges. First, a harness comparison must change nothing but the harness and be repeated across models and kinds of task. Second, comparing whole harnesses leaves their mechanisms bundled together, so it cannot show when an individual mechanism helps. To address these challenges, we present MedicalHarness, a controlled study of models and agent harnesses on medical tasks. We first build MedicalHarnessBench to evaluate agents on $107$ tasks across four domains that each test a different harness capability. Using this benchmark, we run five open-weight models under five agent harnesses, changing only the harness within a comparison, and analyze both outcomes and execution traces. To study individual mechanisms, we build MH-Lab, a controlled harness that switches off context management, planning or tool exposure one at a time within a shared execution loop. We find that the harness and its interaction with the model account for about a quarter of the outcome variance, and that no single harness is best across models and tasks. Code and data are available at https://github.com/REAL-Lab-NU/MedicalHarness.", "arxiv_id": "2610.05778", "arxiv_url": "https://arxiv.org/abs/2610.05778", "authors": ["Ziqing Wang", "Lili Zhao", "Kaize Ding"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05778", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05778v1", "published_at": "2026-10-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MedicalHarness: A Controlled Evaluation of LLMs and Agent Harnesses on Medical Tasks", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Graphical User Interface (GUI) agents have emerged as a promising paradigm for automating complex digital workflows across diverse applications. However, training highly capable and generalizable agents fundamentally relies on massive, high-fidelity visual-action trajectories, which are notoriously difficult to acquire. While human demonstrations are unscalable, existing GUI world models rely on text descriptions or HTML rendering, discarding crucial pixel-level visual details like icons and layout styles. To address this issue, we introduce Infinite-Dreamer, a simulation-free data synthesis method powered by a pixel-level Image Editing World Model. By conceptualizing GUI transitions as image editing tasks, we leverage Vision-Language Models (VLMs) to describe action-induced UI changes as structured delta-text. We then fine-tune an image editing backbone to controllably synthesize realistic screenshot transitions. We utilize this model to generate both single-frame visual robustness data and multi-step imaginary trajectories. To validate the effectiveness of our approach, we fine-tune the Qwen3-VL baseline solely on the synthesized data to obtain Infinite-Actor, and evaluate it on AndroidWorld, MobileWorld, and AndroidControl-Curated benchmarks. Infinite-Actor consistently outperforms the Qwen3-VL baselines across scales: Infinite-Actor-8B improves AndroidWorld Pass@1 by +4.45 and nearly doubles the MobileWorld Pass@3 success rate, while Infinite-Actor-2B improves Pass@1 by +9.05. Code is available at https://github.com/swaydy-n/Infinite-Dreamer.", "arxiv_id": "2610.05861", "arxiv_url": "https://arxiv.org/abs/2610.05861", "authors": ["Yongxin Ning", "Runliang Niu", "Qianli Xing", "Zhiyi Duan", "Qingzu He", "Pan Wang", "Qi Wang"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05861", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05861v1", "published_at": "2026-10-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Imagine to Act: High-Fidelity Data Synthesis via Image Editing World Model for Scalable GUI Agent Training", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Image and video diffusion models allocate equal computation to every region, even when the intended scene calls for varying levels of detail. The spatial distribution of detail can often be anticipated before generation, indicating where computation can be reduced. We introduce Level-of-Token (LoT) Diffusion, a framework that turns this knowledge into an explicit multiresolution token layout (Level-of-Token layout) for adaptive and efficient generation. Tokens represent rectangular patches of varying sizes and shapes, allocating finer tokens where detail is needed and coarser tokens elsewhere. We adapt pretrained diffusion transformers to LoT layouts through a patch-wise asymmetric flow parametrization and embeddings for multiresolution tokens, preserving full-resolution flow prediction at every denoising step while processing only a reduced token sequence. LoT Diffusion enables layout-adaptive generation while preserving pretrained generative priors. We demonstrate LoT with layouts derived from semantic masks, bounding boxes, texture variance, and depth-of-field cues, as well as agentic plans. Across image and video generation, LoT offers favorable quality-efficiency tradeoffs, with significant speedups determined by the layout\u0027s token budget. Our project website is at https://georgenakayama.github.io/lotdiffusion/.", "arxiv_id": "2610.05816", "arxiv_url": "https://arxiv.org/abs/2610.05816", "authors": ["Kiyohiro Nakayama", "Brian Chao", "Jan Ackermann", "Hansheng Chen", "Federico Tombari", "Leonidas Guibas", "Lior Yariv", "Gordon Wetzstein"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05816", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05816v1", "published_at": "2026-10-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Level-of-Token Diffusion", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A video assistant must speak when its instruction warrants a response and stay silent otherwise. We introduce a benchmark that evaluates this decision for the complete system of model, memory, and response controller. InteractionBench covers query responses, event triggers, and ongoing updates in 1,060 interactions over 812 videos, with 69 negative streams and 53 suites that pair counted events with look-alike near misses. It scores content accuracy, timing accuracy, and silence compliance on the video clock. Timely speech costs silence across systems. Polled Qwen3-VL-8B reaches 77.8 timing accuracy but 10.9 silence compliance. A native real-time interaction system reaches 29.2 silence compliance at 66.8 timing accuracy, yet emits on 89.9% of negative streams. No open-weight system clears a third of the near-miss suites. Fewer replies help only when chosen, as random deletion merely trades timing for silence. Offline scores miss these failures and mispredict online behavior. Adding restraint is costly, as the native system\u0027s controller adds little by itself and agentic systems add it only at about 30 s per poll.Project page: https://www.enxinsong.com/projects/interactionbench/ Code: https://github.com/Espere-1119-Song/InteractionBench Data: https://huggingface.co/datasets/InteractionBench/InteractionBench", "arxiv_id": "2610.05775", "arxiv_url": "https://arxiv.org/abs/2610.05775", "authors": ["Enxin Song", "Suhao Yu", "Yifei Xu", "Barbara Su", "Weili Xu", "Wenhao Chai", "Yao Tang", "Jie Deng", "Haiyang Xu", "Jiatao Gu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05775", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05775v1", "published_at": "2026-10-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "InteractionBench: A Real-Time Interaction Benchmark for Streaming Video Systems", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing Simulink benchmarks mainly evaluate whether generated models compile, execute, or resemble a reference model. These criteria do not establish whether a model satisfies its engineering requirements. We introduce SimuVerity, a benchmark of 101 text-to-executable Simulink model-generation tasks across ten engineering domains. For each task, executable-system profiles ground the engineering specification and four families of native simulation scenarios. A hierarchical evaluator first checks artifact delivery, native executability, and engineering qualification, then scores qualified models across six dimensions covering accuracy, output quality, mechanistic fidelity, control and causal integrity, operating-domain robustness, and dynamic response. We evaluate six agent systems with SimuVerity. The best system achieves an overall score of only 42.86. The results show that structural similarity is a poor proxy for engineering performance: capability bottlenecks arise both in producing qualified implementations and in satisfying multidimensional requirements after qualification. Meanwhile, some high-scoring models still exhibit severe visual-layout disorder. SimuVerity provides a systematic basis for assessing agents\u0027 engineering capabilities and diagnosing failures in executable Simulink model generation.", "arxiv_id": "2610.02304", "arxiv_url": "https://arxiv.org/abs/2610.02304", "authors": ["Ruiqi Zhang", "Jiahao Wang", "Mingxuan Li", "Haichen Luo", "Chaoting Wang", "Guoyu Mou", "Keyu Lai", "Hanchao Lv", "Jiaxu Wang", "Yibo Zheng", "Aijun Yang", "Xiaohua Wang"], "brief": "", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": "https://github.com/SimuVerity/SimuVerity", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2610.02304", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Xi\u0027an Jiaotong University", "pdf_url": "https://arxiv.org/pdf/2610.02304v1", "published_at": "2026-10-01", "score": 0.134, "selected_reasons": ["HF trending (46\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.02304.png", "title": "SimuVerity: Benchmarking Agents for Engineering-Grade Simulink Model Generation", "tldr": null, "upvotes": 46, "what_it_is": null, "why_notable": null}, {"abstract": "AI-generated content, often called AI slop, is increasingly common everywhere, particularly in academia. Slop in AI-generated scientific papers, however, has more complex patterns that cannot be easily detected by existing token-based AI detectors. Each part of such a paper looks plausible while the scientific reasoning that connects the parts breaks down, which can mislead how readers assess the work. We benchmark these failures as scientific slop through six measures across Structure, Argument, and Artifacts. We construct SciSlopBench with 390 AI-generated papers, mostly in computer science but spanning the life, social, and natural sciences, each paired with a human-written paper matched by research problem and contribution type. Our measures identify the AI paper in each pair with 85.9% accuracy, compared with 68.7% for Binoculars. Higher scientific slop accompanies lower ICLR ratings and distinguishes rejected from accepted papers above chance in every year from 2017 to 2025. Reducing these patterns, however, is not as simple as directly optimizing the measures. We therefore propose SciSlopHarness, a harness-level framework that guides a fixed LLM to revise slop only where the experiment records support the change. While standard revisions leave residual slop and direct slop-aware prompting triggers reward hacking, SciSlopHarness reduces the remaining AI-human gap by 63% over the strongest revision baseline without requiring human reference targets. Overall, we demonstrate that AI-generated scientific papers leave fundamental traces in their global reasoning, and that responsible mitigation demands strict evidentiary grounding rather than mere prose refinement.", "arxiv_id": "2610.00531", "arxiv_url": "https://arxiv.org/abs/2610.00531", "authors": ["Yerim Oh", "Young-Jun Lee", "Jaewoo Ahn", "Gunhee Kim", "Dongyeop Kang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/yerimoh/ScientificSlop", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2610.00531", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Seoul National University", "pdf_url": "https://arxiv.org/pdf/2610.00531v1", "published_at": "2026-09-30", "score": 0.132, "selected_reasons": ["HF trending (50\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.00531.png", "title": "Science or Slop?: Benchmarking and Mitigating Scientific Slop in AI-Generated Papers", "tldr": null, "upvotes": 50, "what_it_is": null, "why_notable": null}, {"abstract": "Physical trajectories contain more than snapshots of a system: they also reveal how its states evolve under governing conditions. However, representation learning for parametric partial differential equations (PDEs) has largely relied on reconstruction-based objectives that emphasize recovering observed physical fields. In this paper, we investigate predictive representation pretraining as an alternative to reconstruction-based learning. We find that predictive representations preserve rich physical information, yet this advantage alone does not ensure accurate field evolution. Based on these observations, we introduce PDE-JEPA for parametric PDE dynamics. Specifically, we first train an encoder using a masked-latent prediction to capture the underlying regularities of PDE dynamics. To explicitly adapt the pretrained representation toward a more dynamics-aligned state space, we then introduce a geometry projector that aligns latent trajectory geometry with the evolution geometry of physical fields. Finally, building on this geometry-aligned latent space, we further develop a physics-structured latent predictor that decomposes the dynamics into parameter-independent evolution and parameter-dependent response components. Extensive experiments on nine widely used PDE benchmarks demonstrate that our framework outperforms existing state-of-the-art methods by an average of 33.4\\% in-distribution, while achieving an average improvement of 51.4\\% when extrapolating to unseen governing parameters. The project page is available \\href{https://tanpig-x.github.io/PDE-JEPA/}{here}.", "arxiv_id": "2609.34715", "arxiv_url": "https://arxiv.org/abs/2609.34715", "authors": ["Zhentao Tan", "Jianrong Zhang", "Ruijie Quan", "Yi Yang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/Tanpig-X/PDE-JEPA", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2609.34715", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2609.34715v1", "published_at": "2026-09-28", "score": 0.128, "selected_reasons": ["HF trending (51\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34715.png", "title": "PDE-JEPA: Predictive Representation Learning of Latent Dynamics Modeling for Parametric PDEs", "tldr": null, "upvotes": 51, "what_it_is": null, "why_notable": null}, {"abstract": "Long-video generation and world models have shown strong potential for interactive entertainment and embodied simulation by predicting future observations conditioned on user actions and historical memory. However, as memory sequences grow longer and their structures become increasingly complex, managing long-range spatial context becomes increasingly challenging, calling for a more intelligent and systematic memory-management strategy. Building on the advancing spatial reasoning capabilities of multimodal large language models (MLLMs) and the broader vision of unified models, we propose Spatial Memory Intelligence (SMI), the first framework to systematically employ an understanding model for spatial-memory management in long-video world models. SMI introduces four coordinated atomic operations: spatial clustering, within-cluster sparsification, action-aware retrieval, and reliability-aware filtering. Extensive experiments across multiple baselines, benchmarks, and world-model backbones demonstrate the effectiveness and generalizability of SMI, achieving comprehensive improvements in memory sparsity, generation stability, and spatial consistency.", "arxiv_id": "2610.02521", "arxiv_url": "https://arxiv.org/abs/2610.02521", "authors": ["Ying Yang", "Guiyu Zhang", "Lianghua Huang", "Chang Nie", "Chenyang Si", "Haofan Wang", "Shaoshuai Shi", "Li Jiang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/xbyym/SMI", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2610.02521", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.02521v1", "published_at": "2026-10-01", "score": 0.128, "selected_reasons": ["HF trending (42\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.02521.png", "title": "Spatial Memory Intelligence: Endowing World Models with Understanding-Driven Long-Term Memory", "tldr": null, "upvotes": 42, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) trains a student on the responses it generates. Existing LLM multi-teacher OPD transfers what specialists predict through their output distributions. We introduce Latent-MOPD, to our knowledge the first representation-level multi-teacher OPD method for LLMs. It integrates existing specialists through both their predictions and the hidden states used to compute them, without additional teacher training. To coordinate representation supervision from multiple specialists, we select late-layer targets according to the teacher-student relationship, bridge unequal hidden widths with a shared projection, and group updates by domain. Each teacher\u0027s supervision gradually shifts from hidden states to token predictions, with both channels using the same routed specialist. In our main same-family setting, Latent-MOPD outperforms the token-only, representation-only and uniform-averaging baselines on all nine benchmarks across math, code and logic. With the same parameter count as each teacher, the student also surpasses the per-benchmark best teacher on a majority of these benchmarks. With larger, separately developed cross-family teachers, Latent-MOPD outperforms both single-channel baselines on all benchmarks. A same-family all-layer representation-only control remains stable with domain-pure updates but collapses when teacher domains are interleaved within an update. Our results show that a single student can integrate capabilities from several specialists through both their output distributions and internal representations.", "arxiv_id": "2610.02381", "arxiv_url": "https://arxiv.org/abs/2610.02381", "authors": ["Zhengyu Fang", "Seoyeon Hong", "Jie Yang", "Muyang Li", "Koyoshi Shindo", "Brandon Joseph Lwowski", "Jing Li"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.02381", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Zillow", "pdf_url": "https://arxiv.org/pdf/2610.02381v1", "published_at": "2026-10-01", "score": 0.111, "selected_reasons": ["HF trending (54\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.02381.png", "title": "Latent-MOPD: Latent Multi-Teacher On-Policy Distillation", "tldr": null, "upvotes": 54, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce HyperBrowseComp, a multilingual and multimodal browsing benchmark comprising 423 manually authored and human-validated questions across 13 languages, written by native or highly proficient speakers. Questions are designed to be extremely challenging. Each question targets a concise, publicly verifiable answer whose discovery requires locating obscure evidence, following multi-step clue chains, or inspecting heterogeneous sources such as videos, scanned documents, images, or maps. Easier questions are filtered out by evaluating them with models without internet access to reduce the likelihood that they can be answered with parametric knowledge alone. We evaluate several models using provider-native search and a shared external retrieval harness under a common agent protocol. To contextualize model performance and effort, we also conduct a human evaluation on a sample of the questions. HyperBrowseComp provides a challenging testbed for persistent information seeking across languages and evidence modalities, with difficulty arising from discovering and connecting evidence on the open web.", "arxiv_id": "2610.03574", "arxiv_url": "https://arxiv.org/abs/2610.03574", "authors": ["Alham Fikri Aji", "Faiz Rizki Ramadhan", "Zayd M. K. Zuhri", "Seung Hun Eddie Han", "Ryandito Diandaru", "Qinrong Cui", "Jan Christian Blaise Cruz", "Badrinath Chandana", "Peerawat Chomphooyod", "Ahmed Attia", "Jonibek Mansurov", "Emilio Villa-Cueva", "Canh Duong Nguyen", "Imran Turganov", "Minghao Wu", "Peerat Limkonchotiwat", "Irina Nikishina"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.03574", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2610.03574v1", "published_at": "2026-10-02", "score": 0.11, "selected_reasons": ["HF trending (51\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.03574.png", "title": "HyperBrowseComp: A Multilingual and Multimodal Stress Test for Web-Browsing Agents", "tldr": null, "upvotes": 51, "what_it_is": null, "why_notable": null}, {"abstract": "Pretrained generative Diffusion Transformers (DiTs) capture rich pixel-level visual and language-conditioned structure through large-scale image and video generation training. A growing line of robot policies builds on this generative prior, but how it should be transferred to control remains unclear, and existing approaches commonly instantiate this transfer through future visual prediction. We ask a more basic question: what a pretrained generative DiT actually contributes to action learning, and how this prior should be adapted for control. We introduce NowWAM, a future-target-free co-training formulation that denoises the current observation and predicts robot actions from the same visual stream, directly coupling the native generative objective to the action-facing representation across the denoising trajectory. Under matched controlled settings, past and future visual targets perform comparably, while restricting training to the clean endpoint substantially reduces robustness, suggesting that a separate future target is not essential for generative adaptation, while the denoising trajectory remains an effective interface for control. On LIBERO-Plus, NowWAM reaches 87.7% with FLUX2-Klein, improving over the future-target co-training baseline by 6.1 points while halving training visual tokens (784 to 392) and reducing step time from 2.85 s to 1.63 s, a 1.8x speedup. With the pure text-to-image Z-Image backbone, NowWAM further reaches 87.8%, showing that strong control adaptation is not tied to video generation or image-editing backbones.", "arxiv_id": "2609.28339", "arxiv_url": "https://arxiv.org/abs/2609.28339", "authors": ["Zanyi Wang", "Yuheng Lei", "Dengyang Jiang", "Ping Luo", "Mengdi Wang", "Zhixuan Liang", "Shilong Liu"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/xmz111/NowWAM", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2609.28339", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28339v1", "published_at": "2026-09-23", "score": 0.109, "selected_reasons": ["HF trending (23\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.28339.png", "title": "Beyond Future Prediction: Denoising as Generative Adaptation for Robot Control", "tldr": null, "upvotes": 23, "what_it_is": null, "why_notable": null}, {"abstract": "Existing online video segmentation methods struggle to track objects in long, complex videos with long-term occlusions. We hypothesize that this limitation is caused by (i) the inability of their temporal propagation mechanism to adaptively select the object information that is propagated across time, and (ii) their inability to be trained on long videos due to memory requirements and vanishing gradients. To address the first limitation, we propose to use a lightweight GRU-based temporal propagation module that can learn to select which information it keeps in memory and propagates across time. Second, to allow training on long videos, we introduce Truncated Query Propagation (TQP), a training strategy in which the model processes a video in chunks of frames, where information about tracked objects is propagated between chunks but backpropagation is only conducted in individual chunks, enabling longer temporal supervision without out-of-memory issues, inference overhead, or vanishing gradients. The resulting model is called the Long-term Video Mask Transformer (LVMT). Extensive experiments on six benchmarks show that LVMT sets a new state of the art across a range of video segmentation tasks, while retaining the speed of the highly efficient model it is based on, making it 10X faster than the prior state of the art. Code: https://www.tue-mps.org/lvmt", "arxiv_id": "2609.34895", "arxiv_url": "https://arxiv.org/abs/2609.34895", "authors": ["Narges Norouzi", "Niccol\u00f2 Cavagnero", "Idil Esen Zulfikar", "Bastian Leibe", "Gijs Dubbelman", "Daan de Geus"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/tue-mps/lvmt", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2609.34895", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Mobile Perception Systems Lab", "pdf_url": "https://arxiv.org/pdf/2609.34895v2", "published_at": "2026-09-28", "score": 0.098, "selected_reasons": ["HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34895.png", "title": "LVMT: Video Mask Transformer for Long-term Video Segmentation", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) models generalize broadly across robotic manipulation tasks, but complex environments require balancing task success with unintended contact. Runtime shields can correct individual actions, but they leave the underlying policy unchanged, so repeated disagreements may create a persistent policy-shield mismatch that blocks task progress. To address this challenge, we introduce FailBank, a four-stage self-evolving framework that converts runtime feedback into persistent policy improvement. During collection, a fixed CBF-based safety module serves as an observe-only teacher, producing counterfactual corrections while the policy remains in control. Outcome-aware admission then converts useful proposals into corrective targets and retains successful uncorrected actions as quiet anchors for guarded LoRA updates. We evaluate FailBank on the VLA-Arena benchmark across two difficulty levels and two VLA backbones. Compared with the base policies, FailBank improves the joint success-cost operating point. Across the two backbones, FailBank improves task success rate by 8.5 and 6.9 percentage points, while reducing policy-induced cumulative cost by 35.6\\% and 23.8\\%, respectively. Compared with runtime shielding, FailBank raises task success rate by 25.4 and 9.5 percentage points, while maintaining comparable policy-induced cumulative cost. These results show that runtime feedback can serve as persistent policy supervision rather than only as a temporary action constraint.", "arxiv_id": "2609.39820", "arxiv_url": "https://arxiv.org/abs/2609.39820", "authors": ["Mingyue Cui", "Zheyuan Liu", "Yihan Zhu", "Zheyuan Zhang", "Meng Jiang"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/Mingyuee88/FailBank", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.39820", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "University of Notre Dame", "pdf_url": "https://arxiv.org/pdf/2609.39820v1", "published_at": "2026-09-30", "score": 0.087, "selected_reasons": ["HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.39820.png", "title": "Learning from Runtime Feedback through Failure-Bank Self-Evolution for Vision-Language-Action Models", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Policies with similar mean returns can differ sharply in rare failures, yet estimating lower-tail conditional value-at-risk (CVaR) accurately can require many costly rollouts. When different conditional components of a stochastic workflow can be queried separately, we ask how to allocate a fixed evaluation budget to estimate a fixed policy\u0027s CVaR most accurately. We derive a tail influence for each queryable conditional law that aggregates how its uncertainty affects CVaR across every Bellman reuse. Its variance yields the fixed-design efficiency bound and the oracle Neyman allocation. Tail-Influence Sampling (TIS) estimates these influence scales from a pilot model and reallocates fresh queries toward kernels that matter most for the tail; a visitation-anchored variant protects against pilot underallocation. Under fixed dimension and a positive quantile margin, TIS attains oracle asymptotic variance and first-order MSE including pilot cost, while the anchored variant is within a factor two of the oracle. We also characterize an exact-grid regime in which tail- and mean-optimal allocations coincide. On CliffWalking, TIS reduces MSE by 41% versus learned occupancy and 76% versus complete rollouts at the same charged transition budget. In frozen language-model review workflows, anchored TIS beats an equally regularized mean-influence blend in 23 of 24 MMLU-Pro settings and reaches 2.4-3.4$\\times$ lower MSE than rollouts on six-call FinQA reviews.", "arxiv_id": "2609.38096", "arxiv_url": "https://arxiv.org/abs/2609.38096", "authors": ["Pauline Bourigault", "Xiaotong Ji", "Matthieu Zimmer", "Rasul Tutunov", "Haitham Bou-Ammar"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/paulinebourigault/TIS", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.38096", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "HUAWEI Noah\u0027s Ark Lab", "pdf_url": "https://arxiv.org/pdf/2609.38096v1", "published_at": "2026-09-29", "score": 0.082, "selected_reasons": ["HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38096.png", "title": "Tail-Influence Sampling for CVaR Policy Evaluation", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Chain-of-thought (CoT) reasoning allows humans to inspect how large language models reach their answers, and oversee model behaviour. This reasoning comes at an increased inference cost, motivating efficient methods that train models to solve tasks using fewer tokens. However, a common concern is that such training may cause models to skip important reasoning steps, so the CoT no longer faithfully reflects the model\u0027s decision. It is unclear whether or when this occurs in practice, since different efficiency methods apply length pressure to models\u0027 CoT in distinct ways, and faithfully explaining a model\u0027s decision takes more tokens on some tasks than others. To understand these dynamics, we fine-tune a variety of models with three methods that apply length pressure differently, namely a fixed generation budget, a per-example length target, and a group-relative length reward. We evaluate how efficient reasoning affects CoT faithfulness (i.e., how well the CoT reflects model decisions on related inputs) and monitorability (i.e., whether the CoT reveals when input interventions alter the output). We find that it affects faithfulness and monitorability differently. Faithfulness falls in most settings, primarily because the trained models are less consistent. Monitorability is more robust, as models keep acknowledging the influence on their answer even when the CoT is much shorter.", "arxiv_id": "2610.03509", "arxiv_url": "https://arxiv.org/abs/2610.03509", "authors": ["Samuel Lewis-Lim", "Xingwei Tan", "Mario Sanger", "Zhixue Zhao", "Nikolaos Aletras"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.03509", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.03509v1", "published_at": "2026-10-02", "score": 0.076, "selected_reasons": ["HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.03509.png", "title": "Efficient Reasoning Training Does Not Always Harm CoT Faithfulness and Monitorability", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-based factuality evaluation, where LLM-generated claims are verified against evidence from authoritative medical corpora, has become the dominant paradigm for scalable hallucination detection in high-stakes clinical settings. Despite the urgency of reliable and transparent medical fact verification, most systems measure performance with aggregate metrics like F1, which obscure where and why failures occur. Existing RAG diagnostics require gold answers or annotated gold evidence, neither of which exists in this regime. We introduce two comprehensive taxonomies, grounded in a case study on the open-ended MedExpert dataset and 3 closed-ended datasets, decomposing failures into retrieval-stage errors along five quality dimensions, and verifier-reasoning errors into six consecutive steps. We adapt an automatic pattern induction pipeline using LLM-as-Judge to label evidence quality and classify verifier reasoning errors at scale, and then stress-test our findings across 4 retrieval methods and 6 frontier verifier models. Our analysis reveals that scaling model size, adding reasoning effort, expanding to authoritative web sources, and applying medical fine-tuning do not resolve these failure modes, demonstrating that they represent fundamental limitations of the retrieve-then-verify paradigm in open-ended medical settings rather than artifacts of outdated systems. We release our code and data at https://anonymous.4open.science/r/Medical_RAG_eval-4AB5 for the full reproducibility of our results.", "arxiv_id": "2609.30467", "arxiv_url": "https://arxiv.org/abs/2609.30467", "authors": ["Heyuan Huang", "Jirui Dai", "Alexandra DeLucia", "Sonal Joshi", "Mahsa Yarmohammadi", "Jie Gao", "Bernal Jim\u00e9nez Guti\u00e9rrez", "Mark Dredze"], "brief": "", "categories": ["cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.30467", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Center for Language and Speech Processing @ JHU", "pdf_url": "https://arxiv.org/pdf/2609.30467v1", "published_at": "2026-09-24", "score": 0.072, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.30467.png", "title": "Where Does Retrieval-Based Open-Ended Evaluation Fail? Automatic Taxonomy Induction from Long-Form Medical Answer Factuality Verification", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Efficient long-video understanding with vision-language models (VLMs) is often framed as selecting informative frames or visual tokens at a fixed native resolution. We show that per-frame resolution can instead be traded for denser temporal coverage, while front-end decoding latency depends on the size of the candidate pool rather than the final token budget. An empirical study across multiple VLMs and long-video benchmarks yields three findings: dense low-resolution sampling outperforms sparse native-resolution sampling at matched token budgets; resolution-sensitive tasks benefit from selected high-resolution frames; and front-end decoding dominates wall time for hour-long videos. Motivated by these findings, we introduce LoHi, a training-free, single-pass framework that combines a dense low-resolution video stream with sparse high-resolution image frames through the VLM\u0027s native video and image pathways. LoHi-Anchor selects high-resolution frames using codec I-frame metadata, while LoHi-SemDiv uses query relevance and visual diversity over CLIP features. Across three long-video benchmarks, LoHi improves average accuracy by 10.6 percentage points over the native-resolution baseline at a matched token budget and by 5.2 percentage points over the strongest prior efficiency method. It also reduces front-end decoding latency by up to 7x on hour-long videos. Project page: https://sixundong.com/projects/lohi", "arxiv_id": "2610.04318", "arxiv_url": "https://arxiv.org/abs/2610.04318", "authors": ["Sixun Dong", "Wei Li", "Andong Deng", "Qi Qian", "Victor Zhu", "Zhengping Ji", "Chen Chen"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.04318", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "University of Central Florida", "pdf_url": "https://arxiv.org/pdf/2610.04318v1", "published_at": "2026-10-03", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04318.png", "title": "Rethinking Long-Video Efficiency: A Joint Allocation Perspective on Frames, Pixels, and Front-End Latency", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A long-standing goal of AI is a model that can continually learn and improve itself. On post-trained models, supervised finetuning (SFT) on new data often causes poor generalization and catastrophic forgetting. As such, the conventional wisdom is that on-policy training is a prerequisite for continual learning. In practice, however, data containing new knowledge or capabilities are often off-policy. While methods such as on-policy self-distillation (OPSD) try to bridge this gap by converting off-policy data into on-policy signal, they have been shown to cause reasoning collapse. In this paper, we show that off-policy merging beats OPSD for continual learning. We first show that SFT learns a useful signal from new data, but naively applying its update interferes with existing capabilities. We reduce this interference with a simple recipe we term grafting, which changes where the update is learned and how it is applied: (1) learning the update on an earlier donor checkpoint, ideally even before the end of pretraining, and applying the weight update to the post-trained model; (2) scaling the weight update, equivalent to a form of model merging; and (3) optionally, masking the most sensitive update directions when the new data distribution is far from the post-trained model. Across continual learning settings including (1) distilling from expert traces, (2) self-improvement with STaR and Pedagogical RL, and (3) injecting knowledge after pretraining cutoff, grafting Pareto-dominates both SFT and OPSD in new-task and old-task performance, while avoiding expensive on-policy sampling. Therefore, our work challenges on-policy training as a necessity for continual learning on RL-trained models.", "arxiv_id": "2610.05872", "arxiv_url": "https://arxiv.org/abs/2610.05872", "authors": ["Chen Henry Wu", "Thomas Zhang", "Aditi Raghunathan"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05872", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05872v1", "published_at": "2026-10-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Off-Policy Merging Beats On-Policy Self-Distillation for Continual Learning", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper studies online quantile regression for large-scale and streaming data using Stochastic SubGradient Descent (SSGD) with constant learning rates. Classical offline inference for quantile regression is computationally and memory intensive. Existing works of online inference for quantile regression provide only asymptotic guarantees and typically require sub-exponential tail conditions for distribution theory. To bridge these gaps, we introduce new techniques to prove a quenched central limit theorem (CLT) and finite-sample Gaussian approximation for SSGD under a finite-moment assumption. We further show that Ruppert-Polyak averaging with a constant learning rate has a non-vanishing bias and fails to satisfy CLT centering at the population target. Hence we propose suffix averaging to address this issue and establish its finite-sample Gaussian approximation. Based on these results, we provide an efficient online inference method for quantile regression that avoids covariance estimation. Numerical experiments show that our method achieves desirable empirical coverage rates and competitive performance compared to other inference methods. We also apply our approach to U.S. wage data to demonstrate its practical effectiveness.", "arxiv_id": "2610.05869", "arxiv_url": "https://arxiv.org/abs/2610.05869", "authors": ["Ziyang Wei", "Jiaqi Li", "Lan Wang", "Wei Biao Wu"], "brief": "", "categories": ["stat.ML", "cs.LG", "math.ST", "stat.ME"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05869", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05869v1", "published_at": "2026-10-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Finite-Sample Distribution Theory and Efficient Large-Scale Inference for Online Quantile Regression", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "High-quality child care in early life is a critical determinant of children\u0027s growth and development. Research on child care quality has been constrained by fragmented, non-research-friendly, and privacy-bound datasets. We present CCQ (Child Care Quality), a large-scale, de-identified dataset for applied data science research at the intersection of AI and early childhood health. CCQ integrates 59,372 child care provider records across 12 U.S. states, covering diverse provider types as well as data schemas. To ensure research utility while protecting privacy, we implement an automated, LLM-based curation pipeline that anonymizes, cleans, and standardizes raw state records into two complementary releases: a cleaned textual release and a fully preprocessed tabular release. We also benchmark traditional machine learning models, tabular foundation models, and language models on quality rating prediction and important features analytics. Within a state, tabular classifiers on the preprocessed tables perform best. Across states, zero-shot transfer is near chance, but modest target-state supervision recovers most of the within-state performance, and pretraining on other states benefits finetuned language models. We release both datasets with all code to accelerate AI-driven research on child care quality and ultimately improve children\u0027s health and development.", "arxiv_id": "2610.05863", "arxiv_url": "https://arxiv.org/abs/2610.05863", "authors": ["Victor Li", "Yuzhang Xie", "Ziwei Dong", "Qingyang Zhu", "Wenjing Ma", "Carl Yang", "Jinbing Bai", "Huiwen Xu", "Jiaying Lu"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05863", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05863v1", "published_at": "2026-10-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CCQ: A Multi-State Child Care Quality Dataset to Support AI for Children\u0027s Health Research", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Triangular attention is a core computation in AlphaFold3-style biomolecular models, with cubic cost in token count. Its shared pair bias adds a gradient reduction across attention slices to the usual reductions over queries and keys. The open-source backends we examine handle these reductions through repeated probability recomputation, floating-point atomics, or full score-gradient storage. Separately, computing the softmax backward correction from BF16-rounded forward outputs loses numerical precision. We present TurboPairFormer, a triangular attention implementation for NVIDIA Hopper GPUs that addresses both issues. Our key-tile-parallel backward algorithm recomputes each probability tile once for the query, key, value, and pair-bias gradients, using ordered partial reductions for deterministic accumulation without floating-point atomics or full score-gradient storage. Output-residual compensation retains a BF16 approximation of the output-rounding residual to compute the backward correction more accurately in FP32, without changing the BF16 output. With BF16 inputs at crop sizes 384, 640, and 768 and head dimensions 16 and 32, TurboPairFormer achieves the lowest mean query, key, and pair-bias gradient RMSE against an FP64 reference among the implementations compared in this paper. Residual compensation reduces these RMSE values by 28-47% in controlled ablations. All four gradients are bitwise identical across five repeated calls in all 600 input cases under fixed execution conditions. Integrated into OpenFold3 with our triangle multiplication kernels, TurboPairFormer achieves the lowest GPU computation time per optimizer step among the evaluated backend configurations on 16 H100 GPUs, with speedups of $1.73\\times$ over OpenFold3\u0027s Triton backend and $1.13\\times$ over cuEquivariance at crop size 768.", "arxiv_id": "2610.05854", "arxiv_url": "https://arxiv.org/abs/2610.05854", "authors": ["Yide Ran", "Chelsea Lowman", "Jan Doma\u0144ski", "David Hartmann", "Jenke Scheen", "Jennifer Wei", "Chuan Li", "Jianwen Xie", "Zhaozhuo Xu"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05854", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05854v1", "published_at": "2026-10-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TurboPairFormer: Fast and Stable Protein Folding Model Training with an Optimized Triangle Attention Kernel", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Monitoring concept drift from an adaptive classifier\u0027s error stream creates an operational conflict with the model\u0027s own update loop. When internal adaptation outpaces evidence accumulation, accuracy recovers before cumulative detectors (CUSUM, Page-Hinkley) can reach threshold. Instrumenting an Adaptive Random Forest (ARF) shows that surviving trees absorb 98.6% of the post-drift error transient through incremental leaf updates alone. The first background tree swap accounts for just 0.71% of this erased error volume, but drops external detection rates by 31 percentage points. We derive the finite-horizon boundary where cumulative evidence fails to cross threshold and measure a critical magnitude floor ($\u0394e_c = 0.120$) below which false-alarm budgets preclude detection. This failure manifests as missed shifts on stationary streams and false-alarm flooding triggered by internal tree swaps on noisy baselines. We validate on synthetic shifts, ARMA-GARCH series (ProteuS), and tabular benchmarks (BAF, INSECTS); on the synthetic sweep at a standard threshold, the blind spot appears at $\u0394e \\approx 0.25$, showing why classical benchmarks like SEA ($\u0394e \\le 0.21$) failed to reach it.", "arxiv_id": "2610.05853", "arxiv_url": "https://arxiv.org/abs/2610.05853", "authors": ["Rapha\u00ebl Minato", "Fabrice Popineau", "Arpad Rimmel", "Bich-Li\u00ean Doan"], "brief": "", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05853", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05853v1", "published_at": "2026-10-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Blind Spot Paradox: When Adaptive Classifiers Defeat Drift Detectors", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frozen representations are widely reused for downstream classification, yet each new task typically requires fitting a new predictor. We ask whether the few-shot prediction procedure itself can instead be learned once and reused across datasets and representation spaces. To study this question, we introduce RepShiftBench, comprising 1,218 encoder--dataset tasks across text, image, and audio, with separate evaluation of generalization to unseen datasets, unseen encoders, jointly unseen datasets and encoders, and unseen modalities. The benchmark exposes a substantial gap: Logistic Regression fitted independently on each episode outperforms every evaluated in-context learner across all settings. We introduce RepICL, a meta-trained in-context learner that canonicalizes each episode through episodic whitening before prediction. Its inductive variant, RepICL-I, surpasses Logistic Regression in all 12 benchmark settings, while RepICL-T substantially outperforms existing transductive methods. Ablations identify episodic whitening as the primary source of these gains, while showing that it is not a universally beneficial preprocessing step. Across both variants, the gains concentrate on queries
